csb[1] = "He said to me: &quot;Son of man, eat what you find here. Eat this scroll, then go and speak to the house of Israel.&quot;";
csb[2] = "So I opened my mouth, and he fed me the scroll.";
csb[3] = "&quot;Son of man,&quot; he said to me, &quot;feed your stomach and fill your belly with this scroll I am giving you.&quot; So I ate it, and it was as sweet as honey in my mouth.";
csb[4] = "Then he said to me: &quot;Son of man, go to the house of Israel and speak my words to them.";
csb[5] = "&quot;For you are not being sent to a people of unintelligible speech or a difficult language but to the house of Israel --";
csb[6] = "&quot;not to the many peoples of unintelligible speech or a difficult language, whose words you cannot understand. No doubt, if I sent you to them, they would listen to you.";
csb[7] = "&quot;But the house of Israel will not want to listen to you because they do not want to listen to me. For the whole house of Israel is hardheaded and hardhearted.";
csb[8] = "&quot;Look, I have made your face as hard as their faces and your forehead as hard as their foreheads.";
csb[9] = "&quot;I have made your forehead like a diamond, harder than flint. Don\'t be afraid of them or discouraged by the look on their faces, though they are a rebellious house.&quot;";
csb[10] = "Next he said to me: &quot;Son of man, listen carefully to all my words that I speak to you and take them to heart.";
csb[11] = "&quot;Go to your people, the exiles, and speak to them. Tell them, \'This is what the Lord GOD says,\' whether they listen or refuse to listen.&quot;";
csb[12] = "The Spirit then lifted me up, and I heard a loud rumbling sound behind me -- bless the glory of the LORD in his place! --";
csb[13] = "with the sound of the living creatures\' wings brushing against each other and the sound of the wheels beside them, a loud rumbling sound.";
csb[14] = "The Spirit lifted me up and took me away. I left in bitterness and in an angry spirit, and the LORD\'s hand was on me powerfully.";
csb[15] = "I came to the exiles at Tel-abib, who were living by the Chebar Canal, and I sat there among them stunned for seven days.";
csb[16] = "Now at the end of seven days the word of the LORD came to me:";
csb[17] = "&quot;Son of man, I have made you a watchman over the house of Israel. When you hear a word from my mouth, give them a warning from me.";
csb[18] = "&quot;If I say to the wicked person, \'You will surely die,\' but you do not warn him -- you don\'t speak out to warn him about his wicked way in order to save his life -- that wicked person will die for his iniquity. Yet I will hold you responsible for his blood.";
csb[19] = "&quot;But if you warn a wicked person and he does not turn from his wickedness or his wicked way, he will die for his iniquity, but you will have rescued yourself.";
csb[20] = "&quot;Now if a righteous person turns from his righteousness and acts unjustly, and I put a stumbling block in front of him, he will die. If you did not warn him, he will die because of his sin, and the righteous acts he did will not be remembered. Yet I will hold you responsible for his blood.";
csb[21] = "&quot;But if you warn the righteous person that he should not sin, and he does not sin, he will indeed live because he listened to your warning, and you will have rescued yourself.&quot;";
csb[22] = "The hand of the LORD was on me there, and he said to me, &quot;Get up, go out to the plain, and I will speak with you there.&quot;";
csb[23] = "So I got up and went out to the plain. The LORD\'s glory was present there, like the glory I had seen by the Chebar Canal, and I fell facedown.";
csb[24] = "The Spirit entered me and set me on my feet. He spoke with me and said: &quot;Go, shut yourself inside your house.";
csb[25] = "&quot;As for you, son of man, they will put ropes on you and bind you with them so you cannot go out among them.";
csb[26] = "&quot;I will make your tongue stick to the roof of your mouth, and you will be mute and unable to be a mediator for them, for they are a rebellious house.";
csb[27] = "&quot;But when I speak with you, I will open your mouth, and you will say to them, \'This is what the Lord GOD says.\' Let the one who listens, listen, and let the one who refuses, refuse -- for they are a rebellious house.";

kjv[18] = "When I say unto the wicked, Thou shalt surely die; and thou givest him not warning, nor speakest to warn the wicked from his wicked way, to save his life; the same wicked [man] shall die in his iniquity; but his blood will I require at thine hand.";

dby[18] = "When I say unto the wicked, Thou shalt certainly die; and thou givest him not warning, nor speakest to warn the wicked from his wicked way, that he may live: the same wicked [man] shall die in his iniquity; but his blood will I require at thy hand.";

hnv[18] = "When I tell the wicked, You shall surely die; and you give him no warning, nor speak to warn the wicked from his wicked way, to save his life; the same wicked man shall die in his iniquity; but his blood will I require at your hand.";

web[19] = "Yet if thou shalt warn the wicked, and he shall not turn from his wickedness, nor from his wicked way, he shall die in his iniquity; but thou hast delivered thy soul.";
hnv[19] = "Yet if you warn the wicked, and he doesn\'t turn from his wickedness, nor from his wicked way, he shall die in his iniquity; but you have delivered your soul.";
vul[19] = "si autem tu adnuntiaveris impio et ille non fuerit conversus ab impietate sua et via sua impia ipse quidem in iniquitate sua morietur tu autem animam tuam liberasti";
kjv[20] = "Again, When a righteous [man] doth turn from his righteousness, and commit iniquity, and I lay a stumblingblock before him, he shall die: because thou hast not given him warning, he shall die in his sin, and his righteousness which he hath done shall not be remembered; but his blood will I require at thine hand.";
rsv[20] = "Again, if a righteous man turns from his righteousness and commits iniquity, and I lay a stumbling block before him, he shall die; because you have not warned him, he shall die for his sin, and his righteous deeds which he has done shall not be remembered; but his blood I will require at your hand.";
asv[20] = "Again, when a righteous man doth turn from his righteousness, and commit iniquity, and I lay a stumblingblock before him, he shall die: because thou hast not given him warning, he shall die in his sin, and his righteous deeds which he hath done shall not be remembered; but his blood will I require at thy hand.";
yng[20] = "`And in the turning back of the righteous from his righteousness, and he hath done perversity, and I have put a stumbling-block before him, he dieth; because thou hast not warned him, in his sin he dieth, and not remembered is his righteousness that he hath done, and his blood from thy hand I require.";
dby[20] = "And when a righteous [man] doth turn from his righteousness, and do what is wrong, and I lay a stumbling-block before him, he shall die; because thou hast not given him warning, he shall die in his sin, and his righteous acts which he hath done shall not be remembered; but his blood will I require at thy hand.";
web[20] = "Again, When a righteous [man] doth turn from his righteousness, and commit iniquity, and I lay a stumbling-block before him, he shall die: because thou hast not given him warning, he shall die in his sin, and his righteousness which he hath done shall not be remembered; but his blood will I require at thy hand.";
hnv[20] = "Again, when a righteous man does turn from his righteousness, and commit iniquity, and I lay a stumbling block before him, he shall die: because you have not given him warning, he shall die in his sin, and his righteous deeds which he has done shall not be remembered; but his blood will I require at your hand.";
vul[20] = "sed et si conversus iustus a iustitia sua fecerit iniquitatem ponam offendiculum coram eo ipse morietur quia non adnuntiasti ei in peccato suo morietur et non erunt in memoria iustitiae eius quas fecit sanguinem vero eius de manu tua requiram";
kjv[21] = "Nevertheless if thou warn the righteous [man], that the righteous sin not, and he doth not sin, he shall surely live, because he is warned; also thou hast delivered thy soul.";
rsv[21] = "Nevertheless if you warn the righteous man not to sin, and he does not sin, he shall surely live, because he took warning; and you will have saved your life.&quot;";
asv[21] = "Nevertheless if thou warn the righteous man, that the righteous sin not, and he doth not sin, he shall surely live, because he took warning; and thou hast delivered thy soul.";
yng[21] = "And thou, because thou hast warned him -- the righteous -- that the righteous sin not, and he hath not sinned, he surely liveth, because he hath been warned; and thou thy soul hast delivered.\'";
dby[21] = "And if thou warn the righteous [man], that the righteous sin not, and he doth not sin, he shall certainly live, for he hath taken warning; and thou hast delivered thy soul.";
web[21] = "Nevertheless if thou shalt warn the righteous [man], that the righteous sin not, and he doth not sin, he shall surely live, because he is warned; also thou hast delivered thy soul.";
hnv[21] = "Nevertheless if you warn the righteous man, that the righteous not sin, and he does not sin, he shall surely live, because he took warning; and you have delivered your soul.";
vul[21] = "si autem tu adnuntiaveris iusto ut non peccet iustus et ille non peccaverit vivens vivet quia adnuntiasti ei et tu animam tuam liberasti";
kjv[22] = "And the hand of the LORD was there upon me; and he said unto me, Arise, go forth into the plain, and I will there talk with thee.";
rsv[22] = "And the hand of the LORD was there upon me; and he said to me, &quot;Arise, go forth into the plain, and there I will speak with you.&quot;";
asv[22] = "And the hand of Jehovah was there upon me; and he said unto me, Arise, go forth into the plain, and I will there talk with thee.";
yng[22] = "And there is on me there a hand of Jehovah, and He saith to me, `Rise, go forth to the valley, and there I do speak with thee.\'";
dby[22] = "And the hand of Jehovah was there upon me; and he said unto me, Arise, go forth into the valley, and there I will talk with thee.";
web[22] = "And the hand of the LORD was there upon me; and he said to me, Arise, go forth into the plain, and I will there talk with thee.";
hnv[22] = "The hand of the LORD was there on me; and he said to me, Arise, go forth into the plain, and I will there talk with you.";
vul[22] = "et facta est super me manus Domini et dixit ad me surgens egredere in campum et ibi loquar tecum";
kjv[23] = "Then I arose, and went forth into the plain: and, behold, the glory of the LORD stood there, as the glory which I saw by the river of Chebar: and I fell on my face.";
rsv[23] = "So I arose and went forth into the plain; and, lo, the glory of the LORD stood there, like the glory which I had seen by the river Chebar; and I fell on my face.";
asv[23] = "Then I arose, and went forth into the plain: and, behold, the glory of Jehovah stood there, as the glory which I saw by the river Chebar; and I fell on my face.";
yng[23] = "And I rise and go forth unto the valley, and lo, there the honour of Jehovah is standing as the honour that I had seen by the river Chebar, and I fall on my face.";
dby[23] = "And I arose, and went forth into the valley, and behold, the glory of Jehovah stood there, like the glory which I saw by the river Chebar; and I fell on my face.";
web[23] = "Then I arose, and went forth into the plain; and behold, the glory of the LORD stood there, as the glory which I saw by the river of Kebar: and I fell on my face.";
hnv[23] = "Then I arose, and went forth into the plain: and, behold, the glory of the LORD stood there, as the glory which I saw by the river Kevar; and I fell on my face.";
vul[23] = "et surgens egressus sum in campum et ecce ibi gloria Domini stabat quasi gloria quam vidi iuxta fluvium Chobar et cecidi in faciem meam";
kjv[24] = "Then the spirit entered into me, and set me upon my feet, and spake with me, and said unto me, Go, shut thyself within thine house.";
rsv[24] = "But the Spirit entered into me, and set me upon my feet; and he spoke with me and said to me, &quot;Go, shut yourself within your house.";
asv[24] = "Then the Spirit entered into me, and set me upon my feet; and he spake with me, and said unto me, Go, shut thyself within thy house.";
yng[24] = "And come into me doth a spirit, and causeth me to stand on my feet, and He speaketh with me, and saith unto me, `Go in, be shut up in the midst of thy house.";
dby[24] = "And the Spirit entered into me, and set me upon my feet; and he spoke with me, and said unto me, Go, shut thyself within thy house.";
web[24] = "Then the spirit entered into me, and set me upon my feet, and spoke with me, and said to me, Go, shut thyself within thy house.";
hnv[24] = "Then the Spirit entered into me, and set me on my feet; and he spoke with me, and said to me, Go, shut yourself within your house.";
vul[24] = "et ingressus est in me spiritus et statuit me super pedes meos et locutus est mihi et dixit ad me ingredere et includere in medio domus tuae";
kjv[25] = "But thou, O son of man, behold, they shall put bands upon thee, and shall bind thee with them, and thou shalt not go out among them:";
rsv[25] = "And you, O son of man, behold, cords will be placed upon you, and you shall be bound with them, so that you cannot go out among the people;";
asv[25] = "But thou, son of man, behold, they shall lay bands upon thee, and shall bind thee with them, and thou shalt not go out among them:";
yng[25] = "`And thou, son of man, lo, they have put on thee thick bands, and have bound thee with them, and thou goest not forth in their midst;";
dby[25] = "And thou, son of man, behold, they shall put bands upon thee, and shall bind thee therewith, and thou shalt not go out among them.";
web[25] = "But thou, O son of man, behold, they shall put bands upon thee, and shall bind thee with them, and thou shalt not go out among them:";
hnv[25] = "But you, son of man, behold, they shall lay bands on you, and shall bind you with them, and you shall not go out among them:";
vul[25] = "et tu fili hominis ecce data sunt super te vincula et ligabunt te in eis et non egredieris in medio eorum";
kjv[26] = "And I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover: for they [are] a rebellious house.";
rsv[26] = "and I will make your tongue cleave to the roof of your mouth, so that you shall be dumb and unable to reprove them; for they are a rebellious house.";
asv[26] = "and I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover; for they are a rebellious house.";
yng[26] = "and thy tongue I cause to cleave unto thy palate, and thou hast been dumb, and art not to them for a reprover, for a rebellious house [are] they.";
dby[26] = "And I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover; for they are a rebellious house.";
web[26] = "And I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover: for they [are] a rebellious house.";
hnv[26] = "and I will make your tongue cleave to the roof of your mouth, that you shall be mute, and shall not be to them a reprover; for they are a rebellious house.";
vul[26] = "et linguam tuam adherescere faciam palato tuo et eris mutus nec quasi vir obiurgans quia domus exasperans est";
kjv[27] = "But when I speak with thee, I will open thy mouth, and thou shalt say unto them, Thus saith the Lord GOD; He that heareth, let him hear; and he that forbeareth, let him forbear: for they [are] a rebellious house.";
rsv[27] = "But when I speak with you, I will open your mouth, and you shall say to them, \'Thus says the Lord GOD\'; he that will hear, let him hear; and he that will refuse to hear, let him refuse; for they are a rebellious house.";
asv[27] = "But when I speak with thee, I will open thy mouth, and thou shalt say unto them, Thus saith the Lord Jehovah: He that heareth, let him hear; and he that forbeareth, let him forbear: for they are a rebellious house.";
yng[27] = "And in My speaking with thee, I do open thy mouth, and thou hast said unto them: Thus said the Lord Jehovah; the hearer doth hear, and the forbearer doth forbear; for a rebellious house [are] they.";
dby[27] = "And when I speak with thee, I will open thy mouth, and thou shalt say unto them, Thus saith the Lord Jehovah: He that heareth, let him hear; and he that forbeareth, let him forbear: for they are a rebellious house.";
web[27] = "But when I speak with thee, I will open thy mouth, and thou shalt say to them, Thus saith the Lord GOD; He that heareth, let him hear; and he that forbeareth, let him forbear: for they [are] a rebellious house.";
hnv[27] = "But when I speak with you, I will open your mouth, and you shall tell them, Thus says the Lord GOD: He who hears, let him hear; and he who forbears, let him forbear: for they are a rebellious house.";
vul[27] = "cum autem locutus fuero tibi aperiam os tuum et dices ad eos haec dicit Dominus Deus qui audit audiat et qui quiescit quiescat quia domus exasperans est";
