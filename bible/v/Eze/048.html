csb[1] = "&quot;Now these are the names of the tribes: From the northern end, along the road of Hethlon, to Lebo-hamath as far as Hazar-enon, at the northern border of Damascus, alongside Hamath and extending from the eastern side to the sea, will be Dan -- one portion.";
csb[2] = "&quot;Next to the territory of Dan, from the east side to the west, will be Asher -- one portion.";
csb[3] = "&quot;Next to the territory of Asher, from the east side to the west, will be Naphtali -- one portion.";
csb[4] = "&quot;Next to the territory of Naphtali, from the east side to the west, will be Manasseh -- one portion.";
csb[5] = "&quot;Next to the territory of Manasseh, from the east side to the west, will be Ephraim -- one portion.";
csb[6] = "&quot;Next to the territory of Ephraim, from the east side to the west, will be Reuben -- one portion.";
csb[7] = "&quot;Next to the territory of Reuben, from the east side to the west, will be Judah -- one portion.";
csb[8] = "&quot;Next to the territory of Judah, from the east side to the west, will be the portion you donate to the LORD, 8 1/3 miles wide, and as long as one of the tribal portions from the east side to the west. The sanctuary will be in the middle of it.";
csb[9] = "&quot;The special portion you donate to the LORD will be 8 1/3 miles long and 3 1/3 miles wide.";
csb[10] = "&quot;This holy donation will be set apart for the priests alone. It will be 8 1/3 miles long on the northern side, 3 1/3 miles wide on the western side, 3 1/3 miles wide on the eastern side, and 8 1/3 miles long on the southern side. The LORD\'s sanctuary will be in the middle of it.";
csb[11] = "&quot;It is for the consecrated priests, the sons of Zadok, who kept my charge and did not go astray as the Levites did when the Israelites went astray.";
csb[12] = "&quot;It will be a special donation for them out of the holy donation of the land, a most holy place adjacent to the territory of the Levites.";
csb[13] = "&quot;Next to the territory of the priests, the Levites will have an area 8 1/3 miles long and 3 1/3 miles wide. The total length will be 8 1/3 miles and the width 3 1/3 miles.";
csb[14] = "&quot;They must not sell or exchange any of it, and they must not transfer this choice part of the land, for it is holy to the LORD.";
csb[15] = "&quot;The remaining area, 1 2/3 miles wide and 8 1/3 miles long, will be for common use by the city, for both residential and open space. The city will be in the middle of it.";
csb[16] = "&quot;These are the city\'s measurements: 1 1/2 miles on the north side; 1 1/2 miles on the south side; 1 1/2 miles on the east side; and 1 1/2 miles on the west side.";
csb[17] = "&quot;The city\'s open space will extend: 425 feet to the north, 425 feet to the south, 425 feet to the east, and 425 feet to the west.";
csb[18] = "&quot;The remainder of the length alongside the holy donation will be 3 1/3 miles to the east and 3 1/3 miles to the west. It will run alongside the holy donation. Its produce will be food for the workers of the city.";
csb[19] = "&quot;The city\'s workers from all the tribes of Israel will cultivate it.";
csb[20] = "&quot;The entire donation will be 8 1/3 miles by 8 1/3 miles; you are to set apart the holy donation along with the city property as a square area.";
csb[21] = "&quot;The remaining area on both sides of the holy donation and the city property will belong to the prince. He will own the land adjacent to the tribal portions, next to the 8 1/3 miles of the donation as far as the eastern border and next to the 8 1/3 miles of the donation as far as the western border. The holy donation and the sanctuary of the temple will be in the middle of it.";
csb[22] = "&quot;Except for the Levitical property and the city property in the middle of the area belonging to the prince, the area between the territory of Judah and that of Benjamin will belong to the prince.";
csb[23] = "&quot;As for the rest of the tribes: From the east side to the west, will be Benjamin -- one portion.";
csb[24] = "&quot;Next to the territory of Benjamin, from the east side to the west, will be Simeon -- one portion.";
csb[25] = "&quot;Next to the territory of Simeon, from the east side to the west, will be Issachar -- one portion.";
csb[26] = "&quot;Next to the territory of Issachar, from the east side to the west, will be Zebulun -- one portion.";
csb[27] = "&quot;Next to the territory of Zebulun, from the east side to the west, will be Gad -- one portion.";
csb[28] = "&quot;Next to the territory of Gad toward the south side, the border will run from Tamar to the Waters of Meribath-kadesh, to the Brook of Egypt, and out to the Mediterranean Sea.";
csb[29] = "&quot;This is the land you are to allot as an inheritance to Israel\'s tribes, and these will be their portions.&quot; This is the declaration of the Lord GOD.";
csb[30] = "&quot;These are the exits of the city: On the north side, which measures 1 1/2 miles,";
csb[31] = "&quot;there will be three gates facing north, the gates of the city being named for the tribes of Israel: one, the gate of Reuben; one, the gate of Judah; and one, the gate of Levi.";
csb[32] = "&quot;On the east side, which is 1 1/2 miles, there will be three gates: one, the gate of Joseph; one, the gate of Benjamin; and one, the gate of Dan.";
csb[33] = "&quot;On the south side, which measures 1 1/2 miles, there will be three gates: one, the gate of Simeon; one, the gate of Issachar; and one, the gate of Zebulun.";
csb[34] = "&quot;On the west side, which is 1 1/2 miles, there will be three gates: one, the gate of Gad; one, the gate of Asher; and one, the gate of Naphtali.";
csb[35] = "&quot;The perimeter of the city will be six miles, and the name of the city from that day on will be, The LORD Is There.&quot;";
kjv[1] = "Now these [are] the names of the tribes. From the north end to the coast of the way of Hethlon, as one goeth to Hamath, Hazarenan, the border of Damascus northward, to the coast of Hamath; for these are his sides east [and] west; a [portion for] Dan.";
kjv[2] = "And by the border of Dan, from the east side unto the west side, a [portion for] Asher.";
kjv[3] = "And by the border of Asher, from the east side even unto the west side, a [portion for] Naphtali.";
kjv[4] = "And by the border of Naphtali, from the east side unto the west side, a [portion for] Manasseh.";
kjv[5] = "And by the border of Manasseh, from the east side unto the west side, a [portion for] Ephraim.";
kjv[6] = "And by the border of Ephraim, from the east side even unto the west side, a [portion for] Reuben.";
kjv[7] = "And by the border of Reuben, from the east side unto the west side, a [portion for] Judah.";
kjv[8] = "And by the border of Judah, from the east side unto the west side, shall be the offering which ye shall offer of five and twenty thousand [reeds in] breadth, and [in] length as one of the [other] parts, from the east side unto the west side: and the sanctuary shall be in the midst of it.";
kjv[9] = "The oblation that ye shall offer unto the LORD [shall be] of five and twenty thousand in length, and of ten thousand in breadth.";
kjv[10] = "And for them, [even] for the priests, shall be [this] holy oblation; toward the north five and twenty thousand [in length], and toward the west ten thousand in breadth, and toward the east ten thousand in breadth, and toward the south five and twenty thousand in length: and the sanctuary of the LORD shall be in the midst thereof.";
kjv[11] = "[It shall be] for the priests that are sanctified of the sons of Zadok; which have kept my charge, which went not astray when the children of Israel went astray, as the Levites went astray.";
kjv[12] = "And [this] oblation of the land that is offered shall be unto them a thing most holy by the border of the Levites.";
kjv[13] = "And over against the border of the priests the Levites [shall have] five and twenty thousand in length, and ten thousand in breadth: all the length [shall be] five and twenty thousand, and the breadth ten thousand.";
kjv[14] = "And they shall not sell of it, neither exchange, nor alienate the firstfruits of the land: for [it is] holy unto the LORD.";
kjv[15] = "And the five thousand, that are left in the breadth over against the five and twenty thousand, shall be a profane [place] for the city, for dwelling, and for suburbs: and the city shall be in the midst thereof.";
kjv[16] = "And these [shall be] the measures thereof; the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.";
kjv[17] = "And the suburbs of the city shall be toward the north two hundred and fifty, and toward the south two hundred and fifty, and toward the east two hundred and fifty, and toward the west two hundred and fifty.";
kjv[18] = "And the residue in length over against the oblation of the holy [portion shall be] ten thousand eastward, and ten thousand westward: and it shall be over against the oblation of the holy [portion]; and the increase thereof shall be for food unto them that serve the city.";
kjv[19] = "And they that serve the city shall serve it out of all the tribes of Israel.";
kjv[20] = "All the oblation [shall be] five and twenty thousand by five and twenty thousand: ye shall offer the holy oblation foursquare, with the possession of the city.";
kjv[21] = "And the residue [shall be] for the prince, on the one side and on the other of the holy oblation, and of the possession of the city, over against the five and twenty thousand of the oblation toward the east border, and westward over against the five and twenty thousand toward the west border, over against the portions for the prince: and it shall be the holy oblation; and the sanctuary of the house [shall be] in the midst thereof.";
kjv[22] = "Moreover from the possession of the Levites, and from the possession of the city, [being] in the midst [of that] which is the prince\'s, between the border of Judah and the border of Benjamin, shall be for the prince.";
kjv[23] = "As for the rest of the tribes, from the east side unto the west side, Benjamin [shall have] a [portion].";
kjv[24] = "And by the border of Benjamin, from the east side unto the west side, Simeon [shall have] a [portion].";
kjv[25] = "And by the border of Simeon, from the east side unto the west side, Issachar a [portion].";
kjv[26] = "And by the border of Issachar, from the east side unto the west side, Zebulun a [portion].";
kjv[27] = "And by the border of Zebulun, from the east side unto the west side, Gad a [portion].";
kjv[28] = "And by the border of Gad, at the south side southward, the border shall be even from Tamar [unto] the waters of strife [in] Kadesh, [and] to the river toward the great sea.";
kjv[29] = "This [is] the land which ye shall divide by lot unto the tribes of Israel for inheritance, and these [are] their portions, saith the Lord GOD.";
kjv[30] = "And these [are] the goings out of the city on the north side, four thousand and five hundred measures.";
kjv[31] = "And the gates of the city [shall be] after the names of the tribes of Israel: three gates northward; one gate of Reuben, one gate of Judah, one gate of Levi.";
kjv[32] = "And at the east side four thousand and five hundred: and three gates; and one gate of Joseph, one gate of Benjamin, one gate of Dan.";
kjv[33] = "And at the south side four thousand and five hundred measures: and three gates; one gate of Simeon, one gate of Issachar, one gate of Zebulun.";
kjv[34] = "At the west side four thousand and five hundred, [with] their three gates; one gate of Gad, one gate of Asher, one gate of Naphtali.";
kjv[35] = "[It was] round about eighteen thousand [measures]: and the name of the city from [that] day [shall be], The LORD [is] there.";
rsv[1] = "&quot;These are the names of the tribes: Beginning at the northern border, from the sea by way of Hethlon to the entrance of Hamath, as far as Hazar-e\'non (which is on the northern border of Damascus over against Hamath), and extending from the east side to the west, Dan, one portion.";
asv[1] = "Now these are the names of the tribes: From the north end, beside the way of Hethlon to the entrance of Hamath, Hazar-enan at the border of Damascus, northward beside Hamath (and they shall have their sides east [and] west), Dan, one [portion].";
yng[1] = "And these [are] the names of the tribes: From the north end unto the side of the way of Hethlon, at the coming in to Hamath, Hazar-Enan, the border of Damascus northward, unto the side of Hamath, and they have been his -- side east and west, Dan one,";
dby[1] = "And these are the names of the tribes: From the north end along the way of Hethlon, as one entereth into Hamath, Hazar-enan, the border of Damascus northward unto near Hamath -- the east and west side [belonging] to him -- shall Dan have one [portion].";
web[1] = "Now these [are] the names of the tribes. From the north end to the border of the way of Hethlon, as one goeth to Hamath, Hazar-enan, the border of Damascus northward, to the limit of Hamath; for these are his sides east [and] west; a [portion for] Dan.";
hnv[1] = "Now these are the names of the tribes: From the north end, beside the way of Hetlon to the entrance of Hamat, Hatzar-`Enan at the border of Dammesek, northward beside Hamat, (and they shall have their sides east [and] west,) Dan, one [portion].";

rsv[8] = "&quot;Adjoining the territory of Judah, from the east side to the west, shall be the portion which you shall set apart, twenty-five thousand cubits in breadth, and in length equal to one of the tribal portions, from the east side to the west, with the sanctuary in the midst of it.";
asv[8] = "And by the border of Judah, from the east side unto the west side, shall be the oblation which ye shall offer, five and twenty thousand [reeds] in breadth, and in length as one of the portions, from the east side unto the west side: and the sanctuary shall be in the midst of it.";
yng[8] = "and by the border of Judah, from the east side unto the west side is the heave-offering that ye lift up, five and twenty thousand broad and long, as one of the parts, from the east side unto the west side: and the sanctuary hath been in its midst.";
dby[8] = "And by the border of Judah, from the east side unto the west side, shall be the heave-offering that ye shall offer, five and twenty thousand [cubits] in breadth, and in length as one of the parts from the east side unto the west side: and the sanctuary shall be in the midst of it.";
web[8] = "And by the border of Judah, from the east side to the west side, shall be the offering which ye shall offer of five and twenty thousand [reeds in] breadth, and [in] length as one of the [other] parts, from the east side to the west side: and the sanctuary shall be in the midst of it.";
hnv[8] = "By the border of Yehudah, from the east side to the west side, shall be the offering which you shall offer, twenty-five thousand [reeds] in breadth, and in length as one of the portions, from the east side to the west side: and the sanctuary shall be in the midst of it.";
vul[8] = "et super terminum Iuda a plaga orientali usque ad plagam maris erunt primitiae quas separabitis viginti quinque milibus latitudinis et longitudinis sicuti singulae partes a plaga orientali usque ad plagam maris et erit sanctuarium in medio eius";
rsv[9] = "The portion which you shall set apart for the LORD shall be twenty-five thousand cubits in length, and twenty thousand in breadth.";
asv[9] = "The oblation that ye shall offer unto Jehovah shall be five and twenty thousand [reeds] in length, and ten thousand in breadth.";
yng[9] = "The heave-offering that ye lift up to Jehovah [is] five and twenty thousand long, and broad ten thousand.";
dby[9] = "The heave-offering that ye shall offer unto Jehovah shall be five and twenty thousand in length, and ten thousand in breadth.";
web[9] = "The oblation that ye shall offer to the LORD [shall be] of five and twenty thousand in length, and of ten thousand in breadth.";
hnv[9] = " The offering that you shall offer to the LORD shall be twenty-five thousand [reeds] in length, and ten thousand in breadth.";
vul[9] = "primitiae quas separastis Domino longitudo viginti quinque milibus et latitudo decem milibus";
rsv[10] = "These shall be the allotments of the holy portion: the priests shall have an allotment measuring twenty-five thousand cubits on the northern side, ten thousand cubits in breadth on the western side, ten thousand in breadth on the eastern side, and twenty-five thousand in length on the southern side, with the sanctuary of the LORD in the midst of it.";
asv[10] = "And for these, even for the priests, shall be the holy oblation; toward the north five and twenty thousand [in length], and toward the west ten thousand in breadth, and toward the east ten thousand in breadth, and toward the south five and twenty thousand in length: and the sanctuary of Jehovah shall be in the midst thereof.";
yng[10] = "And of these is the holy heave-offering for the priests, northward five and twenty thousand, and westward [in] breadth ten thousand, and eastward [in] breadth ten thousand, and southward [in] length five and twenty thousand: and the sanctuary of Jehovah hath been in its midst.";
dby[10] = "And for them, for the priests, shall be the holy heave-offering, toward the north five and twenty thousand, and toward the west the breadth ten thousand, and toward the east the breadth ten thousand, and toward the south the length five and twenty thousand: and the sanctuary of Jehovah shall be in the midst of it.";
web[10] = "And for them, [even] for the priests, shall be [this] holy oblation; towards the north five and twenty thousand [in length], and towards the west ten thousand in breadth, and towards the east ten thousand in breadth, and towards the south five and twenty thousand in length: and the sanctuary of the LORD shall be in the midst of it.";
hnv[10] = "For these, even for the Kohanim, shall be the holy offering: toward the north twenty-five thousand [in length], and toward the west ten thousand in breadth, and toward the east ten thousand in breadth, and toward the south twenty-five thousand in length: and the sanctuary of the LORD shall be in the midst of it.";
vul[10] = "hae autem erunt primitiae sanctuarii sacerdotum ad aquilonem viginti quinque milia et ad mare latitudinis decem milia sed et ad orientem latitudinis decem milia et ad meridiem longitudinis viginti quinque milia et erit sanctuarium Domini in medio eius";
rsv[11] = "This shall be for the consecrated priests, the sons of Zadok, who kept my charge, who did not go astray when the people of Israel went astray, as the Levites did.";
asv[11] = "[It shall be] for the priests that are sanctified of the sons of Zadok, that have kept my charge, that went not astray when the children of Israel went astray, as the Levites went astray.";
yng[11] = "For the priests who are sanctified of the sons of Zadok, who have kept My charge, who erred not in the erring of the sons of Israel, as the Levites erred,";
dby[11] = "[It shall be] for the priests that are hallowed of the sons of Zadok, who kept my charge and went not astray when the children of Israel went astray, as the Levites went astray.";
web[11] = "[It shall be] for the priests that are sanctified of the sons of Zadok; who have kept my charge, who went not astray when the children of Israel went astray, as the Levites went astray.";
hnv[11] = "[It shall be] for the Kohanim who are sanctified of the sons of Tzadok, who have kept my charge, who didn\'t go astray when the children of Yisra\'el went astray, as the Levites went astray.";
vul[11] = "sacerdotibus sanctuarium erit de filiis Sadoc qui custodierunt caerimonias meas et non erraverunt cum errarent filii Israhel sicut erraverunt et Levitae";
rsv[12] = "And it shall belong to them as a special portion from the holy portion of the land, a most holy place, adjoining the territory of the Levites.";
asv[12] = "And it shall be unto them an oblation from the oblation of the land, a thing most holy, by the border of the Levites.";
yng[12] = "even the heave-offering hath been to them, out of the heave-offering of the land, most holy, by the border of the Levites.";
dby[12] = "And this offering heaved from the heave-offering of the land shall be unto them a thing most holy, by the border of the Levites.";
web[12] = "And [this] oblation of the land that is offered shall be to them a thing most holy, by the border of the Levites.";
hnv[12] = "It shall be to them an offering from the offering of the land, a thing most holy, by the border of the Levites.";
vul[12] = "et erunt eis primitiae de primitiis terrae sanctum sanctorum iuxta terminum Levitarum";
rsv[13] = "And alongside the territory of the priests, the Levites shall have an allotment twenty-five thousand cubits in length and ten thousand in breadth. The whole length shall be twenty-five thousand cubits and the breadth twenty thousand.";
asv[13] = "And answerable unto the border of the priests, the Levites shall have five and twenty thousand in length, and ten thousand in breadth: all the length shall be five and twenty thousand, and the breadth ten thousand.";
yng[13] = "`And [to] the Levites over-against the border of the priests [are] five and twenty thousand [in] length, and [in] breadth ten thousand, all the length [is] five and twenty thousand, and the breadth ten thousand.";
dby[13] = "And answering to the border of the priests, the Levites shall have five and twenty thousand in length, and ten thousand in breadth: the whole length shall be five and twenty thousand, and the breadth ten thousand.";
web[13] = "And over against the border of the priests the Levites [shall have] five and twenty thousand in length, and ten thousand in breadth: all the length [shall be] five and twenty thousand, and the breadth ten thousand.";
hnv[13] = "Answerable to the border of the Kohanim, the Levites shall have twenty-five thousand in length, and ten thousand in breadth: all the length shall be twenty-five thousand, and the breadth ten thousand.";
vul[13] = "sed et Levitis similiter iuxta fines sacerdotum viginti quinque milia longitudinis et latitudinis decem milia omnis longitudo viginti et quinque milium et latitudo decem milium";
rsv[14] = "They shall not sell or exchange any of it; they shall not alienate this choice portion of the land, for it is holy to the LORD.";
asv[14] = "And they shall sell none of it, nor exchange it, nor shall the first-fruits of the land be alienated; for it is holy unto Jehovah.";
yng[14] = "And they do not sell of it, nor exchange, nor cause to pass away the first-fruit of the land: for [it is] holy to Jehovah.";
dby[14] = "And they shall not sell of it, neither exchange, nor alienate the first-fruits of the land: for it is holy unto Jehovah.";
web[14] = "And they shall not sell of it, neither exchange, nor alienate the first-fruits of the land: for [it is] holy to the LORD.";
hnv[14] = "They shall sell none of it, nor exchange it, nor shall the first fruits of the land be alienated; for it is holy to the LORD.";
vul[14] = "et non venundabunt ex eo neque mutabunt nec transferentur primitiae terrae quia sanctificatae sunt Domino";
rsv[15] = "&quot;The remainder, five thousand cubits in breadth and twenty-five thousand in length, shall be for ordinary use for the city, for dwellings and for open country. In the midst of it shall be the city;";
asv[15] = "And the five thousand that are left in the breadth, in front of the five and twenty thousand, shall be for common use, for the city, for dwelling and for suburbs; and the city shall be in the midst thereof.";
yng[15] = "And the five thousand that is left in the breadth, on the front of the five and twenty thousand, is common -- for the city, for dwelling, and for suburb, and the city hath been in its midst.";
dby[15] = "And the five thousand that are left in the breadth over against the five and twenty thousand, shall be a common [place] for the city, for dwellings and for suburbs: and the city shall be in the midst of it.";
web[15] = "And the five thousand, that are left in the breadth over against the five and twenty thousand, shall be a profane [place] for the city, for dwelling, and for suburbs, and the city shall be in the midst of it.";
hnv[15] = "The five thousand that are left in the breadth, in front of the twenty-five thousand, shall be for common use, for the city, for dwelling and for suburbs; and the city shall be in the midst of it.";
vul[15] = "quinque milia autem quae supersunt in latitudine per viginti quinque milia profana erunt urbis in habitaculum et in suburbana et erit civitas in medio eius";
rsv[16] = "and these shall be its dimensions: the north side four thousand five hundred cubits, the south side four thousand five hundred, the east side four thousand five hundred, and the west side four thousand and five hundred.";
asv[16] = "And these shall be the measures thereof: the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.";
yng[16] = "And these [are] its measures: the north side five hundred, and four thousand, and the south side five hundred, and four thousand, and on the east side five hundred, and four thousand, and the west side five hundred, and four thousand.";
dby[16] = "And these shall be the measures thereof: the north side four thousand and five hundred [cubits], and the south side four thousand and five hundred, and the east side four thousand and five hundred, and the west side four thousand and five hundred.";
web[16] = "And these [shall be] the measures of it; the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.";
hnv[16] = "These shall be the measures of it: the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.";
vul[16] = "et heae mensurae eius ad plagam septentrionalem quingenti et quattuor milia et ad plagam meridianam quingenti et quattuor milia et ad plagam orientalem quingenti et quattuor milia et ad plagam occidentalem quingenti et quattuor milia";
rsv[17] = "And the city shall have open land: on the north two hundred and fifty cubits, on the south two hundred and fifty, on the east two hundred and fifty, and on the west two hundred and fifty.";
asv[17] = "And the city shall have suburbs: toward the north two hundred and fifty, and toward the south two hundred and fifty, and toward the east two hundred and fifty, and toward the west two hundred and fifty.";
yng[17] = "And the suburb to the city hath been northward, fifty and two hundred, and southward, fifty and two hundred, and eastward, fifty and two hundred, and westward, fifty and two hundred.";
dby[17] = "And the suburbs of the city shall be toward the north two hundred and fifty [cubits], and toward the south two hundred and fifty, and toward the east two hundred and fifty, and toward the west two hundred and fifty.";
web[17] = "And the suburbs of the city shall be towards the north two hundred and fifty, and towards the south two hundred and fifty, and towards the east two hundred and fifty, and towards the west two hundred and fifty.";
hnv[17] = "The city shall have suburbs: toward the north two hundred fifty, and toward the south two hundred fifty, and toward the east two hundred fifty, and toward the west two hundred fifty.";
vul[17] = "erunt autem suburbana civitatis ad aquilonem ducenti quinquaginta et in meridie ducenti quinquaginta et ad orientem ducenti quinquaginta et ad mare ducenti quinquaginta";
rsv[18] = "The remainder of the length alongside the holy portion shall be ten thousand cubits to the east, and ten thousand to the west, and it shall be alongside the holy portion. Its produce shall be food for the workers of the city.";
asv[18] = "And the residue in the length, answerable unto the holy oblation, shall be ten thousand eastward, and ten thousand westward; and it shall be answerable unto the holy oblation; and the increase thereof shall be for food unto them that labor in the city.";
yng[18] = "`And the residue in length over-against the heave-offering of the holy [portion is] ten thousand eastward, and ten thousand westward, and it hath been over-against the heave-offering of the holy [portion], and its increase hath been for food to the servants of the city,";
dby[18] = "And the residue in length, alongside the holy heave-offering, shall be ten thousand eastward and ten thousand westward: it shall be alongside the holy heave-offering; and the increase thereof shall be for the support of them that serve the city.";
web[18] = "And the residue in length over against the oblation of the holy [portion shall be] ten thousand eastward, and ten thousand westward: and it shall be over against the oblation of the holy [portion]; and its increase shall be for food to them that serve the city.";
hnv[18] = "The remainder in the length, answerable to the holy offering, shall be ten thousand eastward, and ten thousand westward; and it shall be answerable to the holy offering; and the increase of it shall be for food to those who labor in the city.";
vul[18] = "quod autem reliquum fuerit in longitudine secundum primitias sanctuarii decem milia in orientem et decem milia ad occidentem erunt sicut primitiae sanctuarii et erunt fruges eius in panes his qui serviunt civitati";
rsv[19] = "And the workers of the city, from all the tribes of Israel, shall till it.";
asv[19] = "And they that labor in the city, out of all the tribes of Israel, shall till it.";
yng[19] = "even [to] him who is serving the city, they serve it out of all the tribes of Israel.";
dby[19] = "And they that serve the city shall serve it out of all the tribes of Israel.";
web[19] = "And they that serve the city shall serve it out of all the tribes of Israel.";
hnv[19] = "Those who labor in the city, out of all the tribes of Yisra\'el, shall until it.";
vul[19] = "servientes autem civitati operabuntur ex omnibus tribubus Israhel";
rsv[20] = "The whole portion which you shall set apart shall be twenty-five thousand cubits square, that is, the holy portion together with the property of the city.";
asv[20] = "All the oblation shall be five and twenty thousand by five and twenty thousand: ye shall offer the holy oblation four-square, with the possession of the city.";
yng[20] = "All the heave-offering [is] five and twenty thousand by five and twenty thousand, square do ye lift up the heave-offering of the holy [portion] with the possession of the city.";
dby[20] = "The whole heave-offering shall be five and twenty thousand by five and twenty thousand; ye shall offer the holy heave-offering foursquare with the possession of the city.";
web[20] = "All the oblation [shall be] five and twenty thousand by five and twenty thousand: ye shall offer the holy oblation foursquare, with the possession of the city.";
hnv[20] = "All the offering shall be twenty-five thousand by twenty-five thousand: you shall offer the holy offering four-square, with the possession of the city.";
vul[20] = "omnes primitiae viginti quinque milium per viginti quinque milia in quadrum separabuntur in primitias sanctuarii et possessionem civitatis";
rsv[21] = "&quot;What remains on both sides of the holy portion and of the property of the city shall belong to the prince. Extending from the twenty-five thousand cubits of the holy portion to the east border, and westward from the twenty-five thousand cubits to the west border, parallel to the tribal portions, it shall belong to the prince. The holy portion with the sanctuary of the temple in its midst,";
asv[21] = "And the residue shall be for the prince, on the one side and on the other of the holy oblation and of the possession of the city; in front of the five and twenty thousand of the oblation toward the east border, and westward in front of the five and twenty thousand toward the west border, answerable unto the portions, it shall be for the prince: and the holy oblation and the sanctuary of the house shall be in the midst thereof.";
yng[21] = "`And the residue [is] for the prince, on this side and on that side of the heave-offering of the holy [portion], and of the possession of the city, on the front of the five and twenty thousand of the heave-offering unto the east border, and westward, on the front of the five and twenty thousand on the west border, over-against the portions of the prince; and the heave-offering of the holy [portion], and the sanctuary of the house, hath been in its midst.";
dby[21] = "And the rest shall be for the prince, on the one side and on the other of the holy heave-offering and of the possession of the city, in front of the five and twenty thousand of the heave-offering toward the east border, and westward in front of the five and twenty thousand toward the west border, answering to the [other] portions: it shall be for the prince; and the holy heave-offering and the sanctuary of the house shall be in the midst of it.";
web[21] = "And the residue [shall be] for the prince, on the one side and on the other of the holy oblation, and of the possession of the city, over against the five and twenty thousand of the oblation towards the east border, and westward over against the five and twenty thousand towards the west border, over against the portions for the prince: and it shall be the holy oblation; and the sanctuary of the house [shall be] in the midst of it.";
hnv[21] = "The residue shall be for the prince, on the one side and on the other of the holy offering and of the possession of the city; in front of the twenty-five thousand of the offering toward the east border, and westward in front of the twenty-five thousand toward the west border, answerable to the portions, it shall be for the prince: and the holy offering and the sanctuary of the house shall be in the midst of it.";
vul[21] = "quod autem reliquum fuerit principis erit ex omni parte primitiarum sanctuarii et possessionis civitatis e regione viginti quinque milium primitiarum usque ad terminum orientalem sed et ad mare e regione viginti quinque milium usque ad terminum maris similiter in partibus principis erit et erunt primitiae sanctuarii et sanctuarium templi in medio eius";
rsv[22] = "and the property of the Levites and the property of the city, shall be in the midst of that which belongs to the prince. The portion of the prince shall lie between the territory of Judah and the territory of Benjamin.";
asv[22] = "Moreover from the possession of the Levites, and from the possession of the city, being in the midst of that which is the prince\'s, between the border of Judah and the border of Benjamin, it shall be for the prince.";
yng[22] = "And from the possession of the Levites, from the possession of the city, in the midst of that which is to the prince, between the border of Judah and the border of Benjamin, there is to the prince.";
dby[22] = "And from the possession of the Levites and from the possession of the city, being in the midst of that which shall be the prince\'s, between the border of Judah and the border of Benjamin, shall be for the prince.";
web[22] = "Moreover from the possession of the Levites, and from the possession of the city, [being] in the midst [of that] which is the prince\'s, between the border of Judah and the border of Benjamin, shall be for the prince.";
hnv[22] = "Moreover from the possession of the Levites, and from the possession of the city, being in the midst of that which is the prince\'s, between the border of Yehudah and the border of Binyamin, it shall be for the prince.";
vul[22] = "de possessione autem Levitarum et de possessione civitatis in medio partium principis erit inter terminum Iuda et inter terminum Beniamin et ad principem pertinebit";
rsv[23] = "&quot;As for the rest of the tribes: from the east side to the west, Benjamin, one portion.";
asv[23] = "And as for the rest of the tribes: from the east side unto the west side, Benjamin, one [portion].";
yng[23] = "`As to the rest of the tribes, from the east side unto the west side, Benjamin one,";
dby[23] = "And as for the rest of the tribes: from the east side unto the west side, Benjamin one [portion].";
web[23] = "As for the rest of the tribes, from the east side to the west side, Benjamin [shall have] a [portion].";
hnv[23] = "As for the rest of the tribes: from the east side to the west side, Binyamin, one [portion].";
vul[23] = "et reliquis tribubus a plaga orientali usque ad plagam occidentalem Beniamin una";
rsv[24] = "Adjoining the territory of Benjamin, from the east side to the west, Simeon, one portion.";
asv[24] = "And by the border of Benjamin, from the east side unto the west side, Simeon, one [portion].";
yng[24] = "and by the border of Benjamin, from the east side unto the west side, Simeon one,";
dby[24] = "And by the border of Benjamin, from the east side unto the west side, Simeon one.";
web[24] = "And by the border of Benjamin, from the east side to the west side, Simeon [shall have] a [portion].";
hnv[24] = "By the border of Binyamin, from the east side to the west side, Shim`on, one [portion].";
vul[24] = "et contra terminum Beniamin a plaga orientali usque ad plagam occidentalem Symeon una";
rsv[25] = "Adjoining the territory of Simeon, from the east side to the west, Is\'sachar, one portion.";
asv[25] = "And by the border of Simeon, from the east side unto the west side, Issachar, one [portion].";
yng[25] = "and by the border of Simeon, from the east side unto the west side, Issachar one,";
dby[25] = "And by the border of Simeon, from the east side unto the west side, Issachar one.";
web[25] = "And by the border of Simeon, from the east side to the west side, Issachar a [portion].";
hnv[25] = "By the border of Shim`on, from the east side to the west side, Yissakhar, one [portion].";
vul[25] = "et super terminum Symeonis a plaga orientali usque ad plagam occidentis Isachar una";
rsv[26] = "Adjoining the territory of Is\'sachar, from the east side to the west, Zeb\'ulun, one portion.";
asv[26] = "And by the border of Issachar, from the east side unto the west side, Zebulun, one [portion].";
yng[26] = "and by the border of Issachar, from the east side unto the west side, Zebulun one,";
dby[26] = "And by the border of Issachar, from the east side unto the west side, Zebulun one.";
web[26] = "And by the border of Issachar, from the east side to the west side, Zebulun a [portion].";
hnv[26] = "By the border of Yissakhar, from the east side to the west side, Zevulun, one [portion].";
vul[26] = "et super terminum Isachar a plaga orientali usque ad plagam occidentalem Zabulon una";
rsv[27] = "Adjoining the territory of Zeb\'ulun, from the east side to the west, Gad, one portion.";
asv[27] = "And by the border of Zebulun, from the east side unto the west side, Gad, one [portion].";
yng[27] = "and by the border of Zebulun, from the east side unto the west side, Gad one,";
dby[27] = "And by the border of Zebulun, from the east side unto the west side, Gad one.";
web[27] = "And by the border of Zebulun, from the east side to the west side, Gad a [portion].";
hnv[27] = "By the border of Zevulun, from the east side to the west side, Gad, one [portion].";
vul[27] = "et super terminum Zabulon a plaga orientali usque ad plagam maris Gad una";
rsv[28] = "And adjoining the territory of Gad to the south, the boundary shall run from Tamar to the waters of Meribath-ka\'desh, thence along the Brook of Egypt to the Great Sea.";
asv[28] = "And by the border of Gad, at the south side southward, the border shall be even from Tamar unto the waters of Meribath-kadesh, to the brook [of Egypt], unto the great sea.";
yng[28] = "and by the border of Gad, at the south side southward, the border hath been from Tamar [to] the waters of Meriboth-Kadesh, the stream by the great sea.";
dby[28] = "And by the border of Gad, at the south side southward, the border shall be from Tamar [to] the waters of Meribah-Kadesh, by the torrent, unto the great sea.";
web[28] = "And by the border of Gad, at the south side southward, the border shall be even from Tamar [to] the waters of strife [in] Kadesh, [and] to the river towards the great sea.";
hnv[28] = "By the border of Gad, at the south side southward, the border shall be even from Tamar to the waters of Merivat-Kadesh, to the brook [of Mitzrayim], to the great sea.";
vul[28] = "et super terminum Gad ad plagam austri in meridiem et erit finis de Thamar usque ad aquas Contradictionis Cades hereditas contra mare magnum";
rsv[29] = "This is the land which you shall allot as an inheritance among the tribes of Israel, and these are their several portions, says the Lord GOD.";
asv[29] = "This is the land which ye shall divide by lot unto the tribes of Israel for inheritance, and these are their several portions, saith the Lord Jehovah.";
yng[29] = "This [is] the land that ye separate by inheritance to the tribes of Israel, and these [are] their portions -- an affirmation of the Lord Jehovah.";
dby[29] = "This is the land which ye shall divide by lot unto the tribes of Israel for inheritance, and these are their portions, saith the Lord Jehovah.";
web[29] = "This [is] the land which ye shall divide by lot to the tribes of Israel for inheritance, and these [are] their portions, saith the Lord GOD.";
hnv[29] = "This is the land which you shall divide by lot to the tribes of Yisra\'el for inheritance, and these are their several portions, says the Lord GOD.";
vul[29] = "haec est terra quam mittetis in sortem tribubus Israhel et hae partitiones earum ait Dominus Deus";
rsv[30] = "&quot;These shall be the exits of the city: On the north side, which is to be four thousand five hundred cubits by measure,";
asv[30] = "And these are the egresses of the city: On the north side four thousand and five hundred [reeds] by measure;";
yng[30] = "`And these [are] the outgoings of the city on the north side, five hundred, and four thousand measures.";
dby[30] = "And these are the goings out of the city. On the north side, four thousand and five hundred [cubits] by measure.";
web[30] = "And these [are] the goings out of the city on the north side, four thousand and five hundred measures.";
hnv[30] = "These are the exits of the city: On the north side four thousand and five hundred [reeds] by measure;";
vul[30] = "et hii egressus civitatis a plaga septentrionali quingentos et quattuor milia mensurabis";
rsv[31] = "three gates, the gate of Reuben, the gate of Judah, and the gate of Levi, the gates of the city being named after the tribes of Israel.";
asv[31] = "and the gates of the city shall be after the names of the tribes of Israel, three gates northward: the gate of Reuben, one; the gate of Judah, one; the gate of Levi, one.";
yng[31] = "And the gates of the city [are] according to the names of the tribes of Israel; three gates northward: the gate of Reuben one, the gate of Judah one, the gate of Levi one.";
dby[31] = "And the gates of the city shall be after the names of the tribes of Israel: three gates northward: the gate of Reuben, one; the gate of Judah, one; the gate of Levi, one.";
web[31] = "And the gates of the city [shall be] after the names of the tribes of Israel: three gates northward; one gate of Reuben, one gate of Judah, one gate of Levi.";
hnv[31] = "and the gates of the city shall be after the names of the tribes of Yisra\'el, three gates northward: the gate of Re\'uven, one; the gate of Yehudah, one; the gate of Levi, one.";
vul[31] = "et portae civitatis in nominibus tribuum Israhel portae tres a septentrione porta Ruben una porta Iudae una porta Levi una";
rsv[32] = "On the east side, which is to be four thousand five hundred cubits, three gates, the gate of Joseph, the gate of Benjamin, and the gate of Dan.";
asv[32] = "And at the east side four thousand and five hundred [reeds], and three gates: even the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.";
yng[32] = "And on the east side five hundred, and four thousand, and three gates: the gate of Joseph one, the gate of Benjamin one, the gate of Dan one.";
dby[32] = "And at the east side four thousand and five hundred, and three gates: the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.";
web[32] = "And at the east side four thousand and five hundred: and three gates; one gate of Joseph, one gate of Benjamin, one gate of Dan.";
hnv[32] = "At the east side four thousand and five hundred [reeds], and three gates: even the gate of Yosef, one; the gate of Binyamin, one; the gate of Dan, one.";
vul[32] = "et ad plagam orientalem quingentos et quattuor milia et portae tres porta Ioseph una porta Beniamin una porta Dan una";
rsv[33] = "On the south side, which is to be four thousand five hundred cubits by measure, three gates, the gate of Simeon, the gate of Is\'sachar, and the gate of Zeb\'ulun.";
asv[33] = "And at the south side four thousand and five hundred [reeds] by measure, and three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.";
yng[33] = "And the south side five hundred, and four thousand measures, and three gates: the gate of Simeon one, the gate of Issachar one, the gate of Zebulun one.";
dby[33] = "And at the south side four thousand and five hundred [cubits] by measure, and three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.";
web[33] = "And at the south side four thousand and five hundred measures: and three gates; one gate of Simeon, one gate of Issachar, one gate of Zebulun.";
hnv[33] = "At the south side four thousand and five hundred [reeds] by measure, and three gates: the gate of Shim`on, one; the gate of Yissakhar, one; the gate of Zevulun, one.";
vul[33] = "et ad plagam meridianam quingentos et quattuor milia metieris portam Symeonis unam portam Isachar unam portam Zabulon unam";
rsv[34] = "On the west side, which is to be four thousand five hundred cubits, three gates, the gate of Gad, the gate of Asher, and the gate of Naph\'tali.";
asv[34] = "At the west side four thousand and five hundred [reeds], with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali, one.";
yng[34] = "The west side five hundred, and four thousand, their gates three: the gate of Gad one, the gate of Asher one, the gate of Naphtali one.";
dby[34] = "At the west side four thousand and five hundred, [and] their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali, one.";
web[34] = "And the west side four thousand and five hundred, [with] their three gates: one gate of Gad, one gate of Asher, one gate of Naphtali.";
hnv[34] = "At the west side four thousand and five hundred [reeds], with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naftali, one.";
vul[34] = "et ad plagam occidentalem quingenti et quattuor milia portae eorum tres porta Gad una porta Aser una porta Nepthalim una";
rsv[35] = "The circumference of the city shall be eighteen thousand cubits. And the name of the city henceforth shall be, The LORD is there.&quot;";
asv[35] = "It shall be eighteen thousand [reeds] round about: and the name of the city from that day shall be, Jehovah is there.";
yng[35] = "Round about [is] eighteen thousand, and the renown of the city [is] from the day Jehovah [is] there.\'";
dby[35] = "Round about it was eighteen thousand [cubits]; and the name of the city from that day, Jehovah is there.";
web[35] = "The circuit [was] eighteen thousand [measures]: and the name of the city from [that] day [shall be], The LORD [is] there.";
hnv[35] = "It shall be eighteen thousand [reeds] round about: and the name of the city from that day shall be, the LORD is there.";
vul[35] = "per circuitum decem et octo milia et nomen civitatis ex illa die Dominus ibidem";
