csb[1] = "&quot;When you divide the land by lot as an inheritance, set aside a donation to the LORD, a holy portion of the land, 8 1/3 miles long and 6 2/3 miles wide. This entire region will be holy.";
csb[2] = "&quot;In this area there will be a square section for the sanctuary, 875 by 875 feet, with 87 1/2 feet of open space all around it.";
csb[3] = "&quot;From this holy portion, you will measure off an area 8 1/3 miles long and 3 1/3 miles wide, in which the sanctuary, the most holy place, will stand.";
csb[4] = "&quot;It will be a holy area of the land to be used by the priests who minister in the sanctuary, who approach to serve the LORD. It will be a place for their houses, as well as a holy area for the sanctuary.";
csb[5] = "&quot;There will be another area 8 1/3 miles long and 3 1/3 miles wide for the Levites who minister in the temple; it will be their possession for towns to live in.";
csb[6] = "&quot;As the property of the city, set aside an area 1 2/3 miles wide and 8 1/3 miles long, adjacent to the holy donation of land. It will be for the whole house of Israel.";
csb[7] = "&quot;And the prince will have the area on each side of the holy donation of land and the city\'s property, adjacent to the holy donation and the city\'s property, stretching to the west on the west side and to the east on the east side. Its length will correspond to one of the tribal portions from the western boundary to the eastern boundary.";
csb[8] = "&quot;This will be his land as a possession in Israel. My princes will no longer oppress my people but give the rest of the land to the house of Israel according to their tribes.";
csb[9] = "&quot;This is what the Lord GOD says: You have gone too far, princes of Israel! Put away violence and oppression and do what is just and right. Put an end to your evictions of my people.&quot; This is the declaration of the Lord GOD.";
csb[10] = "&quot;You are to have honest scales, an honest dry measure, and an honest liquid measure.";
csb[11] = "&quot;The dry measure and the liquid measure will be uniform, with the liquid measure containing 5 1/2 gallons and the dry measure holding half a bushel. Their measurement will be a tenth of the standard larger capacity measure.";
csb[12] = "&quot;The shekel will weigh twenty gerahs. Your mina will equal sixty shekels.";
csb[13] = "&quot;This is the contribution you are to offer: Three quarts from five bushels of wheat and three quarts from five bushels of barley.";
csb[14] = "&quot;The quota of oil in liquid measures will be one percent of every cor. The cor equals ten liquid measures or one standard larger capacity measure, since ten liquid measures equal one standard larger capacity measure.";
csb[15] = "&quot;And the quota from the flock is one animal out of every two hundred from the well-watered pastures of Israel. These are for the grain offerings, burnt offerings, and fellowship offerings, to make atonement for the people.&quot; This is the declaration of the Lord GOD.";
csb[16] = "&quot;All the people of the land must take part in this contribution for the prince in Israel.";
csb[17] = "&quot;Then the burnt offerings, grain offerings, and drink offerings for the festivals, New Moons, and Sabbaths -- for all the appointed times of the house of Israel -- will be the prince\'s responsibility. He will provide the sin offerings, grain offerings, burnt offerings, and fellowship offerings to make atonement on behalf of the house of Israel.";
csb[18] = "&quot;This is what the Lord GOD says: In the first month, on the first day of the month, you are to take a young, unblemished bull and purify the sanctuary.";
csb[19] = "&quot;The priest is to take some of the blood from the sin offering and apply it to the temple doorposts, the four corners of the altar\'s ledge, and the doorposts of the gate of the inner court.";
csb[20] = "&quot;You are to do the same thing on the seventh day of the month for everyone who sins unintentionally or through ignorance. In this way you will make atonement for the temple.";
csb[21] = "&quot;In the first month, on the fourteenth day of the month, you are to celebrate the Passover, a festival of seven days during which unleavened bread will be eaten.";
csb[22] = "&quot;On that day the prince will provide a bull as a sin offering on behalf of himself and all the people of the land.";
csb[23] = "&quot;During the seven days of the festival, he will provide seven bulls and seven rams without blemish as a burnt offering to the LORD on each of the seven days, along with a male goat each day for a sin offering.";
csb[24] = "&quot;He will also provide a grain offering of half a bushel per bull and half a bushel per ram, along with a gallon of oil for every half bushel.";
csb[25] = "&quot;At the festival that begins on the fifteenth day of the seventh month, he will provide the same things for seven days -- the same sin offerings, burnt offerings, grain offerings, and oil.";
kjv[1] = "Moreover, when ye shall divide by lot the land for inheritance, ye shall offer an oblation unto the LORD, an holy portion of the land: the length [shall be] the length of five and twenty thousand [reeds], and the breadth [shall be] ten thousand. This [shall be] holy in all the borders thereof round about.";
rsv[1] = "&quot;When you allot the land as a possession, you shall set apart for the LORD a portion of the land as a holy district, twenty-five thousand cubits long and twenty thousand cubits broad; it shall be holy throughout its whole extent.";
asv[1] = "Moreover, when ye shall divide by lot the land for inheritance, ye shall offer an oblation unto Jehovah, a holy portion of the land; the length shall be the length of five and twenty thousand [reeds], and the breadth shall be ten thousand: it shall be holy in all the border thereof round about.";
yng[1] = "And in your causing the land to fall in inheritance, ye lift up a heave-offering to Jehovah, a holy [portion] of the land: the length -- five and twenty thousand [is] the length, and the breadth ten thousand; it [is] holy in all its border round about.";
dby[1] = "And when ye shall divide by lot the land for inheritance, ye shall offer a heave-offering unto Jehovah, a holy portion of the land: the length shall be the length of five and twenty thousand [cubits], and the breadth ten thousand. This shall be holy in all the borders thereof round about.";
web[1] = "Moreover, when ye shall divide by lot the land for inheritance, ye shall offer an oblation to the LORD, a holy portion of the land: the length [shall be] the length of five and twenty thousand [reeds], and the breadth [shall be] ten thousand. This [shall be] holy in all its borders on every side.";
hnv[1] = "Moreover, when you shall divide by lot the land for inheritance, you shall offer an offering to the LORD, a holy portion of the land; the length shall be the length of twenty-five thousand [reeds], and the breadth shall be ten thousand: it shall be holy in all the border of it round about.";
vul[1] = "cumque coeperitis terram dividere sortito separate primitias Domino sanctificatum de terra longitudine viginti quinque milia et latitudine decem milia sanctificatum erit in omni termino eius per circuitum";
kjv[2] = "Of this there shall be for the sanctuary five hundred [in length], with five hundred [in breadth], square round about; and fifty cubits round about for the suburbs thereof.";
rsv[2] = "Of this a square plot of five hundred by five hundred cubits shall be for the sanctuary, with fifty cubits for an open space around it.";
asv[2] = "Of this there shall be for the holy place five hundred [in length] by five hundred [in breadth], square round about; and fifty cubits for the suburbs thereof round about.";
yng[2] = "There is of this for the sanctuary five hundred by five hundred, square, round about; and fifty cubits of suburb [is] to it round about.";
dby[2] = "Of this there shall be for the sanctuary five hundred [reeds] by five hundred, square round about; and fifty cubits round about for the suburbs thereof.";
web[2] = "Of this there shall be for the sanctuary five hundred [in length], with five hundred [in breadth], square around; and fifty cubits around for the suburbs of it.";
hnv[2] = "Of this there shall be for the holy place five hundred [in length] by five hundred [in breadth], square round about; and fifty cubits for the suburbs of it round about.";
vul[2] = "et erit ex omni parte sanctificatum quingentos per quingentos quadrifariam per circuitum et quinquaginta cubitis in suburbana eius per gyrum";
kjv[3] = "And of this measure shalt thou measure the length of five and twenty thousand, and the breadth of ten thousand: and in it shall be the sanctuary [and] the most holy [place].";
rsv[3] = "And in the holy district you shall measure off a section twenty-five thousand cubits long and ten thousand broad, in which shall be the sanctuary, the most holy place.";
asv[3] = "And of this measure shalt thou measure a length of five and twenty thousand, and a breadth of ten thousand: and in it shall be the sanctuary, which is most holy.";
yng[3] = "And by this measure thou dost measure: the length [is] five and twenty thousand, and the breadth ten thousand: and in it is the sanctuary, the holy of holies.";
dby[3] = "And of this measure shalt thou measure the length of five and twenty thousand, and the breadth of ten thousand; and in it shall be the sanctuary, the holy of holies.";
web[3] = "And of this measure shalt thou measure the length of five and twenty thousand, and the breadth of ten thousand: and in it shall be the sanctuary [and] the most holy [place].";
hnv[3] = "Of this measure shall you measure a length of twenty-five thousand, and a breadth of ten thousand: and in it shall be the sanctuary, which is most holy.";
vul[3] = "et a mensura ista mensurabis longitudinem viginti quinque milium et latitudinem decem milium et in ipso erit templum sanctumque sanctorum";
kjv[4] = "The holy [portion] of the land shall be for the priests the ministers of the sanctuary, which shall come near to minister unto the LORD: and it shall be a place for their houses, and an holy place for the sanctuary.";
rsv[4] = "It shall be the holy portion of the land; it shall be for the priests, who minister in the sanctuary and approach the LORD to minister to him; and it shall be a place for their houses and a holy place for the sanctuary.";
asv[4] = "It is a holy portion of the land; it shall be for the priests, the ministers of the sanctuary, that come near to minister unto Jehovah; and it shall be a place for their houses, and a holy place for the sanctuary.";
yng[4] = "The holy [portion] of the land it [is]; for priests, ministrants of the sanctuary, it is, who are drawing near to serve Jehovah; and it hath been to them a place for houses, and a holy place for a sanctuary.";
dby[4] = "This is the holy [portion] of the land; it shall be for the priests who do the service of the sanctuary, who draw near to serve Jehovah, and it shall be a place for their houses, and a holy place for the sanctuary.";
web[4] = "The holy [portion] of the land shall be for the priests the ministers of the sanctuary, who shall come near to minister to the LORD: and it shall be a place for their houses, and a holy place for the sanctuary.";
hnv[4] = "It is a holy portion of the land; it shall be for the Kohanim, the ministers of the sanctuary, who come near to minister to the LORD; and it shall be a place for their houses, and a holy place for the sanctuary.";
vul[4] = "sanctificatum de terra erit sacerdotibus ministris sanctuarii qui accedunt ad ministerium Domini et erit eis locus in domos et in sanctuarium sanctitatis";
kjv[5] = "And the five and twenty thousand of length, and the ten thousand of breadth, shall also the Levites, the ministers of the house, have for themselves, for a possession for twenty chambers.";
rsv[5] = "Another section, twenty-five thousand cubits long and ten thousand cubits broad, shall be for the Levites who minister at the temple, as their possession for cities to live in.";
asv[5] = "And five and twenty thousand in length, and ten thousand in breadth, shall be unto the Levites, the ministers of the house, for a possession unto themselves, [for] twenty chambers.";
yng[5] = "`And of the five and twenty thousand of length, and of the ten thousand of breadth, there is to the Levites, ministrants of the house, for them -- for a possession -- twenty chambers.";
dby[5] = "And [a space of] five and twenty thousand in length, and ten thousand in breadth, shall the Levites, who do the service of the house, have for themselves, for a possession, for their habitations.";
web[5] = "And the five and twenty thousand of length, and the ten thousand of breadth, shall also the Levites, the ministers of the house, have for themselves, for a possession for twenty chambers.";
hnv[5] = "Twenty-five thousand in length, and ten thousand in breadth, shall be to the Levites, the ministers of the house, for a possession to themselves, [for] twenty chambers.";
vul[5] = "viginti quinque autem milia longitudinis et decem milia latitudinis erunt Levitis qui ministrant domui ipsi possidebunt viginti gazofilacia";
kjv[6] = "And ye shall appoint the possession of the city five thousand broad, and five and twenty thousand long, over against the oblation of the holy [portion]: it shall be for the whole house of Israel.";
rsv[6] = "&quot;Alongside the portion set apart as the holy district you shall assign for the possession of the city an area five thousand cubits broad, and twenty-five thousand cubits long; it shall belong to the whole house of Israel.";
asv[6] = "And ye shall appoint the possession of the city five thousand broad, and five and twenty thousand long, side by side with the oblation of the holy portion: it shall be for the whole house of Israel.";
yng[6] = "`And of the possession of the city ye give five thousand of breadth, and of length five and twenty thousand, over-against the heave-offering of the holy [portion]: to all the house of Israel it is.";
dby[6] = "And ye shall appoint the possession of the city five thousand in breadth, and five and twenty thousand in length, alongside of the holy heave-offering: it shall be for the whole house of Israel.";
web[6] = "And ye shall appoint the possession of the city five thousand broad, and five and twenty thousand long, over against the oblation of the holy [portion]: it shall be for the whole house of Israel.";
hnv[6] = "You shall appoint the possession of the city five thousand broad, and twenty-five thousand long, side by side with the offering of the holy portion: it shall be for the whole house of Yisra\'el.";
vul[6] = "et possessionem civitatis dabitis quinque milia latitudinis et longitudinis viginti quinque milia secundum separationem sanctuarii omni domui Israhel";
kjv[7] = "And a [portion shall be] for the prince on the one side and on the other side of the oblation of the holy [portion], and of the possession of the city, before the oblation of the holy [portion], and before the possession of the city, from the west side westward, and from the east side eastward: and the length [shall be] over against one of the portions, from the west border unto the east border.";
rsv[7] = "&quot;And to the prince shall belong the land on both sides of the holy district and the property of the city, alongside the holy district and the property of the city, on the west and on the east, corresponding in length to one of the tribal portions, and extending from the western to the eastern boundary of the land.";
asv[7] = "And [whatsoever is] for the prince [shall be] on the one side and on the other side of the holy oblation and of the possession of the city, in front of the holy oblation and in front of the possession of the city, on the west side westward, and on the east side eastward; and in length answerable unto one of the portions, from the west border unto the east border.";
yng[7] = "As to the prince, on this side, and on that side, of the heave-offering of the holy place, and of the possession of the city, at the front of the heave-offering of the holy place, and at the front of the possession of the city, from the west corner westward, and from the east corner eastward -- and the length [is] over-against one of the portions from the west border unto the east border --";
dby[7] = "And the prince shall have [his portion] on the one side and on the other side of the holy heave-offering and of the possession of the city, over against the holy heave-offering, and over against the possession of the city, from the west side westward, and from the east side eastward; and in length answering to one of the portions [of the tribes] from the west border unto the east border.";
web[7] = "And [a portion shall be] for the prince on the one side and on the other side of the oblation of the holy [portion], and of the possession of the city, before the oblation of the holy [portion], and before the possession of the city, from the west side westward, and from the east side eastward: and the length [shall be] over against one of the portions, from the west border to the east border.";
hnv[7] = "[Whatever is] for the prince [shall be] on the one side and on the other side of the holy offering and of the possession of the city, in front of the holy offering and in front of the possession of the city, on the west side westward, and on the east side eastward; and in length answerable to one of the portions, from the west border to the east border.";
vul[7] = "principi quoque hinc et inde in separationem sanctuarii et in possessionem civitatis contra faciem separationis sanctuarii et contra faciem possessionis urbis a latere maris usque ad mare et a latere orientis usque ad orientem longitudinem autem iuxta unamquamque partium a termino occidentali usque ad terminum orientalem";
kjv[8] = "In the land shall be his possession in Israel: and my princes shall no more oppress my people; and [the rest of] the land shall they give to the house of Israel according to their tribes.";
rsv[8] = "It is to be his property in Israel. And my princes shall no more oppress my people; but they shall let the house of Israel have the land according to their tribes.";
asv[8] = "In the land it shall be to him for a possession in Israel: and my princes shall no more oppress my people; but they shall give the land to the house of Israel according to their tribes.";
yng[8] = "of the land there is to him for a possession in Israel, and My princes do not oppress any more My people, and the land they give to the house of Israel according to their tribes.";
dby[8] = "As land shall it be his for a possession in Israel; and my princes shall no more oppress my people; but they shall give the land to the house of Israel according to their tribes.";
web[8] = "In the land shall be his possession in Israel: and my princes shall no more oppress my people; and [the rest of] the land shall they give to the house of Israel according to their tribes.";
hnv[8] = "In the land it shall be to him for a possession in Yisra\'el: and my princes shall no more oppress my people; but they shall give the land to the house of Yisra\'el according to their tribes.";
vul[8] = "de terra erit ei possessio in Israhel et non depopulabuntur ultra principes populum meum sed terram dabunt domui Israhel secundum tribus eorum";
kjv[9] = "Thus saith the Lord GOD; Let it suffice you, O princes of Israel: remove violence and spoil, and execute judgment and justice, take away your exactions from my people, saith the Lord GOD.";
rsv[9] = "&quot;Thus says the Lord GOD: Enough, O princes of Israel! Put away violence and oppression, and execute justice and righteousness; cease your evictions of my people, says the Lord GOD.";
asv[9] = "Thus saith the Lord Jehovah: Let it suffice you, O princes of Israel: remove violence and spoil, and execute justice and righteousness; take away your exactions from my people, saith the Lord Jehovah.";
yng[9] = "`Thus said the Lord Jehovah: Enough to you -- princes of Israel; violence and spoil turn aside, and judgment and righteousness do; lift up your exactions from off My people -- an affirmation of the Lord Jehovah.";
dby[9] = "Thus saith the Lord Jehovah: Let it suffice you, princes of Israel! Put away violence and spoil, and execute judgment and justice; take off your exactions from my people, saith the Lord Jehovah.";
web[9] = "Thus saith the Lord GOD; Let it suffice you, O princes of Israel: remove violence and spoil, and execute judgment and justice, take away your exactions from my people, saith the Lord GOD.";
hnv[9] = "Thus says the Lord GOD: Let it suffice you, princes of Yisra\'el: remove violence and spoil, and execute justice and righteousness; dispossessing my people, says the Lord GOD.";
vul[9] = "haec dicit Dominus Deus sufficiat vobis principes Israhel iniquitatem et rapinas intermittite et iudicium et iustitiam facite separate confinia vestra a populo meo ait Dominus Deus";
kjv[10] = "Ye shall have just balances, and a just ephah, and a just bath.";

asv[10] = "Ye shall have just balances, and a just ephah, and a just bath.";
yng[10] = "Just balances, and a just ephah, and a just bath -- ye have.";
dby[10] = "Ye shall have just balances, and a just ephah, and a just bath.";
web[10] = "Ye shall have just balances, and a just ephah, and a just bath.";
hnv[10] = "You shall have just balances, and a just efah, and a just bath.";

rsv[11] = "The ephah and the bath shall be of the same measure, the bath containing one tenth of a homer, and the ephah one tenth of a homer; the homer shall be the standard measure.";
asv[11] = "The ephah and the bath shall be of one measure, that the bath may contain the tenth part of a homer, and the ephah the tenth part of a homer: the measure thereof shall be after the homer.";
yng[11] = "The ephah and the bath is of one measure, for the bath to bear a tenth of the homer, and the ephah a tenth of the homer: according to the homer is its measurement.";
dby[11] = "The ephah and the bath shall be of one measure, so that the bath may contain the tenth part of a homer, and the ephah the tenth part of a homer: the measure thereof shall be according to the homer.";
web[11] = "The ephah and the bath shall be of one measure, that the bath may contain the tenth part of a homer, and the ephah the tenth part of a homer: the measure of it shall be after the homer.";
hnv[11] = "The efah and the bath shall be of one measure, that the bath may contain the tenth part of a homer, and the efah the tenth part of a homer: the measure of it shall be after the homer.";

kjv[12] = "And the shekel [shall be] twenty gerahs: twenty shekels, five and twenty shekels, fifteen shekels, shall be your maneh.";
rsv[12] = "The shekel shall be twenty gerahs; five shekels shall be five shekels, and ten shekels shall be ten shekels, and your mina shall be fifty shekels.";
asv[12] = "And the shekel shall be twenty gerahs; twenty shekels, five and twenty shekels, fifteen shekels, shall be your maneh.";
yng[12] = "And, the shekel [is] twenty gerah: twenty shekels, five and twenty shekels, fifteen shekels -- is your maneh.";
dby[12] = "And the shekel shall be twenty gerahs; twenty shekels, five and twenty shekels, fifteen shekels, shall be your maneh.";
web[12] = "And the shekel [shall be] twenty gerahs: twenty shekels, five and twenty shekels, fifteen shekels, shall be your maneh.";
hnv[12] = "The shekel shall be twenty gerahs. Twenty shekels plus twenty-five shekels plus fifteen shekels shall be your mina.";

rsv[13] = "&quot;This is the offering which you shall make: one sixth of an ephah from each homer of wheat, and one sixth of an ephah from each homer of barley,";
asv[13] = "This is the oblation that ye shall offer: the sixth part of an ephah from a homer of wheat; and ye shall give the sixth part of an ephah from a homer of barley;";
yng[13] = "`This [is] the heave-offering that ye lift up; a sixth part of the ephah of a homer of wheat, also ye have given a sixth part of the ephah of a homer of barley,";
dby[13] = "This is the heave-offering which ye shall offer: the sixth part of an ephah out of a homer of wheat, and ye shall give the sixth part of an ephah out of a homer of barley;";

rsv[14] = "and as the fixed portion of oil, one tenth of a bath from each cor (the cor, like the homer, contains ten baths);";
asv[14] = "and the set portion of oil, of the bath of oil, the tenth part of a bath out of the cor, [which is] ten baths, even a homer (for ten baths are a homer);";
yng[14] = "and the portion of oil, the bath of oil, a tenth part of the bath out of the cor, a homer of ten baths -- for ten baths [are] a homer;";
dby[14] = "and the set portion of oil, by the bath of oil, the tenth part of a bath out of a cor, [which is] a homer of ten baths, for ten baths are a homer;";
web[14] = "Concerning the ordinance of oil, the bath of oil, [ye shall offer] the tenth part of a bath out of the cor, [which is] a homer of ten baths: for ten baths [are] a homer:";

vul[14] = "mensura quoque olei batus olei decima pars chori est et decem bati chorum faciunt quia decem bati implent chorum";
kjv[15] = "And one lamb out of the flock, out of two hundred, out of the fat pastures of Israel; for a meat offering, and for a burnt offering, and for peace offerings, to make reconciliation for them, saith the Lord GOD.";
rsv[15] = "and one sheep from every flock of two hundred, from the families of Israel. This is the offering for cereal offerings, burnt offerings, and peace offerings, to make atonement for them, says the Lord GOD.";
asv[15] = "and one lamb of the flock, out of two hundred, from the well-watered pastures of Israel;--for a meal-offering, and for a burnt-offering, and for peace-offerings, to make atonement for them, saith the Lord Jehovah.";
yng[15] = "and one lamb out of the flock, out of two hundred, out of the watered country of Israel, for a present, and for a burnt-offering, and for peace-offerings, to make atonement by them -- an affirmation of the Lord Jehovah.";
dby[15] = "and one lamb out of the flock, out of two hundred, from the well-watered pastures of Israel; -- for an oblation, and for a burnt-offering, and for peace-offerings, to make atonement for them, saith the Lord Jehovah.";
web[15] = "And one lamb out of the flock, out of two hundred, out of the fat pastures of Israel; for a meat-offering, and for a burnt-offering, and for peace-offerings, to make reconciliation for them, saith the Lord GOD.";
hnv[15] = "and one lamb of the flock, out of two hundred, from the well-watered pastures of Yisra\'el; -for a meal-offering, and for a burnt offering, and for peace-offerings, to make atonement for them, says the Lord GOD.";
vul[15] = "et arietem unum de grege ducentorum de his quae nutriunt Israhel in sacrificium et in holocaustum et in pacifica ad expiandum pro eis ait Dominus Deus";
kjv[16] = "All the people of the land shall give this oblation for the prince in Israel.";
rsv[16] = "All the people of the land shall give this offering to the prince in Israel.";
asv[16] = "All the people of the land shall give unto this oblation for the prince in Israel.";
yng[16] = "All the people of the land are at this heave-offering for the prince in Israel.";
dby[16] = "All the people of the land shall be [held] to this heave-offering for the prince in Israel.";
web[16] = "All the people of the land shall give this oblation for the prince in Israel.";
hnv[16] = "All the people of the land shall give to this offering for the prince in Yisra\'el.";
vul[16] = "omnis populus terrae tenebitur primitiis his principi in Israhel";
kjv[17] = "And it shall be the prince\'s part [to give] burnt offerings, and meat offerings, and drink offerings, in the feasts, and in the new moons, and in the sabbaths, in all solemnities of the house of Israel: he shall prepare the sin offering, and the meat offering, and the burnt offering, and the peace offerings, to make reconciliation for the house of Israel.";
rsv[17] = "It shall be the prince\'s duty to furnish the burnt offerings, cereal offerings, and drink offerings, at the feasts, the new moons, and the sabbaths, all the appointed feasts of the house of Israel: he shall provide the sin offerings, cereal offerings, burnt offerings, and peace offerings, to make atonement for the house of Israel.";
asv[17] = "And it shall be the prince\'s part to give the burnt-offerings, and the meal-offerings, and the drink-offerings, in the feasts, and on the new moons, and on the sabbaths, in all the appointed feasts of the house of Israel: he shall prepare the sin-offering, and the meal-offering, and the burnt-offering, and the peace-offerings, to make atonement for the house of Israel.";
yng[17] = "And on the prince are the burnt-offerings, and the present, and the libation, in feasts, and in new moons, and in sabbaths, in all appointed times of the house of Israel: he doth make the sin-offering, and the present, and the burnt-offering, and the peace-offerings, to make atonement for the house of Israel.";
dby[17] = "And it shall be the prince\'s part [to supply] the burnt-offerings, and the oblation, and the drink-offering, at the feasts, and at the new moons, and on the sabbaths, in all the solemnities of the house of Israel: it is he that shall prepare the sin-offering, and the oblation, and the burnt-offering, and the peace-offerings, to make atonement for the house of Israel.";
web[17] = "And it shall be the prince\'s part [to give] burnt-offerings, and meat-offerings, and drink-offerings, in the feasts, and in the new moons, and in the sabbaths, in all solemnities of the house of Israel: he shall prepare the sin-offering, and the meat-offering, and the burnt-offering, and the peace-offerings, to make reconciliation for the house of Israel.";
hnv[17] = "It shall be the prince\'s part to give the burnt offerings, and the meal-offerings, and the drink-offerings, in the feasts, and on the new moons, and on the Shabbatot, in all the appointed feasts of the house of Yisra\'el: he shall prepare the sin-offering, and the meal-offering, and the burnt offering, and the peace-offerings, to make atonement for the house of Yisra\'el.";
vul[17] = "et super principem erunt holocausta et sacrificium et libamina in sollemnitatibus et in kalendis et in sabbatis in universis sollemnitatibus domus Israhel ipse faciat pro peccato sacrificium et holocaustum et pacifica ad expiandum pro domo Israhel";
kjv[18] = "Thus saith the Lord GOD; In the first [month], in the first [day] of the month, thou shalt take a young bullock without blemish, and cleanse the sanctuary:";
rsv[18] = "&quot;Thus says the Lord GOD: In the first month, on the first day of the month, you shall take a young bull without blemish, and cleanse the sanctuary.";
asv[18] = "Thus saith the Lord Jehovah: In the first [month], in the first [day] of the month, thou shalt take a young bullock without blemish; and thou shalt cleanse the sanctuary.";
yng[18] = "`Thus said the Lord Jehovah: In the first [month], in the first of the month, thou dost take a bullock, a son of the herd, a perfect one, and hast cleansed the sanctuary:";
dby[18] = "Thus saith the Lord Jehovah: In the first [month], on the first of the month, thou shalt take a young bullock, without blemish, and thou shalt purge the sanctuary.";
web[18] = "Thus saith the Lord GOD; In the first [month], in the first [day] of the month, thou shalt take a young bullock without blemish, and cleanse the sanctuary:";
hnv[18] = "Thus says the Lord GOD: In the first [month], in the first [day] of the month, you shall take a young bull without blemish; and you shall cleanse the sanctuary.";
vul[18] = "haec dicit Dominus Deus in primo mense una mensis sumes vitulum de armento inmaculatum et expiabis sanctuarium";
kjv[19] = "And the priest shall take of the blood of the sin offering, and put [it] upon the posts of the house, and upon the four corners of the settle of the altar, and upon the posts of the gate of the inner court.";
rsv[19] = "The priest shall take some of the blood of the sin offering and put it on the doorposts of the temple, the four corners of the ledge of the altar, and the posts of the gate of the inner court.";
asv[19] = "And the priest shall take of the blood of the sin-offering, and put it upon the door-posts of the house, and upon the four corners of the ledge of the altar, and upon the posts of the gate of the inner court.";
yng[19] = "and the priest hath taken of the blood of the sin offering, and hath put on the door-post of the house, and on the four corners of the border of the altar, and on the post of the gate of the inner court.";
dby[19] = "And the priest shall take of the blood of the sin-offering, and put it upon the posts of the house, and upon the four corners of the settle of the altar, and upon the posts of the gate of the inner court.";
web[19] = "And the priest shall take of the blood of the sin-offering, and put [it] upon the posts of the house, and upon the four corners of the settle of the altar, and upon the posts of the gate of the inner court.";
hnv[19] = "The Kohen shall take of the blood of the sin-offering, and put it on the door-posts of the house, and on the four corners of the ledge of the altar, and on the posts of the gate of the inner court.";
vul[19] = "et tollet sacerdos de sanguine quod erit pro peccato et ponet in postibus domus et in quattuor angulis crepidinis altaris et in postibus portae atrii interioris";
kjv[20] = "And so thou shalt do the seventh [day] of the month for every one that erreth, and for [him that is] simple: so shall ye reconcile the house.";
rsv[20] = "You shall do the same on the seventh day of the month for any one who has sinned through error or ignorance; so you shall make atonement for the temple.";
asv[20] = "And so thou shalt do on the seventh [day] of the month for every one that erreth, and for him that is simple: so shall ye make atonement for the house.";
yng[20] = "And so thou dost do on the seventh of the month, because of each erring one, and because of the simple one -- and ye have purified the house.";
dby[20] = "So thou shalt do also on the seventh of the month for every one that erreth, and for the simple; and ye shall make atonement for the house.";
web[20] = "And so thou shalt do the seventh [day] of the month for every one that erreth, and for [him that is] simple: so shall ye reconcile the house.";
hnv[20] = "So you shall do on the seventh [day] of the month for everyone who errs, and for him who is simple: so shall you make atonement for the house.";
vul[20] = "et sic facies in septima mensis pro unoquoque qui ignoravit et errore deceptus est et expiabitis pro domo";
kjv[21] = "In the first [month], in the fourteenth day of the month, ye shall have the passover, a feast of seven days; unleavened bread shall be eaten.";
rsv[21] = "&quot;In the first month, on the fourteenth day of the month, you shall celebrate the feast of the passover, and for seven days unleavened bread shall be eaten.";
asv[21] = "In the first [month], in the fourteenth day of the month, ye shall have the passover, a feast of seven days; unleavened bread shall be eaten.";
yng[21] = "`In the first [month], in the fourteenth day of the month, ye have the passover, a feast of seven days, unleavened food is eaten.";
dby[21] = "In the first [month], on the fourteenth day of the month, ye shall have the passover, a feast of seven days: unleavened bread shall be eaten.";
web[21] = "In the first [month], in the fourteenth day of the month, ye shall have the passover, a feast of seven days; unleavened bread shall be eaten.";
hnv[21] = "In the first [month], in the fourteenth day of the month, you shall have the Pesach, a feast of seven days; matzah shall be eaten.";
vul[21] = "in primo mense quartadecima die mensis erit vobis paschae sollemnitas septem diebus azyma comedentur";
kjv[22] = "And upon that day shall the prince prepare for himself and for all the people of the land a bullock [for] a sin offering.";
rsv[22] = "On that day the prince shall provide for himself and all the people of the land a young bull for a sin offering.";
asv[22] = "And upon that day shall the prince prepare for himself and for all the people of the land a bullock for a sin-offering.";
yng[22] = "And the prince hath prepared on that day, for himself, and for all the people of the land, a bullock, a sin-offering.";
dby[22] = "And upon that day shall the prince offer for himself and for all the people of the land a bullock for a sin-offering.";
web[22] = "And upon that day shall the prince prepare for himself and for all the people of the land a bullock [for] a sin-offering.";
hnv[22] = "On that day shall the prince prepare for himself and for all the people of the land a bull for a sin-offering.";
vul[22] = "et faciet princeps in die illa pro se et pro universo populo terrae vitulum pro peccato";
kjv[23] = "And seven days of the feast he shall prepare a burnt offering to the LORD, seven bullocks and seven rams without blemish daily the seven days; and a kid of the goats daily [for] a sin offering.";
rsv[23] = "And on the seven days of the festival he shall provide as a burnt offering to the LORD seven young bulls and seven rams without blemish, on each of the seven days; and a he-goat daily for a sin offering.";
asv[23] = "And the seven days of the feast he shall prepare a burnt-offering to Jehovah, seven bullocks and seven rams without blemish daily the seven days; and a he-goat daily for a sin-offering.";
yng[23] = "And the seven days of the feast he prepareth a burnt-offering to Jehovah, seven bullocks, and seven rams, perfect ones, daily seven days, and a sin-offering, a kid of the goats, daily.";
dby[23] = "And the seven days of the feast he shall offer a burnt-offering to Jehovah, seven bullocks and seven rams without blemish daily for the seven days; and a he-goat daily for a sin-offering.";
web[23] = "And seven days of the feast he shall prepare a burnt-offering to the LORD, seven bullocks and seven rams without blemish daily the seven days; and a kid of the goats daily [for] a sin-offering.";
hnv[23] = "The seven days of the feast he shall prepare a burnt offering to the LORD, seven bulls and seven rams without blemish daily the seven days; and a male goat daily for a sin-offering.";
vul[23] = "et in septem dierum sollemnitate faciet holocaustum Domino septem vitulos et septem arietes inmaculatos cotidie septem diebus et pro peccato hircum caprarum cotidie";
kjv[24] = "And he shall prepare a meat offering of an ephah for a bullock, and an ephah for a ram, and an hin of oil for an ephah.";
rsv[24] = "And he shall provide as a cereal offering an ephah for each bull, an ephah for each ram, and a hin of oil to each ephah.";
asv[24] = "And he shall prepare a meal-offering, an ephah for a bullock, and an ephah for a ram, and a hin of oil to an ephah.";
yng[24] = "And a present of an ephah for a bullock, and an ephah for a ram, he doth prepare, and of oil a hin for an ephah.";
dby[24] = "And he shall offer an oblation of an ephah for a bullock, and an ephah for a ram; and oil, a hin for an ephah.";
web[24] = "And he shall prepare a meat-offering of an ephah for a bullock, and an ephah for a ram, and a hin of oil for an ephah.";
hnv[24] = "He shall prepare a meal-offering, an efah for a bull, and an efah for a ram, and a hin of oil to an efah.";
vul[24] = "et sacrificium oephi per vitulum et oephi per arietem faciet et olei hin per singula oephi";
kjv[25] = "In the seventh [month], in the fifteenth day of the month, shall he do the like in the feast of the seven days, according to the sin offering, according to the burnt offering, and according to the meat offering, and according to the oil.";
rsv[25] = "In the seventh month, on the fifteenth day of the month and for the seven days of the feast, he shall make the same provision for sin offerings, burnt offerings, and cereal offerings, and for the oil.";
asv[25] = "In the seventh [month], in the fifteenth day of the month, in the feast, shall he do the like the seven days; according to the sin-offering, according to the burnt-offering, and according to the meal-offering, and according to the oil.";
yng[25] = "In the seventh [month], in the fifteenth day of the month, in the feast, he doth according to these things seven days; as the sin-offering so the burnt-offering, and as the present so also the oil.";
dby[25] = "In the seventh [month], on the fifteenth day of the month, at the feast, shall he do the like seven days, according to the sin-offering, according to the burnt-offering, and according to the oblation, and according to the oil.";
web[25] = "In the seventh [month], in the fifteenth day of the month, shall he do the like in the feast of the seven days, according to the sin-offering, according to the burnt-offering, and according to the meat-offering, and according to the oil.";
hnv[25] = "In the seventh [month], in the fifteenth day of the month, in the feast, shall he do the like the seven days; according to the sin-offering, according to the burnt offering, and according to the meal-offering, and according to the oil.";
vul[25] = "septimo mense quintadecima die mensis in sollemnitate faciet sicut supra dicta sunt per septem dies tam pro peccato quam pro holocausto et in sacrificio et in oleo";
