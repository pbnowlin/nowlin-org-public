csb[1] = "The hand of the LORD was on me, and he brought me out by his Spirit and set me down in the middle of the valley; it was full of bones.";
csb[2] = "He led me all around them. There were a great many of them on the surface of the valley, and they were very dry.";
csb[3] = "Then he said to me, &quot;Son of man, can these bones live? &quot; I replied, &quot;Lord GOD, only you know.&quot;";
csb[4] = "He said to me, &quot;Prophesy concerning these bones and say to them: Dry bones, hear the word of the LORD!";
csb[5] = "&quot;This is what the Lord GOD says to these bones: I will cause breath to enter you, and you will live.";
csb[6] = "&quot;I will put tendons on you, make flesh grow on you, and cover you with skin. I will put breath in you so that you come to life. Then you will know that I am the LORD.&quot;";
csb[7] = "So I prophesied as I had been commanded. While I was prophesying, there was a noise, a rattling sound, and the bones came together, bone to bone.";
csb[8] = "As I looked, tendons appeared on them, flesh grew, and skin covered them, but there was no breath in them.";
csb[9] = "He said to me, &quot;Prophesy to the breath, prophesy, son of man. Say to it: This is what the Lord GOD says: Breath, come from the four winds and breathe into these slain so that they may live! &quot;";
csb[10] = "So I prophesied as he commanded me; the breath entered them, and they came to life and stood on their feet, a vast army.";
csb[11] = "Then he said to me, &quot;Son of man, these bones are the whole house of Israel. Look how they say, \'Our bones are dried up, and our hope has perished; we are cut off.\'";
csb[12] = "&quot;Therefore, prophesy and say to them: \'This is what the Lord GOD says: I am going to open your graves and bring you up from them, my people, and lead you into the land of Israel.";
csb[13] = "&quot;You will know that I am the LORD, my people, when I open your graves and bring you up from them.";
csb[14] = "&quot;I will put my Spirit in you, and you will live, and I will settle you in your own land. Then you will know that I am the LORD. I have spoken, and I will do it. This is the declaration of the LORD.\' &quot;";
csb[15] = "The word of the LORD came to me:";
csb[16] = "&quot;Son of man, take a single stick and write on it: Belonging to Judah and the Israelites associated with him. Then take another stick and write on it: Belonging to Joseph -- the stick of Ephraim -- and all the house of Israel associated with him.";
csb[17] = "&quot;Then join them together into a single stick so that they become one in your hand.";
csb[18] = "&quot;When your people ask you, \'Won\'t you explain to us what you mean by these things? \' --";
csb[19] = "&quot;tell them, \'This is what the Lord GOD says: I am going to take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and put them together with the stick of Judah. I will make them into a single stick so that they become one in my hand.\'";
csb[20] = "&quot;When the sticks you have written on are in your hand and in full view of the people,";
csb[21] = "&quot;tell them, \'This is what the Lord GOD says: I am going to take the Israelites out of the nations where they have gone. I will gather them from all around and bring them into their own land.";
csb[22] = "&quot;I will make them one nation in the land, on the mountains of Israel, and one king will rule over all of them. They will no longer be two nations and will no longer be divided into two kingdoms.";
csb[23] = "&quot;They will not defile themselves anymore with their idols, their abhorrent things, and all their transgressions. I will save them from all their apostasies by which they sinned, and I will cleanse them. Then they will be my people, and I will be their God.";
csb[24] = "&quot;My servant David will be king over them, and there will be one shepherd for all of them. They will follow my ordinances, and keep my statutes and obey them.";
csb[25] = "&quot; \'They will live in the land that I gave to my servant Jacob, where your fathers lived. They will live in it forever with their children and grandchildren, and my servant David will be their prince forever.";
csb[26] = "&quot;I will make a covenant of peace with them; it will be a permanent covenant with them. I will establish and multiply them and will set my sanctuary among them forever.";
csb[27] = "&quot;My dwelling place will be with them; I will be their God, and they will be my people.";
csb[28] = "&quot;When my sanctuary is among them forever, the nations will know that I, the LORD, sanctify Israel.\' &quot;";

web[18] = "And when the children of thy people shall speak to thee, saying, Wilt thou not show us what thou [meanest] by these?";
hnv[18] = "When the children of your people shall speak to you, saying, Will you not show us what you mean by these?";
vul[18] = "cum autem dixerint ad te filii populi tui loquentes nonne indicas nobis quid in his tibi velis";
kjv[19] = "Say unto them, Thus saith the Lord GOD; Behold, I will take the stick of Joseph, which [is] in the hand of Ephraim, and the tribes of Israel his fellows, and will put them with him, [even] with the stick of Judah, and make them one stick, and they shall be one in mine hand.";
rsv[19] = "say to them, Thus says the Lord GOD: Behold, I am about to take the stick of Joseph (which is in the hand of E\'phraim) and the tribes of Israel associated with him; and I will join with it the stick of Judah, and make them one stick, that they may be one in my hand.";
asv[19] = "say unto them, Thus saith the Lord Jehovah: Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel his companions; and I will put them with it, [even] with the stick of Judah, and make them one stick, and they shall be one in my hand.";
yng[19] = "Speak unto them, Thus said the Lord Jehovah: Lo, I am taking the stick of Joseph, that [is] in the hand of Ephraim, and the tribes of Israel his companions, and have given them unto him, with the stick of Judah, and have made them become one stick, and they have been one in My hand.";
dby[19] = "say unto them, Thus saith the Lord Jehovah: Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel his companions, and will put them with this, with the stick of Judah, and make them one stick, and they shall be one in my hand.";
web[19] = "Say to them, Thus saith the Lord GOD; Behold, I will take the stick of Joseph, which [is] in the hand of Ephraim, and the tribes of Israel his fellows, and will put them with him, [even] with the stick of Judah, and make them one stick, and they shall be one in my hand.";
hnv[19] = "tell them, Thus says the Lord GOD: Behold, I will take the stick of Yosef, which is in the hand of Efrayim, and the tribes of Yisra\'el his companions; and I will put them with it, [even] with the stick of Yehudah, and make them one stick, and they shall be one in my hand.";
vul[19] = "loqueris ad eos haec dicit Dominus Deus ecce ego adsumam lignum Ioseph quod est in manu Ephraim et tribus Israhel quae iunctae sunt ei et dabo eas pariter cum ligno Iuda et faciam eas in lignum unum et erunt unum in manu eius";
kjv[20] = "And the sticks whereon thou writest shall be in thine hand before their eyes.";

kjv[21] = "And say unto them, Thus saith the Lord GOD; Behold, I will take the children of Israel from among the heathen, whither they be gone, and will gather them on every side, and bring them into their own land:";
rsv[21] = "then say to them, Thus says the Lord GOD: Behold, I will take the people of Israel from the nations among which they have gone, and will gather them from all sides, and bring them to their own land;";
asv[21] = "And say unto them, Thus saith the Lord Jehovah: Behold, I will take the children of Israel from among the nations, whither they are gone, and will gather them on every side, and bring them into their own land:";
yng[21] = "and speak thou unto them: Thus said the Lord Jehovah: Lo, I am taking the sons of Israel, From among the nations whither they have gone, And have gathered them from round about, And I have brought them in unto their land.";
dby[21] = "And say unto them, Thus saith the Lord Jehovah: Behold, I will take the children of Israel from among the nations, whither they are gone, and will gather them from every side, and bring them into their own land:";

vul[21] = "et dices ad eos haec dicit Dominus Deus ecce ego adsumam filios Israhel de medio nationum ad quas abierunt et congregabo eos undique et adducam eos ad humum suam";
kjv[22] = "And I will make them one nation in the land upon the mountains of Israel; and one king shall be king to them all: and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all:";
rsv[22] = "and I will make them one nation in the land, upon the mountains of Israel; and one king shall be king over them all; and they shall be no longer two nations, and no longer divided into two kingdoms.";
asv[22] = "and I will make them one nation in the land, upon the mountains of Israel; and one king shall be king to them all; and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all;";
yng[22] = "And I have made them become one nation in the land, on mountains of Israel, And one king is to them all for king, And they are no more as two nations, Nor are they divided any more into two kingdoms again.";
dby[22] = "and I will make them one nation in the land upon the mountains of Israel; and one king shall be king to them all: and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all.";

vul[22] = "et faciam eos gentem unam in terra in montibus Israhel et rex unus erit omnibus imperans et non erunt ultra duae gentes nec dividentur amplius in duo regna";
kjv[23] = "Neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions: but I will save them out of all their dwellingplaces, wherein they have sinned, and will cleanse them: so shall they be my people, and I will be their God.";
rsv[23] = "They shall not defile themselves any more with their idols and their detestable things, or with any of their transgressions; but I will save them from all the backslidings in which they have sinned, and will cleanse them; and they shall be my people, and I will be their God.";
asv[23] = "neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions; but I will save them out of all their dwelling-places, wherein they have sinned, and will cleanse them: so shall they be my people, and I will be their God.";
yng[23] = "Nor are they defiled any more with their idols, And with their abominations, And with any of their transgressions, And I have saved them out of all their dwellings, In which they have sinned, And I have cleansed them, And they have been to Me for a people, And I -- I am to them for God.";
dby[23] = "And they shall not defile themselves any more with their idols, or with their detestable things, or with any of their transgressions; and I will save them out of all their dwelling-places wherein they have sinned, and will cleanse them; and they shall be my people, and I will be their God.";
web[23] = "Neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions: but I will save them out of all their dwelling-places, in which they have sinned, and will cleanse them: so shall they be my people, and I will be their God.";
hnv[23] = "neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions; but I will save them out of all their dwelling-places, in which they have sinned, and will cleanse them: so shall they be my people, and I will be their God.";
vul[23] = "neque polluentur ultra in idolis suis et abominationibus suis et in cunctis iniquitatibus suis et salvos eos faciam de universis sedibus suis in quibus peccaverunt et mundabo eos et erunt mihi populus et ego ero eis Deus";
kjv[24] = "And David my servant [shall be] king over them; and they all shall have one shepherd: they shall also walk in my judgments, and observe my statutes, and do them.";
rsv[24] = "&quot;My servant David shall be king over them; and they shall all have one shepherd. They shall follow my ordinances and be careful to observe my statutes.";
asv[24] = "And my servant David shall be king over them; and they all shall have one shepherd: they shall also walk in mine ordinances, and observe my statutes, and do them.";
yng[24] = "And My servant David [is] king over them, And one shepherd have they all, And in My judgments they go, And My statutes they keep, and have done them.";
dby[24] = "And David my servant shall be king over them; and they all shall have one shepherd: and they shall walk in mine ordinances, and keep my statutes, and do them.";

hnv[24] = "My servant David shall be king over them; and they all shall have one shepherd: they shall also walk in my ordinances, and observe my statutes, and do them.";

kjv[25] = "And they shall dwell in the land that I have given unto Jacob my servant, wherein your fathers have dwelt; and they shall dwell therein, [even] they, and their children, and their children\'s children for ever: and my servant David [shall be] their prince for ever.";
rsv[25] = "They shall dwell in the land where your fathers dwelt that I gave to my servant Jacob; they and their children and their children\'s children shall dwell there for ever; and David my servant shall be their prince for ever.";
asv[25] = "And they shall dwell in the land that I have given unto Jacob my servant, wherein your fathers dwelt; and they shall dwell therein, they, and their children, and their children\'s children, for ever: and David my servant shall be their prince for ever.";
yng[25] = "And they have dwelt on the land that I gave to My servant, to Jacob, In which your fathers have dwelt, And they have dwelt on it, they and their sons, And their son\'s sons -- unto the age, And David My servant [is] their prince -- to the age.";
dby[25] = "And they shall dwell in the land that I have given unto Jacob my servant, wherein your fathers have dwelt; and they shall dwell therein, they, and their children, and their children\'s children for ever: and David my servant shall be their prince for ever.";
web[25] = "And they shall dwell in the land that I have given to Jacob my servant, in which your fathers have dwelt, and they shall dwell in it, [even] they, and their children, and their children\'s children for ever: and my servant David [shall be] their prince for ever.";

vul[25] = "et habitabunt super terram quam dedi servo meo Iacob in qua habitaverunt patres vestri et habitabunt super eam ipsi et filii eorum et filii filiorum eorum usque in sempiternum et David servus meus princeps eorum in perpetuum";
kjv[26] = "Moreover I will make a covenant of peace with them; it shall be an everlasting covenant with them: and I will place them, and multiply them, and will set my sanctuary in the midst of them for evermore.";
rsv[26] = "I will make a covenant of peace with them; it shall be an everlasting covenant with them; and I will bless them and multiply them, and will set my sanctuary in the midst of them for evermore.";

yng[26] = "And I have made to them a covenant of peace, A covenant age-during it is with them, And I have placed them, and multiplied them, And placed My sanctuary in their midst -- to the age.";

rsv[27] = "My dwelling place shall be with them; and I will be their God, and they shall be my people.";
asv[27] = "My tabernacle also shall be with them; and I will be their God, and they shall be my people.";

asv[28] = "And the nations shall know that I am Jehovah that sanctifieth Israel, when my sanctuary shall be in the midst of them for evermore.";
yng[28] = "And known have the nations that I Jehovah am sanctifying Israel, In My sanctuary being in their midst -- to the age!\'";
dby[28] = "And the nations shall know that I Jehovah do hallow Israel, when my sanctuary shall be in the midst of them for ever.";

hnv[28] = "The nations shall know that I am the LORD who sanctifies Yisra\'el, when my sanctuary shall be in the midst of them forevermore.";
