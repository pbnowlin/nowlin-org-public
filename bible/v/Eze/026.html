csb[1] = "In the eleventh year, on the first day of the month, the word of the LORD came to me:";
csb[2] = "&quot;Son of man, because Tyre said about Jerusalem, \'Aha! The gateway to the peoples is shattered. She has been turned over to me. I will be filled now that she lies in ruins,\'";
csb[3] = "&quot;therefore this is what the Lord GOD says: See, I am against you, Tyre! I will raise up many nations against you, just as the sea raises its waves.";
csb[4] = "&quot;They will destroy the walls of Tyre and demolish her towers. I will scrape the soil from her and turn her into a bare rock.";
csb[5] = "&quot;She will become a place in the sea to spread nets, for I have spoken.&quot; This is the declaration of the Lord GOD. &quot;She will become plunder for the nations,";
csb[6] = "&quot;and her villages on the mainland will be slaughtered by the sword. Then they will know that I am the LORD.&quot;";
csb[7] = "For this is what the Lord GOD says: &quot;See, I am about to bring King Nebuchadnezzar of Babylon, king of kings, against Tyre from the north with horses, chariots, cavalry, and a huge assembly of troops.";
csb[8] = "&quot;He will slaughter your villages on the mainland with the sword. He will set up siege works, build a ramp, and raise a wall of shields against you.";
csb[9] = "&quot;He will direct the blows of his battering rams against your walls and tear down your towers with his iron tools.";
csb[10] = "&quot;His horses will be so numerous that their dust will cover you. When he enters your gates as an army entering a breached city, your walls will shake from the noise of cavalry, wagons, and chariots.";
csb[11] = "&quot;He will trample all your streets with the hooves of his horses. He will slaughter your people with the sword, and your mighty pillars will fall to the ground.";
csb[12] = "&quot;They will take your wealth as spoil and plunder your merchandise. They will also demolish your walls and tear down your beautiful homes. Then they will throw your stones, timber, and soil into the water.";
csb[13] = "&quot;I will put an end to the noise of your songs, and the sound of your lyres will no longer be heard.";
csb[14] = "&quot;I will turn you into a bare rock, and you will be a place to spread nets. You will never be rebuilt, for I, the LORD, have spoken.&quot; This is the declaration of the Lord GOD.";
csb[15] = "This is what the Lord GOD says to Tyre: &quot;Won\'t the coasts and islands quake at the sound of your downfall, when the wounded groan and slaughter occurs within you?";
csb[16] = "&quot;All the princes of the sea will descend from their thrones, remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling; they will sit on the ground, tremble continually, and be appalled at you.";
csb[17] = "&quot;Then they will lament for you and say of you, \'How you have perished, city of renown, you who were populated from the seas! She who was powerful on the sea, she and all of her inhabitants inflicted their terror.";
csb[18] = "&quot;Now the coastlands tremble on the day of your downfall; the islands in the sea are alarmed by your demise.\' &quot;";
csb[19] = "For this is what the Lord GOD says: &quot;When I make you a ruined city like other deserted cities, when I raise up the deep against you so that the mighty waters cover you,";
csb[20] = "&quot;then I will bring you down to be with those who descend to the Pit, to the people of antiquity. I will make you dwell in the underworld like the ancient ruins, with those who descend to the Pit, so that you will no longer be inhabited or display your splendor in the land of the living.";
csb[21] = "&quot;I will make you an object of horror, and you will no longer exist. You will be sought but will never be found again.&quot; This is the declaration of the Lord GOD.";

web[17] = "And they shall take up a lamentation for thee, and say to thee, How art thou destroyed, [that wast] inhabited by sea-faring men, the renowned city, which wast strong in the sea, she and her inhabitants, who cause their terror [to be] on all that haunt it!";
hnv[17] = "They shall take up a lamentation over you, and tell you, How are you destroyed, who were inhabited by seafaring men, the renowned city, who was strong in the sea, she and her inhabitants, who caused their terror to be on all who lived there!";
vul[17] = "et adsumentes super te lamentum dicent tibi quomodo peristi quae habitas in mari urbs inclita quae fuisti fortis in mari cum habitatoribus tuis quos formidabant universi";
kjv[18] = "Now shall the isles tremble in the day of thy fall; yea, the isles that [are] in the sea shall be troubled at thy departure.";
rsv[18] = "Now the isles tremble on the day of your fall; yea, the isles that are in the sea are dismayed at your passing.\'";
asv[18] = "Now shall the isles tremble in the day of thy fall; yea, the isles that are in the sea shall be dismayed at thy departure.";
yng[18] = "Now they tremble, is it not the day of thy fall? Troubled have been the isles that [are] in the sea, at thine outgoing.";
dby[18] = "Now shall the isles tremble in the day of thy fall; and the isles that are in the sea shall be troubled at thy departure.";
web[18] = "Now shall the isles tremble in the day of thy fall; yes, the isles that [are] in the sea shall be disturbed at thy departure.";
hnv[18] = "Now shall the isles tremble in the day of your fall; yes, the isles that are in the sea shall be dismayed at your departure.";
vul[18] = "nunc stupebunt naves in die pavoris tui et turbabuntur insulae in mari eo quod nullus egrediatur ex te";
kjv[19] = "For thus saith the Lord GOD; When I shall make thee a desolate city, like the cities that are not inhabited; when I shall bring up the deep upon thee, and great waters shall cover thee;";
rsv[19] = "&quot;For thus says the Lord GOD: When I make you a city laid waste, like the cities that are not inhabited, when I bring up the deep over you, and the great waters cover you,";
asv[19] = "For thus saith the Lord Jehovah: When I shall make thee a desolate city, like the cities that are not inhabited; when I shall bring up the deep upon thee, and the great waters shall cover thee;";
yng[19] = "For thus said the Lord Jehovah: In my making thee a city wasted, Like cities that have not been inhabited, In bringing up against thee the deep, Then covered thee have the great waters.";
dby[19] = "For thus saith the Lord Jehovah: When I shall make thee a desolate city, like the cities that are not inhabited; when I bring up the deep upon thee, and the great waters cover thee:";
web[19] = "For thus saith the Lord GOD; When I shall make thee a desolate city, like the cities that are not inhabited; when I shall bring up the deep upon thee, and great waters shall cover thee;";
hnv[19] = "For thus says the Lord GOD: When I shall make you a desolate city, like the cities that are not inhabited; when I shall bring up the deep on you, and the great waters shall cover you;";
vul[19] = "quia haec dicit Dominus Deus cum dedero te urbem desolatam sicut civitates quae non habitantur et adduxero super te abyssum et operuerint te aquae multae";
kjv[20] = "When I shall bring thee down with them that descend into the pit, with the people of old time, and shall set thee in the low parts of the earth, in places desolate of old, with them that go down to the pit, that thou be not inhabited; and I shall set glory in the land of the living;";
rsv[20] = "then I will thrust you down with those who descend into the Pit, to the people of old, and I will make you to dwell in the nether world, among primeval ruins, with those who go down to the Pit, so that you will not be inhabited or have a place in the land of the living.";
asv[20] = "then will I bring thee down with them that descend into the pit, to the people of old time, and will make thee to dwell in the nether parts of the earth, in the places that are desolate of old, with them that go down to the pit, that thou be not inhabited; and I will set glory in the land of the living.";
yng[20] = "And I have caused thee to go down, With those going down to the pit, Unto the people of old, And I have caused thee to dwell in the land, The lower parts -- in wastes of old, With those going down to the pit, So that thou art not inhabited, And I have given beauty in the land of the living.";
dby[20] = "then will I bring thee down, with them that go down to the pit, to the people of old time, and will cause thee to dwell in the lower parts of the earth, in places desolate of old, with them that go down to the pit, that thou be not inhabited; and I will set glory in the land of the living.";
web[20] = "When I shall bring thee down with them that descend into the pit, with the people of old time, and shall set thee in the low parts of the earth, in places desolate of old, with them that go down to the pit, that thou be not inhabited; and I shall set glory in the land of the living;";
hnv[20] = "then will I bring you down with those who descend into the pit, to the people of old time, and will make you to dwell in the lower parts of the eretz, in the places that are desolate of old, with those who go down to the pit, that you be not inhabited; and I will set glory in the land of the living:";
vul[20] = "et detraxero te cum his qui descendunt in lacum ad populum sempiternum et conlocavero te in terra novissima sicut solitudines veteres cum his qui deducuntur in lacum ut non habiteris porro dedero gloriam in terra viventium";
kjv[21] = "I will make thee a terror, and thou [shalt be] no [more]: though thou be sought for, yet shalt thou never be found again, saith the Lord GOD.";
rsv[21] = "I will bring you to a dreadful end, and you shall be no more; though you be sought for, you will never be found again, says the Lord GOD.&quot;";
asv[21] = "I will make thee a terror, and thou shalt no more have any being; though thou be sought for, yet shalt thou never be found again, saith the Lord Jehovah.";
yng[21] = "Wastes I do make thee, and thou art not, And thou art sought, and art not found any more -- to the age, An affirmation of the Lord Jehovah!\'";
dby[21] = "And I will make thee a terror, and thou shalt be no [more]; and thou shalt be sought for, and shalt never be found again, for ever, saith the Lord Jehovah.";
web[21] = "I will make thee a terror, and thou [shalt be] no [more]: though thou shalt be sought for, yet shalt thou never be found again, saith the Lord GOD.";
hnv[21] = "I will make you a terror, and you shall no more have any being; though you are sought for, yet shall you never be found again, says the Lord GOD.";
vul[21] = "in nihilum redigam te et non eris et requisita non invenieris ultra in sempiternum dicit Dominus Deus";
