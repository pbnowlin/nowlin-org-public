csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, prophesy against the shepherds of Israel. Prophesy, and say to them, \'This is what the Lord GOD says to the shepherds: Woe to the shepherds of Israel, who have been feeding themselves! Shouldn\'t the shepherds feed their flock?";
csb[3] = "&quot;You eat the fat, wear the wool, and butcher the fattened animals, but you do not tend the flock.";
csb[4] = "&quot;You have not strengthened the weak, healed the sick, bandaged the injured, brought back the strays, or sought the lost. Instead, you have ruled them with violence and cruelty.";
csb[5] = "&quot;They were scattered for lack of a shepherd; they became food for all the wild animals when they were scattered.";
csb[6] = "&quot;My flock went astray on all the mountains and every high hill. My flock was scattered over the whole face of the earth, and there was no one searching or seeking for them.";
csb[7] = "&quot; \'Therefore, you shepherds, hear the word of the LORD.";
csb[8] = "&quot;As I live -- this is the declaration of the Lord GOD -- because my flock, lacking a shepherd, has become prey and food for every wild animal, and because my shepherds do not search for my flock, and because the shepherds feed themselves rather than my flock,";
csb[9] = "&quot;therefore, you shepherds, hear the word of the LORD!";
csb[10] = "&quot; \'This is what the Lord GOD says: Look, I am against the shepherds. I will demand my flock from them and prevent them from shepherding the flock. The shepherds will no longer feed themselves, for I will rescue my flock from their mouths so that they will not be food for them.";
csb[11] = "&quot; \'For this is what the Lord GOD says: See, I myself will search for my flock and look for them.";
csb[12] = "&quot;As a shepherd looks for his sheep on the day he is among his scattered flock, so I will look for my flock. I will rescue them from all the places where they have been scattered on a day of clouds and total darkness.";
csb[13] = "&quot;I will bring them out from the peoples, gather them from the countries, and bring them to their own soil. I will shepherd them on the mountains of Israel, in the ravines, and in all the inhabited places of the land.";
csb[14] = "&quot;I will tend them in good pasture, and their grazing place will be on Israel\'s lofty mountains. There they will lie down in a good grazing place; they will feed in rich pasture on the mountains of Israel.";
csb[15] = "&quot;I will tend my flock and let them lie down. This is the declaration of the Lord GOD.";
csb[16] = "&quot;I will seek the lost, bring back the strays, bandage the injured, and strengthen the weak, but I will destroy the fat and the strong. I will shepherd them with justice.";
csb[17] = "&quot; \'As for you, my flock, the Lord GOD says this: Look, I am going to judge between one sheep and another, between the rams and goats.";
csb[18] = "&quot;Isn\'t it enough for you to feed on the good pasture? Must you also trample the rest of the pasture with your feet? Or isn\'t it enough that you drink the clear water? Must you also muddy the rest with your feet?";
csb[19] = "&quot;Yet my flock has to feed on what your feet have trampled, and drink what your feet have muddied.";
csb[20] = "&quot; \'Therefore, this is what the Lord GOD says to them: See, I myself will judge between the fat sheep and the lean sheep.";
csb[21] = "&quot;Since you have pushed with flank and shoulder and butted all the weak ones with your horns until you scattered them all over,";
csb[22] = "&quot;I will save my flock. They will no longer be prey, and I will judge between one sheep and another.";
csb[23] = "&quot;I will establish over them one shepherd, my servant David, and he will shepherd them. He will tend them himself and will be their shepherd.";
csb[24] = "&quot;I, the LORD, will be their God, and my servant David will be a prince among them. I, the LORD, have spoken.";
csb[25] = "&quot; \'I will make a covenant of peace with them and eliminate dangerous creatures from the land, so that they may live securely in the wilderness and sleep in the forest.";
csb[26] = "&quot;I will make them and the area around my hill a blessing: I will send down showers in their season; they will be showers of blessing.";
csb[27] = "&quot;The trees of the field will yield their fruit, and the land will yield its produce; my flock will be secure in their land. They will know that I am the LORD when I break the bars of their yoke and rescue them from the power of those who enslave them.";
csb[28] = "&quot;They will no longer be prey for the nations, and the wild creatures of the earth will not consume them. They will live securely, and no one will frighten them.";
csb[29] = "&quot;I will establish for them a place renowned for its agriculture, and they will no longer be victims of famine in the land. They will no longer endure the insults of the nations.";
csb[30] = "&quot;Then they will know that I, the LORD their God, am with them, and that they, the house of Israel, are my people. This is the declaration of the Lord GOD.";
csb[31] = "&quot;You are my flock, the human flock of my pasture, and I am your God. This is the declaration of the Lord GOD.\' &quot;";

asv[8] = "As I live, saith the Lord Jehovah, surely forasmuch as my sheep became a prey, and my sheep became food to all the beasts of the field, because there was no shepherd, neither did my shepherds search for my sheep, but the shepherds fed themselves, and fed not my sheep;";
yng[8] = "I live -- an affirmation of the Lord Jehovah, If not, because of My flock being for a prey, Yea, My flock is for food to every beast of the field, Because there is no shepherd, And My shepherds have not sought My flock, And the shepherds do feed themselves, And My flock they have not fed.";

kjv[18] = "[Seemeth it] a small thing unto you to have eaten up the good pasture, but ye must tread down with your feet the residue of your pastures? and to have drunk of the deep waters, but ye must foul the residue with your feet?";

yng[18] = "Is it a little thing for you -- the good pasture ye enjoy, And the remnant of your pasture ye tread down with your feet, And a depth of waters ye do drink, And the remainder with your feet ye trample,";
dby[18] = "Is it too small a thing unto you to have eaten up the good pastures, but ye must tread down with your feet the rest of your pastures; and to have drunk of the settled waters, but ye must foul the rest with your feet?";
