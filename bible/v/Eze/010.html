csb[1] = "Then I looked, and there above the expanse over the heads of the cherubim was something like a throne with the appearance of lapis lazuli.";
csb[2] = "The LORD spoke to the man clothed in linen and said, &quot;Go inside the wheelwork beneath the cherubim. Fill your hands with blazing coals from among the cherubim and scatter them over the city.&quot; So he went in as I watched.";
csb[3] = "Now the cherubim were standing to the south of the temple when the man went in, and the cloud filled the inner court.";
csb[4] = "Then the glory of the LORD rose from above the cherub to the threshold of the temple. The temple was filled with the cloud, and the court was filled with the brightness of the LORD\'s glory.";
csb[5] = "The sound of the cherubim\'s wings could be heard as far as the outer court; it was like the voice of God Almighty when he speaks.";
csb[6] = "After the LORD commanded the man clothed in linen, saying, &quot;Take fire from inside the wheelwork, from among the cherubim,&quot; the man went in and stood beside a wheel.";
csb[7] = "Then the cherub reached out his hand to the fire that was among them. He took some and put it into the hands of the man clothed in linen, who took it and went out.";
csb[8] = "The cherubim appeared to have the form of human hands under their wings.";
csb[9] = "I looked, and there were four wheels beside the cherubim, one wheel beside each cherub. The luster of the wheels was like the gleam of beryl.";
csb[10] = "In appearance, all four looked alike, like a wheel within a wheel.";
csb[11] = "When they moved, they would go in any of the four directions, without pivoting as they moved. But wherever the head faced, they would go in that direction, without pivoting as they went.";
csb[12] = "Their entire bodies, including their backs, hands, wings, and the wheels that the four of them had, were full of eyes all around.";
csb[13] = "As I listened the wheels were called &quot;the wheelwork.&quot;";
csb[14] = "Each one had four faces: one was the face of a cherub, the second the face of a man, the third the face of a lion, and the fourth the face of an eagle.";
csb[15] = "The cherubim ascended; these were the living creatures I had seen by the Chebar Canal.";
csb[16] = "When the cherubim moved, the wheels moved beside them, and when they lifted their wings to rise from the earth, even then the wheels did not veer away from them.";
csb[17] = "When the cherubim stopped, the wheels stood still, and when they ascended, the wheels ascended with them, for the spirit of the living creatures was in them.";
csb[18] = "Then the glory of the LORD moved away from the threshold of the temple and stopped above the cherubim.";
csb[19] = "The cherubim lifted their wings and ascended from the earth right before my eyes; the wheels were beside them as they went. The glory of the God of Israel was above them, and it stopped at the entrance to the eastern gate of the LORD\'s house.";
csb[20] = "These were the living creatures I had seen beneath the God of Israel by the Chebar Canal, and I recognized that they were cherubim.";
csb[21] = "Each had four faces and each had four wings, with what looked something like human hands under their wings.";
csb[22] = "Their faces looked like the same faces I had seen by the Chebar Canal. Each creature went straight ahead.";
kjv[1] = "Then I looked, and, behold, in the firmament that was above the head of the cherubims there appeared over them as it were a sapphire stone, as the appearance of the likeness of a throne.";
rsv[1] = "Then I looked, and behold, on the firmament that was over the heads of the cherubim there appeared above them something like a sapphire, in form resembling a throne.";
asv[1] = "Then I looked, and, behold, in the firmament that was over the head of the cherubim there appeared above them as it were a sapphire stone, as the appearance of the likeness of a throne.";
yng[1] = "And I look, and lo, on the expanse that [is] above the head of the cherubs, as a sapphire stone, as the appearance of the likeness of a throne, He hath been seen over them.";
dby[1] = "And I looked, and behold, in the expanse that was over the head of the cherubim there appeared above them as it were a sapphire stone, as the appearance of the likeness of a throne.";

vul[1] = "et vidi et ecce in firmamento quod erat super caput cherubin quasi lapis sapphyrus quasi species similitudinis solii apparuit super ea";
kjv[2] = "And he spake unto the man clothed with linen, and said, Go in between the wheels, [even] under the cherub, and fill thine hand with coals of fire from between the cherubims, and scatter [them] over the city. And he went in in my sight.";
rsv[2] = "And he said to the man clothed in linen, &quot;Go in among the whirling wheels underneath the cherubim; fill your hands with burning coals from between the cherubim, and scatter them over the city.&quot; And he went in before my eyes.";
asv[2] = "And he spake unto the man clothed in linen, and said, Go in between the whirling [wheels], even under the cherub, and fill both thy hands with coals of fire from between the cherubim, and scatter them over the city. And he went in in my sight.";
yng[2] = "And He speaketh unto the man clothed with linen, and saith, `Go in unto the midst of the wheel, unto the place of the cherub, and fill thy hands with coals of fire from between the cherubs, and scatter over the city.\' And he goeth in before mine eyes.";
dby[2] = "And he spoke unto the man clothed with linen, and said, Come in between the wheels, under the cherub, and fill the hollow of thy hands with coals of fire from between the cherubim, and scatter them over the city. And he went in in my sight.";
web[2] = "And he spoke to the man clothed with linen, and said, Go in between the wheels, [even] under the cherub, and fill thy hand with coals of fire from between the cherubim, and scatter [them] over the city. And he entered in my sight.";
hnv[2] = "He spoke to the man clothed in linen, and said, Go in between the whirling [wheels], even under the Keruv, and fill both your hands with coals of fire from between the Keruvim, and scatter them over the city. He went in as I watched.";
vul[2] = "et dixit ad virum qui indutus erat lineis et ait ingredere in medio rotarum quae sunt subtus cherub et imple manum tuam prunis ignis quae sunt inter cherubin et effunde super civitatem ingressusque est in conspectu meo";

kjv[11] = "When they went, they went upon their four sides; they turned not as they went, but to the place whither the head looked they followed it; they turned not as they went.";
rsv[11] = "When they went, they went in any of their four directions without turning as they went, but in whatever direction the front wheel faced the others followed without turning as they went.";
asv[11] = "When they went, they went in their four directions: they turned not as they went, but to the place whither the head looked they followed it; they turned not as they went.";
yng[11] = "In their going, on their four sides they go; they turn not round in their going, for to the place whither the head turneth, after it they go, they turn not round in their going.";

yng[19] = "and the cherubs lift up their wings, and are lifted up from the earth before mine eyes; in their going forth, the wheels also [are] over-against them, and he standeth at the opening of the east gate of the house of Jehovah, and the honour of the God of Israel [is] over them from above.";
dby[19] = "And the cherubim lifted up their wings, and mounted up from the earth in my sight, when they went out; and the wheels were beside them; and they stood at the door of the east gate of Jehovah\'s house; and the glory of the God of Israel was over them above.";
web[19] = "And the cherubim lifted up their wings, and mounted up from the earth in my sight: when they went out, the wheels also [were] beside them, and [every one] stood at the door of the east-gate of the LORD\'S house; and the glory of the God of Israel [was] over them above.";
hnv[19] = "The Keruvim lifted up their wings, and mounted up from the eretz in my sight when they went forth, and the wheels beside them: and they stood at the door of the east gate of the LORD\'s house; and the glory of the God of Yisra\'el was over them above.";
vul[19] = "et elevantia cherubin alas suas exaltata sunt a terra coram me et illis egredientibus rotae quoque subsecutae sunt et stetit in introitu portae domus Domini orientalis et gloria Dei Israhel erat super ea";
kjv[20] = "This [is] the living creature that I saw under the God of Israel by the river of Chebar; and I knew that they [were] the cherubims.";
rsv[20] = "These were the living creatures that I saw underneath the God of Israel by the river Chebar; and I knew that they were cherubim.";
asv[20] = "This is the living creature that I saw under the God of Israel by the river Chebar; and I knew that they were cherubim.";
yng[20] = "It [is] the living creature that I saw under the God of Israel by the river Chebar, and I know that they are cherubs.";
dby[20] = "This is the living creature that I saw under the God of Israel by the river Chebar; and I knew that they were cherubim.";
web[20] = "This [is] the living creature that I saw under the God of Israel by the river of Kebar; and I knew that they [were] the cherubim.";
hnv[20] = "This is the living creature that I saw under the God of Yisra\'el by the river Kevar; and I knew that they were Keruvim.";
vul[20] = "ipsum est animal quod vidi subter Deum Israhel iuxta fluvium Chobar et intellexi quia cherubin essent";
kjv[21] = "Every one had four faces apiece, and every one four wings; and the likeness of the hands of a man [was] under their wings.";
rsv[21] = "Each had four faces, and each four wings, and underneath their wings the semblance of human hands.";
asv[21] = "Every one had four faces, and every one four wings; and the likeness of the hands of a man was under their wings.";
yng[21] = "Four faces [are] to each, and four wings to each, and the likeness of the hands of man [is] under their wings.";
dby[21] = "Each one had four faces, and every one four wings; and the likeness of the hands of a man was under their wings.";
web[21] = "Every one had four faces each, and every one four wings; and the likeness of the hands of a man [was] under their wings.";
hnv[21] = "Every one had four faces, and every one four wings; and the likeness of the hands of a man was under their wings.";
vul[21] = "quattuor per quattuor vultus uni et quattuor alae uni et similitudo manus hominis sub alis eorum";
kjv[22] = "And the likeness of their faces [was] the same faces which I saw by the river of Chebar, their appearances and themselves: they went every one straight forward.";
rsv[22] = "And as for the likeness of their faces, they were the very faces whose appearance I had seen by the river Chebar. They went every one straight forward.";
asv[22] = "And as for the likeness of their faces, they were the faces which I saw by the river Chebar, their appearances and themselves; they went every one straight forward.";
yng[22] = "As to the likeness of their faces, they [are] the faces that I saw by the river Chebar, their appearances and themselves; each straight forward they go.";
dby[22] = "And as for the likeness of their faces, they were the faces which I had seen by the river Chebar -- their appearance and themselves: they went every one straight before them.";
web[22] = "And the likeness of their faces [was] the same faces which I saw by the river of Kebar, their appearances and themselves: they went every one straight forward.";
hnv[22] = "As for the likeness of their faces, they were the faces which I saw by the river Kevar, their appearances and themselves; they went every one straight forward.";
vul[22] = "et similitudo vultuum eorum ipsi vultus quos videram iuxta fluvium Chobar et intuitus eorum et impetus singulorum ante faciem suam ingredi";
