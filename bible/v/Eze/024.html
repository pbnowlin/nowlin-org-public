csb[1] = "The word of the LORD came to me in the ninth year, in the tenth month, on the tenth day of the month:";
csb[2] = "&quot;Son of man, write down today\'s date, this very day. The king of Babylon has laid siege to Jerusalem this very day.";
csb[3] = "&quot;Now speak a parable to the rebellious house. Tell them, \'This is what the Lord GOD says: Put the pot on the fire -- put it on, and then pour water into it!";
csb[4] = "&quot;Place the pieces of meat in it, every good piece -- thigh and shoulder. Fill it with choice bones.";
csb[5] = "&quot;Take the choicest of the flock and also pile up the fuel under it. Bring it to a boil and cook the bones in it.";
csb[6] = "&quot; \'Therefore, this is what the Lord GOD says: Woe to the city of bloodshed, the pot that has corrosion inside it, and its corrosion has not come out of it! Empty it piece by piece; lots should not be cast for its contents.";
csb[7] = "&quot;For the blood she shed is still within her. She put it out on the bare rock; she didn\'t pour it on the ground to cover it with dust.";
csb[8] = "&quot;In order to stir up wrath and take vengeance, I have put her blood on the bare rock, so that it would not be covered.";
csb[9] = "&quot; \'Therefore, this is what the Lord GOD says: Woe to the city of bloodshed! I myself will make the pile of kindling large.";
csb[10] = "&quot;Pile on the logs and kindle the fire! Cook the meat well and mix in the spices! Let the bones be burned!";
csb[11] = "&quot;Set the empty pot on its coals so that it becomes hot and its copper glows. Then its impurity will melt inside it; its corrosion will be consumed.";
csb[12] = "&quot;It has frustrated every effort; its thick corrosion will not come off. Into the fire with its corrosion!";
csb[13] = "&quot;Because of the depravity of your uncleanness -- since I tried to purify you, but you would not be purified from your uncleanness -- you will not be pure again until I have satisfied my wrath on you.";
csb[14] = "&quot;I, the LORD, have spoken. It is coming, and I will do it! I will not refrain, I will not show pity, and I will not relent. I will judge you according to your ways and deeds. This is the declaration of the Lord GOD.\' &quot;";
csb[15] = "Then the word of the LORD came to me:";
csb[16] = "&quot;Son of man, I am about to take the delight of your eyes away from you with a fatal blow. But you must not lament or weep or let your tears flow.";
csb[17] = "&quot;Groan quietly; do not observe mourning rites for the dead. Put on your turban and strap your sandals on your feet; do not cover your mustache or eat the bread of mourners.&quot;";
csb[18] = "I spoke to the people in the morning, and my wife died in the evening. The next morning I did just as I was commanded.";
csb[19] = "Then the people asked me, &quot;Won\'t you tell us what these things you are doing mean for us? &quot;";
csb[20] = "So I answered them: &quot;The word of the LORD came to me:";
csb[21] = "&quot;Say to the house of Israel, \'This is what the Lord GOD says: I am about to desecrate my sanctuary, the pride of your power, the delight of your eyes, and the desire of your heart. Also, the sons and daughters you left behind will fall by the sword.";
csb[22] = "&quot;Then you will do just as I have done: You will not cover your mustache or eat the bread of mourners.";
csb[23] = "&quot;Your turbans will remain on your heads and your sandals on your feet. You will not lament or weep but will waste away because of your iniquities and will groan to one another.";
csb[24] = "&quot;Now Ezekiel will be a sign for you. You will do everything that he has done. When this happens, you will know that I am the Lord GOD.\'";
csb[25] = "&quot;As for you, son of man, know that on that day I will take from them their stronghold -- their pride and joy, the delight of their eyes, and the longing of their hearts -- as well as their sons and daughters.";
csb[26] = "&quot;On that day a fugitive will come to you and report the news.";
csb[27] = "&quot;On that day your mouth will be opened to talk with him; you will speak and no longer be mute. So you will be a sign for them, and they will know that I am the LORD.&quot;";
