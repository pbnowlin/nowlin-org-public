csb[1] = "Next he brought me into the great hall and measured the jambs; on each side the width of the jamb was 10 1/2 feet.";
csb[2] = "The width of the entrance was 17 1/2 feet, and the side walls of the entrance were 8 3/4 feet wide on each side. He also measured the length of the great hall, 70 feet, and the width, 35 feet.";
csb[3] = "He went inside the next room and measured the jambs at the entrance; they were 3 1/2 feet wide. The entrance was 10 1/2 feet wide, and the width of the entrance\'s side walls on each side was 12 1/4 feet.";
csb[4] = "He then measured the length of the room adjacent to the great hall, 35 feet, and the width, 35 feet. And he said to me, &quot;This is the most holy place.&quot;";
csb[5] = "Then he measured the wall of the temple; it was 10 1/2 feet thick. The width of the side rooms all around the temple was 7 feet.";
csb[6] = "The side rooms were arranged one above another in three stories of thirty rooms each. There were ledges on the wall of the temple all around to serve as supports for the side rooms, so that the supports would not be in the temple wall itself.";
csb[7] = "The side rooms surrounding the temple widened at each successive story, for the structure surrounding the temple went up by stages. This was the reason for the temple\'s broadness as it rose. And so, one would go up from the lowest story to the highest by means of the middle one.";
csb[8] = "I saw that the temple had a raised platform surrounding it; this foundation for the side rooms was 10 1/2 feet high.";
csb[9] = "The thickness of the outer wall of the side rooms was 8 3/4 feet. The free space between the side rooms of the temple";
csb[10] = "and the outer chambers was 35 feet wide all around the temple.";
csb[11] = "The side rooms opened into the free space, one entrance toward the north and another to the south. The area of free space was 8 3/4 feet wide all around.";
csb[12] = "Now the building that faced the temple yard toward the west was 122 1/2 feet wide. The wall of the building was 8 3/4 feet thick on all sides, and the building\'s length was 157 1/2 feet.";
csb[13] = "Then the man measured the temple; it was 175 feet long. In addition, the temple yard and the building, including its walls, were 175 feet long.";
csb[14] = "The width of the front of the temple along with the temple yard to the east was 175 feet.";
csb[15] = "Next he measured the length of the building facing the temple yard to the west, with its galleries on each side; it was 175 feet. The interior of the great hall and the porticoes of the court --";
csb[16] = "the thresholds, the beveled windows, and the balconies all around with their three levels opposite the threshold -- were overlaid with wood on all sides. They were paneled from the ground to the windows (but the windows were covered),";
csb[17] = "reaching to the top of the entrance, and as far as the inner temple and on the outside. On every wall all around, on the inside and outside, was a pattern";
csb[18] = "carved with cherubim and palm trees. There was a palm tree between each pair of cherubim. Each cherub had two faces:";
csb[19] = "a human face turned toward the palm tree on one side, and a lion\'s face turned toward it on the other. They were carved throughout the temple on all sides.";
csb[20] = "Cherubim and palm trees were carved from the ground to the top of the entrance and on the wall of the great hall.";
csb[21] = "The doorposts of the great hall were square, and the front of the sanctuary had the same appearance.";
csb[22] = "The altar was made of wood, 5 1/4 feet high and 3 1/2 feet long. It had corners, and its length and sides were of wood. The man told me, &quot;This is the table that stands before the LORD.&quot;";
csb[23] = "The great hall and the sanctuary each had a double door,";
csb[24] = "and each of the doors had two swinging panels. There were two panels for one door and two for the other.";
csb[25] = "Cherubim and palm trees were carved on the doors of the great hall like those carved on the walls. There was a wooden canopy outside, in front of the portico.";
csb[26] = "There were beveled windows and palm trees on both sides, on the side walls of the portico, the side rooms of the temple, and the canopies.";

kjv[6] = "And the side chambers [were] three, one over another, and thirty in order; and they entered into the wall which [was] of the house for the side chambers round about, that they might have hold, but they had not hold in the wall of the house.";
rsv[6] = "And the side chambers were in three stories, one over another, thirty in each story. There were offsets all around the wall of the temple to serve as supports for the side chambers, so that they should not be supported by the wall of the temple.";
asv[6] = "And the side-chambers were in three stories, one over another, and thirty in order; and they entered into the wall which belonged to the house for the side-chambers round about, that they might have hold [therein], and not have hold in the wall of the house.";
yng[6] = "And the side-chambers [are] side-chamber by side-chamber, three and thirty times; and they are entering into the wall -- which the house hath for the side-chambers all round about -- to be taken hold of, and they are not taken hold of by the wall of the house.";
dby[6] = "And the side-chambers were three, chamber over chamber, and thirty in order; and they entered into the wall which the house had for the side-chambers round about, that they might have hold; but they had not hold in the wall of the house.";
web[6] = "And the side-chambers [were] three, one over another, and thirty in order; and they entered into the wall which [was] of the house for the side-chambers around, that they might have hold, but they had not hold in the wall of the house.";
hnv[6] = "The side-chambers were in three stories, one over another, and thirty in order; and they entered into the wall which belonged to the house for the side-chambers round about, that they might have hold [therein], and not have hold in the wall of the house.";
vul[6] = "latera autem latus ad latus bis triginta tria et erant eminentia quae ingrederentur per parietem domus in lateribus per circuitum ut continerent et non adtingerent parietem templi";
kjv[7] = "And [there was] an enlarging, and a winding about still upward to the side chambers: for the winding about of the house went still upward round about the house: therefore the breadth of the house [was still] upward, and so increased [from] the lowest [chamber] to the highest by the midst.";
rsv[7] = "And the side chambers became broader as they rose from story to story, corresponding to the enlargement of the offset from story to story round about the temple; on the side of the temple a stairway led upward, and thus one went up from the lowest story to the top story through the middle story.";
asv[7] = "And the side-chambers were broader as they encompassed [the house] higher and higher; for the encompassing of the house went higher and higher round about the house: therefore the breadth of the house [continued] upward; and so one went up [from] the lowest [chamber] to the highest by the middle [chamber].";
yng[7] = "And a broad place and a turning place still upwards [are] to the side-chambers, for the turning round of the house [is] still upwards all round about the house: therefore the breadth of the house [is] upwards, and so the lower one goeth up unto the higher by the midst.";
dby[7] = "And for the side-chambers there was an enlarging, and it went round about [the house] increasing upward; for the surrounding of the house increased upward round about the house; therefore the house had width upward, and so ascended [from] the lower [story] to the upper, by the middle one.";
web[7] = "And [there was] an enlarging, and a winding about still upward to the side-chambers: for the winding about of the house went still upward around the house; therefore the breadth of the house [was still] upward, and so increased [from] the lowest [chamber] to the highest by the midst.";
hnv[7] = "The side-chambers were broader as they encompassed [the house] higher and higher; for the encompassing of the house went higher and higher round about the house: therefore the breadth of the house [continued] upward; and so one went up [from] the lowest [chamber] to the highest by the middle [chamber].";
vul[7] = "et platea erat in rotundum ascendens sursum per cocleam et in cenaculum templi deferebat per gyrum idcirco latius erat templum in superioribus et sic de inferioribus ascendebatur ad superiora in medium";
