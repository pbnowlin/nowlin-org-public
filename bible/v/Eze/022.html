csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;As for you, son of man, will you pass judgment? Will you pass judgment against the city of blood? Then explain all her detestable practices to her.";
csb[3] = "&quot;You are to say, \'This is what the Lord GOD says: A city that sheds blood within her walls so that her time of judgment has come and who makes idols for herself so that she is defiled!";
csb[4] = "&quot;You are guilty of the blood you have shed, and you are defiled from the idols you have made. You have brought your judgment days near and have come to your years of punishment. Therefore, I have made you a disgrace to the nations and a mockery to all the lands.";
csb[5] = "&quot;Those who are near and those far away from you will mock you, you infamous one full of turmoil.";
csb[6] = "&quot; \'Look, every prince of Israel within you has used his strength to shed blood.";
csb[7] = "&quot;Father and mother are treated with contempt, and the resident alien is exploited within you. The fatherless and widow are oppressed in you.";
csb[8] = "&quot;You despise my holy things and profane my Sabbaths.";
csb[9] = "&quot;There are men within you who slander in order to shed blood. People who live in you eat at the mountain shrines; they commit depraved acts within you.";
csb[10] = "&quot;Men within you have sexual intercourse with their father\'s wife and violate women during their menstrual impurity.";
csb[11] = "&quot;One man within you commits a detestable act with his neighbor\'s wife; another defiles his daughter-in-law with depravity; and yet another violates his sister, his father\'s daughter.";
csb[12] = "&quot;People who live in you accept bribes in order to shed blood. You take interest and profit on a loan and brutally extort your neighbors. You have forgotten me. This is the declaration of the Lord GOD.";
csb[13] = "&quot; \'Now look, I clap my hands together against the dishonest profit you have made and against the blood shed among you.";
csb[14] = "&quot;Will your courage endure or your hands be strong in the days when I deal with you? I, the LORD, have spoken, and I will act.";
csb[15] = "&quot;I will disperse you among the nations and scatter you among the countries; I will purge your uncleanness.";
csb[16] = "&quot;You will be profaned in the sight of the nations. Then you will know that I am the LORD.\' &quot;";
csb[17] = "The word of the LORD came to me:";
csb[18] = "&quot;Son of man, the house of Israel has become merely dross to me. All of them are copper, tin, iron, and lead inside the furnace; they are just dross from silver.";
csb[19] = "&quot;Therefore, this is what the Lord GOD says: Because all of you have become dross, I am about to gather you into Jerusalem.";
csb[20] = "&quot;Just as one gathers silver, copper, iron, lead, and tin into the furnace to blow fire on them and melt them, so I will gather you in my anger and wrath, put you inside, and melt you.";
csb[21] = "&quot;Yes, I will gather you together and blow on you with the fire of my fury, and you will be melted within the city.";
csb[22] = "&quot;As silver is melted inside a furnace, so you will be melted inside the city. Then you will know that I, the LORD, have poured out my wrath on you.&quot;";
csb[23] = "The word of the LORD came to me:";
csb[24] = "&quot;Son of man, say to her, \'You are a land that has not been cleansed, that has not received rain in the day of indignation.\'";
csb[25] = "&quot;The conspiracy of her prophets within her is like a roaring lion tearing its prey: they devour people, seize wealth and valuables, and multiply the widows within her.";
csb[26] = "&quot;Her priests do violence to my instruction and profane my holy things. They make no distinction between the holy and the common, and they do not explain the difference between the clean and the unclean. They close their eyes to my Sabbaths, and I am profaned among them.";
csb[27] = "&quot;Her officials within her are like wolves tearing their prey, shedding blood, and destroying lives in order to make profit dishonestly.";
csb[28] = "&quot;Her prophets plaster for them with whitewash by seeing false visions and lying divinations, saying, \'This is what the Lord GOD says,\' when the LORD has not spoken.";
csb[29] = "&quot;The people of the land have practiced extortion and committed robbery. They have oppressed the poor and needy and unlawfully exploited the resident alien.";
csb[30] = "&quot;I searched for a man among them who would repair the wall and stand in the gap before me on behalf of the land so that I might not destroy it, but I found no one.";
csb[31] = "&quot;So I have poured out my indignation on them and consumed them with the fire of my fury. I have brought their conduct down on their own heads.&quot; This is the declaration of the Lord GOD.";
kjv[1] = "Moreover the word of the LORD came unto me, saying,";
kjv[2] = "Now, thou son of man, wilt thou judge, wilt thou judge the bloody city? yea, thou shalt shew her all her abominations.";
kjv[3] = "Then say thou, Thus saith the Lord GOD, The city sheddeth blood in the midst of it, that her time may come, and maketh idols against herself to defile herself.";
kjv[4] = "Thou art become guilty in thy blood that thou hast shed; and hast defiled thyself in thine idols which thou hast made; and thou hast caused thy days to draw near, and art come [even] unto thy years: therefore have I made thee a reproach unto the heathen, and a mocking to all countries.";
kjv[5] = "[Those that be] near, and [those that be] far from thee, shall mock thee, [which art] infamous [and] much vexed.";
kjv[6] = "Behold, the princes of Israel, every one were in thee to their power to shed blood.";
kjv[7] = "In thee have they set light by father and mother: in the midst of thee have they dealt by oppression with the stranger: in thee have they vexed the fatherless and the widow.";
kjv[8] = "Thou hast despised mine holy things, and hast profaned my sabbaths.";
kjv[9] = "In thee are men that carry tales to shed blood: and in thee they eat upon the mountains: in the midst of thee they commit lewdness.";
kjv[10] = "In thee have they discovered their fathers\' nakedness: in thee have they humbled her that was set apart for pollution.";
kjv[11] = "And one hath committed abomination with his neighbour\'s wife; and another hath lewdly defiled his daughter in law; and another in thee hath humbled his sister, his father\'s daughter.";
kjv[12] = "In thee have they taken gifts to shed blood; thou hast taken usury and increase, and thou hast greedily gained of thy neighbours by extortion, and hast forgotten me, saith the Lord GOD.";
kjv[13] = "Behold, therefore I have smitten mine hand at thy dishonest gain which thou hast made, and at thy blood which hath been in the midst of thee.";
kjv[14] = "Can thine heart endure, or can thine hands be strong, in the days that I shall deal with thee? I the LORD have spoken [it], and will do [it].";
kjv[15] = "And I will scatter thee among the heathen, and disperse thee in the countries, and will consume thy filthiness out of thee.";
kjv[16] = "And thou shalt take thine inheritance in thyself in the sight of the heathen, and thou shalt know that I [am] the LORD.";
kjv[17] = "And the word of the LORD came unto me, saying,";
kjv[18] = "Son of man, the house of Israel is to me become dross: all they [are] brass, and tin, and iron, and lead, in the midst of the furnace; they are [even] the dross of silver.";
kjv[19] = "Therefore thus saith the Lord GOD; Because ye are all become dross, behold, therefore I will gather you into the midst of Jerusalem.";
kjv[20] = "[As] they gather silver, and brass, and iron, and lead, and tin, into the midst of the furnace, to blow the fire upon it, to melt [it]; so will I gather [you] in mine anger and in my fury, and I will leave [you there], and melt you.";
kjv[21] = "Yea, I will gather you, and blow upon you in the fire of my wrath, and ye shall be melted in the midst thereof.";
kjv[22] = "As silver is melted in the midst of the furnace, so shall ye be melted in the midst thereof; and ye shall know that I the LORD have poured out my fury upon you.";
kjv[23] = "And the word of the LORD came unto me, saying,";
kjv[24] = "Son of man, say unto her, Thou [art] the land that is not cleansed, nor rained upon in the day of indignation.";
kjv[25] = "[There is] a conspiracy of her prophets in the midst thereof, like a roaring lion ravening the prey; they have devoured souls; they have taken the treasure and precious things; they have made her many widows in the midst thereof.";
kjv[26] = "Her priests have violated my law, and have profaned mine holy things: they have put no difference between the holy and profane, neither have they shewed [difference] between the unclean and the clean, and have hid their eyes from my sabbaths, and I am profaned among them.";
kjv[27] = "Her princes in the midst thereof [are] like wolves ravening the prey, to shed blood, [and] to destroy souls, to get dishonest gain.";
kjv[28] = "And her prophets have daubed them with untempered [morter], seeing vanity, and divining lies unto them, saying, Thus saith the Lord GOD, when the LORD hath not spoken.";
kjv[29] = "The people of the land have used oppression, and exercised robbery, and have vexed the poor and needy: yea, they have oppressed the stranger wrongfully.";
kjv[30] = "And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none.";
kjv[31] = "Therefore have I poured out mine indignation upon them; I have consumed them with the fire of my wrath: their own way have I recompensed upon their heads, saith the Lord GOD.";

vul[18] = "fili hominis versa est mihi domus Israhel in scoriam omnes isti aes et stagnum et ferrum et plumbum in medio fornacis scoria argenti facti sunt";
rsv[19] = "Therefore thus says the Lord GOD: Because you have all become dross, therefore, behold, I will gather you into the midst of Jerusalem.";
asv[19] = "Therefore thus saith the Lord Jehovah: Because ye are all become dross, therefore, behold, I will gather you into the midst of Jerusalem.";
yng[19] = "Therefore, thus said the Lord Jehovah: Because of your all becoming dross, Therefore, lo, I am gathering you unto the midst of Jerusalem,";
dby[19] = "Therefore thus saith the Lord Jehovah: Because ye are all become dross, therefore behold, I will gather you into the midst of Jerusalem.";
web[19] = "Therefore thus saith the Lord GOD, Because ye are all become dross, behold, therefore I will gather you into the midst of Jerusalem.";
hnv[19] = "Therefore thus says the Lord GOD: Because you are all become dross, therefore, behold, I will gather you into the midst of Yerushalayim.";
vul[19] = "propterea haec dicit Dominus Deus eo quod versi estis omnes in scoriam propterea ecce ego congregabo vos in medium Hierusalem";
rsv[20] = "As men gather silver and bronze and iron and lead and tin into a furnace, to blow the fire upon it in order to melt it; so I will gather you in my anger and in my wrath, and I will put you in and melt you.";
asv[20] = "As they gather silver and brass and iron and lead and tin into the midst of the furnace, to blow the fire upon it, to melt it; so will I gather you in mine anger and in my wrath, and I will lay you there, and melt you.";
yng[20] = "A gathering of silver, and brass, and iron, and lead, and tin, Unto the midst of a furnace -- to blow on it fire, to melt it, So do I gather in Mine anger and in My fury, And I have let rest, and have melted you.";
dby[20] = "[As] they gather silver, and copper, and iron, and lead, and tin, into the midst of the furnace, to blow the fire upon it, to melt it, so will I gather you in mine anger and in my fury, and I will lay you on and melt you.";
web[20] = "[As] they gather silver, and brass, and iron, and lead, and tin, into the midst of the furnace, to blow the fire upon it, to melt [it]; so will I gather [you] in my anger and in my fury, and I will leave [you there], and melt you.";
hnv[20] = "As they gather silver and brass and iron and lead and tin into the midst of the furnace, to blow the fire on it, to melt it; so will I gather you in my anger and in my wrath, and I will lay you there, and melt you.";
vul[20] = "congregatione argenti et aeris et ferri et stagni et plumbi in medium fornacis ut succendam in eam ignem ad conflandum sic congregabo in furore meo et in ira mea et requiescam et conflabo vos";
rsv[21] = "I will gather you and blow upon you with the fire of my wrath, and you shall be melted in the midst of it.";
asv[21] = "Yea, I will gather you, and blow upon you with the fire of my wrath, and ye shall be melted in the midst thereof.";
yng[21] = "And I have heaped you up, And blown on you in the fire of My wrath, And ye have been melted in its midst.";
dby[21] = "Yea, I will collect you, and blow upon you the fire of my wrath, and ye shall be melted in the midst thereof.";
web[21] = "Yes, I will gather you, and blow upon you in the fire of my wrath, and ye shall be melted in the midst of it.";
hnv[21] = "Yes, I will gather you, and blow on you with the fire of my wrath, and you shall be melted in the midst of it.";
vul[21] = "et congregabo vos et succendam vos in igne furoris mei et conflabimini in medio eius";
rsv[22] = "As silver is melted in a furnace, so you shall be melted in the midst of it; and you shall know that I the LORD have poured out my wrath upon you.&quot;";
asv[22] = "As silver is melted in the midst of the furnace, so shall ye be melted in the midst thereof; and ye shall know that I, Jehovah, have poured out my wrath upon you.";
yng[22] = "As the melting of silver in the midst of a furnace, So are ye melted in its midst, And ye have known that I, Jehovah, I have poured out My fury upon you.\'";
dby[22] = "As silver is melted in the midst of the furnace, so shall ye be melted in the midst thereof: and ye shall know that I Jehovah have poured out my fury upon you.";
web[22] = "As silver is melted in the midst of the furnace, so shall ye be melted in the midst of it; and ye shall know that I the LORD have poured out my fury upon you.";
hnv[22] = "As silver is melted in the midst of the furnace, so shall you be melted in the midst of it; and you shall know that I, the LORD, have poured out my wrath on you.";
vul[22] = "ut conflatur argentum in medio fornacis sic eritis in medio eius et scietis quia ego Dominus effuderim indignationem meam super vos";
rsv[23] = "And the word of the LORD came to me:";
asv[23] = "And the word of Jehovah came unto me, saying,";
yng[23] = "And there is a word of Jehovah unto me, saying:";
dby[23] = "And the word of Jehovah came unto me, saying,";
web[23] = "And the word of the LORD came to me, saying,";
hnv[23] = "The word of the LORD came to me, saying,";
vul[23] = "et factum est verbum Domini ad me dicens";
rsv[24] = "&quot;Son of man, say to her, You are a land that is not cleansed, or rained upon in the day of indignation.";
asv[24] = "Son of man, say unto her, Thou art a land that is not cleansed, nor rained upon in the day of indignation.";
yng[24] = "`Son of man, say to it, Thou [art] a land, It [is] not cleansed nor rained on in a day of indignation.";
dby[24] = "Son of man, say unto her, Thou art a land that is not cleansed, nor rained upon in the day of indignation.";
web[24] = "Son of man, say to her, Thou [art] the land that is not cleansed, nor rained upon in the day of indignation.";
hnv[24] = "Son of man, tell her, You are a land that is not cleansed, nor rained on in the day of indignation.";
vul[24] = "fili hominis dic ei tu es terra inmunda et non conpluta in die furoris";
rsv[25] = "Her princes in the midst of her are like a roaring lion tearing the prey; they have devoured human lives; they have taken treasure and precious things; they have made many widows in the midst of her.";
asv[25] = "There is a conspiracy of her prophets in the midst thereof, like a roaring lion ravening the prey: they have devoured souls; they take treasure and precious things; they have made her widows many in the midst thereof.";
yng[25] = "A conspiracy of its prophets [is] in its midst, as a roaring lion tearing prey; The soul they have devoured, Wealth and glory they have taken, Its widows have multiplied in its midst.";
dby[25] = "There is a conspiracy of her prophets in the midst of her like a roaring lion ravening the prey; they devour souls; they take away treasure and precious things; they increase her widows in the midst of her;";
web[25] = "[There is] a conspiracy of her prophets in the midst of her, like a roaring lion ravening the prey; they have devoured souls; they have taken the treasure and precious things; they have made her many widows in the midst of her.";
hnv[25] = "There is a conspiracy of her prophets in the midst of it, like a roaring lion ravening the prey: they have devoured souls; they take treasure and precious things; they have made her widows many in the midst of it.";
vul[25] = "coniuratio prophetarum in medio eius sicut leo rugiens capiensque praedam animam devoraverunt opes et pretium acceperunt viduas eius multiplicaverunt in medio illius";
rsv[26] = "Her priests have done violence to my law and have profaned my holy things; they have made no distinction between the holy and the common, neither have they taught the difference between the unclean and the clean, and they have disregarded my sabbaths, so that I am profaned among them.";
asv[26] = "Her priests have done violence to my law, and have profaned my holy things: they have made no distinction between the holy and the common, neither have they caused men to discern between the unclean and the clean, and have hid their eyes from my sabbaths, and I am profaned among them.";
yng[26] = "Its priests have wronged My law, And they pollute My holy things, Between holy and common they have not made separation, And between the unclean and the clean they have not made known, And from my sabbaths they have hidden their eyes, And I am pierced in their midst.";
dby[26] = "her priests do violence to my law, and profane my holy things: they put no difference between the holy and profane, neither do they make known [the difference] between the unclean and the clean, and they hide their eyes from my sabbaths, and I am profaned among them.";
web[26] = "Her priests have violated my law, and have profaned my holy things: they have put no difference between the holy and profane, neither have they shown [difference] between the unclean and the clean, and have hid their eyes from my sabbaths, and I am profaned among them.";
hnv[26] = "Her Kohanim have done violence to my law, and have profaned my holy things: they have made no distinction between the holy and the common, neither have they caused men to discern between the unclean and the clean, and have hid their eyes from my Shabbatot, and I am profaned among them.";
vul[26] = "sacerdotes eius contempserunt legem meam et polluerunt sanctuaria mea inter sanctum et profanum non habuere distantiam et inter pollutum et mundum non intellexerunt et a sabbatis meis averterunt oculos suos et coinquinabar in medio eorum";
rsv[27] = "Her princes in the midst of her are like wolves tearing the prey, shedding blood, destroying lives to get dishonest gain.";
asv[27] = "Her princes in the midst thereof are like wolves ravening the prey, to shed blood, [and] to destroy souls, that they may get dishonest gain.";
yng[27] = "Its princes in its midst [are] as wolves, Tearing prey, to shed blood, to destroy souls, For the sake of gaining dishonest gain.";
dby[27] = "Her princes in the midst of her are like wolves ravening the prey, to shed blood, to destroy souls, to get dishonest gain.";
web[27] = "Her princes in the midst of her [are] like wolves ravening the prey, to shed blood, [and] to destroy souls, to get dishonest gain.";
hnv[27] = "Her princes in the midst of it are like wolves ravening the prey, to shed blood, [and] to destroy souls, that they may get dishonest gain.";
vul[27] = "principes eius in medio illius quasi lupi rapientes praedam ad effundendum sanguinem et perdendas animas et avare sectanda lucra";
rsv[28] = "And her prophets have daubed for them with whitewash, seeing false visions and divining lies for them, saying, \'Thus says the Lord GOD,\' when the LORD has not spoken.";
asv[28] = "And her prophets have daubed for them with untempered [mortar], seeing false visions, and divining lies unto them, saying, Thus saith the Lord Jehovah, when Jehovah hath not spoken.";
yng[28] = "And its prophets have daubed for them with chalk, Seeing a vain thing, and divining for them a lie, Saying, `Thus said the Lord Jehovah:\' And Jehovah hath not spoken.";
dby[28] = "And her prophets have daubed for them with untempered [mortar], seeing vanity and divining lies unto them, saying, Thus saith the Lord Jehovah! and Jehovah hath not spoken.";
web[28] = "And her prophets have daubed them with untempered [mortar], seeing vanity, and divining lies to them, saying, Thus saith the Lord GOD, when the LORD hath not spoken.";
hnv[28] = "Her prophets have daubed for them with whitewash, seeing false visions, and divining lies to them, saying, Thus says the Lord GOD, when the LORD has not spoken.";
vul[28] = "prophetae autem eius liniebant eos absque temperamento videntes vana et divinantes eis mendacium dicentes haec dicit Dominus Deus cum Dominus non sit locutus";
rsv[29] = "The people of the land have practiced extortion and committed robbery; they have oppressed the poor and needy, and have extorted from the sojourner without redress.";
asv[29] = "The people of the land have used oppression, and exercised robbery; yea, they have vexed the poor and needy, and have oppressed the sojourner wrongfully.";
yng[29] = "The people of the land have used oppression, And have taken plunder violently away, And humble and needy have oppressed, And the sojourner oppressed -- without judgment.";
dby[29] = "The people of the land use oppression and practise robbery; and they vex the poor and needy, and oppress the stranger wrongfully.";
web[29] = "The people of the land have used oppression, and exercised robbery, and have oppressed the poor and needy: yes, they have oppressed the stranger wrongfully.";
hnv[29] = "The people of the land have used oppression, and exercised robbery; yes, they have vexed the poor and needy, and have oppressed the foreigner wrongfully.";
vul[29] = "populi terrae calumniabantur calumniam et rapiebant violenter egenum et pauperem adfligebant et advenam opprimebant calumnia absque iudicio";
rsv[30] = "And I sought for a man among them who should build up the wall and stand in the breach before me for the land, that I should not destroy it; but I found none.";
asv[30] = "And I sought for a man among them, that should build up the wall, and stand in the gap before me for the land, that I should not destroy it; but I found none.";
yng[30] = "And I seek of them a man making a fence, And standing in the breach before Me, In behalf of the land -- not to destroy it, And I have not found.";
dby[30] = "And I sought for a man among them, that should make up the fence, and stand in the breach before me for the land, that I should not destroy it; but I found none.";
web[30] = "And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none.";
hnv[30] = "I sought for a man among them, who should build up the wall, and stand in the gap before me for the land, that I should not destroy it; but I found none.";
vul[30] = "et quaesivi de eis virum qui interponeret sepem et staret oppositus contra me pro terra ne dissiparem eam et non inveni";
rsv[31] = "Therefore I have poured out my indignation upon them; I have consumed them with the fire of my wrath; their way have I requited upon their heads, says the Lord GOD.&quot;";
asv[31] = "Therefore have I poured out mine indignation upon them; I have consumed them with the fire of my wrath: their own way have I brought upon their heads, saith the Lord Jehovah.";
yng[31] = "And I pour out on them mine indignation, By fire of My wrath I have consumed them, Their way on their own head I have put, An affirmation of the Lord Jehovah!\'";
dby[31] = "And I will pour out mine indignation upon them; I will consume them in the fire of my wrath: their own way will I recompense upon their head, saith the Lord Jehovah.";
web[31] = "Therefore have I poured out my indignation upon them; I have consumed them with the fire of my wrath: their own way have I recompensed upon their heads, saith the Lord GOD.";
hnv[31] = "Therefore have I poured out my indignation on them; I have consumed them with the fire of my wrath: their own way have I brought on their heads, says the Lord GOD.";
vul[31] = "et effudi super eos indignationem meam in igne irae meae consumpsi eos viam eorum in caput eorum reddidi ait Dominus Deus";
