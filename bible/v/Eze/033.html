csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, speak to your people and tell them, \'Suppose I bring the sword against a land, and the people of that land select a man from among them, appointing him as their watchman.";
csb[3] = "&quot;And suppose he sees the sword coming against the land and blows his trumpet to warn the people.";
csb[4] = "&quot;Then, if anyone hears the sound of the trumpet but ignores the warning, and the sword comes and takes him away, his death will be his own fault.";
csb[5] = "&quot;Since he heard the sound of the trumpet but ignored the warning, his death is his own fault. If he had taken warning, he would have saved his life.";
csb[6] = "&quot;However, suppose the watchman sees the sword coming but doesn\'t blow the trumpet, so that the people aren\'t warned, and the sword comes and takes away their lives. Then they have been taken away because of their iniquity, but I will hold the watchman accountable for their blood.\'";
csb[7] = "&quot;As for you, son of man, I have made you a watchman for the house of Israel. When you hear a word from my mouth, give them a warning from me.";
csb[8] = "&quot;If I say to the wicked, \'Wicked one, you will surely die,\' but you do not speak out to warn him about his way, that wicked person will die for his iniquity, yet I will hold you responsible for his blood.";
csb[9] = "&quot;But if you warn a wicked person to turn from his way and he doesn\'t turn from it, he will die for his iniquity, but you will have rescued yourself.";
csb[10] = "&quot;Now as for you, son of man, say to the house of Israel, \'You have said this: &quot;Our transgressions and our sins are heavy on us, and we are wasting away because of them! How then can we survive? &quot; \'";
csb[11] = "Tell them, \'As I live -- this is the declaration of the Lord GOD -- I take no pleasure in the death of the wicked, but rather that the wicked person should turn from his way and live. Repent, repent of your evil ways! Why will you die, house of Israel? \'";
csb[12] = "&quot;Now, son of man, say to your people, \'The righteousness of the righteous person will not save him on the day of his transgression; neither will the wickedness of the wicked person cause him to stumble on the day he turns from his wickedness. The righteous person won\'t be able to survive by his righteousness on the day he sins.";
csb[13] = "&quot;When I tell the righteous person that he will surely live, but he trusts in his righteousness and acts unjustly, then none of his righteousness will be remembered, and he will die because of the injustice he has committed.";
csb[14] = "&quot; \'So when I tell the wicked person, &quot;You will surely die,&quot; but he repents of his sin and does what is just and right --";
csb[15] = "he returns collateral, makes restitution for what he has stolen, and walks in the statutes of life without committing injustice -- he will certainly live; he will not die.";
csb[16] = "None of the sins he committed will be held against him. He has done what is just and right; he will certainly live.";
csb[17] = "&quot; \'But your people say, &quot;The Lord\'s way isn\'t fair,&quot; even though it is their own way that isn\'t fair.";
csb[18] = "When a righteous person turns from his righteousness and commits injustice, he will die for it.";
csb[19] = "But if a wicked person turns from his wickedness and does what is just and right, he will live because of it.";
csb[20] = "Yet you say, &quot;The Lord\'s way isn\'t fair.&quot; I will judge each of you according to his ways, house of Israel.\' &quot;";
csb[21] = "In the twelfth year of our exile, in the tenth month, on the fifth day of the month, a fugitive from Jerusalem came to me and reported, &quot;The city has been taken! &quot;";
csb[22] = "Now the hand of the LORD had been on me the evening before the fugitive arrived, and he opened my mouth before the man came to me in the morning. So my mouth was opened and I was no longer mute.";
csb[23] = "Then the word of the LORD came to me:";
csb[24] = "&quot;Son of man, those who live in the ruins in the land of Israel are saying, \'Abraham was only one person, yet he received possession of the land. But we are many; surely the land has been given to us as a possession.\'";
csb[25] = "&quot;Therefore say to them, \'This is what the Lord GOD says: You eat meat with blood in it, look to your idols, and shed blood. Should you then receive possession of the land?";
csb[26] = "&quot;You have relied on your swords, you have committed detestable acts, and each of you has defiled his neighbor\'s wife. Should you then receive possession of the land? \'";
csb[27] = "&quot;Tell them this: \'This is what the Lord GOD says: As surely as I live, those who are in the ruins will fall by the sword, those in the open field I have given to wild animals to be devoured, and those in the strongholds and caves will die by plague.";
csb[28] = "&quot;I will make the land a desolate waste, and its proud strength will come to an end. The mountains of Israel will become desolate, with no one passing through.";
csb[29] = "&quot;They will know that I am the LORD when I make the land a desolate waste because of all the detestable acts they have committed.\'";
csb[30] = "&quot;As for you, son of man, your people are talking about you near the city walls and in the doorways of their houses. One person speaks to another, each saying to his brother, \'Come and hear what the message is that comes from the LORD! \'";
csb[31] = "&quot;So my people come to you in crowds, sit in front of you, and hear your words, but they don\'t obey them. Their mouths go on passionately, but their hearts pursue dishonest profit.";
csb[32] = "&quot;Yes, to them you are like a singer of passionate songs who has a beautiful voice and plays skillfully on an instrument. They hear your words, but they don\'t obey them.";
csb[33] = "&quot;Yet when all this comes true -- and it definitely will -- then they will know that a prophet has been among them.&quot;";
kjv[1] = "Again the word of the LORD came unto me, saying,";
rsv[1] = "The word of the LORD came to me:";

vul[1] = "et factum est verbum Domini ad me dicens";
kjv[2] = "Son of man, speak to the children of thy people, and say unto them, When I bring the sword upon a land, if the people of the land take a man of their coasts, and set him for their watchman:";
rsv[2] = "&quot;Son of man, speak to your people and say to them, If I bring the sword upon a land, and the people of the land take a man from among them, and make him their watchman;";
asv[2] = "Son of man, speak to the children of thy people, and say unto them, When I bring the sword upon a land, and the people of the land take a man from among them, and set him for their watchman;";
yng[2] = "`Son of man, speak unto the sons of thy people, and thou hast said unto them: A land -- when I bring in against it a sword, And the people of the land have taken one man out of their borders, And made him to them for a watchman.";
dby[2] = "Son of man, speak to the children of thy people, and say unto them, When I bring the sword upon a land, and the people of the land take one man from among them all, and set him for their watchman:";
web[2] = "Son of man, speak to the children of thy people, and say to them, When I bring the sword upon a land, if the people of the land take a man of their borders, and set him for their watchman:";
hnv[2] = "Son of man, speak to the children of your people, and tell them, When I bring the sword on a land, and the people of the land take a man from among them, and set him for their watchman;";
vul[2] = "fili hominis loquere ad filios populi tui et dices ad eos terra cum induxero super eam gladium et tulerit populus terrae virum unum de novissimis suis et constituerit eum super se speculatorem";
kjv[3] = "If when he seeth the sword come upon the land, he blow the trumpet, and warn the people;";
rsv[3] = "and if he sees the sword coming upon the land and blows the trumpet and warns the people;";
asv[3] = "if, when he seeth the sword come upon the land, he blow the trumpet, and warn the people;";
yng[3] = "And he hath seen the sword coming against the land, And hath blown with a trumpet, and hath warned the people,";
dby[3] = "if he see the sword coming upon the land, and blow the trumpet, and warn the people;";
web[3] = "If when he seeth the sword come upon the land, he shall blow the trumpet, and warn the people;";
hnv[3] = "if, when he sees the sword come on the land, he blow the shofar, and warn the people;";
vul[3] = "et ille viderit gladium venientem super terram et cecinerit bucina et adnuntiaverit populo";
kjv[4] = "Then whosoever heareth the sound of the trumpet, and taketh not warning; if the sword come, and take him away, his blood shall be upon his own head.";
rsv[4] = "then if any one who hears the sound of the trumpet does not take warning, and the sword comes and takes him away, his blood shall be upon his own head.";
asv[4] = "then whosoever heareth the sound of the trumpet, and taketh not warning, if the sword come, and take him away, his blood shall be upon his own head.";
yng[4] = "And the hearer hath heard the voice of the trumpet, and he hath not taken warning, And come in doth the sword, and taketh him away, His blood is on his head.";
dby[4] = "then whosoever heareth the sound of the trumpet, and taketh not warning, if the sword come and take him away, his blood shall be upon his own head.";
web[4] = "Then whoever heareth the sound of the trumpet, and taketh not warning; if the sword shall come and take him away, his blood shall be upon his own head.";
hnv[4] = "then whoever hears the sound of the shofar, and doesn\'t take warning, if the sword come, and take him away, his blood shall be on his own head.";
vul[4] = "audiens autem quisquis ille est sonum bucinae non se observaverit veneritque gladius et tulerit eum sanguis ipsius super caput eius erit";
kjv[5] = "He heard the sound of the trumpet, and took not warning; his blood shall be upon him. But he that taketh warning shall deliver his soul.";
rsv[5] = "He heard the sound of the trumpet, and did not take warning; his blood shall be upon himself. But if he had taken warning, he would have saved his life.";
asv[5] = "He heard the sound of the trumpet, and took not warning; his blood shall be upon him; whereas if he had taken warning, he would have delivered his soul.";
yng[5] = "The voice of the trumpet he heard, And he hath not taken warning, his blood is on him, And he who took warning his soul hath delivered.";
dby[5] = "He heard the sound of the trumpet, and took not warning; his blood is upon him: whereas had he taken warning, he would have delivered his soul.";
web[5] = "He heard the sound of the trumpet, and took not warning; his blood shall be upon him. But he that taketh warning shall deliver his soul.";
hnv[5] = "He heard the sound of the shofar, and didn\'t take warning; his blood shall be on him; whereas if he had taken warning, he would have delivered his soul.";
vul[5] = "sonum bucinae audivit et non se observavit sanguis eius in ipso erit si autem custodierit animam suam salvavit";
kjv[6] = "But if the watchman see the sword come, and blow not the trumpet, and the people be not warned; if the sword come, and take [any] person from among them, he is taken away in his iniquity; but his blood will I require at the watchman\'s hand.";
rsv[6] = "But if the watchman sees the sword coming and does not blow the trumpet, so that the people are not warned, and the sword comes, and takes any one of them; that man is taken away in his iniquity, but his blood I will require at the watchman\'s hand.";
asv[6] = "But if the watchman see the sword come, and blow not the trumpet, and the people be not warned, and the sword come, and take any person from among them; he is taken away in his iniquity, but his blood will I require at the watchman\'s hand.";
yng[6] = "And the watchman, when he seeth the sword coming in, And he hath not blown with a trumpet, And the people hath not been warned, And come in doth a sword, And taketh away of them -- a soul, He in his iniquity is taken away, And his blood from the hand of the watchman I require.";
dby[6] = "But if the watchman see the sword coming, and blow not the trumpet, and the people be not warned, if the sword come and take a person from among them, he is taken away in his iniquity; but his blood will I require at the watchman\'s hand.";
web[6] = "But if the watchman shall see the sword come, and blow not the trumpet, and the people be not warned; if the sword shall come, and take [any] person from among them, he is taken away in his iniquity; but his blood will I require at the watchman\'s hand.";
hnv[6] = "But if the watchman sees the sword come, and doesn\'t blow the shofar, and the people aren\'t warned, and the sword comes, and take any person from among them; he is taken away in his iniquity, but his blood will I require at the watchman\'s hand.";
vul[6] = "quod si speculator viderit gladium venientem et non insonuerit bucina et populus non se custodierit veneritque gladius et tulerit de eis animam ille quidem in iniquitate sua captus est sanguinem autem eius de manu speculatoris requiram";
kjv[7] = "So thou, O son of man, I have set thee a watchman unto the house of Israel; therefore thou shalt hear the word at my mouth, and warn them from me.";
rsv[7] = "&quot;So you, son of man, I have made a watchman for the house of Israel; whenever you hear a word from my mouth, you shall give them warning from me.";
asv[7] = "So thou, son of man, I have set thee a watchman unto the house of Israel; therefore hear the word at my mouth, and give them warning from me.";
yng[7] = "And thou, son of man, A watchman I gave thee to the house of Israel, And thou hast heard from My mouth a word, And thou hast warned them from Me.";
dby[7] = "So thou, son of man, I have set thee a watchman unto the house of Israel; and thou shalt hear the word from my mouth, and warn them from me.";
web[7] = "So thou, O son of man, I have set thee a watchman to the house of Israel; therefore thou shalt hear the word at my mouth, and warn them from me.";
hnv[7] = " So you, son of man, I have set you a watchman to the house of Yisra\'el; therefore hear the word at my mouth, and give them warning from me.";
vul[7] = "et tu fili hominis speculatorem dedi te domui Israhel audiens ergo ex ore meo sermonem adnuntiabis eis ex me";
kjv[8] = "When I say unto the wicked, O wicked [man], thou shalt surely die; if thou dost not speak to warn the wicked from his way, that wicked [man] shall die in his iniquity; but his blood will I require at thine hand.";
rsv[8] = "If I say to the wicked, O wicked man, you shall surely die, and you do not speak to warn the wicked to turn from his way, that wicked man shall die in his iniquity, but his blood I will require at your hand.";
asv[8] = "When I say unto the wicked, O wicked man, thou shalt surely die, and thou dost not speak to warn the wicked from his way; that wicked man shall die in his iniquity, but his blood will I require at thy hand.";
yng[8] = "In My saying to the wicked, O wicked one -- thou dost surely die, And thou hast not spoken to warn the wicked from his way, He -- the wicked -- in his iniquity doth die, And his blood from thy hand I require.";
dby[8] = "When I say unto the wicked, Wicked [man], thou shalt certainly die; and thou speakest not to warn the wicked from his way, that wicked [man] shall die in his iniquity; but his blood will I require at thy hand.";
web[8] = "When I say to the wicked, O wicked [man], thou shalt surely die; if thou dost not speak to warn the wicked from his way, that wicked [man] shall die in his iniquity; but his blood will I require at thy hand.";
hnv[8] = "When I tell the wicked, O wicked man, you shall surely die, and you don\'t speak to warn the wicked from his way; that wicked man shall die in his iniquity, but his blood will I require at your hand.";
vul[8] = "si me dicente ad impium impie morte morieris non fueris locutus ut se custodiat impius a via sua ipse impius in iniquitate sua morietur sanguinem autem eius de manu tua requiram";
kjv[9] = "Nevertheless, if thou warn the wicked of his way to turn from it; if he do not turn from his way, he shall die in his iniquity; but thou hast delivered thy soul.";
rsv[9] = "But if you warn the wicked to turn from his way, and he does not turn from his way; he shall die in his iniquity, but you will have saved your life.";
asv[9] = "Nevertheless, if thou warn the wicked of his way to turn from it, and he turn not from his way; he shall die in his iniquity, but thou hast delivered thy soul.";
yng[9] = "And thou, when thou hast warned the wicked of his way, to turn back from it, And he hath not turned back from his way, He in his iniquity doth die, And thou thy soul hast delivered.";
dby[9] = "But if thou warn the wicked of his way to turn from it, and he do not turn from his way, he shall die in his iniquity; but thou hast delivered thy soul.";
web[9] = "Nevertheless, if thou shalt warn the wicked of his way to turn from it; if he shall not turn from his way, he shall die in his iniquity; but thou hast delivered thy soul.";
hnv[9] = " Nevertheless, if you warn the wicked of his way to turn from it, and he doesn\'t turn from his way; he shall die in his iniquity, but you have delivered your soul.";
vul[9] = "si autem adnuntiante te ad impium ut a viis suis convertatur non fuerit conversus a via sua ipse in iniquitate sua morietur porro tu animam tuam liberasti";
kjv[10] = "Therefore, O thou son of man, speak unto the house of Israel; Thus ye speak, saying, If our transgressions and our sins [be] upon us, and we pine away in them, how should we then live?";
rsv[10] = "&quot;And you, son of man, say to the house of Israel, Thus have you said: \'Our transgressions and our sins are upon us, and we waste away because of them; how then can we live?\'";
asv[10] = "And thou, son of man, say unto the house of Israel: Thus ye speak, saying, Our transgressions and our sins are upon us, and we pine away in them; how then can we live?";
yng[10] = "And thou, son of man, say unto the house of Israel: Rightly ye have spoken, saying: Surely our transgressions and our sins [are] on us, And in them we are wasting away, How, then, do we live?";
dby[10] = "And thou, son of man, say unto the house of Israel, Thus ye speak, saying, Our transgressions and our sins are upon us, and we waste away in them, how then should we live?";
web[10] = "Therefore, O thou son of man, speak to the house of Israel; Thus ye speak, saying, If our transgressions and our sins [are] upon us, and we pine away in them, how should we then live?";
hnv[10] = "You, son of man, tell the house of Yisra\'el: Thus you speak, saying, Our transgressions and our sins are on us, and we pine away in them; how then can we live?";
vul[10] = "tu ergo fili hominis dic ad domum Israhel sic locuti estis dicentes iniquitates nostrae et peccata nostra super nos sunt et in ipsis nos tabescimus quomodo ergo vivere poterimus";
kjv[11] = "Say unto them, [As] I live, saith the Lord GOD, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?";
rsv[11] = "Say to them, As I live, says the Lord GOD, I have no pleasure in the death of the wicked, but that the wicked turn from his way and live; turn back, turn back from your evil ways; for why will you die, O house of Israel?";
asv[11] = "Say unto them, As I live, saith the Lord Jehovah, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?";
yng[11] = "Say unto them, I live -- an affirmation of the Lord Jehovah, I delight not in the death of the wicked, But -- in the turning of the wicked from his way, And he hath lived, Turn back, turn back, from your evil ways, Yea, why do ye die, O house of Israel?";
dby[11] = "Say unto them, As I live, saith the Lord Jehovah, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live. Turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?";
web[11] = "Say to them, [As] I live, saith the Lord GOD, I have no pleasure in the death of the wicked; but that the wicked should turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?";
hnv[11] = "Tell them, As I live, says the Lord GOD, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn you, turn you from your evil ways; for why will you die, house of Yisra\'el?";
vul[11] = "dic ad eos vivo ego dicit Dominus Deus nolo mortem impii sed ut revertatur impius a via sua et vivat convertimini a viis vestris pessimis et quare moriemini domus Israhel";
kjv[12] = "Therefore, thou son of man, say unto the children of thy people, The righteousness of the righteous shall not deliver him in the day of his transgression: as for the wickedness of the wicked, he shall not fall thereby in the day that he turneth from his wickedness; neither shall the righteous be able to live for his [righteousness] in the day that he sinneth.";
rsv[12] = "And you, son of man, say to your people, The righteousness of the righteous shall not deliver him when he transgresses; and as for the wickedness of the wicked, he shall not fall by it when he turns from his wickedness; and the righteous shall not be able to live by his righteousness when he sins.";
asv[12] = "And thou, son of man, say unto the children of thy people, The righteousness of the righteous shall not deliver him in the day of his transgression; and as for the wickedness of the wicked, he shall not fall thereby in the day that he turneth from his wickedness; neither shall he that is righteous be able to live thereby in the day that he sinneth.";
yng[12] = "And thou, son of man, say unto the sons of thy people: The righteousness of the righteous doth not deliver him in the day of his transgression, And the wickedness of the wicked, He doth not stumble for it in the day of his turning from his wickedness, And the righteous is not able to live in it in the day of his sinning.";
dby[12] = "And thou, son of man, say unto the children of thy people, The righteousness of the righteous shall not deliver him in the day of his transgression; and as for the wickedness of the wicked, he shall not fall thereby in the day that he turneth from his wickedness; neither shall the righteous be able to live thereby in the day that he sinneth.";
web[12] = "Therefore, thou son of man, say to the children of thy people, The righteousness of the righteous shall not deliver him in the day of his transgression: as for the wickedness of the wicked, he shall not fall by it in the day that he turneth from his wickedness; neither shall the righteous be able to live for his [righteousness] in the day that he sinneth.";
hnv[12] = "You, son of man, tell the children of your people, The righteousness of the righteous shall not deliver him in the day of his disobedience; and as for the wickedness of the wicked, he shall not fall thereby in the day that he turns from his wickedness; neither shall he who is righteous be able to live thereby in the day that he sins.";
vul[12] = "tu itaque fili hominis dic ad filios populi tui iustitia iusti non liberabit eum in quacumque die peccaverit et impietas impii non nocebit ei in quacumque die conversus fuerit ab impietate sua et iustus non poterit vivere in iustitia sua in quacumque die peccaverit";
kjv[13] = "When I shall say to the righteous, [that] he shall surely live; if he trust to his own righteousness, and commit iniquity, all his righteousnesses shall not be remembered; but for his iniquity that he hath committed, he shall die for it.";
rsv[13] = "Though I say to the righteous that he shall surely live, yet if he trusts in his righteousness and commits iniquity, none of his righteous deeds shall be remembered; but in the iniquity that he has committed he shall die.";
asv[13] = "When I say to the righteous, that he shall surely live; if he trust to his righteousness, and commit iniquity, none of his righteous deeds shall be remembered; but in his iniquity that he hath committed, therein shall he die.";
yng[13] = "In My saying of the righteous: He surely liveth, And -- he hath trusted on his righteousness, And he hath done perversity, All his righteous acts are not remembered, And for his perversity that he hath done, For it he doth die.";
dby[13] = "When I say to the righteous that he shall certainly live, and he trusteth to his righteousness and doeth what is wrong, none of his righteous acts shall be remembered; but in his unrighteousness which he hath done, in it shall he die.";
web[13] = "When I shall say to the righteous, [that] he shall surely live; if he shall trust to his own righteousness, and commit iniquity, all his righteousnesses shall not be remembered; but for his iniquity that he hath committed, he shall die for it.";
hnv[13] = "When I tell the righteous, that he shall surely live; if he trust to his righteousness, and commit iniquity, none of his righteous deeds shall be remembered; but in his iniquity that he has committed, therein shall he die.";
vul[13] = "etiam si dixero iusto quod vita vivat et confisus in iustitia sua fecerit iniquitatem omnes iustitiae eius oblivioni tradentur et in iniquitate sua quam operatus est in ipsa morietur";
kjv[14] = "Again, when I say unto the wicked, Thou shalt surely die; if he turn from his sin, and do that which is lawful and right;";
rsv[14] = "Again, though I say to the wicked, \'You shall surely die,\' yet if he turns from his sin and does what is lawful and right,";
asv[14] = "Again, when I say unto the wicked, Thou shalt surely die; if he turn from his sin, and do that which is lawful and right;";
yng[14] = "And in My saying to the wicked: Thou surely diest, And -- he hath turned back from his sin, And hath done judgment and righteousness,";
dby[14] = "And when I say unto the wicked, Thou shalt certainly die, and he turneth from his sin, and doeth judgment and justice;";
web[14] = "Again, when I say to the wicked, Thou shalt surely die; if he shall turn from his sin, and do that which is lawful and right;";
hnv[14] = "Again, when I say to the wicked, You shall surely die; if he turn from his sin, and do that which is lawful and right;";
vul[14] = "sin autem dixero impio morte morieris et egerit paenitentiam a peccato suo feceritque iudicium et iustitiam";
kjv[15] = "[If] the wicked restore the pledge, give again that he had robbed, walk in the statutes of life, without committing iniquity; he shall surely live, he shall not die.";
rsv[15] = "if the wicked restores the pledge, gives back what he has taken by robbery, and walks in the statutes of life, committing no iniquity; he shall surely live, he shall not die.";
asv[15] = "if the wicked restore the pledge, give again that which he had taken by robbery, walk in the statutes of life, committing no iniquity; he shall surely live, he shall not die.";
yng[15] = "(The pledge the wicked restoreth, plunder he repayeth,) In the statutes of life he hath walked, So as not to do perversity, He surely liveth -- he doth not die.";
dby[15] = "if the wicked restore the pledge, give again that he had taken by robbery, walk in the statutes of life, doing nothing that is wrong; he shall certainly live, he shall not die.";
web[15] = "[If] the wicked shall restore the pledge, give again that which he had robbed, walk in the statutes of life, without committing iniquity; he shall surely live, he shall not die.";
hnv[15] = "if the wicked restore the pledge, give again that which he had taken by robbery, walk in the statutes of life, committing no iniquity; he shall surely live, he shall not die.";
vul[15] = "pignus restituerit ille impius rapinamque reddiderit in mandatis vitae ambulaverit nec fecerit quicquam iniustum vita vivet et non morietur";
kjv[16] = "None of his sins that he hath committed shall be mentioned unto him: he hath done that which is lawful and right; he shall surely live.";
rsv[16] = "None of the sins that he has committed shall be remembered against him; he has done what is lawful and right, he shall surely live.";
asv[16] = "None of his sins that he hath committed shall be remembered against him: he hath done that which is lawful and right; he shall surely live.";
yng[16] = "None of his sin that he hath sinned is remembered to him, Judgment and righteousness he hath done, He doth surely live.";
dby[16] = "None of his sins which he hath committed shall be remembered against him: he hath done judgment and justice; he shall certainly live.";
web[16] = "None of his sins that he hath committed shall be mentioned to him: he hath done that which is lawful and right; he shall surely live.";
hnv[16] = "None of his sins that he has committed shall be remembered against him: he has done that which is lawful and right; he shall surely live.";
vul[16] = "omnia peccata eius quae peccavit non inputabuntur ei iudicium et iustitiam fecit vita vivet";
kjv[17] = "Yet the children of thy people say, The way of the Lord is not equal: but as for them, their way is not equal.";
rsv[17] = "&quot;Yet your people say, \'The way of the Lord is not just\'; when it is their own way that is not just.";
asv[17] = "Yet the children of thy people say, The way of the Lord is not equal: but as for them, their way is not equal.";
yng[17] = "And the sons of thy people have said: The way of the Lord is not pondered, As to them -- their way is not pondered.";
dby[17] = "Yet the children of thy people say, The way of the Lord is not equal: but as for them, their way is not equal.";
web[17] = "Yet the children of thy people say, The way of the Lord is not equal: but as for them, their way is not equal.";
hnv[17] = "Yet the children of your people say, The way of the Lord is not equal: but as for them, their way is not equal.";
vul[17] = "et dixerunt filii populi tui non est aequi ponderis via Domini et ipsorum via iniusta est";
kjv[18] = "When the righteous turneth from his righteousness, and committeth iniquity, he shall even die thereby.";
rsv[18] = "When the righteous turns from his righteousness, and commits iniquity, he shall die for it.";
asv[18] = "When the righteous turneth from his righteousness, and committeth iniquity, he shall even die therein.";
yng[18] = "In the turning back of the righteous from his righteousness, And he hath done perversity -- he dieth for it.";
dby[18] = "When the righteous turneth from his righteousness, and doeth what is wrong, then he shall die therein.";
web[18] = "When the righteous turneth from his righteousness, and committeth iniquity, for that he shall even die.";
hnv[18] = " When the righteous turns from his righteousness, and commits iniquity, he shall even die therein.";
vul[18] = "cum enim recesserit iustus a iustitia sua feceritque iniquitatem morietur in eis";
kjv[19] = "But if the wicked turn from his wickedness, and do that which is lawful and right, he shall live thereby.";
rsv[19] = "And when the wicked turns from his wickedness, and does what is lawful and right, he shall live by it.";
asv[19] = "And when the wicked turneth from his wickedness, and doeth that which is lawful and right, he shall live thereby.";
yng[19] = "And in the turning back of the wicked from his wickedness, And he hath done judgment and righteousness, by them he liveth.";
dby[19] = "And when the wicked turneth from his wickedness, and doeth judgment and justice, he shall live for these things.";
web[19] = "But if the wicked shall turn from his wickedness, and do that which is lawful and right, for that he shall live.";
hnv[19] = "When the wicked turns from his wickedness, and does that which is lawful and right, he shall live thereby.";
vul[19] = "et cum recesserit impius ab impietate sua feceritque iudicium et iustitiam vivet in eis";
kjv[20] = "Yet ye say, The way of the Lord is not equal. O ye house of Israel, I will judge you every one after his ways.";
rsv[20] = "Yet you say, \'The way of the Lord is not just.\' O house of Israel, I will judge each of you according to his ways.&quot;";
asv[20] = "Yet ye say, The way of the Lord is not equal. O house of Israel, I will judge you every one after his ways.";
yng[20] = "And ye have said: The way of the Lord is not pondered, Each according to his ways do I judge you, O house of Israel.\'";
dby[20] = "Yet ye say, The way of the Lord is not equal. O house of Israel, I will judge you every one after his ways.";
web[20] = "Yet ye say, The way of the Lord is not equal. O ye house of Israel, I will judge you every one after his ways.";
hnv[20] = "Yet you say, The way of the Lord is not equal. House of Yisra\'el, I will judge you everyone after his ways.";
vul[20] = "et dicitis non est recta via Domini unumquemque iuxta vias suas iudicabo de vobis domus Israhel";
kjv[21] = "And it came to pass in the twelfth year of our captivity, in the tenth [month], in the fifth [day] of the month, [that] one that had escaped out of Jerusalem came unto me, saying, The city is smitten.";
rsv[21] = "In the twelfth year of our exile, in the tenth month, on the fifth day of the month, a man who had escaped from Jerusalem came to me and said, &quot;The city has fallen.&quot;";
asv[21] = "And it came to pass in the twelfth year of our captivity, in the tenth [month], in the fifth [day] of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten.";
yng[21] = "And it cometh to pass, in the twelfth year -- in the tenth [month], in the fifth of the month -- of our removal, come in unto me doth one who is escaped from Jerusalem, saying, `The city hath been smitten.\'";
dby[21] = "And it came to pass in the twelfth year of our captivity, in the tenth [month], on the fifth of the month, that one who had escaped out of Jerusalem came unto me, saying, The city is smitten!";
web[21] = "And it came to pass in the twelfth year of our captivity, in the tenth [month], in the fifth [day] of the month, [that] one that had escaped out of Jerusalem came to me, saying, The city is smitten.";
hnv[21] = "It happened in the twelfth year of our captivity, in the tenth [month], in the fifth [day] of the month, that one who had escaped out of Yerushalayim came to me, saying, The city has been struck.";
vul[21] = "et factum est in duodecimo anno in duodecimo mense in quinta mensis transmigrationis nostrae venit ad me qui fugerat de Hierusalem dicens vastata est civitas";
kjv[22] = "Now the hand of the LORD was upon me in the evening, afore he that was escaped came; and had opened my mouth, until he came to me in the morning; and my mouth was opened, and I was no more dumb.";
rsv[22] = "Now the hand of the LORD had been upon me the evening before the fugitive came; and he had opened my mouth by the time the man came to me in the morning; so my mouth was opened, and I was no longer dumb.";
asv[22] = "Now the hand of Jehovah had been upon me in the evening, before he that was escaped came; and he had opened my mouth, until he came to me in the morning; and my mouth was opened, and I was no more dumb.";
yng[22] = "And the hand of Jehovah hath been unto me in the evening, before the coming in of the escaped one, and He openeth my mouth till the coming in unto me in the morning, and opened is my mouth, and I have not been silent again.";
dby[22] = "Now the hand of Jehovah had been upon me in the evening, before he that had escaped came; and he had opened my mouth against his coming to me in the morning; and my mouth was opened, and I was no more dumb.";
web[22] = "Now the hand of the LORD was upon me in the evening, before he that had escaped came; and had opened my mouth, until he came to me in the morning; and my mouth was opened, and I was no more dumb.";
hnv[22] = "Now the hand of the LORD had been on me in the evening, before he who was escaped came; and he had opened my mouth, until he came to me in the morning; and my mouth was opened, and I was no more mute.";
vul[22] = "manus autem Domini facta fuerat ad me vespere antequam veniret qui fugerat aperuitque os meum donec veniret ad me mane et aperto ore meo non silui amplius";
kjv[23] = "Then the word of the LORD came unto me, saying,";
rsv[23] = "The word of the LORD came to me:";
asv[23] = "And the word of Jehovah came unto me, saying,";
yng[23] = "And there is a word of Jehovah unto me, saying,";
dby[23] = "And the word of Jehovah came unto me, saying,";
web[23] = "Then the word of the LORD came to me, saying,";
hnv[23] = "The word of the LORD came to me, saying,";
vul[23] = "et factum est verbum Domini ad me dicens";
kjv[24] = "Son of man, they that inhabit those wastes of the land of Israel speak, saying, Abraham was one, and he inherited the land: but we [are] many; the land is given us for inheritance.";
rsv[24] = "&quot;Son of man, the inhabitants of these waste places in the land of Israel keep saying, \'Abraham was only one man, yet he got possession of the land; but we are many; the land is surely given us to possess.\'";
asv[24] = "Son of man, they that inhabit those waste places in the land of Israel speak, saying, Abraham was one, and he inherited the land: but we are many; the land is given us for inheritance.";
yng[24] = "`Son of man, the inhabitants of these wastes on the ground of Israel are speaking, saying: Alone hath been Abraham -- and he possesseth the land, and we [are] many -- to us hath the land been given for a possession.";
dby[24] = "Son of man, they that inhabit those waste places in the land of Israel speak, saying, Abraham was one, and he inherited this land, and we are many: the land is given us for a possession.";
web[24] = "Son of man, they that inhabit those wastes of the land of Israel speak, saying, Abraham was one, and he inherited the land: but we [are] many; the land is given to us for inheritance.";
hnv[24] = "Son of man, they who inhabit those waste places in Eretz-Yisra\'el speak, saying, Avraham was one, and he inherited the land: but we are many; the land is given us for inheritance.";
vul[24] = "fili hominis qui habitant in ruinosis his super humum Israhel loquentes aiunt unus erat Abraham et hereditate possedit terram nos autem multi nobis data est terra in possessionem";
kjv[25] = "Wherefore say unto them, Thus saith the Lord GOD; Ye eat with the blood, and lift up your eyes toward your idols, and shed blood: and shall ye possess the land?";
rsv[25] = "Therefore say to them, Thus says the Lord GOD: You eat flesh with the blood, and lift up your eyes to your idols, and shed blood; shall you then possess the land?";
asv[25] = "Wherefore say unto them, Thus saith the Lord Jehovah: Ye eat with the blood, and lift up your eyes unto your idols, and shed blood: and shall ye possess the land?";
yng[25] = "Therefore say unto them: Thus said the Lord Jehovah: With the blood ye do eat, And your eyes ye lift up unto your idols, And blood ye shed, and the land ye inherit!";
dby[25] = "Therefore say unto them, Thus saith the Lord Jehovah: Ye eat with the blood, and lift up your eyes toward your idols, and shed blood; and shall ye possess the land?";
web[25] = "Wherefore say to them, Thus saith the Lord GOD; Ye eat with the blood, and lift up your eyes towards your idols, and shed blood: and shall ye possess the land?";
hnv[25] = "Therefore tell them, Thus says the Lord GOD: You eat with the blood, and lift up your eyes to your idols, and shed blood: and shall you possess the land?";
vul[25] = "idcirco dices ad eos haec dicit Dominus Deus qui in sanguine comeditis et oculos vestros levatis ad inmunditias vestras et sanguinem funditis numquid terram hereditate possidebitis";
kjv[26] = "Ye stand upon your sword, ye work abomination, and ye defile every one his neighbour\'s wife: and shall ye possess the land?";
rsv[26] = "You resort to the sword, you commit abominations and each of you defiles his neighbor\'s wife; shall you then possess the land?";
asv[26] = "Ye stand upon your sword, ye work abomination, and ye defile every one his neighbor\'s wife: and shall ye possess the land?";
yng[26] = "Ye have stood on your sword, Ye have done abomination, Each the wife of his neighbour ye have defiled, And the land ye possess!";
dby[26] = "Ye stand upon your sword, ye work abomination, and ye defile every one his neighbour\'s wife; and shall ye possess the land?";
web[26] = "Ye stand upon your sword, ye work abomination, and ye defile every one his neighbor\'s wife: and shall ye possess the land?";
hnv[26] = "You stand on your sword, you work abomination, and you defile everyone his neighbor\'s wife: and shall you possess the land?";
vul[26] = "stetistis in gladiis vestris fecistis abominationes et unusquisque uxorem proximi sui polluit et terram hereditate possidebitis";
kjv[27] = "Say thou thus unto them, Thus saith the Lord GOD; [As] I live, surely they that [are] in the wastes shall fall by the sword, and him that [is] in the open field will I give to the beasts to be devoured, and they that [be] in the forts and in the caves shall die of the pestilence.";
rsv[27] = "Say this to them, Thus says the Lord GOD: As I live, surely those who are in the waste places shall fall by the sword; and him that is in the open field I will give to the beasts to be devoured; and those who are in strongholds and in caves shall die by pestilence.";
asv[27] = "Thus shalt thou say unto them, Thus saith the Lord Jehovah: As I live, surely they that are in the waste places shall fall by the sword; and him that is in the open field will I give to the beasts to be devoured; and they that are in the strongholds and in the caves shall die of the pestilence.";
yng[27] = "Thus dost thou say unto them: Thus said the Lord Jehovah: I live -- do not they who [are] in the wastes by the sword fall? And they who [are] on the face of the field, To the beast I have given for food, And they who are in strongholds and in caves by pestilence die.";
dby[27] = "Say thou thus unto them, Thus saith the Lord Jehovah: [As] I live, verily they that are in the waste places shall fall by the sword, and him that is in the open field will I give to the beasts to be devoured, and they that are in the strongholds and in the caves shall die of the pestilence.";
web[27] = "Say thou thus to them, Thus saith the Lord GOD; [As] I live, surely they that [are] in the wastes shall fall by the sword, and him that [is] in the open field will I give to the beasts to be devoured, and they that [are] in the forts and in the caves shall die by the pestilence.";
hnv[27] = "Thus shall you tell them, Thus says the Lord GOD: As I live, surely those who are in the waste places shall fall by the sword; and him who is in the open field will I give to the animals to be devoured; and those who are in the strongholds and in the caves shall die of the pestilence.";
vul[27] = "haec dices ad eos sic dicit Dominus Deus vivo ego quia qui in ruinosis habitant gladio cadent et qui in agro est bestiis tradetur ad devorandum qui autem in praesidiis et in speluncis sunt peste morientur";
kjv[28] = "For I will lay the land most desolate, and the pomp of her strength shall cease; and the mountains of Israel shall be desolate, that none shall pass through.";
rsv[28] = "And I will make the land a desolation and a waste; and her proud might shall come to an end; and the mountains of Israel shall be so desolate that none will pass through.";
asv[28] = "And I will make the land a desolation and an astonishment; and the pride of her power shall cease; and the mountains of Israel shall be desolate, so that none shall pass through.";
yng[28] = "And I have made the land a desolation and an astonishment, And ceased hath the excellency of its strength, And desolated have been mountains of Israel, Without any one passing through.";
dby[28] = "And I will make the land a desolation and an astonishment, and the pride of her strength shall cease; and the mountains of Israel shall be desolated, so that none shall pass through.";
web[28] = "For I will lay the land most desolate, and the pomp of her strength shall cease; and the mountains of Israel shall be desolate, that none shall pass through.";
hnv[28] = "I will make the land a desolation and an astonishment; and the pride of her power shall cease; and the mountains of Yisra\'el shall be desolate, so that none shall pass through.";
vul[28] = "et dabo terram in solitudinem et desertum et deficiet superba fortitudo eius et desolabuntur montes Israhel eo quod nullus sit qui per eos transeat";
kjv[29] = "Then shall they know that I [am] the LORD, when I have laid the land most desolate because of all their abominations which they have committed.";
rsv[29] = "Then they will know that I am the LORD, when I have made the land a desolation and a waste because of all their abominations which they have committed.";
asv[29] = "Then shall they know that I am Jehovah, when I have made the land a desolation and an astonishment, because of all their abominations which they have committed.";
yng[29] = "And they have known that I [am] Jehovah, In My making the land a desolation and an astonishment, For all their abominations that they have done.";
dby[29] = "And they shall know that I [am] Jehovah, when I have made the land a desolation and an astonishment because of all their abominations which they have committed.";
web[29] = "Then shall they know that I [am] the LORD, when I have laid the land most desolate because of all their abominations which they have committed.";
hnv[29] = "Then shall they know that I am the LORD, when I have made the land a desolation and an astonishment, because of all their abominations which they have committed.";
vul[29] = "et scient quia ego Dominus cum dedero terram desolatam et desertam propter universas abominationes suas quas operati sunt";
kjv[30] = "Also, thou son of man, the children of thy people still are talking against thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying, Come, I pray you, and hear what is the word that cometh forth from the LORD.";
rsv[30] = "&quot;As for you, son of man, your people who talk together about you by the walls and at the doors of the houses, say to one another, each to his brother, \'Come, and hear what the word is that comes forth from the LORD.\'";
asv[30] = "And as for thee, son of man, the children of thy people talk of thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying, Come, I pray you, and hear what is the word that cometh forth from Jehovah.";
yng[30] = "And thou, son of man, the sons of thy people who are speaking about thee, By the walls, and in openings of the houses, Have spoken one with another, each with his brother, Saying: Come in, I pray you, And hear what [is] the word that cometh out from Jehovah.";
dby[30] = "And as for thee, son of man, the children of thy people keep talking of thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying, Come, I pray you, and hear what is the word that cometh forth from Jehovah.";
web[30] = "Also, thou son of man, the children of thy people still are talking against thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying, Come, I pray you, and hear what is the word that cometh forth from the LORD.";
hnv[30] = "As for you, son of man, the children of your people talk of you by the walls and in the doors of the houses, and speak one to another, everyone to his brother, saying, Please come and hear what is the word that comes forth from the LORD.";
vul[30] = "et tu fili hominis filii populi tui qui loquuntur de te iuxta muros et in ostiis domorum et dicunt unus ad alterum vir ad proximum suum loquentes venite et audiamus qui sit sermo egrediens a Domino";
kjv[31] = "And they come unto thee as the people cometh, and they sit before thee [as] my people, and they hear thy words, but they will not do them: for with their mouth they shew much love, [but] their heart goeth after their covetousness.";
rsv[31] = "And they come to you as people come, and they sit before you as my people, and they hear what you say but they will not do it; for with their lips they show much love, but their heart is set on their gain.";
asv[31] = "And they come unto thee as the people cometh, and they sit before thee as my people, and they hear thy words, but do them not; for with their mouth they show much love, but their heart goeth after their gain.";
yng[31] = "And they come in unto thee as the coming in of a people, And they sit before thee -- My people, And have heard thy words, and they do them not, For doting loves with their mouth they are making, After their dishonest gain their heart is going.";
dby[31] = "And they come unto thee as a people cometh, and they sit before thee [as] my people, and they hear thy words, but they do them not; for with their mouth they shew much love, [but] their heart goeth after their dishonest gain.";
web[31] = "And they come to thee as the people come, and they sit before thee [as] my people, and they hear thy words, but they will not do them: for with their mouth they show much love, [but] their heart goeth after their covetousness.";
hnv[31] = "They come to you as the people comes, and they sit before you as my people, and they hear your words, but don\'t do them; for with their mouth they show much love, but their heart goes after their gain.";
vul[31] = "et veniunt ad te quasi si ingrediatur populus et sedent coram te populus meus et audiunt sermones tuos et non faciunt eos quia in canticum oris sui vertunt illos et avaritiam suam sequitur cor eorum";
kjv[32] = "And, lo, thou [art] unto them as a very lovely song of one that hath a pleasant voice, and can play well on an instrument: for they hear thy words, but they do them not.";
rsv[32] = "And, lo, you are to them like one who sings love songs with a beautiful voice and plays well on an instrument, for they hear what you say, but they will not do it.";
asv[32] = "And, lo, thou art unto them as a very lovely song of one that hath a pleasant voice, and can play well on an instrument; for they hear thy words, but they do them not.";
yng[32] = "And lo, thou [art] to them as a singer of doting loves, A pleasant voice, and playing well on an instrument, And they have heard thy words, and they are not doing them.";
dby[32] = "And behold, thou art unto them as a lovely song, a pleasant voice, and one that playeth well on an instrument; and they hear thy words, but they do them not.";
web[32] = "And lo, thou [art] to them as a very lovely song of one that hath a pleasant voice, and can play well on an instrument: for they hear thy words, but they do not perform them.";
hnv[32] = "Behold, you are to them as a very lovely song of one who has a pleasant voice, and can play well on an instrument; for they hear your words, but they don\'t do them.";
vul[32] = "et es eis quasi carmen musicum quod suavi dulcique sono canitur et audient verba tua et non facient ea";
kjv[33] = "And when this cometh to pass, (lo, it will come,) then shall they know that a prophet hath been among them.";
rsv[33] = "When this comes--and come it will!--then they will know that a prophet has been among them.&quot;";
asv[33] = "And when this cometh to pass (behold, it cometh), then shall they know that a prophet hath been among them.";
yng[33] = "And in its coming in -- lo, it hath come, And they have known that a prophet hath been in their midst!\'";
dby[33] = "And when this cometh to pass (behold, it will come), then shall they know that a prophet hath been among them.";
web[33] = "And when this cometh to pass, (lo, it will come,) then shall they know that a prophet hath been among them.";
hnv[33] = "When this comes to pass, (behold, it comes,) then shall they know that a prophet has been among them.";
vul[33] = "et cum venerit quod praedictum est ecce enim venit tunc scient quod prophetes fuerit inter eos";
