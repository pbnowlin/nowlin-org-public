csb[1] = "Then the man led me out by way of the north gate into the outer court. He brought me to the group of chambers opposite the temple yard and opposite the building to the north.";
csb[2] = "Along the length of the chambers, which was 175 feet, there was an entrance on the north; the width was 87 1/2 feet.";
csb[3] = "Opposite the 35 foot space belonging to the inner court and opposite the paved surface belonging to the outer court, the structure rose gallery by gallery in three tiers.";
csb[4] = "In front of the chambers was a walkway toward the inside, 17 1/2 feet wide and 175 feet long, and their entrances were on the north.";
csb[5] = "The upper chambers were narrower because the galleries took away more space from them than from the lower and middle stories of the building.";
csb[6] = "For they were arranged in three stories and had no pillars like the pillars of the courts; therefore the upper chambers were set back from the ground more than the lower and middle stories.";
csb[7] = "A wall on the outside ran in front of the chambers, parallel to them, toward the outer court; it was 87 1/2 feet long.";
csb[8] = "For the chambers on the outer court were 87 1/2 feet long, while those facing the great hall were 175 feet long.";
csb[9] = "At the base of these chambers there was an entryway on the east side as one enters them from the outer court.";
csb[10] = "In the thickness of the wall of the court toward the south, there were chambers facing the temple yard and the western building,";
csb[11] = "with a passageway in front of them, just like the chambers that faced north. Their length and width, as well as all their exits, measurements, and entrances, were identical.";
csb[12] = "The entrance at the beginning of the passageway, the way in front of the corresponding wall as one enters on the east side, was similar to the entrances of the chambers that were on the south side.";
csb[13] = "Then the man said to me, &quot;The northern and southern chambers that face the courtyard are the holy chambers where the priests who approach the LORD will eat the most holy offerings. There they will deposit the most holy offerings -- the grain offerings, sin offerings, and guilt offerings -- for the place is holy.";
csb[14] = "&quot;Once the priests have entered, they are not to go out from the holy area to the outer court until they have removed the clothes they minister in, for these are holy. They are to put on other clothes before they approach the public area.&quot;";
csb[15] = "When he finished measuring inside the temple complex, he led me out by way of the gate that faced east and measured all around the complex.";
csb[16] = "He measured the east side with a measuring rod; it was 875 feet by the measuring rod.";
csb[17] = "He measured the north side; it was 875 feet by the measuring rod.";
csb[18] = "He measured the south side; it was 875 feet by the measuring rod.";
csb[19] = "Then he turned to the west side and measured 875 feet by the measuring rod.";
csb[20] = "He measured the temple complex on all four sides. It had a wall all around it, 875 feet long and 875 feet wide, to separate the holy from the common.";
