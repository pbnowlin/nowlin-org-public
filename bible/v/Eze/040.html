csb[1] = "In the twenty-fifth year of our exile, at the beginning of the year, on the tenth day of the month in the fourteenth year after Jerusalem had been captured, on that very day the LORD\'s hand was on me, and he brought me there.";
csb[2] = "In visions of God he took me to the land of Israel and set me down on a very high mountain. On its southern slope was a structure resembling a city.";
csb[3] = "He brought me there, and I saw a man whose appearance was like bronze, with a linen cord and a measuring rod in his hand. He was standing by the city gate.";
csb[4] = "He spoke to me: &quot;Son of man, look with your eyes, listen with your ears, and pay attention to everything I am going to show you, for you have been brought here so that I might show it to you. Report everything you see to the house of Israel.&quot;";
csb[5] = "Now there was a wall surrounding the outside of the temple. The measuring rod in the man\'s hand was six units of twenty-one inches; each unit was the standard length plus three inches. He measured the thickness of the wall structure; it was 10 1/2 feet, and its height was the same.";
csb[6] = "Then he came to the gate that faced east and climbed its steps. He measured the threshold of the gate; it was 10 1/2 feet deep -- one threshold was 10 1/2 feet deep.";
csb[7] = "Each recess was 10 1/2 feet long and 10 1/2 feet deep, and there was a space of 8 3/4 feet between the recesses. The inner threshold of the gate on the temple side next to the gate\'s portico was 10 1/2 feet.";
csb[8] = "Next he measured the gate\'s portico;";
csb[9] = "it was 14 feet, and its jambs were 3 1/2 feet. The gate\'s portico was on the temple side.";
csb[10] = "There were three recesses on each side of the east gate, each with the same measurements, and the jambs on either side also had the same measurements.";
csb[11] = "Then he measured the width of the gate\'s entrance; it was 17 1/2 feet, while the width of the gate was 22 3/4 feet.";
csb[12] = "There was a barrier of 21 inches in front of the recesses on both sides, and the recesses on each side were 10 1/2 feet square.";
csb[13] = "Then he measured the gate from the roof of one recess to the roof of the opposite one; the distance was 43 3/4 feet. The openings of the recesses faced each other.";
csb[14] = "Next, he measured the porch -- 105 feet.";
csb[15] = "The distance from the front of the gate at the entrance to the front of the gate\'s portico on the inside was 87 1/2 feet.";
csb[16] = "The recesses and their jambs had beveled windows all around the inside of the gate. The porticoes also had windows all around on the inside. Each jamb was decorated with palm trees.";
csb[17] = "Then he brought me into the outer court, and there were chambers and a paved surface laid out all around the court. Thirty chambers faced the pavement,";
csb[18] = "which flanked the courtyard\'s gates and corresponded to the length of the gates; this was the lower pavement.";
csb[19] = "Then he measured the distance from the front of the lower gate to the exterior front of the inner court; it was 175 feet. This was the east; next the north is described.";
csb[20] = "He measured the gate of the outer court facing north, both its length and width.";
csb[21] = "Its three recesses on each side, its jambs, and its portico had the same measurements as the first gate: 87 1/2 feet long and 43 3/4 feet wide.";
csb[22] = "Its windows, portico, and palm trees had the same measurements as those of the gate that faced east. Seven steps led up to the gate, and its portico was ahead of them.";
csb[23] = "The inner court had a gate facing the north gate, like the one on the east. He measured the distance from gate to gate; it was 175 feet.";
csb[24] = "He brought me to the south side, and there was also a gate on the south. He measured its jambs and portico; they had the same measurements as the others.";
csb[25] = "Both the gate and its portico had windows all around, like the other windows. It was 87 1/2 feet long and 43 3/4 feet wide.";
csb[26] = "Its stairway had seven steps, and its portico was ahead of them. It had palm trees on its jambs, one on each side.";
csb[27] = "The inner court had a gate on the south. He measured from gate to gate on the south; it was 175 feet.";
csb[28] = "Then he brought me to the inner court through the south gate. When he measured the south gate, it had the same measurements as the others.";
csb[29] = "Its recesses, jambs, and portico had the same measurements as the others. Both it and its portico had windows all around. It was 87 1/2 feet long and 43 3/4 feet wide.";
csb[30] = "(There were porticoes all around, 43 3/4 feet long and 8 3/4 feet wide.)";
csb[31] = "Its portico faced the outer court, and its jambs were decorated with palm trees. Its stairway had eight steps.";
csb[32] = "Then he brought me to the inner court on the east side. When he measured the gate, it had the same measurements as the others.";
csb[33] = "Its recesses, jambs, and portico had the same measurements as the others. Both it and its portico had windows all around. It was 87 1/2 feet long and 43 3/4 feet wide.";
csb[34] = "Its portico faced the outer court, and its jambs were decorated with palm trees on each side. Its stairway had eight steps.";
csb[35] = "Then he brought me to the north gate. When he measured it, it had the same measurements as the others,";
csb[36] = "as did its recesses, jambs, and portico. It also had windows all around. It was 87 1/2 feet long and 43 3/4 feet wide.";
csb[37] = "Its portico faced the outer court, and its jambs were decorated with palm trees on each side. Its stairway had eight steps.";
csb[38] = "There was a chamber whose door opened into the gate\'s portico. The burnt offering was to be washed there.";
csb[39] = "Inside the gate\'s portico there were two tables on each side, on which to slaughter the burnt offering, sin offering, and guilt offering.";
csb[40] = "Outside, as one approaches the entrance of the north gate, there were two tables on one side and two more tables on the other side of the gate\'s portico.";
csb[41] = "So there were four tables inside the gate and four outside, eight tables in all on which the slaughtering was to be done.";
csb[42] = "There were also four tables of cut stone for the burnt offering, each 31 1/2 inches long, 31 1/2 inches wide, and 21 inches high. The utensils used to slaughter the burnt offerings and other sacrifices were placed on them.";
csb[43] = "There were three-inch hooks fastened all around the inside of the room, and the flesh of the offering was to be laid on the tables.";
csb[44] = "Outside the inner gate, within the inner court, there were chambers for the singers: one beside the north gate, facing south, and another beside the south gate, facing north.";
csb[45] = "Then the man said to me: &quot;This chamber that faces south is for the priests who keep charge of the temple.";
csb[46] = "&quot;The chamber that faces north is for the priests who keep charge of the altar. These are the sons of Zadok, the ones from the sons of Levi who may approach the LORD to serve him.&quot;";
csb[47] = "Next he measured the court. It was square, 175 feet long and 175 feet wide. The altar was in front of the temple.";
csb[48] = "Then he brought me to the portico of the temple and measured the jambs of the portico; they were 8 3/4 feet thick on each side. The width of the gate was 24 1/2 feet, and the side walls of the gate were 5 1/4 feet wide on each side.";
csb[49] = "The portico was 35 feet across and 21 feet deep, and 10 steps led up to it. There were pillars by the jambs, one on each side.";

rsv[5] = "And behold, there was a wall all around the outside of the temple area, and the length of the measuring reed in the man\'s hand was six long cubits, each being a cubit and a handbreadth in length; so he measured the thickness of the wall, one reed; and the height, one reed.";
