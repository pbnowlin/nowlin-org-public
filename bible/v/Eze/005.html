csb[1] = "&quot;Now you, son of man, take a sharp sword, use it as you would a barber\'s razor, and shave your head and beard. Then take a set of scales and divide the hair.";
csb[2] = "&quot;You are to burn a third of it in the city when the days of the siege have ended; you are to take a third and slash it with the sword all around the city; and you are to scatter a third to the wind, for I will draw a sword to chase after them.";
csb[3] = "&quot;But you are to take a few strands from the hair and secure them in the folds of your robe.";
csb[4] = "&quot;Take some more of them, throw them into the fire, and burn them in it. A fire will spread from it to the whole house of Israel.";
csb[5] = "&quot;This is what the Lord GOD says: I have set this Jerusalem in the center of the nations, with countries all around her.";
csb[6] = "&quot;She has rebelled against my ordinances with more wickedness than the nations, and against my statutes more than the countries that surround her. For her people have rejected my ordinances and have not walked in my statutes.";
csb[7] = "&quot;Therefore, this is what the Lord GOD says: Because you have been more insubordinate than the nations around you -- you have not walked in my statutes or kept my ordinances; you have not even kept the ordinances of the nations around you --";
csb[8] = "&quot;therefore, this is what the Lord GOD says: See, I myself am against you, Jerusalem, and I will execute judgments within you in the sight of the nations.";
csb[9] = "&quot;Because of all your detestable practices, I will do to you what I have never done before and what I will never do again.";
csb[10] = "&quot;As a result, fathers will eat their sons within Jerusalem, and sons will eat their fathers. I will execute judgments against you and scatter all your survivors to every direction of the wind.";
csb[11] = "&quot;Therefore, as I live&quot; -- this is the declaration of the Lord GOD -- &quot;I will withdraw and show you no pity, because you have defiled my sanctuary with all your abhorrent acts and detestable practices. Yes, I will not spare you.";
csb[12] = "&quot;A third of your people will die by plague and be consumed by famine within you; a third will fall by the sword all around you; and I will scatter a third to every direction of the wind, and I will draw a sword to chase after them.";
csb[13] = "&quot;When my anger is spent and I have vented my wrath on them, I will be appeased. Then after I have spent my wrath on them, they will know that I, the LORD, have spoken in my jealousy.";
csb[14] = "&quot;I will make you a ruin and a disgrace among the nations around you, in the sight of everyone who passes by.";
csb[15] = "&quot;So you will be a disgrace and a taunt, a warning and a horror, to the nations around you when I execute judgments against you in anger, wrath, and furious rebukes. I, the LORD, have spoken.";
csb[16] = "&quot;When I shoot deadly arrows of famine at them, arrows for destruction that I will send to destroy you, inhabitants of Jerusalem, I will intensify the famine against you and cut off your supply of bread.";
csb[17] = "&quot;I will send famine and dangerous animals against you. They will leave you childless. Plague and bloodshed will sweep through you, and I will bring a sword against you. I, the LORD, have spoken.&quot;";
kjv[1] = "And thou, son of man, take thee a sharp knife, take thee a barber\'s razor, and cause [it] to pass upon thine head and upon thy beard: then take thee balances to weigh, and divide the [hair].";

yng[1] = "`And thou, son of man, take to thee a sharp weapon, the barber\'s razor thou dost take to thee, and thou hast caused [it] to pass over thy head, and over thy beard, and thou hast taken to thee weighing scales, and apportioned them.";

kjv[2] = "Thou shalt burn with fire a third part in the midst of the city, when the days of the siege are fulfilled: and thou shalt take a third part, [and] smite about it with a knife: and a third part thou shalt scatter in the wind; and I will draw out a sword after them.";
rsv[2] = "A third part you shall burn in the fire in the midst of the city, when the days of the siege are completed; and a third part you shall take and strike with the sword round about the city; and a third part you shall scatter to the wind, and I will unsheathe the sword after them.";
asv[2] = "A third part shalt thou burn in the fire in the midst of the city, when the days of the siege are fulfilled; and thou shalt take a third part, and smite with the sword round about it; and a third part thou shalt scatter to the wind, and I will draw out a sword after them.";
yng[2] = "A third part with fire thou dost burn in the midst of the city, at the fulness of the days of the siege; and thou hast taken the third part, thou dost smite with a weapon round about it; and the third part thou dost scatter to the wind, and a weapon I draw out after them.";

kjv[4] = "Then take of them again, and cast them into the midst of the fire, and burn them in the fire; [for] thereof shall a fire come forth into all the house of Israel.";
rsv[4] = "And of these again you shall take some, and cast them into the fire, and burn them in the fire; from there a fire will come forth into all the house of Israel.";

kjv[7] = "Therefore thus saith the Lord GOD; Because ye multiplied more than the nations that [are] round about you, [and] have not walked in my statutes, neither have kept my judgments, neither have done according to the judgments of the nations that [are] round about you;";

yng[7] = "Therefore, thus said the Lord Jehovah: Because of your multiplying above the nations that [are] around you, In My statutes ye have not walked, And My judgments ye have not done, According to the judgments of the nations That [are] round about you ye have not done.";

kjv[9] = "And I will do in thee that which I have not done, and whereunto I will not do any more the like, because of all thine abominations.";

kjv[11] = "Wherefore, [as] I live, saith the Lord GOD; Surely, because thou hast defiled my sanctuary with all thy detestable things, and with all thine abominations, therefore will I also diminish [thee]; neither shall mine eye spare, neither will I have any pity.";
rsv[11] = "Wherefore, as I live, says the Lord GOD, surely, because you have defiled my sanctuary with all your detestable things and with all your abominations, therefore I will cut you down; my eye will not spare, and I will have no pity.";
asv[11] = "Wherefore, as I live, saith the Lord Jehovah, surely, because thou hast defiled my sanctuary with all thy detestable things, and with all thine abominations, therefore will I also diminish [thee]; neither shall mine eye spare, and I also will have no pity.";
yng[11] = "Therefore, I live -- an affirmation of the Lord Jehovah: Because My sanctuary thou hast defiled, With all thy detestable things, And with all thine abominations, Mine eye pitieth not, and I also spare not. Do not even I also diminish?";
dby[11] = "Wherefore, [as] I live, saith the Lord Jehovah, verily because thou hast defiled my sanctuary with all thy detestable things, and with all thine abominations, therefore will I also withdraw mine eye, and it shall not spare, nor will I have any pity.";
web[11] = "Wherefore, [as] I live, saith the Lord GOD; Surely, because thou hast defiled my sanctuary with all thy detestable things, and with all thy abominations, therefore I will also diminish [thee]; neither shall my eye spare, neither will I have any pity.";
hnv[11] = " Therefore, as I live, says the Lord GOD, surely, because you have defiled my sanctuary with all your detestable things, and with all your abominations, therefore will I also diminish [you]; neither shall my eye spare, and I also will have no pity.";
vul[11] = "idcirco vivo ego dicit Dominus Deus nisi pro eo quod sanctum meum violasti in omnibus offensionibus tuis et in omnibus abominationibus tuis ego quoque confringam et non parcet oculus meus et non miserebor";
kjv[12] = "A third part of thee shall die with the pestilence, and with famine shall they be consumed in the midst of thee: and a third part shall fall by the sword round about thee; and I will scatter a third part into all the winds, and I will draw out a sword after them.";

yng[12] = "Thy third part -- by pestilence they die, And by famine are consumed in thy midst, And the third part, by sword they fall round about thee, And the third part, to every wind I scatter, And a sword I draw out after them.";

yng[13] = "And completed hath been Mine anger, And I have caused My fury to rest on them, And I have been comforted, And they have known that I, Jehovah, have spoken in My zeal, In My completing My fury on them.";

hnv[13] = "Thus shall my anger be accomplished, and I will cause my wrath toward them to rest, and I shall be comforted; and they shall know that I, the LORD, have spoken in my zeal, when I have accomplished my wrath on them.";
vul[13] = "et conpleam furorem meum et requiescere faciam indignationem meam in eis et consolabor et scient quia ego Dominus locutus sum in zelo meo cum implevero indignationem meam in eis";
kjv[14] = "Moreover I will make thee waste, and a reproach among the nations that [are] round about thee, in the sight of all that pass by.";
rsv[14] = "Moreover I will make you a desolation and an object of reproach among the nations round about you and in the sight of all that pass by.";
asv[14] = "Moreover I will make thee a desolation and a reproach among the nations that are round about thee, in the sight of all that pass by.";

rsv[15] = "You shall be a reproach and a taunt, a warning and a horror, to the nations round about you, when I execute judgments on you in anger and fury, and with furious chastisements--I, the LORD, have spoken--";
asv[15] = "So it shall be a reproach and a taunt, an instruction and an astonishment, unto the nations that are round about thee, when I shall execute judgments on thee in anger and in wrath, and in wrathful rebukes (I, Jehovah, have spoken it);";
yng[15] = "And it hath been a reproach and a reviling, An instruction and an astonishment, To nations that [are] round about thee, In My doing in thee judgments, In anger and fury, and in furious reproofs, I, Jehovah, have spoken.";
dby[15] = "And it shall be a reproach, and a taunt, an instruction, and an astonishment unto the nations that are round about thee, when I shall execute judgments upon thee in anger, and in fury, and in furious rebukes: I, Jehovah, have spoken.";

kjv[16] = "When I shall send upon them the evil arrows of famine, which shall be for [their] destruction, [and] which I will send to destroy you: and I will increase the famine upon you, and will break your staff of bread:";
rsv[16] = "when I loose against you my deadly arrows of famine, arrows for destruction, which I will loose to destroy you, and when I bring more and more famine upon you, and break your staff of bread.";
asv[16] = "when I shall send upon them the evil arrows of famine, that are for destruction, which I will send to destroy you. And I will increase the famine upon you, and will break your staff of bread;";
yng[16] = "In My sending the evil arrows of famine among them, That have been for destruction, That I send to destroy you, And famine I am adding upon you, And I have broken to you the staff of bread.";
dby[16] = "When I send upon them the evil arrows of famine, that are for [their] destruction, which I send to destroy you, then will I increase the famine upon you, and will break your staff of bread.";
web[16] = "When I shall send upon them the evil arrows of famine, which shall be for [their] destruction, [and] which I will send to destroy you: and I will increase the famine upon you, and will break your staff of bread:";
hnv[16] = "when I shall send on them the evil arrows of famine, that are for destruction, which I will send to destroy you: and I will increase the famine on you, and will break your staff of bread;";
vul[16] = "ego Dominus locutus sum quando misero sagittas famis pessimas in eos quae erunt mortiferae et quas mittam ut disperdam vos et famem congregabo super vos et conteram vobis baculum panis";
kjv[17] = "So will I send upon you famine and evil beasts, and they shall bereave thee; and pestilence and blood shall pass through thee; and I will bring the sword upon thee. I the LORD have spoken [it].";
