csb[1] = "&quot;As for you, son of man, prophesy against Gog and say, \'This is what the Lord GOD says: Look, I am against you, Gog, chief prince of Meshech and Tubal.";
csb[2] = "&quot;I will turn you around, drive you on, and lead you up from the remotest parts of the north. I will bring you against the mountains of Israel.";
csb[3] = "&quot;Then I will knock your bow from your left hand and make your arrows drop from your right hand.";
csb[4] = "&quot;You, all your troops, and the peoples who are with you will fall on the mountains of Israel. I will give you as food to every kind of predatory bird and to the wild animals.";
csb[5] = "&quot;You will fall on the open field, for I have spoken. This is the declaration of the Lord GOD.";
csb[6] = "&quot; \'I will send fire against Magog and those who live securely on the coasts and islands. Then they will know that I am the LORD.";
csb[7] = "&quot;So I will make my holy name known among my people Israel and will no longer allow it to be profaned. Then the nations will know that I am the LORD, the Holy One in Israel.";
csb[8] = "&quot;Yes, it is coming, and it will happen. This is the declaration of the Lord GOD. This is the day I have spoken about.";
csb[9] = "&quot; \'Then the inhabitants of Israel\'s cities will go out, kindle fires, and burn the weapons -- the small and large shields, the bows and arrows, the clubs and spears. For seven years they will use them to make fires.";
csb[10] = "&quot;They will not gather wood from the countryside or cut it down from the forests, for they will use the weapons to make fires. They will take the loot from those who looted them and plunder those who plundered them. This is the declaration of the Lord GOD.";
csb[11] = "&quot; \'Now on that day I will give Gog a burial place there in Israel -- the Travelers\' Valley east of the Sea. It will block those who travel through, for Gog and all his hordes will be buried there. So it will be called Hordes of Gog Valley.";
csb[12] = "&quot;The house of Israel will spend seven months burying them in order to cleanse the land.";
csb[13] = "&quot;All the people of the land will bury them and their fame will spread on the day I display my glory. This is the declaration of the Lord GOD.";
csb[14] = "&quot; \'They will appoint men on a full-time basis to pass through the land and bury the invaders who remain on the surface of the ground, in order to cleanse it. They will make their search at the end of the seven months.";
csb[15] = "&quot;When they pass through the land and one of them sees a human bone, he will set up a marker next to it until the buriers have buried it in Hordes of Gog Valley.";
csb[16] = "&quot;There will even be a city named Hamonah there. So they will cleanse the land.\'";
csb[17] = "&quot;Son of man, this is what the Lord GOD says: Tell every kind of bird and all the wild animals, \'Assemble and come! Gather from all around to my sacrificial feast that I am slaughtering for you, a great feast on the mountains of Israel; you will eat flesh and drink blood.";
csb[18] = "&quot;You will eat the flesh of mighty men and drink the blood of the earth\'s princes: rams, lambs, male goats, and all the fattened bulls of Bashan.";
csb[19] = "&quot;You will eat fat until you are satisfied and drink blood until you are drunk, at my sacrificial feast that I have prepared for you.";
csb[20] = "&quot;At my table you will eat your fill of horses and riders, of mighty men and all the warriors. This is the declaration of the Lord GOD.\'";
csb[21] = "&quot;I will display my glory among the nations, and all the nations will see the judgment I have executed and the hand I have laid on them.";
csb[22] = "&quot;From that day forward the house of Israel will know that I am the LORD their God.";
csb[23] = "&quot;And the nations will know that the house of Israel went into exile on account of their iniquity, because they dealt unfaithfully with me. Therefore, I hid my face from them and handed them over to their enemies, so that they all fell by the sword.";
csb[24] = "&quot;I dealt with them according to their uncleanness and transgressions, and I hid my face from them.";
csb[25] = "&quot;So this is what the Lord GOD says: Now I will restore the fortunes of Jacob and have compassion on the whole house of Israel, and I will be jealous for my holy name.";
csb[26] = "&quot;They will feel remorse for their disgrace and all the unfaithfulness they committed against me, when they live securely in their land with no one to frighten them.";
csb[27] = "&quot;When I bring them back from the peoples and gather them from the countries of their enemies, I will demonstrate my holiness through them in the sight of many nations.";
csb[28] = "&quot;They will know that I am the LORD their God when I regather them to their own land after having exiled them among the nations. I will leave none of them behind.";
csb[29] = "&quot;I will no longer hide my face from them, for I will pour out my Spirit on the house of Israel.&quot; This is the declaration of the Lord GOD.";
kjv[1] = "Therefore, thou son of man, prophesy against Gog, and say, Thus saith the Lord GOD; Behold, I [am] against thee, O Gog, the chief prince of Meshech and Tubal:";

yng[2] = "And have turned thee back, and enticed thee, And caused thee to come up from the sides of the north, And brought thee in against mountains of Israel,";

dby[3] = "And I will smite thy bow out of thy left hand, and will cause thine arrows to fall out of thy right hand.";

kjv[4] = "Thou shalt fall upon the mountains of Israel, thou, and all thy bands, and the people that [is] with thee: I will give thee unto the ravenous birds of every sort, and [to] the beasts of the field to be devoured.";
rsv[4] = "You shall fall upon the mountains of Israel, you and all your hordes and the peoples that are with you; I will give you to birds of prey of every sort and to the wild beasts to be devoured.";
asv[4] = "Thou shalt fall upon the mountains of Israel, thou, and all thy hordes, and the peoples that are with thee: I will give thee unto the ravenous birds of every sort, and to the beasts of the field to be devoured.";
yng[4] = "On mountains of Israel thou fallest, Thou, and all thy bands, and the peoples who [are] with thee, To ravenous fowl -- a bird of every wing, And [to] a beast of the field, I have given thee for food.";
dby[4] = "Thou shalt fall upon the mountains of Israel, thou, and all thy bands, and the peoples that are with thee: I have given thee to be meat for the birds of prey of every wing, and to the beasts of the field.";

rsv[7] = "&quot;And my holy name I will make known in the midst of my people Israel; and I will not let my holy name be profaned any more; and the nations shall know that I am the LORD, the Holy One in Israel.";

yng[7] = "And My holy name I make known in the midst of My people Israel, And I pollute not My holy name any more, And known have the nations that I, Jehovah, the Holy One, [am] in Israel.";

kjv[9] = "And they that dwell in the cities of Israel shall go forth, and shall set on fire and burn the weapons, both the shields and the bucklers, the bows and the arrows, and the handstaves, and the spears, and they shall burn them with fire seven years:";

asv[9] = "And they that dwell in the cities of Israel shall go forth, and shall make fires of the weapons and burn them, both the shields and the bucklers, the bows and the arrows, and the handstaves, and the spears, and they shall make fires of them seven years;";
yng[9] = "And gone out have the inhabitants of cities of Israel, And they have burned and kindled [a fire], With armour, and shield, and buckler, With bow, and with arrows, And with hand-staves, and with javelins, And they have caused a fire to burn with them seven years,";

kjv[10] = "So that they shall take no wood out of the field, neither cut down [any] out of the forests; for they shall burn the weapons with fire: and they shall spoil those that spoiled them, and rob those that robbed them, saith the Lord GOD.";
rsv[10] = "so that they will not need to take wood out of the field or cut down any out of the forests, for they will make their fires of the weapons; they will despoil those who despoiled them, and plunder those who plundered them, says the Lord GOD.";
asv[10] = "so that they shall take no wood out of the field, neither cut down any out of the forests; for they shall make fires of the weapons; and they shall plunder those that plundered them, and rob those that robbed them, saith the Lord Jehovah.";
yng[10] = "And they do not take wood out of the field, Nor do they hew out of the forests, For with armour they cause the fire to burn, And they have spoiled their spoilers, And they have plundered their plunderers, An affirmation of the Lord Jehovah.";

web[10] = "So that they shall take no wood out of the field, neither cut down [any] out of the forests; for they shall burn the weapons with fire: and they shall lay waste those that wasted them, and rob those that robbed them, saith the Lord GOD.";
hnv[10] = "so that they shall take no wood out of the field, neither cut down any out of the forests; for they shall make fires of the weapons; and they shall plunder those who plundered them, and rob those who robbed them, says the Lord GOD.";

kjv[11] = "And it shall come to pass in that day, [that] I will give unto Gog a place there of graves in Israel, the valley of the passengers on the east of the sea: and it shall stop the [noses] of the passengers: and there shall they bury Gog and all his multitude: and they shall call [it] The valley of Hamongog.";
rsv[11] = "&quot;On that day I will give to Gog a place for burial in Israel, the Valley of the Travelers east of the sea; it will block the travelers, for there Gog and all his multitude will be buried; it will be called the Valley of Hamon-gog.";
asv[11] = "And it shall come to pass in that day, that I will give unto Gog a place for burial in Israel, the valley of them that pass through on the east of the sea; and it shall stop them that pass through: and there shall they bury Gog and all his multitude; and they shall call it The valley of Hamon-gog.";
yng[11] = "And it hath come to pass, in that day, I give to Gog a place there -- a grave in Israel, the valley of those passing by, east of the sea, and it is stopping those passing by, and they have buried there Gog, and all his multitude, and have cried, O valley of the multitude of Gog!";
dby[11] = "And it shall come to pass in that day, [that] I will give unto Gog a place there for burial in Israel, the valley of the passers-by to the east of the sea; and it shall stop [the way] of the passers-by; and there shall they bury Gog and all the multitude; and they shall call it, Valley of Hamon-Gog.";
web[11] = "And it shall come to pass in that day, [that] I will give to Gog a place there of graves in Israel, the valley of the passengers on the east of the sea: and it shall stop the [noses] of the passengers: and there shall they bury Gog and all his multitude: and they shall call [it] The valley of Hamon-gog.";
hnv[11] = "It shall happen in that day, that I will give to Gog a place for burial in Yisra\'el, the valley of those who pass through on the east of the sea; and it shall stop those who pass through: and there shall they bury Gog and all his multitude; and they shall call it The valley of Hamon-Gog.";
vul[11] = "et erit in die illa dabo Gog locum nominatum sepulchrum in Israhel vallem Viatorum ad orientem maris quae obstupescere facit praetereuntes et sepelient ibi Gog et omnem multitudinem eius et vocabitur vallis Multitudinis Gog";

asv[12] = "And seven months shall the house of Israel be burying them, that they may cleanse the land.";

vul[12] = "et sepelient eos domus Israhel ut mundent terram septem mensibus";

rsv[14] = "They will set apart men to pass through the land continually and bury those remaining upon the face of the land, so as to cleanse it; at the end of seven months they will make their search.";

yng[14] = "And men for continual employment they separate, passing on through the land, burying with those passing by those who are left on the face of the earth, to cleanse it: at the end of seven months they search.";
dby[14] = "And they shall sever out men of continual employment to go through the land, who, with the passers-by, shall bury those that remain upon the face of the land, to cleanse it: at the end of seven months shall they make a search.";
web[14] = "And they shall sever out men of continual employment, passing through the land to bury with the passengers those that remain upon the face of the earth, to cleanse it: after the end of seven months shall they search.";
hnv[14] = "They shall set apart men of continual employment, who shall pass through the land, and, with those who pass through, those who bury those who remain on the surface of the land, to cleanse it: after the end of seven months shall they search.";
vul[14] = "et viros iugiter constituent lustrantes terram qui sepeliant et requirant eos qui remanserant super faciem terrae ut emundent eam post menses autem septem quaerere incipient";
kjv[15] = "And the passengers [that] pass through the land, when [any] seeth a man\'s bone, then shall he set up a sign by it, till the buriers have buried it in the valley of Hamongog.";
rsv[15] = "And when these pass through the land and any one sees a man\'s bone, then he shall set up a sign by it, till the buriers have buried it in the Valley of Hamon-gog.";
asv[15] = "And they that pass through the land shall pass through; and when any seeth a man\'s bone, then shall he set up a sign by it, till the buriers have buried it in the valley of Hamon-gog.";
yng[15] = "And those passing by have passed through the land, and seen a bone of man, and one hath constructed near it a sign till those burying have buried it in the valley of the multitude of Gog.";
dby[15] = "And the passers-by shall pass through the land, and when [any] seeth a man\'s bone, he shall set up a sign by it, till the buriers have buried it in the Valley of Hamon-Gog.";
web[15] = "And [as] passengers pass through the land, when [any] seeth a man\'s bone, then shall he set up a sign by it, till the buriers have buried it in the valley of Hamon-gog.";
hnv[15] = "Those who pass through the land shall pass through; and when any sees a man\'s bone, then shall he set up a sign by it, until the undertakers have buried it in the valley of Hamon-Gog.";
vul[15] = "et circumibunt peragrantes terram cumque viderint os hominis statuent iuxta illud titulum donec sepeliant illud pollinctores in valle Multitudinis Gog";
kjv[16] = "And also the name of the city [shall be] Hamonah. Thus shall they cleanse the land.";
rsv[16] = "(A city Hamo\'nah is there also.) Thus shall they cleanse the land.";
asv[16] = "And Hamonah shall also be the name of a city. Thus shall they cleanse the land.";
yng[16] = "And also the name of the city [is] The multitude; and they have cleansed the land.";
dby[16] = "And also the name of the city shall be Hamonah. Thus shall they cleanse the land.";
web[16] = "And also the name of the city [shall be] Hamonah. Thus shall they cleanse the land.";
hnv[16] = " Hamonah shall also be the name of a city. Thus shall they cleanse the land.";
vul[16] = "nomen autem civitatis Amona et mundabunt terram";
kjv[17] = "And, thou son of man, thus saith the Lord GOD; Speak unto every feathered fowl, and to every beast of the field, Assemble yourselves, and come; gather yourselves on every side to my sacrifice that I do sacrifice for you, [even] a great sacrifice upon the mountains of Israel, that ye may eat flesh, and drink blood.";
rsv[17] = "&quot;As for you, son of man, thus says the Lord GOD: Speak to the birds of every sort and to all beasts of the field, \'Assemble and come, gather from all sides to the sacrificial feast which I am preparing for you, a great sacrificial feast upon the mountains of Israel, and you shall eat flesh and drink blood.";
asv[17] = "And thou, son of man, thus saith the Lord Jehovah: Speak unto the birds of every sort, and to every beast of the field, Assemble yourselves, and come; gather yourselves on every side to my sacrifice that I do sacrifice for you, even a great sacrifice upon the mountains of Israel, that ye may eat flesh and drink blood.";
yng[17] = "And thou, son of man, thus said the Lord Jehovah: Say to the bird -- every wing, and to every beast of the field: Be assembled and come in, Be gathered from round about, For My sacrifice that I am sacrificing for you, A great sacrifice on mountains of Israel, And ye have eaten flesh, and drunk blood.";
dby[17] = "And thou, son of man, thus saith the Lord Jehovah: Speak unto the birds of every wing, and to every beast of the field, Gather yourselves together and come, assemble yourselves on every side to my sacrifice which I sacrifice for you, a great sacrifice upon the mountains of Israel, that ye may eat flesh, and drink blood.";
web[17] = "And, thou son of man, thus saith the Lord GOD; Speak to every feathered fowl, and to every beast of the field, Assemble yourselves, and come; gather yourselves on every side to my sacrifice that I do sacrifice for you, [even] a great sacrifice upon the mountains of Israel, that ye may eat flesh, and drink blood.";
hnv[17] = "You, son of man, thus says the Lord GOD: Speak to the birds of every sort, and to every animal of the field, Assemble yourselves, and come; gather yourselves on every side to my sacrifice that I do sacrifice for you, even a great sacrifice on the mountains of Yisra\'el, that you may eat flesh and drink blood.";
vul[17] = "tu ergo fili hominis haec dicit Dominus Deus dic omni volucri et universis avibus cunctisque bestiis agri convenite properate concurrite undique ad victimam meam quam ego immolo vobis victimam grandem super montes Israhel ut comedatis carnes et bibatis sanguinem";
kjv[18] = "Ye shall eat the flesh of the mighty, and drink the blood of the princes of the earth, of rams, of lambs, and of goats, of bullocks, all of them fatlings of Bashan.";
rsv[18] = "You shall eat the flesh of the mighty, and drink the blood of the princes of the earth--of rams, of lambs, and of goats, of bulls, all of them fatlings of Bashan.";
asv[18] = "Ye shall eat the flesh of the mighty, and drink the blood of the princes of the earth, of rams, of lambs, and of goats, of bullocks, all of them fatlings of Bashan.";
yng[18] = "Flesh of the mighty ye do eat, And blood of princes of the earth ye drink, Of rams, of lambs, and of he-goats, Of calves, fatlings of Bashan -- all of them.";
dby[18] = "Ye shall eat the flesh of the mighty, and drink the blood of the princes of the earth, of rams, of lambs, and of goats, [and] of bullocks, all of them fatted beasts of Bashan.";
web[18] = "Ye shall eat the flesh of the mighty, and drink the blood of the princes of the earth, of rams, of lambs, and of goats, of bullocks, all of them fatlings of Bashan.";
hnv[18] = "You shall eat the flesh of the mighty, and drink the blood of the princes of the eretz, of rams, of lambs, and of goats, of bulls, all of them fatlings of Bashan.";
vul[18] = "carnes fortium comedetis et sanguinem principum terrae bibetis arietum agnorum et hircorum taurorumque altilium et pinguium omnium";
kjv[19] = "And ye shall eat fat till ye be full, and drink blood till ye be drunken, of my sacrifice which I have sacrificed for you.";
rsv[19] = "And you shall eat fat till you are filled, and drink blood till you are drunk, at the sacrificial feast which I am preparing for you.";
asv[19] = "And ye shall eat fat till ye be full, and drink blood till ye be drunken, of my sacrifice which I have sacrificed for you.";
yng[19] = "And ye have eaten fat to satiety, And ye have drunk blood -- to drunkenness, Of My sacrifice that I sacrificed for you.";
dby[19] = "And ye shall eat fat till ye are full, and drink blood till ye are drunken, of my sacrifice which I sacrifice for you.";
web[19] = "And ye shall eat fat till ye are full, and drink blood till ye are drunken, of my sacrifice which I have sacrificed for you.";
hnv[19] = "You shall eat fat until you be full, and drink blood until you be drunken, of my sacrifice which I have sacrificed for you.";
vul[19] = "et comedetis adipem in saturitate et bibetis sanguinem in ebrietate de victima quam ego immolabo vobis";
kjv[20] = "Thus ye shall be filled at my table with horses and chariots, with mighty men, and with all men of war, saith the Lord GOD.";
rsv[20] = "And you shall be filled at my table with horses and riders, with mighty men and all kinds of warriors,\' says the Lord GOD.";
asv[20] = "And ye shall be filled at my table with horses and chariots, with mighty men, and with all men of war, saith the Lord Jehovah.";
yng[20] = "And ye have been satisfied at My table with horse and rider, Mighty man, and every man of war, An affirmation of the Lord Jehovah.";
dby[20] = "And ye shall be filled at my table with horses and charioteers, with mighty men, and with all men of war, saith the Lord Jehovah.";
web[20] = "Thus ye shall be filled at my table with horses and chariots, with mighty men, and with all men of war, saith the Lord GOD.";
hnv[20] = "You shall be filled at my table with horses and chariots, with mighty men, and with all men of war, says the Lord GOD.";
vul[20] = "et saturabimini super mensam meam de equo et de equite forti et de universis viris bellatoribus ait Dominus Deus";
kjv[21] = "And I will set my glory among the heathen, and all the heathen shall see my judgment that I have executed, and my hand that I have laid upon them.";
rsv[21] = "&quot;And I will set my glory among the nations; and all the nations shall see my judgment which I have executed, and my hand which I have laid on them.";
asv[21] = "And I will set my glory among the nations; and all the nations shall see my judgment that I have executed, and my hand that I have laid upon them.";
yng[21] = "And I have given My honour among nations, And seen have all the nations My Judgment that I have done, And My hand that I have laid on them.";
dby[21] = "And I will set my glory among the nations, and all the nations shall see my judgment which I have executed, and my hand which I have laid upon them.";
web[21] = "And I will set my glory among the heathen, and all the heathen shall see my judgment that I have executed, and my hand that I have laid upon them.";
hnv[21] = "I will set my glory among the nations; and all the nations shall see my judgment that I have executed, and my hand that I have laid on them.";
vul[21] = "et ponam gloriam meam in gentibus et videbunt omnes gentes iudicium meum quod fecerim et manum meam quam posuerim super eos";
kjv[22] = "So the house of Israel shall know that I [am] the LORD their God from that day and forward.";
rsv[22] = "The house of Israel shall know that I am the LORD their God, from that day forward.";
asv[22] = "So the house of Israel shall know that I am Jehovah their God, from that day and forward.";
yng[22] = "And known have the house of Israel that I [am] Jehovah their God, From that day and henceforth.";
dby[22] = "And the house of Israel shall know that I [am] Jehovah their God from that day and forward.";
web[22] = "So the house of Israel shall know that I [am] the LORD their God from that day and forward.";
hnv[22] = "So the house of Yisra\'el shall know that I am the LORD their God, from that day and forward.";
vul[22] = "et scient domus Israhel quia ego Dominus Deus eorum a die illa et deinceps";
kjv[23] = "And the heathen shall know that the house of Israel went into captivity for their iniquity: because they trespassed against me, therefore hid I my face from them, and gave them into the hand of their enemies: so fell they all by the sword.";
rsv[23] = "And the nations shall know that the house of Israel went into captivity for their iniquity, because they dealt so treacherously with me that I hid my face from them and gave them into the hand of their adversaries, and they all fell by the sword.";
asv[23] = "And the nations shall know that the house of Israel went into captivity for their iniquity; because they trespassed against me, and I hid my face from them: so I gave them into the hand of their adversaries, and they fell all of them by the sword.";
yng[23] = "And known have the nations that for their iniquity, Removed have the house of Israel, Because they have trespassed against Me, And I do hide My face from them, And give them into the hand of their adversaries, And they fall by sword -- all of them.";
dby[23] = "And the nations shall know that the house of Israel went into captivity for their iniquity, because they were unfaithful against me; and I hid my face from them, and gave them into the hand of their enemies, so that they fell all of them by the sword.";
web[23] = "And the heathen shall know that the house of Israel went into captivity for their iniquity: because they trespassed against me, therefore I hid my face from them, and gave them into the hand of their enemies: so they all fell by the sword.";
hnv[23] = "The nations shall know that the house of Yisra\'el went into captivity for their iniquity; because they trespassed against me, and I hid my face from them: so I gave them into the hand of their adversaries, and they fell all of them by the sword.";
vul[23] = "et scient gentes quoniam in iniquitate sua capta sit domus Israhel eo quod reliquerint me et absconderim faciem meam ab eis et tradiderim eos in manu hostium et ceciderint in gladio universi";
kjv[24] = "According to their uncleanness and according to their transgressions have I done unto them, and hid my face from them.";
rsv[24] = "I dealt with them according to their uncleanness and their transgressions, and hid my face from them.";
asv[24] = "According to their uncleanness and according to their transgressions did I unto them; and I hid my face from them.";
yng[24] = "According to their uncleanness, And according to their transgressions, I have done with them, And I do hide My face from them.";
dby[24] = "According to their uncleanness and according to their transgressions I did unto them, and I hid my face from them.";
web[24] = "According to their uncleanness and according to their transgressions have I done to them, and hid my face from them.";
hnv[24] = "According to their uncleanness and according to their transgressions did I to them; and I hid my face from them.";
vul[24] = "iuxta inmunditiam eorum et scelus feci eis et abscondi faciem meam ab illis";
kjv[25] = "Therefore thus saith the Lord GOD; Now will I bring again the captivity of Jacob, and have mercy upon the whole house of Israel, and will be jealous for my holy name;";
rsv[25] = "&quot;Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob, and have mercy upon the whole house of Israel; and I will be jealous for my holy name.";
asv[25] = "Therefore thus saith the Lord Jehovah: Now will I bring back the captivity of Jacob, and have mercy upon the whole house of Israel; and I will be jealous for my holy name.";
yng[25] = "Therefore, thus said the Lord Jehovah: Now do I bring back the captivity of Jacob, And I have pitied all the house of Israel, And have been zealous for My holy name.";
dby[25] = "Therefore, thus saith the Lord Jehovah: Now will I bring again the captivity of Jacob, and have mercy upon the whole house of Israel, and will be jealous for my holy name:";
web[25] = "Therefore thus saith the Lord GOD; Now will I bring again the captivity of Jacob, and have mercy upon the whole house of Israel, and will be jealous for my holy name;";
hnv[25] = " Therefore thus says the Lord GOD: Now will I bring back the captivity of Ya`akov, and have mercy on the whole house of Yisra\'el; and I will be jealous for my holy name.";
vul[25] = "propterea haec dicit Dominus Deus nunc reducam captivitatem Iacob et miserebor omnis domus Israhel et adsumam zelum pro nomine sancto meo";
kjv[26] = "After that they have borne their shame, and all their trespasses whereby they have trespassed against me, when they dwelt safely in their land, and none made [them] afraid.";
rsv[26] = "They shall forget their shame, and all the treachery they have practiced against me, when they dwell securely in their land with none to make them afraid,";
asv[26] = "And they shall bear their shame, and all their trespasses whereby they have trespassed against me, when they shall dwell securely in their land, and none shall make them afraid;";
yng[26] = "And they have forgotten their shame, And all their trespass that they trespassed against Me, In their dwelling on their land confidently and none troubling.";
dby[26] = "and they shall bear their confusion, and all their unfaithfulness in which they have acted unfaithfully against me, when they shall dwell safely in their land, and none shall make them afraid;";
web[26] = "After they have borne their shame, and all their trespasses by which they have trespassed against me, when they dwelt safely in their land, and none made [them] afraid.";
hnv[26] = "They shall bear their shame, and all their trespasses by which they have trespassed against me, when they shall dwell securely in their land, and none shall make them afraid;";
vul[26] = "et portabunt confusionem suam et omnem praevaricationem quam praevaricati sunt in me cum habitaverint in terra sua confidenter neminem formidantes";
kjv[27] = "When I have brought them again from the people, and gathered them out of their enemies\' lands, and am sanctified in them in the sight of many nations;";
rsv[27] = "when I have brought them back from the peoples and gathered them from their enemies\' lands, and through them have vindicated my holiness in the sight of many nations.";
asv[27] = "when I have brought them back from the peoples, and gathered them out of their enemies\' lands, and am sanctified in them in the sight of many nations.";
yng[27] = "In My bringing them back from the peoples, I have assembled them from the lands of their enemies, And I have been sanctified in them before the eyes of the many nations,";
dby[27] = "when I have brought them again from the peoples, and gathered them out of their enemies\' lands, and am hallowed in them in the sight of many nations.";
web[27] = "When I have brought them again from the people, and gathered them out of the lands of their enemies, and am sanctified in them in the sight of many nations;";
hnv[27] = "when I have brought them back from the peoples, and gathered them out of their enemies\' lands, and am sanctified in them in the sight of many nations.";
vul[27] = "et reduxero eos de populis et congregavero de terris inimicorum suorum et sanctificatus fuero in eis in oculis gentium plurimarum";
kjv[28] = "Then shall they know that I [am] the LORD their God, which caused them to be led into captivity among the heathen: but I have gathered them unto their own land, and have left none of them any more there.";
rsv[28] = "Then they shall know that I am the LORD their God because I sent them into exile among the nations, and then gathered them into their own land. I will leave none of them remaining among the nations any more;";
asv[28] = "And they shall know that I am Jehovah their God, in that I caused them to go into captivity among the nations, and have gathered them unto their own land; and I will leave none of them any more there;";
yng[28] = "And they have known that I [am] Jehovah their God, In My removing them unto the nations, And I have gathered them unto their land, And I leave none of them any more there.";
dby[28] = "And they shall know that I [am] Jehovah their God, in that I caused them to be led into captivity among the nations, and have gathered them unto their own land, and have left none of them any more there.";
web[28] = "Then shall they know that I [am] the LORD their God, who caused them to be led into captivity among the heathen: but I have gathered them to their own land, and have left none of them there any more.";
hnv[28] = "They shall know that I am the LORD their God, in that I caused them to go into captivity among the nations, and have gathered them to their own land; and I will leave none of them any more there;";
vul[28] = "et scient quia ego Dominus Deus eorum eo quod transtulerim eos in nationes et congregavero eos super terram suam et non dereliquerim quemquam ex eis ibi";
kjv[29] = "Neither will I hide my face any more from them: for I have poured out my spirit upon the house of Israel, saith the Lord GOD.";
rsv[29] = "and I will not hide my face any more from them, when I pour out my Spirit upon the house of Israel, says the Lord GOD.&quot;";
asv[29] = "neither will I hide my face any more from them; for I have poured out my Spirit upon the house of Israel, saith the Lord Jehovah.";
yng[29] = "And I hide not any more My face from them, In that I have poured out My spirit on the house of Israel, An affirmation of the Lord Jehovah!\'";
dby[29] = "And I will not hide my face any more from them, for I shall have poured out my Spirit upon the house of Israel, saith the Lord Jehovah.";
web[29] = "Neither will I hide my face any more from them: for I have poured out my spirit upon the house of Israel, saith the Lord GOD.";
hnv[29] = "neither will I hide my face any more from them; for I have poured out my Spirit on the house of Yisra\'el, says the Lord GOD.";
vul[29] = "et non abscondam ultra faciem meam ab eis eo quod effuderim spiritum meum super omnem domum Israhel ait Dominus Deus";
</script>
