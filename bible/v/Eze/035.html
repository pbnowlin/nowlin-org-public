csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, face Mount Seir and prophesy against it.";
csb[3] = "&quot;Say to it, \'This is what the Lord GOD says: Look! I am against you, Mount Seir. I will stretch out my hand against you and make you a desolate waste.";
csb[4] = "&quot;I will turn your cities into ruins, and you will become a desolation. Then you will know that I am the LORD.";
csb[5] = "&quot; \'Because you maintained a perpetual hatred and gave the Israelites over to the power of the sword in the time of their disaster, the time of final punishment,";
csb[6] = "&quot;therefore, as I live -- this is the declaration of the Lord GOD -- I will destine you for bloodshed, and it will pursue you. Since you did not hate bloodshed, it will pursue you.";
csb[7] = "&quot;I will make Mount Seir a desolate waste and will cut off from it those who come and go.";
csb[8] = "&quot;I will fill its mountains with the slain; those slain by the sword will fall on your hills, in your valleys, and in all your ravines.";
csb[9] = "&quot;I will make you a perpetual desolation; your cities will not be inhabited. Then you will know that I am the LORD.";
csb[10] = "&quot; \'Because you said, &quot;These two nations and two lands will be mine, and we will possess them&quot; -- though the LORD was there --";
csb[11] = "therefore, as I live -- this is the declaration of the Lord GOD -- I will treat you according to the anger and jealousy you showed in your hatred of them. I will make myself known among them when I judge you.";
csb[12] = "Then you will know that I, the LORD, have heard all the blasphemies you uttered against the mountains of Israel, saying, &quot;They are desolate. They have been given to us to devour! &quot;";
csb[13] = "You boasted against me with your mouth, and spoke many words against me. I heard it myself!";
csb[14] = "&quot; \'This is what the Lord GOD says: While the whole world rejoices, I will make you a desolation.";
csb[15] = "&quot;Just as you rejoiced over the inheritance of the house of Israel because it became a desolation, I will deal the same way with you: you will become a desolation, Mount Seir, and so will all Edom in its entirety. Then they will know that I am the LORD.\'";
