csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Now, son of man, lament for Tyre.";
csb[3] = "&quot;Say to Tyre, who is located at the entrance of the sea, merchant of the peoples to many coasts and islands, \'This is what the Lord GOD says: Tyre, you declared, &quot;I am perfect in beauty.&quot;";
csb[4] = "Your realm was in the heart of the sea; your builders perfected your beauty.";
csb[5] = "They constructed all your planking with pine trees from Senir. They took a cedar from Lebanon to make a mast for you.";
csb[6] = "They made your oars of oaks from Bashan. They made your deck of cypress wood from the coasts of Cyprus, inlaid with ivory.";
csb[7] = "Your sail was made of fine embroidered linen from Egypt, and served as your banner. Your awning was of blue and purple fabric from the coasts of Elishah.";
csb[8] = "The inhabitants of Sidon and Arvad were your rowers. Your wise men were within you, Tyre; they were your captains.";
csb[9] = "The elders of Gebal and its wise men were within you, repairing your leaks. &quot; \'All the ships of the sea and their sailors came to you to barter for your goods.";
csb[10] = "&quot;Men of Persia, Lud, and Put were in your army, serving as your warriors. They hung shields and helmets in you; they gave you splendor.";
csb[11] = "&quot;Men of Arvad and Helech were stationed on your walls all around, and Gammadites were in your towers. They hung their shields all around your walls; they perfected your beauty.";
csb[12] = "&quot; \'Tarshish was your trading partner because of your abundant wealth of every kind. They exchanged silver, iron, tin, and lead for your merchandise.";
csb[13] = "&quot;Javan, Tubal, and Meshech were your merchants. They exchanged slaves and bronze utensils for your goods.";
csb[14] = "&quot;Those from Beth-togarmah exchanged horses, war horses, and mules for your merchandise.";
csb[15] = "&quot;Men of Dedan were also your merchants; many coasts and islands were your regular markets. They brought back ivory tusks and ebony as your payment.";
csb[16] = "&quot;Aram was your trading partner because of your numerous products. They exchanged turquoise, purple and embroidered cloth, fine linen, coral, and rubies for your merchandise.";
csb[17] = "&quot;Judah and the land of Israel were your merchants. They exchanged wheat from Minnith, meal, honey, oil, and balm, for your goods.";
csb[18] = "&quot;Damascus was also your trading partner because of your numerous products and your abundant wealth of every kind, trading in wine from Helbon and white wool.";
csb[19] = "&quot;Vedan and Javan from Uzal dealt in your merchandise; wrought iron, cassia, and aromatic cane were exchanged for your goods.";
csb[20] = "&quot;Dedan was your merchant in saddlecloths for riding.";
csb[21] = "&quot;Arabia and all the princes of Kedar were your business partners, trading with you in lambs, rams, and goats.";
csb[22] = "&quot;The merchants of Sheba and Raamah traded with you. For your merchandise they exchanged the best of all spices and all kinds of precious stones as well as gold.";
csb[23] = "&quot;Haran, Canneh, Eden, the merchants of Sheba, Asshur, and Chilmad traded with you.";
csb[24] = "&quot;They were your merchants in choice garments, cloaks of blue and embroidered materials, and multicolored carpets, which were bound and secured with cords in your marketplace.";
csb[25] = "&quot;Ships of Tarshish were the carriers for your goods. &quot; \'So you became full and heavily loaded in the heart of the sea.";
csb[26] = "&quot;Your rowers have brought you onto the high seas, but the east wind has wrecked you in the heart of the sea.";
csb[27] = "&quot;Your wealth, merchandise, and goods, your sailors and captains, those who repair your leaks, those who barter for your goods, and all the warriors on board, with all the other people within you, sink into the heart of the sea on the day of your downfall.";
csb[28] = "&quot; \'The countryside shakes at the sound of your sailors\' cries.";
csb[29] = "&quot;All the oarsmen disembark from their ships. The sailors and all the captains of the sea stand on the shore.";
csb[30] = "&quot;Because of you, they raise their voices and cry out bitterly. They throw dust on their heads; they roll in ashes.";
csb[31] = "&quot;They shave their heads because of you and wrap themselves in sackcloth. They weep over you with deep anguish and bitter mourning.";
csb[32] = "&quot; \'In their wailing they lament for you, mourning over you: &quot;Who was like Tyre, silenced in the middle of the sea?";
csb[33] = "&quot;When your merchandise was unloaded from the seas, you satisfied many peoples. You enriched the kings of the earth with your abundant wealth and goods.";
csb[34] = "&quot;Now you are wrecked by the sea in the depths of the waters; your goods and the people within you have gone down.";
csb[35] = "&quot;All the inhabitants of the coasts and islands are appalled at you. Their kings shudder with fear; their faces are contorted.";
csb[36] = "&quot;Those who trade among the peoples scoff at you; you have become an object of horror and will never exist again.&quot; \' &quot;";

kjv[3] = "And say unto Tyrus, O thou that art situate at the entry of the sea, [which art] a merchant of the people for many isles, Thus saith the Lord GOD; O Tyrus, thou hast said, I [am] of perfect beauty.";
rsv[3] = "and say to Tyre, who dwells at the entrance to the sea, merchant of the peoples on many coastlands, thus says the Lord GOD: &quot;O Tyre, you have said, \'I am perfect in beauty.\'";

dby[19] = "Vedan and Javan of Uzal traded in thy markets: wrought iron, cassia, and calamus were in thy traffic.";

hnv[19] = "Dan and Yavan traded with yarn for your wares: bright iron, cassia, and calamus, were among your merchandise.";
vul[19] = "Dan et Graecia et Mozel in nundinis tuis proposuerunt ferrum fabrefactum stacte et calamus in negotiatione tua";
kjv[20] = "Dedan [was] thy merchant in precious clothes for chariots.";
rsv[20] = "Dedan traded with you in saddlecloths for riding.";
asv[20] = "Dedan was thy trafficker in precious cloths for riding.";
yng[20] = "Dedan [is] thy merchant, For clothes of freedom for riding.";
dby[20] = "Dedan was thy trafficker in precious riding-cloths.";
web[20] = "Dedan [was] thy merchant in precious clothes for chariots.";
hnv[20] = "Dedan was your trafficker in precious cloths for riding.";
vul[20] = "Dadan institores tui in tapetibus ad sedendum";
kjv[21] = "Arabia, and all the princes of Kedar, they occupied with thee in lambs, and rams, and goats: in these [were they] thy merchants.";
rsv[21] = "Arabia and all the princes of Kedar were your favored dealers in lambs, rams, and goats; in these they trafficked with you.";
asv[21] = "Arabia, and all the princes of Kedar, they were the merchants of thy hand; in lambs, and rams, and goats, in these were they thy merchants.";
yng[21] = "Arabia, and all princes of Kedar, They [are] the traders of thy hand, For lambs, and rams, and he-goats, In these thy merchants.";
dby[21] = "Arabia and all the princes of Kedar were the merchants of thy hand: in lambs, and rams, and goats, in these did they trade with thee.";
web[21] = "Arabia, and all the princes of Kedar, they occupied with thee in lambs, and rams, and goats: in these [were they] thy merchants.";
hnv[21] = "`Arav, and all the princes of Kedar, they were the merchants of your hand; in lambs, and rams, and goats, in these were they your merchants.";
vul[21] = "Arabia et universi principes Cedar ipsi negotiatores manus tuae cum agnis et arietibus et hedis venerunt ad te negotiatores tui";
kjv[22] = "The merchants of Sheba and Raamah, they [were] thy merchants: they occupied in thy fairs with chief of all spices, and with all precious stones, and gold.";
rsv[22] = "The traders of Sheba and Ra\'amah traded with you; they exchanged for your wares the best of all kinds of spices, and all precious stones, and gold.";
asv[22] = "The traffickers of Sheba and Raamah, they were thy traffickers; they traded for thy wares with the chief of all spices, and with all precious stones, and gold.";
yng[22] = "Merchants of Sheba and Raamah -- they [are] thy merchants, For the chief of all spices, And for every precious stone, and gold, They have given out thy remnants.";
dby[22] = "The merchants of Sheba and Raamah were thy traffickers: they furnished thy markets with all the choice spices, and with all precious stones and gold.";
web[22] = "The merchants of Sheba and Raamah, they [were] thy merchants: they occupied in thy fairs with chief of all spices, and with all precious stones, and gold.";
hnv[22] = " The traffickers of Sheva and Ra`mah, they were your traffickers; they traded for your wares with the chief of all spices, and with all precious stones, and gold.";
vul[22] = "venditores Saba et Reema ipsi negotiatores tui cum universis primis aromatibus et lapide pretioso et auro quod proposuerunt in mercatu tuo";
kjv[23] = "Haran, and Canneh, and Eden, the merchants of Sheba, Asshur, [and] Chilmad, [were] thy merchants.";
rsv[23] = "Haran, Canneh, Eden, Asshur, and Chilmad traded with you.";
asv[23] = "Haran and Canneh and Eden, the traffickers of Sheba, Asshur [and] Chilmad, were thy traffickers.";
yng[23] = "Haran, and Canneh, and Eden, merchants of Sheba, Asshur -- Chilmad -- [are] thy merchants,";
dby[23] = "Haran, and Canneh, and Eden, the merchants of Sheba, Asshur, and Chilmad traded with thee:";
web[23] = "Haran, and Canneh, and Eden, the merchants of Sheba, Asshur, [and] Chilmad, [were] thy merchants.";
hnv[23] = "Haran and Kanneh and `Eden, the traffickers of Sheva, Ashshur [and] Kilmad, were your traffickers.";
vul[23] = "Aran et Chenne et Eden negotiatores Saba Assur Chelmad venditores tui";
kjv[24] = "These [were] thy merchants in all sorts [of things], in blue clothes, and broidered work, and in chests of rich apparel, bound with cords, and made of cedar, among thy merchandise.";
rsv[24] = "These traded with you in choice garments, in clothes of blue and embroidered work, and in carpets of colored stuff, bound with cords and made secure; in these they traded with you.";
asv[24] = "These were thy traffickers in choice wares, in wrappings of blue and broidered work, and in chests of rich apparel, bound with cords and made of cedar, among thy merchandise.";
yng[24] = "They [are] thy merchants for perfect things, For wrappings of blue, and embroidery, And for treasuries of rich apparel, With cords bound and girded, for thy merchandise,";
dby[24] = "these traded with thee in sumptuous clothes, in wrappings of blue and broidered work, and in chests full of variegated stuffs, bound with cords and made of cedar-wood, amongst thy merchandise.";
web[24] = "These [were] thy merchants in all sorts [of things], in blue clothes, and broidered work, and in chests of rich apparel, bound with cords, and made of cedar, among thy merchandise.";
hnv[24] = "These were your traffickers in choice wares, in wrappings of blue and embroidered work, and in chests of rich clothing, bound with cords and made of cedar, among your merchandise.";
vul[24] = "ipsi negotiatores tui multifariam involucris hyacinthi et polymitorum gazarumque pretiosarum quae obvolutae et adstrictae erant funibus cedros quoque habebant in negotiationibus tuis";
kjv[25] = "The ships of Tarshish did sing of thee in thy market: and thou wast replenished, and made very glorious in the midst of the seas.";
rsv[25] = "The ships of Tarshish traveled for you with your merchandise. &quot;So you were filled and heavily laden in the heart of the seas.";
asv[25] = "The ships of Tarshish were thy caravans for thy merchandise: and thou wast replenished, and made very glorious in the heart of the seas.";
yng[25] = "Ships of Tarshish [are] thy double walls of thy merchandise, And thou art filled and honoured greatly, In the heart of the seas.";
dby[25] = "The ships of Tarshish were thy caravans for thy traffic; and thou wast replenished, and highly honoured, in the heart of the seas.";
web[25] = "The ships of Tarshish did sing of thee in thy market; and thou wast replenished, and made very glorious in the midst of the seas.";
hnv[25] = "The ships of Tarshish were your caravans for your merchandise: and you were replenished, and made very glorious in the heart of the seas.";
vul[25] = "naves maris principes tuae in negotiatione tua et repleta es et glorificata nimis in corde maris";
kjv[26] = "Thy rowers have brought thee into great waters: the east wind hath broken thee in the midst of the seas.";
rsv[26] = "Your rowers have brought you out into the high seas. The east wind has wrecked you in the heart of the seas.";
asv[26] = "Thy rowers have brought thee into great waters: the east wind hath broken thee in the heart of the seas.";
yng[26] = "Into great waters have they brought thee, Those rowing thee, The east wind hath broken thee in the heart of the seas.";
dby[26] = "Thy rowers have brought thee into great waters; the east wind hath broken thee in the heart of the seas.";
web[26] = "Thy rowers have brought thee into great waters: the east wind hath broken thee in the midst of the seas.";
hnv[26] = " Your rowers have brought you into great waters: the east wind has broken you in the heart of the seas.";
vul[26] = "in aquis multis adduxerunt te remiges tui ventus auster contrivit te in corde maris";
kjv[27] = "Thy riches, and thy fairs, thy merchandise, thy mariners, and thy pilots, thy calkers, and the occupiers of thy merchandise, and all thy men of war, that [are] in thee, and in all thy company which [is] in the midst of thee, shall fall into the midst of the seas in the day of thy ruin.";
rsv[27] = "Your riches, your wares, your merchandise, your mariners and your pilots, your caulkers, your dealers in merchandise, and all your men of war who are in you, with all your company that is in your midst, sink into the heart of the seas on the day of your ruin.";
asv[27] = "Thy riches, and thy wares, thy merchandise, thy mariners, and thy pilots, thy calkers, and the dealers in thy merchandise, and all thy men of war, that are in thee, with all thy company which is in the midst of thee, shall fall into the heart of the seas in the day of thy ruin.";
yng[27] = "Thy wealth and thy remnants, Thy merchandise, thy mariners, And thy pilots, strengtheners of thy breach, And the traders of thy merchandise, And all thy men of war, who [are] in thee, And in all thine assembly that [is] in thy midst, Fall into the heart of the seas in the day of thy fall,";
dby[27] = "Thy substance, and thy markets, thy merchandise, thy mariners, and thy pilots, they that repair thy leaks, and they that barter with thee, and all thy men of war that are in thee, along with all thine assemblage which is in the midst of thee, shall fall into the heart of the seas in the day of thy fall.";
web[27] = "Thy riches, and thy fairs, thy merchandise, thy mariners, and thy pilots, thy calkers, and the occupiers of thy merchandise, and all thy military men, that [are] in thee, and in all thy company which [is] in the midst of thee, shall fall into the midst of the seas in the day of thy ruin.";
hnv[27] = "Your riches, and your wares, your merchandise, your mariners, and your pilots, your repairers of ship seams, and the dealers in your merchandise, and all your men of war, who are in you, with all your company which is in the midst of you, shall fall into the heart of the seas in the day of your ruin.";
vul[27] = "divitiae tuae et thesauri tui et multiplex instrumentum tuum nautae tui et gubernatores tui qui tenebant supellectilem tuam et populo tuo praeerant viri quoque bellatores tui qui erant in te cum universa multitudine tua quae est in medio tui cadent in corde maris in die ruinae tuae";
kjv[28] = "The suburbs shall shake at the sound of the cry of thy pilots.";
rsv[28] = "At the sound of the cry of your pilots the countryside shakes,";
asv[28] = "At the sound of the cry of thy pilots the suburbs shall shake.";
yng[28] = "At the voice of the cry of thy pilots shake do the suburbs.";
dby[28] = "The open places shall shake at the sound of the cry of thy pilots.";
web[28] = "The suburbs shall shake at the sound of the cry of thy pilots.";
hnv[28] = "At the sound of the cry of your pilots the suburbs shall shake.";
vul[28] = "a sonitu clamoris gubernatorum tuorum conturbabuntur classes";
kjv[29] = "And all that handle the oar, the mariners, [and] all the pilots of the sea, shall come down from their ships, they shall stand upon the land;";
rsv[29] = "and down from their ships come all that handle the oar. The mariners and all the pilots of the sea stand on the shore";
asv[29] = "And all that handle the oar, the mariners, [and] all the pilots of the sea, shall come down from their ships; they shall stand upon the land,";
yng[29] = "And come down from their ships have all handling an oar, Mariners, all the pilots of the sea, on the land they stand,";
dby[29] = "And all that handle the oar, the mariners, all the pilots of the sea, shall come down from their ships; they shall stand upon the land,";
web[29] = "And all that handle the oar, the mariners, [and] all the pilots of the sea, shall come down from their ships, they shall stand upon the land;";
hnv[29] = "All who handled the oar, the mariners, [and] all the pilots of the sea, shall come down from their ships; they shall stand on the land,";

kjv[30] = "And shall cause their voice to be heard against thee, and shall cry bitterly, and shall cast up dust upon their heads, they shall wallow themselves in the ashes:";
rsv[30] = "and wail aloud over you, and cry bitterly. They cast dust on their heads and wallow in ashes;";
asv[30] = "and shall cause their voice to be heard over thee, and shall cry bitterly, and shall cast up dust upon their heads; they shall wallow themselves in the ashes:";
yng[30] = "And have sounded for thee with their voice, And cry bitterly, and cause dust to go up on their heads, In ashes they do roll themselves.";
dby[30] = "and shall cause their voice to be heard over thee, and shall cry bitterly; and they shall cast up dust upon their heads; they shall wallow themselves in ashes.";
web[30] = "And shall cause their voice to be heard against thee, and shall cry bitterly, and shall cast up dust upon their heads, they shall wallow themselves in the ashes:";
hnv[30] = "and shall cause their voice to be heard over you, and shall cry bitterly, and shall cast up dust on their heads, they shall wallow themselves in the ashes:";
vul[30] = "et heiulabunt super te voce magna et clamabunt amare et superiacient pulverem capitibus suis et cinere conspergentur";

rsv[31] = "they make themselves bald for you, and gird themselves with sackcloth, and they weep over you in bitterness of soul, with bitter mourning.";
asv[31] = "and they shall make themselves bald for thee, and gird them with sackcloth, and they shall weep for thee in bitterness of soul with bitter mourning.";
yng[31] = "And they have made for thee baldness, And they have girded on sackcloth, And they have wept for thee, In bitterness of soul -- a bitter mourning.";
dby[31] = "And they shall make themselves utterly bald for thee, and gird themselves with sackcloth; and they shall weep for thee in bitterness of soul with bitter mourning.";
web[31] = "And they shall make themselves utterly bald for thee, and gird themselves with sackcloth, and they shall weep for thee with bitterness of heart [and] bitter wailing.";
hnv[31] = "and they shall make themselves bald for you, and gird them with sackcloth, and they shall weep for you in bitterness of soul with bitter mourning.";

asv[32] = "And in their wailing they shall take up a lamentation for thee, and lament over thee, [saying], Who is there like Tyre, like her that is brought to silence in the midst of the sea?";
yng[32] = "And lifted up for thee have their sons a lamentation, And they have lamented over thee, who [is] as Tyre? As the cut-off one in the midst of the sea?";
dby[32] = "And in their wailing they shall take up a lamentation for thee, and lament over thee, [saying,] Who is like Tyre, like her that is destroyed in the midst of the sea?";
web[32] = "And in their wailing they shall take up a lamentation for thee, and lament over thee, [saying], What [city is] like Tyre, like the destroyed in the midst of the sea?";
hnv[32] = "In their wailing they shall take up a lamentation for you, and lament over you, [saying], Who is there like Tzor, like her who is brought to silence in the midst of the sea?";
vul[32] = "et adsument super te carmen lugubre et plangent te quae est ut Tyrus quae obmutuit in medio maris";
kjv[33] = "When thy wares went forth out of the seas, thou filledst many people; thou didst enrich the kings of the earth with the multitude of thy riches and of thy merchandise.";
rsv[33] = "When your wares came from the seas, you satisfied many peoples; with your abundant wealth and merchandise you enriched the kings of the earth.";
asv[33] = "When thy wares went forth out of the seas, thou filledst many peoples; thou didst enrich the kings of the earth with the multitude of thy riches and of thy merchandise.";
yng[33] = "With the outgoing of thy remnants from the seas, Thou hast filled many peoples, With the abundance of thy riches, and thy merchandise, Thou hast made rich things of earth.";
dby[33] = "When thy wares went forth over the seas, thou filledst many peoples; thou didst enrich the kings of the earth with the abundance of thy substance and of thy merchandise.";
web[33] = "When thy wares went forth out of the seas, thou filledst many people; thou didst enrich the kings of the earth with the multitude of thy riches and of thy merchandise.";
hnv[33] = "When your wares went forth out of the seas, you filled many peoples; you did enrich the kings of the eretz with the multitude of your riches and of your merchandise.";

rsv[34] = "Now you are wrecked by the seas, in the depths of the waters; your merchandise and all your crew have sunk with you.";
asv[34] = "In the time that thou wast broken by the seas in the depths of the waters, thy merchandise and all thy company did fall in the midst of thee.";
yng[34] = "The time of [thy] being broken by the seas in the depths of the waters, Thy merchandise and all thy assembly in thy midst have fallen.";
dby[34] = "In the time [when] thou art broken by the seas, in the depths of the waters, thy merchandise and all thine assemblage in the midst of thee have fallen.";
web[34] = "In the time [when] thou shalt be broken by the seas in the depths of the waters, thy merchandise and all thy company in the midst of thee shall fall.";
hnv[34] = "In the time that you were broken by the seas in the depths of the waters, your merchandise and all your company did fall in the midst of you.";
vul[34] = "nunc contrita es a mari in profundis aquarum opes tuae et omnis multitudo tua quae erat in medio tui ceciderunt";

asv[35] = "All the inhabitants of the isles are astonished at thee, and their kings are horribly afraid; they are troubled in their countenance.";
yng[35] = "All inhabitants of the isles have been astonished at thee, And their kings have been sore afraid, They have been troubled in countenance.";
dby[35] = "All the inhabitants of the isles are amazed at thee, and their kings are horribly afraid, [their] countenance is troubled.";

hnv[35] = "All the inhabitants of the isles are astonished at you, and their kings are horribly afraid; they are troubled in their face.";

kjv[36] = "The merchants among the people shall hiss at thee; thou shalt be a terror, and never [shalt be] any more.";
rsv[36] = "The merchants among the peoples hiss at you; you have come to a dreadful end and shall be no more for ever.\'&quot;";
asv[36] = "The merchants among the peoples hiss at thee; thou art become a terror, and thou shalt nevermore have any being.";
yng[36] = "Merchants among the peoples have shrieked for thee, Wastes thou hast been, and thou art not -- to the age!\'";
dby[36] = "The merchants among the peoples hiss at thee; thou art become a terror, and thou shalt never be any more.";
web[36] = "The merchants among the people shall hiss at thee; thou shalt be a terror, and never [shalt be] any more.";
hnv[36] = "The merchants among the peoples hiss at you; you are become a terror, and you shall nevermore have any being.";
