csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, pose a riddle and speak a parable to the house of Israel.";
csb[3] = "&quot; You are to say, \'This is what the Lord GOD says: A huge eagle with powerful wings, long feathers, and full plumage of many colors came to Lebanon and took the top of the cedar.";
csb[4] = "&quot; He plucked off its topmost shoot, brought it to the land of merchants, and set it in a city of traders.";
csb[5] = "&quot;Then he took some of the land\'s seed and put it in a fertile field; he set it like a willow, a plant by abundant water.";
csb[6] = "&quot;It sprouted and became a spreading vine, low in height with its branches turned toward him, yet its roots stayed under it. So it became a vine, produced branches, and sent out shoots.";
csb[7] = "&quot; \'But there was another huge eagle with powerful wings and thick plumage. And this vine bent its roots toward him! It stretched out its branches to him from the plot where it was planted, so that he might water it.";
csb[8] = "&quot;It had been planted in a good field by abundant water in order to produce branches, bear fruit, and become a splendid vine.\'";
csb[9] = "&quot;You are to say, \'This is what the Lord GOD says: Will it flourish? Will he not tear out its roots and strip off its fruit so that it shrivels? All its fresh leaves will wither! Great strength and many people will not be needed to pull it from its roots.";
csb[10] = "&quot;Even though it is planted, will it flourish? Won\'t it wither completely when the east wind strikes it? It will wither on the plot where it sprouted.\' &quot;";
csb[11] = "The word of the LORD came to me:";
csb[12] = "&quot;Now say to that rebellious house, \'Don\'t you know what these things mean? \' Tell them, \'The king of Babylon came to Jerusalem, took its king and officials, and brought them back with him to Babylon.";
csb[13] = "&quot;He took one of the royal family and made a covenant with him, putting him under oath. Then he took away the leading men of the land,";
csb[14] = "&quot;so that the kingdom would be humble and not exalt itself but would keep his covenant in order to endure.";
csb[15] = "&quot;However, this king revolted against him by sending his ambassadors to Egypt so they might give him horses and a large army. Will he flourish? Will the one who does such things escape? Can he break a covenant and still escape?";
csb[16] = "&quot; \'As I live -- this is the declaration of the Lord GOD -- he will die in Babylon, in the land of the king who put him on the throne, whose oath he despised and whose covenant he broke.";
csb[17] = "&quot;Pharaoh with his mighty army and vast company will not help him in battle, when ramps are built and siege walls constructed to destroy many lives.";
csb[18] = "&quot;He despised the oath by breaking the covenant. He did all these things even though he gave his hand in pledge. He will not escape!";
csb[19] = "&quot; \'Therefore, this is what the Lord GOD says: As I live, I will bring down on his head my oath that he despised and my covenant that he broke.";
csb[20] = "&quot;I will spread my net over him, and he will be caught in my snare. I will bring him to Babylon and execute judgment on him there for the treachery he committed against me.";
csb[21] = "&quot;All the fugitives among his troops will fall by the sword, and those who survive will be scattered to every direction of the wind. Then you will know that I, the LORD, have spoken.";
csb[22] = "&quot; \'This is what the Lord GOD says: I will take a sprig from the lofty top of the cedar and plant it. I will pluck a tender sprig from its topmost shoots, and I will plant it on a high towering mountain.";
csb[23] = "&quot;I will plant it on Israel\'s high mountain so that it may bear branches, produce fruit, and become a majestic cedar. Birds of every kind will nest under it, taking shelter in the shade of its branches.";
csb[24] = "&quot;Then all the trees of the field will know that I am the LORD. I bring down the tall tree, and make the low tree tall. I cause the green tree to wither and make the withered tree thrive. I, the LORD, have spoken and I will do it.\' &quot;";

kjv[19] = "Therefore thus saith the Lord GOD; [As] I live, surely mine oath that he hath despised, and my covenant that he hath broken, even it will I recompense upon his own head.";
rsv[19] = "Therefore thus says the Lord GOD: As I live, surely my oath which he despised, and my covenant which he broke, I will requite upon his head.";
asv[19] = "Therefore thus saith the Lord Jehovah: As I live, surely mine oath that he hath despised, and my covenant that he hath broken, I will even bring it upon his own head.";
yng[19] = "Therefore, thus said the Lord Jehovah: I live -- Mine oath that he hath despised, And My covenant that he hath broken, Have I not put it on his head?";
dby[19] = "Therefore thus saith the Lord Jehovah: [As] I live, verily, mine oath which he hath despised, and my covenant which he hath broken, even it will I recompense upon his head.";
web[19] = "Therefore thus saith the Lord GOD; [As] I live, surely my oath that he hath despised, and my covenant that he hath broken, even that will I recompense upon his own head.";
hnv[19] = "Therefore thus says the Lord GOD: As I live, surely my oath that he has despised, and my covenant that he has broken, I will even bring it on his own head.";
vul[19] = "propterea haec dicit Dominus Deus vivo ego quoniam iuramentum quod sprevit et foedus quod praevaricatus est ponam in caput eius";
kjv[20] = "And I will spread my net upon him, and he shall be taken in my snare, and I will bring him to Babylon, and will plead with him there for his trespass that he hath trespassed against me.";
rsv[20] = "I will spread my net over him, and he shall be taken in my snare, and I will bring him to Babylon and enter into judgment with him there for the treason he has committed against me.";
asv[20] = "And I will spread my net upon him, and he shall be taken in my snare, and I will bring him to Babylon, and will enter into judgment with him there for his trespass that he hath trespassed against me.";
yng[20] = "And I have spread out for him My snare, And he hath been caught in My net, And I have brought him in to Babylon, And pleaded with him there his trespass, That he hath trespassed against Me.";
dby[20] = "And I will spread my net upon him, and he shall be taken in my snare; and I will bring him to Babylon, and will enter into judgment with him there for his unfaithfulness in which he hath been unfaithful against me.";

hnv[20] = "I will spread my net on him, and he shall be taken in my snare, and I will bring him to Bavel, and will enter into judgment with him there for his trespass that he has trespassed against me.";
vul[20] = "et expandam super eum rete meum et conprehendetur sagena mea et adducam eum in Babylonem et iudicabo illum ibi in praevaricatione qua despexit me";
kjv[21] = "And all his fugitives with all his bands shall fall by the sword, and they that remain shall be scattered toward all winds: and ye shall know that I the LORD have spoken [it].";

asv[21] = "And all his fugitives in all his bands shall fall by the sword, and they that remain shall be scattered toward every wind: and ye shall know that I, Jehovah, have spoken it.";
yng[21] = "And all his fugitives, with all his bands, By sword do fall, and those remaining, To every wind they are spread out, And ye have known that I, Jehovah, have spoken.";
dby[21] = "And all his fugitives with all his bands shall fall by the sword, and they that remain shall be scattered toward every wind; and ye shall know that I Jehovah have spoken.";

vul[21] = "et omnes profugi eius cum universo agmine gladio cadent residui autem in omnem ventum dispergentur et scietis quia ego Dominus locutus sum";
kjv[22] = "Thus saith the Lord GOD; I will also take of the highest branch of the high cedar, and will set [it]; I will crop off from the top of his young twigs a tender one, and will plant [it] upon an high mountain and eminent:";
rsv[22] = "Thus says the Lord GOD: &quot;I myself will take a sprig from the lofty top of the cedar, and will set it out; I will break off from the topmost of its young twigs a tender one, and I myself will plant it upon a high and lofty mountain;";
asv[22] = "Thus saith the Lord Jehovah: I will also take of the lofty top of the cedar, and will set it; I will crop off from the topmost of its young twigs a tender one, and I will plant it upon a high and lofty mountain:";
yng[22] = "Thus said the Lord Jehovah: I have taken of the foliage of the high cedar, And I have set [it], From the top of its tender shoots a tender one I crop, And I -- I have planted [it] on a mountain high and lofty.";
dby[22] = "Thus saith the Lord Jehovah: I will also take of the highest branch of the lofty cedar, and will set it; I will crop off from the top of its young shoots a tender one, and I will plant it upon a high and eminent mountain:";

vul[22] = "haec dicit Dominus Deus et sumam ego de medulla cedri sublimis et ponam de vertice ramorum eius tenerum distringam et plantabo super montem excelsum et eminentem";
kjv[23] = "In the mountain of the height of Israel will I plant it: and it shall bring forth boughs, and bear fruit, and be a goodly cedar: and under it shall dwell all fowl of every wing; in the shadow of the branches thereof shall they dwell.";
rsv[23] = "on the mountain height of Israel will I plant it, that it may bring forth boughs and bear fruit, and become a noble cedar; and under it will dwell all kinds of beasts; in the shade of its branches birds of every sort will nest.";
asv[23] = "in the mountain of the height of Israel will I plant it; and it shall bring forth boughs, and bear fruit, and be a goodly cedar: and under it shall dwell all birds of every wing; in the shade of the branches thereof shall they dwell.";
yng[23] = "In a mountain -- the high place of Israel, I plant it, And it hath borne boughs, and yielded fruit, And become a goodly cedar, And dwelt under it have all birds of every wing, In the shade of its thin shoots they dwell.";

hnv[23] = " in the mountain of the height of Yisra\'el will I plant it; and it shall bring forth boughs, and bear fruit, and be a goodly cedar: and under it shall dwell all birds of every wing; in the shade of the branches of it shall they dwell.";
vul[23] = "in monte sublimi Israhel plantabo illud et erumpet in germen et faciet fructum et erit in cedrum magnam et habitabunt sub eo omnes volucres universum volatile sub umbra frondium eius nidificabit";
kjv[24] = "And all the trees of the field shall know that I the LORD have brought down the high tree, have exalted the low tree, have dried up the green tree, and have made the dry tree to flourish: I the LORD have spoken and have done [it].";
