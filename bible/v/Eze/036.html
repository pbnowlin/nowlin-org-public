csb[1] = "&quot;Son of man, prophesy to the mountains of Israel and say, \'Mountains of Israel, hear the word of the LORD.";
csb[2] = "&quot;This is what the Lord GOD says: Because the enemy has said about you, &quot;Aha! The ancient heights have become our possession,&quot; \'";
csb[3] = "therefore, prophesy and say: \'This is what the Lord GOD says: Because they have made you desolate and have trampled you from every side, so that you became a possession for the rest of the nations and an object of people\'s gossip and slander,";
csb[4] = "therefore, mountains of Israel, hear the word of the Lord GOD. This is what the Lord GOD says to the mountains and hills, to the ravines and valleys, to the desolate ruins and abandoned cities, which have become plunder and a mockery to the rest of the nations all around.";
csb[5] = "&quot; \'This is what the Lord GOD says: Certainly in my burning zeal I speak against the rest of the nations and all of Edom, who took my land as their own possession with wholehearted rejoicing and utter contempt so that its pastureland became plunder.";
csb[6] = "&quot;Therefore, prophesy concerning the land of Israel and say to the mountains and hills, to the ravines and valleys: This is what the Lord GOD says: Look, I speak in my burning zeal because you have endured the insults of the nations.";
csb[7] = "&quot;Therefore, this is what the Lord GOD says: I swear that the nations all around you will endure their own insults.";
csb[8] = "&quot; \'You, mountains of Israel, will produce your branches and bear your fruit for my people Israel, since their arrival is near.";
csb[9] = "&quot;Look! I am on your side; I will turn toward you, and you will be tilled and sown.";
csb[10] = "&quot;I will fill you with people, with the whole house of Israel in its entirety. The cities will be inhabited and the ruins rebuilt.";
csb[11] = "&quot;I will fill you with people and animals, and they will increase and be fruitful. I will make you inhabited as you once were and make you better off than you were before. Then you will know that I am the LORD.";
csb[12] = "&quot;I will cause people, my people Israel, to walk on you; they will possess you, and you will be their inheritance. You will no longer deprive them of their children.";
csb[13] = "&quot; \'This is what the Lord GOD says: Because some are saying to you, &quot;You devour people and deprive your nation of children,&quot;";
csb[14] = "therefore, you will no longer devour people and deprive your nation of children. This is the declaration of the Lord GOD.";
csb[15] = "I will no longer allow the insults of the nations to be heard against you, and you will not have to endure the reproach of the peoples anymore; you will no longer cause your nation to stumble. This is the declaration of the Lord GOD.\' &quot;";
csb[16] = "The word of the LORD came to me:";
csb[17] = "&quot;Son of man, while the house of Israel lived in their land, they defiled it with their conduct and actions. Their behavior before me was like menstrual impurity.";
csb[18] = "&quot;So I poured out my wrath on them because of the blood they had shed on the land, and because they had defiled it with their idols.";
csb[19] = "&quot;I dispersed them among the nations, and they were scattered among the countries. I judged them according to their conduct and actions.";
csb[20] = "&quot;When they came to the nations where they went, they profaned my holy name, because it was said about them, \'These are the people of the LORD, yet they had to leave his land in exile.\'";
csb[21] = "&quot;Then I had concern for my holy name, which the house of Israel profaned among the nations where they went.";
csb[22] = "&quot;Therefore, say to the house of Israel, \'This is what the Lord GOD says: It is not for your sake that I will act, house of Israel, but for my holy name, which you profaned among the nations where you went.";
csb[23] = "&quot;I will honor the holiness of my great name, which has been profaned among the nations -- the name you have profaned among them. The nations will know that I am the LORD -- this is the declaration of the Lord GOD -- when I demonstrate my holiness through you in their sight.";
csb[24] = "&quot; \'For I will take you from the nations and gather you from all the countries, and will bring you into your own land.";
csb[25] = "&quot;I will also sprinkle clean water on you, and you will be clean. I will cleanse you from all your impurities and all your idols.";
csb[26] = "&quot;I will give you a new heart and put a new spirit within you; I will remove your heart of stone and give you a heart of flesh.";
csb[27] = "&quot;I will place my Spirit within you and cause you to follow my statutes and carefully observe my ordinances.";
csb[28] = "&quot;You will live in the land that I gave your fathers; you will be my people, and I will be your God.";
csb[29] = "&quot;I will save you from all your uncleanness. I will summon the grain and make it plentiful, and I will not bring famine on you.";
csb[30] = "&quot;I will also make the fruit of the trees and the produce of the field plentiful, so that you will no longer experience reproach among the nations on account of famine.";
csb[31] = "&quot; \'You will remember your evil ways and your deeds that were not good, and you will loathe yourselves for your iniquities and detestable practices.";
csb[32] = "&quot;It is not for your sake that I will act -- this is the declaration of the Lord GOD -- let this be known to you. Be ashamed and humiliated because of your ways, house of Israel!";
csb[33] = "&quot; \'This is what the Lord GOD says: On the day I cleanse you from all your iniquities, I will cause the cities to be inhabited, and the ruins will be rebuilt.";
csb[34] = "&quot;The desolate land will be cultivated instead of lying desolate in the sight of everyone who passes by.";
csb[35] = "&quot;They will say, &quot;This land that was desolate has become like the garden of Eden. The cities that were once ruined, desolate, and demolished are now fortified and inhabited.&quot;";
csb[36] = "Then the nations that remain around you will know that I, the LORD, have rebuilt what was demolished and have replanted what was desolate. I, the LORD, have spoken and I will do it.";
csb[37] = "&quot; \'This is what the Lord GOD says: I will respond to the house of Israel and do this for them: I will multiply them in number like a flock.";
csb[38] = "&quot;So the ruined cities will be filled with a flock of people, just as Jerusalem is filled with a flock of sheep for sacrifice during its appointed festivals. Then they will know that I am the LORD.\' &quot;";
kjv[1] = "Also, thou son of man, prophesy unto the mountains of Israel, and say, Ye mountains of Israel, hear the word of the LORD:";
rsv[1] = "&quot;And you, son of man, prophesy to the mountains of Israel, and say, O mountains of Israel, hear the word of the LORD.";
asv[1] = "And thou, son of man, prophesy unto the mountains of Israel, and say, Ye mountains of Israel, hear the word of Jehovah.";
yng[1] = "And thou, son of man, prophesy unto mountains of Israel, and thou hast said, O mountains of Israel, hear a word of Jehovah.";
dby[1] = "And thou, son of man, prophesy unto the mountains of Israel, and say, Mountains of Israel, hear the word of Jehovah.";
web[1] = "Also thou son of man, prophesy to the mountains of Israel, and say, Ye mountains of Israel, hear the word of the LORD:";
hnv[1] = "You, son of man, prophesy to the mountains of Yisra\'el, and say, You mountains of Yisra\'el, hear the word of the LORD.";
vul[1] = "tu autem fili hominis propheta super montes Israhel et dices montes Israhel audite verbum Domini";
kjv[2] = "Thus saith the Lord GOD; Because the enemy hath said against you, Aha, even the ancient high places are ours in possession:";
rsv[2] = "Thus says the Lord GOD: Because the enemy said of you, \'Aha!\' and, \'The ancient heights have become our possession,\'";
asv[2] = "Thus saith the Lord Jehovah: Because the enemy hath said against you, Aha! and, The ancient high places are ours in possession;";
yng[2] = "Thus said the Lord Jehovah: Because the enemy said against you, Aha, and the high places of old for a possession have been to us,";
dby[2] = "Thus saith the Lord Jehovah: Because the enemy hath said against you, Aha! and, The ancient high places are become ours in possession;";
web[2] = "Thus saith the Lord GOD; Because the enemy had said against you, Aha, even the ancient high places are ours in possession:";
hnv[2] = "Thus says the Lord GOD: Because the enemy has said against you, Aha! and, The ancient high places are ours in possession;";
vul[2] = "haec dicit Dominus Deus eo quod dixerit inimicus de vobis euge altitudines sempiternae in hereditatem datae sunt nobis";
kjv[3] = "Therefore prophesy and say, Thus saith the Lord GOD; Because they have made [you] desolate, and swallowed you up on every side, that ye might be a possession unto the residue of the heathen, and ye are taken up in the lips of talkers, and [are] an infamy of the people:";
rsv[3] = "therefore prophesy, and say, Thus says the Lord GOD: Because, yea, because they made you desolate, and crushed you from all sides, so that you became the possession of the rest of the nations, and you became the talk and evil gossip of the people;";
asv[3] = "therefore prophesy, and say, Thus saith the Lord Jehovah: Because, even because they have made you desolate, and swallowed you up on every side, that ye might be a possession unto the residue of the nations, and ye are taken up in the lips of talkers, and the evil report of the people;";
yng[3] = "therefore, prophesy, and thou hast said: Thus said the Lord Jehovah: Because, even because, of desolating, And of swallowing you up from round about, For your being a possession to the remnant of the nations, And ye are taken up on the tip of the tongue, And [are] an evil report of the people.";
dby[3] = "therefore prophesy and say, Thus saith the Lord Jehovah: Because, yea, because they have made [you] desolate, and have swallowed you up on every side, that ye might be a possession unto the remnant of the nations, and ye are taken up in the lips of talkers, and in the defaming of the people:";
web[3] = "Therefore prophesy and say, Thus saith the Lord GOD; Because they have made [you] desolate, and swallowed you up on every side, that ye might be a possession to the residue of the heathen, and ye are taken up in the lips of talkers, and [are] an infamy of the people:";
hnv[3] = "therefore prophesy, and say, Thus says the Lord GOD: Because, even because they have made you desolate, and swallowed you up on every side, that you might be a possession to the residue of the nations, and you are taken up in the lips of talkers, and the evil report of the people;";
vul[3] = "propterea vaticinare et dic haec dicit Dominus Deus pro eo quod desolati estis et conculcati per circuitum et facti in hereditatem reliquis gentibus et ascendistis super labium linguae et obprobrium populi";
kjv[4] = "Therefore, ye mountains of Israel, hear the word of the Lord GOD; Thus saith the Lord GOD to the mountains, and to the hills, to the rivers, and to the valleys, to the desolate wastes, and to the cities that are forsaken, which became a prey and derision to the residue of the heathen that [are] round about;";
rsv[4] = "therefore, O mountains of Israel, hear the word of the Lord GOD: Thus says the Lord GOD to the mountains and the hills, the ravines and the valleys, the desolate wastes and the deserted cities, which have become a prey and derision to the rest of the nations round about;";
asv[4] = "therefore, ye mountains of Israel, hear the word of the Lord Jehovah: Thus saith the Lord Jehovah to the mountains and to the hills, to the watercourses and to the valleys, to the desolate wastes and to the cities that are forsaken, which are become a prey and derision to the residue of the nations that are round about;";
yng[4] = "Therefore, O mountains of Israel, Hear a word of the Lord Jehovah: Thus said the Lord Jehovah, to mountains, and to hills, To streams, and to valleys, And to wastes that [are] desolate, And to cities that are forsaken, That have been for a prey, And for a scorn, to the remnant of the nations who [are] round about.";
dby[4] = "therefore, ye mountains of Israel, hear the word of the Lord Jehovah. Thus saith the Lord Jehovah to the mountains and to the hills, to the water-courses and to the valleys, to the desolate wastes and to the cities that are forsaken, which are become a prey and a derision to the remnant of the nations that are round about,";
web[4] = "Therefore, ye mountains of Israel, hear the word of the Lord GOD; Thus saith the Lord GOD to the mountains, and to the hills, to the rivers, and to the valleys, to the desolate wastes, and to the cities that are forsaken, which became a prey and derision to the residue of the heathen that [are] around;";
hnv[4] = " therefore, you mountains of Yisra\'el, hear the word of the Lord GOD: Thus says the Lord GOD to the mountains and to the hills, to the watercourses and to the valleys, to the desolate wastes and to the cities that are forsaken, which are become a prey and derision to the residue of the nations that are round about;";
vul[4] = "propterea montes Israhel audite verbum Domini Dei haec dicit Dominus Deus montibus et collibus torrentibus vallibusque et desertis parietinis et urbibus derelictis quae depopulatae sunt et subsannatae a reliquis gentibus per circuitum";
kjv[5] = "Therefore thus saith the Lord GOD; Surely in the fire of my jealousy have I spoken against the residue of the heathen, and against all Idumea, which have appointed my land into their possession with the joy of all [their] heart, with despiteful minds, to cast it out for a prey.";
rsv[5] = "therefore thus says the Lord GOD: I speak in my hot jealousy against the rest of the nations, and against all Edom, who gave my land to themselves as a possession with wholehearted joy and utter contempt, that they might possess it and plunder it.";
asv[5] = "therefore thus saith the Lord Jehovah: Surely in the fire of my jealousy have I spoken against the residue of the nations, and against all Edom, that have appointed my land unto themselves for a possession with the joy of all their heart, with despite of soul, to cast it out for a prey.";
yng[5] = "Therefore, thus said the Lord Jehovah: Have I not, in the fire of My jealousy, Spoken against the remnant of the nations, And against Edom -- all of it, Who gave My land to themselves for a possession, With the joy of the whole heart -- with despite of soul, For the sake of casting it out for a prey?";
dby[5] = "-- therefore thus saith the Lord Jehovah: Surely in the fire of my jealousy have I spoken against the remnant of the nations, and against the whole of Edom, which have appointed my land unto themselves for a possession with the joy of all [their] heart, with despite of soul, to plunder it by pillage.";
web[5] = "Therefore thus saith the Lord GOD; Surely in the fire of my jealousy have I spoken against the residue of the heathen, and against all Edom, who have appointed my land into their possession with the joy of all [their] heart, with despiteful minds, to cast it out for a prey.";
hnv[5] = "therefore thus says the Lord GOD: Surely in the fire of my jealousy have I spoken against the residue of the nations, and against all Edom, that have appointed my land to themselves for a possession with the joy of all their heart, with despite of soul, to cast it out for a prey.";
vul[5] = "propterea haec dicit Dominus Deus quoniam in igne zeli mei locutus sum de reliquis gentibus et de Idumea universa qui dederunt terram meam sibi in hereditatem cum gaudio et toto corde ex animo et eiecerunt eam ut vastarent";
kjv[6] = "Prophesy therefore concerning the land of Israel, and say unto the mountains, and to the hills, to the rivers, and to the valleys, Thus saith the Lord GOD; Behold, I have spoken in my jealousy and in my fury, because ye have borne the shame of the heathen:";
rsv[6] = "Therefore prophesy concerning the land of Israel, and say to the mountains and hills, to the ravines and valleys, Thus says the Lord GOD: Behold, I speak in my jealous wrath, because you have suffered the reproach of the nations;";
asv[6] = "Therefore prophesy concerning the land of Israel, and say unto the mountains and to the hills, to the watercourses and to the valleys, Thus saith the Lord Jehovah: Behold, I have spoken in my jealousy and in my wrath, because ye have borne the shame of the nations:";
yng[6] = "Therefore, prophesy concerning the ground of Israel, And thou hast said to mountains, and to hills, To streams, and to valleys, Thus said the Lord Jehovah: Lo, I, in My jealousy, and in My fury, I have spoken, Because the shame of nations ye have borne.";
dby[6] = "Prophesy therefore concerning the land of Israel, and say to the mountains and to the hills, to the water-courses and to the valleys, Thus saith the Lord Jehovah: Behold, I have spoken in my jealousy and in my fury, because ye have borne the ignominy of the nations;";
web[6] = "Prophesy therefore concerning the land of Israel, and say to the mountains, and to the hills, to the rivers, and to the valleys, Thus saith the Lord GOD; Behold, I have spoken in my jealousy and in my fury, because ye have borne the shame of the heathen:";
hnv[6] = "Therefore prophesy concerning Eretz-Yisra\'el, and tell the mountains and to the hills, to the watercourses and to the valleys, Thus says the Lord GOD: Behold, I have spoken in my jealousy and in my wrath, because you have borne the shame of the nations:";
vul[6] = "idcirco vaticinare super humum Israhel et dices montibus et collibus iugis et vallibus haec dicit Dominus Deus ecce ego in zelo meo et in furore meo locutus sum eo quod confusionem gentium sustinueritis";
kjv[7] = "Therefore thus saith the Lord GOD; I have lifted up mine hand, Surely the heathen that [are] about you, they shall bear their shame.";
rsv[7] = "therefore thus says the Lord GOD: I swear that the nations that are round about you shall themselves suffer reproach.";
asv[7] = "therefore thus saith the Lord Jehovah: I have sworn, [saying], Surely the nations that are round about you, they shall bear their shame.";
yng[7] = "Therefore, thus said the Lord Jehovah: I -- I have lifted up My hand, Do not -- the nations who [are] with you from round about -- they their own shame bear?";
dby[7] = "therefore thus saith the Lord Jehovah: I have lifted up my hand, [saying,] Verily the nations that are about you, they shall bear their shame.";
web[7] = "Therefore thus saith the Lord GOD; I have lifted up my hand, Surely the heathen that [are] about you, they shall bear their shame.";
hnv[7] = "therefore thus says the Lord GOD: I have sworn, [saying], Surely the nations that are round about you, they shall bear their shame.";
vul[7] = "idcirco haec dicit Dominus Deus ego levavi manum meam ut gentes quae in circuitu vestro sunt ipsae confusionem suam portent";
kjv[8] = "But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people of Israel; for they are at hand to come.";
rsv[8] = "&quot;But you, O mountains of Israel, shall shoot forth your branches, and yield your fruit to my people Israel; for they will soon come home.";
asv[8] = "But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people Israel; for they are at hand to come.";
yng[8] = "And ye, O mountains of Israel, Your branch ye give out, and your fruits ye bear for My people Israel, For they have drawn near to come.";
dby[8] = "And ye mountains of Israel shall shoot forth your branches, and yield your fruit to my people Israel: for they are at hand to come.";
web[8] = "But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people of Israel; for they are at hand to come.";
hnv[8] = "But you, mountains of Yisra\'el, you shall shoot forth your branches, and yield your fruit to my people Yisra\'el; for they are at hand to come.";
vul[8] = "vos autem montes Israhel ramos vestros germinetis et fructum vestrum adferatis populo meo Israhel prope est enim ut veniat";
kjv[9] = "For, behold, I [am] for you, and I will turn unto you, and ye shall be tilled and sown:";
rsv[9] = "For, behold, I am for you, and I will turn to you, and you shall be tilled and sown;";
asv[9] = "For, behold, I am for you, and I will turn into you, and ye shall be tilled and sown;";
yng[9] = "For, lo, I [am] for you, and have turned to you, And ye have been tilled and sown.";
dby[9] = "For behold, I am for you, and I will turn unto you, and ye shall be tilled and sown.";
web[9] = "For behold, I [am] for you, and I will turn to you, and ye shall be tilled and sown:";
hnv[9] = "For, behold, I am for you, and I will turn into you, and you shall be tilled and sown;";
vul[9] = "quia ecce ego ad vos et convertar ad vos et arabimini et accipietis sementem";
kjv[10] = "And I will multiply men upon you, all the house of Israel, [even] all of it: and the cities shall be inhabited, and the wastes shall be builded:";
rsv[10] = "and I will multiply men upon you, the whole house of Israel, all of it; the cities shall be inhabited and the waste places rebuilt;";
asv[10] = "and I will multiply men upon you, all the house of Israel, even all of it; and the cities shall be inhabited, and the waste places shall be builded;";
yng[10] = "And I have multiplied on you men, All the house of Israel -- all of it, And the cities have been inhabited, And the wastes are built.";
dby[10] = "And I will multiply men upon you, all the house of Israel, the whole of it; and the cities shall be inhabited, and the waste places shall be builded.";
web[10] = "And I will multiply men upon you, all the house of Israel, [even] all of it: and the cities shall be inhabited, and the wastes shall be built.";
hnv[10] = "and I will multiply men on you, all the house of Yisra\'el, even all of it; and the cities shall be inhabited, and the waste places shall be built;";
vul[10] = "et multiplicabo in vobis homines omnemque domum Israhel et habitabuntur civitates et ruinosa instaurabuntur";
kjv[11] = "And I will multiply upon you man and beast; and they shall increase and bring fruit: and I will settle you after your old estates, and will do better [unto you] than at your beginnings: and ye shall know that I [am] the LORD.";
rsv[11] = "and I will multiply upon you man and beast; and they shall increase and be fruitful; and I will cause you to be inhabited as in your former times, and will do more good to you than ever before. Then you will know that I am the LORD.";
asv[11] = "and I will multiply upon you man and beast; and they shall increase and be fruitful; and I will cause you to be inhabited after your former estate, and will do better [unto you] than at your beginnings: and ye shall know that I am Jehovah.";
yng[11] = "And I have multiplied on you man and beast, And they have multiplied and been fruitful, And I have caused you to dwell according to your former states, And I have done better than at your beginnings, And ye have known that I [am] Jehovah.";
dby[11] = "And I will multiply upon you man and beast, and they shall increase and bring forth fruit; and I will cause you to be inhabited as [in] your former times, yea, I will make it better than at your beginnings: and ye shall know that I [am] Jehovah.";
web[11] = "And I will multiply upon you man and beast; and they shall increase and bring fruit: and I will settle you after your old states, and will do better [to you] than at your beginnings: and ye shall know that I [am] the LORD.";
hnv[11] = "and I will multiply on you man and animal; and they shall increase and be fruitful; and I will cause you to be inhabited after your former estate, and will do better [to you] than at your beginnings: and you shall know that I am the LORD.";
vul[11] = "et replebo vos hominibus et iumentis et multiplicabuntur et crescent et habitari vos faciam sicut a principio bonisque donabo maioribus quam habuistis ab initio et scietis quia ego Dominus";
kjv[12] = "Yea, I will cause men to walk upon you, [even] my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave them [of men].";
rsv[12] = "Yea, I will let men walk upon you, even my people Israel; and they shall possess you, and you shall be their inheritance, and you shall no longer bereave them of children.";
asv[12] = "Yea, I will cause men to walk upon you, even my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave them of children.";
yng[12] = "And I have caused man to walk over you, -- My people Israel, And they possess thee, and thou hast been to them for an inheritance, And thou dost add no more to bereave them.";
dby[12] = "And I will cause men to walk upon you, even my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave them of children.";
web[12] = "Yes, I will cause men to walk upon you, [even] my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave them [of men].";
hnv[12] = "Yes, I will cause men to walk on you, even my people Yisra\'el; and they shall possess you, and you shall be their inheritance, and you shall no more henceforth bereave them of children.";
vul[12] = "et adducam super vos homines populum meum Israhel et hereditate possidebunt te et eris eis in hereditatem et non addes ultra ut absque eis sis";
kjv[13] = "Thus saith the Lord GOD; Because they say unto you, Thou [land] devourest up men, and hast bereaved thy nations;";
rsv[13] = "Thus says the Lord GOD: Because men say to you, \'You devour men, and you bereave your nation of children,\'";
asv[13] = "Thus saith the Lord Jehovah: Because they say unto you, Thou [land] art a devourer of men, and hast been a bereaver of thy nation;";
yng[13] = "Thus said the Lord Jehovah: Because they are saying to you: A devourer of men [art] thou, And a bereaver of thy nations thou hast been,";
dby[13] = "Thus saith the Lord Jehovah: Because they say unto you, Thou devourest men, and hast bereaved thy nation,";
web[13] = "Thus saith the Lord GOD; Because they say to you, Thou [land] devourest men, and hast bereaved thy nations;";
hnv[13] = "Thus says the Lord GOD: Because they say to you, You [land] are a devourer of men, and have been a bereaver of your nation;";
vul[13] = "haec dicit Dominus Deus pro eo quod dicunt de vobis devoratrix hominum es et suffocans gentem tuam";
kjv[14] = "Therefore thou shalt devour men no more, neither bereave thy nations any more, saith the Lord GOD.";
rsv[14] = "therefore you shall no longer devour men and no longer bereave your nation of children, says the Lord GOD;";
asv[14] = "therefore thou shalt devour men no more, neither bereave thy nation any more, saith the Lord Jehovah;";
yng[14] = "Therefore, man thou devourest no more, And thy nations thou causest not to stumble any more, An affirmation of the Lord Jehovah.";
dby[14] = "therefore thou shalt devour men no more, neither bereave thy nation any more, saith the Lord Jehovah;";
web[14] = "Therefore thou shalt devour men no more, neither bereave thy nations any more, saith the Lord GOD.";
hnv[14] = "therefore you shall devour men no more, neither bereave your nation any more, says the Lord GOD;";
vul[14] = "propterea homines non comedes amplius et gentem tuam non necabis ultra ait Dominus Deus";
kjv[15] = "Neither will I cause [men] to hear in thee the shame of the heathen any more, neither shalt thou bear the reproach of the people any more, neither shalt thou cause thy nations to fall any more, saith the Lord GOD.";
rsv[15] = "and I will not let you hear any more the reproach of the nations, and you shall no longer bear the disgrace of the peoples and no longer cause your nation to stumble, says the Lord GOD.&quot;";
asv[15] = "neither will I let thee hear any more the shame of the nations, neither shalt thou bear the reproach of the peoples any more, neither shalt thou cause thy nation to stumble any more, saith the Lord Jehovah.";

kjv[23] = "And I will sanctify my great name, which was profaned among the heathen, which ye have profaned in the midst of them; and the heathen shall know that I [am] the LORD, saith the Lord GOD, when I shall be sanctified in you before their eyes.";
