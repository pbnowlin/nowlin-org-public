csb[1] = "The word of the LORD came to me again:";
csb[2] = "&quot;Son of man, confront Jerusalem with her detestable practices.";
csb[3] = "&quot;You are to say, \'This is what the Lord GOD says to Jerusalem: Your origin and your birth were in the land of the Canaanites. Your father was an Amorite and your mother a Hethite.";
csb[4] = "&quot;As for your birth, your umbilical cord wasn\'t cut on the day you were born, and you weren\'t washed clean with water. You were not rubbed with salt or wrapped in cloths.";
csb[5] = "&quot;No one cared enough about you to do even one of these things out of compassion for you. But you were thrown out into the open field because you were despised on the day you were born.";
csb[6] = "&quot; \'I passed by you and saw you thrashing around in your blood, and I said to you as you lay in your blood, &quot;Live! &quot; Yes, I said to you as you lay in your blood, &quot;Live! &quot;";
csb[7] = "I made you thrive like plants of the field. You grew up and matured and became very beautiful. Your breasts were formed and your hair grew, but you were stark naked.";
csb[8] = "&quot; \'Then I passed by you and saw you, and you were indeed at the age for love. So I spread the edge of my garment over you and covered your nakedness. I pledged myself to you, entered into a covenant with you -- this is the declaration of the Lord GOD -- and you became mine.";
csb[9] = "&quot;I washed you with water, rinsed off your blood, and anointed you with oil.";
csb[10] = "&quot;I clothed you in embroidered cloth and provided you with fine leather sandals. I also wrapped you in fine linen and covered you with silk.";
csb[11] = "&quot;I adorned you with jewelry, putting bracelets on your wrists and a necklace around your neck.";
csb[12] = "&quot;I put a ring in your nose, earrings on your ears, and a beautiful crown on your head.";
csb[13] = "&quot;So you were adorned with gold and silver, and your clothing was made of fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil. You became extremely beautiful and attained royalty.";
csb[14] = "&quot;Your fame spread among the nations because of your beauty, for it was perfect through my splendor, which I had bestowed on you. This is the declaration of the Lord GOD.";
csb[15] = "&quot; \'But you trusted in your beauty and acted like a prostitute because of your fame. You lavished your sexual favors on everyone who passed by. Your beauty became his.";
csb[16] = "&quot;You took some of your clothing and made colorful high places for yourself, and you engaged in prostitution on them. These places should not have been built, and this should never have happened!";
csb[17] = "&quot;You also took your beautiful jewelry made from the gold and silver I had given you, and you made male images so that you could engage in prostitution with them.";
csb[18] = "&quot;Then you took your embroidered clothing to cover them and set my oil and incense before them.";
csb[19] = "&quot;The food that I gave you -- the fine flour, oil, and honey that I fed you -- you set it before them as a pleasing aroma. That is what happened. This is the declaration of the Lord GOD.";
csb[20] = "&quot; \'You even took your sons and daughters you bore to me and sacrificed them to these images as food. Wasn\'t your prostitution enough?";
csb[21] = "&quot;You slaughtered my children and gave them up when you passed them through the fire to the images.";
csb[22] = "&quot;In all your detestable practices and acts of prostitution, you did not remember the days of your youth when you were stark naked and thrashing around in your blood.";
csb[23] = "&quot; \'Then after all your evil -- Woe, woe to you! -- the declaration of the Lord GOD --";
csb[24] = "&quot;you built yourself a mound and made yourself an elevated place in every square.";
csb[25] = "&quot;You built your elevated place at the head of every street and turned your beauty into a detestable thing. You spread your legs to everyone who passed by and increased your prostitution.";
csb[26] = "&quot;You engaged in promiscuous acts with Egyptian men, your well-endowed neighbors, and increased your prostitution to anger me.";
csb[27] = "&quot; \'Therefore, I stretched out my hand against you and reduced your provisions. I gave you over to the desire of those who hate you, the Philistine women, who were embarrassed by your indecent conduct.";
csb[28] = "&quot;Then you engaged in prostitution with the Assyrian men because you were not satisfied. Even though you did this with them, you were still not satisfied.";
csb[29] = "&quot;So you extended your prostitution to Chaldea, the land of merchants, but you were not even satisfied with this!";
csb[30] = "&quot; \'How your heart was inflamed with lust -- the declaration of the Lord GOD -- when you did all these things, the acts of a brazen prostitute,";
csb[31] = "&quot;building your mound at the head of every street and making your elevated place in every square. But you were unlike a prostitute because you scorned payment.";
csb[32] = "&quot;You adulterous wife, who receives strangers instead of her husband!";
csb[33] = "&quot;Men give gifts to all prostitutes, but you gave gifts to all your lovers. You bribed them to come to you from all around for your sexual favors.";
csb[34] = "&quot;So you were the opposite of other women in your acts of prostitution; no one solicited you. When you paid a fee instead of one being paid to you, you were the opposite.";
csb[35] = "&quot; \'Therefore, you prostitute, hear the word of the LORD!";
csb[36] = "&quot;This is what the Lord GOD says: Because your lust was poured out and your nakedness exposed by your acts of prostitution with your lovers, and because of all your detestable idols and the blood of your children that you gave to them,";
csb[37] = "&quot;I am therefore going to gather all the lovers you pleased -- all those you loved as well as all those you hated. I will gather them against you from all around and expose your nakedness to them so they see you completely naked.";
csb[38] = "&quot;I will judge you the way adulteresses and those who shed blood are judged. Then I will bring about the shedding of your blood in jealous wrath.";
csb[39] = "&quot;I will hand you over to them, and they will demolish your mounds and tear down your elevated places. They will strip off your clothes, take your beautiful jewelry, and leave you stark naked.";
csb[40] = "&quot;They will bring a mob against you to stone you and to cut you to pieces with their swords.";
csb[41] = "&quot;They will burn your houses and execute judgments against you in the sight of many women. I will stop you from being a prostitute, and you will never again pay fees for lovers.";
csb[42] = "&quot;So I will satisfy my wrath against you, and my jealousy will turn away from you. Then I will be calm and no longer angry.";
csb[43] = "&quot;Because you did not remember the days of your youth but enraged me with all these things, I will also bring your conduct down on your own head. This is the declaration of the Lord GOD. Haven\'t you committed depravity in addition to all your detestable practices?";
csb[44] = "&quot; \'Look, everyone who uses proverbs will quote this proverb about you: &quot;Like mother, like daughter.&quot;";
csb[45] = "You are the daughter of your mother, who despised her husband and children. You are the sister of your sisters, who despised their husbands and children. Your mother was a Hethite and your father an Amorite.";
csb[46] = "Your older sister was Samaria, who lived with her daughters to the north of you, and your younger sister was Sodom, who lived with her daughters to the south of you.";
csb[47] = "Didn\'t you walk in their ways and do their detestable practices? It was only a short time before all your ways were more corrupt than theirs.";
csb[48] = "&quot; \'As I live -- the declaration of the Lord GOD -- your sister Sodom and her daughters have not behaved as you and your daughters have.";
csb[49] = "&quot;Now this was the iniquity of your sister Sodom: She and her daughters had pride, plenty of food, and comfortable security, but didn\'t support the poor and needy.";
csb[50] = "&quot;They were haughty and did detestable acts before me, so I removed them when I saw this.";
csb[51] = "&quot;But Samaria did not commit even half your sins. You have multiplied your detestable practices beyond theirs and made your sisters appear righteous by all the detestable acts you have committed.";
csb[52] = "&quot;You must also bear your disgrace, since you have helped your sisters out. For they appear more righteous than you because of your sins, which you committed more detestably than they did. So you also, be ashamed and bear your disgrace, since you have made your sisters appear righteous.";
csb[53] = "&quot; \'I will restore their fortunes, the fortunes of Sodom and her daughters and those of Samaria and her daughters. I will also restore your fortunes among them,";
csb[54] = "&quot;so you will bear your disgrace and be ashamed of all you did when you comforted them.";
csb[55] = "&quot;As for your sisters, Sodom and her daughters and Samaria and her daughters will return to their former state. You and your daughters will also return to your former state.";
csb[56] = "&quot;Didn\'t you treat your sister Sodom as an object of scorn when you were proud,";
csb[57] = "&quot;before your wickedness was exposed? It was like the time you were scorned by the daughters of Aram and all those around her, and by the daughters of the Philistines -- those who treated you with contempt from every side.";
csb[58] = "&quot;You yourself must bear the consequences of your depravity and detestable practices -- this is the LORD\'s declaration.";
csb[59] = "&quot; \'For this is what the Lord GOD says: I will deal with you according to what you have done, since you have despised the oath by breaking the covenant.";
csb[60] = "&quot;But I will remember the covenant I made with you in the days of your youth, and I will establish a permanent covenant with you.";
csb[61] = "&quot;Then you will remember your ways and be ashamed when you receive your older and younger sisters. I will give them to you as daughters, but not because of your covenant.";
csb[62] = "&quot;I will establish my covenant with you, and you will know that I am the LORD,";
csb[63] = "&quot;so that when I make atonement for all you have done, you will remember and be ashamed, and never open your mouth again because of your disgrace. This is the declaration of the Lord GOD.\' &quot;";

asv[14] = "And thy renown went forth among the nations for thy beauty; for it was perfect, through my majesty which I had put upon thee, saith the Lord Jehovah.";
yng[14] = "And go forth doth thy name among nations, Because of thy beauty -- for it [is] complete, In My honour that I have set upon thee, An affirmation of the Lord Jehovah.";
dby[14] = "And thy fame went forth among the nations for thy beauty; for it was perfect through my magnificence, which I had put upon thee, saith the Lord Jehovah.";
web[14] = "And thy renown went forth among the heathen for thy beauty: for it [was] perfect through my comeliness, which I had put upon thee, saith the Lord GOD.";
hnv[14] = "Your renown went forth among the nations for your beauty; for it was perfect, through my majesty which I had put on you, says the Lord GOD.";
vul[14] = "et egressum est nomen tuum in gentes propter speciem tuam quia perfecta eras in decore meo quem posueram super te dicit Dominus Deus";
kjv[15] = "But thou didst trust in thine own beauty, and playedst the harlot because of thy renown, and pouredst out thy fornications on every one that passed by; his it was.";
rsv[15] = "&quot;But you trusted in your beauty, and played the harlot because of your renown, and lavished your harlotries on any passer-by.";
asv[15] = "But thou didst trust in thy beauty, and playedst the harlot because of thy renown, and pouredst out thy whoredoms on every one that passed by; his it was.";
yng[15] = "And thou dost trust in thy beauty, And goest a-whoring because of thy renown, And dost pour out thy whoredoms On every passer by -- to him it is.";
dby[15] = "But thou didst confide in thy beauty, and playedst the harlot because of thy renown, and pouredst out thy whoredoms on every one that passed by: his it was.";
web[15] = "But thou didst trust in thy own beauty, and playedst the harlot because of thy renown, and pouredst out thy fornications on every one that passed by; his it was.";
hnv[15] = " But you did trust in your beauty, and played the prostitute because of your renown, and poured out your prostitution on everyone who passed by; his it was.";
vul[15] = "et habens fiduciam in pulchritudine tua fornicata es in nomine tuo et exposuisti fornicationem tuam omni transeunti ut eius fieres";
kjv[16] = "And of thy garments thou didst take, and deckedst thy high places with divers colours, and playedst the harlot thereupon: [the like things] shall not come, neither shall it be [so].";
rsv[16] = "You took some of your garments, and made for yourself gaily decked shrines, and on them played the harlot; the like has never been, nor ever shall be.";
asv[16] = "And thou didst take of thy garments, and madest for thee high places decked with divers colors, and playedst the harlot upon them: [the like things] shall not come, neither shall it be [so].";
yng[16] = "And thou dost take of thy garments, And dost make to thee spotted high-places, And dost go a-whoring upon them, They are not coming in -- nor shall it be!";
dby[16] = "And of thy garments thou didst take, and madest for thyself high places decked with divers colours, and didst play the harlot thereupon: [the like] hath not come to pass, and shall be no more.";
web[16] = "And of thy garments thou didst take, and deck thy high places with divers colors, and play the harlot upon them: [the like things] shall not come, neither shall it be [so].";
hnv[16] = "You took of your garments, and made for yourselves high places decked with various colors, and played the prostitute on them: [the like things] shall not come, neither shall it be [so].";
vul[16] = "et sumens de vestimentis meis fecisti tibi excelsa hinc inde consuta et fornicata es super eis sicut non est factum neque futurum est";
kjv[17] = "Thou hast also taken thy fair jewels of my gold and of my silver, which I had given thee, and madest to thyself images of men, and didst commit whoredom with them,";
rsv[17] = "You also took your fair jewels of my gold and of my silver, which I had given you, and made for yourself images of men, and with them played the harlot;";
asv[17] = "Thou didst also take thy fair jewels of my gold and of my silver, which I had given thee, and madest for thee images of men, and didst play the harlot with them;";
yng[17] = "And thou dost take thy beauteous vessels Of My gold and My silver that I gave to thee, And dost make to thee images of a male, And dost go a-whoring with them,";
dby[17] = "And thou didst take thy fair jewels of my gold and of my silver, which I had given thee, and madest to thyself images of males, and didst commit fornication with them.";
web[17] = "Thou hast also taken thy fair jewels of my gold and of my silver, which I had given thee, and hast made to thyself images of men, and hast committed lewdness with them.";
hnv[17] = "You also took your beautiful jewels of my gold and of my silver, which I had given you, and made for yourself images of men, and played the prostitute with them;";
vul[17] = "et tulisti vasa decoris tui de auro meo et argento meo quae dedi tibi et fecisti tibi imagines masculinas et fornicata es in eis";
kjv[18] = "And tookest thy broidered garments, and coveredst them: and thou hast set mine oil and mine incense before them.";
rsv[18] = "and you took your embroidered garments to cover them, and set my oil and my incense before them.";
asv[18] = "and thou tookest thy broidered garments, and coveredst them, and didst set mine oil and mine incense before them.";
yng[18] = "And dost take the garments of thy embroidery, And thou dost cover them, And My oil and My perfume thou hast set before them.";
dby[18] = "And thou tookest thine embroidered garments, and coveredst them; and thou didst set mine oil and mine incense before them.";
web[18] = "And hast taken thy broidered garments, and covered them: and thou hast set my oil and my incense before them.";
hnv[18] = "and you took your embroidered garments, and covered them, and did set my oil and my incense before them.";
vul[18] = "et sumpsisti vestimenta tua multicoloria et vestita es eis et oleum meum et thymiama meum posuisti coram eis";
kjv[19] = "My meat also which I gave thee, fine flour, and oil, and honey, [wherewith] I fed thee, thou hast even set it before them for a sweet savour: and [thus] it was, saith the Lord GOD.";
rsv[19] = "Also my bread which I gave you--I fed you with fine flour and oil and honey--you set before them for a pleasing odor, says the Lord GOD.";
asv[19] = "My bread also which I gave thee, fine flour, and oil, and honey, wherewith I fed thee, thou didst even set it before them for a sweet savor; and [thus] it was, saith the Lord Jehovah.";
yng[19] = "And My bread, that I gave to thee, Fine flour, and oil, and honey, that I caused thee to eat. Thou hast even set it before them, For a sweet fragrance -- thus it is, An affirmation of the Lord Jehovah.";
dby[19] = "And my bread which I had given thee, the fine flour and the oil and the honey wherewith I fed thee, thou didst even set it before them for a sweet savour: thus it was, saith the Lord Jehovah.";
web[19] = "My provisions also which I gave thee, fine flour, and oil, and honey, [with which] I fed thee, thou hast even set before them for a sweet savor: and [thus] it was, saith the Lord GOD.";
hnv[19] = "My bread also which I gave you, fine flour, and oil, and honey, with which I fed you, you did even set it before them for a sweet savor; and [thus] it was, says the Lord GOD.";
vul[19] = "et panem meum quem dedi tibi similam et oleum et mel quibus enutrivi te posuisti in conspectu eorum in odorem suavitatis et factum est ait Dominus Deus";
kjv[20] = "Moreover thou hast taken thy sons and thy daughters, whom thou hast borne unto me, and these hast thou sacrificed unto them to be devoured. [Is this] of thy whoredoms a small matter,";
rsv[20] = "And you took your sons and your daughters, whom you had borne to me, and these you sacrificed to them to be devoured. Were your harlotries so small a matter";
asv[20] = "Moreover thou hast taken thy sons and thy daughters, whom thou hast borne unto me, and these hast thou sacrificed unto them to be devoured. Were thy whoredoms a small matter,";
yng[20] = "And thou dost take thy sons and thy daughters Whom thou hast born to Me, And dost sacrifice them to them for food. Is it a little thing because of thy whoredoms,";
dby[20] = "And thou didst take thy sons and thy daughters, whom thou hadst borne unto me, and these didst thou sacrifice unto them, to be devoured. Were thy whoredoms a small matter,";
web[20] = "Moreover thou hast taken thy sons and thy daughters, whom thou hast borne to me, and these hast thou sacrificed to them to be devoured. [Is this] of thy lewdness a small matter,";
hnv[20] = "Moreover you have taken your sons and your daughters, whom you have borne to me, and these have you sacrificed to them to be devoured. Were your prostitution a small matter,";
vul[20] = "et tulisti filios tuos et filias tuas quas generasti mihi et immolasti eis ad devorandum numquid parva est fornicatio tua";
kjv[21] = "That thou hast slain my children, and delivered them to cause them to pass through [the fire] for them?";
rsv[21] = "that you slaughtered my children and delivered them up as an offering by fire to them?";
asv[21] = "that thou hast slain my children, and delivered them up, in causing them to pass through [the fire] unto them?";
yng[21] = "That thou dost slaughter My sons, And dost give them up in causing them to pass over to them?";
dby[21] = "that thou didst slay my children and give them up in passing them over to them?";
web[21] = "That thou hast slain my children, and delivered them to cause them to pass through [the fire] for them?";
hnv[21] = "that you have slain my children, and delivered them up, in causing them to pass through [the fire] to them?";
vul[21] = "immolantis filios meos et dedisti illos consecrans eis";
kjv[22] = "And in all thine abominations and thy whoredoms thou hast not remembered the days of thy youth, when thou wast naked and bare, [and] wast polluted in thy blood.";
rsv[22] = "And in all your abominations and your harlotries you did not remember the days of your youth, when you were naked and bare, weltering in your blood.";
asv[22] = "And in all thine abominations and thy whoredoms thou hast not remembered the days of thy youth, when thou wast naked and bare, and wast weltering in thy blood.";
yng[22] = "And with all thine abominations and thy whoredoms, Thou hast not remembered the days of thy youth, When thou wast naked and bare, Trodden down in thy blood thou wast!";
dby[22] = "And in all thine abominations and thy whoredoms thou hast not remembered the days of thy youth, when thou wast naked and bare, when thou wast weltering in thy blood.";
web[22] = "And in all thy abominations and thy deeds of lewdness thou hast not remembered the days of thy youth, when thou wast naked and bare, [and] wast polluted in thy blood.";
hnv[22] = "In all your abominations and your prostitution you have not remembered the days of your youth, when you were naked and bare, and was weltering in your blood.";
vul[22] = "et post omnes abominationes tuas et fornicationes non es recordata dierum adulescentiae tuae quando eras nuda et confusione plena conculcata in sanguine tuo";
kjv[23] = "And it came to pass after all thy wickedness, (woe, woe unto thee! saith the Lord GOD;)";
rsv[23] = "&quot;And after all your wickedness (woe, woe to you! says the Lord GOD),";
asv[23] = "And it is come to pass after all thy wickedness (woe, woe unto thee! saith the Lord Jehovah),";
yng[23] = "And it cometh to pass, after all thy wickedness, (Wo, wo, to thee -- an affirmation of the Lord Jehovah),";
dby[23] = "And it came to pass after all thy wickedness (woe, woe unto thee! saith the Lord Jehovah),";
web[23] = "And it came to pass after all thy wickedness, (woe, woe to thee! saith the Lord GOD;)";
hnv[23] = "It is happen after all your wickedness, (woe, woe to you! says the Lord GOD,)";
vul[23] = "et accidit post omnem malitiam tuam vae vae tibi ait Dominus Deus";
kjv[24] = "[That] thou hast also built unto thee an eminent place, and hast made thee an high place in every street.";
rsv[24] = "you built yourself a vaulted chamber, and made yourself a lofty place in every square;";
asv[24] = "that thou hast built unto thee a vaulted place, and hast made thee a lofty place in every street.";
yng[24] = "That thou dost build to thee an arch, And dost make to thee a high place in every broad place.";
dby[24] = "that thou didst also build unto thee a place of debauchery, and didst make thee a high place in every street:";
web[24] = "[That] thou hast also built to thee an eminent place, and hast made thee a high place in every street.";
hnv[24] = "that you have built to you a vaulted place, and have made you a lofty place in every street.";
vul[24] = "et aedificasti tibi lupanar et fecisti tibi prostibulum in cunctis plateis";
kjv[25] = "Thou hast built thy high place at every head of the way, and hast made thy beauty to be abhorred, and hast opened thy feet to every one that passed by, and multiplied thy whoredoms.";
rsv[25] = "at the head of every street you built your lofty place and prostituted your beauty, offering yourself to any passer-by, and multiplying your harlotry.";
asv[25] = "Thou hast built thy lofty place at the head of every way, and hast made thy beauty an abomination, and hast opened thy feet to every one that passed by, and multiplied thy whoredom.";
yng[25] = "At every head of the way thou hast built thy high place, And thou dost make thy beauty abominable, And dost open wide thy feet to every passer by, And dost multiply thy whoredoms,";
dby[25] = "thou didst build thy high place at every head of the way, and madest thy beauty to be abhorred, and thou didst open thy feet to every one that passed by, and multiply thy whoredom.";
web[25] = "Thou hast built thy high place at every head of the way, and hast made thy beauty to be abhorred, and hast prostituted thyself to every one that passed by, and multiplied thy lewd deeds.";
hnv[25] = "You have built your lofty place at the head of every way, and have made your beauty an abomination, and have opened your feet to everyone who passed by, and multiplied your prostitution.";
vul[25] = "ad omne caput viae aedificasti signum prostitutionis tuae et abominabilem fecisti decorem tuum et divisisti pedes tuos omni transeunti et multiplicasti fornicationes tuas";
kjv[26] = "Thou hast also committed fornication with the Egyptians thy neighbours, great of flesh; and hast increased thy whoredoms, to provoke me to anger.";
rsv[26] = "You also played the harlot with the Egyptians, your lustful neighbors, multiplying your harlotry, to provoke me to anger.";
asv[26] = "Thou hast also committed fornication with the Egyptians, thy neighbors, great of flesh; and hast multiplied thy whoredom, to provoke me to anger.";
yng[26] = "And dost go a-whoring unto sons of Egypt, Thy neighbours -- great of appetite! And thou dost multiply thy whoredoms, To provoke Me to anger.";
dby[26] = "And thou didst commit fornication with the Egyptians thy neighbours, great of flesh; and didst multiply thy whoredom to provoke me to anger.";
web[26] = "Thou hast also committed fornication with the Egyptians thy neighbors, great of flesh; and hast multiplied thy lewd deeds, to provoke me to anger.";
hnv[26] = "You have also committed sexual immorality with the Mitzrim, your neighbors, great of flesh; and have multiplied your prostitution, to provoke me to anger.";
vul[26] = "et fornicata es cum filiis Aegypti vicinis tuis magnarum carnium et multiplicasti fornicationem tuam ad inritandum me";
kjv[27] = "Behold, therefore I have stretched out my hand over thee, and have diminished thine ordinary [food], and delivered thee unto the will of them that hate thee, the daughters of the Philistines, which are ashamed of thy lewd way.";
rsv[27] = "Behold, therefore, I stretched out my hand against you, and diminished your allotted portion, and delivered you to the greed of your enemies, the daughters of the Philistines, who were ashamed of your lewd behavior.";
asv[27] = "Behold therefore, I have stretched out my hand over thee, and have diminished thine ordinary [food], and delivered thee unto the will of them that hate thee, the daughters of the Philistines, that are ashamed of thy lewd way.";
yng[27] = "And lo, I have stretched out My hand against thee, And I diminish thy portion, And give thee to the desire of those hating thee, The daughters of the Philistines, Who are ashamed of thy wicked way.";
dby[27] = "And behold, I stretched out my hand over thee, and diminished thine appointed portion; and I gave thee over unto the will of them that hate thee, the daughters of the Philistines, who were confounded at thy lewd way.";
web[27] = "Behold, therefore I have stretched out my hand over thee, and have diminished thy ordinary [food], and delivered thee to the will of them that hate thee, the daughters of the Philistines, who are ashamed of thy lewd way.";
hnv[27] = "See therefore, I have stretched out my hand over you, and have diminished your ordinary [food], and delivered you to the will of those who hate you, the daughters of the Pelishtim, who are ashamed of your lewd way.";
vul[27] = "ecce ego extendi manum meam super te et auferam ius tuum et dabo te in animam odientium te filiarum Palestinarum quae erubescunt in via tua scelerata";
kjv[28] = "Thou hast played the whore also with the Assyrians, because thou wast unsatiable; yea, thou hast played the harlot with them, and yet couldest not be satisfied.";
rsv[28] = "You played the harlot also with the Assyrians, because you were insatiable; yea, you played the harlot with them, and still you were not satisfied.";
asv[28] = "Thou hast played the harlot also with the Assyrians, because thou wast insatiable; yea, thou hast played the harlot with them, and yet thou wast not satisfied.";
yng[28] = "And thou goest a-whoring unto sons of Asshur, Without thy being satisfied, And thou dost go a-whoring with them, And also -- thou hast not been satisfied.";
dby[28] = "And thou didst commit fornication with the Assyrians, because thou wast insatiable; yea, thou didst commit fornication with them, and yet couldest not be satisfied.";
web[28] = "Thou hast played the harlot also with the Assyrians, because thou wast insatiable; yes, thou hast played the harlot with them, and yet couldst not be satisfied.";
hnv[28] = "You have played the prostitute also with the Ashshur, because you were insatiable; yes, you have played the prostitute with them, and yet you weren\'t satisfied.";
vul[28] = "et fornicata es in filiis Assyriorum eo quod necdum fueris expleta et postquam fornicata es nec sic es satiata";
kjv[29] = "Thou hast moreover multiplied thy fornication in the land of Canaan unto Chaldea; and yet thou wast not satisfied herewith.";
rsv[29] = "You multiplied your harlotry also with the trading land of Chalde\'a; and even with this you were not satisfied.";
asv[29] = "Thou hast moreover multiplied thy whoredom unto the land of traffic, unto Chaldea; and yet thou wast not satisfied herewith.";
yng[29] = "And thou dost multiply thy whoredoms On the land of Canaan -- toward Chaldea, And even with this thou hast not been satisfied.";
dby[29] = "And thou didst multiply thy whoredom with the land of merchants, Chaldea, and yet thou wast not satisfied herewith.";
web[29] = "Thou hast moreover multiplied thy fornication in the land of Canaan to Chaldea; and yet with this thou wast not satisfied.";
hnv[29] = "You have moreover multiplied your prostitution to the land of merchants, to Kasdim; and yet you weren\'t satisfied with this.";
vul[29] = "et multiplicasti fornicationem tuam in terra Chanaan cum Chaldeis et nec sic satiata es";
kjv[30] = "How weak is thine heart, saith the Lord GOD, seeing thou doest all these [things], the work of an imperious whorish woman;";
rsv[30] = "&quot;How lovesick is your heart, says the Lord GOD, seeing you did all these things, the deeds of a brazen harlot;";
asv[30] = "How weak is thy heart, saith the Lord Jehovah, seeing thou doest all these things, the work of an impudent harlot;";
yng[30] = "How weak [is] thy heart, An affirmation of the Lord Jehovah, In thy doing all these, The work of a domineering whorish woman.";
dby[30] = "How weak is thy heart, saith the Lord Jehovah, seeing thou doest all these [things], the work of a whorish woman, under no restraint;";
web[30] = "How weak is thy heart, saith the Lord GOD, seeing thou doest all these [things], the work of an imperious lewd woman;";
hnv[30] = " How weak is your heart, says the Lord GOD, seeing you do all these things, the work of an impudent prostitute;";
vul[30] = "in quo mundabo cor tuum ait Dominus Deus cum facias omnia haec opera mulieris meretricis et procacis";
kjv[31] = "In that thou buildest thine eminent place in the head of every way, and makest thine high place in every street; and hast not been as an harlot, in that thou scornest hire;";
rsv[31] = "building your vaulted chamber at the head of every street, and making your lofty place in every square. Yet you were not like a harlot, because you scorned hire.";
asv[31] = "in that thou buildest thy vaulted place at the head of every way, and makest thy lofty place in every street, and hast not been as a harlot, in that thou scornest hire.";
yng[31] = "In thy building thine arch at the head of every way, Thy high place thou hast made in every broad place, And -- hast not been as a whore deriding a gift.";
dby[31] = "in that thou buildest thy place of debauchery at the head of every way, and makest thy high place in every street! And thou hast not been as a harlot, in that thou scornest reward,";
web[31] = "In that thou buildest thy eminent place in the head of every way, and makest thy high place in every street; and hast not been as a harlot, in that thou scornest hire;";
hnv[31] = "in that you build your vaulted place at the head of every way, and make your lofty place in every street, and have not been as a prostitute, in that you scorn pay.";
vul[31] = "quia fabricasti lupanar tuum in capite omnis viae et excelsum tuum fecisti in omni platea nec facta es quasi meretrix fastidio augens pretium";
kjv[32] = "[But as] a wife that committeth adultery, [which] taketh strangers instead of her husband!";
rsv[32] = "Adulterous wife, who receives strangers instead of her husband!";
asv[32] = "A wife that committeth adultery! that taketh strangers instead of her husband!";
yng[32] = "The wife who committeth adultery -- Under her husband -- doth receive strangers.";
dby[32] = "O adulterous wife, that taketh strangers instead of her husband.";
web[32] = "[But as] a wife that committeth adultery, [who] taketh strangers instead of her husband!";
hnv[32] = "A wife who commits adultery! who takes strangers instead of her husband!";
vul[32] = "sed quasi mulier adultera quae super virum suum inducit alienos";
kjv[33] = "They give gifts to all whores: but thou givest thy gifts to all thy lovers, and hirest them, that they may come unto thee on every side for thy whoredom.";
rsv[33] = "Men give gifts to all harlots; but you gave your gifts to all your lovers, bribing them to come to you from every side for your harlotries.";
asv[33] = "They give gifts to all harlots; but thou givest thy gifts to all thy lovers, and bribest them, that they may come unto thee on every side for thy whoredoms.";
yng[33] = "To all whores they give a gift, And -- thou hast given thy gifts to all thy lovers, And dost bribe them to come in unto thee, From round about -- in thy whoredoms.";
dby[33] = "They give rewards to all harlots; but thou gavest thy rewards to all thy lovers, and rewardedst them, that they might come unto thee on every side for thy whoredoms.";
web[33] = "They give gifts to all lewd women: but thou givest thy gifts to all thy lovers, and hirest them, that they may come to thee on every side for thy lewdness.";
hnv[33] = "They give gifts to all prostitutes; but you give your gifts to all your lovers, and bribe them, that they may come to you on every side for your prostitution.";
vul[33] = "omnibus meretricibus dantur mercedes tu autem dedisti mercedes cunctis amatoribus tuis et donabas eis ut intrarent ad te undique ad fornicandum tecum";
kjv[34] = "And the contrary is in thee from [other] women in thy whoredoms, whereas none followeth thee to commit whoredoms: and in that thou givest a reward, and no reward is given unto thee, therefore thou art contrary.";
rsv[34] = "So you were different from other women in your harlotries: none solicited you to play the harlot; and you gave hire, while no hire was given to you; therefore you were different.";
asv[34] = "And thou art different from [other] women in thy whoredoms, in that none followeth thee to play the harlot; and whereas thou givest hire, and no hire is given unto thee, therefore thou art different.";
yng[34] = "And the contrary is in thee from women in thy whoredoms, That after thee none doth go a-whoring; And in thy giving a gift, And a gift hath not been given to thee; And thou art become contrary.";
dby[34] = "And in thee is the contrary from [other] women, in thy whoredoms, in that none followeth thee to commit fornication; and whereas thou givest a reward, and no reward is given unto thee, so art thou contrary.";
web[34] = "And the contrary is in thee from [other] women in thy unlawful commerce, whereas none followeth thee to commit lewdness: and in that thou givest a reward, and no reward is given to thee, therefore thou art contrary.";
hnv[34] = "You are different from [other] women in your prostitution, in that none follows you to play the prostitute; and whereas you give hire, and no hire is given to you, therefore you are different.";
vul[34] = "factumque in te est contra consuetudinem mulierum in fornicationibus tuis et post te non erit fornicatio in eo enim quod dedisti mercedes et mercedes non accepisti factum est in te contrarium";
kjv[35] = "Wherefore, O harlot, hear the word of the LORD:";
rsv[35] = "&quot;Wherefore, O harlot, hear the word of the LORD:";
asv[35] = "Wherefore, O harlot, hear the word of Jehovah:";
yng[35] = "Therefore, O whore, hear a word of Jehovah,";
dby[35] = "Therefore, O harlot, hear the word of Jehovah.";
web[35] = "Wherefore, O harlot, hear the word of the LORD:";
hnv[35] = "Therefore, prostitute, hear the word of the LORD:";
vul[35] = "propterea meretrix audi verbum Domini";
kjv[36] = "Thus saith the Lord GOD; Because thy filthiness was poured out, and thy nakedness discovered through thy whoredoms with thy lovers, and with all the idols of thy abominations, and by the blood of thy children, which thou didst give unto them;";
rsv[36] = "Thus says the Lord GOD, Because your shame was laid bare and your nakedness uncovered in your harlotries with your lovers, and because of all your idols, and because of the blood of your children that you gave to them,";
asv[36] = "Thus saith the Lord Jehovah, Because thy filthiness was poured out, and thy nakedness uncovered through thy whoredoms with thy lovers; and because of all the idols of thy abominations, and for the blood of thy children, that thou didst give unto them;";
yng[36] = "Thus said the Lord Jehovah: Because of thy brass being poured forth, And thy nakedness is revealed in thy whoredoms near thy lovers, And near all the idols of thy abominations, And according to the blood of thy sons, Whom thou hast given to them;";
dby[36] = "Thus saith the Lord Jehovah: Because thy money hath been poured out, and thy nakedness discovered through thy fornications with thy lovers, and with all the idols of thine abominations, and because of the blood of thy children which thou didst give unto them;";
web[36] = "Thus saith the Lord GOD; Because thy filthiness was poured out, and thy nakedness exposed through thy carnal connection with thy lovers, and with all the idols of thy abominations, and by the blood of thy children, which thou didst give to them;";
hnv[36] = "Thus says the Lord GOD, Because your filthiness was poured out, and your nakedness uncovered through your prostitution with your lovers; and because of all the idols of your abominations, and for the blood of your children, that you gave to them;";
vul[36] = "haec dicit Dominus Deus quia effusum est aes tuum et revelata est ignominia tua in fornicationibus tuis super amatores tuos et super idola abominationum tuarum in sanguine filiorum tuorum quos dedisti eis";
kjv[37] = "Behold, therefore I will gather all thy lovers, with whom thou hast taken pleasure, and all [them] that thou hast loved, with all [them] that thou hast hated; I will even gather them round about against thee, and will discover thy nakedness unto them, that they may see all thy nakedness.";
rsv[37] = "therefore, behold, I will gather all your lovers, with whom you took pleasure, all those you loved and all those you loathed; I will gather them against you from every side, and will uncover your nakedness to them, that they may see all your nakedness.";
asv[37] = "therefore behold, I will gather all thy lovers, with whom thou hast taken pleasure, and all them that thou hast loved, with all them that thou hast hated; I will even gather them against thee on every side, and will uncover thy nakedness unto them, that they may see all thy nakedness.";
yng[37] = "Therefore, lo, I am assembling all thy lovers, To whom thou hast been sweet, And all whom thou hast loved, Besides all whom thou hast hated; And I have assembled them by thee round about, And have revealed thy nakedness to them, And they have seen all thy nakedness.";
dby[37] = "therefore, behold, I will gather all thy lovers with whom thou hast taken pleasure, and all that thou hast loved, with all that thou hast hated, -- I will even gather them round about against thee, and will discover thy nakedness unto them, that they may see all thy nakedness.";
web[37] = "Behold therefore, I will gather all thy lovers, with whom thou hast taken pleasure, and all [them] that thou hast loved, with all [them] that thou hast hated; I will even gather them on every side against thee, and will uncover thy nakedness to them, that they may see all thy nakedness.";
hnv[37] = "therefore see, I will gather all your lovers, with whom you have taken pleasure, and all those who you have loved, with all those who you have hated; I will even gather them against you on every side, and will uncover your nakedness to them, that they may see all your nakedness.";
vul[37] = "ecce ego congregabo omnes amatores tuos quibus commixta es et omnes quos dilexisti cum universis quos oderas et congregabo eos super te undique et nudabo ignominiam tuam coram eis et videbunt omnem turpitudinem tuam";
kjv[38] = "And I will judge thee, as women that break wedlock and shed blood are judged; and I will give thee blood in fury and jealousy.";
rsv[38] = "And I will judge you as women who break wedlock and shed blood are judged, and bring upon you the blood of wrath and jealousy.";
asv[38] = "And I will judge thee, as women that break wedlock and shed blood are judged; and I will bring upon thee the blood of wrath and jealousy.";
yng[38] = "And I have judged thee -- judgments of adultresses, And of women shedding blood, And have given thee blood, fury, and jealousy.";
dby[38] = "And I will judge thee with the judgments of women that commit adultery and shed blood; and I will give thee up to the blood of fury and jealousy;";
web[38] = "And I will judge thee, as women that break wedlock and shed blood are judged; and I will give thee blood in fury and jealousy.";
hnv[38] = "I will judge you, as women who break wedlock and shed blood are judged; and I will bring on you the blood of wrath and jealousy.";
vul[38] = "et iudicabo te iudiciis adulterarum et effundentium sanguinem et dabo te in sanguinem furoris et zeli";
kjv[39] = "And I will also give thee into their hand, and they shall throw down thine eminent place, and shall break down thy high places: they shall strip thee also of thy clothes, and shall take thy fair jewels, and leave thee naked and bare.";
rsv[39] = "And I will give you into the hand of your lovers, and they shall throw down your vaulted chamber and break down your lofty places; they shall strip you of your clothes and take your fair jewels, and leave you naked and bare.";
asv[39] = "I will also give thee into their hand, and they shall throw down thy vaulted place, and break down thy lofty places; and they shall strip thee of thy clothes, and take thy fair jewels; and they shall leave thee naked and bare.";
yng[39] = "And I have given thee into their hand, And they have thrown down thine arch, And they have broken down thy high places, And they have stript thee of thy garments, And they have taken thy beauteous vessels, And they have left thee naked and bare.";
dby[39] = "and I will give thee into their hand, and they shall throw down thy place of debauchery, and shall break down thy high places; and they shall strip thee of thy garments, and shall take thy fair jewels, and leave thee naked and bare.";
web[39] = "And I will also give thee into their hand, and they shall throw down thy eminent place, and shall break down thy high places: they shall strip thee also of thy clothes, and shall take thy fair jewels, and leave thee naked and bare.";
hnv[39] = "I will also give you into their hand, and they shall throw down your vaulted place, and break down your lofty places; and they shall strip you of your clothes, and take your beautiful jewels; and they shall leave you naked and bare.";
vul[39] = "et dabo te in manus eorum et destruent lupanar tuum et demolientur prostibulum tuum et denudabunt te vestimentis tuis et auferent vasa decoris tui et derelinquent te nudam plenamque ignominia";
kjv[40] = "They shall also bring up a company against thee, and they shall stone thee with stones, and thrust thee through with their swords.";
rsv[40] = "They shall bring up a host against you, and they shall stone you and cut you to pieces with their swords.";
asv[40] = "They shall also bring up a company against thee, and they shall stone thee with stones, and thrust thee through with their swords.";
yng[40] = "And have caused an assembly to come up against thee, And stoned thee with stones, And thrust thee through with their swords,";
dby[40] = "And they shall bring up an assemblage against thee, and they shall stone thee with stones, and thrust thee through with their swords.";
web[40] = "They shall also bring up a company against thee, and they shall stone thee with stones, and thrust thee through with their swords.";
hnv[40] = "They shall also bring up a company against you, and they shall stone you with stones, and thrust you through with their swords.";
vul[40] = "et adducent super te multitudinem et lapidabunt te lapidibus et trucidabunt te gladiis suis";
kjv[41] = "And they shall burn thine houses with fire, and execute judgments upon thee in the sight of many women: and I will cause thee to cease from playing the harlot, and thou also shalt give no hire any more.";
rsv[41] = "And they shall burn your houses and execute judgments upon you in the sight of many women; I will make you stop playing the harlot, and you shall also give hire no more.";
asv[41] = "And they shall burn thy houses with fire, and execute judgments upon thee in the sight of many women; and I will cause thee to cease from playing the harlot, and thou shalt also give no hire any more.";
yng[41] = "And burnt thy houses with fire, And done in thee judgments before the eyes of many women, And I have caused thee to cease from going a-whoring, And also a gift thou givest no more.";
dby[41] = "And they shall burn thy houses with fire, and execute judgments upon thee in the sight of many women; and I will cause thee to cease from being a harlot, and thou also shalt give no more any reward.";
web[41] = "And they shall burn thy houses with fire, and execute judgments upon thee in the sight of many women: and I will cause thee to cease from playing the harlot, and thou also shalt give no hire any more.";
hnv[41] = "They shall burn your houses with fire, and execute judgments on you in the sight of many women; and I will cause you to cease from playing the prostitute, and you shall also give no hire any more.";
vul[41] = "et conburent domos tuas igni et facient in te iudicia in oculis mulierum plurimarum et desines fornicari et mercedes ultra non dabis";
kjv[42] = "So will I make my fury toward thee to rest, and my jealousy shall depart from thee, and I will be quiet, and will be no more angry.";
rsv[42] = "So will I satisfy my fury on you, and my jealousy shall depart from you; I will be calm, and will no more be angry.";
asv[42] = "So will I cause my wrath toward thee to rest, and my jealousy shall depart from thee, and I will be quiet, and will be no more angry.";
yng[42] = "And I have caused My fury against thee to rest, And My jealousy hath turned aside from thee, And I have been quiet, and I am not angry any more.";
dby[42] = "And I will appease my fury against thee, and my jealousy shall depart from thee; and I will be quiet, and will be no more angry.";
web[42] = "So will I make my fury towards thee to rest, and my jealousy shall depart from thee, and I will be quiet, and will be no more angry.";
hnv[42] = "So will I cause my wrath toward you to rest, and my jealousy shall depart from you, and I will be quiet, and will be no more angry.";
vul[42] = "et requiescet indignatio mea in te et auferetur zelus meus a te et quiescam nec irascar amplius";
kjv[43] = "Because thou hast not remembered the days of thy youth, but hast fretted me in all these [things]; behold, therefore I also will recompense thy way upon [thine] head, saith the Lord GOD: and thou shalt not commit this lewdness above all thine abominations.";
rsv[43] = "Because you have not remembered the days of your youth, but have enraged me with all these things; therefore, behold, I will requite your deeds upon your head, says the Lord GOD. &quot;Have you not committed lewdness in addition to all your abominations?";
asv[43] = "Because thou hast not remembered the days of thy youth, but hast raged against me in all these things; therefore, behold, I also will bring thy way upon thy head, saith the Lord Jehovah: and thou shalt not commit this lewdness with all thine abominations.";
yng[43] = "Because thou hast not remembered the days of thy youth, And dost give trouble to Me in all these, Lo, even I also thy way at first gave up, An affirmation of the Lord Jehovah, And I did not this thought for all thine abominations.";
dby[43] = "Because thou hast not remembered the days of thy youth, but hast raged against me in all these [things], behold, therefore, I also will recompense thy way upon [thy] head, saith the Lord Jehovah, and thou shalt not commit this lewdness besides all thine abominations.";
web[43] = "Because thou hast not remembered the days of thy youth, but hast provoked me in all these [things]; behold therefore, I also will recompense thy way upon [thy] head, saith the Lord GOD: and thou shalt not commit this lewdness above all thy abominations.";
hnv[43] = "Because you have not remembered the days of your youth, but have raged against me in all these things; therefore, behold, I also will bring your way on your head, says the Lord GOD: and you shall not commit this lewdness with all your abominations.";
vul[43] = "eo quod non fueris recordata dierum adulescentiae tuae et provocasti me in omnibus his quapropter et ego vias tuas in capite tuo dedi ait Dominus Deus et non feci iuxta scelera tua in omnibus abominationibus tuis";
kjv[44] = "Behold, every one that useth proverbs shall use [this] proverb against thee, saying, As [is] the mother, [so is] her daughter.";
rsv[44] = "Behold, every one who uses proverbs will use this proverb about you, \'Like mother, like daughter.\'";
asv[44] = "Behold, every one that useth proverbs shall use [this] proverb against thee, saying, As is the mother, so is her daughter.";
yng[44] = "Lo, every one using a simile, Doth use a simile concerning thee, saying: As the mother -- her daughter!";
dby[44] = "Behold, every one that useth proverbs shall speak in a proverb against thee, saying, As the mother, [so is] her daughter!";
web[44] = "Behold, every one that useth proverbs shall use [this] proverb against thee, saying, As [is] the mother, [so is] her daughter.";
hnv[44] = "Behold, everyone who uses proverbs shall use [this] proverb against you, saying, As is the mother, so is her daughter.";
vul[44] = "ecce omnis qui dicit vulgo proverbium in te adsumet illud dicens sicut mater ita et filia eius";
kjv[45] = "Thou [art] thy mother\'s daughter, that lotheth her husband and her children; and thou [art] the sister of thy sisters, which lothed their husbands and their children: your mother [was] an Hittite, and your father an Amorite.";
rsv[45] = "You are the daughter of your mother, who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite and your father an Amorite.";
asv[45] = "Thou art the daughter of thy mother, that loatheth her husband and her children; and thou art the sister of thy sisters, who loathed their husbands and their children: your mother was a Hittite, and your father an Amorite.";
yng[45] = "Thy mother\'s daughter thou [art], Loathing her husband and her sons, And thy sisters\' sister thou [art], Who loathed their husbands and their sons, Your mother [is] a Hittite, and your father an Amorite.";
dby[45] = "Thou art the daughter of thy mother that loathed her husband and her children; and thou art the sister of thy sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.";
web[45] = "Thou [art] thy mother\'s daughter, that lotheth her husband and her children; and thou [art] the sister of thy sisters, who lothed their husbands and their children: your mother [was] a Hittite, and your father an Amorite.";
hnv[45] = "You are the daughter of your mother, who loathes her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children: your mother was a Hittite, and your father an Amori.";
vul[45] = "filia matris tuae es tu quae proiecit virum suum et filios suos et soror sororum tuarum tu quae proiecerunt viros suos et filios suos mater vestra Cetthea et pater vester Amorreus";
kjv[46] = "And thine elder sister [is] Samaria, she and her daughters that dwell at thy left hand: and thy younger sister, that dwelleth at thy right hand, [is] Sodom and her daughters.";
rsv[46] = "And your elder sister is Sama\'ria, who lived with her daughters to the north of you; and your younger sister, who lived to the south of you, is Sodom with her daughters.";
asv[46] = "And thine elder sister is Samaria, that dwelleth at thy left hand, she and her daughters; and thy younger sister, that dwelleth at thy right hand, is Sodom and her daughters.";
yng[46] = "And thine elder sister [is] Samaria, she and her daughters, Who is dwelling at thy left hand, And thy younger sister, who is dwelling on thy right hand, [is] Sodom and her daughters.";
dby[46] = "And thine elder sister is Samaria that dwelleth at thy left hand, she and her daughters; and thy younger sister, that dwelleth at thy right hand, is Sodom and her daughters.";
web[46] = "And thy elder sister [is] Samaria, she and her daughters that dwell at thy left hand: and thy younger sister, that dwelleth at thy right hand, [is] Sodom and her daughters.";
hnv[46] = "Your elder sister is Shomron, who dwells at your left hand, she and her daughters; and your younger sister, who dwells at your right hand, is Sedom and her daughters.";
vul[46] = "et soror tua maior Samaria ipsa et filiae eius quae habitat ad sinistram tuam soror autem tua minor te quae habitat a dextris tuis Sodoma et filiae eius";
kjv[47] = "Yet hast thou not walked after their ways, nor done after their abominations: but, as [if that were] a very little [thing], thou wast corrupted more than they in all thy ways.";
rsv[47] = "Yet you were not content to walk in their ways, or do according to their abominations; within a very little time you were more corrupt than they in all your ways.";
asv[47] = "Yet hast thou not walked in their ways, nor done after their abominations; but, as [if that were] a very little [thing], thou wast more corrupt than they in all thy ways.";
yng[47] = "And -- in their ways thou hast not walked, And according to their abominations done, As a little thing it hath been loathed, And thou dost more corruptly than they in all thy ways.";
dby[47] = "And thou hast not walked in their ways, nor done according to their abominations; but as though that were a very little, thou hast been more corrupt than they in all thy ways.";
web[47] = "Yet hast thou not walked after their ways, nor done after their abominations: but as [if that were] a very little [thing], thou wast corrupted more than they in all thy ways.";
hnv[47] = "Yet have you not walked in their ways, nor done after their abominations; but, as [if that were] a very little [thing], you were more corrupt than they in all your ways.";
vul[47] = "sed nec in viis earum ambulasti neque secundum scelera earum fecisti pauxillum minus paene sceleratiora fecisti illis in omnibus viis tuis";
kjv[48] = "[As] I live, saith the Lord GOD, Sodom thy sister hath not done, she nor her daughters, as thou hast done, thou and thy daughters.";
rsv[48] = "As I live, says the Lord GOD, your sister Sodom and her daughters have not done as you and your daughters have done.";
asv[48] = "As I live, saith the Lord Jehovah, Sodom thy sister hath not done, she nor her daughters, as thou hast done, thou and thy daughters.";
yng[48] = "I live -- an affirmation of the Lord Jehovah, Sodom thy sister hath not done -- she and her daughters -- As thou hast done -- thou and thy daughters.";
dby[48] = "[As] I live, saith the Lord Jehovah, Sodom thy sister hath not done, she nor her daughters, as thou hast done, thou and thy daughters!";
web[48] = "[As] I live, saith the Lord GOD, Sodom thy sister hath not done, she nor her daughters, as thou hast done, thou and thy daughters.";
hnv[48] = "As I live, says the Lord GOD, Sedom your sister has not done, she nor her daughters, as you have done, you and your daughters.";
vul[48] = "vivo ego dicit Dominus Deus quia non fecit Sodoma soror tua ipsa et filiae eius sicut fecisti tu et filiae tuae";
kjv[49] = "Behold, this was the iniquity of thy sister Sodom, pride, fulness of bread, and abundance of idleness was in her and in her daughters, neither did she strengthen the hand of the poor and needy.";
rsv[49] = "Behold, this was the guilt of your sister Sodom: she and her daughters had pride, surfeit of food, and prosperous ease, but did not aid the poor and needy.";
asv[49] = "Behold, this was the iniquity of thy sister Sodom: pride, fulness of bread, and prosperous ease was in her and in her daughters; neither did she strengthen the hand of the poor and needy.";
yng[49] = "Lo, this hath been the iniquity of Sodom thy sister, Arrogancy, fulness of bread, and quiet ease, Have been to her and to her daughters, And the hand of the afflicted and needy She hath not strengthened.";
dby[49] = "Behold, this was the iniquity of thy sister Sodom: pride, fulness of bread, and careless ease was in her and in her daughters, but she did not strengthen the hand of the poor and needy.";
web[49] = "Behold, this was the iniquity of thy sister Sodom, pride, fullness of bread, and abundance of idleness was in her and in her daughters, neither did she strengthen the hand of the poor and needy.";
hnv[49] = "Behold, this was the iniquity of your sister Sedom: pride, fullness of bread, and prosperous ease was in her and in her daughters; neither did she strengthen the hand of the poor and needy.";
vul[49] = "ecce haec fuit iniquitas Sodomae sororis tuae superbia saturitas panis et abundantia et otium ipsius et filiarum eius et manum egeno et pauperi non porrigebant";
kjv[50] = "And they were haughty, and committed abomination before me: therefore I took them away as I saw [good].";
rsv[50] = "They were haughty, and did abominable things before me; therefore I removed them, when I saw it.";
asv[50] = "And they were haughty, and committed abomination before me: therefore I took them away as I saw [good].";
yng[50] = "And they are haughty and do abomination before Me, And I turn them aside when I have seen.";
dby[50] = "And they were haughty, and committed abomination before me, and I took them away when I saw [it].";
web[50] = "And they were haughty, and committed abomination before me: therefore I took them away as I saw [good].";
hnv[50] = "They were haughty, and committed abomination before me: therefore I took them away as I saw [good].";
vul[50] = "et elevatae sunt et fecerunt abominationes coram me et abstuli eas sicut vidisti";
kjv[51] = "Neither hath Samaria committed half of thy sins; but thou hast multiplied thine abominations more than they, and hast justified thy sisters in all thine abominations which thou hast done.";
rsv[51] = "Sama\'ria has not committed half your sins; you have committed more abominations than they, and have made your sisters appear righteous by all the abominations which you have committed.";
asv[51] = "Neither hath Samaria committed half of thy sins; but thou hast multiplied thine abominations more than they, and hast justified thy sisters by all thine abominations which thou hast done.";
yng[51] = "As to Samaria, as the half of thy sins -- she hath not sinned, And thou dost multiply thine abominations more than they, And dost justify thy sisters by all thy abominations that thou hast done.";
dby[51] = "And Samaria hath not sinned according to the half of thy sins; but thou hast multiplied thine abominations more than they, and hast justified thy sisters by all thine abominations which thou hast done.";
web[51] = "Neither hath Samaria committed half of thy sins; but thou hast multiplied thy abominations more than they, and hast justified thy sisters in all thy abominations which thou hast done.";
hnv[51] = "Neither has Shomron committed half of your sins; but you have multiplied your abominations more than they, and have justified your sisters by all your abominations which you have done.";
vul[51] = "et Samaria dimidium peccatorum tuorum non peccavit sed vicisti eas sceleribus tuis et iustificasti sorores tuas in omnibus abominationibus tuis quas operata es";
kjv[52] = "Thou also, which hast judged thy sisters, bear thine own shame for thy sins that thou hast committed more abominable than they: they are more righteous than thou: yea, be thou confounded also, and bear thy shame, in that thou hast justified thy sisters.";
rsv[52] = "Bear your disgrace, you also, for you have made judgment favorable to your sisters; because of your sins in which you acted more abominably than they, they are more in the right than you. So be ashamed, you also, and bear your disgrace, for you have made your sisters appear righteous.";
asv[52] = "Thou also, bear thou thine own shame, in that thou hast given judgment for thy sisters; through thy sins that thou hast committed more abominable than they, they are more righteous than thou: yea, be thou also confounded, and bear thy shame, in that thou hast justified thy sisters.";
yng[52] = "Thou also -- bear thy shame, That thou hast adjudged to thy sisters, Because of thy sins that thou hast done more abominably than they, They are more righteous than thou, And thou, also, be ashamed and bear thy shame, In thy justifying thy sisters.";
dby[52] = "Thou also, who hast judged thy sisters, bear thine own confusion, because of thy sins in which thou hast acted more abominably than they: they are more righteous than thou. So be thou ashamed also, and bear thy confusion, in that thou hast justified thy sisters.";
web[52] = "Thou also, who hast judged thy sisters, bear thy own shame for thy sins that thou hast committed more abominable than they: they are more righteous than thou: yes, be thou confounded also, and bear thy shame, in that thou hast justified thy sisters.";
hnv[52] = "You also, bear you your own shame, in that you have given judgment for your sisters; through your sins that you have committed more abominable than they, they are more righteous that you: yes, be also confounded, and bear your shame, in that you have justified your sisters.";
vul[52] = "ergo et tu porta confusionem tuam quae vicisti sorores tuas peccatis tuis sceleratius agens ab eis iustificatae sunt enim a te ergo et tu confundere et porta ignominiam tuam quae iustificasti sorores tuas";
kjv[53] = "When I shall bring again their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, then [will I bring again] the captivity of thy captives in the midst of them:";
rsv[53] = "&quot;I will restore their fortunes, both the fortunes of Sodom and her daughters, and the fortunes of Sama\'ria and her daughters, and I will restore your own fortunes in the midst of them,";
asv[53] = "And I will turn again their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, and the captivity of thy captives in the midst of them;";
yng[53] = "And I have turned back [to] their captivity, The captivity of Sodom and her daughters, And the captivity of Samaria and her daughters, And the captivity of thy captives in their midst,";
dby[53] = "And I will bring again their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, and the captivity of thy captives in the midst of them;";
web[53] = "When I shall bring again their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, then [will I bring again] the captivity of thy captives in the midst of them:";
hnv[53] = "I will turn again their captivity, the captivity of Sedom and her daughters, and the captivity of Shomron and her daughters, and the captivity of your captives in the midst of them;";
vul[53] = "et convertam restituens eas conversione Sodomorum cum filiabus suis et conversione Samariae et filiarum eius et convertam reversionem tuam in medio earum";
kjv[54] = "That thou mayest bear thine own shame, and mayest be confounded in all that thou hast done, in that thou art a comfort unto them.";
rsv[54] = "that you may bear your disgrace and be ashamed of all that you have done, becoming a consolation to them.";
asv[54] = "that thou mayest bear thine own shame, and mayest be ashamed because of all that thou hast done, in that thou art a comfort unto them.";
yng[54] = "So that thou dost bear thy shame, And hast been ashamed of all that thou hast done, In thy comforting them.";
dby[54] = "that thou mayest bear thy confusion, and mayest be confounded for all that thou hast done, in that thou comfortest them.";
web[54] = "That thou mayest bear thy own shame, and mayest be confounded in all that thou hast done, in that thou art a comfort to them.";
hnv[54] = "that you may bear your own shame, and may be ashamed because of all that you have done, in that you are a comfort to them.";
vul[54] = "ut portes ignominiam tuam et confundaris in omnibus quae fecisti consolans eas";
kjv[55] = "When thy sisters, Sodom and her daughters, shall return to their former estate, and Samaria and her daughters shall return to their former estate, then thou and thy daughters shall return to your former estate.";
rsv[55] = "As for your sisters, Sodom and her daughters shall return to their former estate, and Sama\'ria and her daughters shall return to their former estate; and you and your daughters shall return to your former estate.";
asv[55] = "And thy sisters, Sodom and her daughters, shall return to their former estate; and Samaria and her daughters shall return to their former estate; and thou and thy daughters shall return to your former estate.";
yng[55] = "And thy sisters, Sodom and her daughters, Do turn back to their former state, And Samaria and her daughters Do turn back to their former state, And thou and thy daughters do turn back to your former state.";
dby[55] = "And thy sisters, Sodom and her daughters, shall return to their former estate, and Samaria and her daughters shall return to their former estate; thou also and thy daughters, ye shall return to your former estate.";
web[55] = "When thy sisters, Sodom and her daughters, shall return to their former state, and Samaria and her daughters shall return to their former state, then thou and thy daughters shall return to your former state.";
hnv[55] = "Your sisters, Sedom and her daughters, shall return to their former estate; and Shomron and her daughters shall return to their former estate; and you and your daughters shall return to your former estate.";

hnv[58] = "You have borne your lewdness and your abominations, says the LORD.";
vul[58] = "scelus tuum et ignominiam tuam tu portasti ait Dominus Deus";

kjv[61] = "Then thou shalt remember thy ways, and be ashamed, when thou shalt receive thy sisters, thine elder and thy younger: and I will give them unto thee for daughters, but not by thy covenant.";

asv[61] = "Then shalt thou remember thy ways, and be ashamed, when thou shalt receive thy sisters, thine elder [sisters] and thy younger; and I will give them unto thee for daughters, but not by thy covenant.";
yng[61] = "And thou hast remembered thy ways, And thou hast been ashamed, In thy receiving thy sisters -- Thine elder with thy younger, And I have given them to thee for daughters, And not by thy covenant.";
dby[61] = "And thou shalt remember thy ways, and be confounded, when thou shalt receive thy sisters who are older than thou, together with those who are younger than thou; for I will give them unto thee for daughters, but not by virtue of thy covenant.";
