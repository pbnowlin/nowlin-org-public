csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, face Gog, of the land of Magog, the chief prince of Meshech and Tubal. Prophesy against him";
csb[3] = "&quot;and say, \'This is what the Lord GOD says: Look, I am against you, Gog, chief prince of Meshech and Tubal.";
csb[4] = "&quot;I will turn you around, put hooks in your jaws, and bring you out with all your army, including horses and riders, who are all splendidly dressed, a huge assembly armed with large and small shields, all of them brandishing swords.";
csb[5] = "&quot;Persia, Cush, and Put are with them, all of them with shields and helmets;";
csb[6] = "&quot;Gomer with all its troops; and Beth-togarmah from the remotest parts of the north along with all its troops -- many peoples are with you.";
csb[7] = "&quot; \'Be prepared and get yourself ready, you and your whole assembly that has been mobilized around you; you will be their guard.";
csb[8] = "&quot;After a long time you will be summoned. In the last years you will enter a land that has been restored from war and regathered from many peoples to the mountains of Israel, which had long been a ruin. They were brought out from the peoples, and all of them now live securely.";
csb[9] = "&quot;You, all of your troops, and many peoples with you will advance, coming like a thunderstorm; you will be like a cloud covering the land.";
csb[10] = "&quot; \'This is what the Lord GOD says: On that day, thoughts will arise in your mind, and you will devise an evil plan.";
csb[11] = "&quot;You will say, &quot;I will advance against a land of open villages; I will come against a tranquil people who are living securely, all of them living without walls and without bars or gates&quot; --";
csb[12] = "in order to seize spoil and carry off plunder, to turn your hand against ruins now inhabited and against a people gathered from the nations, who have been acquiring cattle and possessions and who live at the center of the world.";
csb[13] = "Sheba and Dedan and the merchants of Tarshish with all its rulers will ask you, &quot;Have you come to seize spoil? Have you mobilized your assembly to carry off plunder, to make off with silver and gold, to take cattle and possessions, to seize plenty of spoil? &quot; \'";
csb[14] = "&quot;Therefore prophesy, son of man, and say to Gog, \'This is what the Lord GOD says: On that day when my people Israel are dwelling securely, will you not know this";
csb[15] = "&quot;and come from your place in the remotest parts of the north -- you and many peoples with you, who are all riding horses -- a huge assembly, a powerful army?";
csb[16] = "&quot;You will advance against my people Israel like a cloud covering the land. It will happen in the last days, Gog, that I will bring you against my land so that the nations may know me, when I show myself holy through you in their sight.";
csb[17] = "&quot; \'This is what the Lord GOD says: Are you the one I spoke about in former times through my servants, the prophets of Israel, who for years prophesied in those times that I would bring you against them?";
csb[18] = "&quot;Now on that day, the day when Gog comes against the land of Israel -- this is the declaration of the Lord GOD -- my wrath will flare up.";
csb[19] = "&quot;I swear in my zeal and fiery rage: On that day there will be a great earthquake in the land of Israel.";
csb[20] = "&quot;The fish of the sea, the birds of the sky, the animals of the field, every creature that crawls on the ground, and every human being on the face of the earth will tremble before me. The mountains will be demolished, the cliffs will collapse, and every wall will fall to the ground.";
csb[21] = "&quot;I will call for a sword against him on all my mountains -- this is the declaration of the Lord GOD -- and every man\'s sword will be against his brother.";
csb[22] = "&quot;I will execute judgment on him with plague and bloodshed. I will pour out torrential rain, hailstones, fire, and burning sulfur on him, as well as his troops and the many peoples who are with him.";
csb[23] = "&quot;I will display my greatness and holiness, and will reveal myself in the sight of many nations. Then they will know that I am the LORD.\'";

kjv[8] = "After many days thou shalt be visited: in the latter years thou shalt come into the land [that is] brought back from the sword, [and is] gathered out of many people, against the mountains of Israel, which have been always waste: but it is brought forth out of the nations, and they shall dwell safely all of them.";
rsv[8] = "After many days you will be mustered; in the latter years you will go against the land that is restored from war, the land where people were gathered from many nations upon the mountains of Israel, which had been a continual waste; its people were brought out from the nations and now dwell securely, all of them.";
asv[8] = "After many days thou shalt be visited: in the latter years thou shalt come into the land that is brought back from the sword, that is gathered out of many peoples, upon the mountains of Israel, which have been a continual waste; but it is brought forth out of the peoples, and they shall dwell securely, all of them.";
yng[8] = "After many days thou art appointed, In the latter end of the years thou comest in unto a land brought back from sword, [A people] gathered out of many peoples, Upon mountains of Israel, That have been for a perpetual waste, And it from the peoples hath been brought out, And dwelt safely have all of them.";
dby[8] = "After many days shalt thou be visited; at the end of years thou shalt come into the land brought back from the sword [and] gathered out of many peoples, upon the mountains of Israel which have been a perpetual waste: but it is brought forth out from the peoples, and they shall all of them be dwelling in safety.";
web[8] = "After many days thou shalt be visited: in the latter years thou shalt come into the land [that is] brought back from the sword, [and is] gathered out of many people, against the mountains of Israel, which have been always waste: but it is brought forth out of the nations, and they shall all dwell in safety.";
hnv[8] = "After many days you shall be visited: in the latter years you shall come into the land that is brought back from the sword, that is gathered out of many peoples, on the mountains of Yisra\'el, which have been a continual waste; but it is brought forth out of the peoples, and they shall dwell securely, all of them.";
vul[8] = "post dies multos visitaberis in novissimo annorum venies ad terram quae reversa est a gladio congregata est de populis multis ad montes Israhel qui fuerunt deserti iugiter haec de populis educta est et habitaverunt in ea confidenter universi";

kjv[12] = "To take a spoil, and to take a prey; to turn thine hand upon the desolate places [that are now] inhabited, and upon the people [that are] gathered out of the nations, which have gotten cattle and goods, that dwell in the midst of the land.";
rsv[12] = "to seize spoil and carry off plunder; to assail the waste places which are now inhabited, and the people who were gathered from the nations, who have gotten cattle and goods, who dwell at the center of the earth.";
asv[12] = "to take the spoil and to take the prey; to turn thy hand against the waste places that are [now] inhabited, and against the people that are gathered out of the nations, that have gotten cattle and goods, that dwell in the middle of the earth.";
yng[12] = "To take a spoil, and to take a prey, To turn back thy hand on inhabited wastes, And on a people gathered out of nations, Making cattle and substance, Dwelling on a high part of the land.";

kjv[13] = "Sheba, and Dedan, and the merchants of Tarshish, with all the young lions thereof, shall say unto thee, Art thou come to take a spoil? hast thou gathered thy company to take a prey? to carry away silver and gold, to take away cattle and goods, to take a great spoil?";

yng[13] = "Sheba, and Dedan, and merchants of Tarshish, And all its young lions say to thee: To take a spoil art thou come in? To take a prey assembled thine assembly? To bear away silver and gold? To take away cattle and substance? To take a great spoil?";

vul[13] = "Seba et Dedan et negotiatores Tharsis et omnes leones eius dicent tibi numquid ad sumenda spolia tu venis ecce ad diripiendam praedam congregasti multitudinem tuam ut tollas argentum et aurum auferas supellectilem atque substantiam et diripias manubias infinitas";

dby[14] = "Therefore prophesy, son of man, and say unto Gog, Thus saith the Lord Jehovah: In that day when my people Israel dwelleth in safety, shalt thou not know [it]?";

kjv[16] = "And thou shalt come up against my people of Israel, as a cloud to cover the land; it shall be in the latter days, and I will bring thee against my land, that the heathen may know me, when I shall be sanctified in thee, O Gog, before their eyes.";
rsv[16] = "you will come up against my people Israel, like a cloud covering the land. In the latter days I will bring you against my land, that the nations may know me, when through you, O Gog, I vindicate my holiness before their eyes.";
asv[16] = "and thou shalt come up against my people Israel, as a cloud to cover the land: it shall come to pass in the latter days, that I will bring thee against my land, that the nations may know me, when I shall be sanctified in thee, O Gog, before their eyes.";
yng[16] = "And thou hast come up against My people Israel, As a cloud to cover the land, In the latter end of the days it is, And I have brought thee in against My land, In order that the nations may know Me, In My being sanctified in thee before their eyes, O Gog.";
dby[16] = "And thou shalt come up against my people Israel as a cloud to cover the land -- it shall be at the end of days -- and I will bring thee against my land, that the nations may know me, when I shall be hallowed in thee, O Gog, before their eyes.";
web[16] = "And thou shalt come against my people of Israel, as a cloud to cover the land; it shall be in the latter days, and I will bring thee against my land, that the heathen may know me, when I shall be sanctified in thee, O Gog, before their eyes.";

vul[16] = "et ascendes super populum meum Israhel quasi nubes ut operias terram in novissimis diebus eris et adducam te super terram meam ut sciant gentes me cum sanctificatus fuero in te in oculis eorum o Gog";
kjv[17] = "Thus saith the Lord GOD; [Art] thou he of whom I have spoken in old time by my servants the prophets of Israel, which prophesied in those days [many] years that I would bring thee against them?";
rsv[17] = "&quot;Thus says the Lord GOD: Are you he of whom I spoke in former days by my servants the prophets of Israel, who in those days prophesied for years that I would bring you against them?";
asv[17] = "Thus saith the Lord Jehovah: Art thou he of whom I spake in old time by my servants the prophets of Israel, that prophesied in those days for [many] years that I would bring thee against them?";
yng[17] = "Thus said the Lord Jehovah: Art thou he of whom I spake in former days, By the hand of My servants, prophets of Israel, Who are prophesying in those days -- years, To bring thee in against them?";
dby[17] = "Thus saith the Lord Jehovah: Art thou not he of whom I have spoken in old time through my servants the prophets of Israel, who prophesied in those days, for [many] years, that I would bring thee against them?";
web[17] = "Thus saith the Lord GOD; [Art] thou he of whom I have spoken in old time by my servants the prophets of Israel, who prophesied in those days [many] years, that I would bring thee against them?";
hnv[17] = "Thus says the Lord GOD: Are you he of whom I spoke in old time by my servants the prophets of Yisra\'el, who prophesied in those days for [many] years that I would bring you against them?";
vul[17] = "haec dicit Dominus Deus tu ergo ille es de quo locutus sum in diebus antiquis in manu servorum meorum prophetarum Israhel qui prophetaverunt in diebus illorum temporum ut adducerem te super eos";
kjv[18] = "And it shall come to pass at the same time when Gog shall come against the land of Israel, saith the Lord GOD, [that] my fury shall come up in my face.";
rsv[18] = "But on that day, when Gog shall come against the land of Israel, says the Lord GOD, my wrath will be roused.";
asv[18] = "And it shall come to pass in that day, when Gog shall come against the land of Israel, saith the Lord Jehovah, that my wrath shall come up into my nostrils.";
yng[18] = "And it hath come to pass, in that day, In the day of the coming in of Gog against the land of Israel, An affirmation of the Lord Jehovah, Come up doth My fury in My face,";
dby[18] = "And it shall come to pass in that day, in the day when Gog shall come against the land of Israel, saith the Lord Jehovah, [that] my fury shall come up in my face;";
web[18] = "And it shall come to pass at the same time when Gog shall come against the land of Israel, saith the Lord GOD, [that] my fury shall come up in my face.";
hnv[18] = "It shall happen in that day, when Gog shall come against Eretz-Yisra\'el, says the Lord GOD, that my wrath shall come up into my nostrils.";
vul[18] = "et erit in die illa in die adventus Gog super terram Israhel ait Dominus Deus ascendet indignatio mea in furore meo";
kjv[19] = "For in my jealousy [and] in the fire of my wrath have I spoken, Surely in that day there shall be a great shaking in the land of Israel;";
rsv[19] = "For in my jealousy and in my blazing wrath I declare, On that day there shall be a great shaking in the land of Israel;";
asv[19] = "For in my jealousy and in the fire of my wrath have I spoken, Surely in that day there shall be a great shaking in the land of Israel;";
yng[19] = "And in My zeal, in the fire of My wrath, I have spoken: Is there not in that day a great rushing on the land of Israel?";
dby[19] = "for in my jealousy, in the fire of my wrath have I spoken, Verily in that day there shall be a great shaking in the land of Israel;";
web[19] = "For in my jealousy [and] in the fire of my wrath have I spoken, Surely in that day there shall be a great shaking in the land of Israel.";
hnv[19] = "For in my jealousy and in the fire of my wrath have I spoken, Surely in that day there shall be a great shaking in Eretz-Yisra\'el;";
vul[19] = "et in zelo meo in igne irae meae locutus sum quia in die illa erit commotio magna super terram Israhel";
kjv[20] = "So that the fishes of the sea, and the fowls of the heaven, and the beasts of the field, and all creeping things that creep upon the earth, and all the men that [are] upon the face of the earth, shall shake at my presence, and the mountains shall be thrown down, and the steep places shall fall, and every wall shall fall to the ground.";
rsv[20] = "the fish of the sea, and the birds of the air, and the beasts of the field, and all creeping things that creep on the ground, and all the men that are upon the face of the earth, shall quake at my presence, and the mountains shall be thrown down, and the cliffs shall fall, and every wall shall tumble to the ground.";
asv[20] = "so that the fishes of the sea, and the birds of the heavens, and the beasts of the field, and all creeping things that creep upon the earth, and all the men that are upon the face of the earth, shall shake at my presence, and the mountains shall be thrown down, and the steep places shall fall, and every wall shall fall to the ground.";
yng[20] = "And rushed from My presence have fishes of the sea, And the fowl of the heavens, And the beast of the field, And every creeping thing that is creeping on the ground, And all men who [are] on the face of the ground, And thrown down have been the mountains, And fallen have the ascents, And every wall to the earth falleth.";
dby[20] = "so that the fish of the sea, and the fowl of the heavens, and the beasts of the field, and all creeping things which creep upon the earth, and all mankind that are upon the face of the earth shall shake at my presence; and the mountains shall be thrown down, and the steep places shall fall, and every wall shall fall to the ground.";
web[20] = "So that the fishes of the sea, and the fowls of the heaven, and the beasts of the field, and all creeping animals that creep upon the earth, and all the men that [are] upon the face of the earth, shall shake at my presence, and the mountains shall be overturned, and the steep places shall fall, and every wall shall fall to the ground.";
hnv[20] = "so that the fish of the sea, and the birds of the sky, and the animals of the field, and all creeping things who creep on the eretz, and all the men who are on the surface of the eretz, shall shake at my presence, and the mountains shall be thrown down, and the steep places shall fall, and every wall shall fall to the ground.";
vul[20] = "et commovebuntur a facie mea pisces maris et volucres caeli et bestiae agri et omne reptile quod movetur super humum cunctique homines qui sunt super faciem terrae et subvertentur montes et cadent sepes et omnis murus in terra corruet";
kjv[21] = "And I will call for a sword against him throughout all my mountains, saith the Lord GOD: every man\'s sword shall be against his brother.";
rsv[21] = "I will summon every kind of terror against Gog, says the Lord GOD; every man\'s sword will be against his brother.";
asv[21] = "And I will call for a sword against him unto all my mountains, saith the Lord Jehovah: every man\'s sword shall be against his brother.";
yng[21] = "And I have called against him, to all My mountains a sword, An affirmation of the Lord Jehovah, The sword of each is against his brother.";
dby[21] = "And I will call for a sword against him throughout all my mountains, saith the Lord Jehovah: every man\'s sword shall be against his brother.";
web[21] = "And I will call for a sword against him throughout all my mountains, saith the Lord GOD: every man\'s sword shall be against his brother.";
hnv[21] = "I will call for a sword against him to all my mountains, says the Lord GOD: every man\'s sword shall be against his brother.";
vul[21] = "et convocabo adversum eum in cunctis montibus meis gladium ait Dominus Deus gladius uniuscuiusque in fratrem suum dirigetur";
kjv[22] = "And I will plead against him with pestilence and with blood; and I will rain upon him, and upon his bands, and upon the many people that [are] with him, an overflowing rain, and great hailstones, fire, and brimstone.";
rsv[22] = "With pestilence and bloodshed I will enter into judgment with him; and I will rain upon him and his hordes and the many peoples that are with him, torrential rains and hailstones, fire and brimstone.";
asv[22] = "And with pestilence and with blood will I enter into judgment with him; and I will rain upon him, and upon his hordes, and upon the many peoples that are with him, an overflowing shower, and great hailstones, fire, and brimstone.";
yng[22] = "And I have been judged with him, With pestilence and with blood, And an overflowing rain and hailstones, Fire and brimstone I rain on him, and on his bands, And on many peoples who [are] with him.";
dby[22] = "And I will enter into judgment with him with pestilence and with blood; and I will rain upon him, and upon his bands, and upon the many peoples that are with him, overflowing rain and great hailstones, fire and brimstone.";
web[22] = "And I will plead against him with pestilence and with blood; and I will rain upon him, and upon his bands, and upon the many people that [are] with him, an overflowing rain, and great hailstones, fire, and brimstone.";
hnv[22] = "With pestilence and with blood will I enter into judgment with him; and I will rain on him, and on his hordes, and on the many peoples who are with him, an overflowing shower, and great hailstones, fire, and sulfur.";
vul[22] = "et iudicabo eum peste et sanguine et imbre vehementi et lapidibus inmensis ignem et sulphur pluam super eum et super exercitum eius et super populos multos qui sunt cum eo";
kjv[23] = "Thus will I magnify myself, and sanctify myself; and I will be known in the eyes of many nations, and they shall know that I [am] the LORD.";
rsv[23] = "So I will show my greatness and my holiness and make myself known in the eyes of many nations. Then they will know that I am the LORD.";
asv[23] = "And I will magnify myself, and sanctify myself, and I will make myself known in the eyes of many nations; and they shall know that I am Jehovah.";
yng[23] = "And I have magnified Myself, and sanctified Myself, And I have been known before the eyes of many nations, And they have known that I [am] Jehovah!";
dby[23] = "And I will magnify myself, and sanctify myself, and I will be known in the eyes of many nations, and they shall know that I [am] Jehovah.";
web[23] = "Thus will I magnify myself, and sanctify myself; and I will be known in the eyes of many nations, and they shall know that I [am] the LORD.";
hnv[23] = "I will magnify myself, and sanctify myself, and I will make myself known in the eyes of many nations; and they shall know that I am the LORD.";
vul[23] = "et magnificabor et sanctificabor et notus ero in oculis gentium multarum et scient quia ego Dominus";
