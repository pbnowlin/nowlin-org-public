csb[1] = "In the thirtieth year, in the fourth month, on the fifth day of the month, while I was among the exiles by the Chebar Canal, the heavens were opened and I saw visions of God.";
csb[2] = "On the fifth day of the month -- it was the fifth year of King Jehoiachin\'s exile --";
csb[3] = "the word of the LORD came directly to the priest Ezekiel son of Buzi, in the land of the Chaldeans by the Chebar Canal. The LORD\'s hand was on him there.";
csb[4] = "I looked, and there was a whirlwind coming from the north, a huge cloud with fire flashing back and forth and brilliant light all around it. In the center of the fire, there was a gleam like amber.";
csb[5] = "The likeness of four living creatures came from it, and this was their appearance: They looked something like a human,";
csb[6] = "but each of them had four faces and four wings.";
csb[7] = "Their legs were straight, and the soles of their feet were like the hooves of a calf, sparkling like the gleam of polished bronze.";
csb[8] = "They had human hands under their wings on their four sides. All four of them had faces and wings.";
csb[9] = "Their wings were touching. The creatures did not turn as they moved; each one went straight ahead.";
csb[10] = "Their faces looked something like the face of a human, and each of the four had the face of a lion on the right, the face of an ox on the left, and the face of an eagle.";
csb[11] = "That is what their faces were like. Their wings were spread upward; each had two wings touching that of another and two wings covering its body.";
csb[12] = "Each creature went straight ahead. Wherever the Spirit wanted to go, they went without turning as they moved.";
csb[13] = "The likeness of the living creatures was like the appearance of blazing coals of fire or like torches. Fire was moving back and forth between the living creatures; it was bright, with lightning coming out of it.";
csb[14] = "The creatures were darting back and forth like flashes of lightning.";
csb[15] = "When I looked at the living creatures, there was one wheel on the ground beside each of the four-faced creatures.";
csb[16] = "The appearance of the wheels and their craftsmanship was like the gleam of beryl, and all four had the same likeness. Their appearance and craftsmanship was like a wheel within a wheel.";
csb[17] = "When they moved, they went in any of the four directions, without turning as they moved.";
csb[18] = "Their rims were tall and awe-inspiring. Each of their four rims were full of eyes all around.";
csb[19] = "When the living creatures moved, the wheels moved beside them, and when the creatures rose from the earth, the wheels also rose.";
csb[20] = "Wherever the Spirit wanted to go, the creatures went in the direction the Spirit was moving. The wheels rose alongside them, for the spirit of the living creatures was in the wheels.";
csb[21] = "When the creatures moved, the wheels moved; when the creatures stopped, the wheels stopped; and when the creatures rose from the earth, the wheels rose alongside them, for the spirit of the living creatures was in the wheels.";
csb[22] = "Over the heads of the living creatures the likeness of an expanse was spread out. It gleamed like awe-inspiring crystal,";
csb[23] = "and under the expanse their wings extended one toward another. They each also had two wings covering their bodies.";
csb[24] = "When they moved, I heard the sound of their wings like the roar of a huge torrent, like the voice of the Almighty, and a sound of tumult like the noise of an army. When they stopped, they lowered their wings.";
csb[25] = "A voice came from above the expanse over their heads; when they stopped, they lowered their wings.";
csb[26] = "Something like a throne with the appearance of lapis lazuli was above the expanse over their heads. On the throne, high above, was someone who looked like a human.";
csb[27] = "From what seemed to be his waist up, I saw a gleam like amber, with what looked like fire enclosing it all around. From what seemed to be his waist down, I also saw what looked like fire. There was a brilliant light all around him.";
csb[28] = "The appearance of the brilliant light all around was like that of a rainbow in a cloud on a rainy day. This was the appearance of the likeness of the LORD\'s glory. When I saw it, I fell facedown and heard a voice speaking.";
