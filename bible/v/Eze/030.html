csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, prophesy and say, \'This is what the Lord GOD says: Wail, &quot;Woe because of that day! &quot;";
csb[3] = "For a day is near; a day belonging to the LORD is near. It will be a day of clouds, a time of doom for the nations.";
csb[4] = "A sword will come against Egypt, and there will be anguish in Cush when the slain fall in Egypt, and its wealth is taken away, and its foundations are demolished.";
csb[5] = "Cush, Put, and Lud, and all the various foreign troops, plus Libya and the men of the covenant land will fall by the sword along with them.";
csb[6] = "This is what the LORD says: Those who support Egypt will fall, and its proud strength will collapse. From Migdol to Syene they will fall within it by the sword. This is the declaration of the Lord GOD.";
csb[7] = "They will be desolate among desolate lands, and their cities will lie among ruined cities.";
csb[8] = "They will know that I am the LORD when I set fire to Egypt and all its allies are shattered.";
csb[9] = "On that day, messengers will go out from me in ships to terrify confident Cush. Anguish will come over them on the day of Egypt\'s doom. For indeed it is coming.";
csb[10] = "&quot; \'This is what the Lord GOD says: I will put an end to the hordes of Egypt by the hand of King Nebuchadnezzar of Babylon.";
csb[11] = "&quot;He along with his people, ruthless men from the nations, will be brought in to destroy the land. They will draw their swords against Egypt and fill the land with the slain.";
csb[12] = "&quot;I will make the streams dry and sell the land to evil men. I will bring desolation on the land and everything in it by the hands of foreigners. I, the LORD, have spoken.";
csb[13] = "&quot; \'This is what the Lord GOD says: I will destroy the idols and put an end to the false gods in Memphis. There will no longer be a prince from the land of Egypt. And I will instill fear in that land.";
csb[14] = "&quot;I will make Pathros desolate, set fire to Zoan, and execute judgments on Thebes.";
csb[15] = "&quot;I will pour out my wrath on Pelusium, the stronghold of Egypt, and will wipe out the hordes of Thebes.";
csb[16] = "&quot;I will set fire to Egypt; Pelusium will writhe in anguish, Thebes will be breached, and Memphis will face foes in broad daylight.";
csb[17] = "&quot;The young men of On and Pi-beseth will fall by the sword, and those cities will go into captivity.";
csb[18] = "&quot;The day will be dark in Tehaphnehes, when I break the yoke of Egypt there and its proud strength comes to an end in the city. A cloud will cover Tehaphnehes, and its surrounding villages will go into captivity.";
csb[19] = "&quot;So I will execute judgments against Egypt, and they will know that I am the LORD.\' &quot;";
csb[20] = "In the eleventh year, in the first month, on the seventh day of the month, the word of the LORD came to me:";
csb[21] = "&quot;Son of man, I have broken the arm of Pharaoh king of Egypt. Look, it has not been bandaged -- no medicine has been applied and no splint put on to bandage it so that it can grow strong enough to handle a sword.";
csb[22] = "&quot;Therefore, this is what the Lord GOD says: Look! I am against Pharaoh king of Egypt. I will break his arms, both the strong one and the one already broken, and will make the sword fall from his hand.";
csb[23] = "&quot;I will disperse the Egyptians among the nations and scatter them among the countries.";
csb[24] = "&quot;I will strengthen the arms of Babylon\'s king and place my sword in his hand. But I will break the arms of Pharaoh, and he will groan before him as a mortally wounded man.";
csb[25] = "&quot;I will strengthen the arms of Babylon\'s king, but Pharaoh\'s arms will fall. They will know that I am the LORD when I place my sword in the hand of Babylon\'s king and he wields it against the land of Egypt.";
csb[26] = "&quot;When I disperse the Egyptians among the nations and scatter them among the countries, they will know that I am the LORD.&quot;";

rsv[20] = "In the eleventh year, in the first month, on the seventh day of the month, the word of the LORD came to me:";
asv[20] = "And it came to pass in the eleventh year, in the first [month], in the seventh [day] of the month, that the word of Jehovah came unto me, saying,";
yng[20] = "And it cometh to pass, in the eleventh year, in the first [month], in the seventh of the month, hath a word of Jehovah been unto me, saying: `Son of man,";
dby[20] = "And it came to pass in the eleventh year, in the first [month], on the seventh of the month, the word of Jehovah came unto me, saying,";
web[20] = "And it came to pass in the eleventh year, in the first [month], in the seventh [day] of the month, [that] the word of the LORD came to me, saying,";
hnv[20] = "It happened in the eleventh year, in the first [month], in the seventh [day] of the month, that the word of the LORD came to me, saying,";
vul[20] = "et factum est in undecimo anno in primo in septima mensis factum est verbum Domini ad me dicens";
kjv[21] = "Son of man, I have broken the arm of Pharaoh king of Egypt; and, lo, it shall not be bound up to be healed, to put a roller to bind it, to make it strong to hold the sword.";
rsv[21] = "&quot;Son of man, I have broken the arm of Pharaoh king of Egypt; and lo, it has not been bound up, to heal it by binding it with a bandage, so that it may become strong to wield the sword.";
asv[21] = "Son of man, I have broken the arm of Pharaoh king of Egypt; and, lo, it hath not been bound up, to apply [healing] medicines, to put a bandage to bind it, that it be strong to hold the sword.";
yng[21] = "The arm of Pharaoh, king of Egypt, I have broken, And lo, it hath not been bound up to give healing, To put a bandage to bind it, To strengthen it -- to lay hold on the sword.";
dby[21] = "Son of man, I have broken the arm of Pharaoh king of Egypt; and behold, it shall not be bound up to apply remedies, to put a bandage to bind it, to make it strong to hold the sword.";
web[21] = "Son of man, I have broken the arm of Pharaoh king of Egypt; and lo, it shall not be bound up to be healed, to put a roller to bind it, to make it strong to hold the sword.";
hnv[21] = "Son of man, I have broken the arm of Par`oh king of Mitzrayim; and, behold, it has not been bound up, to apply [healing] medicines, to put a bandage to bind it, that it be strong to hold the sword.";
vul[21] = "fili hominis brachium Pharao regis Aegypti confregi et ecce non est obvolutum ut restitueretur ei sanitas ut ligaretur pannis et farciretur linteolis et recepto robore posset tenere gladium";
kjv[22] = "Therefore thus saith the Lord GOD; Behold, I [am] against Pharaoh king of Egypt, and will break his arms, the strong, and that which was broken; and I will cause the sword to fall out of his hand.";
rsv[22] = "Therefore thus says the Lord GOD: Behold, I am against Pharaoh king of Egypt, and will break his arms, both the strong arm and the one that was broken; and I will make the sword fall from his hand.";
asv[22] = "Therefore thus saith the Lord Jehovah: Behold, I am against Pharaoh king of Egypt, and will break his arms, the strong [arm], and that which was broken; and I will cause the sword to fall out of his hand.";
yng[22] = "Therefore, thus said the Lord Jehovah: Lo, I [am] against Pharaoh, king of Egypt, And I have broken his arms, The strong one and the broken one, And have caused the sword to fall out of his hand,";
dby[22] = "Therefore thus saith the Lord Jehovah: Behold, I am against Pharaoh king of Egypt, and will break his arms, the strong one, and that which was broken; and I will cause the sword to fall out of his hand.";
web[22] = "Therefore thus saith the Lord GOD; Behold, I [am] against Pharaoh king of Egypt, and will break his arms, the strong, and that which was broken; and I will cause the sword to fall out of his hand.";
hnv[22] = "Therefore thus says the Lord GOD: Behold, I am against Par`oh king of Mitzrayim, and will break his arms, the strong [arm], and that which was broken; and I will cause the sword to fall out of his hand.";
vul[22] = "propterea haec dicit Dominus Deus ecce ego ad Pharao regem Aegypti et comminuam brachium eius forte sed confractum et deiciam gladium de manu eius";
kjv[23] = "And I will scatter the Egyptians among the nations, and will disperse them through the countries.";
rsv[23] = "I will scatter the Egyptians among the nations, and disperse them throughout the lands.";
asv[23] = "And I will scatter the Egyptians among the nations, and will disperse them through the countries.";
yng[23] = "And scattered the Egyptians among nations, And I have spread them through lands,";
dby[23] = "And I will scatter the Egyptians among the nations, and will disperse them through the countries.";
web[23] = "And I will scatter the Egyptians among the nations, and will disperse them through the countries.";
hnv[23] = "I will scatter the Mitzrim among the nations, and will disperse them through the countries.";
vul[23] = "et dispergam Aegyptum in gentibus et ventilabo eos in terris";
kjv[24] = "And I will strengthen the arms of the king of Babylon, and put my sword in his hand: but I will break Pharaoh\'s arms, and he shall groan before him with the groanings of a deadly wounded [man].";
rsv[24] = "And I will strengthen the arms of the king of Babylon, and put my sword in his hand; but I will break the arms of Pharaoh, and he will groan before him like a man mortally wounded.";
asv[24] = "And I will strengthen the arms of the king of Babylon, and put my sword in his hand: but I will break the arms of Pharaoh, and he shall groan before him with the groanings of a deadly wounded man.";
yng[24] = "And strengthened the arms of the king of Babylon, And I have given My sword into his hand, And I have broken the arms of Pharaoh, And he hath groaned the groans of a pierced one -- before him.";
dby[24] = "And I will strengthen the arms of the king of Babylon, and put my sword in his hand; and I will break Pharaoh\'s arms, so that he shall groan before him with the groanings of a deadly-wounded [man].";
web[24] = "And I will strengthen the arms of the king of Babylon, and put my sword in his hand: but I will break Pharaoh\'s arms, and he shall groan before him with the groanings of a deadly wounded [man].";
hnv[24] = "I will strengthen the arms of the king of Bavel, and put my sword in his hand: but I will break the arms of Par`oh, and he shall groan before him with the groanings of a deadly wounded man.";
vul[24] = "et confortabo brachia regis Babylonis daboque gladium meum in manu eius et confringam brachia Pharaonis et gement gemitibus interfecti coram facie eius";
kjv[25] = "But I will strengthen the arms of the king of Babylon, and the arms of Pharaoh shall fall down; and they shall know that I [am] the LORD, when I shall put my sword into the hand of the king of Babylon, and he shall stretch it out upon the land of Egypt.";
rsv[25] = "I will strengthen the arms of the king of Babylon, but the arms of Pharaoh shall fall; and they shall know that I am the LORD. When I put my sword into the hand of the king of Babylon, he shall stretch it out against the land of Egypt;";
asv[25] = "And I will hold up the arms of the king of Babylon; and the arms of Pharaoh shall fall down; and they shall know that I am Jehovah, when I shall put my sword into the hand of the king of Babylon, and he shall stretch it out upon the land of Egypt.";
yng[25] = "And I have strengthened the arms of the king of Babylon, And the arms of Pharaoh do fall down, And they have known that I [am] Jehovah, In My giving My sword into the hand of the king of Babylon, And he hath stretched it out toward the land of Egypt.";
dby[25] = "And I will strengthen the arms of the king of Babylon, and the arms of Pharaoh shall fall down; and they shall know that I [am] Jehovah, when I have put my sword into the hand of the king of Babylon, and he shall have stretched it out upon the land of Egypt.";
web[25] = "But I will strengthen the arms of the king of Babylon, and the arms of Pharaoh shall fall down; and they shall know that I [am] the LORD, when I shall put my sword into the hand of the king of Babylon, and he shall stretch it out upon the land of Egypt.";
hnv[25] = "I will hold up the arms of the king of Bavel; and the arms of Par`oh shall fall down; and they shall know that I am the LORD, when I shall put my sword into the hand of the king of Bavel, and he shall stretch it out on the land of Mitzrayim.";
vul[25] = "et confortabo brachia regis Babylonis et brachia Pharaonis concident et scient quia ego Dominus cum dedero gladium meum in manu regis Babylonis et extenderit eum super terram Aegypti";

dby[26] = "And I will scatter the Egyptians among the nations, and disperse them through the countries: and they shall know that I [am] Jehovah.";
web[26] = "And I will scatter the Egyptians among the nations, and disperse them among the countries; and they shall know that I [am] the LORD.";
