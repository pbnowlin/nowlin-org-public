csb[1] = "Then he called loudly in my hearing, &quot;Come near, executioners of the city, each of you with a destructive weapon in his hand.&quot;";
csb[2] = "And I saw six men coming from the direction of the Upper Gate, which faces north, each with a war club in his hand. There was another man among them, clothed in linen, carrying writing equipment. They came and stood beside the bronze altar.";
csb[3] = "Then the glory of the God of Israel rose from above the cherub where it had been, to the threshold of the temple. He called to the man clothed in linen and carrying writing equipment.";
csb[4] = "&quot;Pass throughout the city of Jerusalem,&quot; the LORD said to him, &quot;and put a mark on the foreheads of the men who sigh and groan over all the detestable practices committed in it.&quot;";
csb[5] = "He spoke to the others in my hearing: &quot;Pass through the city after him and start killing; do not show pity or spare them!";
csb[6] = "&quot;Slaughter the old men, the young men and women, as well as the children and older women, but do not come near anyone who has the mark. Begin at my sanctuary.&quot; So they began with the elders who were in front of the temple.";
csb[7] = "Then he said to them, &quot;Defile the temple and fill the courts with the slain. Go! &quot; So they went out killing people in the city.";
csb[8] = "While they were killing, I was left alone. And I fell facedown and cried out, &quot;Oh, Lord GOD! Are you going to destroy the entire remnant of Israel when you pour out your wrath on Jerusalem? &quot;";
csb[9] = "He answered me, &quot;The iniquity of the house of Israel and Judah is extremely great; the land is full of bloodshed, and the city full of perversity. For they say, \'The LORD has abandoned the land; he does not see.\'";
csb[10] = "&quot;But as for me, I will not show pity or spare them. I will bring their conduct down on their own heads.&quot;";
csb[11] = "Then the man clothed in linen and carrying writing equipment reported back, &quot;I have done all that you commanded me.&quot;";
