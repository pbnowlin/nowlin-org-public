csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, you are living among a rebellious house. They have eyes to see but do not see, and ears to hear but do not hear, for they are a rebellious house.";
csb[3] = "&quot;Now you, son of man, get your bags ready for exile and go into exile in their sight during the day. You will go into exile from your place to another place while they watch; perhaps they will understand, though they are a rebellious house.";
csb[4] = "&quot;During the day, bring out your bags like an exile\'s bags while they look on. Then in the evening go out in their sight like those going into exile.";
csb[5] = "&quot;As they watch, dig through the wall and take the bags out through it.";
csb[6] = "&quot;And while they look on, lift the bags to your shoulder and take them out in the dark; cover your face so that you cannot see the land. For I have made you a sign to the house of Israel.&quot;";
csb[7] = "So I did just as I was commanded. In the daytime I brought out my bags like an exile\'s bags. In the evening I dug through the wall by hand; I took them out in the dark, carrying them on my shoulder in their sight.";
csb[8] = "In the morning the word of the LORD came to me:";
csb[9] = "&quot;Son of man, hasn\'t the house of Israel, that rebellious house, asked you, \'What are you doing? \'";
csb[10] = "&quot;Say to them, \'This is what the Lord GOD says: This pronouncement concerns the prince in Jerusalem and the whole house of Israel living there.\'";
csb[11] = "&quot;You are to say, \'I am a sign for you. Just as I have done, it will be done to them; they will go into exile, into captivity.\'";
csb[12] = "&quot;The prince who is among them will lift his bags to his shoulder in the dark and go out. They will dig through the wall to bring him out through it. He will cover his face so he cannot see the land with his eyes.";
csb[13] = "&quot;But I will spread my net over him, and he will be caught in my snare. I will bring him to Babylon, the land of the Chaldeans, yet he will not see it, and he will die there.";
csb[14] = "&quot;I will also scatter all the attendants who surround him and all his troops to every direction of the wind, and I will draw a sword to chase after them.";
csb[15] = "&quot;They will know that I am the LORD when I disperse them among the nations and scatter them among the countries.";
csb[16] = "&quot;But I will spare a few of them from the sword, famine, and plague, so that among the nations where they go they can tell about all their detestable practices. Then they will know that I am the LORD.&quot;";
csb[17] = "The word of the LORD came to me:";
csb[18] = "&quot;Son of man, eat your bread with trembling and drink your water with anxious shaking.";
csb[19] = "&quot;Then say to the people of the land, \'This is what the Lord GOD says about the residents of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water in dread, for their land will be stripped of everything in it because of the violence of all who live there.";
csb[20] = "&quot;The inhabited cities will be destroyed, and the land will become dreadful. Then you will know that I am the LORD.\' &quot;";
csb[21] = "Again the word of the LORD came to me:";
csb[22] = "&quot;Son of man, what is this proverb you people have about the land of Israel, which goes, \'The days keep passing by, and every vision fails\'?";
csb[23] = "&quot;Therefore say to them, \'This is what the Lord GOD says: I will put a stop to this proverb, and they will not use it again in Israel.\' But say to them, \'The days have arrived, as well as the fulfillment of every vision.";
csb[24] = "&quot;For there will no longer be any false vision or flattering divination within the house of Israel.";
csb[25] = "&quot;But I, the LORD, will speak whatever message I will speak, and it will be done. It will no longer be delayed. For in your days, rebellious house, I will speak a message and bring it to pass. This is the declaration of the Lord GOD.\' &quot;";
csb[26] = "The word of the LORD came to me:";
csb[27] = "&quot;Son of man, notice that the house of Israel is saying, \'The vision that he sees concerns many years from now; he prophesies about distant times.\'";
csb[28] = "&quot;Therefore say to them, \'This is what the Lord GOD says: None of my words will be delayed any longer. The message I speak will be fulfilled. This is the declaration of the Lord GOD.\' &quot;";

rsv[19] = "and say of the people of the land, Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They shall eat their bread with fearfulness, and drink water in dismay, because their land will be stripped of all it contains, on account of the violence of all those who dwell in it.";
asv[19] = "and say unto the people of the land, Thus saith the Lord Jehovah concerning the inhabitants of Jerusalem, and the land of Israel: They shall eat their bread with fearfulness, and drink their water in dismay, that her land may be desolate, [and despoiled] of all that is therein, because of the violence of all them that dwell therein.";
yng[19] = "and thou hast said unto the people of the land, Thus said the Lord Jehovah concerning the inhabitants of Jerusalem, concerning the land of Israel: Their bread with fear they do eat, and their water with astonishment drink, because its land is desolate, because of its fulness, because of the violence of all who are dwelling in it.";
dby[19] = "and say unto the people of the land, Thus saith the Lord Jehovah concerning the inhabitants of Jerusalem, in the land of Israel: They shall eat their bread with anxiety, and drink their water with astonishment, because her land shall be left desolate of all that is in it, for the violence of all them that dwell therein.";
web[19] = "And say to the people of the land, Thus saith the Lord GOD of the inhabitants of Jerusalem, [and] of the land of Israel; They shall eat their bread with solicitude, and drink their water with astonishment, that her land may be desolate from all that is therein, because of the violence of all them that dwell therein.";
hnv[19] = "and tell the people of the land, Thus says the Lord GOD concerning the inhabitants of Yerushalayim, and Eretz-Yisra\'el: They shall eat their bread with fearfulness, and drink their water in dismay, that her land may be desolate, [and despoiled] of all that is therein, because of the violence of all those who dwell therein.";
vul[19] = "et dices ad populum terrae haec dicit Dominus Deus ad eos qui habitant in Hierusalem in terra Israhel panem suum in sollicitudine comedent et aquam suam in desolatione bibent ut desoletur terra a multitudine sua propter iniquitatem omnium qui habitant in ea";
kjv[20] = "And the cities that are inhabited shall be laid waste, and the land shall be desolate; and ye shall know that I [am] the LORD.";
rsv[20] = "And the inhabited cities shall be laid waste, and the land shall become a desolation; and you shall know that I am the LORD.&quot;";
asv[20] = "And the cities that are inhabited shall be laid waste, and the land shall be a desolation; and ye shall know that I am Jehovah.";
yng[20] = "And the cities that are inhabited are laid waste, and the land is a desolation, and ye have known that I [am] Jehovah.\'";
dby[20] = "And the cities that are inhabited shall be laid waste, and the land shall be a desolation; and ye shall know that I [am] Jehovah.";
web[20] = "And the cities that are inhabited shall be laid waste, and the land shall be desolate; and ye shall know that I [am] the LORD.";
hnv[20] = "The cities that are inhabited shall be laid waste, and the land shall be a desolation; and you shall know that I am the LORD.";
vul[20] = "et civitates quae nunc habitantur desolatae erunt terraque deserta et scietis quia ego Dominus";
kjv[21] = "And the word of the LORD came unto me, saying,";
rsv[21] = "And the word of the LORD came to me:";
asv[21] = "And the word of Jehovah came unto me, saying,";
yng[21] = "And there is a word of Jehovah unto me, saying,";
dby[21] = "And the word of Jehovah came unto me, saying,";
web[21] = "And the word of the LORD came to me, saying,";
hnv[21] = " The word of the LORD came to me, saying,";
vul[21] = "et factus est sermo Domini ad me dicens";
kjv[22] = "Son of man, what [is] that proverb [that] ye have in the land of Israel, saying, The days are prolonged, and every vision faileth?";
rsv[22] = "&quot;Son of man, what is this proverb that you have about the land of Israel, saying, \'The days grow long, and every vision comes to nought\'?";
asv[22] = "Son of man, what is this proverb that ye have in the land of Israel, saying, The days are prolonged, and every vision faileth?";
yng[22] = "`Son of man, what [is] this simile to you, concerning the land of Israel, saying, Prolonged are the days, and perished hath every vision?";
dby[22] = "Son of man, what is that proverb which ye have in the land of Israel, saying, The days shall be prolonged, and every vision faileth?";
web[22] = "Son of man, what [is] that proverb [that] ye have in the land of Israel, saying, The days are prolonged, and every vision faileth?";
hnv[22] = "Son of man, what is this proverb that you have in Eretz-Yisra\'el, saying, The days are prolonged, and every vision fails?";
vul[22] = "fili hominis quod est proverbium istud vobis in terra Israhel dicentium in longum differentur dies et peribit omnis visio";
kjv[23] = "Tell them therefore, Thus saith the Lord GOD; I will make this proverb to cease, and they shall no more use it as a proverb in Israel; but say unto them, The days are at hand, and the effect of every vision.";
rsv[23] = "Tell them therefore, \'Thus says the Lord GOD: I will put an end to this proverb, and they shall no more use it as a proverb in Israel.\' But say to them, The days are at hand, and the fulfilment of every vision.";
asv[23] = "Tell them therefore, Thus saith the Lord Jehovah: I will make this proverb to cease, and they shall no more use it as a proverb in Israel; but say unto them, The days are at hand, and the fulfilment of every vision.";
yng[23] = "therefore say unto them: Thus said the Lord Jehovah: I have caused this simile to cease, And they use it not as a simile again in Israel, But speak to them: Drawn near have the days, And spoken hath every vision.";
dby[23] = "Tell them therefore, Thus saith the Lord Jehovah: I will make this proverb to cease, and they shall no more use it as a proverb in Israel; but say unto them, The days are at hand, and the accomplishment of every vision.";
web[23] = "Tell them therefore, Thus saith the Lord GOD: I will make this proverb to cease, and they shall no more use it as a proverb in Israel; but say to them, The days are at hand, and the effect of every vision.";
hnv[23] = "Tell them therefore, Thus says the Lord GOD: I will make this proverb to cease, and they shall no more use it as a proverb in Yisra\'el; but tell them, The days are at hand, and the fulfillment of every vision.";
vul[23] = "ideo dic ad eos haec dicit Dominus Deus quiescere faciam proverbium istud neque vulgo dicetur ultra in Israhel et loquere ad eos quod adpropinquaverint dies et sermo omnis visionis";
kjv[24] = "For there shall be no more any vain vision nor flattering divination within the house of Israel.";
rsv[24] = "For there shall be no more any false vision or flattering divination within the house of Israel.";
asv[24] = "For there shall be no more any false vision nor flattering divination within the house of Israel.";
yng[24] = "For there is no more any vain vision, and flattering divination, In the midst of the house of Israel.";
dby[24] = "For there shall be no more any vain vision nor flattering divination in the midst of the house of Israel.";
web[24] = "For there shall no more be any vain vision nor flattering divination within the house of Israel.";
hnv[24] = "For there shall be no more any false vision nor flattering divination within the house of Yisra\'el.";
vul[24] = "non enim erit ultra omnis visio cassa neque divinatio ambigua in medio filiorum Israhel";
kjv[25] = "For I [am] the LORD: I will speak, and the word that I shall speak shall come to pass; it shall be no more prolonged: for in your days, O rebellious house, will I say the word, and will perform it, saith the Lord GOD.";
rsv[25] = "But I the LORD will speak the word which I will speak, and it will be performed. It will no longer be delayed, but in your days, O rebellious house, I will speak the word and perform it, says the Lord GOD.&quot;";
asv[25] = "For I am Jehovah; I will speak, and the word that I shall speak shall be performed; it shall be no more deferred: for in your days, O rebellious house, will I speak the word, and will perform it, saith the Lord Jehovah.";
yng[25] = "For I [am] Jehovah, I speak, The word that I speak -- it is done, It is not prolonged any more, For, in your days, O rebellious house, I speak a word, and I have done it, An affirmation of the Lord Jehovah.\'";
dby[25] = "For I [am] Jehovah; I will speak, and the word that I shall speak shall be performed, it shall be no more deferred. For in your days, O rebellious house, will I speak the word and will perform it, saith the Lord Jehovah.";
web[25] = "For I [am] the LORD: I will speak, and the word that I shall speak shall come to pass; it shall no more be prolonged: for in your days, O rebellious house, will I say the word, and will perform it, saith the Lord GOD.";
hnv[25] = "For I am the LORD; I will speak, and the word that I shall speak shall be performed; it shall be no more deferred: for in your days, rebellious house, will I speak the word, and will perform it, says the Lord GOD.";
vul[25] = "quia ego Dominus loquar quodcumque locutus fuero verbum et fiet non prolongabitur amplius sed in diebus vestris domus exasperans loquar verbum et faciam illud dicit Dominus Deus";
kjv[26] = "Again the word of the LORD came to me, saying,";
rsv[26] = "Again the word of the LORD came to me:";
asv[26] = "Again the word of Jehovah came to me, saying,";

kjv[27] = "Son of man, behold, [they of] the house of Israel say, The vision that he seeth [is] for many days [to come], and he prophesieth of the times [that are] far off.";
rsv[27] = "&quot;Son of man, behold, they of the house of Israel say, \'The vision that he sees is for many days hence, and he prophesies of times far off.\'";
asv[27] = "Son of man, behold, they of the house of Israel say, The vision that he seeth is for many days to come, and he prophesieth of times that are far off.";
yng[27] = "`Son of man, lo, the house of Israel are saying, The vision that he is seeing [is] for many days, and of times far off he is prophesying,";
dby[27] = "Son of man, behold, they of the house of Israel say, The vision that he seeth is for many days, and he prophesieth of times that are far off.";
web[27] = "Son of man, behold, [they of] the house of Israel say, The vision that he seeth [is] for many days [to come], and he prophesieth of the times [that are] distant.";
hnv[27] = "Son of man, behold, they of the house of Yisra\'el say, The vision that he sees is for many day to come, and he prophesies of times that are far off.";
vul[27] = "fili hominis ecce domus Israhel dicentium visio quam hic videt in dies multos et in tempora longa iste prophetat";
kjv[28] = "Therefore say unto them, Thus saith the Lord GOD; There shall none of my words be prolonged any more, but the word which I have spoken shall be done, saith the Lord GOD.";
rsv[28] = "Therefore say to them, Thus says the Lord GOD: None of my words will be delayed any longer, but the word which I speak will be performed, says the Lord GOD.&quot;";
asv[28] = "Therefore say unto them, Thus saith the Lord Jehovah: There shall none of my words be deferred any more, but the word which I shall speak shall be performed, saith the Lord Jehovah.";
yng[28] = "therefore say unto them: Thus said the Lord Jehovah: None of my words are prolonged any more, When I speak a word -- it is done, An affirmation of the Lord Jehovah!\'";
dby[28] = "Therefore say unto them, Thus saith the Lord Jehovah: There shall none of my words be deferred any more, but the word that I have spoken shall be done, saith the Lord Jehovah.";
web[28] = "Therefore say to them, Thus saith the Lord GOD; There shall none of my words be further deferred, but the word which I have spoken shall be done, saith the Lord GOD.";
hnv[28] = "Therefore tell them, Thus says the Lord GOD: There shall none of my words be deferred any more, but the word which I shall speak shall be performed, says the Lord GOD.";
vul[28] = "propterea dic ad eos haec dicit Dominus Deus non prolongabitur ultra omnis sermo meus verbum quod locutus fuero conplebitur dicit Dominus Deus";
