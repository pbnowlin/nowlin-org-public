csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, prophesy against the prophets of Israel who are prophesying. Say to those who prophesy out of their own imagination, \'Hear the word of the LORD!";
csb[3] = "&quot;This is what the Lord GOD says: Woe to the foolish prophets who follow their own spirit and have seen nothing.";
csb[4] = "&quot;Your prophets, Israel, are like jackals among ruins.";
csb[5] = "&quot;You did not go up to the gaps or restore the wall around the house of Israel so that it might stand in battle on the day of the LORD.";
csb[6] = "&quot;They saw false visions and their divinations were a lie. They claimed, &quot;This is the LORD\'s declaration,&quot; when the LORD did not send them, yet they wait for the fulfillment of their message.";
csb[7] = "Didn\'t you see a false vision and speak a lying divination when you proclaimed, &quot;This is the LORD\'s declaration,&quot; even though I had not spoken?";
csb[8] = "&quot; \'Therefore, this is what the Lord GOD says: You have spoken falsely and had lying visions; that\'s why you discover that I am against you. This is the declaration of the Lord GOD.";
csb[9] = "&quot;My hand will be against the prophets who see false visions and speak lying divinations. They will not be present in the council of my people or be recorded in the register of the house of Israel, and they will not enter the land of Israel. Then you will know that I am the Lord GOD.";
csb[10] = "&quot; \'Since they have led my people astray by saying, &quot;Peace,&quot; when there is no peace, and since when a flimsy wall is being built, they plaster it with whitewash,";
csb[11] = "therefore, tell those plastering it with whitewash that it will fall. Torrential rain will come, and I will send hailstones plunging down, and a whirlwind will be released.";
csb[12] = "When the wall has fallen, will you not be asked, &quot;Where\'s the whitewash you plastered on it? &quot;";
csb[13] = "&quot; \'So this is what the Lord GOD says: I will release a whirlwind in my wrath. Torrential rain will come in my anger, and hailstones will fall in destructive fury.";
csb[14] = "&quot;I will demolish the wall you plastered with whitewash and knock it to the ground so that its foundation is exposed. The city will fall, and you will be destroyed within it. Then you will know that I am the LORD.";
csb[15] = "&quot;After I exhaust my wrath against the wall and against those who plaster it with whitewash, I will say to you, &quot;The wall is no more and neither are those who plastered it --";
csb[16] = "&quot;those prophets of Israel who prophesied to Jerusalem and saw a vision of peace for her when there was no peace.&quot; This is the declaration of the Lord GOD.\'";
csb[17] = "&quot;Now you, son of man, face the women among your people who prophesy out of their own imagination, and prophesy against them.";
csb[18] = "&quot;Say, \'This is what the Lord GOD says: Woe to the women who sew magic bands on the wrist of every hand and who make veils for the heads of people of every size in order to ensnare lives. Will you ensnare the lives of my people but preserve your own?";
csb[19] = "&quot;You profane me among my people for handfuls of barley and scraps of bread; you put those to death who should not die and spare those who should not live, when you lie to my people, who listen to lies.";
csb[20] = "&quot; \'Therefore, this is what the Lord GOD says: I am against your magic bands with which you ensnare people like birds, and I will tear them from your arms. I will free the people you have ensnared like birds.";
csb[21] = "&quot;I will also tear off your veils and rescue my people from your hands, so that they will no longer be prey in your hands. Then you will know that I am the LORD.";
csb[22] = "&quot;Because you have disheartened the righteous person with lies (when I intended no distress), and because you have supported the wicked person so that he does not turn from his evil way to save his life,";
csb[23] = "&quot;therefore you will no longer see false visions or practice divination. I will rescue my people from your hands. Then you will know that I am the LORD.\' &quot;";

kjv[9] = "And mine hand shall be upon the prophets that see vanity, and that divine lies: they shall not be in the assembly of my people, neither shall they be written in the writing of the house of Israel, neither shall they enter into the land of Israel; and ye shall know that I [am] the Lord GOD.";

kjv[18] = "And say, Thus saith the Lord GOD; Woe to the [women] that sew pillows to all armholes, and make kerchiefs upon the head of every stature to hunt souls! Will ye hunt the souls of my people, and will ye save the souls alive [that come] unto you?";
rsv[18] = "and say, Thus says the Lord GOD: Woe to the women who sew magic bands upon all wrists, and make veils for the heads of persons of every stature, in the hunt for souls! Will you hunt down souls belonging to my people, and keep other souls alive for your profit?";
asv[18] = "and say, Thus saith the Lord Jehovah: Woe to the women that sew pillows upon all elbows, and make kerchiefs for the head of [persons of] every stature to hunt souls! Will ye hunt the souls of my people, and save souls alive for yourselves?";
yng[18] = "And thou hast said: Thus said the Lord Jehovah: Wo to those sowing pillows for all joints of the arm, And to those making the kerchiefs For the head of every stature -- to hunt souls, The souls do ye hunt of My people? And the souls ye have do ye keep alive?";
dby[18] = "and say, Thus saith the Lord Jehovah: Woe unto the women that sew pillows for all wrists, and that make veils for the head [of persons] of every stature to catch souls! Will ye catch the souls of my people, and will ye save your own souls alive?";
web[18] = "And say, Thus saith the Lord GOD; Woe to the [women] that sew pillows to all arm-holes, and make kerchiefs upon the head of every stature to hunt souls! Will ye hunt the souls of my people, and will ye save the souls alive [that come] to you?";
hnv[18] = " and say, Thus says the Lord GOD: Woe to the women who sew pillows on all elbows, and make kerchiefs for the head of [persons of] every stature to hunt souls! Will you hunt the souls of my people, and save souls alive for yourselves?";
vul[18] = "et dic haec ait Dominus Deus vae quae consuunt pulvillos sub omni cubito manus et faciunt cervicalia sub capite universae aetatis ad capiendas animas cum caperent animas populi mei vivificabant animas eorum";
kjv[19] = "And will ye pollute me among my people for handfuls of barley and for pieces of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to my people that hear [your] lies?";
rsv[19] = "You have profaned me among my people for handfuls of barley and for pieces of bread, putting to death persons who should not die and keeping alive persons who should not live, by your lies to my people, who listen to lies.";
asv[19] = "And ye have profaned me among my people for handfuls of barley and for pieces of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to my people that hearken unto lies.";
yng[19] = "Yea, ye pierce Me concerning My people, For handfuls of barley, And for pieces of bread, to put to death Souls that should not die, And to keep alive souls that should not live, By your lying to My people -- hearkening to lies.";
dby[19] = "And will ye profane me among my people for handfuls of barley and for morsels of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to my people that listen to lying?";
web[19] = "And will ye profane me among my people for handfuls of barley and for pieces of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to my people that hear [your] lies?";
hnv[19] = "You have profaned me among my people for handfuls of barley and for pieces of bread, to kill the souls who should not die, and to save the souls alive who should not live, by your lying to my people who listen to lies.";
vul[19] = "et violabant me ad populum meum propter pugillum hordei et fragmen panis ut interficerent animas quae non moriuntur et vivificarent animas quae non vivunt mentientes populo meo credenti mendaciis";
kjv[20] = "Wherefore thus saith the Lord GOD; Behold, I [am] against your pillows, wherewith ye there hunt the souls to make [them] fly, and I will tear them from your arms, and will let the souls go, [even] the souls that ye hunt to make [them] fly.";
rsv[20] = "&quot;Wherefore thus says the Lord GOD: Behold, I am against your magic bands with which you hunt the souls, and I will tear them from your arms; and I will let the souls that you hunt go free like birds.";
asv[20] = "Wherefore thus saith the Lord Jehovah: Behold, I am against your pillows, wherewith ye there hunt the souls to make [them] fly, and I will tear them from your arms; and I will let the souls go, even the souls that ye hunt to make [them] fly.";
yng[20] = "Therefore, thus said the Lord Jehovah: Lo, I [am] against your pillows, With which ye are hunting there the souls of the flourishing, And I have rent them from off your arms, And have sent away the souls that ye are hunting, The souls of the flourishing.";
dby[20] = "Wherefore thus saith the Lord Jehovah: Behold, I am against your pillows, that the souls which ye catch by their means may fly away; and I will tear them from your arms, and will let the souls go, the souls that ye catch, that they may fly away.";
web[20] = "Wherefore thus saith the Lord GOD; Behold, I [am] against your pillows, with which ye there hunt the souls to make [them] fly, and I will tear them from your arms, and will let the souls go, [even] the souls that ye hunt to make [them] fly.";
hnv[20] = "Therefore thus says the Lord GOD: Behold, I am against your pillows, with which you there hunt the souls to make [them] fly, and I will tear them from your arms; and I will let the souls go, even the souls who you hunt to make [them] fly.";
vul[20] = "propter hoc haec dicit Dominus Deus ecce ego ad pulvillos vestros quibus vos capitis animas volantes et disrumpam eos de brachiis vestris et dimittam animas quas vos capitis animas ad volandum";
kjv[21] = "Your kerchiefs also will I tear, and deliver my people out of your hand, and they shall be no more in your hand to be hunted; and ye shall know that I [am] the LORD.";

asv[21] = "Your kerchiefs also will I tear, and deliver my people out of your hand, and they shall be no more in your hand to be hunted; and ye shall know that I am Jehovah.";
yng[21] = "And I have torn your kerchiefs, And delivered My people out of your hand, And they are no more in your hand for a prey, And ye have known that I [am] Jehovah.";
dby[21] = "And I will tear your veils and deliver my people out of your hand, and they shall be no more in your hand to be hunted; and ye shall know that I [am] Jehovah.";

vul[21] = "et disrumpam cervicalia vestra et liberabo populum meum de manu vestra neque erunt ultra in manibus vestris ad praedandum et scietis quia ego Dominus";

asv[22] = "Because with lies ye have grieved the heart of the righteous, whom I have not made sad, and strengthened the hands of the wicked, that he should not return from his wicked way, and be saved alive;";
yng[22] = "Because of paining the heart of the righteous with falsehood, And I have not pained it, And strengthening the hands of the wicked, So as not to turn back from his evil way, To keep him alive,";
