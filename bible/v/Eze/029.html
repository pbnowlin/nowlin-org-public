csb[1] = "In the tenth year, in the tenth month on the twelfth day of the month, the word of the LORD came to me:";
csb[2] = "&quot;Son of man, face Pharaoh king of Egypt and prophesy against him and against all of Egypt.";
csb[3] = "&quot;Speak to him and say, \'This is what the Lord GOD says: Look, I am against you, Pharaoh king of Egypt, the great monster lying in the middle of his Nile, who says, &quot;My Nile is my own; I made it for myself.&quot;";
csb[4] = "I will put hooks in your jaws and make the fish of your streams cling to your scales. I will haul you up from the middle of your Nile, and all the fish of your streams will cling to your scales.";
csb[5] = "I will leave you in the desert, you and all the fish of your streams. You will fall on the open ground and will not be taken away or gathered for burial. I have given you to the wild creatures of the earth and the birds of the sky as food.";
csb[6] = "&quot; \'Then all the inhabitants of Egypt will know that I am the LORD, for they have been a staff made of reed to the house of Israel.";
csb[7] = "&quot;When Israel grasped you by the hand, you splintered, tearing all their shoulders; when they leaned on you, you shattered and made all their hips unsteady.";
csb[8] = "&quot; \'Therefore, this is what the Lord GOD says: I am going to bring a sword against you and cut off both man and animal from you.";
csb[9] = "&quot;The land of Egypt will be a desolate ruin. Then they will know that I am the LORD. Because you said, &quot;The Nile is my own; I made it,&quot;";
csb[10] = "therefore, I am against you and your Nile. I will turn the land of Egypt into ruins, a desolate waste from Migdol to Syene, as far as the border of Cush.";
csb[11] = "No human foot will pass through it, and no animal foot will pass through it. It will be uninhabited for forty years.";
csb[12] = "I will make the land of Egypt a desolation among desolate lands, and its cities will be a desolation among ruined cities for forty years. I will disperse the Egyptians among the nations and scatter them throughout the lands.";
csb[13] = "&quot; \'For this is what the Lord GOD says: At the end of forty years I will gather the Egyptians from the peoples where they were dispersed.";
csb[14] = "&quot;I will restore the fortunes of Egypt and bring them back to the land of Pathros, the land of their origin. There they will be a lowly kingdom.";
csb[15] = "&quot;Egypt will be the lowliest of kingdoms and will never again exalt itself over the nations. I will make them so small they cannot rule over the nations.";
csb[16] = "&quot;It will never again be an object of trust for the house of Israel, drawing attention to their iniquity of turning to the Egyptians. Then they will know that I am the Lord GOD.\' &quot;";
csb[17] = "In the twenty-seventh year, in the first month, on the first day of the month, the word of the LORD came to me:";
csb[18] = "&quot;Son of man, King Nebuchadnezzar of Babylon made his army labor strenuously against Tyre. Every head was made bald and every shoulder chafed, but he and his army received no compensation from Tyre for the labor he expended against it.";
csb[19] = "&quot;Therefore, this is what the Lord GOD says: I am going to give the land of Egypt to King Nebuchadnezzar of Babylon, and he will carry off its wealth, seizing its spoil and taking its plunder. This will be his army\'s compensation.";
csb[20] = "&quot;I have given him the land of Egypt as the pay he labored for, since they worked for me.&quot; This is the declaration of the Lord GOD.";
csb[21] = "&quot;In that day I will cause a horn to sprout for the house of Israel, and I will enable you to speak out among them. Then they will know that I am the LORD.&quot;";

kjv[18] = "Son of man, Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyrus: every head [was] made bald, and every shoulder [was] peeled: yet had he no wages, nor his army, for Tyrus, for the service that he had served against it:";
rsv[18] = "&quot;Son of man, Nebuchadrez\'zar king of Babylon made his army labor hard against Tyre; every head was made bald and every shoulder was rubbed bare; yet neither he nor his army got anything from Tyre to pay for the labor that he had performed against it.";
asv[18] = "Son of man, Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyre: every head was made bald, and every shoulder was worn; yet had he no wages, nor his army, from Tyre, for the service that he had served against it.";
yng[18] = "`Son of man, Nebuchadrezzar king of Babylon, Hath caused his force to serve a great service against Tyre, Every head [is] bald -- every shoulder peeled, And reward he had none, nor his force, out of Tyre, For the service that he served against it.";
dby[18] = "Son of man, Nebuchadrezzar king of Babylon caused his army to do hard service against Tyre; every head was made bald, and every shoulder was peeled: yet had he from Tyre no wages, nor his army, for the service that he had served against it.";
web[18] = "Son of man, Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyre: every head [was] made bald, and every shoulder [was] peeled: yet had he no wages, nor his army, for Tyre, for the service that he had served against it:";
hnv[18] = "Son of man, Nevukhadretztzar king of Bavel caused his army to serve a great service against Tzor: every head was made bald, and every shoulder was worn; yet had he no wages, nor his army, from Tzor, for the service that he had served against it.";
vul[18] = "fili hominis Nabuchodonosor rex Babylonis servire fecit exercitum suum servitute magna adversum Tyrum omne caput decalvatum et omnis umerus depilatus est et merces non est reddita ei neque exercitui eius de Tyro pro servitute qua servivit mihi adversum eam";
kjv[19] = "Therefore thus saith the Lord GOD; Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall take her multitude, and take her spoil, and take her prey; and it shall be the wages for his army.";
rsv[19] = "Therefore thus says the Lord GOD: Behold, I will give the land of Egypt to Nebuchadrez\'zar king of Babylon; and he shall carry off its wealth and despoil it and plunder it; and it shall be the wages for his army.";
asv[19] = "Therefore thus saith the Lord Jehovah: Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall carry off her multitude, and take her spoil, and take her prey; and it shall be the wages for his army.";
yng[19] = "Therefore, thus said the Lord Jehovah, Lo, I am giving to Nebuchadrezzar king of Babylon the land of Egypt, And he hath taken away its store, And hath taken its spoil, and taken its prey, And it hath been a reward to his force.";
dby[19] = "Therefore thus saith the Lord Jehovah: Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall carry away her multitude, and seize her spoil, and take her prey; and it shall be the wages for his army.";
web[19] = "Therefore thus saith the Lord GOD; Behold, I will give the land of Egypt to Nebuchadrezzar king of Babylon; and he shall take her multitude, and take her spoil, and take her prey; and it shall be the wages for his army.";
hnv[19] = "Therefore thus says the Lord GOD: Behold, I will give the land of Mitzrayim to Nevukhadretztzar king of Bavel; and he shall carry off her multitude, and take her spoil, and take her prey; and it shall be the wages for his army.";
vul[19] = "propterea haec dicit Dominus Deus ecce ego dabo Nabuchodonosor regem Babylonis in terra Aegypti et accipiet multitudinem eius et depraedabitur manubias eius et diripiet spolia eius et erit merces exercitui illius";
kjv[20] = "I have given him the land of Egypt [for] his labour wherewith he served against it, because they wrought for me, saith the Lord GOD.";
rsv[20] = "I have given him the land of Egypt as his recompense for which he labored, because they worked for me, says the Lord GOD.";
asv[20] = "I have given him the land of Egypt as his recompense for which he served, because they wrought for me, saith the Lord Jehovah.";
yng[20] = "His wage for which he laboured I have given to him, The land of Egypt -- in that they wrought for Me, An affirmation of the Lord Jehovah.";
dby[20] = "I have given him the land of Egypt for his labour wherewith he served against it, because they wrought for me, saith the Lord Jehovah.";
web[20] = "I have given him the land of Egypt [for] his labor with which he served against it, because they wrought for me, saith the Lord GOD.";
hnv[20] = "I have given him the land of Mitzrayim as his recompense for which he served, because they worked for me, says the Lord GOD.";
vul[20] = "et operi pro quo servivit adversum eam dedi ei terram Aegypti pro eo quod laboraverunt mihi ait Dominus Deus";
kjv[21] = "In that day will I cause the horn of the house of Israel to bud forth, and I will give thee the opening of the mouth in the midst of them; and they shall know that I [am] the LORD.";
rsv[21] = "&quot;On that day I will cause a horn to spring forth to the house of Israel, and I will open your lips among them. Then they will know that I am the LORD.&quot;";
asv[21] = "In that day will I cause a horn to bud forth unto the house of Israel, and I will give thee the opening of the mouth in the midst of them; and they shall know that I am Jehovah.";
yng[21] = "In that day I cause to shoot up a horn to the house of Israel, And to thee I give an opening of the mouth in their midst, And they have known that I [am] Jehovah!\'";
dby[21] = "In that day will I cause the horn of the house of Israel to bud forth, and I will give thee the opening of the mouth in the midst of them: and they shall know that I [am] Jehovah.";
web[21] = "In that day will I cause the horn of the house of Israel to bud forth, and I will give thee the opening of the mouth in the midst of them; and they shall know that I [am] the LORD.";
hnv[21] = "In that day will I cause a horn to bud forth to the house of Yisra\'el, and I will give you the opening of the mouth in the midst of them; and they shall know that I am the LORD.";
vul[21] = "in die illo pullulabit cornu domui Israhel et tibi dabo apertum os in medio eorum et scient quoniam ego Dominus";
