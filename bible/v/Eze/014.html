csb[1] = "Some of the elders of Israel came to me and sat down in front of me.";
csb[2] = "Then the word of the LORD came to me:";
csb[3] = "&quot;Son of man, these men have set up idols in their hearts and have put their sinful stumbling blocks in front of themselves. Should I actually let them inquire of me?";
csb[4] = "&quot;Therefore, speak to them and tell them, \'This is what the Lord GOD says: When anyone from the house of Israel sets up idols in his heart and puts his sinful stumbling block in front of himself, and then comes to the prophet, I, the LORD, will answer him appropriately. I will answer him according to his many idols,";
csb[5] = "&quot;so that I may take hold of the house of Israel by their hearts. They are all estranged from me because of their idols.\'";
csb[6] = "&quot;Therefore, say to the house of Israel, \'This is what the Lord GOD says: Repent and turn away from your idols; turn your faces away from all your detestable things.";
csb[7] = "&quot;For when anyone from the house of Israel or from the aliens who reside in Israel separates himself from me, setting up idols in his heart and putting his sinful stumbling block in front of himself, and then comes to the prophet to inquire of me, I, the LORD, will answer him myself.";
csb[8] = "&quot;I will turn against that one and make him a sign and a proverb; I will cut him off from among my people. Then you will know that I am the LORD.";
csb[9] = "&quot; \'But if the prophet is deceived and speaks a message, it was I, the LORD, who deceived that prophet. I will stretch out my hand against him and destroy him from among my people Israel.";
csb[10] = "&quot;They will bear their punishment -- the punishment of the one who inquires will be the same as that of the prophet --";
csb[11] = "&quot;in order that the house of Israel may no longer stray from following me and no longer defile themselves with all their transgressions. Then they will be my people and I will be their God. This is the declaration of the Lord GOD.\' &quot;";
csb[12] = "The word of the LORD came to me:";
csb[13] = "&quot;Son of man, suppose a land sins against me by acting faithlessly, and I stretch out my hand against it to cut off its supply of bread, to send famine through it, and to wipe out both man and animal from it.";
csb[14] = "&quot;Even if these three men -- Noah, Daniel, and Job -- were in it, they would rescue only themselves by their righteousness.&quot; This is the declaration of the Lord GOD.";
csb[15] = "&quot;Suppose I allow dangerous animals to pass through the land and depopulate it so that it becomes desolate, with no one passing through it for fear of the animals.";
csb[16] = "&quot;Even if these three men were in it, as I live&quot; -- the declaration of the Lord GOD -- &quot;they could not rescue their sons or daughters. They alone would be rescued, but the land would be desolate.";
csb[17] = "&quot;Or suppose I bring a sword against that land and say, \'Let a sword pass through it,\' so that I wipe out both man and animal from it.";
csb[18] = "&quot;Even if these three men were in it, as I live&quot; -- the declaration of the Lord GOD -- &quot;they could not rescue their sons or daughters, but they alone would be rescued.";
csb[19] = "&quot;Or suppose I send a plague into that land and pour out my wrath on it with bloodshed to wipe out both man and animal from it.";
csb[20] = "&quot;Even if Noah, Daniel, and Job were in it, as I live&quot; -- the declaration of the Lord GOD -- &quot;they could not rescue their son or daughter. They would rescue only themselves by their righteousness.";
csb[21] = "&quot;For this is what the Lord GOD says: How much worse will it be when I send my four devastating judgments against Jerusalem -- sword, famine, dangerous animals, and plague -- in order to wipe out both man and animal from it!";
csb[22] = "&quot;Even so, there will be survivors left in it, sons and daughters who will be brought out. Indeed, they will come out to you, and you will observe their conduct and actions. Then you will be consoled about the devastation I have brought on Jerusalem, about all I have brought on it.";
csb[23] = "&quot;They will bring you consolation when you see their conduct and actions, and you will know that it was not without cause that I have done what I did to it.&quot; This is the declaration of the Lord GOD.";
kjv[1] = "Then came certain of the elders of Israel unto me, and sat before me.";
kjv[2] = "And the word of the LORD came unto me, saying,";
kjv[3] = "Son of man, these men have set up their idols in their heart, and put the stumblingblock of their iniquity before their face: should I be enquired of at all by them?";
kjv[4] = "Therefore speak unto them, and say unto them, Thus saith the Lord GOD; Every man of the house of Israel that setteth up his idols in his heart, and putteth the stumblingblock of his iniquity before his face, and cometh to the prophet; I the LORD will answer him that cometh according to the multitude of his idols;";
kjv[5] = "That I may take the house of Israel in their own heart, because they are all estranged from me through their idols.";
kjv[6] = "Therefore say unto the house of Israel, Thus saith the Lord GOD; Repent, and turn [yourselves] from your idols; and turn away your faces from all your abominations.";
kjv[7] = "For every one of the house of Israel, or of the stranger that sojourneth in Israel, which separateth himself from me, and setteth up his idols in his heart, and putteth the stumblingblock of his iniquity before his face, and cometh to a prophet to enquire of him concerning me; I the LORD will answer him by myself:";
kjv[8] = "And I will set my face against that man, and will make him a sign and a proverb, and I will cut him off from the midst of my people; and ye shall know that I [am] the LORD.";
kjv[9] = "And if the prophet be deceived when he hath spoken a thing, I the LORD have deceived that prophet, and I will stretch out my hand upon him, and will destroy him from the midst of my people Israel.";
kjv[10] = "And they shall bear the punishment of their iniquity: the punishment of the prophet shall be even as the punishment of him that seeketh [unto him];";
kjv[11] = "That the house of Israel may go no more astray from me, neither be polluted any more with all their transgressions; but that they may be my people, and I may be their God, saith the Lord GOD.";
kjv[12] = "The word of the LORD came again to me, saying,";
kjv[13] = "Son of man, when the land sinneth against me by trespassing grievously, then will I stretch out mine hand upon it, and will break the staff of the bread thereof, and will send famine upon it, and will cut off man and beast from it:";
kjv[14] = "Though these three men, Noah, Daniel, and Job, were in it, they should deliver [but] their own souls by their righteousness, saith the Lord GOD.";
kjv[15] = "If I cause noisome beasts to pass through the land, and they spoil it, so that it be desolate, that no man may pass through because of the beasts:";
kjv[16] = "[Though] these three men [were] in it, [as] I live, saith the Lord GOD, they shall deliver neither sons nor daughters; they only shall be delivered, but the land shall be desolate.";
kjv[17] = "Or [if] I bring a sword upon that land, and say, Sword, go through the land; so that I cut off man and beast from it:";
kjv[18] = "Though these three men [were] in it, [as] I live, saith the Lord GOD, they shall deliver neither sons nor daughters, but they only shall be delivered themselves.";
kjv[19] = "Or [if] I send a pestilence into that land, and pour out my fury upon it in blood, to cut off from it man and beast:";
kjv[20] = "Though Noah, Daniel, and Job, [were] in it, [as] I live, saith the Lord GOD, they shall deliver neither son nor daughter; they shall [but] deliver their own souls by their righteousness.";
kjv[21] = "For thus saith the Lord GOD; How much more when I send my four sore judgments upon Jerusalem, the sword, and the famine, and the noisome beast, and the pestilence, to cut off from it man and beast?";
kjv[22] = "Yet, behold, therein shall be left a remnant that shall be brought forth, [both] sons and daughters: behold, they shall come forth unto you, and ye shall see their way and their doings: and ye shall be comforted concerning the evil that I have brought upon Jerusalem, [even] concerning all that I have brought upon it.";
kjv[23] = "And they shall comfort you, when ye see their ways and their doings: and ye shall know that I have not done without cause all that I have done in it, saith the Lord GOD.";

vul[16] = "tres viri isti qui fuerint in ea vivo ego dicit Dominus Deus quia nec filios nec filias liberabunt sed ipsi soli liberabuntur terra autem desolabitur";
rsv[17] = "Or if I bring a sword upon that land, and say, Let a sword go through the land; and I cut off from it man and beast;";
asv[17] = "Or if I bring a sword upon that land, and say, Sword, go through the land; so that I cut off from it man and beast;";
yng[17] = "`Or -- a sword I bring in against that land, and I have said: Sword, thou dost pass over through the land, and I have cut off from it man and beast --";
dby[17] = "Or [if] I bring the sword upon that land, and say, Sword, go through the land, so that I cut off man and beast from it,";
web[17] = "Or [if] I bring a sword upon that land, and say, Sword, go through the land; so that I cut off man and beast from it:";
hnv[17] = "Or if I bring a sword on that land, and say, Sword, go through the land; so that I cut off from it man and animal;";
vul[17] = "vel si gladium induxero super terram illam et dixero gladio transi per terram et interfecero de ea hominem et iumentum";
rsv[18] = "though these three men were in it, as I live, says the Lord GOD, they would deliver neither sons nor daughters, but they alone would be delivered.";
asv[18] = "though these three men were in it, as I live, saith the Lord Jehovah, they should deliver neither sons nor daughters, but they only should be delivered themselves.";
yng[18] = "and these three men in its midst: I live -- an affirmation of the Lord Jehovah -- they deliver not sons and daughters, for they alone are delivered.";
dby[18] = "and these three men should be in it, [as] I live, saith the Lord Jehovah, they should deliver neither sons nor daughters, but they only themselves should be delivered.";
web[18] = "Though these three men [were] in it, [as] I live, saith the Lord GOD, they shall deliver neither sons nor daughters, but they only shall be delivered themselves.";
hnv[18] = " though these three men were in it, as I live, says the Lord GOD, they should deliver neither sons nor daughters, but they only should be delivered themselves.";
vul[18] = "et tres viri isti fuerint in medio eius vivo ego dicit Dominus Deus non liberabunt filios neque filias sed ipsi soli liberabuntur";
rsv[19] = "Or if I send a pestilence into that land, and pour out my wrath upon it with blood, to cut off from it man and beast;";
asv[19] = "Or if I send a pestilence into that land, and pour out my wrath upon it in blood, to cut off from it man and beast;";
yng[19] = "`Or -- pestilence I send unto that land, and I have poured out My fury against it in blood, to cut off from it man and beast --";
dby[19] = "Or [if] I send a pestilence into that land, and pour out my fury upon it in blood, to cut off from it man and beast,";
web[19] = "Or [if] I send a pestilence into that land, and pour out my fury upon it in blood, to cut off from it man and beast:";
hnv[19] = "Or if I send a pestilence into that land, and pour out my wrath on it in blood, to cut off from it man and animal;";
vul[19] = "si autem et pestilentiam inmisero super terram illam et effudero indignationem meam super eam in sanguine ut auferam ex ea hominem et iumentum";
rsv[20] = "even if Noah, Daniel, and Job were in it, as I live, says the Lord GOD, they would deliver neither son nor daughter; they would deliver but their own lives by their righteousness.";
asv[20] = "though Noah, Daniel, and Job, were in it, as I live, saith the Lord Jehovah, they should deliver neither son nor daughter; they should but deliver their own souls by their righteousness.";
yng[20] = "and Noah, Daniel, and Job, in its midst: I live -- an affirmation of the Lord Jehovah -- neither son nor daughter do they deliver; they, by their righteousness, deliver their own soul.";
dby[20] = "and Noah, Daniel, and Job should be in it, [as] I live, saith the Lord Jehovah, they should deliver neither son nor daughter: they should [but] deliver their own souls by their righteousness.";
web[20] = "Though Noah, Daniel, and Job, [were] in it, [as] I live, saith the Lord GOD, they shall deliver neither son nor daughter; they shall deliver their own souls only by their righteousness.";
hnv[20] = "though Noach, Daniyel, and Iyov, were in it, as I live, says the Lord GOD, they should deliver neither son nor daughter; they should but deliver their own souls by their righteousness.";
vul[20] = "et Noe et Danihel et Iob fuerint in medio eius vivo ego dicit Dominus Deus quia filium et filiam non liberabunt sed ipsi iustitia sua liberabunt animas suas";
rsv[21] = "&quot;For thus says the Lord GOD: How much more when I send upon Jerusalem my four sore acts of judgment, sword, famine, evil beasts, and pestilence, to cut off from it man and beast!";
asv[21] = "For thus saith the Lord Jehovah: How much more when I send my four sore judgments upon Jerusalem, the sword, and the famine, and the evil beasts, and the pestilence, to cut off from it man and beast!";
yng[21] = "`For thus said the Lord Jehovah: Although My four sore judgments -- sword, and famine, and wild beast, and pestilence -- I have sent unto Jerusalem, to cut off from it man and beast,";
dby[21] = "For thus saith the Lord Jehovah: How much more when I send my four sore judgments upon Jerusalem, the sword, and the famine, and the evil beast, and the pestilence, to cut off from it man and beast!";
web[21] = "For thus saith the Lord GOD; How much more when I send my four severe judgments upon Jerusalem, the sword, and the famine, and the noisome beast, and the pestilence, to cut off from it man and beast?";
hnv[21] = "For thus says the Lord GOD: How much more when I send my four sore judgments on Yerushalayim, the sword, and the famine, and the evil animals, and the pestilence, to cut off from it man and animal!";
vul[21] = "quoniam haec dicit Dominus Deus quod si et quattuor iudicia mea pessima gladium et famem et bestias malas et pestilentiam misero in Hierusalem ut interficiam de ea hominem et pecus";
rsv[22] = "Yet, if there should be left in it any survivors to lead out sons and daughters, when they come forth to you, and you see their ways and their doings, you will be consoled for the evil that I have brought upon Jerusalem, for all that I have brought upon it.";
asv[22] = "Yet, behold, therein shall be left a remnant that shall be carried forth, both sons and daughters: behold, they shall come forth unto you, and ye shall see their way and their doings; and ye shall be comforted concerning the evil that I have brought upon Jerusalem, even concerning all that I have brought upon it.";
yng[22] = "yet, lo, there hath been left in it an escape, who are brought forth, sons and daughters, lo, they are coming forth unto you, and ye have seen their way, and their doings, and have been comforted concerning the evil that I have brought in against Jerusalem, all that which I have brought in against it.";
dby[22] = "But behold, there shall be left in it those that escape, who shall be brought out of [it], sons and daughters. Behold, they shall come forth unto you, and ye shall see their way and their doings; and ye shall be comforted concerning the evil that I have brought upon Jerusalem, as to all that I have brought upon it.";
web[22] = "Yet behold, therein shall be left a remnant that shall be brought forth, [both] sons and daughters: behold, they shall come forth to you, and ye shall see their way and their doings: and ye shall be comforted concerning the evil that I have brought upon Jerusalem, [even] concerning all that I have brought upon it.";
hnv[22] = " Yet, behold, therein shall be left a remnant that shall be carried forth, both sons and daughters: behold, they shall come forth to you, and you shall see their way and their doings; and you shall be comforted concerning the evil that I have brought on Yerushalayim, even concerning all that I have brought on it.";
vul[22] = "tamen relinquetur in ea salvatio educentium filios et filias ecce ipsi egredientur ad vos et videbitis viam eorum et adinventiones eorum et consolabimini super malo quod induxi in Hierusalem in omnibus quae inportavi super eam";
rsv[23] = "They will console you, when you see their ways and their doings; and you shall know that I have not done without cause all that I have done in it, says the Lord GOD.&quot;";
asv[23] = "And they shall comfort you, when ye see their way and their doings; and ye shall know that I have not done without cause all that I have done in it, saith the Lord Jehovah.";
yng[23] = "And they have comforted you, for ye see their way and their doings, and ye have known that not for nought have I done all that which I have done in her -- an affirmation of the Lord Jehovah.\'";
dby[23] = "And they shall comfort you, when ye see their way and their doings; and ye shall know that I have not done without cause all that I have done in it, saith the Lord Jehovah.";
web[23] = "And they shall comfort you, when ye see their ways and their doings: and ye shall know that I have not done without cause all that I have done in it, saith the Lord GOD.";
hnv[23] = "They shall comfort you, when you see their way and their doings; and you shall know that I have not done without cause all that I have done in it, says the Lord GOD.";
vul[23] = "et consolabuntur vos cum videritis viam eorum et adinventiones eorum et cognoscetis quod non frustra fecerim omnia quae feci in ea ait Dominus Deus";
</script>
