csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, say to the ruler of Tyre, \'This is what the Lord GOD says: Your heart is proud, and you have said, &quot;I am a god; I sit in the seat of gods in the heart of the sea.&quot; Yet you are a man and not a god, though you have regarded your heart as that of a god.";
csb[3] = "Yes, you are wiser than Daniel; no secret is hidden from you!";
csb[4] = "By your wisdom and understanding you have acquired wealth for yourself. You have acquired gold and silver for your treasuries.";
csb[5] = "By your great skill in trading you have increased your wealth, but your heart has become proud because of your wealth.";
csb[6] = "&quot; \'Therefore, this is what the Lord GOD says: Because you regard your heart as that of a god,";
csb[7] = "&quot;I am about to bring strangers against you, ruthless men from the nations. They will draw their swords against your magnificent wisdom and will pierce your splendor.";
csb[8] = "&quot;They will bring you down to the Pit, and you will die a violent death in the heart of the sea.";
csb[9] = "&quot;Will you still say, &quot;I am a god,&quot; in the presence of those who slay you? Yet you will be only a man, not a god, in the hands of those who kill you.";
csb[10] = "You will die the death of the uncircumcised at the hands of strangers. For I have spoken. This is the declaration of the Lord GOD.\' &quot;";
csb[11] = "The word of the LORD came to me:";
csb[12] = "&quot;Son of man, lament for the king of Tyre and say to him, \'This is what the Lord GOD says: You were the seal of perfection, full of wisdom and perfect in beauty.";
csb[13] = "&quot;You were in Eden, the garden of God. Every kind of precious stone covered you: carnelian, topaz, and diamond, beryl, onyx, and jasper, lapis lazuli, turquoise and emerald. Your mountings and settings were crafted in gold; they were prepared on the day you were created.";
csb[14] = "&quot;You were an anointed guardian cherub, for I had appointed you. You were on the holy mountain of God; you walked among the fiery stones.";
csb[15] = "&quot;From the day you were created you were blameless in your ways until wickedness was found in you.";
csb[16] = "&quot;Through the abundance of your trade, you were filled with violence, and you sinned. So I expelled you in disgrace from the mountain of God, and banished you, guardian cherub, from among the fiery stones.";
csb[17] = "&quot;Your heart became proud because of your beauty; For the sake of your splendor you corrupted your wisdom. So I threw you down to the ground; I made you a spectacle before kings.";
csb[18] = "&quot;You profaned your sanctuaries by the magnitude of your iniquities in your dishonest trade. So I made fire come from within you, and it consumed you. I reduced you to ashes on the ground in the sight of everyone watching you.";
csb[19] = "&quot;All those who know you among the peoples are appalled at you. You have become an object of horror and will never exist again.\' &quot;";
csb[20] = "The word of the LORD came to me:";
csb[21] = "&quot;Son of man, face Sidon and prophesy against it.";
csb[22] = "&quot;You are to say, \'This is what the Lord GOD says: Look! I am against you, Sidon, and I will display my glory within you. They will know that I am the LORD when I execute judgments against her and demonstrate my holiness through her.";
csb[23] = "&quot;I will send a plague against her and bloodshed in her streets; the slain will fall within her, while the sword is against her on every side. Then they will know that I am the LORD.";
csb[24] = "&quot; \'The house of Israel will no longer be hurt by prickly briers or painful thorns from all their neighbors who treat them with contempt. Then they will know that I am the Lord GOD.";
csb[25] = "&quot; \'This is what the Lord GOD says: When I gather the house of Israel from the peoples where they are scattered, I will demonstrate my holiness through them in the sight of the nations, and they will live in their own land, which I gave to my servant Jacob.";
csb[26] = "&quot;They will live there securely, build houses, and plant vineyards. They will live securely when I execute judgments against all their neighbors who treat them with contempt. Then they will know that I am the LORD their God.\' &quot;";
kjv[1] = "The word of the LORD came again unto me, saying,";
kjv[2] = "Son of man, say unto the prince of Tyrus, Thus saith the Lord GOD; Because thine heart [is] lifted up, and thou hast said, I [am] a God, I sit [in] the seat of God, in the midst of the seas; yet thou [art] a man, and not God, though thou set thine heart as the heart of God:";
kjv[3] = "Behold, thou [art] wiser than Daniel; there is no secret that they can hide from thee:";
kjv[4] = "With thy wisdom and with thine understanding thou hast gotten thee riches, and hast gotten gold and silver into thy treasures:";
kjv[5] = "By thy great wisdom [and] by thy traffick hast thou increased thy riches, and thine heart is lifted up because of thy riches:";
kjv[6] = "Therefore thus saith the Lord GOD; Because thou hast set thine heart as the heart of God;";
kjv[7] = "Behold, therefore I will bring strangers upon thee, the terrible of the nations: and they shall draw their swords against the beauty of thy wisdom, and they shall defile thy brightness.";
kjv[8] = "They shall bring thee down to the pit, and thou shalt die the deaths of [them that are] slain in the midst of the seas.";
kjv[9] = "Wilt thou yet say before him that slayeth thee, I [am] God? but thou [shalt be] a man, and no God, in the hand of him that slayeth thee.";
kjv[10] = "Thou shalt die the deaths of the uncircumcised by the hand of strangers: for I have spoken [it], saith the Lord GOD.";
kjv[11] = "Moreover the word of the LORD came unto me, saying,";
kjv[12] = "Son of man, take up a lamentation upon the king of Tyrus, and say unto him, Thus saith the Lord GOD; Thou sealest up the sum, full of wisdom, and perfect in beauty.";
kjv[13] = "Thou hast been in Eden the garden of God; every precious stone [was] thy covering, the sardius, topaz, and the diamond, the beryl, the onyx, and the jasper, the sapphire, the emerald, and the carbuncle, and gold: the workmanship of thy tabrets and of thy pipes was prepared in thee in the day that thou wast created.";
kjv[14] = "Thou [art] the anointed cherub that covereth; and I have set thee [so]: thou wast upon the holy mountain of God; thou hast walked up and down in the midst of the stones of fire.";
kjv[15] = "Thou [wast] perfect in thy ways from the day that thou wast created, till iniquity was found in thee.";
kjv[16] = "By the multitude of thy merchandise they have filled the midst of thee with violence, and thou hast sinned: therefore I will cast thee as profane out of the mountain of God: and I will destroy thee, O covering cherub, from the midst of the stones of fire.";
kjv[17] = "Thine heart was lifted up because of thy beauty, thou hast corrupted thy wisdom by reason of thy brightness: I will cast thee to the ground, I will lay thee before kings, that they may behold thee.";
kjv[18] = "Thou hast defiled thy sanctuaries by the multitude of thine iniquities, by the iniquity of thy traffick; therefore will I bring forth a fire from the midst of thee, it shall devour thee, and I will bring thee to ashes upon the earth in the sight of all them that behold thee.";
kjv[19] = "All they that know thee among the people shall be astonished at thee: thou shalt be a terror, and never [shalt] thou [be] any more.";
kjv[20] = "Again the word of the LORD came unto me, saying,";
kjv[21] = "Son of man, set thy face against Zidon, and prophesy against it,";
kjv[22] = "And say, Thus saith the Lord GOD; Behold, I [am] against thee, O Zidon; and I will be glorified in the midst of thee: and they shall know that I [am] the LORD, when I shall have executed judgments in her, and shall be sanctified in her.";
kjv[23] = "For I will send into her pestilence, and blood into her streets; and the wounded shall be judged in the midst of her by the sword upon her on every side; and they shall know that I [am] the LORD.";
kjv[24] = "And there shall be no more a pricking brier unto the house of Israel, nor [any] grieving thorn of all [that are] round about them, that despised them; and they shall know that I [am] the Lord GOD.";
kjv[25] = "Thus saith the Lord GOD; When I shall have gathered the house of Israel from the people among whom they are scattered, and shall be sanctified in them in the sight of the heathen, then shall they dwell in their land that I have given to my servant Jacob.";
kjv[26] = "And they shall dwell safely therein, and shall build houses, and plant vineyards; yea, they shall dwell with confidence, when I have executed judgments upon all those that despise them round about them; and they shall know that I [am] the LORD their God.";

web[17] = "Thy heart was lifted up because of thy beauty, thou hast corrupted thy wisdom by reason of thy brightness: I will cast thee to the ground, I will lay thee before kings, that they may behold thee.";
hnv[17] = "Your heart was lifted up because of your beauty; you have corrupted your wisdom by reason of your brightness: I have cast you to the ground; I have laid you before kings, that they may see you.";
vul[17] = "elevatum est cor tuum in decore tuo perdidisti sapientiam tuam in decore tuo in terram proieci te ante faciem regum dedi te ut cernerent te";
rsv[18] = "By the multitude of your iniquities, in the unrighteousness of your trade you profaned your sanctuaries; so I brought forth fire from the midst of you; it consumed you, and I turned you to ashes upon the earth in the sight of all who saw you.";
asv[18] = "By the multitude of thine iniquities, in the unrighteousness of thy traffic, thou hast profaned thy sanctuaries; therefore have I brought forth a fire from the midst of thee; it hath devoured thee, and I have turned thee to ashes upon the earth in the sight of all them that behold thee.";
yng[18] = "From the abundance of thy iniquity, By the perversity of thy traffic, Thou hast polluted thy sanctuaries, And I bring forth fire from thy midst, It hath devoured thee, And I make thee become ashes on the earth, Before the eyes of all beholding thee.";
dby[18] = "By the multitude of thine iniquities, by the unrighteousness of thy traffic, thou hast profaned thy sanctuaries: and I have brought forth a fire out of the midst of thee -- it hath consumed thee; and I have brought thee to ashes upon the earth, in the sight of all them that behold thee.";
web[18] = "Thou hast defiled thy sanctuaries by the multitude of thy iniquities, by the iniquity of thy traffick; therefore will I bring forth a fire from the midst of thee, it shall devour thee, and I will bring thee to ashes upon the earth in the sight of all them that behold thee.";
hnv[18] = "By the multitude of your iniquities, in the unrighteousness of your traffic, you have profaned your sanctuaries; therefore have I brought forth a fire from the midst of you; it has devoured you, and I have turned you to ashes on the eretz in the sight of all those who see you.";
vul[18] = "in multitudine iniquitatum tuarum et iniquitate negotiationis tuae polluisti sanctificationem tuam producam ergo ignem de medio tui qui comedat te et dabo te in cinerem super terram in conspectu omnium videntium te";
rsv[19] = "All who know you among the peoples are appalled at you; you have come to a dreadful end and shall be no more for ever.&quot;";
asv[19] = "All they that know thee among the peoples shall be astonished at thee: thou art become a terror, and thou shalt nevermore have any being.";
yng[19] = "All knowing thee among the peoples Have been astonished at thee, Wastes thou hast been, and thou art not -- to the age.\'";
dby[19] = "All they that know thee among the peoples shall be amazed at thee: thou art become a terror, and thou shalt never be any more.";
web[19] = "All they that know thee among the people shall be astonished at thee: thou shalt be a terror, and never [shalt] thou [be] any more.";
hnv[19] = "All those who know you among the peoples shall be astonished at you: you are become a terror, and you shall nevermore have any being.";
vul[19] = "omnes qui viderint te in gentibus obstupescent super te nihili factus es et non eris in perpetuum";
rsv[20] = "The word of the LORD came to me:";
asv[20] = "And the word of Jehovah came unto me, saying,";
yng[20] = "And there is a word of Jehovah unto me, saying,";
dby[20] = "And the word of Jehovah came unto me, saying,";
web[20] = "Again the word of the LORD came to me, saying,";
hnv[20] = "The word of the LORD came to me, saying,";
vul[20] = "et factus est sermo Domini ad me dicens";
rsv[21] = "&quot;Son of man, set your face toward Sidon, and prophesy against her";
asv[21] = "Son of man, set thy face toward Sidon, and prophesy against it,";
yng[21] = "`Son of man, set thy face unto Zidon, and prophesy concerning it;";
dby[21] = "Son of man, set thy face towards Zidon, and prophesy against it,";
web[21] = "Son of man, set thy face against Zidon, and prophesy against it,";
hnv[21] = "Son of man, set your face toward Tzidon, and prophesy against it,";
vul[21] = "fili hominis pone faciem tuam contra Sidonem et prophetabis de ea";
rsv[22] = "and say, Thus says the Lord GOD: &quot;Behold, I am against you, O Sidon, and I will manifest my glory in the midst of you. And they shall know that I am the LORD when I execute judgments in her, and manifest my holiness in her;";
asv[22] = "and say, Thus saith the Lord Jehovah: Behold, I am against thee, O Sidon; and I will be glorified in the midst of thee; and they shall know that I am Jehovah, when I shall have executed judgments in her, and shall be sanctified in her.";
yng[22] = "and thou hast said: Thus said the Lord Jehovah: Lo, I [am] against thee, O Zidon, And I have been honoured in thy midst, And they have known that I [am] Jehovah, In My doing in her judgments, And I have been sanctified in her.";
dby[22] = "and say, Thus saith the Lord Jehovah: Behold, I am against thee, Zidon, and I will be glorified in the midst of thee; and they shall know that I [am] Jehovah, when I shall have executed judgments in her, and shall be hallowed in her.";
web[22] = "And say, Thus saith the Lord GOD; Behold, I [am] against thee, O Zidon; and I will be glorified in the midst of thee: and they shall know that I [am] the LORD, when I shall have executed judgments in her, and shall be sanctified in her.";
hnv[22] = "and say, Thus says the Lord GOD: Behold, I am against you, Tzidon; and I will be glorified in the midst of you; and they shall know that I am the LORD, when I shall have executed judgments in her, and shall be sanctified in her.";
vul[22] = "et dices haec dicit Dominus Deus ecce ego ad te Sidon et glorificabor in medio tui et scient quia ego Dominus cum fecero in ea iudicia et sanctificatus fuero in ea";
rsv[23] = "for I will send pestilence into her, and blood into her streets; and the slain shall fall in the midst of her, by the sword that is against her on every side. Then they will know that I am the LORD.";
asv[23] = "For I will send pestilence into her, and blood into her streets; and the wounded shall fall in the midst of her, with the sword upon her on every side; and they shall know that I am Jehovah.";
yng[23] = "And I have sent into her pestilence, And blood into her out-places, The wounded hath been judged in her midst, By the sword upon her round about, And they have known that I [am] Jehovah.";
dby[23] = "And I will send into her the pestilence, and blood in her streets; and the wounded shall fall in the midst of her, by the sword upon her on every side: and they shall know that I [am] Jehovah.";
web[23] = "For I will send into her pestilence, and blood into her streets; and the wounded shall be judged in the midst of her by the sword upon her on every side; and they shall know that I [am] the LORD.";
hnv[23] = " For I will send pestilence into her, and blood into her streets; and the wounded shall fall in the midst of her, with the sword on her on every side; and they shall know that I am the LORD.";
vul[23] = "et inmittam ei pestilentiam et sanguinem in plateis eius et corruent interfecti in medio eius gladio per circuitum et scient quia ego Dominus";
rsv[24] = "&quot;And for the house of Israel there shall be no more a brier to prick or a thorn to hurt them among all their neighbors who have treated them with contempt. Then they will know that I am the Lord GOD.";
asv[24] = "And there shall be no more a pricking brier unto the house of Israel, nor a hurting thorn of any that are round about them, that did despite unto them; and they shall know that I am the Lord Jehovah.";
yng[24] = "And there is no more to the house of Israel A pricking brier, and paining thorn, Of all round about them -- despising them, And they have known that I [am] the Lord Jehovah.";
dby[24] = "And there shall be no more a wounding sting for the house of Israel, nor any grieving thorn, among all that were round about them, that despised them: and they shall know that I [am] the Lord Jehovah.";
web[24] = "And there shall be no more a pricking brier to the house of Israel, nor [any] grieving thorn of all [that are] around them, that despised them; and they shall know that I [am] the Lord GOD.";
hnv[24] = "There shall be no more a pricking brier to the house of Yisra\'el, nor a hurting thorn of any that are round about them, that did despite to them; and they shall know that I am the Lord GOD.";
vul[24] = "et non erit ultra domui Israhel offendiculum amaritudinis et spina dolorem inferens undique per circuitum eorum qui adversantur eis et scient quia ego Dominus Deus";
rsv[25] = "&quot;Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they are scattered, and manifest my holiness in them in the sight of the nations, then they shall dwell in their own land which I gave to my servant Jacob.";
asv[25] = "Thus saith the Lord Jehovah: When I shall have gathered the house of Israel from the peoples among whom they are scattered, and shall be sanctified in them in the sight of the nations, then shall they dwell in their own land which I gave to my servant Jacob.";
yng[25] = "Thus said the Lord Jehovah: In My gathering the house of Israel, Out of the peoples among whom they were scattered, I have been sanctified in them, Before the eyes of the nations, And they have dwelt on their ground, That I gave to My servant, to Jacob,";
dby[25] = "Thus saith the Lord Jehovah: When I shall have gathered the house of Israel from the peoples among whom they are scattered, and shall be hallowed in them in the sight of the nations, then shall they dwell in their land which I have given to my servant Jacob.";
web[25] = "Thus saith the Lord GOD; When I shall have gathered the house of Israel from the people among whom they are scattered, and shall be sanctified in them in the sight of the heathen, then shall they dwell in their land that I have given to my servant Jacob.";
hnv[25] = "Thus says the Lord GOD: When I shall have gathered the house of Yisra\'el from the peoples among whom they are scattered, and shall be sanctified in them in the sight of the nations, then shall they dwell in their own land which I gave to my servant Ya`akov.";
vul[25] = "haec dicit Dominus Deus quando congregavero domum Israhel de populis in quibus dispersi sunt sanctificabor in eis coram gentibus et habitabunt in terra sua quam dedi servo meo Iacob";
rsv[26] = "And they shall dwell securely in it, and they shall build houses and plant vineyards. They shall dwell securely, when I execute judgments upon all their neighbors who have treated them with contempt. Then they will know that I am the LORD their God.&quot;";
asv[26] = "And they shall dwell securely therein; yea, they shall build houses, and plant vineyards, and shall dwell securely, when I have executed judgments upon all those that do them despite round about them; and they shall know that I am Jehovah their God.";
yng[26] = "And they have dwelt on it confidently, And builded houses, and planted vineyards, And dwelt confidently -- in My doing judgments, On all those despising them round about, And they have known that I, Jehovah, [am] their God!\'";
dby[26] = "They shall dwell in it in safety, and shall build houses and plant vineyards; and they shall dwell in safety, when I have executed judgments upon all those that despised them round about them: and they shall know that I [am] Jehovah their God.";
web[26] = "And they shall dwell safely therein, and shall build houses, and plant vineyards; yes, they shall dwell with confidence, when I have executed judgments upon all those that despise them around them; and they shall know that I [am] the LORD their God.";
hnv[26] = "They shall dwell securely therein; yes, they shall build houses, and plant vineyards, and shall dwell securely, when I have executed judgments on all those who do them despite round about them; and they shall know that I am the LORD their God.";
vul[26] = "et habitabunt in ea securi et aedificabunt domos plantabuntque vineas et habitabunt confidenter cum fecero iudicia in omnibus qui adversantur eis per circuitum et scient quia ego Dominus Deus eorum";
