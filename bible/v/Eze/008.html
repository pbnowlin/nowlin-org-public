csb[1] = "In the sixth year, in the sixth month, on the fifth day of the month, I was sitting in my house and the elders of Judah were sitting in front of me, and there the hand of the Lord GOD came down on me.";
csb[2] = "I looked, and there was someone who looked like a man. From what seemed to be his waist down was fire, and from his waist up was something that looked bright, like the gleam of amber.";
csb[3] = "He stretched out what appeared to be a hand and took me by the hair of my head. Then the Spirit lifted me up between earth and heaven and carried me in visions of God to Jerusalem, to the entrance of the inner gate that faces north, where the offensive statue that provokes jealousy was located.";
csb[4] = "I saw the glory of the God of Israel there, like the vision I had seen in the plain.";
csb[5] = "The LORD said to me, &quot;Son of man, look toward the north.&quot; I looked to the north, and there was this offensive statue north of the Altar Gate, at the entrance.";
csb[6] = "He said to me, &quot;Son of man, do you see what they are doing here -- more detestable acts that the house of Israel is committing -- so that I must depart from my sanctuary? You will see even more detestable acts.&quot;";
csb[7] = "Then he brought me to the entrance of the court, and when I looked there was a hole in the wall.";
csb[8] = "He said to me, &quot;Son of man, dig through the wall.&quot; So I dug through the wall and discovered a doorway.";
csb[9] = "He said to me, &quot;Go in and see the detestable, wicked acts they are committing here.&quot;";
csb[10] = "I went in and looked, and there engraved all around the wall was every kind of abhorrent thing -- crawling creatures and beasts -- as well as all the idols of the house of Israel.";
csb[11] = "Seventy elders from the house of Israel were standing before them, with Jaazaniah son of Shaphan standing among them. Each had a firepan in his hand, and a fragrant cloud of incense was rising up.";
csb[12] = "He said to me, &quot;Son of man, do you see what the elders of the house of Israel are doing in the darkness, each at the shrine of his idol? For they are saying, \'The LORD does not see us. The LORD has abandoned the land.\' &quot;";
csb[13] = "Again he said to me, &quot;You will see even more detestable acts that they are committing.&quot;";
csb[14] = "Then he brought me to the entrance of the north gate of the LORD\'s house, and I saw women sitting there weeping for Tammuz.";
csb[15] = "And he said to me, &quot;Do you see this, son of man? You will see even more detestable acts than these.&quot;";
csb[16] = "So he brought me to the inner court of the LORD\'s house, and there were about twenty-five men at the entrance of the LORD\'s temple, between the portico and the altar, with their backs to the LORD\'s temple and their faces turned to the east. They were bowing to the east in worship of the sun.";
csb[17] = "And he said to me, &quot;Do you see this, son of man? Is it not enough for the house of Judah to commit the detestable acts they are doing here, that they must also fill the land with violence and repeatedly anger me, even putting the branch to their nose?";
csb[18] = "&quot;Therefore I will respond with wrath. I will not show pity or spare them. Though they call loudly in my hearing, I will not listen to them.&quot;";

kjv[17] = "Then he said unto me, Hast thou seen [this], O son of man? Is it a light thing to the house of Judah that they commit the abominations which they commit here? for they have filled the land with violence, and have returned to provoke me to anger: and, lo, they put the branch to their nose.";
rsv[17] = "Then he said to me, &quot;Have you seen this, O son of man? Is it too slight a thing for the house of Judah to commit the abominations which they commit here, that they should fill the land with violence, and provoke me further to anger? Lo, they put the branch to their nose.";
asv[17] = "Then he said unto me, Hast thou seen [this], O son of man? Is it a light thing to the house of Judah that they commit the abominations which they commit here? for they have filled the land with violence, and have turned again to provoke me to anger: and, lo, they put the branch to their nose.";
yng[17] = "And He saith unto me, `Hast thou seen, son of man? hath it been a light thing to the house of Judah to do the abomination that they have done here, that they have filled the land with violence, and turn back to provoke Me to anger? and lo, they are putting forth the branch unto their nose!";
dby[17] = "And he said unto me, Seest thou, son of man? Is it a light thing to the house of Judah to commit the abominations which they commit here, that they yet fill the land with violence, and keep provoking me afresh to anger? And behold, they put the branch to their nose.";
web[17] = "Then he said to me, Hast thou seen [this], O son of man? Is it a light thing to the house of Judah that they commit the abominations which they commit here? for they have filled the land with violence, and have returned to provoke me to anger: and lo, they put the branch to their nose.";
hnv[17] = "Then he said to me, Have you seen [this], son of man? Is it a light thing to the house of Yehudah that they commit the abominations which they commit here? for they have filled the land with violence, and have turned again to provoke me to anger: and, behold, they put the branch to their nose.";
vul[17] = "et dixit ad me certe vidisti fili hominis numquid leve est hoc domui Iuda ut facerent abominationes istas quas fecerunt hic quia replentes terram iniquitate conversi sunt ad inritandum me et ecce adplicant ramum ad nares suas";
kjv[18] = "Therefore will I also deal in fury: mine eye shall not spare, neither will I have pity: and though they cry in mine ears with a loud voice, [yet] will I not hear them.";
