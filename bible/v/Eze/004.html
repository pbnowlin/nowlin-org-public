csb[1] = "&quot;Now you, son of man, take a brick, set it in front of you, and draw the city of Jerusalem on it.";
csb[2] = "&quot;Then lay siege against it: Construct a siege wall, build a ramp, pitch military camps, and place battering rams against it on all sides.";
csb[3] = "&quot;Take an iron plate and set it up as an iron wall between yourself and the city. Face it so that it is under siege, and besiege it. This will be a sign for the house of Israel.";
csb[4] = "&quot;Then lie down on your left side and place the iniquity of the house of Israel on it. You will bear their iniquity for the number of days you lie on your side.";
csb[5] = "&quot;For I have assigned you the years of their iniquity according to the number of days you lie down, 390 days; so you will bear the iniquity of the house of Israel.";
csb[6] = "&quot;When you have completed these days, lie down again, but on your right side, and bear the iniquity of the house of Judah. I have assigned you forty days, a day for each year.";
csb[7] = "&quot;Face the siege of Jerusalem with your arm bared, and prophesy against it.";
csb[8] = "&quot;Be aware that I will put cords on you so you cannot turn from side to side until you have finished the days of your siege.";
csb[9] = "&quot;Also take wheat, barley, beans, lentils, millet, and spelt. Put them in a single container and make them into bread for yourself. You are to eat it during the number of days you lie on your side, 390 days.";
csb[10] = "&quot;The food you eat each day will weigh eight ounces; you will eat it at set times.";
csb[11] = "&quot;You will also drink a ration of water, a sixth of a gallon, which you will drink at set times.";
csb[12] = "&quot;You will eat it as you would a barley cake and bake it over dried human excrement in their sight.&quot;";
csb[13] = "The LORD said, &quot;This is how the Israelites will eat their bread -- ceremonially unclean -- among the nations where I will banish them.&quot;";
csb[14] = "But I said, &quot;Oh, Lord GOD, I have never been defiled. From my youth until now I have not eaten anything that died naturally or was mauled by wild beasts. And impure meat has never entered my mouth.&quot;";
csb[15] = "He replied to me, &quot;Look, I will let you use cow dung instead of human excrement, and you can make your bread over that.&quot;";
csb[16] = "He said to me, &quot;Son of man, I am going to cut off the supply of bread in Jerusalem. They will anxiously eat food they have weighed out and in dread drink rationed water";
csb[17] = "&quot;for lack of bread and water. Everyone will be devastated and waste away because of their iniquity.";
kjv[1] = "Thou also, son of man, take thee a tile, and lay it before thee, and pourtray upon it the city, [even] Jerusalem:";

hnv[1] = "You also, son of man, take a tile, and lay it before you, and portray on it a city, even Yerushalayim:";
vul[1] = "et tu fili hominis sume tibi laterem et pones eum coram te et describes in eo civitatem Hierusalem";

yng[2] = "and hast placed against it a siege, and builded against it a fortification, and poured out against it a mount, and placed against it camps, yea, set thou against it battering-rams round about.";

vul[2] = "et ordinabis adversus eam obsidionem et aedificabis munitiones et conportabis aggerem et dabis contra eam castra et pones arietes in gyro";
kjv[3] = "Moreover take thou unto thee an iron pan, and set it [for] a wall of iron between thee and the city: and set thy face against it, and it shall be besieged, and thou shalt lay siege against it. This [shall be] a sign to the house of Israel.";
rsv[3] = "And take an iron plate, and place it as an iron wall between you and the city; and set your face toward it, and let it be in a state of siege, and press the siege against it. This is a sign for the house of Israel.";
asv[3] = "And take thou unto thee an iron pan, and set it for a wall of iron between thee and the city: and set thy face toward it, and it shall be besieged, and thou shalt lay siege against it. This shall be a sign to the house of Israel.";
yng[3] = "And thou, take to thee an iron pan, and thou hast made it a wall of iron between thee and the city; and thou hast prepared thy face against it, and it hath been in a siege, yea, thou hast laid siege against it. A sign it [is] to the house of Israel.";
dby[3] = "And take thou unto thee an iron plate, and put it [for] a wall of iron between thee and the city; and set thy face against it, and it shall be besieged, and thou shalt lay siege against it: this shall be a sign to the house of Israel.";

hnv[3] = "Take for yourself an iron pan, and set it for a wall of iron between you and the city: and set your face toward it, and it shall be besieged, and you shall lay siege against it. This shall be a sign to the house of Yisra\'el.";
vul[3] = "et tu sume tibi sartaginem ferream et pones eam murum ferreum inter te et inter civitatem et obfirmabis faciem tuam ad eam et erit in obsidionem et circumdabis eam signum est domui Israhel";

rsv[9] = "&quot;And you, take wheat and barley, beans and lentils, millet and spelt, and put them into a single vessel, and make bread of them. During the number of days that you lie upon your side, three hundred and ninety days, you shall eat it.";

dby[9] = "And thou, take unto thee wheat, and barley, and beans, and lentils, and millet, and spelt, and put them in one vessel, and make thee bread thereof, [according to] the number of the days that thou liest upon thy side: three hundred and ninety days shalt thou eat thereof.";

kjv[14] = "Then said I, Ah Lord GOD! behold, my soul hath not been polluted: for from my youth up even till now have I not eaten of that which dieth of itself, or is torn in pieces; neither came there abominable flesh into my mouth.";
rsv[14] = "Then I said, &quot;Ah Lord GOD! behold, I have never defiled myself; from my youth up till now I have never eaten what died of itself or was torn by beasts, nor has foul flesh come into my mouth.&quot;";

yng[14] = "And I say, `Ah, Lord Jehovah, lo, my soul is not defiled, and carcase, and torn thing, I have not eaten from my youth, even till now; nor come into my mouth hath abominable flesh.\'";
dby[14] = "Then said I, Ah, Lord Jehovah! behold, my soul hath not been defiled, and from my youth up even until now have I not eaten of that which dieth of itself, or of that which is torn; neither came there abominable flesh into my mouth.";
web[14] = "Then said I, Ah Lord GOD! behold, my soul hath not been polluted: for from my youth even till now have I not eaten of that which dieth of itself, or is torn in pieces; neither hath abominable flesh come into my mouth.";
hnv[14] = "Then said I, Ah Lord GOD! behold, my soul has not been polluted; for from my youth up even until now have I not eaten of that which dies of itself, or is torn of animals; neither came there abominable flesh into my mouth.";
vul[14] = "et dixi ha ha ha Domine Deus ecce anima mea non est polluta et morticinum et laceratum a bestiis non comedi ab infantia mea usque nunc et non est ingressa os meum omnis caro inmunda";

dby[15] = "And he said unto me, See, I have given thee cow\'s dung for man\'s dung, and thou shalt prepare thy bread therewith.";

hnv[15] = "Then he said to me, Behold, I have given you cow\'s dung for man\'s dung, and you shall prepare your bread thereon.";
vul[15] = "et dixit ad me ecce dedi tibi fimum boum pro stercoribus humanis et facies panem tuum in eo";

rsv[16] = "Moreover he said to me, &quot;Son of man, behold, I will break the staff of bread in Jerusalem; they shall eat bread by weight and with fearfulness; and they shall drink water by measure and in dismay.";

yng[16] = "And He saith unto me, `Son of man, lo, I am breaking the staff of bread in Jerusalem, and they have eaten bread by weight and with fear; and water by measure and with astonishment, they do drink;";
dby[16] = "And he said unto me, Son of man, behold, I break the staff of bread in Jerusalem; and they shall eat bread by weight, and with anxiety; and they shall drink water by measure, and with astonishment:";
web[16] = "Moreover he said to me, Son of man, behold, I will break the staff of bread in Jerusalem: and they shall eat bread by weight, and with care; and they shall drink water by measure, and with astonishment.";
hnv[16] = "Moreover he said to me, Son of man, behold, I will break the staff of bread in Yerushalayim: and they shall eat bread by weight, and with fearfulness; and they shall drink water by measure, and in dismay:";
vul[16] = "et dixit ad me fili hominis ecce ego conteram baculum panis in Hierusalem et comedent panem in pondere et in sollicitudine et aquam in mensura et in angustia bibent";
kjv[17] = "That they may want bread and water, and be astonied one with another, and consume away for their iniquity.";
rsv[17] = "I will do this that they may lack bread and water, and look at one another in dismay, and waste away under their punishment.";
asv[17] = "that they may want bread and water, and be dismayed one with another, and pine away in their iniquity.";
yng[17] = "so that they lack bread and water, and have been astonished one with another, and been consumed in their iniquity.";
dby[17] = "because bread and water shall fail them, and they shall be astonied one with another, and waste away in their iniquity.";
web[17] = "That they may want bread and water, and be astonished one with another, and consume away for their iniquity.";
hnv[17] = "that they may want bread and water, and be dismayed one with another, and pine away in their iniquity.";
