csb[1] = "He led me to the gate, the one that faces east,";
csb[2] = "and I saw the glory of the God of Israel coming from the east. His voice sounded like the roar of a huge torrent, and the earth shone with his glory.";
csb[3] = "The vision I saw was like the one I had seen when he came to destroy the city, and like the ones I had seen by the Chebar Canal. I fell facedown.";
csb[4] = "The glory of the LORD entered the temple by way of the gate that faced east.";
csb[5] = "Then the Spirit lifted me up and brought me to the inner court, and the glory of the LORD filled the temple.";
csb[6] = "While the man was standing beside me, I heard someone speaking to me from the temple.";
csb[7] = "He said to me: &quot;Son of man, this is the place of my throne and the place for the soles of my feet, where I will dwell among the Israelites forever. The house of Israel and their kings will no longer defile my holy name by their religious prostitution and by the corpses of their kings at their high places.";
csb[8] = "&quot;Whenever they placed their threshold next to my threshold and their doorposts beside my doorposts, with only a wall between me and them, they were defiling my holy name by the detestable acts they committed. So I destroyed them in my anger.";
csb[9] = "&quot;Now let them remove their prostitution and the corpses of their kings far from me, and I will dwell among them forever.";
csb[10] = "&quot;As for you, son of man, describe the temple to the house of Israel, so that they may be ashamed of their iniquities. Let them measure its pattern,";
csb[11] = "&quot;and they will be ashamed of all that they have done. Reveal the design of the temple to them -- its layout with its exits and entrances -- its complete design along with all its statutes, design specifications, and laws. Write it down in their sight so that they may observe its complete design and all its statutes and may carry them out.";
csb[12] = "&quot;This is the law of the temple: All its surrounding territory on top of the mountain will be especially holy. Yes, this is the law of the temple.";
csb[13] = "&quot;These are the measurements of the altar in units of length (each unit being the standard length plus three inches): The gutter is 21 inches deep and 21 inches wide, with a rim of nine inches around its edge. This is the base of the altar.";
csb[14] = "&quot;The distance from the gutter on the ground to the lower ledge is 3 1/2 feet, and the width of the ledge is 21 inches. There are 7 feet from the small ledge to the large ledge, whose width is also 21 inches.";
csb[15] = "&quot;The altar hearth is 7 feet high, and four horns project upward from the hearth.";
csb[16] = "&quot;The hearth is square, 21 feet long by 21 feet wide.";
csb[17] = "&quot;The ledge is 24 1/2 feet long by 24 1/2 feet wide, with four equal sides. The rim all around it is 10 1/2 inches, and its gutter is 21 inches all around it. The altar\'s steps face east.&quot;";
csb[18] = "Then he said to me: &quot;Son of man, this is what the Lord GOD says: These are the statutes for the altar on the day it is constructed, so that burnt offerings may be sacrificed on it and blood may be splattered on it:";
csb[19] = "&quot;You are to give a bull from the herd as a sin offering to the Levitical priests who are from the offspring of Zadok, who approach me in order to serve me.&quot; This is the declaration of the Lord GOD.";
csb[20] = "&quot;You are to take some of its blood and apply it to the four horns of the altar, the four corners of the ledge, and all around the rim. In this way you will purify the altar and make atonement for it.";
csb[21] = "&quot;Then you are to take away the bull for the sin offering, and it must be burned outside the sanctuary in the place appointed for the temple.";
csb[22] = "&quot;On the second day you are to present an unblemished male goat as a sin offering. They will purify the altar just as they did with the bull.";
csb[23] = "&quot;When you have finished the purification, you are to present a young, unblemished bull and an unblemished ram from the flock.";
csb[24] = "&quot;You are to present them before the LORD; the priests will throw salt on them and sacrifice them as a burnt offering to the LORD.";
csb[25] = "&quot;You will offer a goat for a sin offering each day for seven days. A young bull and a ram from the flock, both unblemished, are also to be offered.";
csb[26] = "&quot;For seven days the priests are to make atonement for the altar and cleanse it. In this way they will consecrate it";
csb[27] = "&quot;and complete the days of purification. Then on the eighth day and afterward, the priests will offer your burnt offerings and fellowship offerings on the altar, and I will accept you.&quot; This is the declaration of the Lord GOD.";

kjv[3] = "And [it was] according to the appearance of the vision which I saw, [even] according to the vision that I saw when I came to destroy the city: and the visions [were] like the vision that I saw by the river Chebar; and I fell upon my face.";

dby[3] = "And the appearance of the vision that I saw was according to the vision that I had seen when I came to destroy the city; and the visions were like the vision that I saw by the river Chebar: and I fell upon my face.";

kjv[7] = "And he said unto me, Son of man, the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever, and my holy name, shall the house of Israel no more defile, [neither] they, nor their kings, by their whoredom, nor by the carcases of their kings in their high places.";
rsv[7] = "and he said to me, &quot;Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell in the midst of the people of Israel for ever. And the house of Israel shall no more defile my holy name, neither they, nor their kings, by their harlotry, and by the dead bodies of their kings,";
asv[7] = "And he said unto me, Son of man, [this is] the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever. And the house of Israel shall no more defile my holy name, neither they, nor their kings, by their whoredom, and by the dead bodies of their kings [in] their high places;";
yng[7] = "and He saith unto me: `Son of man, the place of My throne, And the place of the soles of My feet, Where I dwell in the midst of the sons of Israel to the age, Defile no more do the house of Israel My holy name, They, and their kings, by their whoredom, And by the carcases of their kings -- their high places.";
dby[7] = "And he said unto me, Son of man, [this is] the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever; and the house of Israel shall no more defile my holy name, they nor their kings, with their fornication, and with the carcases of their kings [in] their high places,";
web[7] = "And he said to me, Son of man, the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever, and my holy name, shall the house of Israel no more defile, [neither] they, nor their kings, by their lewd deeds, nor by the carcasses of their kings in their high places.";
hnv[7] = "He said to me, Son of man, [this is] the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Yisra\'el forever. The house of Yisra\'el shall no more defile my holy name, neither they, nor their kings, by their prostitution, and by the dead bodies of their kings [in] their high places;";
vul[7] = "dixit ad me fili hominis locus solii mei et locus vestigiorum pedum meorum ubi habito in medio filiorum Israhel in aeternum et non polluent ultra domus Israhel nomen sanctum meum ipsi et reges eorum in fornicationibus suis et in ruinis regum suorum et in excelsis";
kjv[8] = "In their setting of their threshold by my thresholds, and their post by my posts, and the wall between me and them, they have even defiled my holy name by their abominations that they have committed: wherefore I have consumed them in mine anger.";
rsv[8] = "by setting their threshold by my threshold and their doorposts beside my doorposts, with only a wall between me and them. They have defiled my holy name by their abominations which they have committed, so I have consumed them in my anger.";
asv[8] = "in their setting of their threshold by my threshold, and their door-post beside my door-post, and there was [but] the wall between me and them; and they have defiled my holy name by their abominations which they have committed: wherefore I have consumed them in mine anger.";
yng[8] = "In their putting their threshold with My threshold, And their door-post near My door-post, And the wall between Me and them, And they have defiled My holy name, By their abominations that they have done, And I consume them in Mine anger.";
dby[8] = "in that they set their threshold by my threshold, and their post by my post, and [there was only] a wall between me and them, and they defiled my holy name with their abominations which they committed; and I consumed them in mine anger.";

hnv[8] = "in their setting of their threshold by my threshold, and their door-post beside my door-post, and there was [but] the wall between me and them; and they have defiled my holy name by their abominations which they have committed: therefore I have consumed them in my anger.";
vul[8] = "qui fabricati sunt limen suum iuxta limen meum et postes suos iuxta postes meos et murus erat inter me et eos et polluerunt nomen sanctum meum in abominationibus quas fecerunt propter quod consumpsi eos in ira mea";
kjv[9] = "Now let them put away their whoredom, and the carcases of their kings, far from me, and I will dwell in the midst of them for ever.";

dby[9] = "Now let them put away their fornication, and the carcases of their kings, far from me, and I will dwell in the midst of them for ever.";

kjv[10] = "Thou son of man, shew the house to the house of Israel, that they may be ashamed of their iniquities: and let them measure the pattern.";
rsv[10] = "&quot;And you, son of man, describe to the house of Israel the temple and its appearance and plan, that they may be ashamed of their iniquities.";
asv[10] = "Thou, son of man, show the house to the house of Israel, that they may be ashamed of their iniquities; and let them measure the pattern.";
yng[10] = "Thou, son of man, Shew the house of Israel the house, And they are ashamed of their iniquities, And they have measured the measurement.";
dby[10] = "Thou, son of man, shew the house to the house of Israel, that they may be confounded at their iniquities; and let them measure the pattern.";
web[10] = "Thou son of man, show the house to the house of Israel, that they may be ashamed of their iniquities: and let them measure the pattern.";
hnv[10] = "You, son of man, show the house to the house of Yisra\'el, that they may be ashamed of their iniquities; and let them measure the pattern.";
vul[10] = "tu autem fili hominis ostende domui Israhel templum et confundantur ab iniquitatibus suis et metiantur fabricam";
kjv[11] = "And if they be ashamed of all that they have done, shew them the form of the house, and the fashion thereof, and the goings out thereof, and the comings in thereof, and all the forms thereof, and all the ordinances thereof, and all the forms thereof, and all the laws thereof: and write [it] in their sight, that they may keep the whole form thereof, and all the ordinances thereof, and do them.";
rsv[11] = "And if they are ashamed of all that they have done, portray the temple, its arrangement, its exits and its entrances, and its whole form; and make known to them all its ordinances and all its laws; and write it down in their sight, so that they may observe and perform all its laws and all its ordinances.";
asv[11] = "And if they be ashamed of all that they have done, make known unto them the form of the house, and the fashion thereof, and the egresses thereof, and the entrances thereof, and all the forms thereof, and all the ordinances thereof, and all the forms thereof, and all the laws thereof; and write it in their sight; that they may keep the whole form thereof, and all the ordinances thereof, and do them.";
yng[11] = "And since they have been ashamed of all that they have done, The form of the house, and its measurement, And its outlets, and its inlets, and all its forms, And all its statutes, even all its forms, And all its laws cause them to know, And write [it] before their eyes, And they observe all its forms, And all its statutes, and have done them.";
dby[11] = "And if they be confounded at all that they have done, make known to them the form of the house, and its fashion, and its goings out, and its comings in, and all its forms, and all its statutes, yea, all the forms thereof, and all the laws thereof; and write it in their sight, that they may keep the whole form thereof, and all the statutes thereof, and do them.";
web[11] = "And if they shall be ashamed of all that they have done, show them the form of the house, and the fashion of it, and its goings out, and its comings in, and all its forms, and all its ordinances, and all its forms, and all its laws: and write [it] in their sight, that they may keep the whole form of it, and all its ordinances, and do them.";
hnv[11] = "If they be ashamed of all that they have done, make known to them the form of the house, and the fashion of it, and the exits of it, and the entrances of it, and all the forms of it, and all the ordinances of it, and all the forms of it, and all the laws of it; and write it in their sight; that they may keep the whole form of it, and all the ordinances of it, and do them.";
vul[11] = "et erubescant ex omnibus quae fecerunt figuram domus et fabricae eius exitus et introitus et omnem descriptionem eius et universa praecepta eius cunctumque ordinem eius et omnes leges eius ostende eis et scribes in oculis eorum et custodiant omnes descriptiones eius et praecepta illius et faciant ea";

asv[12] = "This is the law of the house: upon the top of the mountain the whole limit thereof round about shall be most holy. Behold, this is the law of the house.";
yng[12] = "This [is] a law of the house: on the top of the mountain, all its border all round about [is] most holy; lo, this [is] a law of the house.";
dby[12] = "This is the law of the house: Upon the top of the mountain all its border round about is most holy. Behold, this is the law of the house.";
web[12] = "This [is] the law of the house; Upon the top of the mountain, the whole limit of it around [shall be] most holy. Behold, this [is] the law of the house.";
hnv[12] = "This is the law of the house: on the top of the mountain the whole limit of it round about shall be most holy. Behold, this is the law of the house.";
vul[12] = "ista est lex domus in summitate montis omnes fines eius in circuitu sanctum sanctorum est haec ergo est lex domus";
kjv[13] = "And these [are] the measures of the altar after the cubits: The cubit [is] a cubit and an hand breadth; even the bottom [shall be] a cubit, and the breadth a cubit, and the border thereof by the edge thereof round about [shall be] a span: and this [shall be] the higher place of the altar.";
rsv[13] = "&quot;These are the dimensions of the altar by cubits (the cubit being a cubit and a handbreadth): its base shall be one cubit high, and one cubit broad, with a rim of one span around its edge. And this shall be the height of the altar:";
asv[13] = "And these are the measures of the altar by cubits (the cubit is a cubit and a handbreadth): the bottom shall be a cubit, and the breadth a cubit, and the border thereof by the edge thereof round about a span; and this shall be the base of the altar.";
yng[13] = "`And these [are] measures of the altar by cubits: The cubit [is] a cubit and a handbreadth, and the centre [is] a cubit, and a cubit the breadth; and its border on its edge round about [is] one span, and this [is] the upper part of the altar.";
dby[13] = "And these are the measures of the altar in cubits: the cubit is a cubit and a hand breadth. The bottom was a cubit [in height] and the breadth a cubit, and its border on the edge thereof round about, one span: and this was the base of the altar.";
web[13] = "And these [are] the measures of the altar after the cubits: The cubit [is] a cubit and a hand-breadth; even the bottom [shall be] a cubit, and the breadth a cubit, and the border of it by its edge around [shall be] a span: and this [shall be] the higher place of the altar.";
hnv[13] = "These are the measures of the altar by cubits (the cubit is a cubit and a handbreadth): the bottom shall be a cubit, and the breadth a cubit, and the border of it by the edge of it round about a span; and this shall be the base of the altar.";
vul[13] = "istae autem mensurae altaris in cubito verissimo qui habebat cubitum et palmum in sinu eius erat cubitus et cubitus in latitudine et definitio usque ad labium eius in circuitu palmus unus haec quoque erat fossa altaris";
kjv[14] = "And from the bottom [upon] the ground [even] to the lower settle [shall be] two cubits, and the breadth one cubit; and from the lesser settle [even] to the greater settle [shall be] four cubits, and the breadth [one] cubit.";
rsv[14] = "from the base on the ground to the lower ledge, two cubits, with a breadth of one cubit; and from the smaller ledge to the larger ledge, four cubits, with a breadth of one cubit;";
asv[14] = "And from the bottom upon the ground to the lower ledge shall be two cubits, and the breadth one cubit; and from the lesser ledge to the greater ledge shall be four cubits, and the breadth a cubit.";
yng[14] = "And from the centre of the ground unto the lower border [is] two cubits, and the breadth one cubit, and from the lesser border unto the greater border four cubits, and the breadth a cubit.";
dby[14] = "And from the bottom upon the ground to the lower settle was two cubits, and the breadth one cubit; and from the small settle to the great settle, four cubits, and the breadth a cubit.";

hnv[14] = "From the bottom on the ground to the lower ledge shall be two cubits, and the breadth one cubit; and from the lesser ledge to the greater ledge shall be four cubits, and the breadth a cubit.";
vul[14] = "et de sinu terrae usque ad crepidinem novissimam duo cubiti et latitudo cubiti unius et a crepidine maiori usque ad crepidinem minorem quattuor cubiti et latitudo unius cubiti";

yng[15] = "`And the altar [is] four cubits, and from the altar and upward [are] four horns.";
dby[15] = "And the upper altar was four cubits; and from the hearth of God and upward were four horns.";
web[15] = "So the altar [shall be] four cubits; and from the altar and upward [shall be] four horns.";
hnv[15] = "The upper altar shall be four cubits; and from the altar hearth and upward there shall be four horns.";

kjv[16] = "And the altar [shall be] twelve [cubits] long, twelve broad, square in the four squares thereof.";
rsv[16] = "The altar hearth shall be square, twelve cubits long by twelve broad.";
asv[16] = "And the altar hearth shall be twelve [cubits] long by twelve broad, square in the four sides thereof.";
yng[16] = "And the altar [is] twelve long by twelve broad, square in its four squares.";
dby[16] = "And the hearth of God was twelve [cubits] long, by twelve broad, square in the four sides thereof.";
web[16] = "And the altar [shall be] twelve [cubits] long, twelve broad, square in the four squares of it.";
