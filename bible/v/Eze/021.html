csb[1] = "The word of the LORD came to me again:";
csb[2] = "&quot;Son of man, face Jerusalem and preach against the sanctuaries. Prophesy against the land of Israel,";
csb[3] = "&quot;and say to it, \'This is what the LORD says: I am against you. I will draw my sword from its sheath and cut off from you both the righteous and the wicked.";
csb[4] = "&quot;Since I will cut off both the righteous and the wicked, my sword will therefore come out of its sheath against all people from the south to the north.";
csb[5] = "&quot;So all people will know that I, the LORD, have taken my sword from its sheath -- it will not be sheathed again.\'";
csb[6] = "&quot;But you, son of man, groan! Groan bitterly with a broken heart right before their eyes.";
csb[7] = "&quot;And when they ask you, \'Why are you groaning? \' then say, \'Because of the news that is coming. Every heart will melt, and every hand will become weak. Every spirit will be discouraged, and all knees will run with urine. Yes, it is coming and it will happen. This is the declaration of the Lord GOD.\' &quot;";
csb[8] = "The word of the LORD came to me:";
csb[9] = "&quot;Son of man, prophesy, \'This is what the Lord says! \' You are to proclaim, \'A sword! A sword is sharpened and also polished.";
csb[10] = "&quot;It is sharpened for slaughter, polished to flash like lightning! Should we rejoice? The scepter of my son, the sword despises every tree.";
csb[11] = "&quot;The sword is given to be polished, to be grasped in the hand. It is sharpened, and it is polished, to be put in the hand of the slayer.\'";
csb[12] = "&quot;Cry out and wail, son of man, for it is against my people. It is against all the princes of Israel! They are given over to the sword with my people. Therefore strike your thigh in grief.";
csb[13] = "&quot;Surely it will be a trial! And what if the sword despises even the scepter? The scepter will not continue.&quot; This is the declaration of the Lord GOD.";
csb[14] = "&quot;So you, son of man, prophesy and clap your hands together: Let the sword strike two times, even three. It is a sword for massacre, a sword for great massacre -- it surrounds them!";
csb[15] = "&quot;I have appointed a sword for slaughter at all their gates, so that their hearts may melt and many may stumble. Yes! It is ready to flash like lightning; it is drawn for slaughter.";
csb[16] = "&quot;Slash to the right; turn to the left -- wherever your blade is directed.";
csb[17] = "&quot;I also will clap my hands together, and I will satisfy my wrath. I, the LORD, have spoken.&quot;";
csb[18] = "The word of the LORD came to me:";
csb[19] = "&quot;Now you, son of man, mark out two roads that the sword of Babylon\'s king can take. Both of them should originate from the same land. And make a signpost at the fork in the road to each city.";
csb[20] = "&quot;Mark out a road that the sword can take to Rabbah of the Ammonites and to Judah into fortified Jerusalem.";
csb[21] = "&quot;For the king of Babylon stands at the split in the road, at the fork of the two roads, to practice divination: he shakes the arrows, consults the idols, and observes the liver.";
csb[22] = "&quot;The answer marked Jerusalem appears in his right hand, indicating that he should set up battering rams, give the order to slaughter, raise a battle cry, set battering rams against the gates, build a ramp, and construct a siege wall.";
csb[23] = "&quot;It will seem like false divination to those who have sworn an oath to the Babylonians, but it will draw attention to their guilt so that they will be captured.";
csb[24] = "&quot;Therefore, this is what the Lord GOD says: Because you have drawn attention to your guilt, exposing your transgressions, so that your sins are revealed in all your actions -- since you have done this, you will be captured by them.";
csb[25] = "&quot;And you, profane and wicked prince of Israel, the day has come for your punishment.";
csb[26] = "&quot;This is what the Lord GOD says: Remove the turban, and take off the crown. Things will not remain as they are; exalt the lowly and bring down the exalted.";
csb[27] = "&quot;A ruin, a ruin, I will make it a ruin! Yet this will not happen until he comes; I have given the judgment to him.";
csb[28] = "&quot;Now you, son of man, prophesy, and say, \'This is what the Lord GOD says concerning the Ammonites and their contempt.\' You are to proclaim, \'A sword! A sword is drawn for slaughter, polished to consume, to flash like lightning.";
csb[29] = "&quot;While they offer false visions and lying divinations about you, the time has come to put you to the necks of the profane wicked ones; the day has come for final punishment.";
csb[30] = "&quot; \'Return it to its sheath! &quot; \'I will judge you in the place where you were created, in the land of your origin.";
csb[31] = "&quot;I will pour out my indignation on you; I will blow the fire of my fury on you. I will hand you over to brutal men, skilled at destruction.";
csb[32] = "&quot;You will be fuel for the fire. Your blood will be spilled within the land. You will not be remembered, for I, the LORD, have spoken.\' &quot;";

kjv[19] = "Also, thou son of man, appoint thee two ways, that the sword of the king of Babylon may come: both twain shall come forth out of one land: and choose thou a place, choose [it] at the head of the way to the city.";
rsv[19] = "&quot;Son of man, mark two ways for the sword of the king of Babylon to come; both of them shall come forth from the same land. And make a signpost, make it at the head of the way to a city;";
asv[19] = "Also, thou son of man, appoint thee two ways, that the sword of the king of Babylon may come; they twain shall come forth out of one land: and mark out a place, mark it out at the head of the way to the city.";
yng[19] = "`And thou, son of man, appoint for thee two ways, for the coming in of the sword of the king of Babylon; from one land they come forth, both of them, and a station prepare thou, at the top of the way of the city prepare [it].";
dby[19] = "And thou, son of man, set thee two ways, by which the sword of the king of Babylon may come -- out of one land shall they both come -- and make thee a signpost, make it at the head of the way to the city.";
web[19] = "Also, thou son of man, appoint thee two ways, that the sword of the king of Babylon may come: both [ways] shall come forth from one land: and choose thou a place, choose [it] at the head of the way to the city.";
hnv[19] = " Also, you son of man, appoint two ways, that the sword of the king of Bavel may come; they both shall come forth out of one land: and mark out a place, mark it out at the head of the way to the city.";
vul[19] = "et tu fili hominis pone tibi duas vias ut veniat gladius regis Babylonis de terra una egredientur ambo et manu capiet coniecturam in capite viae civitatis coniciet";
kjv[20] = "Appoint a way, that the sword may come to Rabbath of the Ammonites, and to Judah in Jerusalem the defenced.";
rsv[20] = "mark a way for the sword to come to Rabbah of the Ammonites and to Judah and to Jerusalem the fortified.";
asv[20] = "Thou shalt appoint a way for the sword to come to Rabbah of the children of Ammon, and to Judah in Jerusalem the fortified.";
yng[20] = "A way appoint for the coming of the sword, Unto Rabbath of the sons of Ammon, And to Judah, in Jerusalem -- the fenced.";
dby[20] = "Appoint a way for the coming of the sword to Rabbah of the children of Ammon, and to Judah at the fenced [city] of Jerusalem.";
web[20] = "Appoint a way, that the sword may come to Rabbah of the Ammonites, and to Judah in Jerusalem the fortified.";
hnv[20] = " You shall appoint a way for the sword to come to Rabbah of the children of `Ammon, and to Yehudah in Yerushalayim the fortified.";
vul[20] = "viam pones ut veniat gladius ad Rabbath filiorum Ammon et ad Iudam in Hierusalem munitissimam";
kjv[21] = "For the king of Babylon stood at the parting of the way, at the head of the two ways, to use divination: he made [his] arrows bright, he consulted with images, he looked in the liver.";
rsv[21] = "For the king of Babylon stands at the parting of the way, at the head of the two ways, to use divination; he shakes the arrows, he consults the teraphim, he looks at the liver.";
asv[21] = "For the king of Babylon stood at the parting of the way, at the head of the two ways, to use divination: he shook the arrows to and fro, he consulted the teraphim, he looked in the liver.";
yng[21] = "For stood hath the king of Babylon at the head of the way, At the top of the two ways, to use divination, He hath moved lightly with the arrows, He hath asked at the teraphim, He hath looked on the liver.";
dby[21] = "For the king of Babylon standeth at the parting of the way, at the head of the two ways, to use divination: he shaketh [his] arrows, he inquireth of the teraphim, he looketh in the liver.";
web[21] = "For the king of Babylon stood at the parting of the way, at the head of the two ways, to use divination; he made [his] arrows bright, he consulted with images, he looked in the liver.";
hnv[21] = "For the king of Bavel stood at the parting of the way, at the head of the two ways, to use divination: he shook the arrows back and forth, he consulted the terafim, he looked in the liver.";
vul[21] = "stetit enim rex Babylonis in bivio in capite duarum viarum divinationem quaerens commiscens sagittas interrogavit idola exta consuluit";
kjv[22] = "At his right hand was the divination for Jerusalem, to appoint captains, to open the mouth in the slaughter, to lift up the voice with shouting, to appoint [battering] rams against the gates, to cast a mount, [and] to build a fort.";
rsv[22] = "Into his right hand comes the lot for Jerusalem, to open the mouth with a cry, to lift up the voice with shouting, to set battering rams against the gates, to cast up mounds, to build siege towers.";
asv[22] = "In his right hand was the divination [for] Jerusalem, to set battering rams, to open the mouth in the slaughter, to lift up the voice with shouting, to set battering rams against the gates, to cast up mounds, to build forts.";
yng[22] = "At his right hath been the divination -- Jerusalem, To place battering-rams, To open the mouth with slaughter, To lift up a voice with shouting, To place battering-rams against the gates, To pour out a mount, to build a fortification.";
dby[22] = "In his right hand is the lot of Jerusalem to appoint battering-rams, to open the mouth for bloodshed, to lift up the voice with shouting, to appoint battering-rams against the gates, to cast mounds, to build siege-towers.";
web[22] = "At his right hand was the divination for Jerusalem, to appoint captains, to open the mouth in the slaughter, to lift up the voice with shouting, to appoint [battering] rams against the gates, to cast a mount, [and] to build a fort.";
hnv[22] = "In his right hand was the divination [for] Yerushalayim, to set battering rams, to open the mouth in the slaughter, to lift up the voice with shouting, to set battering rams against the gates, to cast up mounds, to build forts.";
vul[22] = "ad dextram eius facta est divinatio super Hierusalem ut ponat arietes ut aperiat os in caede ut elevet vocem in ululatu ut ponat arietes contra portas ut conportet aggerem ut aedificet munitiones";
kjv[23] = "And it shall be unto them as a false divination in their sight, to them that have sworn oaths: but he will call to remembrance the iniquity, that they may be taken.";
rsv[23] = "But to them it will seem like a false divination; they have sworn solemn oaths; but he brings their guilt to remembrance, that they may be captured.";
asv[23] = "And it shall be unto them as a false divination in their sight, who have sworn oaths unto them; but he bringeth iniquity to remembrance, that they may be taken.";
yng[23] = "And it hath been to them as a false divination in their eyes, Who have sworn oaths to them, And he is causing iniquity to be remembered to be caught.";
dby[23] = "And this shall be a false divination in their sight, for them that have sworn oaths; but he will call to remembrance the iniquity, that they may be taken.";
web[23] = "And it shall be to them as a false divination in their sight, to them that have sworn oaths: but he will call to remembrance the iniquity, that they may be taken.";
hnv[23] = "It shall be to them as a false divination in their sight, who have sworn oaths to them; but he brings iniquity to memory, that they may be taken.";
vul[23] = "eritque quasi consulens frustra oraculum in oculis eorum et sabbatorum otium imitans ipse autem recordabitur iniquitatis ad capiendum";
kjv[24] = "Therefore thus saith the Lord GOD; Because ye have made your iniquity to be remembered, in that your transgressions are discovered, so that in all your doings your sins do appear; because, [I say], that ye are come to remembrance, ye shall be taken with the hand.";
rsv[24] = "&quot;Therefore thus says the Lord GOD: Because you have made your guilt to be remembered, in that your transgressions are uncovered, so that in all your doings your sins appear--because you have come to remembrance, you shall be taken in them.";
asv[24] = "Therefore thus saith the Lord Jehovah: Because ye have made your iniquity to be remembered, in that your transgressions are uncovered, so that in all your doings your sins do appear; because that ye are come to remembrance, ye shall be taken with the hand.";
yng[24] = "Therefore, thus said the Lord Jehovah: Because of your causing your iniquity to be remembered, In your transgressions being revealed, For your sins being seen, in all your doings, Because of your being remembered, By the hand ye are caught.";
dby[24] = "Therefore thus saith the Lord Jehovah: Because ye make your iniquity to be remembered in that your transgressions are discovered, so that in all your doings your sins appear; because ye are come to remembrance, ye shall be taken with the hand.";
web[24] = "Therefore thus saith the Lord GOD; Because ye have made your iniquity to be remembered, in that your transgressions are disclosed, so that in all your doings your sins do appear; because, [I say], that ye are come to remembrance, ye shall be taken with the hand.";
hnv[24] = "Therefore thus says the Lord GOD: Because you have made your iniquity to be remembered, in that your transgressions are uncovered, so that in all your doings your sins do appear; because you have come to memory, you shall be taken with the hand.";
vul[24] = "idcirco haec dicit Dominus Deus pro eo quod recordati estis iniquitatis vestrae et revelastis praevaricationes vestras et apparuerunt peccata vestra in omnibus cogitationibus vestris pro eo inquam quod recordati estis manu capiemini";
kjv[25] = "And thou, profane wicked prince of Israel, whose day is come, when iniquity [shall have] an end,";
rsv[25] = "And you, O unhallowed wicked one, prince of Israel, whose day has come, the time of your final punishment,";
asv[25] = "And thou, O deadly wounded wicked one, the prince of Israel, whose day is come, in the time of the iniquity of the end,";
yng[25] = "And thou, wounded, wicked one, Prince of Israel, whose day hath come, In the time of the iniquity of the end!";
dby[25] = "And thou, profane, wicked prince of Israel, whose day is come, at the time of the iniquity of the end,";
web[25] = "And thou, profane wicked prince of Israel, whose day is come, when iniquity [shall have] an end,";
hnv[25] = "You, deadly wounded wicked one, the prince of Yisra\'el, whose day is come, in the time of the iniquity of the end,";
vul[25] = "tu autem profane impie dux Israhel cuius venit dies in tempore iniquitatis praefinita";
kjv[26] = "Thus saith the Lord GOD; Remove the diadem, and take off the crown: this [shall] not [be] the same: exalt [him that is] low, and abase [him that is] high.";
rsv[26] = "thus says the Lord GOD: Remove the turban, and take off the crown; things shall not remain as they are; exalt that which is low, and abase that which is high.";
asv[26] = "thus saith the Lord Jehovah: Remove the mitre, and take off the crown; this [shall be] no more the same; exalt that which is low, and abase that which is high.";
yng[26] = "Thus said the Lord Jehovah: Turn aside the mitre, and bear away the crown, This -- not this -- the low make high, And the high make low.";
dby[26] = "-- thus saith the Lord Jehovah: Remove the mitre and take off the crown; what is shall be no [more]. Exalt that which is low, and abase that which is high.";
web[26] = "Thus saith the Lord GOD; Remove the diadem, and take off the crown: this [shall] not [be] the same: exalt [him that is] low, and abase [him that is] high.";
hnv[26] = "thus says the Lord GOD: Remove the turban, and take off the crown; this [shall be] no more the same; exalt that which is low, and abase that which is high.";
vul[26] = "haec dicit Dominus Deus aufer cidarim tolle coronam nonne haec est quae humilem sublevavit et sublimem humiliavit";
kjv[27] = "I will overturn, overturn, overturn, it: and it shall be no [more], until he come whose right it is; and I will give it [him].";
rsv[27] = "A ruin, ruin, ruin I will make it; there shall not be even a trace of it until he comes whose right it is; and to him I will give it.";
asv[27] = "I will overturn, overturn, overturn it: this also shall be no more, until he come whose right it is; and I will give it [him].";
yng[27] = "An overturn, overturn, overturn, I make it, Also this hath not been till the coming of Him, Whose [is] the judgment, and I have given it.";
dby[27] = "I will overturn, overturn, overturn it! This also shall be no [more], until he come whose right it is; and I will give it [to him].";
web[27] = "I will overturn, overturn, overturn it: and it shall be no [more], until he cometh whose right it is; and I will give it [him].";
hnv[27] = "I will overturn, overturn, overturn it: this also shall be no more, until he come whose right it is; and I will give it [him].";
vul[27] = "iniquitatem iniquitatem iniquitatem ponam eam et hoc nunc factum est donec veniret cuius est iudicium et tradam ei";
kjv[28] = "And thou, son of man, prophesy and say, Thus saith the Lord GOD concerning the Ammonites, and concerning their reproach; even say thou, The sword, the sword [is] drawn: for the slaughter [it is] furbished, to consume because of the glittering:";
rsv[28] = "&quot;And you, son of man, prophesy, and say, Thus says the Lord GOD concerning the Ammonites, and concerning their reproach; say, A sword, a sword is drawn for the slaughter, it is polished to glitter and to flash like lightning--";
asv[28] = "And thou, son of man, prophesy, and say, Thus saith the Lord Jehovah concerning the children of Ammon, and concerning their reproach; and say thou, A sword, a sword is drawn, for the slaughter it is furbished, to cause it to devour, that it may be as lightning;";
yng[28] = "And thou, son of man, prophesy, and thou hast said: Thus said the Lord Jehovah concerning the sons of Ammon, and concerning their reproach: and thou hast said: A sword, a sword, open for slaughter, Polished to the utmost for brightness!";
dby[28] = "And thou, son of man, prophesy and say, Thus speaketh the Lord Jehovah concerning the children of Ammon, and concerning their reproach; and thou shalt say, A sword, a sword is drawn; for the slaughter is it furbished, that it may consume, that it may glitter:";
web[28] = "And thou, son of man, prophesy and say, Thus saith the Lord GOD concerning the Ammonites, and concerning their reproach; even say thou, The sword, the sword [is] drawn: for the slaughter [it is] furbished, to consume because of the glittering:";
hnv[28] = "You, son of man, prophesy, and say, Thus says the Lord GOD concerning the children of `Ammon, and concerning their reproach; and say you, A sword, a sword is drawn, for the slaughter it is furbished, to cause it to devour, that it may be as lightning;";
vul[28] = "et tu fili hominis propheta et dic haec dicit Dominus Deus ad filios Ammon et ad obprobrium eorum et dices mucro mucro evaginate ad occidendum limate ut interficias et fulgeas";
kjv[29] = "Whiles they see vanity unto thee, whiles they divine a lie unto thee, to bring thee upon the necks of [them that are] slain, of the wicked, whose day is come, when their iniquity [shall have] an end.";
rsv[29] = "while they see for you false visions, while they divine lies for you--to be laid on the necks of the unhallowed wicked, whose day has come, the time of their final punishment.";
asv[29] = "while they see for thee false visions, while they divine lies unto thee, to lay thee upon the necks of the wicked that are deadly wounded, whose day is come in the time of the iniquity of the end.";
yng[29] = "In the seeing for thee of a vain thing, In the divining for thee of a lie, To put thee on the necks of the wounded of the wicked, whose day hath come, In the time of the iniquity of the end.";
dby[29] = "whilst they see vanity for thee, whilst they divine a lie unto thee, to lay thee upon the necks of the wicked that are slain, whose day is come at the time of the iniquity of the end.";
web[29] = "While they see vanity to thee, while they divine a lie to thee, to bring thee upon the necks of [them that are] slain, of the wicked, whose day is come, when their iniquity [shall have] an end.";
hnv[29] = "while they see for you false visions, while they divine lies to you, to lay you on the necks of the wicked who are deadly wounded, whose day is come in the time of the iniquity of the end.";
vul[29] = "cum tibi viderentur vana et divinarentur mendacia ut dareris super colla vulneratorum impiorum quorum venit dies in tempore iniquitatis praefinita";
kjv[30] = "Shall I cause [it] to return into his sheath? I will judge thee in the place where thou wast created, in the land of thy nativity.";
rsv[30] = "Return it to its sheath. In the place where you were created, in the land of your origin, I will judge you.";
asv[30] = "Cause it to return into its sheath. In the place where thou wast created, in the land of thy birth, will I judge thee.";
yng[30] = "Turn [it] back unto its scabbard, In the place where thou wast produced, In the land of thy birth I do judge thee.";
dby[30] = "Restore [it] to its sheath. I will judge thee in the place where thou wast created, in the land of thy birth.";
web[30] = "Shall I cause [it] to return into its sheath? I will judge thee in the place where thou wast created, in the land of thy nativity.";
hnv[30] = "Cause it to return into its sheath. In the place where you were created, in the land of your birth, will I judge you.";
vul[30] = "revertere ad vaginam tuam in loco in quo creatus es in terra nativitatis tuae iudicabo te";
kjv[31] = "And I will pour out mine indignation upon thee, I will blow against thee in the fire of my wrath, and deliver thee into the hand of brutish men, [and] skilful to destroy.";
rsv[31] = "And I will pour out my indignation upon you; I will blow upon you with the fire of my wrath; and I will deliver you into the hands of brutal men, skilful to destroy.";
asv[31] = "And I will pour out mine indignation upon thee; I will blow upon thee with the fire of my wrath; and I will deliver thee into the hand of brutish men, skilful to destroy.";
yng[31] = "And I have poured on thee Mine indignation, With fire of My wrath I blow against thee, And have given thee into the hand of brutish men -- artificers of destruction.";
dby[31] = "And I will pour out mine indignation upon thee, I will blow upon thee the fire of my wrath, and give thee into the hand of brutish men, skilful to destroy.";
web[31] = "And I will pour out my indignation upon thee, I will blow against thee in the fire of my wrath, and deliver thee into the hand of brutish men, [and] skillful to destroy.";
hnv[31] = "I will pour out my indignation on you; I will blow on you with the fire of my wrath; and I will deliver you into the hand of brutish men, skillful to destroy.";
vul[31] = "et effundam super te indignationem meam in igne furoris mei sufflabo in te daboque te in manus hominum insipientium et fabricantium interitum";
kjv[32] = "Thou shalt be for fuel to the fire; thy blood shall be in the midst of the land; thou shalt be no [more] remembered: for I the LORD have spoken [it].";
rsv[32] = "You shall be fuel for the fire; your blood shall be in the midst of the land; you shall be no more remembered; for I the LORD have spoken.&quot;";
asv[32] = "Thou shalt be for fuel to the fire; thy blood shall be in the midst of the land; thou shalt be no more remembered: for I, Jehovah, have spoken it.";
yng[32] = "To the fire thou art for fuel, Thy blood is in the midst of the land, Thou art not remembered, For I, Jehovah, have spoken!\'";
dby[32] = "Thou shalt be for fuel to the fire; thy blood shall be in the midst of the land; thou shalt not be remembered: for I Jehovah have spoken.";
web[32] = "Thou shalt be for fuel to the fire; thy blood shall be in the midst of the land; thou shalt be no [more] remembered: for I the LORD have spoken [it].";
hnv[32] = "You shall be for fuel to the fire; your blood shall be in the midst of the land; you shall be no more remembered: for I, the LORD, have spoken it.";
vul[32] = "igni eris cibus sanguis tuus erit in medio terrae oblivioni traderis quia ego Dominus locutus sum";
