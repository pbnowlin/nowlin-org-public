csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, this is what the Lord GOD says to the land of Israel: An end! The end has come on the four corners of the earth.";
csb[3] = "&quot;The end is now upon you; I will send my anger against you and judge you according to your ways. I will punish you for all your detestable practices.";
csb[4] = "&quot;I will not look on you with pity or spare you, but I will punish you for your ways and for your detestable practices within you. Then you will know that I am the LORD.&quot;";
csb[5] = "This is what the Lord GOD says: Look, one disaster after another is coming!";
csb[6] = "An end has come; the end has come! It has awakened against you. Look, it is coming!";
csb[7] = "Doom has come on you, inhabitants of the land. The time has come; the day is near. There will be panic on the mountains and not celebration.";
csb[8] = "I will pour out my wrath on you very soon; I will exhaust my anger against you and judge you according to your ways. I will punish you for all your detestable practices.";
csb[9] = "I will not look on you with pity or spare you. I will punish you for your ways and for your detestable practices within you. Then you will know that it is I, the LORD, who strikes.";
csb[10] = "Here is the day! Here it comes! Doom is on its way. The rod has blossomed; arrogance has bloomed.";
csb[11] = "Violence has grown into a rod of wickedness. None of them will remain: none of that crowd, none of their wealth, and none of the eminent among them.";
csb[12] = "The time has come; the day has arrived. Let the buyer not rejoice and the seller not mourn, for wrath is on her whole crowd.";
csb[13] = "The seller will certainly not return to what was sold as long as he and the buyer remain alive. For the vision concerning her whole crowd will not be revoked, and because of the iniquity of each one, none will preserve his life.";
csb[14] = "They have blown the trumpet and prepared everything, but no one goes to war, for my wrath is on her whole crowd.";
csb[15] = "The sword is on the outside; plague and famine are on the inside. Whoever is in the field will die by the sword, and famine and plague will devour whoever is in the city.";
csb[16] = "The survivors among them will escape and live on the mountains. Like doves of the valley, all of them will moan, each over his own iniquity.";
csb[17] = "All their hands will become weak, and all their knees will run with urine.";
csb[18] = "They will put on sackcloth, and horror will overwhelm them. Shame will cover all their faces, and all their heads will be bald.";
csb[19] = "They will throw their silver into the streets, and their gold will seem like something filthy. Their silver and gold will be unable to save them in the day of the LORD\'s wrath. They will not satisfy their appetites or fill their stomachs, for these were the stumbling blocks that brought about their iniquity.";
csb[20] = "He appointed his beautiful ornaments for majesty, but they made their detestable images from them, their abhorrent things. Therefore, I have made these into something filthy to them.";
csb[21] = "I will hand these things over to foreigners as plunder and to the wicked of the earth as spoil, and they will profane them.";
csb[22] = "I will turn my face from them as they profane my treasured place. Violent men will enter it and profane it.";
csb[23] = "Forge the chain, for the land is filled with crimes of bloodshed, and the city is filled with violence.";
csb[24] = "So I will bring the most evil of nations to take possession of their houses. I will put an end to the pride of the strong, and their sacred places will be profaned.";
csb[25] = "Anguish is coming! They will look for peace, but there will be none.";
csb[26] = "Disaster after disaster will come, and there will be rumor after rumor. Then they will look for a vision from a prophet, but instruction will perish from the priests and counsel from the elders.";
csb[27] = "The king will mourn; the prince will be clothed in grief; and the hands of the people of the land will tremble. I will deal with them according to their own conduct, and I will judge them by their own standards. Then they will know that I am the LORD.";

vul[19] = "argentum eorum foris proicietur et aurum eorum in sterquilinium erit argentum eorum et aurum eorum non valebit liberare eos in die furoris Domini animam suam non saturabunt et ventres eorum non implebuntur quia scandalum iniquitatis eorum factum est";
kjv[20] = "As for the beauty of his ornament, he set it in majesty: but they made the images of their abominations [and] of their detestable things therein: therefore have I set it far from them.";
rsv[20] = "Their beautiful ornament they used for vainglory, and they made their abominable images and their detestable things of it; therefore I will make it an unclean thing to them.";
asv[20] = "As for the beauty of his ornament, he set it in majesty; but they made the images of their abominations [and] their detestable things therein: therefore have I made it unto them as an unclean thing.";
yng[20] = "As to the beauty of his ornament, For excellency He set it, And the images of their abominations, Their detestable things -- they made in it, Therefore I have given it to them for impurity,";
dby[20] = "And he set in majesty his beautiful ornament; but they made therein the images of their abominations [and] of their detestable things: therefore have I made it an impurity unto them.";

yng[22] = "And I have turned My face from them, And they have polluted My hidden place, Yea, come into it have destroyers, and polluted it.";

kjv[24] = "Wherefore I will bring the worst of the heathen, and they shall possess their houses: I will also make the pomp of the strong to cease; and their holy places shall be defiled.";
rsv[24] = "I will bring the worst of the nations to take possession of their houses; I will put an end to their proud might, and their holy places shall be profaned.";
asv[24] = "Wherefore I will bring the worst of the nations, and they shall possess their houses: I will also make the pride of the strong to cease; and their holy places shall be profaned.";
yng[24] = "And I have brought in the wicked of the nations, And they have possessed their houses, And I have caused to cease the excellency of the strong, And polluted have been those sanctifying them.";
dby[24] = "Therefore will I bring the worst of the nations, and they shall possess their houses; and I will make the pride of the strong to cease; and their sanctuaries shall be profaned.";

kjv[26] = "Mischief shall come upon mischief, and rumour shall be upon rumour; then shall they seek a vision of the prophet; but the law shall perish from the priest, and counsel from the ancients.";

asv[26] = "Mischief shall come upon mischief, and rumor shall be upon rumor; and they shall seek a vision of the prophet; but the law shall perish from the priest, and counsel from the elders.";
yng[26] = "Mischief on mischief cometh, and report is on report, And they have sought a vision from a prophet, And law doth perish from the priest, And counsel from the elders,";
dby[26] = "Mischief shall come upon mischief, and rumour shall be upon rumour; and they shall seek a vision from a prophet; but the law shall perish from the priest, and counsel from the elders.";

kjv[27] = "The king shall mourn, and the prince shall be clothed with desolation, and the hands of the people of the land shall be troubled: I will do unto them after their way, and according to their deserts will I judge them; and they shall know that I [am] the LORD.";
rsv[27] = "The king mourns, the prince is wrapped in despair, and the hands of the people of the land are palsied by terror. According to their way I will do to them, and according to their own judgments I will judge them; and they shall know that I am the LORD.&quot;";
asv[27] = "The king shall mourn, and the prince shall be clothed with desolation, and the hands of the people of the land shall be troubled: I will do unto them after their way, and according to their deserts will I judge them; and they shall know that I am Jehovah.";
yng[27] = "The king doth become a mourner, And a prince putteth on desolation, And the hands of the people of the land are troubled, From their own way I deal with them, And with their own judgments I judge them, And they have known that I [am] Jehovah!\'";
