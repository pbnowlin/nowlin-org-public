csb[1] = "The word of the LORD came to me again:";
csb[2] = "&quot;Son of man, there were two women, daughters of the same mother,";
csb[3] = "&quot;who acted like prostitutes in Egypt, behaving promiscuously in their youth. Their breasts were fondled there, and their virgin nipples caressed.";
csb[4] = "&quot;The older one was named Oholah, and her sister was Oholibah. They became mine and gave birth to sons and daughters. As for their names, Oholah represents Samaria and Oholibah represents Jerusalem.";
csb[5] = "&quot;Oholah acted like a prostitute even though she was mine. She lusted after her lovers, the Assyrians: warriors";
csb[6] = "&quot;dressed in blue, governors and prefects, all of them desirable young men, horsemen riding on steeds.";
csb[7] = "&quot;She offered her sexual favors to them; all of them were the elite of Assyria. She defiled herself with all those she lusted after and with all their idols.";
csb[8] = "&quot;She didn\'t give up her promiscuity that began in Egypt, when men slept with her in her youth, caressed her virgin nipples, and poured out their lust on her.";
csb[9] = "&quot;Therefore, I handed her over to her lovers, the Assyrians she lusted for.";
csb[10] = "&quot;They exposed her nakedness, seized her sons and daughters, and killed her with the sword. Since they executed judgment against her, she became notorious among women.";
csb[11] = "&quot;Now her sister Oholibah saw this, but she was even more depraved in her lust than Oholah, and made her promiscuous acts worse than those of her sister.";
csb[12] = "&quot;She lusted after the Assyrians: governors and prefects, warriors splendidly dressed, horsemen riding on steeds, all of them desirable young men.";
csb[13] = "&quot;And I saw that she had defiled herself; both of them had taken the same path.";
csb[14] = "&quot;But she increased her promiscuity when she saw male figures carved on the wall, images of the Chaldeans, engraved in bright red,";
csb[15] = "&quot;wearing belts on their waists and flowing turbans on their heads; all of them looked like officers, a depiction of the Babylonians in Chaldea, their native land.";
csb[16] = "&quot;At the sight of them she lusted after them and sent messengers to them in Chaldea.";
csb[17] = "&quot;Then the Babylonians came to her, to the bed of love, and defiled her with their lust. But after she was defiled by them, she turned away from them in disgust.";
csb[18] = "&quot;When she flaunted her promiscuity and exposed her nakedness, I turned away from her in disgust just as I turned away from her sister.";
csb[19] = "&quot;Yet she multiplied her acts of promiscuity, remembering the days of her youth when she acted like a prostitute in the land of Egypt";
csb[20] = "&quot;and lusted after their lovers, whose sexual members were like those of donkeys and whose emission was like that of stallions.";
csb[21] = "&quot;So you revisited the depravity of your youth, when the Egyptians caressed your nipples to enjoy your youthful breasts.";
csb[22] = "&quot;Therefore, Oholibah, this is what the Lord GOD says: I am going to incite your lovers against you, those you turned away from in disgust. I will bring them against you from every side:";
csb[23] = "&quot;the Babylonians and all the Chaldeans; Pekod, Shoa, and Koa; and all the Assyrians with them -- desirable young men, all of them governors and prefects, officers and administrators, all of them riding on steeds.";
csb[24] = "&quot;They will come against you with an assembly of peoples and with weapons, chariots, and wagons. They will set themselves against you on every side with large and small shields and helmets. I will delegate judgment to them, and they will judge you by their own standards.";
csb[25] = "&quot;When I vent my jealous rage on you, they will deal with you in wrath. They will cut off your nose and ears, and the rest of you will fall by the sword. They will seize your sons and daughters, and the rest of you will be consumed by fire.";
csb[26] = "&quot;They will strip off your clothes and take your beautiful jewelry.";
csb[27] = "&quot;So I will put an end to your depravity and sexual immorality, which began in the land of Egypt, and you will not look longingly at them or remember Egypt anymore.";
csb[28] = "&quot;For this is what the Lord GOD says: I am going to hand you over to those you hate, to those you turned away from in disgust.";
csb[29] = "&quot;They will treat you with hatred, take all you have worked for, and leave you stark naked, so that the shame of your debauchery will be exposed, both your depravity and promiscuity.";
csb[30] = "&quot;These things will be done to you because you acted like a prostitute with the nations, defiling yourself with their idols.";
csb[31] = "&quot;You have followed the path of your sister, so I will put her cup in your hand.&quot;";
csb[32] = "This is what the Lord GOD says: &quot;You will drink your sister\'s cup, which is deep and wide. You will be an object of ridicule and scorn, for it holds so much.";
csb[33] = "&quot;You will be filled with drunkenness and grief, with a cup of devastation and desolation, the cup of your sister Samaria.";
csb[34] = "&quot;You will drink it and drain it; then you will gnaw its broken pieces, and tear your breasts. For I have spoken.&quot; This is the declaration of the Lord GOD.";
csb[35] = "Therefore, this is what the Lord GOD says: &quot;Because you have forgotten me and cast me behind your back, you must bear the consequences of your indecency and promiscuity.&quot;";
csb[36] = "Then the LORD said to me: &quot;Son of man, will you pass judgment against Oholah and Oholibah? Then declare their detestable practices to them.";
csb[37] = "&quot;For they have committed adultery, and blood is on their hands; they have committed adultery with their idols. And the children they bore to me they have sacrificed in the fire as food for the idols.";
csb[38] = "&quot;They also did this to me: they defiled my sanctuary on that same day and profaned my Sabbaths.";
csb[39] = "&quot;On the same day they slaughtered their children for their idols, they entered my sanctuary to profane it. Yes, that is what they did inside my house.";
csb[40] = "&quot;In addition, they sent for men who came from far away when a messenger was dispatched to them. And look how they came! You bathed, painted your eyes, and adorned yourself with jewelry for them.";
csb[41] = "&quot;You sat on a luxurious couch with a table spread before it, on which you had set my incense and oil.";
csb[42] = "&quot;The sound of a carefree crowd was there. Drunkards from the desert were brought in, along with common men. They put bracelets on the women\'s hands and beautiful tiaras on their heads.";
csb[43] = "&quot;Then I said concerning this woman worn out by adultery: Will they now have illicit sex with her, even her?";
csb[44] = "&quot;Yet they had sex with her as one does with a prostitute. This is how they had sex with Oholah and Oholibah, those depraved women.";
csb[45] = "&quot;But righteous men will judge them the way adulteresses and those who shed blood are judged, for they are adulteresses and blood is on their hands.";
csb[46] = "&quot;This is what the Lord GOD says: Summon an assembly against them and consign them to terror and plunder.";
csb[47] = "&quot;The assembly will stone them and cut them down with their swords. They will kill their sons and daughters and burn their houses.";
csb[48] = "&quot;So I will put an end to depravity in the land, and all the women will be admonished not to imitate your depraved behavior.";
csb[49] = "&quot;They will punish you for your depravity, and you will bear the consequences for your sins of idolatry. Then you will know that I am the Lord GOD.&quot;";

vul[38] = "sed et hoc fecerunt mihi polluerunt sanctuarium meum in die illa et sabbata mea profanaverunt";

asv[41] = "and sit upon a stately bed, with a table prepared before it, whereupon thou didst set mine incense and mine oil.";
yng[41] = "And thou hast sat on a couch of honour, And a table arrayed before it, And My perfume and My oil placed on it.";

asv[42] = "And the voice of a multitude being at ease was with her: and with men of the common sort were brought drunkards from the wilderness; and they put bracelets upon the hands of them [twain], and beautiful crowns upon their heads.";
yng[42] = "And the voice of a multitude at ease [is] with her, And unto men of the common people are brought in Sabeans from the wilderness, And they put bracelets on their hands, And a beauteous crown on their heads.";
dby[42] = "And the voice of a multitude living carelessly was with her; and with people of the common sort were brought Sabeans from the wilderness, and they put bracelets upon their hands, and a beautiful crown upon their heads.";

kjv[43] = "Then said I unto [her that was] old in adulteries, Will they now commit whoredoms with her, and she [with them]?";
rsv[43] = "&quot;Then I said, Do not men now commit adultery when they practice harlotry with her?";
asv[43] = "Then said I of her that was old in adulteries, Now will they play the harlot with her, and she [with them].";
yng[43] = "And I say of the worn-out one in adulteries, Now they commit her whoredoms -- she also!";
dby[43] = "And I said of her that was old in adulteries, Will she now commit her fornications, even she.";
web[43] = "Then said I to [her that was] old in adulteries, Will they now commit lewd deeds with her, and she [with them]?";
hnv[43] = "Then said I of her who was old in adulteries, Now will they play the prostitute with her, and she [with them].";
vul[43] = "et dixi ei quae adtrita est in adulteriis nunc fornicabitur in fornicatione sua etiam haec";
kjv[44] = "Yet they went in unto her, as they go in unto a woman that playeth the harlot: so went they in unto Aholah and unto Aholibah, the lewd women.";
rsv[44] = "For they have gone in to her, as men go in to a harlot. Thus they went in to Oho\'lah and to Ohol\'ibah to commit lewdness.";
asv[44] = "And they went in unto her, as they go in unto a harlot: so went they in unto Oholah and unto Oholibah, the lewd women.";
yng[44] = "And they come in unto her, As the coming in unto a whorish woman, So they have come in unto Aholah, And unto Aholibah -- the wicked women.";
dby[44] = "And they went in unto her, as they go in unto a whorish woman: so went they in unto Oholah and unto Oholibah the lewd women.";
web[44] = "Yet they went in to her, as they go in to a woman that playeth the harlot: so they went in to Aholah and to Aholibah, the lewd women.";
hnv[44] = "They went in to her, as they go in to a prostitute: so went they in to Oholah and to Oholivah, the lewd women.";
vul[44] = "et ingressi sunt ad eam quasi ad mulierem meretricem sic ingrediebantur ad Oollam et ad Oolibam mulieres nefarias";
