csb[1] = "The man then brought me back toward the sanctuary\'s outer gate that faced east, and it was closed.";
csb[2] = "The LORD said to me: &quot;This gate will remain closed. It will not be opened, and no one will enter through it, because the LORD, the God of Israel, has entered through it. Therefore it will remain closed.";
csb[3] = "&quot;The prince himself will sit in the gate to eat a meal before the LORD. He is to enter by way of the portico of the gate and go out the same way.&quot;";
csb[4] = "Then the man brought me by way of the north gate to the front of the temple. I looked, and the glory of the LORD filled his temple. And I fell facedown.";
csb[5] = "The LORD said to me: &quot;Son of man, pay attention; look with your eyes and listen with your ears to everything I tell you about all the statutes and laws of the LORD\'s temple. Take careful note of the entrance of the temple along with all the exits of the sanctuary.";
csb[6] = "&quot;Say to the rebellious people, the house of Israel, \'This is what the Lord GOD says: I have had enough of all your detestable practices, house of Israel.";
csb[7] = "&quot;When you brought in foreigners, uncircumcised in both heart and flesh, to occupy my sanctuary, you defiled my temple while you offered my food -- the fat and the blood. You broke my covenant by all your detestable practices.";
csb[8] = "&quot;You have not kept charge of my holy things but have appointed others to keep charge of my sanctuary for you.\'";
csb[9] = "&quot;This is what the Lord GOD says: No foreigner, uncircumcised in heart and flesh, may enter my sanctuary, not even a foreigner who is among the Israelites.";
csb[10] = "&quot;Surely the Levites who wandered away from me when Israel went astray, and who strayed from me after their idols, will bear the consequences of their iniquity.";
csb[11] = "&quot;Yet they will occupy my sanctuary, serving as guards at the temple gates and ministering at the temple. They will slaughter the burnt offerings and other sacrifices for the people and will stand before them to serve them.";
csb[12] = "&quot;Because they ministered to the house of Israel before their idols and became a sinful stumbling block to them, therefore I swore an oath against them&quot; -- this is the declaration of the Lord GOD -- &quot;that they would bear the consequences of their iniquity.";
csb[13] = "&quot;They must not approach me to serve me as priests or come near any of my holy things or the most holy things. They will bear their disgrace and the consequences of the detestable acts they committed.";
csb[14] = "&quot;Yet I will make them responsible for the duties of the temple -- for all its work and everything done in it.";
csb[15] = "&quot;But the Levitical priests descended from Zadok, who kept charge of my sanctuary when the Israelites went astray from me, will approach me to serve me. They will stand before me to offer me fat and blood.&quot; This is the declaration of the Lord GOD.";
csb[16] = "&quot;They are the ones who may enter my sanctuary and approach my table to serve me. They will keep my mandate.";
csb[17] = "&quot;When they enter the gates of the inner court they are to wear linen garments; they must not have on them anything made of wool when they minister at the gates of the inner court and within it.";
csb[18] = "&quot;They are to wear linen turbans on their heads and linen undergarments around their waists. They are not to put on anything that makes them sweat.";
csb[19] = "&quot;Before they go out to the outer court, to the people, they must take off the clothes they have been ministering in, leave them in the holy chambers, and dress in other clothes so that they do not transmit holiness to the people through their clothes.";
csb[20] = "&quot;They may not shave their heads or let their hair grow long, but are to carefully trim their hair.";
csb[21] = "&quot;No priest may drink wine before he enters the inner court.";
csb[22] = "&quot;He is not to marry a widow or a divorced woman, but may marry only a virgin from the offspring of the house of Israel, or a widow who is the widow of a priest.";
csb[23] = "&quot;They are to teach my people the difference between the holy and the common, and explain to them the difference between the clean and the unclean.";
csb[24] = "&quot;In a dispute, they will officiate as judges and decide the case according to my ordinances. They are to observe my laws and statutes regarding all my appointed festivals, and keep my Sabbaths holy.";
csb[25] = "&quot;A priest may not come near a dead person so that he becomes defiled. However, he may defile himself for a father, a mother, a son, a daughter, a brother, or an unmarried sister.";
csb[26] = "&quot;After he is cleansed, he is to count off seven days for himself.";
csb[27] = "&quot;On the day he goes into the sanctuary, into the inner court to minister in the sanctuary, he is to present his sin offering.&quot; This is the declaration of the Lord GOD.";
csb[28] = "&quot;This will be their inheritance: I am their inheritance. You are to give them no possession in Israel: I am their possession.";
csb[29] = "&quot;They will eat the grain offering, the sin offering, and the guilt offering. Everything in Israel that is permanently dedicated to the LORD will belong to them.";
csb[30] = "&quot;The best of all the firstfruits of every kind and contribution of every kind from all your gifts will belong to the priests. You are to give your first batch of dough to the priest so that a blessing may rest on your homes.";
csb[31] = "&quot;The priests may not eat any bird or animal that died naturally or was mauled by wild beasts.";
kjv[1] = "Then he brought me back the way of the gate of the outward sanctuary which looketh toward the east; and it [was] shut.";

yng[1] = "And he causeth me to turn back the way of the gate of the outer sanctuary that is looking eastward, and it is shut.";

vul[1] = "et convertit me ad viam portae sanctuarii exterioris quae respiciebat ad orientem et erat clausa";
kjv[2] = "Then said the LORD unto me; This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the LORD, the God of Israel, hath entered in by it, therefore it shall be shut.";
rsv[2] = "And he said to me, &quot;This gate shall remain shut; it shall not be opened, and no one shall enter by it; for the LORD, the God of Israel, has entered by it; therefore it shall remain shut.";
asv[2] = "And Jehovah said unto me, This gate shall be shut; it shall not be opened, neither shall any man enter in by it; for Jehovah, the God of Israel, hath entered in by it; therefore it shall be shut.";
yng[2] = "And Jehovah saith unto me, `This gate is shut, it is not opened, and none doth go in by it, for Jehovah, God of Israel, hath come in by it, and it hath been shut.";
dby[2] = "And Jehovah said unto me, This gate shall be shut; it shall not be opened, and no one shall enter in by it: for Jehovah, the God of Israel, hath entered in by it; and it shall be shut.";
web[2] = "Then said the LORD to me; This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the LORD the God of Israel hath entered in by it, therefore it shall be shut.";
hnv[2] = "The LORD said to me, This gate shall be shut; it shall not be opened, neither shall any man enter in by it; for the LORD, the God of Yisra\'el, has entered in by it; therefore it shall be shut.";
vul[2] = "et dixit Dominus ad me porta haec clausa erit non aperietur et vir non transiet per eam quoniam Dominus Deus Israhel ingressus est per eam eritque clausa";
kjv[3] = "[It is] for the prince; the prince, he shall sit in it to eat bread before the LORD; he shall enter by the way of the porch of [that] gate, and shall go out by the way of the same.";
rsv[3] = "Only the prince may sit in it to eat bread before the LORD; he shall enter by way of the vestibule of the gate, and shall go out by the same way.&quot;";
asv[3] = "As for the prince, he shall sit therein as prince to eat bread before Jehovah; he shall enter by the way of the porch of the gate, and shall go out by the way of the same.";
yng[3] = "The prince, who [is] prince, he sitteth by it to eat bread before Jehovah, by the way of the porch of the gate he cometh in, and by its way he goeth out.\'";
dby[3] = "As for the prince, he, the prince, shall sit in it to eat bread before Jehovah: he shall enter by the way of the porch of the gate, and shall go out by the way of the same.";
web[3] = "[It is] for the prince; the prince, he shall sit in it to eat bread before the LORD; he shall enter by the way of the porch of [that] gate, and shall go out by the way of the same.";
hnv[3] = "As for the prince, he shall sit therein as prince to eat bread before the LORD; he shall enter by the way of the porch of the gate, and shall go out by the way of the same.";
vul[3] = "principi princeps ipse sedebit in ea ut comedat panem coram Domino per viam vestibuli portae ingredietur et per viam eius egredietur";

asv[4] = "Then he brought me by the way of the north gate before the house; and I looked, and, behold, the glory of Jehovah filled the house of Jehovah: and I fell upon my face.";
yng[4] = "And he bringeth me in the way of the north gate unto the front of the house, and I look, and lo, filled hath the honour of Jehovah the house of Jehovah, and I fall on my face.";
dby[4] = "And he brought me the way of the north gate before the house; and I beheld, and lo, the glory of Jehovah filled the house of Jehovah: and I fell upon my face.";

kjv[5] = "And the LORD said unto me, Son of man, mark well, and behold with thine eyes, and hear with thine ears all that I say unto thee concerning all the ordinances of the house of the LORD, and all the laws thereof; and mark well the entering in of the house, with every going forth of the sanctuary.";
rsv[5] = "And the LORD said to me, &quot;Son of man, mark well, see with your eyes, and hear with your ears all that I shall tell you concerning all the ordinances of the temple of the LORD and all its laws; and mark well those who may be admitted to the temple and all those who are to be excluded from the sanctuary.";
asv[5] = "And Jehovah said unto me, Son of man, mark well, and behold with thine eyes, and hear with thine ears all that I say unto thee concerning all the ordinances of the house of Jehovah, and all the laws thereof; and mark well the entrance of the house, with every egress of the sanctuary.";
yng[5] = "And Jehovah saith unto me, `Son of man, set thy heart, and see with thine eyes, and with thine ears hear, all that I am speaking with thee, of all the statutes of the house of Jehovah, and of all its laws; and thou hast set thy heart to the entrance of the house, with all the outlets of the sanctuary,";
dby[5] = "And Jehovah said unto me, Son of man, apply thy heart, and behold with thine eyes, and hear with thine ears all that I say unto thee concerning all the statutes of the house of Jehovah, and all the laws thereof; and mark well the entering in of the house, with every going forth of the sanctuary;";
web[5] = "And the LORD said to me, Son of man mark well, and behold with thy eyes, and hear with thy ears all that I say to thee concerning all the ordinances of the house of the LORD, and all its laws; and mark well the entrance of the house, with every going forth of the sanctuary;";
hnv[5] = " The LORD said to me, Son of man, mark well, and see with your eyes, and hear with your ears all that I tell you concerning all the ordinances of the house of the LORD, and all the laws of it; and mark well the entrance of the house, with every exit of the sanctuary.";
vul[5] = "et dixit ad me Dominus fili hominis pone cor tuum et vide oculis tuis et auribus tuis audi omnia quae ego loquor ad te de universis caerimoniis domus Domini et de cunctis legibus eius et pones cor tuum in viis templi per omnes exitus sanctuarii";

kjv[7] = "In that ye have brought [into my sanctuary] strangers, uncircumcised in heart, and uncircumcised in flesh, to be in my sanctuary, to pollute it, [even] my house, when ye offer my bread, the fat and the blood, and they have broken my covenant because of all your abominations.";
rsv[7] = "in admitting foreigners, uncircumcised in heart and flesh, to be in my sanctuary, profaning it, when you offer to me my food, the fat and the blood. You have broken my covenant, in addition to all your abominations.";
asv[7] = "in that ye have brought in foreigners, uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it, even my house, when ye offer my bread, the fat and the blood, and they have broken my covenant, [to add] unto all your abominations.";
yng[7] = "In your bringing in sons of a stranger, uncircumcised of heart, and uncircumcised of flesh, to be in My sanctuary, to pollute it, even My house, in your bringing near My bread, fat, and blood, and they break My covenant by all your abominations,";

kjv[12] = "Because they ministered unto them before their idols, and caused the house of Israel to fall into iniquity; therefore have I lifted up mine hand against them, saith the Lord GOD, and they shall bear their iniquity.";
rsv[12] = "Because they ministered to them before their idols and became a stumbling block of iniquity to the house of Israel, therefore I have sworn concerning them, says the Lord GOD, that they shall bear their punishment.";
asv[12] = "Because they ministered unto them before their idols, and became a stumblingblock of iniquity unto the house of Israel; therefore have I lifted up my hand against them, saith the Lord Jehovah, and they shall bear their iniquity.";
yng[12] = "Because that they serve them before their idols, and have been to the house of Israel for a stumbling-block of iniquity, therefore I have lifted up my hand against them -- an affirmation of the Lord Jehovah -- and they have borne their iniquity.";
dby[12] = "Because they ministered unto them before their idols, and were unto the house of Israel a stumbling-block of iniquity; therefore have I lifted up my hand against them, saith the Lord Jehovah, that they shall bear their iniquity.";
web[12] = "Because they ministered to them before their idols, and caused the house of Israel to fall into iniquity; therefore have I lifted up my hand against them, saith the Lord GOD, and they shall bear their iniquity.";

vul[12] = "pro eo quod ministraverunt illis in conspectu idolorum suorum et facti sunt domui Israhel in offendiculum iniquitatis idcirco levavi manum meam super eos dicit Dominus Deus et portaverunt iniquitatem suam";
kjv[13] = "And they shall not come near unto me, to do the office of a priest unto me, nor to come near to any of my holy things, in the most holy [place]: but they shall bear their shame, and their abominations which they have committed.";
rsv[13] = "They shall not come near to me, to serve me as priest, nor come near any of my sacred things and the things that are most sacred; but they shall bear their shame, because of the abominations which they have committed.";

yng[13] = "And they draw not nigh unto Me to act as My priest, and to draw nigh unto any of My holy things, unto the holy of holies, and they have borne their shame and their abominations that they have done,";
dby[13] = "And they shall not draw near unto me, to do the office of a priest unto me, nor to draw near to any of my holy things, [even] to the most holy; but they shall bear their confusion, and their abominations which they have committed.";

kjv[15] = "But the priests the Levites, the sons of Zadok, that kept the charge of my sanctuary when the children of Israel went astray from me, they shall come near to me to minister unto me, and they shall stand before me to offer unto me the fat and the blood, saith the Lord GOD:";
rsv[15] = "&quot;But the Levitical priests, the sons of Zadok, who kept the charge of my sanctuary when the people of Israel went astray from me, shall come near to me to minister to me; and they shall attend on me to offer me the fat and the blood, says the Lord GOD;";
asv[15] = "But the priests the Levites, the sons of Zadok, that kept the charge of my sanctuary when the children of Israel went astray from me, they shall come near to me to minister unto me; and they shall stand before me to offer unto me the fat and the blood, saith the Lord Jehovah:";
yng[15] = "`And the priests, the Levites, sons of Zadok, who have kept the charge of My sanctuary in the wandering of the sons of Israel from off Me, they draw near unto Me to serve Me, and have stood before Me, to bring near to Me fat and blood -- an affirmation of the Lord Jehovah:";
dby[15] = "But the priests, the Levites, the sons of Zadok, that kept the charge of my sanctuary when the children of Israel went astray from me, they shall approach unto me to minister unto me, and they shall stand before me to present unto me the fat and the blood, saith the Lord Jehovah.";
web[15] = "But the priests the Levites, the sons of Zadok, that kept the charge of my sanctuary when the children of Israel went astray from me, they shall come near to me to minister to me, and they shall stand before me to offer to me the fat and the blood, saith the Lord GOD:";
hnv[15] = "But the Kohanim the Levites, the sons of Tzadok, who kept the charge of my sanctuary when the children of Yisra\'el went astray from me, they shall come near to me to minister to me; and they shall stand before me to offer to me the fat and the blood, says the Lord GOD:";
vul[15] = "sacerdotes autem Levitae filii Sadoc qui custodierunt caerimonias sanctuarii mei cum errarent filii Israhel a me ipsi accedent ad me ut ministrent mihi et stabunt in conspectu meo ut offerant mihi adipem et sanguinem ait Dominus Deus";
kjv[16] = "They shall enter into my sanctuary, and they shall come near to my table, to minister unto me, and they shall keep my charge.";
rsv[16] = "they shall enter my sanctuary, and they shall approach my table, to minister to me, and they shall keep my charge.";
asv[16] = "they shall enter into my sanctuary, and they shall come near to my table, to minister unto me, and they shall keep my charge.";
yng[16] = "they come in unto My sanctuary, and they draw near unto My table to serve Me, and they have kept My charge.";
dby[16] = "They shall enter into my sanctuary, and they shall approach unto my table, to minister unto me, and they shall keep my charge.";
web[16] = "They shall enter into my sanctuary, and they shall come near to my table, to minister to me, and they shall keep my charge.";
hnv[16] = "they shall enter into my sanctuary, and they shall come near to my table, to minister to me, and they shall keep my charge.";
vul[16] = "ipsi ingredientur sanctuarium meum et ipsi accedent ad mensam meam ut ministrent mihi et custodiant caerimonias meas";
kjv[17] = "And it shall come to pass, [that] when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come upon them, whiles they minister in the gates of the inner court, and within.";
rsv[17] = "When they enter the gates of the inner court, they shall wear linen garments; they shall have nothing of wool on them, while they minister at the gates of the inner court, and within.";
asv[17] = "And it shall be that, when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come upon them, while they minister in the gates of the inner court, and within.";
yng[17] = "And it hath come to pass, in their going in unto the gates of the inner court, linen garments they put on; and no wool cometh up on them in their ministering in the gates of the inner court and within.";
dby[17] = "And it shall come to pass when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come upon them, when they minister in the gates of the inner court, and towards the house.";
web[17] = "And it shall come to pass, [that] when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come upon them, while they minister in the gates of the inner court, and within.";
hnv[17] = "It shall be that, when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come on them, while they minister in the gates of the inner court, and within.";
vul[17] = "cumque ingredientur portas atrii interioris vestibus lineis induentur nec ascendet super eos quicquam laneum quando ministrant in portis atrii interioris et intrinsecus";
kjv[18] = "They shall have linen bonnets upon their heads, and shall have linen breeches upon their loins; they shall not gird [themselves] with any thing that causeth sweat.";
rsv[18] = "They shall have linen turbans upon their heads, and linen breeches upon their loins; they shall not gird themselves with anything that causes sweat.";
asv[18] = "They shall have linen tires upon their heads, and shall have linen breeches upon their loins; they shall not gird themselves with [anything that causeth] sweat.";
yng[18] = "Linen bonnets are on their head, and linen trousers are on their loins, they are not restrained with sweat.";
dby[18] = "They shall have linen tires upon their heads, and shall have linen breeches upon their loins; they shall not gird on anything that causeth sweat.";
web[18] = "They shall have linen bonnets upon their heads, and shall have linen breeches upon their loins; they shall not gird [themselves] with any thing that causeth sweat.";
hnv[18] = "They shall have linen tires on their heads, and shall have linen breeches on their loins; they shall not gird themselves with [anything that causes] sweat.";
vul[18] = "vittae lineae erunt in capitibus eorum et feminalia linea erunt in lumbis eorum et non accingentur in sudore";
kjv[19] = "And when they go forth into the utter court, [even] into the utter court to the people, they shall put off their garments wherein they ministered, and lay them in the holy chambers, and they shall put on other garments; and they shall not sanctify the people with their garments.";
rsv[19] = "And when they go out into the outer court to the people, they shall put off the garments in which they have been ministering, and lay them in the holy chambers; and they shall put on other garments, lest they communicate holiness to the people with their garments.";
asv[19] = "And when they go forth into the outer court, even into the outer court to the people, they shall put off their garments wherein they minister, and lay them in the holy chambers; and they shall put on other garments, that they sanctify not the people with their garments.";
yng[19] = "And in their going forth unto the outer court -- unto the outer court unto the people -- they strip off their garments, in which they are ministering, and have placed them in the holy chambers, and have put on other garments; and they do not sanctify the people in their own garments.";
dby[19] = "And when they go forth into the outer court, into the outer court to the people, they shall put off their garments wherein they ministered, and lay them in the holy cells; and they shall put on other garments, that they may not hallow the people with their garments.";
web[19] = "And when they go forth into the outer court, [even] into the outer court to the people, they shall put off their garments in which they ministered, and lay them in the holy chambers, and they shall put on other garments; and they shall not sanctify the people with their garments.";
hnv[19] = "When they go forth into the outer court, even into the outer court to the people, they shall put off their garments in which they minister, and lay them in the holy chambers; and they shall put on other garments, that they not sanctify the people with their garments.";
vul[19] = "cumque egredientur atrium exterius ad populum exuent se vestimenta sua in quibus ministraverunt et reponent ea in gazofilacio sanctuarii et vestient se vestimentis aliis et non sanctificabunt populum in vestibus suis";
kjv[20] = "Neither shall they shave their heads, nor suffer their locks to grow long; they shall only poll their heads.";
rsv[20] = "They shall not shave their heads or let their locks grow long; they shall only trim the hair of their heads.";
asv[20] = "Neither shall they shave their heads, nor suffer their locks to grow long; they shall only cut off the hair of their heads.";
yng[20] = "And their head they do not shave, and the lock they do not send forth; they certainly poll their heads.";
dby[20] = "Neither shall they shave their heads, nor suffer their locks to grow long: they shall duly poll their heads.";
web[20] = "Neither shall they shave their heads, nor suffer their locks to grow long; they shall only poll their heads.";
hnv[20] = "Neither shall they shave their heads, nor allow their locks to grow long; they shall only cut off the hair of their heads.";
vul[20] = "caput autem suum non radent neque comam nutrient sed tondentes adtondent capita sua";
kjv[21] = "Neither shall any priest drink wine, when they enter into the inner court.";
rsv[21] = "No priest shall drink wine, when he enters the inner court.";
asv[21] = "Neither shall any of the priests drink wine, when they enter into the inner court.";
yng[21] = "And no priest doth drink wine in their coming in unto the inner court.";
dby[21] = "Neither shall any priest drink wine when they enter into the inner court.";
web[21] = "Neither shall any priest drink wine, when they enter into the inner court.";
hnv[21] = "Neither shall any of the Kohanim drink wine, when they enter into the inner court.";
vul[21] = "et vinum non bibet omnis sacerdos quando ingressurus est atrium interius";
kjv[22] = "Neither shall they take for their wives a widow, nor her that is put away: but they shall take maidens of the seed of the house of Israel, or a widow that had a priest before.";
rsv[22] = "They shall not marry a widow, or a divorced woman, but only a virgin of the stock of the house of Israel, or a widow who is the widow of a priest.";
asv[22] = "Neither shall they take for their wives a widow, nor her that is put away; but they shall take virgins of the seed of the house of Israel, or a widow that is the widow of a priest.";
yng[22] = "And a widow and divorced woman they do not take to them for wives: but -- virgins of the seed of the house of Israel, and the widow who is widow of a priest, do they take.";
dby[22] = "And they shall not take for their wives a widow, nor her that is put away; but they shall take maidens of the seed of the house of Israel, or a widow that is the widow of a priest.";
web[22] = "Neither shall they take for their wives a widow, nor her that is put away: but they shall take maidens of the seed of the house of Israel, or a widow that had a priest before.";
hnv[22] = " Neither shall they take for their wives a widow, nor her who is put away; but they shall take virgins of the seed of the house of Yisra\'el, or a widow who is the widow of a Kohen.";
vul[22] = "et viduam et repudiatam non accipient uxores sed virgines de semine domus Israhel sed et viduam quae fuerit vidua a sacerdote accipient";
kjv[23] = "And they shall teach my people [the difference] between the holy and profane, and cause them to discern between the unclean and the clean.";
rsv[23] = "They shall teach my people the difference between the holy and the common, and show them how to distinguish between the unclean and the clean.";
asv[23] = "And they shall teach my people the difference between the holy and the common, and cause them to discern between the unclean and the clean.";
yng[23] = "`And My people they direct between holy and common, and between unclean and clean they cause them to discern.";
dby[23] = "And they shall teach my people [the difference] between holy and profane, and cause them to discern between unclean and clean.";
web[23] = "And they shall teach my people the [difference] between the holy and profane, and cause them to discern between the unclean and the clean.";
hnv[23] = "They shall teach my people the difference between the holy and the common, and cause them to discern between the unclean and the clean.";
vul[23] = "et populum meum docebunt quid sit inter sanctum et pollutum et inter mundum et inmundum ostendent eis";
kjv[24] = "And in controversy they shall stand in judgment; [and] they shall judge it according to my judgments: and they shall keep my laws and my statutes in all mine assemblies; and they shall hallow my sabbaths.";
rsv[24] = "In a controversy they shall act as judges, and they shall judge it according to my judgments. They shall keep my laws and my statutes in all my appointed feasts, and they shall keep my sabbaths holy.";
asv[24] = "And in a controversy they shall stand to judge; according to mine ordinances shall they judge it: and they shall keep my laws and my statutes in all my appointed feasts; and they shall hallow my sabbaths.";
yng[24] = "And concerning controversy, they stand up for judgment; with My judgments they judge it; and My law and My statutes in all My appointed places they keep; and My sabbaths they sanctify.";
dby[24] = "And in controversy they shall stand to judge: they shall judge it according to my judgments; and they shall keep my laws and my statutes in all my solemnities; and they shall hallow my sabbaths.";
web[24] = "And in controversy they shall stand in judgment; [and] they shall judge it according to my judgments: and they shall keep my laws and my statutes in all my assemblies; and they shall hallow my sabbaths.";
hnv[24] = "In a controversy they shall stand to judge; according to my ordinances shall they judge it: and they shall keep my laws and my statutes in all my appointed feasts; and they shall make my Shabbatot holy.";
vul[24] = "et cum fuerit controversia stabunt in iudiciis meis et iudicabunt leges meas et praecepta mea in omnibus sollemnitatibus meis custodient et sabbata mea sanctificabunt";
kjv[25] = "And they shall come at no dead person to defile themselves: but for father, or for mother, or for son, or for daughter, for brother, or for sister that hath had no husband, they may defile themselves.";
rsv[25] = "They shall not defile themselves by going near to a dead person; however, for father or mother, for son or daughter, for brother or unmarried sister they may defile themselves.";
asv[25] = "And they shall go in to no dead person to defile themselves; but for father, or for mother, or for son, or for daughter, for brother, or for sister that hath had no husband, they may defile themselves.";
yng[25] = "And unto any dead man they come not for uncleanness, but for father, and for mother, and for son, and for daughter, for brother, for sister who hath not been to a man, they defile themselves.";
dby[25] = "And they shall come at no dead person to become unclean; but for father, or for mother, or for son, or for daughter, for brother, or for sister that hath had no husband, they may become unclean.";
web[25] = "And they shall come at no dead person to defile themselves: but for father, or for mother, or for son, or for daughter, for brother, or for sister that hath had no husband, they may defile themselves.";
hnv[25] = "They shall go in to no dead person to defile themselves; but for father, or for mother, or for son, or for daughter, for brother, or for sister who has had no husband, they may defile themselves.";
vul[25] = "et ad mortuum hominem non ingredientur ne polluantur nisi ad patrem et matrem et filium et filiam et fratrem et sororem quae alterum virum non habuit in quibus contaminabuntur";
kjv[26] = "And after he is cleansed, they shall reckon unto him seven days.";
rsv[26] = "After he is defiled, he shall count for himself seven days, and then he shall be clean.";
asv[26] = "And after he is cleansed, they shall reckon unto him seven days.";
yng[26] = "`And after his cleansing, seven days they number to him.";
dby[26] = "And after he is cleansed, they shall count unto him seven days.";
web[26] = "And after he is cleansed, they shall reckon to him seven days.";
hnv[26] = "After he is cleansed, they shall reckon to him seven days.";
vul[26] = "et postquam fuerit emundatus septem dies numerabuntur ei";
kjv[27] = "And in the day that he goeth into the sanctuary, unto the inner court, to minister in the sanctuary, he shall offer his sin offering, saith the Lord GOD.";
rsv[27] = "And on the day that he goes into the holy place, into the inner court, to minister in the holy place, he shall offer his sin offering, says the Lord GOD.";
asv[27] = "And in the day that he goeth into the sanctuary, into the inner court, to minister in the sanctuary, he shall offer his sin-offering, saith the Lord Jehovah.";
yng[27] = "And in the day of his coming in unto the sanctuary, unto the inner court, to minister in the sanctuary, he bringeth near his sin-offering -- an affirmation of the Lord Jehovah.";
dby[27] = "And on the day that he goeth into the sanctuary, unto the inner court, to minister in the sanctuary, he shall present his sin-offering, saith the Lord Jehovah.";
web[27] = "And in the day that he goeth into the sanctuary, to the inner court, to minister in the sanctuary, he shall offer his sin-offering, saith the Lord GOD.";
hnv[27] = "In the day that he goes into the sanctuary, into the inner court, to minister in the sanctuary, he shall offer his sin-offering, says the Lord GOD.";
vul[27] = "et in die introitus sui in sanctuarium ad atrium interius ut ministret mihi in sanctuario offeret pro peccato suo ait Dominus Deus";
kjv[28] = "And it shall be unto them for an inheritance: I [am] their inheritance: and ye shall give them no possession in Israel: I [am] their possession.";
rsv[28] = "&quot;They shall have no inheritance; I am their inheritance: and you shall give them no possession in Israel; I am their possession.";
asv[28] = "And they shall have an inheritance: I am their inheritance; and ye shall give them no possession in Israel; I am their possession.";
yng[28] = "And it hath been to them for an inheritance; I [am] their inheritance: and a possession ye do not give to them in Israel; I [am] their possession.";
dby[28] = "And it shall be unto them for an inheritance; I am their inheritance: and ye shall give them no possession in Israel; I am their possession.";
web[28] = "And it shall be to them for an inheritance: I [am] their inheritance: and ye shall give them no possession in Israel: I [am] their possession.";
hnv[28] = "They shall have an inheritance: I am their inheritance; and you shall give them no possession in Yisra\'el; I am their possession.";
vul[28] = "erit autem eis hereditas ego hereditas eorum et possessionem non dabitis eis in Israhel ego enim possessio eorum";
kjv[29] = "They shall eat the meat offering, and the sin offering, and the trespass offering; and every dedicated thing in Israel shall be theirs.";
rsv[29] = "They shall eat the cereal offering, the sin offering, and the guilt offering; and every devoted thing in Israel shall be theirs.";
asv[29] = "They shall eat the meal-offering, and the sin-offering, and the trespass-offering; and every devoted thing in Israel shall be theirs.";
yng[29] = "The present, and the sin-offering, and the guilt-offering, they do eat, and every devoted thing in Israel is theirs.";
dby[29] = "They shall eat the oblation and the sin-offering and the trespass-offering; and every devoted thing in Israel shall be theirs.";
web[29] = "They shall eat the meat-offering, and the sin-offering, and the trespass-offering; and every dedicated thing in Israel shall be theirs.";
hnv[29] = "They shall eat the meal-offering, and the sin-offering, and the trespass-offering; and every devoted thing in Yisra\'el shall be theirs.";
vul[29] = "victimam et pro peccato et pro delicto ipsi comedent et omne votum in Israhel ipsorum erit";
kjv[30] = "And the first of all the firstfruits of all [things], and every oblation of all, of every [sort] of your oblations, shall be the priest\'s: ye shall also give unto the priest the first of your dough, that he may cause the blessing to rest in thine house.";
rsv[30] = "And the first of all the first fruits of all kinds, and every offering of all kinds from all your offerings, shall belong to the priests; you shall also give to the priests the first of your coarse meal, that a blessing may rest on your house.";
asv[30] = "And the first of all the first-fruits of every thing, and every oblation of everything, of all your oblations, shall be for the priest: ye shall also give unto the priests the first of your dough, to cause a blessing to rest on thy house.";
yng[30] = "And the first of all the first-fruits of all, and every heave-offering of all, of all your heave-offerings, are the priests\': and the first of your dough ye give to the priest, to cause a blessing to rest on thy house.";
dby[30] = "And the first of all the first-fruits of every [kind], and every heave-offering of every [kind], of all your heave-offerings, shall be for the priests; ye shall also give unto the priest the first of your dough, that he may cause the blessing to rest on thy house.";
web[30] = "And the first of all the first-fruits of all [things], and every oblation of all, of every [sort] of your oblations, shall be the priest\'s: ye shall also give to the priest the first of your dough, that he may cause the blessing to rest in thy house.";
hnv[30] = "The first of all the first fruits of every thing, and every offering of everything, of all your offerings, shall be for the Kohen: you shall also give to the Kohanim the first of your dough, to cause a blessing to rest on your house.";
vul[30] = "et primitiva omnium primogenitorum et omnia libamenta ex omnibus quae offeruntur sacerdotum erunt et primitiva ciborum vestrorum dabitis sacerdoti ut reponat benedictionem domui suae";
kjv[31] = "The priests shall not eat of any thing that is dead of itself, or torn, whether it be fowl or beast.";
rsv[31] = "The priests shall not eat of anything, whether bird or beast, that has died of itself or is torn.";
asv[31] = "The priests shall not eat of anything that dieth of itself, or is torn, whether it be bird or beast.";
yng[31] = "Any carcase and torn thing, of the fowl, and of the beasts, the priests do not eat.";
dby[31] = "The priests shall not eat of anything that dieth of itself, or of that which is torn, whether of fowl or of beast.";
web[31] = "The priests shall not eat of any thing that is dead of itself, or torn, whether of fowl or beast.";
hnv[31] = "The Kohanim shall not eat of anything that dies of itself, or is torn, whether it be bird or animal.";
vul[31] = "omne morticinum et captum a bestia de avibus et de pecoribus non comedent sacerdotes";
