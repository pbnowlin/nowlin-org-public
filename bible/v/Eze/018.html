csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;What do you mean by using this proverb concerning the land of Israel: \'The fathers eat sour grapes, and the children\'s teeth are set on edge\'?";
csb[3] = "&quot;As I live&quot; -- this is the declaration of the Lord GOD -- &quot;you will no longer use this proverb in Israel.";
csb[4] = "&quot;Look, every life belongs to me. The life of the father is like the life of the son -- both belong to me. The person who sins is the one who will die.";
csb[5] = "&quot;Suppose a man is righteous and does what is just and right:";
csb[6] = "&quot;He does not eat at the mountain shrines or look to the idols of the house of Israel. He does not defile his neighbor\'s wife or approach a woman during her menstrual impurity.";
csb[7] = "&quot;He doesn\'t oppress anyone but returns his collateral to the debtor. He does not commit robbery, but gives his bread to the hungry and covers the naked with clothing.";
csb[8] = "&quot;He doesn\'t lend at interest or for profit but keeps his hand from injustice and carries out true justice between men.";
csb[9] = "&quot;He follows my statutes and keeps my ordinances, acting faithfully. Such a person is righteous; he will certainly live.&quot; This is the declaration of the Lord GOD.";
csb[10] = "&quot;But suppose the man has a violent son, who sheds blood and does any of these things,";
csb[11] = "&quot;though the father has done none of them. Indeed, when the son eats at the mountain shrines and defiles his neighbor\'s wife,";
csb[12] = "&quot;and when he oppresses the poor and needy, commits robbery, and does not return collateral, and when he looks to the idols, commits detestable acts,";
csb[13] = "&quot;and lends at interest or for profit, will he live? He will not live! Since he has committed all these detestable acts, he will certainly die. His death will be his own fault.";
csb[14] = "&quot;Now suppose he has a son who sees all the sins his father has committed, and though he sees them, he does not do likewise.";
csb[15] = "&quot;He does not eat at the mountain shrines or look to the idols of the house of Israel. He does not defile his neighbor\'s wife.";
csb[16] = "&quot;He doesn\'t oppress anyone, hold collateral, or commit robbery. He gives his bread to the hungry and covers the naked with clothing.";
csb[17] = "&quot;He keeps his hand from harming the poor, not taking interest or profit on a loan. He practices my ordinances and follows my statutes. Such a person will not die for his father\'s iniquity. He will certainly live.";
csb[18] = "&quot;As for his father, he will die for his own iniquity because he practiced fraud, robbed his brother, and did among his people what was not good.";
csb[19] = "&quot;But you may ask, \'Why doesn\'t the son suffer punishment for the father\'s iniquity? \' Since the son has done what is just and right, carefully observing all my statutes, he will certainly live.";
csb[20] = "&quot;The person who sins is the one who will die. A son won\'t suffer punishment for the father\'s iniquity, and a father won\'t suffer punishment for the son\'s iniquity. The righteousness of the righteous person will be on him, and the wickedness of the wicked person will be on him.";
csb[21] = "&quot;But if the wicked person turns from all the sins he has committed, keeps all my statutes, and does what is just and right, he will certainly live; he will not die.";
csb[22] = "&quot;None of the transgressions he has committed will be held against him. He will live because of the righteousness he has practiced.";
csb[23] = "&quot;Do I take any pleasure in the death of the wicked? &quot; This is the declaration of the Lord GOD. &quot;Instead, don\'t I take pleasure when he turns from his ways and lives?";
csb[24] = "&quot;But when a righteous person turns from his righteousness and acts unjustly, committing the same detestable acts that the wicked do, will he live? None of the righteous acts he did will be remembered. He will die because of the treachery he has engaged in and the sin he has committed.";
csb[25] = "&quot;But you say, \'The Lord\'s way isn\'t fair.\' Now listen, house of Israel: Is it my way that is unfair? Instead, isn\'t it your ways that are unfair?";
csb[26] = "&quot;When a righteous person turns from his righteousness and acts unjustly, he will die for this. He will die because of the injustice he has committed.";
csb[27] = "&quot;But if a wicked person turns from the wickedness he has committed and does what is just and right, he will preserve his life.";
csb[28] = "&quot;He will certainly live because he thought it over and turned from all the transgressions he had committed; he will not die.";
csb[29] = "&quot;But the house of Israel says, \'The Lord\'s way isn\'t fair.\' Is it my ways that are unfair, house of Israel? Instead, isn\'t it your ways that are unfair?";
csb[30] = "&quot;Therefore, house of Israel, I will judge each one of you according to his ways.&quot; This is the declaration of the Lord GOD. &quot;Repent and turn from all your rebellious acts, so they will not become a sinful stumbling block to you.";
csb[31] = "&quot;Throw off all the transgressions you have committed, and get yourselves a new heart and a new spirit. Why should you die, house of Israel?";
csb[32] = "&quot;For I take no pleasure in anyone\'s death.&quot; This is the declaration of the Lord GOD. &quot;So repent and live!";

kjv[19] = "Yet say ye, Why? doth not the son bear the iniquity of the father? When the son hath done that which is lawful and right, [and] hath kept all my statutes, and hath done them, he shall surely live.";
rsv[19] = "&quot;Yet you say, \'Why should not the son suffer for the iniquity of the father?\' When the son has done what is lawful and right, and has been careful to observe all my statutes, he shall surely live.";
asv[19] = "Yet say ye, Wherefore doth not the son bear the iniquity of the father? When the son hath done that which is lawful and right, and hath kept all my statutes, and hath done them, he shall surely live.";
yng[19] = "And ye have said, Wherefore hath not the son, Borne of the iniquity of the father? And -- the son judgment and righteousness hath done, All My statutes he hath kept, And he doeth them, he surely liveth.";
dby[19] = "And ye say, Why doth not the son bear the iniquity of the father? But the son hath done judgment and justice, hath kept all my statutes, and hath done them; he shall certainly live.";
web[19] = "Yet say ye, Why? doth not the son bear the iniquity of the father? When the son hath done that which is lawful and right, [and] hath kept all my statutes, and hath done them, he shall surely live.";
hnv[19] = "Yet say you, Why does not the son bear the iniquity of the father? when the son has done that which is lawful and right, and has kept all my statutes, and has done them, he shall surely live.";
vul[19] = "et dicitis quare non portavit filius iniquitatem patris videlicet quia filius iudicium et iustitiam operatus est omnia praecepta mea custodivit et fecit illa vita vivet";
kjv[20] = "The soul that sinneth, it shall die. The son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son: the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him.";
rsv[20] = "The soul that sins shall die. The son shall not suffer for the iniquity of the father, nor the father suffer for the iniquity of the son; the righteousness of the righteous shall be upon himself, and the wickedness of the wicked shall be upon himself.";
asv[20] = "The soul that sinneth, it shall die: the son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son; the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him.";
yng[20] = "The soul that doth sin -- it doth die. A son doth not bear of the iniquity of the father, And a father doth not bear of the iniquity of the son, The righteousness of the righteous is on him, And the wickedness of the wicked is on him.";
dby[20] = "The soul that sinneth, it shall die. The son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son; the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him.";
web[20] = "The soul that sinneth, it shall die. The son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son: the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him.";
hnv[20] = "The soul who sins, he shall die: the son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son; the righteousness of the righteous shall be on him, and the wickedness of the wicked shall be on him.";
vul[20] = "anima quae peccaverit ipsa morietur filius non portabit iniquitatem patris et pater non portabit iniquitatem filii iustitia iusti super eum erit et impietas impii erit super eum";
kjv[21] = "But if the wicked will turn from all his sins that he hath committed, and keep all my statutes, and do that which is lawful and right, he shall surely live, he shall not die.";
rsv[21] = "&quot;But if a wicked man turns away from all his sins which he has committed and keeps all my statutes and does what is lawful and right, he shall surely live; he shall not die.";
asv[21] = "But if the wicked turn from all his sins that he hath committed, and keep all my statutes, and do that which is lawful and right, he shall surely live, he shall not die.";
yng[21] = "And the wicked -- when he turneth back From all his sins that he hath done, And he hath kept all My statutes, And hath done judgment and righteousness, He doth surely live, he doth not die.";
dby[21] = "And the wicked, if he turn from all his sins which he hath committed, and keep all my statutes, and do judgment and justice, he shall certainly live, he shall not die.";
web[21] = "But if the wicked will turn from all his sins that he hath committed, and keep all my statutes, and do that which is lawful and right, he shall surely live, he shall not die.";
hnv[21] = "But if the wicked turn from all his sins that he has committed, and keep all my statutes, and do that which is lawful and right, he shall surely live, he shall not die.";
vul[21] = "si autem impius egerit paenitentiam ab omnibus peccatis suis quae operatus est et custodierit universa praecepta mea et fecerit iudicium et iustitiam vita vivet non morietur";
kjv[22] = "All his transgressions that he hath committed, they shall not be mentioned unto him: in his righteousness that he hath done he shall live.";
rsv[22] = "None of the transgressions which he has committed shall be remembered against him; for the righteousness which he has done he shall live.";
asv[22] = "None of his transgressions that he hath committed shall be remembered against him: in his righteousness that he hath done he shall live.";
yng[22] = "All his transgressions that he hath done Are not remembered to him, In his righteousness that he hath done he liveth.";
dby[22] = "None of his transgressions which he hath committed shall be remembered against him; in his righteousness which he hath done shall he live.";
web[22] = "All his transgressions that he hath committed, they shall not be mentioned to him: in his righteousness that he hath done he shall live.";
hnv[22] = "None of his transgressions that he has committed shall be remembered against him: in his righteousness that he has done he shall live.";
vul[22] = "omnium iniquitatum eius quas operatus est non recordabor in iustitia sua quam operatus est vivet";
kjv[23] = "Have I any pleasure at all that the wicked should die? saith the Lord GOD: [and] not that he should return from his ways, and live?";
rsv[23] = "Have I any pleasure in the death of the wicked, says the Lord GOD, and not rather that he should turn from his way and live?";
asv[23] = "Have I any pleasure in the death of the wicked? saith the Lord Jehovah; and not rather that he should return from his way, and live?";
yng[23] = "Do I at all desire the death of the wicked? An affirmation of the Lord Jehovah, Is it not in his turning back from his way -- And he hath lived?";
dby[23] = "Have I any pleasure at all in the death of the wicked? saith the Lord Jehovah; is it not in his turning from his way, that he may live?";
web[23] = "Have I any pleasure at all that the wicked should die? saith the Lord GOD: [and] not that he should return from his ways, and live?";
hnv[23] = "Have I any pleasure in the death of the wicked? says the Lord GOD; and not rather that he should return from his way, and live?";
vul[23] = "numquid voluntatis meae est mors impii dicit Dominus Deus et non ut convertatur a viis suis et vivat";
kjv[24] = "But when the righteous turneth away from his righteousness, and committeth iniquity, [and] doeth according to all the abominations that the wicked [man] doeth, shall he live? All his righteousness that he hath done shall not be mentioned: in his trespass that he hath trespassed, and in his sin that he hath sinned, in them shall he die.";
rsv[24] = "But when a righteous man turns away from his righteousness and commits iniquity and does the same abominable things that the wicked man does, shall he live? None of the righteous deeds which he has done shall be remembered; for the treachery of which he is guilty and the sin he has committed, he shall die.";
asv[24] = "But when the righteous turneth away from his righteousness, and committeth iniquity, and doeth according to all the abominations that the wicked man doeth, shall he live? None of his righteous deeds that he hath done shall be remembered: in his trespass that he hath trespassed, and in his sin that he hath sinned, in them shall he die.";
yng[24] = "And in the turning back of the righteous from his righteousness, And he hath done perversity, According to all the abominations That the wicked hath done, he doth -- thus he liveth, All his righteousnesses that he hath done are not remembered, For his trespass that he hath trespassed, And for his sin that he hath sinned, For them he doth die.";
dby[24] = "And when the righteous turneth from his righteousness and practiseth what is wrong, [and] doeth according to all the abominations that the wicked doeth, shall he live? None of his righteous acts which he hath done shall be remembered: in his unfaithfulness which he hath wrought, and in his sin which he hath sinned, in them shall he die.";
web[24] = "But when the righteous turneth away from his righteousness, and committeth iniquity, [and] doeth according to all the abominations that the wicked [man] doeth, shall he live? All his righteousness that he hath done shall not be mentioned: in his trespass that he hath trespassed, and in his sin that he hath sinned, in them shall he die.";
hnv[24] = "But when the righteous turns away from his righteousness, and commits iniquity, and does according to all the abominations that the wicked man does, shall he live? None of his righteous deeds that he has done shall be remembered: in his trespass that he has trespassed, and in his sin that he has sinned, in them shall he die.";
vul[24] = "si autem averterit se iustus a iustitia sua et fecerit iniquitatem secundum omnes abominationes quas operari solet impius numquid vivet omnes iustitiae eius quas fecerat non recordabuntur in praevaricatione qua praevaricatus est et in peccato suo quod peccavit in ipsis morietur";
kjv[25] = "Yet ye say, The way of the Lord is not equal. Hear now, O house of Israel; Is not my way equal? are not your ways unequal?";
rsv[25] = "&quot;Yet you say, \'The way of the Lord is not just.\' Hear now, O house of Israel: Is my way not just? Is it not your ways that are not just?";
asv[25] = "Yet ye say, The way of the Lord is not equal. Hear now, O house of Israel: Is not my way equal? are not your ways unequal?";
yng[25] = "And ye have said, Not pondered is the way of the Lord. Hear, I pray you, O house of Israel, My way -- is it not pondered? Are not your ways unpondered?";
dby[25] = "And ye say, The way of the Lord is not equal. Hear then, house of Israel. Is not my way equal? are not your ways unequal?";
web[25] = "Yet ye say, The way of the Lord is not equal. Hear now, O house of Israel; Is not my way equal? are not your ways unequal?";
hnv[25] = "Yet you say, The way of the Lord is not equal. Hear now, house of Yisra\'el: Is my way not equal? Aren\'t your ways unequal?";
vul[25] = "et dixistis non est aequa via Domini audite domus Israhel numquid via mea non est aequa et non magis viae vestrae pravae sunt";
kjv[26] = "When a righteous [man] turneth away from his righteousness, and committeth iniquity, and dieth in them; for his iniquity that he hath done shall he die.";
rsv[26] = "When a righteous man turns away from his righteousness and commits iniquity, he shall die for it; for the iniquity which he has committed he shall die.";
asv[26] = "When the righteous man turneth away from his righteousness, and committeth iniquity, and dieth therein; in his iniquity that he hath done shall he die.";
yng[26] = "In the turning back of the righteous from his righteousness, And he hath done perversity, And he is dying by them, for his perversity That he hath done he dieth.";
dby[26] = "When the righteous turneth away from his righteousness, and practiseth what is wrong, and dieth for it; in his wrong that he hath done shall he die.";
web[26] = "When a righteous [man] turneth away from his righteousness, and committeth iniquity, and dieth in them; for his iniquity that he hath done shall he die.";
hnv[26] = "When the righteous man turns away from his righteousness, and commits iniquity, and dies therein; in his iniquity that he has done shall he die.";
vul[26] = "cum enim averterit se iustus a iustitia sua et fecerit iniquitatem morietur in eis in iniustitia quam operatus est morietur";
kjv[27] = "Again, when the wicked [man] turneth away from his wickedness that he hath committed, and doeth that which is lawful and right, he shall save his soul alive.";
rsv[27] = "Again, when a wicked man turns away from the wickedness he has committed and does what is lawful and right, he shall save his life.";
asv[27] = "Again, when the wicked man turneth away from his wickedness that he hath committed, and doeth that which is lawful and right, he shall save his soul alive.";
yng[27] = "And in the turning back of the wicked From his wickedness that he hath done, And he doth judgment and righteousness, He his soul doth keep alive.";
dby[27] = "And when the wicked turneth from his wickedness which he hath committed, and doeth judgment and justice, he shall keep his soul alive.";
web[27] = "Again, when a wicked [man] turneth away from his wickedness that he hath committed, and doeth that which is lawful and right, he shall save his soul alive.";
hnv[27] = "Again, when the wicked man turns away from his wickedness that he has committed, and does that which is lawful and right, he shall save his soul alive.";
vul[27] = "et cum averterit se impius ab impietate sua quam operatus est et fecerit iudicium et iustitiam ipse animam suam vivificabit";
kjv[28] = "Because he considereth, and turneth away from all his transgressions that he hath committed, he shall surely live, he shall not die.";
rsv[28] = "Because he considered and turned away from all the transgressions which he had committed, he shall surely live, he shall not die.";
asv[28] = "Because he considereth, and turneth away from all his transgressions that he hath committed, he shall surely live, he shall not die.";
yng[28] = "And he seeth and turneth back, From all his transgressions that he hath done, He doth surely live, he doth not die,";
dby[28] = "Because he considereth, and turneth from all his transgressions which he hath committed, he shall certainly live, he shall not die.";
web[28] = "Because he considereth and turneth away from all his transgressions that he hath committed, he shall surely live, he shall not die.";
hnv[28] = "Because he considers, and turns away from all his transgressions that he has committed, he shall surely live, he shall not die.";
vul[28] = "considerans enim et avertens se ab omnibus iniquitatibus suis quas operatus est vita vivet et non morietur";
kjv[29] = "Yet saith the house of Israel, The way of the Lord is not equal. O house of Israel, are not my ways equal? are not your ways unequal?";
rsv[29] = "Yet the house of Israel says, \'The way of the Lord is not just.\' O house of Israel, are my ways not just? Is it not your ways that are not just?";
asv[29] = "Yet saith the house of Israel, The way of the Lord is not equal. O house of Israel, are not my ways equal? are not your ways unequal?";
yng[29] = "And the house of Israel have said, Not pondered is the way of the Lord, My ways -- are they not pondered? O house of Israel -- are not your ways unpondered?";
dby[29] = "But the house of Israel say, The way of the Lord is not equal. O house of Israel, are not my ways equal? Is it not your ways that are unequal?";
web[29] = "Yet saith the house of Israel, The way of the Lord is not equal. O house of Israel, are not my ways equal? are not your ways unequal?";
hnv[29] = "Yet says the house of Yisra\'el, The way of the Lord is not equal. house of Yisra\'el, are not my ways equal? are not your ways unequal?";
vul[29] = "et dicunt filii Israhel non est aequa via Domini numquid viae meae non sunt aequae domus Israhel et non magis viae vestrae pravae";
kjv[30] = "Therefore I will judge you, O house of Israel, every one according to his ways, saith the Lord GOD. Repent, and turn [yourselves] from all your transgressions; so iniquity shall not be your ruin.";
rsv[30] = "&quot;Therefore I will judge you, O house of Israel, every one according to his ways, says the Lord GOD. Repent and turn from all your transgressions, lest iniquity be your ruin.";
asv[30] = "Therefore I will judge you, O house of Israel, every one according to his ways, saith the Lord Jehovah. Return ye, and turn yourselves from all your transgressions; so iniquity shall not be your ruin.";
yng[30] = "Therefore, each according to his ways I judge you, O house of Israel? An affirmation of the Lord Jehovah, Turn ye back, yea, turn yourselves back, From all your transgressions, And iniquity is not to you for a stumbling-block,";
dby[30] = "Therefore I will judge you, house of Israel, every one according to his ways, saith the Lord Jehovah. Return ye, and turn from all your transgressions; so iniquity shall not be your snare.";
web[30] = "Therefore I will judge you, O house of Israel, every one according to his ways, saith the Lord GOD. Repent, and turn [yourselves] from all your transgressions; so iniquity shall not be your ruin.";
hnv[30] = "Therefore I will judge you, house of Yisra\'el, everyone according to his ways, says the Lord GOD. Return you, and turn yourselves from all your transgressions; so iniquity shall not be your ruin.";
vul[30] = "idcirco unumquemque iuxta vias suas iudicabo domus Israhel ait Dominus Deus convertimini et agite paenitentiam ab omnibus iniquitatibus vestris et non erit vobis in ruinam iniquitas";
kjv[31] = "Cast away from you all your transgressions, whereby ye have transgressed; and make you a new heart and a new spirit: for why will ye die, O house of Israel?";
rsv[31] = "Cast away from you all the transgressions which you have committed against me, and get yourselves a new heart and a new spirit! Why will you die, O house of Israel?";
asv[31] = "Cast away from you all your transgressions, wherein ye have transgressed; and make you a new heart and a new spirit: for why will ye die, O house of Israel?";
yng[31] = "Cast from off you all your transgressions, By which ye have transgressed, And make to you a new heart, and a new spirit, And why do ye die, O house of Israel?";
dby[31] = "Cast away from you all your transgressions wherewith ye have transgressed, and make you a new heart and a new spirit: why then will ye die, house of Israel?";
web[31] = "Cast away from you all your transgressions, by which ye have transgressed; and make you a new heart and a new spirit: for why will ye die, O house of Israel?";
hnv[31] = "Cast away from you all your transgressions, in which you have transgressed; and make you a new heart and a new spirit: for why will you die, house of Yisra\'el?";
vul[31] = "proicite a vobis omnes praevaricationes vestras in quibus praevaricati estis et facite vobis cor novum et spiritum novum et quare moriemini domus Israhel";
kjv[32] = "For I have no pleasure in the death of him that dieth, saith the Lord GOD: wherefore turn [yourselves], and live ye.";
rsv[32] = "For I have no pleasure in the death of any one, says the Lord GOD; so turn, and live.&quot;";
asv[32] = "For I have no pleasure in the death of him that dieth, saith the Lord Jehovah: wherefore turn yourselves, and live.";
yng[32] = "For I have no pleasure in the death of the dying, An affirmation of the Lord Jehovah, And turn ye back and live!";
dby[32] = "For I have no pleasure in the death of him that dieth, saith the Lord Jehovah; therefore turn ye and live.";
web[32] = "For I have no pleasure in the death of him that dieth, saith the Lord GOD: wherefore turn [ye], and live.";
hnv[32] = "For I have no pleasure in the death of him who dies, says the Lord GOD: therefore turn yourselves, and live.";
vul[32] = "quia nolo mortem morientis dicit Dominus Deus revertimini et vivite";
