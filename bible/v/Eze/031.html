csb[1] = "In the eleventh year, in the third month, on the first day of the month, the word of the LORD came to me:";
csb[2] = "&quot;Son of man, say to Pharaoh king of Egypt and to his hordes, \'Who are you like in your greatness?";
csb[3] = "&quot;Think of Assyria, a cedar in Lebanon, with beautiful branches and shady foliage and of lofty height. Its top was among the clouds.";
csb[4] = "&quot;The waters caused it to grow; the underground springs made it tall, directing their rivers all around the place where the tree was planted and sending their channels to all the trees of the field.";
csb[5] = "&quot;Therefore the cedar became greater in height than all the trees of the field. Its branches multiplied, and its boughs grew long as it spread them out because of the abundant water.";
csb[6] = "&quot;All the birds of the sky nested in its branches, and all the animals of the field gave birth beneath its boughs; all the great nations lived in its shade.";
csb[7] = "&quot;It was beautiful in its size, in the length of its limbs, for its roots extended to abundant water.";
csb[8] = "&quot;The cedars in God\'s garden could not eclipse it; the pine trees couldn\'t compare with its branches, nor could the plane trees match its boughs. No tree in the garden of God could compare with it in beauty.";
csb[9] = "&quot;I made it beautiful with its many limbs, and all the trees of Eden, which were in God\'s garden, envied it.";
csb[10] = "&quot; \'Therefore, this is what the Lord GOD says: Since it towered high in stature and set its top among the clouds, and it grew proud on account of its height,";
csb[11] = "&quot;I determined to hand it over to a ruler of nations; he would surely deal with it. I banished it because of its wickedness.";
csb[12] = "&quot;Foreigners, ruthless men from the nations, cut it down and left it lying. Its limbs fell on the mountains and in every valley; its boughs lay broken in all the earth\'s ravines. All the peoples of the earth left its shade and abandoned it.";
csb[13] = "&quot;All the birds of the sky nested on its fallen trunk, and all the animals of the field were among its boughs.";
csb[14] = "&quot;This happened so that no trees planted beside water would become great in height and set their tops among the clouds, and so that no other well-watered trees would reach them in height. For they have all been consigned to death, to the underworld, among the people who descend to the Pit.";
csb[15] = "&quot; \'This is what the Lord GOD says: I caused grieving on the day the cedar went down to Sheol. I closed off the underground deep because of it: I held back the rivers of the deep, and its abundant water was restrained. I made Lebanon mourn on account of it, and all the trees of the field fainted because of it.";
csb[16] = "&quot;I made the nations quake at the sound of its downfall, when I threw it down to Sheol to be with those who descend to the Pit. Then all the trees of Eden, the choice and best of Lebanon, all the well-watered trees, were comforted in the underworld.";
csb[17] = "&quot;They too descended with it to Sheol, to those slain by the sword. As its allies they had lived in its shade among the nations.";
csb[18] = "&quot; \'Who then are you like in glory and greatness among Eden\'s trees? You also will be brought down to the underworld to be with the trees of Eden. You will lie among the uncircumcised with those slain by the sword. This is Pharaoh and all his hordes. This is the declaration of the Lord GOD.\' &quot;";

kjv[12] = "And strangers, the terrible of the nations, have cut him off, and have left him: upon the mountains and in all the valleys his branches are fallen, and his boughs are broken by all the rivers of the land; and all the people of the earth are gone down from his shadow, and have left him.";
rsv[12] = "Foreigners, the most terrible of the nations, will cut it down and leave it. On the mountains and in all the valleys its branches will fall, and its boughs will lie broken in all the watercourses of the land; and all the peoples of the earth will go from its shadow and leave it.";
asv[12] = "And strangers, the terrible of the nations, have cut him off, and have left him: upon the mountains and in all the valleys his branches are fallen, and his boughs are broken by all the watercourses of the land; and all the peoples of the earth are gone down from his shadow, and have left him.";
yng[12] = "And cut him off do strangers, The terrible of nations, and they leave him, On the mountains and in all valleys have his thin shoots fallen, And broken are his boughs at all streams of the land, And go down from his shade do all peoples of the land, and they leave him.";

kjv[14] = "To the end that none of all the trees by the waters exalt themselves for their height, neither shoot up their top among the thick boughs, neither their trees stand up in their height, all that drink water: for they are all delivered unto death, to the nether parts of the earth, in the midst of the children of men, with them that go down to the pit.";
rsv[14] = "All this is in order that no trees by the waters may grow to lofty height or set their tops among the clouds, and that no trees that drink water may reach up to them in height; for they are all given over to death, to the nether world among mortal men, with those who go down to the Pit.";
asv[14] = "to the end that none of all the trees by the waters exalt themselves in their stature, neither set their top among the thick boughs, nor that their mighty ones stand up in their height, [even] all that drink water: for they are all delivered unto death, to the nether parts of the earth, in the midst of the children of men, with them that go down to the pit.";
yng[14] = "In order that none of the trees of the waters May become haughty because of their stature, Nor give their foliage between thickets, Nor any drinking waters stand up unto them in their haughtiness, For all of them are given up to death, Unto the earth -- the lower part, In the midst of the sons of men, Unto those going down to the pit.";
dby[14] = "to the end that none of all the trees by the waters exalt themselves in their stature, nor set their top amidst the thick boughs, and that none of them that drink water stand up in his height by himself; for they are all given over unto death in the lower parts of the earth, in the midst of the children of men, with them that go down to the pit.";
web[14] = "To the end that none of all the trees by the waters exalt themselves for their hight, neither shoot up their top among the thick boughs, neither their trees stand up in their hight, all that drink water: for they are all delivered to death, to the nether parts of the earth, in the midst of the children of men, with them that go down to the pit.";
hnv[14] = "to the end that none of all the trees by the waters exalt themselves in their stature, neither set their top among the thick boughs, nor that their mighty ones stand up on their height, [even] all who drink water: for they are all delivered to death, to the lower parts of the eretz, in the midst of the children of men, with those who go down to the pit.";
vul[14] = "quam ob rem non elevabuntur in altitudine sua omnia ligna aquarum neque ponent sublimitatem suam inter nemorosa atque frondosa nec stabunt in sublimitate eorum omnia quae inrigantur aquis quia omnes traditi sunt in mortem ad terram ultimam in medio filiorum hominum ad eos qui descendunt in lacum";
kjv[15] = "Thus saith the Lord GOD; In the day when he went down to the grave I caused a mourning: I covered the deep for him, and I restrained the floods thereof, and the great waters were stayed: and I caused Lebanon to mourn for him, and all the trees of the field fainted for him.";
rsv[15] = "&quot;Thus says the Lord GOD: When it goes down to Sheol I will make the deep mourn for it, and restrain its rivers, and many waters shall be stopped; I will clothe Lebanon in gloom for it, and all the trees of the field shall faint because of it.";
asv[15] = "Thus saith the Lord Jehovah: In the day when he went down to Sheol I caused a mourning: I covered the deep for him, and I restrained the rivers thereof; and the great waters were stayed; and I caused Lebanon to mourn for him, and all the trees of the field fainted for him.";
yng[15] = "Thus said the Lord Jehovah: In the day of his going down to sheol I have caused mourning, I have covered for him the deep, and diminish its flowings, And restrained are many waters, And I make Lebanon black for him, And all trees of the field have been covered for him.";
dby[15] = "Thus saith the Lord Jehovah: In the day when he went down to Sheol, I caused a mourning: I covered the deep for him, and I restrained the floods thereof, and the great waters were stayed; and I made Lebanon black for him, and all the trees of the field fainted for him.";
web[15] = "Thus saith the Lord GOD; In the day when he went down to the grave I caused a mourning: I covered the deep for him, and I restrained its floods, and the great waters were stayed: and I caused Lebanon to mourn for him, and all the trees of the field fainted for him.";
hnv[15] = "Thus says the Lord GOD: In the day when he went down to She\'ol I caused a mourning: I covered the deep for him, and I restrained the rivers of it; and the great waters were stayed; and I caused Levanon to mourn for him, and all the trees of the field fainted for him.";
vul[15] = "haec dicit Dominus Deus in die quando descendit ad inferos indixi luctum operui eum abysso et prohibui flumina eius et coercui aquas multas contristatus est super eum Libanus et omnia ligna agri concussa sunt";
kjv[16] = "I made the nations to shake at the sound of his fall, when I cast him down to hell with them that descend into the pit: and all the trees of Eden, the choice and best of Lebanon, all that drink water, shall be comforted in the nether parts of the earth.";
rsv[16] = "I will make the nations quake at the sound of its fall, when I cast it down to Sheol with those who go down to the Pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water, will be comforted in the nether world.";
asv[16] = "I made the nations to shake at the sound of his fall, when I cast him down to Sheol with them that descend into the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water, were comforted in the nether parts of the earth.";
yng[16] = "From the sound of his fall I have caused nations to shake, In My causing him to go down to sheol, With those going down to the pit, And comforted in the earth -- the lower part, are all trees of Eden, The choice and the good of Lebanon, All drinking waters.";

vul[16] = "a sonitu ruinae eius commovi gentes cum deducerem eum ad infernum cum his qui descendebant in lacum et consolata sunt in terra infima omnia ligna voluptatis egregia atque praeclara in Libano universa quae inrigabantur aquis";
kjv[17] = "They also went down into hell with him unto [them that be] slain with the sword; and [they that were] his arm, [that] dwelt under his shadow in the midst of the heathen.";
