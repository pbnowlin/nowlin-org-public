csb[1] = "Then he brought me back to the entrance of the temple and there was water flowing from under the threshold of the temple toward the east, for the temple faced east. The water was coming down from under the south side of the threshold of the temple, south of the altar.";
csb[2] = "Next he brought me out by way of the north gate and led me around the outside to the outer gate that faced east; there the water was trickling from the south side.";
csb[3] = "As the man went out east with a measuring line in his hand, he measured off a third of a mile and led me through the water. It came up to my ankles.";
csb[4] = "Then he measured off a third of a mile and led me through the water. It came up to my knees. He measured off another third of a mile and led me through the water. It came up to my waist.";
csb[5] = "Again he measured off a third of a mile, and it was a river that I could not cross on foot. For the water had risen; it was deep enough to swim in, a river that could not be crossed on foot.";
csb[6] = "He asked me, &quot;Do you see this, son of man? &quot; Then he led me back to the bank of the river.";
csb[7] = "When I had returned, I saw a very large number of trees along both sides of the riverbank.";
csb[8] = "He said to me, &quot;This water flows out to the eastern region and goes down to the Arabah. When it enters the sea, the sea of foul water, the water of the sea becomes fresh.";
csb[9] = "&quot;Every kind of living creature that swarms will live wherever the river flows, and there will be a huge number of fish because this water goes there. Since the water will become fresh, there will be life everywhere the river goes.";
csb[10] = "&quot;Fishermen will stand beside it from En-gedi to En-eglaim. These will become places where nets are spread out to dry. Their fish will consist of many different kinds, like the fish of the Mediterranean Sea.";
csb[11] = "&quot;Yet its swamps and marshes will not be healed; they will be left for salt.";
csb[12] = "&quot;All kinds of trees providing food will grow along both banks of the river. Their leaves will not wither, and their fruit will not fail. Each month they will bear fresh fruit because the water comes from the sanctuary. Their fruit will be used for food and their leaves for medicine.&quot;";
csb[13] = "This is what the Lord GOD says: &quot;This is the border you will use to divide the land as an inheritance for the twelve tribes of Israel. Joseph will receive two shares.";
csb[14] = "&quot;You will inherit it in equal portions, since I swore to give it to your ancestors. So this land will fall to you as an inheritance.";
csb[15] = "&quot;This is to be the border of the land: On the north side it will extend from the Mediterranean Sea by way of Hethlon and Lebo-hamath to Zedad,";
csb[16] = "&quot;Berothah, and Sibraim (which is between the border of Damascus and the border of Hamath), as far as Hazer-hatticon, which is on the border of Hauran.";
csb[17] = "&quot;So the border will run from the sea to Hazar-enon at the border of Damascus, with the territory of Hamath to the north. This will be the northern side.";
csb[18] = "&quot;On the east side it will run between Hauran and Damascus, along the Jordan between Gilead and the land of Israel; you will measure from the northern border to the eastern sea. This will be the eastern side.";
csb[19] = "&quot;On the south side it will run from Tamar to the Waters of Meribath-kadesh, and on to the Brook of Egypt as far as the Mediterranean Sea. This will be the southern side.";
csb[20] = "&quot;On the west side the Mediterranean Sea will be the border, from the southern border up to a point opposite Lebo-hamath. This will be the western side.";
csb[21] = "&quot;You are to divide this land among yourselves according to the tribes of Israel.";
csb[22] = "&quot;You will allot it as an inheritance for yourselves and for the aliens residing among you, who have fathered children among you. You will treat them like native-born Israelites; along with you, they will be allotted an inheritance among the tribes of Israel.";
csb[23] = "&quot;In whatever tribe the alien resides, you will assign his inheritance there.&quot; This is the declaration of the Lord GOD.";
kjv[1] = "Afterward he brought me again unto the door of the house; and, behold, waters issued out from under the threshold of the house eastward: for the forefront of the house [stood toward] the east, and the waters came down from under from the right side of the house, at the south [side] of the altar.";
rsv[1] = "Then he brought me back to the door of the temple; and behold, water was issuing from below the threshold of the temple toward the east (for the temple faced east); and the water was flowing down from below the south end of the threshold of the temple, south of the altar.";
asv[1] = "And he brought me back unto the door of the house; and, behold, waters issued out from under the threshold of the house eastward (for the forefront of the house was toward the east); and the waters came down from under, from the right side of the house, on the south of the altar.";
yng[1] = "And he causeth me to turn back unto the opening of the house; and lo, water is coming forth from under the threshold of the house eastward, for the front of the house [is] eastward, and the water is coming down from beneath, from the right side of the house, from the south of the altar.";
dby[1] = "And he brought me back to the door of the house; and behold, waters issued out from under the threshold of the house eastward: for the front of the house was eastward. And the waters came down from under, from the right side of the house, south of the altar.";
web[1] = "Afterward he brought me again to the door of the house; and behold, waters issued out from under the threshhold of the house eastward: for the front of the house [stood towards] the east, and the waters came down from under from the right side of the house, at the south [side] of the altar.";
hnv[1] = "He brought me back to the door of the house; and, behold, waters issued out from under the threshold of the house eastward; (for the forefront of the house was toward the east;) and the waters came down from under, from the right side of the house, on the south of the altar.";
vul[1] = "et convertit me ad portam domus et ecce aquae egrediebantur subter limen domus ad orientem facies enim domus respiciebat ad orientem aquae autem descendebant in latus templi dextrum ad meridiem altaris";
kjv[2] = "Then brought he me out of the way of the gate northward, and led me about the way without unto the utter gate by the way that looketh eastward; and, behold, there ran out waters on the right side.";

yng[2] = "And he causeth me to go out the way of the gate northward, and causeth me to turn round the way without, unto the gate that [is] without, the way that is looking eastward, and lo, water is coming forth from the right side.";
dby[2] = "And he brought me out by the way of the gate northward, and led me round outside unto the outer gate towards [the gate] that looketh eastward; and behold, waters ran out on the right side.";

hnv[2] = "Then he brought me out by the way of the gate northward, and led me round by the way outside to the outer gate, by the way of [the gate] that looks toward the east; and, behold, there ran out waters on the right side.";
vul[2] = "et eduxit me per viam portae aquilonis et convertit me ad viam foras portam exteriorem viam quae respiciebat ad orientem et ecce aquae redundantes a latere dextro";
kjv[3] = "And when the man that had the line in his hand went forth eastward, he measured a thousand cubits, and he brought me through the waters; the waters [were] to the ankles.";
rsv[3] = "Going on eastward with a line in his hand, the man measured a thousand cubits, and then led me through the water; and it was ankle-deep.";
asv[3] = "When the man went forth eastward with the line in his hand, he measured a thousand cubits, and he caused me to pass through the waters, waters that were to the ankles.";
yng[3] = "In the going out of the man eastward, and a line in his hand, then he measureth a thousand by the cubit, and he causeth me to pass over into water -- water to the ankles.";
dby[3] = "When the man went forth eastward, a line was in his hand; and he measured a thousand cubits, and he caused me to pass through the waters: the waters were to the ankles.";

hnv[3] = "When the man went forth eastward with the line in his hand, he measured one thousand cubits, and he caused me to pass through the waters, waters that were to the ankles.";

rsv[4] = "Again he measured a thousand, and led me through the water; and it was knee-deep. Again he measured a thousand, and led me through the water; and it was up to the loins.";
asv[4] = "Again he measured a thousand, and caused me to pass through the waters, waters that were to the knees. Again he measured a thousand, and caused me to pass through [the waters], waters that were to the loins.";
yng[4] = "And he measureth a thousand, and causeth me to pass over into water -- water to the knees. And he measureth a thousand, and causeth me to pass over -- water to the loins.";
dby[4] = "And he measured a thousand [cubits], and caused me to pass through the waters: the waters were to the knees. And he measured a thousand and caused me to pass through: the waters were to the loins.";

asv[5] = "Afterward he measured a thousand; [and it was] a river that I could not pass through; for the waters were risen, waters to swim in, a river that could not be passed through.";
yng[5] = "And he measureth a thousand -- a stream that I am not able to pass over; for risen have the waters -- waters to swim in -- a stream that is not passed over.";

kjv[8] = "Then said he unto me, These waters issue out toward the east country, and go down into the desert, and go into the sea: [which being] brought forth into the sea, the waters shall be healed.";
rsv[8] = "And he said to me, &quot;This water flows toward the eastern region and goes down into the Arabah; and when it enters the stagnant waters of the sea, the water will become fresh.";
asv[8] = "Then said he unto me, These waters issue forth toward the eastern region, and shall go down into the Arabah; and they shall go toward the sea; into the sea [shall the waters go] which were made to issue forth; and the waters shall be healed.";
yng[8] = "And he saith unto me, `These waters are going forth unto the east circuit, and have gone down unto the desert, and have entered the sea; unto the sea they are brought forth, and the waters have been healed.";
dby[8] = "And he said unto me, These waters issue out toward the east district, and go down into the plain, and go into the sea; when they are brought forth into the sea, the waters [thereof] shall be healed.";
web[8] = "Then said he to me, These waters issue out towards the east country, and go down into the desert, and go into the sea: [which being] brought forth into the sea, the waters shall be healed.";
hnv[8] = "Then said he to me, These waters issue forth toward the eastern region, and shall go down into the `Aravah; and they shall go toward the sea; into the sea [shall the waters go] which were made to issue forth; and the waters shall be healed.";
vul[8] = "et ait ad me aquae istae quae egrediuntur ad tumulos sabuli orientalis et descendunt ad plana deserti intrabunt mare et exibunt et sanabuntur aquae";
kjv[9] = "And it shall come to pass, [that] every thing that liveth, which moveth, whithersoever the rivers shall come, shall live: and there shall be a very great multitude of fish, because these waters shall come thither: for they shall be healed; and every thing shall live whither the river cometh.";
rsv[9] = "And wherever the river goes every living creature which swarms will live, and there will be very many fish; for this water goes there, that the waters of the sea may become fresh; so everything will live where the river goes.";
asv[9] = "And it shall come to pass, that every living creature which swarmeth, in every place whither the rivers come, shall live; and there shall be a very great multitude of fish; for these waters are come thither, and [the waters of the sea] shall be healed, and everything shall live whithersoever the river cometh.";
yng[9] = "And it hath come to pass, every living creature that teemeth, whithersoever the streams come, doth live: and there hath been great abundance of fish, for these waters have come thither, and they are healed; and every thing whither the stream cometh hath lived.";
dby[9] = "And it shall come to pass that every living thing which moveth, whithersoever the double river shall come, shall live. And there shall be a very great multitude of fish; for these waters shall come thither, and [the waters of the sea] shall be healed; and everything shall live whither the river cometh.";
web[9] = "And it shall come to pass, [that] every thing that liveth, which moveth, whithersoever the rivers shall come, shall live: and there shall be a very great multitude of fish, because these waters shall come thither: for they shall be healed; and every thing shall live whither the river cometh.";
hnv[9] = "It shall happen, that every living creature which swarms, in every place where the rivers come, shall live; and there shall be a very great multitude of fish; for these waters are come there, and [the waters of the sea] shall be healed, and everything shall live wherever the river comes.";
vul[9] = "et omnis anima vivens quae serpit quocumque venerit torrens vivet et erunt pisces multi satis postquam venerint illuc aquae istae et sanabuntur et vivent omnia ad quae venerit torrens";
kjv[10] = "And it shall come to pass, [that] the fishers shall stand upon it from Engedi even unto Eneglaim; they shall be a [place] to spread forth nets; their fish shall be according to their kinds, as the fish of the great sea, exceeding many.";
rsv[10] = "Fishermen will stand beside the sea; from En-ge\'di to En-eg\'laim it will be a place for the spreading of nets; its fish will be of very many kinds, like the fish of the Great Sea.";
asv[10] = "And it shall come to pass, that fishers shall stand by it: from En-gedi even unto En-eglaim shall be a place for the spreading of nets; their fish shall be after their kinds, as the fish of the great sea, exceeding many.";
yng[10] = "And it hath come to pass, fishers do stand by it, from En-Gedi even unto En-Eglaim; a spreading place of nets they are; according to their own kind is their fish, as the fish of the great sea, very many.";
dby[10] = "And it shall come to pass, that fishers shall stand upon it; from En-gedi even unto En-eglaim shall be [a place] to spread forth nets: their fish shall be according to their kinds, as the fish of the great sea, exceeding many.";
web[10] = "And it shall come to pass, [that] the fishers shall stand upon it from En-gedi even to En-eglaim; they shall be a [place] to spread forth nets; their fish shall be according to their kinds, as the fish of the great sea, very numerous.";
hnv[10] = "It shall happen, that fishermen shall stand by it: from `En-Gedi even to `En-`Eglayim shall be a place for the spreading of nets; their fish shall be after their kinds, as the fish of the great sea, exceeding many.";

kjv[12] = "And by the river upon the bank thereof, on this side and on that side, shall grow all trees for meat, whose leaf shall not fade, neither shall the fruit thereof be consumed: it shall bring forth new fruit according to his months, because their waters they issued out of the sanctuary: and the fruit thereof shall be for meat, and the leaf thereof for medicine.";
rsv[12] = "And on the banks, on both sides of the river, there will grow all kinds of trees for food. Their leaves will not wither nor their fruit fail, but they will bear fresh fruit every month, because the water for them flows from the sanctuary. Their fruit will be for food, and their leaves for healing.&quot;";
asv[12] = "And by the river upon the bank thereof, on this side and on that side, shall grow every tree for food, whose leaf shall not whither, neither shall the fruit thereof fail: it shall bring forth new fruit every month, because the waters thereof issue out of the sanctuary; and the fruit thereof shall be for food, and the leaf thereof for healing.";
yng[12] = "And by the stream there cometh up on its edge, on this side and on that side, every [kind of] fruit-tree whose leaf fadeth not, and not consumed is its fruit, according to its months it yieldeth first-fruits, because its waters from the sanctuary are coming forth; and its fruits hath been for food, and its leaf for medicine.";
dby[12] = "And by the river, upon its bank, on the one side and on the other, shall grow all trees for food, whose leaf shall not fade, nor their fruit fail: it shall bring forth new fruit every month, for its waters issue out of the sanctuary; and the fruit thereof shall be for food, and the leaf thereof for medicine.";
web[12] = "And by the river upon its bank, on this side and on that side, shall grow all trees for food, whose leaf shall not fade, neither shall its fruit be consumed: it shall bring forth new fruit according to its months, because their waters they issued out of the sanctuary: and its fruit shall be for food, and its leaf for medicine.";
hnv[12] = "By the river on the bank of it, on this side and on that side, shall grow every tree for food, whose leaf shall not wither, neither shall the fruit of it fail: it shall bring forth new fruit every month, because the waters of it issue out of the sanctuary; and the fruit of it shall be for food, and the leaf of it for healing.";
vul[12] = "et super torrentem orietur in ripis eius ex utraque parte omne lignum pomiferum non defluet folium ex eo et non deficiet fructus eius per singulos menses adferet primitiva quia aquae eius de sanctuario egredientur et erunt fructus eius in cibum et folia eius ad medicinam";
kjv[13] = "Thus saith the Lord GOD; This [shall be] the border, whereby ye shall inherit the land according to the twelve tribes of Israel: Joseph [shall have two] portions.";

web[16] = "Hamath, Berothah, Sibraim, which [is] between the border of Damascus and the border of Hamath; Hazar-hatticon, which [is] by the border of Hauran.";
hnv[16] = "Hamat, Berotah, Sivrai, which is between the border of Dammesek and the border of Hamat; the middle Hatzer, which is by the border of Havran.";
vul[16] = "Emath Berotha Sabarim quae est inter terminum Damasci et confinium Emath domus Atticon quae est iuxta terminos Auran";
kjv[17] = "And the border from the sea shall be Hazarenan, the border of Damascus, and the north northward, and the border of Hamath. And [this is] the north side.";
rsv[17] = "So the boundary shall run from the sea to Hazar-e\'non, which is on the northern border of Damascus, with the border of Hamath to the north. This shall be the north side.";
asv[17] = "And the border from the sea, shall be Hazar-enon at the border of Damascus; and on the north northward is the border of Hamath. This is the north side.";
yng[17] = "And the border from the sea hath been Hazar-Enan, the border of Damascus, and Zaphon at the north, and the border of Hamath: and [this is] the north quarter.";
dby[17] = "And the border from the sea shall be Hazar-enan, the border of Damascus, and the north northward, and the border of Hamath: this is the north side.";
web[17] = "And the border from the sea shall be Hazar-enan, the border of Damascus, and the north northward, and the border of Hamath. And [this is] the north side.";
hnv[17] = "The border from the sea, shall be Hatzar-`Enon at the border of Dammesek; and on the north northward is the border of Hamat. This is the north side.";
vul[17] = "et erit terminus a mari usque ad atrium Aenon terminus Damasci et ab aquilone ad aquilonem et terminus Emath plaga autem septentrionalis";
kjv[18] = "And the east side ye shall measure from Hauran, and from Damascus, and from Gilead, and from the land of Israel [by] Jordan, from the border unto the east sea. And [this is] the east side.";
rsv[18] = "&quot;On the east side, the boundary shall run from Hazar-e\'non between Hauran and Damascus; along the Jordan between Gilead and the land of Israel; to the eastern sea and as far as Tamar. This shall be the east side.";
asv[18] = "And the east side, between Hauran and Damascus and Gilead, and the land of Israel, shall be the Jordan; from the [north] border, unto the east sea shall ye measure. This is the east side.";
yng[18] = "`And the east quarter [is] from between Havran, and Damascus, and Gilead, and the land of Israel, [to] the Jordan; from the border over-against the eastern sea ye measure: and [this is] the east quarter.";
dby[18] = "-- And on the east side ye shall measure between Hauran and Damascus, and Gilead and the land of Israel [by] the Jordan, from the border unto the east sea: this is the east side.";
web[18] = "And the east side ye shall measure from Hauran, and from Damascus, and from Gilead, and from the land of Israel [by] Jordan, from the border to the east sea. And [this is] the east side.";
hnv[18] = "The east side, between Hauran and Dammesek and Gil`ad, and Eretz-Yisra\'el, shall be the Yarden; from the [north] border to the east sea shall you measure. This is the east side.";
vul[18] = "porro plaga orientalis de medio Auran et de medio Damasci et de medio Galaad et de medio terrae Israhel Iordanis disterminans ad mare orientale metiemini etiam plagam orientalem";
kjv[19] = "And the south side southward, from Tamar [even] to the waters of strife [in] Kadesh, the river to the great sea. And [this is] the south side southward.";
rsv[19] = "&quot;On the south side, it shall run from Tamar as far as the waters of Meribath-ka\'desh, thence along the Brook of Egypt to the Great Sea. This shall be the south side.";
asv[19] = "And the south side southward shall be from Tamar as far as the waters of Meriboth-kadesh, to the brook [of Egypt], unto the great sea. This is the south side southward.";
yng[19] = "`And the south quarter southward [is] from Tamar unto the waters of Meriboth-Kadesh, the stream unto the great sea: and [this is] the south quarter southward.";
dby[19] = "-- And the south side southward, from Tamar to the waters of Meribah-Kadesh, by the torrent, unto the great sea: this is the south side southward.";
web[19] = "And the south side southward, from Tamar [even] to the waters of strife [in] Kadesh, the river to the great sea. And [this is] the south side southward.";
hnv[19] = "The south side southward shall be from Tamar as far as the waters of Merivot-Kadesh, to the brook [of Mitzrayim], to the great sea. This is the south side southward.";
vul[19] = "plaga autem australis meridiana a Thamar usque ad aquas Contradictionis Cades et torrens usque ad mare magnum et plaga ad meridiem australis";
kjv[20] = "The west side also [shall be] the great sea from the border, till a man come over against Hamath. This [is] the west side.";
rsv[20] = "&quot;On the west side, the Great Sea shall be the boundary to a point opposite the entrance of Hamath. This shall be the west side.";
asv[20] = "And the west side shall be the great sea, from the [south] border as far as over against the entrance of Hamath. This is the west side.";
yng[20] = "`And the west quarter [is] the great sea, from the border till over-against the coming in to Hamath: this [is] the west quarter.";
dby[20] = "-- And the west side shall be the great sea from the border, as far as over against the entering into Hamath: this is the west side.";
web[20] = "The west side also [shall be] the great sea from the border, till a man cometh over against Hamath. This [is] the west side.";
hnv[20] = " The west side shall be the great sea, from the [south] border as far as over against the entrance of Hamat. This is the west side.";
vul[20] = "et plaga maris mare magnum a confinio per directum donec venias Emath haec est plaga maris";
kjv[21] = "So shall ye divide this land unto you according to the tribes of Israel.";
rsv[21] = "&quot;So you shall divide this land among you according to the tribes of Israel.";
asv[21] = "So shall ye divide this land unto you according to the tribes of Israel.";
yng[21] = "`And ye have divided this land to you, according to the tribes of Israel;";
dby[21] = "And ye shall divide this land unto you according to the tribes of Israel.";
web[21] = "So shall ye divide this land to you according to the tribes of Israel.";
hnv[21] = "So shall you divide this land to you according to the tribes of Yisra\'el.";
vul[21] = "et dividetis terram istam vobis per tribus Israhel";
kjv[22] = "And it shall come to pass, [that] ye shall divide it by lot for an inheritance unto you, and to the strangers that sojourn among you, which shall beget children among you: and they shall be unto you as born in the country among the children of Israel; they shall have inheritance with you among the tribes of Israel.";
rsv[22] = "You shall allot it as an inheritance for yourselves and for the aliens who reside among you and have begotten children among you. They shall be to you as native-born sons of Israel; with you they shall be allotted an inheritance among the tribes of Israel.";
asv[22] = "And it shall come to pass, that ye shall divide it by lot for an inheritance unto you and to the strangers that sojourn among you, who shall beget children among you; and they shall be unto you as the home-born among the children of Israel; they shall have inheritance with you among the tribes of Israel.";
yng[22] = "and it hath come to pass, ye separate it for an inheritance to yourselves, and to the sojourners who are sojourning in your midst, who have begotten sons in your midst, and they have been to you as native, with the sons of Israel, with you they are separated for an inheritance in the midst of the tribes of Israel.";
dby[22] = "And it shall come to pass that ye shall divide it by lot for an inheritance unto you, and to the strangers that sojourn among you, who shall beget children among you; and they shall be unto you as the home-born among the children of Israel: with you shall they draw by lot inheritance among the tribes of Israel.";
web[22] = "And it shall come to pass, [that] ye shall divide it by lot for an inheritance to you, and to the strangers that sojourn among you, which shall beget children among you: and they shall be to you as born in the country among the children of Israel; they shall have inheritance with you among the tribes of Israel.";
hnv[22] = "It shall happen, that you shall divide it by lot for an inheritance to you and to the strangers who sojourn among you, who shall father children among you; and they shall be to you as the home-born among the children of Yisra\'el; they shall have inheritance with you among the tribes of Yisra\'el.";
vul[22] = "et mittetis eam in hereditatem vobis et advenis qui accesserint ad vos qui genuerint filios in medio vestrum et erunt vobis sicut indigenae inter filios Israhel vobiscum divident possessionem in medio tribuum Israhel";
kjv[23] = "And it shall come to pass, [that] in what tribe the stranger sojourneth, there shall ye give [him] his inheritance, saith the Lord GOD.";
rsv[23] = "In whatever tribe the alien resides, there you shall assign him his inheritance, says the Lord GOD.";
asv[23] = "And it shall come to pass, that in what tribe the stranger sojourneth, there shall ye give him his inheritance, saith the Lord Jehovah.";
yng[23] = "And it hath come to pass, in the tribe with which the sojourner sojourneth, there ye give his inheritance -- an affirmation of the Lord Jehovah.";
dby[23] = "And it shall come to pass that in the tribe in which the stranger sojourneth, there shall ye give [him] his inheritance, saith the Lord Jehovah.";
web[23] = "And it shall come to pass, [that] in what tribe the stranger sojourneth, there shall ye give [him] his inheritance, saith the Lord GOD.";
hnv[23] = "It shall happen, that in what tribe the stranger sojourns, there shall you give him his inheritance, says the Lord GOD.";
vul[23] = "in tribu autem quacumque fuerit advena ibi dabitis possessionem illi ait Dominus Deus";
