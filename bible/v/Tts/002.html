csb[1] = "But you are to proclaim things consistent with sound teaching.";
csb[2] = "Older men are to be self-controlled, worthy of respect, sensible, and sound in faith, love, and endurance.";
csb[3] = "In the same way, older women are to be reverent in behavior, not slanderers, not slaves to excessive drinking. They are to teach what is good,";
csb[4] = "so that they may encourage the young women to love their husbands and to love their children,";
csb[5] = "to be self-controlled, pure, workers at home, kind, and in submission to their husbands, so that God\'s word will not be slandered.";
csb[6] = "In the same way, encourage the young men to be self-controlled";
csb[7] = "in everything. Make yourself an example of good works with integrity and dignity in your teaching.";
csb[8] = "Your message is to be sound beyond reproach, so that any opponent will be ashamed, because he doesn\'t have anything bad to say about us.";

csb[10] = "or stealing, but demonstrating utter faithfulness, so that they may adorn the teaching of God our Savior in everything.";

csb[12] = "instructing us to deny godlessness and worldly lusts and to live in a sensible, righteous, and godly way in the present age,";
csb[13] = "while we wait for the blessed hope, the appearing of the glory of our great God and Savior, Jesus Christ.";
csb[14] = "He gave himself for us to redeem us from all lawlessness and to cleanse for himself a people for his own possession, eager to do good works.";
csb[15] = "Proclaim these things; encourage and rebuke with all authority. Let no one disregard you.";
