csb[1] = "Remind them to submit to rulers and authorities, to obey, to be ready for every good work,";
csb[2] = "to slander no one, to avoid fighting, and to be kind, always showing gentleness to all people.";
csb[3] = "For we too were once foolish, disobedient, deceived, enslaved by various passions and pleasures, living in malice and envy, hateful, detesting one another.";
csb[4] = "But when the kindness of God our Savior and his love for mankind appeared,";
csb[5] = "he saved us --not by works of righteousness that we had done, but according to his mercy -- through the washing of regeneration and renewal by the Holy Spirit.";
csb[6] = "He poured out his Spirit on us abundantly through Jesus Christ our Savior";
csb[7] = "so that, having been justified by his grace, we may become heirs with the hope of eternal life.";
csb[8] = "This saying is trustworthy. I want you to insist on these things, so that those who have believed God might be careful to devote themselves to good works. These are good and profitable for everyone.";
csb[9] = "But avoid foolish debates, genealogies, quarrels, and disputes about the law, because they are unprofitable and worthless.";
csb[10] = "Reject a divisive person after a first and second warning.";
csb[11] = "For you know that such a person has gone astray and is sinning; he is self-condemned.";
csb[12] = "When I send Artemas or Tychicus to you, make every effort to come to me in Nicopolis, because I have decided to spend the winter there.";
csb[13] = "Diligently help Zenas the lawyer and Apollos on their journey, so that they will lack nothing.";
csb[14] = "Let our people learn to devote themselves to good works for pressing needs, so that they will not be unfruitful.";
csb[15] = "All those who are with me send you greetings. Greet those who love us in the faith. Grace be with all of you.";
kjv[1] = "Put them in mind to be subject to principalities and powers, to obey magistrates, to be ready to every good work,";

hnv[2] = "to speak evil of no one, not to be contentious, to be gentle, showing all humility toward all men.";
vul[2] = "neminem blasphemare non litigiosos esse modestos omnem ostendentes mansuetudinem ad omnes homines";

kjv[8] = "[This is] a faithful saying, and these things I will that thou affirm constantly, that they which have believed in God might be careful to maintain good works. These things are good and profitable unto men.";
rsv[8] = "The saying is sure. I desire you to insist on these things, so that those who have believed in God may be careful to apply themselves to good deeds; these are excellent and profitable to men.";

dby[8] = "The word [is] faithful, and I desire that thou insist strenuously on these things, that they who have believed God may take care to pay diligent attention to good works. These things are good and profitable to men.";
