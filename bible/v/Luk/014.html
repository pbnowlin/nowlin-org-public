csb[1] = "One Sabbath, when he went in to eat at the house of one of the leading Pharisees, they were watching him closely.";
csb[2] = "There in front of him was a man whose body was swollen with fluid.";
csb[3] = "In response, Jesus asked the law experts and the Pharisees, &quot;Is it lawful to heal on the Sabbath or not? &quot;";
csb[4] = "But they kept silent. He took the man, healed him, and sent him away.";
csb[5] = "And to them, he said, &quot;Which of you whose son or ox falls into a well, will not immediately pull him out on the Sabbath day? &quot;";
csb[6] = "They could find no answer to these things.";
csb[7] = "He told a parable to those who were invited, when he noticed how they would choose the best places for themselves:";
csb[8] = "&quot;When you are invited by someone to a wedding banquet, don\'t recline at the best place, because a more distinguished person than you may have been invited by your host.";
csb[9] = "&quot;The one who invited both of you may come and say to you, \'Give your place to this man,\' and then in humiliation, you will proceed to take the lowest place.";
csb[10] = "&quot;But when you are invited, go and recline in the lowest place, so that when the one who invited you comes, he will say to you, \'Friend, move up higher.\' You will then be honored in the presence of all the other guests.";
csb[11] = "&quot;For everyone who exalts himself will be humbled, and the one who humbles himself will be exalted.&quot;";
csb[12] = "He also said to the one who had invited him, &quot;When you give a lunch or a dinner, don\'t invite your friends, your brothers or sisters, your relatives, or your rich neighbors, because they might invite you back, and you would be repaid.";
csb[13] = "&quot;On the contrary, when you host a banquet, invite those who are poor, maimed, lame, or blind.";
csb[14] = "&quot;And you will be blessed, because they cannot repay you; for you will be repaid at the resurrection of the righteous.&quot;";
csb[15] = "When one of those who reclined at the table with him heard these things, he said to him, &quot;Blessed is the one who will eat bread in the kingdom of God! &quot;";
csb[16] = "Then he told him: &quot;A man was giving a large banquet and invited many.";
csb[17] = "&quot;At the time of the banquet, he sent his servant to tell those who were invited, \'Come, because everything is now ready.\'";
csb[18] = "&quot;But without exception they all began to make excuses. The first one said to him, \'I have bought a field, and I must go out and see it. I ask you to excuse me.\'";
csb[19] = "&quot;Another said, \'I have bought five yoke of oxen, and I\'m going to try them out. I ask you to excuse me.\'";
csb[20] = "&quot;And another said, \'I just got married, and therefore I\'m unable to come.\'";
csb[21] = "&quot;So the servant came back and reported these things to his master. Then in anger, the master of the house told his servant, \'Go out quickly into the streets and alleys of the city, and bring in here the poor, maimed, blind, and lame.\'";
csb[22] = "&quot; \'Master,\' the servant said, \'what you ordered has been done, and there\'s still room.\'";
csb[23] = "&quot;Then the master told the servant, \'Go out into the highways and hedges and make them come in, so that my house may be filled.";
csb[24] = "&quot;For I tell you, not one of those people who were invited will enjoy my banquet.\' &quot;";
csb[25] = "Now great crowds were traveling with him. So he turned and said to them:";
csb[26] = "&quot;If anyone comes to me and does not hate his own father and mother, wife and children, brothers and sisters -- yes, and even his own life -- he cannot be my disciple.";
csb[27] = "&quot;Whoever does not bear his own cross and come after me cannot be my disciple.";
csb[28] = "&quot;For which of you, wanting to build a tower, doesn\'t first sit down and calculate the cost to see if he has enough to complete it?";
csb[29] = "&quot;Otherwise, after he has laid the foundation and cannot finish it, all the onlookers will begin to ridicule him,";
csb[30] = "&quot;saying, \'This man started to build and wasn\'t able to finish.\'";
csb[31] = "&quot;Or what king, going to war against another king, will not first sit down and decide if he is able with ten thousand to oppose the one who comes against him with twenty thousand?";
csb[32] = "&quot;If not, while the other is still far off, he sends a delegation and asks for terms of peace.";
csb[33] = "&quot;In the same way, therefore, every one of you who does not renounce all his possessions cannot be my disciple.";
csb[34] = "&quot;Now, salt is good, but if salt should lose its taste, how will it be made salty?";
csb[35] = "&quot;It isn\'t fit for the soil or for the manure pile; they throw it out. Let anyone who has ears to hear listen.&quot;";

kjv[21] = "So that servant came, and shewed his lord these things. Then the master of the house being angry said to his servant, Go out quickly into the streets and lanes of the city, and bring in hither the poor, and the maimed, and the halt, and the blind.";
rsv[21] = "So the servant came and reported this to his master. Then the householder in anger said to his servant, \'Go out quickly to the streets and lanes of the city, and bring in the poor and maimed and blind and lame.\'";
asv[21] = "And the servant came, and told his lord these things. Then the master of the house being angry said to his servant, Go out quickly into the streets and lanes of the city, and bring in hither the poor and maimed and blind and lame.";
yng[21] = "`And that servant having come, told to his lord these things, then the master of the house, having been angry, said to his servant, Go forth quickly to the broad places and lanes of the city, and the poor, and maimed, and lame, and blind, bring in hither.";
dby[21] = "And the bondman came up and brought back word of these things to his lord. Then the master of the house, in anger, said to his bondman, Go out quickly into the streets and lanes of the city, and bring here the poor and crippled and lame and blind.";
web[21] = "So that servant came, and showed his lord these things. Then the master of the house being angry, said to his servant, Go out quickly into the streets and lanes of the city, and bring in hither the poor, and the maimed, and the halt, and the blind.";
hnv[21] = "&quot;That servant came, and told his lord these things. Then the master of the house, being angry, said to his servant, \'Go out quickly into the streets and lanes of the city, and bring in the poor, maimed, blind, and lame.\'";
vul[21] = "et reversus servus nuntiavit haec domino suo tunc iratus pater familias dixit servo suo exi cito in plateas et vicos civitatis et pauperes ac debiles et caecos et claudos introduc huc";
kjv[22] = "And the servant said, Lord, it is done as thou hast commanded, and yet there is room.";
rsv[22] = "And the servant said, \'Sir, what you commanded has been done, and still there is room.\'";
asv[22] = "And the servant said, Lord, what thou didst command is done, and yet there is room.";
yng[22] = "`And the servant said, Sir, it hath been done as thou didst command, and still there is room.";
dby[22] = "And the bondman said, Sir, it is done as thou hast commanded, and there is still room.";
web[22] = "And the servant said, Lord, it is done as thou hast commanded, and yet there is room.";
hnv[22] = "&quot;The servant said, \'Lord, it is done as you commanded, and there is still room.\'";
vul[22] = "et ait servus domine factum est ut imperasti et adhuc locus est";
kjv[23] = "And the lord said unto the servant, Go out into the highways and hedges, and compel [them] to come in, that my house may be filled.";
rsv[23] = "And the master said to the servant, \'Go out to the highways and hedges, and compel people to come in, that my house may be filled.";
asv[23] = "And the lord said unto the servant, Go out into the highways and hedges, and constrain [them] to come in, that my house may be filled.";
yng[23] = "`And the lord said unto the servant, Go forth to the ways and hedges, and constrain to come in, that my house may be filled;";
dby[23] = "And the lord said to the bondman, Go out into the ways and fences and compel to come in, that my house may be filled;";
web[23] = "And the lord said to the servant, Go out into the highways and hedges, and compel [them] to come in, that my house may be filled.";
hnv[23] = "&quot;The lord said to the servant, \'Go out into the highways and hedges, and compel them to come in, that my house may be filled.";
vul[23] = "et ait dominus servo exi in vias et sepes et conpelle intrare ut impleatur domus mea";
kjv[24] = "For I say unto you, That none of those men which were bidden shall taste of my supper.";
rsv[24] = "For I tell you, none of those men who were invited shall taste my banquet.\'&quot;";
asv[24] = "For I say unto you, that none of those men that were bidden shall taste of my supper.";
yng[24] = "for I say to you, that none of those men who have been called shall taste of my supper.\'";
dby[24] = "for I say to you, that not one of those men who were invited shall taste of my supper.";
web[24] = "For I say to you, that none of those men who were invited, shall taste my supper.";
hnv[24] = "For I tell you that none of those men who were invited will taste of my supper.\'&quot;";
vul[24] = "dico autem vobis quod nemo virorum illorum qui vocati sunt gustabit cenam meam";
kjv[25] = "And there went great multitudes with him: and he turned, and said unto them,";
rsv[25] = "Now great multitudes accompanied him; and he turned and said to them,";
asv[25] = "Now there went with him great multitudes: and he turned, and said unto them,";
yng[25] = "And there were going on with him great multitudes, and having turned, he said unto them,";
dby[25] = "And great crowds went with him; and, turning round, he said to them,";
web[25] = "And there went great multitudes with him: and he turned, and said to them,";
hnv[25] = "Now great multitudes were going with him. He turned and said to them,";
vul[25] = "ibant autem turbae multae cum eo et conversus dixit ad illos";
kjv[26] = "If any [man] come to me, and hate not his father, and mother, and wife, and children, and brethren, and sisters, yea, and his own life also, he cannot be my disciple.";
rsv[26] = "&quot;If any one comes to me and does not hate his own father and mother and wife and children and brothers and sisters, yes, and even his own life, he cannot be my disciple.";
asv[26] = "If any man cometh unto me, and hateth not his own father, and mother, and wife, and children, and brethren, and sisters, yea, and his own life also, he cannot be my disciple.";
yng[26] = "`If any one doth come unto me, and doth not hate his own father, and mother, and wife, and children, and brothers, and sisters, and yet even his own life, he is not able to be my disciple;";
dby[26] = "If any man come to me, and shall not hate his own father and mother, and wife, and children, and brothers, and sisters, yea, and his own life too, he cannot be my disciple;";
web[26] = "If any [man] cometh to me, and hateth not his father, and mother, and wife, and children, and brethren, and sisters, yes, and his own life also, he cannot be my disciple.";
hnv[26] = "&quot;If anyone comes to me, and doesn\'t hate his own father, mother, wife, children, brothers, and sisters, yes, and his own life also, he can\'t be my talmid.";
vul[26] = "si quis venit ad me et non odit patrem suum et matrem et uxorem et filios et fratres et sorores adhuc autem et animam suam non potest esse meus discipulus";
kjv[27] = "And whosoever doth not bear his cross, and come after me, cannot be my disciple.";
rsv[27] = "Whoever does not bear his own cross and come after me, cannot be my disciple.";
asv[27] = "Whosoever doth not bear his own cross, and come after me, cannot be my disciple.";
yng[27] = "and whoever doth not bear his cross, and come after me, is not able to be my disciple.";
dby[27] = "and whoever does not carry his cross and come after me cannot be my disciple.";
web[27] = "And whoever doth not bear his cross, and come after me, cannot be my disciple.";
hnv[27] = "Whoever doesn\'t bear his own cross, and come after me, can\'t be my talmid.";
vul[27] = "et qui non baiulat crucem suam et venit post me non potest esse meus discipulus";
kjv[28] = "For which of you, intending to build a tower, sitteth not down first, and counteth the cost, whether he have [sufficient] to finish [it]?";
rsv[28] = "For which of you, desiring to build a tower, does not first sit down and count the cost, whether he has enough to complete it?";
asv[28] = "For which of you, desiring to build a tower, doth not first sit down and count the cost, whether he have [wherewith] to complete it?";
yng[28] = "`For who of you, willing to build a tower, doth not first, having sat down, count the expense, whether he have the things for completing?";
dby[28] = "For which of you, desirous of building a tower, does not first sit down and count the cost, if he have what [is needed] to complete it;";
web[28] = "For which of you intending to build a tower, sitteth not down first, and counteth the cost, whether he hath [sufficient] to finish [it]?";
hnv[28] = "For which of you, desiring to build a tower, doesn\'t first sit down and count the cost, to see if he has enough to complete it?";
vul[28] = "quis enim ex vobis volens turrem aedificare non prius sedens conputat sumptus qui necessarii sunt si habet ad perficiendum";
kjv[29] = "Lest haply, after he hath laid the foundation, and is not able to finish [it], all that behold [it] begin to mock him,";
rsv[29] = "Otherwise, when he has laid a foundation, and is not able to finish, all who see it begin to mock him,";
asv[29] = "Lest haply, when he hath laid a foundation, and is not able to finish, all that behold begin to mock him,";
yng[29] = "lest that he having laid a foundation, and not being able to finish, all who are beholding may begin to mock him,";
dby[29] = "in order that, having laid the foundation of it, and not being able to finish it, all who see it do not begin to mock at him,";
web[29] = "Lest perhaps after he hath laid the foundation, and is not able to finish [it], all that behold [it] begin to mock him,";
hnv[29] = "Or perhaps, when he has laid a foundation, and is not able to finish, everyone who sees begins to mock him,";
vul[29] = "ne posteaquam posuerit fundamentum et non potuerit perficere omnes qui vident incipiant inludere ei";
kjv[30] = "Saying, This man began to build, and was not able to finish.";
rsv[30] = "saying, \'This man began to build, and was not able to finish.\'";
asv[30] = "saying, This man began to build, and was not able to finish.";
yng[30] = "saying -- This man began to build, and was not able to finish.";
dby[30] = "saying, This man began to build and was not able to finish?";
web[30] = "Saying, This man began to build, and was not able to finish.";
hnv[30] = "saying, \'This man began to build, and wasn\'t able to finish.\'";
vul[30] = "dicentes quia hic homo coepit aedificare et non potuit consummare";
kjv[31] = "Or what king, going to make war against another king, sitteth not down first, and consulteth whether he be able with ten thousand to meet him that cometh against him with twenty thousand?";
rsv[31] = "Or what king, going to encounter another king in war, will not sit down first and take counsel whether he is able with ten thousand to meet him who comes against him with twenty thousand?";
asv[31] = "Or what king, as he goeth to encounter another king in war, will not sit down first and take counsel whether he is able with ten thousand to meet him that cometh against him with twenty thousand?";
yng[31] = "`Or what king going on to engage with another king in war, doth not, having sat down, first consult if he be able with ten thousand to meet him who with twenty thousand is coming against him?";
dby[31] = "Or what king, going on his way to engage in war with another king, does not, sitting down first, take counsel whether he is able with ten thousand to meet him coming against him with twenty thousand?";
web[31] = "Or what king going to make war against another king, sitteth not down first, and consulteth whether he is able with ten thousand to meet him that cometh against him with twenty thousand?";
hnv[31] = "Or what king, as he goes to encounter another king in war, will not sit down first and consider whether he is able with ten thousand to meet him who comes against him with twenty thousand?";
vul[31] = "aut qui rex iturus committere bellum adversus alium regem non sedens prius cogitat si possit cum decem milibus occurrere ei qui cum viginti milibus venit ad se";
kjv[32] = "Or else, while the other is yet a great way off, he sendeth an ambassage, and desireth conditions of peace.";
rsv[32] = "And if not, while the other is yet a great way off, he sends an embassy and asks terms of peace.";
asv[32] = "Or else, while the other is yet a great way off, he sendeth an ambassage, and asketh conditions of peace.";
yng[32] = "and if not so -- he being yet a long way off -- having sent an embassy, he doth ask the things for peace.";
dby[32] = "and if not, while he is yet far off, having sent an embassy, he asks for terms of peace.";
web[32] = "Or else, while the other is yet a great way off, he sendeth an embassy, and desireth conditions of peace.";
hnv[32] = "Or else, while the other is yet a great way off, he sends an envoy, and asks for conditions of shalom.";
vul[32] = "alioquin adhuc illo longe agente legationem mittens rogat ea quae pacis sunt";
kjv[33] = "So likewise, whosoever he be of you that forsaketh not all that he hath, he cannot be my disciple.";
rsv[33] = "So therefore, whoever of you does not renounce all that he has cannot be my disciple.";
asv[33] = "So therefore whosoever he be of you that renounceth not all that he hath, he cannot be my disciple.";
yng[33] = "`So, then, every one of you who doth not take leave of all that he himself hath, is not able to be my disciple.";
dby[33] = "Thus then every one of you who forsakes not all that is his own cannot be my disciple.";
web[33] = "So likewise, whoever he is of you that forsaketh not all that he hath, he cannot be my disciple.";
hnv[33] = "So therefore whoever of you who doesn\'t renounce all that he has, he can\'t be my talmid.";
vul[33] = "sic ergo omnis ex vobis qui non renuntiat omnibus quae possidet non potest meus esse discipulus";
kjv[34] = "Salt [is] good: but if the salt have lost his savour, wherewith shall it be seasoned?";
rsv[34] = "&quot;Salt is good; but if salt has lost its taste, how shall its saltness be restored?";
asv[34] = "Salt therefore is good: but if even the salt have lost its savor, wherewith shall it be seasoned?";
yng[34] = "`The salt [is] good, but if the salt doth become tasteless, with what shall it be seasoned?";
dby[34] = "Salt [then] [is] good, but if the salt also has become savourless, wherewith shall it be seasoned?";
web[34] = "Salt [is] good: but if the salt hath lost its savor, with what shall it be seasoned?";
hnv[34] = "Salt is good, but if the salt becomes flat and tasteless, with what do you season it?";
vul[34] = "bonum est sal si autem sal quoque evanuerit in quo condietur";
kjv[35] = "It is neither fit for the land, nor yet for the dunghill; [but] men cast it out. He that hath ears to hear, let him hear.";
rsv[35] = "It is fit neither for the land nor for the dunghill; men throw it away. He who has ears to hear, let him hear.&quot;";
asv[35] = "It is fit neither for the land nor for the dunghill: [men] cast it out. He that hath ears to hear, let him hear.";
yng[35] = "neither for land nor for manure is it fit -- they cast it without. He who is having ears to hear -- let him hear.\'";
dby[35] = "It is proper neither for land nor for dung; it is cast out. He that hath ears to hear, let him hear.";
web[35] = "It is neither fit for the land, nor yet for the dunghill, [but] men cast it out. He that hath ears to hear, let him hear.";
hnv[35] = "It is fit neither for the soil nor for the manure pile. It is thrown out. He who has ears to hear, let him hear.&quot;";
vul[35] = "neque in terram neque in sterquilinium utile est sed foras mittetur qui habet aures audiendi audiat";
