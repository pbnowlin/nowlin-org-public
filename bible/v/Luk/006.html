csb[1] = "On a Sabbath, he passed through the grainfields. His disciples were picking heads of grain, rubbing them in their hands, and eating them.";
csb[2] = "But some of the Pharisees said, &quot;Why are you doing what is not lawful on the Sabbath? &quot;";
csb[3] = "Jesus answered them, &quot;Haven\'t you read what David and those who were with him did when he was hungry --";
csb[4] = "&quot;how he entered the house of God and took and ate the bread of the Presence, which is not lawful for any but the priests to eat? He even gave some to those who were with him.&quot;";
csb[5] = "Then he told them, &quot;The Son of Man is Lord of the Sabbath.&quot;";
csb[6] = "On another Sabbath he entered the synagogue and was teaching. A man was there whose right hand was shriveled.";
csb[7] = "The scribes and Pharisees were watching him closely, to see if he would heal on the Sabbath, so that they could find a charge against him.";
csb[8] = "But he knew their thoughts and told the man with the shriveled hand, &quot;Get up and stand here.&quot; So he got up and stood there.";
csb[9] = "Then Jesus said to them, &quot;I ask you: Is it lawful to do good on the Sabbath or to do evil, to save life or to destroy it? &quot;";
csb[10] = "After looking around at them all, he told him, &quot;Stretch out your hand.&quot; He did, and his hand was restored.";
csb[11] = "They, however, were filled with rage and started discussing with one another what they might do to Jesus.";
csb[12] = "During those days he went out to the mountain to pray and spent all night in prayer to God.";
csb[13] = "When daylight came, he summoned his disciples, and he chose twelve of them, whom he also named apostles:";
csb[14] = "Simon, whom he also named Peter, and Andrew his brother; James and John; Philip and Bartholomew;";
csb[15] = "Matthew and Thomas; James the son of Alphaeus, and Simon called the Zealot;";
csb[16] = "Judas the son of James, and Judas Iscariot, who became a traitor.";
csb[17] = "After coming down with them, he stood on a level place with a large crowd of his disciples and a great number of people from all Judea and Jerusalem and from the seacoast of Tyre and Sidon.";
csb[18] = "They came to hear him and to be healed of their diseases; and those tormented by unclean spirits were made well.";
csb[19] = "The whole crowd was trying to touch him, because power was coming out from him and healing them all.";
csb[20] = "Then looking up at his disciples, he said: Blessed are you who are poor, because the kingdom of God is yours.";
csb[21] = "Blessed are you who are now hungry, because you will be filled. Blessed are you who weep now, because you will laugh.";
csb[22] = "Blessed are you when people hate you, when they exclude you, insult you, and slander your name as evil because of the Son of Man.";
csb[23] = "&quot;Rejoice in that day and leap for joy. Take note -- your reward is great in heaven, for this is the way their ancestors used to treat the prophets.";
csb[24] = "&quot;But woe to you who are rich, for you have received your comfort.";
csb[25] = "&quot;Woe to you who are now full, for you will be hungry. Woe to you who are now laughing, for you will mourn and weep.";
csb[26] = "&quot;Woe to you when all people speak well of you, for this is the way their ancestors used to treat the false prophets.";
csb[27] = "&quot;But I say to you who listen: Love your enemies, do what is good to those who hate you,";
csb[28] = "&quot;bless those who curse you, pray for those who mistreat you.";
csb[29] = "&quot;If anyone hits you on the cheek, offer the other also. And if anyone takes away your coat, don\'t hold back your shirt either.";
csb[30] = "&quot;Give to everyone who asks you, and from someone who takes your things, don\'t ask for them back.";
csb[31] = "&quot;Just as you want others to do for you, do the same for them.";
csb[32] = "&quot;If you love those who love you, what credit is that to you? Even sinners love those who love them.";
csb[33] = "&quot;If you do what is good to those who are good to you, what credit is that to you? Even sinners do that.";
csb[34] = "&quot;And if you lend to those from whom you expect to receive, what credit is that to you? Even sinners lend to sinners to be repaid in full.";
csb[35] = "&quot;But love your enemies, do what is good, and lend, expecting nothing in return. Then your reward will be great, and you will be children of the Most High. For he is gracious to the ungrateful and evil.";
csb[36] = "&quot;Be merciful, just as your Father also is merciful.";
csb[37] = "&quot;Do not judge, and you will not be judged. Do not condemn, and you will not be condemned. Forgive, and you will be forgiven.";
csb[38] = "&quot;Give, and it will be given to you; a good measure -- pressed down, shaken together, and running over -- will be poured into your lap. For with the measure you use, it will be measured back to you.&quot;";
csb[39] = "He also told them a parable: &quot;Can the blind guide the blind? Won\'t they both fall into a pit?";
csb[40] = "&quot;A disciple is not above his teacher, but everyone who is fully trained will be like his teacher.";
csb[41] = "&quot;Why do you look at the splinter in your brother\'s eye, but don\'t notice the beam of wood in your own eye?";
csb[42] = "&quot;Or how can you say to your brother, \'Brother, let me take out the splinter that is in your eye,\' when you yourself don\'t see the beam of wood in your eye? Hypocrite! First take the beam of wood out of your eye, and then you will see clearly to take out the splinter in your brother\'s eye.";
csb[43] = "&quot;A good tree doesn\'t produce bad fruit; on the other hand, a bad tree doesn\'t produce good fruit.";
csb[44] = "&quot;For each tree is known by its own fruit. Figs aren\'t gathered from thornbushes, or grapes picked from a bramble bush.";
csb[45] = "&quot;A good person produces good out of the good stored up in his heart. An evil person produces evil out of the evil stored up in his heart, for his mouth speaks from the overflow of the heart.";
csb[46] = "&quot;Why do you call me \'Lord, Lord,\' and don\'t do the things I say?";
csb[47] = "&quot;I will show you what someone is like who comes to me, hears my words, and acts on them:";
csb[48] = "&quot;He is like a man building a house, who dug deep and laid the foundation on the rock. When the flood came, the river crashed against that house and couldn\'t shake it, because it was well built.";
csb[49] = "&quot;But the one who hears and does not act is like a man who built a house on the ground without a foundation. The river crashed against it, and immediately it collapsed. And the destruction of that house was great.&quot;";

hnv[21] = "Blessed are you who hunger now, For you will be filled. Blessed are you who weep now, For you will laugh.";

asv[24] = "But woe unto you that are rich! for ye have received your consolation.";

web[24] = "But woe to you that are rich! for ye have received your consolation.";
hnv[24] = "&quot;But woe to you who are rich! For you have received your consolation.";

kjv[35] = "But love ye your enemies, and do good, and lend, hoping for nothing again; and your reward shall be great, and ye shall be the children of the Highest: for he is kind unto the unthankful and [to] the evil.";

yng[35] = "`But love your enemies, and do good, and lend, hoping for nothing again, and your reward will be great, and ye shall be sons of the Highest, because He is kind unto the ungracious and evil;";
dby[35] = "But love your enemies, and do good, and lend, hoping for nothing in return, and your reward shall be great, and ye shall be sons of [the] Highest; for *he* is good to the unthankful and wicked.";
web[35] = "But love ye your enemies, and do good, and lend, hoping for nothing again; and your reward shall be great, and ye shall be the children of the Highest: for he is kind to the unthankful and [to] the evil.";
hnv[35] = "But love your enemies, and do good, and lend, expecting nothing back; and your reward will be great, and you will be sons of Ha`Elyon; for he is kind toward the unthankful and evil.";

asv[40] = "The disciple is not above his teacher: but every one when he is perfected shall be as his teacher.";

kjv[41] = "And why beholdest thou the mote that is in thy brother\'s eye, but perceivest not the beam that is in thine own eye?";
rsv[41] = "Why do you see the speck that is in your brother\'s eye, but do not notice the log that is in your own eye?";
asv[41] = "And why beholdest thou the mote that is in thy brother\'s eye, but considerest not the beam that is in thine own eye?";
yng[41] = "`And why dost thou behold the mote that is in thy brother\'s eye, and the beam that [is] in thine own eye dost not consider?";
dby[41] = "But why lookest thou on the mote which is in the eye of thy brother, but perceivest not the beam which is in thine own eye?";
web[41] = "And why beholdest thou the mote that is in thy brother\'s eye, but perceivest not the beam that is in thy own eye?";
hnv[41] = "Why do you see the speck of chaff that is in your brother\'s eye, but don\'t consider the beam that is in your own eye?";
vul[41] = "quid autem vides festucam in oculo fratris tui trabem autem quae in oculo tuo est non consideras";
kjv[42] = "Either how canst thou say to thy brother, Brother, let me pull out the mote that is in thine eye, when thou thyself beholdest not the beam that is in thine own eye? Thou hypocrite, cast out first the beam out of thine own eye, and then shalt thou see clearly to pull out the mote that is in thy brother\'s eye.";
rsv[42] = "Or how can you say to your brother, \'Brother, let me take out the speck that is in your eye,\' when you yourself do not see the log that is in your own eye? You hypocrite, first take the log out of your own eye, and then you will see clearly to take out the speck that is in your brother\'s eye.";
asv[42] = "Or how canst thou say to thy brother, Brother, let me cast out the mote that is in thine eye, when thou thyself beholdest not the beam that is in thine own eye? Thou hypocrite, cast out first the beam out of thine own eye, and then shalt thou see clearly to cast out the mote that is in thy brother\'s eye.";
yng[42] = "or how art thou able to say to thy brother, Brother, suffer, I may take out the mote that [is] in thine eye -- thyself the beam in thine own eye not beholding? Hypocrite, take first the beam out of thine own eye, and then thou shalt see clearly to take out the mote that [is] in thy brother\'s eye.";
dby[42] = "or how canst thou say to thy brother, Brother, allow [me], I will cast out the mote that is in thine eye, thyself not seeing the beam that is in thine eye? Hypocrite, cast out first the beam out of thine eye, and then thou shalt see clear to cast out the mote which is in the eye of thy brother.";
web[42] = "Either how canst thou say to thy brother, Brother, let me pull out the mote that is in thy eye, when thou thyself beholdest not the beam that is in thy own eye? Thou hypocrite, cast out first the beam out of thy own eye, and then shalt thou see clearly to pull out the mote that is in thy brother\'s eye.";
hnv[42] = "Or how can you tell your brother, \'Brother, let me remove the speck of chaff that is in your eye,\' when you yourself don\'t see the beam that is in your own eye? You hypocrite! First remove the beam from your own eye, and then you can see clearly to remove the speck of chaff that is in your brother\'s eye.";
vul[42] = "et quomodo potes dicere fratri tuo frater sine eiciam festucam de oculo tuo ipse in oculo tuo trabem non videns hypocrita eice primum trabem de oculo tuo et tunc perspicies ut educas festucam de oculo fratris tui";
kjv[43] = "For a good tree bringeth not forth corrupt fruit; neither doth a corrupt tree bring forth good fruit.";
rsv[43] = "&quot;For no good tree bears bad fruit, nor again does a bad tree bear good fruit;";
asv[43] = "For there is no good tree that bringeth forth corrupt fruit; nor again a corrupt tree that bringeth forth good fruit.";
yng[43] = "`For there is not a good tree making bad fruit, nor a bad tree making good fruit;";
dby[43] = "For there is no good tree which produces corrupt fruit, nor a corrupt tree which produces good fruit;";
web[43] = "For a good tree bringeth not forth corrupt fruit; neither doth a corrupt tree bring forth good fruit.";
hnv[43] = "For there is no good tree that brings forth rotten fruit; nor again a rotten tree that brings forth good fruit.";
vul[43] = "non est enim arbor bona quae facit fructus malos neque arbor mala faciens fructum bonum";
kjv[44] = "For every tree is known by his own fruit. For of thorns men do not gather figs, nor of a bramble bush gather they grapes.";
rsv[44] = "for each tree is known by its own fruit. For figs are not gathered from thorns, nor are grapes picked from a bramble bush.";
asv[44] = "For each tree is known by its own fruit. For of thorns men do not gather figs, nor of a bramble bush gather they grapes.";
yng[44] = "for each tree from its own fruit is known, for not from thorns do they gather figs, nor from a bramble do they crop a grape.";

kjv[48] = "He is like a man which built an house, and digged deep, and laid the foundation on a rock: and when the flood arose, the stream beat vehemently upon that house, and could not shake it: for it was founded upon a rock.";
rsv[48] = "he is like a man building a house, who dug deep, and laid the foundation upon rock; and when a flood arose, the stream broke against that house, and could not shake it, because it had been well built.";
asv[48] = "he is like a man building a house, who digged and went deep, and laid a foundation upon the rock: and when a flood arose, the stream brake against that house, and could not shake it: because it had been well builded.";
yng[48] = "he is like to a man building a house, who did dig, and deepen, and laid a foundation upon the rock, and a flood having come, the stream broke forth on that house, and was not able to shake it, for it had been founded upon the rock.";
dby[48] = "He is like a man building a house, who dug and went deep, and laid a foundation on the rock; but a great rain coming, the stream broke upon that house, and could not shake it, for it had been founded on the rock.";
web[48] = "He is like a man who built a house, and digged deep, and laid the foundation on a rock: and when the flood arose, the stream beat vehemently upon that house, and could not shake it: for it was founded upon a rock.";
hnv[48] = "He is like a man building a house, who dug and went deep, and laid a foundation on the rock. When a flood arose, the stream broke against that house, and could not shake it, because it was founded on the rock.";
vul[48] = "similis est homini aedificanti domum qui fodit in altum et posuit fundamenta supra petram inundatione autem facta inlisum est flumen domui illi et non potuit eam movere fundata enim erat supra petram";
kjv[49] = "But he that heareth, and doeth not, is like a man that without a foundation built an house upon the earth; against which the stream did beat vehemently, and immediately it fell; and the ruin of that house was great.";
rsv[49] = "But he who hears and does not do them is like a man who built a house on the ground without a foundation; against which the stream broke, and immediately it fell, and the ruin of that house was great.&quot;";
asv[49] = "But he that heareth, and doeth not, is like a man that built a house upon the earth without a foundation; against which the stream brake, and straightway it fell in; and the ruin of that house was great.";
yng[49] = "`And he who heard and did not, is like to a man having builded a house upon the earth, without a foundation, against which the stream brake forth, and immediately it fell, and the ruin of that house became great.\'";
dby[49] = "And he that has heard and not done, is like a man who has built a house on the ground without [a] foundation, on which the stream broke, and immediately it fell, and the breach of that house was great.";
web[49] = "But he that heareth, and doeth not, is like a man that, without a foundation, built a house on the earth, against which the stream beat vehemently, and immediately it fell, and the ruin of that house was great.";
hnv[49] = "But he who hears, and doesn\'t do, is like a man who built a house on the eretz without a foundation, against which the stream broke, and immediately it fell, and the ruin of that house was great.&quot;";
vul[49] = "qui autem audivit et non fecit similis est homini aedificanti domum suam supra terram sine fundamento in quam inlisus est fluvius et continuo concidit et facta est ruina domus illius magna";
