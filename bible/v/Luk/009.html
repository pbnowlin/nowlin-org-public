csb[1] = "Summoning the Twelve, he gave them power and authority over all the demons and to heal diseases.";
csb[2] = "Then he sent them to proclaim the kingdom of God and to heal the sick.";
csb[3] = "&quot;Take nothing for the road,&quot; he told them, &quot;no staff, no traveling bag, no bread, no money; and don\'t take an extra shirt.";
csb[4] = "&quot;Whatever house you enter, stay there and leave from there.";
csb[5] = "&quot;If they do not welcome you, when you leave that town, shake off the dust from your feet as a testimony against them.&quot;";
csb[6] = "So they went out and traveled from village to village, proclaiming the good news and healing everywhere.";
csb[7] = "Herod the tetrarch heard about everything that was going on. He was perplexed, because some said that John had been raised from the dead,";
csb[8] = "some that Elijah had appeared, and others that one of the ancient prophets had risen.";
csb[9] = "&quot;I beheaded John,&quot; Herod said, &quot;but who is this I hear such things about? &quot; And he wanted to see him.";
csb[10] = "When the apostles returned, they reported to Jesus all that they had done. He took them along and withdrew privately to a town called Bethsaida.";
csb[11] = "When the crowds found out, they followed him. He welcomed them, spoke to them about the kingdom of God, and healed those who needed healing.";
csb[12] = "Late in the day, the Twelve approached and said to him, &quot;Send the crowd away, so that they can go into the surrounding villages and countryside to find food and lodging, because we are in a deserted place here.&quot;";
csb[13] = "&quot;You give them something to eat,&quot; he told them. &quot;We have no more than five loaves and two fish,&quot; they said, &quot;unless we go and buy food for all these people.&quot;";
csb[14] = "(For about five thousand men were there.) Then he told his disciples, &quot;Have them sit down in groups of about fifty each.&quot;";
csb[15] = "They did what he said, and had them all sit down.";
csb[16] = "Then he took the five loaves and the two fish, and looking up to heaven, he blessed and broke them. He kept giving them to the disciples to set before the crowd.";
csb[17] = "Everyone ate and was filled. They picked up twelve baskets of leftover pieces.";
csb[18] = "While he was praying in private and his disciples were with him, he asked them, &quot;Who do the crowds say that I am? &quot;";
csb[19] = "They answered, &quot;John the Baptist; others, Elijah; still others, that one of the ancient prophets has come back.&quot;";
csb[20] = "&quot;But you,&quot; he asked them, &quot;who do you say that I am? &quot; Peter answered, &quot;God\'s Messiah.&quot;";
csb[21] = "But he strictly warned and instructed them to tell this to no one,";
csb[22] = "saying, &quot;It is necessary that the Son of Man suffer many things and be rejected by the elders, chief priests, and scribes, be killed, and be raised the third day.&quot;";
csb[23] = "Then he said to them all, &quot;If anyone wants to follow after me, let him deny himself, take up his cross daily, and follow me.";
csb[24] = "&quot;For whoever wants to save his life will lose it, but whoever loses his life because of me will save it.";
csb[25] = "&quot;For what does it benefit someone if he gains the whole world, and yet loses or forfeits himself?";
csb[26] = "&quot;For whoever is ashamed of me and my words, the Son of Man will be ashamed of him when he comes in his glory and that of the Father and the holy angels.";
csb[27] = "&quot;Truly I tell you, there are some standing here who will not taste death until they see the kingdom of God.&quot;";
csb[28] = "About eight days after this conversation, he took along Peter, John, and James and went up on the mountain to pray.";
csb[29] = "As he was praying, the appearance of his face changed, and his clothes became dazzling white.";
csb[30] = "Suddenly, two men were talking with him -- Moses and Elijah.";
csb[31] = "They appeared in glory and were speaking of his departure, which he was about to accomplish in Jerusalem.";
csb[32] = "Peter and those with him were in a deep sleep, and when they became fully awake, they saw his glory and the two men who were standing with him.";
csb[33] = "As the two men were departing from him, Peter said to Jesus, &quot;Master, it\'s good for us to be here. Let us set up three shelters: one for you, one for Moses, and one for Elijah&quot; -- not knowing what he was saying.";
csb[34] = "While he was saying this, a cloud appeared and overshadowed them. They became afraid as they entered the cloud.";
csb[35] = "Then a voice came from the cloud, saying: &quot;This is my Son, the Chosen One; listen to him! &quot;";
csb[36] = "After the voice had spoken, Jesus was found alone. They kept silent, and at that time told no one what they had seen.";
csb[37] = "The next day, when they came down from the mountain, a large crowd met him.";
csb[38] = "Just then a man from the crowd cried out, &quot;Teacher, I beg you to look at my son, because he\'s my only child.";
csb[39] = "&quot;A spirit seizes him; suddenly he shrieks, and it throws him into convulsions until he foams at the mouth; severely bruising him, it scarcely ever leaves him.";
csb[40] = "&quot;I begged your disciples to drive it out, but they couldn\'t.&quot;";
csb[41] = "Jesus replied, &quot;You unbelieving and perverse generation, how long will I be with you and put up with you? Bring your son here.&quot;";
csb[42] = "As the boy was still approaching, the demon knocked him down and threw him into severe convulsions. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.";
csb[43] = "And they were all astonished at the greatness of God. While everyone was amazed at all the things he was doing, he told his disciples,";
csb[44] = "&quot;Let these words sink in: The Son of Man is about to be betrayed into the hands of men.&quot;";
csb[45] = "But they did not understand this statement; it was concealed from them so that they could not grasp it, and they were afraid to ask him about it.";
csb[46] = "An argument started among them about who was the greatest of them.";
csb[47] = "But Jesus, knowing their inner thoughts, took a little child and had him stand next to him.";
csb[48] = "He told them, &quot;Whoever welcomes this little child in my name welcomes me. And whoever welcomes me welcomes him who sent me. For whoever is least among you -- this one is great.&quot;";
csb[49] = "John responded, &quot;Master, we saw someone driving out demons in your name, and we tried to stop him because he does not follow us.&quot;";
csb[50] = "&quot;Don\'t stop him,&quot; Jesus told him, &quot;because whoever is not against you is for you.&quot;";
csb[51] = "When the days were coming to a close for him to be taken up, he determined to journey to Jerusalem.";
csb[52] = "He sent messengers ahead of himself, and on the way they entered a village of the Samaritans to make preparations for him.";
csb[53] = "But they did not welcome him, because he determined to journey to Jerusalem.";
csb[54] = "When the disciples James and John saw this, they said, &quot;Lord, do you want us to call down fire from heaven to consume them? &quot;";
csb[55] = "But he turned and rebuked them,";
csb[56] = "and they went to another village.";
csb[57] = "As they were traveling on the road someone said to him, &quot;I will follow you wherever you go.&quot;";
csb[58] = "Jesus told him, &quot;Foxes have dens, and birds of the sky have nests, but the Son of Man has no place to lay his head.&quot;";
csb[59] = "Then he said to another, &quot;Follow me.&quot; &quot;Lord,&quot; he said, &quot;first let me go bury my father.&quot;";
csb[60] = "But he told him, &quot;Let the dead bury their own dead, but you go and spread the news of the kingdom of God.&quot;";
csb[61] = "Another said, &quot;I will follow you, Lord, but first let me go and say good-bye to those at my house.&quot;";
csb[62] = "But Jesus said to him, &quot;No one who puts his hand to the plow and looks back is fit for the kingdom of God.&quot;";
