csb[1] = "After this, the Lord appointed seventy-two others, and he sent them ahead of him in pairs to every town and place where he himself was about to go.";
csb[2] = "He told them, &quot;The harvest is abundant, but the workers are few. Therefore, pray to the Lord of the harvest to send out workers into his harvest.";
csb[3] = "&quot;Now go; I\'m sending you out like lambs among wolves.";
csb[4] = "&quot;Don\'t carry a money-bag, traveling bag, or sandals; don\'t greet anyone along the road.";
csb[5] = "&quot;Whatever house you enter, first say, \'Peace to this household.\'";
csb[6] = "&quot;If a person of peace is there, your peace will rest on him; but if not, it will return to you.";
csb[7] = "&quot;Remain in the same house, eating and drinking what they offer, for the worker is worthy of his wages. Don\'t move from house to house.";
csb[8] = "&quot;When you enter any town, and they welcome you, eat the things set before you.";
csb[9] = "&quot;Heal the sick who are there, and tell them, \'The kingdom of God has come near you.\'";
csb[10] = "&quot;When you enter any town, and they don\'t welcome you, go out into its streets and say,";
csb[11] = "&quot;\'We are wiping off even the dust of your town that clings to our feet as a witness against you. Know this for certain: The kingdom of God has come near.\'";
csb[12] = "&quot;I tell you, on that day it will be more tolerable for Sodom than for that town.";
csb[13] = "&quot;Woe to you, Chorazin! Woe to you, Bethsaida! For if the miracles that were done in you had been done in Tyre and Sidon, they would have repented long ago, sitting in sackcloth and ashes.";
csb[14] = "&quot;But it will be more tolerable for Tyre and Sidon at the judgment than for you.";
csb[15] = "&quot;And you, Capernaum, will you be exalted to heaven? No, you will go down to Hades.";
csb[16] = "&quot;Whoever listens to you listens to me. Whoever rejects you rejects me. And whoever rejects me rejects the one who sent me.&quot;";
csb[17] = "The seventy-two returned with joy, saying, &quot;Lord, even the demons submit to us in your name.&quot;";
csb[18] = "He said to them, &quot;I watched Satan fall from heaven like lightning.";
csb[19] = "&quot;Look, I have given you the authority to trample on snakes and scorpions and over all the power of the enemy; nothing at all will harm you.";
csb[20] = "&quot;However, don\'t rejoice that the spirits submit to you, but rejoice that your names are written in heaven.&quot;";
csb[21] = "At that time he rejoiced in the Holy Spirit and said, &quot;I praise you, Father, Lord of heaven and earth, because you have hidden these things from the wise and intelligent and revealed them to infants. Yes, Father, because this was your good pleasure.";
csb[22] = "&quot;All things have been entrusted to me by my Father. No one knows who the Son is except the Father, and who the Father is except the Son, and anyone to whom the Son desires to reveal him.&quot;";
csb[23] = "Then turning to his disciples he said privately, &quot;Blessed are the eyes that see the things you see!";
csb[24] = "&quot;For I tell you that many prophets and kings wanted to see the things you see but didn\'t see them; to hear the things you hear but didn\'t hear them.&quot;";
csb[25] = "Then an expert in the law stood up to test him, saying, &quot;Teacher, what must I do to inherit eternal life? &quot;";
csb[26] = "&quot;What is written in the law? &quot; he asked him. &quot;How do you read it? &quot;";
csb[27] = "He answered, &quot;Love the Lord your God with all your heart, with all your soul, with all your strength, and with all your mind;&quot; and &quot;your neighbor as yourself.&quot;";
csb[28] = "&quot;You\'ve answered correctly,&quot; he told him. &quot;Do this and you will live.&quot;";
csb[29] = "But wanting to justify himself, he asked Jesus, &quot;And who is my neighbor? &quot;";
csb[30] = "Jesus took up the question and said: &quot;A man was going down from Jerusalem to Jericho and fell into the hands of robbers. They stripped him, beat him up, and fled, leaving him half dead.";
csb[31] = "&quot;A priest happened to be going down that road. When he saw him, he passed by on the other side.";
csb[32] = "&quot;In the same way, a Levite, when he arrived at the place and saw him, passed by on the other side.";
csb[33] = "&quot;But a Samaritan on his journey came up to him, and when he saw the man, he had compassion.";
csb[34] = "&quot;He went over to him and bandaged his wounds, pouring on olive oil and wine. Then he put him on his own animal, brought him to an inn, and took care of him.";
csb[35] = "&quot;The next day he took out two denarii, gave them to the innkeeper, and said, \'Take care of him. When I come back I\'ll reimburse you for whatever extra you spend.\'";
csb[36] = "&quot;Which of these three do you think proved to be a neighbor to the man who fell into the hands of the robbers? &quot;";
csb[37] = "&quot;The one who showed mercy to him,&quot; he said. Then Jesus told him, &quot;Go and do the same.&quot;";
csb[38] = "While they were traveling, he entered a village, and a woman named Martha welcomed him into her home.";
csb[39] = "She had a sister named Mary, who also sat at the Lord\'s feet and was listening to what he said.";
csb[40] = "But Martha was distracted by her many tasks, and she came up and asked, &quot;Lord, don\'t you care that my sister has left me to serve alone? So tell her to give me a hand.&quot;";
csb[41] = "The Lord answered her, &quot;Martha, Martha, you are worried and upset about many things,";
csb[42] = "&quot;but one thing is necessary. Mary has made the right choice, and it will not be taken away from her.&quot;";
