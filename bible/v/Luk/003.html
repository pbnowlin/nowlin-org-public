csb[1] = "In the fifteenth year of the reign of Tiberius Caesar, while Pontius Pilate was governor of Judea, Herod was tetrarch of Galilee, his brother Philip tetrarch of the region of Iturea and Trachonitis, and Lysanias tetrarch of Abilene,";
csb[2] = "during the high priesthood of Annas and Caiaphas, God\'s word came to John the son of Zechariah in the wilderness.";
csb[3] = "He went into all the vicinity of the Jordan, proclaiming a baptism of repentance for the forgiveness of sins,";
csb[4] = "as it is written in the book of the words of the prophet Isaiah: A voice of one crying out in the wilderness: Prepare the way for the Lord; make his paths straight!";
csb[5] = "Every valley will be filled, and every mountain and hill will be made low; the crooked will become straight, the rough ways smooth,";
csb[6] = "and everyone will see the salvation of God.";
csb[7] = "He then said to the crowds who came out to be baptized by him, &quot;Brood of vipers! Who warned you to flee from the coming wrath?";
csb[8] = "&quot;Therefore produce fruit consistent with repentance. And don\'t start saying to yourselves, \'We have Abraham as our father,\' for I tell you that God is able to raise up children for Abraham from these stones.";
csb[9] = "&quot;The ax is already at the root of the trees. Therefore, every tree that doesn\'t produce good fruit will be cut down and thrown into the fire.&quot;";
csb[10] = "&quot;What then should we do? &quot; the crowds were asking him.";
csb[11] = "He replied to them, &quot;The one who has two shirts must share with someone who has none, and the one who has food must do the same.&quot;";
csb[12] = "Tax collectors also came to be baptized, and they asked him, &quot;Teacher, what should we do? &quot;";
csb[13] = "He told them, &quot;Don\'t collect any more than what you have been authorized.&quot;";
csb[14] = "Some soldiers also questioned him, &quot;What should we do? &quot; He said to them, &quot;Don\'t take money from anyone by force or false accusation, and be satisfied with your wages.&quot;";
csb[15] = "Now the people were waiting expectantly, and all of them were questioning in their hearts whether John might be the Messiah.";
csb[16] = "John answered them all, &quot;I baptize you with water, but one who is more powerful than I am is coming. I am not worthy to untie the strap of his sandals. He will baptize you with the Holy Spirit and fire.";
csb[17] = "&quot;His winnowing shovel is in his hand to clear his threshing floor and gather the wheat into his barn, but the chaff he will burn with fire that never goes out.&quot;";
csb[18] = "Then, along with many other exhortations, he proclaimed good news to the people.";
csb[19] = "But when John rebuked Herod the tetrarch because of Herodias, his brother\'s wife, and all the evil things he had done,";
csb[20] = "Herod added this to everything else -- he locked up John in prison.";
csb[21] = "When all the people were baptized, Jesus also was baptized. As he was praying, heaven opened,";
csb[22] = "and the Holy Spirit descended on him in a physical appearance like a dove. And a voice came from heaven: &quot;You are my beloved Son; with you I am well-pleased.&quot;";
csb[23] = "As he began his ministry, Jesus was about thirty years old and was thought to be the son of Joseph, son of Heli,";
csb[24] = "son of Matthat, son of Levi, son of Melchi, son of Jannai, son of Joseph,";
csb[25] = "son of Mattathias, son of Amos, son of Nahum, son of Esli, son of Naggai,";
csb[26] = "son of Maath, son of Mattathias, son of Semein, son of Josech, son of Joda,";
csb[27] = "son of Joanan, son of Rhesa, son of Zerubbabel, son of Shealtiel, son of Neri,";
csb[28] = "son of Melchi, son of Addi, son of Cosam, son of Elmadam, son of Er,";
csb[29] = "son of Joshua, son of Eliezer, son of Jorim, son of Matthat, son of Levi,";
csb[30] = "son of Simeon, son of Judah, son of Joseph, son of Jonam, son of Eliakim,";
csb[31] = "son of Melea, son of Menna, son of Mattatha, son of Nathan, son of David,";
csb[32] = "son of Jesse, son of Obed, son of Boaz, son of Salmon, son of Nahshon,";
csb[33] = "son of Amminadab, son of Ram, son of Hezron, son of Perez, son of Judah,";
csb[34] = "son of Jacob, son of Isaac, son of Abraham, son of Terah, son of Nahor,";
csb[35] = "son of Serug, son of Reu, son of Peleg, son of Eber, son of Shelah,";
csb[36] = "son of Cainan, son of Arphaxad, son of Shem, son of Noah, son of Lamech,";
csb[37] = "son of Methuselah, son of Enoch, son of Jared, son of Mahalalel, son of Cainan,";
csb[38] = "son of Enos, son of Seth, son of Adam, son of God.";
