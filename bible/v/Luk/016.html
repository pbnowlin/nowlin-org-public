csb[1] = "Now he said to the disciples: &quot;There was a rich man who received an accusation that his manager was squandering his possessions.";
csb[2] = "&quot;So he called the manager in and asked, \'What is this I hear about you? Give an account of your management, because you can no longer be my manager.\'";
csb[3] = "&quot;Then the manager said to himself, \'What will I do since my master is taking the management away from me? I\'m not strong enough to dig; I\'m ashamed to beg.";
csb[4] = "&quot;I know what I\'ll do so that when I\'m removed from management, people will welcome me into their homes.\'";
csb[5] = "&quot;So he summoned each one of his master\'s debtors. \'How much do you owe my master? \' he asked the first one.";
csb[6] = "&quot; \'A hundred measures of olive oil,\' he said. &quot; \'Take your invoice,\' he told him, \'sit down quickly, and write fifty.\'";
csb[7] = "&quot;Next he asked another, \'How much do you owe? \' &quot; \'A hundred measures of wheat,\' he said. &quot; \'Take your invoice,\' he told him, \'and write eighty.\'";
csb[8] = "&quot;The master praised the unrighteous manager because he had acted shrewdly. For the children of this age are more shrewd than the children of light in dealing with their own people.";
csb[9] = "&quot;And I tell you, make friends for yourselves by means of worldly wealth so that when it fails, they may welcome you into eternal dwellings.";
csb[10] = "&quot;Whoever is faithful in very little is also faithful in much, and whoever is unrighteous in very little is also unrighteous in much.";
csb[11] = "&quot;So if you have not been faithful with worldly wealth, who will trust you with what is genuine?";
csb[12] = "&quot;And if you have not been faithful with what belongs to someone else, who will give you what is your own?";
csb[13] = "&quot;No servant can serve two masters, since either he will hate one and love the other, or he will be devoted to one and despise the other. You cannot serve both God and money.&quot;";
csb[14] = "The Pharisees, who were lovers of money, were listening to all these things and scoffing at him.";
csb[15] = "And he told them, &quot;You are the ones who justify yourselves in the sight of others, but God knows your hearts. For what is highly admired by people is revolting in God\'s sight.";
csb[16] = "&quot;The Law and the Prophets were until John; since then, the good news of the kingdom of God has been proclaimed, and everyone is urgently invited to enter it.";
csb[17] = "&quot;But it is easier for heaven and earth to pass away than for one stroke of a letter in the law to drop out.";
csb[18] = "&quot;Everyone who divorces his wife and marries another woman commits adultery, and everyone who marries a woman divorced from her husband commits adultery.";
csb[19] = "&quot;There was a rich man who would dress in purple and fine linen, feasting lavishly every day.";
csb[20] = "&quot;But a poor man named Lazarus, covered with sores, was lying at his gate.";
csb[21] = "&quot;He longed to be filled with what fell from the rich man\'s table, but instead the dogs would come and lick his sores.";
csb[22] = "&quot;One day the poor man died and was carried away by the angels to Abraham\'s side. The rich man also died and was buried.";
csb[23] = "&quot;And being in torment in Hades, he looked up and saw Abraham a long way off, with Lazarus at his side.";
csb[24] = "&quot;\'Father Abraham! \' he called out, \'Have mercy on me and send Lazarus to dip the tip of his finger in water and cool my tongue, because I am in agony in this flame! \'";
csb[25] = "&quot; \'Son,\' Abraham said, \'remember that during your life you received your good things, just as Lazarus received bad things, but now he is comforted here, while you are in agony.";
csb[26] = "&quot;Besides all this, a great chasm has been fixed between us and you, so that those who want to pass over from here to you cannot; neither can those from there cross over to us.\'";
csb[27] = "&quot; \'Father,\' he said, \'then I beg you to send him to my father\'s house --";
csb[28] = "&quot;because I have five brothers -- to warn them, so they won\'t also come to this place of torment.\'";
csb[29] = "&quot;But Abraham said, \'They have Moses and the prophets; they should listen to them.\'";
csb[30] = "&quot; \'No, father Abraham,\' he said. \'But if someone from the dead goes to them, they will repent.\'";
csb[31] = "&quot;But he told him, \'If they don\'t listen to Moses and the prophets, they will not be persuaded if someone rises from the dead.\' &quot;";

vul[20] = "et erat quidam mendicus nomine Lazarus qui iacebat ad ianuam eius ulceribus plenus";
kjv[21] = "And desiring to be fed with the crumbs which fell from the rich man\'s table: moreover the dogs came and licked his sores.";
rsv[21] = "who desired to be fed with what fell from the rich man\'s table; moreover the dogs came and licked his sores.";
asv[21] = "and desiring to be fed with the [crumbs] that fell from the rich man\'s table; yea, even the dogs came and licked his sores.";
yng[21] = "and desiring to be filled from the crumbs that are falling from the table of the rich man; yea, also the dogs, coming, were licking his sores.";
dby[21] = "and desiring to be filled with the crumbs which fell from the table of the rich man; but the dogs also coming licked his sores.";
web[21] = "And desiring to be fed with the crumbs which fell from the rich man\'s table: moreover, the dogs came and licked his sores.";
hnv[21] = "and desiring to be fed with the crumbs that fell from the rich man\'s table. Yes, even the dogs came and licked his sores.";
vul[21] = "cupiens saturari de micis quae cadebant de mensa divitis sed et canes veniebant et lingebant ulcera eius";
kjv[22] = "And it came to pass, that the beggar died, and was carried by the angels into Abraham\'s bosom: the rich man also died, and was buried;";
rsv[22] = "The poor man died and was carried by the angels to Abraham\'s bosom. The rich man also died and was buried;";
asv[22] = "And it came to pass, that the beggar died, and that he was carried away by the angels into Abraham\'s bosom: and the rich man also died, and was buried.";
yng[22] = "`And it came to pass, that the poor man died, and that he was carried away by the messengers to the bosom of Abraham -- and the rich man also died, and was buried;";
dby[22] = "And it came to pass that the poor man died, and that he was carried away by the angels into the bosom of Abraham. And the rich man also died and was buried.";
web[22] = "And it came to pass, that the beggar died, and was carried by angels into Abraham\'s bosom. The rich man also died, and was buried:";
hnv[22] = "It happened that the beggar died, and that he was carried away by the angels to Avraham\'s bosom. The rich man also died, and was buried.";
vul[22] = "factum est autem ut moreretur mendicus et portaretur ab angelis in sinum Abrahae mortuus est autem et dives et sepultus est in inferno";
kjv[23] = "And in hell he lift up his eyes, being in torments, and seeth Abraham afar off, and Lazarus in his bosom.";
rsv[23] = "and in Hades, being in torment, he lifted up his eyes, and saw Abraham far off and Laz\'arus in his bosom.";
asv[23] = "And in Hades he lifted up his eyes, being in torments, and seeth Abraham afar off, and Lazarus in his bosom.";
yng[23] = "and in the hades having lifted up his eyes, being in torments, he doth see Abraham afar off, and Lazarus in his bosom,";
dby[23] = "And in hades lifting up his eyes, being in torments, he sees Abraham afar off, and Lazarus in his bosom.";
web[23] = "And in hell he lifted up his eyes, being in torments, and seeth Abraham afar off, and Lazarus in his bosom.";
hnv[23] = "In She\'ol, he lifted up his eyes, being in torment, and saw Avraham far off, and El\'azar at his bosom.";
vul[23] = "elevans oculos suos cum esset in tormentis videbat Abraham a longe et Lazarum in sinu eius";
kjv[24] = "And he cried and said, Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue; for I am tormented in this flame.";
rsv[24] = "And he called out, \'Father Abraham, have mercy upon me, and send Laz\'arus to dip the end of his finger in water and cool my tongue; for I am in anguish in this flame.\'";
asv[24] = "And he cried and said, Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue; for I am in anguish in this flame.";
yng[24] = "and having cried, he said, Father Abraham, deal kindly with me, and send Lazarus, that he may dip the tip of his finger in water, and may cool my tongue, because I am distressed in this flame.";
dby[24] = "And he crying out said, Father Abraham, have compassion on me, and send Lazarus that he may dip the tip of his finger in water and cool my tongue, for I am suffering in this flame.";
web[24] = "And he cried, and said, Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue: for I am tormented in this flame.";
hnv[24] = "He cried and said, \'Father Avraham, have mercy on me, and send El\'azar, that he may dip the tip of his finger in water, and cool my tongue! For I am in anguish in this flame.\'";
vul[24] = "et ipse clamans dixit pater Abraham miserere mei et mitte Lazarum ut intinguat extremum digiti sui in aqua ut refrigeret linguam meam quia crucior in hac flamma";
kjv[25] = "But Abraham said, Son, remember that thou in thy lifetime receivedst thy good things, and likewise Lazarus evil things: but now he is comforted, and thou art tormented.";
rsv[25] = "But Abraham said, \'Son, remember that you in your lifetime received your good things, and Laz\'arus in like manner evil things; but now he is comforted here, and you are in anguish.";
asv[25] = "But Abraham said, Son, remember that thou in thy lifetime receivedst thy good things, and Lazarus in like manner evil things: but now here he is comforted, and thou art in anguish.";
yng[25] = "`And Abraham said, Child, remember that thou did receive -- thou -- thy good things in thy life, and Lazarus in like manner the evil things, and now he is comforted, and thou art distressed;";
dby[25] = "But Abraham said, Child, recollect that *thou* hast fully received thy good things in thy lifetime, and likewise Lazarus evil things. But now he is comforted here, and *thou* art in suffering.";
web[25] = "But Abraham said, Son, remember that thou in thy life-time receivedst thy good things, and likewise Lazarus evil things: but now he is comforted, and thou art tormented.";
hnv[25] = "&quot;But Avraham said, \'Son, remember that you, in your lifetime, received your good things, and El\'azar, in like manner, bad things. But now here he is comforted and you are in anguish.";
vul[25] = "et dixit illi Abraham fili recordare quia recepisti bona in vita tua et Lazarus similiter mala nunc autem hic consolatur tu vero cruciaris";
kjv[26] = "And beside all this, between us and you there is a great gulf fixed: so that they which would pass from hence to you cannot; neither can they pass to us, that [would come] from thence.";
rsv[26] = "And besides all this, between us and you a great chasm has been fixed, in order that those who would pass from here to you may not be able, and none may cross from there to us.\'";
asv[26] = "And besides all this, between us and you there is a great gulf fixed, that they that would pass from hence to you may not be able, and that none may cross over from thence to us.";
yng[26] = "and besides all these things, between us and you a great chasm is fixed, so that they who are willing to go over from hence unto you are not able, nor do they from thence to us pass through.";
dby[26] = "And besides all this, between us and you a great chasm is fixed, so that those who desire to pass hence to you cannot, nor do they who [desire to cross] from there pass over unto us.";
web[26] = "And besides all this, between us and you there is a great gulf fixed: so that they who would pass from hence to you, cannot; neither can they pass to us, that [would come] from thence.";
hnv[26] = " Besides all this, between us and you there is a great gulf fixed, that those who want to pass from here to you are not able, and that none may cross over from there to us.\'";
vul[26] = "et in his omnibus inter nos et vos chasma magnum firmatum est ut hii qui volunt hinc transire ad vos non possint neque inde huc transmeare";
kjv[27] = "Then he said, I pray thee therefore, father, that thou wouldest send him to my father\'s house:";
rsv[27] = "And he said, \'Then I beg you, father, to send him to my father\'s house,";
asv[27] = "And he said, I pray thee therefore, father, that thou wouldest send him to my father\'s house;";
yng[27] = "`And he said, I pray thee, then, father, that thou mayest send him to the house of my father,";
dby[27] = "And he said, I beseech thee then, father, that thou wouldest send him to the house of my father,";
web[27] = "Then he said, I pray thee therefore, father, that thou wouldst send him to my father\'s house:";
hnv[27] = "&quot;He said, \'I ask you therefore, father, that you would send him to my father\'s house;";
vul[27] = "et ait rogo ergo te pater ut mittas eum in domum patris mei";
kjv[28] = "For I have five brethren; that he may testify unto them, lest they also come into this place of torment.";
rsv[28] = "for I have five brothers, so that he may warn them, lest they also come into this place of torment.\'";
asv[28] = "for I have five brethren; that he may testify unto them, lest they also come into this place of torment.";
yng[28] = "for I have five brothers, so that he may thoroughly testify to them, that they also may not come to this place of torment.";
dby[28] = "for I have five brothers, so that he may earnestly testify to them, that they also may not come to this place of torment.";
web[28] = "For I have five brethren; that he may testify to them, lest they also come into this place of torment.";
hnv[28] = "for I have five brothers, that he may testify to them, so they won\'t also come into this place of torment.\'";
vul[28] = "habeo enim quinque fratres ut testetur illis ne et ipsi veniant in locum hunc tormentorum";
kjv[29] = "Abraham saith unto him, They have Moses and the prophets; let them hear them.";
rsv[29] = "But Abraham said, \'They have Moses and the prophets; let them hear them.\'";
asv[29] = "But Abraham saith, They have Moses and the prophets; let them hear them.";
yng[29] = "`Abraham saith to him, They have Moses and the prophets, let them hear them;";
dby[29] = "But Abraham says to him, They have Moses and the prophets: let them hear them.";
web[29] = "Abraham saith to him, They have Moses and the prophets; let them hear them.";
hnv[29] = "&quot;But Avraham said to him, \'They have Moshe and the prophets. Let them listen to them.\'";
vul[29] = "et ait illi Abraham habent Mosen et prophetas audiant illos";
kjv[30] = "And he said, Nay, father Abraham: but if one went unto them from the dead, they will repent.";
rsv[30] = "And he said, \'No, father Abraham; but if some one goes to them from the dead, they will repent.\'";
asv[30] = "And he said, Nay, father Abraham: but if one go to them from the dead, they will repent.";
yng[30] = "and he said, No, father Abraham, but if any one from the dead may go unto them, they will reform.";
dby[30] = "But he said, Nay, father Abraham, but if one from the dead should go to them, they will repent.";
web[30] = "And he said, No, father Abraham: but if one shall go to them from the dead, they will repent.";
hnv[30] = "&quot;He said, \'No, father Avraham, but if one goes to them from the dead, they will repent.\'";
vul[30] = "at ille dixit non pater Abraham sed si quis ex mortuis ierit ad eos paenitentiam agent";
kjv[31] = "And he said unto him, If they hear not Moses and the prophets, neither will they be persuaded, though one rose from the dead.";
rsv[31] = "He said to him, \'If they do not hear Moses and the prophets, neither will they be convinced if some one should rise from the dead.\'&quot;";
asv[31] = "And he said unto him, If they hear not Moses and the prophets, neither will they be persuaded, if one rise from the dead.";
yng[31] = "And he said to him, If Moses and the prophets they do not hear, neither if one may rise out of the dead will they be persuaded.\'";
dby[31] = "And he said to him, If they hear not Moses and the prophets, not even if one rise from among [the] dead will they be persuaded.";
web[31] = "And he said to him, If they hear not Moses and the prophets, neither will they be persuaded, though one shall rise from the dead.";
hnv[31] = "&quot;He said to him, \'If they don\'t listen to Moshe and the prophets, neither will they be persuaded if one rises from the dead.\'&quot;";
vul[31] = "ait autem illi si Mosen et prophetas non audiunt neque si quis ex mortuis resurrexerit credent";
