csb[1] = "As the crowd was pressing in on Jesus to hear God\'s word, he was standing by Lake Gennesaret.";
csb[2] = "He saw two boats at the edge of the lake; the fishermen had left them and were washing their nets.";
csb[3] = "He got into one of the boats, which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.";
csb[4] = "When he had finished speaking, he said to Simon, &quot;Put out into deep water and let down your nets for a catch.&quot;";
csb[5] = "&quot;Master,&quot; Simon replied, &quot;we\'ve worked hard all night long and caught nothing. But if you say so, I\'ll let down the nets.&quot;";
csb[6] = "When they did this, they caught a great number of fish, and their nets began to tear.";
csb[7] = "So they signaled to their partners in the other boat to come and help them; they came and filled both boats so full that they began to sink.";
csb[8] = "When Simon Peter saw this, he fell at Jesus\'s knees and said, &quot;Go away from me, because I\'m a sinful man, Lord! &quot;";
csb[9] = "For he and all those with him were amazed at the catch of fish they had taken,";
csb[10] = "and so were James and John, Zebedee\'s sons, who were Simon\'s partners. &quot;Don\'t be afraid,&quot; Jesus told Simon. &quot;From now on you will be catching people.&quot;";
csb[11] = "Then they brought the boats to land, left everything, and followed him.";
csb[12] = "While he was in one of the towns, a man was there who had leprosy all over him. He saw Jesus, fell facedown, and begged him: &quot;Lord, if you are willing, you can make me clean.&quot;";
csb[13] = "Reaching out his hand, Jesus touched him, saying, &quot;I am willing; be made clean,&quot; and immediately the leprosy left him.";
csb[14] = "Then he ordered him to tell no one: &quot;But go and show yourself to the priest, and offer what Moses commanded for your cleansing as a testimony to them.&quot;";
csb[15] = "But the news about him spread even more, and large crowds would come together to hear him and to be healed of their sicknesses.";
csb[16] = "Yet he often withdrew to deserted places and prayed.";
csb[17] = "On one of those days while he was teaching, Pharisees and teachers of the law were sitting there who had come from every village of Galilee and Judea, and also from Jerusalem. And the Lord\'s power to heal was in him.";
csb[18] = "Just then some men came, carrying on a stretcher a man who was paralyzed. They tried to bring him in and set him down before him.";
csb[19] = "Since they could not find a way to bring him in because of the crowd, they went up on the roof and lowered him on the stretcher through the roof tiles into the middle of the crowd before Jesus.";
csb[20] = "Seeing their faith he said, &quot;Friend, your sins are forgiven.&quot;";
csb[21] = "Then the scribes and the Pharisees began to think to themselves: &quot;Who is this man who speaks blasphemies? Who can forgive sins but God alone? &quot;";
csb[22] = "But perceiving their thoughts, Jesus replied to them, &quot;Why are you thinking this in your hearts?";
csb[23] = "&quot;Which is easier: to say, \'Your sins are forgiven you,\' or to say, \'Get up and walk\'?";
csb[24] = "&quot;But so that you may know that the Son of Man has authority on earth to forgive sins&quot; -- he told the paralyzed man, &quot;I tell you: Get up, take your stretcher, and go home.&quot;";
csb[25] = "Immediately he got up before them, picked up what he had been lying on, and went home glorifying God.";
csb[26] = "Then everyone was astounded, and they were giving glory to God. And they were filled with awe and said, &quot;We have seen incredible things today. &quot;";
csb[27] = "After this, Jesus went out and saw a tax collector named Levi sitting at the tax office, and he said to him, &quot;Follow me.&quot;";
csb[28] = "So, leaving everything behind, he got up and began to follow him.";
csb[29] = "Then Levi hosted a grand banquet for him at his house. Now there was a large crowd of tax collectors and others who were guests with them.";
csb[30] = "But the Pharisees and their scribes were complaining to his disciples, &quot;Why do you eat and drink with tax collectors and sinners? &quot;";
csb[31] = "Jesus replied to them, &quot;It is not those who are healthy who need a doctor, but those who are sick.";
csb[32] = "&quot;I have not come to call the righteous, but sinners to repentance.&quot;";
csb[33] = "Then they said to him, &quot;John\'s disciples fast often and say prayers, and those of the Pharisees do the same, but yours eat and drink.&quot;";
csb[34] = "Jesus said to them, &quot;You can\'t make the wedding guests fast while the groom is with them, can you?";
csb[35] = "&quot;But the time will come when the groom will be taken away from them -- then they will fast in those days.&quot;";
csb[36] = "He also told them a parable: &quot;No one tears a patch from a new garment and puts it on an old garment. Otherwise, not only will he tear the new, but also the piece from the new garment will not match the old.";
csb[37] = "&quot;And no one puts new wine into old wineskins. Otherwise, the new wine will burst the skins, it will spill, and the skins will be ruined.";
csb[38] = "&quot;No, new wine is put into fresh wineskins.";
csb[39] = "&quot;And no one, after drinking old wine, wants new, because he says, \'The old is better.\' &quot;";
