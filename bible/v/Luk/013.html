csb[1] = "At that time, some people came and reported to him about the Galileans whose blood Pilate had mixed with their sacrifices.";
csb[2] = "And he responded to them, &quot;Do you think that these Galileans were more sinful than all the other Galileans because they suffered these things?";
csb[3] = "&quot;No, I tell you; but unless you repent, you will all perish as well.";
csb[4] = "&quot;Or those eighteen that the tower in Siloam fell on and killed -- do you think they were more sinful than all the other people who live in Jerusalem?";
csb[5] = "&quot;No, I tell you; but unless you repent, you will all perish as well.&quot;";
csb[6] = "And he told this parable: &quot;A man had a fig tree that was planted in his vineyard. He came looking for fruit on it and found none.";
csb[7] = "&quot;He told the vineyard worker, \'Listen, for three years I have come looking for fruit on this fig tree and haven\'t found any. Cut it down! Why should it even waste the soil? \'";
csb[8] = "&quot;But he replied to him, \'Sir, leave it this year also, until I dig around it and fertilize it.";
csb[9] = "&quot;Perhaps it will produce fruit next year, but if not, you can cut it down.\' &quot;";
csb[10] = "As he was teaching in one of the synagogues on the Sabbath,";
csb[11] = "a woman was there who had been disabled by a spirit for over eighteen years. She was bent over and could not straighten up at all.";
csb[12] = "When Jesus saw her, he called out to her, &quot;Woman, you are free of your disability.&quot;";
csb[13] = "Then he laid his hands on her, and instantly she was restored and began to glorify God.";
csb[14] = "But the leader of the synagogue, indignant because Jesus had healed on the Sabbath, responded by telling the crowd, &quot;There are six days when work should be done; therefore come on those days and be healed and not on the Sabbath day.&quot;";
csb[15] = "But the Lord answered him and said, &quot;Hypocrites! Doesn\'t each one of you untie his ox or donkey from the feeding trough on the Sabbath and lead it to water?";
csb[16] = "&quot;Satan has bound this woman, a daughter of Abraham, for eighteen years -- shouldn\'t she be untied from this bondage on the Sabbath day? &quot;";
csb[17] = "When he had said these things, all his adversaries were humiliated, but the whole crowd was rejoicing over all the glorious things he was doing.";
csb[18] = "He said, therefore, &quot;What is the kingdom of God like, and what can I compare it to?";
csb[19] = "&quot;It\'s like a mustard seed that a man took and sowed in his garden. It grew and became a tree, and the birds of the sky nested in its branches.&quot;";
csb[20] = "Again he said, &quot;What can I compare the kingdom of God to?";
csb[21] = "&quot;It\'s like leaven that a woman took and mixed into fifty pounds of flour until all of it was leavened.&quot;&#x2009;";
csb[22] = "He went through one town and village after another, teaching and making his way to Jerusalem.";
csb[23] = "&quot;Lord,&quot; someone asked him, &quot;are only a few people going to be saved? &quot; He said to them,";
csb[24] = "&quot;Make every effort to enter through the narrow door, because I tell you, many will try to enter and won\'t be able";
csb[25] = "&quot;once the homeowner gets up and shuts the door. Then you will stand outside and knock on the door, saying, \'Lord, open up for us! \' He will answer you, \'I don\'t know you or where you\'re from.\'";
csb[26] = "&quot;Then you will say, \'We ate and drank in your presence, and you taught in our streets.\'";
csb[27] = "&quot;But he will say, \'I tell you, I don\'t know you or where you\'re from. Get away from me, all you evildoers! \'";
csb[28] = "&quot;There will be weeping and gnashing of teeth in that place, when you see Abraham, Isaac, Jacob, and all the prophets in the kingdom of God, but yourselves thrown out.";
csb[29] = "&quot;They will come from east and west, from north and south, to share the banquet in the kingdom of God.";
csb[30] = "&quot;Note this: Some who are last will be first, and some who are first will be last.&quot;";
csb[31] = "At that time some Pharisees came and told him, &quot;Go, get out of here. Herod wants to kill you.&quot;";
csb[32] = "He said to them, &quot;Go tell that fox, \'Look, I\'m driving out demons and performing healings today and tomorrow, and on the third day I will complete my work.\'";
csb[33] = "&quot;Yet it is necessary that I travel today, tomorrow, and the next day, because it is not possible for a prophet to perish outside of Jerusalem.";
csb[34] = "&quot;Jerusalem, Jerusalem, who kills the prophets and stones those who are sent to her. How often I wanted to gather your children together, as a hen gathers her chicks under her wings, but you were not willing!";
csb[35] = "&quot;See, your house is abandoned to you. I tell you, you will not see me until the time comes when you say, \'Blessed is he who comes in the name of the Lord\'! &quot;";
kjv[1] = "There were present at that season some that told him of the Galilaeans, whose blood Pilate had mingled with their sacrifices.";
kjv[2] = "And Jesus answering said unto them, Suppose ye that these Galilaeans were sinners above all the Galilaeans, because they suffered such things?";

kjv[5] = "I tell you, Nay: but, except ye repent, ye shall all likewise perish.";

kjv[7] = "Then said he unto the dresser of his vineyard, Behold, these three years I come seeking fruit on this fig tree, and find none: cut it down; why cumbereth it the ground?";
kjv[8] = "And he answering said unto him, Lord, let it alone this year also, till I shall dig about it, and dung [it]:";

kjv[10] = "And he was teaching in one of the synagogues on the sabbath.";

kjv[13] = "And he laid [his] hands on her: and immediately she was made straight, and glorified God.";
kjv[14] = "And the ruler of the synagogue answered with indignation, because that Jesus had healed on the sabbath day, and said unto the people, There are six days in which men ought to work: in them therefore come and be healed, and not on the sabbath day.";
kjv[15] = "The Lord then answered him, and said, [Thou] hypocrite, doth not each one of you on the sabbath loose his ox or [his] ass from the stall, and lead [him] away to watering?";
kjv[16] = "And ought not this woman, being a daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?";
kjv[17] = "And when he had said these things, all his adversaries were ashamed: and all the people rejoiced for all the glorious things that were done by him.";
kjv[18] = "Then said he, Unto what is the kingdom of God like? and whereunto shall I resemble it?";
kjv[19] = "It is like a grain of mustard seed, which a man took, and cast into his garden; and it grew, and waxed a great tree; and the fowls of the air lodged in the branches of it.";
kjv[20] = "And again he said, Whereunto shall I liken the kingdom of God?";
kjv[21] = "It is like leaven, which a woman took and hid in three measures of meal, till the whole was leavened.";
kjv[22] = "And he went through the cities and villages, teaching, and journeying toward Jerusalem.";
kjv[23] = "Then said one unto him, Lord, are there few that be saved? And he said unto them,";

kjv[27] = "But he shall say, I tell you, I know you not whence ye are; depart from me, all [ye] workers of iniquity.";

kjv[32] = "And he said unto them, Go ye, and tell that fox, Behold, I cast out devils, and I do cures to day and to morrow, and the third [day] I shall be perfected.";
kjv[33] = "Nevertheless I must walk to day, and to morrow, and the [day] following: for it cannot be that a prophet perish out of Jerusalem.";

kjv[35] = "Behold, your house is left unto you desolate: and verily I say unto you, Ye shall not see me, until [the time] come when ye shall say, Blessed [is] he that cometh in the name of the Lord.";

asv[18] = "He said therefore, Unto what is the kingdom of God like? and whereunto shall I liken it?";
yng[18] = "And he said, `To what is the reign of God like? and to what shall I liken it?";
dby[18] = "And he said, To what is the kingdom of God like? and to what shall I liken it?";
web[18] = "Then said he, To what is the kingdom of God like? and to what shall I resemble it?";
hnv[18] = "He said, &quot;What is the Kingdom of God like? To what shall I compare it?";
vul[18] = "dicebat ergo cui simile est regnum Dei et cui simile esse existimabo illud";
rsv[19] = "It is like a grain of mustard seed which a man took and sowed in his garden; and it grew and became a tree, and the birds of the air made nests in its branches.&quot;";
asv[19] = "It is like unto a grain of mustard seed, which a man took, and cast into his own garden; and it grew, and became a tree; and the birds of the heaven lodged in the branches thereof.";
yng[19] = "It is like to a grain of mustard, which a man having taken, did cast into his garden, and it increased, and came to a great tree, and the fowls of the heavens did rest in its branches.\'";
dby[19] = "It is like a grain of mustard [seed] which a man took and cast into his garden; and it grew and became a great tree, and the birds of heaven lodged in its branches.";
web[19] = "It is like a grain of mustard-seed, which a man took, and cast into his garden, and it grew, and became a great tree; and the fowls of the air lodged in the branches of it.";
hnv[19] = "It is like a grain of mustard seed, which a man took, and put in his own garden. It grew, and became a large tree, and the birds of the sky lodged in its branches.&quot;";
vul[19] = "simile est grano sinapis quod acceptum homo misit in hortum suum et crevit et factum est in arborem magnam et volucres caeli requieverunt in ramis eius";
rsv[20] = "And again he said, &quot;To what shall I compare the kingdom of God?";
asv[20] = "And again he said, Whereunto shall I liken the kingdom of God?";
yng[20] = "And again he said, `To what shall I liken the reign of God?";
dby[20] = "And again he said, To what shall I liken the kingdom of God?";
web[20] = "And again he said, To what shall I liken the kingdom of God?";
hnv[20] = "Again he said, &quot;To what shall I compare the Kingdom of God?";
vul[20] = "et iterum dixit cui simile aestimabo regnum Dei";
rsv[21] = "It is like leaven which a woman took and hid in three measures of flour, till it was all leavened.&quot;";
asv[21] = "It is like unto leaven, which a woman took and hid in three measures of meal, till it was all leavened.";
yng[21] = "It is like leaven, which a woman, having taken, did hide in three measures of meal, till that all was leavened.\'";
dby[21] = "It is like leaven, which a woman took and hid in three measures of meal until the whole was leavened.";
web[21] = "It is like leaven, which a woman took and hid in three measures of meal, till the whole was leavened.";
hnv[21] = "It is like yeast, which a woman took and hid in three measures of flour, until it was all leavened.&quot;";
vul[21] = "simile est fermento quod acceptum mulier abscondit in farinae sata tria donec fermentaretur totum";
rsv[22] = "He went on his way through towns and villages, teaching, and journeying toward Jerusalem.";
asv[22] = "And he went on his way through cities and villages, teaching, and journeying on unto Jerusalem.";
yng[22] = "And he was going through cities and villages, teaching, and making progress toward Jerusalem;";
dby[22] = "And he went through one city and village after another, teaching, and journeying to Jerusalem.";
web[22] = "And he went through the cities and villages, teaching, and journeying towards Jerusalem.";
hnv[22] = "He went on his way through cities and villages, teaching, and traveling on to Yerushalayim.";
vul[22] = "et ibat per civitates et castella docens et iter faciens in Hierusalem";
rsv[23] = "And some one said to him, &quot;Lord, will those who are saved be few?&quot; And he said to them,";
asv[23] = "And one said unto him, Lord, are they few that are saved? And he said unto them,";
yng[23] = "and a certain one said to him, `Sir, are those saved few?\' and he said unto them,";
dby[23] = "And one said to him, Sir, [are] such as are to be saved few in number? But he said unto them,";
web[23] = "Then said one to him, Lord, are there few that are saved? And he said to them,";
hnv[23] = "One said to him, &quot;Lord, are they few who are saved?&quot; He said to them,";
vul[23] = "ait autem illi quidam Domine si pauci sunt qui salvantur ipse autem dixit ad illos";
rsv[24] = "&quot;Strive to enter by the narrow door; for many, I tell you, will seek to enter and will not be able.";
asv[24] = "Strive to enter in by the narrow door: for many, I say unto you, shall seek to enter in, and shall not be able.";
yng[24] = "`Be striving to go in through the straight gate, because many, I say to you, will seek to go in, and shall not be able;";
dby[24] = "Strive with earnestness to enter in through the narrow door, for many, I say to you, will seek to enter in and will not be able.";
web[24] = "Strive to enter in at the strait gate: for many, I say to you, will seek to enter in, and shall not be able.";
hnv[24] = "&quot;Strive to enter in by the narrow door, for many, I tell you, will seek to enter in, and will not be able.";
vul[24] = "contendite intrare per angustam portam quia multi dico vobis quaerunt intrare et non poterunt";
rsv[25] = "When once the householder has risen up and shut the door, you will begin to stand outside and to knock at the door, saying, \'Lord, open to us.\' He will answer you, \'I do not know where you come from.\'";
asv[25] = "When once the master of the house is risen up, and hath shut to the door, and ye begin to stand without, and to knock at the door, saying, Lord, open to us; and he shall answer and say to you, I know you not whence ye are;";
yng[25] = "from the time the master of the house may have risen up, and may have shut the door, and ye may begin without to stand, and to knock at the door, saying, Lord, lord, open to us, and he answering shall say to you, I have not known you whence ye are,";
dby[25] = "From the time that the master of the house shall have risen up and shall have shut the door, and ye shall begin to stand without and to knock at the door, saying, Lord, open to us; and he answering shall say to you, I know you not whence ye are:";
web[25] = "When once the master of the house hath risen, and hath shut the door, and ye begin to stand without, and to knock at the door, saying, Lord, Lord, open to us; and he will answer and say to you, I know you not whence ye are:";
hnv[25] = " When once the master of the house has risen up, and has shut the door, and you begin to stand outside, and to knock at the door, saying, \'Lord, Lord, open to us!\' then he will answer and tell you, \'I don\'t know you or where you come from.\'";
vul[25] = "cum autem intraverit pater familias et cluserit ostium et incipietis foris stare et pulsare ostium dicentes Domine aperi nobis et respondens dicet vobis nescio vos unde sitis";
rsv[26] = "Then you will begin to say, \'We ate and drank in your presence, and you taught in our streets.\'";
asv[26] = "then shall ye begin to say, We did eat and drink in thy presence, and thou didst teach in our streets;";
yng[26] = "then ye may begin to say, We did eat before thee, and did drink, and in our broad places thou didst teach;";
dby[26] = "then shall ye begin to say, We have eaten in thy presence and drunk, and thou hast taught in our streets;";
web[26] = "Then ye will begin to say, We have eaten and drank in thy presence, and thou hast taught in our streets.";
hnv[26] = "Then you will begin to say, \'We ate and drink in your presence, and you taught in our streets.\'";
vul[26] = "tunc incipietis dicere manducavimus coram te et bibimus et in plateis nostris docuisti";
rsv[27] = "But he will say, \'I tell you, I do not know where you come from; depart from me, all you workers of iniquity!\'";
asv[27] = "and he shall say, I tell you, I know not whence ye are; depart from me, all ye workers of iniquity.";
yng[27] = "and he shall say, I say to you, I have not known you whence ye are; depart from me, all ye workers of the unrighteousness.";
dby[27] = "and he shall say, I tell you, I do not know you whence ye are; depart from me, all [ye] workers of iniquity.";
web[27] = "But he will say, I tell you, I know you not whence ye are: depart from me, all [ye] workers of iniquity.";
hnv[27] = "He will say, \'I tell you, I don\'t know where you come from. Depart from me, all you workers of iniquity.\'";
vul[27] = "et dicet vobis nescio vos unde sitis discedite a me omnes operarii iniquitatis";
rsv[28] = "There you will weep and gnash your teeth, when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God and you yourselves thrust out.";
asv[28] = "There shall be the weeping and the gnashing of teeth, when ye shall see Abraham, and Isaac, and Jacob, and all the prophets, in the kingdom of God, and yourselves cast forth without.";
yng[28] = "`There shall be there the weeping and the gnashing of the teeth, when ye may see Abraham, and Isaac, and Jacob, and all the prophets, in the reign of God, and yourselves being cast out without;";
dby[28] = "There shall be the weeping and the gnashing of teeth, when ye shall see Abraham and Isaac and Jacob and all the prophets in the kingdom of God, but yourselves cast out.";
web[28] = "There shall be weeping and gnashing of teeth when ye shall see Abraham, and Isaac, and Jacob, and all the prophets in the kingdom of God, and you [yourselves] excluded.";
hnv[28] = "There will be weeping and gnashing of teeth, when you see Avraham, Yitzchak, Ya`akov, and all the prophets, in the Kingdom of God, and yourselves being thrown outside.";
vul[28] = "ibi erit fletus et stridor dentium cum videritis Abraham et Isaac et Iacob et omnes prophetas in regno Dei vos autem expelli foras";
rsv[29] = "And men will come from east and west, and from north and south, and sit at table in the kingdom of God.";
asv[29] = "And they shall come from the east and west, and from the north and south, and shall sit down in the kingdom of God.";
yng[29] = "and they shall come from east and west, and from north and south, and shall recline in the reign of God,";
dby[29] = "And they shall come from east and west, and from north and south, and shall lie down at table in the kingdom of God.";
web[29] = "And they will come from the east, and [from] the west, and from the north, and [from] the south, and will sit down in the kingdom of God.";
hnv[29] = "They will come from the east, west, north, and south, and will sit down in the Kingdom of God.";
vul[29] = "et venient ab oriente et occidente et aquilone et austro et accumbent in regno Dei";
rsv[30] = "And behold, some are last who will be first, and some are first who will be last.&quot;";
asv[30] = "And behold, there are last who shall be first, and there are first who shall be last.";
yng[30] = "and lo, there are last who shall be first, and there are first who shall be last.\'";
dby[30] = "And behold, there are last who shall be first, and there are first who shall be last.";
web[30] = "And behold, there are last, who shall be first; and there are first who shall be last.";
hnv[30] = "Behold, there are some who are last who will be first, and there are some who are first who will be last.&quot;";
vul[30] = "et ecce sunt novissimi qui erunt primi et sunt primi qui erunt novissimi";
rsv[31] = "At that very hour some Pharisees came, and said to him, &quot;Get away from here, for Herod wants to kill you.&quot;";
asv[31] = "In that very hour there came certain Pharisees, saying to him, Get thee out, and go hence: for Herod would fain kill thee.";
yng[31] = "On that day there came near certain Pharisees, saying to him, `Go forth, and be going on hence, for Herod doth wish to kill thee;\'";
dby[31] = "The same hour certain Pharisees came up, saying to him, Get out, and go hence, for Herod is desirous to kill thee.";
web[31] = "The same day there came certain of the Pharisees, saying to him, Go out, and depart hence; for Herod will kill thee.";
hnv[31] = "On that same day, some Perushim came, saying to him, &quot;Get out of here, and go away, for Herod wants to kill you.&quot;";
vul[31] = "in ipsa die accesserunt quidam Pharisaeorum dicentes illi exi et vade hinc quia Herodes vult te occidere";
rsv[32] = "And he said to them, &quot;Go and tell that fox, \'Behold, I cast out demons and perform cures today and tomorrow, and the third day I finish my course.";
asv[32] = "And he said unto them, Go and say to that fox, Behold, I cast out demons and perform cures to-day and to-morrow, and the third [day] I am perfected.";
yng[32] = "and he said to them, `Having gone, say to this fox, Lo, I cast forth demons, and perfect cures to-day and to-morrow, and the third [day] I am being perfected;";
dby[32] = "And he said to them, Go, tell that fox, Behold, I cast out demons and accomplish cures to-day and to-morrow, and the third [day] I am perfected;";
web[32] = "And he said to them, Go ye and tell that fox, Behold, I cast out demons, and I do cures to-day and to-morrow, and the third [day] I shall be perfected.";
hnv[32] = "He said to them, &quot;Go and tell that fox, \'Behold, I cast out demons and perform cures today and tomorrow, and the third day I complete my mission.";

rsv[33] = "Nevertheless I must go on my way today and tomorrow and the day following; for it cannot be that a prophet should perish away from Jerusalem.\'";
asv[33] = "Nevertheless I must go on my way to-day and to-morrow and the [day] following: for it cannot be that a prophet perish out of Jerusalem.";
yng[33] = "but it behoveth me to-day, and to-morrow, and the [day] following, to go on, because it is not possible for a prophet to perish out of Jerusalem.";
dby[33] = "but I must needs walk to-day and to-morrow and the [day] following, for it must not be that a prophet perish out of Jerusalem.";
web[33] = "Nevertheless, I must walk to-day and to-morrow, and the [day] following: for it cannot be that a prophet should perish out of Jerusalem.";
hnv[33] = "Nevertheless I must go on my way today and tomorrow and the next day, for it can\'t be that a prophet perish outside of Yerushalayim.\'";
vul[33] = "verumtamen oportet me hodie et cras et sequenti ambulare quia non capit prophetam perire extra Hierusalem";
rsv[34] = "O Jerusalem, Jerusalem, killing the prophets and stoning those who are sent to you! How often would I have gathered your children together as a hen gathers her brood under her wings, and you would not!";
asv[34] = "O Jerusalem, Jerusalem, that killeth the prophets, and stoneth them that are sent unto her! how often would I have gathered thy children together, even as a hen [gathereth] her own brood under her wings, and ye would not!";
yng[34] = "`Jerusalem, Jerusalem, that is killing the prophets, and stoning those sent unto her, how often did I will to gather together thy children, as a hen her brood under the wings, and ye did not will.";
dby[34] = "Jerusalem, Jerusalem, the [city] that kills the prophets and stones those that are sent unto her, how often would I have gathered thy children together, as a hen her brood under her wings, and ye would not.";
web[34] = "O Jerusalem, Jerusalem, that killest the prophets, and stonest them that are sent to thee; how often would I have gathered thy children, as a hen [gathereth] her brood under [her] wings, and ye would not!";
hnv[34] = "&quot;Yerushalayim, Yerushalayim, that kills the prophets, and stones those who are sent to her! How often I wanted to gather your children together, like a hen gathers her own brood under her wings, and you refused!";
vul[34] = "Hierusalem Hierusalem quae occidis prophetas et lapidas eos qui mittuntur ad te quotiens volui congregare filios tuos quemadmodum avis nidum suum sub pinnis et noluisti";
rsv[35] = "Behold, your house is forsaken. And I tell you, you will not see me until you say, \'Blessed is he who comes in the name of the Lord!\'&quot;";
asv[35] = "Behold, your house is left unto you [desolate]: and I say unto you, Ye shall not see me, until ye shall say, Blessed [is] he that cometh in the name of the Lord.";
yng[35] = "`Lo, your house is being left to you desolate, and verily I say to you -- ye may not see me, till it may come, when ye may say, Blessed [is] he who is coming in the name of the Lord.\'";
dby[35] = "Behold, your house is left unto you; and I say unto you, that ye shall not see me until it come that ye say, Blessed [is] he that comes in the name of [the] Lord.";
web[35] = "Behold, your house is left to you desolate. And verily I say to you, ye shall not see me, until [the time shall] come when ye shall say, Blessed [is] he that cometh in the name of the Lord.";
hnv[35] = "Behold, your house is left to you desolate. I tell you, you will not see me, until you say, \'Blessed is he who comes in the name of the Lord!\'&quot;";
vul[35] = "ecce relinquitur vobis domus vestra dico autem vobis quia non videbitis me donec veniat cum dicetis benedictus qui venit in nomine Domini";
