csb[1] = "Meanwhile, a crowd of many thousands came together, so that they were trampling on one another. He began to say to his disciples first, &quot;Be on your guard against the leaven of the Pharisees, which is hypocrisy.";
csb[2] = "&quot;There is nothing covered that won\'t be uncovered, nothing hidden that won\'t be made known.";
csb[3] = "&quot;Therefore, whatever you have said in the dark will be heard in the light, and what you have whispered in an ear in private rooms will be proclaimed on the housetops.";
csb[4] = "&quot;I say to you, my friends, don\'t fear those who kill the body, and after that can do nothing more.";
csb[5] = "&quot;But I will show you the one to fear: Fear him who has authority to throw people into hell after death. Yes, I say to you, this is the one to fear!";
csb[6] = "&quot;Aren\'t five sparrows sold for two pennies? Yet not one of them is forgotten in God\'s sight.";
csb[7] = "&quot;Indeed, the hairs of your head are all counted. Don\'t be afraid; you are worth more than many sparrows.";
csb[8] = "&quot;And I say to you, anyone who acknowledges me before others, the Son of Man will also acknowledge him before the angels of God,";
csb[9] = "&quot;but whoever denies me before others will be denied before the angels of God.";
csb[10] = "&quot;Anyone who speaks a word against the Son of Man will be forgiven, but the one who blasphemes against the Holy Spirit will not be forgiven.";
csb[11] = "&quot;Whenever they bring you before synagogues and rulers and authorities, don\'t worry about how you should defend yourselves or what you should say.";
csb[12] = "&quot;For the Holy Spirit will teach you at that very hour what must be said.&quot;";
csb[13] = "Someone from the crowd said to him, &quot;Teacher, tell my brother to divide the inheritance with me.&quot;";
csb[14] = "&quot;Friend,&quot; he said to him, &quot;who appointed me a judge or arbitrator over you? &quot;";
csb[15] = "He then told them, &quot;Watch out and be on guard against all greed, because one\'s life is not in the abundance of his possessions.&quot;";
csb[16] = "Then he told them a parable: &quot;A rich man\'s land was very productive.";
csb[17] = "&quot;He thought to himself, \'What should I do, since I don\'t have anywhere to store my crops?";
csb[18] = "&quot;I will do this,\' he said. \'I\'ll tear down my barns and build bigger ones and store all my grain and my goods there.";
csb[19] = "&quot;Then I\'ll say to myself, &quot;You have many goods stored up for many years. Take it easy; eat, drink, and enjoy yourself.&quot; \'";
csb[20] = "&quot;But God said to him, \'You fool! This very night your life is demanded of you. And the things you have prepared -- whose will they be? \'";
csb[21] = "&quot;That\'s how it is with the one who stores up treasure for himself and is not rich toward God.&quot;";
csb[22] = "Then he said to his disciples: &quot;Therefore I tell you, don\'t worry about your life, what you will eat; or about the body, what you will wear.";
csb[23] = "&quot;For life is more than food and the body more than clothing.";
csb[24] = "&quot;Consider the ravens: They don\'t sow or reap; they don\'t have a storeroom or a barn; yet God feeds them. Aren\'t you worth much more than the birds?";
csb[25] = "&quot;Can any of you add one moment to his life-span by worrying?";
csb[26] = "&quot;If then you\'re not able to do even a little thing, why worry about the rest?";
csb[27] = "&quot;Consider how the wildflowers grow: They don\'t labor or spin thread. Yet I tell you, not even Solomon in all his splendor was adorned like one of these.";
csb[28] = "&quot;If that\'s how God clothes the grass, which is in the field today and is thrown into the furnace tomorrow, how much more will he do for you -- you of little faith?";
csb[29] = "&quot;Don\'t strive for what you should eat and what you should drink, and don\'t be anxious.";
csb[30] = "&quot;For the Gentile world eagerly seeks all these things, and your Father knows that you need them.";
csb[31] = "&quot;But seek his kingdom, and these things will be provided for you.";
csb[32] = "&quot;Don\'t be afraid, little flock, because your Father delights to give you the kingdom.";
csb[33] = "&quot;Sell your possessions and give to the poor. Make money-bags for yourselves that won\'t grow old, an inexhaustible treasure in heaven, where no thief comes near and no moth destroys.";
csb[34] = "&quot;For where your treasure is, there your heart will be also.";
csb[35] = "&quot;Be ready for service and have your lamps lit.";
csb[36] = "&quot;You are to be like people waiting for their master to return from the wedding banquet so that when he comes and knocks, they can open the door for him at once.";
csb[37] = "&quot;Blessed will be those servants the master finds alert when he comes. Truly I tell you, he will get ready, have them recline at the table, then come and serve them.";
csb[38] = "&quot;If he comes in the middle of the night, or even near dawn, and finds them alert, blessed are those servants.";
csb[39] = "&quot;But know this: If the homeowner had known at what hour the thief was coming, he would not have let his house be broken into.";
csb[40] = "&quot;You also be ready, because the Son of Man is coming at an hour you do not expect.&quot;";
csb[41] = "&quot;Lord,&quot; Peter asked, &quot;are you telling this parable to us or to everyone? &quot;";
csb[42] = "The Lord said: &quot;Who then is the faithful and sensible manager his master will put in charge of his household servants to give them their allotted food at the proper time?";
csb[43] = "&quot;Blessed is that servant whom the master finds doing his job when he comes.";
csb[44] = "&quot;Truly I tell you, he will put him in charge of all his possessions.";
csb[45] = "&quot;But if that servant says in his heart, \'My master is delaying his coming,\' and starts to beat the male and female servants, and to eat and drink and get drunk,";
csb[46] = "&quot;that servant\'s master will come on a day he does not expect him and at an hour he does not know. He will cut him to pieces and assign him a place with the unfaithful.";
csb[47] = "&quot;And that servant who knew his master\'s will and didn\'t prepare himself or do it will be severely beaten.";
csb[48] = "&quot;But the one who did not know and did what deserved punishment will receive a light beating. From everyone who has been given much, much will be required; and from the one who has been entrusted with much, even more will be expected.";
csb[49] = "&quot;I came to bring fire on the earth, and how I wish it were already set ablaze!";
csb[50] = "&quot;But I have a baptism to undergo, and how it consumes me until it is finished!";
csb[51] = "&quot;Do you think that I came here to bring peace on the earth? No, I tell you, but rather division.";
csb[52] = "&quot;From now on, five in one household will be divided: three against two, and two against three.";
csb[53] = "&quot;They will be divided, father against son, son against father, mother against daughter, daughter against mother, mother-in-law against her daughter-in-law, and daughter-in-law against mother-in-law.&quot;";
csb[54] = "He also said to the crowds: &quot;When you see a cloud rising in the west, right away you say, \'A storm is coming,\' and so it does.";
csb[55] = "&quot;And when the south wind is blowing, you say, \'It\'s going to be hot,\' and it is.";
csb[56] = "&quot;Hypocrites! You know how to interpret the appearance of the earth and the sky, but why don\'t you know how to interpret this present time?";
csb[57] = "&quot;Why don\'t you judge for yourselves what is right?";
csb[58] = "&quot;As you are going with your adversary to the ruler, make an effort to settle with him on the way. Then he won\'t drag you before the judge, the judge hand you over to the bailiff, and the bailiff throw you into prison.";
csb[59] = "&quot;I tell you, you will never get out of there until you have paid the last cent.&quot;";

kjv[56] = "[Ye] hypocrites, ye can discern the face of the sky and of the earth; but how is it that ye do not discern this time?";
rsv[56] = "You hypocrites! You know how to interpret the appearance of earth and sky; but why do you not know how to interpret the present time?";
asv[56] = "Ye hypocrites, ye know how to interpret the face of the earth and the heaven; but how is it that ye know not how to interpret this time?";
yng[56] = "hypocrites! the face of the earth and of the heaven ye have known to make proof of, but this time -- how do ye not make proof of [it]?";
dby[56] = "Hypocrites, ye know how to judge of the appearance of the earth and of the heaven; how [is it then that] ye do not discern this time?";
web[56] = "[Ye] hypocrites, ye can discern the face of the sky, and of the earth; but how is it, that ye do not discern this time?";
hnv[56] = "You hypocrites! You know how to interpret the appearance of the eretz and the sky, but how is it that you don\'t interpret this time?";

kjv[58] = "When thou goest with thine adversary to the magistrate, [as thou art] in the way, give diligence that thou mayest be delivered from him; lest he hale thee to the judge, and the judge deliver thee to the officer, and the officer cast thee into prison.";
rsv[58] = "As you go with your accuser before the magistrate, make an effort to settle with him on the way, lest he drag you to the judge, and the judge hand you over to the officer, and the officer put you in prison.";
asv[58] = "For as thou art going with thine adversary before the magistrate, on the way give diligence to be quit of him; lest haply he drag thee unto the judge, and the judge shall deliver thee to the officer, and the officer shall cast thee into prison.";
yng[58] = "for, as thou art going away with thy opponent to the ruler, in the way give diligence to be released from him, lest he may drag thee unto the judge, and the judge may deliver thee to the officer, and the officer may cast thee into prison;";
dby[58] = "For as thou goest with thine adverse party before a magistrate, strive in the way to be reconciled with him, lest he drag thee away to the judge, and the judge shall deliver thee to the officer, and the officer cast thee into prison.";
web[58] = "When thou goest with thy adversary to the magistrate, [as thou art] in the way, give diligence that thou mayest be delivered from him; lest he draw thee before the judge, and the judge deliver thee to the officer, and the officer cast thee into prison.";
hnv[58] = "For when you are going with your adversary before the magistrate, try diligently on the way to be released from him, lest perhaps he drag you to the judge, and the judge deliver you to the officer, and the officer throw you into prison.";
vul[58] = "cum autem vadis cum adversario tuo ad principem in via da operam liberari ab illo ne forte trahat te apud iudicem et iudex tradat te exactori et exactor mittat te in carcerem";
