csb[1] = "One day as he was teaching the people in the temple and proclaiming the good news, the chief priests and the scribes, with the elders, came";
csb[2] = "and said to him: &quot;Tell us, by what authority are you doing these things? Who is it who gave you this authority? &quot;";
csb[3] = "He answered them, &quot;I will also ask you a question. Tell me,";
csb[4] = "&quot;was the baptism of John from heaven or of human origin? &quot;";
csb[5] = "They discussed it among themselves: &quot;If we say, \'From heaven,\' he will say, \'Why didn\'t you believe him? \'";
csb[6] = "&quot;But if we say, \'Of human origin,\' all the people will stone us, because they are convinced that John was a prophet.&quot;";
csb[7] = "So they answered that they did not know its origin.";
csb[8] = "And Jesus said to them, &quot;Neither will I tell you by what authority I do these things.&quot;";
csb[9] = "Now he began to tell the people this parable: &quot;A man planted a vineyard, leased it to tenant farmers, and went away for a long time.";
csb[10] = "&quot;At harvest time he sent a servant to the farmers so that they might give him some fruit from the vineyard. But the farmers beat him and sent him away empty-handed.";
csb[11] = "&quot;He sent yet another servant, but they beat that one too, treated him shamefully, and sent him away empty-handed.";
csb[12] = "&quot;And he sent yet a third, but they wounded this one too and threw him out.";
csb[13] = "&quot;Then the owner of the vineyard said, \'What should I do? I will send my beloved son. Perhaps they will respect him.\'";
csb[14] = "&quot;But when the tenant farmers saw him, they discussed it among themselves and said, \'This is the heir. Let\'s kill him, so that the inheritance will be ours.\'";
csb[15] = "&quot;So they threw him out of the vineyard and killed him. &quot;What then will the owner of the vineyard do to them?";
csb[16] = "&quot;He will come and kill those farmers and give the vineyard to others.&quot; But when they heard this they said, &quot;That must never happen! &quot;";
csb[17] = "But he looked at them and said, &quot;Then what is the meaning of this Scripture: The stone that the builders rejected has become the cornerstone?";
csb[18] = "&quot;Everyone who falls on that stone will be broken to pieces, but on whomever it falls, it will shatter him.&quot;";
csb[19] = "Then the scribes and the chief priests looked for a way to get their hands on him that very hour, because they knew he had told this parable against them, but they feared the people.";
csb[20] = "They watched closely and sent spies who pretended to be righteous, so that they could catch him in what he said, to hand him over to the governor\'s rule and authority.";
csb[21] = "They questioned him, &quot;Teacher, we know that you speak and teach correctly, and you don\'t show partiality but teach truthfully the way of God.";
csb[22] = "&quot;Is it lawful for us to pay taxes to Caesar or not? &quot;";
csb[23] = "But detecting their craftiness, he said to them,";
csb[24] = "&quot;Show me a denarius. Whose image and inscription does it have? &quot; &quot;Caesar\'s,&quot; they said.";
csb[25] = "&quot;Well then,&quot; he told them, &quot;give to Caesar the things that are Caesar\'s, and to God the things that are God\'s.&quot;";
csb[26] = "They were not able to catch him in what he said in public, and being amazed at his answer, they became silent.";
csb[27] = "Some of the Sadducees, who say there is no resurrection, came up and questioned him:";
csb[28] = "&quot;Teacher, Moses wrote for us that if a man\'s brother has a wife, and dies childless, his brother should take the wife and produce offspring for his brother.";
csb[29] = "&quot;Now there were seven brothers. The first took a wife and died without children.";
csb[30] = "&quot;Also the second";
csb[31] = "&quot;and the third took her. In the same way, all seven died and left no children.";
csb[32] = "&quot;Finally, the woman died too.";
csb[33] = "&quot;In the resurrection, therefore, whose wife will the woman be? For all seven had married her.&quot;";
csb[34] = "Jesus told them, &quot;The children of this age marry and are given in marriage.";
csb[35] = "&quot;But those who are counted worthy to take part in that age and in the resurrection from the dead neither marry nor are given in marriage.";
csb[36] = "&quot;For they can no longer die, because they are like angels and are children of God, since they are children of the resurrection.";
csb[37] = "&quot;Moses even indicated in the passage about the burning bush that the dead are raised, where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.";
csb[38] = "&quot;He is not the God of the dead but of the living, because all are living to him.&quot;";
csb[39] = "Some of the scribes answered, &quot;Teacher, you have spoken well.&quot;";
csb[40] = "And they no longer dared to ask him anything.";
csb[41] = "Then he said to them, &quot;How can they say that the Christ is the son of David?";
csb[42] = "&quot;For David himself says in the Book of Psalms: The Lord declared to my Lord, \'Sit at my right hand";
csb[43] = "&quot;until I make your enemies your footstool.\'";
csb[44] = "&quot;David calls him \'Lord\' how then can the Christ be his son? &quot;";
csb[45] = "While all the people were listening, he said to his disciples,";
csb[46] = "&quot;Beware of the scribes, who want to go around in long robes and who love greetings in the marketplaces, the best seats in the synagogues, and the places of honor at banquets.";
csb[47] = "&quot;They devour widows\' houses and say long prayers just for show. These will receive harsher judgment.&quot;";
kjv[1] = "And it came to pass, [that] on one of those days, as he taught the people in the temple, and preached the gospel, the chief priests and the scribes came upon [him] with the elders,";
kjv[2] = "And spake unto him, saying, Tell us, by what authority doest thou these things? or who is he that gave thee this authority?";
kjv[3] = "And he answered and said unto them, I will also ask you one thing; and answer me:";
kjv[4] = "The baptism of John, was it from heaven, or of men?";
kjv[5] = "And they reasoned with themselves, saying, If we shall say, From heaven; he will say, Why then believed ye him not?";
kjv[6] = "But and if we say, Of men; all the people will stone us: for they be persuaded that John was a prophet.";
kjv[7] = "And they answered, that they could not tell whence [it was].";
kjv[8] = "And Jesus said unto them, Neither tell I you by what authority I do these things.";
kjv[9] = "Then began he to speak to the people this parable; A certain man planted a vineyard, and let it forth to husbandmen, and went into a far country for a long time.";
kjv[10] = "And at the season he sent a servant to the husbandmen, that they should give him of the fruit of the vineyard: but the husbandmen beat him, and sent [him] away empty.";
kjv[11] = "And again he sent another servant: and they beat him also, and entreated [him] shamefully, and sent [him] away empty.";
kjv[12] = "And again he sent a third: and they wounded him also, and cast [him] out.";
kjv[13] = "Then said the lord of the vineyard, What shall I do? I will send my beloved son: it may be they will reverence [him] when they see him.";
kjv[14] = "But when the husbandmen saw him, they reasoned among themselves, saying, This is the heir: come, let us kill him, that the inheritance may be ours.";
kjv[15] = "So they cast him out of the vineyard, and killed [him]. What therefore shall the lord of the vineyard do unto them?";
kjv[16] = "He shall come and destroy these husbandmen, and shall give the vineyard to others. And when they heard [it], they said, God forbid.";
kjv[17] = "And he beheld them, and said, What is this then that is written, The stone which the builders rejected, the same is become the head of the corner?";
kjv[18] = "Whosoever shall fall upon that stone shall be broken; but on whomsoever it shall fall, it will grind him to powder.";
kjv[19] = "And the chief priests and the scribes the same hour sought to lay hands on him; and they feared the people: for they perceived that he had spoken this parable against them.";
kjv[20] = "And they watched [him], and sent forth spies, which should feign themselves just men, that they might take hold of his words, that so they might deliver him unto the power and authority of the governor.";
kjv[21] = "And they asked him, saying, Master, we know that thou sayest and teachest rightly, neither acceptest thou the person [of any], but teachest the way of God truly:";
kjv[22] = "Is it lawful for us to give tribute unto Caesar, or no?";
kjv[23] = "But he perceived their craftiness, and said unto them, Why tempt ye me?";
kjv[24] = "Shew me a penny. Whose image and superscription hath it? They answered and said, Caesar\'s.";
kjv[25] = "And he said unto them, Render therefore unto Caesar the things which be Caesar\'s, and unto God the things which be God\'s.";
kjv[26] = "And they could not take hold of his words before the people: and they marvelled at his answer, and held their peace.";
kjv[27] = "Then came to [him] certain of the Sadducees, which deny that there is any resurrection; and they asked him,";
kjv[28] = "Saying, Master, Moses wrote unto us, If any man\'s brother die, having a wife, and he die without children, that his brother should take his wife, and raise up seed unto his brother.";
kjv[29] = "There were therefore seven brethren: and the first took a wife, and died without children.";
kjv[30] = "And the second took her to wife, and he died childless.";
kjv[31] = "And the third took her; and in like manner the seven also: and they left no children, and died.";
kjv[32] = "Last of all the woman died also.";
kjv[33] = "Therefore in the resurrection whose wife of them is she? for seven had her to wife.";
kjv[34] = "And Jesus answering said unto them, The children of this world marry, and are given in marriage:";
kjv[35] = "But they which shall be accounted worthy to obtain that world, and the resurrection from the dead, neither marry, nor are given in marriage:";
kjv[36] = "Neither can they die any more: for they are equal unto the angels; and are the children of God, being the children of the resurrection.";
kjv[37] = "Now that the dead are raised, even Moses shewed at the bush, when he calleth the Lord the God of Abraham, and the God of Isaac, and the God of Jacob.";
kjv[38] = "For he is not a God of the dead, but of the living: for all live unto him.";
kjv[39] = "Then certain of the scribes answering said, Master, thou hast well said.";
kjv[40] = "And after that they durst not ask him any [question at all].";
kjv[41] = "And he said unto them, How say they that Christ is David\'s son?";
kjv[42] = "And David himself saith in the book of Psalms, The LORD said unto my Lord, Sit thou on my right hand,";
kjv[43] = "Till I make thine enemies thy footstool.";
kjv[44] = "David therefore calleth him Lord, how is he then his son?";
kjv[45] = "Then in the audience of all the people he said unto his disciples,";
kjv[46] = "Beware of the scribes, which desire to walk in long robes, and love greetings in the markets, and the highest seats in the synagogues, and the chief rooms at feasts;";
kjv[47] = "Which devour widows\' houses, and for a shew make long prayers: the same shall receive greater damnation.";

asv[18] = "Every one that falleth on that stone shall be broken to pieces; but on whomsoever it shall fall, it will scatter him as dust.";
yng[18] = "every one who hath fallen on that stone shall be broken, and on whom it may fall, it will crush him to pieces.\'";
dby[18] = "Every one falling on this stone shall be broken, but on whomsoever it shall fall, it shall grind him to powder.";
web[18] = "Whoever shall fall upon that stone, shall be broken: but on whomsoever it shall fall, it will grind him to powder.";
hnv[18] = "&quot;Everyone who falls on that stone will be broken to pieces, But it will crush whomever it falls on to dust.&quot;";
vul[18] = "omnis qui ceciderit supra illum lapidem conquassabitur supra quem autem ceciderit comminuet illum";
rsv[19] = "The scribes and the chief priests tried to lay hands on him at that very hour, but they feared the people; for they perceived that he had told this parable against them.";
asv[19] = "And the scribes and the chief priests sought to lay hands on him in that very hour; and they feared the people: for they perceived that he spake this parable against them.";
yng[19] = "And the chief priests and the scribes sought to lay hands on him in that hour, and they feared the people, for they knew that against them he spake this simile.";
dby[19] = "And the chief priests and the scribes sought the same hour to lay hands on him, and they feared the people; for they knew that he had spoken this parable of them.";
web[19] = "And the chief priests and the scribes the same hour sought to lay hands on him; and they feared the people: for they perceived that he had spoken this parable against them.";
hnv[19] = "The chief Kohanim and the Sofrim sought to lay hands on Him that very hour, but they feared the people -- for they knew He had spoken this parable against them.";
vul[19] = "et quaerebant principes sacerdotum et scribae mittere in illum manus illa hora et timuerunt populum cognoverunt enim quod ad ipsos dixerit similitudinem istam";
rsv[20] = "So they watched him, and sent spies, who pretended to be sincere, that they might take hold of what he said, so as to deliver him up to the authority and jurisdiction of the governor.";
asv[20] = "And they watched him, and sent forth spies, who feigned themselves to be righteous, that they might take hold of his speech, so as to deliver him up to the rule and to the authority of the governor.";
yng[20] = "And, having watched [him], they sent forth liers in wait, feigning themselves to be righteous, that they might take hold of his word, to deliver him up to the rule and to the authority of the governor,";
dby[20] = "And having watched [him], they sent out suborned persons, pretending to be just men, that they might take hold of him in [his] language, so that they might deliver him up to the power and authority of the governor.";
web[20] = "And they watched [him], and sent forth spies, who should feign themselves just men, that they might take hold of his words, that so they might deliver him to the power and authority of the governor.";
hnv[20] = "They watched him, and sent out spies, who pretended to be righteous, that they might trap him in something he said, so as to deliver him up to the power and authority of the governor.";
vul[20] = "et observantes miserunt insidiatores qui se iustos simularent ut caperent eum in sermone et traderent illum principatui et potestati praesidis";
rsv[21] = "They asked him, &quot;Teacher, we know that you speak and teach rightly, and show no partiality, but truly teach the way of God.";
asv[21] = "And they asked him, saying, Teacher, we know that thou sayest and teachest rightly, and acceptest not the person [of any], but of a truth teachest the way of God:";
yng[21] = "and they questioned him, saying, `Teacher, we have known that thou dost say and teach rightly, and dost not accept a person, but in truth the way of God dost teach;";
dby[21] = "And they asked him saying, Teacher, we know that thou sayest and teachest rightly, and acceptest no [man\'s] person, but teachest with truth the way of God:";
web[21] = "And they asked him, saying, Master, we know that thou sayest and teachest rightly, neither acceptest thou the person [of any], but teachest the way of God truly:";
hnv[21] = "They asked him, &quot;Teacher, we know that you say and teach what is right, and aren\'t partial to anyone, but truly teach the way of God.";
vul[21] = "et interrogaverunt illum dicentes magister scimus quia recte dicis et doces et non accipis personam sed in veritate viam Dei doces";
rsv[22] = "Is it lawful for us to give tribute to Caesar, or not?&quot;";
asv[22] = "Is it lawful for us to give tribute unto Caesar, or not?";
yng[22] = "Is it lawful to us to give tribute to Caesar or not?\'";
dby[22] = "Is it lawful for us to give tribute to Caesar, or not?";
web[22] = "Is it lawful for us to give tribute to Cesar, or not?";
hnv[22] = "Is it lawful for us to pay taxes to Caesar, or not?&quot;";
vul[22] = "licet nobis dare tributum Caesari an non";
rsv[23] = "But he perceived their craftiness, and said to them,";
asv[23] = "But he perceived their craftiness, and said unto them,";
yng[23] = "And he, having perceived their craftiness, said unto them, `Why me do ye tempt?";
dby[23] = "But perceiving their deceit he said to them, Why do ye tempt me?";
web[23] = "But he perceived their craftiness, and said to them, Why tempt ye me?";
hnv[23] = "But he perceived their craftiness, and said to them, &quot;Why do you test me?";
vul[23] = "considerans autem dolum illorum dixit ad eos quid me temptatis";
rsv[24] = "&quot;Show me a coin. Whose likeness and inscription has it?&quot; They said, &quot;Caesar\'s.&quot;";
asv[24] = "Show me a denarius. Whose image and superscription hath it? And they said, Caesar\'s.";
yng[24] = "shew me a denary; of whom hath it an image and superscription?\' and they answering said, `Of Caesar:\'";
dby[24] = "Shew me a denarius. Whose image and superscription has it? And answering they said, Caesar\'s.";
web[24] = "Show me a penny. Whose image and superscription hath it? They answered and said, Cesar\'s.";
hnv[24] = "Show me a denarius. Whose image and inscription are on it?&quot; They answered, &quot;Caesar\'s.&quot;";
vul[24] = "ostendite mihi denarium cuius habet imaginem et inscriptionem respondentes dixerunt Caesaris";
rsv[25] = "He said to them, &quot;Then render to Caesar the things that are Caesar\'s, and to God the things that are God\'s.&quot;";
asv[25] = "And he said unto them, Then render unto Caesar the things that are Caesar\'s, and unto God the things that are God\'s.";
yng[25] = "and he said to them, `Give back, therefore, the things of Caesar to Caesar, and the things of God to God;\'";
dby[25] = "And he said to them, Pay therefore what is Caesar\'s to Caesar, and what is God\'s to God.";
web[25] = "And he said to them, Render therefore to Cesar the things which are Cesar\'s, and to God the things which are God\'s.";
hnv[25] = "He said to them, &quot;Then give to Caesar the things that are Caesar\'s, and to God the things that are God\'s.&quot;";
vul[25] = "et ait illis reddite ergo quae Caesaris sunt Caesari et quae Dei sunt Deo";
rsv[26] = "And they were not able in the presence of the people to catch him by what he said; but marveling at his answer they were silent.";
asv[26] = "And they were not able to take hold of the saying before the people: and they marvelled at his answer, and held their peace.";
yng[26] = "and they were not able to take hold on his saying before the people, and having wondered at his answer, they were silent.";
dby[26] = "And they were not able to take hold of him in [his] expressions before the people, and, wondering at his answer, they were silent.";
web[26] = "And they could not take hold of his words before the people: and they marveled at his answer, and held their peace.";
hnv[26] = "They weren\'t able to trap him in his words before the people. They marveled at his answer, and were silent.";
vul[26] = "et non potuerunt verbum eius reprehendere coram plebe et mirati in responso eius tacuerunt";
rsv[27] = "There came to him some Sadducees, those who say that there is no resurrection,";
asv[27] = "And there came to him certain of the Sadducees, they that say that there is no resurrection;";
yng[27] = "And certain of the Sadducees, who are denying that there is a rising again, having come near, questioned him,";
dby[27] = "And some of the Sadducees, who deny that there is any resurrection, coming up [to him],";
web[27] = "Then came to [him] certain of the Sadducees (who deny that there is any resurrection) and they asked him,";
hnv[27] = "Some of the Tzedukim came to him, those who deny that there is a resurrection.";
vul[27] = "accesserunt autem quidam Sadducaeorum qui negant esse resurrectionem et interrogaverunt eum";
rsv[28] = "and they asked him a question, saying, &quot;Teacher, Moses wrote for us that if a man\'s brother dies, having a wife but no children, the man must take the wife and raise up children for his brother.";
asv[28] = "and they asked him, saying, Teacher, Moses wrote unto us, that if a man\'s brother die, having a wife, and he be childless, his brother should take the wife, and raise up seed unto his brother.";
yng[28] = "saying, `Teacher, Moses wrote to us, If any one\'s brother may die, having a wife, and he may die childless -- that his brother may take the wife, and may raise up seed to his brother.";
dby[28] = "demanded of him saying, Teacher, Moses wrote to us, If any one\'s brother, who has a wife, die, and he die childless, his brother shall take the wife and raise up seed to his brother.";
web[28] = "Saying, Master, Moses wrote to us, If any man\'s brother should die, having a wife, and he should die without children, that his brother should take his wife, and raise up seed to his brother.";
hnv[28] = "They asked him, &quot;Teacher, Moshe wrote to us that if a man\'s brother dies having a wife, and he is childless, his brother should take the wife, and raise up children for his brother.";
vul[28] = "dicentes magister Moses scripsit nobis si frater alicuius mortuus fuerit habens uxorem et hic sine filiis fuerit ut accipiat eam frater eius uxorem et suscitet semen fratri suo";
rsv[29] = "Now there were seven brothers; the first took a wife, and died without children;";
asv[29] = "There were therefore seven brethren: and the first took a wife, and died childless;";
yng[29] = "`There were, then, seven brothers, and the first having taken a wife, died childless,";
dby[29] = "There were then seven brethren: and the first, having taken a wife, died childless;";
web[29] = "There were therefore seven brothers: and the first took a wife, and died without children.";
hnv[29] = "There were therefore seven brothers. The first took a wife, and died childless.";
vul[29] = "septem ergo fratres erant et primus accepit uxorem et mortuus est sine filiis";
rsv[30] = "and the second";
asv[30] = "and the second:";
yng[30] = "and the second took the wife, and he died childless,";
dby[30] = "and the second [took the woman, and *he* died childless];";
web[30] = "And the second took her for a wife, and he died childless.";
hnv[30] = "The second took her as wife, and he died childless.";
vul[30] = "et sequens accepit illam et ipse mortuus est sine filio";
rsv[31] = "and the third took her, and likewise all seven left no children and died.";
asv[31] = "and the third took her; and likewise the seven also left no children, and died.";
yng[31] = "and the third took her, and in like manner also the seven -- they left not children, and they died;";
dby[31] = "and the third took her: and in like manner also the seven left no children and died;";
web[31] = "And the third took her; and in like manner the seven also: And they left no children, and died.";
hnv[31] = "The third took her, and likewise the seven all left no children, and died.";
vul[31] = "et tertius accepit illam similiter et omnes septem et non reliquerunt semen et mortui sunt";
rsv[32] = "Afterward the woman also died.";
asv[32] = "Afterward the woman also died.";
yng[32] = "and last of all died also the woman:";
dby[32] = "and last of all the woman also died.";
web[32] = "Last of all the woman died also.";
hnv[32] = "Afterward the woman also died.";
vul[32] = "novissima omnium mortua est et mulier";
rsv[33] = "In the resurrection, therefore, whose wife will the woman be? For the seven had her as wife.&quot;";
asv[33] = "In the resurrection therefore whose wife of them shall she be? for the seven had her to wife.";
yng[33] = "in the rising again, then, of which of them doth she become wife? -- for the seven had her as wife.\'";
dby[33] = "In the resurrection therefore of which of them does she become wife, for the seven had her as wife?";
web[33] = "Therefore in the resurrection, whose wife of them is she? for seven had her to wife.";
hnv[33] = " Therefore in the resurrection whose wife of them will she be? For the seven had her as a wife.&quot;";
vul[33] = "in resurrectione ergo cuius eorum erit uxor siquidem septem habuerunt eam uxorem";
rsv[34] = "And Jesus said to them, &quot;The sons of this age marry and are given in marriage;";
asv[34] = "And Jesus said unto them, The sons of this world marry, and are given in marriage:";
yng[34] = "And Jesus answering said to them, `The sons of this age do marry and are given in marriage,";
dby[34] = "And Jesus said to them, The sons of this world marry and are given in marriage,";
web[34] = "And Jesus answering, said to them, The children of this world marry, and are given in marriage:";
hnv[34] = "Yeshua said to them, &quot;The sons of this age marry, and are given in marriage.";
vul[34] = "et ait illis Iesus filii saeculi huius nubunt et traduntur ad nuptias";
rsv[35] = "but those who are accounted worthy to attain to that age and to the resurrection from the dead neither marry nor are given in marriage,";
asv[35] = "but they that are accounted worthy to attain to that world, and the resurrection from the dead, neither marry, nor are given in marriage:";
yng[35] = "but those accounted worthy to obtain that age, and the rising again that is out of the dead, neither marry, nor are they given in marriage;";
dby[35] = "but they who are counted worthy to have part in that world, and the resurrection from among [the] dead, neither marry nor are given in marriage;";
web[35] = "But they who shall be accounted worthy to obtain that world, and the resurrection from the dead, neither marry, nor are given in marriage.";
hnv[35] = "But those who are considered worthy to attain to that age and the resurrection from the dead, neither marry, nor are given in marriage.";
vul[35] = "illi autem qui digni habebuntur saeculo illo et resurrectione ex mortuis neque nubunt neque ducunt uxores";
rsv[36] = "for they cannot die any more, because they are equal to angels and are sons of God, being sons of the resurrection.";
asv[36] = "for neither can they die any more: for they are equal unto the angels; and are sons of God, being sons of the resurrection.";
yng[36] = "for neither are they able to die any more -- for they are like messengers -- and they are sons of God, being sons of the rising again.";
dby[36] = "for neither can they die any more, for they are equal to angels, and are sons of God, being sons of the resurrection.";
web[36] = "Neither can they die any more: for they are equal to the angels; and are the children of God, being the children of the resurrection.";
hnv[36] = "For they can\'t die any more, for they are like the angels, and are sons of God, being sons of the resurrection.";
vul[36] = "neque enim ultra mori poterunt aequales enim angelis sunt et filii sunt Dei cum sint filii resurrectionis";
rsv[37] = "But that the dead are raised, even Moses showed, in the passage about the bush, where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.";
asv[37] = "But that the dead are raised, even Moses showed, in [the place concerning] the Bush, when he calleth the Lord the God of Abraham, and the God of Isaac, and the God of Jacob.";
yng[37] = "`And that the dead are raised, even Moses shewed at the Bush, since he doth call the Lord, the God of Abraham, and the God of Isaac, and the God of Jacob;";
dby[37] = "But that the dead rise, even Moses shewed in [the section of] the bush, when he called [the] Lord the God of Abraham and the God of Isaac and the God of Jacob;";
web[37] = "Now that the dead are raised, even Moses showed at the bush, when he calleth the Lord the God of Abraham, and the God of Isaac, and the God of Jacob.";
hnv[37] = "But that the dead are raised, even Moshe showed at the bush, when he called the Lord \'The God of Avraham, the God of Yitzchak, and the God of Ya`akov.\'";

asv[38] = "Now he is not the God of the dead, but of the living: for all live unto him.";
yng[38] = "and He is not a God of dead men, but of living, for all live to Him.\'";
dby[38] = "but he is not God of [the] dead but of [the] living; for all live for him.";
web[38] = "For he is not a God of the dead, but of the living: for all live to him.";
hnv[38] = "Now he is not the God of the dead, but of the living, for all are alive to him.&quot;";
vul[38] = "Deus autem non est mortuorum sed vivorum omnes enim vivunt ei";

yng[39] = "And certain of the scribes answering said, `Teacher, thou didst say well;\'";
dby[39] = "And some of the scribes answering said, Teacher, thou hast well spoken.";
web[39] = "Then certain of the scribes answering, said, Master, thou hast well said.";
hnv[39] = "Some of the Sofrim answered, &quot;Teacher, you speak well.&quot;";

asv[40] = "For they durst not any more ask him any question.";
yng[40] = "and no more durst they question him anything.";
dby[40] = "For they did not dare any more to ask him anything.";

hnv[40] = "They didn\'t dare to ask him any more questions.";

yng[41] = "And he said unto them, `How do they say the Christ to be son of David,";
dby[41] = "And he said to them, How do they say that the Christ is David\'s son,";
web[41] = "And he said to them, How say they that Christ is David\'s son?";
hnv[41] = "He said to them, &quot;Why do they say that the Messiah is David\'s son?";

dby[44] = "David therefore calls him Lord, and how is he his son?";

rsv[46] = "&quot;Beware of the scribes, who like to go about in long robes, and love salutations in the market places and the best seats in the synagogues and the places of honor at feasts,";
