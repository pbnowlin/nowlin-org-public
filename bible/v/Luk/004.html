csb[1] = "Then Jesus left the Jordan, full of the Holy Spirit, and was led by the Spirit in the wilderness";
csb[2] = "for forty days to be tempted by the devil. He ate nothing during those days, and when they were over, he was hungry.";
csb[3] = "The devil said to him, &quot;If you are the Son of God, tell this stone to become bread.&quot;";
csb[4] = "But Jesus answered him, &quot;It is written: Man must not live on bread alone.&quot;";
csb[5] = "So he took him up and showed him all the kingdoms of the world in a moment of time.";
csb[6] = "The devil said to him, &quot;I will give you their splendor and all this authority, because it has been given over to me, and I can give it to anyone I want.";
csb[7] = "&quot;If you, then, will worship me, all will be yours.&quot;";
csb[8] = "And Jesus answered him, &quot;It is written: Worship the Lord your God, and serve him only.&quot;";
csb[9] = "So he took him to Jerusalem, had him stand on the pinnacle of the temple, and said to him, &quot;If you are the Son of God, throw yourself down from here.";
csb[10] = "&quot;For it is written: He will give his angels orders concerning you, to protect you,";
csb[11] = "&quot;and they will support you with their hands, so that you will not strike your foot against a stone.&quot;";
csb[12] = "And Jesus answered him, &quot;It is said: Do not test the Lord your God.&quot;";
csb[13] = "After the devil had finished every temptation, he departed from him for a time.";
csb[14] = "Then Jesus returned to Galilee in the power of the Spirit, and news about him spread throughout the entire vicinity.";
csb[15] = "He was teaching in their synagogues, being praised by everyone.";
csb[16] = "He came to Nazareth, where he had been brought up. As usual, he entered the synagogue on the Sabbath day and stood up to read.";
csb[17] = "The scroll of the prophet Isaiah was given to him, and unrolling the scroll, he found the place where it was written:";
csb[18] = "The Spirit of the Lord is on me, because he has anointed me to preach good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to set free the oppressed,";
csb[19] = "to proclaim the year of the Lord\'s favor.";
csb[20] = "He then rolled up the scroll, gave it back to the attendant, and sat down. And the eyes of everyone in the synagogue were fixed on him.";
csb[21] = "He began by saying to them, &quot;Today as you listen, this Scripture has been fulfilled.&quot;";
csb[22] = "They were all speaking well of him and were amazed by the gracious words that came from his mouth; yet they said, &quot;Isn\'t this Joseph\'s son? &quot;";
csb[23] = "Then he said to them, &quot;No doubt you will quote this proverb to me: \'Doctor, heal yourself. What we\'ve heard that took place in Capernaum, do here in your hometown also.\' &quot;";
csb[24] = "He also said, &quot;Truly I tell you, no prophet is accepted in his hometown.";
csb[25] = "&quot;But I say to you, there were certainly many widows in Israel in Elijah\'s days, when the sky was shut up for three years and six months while a great famine came over all the land.";
csb[26] = "&quot;Yet Elijah was not sent to any of them except a widow at Zarephath in Sidon.";
csb[27] = "&quot;And in the prophet Elisha\'s time, there were many in Israel who had leprosy, and yet not one of them was cleansed except Naaman the Syrian.&quot;";
csb[28] = "When they heard this, everyone in the synagogue was enraged.";
csb[29] = "They got up, drove him out of town, and brought him to the edge of the hill that their town was built on, intending to hurl him over the cliff.";
csb[30] = "But he passed right through the crowd and went on his way.";
csb[31] = "Then he went down to Capernaum, a town in Galilee, and was teaching them on the Sabbath.";
csb[32] = "They were astonished at his teaching because his message had authority.";
csb[33] = "In the synagogue there was a man with an unclean demonic spirit who cried out with a loud voice,";
csb[34] = "&quot;Leave us alone! What do you have to do with us, Jesus of Nazareth? Have you come to destroy us? I know who you are -- the Holy One of God! &quot;";
csb[35] = "But Jesus rebuked him and said, &quot;Be silent and come out of him! &quot; And throwing him down before them, the demon came out of him without hurting him at all.";
csb[36] = "Amazement came over them all, and they were saying to one another, &quot;What is this message? For he commands the unclean spirits with authority and power, and they come out! &quot;";
csb[37] = "And news about him began to go out to every place in the vicinity.";
csb[38] = "After he left the synagogue, he entered Simon\'s house. Simon\'s mother-in-law was suffering from a high fever, and they asked him about her.";
csb[39] = "So he stood over her and rebuked the fever, and it left her. She got up immediately and began to serve them.";
csb[40] = "When the sun was setting, all those who had anyone sick with various diseases brought them to him. As he laid his hands on each one of them, he healed them.";
csb[41] = "Also, demons were coming out of many, shouting and saying, &quot;You are the Son of God! &quot; But he rebuked them and would not allow them to speak, because they knew he was the Christ.";
csb[42] = "When it was day, he went out and made his way to a deserted place. But the crowds were searching for him. They came to him and tried to keep him from leaving them.";
csb[43] = "But he said to them, &quot;It is necessary for me to proclaim the good news about the kingdom of God to the other towns also, because I was sent for this purpose.&quot;";
csb[44] = "And he was preaching in the synagogues of Judea.";
