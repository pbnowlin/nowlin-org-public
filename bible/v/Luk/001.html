csb[1] = "Many have undertaken to compile a narrative about the events that have been fulfilled among us,";
csb[2] = "just as the original eyewitnesses and servants of the word handed them down to us.";
csb[3] = "It also seemed good to me, since I have carefully investigated everything from the very first, to write to you in an orderly sequence, most honorable Theophilus,";
csb[4] = "so that you may know the certainty of the things about which you have been instructed.";
csb[5] = "In the days of King Herod of Judea, there was a priest of Abijah\'s division named Zechariah. His wife was from the daughters of Aaron, and her name was Elizabeth.";
csb[6] = "Both were righteous in God\'s sight, living without blame according to all the commands and requirements of the Lord.";
csb[7] = "But they had no children because Elizabeth could not conceive, and both of them were well along in years.";
csb[8] = "When his division was on duty and he was serving as priest before God,";
csb[9] = "it happened that he was chosen by lot, according to the custom of the priesthood, to enter the sanctuary of the Lord and burn incense.";
csb[10] = "At the hour of incense the whole assembly of the people was praying outside.";
csb[11] = "An angel of the Lord appeared to him, standing to the right of the altar of incense.";
csb[12] = "When Zechariah saw him, he was terrified and overcome with fear.";
csb[13] = "But the angel said to him: &quot;Do not be afraid, Zechariah, because your prayer has been heard. Your wife Elizabeth will bear you a son, and you will name him John.";
csb[14] = "&quot;There will be joy and delight for you, and many will rejoice at his birth.";
csb[15] = "&quot;For he will be great in the sight of the Lord and will never drink wine or beer. He will be filled with the Holy Spirit while still in his mother\'s womb.";
csb[16] = "&quot;He will turn many of the children of Israel to the Lord their God.";
csb[17] = "&quot;And he will go before him in the spirit and power of Elijah, to turn the hearts of fathers to their children, and the disobedient to the understanding of the righteous, to make ready for the Lord a prepared people.&quot;";
csb[18] = "&quot;How can I know this? &quot; Zechariah asked the angel. &quot;For I am an old man, and my wife is well along in years.&quot;";
csb[19] = "The angel answered him, &quot;I am Gabriel, who stands in the presence of God, and I was sent to speak to you and tell you this good news.";
csb[20] = "&quot;Now listen. You will become silent and unable to speak until the day these things take place, because you did not believe my words, which will be fulfilled in their proper time.&quot;";
csb[21] = "Meanwhile, the people were waiting for Zechariah, amazed that he stayed so long in the sanctuary.";
csb[22] = "When he did come out, he could not speak to them. Then they realized that he had seen a vision in the sanctuary. He was making signs to them and remained speechless.";
csb[23] = "When the days of his ministry were completed, he went back home.";
csb[24] = "After these days his wife Elizabeth conceived and kept herself in seclusion for five months. She said,";
csb[25] = "&quot;The Lord has done this for me. He has looked with favor in these days to take away my disgrace among the people.&quot;";
csb[26] = "In the sixth month, the angel Gabriel was sent by God to a town in Galilee called Nazareth,";
csb[27] = "to a virgin engaged to a man named Joseph, of the house of David. The virgin\'s name was Mary.";
csb[28] = "And the angel came to her and said, &quot;Greetings, favored woman! The Lord is with you.&quot;";
csb[29] = "But she was deeply troubled by this statement, wondering what kind of greeting this could be.";
csb[30] = "Then the angel told her: &quot;Do not be afraid, Mary, for you have found favor with God.";
csb[31] = "&quot;Now listen: You will conceive and give birth to a son, and you will name him Jesus.";
csb[32] = "&quot;He will be great and will be called the Son of the Most High, and the Lord God will give him the throne of his father David.";
csb[33] = "&quot;He will reign over the house of Jacob forever, and his kingdom will have no end.&quot;";
csb[34] = "Mary asked the angel, &quot;How can this be, since I have not had sexual relations with a man? &quot;";
csb[35] = "The angel replied to her: &quot;The Holy Spirit will come upon you, and the power of the Most High will overshadow you. Therefore, the holy one to be born will be called the Son of God.";
csb[36] = "&quot;And consider your relative Elizabeth -- even she has conceived a son in her old age, and this is the sixth month for her who was called childless.";
csb[37] = "&quot;For nothing will be impossible with God.&quot;";
csb[38] = "&quot;I am the Lord\'s servant,&quot; said Mary. &quot;May it be done to me according to your word.&quot; Then the angel left her.";
csb[39] = "In those days Mary set out and hurried to a town in the hill country of Judah";
csb[40] = "where she entered Zechariah\'s house and greeted Elizabeth.";
csb[41] = "When Elizabeth heard Mary\'s greeting, the baby leaped inside her, and Elizabeth was filled with the Holy Spirit.";
csb[42] = "Then she exclaimed with a loud cry: &quot;Blessed are you among women, and your child will be blessed!";
csb[43] = "&quot;How could this happen to me, that the mother of my Lord should come to me?";
csb[44] = "&quot;For you see, when the sound of your greeting reached my ears, the baby leaped for joy inside me.";
csb[45] = "&quot;Blessed is she who has believed that the Lord would fulfill what he has spoken to her! &quot;";
csb[46] = "And Mary said: My soul praises the greatness of the Lord,";
csb[47] = "and my spirit rejoices in God my Savior,";
csb[48] = "because he has looked with favor on the humble condition of his servant. Surely, from now on all generations will call me blessed,";
csb[49] = "because the Mighty One has done great things for me, and his name is holy.";
csb[50] = "His mercy is from generation to generation on those who fear him.";
csb[51] = "He has done a mighty deed with his arm; he has scattered the proud because of the thoughts of their hearts;";
csb[52] = "he has toppled the mighty from their thrones and exalted the lowly.";
csb[53] = "He has satisfied the hungry with good things and sent the rich away empty.";
csb[54] = "He has helped his servant Israel, remembering his mercy";
csb[55] = "to Abraham and his descendants forever, just as he spoke to our ancestors.";
csb[56] = "And Mary stayed with her about three months; then she returned to her home.";
csb[57] = "Now the time had come for Elizabeth to give birth, and she had a son.";
csb[58] = "Then her neighbors and relatives heard that the Lord had shown her his great mercy, and they rejoiced with her.";
csb[59] = "When they came to circumcise the child on the eighth day, they were going to name him Zechariah, after his father.";
csb[60] = "But his mother responded, &quot;No. He will be called John.&quot;";
csb[61] = "Then they said to her, &quot;None of your relatives has that name.&quot;";
csb[62] = "So they motioned to his father to find out what he wanted him to be called.";
csb[63] = "He asked for a writing tablet and wrote: &quot;His name is John.&quot; And they were all amazed.";
csb[64] = "Immediately his mouth was opened and his tongue set free, and he began to speak, praising God.";
csb[65] = "Fear came on all those who lived around them, and all these things were being talked about throughout the hill country of Judea.";
csb[66] = "All who heard about him took it to heart, saying, &quot;What then will this child become? &quot; For, indeed, the Lord\'s hand was with him.";
csb[67] = "Then his father Zechariah was filled with the Holy Spirit and prophesied:";
csb[68] = "Blessed is the Lord, the God of Israel, because he has visited and provided redemption for his people.";
csb[69] = "He has raised up a horn of salvation for us in the house of his servant David,";
csb[70] = "just as he spoke by the mouth of his holy prophets in ancient times;";
csb[71] = "salvation from our enemies and from the hand of those who hate us.";
csb[72] = "He has dealt mercifully with our fathers and remembered his holy covenant --";
csb[73] = "the oath that he swore to our father Abraham. He has given us the privilege,";
csb[74] = "since we have been rescued from the hand of our enemies, to serve him without fear";
csb[75] = "in holiness and righteousness in his presence all our days.";
csb[76] = "And you, child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways,";
csb[77] = "to give his people knowledge of salvation through the forgiveness of their sins.";
csb[78] = "Because of our God\'s merciful compassion, the dawn from on high will visit us";
csb[79] = "to shine on those who live in darkness and the shadow of death, to guide our feet into the way of peace.";
csb[80] = "The child grew up and became spiritually strong, and he was in the wilderness until the day of his public appearance to Israel.";
