csb[1] = "Now he told them a parable on the need for them to pray always and not give up.";
csb[2] = "&quot;There was a judge in a certain town who didn\'t fear God or respect people.";
csb[3] = "&quot;And a widow in that town kept coming to him, saying, \'Give me justice against my adversary.\'";
csb[4] = "&quot;For a while he was unwilling, but later he said to himself, \'Even though I don\'t fear God or respect people,";
csb[5] = "&quot;yet because this widow keeps pestering me, I will give her justice, so that she doesn\'t wear me out by her persistent coming.\' &quot;";
csb[6] = "Then the Lord said, &quot;Listen to what the unjust judge says.";
csb[7] = "&quot;Will not God grant justice to his elect who cry out to him day and night? Will he delay helping them?";
csb[8] = "&quot;I tell you that he will swiftly grant them justice. Nevertheless, when the Son of Man comes, will he find faith on earth? &quot;";
csb[9] = "He also told this parable to some who trusted in themselves that they were righteous and looked down on everyone else:";
csb[10] = "&quot;Two men went up to the temple to pray, one a Pharisee and the other a tax collector.";
csb[11] = "&quot;The Pharisee was standing and praying like this about himself: \'God, I thank you that I\'m not like other people&#x2009; -- greedy, unrighteous, adulterers, or even like this tax collector.";
csb[12] = "&quot;I fast twice a week; I give a tenth of everything I get.\'";
csb[13] = "&quot;But the tax collector, standing far off, would not even raise his eyes to heaven but kept striking his chest and saying, \'God, have mercy on me, a sinner! \'";
csb[14] = "&quot;I tell you, this one went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.&quot;";
csb[15] = "People were bringing infants to him so he might touch them, but when the disciples saw it, they rebuked them.";
csb[16] = "Jesus, however, invited them: &quot;Let the little children come to me, and don\'t stop them, because the kingdom of God belongs to such as these.";
csb[17] = "&quot;Truly I tell you, whoever does not receive the kingdom of God like a little child will never enter it.&quot;";
csb[18] = "A ruler asked him, &quot;Good teacher, what must I do to inherit eternal life? &quot;";
csb[19] = "&quot;Why do you call me good? &quot; Jesus asked him. &quot;No one is good except God alone.";
csb[20] = "&quot;You know the commandments: Do not commit adultery; do not murder; do not steal; do not bear false witness; honor your father and mother.&quot;";
csb[21] = "&quot;I have kept all these from my youth,&quot; he said.";
csb[22] = "When Jesus heard this, he told him, &quot;You still lack one thing: Sell all you have and distribute it to the poor, and you will have treasure in heaven. Then come, follow me.&quot;";
csb[23] = "After he heard this, he became extremely sad, because he was very rich.";
csb[24] = "Seeing that he became sad, Jesus said, &quot;How hard it is for those who have wealth to enter the kingdom of God!";
csb[25] = "&quot;For it is easier for a camel to go through the eye of a needle than for a rich person to enter the kingdom of God.&quot;";
csb[26] = "Those who heard this asked, &quot;Then who can be saved? &quot;";
csb[27] = "He replied, &quot;What is impossible with man is possible with God.&quot;";
csb[28] = "Then Peter said, &quot;Look, we have left what we had and followed you.&quot;";
csb[29] = "So he said to them, &quot;Truly I tell you, there is no one who has left a house, wife or brothers or sisters, parents or children because of the kingdom of God,";
csb[30] = "&quot;who will not receive many times more at this time, and eternal life in the age to come.&quot;";
csb[31] = "Then he took the Twelve aside and told them, &quot;See, we are going up to Jerusalem. Everything that is written through the prophets about the Son of Man will be accomplished.";
csb[32] = "&quot;For he will be handed over to the Gentiles, and he will be mocked, insulted, spit on;";
csb[33] = "&quot;and after they flog him, they will kill him, and he will rise on the third day.&quot;";
csb[34] = "They understood none of these things. The meaning of the saying was hidden from them, and they did not grasp what was said.";
csb[35] = "As he approached Jericho, a blind man was sitting by the road begging.";
csb[36] = "Hearing a crowd passing by, he inquired what was happening.";
csb[37] = "&quot;Jesus of Nazareth is passing by,&quot; they told him.";
csb[38] = "So he called out, &quot;Jesus, Son of David, have mercy on me! &quot;";
csb[39] = "Then those in front told him to keep quiet, but he kept crying out all the more, &quot;Son of David, have mercy on me! &quot;";
csb[40] = "Jesus stopped and commanded that he be brought to him. When he came closer, he asked him,";
csb[41] = "&quot;What do you want me to do for you? &quot; &quot;Lord,&quot; he said, &quot;I want to see.&quot;";
csb[42] = "&quot;Receive your sight.&quot; Jesus told him. &quot;Your faith has saved you.&quot;";
csb[43] = "Instantly he could see, and he began to follow him, glorifying God. All the people, when they saw it, gave praise to God.";
