csb[1] = "He was praying in a certain place, and when he finished, one of his disciples said to him, &quot;Lord, teach us to pray, just as John also taught his disciples.&quot;";
csb[2] = "He said to them, &quot;Whenever you pray, say, Father, your name be honored as holy. Your kingdom come.";
csb[3] = "&quot;Give us each day our daily bread.";
csb[4] = "&quot;And forgive us our sins, for we ourselves also forgive everyone in debt to us. And do not bring us into temptation.&quot;";
csb[5] = "He also said to them: &quot;Suppose one of you has a friend and goes to him at midnight and says to him, \'Friend, lend me three loaves of bread,";
csb[6] = "&quot;because a friend of mine on a journey has come to me, and I don\'t have anything to offer him.\'";
csb[7] = "&quot;Then he will answer from inside and say, \'Don\'t bother me! The door is already locked, and my children and I have gone to bed. I can\'t get up to give you anything.\'";
csb[8] = "&quot;I tell you, even though he won\'t get up and give him anything because he is his friend, yet because of his friend\'s shameless boldness, he will get up and give him as much as he needs.";
csb[9] = "&quot;So I say to you, ask, and it will be given to you. Seek, and you will find. Knock, and the door will be opened to you.";
csb[10] = "&quot;For everyone who asks receives, and the one who seeks finds, and to the one who knocks, the door will be opened.";
csb[11] = "&quot;What father among you, if his son asks for a fish, will give him a snake instead of a fish?";
csb[12] = "&quot;Or if he asks for an egg, will give him a scorpion?";
csb[13] = "&quot;If you then, who are evil, know how to give good gifts to your children, how much more will the heavenly Father give the Holy Spirit to those who ask him? &quot;";
csb[14] = "Now he was driving out a demon that was mute. When the demon came out, the man who had been mute spoke, and the crowds were amazed.";
csb[15] = "But some of them said, &quot;He drives out demons by Beelzebul, the ruler of the demons.&quot;";
csb[16] = "And others, as a test, were demanding of him a sign from heaven.";
csb[17] = "Knowing their thoughts, he told them, &quot;Every kingdom divided against itself is headed for destruction, and a house divided against itself falls.";
csb[18] = "&quot;If Satan also is divided against himself, how will his kingdom stand? For you say I drive out demons by Beelzebul.";
csb[19] = "&quot;And if I drive out demons by Beelzebul, by whom do your sons drive them out? For this reason they will be your judges.";
csb[20] = "&quot;If I drive out demons by the finger of God, then the kingdom of God has come upon you.";
csb[21] = "&quot;When a strong man, fully armed, guards his estate, his possessions are secure.";
csb[22] = "&quot;But when one stronger than he attacks and overpowers him, he takes from him all his weapons he trusted in, and divides up his plunder.";
csb[23] = "&quot;Anyone who is not with me is against me, and anyone who does not gather with me scatters.";
csb[24] = "&quot;When an unclean spirit comes out of a person, it roams through waterless places looking for rest, and not finding rest, it then says, \'I\'ll go back to my house that I came from.\'";
csb[25] = "&quot;Returning, it finds the house swept and put in order.";
csb[26] = "&quot;Then it goes and brings seven other spirits more evil than itself, and they enter and settle down there. As a result, that person\'s last condition is worse than the first.&quot;";
csb[27] = "As he was saying these things, a woman from the crowd raised her voice and said to him, &quot;Blessed is the womb that bore you and the one who nursed you! &quot;";
csb[28] = "He said, &quot;Rather, blessed are those who hear the word of God and keep it.&quot;";
csb[29] = "As the crowds were increasing, he began saying: &quot;This generation is an evil generation. It demands a sign, but no sign will be given to it except the sign of Jonah.";
csb[30] = "&quot;For just as Jonah became a sign to the people of Nineveh, so also the Son of Man will be to this generation.";
csb[31] = "&quot;The queen of the south will rise up at the judgment with the men of this generation and condemn them, because she came from the ends of the earth to hear the wisdom of Solomon, and look -- something greater than Solomon is here.";
csb[32] = "&quot;The men of Nineveh will stand up at the judgment with this generation and condemn it, because they repented at Jonah\'s preaching, and look -- something greater than Jonah is here.";
csb[33] = "&quot;No one lights a lamp and puts it in the cellar or under a basket, but on a lampstand, so that those who come in may see its light.";
csb[34] = "&quot;Your eye is the lamp of the body. When your eye is healthy, your whole body is also full of light. But when it is bad, your body is also full of darkness.";
csb[35] = "&quot;Take care, then, that the light in you is not darkness.";
csb[36] = "&quot;If, therefore, your whole body is full of light, with no part of it in darkness, it will be entirely illuminated, as when a lamp shines its light on you.&quot;";
csb[37] = "As he was speaking, a Pharisee asked him to dine with him. So he went in and reclined at the table.";
csb[38] = "When the Pharisee saw this, he was amazed that he did not first perform the ritual washing before dinner.";
csb[39] = "But the Lord said to him, &quot;Now you Pharisees clean the outside of the cup and dish, but inside you are full of greed and evil.";
csb[40] = "&quot;Fools! Didn\'t he who made the outside make the inside too?";
csb[41] = "&quot;But give from what is within to the poor, and then everything is clean for you.";
csb[42] = "&quot;But woe to you Pharisees! You give a tenth of mint, rue, and every kind of herb, and you bypass justice and love for God. These things you should have done without neglecting the others.";
csb[43] = "&quot;Woe to you Pharisees! You love the front seat in the synagogues and greetings in the marketplaces.";
csb[44] = "&quot;Woe to you! You are like unmarked graves; the people who walk over them don\'t know it.&quot;";
csb[45] = "One of the experts in the law answered him, &quot;Teacher, when you say these things you insult us too.&quot;";
csb[46] = "Then he said: &quot;Woe also to you experts in the law! You load people with burdens that are hard to carry, and yet you yourselves don\'t touch these burdens with one of your fingers.";
csb[47] = "&quot;Woe to you! You build tombs for the prophets, and your fathers killed them.";
csb[48] = "&quot;Therefore, you are witnesses that you approve the deeds of your fathers, for they killed them, and you build their monuments.";
csb[49] = "&quot;Because of this, the wisdom of God said, \'I will send them prophets and apostles, and some of them they will kill and persecute,\'";
csb[50] = "&quot;so that this generation may be held responsible for the blood of all the prophets shed since the foundation of the world --";
csb[51] = "&quot;from the blood of Abel to the blood of Zechariah, who perished between the altar and the sanctuary. &quot;Yes, I tell you, this generation will be held responsible.";
csb[52] = "&quot;Woe to you experts in the law! You have taken away the key to knowledge. You didn\'t go in yourselves, and you hindered those who were trying to go in.&quot;";
csb[53] = "When he left there, the scribes and the Pharisees began to oppose him fiercely and to cross-examine him about many things;";
csb[54] = "they were lying in wait for him to trap him in something he said.";

hnv[18] = "If Hasatan also is divided against himself, how will his kingdom stand? For you say that I cast out demons by Ba`al-Zibbul.";
vul[18] = "si autem et Satanas in se ipsum divisus est quomodo stabit regnum ipsius quia dicitis in Beelzebub eicere me daemonia";
kjv[19] = "And if I by Beelzebub cast out devils, by whom do your sons cast [them] out? therefore shall they be your judges.";
rsv[19] = "And if I cast out demons by Be-el\'zebul, by whom do your sons cast them out? Therefore they shall be your judges.";
asv[19] = "And if I by Beelzebub cast out demons, by whom do your sons cast them out? therefore shall they be your judges.";
yng[19] = "`But if I by Beelzeboul cast forth the demons -- your sons, by whom do they cast forth? because of this your judges they shall be;";
dby[19] = "But if *I* by Beelzebub cast out demons, your sons -- by whom do they cast [them] out? For this reason *they* shall be your judges.";
web[19] = "And if I by Beelzebub cast out demons, by whom do your sons cast [them] out? therefore shall they be your judges.";
hnv[19] = "But if I cast out demons by Ba`al-Zibbul, by whom do your sons cast them out? Therefore will they be your judges.";
vul[19] = "si autem ego in Beelzebub eicio daemonia filii vestri in quo eiciunt ideo ipsi iudices vestri erunt";
kjv[20] = "But if I with the finger of God cast out devils, no doubt the kingdom of God is come upon you.";
rsv[20] = "But if it is by the finger of God that I cast out demons, then the kingdom of God has come upon you.";
asv[20] = "But if I by the finger of God cast out demons, then is the kingdom of God come upon you.";
yng[20] = "but if by the finger of God I cast forth the demons, then come unawares upon you did the reign of God.";
dby[20] = "But if by the finger of God I cast out demons, then the kingdom of God is come upon you.";
web[20] = "But if I with the finger of God cast out demons, no doubt the kingdom of God is come upon you.";
hnv[20] = "But if I by the finger of God cast out demons, then the Kingdom of God has come to you.";
vul[20] = "porro si in digito Dei eicio daemonia profecto praevenit in vos regnum Dei";
kjv[21] = "When a strong man armed keepeth his palace, his goods are in peace:";
rsv[21] = "When a strong man, fully armed, guards his own palace, his goods are in peace;";
asv[21] = "When the strong [man] fully armed guardeth his own court, his goods are in peace:";
yng[21] = "`When the strong man armed may keep his hall, in peace are his goods;";
dby[21] = "When the strong [man] armed keeps his own house, his goods are in peace;";
web[21] = "When a strong man armed keepeth his palace, his goods are in peace:";
hnv[21] = "&quot;When the strong man, fully armed, guards his own dwelling, his goods are safe.";
vul[21] = "cum fortis armatus custodit atrium suum in pace sunt ea quae possidet";
kjv[22] = "But when a stronger than he shall come upon him, and overcome him, he taketh from him all his armour wherein he trusted, and divideth his spoils.";
rsv[22] = "but when one stronger than he assails him and overcomes him, he takes away his armor in which he trusted, and divides his spoil.";
asv[22] = "but when a stronger than he shall come upon him, and overcome him, he taketh from him his whole armor wherein he trusted, and divideth his spoils.";
yng[22] = "but when the stronger than he, having come upon [him], may overcome him, his whole-armour he doth take away in which he had trusted, and his spoils he distributeth;";
dby[22] = "but when the stronger than he coming upon [him] overcomes him, he takes away his panoply in which he trusted, and he will divide the spoil [he has taken] from him.";
web[22] = "But when a stronger than he shall come upon him, and overcome him, he taketh from him all his armor in which he trusted, and divideth his spoils.";
hnv[22] = "But when someone stronger attacks him and overcomes him, he takes from him his whole armor in which he trusted, and divides his spoils.";
vul[22] = "si autem fortior illo superveniens vicerit eum universa arma eius aufert in quibus confidebat et spolia eius distribuit";
kjv[23] = "He that is not with me is against me: and he that gathereth not with me scattereth.";
rsv[23] = "He who is not with me is against me, and he who does not gather with me scatters.";
asv[23] = "He that is not with me is against me; and he that gathereth not with me scattereth.";
yng[23] = "he who is not with me is against me, and he who is not gathering with me doth scatter.";
dby[23] = "He that is not with me is against me, and he that gathers not with me scatters.";
web[23] = "He that is not with me is against me: and he that gathereth not with me scattereth.";
hnv[23] = "&quot;He that is not with me is against me. He who doesn\'t gather with me scatters.";
vul[23] = "qui non est mecum adversum me est et qui non colligit mecum dispergit";
kjv[24] = "When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest; and finding none, he saith, I will return unto my house whence I came out.";
rsv[24] = "&quot;When the unclean spirit has gone out of a man, he passes through waterless places seeking rest; and finding none he says, \'I will return to my house from which I came.\'";
asv[24] = "The unclean spirit when he is gone out of the man, passeth through waterless places, seeking rest, and finding none, he saith, I will turn back unto my house whence I came out.";
yng[24] = "`When the unclean spirit may go forth from the man it walketh through waterless places seeking rest, and not finding, it saith, I will turn back to my house whence I came forth;";
dby[24] = "When the unclean spirit has gone out of the man, he goes through dry places seeking rest; and not finding [any] he says, I will return to my house whence I came out.";
web[24] = "When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest: and finding none, he saith, I will return to my house whence I came out.";
hnv[24] = "The unclean spirit, when he has gone out of the man, passes through dry places, seeking rest, and finding none, he says, \'I will turn back to my house from which I came out.\'";
vul[24] = "cum inmundus spiritus exierit de homine perambulat per loca inaquosa quaerens requiem et non inveniens dicit revertar in domum meam unde exivi";
kjv[25] = "And when he cometh, he findeth [it] swept and garnished.";
rsv[25] = "And when he comes he finds it swept and put in order.";
asv[25] = "And when he is come, he findeth it swept and garnished.";
yng[25] = "and having come, it findeth [it] swept and adorned;";
dby[25] = "And having come, he finds it swept and adorned.";
web[25] = "And when he cometh, he findeth [it] swept and garnished.";
hnv[25] = " When he returns, he finds it swept and put in order.";
vul[25] = "et cum venerit invenit scopis mundatam";
kjv[26] = "Then goeth he, and taketh [to him] seven other spirits more wicked than himself; and they enter in, and dwell there: and the last [state] of that man is worse than the first.";
rsv[26] = "Then he goes and brings seven other spirits more evil than himself, and they enter and dwell there; and the last state of that man becomes worse than the first.&quot;";
asv[26] = "Then goeth he, and taketh [to him] seven other spirits more evil than himself; and they enter in and dwell there: and the last state of that man becometh worse than the first.";
yng[26] = "then doth it go, and take to it seven other spirits more evil than itself, and having entered, they dwell there, and the last of that man becometh worst than the first.\'";
dby[26] = "Then he goes and takes seven other spirits worse than himself, and entering in, they dwell there; and the last condition of that man becomes worse than the first.";
web[26] = "Then he goeth and taketh [to him] seven other spirits more wicked than himself; and they enter in, and dwell there: and the last [state] of that man is worse than the first.";
hnv[26] = "Then he goes, and takes seven other spirits more evil than himself, and they enter in and dwell there. The last state of that man becomes worse than the first.&quot;";
vul[26] = "et tunc vadit et adsumit septem alios spiritus nequiores se et ingressi habitant ibi et sunt novissima hominis illius peiora prioribus";
kjv[27] = "And it came to pass, as he spake these things, a certain woman of the company lifted up her voice, and said unto him, Blessed [is] the womb that bare thee, and the paps which thou hast sucked.";
rsv[27] = "As he said this, a woman in the crowd raised her voice and said to him, &quot;Blessed is the womb that bore you, and the breasts that you sucked!&quot;";
asv[27] = "And it came to pass, as he said these things, a certain woman out of the multitude lifted up her voice, and said unto him, Blessed is the womb that bare thee, and the breasts which thou didst suck.";
yng[27] = "And it came to pass, in his saying these things, a certain woman having lifted up the voice out of the multitude, said to him, `Happy the womb that carried thee, and the paps that thou didst suck!\'";
dby[27] = "And it came to pass as he spake these things, a certain woman, lifting up her voice out of the crowd, said to him, Blessed is the womb that has borne thee, and the paps which thou hast sucked.";
web[27] = "And it came to pass, as he was speaking these things, a certain woman of the company lifted up her voice, and said to him, Blessed [is] the womb that bore thee, and the paps which nourished thee.";
hnv[27] = "It came to pass, as he said these things, a certain woman out of the multitude lifted up her voice, and said to him, &quot;Blessed is the womb that bore you, and the breasts which nursed you!&quot;";
vul[27] = "factum est autem cum haec diceret extollens vocem quaedam mulier de turba dixit illi beatus venter qui te portavit et ubera quae suxisti";
kjv[28] = "But he said, Yea rather, blessed [are] they that hear the word of God, and keep it.";
rsv[28] = "But he said, &quot;Blessed rather are those who hear the word of God and keep it!&quot;";
asv[28] = "But he said, Yea rather, blessed are they that hear the word of God, and keep it.";
yng[28] = "And he said, `Yea, rather, happy those hearing the word of God, and keeping [it]!\'";
dby[28] = "But *he* said, Yea rather, blessed are they who hear the word of God and keep [it].";
web[28] = "But he said, Yes, rather blessed [are] they that hear the word of God, and keep it.";
hnv[28] = "But he said, &quot;On the contrary, blessed are those who hear the word of God, and keep it.&quot;";
vul[28] = "at ille dixit quippini beati qui audiunt verbum Dei et custodiunt";
kjv[29] = "And when the people were gathered thick together, he began to say, This is an evil generation: they seek a sign; and there shall no sign be given it, but the sign of Jonas the prophet.";
rsv[29] = "When the crowds were increasing, he began to say, &quot;This generation is an evil generation; it seeks a sign, but no sign shall be given to it except the sign of Jonah.";
asv[29] = "And when the multitudes were gathering together unto him, he began to say, This generation is an evil generation: it seeketh after a sign; and there shall no sign be given to it but the sign of Jonah.";
yng[29] = "And the multitudes crowding together upon him, he began to say, `This generation is evil, a sign it doth seek after, and a sign shall not be given to it, except the sign of Jonah the prophet,";
dby[29] = "But as the crowds thronged together, he began to say, This generation is a wicked generation: it seeks a sign, and a sign shall not be given to it but the sign of Jonas.";
web[29] = "And when the people were assembled in crowds, he began to say, This is an evil generation: they seek a sign; and there shall no sign be given to it, but the sign of Jonah the prophet.";
hnv[29] = "When the multitudes were gathering together to him, he began to say, &quot;This is an evil generation. It seeks after a sign. No sign will be given to it but the sign of Yonah, the prophet.";
vul[29] = "turbis autem concurrentibus coepit dicere generatio haec generatio nequam est signum quaerit et signum non dabitur illi nisi signum Ionae";
kjv[30] = "For as Jonas was a sign unto the Ninevites, so shall also the Son of man be to this generation.";
rsv[30] = "For as Jonah became a sign to the men of Nin\'eveh, so will the Son of man be to this generation.";
asv[30] = "For even as Jonah became a sign unto the Ninevites, so shall also the Son of man be to this generation.";
yng[30] = "for as Jonah became a sign to the Ninevites, so also shall the Son of Man be to this generation.";
dby[30] = "For as Jonas was a sign to the Ninevites, thus shall also the Son of man be to this generation.";
web[30] = "For as Jonah was a sign to the Ninevites, so also shall the Son of man be to this generation.";
hnv[30] = "For even as Yonah became a sign to the Ninevites, so will also the Son of Man be to this generation.";
vul[30] = "nam sicut Ionas fuit signum Ninevitis ita erit et Filius hominis generationi isti";
kjv[31] = "The queen of the south shall rise up in the judgment with the men of this generation, and condemn them: for she came from the utmost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon [is] here.";
rsv[31] = "The queen of the South will arise at the judgment with the men of this generation and condemn them; for she came from the ends of the earth to hear the wisdom of Solomon, and behold, something greater than Solomon is here.";
asv[31] = "The queen of the south shall rise up in the judgment with the men of this generation, and shall condemn them: for she came from the ends of the earth to hear the wisdom of Solomon; and behold, a greater than Solomon is here.";
yng[31] = "`A queen of the south shall rise up in the judgment with the men of this generation, and shall condemn them, because she came from the ends of the earth to hear the wisdom of Solomon; and lo, greater than Solomon here!";
dby[31] = "A queen of the south shall rise up in the judgment with the men of this generation, and shall condemn them: for she came from the ends of the earth to hear the wisdom of Solomon; and behold, more than Solomon is here.";
web[31] = "The queen of the south shall rise up in the judgment with the men of this generation, and condemn them: for she came from the utmost parts of the earth, to hear the wisdom of Solomon; and behold, a greater than Solomon [is] here.";
hnv[31] = "The Queen of the South will rise up in the judgment with the men of this generation, and will condemn them: for she came from the ends of the eretz to hear the wisdom of Shlomo; and behold, one greater than Shlomo is here.";
vul[31] = "regina austri surget in iudicio cum viris generationis huius et condemnabit illos quia venit a finibus terrae audire sapientiam Salomonis et ecce plus Salomone hic";
kjv[32] = "The men of Nineve shall rise up in the judgment with this generation, and shall condemn it: for they repented at the preaching of Jonas; and, behold, a greater than Jonas [is] here.";
rsv[32] = "The men of Nin\'eveh will arise at the judgment with this generation and condemn it; for they repented at the preaching of Jonah, and behold, something greater than Jonah is here.";
asv[32] = "The men of Nineveh shall stand up in the judgment with this generation, and shall condemn it: for they repented at the preaching of Jonah; and behold, a greater than Jonah is here.";
yng[32] = "`Men of Nineveh shall stand up in the judgment with this generation, and shall condemn it, because they reformed at the proclamation of Jonah; and lo, greater than Jonah here!";
dby[32] = "Men of Nineveh shall stand up in the judgment with this generation, and shall condemn it: for they repented at the preaching of Jonas; and behold, more than Jonas is here.";
web[32] = "The men of Nineveh shall rise up in the judgment with this generation, and shall condemn it: for they repented at the preaching of Jonah; and behold, a greater than Jonah [is] here.";
hnv[32] = "The men of Nineveh will stand up in the judgment with this generation, and will condemn it: for they repented at the preaching of Yonah, and behold, one greater than Yonah is here.";
vul[32] = "viri ninevitae surgent in iudicio cum generatione hac et condemnabunt illam quia paenitentiam egerunt ad praedicationem Ionae et ecce plus Iona hic";
kjv[33] = "No man, when he hath lighted a candle, putteth [it] in a secret place, neither under a bushel, but on a candlestick, that they which come in may see the light.";
rsv[33] = "&quot;No one after lighting a lamp puts it in a cellar or under a bushel, but on a stand, that those who enter may see the light.";
asv[33] = "No man, when he hath lighted a lamp, putteth it in a cellar, neither under the bushel, but on the stand, that they which enter in may see the light.";
yng[33] = "`And no one having lighted a lamp, doth put [it] in a secret place, nor under the measure, but on the lamp-stand, that those coming in may behold the light.";
dby[33] = "But no one having lit a lamp sets it in secret, nor under the corn-measure, but on the lamp-stand, that they who enter in may see the light.";
web[33] = "No man when he hath lighted a candle, putteth [it] in a secret place, neither under a close vessel, but on a candlestick, that they who come in may see the light.";
hnv[33] = "&quot;No man, when he has lit a lamp, puts it in a cellar, nor under a basket, but on a stand, that those who enter in may see the light.";
vul[33] = "nemo lucernam accendit et in abscondito ponit neque sub modio sed supra candelabrum ut qui ingrediuntur lumen videant";
kjv[34] = "The light of the body is the eye: therefore when thine eye is single, thy whole body also is full of light; but when [thine eye] is evil, thy body also [is] full of darkness.";
rsv[34] = "Your eye is the lamp of your body; when your eye is sound, your whole body is full of light; but when it is not sound, your body is full of darkness.";
asv[34] = "The lamp of thy body is thine eye: when thine eye is single, thy whole body also is full of light; but when it is evil, thy body also is full of darkness.";
yng[34] = "`The lamp of the body is the eye, when then thine eye may be simple, thy whole body also is lightened; and when it may be evil, thy body also is darkened;";
dby[34] = "The lamp of the body is thine eye: when thine eye is simple, thy whole body also is light; but when it is wicked, thy body also is dark.";
web[34] = "The light of the body is the eye: therefore when thy eye is single, thy whole body also is full of light; but when [thy eye] is evil, thy body also [is] full of darkness.";
hnv[34] = "The lamp of the body is the eye. Therefore when your eye is good, your whole body is also full of light; but when it is evil, your body also is full of darkness.";
vul[34] = "lucerna corporis tui est oculus tuus si oculus tuus fuerit simplex totum corpus tuum lucidum erit si autem nequam fuerit etiam corpus tuum tenebrosum erit";
kjv[35] = "Take heed therefore that the light which is in thee be not darkness.";
rsv[35] = "Therefore be careful lest the light in you be darkness.";
asv[35] = "Look therefore whether the light that is in thee be not darkness.";
yng[35] = "take heed, then, lest the light that [is] in thee be darkness;";
dby[35] = "See therefore that the light which is in thee be not darkness.";
web[35] = "Take heed therefore, that the light which is in thee be not darkness.";
hnv[35] = "Therefore see whether the light that is in you isn\'t darkness.";
vul[35] = "vide ergo ne lumen quod in te est tenebrae sint";
kjv[36] = "If thy whole body therefore [be] full of light, having no part dark, the whole shall be full of light, as when the bright shining of a candle doth give thee light.";
rsv[36] = "If then your whole body is full of light, having no part dark, it will be wholly bright, as when a lamp with its rays gives you light.&quot;";
asv[36] = "If therefore thy whole body be full of light, having no part dark, it shall be wholly full of light, as when the lamp with its bright shining doth give thee light.";
yng[36] = "if then thy whole body is lightened, not having any part darkened, the whole shall be lightened, as when the lamp by the brightness may give thee light.\'";
dby[36] = "If therefore thy whole body [is] light, not having any part dark, it shall be all light as when the lamp lights thee with its brightness.";
web[36] = "If thy whole body therefore [be] full of light, having no part dark, the whole shall be full of light; as when the bright shining of a candle doth give thee light.";
hnv[36] = "If therefore your whole body is full of light, having no part dark, it will be wholly full of light, as when the lamp with its bright shining gives you light.&quot;";
vul[36] = "si ergo corpus tuum totum lucidum fuerit non habens aliquam partem tenebrarum erit lucidum totum et sicut lucerna fulgoris inluminabit te";
kjv[37] = "And as he spake, a certain Pharisee besought him to dine with him: and he went in, and sat down to meat.";
rsv[37] = "While he was speaking, a Pharisee asked him to dine with him; so he went in and sat at table.";
asv[37] = "Now as he spake, a Pharisee asketh him to dine with him: and he went in, and sat down to meat.";
yng[37] = "And in [his] speaking, a certain Pharisee was asking him that he might dine with him, and having gone in, he reclined (at meat),";
dby[37] = "But as he spoke, a certain Pharisee asked him that he would dine with him; and entering in he placed himself at table.";
web[37] = "And as he was speaking, a certain Pharisee besought him to dine with him: and he went in, and sat down to eat.";
hnv[37] = "Now as he spoke, a certain Parush asked him to dine with him. He went in, and sat at the table.";
vul[37] = "et cum loqueretur rogavit illum quidam Pharisaeus ut pranderet apud se et ingressus recubuit";
kjv[38] = "And when the Pharisee saw [it], he marvelled that he had not first washed before dinner.";
rsv[38] = "The Pharisee was astonished to see that he did not first wash before dinner.";
asv[38] = "And when the Pharisee saw it, he marvelled that he had not first bathed himself before dinner.";
yng[38] = "and the Pharisee having seen, did wonder that he did not first baptize himself before the dinner.";
dby[38] = "But the Pharisee seeing [it] wondered that he had not first washed before dinner.";
web[38] = "And when the Pharisee saw [it], he marveled that he had not first washed before dinner.";
hnv[38] = "When the Parush saw it, he marveled that he had not first washed himself before dinner.";
vul[38] = "Pharisaeus autem coepit intra se reputans dicere quare non baptizatus esset ante prandium";
kjv[39] = "And the Lord said unto him, Now do ye Pharisees make clean the outside of the cup and the platter; but your inward part is full of ravening and wickedness.";
rsv[39] = "And the Lord said to him, &quot;Now you Pharisees cleanse the outside of the cup and of the dish, but inside you are full of extortion and wickedness.";
asv[39] = "And the Lord said unto him, Now ye the Pharisees cleanse the outside of the cup and of the platter; but your inward part is full of extortion and wickedness.";
yng[39] = "And the Lord said unto him, `Now do ye, the Pharisees, the outside of the cup and of the plate make clean, but your inward part is full of rapine and wickedness;";
dby[39] = "But the Lord said to him, Now do ye Pharisees cleanse the outside of the cup and of the dish, but your inward [parts] are full of plunder and wickedness.";
web[39] = "And the Lord said to him, Now do ye Pharisees make clean the outside of the cup and the platter; but your inward part is full of ravening and wickedness.";
hnv[39] = " The Lord said to him, &quot;Now you Perushim cleanse the outside of the cup and of the platter, but your inward part is full of extortion and wickedness.";
vul[39] = "et ait Dominus ad illum nunc vos Pharisaei quod de foris est calicis et catini mundatis quod autem intus est vestrum plenum est rapina et iniquitate";
kjv[40] = "[Ye] fools, did not he that made that which is without make that which is within also?";
rsv[40] = "You fools! Did not he who made the outside make the inside also?";
asv[40] = "Ye foolish ones, did not he that made the outside make the inside also?";
yng[40] = "unthinking! did not He who made the outside also the inside make?";
dby[40] = "Fools, has not he who has made the outside made the inside also?";
web[40] = "[Ye] fools, did not he that made that which is without, make that which is within also?";
hnv[40] = "You foolish ones, didn\'t he who made the outside make the inside also?";
vul[40] = "stulti nonne qui fecit quod de foris est etiam id quod de intus est fecit";
kjv[41] = "But rather give alms of such things as ye have; and, behold, all things are clean unto you.";
rsv[41] = "But give for alms those things which are within; and behold, everything is clean for you.";
asv[41] = "But give for alms those things which are within; and behold, all things are clean unto you.";
yng[41] = "But what ye have give ye [as] alms, and, lo, all things are clean to you.";
dby[41] = "But rather give alms of what ye have, and behold, all things are clean to you.";
web[41] = "But rather give alms of such things as ye have; and behold, all things are clean to you.";
hnv[41] = "But give for gifts to the needy those things which are within, and behold, all things will be clean to you.";
vul[41] = "verumtamen quod superest date elemosynam et ecce omnia munda sunt vobis";
kjv[42] = "But woe unto you, Pharisees! for ye tithe mint and rue and all manner of herbs, and pass over judgment and the love of God: these ought ye to have done, and not to leave the other undone.";
rsv[42] = "&quot;But woe to you Pharisees! for you tithe mint and rue and every herb, and neglect justice and the love of God; these you ought to have done, without neglecting the others.";
asv[42] = "But woe unto you Pharisees! for ye tithe mint and rue and every herb, and pass over justice and the love of God: but these ought ye to have done, and not to leave the other undone.";
yng[42] = "`But wo to you, the Pharisees, because ye tithe the mint, and the rue, and every herb, and ye pass by the judgment, and the love of God; these things it behoveth to do, and those not to be neglecting.";
dby[42] = "But woe unto you, Pharisees, for ye pay tithes of mint and rue and every herb, and pass by the judgment and the love of God: these ye ought to have done, and not have left those aside.";
web[42] = "But woe to you, Pharisees! for ye tithe mint, and rue, and all manner of herbs, and pass over judgment and the love of God: these ought ye to have done, and not to leave the others undone.";
hnv[42] = "But woe to you Perushim! For you tithe mint and rue and every herb, but you bypass justice and the love of God. You ought to have done these, and not to have left the other undone.";
vul[42] = "sed vae vobis Pharisaeis quia decimatis mentam et rutam et omne holus et praeteritis iudicium et caritatem Dei haec autem oportuit facere et illa non omittere";

kjv[44] = "Woe unto you, scribes and Pharisees, hypocrites! for ye are as graves which appear not, and the men that walk over [them] are not aware [of them].";
rsv[44] = "Woe to you! for you are like graves which are not seen, and men walk over them without knowing it.&quot;";
asv[44] = "Woe unto you! for ye are as the tombs which appear not, and the men that walk over [them] know it not.";
yng[44] = "`Wo to you, scribes and Pharisees, hypocrites, because ye are as the unseen tombs, and the men walking above have not known.\'";
dby[44] = "Woe unto you, for ye are as the sepulchres which appear not, and the men walking over them do not know [it].";
web[44] = "Woe to you, scribes and Pharisees, hypocrites! for ye are as graves which appear not, and the men that walk over [them] are not aware [of them].";
hnv[44] = "Woe to you, Sofrim and Perushim, hypocrites! For you are like hidden graves, and the men who walk over them don\'t know it.&quot;";

kjv[46] = "And he said, Woe unto you also, [ye] lawyers! for ye lade men with burdens grievous to be borne, and ye yourselves touch not the burdens with one of your fingers.";

dby[46] = "And he said, To you also woe, doctors of the law, for ye lay upon men burdens heavy to bear, and yourselves do not touch the burdens with one of your fingers.";
