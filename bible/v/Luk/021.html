csb[1] = "He looked up and saw the rich dropping their offerings into the temple treasury.";
csb[2] = "He also saw a poor widow dropping in two tiny coins.";
csb[3] = "&quot;Truly I tell you,&quot; he said. &quot;This poor widow has put in more than all of them.";
csb[4] = "&quot;For all these people have put in gifts out of their surplus, but she out of her poverty has put in all she had to live on.&quot;";
csb[5] = "As some were talking about the temple, how it was adorned with beautiful stones and gifts dedicated to God, he said,";
csb[6] = "&quot;These things that you see -- the days will come when not one stone will be left on another that will not be thrown down.&quot;";
csb[7] = "&quot;Teacher,&quot; they asked him, &quot;so when will these things happen? And what will be the sign when these things are about to take place? &quot;";
csb[8] = "Then he said, &quot;Watch out that you are not deceived. For many will come in my name, saying, \'I am he,\' and, \'The time is near.\' Don\'t follow them.";
csb[9] = "&quot;When you hear of wars and rebellions, don\'t be alarmed. Indeed, it is necessary that these things take place first, but the end won\'t come right away.&quot;";
csb[10] = "Then he told them: &quot;Nation will be raised up against nation, and kingdom against kingdom.";
csb[11] = "&quot;There will be violent earthquakes, and famines and plagues in various places, and there will be terrifying sights and great signs from heaven.";
csb[12] = "&quot;But before all these things, they will lay their hands on you and persecute you. They will hand you over to the synagogues and prisons, and you will be brought before kings and governors because of my name.";
csb[13] = "&quot;This will give you an opportunity to bear witness.";
csb[14] = "&quot;Therefore make up your minds not to prepare your defense ahead of time,";
csb[15] = "&quot;for I will give you such words and a wisdom that none of your adversaries will be able to resist or contradict.";
csb[16] = "&quot;You will even be betrayed by parents, brothers, relatives, and friends. They will kill some of you.";
csb[17] = "&quot;You will be hated by everyone because of my name,";
csb[18] = "&quot;but not a hair of your head will be lost.";
csb[19] = "&quot;By your endurance, gain your lives.";
csb[20] = "&quot;When you see Jerusalem surrounded by armies, then recognize that its desolation has come near.";
csb[21] = "&quot;Then those in Judea must flee to the mountains. Those inside the city must leave it, and those who are in the country must not enter it,";
csb[22] = "&quot;because these are days of vengeance to fulfill all the things that are written.";
csb[23] = "&quot;Woe to pregnant women and nursing mothers in those days, for there will be great distress in the land and wrath against this people.";
csb[24] = "&quot;They will be killed by the sword and be led captive into all the nations, and Jerusalem will be trampled by the Gentiles until the times of the Gentiles are fulfilled.";
csb[25] = "&quot;Then there will be signs in the sun, moon, and stars; and there will be anguish on the earth among nations bewildered by the roaring of the sea and the waves.";
csb[26] = "&quot;People will faint from fear and expectation of the things that are coming on the world, because the powers of the heavens will be shaken.";
csb[27] = "&quot;Then they will see the Son of Man coming in a cloud with power and great glory.";
csb[28] = "&quot;But when these things begin to take place, stand up and lift up your heads, because your redemption is near.&quot;";
csb[29] = "Then he told them a parable: &quot;Look at the fig tree, and all the trees.";
csb[30] = "&quot;As soon as they put out leaves you can see for yourselves and recognize that summer is already near.";
csb[31] = "&quot;In the same way, when you see these things happening, recognize that the kingdom of God is near.";
csb[32] = "&quot;Truly I tell you, this generation will certainly not pass away until all things take place.";
csb[33] = "&quot;Heaven and earth will pass away, but my words will never pass away.";
csb[34] = "&quot;Be on your guard, so that your minds are not dulled from carousing, drunkenness, and worries of life, or that day will come on you unexpectedly";
csb[35] = "&quot;like a trap. For it will come on all who live on the face of the whole earth.";
csb[36] = "&quot;But be alert at all times, praying that you may have strength to escape all these things that are going to take place and to stand before the Son of Man.&quot;";
csb[37] = "During the day, he was teaching in the temple, but in the evening he would go out and spend the night on what is called the Mount of Olives.";
csb[38] = "Then all the people would come early in the morning to hear him in the temple.";
