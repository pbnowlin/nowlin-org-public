csb[1] = "On the first day of the week, very early in the morning, they came to the tomb, bringing the spices they had prepared.";
csb[2] = "They found the stone rolled away from the tomb.";
csb[3] = "They went in but did not find the body of the Lord Jesus.";
csb[4] = "While they were perplexed about this, suddenly two men stood by them in dazzling clothes.";
csb[5] = "So the women were terrified and bowed down to the ground. &quot;Why are you looking for the living among the dead? &quot; asked the men.";
csb[6] = "&quot;He is not here, but he has risen! Remember how he spoke to you when he was still in Galilee,";
csb[7] = "&quot;saying, \'It is necessary that the Son of Man be betrayed into the hands of sinful men, be crucified, and rise on the third day\'? &quot;";
csb[8] = "And they remembered his words.";
csb[9] = "Returning from the tomb, they reported all these things to the Eleven and to all the rest.";
csb[10] = "Mary Magdalene, Joanna, Mary the mother of James, and the other women with them were telling the apostles these things.";
csb[11] = "But these words seemed like nonsense to them, and they did not believe the women.";
csb[12] = "Peter, however, got up and ran to the tomb. When he stooped to look in, he saw only the linen cloths. So he went away, amazed at what had happened.";
csb[13] = "Now that same day two of them were on their way to a village called Emmaus, which was about seven miles from Jerusalem.";
csb[14] = "Together they were discussing everything that had taken place.";
csb[15] = "And while they were discussing and arguing, Jesus himself came near and began to walk along with them.";
csb[16] = "But they were prevented from recognizing him.";
csb[17] = "Then he asked them, &quot;What is this dispute that you\'re having with each other as you are walking? &quot; And they stopped walking and looked discouraged.";
csb[18] = "The one named Cleopas answered him, &quot;Are you the only visitor in Jerusalem who doesn\'t know the things that happened there in these days? &quot;";
csb[19] = "&quot;What things? &quot; he asked them. So they said to him, &quot;The things concerning Jesus of Nazareth, who was a prophet powerful in action and speech before God and all the people,";
csb[20] = "&quot;and how our chief priests and leaders handed him over to be sentenced to death, and they crucified him.";
csb[21] = "&quot;But we were hoping that he was the one who was about to redeem Israel. Besides all this, it\'s the third day since these things happened.";
csb[22] = "&quot;Moreover, some women from our group astounded us. They arrived early at the tomb,";
csb[23] = "&quot;and when they didn\'t find his body, they came and reported that they had seen a vision of angels who said he was alive.";
csb[24] = "&quot;Some of those who were with us went to the tomb and found it just as the women had said, but they didn\'t see him.&quot;";
csb[25] = "He said to them, &quot;How foolish and slow you are to believe all that the prophets have spoken!";
csb[26] = "&quot;Wasn\'t it necessary for the Messiah to suffer these things and enter into his glory? &quot;";
csb[27] = "Then beginning with Moses and all the Prophets, he interpreted for them the things concerning himself in all the Scriptures.";
csb[28] = "They came near the village where they were going, and he gave the impression that he was going farther.";
csb[29] = "But they urged him, &quot;Stay with us, because it\'s almost evening, and now the day is almost over.&quot; So he went in to stay with them.";
csb[30] = "It was as he reclined at the table with them that he took the bread, blessed and broke it, and gave it to them.";
csb[31] = "Then their eyes were opened, and they recognized him, but he disappeared from their sight.";
csb[32] = "They said to each other, &quot;Weren\'t our hearts burning within us while he was talking with us on the road and explaining the Scriptures to us? &quot;";
csb[33] = "That very hour they got up and returned to Jerusalem. They found the Eleven and those with them gathered together,";
csb[34] = "who said, &quot;The Lord has truly been raised and has appeared to Simon! &quot;";
csb[35] = "Then they began to describe what had happened on the road and how he was made known to them in the breaking of the bread.";
csb[36] = "As they were saying these things, he himself stood in their midst. He said to them, &quot;Peace to you! &quot;";
csb[37] = "But they were startled and terrified and thought they were seeing a ghost.";
csb[38] = "&quot;Why are you troubled? &quot; he asked them. &quot;And why do doubts arise in your hearts?";
csb[39] = "&quot;Look at my hands and my feet, that it is I myself! Touch me and see, because a ghost does not have flesh and bones as you can see I have.&quot;";
csb[40] = "Having said this, he showed them his hands and feet.";
csb[41] = "But while they still were amazed and in disbelief because of their joy, he asked them, &quot;Do you have anything here to eat? &quot;";
csb[42] = "So they gave him a piece of a broiled fish,";
csb[43] = "and he took it and ate in their presence.";
csb[44] = "He told them, &quot;These are my words that I spoke to you while I was still with you -- that everything written about me in the Law of Moses, the Prophets, and the Psalms must be fulfilled.&quot;";
csb[45] = "Then he opened their minds to understand the Scriptures.";
csb[46] = "He also said to them, &quot;This is what is written: The Messiah would suffer and rise from the dead the third day,";
csb[47] = "&quot;and repentance for forgiveness of sins would be proclaimed in his name to all the nations, beginning at Jerusalem.";
csb[48] = "&quot;You are witnesses of these things.";
csb[49] = "&quot;And look, I am sending you what my Father promised. As for you, stay in the city until you are empowered from on high.&quot;";
csb[50] = "Then he led them out to the vicinity of Bethany, and lifting up his hands he blessed them.";
csb[51] = "And while he was blessing them, he left them and was carried up into heaven.";
csb[52] = "After worshiping him, they returned to Jerusalem with great joy.";
csb[53] = "And they were continually in the temple praising God.";
