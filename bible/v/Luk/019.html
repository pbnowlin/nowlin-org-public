csb[1] = "He entered Jericho and was passing through.";
csb[2] = "There was a man named Zacchaeus who was a chief tax collector, and he was rich.";
csb[3] = "He was trying to see who Jesus was, but he was not able because of the crowd, since he was a short man.";
csb[4] = "So running ahead, he climbed up a sycamore tree to see Jesus, since he was about to pass that way.";
csb[5] = "When Jesus came to the place, he looked up and said to him, &quot;Zacchaeus, hurry and come down because today it is necessary for me to stay at your house.&quot;";
csb[6] = "So he quickly came down and welcomed him joyfully.";
csb[7] = "All who saw it began to complain, &quot;He\'s gone to stay with a sinful man.&quot;";
csb[8] = "But Zacchaeus stood there and said to the Lord, &quot;Look, I\'ll give half of my possessions to the poor, Lord. And if I have extorted anything from anyone, I\'ll pay back four times as much.&quot;";
csb[9] = "&quot;Today salvation has come to this house,&quot; Jesus told him, &quot;because he too is a son of Abraham.";
csb[10] = "&quot;For the Son of Man has come to seek and to save the lost.&quot;";
csb[11] = "As they were listening to this, he went on to tell a parable because he was near Jerusalem, and they thought the kingdom of God was going to appear right away.";
csb[12] = "Therefore he said: &quot;A nobleman traveled to a far country to receive for himself authority to be king and then to return.";
csb[13] = "&quot;He called ten of his servants, gave them ten minas, and told them, \'Engage in business until I come back.\'";
csb[14] = "&quot;But his subjects hated him and sent a delegation after him, saying, \'We don\'t want this man to rule over us.\'";
csb[15] = "&quot;At his return, having received the authority to be king, he summoned those servants he had given the money to, so that he could find out how much they had made in business.";
csb[16] = "&quot;The first came forward and said, \'Master, your mina has earned ten more minas.\'";
csb[17] = "&quot; \'Well done, good servant! \' he told him. \'Because you have been faithful in a very small matter, have authority over ten towns.\'";
csb[18] = "&quot;The second came and said, \'Master, your mina has made five minas.\'";
csb[19] = "&quot;So he said to him, \'You will be over five towns.\'";
csb[20] = "&quot;And another came and said, \'Master, here is your mina. I have kept it safe in a cloth";
csb[21] = "&quot;because I was afraid of you since you\'re a harsh man: you collect what you didn\'t deposit and reap what you didn\'t sow.\'";
csb[22] = "&quot;He told him, \'I will condemn you by what you have said, you evil servant! If you knew I was a harsh man, collecting what I didn\'t deposit and reaping what I didn\'t sow,";
csb[23] = "&quot;why, then, didn\'t you put my money in the bank? And when I returned, I would have collected it with interest.\'";
csb[24] = "&quot;So he said to those standing there, \'Take the mina away from him and give it to the one who has ten minas.\'";
csb[25] = "&quot;But they said to him, \'Master, he has ten minas.\'";
csb[26] = "&quot; \'I tell you, that to everyone who has, more will be given; and from the one who does not have, even what he does have will be taken away.";
csb[27] = "&quot;But bring here these enemies of mine, who did not want me to rule over them, and slaughter them in my presence.\' &quot;";
csb[28] = "When he had said these things, he went on ahead, going up to Jerusalem.";
csb[29] = "As he approached Bethphage and Bethany, at the place called the Mount of Olives, he sent two of the disciples";
csb[30] = "and said, &quot;Go into the village ahead of you. As you enter it, you will find a young donkey tied there, on which no one has ever sat. Untie it and bring it.";
csb[31] = "&quot;If anyone asks you, \'Why are you untying it? \' say this: \'The Lord needs it.\' &quot;";
csb[32] = "So those who were sent left and found it just as he had told them.";
csb[33] = "As they were untying the young donkey, its owners said to them, &quot;Why are you untying the donkey? &quot;";
csb[34] = "&quot;The Lord needs it,&quot; they said.";
csb[35] = "Then they brought it to Jesus, and after throwing their clothes on the donkey, they helped Jesus get on it.";
csb[36] = "As he was going along, they were spreading their clothes on the road.";
csb[37] = "Now he came near the path down the Mount of Olives, and the whole crowd of the disciples began to praise God joyfully with a loud voice for all the miracles they had seen:";
csb[38] = "Blessed is the King who comes in the name of the Lord. Peace in heaven and glory in the highest heaven!";
csb[39] = "Some of the Pharisees from the crowd told him, &quot;Teacher, rebuke your disciples.&quot;";
csb[40] = "He answered, &quot;I tell you, if they were to keep silent, the stones would cry out.&quot;";
csb[41] = "As he approached and saw the city, he wept for it,";
csb[42] = "saying, &quot;If you knew this day what would bring peace -- but now it is hidden from your eyes.";
csb[43] = "&quot;For the days will come on you when your enemies will build a barricade around you, surround you, and hem you in on every side.";
csb[44] = "&quot;They will crush you and your children among you to the ground, and they will not leave one stone on another in your midst, because you did not recognize the time when God visited you.&quot;";
csb[45] = "He went into the temple and began to throw out those who were selling,";
csb[46] = "and he said, &quot;It is written, my house will be a house of prayer, but you have made it a den of thieves! &quot;";
csb[47] = "Every day he was teaching in the temple. The chief priests, the scribes, and the leaders of the people were looking for a way to kill him,";
csb[48] = "but they could not find a way to do it, because all the people were captivated by what they heard.";
