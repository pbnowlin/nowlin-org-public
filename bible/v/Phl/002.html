csb[1] = "If then there is any encouragement in Christ, if any consolation of love, if any fellowship with the Spirit, if any affection and mercy,";
csb[2] = "make my joy complete by thinking the same way, having the same love, united in spirit, intent on one purpose.";

csb[4] = "Everyone should look out not only for his own interests, but also for the interests of others.";
csb[5] = "Adopt the same attitude as that of Christ Jesus,";
csb[6] = "who, existing in the form of God, did not consider equality with God as something to be exploited.";
csb[7] = "Instead he emptied himself by assuming the form of a servant, taking on the likeness of humanity. And when he had come as a man,";
csb[8] = "he humbled himself by becoming obedient to the point of death -- even to death on a cross.";
csb[9] = "For this reason God highly exalted him and gave him the name that is above every name,";
csb[10] = "so that at the name of Jesus every knee will bow -- in heaven and on earth and under the earth --";
csb[11] = "and every tongue will confess that Jesus Christ is Lord, to the glory of God the Father.";
csb[12] = "Therefore, my dear friends, just as you have always obeyed, so now, not only in my presence but even more in my absence, work out your own salvation with fear and trembling.";
csb[13] = "For it is God who is working in you both to will and to work according to his good purpose.";
csb[14] = "Do everything without grumbling and arguing,";
csb[15] = "so that you may be blameless and pure, children of God who are faultless in a crooked and perverted generation, among whom you shine like stars in the world,";
csb[16] = "by holding firm to the word of life. Then I can boast in the day of Christ that I didn\'t run or labor for nothing.";
csb[17] = "But even if I am poured out as a drink offering on the sacrificial service of your faith, I am glad and rejoice with all of you.";
csb[18] = "In the same way you should also be glad and rejoice with me.";
csb[19] = "Now I hope in the Lord Jesus to send Timothy to you soon so that I too may be encouraged by news about you.";
csb[20] = "For I have no one else like-minded who will genuinely care about your interests;";
csb[21] = "all seek their own interests, not those of Jesus Christ.";
csb[22] = "But you know his proven character, because he has served with me in the gospel ministry like a son with a father.";
csb[23] = "Therefore, I hope to send him as soon as I see how things go with me.";
csb[24] = "I am confident in the Lord that I myself will also come soon.";
csb[25] = "But I considered it necessary to send you Epaphroditus -- my brother, coworker, and fellow soldier, as well as your messenger and minister to my need --";
csb[26] = "since he has been longing for all of you and was distressed because you heard that he was sick.";
csb[27] = "Indeed, he was so sick that he nearly died. However, God had mercy on him, and not only on him but also on me, so that I would not have sorrow upon sorrow.";

csb[30] = "because he came close to death for the work of Christ, risking his life to make up what was lacking in your ministry to me.";

yng[26] = "seeing he was longing after you all, and in heaviness, because ye heard that he ailed,";
dby[26] = "since he had a longing desire after you all, and was distressed because ye had heard that he was sick;";
web[26] = "For he longed after you all, and was full of heaviness, because ye had heard that he was sick.";
hnv[26] = "since he longed for you all, and was very troubled, because you had heard that he was sick.";
vul[26] = "quoniam quidem omnes vos desiderabat et maestus erat propterea quod audieratis illum infirmatum";
kjv[27] = "For indeed he was sick nigh unto death: but God had mercy on him; and not on him only, but on me also, lest I should have sorrow upon sorrow.";
rsv[27] = "Indeed he was ill, near to death. But God had mercy on him, and not only on him but on me also, lest I should have sorrow upon sorrow.";
asv[27] = "for indeed he was sick nigh unto death: but God had mercy on him; and not on him only, but on me also, that I might not have sorrow upon sorrow.";
yng[27] = "for he also ailed nigh to death, but God did deal kindly with him, and not with him only, but also with me, that sorrow upon sorrow I might not have.";
dby[27] = "for he was also sick close to death, but God had mercy on him, and not indeed on him alone, but also on me, that I might not have sorrow upon sorrow.";
web[27] = "For indeed he was sick nigh to death: but God had mercy on him; and not on him only, but on me also, lest I should have sorrow upon sorrow.";
hnv[27] = "For indeed he was sick, nearly to death, but God had mercy on him; and not on him only, but on me also, that I might not have sorrow on sorrow.";
vul[27] = "nam et infirmatus est usque ad mortem sed Deus misertus est eius non solum autem eius verum etiam et mei ne tristitiam super tristitiam haberem";
kjv[28] = "I sent him therefore the more carefully, that, when ye see him again, ye may rejoice, and that I may be the less sorrowful.";
rsv[28] = "I am the more eager to send him, therefore, that you may rejoice at seeing him again, and that I may be less anxious.";
asv[28] = "I have sent him therefore the more diligently, that, when ye see him again, ye may rejoice, and that I may be the less sorrowful.";
yng[28] = "The more eagerly, therefore, I did send him, that having seen him again ye may rejoice, and I may be the less sorrowful;";
dby[28] = "I have sent him therefore the more diligently, that seeing him ye might again rejoice, and that *I* might be the less sorrowful.";
web[28] = "I sent him therefore the more speedily, that, when ye see him again, ye may rejoice, and that I may be the less sorrowful.";
hnv[28] = "I have sent him therefore the more diligently, that, when you see him again, you may rejoice, and that I may be the less sorrowful.";
vul[28] = "festinantius ergo misi illum ut viso eo iterum gaudeatis et ego sine tristitia sim";
kjv[29] = "Receive him therefore in the Lord with all gladness; and hold such in reputation:";
rsv[29] = "So receive him in the Lord with all joy; and honor such men,";
asv[29] = "Receive him therefore in the Lord with all joy; and hold such in honor:";
yng[29] = "receive him, therefore, in the Lord, with all joy, and hold such in honour,";
dby[29] = "Receive him therefore in [the] Lord with all joy, and hold such in honour;";
web[29] = "Receive him therefore in the Lord with all gladness; and hold such in reputation:";
hnv[29] = "Receive him therefore in the Lord with all joy, and hold such in honor,";
vul[29] = "excipite itaque illum cum omni gaudio in Domino et eiusmodi cum honore habetote";
kjv[30] = "Because for the work of Christ he was nigh unto death, not regarding his life, to supply your lack of service toward me.";
rsv[30] = "for he nearly died for the work of Christ, risking his life to complete your service to me.";
asv[30] = "because for the work of Christ he came nigh unto death, hazarding his life to supply that which was lacking in your service toward me.";
yng[30] = "because on account of the work of the Christ he drew near to death, having hazarded the life that he might fill up your deficiency of service unto me.";
dby[30] = "because for the sake of the work he drew near even to death, venturing his life that he might fill up what lacked in your ministration toward me.";
web[30] = "Because for the work of Christ he was nigh to death, not regarding his life, to supply the want of your service towards me.";
hnv[30] = " because for the work of Messiah he came near to death, risking his life to supply that which was lacking in your service toward me.";
vul[30] = "quoniam propter opus Christi usque ad mortem accessit tradens animam suam ut impleret id quod ex vobis deerat erga meum obsequium";
