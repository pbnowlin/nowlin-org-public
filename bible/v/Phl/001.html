csb[1] = "Paul and Timothy, servants of Christ Jesus: To all the saints in Christ Jesus who are in Philippi, including the overseers and deacons.";
csb[2] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
csb[3] = "I give thanks to my God for every remembrance of you,";
csb[4] = "always praying with joy for all of you in my every prayer,";
csb[5] = "because of your partnership in the gospel from the first day until now.";
csb[6] = "I am sure of this, that he who started a good work in you will carry it on to completion until the day of Christ Jesus.";
csb[7] = "Indeed, it is right for me to think this way about all of you, because I have you in my heart, and you are all partners with me in grace, both in my imprisonment and in the defense and confirmation of the gospel.";
csb[8] = "For God is my witness, how deeply I miss all of you with the affection of Christ Jesus.";
csb[9] = "And I pray this: that your love will keep on growing in knowledge and every kind of discernment,";
csb[10] = "so that you may approve the things that are superior and may be pure and blameless in the day of Christ,";
csb[11] = "filled with the fruit of righteousness that comes through Jesus Christ to the glory and praise of God.";
csb[12] = "Now I want you to know, brothers and sisters, that what has happened to me has actually advanced the gospel,";
csb[13] = "so that it has become known throughout the whole imperial guard, and to everyone else, that my imprisonment is because I am in Christ.";
csb[14] = "Most of the brothers have gained confidence in the Lord from my imprisonment and dare even more to speak the word fearlessly.";
csb[15] = "To be sure, some preach Christ out of envy and rivalry, but others out of good will.";
csb[16] = "These preach out of love, knowing that I am appointed for the defense of the gospel;";
csb[17] = "the others proclaim Christ out of selfish ambition, not sincerely, thinking that they will cause me trouble in my imprisonment.";
csb[18] = "What does it matter? Only that in every way, whether from false motives or true, Christ is proclaimed, and in this I rejoice. Yes, and I will continue to rejoice";
csb[19] = "because I know this will lead to my salvation through your prayers and help from the Spirit of Jesus Christ.";
csb[20] = "My eager expectation and hope is that I will not be ashamed about anything, but that now as always, with all courage, Christ will be highly honored in my body, whether by life or by death.";
csb[21] = "For me, to live is Christ and to die is gain.";
csb[22] = "Now if I live on in the flesh, this means fruitful work for me; and I don\'t know which one I should choose.";
csb[23] = "I am torn between the two. I long to depart and be with Christ -- which is far better --";
csb[24] = "but to remain in the flesh is more necessary for your sake.";
csb[25] = "Since I am persuaded of this, I know that I will remain and continue with all of you for your progress and joy in the faith,";
csb[26] = "so that, because of my coming to you again, your boasting in Christ Jesus may abound.";
csb[27] = "Just one thing: As citizens of heaven, live your life worthy of the gospel of Christ. Then, whether I come and see you or am absent, I will hear about you that you are standing firm in one spirit, in one accord, contending together for the faith of the gospel,";
csb[28] = "not being frightened in any way by your opponents. This is a sign of destruction for them, but of your salvation -- and this is from God.";
csb[29] = "For it has been granted to you on Christ\'s behalf not only to believe in him, but also to suffer for him,";
csb[30] = "since you are engaged in the same struggle that you saw I had and now hear that I have.";

hnv[25] = "Having this confidence, I know that I will remain, yes, and remain with you all, for your progress and joy in the faith,";
vul[25] = "et hoc confidens scio quia manebo et permanebo omnibus vobis ad profectum vestrum et gaudium fidei";
kjv[26] = "That your rejoicing may be more abundant in Jesus Christ for me by my coming to you again.";
rsv[26] = "so that in me you may have ample cause to glory in Christ Jesus, because of my coming to you again.";
asv[26] = "that your glorying may abound in Christ Jesus in me through my presence with you again.";
yng[26] = "that your boasting may abound in Christ Jesus in me through my presence again to you.";
dby[26] = "that your boasting may abound in Christ Jesus through me by my presence again with you.";
web[26] = "That your rejoicing for me may be more abundant in Jesus Christ by my coming to you again.";
hnv[26] = "that your rejoicing may abound in Messiah Yeshua in me through my presence with you again.";
vul[26] = "ut gratulatio vestra abundet in Christo Iesu in me per meum adventum iterum ad vos";
kjv[27] = "Only let your conversation be as it becometh the gospel of Christ: that whether I come and see you, or else be absent, I may hear of your affairs, that ye stand fast in one spirit, with one mind striving together for the faith of the gospel;";
rsv[27] = "Only let your manner of life be worthy of the gospel of Christ, so that whether I come and see you or am absent, I may hear of you that you stand firm in one spirit, with one mind striving side by side for the faith of the gospel,";
asv[27] = "Only let your manner of life be worthy of the gospel of Christ: that, whether I come and see you or be absent, I may hear of your state, that ye stand fast in one spirit, with one soul striving for the faith of the gospel;";
yng[27] = "Only worthily of the good news of the Christ conduct ye yourselves, that, whether having come and seen you, whether being absent I may hear of the things concerning you, that ye stand fast in one spirit, with one soul, striving together for the faith of the good news,";
dby[27] = "Only conduct yourselves worthily of the glad tidings of the Christ, in order that whether coming and seeing you, or absent, I may hear of what concerns you, that ye stand firm in one spirit, with one soul, labouring together in the same conflict with the faith of the glad tidings;";
web[27] = "Only let your manner of life be as it becometh the gospel of Christ: that whether I come and see you, or else be absent, I may hear of your affairs, that ye stand fast in one spirit, with one mind striving together for the faith of the gospel;";
hnv[27] = "Only let your manner of life be worthy of the Good News of Messiah, that, whether I come and see you or am absent, I may hear of your state, that you stand firm in one spirit, with one soul striving for the faith of the Good News;";
vul[27] = "tantum digne evangelio Christi conversamini ut sive cum venero et videro vos sive absens audiam de vobis quia stetistis uno spiritu unianimes conlaborantes fide evangelii";
kjv[28] = "And in nothing terrified by your adversaries: which is to them an evident token of perdition, but to you of salvation, and that of God.";
rsv[28] = "and not frightened in anything by your opponents. This is a clear omen to them of their destruction, but of your salvation, and that from God.";
asv[28] = "and in nothing affrighted by the adversaries: which is for them an evident token of perdition, but of your salvation, and that from God;";
yng[28] = "and not terrified in anything by those opposing, which to them indeed is a token of destruction, and to you of salvation, and that from God;";
dby[28] = "and not frightened in anything by the opposers, which is to them a demonstration of destruction, but of your salvation, and that from God;";
web[28] = "And in nothing terrified by your adversaries: which is to them an evident token of perdition, but to you of salvation, and that from God.";
hnv[28] = "and in nothing frightened by the adversaries, which is for them a proof of destruction, but to you of salvation, and that from God.";
vul[28] = "et in nullo terreamini ab adversariis quae est illis causa perditionis vobis autem salutis et hoc a Deo";
kjv[29] = "For unto you it is given in the behalf of Christ, not only to believe on him, but also to suffer for his sake;";
rsv[29] = "For it has been granted to you that for the sake of Christ you should not only believe in him but also suffer for his sake,";
asv[29] = "because to you it hath been granted in the behalf of Christ, not only to believe on him, but also to suffer in his behalf:";
yng[29] = "because to you it was granted, on behalf of Christ, not only to believe in him, but also on behalf of him to suffer;";
dby[29] = "because to you has been given, as regards Christ, not only the believing on him but the suffering for him also,";
web[29] = "For to you it is given in the behalf of Christ, not only to believe on him, but also to suffer for his sake;";
hnv[29] = "Because it has been granted to you on behalf of Messiah, not only to believe in him, but also to suffer on his behalf,";
vul[29] = "quia vobis donatum est pro Christo non solum ut in eum credatis sed ut etiam pro illo patiamini";
kjv[30] = "Having the same conflict which ye saw in me, and now hear [to be] in me.";
rsv[30] = "engaged in the same conflict which you saw and now hear to be mine.";
asv[30] = "having the same conflict which ye saw in me, and now hear to be in me.";
yng[30] = "the same conflict having, such as ye saw in me, and now hear of in me.";
dby[30] = "having the same conflict which ye have seen in me, and now hear of in me.";
web[30] = "Having the same conflict which ye saw in me, [and] now hear [to be] in me.";
hnv[30] = "having the same conflict which you saw in me, and now hear is in me.";
vul[30] = "eundem certamen habentes qualem et vidistis in me et nunc audistis de me";
