csb[1] = "So then, my dearly loved and longed for brothers and sisters, my joy and crown, in this manner stand firm in the Lord, dear friends.";
csb[2] = "I urge Euodia and I urge Syntyche to agree in the Lord.";
csb[3] = "Yes, I also ask you, true partner, to help these women who have contended for the gospel at my side, along with Clement and the rest of my coworkers whose names are in the book of life.";
csb[4] = "Rejoice in the Lord always. I will say it again: Rejoice!";
csb[5] = "Let your graciousness be known to everyone. The Lord is near.";
csb[6] = "Don\'t worry about anything, but in everything, through prayer and petition with thanksgiving, present your requests to God.";
csb[7] = "And the peace of God, which surpasses all understanding, will guard your hearts and minds in Christ Jesus.";
csb[8] = "Finally brothers and sisters, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable -- if there is any moral excellence and if there is anything praiseworthy -- dwell on these things.";
csb[9] = "Do what you have learned and received and heard from me, and seen in me, and the God of peace will be with you.";
csb[10] = "I rejoiced in the Lord greatly because once again you renewed your care for me. You were, in fact, concerned about me but lacked the opportunity to show it.";
csb[11] = "I don\'t say this out of need, for I have learned to be content in whatever circumstances I find myself.";
csb[12] = "I know both how to make do with little, and I know how to make do with a lot. In any and all circumstances I have learned the secret of being content -- whether well fed or hungry, whether in abundance or in need.";
csb[13] = "I am able to do all things through him who strengthens me.";
csb[14] = "Still, you did well by partnering with me in my hardship.";
csb[15] = "And you Philippians know that in the early days of the gospel, when I left Macedonia, no church shared with me in the matter of giving and receiving except you alone.";
csb[16] = "For even in Thessalonica you sent gifts for my need several times.";
csb[17] = "Not that I seek the gift, but I seek the profit that is increasing to your account.";
csb[18] = "But I have received everything in full, and I have an abundance. I am fully supplied, having received from Epaphroditus what you provided -- a fragrant offering, an acceptable sacrifice, pleasing to God.";
csb[19] = "And my God will supply all your needs according to his riches in glory in Christ Jesus.";
csb[20] = "Now to our God and Father be glory forever and ever. Amen.";
csb[21] = "Greet every saint in Christ Jesus. The brothers who are with me send you greetings.";
csb[22] = "All the saints send you greetings, especially those who belong to Caesar\'s household.";
csb[23] = "The grace of the Lord Jesus Christ be with your spirit.";
kjv[1] = "Therefore, my brethren dearly beloved and longed for, my joy and crown, so stand fast in the Lord, [my] dearly beloved.";

yng[1] = "So then, my brethren, beloved and longed for, my joy and crown, so stand ye in the Lord, beloved.";
dby[1] = "So that, my brethren, beloved and longed for, my joy and crown, thus stand fast in [the] Lord, beloved.";

hnv[1] = "Therefore, my brothers, beloved and longed for, my joy and crown, so stand firm in the Lord, my beloved.";

vul[2] = "Euhodiam rogo et Syntychen deprecor id ipsum sapere in Domino";
kjv[3] = "And I intreat thee also, true yokefellow, help those women which laboured with me in the gospel, with Clement also, and [with] other my fellowlabourers, whose names [are] in the book of life.";
rsv[3] = "And I ask you also, true yokefellow, help these women, for they have labored side by side with me in the gospel together with Clement and the rest of my fellow workers, whose names are in the book of life.";
asv[3] = "Yea, I beseech thee also, true yokefellow, help these women, for they labored with me in the gospel, with Clement also, and the rest of my fellow-workers, whose names are in the book of life.";
yng[3] = "and I ask also thee, genuine yoke-fellow, be assisting those women who in the good news did strive along with me, with Clement also, and the others, my fellow-workers, whose names [are] in the book of life.";
dby[3] = "yea, I ask thee also, true yokefellow, assist them, who have contended along with me in the glad tidings, with Clement also, and my other fellow-labourers, whose names [are] in [the] book of life.";
web[3] = "And I entreat thee also, true yoke-fellow, help those women who labored with me in the gospel, with Clement also, and [with] other my fellow-laborers, whose names [are] in the book of life.";

dby[4] = "Rejoice in [the] Lord always: again I will say, Rejoice.";

hnv[4] = "Rejoice in the Lord always! Again I will say, Rejoice!";

rsv[6] = "Have no anxiety about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God.";

kjv[8] = "Finally, brethren, whatsoever things are true, whatsoever things [are] honest, whatsoever things [are] just, whatsoever things [are] pure, whatsoever things [are] lovely, whatsoever things [are] of good report; if [there be] any virtue, and if [there be] any praise, think on these things.";

asv[8] = "Finally, brethren, whatsoever things are true, whatsoever things are honorable, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things.";
yng[8] = "As to the rest, brethren, as many things as are true, as many as [are] grave, as many as [are] righteous, as many as [are] pure, as many as [are] lovely, as many as [are] of good report, if any worthiness, and if any praise, these things think upon;";
dby[8] = "For the rest, brethren, whatsoever things [are] true, whatsoever things [are] noble, whatsoever things [are] just, whatsoever things [are] pure, whatsoever things [are] amiable, whatsoever things [are] of good report; if [there be] any virtue and if any praise, think on these things.";

kjv[10] = "But I rejoiced in the Lord greatly, that now at the last your care of me hath flourished again; wherein ye were also careful, but ye lacked opportunity.";
rsv[10] = "I rejoice in the Lord greatly that now at length you have revived your concern for me; you were indeed concerned for me, but you had no opportunity.";

yng[10] = "And I rejoiced in the Lord greatly, that now at length ye flourished again in caring for me, for which also ye were caring, and lacked opportunity;";
dby[10] = "But I rejoiced in [the] Lord greatly, that now however at length ye have revived your thinking of me, though surely ye did also think [of me], but lacked opportunity.";
web[10] = "But I rejoiced in the Lord greatly, that now at the last your care of me hath flourished again; wherein ye were also careful, but ye lacked opportunity.";

kjv[11] = "Not that I speak in respect of want: for I have learned, in whatsoever state I am, [therewith] to be content.";
rsv[11] = "Not that I complain of want; for I have learned, in whatever state I am, to be content.";
asv[11] = "Not that I speak in respect of want: for I have learned, in whatsoever state I am, therein to be content.";
yng[11] = "not that in respect of want I say [it], for I did learn in the things in which I am -- to be content;";
dby[11] = "Not that I speak as regards privation, for as to me *I* have learnt in those circumstances in which I am, to be satisfied in myself.";
web[11] = "Not that I speak in respect of want: for I have learned, in whatever state I am, [with that] to be content.";
hnv[11] = "Not that I speak in respect to lack, for I have learned in whatever state I am, to be content in it.";
vul[11] = "non quasi propter penuriam dico ego enim didici in quibus sum sufficiens esse";
kjv[12] = "I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need.";
