csb[1] = "I am the man who has seen affliction under the rod of God\'s wrath.";
csb[2] = "He has driven me away and forced me to walk in darkness instead of light.";
csb[3] = "Yes, he repeatedly turns his hand against me all day long.";
csb[4] = "He has worn away my flesh and skin; he has broken my bones.";
csb[5] = "He has laid siege against me, encircling me with bitterness and hardship.";
csb[6] = "He has made me dwell in darkness like those who have been dead for ages.";
csb[7] = "He has walled me in so I cannot get out; he has weighed me down with chains.";
csb[8] = "Even when I cry out and plead for help, he blocks out my prayer.";
csb[9] = "He has walled in my ways with blocks of stone; he has made my paths crooked.";
csb[10] = "He is a bear waiting in ambush, a lion in hiding.";
csb[11] = "He forced me off my way and tore me to pieces; he left me desolate.";
csb[12] = "He strung his bow and set me as the target for his arrow.";
csb[13] = "He pierced my kidneys with shafts from his quiver.";
csb[14] = "I am a laughingstock to all my people, mocked by their songs all day long.";
csb[15] = "He filled me with bitterness, satiated me with wormwood.";
csb[16] = "He ground my teeth with gravel and made me cower in the dust.";
csb[17] = "I have been deprived of peace; I have forgotten what prosperity is.";
csb[18] = "Then I thought, &quot;My future is lost, as well as my hope from the LORD.&quot;";
csb[19] = "Remember my affliction and my homelessness, the wormwood and the poison.";
csb[20] = "I continually remember them and have become depressed.";
csb[21] = "Yet I call this to mind, and therefore I have hope:";
csb[22] = "Because of the LORD\'s faithful love we do not perish, for his mercies never end.";
csb[23] = "They are new every morning; great is your faithfulness!";
csb[24] = "I say, &quot;The LORD is my portion, therefore I will put my hope in him.&quot;";
csb[25] = "The LORD is good to those who wait for him, to the person who seeks him.";
csb[26] = "It is good to wait quietly for salvation from the LORD.";
csb[27] = "It is good for a man to bear the yoke while he is still young.";
csb[28] = "Let him sit alone and be silent, for God has disciplined him.";
csb[29] = "Let him put his mouth in the dust -- perhaps there is still hope.";
csb[30] = "Let him offer his cheek to the one who would strike him; let him be filled with disgrace.";
csb[31] = "For the Lord will not reject us forever.";
csb[32] = "Even if he causes suffering, he will show compassion according to the abundance of his faithful love.";
csb[33] = "For he does not enjoy bringing affliction or suffering on mankind.";
csb[34] = "Crushing all the prisoners of the land beneath one\'s feet,";
csb[35] = "denying justice to a man in the presence of the Most High,";
csb[36] = "or subverting a person in his lawsuit -- the Lord does not approve of these things.";
csb[37] = "Who is there who speaks and it happens, unless the Lord has ordained it?";
csb[38] = "Do not both adversity and good come from the mouth of the Most High?";
csb[39] = "Why should any living person complain, any man, because of the punishment for his sins?";
csb[40] = "Let us examine and probe our ways, and turn back to the LORD.";
csb[41] = "Let us lift up our hearts and our hands to God in heaven:";
csb[42] = "&quot;We have sinned and rebelled; you have not forgiven.";
csb[43] = "&quot;You have covered yourself in anger and pursued us; you have killed without compassion.";
csb[44] = "&quot;You have covered yourself with a cloud so that no prayer can get through.";
csb[45] = "&quot;You have made us disgusting filth among the peoples.";
csb[46] = "&quot;All our enemies open their mouths against us.";
csb[47] = "&quot;We have experienced panic and pitfall, devastation and destruction.&quot;";
csb[48] = "My eyes flow with streams of tears because of the destruction of my dear people.";
csb[49] = "My eyes overflow unceasingly, without end,";
csb[50] = "until the LORD looks down from heaven and sees.";
csb[51] = "My eyes bring me grief because of the fate of all the women in my city.";
csb[52] = "For no reason, my enemies hunted me like a bird.";
csb[53] = "They smothered my life in a pit and threw stones on me.";
csb[54] = "Water flooded over my head, and I thought, &quot;I\'m going to die! &quot;";
csb[55] = "I called on your name, LORD, from the depths of the pit.";
csb[56] = "You heard my plea: Do not ignore my cry for relief.";
csb[57] = "You came near whenever I called you; you said, &quot;Do not be afraid.&quot;";
csb[58] = "You championed my cause, Lord; you redeemed my life.";
csb[59] = "LORD, you saw the wrong done to me; judge my case.";
csb[60] = "You saw all their vengefulness, all their plots against me.";
csb[61] = "LORD, you heard their insults, all their plots against me.";
csb[62] = "The slander and murmuring of my opponents attack me all day long.";
csb[63] = "When they sit and when they rise, look, I am mocked by their songs.";
csb[64] = "You will pay them back what they deserve, LORD, according to the work of their hands.";
csb[65] = "You will give them a heart filled with anguish. May your curse be on them!";
csb[66] = "You will pursue them in anger and destroy them under your heavens.";
