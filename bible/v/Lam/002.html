csb[1] = "How the Lord has overshadowed Daughter Zion with his anger! He has thrown down Israel\'s glory from heaven to earth. He did not acknowledge his footstool in the day of his anger.";
csb[2] = "Without compassion the Lord has swallowed up all the dwellings of Jacob. In his wrath he has demolished the fortified cities of Daughter Judah. He brought them to the ground and defiled the kingdom and its leaders.";
csb[3] = "He has cut off every horn of Israel in his burning anger and withdrawn his right hand in the presence of the enemy. He has blazed against Jacob like a flaming fire that consumes everything.";
csb[4] = "He has strung his bow like an enemy; his right hand is positioned like an adversary. He has killed everyone who was the delight to the eye, pouring out his wrath like fire on the tent of Daughter Zion.";
csb[5] = "The Lord is like an enemy; he has swallowed up Israel. He swallowed up all its palaces and destroyed its fortified cities. He has multiplied mourning and lamentation within Daughter Judah.";
csb[6] = "He has wrecked his temple as if it were merely a shack in a field, destroying his place of meeting. The LORD has abolished appointed festivals and Sabbaths in Zion. He has despised king and priest in his fierce anger.";
csb[7] = "The Lord has rejected his altar, repudiated his sanctuary; he has handed the walls of her palaces over to the enemy. They have raised a shout in the house of the LORD as on the day of an appointed festival.";
csb[8] = "The LORD determined to destroy the wall of Daughter Zion. He stretched out a measuring line and did not restrain himself from destroying. He made the ramparts and walls grieve; together they waste away.";
csb[9] = "Zion\'s gates have fallen to the ground; he has destroyed and shattered the bars on her gates. Her king and her leaders live among the nations, instruction is no more, and even her prophets receive no vision from the LORD.";
csb[10] = "The elders of Daughter Zion sit on the ground in silence. They have thrown dust on their heads and put on sackcloth. The young women of Jerusalem have bowed their heads to the ground.";
csb[11] = "My eyes are worn out from weeping; I am churning within. My heart is poured out in grief because of the destruction of my dear people, because infants and nursing babies faint in the streets of the city.";
csb[12] = "They cry out to their mothers, &quot;Where is the grain and wine? &quot; as they faint like the wounded in the streets of the city, as their life pours out in the arms of their mothers.";
csb[13] = "What can I say on your behalf? What can I compare you to, Daughter Jerusalem? What can I liken you to, so that I may console you, Virgin Daughter Zion? For your ruin is as vast as the sea. Who can heal you?";
csb[14] = "Your prophets saw visions for you that were empty and deceptive; they did not reveal your iniquity and so restore your fortunes. They saw pronouncements for you that were empty and misleading.";
csb[15] = "All who pass by scornfully clap their hands at you. They hiss and shake their heads at Daughter Jerusalem: Is this the city that was called the perfection of beauty, the joy of the whole earth?";
csb[16] = "All your enemies open their mouths against you. They hiss and gnash their teeth, saying, &quot;We have swallowed her up. This is the day we have waited for! We have lived to see it.&quot;";
csb[17] = "The LORD has done what he planned; he has accomplished his decree, which he ordained in days of old. He has demolished without compassion, letting the enemy gloat over you and exalting the horn of your adversaries.";
csb[18] = "The hearts of the people cry out to the Lord. Wall of Daughter Zion, let your tears run down like a river day and night. Give yourself no relief and your eyes no rest.";
csb[19] = "Arise, cry out in the night from the first watch of the night. Pour out your heart like water before the Lord\'s presence. Lift up your hands to him for the lives of your children who are fainting from hunger at the head of every street.";
csb[20] = "LORD, look and consider to whom you have done this. Should women eat their own children, the infants they have nurtured? Should priests and prophets be killed in the Lord\'s sanctuary?";
csb[21] = "Both young and old are lying on the ground in the streets. My young women and young men have fallen by the sword. You have killed them in the day of your anger, slaughtering without compassion.";
csb[22] = "You summon those who terrorize me on every side, as if for an appointed festival day; on the day of the LORD\'s anger no one escaped or survived. My enemy has destroyed those I nurtured and reared.";
kjv[1] = "How hath the Lord covered the daughter of Zion with a cloud in his anger, [and] cast down from heaven unto the earth the beauty of Israel, and remembered not his footstool in the day of his anger!";
rsv[1] = "How the Lord in his anger has set the daughter of Zion under a cloud! He has cast down from heaven to earth the splendor of Israel; he has not remembered his footstool in the day of his anger.";
asv[1] = "How hath the Lord covered the daughter of Zion with a cloud in his anger! He hath cast down from heaven unto the earth the beauty of Israel, And hath not remembered his footstool in the day of his anger. ";
yng[1] = "How doth the Lord cloud in His anger the daughter of Zion, He hath cast from heaven [to] earth the beauty of Israel, And hath not remembered His footstool in the day of His anger.";
dby[1] = "How hath the Lord in his anger covered the daughter of Zion with a cloud! He hath cast down from the heavens unto the earth the beauty of Israel, and remembered not his footstool in the day of his anger.";
web[1] = "How hath the Lord covered the daughter of Zion with a cloud in his anger, [and] cast down from heaven to the earth the beauty of Israel, and remembered not his footstool in the day of his anger!";
hnv[1] = "How has the Lord covered the daughter of Tziyon with a cloud in his anger! He has cast down from heaven to the eretz the beauty of Yisra\'el, And hasn\'t remembered his footstool in the day of his anger.";
vul[1] = "ALEPH quomodo obtexit caligine in furore suo Dominus filiam Sion proiecit de caelo terram inclitam Israhel et non recordatus est scabilli pedum suorum in die furoris sui";
kjv[2] = "The Lord hath swallowed up all the habitations of Jacob, and hath not pitied: he hath thrown down in his wrath the strong holds of the daughter of Judah; he hath brought [them] down to the ground: he hath polluted the kingdom and the princes thereof.";
rsv[2] = "The Lord has destroyed without mercy all the habitations of Jacob; in his wrath he has broken down the strongholds of the daughter of Judah; he has brought down to the ground in dishonor the kingdom and its rulers.";
asv[2] = "The Lord hath swallowed up all the habitations of Jacob, and hath not pitied: He hath thrown down in his wrath the strongholds of the daughter of Judah; He hath brought them down to the ground; he hath profaned the kingdom and the princes thereof. ";
yng[2] = "Swallowed up hath the Lord, He hath not pitied any of the pleasant places of Jacob, He hath broken down in His wrath The fortresses of the daughter of Judah, He hath caused to come to the earth, He polluted the kingdom and its princes.";
dby[2] = "The Lord hath swallowed up all the dwellings of Jacob, and hath not spared; he hath thrown down in his wrath the strongholds of the daughter of Judah: he hath brought [them] down to the ground; he hath profaned the kingdom and the princes thereof.";
web[2] = "The Lord hath swallowed up all the habitations of Jacob, and hath not pitied: he hath thrown down in his wrath the strong holds of the daughter of Judah; he hath brought [them] down to the ground: he hath polluted the kingdom and its princes.";
hnv[2] = "The Lord has swallowed up all the habitations of Ya`akov, and has not pitied: He has thrown down in his wrath the strongholds of the daughter of Yehudah; He has brought them down to the ground; he has profaned the kingdom and the princes of it.";
vul[2] = "BETH praecipitavit Dominus nec pepercit omnia speciosa Iacob destruxit in furore suo munitiones virginis Iuda deiecit in terram polluit regnum et principes eius";
kjv[3] = "He hath cut off in [his] fierce anger all the horn of Israel: he hath drawn back his right hand from before the enemy, and he burned against Jacob like a flaming fire, [which] devoureth round about.";
rsv[3] = "He has cut down in fierce anger all the might of Israel; he has withdrawn from them his right hand in the face of the enemy; he has burned like a flaming fire in Jacob, consuming all around.";
asv[3] = "He hath cut off in fierce anger all the horn of Israel; He hath drawn back his right hand from before the enemy: And he hath burned up Jacob like a flaming fire, which devoureth round about. ";
yng[3] = "He hath cut off in the heat of anger every horn of Israel, He hath turned backward His right hand From the face of the enemy, And He burneth against Jacob as a flaming fire, It hath devoured round about.";
dby[3] = "He hath cut off in fierce anger all the horn of Israel: he hath withdrawn his right hand from before the enemy; and he burned up Jacob like a flaming fire, devouring round about.";
web[3] = "He hath cut off in [his] fierce anger all the horn of Israel: he hath drawn back his right hand from before the enemy, and he burned against Jacob like a flaming fire, [which] devoureth on every side.";
hnv[3] = "He has cut off in fierce anger all the horn of Yisra\'el; He has drawn back his right hand from before the enemy: He has burned up Ya`akov like a flaming fire, which devours round about.";
vul[3] = "GIMEL confregit in ira furoris omne cornu Israhel avertit retrorsum dexteram suam a facie inimici et succendit in Iacob quasi ignem flammae devorantis in gyro";
kjv[4] = "He hath bent his bow like an enemy: he stood with his right hand as an adversary, and slew all [that were] pleasant to the eye in the tabernacle of the daughter of Zion: he poured out his fury like fire.";
rsv[4] = "He has bent his bow like an enemy, with his right hand set like a foe; and he has slain all the pride of our eyes in the tent of the daughter of Zion; he has poured out his fury like fire.";
asv[4] = "He hath bent his bow like an enemy, he hath stood with his right hand as an adversary, And hath slain all that were pleasant to the eye: In the tent of the daughter of Zion he hath poured out his wrath like fire. ";
yng[4] = "He hath trodden His bow as an enemy, Stood hath His right hand as an adversary, And He slayeth all the desirable ones of the eye, In the tent of the daughter of Zion, He hath poured out as fire His fury.";
dby[4] = "He hath bent his bow like an enemy; he stood with his right hand as an adversary, and hath slain all that was pleasant to the eye: in the tent of the daughter of Zion, he hath poured out his fury like fire.";
web[4] = "He hath bent his bow like an enemy: he stood with his right hand as an adversary, and slew all [that were] pleasant to the eye in the tabernacle of the daughter of Zion: he poured out his fury like fire.";
hnv[4] = "He has bent his bow like an enemy, he has stood with his right hand as an adversary, Has killed all that were pleasant to the eye: In the tent of the daughter of Tziyon he has poured out his wrath like fire.";
vul[4] = "DELETH tetendit arcum suum quasi inimicus firmavit dexteram suam quasi hostis et occidit omne quod pulchrum erat visu in tabernaculo filiae Sion effudit quasi ignem indignationem suam";
kjv[5] = "The Lord was as an enemy: he hath swallowed up Israel, he hath swallowed up all her palaces: he hath destroyed his strong holds, and hath increased in the daughter of Judah mourning and lamentation.";
rsv[5] = "The Lord has become like an enemy, he has destroyed Israel; he has destroyed all its palaces, laid in ruins its strongholds; and he has multiplied in the daughter of Judah mourning and lamentation.";
asv[5] = "The Lord is become as an enemy, he hath swallowed up Israel; He hath swallowed up all her palaces, he hath destroyed his strongholds; And he hath multiplied in the daughter of Judah mourning and lamentation. ";
yng[5] = "The Lord hath been as an enemy, He hath swallowed up Israel, He hath swallowed up all her palaces, He hath destroyed His fortresses, And He multiplieth in the daughter of Judah Mourning and moaning.";
dby[5] = "The Lord is become as an enemy: he hath swallowed up Israel; he hath swallowed up all her palaces; he hath destroyed his strongholds, and hath multiplied in the daughter of Judah mourning and lamentation.";
web[5] = "The Lord was as an enemy: he hath swallowed up Israel, he hath swallowed up all her palaces: he hath destroyed his strong holds, and hath increased in the daughter of Judah mourning and lamentation.";
hnv[5] = "The Lord is become as an enemy, he has swallowed up Yisra\'el; He has swallowed up all her palaces, he has destroyed his strongholds; He has multiplied in the daughter of Yehudah mourning and lamentation.";
vul[5] = "HE factus est Dominus velut inimicus praecipitavit Israhel praecipitavit omnia moenia eius dissipavit munitiones eius et replevit in filia Iuda humiliatum et humiliatam";
kjv[6] = "And he hath violently taken away his tabernacle, as [if it were of] a garden: he hath destroyed his places of the assembly: the LORD hath caused the solemn feasts and sabbaths to be forgotten in Zion, and hath despised in the indignation of his anger the king and the priest.";
rsv[6] = "He has broken down his booth like that of a garden, laid in ruins the place of his appointed feasts; the LORD has brought to an end in Zion appointed feast and sabbath, and in his fierce indignation has spurned king and priest.";
asv[6] = "And he hath violently taken away his tabernacle, as if it were of a garden; he hath destroyed his place of assembly: Jehovah hath caused solemn assembly and sabbath to be forgotten in Zion, And hath despised in the indignation of his anger the king and the priest. ";
yng[6] = "And He shaketh as a garden His tabernacle, He hath destroyed His appointed place, Jehovah hath forgotten in Zion the appointed time and sabbath, And despiseth, in the indignation of His anger, king and priest.";
dby[6] = "And he hath violently cast down his enclosure as a garden; he hath destroyed his place of assembly: Jehovah hath caused set feast and sabbath to be forgotten in Zion, and hath despised in the indignation of his anger king and priest.";
web[6] = "And he hath violently taken away his tabernacle, as [if it were of] a garden: he hath destroyed his places of the assembly: the LORD hath caused the solemn feasts and sabbaths to be forgotten in Zion, and in the indignation of his anger hath despised the king and the priest.";
hnv[6] = "He has violently taken away his tent, as if it were of a garden; he has destroyed his place of assembly: The LORD has caused solemn assembly and Shabbat to be forgotten in Tziyon, Has despised in the indignation of his anger the king and the Kohen.";
vul[6] = "VAV et dissipavit quasi hortum tentorium suum demolitus est tabernaculum suum oblivioni tradidit Dominus in Sion festivitatem et sabbatum et obprobrio in indignatione furoris sui regem et sacerdotem";
kjv[7] = "The Lord hath cast off his altar, he hath abhorred his sanctuary, he hath given up into the hand of the enemy the walls of her palaces; they have made a noise in the house of the LORD, as in the day of a solemn feast.";
rsv[7] = "The Lord has scorned his altar, disowned his sanctuary; he has delivered into the hand of the enemy the walls of her palaces; a clamor was raised in the house of the LORD as on the day of an appointed feast.";
asv[7] = "The Lord hath cast off his altar, he hath abhorred his sanctuary; He hath given up into the hand of the enemy the walls of her palaces: They have made a noise in the house of Jehovah, as in the day of a solemn assembly. ";
yng[7] = "The Lord hath cast off His altar, He hath rejected His sanctuary, He hath shut up into the hand of the enemy The walls of her palaces, A noise they have made in the house of Jehovah Like a day of appointment.";
dby[7] = "The Lord hath cast off his altar, he hath rejected his sanctuary; he hath given up into the hand of the enemy the walls of her palaces: they have made a noise in the house of Jehovah, as on the day of a set feast.";
web[7] = "The Lord hath cast off his altar, he hath abhorred his sanctuary, he hath given up into the hand of the enemy the walls of her palaces; they have made a noise in the house of the LORD, as in the day of a solemn feast.";
hnv[7] = "The Lord has cast off his altar, he has abhorred his sanctuary; He has given up into the hand of the enemy the walls of her palaces: They have made a noise in the house of the LORD, as in the day of a solemn assembly.";
vul[7] = "ZAI reppulit Dominus altare suum maledixit sanctificationi suae tradidit in manu inimici muros turrium eius vocem dederunt in domo Domini sicut in die sollemni";
kjv[8] = "The LORD hath purposed to destroy the wall of the daughter of Zion: he hath stretched out a line, he hath not withdrawn his hand from destroying: therefore he made the rampart and the wall to lament; they languished together.";
rsv[8] = "The LORD determined to lay in ruins the wall of the daughter of Zion; he marked it off by the line; he restrained not his hand from destroying; he caused rampart and wall to lament, they languish together.";
asv[8] = "Jehovah hath purposed to destroy the wall of the daughter of Zion; He hath stretched out the line, he hath not withdrawn his hand from destroying; And he hath made the rampart and wall to lament; they languish together. ";
yng[8] = "Devised hath Jehovah to destroy the wall of the daughter of Zion, He hath stretched out a line, He hath not turned His hand from destroying, And He causeth bulwark and wall to mourn, Together -- they have been weak.";
dby[8] = "Jehovah hath purposed to destroy the wall of the daughter of Zion: he hath stretched out the line, he hath not withdrawn his hand from destroying; and he hath made the rampart and the wall to lament: they languish together.";
web[8] = "The LORD hath purposed to destroy the wall of the daughter of Zion: he hath stretched out a line, he hath not withdrawn his hand from destroying: therefore he made the rampart and the wall to lament; they languished together.";
hnv[8] = "The LORD has purposed to destroy the wall of the daughter of Tziyon; He has stretched out the line, he has not withdrawn his hand from destroying; He has made the rampart and wall to lament; they languish together.";
vul[8] = "HETH cogitavit Dominus dissipare murum filiae Sion tetendit funiculum suum et non avertit manum suam a perditione luxitque antemurale et murus pariter dissipatus est";
kjv[9] = "Her gates are sunk into the ground; he hath destroyed and broken her bars: her king and her princes [are] among the Gentiles: the law [is] no [more]; her prophets also find no vision from the LORD.";
rsv[9] = "Her gates have sunk into the ground; he has ruined and broken her bars; her king and princes are among the nations; the law is no more, and her prophets obtain no vision from the LORD.";
asv[9] = "Her gates are sunk into the ground; he hath destroyed and broken her bars: Her king and her princes are among the nations where the law is not; Yea, her prophets find no vision from Jehovah. ";
yng[9] = "Sunk into the earth have her gates, He hath destroyed and broken her bars, Her king and her princes [are] among the nations, There is no law, also her prophets Have not found vision from Jehovah.";
dby[9] = "Her gates are sunk into the ground; he hath destroyed and broken her bars. Her king and her princes are among the nations: the law is no [more]; her prophets also find no vision from Jehovah.";
web[9] = "Her gates are sunk into the ground; he hath destroyed and broken her bars: her king and her princes [are] among the Gentiles: the law [is] no [more]: her prophets also find no vision from the LORD.";
hnv[9] = "Her gates are sunk into the ground; he has destroyed and broken her bars: Her king and her princes are among the nations where the law is not; Yes, her prophets find no vision from the LORD.";
vul[9] = "TETH defixae sunt in terra portae eius perdidit et contrivit vectes eius regem eius et principes eius in gentibus non est lex et prophetae eius non invenerunt visionem a Domino";
kjv[10] = "The elders of the daughter of Zion sit upon the ground, [and] keep silence: they have cast up dust upon their heads; they have girded themselves with sackcloth: the virgins of Jerusalem hang down their heads to the ground.";
rsv[10] = "The elders of the daughter of Zion sit on the ground in silence; they have cast dust on their heads and put on sackcloth; the maidens of Jerusalem have bowed their heads to the ground.";
asv[10] = "The elders of the daughter of Zion sit upon the ground, they keep silence; They have cast up dust upon their heads; they have girded themselves with sackcloth: The virgins of Jerusalem hang down their heads to the ground. ";
yng[10] = "Sit on the earth -- keep silent do the elders of the daughter of Zion, They have caused dust to go up on their head, They have girded on sackcloth, Put down to the earth their head have the virgins of Jerusalem.";
dby[10] = "The elders of the daughter of Zion sit upon the ground, they keep silence; they have cast dust upon their heads, they have girded themselves with sackcloth: the virgins of Jerusalem hang down their head to the ground.";
web[10] = "The elders of the daughter of Zion sit upon the ground, [and] keep silence: they have cast up dust upon their heads; they have girded themselves with sackcloth: the virgins of Jerusalem hang down their heads to the ground.";
hnv[10] = "The Zakenim of the daughter of Tziyon sit on the ground, they keep silence; They have cast up dust on their heads; they have girded themselves with sackcloth: The virgins of Yerushalayim hang down their heads to the ground.";
vul[10] = "IOTH sederunt in terra conticuerunt senes filiae Sion consperserunt cinere capita sua accincti sunt ciliciis abiecerunt in terra capita sua virgines Hierusalem";
kjv[11] = "Mine eyes do fail with tears, my bowels are troubled, my liver is poured upon the earth, for the destruction of the daughter of my people; because the children and the sucklings swoon in the streets of the city.";
rsv[11] = "My eyes are spent with weeping; my soul is in tumult; my heart is poured out in grief because of the destruction of the daughter of my people, because infants and babes faint in the streets of the city.";
asv[11] = "Mine eyes do fail with tears, my heart is troubled; My liver is poured upon the earth, because of the destruction of the daughter of my people, Because the young children and the sucklings swoon in the streets of the city. ";
yng[11] = "Consumed by tears have been my eyes, Troubled have been my bowels, Poured out to the earth hath been my liver, For the breach of the daughter of my people; In infant and suckling being feeble, In the broad places of the city,";
dby[11] = "Mine eyes are consumed with tears, my bowels are troubled; my liver is poured upon the earth, because of the ruin of the daughter of my people; because infant and suckling swoon in the streets of the city.";
web[11] = "My eyes do fail with tears, my bowels are troubled, my liver is poured upon the earth, for the destruction of the daughter of my people; because the children and the sucklings swoon in the streets of the city.";
hnv[11] = "My eyes do fail with tears, my heart is troubled; My liver is poured on the eretz, because of the destruction of the daughter of my people, Because the young children and the infants swoon in the streets of the city.";
vul[11] = "CAPH defecerunt prae lacrimis oculi mei conturbata sunt viscera mea effusum est in terra iecur meum super contritione filiae populi mei cum deficeret parvulus et lactans in plateis oppidi";
kjv[12] = "They say to their mothers, Where [is] corn and wine? when they swooned as the wounded in the streets of the city, when their soul was poured out into their mothers\' bosom.";
rsv[12] = "They cry to their mothers, &quot;Where is bread and wine?&quot; as they faint like wounded men in the streets of the city, as their life is poured out on their mothers\' bosom.";
asv[12] = "They say to their mothers, Where is grain and wine? When they swoon as the wounded in the streets of the city, When their soul is poured out into their mothers\' bosom. ";
yng[12] = "To their mothers they say, `Where [are] corn and wine?\' In their becoming feeble as a pierced one In the broad places of the city, In their soul pouring itself out into the bosom of their mothers.";
dby[12] = "They say to their mothers, Where is corn and wine? when they swoon as the wounded in the streets of the city; when they pour out their soul into their mothers\' bosom.";
web[12] = "They say to their mothers, Where [is] corn and wine? when they swooned as the wounded in the streets of the city, when their soul was poured out into their mothers\' bosom.";
hnv[12] = "They tell their mothers, Where is grain and wine? When they swoon as the wounded in the streets of the city, When their soul is poured out into their mothers\' bosom.";
vul[12] = "LAMED matribus suis dixerunt ubi est triticum et vinum cum deficerent quasi vulnerati in plateis civitatis cum exhalarent animas suas in sinu matrum suarum";
kjv[13] = "What thing shall I take to witness for thee? what thing shall I liken to thee, O daughter of Jerusalem? what shall I equal to thee, that I may comfort thee, O virgin daughter of Zion? for thy breach [is] great like the sea: who can heal thee?";
rsv[13] = "What can I say for you, to what compare you, O daughter of Jerusalem? What can I liken to you, that I may comfort you, O virgin daughter of Zion? For vast as the sea is your ruin; who can restore you?";
asv[13] = "What shall I testify unto thee? what shall I liken to thee, O daughter of Jerusalem? What shall I compare to thee, that I may comfort thee, O virgin daughter of Zion? For thy breach is great like the sea: who can heal thee? ";
yng[13] = "What do I testify [to] thee, what do I liken to thee, O daughter of Jerusalem? What do I equal to thee, and I comfort thee, O virgin daughter of Zion? For great as a sea [is] thy breach, Who doth give healing to thee?";
dby[13] = "What shall I take to witness for thee? what shall I liken unto thee, daughter of Jerusalem? What shall I equal to thee, that I may comfort thee, virgin daughter of Zion? For thy ruin is great as the sea: who will heal thee?";
web[13] = "What thing shall I take to witness for thee? what thing shall I liken to thee, O daughter of Jerusalem? What shall I equal to thee, that I may comfort thee, O virgin daughter of Zion? for thy breach [is] great like the sea: who can heal thee?";
hnv[13] = "What shall I testify to you? what shall I liken to you, daughter of Yerushalayim? What shall I compare to you, that I may comfort you, virgin daughter of Tziyon? For your breach is great like the sea: who can heal you?";
vul[13] = "MEM cui conparabo te vel cui adsimilabo te filia Hierusalem cui exaequabo te et consolabor te virgo filia Sion magna enim velut mare contritio tua quis medebitur tui";
kjv[14] = "Thy prophets have seen vain and foolish things for thee: and they have not discovered thine iniquity, to turn away thy captivity; but have seen for thee false burdens and causes of banishment.";
rsv[14] = "Your prophets have seen for you false and deceptive visions; they have not exposed your iniquity to restore your fortunes, but have seen for you oracles false and misleading.";
asv[14] = "Thy prophets have seen for thee false and foolish visions; And they have not uncovered thine iniquity, to bring back thy captivity, But have seen for thee false oracles and causes of banishment. ";
yng[14] = "Thy prophets have seen for thee a false and insipid thing, And have not revealed concerning thine iniquity, To turn back thy captivity, And they see for thee false burdens and causes of expulsion.";
dby[14] = "Thy prophets have seen vanity and folly for thee; and they have not revealed thine iniquity, to turn away thy captivity; but have seen for thee burdens of falsehood and causes of expulsion.";
web[14] = "Thy prophets have seen vain and foolish things for thee: and they have not revealed thy iniquity, to turn away thy captivity; but have seen for thee false burdens and causes of banishment.";
hnv[14] = "Your prophets have seen for you false and foolish visions; They have not uncovered your iniquity, to bring back your captivity, But have seen for you false oracles and causes of banishment.";
vul[14] = "NUN prophetae tui viderunt tibi falsa et stulta nec aperiebant iniquitatem tuam ut te ad paenitentiam provocarent viderunt autem tibi adsumptiones falsas et eiectiones";
kjv[15] = "All that pass by clap [their] hands at thee; they hiss and wag their head at the daughter of Jerusalem, [saying, Is] this the city that [men] call The perfection of beauty, The joy of the whole earth?";
rsv[15] = "All who pass along the way clap their hands at you; they hiss and wag their heads at the daughter of Jerusalem; &quot;Is this the city which was called the perfection of beauty, the joy of all the earth?&quot;";
asv[15] = "All that pass by clap their hands at thee; They hiss and wag their head at the daughter of Jerusalem, [saying], Is this the city that men called The perfection of beauty, The joy of the whole earth? ";
yng[15] = "Clapped hands at thee have all passing by the way, They have hissed -- and they shake the head At the daughter of Jerusalem: `Is this the city of which they said: The perfection of beauty, a joy to all the land?\'";
dby[15] = "All that pass by clap [their] hands at thee; they hiss and shake their head at the daughter of Jerusalem: Is this the city which they called, The perfection of beauty, The joy of the whole earth?";
web[15] = "All that pass by, clap [their] hands at thee; they hiss and wag their head at the daughter of Jerusalem, [saying], [Is] this the city that [men] call the Perfection of beauty, the Joy of the whole earth?";
hnv[15] = "All that pass by clap their hands at you; They hiss and wag their head at the daughter of Yerushalayim, [saying], Is this the city that men called The perfection of beauty, The joy of the whole eretz?";
vul[15] = "SAMECH plauserunt super te manibus omnes transeuntes per viam sibilaverunt et moverunt caput suum super filiam Hierusalem haecine est urbs dicentes perfecti decoris gaudium universae terrae";
kjv[16] = "All thine enemies have opened their mouth against thee: they hiss and gnash the teeth: they say, We have swallowed [her] up: certainly this [is] the day that we looked for; we have found, we have seen [it].";
rsv[16] = "All your enemies rail against you; they hiss, they gnash their teeth, they cry: &quot;We have destroyed her! Ah, this is the day we longed for; now we have it; we see it!&quot;";
asv[16] = "All thine enemies have opened their mouth wide against thee; They hiss and gnash the teeth; they say, We have swallowed her up; Certainly this is the day that we looked for; we have found, we have seen it. ";
yng[16] = "Opened against thee their mouth have all thine enemies, They have hissed, yea, they gnash the teeth, They have said: `We have swallowed [her] up, Surely this [is] the day that we looked for, We have found -- we have seen.\'";
dby[16] = "All thine enemies open their mouth against thee, they hiss and gnash the teeth: they say, We have swallowed [her] up; this is forsooth the day that we looked for: we have found, we have seen [it].";
web[16] = "All thy enemies have opened their mouth against thee: they hiss and gnash the teeth: they say, We have swallowed [her] up: certainly this [is] the day that we looked for; we have found, we have seen [it].";
hnv[16] = "All your enemies have opened their mouth wide against you; They hiss and gnash the teeth; they say, We have swallowed her up; Certainly this is the day that we looked for; we have found, we have seen it.";
vul[16] = "FE aperuerunt super te os suum omnes inimici tui sibilaverunt et fremuerunt dentibus dixerunt devoravimus en ista est dies quam expectabamus invenimus vidimus";
kjv[17] = "The LORD hath done [that] which he had devised; he hath fulfilled his word that he had commanded in the days of old: he hath thrown down, and hath not pitied: and he hath caused [thine] enemy to rejoice over thee, he hath set up the horn of thine adversaries.";
rsv[17] = "The LORD has done what he purposed, has carried out his threat; as he ordained long ago, he has demolished without pity; he has made the enemy rejoice over you, and exalted the might of your foes.";
asv[17] = "Jehovah hath done that which he purposed; he hath fulfilled his word that he commanded in the days of old; He hath thrown down, and hath not pitied: And he hath caused the enemy to rejoice over thee; he hath exalted the horn of thine adversaries. ";
yng[17] = "Jehovah hath done that which He devised, He hath fulfilled His saying That He commanded from the days of old, He hath broken down and hath not pitied, And causeth an enemy to rejoice over thee, He lifted up the horn of thine adversaries.";
dby[17] = "Jehovah hath done what he had devised; he hath fulfilled his word which he had commanded from the days of old: he hath thrown down, and hath not spared, and he hath caused the enemy to rejoice over thee; he hath set up the horn of thine adversaries.";
web[17] = "The LORD hath done [that] which he had devised; he hath fulfilled his word that he had commanded in the days of old: he hath thrown down, and hath not pitied: and he hath caused [thy] enemy to rejoice over thee, he hath set up the horn of thy adversaries.";
hnv[17] = "The LORD has done that which he purposed; he has fulfilled his word that he commanded in the days of old; He has thrown down, and has not pitied: He has caused the enemy to rejoice over you; he has exalted the horn of your adversaries.";
vul[17] = "AIN fecit Dominus quae cogitavit conplevit sermonem suum quem praeceperat a diebus antiquis destruxit et non pepercit et laetificavit super te inimicum et exaltavit cornu hostium tuorum";
kjv[18] = "Their heart cried unto the Lord, O wall of the daughter of Zion, let tears run down like a river day and night: give thyself no rest; let not the apple of thine eye cease.";
rsv[18] = "Cry aloud to the Lord! O daughter of Zion! Let tears stream down like a torrent day and night! Give yourself no rest, your eyes no respite!";
asv[18] = "Their heart cried unto the Lord: O wall of the daughter of Zion, let tears run down like a river day and night; Give thyself no respite; let not the apple of thine eye cease. ";
yng[18] = "Cried hath their heart unto the Lord; O wall of the daughter of Zion, Cause to go down as a stream tears daily and nightly, Give not rest to thyself, Let not the daughter of thine eye stand still.";
dby[18] = "Their heart cried unto the Lord. O wall of the daughter of Zion, let tears run down like a torrent day and night: give thyself no respite; let not the apple of thine eye rest.";
web[18] = "Their heart cried to the Lord, O wall of the daughter of Zion, let tears run down like a river day and night: give thyself no rest; let not the apple of thy eye cease.";
hnv[18] = "Their heart cried to the Lord: wall of the daughter of Tziyon, let tears run down like a river day and night; Give yourself no respite; don\'t let the apple of your eye cease.";
vul[18] = "SADE clamavit cor eorum ad Dominum super muros filiae Sion deduc quasi torrentem lacrimas per diem et per noctem non des requiem tibi neque taceat pupilla oculi tui";
kjv[19] = "Arise, cry out in the night: in the beginning of the watches pour out thine heart like water before the face of the Lord: lift up thy hands toward him for the life of thy young children, that faint for hunger in the top of every street.";
rsv[19] = "Arise, cry out in the night, at the beginning of the watches! Pour out your heart like water before the presence of the Lord! Lift your hands to him for the lives of your children, who faint for hunger at the head of every street.";
asv[19] = "Arise, cry out in the night, at the beginning of the watches; Pour out thy heart like water before the face of the Lord: Lift up thy hands toward him for the life of thy young children, that faint for hunger at the head of every street. ";
yng[19] = "Arise, cry aloud in the night, At the beginning of the watches. Pour out as water thy heart, Over against the face of the Lord, Lift up unto Him thy hands, for the soul of thine infants, Who are feeble with hunger at the head of all out-places.";
dby[19] = "Arise, cry out in the night, in the beginning of the watches; pour out thy heart like water before the face of the Lord: lift up thy hands toward him for the life of thy young children, who faint from hunger at the top of all the streets.";
web[19] = "Arise, cry out in the night: in the beginning of the watches pour out thy heart like water before the face of the Lord: lift up thy hands towards him for the life of thy young children, that faint for hunger at the head of every street.";
hnv[19] = "Arise, cry out in the night, at the beginning of the watches; Pour out your heart like water before the face of the Lord: Lift up your hands toward him for the life of your young children, that faint for hunger at the head of every street.";
vul[19] = "COPH consurge lauda in nocte in principio vigiliarum effunde sicut aqua cor tuum ante conspectum Domini leva ad eum manus tuas pro anima parvulorum tuorum qui defecerunt in fame in capite omnium conpetorum";
kjv[20] = "Behold, O LORD, and consider to whom thou hast done this. Shall the women eat their fruit, [and] children of a span long? shall the priest and the prophet be slain in the sanctuary of the Lord?";
rsv[20] = "Look, O LORD, and see! With whom hast thou dealt thus? Should women eat their offspring, the children of their tender care? Should priest and prophet be slain in the sanctuary of the Lord?";
asv[20] = "See, O Jehovah, and behold to whom thou hast done thus! Shall the women eat their fruit, the children that are dandled in the hands? Shall the priest and the prophet be slain in the sanctuary of the Lord? ";
yng[20] = "See, O Jehovah, and look attentively, To whom Thou hast acted thus, Do women eat their fruit, infants of a handbreadth? Slain in the sanctuary of the Lord are priest and prophet?";
dby[20] = "See, Jehovah, and consider to whom thou hast done this! Shall the women eat their fruit, the infants that they nursed? Shall priest and prophet be slain in the sanctuary of the Lord?";
web[20] = "Behold, O LORD, and consider to whom thou hast done this. Shall the women eat their fruit, children of a span long? shall the priest and the prophet be slain in the sanctuary of the Lord?";
hnv[20] = "Look, LORD, and see to whom you have done thus! Shall the women eat their fruit, the children that are dandled in the hands? Shall the Kohen and the prophet be killed in the sanctuary of the Lord?";
vul[20] = "RES vide Domine et considera quem vindemiaveris ita ergone comedent mulieres fructum suum parvulos ad mensuram palmae si occidetur in sanctuario Domini sacerdos et propheta";
kjv[21] = "The young and the old lie on the ground in the streets: my virgins and my young men are fallen by the sword; thou hast slain [them] in the day of thine anger; thou hast killed, [and] not pitied.";
rsv[21] = "In the dust of the streets lie the young and the old; my maidens and my young men have fallen by the sword; in the day of thy anger thou hast slain them, slaughtering without mercy.";
asv[21] = "The youth and the old man lie on the ground in the streets; My virgins and my young men are fallen by the sword: Thou hast slain them in the day of thine anger; thou hast slaughtered, [and] not pitied. ";
yng[21] = "Lain on the earth [in] out-places have young and old, My virgins and my young men have fallen by the sword, Thou hast slain in a day of Thine anger, Thou hast slaughtered -- Thou hast not pitied.";
dby[21] = "The child and the old man lie on the ground in the streets; my virgins and my young men are fallen by the sword: thou hast slain [them] in the day of thine anger; thou hast killed, thou hast not spared.";
web[21] = "The young and the old lie on the ground in the streets: my virgins and my young men have fallen by the sword; thou hast slain [them] in the day of thy anger; thou hast killed, [and] not pitied.";
hnv[21] = "The youth and the old man lie on the ground in the streets; My virgins and my young men are fallen by the sword: You have killed them in the day of your anger; you have slaughtered, [and] not pitied.";
vul[21] = "SEN iacuerunt in terra foris puer et senex virgines meae et iuvenes mei ceciderunt in gladio interfecisti in die furoris tui percussisti nec misertus es";
kjv[22] = "Thou hast called as in a solemn day my terrors round about, so that in the day of the LORD\'S anger none escaped nor remained: those that I have swaddled and brought up hath mine enemy consumed.";
rsv[22] = "Thou didst invite as to the day of an appointed feast my terrors on every side; and on the day of the anger of the LORD none escaped or survived; those whom I dandled and reared my enemy destroyed.";
asv[22] = "Thou hast called, as in the day of a solemn assembly, my terrors on every side; And there was none that escaped or remained in the day of Jehovah\'s anger: Those that I have dandled and brought up hath mine enemy consumed. ";
yng[22] = "Thou dost call as [at] a day of appointment, My fears from round about, And there hath not been in the day of the anger of Jehovah, An escaped and remaining one, They whom I stretched out and nourished, My enemy hath consumed!";
dby[22] = "Thou hast called up, as on the day of a set feast, my terrors on every side; and in the day of Jehovah\'s anger there was none that escaped or remained: those that I have nursed and brought up hath mine enemy consumed.";
web[22] = "Thou hast called as in a solemn day my terrors around, so that in the day of the LORD\'S anger none escaped nor remained: those that I have swaddled and brought up, hath my enemy consumed.";
hnv[22] = "You have called, as in the day of a solemn assembly, my terrors on every side; There was none that escaped or remained in the day of the LORD\'s anger: Those that I have dandled and brought up has my enemy consumed.";
vul[22] = "THAU vocasti quasi ad diem sollemnem qui terrerent me de circuitu et non fuit in die furoris Domini qui effugeret et relinqueretur quos educavi et enutrivi inimicus meus consumpsit eos";
