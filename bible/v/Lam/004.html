csb[1] = "How the gold has become tarnished, the fine gold become dull! The stones of the temple lie scattered at the head of every street.";
csb[2] = "Zion\'s precious children -- once worth their weight in pure gold -- how they are regarded as clay jars, the work of a potter\'s hands!";
csb[3] = "Even jackals offer their breasts to nurse their young, but my dear people have become cruel like ostriches in the wilderness.";
csb[4] = "The nursing baby\'s tongue clings to the roof of his mouth from thirst. Infants beg for food, but no one gives them any.";
csb[5] = "Those who used to eat delicacies are destitute in the streets; those who were reared in purple garments huddle in trash heaps.";
csb[6] = "The punishment of my dear people is greater than that of Sodom, which was overthrown in an instant without a hand laid on it.";
csb[7] = "Her dignitaries were brighter than snow, whiter than milk; their bodies were more ruddy than coral, their appearance like lapis lazuli.";
csb[8] = "Now they appear darker than soot; they are not recognized in the streets. Their skin has shriveled on their bones; it has become dry like wood.";
csb[9] = "Those slain by the sword are better off than those slain by hunger, who waste away, pierced with pain because the fields lack produce.";
csb[10] = "The hands of compassionate women have cooked their own children; they became their food during the destruction of my dear people.";
csb[11] = "The LORD has exhausted his wrath, poured out his burning anger; he has ignited a fire in Zion, and it has consumed her foundations.";
csb[12] = "The kings of the earth and all the world\'s inhabitants did not believe that an enemy or adversary could enter Jerusalem\'s gates.";
csb[13] = "Yet it happened because of the sins of her prophets and the iniquities of her priests, who shed the blood of the righteous within her.";
csb[14] = "Blind, they stumbled in the streets, defiled by this blood, so that no one dared to touch their garments.";
csb[15] = "&quot;Stay away! Unclean! &quot; people shouted at them. &quot;Away, away! Don\'t touch us! &quot; So they wandered aimlessly. It was said among the nations, &quot;They can stay here no longer.&quot;";
csb[16] = "The LORD himself has scattered them; he no longer watches over them. The priests are not respected; the elders find no favor.";
csb[17] = "All the while our eyes were failing as we looked in vain for help; we watched from our towers for a nation that would not save us.";
csb[18] = "Our steps were closely followed so that we could not walk in our streets. Our end approached; our time ran out. Our end had come!";
csb[19] = "Those who chased us were swifter than eagles in the sky; they relentlessly pursued us over the mountains and ambushed us in the wilderness.";
csb[20] = "The LORD\'s anointed, the breath of our life, was captured in their traps. We had said about him, &quot;We will live under his protection among the nations.&quot;";
csb[21] = "So rejoice and be glad, Daughter Edom, you resident of the land of Uz! Yet the cup will pass to you as well; you will get drunk and expose yourself.";
csb[22] = "Daughter Zion, your punishment is complete; he will not lengthen your exile. But he will punish your iniquity, Daughter Edom, and will expose your sins.";

yng[21] = "Joy and rejoice, O daughter of Edom, Dwelling in the land of Uz, Even unto thee pass over doth a cup, Thou art drunk, and makest thyself naked.";
dby[21] = "Rejoice and be glad, daughter of Edom, that dwellest in the land of Uz: the cup shall pass also unto thee; thou shalt be drunken, and make thyself naked.";

hnv[21] = "Rejoice and be glad, daughter of Edom, that dwell in the land of `Utz: The cup shall pass through to you also; you shall be drunken, and shall make yourself naked.";
vul[21] = "SEN gaude et laetare filia Edom quae habitas in terra Hus ad te quoque perveniet calix inebriaberis atque nudaberis";

asv[22] = "The punishment of thine iniquity is accomplished, O daughter of Zion; he will no more carry thee away into captivity: He will visit thine iniquity, O daughter of Edom; he will uncover thy sins. ";
yng[22] = "Completed [is] thy iniquity, daughter of Zion, He doth not add to remove thee, He hath inspected thy iniquity, O daughter of Edom, He hath removed [thee] because of thy sins!";

hnv[22] = "The punishment of your iniquity is accomplished, daughter of Tziyon; he will no more carry you away into captivity: He will visit your iniquity, daughter of Edom; he will uncover your sins.";
