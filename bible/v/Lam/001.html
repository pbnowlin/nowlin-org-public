csb[1] = "How she sits alone, the city once crowded with people! She who was great among the nations has become like a widow. The princess among the provinces has been put to forced labor.";
csb[2] = "She weeps bitterly during the night, with tears on her cheeks. There is no one to offer her comfort, not one from all her lovers. All her friends have betrayed her; they have become her enemies.";
csb[3] = "Judah has gone into exile following affliction and harsh slavery; she lives among the nations but finds no place to rest. All her pursuers have overtaken her in narrow places.";
csb[4] = "The roads to Zion mourn, for no one comes to the appointed festivals. All her gates are deserted; her priests groan, her young women grieve, and she herself is bitter.";
csb[5] = "Her adversaries have become her masters; her enemies are at ease, for the LORD has made her suffer because of her many transgressions. Her children have gone away as captives before the adversary.";
csb[6] = "All the splendor has vanished from Daughter Zion. Her leaders are like stags that find no pasture; they stumble away exhausted before the hunter.";
csb[7] = "During the days of her affliction and homelessness Jerusalem remembers all her precious belongings that were hers in days of old. When her people fell into the adversary\'s hand, she had no one to help. The adversaries looked at her, laughing over her downfall.";
csb[8] = "Jerusalem has sinned grievously; therefore, she has become an object of scorn. All who honored her now despise her, for they have seen her nakedness. She herself groans and turns away.";
csb[9] = "Her uncleanness stains her skirts. She never considered her end. Her downfall was astonishing; there was no one to comfort her. LORD, look on my affliction, for the enemy boasts.";
csb[10] = "The adversary has seized all her precious belongings. She has even seen the nations enter her sanctuary -- those you had forbidden to enter your assembly.";
csb[11] = "All her people groan while they search for bread. They have traded their precious belongings for food in order to stay alive. LORD, look and see how I have become despised.";
csb[12] = "Is this nothing to you, all you who pass by? Look and see! Is there any pain like mine, which was dealt out to me, which the LORD made me suffer on the day of his burning anger?";
csb[13] = "He sent fire from on high into my bones; he made it descend. He spread a net for my feet and turned me back. He made me desolate, sick all day long.";
csb[14] = "My transgressions have been formed into a yoke, fastened together by his hand; they have been placed on my neck, and the Lord has broken my strength. He has handed me over to those I cannot withstand.";
csb[15] = "The Lord has rejected all the mighty men within me. He has summoned an army against me to crush my young warriors. The Lord has trampled Virgin Daughter Judah like grapes in a winepress.";
csb[16] = "I weep because of these things; my eyes flow with tears. For there is no one nearby to comfort me, no one to keep me alive. My children are desolate because the enemy has prevailed.";
csb[17] = "Zion stretches out her hands; there is no one to comfort her. The LORD has issued a decree against Jacob that his neighbors should be his adversaries. Jerusalem has become something impure among them.";
csb[18] = "The LORD is just, for I have rebelled against his command. Listen, all you people; look at my pain. My young women and young men have gone into captivity.";
csb[19] = "I called to my lovers, but they betrayed me. My priests and elders perished in the city while searching for food to keep themselves alive.";
csb[20] = "LORD, see how I am in distress. I am churning within; my heart is broken, for I have been very rebellious. Outside, the sword takes the children; inside, there is death.";
csb[21] = "People have heard me groaning, but there is no one to comfort me. All my enemies have heard of my misfortune; they are glad that you have caused it. Bring on the day you have announced, so that they may become like me.";
csb[22] = "Let all their wickedness come before you, and deal with them as you have dealt with me because of all my transgressions. For my groans are many, and I am sick at heart.";
kjv[1] = "How doth the city sit solitary, [that was] full of people! [how] is she become as a widow! she [that was] great among the nations, [and] princess among the provinces, [how] is she become tributary!";
rsv[1] = "How lonely sits the city that was full of people! How like a widow has she become, she that was great among the nations! She that was a princess among the cities has become a vassal.";
asv[1] = "How doth the city sit solitary, that was full of people! She is become as a widow, that was great among the nations! She that was a princess among the provinces is become tributary! ";
yng[1] = "How hath she sat alone, The city abounding with people! She hath been as a widow, The mighty among nations! Princes among provinces, She hath become tributary!";
dby[1] = "How doth the city sit solitary [that] was full of people! She that was great among the nations is become as a widow; the princess among the provinces is become tributary!";
web[1] = "How doth the city sit solitary, [that was] full of people! [how] is she become as a widow! she [that was] great among the nations, [and] princess among the provinces, [how] is she become tributary.";
hnv[1] = "How does the city sit solitary, that was full of people! She has become as a widow, who was great among the nations! She who was a princess among the provinces is become tributary!";
vul[1] = "ALEPH quomodo sedit sola civitas plena populo facta est quasi vidua domina gentium princeps provinciarum facta est sub tributo";
kjv[2] = "She weepeth sore in the night, and her tears [are] on her cheeks: among all her lovers she hath none to comfort [her]: all her friends have dealt treacherously with her, they are become her enemies.";
rsv[2] = "She weeps bitterly in the night, tears on her cheeks; among all her lovers she has none to comfort her; all her friends have dealt treacherously with her, they have become her enemies.";
asv[2] = "She weepeth sore in the night, and her tears are on her cheeks; Among all her lovers she hath none to comfort her: All her friends have dealt treacherously with her; they are become her enemies. ";
yng[2] = "She weepeth sore in the night, And her tear [is] on her cheeks, There is no comforter for her out of all her lovers, All her friends dealt treacherously by her, They have been to her for enemies.";
dby[2] = "She weepeth sore in the night, and her tears are on her cheeks; among all her lovers she hath no comforter; all her friends have dealt treacherously with her, they are become her enemies.";
web[2] = "She weepeth bitterly in the night, and her tears [are] on her cheeks: among all her lovers she hath none to comfort [her]: all her friends have dealt treacherously with her, they are become her enemies.";
hnv[2] = "She weeps sore in the night, and her tears are on her cheeks; Among all her lovers she has none to comfort her: All her friends have dealt treacherously with her; they are become her enemies.";
vul[2] = "BETH plorans ploravit in nocte et lacrimae eius in maxillis eius non est qui consoletur eam ex omnibus caris eius omnes amici eius spreverunt eam et facti sunt ei inimici";
kjv[3] = "Judah is gone into captivity because of affliction, and because of great servitude: she dwelleth among the heathen, she findeth no rest: all her persecutors overtook her between the straits.";
rsv[3] = "Judah has gone into exile because of affliction and hard servitude; she dwells now among the nations, but finds no resting place; her pursuers have all overtaken her in the midst of her distress.";
asv[3] = "Judah is gone into captivity because of affliction, and because of great servitude; She dwelleth among the nations, she findeth no rest: All her persecutors overtook her within the straits. ";
yng[3] = "Removed hath Judah because of affliction, And because of the abundance of her service; She hath dwelt among nations, She hath not found rest, All her pursuers have overtaken her between the straits.";
dby[3] = "Judah is gone into captivity because of affliction, and because of great servitude; she dwelleth among the nations, she findeth no rest: all her pursuers have overtaken her within the straits.";
web[3] = "Judah is gone into captivity because of affliction, and because of great servitude: she dwelleth among the heathen, she findeth no rest: all her persecutors overtook her between the straits.";
hnv[3] = "Yehudah is gone into captivity because of affliction, and because of great servitude; She dwells among the nations, she finds no rest: All her persecutors overtook her within the straits.";
vul[3] = "GIMEL migravit Iuda propter adflictionem et multitudinem servitutis habitavit inter gentes nec invenit requiem omnes persecutores eius adprehenderunt eam inter angustias";
kjv[4] = "The ways of Zion do mourn, because none come to the solemn feasts: all her gates are desolate: her priests sigh, her virgins are afflicted, and she [is] in bitterness.";
rsv[4] = "The roads to Zion mourn, for none come to the appointed feasts; all her gates are desolate, her priests groan; her maidens have been dragged away, and she herself suffers bitterly.";
asv[4] = "The ways of Zion do mourn, because none come to the solemn assembly; All her gates are desolate, her priests do sigh: Her virgins are afflicted, and she herself is in bitterness. ";
yng[4] = "The ways of Zion are mourning, Without any coming at the appointed time, All her gates are desolate, her priests sigh, Her virgins are afflicted -- and she hath bitterness.";
dby[4] = "The ways of Zion do mourn, because none come to the solemn assembly: all her gates are desolate; her priests sigh, her virgins are in grief; and as for her, she is in bitterness.";
web[4] = "The ways of Zion do mourn, because none come to the solemn feasts: all her gates are desolate: her priests sigh, her virgins are afflicted, and she [is] in bitterness.";
hnv[4] = "The ways of Tziyon do mourn, because none come to the solemn assembly; All her gates are desolate, her Kohanim do sigh: Her virgins are afflicted, and she herself is in bitterness.";
vul[4] = "DELETH viae Sion lugent eo quod non sint qui veniant ad sollemnitatem omnes portae eius destructae sacerdotes eius gementes virgines eius squalidae et ipsa oppressa amaritudine";
kjv[5] = "Her adversaries are the chief, her enemies prosper; for the LORD hath afflicted her for the multitude of her transgressions: her children are gone into captivity before the enemy.";
rsv[5] = "Her foes have become the head, her enemies prosper, because the LORD has made her suffer for the multitude of her transgressions; her children have gone away, captives before the foe.";
asv[5] = "Her adversaries are become the head, her enemies prosper; For Jehovah hath afflicted her for the multitude of her transgressions: Her young children are gone into captivity before the adversary. ";
yng[5] = "Her adversaries have become chief, Her enemies have been at ease, For Jehovah hath afflicted her, For the abundance of her transgressions, Her infants have gone captive before the adversary.";
dby[5] = "Her adversaries have become the head, her enemies prosper; for Jehovah hath afflicted her for the multitude of her transgressions: her children are gone into captivity before the adversary.";
web[5] = "Her adversaries are the chief, her enemies prosper; for the LORD hath afflicted her for the multitude of her transgressions: her children are gone into captivity before the enemy.";
hnv[5] = "Her adversaries are become the head, her enemies prosper; For the LORD has afflicted her for the multitude of her transgressions: Her young children are gone into captivity before the adversary.";
vul[5] = "HE facti sunt hostes eius in capite inimici illius locupletati sunt quia Dominus locutus est super eam propter multitudinem iniquitatum eius parvuli eius ducti sunt captivi ante faciem tribulantis";
kjv[6] = "And from the daughter of Zion all her beauty is departed: her princes are become like harts [that] find no pasture, and they are gone without strength before the pursuer.";
rsv[6] = "From the daughter of Zion has departed all her majesty. Her princes have become like harts that find no pasture; they fled without strength before the pursuer.";
asv[6] = "And from the daughter of Zion all her majesty is departed: Her princes are become like harts that find no pasture, And they are gone without strength before the pursuer. ";
yng[6] = "And go out from the daughter of Zion doth all her honour, Her princes have been as harts -- They have not found pasture, And they go powerless before a pursuer.";
dby[6] = "And from the daughter of Zion all her splendour is departed: her princes are become like harts that find no pasture; and they are gone without strength before the pursuer.";
web[6] = "And from the daughter of Zion all her beauty hath departed: her princes are become like harts [that] find no pasture, and they are gone without strength before the pursuer.";
hnv[6] = "From the daughter of Tziyon all her majesty is departed: Her princes are become like harts that find no pasture, They are gone without strength before the pursuer.";
vul[6] = "VAV et egressus est a filia Sion omnis decor eius facti sunt principes eius velut arietes non invenientes pascuam et abierunt absque fortitudine ante faciem subsequentis";
kjv[7] = "Jerusalem remembered in the days of her affliction and of her miseries all her pleasant things that she had in the days of old, when her people fell into the hand of the enemy, and none did help her: the adversaries saw her, [and] did mock at her sabbaths.";
rsv[7] = "Jerusalem remembers in the days of her affliction and bitterness all the precious things that were hers from days of old. When her people fell into the hand of the foe, and there was none to help her, the foe gloated over her, mocking at her downfall.";
asv[7] = "Jerusalem remembereth in the days of her affliction and of her miseries all her pleasant things that were from the days of old: When her people fell into the hand of the adversary, and none did help her, The adversaries saw her, they did mock at her desolations. ";
yng[7] = "Remembered hath Jerusalem [In] the days of her affliction and her mournings, all her desirable things that were from the days of old, In the falling of her people into the hand of an adversary, And she hath no helper; Seen her have adversaries, They have laughed at her cessation.";
dby[7] = "In the days of her affliction and of her wanderings, since her people fell into the hand of an adversary, and none did help her, Jerusalem remembereth all her precious things which she had in the days of old: the adversaries have seen her, they mock at her ruin.";
web[7] = "Jerusalem remembered in the days of her affliction and of her miseries all her pleasant things that she had in the days of old, when her people fell into the hand of the enemy, and none helped her: the adversaries saw her, [and] mocked at her sabbaths.";
hnv[7] = "Yerushalayim remembers in the days of her affliction and of her miseries all her pleasant things that were from the days of old: When her people fell into the hand of the adversary, and none did help her, The adversaries saw her, they did mock at her desolations.";
vul[7] = "ZAI recordata est Hierusalem dierum adflictionis suae et praevaricationis omnium desiderabilium suorum quae habuerat a diebus antiquis cum caderet populus eius in manu hostili et non esset auxiliator viderunt eam hostes et deriserunt sabbata eius";
kjv[8] = "Jerusalem hath grievously sinned; therefore she is removed: all that honoured her despise her, because they have seen her nakedness: yea, she sigheth, and turneth backward.";
rsv[8] = "Jerusalem sinned grievously, therefore she became filthy; all who honored her despise her, for they have seen her nakedness; yea, she herself groans, and turns her face away.";
asv[8] = "Jerusalem hath grievously sinned; therefore she is become as an unclean thing; All that honored her despise her, because they have seen her nakedness: Yea, she sigheth, and turneth backward. ";
yng[8] = "A sin hath Jerusalem sinned, Therefore impure she hath become, All who honoured her have esteemed her lightly, For they have seen her nakedness, Yea, she herself hath sighed and turneth backward.";
dby[8] = "Jerusalem hath grievously sinned; therefore is she removed as an impurity: all that honoured her despise her because they have seen her nakedness; and she sigheth, and turneth backward.";
web[8] = "Jerusalem hath grievously sinned; therefore she is removed: all that honored her despise her, because they have seen her nakedness: yes, she sigheth and turneth backward.";
hnv[8] = "Yerushalayim has grievously sinned; therefore she is become as an unclean thing; All who honored her despise her, because they have seen her nakedness: Yes, she sighs, and turns backward.";
vul[8] = "HETH peccatum peccavit Hierusalem propterea instabilis facta est omnes qui glorificabant eam spreverunt illam quia viderunt ignominiam eius ipsa autem gemens et conversa retrorsum";
kjv[9] = "Her filthiness [is] in her skirts; she remembereth not her last end; therefore she came down wonderfully: she had no comforter. O LORD, behold my affliction: for the enemy hath magnified [himself].";
rsv[9] = "Her uncleanness was in her skirts; she took no thought of her doom; therefore her fall is terrible, she has no comforter. &quot;O LORD, behold my affliction, for the enemy has triumphed!&quot;";
asv[9] = "Her filthiness was in her skirts; she remembered not her latter end; Therefore is she come down wonderfully; she hath no comforter: Behold, O Jehovah, my affliction; for the enemy hath magnified himself. ";
yng[9] = "Her uncleanness [is] in her skirts, She hath not remembered her latter end, And she cometh down wonderfully, There is no comforter for her. See, O Jehovah, mine affliction, For exerted himself hath an enemy.";
dby[9] = "Her impurity was in her skirts, she remembered not her latter end; and she came down wonderfully: she hath no comforter. Jehovah, behold my affliction; for the enemy hath magnified himself.";
web[9] = "Her filthiness [is] in her skirts; she remembereth not her last end; therefore she hath been wonderfully abased: she had no comforter. O LORD, behold my affliction: for the enemy hath magnified [himself].";
hnv[9] = "Her filthiness was in her skirts; she didn\'t remember her latter end; Therefore is she come down wonderfully; she has no comforter: See, LORD, my affliction; for the enemy has magnified himself.";
vul[9] = "TETH sordes eius in pedibus eius nec recordata est finis sui deposita est vehementer non habens consolatorem vide Domine adflictionem meam quoniam erectus est inimicus";
kjv[10] = "The adversary hath spread out his hand upon all her pleasant things: for she hath seen [that] the heathen entered into her sanctuary, whom thou didst command [that] they should not enter into thy congregation.";
rsv[10] = "The enemy has stretched out his hands over all her precious things; yea, she has seen the nations invade her sanctuary, those whom thou didst forbid to enter thy congregation.";
asv[10] = "The adversary hath spread out his hand upon all her pleasant things: For she hath seen that the nations are entered into her sanctuary, Concerning whom thou didst command that they should not enter into thine assembly. ";
yng[10] = "His hand spread out hath an adversary On all her desirable things, For she hath seen -- Nations have entered her sanctuary, Concerning which Thou didst command, `They do not come into the assembly to thee.\'";
dby[10] = "The adversary hath spread out his hand upon all her precious things; for she hath seen the nations enter into her sanctuary, concerning whom thou didst command that they should not enter into thy congregation.";
web[10] = "The adversary hath spread out his hand upon all her pleasant things: for she hath seen [that] the heathen entered into her sanctuary, whom thou didst command [that] they should not enter into thy congregation.";
hnv[10] = "The adversary has spread out his hand on all her pleasant things: For she has seen that the nations are entered into her sanctuary, Concerning whom you did command that they should not enter into your assembly.";
vul[10] = "IOTH manum suam misit hostis ad omnia desiderabilia eius quia vidit gentes ingressas sanctuarium suum de quibus praeceperas ne intrarent in ecclesiam tuam";
kjv[11] = "All her people sigh, they seek bread; they have given their pleasant things for meat to relieve the soul: see, O LORD, and consider; for I am become vile.";
rsv[11] = "All her people groan as they search for bread; they trade their treasures for food to revive their strength. &quot;Look, O LORD, and behold, for I am despised.&quot;";
asv[11] = "All her people sigh, they seek bread; They have given their pleasant things for food to refresh the soul: See, O Jehovah, and behold; for I am become abject. ";
yng[11] = "All her people are sighing -- seeking bread, They have given their desirable things For food to refresh the body; See, O Jehovah, and behold attentively, For I have been lightly esteemed.";
dby[11] = "All her people sigh, they seek bread; they have given their precious things for food to revive [their] soul. See, Jehovah, and consider, for I am become vile.";
web[11] = "All her people sigh, they seek bread; they have given their pleasant things for food to relieve the soul: see, O LORD, and consider; for I am become vile.";
hnv[11] = "All her people sigh, they seek bread; They have given their pleasant things for food to refresh the soul: Look, LORD, and see; for I am become abject.";
vul[11] = "CAPH omnis populus eius gemens et quaerens panem dederunt pretiosa quaeque pro cibo ad refocilandam animam vide Domine considera quoniam facta sum vilis";
kjv[12] = "[Is it] nothing to you, all ye that pass by? behold, and see if there be any sorrow like unto my sorrow, which is done unto me, wherewith the LORD hath afflicted [me] in the day of his fierce anger.";
rsv[12] = "&quot;Is it nothing to you, all you who pass by? Look and see if there is any sorrow like my sorrow which was brought upon me, which the LORD inflicted on the day of his fierce anger.";
asv[12] = "Is it nothing to you, all ye that pass by? Behold, and see if there be any sorrow like unto my sorrow, which is brought upon me, Wherewith Jehovah hath afflicted [me] in the day of his fierce anger. ";
yng[12] = "[Is it] nothing to you, all ye passing by the way? Look attentively, and see, If there is any pain like my pain, That He is rolling to me? Whom Jehovah hath afflicted In the day of the fierceness of His anger.";
dby[12] = "Is it nothing to you, all ye that pass by? Behold, and see if there be any sorrow like unto my sorrow, which is done unto me, whom Jehovah hath afflicted in the day of his fierce anger.";
web[12] = "[Is it] nothing to you, all ye that pass by? behold, and see if there is any sorrow like my sorrow, which hath fallen upon me, with which the LORD hath afflicted [me] in the day of his fierce anger.";
hnv[12] = "Is it nothing to you, all you who pass by? Look, and see if there be any sorrow like my sorrow, which is brought on me, With which the LORD has afflicted [me] in the day of his fierce anger.";
vul[12] = "LAMED o vos omnes qui transitis per viam adtendite et videte si est dolor sicut dolor meus quoniam vindemiavit me ut locutus est Dominus in die irae furoris sui";
kjv[13] = "From above hath he sent fire into my bones, and it prevaileth against them: he hath spread a net for my feet, he hath turned me back: he hath made me desolate [and] faint all the day.";
rsv[13] = "&quot;From on high he sent fire; into my bones he made it descend; he spread a net for my feet; he turned me back; he has left me stunned, faint all the day long.";
asv[13] = "From on high hath he sent fire into my bones, and it prevaileth against them; He hath spread a net for my feet, he hath turned me back: He hath made me desolate and faint all the day. ";
yng[13] = "From above He hath sent fire into my bone, And it subdueth it, He hath spread a net for my feet, He hath turned me backward, He hath made me desolate -- all the day sick.";
dby[13] = "From on high hath he sent fire into my bones, and it prevaileth against them; he hath spread a net for my feet; he hath turned me back; he hath made me desolate [and] faint all the day.";
web[13] = "From above hath he sent fire into my bones, and it prevaileth against them: he hath spread a net for my feet, he hath turned me back: he hath made me desolate [and] faint all the day.";
hnv[13] = "From on high has he sent fire into my bones, and it prevails against them; He has spread a net for my feet, he has turned me back: He has made me desolate and faint all the day.";
vul[13] = "MEM de excelso misit ignem in ossibus meis et erudivit me expandit rete pedibus meis convertit me retrorsum posuit me desolatam tota die maerore confectam";
kjv[14] = "The yoke of my transgressions is bound by his hand: they are wreathed, [and] come up upon my neck: he hath made my strength to fall, the Lord hath delivered me into [their] hands, [from whom] I am not able to rise up.";
rsv[14] = "&quot;My transgressions were bound into a yoke; by his hand they were fastened together; they were set upon my neck; he caused my strength to fail; the Lord gave me into the hands of those whom I cannot withstand.";
asv[14] = "The yoke of my transgressions is bound by his hand; They are knit together, they are come up upon my neck; he hath made my strength to fail: The Lord hath delivered me into their hands, against whom I am not able to stand. ";
yng[14] = "Bound hath been the yoke of my transgressions by His hand, They are wrapped together, They have gone up on my neck, He hath caused my power to stumble, The Lord hath given me into hands, I am not able to rise.";
dby[14] = "The yoke of my transgressions is bound by his hand: they are wreathed, they are come up upon my neck; he hath made my strength to fail; the Lord hath delivered me into hands out of which I am not able to rise up.";
web[14] = "The yoke of my transgressions is bound by his hand: they are wreathed, [and] come up upon my neck: he hath made my strength to fall, the Lord hath delivered me into [their] hands, [from whom] I am not able to rise.";
hnv[14] = "The yoke of my transgressions is bound by his hand; They are knit together, they are come up on my neck; he has made my strength to fail: The Lord has delivered me into their hands, against whom I am not able to stand.";
vul[14] = "NUN vigilavit iugum iniquitatum mearum in manu eius convolutae sunt et inpositae collo meo infirmata est virtus mea dedit me Dominus in manu de qua non potero surgere";
kjv[15] = "The Lord hath trodden under foot all my mighty [men] in the midst of me: he hath called an assembly against me to crush my young men: the Lord hath trodden the virgin, the daughter of Judah, [as] in a winepress.";
rsv[15] = "&quot;The LORD flouted all my mighty men in the midst of me; he summoned an assembly against me to crush my young men; the Lord has trodden as in a wine press the virgin daughter of Judah.";
asv[15] = "The Lord hath set at nought all my mighty men in the midst of me; He hath called a solemn assembly against me to crush my young men: The Lord hath trodden as in a winepress the virgin daughter of Judah. ";
yng[15] = "Trodden down all my mighty ones hath the Lord in my midst, He proclaimed against me an appointed time, To destroy my young men, A wine-press hath the Lord trodden, To the virgin daughter of Judah.";
dby[15] = "The Lord hath cast down all my mighty men in the midst of me; he hath called an assembly against me to crush my young men; the Lord hath trodden as a winepress the virgin daughter of Judah.";
web[15] = "The Lord hath trodden under foot all my mighty [men] in the midst of me: he hath called an assembly against me to crush my young men: the Lord hath trodden the virgin, the daughter of Judah, [as] in a wine-press.";
hnv[15] = "The Lord has set at nothing all my mighty men in the midst of me; He has called a solemn assembly against me to crush my young men: The Lord has trodden as in a winepress the virgin daughter of Yehudah.";
vul[15] = "SAMECH abstulit omnes magnificos meos Dominus de medio mei vocavit adversum me tempus ut contereret electos meos torcular calcavit Dominus virgini filiae Iuda";
kjv[16] = "For these [things] I weep; mine eye, mine eye runneth down with water, because the comforter that should relieve my soul is far from me: my children are desolate, because the enemy prevailed.";
rsv[16] = "&quot;For these things I weep; my eyes flow with tears; for a comforter is far from me, one to revive my courage; my children are desolate, for the enemy has prevailed.&quot;";
asv[16] = "For these things I weep; mine eye, mine eye runneth down with water; Because the comforter that should refresh my soul is far from me: My children are desolate, because the enemy hath prevailed. ";
yng[16] = "For these I am weeping, My eye, my eye, is running down with waters, For, far from me hath been a comforter, Refreshing my soul, My sons have been desolate, For mighty hath been an enemy.";
dby[16] = "For these things I weep; mine eye, mine eye runneth down with water: for the comforter that should revive my soul is far from me; my children are desolate, for the enemy hath prevailed.";
web[16] = "For these [things] I weep; my eye, my eye runneth down with water, because the comforter that should relieve my soul is far from me: my children are desolate, because the enemy prevailed.";
hnv[16] = "For these things I weep; my eye, my eye runs down with water; Because the comforter who should refresh my soul is far from me: My children are desolate, because the enemy has prevailed.";
vul[16] = "AIN idcirco ego plorans et oculus meus deducens aquam quia longe factus est a me consolator convertens animam meam facti sunt filii mei perditi quoniam invaluit inimicus";
kjv[17] = "Zion spreadeth forth her hands, [and there is] none to comfort her: the LORD hath commanded concerning Jacob, [that] his adversaries [should be] round about him: Jerusalem is as a menstruous woman among them.";
rsv[17] = "Zion stretches out her hands, but there is none to comfort her; the LORD has commanded against Jacob that his neighbors should be his foes; Jerusalem has become a filthy thing among them.";
asv[17] = "Zion spreadeth forth her hands; there is none to comfort her; Jehovah hath commanded concerning Jacob, that they that are round about him should be his adversaries: Jerusalem is among them as an unclean thing. ";
yng[17] = "Spread forth hath Zion her hands, There is no comforter for her, Jehovah hath charged concerning Jacob, His neighbours [are] his adversaries, Jerusalem hath become impure among them.";
dby[17] = "Zion spreadeth forth her hands; there is none to comfort her; Jehovah hath commanded concerning Jacob, [that] his adversaries [should be] round about him; Jerusalem is as an impurity among them.";
web[17] = "Zion spreadeth forth her hands, [and there is] none to comfort her: the LORD hath commanded concerning Jacob, [that] his adversaries [should be] around him: Jerusalem is as a menstruous woman among them.";
hnv[17] = "Tziyon spreads forth her hands; there is none to comfort her; The LORD has commanded concerning Ya`akov, that those who are round about him should be his adversaries: Yerushalayim is among them as an unclean thing.";
vul[17] = "FE expandit Sion manus suas non est qui consoletur eam mandavit Dominus adversum Iacob in circuitu eius hostes eius facta est Hierusalem quasi polluta menstruis inter eos";
kjv[18] = "The LORD is righteous; for I have rebelled against his commandment: hear, I pray you, all people, and behold my sorrow: my virgins and my young men are gone into captivity.";
rsv[18] = "&quot;The LORD is in the right, for I have rebelled against his word; but hear, all you peoples, and behold my suffering; my maidens and my young men have gone into captivity.";
asv[18] = "Jehovah is righteous; for I have rebelled against his commandment: Hear, I pray you, all ye peoples, and behold my sorrow: My virgins and my young men are gone into captivity. ";
yng[18] = "Righteous is Jehovah, For His mouth I have provoked. Hear, I pray you, all ye peoples, and see my pain, My virgins and my young men have gone into captivity.";
dby[18] = "Jehovah is righteous; for I have rebelled against his commandment. Hear, I pray you, all ye peoples, and behold my sorrow. My virgins and my young men are gone into captivity.";
web[18] = "The LORD is righteous; for I have rebelled against his commandment: hear, I pray you, all people, and behold my sorrow: my virgins and my young men are gone into captivity.";
hnv[18] = "The LORD is righteous; for I have rebelled against his mitzvah: Please hear all you peoples, and see my sorrow: My virgins and my young men are gone into captivity.";
vul[18] = "SADE iustus est Dominus quia os eius ad iracundiam provocavi audite obsecro universi populi et videte dolorem meum virgines meae et iuvenes mei abierunt in captivitatem";
kjv[19] = "I called for my lovers, [but] they deceived me: my priests and mine elders gave up the ghost in the city, while they sought their meat to relieve their souls.";
rsv[19] = "&quot;I called to my lovers but they deceived me; my priests and elders perished in the city, while they sought food to revive their strength.";
asv[19] = "I called for my lovers, [but] they deceived me: My priests and mine elders gave up the ghost in the city, While they sought them food to refresh their souls. ";
yng[19] = "I called for my lovers, they -- they have deceived me, My priests and my elders in the city have expired; When they have sought food for themselves, Then they give back their soul.";
dby[19] = "I called for my lovers, they have deceived me; my priests and mine elders have expired in the city, while they sought them food to revive their soul.";
web[19] = "I called for my lovers, [but] they deceived me: my priests and my elders resigned their breath in the city, while they sought their food to relieve their souls.";
hnv[19] = "I called for my lovers, [but] they deceived me: My Kohanim and my Zakenim gave up the spirit in the city, While they sought them food to refresh their souls.";
vul[19] = "COPH vocavi amicos meos et ipsi deceperunt me sacerdotes mei et senes mei in urbe consumpti sunt quia quaesierunt cibum sibi ut refocilarent animam suam";
kjv[20] = "Behold, O LORD; for I [am] in distress: my bowels are troubled; mine heart is turned within me; for I have grievously rebelled: abroad the sword bereaveth, at home [there is] as death.";
rsv[20] = "&quot;Behold, O LORD, for I am in distress, my soul is in tumult, my heart is wrung within me, because I have been very rebellious. In the street the sword bereaves; in the house it is like death.";
asv[20] = "Behold, O Jehovah; for I am in distress; my heart is troubled; My heart is turned within me; for I have grievously rebelled: Abroad the sword bereaveth, at home there is as death. ";
yng[20] = "See, O Jehovah, for distress [is] to me, My bowels have been troubled, Turned hath been my heart in my midst, For I have greatly provoked, From without bereaved hath the sword, In the house [it is] as death.";
dby[20] = "See, Jehovah, for I am in distress, my bowels are troubled; my heart is turned within me, for I have grievously rebelled: without, the sword hath bereaved [me], within, it is as death.";
web[20] = "Behold, O LORD; for I [am] in distress: my bowels are troubled; my heart is turned within me; for I have grievously rebelled: abroad the sword bereaveth, at home [there is] as death.";
hnv[20] = "See, LORD; for I am in distress; my heart is troubled; My heart is turned within me; for I have grievously rebelled: Abroad the sword bereaves, at home there is as death.";
vul[20] = "RES vide Domine quoniam tribulor venter meus conturbatus est subversum est cor meum in memet ipsa quoniam amaritudine plena sum foris interfecit gladius et domi mors similis est";
kjv[21] = "They have heard that I sigh: [there is] none to comfort me: all mine enemies have heard of my trouble; they are glad that thou hast done [it]: thou wilt bring the day [that] thou hast called, and they shall be like unto me.";
rsv[21] = "&quot;Hear how I groan; there is none to comfort me. All my enemies have heard of my trouble; they are glad that thou hast done it. Bring thou the day thou hast announced, and let them be as I am.";
asv[21] = "They have heard that I sigh; there is none to comfort me; All mine enemies have heard of my trouble; they are glad that thou hast done it: Thou wilt bring the day that thou hast proclaimed, and they shall be like unto me. ";
yng[21] = "They have heard that I have sighed, There is no comforter for me, All my enemies have heard of my calamity, They have rejoiced that Thou hast done [it], Thou hast brought in the day Thou hast called, And they are like to me.";
dby[21] = "They have heard that I sigh: I have no comforter: all mine enemies have heard of my calamity; they are glad that thou hast done it. Thou wilt bring the day that thou hast called, and they shall be like unto me.";
web[21] = "They have heard that I sigh: [there is] none to comfort me: all my enemies have heard of my trouble; they are glad that thou hast done [it]: thou wilt bring the day [that] thou hast called, and they shall be like me.";
hnv[21] = "They have heard that I sigh; there is none to comfort me; All my enemies have heard of my trouble; they are glad that you have done it: You will bring the day that you have proclaimed, and they shall be like me.";
vul[21] = "SEN audierunt quia ingemesco ego et non est qui consoletur me omnes inimici mei audierunt malum meum laetati sunt quoniam tu fecisti adduxisti diem consolationis et fient similes mei";
kjv[22] = "Let all their wickedness come before thee; and do unto them, as thou hast done unto me for all my transgressions: for my sighs [are] many, and my heart [is] faint.";
rsv[22] = "&quot;Let all their evil doing come before thee; and deal with them as thou hast dealt with me because of all my transgressions; for my groans are many and my heart is faint.&quot;";
asv[22] = "Let all their wickedness come before thee; And do unto them, as thou hast done unto me for all my transgressions: For my sighs are many, and my heart is faint. ";
yng[22] = "Come in doth all their evil before Thee, And one is doing to them as Thou hast done to me, For all my transgressions, For many [are] my sighs, and my heart [is] sick!";
dby[22] = "Let all their wickedness come before thee; and do unto them, as thou hast done unto me for all my transgressions: for my sighs are many, and my heart is faint.";
web[22] = "Let all their wickedness come before thee; and do to them, as thou hast done to me for all my transgressions: for my sighs [are] many, and my heart [is] faint.";
hnv[22] = "Let all their wickedness come before you; Do to them, as you have done to me for all my transgressions: For my sighs are many, and my heart is faint.";
vul[22] = "THAU ingrediatur omne malum eorum coram te et devindemia eos sicut vindemiasti me propter omnes iniquitates meas multi enim gemitus mei et cor meum maerens";
