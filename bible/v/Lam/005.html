csb[1] = "LORD, remember what has happened to us. Look, and see our disgrace!";
csb[2] = "Our inheritance has been turned over to strangers, our houses to foreigners.";
csb[3] = "We have become orphans, fatherless; our mothers are widows.";
csb[4] = "We must pay for the water we drink; our wood comes at a price.";
csb[5] = "We are closely pursued; we are tired, and no one offers us rest.";
csb[6] = "We made a treaty with Egypt and with Assyria, to get enough food.";
csb[7] = "Our fathers sinned; they no longer exist, but we bear their punishment.";
csb[8] = "Slaves rule over us; no one rescues us from them.";
csb[9] = "We secure our food at the risk of our lives because of the sword in the wilderness.";
csb[10] = "Our skin is as hot as an oven from the ravages of hunger.";
csb[11] = "Women have been raped in Zion, virgins in the cities of Judah.";
csb[12] = "Princes have been hung up by their hands; elders are shown no respect.";
csb[13] = "Young men labor at millstones; boys stumble under loads of wood.";
csb[14] = "The elders have left the city gate, the young men, their music.";
csb[15] = "Joy has left our hearts; our dancing has turned to mourning.";
csb[16] = "The crown has fallen from our head. Woe to us, for we have sinned.";
csb[17] = "Because of this, our heart is sick; because of these, our eyes grow dim:";
csb[18] = "because of Mount Zion, which lies desolate and has jackals prowling in it.";
csb[19] = "You, LORD, are enthroned forever; your throne endures from generation to generation.";
csb[20] = "Why do you continually forget us, abandon us for our entire lives?";
csb[21] = "LORD, bring us back to yourself, so we may return; renew our days as in former times,";
