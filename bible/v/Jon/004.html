csb[1] = "Jonah was greatly displeased and became furious.";
csb[2] = "He prayed to the LORD: &quot;Please, LORD, isn\'t this what I thought while I was still in my own country? That\'s why I fled toward Tarshish in the first place. I knew that you are a gracious and compassionate God, slow to anger, abounding in faithful love, and one who relents from sending disaster.";
csb[3] = "&quot;And now, LORD, take my life from me, for it is better for me to die than to live.&quot;";
csb[4] = "The LORD asked, &quot;Is it right for you to be angry? &quot;";
csb[5] = "Jonah left the city and found a place east of it. He made himself a shelter there and sat in its shade to see what would happen to the city.";
csb[6] = "Then the LORD God appointed a plant, and it grew over Jonah to provide shade for his head to rescue him from his trouble. Jonah was greatly pleased with the plant.";
csb[7] = "When dawn came the next day, God appointed a worm that attacked the plant, and it withered.";
csb[8] = "As the sun was rising, God appointed a scorching east wind. The sun beat down on Jonah\'s head so much that he almost fainted, and he wanted to die. He said, &quot;It\'s better for me to die than to live.&quot;";
csb[9] = "Then God asked Jonah, &quot;Is it right for you to be angry about the plant? &quot; &quot;Yes, it\'s right! &quot; he replied. &quot;I\'m angry enough to die! &quot;";
csb[10] = "So the LORD said, &quot;You cared about the plant, which you did not labor over and did not grow. It appeared in a night and perished in a night.";
csb[11] = "&quot;But may I not care about the great city of Nineveh, which has more than a hundred and twenty thousand people who cannot distinguish between their right and their left, as well as many animals? &quot;";

kjv[2] = "And he prayed unto the LORD, and said, I pray thee, O LORD, [was] not this my saying, when I was yet in my country? Therefore I fled before unto Tarshish: for I knew that thou [art] a gracious God, and merciful, slow to anger, and of great kindness, and repentest thee of the evil.";
