csb[1] = "The word of the LORD came to Jonah son of Amittai:";
csb[2] = "&quot;Get up! Go to the great city of Nineveh and preach against it because their evil has come up before me.&quot;";
csb[3] = "Jonah got up to flee to Tarshish from the LORD\'s presence. He went down to Joppa and found a ship going to Tarshish. He paid the fare and went down into it to go with them to Tarshish from the LORD\'s presence.";
csb[4] = "But the LORD threw a great wind onto the sea, and such a great storm arose on the sea that the ship threatened to break apart.";
csb[5] = "The sailors were afraid, and each cried out to his god. They threw the ship\'s cargo into the sea to lighten the load. Meanwhile, Jonah had gone down to the lowest part of the vessel and had stretched out and fallen into a deep sleep.";
csb[6] = "The captain approached him and said, &quot;What are you doing sound asleep? Get up! Call to your god. Maybe this god will consider us, and we won\'t perish.&quot;";
csb[7] = "&quot;Come on! &quot; the sailors said to each other. &quot;Let\'s cast lots. Then we\'ll know who is to blame for this trouble we\'re in.&quot; So they cast lots, and the lot singled out Jonah.";
csb[8] = "Then they said to him, &quot;Tell us who is to blame for this trouble we\'re in. What is your business, and where are you from? What is your country, and what people are you from? &quot;";
csb[9] = "He answered them, &quot;I\'m a Hebrew. I worship the LORD, the God of the heavens, who made the sea and the dry land.&quot;";
csb[10] = "Then the men were seized by a great fear and said to him, &quot;What is this you\'ve done? &quot; The men knew he was fleeing from the LORD\'s presence because he had told them.";
csb[11] = "So they said to him, &quot;What should we do to you so that the sea will calm down for us? &quot; For the sea was getting worse and worse.";
csb[12] = "He answered them, &quot;Pick me up and throw me into the sea so that it will calm down for you, for I know that I\'m to blame for this great storm that is against you.&quot;";
csb[13] = "Nevertheless, the men rowed hard to get back to dry land, but they couldn\'t because the sea was raging against them more and more.";
csb[14] = "So they called out to the LORD: &quot;Please, LORD, don\'t let us perish because of this man\'s life, and don\'t charge us with innocent blood! For you, LORD, have done just as you pleased.&quot;";
csb[15] = "Then they picked up Jonah and threw him into the sea, and the sea stopped its raging.";
csb[16] = "The men were seized by great fear of the LORD, and they offered a sacrifice to the LORD and made vows.";
csb[17] = "The LORD appointed a great fish to swallow Jonah, and Jonah was in the belly of the fish three days and three nights.";
