csb[1] = "Children, obey your parents in the Lord, because this is right.";
csb[2] = "Honor your father and mother, which is the first commandment with a promise,";
csb[3] = "so that it may go well with you and that you may have a long life in the land.";
csb[4] = "Fathers, don\'t stir up anger in your children, but bring them up in the training and instruction of the Lord.";
csb[5] = "Slaves, obey your human masters with fear and trembling, in the sincerity of your heart, as you would Christ.";
csb[6] = "Don\'t work only while being watched, as people-pleasers, but as slaves of Christ, do God\'s will from your heart.";
csb[7] = "Serve with a good attitude, as to the Lord and not to people,";
csb[8] = "knowing that whatever good each one does, slave or free, he will receive this back from the Lord.";
csb[9] = "And masters, treat your slaves the same way, without threatening them, because you know that both their Master and yours is in heaven, and there is no favoritism with him.";
csb[10] = "Finally, be strengthened by the Lord and by his vast strength.";
csb[11] = "Put on the full armor of God so that you can stand against the schemes of the devil.";
csb[12] = "For our struggle is not against flesh and blood, but against the rulers, against the authorities, against the cosmic powers of this darkness, against evil, spiritual forces in the heavens.";
csb[13] = "For this reason take up the full armor of God, so that you may be able to resist in the evil day, and having prepared everything, to take your stand.";
csb[14] = "Stand, therefore, with truth like a belt around your waist, righteousness like armor on your chest,";
csb[15] = "and your feet sandaled with readiness for the gospel of peace.";
csb[16] = "In every situation take up the shield of faith with which you can extinguish all the flaming arrows of the evil one.";
csb[17] = "Take the helmet of salvation and the sword of the Spirit -- which is the word of God.";
csb[18] = "Pray at all times in the Spirit with every prayer and request, and stay alert with all perseverance and intercession for all the saints.";
csb[19] = "Pray also for me, that the message may be given to me when I open my mouth to make known with boldness the mystery of the gospel.";
csb[20] = "For this I am an ambassador in chains. Pray that I might be bold enough to speak about it as I should.";
csb[21] = "Tychicus, our dearly loved brother and faithful servant in the Lord, will tell you all the news about me so that you may be informed.";
csb[22] = "I am sending him to you for this very reason, to let you know how we are and to encourage your hearts.";
csb[23] = "Peace to the brothers and sisters, and love with faith, from God the Father and the Lord Jesus Christ.";
csb[24] = "Grace be with all who have undying love for our Lord Jesus Christ.";
