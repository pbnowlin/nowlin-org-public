csb[1] = "And you were dead in your trespasses and sins";
csb[2] = "in which you previously lived according to the ways of this world, according to the ruler of the power of the air, the spirit now working in the disobedient.";
csb[3] = "We too all previously lived among them in our fleshly desires, carrying out the inclinations of our flesh and thoughts, and we were by nature children under wrath as the others were also.";
csb[4] = "But God, who is rich in mercy, because of his great love that he had for us,";
csb[5] = "made us alive with Christ even though we were dead in trespasses. You are saved by grace!";
csb[6] = "He also raised us up with him and seated us with him in the heavens in Christ Jesus,";

csb[8] = "For you are saved by grace through faith, and this is not from yourselves; it is God\'s gift --";
csb[9] = "not from works, so that no one can boast.";
csb[10] = "For we are his workmanship, created in Christ Jesus for good works, which God prepared ahead of time for us to do.";
csb[11] = "So then, remember that at one time you were Gentiles in the flesh -- called &quot;the uncircumcised&quot; by those called &quot;the circumcised,&quot; which is done in the flesh by human hands.";
csb[12] = "At that time you were without Christ, excluded from the citizenship of Israel, and foreigners to the covenants of promise, without hope and without God in the world.";
csb[13] = "But now in Christ Jesus, you who were far away have been brought near by the blood of Christ.";
csb[14] = "For he is our peace, who made both groups one and tore down the dividing wall of hostility. In his flesh,";
csb[15] = "he made of no effect the law consisting of commands and expressed in regulations, so that he might create in himself one new man from the two, resulting in peace.";
csb[16] = "He did this so that he might reconcile both to God in one body through the cross by which he put the hostility to death.";
csb[17] = "He came and proclaimed the good news of peace to you who were far away and peace to those who were near.";

csb[19] = "So then you are no longer foreigners and strangers, but fellow citizens with the saints, and members of God\'s household,";
csb[20] = "built on the foundation of the apostles and prophets, with Christ Jesus himself as the cornerstone.";
csb[21] = "In him the whole building, being put together, grows into a holy temple in the Lord.";
csb[22] = "In him you are also being built together for God\'s dwelling in the Spirit.";
