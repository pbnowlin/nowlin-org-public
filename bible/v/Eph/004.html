csb[1] = "Therefore I, the prisoner in the Lord, urge you to live worthy of the calling you have received,";
csb[2] = "with all humility and gentleness, with patience, bearing with one another in love,";
csb[3] = "making every effort to keep the unity of the Spirit through the bond of peace.";
csb[4] = "There is one body and one Spirit -- just as you were called to one hope at your calling --";
csb[5] = "one Lord, one faith, one baptism,";
csb[6] = "one God and Father of all, who is above all and through all and in all.";
csb[7] = "Now grace was given to each one of us according to the measure of Christ\'s gift.";
csb[8] = "For it says: When he ascended on high, he took the captives captive; he gave gifts to people.";
csb[9] = "But what does &quot;he ascended&quot; mean except that he also descended to the lower parts of the earth?";
csb[10] = "The one who descended is also the one who ascended far above all the heavens, to fill all things.";
csb[11] = "And he himself gave some to be apostles, some prophets, some evangelists, some pastors and teachers,";
csb[12] = "equipping the saints for the work of ministry, to build up the body of Christ,";
csb[13] = "until we all reach unity in the faith and in the knowledge of God\'s Son, growing into maturity with a stature measured by Christ\'s fullness.";
csb[14] = "Then we will no longer be little children, tossed by the waves and blown around by every wind of teaching, by human cunning with cleverness in the techniques of deceit.";
csb[15] = "But speaking the truth in love, let us grow in every way into him who is the head -- Christ.";
csb[16] = "From him the whole body, fitted and knit together by every supporting ligament, promotes the growth of the body for building up itself in love by the proper working of each individual part.";
csb[17] = "Therefore, I say this and testify in the Lord: You should no longer live as the Gentiles live, in the futility of their thoughts.";
csb[18] = "They are darkened in their understanding, excluded from the life of God, because of the ignorance that is in them and because of the hardness of their hearts.";
csb[19] = "They became callous and gave themselves over to promiscuity for the practice of every kind of impurity with a desire for more and more.";
csb[20] = "But that is not how you came to know Christ,";
csb[21] = "assuming you heard about him and were taught by him, as the truth is in Jesus,";
csb[22] = "to take off your former way of life, the old self that is corrupted by deceitful desires,";
csb[23] = "to be renewed in the spirit of your minds,";
csb[24] = "and to put on the new self, the one created according to God\'s likeness in righteousness and purity of the truth.";
csb[25] = "Therefore, putting away lying, speak the truth, each one to his neighbor, because we are members of one another.";
csb[26] = "Be angry and do not sin. Don\'t let the sun go down on your anger,";
csb[27] = "and don\'t give the devil an opportunity.";
csb[28] = "Let the thief no longer steal. Instead, he is to do honest work with his own hands, so that he has something to share with anyone in need.";
csb[29] = "No foul language should come from your mouth, but only what is good for building up someone in need, so that it gives grace to those who hear.";
csb[30] = "And don\'t grieve God\'s Holy Spirit. You were sealed by him for the day of redemption.";
csb[31] = "Let all bitterness, anger and wrath, shouting and slander be removed from you, along with all malice.";
csb[32] = "And be kind and compassionate to one another, forgiving one another, just as God also forgave you in Christ.";

vul[25] = "propter quod deponentes mendacium loquimini veritatem unusquisque cum proximo suo quoniam sumus invicem membra";
kjv[26] = "Be ye angry, and sin not: let not the sun go down upon your wrath:";
rsv[26] = "Be angry but do not sin; do not let the sun go down on your anger,";
asv[26] = "Be ye angry, and sin not: let not the sun go down upon your wrath:";
yng[26] = "be angry and do not sin; let not the sun go down upon your wrath,";
dby[26] = "Be angry, and do not sin; let not the sun set upon your wrath,";
web[26] = "Be ye angry, and sin not: let not the sun go down upon your wrath:";
hnv[26] = "&quot;Be angry, and don\'t sin.&quot; Don\'t let the sun go down on your wrath,";
vul[26] = "irascimini et nolite peccare sol non occidat super iracundiam vestram";
kjv[27] = "Neither give place to the devil.";
rsv[27] = "and give no opportunity to the devil.";
asv[27] = "neither give place to the devil.";
yng[27] = "neither give place to the devil;";
dby[27] = "neither give room for the devil.";
web[27] = "Neither give place to the devil.";
hnv[27] = "neither give place to the devil.";
vul[27] = "nolite locum dare diabolo";
kjv[28] = "Let him that stole steal no more: but rather let him labour, working with [his] hands the thing which is good, that he may have to give to him that needeth.";
rsv[28] = "Let the thief no longer steal, but rather let him labor, doing honest work with his hands, so that he may be able to give to those in need.";
asv[28] = "Let him that stole steal no more: but rather let him labor, working with his hands the thing that is good, that he may have whereof to give to him that hath need.";
yng[28] = "whoso is stealing let him no more steal, but rather let him labour, working the thing that is good with the hands, that he may have to impart to him having need.";
dby[28] = "Let the stealer steal no more, but rather let him toil, working what is honest with [his] hands, that he may have to distribute to him that has need.";
web[28] = "Let him that stole steal no more: but rather let him labor, working with [his] hands the thing which is good, that he may have to give to him that needeth.";
hnv[28] = "Let him who stole steal no more; but rather let him labor, working with his hands the thing that is good, that he may have something to give to him who has need.";
vul[28] = "qui furabatur iam non furetur magis autem laboret operando manibus quod bonum est ut habeat unde tribuat necessitatem patienti";
kjv[29] = "Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers.";
rsv[29] = "Let no evil talk come out of your mouths, but only such as is good for edifying, as fits the occasion, that it may impart grace to those who hear.";
asv[29] = "Let no corrupt speech proceed out of your mouth, but such as is good for edifying as the need may be, that it may give grace to them that hear.";
yng[29] = "Let no corrupt word out of your mouth go forth, but what is good unto the needful building up, that it may give grace to the hearers;";
dby[29] = "Let no corrupt word go out of your mouth, but if [there be] any good one for needful edification, that it may give grace to those that hear [it].";
web[29] = "Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace to the hearers.";
hnv[29] = "Let no corrupt speech proceed out of your mouth, but such as is good for building up as the need may be, that it may give grace to those who hear.";
vul[29] = "omnis sermo malus ex ore vestro non procedat sed si quis bonus ad aedificationem oportunitatis ut det gratiam audientibus";
kjv[30] = "And grieve not the holy Spirit of God, whereby ye are sealed unto the day of redemption.";
rsv[30] = "And do not grieve the Holy Spirit of God, in whom you were sealed for the day of redemption.";
asv[30] = "And grieve not the Holy Spirit of God, in whom ye were sealed unto the day of redemption.";
yng[30] = "and make not sorrowful the Holy Spirit of God, in which ye were sealed to a day of redemption.";
dby[30] = "And do not grieve the Holy Spirit of God, with which ye have been sealed for [the] day of redemption.";
web[30] = "And grieve not the holy Spirit of God, whereby ye are sealed to the day of redemption.";
hnv[30] = "Don\'t grieve the Ruach HaKodesh of God, in whom you were sealed for the day of redemption.";
vul[30] = "et nolite contristare Spiritum Sanctum Dei in quo signati estis in die redemptionis";
kjv[31] = "Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice:";
rsv[31] = "Let all bitterness and wrath and anger and clamor and slander be put away from you, with all malice,";
asv[31] = "Let all bitterness, and wrath, and anger, and clamor, and railing, be put away from you, with all malice:";
yng[31] = "Let all bitterness, and wrath, and anger, and clamour, and evil-speaking, be put away from you, with all malice,";
dby[31] = "Let all bitterness, and heat of passion, and wrath, and clamour, and injurious language, be removed from you, with all malice;";
web[31] = "Let all bitterness, and wrath, and anger, and clamor, and evil-speaking, be put away from you, with all malice:";
hnv[31] = "Let all bitterness, wrath, anger, outcry, and slander, be put away from you, with all malice.";
vul[31] = "omnis amaritudo et ira et indignatio et clamor et blasphemia tollatur a vobis cum omni malitia";
kjv[32] = "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ\'s sake hath forgiven you.";
rsv[32] = "and be kind to one another, tenderhearted, forgiving one another, as God in Christ forgave you.";
asv[32] = "and be ye kind one to another, tenderhearted, forgiving each other, even as God also in Christ forgave you.";
yng[32] = "and become one to another kind, tender-hearted, forgiving one another, according as also God in Christ did forgive you.";
dby[32] = "and be to one another kind, compassionate, forgiving one another, so as God also in Christ has forgiven you.";
web[32] = "And be ye kind one to another, tender-hearted, forgiving one another, even as God for Christ\'s sake hath forgiven you.";
hnv[32] = "And be kind to one another, tenderhearted, forgiving each other, just as God also in Messiah forgave you.";
vul[32] = "estote autem invicem benigni misericordes donantes invicem sicut et Deus in Christo donavit nobis";
