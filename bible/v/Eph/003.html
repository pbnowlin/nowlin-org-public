csb[2] = "you have heard, haven\'t you, about the administration of God\'s grace that he gave to me for you?";
csb[3] = "The mystery was made known to me by revelation, as I have briefly written above.";
csb[4] = "By reading this you are able to understand my insight into the mystery of Christ.";

csb[6] = "The Gentiles are coheirs, members of the same body, and partners in the promise in Christ Jesus through the gospel.";
csb[7] = "I was made a servant of this gospel by the gift of God\'s grace that was given to me by the working of his power.";

csb[9] = "and to shed light for all about the administration of the mystery hidden for ages in God who created all things.";

csb[11] = "This is according to his eternal purpose accomplished in Christ Jesus our Lord.";
csb[12] = "In him we have boldness and confident access through faith in him.";
csb[13] = "So then I ask you not to be discouraged over my afflictions on your behalf, for they are your glory.";
csb[14] = "For this reason I kneel before the Father";
csb[15] = "from whom every family in heaven and on earth is named.";
csb[16] = "I pray that he may grant you, according to the riches of his glory, to be strengthened with power in your inner being through his Spirit,";

csb[19] = "and to know Christ\'s love that surpasses knowledge, so that you may be filled with all the fullness of God.";
csb[20] = "Now to him who is able to do above and beyond all that we ask or think according to the power that works in us --";
