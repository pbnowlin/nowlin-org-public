csb[1] = "The Song of Songs, which is Solomon\'s.";
csb[2] = "Oh, that he would kiss me with the kisses of his mouth! For your caresses are more delightful than wine.";
csb[3] = "The fragrance of your perfume is intoxicating; your name is perfume poured out. No wonder young women adore you.";
csb[4] = "Take me with you -- let\'s hurry. Oh, that the king would bring me to his chambers. We will rejoice and be glad in you; we will celebrate your caresses more than wine. It is only right that they adore you.";
csb[5] = "Daughters of Jerusalem, I am dark like the tents of Kedar, yet lovely like the curtains of Solomon.";
csb[6] = "Do not stare at me because I am dark, for the sun has gazed on me. My mother\'s sons were angry with me; they made me take care of the vineyards. I have not taken care of my own vineyard.";
csb[7] = "Tell me, you whom I love: Where do you pasture your sheep? Where do you let them rest at noon? Why should I be like one who veils herself beside the flocks of your companions?";
csb[8] = "If you do not know, most beautiful of women, follow the tracks of the flock, and pasture your young goats near the shepherds\' tents.";
csb[9] = "I compare you, my darling, to a mare among Pharaoh\'s chariots.";
csb[10] = "Your cheeks are beautiful with jewelry, your neck with its necklace.";
csb[11] = "We will make gold jewelry for you, accented with silver.";
csb[12] = "While the king is on his couch, my perfume releases its fragrance.";
csb[13] = "The one I love is a sachet of myrrh to me, spending the night between my breasts.";
csb[14] = "The one I love is a cluster of henna blossoms to me, in the vineyards of En-gedi.";
csb[15] = "How beautiful you are, my darling. How very beautiful! Your eyes are doves.";
csb[16] = "How handsome you are, my love. How delightful! Our bed is verdant;";
csb[17] = "the beams of our house are cedars, and our rafters are cypresses.";
