csb[1] = "In my bed at night I sought the one I love; I sought him, but did not find him.";
csb[2] = "I will arise now and go about the city, through the streets and the plazas. I will seek the one I love. I sought him, but did not find him.";
csb[3] = "The guards who go about the city found me. I asked them, &quot;Have you seen the one I love? &quot;";
csb[4] = "I had just passed them when I found the one I love. I held on to him and would not let him go until I brought him to my mother\'s house -- to the chamber of the one who conceived me.";
csb[5] = "Young women of Jerusalem, I charge you by the gazelles and the wild does of the field, do not stir up or awaken love until the appropriate time.";
csb[6] = "Who is this coming up from the wilderness like columns of smoke, scented with myrrh and frankincense from every fragrant powder of the merchant?";
csb[7] = "Look! Solomon\'s bed surrounded by sixty warriors from the mighty men of Israel.";
csb[8] = "All of them are skilled with swords and trained in warfare. Each has his sword at his side to guard against the terror of the night.";
csb[9] = "King Solomon made a carriage for himself with wood from Lebanon.";
csb[10] = "He made its posts of silver, its back of gold, and its seat of purple. Its interior is inlaid with love by the young women of Jerusalem.";
csb[11] = "Go out, young women of Zion, and gaze at King Solomon, wearing the crown his mother placed on him on the day of his wedding -- the day of his heart\'s rejoicing.";
