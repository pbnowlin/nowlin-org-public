csb[1] = "How beautiful you are, my darling. How very beautiful! Behind your veil, your eyes are doves. Your hair is like a flock of goats streaming down Mount Gilead.";
csb[2] = "Your teeth are like a flock of newly shorn sheep coming up from washing, each one bearing twins, and none has lost its young.";
csb[3] = "Your lips are like a scarlet cord, and your mouth is lovely. Behind your veil, your brow is like a slice of pomegranate.";
csb[4] = "Your neck is like the tower of David, constructed in layers. A thousand shields are hung on it -- all of them shields of warriors.";
csb[5] = "Your breasts are like two fawns, twins of a gazelle, that feed among the lilies.";
csb[6] = "Until the day breaks and the shadows flee, I will make my way to the mountain of myrrh and the hill of frankincense.";
csb[7] = "You are absolutely beautiful, my darling; there is no imperfection in you.";
csb[8] = "Come with me from Lebanon, my bride; come with me from Lebanon! Descend from the peak of Amana, from the summit of Senir and Hermon, from the dens of the lions, from the mountains of the leopards.";
csb[9] = "You have captured my heart, my sister, my bride. You have captured my heart with one glance of your eyes, with one jewel of your necklace.";
csb[10] = "How delightful your caresses are, my sister, my bride. Your caresses are much better than wine, and the fragrance of your perfume than any balsam.";
csb[11] = "Your lips drip sweetness like the honeycomb, my bride. Honey and milk are under your tongue. The fragrance of your garments is like the fragrance of Lebanon.";
csb[12] = "My sister, my bride, you are a locked garden -- a locked garden and a sealed spring.";
csb[13] = "Your branches are a paradise of pomegranates with choicest fruits; henna with nard,";
csb[14] = "nard and saffron, calamus and cinnamon, with all the trees of frankincense, myrrh and aloes, with all the best spices.";
csb[15] = "You are a garden spring, a well of flowing water streaming from Lebanon.";
csb[16] = "Awaken, north wind; come, south wind. Blow on my garden, and spread the fragrance of its spices. Let my love come to his garden and eat its choicest fruits.";
kjv[1] = "Behold, thou [art] fair, my love; behold, thou [art] fair; thou [hast] doves\' eyes within thy locks: thy hair [is] as a flock of goats, that appear from mount Gilead.";
rsv[1] = "Behold, you are beautiful, my love, behold, you are beautiful! Your eyes are doves behind your veil. Your hair is like a flock of goats, moving down the slopes of Gilead.";
asv[1] = "Behold, thou art fair, my love; behold, thou art fair; Thine eyes are [as] doves behind thy veil. Thy hair is as a flock of goats, That lie along the side of mount Gilead. ";
yng[1] = "Lo, thou [art] fair, my friend, lo, thou [art] fair, Thine eyes [are] doves behind thy veil, Thy hair as a row of the goats That have shone from mount Gilead,";
dby[1] = "Behold, thou art fair, my love; behold, thou art fair; Thine eyes are doves behind thy veil; Thy hair is as a flock of goats, On the slopes of mount Gilead.";
web[1] = "Behold, thou [art] fair, my love; behold, thou [art] fair; thou [hast] doves\' eyes within thy locks: thy hair [is] as a flock of goats, that appear from mount Gilead.";
hnv[1] = "Behold, you are beautiful, my love. Behold, you are beautiful. Your eyes are doves behind your veil. Your hair is as a flock of goats, That descend from Mount Gil`ad.";
vul[1] = "quam pulchra es amica mea quam pulchra es oculi tui columbarum absque eo quod intrinsecus latet capilli tui sicut greges caprarum quae ascenderunt de monte Galaad";
kjv[2] = "Thy teeth [are] like a flock [of sheep that are even] shorn, which came up from the washing; whereof every one bear twins, and none [is] barren among them.";
rsv[2] = "Your teeth are like a flock of shorn ewes that have come up from the washing, all of which bear twins, and not one among them is bereaved.";
asv[2] = "Thy teeth are like a flock [of ewes] that are [newly] shorn, Which are come up from the washing, Whereof every one hath twins, And none is bereaved among them. ";
yng[2] = "Thy teeth as a row of the shorn ones That have come up from the washing, For all of them are forming twins, And a bereaved one is not among them.";
dby[2] = "Thy teeth are like a flock of shorn sheep, Which go up from the washing; Which have all borne twins, And none is barren among them.";
web[2] = "Thy teeth [are] like a flock [of sheep that are even] shorn, which came up from the washing; all of which bear twins, and none [is] barren among them.";
hnv[2] = "Your teeth are like a newly shorn flock, Which have come up from the washing, Where every one of them has twins. None is bereaved among them.";
vul[2] = "dentes tui sicut greges tonsarum quae ascenderunt de lavacro omnes gemellis fetibus et sterilis non est inter eas";
kjv[3] = "Thy lips [are] like a thread of scarlet, and thy speech [is] comely: thy temples [are] like a piece of a pomegranate within thy locks.";
rsv[3] = "Your lips are like a scarlet thread, and your mouth is lovely. Your cheeks are like halves of a pomegranate behind your veil.";
asv[3] = "Thy lips are like a thread of scarlet, And thy mouth is comely. Thy temples are like a piece of a pomegranate Behind thy veil. ";
yng[3] = "As a thread of scarlet [are] thy lips, And thy speech [is] comely, As the work of the pomegranate [is] thy temple behind thy veil,";
dby[3] = "Thy lips are like a thread of scarlet, And thy speech is comely; As a piece of a pomegranate are thy temples Behind thy veil.";
web[3] = "Thy lips [are] like a thread of scarlet, and thy speech [is] comely: thy temples [are] like a piece of pomegranate within thy locks.";
hnv[3] = "Your lips are like scarlet thread. Your mouth is lovely. Your temples are like a piece of a pomegranate behind your veil.";
vul[3] = "sicut vitta coccinea labia tua et eloquium tuum dulce sicut fragmen mali punici ita genae tuae absque eo quod intrinsecus latet";
kjv[4] = "Thy neck [is] like the tower of David builded for an armoury, whereon there hang a thousand bucklers, all shields of mighty men.";
rsv[4] = "Your neck is like the tower of David, built for an arsenal, whereon hang a thousand bucklers, all of them shields of warriors.";
asv[4] = "Thy neck is like the tower of David builded for an armory, Whereon there hang a thousand bucklers, All the shields of the mighty men. ";
yng[4] = "As the tower of David [is] thy neck, built for an armoury, The chief of the shields are hung on it, All shields of the mighty.";
dby[4] = "Thy neck is like the tower of David, Built for an armoury: A thousand bucklers hang thereon, All shields of mighty men.";
web[4] = "Thy neck [is] like the tower of David built for an armory, on which hang a thousand bucklers, all shields of mighty men.";
hnv[4] = "Your neck is like David\'s tower built for an armory, Whereon there hang a thousand shields, All the shields of the mighty men.";
vul[4] = "sicut turris David collum tuum quae aedificata est cum propugnaculis mille clypei pendent ex ea omnis armatura fortium";

kjv[6] = "Until the day break, and the shadows flee away, I will get me to the mountain of myrrh, and to the hill of frankincense.";
rsv[6] = "Until the day breathes and the shadows flee, I will hie me to the mountain of myrrh and the hill of frankincense.";
asv[6] = "Until the day be cool, and the shadows flee away, I will get me to the mountain of myrrh, And to the hill of frankincense. ";
yng[6] = "Till the day doth break forth, And the shadows have fled away, I will get me unto the mountain of myrrh, And unto the hill of frankincense.";
dby[6] = "Until the day dawn, and the shadows flee away, I will get me to the mountain of myrrh, And to the hill of frankincense.";
web[6] = "Until the day shall break, and the shadows flee away, I will repair to the mountain of myrrh, and to the hill of frankincense.";
hnv[6] = "Until the day is cool, and the shadows flee away, I will go to the mountain of myrrh, To the hill of frankincense.";

rsv[7] = "You are all fair, my love; there is no flaw in you.";
asv[7] = "Thou art all fair, my love; And there is no spot in thee. ";
yng[7] = "Thou [art] all fair, my friend, And a blemish there is not in thee. Come from Lebanon, O spouse,";
dby[7] = "Thou art all fair, my love; And there is no spot in thee.";
web[7] = "Thou [art] all fair, my love; [there is] no spot in thee.";
hnv[7] = "You are all beautiful, my love. There is no spot in you.";
vul[7] = "tota pulchra es amica mea et macula non est in te";

rsv[8] = "Come with me from Lebanon, my bride; come with me from Lebanon. Depart from the peak of Ama\'na, from the peak of Senir and Hermon, from the dens of lions, from the mountains of leopards.";
asv[8] = "Come with me from Lebanon, [my] bride, With me from Lebanon: Look from the top of Amana, From the top of Senir and Hermon, From the lions\' dens, From the mountains of the leopards. ";
yng[8] = "Come from Lebanon, come thou in. Look from the top of Amana, From the top of Shenir and Hermon, From the habitations of lions, From the mountains of leopards.";

rsv[10] = "How sweet is your love, my sister, my bride! how much better is your love than wine, and the fragrance of your oils than any spice!";
asv[10] = "How fair is thy love, my sister, [my] bride! How much better is thy love than wine! And the fragrance of thine oils than all manner of spices! ";
yng[10] = "How wonderful have been thy loves, my sister-spouse, How much better have been thy loves than wine, And the fragrance of thy perfumes than all spices.";
dby[10] = "How fair is thy love, my sister, [my] spouse! How much better is thy love than wine! And the fragrance of thine ointments than all spices!";

hnv[10] = "How beautiful is your love, my sister, my bride! How much better is your love than wine! The fragrance of your perfumes than all manner of spices!";
