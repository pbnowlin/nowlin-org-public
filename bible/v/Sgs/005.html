csb[1] = "I have come to my garden -- my sister, my bride. I gather my myrrh with my spices. I eat my honeycomb with my honey. I drink my wine with my milk. Eat, friends! Drink, be intoxicated with caresses!";
csb[2] = "I was sleeping, but my heart was awake. A sound! My love was knocking! Open to me, my sister, my darling, my dove, my perfect one. For my head is drenched with dew, my hair with droplets of the night.";
csb[3] = "I have taken off my clothing. How can I put it back on? I have washed my feet. How can I get them dirty?";
csb[4] = "My love thrust his hand through the opening, and my feelings were stirred for him.";
csb[5] = "I rose to open for my love. My hands dripped with myrrh, my fingers with flowing myrrh on the handles of the bolt.";
csb[6] = "I opened to my love, but my love had turned and gone away. My heart sank because he had left. I sought him, but did not find him. I called him, but he did not answer.";
csb[7] = "The guards who go about the city found me. They beat and wounded me; they took my cloak from me -- the guardians of the walls.";
csb[8] = "Young women of Jerusalem, I charge you, if you find my love, tell him that I am lovesick.";
csb[9] = "What makes the one you love better than another, most beautiful of women? What makes him better than another, that you would give us this charge?";
csb[10] = "My love is fit and strong, notable among ten thousand.";
csb[11] = "His head is purest gold. His hair is wavy and black as a raven.";
csb[12] = "His eyes are like doves beside flowing streams, washed in milk and set like jewels.";
csb[13] = "His cheeks are like beds of spice, mounds of perfume. His lips are lilies, dripping with flowing myrrh.";
csb[14] = "His arms are rods of gold set with beryl. His body is an ivory panel covered with lapis lazuli.";
csb[15] = "His legs are alabaster pillars set on pedestals of pure gold. His presence is like Lebanon, as majestic as the cedars.";
csb[16] = "His mouth is sweetness. He is absolutely desirable. This is my love, and this is my friend, young women of Jerusalem.";
kjv[1] = "I am come into my garden, my sister, [my] spouse: I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk: eat, O friends; drink, yea, drink abundantly, O beloved.";
rsv[1] = "I come to my garden, my sister, my bride, I gather my myrrh with my spice, I eat my honeycomb with my honey, I drink my wine with my milk. Eat, O friends, and drink: drink deeply, O lovers!";
asv[1] = "I am come into my garden, my sister, [my] bride: I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, O friends; Drink, yea, drink abundantly, O beloved. ";
yng[1] = "I have come in to my garden, my sister-spouse, I have plucked my myrrh with my spice, I have eaten my comb with my honey, I have drunk my wine with my milk. Eat, O friends, drink, Yea, drink abundantly, O beloved ones!";
dby[1] = "I am come into my garden, my sister, [my] spouse; I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, O friends; drink, yea, drink abundantly, beloved ones!";
web[1] = "I have come into my garden, my sister, [my] spouse: I have gathered my myrrh, with my spice; I have eaten my honey-comb with my honey; I have drank my wine with my milk: eat, O friends; drink, yes, drink abundantly, O beloved.";
hnv[1] = "I have come into my garden, my sister, my bride. I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Friends Eat, friends! Drink, yes, drink abundantly, beloved. Beloved";
vul[1] = "veniat dilectus meus in hortum suum et comedat fructum pomorum suorum veni in hortum meum soror mea sponsa messui murram meam cum aromatibus meis comedi favum cum melle meo bibi vinum meum cum lacte meo comedite amici bibite et inebriamini carissimi";
kjv[2] = "I sleep, but my heart waketh: [it is] the voice of my beloved that knocketh, [saying], Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, [and] my locks with the drops of the night.";
rsv[2] = "I slept, but my heart was awake. Hark! my beloved is knocking. &quot;Open to me, my sister, my love, my dove, my perfect one; for my head is wet with dew, my locks with the drops of the night.&quot;";
asv[2] = "I was asleep, but my heart waked: It is the voice of my beloved that knocketh, [saying], Open to me, my sister, my love, my dove, my undefiled; For my head is filled with dew, My locks with the drops of the night. ";
yng[2] = "I am sleeping, but my heart waketh: The sound of my beloved knocking! `Open to me, my sister, my friend, My dove, my perfect one, For my head is filled [with] dew, My locks [with] drops of the night.\'";
dby[2] = "I slept, but my heart was awake. The voice of my beloved! he knocketh: Open to me, my sister, my love, my dove, mine undefiled; For my head is filled with dew, My locks with the drops of the night.";
web[2] = "I sleep, but my heart waketh: [it is] the voice of my beloved that knocketh, [saying], Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, [and] my locks with the drops of the night.";
hnv[2] = "I was asleep, but my heart was awake. It is the voice of my beloved who knocks: Open to me, my sister, my love, my dove, my undefiled; For my head is filled with dew, My hair with the dampness of the night.";
vul[2] = "ego dormio et cor meum vigilat vox dilecti mei pulsantis aperi mihi soror mea amica mea columba mea inmaculata mea quia caput meum plenum est rore et cincinni mei guttis noctium";
kjv[3] = "I have put off my coat; how shall I put it on? I have washed my feet; how shall I defile them?";
rsv[3] = "I had put off my garment, how could I put it on? I had bathed my feet, how could I soil them?";
asv[3] = "I have put off my garment; how shall I put it on? I have washed my feet; how shall I defile them? ";
yng[3] = "I have put off my coat, how do I put it on? I have washed my feet, how do I defile them?";
dby[3] = "-- I have put off my tunic, how should I put it on? I have washed my feet, how should I pollute them? --";
web[3] = "I have put off my coat; how shall I put it on? I have washed my feet; how shall I defile them?";
hnv[3] = "I have taken off my robe. Indeed, must I put it on? I have washed my feet. Indeed, must I soil them?";
vul[3] = "expoliavi me tunica mea quomodo induar illa lavi pedes meos quomodo inquinabo illos";
kjv[4] = "My beloved put in his hand by the hole [of the door], and my bowels were moved for him.";
rsv[4] = "My beloved put his hand to the latch, and my heart was thrilled within me.";
asv[4] = "My beloved put in his hand by the hole [of the door], And my heart was moved for him. ";
yng[4] = "My beloved sent his hand from the net-work, And my bowels were moved for him.";
dby[4] = "My beloved put in his hand by the hole [of the door]; And my bowels yearned for him.";
web[4] = "My beloved put in his hand by the hole [of the door], and my bowels were moved for him.";
hnv[4] = "My beloved thrust his hand in through the latch opening. My heart pounded for him.";
vul[4] = "dilectus meus misit manum suam per foramen et venter meus intremuit ad tactum eius";
kjv[5] = "I rose up to open to my beloved; and my hands dropped [with] myrrh, and my fingers [with] sweet smelling myrrh, upon the handles of the lock.";
rsv[5] = "I arose to open to my beloved, and my hands dripped with myrrh, my fingers with liquid myrrh, upon the handles of the bolt.";
asv[5] = "I rose up to open to my beloved; And my hands droppeth with myrrh, And my fingers with liquid myrrh, Upon the handles of the bolt. ";
yng[5] = "I rose to open to my beloved, And my hands dropped myrrh, Yea, my fingers flowing myrrh, On the handles of the lock.";
dby[5] = "I rose up to open to my beloved; And my hands dropped with myrrh, And my fingers with liquid myrrh, Upon the handles of the lock.";

kjv[6] = "I opened to my beloved; but my beloved had withdrawn himself, [and] was gone: my soul failed when he spake: I sought him, but I could not find him; I called him, but he gave me no answer.";
rsv[6] = "I opened to my beloved, but my beloved had turned and gone. My soul failed me when he spoke. I sought him, but found him not; I called him, but he gave no answer.";
asv[6] = "I opened to my beloved; But my beloved had withdrawn himself, [and] was gone. My soul had failed me when he spake: I sought him, but I could not find him; I called him, but he gave me no answer. ";
yng[6] = "I opened to my beloved, But my beloved withdrew -- he passed on, My soul went forth when he spake, I sought him, and found him not. I called him, and he answered me not.";
dby[6] = "I opened to my beloved; But my beloved had withdrawn himself; he was gone: My soul went forth when he spoke. I sought him, but I found him not; I called him, but he gave me no answer.";
web[6] = "I opened to my beloved; but my beloved had withdrawn himself, [and] was gone: my soul failed when he spoke: I sought him, but I could not find him; I called him, but he gave me no answer.";
hnv[6] = "I opened to my beloved; But my beloved left; gone away. My heart went out when he spoke. I looked for him, but I didn\'t find him. I called him, but he didn\'t answer.";
vul[6] = "pessulum ostii aperui dilecto meo at ille declinaverat atque transierat anima mea liquefacta est ut locutus est quaesivi et non inveni illum vocavi et non respondit mihi";
kjv[7] = "The watchmen that went about the city found me, they smote me, they wounded me; the keepers of the walls took away my veil from me.";
rsv[7] = "The watchmen found me, as they went about in the city; they beat me, they wounded me, they took away my mantle, those watchmen of the walls.";
asv[7] = "The watchmen that go about the city found me, They smote me, they wounded me; The keepers of the walls took away my mantle from me. ";
yng[7] = "The watchmen who go round about the city, Found me, smote me, wounded me, Keepers of the walls lifted up my veil from off me.";
dby[7] = "The watchmen that went about the city found me; They smote me, they wounded me; The keepers of the walls took away my veil from me.";
web[7] = "The watchmen that went about the city found me, they smote me, they wounded me; the keepers of the walls took away my vail from me.";
hnv[7] = "The watchmen who go about the city found me. They beat me. They bruised me. The keepers of the walls took my cloak away from me.";
vul[7] = "invenerunt me custodes qui circumeunt civitatem percusserunt me vulneraverunt me tulerunt pallium meum mihi custodes murorum";
kjv[8] = "I charge you, O daughters of Jerusalem, if ye find my beloved, that ye tell him, that I [am] sick of love.";
rsv[8] = "I adjure you, O daughters of Jerusalem, if you find my beloved, that you tell him I am sick with love.";
asv[8] = "I adjure you, O daughters of Jerusalem, If ye find my beloved, That ye tell him, that I am sick from love. ";
yng[8] = "I have adjured you, daughters of Jerusalem, If ye find my beloved -- What do ye tell him? that I [am] sick with love!";
dby[8] = "I charge you, daughters of Jerusalem, If ye find my beloved, ... What will ye tell him? -- That I am sick of love.";
web[8] = "I charge you, O daughters of Jerusalem, if ye find my beloved, that ye tell him, that I [am] sick with love.";
hnv[8] = "I adjure you, daughters of Yerushalayim, If you find my beloved, That you tell him that I am faint with love. Friends";
vul[8] = "adiuro vos filiae Hierusalem si inveneritis dilectum meum ut nuntietis ei quia amore langueo";
kjv[9] = "What [is] thy beloved more than [another] beloved, O thou fairest among women? what [is] thy beloved more than [another] beloved, that thou dost so charge us?";
rsv[9] = "What is your beloved more than another beloved, O fairest among women? What is your beloved more than another beloved, that you thus adjure us?";
asv[9] = "What is thy beloved more than [another] beloved, O thou fairest among women? What is thy beloved more than [another] beloved, That thou dost so adjure us? ";
yng[9] = "What [is] thy beloved above [any] beloved, O fair among women? What [is] thy beloved above [any] beloved, That thus thou hast adjured us?";
dby[9] = "What is thy beloved more than [another] beloved, Thou fairest among women? What is thy beloved more than [another] beloved, That thou dost so charge us?";
web[9] = "What [is] thy beloved more than [another] beloved, O thou fairest among women? what [is] thy beloved more than [another] beloved, that thou dost so charge us?";
hnv[9] = "How is your beloved better than another beloved, You fairest among women? How is your beloved better than another beloved, That you do so adjure us? Beloved";
vul[9] = "qualis est dilectus tuus ex dilecto o pulcherrima mulierum qualis est dilectus tuus ex dilecto quia sic adiurasti nos";
kjv[10] = "My beloved [is] white and ruddy, the chiefest among ten thousand.";
rsv[10] = "My beloved is all radiant and ruddy, distinguished among ten thousand.";
asv[10] = "My beloved is white and ruddy, The chiefest among ten thousand. ";
yng[10] = "My beloved [is] clear and ruddy, Conspicuous above a myriad!";
dby[10] = "My beloved is white and ruddy, The chiefest among ten thousand.";
web[10] = "My beloved [is] white and ruddy, the chief among ten thousand.";
hnv[10] = "My beloved is white and ruddy. The best among ten thousand.";

hnv[11] = "His head is like the purest gold. His hair is bushy, black as a raven.";

yng[12] = "His eyes as doves by streams of water, Washing in milk, sitting in fulness.";
dby[12] = "His eyes are like doves by the water-brooks, Washed with milk, fitly set;";
web[12] = "His eyes [are] as [the eyes] of doves by the rivers of waters, washed with milk, [and] fitly set.";
hnv[12] = "His eyes are like doves beside the water brooks, Washed with milk, mounted like jewels.";

hnv[16] = "His mouth is sweetness; Yes, he is altogether lovely. This is my beloved, and this is my friend, Daughters of Yerushalayim. Friends";
vul[16] = "guttur illius suavissimum et totus desiderabilis talis est dilectus meus et iste est amicus meus filiae Hierusalem";
