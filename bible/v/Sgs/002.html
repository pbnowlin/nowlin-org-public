csb[1] = "I am a wildflower of Sharon, a lily of the valleys.";
csb[2] = "Like a lily among thorns, so is my darling among the young women.";
csb[3] = "Like an apricot tree among the trees of the forest, so is my love among the young men. I delight to sit in his shade, and his fruit is sweet to my taste.";
csb[4] = "He brought me to the banquet hall, and he looked on me with love.";
csb[5] = "Sustain me with raisins; refresh me with apricots, for I am lovesick.";
csb[6] = "May his left hand be under my head, and his right arm embrace me.";
csb[7] = "Young women of Jerusalem, I charge you by the gazelles and the wild does of the field, do not stir up or awaken love until the appropriate time.";
csb[8] = "Listen! My love is approaching. Look! Here he comes, leaping over the mountains, bounding over the hills.";
csb[9] = "My love is like a gazelle or a young stag. See, he is standing behind our wall, gazing through the windows, peering through the lattice.";
csb[10] = "My love calls to me: Arise, my darling. Come away, my beautiful one.";
csb[11] = "For now the winter is past; the rain has ended and gone away.";
csb[12] = "The blossoms appear in the countryside. The time of singing has come, and the turtledove\'s cooing is heard in our land.";
csb[13] = "The fig tree ripens its figs; the blossoming vines give off their fragrance. Arise, my darling. Come away, my beautiful one.";
csb[14] = "My dove, in the clefts of the rock, in the crevices of the cliff, let me see your face, let me hear your voice; for your voice is sweet, and your face is lovely.";
csb[15] = "Catch the foxes for us -- the little foxes that ruin the vineyards -- for our vineyards are in bloom.";
csb[16] = "My love is mine and I am his; he feeds among the lilies.";
csb[17] = "Until the day breaks and the shadows flee, turn around, my love, and be like a gazelle or a young stag on the divided mountains.";
