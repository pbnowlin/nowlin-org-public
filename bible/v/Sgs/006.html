csb[1] = "Where has your love gone, most beautiful of women? Which way has he turned? We will seek him with you.";

csb[3] = "I am my love\'s and my love is mine; he feeds among the lilies.";
csb[4] = "You are as beautiful as Tirzah, my darling, lovely as Jerusalem, awe-inspiring as an army with banners.";
csb[5] = "Turn your eyes away from me, for they captivate me. Your hair is like a flock of goats streaming down from Gilead.";
csb[6] = "Your teeth are like a flock of ewes coming up from washing, each one having a twin, and not one missing.";

csb[8] = "There are sixty queens and eighty concubines and young women without number.";

csb[12] = "I didn\'t know what was happening to me. I felt like I was in a chariot with a nobleman.";
csb[13] = "Come back, come back, Shulammite! Come back, come back, that we may look at you! How you gaze at the Shulammite, as you look at the dance of the two camps!";
