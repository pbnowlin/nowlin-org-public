csb[1] = "Dear friends, this is now the second letter I have written to you; in both letters, I want to stir up your sincere understanding by way of reminder,";
csb[2] = "so that you recall the words previously spoken by the holy prophets and the command of our Lord and Savior given through your apostles.";
csb[3] = "Above all, be aware of this: Scoffers will come in the last days scoffing and following their own evil desires,";
csb[4] = "saying, &quot;Where is his \'coming\' that he promised? Ever since our ancestors fell asleep, all things continue as they have been since the beginning of creation.&quot;";
csb[5] = "They deliberately overlook this: By the word of God the heavens came into being long ago and the earth was brought about from water and through water.";
csb[6] = "Through these the world of that time perished when it was flooded.";
csb[7] = "By the same word, the present heavens and earth are stored up for fire, being kept for the day of judgment and destruction of the ungodly.";
csb[8] = "Dear friends, don\'t overlook this one fact: With the Lord one day is like a thousand years, and a thousand years like one day.";
csb[9] = "The Lord does not delay his promise, as some understand delay, but is patient with you, not wanting any to perish but all to come to repentance.";
csb[10] = "But the day of the Lord will come like a thief; on that day the heavens will pass away with a loud noise, the elements will burn and be dissolved, and the earth and the works on it will be disclosed.";
csb[11] = "Since all these things are to be dissolved in this way, it is clear what sort of people you should be in holy conduct and godliness";
csb[12] = "as you wait for the day of God and hasten its coming. Because of that day, the heavens will be dissolved with fire and the elements will melt with heat.";
csb[13] = "But based on his promise, we wait for new heavens and a new earth, where righteousness dwells.";
csb[14] = "Therefore, dear friends, while you wait for these things, make every effort to be found without spot or blemish in his sight, at peace.";
csb[15] = "Also, regard the patience of our Lord as salvation, just as our dear brother Paul has written to you according to the wisdom given to him.";
csb[16] = "He speaks about these things in all his letters. There are some matters that are hard to understand. The untaught and unstable will twist them to their own destruction, as they also do with the rest of the Scriptures.";
csb[17] = "Therefore, dear friends, since you know this in advance, be on your guard, so that you are not led away by the error of lawless people and fall from your own stable position.";
csb[18] = "But grow in the grace and knowledge of our Lord and Savior Jesus Christ. To him be the glory both now and to the day of eternity.";
