csb[1] = "There were indeed false prophets among the people, just as there will be false teachers among you. They will bring in destructive heresies, even denying the Master who bought them, and will bring swift destruction on themselves.";
csb[2] = "Many will follow their depraved ways, and the way of truth will be maligned because of them.";
csb[3] = "They will exploit you in their greed with made-up stories. Their condemnation, pronounced long ago, is not idle, and their destruction does not sleep.";
csb[4] = "For if God didn\'t spare the angels who sinned but cast them into hell and delivered them in chains of utter darkness to be kept for judgment;";
csb[5] = "and if he didn\'t spare the ancient world, but protected Noah, a preacher of righteousness, and seven others, when he brought the flood on the world of the ungodly;";
csb[6] = "and if he reduced the cities of Sodom and Gomorrah to ashes and condemned them to extinction, making them an example of what is coming to the ungodly;";
csb[7] = "and if he rescued righteous Lot, distressed by the depraved behavior of the immoral";
csb[8] = "(for as that righteous man lived among them day by day, his righteous soul was tormented by the lawless deeds he saw and heard) --";
csb[9] = "then the Lord knows how to rescue the godly from trials and to keep the unrighteous under punishment for the day of judgment,";
csb[10] = "especially those who follow the polluting desires of the flesh and despise authority. Bold, arrogant people! They are not afraid to slander the glorious ones;";
csb[11] = "however, angels, who are greater in might and power, do not bring a slanderous charge against them before the Lord.";
csb[12] = "But these people, like irrational animals -- creatures of instinct born to be caught and destroyed -- slander what they do not understand, and in their destruction they too will be destroyed.";
csb[13] = "They will be paid back with harm for the harm they have done. They consider it a pleasure to carouse in broad daylight. They are spots and blemishes, delighting in their deceptions while they feast with you.";
csb[14] = "They have eyes full of adultery that never stop looking for sin. They seduce unstable people and have hearts trained in greed. Children under a curse!";
csb[15] = "They have gone astray by abandoning the straight path and have followed the path of Balaam, the son of Bosor, who loved the wages of wickedness";
csb[16] = "but received a rebuke for his lawlessness: A speechless donkey spoke with a human voice and restrained the prophet\'s madness.";
csb[17] = "These people are springs without water, mists driven by a storm. The gloom of darkness has been reserved for them.";
csb[18] = "For by uttering boastful, empty words, they seduce, with fleshly desires and debauchery, people who have barely escaped from those who live in error.";
csb[19] = "They promise them freedom, but they themselves are slaves of corruption, since people are enslaved to whatever defeats them.";
csb[20] = "For if, having escaped the world\'s impurity through the knowledge of the Lord and Savior Jesus Christ, they are again entangled in these things and defeated, the last state is worse for them than the first.";
csb[21] = "For it would have been better for them not to have known the way of righteousness than, after knowing it, to turn back from the holy command delivered to them.";
csb[22] = "It has happened to them according to the true proverb: A dog returns to its own vomit, and, &quot;a washed sow returns to wallowing in the mud.&quot;";
