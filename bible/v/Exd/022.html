csb[1] = "&quot;When a man steals an ox or a sheep and butchers it or sells it, he must repay five cattle for the ox or four sheep for the sheep.";
csb[2] = "&quot;If a thief is caught in the act of breaking in, and he is beaten to death, no one is guilty of bloodshed.";
csb[3] = "&quot;But if this happens after sunrise, the householder is guilty of bloodshed. A thief must make full restitution. If he is unable, he is to be sold because of his theft.";
csb[4] = "&quot;If what was stolen -- whether ox, donkey, or sheep -- is actually found alive in his possession, he must repay double.";
csb[5] = "&quot;When a man lets a field or vineyard be grazed in, and then allows his animals to go and graze in someone else\'s field, he must repay with the best of his own field or vineyard.";
csb[6] = "&quot;When a fire gets out of control, spreads to thornbushes, and consumes stacks of cut grain, standing grain, or a field, the one who started the fire must make full restitution for what was burned.";
csb[7] = "&quot;When a man gives his neighbor valuables or goods to keep, but they are stolen from that person\'s house, the thief, if caught, must repay double.";
csb[8] = "&quot;If the thief is not caught, the owner of the house must present himself to the judges to determine whether or not he has taken his neighbor\'s property.";
csb[9] = "&quot;In any case of wrongdoing involving an ox, a donkey, a sheep, a garment, or anything else lost, and someone claims, \'That\'s mine,\' the case between the two parties is to come before the judges. The one the judges condemn must repay double to his neighbor.";
csb[10] = "&quot;When a man gives his neighbor a donkey, an ox, a sheep, or any other animal to care for, but it dies, is injured, or is stolen, while no one is watching,";
csb[11] = "&quot;there must be an oath before the LORD between the two of them to determine whether or not he has taken his neighbor\'s property. Its owner must accept the oath, and the other man does not have to make restitution.";
csb[12] = "&quot;But if, in fact, the animal was stolen from his custody, he must make restitution to its owner.";
csb[13] = "&quot;If it was actually torn apart by a wild animal, he is to bring it as evidence; he does not have to make restitution for the torn carcass.";
csb[14] = "&quot;When a man borrows an animal from his neighbor, and it is injured or dies while its owner is not there with it, the man must make full restitution.";
csb[15] = "&quot;If its owner is there with it, the man does not have to make restitution. If it was rented, the loss is covered by its rental price.";
csb[16] = "&quot;If a man seduces a virgin who is not engaged, and he sleeps with her, he must certainly pay the bridal price for her to be his wife.";
csb[17] = "&quot;If her father absolutely refuses to give her to him, he must pay an amount in silver equal to the bridal price for virgins.";
csb[18] = "&quot;Do not allow a sorceress to live.";
csb[19] = "&quot;Whoever has sexual intercourse with an animal must be put to death.";
csb[20] = "&quot;Whoever sacrifices to any gods, except the LORD alone, is to be set apart for destruction.";
csb[21] = "&quot;You must not exploit a resident alien or oppress him, since you were resident aliens in the land of Egypt.";
csb[22] = "&quot;You must not mistreat any widow or fatherless child.";
csb[23] = "&quot;If you do mistreat them, they will no doubt cry to me, and I will certainly hear their cry.";
csb[24] = "&quot;My anger will burn, and I will kill you with the sword; then your wives will be widows and your children fatherless.";
csb[25] = "&quot;If you lend silver to my people, to the poor person among you, you must not be like a creditor to him; you must not charge him interest.";

csb[27] = "&quot;For it is his only covering; it is the clothing for his body. What will he sleep in? And if he cries out to me, I will listen because I am gracious.";
csb[28] = "&quot;You must not blaspheme God or curse a leader among your people.";
csb[29] = "&quot;You must not hold back offerings from your harvest or your vats. Give me the firstborn of your sons.";
csb[30] = "&quot;Do the same with your cattle and your flock. Let them stay with their mothers for seven days, but on the eighth day you are to give them to me.";
