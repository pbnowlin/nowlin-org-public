dby[25] = "And if thou make me an altar of stone, thou shalt not build it of hewn stone; for if thou lift up thy sharp tool upon it, thou hast profaned it.";
web[25] = "And if thou wilt make me an altar of stone, thou shalt not build it of hewn stone: for if thou [shalt] lift up thy tool upon it, thou hast polluted it.";
hnv[25] = "If you make me an altar of stone, you shall not build it of hewn stones; for if you lift up your tool on it, you have polluted it.";

csb[1] = "Then God spoke all these words:";
csb[2] = "I am the LORD your God, who brought you out of the land of Egypt, out of the place of slavery.";
csb[3] = "Do not have other gods besides me.";
csb[4] = "Do not make an idol for yourself, whether in the shape of anything in the heavens above or on the earth below or in the waters under the earth.";
csb[5] = "Do not bow in worship to them, and do not serve them; for I, the LORD your God, am a jealous God, punishing the children for the fathers\' iniquity, to the third and fourth generations of those who hate me,";
csb[6] = "but showing faithful love to a thousand generations of those who love me and keep my commands.";
csb[7] = "Do not misuse the name of the LORD your God, because the LORD will not leave anyone unpunished who misuses his name.";
csb[8] = "Remember the Sabbath day, to keep it holy:";
csb[9] = "You are to labor six days and do all your work,";
csb[10] = "but the seventh day is a Sabbath to the LORD your God. You must not do any work -- you, your son or daughter, your male or female servant, your livestock, or the resident alien who is within your city gates.";
csb[11] = "For the LORD made the heavens and the earth, the sea, and everything in them in six days; then he rested on the seventh day. Therefore the LORD blessed the Sabbath day and declared it holy.";
csb[12] = "Honor your father and your mother so that you may have a long life in the land that the LORD your God is giving you.";
csb[13] = "Do not murder.";
csb[14] = "Do not commit adultery.";
csb[15] = "Do not steal.";
csb[16] = "Do not give false testimony against your neighbor.";
csb[17] = "Do not covet your neighbor\'s house. Do not covet your neighbor\'s wife, his male or female servant, his ox or donkey, or anything that belongs to your neighbor.";
csb[18] = "All the people witnessed the thunder and lightning, the sound of the trumpet, and the mountain surrounded by smoke. When the people saw it they trembled and stood at a distance.";
csb[19] = "&quot;You speak to us, and we will listen,&quot; they said to Moses, &quot;but don\'t let God speak to us, or we will die.&quot;";
csb[20] = "Moses responded to the people, &quot;Don\'t be afraid, for God has come to test you, so that you will fear him and will not sin.&quot;";
csb[21] = "And the people remained standing at a distance as Moses approached the total darkness where God was.";
csb[22] = "Then the LORD told Moses, &quot;This is what you are to say to the Israelites: You have seen that I have spoken to you from heaven.";
csb[23] = "&quot;Do not make gods of silver to rival me; do not make gods of gold for yourselves.";
csb[24] = "&quot;Make an earthen altar for me, and sacrifice on it your burnt offerings and fellowship offerings, your flocks and herds. I will come to you and bless you in every place where I cause my name to be remembered.";
csb[25] = "&quot;If you make a stone altar for me, do not build it out of cut stones. If you use your chisel on it, you will defile it.";
csb[26] = "&quot;Do not go up to my altar on steps, so that your nakedness is not exposed on it.";
