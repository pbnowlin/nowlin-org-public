csb[1] = "Moses answered, &quot;What if they won\'t believe me and will not obey me but say, \'The LORD did not appear to you\'? &quot;";
csb[2] = "The LORD asked him, &quot;What is that in your hand? &quot; &quot;A staff,&quot; he replied.";
csb[3] = "&quot;Throw it on the ground,&quot; he said. So Moses threw it on the ground, it became a snake, and he ran from it.";
csb[4] = "The LORD told Moses, &quot;Stretch out your hand and grab it by the tail.&quot; So he stretched out his hand and caught it, and it became a staff in his hand.";
csb[5] = "&quot;This will take place,&quot; he continued, &quot;so that they will believe that the LORD, the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has appeared to you.&quot;";
csb[6] = "In addition the LORD said to him, &quot;Put your hand inside your cloak.&quot; So he put his hand inside his cloak, and when he took it out, his hand was diseased, resembling snow.";
csb[7] = "&quot;Put your hand back inside your cloak,&quot; he said. So he put his hand back inside his cloak, and when he took it out, it had again become like the rest of his skin.";
csb[8] = "&quot;If they will not believe you and will not respond to the evidence of the first sign, they may believe the evidence of the second sign.";
csb[9] = "&quot;And if they don\'t believe even these two signs or listen to what you say, take some water from the Nile and pour it on the dry ground. The water you take from the Nile will become blood on the ground.&quot;";
csb[10] = "But Moses replied to the LORD, &quot;Please, Lord, I have never been eloquent -- either in the past or recently or since you have been speaking to your servant -- because my mouth and my tongue are sluggish.&quot;";
csb[11] = "The LORD said to him, &quot;Who placed a mouth on humans? Who makes a person mute or deaf, seeing or blind? Is it not I, the LORD?";
csb[12] = "&quot;Now go! I will help you speak and I will teach you what to say.&quot;";
csb[13] = "Moses said, &quot;Please, Lord, send someone else.&quot;";
csb[14] = "Then the LORD\'s anger burned against Moses, and he said, &quot;Isn\'t Aaron the Levite your brother? I know that he can speak well. And also, he is on his way now to meet you. He will rejoice when he sees you.";
csb[15] = "&quot;You will speak with him and tell him what to say. I will help both you and him to speak and will teach you both what to do.";
csb[16] = "&quot;He will speak to the people for you. He will serve as a mouth for you, and you will serve as God to him.";
csb[17] = "&quot;And take this staff in your hand that you will perform the signs with.&quot;";
csb[18] = "Then Moses went back to his father-in-law Jethro and said to him, &quot;Please let me return to my relatives in Egypt and see if they are still living.&quot; Jethro said to Moses, &quot;Go in peace.&quot;";
csb[19] = "Now in Midian the LORD told Moses, &quot;Return to Egypt, for all the men who wanted to kill you are dead.&quot;";
csb[20] = "So Moses took his wife and sons, put them on a donkey, and returned to the land of Egypt. And Moses took God\'s staff in his hand.";
csb[21] = "The LORD instructed Moses, &quot;When you go back to Egypt, make sure you do before Pharaoh all the wonders that I have put within your power. But I will harden his heart so that he won\'t let the people go.";
csb[22] = "&quot;And you will say to Pharaoh: This is what the LORD says: Israel is my firstborn son.";
csb[23] = "&quot;I told you: Let my son go so that he may worship me, but you refused to let him go. Look, I am about to kill your firstborn son! &quot;";
csb[24] = "On the trip, at an overnight campsite, it happened that the LORD confronted him and intended to put him to death.";
csb[25] = "So Zipporah took a flint, cut off her son\'s foreskin, threw it at Moses\'s feet, and said, &quot;You are a bridegroom of blood to me! &quot;";
csb[26] = "So he let him alone. At that time she said, &quot;You are a bridegroom of blood,&quot; referring to the circumcision.";
csb[27] = "Now the LORD had said to Aaron, &quot;Go and meet Moses in the wilderness.&quot; So he went and met him at the mountain of God and kissed him.";
csb[28] = "Moses told Aaron everything the LORD had sent him to say, and about all the signs he had commanded him to do.";
csb[29] = "Then Moses and Aaron went and assembled all the elders of the Israelites.";
csb[30] = "Aaron repeated everything the LORD had said to Moses and performed the signs before the people.";
csb[31] = "The people believed, and when they heard that the LORD had paid attention to them and that he had seen their misery, they knelt low and worshiped.";
