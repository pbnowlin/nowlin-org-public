kjv[23] = "And it came to pass in process of time, that the king of Egypt died: and the children of Israel sighed by reason of the bondage, and they cried, and their cry came up unto God by reason of the bondage.";

rsv[23] = "In the course of those many days the king of Egypt died. And the people of Israel groaned under their bondage, and cried out for help, and their cry under bondage came up to God.";

csb[1] = "Now a man from the family of Levi married a Levite woman.";
csb[2] = "The woman became pregnant and gave birth to a son; when she saw that he was beautiful,* she hid him for three months.";
csb[3] = "But when she could no longer hide him, she got a papyrus basket for him and coated it with asphalt and pitch. She placed the child in it and set it among the reeds by the bank of the Nile.";
csb[4] = "Then his sister stood at a distance in order to see what would happen to him.";
csb[5] = "Pharaoh\'s daughter went down to bathe at the Nile while her servant girls walked along the riverbank. She saw the basket among the reeds, sent her slave girl, took it,";
csb[6] = "opened it, and saw him, the child -- and there he was, a little boy, crying. She felt sorry for him and said, &quot;This is one of the Hebrew boys.&quot;";
csb[7] = "Then his sister said to Pharaoh\'s daughter, &quot;Should I go and call a Hebrew woman who is nursing to nurse the boy for you? &quot;";
csb[8] = "&quot;Go,&quot; Pharaoh\'s daughter told her. So the girl went and called the boy\'s mother.";
csb[9] = "Then Pharaoh\'s daughter said to her, &quot;Take this child and nurse him for me, and I will pay your wages.&quot; So the woman took the boy and nursed him.";
csb[10] = "When the child grew older, she brought him to Pharaoh\'s daughter, and he became her son. She named him Moses,* &quot;Because,&quot; she said, &quot;I drew him out of the water.&quot;";
csb[11] = "Years later,* after Moses had grown up, he went out to his own people* and observed their forced labor. He saw an Egyptian striking a Hebrew, one of his people.";
csb[12] = "Looking all around and seeing no one, he struck the Egyptian dead and hid him in the sand.";
csb[13] = "The next day he went out and saw two Hebrews fighting. He asked the one in the wrong, &quot;Why are you attacking your neighbor? &quot;*";
csb[14] = "&quot;Who made you a commander and judge over us? &quot; the man replied. &quot;Are you planning to kill me as you killed the Egyptian? &quot; Then Moses became afraid and thought, &quot;What I did is certainly known.&quot;";
csb[15] = "When Pharaoh heard about this, he tried to kill Moses. But Moses fled from Pharaoh and went to live in the land of Midian, and sat down by a well.";
csb[16] = "Now the priest of Midian had seven daughters. They came to draw water and filled the troughs to water their father\'s flock.";
csb[17] = "Then some shepherds arrived and drove them away, but Moses came to their rescue and watered their flock.";
csb[18] = "When they returned to their father Reuel,* he asked, &quot;Why have you come back so quickly today? &quot;";
csb[19] = "They answered, &quot;An Egyptian rescued us from the shepherds. He even drew water for us and watered the flock.&quot;";
csb[20] = "&quot;So where is he? &quot; he asked his daughters. &quot;Why then did you leave the man behind? Invite him to eat dinner.&quot;";
csb[21] = "Moses agreed to stay with the man, and he gave his daughter Zipporah to Moses in marriage.";
csb[22] = "She gave birth to a son whom he named Gershom,* for he said, &quot;I have been a resident alien in a foreign land.&quot;";
csb[23] = "After a long time, the king of Egypt died. The Israelites groaned because of their difficult labor; and they cried out; and their cry for help because of the difficult labor ascended to God.";
csb[24] = "And God heard their groaning; and God remembered his covenant with Abraham, with Isaac, and with Jacob;";
csb[25] = "and God saw the Israelites; and God knew.";
