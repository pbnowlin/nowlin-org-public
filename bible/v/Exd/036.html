csb[1] = "Bezalel, Oholiab, and all the skilled people are to work based on everything the LORD has commanded. The LORD has given them wisdom and understanding to know how to do all the work of constructing the sanctuary.&quot;";
csb[2] = "So Moses summoned Bezalel, Oholiab, and every skilled person in whose heart the LORD had placed wisdom, all whose hearts moved them, to come to the work and do it.";
csb[3] = "They took from Moses\'s presence all the contributions that the Israelites had brought for the task of making the sanctuary. Meanwhile, the people continued to bring freewill offerings morning after morning.";
csb[4] = "Then all the artisans who were doing all the work for the sanctuary came one by one from the work they were doing";
csb[5] = "and said to Moses, &quot;The people are bringing more than is needed for the construction of the work the LORD commanded to be done.&quot;";
csb[6] = "After Moses gave an order, they sent a proclamation throughout the camp: &quot;Let no man or woman make anything else as an offering for the sanctuary.&quot; So the people stopped.";
csb[7] = "The materials were sufficient for them to do all the work. There was more than enough.";
csb[8] = "All the skilled artisans among those doing the work made the tabernacle with ten curtains. Bezalel made them of finely spun linen, as well as blue, purple, and scarlet yarn, with a design of cherubim worked into them.";
csb[9] = "Each curtain was forty-two feet long and six feet wide; all the curtains had the same measurements.";
csb[10] = "He joined five of the curtains to each other, and the other five curtains he joined to each other.";
csb[11] = "He made loops of blue yarn on the edge of the last curtain in the first set and did the same on the edge of the outermost curtain in the second set.";
csb[12] = "He made fifty loops on the one curtain and fifty loops on the edge of the curtain in the second set, so that the loops lined up with each other.";
csb[13] = "He also made fifty gold clasps and joined the curtains to each other, so that the tabernacle became a single unit.";
csb[14] = "He made curtains of goat hair for a tent over the tabernacle; he made eleven of them.";
csb[15] = "Each curtain was forty-five feet long and six feet wide. All eleven curtains had the same measurements.";
csb[16] = "He joined five of the curtains together, and the other six together.";
csb[17] = "He made fifty loops on the edge of the outermost curtain in the first set and fifty loops on the edge of the corresponding curtain in the second set.";
csb[18] = "He made fifty bronze clasps to join the tent together as a single unit.";
csb[19] = "He also made a covering for the tent from ram skins dyed red and a covering of fine leather on top of it.";
csb[20] = "He made upright supports of acacia wood for the tabernacle.";
csb[21] = "Each support was fifteen feet long and twenty-seven inches wide.";
csb[22] = "Each support had two tenons for joining one to another. He did the same for all the supports of the tabernacle.";
csb[23] = "He made supports for the tabernacle as follows: twenty for the south side,";
csb[24] = "and he made forty silver bases to put under the twenty supports, two bases under the first support for its two tenons, and two bases under each of the following supports for their two tenons;";
csb[25] = "for the second side of the tabernacle, the north side, he made twenty supports,";
csb[26] = "with their forty silver bases, two bases under the first support and two bases under each of the following ones;";
csb[27] = "and for the back of the tabernacle, on the west side, he made six supports.";
csb[28] = "He also made two additional supports for the two back corners of the tabernacle.";
csb[29] = "They were paired at the bottom and joined together at the top in a single ring. This is what he did with both of them for the two corners.";
csb[30] = "So there were eight supports with their sixteen silver bases, two bases under each one.";
csb[31] = "He made five crossbars of acacia wood for the supports on one side of the tabernacle,";
csb[32] = "five crossbars for the supports on the other side of the tabernacle, and five crossbars for those at the back of the tabernacle on the west.";
csb[33] = "He made the central crossbar run through the middle of the supports from one end to the other.";
csb[34] = "He overlaid them with gold and made their rings out of gold as holders for the crossbars. He also overlaid the crossbars with gold.";
csb[35] = "Then he made the curtain with blue, purple, and scarlet yarn, and finely spun linen. He made it with a design of cherubim worked into it.";
csb[36] = "He made four pillars of acacia wood for it and overlaid them with gold; their hooks were of gold. And he cast four silver bases for the pillars.";
csb[37] = "He made a screen embroidered with blue, purple, and scarlet yarn, and finely spun linen for the entrance to the tent,";
csb[38] = "together with its five pillars and their hooks. He overlaid the tops of the pillars and their bands with gold, but their five bases were bronze.";
