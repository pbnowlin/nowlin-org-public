rsv[3] = "And you shall speak to all who have ability, whom I have endowed with an able mind, that they make Aaron\'s garments to consecrate him for my priesthood.";

kjv[4] = "And these [are] the garments which they shall make; a breastplate, and an ephod, and a robe, and a broidered coat, a mitre, and a girdle: and they shall make holy garments for Aaron thy brother, and his sons, that he may minister unto me in the priest\'s office.";
rsv[4] = "These are the garments which they shall make: a breastpiece, an ephod, a robe, a coat of checker work, a turban, and a girdle; they shall make holy garments for Aaron your brother and his sons to serve me as priests.";
asv[4] = "And these are the garments which they shall make: a breastplate, and an ephod, and a robe, and a coat of checker work, a mitre, and a girdle: and they shall make holy garments for Aaron thy brother, and his sons, that he may minister unto me in the priest\'s office.";
yng[4] = "`And these [are] the garments which they make: a breastplate, and an ephod, and an upper robe, and an embroidered coat, a mitre, and a girdle; yea, they have made holy garments for Aaron thy brother, and for his sons, for his being priest to Me.";
dby[4] = "And these are the garments which they shall make: a breastplate, and an ephod, and a cloak, and a checkered vest, a turban, and a girdle; and they shall make holy garments for Aaron thy brother, and his sons, that he may serve me as priest.";
web[4] = "And these [are] the garments which they shall make; a breast-plate, and an ephod, and a robe, and a broidered coat, a miter, and a girdle; and they shall make holy garments for Aaron thy brother, and his sons, that he may minister to me in the priest\'s office.";
hnv[4] = "These are the garments which they shall make: a breastplate, and an efod, and a robe, and a coat of checker work, a turban, and a sash: and they shall make holy garments for Aharon your brother, and his sons, that he may minister to me in the Kohen\'s office.";
vul[4] = "haec autem erunt vestimenta quae facient rationale et superumerale tunicam et lineam strictam cidarim et balteum facient vestimenta sancta Aaron fratri tuo et filiis eius ut sacerdotio fungantur mihi";

kjv[11] = "With the work of an engraver in stone, [like] the engravings of a signet, shalt thou engrave the two stones with the names of the children of Israel: thou shalt make them to be set in ouches of gold.";
csb[11] = "&quot;You are to weave the tunic from fine linen, make a turban of fine linen, and make an embroidered sash.";
rsv[11] = "As a jeweler engraves signets, so shall you engrave the two stones with the names of the sons of Israel; you shall enclose them in settings of gold filigree.";
asv[11] = "With the work of an engraver in stone, like the engravings of a signet, shalt thou engrave the two stones, according to the names of the children of Israel: thou shalt make them to be inclosed in settings of gold.";
yng[11] = "the work of an engraver in stone, openings of a signet, thou dost open the two stones by the names of the sons of Israel; turned round, embroidered [with] gold, thou dost make them.";
dby[11] = "According to the work of an engraver in stone, as the engravings of a seal, shalt thou engrave the two stones with the names of the sons of Israel; surrounded by enclosures of gold shalt thou make them.";
web[11] = "With the work of an engraver in stone, [like] the engravings of a signet, shalt thou engrave the two stones with the names of the children of Israel: thou shalt make them to be set in ouches of gold.";
hnv[11] = "With the work of an engraver in stone, like the engravings of a signet, shall you engrave the two stones, according to the names of the children of Yisra\'el: you shall make them to be enclosed in settings of gold.";

kjv[12] = "And thou shalt put the two stones upon the shoulders of the ephod [for] stones of memorial unto the children of Israel: and Aaron shall bear their names before the LORD upon his two shoulders for a memorial.";
csb[12] = "Make tunics, sashes, and headbands for Aaron\'s sons to give them glory and beauty.";
rsv[12] = "And you shall set the two stones upon the shoulder-pieces of the ephod, as stones of remembrance for the sons of Israel; and Aaron shall bear their names before the LORD upon his two shoulders for remembrance.";
asv[12] = "And thou shalt put the two stones upon the shoulder-pieces of the ephod, to be stones of memorial for the children of Israel: and Aaron shall bear their names before Jehovah upon his two shoulders for a memorial.";
yng[12] = "`And thou hast set the two stones on the shoulders of the ephod -- stones of memorial to the sons of Israel -- and Aaron hath borne their names before Jehovah, on his two shoulders, for a memorial.";
dby[12] = "And thou shalt put the two stones upon the shoulder-pieces of the ephod [as] stones of memorial for the children of Israel; and Aaron shall bear their names before Jehovah upon his two shoulders for a memorial.";
web[12] = "And thou shalt put the two stones upon the shoulders of the ephod [for] stones of memorial to the children of Israel: and Aaron shall bear their names before the LORD upon his two shoulders for a memorial.";

kjv[15] = "And thou shalt make the breastplate of judgment with cunning work; after the work of the ephod thou shalt make it; [of] gold, [of] blue, and [of] purple, and [of] scarlet, and [of] fine twined linen, shalt thou make it.";
csb[15] = "These must be worn by Aaron and his sons whenever they enter the tent of meeting or approach the altar to minister in the sanctuary area, so that they do not incur guilt and die. This is to be a permanent statute for Aaron and for his future descendants.";
rsv[15] = "&quot;And you shall make a breastpiece of judgment, in skilled work; like the work of the ephod you shall make it; of gold, blue and purple and scarlet stuff, and fine twined linen shall you make it.";
asv[15] = "And thou shalt make a breastplate of judgment, the work of the skilful workman; like the work of the ephod thou shalt make it; of gold, of blue, and purple, and scarlet, and fine twined linen, shalt thou make it.";
yng[15] = "`And thou hast made a breastplate of judgment, work of a designer; according to the work of the ephod thou dost make it; of gold, blue, and purple, and scarlet, and twined linen thou dost make it;";
dby[15] = "And thou shalt make the breastplate of judgment of artistic work, like the work of the ephod thou shalt make it; of gold, blue, and purple, and scarlet, and twined byssus shalt thou make it.";
web[15] = "And thou shalt make the breast-plate of judgment with curious work; after the work of the ephod thou shalt make it; [of] gold, [of] blue, and [of] purple, and [of] scarlet, and [of] fine twined linen shalt thou make it.";
hnv[15] = "&quot;You shall make a breastplate of judgment, the work of the skillful workman; like the work of the efod you shall make it; of gold, of blue, and purple, and scarlet, and fine twined linen, shall you make it.";

kjv[43] = "And they shall be upon Aaron, and upon his sons, when they come in unto the tabernacle of the congregation, or when they come near unto the altar to minister in the holy [place]; that they bear not iniquity, and die: [it shall be] a statute for ever unto him and his seed after him.";
csb[43] = "The craftsmen are to tie the breastpiece from its rings to the rings of the ephod with a cord of blue yarn, so that the breastpiece is above the ephod\'s waistband and does not come loose from the ephod.";
rsv[43] = "and they shall be upon Aaron, and upon his sons, when they go into the tent of meeting, or when they come near the altar to minister in the holy place; lest they bring guilt upon themselves and die. This shall be a perpetual statute for him and for his descendants after him.";
asv[43] = "And they shall be upon Aaron, and upon his sons, when they go in unto the tent of meeting, or when they come near unto the altar to minister in the holy place; that they bear not iniquity, and die: it shall be a statute for ever unto him and unto his seed after him.";
yng[43] = "and they have been on Aaron and on his sons, in their going in unto the tent of meeting, or in their drawing nigh unto the altar to minister in the sanctuary, and they do not bear iniquity nor have they died; a statute age-during to him, and to his seed after him.";
dby[43] = "And they shall be upon Aaron and his sons when they enter into the tent of meeting, or when they come near to the altar to serve in the sanctuary; that they may not bear iniquity and die -- an everlasting statute for him and his seed after him.";
web[43] = "And they shall be upon Aaron, and upon his sons, when they enter in to the tabernacle of the congregation, or when they come near to the altar to minister in the holy [place]; that they bear not iniquity, and die. [It shall be] a statute for ever to him, and to his seed after him.";
hnv[43] = " They shall be on Aharon, and on his sons, when they go in to the tent of meeting, or when they come near to the altar to minister in the holy place; that they don\'t bear iniquity, and die: it shall be a statute forever to him and to his descendants after him.";
vul[43] = "et utentur eis Aaron et filii eius quando ingredientur tabernaculum testimonii vel quando adpropinquant ad altare ut ministrent in sanctuario ne iniquitatis rei moriantur legitimum sempiternum erit Aaron et semini eius post eum";
csb[1] = "&quot;Have your brother Aaron, with his sons, come to you from the Israelites to serve me as priest -- Aaron, his sons Nadab and Abihu, Eleazar and Ithamar.";
csb[2] = "&quot;Make holy garments for your brother Aaron, for glory and beauty.";
csb[3] = "&quot;You are to instruct all the skilled artisans, whom I have filled with a spirit of wisdom, to make Aaron\'s garments for consecrating him to serve me as priest.";
csb[4] = "&quot;These are the garments that they must make: a breastpiece, an ephod, a robe, a specially woven tunic, a turban, and a sash. They are to make holy garments for your brother Aaron and his sons so that they may serve me as priests.";
csb[5] = "&quot;They should use gold; blue, purple, and scarlet yarn; and fine linen.";
csb[6] = "&quot;They are to make the ephod of finely spun linen embroidered with gold, and with blue, purple, and scarlet yarn.";
csb[7] = "&quot;It must have two shoulder pieces attached to its two edges so that it can be joined together.";
csb[8] = "&quot;The artistically woven waistband that is on the ephod must be of one piece, according to the same workmanship of gold, of blue, purple, and scarlet yarn, and of finely spun linen.";
csb[9] = "&quot;Take two onyx stones and engrave on them the names of Israel\'s sons:";
csb[10] = "&quot;six of their names on the first stone and the remaining six names on the second stone, in the order of their birth.";
csb[11] = "&quot;Engrave the two stones with the names of Israel\'s sons as a gem cutter engraves a seal. Mount them, surrounded with gold filigree settings.";
csb[12] = "&quot;Fasten both stones on the shoulder pieces of the ephod as memorial stones for the Israelites. Aaron will carry their names on his two shoulders before the LORD as a reminder.";
csb[13] = "&quot;Fashion gold filigree settings";
csb[14] = "&quot;and two chains of pure gold; you will make them of braided cord work, and attach the cord chains to the settings.";
csb[15] = "&quot;You are to make an embroidered breastpiece for making decisions. Make it with the same workmanship as the ephod; make it of gold, of blue, purple, and scarlet yarn, and of finely spun linen.";
csb[16] = "&quot;It must be square and folded double, nine inches long and nine inches wide.";
csb[17] = "&quot;Place a setting of gemstones on it, four rows of stones: The first row should be a row of carnelian, topaz, and emerald;";
csb[18] = "&quot;the second row, a turquoise, a lapis lazuli, and a diamond;";
csb[19] = "&quot;the third row, a jacinth, an agate, and an amethyst;";
csb[20] = "&quot;and the fourth row, a beryl, an onyx, and a jasper. They should be adorned with gold filigree in their settings.";
csb[21] = "&quot;The twelve stones are to correspond to the names of Israel\'s sons. Each stone must be engraved like a seal, with one of the names of the twelve tribes.";
csb[22] = "&quot;You are to make braided chains of pure gold cord work for the breastpiece.";
csb[23] = "&quot;Fashion two gold rings for the breastpiece and attach them to its two corners.";
csb[24] = "&quot;Then attach the two gold cords to the two gold rings at the corners of the breastpiece.";
csb[25] = "&quot;Attach the other ends of the two cords to the two filigree settings, and in this way attach them to the ephod\'s shoulder pieces in the front.";
csb[26] = "&quot;Make two other gold rings and put them at the two other corners of the breastpiece on the edge that is next to the inner border of the ephod.";
csb[27] = "&quot;Make two more gold rings and attach them to the bottom of the ephod\'s two shoulder pieces on its front, close to its seam, and above the ephod\'s woven waistband.";
csb[28] = "&quot;The artisans are to tie the breastpiece from its rings to the rings of the ephod with a cord of blue yarn, so that the breastpiece is above the ephod\'s waistband and does not come loose from the ephod.";
csb[29] = "&quot;Whenever he enters the sanctuary, Aaron is to carry the names of Israel\'s sons over his heart on the breastpiece for decisions, as a continual reminder before the LORD.";
csb[30] = "&quot;Place the Urim and Thummim in the breastpiece for decisions, so that they will also be over Aaron\'s heart whenever he comes before the LORD. Aaron will continually carry the means of decisions for the Israelites over his heart before the LORD.";
csb[31] = "&quot;You are to make the robe of the ephod entirely of blue yarn.";
csb[32] = "&quot;There should be an opening at its top in the center of it. Around the opening, there should be a woven collar with an opening like that of body armor so that it does not tear.";
csb[33] = "&quot;Make pomegranates of blue, purple, and scarlet yarn on its lower hem and all around it. Put gold bells between them all the way around,";
csb[34] = "&quot;so that gold bells and pomegranates alternate around the lower hem of the robe.";
csb[35] = "&quot;The robe will be worn by Aaron whenever he ministers, and its sound will be heard when he enters the sanctuary before the LORD and when he exits, so that he does not die.";
csb[36] = "&quot;You are to make a pure gold medallion and engrave it, like the engraving of a seal: HOLY TO THE LORD.";
csb[37] = "&quot;Fasten it to a cord of blue yarn so it can be placed on the turban; the medallion is to be on the front of the turban.";
csb[38] = "&quot;It will be on Aaron\'s forehead so that Aaron may bear the guilt connected with the holy offerings that the Israelites consecrate as all their holy gifts. It is always to be on his forehead, so that they may find acceptance with the LORD.";
csb[39] = "&quot;You are to weave the tunic from fine linen, make a turban of fine linen, and make an embroidered sash.";
csb[40] = "&quot;Make tunics, sashes, and headbands for Aaron\'s sons to give them glory and beauty.";
csb[41] = "&quot;Put these on your brother Aaron and his sons; then anoint, ordain, and consecrate them, so that they may serve me as priests.";
csb[42] = "&quot;Make them linen undergarments to cover their naked bodies; they must extend from the waist to the thighs.";
csb[43] = "&quot;These must be worn by Aaron and his sons whenever they enter the tent of meeting or approach the altar to minister in the sanctuary area, so that they do not incur guilt and die. This is to be a permanent statute for Aaron and for his future descendants.";
