kjv[5] = "And it shall be when the LORD shall bring thee into the land of the Canaanites, and the Hittites, and the Amorites, and the Hivites, and the Jebusites, which he sware unto thy fathers to give thee, a land flowing with milk and honey, that thou shalt keep this service in this month.";

asv[5] = "And it shall be, when Jehovah shall bring thee into the land of the Canaanite, and the Hittite, and the Amorite, and the Hivite, and the Jebusite, which he sware unto thy fathers to give thee, a land flowing with milk and honey, that thou shalt keep this service in this month.";

kjv[13] = "And every firstling of an ass thou shalt redeem with a lamb; and if thou wilt not redeem it, then thou shalt break his neck: and all the firstborn of man among thy children shalt thou redeem.";
csb[13] = "You must redeem every firstborn of a donkey with a flock animal, but if you do not redeem it, break its neck. However, you must redeem every firstborn among your sons.";
rsv[13] = "Every firstling of an ass you shall redeem with a lamb, or if you will not redeem it you shall break its neck. Every first-born of man among your sons you shall redeem.";
asv[13] = "And every firstling of an ass thou shalt redeem with a lamb; and if thou wilt not redeem it, then thou shalt break its neck: and all the first-born of man among thy sons shalt thou redeem.";
yng[13] = "`And every firstling of an ass thou dost ransom with a lamb, and if thou dost not ransom [it], then thou hast beheaded it: and every first-born of man among thy sons thou dost ransom.";
dby[13] = "And every firstling of an ass shalt thou ransom with a lamb; and if thou do not ransom it, thou shalt break its neck; and every firstborn of a man among thy sons shalt thou ransom.";
web[13] = "And every firstling of an ass thou shalt redeem with a lamb; and if thou wilt not redeem it, then thou shalt break his neck: and all the first-born of man among thy children shalt thou redeem.";
hnv[13] = "Every firstborn of a donkey you shall redeem with a lamb; and if you will not redeem it, then you shall break its neck; and you shall redeem all the firstborn of man among your sons.";

kjv[14] = "And it shall be when thy son asketh thee in time to come, saying, What [is] this? that thou shalt say unto him, By strength of hand the LORD brought us out from Egypt, from the house of bondage:";
csb[14] = "&quot;In the future, when your son asks you, \'What does this mean? \' say to him, \'By the strength of His hand the LORD brought us out of Egypt, out of the place of slavery.";
rsv[14] = "And when in time to come your son asks you, \'What does this mean?\' you shall say to him, \'By strength of hand the LORD brought us out of Egypt, from the house of bondage.";
asv[14] = "And it shall be, when thy son asketh thee in time to come, saying, What is this? that thou shalt say unto him, By strength of hand Jehovah brought us out from Egypt, from the house of bondage:";
yng[14] = "`And it hath been, when thy son asketh thee hereafter, saying, What [is] this? that thou hast said unto him, By strength of hand hath Jehovah brought us out from Egypt, from a house of servants;";
dby[14] = "And it shall be when thy son asketh thee in time to come, saying, What is this? that thou shalt say to him, With a powerful hand Jehovah brought us out from Egypt, out of the house of bondage.";
web[14] = "And it shall be when thy son asketh thee in time to come, saying, What [is] this? that thou shalt say to him, By strength of hand the LORD brought us out from Egypt, from the house of bondage:";
hnv[14] = "It shall be, when your son asks you in time to come, saying, \'What is this?\' that you shall tell him, \'By strength of hand the LORD brought us out from Mitzrayim, from the house of bondage;";
vul[14] = "cumque interrogaverit te filius tuus cras dicens quid est hoc respondebis ei in manu forti eduxit nos Dominus de Aegypto de domo servitutis";
kjv[15] = "And it came to pass, when Pharaoh would hardly let us go, that the LORD slew all the firstborn in the land of Egypt, both the firstborn of man, and the firstborn of beast: therefore I sacrifice to the LORD all that openeth the matrix, being males; but all the firstborn of my children I redeem.";
csb[15] = "When Pharaoh stubbornly refused to let us go, the LORD killed every firstborn male in the land of Egypt, from the firstborn of man to the firstborn of livestock. That is why I sacrifice to the LORD all the firstborn of the womb that are males, but I redeem all the firstborn of my sons.\'";
rsv[15] = "For when Pharaoh stubbornly refused to let us go, the LORD slew all the first-born in the land of Egypt, both the first-born of man and the first-born of cattle. Therefore I sacrifice to the LORD all the males that first open the womb; but all the first-born of my sons I redeem.\'";
asv[15] = "and it came to pass, when Pharaoh would hardly let us go, that Jehovah slew all the first-born in the land of Egypt, both the first-born of man, and the first-born of beast: therefore I sacrifice to Jehovah all that openeth the womb, being males; but all the first-born of my sons I redeem.";
yng[15] = "yea, it cometh to pass, when Pharaoh hath been pained to send us away, that Jehovah doth slay every first-born in the land of Egypt, from the first-born of man even unto the first-born of beast; therefore I am sacrificing to Jehovah all opening a womb who [are] males, and every first-born of my sons I ransom;";
dby[15] = "And it came to pass, when Pharaoh stubbornly refused to let us go, that Jehovah slew all the firstborn in the land of Egypt, both the firstborn of men and the firstborn of cattle: therefore I sacrifice to Jehovah all that breaketh open the womb -- being males; and every firstborn of my children I ransom.";
web[15] = "And it came to pass, when Pharaoh would hardly let us go, that the LORD slew all the first-born in the land of Egypt, both the first-born of man, and the first-born of beasts: therefore I sacrifice to the LORD all that openeth the matrix, being males; but all the first-born of my children I redeem.";
hnv[15] = "and it happened, when Par`oh would hardly let us go, that the LORD killed all the firstborn in the land of Mitzrayim, both the firstborn of man, and the firstborn of animal. Therefore I sacrifice to the LORD all that opens the womb, being males; but all the firstborn of my sons I redeem.\'";
vul[15] = "nam cum induratus esset Pharao et nollet nos dimittere occidit Dominus omne primogenitum in terra Aegypti a primogenito hominis usque ad primogenitum iumentorum idcirco immolo Domino omne quod aperit vulvam masculini sexus et omnia primogenita filiorum meorum redimo";
kjv[16] = "And it shall be for a token upon thine hand, and for frontlets between thine eyes: for by strength of hand the LORD brought us forth out of Egypt.";
csb[16] = "So let it be a sign on your hand and a symbol* on your forehead, for the LORD brought us out of Egypt by the strength of His hand.&quot;";
rsv[16] = "It shall be as a mark on your hand or frontlets between your eyes; for by a strong hand the LORD brought us out of Egypt.&quot;";
asv[16] = "And it shall be for a sign upon thy hand, and for frontlets between thine eyes: for by strength of hand Jehovah brought us forth out of Egypt.";
yng[16] = "and it hath been for a token on thy hand, and for frontlets between thine eyes, for by strength of hand hath Jehovah brought us out of Egypt.\'";
dby[16] = "And it shall be for a sign on thy hand, and for frontlets between thine eyes, for with a powerful hand Jehovah brought us forth out of Egypt.";
web[16] = "And it shall be for a token upon thy hand, and for frontlets between thy eyes: for by strength of hand the LORD brought us forth out of Egypt.";
hnv[16] = "It shall be for a sign on your hand, and for symbols between your eyes: for by strength of hand the LORD brought us forth out of Mitzrayim.&quot;";
vul[16] = "erit igitur quasi signum in manu tua et quasi adpensum quid ob recordationem inter oculos tuos eo quod in manu forti eduxerit nos Dominus de Aegypto";
kjv[17] = "And it came to pass, when Pharaoh had let the people go, that God led them not [through] the way of the land of the Philistines, although that [was] near; for God said, Lest peradventure the people repent when they see war, and they return to Egypt:";
csb[17] = "When Pharaoh let the people go, God did not lead them along the road to the land of the Philistines, even though it was nearby; for God said, &quot;The people will change their minds and return to Egypt if they face war.&quot;";
rsv[17] = "When Pharaoh let the people go, God did not lead them by way of the land of the Philistines, although that was near; for God said, &quot;Lest the people repent when they see war, and return to Egypt.&quot;";
asv[17] = "And it came to pass, when Pharaoh had let the people go, that God led them not by the way of the land of the Philistines, although that was near; for God said, Lest peradventure the people repent when they see war, and they return to Egypt:";
yng[17] = "And it cometh to pass in Pharaoh\'s sending the people away, that God hath not led them the way of the land of the Philistines, for it [is] near; for God said, `Lest the people repent in their seeing war, and have turned back towards Egypt;\'";
dby[17] = "And it came to pass, when Pharaoh let the people go, that God did not lead them the way of the land of the Philistines, although that was near; for God said, That the people may not repent when they see conflict, and return to Egypt.";
web[17] = "And it came to pass, when Pharaoh had let the people go, that God led them not [through] the way of the land of the Philistines, although that [was] near, for God said, Lest peradventure the people repent when they see war, and they return to Egypt.";
hnv[17] = "It happened, when Par`oh had let the people go, that God didn\'t lead them by the way of the land of the Pelishtim, although that was near; for God said, &quot;Lest perhaps the people change their minds when they see war, and they return to Mitzrayim;&quot;";
vul[17] = "igitur cum emisisset Pharao populum non eos duxit Dominus per viam terrae Philisthim quae vicina est reputans ne forte paeniteret eum si vidisset adversum se bella consurgere et reverteretur in Aegyptum";
kjv[18] = "But God led the people about, [through] the way of the wilderness of the Red sea: and the children of Israel went up harnessed out of the land of Egypt.";
csb[18] = "So He led the people around toward the Red Sea along the road of the wilderness. And the Israelites left the land of Egypt in battle formation.";
rsv[18] = "But God led the people round by the way of the wilderness toward the Red Sea. And the people of Israel went up out of the land of Egypt equipped for battle.";
asv[18] = "but God led the people about, by the way of the wilderness by the Red Sea: and the children of Israel went up armed out of the land of Egypt.";
yng[18] = "and God turneth round the people the way of the wilderness of the Red Sea, and by fifties have the sons of Israel gone up from the land of Egypt.";
dby[18] = "And God led the people about, the way of the wilderness of the Red Sea; and the children of Israel went arrayed out of the land of Egypt.";
web[18] = "But God led the people about, [through] the way of the wilderness of the Red Sea: and the children of Israel went up harnassed from the land of Egypt.";
hnv[18] = "but God led the people around by the way of the wilderness by the Sea of Suf; and the children of Yisra\'el went up armed out of the land of Mitzrayim.";
vul[18] = "sed circumduxit per viam deserti quae est iuxta mare Rubrum et armati ascenderunt filii Israhel de terra Aegypti";
kjv[19] = "And Moses took the bones of Joseph with him: for he had straitly sworn the children of Israel, saying, God will surely visit you; and ye shall carry up my bones away hence with you.";
csb[19] = "Moses took the bones of Joseph with him, because Joseph had made the Israelites swear a solemn oath, saying, &quot;God will certainly come to your aid; then you must take my bones with you from this place.&quot;";
rsv[19] = "And Moses took the bones of Joseph with him; for Joseph had solemnly sworn the people of Israel, saying, &quot;God will visit you; then you must carry my bones with you from here.&quot;";
asv[19] = "And Moses took the bones of Joseph with him: for he had straitly sworn the children of Israel, saying, God will surely visit you; and ye shall carry up my bones away hence with you.";
yng[19] = "And Moses taketh the bones of Joseph with him, for he certainly caused the sons of Israel to swear, saying, `God doth certainly inspect you, and ye have brought up my bones from this with you.\'";
dby[19] = "And Moses took the bones of Joseph with him; for he had made the children of Israel swear an oath, saying, God will be sure to visit you; then ye shall carry my bones with you hence.";
web[19] = "And Moses took the bones of Joseph with him: for he had strictly sworn the children of Israel, saying, God will surely visit you; and ye shall carry up my bones hence with you.";
hnv[19] = "Moshe took the bones of Yosef with him, for he had made the children of Yisra\'el swear, saying, &quot;God will surely visit you, and you shall carry up my bones away from here with you.&quot;";

csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Consecrate every firstborn male to me, the firstborn from every womb among the Israelites, both man and domestic animal; it is mine.&quot;";
csb[3] = "Then Moses said to the people, &quot;Remember this day when you came out of Egypt, out of the place of slavery, for the LORD brought you out of here by the strength of his hand. Nothing leavened may be eaten.";
csb[4] = "&quot;Today, in the month of Abib, you are going out.";
csb[5] = "&quot;When the LORD brings you into the land of the Canaanites, Hethites, Amorites, Hivites, and Jebusites, which he swore to your fathers that he would give you, a land flowing with milk and honey, you must carry out this ceremony in this month.";
csb[6] = "&quot;For seven days you must eat unleavened bread, and on the seventh day there is to be a festival to the LORD.";
csb[7] = "&quot;Unleavened bread is to be eaten for those seven days. Nothing leavened may be found among you, and no yeast may be found among you in all your territory.";
csb[8] = "&quot;On that day explain to your son, \'This is because of what the LORD did for me when I came out of Egypt.\'";
csb[9] = "&quot;Let it serve as a sign for you on your hand and as a reminder on your forehead, so that the LORD\'s instruction may be in your mouth; for the LORD brought you out of Egypt with a strong hand.";
csb[10] = "&quot;Keep this statute at its appointed time from year to year.";
csb[11] = "&quot;When the LORD brings you into the land of the Canaanites, as he swore to you and your fathers, and gives it to you,";
csb[12] = "&quot;you are to present to the LORD every firstborn male of the womb. All firstborn offspring of the livestock you own that are males will be the LORD\'s.";
csb[13] = "&quot;You must redeem every firstborn of a donkey with a flock animal, but if you do not redeem it, break its neck. However, you must redeem every firstborn among your sons.";
csb[14] = "&quot;In the future, when your son asks you, \'What does this mean? \' say to him, \'By the strength of his hand the LORD brought us out of Egypt, out of the place of slavery.";
csb[15] = "&quot;When Pharaoh stubbornly refused to let us go, the LORD killed every firstborn male in the land of Egypt, both the firstborn of humans and the firstborn of livestock. That is why I sacrifice to the LORD all the firstborn of the womb that are males, but I redeem all the firstborn of my sons.\'";
csb[16] = "&quot;So let it be a sign on your hand and a symbol on your forehead, for the LORD brought us out of Egypt by the strength of his hand.&quot;";
csb[17] = "When Pharaoh let the people go, God did not lead them along the road to the land of the Philistines, even though it was nearby; for God said, &quot;The people will change their minds and return to Egypt if they face war.&quot;";
csb[18] = "So he led the people around toward the Red Sea along the road of the wilderness. And the Israelites left the land of Egypt in battle formation.";
csb[19] = "Moses took the bones of Joseph with him, because Joseph had made the Israelites swear a solemn oath, saying, &quot;God will certainly come to your aid; then you must take my bones with you from this place.&quot;";
csb[20] = "They set out from Succoth and camped at Etham on the edge of the wilderness.";
csb[21] = "The LORD went ahead of them in a pillar of cloud to lead them on their way during the day and in a pillar of fire to give them light at night, so that they could travel day or night.";
csb[22] = "The pillar of cloud by day and the pillar of fire by night never left its place in front of the people.";
