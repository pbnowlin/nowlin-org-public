csb[16] = "They also fashioned two gold filigree settings and two gold rings and attached the two rings to its two corners.";
csb[17] = "Then they attached the two gold cords to the two gold rings on the corners of the breastpiece.";
csb[18] = "They attached the other ends of the two cords to the two filigree settings, and in this way they attached them to the ephod\'s shoulder pieces in front.";
csb[19] = "They made two other gold rings and put them at the two other corners of the breastpiece on the edge that is next to the inner border of the ephod.";
csb[20] = "They made two more gold rings and attached them to the bottom of the ephod\'s two shoulder pieces on its front, close to its seam, above the ephod\'s woven waistband.";
csb[21] = "Then they tied the breastpiece from its rings to the rings of the ephod with a cord of blue yarn, so that the breastpiece was above the ephod\'s waistband and did not come loose from the ephod. They did just as the LORD had commanded Moses.";
csb[22] = "They made the woven robe of the ephod entirely of blue yarn.";
csb[23] = "There was an opening in the center of the robe like that of body armor with a collar around the opening so that it would not tear.";
csb[24] = "They made pomegranates of finely spun blue, purple, and scarlet yarn on the lower hem of the robe.";
csb[25] = "They made bells of pure gold and attached the bells between the pomegranates, all around the hem of the robe between the pomegranates,";
csb[26] = "a bell and a pomegranate alternating all around the lower hem of the robe to be worn for ministry. They made it just as the LORD had commanded Moses.";
csb[27] = "They made the tunics of fine woven linen for Aaron and his sons.";
csb[28] = "They made the turban and the ornate headbands of fine linen, the linen undergarments of finely spun linen,";
csb[29] = "and the sash of finely spun linen expertly embroidered with blue, purple, and scarlet yarn. They did just as the LORD had commanded Moses.";
csb[30] = "They made a medallion, the holy diadem, out of pure gold and wrote on it an inscription like the engraving on a seal: HOLY TO THE LORD.";
csb[31] = "They attached a cord of blue yarn to it in order to mount it on the turban, just as the LORD had commanded Moses.";
csb[32] = "So all the work for the tabernacle, the tent of meeting, was finished. The Israelites did everything just as the LORD had commanded Moses.";
csb[33] = "They brought the tabernacle to Moses: the tent with all its furnishings, its clasps, its supports, its crossbars, and its pillars and bases;";
csb[34] = "the covering of ram skins dyed red and the covering of fine leather; the curtain for the screen;";
csb[35] = "the ark of the testimony with its poles and the mercy seat;";
csb[36] = "the table, all its utensils, and the Bread of the Presence;";
csb[37] = "the pure gold lampstand, with its lamps arranged and all its utensils, as well as the oil for the light;";
csb[38] = "the gold altar; the anointing oil; the fragrant incense; the screen for the entrance to the tent;";
csb[39] = "the bronze altar with its bronze grate, its poles, and all its utensils; the basin with its stand;";
csb[40] = "the hangings of the courtyard, its posts and bases, the screen for the gate of the courtyard, its ropes and tent pegs, and all the furnishings for the service of the tabernacle, the tent of meeting;";
csb[41] = "and the specially woven garments for ministering in the sanctuary, the holy garments for the priest Aaron and the garments for his sons to serve as priests.";
csb[42] = "The Israelites had done all the work according to everything the LORD had commanded Moses.";
csb[43] = "Moses inspected all the work they had accomplished. They had done just as the LORD commanded. Then Moses blessed them.";
</script>
