csb[1] = "&quot;You are to make an altar for the burning of incense; make it of acacia wood.";
csb[2] = "&quot;It must be square, eighteen inches long and eighteen inches wide; it must be thirty-six inches high. Its horns must be of one piece with it.";
csb[3] = "&quot;Overlay its top, all around its sides, and its horns with pure gold; make a gold molding all around it.";
csb[4] = "&quot;Make two gold rings for it under the molding on two of its sides; put these on opposite sides of it to be holders for the poles to carry it with.";
csb[5] = "&quot;Make the poles of acacia wood and overlay them with gold.";
csb[6] = "&quot;You are to place the altar in front of the curtain by the ark of the testimony -- in front of the mercy seat that is over the testimony -- where I will meet with you.";
csb[7] = "&quot;Aaron must burn fragrant incense on it; he must burn it every morning when he tends the lamps.";
csb[8] = "&quot;When Aaron sets up the lamps at twilight, he must burn incense. There is to be an incense offering before the LORD throughout your generations.";
csb[9] = "&quot;You must not offer unauthorized incense on it, or a burnt or grain offering; you are not to pour a drink offering on it.";
csb[10] = "&quot;Once a year Aaron is to perform the atonement ceremony for the altar. Throughout your generations he is to perform the atonement ceremony for it once a year, with the blood of the sin offering for atonement on the horns. The altar is especially holy to the LORD.&quot;";
csb[11] = "The LORD spoke to Moses:";
csb[12] = "&quot;When you take a census of the Israelites to register them, each of the men must pay a ransom for his life to the LORD as they are registered. Then no plague will come on them as they are registered.";
csb[13] = "&quot;Everyone who is registered must pay half a shekel according to the sanctuary shekel (twenty gerahs to the shekel). This half shekel is a contribution to the LORD.";
csb[14] = "&quot;Each man who is registered, twenty years old or more, must give this contribution to the LORD.";
csb[15] = "&quot;The wealthy may not give more and the poor may not give less than half a shekel when giving the contribution to the LORD to atone for your lives.";
csb[16] = "&quot;Take the atonement price from the Israelites and use it for the service of the tent of meeting. It will serve as a reminder for the Israelites before the LORD to atone for your lives.&quot;";
csb[17] = "The LORD spoke to Moses:";
csb[18] = "&quot;Make a bronze basin for washing and a bronze stand for it. Set it between the tent of meeting and the altar, and put water in it.";
csb[19] = "&quot;Aaron and his sons must wash their hands and feet from the basin.";
csb[20] = "&quot;Whenever they enter the tent of meeting or approach the altar to minister by burning an offering to the LORD, they must wash with water so that they will not die.";
csb[21] = "&quot;They must wash their hands and feet so that they will not die; this is to be a permanent statute for them, for Aaron and his descendants throughout their generations.&quot;";
csb[22] = "The LORD spoke to Moses:";
csb[23] = "&quot;Take for yourself the finest spices: 12 1/2 pounds of liquid myrrh, half as much (6 1/4 pounds) of fragrant cinnamon, 6 1/4 pounds of fragrant cane,";
csb[24] = "&quot;12 1/2 pounds of cassia (by the sanctuary shekel), and a gallon of olive oil.";
csb[25] = "&quot;Prepare from these a holy anointing oil, a scented blend, the work of a perfumer; it will be holy anointing oil.";
csb[26] = "&quot;With it you are to anoint the tent of meeting, the ark of the testimony,";
csb[27] = "&quot;the table with all its utensils, the lampstand with its utensils, the altar of incense,";
csb[28] = "&quot;the altar of burnt offering with all its utensils, and the basin with its stand.";
csb[29] = "&quot;Consecrate them and they will be especially holy. Whatever touches them will be consecrated.";
csb[30] = "&quot;Anoint Aaron and his sons and consecrate them to serve me as priests.";
csb[31] = "&quot;Tell the Israelites: This will be my holy anointing oil throughout your generations.";
csb[32] = "&quot;It must not be used for ordinary anointing on a person\'s body, and you must not make anything like it using its formula. It is holy, and it must be holy to you.";
csb[33] = "&quot;Anyone who blends something like it or puts some of it on an unauthorized person must be cut off from his people.&quot;";
csb[34] = "The LORD said to Moses: &quot;Take fragrant spices: stacte, onycha, and galbanum; the spices and pure frankincense are to be in equal measures.";
csb[35] = "&quot;Prepare expertly blended incense from these; it is to be seasoned with salt, pure and holy.";
csb[36] = "&quot;Grind some of it into a fine powder and put some in front of the testimony in the tent of meeting, where I will meet with you. It must be especially holy to you.";
csb[37] = "&quot;As for the incense you are making, you must not make any for yourselves using its formula. It is to be regarded by you as holy -- belonging to the LORD.";
csb[38] = "&quot;Anyone who makes something like it to smell its fragrance must be cut off from his people.&quot;";
