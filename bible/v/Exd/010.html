dby[2] = "and that thou mightest tell in the ears of thy son and thy son\'s son what I have wrought in Egypt, and my signs which I have done among them; and ye shall know that I am Jehovah.";

rsv[3] = "So Moses and Aaron went in to Pharaoh, and said to him, &quot;Thus says the LORD, the God of the Hebrews, \'How long will you refuse to humble yourself before me? Let my people go, that they may serve me.";
asv[3] = "And Moses and Aaron went in unto Pharaoh, and said unto him, Thus saith Jehovah, the God of the Hebrews, How long wilt thou refuse to humble thyself before me? let my people go, that they may serve me.";
yng[3] = "And Moses cometh in -- Aaron also -- unto Pharaoh, and they say unto him, `Thus said Jehovah, God of the Hebrews, Until when hast thou refused to be humbled at My presence? send My people away, and they serve Me,";
dby[3] = "And Moses and Aaron came to Pharaoh, and said to him, Thus saith Jehovah the God of the Hebrews: How long dost thou refuse to humble thyself before me? let my people go, that they may serve me.";
web[3] = "And Moses and Aaron came in to Pharaoh, and said to him, Thus saith the LORD God of the Hebrews, How long wilt thou refuse to humble thyself before me? Let my people go, that they may serve me.";
hnv[3] = "Moshe and Aharon went in to Par`oh, and said to him, &quot;This is what the LORD, the God of the Hebrews, says: \'How long will you refuse to humble yourself before me? Let my people go, that they may serve me.";
vul[3] = "introierunt ergo Moses et Aaron ad Pharaonem et dixerunt ad eum haec dicit Dominus Deus Hebraeorum usquequo non vis subici mihi dimitte populum meum ut sacrificet mihi";

rsv[4] = "For if you refuse to let my people go, behold, tomorrow I will bring locusts into your country,";

dby[4] = "For, if thou refuse to let my people go, behold, I will to-morrow bring locusts into thy borders;";

vul[4] = "sin autem resistis et non vis dimittere eum ecce ego inducam cras lucustam in fines tuos";
kjv[5] = "And they shall cover the face of the earth, that one cannot be able to see the earth: and they shall eat the residue of that which is escaped, which remaineth unto you from the hail, and shall eat every tree which groweth for you out of the field:";

asv[5] = "and they shall cover the face of the earth, so that one shall not be able to see the earth: and they shall eat the residue of that which is escaped, which remaineth unto you from the hail, and shall eat every tree which groweth for you out of the field:";
yng[5] = "and it hath covered the eye of the land, and none is able to see the land, and it hath eaten the remnant of that which is escaped, which is left to you from the hail, and it hath eaten every tree which is springing for you out of the field;";
dby[5] = "and they shall cover the face of the land, so that ye will not be able to see the land; and they shall eat the residue of that which is escaped, which ye have remaining from the hail, and shall eat every tree which ye have growing in the field;";
web[5] = "And they shall cover the face of the earth, that one cannot be able to see the earth: and they shall eat the residue of that which hath escaped, which remaineth to you from the hail, and shall eat every tree which groweth for you out of the field:";
hnv[5] = "and they shall cover the surface of the eretz, so that one won\'t be able to see the eretz. They shall eat the residue of that which has escaped, which remains to you from the hail, and shall eat every tree which grows for you out of the field.";
vul[5] = "quae operiat superficiem terrae nec quicquam eius appareat sed comedatur quod residuum fuit grandini conrodet enim omnia ligna quae germinant in agris";
kjv[6] = "And they shall fill thy houses, and the houses of all thy servants, and the houses of all the Egyptians; which neither thy fathers, nor thy fathers\' fathers have seen, since the day that they were upon the earth unto this day. And he turned himself, and went out from Pharaoh.";
rsv[6] = "and they shall fill your houses, and the houses of all your servants and of all the Egyptians; as neither your fathers nor your grandfathers have seen, from the day they came on earth to this day.\'&quot; Then he turned and went out from Pharaoh.";
asv[6] = "and thy houses shall be filled, and the houses of all thy servants, and the houses of all the Egyptians; as neither thy fathers nor thy fathers\' fathers have seen, since the day that they were upon the earth unto this day. And he turned, and went out from Pharaoh.";
yng[6] = "and they have filled thy houses, and the houses of all thy servants, and the houses of all the Egyptians, which neither thy fathers nor thy father\'s fathers have seen, since the day of their being on the ground unto this day,\' -- and he turneth and goeth out from Pharaoh.";
dby[6] = "and they shall fill thy houses, and the houses of all thy bondmen, and the houses of all the Egyptians; which neither thy fathers nor thy fathers\' fathers have seen, since the day that they were upon the earth unto this day. And he turned and went out from Pharaoh.";
web[6] = "And they shall fill thy houses, and the houses of all thy servants, and the houses of all the Egyptians; which neither thy fathers, nor thy fathers\' fathers have seen, since the day that they were upon the earth to this day. And he turned himself, and went out from Pharaoh.";
hnv[6] = "Your houses shall be filled, and the houses of all your servants, and the houses of all the Mitzrim; as neither your fathers nor your fathers\' fathers have seen, since the day that they were on the eretz to this day.\'&quot; He turned, and went out from Par`oh.";
vul[6] = "et implebunt domos tuas et servorum tuorum et omnium Aegyptiorum quantam non viderunt patres tui et avi ex quo orti sunt super terram usque in praesentem diem avertitque se et egressus est a Pharaone";
kjv[7] = "And Pharaoh\'s servants said unto him, How long shall this man be a snare unto us? let the men go, that they may serve the LORD their God: knowest thou not yet that Egypt is destroyed?";
rsv[7] = "And Pharaoh\'s servants said to him, &quot;How long shall this man be a snare to us? Let the men go, that they may serve the LORD their God; do you not yet understand that Egypt is ruined?&quot;";
asv[7] = "And Pharaoh\'s servants said unto him, How long shall this man be a snare unto us? let the men go, that they may serve Jehovah their God: knowest thou not yet that Egypt is destroyed?";
yng[7] = "And the servants of Pharaoh say unto him, `Until when doth this [one] become a snare to us? send the men away, and they serve Jehovah their God; knowest thou not yet that Egypt hath perished?\'";
dby[7] = "And Pharaoh\'s bondmen said to him, How long shall this man be a snare to us? let the men go, that they may serve Jehovah their God: dost thou not yet know that Egypt is ruined?";
web[7] = "And Pharaoh\'s servants said to him, How long shall this man be a snare to us? Let the men go, that they may serve the LORD their God: knowest thou not yet that Egypt is destroyed?";
hnv[7] = "Par`oh\'s servants said to him, &quot;How long will this man be a snare to us? Let the men go, that they may serve the LORD, their God. Don\'t you yet know that Mitzrayim is destroyed?";
vul[7] = "dixerunt autem servi Pharaonis ad eum usquequo patiemur hoc scandalum dimitte homines ut sacrificent Domino Deo suo nonne vides quod perierit Aegyptus";

rsv[8] = "So Moses and Aaron were brought back to Pharaoh; and he said to them, &quot;Go, serve the LORD your God; but who are to go?&quot;";
asv[8] = "And Moses and Aaron were brought again unto Pharaoh: and he said unto them, Go, serve Jehovah your God; but who are they that shall go?";
yng[8] = "And Moses is brought back -- Aaron also -- unto Pharaoh, and he saith unto them, `Go, serve Jehovah your God; -- who and who [are] those going?\'";
dby[8] = "And Moses and Aaron were brought again to Pharaoh. And he said to them, Go, serve Jehovah your God. Who are they that shall go?";
web[8] = "And Moses and Aaron were brought again to Pharaoh: and he said to them, Go, serve the LORD your God: [but] who [are] they that shall go?";
hnv[8] = "Moshe and Aharon were brought again to Par`oh, and he said to them, &quot;Go, serve the LORD your God; but who are those who will go?&quot;";
vul[8] = "revocaveruntque Mosen et Aaron ad Pharaonem qui dixit eis ite sacrificate Domino Deo vestro quinam sunt qui ituri sunt";

asv[9] = "And Moses said, We will go with our young and with our old; with our sons and with our daughters, with our flocks and with our herds will we go; for we must hold a feast unto Jehovah.";

dby[9] = "And Moses said, We will go with our young and with our old, with our sons and with our daughters; with our flocks and with our herds will we go; for we have a feast of Jehovah.";
web[9] = "And Moses said, We will go with our young and with our old, with our sons and with our daughters, with our flocks and with our herds will we go; for we [must hold] a feast to the LORD.";

kjv[10] = "And he said unto them, Let the LORD be so with you, as I will let you go, and your little ones: look [to it]; for evil [is] before you.";

asv[10] = "And he said unto them, So be Jehovah with you, as I will let you go, and your little ones: look to it; for evil is before you.";
yng[10] = "And he saith unto them, `Be it so, Jehovah [be] with you when I send you and your infants away; see -- for evil [is] before your faces;";
dby[10] = "And he said to them, Let Jehovah be so with you, as I let you go, and your little ones: see that evil is before you!";
web[10] = "And he said to them, Let the LORD be so with you, as I will let you go, and your little ones: look [to it]; for evil [is] before you.";
hnv[10] = "He said to them, &quot;The LORD be with you if I will let you go with your little ones! See, evil is clearly before your faces.";

kjv[12] = "And the LORD said unto Moses, Stretch out thine hand over the land of Egypt for the locusts, that they may come up upon the land of Egypt, and eat every herb of the land, [even] all that the hail hath left.";
csb[12] = "The LORD then said to Moses, &quot;Stretch out your hand over the land of Egypt and the locusts will come up over it and eat every plant in the land, everything that the hail left.&quot;";
rsv[12] = "Then the LORD said to Moses, &quot;Stretch out your hand over the land of Egypt for the locusts, that they may come upon the land of Egypt, and eat every plant in the land, all that the hail has left.&quot;";
asv[12] = "And Jehovah said unto Moses, Stretch out thy hand over the land of Egypt for the locusts, that they may come up upon the land of Egypt, and eat every herb of the land, even all that the hail hath left.";
yng[12] = "And Jehovah saith unto Moses, `Stretch out thy hand against the land of Egypt for the locust, and it goeth up against the land of Egypt, and doth eat every herb of the land -- all that the hail hath left.\'";
dby[12] = "And Jehovah said to Moses, Stretch out thy hand over the land of Egypt for the locusts, that they may come up over the land of Egypt, and eat every herb of the land -- all that the hail hath left.";
web[12] = "And the LORD said to Moses, Stretch out thy hand over the land of Egypt for the locusts, that they may come upon the land of Egypt, and eat every herb of the land, [even] all that the hail hath left.";
hnv[12] = "The LORD said to Moshe, &quot;Stretch out your hand over the land of Mitzrayim for the locusts, that they may come up on the land of Mitzrayim, and eat every herb of the land, even all that the hail has left.&quot;";
vul[12] = "dixit autem Dominus ad Mosen extende manum tuam super terram Aegypti ad lucustam ut ascendat super eam et devoret omnem herbam quae residua fuit grandini";
kjv[13] = "And Moses stretched forth his rod over the land of Egypt, and the LORD brought an east wind upon the land all that day, and all [that] night; [and] when it was morning, the east wind brought the locusts.";
csb[13] = "So Moses stretched out his staff over the land of Egypt, and the LORD sent an east wind over the land all that day and through the night. By morning the east wind had brought in the locusts.";
rsv[13] = "So Moses stretched forth his rod over the land of Egypt, and the LORD brought an east wind upon the land all that day and all that night; and when it was morning the east wind had brought the locusts.";
asv[13] = "And Moses stretched forth his rod over the land of Egypt, and Jehovah brought an east wind upon the land all that day, and all the night; and when it was morning, the east wind brought the locusts.";
yng[13] = "And Moses stretcheth out his rod against the land of Egypt, and Jehovah hath led an east wind over the land all that day, and all the night; the morning hath been, and the east wind hath lifted up the locust.";
dby[13] = "And Moses stretched out his staff over the land of Egypt, and Jehovah brought an east wind on the land all that day and all that night. When it was morning, the east wind brought the locusts.";
web[13] = "And Moses stretched forth his rod over the land of Egypt, and the LORD brought an east wind upon the land all that day, and all [that] night: [and] when it was morning, the east wind brought the locusts.";
hnv[13] = "Moshe stretched forth his rod over the land of Mitzrayim, and the LORD brought an east wind on the land all that day, and all the night; and when it was morning, the east wind brought the locusts.";
vul[13] = "extendit Moses virgam super terram Aegypti et Dominus induxit ventum urentem tota illa die ac nocte et mane facto ventus urens levavit lucustas";
kjv[14] = "And the locusts went up over all the land of Egypt, and rested in all the coasts of Egypt: very grievous [were they]; before them there were no such locusts as they, neither after them shall be such.";
csb[14] = "The locusts went up over the entire land of Egypt and settled on the whole territory of Egypt. Never before had there been such a large number of locusts, and there never will be again.";
rsv[14] = "And the locusts came up over all the land of Egypt, and settled on the whole country of Egypt, such a dense swarm of locusts as had never been before, nor ever shall be again.";
asv[14] = "And the locusts went up over all the land of Egypt, and rested in all the borders of Egypt; very grievous were they; before them there were no such locusts as they, neither after them shall be such.";
yng[14] = "And the locust goeth up against all the land of Egypt, and resteth in all the border of Egypt -- very grievous: before it there hath not been such a locust as it, and after it there is none such;";
dby[14] = "And the locusts went up over all the land of Egypt, and rested in all the borders of Egypt, very grievous; before them there were no such locusts as they, neither after them will be such.";
web[14] = "And the locusts went up over all the land of Egypt, and rested in all the borders of Egypt: very grievous [were they]; before them there were no such locusts as they, neither after them will be such.";
hnv[14] = "The locusts went up over all the land of Mitzrayim, and rested in all the borders of Mitzrayim. They were very grievous. Before them there were no such locusts as they, neither after them shall be such.";
vul[14] = "quae ascenderunt super universam terram Aegypti et sederunt in cunctis finibus Aegyptiorum innumerabiles quales ante illud tempus non fuerant nec postea futurae sunt";
kjv[15] = "For they covered the face of the whole earth, so that the land was darkened; and they did eat every herb of the land, and all the fruit of the trees which the hail had left: and there remained not any green thing in the trees, or in the herbs of the field, through all the land of Egypt.";
csb[15] = "They covered the surface of the whole land so that the land was black, and they consumed all the plants on the ground and all the fruit on the trees that the hail had left. Nothing green was left on the trees or the plants in the field throughout the land of Egypt.";
rsv[15] = "For they covered the face of the whole land, so that the land was darkened, and they ate all the plants in the land and all the fruit of the trees which the hail had left; not a green thing remained, neither tree nor plant of the field, through all the land of Egypt.";
asv[15] = "For they covered the face of the whole earth, so that the land was darkened; and they did eat every herb of the land, and all the fruit of the trees which the hail had left: and there remained not any green thing, either tree or herb of the field, through all the land of Egypt.";
yng[15] = "and it covereth the eye of all the land, and the land is darkened; and it eateth every herb of the land, and all the fruit of the trees which the hail hath left, and there hath not been left any green thing in the trees, or in the herb of the field, in all the land of Egypt.\'";
dby[15] = "And they covered the face of the whole land, so that the land was darkened; and they ate every herb of the land, and all the fruit of the trees that the hail had left; and there remained not any green thing on the trees, and in the herbs of the field, throughout the land of Egypt.";
web[15] = "For they covered the face of the whole earth, so that the land was darkened; and they ate every herb of the land, and all the fruit of the trees which the hail had left: and there remained not any green thing on the trees, or in the herbs of the field, through all the land of Egypt.";
hnv[15] = "For they covered the surface of the whole eretz, so that the land was darkened, and they ate every herb of the land, and all the fruit of the trees which the hail had left. There remained nothing green, either tree or herb of the field, through all the land of Mitzrayim.";
vul[15] = "operueruntque universam superficiem terrae vastantes omnia devorata est igitur herba terrae et quicquid pomorum in arboribus fuit quae grando dimiserat nihilque omnino virens relictum est in lignis et in herbis terrae in cuncta Aegypto";
kjv[16] = "Then Pharaoh called for Moses and Aaron in haste; and he said, I have sinned against the LORD your God, and against you.";
csb[16] = "Pharaoh urgently sent for Moses and Aaron and said, &quot;I have sinned against Yahweh your God and against you.";
rsv[16] = "Then Pharaoh called Moses and Aaron in haste, and said, &quot;I have sinned against the LORD your God, and against you.";
asv[16] = "Then Pharaoh called for Moses and Aaron in haste; and he said, I have sinned against Jehovah your God, and against you.";
yng[16] = "And Pharaoh hasteth to call for Moses and for Aaron, and saith, `I have sinned against Jehovah your God, and against you,";
dby[16] = "And Pharaoh called Moses and Aaron in haste; and he said, I have sinned against Jehovah your God, and against you.";
web[16] = "Then Pharaoh called for Moses and Aaron in haste; and he said, I have sinned against the LORD your God, and against you.";
hnv[16] = "Then Par`oh called for Moshe and Aharon in haste, and he said, &quot;I have sinned against the LORD your God, and against you.";
vul[16] = "quam ob rem festinus Pharao vocavit Mosen et Aaron et dixit eis peccavi in Dominum Deum vestrum et in vos";
kjv[17] = "Now therefore forgive, I pray thee, my sin only this once, and intreat the LORD your God, that he may take away from me this death only.";
csb[17] = "Please forgive my sin once more and make an appeal to Yahweh your God, so that He will take this death away from me.&quot;";
rsv[17] = "Now therefore, forgive my sin, I pray you, only this once, and entreat the LORD your God only to remove this death from me.&quot;";
asv[17] = "Now therefore forgive, I pray thee, my sin only this once, and entreat Jehovah your God, that he may take away from me this death only.";
yng[17] = "and now, bear with, I pray you, my sin, only this time, and make ye supplication to Jehovah your God, that He turn aside from off me only this death.\'";
dby[17] = "And now, forgive, I pray you, my sin only this time, and intreat Jehovah your God that he may take away from me this death only!";
web[17] = "Now therefore forgive, I pray thee, my sin only this once, and entreat the LORD your God that he may take away from me this death only.";
hnv[17] = "Now therefore please forgive my sin again, and pray to the LORD your God, that he may also take away from me this death.&quot;";
vul[17] = "sed nunc dimittite peccatum mihi etiam hac vice et rogate Dominum Deum vestrum ut auferat a me mortem istam";
kjv[18] = "And he went out from Pharaoh, and intreated the LORD.";
csb[18] = "Moses left Pharaoh\'s presence and appealed to the LORD.";

csb[1] = "Then the LORD said to Moses, &quot;Go to Pharaoh, for I have hardened his heart and the hearts of his officials so that I may do these miraculous signs of mine among them,";
csb[2] = "&quot;and so that you may tell your son and grandson how severely I dealt with the Egyptians and performed miraculous signs among them, and you will know that I am the LORD.&quot;";
csb[3] = "So Moses and Aaron went in to Pharaoh and told him, &quot;This is what the LORD, the God of the Hebrews, says: How long will you refuse to humble yourself before me? Let my people go, that they may worship me.";
csb[4] = "&quot;But if you refuse to let my people go, then tomorrow I will bring locusts into your territory.";
csb[5] = "&quot;They will cover the surface of the land so that no one will be able to see the land. They will eat the remainder left to you that escaped the hail; they will eat every tree you have growing in the fields.";
csb[6] = "&quot;They will fill your houses, all your officials\' houses, and the houses of all the Egyptians -- something your fathers and grandfathers never saw since the time they occupied the land until today.&quot; Then he turned and left Pharaoh\'s presence.";
csb[7] = "Pharaoh\'s officials asked him, &quot;How long must this man be a snare to us? Let the men go, so that they may worship the LORD their God. Don\'t you realize yet that Egypt is devastated? &quot;";
csb[8] = "So Moses and Aaron were brought back to Pharaoh. &quot;Go, worship the LORD your God,&quot; Pharaoh said. &quot;But exactly who will be going? &quot;";
csb[9] = "Moses replied, &quot;We will go with our young and with our old; we will go with our sons and with our daughters, with our flocks and with our herds because we must hold the LORD\'s festival.&quot;";
csb[10] = "He said to them, &quot;The Lord would have to be with you if I would ever let you and your families go! Look out -- you\'re heading for trouble.";
csb[11] = "&quot;No, go -- just able-bodied men -- worship the LORD, since that\'s what you want.&quot; And they were driven from Pharaoh\'s presence.";
csb[12] = "The LORD then said to Moses, &quot;Stretch out your hand over the land of Egypt, and the locusts will come up over it and eat every plant in the land, everything that the hail left.&quot;";
csb[13] = "So Moses stretched out his staff over the land of Egypt, and the LORD sent an east wind over the land all that day and through the night. By morning the east wind had brought in the locusts.";
csb[14] = "The locusts went up over the entire land of Egypt and settled on the whole territory of Egypt. Never before had there been such a large number of locusts, and there never will be again.";
csb[15] = "They covered the surface of the whole land so that the land was black, and they consumed all the plants on the ground and all the fruit on the trees that the hail had left. Nothing green was left on the trees or the plants in the field throughout the land of Egypt.";
csb[16] = "Pharaoh urgently sent for Moses and Aaron and said, &quot;I have sinned against the LORD your God and against you.";
csb[17] = "&quot;Please forgive my sin once more and make an appeal to the LORD your God, so that he will just take this death away from me.&quot;";
csb[18] = "Moses left Pharaoh\'s presence and appealed to the LORD.";
csb[19] = "Then the LORD changed the wind to a strong west wind, and it carried off the locusts and blew them into the Red Sea. Not a single locust was left in all the territory of Egypt.";
csb[20] = "But the LORD hardened Pharaoh\'s heart, and he did not let the Israelites go.";
csb[21] = "Then the LORD said to Moses, &quot;Stretch out your hand toward heaven, and there will be darkness over the land of Egypt, a darkness that can be felt.&quot;";
csb[22] = "So Moses stretched out his hand toward heaven, and there was thick darkness throughout the land of Egypt for three days.";

csb[25] = "Moses responded, &quot;You must also let us have sacrifices and burnt offerings to prepare for the LORD our God.";
