kjv[3] = "Eat not of it raw, nor sodden at all with water, but roast [with] fire; his head with his legs, and with the purtenance thereof.";

dby[6] = "And ye shall keep it until the fourteenth day of this month; and the whole congregation of the assembly of Israel shall kill it between the two evenings.";

kjv[8] = "And this day shall be unto you for a memorial; and ye shall keep it a feast to the LORD throughout your generations; ye shall keep it a feast by an ordinance for ever.";
rsv[8] = "They shall eat the flesh that night, roasted; with unleavened bread and bitter herbs they shall eat it.";

dby[8] = "And they shall eat the flesh in that night, roast with fire, and unleavened bread; with bitter [herbs] shall they eat it.";
web[8] = "And they shall eat the flesh in that night, roasted with fire; and unleavened bread, [and] with bitter [herbs] they shall eat it.";
hnv[8] = "They shall eat the flesh in that night, roasted with fire, and matzah. They shall eat it with bitter herbs.";

kjv[9] = "Seven days shall ye eat unleavened bread; even the first day ye shall put away leaven out of your houses: for whosoever eateth leavened bread from the first day until the seventh day, that soul shall be cut off from Israel.";
rsv[9] = "Do not eat any of it raw or boiled with water, but roasted, its head with its legs and its inner parts.";

yng[9] = "ye do not eat of it raw, or boiled at all in water, but roast with fire, its head with its legs, and with its inwards;";
dby[9] = "Ye shall eat none of it raw, nor boiled at all with water, but roast with fire; its head with its legs and with its in-wards.";
web[9] = "Eat not of it raw, nor boiled at all with water, but roasted [with] fire; its head with its legs, and with its entrails.";
hnv[9] = "Don\'t eat it raw, nor boiled at all with water, but roasted with fire; with its head, its legs and its inner parts.";

kjv[10] = "And in the first day [there shall be] an holy convocation, and in the seventh day there shall be an holy convocation to you; no manner of work shall be done in them, save [that] which every man must eat, that only may be done of you.";
csb[10] = "Do not let any of it remain until morning; you must burn up any part of it that does remain before morning.";
rsv[10] = "And you shall let none of it remain until the morning, anything that remains until the morning you shall burn.";
asv[10] = "And ye shall let nothing of it remain until the morning; but that which remaineth of it until the morning ye shall burn with fire.";
yng[10] = "and ye do not leave of it till morning, and that which is remaining of it till morning with fire ye do burn.";

hnv[10] = "You shall let nothing of it remain until the morning; but that which remains of it until the morning you shall burn with fire.";

kjv[11] = "And ye shall observe [the feast of] unleavened bread; for in this selfsame day have I brought your armies out of the land of Egypt: therefore shall ye observe this day in your generations by an ordinance for ever.";
csb[11] = "Here is how you must eat it: you must be dressed for travel,* your sandals on your feet, and your staff in your hand. You are to eat it in a hurry; it is the Lord\'s Passover.";
rsv[11] = "In this manner you shall eat it: your loins girded, your sandals on your feet, and your staff in your hand; and you shall eat it in haste. It is the LORD\'s passover.";
asv[11] = "And thus shall ye eat it: with your loins girded, your shoes on your feet, and your staff in your hand; and ye shall eat it in haste: it is Jehovah\'s passover.";
yng[11] = "`And thus ye do eat it: your loins girded, your sandals on your feet, and your staff in your hand, and ye have eaten it in haste; it is Jehovah\'s passover,";
dby[11] = "And thus shall ye eat it: your loins shall be girded, your sandals on your feet, and your staff in your hand; and ye shall eat it in haste; it is Jehovah\'s passover.";
web[11] = "And thus shall ye eat it; [with] your loins girded, your shoes on your feet, and your staff in your hand: and ye shall eat it in haste; it [is] the LORD\'S passover.";
hnv[11] = "This is how you shall eat it: with your loins girded, your shoes on your feet, and your staff in your hand; and you shall eat it in haste: it is the LORD\'s Pesach.";
vul[11] = "sic autem comedetis illum renes vestros accingetis calciamenta habebitis in pedibus tenentes baculos in manibus et comedetis festinantes est enim phase id est transitus Domini";
kjv[12] = "In the first [month], on the fourteenth day of the month at even, ye shall eat unleavened bread, until the one and twentieth day of the month at even.";
csb[12] = "&quot;I will pass through the land of Egypt on that night and strike every firstborn male in the land of Egypt, both man and beast. I am Yahweh; I will execute judgments against all the gods of Egypt.";
rsv[12] = "For I will pass through the land of Egypt that night, and I will smite all the first-born in the land of Egypt, both man and beast; and on all the gods of Egypt I will execute judgments: I am the LORD.";
asv[12] = "For I will go through the land of Egypt in that night, and will smite all the first-born in the land of Egypt, both man and beast; and against all the gods of Egypt I will execute judgments: I am Jehovah.";
yng[12] = "and I have passed over through the land of Egypt during this night, and have smitten every first-born in the land of Egypt, from man even unto beast, and on all the gods of Egypt I do judgments; I [am] Jehovah.";
dby[12] = "And I will go through the land of Egypt in that night, and smite all the firstborn in the land of Egypt, both man and beast; and against all the gods of Egypt I will execute judgment: I am Jehovah.";
web[12] = "For I will pass through the land of Egypt this night, and will smite all the first-born in the land of Egypt, both man and beast: and against all the gods of Egypt I will execute judgment: I [am] the LORD.";
hnv[12] = "For I will go through the land of Mitzrayim in that night, and will strike all the firstborn in the land of Mitzrayim, both man and animal. Against all the gods of Mitzrayim I will execute judgments: I am the LORD.";
vul[12] = "et transibo per terram Aegypti nocte illa percutiamque omne primogenitum in terra Aegypti ab homine usque ad pecus et in cunctis diis Aegypti faciam iudicia ego Dominus";
kjv[13] = "Seven days shall there be no leaven found in your houses: for whosoever eateth that which is leavened, even that soul shall be cut off from the congregation of Israel, whether he be a stranger, or born in the land.";
csb[13] = "The blood on the houses where you are staying will be a distinguishing mark for you; when I see the blood, I will pass over you. No plague will be among you to destroy you when I strike the land of Egypt.";
rsv[13] = "The blood shall be a sign for you, upon the houses where you are; and when I see the blood, I will pass over you, and no plague shall fall upon you to destroy you, when I smite the land of Egypt.";
asv[13] = "And the blood shall be to you for a token upon the houses where ye are: and when I see the blood, I will pass over you, and there shall no plague be upon you to destroy you, when I smite the land of Egypt.";
yng[13] = "`And the blood hath become a sign for you on the houses where ye [are], and I have seen the blood, and have passed over you, and a plague is not on you for destruction in My smiting in the land of Egypt.";
dby[13] = "And the blood shall be for you as a sign on the houses in which ye are; and when I see the blood, I will pass over you; and the plague shall not be among you for destruction, when I smite the land of Egypt.";
web[13] = "And the blood shall be to you for a token upon the houses where ye [are]: and when I see the blood, I will pass over you, and the plague shall not be upon you to destroy [you], when I smite the land of Egypt.";
hnv[13] = "The blood shall be to you for a token on the houses where you are: and when I see the blood, I will pass over you, and there shall no plague be on you to destroy you, when I strike the land of Mitzrayim.";
vul[13] = "erit autem sanguis vobis in signum in aedibus in quibus eritis et videbo sanguinem ac transibo vos nec erit in vobis plaga disperdens quando percussero terram Aegypti";
kjv[14] = "Ye shall eat nothing leavened; in all your habitations shall ye eat unleavened bread.";
csb[14] = "&quot;This day is to be a memorial for you, and you must celebrate it as a festival to the LORD. You are to celebrate it throughout your generations as a permanent statute.";
rsv[14] = "&quot;This day shall be for you a memorial day, and you shall keep it as a feast to the LORD; throughout your generations you shall observe it as an ordinance for ever.";
asv[14] = "And this day shall be unto you for a memorial, and ye shall keep it a feast to Jehovah: throughout your generations ye shall keep it a feast by an ordinance for ever.";
yng[14] = "`And this day hath become to you a memorial, and ye have kept it a feast to Jehovah to your generations; -- a statute age-during; ye keep it a feast.";
dby[14] = "And this day shall be unto you for a memorial; and ye shall celebrate it [as] a feast to Jehovah; throughout your generations [as] an ordinance for ever shall ye celebrate it.";
web[14] = "And this day shall be to you for a memorial; and ye shall keep it a feast to the LORD throughout your generations: ye shall keep it a feast by an ordinance for ever.";
hnv[14] = "This day shall be to you for a memorial, and you shall keep it a feast to the LORD: throughout your generations you shall keep it a feast by an ordinance forever.";
vul[14] = "habebitis autem hanc diem in monumentum et celebrabitis eam sollemnem Domino in generationibus vestris cultu sempiterno";
kjv[15] = "Then Moses called for all the elders of Israel, and said unto them, Draw out and take you a lamb according to your families, and kill the passover.";
csb[15] = "You must eat unleavened bread for seven days. On the first day you must remove yeast from your houses. Whoever eats what is leavened from the first day through the seventh day must be cut off from Israel.";
rsv[15] = "Seven days you shall eat unleavened bread; on the first day you shall put away leaven out of your houses, for if any one eats what is leavened, from the first day until the seventh day, that person shall be cut off from Israel.";
asv[15] = "Seven days shall ye eat unleavened bread; even the first day ye shall put away leaven out of your houses: for whosoever eateth leavened bread from the first day until the seventh day, that soul shall be cut off from Israel.";
yng[15] = "Seven days ye eat unleavened things; only -- in the first day ye cause leaven to cease out of your houses; for any one eating anything fermented from the first day till the seventh day, even that person hath been cut off from Israel.";
dby[15] = "Seven days shall ye eat unleavened bread: on the very first day ye shall put away leaven out of your houses; for whoever eateth leavened bread from the first day until the seventh day -- that soul shall be cut off from Israel.";
web[15] = "Seven days shall ye eat unleavened bread; even the first day ye shall put away leaven out of your houses: for whoever eateth leavened bread, from the first day till the seventh day, that soul shall be cut off from Israel.";
hnv[15] = "Seven days shall you eat matzah; even the first day you shall put away yeast out of your houses, for whoever eats leavened bread from the first day until the seventh day, that soul shall be cut off from Yisra\'el.";
vul[15] = "septem diebus azyma comedetis in die primo non erit fermentum in domibus vestris quicumque comederit fermentatum peribit anima illa de Israhel a primo die usque ad diem septimum";
kjv[16] = "And ye shall take a bunch of hyssop, and dip [it] in the blood that [is] in the bason, and strike the lintel and the two side posts with the blood that [is] in the bason; and none of you shall go out at the door of his house until the morning.";
csb[16] = "You are to hold a sacred assembly on the first day and another sacred assembly on the seventh day. No work may be done on those days except for preparing what people need to eat -- you may do only that.";
rsv[16] = "On the first day you shall hold a holy assembly, and on the seventh day a holy assembly; no work shall be done on those days; but what every one must eat, that only may be prepared by you.";
asv[16] = "And in the first day there shall be to you a holy convocation, and in the seventh day a holy convocation; no manner of work shall be done in them, save that which every man must eat, that only may be done by you.";
yng[16] = "`And in the first day [is] a holy convocation, and in the seventh day ye have a holy convocation; any work is not done in them, only that which is eaten by any person -- it alone is done by you,";
dby[16] = "And on the first day ye shall have a holy convocation, and on the seventh day a holy convocation: no manner of work shall be done on them, save what is eaten by every person -- that only shall be done by you.";
web[16] = "And in the first day [there shall be] a holy convocation, and in the seventh day there shall be a holy convocation to you: no manner of work shall be done in them, save [that] which every man must eat, that only may be done by you.";
hnv[16] = "In the first day there shall be to you a holy convocation, and in the seventh day a holy convocation; no manner of work shall be done in them, except that which every man must eat, that only may be done by you.";
vul[16] = "dies prima erit sancta atque sollemnis et dies septima eadem festivitate venerabilis nihil operis facietis in eis exceptis his quae ad vescendum pertinent";
kjv[17] = "For the LORD will pass through to smite the Egyptians; and when he seeth the blood upon the lintel, and on the two side posts, the LORD will pass over the door, and will not suffer the destroyer to come in unto your houses to smite [you].";
csb[17] = "&quot;You are to observe the Festival of Unleavened Bread because on this very day I brought your divisions out of the land of Egypt. You must observe this day throughout your generations as a permanent statute.";
rsv[17] = "And you shall observe the feast of unleavened bread, for on this very day I brought your hosts out of the land of Egypt: therefore you shall observe this day, throughout your generations, as an ordinance for ever.";
asv[17] = "And ye shall observe the [feast of] unleavened bread; for in this selfsame day have I brought your hosts out of the land of Egypt: therefore shall ye observe this day throughout your generations by an ordinance for ever.";
yng[17] = "and ye have observed the unleavened things, for in this self-same day I have brought out your hosts from the land of Egypt, and ye have observed this day to your generations -- a statute age-during.";
dby[17] = "And ye shall keep the [feast of] unleavened [bread]; for in this same day have I brought your hosts out of the land of Egypt; and ye shall keep this day in your generations [as] an ordinance for ever.";
web[17] = "And ye shall observe [the feast of] unleavened bread; for in this same day have I brought your armies out of the land of Egypt: therefore shall ye observe this day in your generations by an ordinance for ever.";
hnv[17] = "You shall observe the feast of matzah; for in this same day have I brought your hosts out of the land of Mitzrayim: therefore shall you observe this day throughout your generations by an ordinance forever.";
vul[17] = "et observabitis azyma in eadem enim ipsa die educam exercitum vestrum de terra Aegypti et custodietis diem istum in generationes vestras ritu perpetuo";
kjv[18] = "And ye shall observe this thing for an ordinance to thee and to thy sons for ever.";
csb[18] = "You are to eat unleavened bread in the first month, from the evening of the fourteenth day of the month until the evening of the twenty-first day.";
rsv[18] = "In the first month, on the fourteenth day of the month at evening, you shall eat unleavened bread, and so until the twenty-first day of the month at evening.";
asv[18] = "In the first [month], on the fourteenth day of the month at even, ye shall eat unleavened bread, until the one and twentieth day of the month at even.";
yng[18] = "`In the first [month], in the fourteenth day of the month, in the evening, ye do eat unleavened things until the one and twentieth day of the month, at evening;";
dby[18] = "In the first [month], on the fourteenth day of the month, in the evening, ye shall eat unleavened bread until the one and twentieth day of the month in the evening.";
web[18] = "In the first [month], on the fourteenth day of the month at evening, ye shall eat unleavened bread, till the one and twentieth day of the month at evening.";
hnv[18] = "In the first month, on the fourteenth day of the month at evening, you shall eat matzah, until the twenty first day of the month at evening.";
vul[18] = "primo mense quartadecima die mensis ad vesperam comedetis azyma usque ad diem vicesimam primam eiusdem mensis ad vesperam";
kjv[19] = "And it shall come to pass, when ye be come to the land which the LORD will give you, according as he hath promised, that ye shall keep this service.";
csb[19] = "Yeast must not be found in your houses for seven days. If anyone eats something leavened, that person, whether a foreign resident or native of the land, must be cut off from the community of Israel.";
rsv[19] = "For seven days no leaven shall be found in your houses; for if any one eats what is leavened, that person shall be cut off from the congregation of Israel, whether he is a sojourner or a native of the land.";
asv[19] = "Seven days shall there be no leaven found in your houses: for whosoever eateth that which is leavened, that soul shall be cut off from the congregation of Israel, whether he be a sojourner, or one that is born in the land.";
yng[19] = "seven days leaven is not found in your houses, for any [one] eating anything fermented -- that person hath been cut off from the company of Israel, among the sojourners or among the natives of the land;";
dby[19] = "Seven days shall there be no leaven found in your houses; for whoever eateth what is leavened -- that soul shall be cut off from the assembly of Israel, whether he be a sojourner, or born in the land.";
web[19] = "Seven days shall there be no leaven found in your houses: for whoever eateth that which is leavened, even that soul shall be cut off from the congregation of Israel, whether he shall be a stranger, or born in the land.";
hnv[19] = "Seven days shall there be no yeast found in your houses, for whoever eats that which is leavened, that soul shall be cut off from the congregation of Yisra\'el, whether he be a foreigner, or one who is born in the land.";
vul[19] = "septem diebus fermentum non invenietur in domibus vestris qui comederit fermentatum peribit anima eius de coetu Israhel tam de advenis quam de indigenis terrae";
kjv[20] = "And it shall come to pass, when your children shall say unto you, What mean ye by this service?";

kjv[1] = "And the LORD spake unto Moses and Aaron in the land of Egypt, saying,";
kjv[2] = "This month [shall be] unto you the beginning of months: it [shall be] the first month of the year to you.";
kjv[3] = "Speak ye unto all the congregation of Israel, saying, In the tenth [day] of this month they shall take to them every man a lamb, according to the house of [their] fathers, a lamb for an house:";
kjv[4] = "And if the household be too little for the lamb, let him and his neighbour next unto his house take [it] according to the number of the souls; every man according to his eating shall make your count for the lamb.";
kjv[5] = "Your lamb shall be without blemish, a male of the first year: ye shall take [it] out from the sheep, or from the goats:";
kjv[6] = "And ye shall keep it up until the fourteenth day of the same month: and the whole assembly of the congregation of Israel shall kill it in the evening.";
kjv[7] = "And they shall take of the blood, and strike [it] on the two side posts and on the upper door post of the houses, wherein they shall eat it.";
kjv[8] = "And they shall eat the flesh in that night, roast with fire, and unleavened bread; [and] with bitter [herbs] they shall eat it.";
kjv[9] = "Eat not of it raw, nor sodden at all with water, but roast [with] fire; his head with his legs, and with the purtenance thereof.";
kjv[10] = "And ye shall let nothing of it remain until the morning; and that which remaineth of it until the morning ye shall burn with fire.";
kjv[11] = "And thus shall ye eat it; [with] your loins girded, your shoes on your feet, and your staff in your hand; and ye shall eat it in haste: it [is] the LORD'S passover.";
kjv[12] = "For I will pass through the land of Egypt this night, and will smite all the firstborn in the land of Egypt, both man and beast; and against all the gods of Egypt I will execute judgment: I [am] the LORD.";
kjv[13] = "And the blood shall be to you for a token upon the houses where ye [are]: and when I see the blood, I will pass over you, and the plague shall not be upon you to destroy [you], when I smite the land of Egypt.";
kjv[14] = "And this day shall be unto you for a memorial; and ye shall keep it a feast to the LORD throughout your generations; ye shall keep it a feast by an ordinance for ever.";
kjv[15] = "Seven days shall ye eat unleavened bread; even the first day ye shall put away leaven out of your houses: for whosoever eateth leavened bread from the first day until the seventh day, that soul shall be cut off from Israel.";
kjv[16] = "And in the first day [there shall be] an holy convocation, and in the seventh day there shall be an holy convocation to you; no manner of work shall be done in them, save [that] which every man must eat, that only may be done of you.";
kjv[17] = "And ye shall observe [the feast of] unleavened bread; for in this selfsame day have I brought your armies out of the land of Egypt: therefore shall ye observe this day in your generations by an ordinance for ever.";
kjv[18] = "In the first [month], on the fourteenth day of the month at even, ye shall eat unleavened bread, until the one and twentieth day of the month at even.";
kjv[19] = "Seven days shall there be no leaven found in your houses: for whosoever eateth that which is leavened, even that soul shall be cut off from the congregation of Israel, whether he be a stranger, or born in the land.";
kjv[20] = "Ye shall eat nothing leavened; in all your habitations shall ye eat unleavened bread.";
kjv[21] = "Then Moses called for all the elders of Israel, and said unto them, Draw out and take you a lamb according to your families, and kill the passover.";
kjv[22] = "And ye shall take a bunch of hyssop, and dip [it] in the blood that [is] in the bason, and strike the lintel and the two side posts with the blood that [is] in the bason; and none of you shall go out at the door of his house until the morning.";
kjv[23] = "For the LORD will pass through to smite the Egyptians; and when he seeth the blood upon the lintel, and on the two side posts, the LORD will pass over the door, and will not suffer the destroyer to come in unto your houses to smite [you].";
kjv[24] = "And ye shall observe this thing for an ordinance to thee and to thy sons for ever.";
kjv[25] = "And it shall come to pass, when ye be come to the land which the LORD will give you, according as he hath promised, that ye shall keep this service.";
kjv[26] = "And it shall come to pass, when your children shall say unto you, What mean ye by this service?";
kjv[27] = "That ye shall say, It [is] the sacrifice of the LORD'S passover, who passed over the houses of the children of Israel in Egypt, when he smote the Egyptians, and delivered our houses. And the people bowed the head and worshipped.";
kjv[28] = "And the children of Israel went away, and did as the LORD had commanded Moses and Aaron, so did they.";
kjv[29] = "And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the firstborn of the captive that [was] in the dungeon; and all the firstborn of cattle.";
kjv[30] = "And Pharaoh rose up in the night, he, and all his servants, and all the Egyptians; and there was a great cry in Egypt; for [there was] not a house where [there was] not one dead.";
kjv[31] = "And he called for Moses and Aaron by night, and said, Rise up, [and] get you forth from among my people, both ye and the children of Israel; and go, serve the LORD, as ye have said.";
kjv[32] = "Also take your flocks and your herds, as ye have said, and be gone; and bless me also.";
kjv[33] = "And the Egyptians were urgent upon the people, that they might send them out of the land in haste; for they said, We [be] all dead [men].";
kjv[34] = "And the people took their dough before it was leavened, their kneadingtroughs being bound up in their clothes upon their shoulders.";
kjv[35] = "And the children of Israel did according to the word of Moses; and they borrowed of the Egyptians jewels of silver, and jewels of gold, and raiment:";
kjv[36] = "And the LORD gave the people favour in the sight of the Egyptians, so that they lent unto them [such things as they required]. And they spoiled the Egyptians.";
kjv[37] = "And the children of Israel journeyed from Rameses to Succoth, about six hundred thousand on foot [that were] men, beside children.";
kjv[38] = "And a mixed multitude went up also with them; and flocks, and herds, [even] very much cattle.";
kjv[39] = "And they baked unleavened cakes of the dough which they brought forth out of Egypt, for it was not leavened; because they were thrust out of Egypt, and could not tarry, neither had they prepared for themselves any victual.";
kjv[40] = "Now the sojourning of the children of Israel, who dwelt in Egypt, [was] four hundred and thirty years.";
kjv[41] = "And it came to pass at the end of the four hundred and thirty years, even the selfsame day it came to pass, that all the hosts of the LORD went out from the land of Egypt.";
kjv[42] = "It [is] a night to be much observed unto the LORD for bringing them out from the land of Egypt: this [is] that night of the LORD to be observed of all the children of Israel in their generations.";
kjv[43] = "And the LORD said unto Moses and Aaron, This [is] the ordinance of the passover: There shall no stranger eat thereof:";
kjv[44] = "But every man's servant that is bought for money, when thou hast circumcised him, then shall he eat thereof.";
kjv[45] = "A foreigner and an hired servant shall not eat thereof.";
kjv[46] = "In one house shall it be eaten; thou shalt not carry forth ought of the flesh abroad out of the house; neither shall ye break a bone thereof.";
kjv[47] = "All the congregation of Israel shall keep it.";
kjv[48] = "And when a stranger shall sojourn with thee, and will keep the passover to the LORD, let all his males be circumcised, and then let him come near and keep it; and he shall be as one that is born in the land: for no uncircumcised person shall eat thereof.";
kjv[49] = "One law shall be to him that is homeborn, and unto the stranger that sojourneth among you.";
kjv[50] = "Thus did all the children of Israel; as the LORD commanded Moses and Aaron, so did they.";
kjv[51] = "And it came to pass the selfsame day, [that] the LORD did bring the children of Israel out of the land of Egypt by their armies.";
csb[1] = "The LORD said to Moses and Aaron in the land of Egypt:";
csb[2] = "&quot;This month is to be the beginning of months for you; it is the first month of your year.";
csb[3] = "&quot;Tell the whole community of Israel that on the tenth day of this month they must each select an animal of the flock according to their fathers\' families, one animal per family.";
csb[4] = "&quot;If the household is too small for a whole animal, that person and the neighbor nearest his house are to select one based on the combined number of people; you should apportion the animal according to what each will eat.";
csb[5] = "&quot;You must have an unblemished animal, a year-old male; you may take it from either the sheep or the goats.";
csb[6] = "&quot;You are to keep it until the fourteenth day of this month; then the whole assembly of the community of Israel will slaughter the animals at twilight.";
csb[7] = "&quot;They must take some of the blood and put it on the two doorposts and the lintel of the houses where they eat them.";
csb[8] = "&quot;They are to eat the meat that night; they should eat it, roasted over the fire along with unleavened bread and bitter herbs.";
csb[9] = "&quot;Do not eat any of it raw or cooked in boiling water, but only roasted over fire -- its head as well as its legs and inner organs.";
csb[10] = "&quot;You must not leave any of it until morning; any part of it left until morning you must burn.";
csb[11] = "&quot;Here is how you must eat it: You must be dressed for travel, your sandals on your feet, and your staff in your hand. You are to eat it in a hurry; it is the LORD\'s Passover.";
csb[12] = "&quot;I will pass through the land of Egypt on that night and strike every firstborn male in the land of Egypt, both people and animals. I am the LORD; I will execute judgments against all the gods of Egypt.";
csb[13] = "&quot;The blood on the houses where you are staying will be a distinguishing mark for you; when I see the blood, I will pass over you. No plague will be among you to destroy you when I strike the land of Egypt.";
csb[14] = "&quot;This day is to be a memorial for you, and you must celebrate it as a festival to the LORD. You are to celebrate it throughout your generations as a permanent statute.";
csb[15] = "&quot;You must eat unleavened bread for seven days. On the first day you must remove yeast from your houses. Whoever eats what is leavened from the first day through the seventh day must be cut off from Israel.";
csb[16] = "&quot;You are to hold a sacred assembly on the first day and another sacred assembly on the seventh day. No work may be done on those days except for preparing what people need to eat -- you may do only that.";
csb[17] = "&quot;You are to observe the Festival of Unleavened Bread because on this very day I brought your military divisions out of the land of Egypt. You must observe this day throughout your generations as a permanent statute.";
csb[18] = "&quot;You are to eat unleavened bread in the first month, from the evening of the fourteenth day of the month until the evening of the twenty-first day.";
csb[19] = "&quot;Yeast must not be found in your houses for seven days. If anyone eats something leavened, that person, whether a resident alien or native of the land, must be cut off from the community of Israel.";
csb[20] = "&quot;Do not eat anything leavened; eat unleavened bread in all your homes.&quot;";
csb[21] = "Then Moses summoned all the elders of Israel and said to them, &quot;Go, select an animal from the flock according to your families, and slaughter the Passover animal.";
csb[22] = "&quot;Take a cluster of hyssop, dip it in the blood that is in the basin, and brush the lintel and the two doorposts with some of the blood in the basin. None of you may go out the door of his house until morning.";
csb[23] = "&quot;When the LORD passes through to strike Egypt and sees the blood on the lintel and the two doorposts, he will pass over the door and not let the destroyer enter your houses to strike you.";
csb[24] = "&quot;Keep this command permanently as a statute for you and your descendants.";
csb[25] = "&quot;When you enter the land that the LORD will give you as he promised, you are to observe this ceremony.";
csb[26] = "&quot;When your children ask you, \'What does this ceremony mean to you? \'";
csb[27] = "&quot;you are to reply, \'It is the Passover sacrifice to the LORD, for he passed over the houses of the Israelites in Egypt when he struck the Egyptians and spared our homes.\' &quot; So the people knelt low and worshiped.";
csb[28] = "Then the Israelites went and did this; they did just as the LORD had commanded Moses and Aaron.";
csb[29] = "Now at midnight the LORD struck every firstborn male in the land of Egypt, from the firstborn of Pharaoh who sat on his throne to the firstborn of the prisoner who was in the dungeon, and every firstborn of the livestock.";
csb[30] = "During the night Pharaoh got up, he along with all his officials and all the Egyptians, and there was a loud wailing throughout Egypt because there wasn\'t a house without someone dead.";
csb[31] = "He summoned Moses and Aaron during the night and said, &quot;Get out immediately from among my people, both you and the Israelites, and go, worship the LORD as you have said.";
csb[32] = "&quot;Take even your flocks and your herds as you asked and leave, and also bless me.&quot;";
csb[33] = "Now the Egyptians pressured the people in order to send them quickly out of the country, for they said, &quot;We\'re all going to die! &quot;";
csb[34] = "So the people took their dough before it was leavened, with their kneading bowls wrapped up in their clothes on their shoulders.";
csb[35] = "The Israelites acted on Moses\'s word and asked the Egyptians for silver and gold items and for clothing.";
csb[36] = "And the LORD gave the people such favor with the Egyptians that they gave them what they requested. In this way they plundered the Egyptians.";
csb[37] = "The Israelites traveled from Rameses to Succoth, about six hundred thousand able-bodied men on foot, besides their families.";
csb[38] = "A mixed crowd also went up with them, along with a huge number of livestock, both flocks and herds.";
csb[39] = "The people baked the dough they had brought out of Egypt into unleavened loaves, since it had no yeast; for when they were driven out of Egypt, they could not delay and had not prepared provisions for themselves.";
csb[40] = "The time that the Israelites lived in Egypt was 430 years.";
csb[41] = "At the end of 430 years, on that same day, all the LORD\'s military divisions went out from the land of Egypt.";
csb[42] = "It was a night of vigil in honor of the LORD, because he would bring them out of the land of Egypt. This same night is in honor of the LORD, a night vigil for all the Israelites throughout their generations.";
csb[43] = "The LORD said to Moses and Aaron, &quot;This is the statute of the Passover: no foreigner may eat it.";
csb[44] = "&quot;But any slave a man has purchased may eat it, after you have circumcised him.";
csb[45] = "&quot;A temporary resident or hired worker may not eat the Passover.";
csb[46] = "&quot;It is to be eaten in one house. You may not take any of the meat outside the house, and you may not break any of its bones.";
csb[47] = "&quot;The whole community of Israel must celebrate it.";
csb[48] = "&quot;If an alien resides among you and wants to observe the LORD\'s Passover, every male in his household must be circumcised, and then he may participate; he will become like a native of the land. But no uncircumcised person may eat it.";
csb[49] = "&quot;The same law will apply to both the native and the alien who resides among you.&quot;";
csb[50] = "Then all the Israelites did this; they did just as the LORD had commanded Moses and Aaron.";
csb[51] = "On that same day the LORD brought the Israelites out of the land of Egypt according to their military divisions.";
</script>
