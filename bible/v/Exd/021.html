kjv[35] = "And if one man\'s ox hurt another\'s, that he die; then they shall sell the live ox, and divide the money of it; and the dead [ox] also they shall divide.";

csb[1] = "&quot;These are the ordinances that you are to set before them:";
csb[2] = "&quot;When you buy a Hebrew slave, he is to serve for six years; then in the seventh he is to leave as a free man without paying anything.";
csb[3] = "&quot;If he arrives alone, he is to leave alone; if he arrives with a wife, his wife is to leave with him.";
csb[4] = "&quot;If his master gives him a wife and she bears him sons or daughters, the wife and her children belong to her master, and the man must leave alone.";
csb[5] = "&quot;But if the slave declares, \'I love my master, my wife, and my children; I do not want to leave as a free man,\'";
csb[6] = "&quot;his master is to bring him to the judges and then bring him to the door or doorpost. His master will pierce his ear with an awl, and he will serve his master for life.";
csb[7] = "&quot;When a man sells his daughter as a concubine, she is not to leave as the male slaves do.";
csb[8] = "&quot;If she is displeasing to her master, who chose her for himself, then he must let her be redeemed. He has no right to sell her to foreigners because he has acted treacherously toward her.";
csb[9] = "&quot;Or if he chooses her for his son, he must deal with her according to the customary treatment of daughters.";
csb[10] = "&quot;If he takes an additional wife, he must not reduce the food, clothing, or marital rights of the first wife.";
csb[11] = "&quot;And if he does not do these three things for her, she may leave free of charge, without any payment.";
csb[12] = "&quot;Whoever strikes a person so that he dies must be put to death.";
csb[13] = "&quot;But if he did not intend any harm, and yet God allowed it to happen, I will appoint a place for you where he may flee.";
csb[14] = "&quot;If a person schemes and willfully acts against his neighbor to murder him, you must take him from my altar to be put to death.";
csb[15] = "&quot;Whoever strikes his father or his mother must be put to death.";
csb[16] = "&quot;Whoever kidnaps a person must be put to death, whether he sells him or the person is found in his possession.";
csb[17] = "&quot;Whoever curses his father or his mother must be put to death.";
csb[18] = "&quot;When men quarrel and one strikes the other with a stone or his fist, and the injured man does not die but is confined to bed,";
csb[19] = "&quot;if he can later get up and walk around outside leaning on his staff, then the one who struck him will be exempt from punishment. Nevertheless, he must pay for his lost work time and provide for his complete recovery.";
csb[20] = "&quot;When a man strikes his male or female slave with a rod, and the slave dies under his abuse, the owner must be punished.";
csb[21] = "&quot;However, if the slave can stand up after a day or two, the owner should not be punished because he is his owner\'s property.";
csb[22] = "&quot;When men get in a fight and hit a pregnant woman so that her children are born prematurely but there is no injury, the one who hit her must be fined as the woman\'s husband demands from him, and he must pay according to judicial assessment.";
csb[23] = "&quot;If there is an injury, then you must give life for life,";
csb[24] = "&quot;eye for eye, tooth for tooth, hand for hand, foot for foot,";
csb[25] = "&quot;burn for burn, bruise for bruise, wound for wound.";
csb[26] = "&quot;When a man strikes the eye of his male or female slave and destroys it, he must let the slave go free in compensation for his eye.";
csb[27] = "&quot;If he knocks out the tooth of his male or female slave, he must let the slave go free in compensation for his tooth.";
csb[28] = "&quot;When an ox gores a man or a woman to death, the ox must be stoned, and its meat may not be eaten, but the ox\'s owner is innocent.";
csb[29] = "&quot;However, if the ox was in the habit of goring, and its owner has been warned yet does not restrain it, and it kills a man or a woman, the ox must be stoned, and its owner must also be put to death.";
csb[30] = "&quot;If instead a ransom is demanded of him, he can pay a redemption price for his life in the full amount demanded from him.";
csb[31] = "&quot;If it gores a son or a daughter, he is to be dealt with according to this same law.";
csb[32] = "&quot;If the ox gores a male or female slave, he must give thirty shekels of silver to the slave\'s master, and the ox must be stoned.";
csb[33] = "&quot;When a man uncovers a pit or digs a pit, and does not cover it, and an ox or a donkey falls into it,";
csb[34] = "&quot;the owner of the pit must give compensation; he must pay to its owner, but the dead animal will become his.";
csb[35] = "&quot;When a man\'s ox injures his neighbor\'s ox and it dies, they must sell the live ox and divide its proceeds; they must also divide the dead animal.";
csb[36] = "&quot;If, however, it is known that the ox was in the habit of goring, yet its owner has not restrained it, he must compensate fully, ox for ox; the dead animal will become his.";
