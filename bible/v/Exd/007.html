csb[1] = "The LORD answered Moses, &quot;See, I have made you like God to Pharaoh, and Aaron your brother will be your prophet.";
csb[2] = "&quot;You must say whatever I command you; then Aaron your brother must declare it to Pharaoh so that he will let the Israelites go from his land.";
csb[3] = "&quot;But I will harden Pharaoh\'s heart and multiply my signs and wonders in the land of Egypt.";
csb[4] = "&quot;Pharaoh will not listen to you, but I will put my hand into Egypt and bring the military divisions of my people the Israelites out of the land of Egypt by great acts of judgment.";
csb[5] = "&quot;The Egyptians will know that I am the LORD when I stretch out my hand against Egypt and bring out the Israelites from among them.&quot;";
csb[6] = "So Moses and Aaron did this; they did just as the LORD commanded them.";
csb[7] = "Moses was eighty years old and Aaron eighty-three when they spoke to Pharaoh.";
csb[8] = "The LORD said to Moses and Aaron,";
csb[9] = "&quot;When Pharaoh tells you, \'Perform a miracle,\' tell Aaron, \'Take your staff and throw it down before Pharaoh. It will become a serpent.\' &quot;";
csb[10] = "So Moses and Aaron went in to Pharaoh and did just as the LORD had commanded. Aaron threw down his staff before Pharaoh and his officials, and it became a serpent.";
csb[11] = "But then Pharaoh called the wise men and sorcerers -- the magicians of Egypt, and they also did the same thing by their occult practices.";
csb[12] = "Each one threw down his staff, and it became a serpent. But Aaron\'s staff swallowed their staffs.";
csb[13] = "However, Pharaoh\'s heart was hard, and he did not listen to them, as the LORD had said.";
csb[14] = "Then the LORD said to Moses, &quot;Pharaoh\'s heart is hard: He refuses to let the people go.";
csb[15] = "&quot;Go to Pharaoh in the morning. When you see him walking out to the water, stand ready to meet him by the bank of the Nile. Take in your hand the staff that turned into a snake.";
csb[16] = "&quot;Tell him: The LORD, the God of the Hebrews, has sent me to tell you: Let my people go, so that they may worship me in the wilderness, but so far you have not listened.";
csb[17] = "&quot;This is what the LORD says: Here is how you will know that I am the LORD. Watch. I am about to strike the water in the Nile with the staff in my hand, and it will turn to blood.";
csb[18] = "&quot;The fish in the Nile will die, the river will stink, and the Egyptians will be unable to drink water from it.&quot;";
csb[19] = "So the LORD said to Moses, &quot;Tell Aaron: Take your staff and stretch out your hand over the waters of Egypt -- over their rivers, canals, ponds, and all their water reservoirs -- and they will become blood. There will be blood throughout the land of Egypt, even in wooden and stone containers.&quot;";
csb[20] = "Moses and Aaron did just as the LORD had commanded; in the sight of Pharaoh and his officials, he raised the staff and struck the water in the Nile, and all the water in the Nile was turned to blood.";
csb[21] = "The fish in the Nile died, and the river smelled so bad the Egyptians could not drink water from it. There was blood throughout the land of Egypt.";
csb[22] = "But the magicians of Egypt did the same thing by their occult practices. So Pharaoh\'s heart was hard, and he would not listen to them, as the LORD had said.";
csb[23] = "Pharaoh turned around, went into his palace, and didn\'t take even this to heart.";
csb[24] = "All the Egyptians dug around the Nile for water to drink because they could not drink the water from the river.";
csb[25] = "Seven days passed after the LORD struck the Nile.";
