csb[1] = "Bezalel made the ark of acacia wood, forty-five inches long, twenty-seven inches wide, and twenty-seven inches high.";
csb[2] = "He overlaid it with pure gold inside and out and made a gold molding all around it.";
csb[3] = "He cast four gold rings for it, for its four feet, two rings on one side and two rings on the other side.";
csb[4] = "He made poles of acacia wood and overlaid them with gold.";
csb[5] = "He inserted the poles into the rings on the sides of the ark for carrying the ark.";
csb[6] = "He made a mercy seat of pure gold, forty-five inches long and twenty-seven inches wide.";
csb[7] = "He made two cherubim of gold; he made them of hammered work at the two ends of the mercy seat,";
csb[8] = "one cherub at one end and one cherub at the other end. At each end, he made a cherub of one piece with the mercy seat.";
csb[9] = "They had wings spread out. They faced each other and covered the mercy seat with their wings. The faces of the cherubim were looking toward the mercy seat.";
csb[10] = "He constructed the table of acacia wood, thirty-six inches long, eighteen inches wide, and twenty-seven inches high.";
csb[11] = "He overlaid it with pure gold and made a gold molding all around it.";
csb[12] = "He made a three-inch frame all around it and made a gold molding all around its frame.";
csb[13] = "He cast four gold rings for it and attached the rings to the four corners at its four legs.";
csb[14] = "The rings were next to the frame as holders for the poles to carry the table.";
csb[15] = "He made the poles for carrying the table from acacia wood and overlaid them with gold.";
csb[16] = "He also made the utensils that would be on the table out of pure gold: its plates and cups, as well as its bowls and pitchers for pouring drink offerings.";
csb[17] = "Then he made the lampstand out of pure hammered gold. He made it all of one piece: its base and shaft, its ornamental cups, and its buds and petals.";
csb[18] = "Six branches extended from its sides, three branches of the lampstand from one side and three branches of the lampstand from the other side.";
csb[19] = "There were three cups shaped like almond blossoms, each with a bud and petals, on one branch, and three cups shaped like almond blossoms, each with a bud and petals, on the next branch. It was this way for the six branches that extended from the lampstand.";
csb[20] = "There were four cups shaped like almond blossoms on the lampstand shaft along with its buds and petals.";
csb[21] = "For the six branches that extended from it, a bud was under the first pair of branches from it, a bud under the second pair of branches from it, and a bud under the third pair of branches from it.";
csb[22] = "Their buds and branches were of one piece with it. All of it was a single hammered piece of pure gold.";
csb[23] = "He also made its seven lamps, snuffers, and firepans of pure gold.";
csb[24] = "He made it and all its utensils of seventy-five pounds of pure gold.";
csb[25] = "He made the altar of incense out of acacia wood. It was square, eighteen inches long and eighteen inches wide; it was thirty-six inches high. Its horns were of one piece with it.";
csb[26] = "He overlaid it, its top, all around its sides, and its horns with pure gold. Then he made a gold molding all around it.";
csb[27] = "He made two gold rings for it under the molding on two of its sides; he put these on opposite sides of it to be holders for the poles to carry it with.";
csb[28] = "He made the poles of acacia wood and overlaid them with gold.";
csb[29] = "He also made the holy anointing oil and the pure, fragrant, and expertly blended incense.";
