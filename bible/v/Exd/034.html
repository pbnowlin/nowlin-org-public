csb[1] = "The LORD said to Moses, &quot;Cut two stone tablets like the first ones, and I will write on them the words that were on the first tablets, which you broke.";
csb[2] = "&quot;Be prepared by morning. Come up Mount Sinai in the morning and stand before me on the mountaintop.";
csb[3] = "&quot;No one may go up with you; in fact, no one should be seen anywhere on the mountain. Even the flocks and herds are not to graze in front of that mountain.&quot;";
csb[4] = "Moses cut two stone tablets like the first ones. He got up early in the morning, and taking the two stone tablets in his hand, he climbed Mount Sinai, just as the LORD had commanded him.";
csb[5] = "The LORD came down in a cloud, stood with him there, and proclaimed his name, &quot;the LORD.&quot;";
csb[6] = "The LORD passed in front of him and proclaimed: The LORD -- the LORD is a compassionate and gracious God, slow to anger and abounding in faithful love and truth,";
csb[7] = "maintaining faithful love to a thousand generations, forgiving iniquity, rebellion, and sin. But he will not leave the guilty unpunished, bringing the fathers\' iniquity on the children and grandchildren to the third and fourth generation.";
csb[8] = "Moses immediately knelt low on the ground and worshiped.";
csb[9] = "Then he said, &quot;My Lord, if I have indeed found favor with you, my Lord, please go with us (even though this is a stiff-necked people), forgive our iniquity and our sin, and accept us as your own possession.&quot;";
csb[10] = "And the LORD responded: &quot;Look, I am making a covenant. I will perform wonders in the presence of all your people that have never been done in the whole earth or in any nation. All the people you live among will see the LORD\'s work, for what I am doing with you is awe-inspiring.";
csb[11] = "&quot;Observe what I command you today. I am going to drive out before you the Amorites, Canaanites, Hethites, Perizzites, Hivites, and Jebusites.";
csb[12] = "&quot;Be careful not to make a treaty with the inhabitants of the land that you are going to enter; otherwise, they will become a snare among you.";
csb[13] = "&quot;Instead, you must tear down their altars, smash their sacred pillars, and chop down their Asherah poles.";
csb[14] = "&quot; Because the LORD is jealous for his reputation, you are never to bow down to another god. He is a jealous God.";
csb[15] = "&quot;Do not make a treaty with the inhabitants of the land, or else when they prostitute themselves with their gods and sacrifice to their gods, they will invite you, and you will eat their sacrifices.";
csb[16] = "&quot;Then you will take some of their daughters as brides for your sons. Their daughters will prostitute themselves with their gods and cause your sons to prostitute themselves with their gods.";
csb[17] = "&quot;Do not make cast images of gods for yourselves.";
csb[18] = "&quot;Observe the Festival of Unleavened Bread. You are to eat unleavened bread for seven days at the appointed time in the month of Abib, as I commanded you, for you came out of Egypt in the month of Abib.";
csb[19] = "&quot;The firstborn male from every womb belongs to me, including all your male livestock, the firstborn of cattle or sheep.";
csb[20] = "&quot;You may redeem the firstborn of a donkey with a sheep, but if you do not redeem it, break its neck. You must redeem all the firstborn of your sons. No one is to appear before me empty-handed.";
csb[21] = "&quot;You are to labor six days but you must rest on the seventh day; you must even rest during plowing and harvesting times.";
csb[22] = "&quot;Observe the Festival of Weeks with the firstfruits of the wheat harvest, and the Festival of Ingathering at the turn of the agricultural year.";
csb[23] = "&quot;Three times a year all your males are to appear before the Lord GOD, the God of Israel.";
csb[24] = "&quot;For I will drive out nations before you and enlarge your territory. No one will covet your land when you go up three times a year to appear before the LORD your God.";
csb[25] = "&quot;Do not present the blood for my sacrifice with anything leavened. The sacrifice of the Passover Festival must not remain until morning.";
csb[26] = "&quot;Bring the best firstfruits of your land to the house of the LORD your God. &quot;You must not boil a young goat in its mother\'s milk.&quot;";
csb[27] = "The LORD also said to Moses, &quot;Write down these words, for I have made a covenant with you and with Israel based on these words.&quot;";
csb[28] = "Moses was there with the LORD forty days and forty nights; he did not eat food or drink water. He wrote the Ten Commandments, the words of the covenant, on the tablets.";
csb[29] = "As Moses descended from Mount Sinai -- with the two tablets of the testimony in his hands as he descended the mountain -- he did not realize that the skin of his face shone as a result of his speaking with the LORD.";
csb[30] = "When Aaron and all the Israelites saw Moses, the skin of his face shone! They were afraid to come near him.";
csb[31] = "But Moses called out to them, so Aaron and all the leaders of the community returned to him, and Moses spoke to them.";
csb[32] = "Afterward all the Israelites came near, and he commanded them to do everything the LORD had told him on Mount Sinai.";
csb[33] = "When Moses had finished speaking with them, he put a veil over his face.";
csb[34] = "But whenever Moses went before the LORD to speak with him, he would remove the veil until he came out. After he came out, he would tell the Israelites what he had been commanded,";
csb[35] = "and the Israelites would see that Moses\'s face was radiant. Then Moses would put the veil over his face again until he went to speak with the LORD.";
