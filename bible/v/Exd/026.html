csb[1] = "&quot;You are to construct the tabernacle itself with ten curtains. You must make them of finely spun linen, and blue, purple, and scarlet yarn, with a design of cherubim worked into them.";
csb[2] = "&quot;Each curtain should be forty-two feet long and six feet wide; all the curtains are to have the same measurements.";
csb[3] = "&quot;Five of the curtains should be joined together, and the other five curtains joined together.";
csb[4] = "&quot;Make loops of blue yarn on the edge of the last curtain in the first set, and do the same on the edge of the outermost curtain in the second set.";
csb[5] = "&quot;Make fifty loops on the one curtain and make fifty loops on the edge of the curtain in the second set, so that the loops line up together.";
csb[6] = "&quot;Also make fifty gold clasps and join the curtains together with the clasps, so that the tabernacle may be a single unit.";
csb[7] = "&quot;You are to make curtains of goat hair for a tent over the tabernacle; make eleven of these curtains.";
csb[8] = "&quot;Each curtain should be forty-five feet long and six feet wide. All eleven curtains are to have the same measurements.";
csb[9] = "&quot;Join five of the curtains by themselves, and the other six curtains by themselves. Then fold the sixth curtain double at the front of the tent.";
csb[10] = "&quot;Make fifty loops on the edge of one curtain, the outermost in the first set, and make fifty loops on the edge of the corresponding curtain of the second set.";
csb[11] = "&quot;Make fifty bronze clasps; put the clasps through the loops and join the tent together so that it is a single unit.";
csb[12] = "&quot;As for the flap that remains from the tent curtains, the leftover half curtain is to hang over the back of the tabernacle.";
csb[13] = "&quot;What remains along the length of the tent curtains -- a half yard on one side and a half yard on the other side -- should hang over the sides of the tabernacle on either side to cover it.";
csb[14] = "&quot;Make a covering for the tent from ram skins dyed red and a covering of fine leather on top of that.";
csb[15] = "&quot;You are to make upright supports of acacia wood for the tabernacle.";
csb[16] = "&quot;Each support is to be fifteen feet long and twenty-seven inches wide.";
csb[17] = "&quot;Each support will have two tenons for joining. Do the same for all the supports of the tabernacle.";
csb[18] = "&quot;Make the supports for the tabernacle as follows: twenty supports for the south side,";
csb[19] = "&quot;and make forty silver bases under the twenty supports, two bases under the first support for its two tenons, and two bases under the next support for its two tenons;";
csb[20] = "&quot;twenty supports for the second side of the tabernacle, the north side,";
csb[21] = "&quot;along with their forty silver bases, two bases under the first support and two bases under each support;";
csb[22] = "&quot;and make six supports for the west side of the tabernacle.";
csb[23] = "&quot;Make two additional supports for the two back corners of the tabernacle.";
csb[24] = "&quot;They are to be paired at the bottom, and joined together at the top in a single ring. So it should be for both of them; they will serve as the two corners.";
csb[25] = "&quot;There are to be eight supports with their silver bases: sixteen bases; two bases under the first support and two bases under each support.";
csb[26] = "&quot;You are to make five crossbars of acacia wood for the supports on one side of the tabernacle,";
csb[27] = "&quot;five crossbars for the supports on the other side of the tabernacle, and five crossbars for the supports of the back side of the tabernacle on the west.";
csb[28] = "&quot;The central crossbar is to run through the middle of the supports from one end to the other.";
csb[29] = "&quot;Then overlay the supports with gold, and make their rings of gold as the holders for the crossbars. Also overlay the crossbars with gold.";
csb[30] = "&quot;You are to set up the tabernacle according to the plan for it that you have been shown on the mountain.";
csb[31] = "&quot;You are to make a curtain of blue, purple, and scarlet yarn, and finely spun linen with a design of cherubim worked into it.";
csb[32] = "&quot;Hang it on four gold-plated pillars of acacia wood that have gold hooks and that stand on four silver bases.";
csb[33] = "&quot;Hang the curtain under the clasps and bring the ark of the testimony there behind the curtain, so the curtain will make a separation for you between the holy place and the most holy place.";
csb[34] = "&quot;Put the mercy seat on the ark of the testimony in the most holy place.";
csb[35] = "&quot;Place the table outside the curtain and the lampstand on the south side of the tabernacle, opposite the table; put the table on the north side.";
csb[36] = "&quot;For the entrance to the tent you are to make a screen embroidered with blue, purple, and scarlet yarn, and finely spun linen.";
csb[37] = "&quot;Make five pillars of acacia wood for the screen and overlay them with gold; their hooks are to be gold, and you are to cast five bronze bases for them.";
