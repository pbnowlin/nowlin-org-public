kjv[5] = "For the LORD had said unto Moses, Say unto the children of Israel, Ye [are] a stiffnecked people: I will come up into the midst of thee in a moment, and consume thee: therefore now put off thy ornaments from thee, that I may know what to do unto thee.";
rsv[5] = "For the LORD had said to Moses, &quot;Say to the people of Israel, \'You are a stiff-necked people; if for a single moment I should go up among you, I would consume you. So now put off your ornaments from you, that I may know what to do with you.\'&quot;";
asv[5] = "And Jehovah said unto Moses, Say unto the children of Israel, Ye are a stiffnecked people; if I go up into the midst of thee for one moment, I shall consume thee: therefore now put off thy ornaments from thee, that I may know what to do unto thee.";
yng[5] = "And Jehovah saith unto Moses, `Say unto the sons of Israel, Ye [are] a stiff-necked people; one moment -- I come up into thy midst, and have consumed thee; and now, put down thine ornaments from off thee, and I know what I do to thee;\'";
dby[5] = "Now Jehovah had said to Moses, Say unto the children of Israel, Ye are a stiff-necked people: in one moment I will come up into the midst of thee and will consume thee. And now put off thine ornaments from thee, and I will know what I will do unto thee.";
web[5] = "For the LORD had said to Moses, Say to the children of Israel, Ye [are] a stiff-necked people: I will come up into the midst of thee in a moment, and consume thee: therefore now put off thy ornaments from thee, that I may know what to do to thee.";
hnv[5] = "The LORD said to Moshe, &quot;Tell the children of Yisra\'el, \'You are a stiff-necked people. If I were to go up into your midst for one moment, I would consume you. Therefore now take off your jewelry from you, that I may know what to do to you.&quot;";

kjv[7] = "And Moses took the tabernacle, and pitched it without the camp, afar off from the camp, and called it the Tabernacle of the congregation. And it came to pass, [that] every one which sought the LORD went out unto the tabernacle of the congregation, which [was] without the camp.";

asv[7] = "Now Moses used to take the tent and to pitch it without the camp, afar off from the camp; and he called it, The tent of meeting. And it came to pass, that every one that sought Jehovah went out unto the tent of meeting, which was without the camp.";
yng[7] = "And Moses taketh the tent, and hath stretched it out at the outside of the camp, afar off from the camp, and hath called it, `Tent of Meeting;\' and it hath come to pass, every one seeking Jehovah goeth out unto the tent of meeting, which [is] at the outside of the camp.";
dby[7] = "And Moses took the tent, and pitched it outside the camp, far from the camp, and called it the Tent of meeting. And it came to pass [that] every one who sought Jehovah went out to the tent of meeting which was outside the camp.";
web[7] = "And Moses took the tabernacle, and pitched it without the camp far from the camp, and called it the Tabernacle of the congregation. And it came to pass, [that] every one who sought the LORD, went out to the tabernacle of the congregation, which [was] without the camp.";

rsv[11] = "Thus the LORD used to speak to Moses face to face, as a man speaks to his friend. When Moses turned again into the camp, his servant Joshua the son of Nun, a young man, did not depart from the tent.";
asv[11] = "And Jehovah spake unto Moses face to face, as a man speaketh unto his friend. And he turned again into the camp: but his minister Joshua, the son of Nun, a young man, departed not out of the Tent.";

vul[11] = "loquebatur autem Dominus ad Mosen facie ad faciem sicut loqui solet homo ad amicum suum cumque ille reverteretur in castra minister eius Iosue filius Nun puer non recedebat de tabernaculo";
kjv[12] = "And Moses said unto the LORD, See, thou sayest unto me, Bring up this people: and thou hast not let me know whom thou wilt send with me. Yet thou hast said, I know thee by name, and thou hast also found grace in my sight.";
csb[12] = "Moses said to the LORD, &quot;Look, You have told me, \'Lead this people up,\' but You have not let me know whom You will send with me. You said, \'I know you by name, and you have also found favor in My sight.\'";
rsv[12] = "Moses said to the LORD, &quot;See, thou sayest to me, \'Bring up this people\'; but thou hast not let me know whom thou wilt send with me. Yet thou hast said, \'I know you by name, and you have also found favor in my sight.\'";
asv[12] = "And Moses said unto Jehovah, See, thou sayest unto me, Bring up this people: and thou hast not let me know whom thou wilt send with me. Yet thou hast said, I know thee by name, and thou hast also found favor in my sight.";
yng[12] = "And Moses saith unto Jehovah, `See, Thou art saying unto me, Bring up this people, and Thou hast not caused me to know whom Thou dost send with me; and Thou hast said, I have known thee by name, and also thou hast found grace in Mine eyes.";
dby[12] = "And Moses said to Jehovah, Behold, thou sayest unto me, Bring up this people; but thou dost not let me know whom thou wilt send with me; and thou hast said, I know thee by name, and thou hast also found grace in mine eyes.";
web[12] = "And Moses said to the LORD, See, thou sayest to me, Bring up this people: and thou hast not let me know whom thou wilt send with me. Yet thou hast said, I know thee by name, and thou hast also found grace in my sight.";
hnv[12] = "Moshe said to the LORD, &quot;Behold, you tell me, \'Bring up this people:\' and you haven\'t let me know whom you will send with me. Yet you have said, \'I know you by name, and you have also found favor in my sight.\'";
vul[12] = "dixit autem Moses ad Dominum praecipis ut educam populum istum et non indicas mihi quem missurus es mecum praesertim cum dixeris novi te ex nomine et invenisti gratiam coram me";
kjv[13] = "Now therefore, I pray thee, if I have found grace in thy sight, shew me now thy way, that I may know thee, that I may find grace in thy sight: and consider that this nation [is] thy people.";
csb[13] = "Now if I have indeed found favor in Your sight, please teach me Your ways, and I will know You and find favor in Your sight. Now consider that this nation is Your people.&quot;";
rsv[13] = "Now therefore, I pray thee, if I have found favor in thy sight, show me now thy ways, that I may know thee and find favor in thy sight. Consider too that this nation is thy people.&quot;";
asv[13] = "Now therefore, I pray thee, if I have found favor in thy sight, show me now thy ways, that I may know thee, to the end that I may find favor in thy sight: and consider that this nation is thy people.";
yng[13] = "`And now, if, I pray Thee, I have found grace in Thine eyes, cause me to know, I pray Thee, Thy way, and I know Thee, so that I find grace in Thine eyes, and consider that this nation [is] Thy people;\'";
dby[13] = "And now, if indeed I have found grace in thine eyes, make me now to know thy way, that I may know thee, that I may find grace in thine eyes; and consider that this nation is thy people!";
web[13] = "Now therefore, I pray thee, if I have found grace in thy sight, show me now thy way, that I may know thee, that I may find grace in thy sight: and consider that this nation [is] thy people.";
hnv[13] = "Now therefore, if I have found favor in your sight, please show me now your ways, that I may know you, so that I may find favor in your sight: and consider that this nation is your people.&quot;";

kjv[16] = "For wherein shall it be known here that I and thy people have found grace in thy sight? [is it] not in that thou goest with us? so shall we be separated, I and thy people, from all the people that [are] upon the face of the earth.";
csb[16] = "How will it be known that I and Your people have found favor in Your sight unless You go with us? I and Your people will be distinguished by this from all the other people on the face of the earth.&quot;";
rsv[16] = "For how shall it be known that I have found favor in thy sight, I and thy people? Is it not in thy going with us, so that we are distinct, I and thy people, from all other people that are upon the face of the earth?&quot;";
asv[16] = "For wherein now shall it be known that I have found favor in thy sight, I and thy people? is it not in that thou goest with us, so that we are separated, I and thy people, from all the people that are upon the face of the earth?";
yng[16] = "and in what is it known now, that I have found grace in Thine eyes -- I and Thy people -- is it not in Thy going with us? and we have been distinguished -- I and Thy people -- from all the people who [are] on the face of the ground.\'";
dby[16] = "And how shall it be known then that I have found grace in thine eyes -- I and thy people? [Is it] not by thy going with us? so shall we be distinguished, I and thy people, from every people that is on the face of the earth.";
web[16] = "For wherein shall it be known here that I and thy people have found grace in thy sight? [Is it] not in that thou goest with us? So shall we be separated, I and thy people, from all the people that [are] upon the face of the earth.";
hnv[16] = "For how would people know that I have found favor in your sight, I and your people? Isn\'t it in that you go with us, so that we are separated, I and your people, from all the people who are on the surface of the eretz?&quot;";
vul[16] = "in quo enim scire poterimus ego et populus tuus invenisse nos gratiam in conspectu tuo nisi ambulaveris nobiscum ut glorificemur ab omnibus populis qui habitant super terram";

dby[17] = "And Jehovah said to Moses, I will do this thing also that thou hast said; for thou hast found grace in mine eyes, and I know thee by name.";

kjv[19] = "And he said, I will make all my goodness pass before thee, and I will proclaim the name of the LORD before thee; and will be gracious to whom I will be gracious, and will shew mercy on whom I will shew mercy.";

csb[1] = "The LORD spoke to Moses: &quot;Go up from here, you and the people you brought up from the land of Egypt, to the land I promised to Abraham, Isaac, and Jacob, saying: I will give it to your offspring.";
csb[2] = "&quot;I will send an angel ahead of you and will drive out the Canaanites, Amorites, Hethites, Perizzites, Hivites, and Jebusites.";
csb[3] = "&quot;Go up to a land flowing with milk and honey. But I will not go up with you because you are a stiff-necked people; otherwise, I might destroy you on the way.&quot;";
csb[4] = "When the people heard this bad news, they mourned and didn\'t put on their jewelry.";
csb[5] = "For the LORD said to Moses: &quot;Tell the Israelites: You are a stiff-necked people. If I went up with you for a single moment, I would destroy you. Now take off your jewelry, and I will decide what to do with you.&quot;";
csb[6] = "So the Israelites remained stripped of their jewelry from Mount Horeb onward.";
csb[7] = "Now Moses took a tent and pitched it outside the camp, at a distance from the camp; he called it the tent of meeting. Anyone who wanted to consult the LORD would go to the tent of meeting that was outside the camp.";
csb[8] = "Whenever Moses went out to the tent, all the people would stand up, each one at the door of his tent, and they would watch Moses until he entered the tent.";
csb[9] = "When Moses entered the tent, the pillar of cloud would come down and remain at the entrance to the tent, and the LORD would speak with Moses.";
csb[10] = "As all the people saw the pillar of cloud remaining at the entrance to the tent, they would stand up, then bow in worship, each one at the door of his tent.";
csb[11] = "The LORD would speak with Moses face to face, just as a man speaks with his friend, then Moses would return to the camp. His assistant, the young man Joshua son of Nun, would not leave the inside of the tent.";
csb[12] = "Moses said to the LORD, &quot;Look, you have told me, \'Lead this people up,\' but you have not let me know whom you will send with me. You said, \'I know you by name, and you have also found favor with me.\'";
csb[13] = "&quot;Now if I have indeed found favor with you, please teach me your ways, and I will know you, so that I may find favor with you. Now consider that this nation is your people.&quot;";
csb[14] = "And he replied, &quot;My presence will go with you, and I will give you rest.&quot;";
csb[15] = "&quot;If your presence does not go,&quot; Moses responded to him, &quot;don\'t make us go up from here.";
csb[16] = "&quot;How will it be known that I and your people have found favor with you unless you go with us? I and your people will be distinguished by this from all the other people on the face of the earth.&quot;";
csb[17] = "The LORD answered Moses, &quot;I will do this very thing you have asked, for you have found favor with me, and I know you by name.&quot;";
csb[18] = "Then Moses said, &quot;Please, let me see your glory.&quot;";
csb[19] = "He said, &quot;I will cause all my goodness to pass in front of you, and I will proclaim the name \'the LORD \' before you. I will be gracious to whom I will be gracious, and I will have compassion on whom I will have compassion.&quot;";
csb[20] = "But he added, &quot;You cannot see my face, for humans cannot see me and live.&quot;";
csb[21] = "The LORD said, &quot;Here is a place near me. You are to stand on the rock,";

csb[23] = "&quot;Then I will take my hand away, and you will see my back, but my face will not be seen.&quot;";
