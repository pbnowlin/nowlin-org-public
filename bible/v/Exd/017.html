csb[1] = "The entire Israelite community left the Wilderness of Sin, moving from one place to the next according to the LORD\'s command. They camped at Rephidim, but there was no water for the people to drink.";
csb[2] = "So the people complained to Moses, &quot;Give us water to drink.&quot; &quot;Why are you complaining to me? &quot; Moses replied to them. &quot;Why are you testing the LORD? &quot;";
csb[3] = "But the people thirsted there for water and grumbled against Moses. They said, &quot;Why did you ever bring us up from Egypt to kill us and our children and our livestock with thirst? &quot;";
csb[4] = "Then Moses cried out to the LORD, &quot;What should I do with these people? In a little while they will stone me! &quot;";
csb[5] = "The LORD answered Moses, &quot;Go on ahead of the people and take some of the elders of Israel with you. Take the staff you struck the Nile with in your hand and go.";
csb[6] = "&quot;I am going to stand there in front of you on the rock at Horeb; when you hit the rock, water will come out of it and the people will drink.&quot; Moses did this in the sight of the elders of Israel.";
csb[7] = "He named the place Massah and Meribah because the Israelites complained, and because they tested the LORD, saying, &quot;Is the LORD among us or not? &quot;";
csb[8] = "At Rephidim, Amalek came and fought against Israel.";
csb[9] = "Moses said to Joshua, &quot;Select some men for us and go fight against Amalek. Tomorrow I will stand on the hilltop with God\'s staff in my hand.&quot;";
csb[10] = "Joshua did as Moses had told him, and fought against Amalek, while Moses, Aaron, and Hur went up to the top of the hill.";
csb[11] = "While Moses held up his hand, Israel prevailed, but whenever he put his hand down, Amalek prevailed.";
csb[12] = "When Moses\'s hands grew heavy, they took a stone and put it under him, and he sat down on it. Then Aaron and Hur supported his hands, one on one side and one on the other so that his hands remained steady until the sun went down.";
csb[13] = "So Joshua defeated Amalek and his army with the sword.";
csb[14] = "The LORD then said to Moses, &quot;Write this down on a scroll as a reminder and recite it to Joshua: I will completely blot out the memory of Amalek under heaven.&quot;";
csb[15] = "And Moses built an altar and named it, &quot;The LORD Is My Banner.&quot;";
