dby[5] = "And it was told the king of Egypt that the people had fled; and the heart of Pharaoh and of his bondmen was turned against the people, and they said, Why have we done this, that we have let Israel go from our service?";
web[5] = "And it was told to the king of Egypt that the people fled: and the heart of Pharaoh and of his servants was turned against the people, and they said, Why have we done this, that we have let Israel go from serving us?";
hnv[5] = "It was told the king of Mitzrayim that the people had fled; and the heart of Par`oh and of his servants was changed towards the people, and they said, &quot;What is this we have done, that we have let Yisra\'el go from serving us?&quot;";
vul[5] = "et nuntiatum est regi Aegyptiorum quod fugisset populus inmutatumque est cor Pharaonis et servorum eius super populo et dixerunt quid voluimus facere ut dimitteremus Israhel ne serviret nobis";

yng[7] = "and he taketh six hundred chosen chariots, even all the chariots of Egypt, and captains over them all;";
dby[7] = "And he took six hundred chosen chariots, and all the chariots of Egypt, and captains over every one of them.";

dby[9] = "And the Egyptians pursued after them, -- all the horses and chariots of Pharaoh, and his horsemen, and his army, and overtook them where they had encamped by the sea, beside Pi-hahiroth, opposite to Baal-Zephon.";

kjv[10] = "And when Pharaoh drew nigh, the children of Israel lifted up their eyes, and, behold, the Egyptians marched after them; and they were sore afraid: and the children of Israel cried out unto the LORD.";

kjv[13] = "And Moses said unto the people, Fear ye not, stand still, and see the salvation of the LORD, which he will shew to you to day: for the Egyptians whom ye have seen to day, ye shall see them again no more for ever.";

kjv[20] = "And it came between the camp of the Egyptians and the camp of Israel; and it was a cloud and darkness [to them], but it gave light by night [to these]: so that the one came not near the other all the night.";
csb[20] = "It came between the Egyptian and Israelite forces. The cloud was there in the darkness, yet it lit up the night.* So neither group came near the other all night long.";
rsv[20] = "coming between the host of Egypt and the host of Israel. And there was the cloud and the darkness; and the night passed without one coming near the other all night.";

csb[1] = "Then the LORD spoke to Moses:";
csb[2] = "&quot;Tell the Israelites to turn back and camp in front of Pi-hahiroth, between Migdol and the sea; you must camp in front of Baal-zephon, facing it by the sea.";
csb[3] = "&quot;Pharaoh will say of the Israelites: They are wandering around the land in confusion; the wilderness has boxed them in.";
csb[4] = "&quot;I will harden Pharaoh\'s heart so that he will pursue them. Then I will receive glory by means of Pharaoh and all his army, and the Egyptians will know that I am the LORD.&quot; So the Israelites did this.";
csb[5] = "When the king of Egypt was told that the people had fled, Pharaoh and his officials changed their minds about the people and said: &quot;What have we done? We have released Israel from serving us.&quot;";
csb[6] = "So he got his chariot ready and took his troops with him;";
csb[7] = "he took six hundred of the best chariots and all the rest of the chariots of Egypt, with officers in each one.";
csb[8] = "The LORD hardened the heart of Pharaoh king of Egypt, and he pursued the Israelites, who were going out defiantly.";
csb[9] = "The Egyptians -- all Pharaoh\'s horses and chariots, his horsemen, and his army -- chased after them and caught up with them as they camped by the sea beside Pi-hahiroth, in front of Baal-zephon.";
csb[10] = "As Pharaoh approached, the Israelites looked up and there were the Egyptians coming after them! The Israelites were terrified and cried out to the LORD for help.";
csb[11] = "They said to Moses: &quot;Is it because there are no graves in Egypt that you have taken us away to die in the wilderness? What have you done to us by bringing us out of Egypt?";
csb[12] = "&quot;Isn\'t this what we told you in Egypt: Leave us alone so that we may serve the Egyptians? It would have been better for us to serve the Egyptians than to die in the wilderness.&quot;";
csb[13] = "But Moses said to the people, &quot;Don\'t be afraid. Stand firm and see the LORD\'s salvation that he will accomplish for you today; for the Egyptians you see today, you will never see again.";
csb[14] = "&quot;The LORD will fight for you, and you must be quiet.&quot;";
csb[15] = "The LORD said to Moses, &quot;Why are you crying out to me? Tell the Israelites to break camp.";
csb[16] = "&quot;As for you, lift up your staff, stretch out your hand over the sea, and divide it so that the Israelites can go through the sea on dry ground.";
csb[17] = "&quot;As for me, I am going to harden the hearts of the Egyptians so that they will go in after them, and I will receive glory by means of Pharaoh, all his army, and his chariots and horsemen.";
csb[18] = "&quot;The Egyptians will know that I am the LORD when I receive glory through Pharaoh, his chariots, and his horsemen.&quot;";
csb[19] = "Then the angel of God, who was going in front of the Israelite forces, moved and went behind them. The pillar of cloud moved from in front of them and stood behind them.";
csb[20] = "It came between the Egyptian and Israelite forces. There was cloud and darkness, it lit up the night, and neither group came near the other all night long.";
csb[21] = "Then Moses stretched out his hand over the sea. The LORD drove the sea back with a powerful east wind all that night and turned the sea into dry land. So the waters were divided,";
csb[22] = "and the Israelites went through the sea on dry ground, with the waters like a wall to them on their right and their left.";
csb[23] = "The Egyptians set out in pursuit -- all Pharaoh\'s horses, his chariots, and his horsemen -- and went into the sea after them.";
csb[24] = "During the morning watch, the LORD looked down at the Egyptian forces from the pillar of fire and cloud, and threw the Egyptian forces into confusion.";
csb[25] = "He caused their chariot wheels to swerve and made them drive with difficulty. &quot;Let\'s get away from Israel,&quot; the Egyptians said, &quot;because the LORD is fighting for them against Egypt! &quot;";
csb[26] = "Then the LORD said to Moses, &quot;Stretch out your hand over the sea so that the water may come back on the Egyptians, on their chariots and horsemen.&quot;";
csb[27] = "So Moses stretched out his hand over the sea, and at daybreak the sea returned to its normal depth. While the Egyptians were trying to escape from it, the LORD threw them into the sea.";
csb[28] = "The water came back and covered the chariots and horsemen, plus the entire army of Pharaoh that had gone after them into the sea. Not even one of them survived.";
csb[29] = "But the Israelites had walked through the sea on dry ground, with the waters like a wall to them on their right and their left.";
csb[30] = "That day the LORD saved Israel from the power of the Egyptians, and Israel saw the Egyptians dead on the seashore.";
csb[31] = "When Israel saw the great power that the LORD used against the Egyptians, the people feared the LORD and believed in him and in his servant Moses.";
