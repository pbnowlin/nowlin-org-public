kjv[3] = "And the children of Israel said unto them, Would to God we had died by the hand of the LORD in the land of Egypt, when we sat by the flesh pots, [and] when we did eat bread to the full; for ye have brought us forth into this wilderness, to kill this whole assembly with hunger.";

yng[3] = "and the sons of Israel say unto them, `Oh that we had died by the hand of Jehovah in the land of Egypt, in our sitting by the flesh-pot, in our eating bread to satiety -- for ye have brought us out unto this wilderness to put all this assembly to death with hunger.\'";

hnv[3] = "and the children of Yisra\'el said to them, &quot;We wish that we had died by the hand of the LORD in the land of Mitzrayim, when we sat by the flesh-pots, when we ate our fill of bread, for you have brought us out into this wilderness, to kill this whole assembly with hunger.&quot;";

kjv[8] = "And Moses said, [This shall be], when the LORD shall give you in the evening flesh to eat, and in the morning bread to the full; for that the LORD heareth your murmurings which ye murmur against him: and what [are] we? your murmurings [are] not against us, but against the LORD.";

csb[1] = "The entire Israelite community departed from Elim and came to the Wilderness of Sin, which is between Elim and Sinai, on the fifteenth day of the second month after they had left the land of Egypt.";
csb[2] = "The entire Israelite community grumbled against Moses and Aaron in the wilderness.";
csb[3] = "The Israelites said to them, &quot;If only we had died by the LORD\'s hand in the land of Egypt, when we sat by pots of meat and ate all the bread we wanted. Instead, you brought us into this wilderness to make this whole assembly die of hunger! &quot;";
csb[4] = "Then the LORD said to Moses, &quot;I am going to rain bread from heaven for you. The people are to go out each day and gather enough for that day. This way I will test them to see whether or not they will follow my instructions.";
csb[5] = "&quot;On the sixth day, when they prepare what they bring in, it will be twice as much as they gather on other days.&quot;";
csb[6] = "So Moses and Aaron said to all the Israelites: &quot;This evening you will know that it was the LORD who brought you out of the land of Egypt,";
csb[7] = "&quot;and in the morning you will see the LORD\'s glory because he has heard your complaints about him. For who are we that you complain about us? &quot;";
csb[8] = "Moses continued, &quot;The LORD will give you meat to eat this evening and all the bread you want in the morning, for he has heard the complaints that you are raising against him. Who are we? Your complaints are not against us but against the LORD.&quot;";
csb[9] = "Then Moses told Aaron, &quot;Say to the entire Israelite community, \'Come before the LORD, for he has heard your complaints.\' &quot;";
csb[10] = "As Aaron was speaking to the entire Israelite community, they turned toward the wilderness, and there in a cloud the LORD\'s glory appeared.";
csb[11] = "The LORD spoke to Moses,";
csb[12] = "&quot;I have heard the complaints of the Israelites. Tell them: At twilight you will eat meat, and in the morning you will eat bread until you are full. Then you will know that I am the LORD your God.&quot;";
csb[13] = "So at evening quail came and covered the camp. In the morning there was a layer of dew all around the camp.";
csb[14] = "When the layer of dew evaporated, there were fine flakes on the desert surface, as fine as frost on the ground.";
csb[15] = "When the Israelites saw it, they asked one another, &quot;What is it? &quot; because they didn\'t know what it was. Moses told them, &quot;It is the bread the LORD has given you to eat.";
csb[16] = "&quot;This is what the LORD has commanded: \'Gather as much of it as each person needs to eat. You may take two quarts per individual, according to the number of people each of you has in his tent.\' &quot;";
csb[17] = "So the Israelites did this. Some gathered a lot, some a little.";
csb[18] = "When they measured it by quarts, the person who gathered a lot had no surplus, and the person who gathered a little had no shortage. Each gathered as much as he needed to eat.";
csb[19] = "Moses said to them, &quot;No one is to let any of it remain until morning.&quot;";
csb[20] = "But they didn\'t listen to Moses; some people left part of it until morning, and it bred worms and stank. Therefore Moses was angry with them.";
csb[21] = "They gathered it every morning. Each gathered as much as he needed to eat, but when the sun grew hot, it melted.";
csb[22] = "On the sixth day they gathered twice as much food, four quarts apiece, and all the leaders of the community came and reported this to Moses.";
csb[23] = "He told them, &quot;This is what the LORD has said: \'Tomorrow is a day of complete rest, a holy Sabbath to the LORD. Bake what you want to bake, and boil what you want to boil, and set aside everything left over to be kept until morning.\' &quot;";
csb[24] = "So they set it aside until morning as Moses commanded, and it didn\'t stink or have maggots in it.";
csb[25] = "&quot;Eat it today,&quot; Moses said, &quot;because today is a Sabbath to the LORD. Today you won\'t find any in the field.";
csb[26] = "&quot;For six days you will gather it, but on the seventh day, the Sabbath, there will be none.&quot;";

csb[28] = "Then the LORD said to Moses, &quot;How long will you refuse to keep my commands and instructions?";
csb[29] = "&quot;Understand that the LORD has given you the Sabbath; therefore on the sixth day he will give you two days\' worth of bread. Each of you stay where you are; no one is to leave his place on the seventh day.&quot;";
csb[30] = "So the people rested on the seventh day.";
csb[31] = "The house of Israel named the substance manna. It resembled coriander seed, was white, and tasted like wafers made with honey.";
csb[32] = "Moses said, &quot;This is what the LORD has commanded: \'Two quarts of it are to be preserved throughout your generations, so that they may see the bread I fed you in the wilderness when I brought you out of the land of Egypt.\' &quot;";
