csb[1] = "These are the names of the sons of Israel who came to Egypt with Jacob; each came with his family:";

csb[7] = "But the Israelites were fruitful, increased rapidly, multiplied, and became extremely numerous so that the land was filled with them.";
csb[8] = "A new king, who did not know about Joseph, came to power in Egypt.";
csb[9] = "He said to his people, &quot;Look, the Israelite people are more numerous and powerful than we are.";
