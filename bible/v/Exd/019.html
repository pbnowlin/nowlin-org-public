csb[1] = "In the third month from the very day the Israelites left the land of Egypt, they came to the Sinai Wilderness.";
csb[2] = "They traveled from Rephidim, came to the Sinai Wilderness, and camped in the wilderness. Israel camped there in front of the mountain.";
csb[3] = "Moses went up the mountain to God, and the LORD called to him from the mountain: &quot;This is what you must say to the house of Jacob and explain to the Israelites:";
csb[4] = "&quot;\'You have seen what I did to the Egyptians and how I carried you on eagles\' wings and brought you to myself.";
csb[5] = "&quot;Now if you will carefully listen to me and keep my covenant, you will be my own possession out of all the peoples, although the whole earth is mine,";
csb[6] = "&quot;and you will be my kingdom of priests and my holy nation.\' These are the words that you are to say to the Israelites.&quot;";
csb[7] = "After Moses came back, he summoned the elders of the people and set before them all these words that the LORD had commanded him.";
csb[8] = "Then all the people responded together, &quot;We will do all that the LORD has spoken.&quot; So Moses brought the people\'s words back to the LORD.";
csb[9] = "The LORD said to Moses, &quot;I am going to come to you in a dense cloud, so that the people will hear when I speak with you and will always believe you.&quot; Moses reported the people\'s words to the LORD,";
csb[10] = "and the LORD told Moses, &quot;Go to the people and consecrate them today and tomorrow. They must wash their clothes";
csb[11] = "&quot;and be prepared by the third day, for on the third day the LORD will come down on Mount Sinai in the sight of all the people.";
csb[12] = "&quot;Put boundaries for the people all around the mountain and say: Be careful that you don\'t go up on the mountain or touch its base. Anyone who touches the mountain must be put to death.";
csb[13] = "&quot;No hand may touch him; instead he will be stoned or shot with arrows and not live, whether animal or human. When the ram\'s horn sounds a long blast, they may go up the mountain.&quot;";
csb[14] = "Then Moses came down from the mountain to the people and consecrated them, and they washed their clothes.";
csb[15] = "He said to the people, &quot;Be prepared by the third day. Do not have sexual relations with women.&quot;";
csb[16] = "On the third day, when morning came, there was thunder and lightning, a thick cloud on the mountain, and a very loud trumpet sound, so that all the people in the camp shuddered.";
csb[17] = "Then Moses brought the people out of the camp to meet God, and they stood at the foot of the mountain.";
csb[18] = "Mount Sinai was completely enveloped in smoke because the LORD came down on it in fire. Its smoke went up like the smoke of a furnace, and the whole mountain shook violently.";
csb[19] = "As the sound of the trumpet grew louder and louder, Moses spoke and God answered him in the thunder.";
csb[20] = "The LORD came down on Mount Sinai at the top of the mountain. Then the LORD summoned Moses to the top of the mountain, and he went up.";
csb[21] = "The LORD directed Moses, &quot;Go down and warn the people not to break through to see the LORD; otherwise many of them will die.";
csb[22] = "&quot;Even the priests who come near the LORD must consecrate themselves, or the LORD will break out in anger against them.&quot;";

csb[24] = "And the LORD replied to him, &quot;Go down and come back with Aaron. But the priests and the people must not break through to come up to the LORD, or he will break out in anger against them.&quot;";
