csb[1] = "The LORD said to Moses, &quot;I will bring one more plague on Pharaoh and on Egypt. After that, he will let you go from here. When he lets you go, he will drive you out of here.";
csb[2] = "&quot;Now announce to the people that both men and women should ask their neighbors for silver and gold items.&quot;";
csb[3] = "The LORD gave the people favor with the Egyptians. In addition, Moses himself was very highly regarded in the land of Egypt by Pharaoh\'s officials and the people.";
csb[4] = "So Moses said, &quot;This is what the LORD says: About midnight I will go throughout Egypt,";
csb[5] = "&quot;and every firstborn male in the land of Egypt will die, from the firstborn of Pharaoh who sits on his throne to the firstborn of the servant girl who is at the grindstones, as well as every firstborn of the livestock.";
csb[6] = "&quot;Then there will be a great cry of anguish through all the land of Egypt such as never was before or ever will be again.";
csb[7] = "&quot;But against all the Israelites, whether people or animals, not even a dog will snarl, so that you may know that the LORD makes a distinction between Egypt and Israel.";
csb[8] = "&quot;All these officials of yours will come down to me and bow before me, saying: Get out, you and all the people who follow you. After that, I will get out.&quot; And he went out from Pharaoh\'s presence fiercely angry.";
csb[9] = "The LORD said to Moses, &quot;Pharaoh will not listen to you, so that my wonders may be multiplied in the land of Egypt.&quot;";
csb[10] = "Moses and Aaron did all these wonders before Pharaoh, but the LORD hardened Pharaoh\'s heart, and he would not let the Israelites go out of his land.";
