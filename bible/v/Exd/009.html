csb[1] = "Then the LORD said to Moses, &quot;Go in to Pharaoh and say to him: This is what the LORD, the God of the Hebrews, says: Let my people go, so that they may worship me.";
csb[2] = "&quot;But if you refuse to let them go and keep holding them,";
csb[3] = "&quot;then the LORD\'s hand will bring a severe plague against your livestock in the field -- the horses, donkeys, camels, herds, and flocks.";
csb[4] = "&quot;But the LORD will make a distinction between the livestock of Israel and the livestock of Egypt, so that nothing of all that the Israelites own will die.&quot;";
csb[5] = "And the LORD set a time, saying, &quot;Tomorrow the LORD will do this thing in the land.&quot;";
csb[6] = "The LORD did this the next day. All the Egyptian livestock died, but none among the Israelite livestock died.";
csb[7] = "Pharaoh sent messengers who saw that not a single one of the Israelite livestock was dead. But Pharaoh\'s heart was hard, and he did not let the people go.";
csb[8] = "Then the LORD said to Moses and Aaron, &quot;Take handfuls of furnace soot, and Moses is to throw it toward heaven in the sight of Pharaoh.";
csb[9] = "&quot;It will become fine dust over the entire land of Egypt. It will become festering boils on people and animals throughout the land of Egypt.&quot;";
csb[10] = "So they took furnace soot and stood before Pharaoh. Moses threw it toward heaven, and it became festering boils on people and animals.";
csb[11] = "The magicians could not stand before Moses because of the boils, for the boils were on the magicians as well as on all the Egyptians.";
csb[12] = "But the LORD hardened Pharaoh\'s heart and he did not listen to them, as the LORD had told Moses.";
csb[13] = "Then the LORD said to Moses, &quot;Get up early in the morning and present yourself to Pharaoh. Tell him: This is what the LORD, the God of the Hebrews says: Let my people go, so that they may worship me.";
csb[14] = "&quot;For this time I am about to send all my plagues against you, your officials, and your people. Then you will know there is no one like me on the whole earth.";
csb[15] = "&quot;By now I could have stretched out my hand and struck you and your people with a plague, and you would have been obliterated from the earth.";
csb[16] = "&quot;However, I have let you live for this purpose: to show you my power and to make my name known on the whole earth.";
csb[17] = "&quot;You are still acting arrogantly against my people by not letting them go.";
csb[18] = "&quot;Tomorrow at this time I will rain down the worst hail that has ever occurred in Egypt from the day it was founded until now.";
csb[19] = "&quot;Therefore give orders to bring your livestock and all that you have in the field into shelters. Every person and animal that is in the field and not brought inside will die when the hail falls on them.&quot;";
csb[20] = "Those among Pharaoh\'s officials who feared the word of the LORD made their servants and livestock flee to shelters,";
csb[21] = "but those who didn\'t take to heart the LORD\'s word left their servants and livestock in the field.";
csb[22] = "Then the LORD said to Moses, &quot;Stretch out your hand toward heaven and let there be hail throughout the land of Egypt -- on people and animals and every plant of the field in the land of Egypt.&quot;";
csb[23] = "So Moses stretched out his staff toward heaven, and the LORD sent thunder and hail. Lightning struck the land, and the LORD rained hail on the land of Egypt.";
csb[24] = "The hail, with lightning flashing through it, was so severe that nothing like it had occurred in the land of Egypt since it had become a nation.";
csb[25] = "Throughout the land of Egypt, the hail struck down everything in the field, both people and animals. The hail beat down every plant of the field and shattered every tree in the field.";
csb[26] = "The only place it didn\'t hail was in the land of Goshen, where the Israelites were.";
csb[27] = "Pharaoh sent for Moses and Aaron. &quot;I have sinned this time,&quot; he said to them. &quot;The LORD is the righteous one, and I and my people are the guilty ones.";
csb[28] = "&quot;Make an appeal to the LORD. There has been enough of God\'s thunder and hail. I will let you go; you don\'t need to stay any longer.&quot;";
csb[29] = "Moses said to him, &quot;When I have left the city, I will spread out my hands to the LORD. The thunder will cease, and there will be no more hail, so that you may know the earth belongs to the LORD.";
csb[30] = "&quot;But as for you and your officials, I know that you still do not fear the LORD God.&quot;";
csb[31] = "The flax and the barley were destroyed because the barley was ripe and the flax was budding,";
csb[32] = "but the wheat and the spelt were not destroyed since they are later crops.";
csb[33] = "Moses left Pharaoh and the city, and spread out his hands to the LORD. Then the thunder and hail ceased, and rain no longer poured down on the land.";
csb[34] = "When Pharaoh saw that the rain, hail, and thunder had ceased, he sinned again and hardened his heart, he and his officials.";
csb[35] = "So Pharaoh\'s heart was hard, and he did not let the Israelites go, as the LORD had said through Moses.";
