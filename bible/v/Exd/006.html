csb[1] = "But the LORD replied to Moses, &quot;Now you will see what I will do to Pharaoh: because of a strong hand he will let them go, and because of a strong hand he will drive them from his land.&quot;";
csb[2] = "Then God spoke to Moses, telling him, &quot;I am the LORD.";
csb[3] = "&quot;I appeared to Abraham, Isaac, and Jacob as God Almighty, but I was not known to them by my name \'the LORD.\'";
csb[4] = "&quot;I also established my covenant with them to give them the land of Canaan, the land they lived in as aliens.";
csb[5] = "&quot;Furthermore, I have heard the groaning of the Israelites, whom the Egyptians are forcing to work as slaves, and I have remembered my covenant.";
csb[6] = "&quot;Therefore tell the Israelites: I am the LORD, and I will bring you out from the forced labor of the Egyptians and rescue you from slavery to them. I will redeem you with an outstretched arm and great acts of judgment.";
csb[7] = "&quot;I will take you as my people, and I will be your God. You will know that I am the LORD your God, who brought you out from the forced labor of the Egyptians.";
csb[8] = "&quot;I will bring you to the land that I swore to give to Abraham, Isaac, and Jacob, and I will give it to you as a possession. I am the LORD.&quot;";
csb[9] = "Moses told this to the Israelites, but they did not listen to him because of their broken spirit and hard labor.";
csb[10] = "Then the LORD spoke to Moses,";
csb[11] = "&quot;Go and tell Pharaoh king of Egypt to let the Israelites go from his land.&quot;";
csb[12] = "But Moses said in the LORD\'s presence: &quot;If the Israelites will not listen to me, then how will Pharaoh listen to me, since I am such a poor speaker? &quot;";
csb[13] = "Then the LORD spoke to Moses and Aaron and gave them commands concerning both the Israelites and Pharaoh king of Egypt to bring the Israelites out of the land of Egypt.";
csb[14] = "These are the heads of their fathers\' families: The sons of Reuben, the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.";
