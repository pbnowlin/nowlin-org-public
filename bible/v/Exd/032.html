rsv[1] = "When the people saw that Moses delayed to come down from the mountain, the people gathered themselves together to Aaron, and said to him, &quot;Up, make us gods, who shall go before us; as for this Moses, the man who brought us up out of the land of Egypt, we do not know what has become of him.&quot;";

rsv[13] = "Remember Abraham, Isaac, and Israel, thy servants, to whom thou didst swear by thine own self, and didst say to them, \'I will multiply your descendants as the stars of heaven, and all this land that I have promised I will give to your descendants, and they shall inherit it for ever.\'&quot;";

yng[13] = "`Be mindful of Abraham, of Isaac, and of Israel, Thy servants, to whom Thou hast sworn by Thyself, and unto whom Thou speakest: I multiply your seed as stars of the heavens, and all this land, as I have said, I give to your seed, and they have inherited to the age;\'";
dby[13] = "Remember Abraham, Isaac and Israel, thy servants, to whom thou sworest by thyself, and saidst to them, I will multiply your seed as the stars of heaven, and all this land that I have spoken of will I give to your seed, and they shall possess [it] for ever!";

hnv[13] = "Remember Avraham, Yitzchak, and Yisra\'el, your servants, to whom you swore by your own self, and said to them, \'I will multiply your seed as the stars of the sky, and all this land that I have spoken of I will give to your seed, and they shall inherit it forever.\'&quot;";

dby[26] = "And Moses stood in the gate of the camp, and said, He that is for Jehovah, [let him come] to me. And all the sons of Levi gathered to him.";

csb[27] = "Now go, lead the people to the place I told you about; see, My angel will go before you. But on the day I settle accounts, I will hold them accountable for their sin.&quot;";
rsv[27] = "And he said to them, &quot;Thus says the LORD God of Israel, \'Put every man his sword on his side, and go to and fro from gate to gate throughout the camp, and slay every man his brother, and every man his companion, and every man his neighbor.\'&quot;";

dby[27] = "And he said to them, Thus saith Jehovah, the God of Israel: Put every man his sword upon his hip; go and return from gate to gate through the camp, and slay every man his brother, and every man his friend, and every man his neighbour.";
web[27] = "And he said to them, Thus saith the LORD God of Israel, Put every man his sword by his side, [and] go in and out from gate to gate throughout the camp, and slay every man his brother, and every man his companion, and every man his neighbor.";

csb[29] = "When the people saw that Moses delayed in coming down from the mountain, they gathered around Aaron and said to him, &quot;Come, make us a god* who will go before us because this Moses, the man who brought us up from the land of Egypt -- we don\'t know what has happened to him! &quot;";

yng[30] = "And it cometh to pass, on the morrow, that Moses saith unto the people, `Ye -- ye have sinned a great sin, and now I go up unto Jehovah, if so be I atone for your sin.\'";

asv[32] = "Yet now, if thou wilt forgive their sin--; and if not, blot me, I pray thee, out of thy book which thou hast written.";

csb[1] = "When the people saw that Moses delayed in coming down from the mountain, they gathered around Aaron and said to him, &quot;Come, make gods for us who will go before us because this Moses, the man who brought us up from the land of Egypt -- we don\'t know what has happened to him! &quot;";
csb[2] = "Aaron replied to them, &quot;Take off the gold rings that are on the ears of your wives, your sons, and your daughters and bring them to me.&quot;";
csb[3] = "So all the people took off the gold rings that were on their ears and brought them to Aaron.";
csb[4] = "He took the gold from them, fashioned it with an engraving tool, and made it into an image of a calf. Then they said, &quot;Israel, these are your gods, who brought you up from the land of Egypt! &quot;";
csb[5] = "When Aaron saw this, he built an altar in front of it and made an announcement: &quot;There will be a festival to the LORD tomorrow.&quot;";
csb[6] = "Early the next morning they arose, offered burnt offerings, and presented fellowship offerings. The people sat down to eat and drink, and got up to party.";
csb[7] = "The LORD spoke to Moses: &quot;Go down at once! For your people you brought up from the land of Egypt have acted corruptly.";
csb[8] = "&quot;They have quickly turned from the way I commanded them; they have made for themselves an image of a calf. They have bowed down to it, sacrificed to it, and said, \'Israel, these are your gods, who brought you up from the land of Egypt.\' &quot;";
csb[9] = "The LORD also said to Moses: &quot;I have seen this people, and they are indeed a stiff-necked people.";
csb[10] = "&quot;Now leave me alone, so that my anger can burn against them and I can destroy them. Then I will make you into a great nation.&quot;";
csb[11] = "But Moses sought the favor of the LORD his God: &quot;LORD, why does your anger burn against your people you brought out of the land of Egypt with great power and a strong hand?";
csb[12] = "&quot;Why should the Egyptians say, \'He brought them out with an evil intent to kill them in the mountains and eliminate them from the face of the earth\'? Turn from your fierce anger and relent concerning this disaster planned for your people.";
csb[13] = "&quot;Remember your servants Abraham, Isaac, and Israel -- you swore to them by yourself and declared, \'I will make your offspring as numerous as the stars of the sky and will give your offspring all this land that I have promised, and they will inherit it forever.\' &quot;";
csb[14] = "So the LORD relented concerning the disaster he had said he would bring on his people.";
csb[15] = "Then Moses turned and went down the mountain with the two tablets of the testimony in his hands. They were inscribed on both sides -- inscribed front and back.";
csb[16] = "The tablets were the work of God, and the writing was God\'s writing, engraved on the tablets.";
csb[17] = "When Joshua heard the sound of the people as they shouted, he said to Moses, &quot;There is a sound of war in the camp.&quot;";
csb[18] = "But Moses replied: It\'s not the sound of a victory cry and not the sound of a cry of defeat; I hear the sound of singing!";
csb[19] = "As he approached the camp and saw the calf and the dancing, Moses became enraged and threw the tablets out of his hands, smashing them at the base of the mountain.";
csb[20] = "He took the calf they had made, burned it up, and ground it to powder. He scattered the powder over the surface of the water and forced the Israelites to drink the water.";
csb[21] = "Then Moses asked Aaron, &quot;What did these people do to you that you have led them into such a grave sin? &quot;";
csb[22] = "&quot;Don\'t be enraged, my lord,&quot; Aaron replied. &quot;You yourself know that the people are intent on evil.";
csb[23] = "&quot;They said to me, \'Make gods for us who will go before us because this Moses, the man who brought us up from the land of Egypt -- we don\'t know what has happened to him! \'";
csb[24] = "&quot;So I said to them, \'Whoever has gold, take it off,\' and they gave it to me. When I threw it into the fire, out came this calf! &quot;";
csb[25] = "Moses saw that the people were out of control, for Aaron had let them get out of control, making them a laughingstock to their enemies.";
csb[26] = "And Moses stood at the camp\'s entrance and said, &quot;Whoever is for the LORD, come to me.&quot; And all the Levites gathered around him.";
csb[27] = "He told them, &quot;This is what the LORD, the God of Israel, says, \'Every man fasten his sword to his side; go back and forth through the camp from entrance to entrance, and each of you kill his brother, his friend, and his neighbor.\' &quot;";
csb[28] = "The Levites did as Moses commanded, and about three thousand men fell dead that day among the people.";
csb[29] = "Afterward Moses said, &quot;Today you have been dedicated to the LORD, since each man went against his son and his brother. Therefore you have brought a blessing on yourselves today.&quot;";
csb[30] = "The following day Moses said to the people, &quot;You have committed a grave sin. Now I will go up to the LORD; perhaps I will be able to atone for your sin.&quot;";
csb[31] = "So Moses returned to the LORD and said, &quot;Oh, these people have committed a grave sin; they have made a god of gold for themselves.";
csb[32] = "&quot;Now if you would only forgive their sin. But if not, please erase me from the book you have written.&quot;";
csb[33] = "The LORD replied to Moses: &quot;Whoever has sinned against me I will erase from my book.";
csb[34] = "&quot;Now go, lead the people to the place I told you about; see, my angel will go before you. But on the day I settle accounts, I will hold them accountable for their sin.&quot;";
csb[35] = "And the LORD inflicted a plague on the people for what they did with the calf Aaron had made.";
kjv[1] = "And when the people saw that Moses delayed to come down out of the mount, the people gathered themselves together unto Aaron, and said unto him, Up, make us gods, which shall go before us; for [as for] this Moses, the man that brought us up out of the land of Egypt, we wot not what is become of him.";
kjv[2] = "And Aaron said unto them, Break off the golden earrings, which [are] in the ears of your wives, of your sons, and of your daughters, and bring [them] unto me.";
kjv[3] = "And all the people brake off the golden earrings which [were] in their ears, and brought [them] unto Aaron.";
kjv[4] = "And he received [them] at their hand, and fashioned it with a graving tool, after he had made it a molten calf: and they said, These [be] thy gods, O Israel, which brought thee up out of the land of Egypt.";
kjv[5] = "And when Aaron saw [it], he built an altar before it; and Aaron made proclamation, and said, To morrow [is] a feast to the LORD.";
kjv[6] = "And they rose up early on the morrow, and offered burnt offerings, and brought peace offerings; and the people sat down to eat and to drink, and rose up to play.";
kjv[7] = "And the LORD said unto Moses, Go, get thee down; for thy people, which thou broughtest out of the land of Egypt, have corrupted [themselves]:";
kjv[8] = "They have turned aside quickly out of the way which I commanded them: they have made them a molten calf, and have worshipped it, and have sacrificed thereunto, and said, These [be] thy gods, O Israel, which have brought thee up out of the land of Egypt.";
kjv[9] = "And the LORD said unto Moses, I have seen this people, and, behold, it [is] a stiffnecked people:";
kjv[10] = "Now therefore let me alone, that my wrath may wax hot against them, and that I may consume them: and I will make of thee a great nation.";
kjv[11] = "And Moses besought the LORD his God, and said, LORD, why doth thy wrath wax hot against thy people, which thou hast brought forth out of the land of Egypt with great power, and with a mighty hand?";
kjv[12] = "Wherefore should the Egyptians speak, and say, For mischief did he bring them out, to slay them in the mountains, and to consume them from the face of the earth? Turn from thy fierce wrath, and repent of this evil against thy people.";
kjv[13] = "Remember Abraham, Isaac, and Israel, thy servants, to whom thou swarest by thine own self, and saidst unto them, I will multiply your seed as the stars of heaven, and all this land that I have spoken of will I give unto your seed, and they shall inherit [it] for ever.";
kjv[14] = "And the LORD repented of the evil which he thought to do unto his people.";
kjv[15] = "And Moses turned, and went down from the mount, and the two tables of the testimony [were] in his hand: the tables [were] written on both their sides; on the one side and on the other [were] they written.";
kjv[16] = "And the tables [were] the work of God, and the writing [was] the writing of God, graven upon the tables.";
kjv[17] = "And when Joshua heard the noise of the people as they shouted, he said unto Moses, [There is] a noise of war in the camp.";
kjv[18] = "And he said, [It is] not the voice of [them that] shout for mastery, neither [is it] the voice of [them that] cry for being overcome: [but] the noise of [them that] sing do I hear.";
kjv[19] = "And it came to pass, as soon as he came nigh unto the camp, that he saw the calf, and the dancing: and Moses\' anger waxed hot, and he cast the tables out of his hands, and brake them beneath the mount.";
kjv[20] = "And he took the calf which they had made, and burnt [it] in the fire, and ground [it] to powder, and strawed [it] upon the water, and made the children of Israel drink [of it].";
kjv[21] = "And Moses said unto Aaron, What did this people unto thee, that thou hast brought so great a sin upon them?";
kjv[22] = "And Aaron said, Let not the anger of my lord wax hot: thou knowest the people, that they [are set] on mischief.";
kjv[23] = "For they said unto me, Make us gods, which shall go before us: for [as for] this Moses, the man that brought us up out of the land of Egypt, we wot not what is become of him.";
kjv[24] = "And I said unto them, Whosoever hath any gold, let them break [it] off. So they gave [it] me: then I cast it into the fire, and there came out this calf.";
kjv[25] = "And when Moses saw that the people [were] naked; (for Aaron had made them naked unto [their] shame among their enemies:)";
kjv[26] = "Then Moses stood in the gate of the camp, and said, Who [is] on the LORD\'S side? [let him come] unto me. And all the sons of Levi gathered themselves together unto him.";
kjv[27] = "And he said unto them, Thus saith the LORD God of Israel, Put every man his sword by his side, [and] go in and out from gate to gate throughout the camp, and slay every man his brother, and every man his companion, and every man his neighbour.";
kjv[28] = "And the children of Levi did according to the word of Moses: and there fell of the people that day about three thousand men.";
kjv[29] = "For Moses had said, Consecrate yourselves to day to the LORD, even every man upon his son, and upon his brother; that he may bestow upon you a blessing this day.";
kjv[30] = "And it came to pass on the morrow, that Moses said unto the people, Ye have sinned a great sin: and now I will go up unto the LORD; peradventure I shall make an atonement for your sin.";
kjv[31] = "And Moses returned unto the LORD, and said, Oh, this people have sinned a great sin, and have made them gods of gold.";
kjv[32] = "Yet now, if thou wilt forgive their sin--; and if not, blot me, I pray thee, out of thy book which thou hast written.";
kjv[33] = "And the LORD said unto Moses, Whosoever hath sinned against me, him will I blot out of my book.";
kjv[34] = "Therefore now go, lead the people unto [the place] of which I have spoken unto thee: behold, mine Angel shall go before thee: nevertheless in the day when I visit I will visit their sin upon them.";
kjv[35] = "And the LORD plagued the people, because they made the calf, which Aaron made.";
