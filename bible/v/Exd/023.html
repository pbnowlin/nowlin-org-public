kjv[21] = "Beware of him, and obey his voice, provoke him not; for he will not pardon your transgressions: for my name [is] in him.";

hnv[21] = "Pay attention to him, and listen to his voice. Don\'t provoke him, for he will not pardon your disobedience, for my name is in him.";

web[22] = "But if thou shalt indeed obey his voice, and do all that I speak; then I will be an enemy to thy enemies, and an adversary to thy adversaries.";
hnv[22] = "But if you indeed listen to his voice, and do all that I speak, then I will be an enemy to your enemies, and an adversary to your adversaries.";

csb[1] = "&quot;You must not spread a false report. Do not join the wicked to be a malicious witness.";
csb[2] = "&quot;You must not follow a crowd in wrongdoing. Do not testify in a lawsuit and go along with a crowd to pervert justice.";
csb[3] = "&quot;Do not show favoritism to a poor person in his lawsuit.";
csb[4] = "&quot;If you come across your enemy\'s stray ox or donkey, you must return it to him.";
csb[5] = "&quot;If you see the donkey of someone who hates you lying helpless under its load, and you want to refrain from helping it, you must help with it.";
csb[6] = "&quot;You must not deny justice to a poor person among you in his lawsuit.";
csb[7] = "&quot;Stay far away from a false accusation. Do not kill the innocent and the just, because I will not justify the guilty.";
csb[8] = "&quot;You must not take a bribe, for a bribe blinds the clear-sighted and corrupts the words of the righteous.";
csb[9] = "&quot;You must not oppress a resident alien; you yourselves know how it feels to be a resident alien because you were resident aliens in the land of Egypt.";
csb[10] = "&quot;Sow your land for six years and gather its produce.";
csb[11] = "&quot;But during the seventh year you are to let it rest and leave it uncultivated, so that the poor among your people may eat from it and the wild animals may consume what they leave. Do the same with your vineyard and your olive grove.";
csb[12] = "&quot;Do your work for six days but rest on the seventh day so that your ox and your donkey may rest, and the son of your female slave as well as the resident alien may be refreshed.";
csb[13] = "&quot;Pay strict attention to everything I have said to you. You must not invoke the names of other gods; they must not be heard on your lips.";
csb[14] = "&quot;Celebrate a festival in my honor three times a year.";
csb[15] = "&quot;Observe the Festival of Unleavened Bread. As I commanded you, you are to eat unleavened bread for seven days at the appointed time in the month of Abib, because you came out of Egypt in that month. No one is to appear before me empty-handed.";
csb[16] = "&quot;Also observe the Festival of Harvest with the firstfruits of your produce from what you sow in the field, and observe the Festival of Ingathering at the end of the year, when you gather your produce from the field.";
csb[17] = "&quot;Three times a year all your males are to appear before the Lord GOD.";
csb[18] = "&quot;You must not offer the blood of my sacrifices with anything leavened. The fat of my festival offering must not remain until morning.";
csb[19] = "&quot;Bring the best of the firstfruits of your land to the house of the LORD your God. &quot;You must not boil a young goat in its mother\'s milk.";
csb[20] = "&quot;I am going to send an angel before you to protect you on the way and bring you to the place I have prepared.";
csb[21] = "&quot;Be attentive to him and listen to him. Do not defy him, because he will not forgive your acts of rebellion, for my name is in him.";
csb[22] = "&quot;But if you will carefully obey him and do everything I say, then I will be an enemy to your enemies and a foe to your foes.";
csb[23] = "&quot;For my angel will go before you and bring you to the land of the Amorites, Hethites, Perizzites, Canaanites, Hivites, and Jebusites, and I will wipe them out.";
csb[24] = "&quot;Do not bow in worship to their gods, and do not serve them. Do not imitate their practices. Instead, demolish them and smash their sacred pillars to pieces.";
csb[25] = "&quot;Serve the LORD your God, and he will bless your bread and your water. I will remove illnesses from you.";
csb[26] = "&quot;No woman will miscarry or be childless in your land. I will give you the full number of your days.";
csb[27] = "&quot;I will cause the people ahead of you to feel terror and will throw into confusion all the nations you come to. I will make all your enemies turn their backs to you in retreat.";
csb[28] = "&quot;I will send hornets in front of you, and they will drive the Hivites, Canaanites, and Hethites away from you.";
csb[29] = "&quot;I will not drive them out ahead of you in a single year; otherwise, the land would become desolate, and wild animals would multiply against you.";
csb[30] = "&quot;I will drive them out little by little ahead of you until you have become numerous and take possession of the land.";
csb[31] = "&quot;I will set your borders from the Red Sea to the Mediterranean Sea, and from the wilderness to the Euphrates River. For I will place the inhabitants of the land under your control, and you will drive them out ahead of you.";
csb[32] = "&quot;You must not make a covenant with them or their gods.";
csb[33] = "&quot;They must not remain in your land, or else they will make you sin against me. If you serve their gods, it will be a snare for you.&quot;";
