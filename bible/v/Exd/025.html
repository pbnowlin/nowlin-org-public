csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Tell the Israelites to take an offering for me. You are to take my offering from everyone who is willing to give.";
csb[3] = "&quot;This is the offering you are to receive from them: gold, silver, and bronze;";
csb[4] = "&quot;blue, purple, and scarlet yarn; fine linen and goat hair;";
csb[5] = "&quot;ram skins dyed red and fine leather; acacia wood;";
csb[6] = "&quot;oil for the light; spices for the anointing oil and for the fragrant incense;";
csb[7] = "&quot;and onyx along with other gemstones for mounting on the ephod and breastpiece.";
csb[8] = "&quot;They are to make a sanctuary for me so that I may dwell among them.";
csb[9] = "&quot;You must make it according to all that I show you -- the pattern of the tabernacle as well as the pattern of all its furnishings.";
csb[10] = "&quot;They are to make an ark of acacia wood, forty-five inches long, twenty-seven inches wide, and twenty-seven inches high.";
csb[11] = "&quot;Overlay it with pure gold; overlay it both inside and out. Also make a gold molding all around it.";
csb[12] = "&quot;Cast four gold rings for it and place them on its four feet, two rings on one side and two rings on the other side.";
csb[13] = "&quot;Make poles of acacia wood and overlay them with gold.";
csb[14] = "&quot;Insert the poles into the rings on the sides of the ark in order to carry the ark with them.";
csb[15] = "&quot;The poles are to remain in the rings of the ark; they must not be removed from it.";
csb[16] = "&quot;Put the tablets of the testimony that I will give you into the ark.";
csb[17] = "&quot;Make a mercy seat of pure gold, forty-five inches long and twenty-seven inches wide.";
csb[18] = "&quot;Make two cherubim of gold; make them of hammered work at the two ends of the mercy seat.";
csb[19] = "&quot;Make one cherub at one end and one cherub at the other end. At its two ends, make the cherubim of one piece with the mercy seat.";
csb[20] = "&quot;The cherubim are to have wings spread out above, covering the mercy seat with their wings, and are to face one another. The faces of the cherubim should be toward the mercy seat.";
csb[21] = "&quot;Set the mercy seat on top of the ark and put the tablets of the testimony that I will give you into the ark.";
csb[22] = "&quot;I will meet with you there above the mercy seat, between the two cherubim that are over the ark of the testimony; I will speak with you from there about all that I command you regarding the Israelites.";
csb[23] = "&quot;You are to construct a table of acacia wood, thirty-six inches long, eighteen inches wide, and twenty-seven inches high.";
csb[24] = "&quot;Overlay it with pure gold and make a gold molding all around it.";
csb[25] = "&quot;Make a three-inch frame all around it and make a gold molding for it all around its frame.";
csb[26] = "&quot;Make four gold rings for it, and attach the rings to the four corners at its four legs.";
csb[27] = "&quot;The rings should be next to the frame as holders for the poles to carry the table.";
csb[28] = "&quot;Make the poles of acacia wood and overlay them with gold, and the table can be carried by them.";
csb[29] = "&quot;You are also to make its plates and cups, as well as its pitchers and bowls for pouring drink offerings. Make them out of pure gold.";
csb[30] = "&quot;Put the Bread of the Presence on the table before me at all times.";
csb[31] = "&quot;You are to make a lampstand out of pure, hammered gold. It is to be made of one piece: its base and shaft, its ornamental cups, and its buds and petals.";
csb[32] = "&quot;Six branches are to extend from its sides, three branches of the lampstand from one side and three branches of the lampstand from the other side.";
csb[33] = "&quot;There are to be three cups shaped like almond blossoms, each with a bud and petals, on one branch, and three cups shaped like almond blossoms, each with a bud and petals, on the next branch. It is to be this way for the six branches that extend from the lampstand.";
csb[34] = "&quot;There are to be four cups shaped like almond blossoms on the lampstand shaft along with its buds and petals.";
csb[35] = "&quot;For the six branches that extend from the lampstand, a bud must be under the first pair of branches from it, a bud under the second pair of branches from it, and a bud under the third pair of branches from it.";
csb[36] = "&quot;Their buds and branches are to be of one piece. All of it is to be a single hammered piece of pure gold.";
csb[37] = "&quot;Make its seven lamps, and set them up so that they illuminate the area in front of it.";
csb[38] = "&quot;Its snuffers and firepans must be of pure gold.";
csb[39] = "&quot;The lampstand with all these utensils is to be made from seventy-five pounds of pure gold.";
csb[40] = "&quot;Be careful to make them according to the pattern you have been shown on the mountain.";
