csb[1] = "Bezalel constructed the altar of burnt offering from acacia wood. It was square, 7 1/2 feet long and 7 1/2 feet wide, and was 4 1/2 feet high.";
csb[2] = "He made horns for it on its four corners; the horns were of one piece with it. Then he overlaid it with bronze.";
csb[3] = "He made all the altar\'s utensils: the pots, shovels, basins, meat forks, and firepans; he made all its utensils of bronze.";
csb[4] = "He constructed for the altar a grate of bronze mesh under its ledge, halfway up from the bottom.";
csb[5] = "He cast four rings at the four corners of the bronze grate as holders for the poles.";
csb[6] = "He made the poles of acacia wood and overlaid them with bronze.";
csb[7] = "Then he inserted the poles into the rings on the sides of the altar in order to carry it with them. He constructed the altar with boards so that it was hollow.";
csb[8] = "He made the bronze basin and its stand from the bronze mirrors of the women who served at the entrance to the tent of meeting.";
csb[9] = "Then he made the courtyard. The hangings on the south side of the courtyard were of finely spun linen, 150 feet long,";
csb[10] = "including their twenty posts and their twenty bronze bases, with silver hooks and silver bands for the posts.";
csb[11] = "The hangings on the north side were also 150 feet long, including their twenty posts and twenty bronze bases. The hooks and bands of the posts were silver.";
csb[12] = "The hangings on the west side were 75 feet long, including their ten posts and their ten bases, with silver hooks and silver bands for the posts.";
csb[13] = "And for the east side toward the sunrise, 75 feet long,";
csb[14] = "the hangings on one side of the gate were 22 1/2 feet, including their three posts and their three bases.";
csb[15] = "It was the same for the other side of the courtyard gate. The hangings were 22 1/2 feet, including their three posts and their three bases.";
csb[16] = "All the hangings around the courtyard were of finely spun linen.";
csb[17] = "The bases for the posts were bronze; the hooks and bands of the posts were silver; and the plating for the tops of the posts was silver. All the posts of the courtyard were banded with silver.";
csb[18] = "The screen for the gate of the courtyard was made of finely spun linen, expertly embroidered with blue, purple, and scarlet yarn. It was 30 feet long, and like the hangings of the courtyard, 7 1/2 feet high.";
csb[19] = "It had four posts with their four bronze bases. Their hooks were silver, and their top plating and their bands were silver.";
csb[20] = "All the tent pegs for the tabernacle and for the surrounding courtyard were bronze.";
csb[21] = "This is the inventory for the tabernacle, the tabernacle of the testimony, that was recorded at Moses\'s command. It was the work of the Levites under the direction of Ithamar son of Aaron the priest.";
csb[22] = "Bezalel son of Uri, son of Hur, of the tribe of Judah, made everything that the LORD commanded Moses.";
csb[23] = "With him was Oholiab son of Ahisamach, of the tribe of Dan, a gem cutter, a designer, and an embroiderer with blue, purple, and scarlet yarn, and fine linen.";
csb[24] = "All the gold of the presentation offering that was used for the project in all the work on the sanctuary, was 2,193 pounds, according to the sanctuary shekel.";
csb[25] = "The silver from those of the community who were registered was 7,544 pounds, according to the sanctuary shekel --";
csb[26] = "two-fifths of an ounce per man, that is, half a shekel according to the sanctuary shekel, from everyone twenty years old or more who had crossed over to the registered group, 603,550 men.";
csb[27] = "There were 7,500 pounds of silver used to cast the bases of the sanctuary and the bases of the curtain -- one hundred bases from 7,500 pounds, 75 pounds for each base.";
csb[28] = "With the remaining 44 pounds he made the hooks for the posts, overlaid their tops, and supplied bands for them.";
csb[29] = "The bronze of the presentation offering totaled 5,310 pounds.";
csb[30] = "He made with it the bases for the entrance to the tent of meeting, the bronze altar and its bronze grate, all the utensils for the altar,";
csb[31] = "the bases for the surrounding courtyard, the bases for the gate of the courtyard, all the tent pegs for the tabernacle, and all the tent pegs for the surrounding courtyard.";
