kjv[24] = "And the people murmured against Moses, saying, What shall we drink?";

asv[24] = "And the people murmured against Moses, saying, What shall we drink?";
yng[24] = "And the people murmur against Moses, saying, `What do we drink?\'";

kjv[25] = "And he cried unto the LORD; and the LORD shewed him a tree, [which] when he had cast into the waters, the waters were made sweet: there he made for them a statute and an ordinance, and there he proved them,";
csb[25] = "So he cried out to the LORD, and the LORD showed him a tree. When he threw it into the water, the water became drinkable. He made a statute and ordinance for them at Marah and He tested them there.";
rsv[25] = "And he cried to the LORD; and the LORD showed him a tree, and he threw it into the water, and the water became sweet. There the LORD made for them a statute and an ordinance and there he proved them,";
asv[25] = "And he cried unto Jehovah; And Jehovah showed him a tree, and he cast it into the waters, and the waters were made sweet. There he made for them a statute and an ordinance, and there he proved them;";
yng[25] = "and he crieth unto Jehovah, and Jehovah sheweth him a tree, and he casteth unto the waters, and the waters become sweet. There He hath made for them a statute, and an ordinance, and there He hath tried them,";
dby[25] = "And he cried to Jehovah; and Jehovah shewed him wood, and he cast it into the waters, and the waters became sweet. There he made for them a statute and an ordinance; and there he tested them.";
web[25] = "And he cried to the LORD; and the LORD showed him a tree, [which] he cast into the waters, [and] the waters were made sweet: there he made for them a statute and an ordinance, and there he proved them,";
hnv[25] = "Then he cried to the LORD. The LORD shown him a tree, and he threw it into the waters, and the waters were made sweet. There he made a statute and an ordinance for them, and there he tested them;";
vul[25] = "at ille clamavit ad Dominum qui ostendit ei lignum quod cum misisset in aquas in dulcedinem versae sunt ibi constituit ei praecepta atque iudicia et ibi temptavit eum";
kjv[26] = "And said, If thou wilt diligently hearken to the voice of the LORD thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes, I will put none of these diseases upon thee, which I have brought upon the Egyptians: for I [am] the LORD that healeth thee.";
csb[26] = "He said, &quot;If you will carefully obey the LORD your God, do what is right in His eyes, pay attention to His commands, and keep all His statutes, I will not inflict any illnesses on you that I inflicted on the Egyptians. For I am Yahweh who heals you.&quot;";
rsv[26] = "saying, &quot;If you will diligently hearken to the voice of the LORD your God, and do that which is right in his eyes, and give heed to his commandments and keep all his statutes, I will put none of the diseases upon you which I put upon the Egyptians; for I am the LORD, your healer.&quot;";
asv[26] = "and he said, If thou wilt diligently hearken to the voice of Jehovah thy God, and wilt do that which is right in his eyes, and wilt give ear to his commandments, and keep all his statutes, I will put none of the diseases upon thee, which I have put upon the Egyptians: for I am Jehovah that healeth thee.";
yng[26] = "and He saith, `If thou dost really hearken to the voice of Jehovah thy God, and dost that which is right in His eyes, and hast hearkened to His commands, and kept all His statutes: none of the sickness which I laid on the Egyptians do I lay on thee, for I, Jehovah, am healing thee.";
dby[26] = "And he said, If thou wilt diligently hearken to the voice of Jehovah thy God, and do what is right in his eyes, and incline thine ears to his commandments, and keep all his statutes, I will put none of the complaints upon thee that I have put upon the Egyptians; for I am Jehovah who healeth thee.";
web[26] = "And said, If thou wilt diligently hearken to the voice of the LORD thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes; I will put none of these diseases upon thee, which I have brought upon the Egyptians; for I [am] the LORD that healeth thee.";
hnv[26] = "and he said, &quot;If you will diligently listen to the voice of the LORD your God, and will do that which is right in his eyes, and will pay attention to his mitzvot, and keep all his statutes, I will put none of the diseases on you, which I have put on the Mitzrim; for I am the LORD who heals you.&quot;";
vul[26] = "dicens si audieris vocem Domini Dei tui et quod rectum est coram eo feceris et oboedieris mandatis eius custodierisque omnia praecepta illius cunctum languorem quem posui in Aegypto non inducam super te ego enim Dominus sanator tuus";
kjv[27] = "And they came to Elim, where [were] twelve wells of water, and threescore and ten palm trees: and they encamped there by the waters.";
csb[27] = "Then they came to Elim, where there were 12 springs of water and 70 date palms, and they camped there by the waters.";
rsv[27] = "Then they came to Elim, where there were twelve springs of water and seventy palm trees; and they encamped there by the water.";
asv[27] = "And they came to Elim, where were twelve springs of water, and threescore and ten palm-trees: and they encamped there by the waters.";
yng[27] = "And they come to Elim, and there [are] twelve fountains of water, and seventy palm trees; and they encamp there by the waters.";
dby[27] = "And they came to Elim; and twelve springs of water were there, and seventy palm trees; and they encamped there by the waters.";
web[27] = "And they came to Elim, where [were] twelve wells of water, and seventy palm-trees: and they encamped there by the waters.";
hnv[27] = "They came to Elim, where there were twelve springs of water, and seventy palm trees: and they encamped there by the waters.";
vul[27] = "venerunt autem in Helim ubi erant duodecim fontes aquarum et septuaginta palmae et castrametati sunt iuxta aquas";
csb[1] = "Then Moses and the Israelites sang this song to the LORD. They said: I will sing to the LORD, for he is highly exalted; he has thrown the horse and its rider into the sea.";
csb[2] = "The LORD is my strength and my song; he has become my salvation. This is my God, and I will praise him, my father\'s God, and I will exalt him.";
csb[3] = "The LORD is a warrior; the LORD is his name.";
csb[4] = "He threw Pharaoh\'s chariots and his army into the sea; the elite of his officers were drowned in the Red Sea.";
csb[5] = "The floods covered them; they sank to the depths like a stone.";
csb[6] = "LORD, your right hand is glorious in power. LORD, your right hand shattered the enemy.";
csb[7] = "You overthrew your adversaries by your great majesty. You unleashed your burning wrath; it consumed them like stubble.";
csb[8] = "The water heaped up at the blast from your nostrils; the currents stood firm like a dam. The watery depths congealed in the heart of the sea.";
csb[9] = "The enemy said: &quot;I will pursue, I will overtake, I will divide the spoil. My desire will be gratified at their expense. I will draw my sword; my hand will destroy them.&quot;";
csb[10] = "But you blew with your breath, and the sea covered them. They sank like lead in the mighty waters.";
csb[11] = "LORD, who is like you among the gods? Who is like you, glorious in holiness, revered with praises, performing wonders?";
csb[12] = "You stretched out your right hand, and the earth swallowed them.";
csb[13] = "With your faithful love, you will lead the people you have redeemed; you will guide them to your holy dwelling with your strength.";
csb[14] = "When the peoples hear, they will shudder; anguish will seize the inhabitants of Philistia.";
csb[15] = "Then the chiefs of Edom will be terrified; trembling will seize the leaders of Moab; all the inhabitants of Canaan will panic;";
csb[16] = "terror and dread will fall on them. They will be as still as a stone because of your powerful arm until your people pass by, LORD, until the people whom you purchased pass by.";
csb[17] = "You will bring them in and plant them on the mountain of your possession; LORD, you have prepared the place for your dwelling; Lord, your hands have established the sanctuary.";
csb[18] = "The LORD will reign forever and ever!";
csb[19] = "When Pharaoh\'s horses with his chariots and horsemen went into the sea, the LORD brought the water of the sea back over them. But the Israelites walked through the sea on dry ground.";
csb[20] = "Then the prophetess Miriam, Aaron\'s sister, took a tambourine in her hand, and all the women came out following her with tambourines and dancing.";
csb[21] = "Miriam sang to them: Sing to the LORD, for he is highly exalted; he has thrown the horse and its rider into the sea.";
csb[22] = "Then Moses led Israel on from the Red Sea, and they went out to the Wilderness of Shur. They journeyed for three days in the wilderness without finding water.";
csb[23] = "They came to Marah, but they could not drink the water at Marah because it was bitter -- that is why it was named Marah.";
csb[24] = "The people grumbled to Moses, &quot;What are we going to drink? &quot;";
csb[25] = "So he cried out to the LORD, and the LORD showed him a tree. When he threw it into the water, the water became drinkable. The LORD made a statute and ordinance for them at Marah, and he tested them there.";
csb[26] = "He said, &quot;If you will carefully obey the LORD your God, do what is right in his sight, pay attention to his commands, and keep all his statutes, I will not inflict any illnesses on you that I inflicted on the Egyptians. For I am the LORD who heals you.&quot;";
csb[27] = "Then they came to Elim, where there were twelve springs and seventy date palms, and they camped there by the water.";
