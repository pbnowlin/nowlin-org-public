hnv[17] = "and I have said, I will bring you up out of the affliction of Mitzrayim to the land of the Kana`ani, the Hittite, the Amori, the Perizzi, the Hivvi, and the Yevusi, to a land flowing with milk and honey.&quot;\'";
vul[17] = "et dixi ut educam vos de adflictione Aegypti in terram Chananei et Hetthei et Amorrei Ferezei et Evei et Iebusei ad terram fluentem lacte et melle";
kjv[18] = "And they shall hearken to thy voice: and thou shalt come, thou and the elders of Israel, unto the king of Egypt, and ye shall say unto him, The LORD God of the Hebrews hath met with us: and now let us go, we beseech thee, three days\' journey into the wilderness, that we may sacrifice to the LORD our God.";
csb[18] = "They will listen to what you say. Then you, along with the elders of Israel, must go to the king of Egypt and say to him: Yahweh, the God of the Hebrews, has met with us. Now please let us go on a three-day trip into the wilderness so that we may sacrifice to Yahweh our God.";
rsv[18] = "And they will hearken to your voice; and you and the elders of Israel shall go to the king of Egypt and say to him, \'The LORD, the God of the Hebrews, has met with us; and now, we pray you, let us go a three days\' journey into the wilderness, that we may sacrifice to the LORD our God.\'";
asv[18] = "And they shall hearken to thy voice: and thou shalt come, thou and the elders of Israel, unto the king of Egypt, and ye shall say unto him, Jehovah, the God of the Hebrews, hath met with us: and now let us go, we pray thee, three days\' journey into the wilderness, that we may sacrifice to Jehovah our God.";
yng[18] = "`And they have hearkened to thy voice, and thou hast entered, thou and the elders of Israel, unto the king of Egypt, and ye have said unto him, Jehovah, God of the Hebrews, hath met with us; and now, let us go, we pray thee, a journey of three days into the wilderness, and we sacrifice to Jehovah our God.";
dby[18] = "And they shall hearken to thy voice. And thou shalt come, thou and the elders of Israel, unto the king of Egypt, and ye shall say unto him, Jehovah, the God of the Hebrews, hath met with us; and now, let us go, we pray thee, three days\' journey into the wilderness, that we may sacrifice to Jehovah our God.";
web[18] = "And they shall hearken to thy voice: and thou shalt come, thou and the elders of Israel, to the king of Egypt, and ye shall say to him, The LORD God of the Hebrews hath met with us: and now let us go (we beseech thee) three days journey into the wilderness, that we may sacrifice to the LORD our God.";
hnv[18] = "They will listen to your voice, and you shall come, you and the Zakenim of Yisra\'el, to the king of Mitzrayim, and you shall tell him, \'The LORD, the God of the Hebrews, has met with us. Now please let us go three days\' journey into the wilderness, that we may sacrifice to the LORD, our God.\'";
vul[18] = "et audient vocem tuam ingredierisque tu et seniores Israhel ad regem Aegypti et dices ad eum Dominus Deus Hebraeorum vocavit nos ibimus viam trium dierum per solitudinem ut immolemus Domino Deo nostro";
kjv[19] = "And I am sure that the king of Egypt will not let you go, no, not by a mighty hand.";
csb[19] = "&quot;However, I know that the king of Egypt will not allow you to go, unless he is forced by a strong hand.";
rsv[19] = "I know that the king of Egypt will not let you go unless compelled by a mighty hand.";
asv[19] = "And I know that the king of Egypt will not give you leave to go, no, not by a mighty hand.";
yng[19] = "`And I -- I have known that the king of Egypt doth not permit you to go, unless by a strong hand,";
dby[19] = "But I know that the king of Egypt will not let you go, no, not by a powerful hand.";
web[19] = "And I am sure that the king of Egypt will not let you go, no, not by a mighty hand.";
hnv[19] = "I know that the king of Mitzrayim won\'t give you permission to go, no, not by a mighty hand.";
vul[19] = "sed ego scio quod non dimittet vos rex Aegypti ut eatis nisi per manum validam";
kjv[20] = "And I will stretch out my hand, and smite Egypt with all my wonders which I will do in the midst thereof: and after that he will let you go.";
csb[20] = "I will stretch out My hand and strike Egypt with all My miracles that I will perform in it. After that, he will let you go.";
rsv[20] = "So I will stretch out my hand and smite Egypt with all the wonders which I will do in it; after that he will let you go.";
asv[20] = "And I will put forth my hand, and smite Egypt with all my wonders which I will do in the midst thereof: and after that he will let you go.";
yng[20] = "and I have put forth My hand, and have smitten Egypt with all My wonders, which I do in its midst -- and afterwards he doth send you away.";
dby[20] = "And I will stretch out my hand and smite Egypt with all my wonders which I will do in the midst thereof; and after that he will let you go.";
web[20] = "And I will stretch out my hand, and smite Egypt with all my wonders which I will do in the midst thereof: and after that he will let you go.";
hnv[20] = "I will put forth my hand and strike Mitzrayim with all my wonders which I will do in the midst of it, and after that he will let you go.";
vul[20] = "extendam enim manum meam et percutiam Aegyptum in cunctis mirabilibus meis quae facturus sum in medio eorum post haec dimittet vos";
kjv[21] = "And I will give this people favour in the sight of the Egyptians: and it shall come to pass, that, when ye go, ye shall not go empty:";
csb[21] = "And I will give these people such favor in the sight of the Egyptians that when you go, you will not go empty-handed.";
rsv[21] = "And I will give this people favor in the sight of the Egyptians; and when you go, you shall not go empty,";
asv[21] = "And I will give this people favor in the sight of the Egyptians: and it shall come to pass, that, when ye go, ye shall not go empty.";
yng[21] = "`And I have given the grace of this people in the eyes of the Egyptians, and it hath come to pass, when ye go, ye go not empty;";
dby[21] = "And I will give this people favour in the eyes of the Egyptians, and it shall come to pass, when ye go out, that ye shall not go out empty;";
web[21] = "And I will give this people favor in the sight of the Egyptians: and it shall come to pass, that when ye go, ye shall not go empty:";
hnv[21] = "I will give this people favor in the sight of the Mitzrim, and it will happen that when you go, you shall not go empty-handed.";
vul[21] = "daboque gratiam populo huic coram Aegyptiis et cum egrediemini non exibitis vacui";
kjv[22] = "But every woman shall borrow of her neighbour, and of her that sojourneth in her house, jewels of silver, and jewels of gold, and raiment: and ye shall put [them] upon your sons, and upon your daughters; and ye shall spoil the Egyptians.";
csb[22] = "Each woman will ask her neighbor and any woman staying in her house for silver and gold jewelry, and clothing, and you will put them on your sons and daughters. So you will plunder the Egyptians.&quot;";
rsv[22] = "but each woman shall ask of her neighbor, and of her who sojourns in her house, jewelry of silver and of gold, and clothing, and you shall put them on your sons and on your daughters; thus you shall despoil the Egyptians.&quot;";
asv[22] = "But every woman shall ask of her neighbor, and of her that sojourneth in her house, jewels of silver, and jewels of gold, and raiment: and ye shall put them upon your sons, and upon your daughters; and ye shall despoil the Egyptians.";
yng[22] = "and [every] woman hath asked from her neighbour, and from her who is sojourning in her house, vessels of silver, and vessels of gold, and garments, and ye have put [them] on your sons and on your daughters, and have spoiled the Egyptians.\'";
dby[22] = "but every woman shall ask of her neighbour, and of her that is the inmate of her house, utensils of silver, and utensils of gold, and clothing; and ye shall put [them] on your sons and on your daughters, and shall spoil the Egyptians.";
web[22] = "But every woman shall borrow of her neighbor, and of her that dwelleth in her house, jewels of silver, and jewels of gold, and raiment: and ye shall put [them] upon your sons, and upon your daughters: and ye shall spoil the Egyptians.";
hnv[22] = "But every woman shall ask of her neighbor, and of her who visits her house, jewels of silver, jewels of gold, and clothing; and you shall put them on your sons, and on your daughters. You shall despoil the Mitzrim.";
vul[22] = "sed postulabit mulier a vicina sua et ab hospita vasa argentea et aurea ac vestes ponetisque eas super filios et filias vestras et spoliabitis Aegyptum";
csb[1] = "Meanwhile, Moses was shepherding the flock of his father-in-law Jethro, the priest of Midian. He led the flock to the far side of the wilderness and came to Horeb, the mountain of God.";
csb[2] = "Then the angel of the LORD appeared to him in a flame of fire within a bush. As Moses looked, he saw that the bush was on fire but was not consumed.";
csb[3] = "So Moses thought, &quot;I must go over and look at this remarkable sight. Why isn\'t the bush burning up? &quot;";
csb[4] = "When the LORD saw that he had gone over to look, God called out to him from the bush, &quot;Moses, Moses! &quot; &quot;Here I am,&quot; he answered.";
csb[5] = "&quot;Do not come closer,&quot; he said. &quot;Remove the sandals from your feet, for the place where you are standing is holy ground.&quot;";
csb[6] = "Then he continued, &quot;I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.&quot; Moses hid his face because he was afraid to look at God.";
csb[7] = "Then the LORD said, &quot;I have observed the misery of my people in Egypt, and have heard them crying out because of their oppressors. I know about their sufferings,";
csb[8] = "&quot;and I have come down to rescue them from the power of the Egyptians and to bring them from that land to a good and spacious land, a land flowing with milk and honey -- the territory of the Canaanites, Hethites, Amorites, Perizzites, Hivites, and Jebusites.";
csb[9] = "&quot;So because the Israelites\' cry for help has come to me, and I have also seen the way the Egyptians are oppressing them,";
csb[10] = "&quot;therefore, go. I am sending you to Pharaoh so that you may lead my people, the Israelites, out of Egypt.&quot;";
csb[11] = "But Moses asked God, &quot;Who am I that I should go to Pharaoh and that I should bring the Israelites out of Egypt? &quot;";
csb[12] = "He answered, &quot;I will certainly be with you, and this will be the sign to you that I am the one who sent you: when you bring the people out of Egypt, you will all worship God at this mountain.&quot;";
csb[13] = "Then Moses asked God, &quot;If I go to the Israelites and say to them, \'The God of your fathers has sent me to you,\' and they ask me, \'What is his name? \' what should I tell them? &quot;";
csb[14] = "God replied to Moses, &quot;I AM WHO I AM. This is what you are to say to the Israelites: I AM has sent me to you.&quot;";
csb[15] = "God also said to Moses, &quot;Say this to the Israelites: The LORD, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever; this is how I am to be remembered in every generation.";
csb[16] = "&quot;Go and assemble the elders of Israel and say to them: The LORD, the God of your fathers, the God of Abraham, Isaac, and Jacob, has appeared to me and said: I have paid close attention to you and to what has been done to you in Egypt.";
csb[17] = "&quot;And I have promised you that I will bring you up from the misery of Egypt to the land of the Canaanites, Hethites, Amorites, Perizzites, Hivites, and Jebusites -- a land flowing with milk and honey.";
csb[18] = "&quot;They will listen to what you say. Then you, along with the elders of Israel, must go to the king of Egypt and say to him: The LORD, the God of the Hebrews, has met with us. Now please let us go on a three-day trip into the wilderness so that we may sacrifice to the LORD our God.";
csb[19] = "&quot;However, I know that the king of Egypt will not allow you to go, even under force from a strong hand.";
csb[20] = "&quot;But when I stretch out my hand and strike Egypt with all my miracles that I will perform in it, after that, he will let you go.";
csb[21] = "&quot;And I will give these people such favor with the Egyptians that when you go, you will not go empty-handed.";
csb[22] = "&quot;Each woman will ask her neighbor and any woman staying in her house for silver and gold jewelry, and clothing, and you will put them on your sons and daughters. So you will plunder the Egyptians.&quot;";
