kjv[28] = "And it shall be Aaron\'s and his sons\' by a statute for ever from the children of Israel: for it [is] an heave offering: and it shall be an heave offering from the children of Israel of the sacrifice of their peace offerings, [even] their heave offering unto the LORD.";

asv[40] = "and with the one lamb a tenth part [of an ephah] of fine flour mingled with the fourth part of a hin of beaten oil, and the fourth part of a hin of wine for a drink-offering.";
yng[40] = "and a tenth [deal] of fine flour, mixed with beaten oil, a fourth part of a hin, and a libation, a fourth part of a hin, of wine, [is] for the one lamb.";
dby[40] = "And with the one lamb a tenth part of wheaten flour mingled with beaten oil, a fourth part of a hin; and a drink-offering, a fourth part of a hin of wine.";
web[40] = "And with the one lamb a tenth-portion of flour mingled with the fourth part of a hin of beaten oil; and the fourth part of a hin of wine [for] a drink-offering.";
hnv[40] = "and with the one lamb a tenth part of an efah of fine flour mixed with the fourth part of a hin of beaten oil, and the fourth part of a hin of wine for a drink-offering.";
vul[40] = "decimam partem similae conspersae oleo tunso quod habeat mensuram quartam partem hin et vinum ad libandum eiusdem mensurae in agno uno";
kjv[41] = "And the other lamb thou shalt offer at even, and shalt do thereto according to the meat offering of the morning, and according to the drink offering thereof, for a sweet savour, an offering made by fire unto the LORD.";
csb[41] = "You are to offer the second lamb at twilight. Offer a grain offering and a drink offering with it, like the one in the morning, as a pleasing aroma, a fire offering to the LORD.";
rsv[41] = "And the other lamb you shall offer in the evening, and shall offer with it a cereal offering and its libation, as in the morning, for a pleasing odor, an offering by fire to the LORD.";
asv[41] = "And the other lamb thou shalt offer at even, and shalt do thereto according to the meal-offering of the morning, and according to the drink-offering thereof, for a sweet savor, an offering made by fire unto Jehovah.";
yng[41] = "`And the second lamb thou dost prepare between the evenings; according to the present of the morning, and according to its libation, thou dost prepare for it, for sweet fragrance, a fire-offering, to Jehovah: --";
dby[41] = "And the second lamb shalt thou offer between the two evenings; as the oblation in the morning, and as its drink-offering shalt thou offer with this, for a sweet odour, an offering by fire to Jehovah.";
web[41] = "And the other lamb thou shalt offer at evening, and shalt do thereto according to the meat-offering of the morning, and according to the drink-offering thereof, for a sweet savor, an offering made by fire to the LORD.";
hnv[41] = "The other lamb you shall offer at evening, and shall do to it according to the meal-offering of the morning, and according to its drink-offering, for a sweet savor, an offering made by fire to the LORD.";
vul[41] = "alterum vero agnum offeres ad vesperam iuxta ritum matutinae oblationis et iuxta ea quae diximus in odorem suavitatis";

csb[42] = "This will be a regular burnt offering throughout your generations at the entrance to the tent of meeting before the LORD, where I will meet you* to speak with you.";
rsv[42] = "It shall be a continual burnt offering throughout your generations at the door of the tent of meeting before the LORD, where I will meet with you, to speak there to you.";
asv[42] = "It shall be a continual burnt-offering throughout your generations at the door of the tent of meeting before Jehovah, where I will meet with you, to speak there unto thee.";

dby[42] = "It shall be a continual burnt-offering throughout your generations at the entrance of the tent of meeting before Jehovah, where I will meet with you, to speak there with thee.";
web[42] = "[This shall be] a continual burnt-offering throughout your generations [at] the door of the tabernacle of the congregation before the LORD: where I will meet you to speak there to thee.";
hnv[42] = "It shall be a continual burnt offering throughout your generations at the door of the tent of meeting before the LORD, where I will meet with you, to speak there to you.";

csb[43] = "I will also meet with the Israelites there, and that place will be consecrated by My glory.";
rsv[43] = "There I will meet with the people of Israel, and it shall be sanctified by my glory;";
asv[43] = "And there I will meet with the children of Israel; and [the Tent] shall be sanctified by my glory.";
yng[43] = "and I have met there with the sons of Israel, and it hath been sanctified by My honour.";
dby[43] = "And there will I meet with the children of Israel; and it shall be hallowed by my glory.";
web[43] = "And there I will meet with the children of Israel, and [the tabernacle] shall be sanctified by my glory.";
hnv[43] = "There I will meet with the children of Yisra\'el; and the place shall be sanctified by my glory.";

kjv[44] = "And I will sanctify the tabernacle of the congregation, and the altar: I will sanctify also both Aaron and his sons, to minister to me in the priest\'s office.";
csb[44] = "I will consecrate the tent of meeting and the altar; I will also consecrate Aaron and his sons to serve Me as priests.";
rsv[44] = "I will consecrate the tent of meeting and the altar; Aaron also and his sons I will consecrate, to serve me as priests.";
asv[44] = "And I will sanctify the tent of meeting, and the altar: Aaron also and his sons will I sanctify, to minister to me in the priest\'s office.";
yng[44] = "`And I have sanctified the tent of meeting, and the altar, and Aaron and his sons I sanctify for being priests to Me,";
dby[44] = "And I will hallow the tent of meeting, and the altar; and I will hallow Aaron and his sons, that they may serve me as priests.";
web[44] = "And I will sanctify the tabernacle of the congregation, and the altar: I will sanctify also both Aaron and his sons, to minister to me in the priest\'s office.";
hnv[44] = "I will sanctify the tent of meeting and the altar: Aharon also and his sons I will sanctify, to minister to me in the Kohen\'s office.";
vul[44] = "sanctificabo et tabernaculum testimonii cum altari et Aaron cum filiis eius ut sacerdotio fungantur mihi";

asv[45] = "And I will dwell among the children of Israel, and will be their God.";

kjv[46] = "And they shall know that I [am] the LORD their God, that brought them forth out of the land of Egypt, that I may dwell among them: I [am] the LORD their God.";
csb[46] = "And they will know that I am Yahweh their God, who brought them out of the land of Egypt, so that I might dwell among them. I am Yahweh their God.";
rsv[46] = "And they shall know that I am the LORD their God, who brought them forth out of the land of Egypt that I might dwell among them; I am the LORD their God.";
asv[46] = "And they shall know that I am Jehovah their God, that brought them forth out of the land of Egypt, that I might dwell among them: I am Jehovah their God.";
yng[46] = "and they have known that I [am] Jehovah their God, who hath brought them out of the land of Egypt, that I may tabernacle in their midst; I [am] Jehovah their God.";
dby[46] = "And they shall know that I am Jehovah their God, who have brought them forth out of the land of Egypt, to dwell in their midst: I am Jehovah their God.";
web[46] = "And they shall know that I [am] the LORD their God, that brought them forth out of the land of Egypt, that I may dwell among them: I [am] the LORD their God.";
hnv[46] = "They shall know that I am the LORD their God, who brought them forth out of the land of Mitzrayim, that I might dwell among them: I am the LORD their God.";
vul[46] = "et scient quia ego Dominus Deus eorum qui eduxi eos de terra Aegypti ut manerem inter illos ego Dominus Deus ipsorum";
csb[1] = "&quot;This is what you are to do for them to consecrate them to serve me as priests. Take a young bull and two unblemished rams,";
csb[2] = "&quot;with unleavened bread, unleavened cakes mixed with oil, and unleavened wafers coated with oil. Make them out of fine wheat flour,";
csb[3] = "&quot;put them in a basket, and bring them in the basket, along with the bull and two rams.";
csb[4] = "&quot;Bring Aaron and his sons to the entrance to the tent of meeting and wash them with water.";
csb[5] = "&quot;Then take the garments and clothe Aaron with the tunic, the robe for the ephod, the ephod itself, and the breastpiece; fasten the ephod on him with its woven waistband.";
csb[6] = "&quot;Put the turban on his head and place the holy diadem on the turban.";
csb[7] = "&quot;Take the anointing oil, pour it on his head, and anoint him.";
csb[8] = "&quot;You must also bring his sons and clothe them with tunics.";
csb[9] = "&quot;Tie the sashes on Aaron and his sons and fasten headbands on them. The priesthood is to be theirs by a permanent statute. This is the way you will ordain Aaron and his sons.";
csb[10] = "&quot;You are to bring the bull to the front of the tent of meeting, and Aaron and his sons must lay their hands on the bull\'s head.";
csb[11] = "&quot;Slaughter the bull before the LORD at the entrance to the tent of meeting.";
csb[12] = "&quot;Take some of the bull\'s blood and apply it to the horns of the altar with your finger; then pour out all the rest of the blood at the base of the altar.";
csb[13] = "&quot;Take all the fat that covers the entrails, the fatty lobe of the liver, and the two kidneys with the fat on them, and burn them on the altar.";
csb[14] = "&quot;But burn the bull\'s flesh, its hide, and its waste outside the camp; it is a sin offering.";
csb[15] = "&quot;Take one ram, and Aaron and his sons are to lay their hands on the ram\'s head.";
csb[16] = "&quot;You are to slaughter the ram, take its blood, and splatter it on all sides of the altar.";
csb[17] = "&quot;Cut the ram into pieces. Wash its entrails and legs, and place them with its head and its pieces on the altar.";
csb[18] = "&quot;Then burn the whole ram on the altar; it is a burnt offering to the LORD. It is a pleasing aroma, a fire offering to the LORD.";
csb[19] = "&quot;You are to take the second ram, and Aaron and his sons must lay their hands on the ram\'s head.";
csb[20] = "&quot;Slaughter the ram, take some of its blood, and put it on Aaron\'s right earlobe, on his sons\' right earlobes, on the thumbs of their right hands, and on the big toes of their right feet. Splatter the remaining blood on all sides of the altar.";
csb[21] = "&quot;Take some of the blood that is on the altar and some of the anointing oil, and sprinkle them on Aaron and his garments, as well as on his sons and their garments. So he and his garments will be holy, as well as his sons and their garments.";
csb[22] = "&quot;Take the fat from the ram, the fat tail, the fat covering the entrails, the fatty lobe of the liver, the two kidneys and the fat on them, and the right thigh (since this is a ram for ordination);";
csb[23] = "&quot;take one loaf of bread, one cake of bread made with oil, and one wafer from the basket of unleavened bread that is before the LORD;";
csb[24] = "&quot;and put all of them in the hands of Aaron and his sons and present them as a presentation offering before the LORD.";
csb[25] = "&quot;Take them from their hands and burn them on the altar on top of the burnt offering, as a pleasing aroma before the LORD; it is a fire offering to the LORD.";
csb[26] = "&quot;Take the breast from the ram of Aaron\'s ordination and present it as a presentation offering before the LORD; it is to be your portion.";
csb[27] = "&quot;Consecrate for Aaron and his sons the breast of the presentation offering that is presented and the thigh of the contribution that is lifted up from the ram of ordination.";
csb[28] = "&quot;This will belong to Aaron and his sons as a regular portion from the Israelites, for it is a contribution. It will be the Israelites\' contribution from their fellowship sacrifices, their contribution to the LORD.";
csb[29] = "&quot;The holy garments that belong to Aaron are to belong to his sons after him, so that they can be anointed and ordained in them.";
csb[30] = "&quot;Any priest who is one of his sons and who succeeds him and enters the tent of meeting to minister in the sanctuary must wear them for seven days.";
csb[31] = "&quot;You are to take the ram of ordination and boil its flesh in a holy place.";
csb[32] = "&quot;Aaron and his sons are to eat the meat of the ram and the bread that is in the basket at the entrance to the tent of meeting.";
csb[33] = "&quot;They must eat those things by which atonement was made at the time of their ordination and consecration. An unauthorized person must not eat them, for these things are holy.";
csb[34] = "&quot;If any of the meat of ordination or any of the bread is left until morning, burn what is left over. It must not be eaten because it is holy.";
csb[35] = "&quot;This is what you are to do for Aaron and his sons based on all I have commanded you. Take seven days to ordain them.";
csb[36] = "&quot;Sacrifice a bull as a sin offering each day for atonement. Purify the altar when you make atonement for it, and anoint it in order to consecrate it.";
csb[37] = "&quot;For seven days you must make atonement for the altar and consecrate it. The altar will be especially holy. Whatever touches the altar will be consecrated.";
csb[38] = "&quot;This is what you are to offer regularly on the altar every day: two year-old lambs.";
csb[39] = "&quot;In the morning offer one lamb, and at twilight offer the other lamb.";
csb[40] = "&quot;With the first lamb offer two quarts of fine flour mixed with one quart of oil from crushed olives, and a drink offering of one quart of wine.";
csb[41] = "&quot;You are to offer the second lamb at twilight. Offer a grain offering and a drink offering with it, like the one in the morning, as a pleasing aroma, a fire offering to the LORD.";
csb[42] = "&quot;This will be a regular burnt offering throughout your generations at the entrance to the tent of meeting before the LORD, where I will meet you to speak with you.";
csb[43] = "&quot;I will also meet with the Israelites there, and that place will be consecrated by my glory.";
csb[44] = "&quot;I will consecrate the tent of meeting and the altar; I will also consecrate Aaron and his sons to serve me as priests.";
csb[45] = "&quot;I will dwell among the Israelites and be their God.";
csb[46] = "&quot;And they will know that I am the LORD their God, who brought them out of the land of Egypt, so that I might dwell among them. I am the LORD their God.";
</script>
