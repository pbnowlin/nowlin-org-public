csb[1] = "The LORD also spoke to Moses:";
csb[2] = "&quot;Look, I have appointed by name Bezalel son of Uri, son of Hur, of the tribe of Judah.";
csb[3] = "&quot;I have filled him with God\'s Spirit, with wisdom, understanding, and ability in every craft";
csb[4] = "&quot;to design artistic works in gold, silver, and bronze,";
csb[5] = "&quot;to cut gemstones for mounting, and to carve wood for work in every craft.";
csb[6] = "&quot;I have also selected Oholiab son of Ahisamach, of the tribe of Dan, to be with him. I have put wisdom in the heart of every skilled artisan in order to make all that I have commanded you:";
csb[7] = "&quot;the tent of meeting, the ark of the testimony, the mercy seat that is on top of it, and all the other furnishings of the tent --";
csb[8] = "&quot;the table with its utensils, the pure gold lampstand with all its utensils, the altar of incense,";
csb[9] = "&quot;the altar of burnt offering with all its utensils, the basin with its stand --";
csb[10] = "&quot;the specially woven garments, both the holy garments for the priest Aaron and the garments for his sons to serve as priests,";
csb[11] = "&quot;the anointing oil, and the fragrant incense for the sanctuary. They must make them according to all that I have commanded you.&quot;";
csb[12] = "The LORD said to Moses:";
csb[13] = "&quot;Tell the Israelites: You must observe my Sabbaths, for it is a sign between me and you throughout your generations, so that you will know that I am the LORD who consecrates you.";
csb[14] = "&quot;Observe the Sabbath, for it is holy to you. Whoever profanes it must be put to death. If anyone does work on it, that person must be cut off from his people.";
csb[15] = "&quot;Work may be done for six days, but on the seventh day there must be a Sabbath of complete rest, holy to the LORD. Anyone who does work on the Sabbath day must be put to death.";
csb[16] = "&quot;The Israelites must observe the Sabbath, celebrating it throughout their generations as a permanent covenant.";
csb[17] = "&quot;It is a sign forever between me and the Israelites, for in six days the LORD made the heavens and the earth, but on the seventh day he rested and was refreshed.&quot;";
csb[18] = "When he finished speaking with Moses on Mount Sinai, he gave him the two tablets of the testimony, stone tablets inscribed by the finger of God.";
