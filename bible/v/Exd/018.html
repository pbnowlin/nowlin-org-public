csb[1] = "Moses\'s father-in-law Jethro, the priest of Midian, heard about everything that God had done for Moses and for God\'s people Israel when the LORD brought Israel out of Egypt.";
csb[2] = "Now Jethro, Moses\'s father-in-law, had taken in Zipporah, Moses\'s wife, after he had sent her back,";
csb[3] = "along with her two sons, one of whom was named Gershom (because Moses had said, &quot;I have been a resident alien in a foreign land&quot;)";
csb[4] = "and the other Eliezer (because he had said, &quot;The God of my father was my helper and rescued me from Pharaoh\'s sword&quot;).";
csb[5] = "Moses\'s father-in-law Jethro, along with Moses\'s wife and sons, came to him in the wilderness where he was camped at the mountain of God.";
csb[6] = "He sent word to Moses, &quot;I, your father-in-law Jethro, am coming to you with your wife and her two sons.&quot;";
csb[7] = "So Moses went out to meet his father-in-law, bowed down, and then kissed him. They asked each other how they had been and went into the tent.";
csb[8] = "Moses recounted to his father-in-law all that the LORD had done to Pharaoh and the Egyptians for Israel\'s sake, all the hardships that confronted them on the way, and how the LORD rescued them.";
csb[9] = "Jethro rejoiced over all the good things the LORD had done for Israel when he rescued them from the power of the Egyptians.";
csb[10] = "&quot;Blessed be the LORD,&quot; Jethro exclaimed, &quot;who rescued you from the power of Egypt and from the power of Pharaoh. He has rescued the people from under the power of Egypt!";
csb[11] = "&quot;Now I know that the LORD is greater than all gods, because he did wonders when the Egyptians acted arrogantly against Israel.&quot;";
csb[12] = "Then Jethro, Moses\'s father-in-law, brought a burnt offering and sacrifices to God, and Aaron came with all the elders of Israel to eat a meal with Moses\'s father-in-law in God\'s presence.";
csb[13] = "The next day Moses sat down to judge the people, and they stood around Moses from morning until evening.";
csb[14] = "When Moses\'s father-in-law saw everything he was doing for them he asked, &quot;What is this thing you\'re doing for the people? Why are you alone sitting as judge, while all the people stand around you from morning until evening? &quot;";
csb[15] = "Moses replied to his father-in-law, &quot;Because the people come to me to inquire of God.";
csb[16] = "&quot;Whenever they have a dispute, it comes to me, and I make a decision between one man and another. I teach them God\'s statutes and laws.&quot;";
csb[17] = "&quot;What you\'re doing is not good,&quot; Moses\'s father-in-law said to him.";
csb[18] = "&quot;You will certainly wear out both yourself and these people who are with you, because the task is too heavy for you. You can\'t do it alone.";
csb[19] = "&quot;Now listen to me; I will give you some advice, and God be with you. You be the one to represent the people before God and bring their cases to him.";
csb[20] = "&quot;Instruct them about the statutes and laws, and teach them the way to live and what they must do.";
csb[21] = "&quot;But you should select from all the people able men, God-fearing, trustworthy, and hating dishonest profit. Place them over the people as commanders of thousands, hundreds, fifties, and tens.";
csb[22] = "&quot;They should judge the people at all times. Then they can bring you every major case but judge every minor case themselves. In this way you will lighten your load, and they will bear it with you.";
csb[23] = "&quot;If you do this, and God so directs you, you will be able to endure, and also all these people will be able to go home satisfied.&quot;";
csb[24] = "Moses listened to his father-in-law and did everything he said.";
csb[25] = "So Moses chose able men from all Israel and made them leaders over the people as commanders of thousands, hundreds, fifties, and tens.";
csb[26] = "They judged the people at all times; they would bring the hard cases to Moses, but they would judge every minor case themselves.";
csb[27] = "Moses let his father-in-law go, and he journeyed to his own land.";
