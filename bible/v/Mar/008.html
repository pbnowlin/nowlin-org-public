csb[1] = "In those days there was again a large crowd, and they had nothing to eat. He called the disciples and said to them,";
csb[2] = "&quot;I have compassion on the crowd, because they\'ve already stayed with me three days and have nothing to eat.";
csb[3] = "&quot;If I send them home hungry, they will collapse on the way, and some of them have come a long distance.&quot;";
csb[4] = "His disciples answered him, &quot;Where can anyone get enough bread here in this desolate place to feed these people? &quot;";
csb[5] = "&quot;How many loaves do you have? &quot; he asked them. &quot;Seven,&quot; they said.";
csb[6] = "He commanded the crowd to sit down on the ground. Taking the seven loaves, he gave thanks, broke them, and gave them to his disciples to set before the people. So they served them to the crowd.";
csb[7] = "They also had a few small fish, and after he had blessed them, he said these were to be served as well.";
csb[8] = "They ate and were satisfied. Then they collected seven large baskets of leftover pieces.";
csb[9] = "About four thousand were there. He dismissed them.";
csb[10] = "And he immediately got into the boat with his disciples and went to the district of Dalmanutha.";
csb[11] = "The Pharisees came and began to argue with him, demanding of him a sign from heaven to test him.";
csb[12] = "Sighing deeply in his spirit, he said, &quot;Why does this generation demand a sign? Truly I tell you, no sign will be given to this generation.&quot;";
csb[13] = "Then he left them, got back into the boat, and went to the other side.";
csb[14] = "The disciples had forgotten to take bread and had only one loaf with them in the boat.";
csb[15] = "Then he gave them strict orders: &quot;Watch out! Beware of the leaven of the Pharisees and the leaven of Herod.&quot;";
csb[16] = "They were discussing among themselves that they did not have any bread.";
csb[17] = "Aware of this, he said to them, &quot;Why are you discussing the fact you have no bread? Don\'t you understand or comprehend? Do you have hardened hearts?";
csb[18] = "&quot;Do you have eyes and not see; do you have ears and not hear? And do you not remember?";
csb[19] = "&quot;When I broke the five loaves for the five thousand, how many baskets full of leftovers did you collect? &quot; &quot;Twelve,&quot; they told him.";
csb[20] = "&quot;When I broke the seven loaves for the four thousand, how many baskets full of pieces did you collect? &quot; &quot;Seven,&quot; they said.";
csb[21] = "And he said to them, &quot;Don\'t you understand yet? &quot;";
csb[22] = "They came to Bethsaida. They brought a blind man to him and begged him to touch him.";
csb[23] = "He took the blind man by the hand and brought him out of the village. Spitting on his eyes and laying his hands on him, he asked him, &quot;Do you see anything? &quot;";
csb[24] = "He looked up and said, &quot;I see people -- they look like trees walking.&quot;";
csb[25] = "Again Jesus placed his hands on the man\'s eyes. The man looked intently and his sight was restored and he saw everything clearly.";
csb[26] = "Then he sent him home, saying, &quot;Don\'t even go into the village.&quot;";
csb[27] = "Jesus went out with his disciples to the villages of Caesarea Philippi. And on the road he asked his disciples, &quot;Who do people say that I am? &quot;";
csb[28] = "They answered him, &quot;John the Baptist; others, Elijah; still others, one of the prophets.&quot;";
csb[29] = "&quot;But you,&quot; he asked them, &quot;who do you say that I am? &quot; Peter answered him, &quot;You are the Messiah.&quot;";
csb[30] = "And he strictly warned them to tell no one about him.";
csb[31] = "Then he began to teach them that it was necessary for the Son of Man to suffer many things and be rejected by the elders, chief priests, and scribes, be killed, and rise after three days.";
csb[32] = "He spoke openly about this. Peter took him aside and began to rebuke him.";
csb[33] = "But turning around and looking at his disciples, he rebuked Peter and said, &quot;Get behind me, Satan! You are not thinking about God\'s concerns but human concerns.&quot;";
csb[34] = "Calling the crowd along with his disciples, he said to them, &quot;If anyone wants to follow after me, let him deny himself, take up his cross, and follow me.";
csb[35] = "&quot;For whoever wants to save his life will lose it, but whoever loses his life because of me and the gospel will save it.";
csb[36] = "&quot;For what does it benefit someone to gain the whole world and yet lose his life?";
csb[37] = "&quot;What can anyone give in exchange for his life?";
csb[38] = "&quot;For whoever is ashamed of me and my words in this adulterous and sinful generation, the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.&quot;";
