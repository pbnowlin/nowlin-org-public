csb[1] = "He set out from there and went to the region of Judea and across the Jordan. Then crowds converged on him again, and as was his custom he taught them again.";
csb[2] = "Some Pharisees came to test him, asking, &quot;Is it lawful for a man to divorce his wife? &quot;";
csb[3] = "He replied to them, &quot;What did Moses command you? &quot;";
csb[4] = "They said, &quot;Moses permitted us to write divorce papers and send her away.&quot;";
csb[5] = "But Jesus told them, &quot;He wrote this command for you because of the hardness of your hearts.";
csb[6] = "&quot;But from the beginning of creation God made them male and female.";
csb[7] = "&quot;For this reason a man will leave his father and mother";
csb[8] = "&quot;and the two will become one flesh. So they are no longer two, but one flesh.";
csb[9] = "&quot;Therefore what God has joined together, let no one separate.&quot;";
csb[10] = "When they were in the house again, the disciples questioned him about this matter.";
csb[11] = "He said to them, &quot;Whoever divorces his wife and marries another commits adultery against her.";
csb[12] = "&quot;Also, if she divorces her husband and marries another, she commits adultery.&quot;";
csb[13] = "People were bringing little children to him in order that he might touch them, but the disciples rebuked them.";
csb[14] = "When Jesus saw it, he was indignant and said to them, &quot;Let the little children come to me. Don\'t stop them, because the kingdom of God belongs to such as these.";
csb[15] = "&quot;Truly I tell you, whoever does not receive the kingdom of God like a little child will never enter it.&quot;";
csb[16] = "After taking them in his arms, he laid his hands on them and blessed them.";
csb[17] = "As he was setting out on a journey, a man ran up, knelt down before him, and asked him, &quot;Good teacher, what must I do to inherit eternal life? &quot;";
csb[18] = "&quot;Why do you call me good? &quot; Jesus asked him. &quot;No one is good except God alone.";
csb[19] = "&quot;You know the commandments: Do not murder; do not commit adultery; do not steal; do not bear false witness; do not defraud; honor your father and mother.&quot;";
csb[20] = "He said to him, &quot;Teacher, I have kept all these from my youth.&quot;";
csb[21] = "Looking at him, Jesus loved him and said to him, &quot;You lack one thing: Go, sell all you have and give to the poor, and you will have treasure in heaven. Then come, follow me.&quot;";
csb[22] = "But he was dismayed by this demand, and he went away grieving, because he had many possessions.";
csb[23] = "Jesus looked around and said to his disciples, &quot;How hard it is for those who have wealth to enter the kingdom of God! &quot;";
csb[24] = "The disciples were astonished at his words. Again Jesus said to them, &quot;Children, how hard it is to enter the kingdom of God!";
csb[25] = "&quot;It is easier for a camel to go through the eye of a needle than for a rich person to enter the kingdom of God.&quot;";
csb[26] = "They were even more astonished, saying to one another, &quot;Then who can be saved? &quot;";
csb[27] = "Looking at them, Jesus said, &quot;With man it is impossible, but not with God, because all things are possible with God.&quot;";
csb[28] = "Peter began to tell him, &quot;Look, we have left everything and followed you.&quot;";
csb[29] = "&quot;Truly I tell you,&quot; Jesus said, &quot;there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,";
csb[30] = "&quot;who will not receive a hundred times more, now at this time -- houses, brothers and sisters, mothers and children, and fields, with persecutions -- and eternal life in the age to come.";
csb[31] = "&quot;But many who are first will be last, and the last first.&quot;";
csb[32] = "They were on the road, going up to Jerusalem, and Jesus was walking ahead of them. The disciples were astonished, but those who followed him were afraid. Taking the Twelve aside again, he began to tell them the things that would happen to him.";
csb[33] = "&quot;See, we are going up to Jerusalem. The Son of Man will be handed over to the chief priests and the scribes, and they will condemn him to death. Then they will hand him over to the Gentiles,";
csb[34] = "&quot;and they will mock him, spit on him, flog him, and kill him, and he will rise after three days.&quot;";
csb[35] = "James and John, the sons of Zebedee, approached him and said, &quot;Teacher, we want you to do whatever we ask you.&quot;";
csb[36] = "&quot;What do you want me to do for you? &quot; he asked them.";
csb[37] = "They answered him, &quot;Allow us to sit at your right and at your left in your glory.&quot;";
csb[38] = "Jesus said to them, &quot;You don\'t know what you\'re asking. Are you able to drink the cup I drink or to be baptized with the baptism I am baptized with? &quot;";
csb[39] = "&quot;We are able,&quot; they told him. Jesus said to them, &quot;You will drink the cup I drink, and you will be baptized with the baptism I am baptized with.";
csb[40] = "&quot;But to sit at my right or left is not mine to give; instead, it is for those for whom it has been prepared.&quot;";
csb[41] = "When the ten disciples heard this, they began to be indignant with James and John.";
csb[42] = "Jesus called them over and said to them, &quot;You know that those who are regarded as rulers of the Gentiles lord it over them, and those in high positions act as tyrants over them.";
csb[43] = "&quot;But it is not so among you. On the contrary, whoever wants to become great among you will be your servant,";
csb[44] = "&quot;and whoever wants to be first among you will be a slave to all.";
csb[45] = "&quot;For even the Son of Man did not come to be served, but to serve, and to give his life as a ransom for many.&quot;";
csb[46] = "They came to Jericho. And as he was leaving Jericho with his disciples and a large crowd, Bartimaeus (the son of Timaeus), a blind beggar, was sitting by the road.";
csb[47] = "When he heard that it was Jesus of Nazareth, he began to cry out, &quot;Jesus, Son of David, have mercy on me! &quot;";
csb[48] = "Many warned him to keep quiet, but he was crying out all the more, &quot;Have mercy on me, Son of David! &quot;";
csb[49] = "Jesus stopped and said, &quot;Call him.&quot; So they called the blind man and said to him, &quot;Have courage! Get up; he\'s calling for you.&quot;";
csb[50] = "He threw off his coat, jumped up, and came to Jesus.";
csb[51] = "Then Jesus answered him, &quot;What do you want me to do for you? &quot; &quot;Rabboni,&quot; the blind man said to him, &quot;I want to see.&quot;";
csb[52] = "Jesus said to him, &quot;Go, your faith has saved you.&quot; Immediately he could see and began to follow Jesus on the road.";
