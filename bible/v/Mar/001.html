csb[1] = "The beginning of the gospel of Jesus Christ, the Son of God.";
csb[2] = "As it is written in Isaiah the prophet: See, I am sending my messenger ahead of you; he will prepare your way.";
csb[3] = "A voice of one crying out in the wilderness: Prepare the way for the Lord; make his paths straight!";
csb[4] = "John came baptizing in the wilderness and proclaiming a baptism of repentance for the forgiveness of sins.";
csb[5] = "The whole Judean countryside and all the people of Jerusalem were going out to him, and they were baptized by him in the Jordan River, confessing their sins.";
csb[6] = "John wore a camel-hair garment with a leather belt around his waist and ate locusts and wild honey.";
csb[7] = "He proclaimed, &quot;One who is more powerful than I am is coming after me. I am not worthy to stoop down and untie the strap of his sandals.";
csb[8] = "&quot;I baptize you with water, but he will baptize you with the Holy Spirit.&quot;";
csb[9] = "In those days Jesus came from Nazareth in Galilee and was baptized in the Jordan by John.";
csb[10] = "As soon as he came up out of the water, he saw the heavens being torn open and the Spirit descending on him like a dove.";
csb[11] = "And a voice came from heaven: &quot;You are my beloved Son; with you I am well-pleased.&quot;";
csb[12] = "Immediately the Spirit drove him into the wilderness.";
csb[13] = "He was in the wilderness forty days, being tempted by Satan. He was with the wild animals, and the angels were serving him.";
csb[14] = "After John was arrested, Jesus went to Galilee, proclaiming the good news of God:";
csb[15] = "&quot;The time is fulfilled, and the kingdom of God has come near. Repent and believe the good news! &quot;";
csb[16] = "As he passed alongside the Sea of Galilee, he saw Simon and Andrew, Simon\'s brother, casting a net into the sea -- for they were fishermen.";
csb[17] = "&quot;Follow me,&quot; Jesus told them, &quot;and I will make you fish for people.&quot;";
csb[18] = "Immediately they left their nets and followed him.";
csb[19] = "Going on a little farther, he saw James the son of Zebedee and his brother John in a boat putting their nets in order.";
csb[20] = "Immediately he called them, and they left their father Zebedee in the boat with the hired men and followed him.";
csb[21] = "They went into Capernaum, and right away he entered the synagogue on the Sabbath and began to teach.";
csb[22] = "They were astonished at his teaching because he was teaching them as one who had authority, and not like the scribes.";
csb[23] = "Just then a man with an unclean spirit was in their synagogue. He cried out,&#x2009;";
csb[24] = "&quot;What do you have to do with us, Jesus of Nazareth? Have you come to destroy us? I know who you are -- the Holy One of God! &quot;";
csb[25] = "Jesus rebuked him saying, &quot;Be silent, and come out of him! &quot;";
csb[26] = "And the unclean spirit threw him into convulsions, shouted with a loud voice, and came out of him.";
csb[27] = "They were all amazed, and so they began to ask each other: &quot;What is this? A new teaching with authority! He commands even the unclean spirits, and they obey him.&quot;";
csb[28] = "At once the news about him spread throughout the entire vicinity of Galilee.";
csb[29] = "As soon as they left the synagogue, they went into Simon and Andrew\'s house with James and John.";
csb[30] = "Simon\'s mother-in-law was lying in bed with a fever, and they told him about her at once.";
csb[31] = "So he went to her, took her by the hand, and raised her up. The fever left her, and she began to serve them.";
csb[32] = "When evening came, after the sun had set, they brought to him all those who were sick and demon-possessed.";
csb[33] = "The whole town was assembled at the door,";
csb[34] = "and he healed many who were sick with various diseases and drove out many demons. And he would not permit the demons to speak, because they knew him.";
csb[35] = "Very early in the morning, while it was still dark, he got up, went out, and made his way to a deserted place; and there he was praying.";
csb[36] = "Simon and his companions searched for him,";
csb[37] = "and when they found him they said, &quot;Everyone is looking for you.&quot;";
csb[38] = "And he said to them, &quot;Let\'s go on to the neighboring villages so that I may preach there too. This is why I have come.&quot;";
csb[39] = "He went into all of Galilee, preaching in their synagogues and driving out demons.";
csb[40] = "Then a man with leprosy came to him and, on his knees, begged him: &quot;If you are willing, you can make me clean.&quot;";
csb[41] = "Moved with compassion, Jesus reached out his hand and touched him. &quot;I am willing,&quot; he told him. &quot;Be made clean.&quot;";
csb[42] = "Immediately the leprosy left him, and he was made clean.";
csb[43] = "Then he sternly warned him and sent him away at once,";
csb[44] = "telling him, &quot;See that you say nothing to anyone; but go and show yourself to the priest, and offer what Moses commanded for your cleansing, as a testimony to them.&quot;";
csb[45] = "Yet he went out and began to proclaim it widely and to spread the news, with the result that Jesus could no longer enter a town openly. But he was out in deserted places, and they came to him from everywhere.";
