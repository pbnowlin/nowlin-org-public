csb[1] = "Then he said to them, &quot;Truly I tell you, there are some standing here who will not taste death until they see the kingdom of God come in power.&quot;";
csb[2] = "After six days Jesus took Peter, James, and John and led them up a high mountain by themselves to be alone. He was transfigured in front of them,";
csb[3] = "and his clothes became dazzling -- extremely white as no launderer on earth could whiten them.";
csb[4] = "Elijah appeared to them with Moses, and they were talking with Jesus.";
csb[5] = "Peter said to Jesus, &quot;Rabbi, it\'s good for us to be here. Let us set up three shelters: one for you, one for Moses, and one for Elijah&quot; --";

csb[7] = "A cloud appeared, overshadowing them, and a voice came from the cloud: &quot;This is my beloved Son; listen to him! &quot;";
csb[8] = "Suddenly, looking around, they no longer saw anyone with them except Jesus.";
csb[9] = "As they were coming down the mountain, he ordered them to tell no one what they had seen until the Son of Man had risen from the dead.";
csb[10] = "They kept this word to themselves, questioning what &quot;rising from the dead&quot; meant.";
csb[11] = "Then they asked him, &quot;Why do the scribes say that Elijah must come first? &quot;";
csb[12] = "&quot;Elijah does come first and restores all things,&quot; he replied. &quot;Why then is it written that the Son of Man must suffer many things and be treated with contempt?";
csb[13] = "&quot;But I tell you that Elijah has come, and they did whatever they pleased to him, just as it is written about him.&quot;";
csb[14] = "When they came to the disciples, they saw a large crowd around them and scribes disputing with them.";
csb[15] = "When the whole crowd saw him, they were amazed and ran to greet him.";
csb[16] = "He asked them, &quot;What are you arguing with them about? &quot;";
csb[17] = "Someone from the crowd answered him, &quot;Teacher, I brought my son to you. He has a spirit that makes him unable to speak.";
csb[18] = "&quot;Whenever it seizes him, it throws him down, and he foams at the mouth, grinds his teeth, and becomes rigid. I asked your disciples to drive it out, but they couldn\'t.&quot;";
csb[19] = "He replied to them, &quot;You unbelieving generation, how long will I be with you? How long must I put up with you? Bring him to me.&quot;";
csb[20] = "So they brought the boy to him. When the spirit saw him, it immediately threw the boy into convulsions. He fell to the ground and rolled around, foaming at the mouth.";
csb[21] = "&quot;How long has this been happening to him? &quot; Jesus asked his father. &quot;From childhood,&quot; he said.";
csb[22] = "&quot;And many times it has thrown him into fire or water to destroy him. But if you can do anything, have compassion on us and help us.&quot;";
csb[23] = "Jesus said to him, &quot; \'If you can\'? Everything is possible for the one who believes.&quot;";
csb[24] = "Immediately the father of the boy cried out, &quot;I do believe; help my unbelief! &quot;";
csb[25] = "When Jesus saw that a crowd was quickly gathering, he rebuked the unclean spirit, saying to it, &quot;You mute and deaf spirit, I command you: Come out of him and never enter him again.&quot;";
csb[26] = "Then it came out, shrieking and throwing him into terrible convulsions. The boy became like a corpse, so that many said, &quot;He\'s dead.&quot;";
csb[27] = "But Jesus, taking him by the hand, raised him, and he stood up.";
csb[28] = "After he had gone into the house, his disciples asked him privately, &quot;Why couldn\'t we drive it out? &quot;";
csb[29] = "And he told them, &quot;This kind can come out by nothing but prayer.&quot;";
csb[30] = "Then they left that place and made their way through Galilee, but he did not want anyone to know it.";
csb[31] = "For he was teaching his disciples and telling them, &quot;The Son of Man is going to be betrayed into the hands of men. They will kill him, and after he is killed, he will rise three days later.&quot;";
csb[32] = "But they did not understand this statement, and they were afraid to ask him.";
csb[33] = "They came to Capernaum. When he was in the house, he asked them, &quot;What were you arguing about on the way? &quot;";
csb[34] = "But they were silent, because on the way they had been arguing with one another about who was the greatest.";
csb[35] = "Sitting down, he called the Twelve and said to them, &quot;If anyone wants to be first, he must be last and servant of all.&quot;";
csb[36] = "He took a child, had him stand among them, and taking him in his arms, he said to them,";
csb[37] = "&quot;Whoever welcomes one little child such as this in my name welcomes me. And whoever welcomes me does not welcome me, but him who sent me.&quot;";
csb[38] = "John said to him, &quot;Teacher, we saw someone driving out demons in your name, and we tried to stop him because he wasn\'t following us.&quot;";
csb[39] = "&quot;Don\'t stop him,&quot; said Jesus, &quot;because there is no one who will perform a miracle in my name who can soon afterward speak evil of me.";
csb[40] = "&quot;For whoever is not against us is for us.";
csb[41] = "&quot;And whoever gives you a cup of water to drink in my name, because you belong to Christ -- truly I tell you, he will never lose his reward.";
csb[42] = "&quot;But whoever causes one of these little ones who believe in me to fall away -- it would be better for him if a heavy millstone were hung around his neck and he were thrown into the sea.";
csb[43] = "&quot;And if your hand causes you to fall away, cut it off. It is better for you to enter life maimed than to have two hands and go to hell, the unquenchable fire.";
csb[44] = " ";
csb[45] = "&quot;And if your foot causes you to fall away, cut it off. It is better for you to enter life lame than to have two feet and be thrown into hell.";
csb[46] = " ";
csb[47] = "&quot;And if your eye causes you to fall away, gouge it out. It is better for you to enter the kingdom of God with one eye than to have two eyes and be thrown into hell,";
csb[48] = "&quot;where their worm does not die, and the fire is not quenched.";
csb[49] = "&quot;For everyone will be salted with fire.";
csb[50] = "&quot;Salt is good, but if the salt should lose its flavor, how can you season it? Have salt among yourselves, and be at peace with one another.&quot;";
