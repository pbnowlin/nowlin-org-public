csb[1] = "They came to the other side of the sea, to the region of the Gerasenes.";
csb[2] = "As soon as he got out of the boat, a man with an unclean spirit came out of the tombs and met him.";
csb[3] = "He lived in the tombs, and no one was able to restrain him anymore -- not even with a chain --";
csb[4] = "because he often had been bound with shackles and chains, but had torn the chains apart and smashed the shackles. No one was strong enough to subdue him.";
csb[5] = "Night and day among the tombs and on the mountains, he was always crying out and cutting himself with stones.";
csb[6] = "When he saw Jesus from a distance, he ran and knelt down before him.";
csb[7] = "And he cried out with a loud voice, &quot;What do you have to do with me, Jesus, Son of the Most High God? I beg you before God, don\'t torment me! &quot;";
csb[8] = "For he had told him, &quot;Come out of the man, you unclean spirit! &quot;";
csb[9] = "&quot;What is your name? &quot; he asked him. &quot;My name is Legion,&quot; he answered him, &quot;because we are many.&quot;";
csb[10] = "And he begged him earnestly not to send them out of the region.";
csb[11] = "A large herd of pigs was there, feeding on the hillside.";
csb[12] = "The demons begged him, &quot;Send us to the pigs, so that we may enter them.&quot;";
csb[13] = "So he gave them permission, and the unclean spirits came out and entered the pigs. The herd of about two thousand rushed down the steep bank into the sea and drowned there.";
csb[14] = "The men who tended them ran off and reported it in the town and the countryside, and people went to see what had happened.";
csb[15] = "They came to Jesus and saw the man who had been demon-possessed, sitting there, dressed and in his right mind; and they were afraid.";
csb[16] = "Those who had seen it described to them what had happened to the demon-possessed man and told about the pigs.";
csb[17] = "Then they began to beg him to leave their region.";
csb[18] = "As he was getting into the boat, the man who had been demon-possessed begged him earnestly that he might remain with him.";
csb[19] = "Jesus did not let him but told him, &quot;Go home to your own people, and report to them how much the Lord has done for you and how he has had mercy on you.&quot;";
csb[20] = "So he went out and began to proclaim in the Decapolis how much Jesus had done for him, and they were all amazed.";
csb[21] = "When Jesus had crossed over again by boat to the other side, a large crowd gathered around him while he was by the sea.";
csb[22] = "One of the synagogue leaders, named Jairus, came, and when he saw Jesus, he fell at his feet";
csb[23] = "and begged him earnestly, &quot;My little daughter is dying. Come and lay your hands on her so that she can get well and live.&quot;";
csb[24] = "So Jesus went with him, and a large crowd was following and pressing against him.";
csb[25] = "Now a woman suffering from bleeding for twelve years";
csb[26] = "had endured much under many doctors. She had spent everything she had and was not helped at all. On the contrary, she became worse.";
csb[27] = "Having heard about Jesus, she came up behind him in the crowd and touched his clothing.";
csb[28] = "For she said, &quot;If I just touch his clothes, I\'ll be made well.&quot;";
csb[29] = "Instantly her flow of blood ceased, and she sensed in her body that she was healed of her affliction.";
csb[30] = "At once Jesus realized in himself that power had gone out from him. He turned around in the crowd and said, &quot;Who touched my clothes? &quot;";
csb[31] = "His disciples said to him, &quot;You see the crowd pressing against you, and yet you say, \'Who touched me? \' &quot;";
csb[32] = "But he was looking around to see who had done this.";
csb[33] = "The woman, with fear and trembling, knowing what had happened to her, came and fell down before him, and told him the whole truth.";
csb[34] = "&quot;Daughter,&quot; he said to her, &quot;your faith has saved you. Go in peace and be healed from your affliction.&quot;";
csb[35] = "While he was still speaking, people came from the synagogue leader\'s house and said, &quot;Your daughter is dead. Why bother the teacher anymore? &quot;";
csb[36] = "When Jesus overheard what was said, he told the synagogue leader, &quot;Don\'t be afraid. Only believe.&quot;";
csb[37] = "He did not let anyone accompany him except Peter, James, and John, James\'s brother.";
csb[38] = "They came to the leader\'s house, and he saw a commotion -- people weeping and wailing loudly.";
csb[39] = "He went in and said to them, &quot;Why are you making a commotion and weeping? The child is not dead but asleep.&quot;";
csb[40] = "They laughed at him, but he put them all outside. He took the child\'s father, mother, and those who were with him, and entered the place where the child was.";
csb[41] = "Then he took the child by the hand and said to her, &quot;Talitha koum&quot; (which is translated, &quot;Little girl, I say to you, get up&quot;).";
csb[42] = "Immediately the girl got up and began to walk. (She was twelve years old.) At this they were utterly astounded.";
csb[43] = "Then he gave them strict orders that no one should know about this and told them to give her something to eat.";
