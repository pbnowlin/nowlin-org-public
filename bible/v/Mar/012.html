csb[1] = "He began to speak to them in parables: &quot;A man planted a vineyard, put a fence around it, dug out a pit for a winepress, and built a watchtower. Then he leased it to tenant farmers and went away.";
csb[2] = "&quot;At harvest time he sent a servant to the farmers to collect some of the fruit of the vineyard from them.";
csb[3] = "&quot;But they took him, beat him, and sent him away empty-handed.";
csb[4] = "&quot;Again he sent another servant to them, and they hit him on the head and treated him shamefully.";
csb[5] = "&quot;Then he sent another, and they killed that one. He also sent many others; some they beat, and others they killed.";
csb[6] = "&quot;He still had one to send, a beloved son. Finally he sent him to them, saying, \'They will respect my son.\'";
csb[7] = "&quot;But those tenant farmers said to one another, \'This is the heir. Come, let\'s kill him, and the inheritance will be ours.\'";
csb[8] = "&quot;So they seized him, killed him, and threw him out of the vineyard.";
csb[9] = "&quot;What then will the owner of the vineyard do? He will come and kill the farmers and give the vineyard to others.";
csb[10] = "&quot;Haven\'t you read this Scripture: The stone that the builders rejected has become the cornerstone.";
csb[11] = "&quot;This came about from the Lord and is wonderful in our eyes? &quot;";
csb[12] = "They were looking for a way to arrest him but feared the crowd because they knew he had spoken this parable against them. So they left him and went away.";
csb[13] = "Then they sent some of the Pharisees and the Herodians to Jesus to trap him in his words.";
csb[14] = "When they came, they said to him, &quot;Teacher, we know you are truthful and don\'t care what anyone thinks, nor do you show partiality but teach the way of God truthfully. Is it lawful to pay taxes to Caesar or not? Should we pay or shouldn\'t we? &quot;";
csb[15] = "But knowing their hypocrisy, he said to them, &quot;Why are you testing me? Bring me a denarius to look at.&quot;";
csb[16] = "They brought a coin. &quot;Whose image and inscription is this? &quot; he asked them. &quot;Caesar\'s,&quot; they replied.";
csb[17] = "Jesus told them, &quot;Give to Caesar the things that are Caesar\'s, and to God the things that are God\'s.&quot; And they were utterly amazed at him.";
csb[18] = "Sadducees, who say there is no resurrection, came to him and questioned him:";
csb[19] = "&quot;Teacher, Moses wrote for us that if a man\'s brother dies, leaving a wife behind but no child, that man should take the wife and raise up offspring for his brother.";
csb[20] = "&quot;There were seven brothers. The first married a woman, and dying, left no offspring.";
csb[21] = "&quot;The second also took her, and he died, leaving no offspring. And the third likewise.";
csb[22] = "&quot;None of the seven left offspring. Last of all, the woman died too.";
csb[23] = "&quot;In the resurrection, when they rise, whose wife will she be, since the seven had married her? &quot;";
csb[24] = "Jesus spoke to them, &quot;Isn\'t this the reason why you\'re mistaken: you don\'t know the Scriptures or the power of God?";
csb[25] = "&quot;For when they rise from the dead, they neither marry nor are given in marriage but are like angels in heaven.";
csb[26] = "&quot;And as for the dead being raised -- haven\'t you read in the book of Moses, in the passage about the burning bush, how God said to him: I am the God of Abraham and the God of Isaac and the God of Jacob?";
csb[27] = "&quot;He is not the God of the dead but of the living. You are badly mistaken.&quot;";
csb[28] = "One of the scribes approached. When he heard them debating and saw that Jesus answered them well, he asked him, &quot;Which command is the most important of all? &quot;&#x2009;";
csb[29] = "Jesus answered, &quot;The most important is Listen, O Israel! The Lord our God, the Lord is one.";
csb[30] = "&quot;Love the Lord your God with all your heart, with all your soul, with all your mind, and with all your strength.";
csb[31] = "&quot;The second is, Love your neighbor as yourself. There is no other command greater than these.&quot;";
csb[32] = "Then the scribe said to him, &quot;You are right, teacher. You have correctly said that he is one, and there is no one else except him.";
csb[33] = "&quot;And to love him with all your heart, with all your understanding, and with all your strength, and to love your neighbor as yourself, is far more important than all the burnt offerings and sacrifices.&quot;";
csb[34] = "When Jesus saw that he answered wisely, he said to him, &quot;You are not far from the kingdom of God.&quot; And no one dared to question him any longer.";
csb[35] = "While Jesus was teaching in the temple, he asked, &quot;How can the scribes say that the Messiah is the son of David?";
csb[36] = "&quot;David himself says by the Holy Spirit: The Lord declared to my Lord, \'Sit at my right hand until I put your enemies under your feet.\'";
csb[37] = "&quot;David himself calls him \'Lord\'; how then can he be his son? &quot; And the large crowd was listening to him with delight.";
csb[38] = "He also said in his teaching, &quot;Beware of the scribes, who want to go around in long robes and who want greetings in the marketplaces,";
csb[39] = "&quot;the best seats in the synagogues, and the places of honor at banquets.";
csb[40] = "&quot;They devour widows\' houses and say long prayers just for show. These will receive harsher judgment.&quot;";
csb[41] = "Sitting across from the temple treasury, he watched how the crowd dropped money into the treasury. Many rich people were putting in large sums.";
csb[42] = "Then a poor widow came and dropped in two tiny coins worth very little.";
csb[43] = "Summoning his disciples, he said to them, &quot;Truly I tell you, this poor widow has put more into the treasury than all the others.";
csb[44] = "&quot;For they all gave out of their surplus, but she out of her poverty has put in everything she had -- all she had to live on.&quot;";
