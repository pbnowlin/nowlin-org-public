csb[1] = "Jesus entered the synagogue again, and a man was there who had a shriveled hand.";
csb[2] = "In order to accuse him, they were watching him closely to see whether he would heal him on the Sabbath.";
csb[3] = "He told the man with the shriveled hand, &quot;Stand before us.&quot;";
csb[4] = "Then he said to them, &quot;Is it lawful to do good on the Sabbath or to do evil, to save life or to kill? &quot; But they were silent.";
csb[5] = "After looking around at them with anger, he was grieved at the hardness of their hearts and told the man, &quot;Stretch out your hand.&quot; So he stretched it out, and his hand was restored.";
csb[6] = "Immediately the Pharisees went out and started plotting with the Herodians against him, how they might kill him.";
csb[7] = "Jesus departed with his disciples to the sea, and a large crowd followed from Galilee, and a large crowd followed from Judea,";
csb[8] = "Jerusalem, Idumea, beyond the Jordan, and around Tyre and Sidon. The large crowd came to him because they heard about everything he was doing.";
csb[9] = "Then he told his disciples to have a small boat ready for him, so that the crowd wouldn\'t crush him.";
csb[10] = "Since he had healed many, all who had diseases were pressing toward him to touch him.";
csb[11] = "Whenever the unclean spirits saw him, they fell down before him and cried out, &quot;You are the Son of God! &quot;";
csb[12] = "And he would strongly warn them not to make him known.";
csb[13] = "Jesus went up the mountain and summoned those he wanted, and they came to him.";
csb[14] = "He appointed twelve, whom he also named apostles, to be with him, to send them out to preach,";
csb[15] = "and to have authority to drive out demons.";
csb[16] = "He appointed the Twelve: To Simon, he gave the name Peter;";
csb[17] = "and to James the son of Zebedee, and to his brother John, he gave the name &quot;Boanerges&quot; (that is, &quot;Sons of Thunder&quot;);";
csb[18] = "Andrew; Philip and Bartholomew; Matthew and Thomas; James the son of Alphaeus, and Thaddaeus; Simon the Zealot,";
csb[19] = "and Judas Iscariot, who also betrayed him.";
csb[20] = "Jesus entered a house, and the crowd gathered again so that they were not even able to eat.";
csb[21] = "When his family heard this, they set out to restrain him, because they said, &quot;He\'s out of his mind.&quot;";
csb[22] = "The scribes who had come down from Jerusalem said, &quot;He is possessed by Beelzebul,&quot; and, &quot;He drives out demons by the ruler of the demons.&quot;";
csb[23] = "So he summoned them and spoke to them in parables: &quot;How can Satan drive out Satan?";
csb[24] = "&quot;If a kingdom is divided against itself, that kingdom cannot stand.";
csb[25] = "&quot;If a house is divided against itself, that house cannot stand.";
csb[26] = "&quot;And if Satan opposes himself and is divided, he cannot stand but is finished.";
csb[27] = "&quot;But no one can enter a strong man\'s house and plunder his possessions unless he first ties up the strong man. Then he can plunder his house.";
csb[28] = "&quot;Truly I tell you, people will be forgiven for all sins and whatever blasphemies they utter.";
csb[29] = "&quot;But whoever blasphemes against the Holy Spirit never has forgiveness, but is guilty of an eternal sin&quot; --";
csb[30] = "because they were saying, &quot;He has an unclean spirit.&quot;";
csb[31] = "His mother and his brothers came, and standing outside, they sent word to him and called him.";
csb[32] = "A crowd was sitting around him and told him, &quot;Look, your mother, your brothers, and your sisters are outside asking for you.&quot;";
csb[33] = "He replied to them, &quot;Who are my mother and my brothers? &quot;";
csb[34] = "Looking at those sitting in a circle around him, he said, &quot;Here are my mother and my brothers!";
csb[35] = "&quot;Whoever does the will of God is my brother and sister and mother.&quot;";
