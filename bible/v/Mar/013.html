csb[1] = "As he was going out of the temple, one of his disciples said to him, &quot;Teacher, look! What massive stones! What impressive buildings! &quot;";
csb[2] = "Jesus said to him, &quot;Do you see these great buildings? Not one stone will be left upon another -- all will be thrown down.&quot;";
csb[3] = "While he was sitting on the Mount of Olives across from the temple, Peter, James, John, and Andrew asked him privately,";
csb[4] = "&quot;Tell us, when will these things happen? And what will be the sign when all these things are about to be accomplished? &quot;";
csb[5] = "Jesus told them, &quot;Watch out that no one deceives you.";
csb[6] = "&quot;Many will come in my name, saying, \'I am he,\' and they will deceive many.";
csb[7] = "&quot;When you hear of wars and rumors of wars, don\'t be alarmed; these things must take place, but it is not yet the end.";
csb[8] = "&quot;For nation will rise up against nation, and kingdom against kingdom. There will be earthquakes in various places, and famines. These are the beginning of birth pains.";
csb[9] = "&quot;But you, be on your guard! They will hand you over to local courts, and you will be flogged in the synagogues. You will stand before governors and kings because of me, as a witness to them.";
csb[10] = "&quot;And it is necessary that the gospel be preached to all nations.";
csb[11] = "&quot;So when they arrest you and hand you over, don\'t worry beforehand what you will say, but say whatever is given to you at that time, for it isn\'t you speaking, but the Holy Spirit.";
csb[12] = "&quot;Brother will betray brother to death, and a father his child. Children will rise up against parents and have them put to death.";
csb[13] = "&quot;You will be hated by everyone because of my name, but the one who endures to the end will be saved.";
csb[14] = "&quot;When you see the abomination of desolation standing where it should not be&quot; (let the reader understand), &quot;then those in Judea must flee to the mountains.";
csb[15] = "&quot;A man on the housetop must not come down or go in to get anything out of his house,";
csb[16] = "&quot;and a man in the field must not go back to get his coat.";
csb[17] = "&quot;Woe to pregnant women and nursing mothers in those days!";
csb[18] = "&quot;Pray it won\'t happen in winter.";
csb[19] = "&quot;For those will be days of tribulation, the kind that hasn\'t been from the beginning of creation until now and never will be again.";
csb[20] = "&quot;If the Lord had not cut those days short, no one would be saved. But he cut those days short for the sake of the elect, whom he chose.";
csb[21] = "&quot;Then if anyone tells you, \'See, here is the Messiah! See, there! \' do not believe it.";
csb[22] = "&quot;For false messiahs and false prophets will arise and will perform signs and wonders to lead astray, if possible, the elect.";
csb[23] = "&quot;And you must watch! I have told you everything in advance.";
csb[24] = "&quot;But in those days, after that tribulation: The sun will be darkened, and the moon will not shed its light;";
csb[25] = "&quot;the stars will be falling from the sky, and the powers in the heavens will be shaken.";
csb[26] = "&quot;Then they will see the Son of Man coming in clouds with great power and glory.";
csb[27] = "&quot;He will send out the angels and gather his elect from the four winds, from the ends of the earth to the ends of heaven.";
csb[28] = "&quot;Learn this lesson from the fig tree: As soon as its branch becomes tender and sprouts leaves, you know that summer is near.";
csb[29] = "&quot;In the same way, when you see these things happening, recognize that he is near -- at the door.";
csb[30] = "&quot;Truly I tell you, this generation will certainly not pass away until all these things take place.";
csb[31] = "&quot;Heaven and earth will pass away, but my words will never pass away.";
csb[32] = "&quot;Now concerning that day or hour no one knows -- neither the angels in heaven nor the Son -- but only the Father.";
csb[33] = "&quot;Watch! Be alert! For you don\'t know when the time is coming.";
csb[34] = "&quot;It is like a man on a journey, who left his house, gave authority to his servants, gave each one his work, and commanded the doorkeeper to be alert.";
csb[35] = "&quot;Therefore be alert, since you don\'t know when the master of the house is coming -- whether in the evening or at midnight or at the crowing of the rooster or early in the morning.";
csb[36] = "&quot;Otherwise, when he comes suddenly he might find you sleeping.";
csb[37] = "&quot;And what I say to you, I say to everyone: Be alert! &quot;";

rsv[22] = "False Christs and false prophets will arise and show signs and wonders, to lead astray, if possible, the elect.";
asv[22] = "for there shall arise false Christs and false prophets, and shall show signs and wonders, that they may lead astray, if possible, the elect.";
yng[22] = "for there shall rise false Christs and false prophets, and they shall give signs and wonders, to seduce, if possible, also the chosen;";
dby[22] = "For false Christs and false prophets will arise, and give signs and wonders to deceive, if possible, even the elect.";
web[22] = "For false Christs, and false prophets will rise, and will show signs and wonders, to seduce, if [it were] possible, even the elect.";
hnv[22] = "For there will arise false messiahs and false prophets, and will show signs and wonders, that they may lead astray, if possible, even the chosen ones.";
vul[22] = "exsurgent enim pseudochristi et pseudoprophetae et dabunt signa et portenta ad seducendos si potest fieri etiam electos";
kjv[23] = "But take ye heed: behold, I have foretold you all things.";
rsv[23] = "But take heed; I have told you all things beforehand.";
asv[23] = "But take ye heed: behold, I have told you all things beforehand.";
yng[23] = "and ye, take heed; lo, I have foretold you all things.";
dby[23] = "But do *ye* take heed: behold, I have told you all things beforehand.";
web[23] = "But take ye heed: behold, I have foretold you all things.";
hnv[23] = "But you watch. &quot;Behold, I have told you all things beforehand.";
vul[23] = "vos ergo videte ecce praedixi vobis omnia";
kjv[24] = "But in those days, after that tribulation, the sun shall be darkened, and the moon shall not give her light,";
rsv[24] = "&quot;But in those days, after that tribulation, the sun will be darkened, and the moon will not give its light,";
asv[24] = "But in those days, after that tribulation, the sun shall be darkened, and the moon shall not give her light,";
yng[24] = "`But in those days, after that tribulation, the sun shall be darkened, and the moon shall not give her light,";
dby[24] = "But in those days, after that distress, the sun shall be darkened and the moon shall not give its light;";
web[24] = "But in those days, after that tribulation, the sun shall be darkened, and the moon shall not give her light,";
hnv[24] = "But in those days, after that oppression, the sun will be darkened, the moon will not give its light,";
vul[24] = "sed in illis diebus post tribulationem illam sol contenebrabitur et luna non dabit splendorem suum";
kjv[25] = "And the stars of heaven shall fall, and the powers that are in heaven shall be shaken.";
rsv[25] = "and the stars will be falling from heaven, and the powers in the heavens will be shaken.";
asv[25] = "and the stars shall be falling from heaven, and the powers that are in the heavens shall be shaken.";
yng[25] = "and the stars of the heaven shall be falling, and the powers that are in the heavens shall be shaken.";
dby[25] = "and the stars of heaven shall be falling down, and the powers which are in the heavens shall be shaken;";
web[25] = "And the stars of heaven shall fall, and the powers that are in heaven shall be shaken.";
hnv[25] = "the stars will be falling from the sky, and the powers that are in the heavens will be shaken.";
vul[25] = "et erunt stellae caeli decidentes et virtutes quae sunt in caelis movebuntur";
kjv[26] = "And then shall they see the Son of man coming in the clouds with great power and glory.";
rsv[26] = "And then they will see the Son of man coming in clouds with great power and glory.";
asv[26] = "And then shall they see the Son of man coming in clouds with great power and glory.";
yng[26] = "`And then they shall see the Son of Man coming in clouds with much power and glory,";
dby[26] = "and then shall they see the Son of man coming in clouds with great power and glory;";
web[26] = "And then they shall see the Son of man coming in the clouds with great power and glory.";
hnv[26] = "Then they will see the Son of Man coming in clouds with great power and glory.";
vul[26] = "et tunc videbunt Filium hominis venientem in nubibus cum virtute multa et gloria";
kjv[27] = "And then shall he send his angels, and shall gather together his elect from the four winds, from the uttermost part of the earth to the uttermost part of heaven.";
rsv[27] = "And then he will send out the angels, and gather his elect from the four winds, from the ends of the earth to the ends of heaven.";
asv[27] = "And then shall he send forth the angels, and shall gather together his elect from the four winds, from the uttermost part of the earth to the uttermost part of heaven.";
yng[27] = "and then he shall send his messengers, and gather together his chosen from the four winds, from the end of the earth unto the end of heaven.";
dby[27] = "and then shall he send his angels and shall gather together his elect from the four winds, from end of earth to end of heaven.";
web[27] = "And then he will send his angels, and will assemble his elect from the four winds, from the uttermost part of the earth to the uttermost part of heaven.";
hnv[27] = "Then he will send out his angels, and will gather together his elect from the four winds, from the ends of the eretz to the ends of the sky.";
vul[27] = "et tunc mittet angelos suos et congregabit electos suos a quattuor ventis a summo terrae usque ad summum caeli";
kjv[28] = "Now learn a parable of the fig tree; When her branch is yet tender, and putteth forth leaves, ye know that summer is near:";
rsv[28] = "&quot;From the fig tree learn its lesson: as soon as its branch becomes tender and puts forth its leaves, you know that summer is near.";
asv[28] = "Now from the fig tree learn her parable: when her branch is now become tender, and putteth forth its leaves, ye know that the summer is nigh;";
yng[28] = "`And from the fig-tree learn ye the simile: when the branch may already become tender, and may put forth the leaves, ye know that nigh is the summer;";
dby[28] = "But learn the parable from the fig-tree: when its branch already becomes tender and puts forth the leaves, ye know that the summer is near.";
web[28] = "Now learn a parable of the fig-tree: When its branch is yet tender, and putteth forth leaves, ye know that summer is near:";
hnv[28] = "&quot;Now from the fig tree, learn this parable. When the branch has now become tender, and puts forth its leaves, you know that the summer is near;";
vul[28] = "a ficu autem discite parabolam cum iam ramus eius tener fuerit et nata fuerint folia cognoscitis quia in proximo sit aestas";
kjv[29] = "So ye in like manner, when ye shall see these things come to pass, know that it is nigh, [even] at the doors.";
rsv[29] = "So also, when you see these things taking place, you know that he is near, at the very gates.";
asv[29] = "even so ye also, when ye see these things coming to pass, know ye that he is nigh, [even] at the doors.";
yng[29] = "so ye, also, when these ye may see coming to pass, ye know that it is nigh, at the doors.";
dby[29] = "Thus also *ye*, when ye see these things happening, know that it is near, at the doors.";
web[29] = "So ye in like manner, when ye shall see these things come to pass, know that it is nigh, [even] at the doors.";
hnv[29] = "even so you also, when you see these things coming to pass, know that it is near, at the doors.";
vul[29] = "sic et vos cum videritis haec fieri scitote quod in proximo sit in ostiis";
kjv[30] = "Verily I say unto you, that this generation shall not pass, till all these things be done.";
rsv[30] = "Truly, I say to you, this generation will not pass away before all these things take place.";
asv[30] = "Verily I say unto you, This generation shall not pass away, until all these things be accomplished.";
yng[30] = "Verily I say to you, that this generation may not pass away till all these things may come to pass;";
dby[30] = "Verily I say unto you, This generation shall in no wise pass away, till all these things take place.";
web[30] = "Verily I say to you, that this generation shall not pass, till all these things shall be done.";
hnv[30] = "Most assuredly I say to you, this generation will not pass away until all these things happen.";
vul[30] = "amen dico vobis quoniam non transiet generatio haec donec omnia ista fiant";
kjv[31] = "Heaven and earth shall pass away: but my words shall not pass away.";
rsv[31] = "Heaven and earth will pass away, but my words will not pass away.";
asv[31] = "Heaven and earth shall pass away: but my words shall not pass away.";
yng[31] = "the heaven and the earth shall pass away, but my words shall not pass away.";
dby[31] = "The heaven and the earth shall pass away, but my words shall in no wise pass away.";
web[31] = "Heaven and earth shall pass away: but my words shall not pass away.";
hnv[31] = "Heaven and eretz will pass away, but my words will not pass away.";
vul[31] = "caelum et terra transibunt verba autem mea non transibunt";
kjv[32] = "But of that day and [that] hour knoweth no man, no, not the angels which are in heaven, neither the Son, but the Father.";
rsv[32] = "&quot;But of that day or that hour no one knows, not even the angels in heaven, nor the Son, but only the Father.";
asv[32] = "But of that day or that hour knoweth no one, not even the angels in heaven, neither the Son, but the Father.";
yng[32] = "`And concerning that day and the hour no one hath known -- not even the messengers who are in the heaven, not even the Son -- except the Father.";
dby[32] = "But of that day or of that hour no one knows, neither the angels who are in heaven, nor the Son, but the Father.";
web[32] = "But of that day and [that] hour knoweth no man, no not the angels which are in heaven, neither the Son, but the Father.";
hnv[32] = "But of that day or that hour no one knows, not even the angels in heaven, nor the Son, but only the Father.";
vul[32] = "de die autem illo vel hora nemo scit neque angeli in caelo neque Filius nisi Pater";
kjv[33] = "Take ye heed, watch and pray: for ye know not when the time is.";
rsv[33] = "Take heed, watch; for you do not know when the time will come.";
asv[33] = "Take ye heed, watch and pray: for ye know not when the time is.";
yng[33] = "Take heed, watch and pray, for ye have not known when the time is;";
dby[33] = "Take heed, watch and pray, for ye do not know when the time is:";
web[33] = "Take ye heed, watch and pray: for ye know not when the time is.";
hnv[33] = "Watch, keep alert, and pray; for you don\'t know when the time is.";
vul[33] = "videte vigilate et orate nescitis enim quando tempus sit";
kjv[34] = "[For the Son of man is] as a man taking a far journey, who left his house, and gave authority to his servants, and to every man his work, and commanded the porter to watch.";
rsv[34] = "It is like a man going on a journey, when he leaves home and puts his servants in charge, each with his work, and commands the doorkeeper to be on the watch.";
asv[34] = "[It is] as [when] a man, sojourning in another country, having left his house, and given authority to his servants, to each one his work, commanded also the porter to watch.";
yng[34] = "as a man who is gone abroad, having left his house, and given to his servants the authority, and to each one his work, did command also the porter that he may watch;";
dby[34] = "[it is] as a man gone out of the country, having left his house and given to his bondmen the authority, and to each one his work, and commanded the doorkeeper that he should watch.";
web[34] = "[For the son of man is] as a man taking a long journey, who left his house, and gave authority to his servants, and to every man his work; and commanded the porter to watch.";
hnv[34] = "&quot;It is like a man, traveling to another country, having left his house, and given authority to his servants, and to each one his work, and also commanded the doorkeeper to keep watch.";
vul[34] = "sicut homo qui peregre profectus reliquit domum suam et dedit servis suis potestatem cuiusque operis et ianitori praecipiat ut vigilet";
kjv[35] = "Watch ye therefore: for ye know not when the master of the house cometh, at even, or at midnight, or at the cockcrowing, or in the morning:";
rsv[35] = "Watch therefore--for you do not know when the master of the house will come, in the evening, or at midnight, or at cockcrow, or in the morning--";
asv[35] = "Watch therefore: for ye know not when the lord of the house cometh, whether at even, or at midnight, or at cockcrowing, or in the morning;";
yng[35] = "watch ye, therefore, for ye have not known when the lord of the house doth come, at even, or at midnight, or at cock-crowing, or at the morning;";
dby[35] = "Watch therefore, for ye do not know when the master of the house comes: evening, or midnight, or cock-crow, or morning;";
web[35] = "Watch ye therefore: for ye know not when the master of the house cometh, at evening, or at midnight, or at the cock-crowing, or in the morning:";
hnv[35] = "Watch therefore, for you don\'t know when the lord of the house is coming, whether at evening, or at midnight, or when the rooster crows, or in the morning;";
vul[35] = "vigilate ergo nescitis enim quando dominus domus veniat sero an media nocte an galli cantu an mane";
kjv[36] = "Lest coming suddenly he find you sleeping.";
rsv[36] = "lest he come suddenly and find you asleep.";
asv[36] = "lest coming suddenly he find you sleeping.";
yng[36] = "lest, having come suddenly, he may find you sleeping;";
dby[36] = "lest coming suddenly he find you sleeping.";
web[36] = "Lest coming suddenly, he should find you sleeping.";
hnv[36] = "lest coming suddenly he might find you sleeping.";
vul[36] = "ne cum venerit repente inveniat vos dormientes";
kjv[37] = "And what I say unto you I say unto all, Watch.";
rsv[37] = "And what I say to you I say to all: Watch.&quot;";
asv[37] = "And what I say unto you I say unto all, Watch.";
yng[37] = "and what I say to you, I say to all, Watch.\'";
dby[37] = "But what I say to you, I say to all, Watch.";
web[37] = "And what I say to you, I say to all, Watch.";
hnv[37] = "What I tell you, I tell all: Watch.&quot;";
vul[37] = "quod autem vobis dico omnibus dico vigilate";
