csb[1] = "He left there and came to his hometown, and his disciples followed him.";
csb[2] = "When the Sabbath came, he began to teach in the synagogue, and many who heard him were astonished. &quot;Where did this man get these things? &quot; they said. &quot;What is this wisdom that has been given to him, and how are these miracles performed by his hands?";
csb[3] = "&quot;Isn\'t this the carpenter, the son of Mary, and the brother of James, Joses, Judas, and Simon? And aren\'t his sisters here with us? &quot; So they were offended by him.";
csb[4] = "Jesus said to them, &quot;A prophet is not without honor except in his hometown, among his relatives, and in his household.&quot;";
csb[5] = "He was not able to do a miracle there, except that he laid his hands on a few sick people and healed them.";
csb[6] = "And he was amazed at their unbelief. He was going around the villages teaching.";
csb[7] = "He summoned the Twelve and began to send them out in pairs and gave them authority over unclean spirits.";
csb[8] = "He instructed them to take nothing for the road except a staff -- no bread, no traveling bag, no money in their belts,";
csb[9] = "but to wear sandals and not put on an extra shirt.";
csb[10] = "He said to them, &quot;Whenever you enter a house, stay there until you leave that place.";
csb[11] = "&quot;If any place does not welcome you or listen to you, when you leave there, shake the dust off your feet as a testimony against them.&quot;";
csb[12] = "So they went out and preached that people should repent.";
csb[13] = "They drove out many demons, anointed many sick people with oil and healed them.";
csb[14] = "King Herod heard about it, because Jesus\'s name had become well known. Some said, &quot;John the Baptist has been raised from the dead, and that\'s why miraculous powers are at work in him.&quot;";
csb[15] = "But others said, &quot;He\'s Elijah.&quot; Still others said, &quot;He\'s a prophet, like one of the prophets from long ago.&quot;";
csb[16] = "When Herod heard of it, he said, &quot;John, the one I beheaded, has been raised! &quot;";
csb[17] = "For Herod himself had given orders to arrest John and to chain him in prison on account of Herodias, his brother Philip\'s wife, because he had married her.";
csb[18] = "John had been telling Herod, &quot;It is not lawful for you to have your brother\'s wife.&quot;";
csb[19] = "So Herodias held a grudge against him and wanted to kill him. But she could not,";
csb[20] = "because Herod feared John and protected him, knowing he was a righteous and holy man. When Herod heard him he would be very perplexed, and yet he liked to listen to him.";
csb[21] = "An opportune time came on his birthday, when Herod gave a banquet for his nobles, military commanders, and the leading men of Galilee.";
csb[22] = "When Herodias\'s own daughter came in and danced, she pleased Herod and his guests. The king said to the girl, &quot;Ask me whatever you want, and I\'ll give it to you.&quot;";
csb[23] = "He promised her with an oath: &quot;Whatever you ask me I will give you, up to half my kingdom.&quot;";
csb[24] = "She went out and said to her mother, &quot;What should I ask for? &quot; &quot;John the Baptist\'s head,&quot; she said.";
csb[25] = "At once she hurried to the king and said, &quot;I want you to give me John the Baptist\'s head on a platter immediately.&quot;";
csb[26] = "Although the king was deeply distressed, because of his oaths and the guests he did not want to refuse her.";
csb[27] = "The king immediately sent for an executioner and commanded him to bring John\'s head. So he went and beheaded him in prison,";
csb[28] = "brought his head on a platter, and gave it to the girl. Then the girl gave it to her mother.";
csb[29] = "When John\'s disciples heard about it, they came and removed his corpse and placed it in a tomb.";
csb[30] = "The apostles gathered around Jesus and reported to him all that they had done and taught.";
csb[31] = "He said to them, &quot;Come away by yourselves to a remote place and rest for a while.&quot; For many people were coming and going, and they did not even have time to eat.";
csb[32] = "So they went away in the boat by themselves to a remote place,";
csb[33] = "but many saw them leaving and recognized them, and they ran on foot from all the towns and arrived ahead of them.";
csb[34] = "When he went ashore, he saw a large crowd and had compassion on them, because they were like sheep without a shepherd. Then he began to teach them many things.";
csb[35] = "When it grew late, his disciples approached him and said, &quot;This place is deserted, and it is already late.";
csb[36] = "&quot;Send them away so that they can go into the surrounding countryside and villages to buy themselves something to eat.&quot;";
csb[37] = "&quot;You give them something to eat,&quot; he responded. They said to him, &quot;Should we go and buy two hundred denarii worth of bread and give them something to eat? &quot;";
csb[38] = "He asked them, &quot;How many loaves do you have? Go and see.&quot; When they found out they said, &quot;Five, and two fish.&quot;";
csb[39] = "Then he instructed them to have all the people sit down in groups on the green grass.";
csb[40] = "So they sat down in groups of hundreds and fifties.";
csb[41] = "He took the five loaves and the two fish, and looking up to heaven, he blessed and broke the loaves. He kept giving them to his disciples to set before the people. He also divided the two fish among them all.";
csb[42] = "Everyone ate and was satisfied.";
csb[43] = "They picked up twelve baskets full of pieces of bread and fish.";
csb[44] = "Now those who had eaten the loaves were five thousand men.";
csb[45] = "Immediately he made his disciples get into the boat and go ahead of him to the other side, to Bethsaida, while he dismissed the crowd.";
csb[46] = "After he said good-bye to them, he went away to the mountain to pray.";
csb[47] = "Well into the night, the boat was in the middle of the sea, and he was alone on the land.";
csb[48] = "He saw them straining at the oars, because the wind was against them. Very early in the morning he came toward them walking on the sea and wanted to pass by them.";
csb[49] = "When they saw him walking on the sea, they thought it was a ghost and cried out,";
csb[50] = "because they all saw him and were terrified. Immediately he spoke with them and said, &quot;Have courage! It is I. Don\'t be afraid.&quot;";
csb[51] = "Then he got into the boat with them, and the wind ceased. They were completely astounded,";
csb[52] = "because they had not understood about the loaves. Instead, their hearts were hardened.";
csb[53] = "When they had crossed over, they came to shore at Gennesaret and anchored there.";
csb[54] = "As they got out of the boat, people immediately recognized him.";
csb[55] = "They hurried throughout that region and began to carry the sick on mats to wherever they heard he was.";
csb[56] = "Wherever he went, into villages, towns, or the country, they laid the sick in the marketplaces and begged him that they might touch just the end of his robe. And everyone who touched it was healed.";

yng[50] = "for they all saw him, and were troubled, and immediately he spake with them, and saith to them, `Take courage, I am [he], be not afraid.\'";
dby[50] = "For all saw him and were troubled. And immediately he spoke with them, and says to them, Be of good courage: it is *I*; be not afraid.";

hnv[51] = "He got into the boat with them; and the wind ceased, and they were very amazed among themselves, and marveled;";

kjv[56] = "And whithersoever he entered, into villages, or cities, or country, they laid the sick in the streets, and besought him that they might touch if it were but the border of his garment: and as many as touched him were made whole.";
rsv[56] = "And wherever he came, in villages, cities, or country, they laid the sick in the market places, and besought him that they might touch even the fringe of his garment; and as many as touched it were made well.";
asv[56] = "And wheresoever he entered, into villages, or into cities, or into the country, they laid the sick in the marketplaces, and besought him that they might touch if it were but the border of his garment: and as many as touched him were made whole.";
