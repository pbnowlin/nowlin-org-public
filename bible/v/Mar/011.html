csb[1] = "When they approached Jerusalem, at Bethphage and Bethany near the Mount of Olives, he sent two of his disciples";
csb[2] = "and told them, &quot;Go into the village ahead of you. As soon as you enter it, you will find a colt tied there, on which no one has ever sat. Untie it and bring it.";
csb[3] = "&quot;If anyone says to you, \'Why are you doing this? \' say, \'The Lord needs it and will send it back here right away.\' &quot;";
csb[4] = "So they went and found a colt outside in the street, tied by a door. They untied it,";
csb[5] = "and some of those standing there said to them, &quot;What are you doing, untying the colt? &quot;";
csb[6] = "They answered them just as Jesus had said; so they let them go.";
csb[7] = "They brought the donkey to Jesus and threw their clothes on it, and he sat on it.";
csb[8] = "Many people spread their clothes on the road, and others spread leafy branches cut from the fields.";
csb[9] = "Those who went ahead and those who followed shouted: Hosanna! Blessed is he who comes in the name of the Lord!";
csb[10] = "Blessed is the coming kingdom of our father David! Hosanna in the highest heaven!";
csb[11] = "He went into Jerusalem and into the temple. After looking around at everything, since it was already late, he went out to Bethany with the Twelve.";
csb[12] = "The next day when they went out from Bethany, he was hungry.";
csb[13] = "Seeing in the distance a fig tree with leaves, he went to find out if there was anything on it. When he came to it, he found nothing but leaves; for it was not the season for figs.";
csb[14] = "He said to it, &quot;May no one ever eat fruit from you again! &quot; And his disciples heard it.";
csb[15] = "They came to Jerusalem, and he went into the temple and began to throw out those buying and selling. He overturned the tables of the money changers and the chairs of those selling doves,";
csb[16] = "and would not permit anyone to carry goods through the temple.";
csb[17] = "He was teaching them: &quot;Is it not written, My house will be called a house of prayer for all nations? But you have made it a den of thieves! &quot;";
csb[18] = "The chief priests and the scribes heard it and started looking for a way to kill him. For they were afraid of him, because the whole crowd was astonished by his teaching.";
csb[19] = "Whenever evening came, they would go out of the city.";
csb[20] = "Early in the morning, as they were passing by, they saw the fig tree withered from the roots up.";
csb[21] = "Then Peter remembered and said to him, &quot;Rabbi, look! The fig tree that you cursed has withered.&quot;";
csb[22] = "Jesus replied to them, &quot;Have faith in God.";
csb[23] = "&quot;Truly I tell you, if anyone says to this mountain, \'Be lifted up and thrown into the sea,\' and does not doubt in his heart, but believes that what he says will happen, it will be done for him.";
csb[24] = "&quot;Therefore I tell you, everything you pray and ask for -- believe that you have received it and it will be yours.";
csb[25] = "&quot;And whenever you stand praying, if you have anything against anyone, forgive him, so that your Father in heaven will also forgive you your wrongdoing.&quot;";
csb[26] = " ";
csb[27] = "They came again to Jerusalem. As he was walking in the temple, the chief priests, the scribes, and the elders came";
csb[28] = "and asked him, &quot;By what authority are you doing these things? Who gave you this authority to do these things? &quot;";
csb[29] = "Jesus said to them, &quot;I will ask you one question; then answer me, and I will tell you by what authority I do these things.";
csb[30] = "&quot;Was John\'s baptism from heaven or of human origin? Answer me.&quot;";
csb[31] = "They discussed it among themselves: &quot;If we say, \'From heaven,\' he will say, \'Then why didn\'t you believe him? \'";
csb[32] = "&quot;But if we say, \'Of human origin\' &quot; -- they were afraid of the crowd, because everyone thought that John was truly a prophet.";
csb[33] = "So they answered Jesus, &quot;We don\'t know.&quot; And Jesus said to them, &quot;Neither will I tell you by what authority I do these things.&quot;";
