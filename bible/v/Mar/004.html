csb[1] = "Again he began to teach by the sea, and a very large crowd gathered around him. So he got into a boat on the sea and sat down, while the whole crowd was by the sea on the shore.";
csb[2] = "He taught them many things in parables, and in his teaching he said to them:";
csb[3] = "&quot;Listen! Consider the sower who went out to sow.";
csb[4] = "&quot;As he sowed, some seed fell along the path, and the birds came and devoured it.";
csb[5] = "&quot;Other seed fell on rocky ground where it didn\'t have much soil, and it grew up quickly, since the soil wasn\'t deep.";
csb[6] = "&quot;When the sun came up, it was scorched, and since it had no root, it withered away.";
csb[7] = "&quot;Other seed fell among thorns, and the thorns came up and choked it, and it didn\'t produce fruit.";
csb[8] = "&quot;Still other seed fell on good ground and it grew up, producing fruit that increased thirty, sixty, and a hundred times.&quot;";
csb[9] = "Then he said, &quot;Let anyone who has ears to hear listen.&quot;";
csb[10] = "When he was alone, those around him with the Twelve, asked him about the parables.";
csb[11] = "He answered them, &quot;The secret of the kingdom of God has been given to you, but to those outside, everything comes in parables";
csb[12] = "&quot;so that they may indeed look, and yet not perceive; they may indeed listen, and yet not understand; otherwise, they might turn back and be forgiven.&quot;";
csb[13] = "Then he said to them: &quot;Don\'t you understand this parable? How then will you understand all of the parables?";
csb[14] = "&quot;The sower sows the word.";
csb[15] = "&quot;Some are like the word sown on the path. When they hear, immediately Satan comes and takes away the word sown in them.";
csb[16] = "&quot;And others are like seed sown on rocky ground. When they hear the word, immediately they receive it with joy.";
csb[17] = "&quot;But they have no root; they are short-lived. When distress or persecution comes because of the word, they immediately fall away.";
csb[18] = "&quot;Others are like seed sown among thorns; these are the ones who hear the word,";
csb[19] = "&quot;but the worries of this age, the deceitfulness of wealth, and the desires for other things enter in and choke the word, and it becomes unfruitful.";
csb[20] = "&quot;And those like seed sown on good ground hear the word, welcome it, and produce fruit thirty, sixty, and a hundred times what was sown.&quot;";
csb[21] = "He also said to them, &quot;Is a lamp brought in to be put under a basket or under a bed? Isn\'t it to be put on a lampstand?";
csb[22] = "&quot;For there is nothing hidden that will not be revealed, and nothing concealed that will not be brought to light.";
csb[23] = "&quot;If anyone has ears to hear, let him listen.&quot;";
csb[24] = "And he said to them, &quot;Pay attention to what you hear. By the measure you use, it will be measured to you -- and more will be added to you.";
csb[25] = "&quot;For whoever has, more will be given to him, and whoever does not have, even what he has will be taken away from him.&quot;";
csb[26] = "&quot;The kingdom of God is like this,&quot; he said. &quot;A man scatters seed on the ground.";
csb[27] = "&quot;He sleeps and rises night and day; the seed sprouts and grows, although he doesn\'t know how.";
csb[28] = "&quot;The soil produces a crop by itself -- first the blade, then the head, and then the full grain on the head.";
csb[29] = "&quot;As soon as the crop is ready, he sends for the sickle, because the harvest has come.&quot;";
csb[30] = "And he said, &quot;With what can we compare the kingdom of God, or what parable can we use to describe it?";
csb[31] = "&quot;It\'s like a mustard seed that, when sown upon the soil, is the smallest of all the seeds on the ground.";
csb[32] = "&quot;And when sown, it comes up and grows taller than all the garden plants, and produces large branches, so that the birds of the sky can nest in its shade.&quot;";
csb[33] = "He was speaking the word to them with many parables like these, as they were able to understand.";
csb[34] = "He did not speak to them without a parable. Privately, however, he explained everything to his own disciples.";
csb[35] = "On that day, when evening had come, he told them, &quot;Let\'s cross over to the other side of the sea.&quot;";
csb[36] = "So they left the crowd and took him along since he was in the boat. And other boats were with him.";
csb[37] = "A great windstorm arose, and the waves were breaking over the boat, so that the boat was already being swamped.";
csb[38] = "He was in the stern, sleeping on the cushion. So they woke him up and said to him, &quot;Teacher! Don\'t you care that we\'re going to die? &quot;";
csb[39] = "He got up, rebuked the wind, and said to the sea, &quot;Silence! Be still! &quot; The wind ceased, and there was a great calm.";
csb[40] = "Then he said to them, &quot;Why are you afraid? Do you still have no faith? &quot;";
csb[41] = "And they were terrified and asked one another, &quot;Who then is this? Even the wind and the sea obey him! &quot;";
kjv[1] = "And he began again to teach by the sea side: and there was gathered unto him a great multitude, so that he entered into a ship, and sat in the sea; and the whole multitude was by the sea on the land.";
kjv[2] = "And he taught them many things by parables, and said unto them in his doctrine,";
kjv[3] = "Hearken; Behold, there went out a sower to sow:";
kjv[4] = "And it came to pass, as he sowed, some fell by the way side, and the fowls of the air came and devoured it up.";
kjv[5] = "And some fell on stony ground, where it had not much earth; and immediately it sprang up, because it had no depth of earth:";
kjv[6] = "But when the sun was up, it was scorched; and because it had no root, it withered away.";
kjv[7] = "And some fell among thorns, and the thorns grew up, and choked it, and it yielded no fruit.";
kjv[8] = "And other fell on good ground, and did yield fruit that sprang up and increased; and brought forth, some thirty, and some sixty, and some an hundred.";
kjv[9] = "And he said unto them, He that hath ears to hear, let him hear.";
kjv[10] = "And when he was alone, they that were about him with the twelve asked of him the parable.";
kjv[11] = "And he said unto them, Unto you it is given to know the mystery of the kingdom of God: but unto them that are without, all [these] things are done in parables:";
kjv[12] = "That seeing they may see, and not perceive; and hearing they may hear, and not understand; lest at any time they should be converted, and [their] sins should be forgiven them.";
kjv[13] = "And he said unto them, Know ye not this parable? and how then will ye know all parables?";
kjv[14] = "The sower soweth the word.";
kjv[15] = "And these are they by the way side, where the word is sown; but when they have heard, Satan cometh immediately, and taketh away the word that was sown in their hearts.";
kjv[16] = "And these are they likewise which are sown on stony ground; who, when they have heard the word, immediately receive it with gladness;";
kjv[17] = "And have no root in themselves, and so endure but for a time: afterward, when affliction or persecution ariseth for the word\'s sake, immediately they are offended.";
kjv[18] = "And these are they which are sown among thorns; such as hear the word,";
kjv[19] = "And the cares of this world, and the deceitfulness of riches, and the lusts of other things entering in, choke the word, and it becometh unfruitful.";
kjv[20] = "And these are they which are sown on good ground; such as hear the word, and receive [it], and bring forth fruit, some thirtyfold, some sixty, and some an hundred.";
kjv[21] = "And he said unto them, Is a candle brought to be put under a bushel, or under a bed? and not to be set on a candlestick?";
kjv[22] = "For there is nothing hid, which shall not be manifested; neither was any thing kept secret, but that it should come abroad.";
kjv[23] = "If any man have ears to hear, let him hear.";
kjv[24] = "And he said unto them, Take heed what ye hear: with what measure ye mete, it shall be measured to you: and unto you that hear shall more be given.";
kjv[25] = "For he that hath, to him shall be given: and he that hath not, from him shall be taken even that which he hath.";
kjv[26] = "And he said, So is the kingdom of God, as if a man should cast seed into the ground;";
kjv[27] = "And should sleep, and rise night and day, and the seed should spring and grow up, he knoweth not how.";
kjv[28] = "For the earth bringeth forth fruit of herself; first the blade, then the ear, after that the full corn in the ear.";
kjv[29] = "But when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come.";
kjv[30] = "And he said, Whereunto shall we liken the kingdom of God? or with what comparison shall we compare it?";
kjv[31] = "[It is] like a grain of mustard seed, which, when it is sown in the earth, is less than all the seeds that be in the earth:";
kjv[32] = "But when it is sown, it groweth up, and becometh greater than all herbs, and shooteth out great branches; so that the fowls of the air may lodge under the shadow of it.";
kjv[33] = "And with many such parables spake he the word unto them, as they were able to hear [it].";
kjv[34] = "But without a parable spake he not unto them: and when they were alone, he expounded all things to his disciples.";
kjv[35] = "And the same day, when the even was come, he saith unto them, Let us pass over unto the other side.";
kjv[36] = "And when they had sent away the multitude, they took him even as he was in the ship. And there were also with him other little ships.";
kjv[37] = "And there arose a great storm of wind, and the waves beat into the ship, so that it was now full.";
kjv[38] = "And he was in the hinder part of the ship, asleep on a pillow: and they awake him, and say unto him, Master, carest thou not that we perish?";
kjv[39] = "And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.";
kjv[40] = "And he said unto them, Why are ye so fearful? how is it that ye have no faith?";
kjv[41] = "And they feared exceedingly, and said one to another, What manner of man is this, that even the wind and the sea obey him?";

dby[20] = "And these are they who have been sown on the good ground, such as hear the word and receive it, and bear fruit; one thirty, and one sixty, and one a hundred [fold].";
web[20] = "And these are they who are sown on good ground; such as hear the word, and receive [it], and bring forth fruit, some thirty-fold, some sixty, and some a hundred.";
hnv[20] = "These are those which were sown on the good ground: such as hear the word, and accept it, and bear fruit, some thirty times, some sixty times, and some one hundred times.&quot;";

rsv[21] = "And he said to them, &quot;Is a lamp brought in to be put under a bushel, or under a bed, and not on a stand?";
asv[21] = "And he said unto them, Is the lamp brought to be put under the bushel, or under the bed, [and] not to be put on the stand?";
yng[21] = "And he said to them, `Doth the lamp come that under the measure it may be put, or under the couch -- not that it may be put on the lamp-stand?";
dby[21] = "And he said to them, Does the lamp come that it should be put under the bushel or under the couch? [Is it] not that it should be set upon the lamp-stand?";
web[21] = "And he said to them, Is a candle brought to be put under a close vessel, or under a bed? and not to be set on a candlestick?";
hnv[21] = "He said to them, &quot;Is the lamp brought to be put under a basket or under a bed? Isn\'t it put on a menorah?";

rsv[22] = "For there is nothing hid, except to be made manifest; nor is anything secret, except to come to light.";
asv[22] = "For there is nothing hid, save that it should be manifested; neither was [anything] made secret, but that it should come to light.";
yng[22] = "for there is not anything hid that may not be manifested, nor was anything kept hid but that it may come to light.";
dby[22] = "For there is nothing hidden which shall not be made manifest; nor does any secret thing take place, but that it should come to light.";
web[22] = "For there is nothing hid, which shall not be manifested; neither hath any thing been kept secret, but that it should come abroad.";
hnv[22] = "For there is nothing hidden, except that it should be made known; neither was anything made secret, but that it should come to light.";
vul[22] = "non enim est aliquid absconditum quod non manifestetur nec factum est occultum sed ut in palam veniat";
rsv[23] = "If any man has ears to hear, let him hear.&quot;";
asv[23] = "If any man hath ears to hear, let him hear.";
yng[23] = "If any hath ears to hear -- let him hear.\'";
dby[23] = "If any one have ears to hear, let him hear.";
web[23] = "If any man hath ears to hear, let him hear.";
hnv[23] = "If any man has ears to hear, let him hear.&quot;";
vul[23] = "si quis habet aures audiendi audiat";
rsv[24] = "And he said to them, &quot;Take heed what you hear; the measure you give will be the measure you get, and still more will be given you.";
asv[24] = "And he said unto them, Take heed what ye hear: with what measure ye mete it shall be measured unto you; and more shall be given unto you.";
yng[24] = "And he said to them, `Take heed what ye hear; in what measure ye measure, it shall be measured to you; and to you who hear it shall be added;";
dby[24] = "And he said to them, Take heed what ye hear; with what measure ye mete, it shall be meted to you; and there shall be [more] added to you.";
web[24] = "And he said to them, Take heed what ye hear: With the measure which ye give, it shall be measured to you: and to you that hear shall more be given.";
hnv[24] = "He said to them, &quot;Take heed what you hear. With whatever measure you measure, it will be measured to you, and more will be given to you who hear.";
vul[24] = "et dicebat illis videte quid audiatis in qua mensura mensi fueritis remetietur vobis et adicietur vobis";
rsv[25] = "For to him who has will more be given; and from him who has not, even what he has will be taken away.&quot;";
asv[25] = "For he that hath, to him shall be given: and he that hath not, from him shall be taken away even that which he hath.";

dby[25] = "For whosoever has, to him shall be given; and he who has not, even what he has shall be taken from him.";
web[25] = "For he that hath, to him shall be given: and he that hath not, from him shall be taken even that which he hath.";
hnv[25] = "For whoever has, to him will more be given, and he who doesn\'t have, from him will be taken away even that which he has.&quot;";

dby[27] = "and should sleep and rise up night and day, and the seed should sprout and grow, he does not know how.";
web[27] = "And should sleep, and rise night and day, and the seed should spring and grow up, he knoweth not how.";
hnv[27] = "and should sleep and rise night and day, and the seed should spring up and grow, he doesn\'t know how.";

rsv[28] = "The earth produces of itself, first the blade, then the ear, then the full grain in the ear.";
asv[28] = "The earth beareth fruit of herself; first the blade, then the ear, then the full grain in the ear.";
yng[28] = "for of itself doth the earth bear fruit, first a blade, afterwards an ear, afterwards full corn in the ear;";
dby[28] = "The earth bears fruit of itself, first [the] blade, then an ear, then full corn in the ear.";
web[28] = "For the earth bringeth forth fruit of itself; first the blade, then the ear, after that the full corn in the ear.";

asv[29] = "But when the fruit is ripe, straightway he putteth forth the sickle, because the harvest is come.";

dby[29] = "But when the fruit is produced, immediately he sends the sickle, for the harvest is come.";

hnv[29] = "But when the fruit is ripe, immediately he puts forth the sickle, because the harvest has come.&quot;";

dby[30] = "And he said, How should we liken the kingdom of God, or with what comparison should we compare it?";
web[30] = "And he said, To what shall we liken the kingdom of God? or with what comparison shall we compare it?";
hnv[30] = "He said, &quot;How will we liken the Kingdom of God? Or with what parable will we illustrate it?";

rsv[31] = "It is like a grain of mustard seed, which, when sown upon the ground, is the smallest of all the seeds on earth;";
asv[31] = "It is like a grain of mustard seed, which, when it is sown upon the earth, though it be less than all the seeds that are upon the earth,";

dby[31] = "As to a grain of mustard [seed], which, when it is sown upon the earth, is less than all seeds which are upon the earth,";
web[31] = "[It is] like a grain of mustard-seed, which, when it is sown in the earth, is less than all the seeds that are in the earth.";

rsv[33] = "With many such parables he spoke the word to them, as they were able to hear it;";

yng[33] = "And with many such similes he was speaking to them the word, as they were able to hear,";
