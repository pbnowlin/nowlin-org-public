csb[1] = "As soon as it was morning, having held a meeting with the elders, scribes, and the whole Sanhedrin, the chief priests tied Jesus up, led him away, and handed him over to Pilate.";
csb[2] = "So Pilate asked him, &quot;Are you the King of the Jews? &quot; He answered him, &quot;You say so.&quot;";
csb[3] = "And the chief priests accused him of many things.";
csb[4] = "Pilate questioned him again, &quot;Aren\'t you going to answer? Look how many things they are accusing you of! &quot;";
csb[5] = "But Jesus still did not answer, and so Pilate was amazed.";
csb[6] = "At the festival Pilate used to release for the people a prisoner whom they requested.";
csb[7] = "There was one named Barabbas, who was in prison with rebels who had committed murder during the rebellion.";
csb[8] = "The crowd came up and began to ask Pilate to do for them as was his custom.";
csb[9] = "Pilate answered them, &quot;Do you want me to release the King of the Jews for you? &quot;";
csb[10] = "For he knew it was because of envy that the chief priests had handed him over.";
csb[11] = "But the chief priests stirred up the crowd so that he would release Barabbas to them instead.";
csb[12] = "Pilate asked them again, &quot;Then what do you want me to do with the one you call the King of the Jews? &quot;";
csb[13] = "Again they shouted, &quot;Crucify him! &quot;";
csb[14] = "Pilate said to them, &quot;Why? What has he done wrong? &quot; But they shouted all the more, &quot;Crucify him! &quot;";
csb[15] = "Wanting to satisfy the crowd, Pilate released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.";
csb[16] = "The soldiers led him away into the palace (that is, the governor\'s residence) and called the whole company together.";
csb[17] = "They dressed him in a purple robe, twisted together a crown of thorns, and put it on him.";
csb[18] = "And they began to salute him, &quot;Hail, King of the Jews! &quot;";
csb[19] = "They were hitting him on the head with a stick and spitting on him. Getting down on their knees, they were paying him homage.";
csb[20] = "After they had mocked him, they stripped him of the purple robe and put his clothes on him. They led him out to crucify him.";
csb[21] = "They forced a man coming in from the country, who was passing by, to carry Jesus\'s cross. He was Simon of Cyrene, the father of Alexander and Rufus.";
csb[22] = "They brought Jesus to the place called Golgotha (which means Place of the Skull).";
csb[23] = "They tried to give him wine mixed with myrrh, but he did not take it.";
csb[24] = "Then they crucified him and divided his clothes, casting lots for them to decide what each would get.";
csb[25] = "Now it was nine in the morning when they crucified him.";
csb[26] = "The inscription of the charge written against him was: THE KING OF THE JEWS.";
csb[27] = "They crucified two criminals with him, one on his right and one on his left.";
csb[28] = " ";
csb[29] = "Those who passed by were yelling insults at him, shaking their heads, and saying, &quot;Ha! The one who would destroy the temple and rebuild it in three days,";
csb[30] = "&quot;save yourself by coming down from the cross! &quot;";
csb[31] = "In the same way, the chief priests with the scribes were mocking him among themselves and saying, &quot;He saved others, but he cannot save himself!";
csb[32] = "&quot;Let the Messiah, the King of Israel, come down now from the cross, so that we may see and believe.&quot; Even those who were crucified with him taunted him.";
csb[33] = "When it was noon, darkness came over the whole land until three in the afternoon.";
csb[34] = "And at three Jesus cried out with a loud voice, &quot;Eloi, Eloi, lem sabachthni? &quot; which is translated, &quot;My God, my God, why have you abandoned me? &quot;";
csb[35] = "When some of those standing there heard this, they said, &quot;See, he\'s calling for Elijah.&quot;";
csb[36] = "Someone ran and filled a sponge with sour wine, fixed it on a stick, offered him a drink, and said, &quot;Let\'s see if Elijah comes to take him down.&quot;";
csb[37] = "Jesus let out a loud cry and breathed his last.";
csb[38] = "Then the curtain of the temple was torn in two from top to bottom.";
csb[39] = "When the centurion, who was standing opposite him, saw the way he breathed his last, he said, &quot;Truly this man was the Son of God! &quot;";
csb[40] = "There were also women watching from a distance. Among them were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome.";
csb[41] = "In Galilee these women followed him and took care of him. Many other women had come up with him to Jerusalem.";
csb[42] = "When it was already evening, because it was the day of preparation (that is, the day before the Sabbath),";
csb[43] = "Joseph of Arimathea, a prominent member of the Sanhedrin who was himself looking forward to the kingdom of God, came and boldly went to Pilate and asked for Jesus\'s body.";
csb[44] = "Pilate was surprised that he was already dead. Summoning the centurion, he asked him whether he had already died.";
csb[45] = "When he found out from the centurion, he gave the corpse to Joseph.";
csb[46] = "After he bought some linen cloth, Joseph took him down and wrapped him in the linen. Then he laid him in a tomb cut out of the rock and rolled a stone against the entrance to the tomb.";
csb[47] = "Mary Magdalene and Mary the mother of Joses were watching where he was laid.";
