csb[1] = "The Pharisees and some of the scribes who had come from Jerusalem gathered around him.";
csb[2] = "They observed that some of his disciples were eating bread with unclean -- that is, unwashed -- hands.";
csb[3] = "(For the Pharisees and all the Jews do not eat unless they give their hands a ceremonial washing, keeping the tradition of the elders.";
csb[4] = "When they come from the marketplace, they do not eat unless they have washed. And there are many other customs they have received and keep, like the washing of cups, pitchers, kettles, and dining couches.)";
csb[5] = "So the Pharisees and the scribes asked him, &quot;Why don\'t your disciples live according to the tradition of the elders, instead of eating bread with ceremonially unclean hands? &quot;";
csb[6] = "He answered them, &quot;Isaiah prophesied correctly about you hypocrites, as it is written: This people honors me with their lips, but their heart is far from me.";
csb[7] = "&quot;They worship me in vain, teaching as doctrines human commands.";
csb[8] = "&quot;Abandoning the command of God, you hold on to human tradition.&quot;";
csb[9] = "He also said to them, &quot;You have a fine way of invalidating God\'s command in order to set up your tradition!";
csb[10] = "&quot;For Moses said: Honor your father and your mother; and Whoever speaks evil of father or mother must be put to death.";
csb[11] = "&quot;But you say, \'If anyone tells his father or mother: Whatever benefit you might have received from me is corban\' &quot; (that is, an offering devoted to God),";
csb[12] = "&quot;you no longer let him do anything for his father or mother.";
csb[13] = "&quot;You nullify the word of God by your tradition that you have handed down. And you do many other similar things.&quot;";
csb[14] = "Summoning the crowd again, he told them, &quot;Listen to me, all of you, and understand:";
csb[15] = "&quot;Nothing that goes into a person from outside can defile him but the things that come out of a person are what defile him.&quot;";
csb[16] = " ";
csb[17] = "When he went into the house away from the crowd, his disciples asked him about the parable.";
csb[18] = "He said to them, &quot;Are you also as lacking in understanding? Don\'t you realize that nothing going into a person from the outside can defile him?";
csb[19] = "&quot;For it doesn\'t go into his heart but into the stomach and is eliminated&quot; (thus he declared all foods clean).";
csb[20] = "And he said, &quot;What comes out of a person is what defiles him.";
csb[21] = "&quot;For from within, out of people\'s hearts, come evil thoughts, sexual immoralities, thefts, murders,";
csb[22] = "&quot;adulteries, greed, evil actions, deceit, self-indulgence, envy, slander, pride, and foolishness.";
csb[23] = "&quot;All these evil things come from within and defile a person.&quot;";
csb[24] = "He got up and departed from there to the region of Tyre. He entered a house and did not want anyone to know it, but he could not escape notice.";
csb[25] = "Instead, immediately after hearing about him, a woman whose little daughter had an unclean spirit came and fell at his feet.";
csb[26] = "The woman was a Gentile, a Syrophoenician by birth, and she was asking him to cast the demon out of her daughter.";
csb[27] = "He said to her, &quot;Let the children be fed first, because it isn\'t right to take the children\'s bread and throw it to the dogs.&quot;";
csb[28] = "But she replied to him, &quot;Lord, even the dogs under the table eat the children\'s crumbs.&quot;";
csb[29] = "Then he told her, &quot;Because of this reply, you may go. The demon has left your daughter.&quot;";
csb[30] = "When she went back to her home, she found her child lying on the bed, and the demon was gone.";
csb[31] = "Again, leaving the region of Tyre, he went by way of Sidon to the Sea of Galilee, through the region of the Decapolis.";
csb[32] = "They brought to him a deaf man who had difficulty speaking and begged Jesus to lay his hand on him.";
csb[33] = "So he took him away from the crowd in private. After putting his fingers in the man\'s ears and spitting, he touched his tongue.";
csb[34] = "Looking up to heaven, he sighed deeply and said to him, &quot;Ephphatha! &quot; (that is, &quot;Be opened! &quot;).";
csb[35] = "Immediately his ears were opened, his tongue was loosened, and he began to speak clearly.";
csb[36] = "He ordered them to tell no one, but the more he ordered them, the more they proclaimed it.";
csb[37] = "They were extremely astonished and said, &quot;He has done everything well. He even makes the deaf hear and the mute speak.&quot;";
