csb[1] = "For you yourselves know, brothers and sisters, that our visit with you was not without result.";
csb[2] = "On the contrary, after we had previously suffered and were treated outrageously in Philippi, as you know, we were emboldened by our God to speak the gospel of God to you in spite of great opposition.";
csb[3] = "For our exhortation didn\'t come from error or impurity or an intent to deceive.";
csb[4] = "Instead, just as we have been approved by God to be entrusted with the gospel, so we speak, not to please people, but rather God, who examines our hearts.";
csb[5] = "For we never used flattering speech, as you know, or had greedy motives -- God is our witness --";
csb[6] = "and we didn\'t seek glory from people, either from you or from others.";
csb[7] = "Although we could have been a burden as Christ\'s apostles, instead we were gentle among you, as a nurse nurtures her own children.";
csb[8] = "We cared so much for you that we were pleased to share with you not only the gospel of God but also our own lives, because you had become dear to us.";
csb[9] = "For you remember our labor and hardship, brothers and sisters. Working night and day so that we would not burden any of you, we preached God\'s gospel to you.";
csb[10] = "You are witnesses, and so is God, of how devoutly, righteously, and blamelessly we conducted ourselves with you believers.";
csb[11] = "As you know, like a father with his own children,";
csb[12] = "we encouraged, comforted, and implored each one of you to live worthy of God, who calls you into his own kingdom and glory.";
csb[13] = "This is why we constantly thank God, because when you received the word of God that you heard from us, you welcomed it not as a human message, but as it truly is, the word of God, which also works effectively in you who believe.";
csb[14] = "For you, brothers and sisters, became imitators of God\'s churches in Christ Jesus that are in Judea, since you have also suffered the same things from people of your own country, just as they did from the Jews";
csb[15] = "who killed the Lord Jesus and the prophets and persecuted us. They displease God and are hostile to everyone,";
csb[16] = "by keeping us from speaking to the Gentiles so that they may be saved. As a result, they are constantly filling up their sins to the limit, and wrath has overtaken them at last.";
csb[17] = "But as for us, brothers and sisters, after we were forced to leave you for a short time (in person, not in heart), we greatly desired and made every effort to return and see you face to face.";
csb[18] = "So we wanted to come to you -- even I, Paul, time and again -- but Satan hindered us.";
csb[19] = "For who is our hope or joy or crown of boasting in the presence of our Lord Jesus at his coming? Is it not you?";
csb[20] = "Indeed you are our glory and joy!";
