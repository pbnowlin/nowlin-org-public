csb[1] = "Therefore, when we could no longer stand it, we thought it was better to be left alone in Athens.";
csb[2] = "And we sent Timothy, our brother and God\'s coworker in the gospel of Christ, to strengthen and encourage you concerning your faith,";
csb[3] = "so that no one will be shaken by these afflictions. For you yourselves know that we are appointed to this.";
csb[4] = "In fact, when we were with you, we told you in advance that we were going to experience affliction, and as you know, it happened.";
csb[5] = "For this reason, when I could no longer stand it, I also sent him to find out about your faith, fearing that the tempter had tempted you and that our labor might be for nothing.";
csb[6] = "But now Timothy has come to us from you and brought us good news about your faith and love. He reported that you always have good memories of us and that you long to see us, as we also long to see you.";
csb[7] = "Therefore, brothers and sisters, in all our distress and affliction, we were encouraged about you through your faith.";
csb[8] = "For now we live, if you stand firm in the Lord.";
csb[9] = "How can we thank God for you in return for all the joy we experience before our God because of you,";
csb[10] = "as we pray very earnestly night and day to see you face to face and to complete what is lacking in your faith?";
csb[11] = "Now may our God and Father himself, and our Lord Jesus, direct our way to you.";
csb[12] = "And may the Lord cause you to increase and overflow with love for one another and for everyone, just as we do for you.";
csb[13] = "May he make your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his saints. Amen.";
