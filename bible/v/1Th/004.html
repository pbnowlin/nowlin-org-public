csb[1] = "Additionally then, brothers and sisters, we ask and encourage you in the Lord Jesus, that as you have received instruction from us on how you should live and please God -- as you are doing -- do this even more.";
csb[2] = "For you know what commands we gave you through the Lord Jesus.";
csb[3] = "For this is God\'s will, your sanctification: that you keep away from sexual immorality,";
csb[4] = "that each of you knows how to control his own body in holiness and honor,";
csb[5] = "not with lustful passions, like the Gentiles, who don\'t know God.";
csb[6] = "This means one must not transgress against and take advantage of a brother or sister in this manner, because the Lord is an avenger of all these offenses, as we also previously told and warned you.";
csb[7] = "For God has not called us to impurity but to live in holiness.";
csb[8] = "Consequently, anyone who rejects this does not reject man, but God, who gives you his Holy Spirit.";
csb[9] = "About brotherly love: You don\'t need me to write you because you yourselves are taught by God to love one another.";
csb[10] = "In fact, you are doing this toward all the brothers and sisters in the entire region of Macedonia. But we encourage you, brothers and sisters, to do this even more,";
csb[11] = "to seek to lead a quiet life, to mind your own business, and to work with your own hands, as we commanded you,";
csb[12] = "so that you may behave properly in the presence of outsiders and not be dependent on anyone.";
csb[13] = "We do not want you to be uninformed, brothers and sisters, concerning those who are asleep, so that you will not grieve like the rest, who have no hope.";
csb[14] = "For if we believe that Jesus died and rose again, in the same way, through Jesus, God will bring with him those who have fallen asleep.";
csb[15] = "For we say this to you by a word from the Lord: We who are still alive at the Lord\'s coming will certainly not precede those who have fallen asleep.";
csb[16] = "For the Lord himself will descend from heaven with a shout, with the archangel\'s voice, and with the trumpet of God, and the dead in Christ will rise first.";
csb[17] = "Then we who are still alive, who are left, will be caught up together with them in the clouds to meet the Lord in the air, and so we will always be with the Lord.";
csb[18] = "Therefore encourage one another with these words.";
