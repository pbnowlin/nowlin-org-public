csb[1] = "About the times and the seasons: Brothers and sisters, you do not need anything to be written to you.";
csb[2] = "For you yourselves know very well that the day of the Lord will come just like a thief in the night.";
csb[3] = "When they say, &quot;Peace and security,&quot; then sudden destruction will come upon them, like labor pains on a pregnant woman, and they will not escape.";
csb[4] = "But you, brothers and sisters, are not in the dark, for this day to surprise you like a thief.";
csb[5] = "For you are all children of light and children of the day. We do not belong to the night or the darkness.";
csb[6] = "So then, let us not sleep, like the rest, but let us stay awake and be self-controlled.";
csb[7] = "For those who sleep, sleep at night, and those who get drunk, get drunk at night.";
csb[8] = "But since we belong to the day, let us be self-controlled and put on the armor of faith and love, and a helmet of the hope of salvation.";
csb[9] = "For God did not appoint us to wrath, but to obtain salvation through our Lord Jesus Christ,";
csb[10] = "who died for us, so that whether we are awake or asleep, we may live together with him.";
csb[11] = "Therefore encourage one another and build each other up as you are already doing.";
csb[12] = "Now we ask you, brothers and sisters, to give recognition to those who labor among you and lead you in the Lord and admonish you,";
csb[13] = "and to regard them very highly in love because of their work. Be at peace among yourselves.";
csb[14] = "And we exhort you, brothers and sisters: warn those who are idle, comfort the discouraged, help the weak, be patient with everyone.";
csb[15] = "See to it that no one repays evil for evil to anyone, but always pursue what is good for one another and for all.";
csb[16] = "Rejoice always,";
csb[17] = "pray constantly,";

csb[19] = "Don\'t stifle the Spirit.";
csb[20] = "Don\'t despise prophecies,";
csb[21] = "but test all things. Hold on to what is good.";
csb[22] = "Stay away from every kind of evil.";

csb[24] = "He who calls you is faithful; he will do it.";
