csb[1] = "The words of Jeremiah, the son of Hilkiah, one of the priests living in Anathoth in the territory of Benjamin.";
csb[2] = "The word of the LORD came to him in the thirteenth year of the reign of Josiah son of Amon, king of Judah.";
csb[3] = "It also came throughout the days of Jehoiakim son of Josiah, king of Judah, until the fifth month of the eleventh year of Zedekiah son of Josiah, king of Judah, when the people of Jerusalem went into exile.";
csb[4] = "The word of the LORD came to me:";
csb[5] = "I chose you before I formed you in the womb; I set you apart before you were born. I appointed you a prophet to the nations.";
csb[6] = "But I protested, &quot;Oh no, Lord GOD! Look, I don\'t know how to speak since I am only a youth.&quot;";
csb[7] = "Then the LORD said to me: Do not say, &quot;I am only a youth,&quot; for you will go to everyone I send you to and speak whatever I tell you.";
csb[8] = "Do not be afraid of anyone, for I will be with you to rescue you. This is the LORD\'s declaration.";
csb[9] = "Then the LORD reached out his hand, touched my mouth, and told me: I have now filled your mouth with my words.";
csb[10] = "See, I have appointed you today over nations and kingdoms to uproot and tear down, to destroy and demolish, to build and plant.";
csb[11] = "Then the word of the LORD came to me, asking, &quot;What do you see, Jeremiah? &quot; I replied, &quot;I see a branch of an almond tree.&quot;";
csb[12] = "The LORD said to me, &quot;You have seen correctly, for I watch over my word to accomplish it.&quot;";
csb[13] = "Again the word of the LORD came to me asking, &quot;What do you see? &quot; And I replied, &quot;I see a boiling pot, its lip tilted from the north to the south.&quot;";
csb[14] = "Then the LORD said to me, &quot;Disaster will be poured out from the north on all who live in the land.";
csb[15] = "&quot;Indeed, I am about to summon all the clans and kingdoms of the north.&quot; This is the LORD\'s declaration. They will come, and each king will set up his throne at the entrance to Jerusalem\'s gates. They will attack all her surrounding walls and all the other cities of Judah.";
csb[16] = "&quot;I will pronounce my judgments against them for all the evil they did when they abandoned me to burn incense to other gods and to worship the works of their own hands.";
csb[17] = "&quot;Now, get ready. Stand up and tell them everything that I command you. Do not be intimidated by them or I will cause you to cower before them.";
csb[18] = "&quot;Today, I am the one who has made you a fortified city, an iron pillar, and bronze walls against the whole land -- against the kings of Judah, its officials, its priests, and the population.";
csb[19] = "&quot;They will fight against you but never prevail over you, since I am with you to rescue you.&quot; This is the LORD\'s declaration.";
