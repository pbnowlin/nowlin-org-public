csb[1] = "At the beginning of the reign of Jehoiakim son of Josiah, king of Judah, this word came from the LORD:";
csb[2] = "&quot;This is what the LORD says: Stand in the courtyard of the LORD\'s temple and speak all the words I have commanded you to speak to all Judah\'s cities that are coming to worship there. Do not hold back a word.";
csb[3] = "&quot;Perhaps they will listen and turn -- each from his evil way of life -- so that I might relent concerning the disaster that I plan to do to them because of the evil of their deeds.";
csb[4] = "&quot;You are to say to them, \'This is what the LORD says: If you do not listen to me by living according to my instruction that I set before you";
csb[5] = "&quot;and by listening to the words of my servants the prophets -- whom I have been sending to you time and time again, though you did not listen --";
csb[6] = "&quot;I will make this temple like Shiloh. I will make this city an example for cursing for all the nations of the earth.\' &quot;";
csb[7] = "The priests, the prophets, and all the people heard Jeremiah speaking these words in the temple of the LORD.";
csb[8] = "When he finished the address the LORD had commanded him to deliver to all the people, immediately the priests, the prophets, and all the people took hold of him, yelling, &quot;You must surely die!";
csb[9] = "&quot;How dare you prophesy in the name of the LORD, \'This temple will become like Shiloh and this city will become an uninhabited ruin\'! &quot; Then all the people crowded around Jeremiah at the LORD\'s temple.";
csb[10] = "When the officials of Judah heard about these things, they went from the king\'s palace to the LORD\'s temple and sat at the entrance of the New Gate of the LORD\'s temple.";
csb[11] = "Then the priests and prophets said to the officials and all the people, &quot;This man deserves the death sentence because he has prophesied against this city, as you have heard with your own ears.&quot;";
csb[12] = "Then Jeremiah said to all the officials and all the people, &quot;The LORD sent me to prophesy all the words that you have heard against this temple and city.";
csb[13] = "&quot;So now, correct your ways and deeds, and obey the LORD your God so that he might relent concerning the disaster he had pronounced against you.";
csb[14] = "&quot;As for me, here I am in your hands; do to me what you think is good and right.";
csb[15] = "&quot;But know for certain that if you put me to death, you will bring innocent blood on yourselves, on this city, and on its residents, for it is certain the LORD has sent me to speak all these things directly to you.&quot;";
csb[16] = "Then the officials and all the people told the priests and prophets, &quot;This man doesn\'t deserve the death sentence, for he has spoken to us in the name of the LORD our God! &quot;";
csb[17] = "Some of the elders of the land stood up and said to all the assembled people,";
csb[18] = "&quot;Micah the Moreshite prophesied in the days of King Hezekiah of Judah and said to all the people of Judah, \'This is what the LORD of Armies says: Zion will be plowed like a field, Jerusalem will become ruins, and the temple\'s mountain will be a high thicket.\'";
csb[19] = "&quot;Did King Hezekiah of Judah and all the people of Judah put him to death? Did not the king fear the LORD and plead for the LORD\'s favor, and did not the LORD relent concerning the disaster he had pronounced against them? We are about to bring a terrible disaster on ourselves! &quot;";
csb[20] = "Another man was also prophesying in the name of the LORD -- Uriah son of Shemaiah from Kiriath-jearim. He prophesied against this city and against this land in words like all those of Jeremiah.";
csb[21] = "King Jehoiakim, all his warriors, and all the officials heard his words, and the king tried to put him to death. When Uriah heard, he fled in fear and went to Egypt.";
csb[22] = "But King Jehoiakim sent men to Egypt: Elnathan son of Achbor and certain other men with him went to Egypt.";
csb[23] = "They brought Uriah out of Egypt and took him to King Jehoiakim, who executed him with the sword and threw his corpse into the burial place of the common people.";
csb[24] = "But Ahikam son of Shaphan supported Jeremiah, so he was not handed over to the people to be put to death.";

vul[17] = "surrexerunt ergo viri de senioribus terrae et dixerunt ad omnem coetum populi loquentes";
kjv[18] = "Micah the Morasthite prophesied in the days of Hezekiah king of Judah, and spake to all the people of Judah, saying, Thus saith the LORD of hosts; Zion shall be plowed [like] a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of a forest.";
rsv[18] = "&quot;Micah of Mo\'resheth prophesied in the days of Hezeki\'ah king of Judah, and said to all the people of Judah: \'Thus says the LORD of hosts, Zion shall be plowed as a field; Jerusalem shall become a heap of ruins, and the mountain of the house a wooded height.\'";
asv[18] = "Micah the Morashtite prophesied in the days of Hezekiah king of Judah; and he spake to all the people of Judah, saying, Thus saith Jehovah of hosts: Zion shall be plowed as a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of a forest.";
yng[18] = "`Micah the Morashtite hath been prophesying in the days of Hezekiah king of Judah, and he saith unto all the people of Judah, saying: Thus said Jehovah of Hosts: Zion is a plowed field, and Jerusalem is heaps, And the mountain of the house is for high places of a forest.";
dby[18] = "Micah the Morasthite prophesied in the days of Hezekiah king of Judah, and spoke to all the people of Judah, saying, Thus saith Jehovah of hosts: Zion shall be ploughed [as] a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of a forest.";
web[18] = "Micah the Morasthite prophesied in the days of Hezekiah king of Judah, and spoke to all the people of Judah, saying, Thus saith the LORD of hosts; Zion shall be plowed [like] a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of the forest.";
hnv[18] = "Mikhah the Morashti prophesied in the days of Hizkiyahu king of Yehudah; and he spoke to all the people of Yehudah, saying, Thus says the LORD of Hosts: Tziyon shall be plowed as a field, and Yerushalayim shall become heaps, and the mountain of the house as the high places of a forest.";
vul[18] = "Michas de Morasthim fuit propheta in diebus Ezechiae regis Iudae et ait ad omnem populum Iudae dicens haec dicit Dominus exercituum Sion quasi ager arabitur et Hierusalem in acervum lapidum erit et mons domus in excelsa silvarum";
kjv[19] = "Did Hezekiah king of Judah and all Judah put him at all to death? did he not fear the LORD, and besought the LORD, and the LORD repented him of the evil which he had pronounced against them? Thus might we procure great evil against our souls.";
rsv[19] = "Did Hezeki\'ah king of Judah and all Judah put him to death? Did he not fear the LORD and entreat the favor of the LORD, and did not the LORD repent of the evil which he had pronounced against them? But we are about to bring great evil upon ourselves.&quot;";
asv[19] = "Did Hezekiah king of Judah and all Judah put him to death? did he not fear Jehovah, and entreat the favor of Jehovah, and Jehovah repented him of the evil which he had pronounced against them? Thus should we commit great evil against our own souls.";
yng[19] = "`Put him at all to death did Hezekiah king of Judah, and all Judah? Did he not fear Jehovah? yea, he appeaseth the face of Jehovah, and Jehovah repenteth concerning the evil that He spake against them; and we are doing great evil against our souls.";
dby[19] = "Did Hezekiah king of Judah and all Judah put him at all to death? Did he not fear Jehovah, and supplicate Jehovah, and Jehovah repented him of the evil that he had pronounced against them? And we should be doing a great evil against our souls.";
web[19] = "Did Hezekiah king of Judah and all Judah put him to death? did he not fear the LORD, and beseech the LORD, and the LORD repented of the evil which he had pronounced against them? Thus might we procure great evil against our souls.";
hnv[19] = "Did Hizkiyahu king of Yehudah and all Yehudah put him to death? Didn\'t he fear the LORD, and entreat the favor of the LORD, and the LORD repented him of the evil which he had pronounced against them? Thus should we commit great evil against our own souls.";
vul[19] = "numquid morte condemnavit eum Ezechias rex Iuda et omnis Iuda numquid non timuerunt Dominum et deprecati sunt faciem Domini et paenituit Dominum mali quod locutus erat adversum eos itaque nos facimus malum grande contra animas nostras";
kjv[20] = "And there was also a man that prophesied in the name of the LORD, Urijah the son of Shemaiah of Kirjathjearim, who prophesied against this city and against this land according to all the words of Jeremiah:";
rsv[20] = "There was another man who prophesied in the name of the LORD, Uri\'ah the son of Shemai\'ah from Kir\'iath-je\'arim. He prophesied against this city and against this land in words like those of Jeremiah.";
asv[20] = "And there was also a man that prophesied in the name of Jehovah, Uriah the son of Shemaiah of Kiriath-jearim; and he prophesied against this city and against this land according to all the words of Jeremiah.";
yng[20] = "`And also there hath been a man prophesying in the name of Jehovah, Urijah son of Shemaiah, of Kirjath-Jearim, and he prophesieth against this city, and against this land according to all the words of Jeremiah,";
dby[20] = "And there was also a man that prophesied in the name of Jehovah, Urijah the son of Shemaiah of Kirjath-jearim: and he prophesied against this city and against this land according to all the words of Jeremiah;";
web[20] = "And there was also a man that prophesied in the name of the LORD, Urijah the son of Shemaiah of Kirjath-jearim, who prophesied against this city and against this land according to all the words of Jeremiah:";
hnv[20] = "There was also a man who prophesied in the name of the LORD, Uriyah the son of Shemayah of Kiryat-Ye`arim; and he prophesied against this city and against this land according to all the words of Yirmeyahu:";
vul[20] = "fuit quoque vir prophetans in nomine Domini Urias filius Semei de Cariathiarim et prophetavit adversum civitatem istam et adversum terram hanc iuxta universa verba Hieremiae";
kjv[21] = "And when Jehoiakim the king, with all his mighty men, and all the princes, heard his words, the king sought to put him to death: but when Urijah heard it, he was afraid, and fled, and went into Egypt;";
rsv[21] = "And when King Jehoi\'akim, with all his warriors and all the princes, heard his words, the king sought to put him to death; but when Uri\'ah heard of it, he was afraid and fled and escaped to Egypt.";
asv[21] = "And when Jehoiakim the king, with all his mighty men, and all the princes, heard his words, the king sought to put him to death; but when Uriah heard it, he was afraid, and fled, and went into Egypt.";
yng[21] = "And the king Jehoiakim, and all his mighty ones, and all the heads, hear his words, and the king seeketh to put him to death, and Urijah heareth, and feareth, and fleeth, and goeth in to Egypt.";
dby[21] = "and Jehoiakim the king, and all his mighty men, and all the princes, heard his words, and the king sought to put him to death; but Urijah heard it, and he was afraid, and fled, and went into Egypt.";
web[21] = "And when Jehoiakim the king, with all his mighty men, and all the princes, heard his words, the king sought to put him to death: but when Urijah heard it, he was afraid, and fled, and went into Egypt;";
hnv[21] = "and when Yehoiakim the king, with all his mighty-men, and all the princes, heard his words, the king sought to put him to death; but when Uriyah heard it, he was afraid, and fled, and went into Mitzrayim:";
vul[21] = "et audivit rex Ioachim et omnes potentes et principes eius verba haec et quaesivit rex interficere eum et audivit Urias et timuit fugitque et ingressus est Aegyptum";
kjv[22] = "And Jehoiakim the king sent men into Egypt, [namely], Elnathan the son of Achbor, and [certain] men with him into Egypt.";
rsv[22] = "Then King Jehoi\'akim sent to Egypt certain men, Elna\'than the son of Achbor and others with him,";
asv[22] = "And Jehoiakim the king sent men into Egypt, [namely], Elnathan the son of Achbor, and certain men with him, into Egypt;";
yng[22] = "And the king Jehoiakim sendeth men to Egypt -- Elnathan son of Achbor, and men with him unto Egypt --";
dby[22] = "And Jehoiakim the king sent men into Egypt, Elnathan the son of Achbor, and men with him, into Egypt;";
web[22] = "And Jehoiakim the king sent men into Egypt, [namely], Elnathan the son of Achbor, and [certain] men with him into Egypt.";
hnv[22] = "and Yehoiakim the king sent men into Mitzrayim, [namely], Elnatan the son of `Akhbor, and certain men with him, into Mitzrayim;";
vul[22] = "et misit rex Ioachim viros in Aegyptum Elnathan filium Achobor et viros cum eo in Aegyptum";
kjv[23] = "And they fetched forth Urijah out of Egypt, and brought him unto Jehoiakim the king; who slew him with the sword, and cast his dead body into the graves of the common people.";
rsv[23] = "and they fetched Uri\'ah from Egypt and brought him to King Jehoi\'akim, who slew him with the sword and cast his dead body into the burial place of the common people.";
asv[23] = "and they fetched forth Uriah out of Egypt, and brought him unto Jehoiakim the king, who slew him with the sword, and cast his dead body into the graves of the common people.";
yng[23] = "And they bring out Urijah from Egypt, and bring him in unto the king Jehoiakim, and he smiteth him with a sword, and casteth his corpse unto the graves of the sons of the people.\'";
dby[23] = "and they fetched forth Urijah out of Egypt, and brought him to Jehoiakim the king; and he slew him with the sword, and cast his dead body into the graves of the children of the people.";
web[23] = "And they brought forth Urijah from Egypt, and brought him to Jehoiakim the king; who slew him with the sword, and cast his dead body into the graves of the common people.";
hnv[23] = "and they fetched forth Uriyah out of Mitzrayim, and brought him to Yehoiakim the king, who killed him with the sword, and cast his dead body into the graves of the common people.";
vul[23] = "et eduxerunt Uriam de Aegypto et adduxerunt eum ad regem Ioachim et percussit eum gladio et proiecit cadaver eius in sepulchris vulgi ignobilis";
kjv[24] = "Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.";
rsv[24] = "But the hand of Ahi\'kam the son of Shaphan was with Jeremiah so that he was not given over to the people to be put to death.";
asv[24] = "But the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.";
yng[24] = "Only, the hand of Ahikam son of Shaphan hath been with Jeremiah so as not to give him up into the hand of the people to put him to death.";
dby[24] = "-- Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.";
web[24] = "Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.";
hnv[24] = "But the hand of Achikam the son of Shafan was with Yirmeyahu, that they should not give him into the hand of the people to put him to death.";
vul[24] = "igitur manus Ahicam filii Saphan fuit cum Hieremia ut non traderetur in manu populi et interficerent eum";
