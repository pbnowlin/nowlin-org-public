csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Go and announce directly to Jerusalem that this is what the LORD says: I remember the loyalty of your youth, your love as a bride -- how you followed me in the wilderness, in a land not sown.";
csb[3] = "&quot;Israel was holy to the LORD, the firstfruits of his harvest. All who ate of it found themselves guilty; disaster came on them.&quot; This is the LORD\'s declaration.";
csb[4] = "Hear the word of the LORD, house of Jacob and all families of the house of Israel.";
csb[5] = "This is what the LORD says: What fault did your fathers find in me that they went so far from me, followed worthless idols, and became worthless themselves?";
csb[6] = "They stopped asking, &quot;Where is the LORD who brought us from the land of Egypt, who led us through the wilderness, through a land of deserts and ravines, through a land of drought and darkness, a land no one traveled through and where no one lived? &quot;";
csb[7] = "I brought you to a fertile land to eat its fruit and bounty, but after you entered, you defiled my land; you made my inheritance detestable.";
csb[8] = "The priests quit asking, &quot;Where is the LORD? &quot; The experts in the law no longer knew me, and the rulers rebelled against me. The prophets prophesied by Baal and followed useless idols.";
csb[9] = "Therefore, I will bring a case against you again. This is the LORD\'s declaration. I will bring a case against your children\'s children.";
csb[10] = "Cross over to the coasts of Cyprus and take a look. Send someone to Kedar and consider carefully; see if there has ever been anything like this:";
csb[11] = "Has a nation ever exchanged its gods? (But they were not gods!) Yet my people have exchanged their Glory for useless idols.";
csb[12] = "Be appalled at this, heavens; be shocked and utterly desolated! This is the LORD\'s declaration.";
csb[13] = "For my people have committed a double evil: They have abandoned me, the fountain of living water, and dug cisterns for themselves -- cracked cisterns that cannot hold water.";
csb[14] = "Is Israel a slave? Was he born into slavery? Why else has he become a prey?";
csb[15] = "The young lions have roared at him; they have roared loudly. They have laid waste his land. His cities are in ruins, without inhabitants.";
csb[16] = "The men of Memphis and Tahpanhes have also broken your skull.";
csb[17] = "Have you not brought this on yourself by abandoning the LORD your God while he was leading you along the way?";
csb[18] = "Now what will you gain by traveling along the way to Egypt to drink the water of the Nile? What will you gain by traveling along the way to Assyria to drink the water of the Euphrates?";
csb[19] = "Your own evil will discipline you; your own apostasies will reprimand you. Recognize how evil and bitter it is for you to abandon the LORD your God and to have no fear of me. This is the declaration of the Lord GOD of Armies.";
csb[20] = "For long ago I broke your yoke; I tore off your chains. You insisted, &quot;I will not serve! &quot; On every high hill and under every green tree you lay down like a prostitute.";
csb[21] = "I planted you, a choice vine from the very best seed. How then could you turn into a degenerate, foreign vine?";
csb[22] = "Even if you wash with lye and use a great amount of bleach, the stain of your iniquity is still in front of me. This is the Lord GOD\'s declaration.";
csb[23] = "How can you protest, &quot;I am not defiled; I have not followed the Baals&quot;? Look at your behavior in the valley; acknowledge what you have done. You are a swift young camel twisting and turning on her way,";
csb[24] = "a wild donkey at home in the wilderness. She sniffs the wind in the heat of her desire. Who can control her passion? All who look for her will not become weary; they will find her in her mating season.";
csb[25] = "Keep your feet from going bare and your throat from thirst. But you say, &quot;It\'s hopeless; I love strangers, and I will continue to follow them.&quot;";
csb[26] = "Like the shame of a thief when he is caught, so the house of Israel has been put to shame. They, their kings, their officials, their priests, and their prophets";
csb[27] = "say to a tree, &quot;You are my father,&quot; and to a stone, &quot;You gave birth to me.&quot; For they have turned their back to me and not their face, yet in their time of disaster they beg, &quot;Rise up and save us! &quot;";
csb[28] = "But where are your gods you made for yourself? Let them rise up and save you in your time of disaster if they can, for your gods are as numerous as your cities, Judah.";
csb[29] = "Why do you bring a case against me? All of you have rebelled against me. This is the LORD\'s declaration.";
csb[30] = "I have struck down your children in vain; they would not accept discipline. Your own sword has devoured your prophets like a ravaging lion.";
csb[31] = "Evil generation, pay attention to the word of the LORD! Have I been a wilderness to Israel or a land of dense darkness? Why do my people claim, &quot;We will go where we want; we will no longer come to you&quot;?";
csb[32] = "Can a young woman forget her jewelry or a bride her wedding sash? Yet my people have forgotten me for countless days.";
csb[33] = "How skillfully you pursue love; you also teach evil women your ways.";
csb[34] = "Moreover, your skirts are stained with the blood of the innocent poor. You did not catch them breaking and entering. But in spite of all these things";
csb[35] = "you claim, &quot;I am innocent. His anger is sure to turn away from me.&quot; But I will certainly judge you because you have said, &quot;I have not sinned.&quot;";
csb[36] = "How unstable you are, constantly changing your ways! You will be put to shame by Egypt just as you were put to shame by Assyria.";
csb[37] = "Moreover, you will be led out from here with your hands on your head since the LORD has rejected those you trust; you will not succeed even with their help.";

csb[18] = "Now what will you gain by traveling along the way to Egypt to drink the waters of the Nile?* What will you gain by traveling along the way to Assyria to drink the waters of the Euphrates?";
rsv[18] = "And now what do you gain by going to Egypt, to drink the waters of the Nile? Or what do you gain by going to Assyria, to drink the waters of the Euphra\'tes?";
asv[18] = "And now what hast thou to do in the way to Egypt, to drink the waters of the Shihor? or what hast thou to do in the way to Assyria, to drink the waters of the River?";
yng[18] = "And now, what -- to thee in the way of Egypt, To drink the waters of Sihor? And what -- to thee in the way of Asshur, To drink the waters of the River?";
dby[18] = "And now, what hast thou to do with the way of Egypt, to drink the waters of Shihor? And what hast thou to do with the way of Assyria, to drink the waters of the River?";
web[18] = "And now what hast thou to do in the way of Egypt, to drink the waters of Sihor? or what hast thou to do in the way of Assyria, to drink the waters of the river?";
hnv[18] = "Now what have you to do in the way to Mitzrayim, to drink the waters of the Shichor? or what have you to do in the way to Ashshur, to drink the waters of the River?";
vul[18] = "et nunc quid tibi vis in via Aegypti ut bibas aquam turbidam et quid tibi cum via Assyriorum ut bibas aquam Fluminis";
kjv[19] = "Thine own wickedness shall correct thee, and thy backslidings shall reprove thee: know therefore and see that [it is] an evil [thing] and bitter, that thou hast forsaken the LORD thy God, and that my fear [is] not in thee, saith the Lord GOD of hosts.";
csb[19] = "Your own evil will discipline you; your own apostasies will reprimand you. Think it over and see how evil and bitter it is for you to abandon the LORD your God and to have no fear of Me. This is the declaration of the Lord GOD of Hosts.";
rsv[19] = "Your wickedness will chasten you, and your apostasy will reprove you. Know and see that it is evil and bitter for you to forsake the LORD your God; the fear of me is not in you, says the Lord GOD of hosts.";
asv[19] = "Thine own wickedness shall correct thee, and thy backslidings shall reprove thee: know therefore and see that it is an evil thing and a bitter, that thou hast forsaken Jehovah thy God, and that my fear is not in thee, saith the Lord, Jehovah of hosts.";
yng[19] = "Instruct thee doth thy wickedness, And thy backslidings reprove thee, Know and see that an evil and a bitter thing [Is] thy forsaking Jehovah thy God, And My fear not being on thee, An affirmation of the Lord Jehovah of Hosts.";
dby[19] = "Thine own wickedness chastiseth thee, and thy backslidings reprove thee: know then and see that it is an evil thing and bitter that thou hast forsaken Jehovah thy God, and that my fear is not in thee, saith the Lord, Jehovah of hosts.";
web[19] = "Thy own wickedness shall correct thee, and thy backslidings shall reprove thee: know therefore and see that [it is] an evil [thing] and bitter, that thou hast forsaken the LORD thy God, and that my fear [is] not in thee, saith the Lord GOD of hosts.";
hnv[19] = "Your own wickedness shall correct you, and your backsliding shall reprove you: know therefore and see that it is an evil thing and a bitter, that you have forsaken the LORD your God, and that my fear is not in you, says the Lord, the LORD of Hosts.";
vul[19] = "arguet te malitia tua et aversio tua increpabit te scito et vide quia malum et amarum est reliquisse te Dominum Deum tuum et non esse timorem mei apud te dicit Dominus Deus exercituum";
kjv[20] = "For of old time I have broken thy yoke, [and] burst thy bands; and thou saidst, I will not transgress; when upon every high hill and under every green tree thou wanderest, playing the harlot.";
csb[20] = "For long ago I* broke your yoke; I* tore off your chains. You insisted, &quot;I will not serve! &quot; On every high hill and under every green tree you lie down like a prostitute.";
rsv[20] = "&quot;For long ago you broke your yoke and burst your bonds; and you said, \'I will not serve.\' Yea, upon every high hill and under every green tree you bowed down as a harlot.";
asv[20] = "For of old time I have broken thy yoke, and burst thy bonds; and thou saidst, I will not serve; for upon every high hill and under every green tree thou didst bow thyself, playing the harlot.";
yng[20] = "For from of old thou hast broken thy yoke, Drawn away thy bands, and sayest, `I do not serve,\' For, on every high height, and under every green tree, Thou art wandering -- a harlot.";
dby[20] = "For of old thou hast broken thy yoke, [and] burst thy bands; and thou saidst, I will not serve. For upon every high hill, and under every green tree, thou bowest down, playing the harlot.";
web[20] = "For of old time I have broken thy yoke, [and] burst thy bands; and thou saidst, I will not transgress; when upon every high hill and under every green tree thou wanderest, playing the harlot.";
hnv[20] = "For of old time I have broken your yoke, and burst your bonds; and you said, I will not serve; for on every high hill and under every green tree you did bow yourself, playing the prostitute.";
vul[20] = "a saeculo confregisti iugum meum rupisti vincula mea et dixisti non serviam in omni enim colle sublimi et sub omni ligno frondoso tu prosternebaris meretrix";
kjv[21] = "Yet I had planted thee a noble vine, wholly a right seed: how then art thou turned into the degenerate plant of a strange vine unto me?";
csb[21] = "I planted you, a choice vine from the very best seed. How then could you turn into a degenerate, foreign vine?";
rsv[21] = "Yet I planted you a choice vine, wholly of pure seed. How then have you turned degenerate and become a wild vine?";
asv[21] = "Yet I had planted thee a noble vine, wholly a right seed: how then art thou turned into the degenerate branches of a foreign vine unto me?";
yng[21] = "And I planted thee a choice vine, wholly a true seed, And how hast thou been turned to Me, To the degenerate shoots of a strange vine?";
dby[21] = "And I, -- I had planted thee a noble vine, wholly a right seed; how then art thou turned into the degenerate shoots of a strange vine unto me?";
web[21] = "Yet I had planted thee a noble vine, wholly a right seed: how then art thou turned into the degenerate plant of a strange vine to me?";
hnv[21] = "Yet I had planted you a noble vine, wholly a right seed: how then are you turned into the degenerate branches of a foreign vine to me?";

kjv[22] = "For though thou wash thee with nitre, and take thee much soap, [yet] thine iniquity is marked before me, saith the Lord GOD.";
csb[22] = "Even if you wash with lye and use a great amount of soap, the stain of your sin is still in front of Me. This is the Lord God\'s declaration.";
rsv[22] = "Though you wash yourself with lye and use much soap, the stain of your guilt is still before me, says the Lord GOD.";
asv[22] = "For though thou wash thee with lye, and take thee much soap, yet thine iniquity is marked before me, saith the Lord Jehovah.";
yng[22] = "But though thou dost wash with nitre, And dost multiply to thyself soap, Marked is thine iniquity before Me, An affirmation of the Lord Jehovah.";
dby[22] = "For though thou wash thee with nitre, and take thee much potash, thine iniquity is marked before me, saith the Lord Jehovah.";
web[22] = "For though thou shalt wash thee with niter, and take thee much soap, [yet] thy iniquity is marked before me, saith the Lord GOD.";
hnv[22] = "For though you wash yourself with lye, and use much soap, yet your iniquity is marked before me, says the Lord GOD.";

kjv[23] = "How canst thou say, I am not polluted, I have not gone after Baalim? see thy way in the valley, know what thou hast done: [thou art] a swift dromedary traversing her ways;";
csb[23] = "How can you protest, &quot;I am not defiled; I have not followed the Baals&quot;? Look at your behavior in the valley; acknowledge what you have done. You are a swift young camel twisting and turning on her way,";
rsv[23] = "How can you say, \'I am not defiled, I have not gone after the Ba\'als\'? Look at your way in the valley; know what you have done--a restive young camel interlacing her tracks,";
asv[23] = "How canst thou say, I am not defiled, I have not gone after the Baalim? see thy way in the valley, know what thou hast done: [thou art] a swift dromedary traversing her ways;";
yng[23] = "How sayest thou, `I have not been defiled, After the Baalim I have not gone?\' See thy way in a valley, know what thou hast done, A swift dromedary winding her ways,";
dby[23] = "How sayest thou, I am not defiled, I have not gone after the Baals? See thy way in the valley, acknowledge what thou hast done -- a swift dromedary traversing her ways!";

kjv[24] = "A wild ass used to the wilderness, [that] snuffeth up the wind at her pleasure; in her occasion who can turn her away? all they that seek her will not weary themselves; in her month they shall find her.";
csb[24] = "a wild donkey at home* in the wilderness. She sniffs the wind in the heat of her desire. Who can control her passion? All who look for her will not become tired; they will find her in her mating season.*";
rsv[24] = "a wild ass used to the wilderness, in her heat sniffing the wind! Who can restrain her lust? None who seek her need weary themselves; in her month they will find her.";
asv[24] = "a wild ass used to the wilderness, that snuffeth up the wind in her desire; in her occasion who can turn her away? all they that seek her will not weary themselves; in her month they shall find her.";
yng[24] = "A wild ass accustomed to a wilderness, In the desire of her soul she hath swallowed up wind, Her meeting -- who doth turn her back? None seeking her do weary themselves, In her month they find her.";
dby[24] = "-- a wild ass, used to the wilderness, that snuffeth up the wind in her desire! In her ardour, who shall turn her away? All they that seek her will not weary themselves; in her month they shall find her.";

rsv[26] = "&quot;As a thief is shamed when caught, so the house of Israel shall be shamed: they, their kings, their princes, their priests, and their prophets,";
asv[26] = "As the thief is ashamed when he is found, so is the house of Israel ashamed; they, their kings, their princes, and their priests, and their prophets;";
yng[26] = "As the shame of a thief when he is found, So put to shame have been the house of Israel, They, their kings, their heads, And their priests, and their prophets,";
dby[26] = "As a thief is ashamed when he is found, so shall the house of Israel be ashamed -- they, their kings, their princes, and their priests, and their prophets --";

csb[27] = "say to a tree, &quot;You are my father,&quot; and to a stone, &quot;You gave birth to me.&quot; For they have turned their back to Me and not their face, yet in their time of disaster they beg, &quot;Rise up and save us! &quot;";
rsv[27] = "who say to a tree, \'You are my father,\' and to a stone, \'You gave me birth.\' For they have turned their back to me, and not their face. But in the time of their trouble they say, \'Arise and save us!\'";

kjv[31] = "O generation, see ye the word of the LORD. Have I been a wilderness unto Israel? a land of darkness? wherefore say my people, We are lords; we will come no more unto thee?";
csb[31] = "Evil generation, pay attention to the word of the LORD! Have I been a wilderness to Israel or a land of dense darkness? Why do My people claim, &quot;We will go where we want;* we will no longer come to You&quot;?";
rsv[31] = "And you, O generation, heed the word of the LORD. Have I been a wilderness to Israel, or a land of thick darkness? Why then do my people say, \'We are free, we will come no more to thee\'?";
asv[31] = "O generation, see ye the word of Jehovah. Have I been a wilderness unto Israel? or a land of thick darkness? wherefore say my people, We are broken loose; we will come no more unto thee?";
yng[31] = "O generation, see ye the word of Jehovah: A wilderness have I been to Israel? A land of thick darkness? Wherefore have My people said, `We mourned, We come not in again unto Thee.\'";
dby[31] = "O generation, mark ye the word of Jehovah. Have I been a wilderness unto Israel, or a land of thick darkness? Wherefore say my people, We have dominion; we will come no more unto thee?";
web[31] = "O generation, see ye the word of the LORD. Have I been a wilderness to Israel? a land of darkness? why say my people, We are lords; we will come no more to thee?";
hnv[31] = "Generation, see the word of the LORD. Have I been a wilderness to Yisra\'el? or a land of thick darkness? why say my people, We are broken loose; we will come no more to you?";
vul[31] = "generatio vestra videte verbum Domini numquid solitudo factus sum Israheli aut terra serotina quare ergo dixit populus meus recessimus non veniemus ultra ad te";

yng[32] = "Doth a virgin forget her ornaments? A bride her bands? And My people have forgotten Me days without number.";
dby[32] = "Doth a virgin forget her ornaments, a bride her attire? But my people have forgotten me days without number.";

dby[33] = "How dost thou trim thy way to seek love! Therefore hast thou also accustomed thy ways to wickedness.";

hnv[33] = "How trimmest you your way to seek love! therefore even the wicked women have you taught your ways.";

kjv[34] = "Also in thy skirts is found the blood of the souls of the poor innocents: I have not found it by secret search, but upon all these.";
csb[34] = "Moreover, your skirts are stained with the blood of the innocent poor. You did not catch them breaking and entering. But in spite of all these things";
rsv[34] = "Also on your skirts is found the lifeblood of guiltless poor; you did not find them breaking in. Yet in spite of all these things";
asv[34] = "Also in thy skirts is found the blood of the souls of the innocent poor: thou didst not find them breaking in; but it is because of all these things.";
yng[34] = "Also in thy skirts hath been found the blood of innocent needy souls, Not by digging have I found them, but upon all these.";
dby[34] = "Yea, in thy skirts is found the blood of the souls of the innocent poor, whom thou didst not encounter breaking in, but [it is found] upon all these.";
web[34] = "Also in thy skirts is found the blood of the souls of the poor innocents: I have not found it by secret search, but upon all these.";
hnv[34] = "Also in your skirts is found the blood of the souls of the innocent poor: you did not find them breaking in; but it is because of all these things.";

kjv[35] = "Yet thou sayest, Because I am innocent, surely his anger shall turn from me. Behold, I will plead with thee, because thou sayest, I have not sinned.";
csb[35] = "you claim, &quot;I am innocent. His anger is sure to turn away from me.&quot; But I will certainly judge you because you have said, &quot;I have not sinned.&quot;";
rsv[35] = "you say, \'I am innocent; surely his anger has turned from me.\' Behold, I will bring you to judgment for saying, \'I have not sinned.\'";
asv[35] = "Yet thou saidst, I am innocent; surely his anger is turned away from me. Behold, I will enter into judgment with thee, because thou sayest, I have not sinned.";
yng[35] = "And thou sayest, `Because I have been innocent, Surely turned back hath His anger from me?\' Lo, I have been judged with thee, Because of thy saying, `I have not sinned.\'";
dby[35] = "And thou sayest, Indeed I am innocent; his anger will turn from me. Behold, I will enter into judgment with thee because thou sayest, I have not sinned.";
web[35] = "Yet thou sayest, Because I am innocent, surely his anger will turn from me. Behold, I will plead with thee, because thou sayest, I have not sinned.";
hnv[35] = "Yet you said, I am innocent; surely his anger is turned away from me. Behold, I will enter into judgment with you, because you say, I have not sinned.";
vul[35] = "et dixisti absque peccato et innocens ego sum et propterea avertatur furor tuus a me ecce ego iudicio contendam tecum eo quod dixeris non peccavi";

rsv[36] = "How lightly you gad about, changing your way! You shall be put to shame by Egypt as you were put to shame by Assyria.";
asv[36] = "Why gaddest thou about so much to change thy way? thou shalt be ashamed of Egypt also, as thou wast ashamed of Assyria.";
yng[36] = "What? thou art very vile to repeat thy way, Even of Egypt thou art ashamed, As thou hast been ashamed of Asshur,";
dby[36] = "Why dost thou gad about so much, and change thy way? Thou shalt also be brought to shame by Egypt, as thou wast brought to shame by Assyria.";
web[36] = "Why dost thou go about so much to change thy way? thou also shalt be ashamed of Egypt, as thou wast ashamed of Assyria.";
hnv[36] = "Why go you about so much to change your way? you shall be ashamed of Mitzrayim also, as you were ashamed of Ashshur.";
vul[36] = "quam vilis es facta nimis iterans vias tuas et ab Aegypto confunderis sicut confusa es ab Assur";
kjv[37] = "Yea, thou shalt go forth from him, and thine hands upon thine head: for the LORD hath rejected thy confidences, and thou shalt not prosper in them.";
csb[37] = "Moreover, you will be led out from here with your hands on your head since the LORD has rejected those you trust; you will not succeed even with their help.*";
rsv[37] = "From it too you will come away with your hands upon your head, for the LORD has rejected those in whom you trust, and you will not prosper by them.";
asv[37] = "From thence also shalt thou go forth, with thy hands upon thy head: for Jehovah hath rejected those in whom thou trustest, and thou shalt not prosper with them.";
yng[37] = "Also from this thou goest out, And thy hands on thy head, For Jehovah hath kicked at thy confidences, And thou dost not give prosperity to them!";
dby[37] = "Thou shalt indeed go forth from her with thy hands upon thy head; for Jehovah hath rejected those thou confidest in, and thou shalt not prosper by them.";
web[37] = "Yes, thou shalt go forth from him, and thy hands upon thy head: for the LORD hath rejected thy confidences, and thou shalt not prosper in them.";
hnv[37] = "From there also shall you go forth, with your hands on your head: for the LORD has rejected those in whom you trust, and you shall not prosper with them.";
