csb[1] = "In the fourth year of Jehoiakim son of Josiah, king of Judah, this word came to Jeremiah from the LORD:";
csb[2] = "&quot;Take a scroll, and write on it all the words I have spoken to you concerning Israel, Judah, and all the nations from the time I first spoke to you during Josiah\'s reign until today.";
csb[3] = "&quot;Perhaps when the house of Judah hears about all the disaster I am planning to bring on them, each one of them will turn from his evil way. Then I will forgive their iniquity and their sin.&quot;";
csb[4] = "So Jeremiah summoned Baruch son of Neriah. At Jeremiah\'s dictation, Baruch wrote on a scroll all the words the LORD had spoken to Jeremiah.";
csb[5] = "Then Jeremiah commanded Baruch, &quot;I am restricted; I cannot enter the temple of the LORD,";
csb[6] = "&quot;so you must go and read from the scroll -- which you wrote at my dictation -- the words of the LORD in the hearing of the people at the temple of the LORD on a day of fasting. Read his words in the hearing of all the Judeans who are coming from their cities.";
csb[7] = "&quot;Perhaps their petition will come before the LORD, and each one will turn from his evil way, for the anger and fury that the LORD has pronounced against this people are intense.&quot;";
csb[8] = "So Baruch son of Neriah did everything the prophet Jeremiah had commanded him. At the LORD\'s temple he read the LORD\'s words from the scroll.";
csb[9] = "In the fifth year of Jehoiakim son of Josiah, king of Judah, in the ninth month, all the people of Jerusalem and all those coming in from Judah\'s cities into Jerusalem proclaimed a fast before the LORD.";
csb[10] = "Then at the LORD\'s temple, in the chamber of Gemariah son of Shaphan the scribe, in the upper courtyard at the opening of the New Gate of the LORD\'s temple, in the hearing of all the people, Baruch read Jeremiah\'s words from the scroll.";
csb[11] = "When Micaiah son of Gemariah, son of Shaphan, heard all the words of the LORD from the scroll,";
csb[12] = "he went down to the scribe\'s chamber in the king\'s palace. All the officials were sitting there -- Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the other officials.";
csb[13] = "Micaiah reported to them all the words he had heard when Baruch read from the scroll in the hearing of the people.";
csb[14] = "Then all the officials sent word to Baruch through Jehudi son of Nethaniah, son of Shelemiah, son of Cushi, saying, &quot;Bring the scroll that you read in the hearing of the people, and come.&quot; So Baruch son of Neriah took the scroll and went to them.";
csb[15] = "They said to him, &quot;Sit down and read it in our hearing.&quot; So Baruch read it in their hearing.";
csb[16] = "When they had heard all the words, they turned to each other in fear and said to Baruch, &quot;We must surely tell the king all these things.&quot;";
csb[17] = "Then they asked Baruch, &quot;Tell us, how did you write all these words? At his dictation? &quot;";
csb[18] = "Baruch said to them, &quot;At his dictation. He recited all these words to me while I was writing on the scroll in ink.&quot;";
csb[19] = "The officials said to Baruch, &quot;You and Jeremiah must hide and tell no one where you are.&quot;";
csb[20] = "Then, after depositing the scroll in the chamber of Elishama the scribe, the officials came to the king at the courtyard and reported everything in the hearing of the king.";
csb[21] = "The king sent Jehudi to get the scroll, and he took it from the chamber of Elishama the scribe. Jehudi then read it in the hearing of the king and all the officials who were standing by the king.";
csb[22] = "Since it was the ninth month, the king was sitting in his winter quarters with a fire burning in front of him.";
csb[23] = "As soon as Jehudi would read three or four columns, Jehoiakim would cut the scroll with a scribe\'s knife and throw the columns into the fire in the hearth until the entire scroll was consumed by the fire in the hearth.";
csb[24] = "As they heard all these words, the king and all of his servants did not become terrified or tear their clothes.";
csb[25] = "Even though Elnathan, Delaiah, and Gemariah had urged the king not to burn the scroll, he did not listen to them.";
csb[26] = "Then the king commanded Jerahmeel the king\'s son, Seraiah son of Azriel, and Shelemiah son of Abdeel to seize the scribe Baruch and the prophet Jeremiah, but the LORD hid them.";
csb[27] = "After the king had burned the scroll and the words Baruch had written at Jeremiah\'s dictation, the word of the LORD came to Jeremiah:";
csb[28] = "&quot;Take another scroll, and once again write on it the original words that were on the original scroll that King Jehoiakim of Judah burned.";
csb[29] = "&quot;You are to proclaim concerning King Jehoiakim of Judah, \'This is what the LORD says: You have burned the scroll, asking, &quot;Why have you written on it that the king of Babylon will certainly come and destroy this land and cause it to be without people or animals? &quot;";
csb[30] = "Therefore, this is what the LORD says concerning King Jehoiakim of Judah: He will have no one to sit on David\'s throne, and his corpse will be thrown out to be exposed to the heat of day and the frost of night.";
csb[31] = "I will punish him, his descendants, and his officers for their iniquity. I will bring on them, on the residents of Jerusalem, and on the people of Judah all the disaster, which I warned them about but they did not listen.\' &quot;";
csb[32] = "Then Jeremiah took another scroll and gave it to Baruch son of Neriah, the scribe, and he wrote on it at Jeremiah\'s dictation all the words of the scroll that Jehoiakim, Judah\'s king, had burned in the fire. And many other words like them were added.";

kjv[2] = "Take thee a roll of a book, and write therein all the words that I have spoken unto thee against Israel, and against Judah, and against all the nations, from the day I spake unto thee, from the days of Josiah, even unto this day.";

vul[2] = "tolle volumen libri et scribes in eo omnia verba quae locutus sum tibi adversum Israhel et Iudam et adversum omnes gentes a die qua locutus sum ad te ex diebus Iosiae usque ad diem hanc";
kjv[3] = "It may be that the house of Judah will hear all the evil which I purpose to do unto them; that they may return every man from his evil way; that I may forgive their iniquity and their sin.";
rsv[3] = "It may be that the house of Judah will hear all the evil which I intend to do to them, so that every one may turn from his evil way, and that I may forgive their iniquity and their sin.&quot;";

rsv[6] = "so you are to go, and on a fast day in the hearing of all the people in the LORD\'s house you shall read the words of the LORD from the scroll which you have written at my dictation. You shall read them also in the hearing of all the men of Judah who come out of their cities.";
asv[6] = "therefore go thou, and read in the roll, which thou hast written from my mouth, the words of Jehovah in the ears of the people in Jehovah\'s house upon the fast-day; and also thou shalt read them in the ears of all Judah that come out of their cities.";
yng[6] = "but thou hast entered -- and thou hast read in the roll that thou hast written from my mouth, the words of Jehovah, in the ears of the people, in the house of Jehovah, in the day of the fast, and also in the ears of all Judah who are coming in from their cities thou dost read them;";
dby[6] = "and read in the roll, which thou hast written from my mouth, the words of Jehovah in the ears of the people in the house of Jehovah upon the fast day; and thou shalt also read them in the ears of all Judah that come from their cities.";

kjv[7] = "It may be they will present their supplication before the LORD, and will return every one from his evil way: for great [is] the anger and the fury that the LORD hath pronounced against this people.";

kjv[9] = "And it came to pass in the fifth year of Jehoiakim the son of Josiah king of Judah, in the ninth month, [that] they proclaimed a fast before the LORD to all the people in Jerusalem, and to all the people that came from the cities of Judah unto Jerusalem.";
rsv[9] = "In the fifth year of Jehoi\'akim the son of Josi\'ah, king of Judah, in the ninth month, all the people in Jerusalem and all the people who came from the cities of Judah to Jerusalem proclaimed a fast before the LORD.";
asv[9] = "Now it came to pass in the fifth year of Jehoiakim the son of Josiah, king of Judah, in the ninth month, that all the people in Jerusalem, and all the people that came from the cities of Judah unto Jerusalem, proclaimed a fast before Jehovah.";
yng[9] = "And it cometh to pass, in the fifth year of Jehoiakim son of Josiah king of Judah, in the ninth month, proclaimed a fast before Jehovah have all the people in Jerusalem, and all the people who are coming in from cities of Judah to Jerusalem;";
dby[9] = "And it came to pass in the fifth year of Jehoiakim the son of Josiah, the king of Judah, in the ninth month, [that] they proclaimed a fast before Jehovah, for all the people in Jerusalem, and for all the people that came from the cities of Judah to Jerusalem.";

kjv[10] = "Then read Baruch in the book the words of Jeremiah in the house of the LORD, in the chamber of Gemariah the son of Shaphan the scribe, in the higher court, at the entry of the new gate of the LORD\'S house, in the ears of all the people.";
rsv[10] = "Then, in the hearing of all the people, Baruch read the words of Jeremiah from the scroll, in the house of the LORD, in the chamber of Gemari\'ah the son of Shaphan the secretary, which was in the upper court, at the entry of the New Gate of the LORD\'s house.";
asv[10] = "Then read Baruch in the book the words of Jeremiah in the house of Jehovah, in the chamber of Gemariah the son of Shaphan the scribe, in the upper court, at the entry of the new gate of Jehovah\'s house, in the ears of all the people.";
yng[10] = "and Baruch readeth in the book the words of Jeremiah in the house of Jehovah, in the chamber of Gemariah son of Shaphan the scribe, in the higher court, at the opening of the new gate of the house of Jehovah, in the ears of all the people.";

kjv[12] = "Then he went down into the king\'s house, into the scribe\'s chamber: and, lo, all the princes sat there, [even] Elishama the scribe, and Delaiah the son of Shemaiah, and Elnathan the son of Achbor, and Gemariah the son of Shaphan, and Zedekiah the son of Hananiah, and all the princes.";

asv[12] = "he went down into the king\'s house, into the scribe\'s chamber: and, lo, all the princes were sitting there, [to wit], Elishama the scribe, and Delaiah the son of Shemaiah, and Elnathan the son of Achbor, and Gemariah the son of Shaphan, and Zedekiah the son of Hananiah, and all the princes.";

vul[12] = "descendit in domum regis ad gazofilacium scribae et ecce ibi omnes principes sedebant Elisama scriba et Dalaias filius Semeiae et Elnathan filius Achobor et Gamarias filius Saphan et Sedecias filius Ananiae et universi principes";

kjv[14] = "Therefore all the princes sent Jehudi the son of Nethaniah, the son of Shelemiah, the son of Cushi, unto Baruch, saying, Take in thine hand the roll wherein thou hast read in the ears of the people, and come. So Baruch the son of Neriah took the roll in his hand, and came unto them.";
rsv[14] = "Then all the princes sent Jehu\'di the son of Nethani\'ah, son of Shelemi\'ah, son of Cushi, to say to Baruch, &quot;Take in your hand the scroll that you read in the hearing of the people, and come.&quot; So Baruch the son of Neri\'ah took the scroll in his hand and came to them.";
asv[14] = "Therefore all the princes sent Jehudi the son of Nethaniah, the son of Shelemiah, the son of Cushi, unto Baruch, saying, Take in thy hand the roll wherein thou hast read in the ears of the people, and come. So Baruch the son of Neriah took the roll in his hand, and came unto them.";
yng[14] = "and all the heads send unto Baruch, Jehudi son of Nethaniah, son of Shelemiah, son of Cushi, saying, `The roll in which thou hast read in the ears of the people take in thy hand, and come.\' And Baruch son of Neriah taketh the roll in his hand and cometh in unto them,";
dby[14] = "And all the princes sent Jehudi the son of Nethaniah, the son of Shelemiah, the son of Cushi, unto Baruch, saying, Take in thy hand the roll in which thou hast read in the ears of the people, and come. And Baruch the son of Nerijah took the roll in his hand, and came unto them.";
web[14] = "Therefore all the princes sent Jehudi the son of Nethaniah, the son of Shelemiah, the son of Cushi, to Baruch, saying, Take in thy hand the roll in which thou hast read in the ears of the people, and come. So Baruch the son of Neriah took the roll in his hand, and came to them.";
hnv[14] = "Therefore all the princes sent Yehudi the son of Netanyah, the son of Shelemyahu, the son of Kushi, to Barukh, saying, Take in your hand the scroll in which you have read in the ears of the people, and come. So Barukh the son of Neriyah took the scroll in his hand, and came to them.";
vul[14] = "miserunt itaque omnes principes ad Baruch Iudi filium Nathaniae filii Selemiae filii Chusi dicentes volumen ex quo legisti audiente populo sume in manu tua et veni tulit ergo Baruch filius Neriae volumen in manu sua et venit ad eos";
kjv[15] = "And they said unto him, Sit down now, and read it in our ears. So Baruch read [it] in their ears.";
rsv[15] = "And they said to him, &quot;Sit down and read it.&quot; So Baruch read it to them.";
asv[15] = "And they said unto him, Sit down now, and read it in our ears. So Baruch read it in their ears.";
yng[15] = "and they say unto him, `Sit down, we pray thee, and read it in our ears,\' and Baruch readeth in their ears,";
dby[15] = "And they said unto him, Sit down now, and read it in our ears. And Baruch read [it] in their ears.";
web[15] = "And they said to him, Sit down now, and read it in our ears. So Baruch read [it] in their ears.";
hnv[15] = "They said to him, Sit down now, and read it in our ears. So Barukh read it in their ears.";
vul[15] = "et dixerunt ad eum sede et lege haec in auribus nostris et legit Baruch in auribus eorum";
kjv[16] = "Now it came to pass, when they had heard all the words, they were afraid both one and other, and said unto Baruch, We will surely tell the king of all these words.";
rsv[16] = "When they heard all the words, they turned one to another in fear; and they said to Baruch, &quot;We must report all these words to the king.&quot;";
asv[16] = "Now it came to pass, when they had heard all the words, they turned in fear one toward another, and said unto Baruch, We will surely tell the king of all these words.";
yng[16] = "and it cometh to pass, when they hear all the words, they have been afraid one at another, and say unto Baruch, `We do surely declare to the king all these words.\'";
dby[16] = "And it came to pass, when they heard all the words, they turned in fear one toward another, and said unto Baruch, We will certainly report to the king all these words.";
web[16] = "Now it came to pass when they had heard all the words, they were afraid both one and another, and said to Baruch, We will surely tell the king of all these words.";
hnv[16] = "Now it happened, when they had heard all the words, they turned in fear one toward another, and said to Barukh, We will surely tell the king of all these words.";
vul[16] = "igitur cum audissent omnia verba obstipuerunt unusquisque ad proximum suum et dixerunt ad Baruch nuntiare debemus regi omnes sermones istos";
kjv[17] = "And they asked Baruch, saying, Tell us now, How didst thou write all these words at his mouth?";
rsv[17] = "Then they asked Baruch, &quot;Tell us, how did you write all these words? Was it at his dictation?&quot;";
asv[17] = "And they asked Baruch, saying, Tell us now, How didst thou write all these words at his mouth?";
yng[17] = "And they asked Baruch, saying, `Declare, we pray thee, to us, how didst thou write all these words -- from his mouth?\'";
dby[17] = "And they asked Baruch, saying, Tell us now, How didst thou write all these words from his mouth?";
web[17] = "And they asked Baruch, saying, Tell us now, How didst thou write all these words at his mouth?";
hnv[17] = "They asked Barukh, saying, Tell us now, How did you write all these words at his mouth?";
vul[17] = "et interrogaverunt eum dicentes indica nobis quomodo scripsisti omnes sermones istos ex ore eius";
kjv[18] = "Then Baruch answered them, He pronounced all these words unto me with his mouth, and I wrote [them] with ink in the book.";
rsv[18] = "Baruch answered them, &quot;He dictated all these words to me, while I wrote them with ink on the scroll.&quot;";
asv[18] = "Then Baruch answered them, He pronounced all these words unto me with his mouth, and I wrote them with ink in the book.";
yng[18] = "And Baruch saith to them, `From his mouth, he pronounceth unto me all these words, and I am writing on the book with ink.\'";
dby[18] = "And Baruch said unto them, He pronounced all these words unto me with his mouth, and I wrote [them] with ink in the book.";
web[18] = "Then Baruch answered them, He pronounced all these words to me with his mouth, and I wrote [them] with ink in the book.";
hnv[18] = "Then Barukh answered them, He pronounced all these words to me with his mouth, and I wrote them with ink in the book.";
vul[18] = "dixit autem eis Baruch ex ore suo loquebatur quasi legens ad me omnes sermones istos et ego scribebam in volumine atramento";
kjv[19] = "Then said the princes unto Baruch, Go, hide thee, thou and Jeremiah; and let no man know where ye be.";
rsv[19] = "Then the princes said to Baruch, &quot;Go and hide, you and Jeremiah, and let no one know where you are.&quot;";
asv[19] = "Then said the princes unto Baruch, Go, hide thee, thou and Jeremiah; and let no man know where ye are.";
yng[19] = "And the heads say unto Baruch, `Go, be hidden, thou and Jeremiah, and let no one know where ye [are].\'";
dby[19] = "And the princes said unto Baruch, Go, hide thee, thou and Jeremiah; that none may know where ye are.";
web[19] = "Then said the princes to Baruch, Go, hide thyself, thou and Jeremiah; and let no man know where ye are.";
hnv[19] = "Then said the princes to Barukh, Go, hide you, you and Yirmeyahu; and let no man know where you are.";
vul[19] = "et dixerunt principes ad Baruch vade et abscondere tu et Hieremias et nemo sciat ubi sitis";
kjv[20] = "And they went in to the king into the court, but they laid up the roll in the chamber of Elishama the scribe, and told all the words in the ears of the king.";
rsv[20] = "So they went into the court to the king, having put the scroll in the chamber of Eli\'shama the secretary; and they reported all the words to the king.";
asv[20] = "And they went in to the king into the court; but they had laid up the roll in the chamber of Elishama the scribe; and they told all the words in the ears of the king.";
yng[20] = "And they go in unto the king, to the court, and the roll they have laid up in the chamber of Elishama the scribe, and they declare in the ears of the king all the words.";
dby[20] = "And they went in unto the king into the court, but they laid up the roll in the chamber of Elishama the scribe; and they told all the words in the ears of the king.";
web[20] = "And they went in to the king into the court, but they laid up the roll in the chamber of Elishama the scribe, and told all the words in the ears of the king.";
hnv[20] = "They went in to the king into the court; but they had laid up the scroll in the chamber of Elishama the Sofer; and they told all the words in the ears of the king.";
vul[20] = "et ingressi sunt ad regem in atrium porro volumen commendaverunt in gazofilacio Elisamae scribae et nuntiaverunt audiente rege omnes sermones";
kjv[21] = "So the king sent Jehudi to fetch the roll: and he took it out of Elishama the scribe\'s chamber. And Jehudi read it in the ears of the king, and in the ears of all the princes which stood beside the king.";
rsv[21] = "Then the king sent Jehu\'di to get the scroll, and he took it from the chamber of Eli\'shama the secretary; and Jehu\'di read it to the king and all the princes who stood beside the king.";
asv[21] = "So the king sent Jehudi to fetch the roll; and he took it out of the chamber of Elishama the scribe. And Jehudi read it in the ears of the king, and in the ears of all the princes that stood beside the king.";
yng[21] = "And the king sendeth Jehudi to take the roll, and he taketh it out of the chamber of Elishama the scribe, and Jehudi readeth it in the ears of the king, and in the ears of all the heads who are standing by the king;";
dby[21] = "And the king sent Jehudi to fetch the roll, and he fetched it out of the chamber of Elishama the scribe. And Jehudi read it in the ears of the king, and in the ears of all the princes that stood beside the king.";
web[21] = "So the king sent Jehudi to bring the roll: and he took it out of the chamber of Elishama, the scribe. And Jehudi read it in the ears of the king, and in the ears of all the princes who stood beside the king.";
hnv[21] = "So the king sent Yehudi to get the scroll; and he took it out of the chamber of Elishama the Sofer. Yehudi read it in the ears of the king, and in the ears of all the princes who stood beside the king.";
vul[21] = "misitque rex Iudi ut sumeret volumen qui tollens illud de gazofilacio Elisamae scribae legit audiente rege et universis principibus qui stabant circa regem";
kjv[22] = "Now the king sat in the winterhouse in the ninth month: and [there was a fire] on the hearth burning before him.";
rsv[22] = "It was the ninth month, and the king was sitting in the winter house and there was a fire burning in the brazier before him.";
asv[22] = "Now the king was sitting in the winter-house in the ninth month: and [there was a fire in] the brazier burning before him.";
yng[22] = "and the king is sitting in the winter-house, in the ninth month, and the stove before him is burning,";
dby[22] = "Now the king was sitting in the winter-house in the ninth month, and with the fire-pan burning before him.";
web[22] = "Now the king sat in the winter-house in the ninth month: and [there was a fire] on the hearth burning before him.";
hnv[22] = "Now the king was sitting in the winter-house in the ninth month: and [there was a fire in] the brazier burning before him.";
vul[22] = "rex autem sedebat in domo hiemali in mense nono et posita erat arula coram eo plena prunis";
kjv[23] = "And it came to pass, [that] when Jehudi had read three or four leaves, he cut it with the penknife, and cast [it] into the fire that [was] on the hearth, until all the roll was consumed in the fire that [was] on the hearth.";
rsv[23] = "As Jehu\'di read three or four columns, the king would cut them off with a penknife and throw them into the fire in the brazier, until the entire scroll was consumed in the fire that was in the brazier.";
asv[23] = "And it came to pass, when Jehudi had read three or four leaves, that [the king] cut it with the penknife, and cast it into the fire that was in the brazier, until all the roll was consumed in the fire that was in the brazier.";
yng[23] = "and it cometh to pass, when Jehudi readeth three or four leaves, he cutteth it out with the scribe\'s knife, and hath cast unto the fire, that [is] on the stove, till the consumption of all the roll by the fire that [is] on the stove.";
dby[23] = "And it came to pass, that when Jehudi had read three or four columns, he cut it with the scribe\'s knife, and cast it into the fire that was in the pan until all the roll was consumed in the fire that was in the pan.";
web[23] = "And it came to pass, [that] when Jehudi had read three or four leaves, he cut it with the scribe\'s pen-knife, and cast [it] into the fire that [was] on the hearth, until all the roll was consumed in the fire that [was] on the hearth.";
hnv[23] = "It happened, when Yehudi had read three or four leaves, that [the king] cut it with the penknife, and cast it into the fire that was in the brazier, until all the scroll was consumed in the fire that was in the brazier.";
vul[23] = "cumque legisset Iudi tres pagellas vel quattuor scidit illud scalpello scribae et proiecit in igne qui erat super arulam donec consumeretur omne volumen igni qui erat in arula";
kjv[24] = "Yet they were not afraid, nor rent their garments, [neither] the king, nor any of his servants that heard all these words.";
rsv[24] = "Yet neither the king, nor any of his servants who heard all these words, was afraid, nor did they rend their garments.";
asv[24] = "And they were not afraid, nor rent their garments, neither the king, nor any of his servants that heard all these words.";
yng[24] = "And the king and all his servants who are hearing all these words have not been afraid, nor rent their garments.";
dby[24] = "And they were not afraid, nor rent their garments, [neither] the king nor any of his servants that heard all these words.";
web[24] = "Yet they were not afraid, nor rent their garments, [neither] the king, nor any of his servants that heard all these words.";
hnv[24] = "They were not afraid, nor tore their garments, neither the king, nor any of his servants who heard all these words.";
vul[24] = "et non timuerunt neque sciderunt vestimenta sua rex et omnes servi eius qui audierunt universos sermones istos";
kjv[25] = "Nevertheless Elnathan and Delaiah and Gemariah had made intercession to the king that he would not burn the roll: but he would not hear them.";
rsv[25] = "Even when Elna\'than and Delai\'ah and Gemari\'ah urged the king not to burn the scroll, he would not listen to them.";
asv[25] = "Moreover Elnathan and Delaiah and Gemariah had made intercession to the king that he would not burn the roll; but he would not hear them.";
yng[25] = "And also Elnathan, and Delaiah, and Gemariah have interceded with the king not to burn the roll, and he hath not hearkened unto them.";
dby[25] = "Moreover, Elnathan and Delaiah and Gemariah had made intercession to the king that he would not burn the roll; but he would not hear them.";
web[25] = "Nevertheless Elnathan and Delaiah and Gemariah had made intercession to the king that he would not burn the roll: but he would not hear them.";
hnv[25] = "Moreover Elnatan and Delayah and Gemaryah had made intercession to the king that he would not burn the scroll; but he would not hear them.";
vul[25] = "verumtamen Elnathan et Dalaias et Gamarias contradixerunt regi ne conbureret librum et non audivit eos";
kjv[26] = "But the king commanded Jerahmeel the son of Hammelech, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet: but the LORD hid them.";
rsv[26] = "And the king commanded Jerah\'meel the king\'s son and Serai\'ah the son of Az\'ri-el and Shelemi\'ah the son of Abdeel to seize Baruch the secretary and Jeremiah the prophet, but the LORD hid them.";
asv[26] = "And the king commanded Jerahmeel the king\'s son, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet; but Jehovah hid them.";
yng[26] = "And the king commandeth Jerahmeel son of Hammelek, and Seraiah son of Azriel, and Shelemiah son of Abdeel, to take Baruch the scribe, and Jeremiah the prophet, and Jehovah doth hide them.";
dby[26] = "And the king commanded Jerahmeel the son of Hammelech, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet; but Jehovah hid them.";
web[26] = "But the king commanded Jerahmeel the son of Hammelech, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet: but the LORD hid them.";
hnv[26] = "The king commanded Yerachme\'el the king\'s son, and Serayah the son of `Azri\'el, and Shelemyahu the son of `Avde\'el, to take Barukh the Sofer and Yirmeyahu the prophet; but the LORD hid them.";
vul[26] = "et praecepit rex Hieremahel filio Ammelech et Saraiae filio Ezrihel et Selemiae filio Abdehel ut conprehenderent Baruch scribam et Hieremiam prophetam abscondit autem eos Dominus";
kjv[27] = "Then the word of the LORD came to Jeremiah, after that the king had burned the roll, and the words which Baruch wrote at the mouth of Jeremiah, saying,";
rsv[27] = "Now, after the king had burned the scroll with the words which Baruch wrote at Jeremiah\'s dictation, the word of the LORD came to Jeremiah:";
asv[27] = "Then the word of Jehovah came to Jeremiah, after that the king had burned the roll, and the words which Baruch wrote at the mouth of Jeremiah, saying,";
yng[27] = "And there is a word of Jehovah unto Jeremiah -- after the king\'s burning the roll, even the words that Baruch hath written from the mouth of Jeremiah -- saying:";
dby[27] = "And after that the king had burned the roll, and the words that Baruch wrote at the mouth of Jeremiah, the word of Jehovah came to Jeremiah, saying,";
web[27] = "Then the word of the LORD came to Jeremiah, after that the king had burned the roll, and the words which Baruch wrote at the mouth of Jeremiah, saying,";
hnv[27] = "Then the word of the LORD came to Yirmeyahu, after that the king had burned the scroll, and the words which Barukh wrote at the mouth of Yirmeyahu, saying,";
vul[27] = "et factum est verbum Domini ad Hieremiam postquam conbuserat rex volumen et sermones quos scripserat Baruch ex ore Hieremiae dicens";
kjv[28] = "Take thee again another roll, and write in it all the former words that were in the first roll, which Jehoiakim the king of Judah hath burned.";
rsv[28] = "&quot;Take another scroll and write on it all the former words that were in the first scroll, which Jehoi\'akim the king of Judah has burned.";
asv[28] = "Take thee again another roll, and write in it all the former words that were in the first roll, which Jehoiakim the king of Judah hath burned.";
yng[28] = "`Turn, take to thee another roll, and write on it all the former words that were on the first roll, that Jehoiakim king of Judah burnt,";
dby[28] = "Take thee again another roll, and write in it all the former words that were in the first roll which Jehoiakim the king of Judah hath burned.";
web[28] = "Take thee again another roll, and write in it all the former words that were in the first roll, which Jehoiakim king of Judah hath burned.";
hnv[28] = "Take again another scroll, and write in it all the former words that were in the first scroll, which Yehoiakim the king of Yehudah has burned.";
vul[28] = "rursum tolle volumen aliud et scribe in eo omnes sermones priores qui erant in volumine primo quod conbusit Ioachim rex Iuda";
kjv[29] = "And thou shalt say to Jehoiakim king of Judah, Thus saith the LORD; Thou hast burned this roll, saying, Why hast thou written therein, saying, The king of Babylon shall certainly come and destroy this land, and shall cause to cease from thence man and beast?";
rsv[29] = "And concerning Jehoi\'akim king of Judah you shall say, \'Thus says the LORD, You have burned this scroll, saying, &quot;Why have you written in it that the king of Babylon will certainly come and destroy this land, and will cut off from it man and beast?&quot;";
asv[29] = "And concerning Jehoiakim king of Judah thou shalt say, Thus saith Jehovah: Thou hast burned this roll, saying, Why hast thou written therein, saying, The king of Babylon shall certainly come and destroy this land, and shall cause to cease from thence man and beast?";
yng[29] = "and unto Jehoiakim king of Judah thou dost say: Thus said Jehovah, Thou hast burnt this roll, saying, Wherefore hast thou written on it, saying, The king of Babylon surely cometh in, and hath destroyed this land, and caused to cease from it man and beast?";
dby[29] = "And thou shalt say to Jehoiakim king of Judah, Thus saith Jehovah: Thou hast burned this roll, saying, Why hast thou written therein, saying, The king of Babylon shall certainly come and destroy this land, and shall cause to cease from it man and beast?";
web[29] = "And thou shalt say to Jehoiakim king of Judah, Thus saith the LORD; Thou hast burned this roll, saying, Why hast thou written therein, saying, The king of Babylon shall certainly come and destroy this land, and shall cause to cease from thence man and beast?";
hnv[29] = " Concerning Yehoiakim king of Yehudah you shall say, Thus says the LORD: You have burned this scroll, saying, Why have you written therein, saying, The king of Bavel shall certainly come and destroy this land, and shall cause to cease from there man and animal?";
vul[29] = "et ad Ioachim regem Iuda dices haec dicit Dominus tu conbusisti volumen illud dicens quare scripsisti in eo adnuntians festinus veniet rex Babylonis et vastabit terram hanc et cessare faciet ex illa hominem et iumentum";
kjv[30] = "Therefore thus saith the LORD of Jehoiakim king of Judah; He shall have none to sit upon the throne of David: and his dead body shall be cast out in the day to the heat, and in the night to the frost.";
rsv[30] = "Therefore thus says the LORD concerning Jehoi\'akim king of Judah, He shall have none to sit upon the throne of David, and his dead body shall be cast out to the heat by day and the frost by night.";
asv[30] = "Therefore thus saith Jehovah concerning Jehoiakim king of Judah: He shall have none to sit upon the throne of David; and his dead body shall be cast out in the day to the heat, and in the night to the frost.";
yng[30] = "`Therefore, thus said Jehovah, concerning Jehoiakim king of Judah: He hath none sitting on the throne of David, and his carcase is cast out to heat by day, and to cold by night;";
dby[30] = "Therefore thus saith Jehovah concerning Jehoiakim king of Judah: He shall have none to sit upon the throne of David; and his dead body shall be cast out in the day to the heat, and in the night to the frost.";
web[30] = "Therefore thus saith the LORD concerning Jehoiakim king of Judah; He shall have none to sit upon the throne of David: and his dead body shall be cast out in the day to the heat, and in the night to the frost.";
hnv[30] = "Therefore thus says the LORD concerning Yehoiakim king of Yehudah: He shall have none to sit on the throne of David; and his dead body shall be cast out in the day to the heat, and in the night to the frost.";
vul[30] = "propterea haec dicit Dominus contra Ioachim regem Iuda non erit ex eo qui sedeat super solium David et cadaver eius proicietur ad aestum per diem et ad gelu per noctem";
kjv[31] = "And I will punish him and his seed and his servants for their iniquity; and I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Judah, all the evil that I have pronounced against them; but they hearkened not.";
rsv[31] = "And I will punish him and his offspring and his servants for their iniquity; I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Judah, all the evil that I have pronounced against them, but they would not hear.\'&quot;";
asv[31] = "And I will punish him and his seed and his servants for their iniquity; and I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Judah, all the evil that I have pronounced against them, but they hearkened not.";
yng[31] = "and I have charged on him, and on his seed, and on his servants, their iniquity; and I have brought in on them, and on the inhabitants of Jerusalem, and unto the men of Judah, all the evil that I have spoken unto them, and they hearkened not.\'";
dby[31] = "And I will visit their iniquity upon him, and upon his seed, and upon his servants; and I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Judah, all the evil that I have pronounced against them; and they have not hearkened.";
web[31] = "And I will punish him and his seed and his servants for their iniquity; and I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Judah, all the evil that I have pronounced against them; but they hearkened not.";
hnv[31] = "I will punish him and his seed and his servants for their iniquity; and I will bring on them, and on the inhabitants of Yerushalayim, and on the men of Yehudah, all the evil that I have pronounced against them, but they didn\'t listen.";
vul[31] = "et visitabo contra eum et contra semen eius et contra servos eius iniquitates suas et adducam super eos et super habitatores Hierusalem et super viros Iuda omne malum quod locutus sum ad eos et non audierunt";
kjv[32] = "Then took Jeremiah another roll, and gave it to Baruch the scribe, the son of Neriah; who wrote therein from the mouth of Jeremiah all the words of the book which Jehoiakim king of Judah had burned in the fire: and there were added besides unto them many like words.";
rsv[32] = "Then Jeremiah took another scroll and gave it to Baruch the scribe, the son of Neri\'ah, who wrote on it at the dictation of Jeremiah all the words of the scroll which Jehoi\'akim king of Judah had burned in the fire; and many similar words were added to them.";
asv[32] = "Then took Jeremiah another roll, and gave it to Baruch the scribe, the son of Neriah, who wrote therein from the mouth of Jeremiah all the words of the book which Jehoiakim king of Judah had burned in the fire; and there were added besides unto them many like words.";
yng[32] = "And Jeremiah hath taken another roll, and giveth it unto Baruch son of Neriah the scribe, and he writeth on it from the mouth of Jeremiah all the words of the book that Jehoiakim king of Judah hath burnt in the fire; and again there were added unto them many words like these.";
dby[32] = "And Jeremiah took another roll, and gave it to Baruch the scribe, the son of Nerijah; and he wrote therein from the mouth of Jeremiah, all the words of the book that Jehoiakim king of Judah had burned in the fire; and there were added besides unto them many like words.";
web[32] = "Then Jeremiah took another roll, and gave it to Baruch the scribe, the son of Neriah; who wrote therein from the mouth of Jeremiah all the words of the book which Jehoiakim king of Judah had burned in the fire: and there were besides added to them many like words.";
hnv[32] = "Then took Yirmeyahu another scroll, and gave it to Barukh the Sofer, the son of Neriyah, who wrote therein from the mouth of Yirmeyahu all the words of the book which Yehoiakim king of Yehudah had burned in the fire; and there were added besides to them many like words.";
vul[32] = "Hieremias autem tulit volumen aliud et dedit illud Baruch filio Neriae scribae qui scripsit in eo ex ore Hieremiae omnes sermones libri quem conbuserat Ioachim rex Iuda igni et insuper additi sunt sermones multo plures quam ante fuerant";
</script>
