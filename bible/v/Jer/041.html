csb[1] = "In the seventh month, Ishmael son of Nethaniah, son of Elishama, of the royal family and one of the king\'s chief officers, came with ten men to Gedaliah son of Ahikam at Mizpah. They ate a meal together there in Mizpah,";
csb[2] = "but then Ishmael son of Nethaniah and the ten men who were with him got up and struck down Gedaliah son of Ahikam, son of Shaphan, with the sword; he killed the one the king of Babylon had appointed in the land.";
csb[3] = "Ishmael also struck down all the Judeans who were with Gedaliah at Mizpah, as well as the Chaldean soldiers who were there.";
csb[4] = "On the day after he had killed Gedaliah, when no one knew yet,";
csb[5] = "eighty men came from Shechem, Shiloh, and Samaria who had shaved their beards, torn their clothes, and gashed themselves, and who were carrying grain and incense offerings to bring to the temple of the LORD.";
csb[6] = "Ishmael son of Nethaniah came out of Mizpah to meet them, weeping as he came. When he encountered them, he said, &quot;Come to Gedaliah son of Ahikam! &quot;";
csb[7] = "But when they came into the city, Ishmael son of Nethaniah and the men with him slaughtered them and threw them into a cistern.";
csb[8] = "However, there were ten men among them who said to Ishmael, &quot;Don\'t kill us, for we have hidden treasure in the field -- wheat, barley, oil, and honey! &quot; So he stopped and did not kill them along with their companions.";
csb[9] = "Now the cistern where Ishmael had thrown all the corpses of the men he had struck down was a large one that King Asa had made in the encounter with King Baasha of Israel. Ishmael son of Nethaniah filled it with the slain.";
csb[10] = "Then Ishmael took captive all the rest of the people of Mizpah including the daughters of the king -- all those who remained in Mizpah over whom Nebuzaradan, captain of the guards, had appointed Gedaliah son of Ahikam. Ishmael son of Nethaniah took them captive and set off to cross over to the Ammonites.";
csb[11] = "When Johanan son of Kareah and all the commanders of the armies with him heard of all the evil that Ishmael son of Nethaniah had done,";
csb[12] = "they took all their men and went to fight with Ishmael son of Nethaniah. They found him by the great pool in Gibeon.";
csb[13] = "When all the people held by Ishmael saw Johanan son of Kareah and all the commanders of the army with him, they rejoiced.";
csb[14] = "All the people whom Ishmael had taken captive from Mizpah turned around and rejoined Johanan son of Kareah.";
csb[15] = "But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites.";
csb[16] = "Johanan son of Kareah and all the commanders of the armies with him then took from Mizpah all the remnant of the people whom he had recovered from Ishmael son of Nethaniah after Ishmael had killed Gedaliah son of Ahikam -- men, soldiers, women, children, and court officials whom he brought back from Gibeon.";
csb[17] = "They left, stopping in Geruth Chimham, which is near Bethlehem, in order to make their way into Egypt,";
csb[18] = "away from the Chaldeans. For they feared them because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam, whom the king of Babylon had appointed over the land.";
kjv[1] = "Now it came to pass, [that] when all the people which [were] with Ishmael saw Johanan the son of Kareah, and all the captains of the forces that [were] with him, then they were glad.";
rsv[1] = "In the seventh month, Ish\'mael the son of Nethani\'ah, son of Eli\'shama, of the royal family, one of the chief officers of the king, came with ten men to Gedali\'ah the son of Ahi\'kam, at Mizpah. As they ate bread together there at Mizpah,";
asv[1] = "Now it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal and [one of] the chief officers of the king, and ten men with him, came unto Gedaliah the son of Ahikam to Mizpah; and there they did eat bread together in Mizpah.";
yng[1] = "And it cometh to pass, in the seventh month, come hath Ishmael son of Nethaniah, son of Elishama, of the seed royal, and of the chiefs of the king, and ten men with him, unto Gedaliah son of Ahikam, to Mizpah, and they eat there bread together in Mizpah.";
dby[1] = "And it came to pass in the seventh month, that Ishmael the son of Nethaniah the son of Elishama, of the royal seed, and [one] of the king\'s chief men, and ten men with him, came to Gedaliah the son of Ahikam unto Mizpah, and there they ate bread together, in Mizpah.";
web[1] = "Now it came to pass in the seventh month, [that] Ishmael the son of Nethaniah the son of Elishama, of the seed royal, and the princes of the king, even ten men with him, came to Gedaliah the son of Ahikam to Mizpah; and there they ate bread together in Mizpah.";
hnv[1] = "Now it happened in the seventh month, that Yishma\'el the son of Netanyah, the son of Elishama, of the seed royal and [one of] the chief officers of the king, and ten men with him, came to Gedalyahu the son of Achikam to Mitzpah; and there they ate bread together in Mitzpah.";
vul[1] = "et factum est in mense septimo venit Ismahel filius Nathaniae filii Elisama de semine regali et optimates regis et decem viri cum eo ad Godoliam filium Ahicam in Masphat et comederunt ibi panes simul in Masphat";
kjv[2] = "So all the people that Ishmael had carried away captive from Mizpah cast about and returned, and went unto Johanan the son of Kareah.";
rsv[2] = "Ish\'mael the son of Nethani\'ah and the ten men with him rose up and struck down Gedali\'ah the son of Ahi\'kam, son of Shaphan, with the sword, and killed him, whom the king of Babylon had appointed governor in the land.";
asv[2] = "Then arose Ishmael the son of Nethaniah, and the ten men that were with him, and smote Gedaliah the son of Ahikam the son of Shaphan with the sword, and slew him, whom the king of Babylon had made governor over the land.";
yng[2] = "And Ishmael son of Nethaniah riseth, and the ten men who have been with him, and they smite Gedaliah son of Ahikam, son of Shaphan, with the sword, and he putteth him to death whom the king of Babylon hath appointed over the land.";
dby[2] = "And Ishmael the son of Nethaniah arose, and the ten men that were with him, and smote Gedaliah the son of Ahikam the son of Shaphan with the sword, and killed him, whom the king of Babylon had appointed over the land.";
web[2] = "Then arose Ishmael the son of Nethaniah, and the ten men that were with him, and smote Gedaliah the son of Ahikam, the son of Shaphan with the sword, and slew him, whom the king of Babylon had made governor over the land.";
hnv[2] = "Then arose Yishma\'el the son of Netanyah, and the ten men who were with him, and struck Gedalyahu the son of Achikam the son of Shafan with the sword, and killed him, whom the king of Bavel had made governor over the land.";
vul[2] = "surrexit autem Ismahel filius Nathaniae et decem viri qui erant cum eo et percusserunt Godoliam filium Ahicam filii Saphan gladio et interfecerunt eum quem praefecerat rex Babylonis terrae";
kjv[3] = "But Ishmael the son of Nethaniah escaped from Johanan with eight men, and went to the Ammonites.";
rsv[3] = "Ish\'mael also slew all the Jews who were with Gedali\'ah at Mizpah, and the Chalde\'an soldiers who happened to be there.";
asv[3] = "Ishmael also slew all the Jews that were with him, [to wit], with Gedaliah, at Mizpah, and the Chaldeans that were found there, the men of war.";
yng[3] = "And all the Jews who have been with him, with Gedaliah, in Mizpah, and the Chaldeans who have been found there -- the men of war -- hath Ishmael smitten.";
dby[3] = "And Ishmael smote all the Jews that were with him, with Gedaliah, at Mizpah, and the Chaldeans that were found there, the men of war.";
web[3] = "Ishmael also slew all the Jews that were with him, [even] with Gedaliah, at Mizpah, and the Chaldeans that were found there, [and] the men of war.";
hnv[3] = "Yishma\'el also killed all the Yehudim who were with him, [to wit], with Gedalyahu, at Mitzpah, and the Kasdim who were found there, the men of war.";
vul[3] = "omnes quoque Iudaeos qui erant cum Godolia in Masphat et Chaldeos qui repperti sunt ibi et viros bellatores percussit Ismahel";
kjv[4] = "Then took Johanan the son of Kareah, and all the captains of the forces that [were] with him, all the remnant of the people whom he had recovered from Ishmael the son of Nethaniah, from Mizpah, after [that] he had slain Gedaliah the son of Ahikam, [even] mighty men of war, and the women, and the children, and the eunuchs, whom he had brought again from Gibeon:";
rsv[4] = "On the day after the murder of Gedali\'ah, before any one knew of it,";
asv[4] = "And it came to pass the second day after he had slain Gedaliah, and no man knew it,";
yng[4] = "And it cometh to pass, on the second day of the putting of Gedaliah to death, (and no one hath known,)";
dby[4] = "And it came to pass the second day after he had killed Gedaliah, and no man knew it,";
web[4] = "And it came to pass the second day after he had slain Gedaliah, and no man knew [it],";
hnv[4] = "It happened the second day after he had killed Gedalyahu, and no man knew it,";
vul[4] = "secundo autem die postquam occiderat Godoliam nullo adhuc sciente";
kjv[5] = "And they departed, and dwelt in the habitation of Chimham, which is by Bethlehem, to go to enter into Egypt,";
rsv[5] = "eighty men arrived from Shechem and Shiloh and Sama\'ria, with their beards shaved and their clothes torn, and their bodies gashed, bringing cereal offerings and incense to present at the temple of the LORD.";
asv[5] = "that there came men from Shechem, from Shiloh, and from Samaria, even fourscore men, having their beards shaven and their clothes rent, and having cut themselves, with meal-offerings and frankincense in their hand, to bring them to the house of Jehovah.";
yng[5] = "that men come in from Shechem, from Shiloh, and from Samaria -- eighty men -- with shaven beards, and rent garments, and cutting themselves, and an offering and frankincense in their hand, to bring in to the house of Jehovah.";
dby[5] = "that there came men from Shechem, from Shiloh, and from Samaria, eighty men, having their beards shaven and their clothes rent, and having cut themselves; with oblations and incense in their hand, to bring them to the house of Jehovah.";
web[5] = "That there came men from Shechem, from Shiloh, and from Samaria, [even] eighty men, having their beards shaven, and their clothes rent, and having cut themselves, with offerings and incense in their hand, to bring [them] to the house of the LORD.";
hnv[5] = " that there came men from Shekhem, from Shiloh, and from Shomron, even eighty men, having their beards shaved and their clothes torn, and having cut themselves, with meal-offerings and frankincense in their hand, to bring them to the house of the LORD.";
vul[5] = "venerunt viri de Sychem et de Silo et de Samaria octoginta viri rasi barbam et scissis vestibus et squalentes munera et tus habebant in manu ut offerrent in domo Domini";
kjv[6] = "Because of the Chaldeans: for they were afraid of them, because Ishmael the son of Nethaniah had slain Gedaliah the son of Ahikam, whom the king of Babylon made governor in the land.";
rsv[6] = "And Ish\'mael the son of Nethani\'ah came out from Mizpah to meet them, weeping as he came. As he met them, he said to them, &quot;Come in to Gedali\'ah the son of Ahi\'kam.&quot;";
asv[6] = "And Ishmael the son of Nethaniah went forth from Mizpah to meet them, weeping all along as he went: and it came to pass, as he met them, he said unto them, Come to Gedaliah the son of Ahikam.";
yng[6] = "And Ishmael son of Nethaniah goeth forth to meet them, from Mizpah, going on and weeping, and it cometh to pass, at meeting them, that he saith unto them, `Come in unto Gedaliah son of Ahikam.\'";
dby[6] = "And Ishmael the son of Nethaniah went forth from Mizpah to meet them, weeping all along as he went; and it came to pass when he met them, he said unto them, Come to Gedaliah the son of Ahikam.";
web[6] = "And Ishmael the son of Nethaniah went forth from Mizpah to meet them, weeping all along as he went: and it came to pass, as he met them, he said to them, Come to Gedaliah the son of Ahikam.";
hnv[6] = "Yishma\'el the son of Netanyah went forth from Mitzpah to meet them, weeping all along as he went: and it happened, as he met them, he said to them, Come to Gedalyahu the son of Achikam.";
vul[6] = "egressus ergo Ismahel filius Nathaniae in occursum eorum de Masphat incedens et plorans ibat cum autem occurrisset eis dixit ad eos venite ad Godoliam filium Ahicam";
kjv[7] = "Now it came to pass in the seventh month, [that] Ishmael the son of Nethaniah the son of Elishama, of the seed royal, and the princes of the king, even ten men with him, came unto Gedaliah the son of Ahikam to Mizpah; and there they did eat bread together in Mizpah.";
rsv[7] = "When they came into the city, Ish\'mael the son of Nethani\'ah and the men with him slew them, and cast them into a cistern.";
asv[7] = "And it was so, when they came into the midst of the city, that Ishmael the son of Nethaniah slew them, [and cast them] into the midst of the pit, he, and the men that were with him.";
yng[7] = "And it cometh to pass, at their coming in unto the midst of the city, that Ishmael son of Nethaniah doth slaughter them, at the midst of the pit, he and the men who [are] with him.";
dby[7] = "And it was so, when they came into the midst of the city, that Ishmael the son of Nethaniah, he and the men that were with him, slew them, [and cast them] into the midst of the pit.";
web[7] = "And it was [so], when they came into the midst of the city, that Ishmael the son of Nethaniah slew them, [and cast them] into the midst of the pit, he, and the men that [were] with him.";
hnv[7] = "It was so, when they came into the midst of the city, that Yishma\'el the son of Netanyah killed them, [and cast them] into the midst of the pit, he, and the men who were with him.";
vul[7] = "qui cum venissent ad medium civitatis interfecit eos Ismahel filius Nathaniae circa medium laci ipse et viri qui erant cum eo";
kjv[8] = "Then arose Ishmael the son of Nethaniah, and the ten men that were with him, and smote Gedaliah the son of Ahikam the son of Shaphan with the sword, and slew him, whom the king of Babylon had made governor over the land.";
rsv[8] = "But there were ten men among them who said to Ish\'mael, &quot;Do not kill us, for we have stores of wheat, barley, oil, and honey hidden in the fields.&quot; So he refrained and did not kill them with their companions.";
asv[8] = "But ten men were found among them that said unto Ishmael, Slay us not; for we have stores hidden in the field, of wheat, and of barley, and of oil, and of honey. So he forbare, and slew them not among their brethren.";
yng[8] = "And ten men have been found among them, and they say unto Ishmael, `Do not put us to death, for we have things hidden in the field -- wheat, and barley, and oil, and honey.\' And he forbeareth, and hath not put them to death in the midst of their brethren.";
dby[8] = "But ten men were found among them that said unto Ishmael, Do not kill us, for we have hidden stores in the field, of wheat, and of barley, and of oil, and of honey. So he forbore, and did not kill them among their brethren.";
web[8] = "But ten men were found among them that said to Ishmael, Slay us not: for we have treasures in the field, of wheat, and of barley, and of oil, and of honey. So he forbore, and slew them not among their brethren.";
hnv[8] = "But ten men were found among those who said to Yishma\'el, Don\'t kill us; for we have stores hidden in the field, of wheat, and of barley, and of oil, and of honey. So he stopped, and didn\'t kill them among their brothers.";
vul[8] = "decem autem viri repperti sunt inter eos qui dixerunt ad Ismahel noli occidere nos quia habemus thesauros in agro frumenti et hordei et olei et mellis et cessavit et non interfecit eos cum fratribus suis";
kjv[9] = "Ishmael also slew all the Jews that were with him, [even] with Gedaliah, at Mizpah, and the Chaldeans that were found there, [and] the men of war.";
rsv[9] = "Now the cistern into which Ish\'mael cast all the bodies of the men whom he had slain was the large cistern which King Asa had made for defense against Ba\'asha king of Israel; Ish\'mael the son of Nethani\'ah filled it with the slain.";
asv[9] = "Now the pit wherein Ishmael cast all the dead bodies of the men whom he had slain, by the side of Gedaliah (the same was that which Asa the king had made for fear of Baasha king of Israel), Ishmael the son of Nethaniah filled it with them that were slain.";
yng[9] = "And the pit whither Ishmael hath cast all the carcases of the men whom he hath smitten along with Gedaliah, is that which the king Asa made because of Baasha king of Israel -- it hath Ishmael son of Nethaniah filled with the pierced.";
dby[9] = "And the pit into which Ishmael had cast all the dead bodies of the men whom he had slain by the side of Gedaliah was the one which Asa the king had made for fear of Baasha king of Israel: Ishmael the son of Nethaniah filled it with the slain.";
web[9] = "Now the pit into which Ishmael had cast all the dead bodies of the men, whom he had slain because of Gedaliah, [was] that which Asa the king had made for fear of Baasha king of Israel: [and] Ishmael the son of Nethaniah filled it with [them that were] slain.";
hnv[9] = "Now the pit in which Yishma\'el cast all the dead bodies of the men whom he had killed, by the side of Gedalyahu (the same was who which Asa the king had made for fear of Ba`sha king of Yisra\'el,) Yishma\'el the son of Netanyah filled it with those who were killed.";
vul[9] = "lacus autem in quem proiecerat Ismahel omnia cadavera virorum quos percussit propter Godoliam ipse est quem fecit rex Asa propter Baasa regem Israhel ipsum replevit Ismahel filius Nathaniae occisis";
kjv[10] = "And it came to pass the second day after he had slain Gedaliah, and no man knew [it],";
rsv[10] = "Then Ish\'mael took captive all the rest of the people who were in Mizpah, the king\'s daughters and all the people who were left at Mizpah, whom Nebu\'zarad\'an, the captain of the guard, had committed to Gedali\'ah the son of Ahi\'kam. Ish\'mael the son of Nethani\'ah took them captive and set out to cross over to the Ammonites.";
asv[10] = "Then Ishmael carried away captive all the residue of the people that were in Mizpah, even the king\'s daughters, and all the people that remained in Mizpah, whom Nebuzaradan the captain of the guard had committed to Gedaliah the son of Ahikam; Ishmael the son of Nethaniah carried them away captive, and departed to go over to the children of Ammon.";
yng[10] = "And Ishmael taketh captive all the remnant of the people who [are] in Mizpah, the daughters of the king, and all the people who are left in Mizpah, whom Nebuzar-Adan, chief of the executioners, hath committed [to] Gedaliah son of Ahikam, and Ishmael son of Nethaniah taketh them captive, and goeth to pass over unto the sons of Ammon.";
dby[10] = "And Ishmael carried away captive all the remnant of the people that were in Mizpah, the king\'s daughters, and all the people that remained in Mizpah, whom Nebuzar-adan the captain of the body-guard had committed to Gedaliah the son of Ahikam: Ishmael the son of Nethaniah carried them away captive, and departed to go over to the children of Ammon.";
web[10] = "Then Ishmael carried away captive all the residue of the people that [were] in Mizpah, [even] the king\'s daughters, and all the people that remained in Mizpah, whom Nebuzar-adan the captain of the guard had committed to Gedaliah the son of Ahikam: and Ishmael the son of Nethaniah carried them away captive, and departed to go over to the Ammonites.";
hnv[10] = "Then Yishma\'el carried away captive all the residue of the people who were in Mitzpah, even the king\'s daughters, and all the people who remained in Mitzpah, whom Nevuzar\'adan the captain of the guard had committed to Gedalyahu the son of Achikam; Yishma\'el the son of Netanyah carried them away captive, and departed to go over to the children of `Ammon.";
vul[10] = "et captivas duxit Ismahel omnes reliquias populi qui erant in Masphat filias regis et universum populum qui remanserat in Masphat quos commendarat Nabuzardan princeps militiae Godoliae filio Ahicam et cepit eos Ismahel filius Nathaniae et abiit ut transiret ad filios Ammon";
kjv[11] = "That there came certain from Shechem, from Shiloh, and from Samaria, [even] fourscore men, having their beards shaven, and their clothes rent, and having cut themselves, with offerings and incense in their hand, to bring [them] to the house of the LORD.";
rsv[11] = "But when Joha\'nan the son of Kare\'ah and all the leaders of the forces with him heard of all the evil which Ish\'mael the son of Nethani\'ah had done,";
asv[11] = "But when Johanan the son of Kareah, and all the captains of the forces that were with him, heard of all the evil that Ishmael the son of Nethaniah had done,";
yng[11] = "And hear doth Johanan son of Kareah, and all the heads of the forces that [are] with him, of all the evil that Ishmael son of Nethaniah hath done,";
dby[11] = "And Johanan the son of Kareah, and all the captains of the forces that were with him, heard of all the evil that Ishmael the son of Nethaniah had done;";
web[11] = "But when Johanan the son of Kareah, and all the captains of the forces that [were] with him, heard of all the evil that Ishmael the son of Nethaniah had done.";
hnv[11] = "But when Yochanan the son of Kareach, and all the captains of the forces who were with him, heard of all the evil that Yishma\'el the son of Netanyah had done,";
vul[11] = "audivit autem Iohanan filius Caree et omnes principes bellatorum qui erant cum eo omne malum quod fecerat Ismahel filius Nathaniae";
kjv[12] = "And Ishmael the son of Nethaniah went forth from Mizpah to meet them, weeping all along as he went: and it came to pass, as he met them, he said unto them, Come to Gedaliah the son of Ahikam.";
rsv[12] = "they took all their men and went to fight against Ish\'mael the son of Nethani\'ah. They came upon him at the great pool which is in Gibeon.";
asv[12] = "then they took all the men, and went to fight with Ishmael the son of Nethaniah, and found him by the great waters that are in Gibeon.";
yng[12] = "and they take all the men, and go to fight with Ishmael son of Nethaniah, and they find him at the great waters that [are] in Gibeon.";
dby[12] = "and they took all the men, and went to fight with Ishmael the son of Nethaniah, and found him by the great waters that are at Gibeon.";
web[12] = "Then they took all the men, and went to fight with Ishmael the son of Nethaniah, and found him by the great waters that [are] in Gibeon.";
hnv[12] = " then they took all the men, and went to fight with Yishma\'el the son of Netanyah, and found him by the great waters that are in Giv`on.";
vul[12] = "et adsumptis universis viris profecti sunt ut bellarent adversum Ismahel filium Nathaniae et invenerunt eum ad aquas Multas quae sunt in Gabaon";
kjv[13] = "And it was [so], when they came into the midst of the city, that Ishmael the son of Nethaniah slew them, [and cast them] into the midst of the pit, he, and the men that [were] with him.";
rsv[13] = "And when all the people who were with Ish\'mael saw Joha\'nan the son of Kare\'ah and all the leaders of the forces with him, they rejoiced.";
asv[13] = "Now it came to pass that, when all the people that were with Ishmael saw Johanan the son of Kareah, and all the captains of the forces that were with him, then they were glad.";
yng[13] = "And it cometh to pass, when all the people who [are] with Ishmael see Johanan son of Kareah, and all the heads of the forces who [are] with him, that they rejoice.";
dby[13] = "And it came to pass when all the people that were with Ishmael saw Johanan the son of Kareah, and all the captains of the forces that were with him, then they were glad.";
web[13] = "Now it came to pass, [that] when all the people who [were] with Ishmael saw Johanan the son of Kareah, and all the captains of the forces that [were] with him, then they were glad.";
hnv[13] = " Now it happened that, when all the people who were with Yishma\'el saw Yochanan the son of Kareach, and all the captains of the forces who were with him, then they were glad.";
vul[13] = "cumque vidisset omnis populus qui erat cum Ismahel Iohanan filium Caree et universos principes bellatorum qui erant cum eo laetati sunt";
kjv[14] = "But ten men were found among them that said unto Ishmael, Slay us not: for we have treasures in the field, of wheat, and of barley, and of oil, and of honey. So he forbare, and slew them not among their brethren.";
rsv[14] = "So all the people whom Ish\'mael had carried away captive from Mizpah turned about and came back, and went to Joha\'nan the son of Kare\'ah.";
asv[14] = "So all the people that Ishmael had carried away captive from Mizpah turned about and came back, and went unto Johanan the son of Kareah.";
yng[14] = "And all the people whom Ishmael hath taken captive from Mizpah turn round, yea, they turn back, and go unto Johanan son of Kareah.";
dby[14] = "And all the people that Ishmael had carried away captive from Mizpah turned about and came back, and went to Johanan the son of Kareah.";
web[14] = "So all the people that Ishmael had carried away captive from Mizpah cast about and returned, and went to Johanan the son of Kareah.";
hnv[14] = "So all the people who Yishma\'el had carried away captive from Mitzpah turned about and came back, and went to Yochanan the son of Kareach.";
vul[14] = "et reversus est omnis populus quem ceperat Ismahel in Masphat reversusque abiit ad Iohanan filium Caree";
kjv[15] = "Now the pit wherein Ishmael had cast all the dead bodies of the men, whom he had slain because of Gedaliah, [was] it which Asa the king had made for fear of Baasha king of Israel: [and] Ishmael the son of Nethaniah filled it with [them that were] slain.";
rsv[15] = "But Ish\'mael the son of Nethani\'ah escaped from Joha\'nan with eight men, and went to the Ammonites.";
asv[15] = "But Ishmael the son of Nethaniah escaped from Johanan with eight men, and went to the children of Ammon.";
yng[15] = "And Ishmael son of Nethaniah hath escaped, with eight men, from the presence of Johanan, and he goeth unto the sons of Ammon.";
dby[15] = "But Ishmael the son of Nethaniah escaped from Johanan with eight men, and went to the children of Ammon.";
web[15] = "But Ishmael the son of Nethaniah escaped from Johanan with eight men, and went to the Ammonites.";
hnv[15] = "But Yishma\'el the son of Netanyah escaped from Yochanan with eight men, and went to the children of `Ammon.";
vul[15] = "Ismahel autem filius Nathaniae fugit cum octo viris a facie Iohanan et abiit ad filios Ammon";
kjv[16] = "Then Ishmael carried away captive all the residue of the people that [were] in Mizpah, [even] the king\'s daughters, and all the people that remained in Mizpah, whom Nebuzaradan the captain of the guard had committed to Gedaliah the son of Ahikam: and Ishmael the son of Nethaniah carried them away captive, and departed to go over to the Ammonites.";
rsv[16] = "Then Joha\'nan the son of Kare\'ah and all the leaders of the forces with him took all the rest of the people whom Ish\'mael the son of Nethani\'ah had carried away captive from Mizpah after he had slain Gedali\'ah the son of Ahi\'kam--soldiers, women, children, and eunuchs, whom Joha\'nan brought back from Gibeon.";
asv[16] = "Then took Johanan the son of Kareah, and all the captains of the forces that were with him, all the remnant of the people whom he had recovered from Ishmael the son of Nethaniah, from Mizpah, after that he had slain Gedaliah the son of Ahikam, [to wit], the men of war, and the women, and the children, and the eunuchs, whom he had brought back from Gibeon.";
yng[16] = "And Johanan son of Kareah, and all the heads of the forces who [are] with him, take all the remnant of the people whom he hath brought back from Ishmael son of Nethaniah, from Mizpah -- after he had smitten Gedaliah son of Ahikam -- mighty ones, men of war, and women, and infants, and eunuchs, whom he had brought back from Gibeon,";
dby[16] = "Then Johanan the son of Kareah, and all the captains of the forces that were with him, took all the remnant of the people whom he had recovered from Ishmael the son of Nethaniah, from Mizpah, after he had slain Gedaliah the son of Ahikam, the mighty men of war, and the women, and the children, and the eunuchs, whom he had brought again from Gibeon;";
web[16] = "Then Johanan the son of Kareah, and all the captains of the forces that [were] with him, took all the remnant of the people whom he had recovered from Ishmael the son of Nethaniah, from Mizpeh, after [that] he had slain Gedaliah the son of Ahikam, [even] mighty men of war, and the women, and the children, and the eunuchs, whom he had brought again from Gibeon.";
hnv[16] = "Then took Yochanan the son of Kareach, and all the captains of the forces who were with him, all the remnant of the people whom he had recovered from Yishma\'el the son of Netanyah, from Mitzpah, after that he had killed Gedalyahu the son of Achikam, [to wit], the men of war, and the women, and the children, and the eunuchs, whom he had brought back from Giv`on:";
vul[16] = "tulit ergo Iohanan filius Caree et omnes principes bellatorum qui erant cum eo universas reliquias vulgi quas reduxerat ab Ismahel filio Nathaniae de Masphat postquam percussit Godoliam filium Ahicam fortes viros ad proelium et mulieres et pueros et eunuchos quos reduxerat de Gabaon";
kjv[17] = "But when Johanan the son of Kareah, and all the captains of the forces that [were] with him, heard of all the evil that Ishmael the son of Nethaniah had done,";
rsv[17] = "And they went and stayed at Geruth Chimham near Bethlehem, intending to go to Egypt";
asv[17] = "And they departed, and dwelt in Geruth Chimham, which is by Beth-lehem, to go to enter into Egypt,";
yng[17] = "and they go and abide in the habitations of Chimham, that [are] near Beth-Lehem, to go to enter Egypt,";
dby[17] = "and they departed, and dwelt at Geruth-Chimham, which is by Bethlehem, to go to enter into Egypt,";
web[17] = "And they departed, and dwelt in the habitation of Chimham, which [is] by Beth-lehem, to go to enter into Egypt,";
hnv[17] = "and they departed, and lived in Gerut-Kimaham, which is by Beit-Lechem, to go to enter into Mitzrayim,";
vul[17] = "et abierunt et sederunt peregrinantes in Chamaam quae est iuxta Bethleem ut pergerent et introirent Aegyptum";
kjv[18] = "Then they took all the men, and went to fight with Ishmael the son of Nethaniah, and found him by the great waters that [are] in Gibeon.";
rsv[18] = "because of the Chalde\'ans; for they were afraid of them, because Ish\'mael the son of Nethani\'ah had slain Gedali\'ah the son of Ahi\'kam, whom the king of Babylon had made governor over the land.";
asv[18] = "because of the Chaldeans; for they were afraid of them, because Ishmael the son of Nethaniah had slain Gedaliah the son of Ahikam, whom the king of Babylon made governor over the land.";
yng[18] = "from the presence of the Chaldeans, for they have been afraid of them, for Ishmael son of Nethaniah had smitten Gedaliah son of Ahikam, whom the king of Babylon had appointed over the land.";
dby[18] = "because of the Chaldeans; for they feared them, because Ishmael the son of Nethaniah had smitten Gedaliah the son of Ahikam, whom the king of Babylon had appointed over the land.";
web[18] = "Because of the Chaldeans: for they were afraid of them, because Ishmael the son of Nethaniah had slain Gedaliah the son of Ahikam, whom the king of Babylon made governor in the land.";
hnv[18] = "because of the Kasdim; for they were afraid of them, because Yishma\'el the son of Netanyah had killed Gedalyahu the son of Achikam, whom the king of Bavel made governor over the land.";
vul[18] = "a facie Chaldeorum timebant enim eos quia percusserat Ismahel filius Nathaniae Godoliam filium Ahicam quem praeposuerat rex Babylonis in terra Iuda";
</script>
