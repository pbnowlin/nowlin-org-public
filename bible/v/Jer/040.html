csb[1] = "This is the word that came to Jeremiah from the LORD after Nebuzaradan, captain of the guards, released him at Ramah. When he found him, he was bound in chains with all the exiles of Jerusalem and Judah who were being exiled to Babylon.";
csb[2] = "The captain of the guards took Jeremiah and said to him, &quot;The LORD your God decreed this disaster on this place,";
csb[3] = "&quot;and the LORD has fulfilled it. He has done just what he decreed. Because you people have sinned against the LORD and have not obeyed him, this thing has happened.";
csb[4] = "&quot;Now pay attention: Today I am setting you free from the chains that were on your hands. If it pleases you to come with me to Babylon, come, and I will take care of you. But if it seems wrong to you to come with me to Babylon, go no farther. Look -- the whole land is in front of you. Wherever it seems good and right for you to go, go there.&quot;";
csb[5] = "When Jeremiah had not yet turned to go, Nebuzaradan said to him, &quot;Return to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and stay with him among the people or go wherever it seems right for you to go.&quot; So the captain of the guards gave him a ration and a gift and released him.";
csb[6] = "Jeremiah therefore went to Gedaliah son of Ahikam at Mizpah, and he stayed with him among the people who remained in the land.";
csb[7] = "All the commanders of the armies that were in the countryside -- they and their men -- heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land. He had been put in charge of the men, women, and children from among the poorest of the land, who had not been deported to Babylon.";
csb[8] = "So they came to Gedaliah at Mizpah. The commanders included Ishmael son of Nethaniah, Johanan and Jonathan the sons of Kareah, Seraiah son of Tanhumeth, the sons of Ephai the Netophathite, and Jezaniah son of the Maacathite -- they and their men.";
csb[9] = "Gedaliah son of Ahikam, son of Shaphan, swore an oath to them and their men, assuring them, &quot;Don\'t be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.";
csb[10] = "&quot;As for me, I am going to live in Mizpah to represent you before the Chaldeans who come to us. As for you, gather wine, summer fruit, and oil, place them in your storage jars, and live in the cities you have captured.&quot;";
csb[11] = "When all the Judeans in Moab and among the Ammonites and in Edom and in all the other lands also heard that the king of Babylon had left a remnant in Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them,";
csb[12] = "they all returned from all the places where they had been banished and came to the land of Judah, to Gedaliah at Mizpah, and harvested a great amount of wine and summer fruit.";
csb[13] = "Meanwhile, Johanan son of Kareah and all the commanders of the armies in the countryside came to Gedaliah at Mizpah";
csb[14] = "and warned him, &quot;Don\'t you realize that Baalis, king of the Ammonites, has sent Ishmael son of Nethaniah to kill you? &quot; But Gedaliah son of Ahikam would not believe them.";
csb[15] = "Then Johanan son of Kareah suggested to Gedaliah in private at Mizpah, &quot;Let me go kill Ishmael son of Nethaniah. No one will know it. Why should he kill you and allow all of Judah that has gathered around you to scatter and the remnant of Judah to perish? &quot;";
csb[16] = "But Gedaliah son of Ahikam responded to Johanan son of Kareah, &quot;Don\'t do that! What you\'re saying about Ishmael is a lie.&quot;";
kjv[1] = "The word that came to Jeremiah from the LORD, after that Nebuzaradan the captain of the guard had let him go from Ramah, when he had taken him being bound in chains among all that were carried away captive of Jerusalem and Judah, which were carried away captive unto Babylon.";
rsv[1] = "The word that came to Jeremiah from the LORD after Nebu\'zarad\'an the captain of the guard had let him go from Ramah, when he took him bound in chains along with all the captives of Jerusalem and Judah who were being exiled to Babylon.";
asv[1] = "The word which came to Jeremiah from Jehovah, after that Nebuzaradan the captain of the guard had let him go from Ramah, when he had taken him being bound in chains among all the captives of Jerusalem and Judah, that were carried away captive unto Babylon.";
yng[1] = "The word that hath been unto Jeremiah from Jehovah, after Nebuzar-Adan, chief of the executioners, hath sent him from Ramah, in his taking him -- and he a prisoner in chains -- in the midst of all the removal of Jerusalem and of Judah, who are removed to Babylon.";
dby[1] = "The word that came to Jeremiah from Jehovah, after that Nebuzar-adan the captain of the body-guard had let him go from Ramah, when he had taken him, being bound in chains, among all the captivity of Jerusalem and Judah, that were carried away captive to Babylon.";
web[1] = "The word which came to Jeremiah from the LORD, after that Nebuzar-adan the captain of the guard had let him go from Ramah, when he had taken him being bound in chains among all that were carried away captive of Jerusalem and Judah, who were carried away captive to Babylon.";
hnv[1] = "The word which came to Yirmeyahu from the LORD, after that Nevuzar\'adan the captain of the guard had let him go from Ramah, when he had taken him being bound in chains among all the captives of Yerushalayim and Yehudah, who were carried away captive to Bavel.";
vul[1] = "sermo qui factus est ad Hieremiam a Domino postquam dimissus est a Nabuzardan magistro militiae de Rama quando tulit eum vinctum catenis in medio omnium qui migrabant de Hierusalem et Iuda et ducebantur in Babylonem";
kjv[2] = "And the captain of the guard took Jeremiah, and said unto him, The LORD thy God hath pronounced this evil upon this place.";
rsv[2] = "The captain of the guard took Jeremiah and said to him, &quot;The LORD your God pronounced this evil against this place;";
asv[2] = "And the captain of the guard took Jeremiah, and said unto him, Jehovah thy God pronounced this evil upon this place;";
yng[2] = "And the chief of the executioners taketh Jeremiah, and saith unto him, `Jehovah thy God hath spoken this evil concerning this place,";
dby[2] = "And the captain of the body-guard took Jeremiah, and said unto him, Jehovah thy God pronounced this evil upon this place,";
web[2] = "And the captain of the guard took Jeremiah, and said to him, The LORD thy God hath pronounced this evil upon this place.";
hnv[2] = "The captain of the guard took Yirmeyahu, and said to him, the LORD your God pronounced this evil on this place;";
vul[2] = "tollens ergo princeps militiae Hieremiam dixit ad eum Dominus Deus tuus locutus est malum hoc super locum istum";
kjv[3] = "Now the LORD hath brought [it], and done according as he hath said: because ye have sinned against the LORD, and have not obeyed his voice, therefore this thing is come upon you.";
rsv[3] = "the LORD has brought it about, and has done as he said. Because you sinned against the LORD, and did not obey his voice, this thing has come upon you.";
asv[3] = "and Jehovah hath brought it, and done according as he spake: because ye have sinned against Jehovah, and have not obeyed his voice, therefore this thing is come upon you.";
yng[3] = "and Jehovah bringeth [it] in, and doth as He spake, because ye have sinned against Jehovah, and have not hearkened to His voice, even this thing hath been to you.";
dby[3] = "and Jehovah hath brought [it about] and done according as he said; for ye have sinned against Jehovah, and have not hearkened unto his voice, therefore this thing is come upon you.";
web[3] = "Now the LORD hath brought [it], and done according as he hath said: because ye have sinned against the LORD, and have not obeyed his voice, therefore this thing is come upon you.";
hnv[3] = "and the LORD has brought it, and done according as he spoke: because you have sinned against the LORD, and have not obeyed his voice, therefore this thing is come on you.";
vul[3] = "et adduxit et fecit Dominus sicut locutus est quia peccastis Domino et non audistis vocem eius et factus est vobis sermo hic";
kjv[4] = "And now, behold, I loose thee this day from the chains which [were] upon thine hand. If it seem good unto thee to come with me into Babylon, come; and I will look well unto thee: but if it seem ill unto thee to come with me into Babylon, forbear: behold, all the land [is] before thee: whither it seemeth good and convenient for thee to go, thither go.";
rsv[4] = "Now, behold, I release you today from the chains on your hands. If it seems good to you to come with me to Babylon, come, and I will look after you well; but if it seems wrong to you to come with me to Babylon, do not come. See, the whole land is before you; go wherever you think it good and right to go.";
asv[4] = "And now, behold, I loose thee this day from the chains which are upon thy hand. If it seem good unto thee to come with me into Babylon, come, and I will look well unto thee; but if it seem ill unto thee to come with me into Babylon, forbear: behold, all the land is before thee; whither it seemeth good and right unto thee to go, thither go.";
yng[4] = "`And now, lo, I have loosed thee to-day from the chains that [are] on thy hand; if good in thine eyes to come with me [to] Babylon, come, and I keep mine eye upon thee: and if evil in thine eyes to come with me to Babylon, forbear; see, all the land [is] before thee, whither [it be] good, and whither [it be] right in thine eyes to go -- go.\' --";
dby[4] = "And now, behold, I loose thee this day from the chains that are upon thy hand. If it seem good in thy sight to come with me to Babylon, come, and I will keep mine eye upon thee; but if it seem ill unto thee to come with me to Babylon, forbear. See, all the land is before thee: whither it seemeth good and right in thy sight to go, thither go.";
web[4] = "And now, behold, I loose thee this day from the chains which [were] upon thy hand. If it seemeth good to thee to come with me into Babylon, come; and I will look well to thee: but if it seemeth ill to thee to come with me into Babylon, forbear: behold, all the land [is] before thee: whither it seemeth good and convenient for thee to go, thither go.";
hnv[4] = "Now, behold, I loose you this day from the chains which are on your hand. If it seem good to you to come with me into Bavel, come, and I will look well to you; but if it seem ill to you to come with me into Bavel, forbear: behold, all the land is before you; where it seems good and right to you to go, there go.";
vul[4] = "nunc ergo ecce solvi te hodie de catenis quae sunt in manibus tuis si placet tibi ut venias mecum in Babylonem veni et ponam oculos meos super te si autem displicet tibi venire mecum in Babylonem reside ecce omnis terra in conspectu tuo quod elegeris et quo placuerit tibi ut vadas illuc perge";
kjv[5] = "Now while he was not yet gone back, [he said], Go back also to Gedaliah the son of Ahikam the son of Shaphan, whom the king of Babylon hath made governor over the cities of Judah, and dwell with him among the people: or go wheresoever it seemeth convenient unto thee to go. So the captain of the guard gave him victuals and a reward, and let him go.";
rsv[5] = "If you remain, then return to Gedali\'ah the son of Ahi\'kam, son of Shaphan, whom the king of Babylon appointed governor of the cities of Judah, and dwell with him among the people; or go wherever you think it right to go.&quot; So the captain of the guard gave him an allowance of food and a present, and let him go.";
asv[5] = "Now while he was not yet gone back, Go back then, [said he], to Gedaliah the son of Ahikam, the son of Shaphan, whom the king of Babylon hath made governor over the cities of Judah, and dwell with him among the people; or go wheresoever it seemeth right unto thee to go. So the captain of the guard gave him victuals and a present, and let him go.";
yng[5] = "and while he doth not reply -- `Or turn back unto Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon hath appointed over the cities of Judah, and dwell with him in the midst of the people, or whithersoever it is right in thine eyes to go -- go.\' And the chief of the executioners giveth to him for the way, and a gift, and sendeth him away,";
dby[5] = "And while he had not yet given answer; [he said,] Yea, go back to Gedaliah the son of Ahikam the son of Shaphan, whom the king of Babylon hath appointed over the cities of Judah, and abide with him in the midst of the people; or go wheresoever it seemeth right in thy sight to go. And the captain of the body-guard gave him provisions and a present, and let him go.";
web[5] = "Now while he had not yet gone back, [he said], Go back also to Gedaliah the son of Ahikam the son of Shaphan, whom the king of Babylon had made governor over the cities of Judah, and dwell with him among the people: or go wherever it seemeth convenient to thee to go. So the captain of the guard gave him provisions and a reward, and let him go.";
hnv[5] = "Now while he was not yet gone back, Go back then, [said he], to Gedalyahu the son of Achikam, the son of Shafan, whom the king of Bavel has made governor over the cities of Yehudah, and dwell with him among the people; or go wherever it seems right to you to go. So the captain of the guard gave him victuals and a present, and let him go.";
vul[5] = "et mecum noli venire sed habita apud Godoliam filium Ahicam filii Saphan quem praeposuit rex Babylonis civitatibus Iudaeae habita ergo cum eo in medio populi vel quocumque placuerit tibi ut vadas vade dedit quoque ei magister militiae cibaria et munuscula et dimisit eum";
kjv[6] = "Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land.";
rsv[6] = "Then Jeremiah went to Gedali\'ah the son of Ahi\'kam, at Mizpah, and dwelt with him among the people who were left in the land.";
asv[6] = "Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah, and dwelt with him among the people that were left in the land.";
yng[6] = "and Jeremiah cometh in unto Gedaliah son of Ahikam, to Mizpah, and dwelleth with him, in the midst of the people who are left in the land.";
dby[6] = "And Jeremiah came unto Gedaliah the son of Ahikam to Mizpah, and abode with him among the people that remained in the land.";
web[6] = "Then Jeremiah went to Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land.";
hnv[6] = "Then went Yirmeyahu to Gedalyahu the son of Achikam to Mitzpah, and lived with him among the people who were left in the land.";
vul[6] = "venit autem Hieremias ad Godoliam filium Ahicam in Masphat et habitavit cum eo in medio populi qui relictus fuerat in terra";
kjv[7] = "Now when all the captains of the forces which [were] in the fields, [even] they and their men, heard that the king of Babylon had made Gedaliah the son of Ahikam governor in the land, and had committed unto him men, and women, and children, and of the poor of the land, of them that were not carried away captive to Babylon;";
rsv[7] = "When all the captains of the forces in the open country and their men heard that the king of Babylon had appointed Gedali\'ah the son of Ahi\'kam governor in the land, and had committed to him men, women, and children, those of the poorest of the land who had not been taken into exile to Babylon,";
asv[7] = "Now when all the captains of the forces that were in the fields, even they and their men, heard that the king of Babylon had made Gedaliah the son of Ahikam governor in the land, and had committed unto him men, and women, and children, and of the poorest of the land, of them that were not carried away captive to Babylon;";
yng[7] = "And all the heads of the forces that [are] in the field hear, they and their men, that the king of Babylon hath appointed Gedaliah son of Ahikam over the land, and that he hath charged him [with] men, and women, and infants, and of the poor of the land, of those who have not been removed to Babylon;";
dby[7] = "And all the captains of the forces that were in the fields, they and their men, heard that the king of Babylon had appointed Gedaliah the son of Ahikam over the land, and had committed unto him men, and women, and children, and of the poor of the land, of them that had not been carried away captive to Babylon.";
web[7] = "Now when all the captains of the forces who [were] in the fields, [even] they and their men, heard that the king of Babylon had made Gedaliah the son of Ahikam governor in the land, and had committed to him men, and women, and children, and of the poor of the land, of them that were not carried away captive to Babylon;";

vul[7] = "cum ergo audissent omnes principes exercitus qui dispersi fuerant per regiones ipsi et socii eorum quod praefecisset rex Babylonis Godoliam filium Ahicam terrae et quod commendasset ei viros et mulieres et parvulos et de pauperibus terrae qui non fuerant translati in Babylonem";
kjv[8] = "Then they came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan and Jonathan the sons of Kareah, and Seraiah the son of Tanhumeth, and the sons of Ephai the Netophathite, and Jezaniah the son of a Maachathite, they and their men.";
rsv[8] = "they went to Gedali\'ah at Mizpah--Ish\'mael the son of Nethani\'ah, Joha\'nan the son of Kare\'ah, Serai\'ah the son of Tanhu\'meth, the sons of Ephai the Netoph\'athite, Jezani\'ah the son of the Ma-ac\'athite, they and their men.";
asv[8] = "then they came to Gedaliah to Mizpah, [to wit], Ishmael the son of Nethaniah, and Johanan and Jonathan the sons of Kareah, and Seraiah the son of Tanhumeth, and the sons of Ephai the Netophathite, and Jezaniah the son of the Maacathite, they and their men.";
yng[8] = "and they come in unto Gedaliah to Mizpah, even Ishmael son of Nethaniah, and Johanan and Jonathan sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite, and Jezaniah son of the Maachathite, they and their men.";
dby[8] = "And they came to Gedaliah to Mizpah; even Ishmael the son of Nethaniah, and Johanan and Jonathan the sons of Kareah, and Seraiah the son of Tanhumeth, and the sons of Ephai the Netophathite, and Jezaniah the son of a Maachathite, they and their men.";
web[8] = "Then they came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan and Jonathan the sons of Kareah, and Seraiah the son of Tanhumeth, and the sons of Ephai the Netophathite, and Jezaniah the son of a Maachathite, they and their men.";
hnv[8] = "then they came to Gedalyahu to Mitzpah, [to wit], Yishma\'el the son of Netanyah, and Yochanan and Yonatan the sons of Kareach, and Serayah the son of Tanchumet, and the sons of `Efai the Netofatite, and Yezanyah the son of the Ma`akhatite, they and their men.";

kjv[9] = "And Gedaliah the son of Ahikam the son of Shaphan sware unto them and to their men, saying, Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.";
rsv[9] = "Gedali\'ah the son of Ahi\'kam, son of Shaphan, swore to them and their men, saying, &quot;Do not be afraid to serve the Chalde\'ans. Dwell in the land, and serve the king of Babylon, and it shall be well with you.";
asv[9] = "And Gedaliah the son of Ahikam the son of Shaphan sware unto them and to their men, saying, Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.";
yng[9] = "And swear to them doth Gedaliah son of Ahikam, son of Shaphan, and to their men, saying, `Be not afraid of serving the Chaldeans, abide in the land, and serve the king of Babylon, and it is well for you;";

hnv[9] = "Gedalyahu the son of Achikam the son of Shafan swore to them and to their men, saying, Don\'t be afraid to serve the Kasdim: dwell in the land, and serve the king of Bavel, and it shall be well with you.";
vul[9] = "et iuravit eis Godolias filius Ahicam filii Saphan et comitibus eorum dicens nolite timere servire Chaldeis habitate in terra et servite regi Babylonis et bene erit vobis";
kjv[10] = "As for me, behold, I will dwell at Mizpah to serve the Chaldeans, which will come unto us: but ye, gather ye wine, and summer fruits, and oil, and put [them] in your vessels, and dwell in your cities that ye have taken.";
rsv[10] = "As for me, I will dwell at Mizpah, to stand for you before the Chalde\'ans who will come to us; but as for you, gather wine and summer fruits and oil, and store them in your vessels, and dwell in your cities that you have taken.&quot;";
asv[10] = "As for me, behold, I will dwell at Mizpah, to stand before the Chaldeans that shall come unto us: but ye, gather ye wine and summer fruits and oil, and put them in your vessels, and dwell in your cities that ye have taken.";
yng[10] = "and I, lo, I am dwelling in Mizpah, to stand before the Chaldeans who are come in unto us, and ye, gather ye wine, and summer fruit, and oil, and put in your vessels, and dwell in your cities that ye have taken.\'";
dby[10] = "And as for me, behold, I dwell at Mizpah, to stand before the Chaldeans, who will come unto us; and ye, gather wine, and summer fruits, and oil, and put [them] in your vessels, and dwell in your cities which ye have taken.";
web[10] = "As for me, behold, I will dwell at Mizpah, to serve the Chaldeans, who will come to us: but ye, gather ye wine, and summer fruits, and oil, and put [them] in your vessels, and dwell in your cities that ye have taken.";
hnv[10] = "As for me, behold, I will dwell at Mitzpah, to stand before the Kasdim who shall come to us: but you, gather you wine and summer fruits and oil, and put them in your vessels, and dwell in your cities that you have taken.";
vul[10] = "ecce ego habito in Masphat ut respondeam praecepto Chaldeorum qui mittuntur ad nos vos autem colligite vindemiam et messem et oleum et condite in vasis vestris et manete in urbibus vestris quas tenetis";
kjv[11] = "Likewise when all the Jews that [were] in Moab, and among the Ammonites, and in Edom, and that [were] in all the countries, heard that the king of Babylon had left a remnant of Judah, and that he had set over them Gedaliah the son of Ahikam the son of Shaphan;";

asv[11] = "Likewise when all the Jews that were in Moab, and among the children of Ammon, and in Edom, and that were in all the countries, heard that the king of Babylon had left a remnant of Judah, and that he had set over them Gedaliah the son of Ahikam, the son of Shaphan;";
yng[11] = "And also all the Jews who [are] in Moab, and among the sons of Ammon, and in Edom, and who [are] in all the lands, have heard that the king of Babylon hath given a remnant to Judah, and that he hath appointed over them Gedaliah son of Ahikam, son of Shaphan,";

web[11] = "Likewise when all the Jews that [were] in Moab, and among the Ammonites, and in Edom, and that [were] in all the countries, heard that the king of Babylon had left a remnant of Judah, and that he had set over them Gedaliah the son of Ahikam the son of Shaphan;";
hnv[11] = "Likewise when all the Yehudim who were in Mo\'av, and among the children of `Ammon, and in Edom, and who were in all the countries, heard that the king of Bavel had left a remnant of Yehudah, and that he had set over them Gedalyahu the son of Achikam, the son of Shafan;";
vul[11] = "sed et omnes Iudaei qui erant in Moab et in filiis Ammon et in Idumea et in universis regionibus audito quod dedisset rex Babylonis reliquias in Iudaeam et quod praeposuisset super eos Godoliam filium Ahicam filii Saphan";
kjv[12] = "Even all the Jews returned out of all places whither they were driven, and came to the land of Judah, to Gedaliah, unto Mizpah, and gathered wine and summer fruits very much.";

asv[12] = "then all the Jews returned out of all places whither they were driven, and came to the land of Judah, to Gedaliah, unto Mizpah, and gathered wine and summer fruits very much.";
yng[12] = "and all the Jews from all the places whither they have been driven, turn back and enter the land of Judah, unto Gedaliah, to Mizpah, and they gather wine and summer fruit -- very much.";
dby[12] = "and all the Jews returned out of all the places whither they had been driven, and came to the land of Judah to Gedaliah, unto Mizpah, and gathered wine and summer fruits in great abundance.";
web[12] = "Even all the Jews returned out of all places whither they were driven, and came to the land of Judah, to Gedaliah, to Mizpah, and gathered wine and summer fruits in abundance.";
hnv[12] = "then all the Yehudim returned out of all places where they were driven, and came to the land of Yehudah, to Gedalyahu, to Mitzpah, and gathered wine and summer fruits very much.";

kjv[14] = "And said unto him, Dost thou certainly know that Baalis the king of the Ammonites hath sent Ishmael the son of Nethaniah to slay thee? But Gedaliah the son of Ahikam believed them not.";
rsv[14] = "and said to him, &quot;Do you know that Ba\'alis the king of the Ammonites has sent Ish\'mael the son of Nethani\'ah to take your life?&quot; But Gedali\'ah the son of Ahi\'kam would not believe them.";
asv[14] = "and said unto him, Dost thou know that Baalis the king of the children of Ammon hath sent Ishmael the son of Nethaniah to take thy life? But Gedaliah the son of Ahikam believed them not.";
yng[14] = "and they say unto him, `Dost thou really know that Baalis king of the sons of Ammon hath sent Ishmael son of Nethaniah to smite thy soul?\' And Gedaliah son of Ahikam hath not given to them credence.";
dby[14] = "and said unto him, Dost thou indeed know that Baalis the king of the children of Ammon hath sent Ishmael the son of Nethaniah to smite thee to death? But Gedaliah the son of Ahikam believed them not.";
web[14] = "And said to him, Dost thou certainly know that Baalis the king of the Ammonites hath sent Ishmael the son of Nethaniah to slay thee? But Gedaliah the son of Ahikam believed them not.";
hnv[14] = "and said to him, Do you know that Baalis the king of the children of `Ammon has sent Yishma\'el the son of Netanyah to take your life? But Gedalyahu the son of Achikam didn\'t believe them.";
vul[14] = "et dixerunt ei scito quia Baalis rex filiorum Ammon misit Ismahel filium Nathaniae percutere animam tuam et non credidit eis Godolias filius Ahicam";
kjv[15] = "Then Johanan the son of Kareah spake to Gedaliah in Mizpah secretly, saying, Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know [it]: wherefore should he slay thee, that all the Jews which are gathered unto thee should be scattered, and the remnant in Judah perish?";
rsv[15] = "Then Joha\'nan the son of Kare\'ah spoke secretly to Gedali\'ah at Mizpah, &quot;Let me go and slay Ish\'mael the son of Nethani\'ah, and no one will know it. Why should he take your life, so that all the Jews who are gathered about you would be scattered, and the remnant of Judah would perish?&quot;";
asv[15] = "Then Johanan the son of Kareah spake to Gedaliah in Mizpah secretly, saying, Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know it: wherefore should he take thy life, that all the Jews that are gathered unto thee should be scattered, and the remnant of Judah perish?";
yng[15] = "And Johanan son of Kareah hath spoken unto Gedaliah in secret, in Mizpah, saying, `Let me go, I pray thee, and I smite Ishmael son of Nethaniah, and no one doth know; why doth he smite thy soul? and scattered have been all Judah who are gathered unto thee, and perished hath the remnant of Judah.\'";
dby[15] = "And Johanan the son of Kareah spoke to Gedaliah in Mizpah secretly, saying, Let me go, I pray thee, and I will smite Ishmael the son of Nethaniah and no man shall know it: why should he take thy life, and all they of Judah who are gathered unto thee be scattered, and the remnant of Judah perish?";
web[15] = "Then Johanan the son of Kareah spoke to Gedaliah in Mizpah secretly, saying, Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know [it]: why should he slay thee, that all the Jews who are gathered to thee should be scattered, and the remnant of Judah perish?";
hnv[15] = "Then Yochanan the son of Kareach spoke to Gedalyahu in Mitzpah secretly, saying, Please let me go, and I will kill Yishma\'el the son of Netanyah, and no man shall know it: why should he take your life, that all the Yehudim who are gathered to you should be scattered, and the remnant of Yehudah perish?";
vul[15] = "Iohanan vero filius Caree dixit ad Godoliam seorsum in Masphat loquens ibo et percutiam Ismahel filium Nathaniae nullo sciente ne interficiat animam tuam et dissipentur omnes Iudaei qui congregati sunt ad te et peribunt reliquiae Iuda";
kjv[16] = "But Gedaliah the son of Ahikam said unto Johanan the son of Kareah, Thou shalt not do this thing: for thou speakest falsely of Ishmael.";
rsv[16] = "But Gedali\'ah the son of Ahi\'kam said to Joha\'nan the son of Kare\'ah, &quot;You shall not do this thing, for you are speaking falsely of Ish\'mael.&quot;";
asv[16] = "But Gedaliah the son of Ahikam said unto Johanan the son of Kareah, Thou shalt not do this thing; for thou speakest falsely of Ishmael.";
yng[16] = "And Gedaliah son of Ahikam saith unto Johanan son of Kareah, `Thou dost not do this thing, for falsehood thou art speaking concerning Ishmael.\'";
dby[16] = "But Gedaliah the son of Ahikam said unto Johanan the son of Kareah, Thou shalt not do this thing; for thou speakest falsely of Ishmael.";
web[16] = "But Gedaliah the son of Ahikam said to Johanan the son of Kareah, Thou shalt not do this thing: for thou speakest falsely of Ishmael.";
hnv[16] = "But Gedalyahu the son of Achikam said to Yochanan the son of Kareach, You shall not do this thing; for you speak falsely of Yishma\'el.";
vul[16] = "et ait Godolias filius Ahicam ad Iohanan filium Caree noli facere verbum hoc falsum enim tu loqueris de Ismahel";
