csb[1] = "&quot;At that time&quot; -- this is the LORD\'s declaration -- &quot;I will be the God of all the families of Israel, and they will be my people.&quot;";
csb[2] = "This is what the LORD says: The people who survived the sword found favor in the wilderness. When Israel went to find rest,";
csb[3] = "the LORD appeared to him from far away. I have loved you with an everlasting love; therefore, I have continued to extend faithful love to you.";
csb[4] = "Again I will build you so that you will be rebuilt, Virgin Israel. You will take up your tambourines again and go out in joyful dancing.";
csb[5] = "You will plant vineyards again on the mountains of Samaria; the planters will plant and will enjoy the fruit.";
csb[6] = "For there will be a day when watchmen will call out in the hill country of Ephraim, &quot;Come, let\'s go up to Zion, to the LORD our God! &quot;";
csb[7] = "For this is what the LORD says: Sing with joy for Jacob; shout for the foremost of the nations! Proclaim, praise, and say, &quot;LORD, save your people, the remnant of Israel! &quot;";
csb[8] = "Watch! I am going to bring them from the northern land. I will gather them from remote regions of the earth -- the blind and the lame will be with them, along with those who are pregnant and those about to give birth. They will return here as a great assembly!";
csb[9] = "They will come weeping, but I will bring them back with consolation. I will lead them to wadis filled with water, by a smooth way where they will not stumble, for I am Israel\'s Father, and Ephraim is my firstborn.";
csb[10] = "Nations, hear the word of the LORD, and tell it among the far off coasts and islands! Say, &quot;The one who scattered Israel will gather him. He will watch over him as a shepherd guards his flock,";
csb[11] = "&quot;for the LORD has ransomed Jacob and redeemed him from the power of one stronger than he.&quot;";
csb[12] = "They will come and shout for joy on the heights of Zion; they will be radiant with joy because of the LORD\'s goodness, because of the grain, the new wine, the fresh oil, and because of the young of the flocks and herds. Their life will be like an irrigated garden, and they will no longer grow weak from hunger.";
csb[13] = "Then the young women will rejoice with dancing, while young and old men rejoice together. I will turn their mourning into joy, give them consolation, and bring happiness out of grief.";
csb[14] = "I will refresh the priests with an abundance, and my people will be satisfied with my goodness. This is the LORD\'s declaration.";
csb[15] = "This is what the LORD says: A voice was heard in Ramah, a lament with bitter weeping -- Rachel weeping for her children, refusing to be comforted for her children because they are no more.";
csb[16] = "This is what the LORD says: Keep your voice from weeping and your eyes from tears, for the reward for your work will come -- this is the LORD\'s declaration -- and your children will return from the enemy\'s land.";
csb[17] = "There is hope for your future -- this is the LORD\'s declaration -- and your children will return to their own territory.";
csb[18] = "I have surely heard Ephraim moaning, &quot;You disciplined me, and I have been disciplined like an untrained calf. Take me back, so that I can return, for you, LORD, are my God.";
csb[19] = "&quot;After my return, I felt regret; After I was instructed, I struck my thigh in grief. I was ashamed and humiliated because I bore the disgrace of my youth.&quot;";
csb[20] = "Isn\'t Ephraim a precious son to me, a delightful child? Whenever I speak against him, I certainly still think about him. Therefore, my inner being yearns for him; I will truly have compassion on him. This is the LORD\'s declaration.";
csb[21] = "Set up road markers for yourself; establish signposts! Keep the highway in mind, the way you have traveled. Return, Virgin Israel! Return to these cities of yours.";
csb[22] = "How long will you turn here and there, faithless daughter? For the LORD creates something new in the land -- a female will shelter a man.";
csb[23] = "This is what the LORD of Armies, the God of Israel, says: &quot;When I restore their fortunes, they will once again speak this word in the land of Judah and in its cities: \'May the LORD bless you, righteous settlement, holy mountain.\'";
csb[24] = "&quot;Judah and all its cities will live in it together -- also farmers and those who move with the flocks --";
csb[25] = "&quot;for I satisfy the thirsty person and feed all those who are weak.&quot;";
csb[26] = "At this I awoke and looked around. My sleep had been most pleasant to me.";
csb[27] = "&quot;Look, the days are coming&quot; -- this is the LORD\'s declaration -- &quot;when I will sow the house of Israel and the house of Judah with the seed of people and the seed of animals.";
csb[28] = "&quot;Just as I watched over them to uproot and to tear them down, to demolish and to destroy, and to cause disaster, so will I watch over them to build and to plant them&quot; -- this is the LORD\'s declaration.";
csb[29] = "&quot;In those days, it will never again be said, \'The fathers have eaten sour grapes, and the children\'s teeth are set on edge.\'";
csb[30] = "&quot;Rather, each will die for his own iniquity. Anyone who eats sour grapes -- his own teeth will be set on edge.";
csb[31] = "&quot;Look, the days are coming&quot; -- this is the LORD\'s declaration -- &quot;when I will make a new covenant with the house of Israel and with the house of Judah.";
csb[32] = "&quot;This one will not be like the covenant I made with their ancestors on the day I took them by the hand to lead them out of the land of Egypt -- my covenant that they broke even though I am their master&quot; -- the LORD\'s declaration.";
csb[33] = "&quot;Instead, this is the covenant I will make with the house of Israel after those days&quot; -- the LORD\'s declaration. &quot;I will put my teaching within them and write it on their hearts. I will be their God, and they will be my people.";
csb[34] = "&quot;No longer will one teach his neighbor or his brother, saying, \'Know the LORD,\' for they will all know me, from the least to the greatest of them&quot; -- this is the LORD\'s declaration. &quot;For I will forgive their iniquity and never again remember their sin.";
csb[35] = "&quot;This is what the LORD says: The one who gives the sun for light by day, the fixed order of moon and stars for light by night, who stirs up the sea and makes its waves roar -- the LORD of Armies is his name:";
csb[36] = "&quot;If this fixed order departs from before me -- this is the LORD\'s declaration -- only then will Israel\'s descendants cease to be a nation before me forever.";
csb[37] = "&quot;This is what the LORD says: Only if the heavens above can be measured and the foundations of the earth below explored, will I reject all of Israel\'s descendants because of all they have done -- this is the LORD\'s declaration.";
csb[38] = "&quot;Look, the days are coming&quot; -- the LORD\'s declaration -- &quot;when the city from the Tower of Hananel to the Corner Gate will be rebuilt for the LORD.";
csb[39] = "&quot;A measuring line will once again stretch out straight to the hill of Gareb and then turn toward Goah.";
csb[40] = "&quot;The whole valley -- the corpses, the ashes, and all the fields as far as the Kidron Valley to the corner of the Horse Gate to the east -- will be holy to the LORD. It will never be uprooted or demolished again.&quot;";
kjv[1] = "At the same time, saith the LORD, will I be the God of all the families of Israel, and they shall be my people.";

yng[1] = "At that time, an affirmation of Jehovah, I am for God to all families of Israel, And they -- they are to Me for a people.";

kjv[4] = "Again I will build thee, and thou shalt be built, O virgin of Israel: thou shalt again be adorned with thy tabrets, and shalt go forth in the dances of them that make merry.";

asv[4] = "Again will I build thee, and thou shalt be built, O virgin of Israel: again shalt thou be adorned with thy tabrets, and shalt go forth in the dances of them that make merry.";
yng[4] = "Again do I build thee, And thou hast been built, O virgin of Israel, Again thou puttest on thy tabrets, And hast gone out in the chorus of the playful.";
dby[4] = "I will build thee again, and thou shalt be built, O virgin of Israel! Thou shalt again be adorned with thy tambours, and shalt go forth in the dances of them that make merry.";

yng[5] = "Again thou dost plant vineyards In mountains of Samaria, Planters have planted, and made common.";

web[5] = "Thou shalt yet plant vines upon the mountains of Samaria: the planters shall plant, and shall eat [them] as common things.";

rsv[6] = "For there shall be a day when watchmen will call in the hill country of E\'phraim: \'Arise, and let us go up to Zion, to the LORD our God.\'&quot;";

yng[6] = "For there is a day, Cried have watchmen on mount Ephraim, `Rise, and we go up to Zion, unto Jehovah our God;";
dby[6] = "For there shall be a day, when the watchmen upon mount Ephraim shall cry, Arise, and let us go up to Zion, unto Jehovah our God.";

asv[7] = "For thus saith Jehovah, Sing with gladness for Jacob, and shout for the chief of the nations: publish ye, praise ye, and say, O Jehovah, save thy people, the remnant of Israel.";

dby[7] = "For thus saith Jehovah: Sing aloud [with] gladness for Jacob, and shout at the head of the nations; publish ye, praise ye, and say, Jehovah, save thy people, the remnant of Israel.";

kjv[8] = "Behold, I will bring them from the north country, and gather them from the coasts of the earth, [and] with them the blind and the lame, the woman with child and her that travaileth with child together: a great company shall return thither.";
rsv[8] = "Behold, I will bring them from the north country, and gather them from the farthest parts of the earth, among them the blind and the lame, the woman with child and her who is in travail, together; a great company, they shall return here.";
asv[8] = "Behold, I will bring them from the north country, and gather them from the uttermost parts of the earth, [and] with them the blind and the lame, the woman with child and her that travaileth with child together: a great company shall they return hither.";
yng[8] = "Lo, I am bringing them in from the north country, And have gathered them from the sides of the earth, Among them [are] blind and lame, Conceiving and travailing one -- together, A great assembly -- they turn back hither.";
dby[8] = "Behold, I bring them from the north country, and gather them from the uttermost parts of the earth; [and] among them the blind and the lame, the woman with child and her that travaileth with child together: a great assemblage shall they return hither.";
web[8] = "Behold, I will bring them from the north country, and gather them from the borders of the earth, [and] with them the blind and the lame, the woman with child and her that travaileth with child together: a great company shall return thither.";
hnv[8] = "Behold, I will bring them from the north country, and gather them from the uttermost parts of the eretz, [and] with them the blind and the lame, the woman with child and her who travails with child together: a great company shall they return here.";

kjv[9] = "They shall come with weeping, and with supplications will I lead them: I will cause them to walk by the rivers of waters in a straight way, wherein they shall not stumble: for I am a father to Israel, and Ephraim [is] my firstborn.";
rsv[9] = "With weeping they shall come, and with consolations I will lead them back, I will make them walk by brooks of water, in a straight path in which they shall not stumble; for I am a father to Israel, and E\'phraim is my first-born.";
asv[9] = "They shall come with weeping; and with supplications will I lead them: I will cause them to walk by rivers of waters, in a straight way wherein they shall not stumble; for I am a father to Israel, and Ephraim is my first-born.";
yng[9] = "With weeping they come in, And with supplications I bring them, I cause them to go unto streams of waters, In a right way -- they stumble not in it, For I have been to Israel for a father, And Ephraim -- My first-born [is] he.";
dby[9] = "They shall come with weeping, and with supplications will I lead them; I will cause them to walk by water-brooks, in a straight way, wherein they shall not stumble; for I will be a father to Israel, and Ephraim is my firstborn.";

vul[9] = "in fletu venient et in precibus deducam eos et adducam eos per torrentes aquarum in via recta et non inpingent in ea quia factus sum Israheli pater et Ephraim primogenitus meus est";
kjv[10] = "Hear the word of the LORD, O ye nations, and declare [it] in the isles afar off, and say, He that scattered Israel will gather him, and keep him, as a shepherd [doth] his flock.";

kjv[12] = "Therefore they shall come and sing in the height of Zion, and shall flow together to the goodness of the LORD, for wheat, and for wine, and for oil, and for the young of the flock and of the herd: and their soul shall be as a watered garden; and they shall not sorrow any more at all.";
rsv[12] = "They shall come and sing aloud on the height of Zion, and they shall be radiant over the goodness of the LORD, over the grain, the wine, and the oil, and over the young of the flock and the herd; their life shall be like a watered garden, and they shall languish no more.";
asv[12] = "And they shall come and sing in the height of Zion, and shall flow unto the goodness of Jehovah, to the grain, and to the new wine, and to the oil, and to the young of the flock and of the herd: and their soul shall be as a watered garden; and they shall not sorrow any more at all.";
yng[12] = "And they have come in, And have sung in the high place of Zion, And flowed unto the goodness of Jehovah, For wheat, and for new wine, and for oil, And for the young of the flock and herd, And their soul hath been as a watered garden, And they add not to grieve any more.";
dby[12] = "And they shall come and sing aloud upon the height of Zion, and shall flow together to the goodness of Jehovah, for corn, and for new wine, and for oil, and for the young of the flock and of the herd; and their soul shall be as a watered garden, and they shall not languish any more at all.";
web[12] = "Therefore they shall come and sing in the hight of Zion, and shall flow together to the goodness of the LORD, for wheat, and for wine, and for oil, and for the young of the flock and of the herd: and their soul shall be as a watered garden; and they shall not sorrow any more at all.";
hnv[12] = "They shall come and sing in the height of Tziyon, and shall flow to the goodness of the LORD, to the grain, and to the new wine, and to the oil, and to the young of the flock and of the herd: and their soul shall be as a watered garden; and they shall not sorrow any more at all.";
vul[12] = "et venient et laudabunt in monte Sion et confluent ad bona Domini super frumento et vino et oleo et fetu pecorum et armentorum eritque anima eorum quasi hortus inriguus et ultra non esurient";
kjv[13] = "Then shall the virgin rejoice in the dance, both young men and old together: for I will turn their mourning into joy, and will comfort them, and make them rejoice from their sorrow.";
rsv[13] = "Then shall the maidens rejoice in the dance, and the young men and the old shall be merry. I will turn their mourning into joy, I will comfort them, and give them gladness for sorrow.";

yng[13] = "Then rejoice doth a virgin in a chorus, Both young men and old men -- together, And I have turned their mourning to joy, And have comforted them, And gladdened them above their sorrow,";
dby[13] = "Then shall the virgin rejoice in the dance, and the young men and old together; for I will turn their mourning into gladness, and will comfort them, and make them rejoice after their sorrow.";

rsv[14] = "I will feast the soul of the priests with abundance, and my people shall be satisfied with my goodness, says the LORD.&quot;";

kjv[15] = "Thus saith the LORD; A voice was heard in Ramah, lamentation, [and] bitter weeping; Rahel weeping for her children refused to be comforted for her children, because they [were] not.";
rsv[15] = "Thus says the LORD: &quot;A voice is heard in Ramah, lamentation and bitter weeping. Rachel is weeping for her children; she refuses to be comforted for her children, because they are not.&quot;";
asv[15] = "Thus saith Jehovah: A voice is heard in Ramah, lamentation, and bitter weeping, Rachel weeping for her children; she refuseth to be comforted for her children, because they are not.";
yng[15] = "Thus said Jehovah, A voice in Ramah is heard, wailing, weeping most bitter, Rachel is weeping for her sons, She hath refused to be comforted for her sons, because they are not.";
dby[15] = "Thus saith Jehovah: A voice hath been heard in Ramah, the wail of very bitter weeping, -- Rachel weeping for her children, refusing to be comforted for her children, because they are not.";
web[15] = "Thus saith the LORD; A voice was heard in Ramah, lamentation, [and] bitter weeping; Rachel weeping for her children refused to be comforted for her children, because they [were] not.";
hnv[15] = "Thus says the LORD: A voice is heard in Ramah, lamentation, and bitter weeping, Rachel weeping for her children; she refuses to be comforted for her children, because they are no more.";
vul[15] = "haec dicit Dominus vox in excelso audita est lamentationis fletus et luctus Rachel plorantis filios suos et nolentis consolari super eis quia non sunt";
kjv[16] = "Thus saith the LORD; Refrain thy voice from weeping, and thine eyes from tears: for thy work shall be rewarded, saith the LORD; and they shall come again from the land of the enemy.";
rsv[16] = "Thus says the LORD: &quot;Keep your voice from weeping, and your eyes from tears; for your work shall be rewarded, says the LORD, and they shall come back from the land of the enemy.";
asv[16] = "Thus saith Jehovah: Refrain thy voice from weeping, and thine eyes from tears; for thy work shall be rewarded, saith Jehovah; and they shall come again from the land of the enemy.";
yng[16] = "Thus said Jehovah: Withhold thy voice from weeping, and thine eyes from tears, For there is a reward for thy work, An affirmation of Jehovah, And they have turned back from the land of the enemy.";
dby[16] = "Thus saith Jehovah: Refrain thy voice from weeping, and thine eyes from tears; for there is a reward for thy work, saith Jehovah; and they shall come again from the land of the enemy.";
web[16] = "Thus saith the LORD; Refrain thy voice from weeping, and thy eyes from tears: for thy work shall be rewarded, saith the LORD; and they shall come again from the land of the enemy.";
hnv[16] = "Thus says the LORD: Refrain your voice from weeping, and your eyes from tears; for your work shall be rewarded, says the LORD; and they shall come again from the land of the enemy.";
vul[16] = "haec dicit Dominus quiescat vox tua a ploratu et oculi tui a lacrimis quia est merces operi tuo ait Dominus et revertentur de terra inimici";
kjv[17] = "And there is hope in thine end, saith the LORD, that thy children shall come again to their own border.";
rsv[17] = "There is hope for your future, says the LORD, and your children shall come back to their own country.";
asv[17] = "And there is hope for thy latter end, saith Jehovah; and [thy] children shall come again to their own border.";
yng[17] = "And there is hope for thy latter end, An affirmation of Jehovah, And the sons have turned back [to] their border.";
dby[17] = "And there is hope for thy latter end, saith Jehovah, and thy children shall come again to their own border.";
web[17] = "And there is hope in thy end, saith the LORD, that thy children shall come again to their own border.";
hnv[17] = "There is hope for your latter end, says the LORD; and [your] children shall come again to their own border.";
vul[17] = "et est spes novissimis tuis ait Dominus et revertentur filii ad terminos suos";
kjv[18] = "I have surely heard Ephraim bemoaning himself [thus]; Thou hast chastised me, and I was chastised, as a bullock unaccustomed [to the yoke]: turn thou me, and I shall be turned; for thou [art] the LORD my God.";
rsv[18] = "I have heard E\'phraim bemoaning, \'Thou hast chastened me, and I was chastened, like an untrained calf; bring me back that I may be restored, for thou art the LORD my God.";
asv[18] = "I have surely heard Ephraim bemoaning himself [thus], Thou hast chastised me, and I was chastised, as a calf unaccustomed [to the yoke]: turn thou me, and I shall be turned; for thou art Jehovah my God.";
yng[18] = "I have surely heard Ephraim bemoaning himself, `Thou hast chastised me, And I am chastised, as a heifer not taught, Turn me back, and I turn back, For thou [art] Jehovah my God.";
dby[18] = "I have indeed heard Ephraim bemoaning himself [thus]: Thou hast chastised me, and I was chastised as a bullock not trained: turn thou me, and I shall be turned; for thou art Jehovah my God.";
web[18] = "I have surely heard Ephraim bemoaning himself [thus]; Thou hast chastised me, and I was chastised, as a bullock unaccustomed [to the yoke]: turn thou me, and I shall be turned; for thou [art] the LORD my God.";
hnv[18] = "I have surely heard Efrayim bemoaning himself [thus], You have chastised me, and I was chastised, as a calf unaccustomed [to the yoke]: turn you me, and I shall be turned; for you are the LORD my God.";
vul[18] = "audiens audivi Ephraim transmigrantem castigasti me et eruditus sum quasi iuvenculus indomitus converte me et revertar quia tu Dominus Deus meus";
kjv[19] = "Surely after that I was turned, I repented; and after that I was instructed, I smote upon [my] thigh: I was ashamed, yea, even confounded, because I did bear the reproach of my youth.";
rsv[19] = "For after I had turned away I repented; and after I was instructed, I smote upon my thigh; I was ashamed, and I was confounded, because I bore the disgrace of my youth.\'";
asv[19] = "Surely after that I was turned, I repented; and after that I was instructed, I smote upon my thigh: I was ashamed, yea, even confounded, because I did bear the reproach of my youth.";
yng[19] = "For after my turning back I repented, And after my being instructed I struck on the thigh, I have been ashamed, I have also blushed, For I have borne the reproach of my youth.";
dby[19] = "Surely after that I was turned, I repented; and after I knew myself, I smote upon [my] thigh. I was ashamed, yea, even confounded, for I bear the reproach of my youth.";
web[19] = "Surely after I was turned, I repented; and after I was instructed, I smote upon [my] thigh: I was ashamed, and even confounded, because I bore the reproach of my youth.";
hnv[19] = "Surely after that I was turned, I repented; and after that I was instructed, I struck on my thigh: I was ashamed, yes, even confounded, because I did bear the reproach of my youth.";
vul[19] = "postquam enim convertisti me egi paenitentiam et postquam ostendisti mihi percussi femur meum confusus sum et erubui quoniam sustinui obprobrium adulescentiae meae";
kjv[20] = "[Is] Ephraim my dear son? [is he] a pleasant child? for since I spake against him, I do earnestly remember him still: therefore my bowels are troubled for him; I will surely have mercy upon him, saith the LORD.";
rsv[20] = "Is E\'phraim my dear son? Is he my darling child? For as often as I speak against him, I do remember him still. Therefore my heart yearns for him; I will surely have mercy on him, says the LORD.";
asv[20] = "Is Ephraim my dear son? is he a darling child? for as often as I speak against him, I do earnestly remember him still: therefore my heart yearneth for him; I will surely have mercy upon him, saith Jehovah.";
yng[20] = "A precious son is Ephraim to Me? A child of delights? For since My speaking against him, I do thoroughly remember him still, Therefore have My bowels been moved for him, I do greatly love him, An affirmation of Jehovah.";
dby[20] = "Is Ephraim a dear son unto me? is he a child of delights? For whilst I have been speaking against him, I do constantly remember him still. Therefore my bowels are troubled for him: I will certainly have mercy upon him, saith Jehovah.";
web[20] = "[Is] Ephraim my dear son? [is he] a pleasant child? for since I spoke against him, I do earnestly remember him still: therefore my bowels are troubled for him; I will surely have mercy upon him, saith the LORD.";
hnv[20] = "Is Efrayim my dear son? is he a darling child? for as often as I speak against him, I do earnestly remember him still: therefore my heart yearns for him; I will surely have mercy on him, says the LORD.";
vul[20] = "si filius honorabilis mihi Ephraim si puer delicatus quia ex quo locutus sum de eo adhuc recordabor eius idcirco conturbata sunt viscera mea super eum miserans miserebor eius ait Dominus";
kjv[21] = "Set thee up waymarks, make thee high heaps: set thine heart toward the highway, [even] the way [which] thou wentest: turn again, O virgin of Israel, turn again to these thy cities.";
rsv[21] = "&quot;Set up waymarks for yourself, make yourself guideposts; consider well the highway, the road by which you went. Return, O virgin Israel, return to these your cities.";
asv[21] = "Set thee up waymarks, make thee guide-posts; set thy heart toward the highway, even the way by which thou wentest: turn again, O virgin of Israel, turn again to these thy cities.";
yng[21] = "Set up for thee signs, make for thee heaps, Set thy heart to the highway, the way thou wentest, Turn back, O virgin of Israel, Turn back unto these thy cities.";
dby[21] = "Set up waymarks, make for thyself signposts; set thy heart toward the highway, the way by which thou wentest: turn again, O virgin of Israel, turn again to these thy cities.";
web[21] = "Set thee up way-marks, make thee high heaps: set thy heart towards the highway, [even] the way [which] thou wentest; turn again, O virgin of Israel, turn again to these thy cities.";
hnv[21] = "Set up road signs, make guideposts; set your heart toward the highway, even the way by which you went: turn again, virgin of Yisra\'el, turn again to these your cities.";
vul[21] = "statue tibi speculam pone tibi amaritudines dirige cor tuum in viam directam in qua ambulasti revertere virgo Israhel revertere ad civitates tuas istas";
kjv[22] = "How long wilt thou go about, O thou backsliding daughter? for the LORD hath created a new thing in the earth, A woman shall compass a man.";
rsv[22] = "How long will you waver, O faithless daughter? For the LORD has created a new thing on the earth: a woman protects a man.&quot;";
asv[22] = "How long wilt thou go hither and thither, O thou backsliding daughter? for Jehovah hath created a new thing in the earth: a woman shall encompass a man.";
yng[22] = "Till when dost thou withdraw thyself, O backsliding daughter? For Jehovah hath prepared a new thing in the land, Woman doth compass man.";
dby[22] = "How long wilt thou wander about, thou backsliding daughter? For Jehovah hath created a new thing on the earth, a woman shall encompass a man.";
web[22] = "How long wilt thou wander about, O thou backsliding daughter? for the LORD hath created a new thing in the earth, A woman shall compass a man.";
hnv[22] = "How long will you go here and there, you backsliding daughter? for the LORD has created a new thing in the eretz: a woman shall encompass a man.";
vul[22] = "usquequo deliciis dissolveris filia vaga quia creavit Dominus novum super terram femina circumdabit virum";
kjv[23] = "Thus saith the LORD of hosts, the God of Israel; As yet they shall use this speech in the land of Judah and in the cities thereof, when I shall bring again their captivity; The LORD bless thee, O habitation of justice, [and] mountain of holiness.";
rsv[23] = "Thus says the LORD of hosts, the God of Israel: &quot;Once more they shall use these words in the land of Judah and in its cities, when I restore their fortunes: \'The LORD bless you, O habitation of righteousness, O holy hill!\'";
asv[23] = "Thus saith Jehovah of hosts, the God of Israel, Yet again shall they use this speech in the land of Judah and in the cities thereof, when I shall bring again their captivity: Jehovah bless thee, O habitation of righteousness, O mountain of holiness.";
yng[23] = "Thus said Jehovah of Hosts, God of Israel, Still they say this word in the land of Judah, And in its cities, In My turning back [to] their captivity, Jehovah doth bless thee, habitation of righteousness, Mountain of holiness.";
dby[23] = "Thus saith Jehovah of hosts, the God of Israel: They shall again use this speech, in the land of Judah and in the cities thereof, when I shall turn their captivity: Jehovah bless thee, O habitation of righteousness, mountain of holiness!";
web[23] = "Thus saith the LORD of hosts, the God of Israel; As yet they shall use this speech in the land of Judah and in her cities, when I shall bring again their captivity; The LORD bless thee, O habitation of justice, mountain of holiness.";
hnv[23] = "Thus says the LORD of Hosts, the God of Yisra\'el, Yet again shall they use this speech in the land of Yehudah and in the cities of it, when I shall bring again their captivity: the LORD bless you, habitation of righteousness, mountain of holiness.";
vul[23] = "haec dicit Dominus exercituum Deus Israhel adhuc dicent verbum istud in terra Iuda et in urbibus eius cum convertero captivitatem eorum benedicat tibi Dominus pulchritudo iustitiae mons sanctus";
kjv[24] = "And there shall dwell in Judah itself, and in all the cities thereof together, husbandmen, and they [that] go forth with flocks.";
rsv[24] = "And Judah and all its cities shall dwell there together, and the farmers and those who wander with their flocks.";
asv[24] = "And Judah and all the cities thereof shall dwell therein together, the husbandmen, and they that go about with flocks.";
yng[24] = "And dwelt in Judah have husbandmen, and in all its cities together, And they have journeyed in order.";
dby[24] = "And therein shall dwell Judah, and all the cities thereof together, the husbandmen, and they that go about with flocks.";
web[24] = "And there shall dwell in Judah itself, and in all her cities together, husbandmen, and they [that] go forth with flocks.";
hnv[24] = "Yehudah and all the cities of it shall dwell therein together, the farmers, and those who go about with flocks.";
vul[24] = "et habitabunt in eo Iudas et omnes civitates eius simul agricolae et minantes greges";
kjv[25] = "For I have satiated the weary soul, and I have replenished every sorrowful soul.";
rsv[25] = "For I will satisfy the weary soul, and every languishing soul I will replenish.&quot;";
asv[25] = "For I have satiated the weary soul, and every sorrowful soul have I replenished.";
yng[25] = "For I have satiated the weary soul, And every grieved soul I have filled.\'";
dby[25] = "For I have satiated the weary soul, and every languishing soul have I replenished.";
web[25] = "For I have satiated the weary soul, and I have replenished every sorrowful soul.";
hnv[25] = "For I have satiated the weary soul, and every sorrowful soul have I replenished.";
vul[25] = "quia inebriavi animam lassam et omnem animam esurientem saturavi";
kjv[26] = "Upon this I awaked, and beheld; and my sleep was sweet unto me.";
rsv[26] = "Thereupon I awoke and looked, and my sleep was pleasant to me.";
asv[26] = "Upon this I awaked, and beheld; and my sleep was sweet unto me.";
yng[26] = "On this I have awaked, and I behold, and my sleep hath been sweet to me.";
dby[26] = "-- Upon this I awaked, and beheld; and my sleep was sweet unto me.";
web[26] = "Upon this I awaked, and beheld; and my sleep was sweet to me.";
hnv[26] = "On this I awakened, and saw; and my sleep was sweet to me.";
vul[26] = "ideo quasi de somno suscitatus sum et vidi et somnus meus dulcis mihi";
kjv[27] = "Behold, the days come, saith the LORD, that I will sow the house of Israel and the house of Judah with the seed of man, and with the seed of beast.";
rsv[27] = "&quot;Behold, the days are coming, says the LORD, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.";
asv[27] = "Behold, the days come, saith Jehovah, that I will sow the house of Israel and the house of Judah with the seed of man, and with the seed of beast.";
yng[27] = "Lo, days are coming, an affirmation of Jehovah, And I have sown the house of Israel, And the house of Judah, With seed of man, and seed of beast.";
dby[27] = "Behold, days come, saith Jehovah, that I will sow the house of Israel and the house of Judah [with] the seed of man and the seed of beast.";
web[27] = "Behold, the days come saith the LORD, that I will sow the house of Israel and the house of Judah with the seed of man, and with the seed of beast.";
hnv[27] = "Behold, the days come, says the LORD, that I will sow the house of Yisra\'el and the house of Yehudah with the seed of man, and with the seed of animal.";
vul[27] = "ecce dies veniunt dicit Dominus et seminabo domum Israhel et domum Iuda semine hominis et semine iumentorum";
kjv[28] = "And it shall come to pass, [that] like as I have watched over them, to pluck up, and to break down, and to throw down, and to destroy, and to afflict; so will I watch over them, to build, and to plant, saith the LORD.";
rsv[28] = "And it shall come to pass that as I have watched over them to pluck up and break down, to overthrow, destroy, and bring evil, so I will watch over them to build and to plant, says the LORD.";
asv[28] = "And it shall come to pass that, like as I have watched over them to pluck up and to break down and to overthrow and to destroy and to afflict, so will I watch over them to build and to plant, saith Jehovah.";
yng[28] = "And it hath been, as I watched over them to pluck up, And to break down, and to throw down, And to destroy, and to afflict; So do I watch over them to build, and to plant, An affirmation of Jehovah.";
dby[28] = "And it shall come to pass, as I have watched over them, to pluck up, and to break down, and to overthrow, and to destroy, and to afflict; so will I watch over them to build, and to plant, saith Jehovah.";
web[28] = "And it shall come to pass, [that] as I have watched over them, to pluck up, and to break down, and to throw down, and to destroy, and to afflict; so will I watch over them, to build and to plant, saith the LORD.";
hnv[28] = "It shall happen that, like as I have watched over them to pluck up and to break down and to overthrow and to destroy and to afflict, so will I watch over them to build and to plant, says the LORD.";
vul[28] = "et sicut vigilavi super eos ut evellerem et demolirer et dissiparem et disperderem et adfligerem sic vigilabo super eos ut aedificem et plantem ait Dominus";
kjv[29] = "In those days they shall say no more, The fathers have eaten a sour grape, and the children\'s teeth are set on edge.";
rsv[29] = "In those days they shall no longer say: \'The fathers have eaten sour grapes, and the children\'s teeth are set on edge.\'";
asv[29] = "In those days they shall say no more, The fathers have eaten sour grapes, and the children\'s teeth are set on edge.";
yng[29] = "In those days they do not say any more: Fathers have eaten unripe fruit, And the sons\' teeth are blunted.";
dby[29] = "In those days they shall say no more, The fathers have eaten sour grapes, and the children\'s teeth are set on edge:";
web[29] = "In those days they shall say no more, The fathers have eaten a sour grape, and the children\'s teeth are set on edge.";
hnv[29] = "In those days they shall say no more, The fathers have eaten sour grapes, and the children\'s teeth are set on edge.";
vul[29] = "in diebus illis non dicent ultra patres comederunt uvam acerbam et dentes filiorum obstipuerunt";
kjv[30] = "But every one shall die for his own iniquity: every man that eateth the sour grape, his teeth shall be set on edge.";
rsv[30] = "But every one shall die for his own sin; each man who eats sour grapes, his teeth shall be set on edge.";
asv[30] = "But every one shall die for his own iniquity: every man that eateth the sour grapes, his teeth shall be set on edge.";
yng[30] = "But -- each for his own iniquity doth die, Every man who is eating the unripe fruit, Blunted are his teeth.";
dby[30] = "for every one shall die for his own iniquity; every man that eateth the sour grapes, his teeth shall be set on edge.";
web[30] = "But every one shall die for his own iniquity: every man that eateth the sour grape, his teeth shall be set on edge.";
hnv[30] = "But everyone shall die for his own iniquity: every man who eats the sour grapes, his teeth shall be set on edge.";
vul[30] = "sed unusquisque in iniquitate sua morietur omnis homo qui comederit uvam acerbam obstupescent dentes eius";
kjv[31] = "Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah:";
rsv[31] = "&quot;Behold, the days are coming, says the LORD, when I will make a new covenant with the house of Israel and the house of Judah,";
asv[31] = "Behold, the days come, saith Jehovah, that I will make a new covenant with the house of Israel, and with the house of Judah:";
yng[31] = "Lo, days are coming, an affirmation of Jehovah, And I have made with the house of Israel And with the house of Judah a new covenant,";
dby[31] = "Behold, days come, saith Jehovah, that I will make a new covenant with the house of Israel and with the house of Judah:";
web[31] = "Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah:";
hnv[31] = "Behold, the days come, says the LORD, that I will make a new covenant with the house of Yisra\'el, and with the house of Yehudah:";
vul[31] = "ecce dies veniunt dicit Dominus et feriam domui Israhel et domui Iuda foedus novum";
kjv[32] = "Not according to the covenant that I made with their fathers in the day [that] I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, although I was an husband unto them, saith the LORD:";
rsv[32] = "not like the covenant which I made with their fathers when I took them by the hand to bring them out of the land of Egypt, my covenant which they broke, though I was their husband, says the LORD.";
asv[32] = "not according to the covenant that I made with their fathers in the day that I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, although I was a husband unto them, saith Jehovah.";
yng[32] = "Not like the covenant that I made with their fathers, In the day of My laying hold on their hand, To bring them out of the land of Egypt, In that they made void My covenant, And I ruled over them -- an affirmation of Jehovah.";
dby[32] = "not according to the covenant that I made with their fathers, in the day of my taking them by the hand, to lead them out of the land of Egypt; which my covenant they broke, although I was a husband unto them, saith Jehovah.";
web[32] = "Not according to the covenant that I made with their fathers in the day [that] I took them by the hand to bring them out of the land of Egypt; which my covenant they broke, although I was a husband to them, saith the LORD:";
hnv[32] = "not according to the covenant that I made with their fathers in the day that I took them by the hand to bring them out of the land of Mitzrayim; which my covenant they broke, although I was a husband to them, says the LORD.";
vul[32] = "non secundum pactum quod pepigi cum patribus vestris in die qua adprehendi manum eorum ut educerem eos de terra Aegypti pactum quod irritum fecerunt et ego dominatus sum eorum dicit Dominus";
kjv[33] = "But this [shall be] the covenant that I will make with the house of Israel; After those days, saith the LORD, I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.";
rsv[33] = "But this is the covenant which I will make with the house of Israel after those days, says the LORD: I will put my law within them, and I will write it upon their hearts; and I will be their God, and they shall be my people.";
asv[33] = "But this is the covenant that I will make with the house of Israel after those days, saith Jehovah: I will put my law in their inward parts, and in their heart will I write it; and I will be their God, and they shall be my people.";
yng[33] = "For this [is] the covenant that I make, With the house of Israel, after those days, An affirmation of Jehovah, I have given My law in their inward part, And on their heart I do write it, And I have been to them for God, And they are to me for a people.";
dby[33] = "For this is the covenant that I will make with the house of Israel, after those days, saith Jehovah: I will put my law in their inward parts, and will write it in their heart; and I will be their God, and they shall be my people.";
web[33] = "But this [shall be] the covenant that I will make with the house of Israel; After those days, saith the LORD, I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.";
hnv[33] = "But this is the covenant that I will make with the house of Yisra\'el after those days, says the LORD: I will put my law in their inward parts, and in their heart will I write it; and I will be their God, and they shall be my people:";
vul[33] = "sed hoc erit pactum quod feriam cum domo Israhel post dies illos dicit Dominus dabo legem meam in visceribus eorum et in corde eorum scribam eam et ero eis in Deum et ipsi erunt mihi in populum";
kjv[34] = "And they shall teach no more every man his neighbour, and every man his brother, saying, Know the LORD: for they shall all know me, from the least of them unto the greatest of them, saith the LORD: for I will forgive their iniquity, and I will remember their sin no more.";
rsv[34] = "And no longer shall each man teach his neighbor and each his brother, saying, \'Know the LORD,\' for they shall all know me, from the least of them to the greatest, says the LORD; for I will forgive their iniquity, and I will remember their sin no more.&quot;";
asv[34] = "And they shall teach no more every man his neighbor, and every man his brother, saying, Know Jehovah; for they shall all know me, from the least of them unto the greatest of them, saith Jehovah: for I will forgive their iniquity, and their sin will I remember no more.";
yng[34] = "And they do not teach any more Each his neighbour, and each his brother, Saying, Know ye Jehovah, For they all know Me, from their least unto their greatest, An affirmation of Jehovah; For I pardon their iniquity, And of their sin I make mention no more.";
dby[34] = "And they shall teach no more every man his neighbour, and every man his brother, saying, Know Jehovah; for they shall all know me, from the least of them unto the greatest of them, saith Jehovah: for I will pardon their iniquity, and their sin will I remember no more.";
web[34] = "And they shall teach no more every man his neighbor, and every man his brother, saying, Know the LORD: for they shall all know me, from the least of them to the greatest of them, saith the LORD: for I will forgive their iniquity, and I will remember their sin no more.";
hnv[34] = "and they shall teach no more every man his neighbor, and every man his brother, saying, Know the LORD; for they shall all know me, from the least of them to the greatest of them, says the LORD: for I will forgive their iniquity, and their sin will I remember no more.";
vul[34] = "et non docebunt ultra vir proximum suum et vir fratrem suum dicens cognoscite Dominum omnes enim cognoscent me a minimo eorum usque ad maximum ait Dominus quia propitiabor iniquitati eorum et peccati eorum non ero memor amplius";
kjv[35] = "Thus saith the LORD, which giveth the sun for a light by day, [and] the ordinances of the moon and of the stars for a light by night, which divideth the sea when the waves thereof roar; The LORD of hosts [is] his name:";
rsv[35] = "Thus says the LORD, who gives the sun for light by day and the fixed order of the moon and the stars for light by night, who stirs up the sea so that its waves roar--the LORD of hosts is his name:";
