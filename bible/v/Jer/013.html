csb[1] = "This is what the LORD said to me: &quot;Go and buy yourself a linen undergarment and put it on. But do not put it in water.&quot;";
csb[2] = "So I bought underwear as the LORD instructed me and put it on.";
csb[3] = "Then the word of the LORD came to me a second time:";
csb[4] = "&quot;Take the underwear that you bought and are wearing, and go at once to the Euphrates and hide it in a rocky crevice.&quot;";
csb[5] = "So I went and hid it by the Euphrates, as the LORD commanded me.";
csb[6] = "A long time later the LORD said to me, &quot;Go at once to the Euphrates and get the underwear that I commanded you to hide there.&quot;";
csb[7] = "So I went to the Euphrates and dug up the underwear and got it from the place where I had hidden it, but it was ruined -- of no use at all.";
csb[8] = "Then the word of the LORD came to me:";
csb[9] = "&quot;This is what the LORD says: Just like this I will ruin the great pride of both Judah and Jerusalem.";
csb[10] = "&quot;These evil people, who refuse to listen to me, who follow the stubbornness of their own hearts, and who have followed other gods to serve and bow in worship -- they will be like this underwear, of no use at all.";
csb[11] = "&quot;Just as underwear clings to one\'s waist, so I fastened the whole house of Israel and of Judah to me&quot; -- this is the LORD\'s declaration -- &quot;so that they might be my people for my fame, praise, and glory, but they would not obey.";
csb[12] = "&quot;Say this to them: \'This is what the LORD, the God of Israel, says: Every jar should be filled with wine.\' Then they will respond to you, \'Don\'t we know that every jar should be filled with wine? \'";
csb[13] = "&quot;And you will say to them, \'This is what the LORD says: I am about to fill all who live in this land -- the kings who reign for David on his throne, the priests, the prophets, and all the residents of Jerusalem -- with drunkenness.";
csb[14] = "&quot;I will smash them against each other, fathers and sons alike -- this is the LORD\'s declaration. I will allow no mercy, pity, or compassion to keep me from destroying them.\' &quot;";
csb[15] = "Listen and pay attention. Do not be proud, for the LORD has spoken.";
csb[16] = "Give glory to the LORD your God before he brings darkness, before your feet stumble on the mountains at dusk. You wait for light, but he brings darkest gloom and makes total darkness.";
csb[17] = "But if you will not listen, my innermost being will weep in secret because of your pride. My eyes will overflow with tears, for the LORD\'s flock has been taken captive.";
csb[18] = "Say to the king and the queen mother: Take a humble seat, for your glorious crowns have fallen from your heads.";
csb[19] = "The cities of the Negev are under siege; no one can help them. All of Judah has been taken into exile, taken completely into exile.";
csb[20] = "Look up and see those coming from the north. Where is the flock entrusted to you, the sheep that were your pride?";
csb[21] = "What will you say when he appoints close friends as leaders over you, ones you yourself trained? Won\'t labor pains seize you, as they do a woman in labor?";
csb[22] = "And when you ask yourself, &quot;Why have these things happened to me? &quot; it is because of your great guilt that your skirts have been stripped off, your body exposed.";
csb[23] = "Can the Cushite change his skin, or a leopard his spots? If so, you might be able to do what is good, you who are instructed in evil.";
csb[24] = "I will scatter you like drifting chaff before the desert wind.";
csb[25] = "This is your lot, what I have decreed for you -- this is the LORD\'s declaration -- because you have forgotten me and trusted in lies.";
csb[26] = "I will pull your skirts up over your face so that your shame might be seen.";
csb[27] = "Your adulteries and your lustful neighing, your depraved prostitution on the hills, in the fields -- I have seen your abhorrent acts. Woe to you, Jerusalem! You are unclean -- for how long yet?";

kjv[10] = "This evil people, which refuse to hear my words, which walk in the imagination of their heart, and walk after other gods, to serve them, and to worship them, shall even be as this girdle, which is good for nothing.";

dby[10] = "This evil people, who refuse to hear my words, who walk in the stubbornness of their heart, and go after other gods, to serve them and to worship them, shall even be as this girdle which is good for nothing.";

kjv[11] = "For as the girdle cleaveth to the loins of a man, so have I caused to cleave unto me the whole house of Israel and the whole house of Judah, saith the LORD; that they might be unto me for a people, and for a name, and for a praise, and for a glory: but they would not hear.";
rsv[11] = "For as the waistcloth clings to the loins of a man, so I made the whole house of Israel and the whole house of Judah cling to me, says the LORD, that they might be for me a people, a name, a praise, and a glory, but they would not listen.";
asv[11] = "For as the girdle cleaveth to the loins of a man, so have I caused to cleave unto me the whole house of Israel and the whole house of Judah, saith Jehovah; that they may be unto me for a people, and for a name, and for a praise, and for a glory: but they would not hear.";
yng[11] = "For, as the girdle cleaveth unto the loins of a man, So I caused to cleave unto Me The whole house of Israel, And the whole house of Judah, an affirmation of Jehovah, To be to Me for a people, and for a name, And for praise, and for beauty, And they have not hearkened.";
dby[11] = "For as a girdle cleaveth to the loins of a man, so have I caused to cleave unto me the whole house of Israel and the whole house of Judah, saith Jehovah; that they might be unto me for a people, and for a name, and for a praise, and for a glory: but they would not hear.";

kjv[12] = "Therefore thou shalt speak unto them this word; Thus saith the LORD God of Israel, Every bottle shall be filled with wine: and they shall say unto thee, Do we not certainly know that every bottle shall be filled with wine?";

dby[16] = "Give glory to Jehovah your God, before he cause darkness, and before your feet stumble upon the mountains of twilight; and ye shall look for light, but he will turn it into the shadow of death, and make [it] gross darkness.";

hnv[18] = "Say you to the king and to the queen-mother, Humble yourselves, sit down; for your headdresses are come down, even the crown of your glory.";

kjv[19] = "The cities of the south shall be shut up, and none shall open [them]: Judah shall be carried away captive all of it, it shall be wholly carried away captive.";
rsv[19] = "The cities of the Negeb are shut up, with none to open them; all Judah is taken into exile, wholly taken into exile.";
asv[19] = "The cities of the South are shut up, and there is none to open them: Judah is carried away captive, all of it; it is wholly carried away captive.";
yng[19] = "The cities of the south have been shut up, And there is none opening, Judah hath been removed -- all of her, She hath been removed completely --";
dby[19] = "The cities of the south are shut up, and there is none to open [them]; all Judah is carried away captive: it is wholly carried away captive.";
web[19] = "The cities of the south shall be shut up, and none shall open [them]; Judah shall be carried away captive all of it, it shall be wholly carried away captive.";
hnv[19] = "The cities of the South are shut up, and there is none to open them: Yehudah is carried away captive, all of it; it is wholly carried away captive.";
vul[19] = "civitates austri clausae sunt et non est qui aperiat translata est omnis Iudaea transmigratione perfecta";
kjv[20] = "Lift up your eyes, and behold them that come from the north: where [is] the flock [that] was given thee, thy beautiful flock?";
rsv[20] = "&quot;Lift up your eyes and see those who come from the north. Where is the flock that was given you, your beautiful flock?";
asv[20] = "Lift up your eyes, and behold them that come from the north: where is the flock that was given thee, thy beautiful flock?";
yng[20] = "Lift up your eyes, and see those coming in from the north, Where [is] the drove given to thee, thy beautiful flock?";
dby[20] = "Lift up your eyes, and behold them that come from the north. Where is the flock that was given thee, thy beautiful flock?";
web[20] = "Lift up your eyes, and behold them that come from the north: where [is] the flock [that] was given thee, thy beautiful flock?";
hnv[20] = "Lift up your eyes, and see those who come from the north: where is the flock that was given you, your beautiful flock?";
vul[20] = "levate oculos vestros et videte qui venitis ab aquilone ubi est grex qui datus est tibi pecus inclitum tuum";
kjv[21] = "What wilt thou say when he shall punish thee? for thou hast taught them [to be] captains, [and] as chief over thee: shall not sorrows take thee, as a woman in travail?";
rsv[21] = "What will you say when they set as head over you those whom you yourself have taught to be friends to you? Will not pangs take hold of you, like those of a woman in travail?";
asv[21] = "What wilt thou say, when he shall set over thee as head those whom thou hast thyself taught to be friends to thee? shall not sorrows take hold of thee, as of a woman in travail?";
yng[21] = "What dost thou say, when He looketh after thee? And thou -- thou hast taught them [to be] over thee -- leaders for head? Do not pangs seize thee as a travailing woman?";
dby[21] = "What wilt thou say when he shall visit thee, since thou thyself hast trained them to be princes in chief over thee? Shall not sorrows take thee, as a woman in travail?";
web[21] = "What wilt thou say when he shall punish thee? for thou hast taught them [to be] captains, [and] as chief over thee: shall not sorrows take thee, as a woman in travail?";
hnv[21] = "What will you say, when he shall set over you as head those whom you have yourself taught to be friends to you? shall not sorrows take hold of you, as of a woman in travail?";
vul[21] = "quid dices cum visitaverit te tu enim docuisti eos adversum te et erudisti in caput tuum numquid non dolores adprehendent te quasi mulierem parturientem";
kjv[22] = "And if thou say in thine heart, Wherefore come these things upon me? For the greatness of thine iniquity are thy skirts discovered, [and] thy heels made bare.";
rsv[22] = "And if you say in your heart, \'Why have these things come upon me?\' it is for the greatness of your iniquity that your skirts are lifted up, and you suffer violence.";
asv[22] = "And if thou say in thy heart, Wherefore are these things come upon me? for the greatness of thine iniquity are thy skirts uncovered, and thy heels suffer violence.";
yng[22] = "And when thou dost say in thy heart, `Wherefore have these met me?\' For the abundance of thine iniquity Have thy skirts been uncovered, Have thy heels suffered violence.";
dby[22] = "And if thou say in thy heart, Wherefore come these things upon me? For the greatness of thine iniquity are thy skirts uncovered, [and] thy heels have suffered violence.";
web[22] = "And if thou shalt say in thy heart, Why come these things upon me? For the greatness of thy iniquity are thy skirts uncovered, [and] thy heels made bare.";
hnv[22] = " If you say in your heart, Why are these things come on me? for the greatness of your iniquity are your skirts uncovered, and your heels suffer violence.";
vul[22] = "quod si dixeris in corde tuo quare venerunt mihi haec propter multitudinem iniquitatis tuae revelata sunt verecundiora tua pollutae sunt plantae tuae";
kjv[23] = "Can the Ethiopian change his skin, or the leopard his spots? [then] may ye also do good, that are accustomed to do evil.";
rsv[23] = "Can the Ethiopian change his skin or the leopard his spots? Then also you can do good who are accustomed to do evil.";
asv[23] = "Can the Ethiopian change his skin, or the leopard his spots? then may ye also do good, that are accustomed to do evil.";
yng[23] = "Doth a Cushite change his skin? and a leopard his spots? Ye also are able to do good, who are accustomed to do evil.";
dby[23] = "Can an Ethiopian change his skin, or a leopard his spots? [Then] may ye also do good, who are accustomed to do evil.";
web[23] = "Can the Ethiopian change his skin, or the leopard his spots? [then] may ye also do good, that are accustomed to do evil.";
hnv[23] = "Can the Kushite change his skin, or the leopard his spots? then may you also do good, who are accustomed to do evil.";
vul[23] = "si mutare potest Aethiops pellem suam aut pardus varietates suas et vos poteritis bene facere cum didiceritis malum";
kjv[24] = "Therefore will I scatter them as the stubble that passeth away by the wind of the wilderness.";
rsv[24] = "I will scatter you like chaff driven by the wind from the desert.";
asv[24] = "Therefore will I scatter them, as the stubble that passeth away, by the wind of the wilderness.";
yng[24] = "And I scatter them as stubble, Passing away, by a wind of the wilderness.";
dby[24] = "And I will scatter them as stubble that passeth away by the wind of the wilderness.";
web[24] = "Therefore will I scatter them as the stubble that passeth away by the wind of the wilderness.";
hnv[24] = "Therefore will I scatter them, as the stubble that passes away, by the wind of the wilderness.";
vul[24] = "et disseminabo eos quasi stipulam quae vento raptatur in deserto";
kjv[25] = "This [is] thy lot, the portion of thy measures from me, saith the LORD; because thou hast forgotten me, and trusted in falsehood.";
rsv[25] = "This is your lot, the portion I have measured out to you, says the LORD, because you have forgotten me and trusted in lies.";
asv[25] = "This is thy lot, the portion measured unto thee from me, saith Jehovah; because thou hast forgotten me, and trusted in falsehood.";
yng[25] = "This [is] thy lot, the portion of thy measures from Me -- an affirmation of Jehovah, Because thou hast forgotten me, And dost trust in falsehood.";
dby[25] = "This shall be thy lot, thy measured portion from me, saith Jehovah; because thou hast forgotten me, and confided in falsehood.";
web[25] = "This [is] thy lot, the portion of thy measures from me, saith the LORD; because thou hast forgotten me, and trusted in falsehood.";
hnv[25] = "This is your lot, the portion measured to you from me, says the LORD; because you have forgotten me, and trusted in falsehood.";
vul[25] = "haec sors tua parsque mensurae tuae a me dicit Dominus quia oblita es mei et confisa es in mendacio";
kjv[26] = "Therefore will I discover thy skirts upon thy face, that thy shame may appear.";
rsv[26] = "I myself will lift up your skirts over your face, and your shame will be seen.";
asv[26] = "Therefore will I also uncover thy skirts upon thy face, and thy shame shall appear.";
yng[26] = "I also have made bare thy skirts before thy face, And thy shame hath been seen.";
dby[26] = "Therefore will I also turn thy skirts over thy face, and thy shame shall be seen.";
web[26] = "Therefore will I uncover thy skirts upon thy face, that thy shame may appear.";
hnv[26] = "Therefore will I also uncover your skirts on your face, and your shame shall appear.";
vul[26] = "unde et ego nudavi femora tua contra faciem tuam et apparuit ignominia tua";
kjv[27] = "I have seen thine adulteries, and thy neighings, the lewdness of thy whoredom, [and] thine abominations on the hills in the fields. Woe unto thee, O Jerusalem! wilt thou not be made clean? when [shall it] once [be]?";
rsv[27] = "I have seen your abominations, your adulteries and neighings, your lewd harlotries, on the hills in the field. Woe to you, O Jerusalem! How long will it be before you are made clean?&quot;";
asv[27] = "I have seen thine abominations, even thine adulteries, and thy neighings, the lewdness of thy whoredom, on the hills in the field. Woe unto thee, O Jerusalem! thou wilt not be made clean; how long shall it yet be?";
yng[27] = "Thine adulteries, and thy neighings, The wickedness of thy whoredom, on heights in a field, I have seen thine abominations. Wo to thee, O Jerusalem, Thou art not cleansed, after when [is it] again?";
dby[27] = "Thine adulteries, and thy neighings, the lewdness of thy fornication, on the hills, in the fields, -- thine abominations, have I seen. Woe unto thee, Jerusalem! Wilt thou not be made clean? after how long a time yet?";
web[27] = "I have seen thy adulteries, and thy neighings, the enormity of thy lewdness, [and] thy abominations on the hills in the fields. Woe to thee O Jerusalem! wilt thou not be made clean? when [shall it] once [be]?";
hnv[27] = " I have seen your abominations, even your adulteries, and your neighing, the lewdness of your prostitution, on the hills in the field. Woe to you, Yerushalayim! you will not be made clean; how long shall it yet be?";
vul[27] = "adulteria tua et hinnitus tuus scelus fornicationis tuae super colles in agro vidi abominationes tuas vae tibi Hierusalem non mundaberis post me usquequo adhuc";
