csb[1] = "This is the word the LORD spoke about Babylon, the land of the Chaldeans, through the prophet Jeremiah:";
csb[2] = "Announce to the nations; proclaim and raise up a signal flag; proclaim, and hide nothing. Say, &quot;Babylon is captured; Bel is put to shame; Marduk is terrified.&quot; Her idols are put to shame; her false gods, devastated.";
csb[3] = "For a nation from the north will attack her; it will make her land desolate. No one will be living in it -- both people and animals will escape.";
csb[4] = "In those days and at that time -- this is the LORD\'s declaration -- the Israelites and Judeans will come together, weeping as they come, and will seek the LORD their God.";
csb[5] = "They will ask about Zion, turning their faces to this road. They will come and join themselves to the LORD in a permanent covenant that will never be forgotten.";
csb[6] = "My people were lost sheep; their shepherds led them astray, guiding them the wrong way in the mountains. They wandered from mountain to hill; they forgot their resting place.";
csb[7] = "Whoever found them devoured them. Their adversaries said, &quot;We\'re not guilty; instead, they have sinned against the LORD, their righteous grazing land, the hope of their ancestors, the LORD.&quot;";
csb[8] = "Escape from Babylon; depart from the Chaldeans\' land. Be like the rams that lead the flock.";
csb[9] = "For I will soon stir up and bring against Babylon an assembly of great nations from the north country. They will line up in battle formation against her; from there she will be captured. Their arrows will be like a skilled warrior who does not return empty-handed.";
csb[10] = "The Chaldeans will become plunder; all Babylon\'s plunderers will be fully satisfied. This is the LORD\'s declaration.";
csb[11] = "Because you rejoice, because you celebrate -- you who plundered my inheritance -- because you frolic like a young cow treading grain and neigh like stallions,";
csb[12] = "your mother will be utterly humiliated; she who bore you will be put to shame. Look! She will lag behind all the nations -- an arid wilderness, a desert.";
csb[13] = "Because of the LORD\'s wrath, she will not be inhabited; she will become a desolation, every bit of her. Everyone who passes through Babylon will be appalled and scoff because of all her wounds.";
csb[14] = "Line up in battle formation around Babylon, all you archers! Shoot at her! Do not spare an arrow, for she has sinned against the LORD.";
csb[15] = "Raise a war cry against her on every side! She has thrown up her hands in surrender; her defense towers have fallen; her walls are demolished. Since this is the LORD\'s vengeance, take your vengeance on her; as she has done, do the same to her.";
csb[16] = "Cut off the sower from Babylon as well as him who wields the sickle at harvest time. Because of the oppressor\'s sword, each will turn to his own people, each will flee to his own land.";
csb[17] = "Israel is a stray lamb, chased by lions. The first who devoured him was the king of Assyria; the last who crushed his bones was King Nebuchadnezzar of Babylon.";
csb[18] = "Therefore, this is what the LORD of Armies, the God of Israel, says: I am about to punish the king of Babylon and his land just as I punished the king of Assyria.";
csb[19] = "I will return Israel to his grazing land, and he will feed on Carmel and Bashan; he will be satisfied in the hill country of Ephraim and of Gilead.";
csb[20] = "In those days and at that time -- this is the LORD\'s declaration -- one will search for Israel\'s iniquity, but there will be none, and for Judah\'s sins, but they will not be found, for I will forgive those I leave as a remnant.";
csb[21] = "Attack the land of Merathaim, and those living in Pekod. Put them to the sword; completely destroy them -- this is the LORD\'s declaration -- do everything I have commanded you.";
csb[22] = "The sound of war is in the land -- a crushing blow!";
csb[23] = "How the hammer of the whole earth is cut down and smashed! What a horror Babylon has become among the nations!";
csb[24] = "Babylon, I laid a trap for you, and you were caught, but you did not even know it. You were found and captured because you pitted yourself against the LORD.";
csb[25] = "The LORD opened his armory and brought out his weapons of wrath, because it is a task of the Lord GOD of Armies in the land of the Chaldeans.";
csb[26] = "Come against her from the most distant places. Open her granaries; pile her up like mounds of grain and completely destroy her. Leave her no survivors.";
csb[27] = "Put all her young bulls to the sword; let them go down to the slaughter. Woe to them because their day has come, the time of their punishment.";
csb[28] = "There is a voice of fugitives and refugees from the land of Babylon. The voice announces in Zion the vengeance of the LORD our God, the vengeance for his temple.";
csb[29] = "Summon the archers to Babylon, all who string the bow; camp all around her; let none escape. Repay her according to her deeds; just as she has done, do the same to her, for she has acted arrogantly against the LORD, against the Holy One of Israel.";
csb[30] = "Therefore, her young men will fall in her public squares; all the warriors will perish in that day. This is the LORD\'s declaration.";
csb[31] = "Look, I am against you, you arrogant one -- this is the declaration of the Lord GOD of Armies -- for your day has come, the time when I will punish you.";
csb[32] = "The arrogant will stumble and fall with no one to pick him up. I will set fire to his cities, and it will consume everything around him.";
csb[33] = "This is what the LORD of Armies says: Israelites and Judeans alike have been oppressed. All their captors hold them fast; they refuse to release them.";
csb[34] = "Their Redeemer is strong; the LORD of Armies is his name. He will fervently champion their cause so that he might bring rest to the earth but turmoil to those who live in Babylon.";
csb[35] = "A sword is over the Chaldeans -- this is the LORD\'s declaration -- against those who live in Babylon, against her officials, and against her sages.";
csb[36] = "A sword is against the diviners, and they will act foolishly. A sword is against her heroic warriors, and they will be terrified.";
csb[37] = "A sword is against his horses and chariots and against all the foreigners among them, and they will be like women. A sword is against her treasuries, and they will be plundered.";
csb[38] = "A drought will come on her waters, and they will be dried up. For it is a land of carved images, and they go mad because of terrifying things.";
csb[39] = "Therefore, desert creatures will live with hyenas, and ostriches will also live in her. It will never again be inhabited or lived in through all generations.";
csb[40] = "Just as God demolished Sodom and Gomorrah and their neighboring towns -- this is the LORD\'s declaration -- so no one will live there; no human being will stay in it even temporarily as a temporary resident.";
csb[41] = "Look! A people comes from the north. A great nation and many kings will be stirred up from the remote regions of the earth.";
csb[42] = "They grasp bow and javelin. They are cruel and show no mercy. Their voice roars like the sea, and they ride on horses, lined up like men in battle formation against you, Daughter Babylon.";
csb[43] = "The king of Babylon has heard about them; his hands have become weak. Distress has seized him -- pain, like a woman in labor.";
csb[44] = "&quot;Look, it will be like a lion coming from the thickets of the Jordan to the watered grazing land. I will chase Babylon away from her land in a flash. I will appoint whoever is chosen for her. For who is like me? Who will issue me a summons? Who is the shepherd who can stand against me? &quot;";
csb[45] = "Therefore, hear the plans that the LORD has drawn up against Babylon and the strategies he has devised against the land of the Chaldeans: Certainly the flock\'s little lambs will be dragged away; certainly the grazing land will be made desolate because of them.";
csb[46] = "At the sound of Babylon\'s conquest the earth will quake; a cry will be heard among the nations.";
kjv[1] = "The word that the LORD spake against Babylon [and] against the land of the Chaldeans by Jeremiah the prophet.";
rsv[1] = "The word which the LORD spoke concerning Babylon, concerning the land of the Chalde\'ans, by Jeremiah the prophet:";
asv[1] = "The word that Jehovah spake concerning Babylon, concerning the land of the Chaldeans, by Jeremiah the prophet.";
yng[1] = "The word that Jehovah hath spoken concerning Babylon, concerning the land of the Chaldeans, by the hand of Jeremiah the prophet:";
dby[1] = "The word that Jehovah spoke concerning Babylon, concerning the land of the Chaldeans, through Jeremiah the prophet.";
web[1] = "The word that the LORD spoke against Babylon [and] against the land of the Chaldeans by Jeremiah the prophet.";
hnv[1] = "The word that the LORD spoke concerning Bavel, concerning the land of the Kasdim, by Yirmeyahu the prophet.";
vul[1] = "verbum quod locutus est Dominus de Babylone et de terra Chaldeorum in manu Hieremiae prophetae";
kjv[2] = "Declare ye among the nations, and publish, and set up a standard; publish, [and] conceal not: say, Babylon is taken, Bel is confounded, Merodach is broken in pieces; her idols are confounded, her images are broken in pieces.";
rsv[2] = "&quot;Declare among the nations and proclaim, set up a banner and proclaim, conceal it not, and say: \'Babylon is taken, Bel is put to shame, Mer\'odach is dismayed. Her images are put to shame, her idols are dismayed.\'";
asv[2] = "Declare ye among the nations and publish, and set up a standard; publish, and conceal not: say, Babylon is taken, Bel is put to shame, Merodach is dismayed; her images are put to shame, her idols are dismayed.";
yng[2] = "`Declare ye among nations, and sound, And lift up an ensign, sound, do not hide, Say ye: Captured hath been Babylon, Put to shame hath been Bel, Broken hath been Merodach, Put to shame have been her grievous things, Broken have been her idols.";
dby[2] = "Declare ye among the nations, and publish, and lift up a banner; publish, conceal not! Say, Babylon is taken, Bel is put to shame, Merodach is dismayed: her images are put to shame, her idols are dismayed.";
web[2] = "Declare ye among the nations, and publish, and set up a standard; publish, [and] conceal not: say, Babylon is taken, Bel is confounded, Merodach is broken in pieces; her idols are confounded, her images are broken in pieces.";
hnv[2] = "Declare you among the nations and publish, and set up a standard; publish, and don\'t conceal: say, Bavel is taken, Bel is disappointed, Merodakh is dismayed; her images are disappointed, her idols are dismayed.";
vul[2] = "adnuntiate in gentibus et auditum facite levate signum praedicate et nolite celare dicite capta est Babylon confusus est Bel victus est Marodach confusa sunt sculptilia eius superata sunt idola eorum";
kjv[3] = "For out of the north there cometh up a nation against her, which shall make her land desolate, and none shall dwell therein: they shall remove, they shall depart, both man and beast.";
rsv[3] = "&quot;For out of the north a nation has come up against her, which shall make her land a desolation, and none shall dwell in it; both man and beast shall flee away.";
asv[3] = "For out of the north there cometh up a nation against her, which shall make her land desolate, and none shall dwell therein: they are fled, they are gone, both man and beast.";
yng[3] = "For come up against her hath a nation from the north, It maketh her land become a desolation, And there is not an inhabitant in it. From man even unto beast, They have moved, they have gone.";
dby[3] = "For out of the north there cometh up a nation against her, which shall make her land desolate, and none shall dwell therein: both man and beast are fled; they are gone.";
web[3] = "For out of the north there cometh a nation against her, which shall make her land desolate, and none shall dwell in it, they shall remove, they shall depart, both man and beast.";
hnv[3] = " For out of the north there comes up a nation against her, which shall make her land desolate, and none shall dwell therein: they are fled, they are gone, both man and animal.";
vul[3] = "quoniam ascendit contra eam gens ab aquilone quae ponet terram eius in solitudinem et non erit qui habitet in ea ab homine usque ad pecus et moti sunt et abierunt";
kjv[4] = "In those days, and in that time, saith the LORD, the children of Israel shall come, they and the children of Judah together, going and weeping: they shall go, and seek the LORD their God.";
rsv[4] = "&quot;In those days and in that time, says the LORD, the people of Israel and the people of Judah shall come together, weeping as they come; and they shall seek the LORD their God.";
asv[4] = "In those days, and in that time, saith Jehovah, the children of Israel shall come, they and the children of Judah together; they shall go on their way weeping, and shall seek Jehovah their God.";
yng[4] = "In those days, and at that time, An affirmation of Jehovah, Come in do sons of Israel, They and sons of Judah together, Going on and weeping they go, And Jehovah their God they seek.";
dby[4] = "In those days, and at that time, saith Jehovah, the children of Israel shall come, they and the children of Judah together, going and weeping as they go, and shall seek Jehovah their God.";
web[4] = "In those days, and in that time, saith the LORD, the children of Israel shall come, they and the children of Judah together, going and weeping; they shall go, and seek the LORD their God.";
hnv[4] = "In those days, and in that time, says the LORD, the children of Yisra\'el shall come, they and the children of Yehudah together; they shall go on their way weeping, and shall seek the LORD their God.";
vul[4] = "in diebus illis et in tempore illo ait Dominus venient filii Israhel ipsi et filii Iuda simul ambulantes et flentes properabunt et Dominum Deum suum quaerent";
kjv[5] = "They shall ask the way to Zion with their faces thitherward, [saying], Come, and let us join ourselves to the LORD in a perpetual covenant [that] shall not be forgotten.";
rsv[5] = "They shall ask the way to Zion, with faces turned toward it, saying, \'Come, let us join ourselves to the LORD in an everlasting covenant which will never be forgotten.\'";
asv[5] = "They shall inquire concerning Zion with their faces thitherward, [saying], Come ye, and join yourselves to Jehovah in an everlasting covenant that shall not be forgotten.";
yng[5] = "[To] Zion they ask the way, Thitherward [are] their faces: Come in, and we are joined unto Jehovah, A covenant age-during -- not forgotten.";
dby[5] = "They shall inquire concerning Zion, with their faces thitherward, [saying,] Come, and let us join ourselves to Jehovah, in an everlasting covenant that shall not be forgotten.";
web[5] = "They shall ask the way to Zion with their faces towards it, [saying], Come, and let us join ourselves to the LORD in a perpetual covenant [that] shall not be forgotten.";
hnv[5] = "They shall inquire concerning Tziyon with their faces turned toward it, [saying], Come, and join yourselves to the LORD in an everlasting covenant that shall not be forgotten.";
vul[5] = "in Sion interrogabunt viam huc facies eorum venient et adponentur ad Dominum foedere sempiterno quod nulla oblivione delebitur";
kjv[6] = "My people hath been lost sheep: their shepherds have caused them to go astray, they have turned them away [on] the mountains: they have gone from mountain to hill, they have forgotten their restingplace.";
rsv[6] = "&quot;My people have been lost sheep; their shepherds have led them astray, turning them away on the mountains; from mountain to hill they have gone, they have forgotten their fold.";
asv[6] = "My people have been lost sheep: their shepherds have caused them to go astray; they have turned them away on the mountains; they have gone from mountain to hill; they have forgotten their resting-place.";
yng[6] = "A perishing flock hath My people been, Their shepherds have caused them to err, [To] the mountains causing them to go back, From mountain unto hill they have gone, They have forgotten their crouching-place.";
dby[6] = "My people are lost sheep; their shepherds have caused them to go astray, they turned them away on the mountains: they went from mountain to hill, they forgot their resting-place.";
web[6] = "My people have been lost sheep: their shepherds have caused them to go astray, they have turned them away [on] the mountains: they have gone from mountain to hill, they have forgotten their resting-place.";
hnv[6] = "My people have been lost sheep: their shepherds have caused them to go astray; they have turned them away on the mountains; they have gone from mountain to hill; they have forgotten their resting-place.";

kjv[7] = "All that found them have devoured them: and their adversaries said, We offend not, because they have sinned against the LORD, the habitation of justice, even the LORD, the hope of their fathers.";
rsv[7] = "All who found them have devoured them, and their enemies have said, \'We are not guilty, for they have sinned against the LORD, their true habitation, the LORD, the hope of their fathers.\'";
asv[7] = "All that found them have devoured them; and their adversaries said, We are not guilty, because they have sinned against Jehovah, the habitation of righteousness, even Jehovah, the hope of their fathers.";
yng[7] = "All finding them have devoured them, And their adversaries have said: We are not guilty, Because that they sinned against Jehovah, The habitation of righteousness, And the hope of their fathers -- Jehovah.";
dby[7] = "All that found them devoured them, and their adversaries said, We are not guilty, because they have sinned against Jehovah, the habitation of righteousness, even Jehovah, the hope of their fathers.";
web[7] = "All that found them have devoured them: and their adversaries said, We offend not, because they have sinned against the LORD, the habitation of justice, even the LORD, the hope of their fathers.";
hnv[7] = "All who found them have devoured them; and their adversaries said, We are not guilty, because they have sinned against the LORD, the habitation of righteousness, even the LORD, the hope of their fathers.";

kjv[8] = "Remove out of the midst of Babylon, and go forth out of the land of the Chaldeans, and be as the he goats before the flocks.";
rsv[8] = "&quot;Flee from the midst of Babylon, and go out of the land of the Chalde\'ans, and be as he-goats before the flock.";
asv[8] = "Flee out of the midst of Babylon, and go forth out of the land of the Chaldeans, and be as the he-goats before the flocks.";
yng[8] = "Move ye from the midst of Babylon, And from the land of the Chaldeans go out. And be as he-goats before a flock.";
dby[8] = "Flee out of the midst of Babylon, and go forth out of the land of the Chaldeans, and be as the he-goats before the flock.";
web[8] = "Remove out of the midst of Babylon, and go forth from the land of the Chaldeans, and be as the he-goats before the flocks.";
hnv[8] = "Flee out of the midst of Bavel, and go forth out of the land of the Kasdim, and be as the male goats before the flocks.";
vul[8] = "recedite de medio Babylonis et de terra Chaldeorum egredimini et estote quasi hedi ante greges";
kjv[9] = "For, lo, I will raise and cause to come up against Babylon an assembly of great nations from the north country: and they shall set themselves in array against her; from thence she shall be taken: their arrows [shall be] as of a mighty expert man; none shall return in vain.";
rsv[9] = "For behold, I am stirring up and bringing against Babylon a company of great nations, from the north country; and they shall array themselves against her; from there she shall be taken. Their arrows are like a skilled warrior who does not return empty-handed.";
asv[9] = "For, lo, I will stir up and cause to come up against Babylon a company of great nations from the north country; and they shall set themselves in array against her; from thence she shall be taken: their arrows shall be as of an expert mighty man; none shall return in vain.";
yng[9] = "For, lo, I am stirring up, And am causing to come up against Babylon, An assembly of great nations from a land of the north, And they have set in array against her, From thence she is captured, Its arrow -- as a skilful hero -- returneth not empty,";
dby[9] = "For behold, I will raise and cause to come up against Babylon, an assemblage of great nations from the north country; and they shall set themselves in array against her: from thence shall she be taken. Their arrows shall be as those of a mighty expert man: none shall return empty.";
web[9] = "For lo, I will raise and cause to come against Babylon an assembly of great nations from the north country: and they shall set themselves in array against her; from thence she shall be taken: their arrows [shall be] as of a mighty expert man; none shall return in vain.";
hnv[9] = "For, behold, I will stir up and cause to come up against Bavel a company of great nations from the north country; and they shall set themselves in array against her; from there she shall be taken: their arrows shall be as of an expert mighty man; none shall return in vain.";
vul[9] = "quoniam ecce ego suscito et adducam in Babylonem congregationem gentium magnarum de terra aquilonis et praeparabuntur adversum eam et inde capietur sagitta eius quasi viri fortis interfectoris non revertetur vacua";
kjv[10] = "And Chaldea shall be a spoil: all that spoil her shall be satisfied, saith the LORD.";
rsv[10] = "Chalde\'a shall be plundered; all who plunder her shall be sated, says the LORD.";
asv[10] = "And Chaldea shall be a prey: all that prey upon her shall be satisfied, saith Jehovah.";
yng[10] = "And Chaldea hath been for a spoil, All her spoilers are satisfied, An affirmation of Jehovah.";
dby[10] = "And Chaldea shall be a spoil: all the spoilers thereof shall be satiated, saith Jehovah.";
web[10] = "And Chaldea shall be a spoil: all that spoil her shall be satisfied, saith the LORD.";
hnv[10] = "Kasdim shall be a prey: all who prey on her shall be satisfied, says the LORD.";
vul[10] = "et erit Chaldea in praedam omnes vastantes eam replebuntur ait Dominus";
kjv[11] = "Because ye were glad, because ye rejoiced, O ye destroyers of mine heritage, because ye are grown fat as the heifer at grass, and bellow as bulls;";
rsv[11] = "&quot;Though you rejoice, though you exult, O plunderers of my heritage, though you are wanton as a heifer at grass, and neigh like stallions,";
asv[11] = "Because ye are glad, because ye rejoice, O ye that plunder my heritage, because ye are wanton as a heifer that treadeth out [the grain], and neigh as strong horses;";
yng[11] = "Because thou rejoicest, because thou exultest, O spoilers of Mine inheritance, Because thou increasest as a heifer [at] the tender grass, And dost cry aloud as bulls,";
dby[11] = "For ye rejoiced, for ye triumphed, ye plunderers of my heritage; for ye have been wanton as the heifer at grass, and neighed as steeds.";
web[11] = "Because ye were glad, because ye rejoiced, O ye destroyers of my heritage, because ye are grown fat as the heifer at grass, and bellow as bulls;";
hnv[11] = "Because you are glad, because you rejoice, O you who plunder my heritage, because you are wanton as a heifer that treads out [the grain], and neigh as strong horses;";
vul[11] = "quoniam exultatis et magna loquimini diripientes hereditatem meam quoniam effusi estis sicut vitulus super herbam et mugistis ut tauri";
kjv[12] = "Your mother shall be sore confounded; she that bare you shall be ashamed: behold, the hindermost of the nations [shall be] a wilderness, a dry land, and a desert.";
rsv[12] = "your mother shall be utterly shamed, and she who bore you shall be disgraced. Lo, she shall be the last of the nations, a wilderness dry and desert.";
asv[12] = "your mother shall be utterly put to shame; she that bare you shall be confounded: behold, she shall be the hindermost of the nations, a wilderness, a dry land, and a desert.";
yng[12] = "Ashamed hath been your mother greatly, Confounded hath she been that bare you, Lo, the hindermost of nations [is] a wilderness, A dry land, and a desert.";
dby[12] = "Your mother hath been sorely put to shame; she that bore you hath been covered with reproach: behold, [she is become] hindmost of the nations, a wilderness, a dry land, and a desert.";
web[12] = "Your mother shall be greatly confounded; she that bore you shall be ashamed: behold, the hindermost of the nations [shall be] a wilderness, a dry land, and a desert.";
hnv[12] = "your mother shall be utterly disappointed; she who bore you shall be confounded: behold, she shall be the least of the nations, a wilderness, a dry land, and a desert.";
vul[12] = "confusa est mater vestra nimis et adaequata pulveri quae genuit vos ecce novissima erit in gentibus deserta invia et arens";
kjv[13] = "Because of the wrath of the LORD it shall not be inhabited, but it shall be wholly desolate: every one that goeth by Babylon shall be astonished, and hiss at all her plagues.";
rsv[13] = "Because of the wrath of the LORD she shall not be inhabited, but shall be an utter desolation; every one who passes by Babylon shall be appalled, and hiss because of all her wounds.";
asv[13] = "Because of the wrath of Jehovah she shall not be inhabited, but she shall be wholly desolate: every one that goeth by Babylon shall be astonished, and hiss at all her plagues.";
yng[13] = "Because of the wrath of Jehovah it is not inhabited, And it hath been a desolation -- all of it. Every passer by at Babylon is astonished, And doth hiss because of all her plagues.";
dby[13] = "Because of the wrath of Jehovah, it shall not be inhabited, but it shall be wholly desolate; every one that goeth by Babylon shall be astonished, and shall hiss, because of all her plagues.";
web[13] = "Because of the wrath of the LORD it shall not be inhabited, but it shall be wholly desolate: every one that goeth by Babylon shall be astonished, and hiss at all her plagues.";
hnv[13] = "Because of the wrath of the LORD she shall not be inhabited, but she shall be wholly desolate: everyone who goes by Bavel shall be astonished, and hiss at all her plagues.";
vul[13] = "ab ira Domini non habitabitur sed redigetur tota in solitudinem omnis qui transit per Babylonem stupebit et sibilabit super universis plagis eius";
kjv[14] = "Put yourselves in array against Babylon round about: all ye that bend the bow, shoot at her, spare no arrows: for she hath sinned against the LORD.";
rsv[14] = "Set yourselves in array against Babylon round about, all you that bend the bow; shoot at her, spare no arrows, for she has sinned against the LORD.";
asv[14] = "Set yourselves in array against Babylon round about, all ye that bend the bow; shoot at her, spare no arrows: for she hath sinned against Jehovah.";
yng[14] = "Set yourselves in array against Babylon round about, All ye treading a bow, Shoot at her, have no pity on the arrow, For against Jehovah she hath sinned.";
dby[14] = "Put yourselves in array against Babylon round about, all ye that bend the bow; shoot at her, spare no arrows: for she hath sinned against Jehovah.";
web[14] = "Put yourselves in array against Babylon on every side: all ye that bend the bow, shoot at her, spare no arrows: for she hath sinned against the LORD.";
hnv[14] = "Set yourselves in array against Bavel round about, all you who bend the bow; shoot at her, spare no arrows: for she has sinned against the LORD.";
vul[14] = "praeparamini contra Babylonem per circuitum omnes qui intenditis arcum debellate eam non parcatis iaculis quia Domino peccavit";
kjv[15] = "Shout against her round about: she hath given her hand: her foundations are fallen, her walls are thrown down: for it [is] the vengeance of the LORD: take vengeance upon her; as she hath done, do unto her.";
rsv[15] = "Raise a shout against her round about, she has surrendered; her bulwarks have fallen, her walls are thrown down. For this is the vengeance of the LORD: take vengeance on her, do to her as she has done.";
asv[15] = "Shout against her round about: she hath submitted herself; her bulwarks are fallen, her walls are thrown down; for it is the vengeance of Jehovah: take vengeance upon her; as she hath done, do unto her.";
yng[15] = "Shout against her round about, She hath given forth her hand, Fallen have her foundations, Thrown down have been her walls, For it [is] the vengeance of Jehovah, Be avenged of her, as she did -- do ye to her.";
dby[15] = "Shout against her round about: she hath given her hand; her ramparts are fallen, her walls are thrown down: for this is the vengeance of Jehovah. Take vengeance upon her; as she hath done, do unto her.";
web[15] = "Shout against her on every side; she hath given her hand: her foundations are fallen, her walls are thrown down: for it [is] the vengeance of the LORD: take vengeance upon her; as she hath done, do to her.";
hnv[15] = "Shout against her round about: she has submitted herself; her bulwarks are fallen, her walls are thrown down; for it is the vengeance of the LORD: take vengeance on her; as she has done, do to her.";
vul[15] = "clamate adversus eam ubique dedit manum ceciderunt fundamenta eius destructi sunt muri eius quoniam ultio Domini est ultionem accipite de ea sicut fecit facite ei";
kjv[16] = "Cut off the sower from Babylon, and him that handleth the sickle in the time of harvest: for fear of the oppressing sword they shall turn every one to his people, and they shall flee every one to his own land.";
rsv[16] = "Cut off from Babylon the sower, and the one who handles the sickle in time of harvest; because of the sword of the oppressor, every one shall turn to his own people, and every one shall flee to his own land.";
asv[16] = "Cut off the sower from Babylon, and him that handleth the sickle in the time of harvest: for fear of the oppressing sword they shall turn every one to his people, and they shall flee every one to his own land.";
yng[16] = "Cut off the sower from Babylon, And him handling the sickle in the time of harvest, Because of the oppressing sword, Each unto his people -- they turn, And each to his land -- they flee.";
dby[16] = "Cut off the sower from Babylon, and him that handleth the sickle in the time of harvest. For fear of the oppressing sword let them turn every one to his people, and let them flee every one to his own land.";
web[16] = "Cut off the sower from Babylon, and him that handleth the sickle in the time of harvest: for fear of the oppressing sword they shall turn every one to his people, and they shall flee every one to his own land.";
hnv[16] = "Cut off the sower from Bavel, and him who handles the sickle in the time of harvest: for fear of the oppressing sword they shall turn everyone to his people, and they shall flee everyone to his own land.";
vul[16] = "disperdite satorem de Babylone et tenentem falcem in tempore messis a facie gladii columbae unusquisque ad populum suum convertetur et singuli ad terram suam fugient";
kjv[17] = "Israel [is] a scattered sheep; the lions have driven [him] away: first the king of Assyria hath devoured him; and last this Nebuchadrezzar king of Babylon hath broken his bones.";
rsv[17] = "&quot;Israel is a hunted sheep driven away by lions. First the king of Assyria devoured him, and now at last Nebuchadrez\'zar king of Babylon has gnawed his bones.";
asv[17] = "Israel is a hunted sheep; the lions have driven him away: first, the king of Assyria devoured him; and now at last Nebuchadrezzar king of Babylon hath broken his bones.";
yng[17] = "A scattered sheep is Israel, lions have driven away, At first, devour him did the king of Asshur, And now, at last, broken his bone Hath Nebuchadrezzar king of Babylon.";
dby[17] = "Israel is a hunted sheep; the lions have driven him away: first the king of Assyria devoured him, and last this Nebuchadrezzar king of Babylon hath broken his bones.";
web[17] = "Israel [is] a scattered sheep; the lions have driven [him] away: first the king of Assyria hath devoured him; and last this Nebuchadrezzar king of Babylon hath broken his bones.";
hnv[17] = "Yisra\'el is a hunted sheep; the lions have driven him away: first, the king of Ashshur devoured him; and now at last Nevukhadretztzar king of Bavel has broken his bones.";
vul[17] = "grex dispersus Israhel leones eiecerunt eum primus comedit eum rex Assur iste novissimus exossavit eum Nabuchodonosor rex Babylonis";
kjv[18] = "Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will punish the king of Babylon and his land, as I have punished the king of Assyria.";
rsv[18] = "Therefore, thus says the LORD of hosts, the God of Israel: Behold, I am bringing punishment on the king of Babylon and his land, as I punished the king of Assyria.";
asv[18] = "Therefore thus saith Jehovah of hosts, the God of Israel: Behold, I will punish the king of Babylon and his land, as I have punished the king of Assyria.";
yng[18] = "Therefore thus said Jehovah of Hosts, God of Israel: Lo, I am seeing after the king of Babylon, And after his land, As I have seen after the king of Asshur;";
dby[18] = "Therefore thus saith Jehovah of hosts, the God of Israel: Behold, I will visit the king of Babylon and his land, like as I have visited the king of Assyria.";
web[18] = "Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will punish the king of Babylon and his land, as I have punished the king of Assyria.";
hnv[18] = "Therefore thus says the LORD of Hosts, the God of Yisra\'el: Behold, I will punish the king of Bavel and his land, as I have punished the king of Ashshur.";
vul[18] = "propterea haec dicit Dominus exercituum Deus Israhel ecce ego visitabo regem Babylonis et terram eius sicut visitavi regem Assur";
kjv[19] = "And I will bring Israel again to his habitation, and he shall feed on Carmel and Bashan, and his soul shall be satisfied upon mount Ephraim and Gilead.";
rsv[19] = "I will restore Israel to his pasture, and he shall feed on Carmel and in Bashan, and his desire shall be satisfied on the hills of E\'phraim and in Gilead.";
asv[19] = "And I will bring Israel again to his pasture, and he shall feed on Carmel and Bashan, and his soul shall be satisfied upon the hills of Ephraim and in Gilead.";
yng[19] = "And I have brought back Israel unto his habitation, And he hath fed on Carmel, and on Bashan. And in mount Ephraim, and on Gilead is his soul satisfied.";
dby[19] = "And I will bring Israel again to his pasture, and he shall feed on Carmel and Bashan, and his soul shall be satisfied upon mount Ephraim and in Gilead.";
web[19] = "And I will bring Israel again to his habitation, and he shall feed on Carmel and Bashan, and his soul shall be satisfied upon mount Ephraim and Gilead.";
hnv[19] = "I will bring Yisra\'el again to his pasture, and he shall feed on Karmel and Bashan, and his soul shall be satisfied on the hills of Efrayim and in Gil`ad.";
vul[19] = "et reducam Israhel ad habitaculum suum et pascetur Carmelum et Basan et in monte Ephraim et Galaad saturabitur anima eius";
kjv[20] = "In those days, and in that time, saith the LORD, the iniquity of Israel shall be sought for, and [there shall be] none; and the sins of Judah, and they shall not be found: for I will pardon them whom I reserve.";
rsv[20] = "In those days and in that time, says the LORD, iniquity shall be sought in Israel, and there shall be none; and sin in Judah, and none shall be found; for I will pardon those whom I leave as a remnant.";
asv[20] = "In those days, and in that time, saith Jehovah, the iniquity of Israel shall be sought for, and there shall be none; and the sins of Judah, and they shall not be found: for I will pardon them whom I leave as a remnant.";
yng[20] = "In those days, and at that time, An affirmation of Jehovah, Sought is the iniquity of Israel, and it is not, And the sin of Judah, and it is not found, For I am propitious to those whom I leave!";
dby[20] = "In those days, and at that time, saith Jehovah, the iniquity of Israel shall be sought for, and there shall be none; and the sins of Judah, and they shall not be found: for I will pardon those whom I leave remaining.";
web[20] = "In those days, and in that time, saith the LORD, the iniquity of Israel shall be sought for, and [there shall] be none; and the sins of Judah, and they shall not be found: for I will pardon them whom I reserve.";
hnv[20] = "In those days, and in that time, says the LORD, the iniquity of Yisra\'el shall be sought for, and there shall be none; and the sins of Yehudah, and they shall not be found: for I will pardon them whom I leave as a remnant.";
vul[20] = "in diebus illis et in tempore illo ait Dominus quaeretur iniquitas Israhel et non erit et peccatum Iuda et non invenietur quoniam propitius ero eis quos reliquero";
kjv[21] = "Go up against the land of Merathaim, [even] against it, and against the inhabitants of Pekod: waste and utterly destroy after them, saith the LORD, and do according to all that I have commanded thee.";
rsv[21] = "&quot;Go up against the land of Meratha\'im, and against the inhabitants of Pekod. Slay, and utterly destroy after them, says the LORD, and do all that I have commanded you.";
asv[21] = "Go up against the land of Merathaim, even against it, and against the inhabitants of Pekod: slay and utterly destroy after them, saith Jehovah, and do according to all that I have commanded thee.";
yng[21] = "Against the land of Merathaim: Go up against it, and unto the inhabitants of Pekod, Waste and devote their posterity, An affirmation of Jehovah, And do according to all that I have commanded thee.";
dby[21] = "Go up against the land of double rebellion, against it, and against the inhabitants of visitation; waste and utterly destroy after them, saith Jehovah, and do according to all that I have commanded thee.";
web[21] = "Go up against the land of Merathaim, [even] against it, and against the inhabitants of Pekod: waste and utterly destroy after them, saith the LORD, and do according to all that I have commanded thee.";
hnv[21] = "Go up against the land of Meratayim, even against it, and against the inhabitants of Pekod: kill and utterly destroy after them, says the LORD, and do according to all that I have commanded you.";
vul[21] = "super terram dominantium ascende et super habitatores eius visita dissipa et interfice quae post eos sunt ait Dominus et fac iuxta omnia quae praecepi tibi";
kjv[22] = "A sound of battle [is] in the land, and of great destruction.";
rsv[22] = "The noise of battle is in the land, and great destruction!";
asv[22] = "A sound of battle is in the land, and of great destruction.";
yng[22] = "A noise of battle [is] in the land, and of great destruction.";
dby[22] = "A sound of battle is in the land, and great destruction.";
web[22] = "A sound of battle [is] in the land, and of great destruction.";
hnv[22] = "A sound of battle is in the land, and of great destruction.";
vul[22] = "vox belli in terra et contritio magna";
kjv[23] = "How is the hammer of the whole earth cut asunder and broken! how is Babylon become a desolation among the nations!";
rsv[23] = "How the hammer of the whole earth is cut down and broken! How Babylon has become a horror among the nations!";
asv[23] = "How is the hammer of the whole earth cut asunder and broken! how is Babylon become a desolation among the nations!";
yng[23] = "How hath it been cut and broken, The hammer of the whole earth! How hath Babylon been for a desolation among nations!";
dby[23] = "How is the hammer of the whole earth cut asunder and broken! How is Babylon become an astonishment among the nations!";
web[23] = "How is the hammer of the whole earth cut asunder and broken! how is Babylon become a desolation among the nations!";
hnv[23] = "How is the hammer of the whole eretz cut apart and broken! how is Bavel become a desolation among the nations!";
vul[23] = "quomodo confractus est et contritus est malleus universae terrae quomodo versa est in desertum Babylon in gentibus";
kjv[24] = "I have laid a snare for thee, and thou art also taken, O Babylon, and thou wast not aware: thou art found, and also caught, because thou hast striven against the LORD.";
rsv[24] = "I set a snare for you and you were taken, O Babylon, and you did not know it; you were found and caught, because you strove against the LORD.";
asv[24] = "I have laid a snare for thee, and thou art also taken, O Babylon, and thou wast not aware: thou art found, and also caught, because thou hast striven against Jehovah.";
yng[24] = "I have laid a snare for thee, And also -- thou art captured, O Babylon, And thou -- thou hast known, Thou hast been found, and also art caught, For against Jehovah thou hast stirred thyself up.";
dby[24] = "I have laid a snare for thee, and thou, Babylon, art also taken, and thou wast not aware; thou art found, and also caught, for thou hast contended with Jehovah.";
web[24] = "I have laid a snare for thee, and thou art also taken, O Babylon, and thou wast not aware: thou art found, and also caught, because thou hast striven against the LORD.";
hnv[24] = "I have laid a snare for you, and you are also taken, Bavel, and you weren\'t aware: you are found, and also caught, because you have striven against the LORD.";
vul[24] = "inlaqueavi te et capta es Babylon et nesciebas inventa es et adprehensa quoniam Dominum provocasti";
kjv[25] = "The LORD hath opened his armoury, and hath brought forth the weapons of his indignation: for this [is] the work of the Lord GOD of hosts in the land of the Chaldeans.";
rsv[25] = "The LORD has opened his armory, and brought out the weapons of his wrath, for the Lord GOD of hosts has a work to do in the land of the Chalde\'ans.";
asv[25] = "Jehovah hath opened his armory, and hath brought forth the weapons of his indignation; for the Lord, Jehovah of hosts, hath a work [to do] in the land of the Chaldeans.";
yng[25] = "Jehovah hath opened His treasury, And He bringeth out the weapons of His indignation, For a work [is] to the Lord Jehovah of Hosts, In the land of the Chaldeans.";
dby[25] = "Jehovah hath opened his armoury, and hath brought forth the weapons of his indignation; for this is a work for the Lord, Jehovah of hosts, in the land of the Chaldeans.";
web[25] = "The LORD hath opened his armory, and hath brought forth the weapons of his indignation: for this [is] the work of the Lord GOD of hosts in the land of the Chaldeans.";
hnv[25] = "The LORD has opened his armory, and has brought forth the weapons of his indignation; for the Lord, the LORD of Hosts, has a work [to do] in the land of the Kasdim.";
vul[25] = "aperuit Dominus thesaurum suum et protulit vasa irae suae quoniam opus est Domino Deo exercituum in terra Chaldeorum";
kjv[26] = "Come against her from the utmost border, open her storehouses: cast her up as heaps, and destroy her utterly: let nothing of her be left.";
rsv[26] = "Come against her from every quarter; open her granaries; pile her up like heaps of grain, and destroy her utterly; let nothing be left of her.";
asv[26] = "Come against her from the utmost border; open her store-houses; cast her up as heaps, and destroy her utterly; let nothing of her be left.";
yng[26] = "Come ye in to her from the extremity, Open ye her storehouses, Raise her up as heaps, and devote her, Let her have no remnant.";
dby[26] = "Come ye against her from every quarter, open her storehouses; pile her up like sheaves, and destroy her utterly: let nothing of her be left.";
web[26] = "Come against her from the utmost border, open her store-houses: cast her up as heaps, and destroy her utterly: let nothing of her be left.";
hnv[26] = "Come against her from the utmost border; open her store-houses; cast her up as heaps, and destroy her utterly; let nothing of her be left.";
vul[26] = "venite ad eam ab extremis finibus aperite ut exeant qui conculcent eam tollite de via lapides et redigite in acervos et interficite eam nec sit quicquam reliquum";
kjv[27] = "Slay all her bullocks; let them go down to the slaughter: woe unto them! for their day is come, the time of their visitation.";
rsv[27] = "Slay all her bulls, let them go down to the slaughter. Woe to them, for their day has come, the time of their punishment.";
asv[27] = "Slay all her bullocks; let them go down to the slaughter: woe unto them! for their day is come, the time of their visitation.";
yng[27] = "Slay all her kine, they go down to slaughter, Wo [is] on them, for come hath their day, The time of their inspection.";
dby[27] = "Slay all her bullocks; let them go down to the slaughter: woe unto them! for their day is come, the time of their visitation.";
web[27] = "Slay all her bullocks; let them go down to the slaughter: woe to them! for their day is come, the time of their visitation.";
hnv[27] = "Kill all her bulls; let them go down to the slaughter: woe to them! for their day is come, the time of their visitation.";
vul[27] = "dissipate universos fortes eius descendant in occisionem vae eis quia venit dies eorum tempus visitationis eorum";
kjv[28] = "The voice of them that flee and escape out of the land of Babylon, to declare in Zion the vengeance of the LORD our God, the vengeance of his temple.";
rsv[28] = "&quot;Hark! they flee and escape from the land of Babylon, to declare in Zion the vengeance of the LORD our God, vengeance for his temple.";
asv[28] = "The voice of them that flee and escape out of the land of Babylon, to declare in Zion the vengeance of Jehovah our God, the vengeance of his temple.";
yng[28] = "A voice of fugitives and escaped ones [Is] from the land of Babylon, To declare in Zion the vengeance of Jehovah our God, The vengeance of His temple.";
dby[28] = "The voice of them that flee and escape out of the land of Babylon, to declare in Zion the vengeance of Jehovah our God, the vengeance of his temple.";
web[28] = "The voice of them that flee and escape from the land of Babylon, to declare in Zion the vengeance of the LORD our God, the vengeance of his temple.";
hnv[28] = "The voice of those who flee and escape out of the land of Bavel, to declare in Tziyon the vengeance of the LORD our God, the vengeance of his temple.";
vul[28] = "vox fugientium et eorum qui evaserunt de terra Babylonis ut adnuntient in Sion ultionem Domini Dei nostri ultionem templi eius";
kjv[29] = "Call together the archers against Babylon: all ye that bend the bow, camp against it round about; let none thereof escape: recompense her according to her work; according to all that she hath done, do unto her: for she hath been proud against the LORD, against the Holy One of Israel.";
rsv[29] = "&quot;Summon archers against Babylon, all those who bend the bow. Encamp round about her; let no one escape. Requite her according to her deeds, do to her according to all that she has done; for she has proudly defied the LORD, the Holy One of Israel.";
asv[29] = "Call together the archers against Babylon, all them that bend the bow; encamp against her round about; let none thereof escape: recompense her according to her work; according to all that she hath done, do unto her; for she hath been proud against Jehovah, against the Holy One of Israel.";
yng[29] = "Summon unto Babylon archers, all treading the bow, Encamp against her round about, Let [her] have no escape; Recompense to her according to her work, According to all that she did -- do to her, For unto Jehovah she hath been proud, Unto the Holy One of Israel.";
dby[29] = "Call together the archers against Babylon, all those that bend the bow: encamp against her round about; let there be no escaping: recompense her according to her work; according to all that she hath done, do unto her: for she hath acted proudly against Jehovah, against the Holy One of Israel.";
web[29] = "Call together the archers against Babylon: all ye that bend the bow, encamp against it on every side; let none thereof escape: recompense her according to her work; according to all that she hath done, do to her: for she hath been proud against the LORD, against the Holy One of Israel.";
hnv[29] = "Call together the archers against Bavel, all those who bend the bow; encamp against her round about; let none of it escape: recompense her according to her work; according to all that she has done, do to her; for she has been proud against the LORD, against the Holy One of Yisra\'el.";
vul[29] = "adnuntiate in Babylonem plurimis omnibus qui tendunt arcum consistite adversum eam per gyrum et nullus evadat reddite ei secundum opus suum iuxta omnia quae fecit facite illi quia contra Dominum erecta est adversum Sanctum Israhel";
kjv[30] = "Therefore shall her young men fall in the streets, and all her men of war shall be cut off in that day, saith the LORD.";
rsv[30] = "Therefore her young men shall fall in her squares, and all her soldiers shall be destroyed on that day, says the LORD.";
asv[30] = "Therefore shall her young men fall in her streets, and all her men of war shall be brought to silence in that day, saith Jehovah.";
yng[30] = "Therefore fall do her young men in her broad places, And all her men of war are cut off in that day, An affirmation of Jehovah.";
dby[30] = "Therefore shall her young men fall in her streets; and all her men of war shall be cut off in that day, saith Jehovah.";
web[30] = "Therefore her young men shall fall in the streets, and all her men of war shall be cut off in that day, saith the LORD.";
hnv[30] = "Therefore shall her young men fall in her streets, and all her men of war shall be brought to silence in that day, says the LORD.";
vul[30] = "idcirco cadent iuvenes eius in plateis eius et omnes viri bellatores eius conticescent in die illa ait Dominus";
kjv[31] = "Behold, I [am] against thee, [O thou] most proud, saith the Lord GOD of hosts: for thy day is come, the time [that] I will visit thee.";
rsv[31] = "&quot;Behold, I am against you, O proud one, says the Lord GOD of hosts; for your day has come, the time when I will punish you.";
asv[31] = "Behold, I am against thee, O thou proud one, saith the Lord, Jehovah of hosts; for thy day is come, the time that I will visit thee.";
yng[31] = "Lo, I [am] against thee, O pride, An affirmation of the Lord Jehovah of Hosts, For thy day hath come, the time of thy inspection.";
dby[31] = "Behold, I am against thee, proud one, saith the Lord Jehovah of hosts; for thy day is come, the time that I visit thee:";
web[31] = "Behold, I [am] against thee, [O thou] most proud, saith the Lord GOD of hosts: for thy day is come, the time [that] I will visit thee.";
hnv[31] = "Behold, I am against you, you proud one, says the Lord, the LORD of Hosts; for your day is come, the time that I will visit you.";
vul[31] = "ecce ego ad te superbe dicit Dominus Deus exercituum quia venit dies tuus tempus visitationis tuae";
kjv[32] = "And the most proud shall stumble and fall, and none shall raise him up: and I will kindle a fire in his cities, and it shall devour all round about him.";
rsv[32] = "The proud one shall stumble and fall, with none to raise him up, and I will kindle a fire in his cities, and it will devour all that is round about him.";
asv[32] = "And the proud one shall stumble and fall, and none shall raise him up; and I will kindle a fire in his cities, and it shall devour all that are round about him.";
yng[32] = "And stumbled hath pride, And he hath fallen, and hath no raiser up, And I have kindled a fire in his cities, And it hath devoured all round about him.";
dby[32] = "and the proud one shall stumble and fall, and none shall raise him up; yea, I will kindle a fire in his cities, and it shall devour all that are round about him.";
web[32] = "And the most proud shall stumble and fall, and none shall raise him up: and I will kindle a fire in his cities, and it shall devour all around him.";
hnv[32] = "The proud one shall stumble and fall, and none shall raise him up; and I will kindle a fire in his cities, and it shall devour all who are round about him.";
vul[32] = "et cadet superbus et corruet et non erit qui suscitet eum et succendam ignem in urbibus eius et devorabit omnia in circuitu eius";
kjv[33] = "Thus saith the LORD of hosts; The children of Israel and the children of Judah [were] oppressed together: and all that took them captives held them fast; they refused to let them go.";
rsv[33] = "&quot;Thus says the LORD of hosts: The people of Israel are oppressed, and the people of Judah with them; all who took them captive have held them fast, they refuse to let them go.";
asv[33] = "Thus saith Jehovah of hosts: The children of Israel and the children of Judah are oppressed together; and all that took them captive hold them fast; they refuse to let them go.";
yng[33] = "Thus said Jehovah of Hosts: Oppressed are the sons of Israel, And the sons of Judah together, And all their captors have kept hold on them, They have refused to send them away.";
dby[33] = "Thus saith Jehovah of hosts: The children of Israel and the children of Judah were together oppressed; and all that took them captives held them fast: they refused to let them go.";
web[33] = "Thus saith the LORD of hosts; The children of Israel and the children of Judah [were] oppressed together: and all that took them captives held them fast; they refused to let them go.";
hnv[33] = "Thus says the LORD of hosts: The children of Yisra\'el and the children of Yehudah are oppressed together; and all who took them captive hold them fast; they refuse to let them go.";
vul[33] = "haec dicit Dominus exercituum calumniam sustinent filii Israhel et filii Iuda simul omnes qui ceperunt eos tenent nolunt dimittere eos";
kjv[34] = "Their Redeemer [is] strong; the LORD of hosts [is] his name: he shall throughly plead their cause, that he may give rest to the land, and disquiet the inhabitants of Babylon.";
rsv[34] = "Their Redeemer is strong; the LORD of hosts is his name. He will surely plead their cause, that he may give rest to the earth, but unrest to the inhabitants of Babylon.";
asv[34] = "Their Redeemer is strong; Jehovah of hosts is his name: he will thoroughly plead their cause, that he may give rest to the earth, and disquiet the inhabitants of Babylon.";
yng[34] = "Their Redeemer [is] strong, Jehovah of Hosts [is] His name, He doth thoroughly plead their cause, So as to cause the land to rest, And He hath given trouble to the inhabitants of Babylon.";
dby[34] = "Their Redeemer is strong; Jehovah of hosts is his name: he will thoroughly plead their cause, that he may give rest to the land, and disquiet the inhabitants of Babylon.";
web[34] = "Their Redeemer [is] strong; the LORD of hosts [is] his name: he will thoroughly plead their cause, that he may give rest to the land, and disquiet the inhabitants of Babylon.";
hnv[34] = "Their Redeemer is strong; the LORD of Hosts is his name: he will thoroughly plead their cause, that he may give rest to the eretz, and disquiet the inhabitants of Bavel.";
vul[34] = "redemptor eorum Fortis Dominus exercituum nomen eius iudicio defendet causam eorum ut exterreat terram et commoveat habitatores Babylonis";
kjv[35] = "A sword [is] upon the Chaldeans, saith the LORD, and upon the inhabitants of Babylon, and upon her princes, and upon her wise [men].";
rsv[35] = "&quot;A sword upon the Chalde\'ans, says the LORD, and upon the inhabitants of Babylon, and upon her princes and her wise men!";
asv[35] = "A sword is upon the Chaldeans, saith Jehovah, and upon the inhabitants of Babylon, and upon her princes, and upon her wise men.";
yng[35] = "A sword [is] for the Chaldeans, An affirmation of Jehovah, And it [is] on the inhabitants of Babylon, And on her heads, and on her wise men;";
dby[35] = "The sword is upon the Chaldeans, saith Jehovah, and upon the inhabitants of Babylon, and upon her princes, and upon her wise men;";
web[35] = "A sword [is] upon the Chaldeans, saith the LORD, and upon the inhabitants of Babylon, and upon her princes, and upon her wise [men].";
hnv[35] = "A sword is on the Kasdim, says the LORD, and on the inhabitants of Bavel, and on her princes, and on her wise men.";
vul[35] = "gladius ad Chaldeos ait Dominus et ad habitatores Babylonis et ad principes et ad sapientes eius";
kjv[36] = "A sword [is] upon the liars; and they shall dote: a sword [is] upon her mighty men; and they shall be dismayed.";
rsv[36] = "A sword upon the diviners, that they may become fools! A sword upon her warriors, that they may be destroyed!";
asv[36] = "A sword is upon the boasters, and they shall become fools; a sword is upon her mighty men, and they shall be dismayed.";
yng[36] = "A sword [is] on the princes, And they have become foolish; A sword [is] on her mighty ones, And they have been broken down;";
dby[36] = "the sword is upon the liars, and they shall become fools; the sword is upon her mighty men, and they shall be dismayed;";
web[36] = "A sword [is] upon the liars; and they shall be sottish: a sword [is] upon her mighty men; and they shall be dismayed.";
hnv[36] = "A sword is on the boasters, and they shall become fools; a sword is on her mighty men, and they shall be dismayed.";
vul[36] = "gladius ad divinos eius qui stulti erunt gladius ad fortes illius qui timebunt";
kjv[37] = "A sword [is] upon their horses, and upon their chariots, and upon all the mingled people that [are] in the midst of her; and they shall become as women: a sword [is] upon her treasures; and they shall be robbed.";
rsv[37] = "A sword upon her horses and upon her chariots, and upon all the foreign troops in her midst, that they may become women! A sword upon all her treasures, that they may be plundered!";
asv[37] = "A sword is upon their horses, and upon their chariots, and upon all the mingled people that are in the midst of her; and they shall become as women: a sword is upon her treasures, and they shall be robbed.";
yng[37] = "A sword [is] on his horses and on his chariot, And on all the rabble who [are] in her midst, And they have become women; A sword [is] on her treasuries, And they have been spoiled;";
dby[37] = "the sword is upon their horses, and upon their chariots, and upon all the mingled people that are in the midst of her, and they shall become as women; the sword is upon her treasures, and they shall be robbed:";
web[37] = "A sword [is] upon their horses, and upon their chariots, and upon all the mingled people that [are] in the midst of her; and they shall become as women: a sword [is] upon her treasures; and they shall be robbed.";
hnv[37] = "A sword is on their horses, and on their chariots, and on all the mixed people who are in the midst of her; and they shall become as women: a sword is on her treasures, and they shall be robbed.";
vul[37] = "gladius ad equos eius et ad currus eius et ad omne vulgus quod est in medio eius et erunt quasi mulieres gladius ad thesauros eius qui diripientur";
kjv[38] = "A drought [is] upon her waters; and they shall be dried up: for it [is] the land of graven images, and they are mad upon [their] idols.";
rsv[38] = "A drought upon her waters, that they may be dried up! For it is a land of images, and they are mad over idols.";
asv[38] = "A drought is upon her waters, and they shall be dried up; for it is a land of graven images, and they are mad over idols.";
yng[38] = "A sword [is] on her waters, and they have been dried up, For it [is] a land of graven images, And in idols they do boast themselves.";
dby[38] = "a drought is upon her waters, and they shall be dried up; for it is a land of graven images, and they are mad after frightful idols.";
web[38] = "A drouth [is] upon her waters; and they shall be dried up: for it [is] the land of graven images, and they are mad upon [their] idols.";
hnv[38] = "A drought is on her waters, and they shall be dried up; for it is a land of engraved images, and they are mad over idols.";
vul[38] = "siccitas super aquas eius erit et arescent quia terra sculptilium est et in portentis gloriantur";
kjv[39] = "Therefore the wild beasts of the desert with the wild beasts of the islands shall dwell [there], and the owls shall dwell therein: and it shall be no more inhabited for ever; neither shall it be dwelt in from generation to generation.";
rsv[39] = "&quot;Therefore wild beasts shall dwell with hyenas in Babylon, and ostriches shall dwell in her; she shall be peopled no more for ever, nor inhabited for all generations.";
asv[39] = "Therefore the wild beasts of the desert with the wolves shall dwell there, and the ostriches shall dwell therein: and it shall be no more inhabited for ever; neither shall it be dwelt in from generation to generation.";
yng[39] = "Therefore dwell do Ziim with Iim, Yea, dwelt in her have daughters of the ostrich, And it is not inhabited any more for ever, Nor dwelt in unto all generations.";
dby[39] = "Therefore wild beasts of the desert with jackals shall dwell there, and ostriches shall dwell therein; and it shall be no more inhabited for ever, neither shall it be dwelt in from generation to generation.";
web[39] = "Therefore the wild beasts of the desert with the wild beasts of the isles, shall dwell [there], and the owls shall dwell therein: and it shall be no more inhabited for ever; neither shall it be dwelt in from generation to generation.";
hnv[39] = "Therefore the wild animals of the desert with the wolves shall dwell there, and the ostriches shall dwell therein: and it shall be no more inhabited forever; neither shall it be lived in from generation to generation.";
vul[39] = "propterea habitabunt dracones cum fatuis ficariis et habitabunt in ea strutiones et non habitabitur ultra usque ad sempiternum nec extruetur usque ad generationem et generationem";
kjv[40] = "As God overthrew Sodom and Gomorrah and the neighbour [cities] thereof, saith the LORD; [so] shall no man abide there, neither shall any son of man dwell therein.";
rsv[40] = "As when God overthrew Sodom and Gomor\'rah and their neighbor cities, says the LORD, so no man shall dwell there, and no son of man shall sojourn in her.";
asv[40] = "As when God overthrew Sodom and Gomorrah and the neighbor cities thereof, saith Jehovah, so shall no man dwell there, neither shall any son of man sojourn therein.";
yng[40] = "As overthrown by God with Sodom, And with Gomorrah, and with its neighbours, An affirmation of Jehovah, none doth dwell there, Nor sojourn in her doth a son of man.";
dby[40] = "As when God overthrew Sodom and Gomorrah, and their neighbour cities, saith Jehovah, no one shall dwell there, neither shall a son of man sojourn therein.";
web[40] = "As God overthrew Sodom and Gomorrah and the neighboring [cities], saith the LORD; [so] shall no man abide there, neither shall any son of man dwell therein.";
hnv[40] = "As when God overthrew Sedom and `Amorah and the neighbor cities of it, says the LORD, so shall no man dwell there, neither shall any son of man sojourn therein.";
vul[40] = "sicut subvertit Deus Sodomam et Gomorram et vicinas eius ait Dominus non habitabit ibi vir nec incolet eam filius hominis";
kjv[41] = "At the noise of the taking of Babylon the earth is moved, and the cry is heard among the nations.";
rsv[41] = "&quot;Behold, a people comes from the north; a mighty nation and many kings are stirring from the farthest parts of the earth.";
asv[41] = "Behold, a people cometh from the north; and a great nation and many kings shall be stirred up from the uttermost parts of the earth.";
yng[41] = "Lo, a people hath come from the north, Even a great nation, And many kings are stirred up from the sides of the earth.";
dby[41] = "Behold, a people cometh from the north, and a great nation. And many kings shall arise from the uttermost parts of the earth.";
web[41] = "Behold, a people shall come from the north, and a great nation, and many kings shall be raised up from the borders of the earth.";
hnv[41] = "Behold, a people comes from the north; and a great nation and many kings shall be stirred up from the uttermost parts of the eretz.";
vul[41] = "ecce populus venit ab aquilone et gens magna et reges multi consurgent a finibus terrae";
kjv[42] = "Behold, a people shall come from the north, and a great nation, and many kings shall be raised up from the coasts of the earth.";
rsv[42] = "They lay hold of bow and spear; they are cruel, and have no mercy. The sound of them is like the roaring of the sea; they ride upon horses, arrayed as a man for battle against you, O daughter of Babylon!";
asv[42] = "They lay hold on bow and spear; they are cruel, and have no mercy; their voice roareth like the sea; and they ride upon horses, every one set in array, as a man to the battle, against thee, O daughter of Babylon.";
yng[42] = "Bow and halbert they seize, Cruel [are] they, and they have no mercy, Their voice as a sea soundeth, and on horses they ride, Set in array as a man for battle, Against thee, O daughter of Babylon.";
dby[42] = "They lay hold of bow and spear; they are cruel, and will not shew mercy; their voice roareth like the sea, and they ride upon horses -- set in array like a man for the battle, against thee, O daughter of Babylon.";
web[42] = "They shall hold the bow and the lance: they [are] cruel, and will not show mercy: their voice shall roar like the sea, and they shall ride upon horses, [every one] put in array, like a man to the battle, against thee, O daughter of Babylon.";
hnv[42] = "They lay hold on bow and spear; they are cruel, and have no mercy; their voice roars like the sea; and they ride on horses, everyone set in array, as a man to the battle, against you, daughter of Bavel.";
vul[42] = "arcum et scutum adprehendent crudeles sunt et inmisericordes vox eorum quasi mare sonabit et super equos ascendent sicut vir paratus ad proelium contra te filia Babylon";
kjv[43] = "They shall hold the bow and the lance: they [are] cruel, and will not shew mercy: their voice shall roar like the sea, and they shall ride upon horses, [every one] put in array, like a man to the battle, against thee, O daughter of Babylon.";
rsv[43] = "&quot;The king of Babylon heard the report of them, and his hands fell helpless; anguish seized him, pain as of a woman in travail.";
asv[43] = "The king of Babylon hath heard the tidings of them, and his hands wax feeble: anguish hath taken hold of him, [and] pangs as of a woman in travail.";
yng[43] = "Heard hath the king of Babylon their report, And feeble have been his hands, Distress hath seized him; pain as a travailing woman.";
dby[43] = "The king of Babylon hath heard the report of them, and his hands wax feeble; trouble hath taken hold of him, pangs as of a woman in travail.";
web[43] = "The king of Babylon hath heard the report of them, and his hands became feeble: anguish took hold of him, [and] pangs as of a woman in travail.";
hnv[43] = "The king of Bavel has heard the news of them, and his hands wax feeble: anguish has taken hold of him, [and] pangs as of a woman in travail.";
vul[43] = "audivit rex Babylonis famam eorum et dissolutae sunt manus eius angustia adprehendit eum dolor quasi parturientem";
kjv[44] = "The king of Babylon hath heard the report of them, and his hands waxed feeble: anguish took hold of him, [and] pangs as of a woman in travail.";
rsv[44] = "&quot;Behold, like a lion coming up from the jungle of the Jordan against a strong sheepfold, I will suddenly make them run away from her; and I will appoint over her whomever I choose. For who is like me? Who will summon me? What shepherd can stand before me?";
asv[44] = "Behold, [the enemy] shall come up like a lion from the pride of the Jordan against the strong habitation: for I will suddenly make them run away from it; and whoso is chosen, him will I appoint over it: for who is like me? and who will appoint me a time? and who is the shepherd that can stand before me?";
yng[44] = "Lo, as a lion he cometh up, Because of the rising of the Jordan, Unto the enduring habitation, But I cause to rest, I cause them to run from off her. And who is chosen? on her I lay a charge, For who [is] like Me? And who doth convene Me? And who [is] this shepherd who standeth before Me?";
dby[44] = "Behold, he shall come up like a lion from the swelling of the Jordan against the strong habitation; for I will make him suddenly run away from it; and who is a chosen [man] whom I may appoint over her? For who is like me? and who will assign me a time? and who is that shepherd that will stand before me?";
web[44] = "Behold, he shall come up like a lion from the swelling of Jordan to the habitation of the strong: but I will make them suddenly run away from her: and who [is] a chosen [man], [that] I may appoint over her? for who [is] like me? and who will appoint me the time? and who [is] that shepherd that will stand before me?";
hnv[44] = "Behold, [the enemy] shall come up like a lion from the pride of the Yarden against the strong habitation: for I will suddenly make them run away from it; and whoever is chosen, him will I appoint over it: for who is like me? and who will appoint me a time? and who is the shepherd who can stand before me?";
vul[44] = "ecce quasi leo ascendet de superbia Iordanis ad pulchritudinem robustam quia subito currere eum faciam ad illam et quis erit electus quem praeponam ei quis enim similis mei et quis sustinebit me et quis est iste pastor qui resistat vultui meo";
kjv[45] = "Behold, he shall come up like a lion from the swelling of Jordan unto the habitation of the strong: but I will make them suddenly run away from her: and who [is] a chosen [man, that] I may appoint over her? for who [is] like me? and who will appoint me the time? and who [is] that shepherd that will stand before me?";
rsv[45] = "Therefore hear the plan which the LORD has made against Babylon, and the purposes which he has formed against the land of the Chalde\'ans: Surely the little ones of their flock shall be dragged away; surely their fold shall be appalled at their fate.";
asv[45] = "Therefore hear ye the counsel of Jehovah, that he hath taken against Babylon; and his purposes, that he hath purposed against the land of the Chaldeans: Surely they shall drag them away, [even] the little ones of the flock; surely he shall make their habitation desolate over them.";
yng[45] = "Therefore, hear ye the counsel of Jehovah, That He counselled concerning Babylon, And His devices that He hath devised Concerning the land of the Chaldeans; Drag them out do not little ones of the flock, Doth He not make desolate over them the habitation?";
dby[45] = "Therefore hear the counsel of Jehovah, which he hath taken against Babylon, and his purposes which he hath purposed against the land of the Chaldeans: The little ones of the flock shall certainly draw them away; he shall certainly make their habitation desolate for them.";
web[45] = "Therefore hear ye the counsel of the LORD, that he hath taken against Babylon; and his purposes, that he hath purposed against the land of the Chaldeans: Surely the least of the flock shall draw them out: surely he shall make [their] habitation desolate with them.";
hnv[45] = "Therefore hear the counsel of the LORD, that he has taken against Bavel; and his purposes, that he has purposed against the land of the Kasdim: Surely they shall drag them away, [even] the little ones of the flock; surely he shall make their habitation desolate over them.";
vul[45] = "propterea audite consilium Domini quod mente concepit adversum Babylonem et cogitationes eius quas cogitavit super terram Chaldeorum nisi detraxerint eos parvuli gregum nisi dissipatum fuerit cum ipsis habitaculum eorum";
kjv[46] = "Therefore hear ye the counsel of the LORD, that he hath taken against Babylon; and his purposes, that he hath purposed against the land of the Chaldeans: Surely the least of the flock shall draw them out: surely he shall make [their] habitation desolate with them.";
rsv[46] = "At the sound of the capture of Babylon the earth shall tremble, and her cry shall be heard among the nations.&quot;";
asv[46] = "At the noise of the taking of Babylon the earth trembleth, and the cry is heard among the nations.";
yng[46] = "From the voice: Captured was Babylon, Hath the earth been shaken, And a cry among nations hath been heard!";
dby[46] = "At the sound of the taking of Babylon the earth hath quaked, and the cry is heard among the nations.";
web[46] = "At the noise of the taking of Babylon the earth is moved, and the cry is heard among the nations.";
hnv[46] = "At the noise of the taking of Bavel the eretz trembles, and the cry is heard among the nations.";
vul[46] = "a voce captivitatis Babylonis commota est terra et clamor inter gentes auditus est";
