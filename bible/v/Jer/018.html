csb[1] = "This is the word that came to Jeremiah from the LORD:";
csb[2] = "&quot;Go down at once to the potter\'s house; there I will reveal my words to you.&quot;";
csb[3] = "So I went down to the potter\'s house, and there he was, working away at the wheel.";
csb[4] = "But the jar that he was making from the clay became flawed in the potter\'s hand, so he made it into another jar, as it seemed right for him to do.";
csb[5] = "The word of the LORD came to me:";
csb[6] = "&quot;House of Israel, can I not treat you as this potter treats his clay? &quot; -- this is the LORD\'s declaration. &quot;Just like clay in the potter\'s hand, so are you in my hand, house of Israel.";
csb[7] = "&quot;At one moment I might announce concerning a nation or a kingdom that I will uproot, tear down, and destroy it.";
csb[8] = "&quot;However, if that nation about which I have made the announcement turns from its evil, I will relent concerning the disaster I had planned to do to it.";
csb[9] = "&quot;At another time I might announce concerning a nation or a kingdom that I will build and plant it.";
csb[10] = "&quot;However, if it does what is evil in my sight by not listening to me, I will relent concerning the good I had said I would do to it.";
csb[11] = "&quot;So now, say to the men of Judah and to the residents of Jerusalem, \'This is what the LORD says: Look, I am about to bring harm to you and make plans against you. Turn now, each from your evil way, and correct your ways and your deeds.\'";
csb[12] = "&quot;But they will say, \'It\'s hopeless. We will continue to follow our plans, and each of us will continue to act according to the stubbornness of his evil heart.\' &quot;";
csb[13] = "Therefore, this is what the LORD says: Ask among the nations, who has heard things like these? Virgin Israel has done a most horrible thing.";
csb[14] = "Does the snow of Lebanon ever leave the highland crags? Or does cold water flowing from a distance ever fail?";
csb[15] = "Yet my people have forgotten me. They burn incense to worthless idols that make them stumble in their ways on the ancient roads, and make them walk on new paths, not the highway.";
csb[16] = "They have made their land a horror, a perpetual object of scorn; all who pass by it will be appalled and shake their heads.";
csb[17] = "I will scatter them before the enemy like the east wind. I will show them my back and not my face on the day of their calamity.";
csb[18] = "Then certain ones said, &quot;Come, let\'s make plans against Jeremiah, for instruction will never be lost from the priest, or counsel from the wise, or a word from the prophet. Come, let\'s denounce him and pay no attention to all his words.&quot;";
csb[19] = "Pay attention to me, LORD. Hear what my opponents are saying!";
csb[20] = "Should good be repaid with evil? Yet they have dug a pit for me. Remember how I stood before you to speak good on their behalf, to turn your anger from them.";
csb[21] = "Therefore, hand their children over to famine, and give them over to the power of the sword. Let their wives become childless and widowed, their husbands slain by deadly disease, their young men struck down by the sword in battle.";
csb[22] = "Let a cry be heard from their houses when you suddenly bring raiders against them, for they have dug a pit to capture me and have hidden snares for my feet.";
csb[23] = "But you, LORD, know all their deadly plots against me. Do not wipe out their iniquity; do not blot out their sin before you. Let them be forced to stumble before you; deal with them in the time of your anger.";

kjv[21] = "Therefore deliver up their children to the famine, and pour out their [blood] by the force of the sword; and let their wives be bereaved of their children, and [be] widows; and let their men be put to death; [let] their young men [be] slain by the sword in battle.";
rsv[21] = "Therefore deliver up their children to famine; give them over to the power of the sword, let their wives become childless and widowed. May their men meet death by pestilence, their youths be slain by the sword in battle.";
asv[21] = "Therefore deliver up their children to the famine, and give them over to the power of the sword; and let their wives become childless, and widows; and let their men be slain of death, [and] their young men smitten of the sword in battle.";
yng[21] = "Therefore, give up their sons to famine, And cause them to run on the sides of the sword, And their wives are bereaved and widows, And their men are slain by death, Their young men smitten by sword in battle,";
dby[21] = "Therefore give up their children to the famine, and deliver them over to the power of the sword; and let their wives be bereaved of children and be widows; and let their men be swept off by death, their young men be smitten by the sword in battle.";

kjv[22] = "Let a cry be heard from their houses, when thou shalt bring a troop suddenly upon them: for they have digged a pit to take me, and hid snares for my feet.";

kjv[23] = "Yet, LORD, thou knowest all their counsel against me to slay [me]: forgive not their iniquity, neither blot out their sin from thy sight, but let them be overthrown before thee; deal [thus] with them in the time of thine anger.";
rsv[23] = "Yet, thou, O LORD, knowest all their plotting to slay me. Forgive not their iniquity, nor blot out their sin from thy sight. Let them be overthrown before thee; deal with them in the time of thine anger.";
asv[23] = "Yet, Jehovah, thou knowest all their counsel against me to slay me; forgive not their iniquity, neither blot out their sin from thy sight; but let them be overthrown before thee; deal thou with them in the time of thine anger.";
yng[23] = "And Thou, O Jehovah, Thou hast known, All their counsel against me [is] for death, Thou dost not cover over their iniquity, Nor their sin from before Thee blottest out, And they are made to stumble before Thee, In the time of Thine anger work against them!";
