csb[1] = "This is the word that came to Jeremiah from the LORD:";
csb[2] = "&quot;Stand in the gate of the house of the LORD and there call out this word: \'Hear the word of the LORD, all you people of Judah who enter through these gates to worship the LORD.";
csb[3] = "&quot; \'This is what the LORD of Armies, the God of Israel, says: Correct your ways and your actions, and I will allow you to live in this place.";
csb[4] = "&quot;Do not trust deceitful words, chanting, &quot;This is the temple of the LORD, the temple of the LORD, the temple of the LORD.&quot;";
csb[5] = "Instead, if you really correct your ways and your actions, if you act justly toward one another,";
csb[6] = "if you no longer oppress the resident alien, the fatherless, and the widow and no longer shed innocent blood in this place or follow other gods, bringing harm on yourselves,";
csb[7] = "I will allow you to live in this place, the land I gave to your ancestors long ago and forever.";
csb[8] = "But look, you keep trusting in deceitful words that cannot help.";
csb[9] = "&quot; \'Do you steal, murder, commit adultery, swear falsely, burn incense to Baal, and follow other gods that you have not known?";
csb[10] = "&quot;Then do you come and stand before me in this house that bears my name and say, &quot;We are rescued, so we can continue doing all these detestable acts&quot;?";
csb[11] = "Has this house, which bears my name, become a den of robbers in your view? Yes, I too have seen it. This is the LORD\'s declaration.";
csb[12] = "&quot; \'But return to my place that was at Shiloh, where I made my name dwell at first. See what I did to it because of the evil of my people Israel.";
csb[13] = "&quot;Now, because you have done all these things -- this is the LORD\'s declaration -- and because I have spoken to you time and time again but you wouldn\'t listen, and I have called to you, but you wouldn\'t answer,";
csb[14] = "&quot;what I did to Shiloh I will do to the house that bears my name -- the house in which you trust -- the place that I gave you and your ancestors.";
csb[15] = "&quot;I will banish you from my presence, just as I banished all of your brothers, all the descendants of Ephraim.\'";
csb[16] = "&quot;As for you, do not pray for these people. Do not offer a cry or a prayer on their behalf, and do not beg me, for I will not listen to you.";
csb[17] = "&quot;Don\'t you see how they behave in the cities of Judah and in the streets of Jerusalem?";
csb[18] = "&quot;The sons gather wood, the fathers light the fire, and the women knead dough to make cakes for the queen of heaven, and they pour out drink offerings to other gods so that they provoke me to anger.";
csb[19] = "&quot;But are they really provoking me? &quot; This is the LORD\'s declaration. &quot;Isn\'t it they themselves being provoked to disgrace? &quot;";
csb[20] = "Therefore, this is what the Lord GOD says: &quot;Look, my anger -- my burning wrath -- is about to be poured out on this place, on people and animals, on the tree of the field, and on the produce of the land. My wrath will burn and not be quenched.&quot;";
csb[21] = "This is what the LORD of Armies, the God of Israel, says: &quot;Add your burnt offerings to your other sacrifices, and eat the meat yourselves,";
csb[22] = "&quot;for when I brought your ancestors out of the land of Egypt, I did not speak with them or command them concerning burnt offering and sacrifice.";
csb[23] = "&quot;However, I did give them this command: \'Obey me, and then I will be your God, and you will be my people. Follow every way I command you so that it may go well with you.\'";
csb[24] = "&quot;Yet they didn\'t listen or pay attention but followed their own advice and their own stubborn, evil heart. They went backward and not forward.";
csb[25] = "&quot;Since the day your ancestors came out of the land of Egypt until today, I have sent all my servants the prophets to you time and time again.";
csb[26] = "&quot;However, my people wouldn\'t listen to me or pay attention but became obstinate; they did more evil than their ancestors.";
csb[27] = "&quot;When you speak all these things to them, they will not listen to you. When you call to them, they will not answer you.";
csb[28] = "&quot;Therefore, declare to them, \'This is the nation that would not listen to the LORD their God and would not accept discipline. Truth has perished -- it has disappeared from their mouths.";
csb[29] = "&quot;Cut off the hair of your sacred vow and throw it away. Raise up a dirge on the barren heights, for the LORD has rejected and abandoned the generation under his wrath.\'";
csb[30] = "&quot;For the Judeans have done what is evil in my sight.&quot; This is the LORD\'s declaration. &quot;They have set up their abhorrent things in the house that bears my name in order to defile it.";
csb[31] = "&quot;They have built the high places of Topheth in Ben Hinnom Valley in order to burn their sons and daughters in the fire, a thing I did not command; I never entertained the thought.";
csb[32] = "&quot;Therefore, look, the days are coming&quot; -- the LORD\'s declaration -- &quot;when this place will no longer be called Topheth and Ben Hinnom Valley, but the Valley of Slaughter. Topheth will become a cemetery, because there will be no other burial place.";
csb[33] = "&quot;The corpses of these people will become food for the birds of the sky and for the wild animals of the land, with no one to scare them away.";
csb[34] = "&quot;I will remove from the cities of Judah and the streets of Jerusalem the sound of joy and gladness and the voices of the groom and the bride, for the land will become a desolate waste.";
kjv[1] = "The word that came to Jeremiah from the LORD, saying,";
kjv[2] = "Stand in the gate of the LORD\'S house, and proclaim there this word, and say, Hear the word of the LORD, all [ye of] Judah, that enter in at these gates to worship the LORD.";
kjv[3] = "Thus saith the LORD of hosts, the God of Israel, Amend your ways and your doings, and I will cause you to dwell in this place.";
kjv[4] = "Trust ye not in lying words, saying, The temple of the LORD, The temple of the LORD, The temple of the LORD, [are] these.";
kjv[5] = "For if ye throughly amend your ways and your doings; if ye throughly execute judgment between a man and his neighbour;";
kjv[6] = "[If] ye oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in this place, neither walk after other gods to your hurt:";
kjv[7] = "Then will I cause you to dwell in this place, in the land that I gave to your fathers, for ever and ever.";
kjv[8] = "Behold, ye trust in lying words, that cannot profit.";
kjv[9] = "Will ye steal, murder, and commit adultery, and swear falsely, and burn incense unto Baal, and walk after other gods whom ye know not;";
kjv[10] = "And come and stand before me in this house, which is called by my name, and say, We are delivered to do all these abominations?";
kjv[11] = "Is this house, which is called by my name, become a den of robbers in your eyes? Behold, even I have seen [it], saith the LORD.";
kjv[12] = "But go ye now unto my place which [was] in Shiloh, where I set my name at the first, and see what I did to it for the wickedness of my people Israel.";
kjv[13] = "And now, because ye have done all these works, saith the LORD, and I spake unto you, rising up early and speaking, but ye heard not; and I called you, but ye answered not;";
kjv[14] = "Therefore will I do unto [this] house, which is called by my name, wherein ye trust, and unto the place which I gave to you and to your fathers, as I have done to Shiloh.";
kjv[15] = "And I will cast you out of my sight, as I have cast out all your brethren, [even] the whole seed of Ephraim.";
kjv[16] = "Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee.";
kjv[17] = "Seest thou not what they do in the cities of Judah and in the streets of Jerusalem?";
kjv[18] = "The children gather wood, and the fathers kindle the fire, and the women knead [their] dough, to make cakes to the queen of heaven, and to pour out drink offerings unto other gods, that they may provoke me to anger.";
kjv[19] = "Do they provoke me to anger? saith the LORD: [do they] not [provoke] themselves to the confusion of their own faces?";
kjv[20] = "Therefore thus saith the Lord GOD; Behold, mine anger and my fury shall be poured out upon this place, upon man, and upon beast, and upon the trees of the field, and upon the fruit of the ground; and it shall burn, and shall not be quenched.";
kjv[21] = "Thus saith the LORD of hosts, the God of Israel; Put your burnt offerings unto your sacrifices, and eat flesh.";
kjv[22] = "For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt offerings or sacrifices:";
kjv[23] = "But this thing commanded I them, saying, Obey my voice, and I will be your God, and ye shall be my people: and walk ye in all the ways that I have commanded you, that it may be well unto you.";
kjv[24] = "But they hearkened not, nor inclined their ear, but walked in the counsels [and] in the imagination of their evil heart, and went backward, and not forward.";
kjv[25] = "Since the day that your fathers came forth out of the land of Egypt unto this day I have even sent unto you all my servants the prophets, daily rising up early and sending [them]:";
kjv[26] = "Yet they hearkened not unto me, nor inclined their ear, but hardened their neck: they did worse than their fathers.";
kjv[27] = "Therefore thou shalt speak all these words unto them; but they will not hearken to thee: thou shalt also call unto them; but they will not answer thee.";
kjv[28] = "But thou shalt say unto them, This [is] a nation that obeyeth not the voice of the LORD their God, nor receiveth correction: truth is perished, and is cut off from their mouth.";
kjv[29] = "Cut off thine hair, [O Jerusalem], and cast [it] away, and take up a lamentation on high places; for the LORD hath rejected and forsaken the generation of his wrath.";
kjv[30] = "For the children of Judah have done evil in my sight, saith the LORD: they have set their abominations in the house which is called by my name, to pollute it.";
kjv[31] = "And they have built the high places of Tophet, which [is] in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded [them] not, neither came it into my heart.";
kjv[32] = "Therefore, behold, the days come, saith the LORD, that it shall no more be called Tophet, nor the valley of the son of Hinnom, but the valley of slaughter: for they shall bury in Tophet, till there be no place.";
kjv[33] = "And the carcases of this people shall be meat for the fowls of the heaven, and for the beasts of the earth; and none shall fray [them] away.";
kjv[34] = "Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride: for the land shall be desolate.";

hnv[15] = "I will cast you out of my sight, as I have cast out all your brothers, even the whole seed of Efrayim.";
vul[15] = "et proiciam vos a facie mea sicut proieci omnes fratres vestros universum semen Ephraim";
kjv[16] = "Therefore, behold, the days come, saith the LORD, that it shall no more be called Tophet, nor the valley of the son of Hinnom, but the valley of slaughter: for they shall bury in Tophet, till there be no place.";
rsv[16] = "&quot;As for you, do not pray for this people, or lift up cry or prayer for them, and do not intercede with me, for I do not hear you.";
asv[16] = "Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me; for I will not hear thee.";
yng[16] = "And thou dost not pray for this people, Nor lift up for them crying and prayer, Nor intercede with Me, for I hear thee not.";
dby[16] = "And thou, pray not for this people, neither lift up cry nor prayer for them, and make not intercession to me; for I will not hear thee.";
web[16] = "Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee.";
hnv[16] = "Therefore don\'t you pray for this people, neither lift up a cry nor prayer for them, neither make intercession to me; for I will not hear you.";
vul[16] = "tu ergo noli orare pro populo hoc nec adsumas pro eis laudem et orationem et non obsistas mihi quia non exaudiam te";
kjv[17] = "And the carcases of this people shall be meat for the fowls of the heaven, and for the beasts of the earth; and none shall fray [them] away.";
rsv[17] = "Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?";
asv[17] = "Seest thou not what they do in the cities of Judah and in the streets of Jerusalem?";
yng[17] = "Art thou not seeing what they are doing In cities of Judah, and in streets of Jerusalem?";
dby[17] = "Seest thou not what they do in the cities of Judah, and in the streets of Jerusalem?";
web[17] = "Seest thou not what they do in the cities of Judah and in the streets of Jerusalem?";
hnv[17] = "Don\'t you see what they do in the cities of Yehudah and in the streets of Yerushalayim?";
vul[17] = "nonne vides quid isti faciant in civitatibus Iuda et in plateis Hierusalem";
kjv[18] = "Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride: for the land shall be desolate.";
rsv[18] = "The children gather wood, the fathers kindle fire, and the women knead dough, to make cakes for the queen of heaven; and they pour out drink offerings to other gods, to provoke me to anger.";
asv[18] = "The children gather wood, and the fathers kindle the fire, and the women knead the dough, to make cakes to the queen of heaven, and to pour out drink-offerings unto other gods, that they may provoke me to anger.";
yng[18] = "The sons are gathering wood, And the fathers are causing the fire to burn, And the women are kneading dough, To make cakes to the queen of the heavens, And to pour out libations to other gods, So as to provoke Me to anger.";
dby[18] = "The children gather wood, and the fathers kindle the fire, and the women knead dough, to make cakes to the queen of heaven, and to pour out drink-offerings unto other gods, that they may provoke me to anger.";
web[18] = "The children gather wood, and the fathers kindle the fire, and the women knead dough, to make cakes to the queen of heaven, and to pour out drink-offerings to other gods, that they may provoke me to anger.";
hnv[18] = "The children gather wood, and the fathers kindle the fire, and the women knead the dough, to make cakes to the queen of the sky, and to pour out drink-offerings to other gods, that they may provoke me to anger.";
vul[18] = "filii colligunt ligna et patres succendunt ignem et mulieres conspergunt adipem ut faciant placentas Reginae caeli et libent diis alienis et me ad iracundiam provocent";
kjv[19] = "The word that came to Jeremiah from the LORD, saying,";
rsv[19] = "Is it I whom they provoke? says the LORD. Is it not themselves, to their own confusion?";
asv[19] = "Do they provoke me to anger? saith Jehovah; [do they] not [provoke] themselves, to the confusion of their own faces?";
yng[19] = "Me are they provoking to anger? an affirmation of Jehovah, Is it not themselves, For the shame of their own faces?";
dby[19] = "Is it I whom they provoke to anger? saith Jehovah; is it not themselves, to the shame of their own face?";
web[19] = "Do they provoke me to anger? saith the LORD: [do they] not [provoke] themselves to the confusion of their own faces?";
hnv[19] = "Do they provoke me to anger? says the LORD; [do they] not [provoke] themselves, to the confusion of their own faces?";
vul[19] = "numquid me ad iracundiam provocant dicit Dominus nonne semet ipsos in confusionem vultus sui";
kjv[20] = "Stand in the gate of the LORD\'S house, and proclaim there this word, and say, Hear the word of the LORD, all [ye of] Judah, that enter in at these gates to worship the LORD.";
rsv[20] = "Therefore thus says the Lord GOD: Behold, my anger and my wrath will be poured out on this place, upon man and beast, upon the trees of the field and the fruit of the ground; it will burn and not be quenched.&quot;";
asv[20] = "Therefore thus saith the Lord Jehovah: Behold, mine anger and my wrath shall be poured out upon this place, upon man, and upon beast, and upon the trees of the field, and upon the fruit of the ground; and it shall burn, and shall not be quenched.";
yng[20] = "Therefore, thus said the Lord Jehovah, Lo, Mine anger and My fury is poured out on this place, On man, and beast, and on tree of the field, And on fruit of the ground, And it hath burned, and it is not quenched.";
dby[20] = "Therefore thus saith the Lord Jehovah: Behold, mine anger and my fury shall be poured out upon this place; upon man, and upon beast, and upon the trees of the field, and upon the fruit of the ground; and it shall burn, and shall not be quenched.";
web[20] = "Therefore thus saith the Lord GOD; Behold, my anger and my fury shall be poured out upon this place, upon man, and upon beast, and upon the trees of the field, and upon the fruit of the ground; and it shall burn, and shall not be quenched.";
hnv[20] = "Therefore thus says the Lord GOD: Behold, my anger and my wrath shall be poured out on this place, on man, and on animal, and on the trees of the field, and on the fruit of the ground; and it shall burn, and shall not be quenched.";
vul[20] = "ideo haec dicit Dominus Deus ecce furor meus et indignatio mea conflatur super locum istum super viros et super iumenta et super lignum regionis et super fruges terrae et succendetur et non extinguetur";
kjv[21] = "Thus saith the LORD of hosts, the God of Israel, Amend your ways and your doings, and I will cause you to dwell in this place.";
rsv[21] = "Thus says the LORD of hosts, the God of Israel: &quot;Add your burnt offerings to your sacrifices, and eat the flesh.";
asv[21] = "Thus saith Jehovah of hosts, the God of Israel: Add your burnt-offerings unto your sacrifices, and eat ye flesh.";
yng[21] = "Thus said Jehovah of Hosts, God of Israel, Your burnt-offerings add to your sacrifices, And eat ye flesh.";
dby[21] = "Thus saith Jehovah of hosts, the God of Israel: Add your burnt-offerings to your sacrifices, and eat the flesh.";
web[21] = "Thus saith the LORD of hosts, the God of Israel; Put your burnt-offerings to your sacrifices, and eat flesh.";
hnv[21] = "Thus says the LORD of Hosts, the God of Yisra\'el: Add your burnt offerings to your sacrifices, and eat you flesh.";
vul[21] = "haec dicit Dominus exercituum Deus Israhel holocaustomata vestra addite victimis vestris et comedite carnes";
kjv[22] = "Trust ye not in lying words, saying, The temple of the LORD, The temple of the LORD, The temple of the LORD, [are] these.";
rsv[22] = "For in the day that I brought them out of the land of Egypt, I did not speak to your fathers or command them concerning burnt offerings and sacrifices.";
asv[22] = "For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt-offerings or sacrifices:";
yng[22] = "For I did not speak with your fathers, Nor did I command them in the day of My bringing them out of the land of Egypt, Concerning the matters of burnt-offering and sacrifice,";
dby[22] = "For I spoke not unto your fathers, nor commanded them concerning burnt-offerings and sacrifices, in the day that I brought them out of the land of Egypt;";
web[22] = "For I spoke not to your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt-offerings or sacrifices:";
hnv[22] = "For I didn\'t speak to your fathers, nor command them in the day that I brought them out of the land of Mitzrayim, concerning burnt offerings or sacrifices:";
vul[22] = "quia non sum locutus cum patribus vestris et non praecepi eis in die qua eduxi eos de terra Aegypti de verbo holocaustomatum et victimarum";
kjv[23] = "For if ye throughly amend your ways and your doings; if ye throughly execute judgment between a man and his neighbour;";
rsv[23] = "But this command I gave them, \'Obey my voice, and I will be your God, and you shall be my people; and walk in all the way that I command you, that it may be well with you.\'";
asv[23] = "but this thing I commanded them, saying, Hearken unto my voice, and I will be your God, and ye shall be my people; and walk ye in all the way that I command you, that it may be well with you.";
yng[23] = "But this thing I commanded them, saying: Hearken to My voice, And I have been to you for God, And ye -- ye are to Me for a people, And have walked in all the way that I command you, So that it is well for you.";
dby[23] = "but I commanded them this thing, saying, Hearken unto my voice, and I will be your God, and ye shall be my people; and walk in all the way that I command you, that it may be well with you.";
web[23] = "But this thing I commanded them, saying, Obey my voice, and I will be your God, and ye shall be my people: and walk ye in all the ways that I have commanded you, that it may be well to you.";
hnv[23] = " but this thing I commanded them, saying, Listen to my voice, and I will be your God, and you shall be my people; and walk you in all the way that I command you, that it may be well with you.";
vul[23] = "sed hoc verbum praecepi eis dicens audite vocem meam et ero vobis Deus et vos eritis mihi populus et ambulate in omni via quam mandavi vobis ut bene sit vobis";
kjv[24] = "[If] ye oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in this place, neither walk after other gods to your hurt:";
rsv[24] = "But they did not obey or incline their ear, but walked in their own counsels and the stubbornness of their evil hearts, and went backward and not forward.";
asv[24] = "But they hearkened not, nor inclined their ear, but walked in [their own] counsels [and] in the stubbornness of their evil heart, and went backward, and not forward.";
yng[24] = "And they have not hearkened, nor inclined their ear, And they walk in the counsels, In the stubbornness, of their evil heart, And are for backward, and not for forward.";
dby[24] = "But they hearkened not, nor inclined their ear, but walked in the counsels, in the stubbornness of their evil heart, and went backward and not forward.";
web[24] = "But they hearkened not, nor inclined their ear, but walked in the counsels [and] in the imagination of their evil heart, and went backward, and not forward.";
hnv[24] = "But they didn\'t listen nor turn their ear, but walked in [their own] counsels [and] in the stubbornness of their evil heart, and went backward, and not forward.";
vul[24] = "et non audierunt nec inclinaverunt aurem suam sed abierunt in voluntatibus et pravitate cordis sui mali factique sunt retrorsum et non in ante";
kjv[25] = "Then will I cause you to dwell in this place, in the land that I gave to your fathers, for ever and ever.";
rsv[25] = "From the day that your fathers came out of the land of Egypt to this day, I have persistently sent all my servants the prophets to them, day after day;";
asv[25] = "Since the day that your fathers came forth out of the land of Egypt unto this day, I have sent unto you all my servants the prophets, daily rising up early and sending them:";
yng[25] = "Even from the day when your fathers Went out of the land of Egypt till this day, I send to you all my servants the prophets, Daily rising early and sending,";
dby[25] = "Since the day that your fathers came forth out of the land of Egypt, unto this day, have I sent unto you all my servants the prophets, daily rising up early and sending them;";
web[25] = "Since the day that your fathers came forth from the land of Egypt to this day I have even sent to you all my servants the prophets, daily rising early and sending [them]:";
hnv[25] = "Since the day that your fathers came forth out of the land of Mitzrayim to this day, I have sent to you all my servants the prophets, daily rising up early and sending them:";
vul[25] = "a die qua egressi sunt patres eorum de terra Aegypti usque ad diem hanc et misi ad vos omnes servos meos prophetas per diem consurgens diluculo et mittens";
kjv[26] = "Behold, ye trust in lying words, that cannot profit.";
rsv[26] = "yet they did not listen to me, or incline their ear, but stiffened their neck. They did worse than their fathers.";
asv[26] = "yet they hearkened not unto me, nor inclined their ear, but made their neck stiff: they did worse than their fathers.";
yng[26] = "And they have not hearkened unto Me, Nor inclined their ear, and harden their neck, They have done evil above their fathers.";
dby[26] = "but they have not hearkened unto me, nor inclined their ear; and they have hardened their neck: they have done worse than their fathers.";
web[26] = "Yet they hearkened not to me, nor inclined their ear, but hardened their neck: they did worse than their fathers.";
hnv[26] = "yet they didn\'t listen to me, nor inclined their ear, but made their neck stiff: they did worse than their fathers.";
vul[26] = "et non audierunt me nec inclinaverunt aurem suam sed induraverunt cervicem et peius operati sunt quam patres eorum";
kjv[27] = "Will ye steal, murder, and commit adultery, and swear falsely, and burn incense unto Baal, and walk after other gods whom ye know not;";
rsv[27] = "&quot;So you shall speak all these words to them, but they will not listen to you. You shall call to them, but they will not answer you.";
asv[27] = "And thou shalt speak all these words unto them; but they will not hearken to thee: thou shalt also call unto them; but they will not answer thee.";
yng[27] = "And thou hast spoken unto them all these words, And they do not hearken to thee, And thou hast called unto them, And they do not answer thee.";
dby[27] = "And thou shalt speak all these words unto them, but they will not hearken unto thee; and thou shalt call unto them, but they will not answer thee.";
web[27] = "Therefore thou shalt speak all these words to them; but they will not hearken to thee: thou shalt also call to them; but they will not answer thee.";
hnv[27] = "You shall speak all these words to them; but they will not listen to you: you shall also call to them; but they will not answer you.";
vul[27] = "et loqueris ad eos omnia verba haec et non audient te et vocabis eos et non respondebunt tibi";
kjv[28] = "And come and stand before me in this house, which is called by my name, and say, We are delivered to do all these abominations?";
rsv[28] = "And you shall say to them, \'This is the nation that did not obey the voice of the LORD their God, and did not accept discipline; truth has perished; it is cut off from their lips.";
asv[28] = "And thou shalt say unto them, This is the nation that hath not hearkened to the voice of Jehovah their God, nor received instruction: truth is perished, and is cut off from their mouth.";
yng[28] = "And thou hast said unto them: This [is] the nation that hath not hearkened, To the voice of Jehovah its God, Nor have they accepted instruction, Perished hath stedfastness, Yea, it hath been cut off from their mouth.";
dby[28] = "And thou shalt say unto them, This is the nation which hath not hearkened unto the voice of Jehovah their God, nor received correction; fidelity is perished, and is cut off from their mouth.";
web[28] = "But thou shalt say to them, This [is] a nation that obeyeth not the voice of the LORD their God, nor receiveth correction: truth hath perished, and is cut off from their mouth.";
hnv[28] = "You shall tell them, This is the nation that has not listened to the voice of the LORD their God, nor received instruction: truth is perished, and is cut off from their mouth.";
vul[28] = "et dices ad eos haec est gens quae non audivit vocem Domini Dei sui nec recepit disciplinam periit fides et ablata est de ore eorum";
kjv[29] = "Is this house, which is called by my name, become a den of robbers in your eyes? Behold, even I have seen [it], saith the LORD.";
rsv[29] = "Cut off your hair and cast it away; raise a lamentation on the bare heights, for the LORD has rejected and forsaken the generation of his wrath.\'";
asv[29] = "Cut off thy hair, [O Jerusalem], and cast it away, and take up a lamentation on the bare heights; for Jehovah hath rejected and forsaken the generation of his wrath.";
yng[29] = "Cut off thy crown, and cast [it] away, And lift up on high places lamentation, For Jehovah hath rejected, And He leaveth the generation of His wrath.";
dby[29] = "Cut off thy hair, and cast it away, and take up a lamentation on the heights; for Jehovah hath rejected and forsaken the generation of his wrath.";
web[29] = "Cut off thy hair, [O Jerusalem], and cast [it] away, and take up a lamentation on high places; for the LORD hath rejected and forsaken the generation of his wrath.";
hnv[29] = "Cut off your hair, [Yerushalayim], and cast it away, and take up a lamentation on the bare heights; for the LORD has rejected and forsaken the generation of his wrath.";
vul[29] = "tonde capillum tuum et proice et sume in directum planctum quia proiecit Dominus et reliquit generationem furoris sui";
kjv[30] = "But go ye now unto my place which [was] in Shiloh, where I set my name at the first, and see what I did to it for the wickedness of my people Israel.";
rsv[30] = "&quot;For the sons of Judah have done evil in my sight, says the LORD; they have set their abominations in the house which is called by my name, to defile it.";
asv[30] = "For the children of Judah have done that which is evil in my sight, saith Jehovah: they have set their abominations in the house which is called by my name, to defile it.";
yng[30] = "For the sons of Judah Have done the evil thing in Mine eyes, An affirmation of Jehovah, They have set their abominations in the house On which My name is called -- to defile it,";
dby[30] = "For the children of Judah have done evil in my sight, saith Jehovah; they have set their abominations in the house which is called by my name, to defile it.";
web[30] = "For the children of Judah have done evil in my sight, saith the LORD: they have set their abominations in the house which is called by my name, to pollute it.";
hnv[30] = "For the children of Yehudah have done that which is evil in my sight, says the LORD: they have set their abominations in the house which is called by my name, to defile it.";
vul[30] = "quia fecerunt filii Iuda malum in oculis meis dicit Dominus posuerunt offendicula sua in domo in qua invocatum est nomen meum ut polluerent eam";
kjv[31] = "And now, because ye have done all these works, saith the LORD, and I spake unto you, rising up early and speaking, but ye heard not; and I called you, but ye answered not;";
rsv[31] = "And they have built the high place of Topheth, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I did not command, nor did it come into my mind.";
asv[31] = "And they have built the high places of Topheth, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded not, neither came it into my mind.";
yng[31] = "And have built the high places of Tophet, That [are] in the valley of the son of Hinnom, To burn their sons and their daughters with fire, Which I did not command, Nor did it come up on My heart.";
dby[31] = "And they have built the high places of Topheth, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded not, neither did it come up into my mind.";
web[31] = "And they have built the high places of Tophet, which [is] in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded [them] not, neither came it into my heart.";
hnv[31] = "They have built the high places of Tofet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I didn\'t command, neither came it into my mind.";
vul[31] = "et aedificaverunt excelsa Thofeth qui est in valle filii Ennom ut incenderent filios suos et filias suas igni quae non praecepi nec cogitavi in corde meo";
kjv[32] = "Therefore will I do unto [this] house, which is called by my name, wherein ye trust, and unto the place which I gave to you and to your fathers, as I have done to Shiloh.";
rsv[32] = "Therefore, behold, the days are coming, says the LORD, when it will no more be called Topheth, or the valley of the son of Hinnom, but the valley of Slaughter: for they will bury in Topheth, because there is no room elsewhere.";
asv[32] = "Therefore, behold, the days come, saith Jehovah, that it shall no more be called Topheth, nor The valley of the son of Hinnom, but The valley of Slaughter: for they shall bury in Topheth, till there be no place [to bury].";
yng[32] = "Therefore, lo, days are coming, An affirmation of Jehovah, And it is not said any more, `The Tophet,\' And `Valley of the son of Hinnom,\' But `Valley of the slaughter,\' And they have buried in Tophet -- without place.";
dby[32] = "Therefore, behold, days are coming, saith Jehovah, when it shall no more be said, Topheth, and Valley of the son of Hinnom, but the valley of slaughter; for they shall bury in Topheth, till there be no place.";
web[32] = "Therefore, behold, the days come, saith the LORD, that it shall no more be called Tophet, nor the valley of the son of Hinnom, but the valley of slaughter: for they shall bury in Tophet, till there shall be no place.";
hnv[32] = "Therefore, behold, the days come, says the LORD, that it shall no more be called Tofet, nor The valley of the son of Hinnom, but The valley of Slaughter: for they shall bury in Tofet, until there be no place [to bury].";
vul[32] = "ideo ecce dies venient dicit Dominus et non dicetur amplius Thofeth et vallis filii Ennom sed vallis Interfectionis et sepelient in Thofeth eo quod non sit locus";
kjv[33] = "And I will cast you out of my sight, as I have cast out all your brethren, [even] the whole seed of Ephraim.";
rsv[33] = "And the dead bodies of this people will be food for the birds of the air, and for the beasts of the earth; and none will frighten them away.";
asv[33] = "And the dead bodies of this people shall be food for the birds of the heavens, and for the beasts of the earth; and none shall frighten them away.";
yng[33] = "And the carcase of this people hath been for food To a fowl of the heavens, and to a beast of the earth, And there is none troubling.";
dby[33] = "And the carcases of this people shall be food for the fowl of the heavens, and for the beasts of the earth; and none shall scare [them] away.";
web[33] = "And the carcasses of this people shall be food for the fowls of heaven, and for the beasts of the earth; and none shall frighten [them] away.";
hnv[33] = "The dead bodies of this people shall be food for the birds of the sky, and for the animals of the eretz; and none shall frighten them away.";
vul[33] = "et erit morticinum populi huius in cibum volucribus caeli et bestiis terrae et non erit qui abigat";
kjv[34] = "Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee.";
rsv[34] = "And I will make to cease from the cities of Judah and from the streets of Jerusalem the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride; for the land shall become a waste.";
asv[34] = "Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride; for the land shall become a waste.";
yng[34] = "And I have caused to cease from cities of Judah, And from streets of Jerusalem, The voice of joy, and the voice of gladness, Voice of bridegroom, and voice of bride, For the land doth become a desolation!";
dby[34] = "And I will cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth and the voice of joy, the voice of the bridegroom and the voice of the bride; for the land shall become a waste.";
web[34] = "Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride: for the land shall be desolate.";
hnv[34] = "Then will I cause to cease from the cities of Yehudah, and from the streets of Yerushalayim, the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride; for the land shall become a waste.";
vul[34] = "et quiescere faciam de urbibus Iuda et de plateis Hierusalem vocem gaudii et vocem laetitiae vocem sponsi et vocem sponsae in desolatione enim erit terra";
</script>
