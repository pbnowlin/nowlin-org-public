csb[1] = "This is the word that came to Jeremiah from the LORD:";
csb[2] = "&quot;Listen to the words of this covenant and tell them to the men of Judah and the residents of Jerusalem.";
csb[3] = "&quot;Tell them, \'This is what the LORD, the God of Israel, says: &quot;Let a curse be on the man who does not obey the words of this covenant,";
csb[4] = "&quot;which I commanded your ancestors when I brought them out of the land of Egypt, out of the iron furnace.&quot; I declared, &quot;Obey me, and do everything that I command you, and you will be my people, and I will be your God,&quot;";
csb[5] = "in order to establish the oath I swore to your ancestors, to give them a land flowing with milk and honey, as it is today.\' &quot; I answered, &quot;Amen, LORD.&quot;";
csb[6] = "The LORD said to me, &quot;Proclaim all these words in the cities of Judah and in the streets of Jerusalem: \'Obey the words of this covenant and carry them out.\'";
csb[7] = "&quot;For I strongly warned your ancestors when I brought them out of the land of Egypt until today, warning them time and time again, \'Obey me.\'";
csb[8] = "&quot;Yet they would not obey or pay attention; each one followed the stubbornness of his evil heart. So I brought on them all the curses of this covenant, because they had not done what I commanded them to do.&quot;";
csb[9] = "The LORD said to me, &quot;A conspiracy has been discovered among the men of Judah and the residents of Jerusalem.";
csb[10] = "&quot;They have returned to the iniquities of their fathers who refused to obey my words and have followed other gods to worship them. The house of Israel and the house of Judah broke my covenant I made with their ancestors.";
csb[11] = "&quot;Therefore, this is what the LORD says: I am about to bring on them disaster that they cannot escape. They will cry out to me, but I will not hear them.";
csb[12] = "&quot;Then the cities of Judah and the residents of Jerusalem will go and cry out to the gods they have been burning incense to, but they certainly will not save them in their time of disaster.";
csb[13] = "&quot;Your gods are indeed as numerous as your cities, Judah, and the altars you have set up to Shame -- altars to burn incense to Baal -- as numerous as the streets of Jerusalem.";
csb[14] = "&quot;As for you, do not pray for these people. Do not raise up a cry or a prayer on their behalf, for I will not be listening when they call out to me at the time of their disaster.";
csb[15] = "&quot;What right does my beloved have to be in my house, having carried out so many evil schemes? Can holy meat prevent your disaster so you can celebrate?";
csb[16] = "&quot;The LORD named you a flourishing olive tree, beautiful with well-formed fruit. He has set fire to it, and its branches are consumed with the sound of a mighty tumult.";
csb[17] = "&quot;The LORD of Armies who planted you has decreed disaster against you, because of the disaster the house of Israel and the house of Judah brought on themselves when they angered me by burning incense to Baal.&quot;";
csb[18] = "The LORD informed me, so I knew. Then you helped me to see their deeds,";
csb[19] = "for I was like a docile lamb led to slaughter. I didn\'t know that they had devised plots against me: &quot;Let\'s destroy the tree with its fruit; let\'s cut him off from the land of the living so that his name will no longer be remembered.&quot;";
csb[20] = "But, LORD of Armies, who judges righteously, who tests heart and mind, let me see your vengeance on them, for I have presented my case to you.";
csb[21] = "Therefore, here is what the LORD says concerning the people of Anathoth who intend to take your life. They warn, &quot;Do not prophesy in the name of the LORD, or you will certainly die at our hand.&quot;";
csb[22] = "Therefore, this is what the LORD of Armies says: &quot;I am about to punish them. The young men will die by the sword; their sons and daughters will die by famine.";
csb[23] = "&quot;They will have no remnant, for I will bring disaster on the people of Anathoth in the year of their punishment.&quot;";
