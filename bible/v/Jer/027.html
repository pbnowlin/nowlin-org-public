csb[1] = "At the beginning of the reign of Zedekiah son of Josiah, king of Judah, this word came to Jeremiah from the LORD:";
csb[2] = "This is what the LORD said to me: &quot;Make chains and yoke bars for yourself and put them on your neck.";
csb[3] = "&quot;Send word to the king of Edom, the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon through messengers who are coming to King Zedekiah of Judah in Jerusalem.";
csb[4] = "&quot;Command them to go to their masters, saying, \'This is what the LORD of Armies, the God of Israel, says: Tell this to your masters:";
csb[5] = "&quot;By my great strength and outstretched arm, I made the earth, and the people, and animals on the face of the earth. I give it to anyone I please.";
csb[6] = "&quot;So now I have placed all these lands under the authority of my servant Nebuchadnezzar, king of Babylon. I have even given him the wild animals to serve him.";
csb[7] = "&quot;All nations will serve him, his son, and his grandson until the time for his own land comes, and then many nations and great kings will enslave him.";
csb[8] = "&quot; \' &quot;As for the nation or kingdom that does not serve King Nebuchadnezzar of Babylon and does not place its neck under the yoke of the king of Babylon, that nation I will punish by sword, famine, and plague -- this is the LORD\'s declaration -- until through him I have destroyed it.";
csb[9] = "&quot;So you should not listen to your prophets, diviners, dreamers, fortune-tellers, or sorcerers who say to you, \'Don\'t serve the king of Babylon! \'";
csb[10] = "&quot;They are prophesying a lie to you so that you will be removed from your land. I will banish you, and you will perish.";
csb[11] = "&quot;But as for the nation that will put its neck under the yoke of the king of Babylon and serve him, I will leave it in its own land, and that nation will cultivate it and reside in it. This is the LORD\'s declaration.&quot; \' &quot;";
csb[12] = "I spoke to King Zedekiah of Judah in the same way: &quot;Put your necks under the yoke of the king of Babylon, serve him and his people, and live!";
csb[13] = "&quot;Why should you and your people die by the sword, famine, and plague as the LORD has threatened against any nation that does not serve the king of Babylon?";
csb[14] = "&quot;Do not listen to the words of the prophets who are telling you, \'Don\'t serve the king of Babylon,\' for they are prophesying a lie to you.";
csb[15] = "&quot;\'I have not sent them\' -- this is the LORD\'s declaration -- \'and they are prophesying falsely in my name; therefore, I will banish you, and you will perish -- you and the prophets who are prophesying to you.\' &quot;";
csb[16] = "Then I spoke to the priests and all these people, saying, &quot;This is what the LORD says: \'Do not listen to the words of your prophets. They are prophesying to you, claiming, &quot;Look, very soon now the articles of the LORD\'s temple will be brought back from Babylon.&quot; They are prophesying a lie to you.";
csb[17] = "Do not listen to them. Serve the king of Babylon and live! Why should this city become a ruin?";
csb[18] = "If they are indeed prophets and if the word of the LORD is with them, let them intercede with the LORD of Armies not to let the articles that remain in the LORD\'s temple, in the palace of the king of Judah, and in Jerusalem go to Babylon.\'";
csb[19] = "For this is what the LORD of Armies says about the pillars, the basin, the water carts, and the rest of the articles that still remain in this city,";
csb[20] = "those King Nebuchadnezzar of Babylon did not take when he deported Jeconiah son of Jehoiakim, king of Judah, from Jerusalem to Babylon along with all the nobles of Judah and Jerusalem.";
csb[21] = "Yes, this is what the LORD of Armies, the God of Israel, says about the articles that remain in the temple of the LORD, in the palace of the king of Judah, and in Jerusalem:";
csb[22] = "\'They will be taken to Babylon and will remain there until I attend to them again.\' This is the LORD\'s declaration. \'Then I will bring them up and restore them to this place.\' &quot;";

asv[3] = "and send them to the king of Edom, and to the king of Moab, and to the king of the children of Ammon, and to the king of Tyre, and to the king of Sidon, by the hand of the messengers that come to Jerusalem unto Zedekiah king of Judah:";
yng[3] = "And thou hast put them on thy neck, and hast sent them unto the king of Edom, and unto the king of Moab, and unto the king of the sons of Ammon, and unto the king of Tyre, and unto the king of Zidon, by the hand of messengers who are coming in to Jerusalem, unto Zedekiah king of Judah;";

kjv[5] = "I have made the earth, the man and the beast that [are] upon the ground, by my great power and by my outstretched arm, and have given it unto whom it seemed meet unto me.";

asv[5] = "I have made the earth, the men and the beasts that are upon the face of the earth, by my great power and by my outstretched arm; and I give it unto whom it seemeth right unto me.";
yng[5] = "Thus do ye say unto your lords, I -- I have made the earth with man, and the cattle that [are] on the face of the earth, by My great power, and by My stretched-out arm, and I have given it to whom it hath been right in Mine eyes.";
dby[5] = "I have made the earth, man and beast that are upon the face of the earth, by my great power and by my outstretched arm; and I give them unto whom it seemeth right in mine eyes.";

dby[7] = "And all the nations shall serve him, and his son, and his son\'s son, until the time of his land also come, when many nations and great kings shall reduce him to servitude.";

kjv[8] = "And it shall come to pass, [that] the nation and kingdom which will not serve the same Nebuchadnezzar the king of Babylon, and that will not put their neck under the yoke of the king of Babylon, that nation will I punish, saith the LORD, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.";
rsv[8] = "&quot;\'&quot;But if any nation or kingdom will not serve this Nebuchadnez\'zar king of Babylon, and put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, says the LORD, until I have consumed it by his hand.";
asv[8] = "And it shall come to pass, that the nation and the kingdom which will not serve the same Nebuchadnezzar king of Babylon, and that will not put their neck under the yoke of the king of Babylon, that nation will I punish, saith Jehovah, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.";
yng[8] = "And it hath come to pass, the nation and the kingdom that do not serve him -- Nebuchadnezzar king of Babylon -- and that which putteth not its neck into the yoke of the king of Babylon, with sword, and with famine, and with pestilence, I lay a charge on that nation -- an affirmation of Jehovah -- till I consume them by his hand.";
dby[8] = "And it shall come to pass, that the nation and kingdom which will not serve the same Nebuchadnezzar king of Babylon, and that will not put their neck under the yoke of the king of Babylon, that nation will I visit, saith Jehovah, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.";
web[8] = "And it shall come to pass, [that] the nation and kingdom which will not serve the same Nebuchadnezzar, king of Babylon, and that will not put their neck under the yoke of the king of Babylon, that nation will I punish, saith the LORD, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.";
hnv[8] = "It shall happen, that the nation and the kingdom which will not serve the same Nevukhadnetztzar king of Bavel, and that will not put their neck under the yoke of the king of Bavel, that nation will I punish, says the LORD, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.";

rsv[16] = "Then I spoke to the priests and to all this people, saying, &quot;Thus says the LORD: Do not listen to the words of your prophets who are prophesying to you, saying, \'Behold, the vessels of the LORD\'s house will now shortly be brought back from Babylon,\' for it is a lie which they are prophesying to you.";
asv[16] = "Also I spake to the priests and to all this people, saying, Thus saith Jehovah: Hearken not to the words of your prophets that prophesy unto you, saying, Behold, the vessels of Jehovah\'s house shall now shortly be brought again from Babylon; for they prophesy a lie unto you.";
yng[16] = "And unto the priests, and unto all this people, I have spoken, saying, `Thus said Jehovah, Ye do not hearken unto the words of your prophets, who are prophesying to you, saying, Lo, the vessels of the house of Jehovah are brought back from Babylon now in haste, for falsehood they are prophesying to you.";
dby[16] = "And I spoke to the priests and to all this people, saying, Thus saith Jehovah: Hearken not to the words of your prophets that prophesy unto you, saying, Behold, the vessels of Jehovah\'s house shall now shortly be brought again from Babylon; for they prophesy falsehood unto you.";
web[16] = "Also I spoke to the priests and to all this people, saying, Thus saith the LORD; Hearken not to the words of your prophets that prophesy to you, saying, Behold, the vessels of the LORD\'S house shall now shortly be brought again from Babylon: for they prophesy a lie to you.";
hnv[16] = "Also I spoke to the Kohanim and to all this people, saying, Thus says the LORD: Don\'t listen to the words of your prophets who prophesy to you, saying, Behold, the vessels of the LORD\'s house shall now shortly be brought again from Bavel; for they prophesy a lie to you.";
vul[16] = "et ad sacerdotes et ad populum istum locutus sum dicens haec dicit Dominus nolite audire verba prophetarum vestrorum qui prophetant vobis dicentes ecce vasa Domini revertentur de Babylone nunc cito mendacium enim prophetant vobis";
kjv[17] = "Hearken not unto them; serve the king of Babylon, and live: wherefore should this city be laid waste?";
rsv[17] = "Do not listen to them; serve the king of Babylon and live. Why should this city become a desolation?";
asv[17] = "Hearken not unto them; serve the king of Babylon, and live: wherefore should this city become a desolation?";
yng[17] = "Ye do not hearken unto them, serve the king of Babylon, and live. Why is this city a waste?";
dby[17] = "Hearken not unto them; serve the king of Babylon, and live: wherefore should this city become a waste?";
web[17] = "Hearken not to them; serve the king of Babylon, and live: why should this city be laid waste?";
hnv[17] = "Don\'t listen to them; serve the king of Bavel, and live: why should this city become a desolation?";
vul[17] = "nolite ergo audire eos sed servite regi Babylonis ut vivatis quare datur haec civitas in solitudinem";
kjv[18] = "But if they [be] prophets, and if the word of the LORD be with them, let them now make intercession to the LORD of hosts, that the vessels which are left in the house of the LORD, and [in] the house of the king of Judah, and at Jerusalem, go not to Babylon.";
rsv[18] = "If they are prophets, and if the word of the LORD is with them, then let them intercede with the LORD of hosts, that the vessels which are left in the house of the LORD, in the house of the king of Judah, and in Jerusalem may not go to Babylon.";
asv[18] = "But if they be prophets, and if the word of Jehovah be with them, let them now make intercession to Jehovah of hosts, that the vessels which are left in the house of Jehovah, and in the house of the king of Judah, and at Jerusalem, go not to Babylon.";
yng[18] = "`And, if they be prophets, and if a word of Jehovah be with them, let them intercede, I pray you, with Jehovah of Hosts, so that the vessels that are left in the house of Jehovah, and [in] the house of the king of Judah, and in Jerusalem, have not gone into Babylon.";
dby[18] = "But if they be prophets, and if the word of Jehovah be with them, let them now make intercession to Jehovah of hosts, that the vessels which are left in the house of Jehovah, and in the house of the king of Judah, and at Jerusalem, go not to Babylon.";
web[18] = "But if they [are] prophets, and if the word of the LORD is with them, let them now make intercession to the LORD of hosts, that the vessels which are left in the house of the LORD, and [in] the house of the king of Judah, and at Jerusalem, go not to Babylon.";
hnv[18] = "But if they be prophets, and if the word of the LORD be with them, let them now make intercession to the LORD of Hosts, that the vessels which are left in the house of the LORD, and in the house of the king of Yehudah, and at Yerushalayim, don\'t go to Bavel.";
vul[18] = "et si prophetae sunt et est verbum Domini in eis occurrant Domino exercituum ut non veniant vasa quae derelicta fuerant in domum Domini et in domum regis Iuda et in Hierusalem in Babylonem";
kjv[19] = "For thus saith the LORD of hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the residue of the vessels that remain in this city,";
rsv[19] = "For thus says the LORD of hosts concerning the pillars, the sea, the stands, and the rest of the vessels which are left in this city,";
asv[19] = "For thus saith Jehovah of hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the residue of the vessels that are left in this city,";
yng[19] = "For thus said Jehovah of Hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the rest of the vessels that are left in this city,";
dby[19] = "For thus saith Jehovah of hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the rest of the vessels that are left in this city,";
web[19] = "For thus saith the LORD of hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the residue of the vessels that remain in this city,";
hnv[19] = "For thus says the LORD of Hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the residue of the vessels that are left in this city,";
vul[19] = "quia haec dicit Dominus exercituum ad columnas et ad mare et ad bases et ad reliqua vasorum quae remanserunt in civitate hac";
kjv[20] = "Which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim king of Judah from Jerusalem to Babylon, and all the nobles of Judah and Jerusalem;";
rsv[20] = "which Nebuchadnez\'zar king of Babylon did not take away, when he took into exile from Jerusalem to Babylon Jeconi\'ah the son of Jehoi\'akim, king of Judah, and all the nobles of Judah and Jerusalem--";
asv[20] = "which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim, king of Judah, from Jerusalem to Babylon, and all the nobles of Judah and Jerusalem;";
yng[20] = "That Nebuchadnezzar king of Babylon hath not taken, in his removing Jeconiah son of Jehoiakim king of Judah from Jerusalem to Babylon with all the freemen of Judah and Jerusalem,";
dby[20] = "which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim, the king of Judah, from Jerusalem to Babylon, along with all the nobles of Judah and Jerusalem;";
web[20] = "Which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim king of Judah from Jerusalem to Babylon, and all the nobles of Judah and Jerusalem;";
hnv[20] = "which Nevukhadnetztzar king of Bavel didn\'t take, when he carried away captive Yekhonyah the son of Yehoiakim, king of Yehudah, from Yerushalayim to Bavel, and all the nobles of Yehudah and Yerushalayim;";
vul[20] = "quae non tulit Nabuchodonosor rex Babylonis cum transferret Iechoniam filium Ioachim regem Iuda de Hierusalem in Babylonem et omnes optimates Iuda et Hierusalem";
kjv[21] = "Yea, thus saith the LORD of hosts, the God of Israel, concerning the vessels that remain [in] the house of the LORD, and [in] the house of the king of Judah and of Jerusalem;";
rsv[21] = "thus says the LORD of hosts, the God of Israel, concerning the vessels which are left in the house of the LORD, in the house of the king of Judah, and in Jerusalem:";
asv[21] = "yea, thus saith Jehovah of hosts, the God of Israel, concerning the vessels that are left in the house of Jehovah, and in the house of the king of Judah, and at Jerusalem:";
yng[21] = "Surely thus said Jehovah of Hosts, God of Israel, concerning the vessels that are left of the house of Jehovah, and of the house of the king of Judah, and [in] Jerusalem:";
dby[21] = "yea, thus saith Jehovah of hosts, the God of Israel, concerning the vessels that are left in the house of Jehovah, and in the house of the king of Judah, and in Jerusalem:";
web[21] = "Yes, thus saith the LORD of hosts, the God of Israel, concerning the vessels that remain [in] the house of the LORD, and [in] the house of the king of Judah and of Jerusalem;";
hnv[21] = "yes, thus says the LORD of Hosts, the God of Yisra\'el, concerning the vessels that are left in the house of the LORD, and in the house of the king of Yehudah, and at Yerushalayim:";
vul[21] = "quia haec dicit Dominus exercituum Deus Israhel ad vasa quae derelicta sunt in domum Domini et in domum regis Iuda et Hierusalem";
kjv[22] = "They shall be carried to Babylon, and there shall they be until the day that I visit them, saith the LORD; then will I bring them up, and restore them to this place.";
rsv[22] = "They shall be carried to Babylon and remain there until the day when I give attention to them, says the LORD. Then I will bring them back and restore them to this place.&quot;";
asv[22] = "They shall be carried to Babylon, and there shall they be, until the day that I visit them, saith Jehovah; then will I bring them up, and restore them to this place.";
yng[22] = "To Babylon they are brought, and there they are till the day of My inspecting them -- an affirmation of Jehovah; then I have brought them up, and have brought them back unto this place.\'";
dby[22] = "They shall be carried to Babylon, and there shall they be until the day of my visiting them, saith Jehovah; then I will bring them up, and restore them to this place.";
web[22] = "They shall be carried to Babylon, and there shall they be until the day that I visit them, saith the LORD; then will I bring them up, and restore them to this place.";
hnv[22] = "They shall be carried to Bavel, and there shall they be, until the day that I visit them, says the LORD; then will I bring them up, and restore them to this place.";
vul[22] = "in Babylonem transferentur et ibi erunt usque ad diem visitationis suae dicit Dominus et adferri faciam ea et restitui in loco isto";
