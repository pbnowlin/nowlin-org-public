csb[1] = "This is the word that came to Jeremiah from the LORD in the days of Jehoiakim son of Josiah, king of Judah:";
csb[2] = "&quot;Go to the house of the Rechabites, speak to them, and bring them to one of the chambers of the temple of the LORD to offer them a drink of wine.&quot;";
csb[3] = "So I took Jaazaniah son of Jeremiah, son of Habazziniah, and his brothers and all his sons -- the entire house of the Rechabites --";
csb[4] = "and I brought them into the temple of the LORD to a chamber occupied by the sons of Hanan son of Igdaliah, a man of God, who had a chamber near the officials\' chamber, which was above the chamber of Maaseiah son of Shallum the doorkeeper.";
csb[5] = "I set jars filled with wine and some cups before the sons of the house of the Rechabites and said to them, &quot;Drink wine! &quot;";
csb[6] = "But they replied, &quot;We do not drink wine, for Jonadab, son of our ancestor Rechab, commanded: \'You and your descendants must never drink wine.";
csb[7] = "&quot;You must not build a house or sow seed or plant a vineyard. Those things are not for you. Rather, you must live in tents your whole life, so you may live a long time on the soil where you stay as a resident alien.\'";
csb[8] = "&quot;We have obeyed Jonadab, son of our ancestor Rechab, in all he commanded us. So we haven\'t drunk wine our whole life -- we, our wives, our sons, and our daughters.";
csb[9] = "&quot;We also have not built houses to live in and do not have vineyard, field, or seed.";
csb[10] = "&quot;But we have lived in tents and have obeyed and done everything our ancestor Jonadab commanded us.";
csb[11] = "&quot;However, when King Nebuchadnezzar of Babylon marched into the land, we said, \'Come, let\'s go into Jerusalem to get away from the Chaldean and Aramean armies.\' So we have been living in Jerusalem.&quot;";
csb[12] = "Then the word of the LORD came to Jeremiah:";
csb[13] = "&quot;This is what the LORD of Armies, the God of Israel, says: Go, say to the men of Judah and the residents of Jerusalem, \'Will you not accept discipline by listening to my words? -- this is the LORD\'s declaration.";
csb[14] = "&quot;The words of Jonadab, son of Rechab, have been carried out. He commanded his descendants not to drink wine, and they have not drunk to this day because they have obeyed their ancestor\'s command. But I have spoken to you time and time again, and you have not obeyed me!";
csb[15] = "&quot;Time and time again I have sent you all my servants the prophets, proclaiming, &quot;Turn, each one from his evil way, and correct your actions. Stop following other gods to serve them. Live in the land that I gave you and your ancestors.&quot; But you did not pay attention or obey me.";
csb[16] = "Yes, the sons of Jonadab son of Rechab carried out their ancestor\'s command he gave them, but these people have not obeyed me.";
csb[17] = "Therefore, this is what the LORD, the God of Armies, the God of Israel, says: I will certainly bring on Judah and on all the residents of Jerusalem all the disaster I have pronounced against them because I have spoken to them, but they have not obeyed, and I have called to them, but they did not answer.\' &quot;";
csb[18] = "But to the house of the Rechabites Jeremiah said, &quot;This is what the LORD of Armies, the God of Israel, says: \'Because you have obeyed the command of your ancestor Jonadab and have kept all his commands and have done everything he commanded you,";
csb[19] = "&quot;this is what the LORD of Armies, the God of Israel, says: Jonadab son of Rechab will never fail to have a man to stand before me always.\' &quot;";

yng[7] = "and a house ye do not build, and seed ye do not sow, and a vineyard ye do not plant, nor have ye any; for in tents do ye dwell all your days, that ye may live many days on the face of the ground whither ye are sojourning.";

kjv[11] = "But it came to pass, when Nebuchadrezzar king of Babylon came up into the land, that we said, Come, and let us go to Jerusalem for fear of the army of the Chaldeans, and for fear of the army of the Syrians: so we dwell at Jerusalem.";
rsv[11] = "But when Nebuchadrez\'zar king of Babylon came up against the land, we said, \'Come, and let us go to Jerusalem for fear of the army of the Chalde\'ans and the army of the Syrians.\' So we are living in Jerusalem.&quot;";
asv[11] = "But it came to pass, when Nebuchadrezzar king of Babylon came up into the land, that we said, Come, and let us go to Jerusalem for fear of the army of the Chaldeans, and for fear of the army of the Syrians; so we dwell at Jerusalem.";
yng[11] = "and it cometh to pass, in the coming up of Nebuchadrezzar king of Babylon unto the land, that we say, Come, and we enter Jerusalem, because of the force of the Chaldeans, and because of the force of Aram -- and we dwell in Jerusalem.\'";
dby[11] = "And it came to pass when Nebuchadrezzar king of Babylon came up into the land, that we said, Come and let us go into Jerusalem because of the army of the Chaldeans, and because of the army of Syria; and we dwell at Jerusalem.";
web[11] = "But it came to pass, when Nebuchadrezzar king of Babylon came up into the land, that we said, Come, and let us go to Jerusalem for fear of the army of the Chaldeans, and for fear of the army of the Syrians: so we dwell at Jerusalem.";
hnv[11] = "But it happened, when Nevukhadretztzar king of Bavel came up into the land, that we said, Come, and let us go to Yerushalayim for fear of the army of the Kasdim, and for fear of the army of the Aram; so we dwell at Yerushalayim.";
vul[11] = "cum autem ascendisset Nabuchodonosor rex Babylonis ad terram nostram diximus venite et ingrediamur Hierusalem a facie exercitus Chaldeorum et a facie exercitus Syriae et mansimus in Hierusalem";

kjv[13] = "Thus saith the LORD of hosts, the God of Israel; Go and tell the men of Judah and the inhabitants of Jerusalem, Will ye not receive instruction to hearken to my words? saith the LORD.";
rsv[13] = "&quot;Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and the inhabitants of Jerusalem, Will you not receive instruction and listen to my words? says the LORD.";
asv[13] = "Thus saith Jehovah of hosts, the God of Israel: Go, and say to the men of Judah and the inhabitants of Jerusalem, Will ye not receive instruction to hearken to my words? saith Jehovah.";
yng[13] = "`Go, and thou hast said to the men of Judah, and to the inhabitants of Jerusalem: Do ye not receive instruction? -- to hearken unto My words -- an affirmation of Jehovah.";
dby[13] = "Thus saith Jehovah of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, Will ye not receive instruction to hearken unto my words? saith Jehovah.";
web[13] = "Thus saith the LORD of hosts, the God of Israel; Go and tell the men of Judah and the inhabitants of Jerusalem, Will ye not receive instruction to hearken to my words? saith the LORD.";
hnv[13] = " Thus says the LORD of Hosts, the God of Yisra\'el: Go, and tell the men of Yehudah and the inhabitants of Yerushalayim, Will you not receive instruction to listen to my words? says the LORD.";
vul[13] = "haec dicit Dominus exercituum Deus Israhel vade et dic viris Iuda et habitatoribus Hierusalem numquid non recipietis disciplinam ut oboediatis verbis meis dicit Dominus";
kjv[14] = "The words of Jonadab the son of Rechab, that he commanded his sons not to drink wine, are performed; for unto this day they drink none, but obey their father\'s commandment: notwithstanding I have spoken unto you, rising early and speaking; but ye hearkened not unto me.";
rsv[14] = "The command which Jon\'adab the son of Rechab gave to his sons, to drink no wine, has been kept; and they drink none to this day, for they have obeyed their father\'s command. I have spoken to you persistently, but you have not listened to me.";
asv[14] = "The words of Jonadab the son of Rechab, that he commanded his sons, not to drink wine, are performed; and unto this day they drink none, for they obey their father\'s commandment. But I have spoken unto you, rising up early and speaking; and ye have not hearkened unto me.";
yng[14] = "Performed have been the words of Jonadab son of Rechab, when he commanded his sons not to drink wine, and they have not drunk unto this day, for they have obeyed the command of their father; and I -- I have spoken unto you, rising early and speaking, and ye have not hearkened unto Me.";
dby[14] = "The words of Jonadab the son of Rechab, that he commanded his sons not to drink wine, are performed; and to this day they have drunk none, for they have obeyed their father\'s commandment. But I have spoken unto you, rising early and speaking, and ye have not hearkened unto me.";
web[14] = "The words of Jonadab the son of Rechab, that he commanded his sons not to drink wine, are performed; for to this day they drink none, but obey their father\'s commandment: notwithstanding I have spoken to you, rising early and speaking; but ye hearkened not to me.";
hnv[14] = "The words of Yehonadav the son of Rechav, that he commanded his sons, not to drink wine, are performed; and to this day they drink none, for they obey their father\'s mitzvah: but I have spoken to you, rising up early and speaking; and you have not listened to me.";
vul[14] = "praevaluerunt sermones Ionadab filii Rechab quos praecepit filiis suis ut non biberent vinum et non biberunt usque ad diem hanc quia oboedierunt praecepto patris sui ego autem locutus sum ad vos de mane consurgens et loquens et non oboedistis mihi";
kjv[15] = "I have sent also unto you all my servants the prophets, rising up early and sending [them], saying, Return ye now every man from his evil way, and amend your doings, and go not after other gods to serve them, and ye shall dwell in the land which I have given to you and to your fathers: but ye have not inclined your ear, nor hearkened unto me.";
rsv[15] = "I have sent to you all my servants the prophets, sending them persistently, saying, \'Turn now every one of you from his evil way, and amend your doings, and do not go after other gods to serve them, and then you shall dwell in the land which I gave to you and your fathers.\' But you did not incline your ear or listen to me.";
asv[15] = "I have sent also unto you all my servants the prophets, rising up early and sending them, saying, Return ye now every man from his evil way, and amend your doings, and go not after other gods to serve them, and ye shall dwell in the land which I have given to you and to your fathers: but ye have not inclined your ear, nor hearkened unto me.";
yng[15] = "And I send unto you all My servants the prophets, rising early and sending, saying: Turn back, I pray you, each from his evil way, and amend your doings, yea, ye do not walk after other gods, to serve them, and dwell ye on the ground that I have given to you and to your fathers; and ye have not inclined your ear, nor hearkened unto Me.";
dby[15] = "And I have sent unto you all my servants the prophets, rising early and sending, saying, Return ye now every man from his evil way, and amend your doings, and go not after other gods to serve them; and ye shall dwell in the land that I have given to you and to your fathers: but ye have not inclined your ear nor hearkened unto me.";
web[15] = "I have sent also to you all my servants the prophets, rising early and sending [them], saying, Return ye now every man from his evil way, and amend your doings, and go not after other gods to serve them, and ye shall dwell in the land which I have given to you and to your fathers: but ye have not inclined your ear, nor hearkened to me.";
hnv[15] = "I have sent also to you all my servants the prophets, rising up early and sending them, saying, Return you now every man from his evil way, and amend your doings, and don\'t go after other gods to serve them, and you shall dwell in the land which I have given to you and to your fathers: but you have not inclined your ear, nor listened to me.";
vul[15] = "misique ad vos omnes servos meos prophetas consurgens diluculo mittensque et dicens convertimini unusquisque a via sua pessima et bona facite studia vestra et nolite sequi deos alienos neque colatis eos et habitabitis in terra quam dedi vobis et patribus vestris et non inclinastis aurem vestram neque audistis me";
kjv[16] = "Because the sons of Jonadab the son of Rechab have performed the commandment of their father, which he commanded them; but this people hath not hearkened unto me:";
rsv[16] = "The sons of Jon\'adab the son of Rechab have kept the command which their father gave them, but this people has not obeyed me.";
asv[16] = "Forasmuch as the sons of Jonadab the son of Rechab have performed the commandment of their father which he commanded them, but this people hath not hearkened unto me;";
yng[16] = "`Because the sons of Jonadab son of Rechab have performed the command of their father, that he commanded them, and this people have not hearkened unto Me,";
dby[16] = "Yea, the sons of Jonadab the son of Rechab have performed the commandment of their father which he commanded them, but this people hath not hearkened unto me;";
