csb[1] = "While he was still confined in the guard\'s courtyard, the word of the LORD came to Jeremiah a second time:";
csb[2] = "&quot;The LORD who made the earth, the LORD who forms it to establish it, the LORD is his name, says this:";
csb[3] = "&quot;Call to me and I will answer you and tell you great and incomprehensible things you do not know.";
csb[4] = "&quot;For this is what the LORD, the God of Israel, says concerning the houses of this city and the palaces of Judah\'s kings, the ones torn down for defense against the assault ramps and the sword:";
csb[5] = "&quot;The people coming to fight the Chaldeans will fill the houses with the corpses of their own men that I strike down in my wrath and rage. I have hidden my face from this city because of all their evil.";
csb[6] = "&quot;Yet I will certainly bring health and healing to it and will indeed heal them. I will let them experience the abundance of true peace.";
csb[7] = "&quot;I will restore the fortunes of Judah and of Israel and will rebuild them as in former times.";
csb[8] = "&quot;I will purify them from all the iniquity they have committed against me, and I will forgive all the iniquities they have committed against me, rebelling against me.";
csb[9] = "&quot;This city will bear on my behalf a name of joy, praise, and glory before all the nations of the earth, who will hear of all the prosperity I will give them. They will tremble with awe because of all the good and all the peace I will bring about for them.";
csb[10] = "&quot;This is what the LORD says: In this place, which you say is a ruin, without people or animals -- that is, in Judah\'s cities and Jerusalem\'s streets that are a desolation without people, without inhabitants, and without animals -- there will be heard again";
csb[11] = "&quot;a sound of joy and gladness, the voice of the groom and the bride, and the voice of those saying, Give thanks to the LORD of Armies, for the LORD is good; his faithful love endures forever as they bring thank offerings to the temple of the LORD. For I will restore the fortunes of the land as in former times, says the LORD.";
csb[12] = "&quot;This is what the LORD of Armies says: In this desolate place -- without people or animals -- and in all its cities there will once more be a grazing land where shepherds may rest flocks.";
csb[13] = "&quot;The flocks will again pass under the hands of the one who counts them in the cities of the hill country, the cities of the Judean foothills, the cities of the Negev, the land of Benjamin -- the areas around Jerusalem and in Judah\'s cities, says the LORD.";
csb[14] = "&quot;Look, the days are coming&quot; -- this is the LORD\'s declaration -- &quot;when I will fulfill the good promise that I have spoken concerning the house of Israel and the house of Judah.";
csb[15] = "&quot;In those days and at that time I will cause a Righteous Branch to sprout up for David, and he will administer justice and righteousness in the land.";
csb[16] = "&quot;In those days Judah will be saved, and Jerusalem will dwell securely, and this is what she will be named: The LORD Is Our Righteousness.";
csb[17] = "&quot;For this is what the LORD says: David will never fail to have a man sitting on the throne of the house of Israel.";
csb[18] = "&quot;The Levitical priests will never fail to have a man always before me to offer burnt offerings, to burn grain offerings, and to make sacrifices.&quot;";
csb[19] = "The word of the LORD came to Jeremiah:";
csb[20] = "&quot;This is what the LORD says: If you can break my covenant with the day and my covenant with the night so that day and night cease to come at their regular time,";
csb[21] = "&quot;then also my covenant with my servant David may be broken. If that could happen, then he would not have a son reigning on his throne and the Levitical priests would not be my ministers.";
csb[22] = "&quot;Even as the stars of heaven cannot be counted, and the sand of the sea cannot be measured, so too I will make innumerable the descendants of my servant David and the Levites who minister to me.&quot;";
csb[23] = "The word of the LORD came to Jeremiah:";
csb[24] = "&quot;Have you not noticed what these people have said? They say, \'The LORD has rejected the two families he had chosen.\' My people are treated with contempt and no longer regarded as a nation among them.";
csb[25] = "&quot;This is what the LORD says: If I do not keep my covenant with the day and with the night, and if I fail to establish the fixed order of heaven and earth,";
csb[26] = "&quot;then I might also reject the descendants of Jacob and of my servant David. That is, I would not take rulers from his descendants to rule over the descendants of Abraham, Isaac, and Jacob. But in fact, I will restore their fortunes and have compassion on them.&quot;";
kjv[1] = "Moreover the word of the LORD came unto Jeremiah the second time, while he was yet shut up in the court of the prison, saying,";
rsv[1] = "The word of the LORD came to Jeremiah a second time, while he was still shut up in the court of the guard:";
asv[1] = "Moreover the word of Jehovah came unto Jeremiah the second time, while he was yet shut up in the court of the guard, saying,";
yng[1] = "And there is a word of Jehovah unto Jeremiah a second time -- and he [is] yet detained in the court of the prison -- saying:";
dby[1] = "And the word of Jehovah came to Jeremiah the second time, while he was still shut up in the court of the prison, saying,";
web[1] = "Moreover the word of the LORD came to Jeremiah the second time, while he was yet confined in the court of the prison, saying,";
hnv[1] = "Moreover the word of the LORD came to Yirmeyahu the second time, while he was yet shut up in the court of the guard, saying,";
vul[1] = "et factum est verbum Domini ad Hieremiam secundo cum adhuc clausus esset in atrio carceris dicens";
kjv[2] = "Thus saith the LORD the maker thereof, the LORD that formed it, to establish it; the LORD [is] his name;";
rsv[2] = "&quot;Thus says the LORD who made the earth, the LORD who formed it to establish it--the LORD is his name:";
asv[2] = "Thus saith Jehovah that doeth it, Jehovah that formeth it to establish it; Jehovah is his name:";
yng[2] = "Thus said Jehovah its maker, Jehovah its former, at establishing it, Jehovah [is] His name:";
dby[2] = "Thus saith Jehovah the doer of it, Jehovah that formeth it to establish it, Jehovah is his name:";
web[2] = "Thus saith the LORD the maker of this, the LORD that formed it, to establish it; the LORD [is] his name;";
hnv[2] = "Thus says the LORD who does it, the LORD who forms it to establish it; the LORD is his name:";
vul[2] = "haec dicit Dominus qui facturus est Dominus et formaturus illud et paraturus Dominus nomen eius";
kjv[3] = "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.";
rsv[3] = "Call to me and I will answer you, and will tell you great and hidden things which you have not known.";
asv[3] = "Call unto me, and I will answer thee, and will show thee great things, and difficult, which thou knowest not.";
yng[3] = "Call unto Me, and I do answer thee, yea, I declare to thee great and fenced things -- thou hast not known them.";
dby[3] = "Call unto me, and I will answer thee, and I will shew thee great and hidden things, which thou knowest not.";
web[3] = "Call to me, and I will answer thee, and show thee great and mighty things, which thou knowest not.";
hnv[3] = "Call to me, and I will answer you, and will show you great things, and difficult, which you don\'t know.";
vul[3] = "clama ad me et exaudiam te et adnuntiabo tibi grandia et firma quae nescis";
kjv[4] = "For thus saith the LORD, the God of Israel, concerning the houses of this city, and concerning the houses of the kings of Judah, which are thrown down by the mounts, and by the sword;";
rsv[4] = "For thus says the LORD, the God of Israel, concerning the houses of this city and the houses of the kings of Judah which were torn down to make a defense against the siege mounds and before the sword:";
asv[4] = "For thus saith Jehovah, the God of Israel, concerning the houses of this city, and concerning the houses of the kings of Judah, which are broken down [to make a defence] against the mounds and against the sword;";
yng[4] = "For thus said Jehovah, God of Israel, concerning the houses of this city, and concerning the houses of the kings of Judah, that are broken down for the mounts, and for the tool;";
dby[4] = "For thus saith Jehovah the God of Israel concerning the houses of this city, and concerning the houses of the kings of Judah, which are thrown down because of the mounds and because of the sword:";
web[4] = "For thus saith the LORD, the God of Israel, concerning the houses of this city, and concerning the houses of the kings of Judah, which are thrown down by the mounts, and by the sword;";
hnv[4] = "For thus says the LORD, the God of Yisra\'el, concerning the houses of this city, and concerning the houses of the kings of Yehudah, which are broken down [to make a defense] against the mounds and against the sword;";
vul[4] = "quia haec dicit Dominus Deus Israhel ad domos urbis huius et ad domos regis Iuda quae destructae sunt et ad munitiones et gladium";
kjv[5] = "They come to fight with the Chaldeans, but [it is] to fill them with the dead bodies of men, whom I have slain in mine anger and in my fury, and for all whose wickedness I have hid my face from this city.";
rsv[5] = "The Chalde\'ans are coming in to fight and to fill them with the dead bodies of men whom I shall smite in my anger and my wrath, for I have hidden my face from this city because of all their wickedness.";
asv[5] = "while [men] come to fight with the Chaldeans, and to fill them with the dead bodies of men, whom I have slain in mine anger and in my wrath, and for all whose wickedness I have hid my face from this city:";
yng[5] = "they are coming in to fight with the Chaldeans, and to fill them with the carcases of men, whom I have smitten in Mine anger, and in My fury, and [for] whom I have hidden My face from this city, because of all their evil:";
dby[5] = "They come to fight with the Chaldeans, but to fill them with the dead bodies of the men whom I have slain in mine anger and in my fury, and for all whose wickedness I have hid my face from this city.";
web[5] = "They come to fight with the Chaldeans, but [it is] to fill them with the dead bodies of men, whom I have slain in my anger and in my fury, and for all whose wickedness I have hid my face from this city.";
hnv[5] = "while [men] come to fight with the Kasdim, and to fill them with the dead bodies of men, whom I have killed in my anger and in my wrath, and for all whose wickedness I have hid my face from this city:";
vul[5] = "venientium ut dimicent cum Chaldeis et impleant eas cadaveribus hominum quas percussi in furore meo et in indignatione mea abscondens faciem meam a civitate hac propter omnem malitiam eorum";
kjv[6] = "Behold, I will bring it health and cure, and I will cure them, and will reveal unto them the abundance of peace and truth.";
rsv[6] = "Behold, I will bring to it health and healing, and I will heal them and reveal to them abundance of prosperity and security.";
asv[6] = "Behold, I will bring it health and cure, and I will cure them; and I will reveal unto them abundance of peace and truth.";
yng[6] = "Lo, I am increasing to it health and cure, And have healed them, and revealed to them The abundance of peace and truth.";
dby[6] = "Behold, I will apply a healing dressing to it and cure, and I will heal them, and will reveal unto them an abundance of peace and truth.";
web[6] = "Behold, I will bring it health and cure, and I will cure them, and will reveal to them the abundance of peace and truth.";
hnv[6] = "Behold, I will bring it health and cure, and I will cure them; and I will reveal to them abundance of shalom and truth.";
vul[6] = "ecce ego obducam ei cicatricem et sanitatem et curabo eos et revelabo illis deprecationem pacis et veritatis";
kjv[7] = "And I will cause the captivity of Judah and the captivity of Israel to return, and will build them, as at the first.";
rsv[7] = "I will restore the fortunes of Judah and the fortunes of Israel, and rebuild them as they were at first.";
asv[7] = "And I will cause the captivity of Judah and the captivity of Israel to return, and will build them, as at the first.";
yng[7] = "And I have turned back the captivity of Judah, And the captivity of Israel, And I have built them as at the first,";
dby[7] = "And I will turn the captivity of Judah and the captivity of Israel, and will build them, as at the beginning.";
web[7] = "And I will cause the captivity of Judah and the captivity of Israel to return, and will build them, as at the first.";
hnv[7] = "I will cause the captivity of Yehudah and the captivity of Yisra\'el to return, and will build them, as at the first.";
vul[7] = "et convertam conversionem Iuda et conversionem Hierusalem et aedificabo eos sicut a principio";
kjv[8] = "And I will cleanse them from all their iniquity, whereby they have sinned against me; and I will pardon all their iniquities, whereby they have sinned, and whereby they have transgressed against me.";
rsv[8] = "I will cleanse them from all the guilt of their sin against me, and I will forgive all the guilt of their sin and rebellion against me.";
asv[8] = "And I will cleanse them from all their iniquity, whereby they have sinned against me; and I will pardon all their iniquities, whereby they have sinned against me, and whereby they have transgressed against me.";
yng[8] = "And cleansed them from all their iniquity, That they have sinned against Me, And I have pardoned all their iniquities, That they have sinned against Me, And that they transgressed against Me.";
dby[8] = "And I will cleanse them from all their iniquity, whereby they have sinned against me, and I will pardon all their iniquities, whereby they have sinned against me, and whereby they have transgressed against me.";
web[8] = "And I will cleanse them from all their iniquity, by which they have sinned against me; and I will pardon all their iniquities, by which they have sinned, and by which they have transgressed against me.";
hnv[8] = "I will cleanse them from all their iniquity, by which they have sinned against me; and I will pardon all their iniquities, by which they have sinned against me, and by which they have transgressed against me.";
vul[8] = "et emundabo illos ab omni iniquitate sua in qua peccaverunt mihi et propitius ero cunctis iniquitatibus eorum in quibus deliquerunt mihi et spreverunt me";
kjv[9] = "And it shall be to me a name of joy, a praise and an honour before all the nations of the earth, which shall hear all the good that I do unto them: and they shall fear and tremble for all the goodness and for all the prosperity that I procure unto it.";
rsv[9] = "And this city shall be to me a name of joy, a praise and a glory before all the nations of the earth who shall hear of all the good that I do for them; they shall fear and tremble because of all the good and all the prosperity I provide for it.";
asv[9] = "And [this city] shall be to me for a name of joy, for a praise and for a glory, before all the nations of the earth, which shall hear all the good that I do unto them, and shall fear and tremble for all the good and for all the peace that I procure unto it.";
yng[9] = "And it hath been to Me for a name of joy, For praise, and for beauty, to all nations of the earth, Who hear of all the good that I am doing them, And they have feared, And they have trembled for all the good, And for all the peace, that I am doing to it.";
dby[9] = "And it shall be to me a name of joy, a praise and a glory before all the nations of the earth, which shall hear of all the good that I do unto them; and they shall fear and tremble for all the good and for all the prosperity that I procure unto it.";
web[9] = "And it shall be to me a name of joy, a praise, and an honor before all the nations of the earth, which shall hear all the good that I do to them: and they shall fear and tremble for all the goodness and for all the prosperity that I procure to it.";
hnv[9] = "[This city] shall be to me for a name of joy, for a praise and for a glory, before all the nations of the eretz, which shall hear all the good that I do to them, and shall fear and tremble for all the good and for all the shalom that I procure to it.";
vul[9] = "et erit mihi in nomen et in gaudium et in laudem et in exultationem cunctis gentibus terrae quae audierint omnia bona quae ego facturus sum eis et pavebunt et turbabuntur in universis bonis et in omni pace quam ego faciam ei";
kjv[10] = "Thus saith the LORD; Again there shall be heard in this place, which ye say [shall be] desolate without man and without beast, [even] in the cities of Judah, and in the streets of Jerusalem, that are desolate, without man, and without inhabitant, and without beast,";
rsv[10] = "&quot;Thus says the LORD: In this place of which you say, \'It is a waste without man or beast,\' in the cities of Judah and the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall be heard again";
asv[10] = "Thus saith Jehovah: Yet again there shall be heard in this place, whereof ye say, It is waste, without man and without beast, even in the cities of Judah, and in the streets of Jerusalem, that are desolate, without man and without inhabitant and without beast,";
yng[10] = "Thus said Jehovah: Again heard in this place of which ye are saying, Waste it [is], without man and without beast, In cities of Judah, and in streets of Jerusalem, That are desolated, without man, And without inhabitant, and without beast,";
dby[10] = "Thus saith Jehovah: In this place of which ye say, It is waste, without man and without beast! in the cities of Judah and in the streets of Jerusalem that are desolate, without man, and without inhabitant, and without beast,";
web[10] = "Thus saith the LORD; Again there shall be heard in this place, which ye say [shall be] desolate without man and without beast, [even] in the cities of Judah, and in the streets of Jerusalem, that are desolate, without man, and without inhabitant, and without beast,";
hnv[10] = " Thus says the LORD: Yet again there shall be heard in this place, whereof you say, It is waste, without man and without animal, even in the cities of Yehudah, and in the streets of Yerushalayim, that are desolate, without man and without inhabitant and without animal,";
vul[10] = "haec dicit Dominus adhuc audietur in loco isto quem vos dicitis esse desertum eo quod non sit homo et iumentum in civitatibus Iuda et foris Hierusalem quae desolatae sunt absque homine et absque habitatore et absque pecore";
kjv[11] = "The voice of joy, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the voice of them that shall say, Praise the LORD of hosts: for the LORD [is] good; for his mercy [endureth] for ever: [and] of them that shall bring the sacrifice of praise into the house of the LORD. For I will cause to return the captivity of the land, as at the first, saith the LORD.";
rsv[11] = "the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride, the voices of those who sing, as they bring thank offerings to the house of the LORD: \'Give thanks to the LORD of hosts, for the LORD is good, for his steadfast love endures for ever!\' For I will restore the fortunes of the land as at first, says the LORD.";
asv[11] = "the voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride, the voice of them that say, Give thanks to Jehovah of hosts, for Jehovah is good, for his lovingkindness [endureth] for ever; [and of them] that bring [sacrifices of] thanksgiving into the house of Jehovah. For I will cause the captivity of the land to return as at the first, saith Jehovah.";
yng[11] = "Is a voice of joy and a voice of gladness, Voice of bridegroom, and voice of bride, The voice of those saying, Thank Jehovah of Hosts, for Jehovah [is] good, For His kindness [is] to the age, Who are bringing in thanksgiving to the house of Jehovah, For I turn back the captivity of the land, As at the first, said Jehovah.";
dby[11] = "there shall again be heard the voice of mirth and the voice of joy, the voice of the bridegroom and the voice of the bride, the voice of them that say, Give ye thanks unto Jehovah of hosts; for Jehovah is good, for his loving-kindness [endureth] for ever, -- of them that bring thanksgiving unto the house of Jehovah. For I will turn the captivity of the land as in the beginning, saith Jehovah.";
web[11] = "The voice of joy, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the voice of them that shall say, Praise the LORD of hosts: for the LORD [is] good; for his mercy [endureth] for ever: [and] of them that shall bring the sacrifice of praise into the house of the LORD. For I will cause to return the captivity of the land, as at the first, saith the LORD.";
hnv[11] = "the voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride, the voice of those who say, Give thanks to the LORD of Hosts, for the LORD is good, for his lovingkindness endures forever; [and of them] who bring [sacrifices of] thanksgiving into the house of the LORD. For I will cause the captivity of the land to return as at the first, says the LORD.";
vul[11] = "vox gaudii et vox laetitiae vox sponsi et vox sponsae vox dicentium confitemini Domino exercituum quoniam bonus Dominus quoniam in aeternum misericordia eius et portantium vota in domum Domini reducam enim conversionem terrae sicut a principio dicit Dominus";
kjv[12] = "Thus saith the LORD of hosts; Again in this place, which is desolate without man and without beast, and in all the cities thereof, shall be an habitation of shepherds causing [their] flocks to lie down.";
rsv[12] = "&quot;Thus says the LORD of hosts: In this place which is waste, without man or beast, and in all of its cities, there shall again be habitations of shepherds resting their flocks.";
asv[12] = "Thus saith Jehovah of hosts: Yet again shall there be in this place, which is waste, without man and without beast, and in all the cities thereof, a habitation of shepherds causing their flocks to lie down.";
yng[12] = "Thus said Jehovah of Hosts: Again there is in this place -- that is waste, Without man and beast, And in all its cities -- a habitation of shepherds, Causing the flock to lie down.";
dby[12] = "Thus saith Jehovah of hosts: In this place which is waste, without man and without beast, and in all the cities thereof, there shall again be a habitation of shepherds causing [their] flocks to lie down.";
web[12] = "Thus saith the LORD of hosts; Again in this place, which is desolate without man and without beast, and in all its cities, shall be a habitation of shepherds causing [their] flocks to lie down.";
hnv[12] = "Thus says the LORD of Hosts: Yet again shall there be in this place, which is waste, without man and without animal, and in all the cities of it, a habitation of shepherds causing their flocks to lie down.";
vul[12] = "haec dicit Dominus exercituum adhuc erit in loco isto deserto absque homine et absque iumento et in cunctis civitatibus eius habitaculum pastorum accubantium gregum";
kjv[13] = "In the cities of the mountains, in the cities of the vale, and in the cities of the south, and in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, shall the flocks pass again under the hands of him that telleth [them], saith the LORD.";
rsv[13] = "In the cities of the hill country, in the cities of the Shephe\'lah, and in the cities of the Negeb, in the land of Benjamin, the places about Jerusalem, and in the cities of Judah, flocks shall again pass under the hands of the one who counts them, says the LORD.";
asv[13] = "In the cities of the hill-country, in the cities of the lowland, and in the cities of the South, and in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, shall the flocks again pass under the hands of him that numbereth them, saith Jehovah.";
yng[13] = "In the cities of the hill-country, In the cities of the low country, And in the cities of the south, And in the land of Benjamin, And in the suburbs of Jerusalem, And in the cities of Judah, Again doth the flock pass by under the hands of the numberer, said Jehovah.";
dby[13] = "In the cities of the hill-country, in the cities of the lowland, and in the cities of the south, and in the land of Benjamin, and in the environs of Jerusalem, and in the cities of Judah, shall the flocks pass again under the hands of him that counteth [them], saith Jehovah.";
web[13] = "In the cities of the mountains, in the cities of the vale, and in the cities of the south, and in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, shall the flocks pass again under the hands of him that counteth [them], saith the LORD.";
hnv[13] = "In the cities of the hill-country, in the cities of the lowland, and in the cities of the South, and in the land of Binyamin, and in the places about Yerushalayim, and in the cities of Yehudah, shall the flocks again pass under the hands of him who numbers them, says the LORD.";
vul[13] = "in civitatibus montuosis et in civitatibus campestribus et in civitatibus quae ad austrum sunt et in terra Beniamin et in circuitu Hierusalem et in civitatibus Iuda adhuc transibunt greges ad manum numerantis ait Dominus";
kjv[14] = "Behold, the days come, saith the LORD, that I will perform that good thing which I have promised unto the house of Israel and to the house of Judah.";
rsv[14] = "&quot;Behold, the days are coming, says the LORD, when I will fulfil the promise I made to the house of Israel and the house of Judah.";
asv[14] = "Behold, the days come, saith Jehovah, that I will perform that good word which I have spoken concerning the house of Israel and concerning the house of Judah.";
yng[14] = "Lo, days are coming, an affirmation of Jehovah, And I have established the good word That I spake unto the house of Israel, And concerning the house of Judah.";
dby[14] = "Behold, the days come, saith Jehovah, that I will perform the good word which I have spoken unto the house of Israel and unto the house of Judah.";
web[14] = "Behold, the days come, saith the LORD, that I will perform that good thing which I have promised to the house of Israel and to the house of Judah.";
hnv[14] = "Behold, the days come, says the LORD, that I will perform that good word which I have spoken concerning the house of Yisra\'el and concerning the house of Yehudah.";
vul[14] = "ecce dies veniunt dicit Dominus et suscitabo verbum bonum quod locutus sum ad domum Israhel et ad domum Iuda";
kjv[15] = "In those days, and at that time, will I cause the Branch of righteousness to grow up unto David; and he shall execute judgment and righteousness in the land.";
rsv[15] = "In those days and at that time I will cause a righteous Branch to spring forth for David; and he shall execute justice and righteousness in the land.";
asv[15] = "In those days, and at that time, will I cause a Branch of righteousness to grow up unto David; and he shall execute justice and righteousness in the land.";
yng[15] = "In those days, and at that time, I cause to shoot up to David a shoot of righteousness, And he hath done judgment and righteousness in the earth.";
dby[15] = "In those days, and at that time, will I cause a Branch of righteousness to grow up unto David; and he shall execute judgment and righteousness in the land.";
web[15] = "In those days, and at that time, will I cause the branch of righteousness to grow up to David; and he shall execute judgment and righteousness in the land.";
hnv[15] = "In those days, and at that time, will I cause a Branch of righteousness to grow up to David; and he shall execute justice and righteousness in the land.";
vul[15] = "in diebus illis et in tempore illo germinare faciam David germen iustitiae et faciet iudicium et iustitiam in terra";
kjv[16] = "In those days shall Judah be saved, and Jerusalem shall dwell safely: and this [is the name] wherewith she shall be called, The LORD our righteousness.";
rsv[16] = "In those days Judah will be saved and Jerusalem will dwell securely. And this is the name by which it will be called: \'The LORD is our righteousness.\'";
asv[16] = "In those days shall Judah be saved, and Jerusalem shall dwell safely; and this is [the name] whereby she shall be called: Jehovah our righteousness.";
yng[16] = "In those days is Judah saved, And Jerusalem doth dwell confidently, And this [is] he whom Jehovah proclaimeth to her: `Our Righteousness.\'";
dby[16] = "In those days shall Judah be saved, and Jerusalem shall dwell in safety. And this is the name wherewith she shall be called: Jehovah our Righteousness.";
web[16] = "In those days shall Judah be saved, and Jerusalem shall dwell in safety: and this [is the name] by which she shall be called, JEHOVAH our righteousness.";
hnv[16] = "In those days shall Yehudah be saved, and Yerushalayim shall dwell safely; and this is [the name] by which she shall be called: the LORD our righteousness.";
vul[16] = "in diebus illis salvabitur Iuda et Hierusalem habitabit confidenter et hoc est quod vocabit eam Dominus iustus noster";
kjv[17] = "For thus saith the LORD; David shall never want a man to sit upon the throne of the house of Israel;";
rsv[17] = "&quot;For thus says the LORD: David shall never lack a man to sit on the throne of the house of Israel,";
asv[17] = "For thus saith Jehovah: David shall never want a man to sit upon the throne of the house of Israel;";
yng[17] = "For thus said Jehovah: `Not cut off to David is one sitting on the throne of the house of Israel,";
dby[17] = "For thus saith Jehovah: There shall never fail to David a man to sit upon the throne of the house of Israel;";
web[17] = "For thus saith the LORD; David shall never want a man to sit upon the throne of the house of Israel;";
hnv[17] = "For thus says the LORD: David shall never want a man to sit on the throne of the house of Yisra\'el;";
vul[17] = "quia haec dicit Dominus non interibit de David vir qui sedeat super thronum domus Israhel";
kjv[18] = "Neither shall the priests the Levites want a man before me to offer burnt offerings, and to kindle meat offerings, and to do sacrifice continually.";
rsv[18] = "and the Levitical priests shall never lack a man in my presence to offer burnt offerings, to burn cereal offerings, and to make sacrifices for ever.&quot;";
asv[18] = "neither shall the priests the Levites want a man before me to offer burnt-offerings, and to burn meal-offerings, and to do sacrifice continually.";
yng[18] = "And to the priests -- the Levites, Not cut off from before Me is one, Causing a burnt-offering to ascend, And perfuming a present, and making sacrifice -- all the days.\'";
dby[18] = "neither shall there fail to the priests the Levites a man before me to offer up burnt-offerings, and to burn oblations, and to do sacrifice continually.";
web[18] = "Neither shall the priests the Levites want a man before me to offer burnt-offerings, and to kindle meat-offerings, and to do sacrifice continually.";
hnv[18] = "neither shall the Kohanim the Levites want a man before me to offer burnt offerings, and to burn meal-offerings, and to do sacrifice continually.";
vul[18] = "et de sacerdotibus et Levitis non interibit vir a facie mea qui offerat holocaustomata et incendat sacrificium et caedat victimas cunctis diebus";

kjv[20] = "Thus saith the LORD; If ye can break my covenant of the day, and my covenant of the night, and that there should not be day and night in their season;";
rsv[20] = "&quot;Thus says the LORD: If you can break my covenant with the day and my covenant with the night, so that day and night will not come at their appointed time,";
asv[20] = "Thus saith Jehovah: If ye can break my covenant of the day, and my covenant of the night, so that there shall not be day and night in their season;";
yng[20] = "`Thus said Jehovah: If ye do break My covenant of the day, And My covenant of the night, So that they are not daily and nightly in their season,";
dby[20] = "Thus saith Jehovah: If ye can break my covenant [in respect] of the day, and my covenant [in respect] of the night, so that there should not be day and night in their season,";
web[20] = "Thus saith the LORD; If ye can break my covenant of the day, and my covenant of the night, so that there should not be day and night in their season;";
hnv[20] = "Thus says the LORD: If you can break my covenant of the day, and my covenant of the night, so that there shall not be day and night in their season;";
vul[20] = "haec dicit Dominus si irritum fieri potest pactum meum cum die et pactum meum cum nocte ut non sit dies et nox in tempore suo";
kjv[21] = "[Then] may also my covenant be broken with David my servant, that he should not have a son to reign upon his throne; and with the Levites the priests, my ministers.";
rsv[21] = "then also my covenant with David my servant may be broken, so that he shall not have a son to reign on his throne, and my covenant with the Levitical priests my ministers.";
asv[21] = "then may also my covenant be broken with David my servant, that he shall not have a son to reign upon his throne; and with the Levites the priests, my ministers.";
yng[21] = "Also My covenant is broken with David My servant, So that he hath not a son reigning on his throne, And with the Levites the priests, My ministers.";
dby[21] = "[then] shall also my covenant be broken with David my servant, that he should not have a son to reign upon his throne; and with the Levites, the priests, my ministers.";
web[21] = "[Then] also may my covenant be broken with David my servant, that he should not have a son to reign upon his throne; and with the Levites the priests, my ministers.";
hnv[21] = "then may also my covenant be broken with David my servant, that he shall not have a son to reign on his throne; and with the Levites the Kohanim, my ministers.";
vul[21] = "et pactum meum irritum esse poterit cum David servo meo ut non sit ex eo filius qui regnet in throno eius et Levitae et sacerdotes ministri mei";
kjv[22] = "As the host of heaven cannot be numbered, neither the sand of the sea measured: so will I multiply the seed of David my servant, and the Levites that minister unto me.";
rsv[22] = "As the host of heaven cannot be numbered and the sands of the sea cannot be measured, so I will multiply the descendants of David my servant, and the Levitical priests who minister to me.&quot;";
asv[22] = "As the host of heaven cannot be numbered, neither the sand of the sea measured; so will I multiply the seed of David my servant, and the Levites that minister unto me.";
yng[22] = "As the host of the heavens is not numbered, Nor the sand of the sea measured, So I multiply the seed of David My servant, And the Levites My ministers.\'";
dby[22] = "As the host of the heavens cannot be numbered, nor the sand of the sea measured, so will I multiply the seed of David my servant, and the Levites that minister unto me.";
web[22] = "As the host of heaven cannot be numbered, neither the sand of the sea measured: so will I multiply the seed of David my servant, and the Levites that minister to me.";
hnv[22] = "As the host of the sky can\'t be numbered, neither the sand of the sea measured; so will I multiply the seed of David my servant, and the Levites who minister to me.";
vul[22] = "sicuti numerari non possunt stellae caeli et metiri harena maris sic multiplicabo semen David servi mei et Levitas ministros meos";

kjv[24] = "Considerest thou not what this people have spoken, saying, The two families which the LORD hath chosen, he hath even cast them off? thus they have despised my people, that they should be no more a nation before them.";
rsv[24] = "&quot;Have you not observed what these people are saying, \'The LORD has rejected the two families which he chose\'? Thus they have despised my people so that they are no longer a nation in their sight.";
asv[24] = "Considerest thou not what this people have spoken, saying, The two families which Jehovah did choose, he hath cast them off? thus do they despise my people, that they should be no more a nation before them.";
yng[24] = "`Hast thou not considered what this people have spoken, saying: The two families on which Jehovah fixed, He doth reject them, And my people they despise -- So that they are no more a people before them!";
dby[24] = "Hast thou not seen what this people have spoken, saying, The two families that Jehovah had chosen, he hath even cast them off? And they despise my people, that they should be no more a nation before them.";
web[24] = "Considerest thou not what this people have spoken, saying, The two families which the LORD hath chosen, he hath even cast them off? thus they have despised my people, that they should be no more a nation before them.";
hnv[24] = "Don\'t you consider what this people has spoken, saying, The two families which the LORD did choose, he has cast them off? thus do they despise my people, that they should be no more a nation before them.";
vul[24] = "numquid non vidisti quid populus hic locutus sit dicens duae cognationes quas elegerat Dominus abiectae sunt et populum meum despexerunt eo quod non sit ultra gens coram eis";

yng[25] = "Thus said Jehovah: If My covenant [is] not daily and nightly, The statutes of heaven and earth I have not appointed --";

web[25] = "Thus saith the LORD; If my covenant [is] not with day and night, [and if] I have not appointed the ordinances of heaven and earth;";
hnv[25] = "Thus says the LORD: If my covenant of day and night fails, if I have not appointed the ordinances of heaven and eretz;";
vul[25] = "haec dicit Dominus si pactum meum inter diem et noctem et leges caelo et terrae non posui";
kjv[26] = "Then will I cast away the seed of Jacob, and David my servant, [so] that I will not take [any] of his seed [to be] rulers over the seed of Abraham, Isaac, and Jacob: for I will cause their captivity to return, and have mercy on them.";
rsv[26] = "then I will reject the descendants of Jacob and David my servant and will not choose one of his descendants to rule over the seed of Abraham, Isaac, and Jacob. For I will restore their fortunes, and will have mercy upon them.&quot;";
asv[26] = "then will I also cast away the seed of Jacob, and of David my servant, so that I will not take of his seed to be rulers over the seed of Abraham, Isaac, and Jacob: for I will cause their captivity to return, and will have mercy on them.";
yng[26] = "Also the seed of Jacob, and David My servant, I reject, Against taking from his seed rulers For the seed of Abraham, Isaac, and Jacob, For I turn back [to] their captivity, and have pitied them.\'";
dby[26] = "[then] will I also cast away the seed of Jacob, and of David my servant, so as not to take of his seed to be rulers over the seed of Abraham, Isaac, and Jacob: for I will turn their captivity, and will have mercy on them.";
web[26] = "Then will I cast away the seed of Jacob, and David my servant, [so] that I will not take [any] of his seed [to be] rulers over the seed of Abraham, Isaac, and Jacob; for I will cause their captivity to return, and have mercy on them.";
