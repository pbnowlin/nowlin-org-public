csb[1] = "In that same year, at the beginning of the reign of King Zedekiah of Judah, in the fifth month of the fourth year, the prophet Hananiah son of Azzur from Gibeon said to me in the temple of the LORD in the presence of the priests and all the people,";
csb[2] = "&quot;This is what the LORD of Armies, the God of Israel, says: \'I have broken the yoke of the king of Babylon.";
csb[3] = "&quot;Within two years I will restore to this place all the articles of the LORD\'s temple that King Nebuchadnezzar of Babylon took from here and transported to Babylon.";
csb[4] = "&quot;And I will restore to this place Jeconiah son of Jehoiakim, king of Judah, and all the exiles from Judah who went to Babylon\' -- this is the LORD\'s declaration -- \'for I will break the yoke of the king of Babylon.\' &quot;";
csb[5] = "The prophet Jeremiah replied to the prophet Hananiah in the presence of the priests and all the people who were standing in the temple of the LORD.";
csb[6] = "The prophet Jeremiah said, &quot;Amen! May the LORD do that. May the LORD make the words you have prophesied come true and may he restore the articles of the LORD\'s temple and all the exiles from Babylon to this place!";
csb[7] = "&quot;Only listen to this message I am speaking in your hearing and in the hearing of all the people.";
csb[8] = "&quot;The prophets who preceded you and me from ancient times prophesied war, disaster, and plague against many lands and great kingdoms.";
csb[9] = "&quot;As for the prophet who prophesies peace -- only when the word of the prophet comes true will the prophet be recognized as one the LORD has truly sent.&quot;";
csb[10] = "The prophet Hananiah then took the yoke bar from the neck of the prophet Jeremiah and broke it.";
csb[11] = "In the presence of all the people Hananiah proclaimed, &quot;This is what the LORD says: \'In this way, within two years I will break the yoke of King Nebuchadnezzar of Babylon from the neck of all the nations.\' &quot; The prophet Jeremiah then went on his way.";
csb[12] = "After the prophet Hananiah had broken the yoke bar from the neck of the prophet Jeremiah, the word of the LORD came to Jeremiah:";
csb[13] = "&quot;Go say to Hananiah, \'This is what the LORD says: You broke a wooden yoke bar, but in its place you will make an iron yoke bar.";
csb[14] = "&quot;For this is what the LORD of Armies, the God of Israel, says: I have put an iron yoke on the neck of all these nations that they might serve King Nebuchadnezzar of Babylon, and they will serve him. I have even put the wild animals under him.\' &quot;";
csb[15] = "The prophet Jeremiah said to the prophet Hananiah, &quot;Listen, Hananiah! The LORD did not send you, but you have led these people to trust in a lie.";
csb[16] = "&quot;Therefore, this is what the LORD says: \'I am about to send you off the face of the earth. You will die this year because you have preached rebellion against the LORD.\' &quot;";
csb[17] = "And the prophet Hananiah died that year in the seventh month.";
kjv[1] = "And it came to pass the same year, in the beginning of the reign of Zedekiah king of Judah, in the fourth year, [and] in the fifth month, [that] Hananiah the son of Azur the prophet, which [was] of Gibeon, spake unto me in the house of the LORD, in the presence of the priests and of all the people, saying,";

asv[1] = "And it came to pass the same year, in the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah the son of Azzur, the prophet, who was of Gibeon, spake unto me in the house of Jehovah, in the presence of the priests and of all the people, saying,";

hnv[1] = "It happened the same year, in the beginning of the reign of Tzidkiyahu king of Yehudah, in the fourth year, in the fifth month, that Hananyah the son of Azur, the prophet, who was of Giv`on, spoke to me in the house of the LORD, in the presence of the Kohanim and of all the people, saying,";

dby[3] = "Within two full years will I bring again into this place all the vessels of Jehovah\'s house, that Nebuchadnezzar king of Babylon took away from this place, and carried to Babylon;";

kjv[4] = "And I will bring again to this place Jeconiah the son of Jehoiakim king of Judah, with all the captives of Judah, that went into Babylon, saith the LORD: for I will break the yoke of the king of Babylon.";
rsv[4] = "I will also bring back to this place Jeconi\'ah the son of Jehoi\'akim, king of Judah, and all the exiles from Judah who went to Babylon, says the LORD, for I will break the yoke of the king of Babylon.&quot;";
asv[4] = "and I will bring again to this place Jeconiah the son of Jehoiakim, king of Judah, with all the captives of Judah, that went to Babylon, saith Jehovah; for I will break the yoke of the king of Babylon.";
yng[4] = "And Jeconiah son of Jehoiakim, king of Judah, and all the removed of Judah, who are entering Babylon, I am bringing back unto this place -- an affirmation of Jehovah; for I do break the yoke of the king of Babylon.\'";

kjv[6] = "Even the prophet Jeremiah said, Amen: the LORD do so: the LORD perform thy words which thou hast prophesied, to bring again the vessels of the LORD\'S house, and all that is carried away captive, from Babylon into this place.";
rsv[6] = "and the prophet Jeremiah said, &quot;Amen! May the LORD do so; may the LORD make the words which you have prophesied come true, and bring back to this place from Babylon the vessels of the house of the LORD, and all the exiles.";

yng[6] = "Yea, Jeremiah the prophet saith, `Amen! so may Jehovah do; Jehovah establish thy words that thou hast prophesied, to bring back the vessels of the house of Jehovah and all the removal from Babylon, unto this place.";

hnv[6] = "even the prophet Yirmeyahu said, Amein: the LORD do so; the LORD perform your words which you have prophesied, to bring again the vessels of the LORD\'s house, and all them of the captivity, from Bavel to this place.";

kjv[8] = "The prophets that have been before me and before thee of old prophesied both against many countries, and against great kingdoms, of war, and of evil, and of pestilence.";
rsv[8] = "The prophets who preceded you and me from ancient times prophesied war, famine, and pestilence against many countries and great kingdoms.";

yng[8] = "The prophets who have been before me, and before thee, from of old, even they prophesy concerning many lands, and concerning great kingdoms, of battle, and of evil, and of pestilence.";
dby[8] = "The prophets that have been before me and before thee of old, prophesied also concerning many countries and concerning great kingdoms, of war, and of evil, and of pestilence.";
web[8] = "The prophets that have been before me and before thee of old prophesied both against many countries, and against great kingdoms, of war, and of evil, and of pestilence.";
hnv[8] = "The prophets who have been before me and before you of old prophesied against many countries, and against great kingdoms, of war, and of evil, and of pestilence.";

kjv[9] = "The prophet which prophesieth of peace, when the word of the prophet shall come to pass, [then] shall the prophet be known, that the LORD hath truly sent him.";
rsv[9] = "As for the prophet who prophesies peace, when the word of that prophet comes to pass, then it will be known that the LORD has truly sent the prophet.&quot;";
asv[9] = "The prophet that prophesieth of peace, when the word of the prophet shall come to pass, then shall the prophet be known, that Jehovah hath truly sent him.";
yng[9] = "The prophet who doth prophesy of peace -- by the coming in of the word of the prophet, known is the prophet that Jehovah hath truly sent him.\'";
dby[9] = "The prophet that prophesieth of peace, when the word of the prophet shall come to pass, shall be known as the prophet whom Jehovah hath really sent.";
web[9] = "The prophet who prophesieth of peace, when the word of the prophet shall come to pass, [then] shall the prophet be known, that the LORD hath truly sent him.";

kjv[11] = "And Hananiah spake in the presence of all the people, saying, Thus saith the LORD; Even so will I break the yoke of Nebuchadnezzar king of Babylon from the neck of all nations within the space of two full years. And the prophet Jeremiah went his way.";
rsv[11] = "And Hanani\'ah spoke in the presence of all the people, saying, &quot;Thus says the LORD: Even so will I break the yoke of Nebuchadnez\'zar king of Babylon from the neck of all the nations within two years.&quot; But Jeremiah the prophet went his way.";
asv[11] = "And Hananiah spake in the presence of all the people, saying, Thus saith Jehovah: Even so will I break the yoke of Nebuchadnezzar king of Babylon within two full years from off the neck of all the nations. And the prophet Jeremiah went his way.";
yng[11] = "And Hananiah speaketh before the eyes of all the people, saying, `Thus said Jehovah, Thus I break the yoke of Nebuchadnezzar king of Babylon, within two years of days, from off the neck of all the nations;\' and Jeremiah the prophet goeth on his way.";
dby[11] = "And Hananiah spoke in the presence of all the people, saying, Thus saith Jehovah: So will I break the yoke of Nebuchadnezzar the king of Babylon within two full years from off the neck of all the nations. And the prophet Jeremiah went his way.";
web[11] = "And Hananiah spoke in the presence of all the people, saying, Thus saith the LORD; Even so will I break the yoke of Nebuchadnezzar king of Babylon from the neck of all nations within the space of two full years. And the prophet Jeremiah went his way.";
hnv[11] = "Hananyah spoke in the presence of all the people, saying, Thus says the LORD: Even so will I break the yoke of Nevukhadnetztzar king of Bavel within two full years from off the neck of all the nations. The prophet Yirmeyahu went his way.";

asv[13] = "Go, and tell Hananiah, saying, Thus saith Jehovah: Thou hast broken the bars of wood; but thou hast made in their stead bars of iron.";
yng[13] = "`Go, and thou hast spoken unto Hananiah, saying, Thus said Jehovah, Yokes of wood thou hast broken, and I have made instead of them yokes of iron;";
dby[13] = "Go and tell Hananiah, saying, Thus saith Jehovah: Thou hast broken the yokes of wood, and thou hast made in their place yokes of iron.";

kjv[14] = "For thus saith the LORD of hosts, the God of Israel; I have put a yoke of iron upon the neck of all these nations, that they may serve Nebuchadnezzar king of Babylon; and they shall serve him: and I have given him the beasts of the field also.";
rsv[14] = "For thus says the LORD of hosts, the God of Israel: I have put upon the neck of all these nations an iron yoke of servitude to Nebuchadnez\'zar king of Babylon, and they shall serve him, for I have given to him even the beasts of the field.\'&quot;";
asv[14] = "For thus saith Jehovah of hosts, the God of Israel: I have put a yoke of iron upon the neck of all these nations, that they may serve Nebuchadnezzar king of Babylon; and they shall serve him: and I have given him the beasts of the field also.";
yng[14] = "For thus said Jehovah of Hosts, God of Israel, A yoke of iron I have put on the neck of all these nations to serve Nebuchadnezzar king of Babylon, and they have served him, and also the beast of the field I have given to him.\'";
dby[14] = "For thus saith Jehovah of hosts, the God of Israel: I have put a yoke of iron upon the neck of all these nations, that they may serve Nebuchadnezzar king of Babylon; and they shall serve him: and I have given him the beasts of the field also.";
web[14] = "For thus saith the LORD of hosts, the God of Israel; I have put a yoke of iron upon the neck of all these nations, that they may serve Nebuchadnezzar king of Babylon; and they shall serve him: and I have given him the beasts of the field also.";

kjv[16] = "Therefore thus saith the LORD; Behold, I will cast thee from off the face of the earth: this year thou shalt die, because thou hast taught rebellion against the LORD.";
rsv[16] = "Therefore thus says the LORD: \'Behold, I will remove you from the face of the earth. This very year you shall die, because you have uttered rebellion against the LORD.\'&quot;";
asv[16] = "Therefore thus saith Jehovah, Behold, I will send thee away from off the face of the earth: this year thou shalt die, because thou hast spoken rebellion against Jehovah.";
yng[16] = "Therefore thus said Jehovah, Lo, I am casting thee from off the face of the ground; this year thou diest, for apostacy thou hast spoken concerning Jehovah.\'";
dby[16] = "Therefore thus saith Jehovah: Behold, I will cast thee from off the face of the earth: this year thou shalt die, for thou hast spoken revolt against Jehovah.";

hnv[16] = "Therefore thus says the LORD, Behold, I will send you away from off the surface of the eretz: this year you shall die, because you have spoken rebellion against the LORD.";
vul[16] = "idcirco haec dicit Dominus ecce emittam te a facie terrae hoc anno morieris adversum Dominum enim locutus es";
