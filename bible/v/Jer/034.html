csb[1] = "This is the word that came to Jeremiah from the LORD when King Nebuchadnezzar of Babylon, his whole army, all the kingdoms of the lands under his control, and all other peoples were fighting against Jerusalem and all its surrounding cities:";
csb[2] = "&quot;This is what the LORD, the God of Israel, says: Go, speak to King Zedekiah of Judah, and tell him, \'This is what the LORD says: I am about to hand this city over to the king of Babylon, and he will burn it.";
csb[3] = "&quot;As for you, you will not escape from him but are certain to be captured and handed over to him. You will meet the king of Babylon eye to eye and speak face to face; you will go to Babylon.";
csb[4] = "&quot; \'Yet hear the LORD\'s word, King Zedekiah of Judah. This is what the LORD says concerning you: You will not die by the sword;";
csb[5] = "&quot;you will die peacefully. There will be a burning ceremony for you just like the burning ceremonies for your ancestors, the kings of old who came before you. &quot;Oh, master! &quot; will be the lament for you, for I have spoken this word. This is the LORD\'s declaration.\' &quot;";
csb[6] = "So the prophet Jeremiah related all these words to King Zedekiah of Judah in Jerusalem";
csb[7] = "while the king of Babylon\'s army was attacking Jerusalem and all of Judah\'s remaining cities -- that is, Lachish and Azekah, for they were the only ones left of Judah\'s fortified cities.";
csb[8] = "This is the word that came to Jeremiah from the LORD after King Zedekiah made a covenant with all the people who were in Jerusalem to proclaim freedom to them.";
csb[9] = "As a result, each was to let his male and female Hebrew slaves go free, and no one was to enslave his fellow Judean.";
csb[10] = "All the officials and people who entered into covenant to let their male and female slaves go free -- in order not to enslave them any longer -- obeyed and let them go free.";
csb[11] = "Afterward, however, they changed their minds and took back their male and female slaves they had let go free and forced them to become slaves again.";
csb[12] = "Then the word of the LORD came to Jeremiah from the LORD:";
csb[13] = "&quot;This is what the LORD, the God of Israel, says: I made a covenant with your ancestors when I brought them out of the land of Egypt, out of the place of slavery, saying,";
csb[14] = "&quot;\'At the end of seven years, each of you must let his fellow Hebrew who sold himself to you go. He may serve you six years, but then you must let him go free from your service.\' But your ancestors did not obey me or pay any attention.";
csb[15] = "&quot;Today you repented and did what pleased me, each of you proclaiming freedom for his neighbor. You made a covenant before me at the house that bears my name.";
csb[16] = "&quot;But you have changed your minds and profaned my name. Each has taken back his male and female slaves who had been let go free to go wherever they wanted, and you have again forced them to be your slaves.";
csb[17] = "&quot;Therefore, this is what the LORD says: You have not obeyed me by proclaiming freedom, each for his fellow Hebrew and for his neighbor. I hereby proclaim freedom for you -- this is the LORD\'s declaration -- to the sword, to plague, and to famine! I will make you a horror to all the earth\'s kingdoms.";
csb[18] = "&quot;As for those who disobeyed my covenant, not keeping the terms of the covenant they made before me, I will treat them like the calf they cut in two in order to pass between its pieces.";
csb[19] = "&quot;The officials of Judah and Jerusalem, the court officials, the priests, and all the people of the land who passed between the pieces of the calf --";
csb[20] = "&quot;all these I will hand over to their enemies, to those who intend to take their life. Their corpses will become food for the birds of the sky and for the wild animals of the land.";
csb[21] = "&quot;I will hand King Zedekiah of Judah and his officials over to their enemies, to those who intend to take their lives, to the king of Babylon\'s army that is withdrawing.";
csb[22] = "&quot;I am about to give the command -- this is the LORD\'s declaration -- and I will bring them back to this city. They will fight against it, capture it, and burn it. I will make Judah\'s cities a desolation, without inhabitant.&quot;";
kjv[1] = "The word which came unto Jeremiah from the LORD, when Nebuchadnezzar king of Babylon, and all his army, and all the kingdoms of the earth of his dominion, and all the people, fought against Jerusalem, and against all the cities thereof, saying,";

yng[1] = "The word that hath been unto Jeremiah from Jehovah -- and Nebuchadnezzar king of Babylon, and all his force, and all kingdoms of the land of the dominion of his hand, and all the peoples are fighting against Jerusalem, and against all its cities -- saying:";
dby[1] = "The word that came to Jeremiah from Jehovah, when Nebuchadnezzar king of Babylon, and all his army, and all the kingdoms of the earth under his dominion, and all the peoples, fought against Jerusalem and against all the cities thereof, saying,";
web[1] = "The word which came to Jeremiah from the LORD, when Nebuchadnezzar king of Babylon, and all his army, and all the kingdoms of the earth of his dominion, and all the people fought against Jerusalem, and against all its cities, saying,";
hnv[1] = "The word which came to Yirmeyahu from the LORD, when Nevukhadnetztzar king of Bavel, and all his army, and all the kingdoms of the eretz that were under his dominion, and all the peoples, were fighting against Yerushalayim, and against all the cities of it, saying:";
vul[1] = "verbum quod factum est ad Hieremiam a Domino quando Nabuchodonosor rex Babylonis et omnis exercitus eius universaque regna terrae quae erant sub potestate manus eius et omnes populi bellabant contra Hierusalem et contra omnes urbes eius dicens";
kjv[2] = "Thus saith the LORD, the God of Israel; Go and speak to Zedekiah king of Judah, and tell him, Thus saith the LORD; Behold, I will give this city into the hand of the king of Babylon, and he shall burn it with fire:";
rsv[2] = "&quot;Thus says the LORD, the God of Israel: Go and speak to Zedeki\'ah king of Judah and say to him, \'Thus says the LORD: Behold, I am giving this city into the hand of the king of Babylon, and he shall burn it with fire.";
asv[2] = "Thus saith Jehovah, the God of Israel, Go, and speak to Zedekiah king of Judah, and tell him, Thus saith Jehovah, Behold, I will give this city into the hand of the king of Babylon, and he shall burn it with fire:";
yng[2] = "`Thus said Jehovah, God of Israel: Go, and thou hast spoken unto Zedekiah king of Judah, and hast said unto him, Thus said Jehovah: Lo, I am giving this city into the hand of the king of Babylon, and he hath burned it with fire,";
dby[2] = "Thus saith Jehovah, the God of Israel: Go and speak to Zedekiah king of Judah, and tell him, Thus saith Jehovah: Behold, I give this city into the hand of the king of Babylon, and he shall burn it with fire.";
web[2] = "Thus saith the LORD, the God of Israel; Go and speak to Zedekiah king of Judah, and tell him, Thus saith the LORD; Behold, I will give this city into the hand of the king of Babylon, and he shall burn it with fire:";
hnv[2] = "Thus says the LORD, the God of Yisra\'el, Go, and speak to Tzidkiyahu king of Yehudah, and tell him, Thus says the LORD, Behold, I will give this city into the hand of the king of Bavel, and he shall burn it with fire:";
vul[2] = "haec dicit Dominus Deus Israhel vade et loquere ad Sedeciam regem Iuda et dices ad eum haec dicit Dominus ecce ego tradam civitatem hanc in manu regis Babylonis et succendet eam igni";
kjv[3] = "And thou shalt not escape out of his hand, but shalt surely be taken, and delivered into his hand; and thine eyes shall behold the eyes of the king of Babylon, and he shall speak with thee mouth to mouth, and thou shalt go to Babylon.";
rsv[3] = "You shall not escape from his hand, but shall surely be captured and delivered into his hand; you shall see the king of Babylon eye to eye and speak with him face to face; and you shall go to Babylon.\'";
asv[3] = "and thou shalt not escape out of his hand, but shalt surely be taken, and delivered into his hand; and thine eyes shall behold the eyes of the king of Babylon, and he shall speak with thee mouth to mouth, and thou shalt go to Babylon.";
yng[3] = "and thou, thou dost not escape out of his hand, for thou art certainly caught, and into his hand thou art given, and thine eyes see the eyes of the king of Babylon, and his mouth with thy mouth speaketh, and Babylon thou enterest.";
dby[3] = "And thou shalt not escape out of his hand, but shalt certainly be taken, and given into his hand; and thine eyes shall behold the eyes of the king of Babylon, and his mouth shall speak with thy mouth, and thou shalt go to Babylon.";
web[3] = "And thou shalt not escape from his hand, but shalt surely be taken, and delivered into his hand; and thy eyes shall behold the eyes of the king of Babylon, and he shall speak with thee mouth to mouth, and thou shalt go to Babylon.";
hnv[3] = "and you shall not escape out of his hand, but shall surely be taken, and delivered into his hand; and your eyes shall see the eyes of the king of Bavel, and he shall speak with you mouth to mouth, and you shall go to Bavel.";
vul[3] = "et tu non effugies de manu eius sed conprehensione capieris et in manu eius traderis et oculi tui oculos regis Babylonis videbunt et os eius cum ore tuo loquetur et Babylonem introibis";

yng[4] = "`Only, hear a word of Jehovah, O Zedekiah king of Judah, Thus said Jehovah unto thee: Thou dost not die by sword,";
dby[4] = "Only, hear the word of Jehovah, O Zedekiah king of Judah. Thus saith Jehovah as to thee: Thou shalt not die by the sword;";
web[4] = "Yet hear the word of the LORD, O Zedekiah king of Judah; Thus saith the LORD concerning thee, Thou shalt not die by the sword:";

kjv[5] = "[But] thou shalt die in peace: and with the burnings of thy fathers, the former kings which were before thee, so shall they burn [odours] for thee; and they will lament thee, [saying], Ah lord! for I have pronounced the word, saith the LORD.";
rsv[5] = "You shall die in peace. And as spices were burned for your fathers, the former kings who were before you, so men shall burn spices for you and lament for you, saying, &quot;Alas, lord!&quot;\' For I have spoken the word, says the LORD.&quot;";
asv[5] = "thou shalt die in peace; and with the burnings of thy fathers, the former kings that were before thee, so shall they make a burning for thee; and they shall lament thee, [saying], Ah Lord! for I have spoken the word, saith Jehovah.";
yng[5] = "in peace thou diest, and with the burnings of thy fathers, the former kings who have been before thee, so they make a burning for thee; and Ah, lord, they lament for thee, for the word I have spoken -- an affirmation of Jehovah.\'";
dby[5] = "thou shalt die in peace, and with the burnings of thy fathers, the former kings that were before thee, so shall they burn for thee; and they will lament for thee, Ah, lord! for I have spoken the word, saith Jehovah.";

rsv[7] = "when the army of the king of Babylon was fighting against Jerusalem and against all the cities of Judah that were left, Lachish and Aze\'kah; for these were the only fortified cities of Judah that remained.";
asv[7] = "when the king of Babylon\'s army was fighting against Jerusalem, and against all the cities of Judah that were left, against Lachish and against Azekah; for these [alone] remained of the cities of Judah [as] fortified cities.";
yng[7] = "and the forces of the king of Babylon are fighting against Jerusalem, and against all the cities of Judah that are left -- against Lachish, and against Azekah, for these have been left among the cities of Judah, cities of fortresses.";
dby[7] = "And the king of Babylon\'s army fought against Jerusalem, and against all the cities of Judah that were left, against Lachish, and against Azekah; for these were amongst the cities of Judah, the fenced cities that were left.";

kjv[9] = "That every man should let his manservant, and every man his maidservant, [being] an Hebrew or an Hebrewess, go free; that none should serve himself of them, [to wit], of a Jew his brother.";
rsv[9] = "that every one should set free his Hebrew slaves, male and female, so that no one should enslave a Jew, his brother.";
asv[9] = "that every man should let his man-servant, and every man his maid-servant, that is a Hebrew or a Hebrewess, go free; that none should make bondmen of them, [to wit], of a Jew his brother.";
yng[9] = "to send out each his man-servant, and each his maid-servant -- the Hebrew and the Hebrewess -- free, so as not to lay service on them, any on a Jew his brother;";
dby[9] = "that every man should let his bondman, and every man his bondmaid, the Hebrew and the Hebrewess, go free, that none should exact service of them, [that is,] of a Jew his brother.";
web[9] = "That every man should liberate his man-servant, and every man his maid-servant, [being] a Hebrew or a Hebrewess; that none should retain them in service, [to wit], a Jew his brother.";
hnv[9] = "that every man should let his man-servant, and every man his maid-servant, who is a Hebrew or a Hebrewess, go free; that none should make bondservants of them, [to wit], of a Yehudi his brother.";
vul[9] = "ut dimitteret unusquisque servum suum et unusquisque ancillam suam hebraeum et hebraeam liberos et nequaquam dominarentur eis id est in Iudaeo et fratre suo";
kjv[10] = "Now when all the princes, and all the people, which had entered into the covenant, heard that every one should let his manservant, and every one his maidservant, go free, that none should serve themselves of them any more, then they obeyed, and let [them] go.";
rsv[10] = "And they obeyed, all the princes and all the people who had entered into the covenant that every one would set free his slave, male or female, so that they would not be enslaved again; they obeyed and set them free.";
asv[10] = "And all the princes and all the people obeyed, that had entered into the covenant, that every one should let his man-servant, and every one his maid-servant, go free, that none should make bondmen of them any more; they obeyed, and let them go:";
yng[10] = "and hearken do all the heads, and all the people who have come in to the covenant to send forth each his man-servant and each his maid-servant free, so as not to lay service on them any more, yea, they hearken, and send them away;";
dby[10] = "And all the princes and all the people that had entered into the covenant obeyed, every man letting his bondman and every man his bondmaid go free, that none should exact service of them any more: they obeyed, and let [them] go.";
web[10] = "Now when all the princes, and all the people who had entered into the covenant, heard that every one should liberate his man-servant, and every one his maid-servant, that none should retain them in service any more, then they obeyed, and let [them] go.";
hnv[10] = "All the princes and all the people obeyed, who had entered into the covenant, that everyone should let his man-servant, and everyone his maid-servant, go free, that none should make bondservants of them any more; they obeyed, and let them go:";
vul[10] = "audierunt ergo omnes principes et universus populus qui inierant pactum ut dimitteret unusquisque servum suum et unusquisque ancillam suam liberos et ultra non dominarentur in eis audierunt igitur et dimiserunt";
kjv[11] = "But afterward they turned, and caused the servants and the handmaids, whom they had let go free, to return, and brought them into subjection for servants and for handmaids.";
rsv[11] = "But afterward they turned around and took back the male and female slaves they had set free, and brought them into subjection as slaves.";
asv[11] = "but afterwards they turned, and caused the servants and the handmaids, whom they had let go free, to return, and brought them into subjection for servants and for handmaids.";
yng[11] = "and they turn afterwards, and cause the men-servants and the maid-servants to return, whom they had sent forth free, and they subdue them for men-servants and for maid-servants.";
dby[11] = "But afterwards they turned, and caused the bondmen and the bondmaids whom they had let go free, to return, and brought them into subjection for bondmen and for bondmaids.";
web[11] = "But afterwards they turned, and caused the servants and the handmaids, whom they had liberated, to return, and brought them into subjection for servants and for handmaids.";
hnv[11] = "but afterwards they turned, and caused the servants and the handmaids, whom they had let go free, to return, and brought them into subjection for servants and for handmaids.";
vul[11] = "et conversi sunt deinceps et retraxerunt servos et ancillas suas quos dimiserant liberos et subiugaverunt in famulos et in famulas";

yng[12] = "And there is a word of Jehovah unto Jeremiah from Jehovah, saying:";

hnv[12] = " Therefore the word of the LORD came to Yirmeyahu from the LORD, saying,";
vul[12] = "et factum est verbum Domini ad Hieremiam a Domino dicens";

rsv[13] = "&quot;Thus says the LORD, the God of Israel: I made a covenant with your fathers when I brought them out of the land of Egypt, out of the house of bondage, saying,";
asv[13] = "Thus saith Jehovah, the God of Israel: I made a covenant with your fathers in the day that I brought them forth out of the land of Egypt, out of the house of bondage, saying,";
yng[13] = "`Thus said Jehovah, God of Israel, I -- I made a covenant with your fathers in the day of My bringing them forth from the land of Egypt, from a house of servants, saying,";
dby[13] = "Thus saith Jehovah the God of Israel: I made a covenant with your fathers in the day that I brought them forth out of the land of Egypt, out of the house of bondage, saying,";

vul[13] = "haec dicit Dominus Deus Israhel ego percussi foedus cum patribus vestris in die qua eduxi eos de terra Aegypti de domo servitutis dicens";
kjv[14] = "At the end of seven years let ye go every man his brother an Hebrew, which hath been sold unto thee; and when he hath served thee six years, thou shalt let him go free from thee: but your fathers hearkened not unto me, neither inclined their ear.";
rsv[14] = "\'At the end of six years each of you must set free the fellow Hebrew who has been sold to you and has served you six years; you must set him free from your service.\' But your fathers did not listen to me or incline their ears to me.";
asv[14] = "At the end of seven years ye shall let go every man his brother that is a Hebrew, that hath been sold unto thee, and hath served thee six years, thou shalt let him go free from thee: but your fathers hearkened not unto me, neither inclined their ear.";
yng[14] = "At the end of seven years ye do send forth each his brother, the Hebrew, who is sold to thee, and hath served thee six years, yea, thou hast sent him forth free from thee: and your fathers hearkened not unto Me, nor inclined their ear.";
dby[14] = "At the end of seven years ye shall let go every man his brother, a Hebrew, who hath sold himself unto thee; when he hath served thee six years, thou shalt let him go free from thee. But your fathers hearkened not unto me, neither inclined their ear.";
web[14] = "At the end of seven years dismiss ye every man his brother a Hebrew, who hath been sold to thee; and when he hath served thee six years, thou shalt let him go free from thee: but your fathers hearkened not to me, neither inclined their ear.";
hnv[14] = "At the end of seven years you shall let go every man his brother who is a Hebrew, who has been sold to you, and has served you six years, you shall let him go free from you: but your fathers didn\'t listen to me, neither inclined their ear.";
vul[14] = "cum conpleti fuerint septem anni dimittat unusquisque fratrem suum hebraeum qui venditus est ei et serviet tibi sex annis et dimittes eum a te liberum et non audierunt patres vestri me nec inclinaverunt aurem suam";
kjv[15] = "And ye were now turned, and had done right in my sight, in proclaiming liberty every man to his neighbour; and ye had made a covenant before me in the house which is called by my name:";
rsv[15] = "You recently repented and did what was right in my eyes by proclaiming liberty, each to his neighbor, and you made a covenant before me in the house which is called by my name;";
asv[15] = "And ye were now turned, and had done that which is right in mine eyes, in proclaiming liberty every man to his neighbor; and ye had made a covenant before me in the house which is called by my name:";
yng[15] = "`And ye turn back, ye to-day, and ye do that which is right in Mine eyes, to proclaim liberty each to his neighbour, and ye make a covenant before Me in the house over which My name is called.";
dby[15] = "And you, ye had this day turned, and had done right in my sight, in proclaiming liberty every man to his neighbour; and ye had made a covenant before me in the house which is called by my name:";
web[15] = "And ye had now turned, and had done right in my sight, in proclaiming liberty every man to his neighbor; and ye had made a covenant before me in the house which is called by my name:";
hnv[15] = "You were now turned, and had done that which is right in my eyes, in proclaiming liberty every man to his neighbor; and you had made a covenant before me in the house which is called by my name:";
vul[15] = "et conversi estis vos hodie et fecistis quod rectum est in oculis meis ut praedicaretis libertatem unusquisque ad amicum suum et inistis pactum in conspectu meo in domo in qua invocatum est nomen meum super eam";
kjv[16] = "But ye turned and polluted my name, and caused every man his servant, and every man his handmaid, whom ye had set at liberty at their pleasure, to return, and brought them into subjection, to be unto you for servants and for handmaids.";
rsv[16] = "but then you turned around and profaned my name when each of you took back his male and female slaves, whom you had set free according to their desire, and you brought them into subjection to be your slaves.";
asv[16] = "but ye turned and profaned my name, and caused every man his servant, and every man his handmaid, whom ye had let go free at their pleasure, to return; and ye brought them into subjection, to be unto you for servants and for handmaids.";
yng[16] = "And -- ye turn back, and pollute My name, and ye cause each his man-servant and each his maid-servant, whom he had sent forth free, (at their pleasure,) to return, and ye subdue them to be to you for men-servants and for maid-servants.";
dby[16] = "but ye have turned and profaned my name, and caused every man his bondman, and every man his bondmaid, whom ye had set at liberty at their pleasure, to return, and ye have brought them into subjection, to be unto you for bondmen and for bondmaids.";
web[16] = "But ye turned and profaned my name, and caused every man his servant, and every man his handmaid, whom he had set at liberty at their pleasure, to return, and brought them into subjection, to be to you for servants and for handmaids.";
hnv[16] = "but you turned and profaned my name, and caused every man his servant, and every man his handmaid, whom you had let go free at their pleasure, to return; and you brought them into subjection, to be to you for servants and for handmaids.";
vul[16] = "et reversi estis et commaculastis nomen meum et reduxistis unusquisque servum suum et unusquisque ancillam suam quos dimiseratis ut essent liberi et suae potestatis et subiugastis eos ut sint vobis servi et ancillae";
kjv[17] = "Therefore thus saith the LORD; Ye have not hearkened unto me, in proclaiming liberty, every one to his brother, and every man to his neighbour: behold, I proclaim a liberty for you, saith the LORD, to the sword, to the pestilence, and to the famine; and I will make you to be removed into all the kingdoms of the earth.";
rsv[17] = "Therefore, thus says the LORD: You have not obeyed me by proclaiming liberty, every one to his brother and to his neighbor; behold, I proclaim to you liberty to the sword, to pestilence, and to famine, says the LORD. I will make you a horror to all the kingdoms of the earth.";
asv[17] = "Therefore thus saith Jehovah: Ye have not hearkened unto me, to proclaim liberty, every man to his brother, and every man to his neighbor: behold, I proclaim unto you a liberty, saith Jehovah, to the sword, to the pestilence, and to the famine; and I will make you to be tossed to and fro among all the kingdoms of the earth.";
yng[17] = "`Therefore, thus said Jehovah: Ye have not hearkened unto Me to proclaim freedom, each to his brother, and each to his neighbour; lo, I am proclaiming to you liberty -- an affirmation of Jehovah -- unto the sword, unto the pestilence, and unto the famine, and I have given you for a trembling to all kingdoms of the earth.";
dby[17] = "Therefore thus saith Jehovah: Ye have not hearkened unto me, in proclaiming liberty, every man to his brother, and every man to his neighbour: behold, I proclaim a liberty for you, saith Jehovah, to the sword, to the pestilence, and to the famine; and I will give you over to be driven hither and thither among all the kingdoms of the earth.";
web[17] = "Therefore thus saith the LORD; Ye have not hearkened to me, in proclaiming liberty, every one to his brother, and every man to his neighbor: behold, I proclaim a liberty for you, saith the LORD, to the sword, to the pestilence, and to the famine; and I will make you to be removed into all the kingdoms of the earth.";
hnv[17] = " Therefore thus says the LORD: you have not listened to me, to proclaim liberty, every man to his brother, and every man to his neighbor: behold, I proclaim to you a liberty, says the LORD, to the sword, to the pestilence, and to the famine; and I will make you to be tossed back and forth among all the kingdoms of the eretz.";
vul[17] = "propterea haec dicit Dominus vos non audistis me ut praedicaretis libertatem unusquisque fratri suo et unusquisque amico suo ecce ego praedico libertatem ait Dominus ad gladium et pestem et famem et dabo vos in commotionem cunctis regnis terrae";
kjv[18] = "And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof,";
rsv[18] = "And the men who transgressed my covenant and did not keep the terms of the covenant which they made before me, I will make like the calf which they cut in two and passed between its parts--";
asv[18] = "And I will give the men that have transgressed my covenant, that have not performed the words of the covenant which they made before me, when they cut the calf in twain and passed between the parts thereof;";
yng[18] = "`And I have given the men who are transgressing My covenant, who have not established the words of the covenant that they have made before Me, by the calf, that they have cut in two, and pass through between its pieces --";
dby[18] = "And I will give the men that have transgressed my covenant, who have not performed the words of the covenant which they had made before me, -- the calf which they cut in twain, and passed between the parts thereof,";
web[18] = "And I will give the men that have transgressed my covenant, who have not performed the words of the covenant which they had made before me, when they cut the calf in two, and passed between the parts of it,";
hnv[18] = "I will give the men who have transgressed my covenant, who have not performed the words of the covenant which they made before me, when they cut the calf in two and passed between the parts of it;";
vul[18] = "et dabo viros qui praevaricantur foedus meum et non observaverunt verba foederis quibus adsensi sunt in conspectu meo vitulum quem ceciderunt in duas partes et transierunt inter divisiones eius";
kjv[19] = "The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;";
rsv[19] = "the princes of Judah, the princes of Jerusalem, the eunuchs, the priests, and all the people of the land who passed between the parts of the calf;";
asv[19] = "the princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, that passed between the parts of the calf;";
yng[19] = "heads of Judah, and heads of Jerusalem, the officers, and the priests, and all the people of the land those passing through between the pieces of the calf --";
dby[19] = "-- the princes of Judah and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, that passed between the parts of the calf;";
web[19] = "The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, who passed between the parts of the calf;";
hnv[19] = "the princes of Yehudah, and the princes of Yerushalayim, the eunuchs, and the Kohanim, and all the people of the land, who passed between the parts of the calf;";
vul[19] = "principes Iuda et principes Hierusalem eunuchi et sacerdotes et omnis populus terrae qui transierunt inter divisiones vituli";
kjv[20] = "I will even give them into the hand of their enemies, and into the hand of them that seek their life: and their dead bodies shall be for meat unto the fowls of the heaven, and to the beasts of the earth.";
rsv[20] = "and I will give them into the hand of their enemies and into the hand of those who seek their lives. Their dead bodies shall be food for the birds of the air and the beasts of the earth.";
asv[20] = "I will even give them into the hand of their enemies, and into the hand of them that seek their life; and their dead bodies shall be for food unto the birds of the heavens, and to the beasts of the earth.";
yng[20] = "yea, I have given them into the hand of their enemies, and into the hand of those seeking their soul, and their carcase hath been for food to the fowl of the heavens, and to the beast of the earth.";
dby[20] = "them will I give into the hand of their enemies and into the hand of them that seek their life; and their carcases shall be food for the fowl of the heavens and for the beasts of the earth.";
web[20] = "I will even give them into the hand of their enemies, and into the hand of them that seek their life: and their dead bodies shall be for food to the fowls of the heaven, and to the beasts of the earth.";
hnv[20] = "I will even give them into the hand of their enemies, and into the hand of those who seek their life; and their dead bodies shall be for food to the birds of the sky, and to the animals of the eretz.";
vul[20] = "et dabo eos in manu inimicorum suorum et in manu quaerentium animam eorum et erit morticinum eorum in escam volucribus caeli et bestiis terrae";
kjv[21] = "And Zedekiah king of Judah and his princes will I give into the hand of their enemies, and into the hand of them that seek their life, and into the hand of the king of Babylon\'s army, which are gone up from you.";
rsv[21] = "And Zedeki\'ah king of Judah, and his princes I will give into the hand of their enemies and into the hand of those who seek their lives, into the hand of the army of the king of Babylon which has withdrawn from you.";
asv[21] = "And Zedekiah king of Judah and his princes will I give into the hand of their enemies, and into the hand of them that seek their life, and into the hand of the king of Babylon\'s army, that are gone away from you.";
yng[21] = "`And Zedekiah king of Judah, and his heads, I give into the hand of their enemies, and into the hand of those seeking their soul, and into the hand of the forces of the king of Babylon, that are going up from off you.";
dby[21] = "And Zedekiah king of Judah and his princes will I give into the hand of their enemies, and into the hand of them that seek their life, and into the hand of the king of Babylon\'s army, which are gone up from you.";
web[21] = "And Zedekiah king of Judah and his princes I will give into the hand of their enemies, and into the hand of them that seek their life, and into the hand of the king of Babylon\'s army, which are gone up from you.";
hnv[21] = "Tzidkiyahu king of Yehudah and his princes will I give into the hand of their enemies, and into the hand of those who seek their life, and into the hand of the king of Bavel\'s army, who have gone away from you.";
vul[21] = "et Sedeciam regem Iuda et principes eius dabo in manu inimicorum suorum et in manu quaerentium animam eorum et in manu exercituum regis Babylonis qui recesserunt a vobis";
kjv[22] = "Behold, I will command, saith the LORD, and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire: and I will make the cities of Judah a desolation without an inhabitant.";
rsv[22] = "Behold, I will command, says the LORD, and will bring them back to this city; and they will fight against it, and take it, and burn it with fire. I will make the cities of Judah a desolation without inhabitant.&quot;";
asv[22] = "Behold, I will command, saith Jehovah, and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire: and I will make the cities of Judah a desolation, without inhabitant.";
yng[22] = "Lo, I am commanding -- an affirmation of Jehovah -- and have brought them back unto this city, and they have fought against it, and captured it, and burned it with fire, and the cities of Judah I do make a desolation -- without inhabitant.\'";
dby[22] = "Behold, I command, saith Jehovah, and I will cause them to return to this city; and they shall fight against it, and take it, and burn it with fire; and I will make the cities of Judah a desolation, without inhabitant.";
web[22] = "Behold, I will command, saith the LORD, and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire: and I will make the cities of Judah a desolation without an inhabitant.";
hnv[22] = "Behold, I will command, says the LORD, and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire: and I will make the cities of Yehudah a desolation, without inhabitant.";
vul[22] = "ecce ego praecipio dicit Dominus et reducam eos in civitatem hanc et proeliabuntur adversum eam et capient eam et incendent igni et civitates Iuda dabo in solitudinem eo quod non sit habitator";
