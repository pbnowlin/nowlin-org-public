csb[1] = "Then all the commanders of the armies, along with Johanan son of Kareah, Jezaniah son of Hoshaiah, and all the people from the least to the greatest, approached";
csb[2] = "the prophet Jeremiah and said, &quot;May our petition come before you; pray to the LORD your God on our behalf, on behalf of this entire remnant (for few of us remain out of the many, as you can see with your own eyes),";
csb[3] = "&quot;that the LORD your God may tell us the way we should go and the thing we should do.&quot;";
csb[4] = "So the prophet Jeremiah said to them, &quot;I have heard. I will now pray to the LORD your God according to your words, and I will tell you every word that the LORD answers you; I won\'t withhold a word from you.&quot;";
csb[5] = "And they said to Jeremiah, &quot;May the LORD be a true and faithful witness against us if we don\'t act according to every word the LORD your God sends you to tell us.";
csb[6] = "&quot;Whether it is pleasant or unpleasant, we will obey the LORD our God to whom we are sending you so that it may go well with us. We will certainly obey the LORD our God! &quot;";
csb[7] = "At the end of ten days, the word of the LORD came to Jeremiah,";
csb[8] = "and he summoned Johanan son of Kareah, all the commanders of the armies who were with him, and all the people from the least to the greatest.";
csb[9] = "He said to them, &quot;This is what the LORD says, the God of Israel to whom you sent me to bring your petition before him:";
csb[10] = "&quot;\'If you will indeed stay in this land, then I will rebuild and not demolish you, and I will plant and not uproot you, because I relent concerning the disaster that I have brought on you.";
csb[11] = "&quot;Don\'t be afraid of the king of Babylon whom you now fear; don\'t be afraid of him\' -- this is the LORD\'s declaration -- \'because I am with you to save you and rescue you from him.";
csb[12] = "&quot;I will grant you compassion, and he will have compassion on you and allow you to return to your own soil.\'";
csb[13] = "&quot;But if you say, \'We will not stay in this land,\' in order to disobey the LORD your God,";
csb[14] = "&quot;and if you say, \'No, instead we\'ll go to the land of Egypt where we will not see war or hear the sound of the ram\'s horn or hunger for food, and we\'ll live there,\'";
csb[15] = "&quot;then hear the word of the LORD, remnant of Judah! This is what the LORD of Armies, the God of Israel, says: \'If you are firmly resolved to go to Egypt and stay there for a while,";
csb[16] = "&quot;then the sword you fear will overtake you there in the land of Egypt, and the famine you are worried about will follow on your heels there to Egypt, and you will die there.";
csb[17] = "&quot;All who resolve to go to Egypt to stay there for a while will die by the sword, famine, and plague. They will have no survivor or fugitive from the disaster I will bring on them.\'";
csb[18] = "&quot;For this is what the LORD of Armies, the God of Israel, says: \'Just as my anger and fury were poured out on Jerusalem\'s residents, so will my fury pour out on you if you go to Egypt. You will become an example for cursing, scorn, execration, and disgrace, and you will never see this place again.\'";
csb[19] = "&quot;The LORD has spoken concerning you, remnant of Judah: \'Don\'t go to Egypt.\' Know for certain that I have warned you today!";
csb[20] = "&quot;You have gone astray at the cost of your lives because you are the ones who sent me to the LORD your God, saying, \'Pray to the LORD our God on our behalf, and as for all that the LORD our God says, tell it to us, and we\'ll act accordingly.\'";
csb[21] = "&quot;For I have told you today, but you have not obeyed the LORD your God in everything he has sent me to tell you.";
csb[22] = "&quot;Now therefore, know for certain that by the sword, famine, and plague you will die in the place where you desired to go to stay for a while.&quot;";

dby[17] = "And it shall be that all the men that have set their faces to go into Egypt to sojourn there shall die by the sword, by the famine, and by the pestilence; and none of them shall remain or escape from the evil that I will bring upon them.";
web[17] = "So shall it be with all the men that set their faces to go into Egypt to sojourn there; they shall die by the sword, by the famine, and by the pestilence: and none of them shall remain or escape from the evil that I will bring upon them.";
hnv[17] = "So shall it be with all the men who set their faces to go into Mitzrayim to sojourn there: they shall die by the sword, by the famine, and by the pestilence; and none of them shall remain or escape from the evil that I will bring on them.";
vul[17] = "omnesque viri qui posuerint faciem suam ut ingrediantur Aegyptum et habitent ibi morientur gladio et fame et peste nullus de eis remanebit nec effugient a facie mali quod ego adferam super eos";
kjv[18] = "For thus saith the LORD of hosts, the God of Israel; As mine anger and my fury hath been poured forth upon the inhabitants of Jerusalem; so shall my fury be poured forth upon you, when ye shall enter into Egypt: and ye shall be an execration, and an astonishment, and a curse, and a reproach; and ye shall see this place no more.";
rsv[18] = "&quot;For thus says the LORD of hosts, the God of Israel: As my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you go to Egypt. You shall become an execration, a horror, a curse, and a taunt. You shall see this place no more.";
asv[18] = "For thus saith Jehovah of hosts, the God of Israel: As mine anger and my wrath hath been poured forth upon the inhabitants of Jerusalem, so shall my wrath be poured forth upon you, when ye shall enter into Egypt; and ye shall be an execration, and an astonishment, and a curse, and a reproach; and ye shall see this place no more.";
yng[18] = "for thus said Jehovah of Hosts, God of Israel: As poured out hath been Mine anger and My fury on the inhabitants of Jerusalem, so poured out is My fury upon you in your entering Egypt, and ye have been for an execration, and for an astonishment, and for a reviling, and for a reproach, and ye do not see any more this place.";
dby[18] = "For thus saith Jehovah of hosts, the God of Israel: As mine anger and my fury have been poured forth upon the inhabitants of Jerusalem, so shall my fury be poured forth upon you, when ye shall enter into Egypt; and ye shall be an execration, and an astonishment, and a curse, and a reproach, and ye shall see this place no more.";
web[18] = "For thus saith the LORD of hosts, the God of Israel; As my anger and my fury hath been poured forth upon the inhabitants of Jerusalem: so shall my fury be poured forth upon you, when ye shall enter into Egypt: and ye shall be an execration, and an astonishment, and a curse, and a reproach; and ye shall see this place no more.";
hnv[18] = "For thus says the LORD of Hosts, the God of Yisra\'el: As my anger and my wrath has been poured forth on the inhabitants of Yerushalayim, so shall my wrath be poured forth on you, when you shall enter into Mitzrayim; and you shall be an object of horror, and an astonishment, and a curse, and a reproach; and you shall see this place no more.";
vul[18] = "quia haec dicit Dominus exercituum Deus Israhel sicut conflatus est furor meus et indignatio mea super habitatores Hierusalem sic conflabitur indignatio mea super vos cum ingressi fueritis Aegyptum et eritis in iusiurandum et in stuporem et in maledictum et in obprobrium et nequaquam ultra videbitis locum istum";
kjv[19] = "The LORD hath said concerning you, O ye remnant of Judah; Go ye not into Egypt: know certainly that I have admonished you this day.";
rsv[19] = "The LORD has said to you, O remnant of Judah, \'Do not go to Egypt.\' Know for a certainty that I have warned you this day";
asv[19] = "Jehovah hath spoken concerning you, O remnant of Judah, Go ye not into Egypt: know certainly that I have testified unto you this day.";
yng[19] = "`Jehovah hath spoken against you, O remnant of Judah, do not enter Egypt: know certainly that I have testified against you to-day;";
dby[19] = "Jehovah hath said concerning you, the remnant of Judah, Go ye not into Egypt. Know certainly that I have admonished you this day.";
web[19] = "The LORD hath said concerning you, O ye remnant of Judah; Go ye not into Egypt: know certainly that I have admonished you this day.";
hnv[19] = "The LORD has spoken concerning you, remnant of Yehudah, Don\'t you go into Mitzrayim: know certainly that I have testified to you this day.";
vul[19] = "verbum Domini super vos reliquiae Iuda nolite intrare Aegyptum scientes scietis quia obtestatus sum vobis hodie";
kjv[20] = "For ye dissembled in your hearts, when ye sent me unto the LORD your God, saying, Pray for us unto the LORD our God; and according unto all that the LORD our God shall say, so declare unto us, and we will do [it].";
rsv[20] = "that you have gone astray at the cost of your lives. For you sent me to the LORD your God, saying, \'Pray for us to the LORD our God, and whatever the LORD our God says declare to us and we will do it.\'";
asv[20] = "For ye have dealt deceitfully against your own souls; for ye sent me unto Jehovah your God, saying, Pray for us unto Jehovah our God; and according unto all that Jehovah our God shall say, so declare unto us, and we will do it.";
yng[20] = "for ye have shewed yourselves perverse in your souls, for ye sent me unto Jehovah your God, saying, Pray for us unto Jehovah our God, and according to all that Jehovah our God saith, so declare to us, and we have done [it];";
dby[20] = "For ye deceived yourselves in your own souls, when ye sent me unto Jehovah your God, saying, Pray for us unto Jehovah our God; and according to all that Jehovah our God shall say, so declare unto us, and we will do it.";
web[20] = "For ye dissembled in your hearts, when ye sent me to the LORD your God, saying, Pray for us to the LORD our God; and according to all that the LORD our God shall say, so declare to us, and we will do [it].";
hnv[20] = "For you have dealt deceitfully against your own souls; for you sent me to the LORD your God, saying, Pray for us to the LORD our God; and according to all that the LORD our God shall say, so declare to us, and we will do it:";
vul[20] = "quia decepistis animas vestras vos enim misistis me ad Dominum Deum nostrum dicentes ora pro nobis ad Dominum Deum nostrum et iuxta omnia quaecumque dixerit tibi Dominus Deus noster sic adnuntia nobis et faciemus";

rsv[21] = "And I have this day declared it to you, but you have not obeyed the voice of the LORD your God in anything that he sent me to tell you.";
asv[21] = "And I have this day declared it to you; but ye have not obeyed the voice of Jehovah your God in anything for which he hath sent me unto you.";
yng[21] = "and I declare to you to-day, and ye have not hearkened to the voice of Jehovah your God, and to anything with which He hath sent me unto you.";

web[21] = "And [now] I have this day declared [it] to you; but ye have not obeyed the voice of the LORD your God, nor any [thing] for which he hath sent me to you.";

kjv[22] = "Now therefore know certainly that ye shall die by the sword, by the famine, and by the pestilence, in the place whither ye desire to go [and] to sojourn.";
rsv[22] = "Now therefore know for a certainty that you shall die by the sword, by famine, and by pestilence in the place where you desire to go to live.&quot;";
