csb[1] = "About Moab, this is what the LORD of Armies, the God of Israel, says: Woe to Nebo, because it is about to be destroyed; Kiriathaim will be put to shame; it will be taken captive. The fortress will be put to shame and dismayed!";
csb[2] = "There is no longer praise for Moab; they plan harm against her in Heshbon: Come, let\'s cut her off from nationhood. Also, Madmen, you will be silenced; the sword will follow you.";
csb[3] = "A voice cries out from Horonaim, &quot;devastation and a crushing blow! &quot;";
csb[4] = "Moab will be shattered; her little ones will cry out.";
csb[5] = "For on the Ascent to Luhith they will be weeping continually, and on the descent to Horonaim will be heard cries of distress over the destruction:";
csb[6] = "Flee! Save your lives! Be like a juniper bush in the wilderness.";
csb[7] = "Because you trust in your works and treasures, you will be captured also. Chemosh will go into exile with his priests and officials.";
csb[8] = "The destroyer will move against every town; not one town will escape. The valley will perish, and the plain will be annihilated, as the LORD has said.";
csb[9] = "Make Moab a salt marsh, for she will run away; her towns will become a desolation, without inhabitant.";
csb[10] = "The one who does the LORD\'s business deceitfully is cursed, and the one who withholds his sword from bloodshed is cursed.";
csb[11] = "Moab has been left quiet since his youth, settled like wine on its dregs. He hasn\'t been poured from one container to another or gone into exile. So his taste has remained the same, and his aroma hasn\'t changed.";
csb[12] = "Therefore look, the days are coming -- this is the LORD\'s declaration -- when I will send pourers to him, who will pour him out. They will empty his containers and smash his jars.";
csb[13] = "Moab will be put to shame because of Chemosh, just as the house of Israel was put to shame because of Bethel that they trusted in.";
csb[14] = "How can you say, &quot;We are warriors -- valiant men for battle&quot;?";
csb[15] = "The destroyer of Moab and its towns has come up, and the best of its young men have gone down to slaughter. This is the King\'s declaration; the LORD of Armies is his name.";
csb[16] = "Moab\'s calamity is near at hand; his disaster is rushing swiftly.";
csb[17] = "Mourn for him, all you surrounding nations, everyone who knows his name. Say, &quot;How the mighty scepter is shattered, the glorious staff! &quot;";
csb[18] = "Come down from glory; sit on parched ground, resident of the daughter of Dibon, for the destroyer of Moab has come against you; he has destroyed your fortresses.";
csb[19] = "Stand by the highway and watch, resident of Aroer! Ask him who is fleeing or her who is escaping, &quot;What happened? &quot;";
csb[20] = "Moab is put to shame, indeed dismayed. Wail and cry out! Declare by the Arnon that Moab is destroyed.";
csb[21] = "&quot;Judgment has come to the land of the plateau -- to Holon, Jahzah, Mephaath,";
csb[22] = "&quot;Dibon, Nebo, Beth-diblathaim,";
csb[23] = "&quot;Kiriathaim, Beth-gamul, Beth-meon,";
csb[24] = "&quot;Kerioth, Bozrah, and all the towns of the land of Moab, those far and near.";
csb[25] = "&quot;Moab\'s horn is chopped off; his arm is shattered.&quot; This is the LORD\'s declaration.";
csb[26] = "&quot;Make him drunk, because he has exalted himself against the LORD. Moab will wallow in his own vomit, and he will also become a laughingstock.";
csb[27] = "&quot;Wasn\'t Israel a laughingstock to you? Was he ever found among thieves? For whenever you speak of him you shake your head.&quot;";
csb[28] = "Abandon the towns! Live in the cliffs, residents of Moab! Be like a dove that nests inside the mouth of a cave.";
csb[29] = "We have heard of Moab\'s pride, great pride, indeed -- his insolence, arrogance, pride, and haughty heart.";
csb[30] = "I know his outburst. This is the LORD\'s declaration. It is empty. His boast is empty.";
csb[31] = "Therefore, I will wail over Moab. I will cry out for Moab, all of it; he will moan for the men of Kir-heres.";
csb[32] = "I will weep for you, vine of Sibmah, with more than the weeping for Jazer. Your tendrils have extended to the sea; they have reached to the sea and to Jazer. The destroyer has fallen on your summer fruit and grape harvest.";
csb[33] = "Gladness and celebration are taken from the fertile field and from the land of Moab. I have stopped the flow of wine from the winepresses; no one will tread with shouts of joy. The shouting is not a shout of joy.";
csb[34] = "&quot;There is a cry from Heshbon to Elealeh; they make their voices heard as far as Jahaz -- from Zoar to Horonaim and Eglath-shelishiyah -- because even the Waters of Nimrim have become desolate.";
csb[35] = "&quot;In Moab, I will stop&quot; -- this is the LORD\'s declaration -- &quot;the one who offers sacrifices on the high place and burns incense to his gods.";
csb[36] = "&quot;Therefore, my heart moans like flutes for Moab, and my heart moans like flutes for the people of Kir-heres. And therefore, the wealth he has gained has perished.";
csb[37] = "&quot;Indeed, every head is bald and every beard is chopped short. On every hand is a gash and sackcloth around the waist.";
csb[38] = "&quot;On all the rooftops of Moab and in her public squares, everyone is mourning because I have shattered Moab like a jar no one wants.&quot; This is the LORD\'s declaration.";
csb[39] = "&quot;How broken it is! They wail! How Moab has turned his back! He is ashamed. Moab will become a laughingstock and a shock to all those around him.&quot;";
csb[40] = "For this is what the LORD says: Look! He will swoop down like an eagle and spread his wings against Moab.";
csb[41] = "The towns have been captured, and the strongholds seized. In that day the heart of Moab\'s warriors will be like the heart of a woman with contractions.";
csb[42] = "Moab will be destroyed as a people because he has exalted himself against the LORD.";
csb[43] = "Panic, pit, and trap await you, resident of Moab. This is the LORD\'s declaration.";
csb[44] = "He who flees from the panic will fall in the pit, and he who climbs from the pit will be captured in the trap, for I will bring against Moab the year of their punishment. This is the LORD\'s declaration.";
csb[45] = "Those who flee will stand exhausted in Heshbon\'s shadow because fire has come out from Heshbon and a flame from within Sihon. It will devour Moab\'s forehead and the skull of the noisemakers.";
csb[46] = "Woe to you, Moab! The people of Chemosh have perished because your sons have been taken captive and your daughters have gone into captivity.";
csb[47] = "Yet, I will restore the fortunes of Moab in the last days. This is the LORD\'s declaration. The judgment on Moab ends here.";
kjv[1] = "Against Moab thus saith the LORD of hosts, the God of Israel; Woe unto Nebo! for it is spoiled: Kiriathaim is confounded [and] taken: Misgab is confounded and dismayed.";
rsv[1] = "Concerning Moab. Thus says the LORD of hosts, the God of Israel: &quot;Woe to Nebo, for it is laid waste! Kiriatha\'im is put to shame, it is taken; the fortress is put to shame and broken down;";
asv[1] = "Of Moab. Thus saith Jehovah of hosts, the God of Israel: Woe unto Nebo! for it is laid waste; Kiriathaim is put to shame, it is taken; Misgab is put to shame and broken down.";
yng[1] = "Concerning Moab: `Thus said Jehovah of Hosts, God of Israel: Wo unto Nebo, for it is spoiled, Put to shame, captured hath been Kiriathaim, Put to shame hath been the high tower, Yea, it hath been broken down.";
dby[1] = "Concerning Moab. Thus saith Jehovah of hosts, the God of Israel: Woe unto Nebo! for it is spoiled; Kirjathaim is put to shame, it is taken; Misgab is put to shame and dismayed.";
web[1] = "Against Moab thus saith the LORD of hosts, the God of Israel; Woe to Nebo! for it is laid waste: Kiriathaim is confounded [and] taken: Misgab is confounded and dismayed.";
hnv[1] = "Of Mo\'av. Thus says the LORD of Hosts, the God of Yisra\'el: Woe to Nevo! for it is laid waste; Kiryatayim is disappointed, it is taken; Misgav is put to shame and broken down.";
vul[1] = "ad Moab haec dicit Dominus exercituum Deus Israhel vae super Nabo quoniam vastata est et confusa capta est Cariathaim confusa est fortis et tremuit";
kjv[2] = "[There shall be] no more praise of Moab: in Heshbon they have devised evil against it; come, and let us cut it off from [being] a nation. Also thou shalt be cut down, O Madmen; the sword shall pursue thee.";
rsv[2] = "the renown of Moab is no more. In Heshbon they planned evil against her: \'Come, let us cut her off from being a nation!\' You also, O Madmen, shall be brought to silence; the sword shall pursue you.";
asv[2] = "The praise of Moab is no more; in Heshbon they have devised evil against her: Come, and let us cut her off from being a nation. Thou also, O Madmen, shalt be brought to silence; the sword shall pursue thee.";
yng[2] = "There is no more praise of Moab, In Heshbon they devised against it evil: Come, and we cut it off from [being] a nation, Also, O Madmen, thou art cut off, After thee goeth a sword.";
dby[2] = "Moab\'s praise is no more; in Heshbon they have devised evil against her: Come, and let us cut her off from [being] a nation. Thou also, O Madmen, shalt be cut down; the sword shall pursue thee.";

asv[5] = "For by the ascent of Luhith with continual weeping shall they go up; for at the descent of Horonaim they have heard the distress of the cry of destruction.";
yng[5] = "For the ascent of Luhith with weeping, Go up doth weeping, For in the descent of Horonaim Adversaries a cry of desolation have heard.";
dby[5] = "For by the ascent of Luhith continual weeping shall go up; for in the descent of Horonaim is heard the anguish of the cry of destruction.";

hnv[5] = "For by the ascent of Luchit with continual weeping shall they go up; for at the descent of Horonayim they have heard the distress of the cry of destruction.";

kjv[6] = "Flee, save your lives, and be like the heath in the wilderness.";
rsv[6] = "Flee! Save yourselves! Be like a wild ass in the desert!";
asv[6] = "Flee, save your lives, and be like the heath in the wilderness.";
yng[6] = "Flee ye, deliver yourselves, Ye are as a naked thing in a wilderness.";
dby[6] = "Flee, save your lives, and be like a shrub in the wilderness.";

hnv[6] = "Flee, save your lives, and be like the heath in the wilderness.";

kjv[7] = "For because thou hast trusted in thy works and in thy treasures, thou shalt also be taken: and Chemosh shall go forth into captivity [with] his priests and his princes together.";
rsv[7] = "For, because you trusted in your strongholds and your treasures, you also shall be taken; and Chemosh shall go forth into exile, with his priests and his princes.";
asv[7] = "For, because thou hast trusted in thy works and in thy treasures, thou also shalt be taken: and Chemosh shall go forth into captivity, his priests and his princes together.";
yng[7] = "For, because of thy trusting in thy works, And in thy treasures, even thou art captured, And gone out hath Chemosh in a removal, His priests and his heads together.";
dby[7] = "For because thou hast confided in thy works and in thy treasures, thou also shalt be taken, and Chemosh shall go forth into captivity, his priests and his princes together.";
web[7] = "For because thou hast trusted in thy works and in thy treasures, thou also shalt be taken: and Chemosh shall go forth into captivity [with] his priests and his princes together.";
hnv[7] = "For, because you have trusted in your works and in your treasures, you also shall be taken: and Kemosh shall go forth into captivity, his Kohanim and his princes together.";

yng[8] = "And come in doth a spoiler unto every city, And no city doth escape, And perished hath the valley, And destroyed been the plain, as Jehovah said.";
dby[8] = "And the waster shall come upon every city, that not a city shall escape; and the valley shall perish, and the plateau shall be destroyed: as Jehovah hath said.";
web[8] = "And the spoiler shall come upon every city, and no city shall escape: the valley also shall perish, and the plain shall be destroyed, as the LORD hath spoken.";

kjv[9] = "Give wings unto Moab, that it may flee and get away: for the cities thereof shall be desolate, without any to dwell therein.";
rsv[9] = "&quot;Give wings to Moab, for she would fly away; her cities shall become a desolation, with no inhabitant in them.";
asv[9] = "Give wings unto Moab, that she may fly and get her away: and her cities shall become a desolation, without any to dwell therein.";
yng[9] = "Give wings to Moab, for she utterly goeth out, And her cities are for a desolation, Without an inhabitant in them.";
dby[9] = "Give wings unto Moab, that she may flee and get away; and the cities thereof shall become a desolation, without inhabitant.";

kjv[10] = "Cursed [be] he that doeth the work of the LORD deceitfully, and cursed [be] he that keepeth back his sword from blood.";
rsv[10] = "&quot;Cursed is he who does the work of the LORD with slackness; and cursed is he who keeps back his sword from bloodshed.";

dby[10] = "Cursed be he that doeth the work of Jehovah negligently, and cursed be he that keepeth back his sword from blood!";

kjv[11] = "Moab hath been at ease from his youth, and he hath settled on his lees, and hath not been emptied from vessel to vessel, neither hath he gone into captivity: therefore his taste remained in him, and his scent is not changed.";
rsv[11] = "&quot;Moab has been at ease from his youth and has settled on his lees; he has not been emptied from vessel to vessel, nor has he gone into exile; so his taste remains in him, and his scent is not changed.";
asv[11] = "Moab hath been at ease from his youth, and he hath settled on his lees, and hath not been emptied from vessel to vessel, neither hath he gone into captivity: therefore his taste remaineth in him, and his scent is not changed.";
yng[11] = "Secure is Moab from his youth, And at rest [is] he for his preserved things, And he hath not been emptied out from vessel unto vessel, And into captivity he hath not gone, Therefore hath his taste remained in him, And his fragrance hath not been changed.";
dby[11] = "Moab hath been at ease from his youth, and hath settled on his lees; he hath not been emptied from vessel to vessel, neither hath he gone into captivity: therefore his taste hath remained in him, and his scent is not changed.";

yng[12] = "Therefore, lo, days are coming, An affirmation of Jehovah, And I have sent to him wanderers, And they have caused him to wander, And his vessels they empty out, And his bottles they dash in pieces.";
dby[12] = "Therefore behold, days come, saith Jehovah, that I will send unto him pourers that shall pour him off, and shall empty his vessels, and break in pieces his flagons.";
web[12] = "Therefore, behold, the days come, saith the LORD, that I will send to him wanderers that shall cause him to wander, and shall empty his vessels, and break their bottles.";
hnv[12] = "Therefore, behold, the days come, says the LORD, that I will send to him those who pour off, and they shall pour him off; and they shall empty his vessels, and break their bottles in pieces.";

rsv[18] = "&quot;Come down from your glory, and sit on the parched ground, O inhabitant of Dibon! For the destroyer of Moab has come up against you; he has destroyed your strongholds.";
asv[18] = "O thou daughter that dwellest in Dibon, come down from thy glory, and sit in thirst; for the destroyer of Moab is come up against thee, he hath destroyed thy strongholds.";
yng[18] = "Come down from honour, sit in thirst, O inhabitant, daughter of Dibon, For a spoiler of Moab hath come up to thee, He hath destroyed thy fenced places.";
dby[18] = "Come down from [thy] glory and sit in the drought, O inhabitress, daughter of Dibon; the spoiler of Moab is come up against thee, thy strongholds hath he destroyed.";
web[18] = "Thou daughter that dost inhabit Dibon, come down from [thy] glory, and sit in thirst; for the spoiler of Moab shall come upon thee, [and] he shall destroy thy strong holds.";
hnv[18] = "You daughter who dwells in Divon, come down from your glory, and sit in thirst; for the destroyer of Mo\'av is come up against you, he has destroyed your strongholds.";
vul[18] = "descende de gloria et sede in siti habitatio filiae Dibon quoniam vastator Moab ascendet ad te dissipabit munitiones tuas";
kjv[19] = "O inhabitant of Aroer, stand by the way, and espy; ask him that fleeth, and her that escapeth, [and] say, What is done?";
rsv[19] = "Stand by the way and watch, O inhabitant of Aro\'er! Ask him who flees and her who escapes; say, \'What has happened?\'";
asv[19] = "O inhabitant of Aroer, stand by the way, and watch: ask him that fleeth, and her that escapeth; say, What hath been done?";
yng[19] = "On the way stand, and watch, O inhabitant of Aroer, Ask the fugitive and escaped, Say, What hath happened?";
dby[19] = "Stand by the way, and watch, inhabitress of Aroer; ask him that fleeth, and her that escapeth; say, What is done?";
web[19] = "O inhabitant of Aroer, stand by the way, and espy; ask him that fleeth, and her that escapeth, [and] say, What is done?";
hnv[19] = "Inhabitant of `Aro`er, stand by the way, and watch: ask him who flees, and her who escapes; say, What has been done?";
vul[19] = "in via sta et prospice habitatio Aroer interroga fugientem et eum qui evasit dic quid accidit";
kjv[20] = "Moab is confounded; for it is broken down: howl and cry; tell ye it in Arnon, that Moab is spoiled,";
rsv[20] = "Moab is put to shame, for it is broken; wail and cry! Tell it by the Arnon, that Moab is laid waste.";
asv[20] = "Moab is put to shame; for it is broken down: wail and cry; tell ye it by the Arnon, that Moab is laid waste.";
yng[20] = "Put to shame hath been Moab, For it hath been broken down, Howl and cry, declare ye in Arnon, For spoiled is Moab,";
dby[20] = "Moab is put to shame; for he is broken down: howl and cry; tell it in Arnon, that Moab is laid waste.";
web[20] = "Moab is confounded; for it is broken down: howl and cry; tell ye it in Arnon, that Moab is laid waste.";
hnv[20] = "Mo\'av is disappointed; for it is broken down: wail and cry; tell you it by the Arnon, that Mo\'av is laid waste.";
vul[20] = "confusus est Moab quoniam victus est ululate et clamate adnuntiate in Arnon quoniam vastata est Moab";
kjv[21] = "And judgment is come upon the plain country; upon Holon, and upon Jahazah, and upon Mephaath,";
rsv[21] = "&quot;Judgment has come upon the tableland, upon Holon, and Jahzah, and Meph\'a-ath,";
asv[21] = "And judgment is come upon the plain country, upon Holon, and upon Jahzah, and upon Mephaath,";
yng[21] = "And judgment hath come in unto the land of the plain -- unto Holon, And unto Jahazah, and on Mephaath,";
dby[21] = "And judgment is come upon the country of the plateau; upon Holon, and upon Jahzah, and upon Mephaath;";
web[21] = "And judgment is come upon the plain country; upon Holon, and upon Jahazah, and upon Mephaath,";
hnv[21] = "Judgment is come on the plain country, on Holon, and on Yahtzah, and on Mefa`at,";
vul[21] = "et iudicium venit ad terram campestrem super Helon et super Iaesa et super Mefath";
kjv[22] = "And upon Dibon, and upon Nebo, and upon Bethdiblathaim,";
rsv[22] = "and Dibon, and Nebo, and Beth-diblatha\'im,";
asv[22] = "and upon Dibon, and upon Nebo, and upon Beth-diblathaim,";
yng[22] = "And on Dibon, and on Nebo, And on Beth-Diblathaim, and on Kirathaim,";
dby[22] = "and upon Dibon, and upon Nebo, and upon Beth-diblathaim;";
web[22] = "And upon Dibon, and upon Nebo, and upon Beth-diblathaim,";
hnv[22] = "and on Divon, and on Nevo, and on Beit-Divlatayim,";
vul[22] = "et super Dibon et super Nabo et super domum Deblathaim";
kjv[23] = "And upon Kiriathaim, and upon Bethgamul, and upon Bethmeon,";
rsv[23] = "and Kiriatha\'im, and Beth-ga\'mul, and Beth-me\'on,";
asv[23] = "and upon Kiriathaim, and upon Beth-gamul, and upon Beth-meon,";
yng[23] = "And on Beth-Gamul, and on Beth-Meon,";
dby[23] = "and upon Kirjathaim, and upon Beth-gamul, and upon Beth-meon;";
web[23] = "And upon Kiriathaim, and upon Beth-gamul, and upon Beth-meon,";
hnv[23] = "and on Kiryatayim, and on Beit-Gamul, and on Beit-Me`on,";
vul[23] = "et super Cariathaim et super Bethgamul et super Bethmaon";
kjv[24] = "And upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near.";
rsv[24] = "and Ker\'i-oth, and Bozrah, and all the cities of the land of Moab, far and near.";
asv[24] = "and upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near.";
yng[24] = "And on Kerioth, and on Bozrah, And on all cities of the land of Moab, The far off and the near.";
dby[24] = "and upon Kerijoth, and upon Bozrah, and upon all the cities of the land of Moab, far and near.";
web[24] = "And upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near.";
hnv[24] = "and on Keriyot, and on Botzrah, and on all the cities of the land of Mo\'av, far or near.";
vul[24] = "et super Carioth et super Bosra et super omnes civitates terrae Moab quae longe et quae prope sunt";
kjv[25] = "The horn of Moab is cut off, and his arm is broken, saith the LORD.";
rsv[25] = "The horn of Moab is cut off, and his arm is broken, says the LORD.";
asv[25] = "The horn of Moab is cut off, and his arm is broken, saith Jehovah.";
yng[25] = "Cut down hath been the horn of Moab, And his arm hath been broken, An affirmation of Jehovah.";
dby[25] = "The horn of Moab is cut off, and his arm is broken, saith Jehovah.";
web[25] = "The horn of Moab is cut off, and his arm is broken, saith the LORD.";
hnv[25] = "The horn of Mo\'av is cut off, and his arm is broken, says the LORD.";
vul[25] = "abscisum est cornu Moab et brachium eius contritum est ait Dominus";
kjv[26] = "Make ye him drunken: for he magnified [himself] against the LORD: Moab also shall wallow in his vomit, and he also shall be in derision.";
rsv[26] = "&quot;Make him drunk, because he magnified himself against the LORD; so that Moab shall wallow in his vomit, and he too shall be held in derision.";
asv[26] = "Make ye him drunken; for he magnified himself against Jehovah: and Moab shall wallow in his vomit, and he also shall be in derision.";
yng[26] = "Declare ye him drunk, For against Jehovah he made himself great And Moab hath stricken in his vomit, And he hath been for a derision -- even he.";
dby[26] = "Make him drunken, for he magnified himself against Jehovah; and Moab shall wallow in his vomit, and he also shall be in derision.";
web[26] = "Make ye him drunken; for he magnified [himself] against the LORD: Moab also shall wallow in his vomit, and he also shall be in derision.";
hnv[26] = "Make you him drunken; for he magnified himself against the LORD: and Mo\'av shall wallow in his vomit, and he also shall be in derision.";
vul[26] = "inebriate eum quoniam contra Dominum erectus est et adlidet manum Moab in vomitu suo et erit in derisum etiam ipse";
kjv[27] = "For was not Israel a derision unto thee? was he found among thieves? for since thou spakest of him, thou skippedst for joy.";
rsv[27] = "Was not Israel a derision to you? Was he found among thieves, that whenever you spoke of him you wagged your head?";
asv[27] = "For was not Israel a derision unto thee? was he found among thieves? for as often as thou speakest of him, thou waggest the head.";
yng[27] = "And was not Israel the derision to thee? Among thieves was he found? For since thy words concerning him, Thou dost bemoan thyself.";
dby[27] = "For was not Israel a derision unto thee? Was he found among thieves, that as oft as thou didst speak of him, thou didst shake the head?";
web[27] = "For was not Israel a derision to thee? was he found among thieves? for since thou hast spoken of him, thou hast leaped for joy.";
hnv[27] = "For wasn\'t Yisra\'el a derision to you? was he found among thieves? for as often as you speak of him, you wag the head.";
vul[27] = "fuit enim in derisum tibi Israhel quasi inter fures repperisses eum propter verba ergo tua quae adversum illum locutus es captivus duceris";
kjv[28] = "O ye that dwell in Moab, leave the cities, and dwell in the rock, and be like the dove [that] maketh her nest in the sides of the hole\'s mouth.";
rsv[28] = "&quot;Leave the cities, and dwell in the rock, O inhabitants of Moab! Be like the dove that nests in the sides of the mouth of a gorge.";
asv[28] = "O ye inhabitants of Moab, leave the cities, and dwell in the rock; and be like the dove that maketh her nest over the mouth of the abyss.";
yng[28] = "Forsake cities, and dwell in a rock, Ye inhabitants of Moab, And be as a dove making a nest in the passages of a pit\'s mouth.";
dby[28] = "Leave the cities, and dwell in the rocks, ye inhabitants of Moab, and be like the dove, that maketh her nest in the sides of the cave\'s mouth.";
web[28] = "O ye that dwell in Moab, leave the cities, and dwell in the rock, and be like the dove [that] maketh her nest in the sides of the hole\'s mouth.";
hnv[28] = "You inhabitants of Mo\'av, leave the cities, and dwell in the rock; and be like the dove that makes her nest over the mouth of the abyss.";
vul[28] = "relinquite civitates et habitate in petra habitatores Moab et estote quasi columba nidificans in summo ore foraminis";
kjv[29] = "We have heard the pride of Moab, (he is exceeding proud) his loftiness, and his arrogancy, and his pride, and the haughtiness of his heart.";
rsv[29] = "We have heard of the pride of Moab--he is very proud--of his loftiness, his pride, and his arrogance, and the haughtiness of his heart.";
asv[29] = "We have heard of the pride of Moab, [that] he is very proud; his loftiness, and his pride, and his arrogancy, and the haughtiness of his heart.";
yng[29] = "We have heard of the arrogance of Moab, Exceeding proud! His haughtiness, and his arrogance, And his pride, and the height of his heart,";
dby[29] = "We have heard of the arrogance of Moab, -- [he is] very proud; -- his loftiness, and his arrogance, and his pride, and the haughtiness of his heart.";
web[29] = "We have heard the pride of Moab, (he is exceeding proud) his loftiness, and his arrogance, and his pride, and the haughtiness of his heart.";
hnv[29] = "We have heard of the pride of Mo\'av, [that] he is very proud; his loftiness, and his pride, and his arrogance, and the haughtiness of his heart.";
vul[29] = "audivimus superbiam Moab superbus est valde sublimitatem eius et arrogantiam et superbiam et altitudinem cordis illius";
kjv[30] = "I know his wrath, saith the LORD; but [it shall] not [be] so; his lies shall not so effect [it].";
rsv[30] = "I know his insolence, says the LORD; his boasts are false, his deeds are false.";
asv[30] = "I know his wrath, saith Jehovah, that it is nought; his boastings have wrought nothing.";
yng[30] = "I -- I have known, an affirmation of Jehovah, His wrath, and [it is] not right, His devices -- not right they have done.";
dby[30] = "I know his wrath, saith Jehovah; his pratings are vain: they do not as [they say].";
web[30] = "I know his wrath, saith the LORD; but [it shall] not [be] so; his lies shall not so effect [it].";
hnv[30] = "I know his wrath, says the LORD, that it is nothing; his boastings have worked nothing.";
vul[30] = "ego scio ait Dominus iactantiam eius et quod non sit iuxta eam virtus eius nec iuxta quod poterat conata sit facere";
kjv[31] = "Therefore will I howl for Moab, and I will cry out for all Moab; [mine heart] shall mourn for the men of Kirheres.";
rsv[31] = "Therefore I wail for Moab; I cry out for all Moab; for the men of Kir-he\'res I mourn.";
asv[31] = "Therefore will I wail for Moab; yea, I will cry out for all Moab: for the men of Kir-heres shall they mourn.";
yng[31] = "Therefore for Moab I howl, even for Moab -- all of it, I cry for men of Kir-Heres, it doth mourn,";
dby[31] = "Therefore will I howl for Moab, and I will cry out for all Moab: for the men of Kir-heres shall there be moaning.";
web[31] = "Therefore will I howl for Moab, and I will cry out for all Moab; [my heart] shall mourn for the men of Kirheres.";
hnv[31] = "Therefore will I wail for Mo\'av; yes, I will cry out for all Mo\'av: for the men of Kir-Heres shall they mourn.";
vul[31] = "ideo super Moab heiulabo et ad Moab universam clamabo ad viros muri fictilis lamentantes";
kjv[32] = "O vine of Sibmah, I will weep for thee with the weeping of Jazer: thy plants are gone over the sea, they reach [even] to the sea of Jazer: the spoiler is fallen upon thy summer fruits and upon thy vintage.";
rsv[32] = "More than for Jazer I weep for you, O vine of Sibmah! Your branches passed over the sea, reached as far as Jazer; upon your summer fruits and your vintage the destroyer has fallen.";
asv[32] = "With more than the weeping of Jazer will I weep for thee, O vine of Sibmah: thy branches passed over the sea, they reached even to the sea of Jazer: upon thy summer fruits and upon thy vintage the destroyer is fallen.";
yng[32] = "With the weeping of Jazer, I weep for thee, O vine of Sibmah, Thy branches have passed over a sea, Unto the sea of Jazer they have come, On thy summer fruits, and on thy harvest, A spoiler hath fallen.";
dby[32] = "O vine of Sibmah, I will weep for thee with more than the weeping of Jaazer: thy shoots passed over the sea, they reached to the sea of Jaazer. The spoiler is fallen upon thy summer fruits and upon thy vintage.";
web[32] = "O vine of Sibmah, I will weep for thee with the weeping of Jazer: thy plants have gone over the sea, they reach [even] to the sea of Jazer: the spoiler hath fallen upon thy summer fruits and upon thy vintage.";
hnv[32] = "With more than the weeping of Ya`zer will I weep for you, vine of Sivmah: your branches passed over the sea, they reached even to the sea of Ya`zer: on your summer fruits and on your vintage the destroyer is fallen.";
vul[32] = "de planctu Iazer plorabo tibi vinea Sobema propagines tuae transierunt mare usque ad mare Iazer pervenerunt super messem tuam et vindemiam tuam praedo inruit";
kjv[33] = "And joy and gladness is taken from the plentiful field, and from the land of Moab; and I have caused wine to fail from the winepresses: none shall tread with shouting; [their] shouting [shall be] no shouting.";
rsv[33] = "Gladness and joy have been taken away from the fruitful land of Moab; I have made the wine cease from the wine presses; no one treads them with shouts of joy; the shouting is not the shout of joy.";
asv[33] = "And gladness and joy is taken away from the fruitful field and from the land of Moab; and I have caused wine to cease from the winepresses: none shall tread with shouting; the shouting shall be no shouting.";
yng[33] = "And removed hath been joy and gladness From the fruitful field, Even from the land of Moab, And wine from wine-presses I have caused to cease, Shouting doth not proceed, The shouting [is] no shouting!";
dby[33] = "And joy and gladness is taken away from the fruitful field and from the land of Moab; and I have caused wine to fail from the winepresses: they shall no more tread with shouting; the shouting shall be no shouting.";
web[33] = "And joy and gladness is taken from the plentiful field, and from the land of Moab; and I have caused wine to fail from the wine-presses: none shall tread with shouting; [their] shouting [shall be] no shouting.";
hnv[33] = "Gladness and joy is taken away from the fruitful field and from the land of Mo\'av; and I have caused wine to cease from the wine presses: none shall tread with shouting; the shouting shall be no shouting.";
vul[33] = "ablata est laetitia et exultatio de Carmelo et de terra Moab et vinum de torcularibus sustuli nequaquam calcator uvae solitum celeuma cantabit";
kjv[34] = "From the cry of Heshbon [even] unto Elealeh, [and even] unto Jahaz, have they uttered their voice, from Zoar [even] unto Horonaim, [as] an heifer of three years old: for the waters also of Nimrim shall be desolate.";
rsv[34] = "&quot;Heshbon and Ele-a\'leh cry out; as far as Jahaz they utter their voice, from Zo\'ar to Horona\'im and Eg\'lath-shelish\'iyah. For the waters of Nimrim also have become desolate.";
asv[34] = "From the cry of Heshbon even unto Elealeh, even unto Jahaz have they uttered their voice, from Zoar even unto Horonaim, to Eglath-shelishiyah: for the waters of Nimrim also shall become desolate.";
yng[34] = "Because of the cry of Heshbon unto Elealeh, Unto Jahaz they have given their voice, From Zoar unto Horonaim, A heifer of the third [year], For even waters of Nimrim become desolations.";
dby[34] = "Because of the cry from Heshbon, unto Elaleh, unto Jahaz have they uttered their voice, from Zoar unto Horonaim, [unto] Eglath-shelishijah: for even the waters of Nimrim shall become desolations.";
web[34] = "From the cry of Heshbon [even] to Elealeh, [and even] to Jahaz, have they uttered their voice, from Zoar [even] to Horonaim, [as] a heifer of three years old: for the waters also of Nimrim shall be desolate.";
hnv[34] = "From the cry of Heshbon even to El`aleh, even to Yahatz have they uttered their voice, from Tzo`ar even to Horonayim, to Eglat-Shelishi-Yah: for the waters of Nimrim also shall become desolate.";
vul[34] = "de clamore Esebon usque Eleale et Iaesa dederunt vocem suam a Segor usque ad Oronaim vitula conternante aquae quoque Namrim pessimae erunt";
kjv[35] = "Moreover I will cause to cease in Moab, saith the LORD, him that offereth in the high places, and him that burneth incense to his gods.";
rsv[35] = "And I will bring to an end in Moab, says the LORD, him who offers sacrifice in the high place and burns incense to his god.";
asv[35] = "Moreover I will cause to cease in Moab, saith Jehovah, him that offereth in the high place, and him that burneth incense to his gods.";
yng[35] = "And I have caused to cease to Moab, An affirmation of Jehovah, Him who is offering in a high place, And him who is making perfume to his god.";
dby[35] = "And I will cause to cease in Moab, saith Jehovah, him that offereth in the high place, and him that burneth incense to his gods.";
web[35] = "Moreover I will cause to cease in Moab, saith the LORD, him that offereth in the high places, and him that burneth incense to his gods.";
hnv[35] = "Moreover I will cause to cease in Mo\'av, says the LORD, him who offers in the high place, and him who burns incense to his gods.";
vul[35] = "et auferam de Moab ait Dominus offerentem in excelsis et sacrificantem diis eius";
kjv[36] = "Therefore mine heart shall sound for Moab like pipes, and mine heart shall sound like pipes for the men of Kirheres: because the riches [that] he hath gotten are perished.";
rsv[36] = "Therefore my heart moans for Moab like a flute, and my heart moans like a flute for the men of Kir-he\'res; therefore the riches they gained have perished.";
asv[36] = "Therefore my heart soundeth for Moab like pipes, and my heart soundeth like pipes for the men of Kir-heres: therefore the abundance that he hath gotten is perished.";
yng[36] = "Therefore my heart for Moab as pipes doth sound, And my heart for men of Kir-Heres As pipes doth sound, Therefore the abundance he made did perish.";
dby[36] = "Therefore my heart shall sound for Moab like pipes, and my heart shall sound like pipes for the men of Kir-heres; because the abundance that he hath gotten is perished.";
web[36] = "Therefore my heart shall sound for Moab like pipes, and my heart shall sound like pipes for the men of Kirheres: because the riches [that] he hath gotten have perished.";
hnv[36] = "Therefore my heart sounds for Mo\'av like pipes, and my heart sounds like pipes for the men of Kir-Heres: therefore the abundance that he has gotten is perished.";
vul[36] = "propterea cor meum ad Moab quasi tibiae resonabit et cor meum ad viros muri fictilis dabit sonitum tibiarum quia plus fecit quam potuit idcirco perierunt";
kjv[37] = "For every head [shall be] bald, and every beard clipped: upon all the hands [shall be] cuttings, and upon the loins sackcloth.";
rsv[37] = "&quot;For every head is shaved and every beard cut off; upon all the hands are gashes, and on the loins is sackcloth.";
asv[37] = "For every head is bald, and every beard clipped: upon all the hands are cuttings, and upon the loins sackcloth.";
yng[37] = "For every head [is] bald, and every beard diminished, On all hands cuttings, and on the loins -- sackcloth.";
dby[37] = "For every head is bald, and every beard clipped; upon all the hands are cuttings, and upon the loins sackcloth.";
web[37] = "For every head [shall be] bald, and every beard clipped: upon all the hands [shall be] cuttings, and upon the loins sackcloth.";
hnv[37] = "For every head is bald, and every beard clipped: on all the hands are cuttings, and on the loins sackcloth.";
vul[37] = "omne enim caput calvitium et omnis barba rasa erit in cunctis manibus conligatio et super omne dorsum cilicium";
kjv[38] = "[There shall be] lamentation generally upon all the housetops of Moab, and in the streets thereof: for I have broken Moab like a vessel wherein [is] no pleasure, saith the LORD.";
rsv[38] = "On all the housetops of Moab and in the squares there is nothing but lamentation; for I have broken Moab like a vessel for which no one cares, says the LORD.";
asv[38] = "On all the housetops of Moab and in the streets thereof there is lamentation every where; for I have broken Moab like a vessel wherein none delighteth, saith Jehovah.";
yng[38] = "On all roofs of Moab, and in her broad-places, All of it -- [is] lamentation, For I have broken Moab as a vessel in which there is no pleasure, An affirmation of Jehovah.";
dby[38] = "It is wholly lamentation upon all the housetops of Moab, and in the public places thereof; for I have broken Moab, like a vessel wherein is no pleasure, saith Jehovah.";
web[38] = "[There shall be] lamentation generally upon all the house-tops of Moab, and in its streets: for I have broken Moab like a vessel in which [is] no pleasure, saith the LORD.";
hnv[38] = "On all the housetops of Mo\'av and in the streets of it there is lamentation every where; for I have broken Mo\'av like a vessel in which none delights, says the LORD.";
vul[38] = "super omnia tecta Moab et in plateis eius omnis planctus quia contrivi Moab sicut vas inutile ait Dominus";
kjv[39] = "They shall howl, [saying], How is it broken down! how hath Moab turned the back with shame! so shall Moab be a derision and a dismaying to all them about him.";
rsv[39] = "How it is broken! How they wail! How Moab has turned his back in shame! So Moab has become a derision and a horror to all that are round about him.&quot;";
asv[39] = "How is it broken down! [how] do they wail! how hath Moab turned the back with shame! so shall Moab become a derision and a terror to all that are round about him.";
yng[39] = "How hath it been broken down! they have howled, How hath Moab turned the neck ashamed, And Moab hath been for a derision. And for a terror to all round about her.";
dby[39] = "They howl, How is it broken down! how hath Moab turned the back with shame! And Moab shall be a derision and a terror to all that are round about him.";
web[39] = "They shall howl, [saying], How is it broken down! how hath Moab turned the back with shame! so shall Moab be a derision and a dismaying to all them about him.";
hnv[39] = "How is it broken down! [how] do they wail! how has Mo\'av turned the back with shame! so shall Mo\'av become a derision and a terror to all who are round about him.";
vul[39] = "quomodo victa est et ululaverunt quomodo deiecit cervicem Moab et confusus est eritque Moab in derisum et in exemplum omnibus in circuitu suo";
kjv[40] = "For thus saith the LORD; Behold, he shall fly as an eagle, and shall spread his wings over Moab.";
rsv[40] = "For thus says the LORD: &quot;Behold, one shall fly swiftly like an eagle, and spread his wings against Moab;";
asv[40] = "For thus saith Jehovah: Behold, he shall fly as an eagle, and shall spread out his wings against Moab.";
yng[40] = "For thus said Jehovah: Lo, as an eagle he doth flee, And hath spread his wings unto Moab.";
dby[40] = "For thus saith Jehovah: Behold, he shall fly as an eagle, and shall spread forth his wings over Moab.";
web[40] = "For thus saith the LORD; Behold, he shall fly as an eagle, and shall spread his wings over Moab.";
hnv[40] = "For thus says the LORD: Behold, he shall fly as an eagle, and shall spread out his wings against Mo\'av.";
vul[40] = "haec dicit Dominus ecce quasi aquila evolabit et extendet alas suas ad Moab";
kjv[41] = "Kerioth is taken, and the strong holds are surprised, and the mighty men\'s hearts in Moab at that day shall be as the heart of a woman in her pangs.";
rsv[41] = "the cities shall be taken and the strongholds seized. The heart of the warriors of Moab shall be in that day like the heart of a woman in her pangs;";

yng[41] = "Captured have been the cities, And the strongholds are caught, And the heart of the mighty of Moab Hath been in that day as the heart of a distressed woman.";
dby[41] = "Kerijoth is taken, and the strongholds are seized, and at that day the heart of the mighty men of Moab shall be as the heart of a woman in her pangs.";

yng[42] = "And Moab hath been destroyed from [being] a people, For against Jehovah he exerted himself.";
dby[42] = "And Moab shall be destroyed from being a people, because he hath magnified himself against Jehovah.";
web[42] = "And Moab shall be destroyed from [being] a people, because he hath magnified [himself] against the LORD.";

kjv[43] = "Fear, and the pit, and the snare, [shall be] upon thee, O inhabitant of Moab, saith the LORD.";

yng[43] = "Fear, and a snare, and a gin, [are] for thee, O inhabitant of Moab -- an affirmation of Jehovah,";

hnv[43] = "Fear, and the pit, and the snare, are on you, inhabitant of Mo\'av, says the LORD.";
vul[43] = "pavor et fovea et laqueus super te o habitator Moab ait Dominus";
kjv[44] = "He that fleeth from the fear shall fall into the pit; and he that getteth up out of the pit shall be taken in the snare: for I will bring upon it, [even] upon Moab, the year of their visitation, saith the LORD.";
rsv[44] = "He who flees from the terror shall fall into the pit, and he who climbs out of the pit shall be caught in the snare. For I will bring these things upon Moab in the year of their punishment, says the LORD.";
asv[44] = "He that fleeth from the fear shall fall into the pit; and he that getteth up out of the pit shall be taken in the snare: for I will bring upon him, even upon Moab, the year of their visitation, saith Jehovah.";
yng[44] = "Whoso is fleeing because of the fear falleth into the snare, And whoso is coming up from the snare is captured by the gin, For I bring in unto her -- unto Moab -- The year of their inspection, An affirmation of Jehovah.";
dby[44] = "He that fleeth from the fear shall fall into the pit; and he that getteth up out of the pit shall be taken in the snare: for I will bring upon her, upon Moab, the year of their visitation, saith Jehovah.";
web[44] = "He that fleeth from the fear, shall fall into the pit; and he that getteth out of the pit, shall be taken in the snare: for I will bring upon it, [even] upon Moab, the year of their visitation, saith the LORD.";
hnv[44] = "He who flees from the fear shall fall into the pit; and he who gets up out of the pit shall be taken in the snare: for I will bring on him, even on Mo\'av, the year of their visitation, says the LORD.";
vul[44] = "qui fugit a facie pavoris cadet in foveam et qui conscenderit de fovea capietur laqueo adducam enim super Moab annum visitationis eorum dicit Dominus";
kjv[45] = "They that fled stood under the shadow of Heshbon because of the force: but a fire shall come forth out of Heshbon, and a flame from the midst of Sihon, and shall devour the corner of Moab, and the crown of the head of the tumultuous ones.";
rsv[45] = "&quot;In the shadow of Heshbon fugitives stop without strength; for a fire has gone forth from Heshbon, a flame from the house of Sihon; it has destroyed the forehead of Moab, the crown of the sons of tumult.";
asv[45] = "They that fled stand without strength under the shadow of Heshbon; for a fire is gone forth out of Heshbon, and a flame from the midst of Sihon, and hath devoured the corner of Moab, and the crown of the head of the tumultuous ones.";
yng[45] = "In the shadow of Heshbon stood powerless have fugitives, For fire hath gone forth from Heshbon, And a flame from within Sihon, And it consumeth the corner of Moab, And the crown of the sons of Shaon.";
dby[45] = "They that fled stood under the shadow of Heshbon powerless; for a fire hath come forth from Heshbon, and a flame from the midst of Sihon, and hath consumed the corner of Moab, and the crown of the head of the sons of tumult.";
web[45] = "They that fled stood under the shade of Heshbon because of the force: but a fire shall come out of Heshbon, and a flame from the midst of Sihon, and shall devour the corner of Moab, and the crown of the head of the tumultuous ones.";
hnv[45] = "Those who fled stand without strength under the shadow of Heshbon; for a fire is gone forth out of Heshbon, and a flame from the midst of Sichon, and has devoured the corner of Mo\'av, and the crown of the head of the tumultuous ones.";

kjv[46] = "Woe be unto thee, O Moab! the people of Chemosh perisheth: for thy sons are taken captives, and thy daughters captives.";

asv[46] = "Woe unto thee, O Moab! the people of Chemosh is undone; for thy sons are taken away captive, and thy daughters into captivity.";
yng[46] = "Wo to thee, O Moab, Perished hath the people of Chemosh, For thy sons were taken with the captives, And thy daughters with the captivity.";
dby[46] = "Woe to thee, Moab! The people of Chemosh is undone; for thy sons are taken away in captivity, and thy daughters are captives.";

web[47] = "Yet will I bring again the captivity of Moab in the latter days, saith the LORD. Thus far [is] the judgment of Moab.";
hnv[47] = "Yet will I bring back the captivity of Mo\'av in the latter days, says the LORD. Thus far is the judgment of Mo\'av.";
