csb[1] = "You will be righteous, LORD, even if I bring a case against you. Yet, I wish to contend with you: Why does the way of the wicked prosper? Why do all the treacherous live at ease?";
csb[2] = "You planted them, and they have taken root. They have grown and produced fruit. You are ever on their lips, but far from their conscience.";
csb[3] = "As for you, LORD, you know me; you see me. You test whether my heart is with you. Drag the wicked away like sheep to slaughter and set them apart for the day of killing.";
csb[4] = "How long will the land mourn and the grass of every field wither? Because of the evil of its residents, animals and birds have been swept away, for the people have said, &quot;He cannot see what our end will be.&quot;";
csb[5] = "If you have raced with runners and they have worn you out, how can you compete with horses? If you stumble in a peaceful land, what will you do in the thickets of the Jordan?";
csb[6] = "Even your brothers -- your own father\'s family -- even they were treacherous to you; even they have cried out loudly after you. Do not have confidence in them, though they speak well of you.";
csb[7] = "I have abandoned my house; I have deserted my inheritance. I have handed the love of my life over to her enemies.";
csb[8] = "My inheritance has behaved toward me like a lion in the forest. She has roared against me. Therefore, I hate her.";
csb[9] = "Is my inheritance like a hyena to me? Are birds of prey circling her? Go, gather all the wild animals; bring them to devour her.";
csb[10] = "Many shepherds have destroyed my vineyard; they have trampled my plot of land. They have turned my desirable plot into a desolate wasteland.";
csb[11] = "They have made it a desolation. It mourns, desolate, before me. All the land is desolate, but no one takes it to heart.";
csb[12] = "Over all the barren heights in the wilderness the destroyers have come, for the LORD has a sword that devours from one end of the earth to the other. No one has peace.";
csb[13] = "They have sown wheat but harvested thorns. They have exhausted themselves but have no profit. Be put to shame by your harvests because of the LORD\'s burning anger.";
csb[14] = "This is what the LORD says: &quot;Concerning all my evil neighbors who attack the inheritance that I bequeathed to my people, Israel, I am about to uproot them from their land, and I will uproot the house of Judah from them.";
csb[15] = "&quot;After I have uprooted them, I will once again have compassion on them and return each one to his inheritance and to his land.";
csb[16] = "&quot;If they will diligently learn the ways of my people -- to swear by my name, \'As the LORD lives,\' just as they taught my people to swear by Baal -- they will be built up among my people.";
csb[17] = "&quot;However, if they will not obey, then I will uproot and destroy that nation.&quot; This is the LORD\'s declaration.";
kjv[1] = "Righteous [art] thou, O LORD, when I plead with thee: yet let me talk with thee of [thy] judgments: Wherefore doth the way of the wicked prosper? [wherefore] are all they happy that deal very treacherously?";
rsv[1] = "Righteous art thou, O LORD, when I complain to thee; yet I would plead my case before thee. Why does the way of the wicked prosper? Why do all who are treacherous thrive?";
asv[1] = "Righteous art thou, O Jehovah, when I contend with thee; yet would I reason the cause with thee: wherefore doth the way of the wicked prosper? wherefore are all they at ease that deal very treacherously?";
yng[1] = "Righteous [art] Thou, O Jehovah, When I plead towards thee, Only, judgments do I speak with Thee, Wherefore did the way of the wicked prosper? At rest have been all treacherous dealers.";
dby[1] = "Righteous art thou, Jehovah, when I plead with thee; yet will I speak with thee of [thy] judgments. Wherefore doth the way of the wicked prosper? [wherefore] are all they at ease that deal very treacherously?";
web[1] = "Righteous [art] thou, O LORD, when I plead with thee: yet let me speak with thee of [thy] judgments: Why doth the way of the wicked prosper? [why] are they all happy that deal very treacherously?";
hnv[1] = "Righteous are you, LORD, when I contend with you; yet would I reason the cause with you: why does the way of the wicked prosper? why are all they at ease who deal very treacherously?";
vul[1] = "iustus quidem tu es Domine si disputem tecum verumtamen iusta loquar ad te quare via impiorum prosperatur bene est omnibus qui praevaricantur et inique agunt";
kjv[2] = "Thou hast planted them, yea, they have taken root: they grow, yea, they bring forth fruit: thou [art] near in their mouth, and far from their reins.";
rsv[2] = "Thou plantest them, and they take root; they grow and bring forth fruit; thou art near in their mouth and far from their heart.";
asv[2] = "Thou hast planted them, yea, they have taken root; they grow, yea, they bring forth fruit: thou art near in their mouth, and far from their heart.";
yng[2] = "Thou hast planted them, yea, they have taken root, They go on, yea, they have made fruit, Near [art] Thou in their mouth, And far off from their reins.";
dby[2] = "Thou hast planted them, they also have taken root: they advance, yea, they bring forth fruit: thou art near in their mouth, but far from their reins.";
web[2] = "Thou hast planted them, yes, they have taken root: they grow, yes, they bring forth fruit: thou [art] near in their mouth, and far from their reins.";
hnv[2] = "You have planted them, yes, they have taken root; they grow, yes, they bring forth fruit: you are near in their mouth, and far from their heart.";
vul[2] = "plantasti eos et radicem miserunt proficiunt et faciunt fructum prope es tu ori eorum et longe a renibus eorum";
kjv[3] = "But thou, O LORD, knowest me: thou hast seen me, and tried mine heart toward thee: pull them out like sheep for the slaughter, and prepare them for the day of slaughter.";
rsv[3] = "But thou, O LORD, knowest me; thou seest me, and triest my mind toward thee. Pull them out like sheep for the slaughter, and set them apart for the day of slaughter.";
asv[3] = "But thou, O Jehovah, knowest me; thou seest me, and triest my heart toward thee: pull them out like sheep for the slaughter, and prepare them for the day of slaughter.";
yng[3] = "And Thou, O Jehovah, Thou hast known me, Thou seest me, and hast tried my heart with Thee, Draw them away as sheep to slaughter, And separate them for a day of slaughter.";
dby[3] = "But thou, Jehovah, knowest me; thou hast seen me, and proved my heart toward thee. Drag them out like sheep for the slaughter, and set them apart for the day of slaughter.";
web[3] = "But thou, O LORD, knowest me: thou hast seen me, and tried my heart towards thee: pull them out like sheep for the slaughter, and prepare them for the day of slaughter.";
hnv[3] = "But you, LORD, know me; you see me, and try my heart toward you: pull them out like sheep for the slaughter, and prepare them for the day of slaughter.";
vul[3] = "et tu Domine nosti me vidisti me et probasti cor meum tecum congrega eos quasi gregem ad victimam et sanctifica eos in die occisionis";
kjv[4] = "How long shall the land mourn, and the herbs of every field wither, for the wickedness of them that dwell therein? the beasts are consumed, and the birds; because they said, He shall not see our last end.";
rsv[4] = "How long will the land mourn, and the grass of every field wither? For the wickedness of those who dwell in it the beasts and the birds are swept away, because men said, &quot;He will not see our latter end.&quot;";
asv[4] = "How long shall the land mourn, and the herbs of the whole country wither? for the wickedness of them that dwell therein, the beasts are consumed, and the birds; because they said, He shall not see our latter end.";
yng[4] = "Till when doth the earth mourn, And the herb of the whole field wither? For the wickedness of those dwelling in it, Consumed have been beast and fowl, Because they said, `He doth not see our latter end.\'";
dby[4] = "How long shall the land mourn, and the herbs of all the fields wither? Because of the wickedness of them that dwell therein, the beasts and the birds perish; for they say, He will not see our end.";
web[4] = "How long shall the land mourn, and the herbs of every field wither, for the wickedness of them that dwell therein? the beasts are consumed, and the birds; because they said, He will not see our last end.";
hnv[4] = "How long shall the land mourn, and the herbs of the whole country wither? for the wickedness of those who dwell therein, the animals are consumed, and the birds; because they said, He shall not see our latter end.";
vul[4] = "usquequo lugebit terra et herba omnis regionis siccabitur propter malitiam habitantium in ea consumptum est animal et volucre quoniam dixerunt non videbit novissima nostra";
kjv[5] = "If thou hast run with the footmen, and they have wearied thee, then how canst thou contend with horses? and [if] in the land of peace, [wherein] thou trustedst, [they wearied thee], then how wilt thou do in the swelling of Jordan?";
rsv[5] = "&quot;If you have raced with men on foot, and they have wearied you, how will you compete with horses? And if in a safe land you fall down, how will you do in the jungle of the Jordan?";
asv[5] = "If thou hast run with the footmen, and they have wearied thee, then how canst thou contend with horses? and though in a land of peace thou art secure, yet how wilt thou do in the pride of the Jordan?";
yng[5] = "For -- with footmen thou hast run, And they weary thee, And how dost thou fret thyself with horses! Even in the land of peace, [In which] thou art confident -- And how dost thou in the rising of Jordan!";
dby[5] = "If thou hast run with footmen, and they have wearied thee, how wilt thou then contend with horses? And if in a land of peace thou thinkest thyself in security, how wilt thou then do in the swelling of the Jordan?";
web[5] = "If thou hast run with the footmen, and they have wearied thee, then how canst thou contend with horses? and [if] in the land of peace, [in which] thou hast trusted, [they wearied thee], then how wilt thou do in the swelling of Jordan?";
hnv[5] = "If you have run with the footmen, and they have wearied you, then how can you contend with horses? and though in a land of shalom you are secure, yet how will you do in the pride of the Yarden?";
vul[5] = "si cum peditibus currens laborasti quomodo contendere poteris cum equis cum autem in terra pacis secura fueris quid facies in superbia Iordanis";

asv[6] = "For even thy brethren, and the house of thy father, even they have dealt treacherously with thee; even they have cried aloud after thee: believe them not, though they speak fair words unto thee.";
yng[6] = "For even thy brethren and the house of thy father, Even they dealt treacherously against thee, Even they -- they called after thee fully, Trust not in them, when they speak to thee good things.";

hnv[6] = "For even your brothers, and the house of your father, even they have dealt treacherously with you; even they have cried aloud after you: don\'t believe them, though they speak beautiful words to you.";

yng[8] = "Mine inheritance hath been to Me as a lion in a forest, She gave forth against Me with her voice, Therefore I have hated her.";

hnv[8] = "My heritage is become to me as a lion in the forest: she has uttered her voice against me; therefore I have hated her.";

kjv[9] = "Mine heritage [is] unto me [as] a speckled bird, the birds round about [are] against her; come ye, assemble all the beasts of the field, come to devour.";

rsv[14] = "Thus says the LORD concerning all my evil neighbors who touch the heritage which I have given my people Israel to inherit: &quot;Behold, I will pluck them up from their land, and I will pluck up the house of Judah from among them.";

yng[14] = "Thus said Jehovah concerning all my evil neighbours, who are striking against the inheritance that I caused my people -- Israel -- to inherit: `Lo, I am plucking them from off their ground, And the house of Judah I pluck out of their midst.";
dby[14] = "Thus saith Jehovah against all mine evil neighbours, that touch the inheritance which I have caused my people Israel to inherit: Behold, I will pluck them up out of their land, and pluck out the house of Judah from among them.";
