csb[1] = "If a man divorces his wife and she leaves him to marry another, can he ever return to her? Wouldn\'t such a land become totally defiled? But you! You have prostituted yourself with many partners -- can you return to me? This is the LORD\'s declaration.";
csb[2] = "Look to the barren heights and see. Where have you not been immoral? You sat waiting for them beside the highways like a nomad in the desert. You have defiled the land with your prostitution and wickedness.";
csb[3] = "This is why the showers haven\'t come -- why there has been no spring rain. You have the brazen look of a prostitute and refuse to be ashamed.";
csb[4] = "Haven\'t you recently called to me, &quot;My Father. You were my friend in my youth.";
csb[5] = "&quot;Will he bear a grudge forever? Will he be endlessly infuriated? &quot; This is what you have said, but you have done the evil things you are capable of.";
csb[6] = "In the days of King Josiah the LORD asked me, &quot;Have you seen what unfaithful Israel has done? She has ascended every high hill and gone under every green tree to prostitute herself there.";
csb[7] = "&quot;I thought, \'After she has done all these things, she will return to me.\' But she didn\'t return, and her treacherous sister Judah saw it.";
csb[8] = "&quot;I observed that it was because unfaithful Israel had committed adultery that I had sent her away and had given her a certificate of divorce. Nevertheless, her treacherous sister Judah was not afraid but also went and prostituted herself.";
csb[9] = "&quot;Indifferent to her prostitution, she defiled the land and committed adultery with stones and trees.";
csb[10] = "&quot;Yet in spite of all this, her treacherous sister Judah didn\'t return to me with all her heart -- only in pretense.&quot; This is the LORD\'s declaration.";
csb[11] = "The LORD announced to me, &quot;Unfaithful Israel has shown herself more righteous than treacherous Judah.";
csb[12] = "&quot;Go, proclaim these words to the north, and say, \'Return, unfaithful Israel. This is the LORD\'s declaration. I will not look on you with anger, for I am unfailing in my love. This is the LORD\'s declaration. I will not be angry forever.";
csb[13] = "&quot;Only acknowledge your guilt -- you have rebelled against the LORD your God. You have scattered your favors to strangers under every green tree and have not obeyed me. This is the LORD\'s declaration.";
csb[14] = "&quot; \'Return, you faithless children -- this is the LORD\'s declaration -- for I am your master, and I will take you, one from a city and two from a family, and I will bring you to Zion.";
csb[15] = "&quot;I will give you shepherds who are loyal to me, and they will shepherd you with knowledge and skill.";
csb[16] = "&quot;When you multiply and increase in the land, in those days -- this is the LORD\'s declaration -- no one will say again, &quot;The ark of the LORD\'s covenant.&quot; It will never come to mind, and no one will remember or miss it. Another one will not be made.";
csb[17] = "At that time Jerusalem will be called The LORD\'s Throne, and all the nations will be gathered to it, to the name of the LORD in Jerusalem. They will cease to follow the stubbornness of their evil hearts.";
csb[18] = "In those days the house of Judah will join with the house of Israel, and they will come together from the land of the north to the land I have given your ancestors to inherit.\' &quot;";
csb[19] = "I thought, &quot;How I long to make you my sons and give you a desirable land, the most beautiful inheritance of all the nations.&quot; I thought, &quot;You will call me \'My Father\' and never turn away from me.&quot;";
csb[20] = "However, as a woman may betray her lover, so you have betrayed me, house of Israel. This is the LORD\'s declaration.";
csb[21] = "A sound is heard on the barren heights: the children of Israel weeping and begging for mercy, for they have perverted their way; they have forgotten the LORD their God.";
csb[22] = "Return, you faithless children. I will heal your unfaithfulness. &quot;Here we are, coming to you, for you are the LORD our God.";
csb[23] = "&quot;Surely, falsehood comes from the hills, commotion from the mountains, but the salvation of Israel is only in the LORD our God.";
csb[24] = "&quot;From the time of our youth the shameful one has consumed what our fathers have worked for -- their flocks and their herds, their sons and their daughters.";
csb[25] = "&quot;Let us lie down in our shame; let our disgrace cover us. We have sinned against the LORD our God, both we and our fathers, from the time of our youth even to this day. We have not obeyed the LORD our God.&quot;";
kjv[1] = "They say, If a man put away his wife, and she go from him, and become another man\'s, shall he return unto her again? shall not that land be greatly polluted? but thou hast played the harlot with many lovers; yet return again to me, saith the LORD.";
rsv[1] = "&quot;If a man divorces his wife and she goes from him and becomes another man\'s wife, will he return to her? Would not that land be greatly polluted? You have played the harlot with many lovers; and would you return to me? says the LORD.";
asv[1] = "They say, If a man put away his wife, and she go from him, and become another man\'s, will he return unto her again? will not that land be greatly polluted? But thou hast played the harlot with many lovers; yet return again to me, saith Jehovah.";
yng[1] = "Saying, `Lo, one sendeth away his wife, And she hath gone from him, And she hath been to another man, Doth he turn back unto her again? Greatly defiled is not that land? And thou hast committed whoredom with many lovers, And turn again to Me, an affirmation of Jehovah.";

hnv[1] = "They say, If a man put away his wife, and she go from him, and become another man\'s, will he return to her again? Won\'t that land be greatly polluted? But you have played the prostitute with many lovers; yet return again to me, says the LORD.";
vul[1] = "vulgo dicitur si dimiserit vir uxorem suam et recedens ab eo duxerit virum alterum numquid revertetur ad eam ultra numquid non polluta et contaminata erit mulier illa tu autem fornicata es cum amatoribus multis tamen revertere ad me dicit Dominus";
kjv[2] = "Lift up thine eyes unto the high places, and see where thou hast not been lien with. In the ways hast thou sat for them, as the Arabian in the wilderness; and thou hast polluted the land with thy whoredoms and with thy wickedness.";
rsv[2] = "Lift up your eyes to the bare heights, and see! Where have you not been lain with? By the waysides you have sat awaiting lovers like an Arab in the wilderness. You have polluted the land with your vile harlotry.";

rsv[16] = "And when you have multiplied and increased in the land, in those days, says the LORD, they shall no more say, &quot;The ark of the covenant of the LORD.&quot; It shall not come to mind, or be remembered, or missed; it shall not be made again.";

yng[16] = "And it hath come to pass, when ye are multiplied, And have been fruitful in the land, In those days -- an affirmation of Jehovah, They say not any more, `The ark of the covenant of Jehovah,\' Nor doth it go up on the heart, Nor do they remember concerning it, Nor do they inspect, nor is it made again.";
dby[16] = "And it shall come to pass, when ye are multiplied in the land and become fruitful, in those days, saith Jehovah, they shall say no more, Ark of the covenant of Jehovah! neither shall it come to mind, nor shall they remember it, nor shall they visit [it]; neither shall it be done any more.";
web[16] = "And it shall come to pass, when ye shall be multiplied and increased in the land, in those days, saith the LORD, they shall say no more, The ark of the covenant of the LORD: neither shall it come to mind: neither shall they remember it; neither shall they visit [it]; neither shall [that] be done any more.";
hnv[16] = "It shall come to pass, when you are multiplied and increased in the land, in those days, says the LORD, they shall say no more, The ark of the covenant of the LORD; neither shall it come to mind; neither shall they remember it; neither shall they miss it; neither shall it be made any more.";
vul[16] = "cumque multiplicati fueritis et creveritis in terra in diebus illis ait Dominus non dicent ultra arca testamenti Domini neque ascendet super cor neque recordabuntur illius nec visitabitur nec fiet ultra";
kjv[17] = "At that time they shall call Jerusalem the throne of the LORD; and all the nations shall be gathered unto it, to the name of the LORD, to Jerusalem: neither shall they walk any more after the imagination of their evil heart.";
csb[17] = "Surely, falsehood comes from the hills, commotion from the mountains, but the salvation of Israel is only in the LORD our God.";
rsv[17] = "At that time Jerusalem shall be called the throne of the LORD, and all nations shall gather to it, to the presence of the LORD in Jerusalem, and they shall no more stubbornly follow their own evil heart.";
asv[17] = "At that time they shall call Jerusalem the throne of Jehovah; and all the nations shall be gathered unto it, to the name of Jehovah, to Jerusalem: neither shall they walk any more after the stubbornness of their evil heart.";
yng[17] = "At that time they cry to Jerusalem, `O throne of Jehovah,\' And gathered unto her hath been all the nations, For the name of Jehovah, to Jerusalem, Nor do they go any more after the stubbornness of their evil heart.";
dby[17] = "At that time they shall call Jerusalem the throne of Jehovah; and all the nations shall be gathered unto it, to the name of Jehovah, to Jerusalem; and they shall no more walk after the stubbornness of their evil heart.";
web[17] = "At that time they shall call Jerusalem the throne of the LORD; and all the nations shall be gathered to it, to the name of the LORD, to Jerusalem; neither shall they walk any more after the imagination of their evil heart.";
hnv[17] = "At that time they shall call Yerushalayim the throne of the LORD; and all the nations shall be gathered to it, to the name of the LORD, to Yerushalayim: neither shall they walk any more after the stubbornness of their evil heart.";
vul[17] = "in tempore illo vocabunt Hierusalem solium Domini et congregabuntur ad eam omnes gentes in nomine Domini in Hierusalem et non ambulabunt post pravitatem cordis sui pessimi";
kjv[18] = "In those days the house of Judah shall walk with the house of Israel, and they shall come together out of the land of the north to the land that I have given for an inheritance unto your fathers.";
csb[18] = "From the time of our youth the shameful one* has consumed what our fathers have worked for -- their flocks and their herds, their sons and their daughters.";
rsv[18] = "In those days the house of Judah shall join the house of Israel, and together they shall come from the land of the north to the land that I gave your fathers for a heritage.";
asv[18] = "In those days the house of Judah shall walk with the house of Israel, and they shall come together out of the land of the north to the land that I gave for an inheritance unto your fathers.";
yng[18] = "In those days do the house of Judah Go unto the house of Israel, And they come together from the land of the south, unto the land That I caused your fathers to inherit.";
dby[18] = "In those days the house of Judah shall walk with the house of Israel; and they shall come together out of the land of the north, to the land which I caused your fathers to inherit.";
web[18] = "In those days the house of Judah shall walk with the house of Israel, and they shall come together from the land of the north to the land that I have given for an inheritance to your fathers.";
hnv[18] = " In those days the house of Yehudah shall walk with the house of Yisra\'el, and they shall come together out of the land of the north to the land that I gave for an inheritance to your fathers.";
vul[18] = "in diebus illis ibit domus Iuda ad domum Israhel et venient simul de terra aquilonis ad terram quam dedi patribus vestris";
kjv[19] = "But I said, How shall I put thee among the children, and give thee a pleasant land, a goodly heritage of the hosts of nations? and I said, Thou shalt call me, My father; and shalt not turn away from me.";
csb[19] = "Let us lie down in our shame; let our disgrace cover us. We have sinned against the LORD our God, both we and our fathers, from the time of our youth even to this day. We have not obeyed the voice of the LORD our God.&quot;";
rsv[19] = "&quot;\'I thought how I would set you among my sons, and give you a pleasant land, a heritage most beauteous of all nations. And I thought you would call me, My Father, and would not turn from following me.";
asv[19] = "But I said, How I will put thee among the children, and give thee a pleasant land, a goodly heritage of the hosts of the nations! and I said, Ye shall call me My Father, and shall not turn away from following me.";
yng[19] = "And I have said, How do I put thee among the sons, And give to thee a desirable land, A beauteous inheritance of the hosts of nations, And I say, My father -- ye do call to Me, And from after Me ye do not turn back.";
dby[19] = "And as for me, I said, How shall I put thee among the children, and give thee the pleasant land, the goodly inheritance of the hosts of the nations? And I said, Thou shalt call me, My father; and shalt not turn away from following me.";
web[19] = "But I said, How shall I put thee among the children, and give thee a pleasant land, a goodly heritage of the hosts of nations? and I said, Thou shalt call me, My father; and shalt not turn away from me.";
hnv[19] = "But I said, How I will put you among the children, and give you a pleasant land, a goodly heritage of the hosts of the nations! and I said, You shall call me My Father, and shall not turn away from following me.";
vul[19] = "ego autem dixi quomodo ponam te in filiis et tribuam tibi terram desiderabilem hereditatem praeclaram exercituum gentium et dixi patrem vocabis me et post me ingredi non cessabis";
kjv[20] = "Surely [as] a wife treacherously departeth from her husband, so have ye dealt treacherously with me, O house of Israel, saith the LORD.";
csb[20] = "If* a man divorces his wife and she leaves him to marry another, can he ever return to her? Wouldn\'t such a land* become totally defiled? But you! You have played the prostitute with many partners -- can you return to Me? This is the Lord\'s declaration.";
rsv[20] = "Surely, as a faithless wife leaves her husband, so have you been faithless to me, O house of Israel, says the LORD.\'&quot;";
asv[20] = "Surely as a wife treacherously departeth from her husband, so have ye dealt treacherously with me, O house of Israel, saith Jehovah.";
yng[20] = "But -- a woman hath deceived her friend, So ye have dealt treacherously with Me, O house of Israel, an affirmation of Jehovah.";
dby[20] = "Surely [as] a woman treacherously departeth from her companion, so have ye dealt treacherously with me, O house of Israel, saith Jehovah.";
web[20] = "Surely [as] a wife treacherously departeth from her husband, so have ye dealt treacherously with me, O house of Israel, saith the LORD.";
hnv[20] = "Surely as a wife treacherously departs from her husband, so have you dealt treacherously with me, house of Yisra\'el, says the LORD.";
vul[20] = "sed quomodo si contemnat mulier amatorem suum sic contempsit me domus Israhel dicit Dominus";
kjv[21] = "A voice was heard upon the high places, weeping [and] supplications of the children of Israel: for they have perverted their way, [and] they have forgotten the LORD their God.";
csb[21] = "Look to the barren heights and see. Where have you not been immoral? You sat waiting for them beside the highways like a nomad in the desert. You have defiled the land with your prostitution and wickedness.";
rsv[21] = "A voice on the bare heights is heard, the weeping and pleading of Israel\'s sons, because they have perverted their way, they have forgotten the LORD their God.";
asv[21] = "A voice is heard upon the bare heights, the weeping [and] the supplications of the children of Israel; because they have perverted their way, they have forgotten Jehovah their God.";
yng[21] = "A voice on high places is heard -- weeping, Supplications of the sons of Israel, For they have made perverse their way, They have forgotten Jehovah their God.";
dby[21] = "A voice is heard upon the heights, the weeping supplications of the children of Israel; for they have perverted their way, they have forgotten Jehovah their God.";
web[21] = "A voice was heard upon the high places, weeping [and] supplications of the children of Israel: for they have perverted their way, [and] they have forgotten the LORD their God.";
hnv[21] = "A voice is heard on the bare heights, the weeping [and] the petitions of the children of Yisra\'el; because they have perverted their way, they have forgotten the LORD their God.";
vul[21] = "vox in viis audita est ploratus et ululatus filiorum Israhel quoniam iniquam fecerunt viam suam obliti sunt Domini Dei sui";
kjv[22] = "Return, ye backsliding children, [and] I will heal your backslidings. Behold, we come unto thee; for thou [art] the LORD our God.";
csb[22] = "This is why the showers haven\'t come -- why there has been no spring rain. You have the brazen look of a prostitute* and refuse to be ashamed.";
rsv[22] = "&quot;Return, O faithless sons, I will heal your faithlessness.&quot; &quot;Behold, we come to thee; for thou art the LORD our God.";
asv[22] = "Return, ye backsliding children, I will heal your backslidings. Behold, we are come unto thee; for thou art Jehovah our God.";
yng[22] = "Turn back, O backsliding sons, I cause your backslidings to cease. -- Behold us, we have come to Thee, For Thou [art] Jehovah our God.";
dby[22] = "-- Return, backsliding children; I will heal your backslidings. ... Behold, we come unto thee; for thou art Jehovah our God.";
web[22] = "Return, ye backsliding children, [and] I will heal your backslidings. Behold, we come to thee; for thou [art] the LORD our God.";
hnv[22] = "Return, you backsliding children, I will heal your backsliding. Behold, we are come to you; for you are the LORD our God.";
vul[22] = "convertimini filii revertentes et sanabo aversiones vestras ecce nos venimus ad te tu enim es Dominus Deus noster";
kjv[23] = "Truly in vain [is salvation hoped for] from the hills, [and from] the multitude of mountains: truly in the LORD our God [is] the salvation of Israel.";
csb[23] = "Have you not lately called to Me, &quot;My Father. You were my friend in my youth.";
rsv[23] = "Truly the hills are a delusion, the orgies on the mountains. Truly in the LORD our God is the salvation of Israel.";
asv[23] = "Truly in vain is [the help that is looked for] from the hills, the tumult on the mountains: truly in Jehovah our God is the salvation of Israel.";
yng[23] = "Surely in vain from the heights, The multitude of mountains -- Surely in Jehovah our God [is] the salvation of Israel.";
dby[23] = "Truly in vain [is salvation looked for] from the hills, [and] the multitude of mountains; truly in Jehovah our God is the salvation of Israel.";
web[23] = "Truly in vain [is salvation hoped for] from the hills, [and from] the multitude of mountains: truly in the LORD our God [is] the salvation of Israel.";
hnv[23] = "Truly in vain is [the help that is looked for] from the hills, the tumult on the mountains: truly in the LORD our God is the salvation of Yisra\'el.";
vul[23] = "vere mendaces erant colles multitudo montium vere in Domino Deo nostro salus Israhel";
kjv[24] = "For shame hath devoured the labour of our fathers from our youth; their flocks and their herds, their sons and their daughters.";
csb[24] = "Will He bear a grudge forever? Will He be endlessly infuriated? &quot; This is what you have said, but you have done the evil things you are capable of.";
rsv[24] = "&quot;But from our youth the shameful thing has devoured all for which our fathers labored, their flocks and their herds, their sons and their daughters.";
asv[24] = "But the shameful thing hath devoured the labor of our fathers from our youth, their flocks and their herds, their sons and their daughters.";
yng[24] = "And the shameful thing hath devoured The labour of our fathers from our youth, Their flock and their herd, Their sons and their daughters.";
dby[24] = "But shame hath devoured the labour of our fathers from our youth; their flocks and their herds, their sons and their daughters.";
web[24] = "For shame hath devoured the labor of our fathers from our youth; their flocks and their herds, their sons and their daughters.";
hnv[24] = "But the shameful thing has devoured the labor of our fathers from our youth, their flocks and their herds, their sons and their daughters.";

kjv[25] = "We lie down in our shame, and our confusion covereth us: for we have sinned against the LORD our God, we and our fathers, from our youth even unto this day, and have not obeyed the voice of the LORD our God.";
csb[25] = "In the days of King Josiah the LORD asked me, &quot;Have you seen what unfaithful Israel has done? She has ascended every high hill and gone under every green tree to prostitute herself there.";
rsv[25] = "Let us lie down in our shame, and let our dishonor cover us; for we have sinned against the LORD our God, we and our fathers, from our youth even to this day; and we have not obeyed the voice of the LORD our God.&quot;";
asv[25] = "Let us lie down in our shame, and let our confusion cover us; for we have sinned against Jehovah our God, we and our fathers, from our youth even unto this day; and we have not obeyed the voice of Jehovah our God.";
yng[25] = "We have lain down in our shame, and cover us doth our confusion, For against Jehovah our God we have sinned, We, and our fathers, from our youth even unto this day, Nor have we hearkened to the voice of Jehovah our God!";
dby[25] = "We lie down in our shame, and our confusion covereth us; for we have sinned against Jehovah our God, we and our fathers, from our youth even unto this day, and have not hearkened to the voice of Jehovah our God.";
web[25] = "We lie down in our shame, and our confusion covereth us: for we have sinned against the LORD our God, we and our fathers, from our youth even to this day, and have not obeyed the voice of the LORD our God.";
hnv[25] = " Let us lie down in our shame, and let our confusion cover us; for we have sinned against the LORD our God, we and our fathers, from our youth even to this day; and we have not obeyed the voice of the LORD our God.";
vul[25] = "dormiemus in confusione nostra et operiet nos ignominia nostra quoniam Domino Deo nostro peccavimus nos et patres nostri ab adulescentia nostra usque ad hanc diem et non audivimus vocem Domini Dei nostri";
