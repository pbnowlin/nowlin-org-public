csb[1] = "This is what the LORD says: &quot;Go, buy a potter\'s clay jar. Take some of the elders of the people and some of the leading priests";
csb[2] = "&quot;and go out to Ben Hinnom Valley near the entrance of the Potsherd Gate. Proclaim there the words I speak to you.";
csb[3] = "&quot;Say, \'Hear the word of the LORD, kings of Judah and residents of Jerusalem. This is what the LORD of Armies, the God of Israel, says: I am going to bring such disaster on this place that everyone who hears about it will shudder";
csb[4] = "&quot;because they have abandoned me and made this a foreign place. They have burned incense in it to other gods that they, their fathers, and the kings of Judah have never known. They have filled this place with the blood of the innocent.";
csb[5] = "&quot;They have built high places to Baal on which to burn their children in the fire as burnt offerings to Baal, something I have never commanded or mentioned; I never entertained the thought.";
csb[6] = "&quot; \'Therefore, look, the days are coming -- this is the LORD\'s declaration -- when this place will no longer be called Topheth and Ben Hinnom Valley, but Slaughter Valley.";
csb[7] = "&quot;I will spoil the plans of Judah and Jerusalem in this place. I will make them fall by the sword before their enemies, by the hand of those who intend to take their life. I will provide their corpses as food for the birds of the sky and for the wild animals of the land.";
csb[8] = "&quot;I will make this city desolate, an object of scorn. Everyone who passes by it will be appalled and scoff because of all its wounds.";
csb[9] = "&quot;I will make them eat the flesh of their sons and their daughters, and they will eat each other\'s flesh in the distressing siege inflicted on them by their enemies who intend to take their life.\'";
csb[10] = "&quot;Then you are to shatter the jar in the presence of the people going with you,";
csb[11] = "&quot;and you are to proclaim to them, \'This is what the LORD of Armies says: I will shatter these people and this city, like one shatters a potter\'s jar that can never again be mended. They will bury the dead in Topheth because there is no other place for burials.";
csb[12] = "&quot;That is what I will do to this place -- this is the declaration of the LORD -- and to its residents, making this city like Topheth.";
csb[13] = "&quot;The houses of Jerusalem and the houses of the kings of Judah will become impure like that place Topheth -- all the houses on whose rooftops they have burned incense to all the stars in the sky and poured out drink offerings to other gods.\' &quot;";
csb[14] = "Jeremiah returned from Topheth, where the LORD had sent him to prophesy, stood in the courtyard of the LORD\'s temple, and proclaimed to all the people,";
csb[15] = "&quot;This is what the LORD of Armies, the God of Israel, says: \'I am about to bring on this city -- and on all its cities -- every disaster that I spoke against it, for they have become obstinate, not obeying my words.\' &quot;";
