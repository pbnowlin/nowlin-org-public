csb[1] = "This is the word of the LORD that came to the prophet Jeremiah about the Philistines before Pharaoh defeated Gaza.";
csb[2] = "This is what the LORD says: Look, water is rising from the north and becoming an overflowing wadi. It will overflow the land and everything in it, the cities and their inhabitants. The people will cry out, and every inhabitant of the land will wail.";
csb[3] = "At the sound of the stomping hooves of his stallions, the rumbling of his chariots, and the clatter of their wheels, fathers will not turn back for their sons. They will be utterly helpless";
csb[4] = "on account of the day that is coming to destroy all the Philistines, to cut off from Tyre and Sidon every remaining ally. Indeed, the LORD is about to destroy the Philistines, the remnant of the coastland of Caphtor.";
csb[5] = "Baldness is coming to Gaza; Ashkelon will become silent. Remnant of their valley, how long will you gash yourself?";
csb[6] = "Oh, sword of the LORD! How long will you be restless? Go back to your sheath; be still; be silent!";
csb[7] = "How can it rest when the LORD has given it a command? He has assigned it against Ashkelon and the shore of the sea.";
