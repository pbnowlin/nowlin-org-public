csb[1] = "This is the word that came to Jeremiah from the LORD in the tenth year of King Zedekiah of Judah, which was the eighteenth year of Nebuchadnezzar.";
csb[2] = "At that time, the army of the king of Babylon was besieging Jerusalem, and the prophet Jeremiah was imprisoned in the guard\'s courtyard in the palace of the king of Judah.";
csb[3] = "King Zedekiah of Judah had imprisoned him, saying, &quot;Why are you prophesying as you do? You say, \'This is what the LORD says: Look, I am about to hand this city over to Babylon\'s king, and he will capture it.";
csb[4] = "&quot;King Zedekiah of Judah will not escape from the Chaldeans; indeed, he will certainly be handed over to Babylon\'s king. They will speak face to face and meet eye to eye.";
csb[5] = "&quot;He will take Zedekiah to Babylon, where he will stay until I attend to him -- this is the LORD\'s declaration. For you will fight the Chaldeans, but you will not succeed.\' &quot;";
csb[6] = "Jeremiah replied, &quot;The word of the LORD came to me:";
csb[7] = "&quot;Watch! Hanamel, the son of your uncle Shallum, is coming to you to say, \'Buy my field in Anathoth for yourself, for you own the right of redemption to buy it.\'";
csb[8] = "&quot;Then, as the LORD had said, my cousin Hanamel came to the guard\'s courtyard and urged me, \'Please buy my field in Anathoth in the land of Benjamin, for you own the right of inheritance and redemption. Buy it for yourself.\' Then I knew that this was the word of the LORD.";
csb[9] = "&quot;So I bought the field in Anathoth from my cousin Hanamel, and I weighed out the silver to him -- seventeen shekels of silver.";
csb[10] = "&quot;I recorded it on a scroll, sealed it, called in witnesses, and weighed out the silver on the scales.";
csb[11] = "&quot;I took the purchase agreement -- the sealed copy with its terms and conditions and the open copy --";
csb[12] = "&quot;and gave the purchase agreement to Baruch son of Neriah, son of Mahseiah. I did this in the sight of my cousin Hanamel, the witnesses who had signed the purchase agreement, and all the Judeans sitting in the guard\'s courtyard.";
csb[13] = "&quot;I charged Baruch in their sight,";
csb[14] = "&quot;\'This is what the LORD of Armies, the God of Israel, says: Take these scrolls -- this purchase agreement with the sealed copy and this open copy -- and put them in an earthen storage jar so they will last a long time.";
csb[15] = "&quot;For this is what the LORD of Armies, the God of Israel, says: Houses, fields, and vineyards will again be bought in this land.\'";
csb[16] = "&quot;After I had given the purchase agreement to Baruch, son of Neriah, I prayed to the LORD:";
csb[17] = "&quot;Oh, Lord GOD! You yourself made the heavens and earth by your great power and with your outstretched arm. Nothing is too difficult for you!";
csb[18] = "&quot;You show faithful love to thousands but lay the fathers\' iniquity on their sons\' laps after them, great and mighty God whose name is the LORD of Armies,";
csb[19] = "&quot;the one great in counsel and powerful in action. Your eyes are on all the ways of the children of men in order to reward each person according to his ways and as the result of his actions.";
csb[20] = "&quot;You performed signs and wonders in the land of Egypt and still do today, both in Israel and among all mankind. You made a name for yourself, as is the case today.";
csb[21] = "&quot;You brought your people Israel out of Egypt with signs and wonders, with a strong hand and an outstretched arm, and with great terror.";
csb[22] = "&quot;You gave them this land you swore to give to their ancestors, a land flowing with milk and honey.";
csb[23] = "&quot;They entered and possessed it, but they did not obey you or live according to your instructions. They failed to perform all you commanded them to do, and so you have brought all this disaster on them.";
csb[24] = "&quot;Look! Siege ramps have come against the city to capture it, and the city, as a result of the sword, famine, and plague, has been handed over to the Chaldeans who are fighting against it. What you have spoken has happened. Look, you can see it!";
csb[25] = "&quot;Yet you, Lord GOD, have said to me, \'Purchase the field and call in witnesses\' -- even though the city has been handed over to the Chaldeans! &quot;";
csb[26] = "The word of the LORD came to Jeremiah:";
csb[27] = "&quot;Look, I am the LORD, the God over every creature. Is anything too difficult for me?";
csb[28] = "&quot;Therefore, this is what the LORD says: I am about to hand this city over to the Chaldeans, to Babylon\'s king Nebuchadnezzar, and he will capture it.";
csb[29] = "&quot;The Chaldeans who are fighting against this city will come and set this city on fire. They will burn it, including the houses where incense has been burned to Baal on their rooftops and where drink offerings have been poured out to other gods to anger me.";
csb[30] = "&quot;From their youth, the Israelites and Judeans have done nothing but what is evil in my sight! They have done nothing but anger me by the work of their hands&quot; -- this is the LORD\'s declaration --";
csb[31] = "&quot;for this city has caused my wrath and fury from the day it was built until now. I will therefore remove it from my presence";
csb[32] = "&quot;because of all the evil the Israelites and Judeans have done to anger me -- they, their kings, their officials, their priests, and their prophets, the men of Judah, and the residents of Jerusalem.";
csb[33] = "&quot;They have turned their backs to me and not their faces. Though I taught them time and time again, they do not listen and receive discipline.";
csb[34] = "&quot;They have placed their abhorrent things in the house that bears my name and have defiled it.";
csb[35] = "&quot;They have built the high places of Baal in Ben Hinnom Valley to sacrifice their sons and daughters in the fire to Molech -- something I had not commanded them. I had never entertained the thought that they do this detestable act causing Judah to sin!";
csb[36] = "&quot;Now therefore, this is what the LORD, the God of Israel, says to this city about which you said, \'It has been handed over to Babylon\'s king through sword, famine, and plague\':";
csb[37] = "&quot;I will certainly gather them from all the lands where I have banished them in my anger, rage and intense wrath, and I will return them to this place and make them live in safety.";
csb[38] = "&quot;They will be my people, and I will be their God.";
csb[39] = "&quot;I will give them integrity of heart and action so that they will fear me always, for their good and for the good of their descendants after them.";
csb[40] = "&quot;I will make a permanent covenant with them: I will never turn away from doing good to them, and I will put fear of me in their hearts so they will never again turn away from me.";
csb[41] = "&quot;I will take delight in them to do what is good for them, and with all my heart and mind I will faithfully plant them in this land.";
csb[42] = "&quot;For this is what the LORD says: Just as I have brought all this terrible disaster on these people, so am I about to bring on them all the good I am promising them.";
csb[43] = "&quot;Fields will be bought in this land about which you are saying, \'It\'s a desolation without people or animals; it has been handed over to the Chaldeans! \'";
csb[44] = "&quot;Fields will be purchased, the transaction written on a scroll and sealed, and witnesses will be called on in the land of Benjamin, in the areas surrounding Jerusalem, and in Judah\'s cities -- the cities of the hill country, the cities of the Judean foothills, and the cities of the Negev -- because I will restore their fortunes.&quot; This is the LORD\'s declaration.";
kjv[1] = "The word that came to Jeremiah from the LORD in the tenth year of Zedekiah king of Judah, which [was] the eighteenth year of Nebuchadrezzar.";
kjv[2] = "For then the king of Babylon\'s army besieged Jerusalem: and Jeremiah the prophet was shut up in the court of the prison, which [was] in the king of Judah\'s house.";
kjv[3] = "For Zedekiah king of Judah had shut him up, saying, Wherefore dost thou prophesy, and say, Thus saith the LORD, Behold, I will give this city into the hand of the king of Babylon, and he shall take it;";
kjv[4] = "And Zedekiah king of Judah shall not escape out of the hand of the Chaldeans, but shall surely be delivered into the hand of the king of Babylon, and shall speak with him mouth to mouth, and his eyes shall behold his eyes;";
kjv[5] = "And he shall lead Zedekiah to Babylon, and there shall he be until I visit him, saith the LORD: though ye fight with the Chaldeans, ye shall not prosper.";
kjv[6] = "And Jeremiah said, The word of the LORD came unto me, saying,";
kjv[7] = "Behold, Hanameel the son of Shallum thine uncle shall come unto thee, saying, Buy thee my field that [is] in Anathoth: for the right of redemption [is] thine to buy [it].";
kjv[8] = "So Hanameel mine uncle\'s son came to me in the court of the prison according to the word of the LORD, and said unto me, Buy my field, I pray thee, that [is] in Anathoth, which [is] in the country of Benjamin: for the right of inheritance [is] thine, and the redemption [is] thine; buy [it] for thyself. Then I knew that this [was] the word of the LORD.";
kjv[9] = "And I bought the field of Hanameel my uncle\'s son, that [was] in Anathoth, and weighed him the money, [even] seventeen shekels of silver.";
kjv[10] = "And I subscribed the evidence, and sealed [it], and took witnesses, and weighed [him] the money in the balances.";
kjv[11] = "So I took the evidence of the purchase, [both] that which was sealed [according] to the law and custom, and that which was open:";
kjv[12] = "And I gave the evidence of the purchase unto Baruch the son of Neriah, the son of Maaseiah, in the sight of Hanameel mine uncle\'s [son], and in the presence of the witnesses that subscribed the book of the purchase, before all the Jews that sat in the court of the prison.";
kjv[13] = "And I charged Baruch before them, saying,";
kjv[14] = "Thus saith the LORD of hosts, the God of Israel; Take these evidences, this evidence of the purchase, both which is sealed, and this evidence which is open; and put them in an earthen vessel, that they may continue many days.";
kjv[15] = "For thus saith the LORD of hosts, the God of Israel; Houses and fields and vineyards shall be possessed again in this land.";
kjv[16] = "Now when I had delivered the evidence of the purchase unto Baruch the son of Neriah, I prayed unto the LORD, saying,";
kjv[17] = "Ah Lord GOD! behold, thou hast made the heaven and the earth by thy great power and stretched out arm, [and] there is nothing too hard for thee:";
kjv[18] = "Thou shewest lovingkindness unto thousands, and recompensest the iniquity of the fathers into the bosom of their children after them: the Great, the Mighty God, the LORD of hosts, [is] his name,";
kjv[19] = "Great in counsel, and mighty in work: for thine eyes [are] open upon all the ways of the sons of men: to give every one according to his ways, and according to the fruit of his doings:";
kjv[20] = "Which hast set signs and wonders in the land of Egypt, [even] unto this day, and in Israel, and among [other] men; and hast made thee a name, as at this day;";
kjv[21] = "And hast brought forth thy people Israel out of the land of Egypt with signs, and with wonders, and with a strong hand, and with a stretched out arm, and with great terror;";
kjv[22] = "And hast given them this land, which thou didst swear to their fathers to give them, a land flowing with milk and honey;";
kjv[23] = "And they came in, and possessed it; but they obeyed not thy voice, neither walked in thy law; they have done nothing of all that thou commandedst them to do: therefore thou hast caused all this evil to come upon them:";
kjv[24] = "Behold the mounts, they are come unto the city to take it; and the city is given into the hand of the Chaldeans, that fight against it, because of the sword, and of the famine, and of the pestilence: and what thou hast spoken is come to pass; and, behold, thou seest [it].";
kjv[25] = "And thou hast said unto me, O Lord GOD, Buy thee the field for money, and take witnesses; for the city is given into the hand of the Chaldeans.";
kjv[26] = "Then came the word of the LORD unto Jeremiah, saying,";
kjv[27] = "Behold, I [am] the LORD, the God of all flesh: is there any thing too hard for me?";
kjv[28] = "Therefore thus saith the LORD; Behold, I will give this city into the hand of the Chaldeans, and into the hand of Nebuchadrezzar king of Babylon, and he shall take it:";
kjv[29] = "And the Chaldeans, that fight against this city, shall come and set fire on this city, and burn it with the houses, upon whose roofs they have offered incense unto Baal, and poured out drink offerings unto other gods, to provoke me to anger.";
kjv[30] = "For the children of Israel and the children of Judah have only done evil before me from their youth: for the children of Israel have only provoked me to anger with the work of their hands, saith the LORD.";
kjv[31] = "For this city hath been to me [as] a provocation of mine anger and of my fury from the day that they built it even unto this day; that I should remove it from before my face,";
kjv[32] = "Because of all the evil of the children of Israel and of the children of Judah, which they have done to provoke me to anger, they, their kings, their princes, their priests, and their prophets, and the men of Judah, and the inhabitants of Jerusalem.";
kjv[33] = "And they have turned unto me the back, and not the face: though I taught them, rising up early and teaching [them], yet they have not hearkened to receive instruction.";
kjv[34] = "But they set their abominations in the house, which is called by my name, to defile it.";
kjv[35] = "And they built the high places of Baal, which [are] in the valley of the son of Hinnom, to cause their sons and their daughters to pass through [the fire] unto Molech; which I commanded them not, neither came it into my mind, that they should do this abomination, to cause Judah to sin.";
kjv[36] = "And now therefore thus saith the LORD, the God of Israel, concerning this city, whereof ye say, It shall be delivered into the hand of the king of Babylon by the sword, and by the famine, and by the pestilence;";
kjv[37] = "Behold, I will gather them out of all countries, whither I have driven them in mine anger, and in my fury, and in great wrath; and I will bring them again unto this place, and I will cause them to dwell safely:";
kjv[38] = "And they shall be my people, and I will be their God:";
kjv[39] = "And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after them:";
kjv[40] = "And I will make an everlasting covenant with them, that I will not turn away from them, to do them good; but I will put my fear in their hearts, that they shall not depart from me.";
kjv[41] = "Yea, I will rejoice over them to do them good, and I will plant them in this land assuredly with my whole heart and with my whole soul.";
kjv[42] = "For thus saith the LORD; Like as I have brought all this great evil upon this people, so will I bring upon them all the good that I have promised them.";
kjv[43] = "And fields shall be bought in this land, whereof ye say, [It is] desolate without man or beast; it is given into the hand of the Chaldeans.";
kjv[44] = "Men shall buy fields for money, and subscribe evidences, and seal [them], and take witnesses in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, and in the cities of the mountains, and in the cities of the valley, and in the cities of the south: for I will cause their captivity to return, saith the LORD.";

rsv[8] = "Then Han\'amel my cousin came to me in the court of the guard, in accordance with the word of the LORD, and said to me, \'Buy my field which is at An\'athoth in the land of Benjamin, for the right of possession and redemption is yours; buy it for yourself.\' Then I knew that this was the word of the LORD.";
asv[8] = "So Hanamel mine uncle\'s son came to me in the court of the guard according to the word of Jehovah, and said unto me, Buy my field, I pray thee, that is in Anathoth, which is in the land of Benjamin; for the right of inheritance is thine, and the redemption is thine; buy it for thyself. Then I knew that this was the word of Jehovah.";
yng[8] = "And Hanameel, my uncle\'s son, cometh in unto me, according to the word of Jehovah, unto the court of the prison, and saith unto me, `Buy, I pray thee, my field that [is] in Anathoth, that [is] in the land of Benjamin, for thine [is] the right of possession, and thine of redemption -- buy for thee.\' And I know that it [is] the word of Jehovah,";

web[9] = "And I bought the field of Hanameel my uncle\'s son, that [was] in Anathoth, and weighed him the money, [even] seventeen shekels of silver.";
hnv[9] = "I bought the field that was in `Anatot of Hanam\'el my uncle\'s son, and weighed him the money, even seventeen shekels of silver.";
vul[9] = "et emi agrum ab Anamehel filio patrui mei qui est in Anathoth et adpendi ei argentum septem stateres et decem argenteos";
rsv[10] = "I signed the deed, sealed it, got witnesses, and weighed the money on scales.";
asv[10] = "And I subscribed the deed, and sealed it, and called witnesses, and weighed him the money in the balances.";
yng[10] = "And I write in a book, and seal, and cause witnesses to testify, and weigh the silver in balances;";
dby[10] = "And I subscribed the writing, and sealed it, and took witnesses, and weighed the money in the balances.";
web[10] = "And I subscribed the contract, and sealed [it], and took witnesses, and weighed [him] the money in the balances.";
hnv[10] = "I subscribed the deed, and sealed it, and called witnesses, and weighed him the money in the balances.";
vul[10] = "et scripsi in libro et signavi et adhibui testes et adpendi argentum in statera";
rsv[11] = "Then I took the sealed deed of purchase, containing the terms and conditions, and the open copy;";
asv[11] = "So I took the deed of the purchase, both that which was sealed, [according to] the law and custom, and that which was open:";
yng[11] = "And I take the purchase-book, the sealed one, according to law and custom, and the open one.";
dby[11] = "And I took the writing of the purchase, that which was sealed [according to] the law and the statutes, and that which was open;";
web[11] = "So I took the evidence of the purchase, [both] that which was sealed [according] to the law and custom, and that which was open:";
hnv[11] = "So I took the deed of the purchase, both that which was sealed, containing the terms and conditions, and that which was open;";
vul[11] = "et accepi librum possessionis signatum stipulationes et rata et signa forinsecus";
rsv[12] = "and I gave the deed of purchase to Baruch the son of Neri\'ah son of Mahsei\'ah, in the presence of Han\'amel my cousin, in the presence of the witnesses who signed the deed of purchase, and in the presence of all the Jews who were sitting in the court of the guard.";
asv[12] = "and I delivered the deed of the purchase unto Baruch the son of Neriah, the son of Mahseiah, in the presence of Hanamel mine uncle\'s [son], and in the presence of the witnesses that subscribed the deed of the purchase, before all the Jews that sat in the court of the guard.";
yng[12] = "And I give the purchase-book unto Baruch son of Neriah, son of Maaseiah, before the eyes of Hanameel, my uncle\'s son, and before the eyes of the witnesses, those writing in the purchase-book, before the eyes of all the Jews who are sitting in the court of the prison.";
dby[12] = "and I gave the writing of the purchase unto Baruch the son of Nerijah, the son of Maaseiah, in the sight of Hanameel mine uncle\'s [son], and in the presence of the witnesses that had subscribed the writing of purchase, before all the Jews that were sitting in the court of the guard.";
web[12] = "And I gave the evidence of the purchase to Baruch the son of Neriah, the son of Maaseiah, in the sight of Hanameel my uncle\'s [son], and in the presence of the witnesses that subscribed the book of the purchase, before all the Jews that sat in the court of the prison.";
hnv[12] = " and I delivered the deed of the purchase to Barukh the son of Neriyah, the son of Mechaseyah, in the presence of Hanam\'el my uncle\'s son, and in the presence of the witnesses who subscribed the deed of the purchase, before all the Yehudim who sat in the court of the guard.";
vul[12] = "et dedi librum possessionis Baruch filio Neri filii Maasiae in oculis Anamehel patruelis mei et in oculis testium qui scripti erant in libro emptionis in oculis omnium Iudaeorum qui sedebant in atrio carceris";
rsv[13] = "I charged Baruch in their presence, saying,";
asv[13] = "And I charged Baruch before them, saying,";
yng[13] = "And I charge Baruch before their eyes, saying,";
dby[13] = "And I charged Baruch in their presence, saying,";
web[13] = "And I charged Baruch before them, saying,";
hnv[13] = "I charged Barukh before them, saying,";
vul[13] = "et praecepi Baruch coram eis dicens";
rsv[14] = "\'Thus says the LORD of hosts, the God of Israel: Take these deeds, both this sealed deed of purchase and this open deed, and put them in an earthenware vessel, that they may last for a long time.";
asv[14] = "Thus saith Jehovah of hosts, the God of Israel: Take these deeds, this deed of the purchase which is sealed, and this deed which is open, and put them in an earthen vessel; that they may continue many days.";
yng[14] = "`Thus said Jehovah of Hosts, God of Israel, Take these books, this purchase-book, both the sealed one and the open one, and thou hast put them in an earthen vessel, that they may remain many days;";
dby[14] = "Thus saith Jehovah of hosts, the God of Israel: Take these writings, this writing of the purchase, both that which is sealed and this writing which is open; and put them in an earthen vessel, that they may remain many days.";
web[14] = "Thus saith the LORD of hosts, the God of Israel; Take these evidences, this evidence of the purchase, both that which is sealed, and this evidence which is open; and put them in an earthen vessel, that they may continue many days.";
hnv[14] = "Thus says the LORD of Hosts, the God of Yisra\'el: Take these deeds, this deed of the purchase which is sealed, and this deed which is open, and put them in an earthen vessel; that they may continue many days.";
vul[14] = "haec dicit Dominus exercituum Deus Israhel sume libros istos librum emptionis hunc signatum et librum hunc qui apertus est et pones illos in vase fictili ut permanere possint diebus multis";
rsv[15] = "For thus says the LORD of hosts, the God of Israel: Houses and fields and vineyards shall again be bought in this land.\'";
asv[15] = "For thus saith Jehovah of hosts, the God of Israel: Houses and fields and vineyards shall yet again be bought in this land.";
yng[15] = "For thus said Jehovah of Hosts, God of Israel, Again are houses and fields and vineyards bought in this land.\'";
dby[15] = "For thus saith Jehovah of hosts, the God of Israel: Houses and fields and vineyards shall again be purchased in this land.";
web[15] = "For thus saith the LORD of hosts, the God of Israel; Houses and fields and vineyards shall be possessed again in this land.";
hnv[15] = "For thus says the LORD of Hosts, the God of Yisra\'el: Houses and fields and vineyards shall yet again be bought in this land.";
vul[15] = "haec enim dicit Dominus exercituum Deus Israhel adhuc possidebuntur domus et agri et vineae in terra ista";
rsv[16] = "&quot;After I had given the deed of purchase to Baruch the son of Neri\'ah, I prayed to the LORD, saying:";
asv[16] = "Now after I had delivered the deed of the purchase unto Baruch the son of Neriah, I prayed unto Jehovah, saying,";
yng[16] = "And I pray unto Jehovah -- after my giving the purchase-book unto Baruch son of Neriah -- saying,";
dby[16] = "And after I had given the writing of the purchase unto Baruch the son of Nerijah, I prayed unto Jehovah saying,";
web[16] = "Now when I had delivered the evidence of the purchase to Baruch the son of Neriah, I prayed to the LORD, saying,";
hnv[16] = "Now after I had delivered the deed of the purchase to Barukh the son of Neriyah, I prayed to the LORD, saying,";
vul[16] = "et oravi ad Dominum postquam tradidi librum possessionis Baruch filio Neri dicens";
rsv[17] = "\'Ah Lord GOD! It is thou who hast made the heavens and the earth by thy great power and by thy outstretched arm! Nothing is too hard for thee,";
asv[17] = "Ah Lord Jehovah! behold, thou hast made the heavens and the earth by thy great power and by thine outstretched arm; there is nothing too hard for thee,";
yng[17] = "`Ah, Lord Jehovah, lo, Thou hast made the heavens and the earth by Thy great power, and by Thy stretched-out arm; there is nothing too wonderful for Thee:";
dby[17] = "Alas, Lord Jehovah! Behold, thou hast made the heavens and the earth by thy great power and stretched-out arm; there is nothing too hard for thee:";
web[17] = "Ah Lord GOD! behold, thou hast made the heaven and the earth by thy great power and out-stretched arm, [and] there is nothing too hard for thee:";
hnv[17] = "Ah Lord GOD! behold, you have made the heavens and the eretz by your great power and by your outstretched arm; there is nothing too hard for you,";
vul[17] = "heu heu heu Domine Deus ecce tu fecisti caelum et terram in fortitudine tua magna et in brachio tuo extento non erit tibi difficile omne verbum";
rsv[18] = "who showest steadfast love to thousands, but dost requite the guilt of fathers to their children after them, O great and mighty God whose name is the LORD of hosts,";
asv[18] = "who showest lovingkindness unto thousands, and recompensest the iniquity of the fathers into the bosom of their children after them; the great, the mighty God, Jehovah of hosts is his name;";
yng[18] = "Doing kindness to thousands, and recompensing iniquity of fathers into the bosom of their sons after them; God, the great, the mighty, Jehovah of Hosts [is] His name,";
dby[18] = "who shewest mercy unto thousands, and recompensest the iniquity of the fathers into the bosom of their children after them, thou, the great, the mighty God, -- Jehovah of hosts is his name;";
web[18] = "Thou showest loving-kindness to thousands, and recompensest the iniquity of the fathers into the bosom of their children after them: the Great, the Mighty God, JEHOVAH of hosts, [is] his name,";
hnv[18] = "who show lovingkindness to thousands, and recompense the iniquity of the fathers into the bosom of their children after them; the great, the mighty God, the LORD of Hosts is his name;";
vul[18] = "qui facis misericordiam in milibus et reddes iniquitatem patrum in sinu filiorum eorum post eos fortissime magne potens Dominus exercituum nomen tibi";
rsv[19] = "great in counsel and mighty in deed; whose eyes are open to all the ways of men, rewarding every man according to his ways and according to the fruit of his doings;";
asv[19] = "great in counsel, and mighty in work; whose eyes are open upon all the ways of the sons of men, to give every one according to his ways, and according to the fruit of his doings;";
yng[19] = "Great in counsel, and mighty in act, in that Thine eyes are open on all the ways of the sons of Adam, to give to each according to his ways, and according to the fruit of his doings:";
dby[19] = "great in counsel and mighty in work, whose eyes are open upon all the ways of the children of men, to give every one according to his ways, and according to the fruit of his doings:";
web[19] = "Great in counsel, and mighty in work: for thy eyes [are] open upon all the ways of the sons of men: to give every one according to his ways, and according to the fruit of his doings:";
hnv[19] = "great in counsel, and mighty in work; whose eyes are open on all the ways of the sons of men, to give everyone according to his ways, and according to the fruit of his doings:";
vul[19] = "magnus consilio et inconprehensibilis cogitatu cuius oculi aperti sunt super omnes vias filiorum Adam ut reddas unicuique secundum vias suas et secundum fructum adinventionum eius";
rsv[20] = "who hast shown signs and wonders in the land of Egypt, and to this day in Israel and among all mankind, and hast made thee a name, as at this day.";
asv[20] = "who didst set signs and wonders in the land of Egypt, even unto this day, both in Israel and among [other] men; and madest thee a name, as at this day;";
yng[20] = "In that thou hast done signs and wonders in the land of Egypt unto this day, and in Israel, and among men, and Thou dost make for Thee a name as [at] this day.";
dby[20] = "who hast displayed signs and wonders unto this day, in the land of Egypt and in Israel and among [other] men; and hast made thee a name, as at this day.";
web[20] = "Who hast set signs and wonders in the land of Egypt, [even] to this day, and in Israel, and among [other] men; and hast made thee a name, as at this day;";
hnv[20] = "who performed signs and wonders in the land of Mitzrayim, even to this day, both in Yisra\'el and among [other] men; and made you a name, as in this day;";
vul[20] = "qui posuisti signa et portenta in terra Aegypti usque ad diem hanc et in Israhel et in hominibus et fecisti tibi nomen sicut est dies haec";
rsv[21] = "Thou didst bring thy people Israel out of the land of Egypt with signs and wonders, with a strong hand and outstretched arm, and with great terror;";
asv[21] = "and didst bring forth thy people Israel out of the land of Egypt with signs, and with wonders, and with a strong hand, and with an outstretched arm, and with great terror;";
yng[21] = "`And Thou bringest forth Thy people Israel from the land of Egypt, with signs and with wonders, and by a strong hand, and by a stretched-out arm, and by great fear,";
dby[21] = "And thou broughtest forth thy people Israel out of the land of Egypt by signs, and by wonders, and by a powerful hand, and by a stretched-out arm, and by great terror;";
web[21] = "And hast brought forth thy people Israel from the land of Egypt with signs, and with wonders, and with a strong hand, and with an out-stretched arm, and with great terror;";
hnv[21] = "and brought forth your people Yisra\'el out of the land of Mitzrayim with signs, and with wonders, and with a strong hand, and with an outstretched arm, and with great terror;";
vul[21] = "et eduxisti populum tuum Israhel de terra Aegypti in signis et in portentis et in manu robusta et in brachio extento et in terrore magno";
rsv[22] = "and thou gavest them this land, which thou didst swear to their fathers to give them, a land flowing with milk and honey;";
asv[22] = "and gavest them this land, which thou didst swear to their fathers to give them, a land flowing with milk and honey;";
yng[22] = "And thou givest to them this land that thou didst swear to their fathers to give to them, a land flowing with milk and honey,";
dby[22] = "and didst give them this land, which thou hadst sworn unto their fathers to give them, a land flowing with milk and honey.";
web[22] = "And hast given them this land, which thou didst swear to their fathers to give them, a land flowing with milk and honey;";
hnv[22] = "and gave them this land, which you did swear to their fathers to give them, a land flowing with milk and honey;";
vul[22] = "et dedisti eis terram hanc quam iurasti patribus eorum ut dares eis terram fluentem lacte et melle";
rsv[23] = "and they entered and took possession of it. But they did not obey thy voice or walk in thy law; they did nothing of all thou didst command them to do. Therefore thou hast made all this evil come upon them.";
asv[23] = "and they came in, and possessed it; but they obeyed not thy voice, neither walked in thy law; they have done nothing of all that thou commandedst them to do: therefore thou hast caused all this evil to come upon them.";
yng[23] = "And they come in, and possess it, and they have not hearkened to Thy voice, and in Thy law have not walked, all that which Thou didst lay a charge on them to do they have not done, and Thou dost proclaim [to] them all this evil.";
dby[23] = "And they came in and possessed it: but they hearkened not unto thy voice, neither walked in thy law; they have done nothing of all that thou commandedst them to do; so that thou hast caused all this evil to come upon them.";
web[23] = "And they came in, and possessed it; but they obeyed not thy voice, neither walked in thy law; they have done nothing of all that thou commandedst them to do: therefore thou hast caused all this evil to come upon them:";
hnv[23] = "and they came in, and possessed it, but they didn\'t obey your voice, neither walked in your law; they have done nothing of all that you commanded them to do: therefore you have caused all this evil to come on them.";
vul[23] = "et ingressi sunt et possederunt eam et non oboedierunt voci tuae et in lege tua non ambulaverunt omnia quae mandasti eis ut facerent non fecerunt et evenerunt eis omnia mala haec";
rsv[24] = "Behold, the siege mounds have come up to the city to take it, and because of sword and famine and pestilence the city is given into the hands of the Chalde\'ans who are fighting against it. What thou didst speak has come to pass, and behold, thou seest it.";
asv[24] = "Behold, the mounds, they are come unto the city to take it; and the city is given into the hand of the Chaldeans that fight against it, because of the sword, and of the famine, and of the pestilence; and what thou hast spoken is come to pass; and, behold, thou seest it.";
yng[24] = "`Lo, the mounts -- they have come in to the city to capture it, and the city hath been given into the hand of the Chaldeans who are fighting against it, because of the sword, and the famine, and the pestilence; and that which Thou hast spoken hath come to pass, and lo, Thou art seeing;";
dby[24] = "Behold the mounds, they are come unto the city for taking it; and the city is given over into the hand of the Chaldeans, that fight against it, by the sword, and the famine, and the pestilence: and what thou hast spoken is come to pass; and behold, thou seest [it].";
web[24] = "Behold the mounts, they are come to the city to take it; and the city is given into the hand of the Chaldeans, that fight against it, because of the sword, and of the famine, and of the pestilence: and what thou hast spoken is come to pass; and behold, thou seest [it].";
hnv[24] = " Behold, the mounds, they are come to the city to take it; and the city is given into the hand of the Kasdim who fight against it, because of the sword, and of the famine, and of the pestilence; and what you have spoken has happened; and, behold, you see it.";
vul[24] = "ecce munitiones extructae sunt adversum civitatem ut capiatur et urbs data est in manu Chaldeorum qui proeliantur adversum eam a facie gladii et famis et pestilentiae et quaecumque locutus es acciderunt ut ipse tu cernis";
rsv[25] = "Yet thou, O Lord GOD, hast said to me, &quot;Buy the field for money and get witnesses&quot;--though the city is given into the hands of the Chalde\'ans.\'&quot;";
asv[25] = "And thou hast said unto me, O Lord Jehovah, Buy thee the field for money, and call witnesses; whereas the city is given into the hand of the Chaldeans.";
yng[25] = "Yet Thou hast said unto me, O Lord Jehovah, Buy for thee the field with money, and cause witnesses to testify -- and the city hath been given into the hand of the Chaldeans!\'";
dby[25] = "And thou, Lord Jehovah, thou hast said unto me, Buy for thyself the field for money, and take witnesses; -- and the city is given into the hand of the Chaldeans.";
web[25] = "And thou hast said to me, O Lord GOD, Buy thee the field for money, and take witnesses; for the city is given into the hand of the Chaldeans.";
hnv[25] = "You have said to me, Lord GOD, Buy you the field for money, and call witnesses; whereas the city is given into the hand of the Kasdim.";
vul[25] = "et tu dicis mihi Domine Deus eme agrum argento et adhibe testes cum urbs data sit in manu Chaldeorum";
rsv[26] = "The word of the LORD came to Jeremiah:";
asv[26] = "Then came the word of Jehovah unto Jeremiah, saying,";
yng[26] = "And the word of Jehovah is unto Jeremiah, saying:";
dby[26] = "And the word of Jehovah came unto Jeremiah, saying,";
web[26] = "Then came the word of the LORD to Jeremiah, saying,";
hnv[26] = "Then came the word of the LORD to Yirmeyahu, saying,";
vul[26] = "et factum est verbum Domini ad Hieremiam dicens";
rsv[27] = "&quot;Behold, I am the LORD, the God of all flesh; is anything too hard for me?";
asv[27] = "Behold, I am Jehovah, the God of all flesh: is there anything too hard for me?";
yng[27] = "`Lo, I [am] Jehovah, God of all flesh: For Me is anything too wonderful?";
dby[27] = "Behold, I am Jehovah, the God of all flesh: is there anything too hard for me?";
web[27] = "Behold, I [am] the LORD, the God of all flesh: is there any thing too hard for me?";
hnv[27] = "Behold, I am the LORD, the God of all flesh: is there anything too hard for me?";
vul[27] = "ecce ego Dominus Deus universae carnis numquid mihi difficile erit omne verbum";
rsv[28] = "Therefore, thus says the LORD: Behold, I am giving this city into the hands of the Chalde\'ans and into the hand of Nebuchadrez\'zar king of Babylon, and he shall take it.";
asv[28] = "Therefore thus saith Jehovah: Behold, I will give this city into the hand of the Chaldeans, and into the hand of Nebuchadrezzar king of Babylon, and he shall take it:";
yng[28] = "`Therefore, thus said Jehovah, Lo, I am giving this city into the hand of the Chaldeans, and into the hand of Nebuchadrezzar king of Babylon, and he hath captured it;";
dby[28] = "Therefore thus saith Jehovah: Behold, I give this city into the hand of the Chaldeans, and into the hand of Nebuchadrezzar the king of Babylon, and he shall take it.";
web[28] = "Therefore thus saith the LORD; Behold, I will give this city into the hand of the Chaldeans, and into the hand of Nebuchadrezzar king of Babylon, and he shall take it:";
hnv[28] = " Therefore thus says the LORD: Behold, I will give this city into the hand of the Kasdim, and into the hand of Nevukhadretztzar king of Bavel, and he shall take it:";
vul[28] = "propterea haec dicit Dominus ecce ego tradam civitatem istam in manu Chaldeorum et in manu regis Babylonis et capiet eam";
rsv[29] = "The Chalde\'ans who are fighting against this city shall come and set this city on fire, and burn it, with the houses on whose roofs incense has been offered to Ba\'al and drink offerings have been poured out to other gods, to provoke me to anger.";
asv[29] = "and the Chaldeans, that fight against this city, shall come and set this city on fire, and burn it, with the houses, upon whose roofs they have offered incense unto Baal, and poured out drink-offerings unto other gods, to provoke me to anger.";
yng[29] = "And come in have the Chaldeans who are fighting against this city, and they have set this city on fire, and have burned it, and the houses on whose roofs they made perfume to Baal, and poured out libations to other gods, so as to provoke Me to anger.";
dby[29] = "And the Chaldeans, that fight against this city, shall come in and set fire to this city, and shall burn it, and the houses upon whose roofs they have offered incense unto Baal, and poured out drink-offerings unto other gods, to provoke me to anger.";
web[29] = "And the Chaldeans, that fight against this city, shall come and set fire on this city, and burn it with the houses, upon whose roofs they have offered incense to Baal, and poured out drink-offerings to other gods, to provoke me to anger.";
hnv[29] = "and the Kasdim, who fight against this city, shall come and set this city on fire, and burn it, with the houses, on whose roofs they have offered incense to Ba`al, and poured out drink-offerings to other gods, to provoke me to anger.";
vul[29] = "et venient Chaldei proeliantes adversum urbem hanc et succendent eam igni et conburent eam et domos in quarum domatibus sacrificabant Baal et libabant diis alienis libamina ad inritandum me";
rsv[30] = "For the sons of Israel and the sons of Judah have done nothing but evil in my sight from their youth; the sons of Israel have done nothing but provoke me to anger by the work of their hands, says the LORD.";
asv[30] = "For the children of Israel and the children of Judah have done only that which was evil in my sight from their youth; for the children of Israel have only provoked me to anger with the work of their hands, saith Jehovah.";
yng[30] = "For the sons of Israel and the sons of Judah have been only doing evil in Mine eyes, from their youth; for the sons of Israel are only provoking Me with the work of their hands -- an affirmation of Jehovah.";
dby[30] = "For the children of Israel and the children of Judah have been doing only evil in my sight from their youth; for the children of Israel have only provoked me to anger with the work of their hands, saith Jehovah.";
web[30] = "For the children of Israel and the children of Judah have done evil only before me from their youth: for the children of Israel have only provoked me to anger with the work of their hands, saith the LORD.";
hnv[30] = "For the children of Yisra\'el and the children of Yehudah have done only that which was evil in my sight from their youth; for the children of Yisra\'el have only provoked me to anger with the work of their hands, says the LORD.";
vul[30] = "erant enim filii Israhel et filii Iuda iugiter facientes malum in oculis meis ab adulescentia sua filii Israhel qui usque nunc exacerbant me in opere manuum suarum dicit Dominus";
rsv[31] = "This city has aroused my anger and wrath, from the day it was built to this day, so that I will remove it from my sight";
asv[31] = "For this city hath been to me a provocation of mine anger and of my wrath from the day that they built it even unto this day; that I should remove it from before my face,";
yng[31] = "`For a cause of Mine anger, and a cause of My fury, hath this city been to Me, even from the day that they built it, and unto this day -- to turn it aside from before My face,";
dby[31] = "For this city hath been to me [a provocation] of mine anger and of my fury from the day that they built it even unto this day; that I should remove it from before my face,";
web[31] = "For this city hath been to me [as] a provocation of my anger and of my fury from the day that they built it even to this day; that I should remove it from before my face,";
hnv[31] = "For this city has been to me a provocation of my anger and of my wrath from the day that they built it even to this day; that I should remove it from before my face,";
vul[31] = "quia in furore et in indignatione mea facta est mihi civitas haec a die qua aedificaverunt eam usque ad diem istam qua aufertur de conspectu meo";
rsv[32] = "because of all the evil of the sons of Israel and the sons of Judah which they did to provoke me to anger--their kings and their princes, their priests and their prophets, the men of Judah and the inhabitants of Jerusalem.";
asv[32] = "because of all the evil of the children of Israel and of the children of Judah, which they have done to provoke me to anger, they, their kings, their princes, their priests, and their prophets, and the men of Judah, and the inhabitants of Jerusalem.";
yng[32] = "Because of all the evil of the sons of Israel, and of the sons of Judah that they have done, so as to provoke Me -- they, their kings, their heads, their priests, and their prophets, and the men of Judah, and the inhabitants of Jerusalem.";
dby[32] = "because of all the evil of the children of Israel and of the children of Judah, which they have done to provoke me to anger, they, their kings, their princes, their priests, and their prophets, and the men of Judah, and the inhabitants of Jerusalem.";
web[32] = "Because of all the evil of the children of Israel and of the children of Judah, which they have done to provoke me to anger, they, their kings, their princes, their priests, and their prophets, and the men of Judah, and the inhabitants of Jerusalem.";
hnv[32] = "because of all the evil of the children of Yisra\'el and of the children of Yehudah, which they have done to provoke me to anger, they, their kings, their princes, their Kohanim, and their prophets, and the men of Yehudah, and the inhabitants of Yerushalayim.";
vul[32] = "propter malitiam filiorum Israhel et filiorum Iuda quam fecerunt ad iracundiam me provocantes ipsi et reges eorum principes eorum et sacerdotes et prophetae eorum vir Iuda et habitatores Hierusalem";
rsv[33] = "They have turned to me their back and not their face; and though I have taught them persistently they have not listened to receive instruction.";
asv[33] = "And they have turned unto me the back, and not the face: and though I taught them, rising up early and teaching them, yet they have not hearkened to receive instruction.";
yng[33] = "And they turn unto Me the neck, and not the face, and teaching them, rising early and teaching, and they are not hearkening to accept instruction.";
dby[33] = "And they have turned unto me the back, and not the face; and though I taught them, rising early and teaching, they hearkened not to receive instruction.";
web[33] = "And they have turned to me the back, and not the face: though I taught them, rising early and teaching [them], yet they have not hearkened to receive instruction.";
hnv[33] = "They have turned to me the back, and not the face: and though I taught them, rising up early and teaching them, yet they have not listened to receive instruction.";
vul[33] = "et verterunt ad me terga et non facies cum docerem eos diluculo et erudirem et nollent audire ut acciperent disciplinam";
rsv[34] = "They set up their abominations in the house which is called by my name, to defile it.";
asv[34] = "But they set their abominations in the house which is called by my name, to defile it.";
yng[34] = "`And they set their abominations in the house over which My name is called, so as to defile it;";
dby[34] = "And they have set their abominations in the house which is called by my name, to defile it;";
web[34] = "But they set their abominations in the house, which is called by my name, to defile it.";
hnv[34] = "But they set their abominations in the house which is called by my name, to defile it.";
vul[34] = "et posuerunt idola sua in domo in qua invocatum est nomen meum ut polluerent eam";
rsv[35] = "They built the high places of Ba\'al in the valley of the son of Hinnom, to offer up their sons and daughters to Molech, though I did not command them, nor did it enter into my mind, that they should do this abomination, to cause Judah to sin.";
asv[35] = "And they built the high places of Baal, which are in the valley of the son of Hinnom, to cause their sons and their daughters to pass through [the fire] unto Molech; which I commanded them not, neither came it into my mind, that they should do this abomination, to cause Judah to sin.";
yng[35] = "And they build the high places of Baal, that [are] in the valley of the son of Hinnom, to cause their sons and their daughters to pass through to Molech, which I did not command them, nor did it come up on my heart to do this abomination, so as to cause Judah to sin.";
dby[35] = "and they have built the high places of Baal, which are in the valley of the son of Hinnom, to cause to pass through [the fire] their sons and their daughters unto Molech: which I commanded them not, neither came it into my mind, that they should do this abomination, to cause Judah to sin.";
web[35] = "And they built the high places of Baal, which [are] in the valley of the son of Hinnom, to cause their sons and their daughters to pass through [the fire] to Molech; which I commanded them not, neither came it into my mind, that they should do this abomination, to cause Judah to sin.";
hnv[35] = "They built the high places of Ba`al, which are in the valley of the son of Hinnom, to cause their sons and their daughters to pass through [the fire] to Molekh; which I didn\'t command them, neither did it come into my mind, that they should do this abomination, to cause Yehudah to sin.";
vul[35] = "et aedificaverunt excelsa Baal quae sunt in valle filii Ennom ut initiarent filios suos et filias suas Moloch quod non mandavi eis nec ascendit in cor meum ut facerent abominationem hanc et in peccatum deducerent Iudam";
rsv[36] = "&quot;Now therefore thus says the LORD, the God of Israel, concerning this city of which you say, \'It is given into the hand of the king of Babylon by sword, by famine, and by pestilence\':";
asv[36] = "And now therefore thus saith Jehovah, the God of Israel, concerning this city, whereof ye say, It is given into the hand of the king of Babylon by the sword, and by the famine, and by the pestilence:";
yng[36] = "`And now, therefore, thus said Jehovah, God of Israel, concerning this city, of which ye are saying, It hath been given into the hand of the king of Babylon by sword, and by famine, and by pestilence,";
dby[36] = "And now therefore Jehovah, the God of Israel, saith thus concerning this city, whereof ye say, It hath been given over into the hand of the king of Babylon by the sword, and by the famine, and by the pestilence:";
web[36] = "And now therefore thus saith the LORD, the God of Israel, concerning this city, of which ye say, It shall be delivered into the hand of the king of Babylon by the sword, and by the famine, and by the pestilence;";
hnv[36] = "Now therefore thus says the LORD, the God of Yisra\'el, concerning this city, whereof you say, It is given into the hand of the king of Bavel by the sword, and by the famine, and by the pestilence:";
vul[36] = "et nunc propter ista haec dicit Dominus Deus Israhel ad civitatem hanc de qua vos dicitis quod tradatur in manu regis Babylonis in gladio et in fame et in peste";
rsv[37] = "Behold, I will gather them from all the countries to which I drove them in my anger and my wrath and in great indignation; I will bring them back to this place, and I will make them dwell in safety.";
asv[37] = "Behold, I will gather them out of all the countries, whither I have driven them in mine anger, and in my wrath, and in great indignation; and I will bring them again unto this place, and I will cause them to dwell safely.";
yng[37] = "Lo, I am gathering them out of all the lands whither I have driven them in Mine anger, and in My fury, and in great wrath, and I have brought them back unto this place, and have caused them to dwell confidently;";
dby[37] = "Behold, I will gather them out of all the countries whither I have driven them, in mine anger, and in my fury, and in great wrath; and I will bring them again unto this place, and I will cause them to dwell safely.";
web[37] = "Behold, I will gather them out of all countries, whither I have driven them in my anger, and in my fury, and in great wrath; and I will bring them again to this place, and I will cause them to dwell in safety.";
hnv[37] = "Behold, I will gather them out of all the countries, where I have driven them in my anger, and in my wrath, and in great indignation; and I will bring them again to this place, and I will cause them to dwell safely:";
vul[37] = "ecce ego congregabo eos de universis terris ad quas eieci eos in furore meo et in ira mea et in indignatione grandi et reducam eos ad locum istum et habitare eos faciam confidenter";
rsv[38] = "And they shall be my people, and I will be their God.";
asv[38] = "And they shall be my people, and I will be their God:";
yng[38] = "and they have been to Me for a people, and I am to them for God;";
dby[38] = "And they shall be my people, and I will be their God.";
web[38] = "And they shall be my people, and I will be their God:";
hnv[38] = "and they shall be my people, and I will be their God:";
vul[38] = "et erunt mihi in populum et ego ero eis in Deum";
rsv[39] = "I will give them one heart and one way, that they may fear me for ever, for their own good and the good of their children after them.";
asv[39] = "and I will give them one heart and one way, that they may fear me for ever, for the good of them, and of their children after them:";
yng[39] = "and I have given to them one heart, and one way, to fear Me all the days, for good to them, and to their sons after them:";
dby[39] = "And I will give them one heart, and one way, that they may fear me all [their] days, for the good of them, and of their children after them.";
web[39] = "And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after them:";
hnv[39] = "and I will give them one heart and one way, that they may fear me forever, for the good of them, and of their children after them:";
vul[39] = "et dabo eis cor unum et viam unam ut timeant me universis diebus et bene sit eis et filiis eorum post eos";
rsv[40] = "I will make with them an everlasting covenant, that I will not turn away from doing good to them; and I will put the fear of me in their hearts, that they may not turn from me.";
asv[40] = "and I will make an everlasting covenant with them, that I will not turn away from following them, to do them good; and I will put my fear in their hearts, that they may not depart from me.";
yng[40] = "and I have made for them a covenant age-during, in that I turn not back from after them for My doing them good, and My fear I put in their heart, so as not to turn aside from me;";
dby[40] = "And I will make an everlasting covenant with them, that I will not draw back from them, to do them good; and I will put my fear in their heart, that they may not turn aside from me.";
web[40] = "And I will make an everlasting covenant with them, that I will not turn away from them, to do them good; but I will put my fear in their hearts, that they shall not depart from me.";
hnv[40] = "and I will make an everlasting covenant with them, that I will not turn away from following them, to do them good; and I will put my fear in their hearts, that they may not depart from me.";
vul[40] = "et feriam eis pactum sempiternum et non desinam eis benefacere et timorem meum dabo in corde eorum ut non recedant a me";
rsv[41] = "I will rejoice in doing them good, and I will plant them in this land in faithfulness, with all my heart and all my soul.";
asv[41] = "Yea, I will rejoice over them to do them good, and I will plant them in this land assuredly with my whole heart and with my whole soul.";
yng[41] = "and I have rejoiced over them to do them good, and have planted them in this land in truth, with all my heart, and with all My soul.";
dby[41] = "And I will rejoice over them to do them good, and I will assuredly plant them in this land with my whole heart and with my whole soul.";
web[41] = "Yes, I will rejoice over them to do them good, and I will plant them in this land assuredly with my whole heart and with my whole soul.";
hnv[41] = "Yes, I will rejoice over them to do them good, and I will plant them in this land assuredly with my whole heart and with my whole soul.";
vul[41] = "et laetabor super eis cum bene eis fecero et plantabo eos in terra ista in veritate in toto corde meo et in tota anima mea";
rsv[42] = "&quot;For thus says the LORD: Just as I have brought all this great evil upon this people, so I will bring upon them all the good that I promise them.";
asv[42] = "For thus saith Jehovah: Like as I have brought all this great evil upon this people, so will I bring upon them all the good that I have promised them.";
yng[42] = "`For thus said Jehovah: As I brought in unto this people all this great evil, so I am bringing in on them all the good that I am speaking concerning them;";
dby[42] = "For thus saith Jehovah: Like as I have brought all this great evil upon this people, so will I bring upon them all the good that I have spoken concerning them.";
web[42] = "For thus saith the LORD; As I have brought all this great evil upon this people, so will I bring upon them all the good that I have promised them.";
hnv[42] = "For thus says the LORD: Like as I have brought all this great evil on this people, so will I bring on them all the good that I have promised them.";
vul[42] = "quia haec dicit Dominus sicut adduxi super populum istum omne malum hoc grande sic adducam super eos omne bonum quod ego loquor ad eos";
rsv[43] = "Fields shall be bought in this land of which you are saying, It is a desolation, without man or beast; it is given into the hands of the Chalde\'ans.";
asv[43] = "And fields shall be bought in this land, whereof ye say, It is desolate, without man or beast; it is given into the hand of the Chaldeans.";
yng[43] = "and bought hath been the field in this land of which ye are saying, A desolation it [is], without man and beast, it hath been given into the hand of the Chaldeans.";
dby[43] = "And fields shall be bought in this land, whereof ye say, It is desolate without man or beast; it is given into the hand of the Chaldeans.";
web[43] = "And fields shall be bought in this land, of which ye say, [It is] desolate without man or beast; it is given into the hand of the Chaldeans.";
hnv[43] = " Fields shall be bought in this land, whereof you say, It is desolate, without man or animal; it is given into the hand of the Kasdim.";
vul[43] = "et possidebuntur agri in terra ista de qua vos dicitis quod deserta sit eo quod non remanserit homo et iumentum et data sit in manu Chaldeorum";
rsv[44] = "Fields shall be bought for money, and deeds shall be signed and sealed and witnessed, in the land of Benjamin, in the places about Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the Shephe\'lah, and in the cities of the Negeb; for I will restore their fortunes, says the LORD.&quot;";
asv[44] = "Men shall buy fields for money, and subscribe the deeds, and seal them, and call witnesses, in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, and in the cities of the hill-country, and in the cities of the lowland, and in the cities of the South: for I will cause their captivity to return, saith Jehovah.";
yng[44] = "Fields with money they buy, so as to write in a book, and to seal, and to cause witnesses to testify, in the land of Benjamin, and in suburbs of Jerusalem, and in cities of Judah, and in cities of the hill-country, and in cities of the low country, and in cities of the south, for I turn back their captivity -- an affirmation of Jehovah.\'";
dby[44] = "[Men] shall buy fields for money, and subscribe the writings, and seal them, and take witnesses, in the land of Benjamin, and in the environs of Jerusalem, and in the cities of Judah, and in the cities of the hill-country, and in the cities of the lowland, and in the cities of the south: for I will turn their captivity, saith Jehovah.";
web[44] = "Men shall buy fields for money, and subscribe evidences, and seal [them], and take witnesses in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, and in the cities of the mountains, and in the cities of the valley, and in the cities of the south: for I will cause their captivity to return, saith the LORD.";
hnv[44] = " Men shall buy fields for money, and subscribe the deeds, and seal them, and call witnesses, in the land of Binyamin, and in the places about Yerushalayim, and in the cities of Yehudah, and in the cities of the hill-country, and in the cities of the lowland, and in the cities of the South: for I will cause their captivity to return, says the LORD.";
vul[44] = "agri pecunia ementur et scribentur in libro et inprimetur signum et testis adhibebitur in terra Beniamin et in circuitu Hierusalem in civitatibus Iuda et in civitatibus montanis et in civitatibus campestribus et in civitatibus quae ad austrum sunt quia convertam captivitatem eorum ait Dominus";
</script>
