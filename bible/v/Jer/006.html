csb[1] = "&quot;Run for cover out of Jerusalem, Benjaminites. Sound the ram\'s horn in Tekoa; raise a smoke signal over Beth-haccherem, for disaster threatens from the north, even a crushing blow.";
csb[2] = "&quot;Though she is beautiful and delicate, I will destroy Daughter Zion.";
csb[3] = "&quot;Shepherds and their flocks will come against her; they will pitch their tents all around her. Each will pasture his own portion.";
csb[4] = "&quot;Set them apart for war against her; rise up, let\'s attack at noon. Woe to us, for the day is passing; the evening shadows grow long.";
csb[5] = "&quot;Rise up, let\'s attack by night. Let us destroy her fortresses.&quot;";
csb[6] = "For this is what the LORD of Armies says: Cut down the trees; raise a siege ramp against Jerusalem. This city must be punished. There is nothing but oppression within her.";
csb[7] = "As a well gushes out its water, so she pours out her evil. Violence and destruction resound in her. Sickness and wounds keep coming to my attention.";
csb[8] = "Be warned, Jerusalem, or I will turn away from you; I will make you a desolation, a land without inhabitants.";
csb[9] = "This is what the LORD of Armies says: Glean the remnant of Israel as thoroughly as a vine. Pass your hand once more like a grape gatherer over the branches.";
csb[10] = "Who can I speak to and give such a warning that they will listen? Look, their ear is uncircumcised, so they cannot pay attention. See, the word of the LORD has become contemptible to them -- they find no pleasure in it.";
csb[11] = "But I am full of the LORD\'s wrath; I am tired of holding it back. Pour it out on the children in the street, on the gathering of young men as well. For both husband and wife will be captured, the old with the very old.";
csb[12] = "Their houses will be turned over to others, their fields and wives as well, for I will stretch out my hand against the inhabitants of the land. This is the LORD\'s declaration.";
csb[13] = "For from the least to the greatest of them, everyone is making profit dishonestly. From prophet to priest, everyone deals falsely.";
csb[14] = "They have treated my people\'s brokenness superficially, claiming, &quot;Peace, peace,&quot; when there is no peace.";
csb[15] = "Were they ashamed when they acted so detestably? They weren\'t at all ashamed. They can no longer feel humiliation. Therefore, they will fall among the fallen. When I punish them, they will collapse, says the LORD.";
csb[16] = "This is what the LORD says: Stand by the roadways and look. Ask about the ancient paths, &quot;Which is the way to what is good? &quot; Then take it and find rest for yourselves. But they protested, &quot;We won\'t! &quot;";
csb[17] = "I appointed watchmen over you and said, &quot;Listen for the sound of the ram\'s horn.&quot; But they protested, &quot;We won\'t listen! &quot;";
csb[18] = "Therefore listen, you nations and you witnesses, learn what the charge is against them.";
csb[19] = "Listen, earth! I am about to bring disaster on these people, the fruit of their own plotting, for they have paid no attention to my words. They have rejected my instruction.";
csb[20] = "What use to me is frankincense from Sheba or sweet cane from a distant land? Your burnt offerings are not acceptable; your sacrifices do not please me.";
csb[21] = "Therefore, this is what the LORD says: I am going to place stumbling blocks before these people; fathers and sons together will stumble over them; friends and neighbors will also perish.";
csb[22] = "This is what the LORD says: Look, an army is coming from a northern land; a great nation will be stirred up from the remote regions of the earth.";
csb[23] = "They grasp bow and javelin. They are cruel and show no mercy. Their voice roars like the sea, and they ride on horses, lined up like men in battle formation against you, Daughter Zion.";
csb[24] = "We have heard about it, and our hands have become weak. Distress has seized us -- pain, like a woman in labor.";
csb[25] = "Don\'t go out to the fields; don\'t walk on the road. For the enemy has a sword; terror is on every side.";
csb[26] = "My dear people, dress yourselves in sackcloth and roll in the dust. Mourn as you would for an only son, a bitter lament, for suddenly the destroyer will come on us.";
csb[27] = "I have appointed you to be an assayer among my people -- a refiner -- so you may know and assay their way of life.";
csb[28] = "All are stubborn rebels spreading slander. They are bronze and iron; all of them are corrupt.";
csb[29] = "The bellows blow, blasting the lead with fire. The refining is completely in vain; the evil ones are not separated out.";
csb[30] = "They are called rejected silver, for the LORD has rejected them.";
kjv[1] = "O ye children of Benjamin, gather yourselves to flee out of the midst of Jerusalem, and blow the trumpet in Tekoa, and set up a sign of fire in Bethhaccerem: for evil appeareth out of the north, and great destruction.";
rsv[1] = "Flee for safety, O people of Benjamin, from the midst of Jerusalem! Blow the trumpet in Teko\'a, and raise a signal on Beth-hacche\'rem; for evil looms out of the north, and great destruction.";

yng[1] = "Strengthen yourselves, sons of Benjamin, From the midst of Jerusalem, And in Tekoa blow ye a trumpet, And over Beth-Haccerem lift ye up a flame, For evil hath been seen from the north, And great destruction.";

yng[18] = "Therefore hear, O nations, and know, O company, That which [is] upon them.";

web[18] = "Therefore hear, ye nations, and know, O congregation, what [is] among them.";
hnv[18] = " Therefore hear, you nations, and know, congregation, what is among them.";
vul[18] = "ideo audite gentes et cognosce congregatio quanta ego faciam eis";
kjv[19] = "Hear, O earth: behold, I will bring evil upon this people, [even] the fruit of their thoughts, because they have not hearkened unto my words, nor to my law, but rejected it.";
rsv[19] = "Hear, O earth; behold, I am bringing evil upon this people, the fruit of their devices, because they have not given heed to my words; and as for my law, they have rejected it.";
asv[19] = "Hear, O earth: behold, I will bring evil upon this people, even the fruit of their thoughts, because they have not hearkened unto my words; and as for my law, they have rejected it.";
yng[19] = "Hear, O earth, lo, I am bringing evil on this people, The fruit of their devices, For to My words they gave no attention, And My law -- they kick against it.";
dby[19] = "Hear, O earth: behold, I will bring evil upon this people, the fruit of their thoughts; for they have not hearkened unto my words, and as to my law, they have rejected it.";
web[19] = "Hear, O earth: behold, I will bring evil upon this people, [even] the fruit of their thoughts, because they have not hearkened to my words, nor to my law, but have rejected it.";
hnv[19] = "Hear, eretz: behold, I will bring evil on this people, even the fruit of their thoughts, because they have not listened to my words; and as for my law, they have rejected it.";
vul[19] = "audi terra ecce ego adducam mala super populum istum fructum cogitationum eius quia verba mea non audierunt et legem meam proiecerunt";
kjv[20] = "To what purpose cometh there to me incense from Sheba, and the sweet cane from a far country? your burnt offerings [are] not acceptable, nor your sacrifices sweet unto me.";
rsv[20] = "To what purpose does frankincense come to me from Sheba, or sweet cane from a distant land? Your burnt offerings are not acceptable, nor your sacrifices pleasing to me.";
asv[20] = "To what purpose cometh there to me frankincense from Sheba, and the sweet cane from a far country? your burnt-offerings are not acceptable, nor your sacrifices pleasing unto me.";
yng[20] = "Why [is] this to Me? frankincense from Sheba cometh, And the sweet cane from a land afar off, Your burnt-offerings [are] not for acceptance, And your sacrifices have not been sweet to Me.";
dby[20] = "To what purpose should there come to me incense from Sheba, and the sweet cane from a far country? Your burnt-offerings are not acceptable, nor are your sacrifices pleasing unto me.";
web[20] = "To what purpose cometh there to me incense from Sheba, and the sweet cane from a distant country? your burnt-offerings [are] not acceptable, nor your sacrifices sweet to me.";
hnv[20] = "To what purpose comes there to me frankincense from Sheva, and the sweet cane from a far country? your burnt offerings are not acceptable, nor your sacrifices pleasing to me.";
vul[20] = "ut quid mihi tus de Saba adfertis et calamum suave olentem de terra longinqua holocaustomata vestra non sunt accepta et victimae vestrae non placuerunt mihi";
kjv[21] = "Therefore thus saith the LORD, Behold, I will lay stumblingblocks before this people, and the fathers and the sons together shall fall upon them; the neighbour and his friend shall perish.";
rsv[21] = "Therefore thus says the LORD: \'Behold, I will lay before this people stumbling blocks against which they shall stumble; fathers and sons together, neighbor and friend shall perish.\'&quot;";
asv[21] = "Therefore thus saith Jehovah, Behold, I will lay stumbling-blocks before this people; and the fathers and the sons together shall stumble against them; the neighbor and his friend shall perish.";
yng[21] = "Therefore thus said Jehovah: Lo, I do give to this people stumbling blocks, And stumbled against them have fathers and sons together, The neighbour and his friend do perish.";
dby[21] = "Therefore thus saith Jehovah: Behold, I will lay stumbling-blocks before this people, and the fathers and the sons together shall fall over them; the neighbour and his friend shall perish.";
web[21] = "Therefore thus saith the LORD, Behold, I will lay stumbling-blocks before this people, and the fathers and the sons together shall fall upon them; the neighbor and his friend shall perish.";
hnv[21] = "Therefore thus says the LORD, Behold, I will lay stumbling-blocks before this people; and the fathers and the sons together shall stumble against them; the neighbor and his friend shall perish.";
vul[21] = "propterea haec dicit Dominus ecce ego dabo in populum istum ruinas et ruent in eis patres et filii simul vicinus et proximus et peribunt";
kjv[22] = "Thus saith the LORD, Behold, a people cometh from the north country, and a great nation shall be raised from the sides of the earth.";
rsv[22] = "Thus says the LORD: &quot;Behold, a people is coming from the north country, a great nation is stirring from the farthest parts of the earth.";
asv[22] = "Thus saith Jehovah, Behold, a people cometh from the north country; and a great nation shall be stirred up from the uttermost parts of the earth.";
yng[22] = "Thus said Jehovah: Lo, a people hath come from a north country, And a great nation is stirred up from the sides of the earth.";
dby[22] = "Thus saith Jehovah: Behold, a people cometh from the north country, and a great nation is stirred up from the uttermost parts of the earth.";
web[22] = "Thus saith the LORD, Behold, a people cometh from the north country, and a great nation shall be raised from the sides of the earth.";
hnv[22] = "Thus says the LORD, Behold, a people comes from the north country; and a great nation shall be stirred up from the uttermost parts of the eretz.";
vul[22] = "haec dicit Dominus ecce populus venit de terra aquilonis et gens magna consurget a finibus terrae";
kjv[23] = "They shall lay hold on bow and spear; they [are] cruel, and have no mercy; their voice roareth like the sea; and they ride upon horses, set in array as men for war against thee, O daughter of Zion.";
rsv[23] = "They lay hold on bow and spear, they are cruel and have no mercy, the sound of them is like the roaring sea; they ride upon horses, set in array as a man for battle, against you, O daughter of Zion!&quot;";
asv[23] = "They lay hold on bow and spear; they are cruel, and have no mercy; their voice roareth like the sea, and they ride upon horses, every one set in array, as a man to the battle, against thee, O daughter of Zion.";
yng[23] = "Bow and javelin they take hold of, Fierce it [is], and they have no mercy, Their voice as a sea doth sound, And on horses they ride, set in array as a man of war, Against thee, O daughter of Zion.";
dby[23] = "They lay hold on bow and spear; they are cruel, and have no mercy; their voice roareth like the sea; and they ride upon horses, set in array as a man for the battle, against thee, daughter of Zion.";
web[23] = "They shall lay hold on bow and spear; they [are] cruel, and have no mercy; their voice roareth like the sea; and they ride upon horses, set in array as men for war against thee, O daughter of Zion.";
hnv[23] = "They lay hold on bow and spear; they are cruel, and have no mercy; their voice roars like the sea, and they ride on horses, everyone set in array, as a man to the battle, against you, daughter of Tziyon.";
vul[23] = "sagittam et scutum arripiet crudelis est et non miserebitur vox eius quasi mare sonabit et super equos ascendent praeparati quasi vir ad proelium adversum te filia Sion";
kjv[24] = "We have heard the fame thereof: our hands wax feeble: anguish hath taken hold of us, [and] pain, as of a woman in travail.";
rsv[24] = "We have heard the report of it, our hands fall helpless; anguish has taken hold of us, pain as of a woman in travail.";
asv[24] = "We have heard the report thereof; our hands wax feeble: anguish hath taken hold of us, [and] pangs as of a woman in travail.";
yng[24] = "`We have heard its sound, feeble have been our hands, Distress hath seized us, pain as of a travailing woman.";
dby[24] = "We have heard the report thereof: our hands are grown feeble; anguish hath taken hold of us, pain as of a woman that travaileth.";
web[24] = "We have heard the fame of it: our hands become feeble: anguish hath taken hold of us, [and] pain, as of a woman in travail.";
hnv[24] = "We have heard the report of it; our hands wax feeble: anguish has taken hold of us, [and] pangs as of a woman in travail.";
vul[24] = "audivimus famam eius dissolutae sunt manus nostrae tribulatio adprehendit nos dolores ut parturientem";
kjv[25] = "Go not forth into the field, nor walk by the way; for the sword of the enemy [and] fear [is] on every side.";
rsv[25] = "Go not forth into the field, nor walk on the road; for the enemy has a sword, terror is on every side.";
asv[25] = "Go not forth into the field, nor walk by the way; for the sword of the enemy, [and] terror, are on every side.";
yng[25] = "Go not forth to the field, And in the way walk not, For a sword hath the enemy, fear [is] round about.";
dby[25] = "Go not forth into the field, nor walk by the way; for [there is] the sword of the enemy, terror is on every side.";
web[25] = "Go not forth into the field, nor walk by the way; for the sword of the enemy [and] fear [is] on every side.";
hnv[25] = "Don\'t go forth into the field, nor walk by the way; for the sword of the enemy, [and] terror, are on every side.";
vul[25] = "nolite exire ad agros et in via ne ambuletis quoniam gladius inimici pavor in circuitu";
kjv[26] = "O daughter of my people, gird [thee] with sackcloth, and wallow thyself in ashes: make thee mourning, [as for] an only son, most bitter lamentation: for the spoiler shall suddenly come upon us.";
rsv[26] = "O daughter of my people, gird on sackcloth, and roll in ashes; make mourning as for an only son, most bitter lamentation; for suddenly the destroyer will come upon us.";
asv[26] = "O daughter of my people, gird thee with sackcloth, and wallow thyself in ashes: make thee mourning, as for an only son, most bitter lamentation; for the destroyer shall suddenly come upon us.";
yng[26] = "O daughter of My people, Gird on sackcloth, and roll thyself in ashes, The mourning of an only one make for thee, A lamentation most bitter, For suddenly come doth the spoiler against us.";
dby[26] = "Daughter of my people, gird thee with sackcloth, and roll thyself in ashes: make mourning, [as] for an only son -- bitter lamentation; for the spoiler cometh suddenly upon us.";
web[26] = "O daughter of my people, gird [thee] with sackcloth, and wallow thyself in ashes: make thee mourning, [as for] an only son, most bitter lamentation: for the spoiler shall suddenly come upon us.";
hnv[26] = "Daughter of my people, gird you with sackcloth, and wallow yourself in ashes: make you mourning, as for an only son, most bitter lamentation; for the destroyer shall suddenly come on us.";
vul[26] = "filia populi mei accingere cilicio et conspergere cinere luctum unigeniti fac tibi planctum amarum quia repente veniet vastator super nos";
kjv[27] = "I have set thee [for] a tower [and] a fortress among my people, that thou mayest know and try their way.";
rsv[27] = "&quot;I have made you an assayer and tester among my people, that you may know and assay their ways.";
asv[27] = "I have made thee a trier [and] a fortress among my people; that thou mayest know and try their way.";
yng[27] = "A watch-tower I have given thee, Among My people a fortress, And thou knowest, and hast tried their way.";
dby[27] = "I have set thee among my people as an assayer, a fortress, that thou mayest know and try their way.";
web[27] = "I have set thee [for] a tower [and] a fortress among my people, that thou mayest know and try their way.";
hnv[27] = "I have made you a tester of metals [and] a fortress among my people; that you may know and try their way.";
vul[27] = "probatorem dedi te in populo meo robustum et scies et probabis viam eorum";
kjv[28] = "They [are] all grievous revolters, walking with slanders: [they are] brass and iron; they [are] all corrupters.";
rsv[28] = "They are all stubbornly rebellious, going about with slanders; they are bronze and iron, all of them act corruptly.";
asv[28] = "They are all grievous revolters, going about with slanders; they are brass and iron: they all of them deal corruptly.";
yng[28] = "All of them are turned aside by apostates, Walking slanderously -- brass and iron, All of them are corrupters.";
dby[28] = "They are all the most rebellious of rebels, going about with slander: they are bronze and iron; they are all corrupters.";
web[28] = "They [are] all grievous revolters, walking with slanders: [they are] brass and iron; they [are] all corrupters.";
hnv[28] = "They are all grievous rebels, going about with slanders; they are brass and iron: they all of them deal corruptly.";
vul[28] = "omnes isti principes declinantum ambulantes fraudulenter aes et ferrum universi corrupti sunt";
kjv[29] = "The bellows are burned, the lead is consumed of the fire; the founder melteth in vain: for the wicked are not plucked away.";
rsv[29] = "The bellows blow fiercely, the lead is consumed by the fire; in vain the refining goes on, for the wicked are not removed.";
asv[29] = "The bellows blow fiercely; the lead is consumed of the fire: in vain do they go on refining; for the wicked are not plucked away.";
yng[29] = "The bellows have been burnt, By fire hath the lead been consumed, In vain hath a refiner refined, And the wicked have not been drawn away.";
dby[29] = "The bellows are burned, the lead is consumed by the fire; they have melted, and melted in vain; and the bad are not plucked away.";
web[29] = "The bellows is burned, the lead is consumed by the fire; the founder melteth in vain: for the wicked are not plucked away.";
hnv[29] = "The bellows blow fiercely; the lead is consumed of the fire: in vain do they go on refining; for the wicked are not plucked away.";
vul[29] = "defecit sufflatorium in igne consumptum est plumbum frustra conflavit conflator malitiae enim eorum non sunt consumptae";
kjv[30] = "Reprobate silver shall [men] call them, because the LORD hath rejected them.";
rsv[30] = "Refuse silver they are called, for the LORD has rejected them.&quot;";
asv[30] = "Refuse silver shall men call them, because Jehovah hath rejected them.";
yng[30] = "`Silver rejected,\' they have called to them, For Jehovah hath kicked against them!";
dby[30] = "Reprobate silver shall they call them, for Jehovah hath rejected them.";
web[30] = "Reprobate silver shall [men] call them, because the LORD hath rejected them.";
hnv[30] = "Refuse silver shall men them, because the LORD has rejected them.";
vul[30] = "argentum reprobum vocate eos quia Dominus proiecit illos";
