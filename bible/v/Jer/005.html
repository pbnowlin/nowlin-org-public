csb[1] = "Roam through the streets of Jerusalem. Investigate; search in her squares. If you find one person, any who acts justly, who pursues faithfulness, then I will forgive her.";
csb[2] = "When they say, &quot;As the LORD lives,&quot; they are swearing falsely.";
csb[3] = "LORD, don\'t your eyes look for faithfulness? You have struck them, but they felt no pain. You finished them off, but they refused to accept discipline. They made their faces harder than rock, and they refused to return.";
csb[4] = "Then I thought: They are just the poor; they have been foolish. For they don\'t understand the way of the LORD, the justice of their God.";
csb[5] = "I will go to the powerful and speak to them. Surely they know the way of the LORD, the justice of their God. However, these also had broken the yoke and torn off the chains.";
csb[6] = "Therefore, a lion from the forest will strike them down. A wolf from arid plains will ravage them. A leopard stalks their cities. Anyone who leaves them will be torn to pieces because their rebellious acts are many, their unfaithful deeds numerous.";
csb[7] = "Why should I forgive you? Your children have abandoned me and sworn by those who are not gods. I satisfied their needs, yet they committed adultery; they gashed themselves at the prostitute\'s house.";
csb[8] = "They are well-fed, eager stallions, each neighing after someone else\'s wife.";
csb[9] = "Should I not punish them for these things? This is the LORD\'s declaration. Should I not avenge myself on such a nation as this?";
csb[10] = "Go up among her vineyard terraces and destroy them, but do not finish them off. Prune away her shoots, for they do not belong to the LORD.";
csb[11] = "They, the house of Israel and the house of Judah, have dealt very treacherously with me. This is the LORD\'s declaration.";
csb[12] = "They have contradicted the LORD and insisted, &quot;It won\'t happen. Harm won\'t come to us; we won\'t see sword or famine.&quot;";
csb[13] = "The prophets become only wind, for the LORD\'s word is not in them. This will in fact happen to them.";
csb[14] = "Therefore, this is what the Lord GOD of Armies says: Because you have spoken this word, I am going to make my words become fire in your mouth. These people are the wood, and the fire will consume them.";
csb[15] = "I am about to bring a nation from far away against you, house of Israel. This is the LORD\'s declaration. It is an established nation, an ancient nation, a nation whose language you do not know and whose speech you do not understand.";
csb[16] = "Their quiver is like an open grave; they are all warriors.";
csb[17] = "They will consume your harvest and your food. They will consume your sons and your daughters. They will consume your flocks and your herds. They will consume your vines and your fig trees. With the sword they will destroy your fortified cities in which you trust.";
csb[18] = "&quot;But even in those days&quot; -- this is the LORD\'s declaration -- &quot;I will not finish you off.";
csb[19] = "&quot;When people ask, \'For what offense has the LORD our God done all these things to us? \' You will respond to them, \'Just as you abandoned me and served foreign gods in your land, so will you serve strangers in a land that is not yours.\'";
csb[20] = "&quot;Declare this in the house of Jacob; proclaim it in Judah, saying:";
csb[21] = "&quot;Hear this, you foolish and senseless people. They have eyes, but they don\'t see. They have ears, but they don\'t hear.";
csb[22] = "&quot;Do you not fear me? This is the LORD\'s declaration. Do you not tremble before me, the one who set the sand as the boundary of the sea, an enduring barrier that it cannot cross? The waves surge, but they cannot prevail. They roar but cannot pass over it.";
csb[23] = "&quot;But these people have stubborn and rebellious hearts. They have turned aside and have gone away.";
csb[24] = "&quot;They have not said to themselves, \'Let\'s fear the LORD our God, who gives the seasonal rains, both autumn and spring, who guarantees to us the fixed weeks of the harvest.\'";
csb[25] = "&quot;Your guilty acts have diverted these things from you. Your sins have withheld my bounty from you,";
csb[26] = "&quot;for wicked men live among my people. They watch like hunters lying in wait. They set a trap; they catch men.";
csb[27] = "&quot;Like a cage full of birds, so their houses are full of deceit. Therefore they have grown powerful and rich.";
csb[28] = "&quot;They have become fat and sleek. They have also excelled in evil matters. They have not taken up cases, such as the case of the fatherless, so they might prosper, and they have not defended the rights of the needy.";
csb[29] = "&quot;Should I not punish them for these things? This is the LORD\'s declaration. Should I not avenge myself on such a nation as this?";
csb[30] = "&quot;An appalling, horrible thing has taken place in the land.";
csb[31] = "&quot;The prophets prophesy falsely, and the priests rule by their own authority. My people love it like this. But what will you do at the end of it?";
kjv[1] = "Run ye to and fro through the streets of Jerusalem, and see now, and know, and seek in the broad places thereof, if ye can find a man, if there be [any] that executeth judgment, that seeketh the truth; and I will pardon it.";
rsv[1] = "Run to and fro through the streets of Jerusalem, look and take note! Search her squares to see if you can find a man, one who does justice and seeks truth; that I may pardon her.";
asv[1] = "Run ye to and fro through the streets of Jerusalem, and see now, and know, and seek in the broad places thereof, if ye can find a man, if there be any that doeth justly, that seeketh truth; and I will pardon her.";
yng[1] = "Go to and fro in streets of Jerusalem, And see, I pray you, and know, And seek in her broad places, if ye find a man, If there be one doing judgment, seeking stedfastness -- Then am I propitious to her.";
dby[1] = "Run ye to and fro through the streets of Jerusalem, and see now, and know, and seek in the broadways thereof, if ye can find a man, if there be [any] that doeth justice, that seeketh fidelity; and I will pardon it.";
web[1] = "Run ye to and fro through the streets of Jerusalem, and see now, and know, and seek in its broad places, if ye can find a man, if there is [any] that executeth judgment, that seeketh the truth; and I will pardon it.";
hnv[1] = "Run you back and forth through the streets of Yerushalayim, and see now, and know, and seek in the broad places of it, if you can find a man, if there are any who does justly, who seeks truth; and I will pardon her.";
vul[1] = "circuite vias Hierusalem et aspicite et considerate et quaerite in plateis eius an inveniatis virum facientem iudicium et quaerentem fidem et propitius ero eius";

yng[2] = "And if they say, `Jehovah liveth,\' Surely to a falsehood they swear.";
dby[2] = "And if they say, [As] Jehovah liveth! surely they swear falsely.";

hnv[2] = "Though they say, As the LORD lives; surely they swear falsely.";

kjv[3] = "O LORD, [are] not thine eyes upon the truth? thou hast stricken them, but they have not grieved; thou hast consumed them, [but] they have refused to receive correction: they have made their faces harder than a rock; they have refused to return.";
rsv[3] = "O LORD, do not thy eyes look for truth? Thou hast smitten them, but they felt no anguish; thou hast consumed them, but they refused to take correction. They have made their faces harder than rock; they have refused to repent.";
asv[3] = "O Jehovah, do not thine eyes look upon truth? thou hast stricken them, but they were not grieved; thou hast consumed them, but they have refused to receive correction: they have made their faces harder than a rock; they have refused to return.";
yng[3] = "Jehovah, Thine eyes, are they not on stedfastness? Thou hast smitten them, and they have not grieved, Thou hast consumed them, They have refused to receive instruction, They made their faces harder than a rock, They have refused to turn back.";
dby[3] = "Jehovah, are not thine eyes upon fidelity? Thou hast smitten them, but they are not sore; thou hast consumed them, they have refused to receive correction: they have made their faces harder than a rock; they have refused to return.";

kjv[6] = "Wherefore a lion out of the forest shall slay them, [and] a wolf of the evenings shall spoil them, a leopard shall watch over their cities: every one that goeth out thence shall be torn in pieces: because their transgressions are many, [and] their backslidings are increased.";
rsv[6] = "Therefore a lion from the forest shall slay them, a wolf from the desert shall destroy them. A leopard is watching against their cities, every one who goes out of them shall be torn in pieces; because their transgressions are many, their apostasies are great.";
asv[6] = "Wherefore a lion out of the forest shall slay them, a wolf of the evenings shall destroy them, a leopard shall watch against their cities; every one that goeth out thence shall be torn in pieces; because their transgressions are many, [and] their backslidings are increased.";
yng[6] = "Therefore smitten them hath a lion out of the forest, A wolf of the deserts doth spoil them, A leopard is watching over their cities, Every one who is going out of them is torn, For many have been their transgressions, Mighty have been their backslidings.";
dby[6] = "Therefore a lion out of the forest shall slay them, a wolf of the evenings shall waste them; the leopard lurketh against their cities, every one that goeth out thence is torn in pieces: for their transgressions are multiplied, their backslidings are increased.";
web[6] = "Wherefore a lion from the forest shall slay them, [and] a wolf of the evenings shall spoil them, a leopard shall watch over their cities: every one that goeth out thence shall be torn in pieces: because their transgressions are many, [and] their backslidings are increased.";
hnv[6] = "Therefore a lion out of the forest shall kill them, a wolf of the evenings shall destroy them, a leopard shall watch against their cities; everyone who goes out there shall be torn in pieces; because their transgressions are many, [and] their backsliding is increased.";

kjv[19] = "And it shall come to pass, when ye shall say, Wherefore doeth the LORD our God all these [things] unto us? then shalt thou answer them, Like as ye have forsaken me, and served strange gods in your land, so shall ye serve strangers in a land [that is] not yours.";
rsv[19] = "And when your people say, \'Why has the LORD our God done all these things to us?\' you shall say to them, \'As you have forsaken me and served foreign gods in your land, so you shall serve strangers in a land that is not yours.\'&quot;";
asv[19] = "And it shall come to pass, when ye shall say, Wherefore hath Jehovah our God done all these things unto us? then shalt thou say unto them, Like as ye have forsaken me, and served foreign gods in your land, so shall ye serve strangers in a land that is not yours.";
yng[19] = "And it hath come to pass, when ye say, `For what hath Jehovah our God done to us all these?\' That thou hast said unto them, `As ye have forsaken Me, And serve the gods of a foreigner in your land, So do ye serve strangers in a land not yours.";

kjv[22] = "Fear ye not me? saith the LORD: will ye not tremble at my presence, which have placed the sand [for] the bound of the sea by a perpetual decree, that it cannot pass it: and though the waves thereof toss themselves, yet can they not prevail; though they roar, yet can they not pass over it?";
rsv[22] = "Do you not fear me? says the LORD; Do you not tremble before me? I placed the sand as the bound for the sea, a perpetual barrier which it cannot pass; though the waves toss, they cannot prevail, though they roar, they cannot pass over it.";
asv[22] = "Fear ye not me? saith Jehovah: will ye not tremble at my presence, who have placed the sand for the bound of the sea, by a perpetual decree, that it cannot pass it? and though the waves thereof toss themselves, yet can they not prevail; though they roar, yet can they not pass over it.";
yng[22] = "Me do ye not fear, an affirmation of Jehovah? From My presence are ye not pained? Who hath made sand the border of the sea, A limit age-during, and it passeth not over it, They shake themselves, and they are not able, Yea, sounded have its billows, and they pass not over.";
dby[22] = "Will ye not fear me? saith Jehovah. Will ye not tremble at my presence, who have set the sand a bound for the sea by a perpetual decree, and it shall not pass it? and its waves toss themselves, but they do not prevail; and they roar, yet can they not pass over it?";
web[22] = "Fear ye not me? saith the LORD: will ye not tremble at my presence, who have placed the sand [for] the bound of the sea by a perpetual decree, that it cannot pass it: and though its waves toss themselves, yet can they not prevail; though they roar, yet can they not pass over it?";
hnv[22] = "Don\'t you fear me? says the LORD: won\'t you tremble at my presence, who have placed the sand for the bound of the sea, by a perpetual decree, that it can\'t pass it? and though the waves of it toss themselves, yet they can\'t prevail; though they roar, yet they can\'t pass over it.";
