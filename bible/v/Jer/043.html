csb[1] = "When Jeremiah had finished speaking to all the people all the words of the LORD their God -- all these words the LORD their God had sent him to give them --";
csb[2] = "then Azariah son of Hoshaiah, Johanan son of Kareah, and all the other arrogant men responded to Jeremiah, &quot;You are speaking a lie! The LORD our God has not sent you to say, \'You must not go to Egypt to stay there for a while! \'";
csb[3] = "&quot;Rather, Baruch son of Neriah is inciting you against us to hand us over to the Chaldeans to put us to death or to deport us to Babylon! &quot;";
csb[4] = "So Johanan son of Kareah, all the commanders of the armies, and all the people failed to obey the LORD\'s command to stay in the land of Judah.";
csb[5] = "Instead, Johanan son of Kareah and all the commanders of the armies led away the whole remnant of Judah, those who had returned to stay in the land of Judah from all the nations where they had been banished.";
csb[6] = "They led away the men, women, children, king\'s daughters, and everyone whom Nebuzaradan, captain of the guards, had allowed to remain with Gedaliah son of Ahikam son of Shaphan. They also led the prophet Jeremiah and Baruch son of Neriah away.";
csb[7] = "They went to the land of Egypt because they did not obey the LORD. They went as far as Tahpanhes.";
csb[8] = "Then the word of the LORD came to Jeremiah at Tahpanhes:";
csb[9] = "&quot;Pick up some large stones and set them in the mortar of the brick pavement that is at the opening of Pharaoh\'s palace at Tahpanhes. Do this in the sight of the Judean men";
csb[10] = "&quot;and tell them, \'This is what the LORD of Armies, the God of Israel, says: I will send for my servant Nebuchadnezzar king of Babylon, and I will place his throne on these stones that I have embedded, and he will pitch his pavilion over them.";
csb[11] = "&quot;He will come and strike down the land of Egypt -- those destined for death, to death; those destined for captivity, to captivity; and those destined for the sword, to the sword.";
csb[12] = "&quot;I will kindle a fire in the temples of Egypt\'s gods, and he will burn them and take them captive. He will clean the land of Egypt as a shepherd picks lice off his clothes, and he will leave there unscathed.";
csb[13] = "&quot;He will smash the sacred pillars of the sun temple in the land of Egypt and burn the temples of the Egyptian gods.\' &quot;";
kjv[1] = "And it came to pass, [that] when Jeremiah had made an end of speaking unto all the people all the words of the LORD their God, for which the LORD their God had sent him to them, [even] all these words,";

yng[1] = "And it cometh to pass, when Jeremiah doth finish to speak unto all the people all the words of Jehovah their God, with which Jehovah their God hath sent him unto them -- all these words --";

kjv[2] = "Then spake Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying unto Jeremiah, Thou speakest falsely: the LORD our God hath not sent thee to say, Go not into Egypt to sojourn there:";
rsv[2] = "Azari\'ah the son of Hoshai\'ah and Joha\'nan the son of Kare\'ah and all the insolent men said to Jeremiah, &quot;You are telling a lie. The LORD our God did not send you to say, \'Do not go to Egypt to live there\';";
asv[2] = "then spake Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying unto Jeremiah, Thou speakest falsely: Jehovah our God hath not sent thee to say, Ye shall not go into Egypt to sojourn there;";
yng[2] = "that Azariah son of Hoshaiah, and Johanan son of Kareah, and all the proud men, speak unto Jeremiah, saying, `Falsehood thou art speaking; Jehovah our God hath not sent thee to say, Do not enter Egypt to sojourn there;";
dby[2] = "-- then spoke Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying to Jeremiah, Thou speakest falsely: Jehovah our God hath not sent thee to say, Go not into Egypt to sojourn there;";
web[2] = "Then spoke Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying to Jeremiah, Thou speakest falsely: the LORD our God hath not sent thee to say, Go not into Egypt to sojourn there:";
hnv[2] = "then spoke `Azaryah the son of Hosha`yah, and Yochanan the son of Kareach, and all the proud men, saying to Yirmeyahu, You speak falsely: the LORD our God has not sent you to say, You shall not go into Mitzrayim to sojourn there;";
vul[2] = "dixit Azarias filius Osaiae et Iohanan filius Caree et omnes viri superbi dicentes ad Hieremiam mendacium tu loqueris non misit te Dominus Deus noster dicens ne ingrediamini Aegyptum ut habitetis illuc";

asv[6] = "the men, and the women, and the children, and the king\'s daughters, and every person that Nebuzaradan the captain of the guard had left with Gedaliah the son of Ahikam, the son of Shaphan; and Jeremiah the prophet, and Baruch the son of Neriah;";
yng[6] = "the men, and the women, and the infant, and the daughters of the king, and every person that Nebuzar-Adan, chief of the executioners, had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet, and Baruch son of Neriah,";

kjv[10] = "And say unto them, Thus saith the LORD of hosts, the God of Israel; Behold, I will send and take Nebuchadrezzar the king of Babylon, my servant, and will set his throne upon these stones that I have hid; and he shall spread his royal pavilion over them.";

asv[10] = "and say unto them, Thus saith Jehovah of hosts, the God of Israel: Behold, I will send and take Nebuchadrezzar the king of Babylon, my servant, and will set his throne upon these stones that I have hid; and he shall spread his royal pavilion over them.";
yng[10] = "and thou hast said unto them: Thus said Jehovah of Hosts, God of Israel: `Lo, I am sending, and I have taken Nebuchadrezzar king of Babylon, My servant, and I have set his throne above these stones that I have hid, and he hath stretched out his pavilion over them,";

kjv[11] = "And when he cometh, he shall smite the land of Egypt, [and deliver] such [as are] for death to death; and such [as are] for captivity to captivity; and such [as are] for the sword to the sword.";

yng[12] = "And I have kindled a fire in the houses of the gods of Egypt, and it hath burned them, and he hath taken them captive, and covered himself with the land of Egypt, as cover himself doth the shepherd with his garment, and he hath gone forth thence in peace;";
dby[12] = "And I will kindle a fire in the houses of the gods of Egypt, and he shall burn them, and carry them away captive; and he shall array himself with the land of Egypt, as a shepherd putteth on his garment; and he shall go forth from thence in peace.";

vul[12] = "et succendet ignem in delubris deorum Aegypti et conburet ea et captivos ducet illos et amicietur terra Aegypti sicut amicitur pastor pallio suo et egredietur inde in pace";

yng[13] = "and he hath broken the standing pillars of the house of the sun, that [is] in the land of Egypt, and the houses of the gods of Egypt he doth burn with fire.\'";
