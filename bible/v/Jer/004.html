csb[1] = "If you return, Israel -- this is the LORD\'s declaration -- you will return to me, if you remove your abhorrent idols from my presence and do not waver,";
csb[2] = "then you can swear, &quot;As the LORD lives,&quot; in truth, in justice, and in righteousness, then the nations will be blessed by him and will pride themselves in him.";
csb[3] = "For this is what the LORD says to the men of Judah and Jerusalem: Break up the unplowed ground; do not sow among the thorns.";
csb[4] = "Circumcise yourselves to the LORD; remove the foreskin of your hearts, men of Judah and residents of Jerusalem. Otherwise, my wrath will break out like fire and burn with no one to extinguish it because of your evil deeds.";
csb[5] = "Declare in Judah, proclaim in Jerusalem, and say: Blow the ram\'s horn throughout the land. Cry out loudly and say: Assemble yourselves, and let\'s flee to the fortified cities.";
csb[6] = "Lift up a signal flag toward Zion. Run for cover! Don\'t stand still! For I am bringing disaster from the north -- a crushing blow.";
csb[7] = "A lion has gone up from his thicket; a destroyer of nations has set out. He has left his lair to make your land a waste. Your cities will be reduced to uninhabited ruins.";
csb[8] = "Because of this, put on sackcloth; mourn and wail, for the LORD\'s burning anger has not turned away from us.";
csb[9] = "&quot;On that day&quot; -- this is the LORD\'s declaration -- &quot;the king and the officials will lose their courage. The priests will tremble in fear, and the prophets will be scared speechless.&quot;";
csb[10] = "I said, &quot;Oh no, Lord GOD, you have certainly deceived this people and Jerusalem, by announcing, \'You will have peace,\' while a sword is at our throats.&quot;";
csb[11] = "&quot;At that time it will be said to this people and to Jerusalem, \'A searing wind blows from the barren heights in the wilderness on the way to my dear people. It comes not to winnow or to sift;";
csb[12] = "&quot;a wind too strong for this comes at my call. Now I will also pronounce judgments against them.\' &quot;";
csb[13] = "Look, he advances like clouds; his chariots are like a storm. His horses are swifter than eagles. Woe to us, for we are ruined!";
csb[14] = "Wash the evil from your heart, Jerusalem, so that you will be delivered. How long will you harbor malicious thoughts?";
csb[15] = "For a voice announces from Dan, proclaiming malice from Mount Ephraim.";
csb[16] = "Warn the nations: Look! Proclaim to Jerusalem: Those who besiege are coming from a distant land; they raise their voices against the cities of Judah.";
csb[17] = "They have her surrounded like those who guard a field, because she has rebelled against me. This is the LORD\'s declaration.";
csb[18] = "Your way and your actions have brought this on you. This is your punishment. It is very bitter, because it has reached your heart!";
csb[19] = "My anguish, my anguish! I writhe in agony! Oh, the pain in my heart! My heart pounds; I cannot be silent. For you, my soul, have heard the sound of the ram\'s horn -- the shout of battle.";
csb[20] = "Disaster after disaster is reported because the whole land is destroyed. Suddenly my tents are destroyed, my tent curtains, in a moment.";
csb[21] = "How long must I see the signal flag and hear the sound of the ram\'s horn?";
csb[22] = "&quot;For my people are fools; they do not know me. They are foolish children, without understanding. They are skilled in doing what is evil, but they do not know how to do what is good.&quot;";
csb[23] = "I looked at the earth, and it was formless and empty. I looked to the heavens, and their light was gone.";
csb[24] = "I looked at the mountains, and they were quaking; all the hills shook.";
csb[25] = "I looked, and there was no human being, and all the birds of the sky had fled.";
csb[26] = "I looked, and the fertile field was a wilderness. All its cities were torn down because of the LORD and his burning anger.";
csb[27] = "For this is what the LORD says: The whole land will be a desolation, but I will not finish it off.";
csb[28] = "Because of this, the earth will mourn; the skies above will grow dark. I have spoken; I have planned, and I will not relent or turn back from it.";
csb[29] = "Every city flees at the sound of the horseman and the archer. They enter the thickets and climb among the rocks. Every city is abandoned; no inhabitant is left.";
csb[30] = "And you, devastated one, what are you doing that you dress yourself in scarlet, that you adorn yourself with gold jewelry, that you enhance your eyes with makeup? You beautify yourself for nothing. Your lovers reject you; they intend to take your life.";
csb[31] = "I hear a cry like a woman in labor, a cry of anguish like one bearing her first child. The cry of Daughter Zion gasping for breath, stretching out her hands: &quot;Woe is me, for my life is weary because of the murderers! &quot;";
kjv[1] = "If thou wilt return, O Israel, saith the LORD, return unto me: and if thou wilt put away thine abominations out of my sight, then shalt thou not remove.";
rsv[1] = "&quot;If you return, O Israel, says the LORD, to me you should return. If you remove your abominations from my presence, and do not waver,";

yng[1] = "If thou dost turn back, O Israel, An affirmation of Jehovah, unto Me turn back, And if thou dost turn aside Thine abominations from My face, Then thou dost not bemoan.";

yng[2] = "And thou hast sworn -- Jehovah liveth, In truth, in judgment, and in righteousness, And blessed themselves in Him have nations, And in Him they boast themselves.";
dby[2] = "-- and thou shalt in truth, in justice, and in righteousness swear, [As] Jehovah liveth! and the nations shall bless themselves in him, and in him shall they glory.";

web[18] = "Thy way and thy doings have procured these [things] to thee; this [is] thy wickedness, because it is bitter, because it reacheth to thy heart.";
hnv[18] = "Your way and your doings have procured these things to you; this is your wickedness; for it is bitter, for it reaches to your heart.";
vul[18] = "viae tuae et cogitationes tuae fecerunt haec tibi ista malitia tua quia amara quia tetigit cor tuum";
kjv[19] = "My bowels, my bowels! I am pained at my very heart; my heart maketh a noise in me; I cannot hold my peace, because thou hast heard, O my soul, the sound of the trumpet, the alarm of war.";
rsv[19] = "My anguish, my anguish! I writhe in pain! Oh, the walls of my heart! My heart is beating wildly; I cannot keep silent; for I hear the sound of the trumpet, the alarm of war.";
asv[19] = "My anguish, my anguish! I am pained at my very heart; my heart is disquieted in me; I cannot hold my peace; because thou hast heard, O my soul, the sound of the trumpet, the alarm of war.";
yng[19] = "My bowels, my bowels! I am pained [at] the walls of my heart, Make a noise for me doth My heart, I am not silent, For the voice of a trumpet I have heard, O my soul -- a shout of battle!";
dby[19] = "My bowels! my bowels! I am in travail! [Oh,] the walls of my heart! My heart maketh a noise in me; I cannot hold my peace: for thou hearest, my soul, the sound of the trumpet, the clamour of war.";
web[19] = "My bowels, my bowels! I am pained at my very heart; my heart maketh a noise in me; I cannot hold my peace, because thou hast heard, O my soul, the sound of the trumpet, the alarm of war.";
hnv[19] = "My anguish, my anguish! I am pained at my very heart; my heart is disquieted in me; I can\'t hold my shalom; because you have heard, O my soul, the sound of the shofar, the alarm of war.";
vul[19] = "ventrem meum ventrem meum doleo sensus cordis mei turbati sunt in me non tacebo quoniam vocem bucinae audivit anima mea clamorem proelii";
kjv[20] = "Destruction upon destruction is cried; for the whole land is spoiled: suddenly are my tents spoiled, [and] my curtains in a moment.";
rsv[20] = "Disaster follows hard on disaster, the whole land is laid waste. Suddenly my tents are destroyed, my curtains in a moment.";
asv[20] = "Destruction upon destruction is cried; for the whole land is laid waste: suddenly are my tents destroyed, [and] my curtains in a moment.";
yng[20] = "Destruction on destruction is proclaimed, For spoiled hath been all the land, Suddenly spoiled have been my tents, In a moment -- my curtains.";
dby[20] = "Destruction upon destruction is proclaimed; for the whole land is wasted: suddenly are my tents laid waste, my curtains, in a moment.";
web[20] = "Destruction upon destruction is cried; for the whole land is laid waste; suddenly are my tents ruined, [and] my curtains in a moment.";
hnv[20] = "Destruction on destruction is cried; for the whole land is laid waste: suddenly are my tents destroyed, [and] my curtains in a moment.";
vul[20] = "contritio super contritionem vocata est et vastata est omnis terra repente vastata sunt tabernacula mea subito pelles meae";
kjv[21] = "How long shall I see the standard, [and] hear the sound of the trumpet?";
rsv[21] = "How long must I see the standard, and hear the sound of the trumpet?";
asv[21] = "How long shall I see the standard, and hear the sound of the trumpet?";
yng[21] = "Till when do I see an ensign? Do I hear the voice of a trumpet?";
dby[21] = "How long shall I see the standard, [and] hear the sound of the trumpet?";
web[21] = "How long shall I see the standard, [and] hear the sound of the trumpet?";
hnv[21] = "How long shall I see the standard, and hear the sound of the shofar?";
vul[21] = "usquequo videbo fugientem audiam vocem bucinae";
kjv[22] = "For my people [is] foolish, they have not known me; they [are] sottish children, and they have none understanding: they [are] wise to do evil, but to do good they have no knowledge.";
rsv[22] = "&quot;For my people are foolish, they know me not; they are stupid children, they have no understanding. They are skilled in doing evil, but how to do good they know not.&quot;";
asv[22] = "For my people are foolish, they know me not; they are sottish children, and they have no understanding; they are wise to do evil, but to do good they have no knowledge.";
yng[22] = "For my people [are] foolish, me they have not known, Foolish sons [are] they, yea, they [are] not intelligent, Wise [are] they to do evil, And to do good they have not known.";
dby[22] = "For my people is foolish, they have not known me; they are sottish children, and they have no intelligence; they are wise to do evil, but to do good they have no knowledge.";
web[22] = "For my people [are] foolish, they have not known me; they [are] sottish children, and they have no understanding: they [are] wise to do evil, but to do good they have no knowledge.";
hnv[22] = "For my people are foolish, they don\'t know me; they are foolish children, and they have no understanding; they are wise to do evil, but to do good they have no knowledge.";
vul[22] = "quia stultus populus meus me non cognovit filii insipientes sunt et vecordes sapientes sunt ut faciant mala bene autem facere nescierunt";
kjv[23] = "I beheld the earth, and, lo, [it was] without form, and void; and the heavens, and they [had] no light.";
rsv[23] = "I looked on the earth, and lo, it was waste and void; and to the heavens, and they had no light.";
asv[23] = "I beheld the earth, and, lo, it was waste and void; and the heavens, and they had no light.";
yng[23] = "I looked [to] the land, and lo, waste and void, And unto the heavens, and their light is not.";
dby[23] = "I beheld the earth, and lo, it was waste and empty; and the heavens, and they had no light.";
web[23] = "I beheld the earth, and lo, [it was] without form, and void; and the heavens, and they [had] no light.";
hnv[23] = "I saw the eretz, and, behold, it was waste and void; and the heavens, and they had no light.";
vul[23] = "aspexi terram et ecce vacua erat et nihili et caelos et non erat lux in eis";
kjv[24] = "I beheld the mountains, and, lo, they trembled, and all the hills moved lightly.";
rsv[24] = "I looked on the mountains, and lo, they were quaking, and all the hills moved to and fro.";
asv[24] = "I beheld the mountains, and, lo, they trembled, and all the hills moved to and fro.";
yng[24] = "I have looked [to] the mountains, And lo, they are trembling. And all the hills moved themselves lightly.";
dby[24] = "I beheld the mountains, and lo, they trembled, and all the hills shook violently.";
web[24] = "I beheld the mountains, and lo, they trembled, and all the hills moved lightly.";
hnv[24] = "I saw the mountains, and, behold, they trembled, and all the hills moved back and forth.";
vul[24] = "vidi montes et ecce movebantur et omnes colles conturbati sunt";
kjv[25] = "I beheld, and, lo, [there was] no man, and all the birds of the heavens were fled.";
rsv[25] = "I looked, and lo, there was no man, and all the birds of the air had fled.";
asv[25] = "I beheld, and, lo, there was no man, and all the birds of the heavens were fled.";
yng[25] = "I have looked, and lo, man is not, And all fowls of the heavens have fled.";
dby[25] = "I beheld, and lo, man was not, and all the fowl of the heavens were fled.";
web[25] = "I beheld, and lo, [there was] no man, and all the fowls of the heavens had fled.";
hnv[25] = "I saw, and, behold, there was no man, and all the birds of the sky were fled.";
vul[25] = "intuitus sum et non erat homo et omne volatile caeli recessit";
kjv[26] = "I beheld, and, lo, the fruitful place [was] a wilderness, and all the cities thereof were broken down at the presence of the LORD, [and] by his fierce anger.";
rsv[26] = "I looked, and lo, the fruitful land was a desert, and all its cities were laid in ruins before the LORD, before his fierce anger.";
asv[26] = "I beheld, and, lo, the fruitful field was a wilderness, and all the cities thereof were broken down at the presence of Jehovah, [and] before his fierce anger.";
yng[26] = "I have looked, and lo, The fruitful place [is] a wilderness, And all its cities have been broken down, Because of Jehovah, Because of the fierceness of His anger.";
dby[26] = "I beheld, and lo, the fruitful land was a wilderness, and all the cities thereof were broken down, before Jehovah, before his fierce anger.";
web[26] = "I beheld, and lo, the fruitful place [was] a wilderness, and all its cities were broken down at the presence of the LORD, [and] by his fierce anger.";
hnv[26] = "I saw, and, behold, the fruitful field was a wilderness, and all the cities of it were broken down at the presence of the LORD, [and] before his fierce anger.";
vul[26] = "aspexi et ecce Carmelus desertus et omnes urbes eius destructae sunt a facie Domini et a facie irae furoris eius";
kjv[27] = "For thus hath the LORD said, The whole land shall be desolate; yet will I not make a full end.";
rsv[27] = "For thus says the LORD, &quot;The whole land shall be a desolation; yet I will not make a full end.";
asv[27] = "For thus saith Jehovah, The whole land shall be a desolation; yet will I not make a full end.";
yng[27] = "For thus said Jehovah: All the land is a desolation, but a completion I make not.";
dby[27] = "For thus saith Jehovah: The whole land shall be a desolation; but I will not make a full end.";
web[27] = "For thus hath the LORD said, The whole land shall be desolate; yet will I not make a full end.";
hnv[27] = "For thus says the LORD, The whole land shall be a desolation; yet will I not make a full end.";
vul[27] = "haec enim dicit Dominus deserta erit omnis terra sed tamen consummationem non faciam";
kjv[28] = "For this shall the earth mourn, and the heavens above be black: because I have spoken [it], I have purposed [it], and will not repent, neither will I turn back from it.";
rsv[28] = "For this the earth shall mourn, and the heavens above be black; for I have spoken, I have purposed; I have not relented nor will I turn back.&quot;";
asv[28] = "For this shall the earth mourn, and the heavens above be black; because I have spoken it, I have purposed it, and I have not repented, neither will I turn back from it.";
yng[28] = "For this doth the land mourn, And black have been the heavens above, because I have spoken -- I have purposed, And I have not repented, Nor do I turn back from it.";
dby[28] = "For this shall the earth mourn, and the heavens above be black; because I have spoken it, I have purposed it, and will not repent, neither will I turn back therefrom.";
web[28] = "For this shall the earth mourn, and the heavens above be black: because I have spoken [it], I have purposed [it], and will not repent, neither will I turn back from it.";
hnv[28] = "For this shall the eretz mourn, and the heavens above be black; because I have spoken it, I have purposed it, and I have not repented, neither will I turn back from it.";
vul[28] = "lugebit terra et maerebunt caeli desuper eo quod locutus sum cogitavi et non paenituit me nec aversus sum ab eo";
kjv[29] = "The whole city shall flee for the noise of the horsemen and bowmen; they shall go into thickets, and climb up upon the rocks: every city [shall be] forsaken, and not a man dwell therein.";
rsv[29] = "At the noise of horseman and archer every city takes to flight; they enter thickets; they climb among rocks; all the cities are forsaken, and no man dwells in them.";
asv[29] = "Every city fleeth for the noise of the horsemen and bowmen; they go into the thickets, and climb up upon the rocks: every city is forsaken, and not a man dwelleth therein.";
yng[29] = "From the voice of the horseman, And of him shooting with the bow, all the city is fleeing, They have come into thickets, And on cliffs they have gone up, All the city is forsaken, And there is no one dwelling in them.";
dby[29] = "At the noise of the horsemen and bowmen, every city fleeth; they go into the thickets, and climb up upon the rocks: every city is forsaken and no man dwelleth therein.";
web[29] = "The whole city shall flee for the noise of the horsemen and bowmen; they shall go into thickets, and climb up upon the rocks: every city [shall be] forsaken, and not a man dwell therein.";
hnv[29] = "Every city flees for the noise of the horsemen and archers; they go into the thickets, and climb up on the rocks: every city is forsaken, and not a man dwells therein.";
vul[29] = "a voce equitis et mittentis sagittam fugit omnis civitas ingressi sunt ardua et ascenderunt rupes universae urbes derelictae sunt et non habitat in eis homo";
kjv[30] = "And [when] thou [art] spoiled, what wilt thou do? Though thou clothest thyself with crimson, though thou deckest thee with ornaments of gold, though thou rentest thy face with painting, in vain shalt thou make thyself fair; [thy] lovers will despise thee, they will seek thy life.";
rsv[30] = "And you, O desolate one, what do you mean that you dress in scarlet, that you deck yourself with ornaments of gold, that you enlarge your eyes with paint? In vain you beautify yourself. Your lovers despise you; they seek your life.";
asv[30] = "And thou, when thou art made desolate, what wilt thou do? Though thou clothest thyself with scarlet, though thou deckest thee with ornaments of gold, though thou enlargest thine eyes with paint, in vain dost thou make thyself fair; [thy] lovers despise thee, they seek thy life.";
yng[30] = "And thou, O spoiled one, what dost thou? For thou puttest on scarlet, For thou adornest thyself [with] ornaments of gold. For thou rendest with pain thine eyes, In vain thou dost make thyself fair, Kicked against thee have doting ones, Thy life they do seek.";
dby[30] = "-- And thou, wasted one, what wilt thou do? Though thou clothest thyself with crimson, though thou deckest thee with ornaments of gold, though thou rendest thine eyes with paint, in vain dost thou make thyself fair: [thy] lovers despise thee, they seek thy life.";
web[30] = "And [when] thou [art] laid waste, what wilt thou do? Though thou clothest thyself with crimson, though thou deckest thee with ornaments of gold, though thou rendest thy face with painting, in vain shalt thou make thyself fair: [thy] lovers will despise thee, they will seek thy life.";
hnv[30] = "You, when you are made desolate, what will you do? Though you clothe yourself with scarlet, though you deck you with ornaments of gold, though you enlarge your eyes with paint, in vain do you make yourself beautiful; [your] lovers despise you, they seek your life.";
vul[30] = "tu autem vastata quid facies cum vestieris te coccino cum ornata fueris monili aureo et pinxeris stibio oculos tuos frustra conponeris contempserunt te amatores tui animam tuam quaerent";
kjv[31] = "For I have heard a voice as of a woman in travail, [and] the anguish as of her that bringeth forth her first child, the voice of the daughter of Zion, [that] bewaileth herself, [that] spreadeth her hands, [saying], Woe [is] me now! for my soul is wearied because of murderers.";
rsv[31] = "For I heard a cry as of a woman in travail, anguish as of one bringing forth her first child, the cry of the daughter of Zion gasping for breath, stretching out her hands, &quot;Woe is me! I am fainting before murderers.&quot;";
asv[31] = "For I have heard a voice as of a woman in travail, the anguish as of her that bringeth forth her first child, the voice of the daughter of Zion, that gaspeth for breath, that spreadeth her hands, [saying], Woe is me now! for my soul fainteth before the murderers.";
yng[31] = "For a voice as of a sick woman I have heard, Distress, as of one bringing forth a first-born, The voice of the daughter of Zion, She bewaileth herself, she spreadeth out her hands, `Wo to me now, for weary is my soul of slayers!\'";
dby[31] = "For I hear a voice, as of a woman in travail, anguish as of her that bringeth forth her first child, the voice of the daughter of Zion: she moaneth, she spreadeth forth her hands, [saying], Woe unto me! for my soul faileth because of murderers.";
web[31] = "For I have heard a voice as of a woman in travail, [and] the anguish as of her that bringeth forth her first child, the voice of the daughter of Zion, [that] bewaileth herself, [that] spreadeth her hands, [saying], Woe [is] me now! for my soul is wearied because of murderers.";
hnv[31] = "For I have heard a voice as of a woman in travail, the anguish as of her who brings forth her first child, the voice of the daughter of Tziyon, who gasps for breath, who spreads her hands, [saying], Woe is me now! for my soul faints before the murderers.";
vul[31] = "vocem enim quasi parturientis audivi angustias ut puerperae vox filiae Sion intermorientis expandentisque manus suas vae mihi quia defecit anima mea propter interfectos";
