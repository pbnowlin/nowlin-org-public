csb[1] = "This is the word that came to Jeremiah concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah, king of Judah (which was the first year of King Nebuchadnezzar of Babylon).";
csb[2] = "The prophet Jeremiah spoke concerning all the people of Judah and all the residents of Jerusalem as follows:";
csb[3] = "&quot;From the thirteenth year of Josiah son of Amon, king of Judah, until this very day -- twenty-three years -- the word of the LORD has come to me, and I have spoken to you time and time again, but you have not obeyed.";
csb[4] = "&quot;The LORD sent all his servants the prophets to you time and time again, but you have not obeyed or even paid attention.";
csb[5] = "&quot;He announced, \'Turn, each of you, from your evil way of life and from your evil deeds. Live in the land the LORD gave to you and your ancestors long ago and forever.";
csb[6] = "&quot;Do not follow other gods to serve them and to bow in worship to them, and do not anger me by the work of your hands. Then I will do you no harm.";
csb[7] = "&quot; \'But you have not obeyed me\' -- this is the LORD\'s declaration -- \'with the result that you have angered me by the work of your hands and brought disaster on yourselves.\'";
csb[8] = "&quot;Therefore, this is what the LORD of Armies says: \'Because you have not obeyed my words,";
csb[9] = "&quot;I am going to send for all the families of the north\' -- this is the LORD\'s declaration -- \'and send for my servant Nebuchadnezzar king of Babylon, and I will bring them against this land, against its residents, and against all these surrounding nations, and I will completely destroy them and make them an example of horror and scorn, and ruins forever.";
csb[10] = "&quot;I will eliminate the sound of joy and gladness from them -- the voice of the groom and the bride, the sound of the millstones and the light of the lamp.";
csb[11] = "&quot;This whole land will become a desolate ruin, and these nations will serve the king of Babylon for seventy years.";
csb[12] = "&quot;When the seventy years are completed, I will punish the king of Babylon and that nation\' -- this is the LORD\'s declaration -- \'the land of the Chaldeans, for their iniquity, and I will make it a ruin forever.";
csb[13] = "&quot;I will bring on that land all my words I have spoken against it, all that is written in this book that Jeremiah prophesied against all the nations.";
csb[14] = "&quot;For many nations and great kings will enslave them, and I will repay them according to their deeds and the work of their hands.\' &quot;";
csb[15] = "This is what the LORD, the God of Israel, said to me: &quot;Take this cup of the wine of wrath from my hand and make all the nations to whom I am sending you drink from it.";
csb[16] = "&quot;They will drink, stagger, and go out of their minds because of the sword I am sending among them.&quot;";
csb[17] = "So I took the cup from the LORD\'s hand and made all the nations to whom the LORD sent me drink from it.";
csb[18] = "Jerusalem and the other cities of Judah, its kings and its officials, to make them a desolate ruin, an example for scorn and cursing -- as it is today;";
csb[19] = "Pharaoh king of Egypt, his officers, his leaders, all his people,";
csb[20] = "and all the mixed peoples; all the kings of the land of Uz; all the kings of the land of the Philistines -- Ashkelon, Gaza, Ekron, and the remnant of Ashdod;";
csb[21] = "Edom, Moab, and the Ammonites;";
csb[22] = "all the kings of Tyre, all the kings of Sidon, and the kings of the coasts and islands;";
csb[23] = "Dedan, Tema, Buz, and all those who clip the hair on their temples;";
csb[24] = "all the kings of Arabia, and all the kings of the mixed peoples who have settled in the desert;";
csb[25] = "all the kings of Zimri, all the kings of Elam, and all the kings of Media;";
csb[26] = "all the kings of the north, both near and far from one another; that is, all the kingdoms of the world throughout the earth. Finally, the king of Sheshach will drink after them.";
csb[27] = "&quot;Then you are to say to them, \'This is what the LORD of Armies, the God of Israel, says: Drink, get drunk, and vomit. Fall down and never get up again, as a result of the sword I am sending among you.\'";
csb[28] = "&quot;If they refuse to accept the cup from your hand and drink, you are to say to them, \'This is what the LORD of Armies says: You must drink!";
csb[29] = "&quot;For I am already bringing disaster on the city that bears my name, so how could you possibly go unpunished? You will not go unpunished, for I am summoning a sword against all the inhabitants of the earth. This is the declaration of the LORD of Armies.\'";
csb[30] = "&quot;As for you, you are to prophesy all these things to them, and say to them: The LORD roars from on high; he makes his voice heard from his holy dwelling. He roars loudly over his grazing land; he calls out with a shout, like those who tread grapes, against all the inhabitants of the earth.";
csb[31] = "&quot;The tumult reaches to the ends of the earth because the LORD brings a case against the nations. He enters into judgment with all people. As for the wicked, he hands them over to the sword -- this is the LORD\'s declaration.";
csb[32] = "&quot;This is what the LORD of Armies says: Pay attention! Disaster spreads from nation to nation. A huge storm is stirred up from the ends of the earth.&quot;";
csb[33] = "Those slain by the LORD on that day will be scattered from one end of the earth to the other. They will not be mourned, gathered, or buried. They will be like manure on the soil\'s surface.";
csb[34] = "Wail, you shepherds, and cry out. Roll in the dust, you leaders of the flock. Because the days of your slaughter have come, you will fall and become shattered like a precious vase.";
csb[35] = "Flight will be impossible for the shepherds, and escape, for the leaders of the flock.";
csb[36] = "Hear the sound of the shepherds\' cry, the wail of the leaders of the flock, for the LORD is destroying their pasture.";
csb[37] = "Peaceful grazing land will become lifeless because of the LORD\'s burning anger.";
csb[38] = "He has left his den like a lion, for their land has become a desolation because of the sword of the oppressor, because of his burning anger.";

kjv[3] = "From the thirteenth year of Josiah the son of Amon king of Judah, even unto this day, that [is] the three and twentieth year, the word of the LORD hath come unto me, and I have spoken unto you, rising early and speaking; but ye have not hearkened.";
rsv[3] = "&quot;For twenty-three years, from the thirteenth year of Josi\'ah the son of Amon, king of Judah, to this day, the word of the LORD has come to me, and I have spoken persistently to you, but you have not listened.";
asv[3] = "From the thirteenth year of Josiah the son of Amon, king of Judah, even unto this day, these three and twenty years, the word of Jehovah hath come unto me, and I have spoken unto you, rising up early and speaking; but ye have not hearkened.";
yng[3] = "`From the thirteenth year of Josiah son of Amon king of Judah, and unto this day -- this three and twentieth year -- hath the word of Jehovah been unto me, and I speak unto you, rising early and speaking, and ye have not hearkened;";
dby[3] = "From the thirteenth year of Josiah the son of Amon, the king of Judah, even unto this day, these three and twenty years, the word of Jehovah hath come unto me, and I have spoken unto you, rising early and speaking; but ye have not hearkened.";
web[3] = "From the thirteenth year of Josiah the son of Amon king of Judah, even to this day, that [is] the three and twentieth year, the word of the LORD hath come to me, and I have spoken to you, rising early and speaking; but ye have not hearkened.";
hnv[3] = " From the thirteenth year of Yoshiyahu the son of Amon, king of Yehudah, even to this day, these twenty-three years, the word of the LORD has come to me, and I have spoken to you, rising up early and speaking; but you have not listened.";
vul[3] = "a tertiodecimo anno Iosiae filii Amon regis Iuda usque ad diem hanc iste est tertius et vicesimus annus factum est verbum Domini ad me et locutus sum ad vos de nocte consurgens et loquens et non audistis";
kjv[4] = "And the LORD hath sent unto you all his servants the prophets, rising early and sending [them]; but ye have not hearkened, nor inclined your ear to hear.";
rsv[4] = "You have neither listened nor inclined your ears to hear, although the LORD persistently sent to you all his servants the prophets,";
asv[4] = "And Jehovah hath sent unto you all his servants the prophets, rising up early and sending them, (but ye have not hearkened, nor inclined your ear to hear),";
yng[4] = "And Jehovah hath sent unto you all His servants, the prophets, rising early and sending, and ye have not hearkened, nor inclined your ear to hear, saying:";
dby[4] = "And Jehovah hath sent unto you all his servants the prophets, rising early and sending; but ye have not hearkened, nor inclined your ear to hear,";

hnv[4] = "The LORD has sent to you all his servants the prophets, rising up early and sending them, (but you have not listened, nor inclined your ear to hear,)";
vul[4] = "et misit Dominus ad vos omnes servos suos prophetas consurgens diluculo mittensque et non audistis neque inclinastis aures vestras ut audiretis";
kjv[5] = "They said, Turn ye again now every one from his evil way, and from the evil of your doings, and dwell in the land that the LORD hath given unto you and to your fathers for ever and ever:";
rsv[5] = "saying, \'Turn now, every one of you, from his evil way and wrong doings, and dwell upon the land which the LORD has given to you and your fathers from of old and for ever;";
asv[5] = "saying, Return ye now every one from his evil way, and from the evil of your doings, and dwell in the land that Jehovah hath given unto you and to your fathers, from of old and even for evermore;";
yng[5] = "`Turn back, I pray you, each from his evil way, and from the evil of your doings, and dwell on the ground that Jehovah hath given to you and to your fathers from age unto age,";
dby[5] = "when they said, Turn again now every one from his evil way, and from the wickedness of your doings, and dwell in the land that Jehovah hath given unto you and to your fathers from of old even for ever.";
web[5] = "They said, Turn ye again now every one from his evil way, and from the evil of your doings, and dwell in the land that the LORD hath given to you and to your fathers for ever and ever:";
hnv[5] = "saying, Return you now everyone from his evil way, and from the evil of your doings, and dwell in the land that the LORD has given to you and to your fathers, from of old and even forevermore;";
vul[5] = "cum diceret revertimini unusquisque a via sua mala et a pessimis cogitationibus vestris et habitabitis in terram quam dedit Dominus vobis et patribus vestris a saeculo et usque in saeculum";
kjv[6] = "And go not after other gods to serve them, and to worship them, and provoke me not to anger with the works of your hands; and I will do you no hurt.";
rsv[6] = "do not go after other gods to serve and worship them, or provoke me to anger with the work of your hands. Then I will do you no harm.\'";
asv[6] = "and go not after other gods to serve them, and to worship them, and provoke me not to anger with the work of your hands; and I will do you no hurt.";
yng[6] = "And ye do not go after other gods to serve them, and to bow yourselves to them, nor do ye provoke Me to anger with the work of your hands, and I do no evil to you;";
dby[6] = "And go not after other gods, to serve them and to worship them; and provoke me not to anger with the work of your hands; and I will do you no hurt.";
web[6] = "And go not after other gods to serve them, and to worship them, and provoke me not to anger with the works of your hands; and I will do you no hurt.";
hnv[6] = "and don\'t go after other gods to serve them or worship them, and don\'t provoke me to anger with the work of your hands; and I will do you no harm.";
vul[6] = "et nolite ire post deos alienos ut serviatis eis adoretisque eos neque me ad iracundiam provocetis in operibus manuum vestrarum et non adfligam vos";
kjv[7] = "Yet ye have not hearkened unto me, saith the LORD; that ye might provoke me to anger with the works of your hands to your own hurt.";
rsv[7] = "Yet you have not listened to me, says the LORD, that you might provoke me to anger with the work of your hands to your own harm.";
asv[7] = "Yet ye have not hearkened unto me, saith Jehovah; that ye may provoke me to anger with the work of your hands to your own hurt.";
yng[7] = "And ye have not hearkened unto Me -- an affirmation of Jehovah -- so as to provoke Me to anger with the work of your hands for evil to you.";
dby[7] = "But ye have not hearkened unto me, saith Jehovah; that ye might provoke me to anger with the work of your hands, to your own hurt.";
web[7] = "Yet ye have not hearkened to me, saith the LORD; that ye might provoke me to anger with the works of your hands to your own hurt.";
hnv[7] = "Yet you have not listened to me, says the LORD; that you may provoke me to anger with the work of your hands to your own hurt.";
vul[7] = "et non audistis me dicit Dominus ut me ad iracundiam provocaretis in operibus manuum vestrarum in malum vestrum";

kjv[9] = "Behold, I will send and take all the families of the north, saith the LORD, and Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land, and against the inhabitants thereof, and against all these nations round about, and will utterly destroy them, and make them an astonishment, and an hissing, and perpetual desolations.";
rsv[9] = "behold, I will send for all the tribes of the north, says the LORD, and for Nebuchadrez\'zar the king of Babylon, my servant, and I will bring them against this land and its inhabitants, and against all these nations round about; I will utterly destroy them, and make them a horror, a hissing, and an everlasting reproach.";
asv[9] = "behold, I will send and take all the families of the north, saith Jehovah, and [I will send] unto Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land, and against the inhabitants thereof, and against all these nations round about; and I will utterly destroy them, and make them an astonishment, and a hissing, and perpetual desolations.";
yng[9] = "Lo, I am sending, and have taken all the families of the north -- an affirmation of Jehovah -- even unto Nebuchadrezzar king of Babylon, My servant, and have brought them in against this land, and against its inhabitants, and against all these nations round about, and have devoted them, and appointed them for an astonishment, and for a hissing, and for wastes age-during.";
dby[9] = "behold, I will send and take all the families of the north, saith Jehovah, and [I will send] to Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land, and against the inhabitants thereof, and against all these nations round about; and I will utterly destroy them, and make them an astonishment, and a hissing, and perpetual wastes.";
web[9] = "Behold, I will send and take all the families of the north, saith the LORD, and Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land, and against its inhabitants, and against all these nations around, and will utterly destroy them, and make them an astonishment, and a hissing, and perpetual desolations.";
hnv[9] = "behold, I will send and take all the families of the north, says the LORD, and [I will send] to Nevukhadretztzar the king of Bavel, my servant, and will bring them against this land, and against the inhabitants of it, and against all these nations round about; and I will utterly destroy them, and make them an astonishment, and a hissing, and perpetual desolations.";
vul[9] = "ecce ego mittam et adsumam universas cognationes aquilonis ait Dominus et ad Nabuchodonosor regem Babylonis servum meum et adducam eos super terram istam et super habitatores eius et super omnes nationes quae in circuitu illius sunt et interficiam eos et ponam eos in stuporem et in sibilum et in solitudines sempiternas";
kjv[10] = "Moreover I will take from them the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the sound of the millstones, and the light of the candle.";
rsv[10] = "Moreover, I will banish from them the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride, the grinding of the millstones and the light of the lamp.";
asv[10] = "Moreover I will take from them the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride, the sound of the millstones, and the light of the lamp.";
yng[10] = "And I have destroyed from them the voice of rejoicing, and the voice of joy, voice of bridegroom and voice of bride, noise of millstones, and the light of lamps.";
dby[10] = "And I will cause to perish from them the voice of mirth and the voice of joy, the voice of the bridegroom and the voice of the bride, the sound of the millstones and the light of the lamp.";
web[10] = "Moreover I will take from them the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the sound of the millstones, and the light of the candle.";
hnv[10] = "Moreover I will take from them the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride, the sound of the millstones, and the light of the lamp.";
vul[10] = "perdamque ex eis vocem gaudii et vocem laetitiae vocem sponsae et vocem sponsi vocem molae et lumen lucernae";
kjv[11] = "And this whole land shall be a desolation, [and] an astonishment; and these nations shall serve the king of Babylon seventy years.";
rsv[11] = "This whole land shall become a ruin and a waste, and these nations shall serve the king of Babylon seventy years.";
asv[11] = "And this whole land shall be a desolation, and an astonishment; and these nations shall serve the king of Babylon seventy years.";
yng[11] = "And all this land hath been for a waste, for an astonishment, and these nations have served the king of Babylon seventy years.";
dby[11] = "And this whole land shall become a waste, an astonishment; and these nations shall serve the king of Babylon seventy years.";
web[11] = "And this whole land shall be a desolation, [and] an astonishment; and these nations shall serve the king of Babylon seventy years.";
hnv[11] = "This whole land shall be a desolation, and an astonishment; and these nations shall serve the king of Bavel seventy years.";
vul[11] = "et erit universa terra eius in solitudinem et in stuporem et servient omnes gentes istae regi Babylonis septuaginta annis";
kjv[12] = "And it shall come to pass, when seventy years are accomplished, [that] I will punish the king of Babylon, and that nation, saith the LORD, for their iniquity, and the land of the Chaldeans, and will make it perpetual desolations.";
rsv[12] = "Then after seventy years are completed, I will punish the king of Babylon and that nation, the land of the Chalde\'ans, for their iniquity, says the LORD, making the land an everlasting waste.";
asv[12] = "And it shall come to pass, when seventy years are accomplished, that I will punish the king of Babylon, and that nation, saith Jehovah, for their iniquity, and the land of the Chaldeans; and I will make it desolate for ever.";
yng[12] = "`And it hath come to pass, at the fulness of seventy years, I charge against the king of Babylon, and against that nation -- an affirmation of Jehovah -- their iniquity, and against the land of the Chaldeans, and have appointed it for desolations age-during.";
dby[12] = "And it shall come to pass, when seventy years are accomplished, [that] I will visit on the king of Babylon and on that nation, saith Jehovah, their iniquity, and on the land of the Chaldeans, and I will make it perpetual desolations.";
web[12] = "And it shall come to pass, when seventy years are accomplished, [that] I will punish the king of Babylon, and that nation, saith the LORD, for their iniquity, and the land of the Chaldeans, and will make it perpetual desolations.";
hnv[12] = "It shall happen, when seventy years are accomplished, that I will punish the king of Bavel, and that nation, says the LORD, for their iniquity, and the land of the Kasdim; and I will make it desolate forever.";
vul[12] = "cumque impleti fuerint anni septuaginta visitabo super regem Babylonis et super gentem illam dicit Dominus iniquitatem eorum et super terram Chaldeorum et ponam illam in solitudines sempiternas";
kjv[13] = "And I will bring upon that land all my words which I have pronounced against it, [even] all that is written in this book, which Jeremiah hath prophesied against all the nations.";
rsv[13] = "I will bring upon that land all the words which I have uttered against it, everything written in this book, which Jeremiah prophesied against all the nations.";
asv[13] = "And I will bring upon that land all my words which I have pronounced against it, even all that is written in this book, which Jeremiah hath prophesied against all the nations.";
yng[13] = "And I have brought in on that land all My words that I have spoken against it, all that is written in this book, that Jeremiah hath prophesied concerning all the nations.";
dby[13] = "And I will bring upon that land all my words which I have pronounced against it, all that is written in this book, which Jeremiah hath prophesied against all the nations.";
web[13] = "And I will bring upon that land all my words which I have pronounced against it, [even] all that is written in this book, which Jeremiah hath prophesied against all the nations.";
hnv[13] = "I will bring on that land all my words which I have pronounced against it, even all that is written in this book, which Yirmeyahu has prophesied against all the nations.";
vul[13] = "et adducam super terram illam omnia verba mea quae locutus sum contra eam omne quod scriptum est in libro isto quaecumque prophetavit Hieremias adversum omnes gentes";
kjv[14] = "For many nations and great kings shall serve themselves of them also: and I will recompense them according to their deeds, and according to the works of their own hands.";
rsv[14] = "For many nations and great kings shall make slaves even of them; and I will recompense them according to their deeds and the work of their hands.&quot;";
asv[14] = "For many nations and great kings shall make bondmen of them, even of them; and I will recompense them according to their deeds, and according to the work of their hands.";
yng[14] = "For laid service on them -- also them -- have many nations and great kings, and I have given recompence to them according to their doing, and according to the work of their hands.";
dby[14] = "For many nations and great kings shall serve themselves of them also; and I will recompense them according to their deeds, and according to the work of their hands.";
web[14] = "For many nations and great kings shall reduce them to subjection also: and I will recompense them according to their deeds, and according to the works of their own hands.";
hnv[14] = "For many nations and great kings shall make bondservants of them, even of them; and I will recompense them according to their deeds, and according to the work of their hands.";
vul[14] = "quia servierunt eis cum essent gentes multae et reges magni et reddam eis secundum opera eorum et secundum facta manuum suarum";
kjv[15] = "For thus saith the LORD God of Israel unto me; Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it.";
rsv[15] = "Thus the LORD, the God of Israel, said to me: &quot;Take from my hand this cup of the wine of wrath, and make all the nations to whom I send you drink it.";
asv[15] = "For thus saith Jehovah, the God of Israel, unto me: Take this cup of the wine of wrath at my hand, and cause all the nations, to whom I send thee, to drink it.";
yng[15] = "`For thus said Jehovah God of Israel unto me, Take the wine cup of this fury out of My hand, and thou hast caused all the nations to drink it unto whom I am sending thee;";
dby[15] = "For thus hath Jehovah the God of Israel said unto me: Take the cup of the wine of this fury at my hand, and cause all the nations to whom I send thee to drink it.";
web[15] = "For thus saith the LORD God of Israel to me; Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it.";
hnv[15] = "For thus says the LORD, the God of Yisra\'el, to me: take this cup of the wine of wrath at my hand, and cause all the nations, to whom I send you, to drink it.";
vul[15] = "quia sic dicit Dominus exercituum Deus Israhel sume calicem vini furoris huius de manu mea et propinabis de illo cunctis gentibus ad quas ego mittam te";
kjv[16] = "And they shall drink, and be moved, and be mad, because of the sword that I will send among them.";
rsv[16] = "They shall drink and stagger and be crazed because of the sword which I am sending among them.&quot;";
asv[16] = "And they shall drink, and reel to and fro, and be mad, because of the sword that I will send among them.";
yng[16] = "And they have drunk, and shaken themselves and shewn themselves foolish, because of the sword that I am sending among them.";
dby[16] = "And they shall drink, and reel to and fro, and be mad, because of the sword that I will send among them.";
web[16] = "And they shall drink, and be moved, and enraged, because of the sword that I will send among them.";
hnv[16] = "They shall drink, and reel back and forth, and be mad, because of the sword that I will send among them.";
vul[16] = "et bibent et turbabuntur et insanient a facie gladii quem ego mittam inter eos";
kjv[17] = "Then took I the cup at the LORD\'S hand, and made all the nations to drink, unto whom the LORD had sent me:";
rsv[17] = "So I took the cup from the LORD\'s hand, and made all the nations to whom the Lord sent me drink it:";
asv[17] = "Then took I the cup at Jehovah\'s hand, and made all the nations to drink, unto whom Jehovah had sent me:";
yng[17] = "`And I take the cup out of the hand of Jehovah, and cause all the nations to drink unto whom Jehovah sent me:";
dby[17] = "And I took the cup at Jehovah\'s hand, and made all the nations to drink, to whom Jehovah had sent me:";
web[17] = "Then I took the cup at the LORD\'S hand, and made all the nations to drink, to whom the LORD had sent me:";
hnv[17] = "Then took I the cup at the LORD\'s hand, and made all the nations to drink, to whom the LORD had sent me:";
vul[17] = "et accepi calicem de manu Domini et propinavi cunctis gentibus ad quas misit me Dominus";
kjv[18] = "[To wit], Jerusalem, and the cities of Judah, and the kings thereof, and the princes thereof, to make them a desolation, an astonishment, an hissing, and a curse; as [it is] this day;";
rsv[18] = "Jerusalem and the cities of Judah, its kings and princes, to make them a desolation and a waste, a hissing and a curse, as at this day;";
asv[18] = "[to wit], Jerusalem, and the cities of Judah, and the kings thereof, and the princes thereof, to make them a desolation, an astonishment, a hissing, and a curse, as it is this day;";
yng[18] = "Jerusalem, and the cities of Judah, And its kings, its heads, To give them to waste, to astonishment, To hissing, and to reviling, as [at] this day.";
dby[18] = "Jerusalem, and the cities of Judah, and the kings thereof, and the princes thereof, to make them a waste, an astonishment, a hissing, and a curse, as it is this day;";
web[18] = "[To wit], Jerusalem, and the cities of Judah, and her kings, and her princes, to make them a desolation, an astonishment, a hissing, and a curse; as [it is] this day;";
hnv[18] = "[to wit], Yerushalayim, and the cities of Yehudah, and the kings of it, and the princes of it, to make them a desolation, an astonishment, a hissing, and a curse, as it is this day;";
vul[18] = "Hierusalem et civitatibus Iudae et regibus eius et principibus eius ut darem eos in solitudinem et in stuporem in sibilum et in maledictionem sicut est dies ista";
kjv[19] = "Pharaoh king of Egypt, and his servants, and his princes, and all his people;";
rsv[19] = "Pharaoh king of Egypt, his servants, his princes, all his people,";
asv[19] = "Pharaoh king of Egypt, and his servants, and his princes, and all his people;";
yng[19] = "Pharaoh king of Egypt, and his servants, And his heads, and all his people,";
dby[19] = "Pharaoh king of Egypt, and his servants, and his princes, and all his people;";
web[19] = "Pharaoh king of Egypt, and his servants, and his princes, and all his people;";
hnv[19] = "Par`oh king of Mitzrayim, and his servants, and his princes, and all his people;";
vul[19] = "Pharaoni regi Aegypti et servis eius et principibus eius et omni populo eius";
kjv[20] = "And all the mingled people, and all the kings of the land of Uz, and all the kings of the land of the Philistines, and Ashkelon, and Azzah, and Ekron, and the remnant of Ashdod,";
rsv[20] = "and all the foreign folk among them; all the kings of the land of Uz and all the kings of the land of the Philistines (Ash\'kelon, Gaza, Ekron, and the remnant of Ashdod);";
asv[20] = "and all the mingled people, and all the kings of the land of Uz, and all the kings of the Philistines, and Ashkelon, and Gaza, and Ekron, and the remnant of Ashdod;";
yng[20] = "And all the mixed people, And all the kings of the land of Uz, And all the kings of the land of the Philistines, And Ashkelon, and Gazzah, and Ekron, And the remnant of Ashdod,";
dby[20] = "and all the mingled people, and all the kings of the land of Uz, and all the kings of the land of the Philistines, and Ashkelon, and Gazah, and Ekron, and the remnant of Ashdod;";
web[20] = "And all the mingled people, and all the kings of the land of Uz, and all the kings of the land of the Philistines, and Ashkelon, and Azzah, and Ekron, and the remnant of Ashdod,";
hnv[20] = "and all the mixed people, and all the kings of the land of the `Utz, and all the kings of the Pelishtim, and Ashkelon, and `Aza, and `Ekron, and the remnant of Ashdod;";

rsv[21] = "Edom, Moab, and the sons of Ammon;";
asv[21] = "Edom, and Moab, and the children of Ammon;";
yng[21] = "Edom, and Moab, and the sons of Ammon,";
dby[21] = "Edom, and Moab, and the children of Ammon;";
web[21] = "Edom, and Moab, and the children of Ammon,";
hnv[21] = "Edom, and Mo\'av, and the children of `Ammon;";

rsv[22] = "all the kings of Tyre, all the kings of Sidon, and the kings of the coastland across the sea;";
asv[22] = "and all the kings of Tyre, and all the kings of Sidon, and the kings of the isle which is beyond the sea;";
yng[22] = "And all the kings of Tyre, And all the kings of Zidon, And the kings of the isle that [is] beyond the sea,";
dby[22] = "and all the kings of Tyre, and all the kings of Zidon, and the kings of the isles that are beyond the sea;";
web[22] = "And all the kings of Tyre, and all the kings of Zidon, and the kings of the isles which [are] beyond the sea,";
hnv[22] = "and all the kings of Tzor, and all the kings of Tzidon, and the kings of the isle which is beyond the sea;";
vul[22] = "et cunctis regibus Tyri et cunctis regibus Sidonis et regibus terrae insularum qui sunt trans mare";
kjv[23] = "Dedan, and Tema, and Buz, and all [that are] in the utmost corners,";
rsv[23] = "Dedan, Tema, Buz, and all who cut the corners of their hair;";
asv[23] = "Dedan, and Tema, and Buz, and all that have the corners [of their hair] cut off;";
yng[23] = "Dedan, and Tema, and Buz, And all cutting the corners [of the beard],";
dby[23] = "Dedan, and Tema, and Buz, and all that have the corners [of their beard] cut off;";
web[23] = "Dedan, and Tema, and Buz, and all [that are] in the utmost corners,";
hnv[23] = "Dedan, and Tema, and Buz, and all who have the corners [of their hair] cut off;";
vul[23] = "et Dedan et Theman et Buz et universis qui adtonsi sunt in comam";
kjv[24] = "And all the kings of Arabia, and all the kings of the mingled people that dwell in the desert,";
rsv[24] = "all the kings of Arabia and all the kings of the mixed tribes that dwell in the desert;";
asv[24] = "and all the kings of Arabia, and all the kings of the mingled people that dwell in the wilderness;";
yng[24] = "And all the kings of Arabia, And all the kings of the mixed people, Who are dwelling in the wilderness,";
dby[24] = "and all the kings of Arabia, and all the kings of the mingled people that dwell in the desert;";
web[24] = "And all the kings of Arabia, and all the kings of the mingled people that dwell in the desert,";
hnv[24] = "and all the kings of `Arav, and all the kings of the mixed people who dwell in the wilderness;";
vul[24] = "et cunctis regibus Arabiae et cunctis regibus occidentis qui habitant in deserto";
kjv[25] = "And all the kings of Zimri, and all the kings of Elam, and all the kings of the Medes,";
rsv[25] = "all the kings of Zimri, all the kings of Elam, and all the kings of Media;";
asv[25] = "and all the kings of Zimri, and all the kings of Elam, and all the kings of the Medes;";
yng[25] = "And all the kings of Zimri, And all the kings of Elam, And all the kings of Media,";
dby[25] = "and all the kings of Zimri, and all the kings of Elam, and all the kings of the Medes;";
web[25] = "And all the kings of Zimri, and all the kings of Elam, and all the kings of the Medes,";
hnv[25] = "and all the kings of Zimri, and all the kings of `Elam, and all the kings of the Madai;";
vul[25] = "et cunctis regibus Zambri et cunctis regibus Aelam et cunctis regibus Medorum";
kjv[26] = "And all the kings of the north, far and near, one with another, and all the kingdoms of the world, which [are] upon the face of the earth: and the king of Sheshach shall drink after them.";
rsv[26] = "all the kings of the north, far and near, one after another, and all the kingdoms of the world which are on the face of the earth. And after them the king of Babylon shall drink.";
asv[26] = "and all the kings of the north, far and near, one with another; and all the kingdoms of the world, which are upon the face of the earth: and the king of Sheshach shall drink after them.";
yng[26] = "And all the kings of the north, The near and the far off, one unto another, And all the kingdoms of the earth, That [are] on the face of the ground, And king Sheshach drinketh after them.";
dby[26] = "and all the kings of the north, far and near, one with another; and all the kingdoms of the world, which are upon the face of the earth; and the king of Sheshach shall drink after them.";
web[26] = "And all the kings of the north, far and near, one with another, and all the kingdoms of the world, which [are] upon the face of the earth: and the king of Sheshach shall drink after them.";
hnv[26] = "and all the kings of the north, far and near, one with another; and all the kingdoms of the world, which are on the surface of the eretz: and the king of Sheshakh shall drink after them.";
vul[26] = "et cunctis regibus aquilonis de prope et de longe unicuique contra fratrem suum et omnibus regnis terrae quae super faciem eius sunt et rex Sesach bibet post eos";
kjv[27] = "Therefore thou shalt say unto them, Thus saith the LORD of hosts, the God of Israel; Drink ye, and be drunken, and spue, and fall, and rise no more, because of the sword which I will send among you.";
rsv[27] = "&quot;Then you shall say to them, \'Thus says the LORD of hosts, the God of Israel: Drink, be drunk and vomit, fall and rise no more, because of the sword which I am sending among you.\'";
asv[27] = "And thou shalt say unto them, Thus saith Jehovah of hosts, the God of Israel: Drink ye, and be drunken, and spew, and fall, and rise no more, because of the sword which I will send among you.";
yng[27] = "And thou hast said unto them: Thus said Jehovah of Hosts God of Israel, Drink ye, yea drink abundantly, And vomit, and fall, and rise not, Because of the sword that I am sending among you.";
dby[27] = "And thou shalt say unto them, Thus saith Jehovah of hosts, the God of Israel: Drink, and be drunken, and vomit, and fall, and rise no more, because of the sword that I will send among you.";
web[27] = "Therefore thou shalt say to them, Thus saith the LORD of hosts, the God of Israel; Drink ye, and be drunken, and vomit, and fall, and rise no more, because of the sword which I will send among you.";
hnv[27] = "You shall tell them, Thus says the LORD of Hosts, the God of Yisra\'el: Drink you, and be drunken, and spew, and fall, and rise no more, because of the sword which I will send among you.";
vul[27] = "et dices ad eos haec dicit Dominus exercituum Deus Israhel bibite et inebriamini et vomite et cadite neque surgatis a facie gladii quem ego mittam inter vos";
kjv[28] = "And it shall be, if they refuse to take the cup at thine hand to drink, then shalt thou say unto them, Thus saith the LORD of hosts; Ye shall certainly drink.";
rsv[28] = "&quot;And if they refuse to accept the cup from your hand to drink, then you shall say to them, \'Thus says the LORD of hosts: You must drink!";
asv[28] = "And it shall be, if they refuse to take the cup at thy hand to drink, then shalt thou say unto them, Thus saith Jehovah of hosts: Ye shall surely drink.";
yng[28] = "And it hath come to pass, When they refuse to receive the cup out of thy hand to drink, That thou hast said unto them: Thus said Jehovah of Hosts, Ye do certainly drink.";
dby[28] = "And it shall be, if they refuse to take the cup from thy hand to drink, then shalt thou say unto them, Thus saith Jehovah of hosts: Ye shall certainly drink.";
web[28] = "And it shall be, if they refuse to take the cup at thy hand to drink, then shalt thou say to them, Thus saith the LORD of hosts; Ye shall certainly drink.";
hnv[28] = "It shall be, if they refuse to take the cup at your hand to drink, then shall you tell them, Thus says the LORD of Hosts: You shall surely drink.";
vul[28] = "cumque noluerint accipere calicem de manu ut bibant dices ad eos haec dicit Dominus exercituum bibentes bibetis";
kjv[29] = "For, lo, I begin to bring evil on the city which is called by my name, and should ye be utterly unpunished? Ye shall not be unpunished: for I will call for a sword upon all the inhabitants of the earth, saith the LORD of hosts.";
rsv[29] = "For behold, I begin to work evil at the city which is called by my name, and shall you go unpunished? You shall not go unpunished, for I am summoning a sword against all the inhabitants of the earth, says the LORD of hosts.\'";
asv[29] = "For, lo, I begin to work evil at the city which is called by my name; and should ye be utterly unpunished? Ye shall not be unpunished; for I will call for a sword upon all the inhabitants of the earth, saith Jehovah of hosts.";
yng[29] = "For lo, in the city over which My name is called, I am beginning to do evil, And ye -- ye are entirely acquitted! Ye are not acquitted, for a sword I am proclaiming, For all inhabitants of the land, An affirmation of Jehovah of Hosts.";
dby[29] = "For behold, I begin to bring evil on the city that is called by my name, and should ye be altogether unpunished? Ye shall not be unpunished; for I call for a sword upon all the inhabitants of the earth, saith Jehovah of hosts.";
web[29] = "For lo, I begin to bring evil on the city which is called by my name, and should ye be utterly unpunished? Ye shall not be unpunished: for I will call for a sword upon all the inhabitants of the earth, saith the LORD of hosts.";
hnv[29] = "For, behold, I begin to work evil at the city which is called by my name; and should you be utterly unpunished? You shall not be unpunished; for I will call for a sword on all the inhabitants of the eretz, says the LORD of Hosts.";
vul[29] = "quia ecce in civitate in qua invocatum est nomen meum ego incipio adfligere et vos quasi innocentes inmunes eritis non eritis inmunes gladium enim ego voco super omnes habitatores terrae dicit Dominus exercituum";
kjv[30] = "Therefore prophesy thou against them all these words, and say unto them, The LORD shall roar from on high, and utter his voice from his holy habitation; he shall mightily roar upon his habitation; he shall give a shout, as they that tread [the grapes], against all the inhabitants of the earth.";
rsv[30] = "&quot;You, therefore, shall prophesy against them all these words, and say to them: \'The LORD will roar from on high, and from his holy habitation utter his voice; he will roar mightily against his fold, and shout, like those who tread grapes, against all the inhabitants of the earth.";
asv[30] = "Therefore prophesy thou against them all these words, and say unto them, Jehovah will roar from on high, and utter his voice from his holy habitation; he will mightily roar against his fold; he will give a shout, as they that tread [the grapes], against all the inhabitants of the earth.";
yng[30] = "And thou, thou dost prophesy unto them all these words, and hast said unto them: Jehovah from the high place doth roar, And from His holy habitation giveth forth His voice, He surely roareth for His habitation, A shout as of treaders down, God answereth all the inhabitants of the land,";
dby[30] = "And thou, prophesy unto them all these words, and say unto them, Jehovah will roar from on high, and utter his voice from his holy habitation; he will mightily roar upon his dwelling-place, he will give a shout, as they that tread [the vintage], against all the inhabitants of the earth.";
web[30] = "Therefore prophesy thou against them all these words, and say to them, The LORD shall roar from on high, and utter his voice from his holy habitation; he shall mightily roar upon his habitation; he shall give a shout, as they that tread [the grapes], against all the inhabitants of the earth.";
hnv[30] = "Therefore prophesy you against them all these words, and tell them, the LORD will roar from on high, and utter his voice from his holy habitation; he will mightily roar against his fold; he will give a shout, as those who tread [the grapes], against all the inhabitants of the eretz.";
vul[30] = "et tu prophetabis ad eos omnia verba haec et dices ad illos Dominus de excelso rugiet et de habitaculo sancto suo dabit vocem suam rugiens rugiet super decorem suum celeuma quasi calcantium concinetur adversus omnes habitatores terrae";
kjv[31] = "A noise shall come [even] to the ends of the earth; for the LORD hath a controversy with the nations, he will plead with all flesh; he will give them [that are] wicked to the sword, saith the LORD.";
rsv[31] = "The clamor will resound to the ends of the earth, for the LORD has an indictment against the nations; he is entering into judgment with all flesh, and the wicked he will put to the sword, says the LORD.\'";
asv[31] = "A noise shall come even to the end of the earth; for Jehovah hath a controversy with the nations; he will enter into judgment with all flesh: as for the wicked, he will give them to the sword, saith Jehovah.";
yng[31] = "Wasting hath come unto the end of the earth, For a controversy hath Jehovah with nations, He hath executed judgment for all flesh, The wicked! He hath given them to the sword, An affirmation of Jehovah.";
dby[31] = "The noise shall come to the end of the earth: for Jehovah hath a controversy with the nations, he entereth into judgment with all flesh; as for the wicked, he will give them up to the sword, saith Jehovah.";
web[31] = "A noise shall come [even] to the ends of the earth; for the LORD hath a controversy with the nations, he will plead with all flesh; he will give them [that are] wicked to the sword, saith the LORD.";
hnv[31] = "A noise shall come even to the end of the eretz; for the LORD has a controversy with the nations; he will enter into judgment with all flesh: as for the wicked, he will give them to the sword, says the LORD.";
vul[31] = "pervenit sonitus usque ad extrema terrae quia iudicium Domino cum gentibus iudicatur ipse cum omni carne impios tradidit gladio dicit Dominus";
kjv[32] = "Thus saith the LORD of hosts, Behold, evil shall go forth from nation to nation, and a great whirlwind shall be raised up from the coasts of the earth.";
rsv[32] = "&quot;Thus says the LORD of hosts: Behold, evil is going forth from nation to nation, and a great tempest is stirring from the farthest parts of the earth!";
asv[32] = "Thus saith Jehovah of hosts, Behold, evil shall go forth from nation to nation, and a great tempest shall be raised up from the uttermost parts of the earth.";
yng[32] = "Thus said Jehovah of Hosts: Lo, evil is going out from nation to nation, And a great whirlwind is stirred up from the sides of the earth.";
dby[32] = "Thus saith Jehovah of hosts: Behold, evil shall go forth from nation to nation, and a great storm shall be raised up from the uttermost parts of the earth.";
web[32] = "Thus saith the LORD of hosts, Behold, evil shall go forth from nation to nation, and a great whirlwind shall be raised from the borders of the earth.";
hnv[32] = "Thus says the LORD of hosts, Behold, evil shall go forth from nation to nation, and a great tempest shall be raised up from the uttermost parts of the eretz.";
vul[32] = "haec dicit Dominus exercituum ecce adflictio egredietur de gente in gentem et turbo magnus egredietur a summitatibus terrae";
kjv[33] = "And the slain of the LORD shall be at that day from [one] end of the earth even unto the [other] end of the earth: they shall not be lamented, neither gathered, nor buried; they shall be dung upon the ground.";
rsv[33] = "&quot;And those slain by the LORD on that day shall extend from one end of the earth to the other. They shall not be lamented, or gathered, or buried; they shall be dung on the surface of the ground.";
asv[33] = "And the slain of Jehovah shall be at that day from one end of the earth even unto the other end of the earth: they shall not be lamented, neither gathered, nor buried; they shall be dung upon the face of the ground.";
yng[33] = "And the pierced of Jehovah have been in that day, From the end of the earth even unto the end of the earth, They are not lamented, nor gathered, nor buried, For dung on the face of the ground they are.";
dby[33] = "And the slain of Jehovah shall [be] at that day from [one] end of the earth even unto the [other] end of the earth: they shall not be lamented, neither gathered, nor buried; they shall be dung upon the face of the ground.";
web[33] = "And the slain of the LORD shall be at that day from [one] end of the earth even to the [other] end of the earth: they shall not be lamented, neither gathered, nor buried; they shall be dung upon the ground.";
hnv[33] = "The slain of the LORD shall be at that day from one end of the eretz even to the other end of the eretz: they shall not be lamented, neither gathered, nor buried; they shall be dung on the surface of the ground.";
vul[33] = "et erunt interfecti Domini in die illa a summo terrae usque ad summum eius non plangentur et non colligentur neque sepelientur in sterquilinium super faciem terrae iacebunt";
kjv[34] = "Howl, ye shepherds, and cry; and wallow yourselves [in the ashes], ye principal of the flock: for the days of your slaughter and of your dispersions are accomplished; and ye shall fall like a pleasant vessel.";
rsv[34] = "&quot;Wail, you shepherds, and cry, and roll in ashes, you lords of the flock, for the days of your slaughter and dispersion have come, and you shall fall like choice rams.";
asv[34] = "Wail, ye shepherds, and cry; and wallow [in ashes], ye principal of the flock; for the days of your slaughter and of your dispersions are fully come, and ye shall fall like a goodly vessel.";
yng[34] = "Howl, ye shepherds, and cry, And roll yourselves, ye honourable of the flock, For full have been your days, For slaughtering, and [for] your scatterings, And ye have fallen as a desirable vessel.";
dby[34] = "Howl, ye shepherds, and cry; and wallow yourselves [in the dust], noble ones of the flock: for the days of your slaughter are accomplished, and I will disperse you; and ye shall fall like a precious vessel.";
web[34] = "Howl, ye shepherds, and cry; and wallow yourselves [in the ashes], ye principal of the flock: for the days of your slaughter and of your dispersions are accomplished; and ye shall fall like a pleasant vessel.";
hnv[34] = "Wail, you shepherds, and cry; and wallow [in ashes], you principal of the flock; for the days of your slaughter and of your dispersions are fully come, and you shall fall like a goodly vessel.";
vul[34] = "ululate pastores et clamate et aspergite vos cinere optimates gregis quia conpleti sunt dies vestri ut interficiamini et dissipationes vestrae et cadetis quasi vasa pretiosa";
kjv[35] = "And the shepherds shall have no way to flee, nor the principal of the flock to escape.";
rsv[35] = "No refuge will remain for the shepherds, nor escape for the lords of the flock.";
asv[35] = "And the shepherds shall have no way to flee, nor the principal of the flock to escape.";
yng[35] = "And perished hath refuge from the shepherds, And escape from the honourable of the flock.";
dby[35] = "And refuge shall perish from the shepherds, and escape from the noble ones of the flock.";
web[35] = "And the shepherds shall have no way to flee, nor the principal of the flock to escape.";
hnv[35] = "The shepherds shall have no way to flee, nor the principal of the flock to escape.";
vul[35] = "et peribit fuga a pastoribus et salvatio ab optimatibus gregis";
kjv[36] = "A voice of the cry of the shepherds, and an howling of the principal of the flock, [shall be heard]: for the LORD hath spoiled their pasture.";
rsv[36] = "Hark, the cry of the shepherds, and the wail of the lords of the flock! For the LORD is despoiling their pasture,";
asv[36] = "A voice of the cry of the shepherds, and the wailing of the principal of the flock! for Jehovah layeth waste their pasture.";
yng[36] = "A voice [is] of the cry of the shepherds, And a howling of the honourable of the flock, For Jehovah is spoiling their pasture.";
dby[36] = "There shall be a voice of the cry of the shepherds, and a howling of the noble ones of the flock: for Jehovah layeth waste their pasture;";
web[36] = "A voice of the cry of the shepherds, and a howling of the principal of the flock, [shall be heard]: for the LORD hath laid waste their pasture.";
hnv[36] = "A voice of the cry of the shepherds, and the wailing of the principal of the flock! for the LORD lays waste their pasture.";
vul[36] = "vox clamoris pastorum et ululatus optimatium gregis quia vastavit Dominus pascuam eorum";
