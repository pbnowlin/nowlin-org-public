csb[1] = "Now Shephatiah son of Mattan, Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchijah heard the words Jeremiah was speaking to all the people:";
csb[2] = "&quot;This is what the LORD says: \'Whoever stays in this city will die by the sword, famine, and plague, but whoever surrenders to the Chaldeans will live. He will retain his life like the spoils of war and will live.\'";
csb[3] = "&quot;This is what the LORD says: \'This city will most certainly be handed over to the king of Babylon\'s army, and he will capture it.\' &quot;";
csb[4] = "The officials then said to the king, &quot;This man ought to die, because he is weakening the morale of the warriors who remain in this city and of all the people by speaking to them in this way. This man is not pursuing the welfare of this people, but their harm.&quot;";
csb[5] = "King Zedekiah said, &quot;Here he is; he\'s in your hands since the king can\'t do anything against you.&quot;";
csb[6] = "So they took Jeremiah and dropped him into the cistern of Malchiah the king\'s son, which was in the guard\'s courtyard, lowering Jeremiah with ropes. There was no water in the cistern, only mud, and Jeremiah sank in the mud.";
csb[7] = "But Ebed-melech, a Cushite court official in the king\'s palace, heard Jeremiah had been put into the cistern. While the king was sitting at the Benjamin Gate,";
csb[8] = "Ebed-melech went from the king\'s palace and spoke to the king:";
csb[9] = "&quot;My lord the king, these men have been evil in all they have done to the prophet Jeremiah. They have dropped him into the cistern where he will die from hunger, because there is no more bread in the city.&quot;";
csb[10] = "So the king commanded Ebed-melech, the Cushite, &quot;Take from here thirty men under your authority and pull the prophet Jeremiah up from the cistern before he dies.&quot;";
csb[11] = "So Ebed-melech took the men under his authority and went to the king\'s palace to a place below the storehouse. From there he took old rags and worn-out clothes and lowered them by ropes to Jeremiah in the cistern.";
csb[12] = "Ebed-melech the Cushite called down to Jeremiah, &quot;Place these old rags and clothes between your armpits and the ropes.&quot; Jeremiah did this.";
csb[13] = "They pulled him up with the ropes and lifted him out of the cistern, but he remained in the guard\'s courtyard.";
csb[14] = "King Zedekiah sent for the prophet Jeremiah and received him at the third entrance of the LORD\'s temple. The king said to Jeremiah, &quot;I am going to ask you something; don\'t hide anything from me.&quot;";
csb[15] = "Jeremiah replied to Zedekiah, &quot;If I tell you, you will kill me, won\'t you? Besides, if I give you advice, you won\'t listen to me anyway.&quot;";
csb[16] = "King Zedekiah swore to Jeremiah in private, &quot;As the LORD lives, who has given us this life, I will not kill you or hand you over to these men who intend to take your life.&quot;";
csb[17] = "Jeremiah therefore said to Zedekiah, &quot;This is what the LORD, the God of Armies, the God of Israel, says: \'If indeed you surrender to the officials of the king of Babylon, then you will live, this city will not be burned, and you and your household will survive.";
csb[18] = "&quot;But if you do not surrender to the officials of the king of Babylon, then this city will be handed over to the Chaldeans. They will burn it, and you yourself will not escape from them.\' &quot;";
csb[19] = "But King Zedekiah said to Jeremiah, &quot;I am worried about the Judeans who have defected to the Chaldeans. They may hand me over to the Judeans to abuse me.&quot;";
csb[20] = "&quot;They will not hand you over,&quot; Jeremiah replied. &quot;Obey the LORD in what I am telling you, so it may go well for you and you can live.";
csb[21] = "&quot;But if you refuse to surrender, this is the verdict that the LORD has shown me:";
csb[22] = "&quot;\'All the women who remain in the palace of Judah\'s king will be brought out to the officials of the king of Babylon and will say to you, &quot;Your trusted friends misled you and overcame you. Your feet sank into the mire, and they deserted you.&quot;";
csb[23] = "All your wives and children will be brought out to the Chaldeans. You yourself will not escape from them, for you will be seized by the king of Babylon and this city will burn.\' &quot;";
csb[24] = "Then Zedekiah warned Jeremiah, &quot;Don\'t let anyone know about this conversation or you will die.";
csb[25] = "&quot;The officials may hear that I have spoken with you and come and demand of you, \'Tell us what you said to the king; don\'t hide anything from us and we won\'t kill you. Also, what did the king say to you? \'";
csb[26] = "&quot;If they do, tell them, \'I was bringing before the king my petition that he not return me to the house of Jonathan to die there.\' &quot;";
csb[27] = "All the officials did come to Jeremiah, and they questioned him. He reported the exact words to them the king had commanded, and they quit speaking with him because the conversation had not been overheard.";
csb[28] = "Jeremiah remained in the guard\'s courtyard until the day Jerusalem was captured, and he was there when it happened.";
kjv[1] = "Then Shephatiah the son of Mattan, and Gedaliah the son of Pashur, and Jucal the son of Shelemiah, and Pashur the son of Malchiah, heard the words that Jeremiah had spoken unto all the people, saying,";
kjv[2] = "Thus saith the LORD, He that remaineth in this city shall die by the sword, by the famine, and by the pestilence: but he that goeth forth to the Chaldeans shall live; for he shall have his life for a prey, and shall live.";
kjv[3] = "Thus saith the LORD, This city shall surely be given into the hand of the king of Babylon\'s army, which shall take it.";
kjv[4] = "Therefore the princes said unto the king, We beseech thee, let this man be put to death: for thus he weakeneth the hands of the men of war that remain in this city, and the hands of all the people, in speaking such words unto them: for this man seeketh not the welfare of this people, but the hurt.";
kjv[5] = "Then Zedekiah the king said, Behold, he [is] in your hand: for the king [is] not [he that] can do [any] thing against you.";
kjv[6] = "Then took they Jeremiah, and cast him into the dungeon of Malchiah the son of Hammelech, that [was] in the court of the prison: and they let down Jeremiah with cords. And in the dungeon [there was] no water, but mire: so Jeremiah sunk in the mire.";
kjv[7] = "Now when Ebedmelech the Ethiopian, one of the eunuchs which was in the king\'s house, heard that they had put Jeremiah in the dungeon; the king then sitting in the gate of Benjamin;";
kjv[8] = "Ebedmelech went forth out of the king\'s house, and spake to the king, saying,";
kjv[9] = "My lord the king, these men have done evil in all that they have done to Jeremiah the prophet, whom they have cast into the dungeon; and he is like to die for hunger in the place where he is: for [there is] no more bread in the city.";
kjv[10] = "Then the king commanded Ebedmelech the Ethiopian, saying, Take from hence thirty men with thee, and take up Jeremiah the prophet out of the dungeon, before he die.";
kjv[11] = "So Ebedmelech took the men with him, and went into the house of the king under the treasury, and took thence old cast clouts and old rotten rags, and let them down by cords into the dungeon to Jeremiah.";
kjv[12] = "And Ebedmelech the Ethiopian said unto Jeremiah, Put now [these] old cast clouts and rotten rags under thine armholes under the cords. And Jeremiah did so.";
kjv[13] = "So they drew up Jeremiah with cords, and took him up out of the dungeon: and Jeremiah remained in the court of the prison.";
kjv[14] = "Then Zedekiah the king sent, and took Jeremiah the prophet unto him into the third entry that [is] in the house of the LORD: and the king said unto Jeremiah, I will ask thee a thing; hide nothing from me.";
kjv[15] = "Then Jeremiah said unto Zedekiah, If I declare [it] unto thee, wilt thou not surely put me to death? and if I give thee counsel, wilt thou not hearken unto me?";
kjv[16] = "So Zedekiah the king sware secretly unto Jeremiah, saying, [As] the LORD liveth, that made us this soul, I will not put thee to death, neither will I give thee into the hand of these men that seek thy life.";
kjv[17] = "Then said Jeremiah unto Zedekiah, Thus saith the LORD, the God of hosts, the God of Israel; If thou wilt assuredly go forth unto the king of Babylon\'s princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thine house:";
kjv[18] = "But if thou wilt not go forth to the king of Babylon\'s princes, then shall this city be given into the hand of the Chaldeans, and they shall burn it with fire, and thou shalt not escape out of their hand.";
kjv[19] = "And Zedekiah the king said unto Jeremiah, I am afraid of the Jews that are fallen to the Chaldeans, lest they deliver me into their hand, and they mock me.";
kjv[20] = "But Jeremiah said, They shall not deliver [thee]. Obey, I beseech thee, the voice of the LORD, which I speak unto thee: so it shall be well unto thee, and thy soul shall live.";
kjv[21] = "But if thou refuse to go forth, this [is] the word that the LORD hath shewed me:";
kjv[22] = "And, behold, all the women that are left in the king of Judah\'s house [shall be] brought forth to the king of Babylon\'s princes, and those [women] shall say, Thy friends have set thee on, and have prevailed against thee: thy feet are sunk in the mire, [and] they are turned away back.";
kjv[23] = "So they shall bring out all thy wives and thy children to the Chaldeans: and thou shalt not escape out of their hand, but shalt be taken by the hand of the king of Babylon: and thou shalt cause this city to be burned with fire.";
kjv[24] = "Then said Zedekiah unto Jeremiah, Let no man know of these words, and thou shalt not die.";
kjv[25] = "But if the princes hear that I have talked with thee, and they come unto thee, and say unto thee, Declare unto us now what thou hast said unto the king, hide it not from us, and we will not put thee to death; also what the king said unto thee:";
kjv[26] = "Then thou shalt say unto them, I presented my supplication before the king, that he would not cause me to return to Jonathan\'s house, to die there.";
kjv[27] = "Then came all the princes unto Jeremiah, and asked him: and he told them according to all these words that the king had commanded. So they left off speaking with him; for the matter was not perceived.";
kjv[28] = "So Jeremiah abode in the court of the prison until the day that Jerusalem was taken: and he was [there] when Jerusalem was taken.";

vul[1] = "audivit autem Saphatias filius Matthan et Gedelias filius Phassur et Iuchal filius Selemiae et Phassur filius Melchiae sermones quos Hieremias loquebatur ad omnem populum dicens";
rsv[2] = "&quot;Thus says the LORD, He who stays in this city shall die by the sword, by famine, and by pestilence; but he who goes out to the Chalde\'ans shall live; he shall have his life as a prize of war, and live.";
asv[2] = "Thus saith Jehovah, He that abideth in this city shall die by the sword, by the famine, and by the pestilence; but he that goeth forth to the Chaldeans shall live, and his life shall be unto him for a prey, and he shall live.";
yng[2] = "`Thus said Jehovah: He who is remaining in this city dieth, by sword, by famine, and by pestilence, and he who is going forth unto the Chaldeans liveth, and his soul hath been to him for a prey, and he liveth.";
dby[2] = "Thus saith Jehovah: He that remaineth in this city shall die by the sword, by the famine, and by the pestilence; but he that goeth forth to the Chaldeans shall live; and he shall have his life for a prey, and shall live.";
web[2] = "Thus saith the LORD, He that remaineth in this city shall die by the sword, by the famine, and by the pestilence: but he that goeth forth to the Chaldeans shall live; for he shall have his life for a prey, and shall live.";
hnv[2] = "Thus says the LORD, He who remains in this city shall die by the sword, by the famine, and by the pestilence; but he who goes forth to the Kasdim shall live, and his life shall be to him for a prey, and he shall live.";
vul[2] = "haec dicit Dominus quicumque manserit in civitate hac morietur gladio et fame et peste qui autem profugerit ad Chaldeos vivet et erit anima eius sospes et vivens";

dby[3] = "Thus saith Jehovah: This city shall certainly be given into the hand of the king of Babylon\'s army, and he shall take it.";

rsv[4] = "Then the princes said to the king, &quot;Let this man be put to death, for he is weakening the hands of the soldiers who are left in this city, and the hands of all the people, by speaking such words to them. For this man is not seeking the welfare of this people, but their harm.&quot;";
asv[4] = "Then the princes said unto the king, Let this man, we pray thee, be put to death; forasmuch as he weakeneth the hands of the men of war that remain in this city, and the hands of all the people, in speaking such words unto them: for this man seeketh not the welfare of this people, but the hurt.";
yng[4] = "And the heads say unto the king, `Let, we pray thee, this man be put to death, because that he is making feeble the hands of the men of war, who are left in this city, and the hands of all the people, by speaking unto them according to these words, for this man is not seeking for the peace of this people, but for its evil.\'";
dby[4] = "And the princes said unto the king, Let this man, we pray thee, be put to death; for why should he weaken the hands of the men of war that remain in this city, and the hands of all the people, in speaking to them according to these words? for this man seeketh not the welfare of this people, but the hurt.";
web[4] = "Therefore the princes said to the king, We beseech thee, let this man be put to death: for thus he weakeneth the hands of the men of war that remain in this city, and the hands of all the people, in speaking such words to them: for this man seeketh not the welfare of this people, but the hurt.";
hnv[4] = "Then the princes said to the king, Let this man, we pray you, be put to death; because he weakens the hands of the men of war who remain in this city, and the hands of all the people, in speaking such words to them: for this man doesn\'t seek the welfare of this people, but the hurt.";
vul[4] = "et dixerunt principes regi rogamus ut occidatur homo iste de industria enim dissolvit manus virorum bellantium qui remanserunt in civitate hac et manus universi populi loquens ad eos iuxta verba haec siquidem homo hic non quaerit pacem populi huius sed malum";

asv[5] = "And Zedekiah the king said, Behold, he is in your hand; for the king is not he that can do anything against you.";
yng[5] = "And the king Zedekiah saith, `Lo, he [is] in your hand: for the king is not able for you [in] anything.\'";
dby[5] = "And king Zedekiah said, Behold, he is in your hand; for the king is not he that can do a thing against you.";
web[5] = "Then Zedekiah the king said, Behold, he [is] in your hand: for the king [is] not [he that] can do [any] thing against you.";
hnv[5] = "Tzidkiyahu the king said, Behold, he is in your hand; for the king is not he who can do anything against you.";

rsv[6] = "So they took Jeremiah and cast him into the cistern of Malchi\'ah, the king\'s son, which was in the court of the guard, letting Jeremiah down by ropes. And there was no water in the cistern, but only mire, and Jeremiah sank in the mire.";
asv[6] = "Then took they Jeremiah, and cast him into the dungeon of Malchijah the king\'s son, that was in the court of the guard: and they let down Jeremiah with cords. And in the dungeon there was no water, but mire; and Jeremiah sank in the mire.";
yng[6] = "And they take Jeremiah, and cast him into the pit of Malchiah son of the king, that [is] in the court of the prison, and they send down Jeremiah with cords; and in the pit there is no water, but mire, and Jeremiah sinketh in the mire.";
dby[6] = "Then they took Jeremiah, and cast him into the dungeon of Malchijah the son of Hammelech, which was in the court of the guard, and they let down Jeremiah with cords. And in the dungeon there was no water, but mire; and Jeremiah sank in the mire.";
web[6] = "Then they took Jeremiah, and cast him into the dungeon of Malchiah the son of Hammelech, that [was] in the court of the prison: and they let down Jeremiah with cords. And in the dungeon [there was] no water, but mire: so Jeremiah sunk in the mire.";
hnv[6] = "Then took they Yirmeyahu, and cast him into the dungeon of Malkiyah the king\'s son, that was in the court of the guard: and they let down Yirmeyahu with cords. In the dungeon there was no water, but mire; and Yirmeyahu sank in the mire.";
vul[6] = "tulerunt ergo Hieremiam et proiecerunt eum in lacu Melchiae filii Ammelech qui erat in vestibulo carceris et submiserunt Hieremiam in funibus et in lacum non erat aqua sed lutum descendit itaque Hieremias in caenum";

asv[7] = "Now when Ebed-melech the Ethiopian, a eunuch, who was in the king\'s house, heard that they had put Jeremiah in the dungeon (the king then sitting in the gate of Benjamin),";
yng[7] = "And Ebed-Melech the Cushite, a eunuch who [is] in the king\'s house, heareth that they have put Jeremiah into the pit; and the king is sitting at the gate of Benjamin,";
dby[7] = "And Ebed-melech the Ethiopian, a eunuch who was in the king\'s house, heard that they had put Jeremiah in the dungeon -- now the king was sitting in the gate of Benjamin,";

rsv[9] = "&quot;My lord the king, these men have done evil in all that they did to Jeremiah the prophet by casting him into the cistern; and he will die there of hunger, for there is no bread left in the city.&quot;";
asv[9] = "My lord the king, these men have done evil in all that they have done to Jeremiah the prophet, whom they have cast into the dungeon; and he is like to die in the place where he is, because of the famine; for there is no more bread in the city.";
yng[9] = "`My lord, O king, these men have done evil [in] all that they have done to Jeremiah the prophet, whom they have cast into the pit, and he dieth in his place because of the famine, for there is no more bread in the city.\'";
dby[9] = "My lord, O king, these men have done evil in all that they have done to the prophet Jeremiah, whom they have cast into the dungeon; and he will die by reason of the famine in the place where he is; for there is no more bread in the city.";
web[9] = "My lord the king, these men have done evil in all that they have done to Jeremiah the prophet, whom they have cast into the dungeon; and he is like to die by hunger in the place where he is: for [there is] no more bread in the city.";
hnv[9] = "My lord the king, these men have done evil in all that they have done to Yirmeyahu the prophet, whom they have cast into the dungeon; and he is likely to die in the place where he is, because of the famine; for there is no more bread in the city.";
vul[9] = "domine mi rex malefecerunt viri isti omnia quaecumque perpetrarunt contra Hieremiam prophetam mittentes eum in lacum ut moriatur ibi fame non sunt enim panes ultra in civitate";
rsv[10] = "Then the king commanded E\'bed-mel\'ech, the Ethiopian, &quot;Take three men with you from here, and lift Jeremiah the prophet out of the cistern before he dies.&quot;";
asv[10] = "Then the king commanded Ebed-melech the Ethiopian, saying, Take from hence thirty men with thee, and take up Jeremiah the prophet out of the dungeon, before he die.";
yng[10] = "And the king commandeth Ebed-Melech the Cushite, saying, `Take with thee from this thirty men, and thou hast brought up Jeremiah the prophet from the pit, before he dieth.\'";
dby[10] = "And the king commanded Ebed-melech the Ethiopian, saying, Take from hence thirty men with thee, and take up Jeremiah the prophet out of the dungeon, before he die.";
web[10] = "Then the king commanded Ebed-melech the Cushite, saying, Take from hence thirty men with thee, and take up Jeremiah the prophet out of the dungeon, before he dieth.";
hnv[10] = "Then the king commanded `Eved-Melekh the Kushite, saying, Take from hence thirty men with you, and take up Yirmeyahu the prophet out of the dungeon, before he die.";
vul[10] = "praecepit itaque rex Abdemelech Aethiopi dicens tolle tecum hinc triginta viros et leva Hieremiam prophetam de lacu antequam moriatur";
rsv[11] = "So E\'bed-mel\'ech took the men with him and went to the house of the king, to a wardrobe of the storehouse, and took from there old rags and worn-out clothes, which he let down to Jeremiah in the cistern by ropes.";
asv[11] = "So Ebed-melech took the men with him, and went into the house of the king under the treasury, and took thence rags and worn-out garments, and let them down by cords into the dungeon to Jeremiah.";
yng[11] = "And Ebed-Melech taketh the men with him, and entereth the house of the king, unto the place of the treasury, and taketh thence worn-out clouts, and worn-out rags, and sendeth them unto Jeremiah unto the pit by cords.";
dby[11] = "And Ebed-melech took the men under his order, and went into the house of the king under the treasury, and took thence old shreds and worn-out clothes, and let them down by cords into the dungeon to Jeremiah.";
web[11] = "So Ebed-melech took the men with him, and went into the house of the king under the treasury, and took thence old cast clouts and old decayed rags, and let them down by cords into the dungeon to Jeremiah.";
hnv[11] = "So `Eved-Melekh took the men with him, and went into the house of the king under the treasury, and took there rags and worn-out garments, and let them down by cords into the dungeon to Yirmeyahu.";
vul[11] = "adsumptis ergo Abdemelech secum viris ingressus est domum regis quae erat sub cellario et tulit inde veteres pannos et antiqua quae conputruerant et submisit ea ad Hieremiam in lacum per funiculos";
rsv[12] = "Then E\'bed-mel\'ech the Ethiopian said to Jeremiah, &quot;Put the rags and clothes between your armpits and the ropes.&quot; Jeremiah did so.";
asv[12] = "And Ebed-melech the Ethiopian said unto Jeremiah, Put now these rags and worn-out garments under thine armholes under the cords. And Jeremiah did so.";
yng[12] = "And Ebed-Melech the Cushite saith unto Jeremiah, `Put, I pray thee, the worn-out clouts and rags under thine arm-holes, at the place of the cords,\' and Jeremiah doth so,";
dby[12] = "And Ebed-melech the Ethiopian said to Jeremiah, Put, I pray, [these] old shreds and rags under thine armholes under the cords. And Jeremiah did so.";
web[12] = "And Ebed-melech the Cushite said to Jeremiah, Put now [these] old cast clouts and decayed rags under thy arm-holes under the cords. And Jeremiah did so.";
hnv[12] = "`Eved-Melekh the Kushite said to Yirmeyahu, Put now these rags and worn-out garments under your armholes under the cords. Yirmeyahu did so.";
vul[12] = "dixitque Abdemelech Aethiops ad Hieremiam pone veteres pannos et haec scissa et putrida sub cubitu manuum tuarum et subter funes fecit ergo Hieremias sic";
rsv[13] = "Then they drew Jeremiah up with ropes and lifted him out of the cistern. And Jeremiah remained in the court of the guard.";
asv[13] = "So they drew up Jeremiah with the cords, and took him up out of the dungeon: and Jeremiah remained in the court of the guard.";
yng[13] = "and they draw out Jeremiah with cords, and bring him up out of the pit, and Jeremiah dwelleth in the court of the prison.";
dby[13] = "And they drew up Jeremiah with cords, and brought him up out of the dungeon; and Jeremiah remained in the court of the guard.";
web[13] = "So they drew up Jeremiah with cords, and took him out of the dungeon: and Jeremiah remained in the court of the prison.";
hnv[13] = "So they drew up Yirmeyahu with the cords, and took him up out of the dungeon: and Yirmeyahu remained in the court of the guard.";
vul[13] = "et extraxerunt Hieremiam funibus et eduxerunt eum de lacu mansit autem Hieremias in vestibulo carceris";
rsv[14] = "King Zedeki\'ah sent for Jeremiah the prophet and received him at the third entrance of the temple of the LORD. The king said to Jeremiah, &quot;I will ask you a question; hide nothing from me.&quot;";
asv[14] = "Then Zedekiah the king sent, and took Jeremiah the prophet unto him into the third entry that is in the house of Jehovah: and the king said unto Jeremiah, I will ask thee a thing; hide nothing from me.";
yng[14] = "And the king Zedekiah sendeth, and taketh Jeremiah the prophet unto him, unto the third entrance that [is] in the house of Jehovah, and the king saith unto Jeremiah, `I am asking thee a thing, do not hide from me anything.\'";
dby[14] = "And king Zedekiah sent and took the prophet Jeremiah unto him, into the third entry that is in the house of Jehovah; and the king said unto Jeremiah, I will ask thee a thing: hide nothing from me.";
web[14] = "Then Zedekiah the king sent, and took Jeremiah the prophet to him into the third entry that [is] in the house of the LORD: and the king said to Jeremiah, I will ask thee a thing; hide nothing from me.";
hnv[14] = "Then Tzidkiyahu the king sent, and took Yirmeyahu the prophet to him into the third entry that is in the house of the LORD: and the king said to Yirmeyahu, I will ask you a thing; hide nothing from me.";
vul[14] = "et misit rex Sedecias et tulit ad se Hieremiam prophetam ad ostium tertium quod erat in domo Domini et dixit rex ad Hieremiam interrogo ego te sermonem ne abscondas a me aliquid";
rsv[15] = "Jeremiah said to Zedeki\'ah, &quot;If I tell you, will you not be sure to put me to death? And if I give you counsel, you will not listen to me.&quot;";
asv[15] = "Then Jeremiah said unto Zedekiah, If I declare it unto thee, wilt thou not surely put me to death? and if I give thee counsel, thou wilt not hearken unto me.";
yng[15] = "And Jeremiah saith unto Zedekiah, `When I declare to thee, dost thou not surely put me to death? and when I counsel thee, thou dost not hearken unto me.\'";
dby[15] = "And Jeremiah said unto Zedekiah, If I declare [it] unto thee, wilt thou not certainly put me to death? and if I give thee counsel, thou wilt not hearken unto me.";
web[15] = "Then Jeremiah said to Zedekiah, If I declare [it] to thee, wilt thou not surely put me to death? and if I give thee counsel, wilt thou not hearken to me?";
hnv[15] = "Then Yirmeyahu said to Tzidkiyahu, If I declare it to you, will you not surely put me to death? and if I give you counsel, you will not listen to me.";
vul[15] = "dixit autem Hieremias ad Sedeciam si adnuntiavero tibi numquid non interficies me et si consilium tibi dedero non me audies";
rsv[16] = "Then King Zedeki\'ah swore secretly to Jeremiah, &quot;As the LORD lives, who made our souls, I will not put you to death or deliver you into the hand of these men who seek your life.&quot;";
asv[16] = "So Zedekiah the king sware secretly unto Jeremiah, saying, As Jehovah liveth, that made us this soul, I will not put thee to death, neither will I give thee into the hand of these men that seek thy life.";
yng[16] = "And the king Zedekiah sweareth unto Jeremiah in secret, saying, `Jehovah liveth, He who made for us this soul, I do not put thee to death, nor give thee unto the hand of these men who are seeking thy soul.\'";
dby[16] = "And king Zedekiah swore secretly unto Jeremiah, saying, [As] Jehovah liveth, that made us this soul, I will not put thee to death, neither will I give thee into the hand of these men that seek thy life.";
web[16] = "So Zedekiah the king swore secretly to Jeremiah, saying, [As] the LORD liveth, that made us this soul, I will not put thee to death, neither will I give thee into the hand of these men that seek thy life.";
hnv[16] = "So Tzidkiyahu the king swore secretly to Yirmeyahu, saying, As the LORD lives, who made us this soul, I will not put you to death, neither will I give you into the hand of these men who seek your life.";
vul[16] = "iuravit ergo rex Sedecias Hieremiae clam dicens vivit Dominus qui fecit nobis animam hanc si occidero te et si tradidero te in manu virorum istorum qui quaerunt animam tuam";
rsv[17] = "Then Jeremiah said to Zedeki\'ah, &quot;Thus says the LORD, the God of hosts, the God of Israel, If you will surrender to the princes of the king of Babylon, then your life shall be spared, and this city shall not be burned with fire, and you and your house shall live.";
asv[17] = "Then said Jeremiah unto Zedekiah, Thus saith Jehovah, the God of hosts, the God of Israel: If thou wilt go forth unto the king of Babylon\'s princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thy house.";
yng[17] = "And Jeremiah saith unto Zedekiah, `Thus said Jehovah, God of Hosts, God of Israel: If thou dost certainly go forth unto the heads of the king of Babylon, then hath thy soul lived, and this city is not burned with fire, yea, thou hast lived, thou and thy house.";
dby[17] = "And Jeremiah said unto Zedekiah, Thus saith Jehovah the God of hosts, the God of Israel: If thou wilt freely go forth to the king of Babylon\'s princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thy house.";
web[17] = "Then said Jeremiah to Zedekiah, Thus saith the LORD, the God of hosts, the God of Israel; If thou wilt assuredly go forth to the king of Babylon\'s princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thy house:";
hnv[17] = "Then said Yirmeyahu to Tzidkiyahu, Thus says the LORD, the God Tzva\'ot,, the God of Yisra\'el: If you will go forth to the king of Bavel\'s princes, then your soul shall live, and this city shall not be burned with fire; and you shall live, and your house.";
vul[17] = "et dixit Hieremias ad Sedeciam haec dicit Dominus exercituum Deus Israhel si profectus exieris ad principes regis Babylonis vivet anima tua et civitas haec non succendetur igni et salvus eris tu et domus tua";
rsv[18] = "But if you do not surrender to the princes of the king of Babylon, then this city shall be given into the hand of the Chalde\'ans, and they shall burn it with fire, and you shall not escape from their hand.&quot;";
asv[18] = "But if thou wilt not go forth to the king of Babylon\'s princes, then shall this city be given into the hand of the Chaldeans, and they shall burn it with fire, and thou shalt not escape out of their hand.";
yng[18] = "And if thou dost not go forth unto the heads of the king of Babylon, then hath this city been given into the hand of the Chaldeans, and they have burnt it with fire, and thou dost not escape from their hand.\'";
dby[18] = "But if thou wilt not go forth to the king of Babylon\'s princes, then shall this city be given into the hand of the Chaldeans, and they shall burn it with fire, and thou shalt not escape out of their hand.";
web[18] = "But if thou wilt not go forth to the king of Babylon\'s princes, then shall this city be given into the hand of the Chaldeans, and they shall burn it with fire, and thou shalt not escape from their hand.";
hnv[18] = "But if you will not go forth to the king of Bavel\'s princes, then shall this city be given into the hand of the Kasdim, and they shall burn it with fire, and you shall not escape out of their hand.";
vul[18] = "si autem non exieris ad principes regis Babylonis tradetur civitas haec in manu Chaldeorum et succendent eam igni et tu non effugies de manu eorum";
rsv[19] = "King Zedeki\'ah said to Jeremiah, &quot;I am afraid of the Jews who have deserted to the Chalde\'ans, lest I be handed over to them and they abuse me.&quot;";
asv[19] = "And Zedekiah the king said unto Jeremiah, I am afraid of the Jews that are fallen away to the Chaldeans, lest they deliver me into their hand, and they mock me.";
yng[19] = "And the king Zedekiah saith unto Jeremiah, `I am fearing the Jews who have fallen unto the Chaldeans, lest they give me into their hand, and they have insulted me.\'";
dby[19] = "And king Zedekiah said unto Jeremiah, I am afraid of the Jews that have deserted to the Chaldeans, lest they give me over into their hand, and they mock me.";
web[19] = "And Zedekiah the king said to Jeremiah, I am afraid of the Jews that have fallen to the Chaldeans, lest they deliver me into their hand, and they mock me.";
hnv[19] = "Tzidkiyahu the king said to Yirmeyahu, I am afraid of the Yehudim who are fallen away to the Kasdim, lest they deliver me into their hand, and they mock me.";
vul[19] = "et dixit rex Sedecias ad Hieremiam sollicitus sum propter Iudaeos qui transfugerunt ad Chaldeos ne forte tradar in manus eorum et inludant mihi";
rsv[20] = "Jeremiah said, &quot;You shall not be given to them. Obey now the voice of the LORD in what I say to you, and it shall be well with you, and your life shall be spared.";
asv[20] = "But Jeremiah said, They shall not deliver thee. Obey, I beseech thee, the voice of Jehovah, in that which I speak unto thee: so it shall be well with thee, and thy soul shall live.";
yng[20] = "And Jeremiah saith, `They do not give thee up; hearken, I pray thee, to the voice of Jehovah, to that which I am speaking unto thee, and it is well for thee, and thy soul doth live.";
dby[20] = "And Jeremiah said, They shall not give [thee] over. Hearken, I beseech thee, unto the voice of Jehovah, in that which I speak unto thee; so shall it be well unto thee, and thy soul shall live.";
web[20] = "But Jeremiah said, They shall not deliver [thee]. Obey, I beseech thee, the voice of the LORD, which I speak to thee: so it shall be well to thee, and thy soul shall live.";
hnv[20] = " But Yirmeyahu said, They shall not deliver you. Obey, I beg you, the voice of the LORD, in that which I speak to you: so it shall be well with you, and your soul shall live.";
vul[20] = "respondit autem Hieremias non te tradent audi quaeso vocem Domini quam ego loquor ad te et bene tibi erit et vivet anima tua";
rsv[21] = "But if you refuse to surrender, this is the vision which the LORD has shown to me:";
asv[21] = "But if thou refuse to go forth, this is the word that Jehovah hath showed me:";
yng[21] = "`And if thou art refusing to go forth, this [is] the thing that Jehovah hath shewn me:";
dby[21] = "But if thou refuse to go forth, this is the word which Jehovah hath shewn me:";
web[21] = "But if thou shalt refuse to go forth, this [is] the word that the LORD hath shown me:";
hnv[21] = "But if you refuse to go forth, this is the word that the LORD has shown me:";
vul[21] = "quod si nolueris egredi iste est sermo quem ostendit mihi Dominus";
rsv[22] = "Behold, all the women left in the house of the king of Judah were being led out to the princes of the king of Babylon and were saying, \'Your trusted friends have deceived you and prevailed against you; now that your feet are sunk in the mire, they turn away from you.\'";
asv[22] = "behold, all the women that are left in the king of Judah\'s house shall be brought forth to the king of Babylon\'s princes, and those women shall say, Thy familiar friends have set thee on, and have prevailed over thee: [now that] thy feet are sunk in the mire, they are turned away back.";
yng[22] = "That, lo, all the women who have been left in the house of the king of Judah are brought forth unto the heads of the king of Babylon, and lo, they are saying: Persuaded thee, and prevailed against thee, Have thine allies, Sunk into mire have thy feet, They have been turned backward.";
dby[22] = "Behold, all the women that are left in the king of Judah\'s house shall be brought forth to the king of Babylon\'s princes; and they shall say, Thy familiar friends have set thee on, and have prevailed over thee; thy feet are sunk in the mire, they are turned away back.";
web[22] = "And behold, all the women that are left in the king of Judah\'s house [shall be] brought forth to the king of Babylon\'s princes, and those [women] shall say, Thy friends have set thee on, and have prevailed against thee: thy feet are sunk in the mire, [and] they are turned away back.";
hnv[22] = "behold, all the women who are left in the king of Yehudah\'s house shall be brought forth to the king of Bavel\'s princes, and those women shall say, Your familiar friends have set you on, and have prevailed over you: [now that] your feet are sunk in the mire, they are turned away back.";
vul[22] = "ecce omnes mulieres quae remanserunt in domo regis Iuda educentur ad principes regis Babylonis et ipsae dicent seduxerunt te et praevaluerunt adversum te viri pacifici tui demerserunt in caeno et lubrico pedes tuos et recesserunt a te";
rsv[23] = "All your wives and your sons shall be led out to the Chalde\'ans, and you yourself shall not escape from their hand, but shall be seized by the king of Babylon; and this city shall be burned with fire.&quot;";
asv[23] = "And they shall bring out all thy wives and thy children to the Chaldeans; and thou shalt not escape out of their hand, but shalt be taken by the hand of the king of Babylon: and thou shalt cause this city to be burned with fire.";
yng[23] = "`And all thy wives, and thy sons, are brought forth unto the Chaldeans, and thou dost not escape from their hand, for by the hand of the king of Babylon thou art caught, and this city is burnt with fire.\'";
dby[23] = "And they shall bring out all thy wives and thy children to the Chaldeans, and thou shalt not escape out of their hand; for thou shalt be taken by the hand of the king of Babylon, and thou shalt cause this city to be burned with fire.";
web[23] = "So they shall bring out all thy wives and thy children to the Chaldeans: and thou shalt not escape out of their hand, but shalt be taken by the hand of the king of Babylon: and thou shalt cause this city to be burned with fire.";
hnv[23] = "They shall bring out all your wives and your children to the Kasdim; and you shall not escape out of their hand, but shall be taken by the hand of the king of Bavel: and you shall cause this city to be burned with fire.";
vul[23] = "et omnes uxores tuae et filii tui educentur ad Chaldeos et non effugies manus eorum sed in manu regis Babylonis capieris et civitatem hanc conburet igni";
rsv[24] = "Then Zedeki\'ah said to Jeremiah, &quot;Let no one know of these words and you shall not die.";
asv[24] = "Then said Zedekiah unto Jeremiah, Let no man know of these words, and thou shalt not die.";
yng[24] = "And Zedekiah saith unto Jeremiah, `Let no man know of these words, and thou dost not die;";
dby[24] = "And Zedekiah said unto Jeremiah, Let no man know of these words, and thou shalt not die.";
web[24] = "Then said Zedekiah to Jeremiah, Let no man know of these words, and thou shalt not die.";
hnv[24] = "Then said Tzidkiyahu to Yirmeyahu, Let no man know of these words, and you shall not die.";
vul[24] = "dixit ergo Sedecias ad Hieremiam nullus sciat verba haec et non morieris";
rsv[25] = "If the princes hear that I have spoken with you and come to you and say to you, \'Tell us what you said to the king and what the king said to you; hide nothing from us and we will not put you to death,\'";
asv[25] = "But if the princes hear that I have talked with thee, and they come unto thee, and say unto thee, Declare unto us now what thou hast said unto the king; hide it not from us, and we will not put thee to death; also what the king said unto thee:";
yng[25] = "and when the heads hear that I have spoken with thee, and they have come in unto thee, and have said unto thee, Declare to us, we pray thee, what thou didst speak unto the king, do not hide [it] from us, and we do not put thee to death, and what the king spake unto thee,";
dby[25] = "And if the princes hear that I have talked with thee, and they come unto thee, and say unto thee, Declare unto us now what thou hast said unto the king, hide it not from us, and we will not put thee to death; and what hath the king said unto thee?";
web[25] = "But if the princes hear that I have talked with thee, and they come to thee, and say to thee, Declare to us now what thou hast said to the king, hide it not from us, and we will not put thee to death; also what the king said to thee:";
hnv[25] = "But if the princes hear that I have talked with you, and they come to you, and tell you, Declare to us now what you have said to the king; don\'t hide it from us, and we will not put you to death; also what the king said to you:";
vul[25] = "si autem audierint principes quia locutus sum tecum et venerint ad te et dixerint tibi indica nobis quid locutus sis cum rege ne celes nos et non te interficiemus et quid locutus est tecum rex";
rsv[26] = "then you shall say to them, \'I made a humble plea to the king that he would not send me back to the house of Jonathan to die there.\'&quot;";
asv[26] = "then thou shalt say unto them, I presented my supplication before the king, that he would not cause me to return to Jonathan\'s house, to die there.";
yng[26] = "then thou hast said unto them, I am causing my supplication to fall before the king, not to cause me to return to the house of Jonathan, to die there.\'";
dby[26] = "then thou shalt say unto them, I presented my supplication before the king, that he would not cause me to return to Jonathan\'s house, to die there.";
web[26] = "Then thou shalt say to them, I presented my supplication before the king, that he would not cause me to return to Jonathan\'s house, to die there.";
hnv[26] = "then you shall tell them, I presented my supplication before the king, that he would not cause me to return to Yonatan\'s house, to die there.";
vul[26] = "dices ad eos prostravi ego preces meas coram rege ne me reduci iuberet in domum Ionathan et ibi morerer";
rsv[27] = "Then all the princes came to Jeremiah and asked him, and he answered them as the king had instructed him. So they left off speaking with him, for the conversation had not been overheard.";
asv[27] = "Then came all the princes unto Jeremiah, and asked him; and he told them according to all these words that the king had commanded. So they left off speaking with him; for the matter was not perceived.";
yng[27] = "And all the heads come in unto Jeremiah, and ask him, and he declareth to them according to all these words that the king commanded, and they keep silent from him, for the matter was not heard;";
dby[27] = "-- And all the princes came to Jeremiah, and asked him; and he told them according to all these words that the king had commanded. And they withdrew quietly from him; for the matter was not reported.";
web[27] = "Then came all the princes to Jeremiah, and asked him: and he told them according to all these words that the king had commanded. So they left off speaking with him; for the matter was not perceived.";
hnv[27] = "Then came all the princes to Yirmeyahu, and asked him; and he told them according to all these words that the king had commanded. So they left off speaking with him; for the matter was not perceived.";
vul[27] = "venerunt ergo omnes principes ad Hieremiam et interrogaverunt eum et locutus est eis iuxta omnia verba quae praeceperat ei rex et cessaverunt ab eo nihil enim fuerat auditum";
rsv[28] = "And Jeremiah remained in the court of the guard until the day that Jerusalem was taken.";
asv[28] = "So Jeremiah abode in the court of the guard until the day that Jerusalem was taken. And it came to pass when Jerusalem was taken";
yng[28] = "and Jeremiah dwelleth in the court of the prison till the day that Jerusalem hath been captured, and he was [there] when Jerusalem was captured.";
dby[28] = "And Jeremiah remained in the court of the guard until the day that Jerusalem was taken.";
web[28] = "So Jeremiah abode in the court of the prison until the day that Jerusalem was taken: and he was [there] when Jerusalem was taken.";
hnv[28] = "So Yirmeyahu abode in the court of the guard until the day that Yerushalayim was taken.";
vul[28] = "mansit vero Hieremias in vestibulo carceris usque ad diem quo capta est Hierusalem et factum est ut caperetur Hierusalem";
