csb[1] = "After King Nebuchadnezzar of Babylon had deported Jeconiah son of Jehoiakim king of Judah, the officials of Judah, and the craftsmen and metalsmiths from Jerusalem and had brought them to Babylon, the LORD showed me two baskets of figs placed in front of the temple of the LORD.";
csb[2] = "One basket contained very good figs, like early figs, but the other basket contained very bad figs, so bad they were inedible.";
csb[3] = "The LORD said to me, &quot;What do you see, Jeremiah? &quot; I said, &quot;Figs! The good figs are very good, but the bad figs are extremely bad, so bad they are inedible.&quot;";
csb[4] = "The word of the LORD came to me:";
csb[5] = "&quot;This is what the LORD, the God of Israel, says: Like these good figs, so I regard as good the exiles from Judah I sent away from this place to the land of the Chaldeans.";
csb[6] = "&quot;I will keep my eyes on them for their good and will return them to this land. I will build them up and not demolish them; I will plant them and not uproot them.";
csb[7] = "&quot;I will give them a heart to know me, that I am the LORD. They will be my people, and I will be their God because they will return to me with all their heart.";
csb[8] = "&quot;But as for the bad figs, so bad they are inedible, this is what the LORD says: In this way I will deal with King Zedekiah of Judah, his officials, and the remnant of Jerusalem -- those remaining in this land or living in the land of Egypt.";
csb[9] = "&quot;I will make them an object of horror and a disaster to all the kingdoms of the earth, an example for disgrace, scorn, ridicule, and cursing, wherever I have banished them.";
csb[10] = "&quot;I will send the sword, famine, and plague against them until they have perished from the land I gave to them and their ancestors.&quot;";
kjv[1] = "The LORD shewed me, and, behold, two baskets of figs [were] set before the temple of the LORD, after that Nebuchadrezzar king of Babylon had carried away captive Jeconiah the son of Jehoiakim king of Judah, and the princes of Judah, with the carpenters and smiths, from Jerusalem, and had brought them to Babylon.";

asv[1] = "Jehovah showed me, and, behold, two baskets of figs set before the temple of Jehovah, after that Nebuchadrezzar king of Babylon had carried away captive Jeconiah the son of Jehoiakim, king of Judah, and the princes of Judah, with the craftsmen and smiths, from Jerusalem, and had brought them to Babylon.";

dby[1] = "Jehovah shewed me, and behold, two baskets of figs, set before the temple of Jehovah, after that Nebuchadrezzar king of Babylon had carried away captive from Jerusalem, Jeconiah the son of Jehoiakim, the king of Judah, and the princes of Judah, and the craftsmen and smiths, and had brought them to Babylon.";

asv[8] = "And as the bad figs, which cannot be eaten, they are so bad, surely thus saith Jehovah, So will I give up Zedekiah the king of Judah, and his princes, and the residue of Jerusalem, that remain in this land, and them that dwell in the land of Egypt,";
yng[8] = "And like the bad figs, that are not eaten for badness, Surely thus said Jehovah: So do I make Zedekiah king of Judah, And his heads, and the remnant of Jerusalem, Who are left in this land, And who are dwelling in the land of Egypt,";
