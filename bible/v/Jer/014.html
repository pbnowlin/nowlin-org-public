kjv[1] = "The word of the LORD that came to Jeremiah concerning the dearth.";
kjv[2] = "Judah mourneth, and the gates thereof languish; they are black unto the ground; and the cry of Jerusalem is gone up.";
kjv[3] = "And their nobles have sent their little ones to the waters: they came to the pits, [and] found no water; they returned with their vessels empty; they were ashamed and confounded, and covered their heads.";
kjv[4] = "Because the ground is chapt, for there was no rain in the earth, the plowmen were ashamed, they covered their heads.";
kjv[5] = "Yea, the hind also calved in the field, and forsook [it], because there was no grass.";
kjv[6] = "And the wild asses did stand in the high places, they snuffed up the wind like dragons; their eyes did fail, because [there was] no grass.";
kjv[7] = "O LORD, though our iniquities testify against us, do thou [it] for thy name\'s sake: for our backslidings are many; we have sinned against thee.";
kjv[8] = "O the hope of Israel, the saviour thereof in time of trouble, why shouldest thou be as a stranger in the land, and as a wayfaring man [that] turneth aside to tarry for a night?";
kjv[9] = "Why shouldest thou be as a man astonied, as a mighty man [that] cannot save? yet thou, O LORD, [art] in the midst of us, and we are called by thy name; leave us not.";
kjv[10] = "Thus saith the LORD unto this people, Thus have they loved to wander, they have not refrained their feet, therefore the LORD doth not accept them; he will now remember their iniquity, and visit their sins.";
kjv[11] = "Then said the LORD unto me, Pray not for this people for [their] good.";
kjv[12] = "When they fast, I will not hear their cry; and when they offer burnt offering and an oblation, I will not accept them: but I will consume them by the sword, and by the famine, and by the pestilence.";
kjv[13] = "Then said I, Ah, Lord GOD! behold, the prophets say unto them, Ye shall not see the sword, neither shall ye have famine; but I will give you assured peace in this place.";
kjv[14] = "Then the LORD said unto me, The prophets prophesy lies in my name: I sent them not, neither have I commanded them, neither spake unto them: they prophesy unto you a false vision and divination, and a thing of nought, and the deceit of their heart.";
kjv[15] = "Therefore thus saith the LORD concerning the prophets that prophesy in my name, and I sent them not, yet they say, Sword and famine shall not be in this land; By sword and famine shall those prophets be consumed.";
kjv[16] = "And the people to whom they prophesy shall be cast out in the streets of Jerusalem because of the famine and the sword; and they shall have none to bury them, them, their wives, nor their sons, nor their daughters: for I will pour their wickedness upon them.";
kjv[17] = "Therefore thou shalt say this word unto them; Let mine eyes run down with tears night and day, and let them not cease: for the virgin daughter of my people is broken with a great breach, with a very grievous blow.";
kjv[18] = "If I go forth into the field, then behold the slain with the sword! and if I enter into the city, then behold them that are sick with famine! yea, both the prophet and the priest go about into a land that they know not.";
kjv[19] = "Hast thou utterly rejected Judah? hath thy soul lothed Zion? why hast thou smitten us, and [there is] no healing for us? we looked for peace, and [there is] no good; and for the time of healing, and behold trouble!";
kjv[20] = "We acknowledge, O LORD, our wickedness, [and] the iniquity of our fathers: for we have sinned against thee.";
kjv[21] = "Do not abhor [us], for thy name\'s sake, do not disgrace the throne of thy glory: remember, break not thy covenant with us.";
kjv[22] = "Are there [any] among the vanities of the Gentiles that can cause rain? or can the heavens give showers? [art] not thou he, O LORD our God? therefore we will wait upon thee: for thou hast made all these [things].";
csb[1] = "This is the word of the LORD that came to Jeremiah concerning the drought:";
csb[2] = "Judah mourns; her city gates languish. Her people are on the ground in mourning; Jerusalem\'s cry rises up.";
csb[3] = "Their nobles send their servants for water. They go to the cisterns; they find no water; their containers return empty. They are ashamed and humiliated; they cover their heads.";
csb[4] = "The ground is cracked since no rain has fallen on the land. The farmers are ashamed; they cover their heads.";
csb[5] = "Even the doe in the field gives birth and abandons her fawn since there is no grass.";
csb[6] = "Wild donkeys stand on the barren heights panting for air like jackals. Their eyes fail because there are no green plants.";
csb[7] = "Though our iniquities testify against us, LORD, act for your name\'s sake. Indeed, our rebellions are many; we have sinned against you.";
csb[8] = "Hope of Israel, its Savior in time of distress, why are you like a resident alien in the land, like a traveler stopping only for the night?";
csb[9] = "Why are you like a helpless man, like a warrior unable to save? Yet you are among us, LORD, and we bear your name. Don\'t leave us!";
csb[10] = "This is what the LORD says concerning these people: Truly they love to wander; they never rest their feet. So the LORD does not accept them. Now he will remember their iniquity and punish their sins.";
csb[11] = "Then the LORD said to me, &quot;Do not pray for the well-being of these people.";
csb[12] = "&quot;If they fast, I will not hear their cry of despair. If they offer burnt offering and grain offering, I will not accept them. Rather, I will finish them off by sword, famine, and plague.&quot;";
csb[13] = "And I replied, &quot;Oh no, Lord GOD! The prophets are telling them, \'You won\'t see sword or suffer famine. I will certainly give you lasting peace in this place.\' &quot;";
csb[14] = "But the LORD said to me, &quot;These prophets are prophesying a lie in my name. I did not send them, nor did I command them or speak to them. They are prophesying to you a false vision, worthless divination, the deceit of their own minds.";
csb[15] = "&quot;Therefore, this is what the LORD says concerning the prophets who prophesy in my name, though I did not send them, and who say, \'There will never be sword or famine in this land.\' By sword and famine these prophets will meet their end.";
csb[16] = "&quot;The people they are prophesying to will be thrown into the streets of Jerusalem because of the famine and the sword. There will be no one to bury them -- they, their wives, their sons, and their daughters. I will pour out their own evil on them.&quot;";
csb[17] = "You are to speak this word to them: Let my eyes overflow with tears; day and night may they not stop, for the virgin daughter of my people has been destroyed by a crushing blow, an extremely severe wound.";
csb[18] = "If I go out to the field, look -- those slain by the sword! If I enter the city, look -- those ill from famine! For both prophet and priest travel to a land they do not know.";
csb[19] = "Have you completely rejected Judah? Do you detest Zion? Why do you strike us with no hope of healing for us? We hoped for peace, but there was nothing good; for a time of healing, but there was only terror.";
csb[20] = "We acknowledge our wickedness, LORD, the iniquity of our fathers; indeed, we have sinned against you.";
csb[21] = "For your name\'s sake, don\'t despise us. Don\'t disdain your glorious throne. Remember your covenant with us; do not break it.";
csb[22] = "Can any of the worthless idols of the nations bring rain? Or can the skies alone give showers? Are you not the LORD our God? We therefore put our hope in you, for you have done all these things.";

vul[17] = "et dices ad eos verbum istud deducant oculi mei lacrimam per noctem et diem et non taceant quoniam contritione magna contrita est virgo filia populi mei plaga pessima vehementer";
rsv[18] = "If I go out into the field, behold, those slain by the sword! And if I enter the city, behold, the diseases of famine! For both prophet and priest ply their trade through the land, and have no knowledge.\'&quot;";
asv[18] = "If I go forth into the field, then, behold, the slain with the sword! and if I enter into the city, then, behold, they that are sick with famine! for both the prophet and the priest go about in the land, and have no knowledge.";
yng[18] = "If I have gone forth to the field, Then, lo, the pierced of the sword! And if I have entered the city, Then, lo, the diseased of famine! For both prophet and priest have gone up and down Unto a land that they knew not.";
dby[18] = "If I go forth into the field, behold the slain with the sword! and if I enter into the city, behold them that pine away with famine! For both prophet and priest shall go about into a land that they know not.";
web[18] = "If I go forth into the field, then behold the slain with the sword! and if I enter into the city, then behold them that are sick with famine! yes, both the prophet and the priest go about into a land that they know not.";
hnv[18] = "If I go forth into the field, then, behold, the slain with the sword! and if I enter into the city, then, behold, those who are sick with famine! for both the prophet and the Kohen go about in the land, and have no knowledge.";
vul[18] = "si egressus fuero ad agros ecce occisi gladio et si introiero in civitatem ecce adtenuati fame propheta quoque et sacerdos abierunt in terram quam ignorabant";
rsv[19] = "Hast thou utterly rejected Judah? Does thy soul loathe Zion? Why hast thou smitten us so that there is no healing for us? We looked for peace, but no good came; for a time of healing, but behold, terror.";
asv[19] = "Hast thou utterly rejected Judah? hath thy soul loathed Zion? why hast thou smitten us, and there is no healing for us? We looked for peace, but no good came; and for a time of healing, and, behold, dismay!";
yng[19] = "Hast Thou utterly rejected Judah? Zion hath Thy soul loathed? Wherefore hast Thou smitten us, And there is no healing to us? Looking for peace, and there is no good, And for a time of healing, and lo, terror.";
dby[19] = "-- Hast thou then utterly rejected Judah? Doth thy soul loathe Zion? Why hast thou smitten us, and there is no healing for us? Peace is looked for, and there is no good, -- and a time of healing, and behold terror!";
web[19] = "Hast thou utterly rejected Judah? hath thy soul loathed Zion? Why hast thou smitten us, and [there is] no healing for us? we looked for peace, and [there is] no good; and for the time of healing, and behold trouble!";
hnv[19] = "Have you utterly rejected Yehudah? has your soul loathed Tziyon? why have you struck us, and there is no healing for us? We looked for shalom, but no good came; and for a time of healing, and, behold, dismay!";
vul[19] = "numquid proiciens abiecisti Iudam aut Sion abominata est anima tua quare ergo percussisti nos ita ut nulla sit sanitas expectavimus pacem et non est bonum et tempus curationis et ecce turbatio";
rsv[20] = "We acknowledge our wickedness, O LORD, and the iniquity of our fathers, for we have sinned against thee.";
asv[20] = "We acknowledge, O Jehovah, our wickedness, and the iniquity of our fathers; for we have sinned against thee.";
yng[20] = "We have known, O Jehovah, our wickedness, The iniquity of our fathers, For we have sinned against Thee.";
dby[20] = "Jehovah, we acknowledge our wickedness, the iniquity of our fathers; for we have sinned against thee.";
web[20] = "We acknowledge, O LORD, our wickedness, [and] the iniquity of our fathers; for we have sinned against thee.";
hnv[20] = "We acknowledge, LORD, our wickedness, and the iniquity of our fathers; for we have sinned against you.";
vul[20] = "cognovimus Domine impietates nostras iniquitatem patrum nostrorum quia peccavimus tibi";
rsv[21] = "Do not spurn us, for thy name\'s sake; do not dishonor thy glorious throne; remember and do not break thy covenant with us.";
asv[21] = "Do not abhor [us], for thy name\'s sake; do not disgrace the throne of thy glory: remember, break not thy covenant with us.";
yng[21] = "Do not despise, for Thy name\'s sake, Dishonour not the throne of Thine honour, Remember, break not Thy covenant with us.";
dby[21] = "For thy name\'s sake, do not spurn [us], do not disgrace the throne of thy glory: remember, break not thy covenant with us.";
web[21] = "Do not abhor [us], for thy name\'s sake; do not disgrace the throne of thy glory: remember, break not thy covenant with us.";
hnv[21] = "Do not abhor [us], for your name\'s sake; do not disgrace the throne of your glory: remember, don\'t break your covenant with us.";
vul[21] = "ne nos des in obprobrium propter nomen tuum neque facias nobis contumeliam solii gloriae tuae recordare ne irritum facias foedus tuum nobiscum";
rsv[22] = "Are there any among the false gods of the nations that can bring rain? Or can the heavens give showers? Art thou not he, O LORD our God? We set our hope on thee, for thou doest all these things.";
asv[22] = "Are there any among the vanities of the nations that can cause rain? or can the heavens give showers? art not thou he, O Jehovah our God? therefore we will wait for thee; for thou hast made all these things.";
yng[22] = "Are there among the vanities of the nations any causing rain? And do the heavens give showers? Art not Thou He, O Jehovah our God? And we wait for thee, for Thou -- Thou hast done all these!";
dby[22] = "Are there any among the vanities of the nations that can cause rain? or can the heavens give showers? Art not thou HE, Jehovah, our God? And we wait upon thee; for thou hast made all these things.";
web[22] = "Are there [any] among the vanities of the Gentiles that can cause rain? or can the heavens give showers? [art] not thou he, O LORD our God? therefore we will wait upon thee: for thou hast made all these [things].";
hnv[22] = "Are there any among the vanities of the nations that can cause rain? or can the sky give showers? Aren\'t you he, the LORD our God? therefore we will wait for you; for you have made all these things.";
