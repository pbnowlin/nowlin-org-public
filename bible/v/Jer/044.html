csb[1] = "This is the word that came to Jeremiah for all the Jews living in the land of Egypt -- at Migdol, Tahpanhes, Memphis, and in the land of Pathros:";
csb[2] = "&quot;This is what the LORD of Armies, the God of Israel, says: You have seen all the disaster I brought against Jerusalem and all Judah\'s cities. Look, they are a ruin today without an inhabitant in them";
csb[3] = "&quot;because of the evil they committed to anger me, by going and burning incense to serve other gods that they, you, and your fathers did not know.";
csb[4] = "&quot;So I sent you all my servants the prophets time and time again, saying, \'Don\'t commit this detestable action that I hate.\'";
csb[5] = "&quot;But they did not listen or pay attention; they did not turn from their evil or stop burning incense to other gods.";
csb[6] = "&quot;So my fierce wrath poured out and burned in Judah\'s cities and Jerusalem\'s streets so that they became the desolate ruin they are today.";
csb[7] = "&quot;So now, this is what the LORD, the God of Armies, the God of Israel, says: Why are you doing such terrible harm to yourselves? You are cutting off man and woman, infant and nursing baby from Judah, leaving yourselves without a remnant.";
csb[8] = "&quot;You are angering me by the work of your hands. You are burning incense to other gods in the land of Egypt where you have gone to stay for a while. As a result, you will be cut off and become an example for cursing and insult among all the nations of earth.";
csb[9] = "&quot;Have you forgotten the evils of your fathers, the evils of Judah\'s kings, the evils of their wives, your own evils, and the evils of your wives that were committed in the land of Judah and in the streets of Jerusalem?";
csb[10] = "&quot;They have not become humble to this day, and they have not feared or followed my instruction or my statutes that I set before you and your ancestors.";
csb[11] = "&quot;Therefore, this is what the LORD of Armies, the God of Israel, says: I am about to set my face against you to bring disaster, to cut off all Judah.";
csb[12] = "&quot;And I will take away the remnant of Judah, those who have set their face to go to the land of Egypt to stay there. All of them will meet their end in the land of Egypt. They will fall by the sword; they will meet their end by famine. From the least to the greatest, they will die by the sword and by famine. Then they will become an example for cursing, scorn, execration, and disgrace.";
csb[13] = "&quot;I will punish those living in the land of Egypt just as I punished Jerusalem by sword, famine, and plague.";
csb[14] = "&quot;Then the remnant of Judah -- those going to live for a while there in the land of Egypt -- will have no fugitive or survivor to return to the land of Judah where they are longing to return to stay, for they will not return except for a few fugitives.&quot;";
csb[15] = "However, all the men who knew that their wives were burning incense to other gods, all the women standing by -- a great assembly -- and all the people who were living in the land of Egypt at Pathros answered Jeremiah,";
csb[16] = "&quot;As for the word you spoke to us in the name of the LORD, we are not going to listen to you!";
csb[17] = "&quot;Instead, we will do everything we promised: we will burn incense to the queen of heaven and offer drink offerings to her just as we, our fathers, our kings, and our officials did in Judah\'s cities and in Jerusalem\'s streets. Then we had enough food, we were well off, and we saw no disaster,";
csb[18] = "&quot;but from the time we ceased to burn incense to the queen of heaven and to offer her drink offerings, we have lacked everything, and through sword and famine we have met our end.&quot;";
csb[19] = "And the women said, &quot;When we burned incense to the queen of heaven and poured out drink offerings to her, was it apart from our husbands\' knowledge that we made sacrificial cakes in her image and poured out drink offerings to her? &quot;";
csb[20] = "But Jeremiah responded to all the people -- the men, women, and all the people who were answering him:";
csb[21] = "&quot;As for the incense you burned in Judah\'s cities and in Jerusalem\'s streets -- you, your fathers, your kings, your officials, and the people of the land -- did the LORD not remember them? He brought this to mind.";
csb[22] = "&quot;The LORD can no longer bear your evil deeds and the detestable acts you have committed, so your land has become a waste, a desolation, and an example for cursing, without inhabitant, as you see today.";
csb[23] = "&quot;Because you burned incense and sinned against the LORD and didn\'t obey the LORD and didn\'t follow his instruction, his statutes, and his testimonies, this disaster has come to you, as you see today.&quot;";
csb[24] = "Then Jeremiah said to all the people, including all the women, &quot;Hear the word of the LORD, all you people of Judah who are in the land of Egypt.";
csb[25] = "&quot;This is what the LORD of Armies, the God of Israel, says: \'As for you and your wives, you women have spoken with your mouths, and you men fulfilled it by your deeds, saying, &quot;We will keep our vows that we have made to burn incense to the queen of heaven and to pour out drink offerings for her.&quot; Go ahead, confirm your vows! Keep your vows! \'";
csb[26] = "&quot;Therefore, hear the word of the LORD, all you Judeans who live in the land of Egypt: \'I have sworn by my great name, says the LORD, that my name will never again be invoked by anyone of Judah in all the land of Egypt, saying, &quot;As the Lord GOD lives.&quot;";
csb[27] = "I am watching over them for disaster and not for good, and everyone from Judah who is in the land of Egypt will meet his end by sword or famine until they are finished off.";
csb[28] = "Those who escape the sword will return from the land of Egypt to the land of Judah only few in number, and the whole remnant of Judah, the ones going to the land of Egypt to stay there for a while, will know whose word stands, mine or theirs!";
csb[29] = "This will be a sign to you\' -- this is the LORD\'s declaration -- \'that I will punish you in this place, so you may know that my words of disaster concerning you will certainly come to pass.";
csb[30] = "This is what the LORD says: I am about to hand over Pharaoh Hophra, Egypt\'s king, to his enemies, to those who intend to take his life, just as I handed over Judah\'s King Zedekiah to Babylon\'s King Nebuchadnezzar, who was his enemy, the one who intended to take his life.\' &quot;";
kjv[1] = "The word that came to Jeremiah concerning all the Jews which dwell in the land of Egypt, which dwell at Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros, saying,";
rsv[1] = "The word that came to Jeremiah concerning all the Jews that dwelt in the land of Egypt, at Migdol, at Tah\'panhes, at Memphis, and in the land of Pathros,";
asv[1] = "The word that came to Jeremiah concerning all the Jews that dwelt in the land of Egypt, that dwelt at Migdol, and at Tahpanhes, and at Memphis, and in the country of Pathros, saying,";
yng[1] = "The word that hath been unto Jeremiah concerning all the Jews who are dwelling in the land of Egypt -- who are dwelling in Migdol, and in Tahpanhes, and in Noph, and in the land of Pathros -- saying,";
dby[1] = "The word that came to Jeremiah concerning all the Jews who dwelt in the land of Egypt, who dwelt at Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros, saying,";
web[1] = "The word that came to Jeremiah concerning all the Jews who dwell in the land of Egypt, who dwell at Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros, saying,";
hnv[1] = "The word that came to Yirmeyahu concerning all the Yehudim who lived in the land of Mitzrayim, who lived at Migdol, and at Tachpanches, and at Mof, and in the country of Patros, saying,";
vul[1] = "verbum quod factum est ad Hieremiam ad omnes Iudaeos qui habitant in terra Aegypti habitantes in Magdolo et in Tafnis et in Memphis et in terra Fatures dicens";
kjv[2] = "Thus saith the LORD of hosts, the God of Israel; Ye have seen all the evil that I have brought upon Jerusalem, and upon all the cities of Judah; and, behold, this day they [are] a desolation, and no man dwelleth therein,";
rsv[2] = "&quot;Thus says the LORD of hosts, the God of Israel: You have seen all the evil that I brought upon Jerusalem and upon all the cities of Judah. Behold, this day they are a desolation, and no one dwells in them,";
asv[2] = "Thus saith Jehovah of hosts, the God of Israel: Ye have seen all the evil that I have brought upon Jerusalem, and upon all the cities of Judah; and, behold, this day they are a desolation, and no man dwelleth therein,";
yng[2] = "`Thus said Jehovah of Hosts, God of Israel: Ye -- ye have seen all the evil that I have brought in on Jerusalem, and on all the cities of Judah, and lo, they [are] a waste this day, and there is none dwelling in them,";
dby[2] = "Thus saith Jehovah of hosts, the God of Israel: Ye have seen all the evil that I have brought upon Jerusalem, and upon all the cities of Judah; and behold they are, this day, a waste, and no man dwelleth therein,";
web[2] = "Thus saith the LORD of hosts, the God of Israel; Ye have seen all the evil that I have brought upon Jerusalem, and upon all the cities of Judah; and behold, this day they [are] a desolation, and no man dwelleth in them.";
hnv[2] = " Thus says the LORD of Hosts, the God of Yisra\'el: You have seen all the evil that I have brought on Yerushalayim, and on all the cities of Yehudah; and, behold, this day they are a desolation, and no man dwells therein,";
vul[2] = "haec dicit Dominus exercituum Deus Israhel vos vidistis omne malum istud quod adduxi super Hierusalem et super omnes urbes Iuda et ecce sunt desertae hodie et non est in eis habitator";
kjv[3] = "Because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense, [and] to serve other gods, whom they knew not, [neither] they, ye, nor your fathers.";
rsv[3] = "because of the wickedness which they committed, provoking me to anger, in that they went to burn incense and serve other gods that they knew not, neither they, nor you, nor your fathers.";
asv[3] = "because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense, [and] to serve other gods, that they knew not, neither they, nor ye, nor your fathers.";
yng[3] = "because of their wickedness that they have done, by provoking Me to anger, by going to make perfume, by serving other gods, that they knew not, they, ye, and your fathers.";
dby[3] = "because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense to serve other gods which they knew not, they, [nor] ye, nor your fathers.";
web[3] = "Because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense, [and] to serve other gods, whom they knew not, [neither] they, ye, nor your fathers.";
hnv[3] = "because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense, [and] to serve other gods, that they didn\'t know, neither they, nor you, nor your fathers.";
vul[3] = "propter malitiam quam fecerunt ut me ad iracundiam provocarent et irent et sacrificarent et colerent deos alienos quos nesciebant et illi et vos et patres vestri";
kjv[4] = "Howbeit I sent unto you all my servants the prophets, rising early and sending [them], saying, Oh, do not this abominable thing that I hate.";
rsv[4] = "Yet I persistently sent to you all my servants the prophets, saying, \'Oh, do not do this abominable thing that I hate!\'";
asv[4] = "Howbeit I sent unto you all my servants the prophets, rising up early and sending them, saying, Oh, do not this abominable thing that I hate.";
yng[4] = "`And I send unto you all my servants, the prophets, rising early and sending, saying: I pray you, do not this abomination that I have hated --";
dby[4] = "And I sent unto you all my servants the prophets, rising early and sending, saying, Oh, do not this abominable thing which I hate!";
web[4] = "Yet I sent to you all my servants the prophets, rising early and sending [them], saying, Oh, do not this abominable thing that I hate.";
hnv[4] = "However I sent to you all my servants the prophets, rising up early and sending them, saying, Oh, don\'t do this abominable thing that I hate.";
vul[4] = "et misi ad vos omnes servos meos prophetas de nocte consurgens mittensque et dicens nolite facere verbum abominationis huius quam odi";
kjv[5] = "But they hearkened not, nor inclined their ear to turn from their wickedness, to burn no incense unto other gods.";
rsv[5] = "But they did not listen or incline their ear, to turn from their wickedness and burn no incense to other gods.";
asv[5] = "But they hearkened not, nor inclined their ear to turn from their wickedness, to burn no incense unto other gods.";
yng[5] = "and they have not hearkened nor inclined their ear, to turn back from their wickedness, not to make perfume to other gods,";
dby[5] = "But they hearkened not, nor inclined their ear to turn from their wickedness, to burn no incense unto other gods.";
web[5] = "But they hearkened not, nor inclined their ear to turn from their wickedness, to burn no incense to other gods.";
hnv[5] = "But they didn\'t listen, nor inclined their ear to turn from their wickedness, to burn no incense to other gods.";
vul[5] = "et non audierunt nec inclinaverunt aurem suam ut converterentur a malis suis et non sacrificarent diis alienis";
kjv[6] = "Wherefore my fury and mine anger was poured forth, and was kindled in the cities of Judah and in the streets of Jerusalem; and they are wasted [and] desolate, as at this day.";
rsv[6] = "Therefore my wrath and my anger were poured forth and kindled in the cities of Judah and in the streets of Jerusalem; and they became a waste and a desolation, as at this day.";
asv[6] = "Wherefore my wrath and mine anger was poured forth, and was kindled in the cities of Judah and in the streets of Jerusalem; and they are wasted and desolate, as it is this day.";
yng[6] = "and poured out is My fury, and Mine anger, and it burneth in cities of Judah, and in streets of Jerusalem, and they are for a waste, for a desolation, as [at] this day.";
dby[6] = "And my fury and mine anger was poured forth, and was kindled in the cities of Judah and in the streets of Jerusalem; and they are become a waste, a desolation, as at this day.";
web[6] = "Wherefore my fury and my anger was poured forth, and was kindled in the cities of Judah and in the streets of Jerusalem; and they are wasted [and] desolate, as at this day.";
hnv[6] = "Therefore my wrath and my anger was poured forth, and was kindled in the cities of Yehudah and in the streets of Yerushalayim; and they are wasted and desolate, as it is this day.";
vul[6] = "et conflata est indignatio mea et furor meus et succensa est in civitatibus Iuda et in plateis Hierusalem et versae sunt in solitudinem et vastitatem secundum diem hanc";
kjv[7] = "Therefore now thus saith the LORD, the God of hosts, the God of Israel; Wherefore commit ye [this] great evil against your souls, to cut off from you man and woman, child and suckling, out of Judah, to leave you none to remain;";
rsv[7] = "And now thus says the LORD God of hosts, the God of Israel: Why do you commit this great evil against yourselves, to cut off from you man and woman, infant and child, from the midst of Judah, leaving you no remnant?";
asv[7] = "Therefore now thus saith Jehovah, the God of hosts, the God of Israel: Wherefore commit ye [this] great evil against your own souls, to cut off from you man and woman, infant and suckling, out of the midst of Judah, to leave you none remaining;";
yng[7] = "`And, now, thus said Jehovah of Hosts, God of Israel: Why are ye doing great evil unto your own souls, to cut off to you man and woman, infant and suckling, from the midst of Judah, so as not to leave to you a remnant:";
dby[7] = "And now thus saith Jehovah the God of hosts, the God of Israel: Wherefore commit ye great evil against your souls, to cut off from you man and woman, infant and suckling, out of the midst of Judah, to leave you no remnant;";
web[7] = "Therefore now thus saith the LORD, the God of hosts, the God of Israel; Why do ye commit [this] great evil against your souls, to cut off from you man and woman, child and suckling, out of Judah, to leave you none to remain;";
hnv[7] = "Therefore now thus says the LORD, the God Tzva\'ot,, the God of Yisra\'el: Why commit you [this] great evil against your own souls, to cut off from you man and woman, infant and suckling, out of the midst of Yehudah, to leave you none remaining;";
vul[7] = "et nunc haec dicit Dominus exercituum Deus Israhel quare vos facitis malum grande contra animas vestras ut intereat ex vobis vir et mulier parvulus et lactans de medio Iudae nec relinquatur vobis quicquam residuum";
kjv[8] = "In that ye provoke me unto wrath with the works of your hands, burning incense unto other gods in the land of Egypt, whither ye be gone to dwell, that ye might cut yourselves off, and that ye might be a curse and a reproach among all the nations of the earth?";
rsv[8] = "Why do you provoke me to anger with the works of your hands, burning incense to other gods in the land of Egypt where you have come to live, that you may be cut off and become a curse and a taunt among all the nations of the earth?";
asv[8] = "in that ye provoke me unto anger with the works of your hands, burning incense unto other gods in the land of Egypt, whither ye are gone to sojourn; that ye may be cut off, and that ye may be a curse and a reproach among all the nations of the earth?";
yng[8] = "by provoking Me to anger by the works of your hands, by making perfume to other gods in the land of Egypt, whither ye are going in to sojourn, so as to cut yourselves off, and so as to your being for a reviling and for a reproach among all nations of the earth?";
dby[8] = "provoking me to anger with the works of your hands, burning incense unto other gods in the land of Egypt, whither ye are come to sojourn, that ye should be cut off, and that ye should be a curse and a reproach among all the nations of the earth?";
web[8] = "In that ye provoke me to wrath with the works of your hands, burning incense to other gods in the land of Egypt, whither ye are gone to dwell, that ye may cut yourselves off, and that ye may be a curse and a reproach among all the nations of the earth?";
hnv[8] = "in that you provoke me to anger with the works of your hands, burning incense to other gods in the land of Mitzrayim, where you are gone to sojourn; that you may be cut off, and that you may be a curse and a reproach among all the nations of the eretz?";
vul[8] = "provocantes me in operibus manuum vestrarum sacrificando diis alienis in terra Aegypti in quam ingressi estis ut habitetis ibi et dispereatis et sitis in maledictionem et in obprobrium cunctis gentibus terrae";
kjv[9] = "Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, which they have committed in the land of Judah, and in the streets of Jerusalem?";
rsv[9] = "Have you forgotten the wickedness of your fathers, the wickedness of the kings of Judah, the wickedness of their wives, your own wickedness, and the wickedness of your wives, which they committed in the land of Judah and in the streets of Jerusalem?";
asv[9] = "Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, which they committed in the land of Judah, and in the streets of Jerusalem?";
yng[9] = "`Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, that they have done in the land of Judah, and in streets of Jerusalem?";
dby[9] = "Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, which they have committed in the land of Judah and in the streets of Jerusalem?";
web[9] = "Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, which they have committed in the land of Judah, and in the streets of Jerusalem?";
hnv[9] = "Have you forgotten the wickedness of your fathers, and the wickedness of the kings of Yehudah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives which they committed in the land of Yehudah, and in the streets of Yerushalayim?";
vul[9] = "numquid obliti estis mala patrum vestrorum et mala regum Iuda et mala uxorum eius et mala vestra et mala uxorum vestrarum quae fecerunt in terra Iuda et in regionibus Hierusalem";
kjv[10] = "They are not humbled [even] unto this day, neither have they feared, nor walked in my law, nor in my statutes, that I set before you and before your fathers.";
rsv[10] = "They have not humbled themselves even to this day, nor have they feared, nor walked in my law and my statutes which I set before you and before your fathers.";
asv[10] = "They are not humbled even unto this day, neither have they feared, nor walked in my law, nor in my statutes, that I set before you and before your fathers.";
yng[10] = "They have not been humbled unto this day, nor have they been afraid, nor have they walked in My law, and in My statutes, that I have set before you and before your fathers.";
dby[10] = "They are not humbled unto this day, neither have they feared, nor walked in my law, nor in my statutes which I set before you and before your fathers.";
web[10] = "They are not humbled [even] to this day, neither have they feared, nor walked in my law, nor in my statutes, that I set before you and before your fathers.";
hnv[10] = "They are not humbled even to this day, neither have they feared, nor walked in my law, nor in my statutes, that I set before you and before your fathers.";
vul[10] = "non sunt mundati usque ad diem hanc et non timuerunt et non ambulaverunt in lege et in praeceptis meis quae dedi coram vobis et coram patribus vestris";
kjv[11] = "Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will set my face against you for evil, and to cut off all Judah.";
rsv[11] = "&quot;Therefore thus says the LORD of hosts, the God of Israel: Behold, I will set my face against you for evil, to cut off all Judah.";
asv[11] = "Therefore thus saith Jehovah of hosts, the God of Israel: Behold, I will set my face against you for evil, even to cut off all Judah.";
yng[11] = "`Therefore, thus said Jehovah of Hosts, God of Israel: Lo, I am setting my face against you for evil, even to cut off all Judah,";
dby[11] = "Therefore thus saith Jehovah of hosts, the God of Israel: Behold, I will set my face against you for evil, and to cut off all Judah.";
web[11] = "Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will set my face against you for evil, and to cut off all Judah.";
hnv[11] = "Therefore thus says the LORD of Hosts, the God of Yisra\'el: Behold, I will set my face against you for evil, even to cut off all Yehudah.";
vul[11] = "ideo haec dicit Dominus exercituum Deus Israhel ecce ego pono faciem meam in vobis in malum et disperdam omnem Iudam";
kjv[12] = "And I will take the remnant of Judah, that have set their faces to go into the land of Egypt to sojourn there, and they shall all be consumed, [and] fall in the land of Egypt; they shall [even] be consumed by the sword [and] by the famine: they shall die, from the least even unto the greatest, by the sword and by the famine: and they shall be an execration, [and] an astonishment, and a curse, and a reproach.";
rsv[12] = "I will take the remnant of Judah who have set their faces to come to the land of Egypt to live, and they shall all be consumed; in the land of Egypt they shall fall; by the sword and by famine they shall be consumed; from the least to the greatest, they shall die by the sword and by famine; and they shall become an execration, a horror, a curse, and a taunt.";
asv[12] = "And I will take the remnant of Judah, that have set their faces to go into the land of Egypt to sojourn there, and they shall all be consumed; in the land of Egypt shall they fall; they shall be consumed by the sword and by the famine; they shall die, from the least even unto the greatest, by the sword and by the famine; and they shall be an execration, [and] an astonishment, and a curse, and a reproach.";
yng[12] = "and I have taken the remnant of Judah, who have set their faces to enter the land of Egypt to sojourn there, and they have all been consumed in the land of Egypt; they fall by sword, by famine they are consumed, from the least even unto the greatest, by sword and by famine they die, and they have been for an execration, for an astonishment, and for a reviling, and for a reproach.";
dby[12] = "And I will take the remnant of Judah, that have set their faces to enter into the land of Egypt to sojourn there, and they shall all be consumed: in the land of Egypt shall they fall; they shall be consumed by the sword [and] by the famine, from the least even unto the greatest; they shall die by the sword and by the famine, and they shall be an execration, an astonishment, and a curse, and a reproach.";
web[12] = "And I will take the remnant of Judah, that have set their faces to go into the land of Egypt to sojourn there, and they shall all be consumed, [and] fall in the land of Egypt; they shall [even] be consumed by the sword [and] by the famine: they shall die, from the least even to the greatest, by the sword and by the famine: and they shall be an execration, [and] an astonishment, and a curse, and a reproach.";
hnv[12] = "I will take the remnant of Yehudah, that have set their faces to go into the land of Mitzrayim to sojourn there, and they shall all be consumed; in the land of Mitzrayim shall they fall; they shall be consumed by the sword and by the famine; they shall die, from the least even to the greatest, by the sword and by the famine; and they shall be an object of horror, [and] an astonishment, and a curse, and a reproach.";
vul[12] = "et adsumam reliquias Iudae qui posuerunt facies suas ut ingrederentur terram Aegypti et habitarent ibi et consumentur omnes in terra Aegypti cadent in gladio et in fame consumentur a minimo usque ad maximum in gladio et in fame morientur et erunt in iusiurandum et in miraculum et in maledictionem et in obprobrium";
kjv[13] = "For I will punish them that dwell in the land of Egypt, as I have punished Jerusalem, by the sword, by the famine, and by the pestilence:";
rsv[13] = "I will punish those who dwell in the land of Egypt, as I have punished Jerusalem, with the sword, with famine, and with pestilence,";
asv[13] = "For I will punish them that dwell in the land of Egypt, as I have punished Jerusalem, by the sword, by the famine, and by the pestilence;";
yng[13] = "`And I have seen after those dwelling in the land of Egypt, as I saw after Jerusalem, with sword, with famine, and with pestilence,";
dby[13] = "And I will punish them that dwell in the land of Egypt as I have punished Jerusalem, by the sword, by the famine, and by the pestilence;";
web[13] = "For I will punish them that dwell in the land of Egypt, as I have punished Jerusalem, by the sword, by the famine, and by the pestilence:";
hnv[13] = "For I will punish those who dwell in the land of Mitzrayim, as I have punished Yerushalayim, by the sword, by the famine, and by the pestilence;";
vul[13] = "et visitabo habitatores terrae Aegypti sicut visitavi super Hierusalem in gladio et in fame et in peste";
kjv[14] = "So that none of the remnant of Judah, which are gone into the land of Egypt to sojourn there, shall escape or remain, that they should return into the land of Judah, to the which they have a desire to return to dwell there: for none shall return but such as shall escape.";
rsv[14] = "so that none of the remnant of Judah who have come to live in the land of Egypt shall escape or survive or return to the land of Judah, to which they desire to return to dwell there; for they shall not return, except some fugitives.&quot;";
asv[14] = "so that none of the remnant of Judah, that are gone into the land of Egypt to sojourn there, shall escape or be left, to return into the land of Judah, to which they have a desire to return to dwell there: for none shall return save such as shall escape.";
yng[14] = "and there is not an escaped and remaining one of the remnant of Judah, who are entering into the land of Egypt to sojourn there, even to turn back to the land of Judah, whither they are lifting up their soul to return to dwell, for they do not turn back, except those escaping.\'";
dby[14] = "and none of the remnant of Judah, that have come into the land of Egypt to sojourn there, shall escape or remain, so as to return into the land of Judah, whither they have a desire to return to dwell there; for none shall return but such as shall escape.";
web[14] = "So that none of the remnant of Judah, who have gone into the land of Egypt, to sojourn there, shall escape or remain, that they should return into the land of Judah, to which they have a desire to return to dwell there: for none shall return but such as shall escape.";
hnv[14] = "so that none of the remnant of Yehudah, who have gone into the land of Mitzrayim to sojourn there, shall escape or be left, to return into the land of Yehudah, to which they have a desire to return to dwell there: for none shall return save such as shall escape.";
vul[14] = "et non erit qui effugiat et sit residuus de reliquiis Iudaeorum qui vadunt ut peregrinentur in terra Aegypti et revertantur in terram Iuda ad quam ipsi elevant animas suas ut revertantur et habitent ibi non revertentur nisi qui fugerint";
kjv[15] = "Then all the men which knew that their wives had burned incense unto other gods, and all the women that stood by, a great multitude, even all the people that dwelt in the land of Egypt, in Pathros, answered Jeremiah, saying,";
rsv[15] = "Then all the men who knew that their wives had offered incense to other gods, and all the women who stood by, a great assembly, all the people who dwelt in Pathros in the land of Egypt, answered Jeremiah:";
asv[15] = "Then all the men who knew that their wives burned incense unto other gods, and all the women that stood by, a great assembly, even all the people that dwelt in the land of Egypt, in Pathros, answered Jeremiah, saying,";
yng[15] = "And they answer Jeremiah -- all the men who are knowing that their wives are making perfume to other gods, and all the women who are remaining, a great assembly, even all the people who are dwelling in the land of Egypt, in Pathros -- saying:";
dby[15] = "Then all the men who knew that their wives burned incense to other gods, and all the women who stood by, a great assemblage, even all the people that dwelt in the land of Egypt, in Pathros, answered Jeremiah, saying,";
web[15] = "Then all the men who knew that their wives had burned incense to other gods, and all the women that stood by, a great multitude, even all the people that dwelt in the land of Egypt, in Pathros, answered Jeremiah, saying,";
hnv[15] = " Then all the men who knew that their wives burned incense to other gods, and all the women who stood by, a great assembly, even all the people who lived in the land of Mitzrayim, in Patros, answered Yirmeyahu, saying,";
vul[15] = "responderunt autem Hieremiae omnes viri scientes quod sacrificarent uxores eorum diis alienis et universae mulieres quarum stabat multitudo grandis et omnis populus habitantium in terra Aegypti in Fatures dicens";
kjv[16] = "[As for] the word that thou hast spoken unto us in the name of the LORD, we will not hearken unto thee.";
rsv[16] = "&quot;As for the word which you have spoken to us in the name of the LORD, we will not listen to you.";
asv[16] = "As for the word that thou hast spoken unto us in the name of Jehovah, we will not hearken unto thee.";
yng[16] = "`The word that thou hast spoken unto us in the name of Jehovah -- we are not hearkening unto thee;";
dby[16] = "[As for] the word that thou hast spoken unto us in the name of Jehovah, we will not hearken unto thee,";
web[16] = "[As for] the word that thou hast spoken to us in the name of the LORD, we will not hearken to thee.";
hnv[16] = "As for the word that you have spoken to us in the name of the LORD, we will not listen to you.";
vul[16] = "sermonem quem locutus es ad nos in nomine Domini non audiemus ex te";
kjv[17] = "But we will certainly do whatsoever thing goeth forth out of our own mouth, to burn incense unto the queen of heaven, and to pour out drink offerings unto her, as we have done, we, and our fathers, our kings, and our princes, in the cities of Judah, and in the streets of Jerusalem: for [then] had we plenty of victuals, and were well, and saw no evil.";
rsv[17] = "But we will do everything that we have vowed, burn incense to the queen of heaven and pour out libations to her, as we did, both we and our fathers, our kings and our princes, in the cities of Judah and in the streets of Jerusalem; for then we had plenty of food, and prospered, and saw no evil.";
asv[17] = "But we will certainly perform every word that is gone forth out of our mouth, to burn incense unto the queen of heaven, and to pour out drink-offerings unto her, as we have done, we and our fathers, our kings and our princes, in the cities of Judah, and in the streets of Jerusalem; for then had we plenty of victuals, and were well, and saw no evil.";
yng[17] = "for we certainly do everything that hath gone out of our mouth, to make perfume to the queen of the heavens, and to pour out to her libations, as we have done, we, and our fathers, our kings, and our heads, in cities of Judah, and in streets of Jerusalem, and -- we are satisfied with bread, and we are well, and evil we have not seen.";
dby[17] = "but we will certainly do every word that is gone forth out of our mouth, to burn incense to the queen of the heavens, and to pour out drink-offerings to her, as we have done, we and our fathers, our kings and our princes, in the cities of Judah and in the streets of Jerusalem; and we had plenty of bread, and were well, and saw no evil.";
web[17] = "But we will certainly do whatever thing proceedeth from our own mouth, to burn incense to the queen of heaven, and to pour out drink-offerings to her, as we have done, we, and our fathers, our kings, and our princes, in the cities of Judah, and in the streets of Jerusalem: for [then] we had plenty of provisions, and were well, and saw no evil.";
hnv[17] = "But we will certainly perform every word that is gone forth out of our mouth, to burn incense to the queen of the sky, and to pour out drink-offerings to her, as we have done, we and our fathers, our kings and our princes, in the cities of Yehudah, and in the streets of Yerushalayim; for then had we plenty of victuals, and were well, and saw no evil.";
vul[17] = "sed facientes faciemus omne verbum quod egreditur de ore nostro ut sacrificemus Reginae caeli et libemus ei libamina sicut fecimus nos et patres nostri reges nostri et principes nostri in urbibus Iuda et in plateis Hierusalem et saturati sumus panibus et bene nobis erat malumque non vidimus";
kjv[18] = "But since we left off to burn incense to the queen of heaven, and to pour out drink offerings unto her, we have wanted all [things], and have been consumed by the sword and by the famine.";
rsv[18] = "But since we left off burning incense to the queen of heaven and pouring out libations to her, we have lacked everything and have been consumed by the sword and by famine.&quot;";
asv[18] = "But since we left off burning incense to the queen of heaven, and pouring out drink-offerings unto her, we have wanted all things, and have been consumed by the sword and by the famine.";
yng[18] = "`And from the time we have ceased to make perfume to the queen of the heavens, and to pour out to her libations, we have lacked all, and by sword and by famine we have been consumed,";
dby[18] = "But since we left off burning incense to the queen of the heavens, and pouring out drink-offerings to her, we have wanted everything, and have been consumed by the sword and by the famine.";
web[18] = "But since we ceased to burn incense to the queen of heaven, and to pour out drink-offerings to her, we have wanted all [things], and have been consumed by the sword and by the famine.";
hnv[18] = "But since we left off burning incense to the queen of the sky, and pouring out drink-offerings to her, we have wanted all things, and have been consumed by the sword and by the famine.";
vul[18] = "ex eo autem quo cessavimus sacrificare Reginae caeli et libare ei libamina indigemus omnibus et gladio et fame consumpti sumus";
kjv[19] = "And when we burned incense to the queen of heaven, and poured out drink offerings unto her, did we make her cakes to worship her, and pour out drink offerings unto her, without our men?";
rsv[19] = "And the women said, &quot;When we burned incense to the queen of heaven and poured out libations to her, was it without our husbands\' approval that we made cakes for her bearing her image and poured out libations to her?&quot;";
asv[19] = "And when we burned incense to the queen of heaven, and poured out drink-offerings unto her, did we make her cakes to worship her, and pour out drink-offerings unto her, without our husbands?";
yng[19] = "and when we are making perfume to the queen of the heavens, and pouring out to her libations -- without our husbands have we made for her cakes to idolize her, and to pour out to her libations?\'";
dby[19] = "And when we burned incense to the queen of the heavens and poured out drink-offerings to her, did we make for her cakes to portray her, and pour out drink-offerings to her, without our husbands?";
web[19] = "And when we burned incense to the queen of heaven, and poured out drink-offerings to her, did we make for her cakes to worship her, and pour out drink-offerings to her, without our men?";
hnv[19] = "When we burned incense to the queen of the sky, and poured out drink-offerings to her, did we make her cakes to worship her, and pour out drink-offerings to her, without our husbands?";
vul[19] = "quod si nos sacrificamus Reginae caeli et libamus ei libamina numquid sine viris nostris fecimus ei placentas ad colendum eam et liba libandi";
kjv[20] = "Then Jeremiah said unto all the people, to the men, and to the women, and to all the people which had given him [that] answer, saying,";
rsv[20] = "Then Jeremiah said to all the people, men and women, all the people who had given him this answer:";
asv[20] = "Then Jeremiah said unto all the people, to the men, and to the women, even to all the people that had given him that answer, saying,";
yng[20] = "And Jeremiah saith unto all the people, concerning the men and concerning the women, and concerning all the people who are answering him, saying:";
dby[20] = "And Jeremiah said unto all the people, to the men, and to the women, and to all the people that had given him that answer, saying,";
web[20] = "Then Jeremiah said to all the people, to the men, and to the women, and to all the people who had given him [that] answer, saying,";
hnv[20] = "Then Yirmeyahu said to all the people, to the men, and to the women, even to all the people who had given him who answer, saying,";
vul[20] = "et dixit Hieremias ad omnem populum adversum viros et adversum mulieres et adversum universam plebem qui responderant ei verbum dicens";
kjv[21] = "The incense that ye burned in the cities of Judah, and in the streets of Jerusalem, ye, and your fathers, your kings, and your princes, and the people of the land, did not the LORD remember them, and came it [not] into his mind?";
rsv[21] = "&quot;As for the incense that you burned in the cities of Judah and in the streets of Jerusalem, you and your fathers, your kings and your princes, and the people of the land, did not the LORD remember it? Did it not come into his mind?";
asv[21] = "The incense that ye burned in the cities of Judah, and in the streets of Jerusalem, ye and your fathers, your kings and your princes, and the people of the land, did not Jehovah remember them, and came it not into his mind?";
yng[21] = "`The perfume that ye made in the cities of Judah, and in the streets of Jerusalem, ye, and your fathers, your kings, and your heads, and the people of the land, hath not Jehovah remembered it? yea, it cometh up on His heart.";
dby[21] = "Is it not the incense that ye burned in the cities of Judah and in the streets of Jerusalem, ye and your fathers, your kings and your princes and the people of the land, that Jehovah remembered, and that came into his mind?";
web[21] = "The incense that ye burned in the cities of Judah, and in the streets of Jerusalem, ye and your fathers, your kings and your princes, and the people of the land, did not the LORD remember them, and came it [not] into his mind?";
hnv[21] = "The incense that you burned in the cities of Yehudah, and in the streets of Yerushalayim, you and your fathers, your kings and your princes, and the people of the land, didn\'t the LORD remember them, and didn\'t it come into his mind?";
vul[21] = "numquid non sacrificium quod sacrificastis in civitatibus Iuda et in plateis Hierusalem vos et patres vestri reges vestri et principes vestri et populus terrae horum recordatus est Dominus et ascendit super cor eius";
kjv[22] = "So that the LORD could no longer bear, because of the evil of your doings, [and] because of the abominations which ye have committed; therefore is your land a desolation, and an astonishment, and a curse, without an inhabitant, as at this day.";
rsv[22] = "The LORD could no longer bear your evil doings and the abominations which you committed; therefore your land has become a desolation and a waste and a curse, without inhabitant, as it is this day.";
asv[22] = "so that Jehovah could not longer bear, because of the evil of your doings, and because of the abominations which ye have committed; therefore is your land become a desolation, and an astonishment, and a curse, without inhabitant, as it is this day.";
yng[22] = "And Jehovah is not able any more to accept [you], because of the evil of your doings, because of the abominations that ye have done, and your land is for a waste, and for an astonishment, and for a reviling, without inhabitant, as [at] this day.";
dby[22] = "And Jehovah could no longer bear, because of the evil of your doings, [and] because of the abominations that ye had committed; and your land is become a waste, and an astonishment, and a curse, without inhabitant, as at this day.";
web[22] = "So that the LORD could no longer bear, because of the evil of your doings, [and] because of the abominations which ye have committed; therefore is your land a desolation, and an astonishment, and a curse, without an inhabitant, as at this day.";
hnv[22] = "so that the LORD could no longer bear, because of the evil of your doings, and because of the abominations which you have committed; therefore is your land become a desolation, and an astonishment, and a curse, without inhabitant, as it is this day.";
vul[22] = "et non poterat Dominus ultra portare propter malitiam studiorum vestrorum et propter abominationes quas fecistis et facta est terra vestra in desolationem et in stuporem et in maledictum eo quod non sit habitator sicut est dies haec";
kjv[23] = "Because ye have burned incense, and because ye have sinned against the LORD, and have not obeyed the voice of the LORD, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil is happened unto you, as at this day.";
rsv[23] = "It is because you burned incense, and because you sinned against the LORD and did not obey the voice of the LORD or walk in his law and in his statutes and in his testimonies, that this evil has befallen you, as at this day.&quot;";
asv[23] = "Because ye have burned incense, and because ye have sinned against Jehovah, and have not obeyed the voice of Jehovah, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil is happened unto you, as it is this day.";
yng[23] = "`Because that ye have made perfume, and because ye have sinned against Jehovah, and have not hearkened to the voice of Jehovah, and in His law, and in His statutes, and in His testimonies ye have not walked, therefore hath this evil met you as [at] this day.\'";
dby[23] = "Because ye have burned incense, and because ye have sinned against Jehovah, and have not hearkened unto the voice of Jehovah, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil hath come upon you, as at this day.";
web[23] = "Because ye have burned incense, and because ye have sinned against the LORD, and have not obeyed the voice of the LORD, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil hath happened to you, as at this day.";
hnv[23] = "Because you have burned incense, and because you have sinned against the LORD, and have not obeyed the voice of the LORD, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil is happened to you, as it is this day.";
vul[23] = "propterea quod sacrificaveritis idolis et peccaveritis Domino et non audieritis vocem Domini et in lege et in praeceptis et in testimoniis eius non ambulaveritis idcirco evenerunt vobis mala haec sicut est dies haec";
kjv[24] = "Moreover Jeremiah said unto all the people, and to all the women, Hear the word of the LORD, all Judah that [are] in the land of Egypt:";
rsv[24] = "Jeremiah said to all the people and all the women, &quot;Hear the word of the LORD, all you of Judah who are in the land of Egypt,";
asv[24] = "Moreover Jeremiah said unto all the people, and to all the women, Hear the word of Jehovah, all Judah that are in the land of Egypt:";
yng[24] = "And Jeremiah saith unto all the people, and unto all the women, `Hear ye a word of Jehovah, all Judah who [are] in the land of Egypt,";
dby[24] = "And Jeremiah said unto all the people, and to all the women, Hear ye the word of Jehovah, all Judah that are in the land of Egypt.";
web[24] = "Moreover, Jeremiah said to all the people, and to all the women, Hear the word of the LORD, all Judah that [are] in the land of Egypt:";
hnv[24] = "Moreover Yirmeyahu said to all the people, and to all the women, Hear the word of the LORD, all Yehudah who are in the land of Mitzrayim:";
vul[24] = "dixit autem Hieremias ad omnem populum et ad universas mulieres audite verbum Domini omnis Iuda qui estis in terra Aegypti";
kjv[25] = "Thus saith the LORD of hosts, the God of Israel, saying; Ye and your wives have both spoken with your mouths, and fulfilled with your hand, saying, We will surely perform our vows that we have vowed, to burn incense to the queen of heaven, and to pour out drink offerings unto her: ye will surely accomplish your vows, and surely perform your vows.";
rsv[25] = "Thus says the LORD of hosts, the God of Israel: You and your wives have declared with your mouths, and have fulfilled it with your hands, saying, \'We will surely perform our vows that we have made, to burn incense to the queen of heaven and to pour out libations to her.\' Then confirm your vows and perform your vows!";
asv[25] = "Thus saith Jehovah of hosts, the God of Israel, saying, Ye and your wives have both spoken with your mouths, and with your hands have fulfilled it, saying, We will surely perform our vows that we have vowed, to burn incense to the queen of heaven, and to pour out drink-offerings unto her: establish then your vows, and perform your vows.";
yng[25] = "Thus spake Jehovah of Hosts, God of Israel, saying: Ye and your wives both speak with your mouth, and with your hands have fulfilled, saying: We certainly execute our vows that we have vowed, to make perfume to the queen of the heavens, and to pour out to her libations, ye do certainly establish your vows, and certainly execute your vows.";
dby[25] = "Thus saith Jehovah of hosts, the God of Israel, saying, Ye and your wives have both spoken with your mouths, and fulfilled with your hands, saying, We will certainly perform our vows which we have vowed, to burn incense to the queen of the heavens, and to pour out drink-offerings unto her. Ye will certainly establish your vows, and entirely perform your vows.";
web[25] = "Thus saith the LORD of hosts, the God of Israel, saying; Ye and your wives have both spoken with your mouths, and fulfilled with your hand, saying, We will surely perform our vows that we have vowed, to burn incense to the queen of heaven, and to pour out drink-offerings to her: ye will surely accomplish your vows, and surely perform your vows.";
hnv[25] = "Thus says the LORD of Hosts, the God of Yisra\'el, saying, You and your wives have both spoken with your mouths, and with your hands have fulfilled it, saying, We will surely perform our vows that we have vowed, to burn incense to the queen of the sky, and to pour out drink-offerings to her: establish then your vows, and perform your vows.";
vul[25] = "haec inquit Dominus exercituum Deus Israhel dicens vos et uxores vestrae locuti estis ore vestro et manibus vestris implestis dicentes faciamus vota nostra quae vovimus ut sacrificemus Reginae caeli et libemus ei libamina implestis vota vestra et opere perpetrastis ea";
kjv[26] = "Therefore hear ye the word of the LORD, all Judah that dwell in the land of Egypt; Behold, I have sworn by my great name, saith the LORD, that my name shall no more be named in the mouth of any man of Judah in all the land of Egypt, saying, The Lord GOD liveth.";
rsv[26] = "Therefore hear the word of the LORD, all you of Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says the LORD, that my name shall no more be invoked by the mouth of any man of Judah in all the land of Egypt, saying, \'As the Lord GOD lives.\'";
asv[26] = "Therefore hear ye the word of Jehovah, all Judah that dwell in the land of Egypt: Behold, I have sworn by my great name, saith Jehovah, that my name shall no more be named in the mouth of any man of Judah in all the land of Egypt, saying, As the Lord Jehovah liveth.";
yng[26] = "`Therefore, hear ye a word of Jehovah, all Judah who are dwelling in the land of Egypt: Lo, I -- I have sworn by My great name, said Jehovah, My name is no more proclaimed by the mouth of any man of Judah, saying, Live doth the Lord Jehovah -- in all the land of Egypt.";
dby[26] = "Therefore hear ye the word of Jehovah, all Judah that dwell in the land of Egypt: Behold, I have sworn by my great name, saith Jehovah, that my name shall no more be named in the mouth of any man of Judah in all the land of Egypt, saying, [As] the Lord Jehovah liveth.";
web[26] = "Therefore hear ye the word of the LORD, all Judah that dwell in the land of Egypt; Behold, I have sworn by my great name, saith the LORD, that my name shall no more be named in the mouth of any man of Judah in all the land of Egypt, saying, The Lord GOD liveth.";
hnv[26] = "Therefore hear the word of the LORD, all Yehudah who dwell in the land of Mitzrayim: Behold, I have sworn by my great name, says the LORD, that my name shall no more be named in the mouth of any man of Yehudah in all the land of Mitzrayim, saying, As the Lord GOD lives.";
vul[26] = "ideo audite verbum Domini omnis Iuda qui habitatis in terra Aegypti ecce ego iuravi in nomine meo magno ait Dominus quia nequaquam ultra nomen meum vocabitur ex ore omnis viri iudaei dicentis vivit Dominus Deus in omni terra Aegypti";
kjv[27] = "Behold, I will watch over them for evil, and not for good: and all the men of Judah that [are] in the land of Egypt shall be consumed by the sword and by the famine, until there be an end of them.";
rsv[27] = "Behold, I am watching over them for evil and not for good; all the men of Judah who are in the land of Egypt shall be consumed by the sword and by famine, until there is an end of them.";
asv[27] = "Behold, I watch over them for evil, and not for good; and all the men of Judah that are in the land of Egypt shall be consumed by the sword and by the famine, until there be an end of them.";
yng[27] = "Lo, I am watching over them for evil, and not for good, and consumed have been all the men of Judah who [are] in the land of Egypt, by sword and by famine, till their consumption.";
dby[27] = "Behold, I will watch over them for evil, and not for good; and all the men of Judah that are in the land of Egypt shall be consumed by the sword and by the famine, until there be an end of them.";
web[27] = "Behold, I will watch over them for evil, and not for good: and all the men of Judah that [are] in the land of Egypt shall be consumed by the sword and by the famine, until there shall be an end of them.";
hnv[27] = "Behold, I watch over them for evil, and not for good; and all the men of Yehudah who are in the land of Mitzrayim shall be consumed by the sword and by the famine, until there be an end of them.";
vul[27] = "ecce ego vigilabo super eos in malum et non in bonum et consumentur omnes viri Iuda qui sunt in terra Aegypti gladio et fame donec penitus consumantur";
kjv[28] = "Yet a small number that escape the sword shall return out of the land of Egypt into the land of Judah, and all the remnant of Judah, that are gone into the land of Egypt to sojourn there, shall know whose words shall stand, mine, or theirs.";
rsv[28] = "And those who escape the sword shall return from the land of Egypt to the land of Judah, few in number; and all the remnant of Judah, who came to the land of Egypt to live, shall know whose word will stand, mine or theirs.";
asv[28] = "And they that escape the sword shall return out of the land of Egypt into the land of Judah, few in number; and all the remnant of Judah, that are gone into the land of Egypt to sojourn there, shall know whose word shall stand, mine, or theirs.";
yng[28] = "`And the escaped of the sword turn back out of the land of Egypt to the land of Judah, few in number, and known have all the remnant of Judah who are coming into the land of Egypt to sojourn there, whose word is established, Mine or theirs.";
dby[28] = "And they that escape the sword shall return out of the land of Egypt into the land of Judah, a very small company; and all the remnant of Judah, that have come into the land of Egypt to sojourn there, shall know whose word shall stand, mine or theirs.";
web[28] = "Yet a small number that escape the sword shall return from the land of Egypt into the land of Judah, and all the remnant of Judah, that have gone into the land of Egypt to sojourn there, shall know whose words shall stand, mine, or theirs.";
hnv[28] = "Those who escape the sword shall return out of the land of Mitzrayim into the land of Yehudah, few in number; and all the remnant of Yehudah, who have gone into the land of Mitzrayim to sojourn there, shall know whose word shall stand, mine, or theirs.";
vul[28] = "et qui fugerint gladium revertentur de terra Aegypti in terram Iuda viri pauci et scient omnes reliquiae Iuda ingredientium terram Aegypti ut habitent ibi cuius sermo conpleatur meus an illorum";
kjv[29] = "And this [shall be] a sign unto you, saith the LORD, that I will punish you in this place, that ye may know that my words shall surely stand against you for evil:";
rsv[29] = "This shall be the sign to you, says the LORD, that I will punish you in this place, in order that you may know that my words will surely stand against you for evil:";
asv[29] = "And this shall be the sign unto you, saith Jehovah, that I will punish you in this place, that ye may know that my words shall surely stand against you for evil:";
yng[29] = "`And this [is] to you the sign -- an affirmation of Jehovah -- that I am seeing after you in this place, so that ye know that My words are certainly established against you for evil;";
dby[29] = "And this shall be the sign unto you, saith Jehovah, that I will punish you in this place, that ye may know that my words shall certainly stand against you for evil:";
web[29] = "And this [shall be] a sign to you, saith the LORD, that I will punish you in this place, that ye may know that my words shall surely stand against you for evil:";
hnv[29] = "This shall be the sign to you, says the LORD, that I will punish you in this place, that you may know that my words shall surely stand against you for evil:";
vul[29] = "et hoc vobis signum ait Dominus quod visitem ego super vos in loco isto ut sciatis quia vere conplebuntur sermones mei contra vos in malum";
kjv[30] = "Thus saith the LORD; Behold, I will give Pharaohhophra king of Egypt into the hand of his enemies, and into the hand of them that seek his life; as I gave Zedekiah king of Judah into the hand of Nebuchadrezzar king of Babylon, his enemy, and that sought his life.";
rsv[30] = "Thus says the LORD, Behold, I will give Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those who seek his life, as I gave Zedeki\'ah king of Judah into the hand of Nebuchadrez\'zar king of Babylon, who was his enemy and sought his life.&quot;";
asv[30] = "Thus saith Jehovah, Behold, I will give Pharaoh Hophra king of Egypt into the hand of his enemies, and into the hand of them that seek his life; as I gave Zedekiah king of Judah into the hand of Nebuchadrezzar king of Babylon, who was his enemy, and sought his life.";
yng[30] = "Thus said Jehovah, Lo, I am giving Pharaoh-Hophra king of Egypt into the hand of his enemies, and into the hand of those seeking his life, as I have given Zedekiah king of Judah into the hand of Nebuchadrezzar king of Babylon, his enemy, and who is seeking his life.\'";

hnv[30] = "Thus says the LORD, Behold, I will give Par`oh Hofra king of Mitzrayim into the hand of his enemies, and into the hand of those who seek his life; as I gave Tzidkiyahu king of Yehudah into the hand of Nevukhadretztzar king of Bavel, who was his enemy, and sought his life.";
vul[30] = "haec dicit Dominus ecce ego tradam Pharaonem Efree regem Aegypti in manu inimicorum eius et in manu quaerentium animam illius sicut tradidi Sedeciam regem Iuda in manu Nabuchodonosor regis Babylonis inimici sui et quaerentis animam eius";
