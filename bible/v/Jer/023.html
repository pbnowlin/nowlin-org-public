csb[1] = "&quot;Woe to the shepherds who destroy and scatter the sheep of my pasture! &quot; This is the LORD\'s declaration.";
csb[2] = "&quot;Therefore, this is what the LORD, the God of Israel, says about the shepherds who tend my people: You have scattered my flock, banished them, and have not attended to them. I am about to attend to you because of your evil acts&quot; -- this is the LORD\'s declaration.";
csb[3] = "&quot;I will gather the remnant of my flock from all the lands where I have banished them, and I will return them to their grazing land. They will become fruitful and numerous.";
csb[4] = "&quot;I will raise up shepherds over them who will tend them. They will no longer be afraid or discouraged, nor will any be missing.&quot; This is the LORD\'s declaration.";
csb[5] = "&quot;Look, the days are coming&quot; -- this is the LORD\'s declaration -- &quot;when I will raise up a Righteous Branch for David. He will reign wisely as king and administer justice and righteousness in the land.";
csb[6] = "&quot;In his days Judah will be saved, and Israel will dwell securely. This is the name he will be called: The LORD Is Our Righteousness.";
csb[7] = "&quot;Look, the days are coming&quot; -- the LORD\'s declaration -- &quot;when it will no longer be said, \'As the LORD lives who brought the Israelites from the land of Egypt,\'";
csb[8] = "&quot;but, \'As the LORD lives, who brought and led the descendants of the house of Israel from the land of the north and from all the other countries where I had banished them.\' They will dwell once more in their own land.&quot;";
csb[9] = "Concerning the prophets: My heart is broken within me, and all my bones tremble. I have become like a drunkard, like a man overcome by wine, because of the LORD, because of his holy words.";
csb[10] = "For the land is full of adulterers; the land mourns because of the curse, and the grazing lands in the wilderness have dried up. Their way of life has become evil, and their power is not rightly used";
csb[11] = "because both prophet and priest are ungodly, even in my house I have found their evil. This is the LORD\'s declaration.";
csb[12] = "Therefore, their way will seem like slippery paths in the gloom. They will be driven away and fall down there, for I will bring disaster on them, the year of their punishment. This is the LORD\'s declaration.";
csb[13] = "Among the prophets of Samaria I saw something disgusting: They prophesied by Baal and led my people Israel astray.";
csb[14] = "Among the prophets of Jerusalem also I saw a horrible thing: They commit adultery and walk in lies. They strengthen the hands of evildoers, and none turns his back on evil. They are all like Sodom to me; Jerusalem\'s residents are like Gomorrah.";
csb[15] = "Therefore, this is what the LORD of Armies says concerning the prophets: I am about to feed them wormwood and give them poisoned water to drink, for from the prophets of Jerusalem ungodliness has spread throughout the land.";
csb[16] = "This is what the LORD of Armies says: &quot;Do not listen to the words of the prophets who prophesy to you. They are deluding you. They speak visions from their own minds, not from the LORD\'s mouth.";
csb[17] = "&quot;They keep on saying to those who despise me, \'The LORD has spoken: You will have peace.\' They have said to everyone who follows the stubbornness of his heart, \'No harm will come to you.\' &quot;";
csb[18] = "For who has stood in the council of the LORD to see and hear his word? Who has paid attention to his word and obeyed?";
csb[19] = "Look, a storm from the LORD! Wrath has gone out, a whirling storm. It will whirl about the heads of the wicked.";
csb[20] = "The LORD\'s anger will not turn away until he has completely fulfilled the purposes of his heart. In time to come you will understand it clearly.";
csb[21] = "I did not send out these prophets, yet they ran. I did not speak to them, yet they prophesied.";
csb[22] = "If they had really stood in my council, they would have enabled my people to hear my words and would have turned them from their evil ways and their evil deeds.";
csb[23] = "&quot;Am I a God who is only near&quot; -- this is the LORD\'s declaration -- &quot;and not a God who is far away?";
csb[24] = "&quot;Can a person hide in secret places where I cannot see him? &quot; -- the LORD\'s declaration. &quot;Do I not fill the heavens and the earth? &quot; -- the LORD\'s declaration.";
csb[25] = "&quot;I have heard what the prophets who prophesy a lie in my name have said: \'I had a dream! I had a dream! \'";
csb[26] = "&quot;How long will this continue in the minds of the prophets prophesying lies, prophets of the deceit of their own minds?";
csb[27] = "&quot;Through their dreams that they tell one another, they plan to cause my people to forget my name as their fathers forgot my name through Baal worship.";
csb[28] = "&quot;The prophet who has only a dream should recount the dream, but the one who has my word should speak my word truthfully, for what is straw compared to grain? &quot; -- this is the LORD\'s declaration.";
csb[29] = "&quot;Is not my word like fire&quot; -- this is the LORD\'s declaration -- &quot;and like a hammer that pulverizes rock?";
csb[30] = "&quot;Therefore, take note! I am against the prophets&quot; -- the LORD\'s declaration -- &quot;who steal my words from each other.";
csb[31] = "&quot;I am against the prophets&quot; -- the LORD\'s declaration -- &quot;who use their own tongues to make a declaration.";
csb[32] = "&quot;I am against those who prophesy false dreams&quot; -- the LORD\'s declaration -- &quot;telling them and leading my people astray with their reckless lies. It was not I who sent or commanded them, and they are of no benefit at all to these people&quot; -- this is the LORD\'s declaration.";
csb[33] = "&quot;Now when these people or a prophet or a priest asks you, \'What is the burden of the LORD? \' you will respond to them, \'What is the burden? I will throw you away! This is the LORD\'s declaration.\'";
csb[34] = "&quot;As for the prophet, priest, or people who say, \'The burden of the LORD,\' I will punish that man and his household.";
csb[35] = "&quot;This is what each man is to say to his friend and to his brother: \'What has the LORD answered? \' or \'What has the LORD spoken? \'";
csb[36] = "&quot;But no longer refer to the burden of the LORD, for each man\'s word becomes his burden and you pervert the words of the living God, the LORD of Armies, our God.";
csb[37] = "&quot;Say to the prophet, \'What has the LORD answered you? \' or \'What has the LORD spoken? \'";
csb[38] = "&quot;But if you say, \'The burden of the LORD,\' then this is what the LORD says: Because you have said, \'The burden of the LORD,\' and I specifically told you not to say, \'The burden of the LORD,\'";
csb[39] = "&quot;I will surely forget you. I will throw you away from my presence -- both you and the city that I gave you and your fathers.";
csb[40] = "&quot;I will bring on you everlasting disgrace and humiliation that will never be forgotten.&quot;";
