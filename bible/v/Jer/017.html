csb[1] = "The sin of Judah is inscribed with an iron stylus. With a diamond point it is engraved on the tablet of their hearts and on the horns of their altars,";
csb[2] = "while their children remember their altars and their Asherah poles, by the green trees on the high hills --";
csb[3] = "my mountains in the countryside. I will give up your wealth and all your treasures as plunder because of the sin of your high places in all your borders.";
csb[4] = "You will, on your own, relinquish your inheritance that I gave you. I will make you serve your enemies in a land you do not know, for you have set my anger on fire; it will burn forever.";
csb[5] = "This is what the LORD says: Cursed is the person who trusts in mankind. He makes human flesh his strength, and his heart turns from the LORD.";
csb[6] = "He will be like a juniper in the Arabah; he cannot see when good comes but dwells in the parched places in the wilderness, in a salt land where no one lives.";
csb[7] = "The person who trusts in the LORD, whose confidence indeed is the LORD, is blessed.";
csb[8] = "He will be like a tree planted by water: it sends its roots out toward a stream, it doesn\'t fear when heat comes, and its foliage remains green. It will not worry in a year of drought or cease producing fruit.";
csb[9] = "The heart is more deceitful than anything else, and incurable -- who can understand it?";
csb[10] = "I, the LORD, examine the mind, I test the heart to give to each according to his way, according to what his actions deserve.";
csb[11] = "He who makes a fortune unjustly is like a partridge that hatches eggs it didn\'t lay. In the middle of his life his riches will abandon him, so in the end he will be a fool.";
csb[12] = "A glorious throne on high from the beginning is the place of our sanctuary.";
csb[13] = "LORD, the hope of Israel, all who abandon you will be put to shame. All who turn away from me will be written in the dirt, for they have abandoned the LORD, the fountain of living water.";
csb[14] = "Heal me, LORD, and I will be healed; save me, and I will be saved, for you are my praise.";
csb[15] = "Hear how they keep challenging me, &quot;Where is the word of the LORD? Let it come! &quot;";
csb[16] = "But I have not run away from being your shepherd, and I have not longed for the fatal day. You know my words were spoken in your presence.";
csb[17] = "Don\'t become a terror to me. You are my refuge in the day of disaster.";
csb[18] = "Let my persecutors be put to shame, but don\'t let me be put to shame. Let them be terrified, but don\'t let me be terrified. Bring on them the day of disaster; shatter them with total destruction.";
csb[19] = "This is what the LORD said to me, &quot;Go and stand at the People\'s Gate, through which the kings of Judah enter and leave, as well as at all the gates of Jerusalem.";
csb[20] = "&quot;Announce to them, \'Hear the word of the LORD, kings of Judah, all Judah, and all the residents of Jerusalem who enter through these gates.";
csb[21] = "&quot;This is what the LORD says: Watch yourselves; do not pick up a load and bring it in through Jerusalem\'s gates on the Sabbath day.";
csb[22] = "&quot;Do not carry a load out of your houses on the Sabbath day or do any work, but keep the Sabbath day holy, just as I commanded your ancestors.";
csb[23] = "&quot;They wouldn\'t listen or pay attention but became obstinate, not listening or accepting discipline.";
csb[24] = "&quot; \'However, if you listen to me -- this is the LORD\'s declaration -- and do not bring loads through the gates of this city on the Sabbath day, but keep the Sabbath day holy and do no work on it,";
csb[25] = "&quot;kings and princes will enter through the gates of this city. They will sit on the throne of David; they will ride in chariots and on horses with their officials, the men of Judah, and the residents of Jerusalem. This city will be inhabited forever.";
csb[26] = "&quot;Then people will come from the cities of Judah and from the area around Jerusalem, from the land of Benjamin and from the Judean foothills, from the hill country and from the Negev bringing burnt offerings and sacrifices, grain offerings and frankincense, and thank offerings to the house of the LORD.";
csb[27] = "&quot;But if you do not listen to me to keep the Sabbath day holy by not carrying a load while entering the gates of Jerusalem on the Sabbath day, I will set fire to its gates, and it will consume the citadels of Jerusalem and not be extinguished.\' &quot;";
kjv[1] = "The sin of Judah [is] written with a pen of iron, [and] with the point of a diamond: [it is] graven upon the table of their heart, and upon the horns of your altars;";
kjv[2] = "Whilst their children remember their altars and their groves by the green trees upon the high hills.";
kjv[3] = "O my mountain in the field, I will give thy substance [and] all thy treasures to the spoil, [and] thy high places for sin, throughout all thy borders.";
kjv[4] = "And thou, even thyself, shalt discontinue from thine heritage that I gave thee; and I will cause thee to serve thine enemies in the land which thou knowest not: for ye have kindled a fire in mine anger, [which] shall burn for ever.";

kjv[8] = "For he shall be as a tree planted by the waters, and [that] spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit.";
kjv[9] = "The heart [is] deceitful above all [things], and desperately wicked: who can know it?";
kjv[10] = "I the LORD search the heart, [I] try the reins, even to give every man according to his ways, [and] according to the fruit of his doings.";
kjv[11] = "[As] the partridge sitteth [on eggs], and hatcheth [them] not; [so] he that getteth riches, and not by right, shall leave them in the midst of his days, and at his end shall be a fool.";
kjv[12] = "A glorious high throne from the beginning [is] the place of our sanctuary.";
kjv[13] = "O LORD, the hope of Israel, all that forsake thee shall be ashamed, [and] they that depart from me shall be written in the earth, because they have forsaken the LORD, the fountain of living waters.";
kjv[14] = "Heal me, O LORD, and I shall be healed; save me, and I shall be saved: for thou [art] my praise.";
kjv[15] = "Behold, they say unto me, Where [is] the word of the LORD? let it come now.";
kjv[16] = "As for me, I have not hastened from [being] a pastor to follow thee: neither have I desired the woeful day; thou knowest: that which came out of my lips was [right] before thee.";
kjv[17] = "Be not a terror unto me: thou [art] my hope in the day of evil.";
kjv[18] = "Let them be confounded that persecute me, but let not me be confounded: let them be dismayed, but let not me be dismayed: bring upon them the day of evil, and destroy them with double destruction.";
kjv[19] = "Thus said the LORD unto me; Go and stand in the gate of the children of the people, whereby the kings of Judah come in, and by the which they go out, and in all the gates of Jerusalem;";
kjv[20] = "And say unto them, Hear ye the word of the LORD, ye kings of Judah, and all Judah, and all the inhabitants of Jerusalem, that enter in by these gates:";
kjv[21] = "Thus saith the LORD; Take heed to yourselves, and bear no burden on the sabbath day, nor bring [it] in by the gates of Jerusalem;";
kjv[22] = "Neither carry forth a burden out of your houses on the sabbath day, neither do ye any work, but hallow ye the sabbath day, as I commanded your fathers.";
kjv[23] = "But they obeyed not, neither inclined their ear, but made their neck stiff, that they might not hear, nor receive instruction.";
kjv[24] = "And it shall come to pass, if ye diligently hearken unto me, saith the LORD, to bring in no burden through the gates of this city on the sabbath day, but hallow the sabbath day, to do no work therein;";
kjv[25] = "Then shall there enter into the gates of this city kings and princes sitting upon the throne of David, riding in chariots and on horses, they, and their princes, the men of Judah, and the inhabitants of Jerusalem: and this city shall remain for ever.";
kjv[26] = "And they shall come from the cities of Judah, and from the places about Jerusalem, and from the land of Benjamin, and from the plain, and from the mountains, and from the south, bringing burnt offerings, and sacrifices, and meat offerings, and incense, and bringing sacrifices of praise, unto the house of the LORD.";
kjv[27] = "But if ye will not hearken unto me to hallow the sabbath day, and not to bear a burden, even entering in at the gates of Jerusalem on the sabbath day; then will I kindle a fire in the gates thereof, and it shall devour the palaces of Jerusalem, and it shall not be quenched.";

asv[18] = "Let them be put to shame that persecute me, but let not me be put to shame; let them be dismayed, but let not me be dismayed; bring upon them the day of evil, and destroy them with double destruction.";
yng[18] = "Let my pursuers be ashamed, and let not me be ashamed -- me! Let them be affrighted, and let not me be affrighted -- me! Bring in on them a day of evil, And a second time [with] destruction destroy them.";
dby[18] = "Let them be ashamed that persecute me, but let not me be ashamed; let them be dismayed, but let not me be dismayed; bring upon them the day of evil, and break them with a double breaking.";
web[18] = "Let them be confounded that persecute me, but let not me be confounded: let them be dismayed, but let not me be dismayed: bring upon them the day of evil, and destroy them with double destruction.";
hnv[18] = "Let them be disappointed who persecute me, but let not me be disappointed; let them be dismayed, but don\'t let me be dismayed; bring on them the day of evil, and destroy them with double destruction.";
vul[18] = "confundantur qui persequuntur me et non confundar ego paveant illi et non paveam ego induc super eos diem adflictionis et duplici contritione contere eos";
rsv[19] = "Thus said the LORD to me: &quot;Go and stand in the Benjamin Gate, by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem,";
asv[19] = "Thus said Jehovah unto me: Go, and stand in the gate of the children of the people, whereby the kings of Judah come in, and by which they go out, and in all the gates of Jerusalem;";
yng[19] = "Thus said Jehovah unto me: `Go, and thou hast stood in the gate of the sons of the people, by which kings of Judah come in, and by which they go out, and in all gates of Jerusalem,";
dby[19] = "Thus hath Jehovah said unto me: Go and stand in the gate of the children of the people, by which the kings of Judah come in, and by which they go out, and in all the gates of Jerusalem;";
web[19] = "Thus said the LORD to me; Go and stand in the gate of the children of the people, by which the kings of Judah come in, and by which they go out, and in all the gates of Jerusalem;";
hnv[19] = "Thus said the LORD to me: Go, and stand in the gate of the children of the people, through which the kings of Yehudah come in, and by which they go out, and in all the gates of Yerushalayim;";
vul[19] = "haec dicit Dominus ad me vade et sta in porta filiorum populi per quam ingrediuntur reges Iuda et egrediuntur et in cunctis portis Hierusalem";
rsv[20] = "and say: \'Hear the word of the LORD, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem, who enter by these gates.";
asv[20] = "and say unto them, Hear ye the word of Jehovah, ye kings of Judah, and all Judah, and all the inhabitants of Jerusalem, that enter in by these gates:";
yng[20] = "and thou hast said unto them: Hear a word of Jehovah, ye kings of Judah, and all Judah, and all inhabitants of Jerusalem, who are coming in by these gates,";
dby[20] = "and say unto them, Hear the word of Jehovah, ye kings of Judah, and all Judah, and all the inhabitants of Jerusalem, that enter in by these gates;";
web[20] = "And say to them, Hear ye the word of the LORD, ye kings of Judah, and all Judah, and all the inhabitants of Jerusalem, that enter by these gates:";
hnv[20] = "and tell them, Hear you the word of the LORD, you kings of Yehudah, and all Yehudah, and all the inhabitants of Yerushalayim, that enter in by these gates:";
vul[20] = "et dices ad eos audite verbum Domini reges Iuda et omnis Iudaea cunctique habitatores Hierusalem qui ingredimini per portas istas";
rsv[21] = "Thus says the LORD: Take heed for the sake of your lives, and do not bear a burden on the sabbath day or bring it in by the gates of Jerusalem.";
asv[21] = "Thus saith Jehovah, Take heed to yourselves, and bear no burden on the sabbath day, nor bring it in by the gates of Jerusalem;";
yng[21] = "Thus said Jehovah, Take ye heed to yourselves, And ye bear not a burden on the day of rest, Nor have ye brought [it] in by the gates of Jerusalem.";
dby[21] = "thus saith Jehovah: Take heed to your souls, and bear no burden on the sabbath day, and bring nothing in through the gates of Jerusalem;";
web[21] = "Thus saith the LORD; Take heed to yourselves, and bear no burden on the sabbath day, nor bring [it] in by the gates of Jerusalem;";
hnv[21] = "Thus says the LORD, Take heed to yourselves, and bear no burden on the day of Shabbat, nor bring it in by the gates of Yerushalayim;";
vul[21] = "haec dicit Dominus custodite animas vestras et nolite portare pondera in die sabbati nec inferatis per portas Hierusalem";
rsv[22] = "And do not carry a burden out of your houses on the sabbath or do any work, but keep the sabbath day holy, as I commanded your fathers.";
asv[22] = "neither carry forth a burden out of your houses on the sabbath day, neither do ye any work: but hallow ye the sabbath day, as I commanded your fathers.";
yng[22] = "Nor do ye take out a burden from your houses on the day of rest, Yea, any work ye do not do, And ye have sanctified the day of rest, As I have commanded your fathers.";
dby[22] = "and carry forth no burden out of your houses on the sabbath day, neither do any work; but hallow ye the sabbath day, as I commanded your fathers,";
web[22] = "Neither carry forth a burden out of your houses on the sabbath day, neither do ye any work, but hallow ye the sabbath day, as I commanded your fathers.";
hnv[22] = "neither carry forth a burden out of your houses on the day of Shabbat holy, neither do any work: but make the day of Shabbat, as I commanded your fathers.";
vul[22] = "et nolite eicere onera de domibus vestris in die sabbati et omne opus non facietis sanctificate diem sabbati sicut praecepi patribus vestris";
rsv[23] = "Yet they did not listen or incline their ear, but stiffened their neck, that they might not hear and receive instruction.";
asv[23] = "But they hearkened not, neither inclined their ear, but made their neck stiff, that they might not hear, and might not receive instruction.";
yng[23] = "And they have not hearkened nor inclined their ear, And they stiffen their neck not to hear, And not to receive instruction.";
dby[23] = "but they hearkened not, neither inclined their ear, but hardened their neck, that they might not hear nor receive instruction.";
web[23] = "But they obeyed not, neither inclined their ear, but made their neck stiff, that they might not hear, nor receive instruction.";
hnv[23] = " But they didn\'t listen, neither turn their ear, but made their neck stiff, that they might not hear, and might not receive instruction.";
vul[23] = "et non audierunt nec inclinaverunt aurem suam sed induraverunt cervicem suam ne audirent me et ne acciperent disciplinam";
rsv[24] = "&quot;\'But if you listen to me, says the LORD, and bring in no burden by the gates of this city on the sabbath day, but keep the sabbath day holy and do no work on it,";
asv[24] = "And it shall come to pass, if ye diligently hearken unto me, saith Jehovah, to bring in no burden through the gates of this city on the sabbath day, but to hallow the sabbath day, to do no work therein;";
yng[24] = "And it hath been, if ye certainly hearken unto Me, An affirmation of Jehovah, So as not to bring in a burden By the gates of this city on the day of rest, And to sanctify the day of rest, So as not to do in it any work --";
dby[24] = "And it shall come to pass, if ye diligently hearken unto me, saith Jehovah, to bring in no burden through the gates of this city on the sabbath day, and to hallow the sabbath day, to do no work therein;";
web[24] = "And it shall come to pass, if ye diligently hearken to me, saith the LORD, to bring in no burden through the gates of this city on the sabbath day, but hallow the sabbath day, to do no work therein;";
hnv[24] = "It shall happen, if you diligently listen to me, says the LORD, to bring in no burden through the gates of this city on the day of Shabbat, but to make the day of Shabbat holy, to do no work therein;";
vul[24] = "et erit si audieritis me dicit Dominus ut non inferatis onera per portas civitatis huius in die sabbati et si sanctificaveritis diem sabbati ne faciatis in ea omne opus";
rsv[25] = "then there shall enter by the gates of this city kings who sit on the throne of David, riding in chariots and on horses, they and their princes, the men of Judah and the inhabitants of Jerusalem; and this city shall be inhabited for ever.";
asv[25] = "then shall there enter in by the gates of this city kings and princes sitting upon the throne of David, riding in chariots and on horses, they, and their princes, the men of Judah, and the inhabitants of Jerusalem; and this city shall remain for ever.";
yng[25] = "Then entered by the gates of this city have kings and princes, Sitting on the throne of David, Riding in a chariot, and on horses, They, and their princes, the man of Judah, And inhabitants of Jerusalem, And this city hath remained to the age.";
dby[25] = "then shall there enter in, through the gates of this city, kings and princes sitting upon the throne of David, riding in chariots and on horses, they and their princes, the men of Judah and the inhabitants of Jerusalem: and this city shall be inhabited for ever.";
web[25] = "Then shall there enter into the gates of this city kings and princes sitting upon the throne of David, riding in chariots and on horses, they and their princes, the men of Judah, and the inhabitants of Jerusalem: and this city shall remain for ever.";
hnv[25] = "then shall there enter in by the gates of this city kings and princes sitting on the throne of David, riding in chariots and on horses, they, and their princes, the men of Yehudah, and the inhabitants of Yerushalayim; and this city shall remain forever.";
vul[25] = "ingredientur per portas civitatis huius reges et principes sedentes super solium David et ascendentes in curribus et equis ipsi et principes eorum vir Iuda et habitatores Hierusalem et habitabitur civitas haec in sempiternum";
rsv[26] = "And people shall come from the cities of Judah and the places round about Jerusalem, from the land of Benjamin, from the Shephe\'lah, from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, cereal offerings and frankincense, and bringing thank offerings to the house of the LORD.";
asv[26] = "And they shall come from the cities of Judah, and from the places round about Jerusalem, and from the land of Benjamin, and from the lowland, and from the hill-country, and from the South, bringing burnt-offerings, and sacrifices, and meal-offerings, and frankincense, and bringing [sacrifices of] thanksgiving, unto the house of Jehovah.";
yng[26] = "And they have come in from cities of Judah, And from suburbs of Jerusalem, And from the land of Benjamin, And from the low country, And from the hill-country, and from the south, Bringing in burnt-offering, and sacrifice, And present, and frankincense, And bringing praise [to] the house of Jehovah.";
dby[26] = "And they shall come from the cities of Judah, and from the places around Jerusalem, and from the land of Benjamin, and from the lowland, and from the hill-country, and from the south, bringing burnt-offerings, and sacrifices, and oblations, and incense, and bringing thanksgiving unto the house of Jehovah.";
web[26] = "And they shall come from the cities of Judah, and from the places about Jerusalem, and from the land of Benjamin, and from the plain, and from the mountains, and from the south, bringing burnt-offerings, and sacrifices, and meat-offerings, and incense, and bringing sacrifices of praise, to the house of the LORD.";
hnv[26] = "They shall come from the cities of Yehudah, and from the places round about Yerushalayim, and from the land of Binyamin, and from the lowland, and from the hill-country, and from the South, bringing burnt offerings, and sacrifices, and meal-offerings, and frankincense, and bringing [sacrifices of] thanksgiving, to the house of the LORD.";
vul[26] = "et venient de civitate Iuda et de circuitu Hierusalem et de terra Beniamin et de campestribus et de montuosis et ab austro portantes holocaustum et victimam et sacrificium et tus et inferent oblationem in domum Domini";
rsv[27] = "But if you do not listen to me, to keep the sabbath day holy, and not to bear a burden and enter by the gates of Jerusalem on the sabbath day, then I will kindle a fire in its gates, and it shall devour the palaces of Jerusalem and shall not be quenched.\'&quot;";
asv[27] = "But if ye will not hearken unto me to hallow the sabbath day, and not to bear a burden and enter in at the gates of Jerusalem on the sabbath day; then will I kindle a fire in the gates thereof, and it shall devour the palaces of Jerusalem, and it shall not be quenched.";
yng[27] = "And if ye do not hearken unto me to sanctify the day of rest, And so as not to bear a burden, And to come in at the gates of Jerusalem on the day of rest, Then I have kindled a fire in its gates, And it hath consumed the high places of Jerusalem, And it is not quenched!\'";
dby[27] = "But if ye will not hearken unto me, to hallow the sabbath day and not to bear a burden and enter in through the gates of Jerusalem on the sabbath day, then will I kindle a fire in the gates thereof, and it shall devour the palaces of Jerusalem, and it shall not be quenched.";
web[27] = "But if ye will not hearken to me to hallow the sabbath day, and not to bear a burden, even entering at the gates of Jerusalem on the sabbath day; then will I kindle a fire in its gates, and it shall devour the palaces of Jerusalem, and it shall not be quenched.";
hnv[27] = "But if you will not listen to me to make the day of Shabbat holy, and not to bear a burden and enter in at the gates of Yerushalayim on the day of Shabbat; then will I kindle a fire in the gates of it, and it shall devour the palaces of Yerushalayim, and it shall not be quenched.";
vul[27] = "si autem non audieritis me ut sanctificetis diem sabbati et ne portetis onus et ne inferatis per portas Hierusalem in die sabbati succendam ignem in portis eius et devorabit domos Hierusalem et non extinguetur";
</script>
