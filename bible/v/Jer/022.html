csb[1] = "This is what the LORD says: &quot;Go down to the palace of the king of Judah and announce this word there.";
csb[2] = "&quot;You are to say, \'Hear the word of the LORD, king of Judah, you who sit on the throne of David -- you, your officers, and your people who enter these gates.";
csb[3] = "&quot;This is what the LORD says: Administer justice and righteousness. Rescue the victim of robbery from his oppressor. Don\'t exploit or brutalize the resident alien, the fatherless, or the widow. Don\'t shed innocent blood in this place.";
csb[4] = "&quot;For if you conscientiously carry out this word, then kings sitting on David\'s throne will enter through the gates of this palace riding on chariots and horses -- they, their officers, and their people.";
csb[5] = "&quot;But if you do not obey these words, then I swear by myself -- this is the LORD\'s declaration -- that this house will become a ruin.\' &quot;";
csb[6] = "For this is what the LORD says concerning the house of the king of Judah: &quot;You are like Gilead to me, or the summit of Lebanon, but I will certainly turn you into a wilderness, uninhabited cities.";
csb[7] = "&quot;I will set apart destroyers against you, each with his weapons. They will cut down the choicest of your cedars and throw them into the fire.";
csb[8] = "&quot;Many nations will pass by this city and ask one another, \'Why did the LORD do such a thing to this great city? \'";
csb[9] = "&quot;They will answer, \'Because they abandoned the covenant of the LORD their God and bowed in worship to other gods and served them.\' &quot;";
csb[10] = "Do not weep for the dead; do not mourn for him. Weep bitterly for the one who has gone away, for he will never return again and see his native land.";
csb[11] = "For this is what the LORD says concerning Shallum son of Josiah, king of Judah, who became king in place of his father Josiah, and who has left this place: &quot;He will never return here again,";
csb[12] = "&quot;but he will die in the place where they deported him, never seeing this land again.&quot;";
csb[13] = "Woe for the one who builds his palace through unrighteousness, his upstairs rooms through injustice, who makes his neighbor serve without pay and will not give him his wages,";
csb[14] = "who says, &quot;I will build myself a massive palace, with spacious upstairs rooms.&quot; He will cut windows in it, and it will be paneled with cedar and painted bright red.";
csb[15] = "Are you a king because you excel in cedar? Didn\'t your father eat and drink and administer justice and righteousness? Then it went well with him.";
csb[16] = "He took up the case of the poor and needy; then it went well. Is this not what it means to know me? This is the LORD\'s declaration.";
csb[17] = "But you have eyes and a heart for nothing except your own dishonest profit, shedding innocent blood and committing extortion and oppression.";
csb[18] = "Therefore, this is what the LORD says concerning Jehoiakim son of Josiah, king of Judah: They will not mourn for him, saying, &quot;Woe, my brother! &quot; or &quot;Woe, my sister! &quot; They will not mourn for him, saying, &quot;Woe, lord! Woe, his majesty! &quot;";
csb[19] = "He will be buried like a donkey, dragged off and thrown outside Jerusalem\'s gates.";
csb[20] = "Go up to Lebanon and cry out; raise your voice in Bashan; cry out from Abarim, for all your lovers have been crushed.";
csb[21] = "I spoke to you when you were secure. You said, &quot;I will not listen.&quot; This has been your way since youth; indeed, you have never listened to me.";
csb[22] = "The wind will take charge of all your shepherds, and your lovers will go into captivity. Then you will be ashamed and humiliated because of all your evil.";
csb[23] = "You residents of Lebanon, nestled among the cedars, how you will groan when pains come on you, agony like a woman in labor.";
csb[24] = "&quot;As I live&quot; -- this is the LORD\'s declaration -- &quot;though you, Coniah son of Jehoiakim, the king of Judah, were a signet ring on my right hand, I would tear you from it.";
csb[25] = "&quot;In fact, I will hand you over to those you dread, who intend to take your life, to Nebuchadnezzar king of Babylon and the Chaldeans.";
csb[26] = "&quot;I will hurl you and the mother who gave birth to you into another land, where neither of you were born, and there you will both die.";
csb[27] = "&quot;They will never return to the land they long to return to.&quot;";
csb[28] = "Is this man Coniah a despised, shattered pot, a jar no one wants? Why are he and his descendants hurled out and cast into a land they have not known?";
csb[29] = "Earth, earth, earth, hear the word of the LORD!";
csb[30] = "This is what the LORD says: Record this man as childless, a man who will not be successful in his lifetime. None of his descendants will succeed in sitting on the throne of David or ruling again in Judah.";

kjv[18] = "Therefore thus saith the LORD concerning Jehoiakim the son of Josiah king of Judah; They shall not lament for him, [saying], Ah my brother! or, Ah sister! they shall not lament for him, [saying], Ah lord! or, Ah his glory!";
rsv[18] = "Therefore thus says the LORD concerning Jehoi\'akim the son of Josi\'ah, king of Judah: &quot;They shall not lament for him, saying, \'Ah my brother!\' or \'Ah sister!\' They shall not lament for him, saying, \'Ah lord!\' or \'Ah his majesty!\'";
asv[18] = "Therefore thus saith Jehovah concerning Jehoiakim the son of Josiah, king of Judah: they shall not lament for him, [saying], Ah my brother! or, Ah sister! They shall not lament for him, [saying] Ah lord! or, Ah his glory!";
yng[18] = "Therefore, thus said Jehovah concerning Jehoiakim son of Josiah king of Judah: They do not lament for him, Ah, my brother, and Ah, sister, They do not lament for him, Ah, lord, and Ah, his honour.";
dby[18] = "Therefore thus saith Jehovah concerning Jehoiakim the son of Josiah, the king of Judah: They shall not lament for him, Ah, my brother! or, Ah, sister! They shall not lament for him, Ah, lord! or Ah, his glory!";
web[18] = "Therefore thus saith the LORD concerning Jehoiakim the son of Josiah king of Judah; They shall not lament for him, [saying], Ah my brother! or, Ah sister! they shall not lament for him, [saying], Ah lord! or, Ah his glory!";
hnv[18] = " Therefore thus says the LORD concerning Yehoiakim the son of Yoshiyahu, king of Yehudah: they shall not lament for him, [saying], Ah my brother! or, Ah sister! They shall not lament for him, [saying] Ah lord! or, Ah his glory!";
vul[18] = "propterea haec dicit Dominus ad Ioachim filium Iosiae regem Iuda non plangent eum vae frater et vae fratres non concrepabunt ei vae domine et vae inclite";
kjv[19] = "He shall be buried with the burial of an ass, drawn and cast forth beyond the gates of Jerusalem.";
rsv[19] = "With the burial of an ass he shall be buried, dragged and cast forth beyond the gates of Jerusalem.&quot;";
asv[19] = "He shall be buried with the burial of an ass, drawn and cast forth beyond the gates of Jerusalem.";
yng[19] = "The burial of an ass -- he is buried, Dragged and cast out thence to the gates of Jerusalem.";
dby[19] = "He shall be buried with the burial of an ass, dragged along and cast forth beyond the gates of Jerusalem.";
web[19] = "He shall be buried with the burial of an ass, drawn and cast forth beyond the gates of Jerusalem.";
hnv[19] = "He shall be buried with the burial of a donkey, drawn and cast forth beyond the gates of Yerushalayim.";
vul[19] = "sepultura asini sepelietur putrefactus et proiectus extra portas Hierusalem";
kjv[20] = "Go up to Lebanon, and cry; and lift up thy voice in Bashan, and cry from the passages: for all thy lovers are destroyed.";
rsv[20] = "&quot;Go up to Lebanon, and cry out, and lift up your voice in Bashan; cry from Ab\'arim, for all your lovers are destroyed.";
asv[20] = "Go up to Lebanon, and cry; and lift up thy voice in Bashan, and cry from Abarim; for all thy lovers are destroyed.";
yng[20] = "Go up to Lebanon, and cry, And in Bashan give forth thy voice, And cry from Abarim, For destroyed have been all loving thee.";
dby[20] = "Go up to Lebanon, and cry; and give forth thy voice in Bashan, and cry from [the heights of] Abarim: for all thy lovers are destroyed.";
web[20] = "Go up to Lebanon, and cry; and lift up thy voice in Bashan, and cry from the passages: for all thy lovers are destroyed.";
hnv[20] = " Go up to Levanon, and cry; and lift up your voice in Bashan, and cry from `Avarimen; for all your lovers are destroyed.";
vul[20] = "ascende Libanum et clama et in Basan da vocem tuam et clama ad transeuntes quia contriti sunt omnes amatores tui";
kjv[21] = "I spake unto thee in thy prosperity; [but] thou saidst, I will not hear. This [hath been] thy manner from thy youth, that thou obeyedst not my voice.";
rsv[21] = "I spoke to you in your prosperity, but you said, \'I will not listen.\' This has been your way from your youth, that you have not obeyed my voice.";
asv[21] = "I spake unto thee in thy prosperity; but thou saidst, I will not hear. This hath been thy manner from thy youth, that thou obeyedst not my voice.";
yng[21] = "I have spoken unto thee in thine ease, Thou hast said, `I do not hearken,\' This [is] thy way from thy youth, For thou hast not hearkened to My voice.";
dby[21] = "I spoke unto thee in thy prosperity; [but] thou saidst, I will not hear. This hath been thy way from thy youth, that thou hearkenedst not unto my voice.";
web[21] = "I spoke to thee in thy prosperity; [but] thou saidest, I will not hear. This [hath been] thy manner from thy youth, that thou hast not obeyed my voice.";
hnv[21] = "I spoke to you in your prosperity; but you said, I will not hear. This has been your manner from your youth, that you didn\'t obey my voice.";
vul[21] = "locutus sum ad te in abundantia tua dixisti non audiam haec est via tua ab adulescentia tua quia non audisti vocem meam";
kjv[22] = "The wind shall eat up all thy pastors, and thy lovers shall go into captivity: surely then shalt thou be ashamed and confounded for all thy wickedness.";
rsv[22] = "The wind shall shepherd all your shepherds, and your lovers shall go into captivity; then you will be ashamed and confounded because of all your wickedness.";
asv[22] = "The wind shall feed all thy shepherds, and thy lovers shall go into captivity: surely then shalt thou be ashamed and confounded for all thy wickedness.";
yng[22] = "All thy friends consume doth wind, And thy lovers into captivity do go, Surely then thou art ashamed, And hast blushed for all thy wickedness.";
dby[22] = "The wind shall feed on all thy shepherds, and thy lovers shall go into captivity; surely, then shalt thou be ashamed and confounded for all thy wickedness.";
web[22] = "The wind shall eat up all thy pastors, and thy lovers shall go into captivity: surely then shalt thou be ashamed and confounded for all thy wickedness.";
hnv[22] = "The wind shall feed all your shepherds, and your lovers shall go into captivity: surely then shall you be ashamed and confounded for all your wickedness.";
vul[22] = "omnes pastores tuos pascet ventus et amatores tui in captivitatem ibunt et tunc confunderis et erubesces ab omni malitia tua";
kjv[23] = "O inhabitant of Lebanon, that makest thy nest in the cedars, how gracious shalt thou be when pangs come upon thee, the pain as of a woman in travail!";
rsv[23] = "O inhabitant of Lebanon, nested among the cedars, how you will groan when pangs come upon you, pain as of a woman in travail!&quot;";
asv[23] = "O inhabitant of Lebanon, that makest thy nest in the cedars, how greatly to be pitied shalt thou be when pangs come upon thee, the pain as of a woman in travail!";
yng[23] = "O dweller in Lebanon, making a nest among cedars, How gracious hast thou been when pangs come to thee, Pain -- as of a travailing woman.";
dby[23] = "Thou inhabitress of Lebanon, that makest thy nest in the cedars, how pitiful shalt thou be when pangs come upon thee, pain as of a woman in travail!";
web[23] = "O inhabitant of Lebanon, that makest thy nest in the cedars, how gracious shalt thou be when pangs come upon thee, the pain as of a woman in travail!";
hnv[23] = "Inhabitant of Levanon, who makes your nest in the cedars, how greatly to be pitied shall you be when pangs come on you, the pain as of a woman in travail!";
vul[23] = "quae sedes in Libano et nidificas in cedris quomodo congemuisti cum venissent tibi dolores quasi dolores parturientis";
kjv[24] = "[As] I live, saith the LORD, though Coniah the son of Jehoiakim king of Judah were the signet upon my right hand, yet would I pluck thee thence;";
rsv[24] = "&quot;As I live, says the LORD, though Coni\'ah the son of Jehoi\'akim, king of Judah, were the signet ring on my right hand, yet I would tear you off";
asv[24] = "As I live, saith Jehovah, though Coniah the son of Jehoiakim king of Judah were the signet upon my right hand, yet would I pluck thee thence;";
yng[24] = "I live -- an affirmation of Jehovah, Though Coniah son of Jehoiakim king of Judah Were a seal on My right hand, Surely thence I draw thee away,";
dby[24] = "[As] I live, saith Jehovah, though Coniah the son of Jehoiakim, the king of Judah, were a signet upon my right hand, yet will I pluck thee thence;";
web[24] = "[As] I live, saith the LORD, though Coniah the son of Jehoiakim king of Judah were the signet upon my right hand, yet would I pluck thee thence;";
hnv[24] = "As I live, says the LORD, though Konyahu the son of Yehoiakim king of Yehudah were the signet on my right hand, yet would I pluck you there;";
vul[24] = "vivo ego dicit Dominus quia si fuerit Iechonias filius Ioachim regis Iuda anulus in manu dextera mea inde avellam eum";
kjv[25] = "And I will give thee into the hand of them that seek thy life, and into the hand [of them] whose face thou fearest, even into the hand of Nebuchadrezzar king of Babylon, and into the hand of the Chaldeans.";
rsv[25] = "and give you into the hand of those who seek your life, into the hand of those of whom you are afraid, even into the hand of Nebuchadrez\'zar king of Babylon and into the hand of the Chalde\'ans.";
asv[25] = "and I will give thee into the hand of them that seek thy life, and into the hand of them of whom thou art afraid, even into the hand of Nebuchadrezzar king of Babylon, and into the hand of the Chaldeans.";
yng[25] = "And I have given thee into the hand of those seeking thy life, And into hands of which thou art afraid, Into the hand of Nebuchadrezzar king of Babylon, And into the hand of the Chaldeans.";
dby[25] = "and I will give thee into the hand of them that seek thy life, and into the hand of them before whom thou art afraid, even into the hand of Nebuchadrezzar king of Babylon, and into the hand of the Chaldeans.";
web[25] = "And I will give thee into the hand of them that seek thy life, and into the hand [of them] whose face thou fearest, even into the hand of Nebuchadnezzar king of Babylon, and into the hand of the Chaldeans.";
hnv[25] = "and I will give you into the hand of those who seek your life, and into the hand of them of whom you are afraid, even into the hand of Nevukhadretztzar king of Bavel, and into the hand of the Kasdim.";
vul[25] = "et dabo te in manu quaerentium animam tuam et in manu quorum tu formidas faciem et in manu Nabuchodonosor regis Babylonis et in manu Chaldeorum";
kjv[26] = "And I will cast thee out, and thy mother that bare thee, into another country, where ye were not born; and there shall ye die.";
rsv[26] = "I will hurl you and the mother who bore you into another country, where you were not born, and there you shall die.";
asv[26] = "And I will cast thee out, and thy mother that bare thee, into another country, where ye were not born; and there shall ye die.";
yng[26] = "And I have cast thee, And thy mother who bore thee, unto another country, Where ye were not born, and there do ye die.";
dby[26] = "And I will cast thee out, and thy mother that bare thee, into another country, where ye were not born; and there shall ye die.";
web[26] = "And I will cast thee out, and thy mother that bore thee, into another country, where ye were not born; and there shall ye die.";
hnv[26] = "I will cast you out, and your mother who bore you, into another country, where you were not born; and there shall you die.";
vul[26] = "et mittam te et matrem tuam quae genuit te in terram alienam in qua nati non estis ibique moriemini";
kjv[27] = "But to the land whereunto they desire to return, thither shall they not return.";
rsv[27] = "But to the land to which they will long to return, there they shall not return.&quot;";
asv[27] = "But to the land whereunto their soul longeth to return, thither shall they not return.";
yng[27] = "And to the land whither they are lifting up their soul to return, Thither they do not return.";
dby[27] = "And into the land whereunto they lift up their souls to return, thither shall they not return.";
web[27] = "But to the land to which they desire to return, thither shall they not return.";
hnv[27] = "But to the land whereunto their soul longs to return, there shall they not return.";
vul[27] = "et in terram ad quam ipsi levant animam suam ut revertantur illuc non revertentur";
kjv[28] = "[Is] this man Coniah a despised broken idol? [is he] a vessel wherein [is] no pleasure? wherefore are they cast out, he and his seed, and are cast into a land which they know not?";
rsv[28] = "Is this man Coni\'ah a despised, broken pot, a vessel no one cares for? Why are he and his children hurled and cast into a land which they do not know?";
asv[28] = "Is this man Coniah a despised broken vessel? is he a vessel wherein none delighteth? wherefore are they cast out, he and his seed, and are cast into the land which they know not?";
yng[28] = "A grief -- a despised broken thing -- is this man Coniah? A vessel in which there is no pleasure? Wherefore have they been cast up and down, He and his seed, Yea, they were cast on to a land that they knew not?";
dby[28] = "Is this man Coniah a despised broken vase? a vessel wherein is no delight? Wherefore are they thrown out, he and his seed, and are cast into a land which they know not?";
web[28] = "[Is] this man Coniah a despised broken idol? [is he] a vessel in which [is] no pleasure? why are they cast out, he and his seed, and are cast into a land which they know not?";
hnv[28] = "Is this man Konyahu a despised broken vessel? is he a vessel in which none delights? why are they cast out, he and his seed, and are cast into the land which they don\'t know?";
vul[28] = "numquid vas fictile atque contritum vir iste Iechonias numquid vas absque omni voluptate quare abiecti sunt ipse et semen eius et proiecti in terram quam ignoraverunt";
kjv[29] = "O earth, earth, earth, hear the word of the LORD.";
rsv[29] = "O land, land, land, hear the word of the LORD!";
asv[29] = "O earth, earth, earth, hear the word of Jehovah.";
yng[29] = "Earth, earth, earth, hear a word of Jehovah,";
dby[29] = "O earth, earth, earth, hear the word of Jehovah!";
web[29] = "O earth, earth, earth, hear the word of the LORD.";
hnv[29] = "O eretz, eretz, eretz, hear the word of the LORD.";
vul[29] = "terra terra terra audi sermonem Domini";
kjv[30] = "Thus saith the LORD, Write ye this man childless, a man [that] shall not prosper in his days: for no man of his seed shall prosper, sitting upon the throne of David, and ruling any more in Judah.";
rsv[30] = "Thus says the LORD: &quot;Write this man down as childless, a man who shall not succeed in his days; for none of his offspring shall succeed in sitting on the throne of David, and ruling again in Judah.&quot;";
asv[30] = "Thus saith Jehovah, Write ye this man childless, a man that shall not prosper in his days; for no more shall a man of his seed prosper, sitting upon the throne of David, and ruling in Judah.";
yng[30] = "Thus said Jehovah: Write ye this man childless, A man -- he doth not prosper in his days, For none of his seed doth prosper, Sitting on the throne of David, And ruling again in Judah!";
dby[30] = "Thus saith Jehovah: Write this man childless, a man that shall not prosper in his days; for no man of his seed shall prosper, sitting upon the throne of David, and ruling any more in Judah.";
web[30] = "Thus saith the LORD, Write ye this man childless, a man [that] shall not prosper in his days: for no man of his seed shall prosper, sitting upon the throne of David, and ruling any more in Judah.";
hnv[30] = "Thus says the LORD, Write you this man childless, a man who shall not prosper in his days; for no more shall a man of his seed prosper, sitting on the throne of David, and ruling in Yehudah.";
vul[30] = "haec dicit Dominus scribe virum istum sterilem virum qui in diebus suis non prosperabitur nec enim erit de semine eius vir qui sedeat super solium David et potestatem habeat ultra in Iuda";
