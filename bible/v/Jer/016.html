csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Do not marry or have sons or daughters in this place.";
csb[3] = "&quot;For this is what the LORD says concerning sons and daughters born in this place as well as concerning the mothers who bear them and the fathers who father them in this land:";
csb[4] = "&quot;They will die from deadly diseases. They will not be mourned or buried but will be like manure on the soil\'s surface. They will be finished off by sword and famine. Their corpses will become food for the birds of the sky and for the wild animals of the land.";
csb[5] = "&quot;For this is what the LORD says: Don\'t enter a house where a mourning feast is taking place. Don\'t go to lament or sympathize with them, for I have removed my peace from these people as well as my faithful love and compassion.&quot; This is the LORD\'s declaration.";
csb[6] = "&quot;Both great and small will die in this land without burial. No lament will be made for them, nor will anyone cut himself or shave his head for them.";
csb[7] = "&quot;Food won\'t be provided for the mourner to comfort him because of the dead. A consoling drink won\'t be given him for the loss of his father or mother.";
csb[8] = "&quot;Do not enter the house where feasting is taking place to sit with them to eat and drink.";
csb[9] = "&quot;For this is what the LORD of Armies, the God of Israel, says: I am about to eliminate from this place, before your very eyes and in your time, the sound of joy and gladness, the voice of the groom and the bride.";
csb[10] = "&quot;When you tell these people all these things, they will say to you, \'Why has the LORD declared all this terrible disaster against us? What is our iniquity? What is our sin that we have committed against the LORD our God? \'";
csb[11] = "&quot;Then you will answer them, \'Because your fathers abandoned me -- this is the LORD\'s declaration -- and followed other gods, served them, and bowed in worship to them. Indeed, they abandoned me and did not keep my instruction.";
csb[12] = "&quot;You did more evil than your fathers. Look, each one of you was following the stubbornness of his evil heart, not obeying me.";
csb[13] = "&quot;So I will hurl you from this land into a land that you and your fathers are not familiar with. There you will worship other gods both day and night, for I will not grant you grace.\'";
csb[14] = "&quot;However, look, the days are coming&quot; -- the LORD\'s declaration -- &quot;when it will no longer be said, \'As the LORD lives who brought the Israelites from the land of Egypt,\'";
csb[15] = "&quot;but rather, \'As the LORD lives who brought the Israelites from the land of the north and from all the other lands where he had banished them.\' For I will return them to their land that I gave to their ancestors.";
csb[16] = "&quot;I am about to send for many fishermen&quot; -- this is the LORD\'s declaration -- &quot;and they will fish for them. Then I will send for many hunters, and they will hunt them down on every mountain and hill and out of the clefts of the rocks,";
csb[17] = "&quot;for my gaze takes in all their ways. They are not concealed from me, and their iniquity is not hidden from my sight.";
csb[18] = "&quot;I will first repay them double for their iniquity and sin because they have polluted my land. They have filled my inheritance with the carcasses of their abhorrent and detestable idols.&quot;";
csb[19] = "LORD, my strength and my stronghold, my refuge in a time of distress, the nations will come to you from the ends of the earth, and they will say, &quot;Our fathers inherited only lies, worthless idols of no benefit at all.&quot;";
csb[20] = "Can one make gods for himself? But they are not gods.";
csb[21] = "&quot;Therefore, I am about to inform them, and this time I will make them know my power and my might; then they will know that my name is the LORD.&quot;";

kjv[4] = "They shall die of grievous deaths; they shall not be lamented; neither shall they be buried; [but] they shall be as dung upon the face of the earth: and they shall be consumed by the sword, and by famine; and their carcases shall be meat for the fowls of heaven, and for the beasts of the earth.";
rsv[4] = "They shall die of deadly diseases. They shall not be lamented, nor shall they be buried; they shall be as dung on the surface of the ground. They shall perish by the sword and by famine, and their dead bodies shall be food for the birds of the air and for the beasts of the earth.";
asv[4] = "They shall die grievous deaths: they shall not be lamented, neither shall they be buried; they shall be as dung upon the face of the ground; and they shall be consumed by the sword, and by famine; and their dead bodies shall be food for the birds of the heavens, and for the beasts of the earth.";
yng[4] = "Of painful deaths they die, They are not lamented, nor are they buried, For dung on the face of the ground they are, And by sword and by famine are consumed, And their carcase hath been for food To the fowl of the heavens, And to the beast of the earth.";

rsv[17] = "For my eyes are upon all their ways; they are not hid from me, nor is their iniquity concealed from my eyes.";
asv[17] = "For mine eyes are upon all their ways; they are not hid from my face, neither is their iniquity concealed from mine eyes.";
yng[17] = "For Mine eyes [are] upon all their ways, They have not been hidden from My face, Nor hath their iniquity been concealed from before Mine eyes.";
dby[17] = "For mine eyes are upon all their ways; they are not concealed from my face, neither is their iniquity hidden from before mine eyes.";
web[17] = "For my eyes [are] upon all their ways: they are not hid from my face, neither is their iniquity hid from my eyes.";
hnv[17] = "For my eyes are on all their ways; they are not hidden from my face, neither is their iniquity concealed from my eyes.";
vul[17] = "quia oculi mei super omnes vias eorum non sunt absconditae a facie mea et non fuit occulta iniquitas eorum ab oculis meis";
kjv[18] = "And first I will recompense their iniquity and their sin double; because they have defiled my land, they have filled mine inheritance with the carcases of their detestable and abominable things.";
rsv[18] = "And I will doubly recompense their iniquity and their sin, because they have polluted my land with the carcasses of their detestable idols, and have filled my inheritance with their abominations.&quot;";
asv[18] = "And first I will recompense their iniquity and their sin double, because they have polluted my land with the carcasses of their detestable things, and have filled mine inheritance with their abominations.";
yng[18] = "And I have recompensed a first -- A second time -- their iniquity and their sin, Because of their polluting My land, With the carcase of their detestable things, Yea, their abominable things have filled Mine inheritance.";
dby[18] = "But first I will recompense their iniquity and their sin double, because they have profaned my land with the carcases of their detestable things, and with their abominations have they filled mine inheritance.";
web[18] = "And first I will recompense their iniquity and their sin double; because they have defiled my land, they have filled my inheritance with the carcasses of their detestable and abominable things.";
hnv[18] = "First I will recompense their iniquity and their sin double, because they have polluted my land with the carcasses of their detestable things, and have filled my inheritance with their abominations.";
vul[18] = "et reddam primum duplices iniquitates et peccata eorum quia contaminaverunt terram meam in morticinis idolorum suorum et abominationibus suis impleverunt hereditatem meam";
kjv[19] = "O LORD, my strength, and my fortress, and my refuge in the day of affliction, the Gentiles shall come unto thee from the ends of the earth, and shall say, Surely our fathers have inherited lies, vanity, and [things] wherein [there is] no profit.";
rsv[19] = "O LORD, my strength and my stronghold, my refuge in the day of trouble, to thee shall the nations come from the ends of the earth and say: &quot;Our fathers have inherited nought but lies, worthless things in which there is no profit.";
asv[19] = "O Jehovah, my strength, and my stronghold, and my refuge in the day of affliction, unto thee shall the nations come from the ends of the earth, and shall say, Our fathers have inherited nought but lies, [even] vanity and things wherein there is no profit.";
yng[19] = "O Jehovah, my strength, and my fortress, And my refuge in a day of adversity, Unto Thee nations do come from the ends of earth, And say, Only falsehood did our fathers inherit, Vanity, and none among them is profitable.";
dby[19] = "Jehovah, my strength and my fortress, and my refuge in the day of distress, unto thee shall the nations come from the ends of the earth, and they shall say, Surely our fathers have inherited falsehood [and] vanity; and in these things there is no profit.";
web[19] = "O LORD, my strength and my fortress, and my refuge in the day of affliction, the Gentiles shall come to thee from the ends of the earth, and shall say, Surely our fathers have inherited lies, vanity, and [things] in which [there is] no profit.";
hnv[19] = "LORD, my strength, and my stronghold, and my refuge in the day of affliction, to you shall the nations come from the ends of the eretz, and shall say, Our fathers have inherited nothing but lies, [even] vanity and things in which there is no profit.";
vul[19] = "Domine fortitudo mea et robur meum et refugium meum in die tribulationis ad te gentes venient ab extremis terrae et dicent vere mendacium possederunt patres nostri vanitatem quae eis non profuit";
kjv[20] = "Shall a man make gods unto himself, and they [are] no gods?";
rsv[20] = "Can man make for himself gods? Such are no gods!&quot;";
asv[20] = "Shall a man make unto himself gods, which yet are no gods?";
yng[20] = "Doth man make for himself gods, And they -- no gods?";
dby[20] = "Shall a man make gods unto himself, and they are no-gods?";
web[20] = "Shall a man make gods to himself, and they [are] no gods?";
hnv[20] = " Shall a man make to himself gods, which yet are no gods?";
vul[20] = "numquid faciet sibi homo deos et ipsi non sunt dii";
kjv[21] = "Therefore, behold, I will this once cause them to know, I will cause them to know mine hand and my might; and they shall know that my name [is] The LORD.";
rsv[21] = "&quot;Therefore, behold, I will make them know, this once I will make them know my power and my might, and they shall know that my name is the LORD.&quot;";
asv[21] = "Therefore, behold, I will cause them to know, this once will I cause them to know my hand and my might; and they shall know that my name is Jehovah.";
yng[21] = "Therefore, lo, I am causing them to know at this time, I cause them to know My hand and My might, And they have known that My name [is] Jehovah!";
dby[21] = "Therefore, behold, I will this once cause them to know, I will cause them to know my hand and my might; and they shall know that my name is Jehovah.";
web[21] = "Therefore behold, I will this once cause them to know, I will cause them to know my hand and my might; and they shall know that my name [is] JEHOVAH.";
hnv[21] = " Therefore, behold, I will cause them to know, this once will I cause them to know my hand and my might; and they shall know that my name is the LORD.";
