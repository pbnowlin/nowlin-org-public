csb[1] = "About the Ammonites, this is what the LORD says: Does Israel have no sons? Is he without an heir? Why then has Milcom dispossessed Gad and his people settled in their cities?";
csb[2] = "Therefore look, the days are coming -- this is the LORD\'s declaration -- when I will make the shout of battle heard against Rabbah of the Ammonites. It will become a desolate mound, and its surrounding villages will be set on fire. Israel will dispossess their dispossessors, says the LORD.";
csb[3] = "Wail, Heshbon, for Ai is devastated; cry out, daughters of Rabbah! Clothe yourselves with sackcloth, and lament; run back and forth within your walls, because Milcom will go into exile together with his priests and officials.";
csb[4] = "Why do you boast about your valleys, your flowing valley, you faithless daughter -- you who trust in your treasures and say, &quot;Who can attack me? &quot;";
csb[5] = "Look, I am about to bring terror on you -- this is the declaration of the Lord GOD of Armies -- from all those around you. You will be banished, each person headlong, with no one to gather up the fugitives.";
csb[6] = "But after that, I will restore the fortunes of the Ammonites. This is the LORD\'s declaration.";
csb[7] = "About Edom, this is what the LORD of Armies says: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom rotted away?";
csb[8] = "Run! Turn back! Lie low, residents of Dedan, for I will bring Esau\'s calamity on him at the time I punish him.";
csb[9] = "If grape harvesters came to you, wouldn\'t they leave some gleanings? Were thieves to come in the night, they would destroy only what they wanted.";
csb[10] = "But I will strip Esau bare; I will uncover his secret places. He will try to hide, but he will be unable. His descendants will be destroyed along with his relatives and neighbors. He will exist no longer.";
csb[11] = "Abandon your fatherless; I will preserve them; let your widows trust in me.";
csb[12] = "For this is what the LORD says: &quot;If those who do not deserve to drink the cup must drink it, can you possibly remain unpunished? You will not remain unpunished, for you must drink it too.";
csb[13] = "&quot;For by myself I have sworn&quot; -- this is the LORD\'s declaration -- &quot;Bozrah will become a desolation, a disgrace, a ruin, and an example for cursing, and all its surrounding cities will become ruins forever.&quot;";
csb[14] = "I have heard an envoy from the LORD; a messenger has been sent among the nations: Assemble yourselves to come against her. Rise up for war!";
csb[15] = "I will certainly make you insignificant among the nations, despised among humanity.";
csb[16] = "As to the terror you cause, your arrogant heart has deceived you. You who live in the clefts of the rock, you who occupy the mountain summit, though you elevate your nest like the eagles, even from there I will bring you down. This is the LORD\'s declaration.";
csb[17] = "&quot;Edom will become a desolation. Everyone who passes by her will be appalled and scoff because of all her wounds.";
csb[18] = "&quot;As when Sodom and Gomorrah were overthrown along with their neighbors,&quot; says the LORD, &quot;no one will live there; no human being will stay in it even temporarily.";
csb[19] = "&quot;Look, it will be like a lion coming from the thickets of the Jordan to the watered grazing land. I will chase Edom away from her land in a flash. I will appoint whoever is chosen for her. For who is like me? Who will issue me a summons? Who is the shepherd who can stand against me? &quot;";
csb[20] = "Therefore, hear the plans that the LORD has drawn up against Edom and the strategies he has devised against the people of Teman: The flock\'s little lambs will certainly be dragged away, and their grazing land will be made desolate because of them.";
csb[21] = "At the sound of their fall the earth will quake; the sound of her cry will be heard at the Red Sea.";
csb[22] = "Look! It will be like an eagle soaring upward, then swooping down and spreading its wings over Bozrah. In that day the hearts of Edom\'s warriors will be like the heart of a woman with contractions.";
csb[23] = "About Damascus: Hamath and Arpad are put to shame, for they have heard a bad report and are agitated, like the anxious sea that cannot be calmed.";
csb[24] = "Damascus has become weak; she has turned to run; panic has gripped her. Distress and labor pains have seized her like a woman in labor.";
csb[25] = "How can the city of praise not be abandoned, the town that brings me joy?";
csb[26] = "Therefore, her young men will fall in her public squares; all the warriors will perish in that day. This is the declaration of the LORD of Armies.";
csb[27] = "I will set fire to the wall of Damascus; it will consume Ben-hadad\'s citadels.";
csb[28] = "About Kedar and the kingdoms of Hazor, which King Nebuchadnezzar of Babylon defeated, this is what the LORD says: Rise up, attack Kedar, and destroy the people of the east!";
csb[29] = "They will take their tents and their flocks along with their tent curtains and all their equipment. They will take their camels for themselves. They will call out to them, &quot;Terror is on every side! &quot;";
csb[30] = "Run! Escape quickly! Lie low, residents of Hazor -- this is the LORD\'s declaration -- for King Nebuchadnezzar of Babylon has drawn up a plan against you; he has devised a strategy against you.";
csb[31] = "Rise up, attack a nation at ease, one living in security. This is the LORD\'s declaration. They have no doors, not even a gate bar; they live alone.";
csb[32] = "Their camels will become plunder, and their massive herds of cattle will become spoil. I will scatter them to the wind in every direction, those who clip the hair on their temples; I will bring calamity on them across all their borders. This is the LORD\'s declaration.";
csb[33] = "Hazor will become a jackals\' den, a desolation forever. No one will live there; no human being will stay in it even temporarily.";
csb[34] = "This is the word of the LORD that came to the prophet Jeremiah about Elam at the beginning of the reign of King Zedekiah of Judah.";
csb[35] = "This is what the LORD of Armies says: I am about to shatter Elam\'s bow, the source of their might.";
csb[36] = "I will bring the four winds against Elam from the four corners of the heavens, and I will scatter them to all these winds. There will not be a nation to which Elam\'s banished ones will not go.";
csb[37] = "I will devastate Elam before their enemies, before those who intend to take their lives. I will bring disaster on them, my burning anger. This is the LORD\'s declaration. I will send the sword after them until I finish them off.";
csb[38] = "I will set my throne in Elam, and I will destroy the king and officials from there. This is the LORD\'s declaration.";
csb[39] = "Yet, in the last days, I will restore the fortunes of Elam. This is the LORD\'s declaration.";

kjv[16] = "Thy terribleness hath deceived thee, [and] the pride of thine heart, O thou that dwellest in the clefts of the rock, that holdest the height of the hill: though thou shouldest make thy nest as high as the eagle, I will bring thee down from thence, saith the LORD.";
rsv[16] = "The horror you inspire has deceived you, and the pride of your heart, you who live in the clefts of the rock, who hold the height of the hill. Though you make your nest as high as the eagle\'s, I will bring you down from there, says the LORD.";
asv[16] = "As for thy terribleness, the pride of thy heart hath deceived thee, O thou that dwellest in the clefts of the rock, that holdest the height of the hill: though thou shouldest make thy nest as high as the eagle, I will bring thee down from thence, saith Jehovah.";
yng[16] = "Thy terribleness hath lifted thee up, The pride of thy heart, O dweller in clefts of the rock, Holding the high place of the height, For thou makest high as an eagle thy nest, From thence I bring thee down, An affirmation of Jehovah.";
dby[16] = "Thy terribleness, the pride of thy heart, hath deceived thee, thou that dwellest in the clefts of the rock, that holdest the height of the hill. Though thou shouldest make thy nest high as the eagle, I will bring thee down from thence, saith Jehovah.";
web[16] = "Thy terribleness hath deceived thee, [and] the pride of thy heart, O thou that dwellest in the clefts of the rock, that holdest the hight of the hill: though thou shouldst make thy nest as high as the eagle, I will bring thee down from thence, saith the LORD.";
hnv[16] = "As for your terror, the pride of your heart has deceived you, O you who dwell in the clefts of the rock, who hold the height of the hill: though you should make your nest as high as the eagle, I will bring you down from there, says the LORD.";
vul[16] = "arrogantia tua decepit te et superbia cordis tui qui habitas in cavernis petrae et adprehendere niteris altitudinem collis cum exaltaveris quasi aquila nidum tuum inde detraham te dicit Dominus";
kjv[17] = "Also Edom shall be a desolation: every one that goeth by it shall be astonished, and shall hiss at all the plagues thereof.";
rsv[17] = "&quot;Edom shall become a horror; every one who passes by it will be horrified and will hiss because of all its disasters.";
asv[17] = "And Edom shall become an astonishment: every one that passeth by it shall be astonished, and shall hiss at all the plagues thereof.";
yng[17] = "And Edom hath been for a desolation, Every passer by her is astonished, And doth hiss because of all her plagues.";
dby[17] = "And Edom shall be an astonishment: every one that goeth by it shall be astonished, and shall hiss, because of all the plagues thereof.";
web[17] = "Also Edom shall be a desolation: every one that goeth by it shall be astonished, and shall hiss at all her plagues.";
hnv[17] = "Edom shall become an astonishment: everyone who passes by it shall be astonished, and shall hiss at all the plagues of it.";
vul[17] = "et erit Idumea deserta omnis qui transibit per eam stupebit et sibilabit super omnes plagas eius";
kjv[18] = "As in the overthrow of Sodom and Gomorrah and the neighbour [cities] thereof, saith the LORD, no man shall abide there, neither shall a son of man dwell in it.";
rsv[18] = "As when Sodom and Gomor\'rah and their neighbor cities were overthrown, says the LORD, no man shall dwell there, no man shall sojourn in her.";
asv[18] = "As in the overthrow of Sodom and Gomorrah and the neighbor cities thereof, saith Jehovah, no man shall dwell there, neither shall any son of man sojourn therein.";
yng[18] = "As the overthrow of Sodom and Gomorrah, And its neighbours, said Jehovah, No one doth dwell there, Nor sojourn in her doth a son of man.";
dby[18] = "As in the overthrow of Sodom and Gomorrah, and their neighbour cities, saith Jehovah, no one shall dwell there, neither shall a son of man sojourn therein.";
web[18] = "As in the overthrow of Sodom and Gomorrah and the neighboring [cities], saith the LORD, no man shall abide there, neither shall a son of man dwell in it.";
hnv[18] = "As in the overthrow of Sedom and `Amorah and the neighbor cities of it, says the LORD, no man shall dwell there, neither shall any son of man sojourn therein.";
vul[18] = "sicuti subversa est Sodoma et Gomorra et vicinae eius ait Dominus non habitabit ibi vir et non incolet eam filius hominis";
kjv[19] = "Behold, he shall come up like a lion from the swelling of Jordan against the habitation of the strong: but I will suddenly make him run away from her: and who [is] a chosen [man, that] I may appoint over her? for who [is] like me? and who will appoint me the time? and who [is] that shepherd that will stand before me?";
rsv[19] = "Behold, like a lion coming up from the jungle of the Jordan against a strong sheepfold, I will suddenly make them run away from her; and I will appoint over her whomever I choose. For who is like me? Who will summon me? What shepherd can stand before me?";
asv[19] = "Behold, he shall come up like a lion from the pride of the Jordan against the strong habitation: for I will suddenly make them run away from it; and whoso is chosen, him will I appoint over it: for who is like me? and who will appoint me a time? and who is the shepherd that will stand before me?";
yng[19] = "Lo, as a lion he cometh up, Because of the rising of the Jordan, Unto the enduring habitation, But I cause to rest, I cause him to run from off her, And who is chosen? concerning her I lay a charge, For who is like Me? and who conveneth Me? And who [is] this shepherd who standeth before Me?";
dby[19] = "Behold, he shall come up like a lion from the swelling of the Jordan against the strong habitation; for I will make them suddenly run away from it; and who is a chosen [man] whom I shall appoint over her? For who is like me? and who will assign me a time? and who is that shepherd that will stand before me?";
web[19] = "Behold, he shall come up like a lion from the swelling of Jordan against the habitation of the strong: but I will suddenly make him run away from her: and who [is] a chosen [man], [that] I may appoint over her? for who [is] like me? and who will appoint me the time? and who [is] that shepherd that will stand before me?";
hnv[19] = "Behold, he shall come up like a lion from the pride of the Yarden against the strong habitation: for I will suddenly make them run away from it; and whoever is chosen, him will I appoint over it: for who is like me? and who will appoint me a time? and who is the shepherd who will stand before me?";
vul[19] = "ecce quasi leo ascendet de superbia Iordanis ad pulchritudinem robustam quia subito currere eum faciam ad illam et quis erit electus quem praeponam ei quis enim similis mei et quis sustinebit me et quis est iste pastor qui resistat vultui meo";
kjv[20] = "Therefore hear the counsel of the LORD, that he hath taken against Edom; and his purposes, that he hath purposed against the inhabitants of Teman: Surely the least of the flock shall draw them out: surely he shall make their habitations desolate with them.";
rsv[20] = "Therefore hear the plan which the LORD has made against Edom and the purposes which he has formed against the inhabitants of Teman: Even the little ones of the flock shall be dragged away; surely their fold shall be appalled at their fate.";
asv[20] = "Therefore hear ye the counsel of Jehovah, that he hath taken against Edom; and his purposes, that he hath purposed against the inhabitants of Teman: Surely they shall drag them away, [even] the little ones of the flock; surely he shall make their habitation desolate over them.";
yng[20] = "Therefore, hear ye the counsel of Jehovah, That He hath counselled concerning Edom, And His devices that He hath devised Concerning the inhabitants of Teman: Drag them out do not little ones of the flock, Make desolate over them doth he not their habitation?";
dby[20] = "Therefore hear the counsel of Jehovah, which he hath taken against Edom, and his purposes which he hath purposed against the inhabitants of Teman: The little ones of the flock shall certainly draw them away; he shall certainly make their habitation desolate for them.";
web[20] = "Therefore hear the counsel of the LORD, that he hath taken against Edom; and his purposes, that he hath purposed against the inhabitants of Teman: surely the least of the flock shall draw them out: surely he shall make their habitations desolate with them.";
hnv[20] = "Therefore hear the counsel of the LORD, that he has taken against Edom; and his purposes, that he has purposed against the inhabitants of Teman: Surely they shall drag them away, [even] the little ones of the flock; surely he shall make their habitation desolate over them.";
vul[20] = "propterea audite consilium Domini quod iniit de Edom et cogitationes eius quas cogitavit de habitatoribus Theman si non deiecerint eos parvuli gregis nisi dissipaverint cum eis habitaculum eorum";
kjv[21] = "The earth is moved at the noise of their fall, at the cry the noise thereof was heard in the Red sea.";
rsv[21] = "At the sound of their fall the earth shall tremble; the sound of their cry shall be heard at the Red Sea.";
asv[21] = "The earth trembleth at the noise of their fall; there is a cry, the noise whereof is heard in the Red Sea.";
yng[21] = "From the noise of their fall hath the earth shaken, The cry -- at the sea of Suph is its voice heard.";
dby[21] = "The earth quaketh at the sound of their fall; there is a cry, the sound whereof is heard in the Red sea.";
web[21] = "The earth is moved at the noise of their fall, at the cry the noise of it was heard in the Red sea.";
hnv[21] = "The eretz trembles at the noise of their fall; there is a cry, the noise whereof is heard in the Sea of Suf.";
vul[21] = "a voce ruinae eorum commota est terra clamor in mari Rubro auditus est vocis eius";
kjv[22] = "Behold, he shall come up and fly as the eagle, and spread his wings over Bozrah: and at that day shall the heart of the mighty men of Edom be as the heart of a woman in her pangs.";
rsv[22] = "Behold, one shall mount up and fly swiftly like an eagle, and spread his wings against Bozrah, and the heart of the warriors of Edom shall be in that day like the heart of a woman in her pangs.&quot;";
asv[22] = "Behold, he shall come up and fly as the eagle, and spread out his wings against Bozrah: and the heart of the mighty men of Edom at that day shall be as the heart of a woman in her pangs.";
yng[22] = "Lo, as an eagle he cometh up, and flieth, And he spreadeth his wings over Bozrah, And the heart of the mighty of Edom hath been in that day, As the heart of a distressed woman!\'";
dby[22] = "Behold, he shall come up, and fly as an eagle, and spread forth his wings against Bozrah; and at that day the heart of the mighty men of Edom shall be as the heart of a woman in her pangs.";
web[22] = "Behold, he shall come up and fly as the eagle, and spread his wings over Bozrah: and at that day shall the heart of the mighty men of Edom be as the heart of a woman in her pangs.";
hnv[22] = "Behold, he shall come up and fly as the eagle, and spread out his wings against Botzrah: and the heart of the mighty men of Edom at that day shall be as the heart of a woman in her pangs.";
vul[22] = "ecce quasi aquila ascendet et evolabit et expandet alas suas super Bosram et erit cor fortium Idumeae in die illa quasi cor mulieris parturientis";
kjv[23] = "Concerning Damascus. Hamath is confounded, and Arpad: for they have heard evil tidings: they are fainthearted; [there is] sorrow on the sea; it cannot be quiet.";
rsv[23] = "Concerning Damascus. &quot;Hamath and Arpad are confounded, for they have heard evil tidings; they melt in fear, they are troubled like the sea which cannot be quiet.";
asv[23] = "Of Damascus. Hamath is confounded, and Arpad; for they have heard evil tidings, they are melted away: there is sorrow on the sea; it cannot be quiet.";
yng[23] = "Concerning Damascus: Ashamed hath been Hamath and Arpad, For an evil report they have heard, They have been melted, in the sea [is] sorrow, To be quiet it is not able.";
dby[23] = "Concerning Damascus. Hamath is put to shame, and Arpad; for they have heard evil tidings, they are melted away: there is distress on the sea; it cannot be quiet.";
web[23] = "Concerning Damascus. Hamath is confounded, and Arpad: for they have heard evil tidings: they are faint-hearted; [there is] sorrow on the sea; it cannot be quiet.";
hnv[23] = "Of Dammesek. Hamat is confounded, and Arpad; for they have heard evil news, they are melted away: there is sorrow on the sea; it can\'t be quiet.";
vul[23] = "ad Damascum confusa est Emath et Arfad quia auditum pessimum audierunt turbati sunt in mari sollicitudine quiescere non potuit";
kjv[24] = "Damascus is waxed feeble, [and] turneth herself to flee, and fear hath seized on [her]: anguish and sorrows have taken her, as a woman in travail.";
rsv[24] = "Damascus has become feeble, she turned to flee, and panic seized her; anguish and sorrows have taken hold of her, as of a woman in travail.";
asv[24] = "Damascus is waxed feeble, she turneth herself to flee, and trembling hath seized on her: anguish and sorrows have taken hold of her, as of a woman in travail.";
yng[24] = "Feeble hath been Damascus, She turned to flee, and fear strengthened her, Distress and pangs have seized her, as a travailing woman.";
dby[24] = "Damascus is grown feeble: she turneth herself to flee, and terror hath seized on her; trouble and sorrows have taken hold of her as of a woman in travail.";
web[24] = "Damascus hath become feeble, [and] turneth herself to flee, and fear hath seized on [her]: anguish and sorrows have taken her, as a woman in travail.";
hnv[24] = "Dammesek has grown feeble, she turns herself to flee, and trembling has seized on her: anguish and sorrows have taken hold of her, as of a woman in travail.";
vul[24] = "dissoluta est Damascus versa in fugam tremor adprehendit eam angustia et dolores tenuerunt eam quasi parturientem";

rsv[25] = "How the famous city is forsaken, the joyful city!";
asv[25] = "How is the city of praise not forsaken, the city of my joy?";
yng[25] = "How is it not left -- the city of praise, The city of my joy!";
dby[25] = "How is not the town of praise forsaken, the city of my joy!";
web[25] = "How is the city of praise not left, the city of my joy!";
hnv[25] = "How is the city of praise not forsaken, the city of my joy?";
vul[25] = "quomodo dereliquerunt civitatem laudabilem urbem laetitiae";
kjv[26] = "Therefore her young men shall fall in her streets, and all the men of war shall be cut off in that day, saith the LORD of hosts.";
rsv[26] = "Therefore her young men shall fall in her squares, and all her soldiers shall be destroyed in that day, says the LORD of hosts.";
asv[26] = "Therefore her young men shall fall in her streets, and all the men of war shall be brought to silence in that day, saith Jehovah of hosts.";
yng[26] = "Therefore fall do her young men in her broad places, And all the men of war are cut off in that day, An affirmation of Jehovah of Hosts.";
dby[26] = "Therefore shall her young men fall in her streets, and all the men of war be cut off in that day, saith Jehovah of hosts.";
web[26] = "Therefore her young men shall fall in her streets, and all the men of war shall be cut off in that day, saith the LORD of hosts.";
hnv[26] = "Therefore her young men shall fall in her streets, and all the men of war shall be brought to silence in that day, says the LORD of Hosts.";
vul[26] = "ideo cadent iuvenes eius in plateis eius et omnes viri proelii conticescent in die illa ait Dominus exercituum";
kjv[27] = "And I will kindle a fire in the wall of Damascus, and it shall consume the palaces of Benhadad.";
rsv[27] = "And I will kindle a fire in the wall of Damascus, and it shall devour the strongholds of Ben-ha\'dad.&quot;";
asv[27] = "And I will kindle a fire in the wall of Damascus, and it shall devour the palaces of Ben-hadad.";
yng[27] = "And I have kindled a fire against the wall of Damascus, And it consumed palaces of Ben-Hadad!\'";
dby[27] = "And I will kindle a fire in the wall of Damascus, and it shall consume the palaces of Ben-Hadad.";
web[27] = "And I will kindle a fire in the wall of Damascus, and it shall consume the palaces of Ben-hadad.";
hnv[27] = "I will kindle a fire in the wall of Dammesek, and it shall devour the palaces of Ben-Hadad.";
vul[27] = "et succendam ignem in muro Damasci et devorabit moenia Benadad";
kjv[28] = "Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite, thus saith the LORD; Arise ye, go up to Kedar, and spoil the men of the east.";
rsv[28] = "Concerning Kedar and the kingdoms of Hazor which Nebuchadrez\'zar king of Babylon smote. Thus says the LORD: &quot;Rise up, advance against Kedar! Destroy the people of the east!";
asv[28] = "Of Kedar, and of the kingdoms of Hazor, which Nebuchadrezzar king of Babylon smote. Thus saith Jehovah: Arise ye, go up to Kedar, and destroy the children of the east.";
yng[28] = "Concerning Kedar, and concerning the kingdoms of Hazor, that Nebuchadrezzar king of Babylon hath smitten: `Thus said Jehovah: Arise ye, go ye up unto Kedar, And spoil the sons of the east.";
dby[28] = "Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon smote. Thus saith Jehovah: Arise, go up to Kedar, and spoil the men of the east.";

hnv[28] = "Of Kedar, and of the kingdoms of Hatzor, which Nevukhadretztzar king of Bavel struck. Thus says the LORD: Arise you, go up to Kedar, and destroy the children of the east.";

rsv[29] = "Their tents and their flocks shall be taken, their curtains and all their goods; their camels shall be borne away from them, and men shall cry to them: \'Terror on every side!\'";
asv[29] = "Their tents and their flocks shall they take; they shall carry away for themselves their curtains, and all their vessels, and their camels; and they shall cry unto them, Terror on every side!";
yng[29] = "Their tents and their flock they do take, Their curtains, and all their vessels, And their camels, they bear away for themselves, And they called concerning them, Fear [is] round about.";
dby[29] = "Their tents and their flocks shall they take; their curtains and all their vessels, and their camels, shall they carry away for themselves; and they shall cry unto them, Terror on every side!";

rsv[30] = "Flee, wander far away, dwell in the depths, O inhabitants of Hazor! says the LORD. For Nebuchadrez\'zar king of Babylon has made a plan against you, and formed a purpose against you.";
asv[30] = "Flee ye, wander far off, dwell in the depths, O ye inhabitants of Hazor, saith Jehovah; for Nebuchadrezzar king of Babylon hath taken counsel against you, and hath conceived a purpose against you.";
yng[30] = "Flee, bemoan mightily, go deep to dwell, Ye inhabitants of Hazor -- an affirmation of Jehovah, For given counsel against you hath Nebuchadrezzar king of Babylon, Yea, he deviseth against them a device.";
dby[30] = "Flee, wander very far, dwell deep down, ye inhabitants of Hazor, saith Jehovah; for Nebuchadrezzar king of Babylon hath taken counsel against you, and hath conceived a purpose against you.";

kjv[31] = "Arise, get you up unto the wealthy nation, that dwelleth without care, saith the LORD, which have neither gates nor bars, [which] dwell alone.";
rsv[31] = "&quot;Rise up, advance against a nation at ease, that dwells securely, says the LORD, that has no gates or bars, that dwells alone.";
asv[31] = "Arise, get you up unto a nation that is at ease, that dwelleth without care, saith Jehovah; that have neither gates nor bars, that dwell alone.";
yng[31] = "Rise ye, go up unto a nation at rest, Dwelling confidently, an affirmation of Jehovah, It hath no two-leaved doors nor bar, Alone they do dwell.";
dby[31] = "Arise, get you up against the nation at ease, that dwelleth securely, saith Jehovah, which hath neither gates nor bars: they dwell alone.";
web[31] = "Arise, go up to the wealthy nation, that dwelleth without care, saith the LORD, which have neither gates nor bars, [which] dwell alone.";
hnv[31] = "Arise, go up to a nation that is at ease, that dwells without care, says the LORD; that have neither gates nor bars, that dwell alone.";

rsv[32] = "Their camels shall become booty, their herds of cattle a spoil. I will scatter to every wind those who cut the corners of their hair, and I will bring their calamity from every side of them, says the LORD.";
asv[32] = "And their camels shall be a booty, and the multitude of their cattle a spoil: and I will scatter unto all winds them that have the corners [of their hair] cut off; and I will bring their calamity from every side of them, saith Jehovah.";
yng[32] = "And their camels have been for a prey, And the multitude of their cattle for a spoil, And I have scattered them to every wind, Who cut off the corner [of the beard], And from all its passages I bring in their calamity, An affirmation of Jehovah.";

dby[33] = "And Hazor shall be a dwelling-place of jackals, a desolation for ever. No one shall dwell there, neither shall a son of man sojourn therein.";
