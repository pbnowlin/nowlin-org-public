csb[1] = "Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem. His mother\'s name was Hamutal daughter of Jeremiah; she was from Libnah.";
csb[2] = "Zedekiah did what was evil in the LORD\'s sight just as Jehoiakim had done.";
csb[3] = "Because of the LORD\'s anger, it came to the point in Jerusalem and Judah that he finally banished them from his presence. Then Zedekiah rebelled against the king of Babylon.";
csb[4] = "In the ninth year of Zedekiah\'s reign, on the tenth day of the tenth month, King Nebuchadnezzar of Babylon advanced against Jerusalem with his entire army. They laid siege to the city and built a siege wall against it all around.";
csb[5] = "The city was under siege until King Zedekiah\'s eleventh year.";
csb[6] = "By the ninth day of the fourth month the famine was so severe in the city that the common people had no food.";
csb[7] = "Then the city was broken into, and all the warriors fled. They left the city at night by way of the city gate between the two walls near the king\'s garden, though the Chaldeans surrounded the city. They made their way along the route to the Arabah.";
csb[8] = "The Chaldean army pursued the king and overtook Zedekiah in the plains of Jericho. Zedekiah\'s entire army left him and scattered.";
csb[9] = "The Chaldeans seized the king and brought him to the king of Babylon at Riblah in the land of Hamath, and he passed sentence on him.";
csb[10] = "At Riblah the king of Babylon slaughtered Zedekiah\'s sons before his eyes, and he also slaughtered the Judean commanders.";
csb[11] = "Then he blinded Zedekiah and bound him with bronze chains. The king of Babylon brought Zedekiah to Babylon, where he kept him in custody until his dying day.";
csb[12] = "On the tenth day of the fifth month -- which was the nineteenth year of King Nebuchadnezzar, king of Babylon -- Nebuzaradan, the captain of the guards, entered Jerusalem as the representative of the king of Babylon.";
csb[13] = "He burned the LORD\'s temple, the king\'s palace, all the houses of Jerusalem; he burned down all the great houses.";
csb[14] = "The whole Chaldean army with the captain of the guards tore down all the walls surrounding Jerusalem.";
csb[15] = "Nebuzaradan, the captain of the guards, deported some of the poorest of the people, as well as the rest of the people who remained in the city, the deserters who had defected to the king of Babylon, and the rest of the craftsmen.";
csb[16] = "But Nebuzaradan, the captain of the guards, left some of the poorest of the land to be vinedressers and farmers.";
csb[17] = "Now the Chaldeans broke into pieces the bronze pillars for the LORD\'s temple and the water carts and the bronze basin that were in the LORD\'s temple, and they carried all the bronze to Babylon.";
csb[18] = "They also took the pots, shovels, wick trimmers, sprinkling basins, dishes, and all the bronze articles used in the temple service.";
csb[19] = "The captain of the guards took away the bowls, firepans, sprinkling basins, pots, lampstands, pans, and drink offering bowls -- whatever was gold or silver.";
csb[20] = "As for the two pillars, the one basin, with the twelve bronze oxen under it, and the water carts that King Solomon had made for the LORD\'s temple, the weight of the bronze of all these articles was beyond measure.";
csb[21] = "One pillar was 27 feet tall, had a circumference of 18 feet, was hollow -- four fingers thick --";
csb[22] = "and had a bronze capital on top of it. One capital, encircled by bronze grating and pomegranates, stood 7 1/2 feet high. The second pillar was the same, with pomegranates.";
csb[23] = "Each capital had ninety-six pomegranates all around it. All the pomegranates around the grating numbered one hundred.";
csb[24] = "The captain of the guards also took away Seraiah the chief priest, Zephaniah the priest of the second rank, and the three doorkeepers.";
csb[25] = "From the city he took a court official who had been appointed over the warriors; seven trusted royal aides found in the city; the secretary of the commander of the army, who enlisted the people of the land for military duty; and sixty men from the common people who were found within the city.";
csb[26] = "Nebuzaradan, the captain of the guards, took them and brought them to the king of Babylon at Riblah.";
csb[27] = "The king of Babylon put them to death at Riblah in the land of Hamath. So Judah went into exile from its land.";
csb[28] = "These are the people Nebuchadnezzar deported: in the seventh year, 3,023 Jews;";
csb[29] = "in his eighteenth year, 832 people from Jerusalem;";
csb[30] = "in Nebuchadnezzar\'s twenty-third year, Nebuzaradan, the captain of the guards, deported 745 Jews. Altogether, 4,600 people were deported.";
csb[31] = "On the twenty-fifth day of the twelfth month of the thirty-seventh year of the exile of Judah\'s King Jehoiachin, King Evil-merodach of Babylon, in the first year of his reign, pardoned King Jehoiachin of Judah and released him from prison.";
csb[32] = "He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon.";
csb[33] = "So Jehoiachin changed his prison clothes, and he dined regularly in the presence of the king of Babylon for the rest of his life.";
csb[34] = "As for his allowance, a regular allowance was given to him by the king of Babylon, a portion for each day until the day of his death, for the rest of his life.";
kjv[1] = "Zedekiah [was] one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem. And his mother\'s name [was] Hamutal the daughter of Jeremiah of Libnah.";
rsv[1] = "Zedeki\'ah was twenty-one years old when he became king; and he reigned eleven years in Jerusalem. His mother\'s name was Hamu\'tal the daughter of Jeremiah of Libnah.";
asv[1] = "Zedekiah was one and twenty years old when he began to reign; and he reigned eleven years in Jerusalem: and his mother\'s name was Hamutal the daughter of Jeremiah of Libnah.";
yng[1] = "A son of twenty and one years [is] Zedekiah in his reigning, and eleven years he hath reigned in Jerusalem, and the name of his mother [is] Hamutal daughter of Jeremiah of Libnah.";
dby[1] = "Zedekiah was twenty-one years old when he began to reign; and he reigned eleven years in Jerusalem; and his mother\'s name was Hamutal, daughter of Jeremiah of Libnah.";
web[1] = "Zedekiah [was] one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem. And his mother\'s name [was] Hamutal, the daughter of Jeremiah of Libnah.";
hnv[1] = "Tzidkiyahu was twenty-one years old when he began to reign; and he reigned eleven years in Yerushalayim: and his mother\'s name was Hamutal the daughter of Yirmeyahu of Livna.";
vul[1] = "filius viginti et unius anni Sedecias cum regnare coepisset et undecim annis regnavit in Hierusalem et nomen matris eius Amithal filia Hieremiae de Lobna";
kjv[2] = "And he did [that which was] evil in the eyes of the LORD, according to all that Jehoiakim had done.";
rsv[2] = "And he did what was evil in the sight of the LORD, according to all that Jehoi\'akim had done.";
asv[2] = "And he did that which was evil in the sight of Jehovah, according to all that Jehoiakim had done.";
yng[2] = "and he doth the evil thing in the eyes of Jehovah, according to all that Jehoiakim hath done,";
dby[2] = "And he did evil in the sight of Jehovah, according to all that Jehoiakim had done.";
web[2] = "And he did [that which was] evil in the eyes of the LORD, according to all that Jehoiakim had done.";
hnv[2] = "He did that which was evil in the sight of the LORD, according to all that Yehoiakim had done.";
vul[2] = "et fecit malum in oculis Domini iuxta omnia quae fecerat Ioachim";
kjv[3] = "For through the anger of the LORD it came to pass in Jerusalem and Judah, till he had cast them out from his presence, that Zedekiah rebelled against the king of Babylon.";
rsv[3] = "Surely because of the anger of the LORD things came to such a pass in Jerusalem and Judah that he cast them out from his presence. And Zedeki\'ah rebelled against the king of Babylon.";
asv[3] = "For through the anger of Jehovah did it come to pass in Jerusalem and Judah, until he had cast them out from his presence. And Zedekiah rebelled against the king of Babylon.";
yng[3] = "for, because of the anger of Jehovah, it hath been in Jerusalem and Judah till He hath cast them from before His face, and Zedekiah doth rebel against the king of Babylon.";
dby[3] = "For, because the anger of Jehovah was against Jerusalem and Judah, until he had cast them out from his presence, Zedekiah rebelled against the king of Babylon.";
web[3] = "For through the anger of the LORD it came to pass in Jerusalem and Judah, till he had cast them out from his presence, that Zedekiah rebelled against the king of Babylon.";
hnv[3] = "For through the anger of the LORD did it happen in Yerushalayim and Yehudah, until he had cast them out from his presence. Tzidkiyahu rebelled against the king of Bavel.";
vul[3] = "quoniam furor Domini erat in Hierusalem et in Iuda usquequo proiceret eos a facie sua et recessit Sedecias a rege Babylonis";
kjv[4] = "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth [day] of the month, [that] Nebuchadrezzar king of Babylon came, he and all his army, against Jerusalem, and pitched against it, and built forts against it round about.";
rsv[4] = "And in the ninth year of his reign, in the tenth month, on the tenth day of the month, Nebuchadrez\'zar king of Babylon came with all his army against Jerusalem, and they laid siege to it and built siegeworks against it round about.";
asv[4] = "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadrezzar king of Babylon came, he and all his army, against Jerusalem, and encamped against it; and they built forts against it round about.";
yng[4] = "And it cometh to pass, in the ninth year of his reign, in the tenth month, in the tenth of the month, come hath Nebuchadrezzar king of Babylon -- he and all his force -- against Jerusalem, and they encamp against it, and build against it a fortification round about;";
dby[4] = "And it came to pass in the ninth year of his reign, in the tenth month, on the tenth of the month, [that] Nebuchadrezzar king of Babylon came, he and all his army, against Jerusalem; and they encamped against it, and built turrets against it round about.";
web[4] = "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth [day] of the month, [that] Nebuchadrezzar king of Babylon came, he and all his army, against Jerusalem, and encamped against it, and built forts against it on every side.";
hnv[4] = "It happened in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nevukhadretztzar king of Bavel came, he and all his army, against Yerushalayim, and encamped against it; and they built forts against it round about.";
vul[4] = "factum est autem in anno nono regni eius in mense decimo decima mensis venit Nabuchodonosor rex Babylonis ipse et omnis exercitus eius adversum Hierusalem et obsederunt eam et aedificaverunt contra eam munitiones in circuitu";
kjv[5] = "So the city was besieged unto the eleventh year of king Zedekiah.";
rsv[5] = "So the city was besieged till the eleventh year of King Zedeki\'ah.";
asv[5] = "So the city was besieged unto the eleventh year of king Zedekiah.";
yng[5] = "and the city cometh into siege till the eleventh year of king Zedekiah.";
dby[5] = "And the city was besieged until the eleventh year of king Zedekiah.";
web[5] = "So the city was besieged to the eleventh year of king Zedekiah.";
hnv[5] = "So the city was besieged to the eleventh year of king Tzidkiyahu.";
vul[5] = "et fuit civitas obsessa usque ad undecimum annum regis Sedeciae";
kjv[6] = "And in the fourth month, in the ninth [day] of the month, the famine was sore in the city, so that there was no bread for the people of the land.";
rsv[6] = "On the ninth day of the fourth month the famine was so severe in the city, that there was no food for the people of the land.";
asv[6] = "In the fourth month, in the ninth day of the month, the famine was sore in the city, so that there was no bread for the people of the land.";
yng[6] = "In the fourth month, in the ninth of the month, when the famine is severe in the city, and there hath been no bread for the people of the land,";
dby[6] = "In the fourth month, on the ninth of the month, the famine prevailed in the city, and there was no bread for the people of the land.";
web[6] = "And in the fourth month, in the ninth [day] of the month, the famine was severe in the city, so that there was no bread for the people of the land.";
hnv[6] = "In the fourth month, in the ninth day of the month, the famine was sore in the city, so that there was no bread for the people of the land.";
vul[6] = "mense autem quarto nona mensis obtinuit fames in civitate et non erant alimenta populo terrae";
kjv[7] = "Then the city was broken up, and all the men of war fled, and went forth out of the city by night by the way of the gate between the two walls, which [was] by the king\'s garden; (now the Chaldeans [were] by the city round about:) and they went by the way of the plain.";
rsv[7] = "Then a breach was made in the city; and all the men of war fled and went out from the city by night by the way of a gate between the two walls, by the king\'s garden, while the Chalde\'ans were round about the city. And they went in the direction of the Arabah.";
asv[7] = "Then a breach was made in the city, and all the men of war fled, and went forth out of the city by night by the way of the gate between the two walls, which was by the king\'s garden (now the Chaldeans were against the city round about); and they went toward the Arabah.";
yng[7] = "then is the city broken up, and all the men of war flee, and go forth from the city by night, the way of the gate between the two walls, that [is] by the king\'s garden -- and the Chaldeans [are] by the city round about -- and they go the way of the plain.";
dby[7] = "And the city was broken into: and all the men of war fled, and went forth out of the city by night, by the way of the gate between the two walls, which was by the king\'s garden (now the Chaldeans were near the city round about); and they went the way toward the plain.";
web[7] = "Then the city was broken up, and all the men of war fled, and went forth from the city by night by the way of the gate between the two walls, which [was] by the king\'s garden; (now the Chaldeans [were] by the city on all sides:) and they went by the way of the plain.";
hnv[7] = "Then a breach was made in the city, and all the men of war fled, and went forth out of the city by night by the way of the gate between the two walls, which was by the king\'s garden; (now the Kasdim were against the city round about;) and they went toward the `Aravah.";
vul[7] = "et disrupta est civitas et omnes viri bellatores fugerunt et exierunt de civitate nocte per viam portae quae est inter duos muros et ducit ad hortum regis Chaldeis obsidentibus urbem in gyro et abierunt per viam quae ducit in heremum";
kjv[8] = "But the army of the Chaldeans pursued after the king, and overtook Zedekiah in the plains of Jericho; and all his army was scattered from him.";
rsv[8] = "But the army of the Chalde\'ans pursued the king, and overtook Zedeki\'ah in the plains of Jericho; and all his army was scattered from him.";
asv[8] = "But the army of the Chaldeans pursued after the king, and overtook Zedekiah in the plains of Jericho; and all his army was scattered from him.";
yng[8] = "And the forces of the Chaldeans pursue after the king, and overtake Zedekiah in the plains of Jericho, and all his forces have been scattered from him,";
dby[8] = "And the army of the Chaldeans pursued after the king, and overtook Zedekiah in the plains of Jericho; and all his army was scattered from him.";
web[8] = "But the army of the Chaldeans pursued the king, and overtook Zedekiah in the plains of Jericho; and all his army was scattered from him.";
hnv[8] = "But the army of the Kasdim pursued after the king, and overtook Tzidkiyahu in the plains of Yericho; and all his army was scattered from him.";
vul[8] = "persecutus est autem exercitus Chaldeorum regem et adprehenderunt Sedeciam in deserto quod est iuxta Hiericho et omnis comitatus eius diffugit ab eo";
kjv[9] = "Then they took the king, and carried him up unto the king of Babylon to Riblah in the land of Hamath; where he gave judgment upon him.";
rsv[9] = "Then they captured the king, and brought him up to the king of Babylon at Riblah in the land of Hamath, and he passed sentence upon him.";
asv[9] = "Then they took the king, and carried him up unto the king of Babylon to Riblah in the land of Hamath; and he gave judgment upon him.";
yng[9] = "and they capture the king, and bring him up unto the king of Babylon to Riblah, in the land of Hamath, and he speaketh with him -- judgments.";
dby[9] = "And they took the king, and brought him up to the king of Babylon, unto Riblah in the land of Hamath, and he pronounced judgment upon him.";
web[9] = "Then they took the king, and carried him to the king of Babylon to Riblah in the land of Hamath; where he gave judgment upon him.";
hnv[9] = "Then they took the king, and carried him up to the king of Bavel to Rivlah in the land of Hamat; and he gave judgment on him.";
vul[9] = "cumque conprehendissent regem adduxerunt eum ad regem Babylonis in Reblatha quae est in terra Emath et locutus est ad eum iudicia";
kjv[10] = "And the king of Babylon slew the sons of Zedekiah before his eyes: he slew also all the princes of Judah in Riblah.";
rsv[10] = "The king of Babylon slew the sons of Zedeki\'ah before his eyes, and also slew all the princes of Judah at Riblah.";
asv[10] = "And the king of Babylon slew the sons of Zedekiah before his eyes: he slew also all the princes of Judah in Riblah.";
yng[10] = "And the king of Babylon slaughtereth the sons of Zedekiah before his eyes, and also all the princes of Judah hath he slaughtered in Riblah;";
dby[10] = "And the king of Babylon slaughtered the sons of Zedekiah before his eyes; and he slaughtered also all the princes of Judah in Riblah.";
web[10] = "And the king of Babylon slew the sons of Zedekiah before his eyes: he slew also all the princes of Judah in Riblah.";
hnv[10] = "The king of Bavel killed the sons of Tzidkiyahu before his eyes: he killed also all the princes of Yehudah in Rivlah.";
vul[10] = "et iugulavit rex Babylonis filios Sedeciae in oculis eius sed et omnes principes Iudae occidit in Reblatha";
kjv[11] = "Then he put out the eyes of Zedekiah; and the king of Babylon bound him in chains, and carried him to Babylon, and put him in prison till the day of his death.";
rsv[11] = "He put out the eyes of Zedeki\'ah, and bound him in fetters, and the king of Babylon took him to Babylon, and put him in prison till the day of his death.";
asv[11] = "And he put out the eyes of Zedekiah; and the king of Babylon bound him in fetters, and carried him to Babylon, and put him in prison till the day of his death.";
yng[11] = "and the eyes of Zedekiah he hath blinded, and he bindeth him in brazen fetters, and the king of Babylon bringeth him to Babylon, and putteth him in the house of inspection unto the day of his death.";
dby[11] = "And he put out the eyes of Zedekiah, and bound him with chains of brass; and the king of Babylon carried him to Babylon, and put him in prison till the day of his death.";
web[11] = "Then he put out the eyes of Zedekiah; and the king of Babylon bound him in chains, and carried him to Babylon, and put him in prison till the day of his death.";
hnv[11] = "He put out the eyes of Tzidkiyahu; and the king of Bavel bound him in fetters, and carried him to Bavel, and put him in prison until the day of his death.";
vul[11] = "et oculos Sedeciae eruit et vinxit eum conpedibus et adduxit eum rex Babylonis in Babylonem et posuit eum in domo carceris usque ad diem mortis eius";
kjv[12] = "Now in the fifth month, in the tenth [day] of the month, which [was] the nineteenth year of Nebuchadrezzar king of Babylon, came Nebuzaradan, captain of the guard, [which] served the king of Babylon, into Jerusalem,";
rsv[12] = "In the fifth month, on the tenth day of the month--which was the nineteenth year of King Nebuchadrez\'zar, king of Babylon--Nebu\'zarad\'an the captain of the bodyguard who served the king of Babylon, entered Jerusalem.";
asv[12] = "Now in the fifth month, in the tenth day of the month, which was the nineteenth year of king Nebuchadrezzar, king of Babylon, came Nebuzaradan the captain of the guard, who stood before the king of Babylon, into Jerusalem.";
yng[12] = "And in the fifth month, in the tenth of the month -- it [is] the nineteenth year of king Nebuchadrezzar king of Babylon -- come hath Nebuzar-Adan, chief of the executioners; he hath stood before the king of Babylon in Jerusalem,";
dby[12] = "And in the fifth month, on the tenth of the month, which was in the nineteenth year of Nebuchadrezzar king of Babylon, Nebuzar-adan, captain of the body-guard, who stood before the king of Babylon, came unto Jerusalem;";
web[12] = "Now in the fifth month, in the tenth [day] of the month, which [was] the nineteenth year of Nebuchadrezzar king of Babylon, came Nebuzar-adan, captain of the guard, [who] served the king of Babylon, into Jerusalem,";
hnv[12] = "Now in the fifth month, in the tenth day of the month, which was the nineteenth year of king Nevukhadretztzar, king of Bavel, came Nevuzar\'adan the captain of the guard, who stood before the king of Bavel, into Yerushalayim:";
vul[12] = "in mense autem quinto decima mensis ipse est annus nonusdecimus Nabuchodonosor regis Babylonis venit Nabuzardan princeps militiae qui stabat coram rege Babylonis in Hierusalem";
kjv[13] = "And burned the house of the LORD, and the king\'s house; and all the houses of Jerusalem, and all the houses of the great [men], burned he with fire:";
rsv[13] = "And he burned the house of the LORD, and the king\'s house and all the houses of Jerusalem; every great house he burned down.";
asv[13] = "And he burned the house of Jehovah, and the king\'s house; and all the houses of Jerusalem, even every great house, burned he with fire.";
yng[13] = "and he burneth the house of Jehovah, and the house of the king, and all the houses of Jerusalem, even every great house he hath burned with fire,";
dby[13] = "and he burned the house of Jehovah, and the king\'s house, and all the houses of Jerusalem; and every great [man\'s] house he burned with fire.";
web[13] = "And burned the house of the LORD, and the king\'s house; and all the houses of Jerusalem, and all the houses of the great [men] he burned with fire:";
hnv[13] = "and he burned the house of the LORD, and the king\'s house; and all the houses of Yerushalayim, even every great house, burned he with fire.";
vul[13] = "et incendit domum Domini et domum regis et omnes domos Hierusalem et omnem domum magnam igne conbusit";
kjv[14] = "And all the army of the Chaldeans, that [were] with the captain of the guard, brake down all the walls of Jerusalem round about.";
rsv[14] = "And all the army of the Chalde\'ans, who were with the captain of the guard, broke down all the walls round about Jerusalem.";
asv[14] = "And all the army of the Chaldeans, that were with the captain of the guard, brake down all the walls of Jerusalem round about.";
yng[14] = "and all the walls of Jerusalem round about broken down have all the forces of the Chaldeans that [are] with the chief of the executioners.";
dby[14] = "And all the army of the Chaldeans, that were with the captain of the body-guard, broke down all the walls of Jerusalem round about.";
web[14] = "And all the army of the Chaldeans, that [were] with the captain of the guard, broke down all the walls of Jerusalem on every side.";
hnv[14] = "All the army of the Kasdim, who were with the captain of the guard, broke down all the walls of Yerushalayim round about.";
vul[14] = "et totum murum Hierusalem per circuitum destruxit cunctus exercitus Chaldeorum qui erat cum magistro militiae";
kjv[15] = "Then Nebuzaradan the captain of the guard carried away captive [certain] of the poor of the people, and the residue of the people that remained in the city, and those that fell away, that fell to the king of Babylon, and the rest of the multitude.";
rsv[15] = "And Nebu\'zarad\'an the captain of the guard carried away captive some of the poorest of the people and the rest of the people who were left in the city and the deserters who had deserted to the king of Babylon, together with the rest of the artisans.";
asv[15] = "Then Nebuzaradan the captain of the guard carried away captive of the poorest of the people, and the residue of the people that were left in the city, and those that fell away, that fell to the king of Babylon, and the residue of the multitude.";
yng[15] = "And of the poor of the people, and the remnant of the people who are left in the city, and those who are falling away, who have fallen unto the king of Babylon, and the remnant of the multitude, hath Nebuzar-Adan chief of the executioners, removed;";
dby[15] = "And Nebuzar-adan the captain of the body-guard carried away captive of the poorest sort of the people, and the rest of the people that were left in the city, and the deserters that had deserted to the king of Babylon, and the rest of the multitude.";
web[15] = "Then Nebuzar-adan the captain of the guard carried away captive [certain] of the poor of the people, and the residue of the people that remained in the city, and those that fell away, that fell to the king of Babylon, and the rest of the multitude.";
hnv[15] = "Then Nevuzar\'adan the captain of the guard carried away captive of the poorest of the people, and the residue of the people who were left in the city, and those who fell away, who fell to the king of Bavel, and the residue of the multitude.";
vul[15] = "de pauperibus autem populi et de reliquo vulgo quod remanserat in civitate et de perfugis qui transfugerant ad regem Babylonis et ceteros de multitudine transtulit Nabuzardan princeps militiae";
kjv[16] = "But Nebuzaradan the captain of the guard left [certain] of the poor of the land for vinedressers and for husbandmen.";
rsv[16] = "But Nebu\'zarad\'an the captain of the guard left some of the poorest of the land to be vinedressers and plowmen.";
asv[16] = "But Nebuzaradan the captain of the guard left of the poorest of the land to be vinedressers and husbandmen.";
yng[16] = "and of the poor of the land hath Nebuzar-Adan, chief of the executioners, left for vine-dressers and for husbandmen.";
dby[16] = "But Nebuzar-adan the captain of the body-guard left of the poor of the land for vinedressers and for husbandmen.";
web[16] = "But Nebuzar-adan the captain of the guard left [certain] of the poor of the land for vine-dressers and for husbandmen.";
hnv[16] = "But Nevuzar\'adan the captain of the guard left of the poorest of the land to be vineyard keepers and farmers.";
vul[16] = "de pauperibus vero terrae reliquit Nabuzardan princeps militiae in vinitores et in agricolas";
kjv[17] = "Also the pillars of brass that [were] in the house of the LORD, and the bases, and the brasen sea that [was] in the house of the LORD, the Chaldeans brake, and carried all the brass of them to Babylon.";
rsv[17] = "And the pillars of bronze that were in the house of the LORD, and the stands and the bronze sea that were in the house of the LORD, the Chalde\'ans broke in pieces, and carried all the bronze to Babylon.";
asv[17] = "And the pillars of brass that were in the house of Jehovah, and the bases and the brazen sea that were in the house of Jehovah, did the Chaldeans break in pieces, and carried all the brass of them to Babylon.";
yng[17] = "And the pillars of brass that [are] to the house of Jehovah, and the bases, and the brasen sea that [is] in the house of Jehovah, have the Chaldeans broken, and they bear away all the brass of them to Babylon;";
dby[17] = "And the brazen pillars that were in the house of Jehovah, and the bases, and the brazen sea that was in the house of Jehovah, the Chaldeans broke up, and carried all the brass thereof to Babylon.";
web[17] = "Also the pillars of brass that [were] in the house of the LORD, and the bases, and the brazen sea that [was] in the house of the LORD, the Chaldeans broke, and carried all the brass of them to Babylon.";
hnv[17] = "The pillars of brass that were in the house of the LORD, and the bases and the brazen sea that were in the house of the LORD, did the Kasdim break in pieces, and carried all the brass of them to Bavel.";
vul[17] = "columnas quoque aereas quae erant in domo Domini et bases et mare aereum quod erat in domo Domini confregerunt Chaldei et tulerunt omne aes eorum in Babylonem";
kjv[18] = "The caldrons also, and the shovels, and the snuffers, and the bowls, and the spoons, and all the vessels of brass wherewith they ministered, took they away.";
rsv[18] = "And they took away the pots, and the shovels, and the snuffers, and the basins, and the dishes for incense, and all the vessels of bronze used in the temple service;";
asv[18] = "The pots also, and the shovels, and the snuffers, and the basins, and the spoons, and all the vessels of brass wherewith they ministered, took they away.";
yng[18] = "and the pots, and the shovels, and the snuffers, and the bowls, and the spoons, and all the vessels of brass with which they minister, they have taken away;";
dby[18] = "The pots also, and the shovels, and the knives, and the bowls, and the cups, and all the vessels of brass wherewith they ministered, they took away.";
web[18] = "The caldrons also, and the shovels, and the snuffers, and the bowls, and the spoons, and all the vessels of brass with which they ministered, they took away.";
hnv[18] = "The pots also, and the shovels, and the snuffers, and the basins, and the spoons, and all the vessels of brass with which they ministered, took they away.";
vul[18] = "et lebetas et creagras et psalteria et fialas et mortariola et omnia vasa aerea quae in ministerio fuerant tulerunt";
kjv[19] = "And the basons, and the firepans, and the bowls, and the caldrons, and the candlesticks, and the spoons, and the cups; [that] which [was] of gold [in] gold, and [that] which [was] of silver [in] silver, took the captain of the guard away.";
rsv[19] = "also the small bowls, and the firepans, and the basins, and the pots, and the lampstands, and the dishes for incense, and the bowls for libation. What was of gold the captain of the guard took away as gold, and what was of silver, as silver.";
asv[19] = "And the cups, and the firepans, and the basins, and the pots, and the candlesticks, and the spoons, and the bowls--that which was of gold, in gold, and that which was of silver, in silver,--the captain of the guard took away.";
yng[19] = "and the basins, and the fire-pans, and the bowls, and the pots, and the candlesticks, and the spoons, and the cups, the gold of that which [is] gold, and the silver of that which [is] silver, hath the chief of the executioners taken.";
dby[19] = "And the basons and the censers, and the bowls, and the pots, and the candlesticks, and the cups, and the goblets, that which was of gold in gold, and that which was of silver in silver, the captain of the body-guard took away.";
web[19] = "And the basins, and the fire-pans, and the bowls, and the caldrons, and the candlesticks, and the spoons, and the cups; [that] which [was] of gold [in] gold, and [that] which [was] of silver [in] silver, the captain of the guard took away.";
hnv[19] = "The cups, and the fire pans, and the basins, and the pots, and the menorot, and the spoons, and the bowls-that which was of gold, in gold, and that which was of silver, in silver,-the captain of the guard took away.";
vul[19] = "et hydrias et thymiamateria et urceos et pelves et candelabra et mortaria et cyatos quotquot aurea aurea et quotquot argentea argentea tulit magister militiae";
kjv[20] = "The two pillars, one sea, and twelve brasen bulls that [were] under the bases, which king Solomon had made in the house of the LORD: the brass of all these vessels was without weight.";
rsv[20] = "As for the two pillars, the one sea, the twelve bronze bulls which were under the sea, and the stands, which Solomon the king had made for the house of the LORD, the bronze of all these things was beyond weight.";
asv[20] = "The two pillars, the one sea, and the twelve brazen bulls that were under the bases, which king Solomon had made for the house of Jehovah--the brass of all these vessels was without weight.";
yng[20] = "The two pillars, the one sea, and the twelve brazen oxen that [are] beneath the bases, that king Solomon made for the house of Jehovah, there was no weighing of the brass of all these vessels.";
dby[20] = "The two pillars, the one sea, and the twelve brazen oxen that formed the bases, which king Solomon had made for the house of Jehovah: for the brass of all these vessels there was no weight.";
web[20] = "The two pillars, one sea, and twelve brazen bulls that [were] under the bases, which king Solomon had made in the house of the LORD: the brass of all these vessels was without weight.";
hnv[20] = " The two pillars, the one sea, and the twelve brazen bulls that were under the bases, which king Shlomo had made for the house of the LORD. The brass of all these vessels was without weight.";
vul[20] = "columnas duas et mare unum vitulos duodecim aereos qui erant sub basibus quas fecerat rex Salomon in domo Domini non erat pondus aeris omnium vasorum horum";
kjv[21] = "And [concerning] the pillars, the height of one pillar [was] eighteen cubits; and a fillet of twelve cubits did compass it; and the thickness thereof [was] four fingers: [it was] hollow.";
rsv[21] = "As for the pillars, the height of the one pillar was eighteen cubits, its circumference was twelve cubits, and its thickness was four fingers, and it was hollow.";
asv[21] = "And as for the pillars, the height of the one pillar was eighteen cubits; and a line of twelve cubits did compass it; and the thickness thereof was four fingers: it was hollow.";
yng[21] = "As to the pillars, eighteen cubits [is] the height of the one pillar, and a cord of twelve cubits doth compass it, and its thickness [is] four fingers hollow.";
dby[21] = "And as to the pillars: the height of one pillar was eighteen cubits, and a line of twelve cubits encompassed it; and the thickness thereof was four fingers: it was hollow.";
web[21] = "And [concerning] the pillars, the hight of one pillar [was] eighteen cubits; and a fillet of twelve cubits encompassed it; and the thickness of it [was] four fingers: [it was] hollow.";
hnv[21] = "As for the pillars, the height of the one pillar was eighteen cubits; and a line of twelve cubits did compass it; and the thickness of it was four fingers: it was hollow.";
vul[21] = "de columnis autem decem et octo cubiti altitudinis erant in columna una et funiculus duodecim cubitorum circuibat eam porro grossitudo eius quattuor digitorum et intrinsecus cava erat";
kjv[22] = "And a chapiter of brass [was] upon it; and the height of one chapiter [was] five cubits, with network and pomegranates upon the chapiters round about, all [of] brass. The second pillar also and the pomegranates [were] like unto these.";
rsv[22] = "Upon it was a capital of bronze; the height of the one capital was five cubits; a network and pomegranates, all of bronze, were upon the capital round about. And the second pillar had the like, with pomegranates.";
asv[22] = "And a capital of brass was upon it; and the height of the one capital was five cubits, with network and pomegranates upon the capital round about, all of brass: and the second pillar also had like unto these, and pomegranates.";
yng[22] = "And the chapiter upon it [is] of brass, and the height of the one chapiter [is] five cubits, and net-work and pomegranates [are] on the chapiter round about, the whole [is] of brass; and like these have the second pillar, and pomegranates.";
dby[22] = "And the capital upon it was brass, and the height of the one capital [was] five cubits; and the network and the pomegranates, upon the capital round about, all of brass; and similarly for the second pillar, and the pomegranates.";
web[22] = "And a capital of brass [was] upon it; and the hight of one capital [was] five cubits, with net-work and pomegranates upon the capitals around, all [of] brass. The second pillar also and the pomegranates [were] like to these.";
hnv[22] = "A capital of brass was on it; and the height of the one capital was five cubits, with network and pomegranates on the capital round about, all of brass: and the second pillar also had like these, and pomegranates.";
vul[22] = "et capitella super utramque aerea altitudo capitelli unius quinque cubitorum et retiacula et mala granata";
kjv[23] = "And there were ninety and six pomegranates on a side; [and] all the pomegranates upon the network [were] an hundred round about.";
rsv[23] = "There were ninety-six pomegranates on the sides; all the pomegranates were a hundred upon the network round about.";
asv[23] = "And there were ninety and six pomegranates on the sides; all the pomegranates were a hundred upon the network round about.";
yng[23] = "And the pomegranates are ninety and six on a side, all the pomegranates [are] a hundred on the net-work round about.";
dby[23] = "And there were ninety-six pomegranates on the [four] sides; all the pomegranates upon the network were a hundred round about.";
web[23] = "And there were ninety and six pomegranates on a side; [and] all the pomegranates upon the net-work [were] a hundred on all sides.";
hnv[23] = "There were ninety-six pomegranates on the sides; all the pomegranates were one hundred on the network round about.";
vul[23] = "nonaginta sex dependentia omnia mala granata centum retiaculis circumdabantur";
kjv[24] = "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:";
rsv[24] = "And the captain of the guard took Serai\'ah the chief priest, and Zephani\'ah the second priest, and the three keepers of the threshold;";
asv[24] = "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the threshold:";
yng[24] = "And the chief of the executioners taketh Seraiah the head priest, and Zephaniah the second priest, and the three keepers of the threshold,";
dby[24] = "And the captain of the body-guard took Seraiah the chief priest, and Zephaniah the second priest, and the three doorkeepers.";
web[24] = "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:";
hnv[24] = "The captain of the guard took Serayah the chief Kohen, and Tzefanyah the second Kohen, and the three keepers of the threshold:";
vul[24] = "et tulit magister militiae Saraiam sacerdotem primum et Sophoniam sacerdotem secundum et tres custodes vestibuli";
kjv[25] = "He took also out of the city an eunuch, which had the charge of the men of war; and seven men of them that were near the king\'s person, which were found in the city; and the principal scribe of the host, who mustered the people of the land; and threescore men of the people of the land, that were found in the midst of the city.";
rsv[25] = "and from the city he took an officer who had been in command of the men of war, and seven men of the king\'s council, who were found in the city; and the secretary of the commander of the army who mustered the people of the land; and sixty men of the people of the land, who were found in the midst of the city.";
asv[25] = "and out of the city he took an officer that was set over the men of war; and seven men of them that saw the king\'s face, that were found in the city; and the scribe of the captain of the host, who mustered the people of the land; and threescore men of the people of the land, that were found in the midst of the city.";
yng[25] = "and out of the city he hath taken a certain eunuch, who hath been inspector over the men of war, and seven men of those seeing the king\'s face, who have been found in the city, and the head scribe of the host, who mustereth the people of the land, and sixty men of the people of the land, who are found in the midst of the city;";
dby[25] = "And out of the city he took a eunuch that was set over the men of war, and seven men of them that were in the king\'s presence, who were found in the city, and the scribe of the captain of the host, who enrolled the people of the land. And sixty men of the people of the land that were found in the midst of the city.";
web[25] = "He took also out of the city a eunuch, who had the charge of the men of war; and seven men of them that were near the king\'s person, who were found in the city; and the principal scribe of the host, who mustered the people of the land; and sixty men of the people of the land, that were found in the midst of the city.";
hnv[25] = "and out of the city he took an officer who was set over the men of war; and seven men of those who saw the king\'s face, who were found in the city; and the Sofer of the captain of the host, who mustered the people of the land; and sixty men of the people of the land, who were found in the midst of the city.";
vul[25] = "et de civitate tulit eunuchum unum qui erat praepositus super viros bellatores et septem viros de his qui videbant faciem regis qui inventi sunt in civitate et scribam principem militum qui probabat tirones et sexaginta viros de populo terrae qui inventi sunt in medio civitatis";
kjv[26] = "So Nebuzaradan the captain of the guard took them, and brought them to the king of Babylon to Riblah.";
rsv[26] = "And Nebu\'zarad\'an the captain of the guard took them, and brought them to the king of Babylon at Riblah.";
asv[26] = "And Nebuzaradan the captain of the guard took them, and brought them to the king of Babylon to Riblah.";
yng[26] = "and Nebuzar-Adan, chief of the executioners, taketh them, and bringeth them unto the king of Babylon to Riblah,";
dby[26] = "And Nebuzar-adan the captain of the body-guard took them, and brought them to the king of Babylon to Riblah;";
web[26] = "So Nebuzar-adan the captain of the guard took them, and brought them to the king of Babylon to Riblah.";
hnv[26] = "Nevuzar\'adan the captain of the guard took them, and brought them to the king of Bavel to Rivlah.";
vul[26] = "tulit autem eos Nabuzardan magister militiae et duxit eos ad regem Babylonis in Reblatha";
kjv[27] = "And the king of Babylon smote them, and put them to death in Riblah in the land of Hamath. Thus Judah was carried away captive out of his own land.";
rsv[27] = "And the king of Babylon smote them, and put them to death at Riblah in the land of Hamath. So Judah was carried captive out of its land.";
asv[27] = "And the king of Babylon smote them, and put them to death at Riblah in the land of Hamath. So Judah was carried away captive out of his land.";
yng[27] = "and the king of Babylon smiteth them, and putteth them to death in Riblah, in the land of Hamath, and he removeth Judah from off its own ground.";
dby[27] = "and the king of Babylon smote them, and put them to death at Riblah in the land of Hamath. Thus Judah was carried away captive out of his land.";
web[27] = "And the king of Babylon smote them, and put them to death in Riblah, in the land of Hamath. Thus Judah was carried away captive out of his own land.";
hnv[27] = "The king of Bavel struck them, and put them to death at Rivlah in the land of Hamat. So Yehudah was carried away captive out of his land.";
vul[27] = "et percussit eos rex Babylonis et interfecit eos in Reblatha in terra Emath et translatus est Iuda de terra sua";
kjv[28] = "This [is] the people whom Nebuchadrezzar carried away captive: in the seventh year three thousand Jews and three and twenty:";
rsv[28] = "This is the number of the people whom Nebuchadrez\'zar carried away captive: in the seventh year, three thousand and twenty-three Jews;";
asv[28] = "This is the people whom Nebuchadrezzar carried away captive: in the seventh year three thousand Jews and three and twenty;";
yng[28] = "This [is] the people whom Nebuchadrezzar hath removed: in the seventh year, of Jews, three thousand and twenty and three;";
dby[28] = "This is the people whom Nebuchadrezzar carried away captive: in the seventh year three thousand and twenty-three Jews;";
web[28] = "This [is] the people whom Nebuchadrezzar carried away captive: in the seventh year three thousand Jews and three and twenty:";
hnv[28] = "This is the people whom Nevukhadretztzar carried away captive: in the seventh year three thousand twenty-three Yehudim;";
vul[28] = "iste est populus quem transtulit Nabuchodonosor in anno septimo Iudaeos tria milia et viginti tres";
kjv[29] = "In the eighteenth year of Nebuchadrezzar he carried away captive from Jerusalem eight hundred thirty and two persons:";
rsv[29] = "in the eighteenth year of Nebuchadrez\'zar he carried away captive from Jerusalem eight hundred and thirty-two persons;";
asv[29] = "in the eighteenth year of Nebuchadrezzar he carried away captive from Jerusalem eight hundred thirty and two persons;";
yng[29] = "in the eighteenth year of Nebuchadrezzar -- from Jerusalem, souls, eight hundred thirty and two;";
dby[29] = "in the eighteenth year of Nebuchadrezzar [he carried away captive] from Jerusalem eight hundred and thirty-two persons;";
web[29] = "In the eighteenth year of Nebuchadrezzar he carried away captive from Jerusalem eight hundred thirty and two persons:";
hnv[29] = "in the eighteenth year of Nevukhadretztzar he carried away captive from Yerushalayim eight hundred thirty-two persons;";
vul[29] = "in anno octavodecimo Nabuchodonosor de Hierusalem animas octingentas triginta duas";
kjv[30] = "In the three and twentieth year of Nebuchadrezzar Nebuzaradan the captain of the guard carried away captive of the Jews seven hundred forty and five persons: all the persons [were] four thousand and six hundred.";
rsv[30] = "in the twenty-third year of Nebuchadrez\'zar, Nebu\'zarad\'an the captain of the guard carried away captive of the Jews seven hundred and forty-five persons; all the persons were four thousand and six hundred.";
asv[30] = "in the three and twentieth year of Nebuchadrezzar Nebuzaradan the captain of the guard carried away captive of the Jews seven hundred forty and five persons: all the persons were four thousand and six hundred.";
yng[30] = "in the three and twentieth year of Nebuchadrezzar, hath Nebuzar-Adan chief of the guard removed of Jewish souls, seven hundred forty and five; all the souls [are] four thousand and six hundred.";
dby[30] = "in the twenty-third year of Nebuchadrezzar, Nebuzar-adan the captain of the body-guard carried away captive of the Jews seven hundred and forty-five persons: all the persons were four thousand six hundred.";
web[30] = "In the three and twentieth year of Nebuchadrezzar, Nebuzar-adan the captain of the guard carried away captive of the Jews seven hundred forty and five persons: all the persons [were] four thousand and six hundred.";
hnv[30] = "in the three and twentieth year of Nevukhadretztzar Nevuzar\'adan the captain of the guard carried away captive of the Yehudim seven hundred forty-five persons: all the persons were four thousand and six hundred.";
vul[30] = "in anno vicesimo tertio Nabuchodonosor transtulit Nabuzardan magister militiae Iudaeorum animas septingentas quadraginta quinque omnes ergo animae quattuor milia sescentae";
kjv[31] = "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, in the five and twentieth [day] of the month, [that] Evilmerodach king of Babylon in the [first] year of his reign lifted up the head of Jehoiachin king of Judah, and brought him forth out of prison,";
rsv[31] = "And in the thirty-seventh year of the captivity of Jehoi\'achin king of Judah, in the twelfth month, on the twenty-fifth day of the month, E\'vil-mer\'odach king of Babylon, in the year that he became king, lifted up the head of Jehoi\'achin king of Judah and brought him out of prison;";
asv[31] = "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, in the five and twentieth day of the month, that Evil-merodach king of Babylon, in the [first] year of his reign, lifted up the head of Jehoiachin king of Judah, and brought him forth out of prison;";
yng[31] = "And it cometh to pass, in the thirty and seventh year of the removal of Jehoiachin king of Judah, in the twelfth month, in the twenty and fifth of the month, hath Evil-Merodach king of Babylon lifted up, in the year of his reign, the head of Jehoiachin king of Judah, and bringeth him out from the house of restraint,";
dby[31] = "And it came to pass in the thirty-seventh year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the twenty-fifth of the month, [that] Evil-Merodach king of Babylon, in the year that he began to reign, lifted up the head of Jehoiachin king of Judah, and brought him forth out of prison;";
web[31] = "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, in the five and twentieth [day] of the month, [that] Evil-merodach king of Babylon in the [first] year of his reign lifted up the head of Jehoiachin king of Judah, and brought him out of prison,";
hnv[31] = "It happened in the seven and thirtieth year of the captivity of Yehoiakim king of Yehudah, in the twelfth month, in the five and twentieth day of the month, that Evil-Merodakh king of Bavel, in the [first] year of his reign, lifted up the head of Yehoiakim king of Yehudah, and brought him forth out of prison;";
vul[31] = "et factum est in tricesimo septimo anno transmigrationis Ioachim regis Iudae duodecimo mense vicesima quinta mensis elevavit Evilmerodach rex Babylonis ipso anno regni sui caput Ioachim regis Iudae et eduxit eum de domo carceris";
kjv[32] = "And spake kindly unto him, and set his throne above the throne of the kings that [were] with him in Babylon,";
rsv[32] = "and he spoke kindly to him, and gave him a seat above the seats of the kings who were with him in Babylon.";
asv[32] = "and he spake kindly to him, and set his throne above the throne of the kings that were with him in Babylon,";
yng[32] = "and speaketh with him good things, and setteth his throne above the throne of the kings who [are] with him in Babylon,";
dby[32] = "and he spoke kindly unto him, and set his seat above the seat of the kings that were with him in Babylon.";
web[32] = "And spoke kindly to him, and set his throne above the throne of the kings that [were] with him in Babylon,";
hnv[32] = "and he spoke kindly to him, and set his throne above the throne of the kings who were with him in Bavel,";
vul[32] = "et locutus est cum eo bona et posuit thronum eius super thronos regum qui erant post se in Babylone";
kjv[33] = "And changed his prison garments: and he did continually eat bread before him all the days of his life.";
rsv[33] = "So Jehoi\'achin put off his prison garments. And every day of his life he dined regularly at the king\'s table;";
asv[33] = "and changed his prison garments. And [Jehoiachin] did eat bread before him continually all the days of his life:";
yng[33] = "and he hath changed his prison garments, and he hath eaten bread before him continually, all the days of his life.";
dby[33] = "And he changed his prison garments; and he ate bread before him continually all the days of his life;";
web[33] = "And changed his prison garments: and he continually ate bread before him all the days of his life.";
hnv[33] = "and changed his prison garments. [Yehoiakim] ate bread before him continually all the days of his life:";
vul[33] = "et mutavit vestimenta carceris eius et comedebat panem coram eo semper cunctis diebus vitae suae";
kjv[34] = "And [for] his diet, there was a continual diet given him of the king of Babylon, every day a portion until the day of his death, all the days of his life.";
rsv[34] = "as for his allowance, a regular allowance was given him by the king according to his daily need, until the day of his death as long as he lived.";
asv[34] = "and for his allowance, there was a continual allowance given him by the king of Babylon, every day a portion until the day of his death, all the days of his life.";
yng[34] = "And his allowance -- a continual allowance -- hath been given to him by the king of Babylon, the matter of a day in its day, till the day of his death -- all days of his life.";
dby[34] = "and his allowance was a continual allowance given him by the king of Babylon, every day a portion until the day of his death, all the days of his life.";
web[34] = "And [for] his food there was a continual diet given him of the king of Babylon, every day a portion until the day of his death, all the days of his life.";
hnv[34] = "and for his allowance, there was a continual allowance given him by the king of Bavel, every day a portion until the day of his death, all the days of his life.";
vul[34] = "et cibaria eius cibaria perpetua dabantur ei a rege Babylonis statuta per singulos dies usque ad diem mortis suae cunctis diebus vitae eius";
