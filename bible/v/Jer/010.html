csb[1] = "Hear the word that the LORD has spoken to you, house of Israel.";
csb[2] = "This is what the LORD says: Do not learn the way of the nations or be terrified by signs in the heavens, although the nations are terrified by them,";
csb[3] = "for the customs of the peoples are worthless. Someone cuts down a tree from the forest; it is worked by the hands of a craftsman with a chisel.";
csb[4] = "He decorates it with silver and gold. It is fastened with hammer and nails, so it won\'t totter.";
csb[5] = "Like scarecrows in a cucumber patch, their idols cannot speak. They must be carried because they cannot walk. Do not fear them for they can do no harm -- and they cannot do any good.";
csb[6] = "LORD, there is no one like you. You are great; your name is great in power.";
csb[7] = "Who should not fear you, King of the nations? It is what you deserve. For among all the wise people of the nations and among all their kingdoms, there is no one like you.";
csb[8] = "They are both stupid and foolish, instructed by worthless idols made of wood!";
csb[9] = "Beaten silver is brought from Tarshish and gold from Uphaz. The work of a craftsman and of a goldsmith\'s hands is clothed in blue and purple, all the work of skilled artisans.";
csb[10] = "But the LORD is the true God; he is the living God and eternal King. The earth quakes at his wrath, and the nations cannot endure his rage.";
csb[11] = "You are to say this to them: &quot;The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.&quot;";
csb[12] = "He made the earth by his power, established the world by his wisdom, and spread out the heavens by his understanding.";
csb[13] = "When he thunders, the waters in the heavens are in turmoil, and he causes the clouds to rise from the ends of the earth. He makes lightning for the rain and brings the wind from his storehouses.";
csb[14] = "Everyone is stupid and ignorant. Every goldsmith is put to shame by his carved image, for his cast images are a lie; there is no breath in them.";
csb[15] = "They are worthless, a work to be mocked. At the time of their punishment they will be destroyed.";
csb[16] = "Jacob\'s Portion is not like these because he is the one who formed all things. Israel is the tribe of his inheritance; the LORD of Armies is his name.";
csb[17] = "Gather up your belongings from the ground, you who live under siege.";
csb[18] = "For this is what the LORD says: Look, I am flinging away the land\'s residents at this time and bringing them such distress that they will feel it.";
csb[19] = "Woe to me because of my brokenness -- I am severely wounded! I exclaimed, &quot;This is my intense suffering, but I must bear it.&quot;";
csb[20] = "My tent is destroyed; all my tent cords are snapped. My sons have departed from me and are no more. I have no one to pitch my tent again or to hang up my curtains.";
csb[21] = "For the shepherds are stupid: They don\'t seek the LORD. Therefore they have not prospered, and their whole flock is scattered.";
csb[22] = "Listen! A noise -- it is coming -- a great commotion from the land to the north. The cities of Judah will be made desolate, a jackals\' den.";
csb[23] = "I know, LORD, that a person\'s way of life is not his own; no one who walks determines his own steps.";
csb[24] = "Discipline me, LORD, but with justice -- not in your anger, or you will reduce me to nothing.";
csb[25] = "Pour out your wrath on the nations that don\'t recognize you and on the families that don\'t call on your name, for they have consumed Jacob; they have consumed him and finished him off and made his homeland desolate.";
kjv[1] = "Hear ye the word which the LORD speaketh unto you, O house of Israel:";
kjv[2] = "Thus saith the LORD, Learn not the way of the heathen, and be not dismayed at the signs of heaven; for the heathen are dismayed at them.";
kjv[3] = "For the customs of the people [are] vain: for [one] cutteth a tree out of the forest, the work of the hands of the workman, with the axe.";
kjv[4] = "They deck it with silver and with gold; they fasten it with nails and with hammers, that it move not.";
kjv[5] = "They [are] upright as the palm tree, but speak not: they must needs be borne, because they cannot go. Be not afraid of them; for they cannot do evil, neither also [is it] in them to do good.";
kjv[6] = "Forasmuch as [there is] none like unto thee, O LORD; thou [art] great, and thy name [is] great in might.";
kjv[7] = "Who would not fear thee, O King of nations? for to thee doth it appertain: forasmuch as among all the wise [men] of the nations, and in all their kingdoms, [there is] none like unto thee.";
kjv[8] = "But they are altogether brutish and foolish: the stock [is] a doctrine of vanities.";
kjv[9] = "Silver spread into plates is brought from Tarshish, and gold from Uphaz, the work of the workman, and of the hands of the founder: blue and purple [is] their clothing: they [are] all the work of cunning [men].";
kjv[10] = "But the LORD [is] the true God, he [is] the living God, and an everlasting king: at his wrath the earth shall tremble, and the nations shall not be able to abide his indignation.";
kjv[11] = "Thus shall ye say unto them, The gods that have not made the heavens and the earth, [even] they shall perish from the earth, and from under these heavens.";
kjv[12] = "He hath made the earth by his power, he hath established the world by his wisdom, and hath stretched out the heavens by his discretion.";
kjv[13] = "When he uttereth his voice, [there is] a multitude of waters in the heavens, and he causeth the vapours to ascend from the ends of the earth; he maketh lightnings with rain, and bringeth forth the wind out of his treasures.";
kjv[14] = "Every man is brutish in [his] knowledge: every founder is confounded by the graven image: for his molten image [is] falsehood, and [there is] no breath in them.";
kjv[15] = "They [are] vanity, [and] the work of errors: in the time of their visitation they shall perish.";
kjv[16] = "The portion of Jacob [is] not like them: for he [is] the former of all [things]; and Israel [is] the rod of his inheritance: The LORD of hosts [is] his name.";
kjv[17] = "Gather up thy wares out of the land, O inhabitant of the fortress.";
kjv[18] = "For thus saith the LORD, Behold, I will sling out the inhabitants of the land at this once, and will distress them, that they may find [it so].";
kjv[19] = "Woe is me for my hurt! my wound is grievous: but I said, Truly this [is] a grief, and I must bear it.";
kjv[20] = "My tabernacle is spoiled, and all my cords are broken: my children are gone forth of me, and they [are] not: [there is] none to stretch forth my tent any more, and to set up my curtains.";
kjv[21] = "For the pastors are become brutish, and have not sought the LORD: therefore they shall not prosper, and all their flocks shall be scattered.";
kjv[22] = "Behold, the noise of the bruit is come, and a great commotion out of the north country, to make the cities of Judah desolate, [and] a den of dragons.";
kjv[23] = "O LORD, I know that the way of man [is] not in himself: [it is] not in man that walketh to direct his steps.";
kjv[24] = "O LORD, correct me, but with judgment; not in thine anger, lest thou bring me to nothing.";
kjv[25] = "Pour out thy fury upon the heathen that know thee not, and upon the families that call not on thy name: for they have eaten up Jacob, and devoured him, and consumed him, and have made his habitation desolate.";

yng[18] = "For thus said Jehovah: Lo, I am slinging out the inhabitants of the land at this time, And have been an adversary to them, So that they are found out.";
dby[18] = "For thus saith Jehovah: Behold, I will this time sling out the inhabitants of the land, and will distress them, that they may be found.";
web[18] = "For thus saith the LORD; Behold, I will sling out the inhabitants of the land at this once, and will distress them that they may find [it so].";
hnv[18] = "For thus says the LORD, Behold, I will sling out the inhabitants of the land at this time, and will distress them, that they may feel [it].";
vul[18] = "quia haec dicit Dominus ecce ego longe proiciam habitatores terrae in hac vice et tribulabo eos ita ut inveniantur";
kjv[19] = "He hath made the earth by his power, he hath established the world by his wisdom, and hath stretched out the heavens by his discretion.";
rsv[19] = "Woe is me because of my hurt! My wound is grievous. But I said, &quot;Truly this is an affliction, and I must bear it.&quot;";
asv[19] = "Woe is me because of my hurt! my wound is grievous: but I said, Truly this is [my] grief, and I must bear it.";
yng[19] = "Wo to me for my breaking, Grievious hath been my smiting, And I said, Only, this [is] my sickness, and I bear it.";
dby[19] = "Woe is me, for my wound! My stroke is hard to heal, and I had said, Yea, this is [my] grief, and I will bear it.";
web[19] = "Woe is me for my hurt! my wound is grievous: but I said, Truly this [is] a grief, and I must bear it.";
hnv[19] = "Woe is me because of my hurt! my wound is grievous: but I said, Truly this is [my] grief, and I must bear it.";
vul[19] = "vae mihi super contritione mea pessima plaga mea ego autem dixi plane haec infirmitas mea est et portabo illam";
kjv[20] = "When he uttereth his voice, [there is] a multitude of waters in the heavens, and he causeth the vapours to ascend from the ends of the earth; he maketh lightnings with rain, and bringeth forth the wind out of his treasures.";
rsv[20] = "My tent is destroyed, and all my cords are broken; my children have gone from me, and they are not; there is no one to spread my tent again, and to set up my curtains.";
asv[20] = "My tent is destroyed, and all my cords are broken: my children are gone forth from me, and they are not: there is none to spread my tent any more, and to set up my curtains.";
yng[20] = "My tent hath been spoiled, And all my cords have been broken, My sons have gone out from me, and they are not, There is none stretching out any more my tent, And raising up my curtains.";
dby[20] = "My tent is despoiled, and all my cords are broken; my children are gone forth from me, and they are not; there is none to stretch forth my tent any more, and to set up my curtains.";
web[20] = "My tabernacle is laid waste, and all my cords are broken: my children are gone from me, and they [are] not: [there is] none to stretch forth my tent any more, and to set up my curtains.";
hnv[20] = "My tent is destroyed, and all my cords are broken: my children are gone forth from me, and they are no more: there is none to spread my tent any more, and to set up my curtains.";
vul[20] = "tabernaculum meum vastatum est omnes funiculi mei disrupti sunt filii mei exierunt a me et non subsistunt non est qui extendat ultra tentorium meum et erigat pelles meas";
kjv[21] = "Every man is brutish in [his] knowledge: every founder is confounded by the graven image: for his molten image [is] falsehood, and [there is] no breath in them.";
rsv[21] = "For the shepherds are stupid, and do not inquire of the LORD; therefore they have not prospered, and all their flock is scattered.";
asv[21] = "For the shepherds are become brutish, and have not inquired of Jehovah: therefore they have not prospered, and all their flocks are scattered.";
yng[21] = "For the shepherds have become brutish, And Jehovah they have not sought, Therefore they have not acted wisely, And all their flock is scattered.";
dby[21] = "For the shepherds are become brutish, and have not sought Jehovah; therefore have they not acted wisely, and all their flock is scattered.";
web[21] = "For the pastors have become brutish, and have not sought the LORD: therefore they shall not prosper, and all their flocks shall be scattered.";
hnv[21] = "For the shepherds are become brutish, and have not inquired of the LORD: therefore they have not prospered, and all their flocks are scattered.";
vul[21] = "quia stulte egerunt pastores et Dominum non quaesierunt propterea non intellexerunt et omnis grex eorum dispersus est";
kjv[22] = "They [are] vanity, [and] the work of errors: in the time of their visitation they shall perish.";
rsv[22] = "Hark, a rumor! Behold, it comes!--a great commotion out of the north country to make the cities of Judah a desolation, a lair of jackals.";
asv[22] = "The voice of tidings, behold, it cometh, and a great commotion out of the north country, to make the cities of Judah a desolation, a dwelling-place of jackals.";
yng[22] = "A voice of a report, lo, it hath come, Even a great shaking from the north country, To make the cities of Judah a desolation, A habitation of dragons.";
dby[22] = "The voice of a rumour! Behold, it cometh, and a great commotion out of the north country, to make the cities of Judah a desolation, a dwelling-place of jackals.";
web[22] = "Behold, the sound of the noise is come, and a great commotion from the north country, to make the cities of Judah desolate, [and] a den of dragons.";
hnv[22] = "The voice of news, behold, it comes, and a great commotion out of the north country, to make the cities of Yehudah a desolation, a dwelling-place of jackals.";
vul[22] = "vox auditionis ecce venit et commotio magna de terra aquilonis ut ponat civitates Iuda solitudinem et habitaculum draconum";
kjv[23] = "The portion of Jacob [is] not like them: for he [is] the former of all [things]; and Israel [is] the rod of his inheritance: The LORD of hosts [is] his name.";
rsv[23] = "I know, O LORD, that the way of man is not in himself, that it is not in man who walks to direct his steps.";
asv[23] = "O Jehovah, I know that the way of man is not in himself; it is not in man that walketh to direct his steps.";
yng[23] = "I have known, O Jehovah, that not of man [is] his way, Not of man the going and establishing of his step.";
dby[23] = "I know, Jehovah, that the way of man is not his own; it is not in a man that walketh to direct his steps.";
web[23] = "O LORD, I know that the way of man [is] not in himself: [it is] not in man that walketh to direct his steps.";
hnv[23] = "LORD, I know that the way of man is not in himself: it is not in man who walks to direct his steps.";
vul[23] = "scio Domine quia non est hominis via eius nec viri est ut ambulet et dirigat gressus suos";
kjv[24] = "Gather up thy wares out of the land, O inhabitant of the fortress.";
rsv[24] = "Correct me, O LORD, but in just measure; not in thy anger, lest thou bring me to nothing.";
asv[24] = "O Jehovah, correct me, but in measure; not in thine anger, lest thou bring me to nothing.";
yng[24] = "Chastise me, O Jehovah, only in judgment, Not in Thine anger, lest Thou make me small.";
dby[24] = "Jehovah, correct me, but with judgment; not in thine anger, lest thou bring me to nothing.";
web[24] = "O LORD, correct me, but with judgment; not in thy anger, lest thou bring me to nothing.";
hnv[24] = " LORD, correct me, but in measure: not in your anger, lest you bring me to nothing.";
vul[24] = "corripe me Domine verumtamen in iudicio et non in furore tuo ne forte ad nihilum redigas me";
kjv[25] = "For thus saith the LORD, Behold, I will sling out the inhabitants of the land at this once, and will distress them, that they may find [it so].";
rsv[25] = "Pour out thy wrath upon the nations that know thee not, and upon the peoples that call not on thy name; for they have devoured Jacob; they have devoured him and consumed him, and have laid waste his habitation.";
asv[25] = "Pour out thy wrath upon the nations that know thee not, and upon the families that call not on thy name; for they have devoured Jacob, yea, they have devoured him and consumed him, and have laid waste his habitation.";
yng[25] = "Pour out Thy fury on the nations that have not known Thee, And on the families that have not called in Thy name, For they have eaten up Jacob, Yea, they have eaten him up, yea, they consume him, And his habitation they have made desolate!";
dby[25] = "Pour out thy fury upon the nations that know thee not, and upon the families that call not on thy name; for they have eaten up Jacob, yea, they have eaten him up and consumed him, and have laid waste his dwelling-place.";
web[25] = "Pour out thy fury upon the heathen that know thee not, and upon the families that call not on thy name: for they have eaten up Jacob, and devoured him, and consumed him, and have made his habitation desolate.";
hnv[25] = "Pour out your wrath on the nations that don\'t know you, and on the families that don\'t call on your name: for they have devoured Ya`akov, yes, they have devoured him and consumed him, and have laid waste his habitation.";
vul[25] = "effunde indignationem tuam super gentes quae non cognoverunt te et super provincias quae nomen tuum non invocaverunt quia comederunt Iacob et devoraverunt eum et consumpserunt illum et decus eius dissipaverunt";
</script>
