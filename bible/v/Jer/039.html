csb[1] = "In the ninth year of King Zedekiah of Judah, in the tenth month, King Nebuchadnezzar of Babylon advanced against Jerusalem with his entire army and laid siege to it.";
csb[2] = "In the fourth month of Zedekiah\'s eleventh year, on the ninth day of the month, the city was broken into.";
csb[3] = "All the officials of the king of Babylon entered and sat at the Middle Gate: Nergal-sharezer, Samgar, Nebusarsechim the chief of staff, Nergal-sharezer the chief soothsayer, and all the rest of the officials of Babylon\'s king.";
csb[4] = "When King Zedekiah of Judah and all the fighting men saw them, they fled. They left the city at night by way of the king\'s garden through the city gate between the two walls. They left along the route to the Arabah.";
csb[5] = "However, the Chaldean army pursued them and overtook Zedekiah in the plains of Jericho. They arrested him and brought him up to Nebuchadnezzar, Babylon\'s king, at Riblah in the land of Hamath. The king passed sentence on him there.";
csb[6] = "At Riblah the king of Babylon slaughtered Zedekiah\'s sons before his eyes, and he also slaughtered all Judah\'s nobles.";
csb[7] = "Then he blinded Zedekiah and put him in bronze chains to take him to Babylon.";
csb[8] = "The Chaldeans next burned down the king\'s palace and the people\'s houses and tore down the walls of Jerusalem.";
csb[9] = "Nebuzaradan, the captain of the guards, deported the rest of the people to Babylon -- those who had remained in the city and those deserters who had defected to him along with the rest of the people who remained.";
csb[10] = "However, Nebuzaradan, the captain of the guards, left in the land of Judah some of the poor people who owned nothing, and he gave them vineyards and fields at that time.";
csb[11] = "Speaking through Nebuzaradan, captain of the guards, King Nebuchadnezzar of Babylon gave orders concerning Jeremiah:";
csb[12] = "&quot;Take him and look after him. Don\'t do him any harm, but do for him whatever he says.&quot;";
csb[13] = "Nebuzaradan, captain of the guards, Nebushazban the chief of staff, Nergal-sharezer the chief soothsayer, and all the captains of Babylon\'s king";
csb[14] = "had Jeremiah brought from the guard\'s courtyard and turned him over to Gedaliah son of Ahikam, son of Shaphan, to take him home. So he settled among his own people.";
csb[15] = "Now the word of the LORD had come to Jeremiah when he was confined in the guard\'s courtyard:";
csb[16] = "&quot;Go tell Ebed-melech the Cushite, \'This is what the LORD of Armies, the God of Israel, says: I am about to fulfill my words for disaster and not for good against this city. They will take place before your eyes on that day.";
csb[17] = "&quot;But I will rescue you on that day -- this is the LORD\'s declaration -- and you will not be handed over to the men you dread.";
csb[18] = "&quot;Indeed, I will certainly deliver you so that you do not fall by the sword. Because you have trusted in me, you will retain your life like the spoils of war. This is the LORD\'s declaration.\' &quot;";
kjv[1] = "In the ninth year of Zedekiah king of Judah, in the tenth month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and they besieged it.";
rsv[1] = "In the ninth year of Zedeki\'ah king of Judah, in the tenth month, Nebuchadrez\'zar king of Babylon and all his army came against Jerusalem and besieged it;";
asv[1] = "(in the ninth year of Zedekiah king of Judah, in the tenth month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and besieged it;";
yng[1] = "In the ninth year of Zedekiah king of Judah, in the tenth month, come hath Nebuchadrezzar king of Babylon and all his force unto Jerusalem, and they lay siege against it;";
dby[1] = "And it came to pass when Jerusalem was taken, in the ninth year of Zedekiah king of Judah, in the tenth month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and they besieged it.";
web[1] = "In the ninth year of Zedekiah king of Judah, in the tenth month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and they besieged it.";
hnv[1] = "It happened when Yerushalayim was taken, (in the ninth year of Tzidkiyahu king of Yehudah, in the tenth month, came Nevukhadretztzar king of Bavel and all his army against Yerushalayim, and besieged it;";
vul[1] = "anno nono Sedeciae regis Iuda mense decimo venit Nabuchodonosor rex Babylonis et omnis exercitus eius ad Hierusalem et obsidebant eam";

yng[2] = "in the eleventh year of Zedekiah, in the fourth month, in the ninth of the month, hath the city been broken up;";
dby[2] = "In the eleventh year of Zedekiah, in the fourth month, on the ninth of the month, the city was broken into;";
web[2] = "[And] in the eleventh year of Zedekiah, in the fourth month, the ninth [day] of the month, the city was broken up.";
hnv[2] = "in the eleventh year of Tzidkiyahu, in the fourth month, the ninth day of the month, a breach was made in the city,)";
vul[2] = "undecimo autem anno Sedeciae mense quarto quinta mensis aperta est civitas";
kjv[3] = "And all the princes of the king of Babylon came in, and sat in the middle gate, [even] Nergalsharezer, Samgarnebo, Sarsechim, Rabsaris, Nergalsharezer, Rabmag, with all the residue of the princes of the king of Babylon.";
rsv[3] = "When Jerusalem was taken, all the princes of the king of Babylon came and sat in the middle gate: Ner\'gal-share\'zer, Sam\'gar-ne\'bo, Sar\'sechim the Rab\'saris, Ner\'gal-share\'zer the Rabmag, with all the rest of the officers of the king of Babylon.";
asv[3] = "that all the princes of the king of Babylon came in, and sat in the middle gate, [to wit], Nergal-sharezer, Samgar-nebo, Sarsechim, Rab-saris, Nergal-sharezer, Rab-mag, with all the rest of the princes of the king of Babylon.";
yng[3] = "and come in do all the heads of the king of Babylon, and they sit at the middle gate, Nergal-Sharezer, Samgar-Nebo, Sarsechim, chief of the eunuchs, Nergal-Sharezer, chief of the Mages, and all the rest of the heads of the king of Babylon.";
dby[3] = "and all the princes of the king of Babylon came in, and sat in the middle gate: Nergal-sharezer, Samgar-nebu, Sarsechim, chief chamberlain, Nergal-sharezer, chief magian, and all the rest of the princes of the king of Babylon.";
web[3] = "And all the princes of the king of Babylon came in, and sat in the middle gate, [even] Nergal-sharezer, Samgar-nebo, Sarsechim, Rab-saris, Nergal-sharezer, Rab-mag, with all the residue of the princes of the king of Babylon.";
hnv[3] = "that all the princes of the king of Bavel came in, and sat in the middle gate, [to wit], Nergal-Sar\'etzer, Samgar-nebo, Sarsekhim, Rav-Saris, Nergal-Sar\'etzer, Rav-Mag, with all the rest of the princes of the king of Bavel.";
vul[3] = "et ingressi sunt omnes principes regis Babylonis et sederunt in porta media Neregel Sereser Semegar Nabu Sarsachim Rabsares Neregel Sereser Rebmag et omnes reliqui principes regis Babylonis";
kjv[4] = "And it came to pass, [that] when Zedekiah the king of Judah saw them, and all the men of war, then they fled, and went forth out of the city by night, by the way of the king\'s garden, by the gate betwixt the two walls: and he went out the way of the plain.";
rsv[4] = "When Zedeki\'ah king of Judah and all the soldiers saw them, they fled, going out of the city at night by way of the king\'s garden through the gate between the two walls; and they went toward the Arabah.";
asv[4] = "And it came to pass that, when Zedekiah the king of Judah and all the men of war saw them, then they fled, and went forth out of the city by night, by the way of the king\'s garden, through the gate betwixt the two walls; and he went out toward the Arabah.";
yng[4] = "And it cometh to pass, when Zedekiah king of Judah, and all the men of war, have seen them, that they flee and go forth by night from the city, the way of the king\'s garden, through the gate between the two walls, and he goeth forth the way of the plain.";
dby[4] = "And it came to pass when Zedekiah the king of Judah and all the men of war saw them, that they fled, and went forth out of the city by night, by the way of the king\'s garden, by the gate between the two walls; and he went out the way of the plain.";
web[4] = "And it came to pass, when Zedekiah the king of Judah saw them, and all the men of war, then they fled, and went out of the city by night, by the way of the king\'s garden, by the gate betwixt the two walls: and he went out the way of the plain.";
hnv[4] = "It happened that, when Tzidkiyahu the king of Yehudah and all the men of war saw them, then they fled, and went forth out of the city by night, by the way of the king\'s garden, through the gate between the two walls; and he went out toward the `Aravah.";
vul[4] = "cumque vidisset eos Sedecias rex Iuda et omnes viri bellatores fugerunt et egressi sunt nocte de civitate per viam horti regis et per portam quae erat inter duos muros et egressi sunt ad viam deserti";
kjv[5] = "But the Chaldeans\' army pursued after them, and overtook Zedekiah in the plains of Jericho: and when they had taken him, they brought him up to Nebuchadnezzar king of Babylon to Riblah in the land of Hamath, where he gave judgment upon him.";
rsv[5] = "But the army of the Chalde\'ans pursued them, and overtook Zedeki\'ah in the plains of Jericho; and when they had taken him, they brought him up to Nebuchadrez\'zar king of Babylon, at Riblah, in the land of Hamath; and he passed sentence upon him.";
asv[5] = "But the army of the Chaldeans pursued after them, and overtook Zedekiah in the plains of Jericho: and when they had taken him, they brought him up to Nebuchadrezzar king of Babylon to Riblah in the land of Hamath; and he gave judgment upon him.";
yng[5] = "And the forces of the Chaldeans pursue after them, and overtake Zedekiah in the plains of Jericho, and they take him, and bring him up unto Nebuchadnezzar king of Babylon, to Riblah, in the land of Hamath, and he speaketh with him -- judgments.";
dby[5] = "And the army of the Chaldeans pursued after them, and overtook Zedekiah in the plains of Jericho; and they took him, and brought him up to Nebuchadnezzar king of Babylon, unto Riblah in the land of Hamath; and he pronounced judgment upon him.";
web[5] = "But the Chaldeans\' army pursued them, and overtook Zedekiah in the plains of Jericho: and when they had taken him, they brought him to Nebuchadnezzar king of Babylon to Riblah in the land of Hamath, where he gave judgment upon him.";
hnv[5] = "But the army of the Kasdim pursued after them, and overtook Tzidkiyahu in the plains of Yericho: and when they had taken him, they brought him up to Nevukhadretztzar king of Bavel to Rivlah in the land of Hamat; and he gave judgment on him.";
vul[5] = "persecutus est autem eos exercitus Chaldeorum et conprehenderunt Sedeciam in campo solitudinis hiericuntinae et captum adduxerunt ad Nabuchodonosor regem Babylonis in Reblatha quae est in terra Emath et locutus est ad eum iudicia";
kjv[6] = "Then the king of Babylon slew the sons of Zedekiah in Riblah before his eyes: also the king of Babylon slew all the nobles of Judah.";
rsv[6] = "The king of Babylon slew the sons of Zedeki\'ah at Riblah before his eyes; and the king of Babylon slew all the nobles of Judah.";
asv[6] = "Then the king of Babylon slew the sons of Zedekiah in Riblah before his eyes: also the king of Babylon slew all the nobles of Judah.";
yng[6] = "And the king of Babylon slaughtereth the sons of Zedekiah, in Riblah, before his eyes, yea, all the freemen of Judah hath the king of Babylon slaughtered.";
dby[6] = "And the king of Babylon slaughtered the sons of Zedekiah in Riblah before his eyes, and the king of Babylon slaughtered all the nobles of Judah;";
web[6] = "Then the king of Babylon slew the sons of Zedekiah in Riblah before his eyes: also the king of Babylon slew all the nobles of Judah.";
hnv[6] = "Then the king of Bavel killed the sons of Tzidkiyahu in Rivlah before his eyes: also the king of Bavel killed all the nobles of Yehudah.";
vul[6] = "et occidit rex Babylonis filios Sedeciae in Reblatha in oculis eius et omnes nobiles Iuda occidit rex Babylonis";
kjv[7] = "Moreover he put out Zedekiah\'s eyes, and bound him with chains, to carry him to Babylon.";
rsv[7] = "He put out the eyes of Zedeki\'ah, and bound him in fetters to take him to Babylon.";
asv[7] = "Moreover he put out Zedekiah\'s eyes, and bound him in fetters, to carry him to Babylon.";
yng[7] = "And the eyes of Zedekiah he hath blinded, and he bindeth him with brazen fetters, to bring him in to Babylon.";
dby[7] = "and he put out the eyes of Zedekiah, and bound him with chains of brass, to carry him to Babylon.";
web[7] = "Moreover he put out Zedekiah\'s eyes, and bound him with chains, to carry him to Babylon.";
hnv[7] = " Moreover he put out Tzidkiyahu\'s eyes, and bound him in fetters, to carry him to Bavel.";
vul[7] = "oculos quoque Sedeciae eruit et vinxit eum conpedibus ut duceretur in Babylonem";
kjv[8] = "And the Chaldeans burned the king\'s house, and the houses of the people, with fire, and brake down the walls of Jerusalem.";
rsv[8] = "The Chalde\'ans burned the king\'s house and the house of the people, and broke down the walls of Jerusalem.";
asv[8] = "And the Chaldeans burned the king\'s house, and the houses of the people, with fire, and brake down the walls of Jerusalem.";
yng[8] = "And the house of the king, and the house of the people, have the Chaldeans burnt with fire, and the walls of Jerusalem they have broken down.";
dby[8] = "And the Chaldeans burned the king\'s house and the houses of the people with fire, and broke down the walls of Jerusalem.";
web[8] = "And the Chaldeans burned the king\'s house, and the houses of the people, with fire, and broke down the walls of Jerusalem.";
hnv[8] = "The Kasdim burned the king\'s house, and the houses of the people, with fire, and broke down the walls of Yerushalayim.";
vul[8] = "domum quoque regis et domum vulgi succenderunt Chaldei igni et murum Hierusalem subverterunt";
kjv[9] = "Then Nebuzaradan the captain of the guard carried away captive into Babylon the remnant of the people that remained in the city, and those that fell away, that fell to him, with the rest of the people that remained.";
rsv[9] = "Then Nebu\'zarad\'an, the captain of the guard, carried into exile to Babylon the rest of the people who were left in the city, those who had deserted to him, and the people who remained.";
asv[9] = "Then Nebuzaradan the captain of the guard carried away captive into Babylon the residue of the people that remained in the city, the deserters also that fell away to him, and the residue of the people that remained.";
yng[9] = "And the remnant of the people who are left in the city, and those falling who have fallen to him, and the remnant of the people who are left, hath Nebuzar-Adan, chief of the executioners, removed [to] Babylon.";
dby[9] = "And Nebuzar-adan the captain of the body-guard carried away captive into Babylon the rest of the people that were left in the city, and the deserters that had deserted to him, with the rest of the people that were left.";
web[9] = "Then Nebuzar-adan the captain of the guard carried away captive into Babylon the remnant of the people that remained in the city, and those that fell away, that fell to him, with the rest of the people that remained.";
hnv[9] = "Then Nevuzar\'adan the captain of the guard carried away captive into Bavel the residue of the people who remained in the city, the deserters also who fell away to him, and the residue of the people who remained.";
vul[9] = "et reliquias populi quae remanserunt in civitate et perfugas qui transfugerant ad eum et superfluos vulgi qui remanserant transtulit Nabuzardan magister militum in Babylonem";

yng[10] = "And of the poor people, who have nothing, hath Nebuzar-Adan, chief of the executioners, left in the land of Judah, and he giveth to them vineyards and fields on the same day.";
dby[10] = "But Nebuzar-adan the captain of the body-guard left [certain] of the people, the poor who had nothing, in the land of Judah, and gave them vineyards and fields at the same time.";

yng[12] = "`Take him, and place thine eyes upon him, and do no evil thing to him, but as he speaketh unto thee, so do with him.\'";
dby[12] = "Take him, and keep an eye upon him, and do him no harm; but do unto him even as he shall say unto thee.";

kjv[16] = "Go and speak to Ebedmelech the Ethiopian, saying, Thus saith the LORD of hosts, the God of Israel; Behold, I will bring my words upon this city for evil, and not for good; and they shall be [accomplished] in that day before thee.";
rsv[16] = "&quot;Go, and say to E\'bed-mel\'ech the Ethiopian, \'Thus says the LORD of hosts, the God of Israel: Behold, I will fulfil my words against this city for evil and not for good, and they shall be accomplished before you on that day.";
asv[16] = "Go, and speak to Ebed-melech the Ethiopian, saying, Thus saith Jehovah of hosts, the God of Israel: Behold, I will bring my words upon this city for evil, and not for good; and they shall be accomplished before thee in that day.";
yng[16] = "`Go, and thou hast spoken to Ebed-Melech the Cushite, saying: Thus said Jehovah of Hosts, God of Israel: Lo, I am bringing in My words unto this city for evil, and not for good, and they have been before thee in that day.";
dby[16] = "Go and speak to Ebed-melech the Ethiopian, saying, Thus saith Jehovah of hosts, the God of Israel: Behold, I will bring my words upon this city for evil, and not for good, and they shall come to pass before thy face in that day.";
web[16] = "Go and speak to Ebed-melech the Cushite, saying, Thus saith the LORD of hosts, the God of Israel; Behold, I will bring my words upon this city for evil, and not for good; and they shall be [accomplished] in that day before thee.";
hnv[16] = "Go, and speak to `Eved-Melekh the Kushite, saying, Thus says the LORD of Hosts, the God of Yisra\'el: Behold, I will bring my words on this city for evil, and not for good; and they shall be accomplished before you in that day.";
vul[16] = "vade et dic Abdemelech Aethiopi dicens haec dicit Dominus exercituum Deus Israhel ecce ego inducam sermones meos super civitatem hanc in malum et non in bonum et erunt in conspectu tuo in die illa";
kjv[17] = "But I will deliver thee in that day, saith the LORD: and thou shalt not be given into the hand of the men of whom thou [art] afraid.";
rsv[17] = "But I will deliver you on that day, says the LORD, and you shall not be given into the hand of the men of whom you are afraid.";
asv[17] = "But I will deliver thee in that day, saith Jehovah; and thou shalt not be given into the hand of the men of whom thou art afraid.";
