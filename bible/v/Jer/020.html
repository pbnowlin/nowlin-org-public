csb[1] = "Pashhur the priest, the son of Immer and chief official in the temple of the LORD, heard Jeremiah prophesying these things.";
csb[2] = "So Pashhur had the prophet Jeremiah beaten and put him in the stocks at the Upper Benjamin Gate in the LORD\'s temple.";
csb[3] = "The next day, when Pashhur released Jeremiah from the stocks, Jeremiah said to him, &quot;The LORD does not call you Pashhur, but Terror Is on Every Side,";
csb[4] = "&quot;for this is what the LORD says, \'I am about to make you a terror to both yourself and those you love. They will fall by the sword of their enemies before your very eyes. I will hand Judah over to the king of Babylon, and he will deport them to Babylon and put them to the sword.";
csb[5] = "&quot;I will give away all the wealth of this city, all its products and valuables. Indeed, I will hand all the treasures of the kings of Judah over to their enemies. They will plunder them, seize them, and carry them off to Babylon.";
csb[6] = "&quot;As for you, Pashhur, and all who live in your house, you will go into captivity. You will go to Babylon. There you will die, and there you will be buried, you and all your friends to whom you prophesied lies.\' &quot;";
csb[7] = "You deceived me, LORD, and I was deceived. You seized me and prevailed. I am a laughingstock all the time; everyone ridicules me.";
csb[8] = "For whenever I speak, I cry out, I proclaim, &quot;Violence and destruction! &quot; so the word of the LORD has become my constant disgrace and derision.";
csb[9] = "I say, &quot;I won\'t mention him or speak any longer in his name.&quot; But his message becomes a fire burning in my heart, shut up in my bones. I become tired of holding it in, and I cannot prevail.";
csb[10] = "For I have heard the gossip of many people, &quot;Terror is on every side! Report him; let\'s report him! &quot; Everyone I trusted watches for my fall. &quot;Perhaps he will be deceived so that we might prevail against him and take our vengeance on him.&quot;";
csb[11] = "But the LORD is with me like a violent warrior. Therefore, my persecutors will stumble and not prevail. Since they have not succeeded, they will be utterly shamed, an everlasting humiliation that will never be forgotten.";
csb[12] = "LORD of Armies, testing the righteous and seeing the heart and mind, let me see your vengeance on them, for I have presented my case to you.";
csb[13] = "Sing to the LORD! Praise the LORD, for he rescues the life of the needy from evil people.";
csb[14] = "May the day I was born be cursed. May the day my mother bore me never be blessed.";
csb[15] = "May the man be cursed who brought the news to my father, saying, &quot;A male child is born to you,&quot; bringing him great joy.";
csb[16] = "Let that man be like the cities the LORD demolished without compassion. Let him hear an outcry in the morning and a war cry at noontime";
csb[17] = "because he didn\'t kill me in the womb so that my mother might have been my grave, her womb eternally pregnant.";
csb[18] = "Why did I come out of the womb to see only struggle and sorrow, to end my life in shame?";
kjv[1] = "Now Pashur the son of Immer the priest, who [was] also chief governor in the house of the LORD, heard that Jeremiah prophesied these things.";

dby[2] = "And Pashur smote Jeremiah the prophet, and put him in the stocks that were in the upper gate of Benjamin, which was in the house of Jehovah.";

kjv[3] = "And it came to pass on the morrow, that Pashur brought forth Jeremiah out of the stocks. Then said Jeremiah unto him, The LORD hath not called thy name Pashur, but Magormissabib.";
rsv[3] = "On the morrow, when Pashhur released Jeremiah from the stocks, Jeremiah said to him, &quot;The LORD does not call your name Pashhur, but Terror on every side.";
asv[3] = "And it came to pass on the morrow, that Pashhur brought forth Jeremiah out of the stocks. Then said Jeremiah unto him, Jehovah hath not called thy name Pashhur, but Magor-missabib.";
yng[3] = "and it cometh to pass on the morrow, that Pashhur bringeth out Jeremiah from the stocks, and Jeremiah saith unto him, `Not Pashhur hath Jehovah called thy name, but -- Magor-Missabib.";
dby[3] = "And it came to pass the next day, that Pashur brought forth Jeremiah out of the stocks; and Jeremiah said unto him, Jehovah hath not called thy name Pashur, but Magor-missabib.";
web[3] = "And it came to pass on the morrow, that Pashur brought forth Jeremiah out of the stocks. Then said Jeremiah to him, The LORD hath not called thy name Pashur, but Magor-missabib.";
hnv[3] = "It happened on the next day, that Pashchur brought forth Yirmeyahu out of the stocks. Then said Yirmeyahu to him, the LORD has not called your name Pashchur, but Magor-Missaviv.";

kjv[4] = "For thus saith the LORD, Behold, I will make thee a terror to thyself, and to all thy friends: and they shall fall by the sword of their enemies, and thine eyes shall behold [it]: and I will give all Judah into the hand of the king of Babylon, and he shall carry them captive into Babylon, and shall slay them with the sword.";
rsv[4] = "For thus says the LORD: Behold, I will make you a terror to yourself and to all your friends. They shall fall by the sword of their enemies while you look on. And I will give all Judah into the hand of the king of Babylon; he shall carry them captive to Babylon, and shall slay them with the sword.";
asv[4] = "For thus saith Jehovah, Behold, I will make thee a terror to thyself, and to all thy friends; and they shall fall by the sword of their enemies, and thine eyes shall behold it; and I will give all Judah into the hand of the king of Babylon, and he shall carry them captive to Babylon, and shall slay them with the sword.";
yng[4] = "For thus said Jehovah: Lo, I am making thee for a fear to thyself, And to all loving thee, And they have fallen by the sword of their enemies, and thine eyes are beholding, And all Judah I give into the hand of the king of Babylon, And he hath removed them to Babylon, And he hath smitten them with the sword.";
dby[4] = "For thus saith Jehovah: Behold, I make thee a terror to thyself, and to all thy friends; and they shall fall by the sword of their enemies, and thine eyes shall see [it]; and I will give all Judah into the hand of the king of Babylon, and he shall carry them captive into Babylon, and shall smite them with the sword.";
web[4] = "For thus saith the LORD, Behold, I will make thee a terror to thyself, and to all thy friends: and they shall fall by the sword of their enemies, and thy eyes shall behold [it]: and I will give all Judah into the hand of the king of Babylon, and he shall carry them captive into Babylon, and shall slay them with the sword.";
hnv[4] = " For thus says the LORD, Behold, I will make you a terror to yourself, and to all your friends; and they shall fall by the sword of their enemies, and your eyes shall see it; and I will give all Yehudah into the hand of the king of Bavel, and he shall carry them captive to Bavel, and shall kill them with the sword.";
vul[4] = "quia haec dicit Dominus ecce ego dabo te in pavorem te et omnes amicos tuos et corruent gladio inimicorum suorum et oculi tui videbunt et omnem Iudam dabo in manu regis Babylonis et traducet eos in Babylonem et percutiet eos gladio";
kjv[5] = "Moreover I will deliver all the strength of this city, and all the labours thereof, and all the precious things thereof, and all the treasures of the kings of Judah will I give into the hand of their enemies, which shall spoil them, and take them, and carry them to Babylon.";
rsv[5] = "Moreover, I will give all the wealth of the city, all its gains, all its prized belongings, and all the treasures of the kings of Judah into the hand of their enemies, who shall plunder them, and seize them, and carry them to Babylon.";
asv[5] = "Moreover I will give all the riches of this city, and all the gains thereof, and all the precious things thereof, yea, all the treasures of the kings of Judah will I give into the hand of their enemies; and they shall make them a prey, and take them, and carry them to Babylon.";
yng[5] = "And I have given all the strength of this city, And all its labour, and all its precious things, Yea, all the treasures of the kings of Judah I do give into the hand of their enemies, And they have spoiled them, and taken them, And have brought them into Babylon.";
dby[5] = "And, I will give all the wealth of this city, and all its gains, and all its precious things, and all the treasures of the kings of Judah, will I give into the hand of their enemies; and they shall make them a prey, and take them, and carry them to Babylon.";
web[5] = "Moreover I will deliver all the strength of this city, and all its labors, and all its precious things, and all the treasures of the kings of Judah will I give into the hand of their enemies, who shall pillage them, and take them, and carry them to Babylon.";
hnv[5] = "Moreover I will give all the riches of this city, and all the gains of it, and all the precious things of it, yes, all the treasures of the kings of Yehudah will I give into the hand of their enemies; and they shall make them a prey, and take them, and carry them to Bavel.";
vul[5] = "et dabo universam substantiam civitatis huius et omnem laborem eius omneque pretium et cunctos thesauros regum Iuda dabo in manu inimicorum eorum et diripient eos et tollent et ducent in Babylonem";
kjv[6] = "And thou, Pashur, and all that dwell in thine house shall go into captivity: and thou shalt come to Babylon, and there thou shalt die, and shalt be buried there, thou, and all thy friends, to whom thou hast prophesied lies.";
rsv[6] = "And you, Pashhur, and all who dwell in your house, shall go into captivity; to Babylon you shall go; and there you shall die, and there you shall be buried, you and all your friends, to whom you have prophesied falsely.&quot;";
asv[6] = "And thou, Pashhur, and all that dwell in thy house shall go into captivity; and thou shalt come to Babylon, and there thou shalt die, and there shalt thou be buried, thou, and all thy friends, to whom thou hast prophesied falsely.";
yng[6] = "And thou, Pashhur, and all dwelling in thy house, Do go into captivity. and Babylon thou dost enter, And there thou diest, and there thou art buried, Thou and all loving thee, To whom thou hast prophesied falsely.\'";
dby[6] = "And thou, Pashur, and all that dwell in thy house shall go into captivity; and thou shalt come to Babylon, and there thou shalt die, and there thou shalt be buried, thou and all thy friends to whom thou hast prophesied falsehood.";
web[6] = "And thou, Pashur, and all that dwell in thy house shall go into captivity: and thou shalt come to Babylon, and there thou shalt die, and shalt be buried there, thou, and all thy friends, to whom thou hast prophesied lies.";

vul[6] = "tu autem Phassur et omnes habitatores domus tuae ibitis in captivitatem et in Babylonem venies et ibi morieris ibique sepelieris tu et omnes amici tui quibus prophetasti mendacium";
kjv[7] = "O LORD, thou hast deceived me, and I was deceived: thou art stronger than I, and hast prevailed: I am in derision daily, every one mocketh me.";

yng[7] = "Thou hast persuaded me, O Jehovah, and I am persuaded; Thou hast hardened me, and dost prevail, I have been for a laughter all the day, Every one is mocking at me,";
dby[7] = "Jehovah, thou hast enticed me, and I was enticed; thou hast laid hold of me, and hast prevailed; I am become a derision the whole day: every one mocketh me.";
web[7] = "O LORD, thou hast deceived me, and I was deceived: thou art stronger than I, and hast prevailed: I am in derision daily, every one mocketh me.";

yng[8] = "Because from the time I speak I cry out, `Violence and destruction,\' I cry, For the word of Jehovah hath been to me For reproach and for derision all the day.";
dby[8] = "For as oft as I speak, I cry out; I proclaim violence and spoil; for the word of Jehovah is become unto me a reproach and a derision all the day.";
web[8] = "For since I spoke, I cried out, I cried violence and spoil; because the word of the LORD was made a reproach to me, and a derision, daily.";

rsv[9] = "If I say, &quot;I will not mention him, or speak any more in his name,&quot; there is in my heart as it were a burning fire shut up in my bones, and I am weary with holding it in, and I cannot.";

kjv[10] = "For I heard the defaming of many, fear on every side. Report, [say they], and we will report it. All my familiars watched for my halting, [saying], Peradventure he will be enticed, and we shall prevail against him, and we shall take our revenge on him.";
rsv[10] = "For I hear many whispering. Terror is on every side! &quot;Denounce him! Let us denounce him!&quot; say all my familiar friends, watching for my fall. &quot;Perhaps he will be deceived, then we can overcome him, and take our revenge on him.&quot;";
asv[10] = "For I have heard the defaming of many, terror on every side. Denounce, and we will denounce him, [say] all my familiar friends, they that watch for my fall; peradventure he will be persuaded, and we shall prevail against him, and we shall take our revenge on him.";
yng[10] = "For I have heard the evil report of many, Fear [is] round about: `Declare, and we declare it,\' All mine allies are watching [for] my halting, `Perhaps he is enticed, and we prevail over him, And we take our vengeance out of him.\'";
dby[10] = "For I have heard the defaming of many, terror on every side: Report, and we will report it. All my familiars are watching for my stumbling: Peradventure he will be enticed, and we shall prevail against him; and we shall take our revenge on him.";
web[10] = "For I heard the defaming of many, fear on every side. Report, [say they], and we will report it. All my familiars watched for my halting, [saying], Perhaps he will be enticed, and we shall prevail against him, and we shall take our revenge on him.";
hnv[10] = "For I have heard the defaming of many, terror on every side. Denounce, and we will denounce him, [say] all my familiar friends, those who watch for my fall; peradventure he will be persuaded, and we shall prevail against him, and we shall take our revenge on him.";
vul[10] = "audivi enim contumelias multorum et terrorem in circuitu persequimini et persequamur eum ab omnibus viris qui erant pacifici mei et custodientes latus meum si quo modo decipiatur et praevaleamus adversus eum et consequamur ultionem ex eo";
kjv[11] = "But the LORD [is] with me as a mighty terrible one: therefore my persecutors shall stumble, and they shall not prevail: they shall be greatly ashamed; for they shall not prosper: [their] everlasting confusion shall never be forgotten.";
rsv[11] = "But the LORD is with me as a dread warrior; therefore my persecutors will stumble, they will not overcome me. They will be greatly shamed, for they will not succeed. Their eternal dishonor will never be forgotten.";
asv[11] = "But Jehovah is with me as a mighty one [and] a terrible: therefore my persecutors shall stumble, and they shall not prevail; they shall be utterly put to shame, because they have not dealt wisely, even with an everlasting dishonor which shall never be forgotten.";
yng[11] = "And Jehovah [is] with me, as a terrible mighty one, Therefore my persecutors stumble and prevail not, They have been exceedingly ashamed, For they have not acted wisely, Confusion age-during is not forgotten.";
dby[11] = "But Jehovah is with me as a mighty terrible one; therefore my persecutors shall stumble and shall not prevail; they shall be greatly ashamed, for they have not prospered: it shall be an everlasting confusion that shall not be forgotten.";

vul[11] = "Dominus autem mecum est quasi bellator fortis idcirco qui persequuntur me cadent et infirmi erunt confundentur vehementer quia non intellexerunt obprobrium sempiternum quod numquam delebitur";
kjv[12] = "But, O LORD of hosts, that triest the righteous, [and] seest the reins and the heart, let me see thy vengeance on them: for unto thee have I opened my cause.";

asv[12] = "But, O Jehovah of hosts, that triest the righteous, that seest the heart and the mind, let me see thy vengeance on them; for unto thee have I revealed my cause.";
yng[12] = "And, O Jehovah of Hosts, trier of the righteous, Beholder of reins and heart, I do see Thy vengeance out of them, For unto Thee I have revealed my cause.";
dby[12] = "And thou, Jehovah of hosts, who triest the righteous, who seest the reins and the heart, let me see thy vengeance on them; for unto thee have I revealed my cause.";
web[12] = "But, O LORD of hosts, that triest the righteous, [and] seest the reins and the heart, let me see thy vengeance on them: for to thee have I opened my cause.";
hnv[12] = "But, the LORD of Hosts, who tests the righteous, who sees the heart and the mind, let me see your vengeance on them; for to you have I revealed my cause.";
vul[12] = "et tu Domine exercituum probator iusti qui vides renes et cor videam quaeso ultionem tuam ex eis tibi enim revelavi causam meam";
