csb[1] = "This is the text of the letter that the prophet Jeremiah sent from Jerusalem to the remaining exiled elders, the priests, the prophets, and all the people Nebuchadnezzar had deported from Jerusalem to Babylon.";
csb[2] = "This was after King Jeconiah, the queen mother, the court officials, the officials of Judah and Jerusalem, the craftsmen, and the metalsmiths had left Jerusalem.";
csb[3] = "He sent the letter with Elasah son of Shaphan and Gemariah son of Hilkiah, whom Zedekiah king of Judah sent to Babylon to King Nebuchadnezzar of Babylon. The letter stated:";
csb[4] = "This is what the LORD of Armies, the God of Israel, says to all the exiles I deported from Jerusalem to Babylon:";
csb[5] = "&quot;Build houses and live in them. Plant gardens and eat their produce.";
csb[6] = "&quot;Find wives for yourselves, and have sons and daughters. Find wives for your sons and give your daughters to men in marriage so that they may bear sons and daughters. Multiply there; do not decrease.";
csb[7] = "&quot;Pursue the well-being of the city I have deported you to. Pray to the LORD on its behalf, for when it thrives, you will thrive.&quot;";
csb[8] = "For this is what the LORD of Armies, the God of Israel, says: &quot;Don\'t let your prophets who are among you and your diviners deceive you, and don\'t listen to the dreams you elicit from them,";
csb[9] = "&quot;for they are prophesying falsely to you in my name. I have not sent them.&quot; This is the LORD\'s declaration.";
csb[10] = "For this is what the LORD says: &quot;When seventy years for Babylon are complete, I will attend to you and will confirm my promise concerning you to restore you to this place.";
csb[11] = "&quot;For I know the plans I have for you&quot; -- this is the LORD\'s declaration -- &quot;plans for your well-being, not for disaster, to give you a future and a hope.";
csb[12] = "&quot;You will call to me and come and pray to me, and I will listen to you.";
csb[13] = "&quot;You will seek me and find me when you search for me with all your heart.";
csb[14] = "&quot;I will be found by you&quot; -- this is the LORD\'s declaration -- &quot;and I will restore your fortunes and gather you from all the nations and places where I banished you&quot; -- this is the LORD\'s declaration. &quot;I will restore you to the place from which I deported you.&quot;";
csb[15] = "You have said, &quot;The LORD has raised up prophets for us in Babylon! &quot;";
csb[16] = "But this is what the LORD says concerning the king sitting on David\'s throne and concerning all the people living in this city -- that is, concerning your brothers who did not go with you into exile.";
csb[17] = "This is what the LORD of Armies says: &quot;I am about to send sword, famine, and plague against them, and I will make them like rotten figs that are inedible because they are so bad.";
csb[18] = "&quot;I will pursue them with sword, famine, and plague. I will make them a horror to all the kingdoms of the earth -- a curse and a desolation, an object of scorn and a disgrace among all the nations where I have banished them.";
csb[19] = "&quot;I will do this because they have not listened to my words&quot; -- this is the LORD\'s declaration -- &quot;the words that I sent to them with my servants the prophets time and time again. And you too have not listened.&quot; This is the LORD\'s declaration.";
csb[20] = "Hear the word of the LORD, all you exiles I have sent from Jerusalem to Babylon.";
csb[21] = "This is what the LORD of Armies, the God of Israel, says about Ahab son of Kolaiah and concerning Zedekiah son of Maaseiah, the ones prophesying a lie to you in my name: &quot;I am about to hand them over to King Nebuchadnezzar of Babylon, and he will kill them before your very eyes.";
csb[22] = "&quot;Based on what happens to them, all the exiles of Judah who are in Babylon will create a curse that says, \'May the LORD make you like Zedekiah and Ahab, whom the king of Babylon roasted in the fire! \'";
csb[23] = "&quot;because they have committed an outrage in Israel by committing adultery with their neighbors\' wives and have spoken in my name a lie, which I did not command them. I am he who knows, and I am a witness.&quot; This is the LORD\'s declaration.";
csb[24] = "To Shemaiah the Nehelamite you are to say,";
csb[25] = "&quot;This is what the LORD of Armies, the God of Israel, says: You in your own name have sent out letters to all the people of Jerusalem, to the priest Zephaniah son of Maaseiah, and to all the priests, saying,";
csb[26] = "&quot;\'The LORD has appointed you priest in place of the priest Jehoiada to be the chief officer in the temple of the LORD, responsible for every madman who acts like a prophet. You must confine him in the stocks and an iron collar.";
csb[27] = "&quot;So now, why have you not rebuked Jeremiah of Anathoth who has been acting like a prophet among you?";
csb[28] = "&quot;For he has sent word to us in Babylon, claiming, &quot;The exile will be long. Build houses and settle down. Plant gardens and eat their produce.&quot; \' &quot;";
csb[29] = "The priest Zephaniah read this letter in the hearing of the prophet Jeremiah.";
csb[30] = "Then the word of the LORD came to Jeremiah:";
csb[31] = "&quot;Send a message to all the exiles, saying, \'This is what the LORD says concerning Shemaiah the Nehelamite. Because Shemaiah prophesied to you, though I did not send him, and made you trust a lie,";
csb[32] = "&quot;this is what the LORD says: I am about to punish Shemaiah the Nehelamite and his descendants. There will not be even one of his descendants living among these people, nor will any ever see the good that I will bring to my people -- this is the LORD\'s declaration -- for he has preached rebellion against the LORD.\' &quot;";
kjv[1] = "Now these [are] the words of the letter that Jeremiah the prophet sent from Jerusalem unto the residue of the elders which were carried away captives, and to the priests, and to the prophets, and to all the people whom Nebuchadnezzar had carried away captive from Jerusalem to Babylon;";
rsv[1] = "These are the words of the letter which Jeremiah the prophet sent from Jerusalem to the elders of the exiles, and to the priests, the prophets, and all the people, whom Nebuchadnez\'zar had taken into exile from Jerusalem to Babylon.";
asv[1] = "Now these are the words of the letter that Jeremiah the prophet sent from Jerusalem unto the residue of the elders of the captivity, and to the priests, and to the prophets, and to all the people, whom Nebuchadnezzar had carried away captive from Jerusalem to Babylon,";
yng[1] = "And these [are] words of the letter that Jeremiah the prophet sent from Jerusalem unto the remnant of the elders of the removal, and unto the priests, and unto the prophets, and unto all the people -- whom Nebuchadnezzar removed from Jerusalem to Babylon,";
dby[1] = "And these are the words of the letter that the prophet Jeremiah sent from Jerusalem to the residue of the elders of the captivity, and to the priests, and to the prophets, and to all the people whom Nebuchadnezzar had carried away captive from Jerusalem to Babylon";
web[1] = "Now these [are] the words of the letter that Jeremiah the prophet sent from Jerusalem to the residue of the elders who were carried away captives, and to the priests, and to the prophets, and to all the people whom Nebuchadnezzar had carried away captive from Jerusalem to Babylon;";
hnv[1] = "Now these are the words of the letter that Yirmeyahu the prophet sent from Yerushalayim to the residue of the Zakenim of the captivity, and to the Kohanim, and to the prophets, and to all the people, whom Nevukhadnetztzar had carried away captive from Yerushalayim to Bavel,";
vul[1] = "et haec sunt verba libri quae misit Hieremias propheta de Hierusalem ad reliquias seniorum transmigrationis et ad sacerdotes et ad prophetas et ad omnem populum quem transduxerat Nabuchodonosor de Hierusalem in Babylonem";
kjv[2] = "(After that Jeconiah the king, and the queen, and the eunuchs, the princes of Judah and Jerusalem, and the carpenters, and the smiths, were departed from Jerusalem;)";
rsv[2] = "This was after King Jeconi\'ah, and the queen mother, the eunuchs, the princes of Judah and Jerusalem, the craftsmen, and the smiths had departed from Jerusalem.";
asv[2] = "(after that Jeconiah the king, and the queen-mother, and the eunuchs, [and] the princes of Judah and Jerusalem, and the craftsmen, and the smiths, were departed from Jerusalem),";
yng[2] = "After the going forth of Jeconiah the king, and the mistress, and the officers, heads of Judah and Jerusalem, and the artificer, and the smith, from Jerusalem --";
dby[2] = "(after that Jeconiah the king, and the queen, and the eunuchs, the princes of Judah and Jerusalem, and the craftsmen, and the smiths, had departed from Jerusalem);";
web[2] = "(After Jeconiah the king, and the queen, and the eunuchs, the princes of Judah and Jerusalem, and the carpenters, and the smiths, had departed from Jerusalem;)";
hnv[2] = "(after that Yekhonyah the king, and the queen-mother, and the eunuchs, [and] the princes of Yehudah and Yerushalayim, and the craftsmen, and the smiths, were departed from Yerushalayim,)";
vul[2] = "postquam egressus est Iechonias rex et domina et eunuchi et principes Iuda et Hierusalem et faber et inclusor de Hierusalem";
kjv[3] = "By the hand of Elasah the son of Shaphan, and Gemariah the son of Hilkiah, (whom Zedekiah king of Judah sent unto Babylon to Nebuchadnezzar king of Babylon) saying,";
rsv[3] = "The letter was sent by the hand of Ela\'sah the son of Shaphan and Gemari\'ah the son of Hilki\'ah, whom Zedeki\'ah king of Judah sent to Babylon to Nebuchadnez\'zar king of Babylon. It said:";
asv[3] = "by the hand of Elasah the son of Shaphan, and Gemariah the son of Hilkiah, (whom Zedekiah king of Judah sent unto Babylon to Nebuchadnezzar king of Babylon), saying,";
yng[3] = "By the hand of Eleasah son of Shaphan, and Gemariah son of Hilkijah, whom Zedekiah king of Judah sent unto Nebuchadnezzar king of Babylon -- to Babylon, saying,";
dby[3] = "by the hand of Elasah the son of Shaphan, and Gemariah the son of Hilkijah (whom Zedekiah king of Judah sent to Babylon, unto Nebuchadnezzar king of Babylon), saying,";
web[3] = "By the hand of Elasah the son of Shaphan, and Gemariah the son of Hilkiah, (whom Zedekiah king of Judah sent to Babylon to Nebuchadnezzar king of Babylon) saying,";
hnv[3] = "by the hand of El`asah the son of Shafan, and Gemaryah the son of Hilkiyah, (whom Tzidkiyahu king of Yehudah sent to Bavel to Nevukhadnetztzar king of Bavel,) saying,";
vul[3] = "in manu Ellasa filii Saphan et Gamaliae filii Helciae quos misit Sedecias rex Iuda ad Nabuchodonosor regem Babylonis in Babylonem dicens";
kjv[4] = "Thus saith the LORD of hosts, the God of Israel, unto all that are carried away captives, whom I have caused to be carried away from Jerusalem unto Babylon;";
rsv[4] = "&quot;Thus says the LORD of hosts, the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:";
asv[4] = "Thus saith Jehovah of hosts, the God of Israel, unto all the captivity, whom I have caused to be carried away captive from Jerusalem unto Babylon:";
yng[4] = "`Thus said Jehovah of Hosts, God of Israel, to all the removal that I removed from Jerusalem to Babylon,";
dby[4] = "Thus saith Jehovah of hosts, the God of Israel, unto all the captivity, whom I have caused to be carried away from Jerusalem unto Babylon:";
web[4] = "Thus saith the LORD of hosts, the God of Israel, to all that are carried away captives, whom I have caused to be carried away from Jerusalem to Babylon;";
hnv[4] = "Thus says the LORD of Hosts, the God of Yisra\'el, to all the captivity, whom I have caused to be carried away captive from Yerushalayim to Bavel:";
vul[4] = "haec dicit Dominus exercituum Deus Israhel omni transmigrationi quam transtuli de Hierusalem in Babylonem";
kjv[5] = "Build ye houses, and dwell [in them]; and plant gardens, and eat the fruit of them;";
rsv[5] = "Build houses and live in them; plant gardens and eat their produce.";
asv[5] = "Build ye houses, and dwell in them; and plant gardens, and eat the fruit of them.";
yng[5] = "Build ye houses, and abide; and plant ye gardens, and eat their fruit;";
dby[5] = "Build houses, and dwell in them, and plant gardens, and eat the fruit of them.";
web[5] = "Build ye houses, and dwell [in them]; and plant gardens, and eat the fruit of them;";
hnv[5] = " Build you houses, and dwell in them; and plant gardens, and eat the fruit of them.";
vul[5] = "aedificate domos et habitate et plantate hortos et comedite fructum eorum";
kjv[6] = "Take ye wives, and beget sons and daughters; and take wives for your sons, and give your daughters to husbands, that they may bear sons and daughters; that ye may be increased there, and not diminished.";
rsv[6] = "Take wives and have sons and daughters; take wives for your sons, and give your daughters in marriage, that they may bear sons and daughters; multiply there, and do not decrease.";
asv[6] = "Take ye wives, and beget sons and daughters; and take wives for your sons, and give your daughters to husbands, that they may bear sons and daughters: and multiply ye there, and be not diminished.";
yng[6] = "Take ye wives, and beget sons and daughters; and take for your sons wives, and your daughters give to husbands, and they bear sons and daughters; and multiply there, and ye are not few;";
dby[6] = "Take wives, and beget sons and daughters; and take wives for your sons, and give your daughters to husbands, that they may bear sons and daughters; and multiply there, and be not diminished.";
web[6] = "Take ye wives, and beget sons and daughters; and take wives for your sons, and give your daughters to husbands, that they may bear sons and daughters; that ye may be increased there, and not diminished.";
hnv[6] = "Take wives, and father sons and daughters; and take wives for your sons, and give your daughters to husbands, that they may bear sons and daughters; and multiply you there, and don\'t be diminished.";
vul[6] = "accipite uxores et generate filios et filias date filiis vestris uxores et filias vestras date viris et pariant filios et filias et multiplicamini ibi et nolite esse pauci numero";
kjv[7] = "And seek the peace of the city whither I have caused you to be carried away captives, and pray unto the LORD for it: for in the peace thereof shall ye have peace.";
rsv[7] = "But seek the welfare of the city where I have sent you into exile, and pray to the LORD on its behalf, for in its welfare you will find your welfare.";
asv[7] = "And seek the peace of the city whither I have caused you to be carried away captive, and pray unto Jehovah for it; for in the peace thereof shall ye have peace.";
yng[7] = "And seek the peace of the city whither I have removed you, and pray for it unto Jehovah, for in its peace ye have peace.";
dby[7] = "And seek the peace of the city whither I have caused you to be carried away captive, and pray unto Jehovah for it: for in the peace thereof shall ye have peace.";
web[7] = "And seek the peace of the city whither I have caused you to be carried away captives, and pray to the LORD for it: for in the peace of it ye shall have peace.";
hnv[7] = "Seek the shalom of the city where I have caused you to be carried away captive, and pray to the LORD for it; for in the shalom of it shall you have shalom.";
vul[7] = "et quaerite pacem civitatis ad quam transmigrare vos feci et orate pro ea ad Dominum quia in pace illius erit pax vobis";
kjv[8] = "For thus saith the LORD of hosts, the God of Israel; Let not your prophets and your diviners, that [be] in the midst of you, deceive you, neither hearken to your dreams which ye cause to be dreamed.";
rsv[8] = "For thus says the LORD of hosts, the God of Israel: Do not let your prophets and your diviners who are among you deceive you, and do not listen to the dreams which they dream,";
asv[8] = "For thus saith Jehovah of hosts, the God of Israel: Let not your prophets that are in the midst of you, and your diviners, deceive you; neither hearken ye to your dreams which ye cause to be dreamed.";
yng[8] = "`For thus said Jehovah of Hosts, God of Israel, Let not your prophets who [are] in your midst, and your diviners, lift you up, nor hearken ye unto their dreams, thay ye are causing [them] to dream;";
dby[8] = "For thus saith Jehovah of hosts, the God of Israel: Let not your prophets that are in your midst, nor your diviners deceive you, neither hearken to your dreams, which ye like to dream.";
web[8] = "For thus saith the LORD of hosts, the God of Israel; Let not your prophets and your diviners, that [are] in the midst of you, deceive you, neither hearken to your dreams which ye cause to be dreamed.";
hnv[8] = "For thus says the LORD of hosts, the God of Yisra\'el: Don\'t let your prophets who are in the midst of you, and your diviners, deceive you; neither listen you to your dreams which you cause to be dreamed.";
vul[8] = "haec enim dicit Dominus exercituum Deus Israhel non vos inducant prophetae vestri qui sunt in medio vestrum et divini vestri et ne adtendatis ad somnia vestra quae vos somniatis";
kjv[9] = "For they prophesy falsely unto you in my name: I have not sent them, saith the LORD.";
rsv[9] = "for it is a lie which they are prophesying to you in my name; I did not send them, says the LORD.";
asv[9] = "For they prophesy falsely unto you in my name: I have not sent them, saith Jehovah.";
yng[9] = "For with falsehood they are prophesying to you in My name; I have not sent them, an affirmation of Jehovah.";
dby[9] = "For they prophesy falsely unto you in my name: I have not sent them, saith Jehovah.";
web[9] = "For they prophesy falsely to you in my name: I have not sent them, saith the LORD.";
hnv[9] = "For they prophesy falsely to you in my name: I have not sent them, says the LORD.";
vul[9] = "quia falso ipsi prophetant vobis in nomine meo et non misi eos dicit Dominus";
kjv[10] = "For thus saith the LORD, That after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place.";
rsv[10] = "&quot;For thus says the LORD: When seventy years are completed for Babylon, I will visit you, and I will fulfil to you my promise and bring you back to this place.";
asv[10] = "For thus saith Jehovah, After seventy years are accomplished for Babylon, I will visit you, and perform my good word toward you, in causing you to return to this place.";
yng[10] = "`For thus said Jehovah, Surely at the fulness of Babylon -- seventy years -- I inspect you, and have established towards you My good word, to bring you back unto this place.";
dby[10] = "For thus saith Jehovah: When seventy years shall be accomplished for Babylon I will visit you, and perform my good word toward you, in bringing you back to this place.";
web[10] = "For thus saith the LORD, That after seventy years shall be accomplished at Babylon I will visit you, and perform my good word towards you, in causing you to return to this place.";
hnv[10] = " For thus says the LORD, After seventy years are accomplished for Bavel, I will visit you, and perform my good word toward you, in causing you to return to this place.";
vul[10] = "quia haec dicit Dominus cum coeperint impleri in Babylone septuaginta anni visitabo vos et suscitabo super vos verbum meum bonum ut reducam vos ad locum istum";
kjv[11] = "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.";
rsv[11] = "For I know the plans I have for you, says the LORD, plans for welfare and not for evil, to give you a future and a hope.";
asv[11] = "For I know the thoughts that I think toward you, saith Jehovah, thoughts of peace, and not of evil, to give you hope in your latter end.";
yng[11] = "For I have known the thoughts that I am thinking towards you -- an affirmation of Jehovah; thoughts of peace, and not of evil, to give to you posterity and hope.";
dby[11] = "For I know the thoughts that I think toward you, saith Jehovah, thoughts of peace, and not of evil, to give you in your latter end a hope.";
web[11] = "For I know the thoughts that I think towards you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.";
hnv[11] = "For I know the thoughts that I think toward you, says the LORD, thoughts of shalom, and not of evil, to give you hope in your latter end.";
vul[11] = "ego enim scio cogitationes quas cogito super vos ait Dominus cogitationes pacis et non adflictionis ut dem vobis finem et patientiam";

asv[12] = "And ye shall call upon me, and ye shall go and pray unto me, and I will hearken unto you.";
yng[12] = "`And ye have called Me, and have gone, and have prayed unto Me, and I have hearkened unto you,";
dby[12] = "And ye shall call upon me, and ye shall go and pray unto me, and I will hearken unto you;";
web[12] = "Then shall ye call upon me, and ye shall go and pray to me, and I will hearken to you.";
hnv[12] = "You shall call on me, and you shall go and pray to me, and I will listen to you.";

rsv[13] = "You will seek me and find me; when you seek me with all your heart,";

yng[13] = "And ye have sought Me, and have found, for ye seek Me with all your heart;";

kjv[14] = "And I will be found of you, saith the LORD: and I will turn away your captivity, and I will gather you from all the nations, and from all the places whither I have driven you, saith the LORD; and I will bring you again into the place whence I caused you to be carried away captive.";
rsv[14] = "I will be found by you, says the LORD, and I will restore your fortunes and gather you from all the nations and all the places where I have driven you, says the LORD, and I will bring you back to the place from which I sent you into exile.";
asv[14] = "And I will be found of you, saith Jehovah, and I will turn again your captivity, and I will gather you from all the nations, and from all the places whither I have driven you, saith Jehovah; and I will bring you again unto the place whence I caused you to be carried away captive.";
yng[14] = "And I have been found of you -- an affirmation of Jehovah; and I have turned back [to] your captivity, and have gathered you out of all the nations, and out of all the places whither I have driven you -- an affirmation of Jehovah -- and I have brought you back unto the place whence I removed you.";
dby[14] = "and I will be found of you, saith Jehovah. And I will turn your captivity, and I will gather you from all the nations, and from all the places whither I have driven you, saith Jehovah; and I will bring you again into the place whence I have caused you to be carried away captive.";
web[14] = "And I will be found by you, saith the LORD: and I will turn away your captivity, and I will gather you from all the nations, and from all the places whither I have driven you, saith the LORD: and I will bring you again into the place whence I caused you to be carried away captive.";
hnv[14] = "I will be found of you, says the LORD, and I will turn again your captivity, and I will gather you from all the nations, and from all the places wither I have driven you, says the LORD; and I will bring you again to the place whence I caused you to be carried away captive.";
vul[14] = "et inveniar a vobis ait Dominus et reducam captivitatem vestram et congregabo vos de universis gentibus et de cunctis locis ad quae expuli vos dicit Dominus et reverti vos faciam de loco ad quem transmigrare vos feci";
kjv[15] = "Because ye have said, The LORD hath raised us up prophets in Babylon;";
rsv[15] = "&quot;Because you have said, \'The LORD has raised up prophets for us in Babylon,\'--";

hnv[15] = "Because you have said, the LORD has raised us up prophets in Bavel;";
vul[15] = "quia dixistis suscitavit nobis Dominus prophetas in Babylone";
kjv[16] = "[Know] that thus saith the LORD of the king that sitteth upon the throne of David, and of all the people that dwelleth in this city, [and] of your brethren that are not gone forth with you into captivity;";
rsv[16] = "Thus says the LORD concerning the king who sits on the throne of David, and concerning all the people who dwell in this city, your kinsmen who did not go out with you into exile:";
asv[16] = "thus saith Jehovah concerning the king that sitteth upon the throne of David, and concerning all the people that dwell in this city, your brethren that are not gone forth with you into captivity;";
yng[16] = "Surely thus said Jehovah concerning the king who is sitting on the throne of David, and concerning all the people that is dwelling in this city, your brethren who went not forth with you in the removal;";
dby[16] = "yea, thus saith Jehovah concerning the king that sitteth upon the throne of David, and concerning all the people that dwell in this city, your brethren that are not gone forth with you into captivity;";
web[16] = "[Know] that thus saith the LORD concerning the king that sitteth upon the throne of David, and concerning all the people that dwelleth in this city, [and] concerning your brethren that are not gone forth with you into captivity;";
hnv[16] = "thus says the LORD concerning the king who sits on the throne of David, and concerning all the people who dwell in this city, your brothers who haven\'t gone forth with you into captivity;";
vul[16] = "quia haec dicit Dominus ad regem qui sedet super solium David et ad omnem populum habitatorem urbis huius ad fratres vestros qui non sunt egressi vobiscum in transmigrationem";
kjv[17] = "Thus saith the LORD of hosts; Behold, I will send upon them the sword, the famine, and the pestilence, and will make them like vile figs, that cannot be eaten, they are so evil.";
rsv[17] = "\'Thus says the LORD of hosts, Behold, I am sending on them sword, famine, and pestilence, and I will make them like vile figs which are so bad they cannot be eaten.";
asv[17] = "thus saith Jehovah of hosts: Behold, I will send upon them the sword, the famine, and the pestilence, and will make them like vile figs, that cannot be eaten, they are so bad.";
yng[17] = "Thus said Jehovah of Hosts, Lo, I am sending among them the sword, the famine, and the pestilence, and I have given them up as figs that [are] vile, that are not eaten for badness.";
dby[17] = "thus saith Jehovah of hosts: Behold, I will send against them the sword, the famine, and the pestilence, and will make them like the vile figs, that cannot be eaten for badness.";
web[17] = "Thus saith the LORD of hosts; Behold, I will send upon them the sword, the famine, and the pestilence, and will make them like vile figs, that cannot be eaten, they are so bad.";
hnv[17] = "thus says the LORD of Hosts; Behold, I will send on them the sword, the famine, and the pestilence, and will make them like vile figs, that can\'t be eaten, they are so bad.";
vul[17] = "haec dicit Dominus exercituum ecce mittam in eis gladium et famem et pestem et ponam eos quasi ficus malas quae comedi non possunt eo quod pessimae sint";
kjv[18] = "And I will persecute them with the sword, with the famine, and with the pestilence, and will deliver them to be removed to all the kingdoms of the earth, to be a curse, and an astonishment, and an hissing, and a reproach, among all the nations whither I have driven them:";
rsv[18] = "I will pursue them with sword, famine, and pestilence, and will make them a horror to all the kingdoms of the earth, to be a curse, a terror, a hissing, and a reproach among all the nations where I have driven them,";
asv[18] = "And I will pursue after them with the sword, with the famine, and with the pestilence, and will deliver them to be tossed to and fro among all the kingdoms of the earth, to be an execration, and an astonishment, and a hissing, and a reproach, among all the nations whither I have driven them;";
yng[18] = "And I have pursued after them with sword, with famine, and with pestilence, and have given them for a trembling to all kingdoms of the earth, for a curse and for an astonishment, and for a hissing, and for a reproach among all the nations whither I have driven them,";
dby[18] = "And I will pursue them with the sword, with the famine, and with the pestilence, and will give them over to be driven hither and thither into all the kingdoms of the earth, to be an execration, and an astonishment, and a hissing, and a reproach, among all the nations whither I will drive them:";
web[18] = "And I will persecute them with the sword, with the famine, and with the pestilence, and will deliver them to be removed to all the kingdoms of the earth, to be a curse, and an astonishment, and a hissing, and a reproach, among all the nations whither I have driven them:";
hnv[18] = "I will pursue after them with the sword, with the famine, and with the pestilence, and will deliver them to be tossed back and forth among all the kingdoms of the eretz, to be an object of horror, and an astonishment, and a hissing, and a reproach, among all the nations where I have driven them;";
vul[18] = "et persequar eos in gladio in fame et in pestilentia et dabo eos in vexationem universis regnis terrae in maledictionem et in stuporem et in sibilum et in obprobrium cunctis gentibus ad quas ego eieci eos";
kjv[19] = "Because they have not hearkened to my words, saith the LORD, which I sent unto them by my servants the prophets, rising up early and sending [them]; but ye would not hear, saith the LORD.";
rsv[19] = "because they did not heed my words, says the LORD, which I persistently sent to you by my servants the prophets, but you would not listen, says the LORD.\'--";
asv[19] = "because they have not hearkened to my words, saith Jehovah, wherewith I sent unto them my servants the prophets, rising up early and sending them; but ye would not hear, saith Jehovah.";
yng[19] = "Because that they have not hearkened unto My words -- an affirmation of Jehovah -- that I sent unto them by My servants the prophets, rising early and sending, and ye hearkened not -- an affirmation of Jehovah.";
dby[19] = "because they have not hearkened to my words, saith Jehovah, wherewith I sent unto them my servants the prophets, rising early and sending; but ye have not hearkened, saith Jehovah.";
web[19] = "Because they have not hearkened to my words, saith the LORD, which I sent to them by my servants the prophets, rising early and sending [them]; but ye would not hear, saith the LORD.";
hnv[19] = "because they have not listened to my words, says the LORD, with which I sent to them my servants the prophets, rising up early and sending them; but you would not hear, says the LORD.";
vul[19] = "eo quod non audierint verba mea dicit Dominus quae misi ad eos per servos meos prophetas de nocte consurgens et mittens et non audistis dicit Dominus";
kjv[20] = "Hear ye therefore the word of the LORD, all ye of the captivity, whom I have sent from Jerusalem to Babylon:";
rsv[20] = "Hear the word of the LORD, all you exiles whom I sent away from Jerusalem to Babylon:";
asv[20] = "Hear ye therefore the word of Jehovah, all ye of the captivity, whom I have sent away from Jerusalem to Babylon.";
yng[20] = "`And ye, hear ye a word of Jehovah, all ye of the captivity that I have sent from Jerusalem to Babylon,";
dby[20] = "But ye, all ye of the captivity, whom I have sent from Jerusalem to Babylon, hear the word of Jehovah.";
web[20] = "Hear ye therefore the word of the LORD, all ye of the captivity, whom I have sent from Jerusalem to Babylon:";
hnv[20] = " Hear you therefore the word of the LORD, all you of the captivity, whom I have sent away from Yerushalayim to Bavel.";
vul[20] = "vos ergo audite verbum Domini omnis transmigratio quam emisi de Hierusalem in Babylonem";
kjv[21] = "Thus saith the LORD of hosts, the God of Israel, of Ahab the son of Kolaiah, and of Zedekiah the son of Maaseiah, which prophesy a lie unto you in my name; Behold, I will deliver them into the hand of Nebuchadrezzar king of Babylon; and he shall slay them before your eyes;";
rsv[21] = "\'Thus says the LORD of hosts, the God of Israel, concerning Ahab the son of Kola\'iah and Zedeki\'ah the son of Ma-asei\'ah, who are prophesying a lie to you in my name: Behold, I will deliver them into the hand of Nebuchadrez\'zar king of Babylon, and he shall slay them before your eyes.";
asv[21] = "Thus saith Jehovah of hosts, the God of Israel, concerning Ahab the son of Kolaiah, and concerning Zedekiah the son of Maaseiah, who prophesy a lie unto you in my name: Behold, I will deliver them into the hand of Nebuchadrezzar king of Babylon; and he shall slay them before your eyes;";
yng[21] = "Thus said Jehovah of Hosts, God of Israel, concerning Ahab son of Kolaiah, and concerning Zedekiah son of Maaseiah, who are prophesying to you in My name falsehood: Lo, I am giving them into the hand of Nebuchadrezzar king of Babylon, and he hath smitten them before your eyes,";
dby[21] = "Thus saith Jehovah of hosts, the God of Israel, concerning Ahab the son of Kolaiah, and concerning Zedekiah the son of Maaseiah, who prophesy falsehood unto you in my name: Behold, I will give them into the hand of Nebuchadrezzar king of Babylon, and he shall smite them before your eyes.";
web[21] = "Thus saith the LORD of hosts, the God of Israel, concerning Ahab the son of Kolaiah, and concerning Zedekiah the son of Maaseiah, who prophesy a lie to you in my name; Behold, I will deliver them into the hand of Nebuchadrezzar king of Babylon; and he shall slay them before your eyes;";
hnv[21] = "Thus says the LORD of Hosts, the God of Yisra\'el, concerning Ach\'av the son of Kolayah, and concerning Tzidkiyahu the son of Ma`aseyah, who prophesy a lie to you in my name: Behold, I will deliver them into the hand of Nevukhadretztzar king of Bavel; and he shall kill them before your eyes;";
vul[21] = "haec dicit Dominus exercituum Deus Israhel ad Ahab filium Culia et ad Sedeciam filium Maasiae qui prophetant vobis in nomine meo mendaciter ecce ego tradam eos in manu Nabuchodonosor regis Babylonis et percutiet eos in oculis vestris";
kjv[22] = "And of them shall be taken up a curse by all the captivity of Judah which [are] in Babylon, saying, The LORD make thee like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire;";
rsv[22] = "Because of them this curse shall be used by all the exiles from Judah in Babylon: &quot;The LORD make you like Zedeki\'ah and Ahab, whom the king of Babylon roasted in the fire,&quot;";
asv[22] = "and of them shall be taken up a curse by all the captives of Judah that are in Babylon, saying, Jehovah make thee like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire;";
yng[22] = "And taken from them hath been a reviling by all the removed of Judah that [are] in Babylon, saying, Jehovah doth set thee as Zedekiah, and as Ahab, whom the king of Babylon roasted with fire;";
dby[22] = "And of them shall be taken up a curse by all the captivity of Judah that are in Babylon, saying, Jehovah make thee like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire;";
web[22] = "And concerning them shall be taken up a curse by all the captivity of Judah who [are] in Babylon, saying, The LORD make thee like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire;";
hnv[22] = "and of them shall be taken up a curse by all the captives of Yehudah who are in Bavel, saying, the LORD make you like Tzidkiyahu and like Ach\'av, whom the king of Bavel roasted in the fire;";
vul[22] = "et adsumetur ex eis maledictio omni transmigrationi Iuda quae est in Babylone dicentium ponat te Dominus sicut Sedeciam et sicut Ahab quos frixit rex Babylonis in igne";
kjv[23] = "Because they have committed villany in Israel, and have committed adultery with their neighbours\' wives, and have spoken lying words in my name, which I have not commanded them; even I know, and [am] a witness, saith the LORD.";
rsv[23] = "because they have committed folly in Israel, they have committed adultery with their neighbors\' wives, and they have spoken in my name lying words which I did not command them. I am the one who knows, and I am witness, says the LORD.\'&quot;";
asv[23] = "because they have wrought folly in Israel, and have committed adultery with their neighbors\' wives, and have spoken words in my name falsely, which I commanded them not; and I am he that knoweth, and am witness, saith Jehovah.";
yng[23] = "Because that they have done folly in Israel, and commit adultery with the wives of their neighbours, and speak a word in My name falsely that I have not commanded them, and I [am] He who knoweth and a witness -- an affirmation of Jehovah.";
dby[23] = "because they have committed infamy in Israel, and have committed adultery with their neighbours\' wives, and have spoken words of falsehood in my name, which I had not commanded them: and I [am] he that knoweth, and [am] witness, saith Jehovah.";
web[23] = "Because they have committed villainy in Israel, and have committed adultery with their neighbor\'s wives, and have spoken lying words in my name, which I have not commanded them; even I know, and [am] a witness, saith the LORD.";
hnv[23] = " because they have worked folly in Yisra\'el, and have committed adultery with their neighbors\' wives, and have spoken words in my name falsely, which I didn\'t command them; and I am he who knows, and am witness, says the LORD.";
vul[23] = "pro eo quod fecerint stultitiam in Israhel et moechati sunt in uxores amicorum suorum et locuti sunt verbum in nomine meo mendaciter quod non mandavi eis ego sum iudex et testis dicit Dominus";
kjv[24] = "[Thus] shalt thou also speak to Shemaiah the Nehelamite, saying,";
rsv[24] = "To Shemai\'ah of Nehel\'am you shall say:";
asv[24] = "And concerning Shemaiah the Nehelamite thou shalt speak, saying,";
yng[24] = "`And unto Shemaiah the Nehelamite thou dost speak, saying,";
dby[24] = "And thou shalt speak to Shemaiah the Nehelamite, saying,";
web[24] = "[Thus] shalt thou also speak to Shemaiah the Nehelamite, saying,";
hnv[24] = "Concerning Shemayah the Nechelami you shall speak, saying,";
vul[24] = "et ad Semeiam Neelamiten dices";
kjv[25] = "Thus speaketh the LORD of hosts, the God of Israel, saying, Because thou hast sent letters in thy name unto all the people that [are] at Jerusalem, and to Zephaniah the son of Maaseiah the priest, and to all the priests, saying,";
rsv[25] = "&quot;Thus says the LORD of hosts, the God of Israel: You have sent letters in your name to all the people who are in Jerusalem, and to Zephani\'ah the son of Ma-asei\'ah the priest, and to all the priests, saying,";
asv[25] = "Thus speaketh Jehovah of hosts, the God of Israel, saying, Because thou hast sent letters in thine own name unto all the people that are at Jerusalem, and to Zephaniah the son of Maaseiah, the priest, and to all the priests, saying,";
yng[25] = "Thus said Jehovah of Hosts, God of Israel, saying, Because that thou hast sent in thy name letters unto all the people who [are] in Jerusalem, and unto Zephaniah son of Maaseiah the priest, and unto all the priests, saying,";
dby[25] = "Thus speaketh Jehovah of hosts, the God of Israel, saying, Because thou hast sent letters in thy name unto all the people that are at Jerusalem, and to Zephaniah the son of Maaseiah the priest, and to all the priests, saying,";
web[25] = "Thus speaketh the LORD of hosts, the God of Israel, saying, Because thou hast sent letters in thy name to all the people that [are] at Jerusalem, and to Zephaniah the son of Maaseiah the priest, and to all the priests, saying,";
hnv[25] = "Thus speaks the LORD of Hosts, the God of Yisra\'el, saying, Because you have sent letters in your own name to all the people who are at Yerushalayim, and to Tzefanyah the son of Ma`aseyah, the Kohen, and to all the Kohanim, saying,";
vul[25] = "haec dicit Dominus exercituum Deus Israhel pro eo quod misisti in nomine tuo libros ad omnem populum qui est in Hierusalem et ad Sophoniam filium Maasiae sacerdotem et ad universos sacerdotes dicens";
kjv[26] = "The LORD hath made thee priest in the stead of Jehoiada the priest, that ye should be officers in the house of the LORD, for every man [that is] mad, and maketh himself a prophet, that thou shouldest put him in prison, and in the stocks.";
rsv[26] = "\'The LORD has made you priest instead of Jehoi\'ada the priest, to have charge in the house of the LORD over every madman who prophesies, to put him in the stocks and collar.";
asv[26] = "Jehovah hath made thee priest in the stead of Jehoiada the priest, that there may be officers in the house of Jehovah, for every man that is mad, and maketh himself a prophet, that thou shouldest put him in the stocks and in shackles.";
yng[26] = "Jehovah hath made thee priest instead of Jehoiada the priest, for there being inspectors of the house of Jehovah, for every one mad and making himself a prophet, and thou hast put him unto the torture and unto the stocks.";
dby[26] = "Jehovah hath made thee priest in the stead of Jehoiada the priest, that there should be officers [in] the house of Jehovah, over every madman and self-made prophet, that thou shouldest put him in the stocks and in the shackles.";
web[26] = "The LORD hath made thee priest in the stead of Jehoiada the priest, that ye should be officers in the house of the LORD, for every man [that is] mad, and maketh himself a prophet, that thou shouldest put him in prison, and in the stocks.";
hnv[26] = "The LORD has made you Kohen in the place of Yehoiada the Kohen, that there may be officers in the house of the LORD, for every man who is mad, and makes himself a prophet, that you should put him in the stocks and in shackles.";
vul[26] = "Dominus dedit te sacerdotem pro Ioiadae sacerdote ut sis dux in domo Domini super omnem virum arrepticium et prophetantem ut mittas eum in nervum et in carcerem";
kjv[27] = "Now therefore why hast thou not reproved Jeremiah of Anathoth, which maketh himself a prophet to you?";
rsv[27] = "Now why have you not rebuked Jeremiah of An\'athoth who is prophesying to you?";
asv[27] = "Now therefore, why hast thou not rebuked Jeremiah of Anathoth, who maketh himself a prophet to you,";
yng[27] = "And now, why hast thou not pushed against Jeremiah of Anathoth, who is making himself a prophet to you?";
dby[27] = "And now, why hast thou not reproved Jeremiah of Anathoth, who maketh himself a prophet to you?";
web[27] = "Now therefore why hast thou not reproved Jeremiah of Anathoth, who maketh himself a prophet to you?";
hnv[27] = "Now therefore, why have you not rebuked Yirmeyahu of `Anatot, who makes himself a prophet to you,";
vul[27] = "et nunc quare non increpasti Hieremiam Anathothiten qui prophetat vobis";
kjv[28] = "For therefore he sent unto us [in] Babylon, saying, This [captivity is] long: build ye houses, and dwell [in them]; and plant gardens, and eat the fruit of them.";
rsv[28] = "For he has sent to us in Babylon, saying, &quot;Your exile will be long; build houses and live in them, and plant gardens and eat their produce.&quot;\'&quot;";
asv[28] = "forasmuch as he hath sent unto us in Babylon, saying, [The captivity] is long: build ye houses, and dwell in them; and plant gardens, and eat the fruit of them?";
yng[28] = "Because that he hath sent unto us to Babylon, saying, It [is] long, build ye houses, and abide; and plant ye gardens, and eat their fruit.\'";
dby[28] = "Forasmuch as he hath sent unto us in Babylon, saying, It will be long; build houses, and dwell [in them], and plant gardens, and eat the fruit of them.";
web[28] = "For therefore he sent to us [in] Babylon, saying, This [captivity is] long: build ye houses, and dwell [in them]; and plant gardens, and eat the fruit of them.";
hnv[28] = "because he has sent to us in Bavel, saying, [The captivity] is long: build you houses, and dwell in them; and plant gardens, and eat the fruit of them?";
vul[28] = "quia super hoc misit ad nos in Babylonem dicens longum est aedificate domos et habitate et plantate hortos et comedite fructum eorum";
kjv[29] = "And Zephaniah the priest read this letter in the ears of Jeremiah the prophet.";
rsv[29] = "Zephani\'ah the priest read this letter in the hearing of Jeremiah the prophet.";
asv[29] = "And Zephaniah the priest read this letter in the ears of Jeremiah the prophet.";
yng[29] = "And Zephaniah the priest readeth this letter in the ears of Jeremiah the prophet.";
dby[29] = "-- And Zephaniah the priest read this letter in the ears of the prophet Jeremiah.";
web[29] = "And Zephaniah the priest read this letter in the ears of Jeremiah the prophet.";
hnv[29] = "Tzefanyah the Kohen read this letter in the ears of Yirmeyahu the prophet.";
vul[29] = "legit ergo Sophonias sacerdos librum istum in auribus Hieremiae prophetae";
kjv[30] = "Then came the word of the LORD unto Jeremiah, saying,";
rsv[30] = "Then the word of the LORD came to Jeremiah:";
asv[30] = "Then came the word of Jehovah unto Jeremiah, saying,";
yng[30] = "And there is a word of Jehovah unto Jeremiah, saying,";
dby[30] = "And the word of Jehovah came unto Jeremiah, saying,";
web[30] = "Then came the word of the LORD to Jeremiah, saying,";
hnv[30] = "Then came the word of the LORD to Yirmeyahu, saying,";
vul[30] = "et factum est verbum Domini ad Hieremiam dicens";
kjv[31] = "Send to all them of the captivity, saying, Thus saith the LORD concerning Shemaiah the Nehelamite; Because that Shemaiah hath prophesied unto you, and I sent him not, and he caused you to trust in a lie:";
rsv[31] = "&quot;Send to all the exiles, saying, \'Thus says the LORD concerning Shemai\'ah of Nehel\'am: Because Shemai\'ah has prophesied to you when I did not send him, and has made you trust in a lie,";
asv[31] = "Send to all them of the captivity, saying, Thus saith Jehovah concerning Shemaiah the Nehelamite: Because that Shemaiah hath prophesied unto you, and I sent him not, and he hath caused you to trust in a lie;";
yng[31] = "`Send unto all the removal, saying, Thus said Jehovah concerning Shemaiah the Nehelamite, Because that Shemaiah prophesied to you, and I -- I have not sent him, and he doth cause you to trust on falsehood,";
dby[31] = "Send to all them of the captivity, saying, Thus saith Jehovah concerning Shemaiah the Nehelamite: Because that Shemaiah hath prophesied unto you, and I sent him not, and he hath caused you to trust in falsehood;";
web[31] = "Send to all them of the captivity, saying, Thus saith the LORD concerning Shemaiah the Nehelamite; Because Shemaiah hath prophesied to you, and I sent him not, and he caused you to trust in a lie:";
hnv[31] = "Send to all them of the captivity, saying, Thus says the LORD concerning Shemayah the Nechelami: Because Shemayah has prophesied to you, and I didn\'t send him, and he has caused you to trust in a lie;";
vul[31] = "mitte ad omnem transmigrationem dicens haec dicit Dominus ad Semeiam Neelamiten pro eo quod prophetavit vobis Semeias et ego non misi eum et fecit vos confidere in mendacio";
kjv[32] = "Therefore thus saith the LORD; Behold, I will punish Shemaiah the Nehelamite, and his seed: he shall not have a man to dwell among this people; neither shall he behold the good that I will do for my people, saith the LORD; because he hath taught rebellion against the LORD.";
rsv[32] = "therefore thus says the LORD: Behold, I will punish Shemai\'ah of Nehel\'am and his descendants; he shall not have any one living among this people to see the good that I will do to my people, says the LORD, for he has talked rebellion against the LORD.\'&quot;";
asv[32] = "therefore thus saith Jehovah, Behold, I will punish Shemaiah the Nehelamite, and his seed; he shall not have a man to dwell among this people, neither shall he behold the good that I will do unto my people, saith Jehovah, because he hath spoken rebellion against Jehovah.";
yng[32] = "Therefore, thus said Jehovah, Lo, I am seeing after Shemaiah the Nehelamite, and after his seed, he hath none dwelling in the midst of this people, nor doth he look on the good that I am doing to My people -- an affirmation of Jehovah -- for apostacy he hath spoken against Jehovah.\'";
dby[32] = "therefore thus saith Jehovah: Behold, I will punish Shemaiah the Nehelamite, and his seed: he shall not have a man to dwell among this people; neither shall he see the good that I will do for my people, saith Jehovah; because he hath spoken revolt against Jehovah.";
web[32] = "Therefore thus saith the LORD; Behold, I will punish Shemaiah the Nehelamite, and his seed: he shall not have a man to dwell among this people; neither shall he behold the good that I will do for my people, saith the LORD; because he hath taught rebellion against the LORD.";
hnv[32] = "therefore thus says the LORD, Behold, I will punish Shemayah the Nechelami, and his seed; he shall not have a man to dwell among this people, neither shall he see the good that I will do to my people, says the LORD, because he has spoken rebellion against the LORD.";
vul[32] = "idcirco haec dicit Dominus ecce ego visitabo super Semeiam Neelamiten et super semen eius non erit ei vir sedens in medio populi huius et non videbit bonum quod ego faciam populo meo ait Dominus quia praevaricationem locutus est adversum Dominum";
