csb[1] = "Zedekiah son of Josiah reigned as king in the land of Judah in place of Coniah son of Jehoiakim, for King Nebuchadnezzar of Babylon made him king.";
csb[2] = "He and his officers and the people of the land did not obey the words of the LORD that he spoke through the prophet Jeremiah.";
csb[3] = "Nevertheless, King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah, the priest, to the prophet Jeremiah, requesting, &quot;Please pray to the LORD our God for us! &quot;";
csb[4] = "Jeremiah was going about his daily tasks among the people, for he had not yet been put into the prison.";
csb[5] = "Pharaoh\'s army had left Egypt, and when the Chaldeans, who were besieging Jerusalem, heard the report, they withdrew from Jerusalem.";
csb[6] = "The word of the LORD came to the prophet Jeremiah:";
csb[7] = "&quot;This is what the LORD, the God of Israel, says: This is what you will say to Judah\'s king, who is sending you to inquire of me: \'Watch: Pharaoh\'s army, which has come out to help you, is going to return to its own land of Egypt.";
csb[8] = "&quot;The Chaldeans will then return and fight against this city. They will capture it and burn it.";
csb[9] = "&quot;This is what the LORD says: Don\'t deceive yourselves by saying, &quot;The Chaldeans will leave us for good,&quot; for they will not leave.";
csb[10] = "Indeed, if you were to strike down the entire Chaldean army that is fighting with you, and there remained among them only the badly wounded men, each in his tent, they would get up and burn this city.\' &quot;";
csb[11] = "When the Chaldean army withdrew from Jerusalem because of Pharaoh\'s army,";
csb[12] = "Jeremiah started to leave Jerusalem to go to the land of Benjamin to claim his portion there among the people.";
csb[13] = "But when he was at the Benjamin Gate, an officer of the guard was there, whose name was Irijah son of Shelemiah, son of Hananiah, and he apprehended the prophet Jeremiah, saying, &quot;You are defecting to the Chaldeans.&quot;";
csb[14] = "&quot;That\'s a lie,&quot; Jeremiah replied. &quot;I am not defecting to the Chaldeans! &quot; Irijah would not listen to him but apprehended Jeremiah and took him to the officials.";
csb[15] = "The officials were angry at Jeremiah and beat him and placed him in jail in the house of Jonathan the scribe, for it had been made into a prison.";
csb[16] = "So Jeremiah went into a cell in the dungeon and stayed there many days.";
csb[17] = "King Zedekiah later sent for him and received him, and in his house privately asked him, &quot;Is there a word from the LORD? &quot; &quot;There is,&quot; Jeremiah responded. He continued, &quot;You will be handed over to the king of Babylon.&quot;";
csb[18] = "Then Jeremiah said to King Zedekiah, &quot;How have I sinned against you or your servants or these people that you have put me in prison?";
csb[19] = "&quot;Where are your prophets who prophesied to you, claiming, \'The king of Babylon will not come against you and this land\'?";
csb[20] = "&quot;So now please listen, my lord the king. May my petition come before you. Don\'t send me back to the house of Jonathan the scribe, or I will die there.&quot;";
csb[21] = "So King Zedekiah gave orders, and Jeremiah was placed in the guard\'s courtyard. He was given a loaf of bread each day from the bakers\' street until all the bread was gone from the city. So Jeremiah remained in the guard\'s courtyard.";

rsv[3] = "King Zedeki\'ah sent Jehu\'cal the son of Shelemi\'ah, and Zephani\'ah the priest, the son of Ma-asei\'ah, to Jeremiah the prophet, saying, &quot;Pray for us to the LORD our God.&quot;";

asv[18] = "Moreover Jeremiah said unto king Zedekiah, Wherein have I sinned against thee, or against thy servants, or against this people, that ye have put me in prison?";
yng[18] = "And Jeremiah saith unto the king Zedekiah, `What have I sinned against thee, and against thy servants, and against this people, that ye have given me unto a prison-house?";
dby[18] = "And Jeremiah said unto king Zedekiah, What have I offended against thee, or against thy servants, or against this people, that ye have put me in the prison?";
web[18] = "Moreover Jeremiah said to king Zedekiah, In what have I offended against thee, or against thy servants, or against this people, that ye have put me in prison?";
hnv[18] = "Moreover Yirmeyahu said to king Tzidkiyahu, Wherein have I sinned against you, or against your servants, or against this people, that you have put me in prison?";
vul[18] = "[Vulgate 37:17] et dixit Hieremias ad regem Sedeciam quid peccavi tibi et servis tuis et populo tuo quia misisti me in domum carceris";
kjv[19] = "Where [are] now your prophets which prophesied unto you, saying, The king of Babylon shall not come against you, nor against this land?";
rsv[19] = "Where are your prophets who prophesied to you, saying, \'The king of Babylon will not come against you and against this land\'?";
asv[19] = "Where now are your prophets that prophesied unto you, saying, The king of Babylon shall not come against you, nor against this land?";
yng[19] = "And where [are] your prophets who prophesied to you, saying, The king of Babylon doth not come in against you, and against this land?";
dby[19] = "And where are your prophets that prophesied unto you, saying, The king of Babylon shall not come against you, nor against this land?";
web[19] = "Where [are] now your prophets who prophesied to you, saying, The king of Babylon shall not come against you, nor against this land?";
hnv[19] = "Where now are your prophets who prophesied to you, saying, The king of Bavel shall not come against you, nor against this land?";
vul[19] = "[Vulgate 37:18] ubi sunt prophetae vestri qui prophetabant vobis et dicebant non veniet rex Babylonis super vos et super terram hanc";
kjv[20] = "Therefore hear now, I pray thee, O my lord the king: let my supplication, I pray thee, be accepted before thee; that thou cause me not to return to the house of Jonathan the scribe, lest I die there.";
rsv[20] = "Now hear, I pray you, O my lord the king: let my humble plea come before you, and do not send me back to the house of Jonathan the secretary, lest I die there.&quot;";
asv[20] = "And now hear, I pray thee, O my lord the king: let my supplication, I pray thee, be presented before thee, that thou cause me not to return to the house of Jonathan the scribe, lest I die there.";
yng[20] = "And now, hearken, I pray thee, my lord, O king, let my supplication fall, I pray thee, before thee, and cause me not to return [to] the house of Jonathan the scribe, that I die not there.\'";
dby[20] = "And now hear, I pray thee, my lord, O king: let my supplication, I pray thee, come before thee; and cause me not to return into the house of Jonathan the scribe, lest I die there.";
web[20] = "Therefore hear now, I pray thee, O my lord the king: let my supplication, I pray thee, be accepted before thee; that thou cause me not to return to the house of Jonathan the scribe, lest I die there.";
hnv[20] = "Now please hear, my lord the king: please let my supplication be presented before you, that you not cause me to return to the house of Yonatan the Sofer, lest I die there.";
vul[20] = "[Vulgate 37:19] nunc ergo audi obsecro domine mi rex valeat deprecatio mea in conspectu tuo et ne me remittas in domum Ionathan scribae ne moriar ibi";
kjv[21] = "Then Zedekiah the king commanded that they should commit Jeremiah into the court of the prison, and that they should give him daily a piece of bread out of the bakers\' street, until all the bread in the city were spent. Thus Jeremiah remained in the court of the prison.";
rsv[21] = "So King Zedeki\'ah gave orders, and they committed Jeremiah to the court of the guard; and a loaf of bread was given him daily from the bakers\' street, until all the bread of the city was gone. So Jeremiah remained in the court of the guard.";
asv[21] = "Then Zedekiah the king commanded, and they committed Jeremiah into the court of the guard; and they gave him daily a loaf of bread out of the bakers\' street, until all the bread in the city was spent. Thus Jeremiah remained in the court of the guard.";
yng[21] = "And the king Zedekiah commandeth, and they commit Jeremiah into the court of the prison, also to give to him a cake of bread daily from the bakers\' street, till the consumption of all the bread of the city, and Jeremiah dwelleth in the court of the prison.";
dby[21] = "Then Zedekiah the king commanded, and they committed Jeremiah into the court of the guard, and they gave him daily a loaf of bread out of the bakers\' street, until all the bread in the city was spent. And Jeremiah abode in the court of the guard.";
web[21] = "Then Zedekiah the king commanded that they should commit Jeremiah into the court of the prison, and that they should give him daily a piece of bread out of the baker\'s street, until all the bread in the city should be consumed. Thus Jeremiah remained in the court of the prison.";
hnv[21] = "Then Tzidkiyahu the king commanded, and they committed Yirmeyahu into the court of the guard; and they gave him daily a loaf of bread out of the bakers\' street, until all the bread in the city was spent. Thus Yirmeyahu remained in the court of the guard.";
vul[21] = "[Vulgate 37:20] praecepit ergo rex Sedecias ut traderetur Hieremias in vestibulo carceris et daretur ei torta panis cotidie excepto pulmento donec consumerentur omnes panes de civitate et mansit Hieremias in vestibulo carceris";
</script>
