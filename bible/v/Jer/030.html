csb[1] = "This is the word that came to Jeremiah from the LORD.";
csb[2] = "&quot;This is what the LORD, the God of Israel, says: Write on a scroll all the words that I have spoken to you,";
csb[3] = "&quot;for look, the days are coming&quot; -- this is the LORD\'s declaration -- &quot;when I will restore the fortunes of my people Israel and Judah,&quot; says the LORD. &quot;I will restore them to the land I gave to their ancestors and they will possess it.&quot;";
csb[4] = "These are the words the LORD spoke to Israel and Judah.";
csb[5] = "This is what the LORD says: We have heard a cry of terror, of dread -- there is no peace.";
csb[6] = "Ask and see whether a male can give birth. Why then do I see every man with his hands on his stomach like a woman in labor and every face turned pale?";
csb[7] = "How awful that day will be! There will be no other like it! It will be a time of trouble for Jacob, but he will be saved out of it.";
csb[8] = "On that day -- this is the declaration of the LORD of Armies -- I will break his yoke from your neck and tear off your chains, and strangers will never again enslave him.";
csb[9] = "They will serve the LORD their God and David their king, whom I will raise up for them.";
csb[10] = "As for you, my servant Jacob, do not be afraid -- this is the LORD\'s declaration -- and do not be discouraged, Israel, for without fail I will save you out of a distant place, your descendants, from the land of their captivity! Jacob will return and have calm and quiet with no one to frighten him.";
csb[11] = "For I will be with you -- this is the LORD\'s declaration -- to save you! I will bring destruction on all the nations where I have scattered you; however, I will not bring destruction on you. I will discipline you justly, and I will by no means leave you unpunished.";
csb[12] = "For this is what the LORD says: Your injury is incurable; your wound most severe.";
csb[13] = "You have no defender for your case. There is no remedy for your sores, and no healing for you.";
csb[14] = "All your lovers have forgotten you; they no longer look for you, for I have struck you as an enemy would, with the discipline of someone cruel, because of your enormous guilt and your innumerable sins.";
csb[15] = "Why do you cry out about your injury? Your pain has no cure! I have done these things to you because of your enormous guilt and your innumerable sins.";
csb[16] = "Nevertheless, all who devoured you will be devoured, and all your adversaries -- all of them -- will go off into exile. Those who plunder you will be plundered, and all who raid you will be raided.";
csb[17] = "But I will bring you health and will heal you of your wounds -- this is the LORD\'s declaration -- for they call you Outcast, Zion whom no one cares about.";
csb[18] = "This is what the LORD says: I will certainly restore the fortunes of Jacob\'s tents and show compassion on his dwellings. Every city will be rebuilt on its mound; every citadel will stand on its proper site.";
csb[19] = "Thanksgiving will come out of them, a sound of rejoicing. I will multiply them, and they will not decrease; I will honor them, and they will not be insignificant.";
csb[20] = "His children will be as in past days; his congregation will be established in my presence. I will punish all his oppressors.";
csb[21] = "Jacob\'s leader will be one of them; his ruler will issue from him. I will invite him to me, and he will approach me, for who would otherwise risk his life to approach me? This is the LORD\'s declaration.";
csb[22] = "You will be my people, and I will be your God.";
csb[23] = "Look, a storm from the LORD! Wrath has gone out, a churning storm. It will whirl about the heads of the wicked.";
csb[24] = "The LORD\'s burning anger will not turn back until he has completely fulfilled the purposes of his heart. In time to come you will understand it.";
kjv[1] = "The word that came to Jeremiah from the LORD, saying,";
kjv[2] = "Thus speaketh the LORD God of Israel, saying, Write thee all the words that I have spoken unto thee in a book.";
kjv[3] = "For, lo, the days come, saith the LORD, that I will bring again the captivity of my people Israel and Judah, saith the LORD: and I will cause them to return to the land that I gave to their fathers, and they shall possess it.";
kjv[4] = "And these [are] the words that the LORD spake concerning Israel and concerning Judah.";
kjv[5] = "For thus saith the LORD; We have heard a voice of trembling, of fear, and not of peace.";
kjv[6] = "Ask ye now, and see whether a man doth travail with child? wherefore do I see every man with his hands on his loins, as a woman in travail, and all faces are turned into paleness?";
kjv[7] = "Alas! for that day [is] great, so that none [is] like it: it [is] even the time of Jacob\'s trouble; but he shall be saved out of it.";
kjv[8] = "For it shall come to pass in that day, saith the LORD of hosts, [that] I will break his yoke from off thy neck, and will burst thy bonds, and strangers shall no more serve themselves of him:";
kjv[9] = "But they shall serve the LORD their God, and David their king, whom I will raise up unto them.";
kjv[10] = "Therefore fear thou not, O my servant Jacob, saith the LORD; neither be dismayed, O Israel: for, lo, I will save thee from afar, and thy seed from the land of their captivity; and Jacob shall return, and shall be in rest, and be quiet, and none shall make [him] afraid.";
kjv[11] = "For I [am] with thee, saith the LORD, to save thee: though I make a full end of all nations whither I have scattered thee, yet will I not make a full end of thee: but I will correct thee in measure, and will not leave thee altogether unpunished.";
kjv[12] = "For thus saith the LORD, Thy bruise [is] incurable, [and] thy wound [is] grievous.";
kjv[13] = "[There is] none to plead thy cause, that thou mayest be bound up: thou hast no healing medicines.";
kjv[14] = "All thy lovers have forgotten thee; they seek thee not; for I have wounded thee with the wound of an enemy, with the chastisement of a cruel one, for the multitude of thine iniquity; [because] thy sins were increased.";
kjv[15] = "Why criest thou for thine affliction? thy sorrow [is] incurable for the multitude of thine iniquity: [because] thy sins were increased, I have done these things unto thee.";
kjv[16] = "Therefore all they that devour thee shall be devoured; and all thine adversaries, every one of them, shall go into captivity; and they that spoil thee shall be a spoil, and all that prey upon thee will I give for a prey.";
kjv[17] = "For I will restore health unto thee, and I will heal thee of thy wounds, saith the LORD; because they called thee an Outcast, [saying], This [is] Zion, whom no man seeketh after.";
kjv[18] = "Thus saith the LORD; Behold, I will bring again the captivity of Jacob\'s tents, and have mercy on his dwellingplaces; and the city shall be builded upon her own heap, and the palace shall remain after the manner thereof.";
kjv[19] = "And out of them shall proceed thanksgiving and the voice of them that make merry: and I will multiply them, and they shall not be few; I will also glorify them, and they shall not be small.";
kjv[20] = "Their children also shall be as aforetime, and their congregation shall be established before me, and I will punish all that oppress them.";
kjv[21] = "And their nobles shall be of themselves, and their governor shall proceed from the midst of them; and I will cause him to draw near, and he shall approach unto me: for who [is] this that engaged his heart to approach unto me? saith the LORD.";
kjv[22] = "And ye shall be my people, and I will be your God.";
kjv[23] = "Behold, the whirlwind of the LORD goeth forth with fury, a continuing whirlwind: it shall fall with pain upon the head of the wicked.";
kjv[24] = "The fierce anger of the LORD shall not return, until he have done [it], and until he have performed the intents of his heart: in the latter days ye shall consider it.";

asv[10] = "Therefore fear thou not, O Jacob my servant, saith Jehovah; neither be dismayed, O Israel: for, lo, I will save thee from afar, and thy seed from the land of their captivity; and Jacob shall return, and shall be quiet and at ease, and none shall make him afraid.";

vul[17] = "obducam enim cicatricem tibi et a vulneribus tuis sanabo te dicit Dominus quia Eiectam vocaverunt te Sion haec est quae non habebat requirentem";
rsv[18] = "&quot;Thus says the LORD: Behold, I will restore the fortunes of the tents of Jacob, and have compassion on his dwellings; the city shall be rebuilt upon its mound, and the palace shall stand where it used to be.";
asv[18] = "Thus saith Jehovah: Behold, I will turn again the captivity of Jacob\'s tents, and have compassion on his dwelling-places; and the city shall be builded upon its own hill, and the palace shall be inhabited after its own manner.";
yng[18] = "Thus said Jehovah: Lo, I turn back [to] the captivity of the tents of Jacob, And his dwelling places I pity, And the city hath been built on its heap, And the palace according to its ordinance remaineth.";
dby[18] = "Thus saith Jehovah: Behold, I will turn the captivity of Jacob\'s tents, and have mercy on his habitations; and the city shall be built upon her own heap; and the palace shall be inhabited after the manner thereof.";
web[18] = "Thus saith the LORD; Behold, I will bring again the captivity of Jacob\'s tents, and have mercy on his dwelling places; and the city shall be built upon her own heap, and the palace shall remain after its manner.";
hnv[18] = "Thus says the LORD: Behold, I will turn again the captivity of Ya`akov\'s tents, and have compassion on his dwelling-places; and the city shall be built on its own hill, and the palace shall be inhabited after its own manner.";
vul[18] = "haec dicit Dominus ecce ego convertam conversionem tabernaculorum Iacob et tectis eius miserebor et aedificabitur civitas in excelso suo et templum iuxta ordinem suum fundabitur";
rsv[19] = "Out of them shall come songs of thanksgiving, and the voices of those who make merry. I will multiply them, and they shall not be few; I will make them honored, and they shall not be small.";
asv[19] = "And out of them shall proceed thanksgiving and the voice of them that make merry: and I will multiply them, and they shall not be few; I will also glorify them, and they shall not be small.";
yng[19] = "And gone forth from them hath thanksgiving, And the voice of playful ones, And I have multiplied them and they are not few, And made them honourable, and they are not small.";
dby[19] = "And out of them shall proceed thanksgiving, and the voice of them that make merry: and I will multiply them, and they shall not be diminished; and I will honour them, and they shall not be small.";
web[19] = "And out of them shall proceed thanksgiving and the voice of them that make merry: and I will multiply them, and they shall not be few; I will also glorify them, and they shall not be small.";
hnv[19] = "Out of them shall proceed thanksgiving and the voice of those who make merry: and I will multiply them, and they shall not be few; I will also glorify them, and they shall not be small.";
vul[19] = "et egredietur de eis laus voxque ludentium et multiplicabo eos et non inminuentur et glorificabo eos et non adtenuabuntur";
rsv[20] = "Their children shall be as they were of old, and their congregation shall be established before me; and I will punish all who oppress them.";
asv[20] = "Their children also shall be as aforetime, and their congregation shall be established before me; and I will punish all that oppress them.";
yng[20] = "And his sons have been as aforetime, And his company before Me is established, And I have seen after all his oppressors.";
dby[20] = "And their sons shall be as aforetime; and their assembly shall be established before me; and I will punish all that oppress them.";
web[20] = "Their children also shall be as in former time, and their congregation shall be established before me, and I will punish all that oppress them.";
hnv[20] = "Their children also shall be as before, and their congregation shall be established before me; and I will punish all who oppress them.";
vul[20] = "et erunt filii eius sicut a principio et coetus eius coram me permanebit et visitabo adversum omnes qui tribulant eum";
rsv[21] = "Their prince shall be one of themselves, their ruler shall come forth from their midst; I will make him draw near, and he shall approach me, for who would dare of himself to approach me? says the LORD.";
asv[21] = "And their prince shall be of themselves, and their ruler shall proceed from the midst of them; and I will cause him to draw near, and he shall approach unto me: for who is he that hath had boldness to approach unto me? saith Jehovah.";
yng[21] = "And his honourable one hath been of himself, And his ruler from his midst goeth forth, And I have caused him to draw near, And he hath drawn nigh unto Me, For who [is] he who hath pledged his heart To draw nigh unto Me? An affirmation of Jehovah.";
dby[21] = "And their prince shall be of themselves, and their ruler shall proceed from the midst of them; and I will cause him to approach, and he shall draw near unto me. For who is this that engageth his heart to draw near unto me? saith Jehovah.";
web[21] = "And their nobles shall be from themselves, and their governor shall proceed from the midst of them; and I will cause him to draw near, and he shall approach time: for who [is] this that engaged his heart to approach to me? saith the LORD.";
hnv[21] = "Their prince shall be of themselves, and their ruler shall proceed from the midst of them; and I will cause him to draw near, and he shall approach to me: for who is he who has had boldness to approach to me? says the LORD.";
vul[21] = "et erit dux eius ex eo et princeps de medio eius producetur et adplicabo eum et accedet ad me quis enim iste est qui adplicet cor suum ut adpropinquet mihi ait Dominus";
rsv[22] = "And you shall be my people, and I will be your God.&quot;";
asv[22] = "And ye shall be my people, and I will be your God.";
yng[22] = "And ye have been to Me for a people, And I am to you for God.";
dby[22] = "And ye shall be my people, and I will be your God.";
web[22] = "And ye shall be my people, and I will be your God.";
hnv[22] = "You shall be my people, and I will be your God.";
vul[22] = "et eritis mihi in populum et ego ero vobis in Deum";
rsv[23] = "Behold the storm of the LORD! Wrath has gone forth, a whirling tempest; it will burst upon the head of the wicked.";
asv[23] = "Behold, the tempest of Jehovah, [even his] wrath, is gone forth, a sweeping tempest: it shall burst upon the head of the wicked.";
yng[23] = "Lo, a whirlwind of Jehovah -- Fury hath gone forth -- a cutting whirlwind, On the head of the wicked it stayeth.";
dby[23] = "Behold, a tempest of Jehovah, fury is gone forth, a sweeping storm: it shall whirl down upon the head of the wicked.";
web[23] = "Behold, the whirlwind of the LORD goeth forth with fury, a continuing whirlwind: it shall fall with pain upon the head of the wicked.";
hnv[23] = "Behold, the tempest of the LORD, [even his] wrath, is gone forth, a sweeping tempest: it shall burst on the head of the wicked.";
vul[23] = "ecce turbo Domini furor egrediens procella ruens in capite impiorum conquiescet";
rsv[24] = "The fierce anger of the LORD will not turn back until he has executed and accomplished the intents of his mind. In the latter days you will understand this.";
asv[24] = "The fierce anger of Jehovah shall not return, until he have executed, and till he have performed the intents of his heart: in the latter days ye shall understand it.";
yng[24] = "The fierceness of the anger of Jehovah Doth not turn back till His doing, Yea, till His establishing the devices of His heart, In the latter end of the days we consider it!";
dby[24] = "The fierce anger of Jehovah shall not return, until he have executed, and until he have performed the purposes of his heart. At the end of the days ye shall consider it.";
web[24] = "The fierce anger of the LORD shall not return, until he hath done [it], and until he hath performed the intents of his heart: in the latter days ye shall consider it.";
hnv[24] = "The fierce anger of the LORD shall not return, until he has executed, and until he have performed the intents of his heart: in the latter days you shall understand it.";
vul[24] = "non avertet iram indignationis Dominus donec faciat et conpleat cogitationem cordis sui in novissimo dierum intellegetis ea";
