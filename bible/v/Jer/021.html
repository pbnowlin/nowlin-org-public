csb[1] = "This is the word that came to Jeremiah from the LORD when King Zedekiah sent Pashhur son of Malchijah and the priest Zephaniah son of Maaseiah to Jeremiah, asking,";
csb[2] = "&quot;Inquire of the LORD on our behalf, since King Nebuchadnezzar of Babylon is making war against us. Perhaps the LORD will perform for us something like all his past wondrous works so that Nebuchadnezzar will withdraw from us.&quot;";
csb[3] = "But Jeremiah answered, &quot;This is what you are to say to Zedekiah:";
csb[4] = "&quot;\'This is what the LORD, the God of Israel, says: I am about to repel the weapons of war in your hands, those you are using to fight the king of Babylon and the Chaldeans who are besieging you outside the wall, and I will bring them into the center of this city.";
csb[5] = "&quot;I myself will fight against you with an outstretched hand and a strong arm, with anger, rage, and intense wrath.";
csb[6] = "&quot;I will strike the residents of this city, both people and animals. They will die in a severe plague.";
csb[7] = "&quot;Afterward -- this is the LORD\'s declaration -- King Zedekiah of Judah, his officers, and the people -- those in this city who survive the plague, the sword, and the famine -- I will hand over to King Nebuchadnezzar of Babylon, to their enemies, yes, to those who intend to take their lives. He will put them to the sword; he won\'t spare them or show pity or compassion.\'";
csb[8] = "&quot;But tell this people, \'This is what the LORD says: Look, I am setting before you the way of life and the way of death.";
csb[9] = "&quot;Whoever stays in this city will die by the sword, famine, and plague, but whoever goes out and surrenders to the Chaldeans who are besieging you will live and will retain his life like the spoils of war.";
csb[10] = "&quot;For I have set my face against this city to bring disaster and not good -- this is the LORD\'s declaration. It will be handed over to the king of Babylon, who will burn it.\'";
csb[11] = "&quot;And to the house of the king of Judah say this: \'Hear the word of the LORD!";
csb[12] = "&quot;House of David, this is what the LORD says: Administer justice every morning, and rescue the victim of robbery from his oppressor, or my anger will flare up like fire and burn unquenchably because of your evil deeds.";
csb[13] = "&quot;Beware! I am against you, you who sit above the valley, you atop the rocky plateau -- this is the LORD\'s declaration -- you who say, &quot;Who can come down against us? Who can enter our hiding places? &quot;";
csb[14] = "I will punish you according to what you have done -- this is the LORD\'s declaration. I will kindle a fire in your forest that will consume everything around it.\' &quot;";

kjv[2] = "Enquire, I pray thee, of the LORD for us; for Nebuchadrezzar king of Babylon maketh war against us; if so be that the LORD will deal with us according to all his wondrous works, that he may go up from us.";
rsv[2] = "&quot;Inquire of the LORD for us, for Nebuchadrez\'zar king of Babylon is making war against us; perhaps the LORD will deal with us according to all his wonderful deeds, and will make him withdraw from us.&quot;";
asv[2] = "Inquire, I pray thee, of Jehovah for us; for Nebuchadrezzar king of Babylon maketh war against us: peradventure Jehovah will deal with us according to all his wondrous works, that he may go up from us.";
yng[2] = "`Inquire, we pray thee, for us at Jehovah, for Nebuchadrezzar king of Babylon hath fought against us; perhaps Jehovah doth deal with us according to all His wonders, and doth cause him to go up from off us.\'";
dby[2] = "Inquire, I pray thee, of Jehovah for us; for Nebuchadrezzar the king of Babylon maketh war against us; if so be that Jehovah will deal with us according to all his marvellous works, that he may go up from us.";
web[2] = "Inquire, I pray thee, of the LORD for us; for Nebuchadnezzar king of Babylon maketh war against us; it may be that the LORD will deal with us according to all his wondrous works, that he may go up from us.";
hnv[2] = "Please inquire of the LORD for us; for Nevukhadretztzar king of Bavel makes war against us: peradventure the LORD will deal with us according to all his wondrous works, that he may go up from us.";
vul[2] = "interroga pro nobis Dominum quia Nabuchodonosor rex Babylonis proeliatur adversum nos si forte faciat Dominus nobiscum secundum omnia mirabilia sua et recedat a nobis";

kjv[4] = "Thus saith the LORD God of Israel; Behold, I will turn back the weapons of war that [are] in your hands, wherewith ye fight against the king of Babylon, and [against] the Chaldeans, which besiege you without the walls, and I will assemble them into the midst of this city.";
rsv[4] = "&quot;Thus you shall say to Zedeki\'ah, \'Thus says the LORD, the God of Israel: Behold, I will turn back the weapons of war which are in your hands and with which you are fighting against the king of Babylon and against the Chalde\'ans who are besieging you outside the walls; and I will bring them together into the midst of this city.";
asv[4] = "Thus saith Jehovah, the God of Israel, Behold, I will turn back the weapons of war that are in your hands, wherewith ye fight against the king of Babylon, and against the Chaldeans that besiege you, without the walls; and I will gather them into the midst of this city.";
yng[4] = "Thus said Jehovah, God of Israel: Lo, I am turning round the weapons of battle That [are] in your hand, With which ye do fight the king of Babylon, And the Chaldeans, who are laying siege against you, At the outside of the wall, And I have gathered them into the midst of this city,";
dby[4] = "Thus saith Jehovah the God of Israel: Behold, I will turn back the weapons of war that are in your hands, with which ye fight against the king of Babylon, and against the Chaldeans who besiege you, outside the walls, and I will assemble them into the midst of this city.";
web[4] = "Thus saith the LORD God of Israel; Behold, I will turn back the weapons of war that [are] in your hands, with which ye fight against the king of Babylon, and [against] the Chaldeans, who besiege you without the walls, and I will assemble them into the midst of this city.";
hnv[4] = "Thus says the LORD, the God of Yisra\'el, Behold, I will turn back the weapons of war that are in your hands, with which you fight against the king of Bavel, and against the Kasdim who besiege you, without the walls; and I will gather them into the midst of this city.";

kjv[7] = "And afterward, saith the LORD, I will deliver Zedekiah king of Judah, and his servants, and the people, and such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nebuchadrezzar king of Babylon, and into the hand of their enemies, and into the hand of those that seek their life: and he shall smite them with the edge of the sword; he shall not spare them, neither have pity, nor have mercy.";
rsv[7] = "Afterward, says the LORD, I will give Zedeki\'ah king of Judah, and his servants, and the people in this city who survive the pestilence, sword, and famine, into the hand of Nebuchadrez\'zar king of Babylon and into the hand of their enemies, into the hand of those who seek their lives. He shall smite them with the edge of the sword; he shall not pity them, or spare them, or have compassion.\'";
asv[7] = "And afterward, saith Jehovah, I will deliver Zedekiah king of Judah, and his servants, and the people, even such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nebuchadrezzar king of Babylon, and into the hand of their enemies, and into the hand of those that seek their life: and he shall smite them with the edge of the sword; he shall not spare them, neither have pity, nor have mercy.";
yng[7] = "And after this -- an affirmation of Jehovah, I give Zedekiah king of Judah, And his servants, and the people, And those left in this city, From the pestilence, from the sword, and from the famine, Into the hand of Nebuchadrezzar king of Babylon, And into the hand of their enemies, And into the hand of those seeking their life, And he hath smitten them by the mouth of the sword, He hath no pity on them, Nor doth he spare, nor hath he mercy.";
dby[7] = "And afterwards, saith Jehovah, I will give Zedekiah king of Judah, and his servants, and the people, and such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nebuchadrezzar the king of Babylon, and into the hand of their enemies, and into the hand of those that seek their life, and he shall smite them with the edge of the sword: he shall not spare them, neither have pity, nor have mercy.";
web[7] = "And afterward, saith the LORD, I will deliver Zedekiah king of Judah, and his servants, and the people, and such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nebuchadnezzar king of Babylon, and into the hand of their enemies, and into the hand of those that seek their life; and he shall smite them with the edge of the sword; he shall not spare them, neither have pity, nor have mercy.";
hnv[7] = " Afterward, says the LORD, I will deliver Tzidkiyahu king of Yehudah, and his servants, and the people, even such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nevukhadretztzar king of Bavel, and into the hand of their enemies, and into the hand of those who seek their life: and he shall strike them with the edge of the sword; he shall not spare them, neither have pity, nor have mercy.";

kjv[12] = "O house of David, thus saith the LORD; Execute judgment in the morning, and deliver [him that is] spoiled out of the hand of the oppressor, lest my fury go out like fire, and burn that none can quench [it], because of the evil of your doings.";
rsv[12] = "O house of David! Thus says the LORD: &quot;\'Execute justice in the morning, and deliver from the hand of the oppressor him who has been robbed, lest my wrath go forth like fire, and burn with none to quench it, because of your evil doings.\'&quot;";
asv[12] = "O house of David, thus saith Jehovah, Execute justice in the morning, and deliver him that is robbed out of the hand of the oppressor, lest my wrath go forth like fire, and burn so that none can quench it, because of the evil of your doings.";
yng[12] = "O house of David, thus said Jehovah: Decide ye judgment at morning, And deliver the plundered from the hand of the oppressor, Lest My fury go forth as fire, And hath burned, and none is quenching, Because of the evil of your doings.";
dby[12] = "House of David, thus saith Jehovah: Judge with justice in the morning, and deliver him that is spoiled out of the hand of the oppressor, lest my fury go forth like fire and burn, and there be none to quench it, because of the evil of your doings.";
web[12] = "O house of David, thus saith the LORD; Execute judgment in the morning, and deliver [him that is] made desolate out of the hand of the oppressor, lest my fury go out like fire, and burn that none can quench [it], because of the evil of your doings.";
hnv[12] = "House of David, thus says the LORD, Execute justice in the morning, and deliver him who is robbed out of the hand of the oppressor, lest my wrath go forth like fire, and burn so that none can quench it, because of the evil of your doings.";

yng[13] = "Lo, I [am] against thee -- an affirmation of Jehovah, O inhabitant of the valley, rock of the plain, Who are saying, Who cometh down against us? And who cometh into our habitations?";
dby[13] = "Behold, I am against thee, inhabitress of the valley, the rock of the plain, saith Jehovah; ye that say, Who shall come down against us, or who shall enter into our dwellings?";
