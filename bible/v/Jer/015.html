csb[1] = "Then the LORD said to me: &quot;Even if Moses and Samuel should stand before me, my compassions would not reach out to these people. Send them from my presence, and let them go.";
csb[2] = "&quot;If they ask you, \'Where will we go? \' tell them: This is what the LORD says: Those destined for death, to death; those destined for the sword, to the sword. Those destined for famine, to famine; those destined for captivity, to captivity.";
csb[3] = "&quot;I will ordain four kinds of judgment for them&quot; -- this is the LORD\'s declaration -- &quot;the sword to kill, the dogs to drag away, and the birds of the sky and the wild animals of the land to devour and destroy.";
csb[4] = "&quot;I will make them a horror to all the kingdoms of the earth because of Manasseh son of Hezekiah, the king of Judah, for what he did in Jerusalem.";
csb[5] = "&quot;Who will have pity on you, Jerusalem? Who will show sympathy toward you? Who will turn aside to ask about your well-being?";
csb[6] = "&quot;You have left me.&quot; This is the LORD\'s declaration. &quot;You have turned your back, so I have stretched out my hand against you and destroyed you. I am tired of showing compassion.";
csb[7] = "&quot;I scattered them with a winnowing fork at the city gates of the land. I made them childless; I destroyed my people. They would not turn from their ways.";
csb[8] = "&quot;I made their widows more numerous than the sand of the seas. I brought a destroyer at noon against the mother of young men. I suddenly released on her agitation and terrors.";
csb[9] = "&quot;The mother of seven grew faint; she breathed her last breath. Her sun set while it was still day; she was ashamed and humiliated. The rest of them I will give over to the sword in the presence of their enemies.&quot; This is the LORD\'s declaration.";
csb[10] = "Woe is me, my mother, that you gave birth to me, a man who incites dispute and conflict in all the land. I did not lend or borrow, yet everyone curses me.";
csb[11] = "The LORD said: Haven\'t I set you loose for your good? Haven\'t I punished you in a time of trouble, in a time of distress with the enemy?";
csb[12] = "Can anyone smash iron, iron from the north, or bronze?";
csb[13] = "I will give up your wealth and your treasures as plunder, without cost, for all your sins in all your borders.";
csb[14] = "Then I will make you serve your enemies in a land you do not know, for my anger will kindle a fire that will burn against you.";
csb[15] = "You know, LORD; remember me and take note of me. Avenge me against my persecutors. In your patience, don\'t take me away. Know that I suffer disgrace for your honor.";
csb[16] = "Your words were found, and I ate them. Your words became a delight to me and the joy of my heart, for I bear your name, LORD God of Armies.";
csb[17] = "I never sat with the band of revelers, and I did not celebrate with them. Because your hand was on me, I sat alone, for you filled me with indignation.";
csb[18] = "Why has my pain become unending, my wound incurable, refusing to be healed? You truly have become like a mirage to me -- water that is not reliable.";
csb[19] = "Therefore, this is what the LORD says: If you return, I will take you back; you will stand in my presence. And if you speak noble words, rather than worthless ones, you will be my spokesman. It is they who must return to you; you must not return to them.";
csb[20] = "Then I will make you a fortified wall of bronze to this people. They will fight against you but will not overcome you, for I am with you to save you and rescue you. This is the LORD\'s declaration.";
csb[21] = "I will rescue you from the power of evil people and redeem you from the grasp of the ruthless.";
kjv[1] = "Then said the LORD unto me, Though Moses and Samuel stood before me, [yet] my mind [could] not [be] toward this people: cast [them] out of my sight, and let them go forth.";

kjv[2] = "And it shall come to pass, if they say unto thee, Whither shall we go forth? then thou shalt tell them, Thus saith the LORD; Such as [are] for death, to death; and such as [are] for the sword, to the sword; and such as [are] for the famine, to the famine; and such as [are] for the captivity, to the captivity.";
rsv[2] = "And when they ask you, \'Where shall we go?\' you shall say to them, \'Thus says the LORD: &quot;Those who are for pestilence, to pestilence, and those who are for the sword, to the sword; those who are for famine, to famine, and those who are for captivity, to captivity.&quot;\'";
asv[2] = "And it shall come to pass, when they say unto thee, Whither shall we go forth? then thou shalt tell them, Thus saith Jehovah: Such as are for death, to death; and such as are for the sword, to the sword; and such as are for the famine, to the famine; and such as are for captivity, to captivity.";
yng[2] = "And it hath come to pass, when they say to thee, Whither do we go out? that thou hast said unto them, Thus said Jehovah: Those who [are] for death -- to death, And those who are for the sword, to the sword, And those who are for famine, to famine, And those who are for captivity, to captivity.";
