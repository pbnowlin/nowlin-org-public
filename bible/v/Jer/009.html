csb[1] = "If my head were a flowing spring, my eyes a fountain of tears, I would weep day and night over the slain of my dear people.";
csb[2] = "If only I had a traveler\'s lodging place in the wilderness, I would abandon my people and depart from them, for they are all adulterers, a solemn assembly of treacherous people.";
csb[3] = "They bent their tongues like their bows; lies and not faithfulness prevail in the land, for they proceed from one evil to another, and they do not take me into account. This is the LORD\'s declaration.";
csb[4] = "Everyone has to be on guard against his friend. Don\'t trust any brother, for every brother will certainly deceive, and every friend spread slander.";
csb[5] = "Each one betrays his friend; no one tells the truth. They have taught their tongues to speak lies; they wear themselves out doing wrong.";
csb[6] = "You live in a world of deception. In their deception they refuse to know me. This is the LORD\'s declaration.";
csb[7] = "Therefore, this is what the LORD of Armies says: I am about to refine them and test them, for what else can I do because of my dear people?";
csb[8] = "Their tongues are deadly arrows -- they speak deception. With his mouth one speaks peaceably with his friend, but inwardly he sets up an ambush.";
csb[9] = "Should I not punish them for these things? This is the LORD\'s declaration. Should I not avenge myself on such a nation as this?";
csb[10] = "I will raise weeping and a lament over the mountains, a dirge over the wilderness grazing land, for they have been so scorched that no one passes through. The sound of cattle is no longer heard. From the birds of the sky to the animals, everything has fled -- they have gone away.";
csb[11] = "I will make Jerusalem a heap of rubble, a jackals\' den. I will make the cities of Judah a desolation, an uninhabited place.";
csb[12] = "Who is the person wise enough to understand this? Who has the LORD spoken to, that he may explain it? Why is the land destroyed and scorched like a wilderness, so no one can pass through?";
csb[13] = "The LORD said, &quot;It is because they abandoned my instruction, which I set before them, and did not obey my voice or walk according to it.";
csb[14] = "&quot;Instead, they followed the stubbornness of their hearts and followed the Baals as their fathers taught them.&quot;";
csb[15] = "Therefore, this is what the LORD of Armies, the God of Israel, says: &quot;I am about to feed this people wormwood and give them poisonous water to drink.";
csb[16] = "&quot;I will scatter them among the nations that they and their fathers have not known. I will send a sword after them until I have finished them off.&quot;";
csb[17] = "This is what the LORD of Armies says: Consider, and summon the women who mourn; send for the skillful women.";
csb[18] = "Let them come quickly to raise a lament over us so that our eyes may overflow with tears, our eyelids be soaked with weeping.";
csb[19] = "For a sound of lamentation is heard from Zion: How devastated we are. We are greatly ashamed, for we have abandoned the land; our dwellings have been torn down.";
csb[20] = "Now hear the word of the LORD, you women. Pay attention to the words from his mouth. Teach your daughters a lament and one another a dirge,";
csb[21] = "for Death has climbed through our windows; it has entered our fortresses, cutting off children from the streets, young men from the squares.";
csb[22] = "&quot;Speak as follows: \'This is what the LORD declares: Human corpses will fall like manure on the surface of the field, like newly cut grain after the reaper with no one to gather it.";
csb[23] = "&quot; \'This is what the LORD says: The wise person should not boast in his wisdom; the strong should not boast in his strength; the wealthy should not boast in his wealth.";
csb[24] = "&quot;But the one who boasts should boast in this: that he understands and knows me -- that I am the LORD, showing faithful love, justice, and righteousness on the earth, for I delight in these things. This is the LORD\'s declaration.";
csb[25] = "&quot; \'Look, the days are coming -- this is the LORD\'s declaration -- when I will punish all the circumcised yet uncircumcised:";
csb[26] = "&quot;Egypt, Judah, Edom, the Ammonites, Moab, and all the inhabitants of the desert who clip the hair on their temples. All these nations are uncircumcised, and the whole house of Israel is uncircumcised in heart.\' &quot;";

kjv[19] = "For a voice of wailing is heard out of Zion, How are we spoiled! we are greatly confounded, because we have forsaken the land, because our dwellings have cast [us] out.";
rsv[19] = "For a sound of wailing is heard from Zion: \'How we are ruined! We are utterly shamed, because we have left the land, because they have cast down our dwellings.\'&quot;";
asv[19] = "For a voice of wailing is heard out of Zion, How are we ruined! we are greatly confounded, because we have forsaken the land, because they have cast down our dwellings.";
yng[19] = "For -- a voice of wailing is heard from Zion: How have we been spoiled! We have been greatly ashamed, Because we have forsaken the land, Because they have cast down our tabernacles.";
dby[19] = "For a voice of wailing is heard out of Zion, How are we spoiled, sorely put to shame! For we have forsaken the land, for they have cast down our dwellings.";
web[19] = "For a voice of wailing is heard out of Zion, How are we laid waste! we are greatly confounded, because we have forsaken the land, because our dwellings have cast [us] out.";

vul[19] = "quia vox lamentationis audita est de Sion quomodo vastati sumus et confusi vehementer quia dereliquimus terram quoniam deiecta sunt tabernacula nostra";

rsv[20] = "Hear, O women, the word of the LORD, and let your ear receive the word of his mouth; teach to your daughters a lament, and each to her neighbor a dirge.";
asv[20] = "Yet hear the word of Jehovah, O ye women, and let your ear receive the word of his mouth; and teach your daughters wailing, and every one her neighbor lamentation.";
yng[20] = "But hear, ye women, a word of Jehovah, And your ear receiveth a word of His mouth, And teach ye your daughters wailing, and each her neighbour lamentation.";
dby[20] = "Hear then the word of Jehovah, ye women, and let your ear receive the word of his mouth, and teach your daughters wailing, and each one her companion lamentation.";
web[20] = "Yet hear the word of the LORD, O ye women, and let your ear receive the word of his mouth, and teach your daughters wailing, and every one her neighbor lamentation.";
hnv[20] = "Yet hear the word of the LORD, you women, and let your ear receive the word of his mouth; and teach your daughters wailing, and everyone her neighbor lamentation.";

rsv[21] = "For death has come up into our windows, it has entered our palaces, cutting off the children from the streets and the young men from the squares.";
asv[21] = "For death is come up into our windows, it is entered into our palaces; to cut off the children from without, [and] the young men from the streets.";
yng[21] = "For death hath come up into our windows, It hath come into our palaces, To cut off the suckling from without, Young men from the broad places.";
dby[21] = "For death is come up through our windows, is entered into our palaces, to cut off the children from the street, the young men from the broadways.";
web[21] = "For death hath come up into our windows, [and] hath entered into our palaces, to cut off the children from without, [and] the young men from the streets.";
hnv[21] = "For death is come up into our windows, it is entered into our palaces; to cut off the children from outside, [and] the young men from the streets.";

kjv[22] = "Speak, Thus saith the LORD, Even the carcases of men shall fall as dung upon the open field, and as the handful after the harvestman, and none shall gather [them].";
rsv[22] = "Speak, &quot;Thus says the LORD: \'The dead bodies of men shall fall like dung upon the open field, like sheaves after the reaper, and none shall gather them.\'&quot;";
asv[22] = "Speak, Thus saith Jehovah, The dead bodies of men shall fall as dung upon the open field, and as the handful after the harvestman; and none shall gather [them].";
yng[22] = "Speak thus -- an affirmation of Jehovah, And fallen hath the carcase of man, As dung on the face of the field, And as a handful after the reaper, And there is none gathering.";
dby[22] = "Speak, Thus saith Jehovah: Yea, the carcases of men shall fall as dung upon the open field, and as the handful after the reaper, and there shall be none to gather.";
web[22] = "Speak, Thus saith the LORD, Even the carcasses of men shall fall as dung upon the open field, and as the handful after the harvest-man, and none shall gather [them].";
hnv[22] = "Speak, Thus says the LORD, The dead bodies of men shall fall as dung on the open field, and as the handful after the harvester; and none shall gather [them].";
vul[22] = "loquere haec dicit Dominus et cadet morticinum hominis quasi stercus super faciem regionis et quasi faenum post tergum metentis et non est qui colligat";
kjv[23] = "Thus saith the LORD, Let not the wise [man] glory in his wisdom, neither let the mighty [man] glory in his might, let not the rich [man] glory in his riches:";

asv[23] = "Thus saith Jehovah, Let not the wise man glory in his wisdom, neither let the mighty man glory in his might, let not the rich man glory in his riches;";

dby[23] = "Thus saith Jehovah: Let not the wise glory in his wisdom, neither let the mighty glory in his might; let not the rich glory in his riches:";
web[23] = "Thus saith the LORD, Let not the wise [man] glory in his wisdom, neither let the mighty [man] glory in his might, let not the rich [man] glory in his riches:";

asv[24] = "but let him that glorieth glory in this, that he hath understanding, and knoweth me, that I am Jehovah who exerciseth lovingkindness, justice, and righteousness, in the earth: for in these things I delight, saith Jehovah.";
yng[24] = "But -- in this let the boaster boast himself, In understanding and knowing Me, For I [am] Jehovah, doing kindness, Judgment, and righteousness, in the earth, For in these I have delighted, An affirmation of Jehovah.";
dby[24] = "but let him that glorieth glory in this, that he understandeth and knoweth me, that I [am] Jehovah, who exercise loving-kindness, judgment, and righteousness in the earth; for in these things I delight, saith Jehovah.";
