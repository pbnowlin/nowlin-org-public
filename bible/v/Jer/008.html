csb[1] = "&quot;At that time&quot; -- this is the LORD\'s declaration -- &quot;the bones of the kings of Judah, the bones of her officials, the bones of the priests, the bones of the prophets, and the bones of the residents of Jerusalem will be brought out of their graves.";
csb[2] = "&quot;They will be exposed to the sun, the moon, and all the stars in the sky, which they have loved, served, followed, consulted, and worshiped. Their bones will not be collected and buried but will become like manure on the soil\'s surface.";
csb[3] = "&quot;Death will be chosen over life by all the survivors of this evil family, those who remain wherever I have banished them.&quot; This is the declaration of the LORD of Armies.";
csb[4] = "&quot;You are to say to them: This is what the LORD says: Do people fall and not get up again? If they turn away, do they not return?";
csb[5] = "&quot;Why have these people turned away? Why is Jerusalem always turning away? They take hold of deceit; they refuse to return.";
csb[6] = "&quot;I have paid careful attention. They do not speak what is right. No one regrets his evil, asking, \'What have I done? \' Everyone has stayed his course like a horse rushing into battle.";
csb[7] = "&quot;Even storks in the sky know their seasons. Turtledoves, swallows, and cranes are aware of their migration, but my people do not know the requirements of the LORD.";
csb[8] = "&quot;How can you claim, \'We are wise; the law of the LORD is with us\'? In fact, the lying pen of scribes has produced falsehood.";
csb[9] = "&quot;The wise will be put to shame; they will be dismayed and snared. They have rejected the word of the LORD, so what wisdom do they really have?";
csb[10] = "&quot;Therefore, I will give their wives to other men, their fields to new occupants, for from the least to the greatest, everyone is making profit dishonestly. From prophet to priest, everyone deals falsely.";
csb[11] = "&quot;They have treated the brokenness of my dear people superficially, claiming, \'Peace, peace,\' when there is no peace.";
csb[12] = "&quot;Were they ashamed when they acted so detestably? They weren\'t at all ashamed. They can no longer feel humiliation. Therefore, they will fall among the fallen. When I punish them, they will collapse,&quot; says the LORD.";
csb[13] = "I will gather them and bring them to an end. This is the LORD\'s declaration. There will be no grapes on the vine, no figs on the fig tree, and even the leaf will wither. Whatever I have given them will be lost to them.";
csb[14] = "Why are we just sitting here? Gather together; let us enter the fortified cities and perish there, for the LORD our God has destroyed us. He has given us poisoned water to drink, because we have sinned against the LORD.";
csb[15] = "We hoped for peace, but there was nothing good; for a time of healing, but there was only terror.";
csb[16] = "From Dan, the snorting of horses is heard. At the sound of the neighing of mighty steeds, the whole land quakes. They come to devour the land and everything in it, the city and all its residents.";
csb[17] = "Indeed, I am about to send snakes among you, poisonous vipers that cannot be charmed. They will bite you. This is the LORD\'s declaration.";
csb[18] = "My joy has flown away; grief has settled on me. My heart is sick.";
csb[19] = "Listen -- the cry of my dear people from a faraway land, &quot;Is the LORD no longer in Zion, her King not within her? &quot; Why have they angered me with their carved images, with their worthless foreign idols?";
csb[20] = "Harvest has passed, summer has ended, but we have not been saved.";
csb[21] = "I am broken by the brokenness of my dear people. I mourn; horror has taken hold of me.";
csb[22] = "Is there no balm in Gilead? Is there no physician there? So why has the healing of my dear people not come about?";
kjv[1] = "At that time, saith the LORD, they shall bring out the bones of the kings of Judah, and the bones of his princes, and the bones of the priests, and the bones of the prophets, and the bones of the inhabitants of Jerusalem, out of their graves:";

yng[1] = "At that time, an affirmation of Jehovah, They bring the bones of the kings of Judah, And the bones of its princes, And the bones of the priests, And the bones of the prophets, And the bones of inhabitants of Jerusalem, Out of their graves,";

kjv[2] = "And they shall spread them before the sun, and the moon, and all the host of heaven, whom they have loved, and whom they have served, and after whom they have walked, and whom they have sought, and whom they have worshipped: they shall not be gathered, nor be buried; they shall be for dung upon the face of the earth.";

yng[2] = "And have spread them to sun, and to moon, And to all the host of the heavens, that they have loved, And that they have served, And that they have walked after, And that they have sought, And to which they have bowed themselves, They are not gathered, nor buried, They are for dung on the face of the ground.";

kjv[5] = "Why [then] is this people of Jerusalem slidden back by a perpetual backsliding? they hold fast deceit, they refuse to return.";
rsv[5] = "Why then has this people turned away in perpetual backsliding? They hold fast to deceit, they refuse to return.";

yng[5] = "Wherefore hath this people of Jerusalem Turned back -- a perpetual backsliding? They have kept hold on deceit, They have refused to turn back.";

kjv[6] = "I hearkened and heard, [but] they spake not aright: no man repented him of his wickedness, saying, What have I done? every one turned to his course, as the horse rusheth into the battle.";
rsv[6] = "I have given heed and listened, but they have not spoken aright; no man repents of his wickedness, saying, \'What have I done?\' Every one turns to his own course, like a horse plunging headlong into battle.";

yng[6] = "I have given attention, yea, I hearken, They do not speak right, No man hath repented of his wickedness, Saying, What have I done? Every one hath turned to his courses, As a horse is rushing into battle.";

kjv[7] = "Yea, the stork in the heaven knoweth her appointed times; and the turtle and the crane and the swallow observe the time of their coming; but my people know not the judgment of the LORD.";

yng[7] = "Even a stork in the heavens hath known her seasons, And turtle, and swallow, and crane, Have watched the time of their coming, And -- My people have not known the judgment of Jehovah.";
dby[7] = "Even a stork in the heavens knoweth her appointed times, and the turtle-dove and the swallow and the crane observe the time of their coming; but my people know not the judgment of Jehovah.";

kjv[19] = "Behold the voice of the cry of the daughter of my people because of them that dwell in a far country: [Is] not the LORD in Zion? [is] not her king in her? Why have they provoked me to anger with their graven images, [and] with strange vanities?";
rsv[19] = "Hark, the cry of the daughter of my people from the length and breadth of the land: &quot;Is the LORD not in Zion? Is her King not in her?&quot; &quot;Why have they provoked me to anger with their graven images, and with their foreign idols?&quot;";
asv[19] = "Behold, the voice of the cry of the daughter of my people from a land that is very far off: is not Jehovah in Zion? is not her King in her? Why have they provoked me to anger with their graven images, and with foreign vanities?";
yng[19] = "Lo, the voice of a cry of the daughter of my people from a land afar off, Is Jehovah not in Zion? is her king not in her? Wherefore have they provoked Me with their graven images, With the vanities of a foreigner?";
dby[19] = "Behold the voice of the cry of the daughter of my people, from a very far country: Is not Jehovah in Zion? Is not her king in her? Why have they provoked me to anger with their graven images, with foreign vanities?";
web[19] = "Behold the voice of the cry of the daughter of my people because of them that dwell in a distant country: [Is] not the LORD in Zion? [is] not her king in her? Why have they provoked me to anger with their graven images, [and] with strange vanities?";
hnv[19] = "Behold, the voice of the cry of the daughter of my people from a land that is very far off: isn\'t the LORD in Tziyon? Isn\'t her King in her? Why have they provoked me to anger with their engraved images, and with foreign vanities?";
vul[19] = "ecce vox clamoris filiae populi mei de terra longinqua numquid Dominus non est in Sion aut rex eius non est in ea quare ergo me ad iracundiam concitaverunt in sculptilibus suis et in vanitatibus alienis";
