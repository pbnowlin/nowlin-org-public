csb[1] = "This is what the LORD says: I am about to rouse the spirit of a destroyer against Babylon and against the population of Leb-qamai.";
csb[2] = "I will send strangers to Babylon who will scatter her and strip her land bare, for they will come against her from every side in the day of disaster.";
csb[3] = "Don\'t let the archer string his bow; don\'t let him put on his armor. Don\'t spare her young men; completely destroy her entire army!";
csb[4] = "Those who were slain will fall in the land of the Chaldeans, those who were pierced through, in her streets.";
csb[5] = "For Israel and Judah are not left widowed by their God, the LORD of Armies, though their land is full of guilt against the Holy One of Israel.";
csb[6] = "Leave Babylon; save your lives, each of you! Don\'t perish because of her guilt. For this is the time of the LORD\'s vengeance -- he will pay her what she deserves.";
csb[7] = "Babylon was a gold cup in the LORD\'s hand, making the whole earth drunk. The nations drank her wine; therefore, the nations go mad.";
csb[8] = "Suddenly Babylon fell and was shattered. Wail for her; get balm for her wound -- perhaps she can be healed.";
csb[9] = "We tried to heal Babylon, but she could not be healed. Abandon her! Let each of us go to his own land, for her judgment extends to the sky and reaches as far as the clouds.";
csb[10] = "The LORD has brought about our vindication; come, let\'s tell in Zion what the LORD our God has accomplished.";
csb[11] = "Sharpen the arrows! Fill the quivers! The LORD has roused the spirit of the kings of the Medes because his plan is aimed at Babylon to destroy her, for it is the LORD\'s vengeance, vengeance for his temple.";
csb[12] = "Raise up a signal flag against the walls of Babylon; fortify the watch post; set the watchmen in place; prepare the ambush. For the LORD has both planned and accomplished what he has threatened against those who live in Babylon.";
csb[13] = "You who reside by abundant water, rich in treasures, your end has come, your life thread is cut.";
csb[14] = "The LORD of Armies has sworn by himself: I will fill you up with men as with locusts, and they will sing the victory song over you.";
csb[15] = "He made the earth by his power, established the world by his wisdom, and spread out the heavens by his understanding.";
csb[16] = "When he thunders, the waters in the heavens are tumultuous, and he causes the clouds to rise from the ends of the earth. He makes lightning for the rain and brings the wind from his storehouses.";
csb[17] = "Everyone is stupid and ignorant. Every goldsmith is put to shame by his carved image, for his cast images are a lie; there is no breath in them.";
csb[18] = "They are worthless, a work to be mocked. At the time of their punishment they will be destroyed.";
csb[19] = "Jacob\'s Portion is not like these because he is the one who formed all things. Israel is the tribe of his inheritance; the LORD of Armies is his name.";
csb[20] = "You are my war club, my weapons of war. With you I will smash nations; with you I will bring kingdoms to ruin.";
csb[21] = "With you I will smash the horse and its rider; with you I will smash the chariot and its rider.";
csb[22] = "With you I will smash man and woman; with you I will smash the old man and the youth; with you I will smash the young man and the young woman.";
csb[23] = "With you I will smash the shepherd and his flock; with you I will smash the farmer and his ox-team. With you I will smash governors and officials.";
csb[24] = "&quot;Before your very eyes, I will repay Babylon and all the residents of Chaldea for all their evil they have done in Zion.&quot; This is the LORD\'s declaration.";
csb[25] = "Look, I am against you, devastating mountain. This is the LORD\'s declaration. You devastate the whole earth. I will stretch out my hand against you, roll you down from the cliffs, and turn you into a charred mountain.";
csb[26] = "No one will be able to retrieve a cornerstone or a foundation stone from you, because you will become desolate forever. This is the LORD\'s declaration.";
csb[27] = "Raise a signal flag in the land; blow a ram\'s horn among the nations; set apart the nations against her. Summon kingdoms against her -- Ararat, Minni, and Ashkenaz. Appoint a marshal against her; bring up horses like a swarm of locusts.";
csb[28] = "Set apart the nations for battle against her -- the kings of Media, her governors and all her officials, and all the lands they rule.";
csb[29] = "The earth quakes and trembles because the LORD\'s intentions against Babylon stand: to make the land of Babylon a desolation, without inhabitant.";
csb[30] = "Babylon\'s warriors have stopped fighting; they sit in their strongholds. Their might is exhausted; they have become like women. Babylon\'s homes have been set ablaze, her gate bars are shattered.";
csb[31] = "Messenger races to meet messenger, and herald to meet herald, to announce to the king of Babylon that his city has been captured from end to end.";
csb[32] = "The fords have been seized, the marshes set on fire, and the fighting men are terrified.";
csb[33] = "For this is what the LORD of Armies, the God of Israel, says: Daughter Babylon is like a threshing floor at the time it is trampled. In just a little while her harvest time will come.";
csb[34] = "&quot;King Nebuchadnezzar of Babylon has devoured me; he has crushed me. He has set me aside like an empty dish; he has swallowed me like a sea monster; he filled his belly with my delicacies; he has vomited me out.";
csb[35] = "&quot;Let the violence done to me and my family be done to Babylon,&quot; says the inhabitant of Zion. &quot;Let my blood be on the inhabitants of Chaldea,&quot; says Jerusalem.";
csb[36] = "Therefore, this is what the LORD says: I am about to champion your cause and take vengeance on your behalf; I will dry up her sea and make her fountain run dry.";
csb[37] = "Babylon will become a heap of rubble, a jackals\' den, a desolation and an object of scorn, without inhabitant.";
csb[38] = "They will roar together like young lions; they will growl like lion cubs.";
csb[39] = "While they are flushed with heat, I will serve them a feast, and I will make them drunk so that they celebrate. Then they will fall asleep forever and never wake up. This is the LORD\'s declaration.";
csb[40] = "I will bring them down like lambs to the slaughter, like rams together with male goats.";
csb[41] = "How Sheshach has been captured, the praise of the whole earth seized. What a horror Babylon has become among the nations!";
csb[42] = "The sea has risen over Babylon; she is covered with its tumultuous waves.";
csb[43] = "Her cities have become a desolation, an arid desert, a land where no one lives, where no human being even passes through.";
csb[44] = "I will punish Bel in Babylon. I will make him vomit what he swallowed. The nations will no longer stream to him; even Babylon\'s wall will fall.";
csb[45] = "Come out from among her, my people! Save your lives, each of you, from the LORD\'s burning anger.";
csb[46] = "May you not become cowardly and fearful when the report is proclaimed in the land, for the report will come one year, and then another the next year. There will be violence in the land with ruler against ruler.";
csb[47] = "Therefore, look, the days are coming when I will punish Babylon\'s carved images. Her entire land will suffer shame, and all her slain will lie fallen within her.";
csb[48] = "Heaven and earth and everything in them will shout for joy over Babylon because the destroyers from the north will come against her. This is the LORD\'s declaration.";
csb[49] = "Babylon must fall because of the slain of Israel, even as the slain of the whole earth fell because of Babylon.";
csb[50] = "You who have escaped the sword, go and do not stand still! Remember the LORD from far away, and let Jerusalem come to your mind.";
csb[51] = "We are ashamed because we have heard insults. Humiliation covers our faces because foreigners have entered the holy places of the LORD\'s temple.";
csb[52] = "Therefore, look, the days are coming -- this is the LORD\'s declaration -- when I will punish her carved images, and the wounded will groan throughout her land.";
csb[53] = "Even if Babylon should ascend to the heavens and fortify her tall fortresses, destroyers will come against her from me. This is the LORD\'s declaration.";
csb[54] = "The sound of a cry from Babylon! The sound of terrible destruction from the land of the Chaldeans!";
csb[55] = "For the LORD is going to devastate Babylon; he will silence her mighty voice. Their waves roar like a huge torrent; the tumult of their voice resounds,";
csb[56] = "for a destroyer is coming against her, against Babylon. Her warriors will be captured, their bows shattered, for the LORD is a God of retribution; he will certainly repay.";
csb[57] = "I will make her princes and sages drunk, along with her governors, officials, and warriors. Then they will fall asleep forever and never wake up. This is the King\'s declaration; the LORD of Armies is his name.";
csb[58] = "This is what the LORD of Armies says: Babylon\'s thick walls will be totally demolished, and her high gates set ablaze. The peoples will have labored for nothing; the nations will weary themselves only to feed the fire.";
csb[59] = "This is what the prophet Jeremiah commanded Seraiah son of Neriah son of Mahseiah, the quartermaster, when he went to Babylon with King Zedekiah of Judah in the fourth year of Zedekiah\'s reign.";
csb[60] = "Jeremiah wrote on one scroll about all the disaster that would come to Babylon; all these words were written against Babylon.";
csb[61] = "Jeremiah told Seraiah, &quot;When you get to Babylon, see that you read all these words aloud.";
csb[62] = "&quot;Say, \'LORD, you have threatened to cut off this place so that no one will live in it -- people or animals. Indeed, it will remain desolate forever.\'";
csb[63] = "&quot;When you have finished reading this scroll, tie a stone to it and throw it into the middle of the Euphrates River.";
csb[64] = "&quot;Then say, \'In the same way, Babylon will sink and never rise again because of the disaster I am bringing on her. They will grow weary.\' &quot; The words of Jeremiah end here.";

asv[1] = "Thus saith Jehovah: Behold, I will raise up against Babylon, and against them that dwell in Leb-kamai, a destroying wind.";
yng[1] = "Thus said Jehovah: Lo, I am stirring up against Babylon, And the inhabitants of Leb -- My withstanders, A destroying wind,";
dby[1] = "Thus saith Jehovah: Behold, I will raise up against Babylon, and against them that dwell in the heart of those that rise against me, a destroying wind;";
web[1] = "Thus saith the LORD; Behold, I will raise up against Babylon, and against them that dwell in the midst of them that rise against me, a destroying wind;";

yng[2] = "And I have sent to Babylon fanners, And they have fanned it, and they empty its land, For they have been against it, Round about -- in the day of evil.";
dby[2] = "and I will send unto Babylon strangers, who shall fan her, and shall empty her land: for in the day of trouble they shall be against her round about.";
web[2] = "And will send to Babylon fanners, that shall fan her, and shall empty her land: for in the day of trouble they shall be against her on all sides.";
hnv[2] = "I will send to Bavel strangers, who shall winnow her; and they shall empty her land: for in the day of trouble they shall be against her round about.";

kjv[3] = "Against [him that] bendeth let the archer bend his bow, and against [him that] lifteth himself up in his brigandine: and spare ye not her young men; destroy ye utterly all her host.";
rsv[3] = "Let not the archer bend his bow, and let him not stand up in his coat of mail. Spare not her young men; utterly destroy all her host.";
asv[3] = "Against [him that] bendeth let the archer bend his bow, and against [him that] lifteth himself up in his coat of mail: and spare ye not her young men; destroy ye utterly all her host.";
yng[3] = "Let not the treader tread his bow, Nor lift himself up in his coat of mail, Nor have ye pity on her young men, Devote ye to destruction all her host.";
dby[3] = "Against him that bendeth let the archer bend his bow, and against him that lifteth himself up in his coat of mail; and spare not her young men: destroy utterly all her host.";
web[3] = "Against [him that] bendeth let the archer bend his bow, and against [him that] lifteth himself up in his coat of mail: and spare ye not her young men; destroy ye utterly all her host.";
hnv[3] = "Against [him who] bends let the archer bend his bow, and against [him who] lifts himself up in his coat of mail: and don\'t you spare her young men; destroy you utterly all her host.";

kjv[4] = "Thus the slain shall fall in the land of the Chaldeans, and [they that are] thrust through in her streets.";
rsv[4] = "They shall fall down slain in the land of the Chalde\'ans, and wounded in her streets.";
asv[4] = "And they shall fall down slain in the land of the Chaldeans, and thrust through in her streets.";
yng[4] = "And fallen have the wounded in the land of the Chaldeans, And the pierced-through in her streets.";
dby[4] = "And the slain shall fall in the land of the Chaldeans, and they that are thrust through in her streets.";

kjv[5] = "For Israel [hath] not [been] forsaken, nor Judah of his God, of the LORD of hosts; though their land was filled with sin against the Holy One of Israel.";
rsv[5] = "For Israel and Judah have not been forsaken by their God, the LORD of hosts; but the land of the Chalde\'ans is full of guilt against the Holy One of Israel.";
asv[5] = "For Israel is not forsaken, nor Judah, of his God, of Jehovah of hosts; though their land is full of guilt against the Holy One of Israel.";
yng[5] = "For, not forsaken is Israel and Judah, By its God -- by Jehovah of Hosts, For their land hath been full of guilt, Against the Holy One of Israel.";
dby[5] = "For Israel is not forsaken, nor Judah of his God, of Jehovah of hosts; for their land is full of guilt against the Holy One of Israel.";
web[5] = "For Israel [hath] not [been] forsaken, nor Judah by his God, by the LORD of hosts; though their land was filled with sin against the Holy One of Israel.";
hnv[5] = "For Yisra\'el is not forsaken, nor Yehudah, of his God, of the LORD of Hosts; though their land is full of guilt against the Holy One of Yisra\'el.";

kjv[6] = "Flee out of the midst of Babylon, and deliver every man his soul: be not cut off in her iniquity; for this [is] the time of the LORD\'S vengeance; he will render unto her a recompence.";
rsv[6] = "&quot;Flee from the midst of Babylon, let every man save his life! Be not cut off in her punishment, for this is the time of the LORD\'s vengeance, the requital he is rendering her.";
asv[6] = "Flee out of the midst of Babylon, and save every man his life; be not cut off in her iniquity: for it is the time of Jehovah\'s vengeance; he will render unto her a recompense.";
yng[6] = "Flee ye from the midst of Babylon, And deliver ye each his soul, Be not cut off in its iniquity, For a time of vengeance it [is] to Jehovah, Recompence He is rendering to her.";
dby[6] = "Flee out of the midst of Babylon, and save every man his life; be ye not cut off in her iniquity: for this is the time of Jehovah\'s vengeance: he shall render unto her a recompence.";

hnv[6] = "Flee out of the midst of Bavel, and save every man his life; don\'t be cut off in her iniquity: for it is the time of the LORD\'s vengeance; he will render to her a recompense.";

kjv[7] = "Babylon [hath been] a golden cup in the LORD\'S hand, that made all the earth drunken: the nations have drunken of her wine; therefore the nations are mad.";
rsv[7] = "Babylon was a golden cup in the LORD\'s hand, making all the earth drunken; the nations drank of her wine, therefore the nations went mad.";
asv[7] = "Babylon hath been a golden cup in Jehovah\'s hand, that made all the earth drunken: the nations have drunk of her wine; therefore the nations are mad.";
yng[7] = "A golden cup [is] Babylon in the hand of Jehovah, Making drunk all the earth, Of its wine drunk have nations, Therefore boast themselves do nations.";
dby[7] = "Babylon hath been a golden cup in Jehovah\'s hand, that made all the earth drunken: the nations have drunk of her wine; therefore have the nations become mad.";
web[7] = "Babylon [hath been] a golden cup in the LORD\'S hand, that made all the earth drunken: the nations have drank of her wine; therefore the nations are mad.";
hnv[7] = "Bavel has been a golden cup in the LORD\'s hand, who made all the eretz drunken: the nations have drunk of her wine; therefore the nations are mad.";

kjv[8] = "Babylon is suddenly fallen and destroyed: howl for her; take balm for her pain, if so be she may be healed.";
rsv[8] = "Suddenly Babylon has fallen and been broken; wail for her! Take balm for her pain; perhaps she may be healed.";
asv[8] = "Babylon is suddenly fallen and destroyed: wail for her; take balm for her pain, if so be she may be healed.";
yng[8] = "Suddenly hath Babylon fallen, Yea, it is broken, howl ye for it, Take balm for her pain, if so be it may be healed.";
dby[8] = "Babylon is suddenly fallen and ruined. Howl over her; take balm for her pain, if so be she may be healed.";
web[8] = "Babylon is suddenly fallen and destroyed: howl for her; take balm for her pain, it may be she may be healed.";
hnv[8] = "Bavel is suddenly fallen and destroyed: wail for her; take balm for her pain, if so be she may be healed.";

kjv[9] = "We would have healed Babylon, but she is not healed: forsake her, and let us go every one into his own country: for her judgment reacheth unto heaven, and is lifted up [even] to the skies.";
rsv[9] = "We would have healed Babylon, but she was not healed. Forsake her, and let us go each to his own country; for her judgment has reached up to heaven and has been lifted up even to the skies.";
asv[9] = "We would have healed Babylon, but she is not healed: forsake her, and let us go every one into his own country; for her judgment reacheth unto heaven, and is lifted up even to the skies.";
yng[9] = "We healed Babylon, and she was not healed, Forsake her, and we go, each to his land, For come unto the heavens hath its judgment, And it hath been lifted up unto the clouds.";
dby[9] = "We have treated Babylon, but she is not healed: forsake her, and let us go every one into his own country; for her judgment reacheth unto the heavens, and is lifted up to the skies.";
web[9] = "We would have healed Babylon, but she is not healed: forsake her, and let us go every one into his own country: for her judgment reacheth to heaven, and is lifted [even] to the skies.";
hnv[9] = "We would have healed Bavel, but she is not healed: forsake her, and let us go everyone into his own country; for her judgment reaches to heaven, and is lifted up even to the skies.";

asv[10] = "Jehovah hath brought forth our righteousness: come, and let us declare in Zion the work of Jehovah our God.";
yng[10] = "Jehovah hath brought forth our righteousnesses, Come, and we recount in Zion the work of Jehovah our God.";

kjv[11] = "Make bright the arrows; gather the shields: the LORD hath raised up the spirit of the kings of the Medes: for his device [is] against Babylon, to destroy it; because it [is] the vengeance of the LORD, the vengeance of his temple.";
rsv[11] = "&quot;Sharpen the arrows! Take up the shields! The LORD has stirred up the spirit of the kings of the Medes, because his purpose concerning Babylon is to destroy it, for that is the vengeance of the LORD, the vengeance for his temple.";
asv[11] = "Make sharp the arrows; hold firm the shields: Jehovah hath stirred up the spirit of the kings of the Medes; because his purpose is against Babylon, to destroy it: for it is the vengeance of Jehovah, the vengeance of his temple.";
yng[11] = "Cleanse ye the arrows, fill the shields, Stirred up hath Jehovah the spirit of the kings of Madia, For against Babylon His device [is] to destroy it, For the vengeance of Jehovah it [is], The vengeance of His temple.";
dby[11] = "Sharpen the arrows; take the shields. Jehovah hath stirred up the spirit of the kings of the Medes; for his purpose is against Babylon, to destroy it; for this is the vengeance of Jehovah, the vengeance of his temple.";
web[11] = "Make bright the arrows; gather the shields: the LORD hath raised up the spirit of the kings of the Medes: for his purpose [is] against Babylon, to destroy it; because it [is] the vengeance of the LORD, the vengeance of his temple.";
hnv[11] = "Make sharp the arrows; hold firm the shields: the LORD has stirred up the spirit of the kings of the Madai; because his purpose is against Bavel, to destroy it: for it is the vengeance of the LORD, the vengeance of his temple.";

rsv[12] = "Set up a standard against the walls of Babylon; make the watch strong; set up watchmen; prepare the ambushes; for the LORD has both planned and done what he spoke concerning the inhabitants of Babylon.";

rsv[14] = "The LORD of hosts has sworn by himself: Surely I will fill you with men, as many as locusts, and they shall raise the shout of victory over you.";

yng[14] = "Sworn hath Jehovah of Hosts by Himself, That, Surely I have filled thee [with] men as the cankerworm, And they have cried against thee -- shouting.";
dby[14] = "Jehovah of hosts hath sworn by himself, I will assuredly fill thee with men, as with caterpillars; and they shall raise a shout against thee.";

yng[19] = "Not like these [is] the portion of Jacob, For He [is] former of all things, And [Israel is] the rod of His inheritance, Jehovah of Hosts [is] His name.";

web[35] = "The violence done to me and to my flesh [be] upon Babylon, shall the inhabitant of Zion say; and my blood upon the inhabitants of Chaldea, shall Jerusalem say.";
hnv[35] = "The violence done to me and to my flesh be on Bavel, shall the inhabitant of Tziyon say; and, My blood be on the inhabitants of Kasdim, shall Yerushalayim say.";

kjv[36] = "Therefore thus saith the LORD; Behold, I will plead thy cause, and take vengeance for thee; and I will dry up her sea, and make her springs dry.";
rsv[36] = "Therefore thus says the LORD: &quot;Behold, I will plead your cause and take vengeance for you. I will dry up her sea and make her fountain dry;";
asv[36] = "Therefore thus saith Jehovah: Behold, I will plead thy cause, and take vengeance for thee; and I will dry up her sea, and make her fountain dry.";
yng[36] = "Therefore, thus said Jehovah: Lo, I am pleading thy cause, And I have avenged thy vengeance, And dried up its sea, and made its fountains dry.";
dby[36] = "Therefore thus saith Jehovah: Behold, I will plead thy cause, and take vengeance for thee; and I will dry up her sea, and make her spring dry.";
web[36] = "Therefore thus saith the LORD; Behold, I will plead thy cause, and take vengeance for thee; and I will dry up her sea, and make her springs dry.";
hnv[36] = "Therefore thus says the LORD: Behold, I will plead your cause, and take vengeance for you; and I will dry up her sea, and make her fountain dry.";
vul[36] = "propterea haec dicit Dominus ecce ego iudicabo causam tuam et ulciscar ultionem tuam et desertum faciam mare eius et siccabo venam eius";
kjv[37] = "And Babylon shall become heaps, a dwellingplace for dragons, an astonishment, and an hissing, without an inhabitant.";
rsv[37] = "and Babylon shall become a heap of ruins, the haunt of jackals, a horror and a hissing, without inhabitant.";
asv[37] = "And Babylon shall become heaps, a dwelling-place for jackals, an astonishment, and a hissing, without inhabitant.";
yng[37] = "And Babylon hath been for heaps, A habitation of dragons, An astonishment, and a hissing, without inhabitant.";
dby[37] = "And Babylon shall become heaps, a dwelling-place of jackals, an astonishment, and a hissing, without inhabitant.";
web[37] = "And Babylon shall become heaps, a dwelling-place for dragons, an astonishment, and a hissing, without an inhabitant.";
hnv[37] = " Bavel shall become heaps, a dwelling-place for jackals, an astonishment, and a hissing, without inhabitant.";
vul[37] = "et erit Babylon in tumulos habitatio draconum stupor et sibilus eo quod non sit habitator";
kjv[38] = "They shall roar together like lions: they shall yell as lions\' whelps.";
rsv[38] = "&quot;They shall roar together like lions; they shall growl like lions\' whelps.";
asv[38] = "They shall roar together like young lions; they shall growl as lions\' whelps.";
yng[38] = "Together as young lions they roar, They have shaken themselves as lions\' whelps.";
dby[38] = "They shall roar together like young lions, growl as lions\' whelps.";
web[38] = "They shall roar together like lions: they shall yell as lions\' whelps.";
hnv[38] = "They shall roar together like young lions; they shall growl as lions\' cubs.";
vul[38] = "simul ut leones rugient excutient comas velut catuli leonum";
kjv[39] = "In their heat I will make their feasts, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep, and not wake, saith the LORD.";
rsv[39] = "While they are inflamed I will prepare them a feast and make them drunk, till they swoon away and sleep a perpetual sleep and not wake, says the LORD.";
asv[39] = "When they are heated, I will make their feast, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep, and not wake, saith Jehovah.";
yng[39] = "In their heat I make their banquets, And I have caused them to drink, so that they exult, And have slept a sleep age-during, And awake not -- an affirmation of Jehovah.";
dby[39] = "When they are heated, I will prepare their drink, and I will make them drunken, that they may exult, and sleep a perpetual sleep, and not wake, saith Jehovah.";
web[39] = "In their heat I will make their feasts, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep, and not wake, saith the LORD.";
hnv[39] = "When they are heated, I will make their feast, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep, and not wake, says the LORD.";
vul[39] = "in calore eorum ponam potus eorum et inebriabo eos ut sopiantur et dormiant somnum sempiternum et non consurgant dicit Dominus";
kjv[40] = "I will bring them down like lambs to the slaughter, like rams with he goats.";
rsv[40] = "I will bring them down like lambs to the slaughter, like rams and he-goats.";
asv[40] = "I will bring them down like lambs to the slaughter, like rams with he-goats.";
yng[40] = "I cause them to go down as lambs to slaughter, As rams with he-goats.";
dby[40] = "I will bring them down like lambs to the slaughter, like rams with he-goats.";
web[40] = "I will bring them down like lambs to the slaughter, like rams with he-goats.";
hnv[40] = "I will bring them down like lambs to the slaughter, like rams with male goats.";
vul[40] = "deducam eos quasi agnos ad victimam quasi arietes cum hedis";
kjv[41] = "How is Sheshach taken! and how is the praise of the whole earth surprised! how is Babylon become an astonishment among the nations!";
rsv[41] = "&quot;How Babylon is taken, the praise of the whole earth seized! How Babylon has become a horror among the nations!";
asv[41] = "How is Sheshach taken! and the praise of the whole earth seized! how is Babylon become a desolation among the nations!";
yng[41] = "How hath Sheshach been captured, Yea, caught is the praise of the whole earth, How hath Babylon been for an astonishment among nations.";
dby[41] = "How is Sheshach taken! and how is the praise of the whole earth seized! How is Babylon become an astonishment among the nations!";
web[41] = "How is Sheshach taken! and how is the praise of the whole earth surprised! how is Babylon become an astonishment among the nations!";
hnv[41] = "How is Sheshakh taken! and the praise of the whole eretz seized! how is Bavel become a desolation among the nations!";
vul[41] = "quomodo capta est Sesach et conprehensa est inclita universae terrae quomodo facta est in stuporem Babylon inter gentes";
kjv[42] = "The sea is come up upon Babylon: she is covered with the multitude of the waves thereof.";
rsv[42] = "The sea has come up on Babylon; she is covered with its tumultuous waves.";
asv[42] = "The sea is come up upon Babylon; she is covered with the multitude of the waves thereof.";
yng[42] = "Come up against Babylon hath the sea, With a multitude of its billows it hath been covered.";
dby[42] = "The sea is come up upon Babylon: she is covered with the multitude of its waves.";
web[42] = "The sea is come up upon Babylon: she is covered with the multitude of its waves.";
hnv[42] = "The sea is come up on Bavel; she is covered with the multitude of the waves of it.";
vul[42] = "ascendit super Babylonem mare multitudine fluctuum eius operta est";
kjv[43] = "Her cities are a desolation, a dry land, and a wilderness, a land wherein no man dwelleth, neither doth [any] son of man pass thereby.";
rsv[43] = "Her cities have become a horror, a land of drought and a desert, a land in which no one dwells, and through which no son of man passes.";
asv[43] = "Her cities are become a desolation, a dry land, and a desert, a land wherein no man dwelleth, neither doth any son of man pass thereby.";
yng[43] = "Its cities have been for a desolation, A dry land, and a wilderness, A land -- none doth dwell in them, Nor pass over into them doth a son of man.";
dby[43] = "Her cities are become a desolation, a dry land, and a desert, a land wherein no one dwelleth, neither doth a son of man pass thereby.";
web[43] = "Her cities are a desolation, a dry land, and a wilderness, a land in which no man dwelleth, neither doth [any] son of man pass by it.";
hnv[43] = "Her cities are become a desolation, a dry land, and a desert, a land in which no man dwells, neither does any son of man pass thereby.";
vul[43] = "factae sunt civitates eius in stuporem terra inhabitabilis et deserta terra in qua nullus habitet nec transeat per eam filius hominis";
kjv[44] = "And I will punish Bel in Babylon, and I will bring forth out of his mouth that which he hath swallowed up: and the nations shall not flow together any more unto him: yea, the wall of Babylon shall fall.";
rsv[44] = "And I will punish Bel in Babylon, and take out of his mouth what he has swallowed. The nations shall no longer flow to him; the wall of Babylon has fallen.";
asv[44] = "And I will execute judgment upon Bel in Babylon, and I will bring forth out of his mouth that which he hath swallowed up; and the nations shall not flow any more unto him: yea, the wall of Babylon shall fall.";
yng[44] = "And I have seen after Bel in Babylon, And I have brought forth that which he swallowed -- from his mouth, And flow no more unto him do nations, Also the wall of Babylon hath fallen.";
dby[44] = "And I will punish Bel in Babylon, and I will bring forth out of his mouth what he hath swallowed up; and the nations shall not flow together any more unto him: yea, the wall of Babylon is fallen.";
web[44] = "And I will punish Bel in Babylon, and I will bring forth out of his mouth that which he hath swallowed: and the nations shall not flow together any more to him: even the wall of Babylon shall fall.";
hnv[44] = "I will execute judgment on Bel in Bavel, and I will bring forth out of his mouth that which he has swallowed up; and the nations shall not flow any more to him: yes, the wall of Bavel shall fall.";
vul[44] = "et visitabo super Bel in Babylone et eiciam quod absorbuerat de ore eius et non confluent ad eum ultra gentes siquidem et murus Babylonis corruit";
kjv[45] = "My people, go ye out of the midst of her, and deliver ye every man his soul from the fierce anger of the LORD.";
rsv[45] = "&quot;Go out of the midst of her, my people! Let every man save his life from the fierce anger of the LORD!";
asv[45] = "My people, go ye out of the midst of her, and save yourselves every man from the fierce anger of Jehovah.";
yng[45] = "Go forth from its midst, O My people, And deliver ye, each his soul, Because of the fierceness of the anger of Jehovah,";
dby[45] = "Go ye out of the midst of her, my people, and deliver every man his soul from the fierce anger of Jehovah!";
web[45] = "My people, depart from the midst of her, and deliver ye every man his soul from the fierce anger of the LORD.";
hnv[45] = "My people, go you out of the midst of her, and save yourselves every man from the fierce anger of the LORD.";
vul[45] = "egredimini de medio eius populus meus ut salvet unusquisque animam suam ab ira furoris Domini";
kjv[46] = "And lest your heart faint, and ye fear for the rumour that shall be heard in the land; a rumour shall both come [one] year, and after that in [another] year [shall come] a rumour, and violence in the land, ruler against ruler.";
rsv[46] = "Let not your heart faint, and be not fearful at the report heard in the land, when a report comes in one year and afterward a report in another year, and violence is in the land, and ruler is against ruler.";
asv[46] = "And let not your heart faint, neither fear ye for the tidings that shall be heard in the land; for tidings shall come one year, and after that in another year [shall come] tidings, and violence in the land, ruler against ruler.";
yng[46] = "And lest your heart be tender, And ye be afraid of the report that is heard in the land, And come in a year hath the report, And after it in a year the report, And violence [is] in the land, ruler against ruler;";
dby[46] = "lest your heart faint, and ye fear for the rumour that shall be heard in the land; for a rumour shall come [one] year, and after that a rumour in [another] year, and violence in the earth, ruler against ruler.";
web[46] = "And lest your heart should faint, and ye should fear for the rumor that shall be heard in the land; a rumor shall both come [one] year, and after that in [another] year [shall come] a rumor, and violence in the land, ruler against ruler.";
hnv[46] = "Don\'t let your heart faint, neither fear for the news that shall be heard in the land; for news shall come one year, and after that in another year [shall come] news, and violence in the land, ruler against ruler.";
vul[46] = "et ne forte mollescat cor vestrum et timeatis auditum qui audietur in terra et veniet in anno auditio et post hunc annum auditio et iniquitas in terra et dominator super dominatorem";
kjv[47] = "Therefore, behold, the days come, that I will do judgment upon the graven images of Babylon: and her whole land shall be confounded, and all her slain shall fall in the midst of her.";
rsv[47] = "&quot;Therefore, behold, the days are coming when I will punish the images of Babylon; her whole land shall be put to shame, and all her slain shall fall in the midst of her.";
asv[47] = "Therefore, behold, the days come, that I will execute judgment upon the graven images of Babylon; and her whole land shall be confounded; and all her slain shall fall in the midst of her.";
yng[47] = "Therefore, lo, days are coming, And I have seen after the graven images of Babylon. And all its land is ashamed, And all its pierced ones do fall in its midst.";
dby[47] = "Therefore behold, days are coming when I will punish the graven images of Babylon; and her whole land shall be put to shame, and all her slain shall fall in the midst of her.";
web[47] = "Therefore behold, the days come, that I will do judgment upon the graven images of Babylon: and her whole land shall be confounded, and all her slain shall fall in the midst of her.";
hnv[47] = "Therefore, behold, the days come, that I will execute judgment on the engraved images of Bavel; and her whole land shall be confounded; and all her slain shall fall in the midst of her.";
vul[47] = "propterea ecce dies veniunt et visitabo super sculptilia Babylonis et omnis terra eius confundetur et universi interfecti eius cadent in medio eius";
kjv[48] = "Then the heaven and the earth, and all that [is] therein, shall sing for Babylon: for the spoilers shall come unto her from the north, saith the LORD.";
rsv[48] = "Then the heavens and the earth, and all that is in them, shall sing for joy over Babylon; for the destroyers shall come against them out of the north, says the LORD.";
asv[48] = "Then the heavens and the earth, and all that is therein, shall sing for joy over Babylon; for the destroyers shall come unto her from the north, saith Jehovah.";
yng[48] = "And cried aloud against Babylon Have heavens and earth, and all that [is] in them, For, from the north come to it do the spoilers, An affirmation of Jehovah.";
dby[48] = "And the heavens and the earth, and all that is therein, shall shout aloud over Babylon; for out of the north the spoilers shall come against her, saith Jehovah.";
web[48] = "Then the heaven and the earth, and all that [is] in them, shall sing for Babylon: for the spoilers shall come to her from the north, saith the LORD.";
hnv[48] = "Then the heavens and the eretz, and all that is therein, shall sing for joy over Bavel; for the destroyers shall come to her from the north, says the LORD.";
vul[48] = "et laudabunt super Babylonem caeli et terra et omnia quae in eis sunt quia ab aquilone venient ei praedones ait Dominus";
kjv[49] = "As Babylon [hath caused] the slain of Israel to fall, so at Babylon shall fall the slain of all the earth.";
rsv[49] = "Babylon must fall for the slain of Israel, as for Babylon have fallen the slain of all the earth.";
asv[49] = "As Babylon hath caused the slain of Israel to fall, so at Babylon shall fall the slain of all the land.";
yng[49] = "Even Babylon [is] to fall, ye pierced of Israel, Even they of Babylon have fallen, Ye pierced of all the earth.";
dby[49] = "As Babylon caused the slain of Israel to fall, so at Babylon shall fall the slain of all the earth.";
web[49] = "As Babylon [hath caused] the slain of Israel to fall, so at Babylon shall fall the slain of all the earth.";
hnv[49] = "As Bavel has caused the slain of Yisra\'el to fall, so at Bavel shall fall the slain of all the land.";
vul[49] = "et quomodo fecit Babylon ut caderent occisi in Israhel sic de Babylone cadent occisi in universa terra";
kjv[50] = "Ye that have escaped the sword, go away, stand not still: remember the LORD afar off, and let Jerusalem come into your mind.";
rsv[50] = "&quot;You that have escaped from the sword, go, stand not still! Remember the LORD from afar, and let Jerusalem come into your mind:";
asv[50] = "Ye that have escaped the sword, go ye, stand not still; remember Jehovah from afar, and let Jerusalem come into your mind.";
yng[50] = "Ye escaped of the sword, go on, stand not, Remember ye from afar Jehovah, And let Jerusalem come up on your heart.";
dby[50] = "Ye that have escaped the sword, go, stand not still: remember Jehovah from afar, and let Jerusalem come into your mind.";
web[50] = "Ye that have escaped the sword, go away, stand not still: remember the LORD afar off, and let Jerusalem come into your mind.";
hnv[50] = "You who have escaped the sword, go you, don\'t stand still; remember the LORD from afar, and let Yerushalayim come into your mind.";
vul[50] = "qui fugistis gladium venite nolite stare recordamini procul Domini et Hierusalem ascendat super cor vestrum";
kjv[51] = "We are confounded, because we have heard reproach: shame hath covered our faces: for strangers are come into the sanctuaries of the LORD\'S house.";
rsv[51] = "\'We are put to shame, for we have heard reproach; dishonor has covered our face, for aliens have come into the holy places of the LORD\'s house.\'";
asv[51] = "We are confounded, because we have heard reproach; confusion hath covered our faces: for strangers are come into the sanctuaries of Jehovah\'s house.";
yng[51] = "We have been ashamed, for we heard reproach, Covered hath shame our faces, For come in have strangers, against the sanctuaries of the house of Jehovah.";
dby[51] = "-- We are put to shame, for we have heard reproach; confusion hath covered our face: for strangers are come into the sanctuaries of Jehovah\'s house.";
web[51] = "We are confounded, because we have heard reproach: shame hath covered our faces: for strangers are come into the sanctuaries of the LORD\'S house.";
hnv[51] = "We are confounded, because we have heard reproach; confusion has covered our faces: for strangers are come into the sanctuaries of the LORD\'s house.";
vul[51] = "confusi sumus quoniam audivimus obprobrium operuit ignominia facies nostras quia venerunt alieni super sanctificationem domus Domini";
kjv[52] = "Wherefore, behold, the days come, saith the LORD, that I will do judgment upon her graven images: and through all her land the wounded shall groan.";
rsv[52] = "&quot;Therefore, behold, the days are coming, says the LORD, when I will execute judgment upon her images, and through all her land the wounded shall groan.";
asv[52] = "Wherefore, behold, the days come, saith Jehovah, that I will execute judgment upon her graven images; and through all her land the wounded shall groan.";
yng[52] = "Therefore, lo, days are coming, An affirmation of Jehovah, And I have seen after its graven images, And in all its land groan doth the wounded.";
dby[52] = "-- Therefore behold, days come, saith Jehovah, that I will punish her graven images; and throughout her land the wounded shall groan.";
web[52] = "Wherefore, behold, the days come, saith the LORD, that I will do judgment upon her graven images: and through all her land the wounded shall groan.";
hnv[52] = "Therefore, behold, the days come, says the LORD, that I will execute judgment on her engraved images; and through all her land the wounded shall groan.";
vul[52] = "propterea ecce dies veniunt ait Dominus et visitabo super sculptilia eius et in omni terra eius mugiet vulneratus";
kjv[53] = "Though Babylon should mount up to heaven, and though she should fortify the height of her strength, [yet] from me shall spoilers come unto her, saith the LORD.";
rsv[53] = "Though Babylon should mount up to heaven, and though she should fortify her strong height, yet destroyers would come from me upon her, says the LORD.";
asv[53] = "Though Babylon should mount up to heaven, and though she should fortify the height of her strength, yet from me shall destroyers come unto her, saith Jehovah.";
yng[53] = "Because Babylon goeth up to the heavens, And because it fenceth the high place of its strength, From Me come into it do spoilers, An affirmation of Jehovah.";
dby[53] = "Though Babylon should mount up to the heavens, and though she should fortify the height of her strength, yet from me shall spoilers come unto her, saith Jehovah.";
web[53] = "Though Babylon should mount up to heaven, and though she should fortify the hight of her strength, [yet] from me shall spoilers come to her, saith the LORD.";
hnv[53] = " Though Bavel should mount up to the sky, and though she should fortify the height of her strength, yet from me shall destroyers come to her, says the LORD.";
vul[53] = "si ascenderit Babylon in caelum et firmaverit in excelso robur suum a me venient vastatores eius ait Dominus";
kjv[54] = "A sound of a cry [cometh] from Babylon, and great destruction from the land of the Chaldeans:";
rsv[54] = "&quot;Hark! a cry from Babylon! The noise of great destruction from the land of the Chalde\'ans!";
asv[54] = "The sound of a cry from Babylon, and of great destruction from the land of the Chaldeans!";
yng[54] = "A voice of a cry [is] from Babylon, And of great destruction from the land of the Chaldean.";
dby[54] = "The sound of a cry [cometh] from Babylon, and great destruction from the land of the Chaldeans;";
web[54] = "A sound of a cry [cometh] from Babylon, and great destruction from the land of the Chaldeans:";
hnv[54] = "The sound of a cry from Bavel, and of great destruction from the land of the Kasdim!";
vul[54] = "vox clamoris de Babylone et contritio magna de terra Chaldeorum";
kjv[55] = "Because the LORD hath spoiled Babylon, and destroyed out of her the great voice; when her waves do roar like great waters, a noise of their voice is uttered:";
rsv[55] = "For the LORD is laying Babylon waste, and stilling her mighty voice. Their waves roar like many waters, the noise of their voice is raised;";
asv[55] = "For Jehovah layeth Babylon waste, and destroyeth out of her the great voice; and their waves roar like many waters; the noise of their voice is uttered:";
yng[55] = "For Jehovah is spoiling Babylon, And hath destroyed out of it a great voice, And sounded have its billows as many waters, Given forth a noise hath their voice.";
dby[55] = "for Jehovah spoileth Babylon, and he will destroy out of her the great voice; and their waves roar like great waters, the noise of their voice resoundeth.";
web[55] = "Because the LORD hath laid waste Babylon, and destroyed out of her the great voice; when her waves roar like great waters, a noise of their voice is uttered:";
hnv[55] = "For the LORD lays Bavel waste, and destroys out of her the great voice; and their waves roar like many waters; the noise of their voice is uttered:";
vul[55] = "quoniam vastavit Dominus Babylonem et perdidit ex ea vocem magnam et sonabunt fluctus eorum quasi aquae multae dedit sonitum vox eorum";
kjv[56] = "Because the spoiler is come upon her, [even] upon Babylon, and her mighty men are taken, every one of their bows is broken: for the LORD God of recompences shall surely requite.";
rsv[56] = "for a destroyer has come upon her, upon Babylon; her warriors are taken, their bows are broken in pieces; for the LORD is a God of recompense, he will surely requite.";
asv[56] = "for the destroyer is come upon her, even upon Babylon, and her mighty men are taken, their bows are broken in pieces; for Jehovah is a God of recompenses, he will surely requite.";
yng[56] = "For come in against it -- against Babylon -- hath a spoiler, And captured have been its mighty ones, Broken have been their bows, For the God of recompences -- Jehovah -- doth certainly repay.";
dby[56] = "For the spoiler is come against her, against Babylon, and her mighty men are taken; their bows are broken in pieces; for Jehovah, the God of recompences, will certainly requite.";
web[56] = "Because the spoiler is come upon her, [even] upon Babylon, and her mighty men are taken, every one of their bows is broken: for the LORD God of recompenses shall surely requite.";
hnv[56] = "for the destroyer is come on her, even on Bavel, and her mighty men are taken, their bows are broken in pieces; for the LORD is a God of recompenses, he will surely requite.";
vul[56] = "quia venit super eam id est super Babylonem praedo et adprehensi sunt fortes eius et emarcuit arcus eorum quia fortis ultor Dominus reddens retribuet";
kjv[57] = "And I will make drunk her princes, and her wise [men], her captains, and her rulers, and her mighty men: and they shall sleep a perpetual sleep, and not wake, saith the King, whose name [is] the LORD of hosts.";
rsv[57] = "I will make drunk her princes and her wise men, her governors, her commanders, and her warriors; they shall sleep a perpetual sleep and not wake, says the King, whose name is the LORD of hosts.";
asv[57] = "And I will make drunk her princes and her wise men, her governors and her deputies, and her mighty men; and they shall sleep a perpetual sleep, and not wake, saith the King, whose name is Jehovah of hosts.";
yng[57] = "And I have caused its princes to drink, And its wise men, its governors, And its prefects, and its mighty ones, And they have slept a sleep age-during, And they awake not -- an affirmation of the king, Jehovah of Hosts [is] His name.";
dby[57] = "And I will make drunk her princes, and her wise men, her governors, and her rulers, and her mighty men; and they shall sleep a perpetual sleep, and not wake, saith the King, whose name is Jehovah of hosts.";
web[57] = "And I will make drunk her princes, and her wise [men], her captains, and her rulers, and her mighty men: and they shall sleep a perpetual sleep, and not wake, saith the king, whose name [is] the LORD of hosts.";
hnv[57] = "I will make drunk her princes and her wise men, her governors and her deputies, and her mighty men; and they shall sleep a perpetual sleep, and not wake up, says the King, whose name is the LORD of Hosts.";
vul[57] = "et inebriabo principes eius et sapientes eius duces eius et magistratus eius et fortes eius et dormient somnum sempiternum et non expergiscentur ait Rex Dominus exercituum nomen eius";
kjv[58] = "Thus saith the LORD of hosts; The broad walls of Babylon shall be utterly broken, and her high gates shall be burned with fire; and the people shall labour in vain, and the folk in the fire, and they shall be weary.";
rsv[58] = "&quot;Thus says the LORD of hosts: The broad wall of Babylon shall be leveled to the ground and her high gates shall be burned with fire. The peoples labor for nought, and the nations weary themselves only for fire.&quot;";
asv[58] = "Thus saith Jehovah of hosts: The broad walls of Babylon shall be utterly overthrown, and her high gates shall be burned with fire; and the peoples shall labor for vanity, and the nations for the fire; and they shall be weary.";
yng[58] = "Thus said Jehovah of Hosts, the wall of Babylon -- The broad one -- is utterly made bare, And her high gates with fire are burnt, And peoples labour in vain, And nations in fire, and have been weary!";
dby[58] = "Thus saith Jehovah of hosts: The broad walls of Babylon shall be utterly laid bare, and her high gates shall be burned with fire; so that the peoples will have laboured in vain, and the nations for the fire: and they shall be weary.";
web[58] = "Thus saith the LORD of hosts; The broad walls of Babylon shall be utterly broken, and her high gates shall be burned with fire; and the people shall labor in vain, and the people in the fire, and they shall be weary.";
hnv[58] = "Thus says the LORD of hosts: The broad walls of Bavel shall be utterly overthrown, and her high gates shall be burned with fire; and the peoples shall labor for vanity, and the nations for the fire; and they shall be weary.";
vul[58] = "haec dicit Dominus exercituum murus Babylonis ille latissimus suffossione suffodietur et portae eius excelsae igni conburentur et labores populorum ad nihilum et gentium in igne erunt et disperibunt";

asv[60] = "And Jeremiah wrote in a book all the evil that should come upon Babylon, even all these words that are written concerning Babylon.";

yng[62] = "and hast said: Jehovah, Thou, Thou hast spoken concerning this place, to cut it off, that there is none dwelling in it, from man even unto cattle, for it is a desolation age-during.";
