csb[1] = "This is the word of the LORD that came to the prophet Jeremiah about the nations:";
csb[2] = "About Egypt and the army of Pharaoh Neco, Egypt\'s king, which was defeated at Carchemish on the Euphrates River by King Nebuchadnezzar of Babylon in the fourth year of Judah\'s King Jehoiakim son of Josiah:";
csb[3] = "Deploy small shields and large; approach for battle!";
csb[4] = "Harness the horses; mount the steeds; take your positions with helmets on! Polish the lances; put on armor!";
csb[5] = "Why have I seen this? They are terrified, they are retreating, their warriors are crushed, they flee headlong, they never look back, terror is on every side! This is the LORD\'s declaration.";
csb[6] = "The swift cannot flee, and the warrior cannot escape! In the north by the bank of the Euphrates River, they stumble and fall.";
csb[7] = "Who is this, rising like the Nile, with waters that churn like rivers?";
csb[8] = "Egypt rises like the Nile, and its waters churn like rivers. He boasts, &quot;I will go up, I will cover the earth; I will destroy cities with their residents.&quot;";
csb[9] = "Rise up, you cavalry! Race furiously, you chariots! Let the warriors march out -- Cush and Put, who are able to handle shields, and the men of Lud, who are able to handle and string the bow.";
csb[10] = "That day belongs to the Lord, the GOD of Armies, a day of vengeance to avenge himself against his adversaries. The sword will devour and be satisfied; it will drink its fill of their blood, because it will be a sacrifice to the Lord, the GOD of Armies, in the northern land by the Euphrates River.";
csb[11] = "Go up to Gilead and get balm, Virgin Daughter Egypt! You have multiplied remedies in vain; there is no healing for you.";
csb[12] = "The nations have heard of your dishonor, and your cries fill the earth, because warrior stumbles against warrior and together both of them have fallen.";
csb[13] = "This is the word the LORD spoke to the prophet Jeremiah about the coming of King Nebuchadnezzar of Babylon to defeat the land of Egypt:";
csb[14] = "Announce it in Egypt, and proclaim it in Migdol! Proclaim it in Memphis and in Tahpanhes! Say, &quot;Take positions! Prepare yourself, for the sword devours all around you.&quot;";
csb[15] = "Why have your strong ones been swept away? Each has not stood, for the LORD has thrust him down.";
csb[16] = "He continues to stumble. Indeed, each falls over the other. They say, &quot;Get up! Let\'s return to our people and to our native land, away from the oppressor\'s sword.&quot;";
csb[17] = "There they will cry out, &quot;Pharaoh king of Egypt was all noise; he let the opportune moment pass.&quot;";
csb[18] = "As I live -- this is the King\'s declaration; the LORD of Armies is his name -- the king of Babylon will come like Tabor among the mountains and like Carmel by the sea.";
csb[19] = "Get your bags ready for exile, inhabitant of Daughter Egypt! For Memphis will become a desolation, uninhabited ruins.";
csb[20] = "Egypt is a beautiful young cow, but a horsefly from the north is coming against her.";
csb[21] = "Even her mercenaries among her are like stall-fed calves. They too will turn back; together they will flee; they will not take their stand, for the day of their calamity is coming on them, the time of their punishment.";
csb[22] = "Egypt will hiss like a slithering snake, for the enemy will come with an army; with axes they will come against her like those who cut trees.";
csb[23] = "They will cut down her forest -- this is the LORD\'s declaration -- though it is dense, for they are more numerous than locusts; they cannot be counted.";
csb[24] = "Daughter Egypt will be put to shame, handed over to a northern people.";
csb[25] = "The LORD of Armies, the God of Israel, says, &quot;I am about to punish Amon, god of Thebes, along with Pharaoh, Egypt, her gods, and her kings -- Pharaoh and those trusting in him.";
csb[26] = "&quot;I will hand them over to those who intend to take their lives -- to King Nebuchadnezzar of Babylon and his officers. But after this, Egypt will be inhabited again as in ancient times.&quot; This is the LORD\'s declaration.";
csb[27] = "But you, my servant Jacob, do not be afraid, and do not be discouraged, Israel, for without fail I will save you from far away, and your descendants from the land of their captivity! Jacob will return and have calm and quiet with no one to frighten him.";
csb[28] = "And you, my servant Jacob, do not be afraid -- this is the LORD\'s declaration -- for I will be with you. I will bring destruction on all the nations where I have banished you, but I will not bring destruction on you. I will discipline you with justice, and I will by no means leave you unpunished.";

yng[1] = "That which hath been the word of Jehovah unto Jeremiah the prophet concerning the nations,";

web[1] = "The word of the LORD which came to Jeremiah the prophet against the Gentiles;";
hnv[1] = "The word of the LORD which came to Yirmeyahu the prophet concerning the nations.";

kjv[2] = "Against Egypt, against the army of Pharaohnecho king of Egypt, which was by the river Euphrates in Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah king of Judah.";
rsv[2] = "About Egypt. Concerning the army of Pharaoh Neco, king of Egypt, which was by the river Euphra\'tes at Car\'chemish and which Nebuchadrez\'zar king of Babylon defeated in the fourth year of Jehoi\'akim the son of Josi\'ah, king of Judah:";
asv[2] = "Of Egypt: concerning the army of Pharaoh-neco king of Egypt, which was by the river Euphrates in Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah, king of Judah.";
yng[2] = "For Egypt, concerning the force of Pharaoh-Necho king of Egypt, that hath been by the river Phrat, in Carchemish, that Nebuchadrezzar king of Babylon hath smitten, in the fourth year of Jehoiakim son of Josiah king of Judah:";
dby[2] = "Of Egypt: concerning the army of Pharaoh-Necho king of Egypt, which was by the river Euphrates at Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah, the king of Judah.";
web[2] = "Against Egypt, against the army of Pharaoh-necho king of Egypt, who was by the river Euphrates in Carshemish, whom Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah king of Judah.";
hnv[2] = "Of Mitzrayim: concerning the army of Par`oh-Nekho king of Mitzrayim, which was by the river Perat in Karkemish, which Nevukhadretztzar king of Bavel struck in the fourth year of Yehoiakim the son of Yoshiyahu, king of Yehudah.";
vul[2] = "ad Aegyptum adversum exercitum Pharaonis Nechao regis Aegypti qui erat iuxta flumen Eufraten in Charchamis quem percussit Nabuchodonosor rex Babylonis in quarto anno Ioachim filii Iosiae regis Iuda";
kjv[3] = "Order ye the buckler and shield, and draw near to battle.";
rsv[3] = "&quot;Prepare buckler and shield, and advance for battle!";
asv[3] = "Prepare ye the buckler and shield, and draw near to battle.";
yng[3] = "`Set ye in array shield and buckler, And draw nigh to battle.";
dby[3] = "Make ready buckler and shield, and draw near to battle!";
web[3] = "Order ye the buckler and shield, and draw near to battle.";
hnv[3] = "Prepare you the buckler and shield, and draw near to battle.";
vul[3] = "praeparate scutum et clypeum et procedite ad bellum";

rsv[4] = "Harness the horses; mount, O horsemen! Take your stations with your helmets, polish your spears, put on your coats of mail!";
asv[4] = "Harness the horses, and get up, ye horsemen, and stand forth with your helmets; furbish the spears, put on the coats of mail.";
yng[4] = "Gird the horses, and go up, ye horsemen, And station yourselves with helmets, Polish the javelins, put on the coats of mail.";
dby[4] = "Harness the horses, and mount ye horsemen, and stand forth with helmets; polish the spears, put on the coats of mail!";

kjv[5] = "Wherefore have I seen them dismayed [and] turned away back? and their mighty ones are beaten down, and are fled apace, and look not back: [for] fear [was] round about, saith the LORD.";
rsv[5] = "Why have I seen it? They are dismayed and have turned backward. Their warriors are beaten down, and have fled in haste; they look not back--terror on every side! says the LORD.";
asv[5] = "Wherefore have I seen it? they are dismayed and are turned backward; and their mighty ones are beaten down, and are fled apace, and look not back: terror is on every side, saith Jehovah.";
yng[5] = "Wherefore have I seen them dismayed -- They are turned backward, And their mighty ones are beaten down, And [to] a refuge they have fled, and not turned the face? Fear [is] round about -- an affirmation of Jehovah.";
dby[5] = "Why do I see them dismayed, turned away back? And their mighty ones are beaten down, and take to flight, and look not back? Terror [is] on every side, saith Jehovah.";
web[5] = "Why have I seen them dismayed [and] turned away back? and their mighty ones are beaten down, and have fled apace, and look not back: [for] fear [was] on all sides, saith the LORD.";
hnv[5] = "Why have I seen it? they are dismayed and are turned backward; and their mighty ones are beaten down, and have fled apace, and don\'t look back: terror is on every side, says the LORD.";
vul[5] = "quid igitur vidi ipsos pavidos et terga vertentes fortes eorum caesos fugerunt conciti nec respexerunt terror undique ait Dominus";

rsv[6] = "The swift cannot flee away, nor the warrior escape; in the north by the river Euphra\'tes they have stumbled and fallen.";
asv[6] = "Let not the swift flee away, nor the mighty man escape; in the north by the river Euphrates have they stumbled and fallen.";
yng[6] = "The swift do not flee, nor do the mighty escape, Northward, by the side of the river Phrat, They have stumbled and fallen.";
dby[6] = "Let not the swift flee away, neither let the mighty man escape! -- Toward the north, hard by the river Euphrates, they have stumbled and fallen.";
web[6] = "Let not the swift flee away, nor the mighty man escape! they shall stumble, and fall towards the north by the river Euphrates.";
hnv[6] = "Don\'t let the swift flee away, nor the mighty man escape; in the north by the river Perat have they stumbled and fallen.";
vul[6] = "non fugiat velox nec salvari se putet fortis ad aquilonem iuxta flumen Eufraten victi sunt et ruerunt";

yng[7] = "Who is this? as a flood he cometh up, As rivers do his waters shake themselves!";
dby[7] = "Who is this [that] riseth up as the Nile, whose waters toss themselves like the rivers?";

hnv[7] = "Who is this who rises up like the Nile, whose waters toss themselves like the rivers?";

kjv[8] = "Egypt riseth up like a flood, and [his] waters are moved like the rivers; and he saith, I will go up, [and] will cover the earth; I will destroy the city and the inhabitants thereof.";
rsv[8] = "Egypt rises like the Nile, like rivers whose waters surge. He said, I will rise, I will cover the earth, I will destroy cities and their inhabitants.";
asv[8] = "Egypt riseth up like the Nile, and his waters toss themselves like the rivers: and he saith, I will rise up, I will cover the earth; I will destroy cities and the inhabitants thereof.";
yng[8] = "Egypt, as a flood cometh up, And as rivers the waters shake themselves. And he saith, I go up; I cover the land, I destroy the city and the inhabitants in it.";
dby[8] = "It is Egypt that riseth up as the Nile, and [his] waters toss themselves like the rivers; and he saith, I will rise up, I will cover the earth; I will destroy the city and the inhabitants thereof.";

kjv[9] = "Come up, ye horses; and rage, ye chariots; and let the mighty men come forth; the Ethiopians and the Libyans, that handle the shield; and the Lydians, that handle [and] bend the bow.";

asv[9] = "Go up, ye horses; and rage, ye chariots; and let the mighty men go forth: Cush and Put, that handle the shield; and the Ludim, that handle and bend the bow.";
yng[9] = "Go up, ye horses; and boast yourselves, ye chariots, And go forth, ye mighty, Cush and Phut handling the shield, And Lud handling -- treading the bow.";

kjv[10] = "For this [is] the day of the Lord GOD of hosts, a day of vengeance, that he may avenge him of his adversaries: and the sword shall devour, and it shall be satiate and made drunk with their blood: for the Lord GOD of hosts hath a sacrifice in the north country by the river Euphrates.";
rsv[10] = "That day is the day of the Lord GOD of hosts, a day of vengeance, to avenge himself on his foes. The sword shall devour and be sated, and drink its fill of their blood. For the Lord GOD of hosts holds a sacrifice in the north country by the river Euphra\'tes.";
asv[10] = "For that day is [a day] of the Lord, Jehovah of hosts, a day of vengeance, that he may avenge him of his adversaries: and the sword shall devour and be satiate, and shall drink its fill of their blood; for the Lord, Jehovah of hosts, hath a sacrifice in the north country by the river Euphrates.";
yng[10] = "And that day [is] to the Lord Jehovah of Hosts A day of vengeance, To be avenged of His adversaries, And the sword hath devoured, and been satisfied, And it hath been watered from their blood, For a sacrifice [is] to the Lord Jehovah of Hosts, In the land of the north, by the river Phrat.";
dby[10] = "For this is the day of the Lord Jehovah of hosts, a day of vengeance, that he may be avenged of his adversaries; and the sword shall devour, and it shall be sated and made drunk with their blood; for the Lord Jehovah of hosts hath a sacrifice in the north country, by the river Euphrates.";
web[10] = "For this [is] the day of the Lord GOD of hosts, a day of vengeance, that he may avenge him of his adversaries: and the sword shall devour, and it shall be satiated and made drunk with their blood: for the Lord GOD of hosts hath a sacrifice in the north country by the river Euphrates.";
hnv[10] = "For that day is [a day] of the Lord, the LORD of Hosts, a day of vengeance, that he may avenge him of his adversaries: and the sword shall devour and be satiate, and shall drink its fill of their blood; for the Lord, the LORD of hosts, has a sacrifice in the north country by the river Perat.";

yng[11] = "Go up to Gilead, and take balm, O virgin daughter of Egypt, In vain thou hast multiplied medicines, Healing there is none for thee.";

asv[18] = "As I live, saith the King, whose name is Jehovah of hosts, surely like Tabor among the mountains, and like Carmel by the sea, so shall he come.";

dby[18] = "[As] I live, saith the King, whose name is Jehovah of hosts, surely as Tabor among the mountains, and as Carmel by the sea, so shall he come.";
web[18] = "[As] I live, saith the king, whose name [is] the LORD of hosts, Surely as Tabor [is] among the mountains, and as Carmel by the sea, [so] shall he come.";
hnv[18] = "As I live, says the King, whose name is the LORD of Hosts, surely like Tavor among the mountains, and like Karmel by the sea, so shall he come.";
vul[18] = "vivo ego inquit Rex Dominus exercituum nomen eius quoniam sicut Thabor in montibus et sicut Carmelus in mari veniet";
kjv[19] = "O thou daughter dwelling in Egypt, furnish thyself to go into captivity: for Noph shall be waste and desolate without an inhabitant.";
rsv[19] = "Prepare yourselves baggage for exile, O inhabitants of Egypt! For Memphis shall become a waste, a ruin, without inhabitant.";
asv[19] = "O thou daughter that dwellest in Egypt, furnish thyself to go into captivity; for Memphis shall become a desolation, and shall be burnt up, without inhabitant.";
yng[19] = "Goods for removal make for thee, O inhabitant, daughter of Egypt, For Noph becometh a desolation, And hath been burnt up, without inhabitant.";
dby[19] = "Thou, inhabitress, daughter of Egypt, furnish for thyself a captive\'s baggage, for Noph shall be a desolation and shall be ruined, so that none shall dwell therein.";
web[19] = "O thou daughter dwelling in Egypt, furnish thyself to go into captivity: for Noph shall be waste and desolate without an inhabitant.";
hnv[19] = "You daughter who dwell in Mitzrayim, furnish yourself to go into captivity; for Mof shall become a desolation, and shall be burnt up, without inhabitant.";
vul[19] = "vasa transmigrationis fac tibi habitatrix filia Aegypti quia Memphis in solitudinem erit et deseretur inhabitabilis";
kjv[20] = "Egypt [is like] a very fair heifer, [but] destruction cometh; it cometh out of the north.";
rsv[20] = "&quot;A beautiful heifer is Egypt, but a gadfly from the north has come upon her.";
asv[20] = "Egypt is a very fair heifer; [but] destruction out of the north is come, it is come.";
yng[20] = "A heifer very fair [is] Egypt, Rending from the north doth come into her.";
dby[20] = "Egypt is a very fair heifer; the gad-fly cometh, it cometh from the north.";
web[20] = "Egypt [is like] a very fair heifer, [but] destruction cometh; it cometh out of the north.";
hnv[20] = "Mitzrayim is a very beautiful heifer; [but] destruction out of the north is come, it is come.";
vul[20] = "vitula eligans atque formonsa Aegyptus stimulator ab aquilone veniet ei";
kjv[21] = "Also her hired men [are] in the midst of her like fatted bullocks; for they also are turned back, [and] are fled away together: they did not stand, because the day of their calamity was come upon them, [and] the time of their visitation.";
rsv[21] = "Even her hired soldiers in her midst are like fatted calves; yea, they have turned and fled together, they did not stand; for the day of their calamity has come upon them, the time of their punishment.";
asv[21] = "Also her hired men in the midst of her are like calves of the stall; for they also are turned back, they are fled away together, they did not stand: for the day of their calamity is come upon them, the time of their visitation.";
yng[21] = "Even her hired ones in her midst [are] as calves of the stall, For even they have turned, They have fled together, they have not stood, For the day of their calamity hath come on them, The time of their inspection.";
dby[21] = "Also her hired men in the midst of her are like fatted bullocks; for they also have turned back, they have fled away together, they did not stand; for the day of their calamity is come upon them, the time of their visitation.";
web[21] = "Also her hired men [are] in the midst of her like fatted bullocks; for they also have turned back, [and] have fled away together: they did not stand, because the day of their calamity had come upon them, [and] the time of their visitation.";
hnv[21] = "Also her hired men in the midst of her are like calves of the stall; for they also are turned back, they are fled away together, they didn\'t stand: for the day of their calamity is come on them, the time of their visitation.";
vul[21] = "mercennarii quoque eius qui versabantur in medio eius quasi vituli saginati versi sunt et fugerunt simul nec stare potuerunt quia dies interfectionis eorum venit super eos tempus visitationis eorum";
kjv[22] = "The voice thereof shall go like a serpent; for they shall march with an army, and come against her with axes, as hewers of wood.";
rsv[22] = "&quot;She makes a sound like a serpent gliding away; for her enemies march in force, and come against her with axes, like those who fell trees.";
asv[22] = "The sound thereof shall go like the serpent; for they shall march with an army, and come against her with axes, as hewers of wood.";
yng[22] = "Its voice as a serpent goeth on, For with a force they go, And with axes they have come in to her, As hewers of trees.";
dby[22] = "Her voice shall go like a serpent\'s; for they shall march with an army, and come against her with axes, as hewers of wood.";
web[22] = "The voice thereof shall go like a serpent; for they shall march with an army, and come against her with axes, as hewers of wood.";
hnv[22] = "The sound of it shall go like the serpent; for they shall march with an army, and come against her with axes, as wood cutters.";
vul[22] = "vox eius quasi aeris sonabit quoniam cum exercitu properabunt et cum securibus venient ei quasi ligna caedentes";
kjv[23] = "They shall cut down her forest, saith the LORD, though it cannot be searched; because they are more than the grasshoppers, and [are] innumerable.";
rsv[23] = "They shall cut down her forest, says the LORD, though it is impenetrable, because they are more numerous than locusts; they are without number.";
asv[23] = "They shall cut down her forest, saith Jehovah, though it cannot be searched; because they are more than the locusts, and are innumerable.";
yng[23] = "They have cut down her forest, An affirmation of Jehovah -- for it is not searched, For they have been more than the grasshopper, And they have no numbering.";
dby[23] = "They shall cut down her forest, saith Jehovah, though it be impenetrable; for they are more than the locusts, and are innumerable.";
web[23] = "They shall cut down her forest, saith the LORD, though it cannot be searched; because they are more than the grasshoppers, and [are] innumerable.";
hnv[23] = "They shall cut down her forest, says the LORD, though it can\'t be searched; because they are more than the locusts, and are innumerable.";
vul[23] = "succiderunt saltum eius ait Dominus qui supputari non potest multiplicati sunt super lucustas et non est eis numerus";
kjv[24] = "The daughter of Egypt shall be confounded; she shall be delivered into the hand of the people of the north.";
rsv[24] = "The daughter of Egypt shall be put to shame, she shall be delivered into the hand of a people from the north.&quot;";
asv[24] = "The daughter of Egypt shall be put to shame; she shall be delivered into the hand of the people of the north.";
yng[24] = "Ashamed hath been the daughter of Egypt, She hath been given into the hand of the people of the north.";
dby[24] = "The daughter of Egypt is put to shame; she is delivered into the hand of the people of the north.";
web[24] = "The daughter of Egypt shall be confounded; she shall be delivered into the hand of the people of the north.";
hnv[24] = "The daughter of Mitzrayim shall be disappointed; she shall be delivered into the hand of the people of the north.";
vul[24] = "confusa est filia Aegypti et tradita in manu populi aquilonis";
kjv[25] = "The LORD of hosts, the God of Israel, saith; Behold, I will punish the multitude of No, and Pharaoh, and Egypt, with their gods, and their kings; even Pharaoh, and [all] them that trust in him:";
rsv[25] = "The LORD of hosts, the God of Israel, said: &quot;Behold, I am bringing punishment upon Amon of Thebes, and Pharaoh, and Egypt and her gods and her kings, upon Pharaoh and those who trust in him.";
asv[25] = "Jehovah of hosts, the God of Israel, saith: Behold, I will punish Amon of No, and Pharaoh, and Egypt, with her gods, and her kings; even Pharaoh, and them that trust in him:";
yng[25] = "Said hath Jehovah of Hosts, God of Israel: Lo, I am seeing after Amon of No, And after Pharaoh, and after Egypt, And after her gods, and after her kings, And after Pharaoh, and after those trusting in him,";
dby[25] = "Jehovah of hosts, the God of Israel, saith, Behold, I will punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings; yea, Pharaoh and them that confide in him.";
web[25] = "The LORD of hosts, the God of Israel saith: Behold, I will punish the multitude of No, and Pharaoh, and Egypt, with their gods, and their kings; even Pharaoh, and [all] them that trust in him:";
hnv[25] = "The LORD of Hosts, the God of Yisra\'el, says: Behold, I will punish Amon of No, and Par`oh, and Mitzrayim, with her gods, and her kings; even Par`oh, and those who trust in him:";
vul[25] = "dixit Dominus exercituum Deus Israhel ecce ego visitabo super tumultum Alexandriae et super Pharao et super Aegyptum et super deos eius et super reges eius et super Pharao et super eos qui confidunt in eo";
kjv[26] = "And I will deliver them into the hand of those that seek their lives, and into the hand of Nebuchadrezzar king of Babylon, and into the hand of his servants: and afterward it shall be inhabited, as in the days of old, saith the LORD.";
rsv[26] = "I will deliver them into the hand of those who seek their life, into the hand of Nebuchadrez\'zar king of Babylon and his officers. Afterward Egypt shall be inhabited as in the days of old, says the LORD.";
asv[26] = "and I will deliver them into the hand of those that seek their lives, and into the hand of Nebuchadrezzar king of Babylon, and into the hand of his servants; and afterwards it shall be inhabited, as in the days of old, saith Jehovah.";
yng[26] = "And I have given them into the hand of those seeking their life, And into the hand of Nebuchadrezzar king of Babylon, And into the hand of his servants, And afterwards it is inhabited, As [in] days of old -- an affirmation of Jehovah.";
dby[26] = "And I will give them into the hand of those that seek their life, and into the hand of Nebuchadrezzar king of Babylon, and into the hand of his servants; but afterwards it shall be inhabited, as in the days of old, saith Jehovah.";
web[26] = "And I will deliver them into the hand of those that seek their lives, and into the hand of Nebuchadrezzar king of Babylon, and into the hand of his servants: and afterward it shall be inhabited, as in the days of old, saith the LORD.";
hnv[26] = " and I will deliver them into the hand of those who seek their lives, and into the hand of Nevukhadretztzar king of Bavel, and into the hand of his servants; and afterwards it shall be inhabited, as in the days of old, says the LORD.";
vul[26] = "et dabo eos in manu quaerentium animam eorum et in manu Nabuchodonosor regis Babylonis et in manu servorum eius et post haec habitabitur sicut diebus pristinis ait Dominus";
kjv[27] = "But fear not thou, O my servant Jacob, and be not dismayed, O Israel: for, behold, I will save thee from afar off, and thy seed from the land of their captivity; and Jacob shall return, and be in rest and at ease, and none shall make [him] afraid.";
rsv[27] = "&quot;But fear not, O Jacob my servant, nor be dismayed, O Israel; for lo, I will save you from afar, and your offspring from the land of their captivity. Jacob shall return and have quiet and ease, and none shall make him afraid.";
asv[27] = "But fear not thou, O Jacob my servant, neither be dismayed, O Israel: for, lo, I will save thee from afar, and thy seed from the land of their captivity; and Jacob shall return, and shall be quiet and at ease, and none shall make him afraid.";
yng[27] = "And thou, thou dost not fear, my servant Jacob, Nor [art] thou dismayed, O Israel, For lo, I am saving thee from afar, And thy seed from the land of their captivity, And Jacob hath turned back, And hath been at rest, and been at ease, And there is none disturbing.";
dby[27] = "But thou, my servant Jacob, fear not, neither be dismayed, Israel: for behold, I will save thee from afar, and thy seed from the land of their captivity; and Jacob shall return, and be in rest and at ease, and none shall make [him] afraid.";
web[27] = "But fear not thou, O my servant Jacob, and be not dismayed, O Israel: for behold, I will save thee from afar, and thy seed from the land of their captivity; and Jacob shall return, and be in rest and at ease, and none shall make [him] afraid.";
hnv[27] = "But don\'t be afraid you, Ya`akov my servant, neither be dismayed, Yisra\'el: for, behold, I will save you from afar, and your seed from the land of their captivity; and Ya`akov shall return, and shall be quiet and at ease, and none shall make him afraid.";
vul[27] = "et tu ne timeas serve meus Iacob et ne paveas Israhel quia ecce ego salvum te faciam de longinquo et semen tuum de terra captivitatis suae et revertetur Iacob et quiescet et prosperabitur et non erit qui exterreat eum";
kjv[28] = "Fear thou not, O Jacob my servant, saith the LORD: for I [am] with thee; for I will make a full end of all the nations whither I have driven thee: but I will not make a full end of thee, but correct thee in measure; yet will I not leave thee wholly unpunished.";
rsv[28] = "Fear not, O Jacob my servant, says the LORD, for I am with you. I will make a full end of all the nations to which I have driven you, but of you I will not make a full end. I will chasten you in just measure, and I will by no means leave you unpunished.&quot;";
asv[28] = "Fear not thou, O Jacob my servant, saith Jehovah; for I am with thee: for I will make a full end of all the nations whither I have driven thee; but I will not make a full end of thee, but I will correct thee in measure, and will in no wise leave thee unpunished.";
yng[28] = "Thou, thou dost not fear, My servant Jacob, An affirmation of Jehovah -- for with thee I [am], For I make an end of all the nations Whither I have driven thee, And of thee I do not make an end, And I have reproved thee in judgment, And do not entirely acquit thee!\'";
dby[28] = "Fear thou not, my servant Jacob, saith Jehovah: for I am with thee; for I will make a full end of all the nations whither I have driven thee, but I will not make a full end of thee; but I will correct thee with judgment, and I will not hold thee altogether guiltless.";
web[28] = "Fear thou not, O Jacob my servant, saith the LORD: for I [am] with thee; for I will make a full end of all the nations whither I have driven thee: but I will not make a full end of thee, but correct thee in measure; yet will I not leave thee wholly unpunished.";
hnv[28] = "Don\'t be afraid you, O Ya`akov my servant, says the LORD; for I am with you: for I will make a full end of all the nations where I have driven you; but I will not make a full end of you, but I will correct you in measure, and will in no way leave you unpunished.";
vul[28] = "et tu noli timere serve meus Iacob ait Dominus quia tecum ego sum quia consumam ego cunctas gentes ad quas eieci te te vero non consumam sed castigabo te in iudicio nec quasi innocenti parcam tibi";
</script>
