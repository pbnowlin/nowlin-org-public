csb[1] = "Boaz went to the gate of the town and sat down there. Soon the family redeemer Boaz had spoken about came by. Boaz said, &quot;Come over here and sit down.&quot; So he went over and sat down.";
csb[2] = "Then Boaz took ten men of the town\'s elders and said, &quot;Sit here.&quot; And they sat down.";
csb[3] = "He said to the redeemer, &quot;Naomi, who has returned from the territory of Moab, is selling the portion of the field that belonged to our brother Elimelech.";
csb[4] = "&quot;I thought I should inform you: Buy it back in the presence of those seated here and in the presence of the elders of my people. If you want to redeem it, do it. But if you do not want to redeem it, tell me so that I will know, because there isn\'t anyone other than you to redeem it, and I am next after you.&quot; &quot;I want to redeem it,&quot; he answered.";
csb[5] = "Then Boaz said, &quot;On the day you buy the field from Naomi, you will acquire Ruth the Moabitess, the wife of the deceased man, to perpetuate the man\'s name on his property.&quot;";
csb[6] = "The redeemer replied, &quot;I can\'t redeem it myself, or I will ruin my own inheritance. Take my right of redemption, because I can\'t redeem it.&quot;";
csb[7] = "At an earlier period in Israel, a man removed his sandal and gave it to the other party in order to make any matter legally binding concerning the right of redemption or the exchange of property. This was the method of legally binding a transaction in Israel.";
csb[8] = "So the redeemer removed his sandal and said to Boaz, &quot;Buy back the property yourself.&quot;";
csb[9] = "Boaz said to the elders and all the people, &quot;You are witnesses today that I am buying from Naomi everything that belonged to Elimelech, Chilion, and Mahlon.";
csb[10] = "&quot;I have also acquired Ruth the Moabitess, Mahlon\'s widow, as my wife, to perpetuate the deceased man\'s name on his property, so that his name will not disappear among his relatives or from the gate of his hometown. You are witnesses today.&quot;";
csb[11] = "All the people who were at the city gate, including the elders, said, &quot;We are witnesses. May the LORD make the woman who is entering your house like Rachel and Leah, who together built the house of Israel. May you be powerful in Ephrathah and your name well known in Bethlehem.";
csb[12] = "&quot;May your house become like the house of Perez, the son Tamar bore to Judah, because of the offspring the LORD will give you by this young woman.&quot;";
csb[13] = "Boaz took Ruth and she became his wife. He slept with her, and the LORD granted conception to her, and she gave birth to a son.";
csb[14] = "The women said to Naomi, &quot;Blessed be the LORD, who has not left you without a family redeemer today. May his name become well known in Israel.";
csb[15] = "&quot;He will renew your life and sustain you in your old age. Indeed, your daughter-in-law, who loves you and is better to you than seven sons, has given birth to him.&quot;";
csb[16] = "Naomi took the child, placed him on her lap, and became his nanny.";
csb[17] = "The neighbor women said, &quot;A son has been born to Naomi,&quot; and they named him Obed. He was the father of Jesse, the father of David.";
csb[18] = "Now these are the family records of Perez: Perez fathered Hezron,";
csb[19] = "Hezron fathered Ram, Ram fathered Amminadab,";
csb[20] = "Amminadab fathered Nahshon, Nahshon fathered Salmon,";
csb[21] = "Salmon fathered Boaz, Boaz fathered Obed,";
csb[22] = "Obed fathered Jesse, and Jesse fathered David.";
kjv[1] = "Then went Boaz up to the gate, and sat him down there: and, behold, the kinsman of whom Boaz spake came by; unto whom he said, Ho, such a one! turn aside, sit down here. And he turned aside, and sat down.";
rsv[1] = "And Bo\'az went up to the gate and sat down there; and behold, the next of kin, of whom Bo\'az had spoken, came by. So Bo\'az said, &quot;Turn aside, friend; sit down here&quot;; and he turned aside and sat down.";
asv[1] = "Now Boaz went up to the gate, and sat him down there: and, behold, the near kinsman of whom Boaz spake came by; unto whom he said, Ho, such a one! turn aside, sit down here. And he turned aside, and sat down.";
yng[1] = "And Boaz hath gone up to the gate, and sitteth there, and lo, the redeemer is passing by of whom Boaz had spoken, and he saith, `Turn aside, sit down here, such a one, such a one;\' and he turneth aside and sitteth down.";
dby[1] = "And Boaz went up to the gate, and sat down there. And behold, he that had the right of redemption, of whom Boaz had spoken, came by. And he said, Thou, such a one, turn aside, sit down here. And he turned aside and sat down.";

vul[1] = "ascendit ergo Booz ad portam et sedit ibi cumque vidisset propinquum praeterire de quo prius sermo habitus est dixit ad eum declina paulisper et sede hic vocans eum nomine suo qui devertit et sedit";

web[2] = "And he took ten men of the elders of the city, and said, Sit ye down here. And they sat down.";

vul[2] = "tollens autem Booz decem viros de senioribus civitatis dixit ad eos sedete hic";

asv[3] = "And he said unto the near kinsman, Naomi, that is come again out of the country of Moab, selleth the parcel of land, which was our brother Elimelech\'s:";

kjv[4] = "And I thought to advertise thee, saying, Buy [it] before the inhabitants, and before the elders of my people. If thou wilt redeem [it], redeem [it]: but if thou wilt not redeem [it, then] tell me, that I may know: for [there is] none to redeem [it] beside thee; and I [am] after thee. And he said, I will redeem [it].";
rsv[4] = "So I thought I would tell you of it, and say, Buy it in the presence of those sitting here, and in the presence of the elders of my people. If you will redeem it, redeem it; but if you will not, tell me, that I may know, for there is no one besides you to redeem it, and I come after you.&quot; And he said, &quot;I will redeem it.&quot;";
asv[4] = "and I thought to disclose it unto thee, saying, Buy it before them that sit here, and before the elders of my people. If thou wilt redeem it, redeem it: but if thou wilt not redeem it, then tell me, that I may know; for there is none to redeem it besides thee; and I am after thee. And he said, I will redeem it.";
yng[4] = "and I said, I uncover thine ear, saying, Buy before the inhabitants, and before the elders of my people; if thou dost redeem -- redeem, and if none doth redeem -- declare to me, and I know, for there is none save thee to redeem, and I after thee.\' And he saith, I redeem [it].\'";
dby[4] = "And I thought I would apprise thee of it and say, Buy [it] in the presence of the inhabitants, and in the presence of the elders of my people. If thou wilt redeem [it], redeem; but if thou wilt not redeem, tell me, that I may know; for there is none to redeem besides thee; and I am after thee. And he said, I will redeem [it].";
web[4] = "And I thought to advertise thee, saying, Buy [it] before the inhabitants, and before the elders of my people. If thou wilt redeem [it], redeem [it]: but if thou wilt not redeem [it], [then] tell me, that I may know: for [there is] none to redeem [it] besides thee; and I [am] after thee. And he said, I will redeem [it].";
hnv[4] = "I thought to disclose it to you, saying, Buy it before those who sit here, and before the Zakenim of my people. If you will redeem it, redeem it: but if you will not redeem it, then tell me, that I may know; for there is none to redeem it besides you; and I am after you. He said, I will redeem it.";
vul[4] = "quod audire te volui et tibi dicere coram cunctis sedentibus et maioribus natu de populo meo si vis possidere iure propinquitatis eme et posside sin autem tibi displicet hoc ipsum indica mihi ut sciam quid facere debeam nullus est enim propinquus excepto te qui prior es et me qui secundus sum at ille respondit ego agrum emam";
kjv[5] = "Then said Boaz, What day thou buyest the field of the hand of Naomi, thou must buy [it] also of Ruth the Moabitess, the wife of the dead, to raise up the name of the dead upon his inheritance.";
rsv[5] = "Then Bo\'az said, &quot;The day you buy the field from the hand of Na\'omi, you are also buying Ruth the Moabitess, the widow of the dead, in order to restore the name of the dead to his inheritance.&quot;";
asv[5] = "Then said Boaz, What day thou buyest the field of the hand of Naomi, thou must buy it also of Ruth the Moabitess, the wife of the dead, to raise up the name of the dead upon his inheritance.";
yng[5] = "And Boaz saith, `In the day of thy buying the field from the hand of Naomi, then from Ruth the Moabitess, wife of the dead, thou hast bought [it], to raise up the name of the dead over his inheritance.\'";

dby[6] = "And he that had the right of redemption said, I cannot redeem [it] for myself, lest I mar mine own inheritance. Redeem thou for thyself what I should redeem, for I cannot redeem [it].";

kjv[7] = "Now this [was the manner] in former time in Israel concerning redeeming and concerning changing, for to confirm all things; a man plucked off his shoe, and gave [it] to his neighbour: and this [was] a testimony in Israel.";
rsv[7] = "Now this was the custom in former times in Israel concerning redeeming and exchanging: to confirm a transaction, the one drew off his sandal and gave it to the other, and this was the manner of attesting in Israel.";
asv[7] = "Now this was [the custom] in former time in Israel concerning redeeming and concerning exchanging, to confirm all things: a man drew off his shoe, and gave it to his neighbor; and this was the [manner of] attestation in Israel.";
yng[7] = "And this [is] formerly in Israel for redemption and for changing, to establish anything: a man hath drawn off his sandal, and given [it] to his neighbour, and this [is] the testimony in Israel.";
dby[7] = "Now this [was the custom] in former time in Israel concerning redemption and concerning exchange, to confirm the whole matter: a man drew off his sandal, and gave it to his neighbour, and this was the [mode of] attestation in Israel.";

vul[7] = "hic autem erat mos antiquitus in Israhel inter propinquos et si quando alter alteri suo iure cedebat ut esset firma concessio solvebat homo calciamentum suum et dabat proximo suo hoc erat testimonium cessionis in Israhel";

kjv[10] = "Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye [are] witnesses this day.";
rsv[10] = "Also Ruth the Moabitess, the widow of Mahlon, I have bought to be my wife, to perpetuate the name of the dead in his inheritance, that the name of the dead may not be cut off from among his brethren and from the gate of his native place; you are witnesses this day.&quot;";
asv[10] = "Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye are witnesses this day.";

vul[10] = "et Ruth Moabitidem uxorem Maalon in coniugium sumpserim ut suscitem nomen defuncti in hereditate sua ne vocabulum eius de familia sua ac fratribus et populo deleatur vos inquam huius rei testes estis";
kjv[11] = "And all the people that [were] in the gate, and the elders, said, [We are] witnesses. The LORD make the woman that is come into thine house like Rachel and like Leah, which two did build the house of Israel: and do thou worthily in Ephratah, and be famous in Bethlehem:";
rsv[11] = "Then all the people who were at the gate, and the elders, said, &quot;We are witnesses. May the LORD make the woman, who is coming into your house, like Rachel and Leah, who together built up the house of Israel. May you prosper in Eph\'rathah and be renowned in Bethlehem;";
asv[11] = "And all the people that were in the gate, and the elders, said, We are witnesses. Jehovah make the woman that is come into thy house like Rachel and like Leah, which two did build the house of Israel: and do thou worthily in Ephrathah, and be famous in Bethlehem:";
yng[11] = "And all the people who [are] in the gate say -- also the elders -- `Witnesses! Jehovah make the woman who is coming in unto thy house as Rachel and as Leah, both of whom built the house of Israel; and do thou virtuously in Ephrathah, and proclaim the Name in Beth-Lehem;";
dby[11] = "And all the people that were in the gate and the elders said, [We are] witnesses. Jehovah make the woman that cometh into thy house like Rachel and like Leah, which two did build the house of Israel; and acquire power in Ephratah, and make thyself a name in Bethlehem;";
web[11] = "And all the people that [were] in the gate, and the elders said, [We are] witnesses. The LORD make the woman that hath come into thy house like Rachel and like Leah, which two did build the house of Israel: and do thou worthily in Ephratah, and be famous in Beth-lehem:";

vul[11] = "respondit omnis populus qui erat in porta et maiores natu nos testes sumus faciat Dominus hanc mulierem quae ingreditur domum tuam sicut Rachel et Liam quae aedificaverunt domum Israhel ut sit exemplum virtutis in Ephrata et habeat celebre nomen in Bethleem";

rsv[14] = "Then the women said to Na\'omi, &quot;Blessed be the LORD, who has not left you this day without next of kin; and may his name be renowned in Israel!";
