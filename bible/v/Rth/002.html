csb[1] = "Now Naomi had a relative on her husband\'s side. He was a prominent man of noble character from Elimelech\'s family. His name was Boaz.";
csb[2] = "Ruth the Moabitess asked Naomi, &quot;Will you let me go into the fields and gather fallen grain behind someone with whom I find favor? &quot; Naomi answered her, &quot;Go ahead, my daughter.&quot;";
csb[3] = "So Ruth left and entered the field to gather grain behind the harvesters. She happened to be in the portion of the field belonging to Boaz, who was from Elimelech\'s family.";
csb[4] = "Later, when Boaz arrived from Bethlehem, he said to the harvesters, &quot;The LORD be with you.&quot; &quot;The LORD bless you,&quot; they replied.";
csb[5] = "Boaz asked his servant who was in charge of the harvesters, &quot;Whose young woman is this? &quot;";
csb[6] = "The servant answered, &quot;She is the young Moabite woman who returned with Naomi from the territory of Moab.";
csb[7] = "&quot;She asked, \'Will you let me gather fallen grain among the bundles behind the harvesters? \' She came and has been on her feet since early morning, except that she rested a little in the shelter.&quot;";
csb[8] = "Then Boaz said to Ruth, &quot;Listen, my daughter. Don\'t go and gather grain in another field, and don\'t leave this one, but stay here close to my female servants.";
csb[9] = "&quot;See which field they are harvesting, and follow them. Haven\'t I ordered the young men not to touch you? When you are thirsty, go and drink from the jars the young men have filled.&quot;";
csb[10] = "She fell facedown, bowed to the ground, and said to him, &quot;Why have I found favor with you, so that you notice me, although I am a foreigner? &quot;";
csb[11] = "Boaz answered her, &quot;Everything you have done for your mother-in-law since your husband\'s death has been fully reported to me: how you left your father and mother and your native land, and how you came to a people you didn\'t previously know.";
csb[12] = "&quot;May the LORD reward you for what you have done, and may you receive a full reward from the LORD God of Israel, under whose wings you have come for refuge.&quot;";
csb[13] = "&quot;My lord,&quot; she said, &quot;I have found favor with you, for you have comforted and encouraged your servant, although I am not like one of your female servants.&quot;";
csb[14] = "At mealtime Boaz told her, &quot;Come over here and have some bread and dip it in the vinegar sauce.&quot; So she sat beside the harvesters, and he offered her roasted grain. She ate and was satisfied and had some left over.";
csb[15] = "When she got up to gather grain, Boaz ordered his young men, &quot;Let her even gather grain among the bundles, and don\'t humiliate her.";
csb[16] = "&quot;Pull out some stalks from the bundles for her and leave them for her to gather. Don\'t rebuke her.&quot;";
csb[17] = "So Ruth gathered grain in the field until evening. She beat out what she had gathered, and it was about twenty-six quarts of barley.";
csb[18] = "She picked up the grain and went into the town, where her mother-in-law saw what she had gleaned. She brought out what she had left over from her meal and gave it to her.";
csb[19] = "Her mother-in-law said to her, &quot;Where did you gather barley today, and where did you work? May the LORD bless the man who noticed you.&quot; Ruth told her mother-in-law whom she had worked with and said, &quot;The name of the man I worked with today is Boaz.&quot;";
csb[20] = "Then Naomi said to her daughter-in-law, &quot;May the LORD bless him because he has not abandoned his kindness to the living or the dead.&quot; Naomi continued, &quot;The man is a close relative. He is one of our family redeemers.&quot;";
csb[21] = "Ruth the Moabitess said, &quot;He also told me, \'Stay with my young men until they have finished all of my harvest.\' &quot;";
csb[22] = "So Naomi said to her daughter-in-law Ruth, &quot;My daughter, it is good for you to work with his female servants, so that nothing will happen to you in another field.&quot;";
csb[23] = "Ruth stayed close to Boaz\'s female servants and gathered grain until the barley and the wheat harvests were finished. And she lived with her mother-in-law.";

vul[2] = "dixitque Ruth Moabitis ad socrum suam si iubes vadam in agrum et colligam spicas quae metentium fugerint manus ubicumque clementis in me patris familias repperero gratiam cui illa respondit vade filia mi";

asv[3] = "And she went, and came and gleaned in the field after the reapers: and her hap was to light on the portion of the field belonging unto Boaz, who was of the family of Elimelech.";
yng[3] = "And she goeth and cometh and gathereth in a field after the reapers, and her chance happeneth -- the portion of the field is Boaz\'s who [is] of the family of Elimelech.";
dby[3] = "And she went; and she came and gleaned in the fields after the reapers; and she chanced to light on an allotment of Boaz, who was of the family of Elimelech.";

yng[9] = "thine eyes [are] on the field which they reap, and thou hast gone after them; have not I charged the young men not to touch thee? when thou art athirst then thou hast gone unto the vessels, and hast drunk from that which the young men draw.\'";

kjv[11] = "And Boaz answered and said unto her, It hath fully been shewed me, all that thou hast done unto thy mother in law since the death of thine husband: and [how] thou hast left thy father and thy mother, and the land of thy nativity, and art come unto a people which thou knewest not heretofore.";
rsv[11] = "But Bo\'az answered her, &quot;All that you have done for your mother-in-law since the death of your husband has been fully told me, and how you left your father and mother and your native land and came to a people that you did not know before.";
asv[11] = "And Boaz answered and said unto her, It hath fully been showed me, all that thou hast done unto thy mother-in-law since the death of thy husband; and how thou hast left thy father and thy mother, and the land of thy nativity, and art come unto a people that thou knewest not heretofore.";
yng[11] = "And Boaz answereth and saith to her, `It hath thoroughly been declared to me all that thou hast done with thy mother-in-law, after the death of thy husband, and thou dost leave thy father, and thy mother, and the land of thy birth, and dost come in unto a people which thou hast not known heretofore.";
dby[11] = "And Boaz answered and said to her, It has fully been shewn me, all that thou hast done to thy mother-in-law since the death of thy husband; and how thou hast left thy father and thy mother, and the land of thy nativity, and art come to a people that thou hast not known heretofore.";
web[11] = "And Boaz answered and said to her, It hath fully been shown to me, all that thou hast done to thy mother-in-law since the death of thy husband: and [how] thou hast left thy father and thy mother, and the land of thy nativity, and hast come to a people which thou knewest not heretofore.";
hnv[11] = "Bo`az answered her, It has fully been shown me, all that you have done to your mother-in-law since the death of your husband; and how you have left your father and your mother, and the land of your birth, and have come to a people that you didn\'t know before.";
vul[11] = "cui ille respondit nuntiata sunt mihi omnia quae feceris socrui tuae post mortem viri tui et quod dereliqueris parentes tuos et terram in qua nata es et veneris ad populum quem ante nesciebas";
kjv[12] = "The LORD recompense thy work, and a full reward be given thee of the LORD God of Israel, under whose wings thou art come to trust.";
rsv[12] = "The LORD recompense you for what you have done, and a full reward be given you by the LORD, the God of Israel, under whose wings you have come to take refuge!&quot;";

yng[12] = "Jehovah doth recompense thy work, and thy reward is complete from Jehovah, God of Israel, under whose wings thou hast come to take refuge.\'";
dby[12] = "Jehovah recompense thy work, and let thy reward be full from Jehovah the God of Israel, under whose wings thou art come to take refuge.";
web[12] = "The LORD recompense thy work, and a full reward be given thee of the LORD God of Israel, under whose wings thou hast come to trust.";
hnv[12] = "The LORD recompense your work, and a full reward be given you of the LORD, the God of Yisra\'el, under whose wings you are come to take refuge.";
vul[12] = "reddat tibi Dominus pro opere tuo et plenam mercedem recipias a Domino Deo Israhel ad quem venisti et sub cuius confugisti alas";
kjv[13] = "Then she said, Let me find favour in thy sight, my lord; for that thou hast comforted me, and for that thou hast spoken friendly unto thine handmaid, though I be not like unto one of thine handmaidens.";
rsv[13] = "Then she said, &quot;You are most gracious to me, my lord, for you have comforted me and spoken kindly to your maidservant, though I am not one of your maidservants.&quot;";
asv[13] = "Then she said, Let me find favor in thy sight, my lord, for that thou hast comforted me, and for that thou hast spoken kindly unto thy handmaid, though I be not as one of thy handmaidens.";
yng[13] = "And she saith, `Let me find grace in thine eyes, my lord, because thou hast comforted me, and because thou hast spoken unto the heart of thy maid-servant, and I -- I am not as one of thy maid-servants.\'";
dby[13] = "And she said, Let me find favour in thine eyes, my lord; for that thou hast comforted me, and for that thou hast spoken kindly to thy handmaid, though I am not like one of thy handmaidens.";
web[13] = "Then she said, Let me find favor in thy sight, my lord; for that thou hast comforted me, and for that thou hast spoken kindly to thy handmaid, though I am not like to one of thy handmaidens.";
hnv[13] = "Then she said, Let me find favor in your sight, my lord, because you have comforted me, and because you have spoken kindly to your handmaid, though I am not as one of your handmaidens.";
vul[13] = "quae ait inveni gratiam ante oculos tuos domine mi qui consolatus es me et locutus es ad cor ancillae tuae quae non sum similis unius puellarum tuarum";
kjv[14] = "And Boaz said unto her, At mealtime come thou hither, and eat of the bread, and dip thy morsel in the vinegar. And she sat beside the reapers: and he reached her parched [corn], and she did eat, and was sufficed, and left.";
rsv[14] = "And at mealtime Bo\'az said to her, &quot;Come here, and eat some bread, and dip your morsel in the wine.&quot; So she sat beside the reapers, and he passed to her parched grain; and she ate until she was satisfied, and she had some left over.";
asv[14] = "And at meal-time Boaz said unto her, Come hither, and eat of the bread, and dip thy morsel in the vinegar. And she sat beside the reapers, and they reached her parched grain, and she did eat, and was sufficed, and left thereof.";
yng[14] = "And Boaz saith to her, `At meal-time come nigh hither, and thou hast eaten of the bread, and dipped thy morsel in the vinegar.\' And she sitteth at the side of the reapers, and he reacheth to her roasted corn, and she eateth, and is satisfied, and leaveth.";
dby[14] = "And Boaz said to her at mealtime, Come hither and eat of the bread, and dip thy morsel in the vinegar. And she sat beside the reapers; and he reached her parched corn, and she ate and was sufficed, and reserved [some].";
web[14] = "And Boaz said to her, At meal-time come thou hither, and eat of the bread, and dip thy morsel in the vinegar. And she sat beside the reapers: and he reached her parched [corn], and she ate, and was satisfied, and left.";
hnv[14] = "At meal-time Bo`az said to her, Come here, and eat of the bread, and dip your morsel in the vinegar. She sat beside the reapers, and they reached her parched grain, and she ate, and was sufficed, and left of it.";
vul[14] = "dixitque ad eam Booz quando hora vescendi fuerit veni huc et comede panem et intingue buccellam tuam in aceto sedit itaque ad messorum latus et congessit pulentam sibi comeditque et saturata est et tulit reliquias";
kjv[15] = "And when she was risen up to glean, Boaz commanded his young men, saying, Let her glean even among the sheaves, and reproach her not:";
rsv[15] = "When she rose to glean, Bo\'az instructed his young men, saying, &quot;Let her glean even among the sheaves, and do not reproach her.";
asv[15] = "And when she was risen up to glean, Boaz commanded his young men, saying, Let her glean even among the sheaves, and reproach her not.";
yng[15] = "And she riseth to glean, and Boaz chargeth his young men, saying, `Even between the sheaves she doth glean, and ye do not cause her to blush;";
dby[15] = "And when she rose up to glean, Boaz commanded his young men, saying, Let her glean even among the sheaves, and ye shall not reproach her.";
web[15] = "And when she had risen to glean, Boaz commanded his young men, saying, Let her glean even among the sheaves, and reproach her not:";
hnv[15] = "When she was risen up to glean, Bo`az commanded his young men, saying, Let her glean even among the sheaves, and don\'t reproach her.";
vul[15] = "atque inde surrexit ut spicas ex more colligeret praecepit autem Booz pueris suis dicens etiam si vobiscum metere voluerit ne prohibeatis eam";
kjv[16] = "And let fall also [some] of the handfuls of purpose for her, and leave [them], that she may glean [them], and rebuke her not.";
rsv[16] = "And also pull out some from the bundles for her, and leave it for her to glean, and do not rebuke her.&quot;";
asv[16] = "And also pull out some for her from the bundles, and leave it, and let her glean, and rebuke her not.";
yng[16] = "and also ye do surely cast to her of the handfuls -- and have left, and she hath gleaned, and ye do not push against her.\'";
dby[16] = "And ye shall also sometimes draw out for her [some ears] out of the handfuls, and leave them that she may glean, and rebuke her not.";
web[16] = "And let fall also [some] of the handfuls of purpose for her, and leave [them], that she may glean [them], and rebuke her not.";

rsv[18] = "And she took it up and went into the city; she showed her mother-in-law what she had gleaned, and she also brought out and gave her what food she had left over after being satisfied.";

kjv[19] = "And her mother in law said unto her, Where hast thou gleaned to day? and where wroughtest thou? blessed be he that did take knowledge of thee. And she shewed her mother in law with whom she had wrought, and said, The man\'s name with whom I wrought to day [is] Boaz.";
rsv[19] = "And her mother-in-law said to her, &quot;Where did you glean today? And where have you worked? Blessed be the man who took notice of you.&quot; So she told her mother-in-law with whom she had worked, and said, &quot;The man\'s name with whom I worked today is Bo\'az.&quot;";
asv[19] = "And her mother-in-law said unto her, Where hast thou gleaned to-day? and where hast thou wrought? blessed be he that did take knowledge of thee. And she showed her mother-in-law with whom she had wrought, and said, The man\'s name with whom I wrought to-day is Boaz.";
yng[19] = "And her mother-in-law saith to her, `Where hast thou gleaned to-day? and where hast thou wrought? may he who is discerning thee be blessed.\' And she declareth to her mother-in-law with whom she hath wrought, and saith, `The name of the man with whom I have wrought to-day [is] Boaz.\'";
dby[19] = "And her mother-in-law said to her, Where hast thou gleaned to-day? and where hast thou wrought? Blessed be he that did regard thee! And she told her mother-in-law with whom she had wrought, and said, The man\'s name with whom I wrought to-day is Boaz.";
web[19] = "And her mother-in-law said to her, Where hast thou gleaned to-day? and where hast thou labored? blessed be he that took knowledge of thee. And she showed her mother-in-law with whom she had wrought, and said, The man\'s name with whom I wrought to-day [is] Boaz.";
hnv[19] = "Her mother-in-law said to her, Where have you gleaned today? and where have you worked? blessed be he who did take knowledge of you. She shown her mother-in-law with whom she had worked, and said, The man\'s name with whom I worked today is Bo`az.";
vul[19] = "dixitque ei socrus ubi hodie collegisti et ubi fecisti opus sit benedictus qui misertus est tui indicavitque ei apud quem esset operata et nomen dixit viri quod Booz vocaretur";
kjv[20] = "And Naomi said unto her daughter in law, Blessed [be] he of the LORD, who hath not left off his kindness to the living and to the dead. And Naomi said unto her, The man [is] near of kin unto us, one of our next kinsmen.";
rsv[20] = "And Na\'omi said to her daughter-in-law, &quot;Blessed be he by the LORD, whose kindness has not forsaken the living or the dead!&quot; Na\'omi also said to her, &quot;The man is a relative of ours, one of our nearest kin.&quot;";
asv[20] = "And Naomi said unto her daughter-in-law, Blessed be he of Jehovah, who hath not left off his kindness to the living and to the dead. And Naomi said unto her, The man is nigh of kin unto us, one of our near kinsmen.";
yng[20] = "And Naomi saith to her daughter-in-law, `Blessed [is] he of Jehovah who hath not forsaken His kindness with the living and with the dead;\' and Naomi saith to her, `The man is a relation of ours; he [is] of our redeemers.\'";
dby[20] = "And Naomi said to her daughter-in-law, Blessed be he of Jehovah, who has not left off his kindness to the living and to the dead! And Naomi said to her, The man is near of kin to us, one of those who have the right of our redemption.";
web[20] = "And Naomi said to her daughter-in-law, Blessed [be] he of the LORD, who hath not left off his kindness to the living and to the dead. And Naomi said to her, The man [is] near of kin to us, one of our next kinsmen.";
hnv[20] = " Na`omi said to her daughter-in-law, Blessed be he of the LORD, who has not left off his kindness to the living and to the dead. Na`omi said to her, The man is a close relative to us, one of our near kinsmen.";
vul[20] = "cui respondit Noemi benedictus sit a Domino quoniam eandem gratiam quam praebuerat vivis servavit et mortuis rursumque propinquus ait noster est homo";
kjv[21] = "And Ruth the Moabitess said, He said unto me also, Thou shalt keep fast by my young men, until they have ended all my harvest.";
rsv[21] = "And Ruth the Moabitess said, &quot;Besides, he said to me, \'You shall keep close by my servants, till they have finished all my harvest.\'&quot;";
asv[21] = "And Ruth the Moabitess said, Yea, he said unto me, Thou shalt keep fast by my young men, until they have ended all my harvest.";
yng[21] = "And Ruth the Moabitess saith, `Also he surely said unto me, Near the young people whom I have thou dost cleave till they have completed the whole of the harvest which I have.\'";
dby[21] = "And Ruth the Moabitess said, He said to me also, Thou shalt keep with my young men until they have ended all my harvest.";
web[21] = "And Ruth the Moabitess said, He said to me also, Thou shalt keep fast by my young men, until they have ended all my harvest.";
hnv[21] = " Rut the Mo\'avite said, Yes, he said to me, You shall keep fast by my young men, until they have ended all my harvest.";

rsv[22] = "And Na\'omi said to Ruth, her daughter-in-law, &quot;It is well, my daughter, that you go out with his maidens, lest in another field you be molested.&quot;";
asv[22] = "And Naomi said unto Ruth her daughter-in-law, It is good, my daughter, that thou go out with his maidens, and that they meet thee not in any other field.";
yng[22] = "And Naomi saith unto Ruth her daughter-in-law, `Good, my daughter, that thou goest out with his young women, and they come not against thee in another field.\'";
