csb[1] = "During the time of the judges, there was a famine in the land. A man left Bethlehem in Judah with his wife and two sons to stay in the territory of Moab for a while.";
csb[2] = "The man\'s name was Elimelech, and his wife\'s name was Naomi. The names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah. They entered the fields of Moab and settled there.";
csb[3] = "Naomi\'s husband Elimelech died, and she was left with her two sons.";
csb[4] = "Her sons took Moabite women as their wives: one was named Orpah and the second was named Ruth. After they lived in Moab about ten years,";
csb[5] = "both Mahlon and Chilion also died, and Naomi was left without her two children and without her husband.";
csb[6] = "She and her daughters-in-law set out to return from the territory of Moab, because she had heard in Moab that the LORD had paid attention to his people\'s need by providing them food.";
csb[7] = "She left the place where she had been living, accompanied by her two daughters-in-law, and traveled along the road leading back to the land of Judah.";
csb[8] = "Naomi said to them, &quot;Each of you go back to your mother\'s home. May the LORD show kindness to you as you have shown to the dead and to me.";
csb[9] = "&quot;May the LORD grant each of you rest in the house of a new husband.&quot; She kissed them, and they wept loudly.";
csb[10] = "They said to her, &quot;We insist on returning with you to your people.&quot;";
csb[11] = "But Naomi replied, &quot;Return home, my daughters. Why do you want to go with me? Am I able to have any more sons who could become your husbands?";
csb[12] = "&quot;Return home, my daughters. Go on, for I am too old to have another husband. Even if I thought there was still hope for me to have a husband tonight and to bear sons,";
csb[13] = "&quot;would you be willing to wait for them to grow up? Would you restrain yourselves from remarrying? No, my daughters, my life is much too bitter for you to share, because the LORD\'s hand has turned against me.&quot;";
csb[14] = "Again they wept loudly, and Orpah kissed her mother-in-law, but Ruth clung to her.";
csb[15] = "Naomi said, &quot;Look, your sister-in-law has gone back to her people and to her gods. Follow your sister-in-law.&quot;";
csb[16] = "But Ruth replied: Don\'t plead with me to abandon you or to return and not follow you. For wherever you go, I will go, and wherever you live, I will live; your people will be my people, and your God will be my God.";
csb[17] = "Where you die, I will die, and there I will be buried. May the LORD punish me, and do so severely, if anything but death separates you and me.";
csb[18] = "When Naomi saw that Ruth was determined to go with her, she stopped talking to her.";
csb[19] = "The two of them traveled until they came to Bethlehem. When they entered Bethlehem, the whole town was excited about their arrival and the local women exclaimed, &quot;Can this be Naomi? &quot;";
csb[20] = "&quot;Don\'t call me Naomi. Call me Mara,&quot; she answered, &quot;for the Almighty has made me very bitter.";
csb[21] = "&quot;I went away full, but the LORD has brought me back empty. Why do you call me Naomi, since the LORD has opposed me, and the Almighty has afflicted me? &quot;";
csb[22] = "So Naomi came back from the territory of Moab with her daughter-in-law Ruth the Moabitess. They arrived in Bethlehem at the beginning of the barley harvest.";
