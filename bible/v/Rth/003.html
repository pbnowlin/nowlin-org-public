csb[1] = "Ruth\'s mother-in-law Naomi said to her, &quot;My daughter, shouldn\'t I find rest for you, so that you will be taken care of?";
csb[2] = "&quot;Now isn\'t Boaz our relative? Haven\'t you been working with his female servants? This evening he will be winnowing barley on the threshing floor.";
csb[3] = "&quot;Wash, put on perfumed oil, and wear your best clothes. Go down to the threshing floor, but don\'t let the man know you are there until he has finished eating and drinking.";
csb[4] = "&quot;When he lies down, notice the place where he\'s lying, go in and uncover his feet, and lie down. Then he will explain to you what you should do.&quot;";
csb[5] = "So Ruth said to her, &quot;I will do everything you say.&quot;";
csb[6] = "She went down to the threshing floor and did everything her mother-in-law had charged her to do.";
csb[7] = "After Boaz ate, drank, and was in good spirits, he went to lie down at the end of the pile of barley, and she came secretly, uncovered his feet, and lay down.";
csb[8] = "At midnight, Boaz was startled, turned over, and there lying at his feet was a woman!";
csb[9] = "So he asked, &quot;Who are you? &quot; &quot;I am Ruth, your servant,&quot; she replied. &quot;Take me under your wing, for you are a family redeemer.&quot;";
csb[10] = "Then he said, &quot;May the LORD bless you, my daughter. You have shown more kindness now than before, because you have not pursued younger men, whether rich or poor.";
csb[11] = "&quot;Now don\'t be afraid, my daughter. I will do for you whatever you say, since all the people in my town know that you are a woman of noble character.";
csb[12] = "&quot;Yes, it is true that I am a family redeemer, but there is a redeemer closer than I am.";
csb[13] = "&quot;Stay here tonight, and in the morning, if he wants to redeem you, that\'s good. Let him redeem you. But if he doesn\'t want to redeem you, as the LORD lives, I will. Now lie down until morning.&quot;";
csb[14] = "So she lay down at his feet until morning but got up while it was still dark. Then Boaz said, &quot;Don\'t let it be known that a woman came to the threshing floor.&quot;";
csb[15] = "And he told Ruth, &quot;Bring the shawl you\'re wearing and hold it out.&quot; When she held it out, he shoveled six measures of barley into her shawl, and she went into the town.";
csb[16] = "She went to her mother-in-law, Naomi, who asked her, &quot;What happened, my daughter? &quot; Then Ruth told her everything the man had done for her.";
csb[17] = "She said, &quot;He gave me these six measures of barley, because he said, \'Don\'t go back to your mother-in-law empty-handed.\' &quot;";
csb[18] = "Naomi said, &quot;My daughter, wait until you find out how things go, for he won\'t rest unless he resolves this today.&quot;";
