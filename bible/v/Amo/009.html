csb[1] = "I saw the Lord standing beside the altar, and he said: Strike the capitals of the pillars so that the thresholds shake; knock them down on the heads of all the people. Then I will kill the rest of them with the sword. None of those who flee will get away; none of the fugitives will escape.";
csb[2] = "If they dig down to Sheol, from there my hand will take them; if they climb up to heaven, from there I will bring them down.";
csb[3] = "If they hide on the top of Carmel, from there I will track them down and seize them; if they conceal themselves from my sight on the sea floor, from there I will command the sea serpent to bite them.";
csb[4] = "And if they are driven by their enemies into captivity, from there I will command the sword to kill them. I will keep my eye on them for harm and not for good.";
csb[5] = "The Lord, the GOD of Armies -- he touches the earth; it melts, and all who dwell in it mourn; all of it rises like the Nile and subsides like the Nile of Egypt.";
csb[6] = "He builds his upper chambers in the heavens and lays the foundation of his vault on the earth. He summons the water of the sea and pours it out over the surface of the earth. The LORD is his name.";
csb[7] = "Israelites, are you not like the Cushites to me? This is the LORD\'s declaration. Didn\'t I bring Israel from the land of Egypt, the Philistines from Caphtor, and the Arameans from Kir?";
csb[8] = "Look, the eyes of the Lord GOD are on the sinful kingdom, and I will obliterate it from the face of the earth. However, I will not totally destroy the house of Jacob -- this is the LORD\'s declaration --";
csb[9] = "for I am about to give the command, and I will shake the house of Israel among all the nations, as one shakes a sieve, but not a pebble will fall to the ground.";
csb[10] = "All the sinners among my people who say: &quot;Disaster will never overtake or confront us,&quot; will die by the sword.";
csb[11] = "In that day I will restore the fallen shelter of David: I will repair its gaps, restore its ruins, and rebuild it as in the days of old,";
csb[12] = "so that they may possess the remnant of Edom and all the nations that bear my name -- this is the declaration of the LORD; he will do this.";
csb[13] = "Look, the days are coming -- this is the LORD\'s declaration -- when the plowman will overtake the reaper and the one who treads grapes, the sower of seed. The mountains will drip with sweet wine, and all the hills will flow with it.";
csb[14] = "I will restore the fortunes of my people Israel. They will rebuild and occupy ruined cities, plant vineyards and drink their wine, make gardens and eat their produce.";
csb[15] = "I will plant them on their land, and they will never again be uprooted from the land I have given them. The LORD your God has spoken.";
kjv[1] = "I saw the Lord standing upon the altar: and he said, Smite the lintel of the door, that the posts may shake: and cut them in the head, all of them; and I will slay the last of them with the sword: he that fleeth of them shall not flee away, and he that escapeth of them shall not be delivered.";
rsv[1] = "I saw the LORD standing beside the altar, and he said: &quot;Smite the capitals until the thresholds shake, and shatter them on the heads of all the people; and what are left of them I will slay with the sword; not one of them shall flee away, not one of them shall escape.";
asv[1] = "I saw the Lord standing beside the altar: and he said, Smite the capitals, that the thresholds may shake; and break them in pieces on the head of all of them; and I will slay the last of them with the sword: there shall not one of them flee away, and there shall not one of them escape.";
yng[1] = "I have seen the Lord standing by the altar, and He saith: `Smite the knob, and the thresholds shake, And cut them off by the head -- all of them, And their posterity with a sword I do slay, Not flee to them doth the fleer, Nor escape to them doth a fugitive.";
dby[1] = "I saw the Lord standing upon the altar; and he said, Smite the chapiter that the thresholds may shake; and break all of them in pieces, in the head; and I will slay the last of them with the sword: he that fleeth of them shall not get away by flight, and he that escapeth of them shall not be delivered.";
web[1] = "I saw the Lord standing upon the altar: and he said, Smite the lintel of the door, that the posts may shake: and cut them in the head, all of them; and I will slay the last of them with the sword: he that fleeth of them shall not flee away, and he that escapeth of them shall not be delivered.";
hnv[1] = "I saw the Lord standing beside the altar, and he said, &quot;Strike the tops of the pillars, that the thresholds may shake; and break them in pieces on the head of all of them; and I will kill the last of them with the sword: there shall not one of them flee away, and there shall not one of them escape.";
