csb[1] = "The Lord GOD showed me this: He was forming a swarm of locusts at the time the spring crop first began to sprout -- after the cutting of the king\'s hay.";
csb[2] = "When the locusts finished eating the vegetation of the land, I said, &quot;Lord GOD, please forgive! How will Jacob survive since he is so small? &quot;";
csb[3] = "The LORD relented concerning this. &quot;It will not happen,&quot; he said.";

csb[9] = "&quot;Isaac\'s high places will be deserted, and Israel\'s sanctuaries will be in ruins; I will rise up against the house of Jeroboam with a sword.&quot;";
csb[10] = "Amaziah the priest of Bethel sent word to King Jeroboam of Israel, saying, &quot;Amos has conspired against you right here in the house of Israel. The land cannot endure all his words,";
csb[11] = "&quot;for Amos has said this: \'Jeroboam will die by the sword, and Israel will certainly go into exile from its homeland.\' &quot;";
csb[12] = "Then Amaziah said to Amos, &quot;Go away, you seer! Flee to the land of Judah. Earn your living and give your prophecies there,";
csb[13] = "&quot;but don\'t ever prophesy at Bethel again, for it is the king\'s sanctuary and a royal temple.&quot;";
csb[14] = "So Amos answered Amaziah, &quot;I was not a prophet or the son of a prophet; rather, I was a herdsman, and I took care of sycamore figs.";
csb[15] = "&quot;But the LORD took me from following the flock and said to me, \'Go, prophesy to my people Israel.\' &quot;";
csb[16] = "Now hear the word of the LORD. You say: Do not prophesy against Israel; do not preach against the house of Isaac.";
csb[17] = "Therefore, this is what the LORD says: Your wife will be a prostitute in the city, your sons and daughters will fall by the sword, and your land will be divided up with a measuring line. You yourself will die on pagan soil, and Israel will certainly go into exile from its homeland.";
