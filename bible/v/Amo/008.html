csb[1] = "The Lord GOD showed me this: a basket of summer fruit.";
csb[2] = "He asked me, &quot;What do you see, Amos? &quot; I replied, &quot;A basket of summer fruit.&quot; The LORD said to me, &quot;The end has come for my people Israel; I will no longer spare them.";
csb[3] = "&quot;In that day the temple songs will become wailing&quot; -- this is the Lord GOD\'s declaration. &quot;Many dead bodies, thrown everywhere! Silence! &quot;";
csb[4] = "Hear this, you who trample on the needy and do away with the poor of the land,";
csb[5] = "asking, &quot;When will the New Moon be over so we may sell grain, and the Sabbath, so we may market wheat? We can reduce the measure while increasing the price and cheat with dishonest scales.";
csb[6] = "&quot;We can buy the poor with silver and the needy for a pair of sandals and even sell the chaff! &quot;";
csb[7] = "The LORD has sworn by the Pride of Jacob: I will never forget all their deeds.";
csb[8] = "Because of this, won\'t the land quake and all who dwell in it mourn? All of it will rise like the Nile; it will surge and then subside like the Nile in Egypt.";
csb[9] = "And in that day -- this is the declaration of the Lord GOD -- I will make the sun go down at noon; I will darken the land in the daytime.";
csb[10] = "I will turn your feasts into mourning and all your songs into lamentation; I will cause everyone to wear sackcloth and every head to be shaved. I will make that grief like mourning for an only son and its outcome like a bitter day.";
csb[11] = "Look, the days are coming -- this is the declaration of the Lord GOD -- when I will send a famine through the land: not a famine of bread or a thirst for water, but of hearing the words of the LORD.";
csb[12] = "People will stagger from sea to sea and roam from north to east seeking the word of the LORD, but they will not find it.";
csb[13] = "In that day the beautiful young women, the young men also, will faint from thirst.";
csb[14] = "Those who swear by the guilt of Samaria and say, &quot;As your god lives, Dan,&quot; or, &quot;As the way of Beer-sheba lives&quot; -- they will fall, never to rise again.";
