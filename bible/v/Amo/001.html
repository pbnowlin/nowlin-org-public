csb[1] = "The words of Amos, who was one of the sheep breeders from Tekoa -- what he saw regarding Israel in the days of King Uzziah of Judah and Jeroboam son of Jehoash, king of Israel, two years before the earthquake.";
csb[2] = "He said: The LORD roars from Zion and makes his voice heard from Jerusalem; the pastures of the shepherds mourn, and the summit of Carmel withers.";
csb[3] = "The LORD says: I will not relent from punishing Damascus for three crimes, even four, because they threshed Gilead with iron sledges.";
csb[4] = "Therefore, I will send fire against Hazael\'s palace, and it will consume Ben-hadad\'s citadels.";
csb[5] = "I will break down the gates of Damascus. I will cut off the ruler from the Valley of Aven, and the one who wields the scepter from Beth-eden. The people of Aram will be exiled to Kir. The LORD has spoken.";
csb[6] = "The LORD says: I will not relent from punishing Gaza for three crimes, even four, because they exiled a whole community, handing them over to Edom.";
csb[7] = "Therefore, I will send fire against the walls of Gaza, and it will consume its citadels.";
csb[8] = "I will cut off the ruler from Ashdod, and the one who wields the scepter from Ashkelon. I will also turn my hand against Ekron, and the remainder of the Philistines will perish. The Lord GOD has spoken.";
csb[9] = "The LORD says: I will not relent from punishing Tyre for three crimes, even four, because they handed over a whole community of exiles to Edom and broke a treaty of brotherhood.";
csb[10] = "Therefore, I will send fire against the walls of Tyre, and it will consume its citadels.";
csb[11] = "The LORD says: I will not relent from punishing Edom for three crimes, even four, because he pursued his brother with the sword. He stifled his compassion, his anger tore at him continually, and he harbored his rage incessantly.";
csb[12] = "Therefore, I will send fire against Teman, and it will consume the citadels of Bozrah.";
csb[13] = "The LORD says: I will not relent from punishing the Ammonites for three crimes, even four, because they ripped open the pregnant women of Gilead in order to enlarge their territory.";
csb[14] = "Therefore, I will set fire to the walls of Rabbah, and it will consume its citadels. There will be shouting on the day of battle and a violent wind on the day of the storm.";
csb[15] = "Their king and his princes will go into exile together. The LORD has spoken.";
