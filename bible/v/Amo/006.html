csb[1] = "Woe to those who are at ease in Zion and to those who feel secure on the hill of Samaria -- the notable people in this first of the nations, those the house of Israel comes to.";
csb[2] = "Cross over to Calneh and see; go from there to great Hamath; then go down to Gath of the Philistines. Are you better than these kingdoms? Is their territory larger than yours?";
csb[3] = "You dismiss any thought of the evil day and bring in a reign of violence.";
csb[4] = "They lie on beds inlaid with ivory, sprawled out on their couches, and dine on lambs from the flock and calves from the stall.";
csb[5] = "They improvise songs to the sound of the harp and invent their own musical instruments like David.";
csb[6] = "They drink wine by the bowlful and anoint themselves with the finest oils but do not grieve over the ruin of Joseph.";
csb[7] = "Therefore, they will now go into exile as the first of the captives, and the feasting of those who sprawl out will come to an end.";
csb[8] = "The Lord GOD has sworn by himself -- this is the declaration of the LORD, the God of Armies: I loathe Jacob\'s pride and hate his citadels, so I will hand over the city and everything in it.";
csb[9] = "And if there are ten men left in one house, they will die.";
csb[10] = "A close relative and burner will remove his corpse from the house. He will call to someone in the inner recesses of the house, &quot;Any more with you? &quot; That person will reply, &quot;None.&quot; Then he will say, &quot;Silence, because the LORD\'s name must not be invoked.&quot;";
csb[11] = "For the LORD commands: The large house will be smashed to pieces, and the small house to rubble.";
csb[12] = "Do horses gallop on the cliffs? Does anyone plow there with oxen? Yet you have turned justice into poison and the fruit of righteousness into wormwood --";
csb[13] = "you who rejoice over Lo-debar and say, &quot;Didn\'t we capture Karnaim for ourselves by our own strength? &quot;";
csb[14] = "But look, I am raising up a nation against you, house of Israel -- this is the declaration of the Lord, the GOD of Armies -- and they will oppress you from the entrance of Hamath to the Brook of the Arabah.";

kjv[10] = "And a man\'s uncle shall take him up, and he that burneth him, to bring out the bones out of the house, and shall say unto him that [is] by the sides of the house, [Is there] yet [any] with thee? and he shall say, No. Then shall he say, Hold thy tongue: for we may not make mention of the name of the LORD.";
