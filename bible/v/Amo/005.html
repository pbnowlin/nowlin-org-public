csb[1] = "Listen to this message that I am singing for you, a lament, house of Israel:";
csb[2] = "She has fallen; Virgin Israel will never rise again. She lies abandoned on her land with no one to raise her up.";
csb[3] = "For the Lord GOD says: The city that marches out a thousand strong will have only a hundred left, and the one that marches out a hundred strong will have only ten left in the house of Israel.";
csb[4] = "For the LORD says to the house of Israel: Seek me and live!";
csb[5] = "Do not seek Bethel or go to Gilgal or journey to Beer-sheba, for Gilgal will certainly go into exile, and Bethel will come to nothing.";
csb[6] = "Seek the LORD and live, or he will spread like fire throughout the house of Joseph; it will consume everything with no one at Bethel to extinguish it.";
csb[7] = "Those who turn justice into wormwood also throw righteousness to the ground.";
csb[8] = "The one who made the Pleiades and Orion, who turns darkness into dawn and darkens day into night, who summons the water of the sea and pours it out over the surface of the earth -- the LORD is his name.";
csb[9] = "He brings destruction on the strong, and it falls on the fortress.";
csb[10] = "They hate the one who convicts the guilty at the city gate, and they despise the one who speaks with integrity.";
csb[11] = "Therefore, because you trample on the poor and exact a grain tax from him, you will never live in the houses of cut stone you have built; you will never drink the wine from the lush vineyards you have planted.";
csb[12] = "For I know your crimes are many and your sins innumerable. They oppress the righteous, take a bribe, and deprive the poor of justice at the city gates.";
csb[13] = "Therefore, those who have insight will keep silent at such a time, for the days are evil.";
csb[14] = "Pursue good and not evil so that you may live, and the LORD, the God of Armies, will be with you as you have claimed.";
csb[15] = "Hate evil and love good; establish justice in the city gate. Perhaps the LORD, the God of Armies, will be gracious to the remnant of Joseph.";
csb[16] = "Therefore the LORD, the God of Armies, the Lord, says: There will be wailing in all the public squares; they will cry out in anguish in all the streets. The farmer will be called on to mourn, and professional mourners to wail.";
csb[17] = "There will be wailing in all the vineyards, for I will pass among you. The LORD has spoken.";
csb[18] = "Woe to you who long for the day of the LORD! What will the day of the LORD be for you? It will be darkness and not light.";
csb[19] = "It will be like a man who flees from a lion only to have a bear confront him. He goes home and rests his hand against the wall only to have a snake bite him.";
csb[20] = "Won\'t the day of the LORD be darkness rather than light, even gloom without any brightness in it?";
csb[21] = "I hate, I despise, your feasts! I can\'t stand the stench of your solemn assemblies.";
csb[22] = "Even if you offer me your burnt offerings and grain offerings, I will not accept them; I will have no regard for your fellowship offerings of fattened cattle.";
csb[23] = "Take away from me the noise of your songs! I will not listen to the music of your harps.";
csb[24] = "But let justice flow like water, and righteousness, like an unfailing stream.";
csb[25] = "&quot;House of Israel, was it sacrifices and grain offerings that you presented to me during the forty years in the wilderness?";
csb[26] = "&quot;But you have taken up Sakkuth your king and Kaiwan your star god, images you have made for yourselves.";
csb[27] = "&quot;So I will send you into exile beyond Damascus.&quot; The LORD, the God of Armies, is his name. He has spoken.";

kjv[8] = "[Seek him] that maketh the seven stars and Orion, and turneth the shadow of death into the morning, and maketh the day dark with night: that calleth for the waters of the sea, and poureth them out upon the face of the earth: The LORD [is] his name:";
rsv[8] = "He who made the Plei\'ades and Orion, and turns deep darkness into the morning, and darkens the day into night, who calls for the waters of the sea, and pours them out upon the surface of the earth, the LORD is his name,";
asv[8] = "[seek him] that maketh the Pleiades and Orion, and turneth the shadow of death into the morning, and maketh the day dark with night; that calleth for the waters of the sea, and poureth them out upon the face of the earth (Jehovah is his name);";
yng[8] = "The maker of Kimah and Kesil, And the turner to morning of death-shade, And day [as] night He hath made dark, Who is calling to the waters of the sea, And poureth them on the face of the earth, Jehovah [is] His name;";
dby[8] = "[seek him] that made the Pleiades and Orion, and turneth the shadow of death into the morning, and maketh the day dark with night; that calleth for the waters of the sea, and poureth them out upon the face of the earth: Jehovah is his name.";

hnv[8] = "Seek him who made the Kima and Kesil, And turns the shadow of death into the morning, And makes the day dark with night; Who calls for the waters of the sea, And pours them out on the surface of the eretz, the LORD is his name,";
vul[8] = "facientem Arcturum et Orionem et convertentem in mane tenebras et diem nocte mutantem qui vocat aquas maris et effundit eas super faciem terrae Dominus nomen eius";

web[20] = "[Shall] not the day of the LORD [be] darkness, and not light? even very dark, and no brightness in it?";
hnv[20] = "Will the day of the LORD not be darkness, and not light? Even very dark, and no brightness in it?";
vul[20] = "numquid non tenebrae dies Domini et non lux et caligo et non splendor in ea";
kjv[21] = "I hate, I despise your feast days, and I will not smell in your solemn assemblies.";
rsv[21] = "&quot;I hate, I despise your feasts, and I take no delight in your solemn assemblies.";
asv[21] = "I hate, I despise your feasts, and I will take no delight in your solemn assemblies.";
yng[21] = "I have hated -- I have loathed your festivals, And I am not refreshed by your restraints.";
dby[21] = "I hate, I despise your feasts, and I will not smell [a sweet odour] in your solemn assemblies.";
web[21] = "I hate, I despise your feast days, and I will not smell in your solemn assemblies.";
hnv[21] = "I hate, I despise your feasts, And I can\'t stand your solemn assemblies.";
vul[21] = "odi et proieci festivitates vestras et non capiam odorem coetuum vestrorum";
kjv[22] = "Though ye offer me burnt offerings and your meat offerings, I will not accept [them]: neither will I regard the peace offerings of your fat beasts.";
rsv[22] = "Even though you offer me your burnt offerings and cereal offerings, I will not accept them, and the peace offerings of your fatted beasts I will not look upon.";
asv[22] = "Yea, though ye offer me your burnt-offerings and meal-offerings, I will not accept them; neither will I regard the peace-offerings of your fat beasts.";
yng[22] = "For though ye cause burnt-offerings and your presents to ascend to Me, I am not pleased, And the peace-offering of your fatlings I behold not.";
dby[22] = "For if ye offer up unto me burnt-offerings and your oblations, I will not accept [them]; neither will I regard the peace-offerings of your fatted beasts.";
web[22] = "Though ye offer me burnt-offerings and your meat-offerings, I will not accept [them]; neither will I regard the peace-offerings of your fat beasts.";
hnv[22] = "Yes, though you offer me your burnt offerings and meal-offerings, I will not accept them; Neither will I regard the shalom offerings of your fat animals.";
vul[22] = "quod si adtuleritis mihi holocaustomata et munera vestra non suscipiam et vota pinguium vestrorum non respiciam";
kjv[23] = "Take thou away from me the noise of thy songs; for I will not hear the melody of thy viols.";
rsv[23] = "Take away from me the noise of your songs; to the melody of your harps I will not listen.";
asv[23] = "Take thou away from me the noise of thy songs; for I will not hear the melody of thy viols.";
yng[23] = "Turn aside from Me the noise of thy songs, Yea, the praise of thy psaltery I hear not.";
dby[23] = "Take away from me the noise of thy songs, and I will not hear the melody of thy lutes;";
web[23] = "Take thou away from me the noise of thy songs; for I will not hear the melody of thy viols.";
hnv[23] = "Take away from me the noise of your songs! I will not listen to the music of your harps.";
vul[23] = "aufer a me tumultum carminum tuorum et cantica lyrae tuae non audiam";
kjv[24] = "But let judgment run down as waters, and righteousness as a mighty stream.";
rsv[24] = "But let justice roll down like waters, and righteousness like an ever-flowing stream.";
asv[24] = "But let justice roll down as waters, and righteousness as a mighty stream.";
yng[24] = "And roll on as waters doth judgment, And righteousness as a perennial stream.";
dby[24] = "but let judgment roll down as waters, and righteousness as an ever-flowing stream.";
web[24] = "But let judgment run down as waters, and righteousness as a mighty stream.";
hnv[24] = "But let justice roll on like rivers, And righteousness like a mighty stream.";
vul[24] = "et revelabitur quasi aqua iudicium et iustitia quasi torrens fortis";
kjv[25] = "Have ye offered unto me sacrifices and offerings in the wilderness forty years, O house of Israel?";
rsv[25] = "&quot;Did you bring to me sacrifices and offerings the forty years in the wilderness, O house of Israel?";
asv[25] = "Did ye bring unto me sacrifices and offerings in the wilderness forty years, O house of Israel?";
yng[25] = "Sacrifices and offering did ye bring nigh to Me, In a wilderness forty years, O house of Israel?";
dby[25] = "Did ye bring unto me sacrifices and oblations in the wilderness forty years, O house of Israel?";
web[25] = "Have ye offered to me sacrifices and offerings in the wilderness forty years, O house of Israel?";
hnv[25] = "&quot;Did you bring to me sacrifices and offerings in the wilderness forty years, house of Yisra\'el?";
vul[25] = "numquid hostias et sacrificium obtulistis mihi in deserto quadraginta annis domus Israhel";
kjv[26] = "But ye have borne the tabernacle of your Moloch and Chiun your images, the star of your god, which ye made to yourselves.";
rsv[26] = "You shall take up Sakkuth your king, and Kaiwan your star-god, your images, which you made for yourselves;";
asv[26] = "Yea, ye have borne the tabernacle of your king and the shrine of your images, the star of your god, which ye made to yourselves.";
yng[26] = "And ye bare Succoth your king, and Chiun your images, The star of your god, that ye made for yourselves.";
dby[26] = "Yea, ye took up the tabernacle of your Moloch, and Chiun your images, the star of your god, which ye had made to yourselves;";
web[26] = "But ye have borne the tabernacle of your Moloch and Chiun your images, the star of your god, which ye made to yourselves.";
hnv[26] = "Yes, you have borne the tent of your king and the shrine of your images, the star of your god, which you made for yourselves.";
vul[26] = "et portastis tabernaculum Moloch vestro et imaginem idolorum vestrorum sidus dei vestri quae fecistis vobis";

rsv[27] = "therefore I will take you into exile beyond Damascus,&quot; says the LORD, whose name is the God of hosts.";
asv[27] = "Therefore will I cause you to go into captivity beyond Damascus, saith Jehovah, whose name is the God of hosts.";
yng[27] = "And I removed you beyond Damascus, Said Jehovah, God of Hosts [is] His name.";
dby[27] = "and I will cause you to go into captivity beyond Damascus, saith Jehovah, whose name is the God of hosts.";
web[27] = "Therefore I will cause you to go into captivity beyond Damascus, saith the LORD, whose name [is] The God of hosts.";
hnv[27] = "Therefore will I cause you to go into captivity beyond Dammesek,&quot; says the LORD, whose name is the God Tzva\'ot,.";
