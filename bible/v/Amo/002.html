csb[1] = "The LORD says: I will not relent from punishing Moab for three crimes, even four, because he burned the bones of the king of Edom to lime.";
csb[2] = "Therefore, I will send fire against Moab, and it will consume the citadels of Kerioth. Moab will die with a tumult, with shouting and the sound of the ram\'s horn.";
csb[3] = "I will cut off the judge from the land and kill all its officials with him. The LORD has spoken.";
csb[4] = "The LORD says: I will not relent from punishing Judah for three crimes, even four, because they have rejected the instruction of the LORD and have not kept his statutes. The lies that their ancestors followed have led them astray.";
csb[5] = "Therefore, I will send fire against Judah, and it will consume the citadels of Jerusalem.";
csb[6] = "The LORD says: I will not relent from punishing Israel for three crimes, even four, because they sell a righteous person for silver and a needy person for a pair of sandals.";
csb[7] = "They trample the heads of the poor on the dust of the ground and obstruct the path of the needy. A man and his father have sexual relations with the same girl, profaning my holy name.";
csb[8] = "They stretch out beside every altar on garments taken as collateral, and in the house of their God they drink wine obtained through fines.";
csb[9] = "Yet I destroyed the Amorite as Israel advanced; his height was like the cedars, and he was as sturdy as the oaks; I destroyed his fruit above and his roots beneath.";
csb[10] = "And I brought you from the land of Egypt and led you forty years in the wilderness in order to possess the land of the Amorite.";
csb[11] = "I raised up some of your sons as prophets and some of your young men as Nazirites. Is this not the case, Israelites? This is the LORD\'s declaration.";
csb[12] = "But you made the Nazirites drink wine and commanded the prophets, &quot;Do not prophesy.&quot;";
csb[13] = "Look, I am about to crush you in your place as a wagon crushes when full of grain.";
csb[14] = "Escape will fail the swift, the strong one will not maintain his strength, and the warrior will not save his life.";
csb[15] = "The archer will not stand his ground, the one who is swift of foot will not save himself, and the one riding a horse will not save his life.";
csb[16] = "Even the most courageous of the warriors will flee naked on that day -- this is the LORD\'s declaration.";

kjv[4] = "Thus saith the LORD; For three transgressions of Judah, and for four, I will not turn away [the punishment] thereof; because they have despised the law of the LORD, and have not kept his commandments, and their lies caused them to err, after the which their fathers have walked:";
