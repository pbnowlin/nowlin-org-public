csb[1] = "Then I looked, and there was the Lamb, standing on Mount Zion, and with him were 144,000 who had his name and his Father\'s name written on their foreheads.";
csb[2] = "I heard a sound from heaven like the sound of cascading waters and like the rumbling of loud thunder. The sound I heard was like harpists playing on their harps.";

csb[11] = "&quot;and the smoke of their torment will go up forever and ever. There is no rest day or night for those who worship the beast and its image, or anyone who receives the mark of its name.";

asv[18] = "And another angel came out from the altar, he that hath power over fire; and he called with a great voice to him that had the sharp sickle, saying, Send forth thy sharp sickle, and gather the clusters of the vine of the earth; for her grapes are fully ripe.";
yng[18] = "and another messenger did come forth out from the altar, having authority over the fire, and he called with a great cry to him having the sharp sickle, saying, `Send forth thy sharp sickle, and gather the clusters of the vine of the earth, because come to perfection have her grapes;\'";
dby[18] = "And another angel came out of the altar, having power over fire, and called with a loud cry to him that had the sharp sickle, saying, Send thy sharp sickle, and gather the bunches of the vine of the earth; for her grapes are fully ripened.";
web[18] = "And another angel came out from the altar, who had power over fire; and cried with a loud cry to him that had the sharp sickle, saying, Thrust in thy sharp sickle, and gather the clusters of the vine of the earth; for her grapes are fully ripe.";
hnv[18] = "Another angel came out from the altar, he who has power over fire, and he called with a great voice to him who had the sharp sickle, saying, &quot;Send forth your sharp sickle, and gather the clusters of the vine of the eretz, for the eretz\'s grapes are fully ripe!&quot;";
vul[18] = "et alius angelus de altari qui habet potestatem supra ignem et clamavit voce magna qui habebat falcem acutam dicens mitte falcem tuam acutam et vindemia botros vineae terrae quoniam maturae sunt uvae eius";
kjv[19] = "And the angel thrust in his sickle into the earth, and gathered the vine of the earth, and cast [it] into the great winepress of the wrath of God.";
rsv[19] = "So the angel swung his sickle on the earth and gathered the vintage of the earth, and threw it into the great wine press of the wrath of God;";
asv[19] = "And the angel cast his sickle into the earth, and gathered the vintage of the earth, and cast it into the winepress, the great [winepress], of the wrath of God.";
yng[19] = "and the messenger did put forth his sickle to the earth, and did gather the vine of the earth, and did cast [it] to the great wine-press of the wrath of God;";
dby[19] = "And the angel put his sickle to the earth, and gathered the vine of the earth, and cast [the bunches] into the great wine-press of the fury of God;";
web[19] = "And the angel thrust in his sickle into the earth, and gathered the vine of the earth, and cast [it] into the great wine-press of the wrath of God.";
hnv[19] = "The angel thrust his sickle into the eretz, and gathered the vintage of the eretz, and threw it into the great winepress of the wrath of God.";
vul[19] = "et misit angelus falcem suam in terram et vindemiavit vineam terrae et misit in lacum irae Dei magnum";
kjv[20] = "And the winepress was trodden without the city, and blood came out of the winepress, even unto the horse bridles, by the space of a thousand [and] six hundred furlongs.";
rsv[20] = "and the wine press was trodden outside the city, and blood flowed from the wine press, as high as a horse\'s bridle, for one thousand six hundred stadia.";
asv[20] = "And the winepress was trodden without the city, and there came out blood from the winepress, even unto the bridles of the horses, as far as a thousand and six hundred furlongs.";
yng[20] = "and trodden was the wine-press outside of the city, and blood did come forth out of the wine-press -- unto the bridles of the horses, a thousand, six hundred furlongs.";
dby[20] = "and the wine-press was trodden without the city, and blood went out of the wine-press to the bits of the horses for a thousand six hundred stadia.";
web[20] = "And the wine-press was trodden without the city, and blood came out of the wine-press, even to the horses\' bridles, by the space of a thousand [and] six hundred furlongs.";
hnv[20] = "The winepress was trodden outside of the city, and blood came out from the winepress, even to the bridles of the horses, as far as one thousand six hundred stadia.";
vul[20] = "et calcatus est lacus extra civitatem et exivit sanguis de lacu usque ad frenos equorum per stadia mille sescenta";
