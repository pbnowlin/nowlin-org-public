csb[1] = "Then I saw an angel coming down from heaven holding the key to the abyss and a great chain in his hand.";
csb[2] = "He seized the dragon, that ancient serpent who is the devil and Satan, and bound him for a thousand years.";
csb[3] = "He threw him into the abyss, closed it, and put a seal on it so that he would no longer deceive the nations until the thousand years were completed. After that, he must be released for a short time.";
csb[4] = "Then I saw thrones, and people seated on them who were given authority to judge. I also saw the souls of those who had been beheaded because of their testimony about Jesus and because of the word of God, who had not worshiped the beast or his image, and who had not accepted the mark on their foreheads or their hands. They came to life and reigned with Christ for a thousand years.";
csb[5] = "The rest of the dead did not come to life until the thousand years were completed. This is the first resurrection.";
csb[6] = "Blessed and holy is the one who shares in the first resurrection! The second death has no power over them, but they will be priests of God and of Christ, and they will reign with him for a thousand years.";
csb[7] = "When the thousand years are completed, Satan will be released from his prison";
csb[8] = "and will go out to deceive the nations at the four corners of the earth, Gog and Magog, to gather them for battle. Their number is like the sand of the sea.";
csb[9] = "They came up across the breadth of the earth and surrounded the encampment of the saints, the beloved city. Then fire came down from heaven and consumed them.";
csb[10] = "The devil who deceived them was thrown into the lake of fire and sulfur where the beast and the false prophet are, and they will be tormented day and night forever and ever.";
csb[11] = "Then I saw a great white throne and one seated on it. Earth and heaven fled from his presence, and no place was found for them.";
csb[12] = "I also saw the dead, the great and the small, standing before the throne, and books were opened. Another book was opened, which is the book of life, and the dead were judged according to their works by what was written in the books.";
csb[13] = "Then the sea gave up the dead that were in it, and Death and Hades gave up the dead that were in them; each one was judged according to their works.";
csb[14] = "Death and Hades were thrown into the lake of fire. This is the second death, the lake of fire.";
csb[15] = "And anyone whose name was not found written in the book of life was thrown into the lake of fire.";
