csb[1] = "&quot;Write to the angel of the church in Ephesus: Thus says the one who holds the seven stars in his right hand and who walks among the seven golden lampstands:";
csb[2] = "&quot;I know your works, your labor, and your endurance, and that you cannot tolerate evil people. You have tested those who call themselves apostles and are not, and you have found them to be liars.";
csb[3] = "&quot;I know that you have persevered and endured hardships for the sake of my name, and have not grown weary.";
csb[4] = "&quot;But I have this against you: You have abandoned the love you had at first.";
csb[5] = "&quot;Remember then how far you have fallen; repent, and do the works you did at first. Otherwise, I will come to you and remove your lampstand from its place, unless you repent.";
csb[6] = "&quot;Yet you do have this: You hate the practices of the Nicolaitans, which I also hate.";
csb[7] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches. To the one who conquers, I will give the right to eat from the tree of life, which is in the paradise of God.";
csb[8] = "&quot;Write to the angel of the church in Smyrna: Thus says the First and the Last, the one who was dead and came to life:";
csb[9] = "&quot;I know your affliction and poverty, but you are rich. I know the slander of those who say they are Jews and are not, but are a synagogue of Satan.";
csb[10] = "&quot;Don\'t be afraid of what you are about to suffer. Look, the devil is about to throw some of you into prison to test you, and you will experience affliction for ten days. Be faithful to the point of death, and I will give you the crown of life.";
csb[11] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches. The one who conquers will never be harmed by the second death.";
csb[12] = "&quot;Write to the angel of the church in Pergamum: Thus says the one who has the sharp, double-edged sword:";
csb[13] = "&quot;I know where you live -- where Satan\'s throne is. Yet you are holding on to my name and did not deny your faith in me, even in the days of Antipas, my faithful witness who was put to death among you, where Satan lives.";
csb[14] = "&quot;But I have a few things against you. You have some there who hold to the teaching of Balaam, who taught Balak to place a stumbling block in front of the Israelites: to eat meat sacrificed to idols and to commit sexual immorality.";
csb[15] = "&quot;In the same way, you also have those who hold to the teaching of the Nicolaitans.";
csb[16] = "&quot;So repent! Otherwise, I will come to you quickly and fight against them with the sword of my mouth.";
csb[17] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches. To the one who conquers, I will give some of the hidden manna. I will also give him a white stone, and on the stone a new name is inscribed that no one knows except the one who receives it.";
csb[18] = "&quot;Write to the angel of the church in Thyatira: Thus says the Son of God, the one whose eyes are like a fiery flame and whose feet are like fine bronze:";
csb[19] = "&quot;I know your works -- your love, faithfulness, service, and endurance. I know that your last works are greater than the first.";
csb[20] = "&quot;But I have this against you: You tolerate the woman Jezebel, who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat meat sacrificed to idols.";
csb[21] = "&quot;I gave her time to repent, but she does not want to repent of her sexual immorality.";
csb[22] = "&quot;Look, I will throw her into a sickbed and those who commit adultery with her into great affliction. Unless they repent of her works,";
csb[23] = "&quot;I will strike her children dead. Then all the churches will know that I am the one who examines minds and hearts, and I will give to each of you according to your works.";
csb[24] = "&quot;I say to the rest of you in Thyatira, who do not hold this teaching, who haven\'t known &quot;the so-called secrets of Satan&quot; -- as they say -- I am not putting any other burden on you.";
csb[25] = "Only hold on to what you have until I come.";
csb[26] = "The one who conquers and who keeps my works to the end: I will give him authority over the nations --";
csb[27] = "and he will rule them with an iron scepter; he will shatter them like pottery --";
csb[28] = "just as I have received this from my Father. I will also give him the morning star.";
csb[29] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches.";
kjv[1] = "Unto the angel of the church of Ephesus write; These things saith he that holdeth the seven stars in his right hand, who walketh in the midst of the seven golden candlesticks;";

yng[1] = "`To the messenger of the Ephesian assembly write: These things saith he who is holding the seven stars in his right hand, who is walking in the midst of the seven lamp-stands -- the golden:";

kjv[2] = "I know thy works, and thy labour, and thy patience, and how thou canst not bear them which are evil: and thou hast tried them which say they are apostles, and are not, and hast found them liars:";
rsv[2] = "&quot;\'I know your works, your toil and your patient endurance, and how you cannot bear evil men but have tested those who call themselves apostles but are not, and found them to be false;";
asv[2] = "I know thy works, and thy toil and patience, and that thou canst not bear evil men, and didst try them that call themselves apostles, and they are not, and didst find them false;";
yng[2] = "I have known thy works, and thy labour, and thy endurance, and that thou art not able to bear evil ones, and that thou hast tried those saying themselves to be apostles and are not, and hast found them liars,";
dby[2] = "I know thy works and [thy] labour, and thine endurance, and that thou canst not bear evil [men]; and thou hast tried them who say that themselves [are] apostles and are not, and hast found them liars;";
web[2] = "I know thy works, and thy labor, and thy patience, and that thou canst not bear them who are evil; and thou hast tried them who say they are apostles, and are not; and hast found them liars:";
hnv[2] = "&quot;I know your works, and your toil and perseverance, and that you can\'t tolerate evil men, and have tested those who call themselves apostles, and they are not, and found them false.";
vul[2] = "scio opera tua et laborem et patientiam tuam et quia non potes sustinere malos et temptasti eos qui se dicunt apostolos et non sunt et invenisti eos mendaces";
kjv[3] = "And hast borne, and hast patience, and for my name\'s sake hast laboured, and hast not fainted.";
rsv[3] = "I know you are enduring patiently and bearing up for my name\'s sake, and you have not grown weary.";
asv[3] = "and thou hast patience and didst bear for my name\'s sake, and hast not grown weary.";
yng[3] = "and thou didst bear, and hast endurance, and because of my name hast toiled, and hast not been weary.";
dby[3] = "and endurest, and hast borne for my name\'s sake, and hast not wearied:";
web[3] = "And hast borne, and hast patience, and for my name\'s sake hast labored, and hast not fainted.";
hnv[3] = "You have perseverance and have endured for my name\'s sake, and have not grown weary.";
vul[3] = "et patientiam habes et sustinuisti propter nomen meum et non defecisti";

kjv[9] = "I know thy works, and tribulation, and poverty, (but thou art rich) and [I know] the blasphemy of them which say they are Jews, and are not, but [are] the synagogue of Satan.";

dby[9] = "I know thy tribulation and thy poverty; but thou art rich; and the railing of those who say that they themselves are Jews, and are not, but a synagogue of Satan.";

dby[10] = "Fear nothing [of] what thou art about to suffer. Behold, the devil is about to cast of you into prison, that ye may be tried; and ye shall have tribulation ten days. Be thou faithful unto death, and I will give to thee the crown of life.";

kjv[13] = "I know thy works, and where thou dwellest, [even] where Satan\'s seat [is]: and thou holdest fast my name, and hast not denied my faith, even in those days wherein Antipas [was] my faithful martyr, who was slain among you, where Satan dwelleth.";
rsv[13] = "&quot;\'I know where you dwell, where Satan\'s throne is; you hold fast my name and you did not deny my faith even in the days of An\'tipas my witness, my faithful one, who was killed among you, where Satan dwells.";

yng[13] = "I have known thy works, and where thou dost dwell -- where the throne of the Adversary [is] -- and thou dost hold fast my name, and thou didst not deny my faith, even in the days in which Antipas [was] my faithful witness, who was put to death beside you, where the Adversary doth dwell.";
dby[13] = "I know where thou dwellest, where the throne of Satan [is]; and thou holdest fast my name, and hast not denied my faith, even in the days in which Antipas my faithful witness [was], who was slain among you, where Satan dwells.";
web[13] = "I know thy works, and where thou dwellest, [even] where Satan\'s seat [is]: and thou holdest fast my name, and hast not denied my faith, even in those days wherein Antipas [was] my faithful martyr, who was slain among you, where Satan dwelleth.";
hnv[13] = "&quot;I know your works and where you dwell, where Hasatan\'s throne is. You hold firmly to my name, and didn\'t deny my faith in the days of Antipas my witness, my faithful one, who was killed among you, where Hasatan dwells.";
vul[13] = "scio ubi habitas ubi sedes est Satanae et tenes nomen meum et non negasti fidem meam et in diebus Antipas testis meus fidelis qui occisus est apud vos ubi Satanas habitat";

kjv[18] = "And unto the angel of the church in Thyatira write; These things saith the Son of God, who hath his eyes like unto a flame of fire, and his feet [are] like fine brass;";
rsv[18] = "&quot;And to the angel of the church in Thyati\'ra write: \'The words of the Son of God, who has eyes like a flame of fire, and whose feet are like burnished bronze.";
asv[18] = "And to the angel of the church in Thyatira write: These things saith the Son of God, who hath his eyes like a flame of fire, and his feet are like unto burnished brass:";
yng[18] = "`And to the messenger of the assembly of Thyatira write: These things saith the Son of God, who is having his eyes as a flame of fire, and his feet like to fine brass;";
dby[18] = "And to the angel of the assembly in Thyatira write: These things says the Son of God, he that has his eyes as a flame of fire, and his feet [are] like fine brass:";
web[18] = "And to the angel of the church in Thyatira write; These things saith the Son of God, who hath his eyes like a flame of fire, and his feet [are] like fine brass;";
hnv[18] = "&quot;To the angel of the assembly in Thyatira write: &quot;The Son of God, who has his eyes like a flame of fire, and his feet are like burnished brass, says these things:";
vul[18] = "et angelo Thyatirae ecclesiae scribe haec dicit Filius Dei qui habet oculos ut flammam ignis et pedes eius similes orichalco";
kjv[19] = "I know thy works, and charity, and service, and faith, and thy patience, and thy works; and the last [to be] more than the first.";
rsv[19] = "&quot;\'I know your works, your love and faith and service and patient endurance, and that your latter works exceed the first.";
asv[19] = "I know thy works, and thy love and faith and ministry and patience, and that thy last works are more than the first.";
yng[19] = "I have known thy works, and love, and ministration, and faith, and thy endurance, and thy works -- and the last [are] more than the first.";
dby[19] = "I know thy works, and love, and faith, and service, and thine endurance, and thy last works [to be] more than the first.";
web[19] = "I know thy works, and charity, and service, and faith, and thy patience, and thy works; and the last [to be] more than the first:";
hnv[19] = "I know your works, your love, faith, service, patient endurance, and that your last works are more than the first.";
vul[19] = "novi opera tua et caritatem et fidem et ministerium et patientiam tuam et opera tua novissima plura prioribus";
kjv[20] = "Notwithstanding I have a few things against thee, because thou sufferest that woman Jezebel, which calleth herself a prophetess, to teach and to seduce my servants to commit fornication, and to eat things sacrificed unto idols.";
rsv[20] = "But I have this against you, that you tolerate the woman Jez\'ebel, who calls herself a prophetess and is teaching and beguiling my servants to practice immorality and to eat food sacrificed to idols.";
asv[20] = "But I have [this] against thee, that thou sufferest the woman Jezebel, who calleth herself a prophetess; and she teacheth and seduceth my servants to commit fornication, and to eat things sacrificed to idols.";
yng[20] = "`But I have against thee a few things: That thou dost suffer the woman Jezebel, who is calling herself a prophetess, to teach, and to lead astray, my servants to commit whoredom, and idol-sacrifices to eat;";
dby[20] = "But I have against thee that thou permittest the woman Jezebel, she who calls herself prophetess, and she teaches and leads astray my servants to commit fornication and eat of idol sacrifices.";
web[20] = "Notwithstanding, I have a few things against thee, because thou sufferest that woman Jezebel, who calleth herself a prophetess, to teach and to seduce my servants to commit lewdness, and to eat things sacrificed to idols.";
hnv[20] = "But I have this against you, that you tolerate your woman, Izevel, who calls herself a prophetess. She teaches and seduces my servants to commit sexual immorality, and to eat things sacrificed to idols.";
vul[20] = "sed habeo adversus te quia permittis mulierem Hiezabel quae se dicit propheten docere et seducere servos meos fornicari et manducare de idolothytis";
kjv[21] = "And I gave her space to repent of her fornication; and she repented not.";
rsv[21] = "I gave her time to repent, but she refuses to repent of her immorality.";
asv[21] = "And I gave her time that she should repent; and she willeth not to repent of her fornication.";
yng[21] = "and I did give to her a time that she might reform from her whoredom, and she did not reform;";
dby[21] = "And I gave her time that she should repent, and she will not repent of her fornication.";
web[21] = "And I gave her time to repent of her lewdness, and she repented not.";
hnv[21] = " I gave her time to repent, but she refuses to repent of her sexual immorality.";
vul[21] = "et dedi illi tempus ut paenitentiam ageret et non vult paeniteri a fornicatione sua";
kjv[22] = "Behold, I will cast her into a bed, and them that commit adultery with her into great tribulation, except they repent of their deeds.";
rsv[22] = "Behold, I will throw her on a sickbed, and those who commit adultery with her I will throw into great tribulation, unless they repent of her doings;";
asv[22] = "Behold, I cast her into a bed, and them that commit adultery with her into great tribulation, except they repent of her works.";
yng[22] = "lo, I will cast her into a couch, and those committing adultery with her into great tribulation -- if they may not repent of their works,";
dby[22] = "Behold, I cast her into a bed, and those that commit adultery with her into great tribulation, unless they repent of her works,";
web[22] = "Behold, I will cast her into a bed, and them that commit adultery with her into great tribulation, except they repent of their deeds.";
hnv[22] = "Behold, I will throw her into a bed, and those who commit adultery with her into great oppression, unless they repent of her works.";
vul[22] = "ecce mitto eam in lectum et qui moechantur cum ea in tribulationem maximam nisi paenitentiam egerint ab operibus eius";
kjv[23] = "And I will kill her children with death; and all the churches shall know that I am he which searcheth the reins and hearts: and I will give unto every one of you according to your works.";
rsv[23] = "and I will strike her children dead. And all the churches shall know that I am he who searches mind and heart, and I will give to each of you as your works deserve.";
asv[23] = "And I will kill her children with death; and all the churches shall know that I am he that searcheth the reins and hearts: and I will give unto each one of you according to your works.";
yng[23] = "and her children I will kill in death, and know shall all the assemblies that I am he who is searching reins and hearts; and I will give to you -- to each -- according to your works.";
dby[23] = "and her children will I kill with death; and all the assemblies shall know that *I* am he that searches [the] reins and [the] hearts; and I will give to you each according to your works.";
web[23] = "And I will kill her children with death; and all the churches shall know that I am he who searcheth the reins and hearts: and I will give to every one of you according to your works.";
hnv[23] = "I will kill her children with Death, and all the assemblies will know that I am he who searches the minds and hearts. I will give to each one of you according to your deeds.";
vul[23] = "et filios eius interficiam in morte et scient omnes ecclesiae quia ego sum scrutans renes et corda et dabo unicuique vestrum secundum opera vestra";
kjv[24] = "But unto you I say, and unto the rest in Thyatira, as many as have not this doctrine, and which have not known the depths of Satan, as they speak; I will put upon you none other burden.";
rsv[24] = "But to the rest of you in Thyati\'ra, who do not hold this teaching, who have not learned what some call the deep things of Satan, to you I say, I do not lay upon you any other burden;";
asv[24] = "But to you I say, to the rest that are in Thyatira, as many as have not this teaching, who know not the deep things of Satan, as they are wont to say; I cast upon you none other burden.";
yng[24] = "`And to you I say, and to the rest who are in Thyatira, as many as have not this teaching, and who did not know the depths of the Adversary, as they say; I will not put upon you other burden;";
dby[24] = "But to you I say, the rest who [are] in Thyatira, as many as have not this doctrine, who have not known the depths of Satan, as they say, I do not cast upon you any other burden;";
web[24] = "But to you I say, and to the rest in Thyatira, As many as have not this doctrine, and who have not known the depths of Satan, as they speak; I will put upon you no other burden:";
hnv[24] = "But to you I say, to the rest who are in Thyatira, as many as don\'t have this teaching, who don\'t know what some call \'the deep things of Hasatan,\' to you I say, I am not putting any other burden on you.";
vul[24] = "vobis autem dico ceteris qui Thyatirae estis quicumque non habent doctrinam hanc qui non cognoverunt altitudines Satanae quemadmodum dicunt non mittam super vos aliud pondus";
kjv[25] = "But that which ye have [already] hold fast till I come.";
rsv[25] = "only hold fast what you have, until I come.";
asv[25] = "Nevertheless that which ye have, hold fast till I come.";
yng[25] = "but that which ye have -- hold ye, till I may come;";
dby[25] = "but what ye have hold fast till I shall come.";
web[25] = "But that which ye have [already] hold fast till I come.";
hnv[25] = " Nevertheless, hold firmly that which you have, until I come.";
vul[25] = "tamen id quod habetis tenete donec veniam";

rsv[26] = "He who conquers and who keeps my works until the end, I will give him power over the nations,";
asv[26] = "And he that overcometh, and he that keepeth my works unto the end, to him will I give authority over the nations:";
yng[26] = "and he who is overcoming, and who is keeping unto the end my works, I will give to him authority over the nations,";
dby[26] = "And he that overcomes, and he that keeps unto the end my works, to him will I give authority over the nations,";
web[26] = "And he that overcometh, and keepeth my works to the end, to him will I give power over the nations:";
hnv[26] = "He who overcomes, and he who keeps my works to the end, to him I will give authority over the nations.";
vul[26] = "et qui vicerit et qui custodierit usque in finem opera mea dabo illi potestatem super gentes";
kjv[27] = "And he shall rule them with a rod of iron; as the vessels of a potter shall they be broken to shivers: even as I received of my Father.";
rsv[27] = "and he shall rule them with a rod of iron, as when earthen pots are broken in pieces, even as I myself have received power from my Father;";
asv[27] = "and he shall rule them with a rod of iron, as the vessels of the potter are broken to shivers; as I also have received of my Father:";
yng[27] = "and he shall rule them with a rod of iron -- as the vessels of the potter they shall be broken -- as I also have received from my Father;";
dby[27] = "and he shall shepherd them with an iron rod; as vessels of pottery are they broken in pieces, as I also have received from my Father;";
web[27] = "(And he shall rule them with a rod of iron; as the vessels of a potter shall they be broken to shivers:) even as I received of my Father.";
hnv[27] = "He will rule them with a rod of iron, shattering them like clay pots; as I also have received of my Father:";

web[28] = "And I will give him the morning-star.";
