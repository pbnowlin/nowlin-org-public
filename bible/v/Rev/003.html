csb[1] = "&quot;Write to the angel of the church in Sardis: Thus says the one who has the seven spirits of God and the seven stars: I know your works; you have a reputation for being alive, but you are dead.";
csb[2] = "&quot;Be alert and strengthen what remains, which is about to die, for I have not found your works complete before my God.";
csb[3] = "&quot;Remember, then, what you have received and heard; keep it, and repent. If you are not alert, I will come like a thief, and you have no idea at what hour I will come upon you.";
csb[4] = "&quot;But you have a few people in Sardis who have not defiled their clothes, and they will walk with me in white, because they are worthy.";
csb[5] = "&quot;In the same way, the one who conquers will be dressed in white clothes, and I will never erase his name from the book of life but will acknowledge his name before my Father and before his angels.";
csb[6] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches.";
csb[7] = "&quot;Write to the angel of the church in Philadelphia: Thus says the Holy One, the true one, the one who has the key of David, who opens and no one will close, and who closes and no one opens:";
csb[8] = "&quot;I know your works. Look, I have placed before you an open door that no one can close because you have but little power; yet you have kept my word and have not denied my name.";
csb[9] = "&quot;Note this: I will make those from the synagogue of Satan, who claim to be Jews and are not, but are lying -- I will make them come and bow down at your feet, and they will know that I have loved you.";
csb[10] = "&quot;Because you have kept my command to endure, I will also keep you from the hour of testing that is going to come on the whole world to test those who live on the earth.";
csb[11] = "&quot;I am coming soon. Hold on to what you have, so that no one takes your crown.";
csb[12] = "&quot;The one who conquers I will make a pillar in the temple of my God, and he will never go out again. I will write on him the name of my God and the name of the city of my God -- the new Jerusalem, which comes down out of heaven from my God -- and my new name.";
csb[13] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches.";
csb[14] = "&quot;Write to the angel of the church in Laodicea: Thus says the Amen, the faithful and true witness, the originator of God\'s creation:";
csb[15] = "&quot;I know your works, that you are neither cold nor hot. I wish that you were cold or hot.";
csb[16] = "&quot;So, because you are lukewarm, and neither hot nor cold, I am going to vomit you out of my mouth.";
csb[17] = "&quot;For you say, \'I\'m rich; I have become wealthy and need nothing,\' and you don\'t realize that you are wretched, pitiful, poor, blind, and naked.";
csb[18] = "&quot;I advise you to buy from me gold refined in the fire so that you may be rich, white clothes so that you may be dressed and your shameful nakedness not be exposed, and ointment to spread on your eyes so that you may see.";
csb[19] = "&quot;As many as I love, I rebuke and discipline. So be zealous and repent.";
csb[20] = "&quot;See! I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and eat with him, and he with me.";
csb[21] = "&quot;To the one who conquers I will give the right to sit with me on my throne, just as I also conquered and sat down with my Father on his throne.";
csb[22] = "&quot;Let anyone who has ears to hear listen to what the Spirit says to the churches.&quot;";

yng[1] = "And to the messenger of the assembly in Sardis write: These things saith he who is having the Seven Spirits of God, and the seven stars: I have known thy works, and that thou hast the name that thou dost live, and thou art dead;";

vul[1] = "et angelo ecclesiae Sardis scribe haec dicit qui habet septem spiritus Dei et septem stellas scio opera tua quia nomen habes quod vivas et mortuus es";
kjv[2] = "Be watchful, and strengthen the things which remain, that are ready to die: for I have not found thy works perfect before God.";
rsv[2] = "Awake, and strengthen what remains and is on the point of death, for I have not found your works perfect in the sight of my God.";
asv[2] = "Be thou watchful, and establish the things that remain, which were ready to die: for I have found no works of thine perfected before my God.";
yng[2] = "become watching, and strengthen the rest of the things that are about to die, for I have not found thy works fulfilled before God.";
dby[2] = "Be watchful, and strengthen the things that remain, which are about to die, for I have not found thy works complete before my God.";
web[2] = "Be watchful, and strengthen the things which remain, that are ready to die: for I have not found thy works perfect before God.";
hnv[2] = "Wake up, and keep the things that remain, which you were about to throw away, for I have found no works of yours perfected before my God.";
vul[2] = "esto vigilans et confirma cetera quae moritura erant non enim invenio opera tua plena coram Deo meo";
kjv[3] = "Remember therefore how thou hast received and heard, and hold fast, and repent. If therefore thou shalt not watch, I will come on thee as a thief, and thou shalt not know what hour I will come upon thee.";

asv[3] = "Remember therefore how thou hast received and didst hear; and keep [it], and repent. If therefore thou shalt not watch, I will come as a thief, and thou shalt not know what hour I will come upon thee.";
yng[3] = "`Remember, then, how thou hast received, and heard, and be keeping, and reform: if, then, thou mayest not watch, I will come upon thee as a thief, and thou mayest not know what hour I will come upon thee.";
dby[3] = "Remember therefore how thou hast received and heard, and keep [it] and repent. If therefore thou shalt not watch, I will come [upon thee] as a thief, and thou shalt not know at what hour I shall come upon thee.";

kjv[8] = "I know thy works: behold, I have set before thee an open door, and no man can shut it: for thou hast a little strength, and hast kept my word, and hast not denied my name.";
rsv[8] = "&quot;\'I know your works. Behold, I have set before you an open door, which no one is able to shut; I know that you have but little power, and yet you have kept my word and have not denied my name.";
asv[8] = "I know thy works (behold, I have set before thee a door opened, which none can shut), that thou hast a little power, and didst keep my word, and didst not deny my name.";
yng[8] = "I have known thy works; lo, I have set before thee a door -- opened, and no one is able to shut it, because thou hast a little power, and didst keep my word, and didst not deny my name;";

kjv[9] = "Behold, I will make them of the synagogue of Satan, which say they are Jews, and are not, but do lie; behold, I will make them to come and worship before thy feet, and to know that I have loved thee.";
rsv[9] = "Behold, I will make those of the synagogue of Satan who say that they are Jews and are not, but lie--behold, I will make them come and bow down before your feet, and learn that I have loved you.";
asv[9] = "Behold, I give of the synagogue of Satan, of them that say they are Jews, and they are not, but do lie; behold, I will make them to come and worship before thy feet, and to know that I have loved thee.";
yng[9] = "lo, I make of the synagogue of the Adversary those saying themselves to be Jews, and are not, but do lie; lo, I will make them that they may come and bow before thy feet, and may know that I loved thee.";
dby[9] = "Behold, I make them of the synagogue of Satan who say that they are Jews, and are not, but lie; behold, I will cause that they shall come and shall do homage before thy feet, and shall know that *I* have loved thee.";
web[9] = "Behold, I will make them of the synagogue of Satan, who say they are Jews, and are not, but do lie; behold, I will make them to come and worship before thy feet, and to know that I have loved thee.";
hnv[9] = "Behold, I give of the synagogue of Hasatan, of those who say they are Yehudim, and they are not, but lie. Behold, I will make them to come and worship before your feet, and to know that I have loved you.";
vul[9] = "ecce dabo de synagoga Satanae qui dicunt se Iudaeos esse et non sunt sed mentiuntur ecce faciam illos ut veniant et adorent ante pedes tuos et scient quia ego dilexi te";
kjv[10] = "Because thou hast kept the word of my patience, I also will keep thee from the hour of temptation, which shall come upon all the world, to try them that dwell upon the earth.";
rsv[10] = "Because you have kept my word of patient endurance, I will keep you from the hour of trial which is coming on the whole world, to try those who dwell upon the earth.";
asv[10] = "Because thou didst keep the word of my patience, I also will keep thee from the hour of trial, that [hour] which is to come upon the whole world, to try them that dwell upon the earth.";
yng[10] = "`Because thou didst keep the word of my endurance, I also will keep thee from the hour of the trial that is about to come upon all the world, to try those dwelling upon the earth.";
dby[10] = "Because thou hast kept the word of my patience, *I* also will keep thee out of the hour of trial, which is about to come upon the whole habitable world, to try them that dwell upon the earth.";
web[10] = "Because thou hast kept the word of my patience, I also will keep thee from the hour of temptation, which shall come upon all the world, to try them that dwell upon the earth.";
hnv[10] = "Because you kept my command to endure, I also will keep you from the hour of testing, which is to come on the whole world, to test those who dwell on the eretz.";
vul[10] = "quoniam servasti verbum patientiae meae et ego te servabo ab hora temptationis quae ventura est in orbem universum temptare habitantes in terra";

kjv[12] = "Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out: and I will write upon him the name of my God, and the name of the city of my God, [which is] new Jerusalem, which cometh down out of heaven from my God: and [I will write upon him] my new name.";
rsv[12] = "He who conquers, I will make him a pillar in the temple of my God; never shall he go out of it, and I will write on him the name of my God, and the name of the city of my God, the new Jerusalem which comes down from my God out of heaven, and my own new name.";
asv[12] = "He that overcometh, I will make him a pillar in the temple of my God, and he shall go out thence no more: and I will write upon him the name of my God, and the name of the city of my God, the new Jerusalem, which cometh down out of heaven from my God, and mine own new name.";
yng[12] = "He who is overcoming -- I will make him a pillar in the sanctuary of my God, and without he may not go any more, and I will write upon him the name of my God, and the name of the city of my God, the new Jerusalem, that doth come down out of the heaven from my God -- also my new name.";
dby[12] = "He that overcomes, him will I make a pillar in the temple of my God, and he shall go no more at all out; and I will write upon him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven, from my God, and my new name.";
web[12] = "Him that overcometh, will I make a pillar in the temple of my God, and he shall go out no more: and I will write upon him the name of my God, and the name of the city of my God, [which is] new Jerusalem, which cometh down out of heaven from my God: and [I will write upon him] my new name.";
hnv[12] = "He who overcomes, I will make him a pillar in the temple of my God, and he will go out from there no more. I will write on him the name of my God, and the name of the city of my God, the new Yerushalayim, which comes down out of heaven from my God, and my own new name.";

kjv[17] = "Because thou sayest, I am rich, and increased with goods, and have need of nothing; and knowest not that thou art wretched, and miserable, and poor, and blind, and naked:";
rsv[17] = "For you say, I am rich, I have prospered, and I need nothing; not knowing that you are wretched, pitiable, poor, blind, and naked.";
asv[17] = "Because thou sayest, I am rich, and have gotten riches, and have need of nothing; and knowest not that thou art the wretched one and miserable and poor and blind and naked:";
yng[17] = "because thou sayest -- I am rich, and have grown rich, and have need of nothing, and hast not known that thou art the wretched, and miserable, and poor, and blind, and naked,";

vul[17] = "quia dicis quod dives sum et locupletatus et nullius egeo et nescis quia tu es miser et miserabilis et pauper et caecus et nudus";
kjv[18] = "I counsel thee to buy of me gold tried in the fire, that thou mayest be rich; and white raiment, that thou mayest be clothed, and [that] the shame of thy nakedness do not appear; and anoint thine eyes with eyesalve, that thou mayest see.";
rsv[18] = "Therefore I counsel you to buy from me gold refined by fire, that you may be rich, and white garments to clothe you and to keep the shame of your nakedness from being seen, and salve to anoint your eyes, that you may see.";
asv[18] = "I counsel thee to buy of me gold refined by fire, that thou mayest become rich; and white garments, that thou mayest clothe thyself, and [that] the shame of thy nakedness be not made manifest; and eyesalve to anoint thine eyes, that thou mayest see.";
yng[18] = "I counsel thee to buy from me gold fired by fire, that thou mayest be rich, and white garments that thou mayest be arrayed, and the shame of thy nakedness may not be manifest, and with eye-salve anoint thine eyes, that thou mayest see.";
dby[18] = "I counsel thee to buy of me gold purified by fire, that thou mayest be rich; and white garments, that thou mayest be clothed, and that the shame of thy nakedness may not be made manifest; and eye-salve to anoint thine eyes, that thou mayest see.";
web[18] = "I counsel thee to buy of me gold tried in the fire, that thou mayest be rich; and white raiment, that thou mayest be clothed, and [that] the shame of thy nakedness may not appear; and anoint thy eyes with eye-salve, that thou mayest see.";
