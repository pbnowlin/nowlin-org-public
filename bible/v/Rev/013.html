csb[1] = "And I saw a beast coming up out of the sea. It had ten horns and seven heads. On its horns were ten crowns, and on its heads were blasphemous names.";
csb[2] = "The beast I saw was like a leopard, its feet were like a bear\'s, and its mouth was like a lion\'s mouth. The dragon gave the beast his power, his throne, and great authority.";
csb[3] = "One of its heads appeared to be fatally wounded, but its fatal wound was healed. The whole earth was amazed and followed the beast.";
csb[4] = "They worshiped the dragon because he gave authority to the beast. And they worshiped the beast, saying, &quot;Who is like the beast? Who is able to wage war against it? &quot;";
csb[5] = "The beast was given a mouth to utter boasts and blasphemies. It was allowed to exercise authority for forty-two months.";
csb[6] = "It began to speak blasphemies against God: to blaspheme his name and his dwelling -- those who dwell in heaven.";
csb[7] = "And it was permitted to wage war against the saints and to conquer them. It was also given authority over every tribe, people, language, and nation.";
csb[8] = "All those who live on the earth will worship it, everyone whose name was not written from the foundation of the world in the book of life of the Lamb who was slaughtered.";
csb[9] = "If anyone has ears to hear, let him listen.";
csb[10] = "If anyone is to be taken captive, into captivity he goes. If anyone is to be killed with a sword, with a sword he will be killed. This calls for endurance and faithfulness from the saints.";
csb[11] = "Then I saw another beast coming up out of the earth; it had two horns like a lamb, but it spoke like a dragon.";
csb[12] = "It exercises all the authority of the first beast on its behalf and compels the earth and those who live on it to worship the first beast, whose fatal wound was healed.";
csb[13] = "It also performs great signs, even causing fire to come down from heaven to earth in front of people.";
csb[14] = "It deceives those who live on the earth because of the signs that it is permitted to perform in the presence of the beast, telling those who live on the earth to make an image of the beast who was wounded by the sword and yet lived.";
csb[15] = "It was permitted to give breath to the image of the beast, so that the image of the beast could both speak and cause whoever would not worship the image of the beast to be killed.";
csb[16] = "And it makes everyone -- small and great, rich and poor, free and slave -- to receive a mark on his right hand or on his forehead,";
csb[17] = "so that no one can buy or sell unless he has the mark: the beast\'s name or the number of its name.";
csb[18] = "This calls for wisdom: Let the one who has understanding calculate the number of the beast, because it is the number of a person. Its number is 666.";
