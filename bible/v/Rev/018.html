csb[1] = "After this I saw another angel with great authority coming down from heaven, and the earth was illuminated by his splendor.";
csb[2] = "He called out in a mighty voice: It has fallen, Babylon the Great has fallen! She has become a home for demons, a haunt for every unclean spirit, a haunt for every unclean bird, and a haunt for every unclean and despicable beast.";
csb[3] = "For all the nations have drunk the wine of her sexual immorality, which brings wrath. The kings of the earth have committed sexual immorality with her, and the merchants of the earth have grown wealthy from her sensuality and excess.";
csb[4] = "Then I heard another voice from heaven: Come out of her, my people, so that you will not share in her sins or receive any of her plagues.";
csb[5] = "For her sins are piled up to heaven, and God has remembered her crimes.";
csb[6] = "Pay her back the way she also paid, and double it according to her works. In the cup in which she mixed, mix a double portion for her.";
csb[7] = "As much as she glorified herself and indulged her sensual and excessive ways, give her that much torment and grief. For she says in her heart, &quot;I sit as a queen; I am not a widow, and I will never see grief.&quot;";
csb[8] = "For this reason her plagues will come in just one day -- death and grief and famine. She will be burned up with fire, because the Lord God who judges her is mighty.";
csb[9] = "The kings of the earth who have committed sexual immorality and shared her sensual and excessive ways will weep and mourn over her when they see the smoke from her burning.";
csb[10] = "They will stand far off in fear of her torment, saying, Woe, woe, the great city, Babylon, the mighty city! For in a single hour your judgment has come.";
csb[11] = "The merchants of the earth will weep and mourn over her, because no one buys their cargo any longer --";
csb[12] = "cargo of gold, silver, jewels, and pearls; fine linen, purple, silk, and scarlet; all kinds of fragrant wood products; objects of ivory; objects of expensive wood, brass, iron, and marble;";
csb[13] = "cinnamon, spice, incense, myrrh, and frankincense; wine, olive oil, fine flour, and grain; cattle and sheep; horses and carriages; and slaves -- human lives.";
csb[14] = "The fruit you craved has left you. All your splendid and glamorous things are gone; they will never find them again.";
csb[15] = "The merchants of these things, who became rich from her, will stand far off in fear of her torment, weeping and mourning,";
csb[16] = "saying, Woe, woe, the great city, dressed in fine linen, purple, and scarlet, adorned with gold, jewels, and pearls;";
csb[17] = "for in a single hour such fabulous wealth was destroyed! And every shipmaster, seafarer, the sailors, and all who do business by sea, stood far off";
csb[18] = "as they watched the smoke from her burning and kept crying out: &quot;Who was like the great city? &quot;";
csb[19] = "They threw dust on their heads and kept crying out, weeping, and mourning, Woe, woe, the great city, where all those who have ships on the sea became rich from her wealth; for in a single hour she was destroyed.";
csb[20] = "Rejoice over her, heaven, and you saints, apostles, and prophets, because God has pronounced on her the judgment she passed on you!";
csb[21] = "Then a mighty angel picked up a stone like a large millstone and threw it into the sea, saying, In this way, Babylon the great city will be thrown down violently and never be found again.";
csb[22] = "The sound of harpists, musicians, flutists, and trumpeters will never be heard in you again; no craftsman of any trade will ever be found in you again; the sound of a mill will never be heard in you again;";
csb[23] = "the light of a lamp will never shine in you again; and the voice of a groom and bride will never be heard in you again. All this will happen because your merchants were the nobility of the earth, because all the nations were deceived by your sorcery.";
csb[24] = "In her was found the blood of prophets and saints, and of all those slaughtered on the earth.";
kjv[1] = "And after these things I saw another angel come down from heaven, having great power; and the earth was lightened with his glory.";
rsv[1] = "After this I saw another angel coming down from heaven, having great authority; and the earth was made bright with his splendor.";
asv[1] = "After these things I saw another angel coming down out of heaven, having great authority; and the earth was lightened with his glory.";
yng[1] = "And after these things I saw another messenger coming down out of the heaven, having great authority, and the earth was lightened from his glory,";
dby[1] = "After these things I saw another angel descending out of the heaven, having great authority: and the earth was lightened with his glory.";
web[1] = "And after these things I saw another angel come down from heaven, having great power; and the earth was lightened with his glory.";
hnv[1] = "After these things, I saw another angel coming down out of the sky, having great authority. The eretz was illuminated with his glory.";

kjv[2] = "And he cried mightily with a strong voice, saying, Babylon the great is fallen, is fallen, and is become the habitation of devils, and the hold of every foul spirit, and a cage of every unclean and hateful bird.";
rsv[2] = "And he called out with a mighty voice, &quot;Fallen, fallen is Babylon the great! It has become a dwelling place of demons, a haunt of every foul spirit, a haunt of every foul and hateful bird;";
asv[2] = "And he cried with a mighty voice, saying, Fallen, fallen is Babylon the great, and is become a habitation of demons, and a hold of every unclean spirit, and a hold of every unclean and hateful bird.";
yng[2] = "and he did cry in might -- a great voice, saying, `Fall, fall did Babylon the great, and she became a habitation of demons, and a hold of every unclean spirit, and a hold of every unclean and hateful bird,";
dby[2] = "And he cried with a strong voice, saying, Great Babylon has fallen, has fallen, and has become the habitation of demons, and a hold of every unclean spirit, and a hold of every unclean and hated bird;";
web[2] = "And he cried mightily with a strong voice, saying, Babylon the great is fallen, is fallen, and is become the habitation of demons, and the hold of every foul spirit, and a cage of every unclean and hateful bird.";
hnv[2] = "He cried with a mighty voice, saying, &quot;Fallen, fallen is Bavel the great, and she has become a habitation of demons, a prison of every unclean spirit, and a prison of every unclean and hateful bird!";
vul[2] = "et exclamavit in forti voce dicens cecidit cecidit Babylon magna et facta est habitatio daemoniorum et custodia omnis spiritus inmundi et custodia omnis volucris inmundae";
kjv[3] = "For all nations have drunk of the wine of the wrath of her fornication, and the kings of the earth have committed fornication with her, and the merchants of the earth are waxed rich through the abundance of her delicacies.";
rsv[3] = "for all nations have drunk the wine of her impure passion, and the kings of the earth have committed fornication with her, and the merchants of the earth have grown rich with the wealth of her wantonness.&quot;";
asv[3] = "For by the wine of the wrath of her fornication all the nations are fallen; and the kings of the earth committed fornication with her, and the merchants of the earth waxed rich by the power of her wantonness.";
yng[3] = "because of the wine of the wrath of her whoredom have all the nations drunk, and the kings of the earth with her did commit whoredom, and merchants of the earth from the power of her revel were made rich.";
dby[3] = "because all the nations have drunk of the wine of the fury of her fornication; and the kings of the earth have committed fornication with her, and the merchants of the earth have been enriched through the might of her luxury.";
web[3] = "For all nations have drank of the wine of the wrath of her lewdness, and the kings of the earth have committed lewd deeds with her, and the merchants of the earth have become rich through the abundance of her delicacies.";
hnv[3] = "For all the nations have drunk of the wine of the wrath of her sexual immorality, the kings of the eretz committed sexual immorality with her, and the merchants of the eretz grew rich from the abundance of her luxury.&quot;";
vul[3] = "quia de ira fornicationis eius biberunt omnes gentes et reges terrae cum illa fornicati sunt et mercatores terrae de virtute deliciarum eius divites facti sunt";
kjv[4] = "And I heard another voice from heaven, saying, Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues.";
rsv[4] = "Then I heard another voice from heaven saying, &quot;Come out of her, my people, lest you take part in her sins, lest you share in her plagues;";

dby[4] = "And I heard another voice out of the heaven saying, Come out of her, my people, that ye have not fellowship in her sins, and that ye do not receive of her plagues:";

rsv[5] = "for her sins are heaped high as heaven, and God has remembered her iniquities.";
asv[5] = "for her sins have reached even unto heaven, and God hath remembered her iniquities.";
yng[5] = "because her sins did follow -- unto the heaven, and God did remember her unrighteousness.";
dby[5] = "for her sins have been heaped on one another up to the heaven, and God has remembered her unrighteousnesses.";
web[5] = "For her sins have reached to heaven, and God hath remembered her iniquities.";
hnv[5] = "for her sins have reached to the sky, and God has remembered her iniquities.";

kjv[6] = "Reward her even as she rewarded you, and double unto her double according to her works: in the cup which she hath filled fill to her double.";
rsv[6] = "Render to her as she herself has rendered, and repay her double for her deeds; mix a double draught for her in the cup she mixed.";
asv[6] = "Render unto her even as she rendered, and double [unto her] the double according to her works: in the cup which she mingled, mingle unto her double.";
yng[6] = "Render to her as also she did render to you, and double to her doubles according to her works; in the cup that she did mingle mingle to her double.";
dby[6] = "Recompense her even as she has recompensed; and double [to her] double, according to her works. In the cup which she has mixed, mix to her double.";
web[6] = "Reward her even as she rewarded you, and double to her double according to her works: in the cup which she hath filled, fill to her double.";
hnv[6] = "Return to her just as she returned, and repay her double as she did, and according to her works. In the cup which she mixed, mix to her double.";
vul[6] = "reddite illi sicut ipsa reddidit et duplicate duplicia secundum opera eius in poculo quo miscuit miscite illi duplum";
kjv[7] = "How much she hath glorified herself, and lived deliciously, so much torment and sorrow give her: for she saith in her heart, I sit a queen, and am no widow, and shall see no sorrow.";
rsv[7] = "As she glorified herself and played the wanton, so give her a like measure of torment and mourning. Since in her heart she says, \'A queen I sit, I am no widow, mourning I shall never see,\'";
asv[7] = "How much soever she glorified herself, and waxed wanton, so much give her of torment and mourning: for she saith in her heart, I sit a queen, and am no widow, and shall in no wise see mourning.";
yng[7] = "`As much as she did glorify herself and did revel, so much torment and sorrow give to her, because in her heart she saith, I sit a queen, and a widow I am not, and sorrow I shall not see;";
dby[7] = "So much as she has glorified herself and lived luxuriously, so much torment and grief give to her. Because she says in her heart, I sit a queen, and I am not a widow; and I shall in no wise see grief:";
web[7] = "How much she hath glorified herself, and lived deliciously, so much torment and sorrow give her: for she saith in her heart, I sit a queen, and am no widow, and shall see no sorrow.";
hnv[7] = "However much she glorified herself, and grew wanton, so much give her of torment and mourning. For she says in her heart, \'I sit a queen, and am no widow, and will in no way see mourning.\'";
vul[7] = "quantum glorificavit se et in deliciis fuit tantum date illi tormentum et luctum quia in corde suo dicit sedeo regina et vidua non sum et luctum non videbo";

kjv[19] = "And they cast dust on their heads, and cried, weeping and wailing, saying, Alas, alas, that great city, wherein were made rich all that had ships in the sea by reason of her costliness! for in one hour is she made desolate.";
rsv[19] = "And they threw dust on their heads, as they wept and mourned, crying out, &quot;Alas, alas, for the great city where all who had ships at sea grew rich by her wealth! In one hour she has been laid waste.";
asv[19] = "And they cast dust on their heads, and cried, weeping and mourning, saying, Woe, woe, the great city, wherein all that had their ships in the sea were made rich by reason of her costliness! for in one hour is she made desolate.";
yng[19] = "and they did cast dust upon their heads, and were crying out, weeping and sorrowing, saying, Wo, wo, the great city! in which were made rich all having ships in the sea, out of her costliness -- for in one hour was she made waste.";
dby[19] = "and cast dust upon their heads, and cried, weeping and grieving, saying, Woe, woe, the great city, in which all that had ships in the sea were enriched through her costliness! for in one hour she has been made desolate.";
web[19] = "And they cast dust on their heads, and cried, weeping and wailing, saying, Alas, alas, that great city, in which were made rich all that had ships in the sea by reason of her opulence! for in one hour is she made desolate.";
hnv[19] = "They cast dust on their heads, and cried, weeping and mourning, saying, \'Woe, woe, the great city, in which all who had their ships in the sea were made rich by reason of her great wealth!\' For in one hour is she made desolate.";
vul[19] = "et miserunt pulverem super capita sua et clamaverunt flentes et lugentes dicentes vae vae civitas magna in qua divites facti sunt omnes qui habent naves in mari de pretiis eius quoniam una hora desolata est";

yng[21] = "And one strong messenger did take up a stone as a great millstone, and did cast [it] to the sea, saying, `Thus with violence shall Babylon be cast, the great city, and may not be found any more at all;";
dby[21] = "And a strong angel took up a stone, as a great millstone, and cast [it] into the sea, saying, Thus with violence shall Babylon the great city be cast down, and shall be found no more at all;";

vul[22] = "et vox citharoedorum et musicorum et tibia canentium et tuba non audietur in te amplius et omnis artifex omnis artis non invenietur in te amplius et vox molae non audietur in te amplius";
