csb[1] = "The fifth angel blew his trumpet, and I saw a star that had fallen from heaven to earth. The key for the shaft to the abyss was given to him.";
csb[2] = "He opened the shaft to the abyss, and smoke came up out of the shaft like smoke from a great furnace so that the sun and the air were darkened by the smoke from the shaft.";
csb[3] = "Then locusts came out of the smoke on to the earth, and power was given to them like the power that scorpions have on the earth.";
csb[4] = "They were told not to harm the grass of the earth, or any green plant, or any tree, but only those people who do not have God\'s seal on their foreheads.";
csb[5] = "They were not permitted to kill them but were to torment them for five months; their torment is like the torment caused by a scorpion when it stings someone.";
csb[6] = "In those days people will seek death and will not find it; they will long to die, but death will flee from them.";
csb[7] = "The appearance of the locusts was like horses prepared for battle. Something like golden crowns was on their heads; their faces were like human faces;";
csb[8] = "they had hair like women\'s hair; their teeth were like lions\' teeth;";
csb[9] = "they had chests like iron breastplates; the sound of their wings was like the sound of many chariots with horses rushing into battle;";
csb[10] = "and they had tails with stingers like scorpions, so that with their tails they had the power to harm people for five months.";
csb[11] = "They had as their king the angel of the abyss; his name in Hebrew is Abaddon, and in Greek he has the name Apollyon.";
csb[12] = "The first woe has passed. There are still two more woes to come after this.";
csb[13] = "The sixth angel blew his trumpet. From the four horns of the golden altar that is before God, I heard a voice";
csb[14] = "say to the sixth angel who had the trumpet, &quot;Release the four angels bound at the great river Euphrates.&quot;";
csb[15] = "So the four angels who were prepared for the hour, day, month, and year were released to kill a third of the human race.";
csb[16] = "The number of mounted troops was two hundred million; I heard their number.";
csb[17] = "This is how I saw the horses and their riders in the vision: They had breastplates that were fiery red, hyacinth blue, and sulfur yellow. The heads of the horses were like the heads of lions, and from their mouths came fire, smoke, and sulfur.";
csb[18] = "A third of the human race was killed by these three plagues -- by the fire, the smoke, and the sulfur that came from their mouths.";
csb[19] = "For the power of the horses is in their mouths and in their tails, because their tails, which resemble snakes, have heads that inflict injury.";
csb[20] = "The rest of the people, who were not killed by these plagues, did not repent of the works of their hands to stop worshiping demons and idols of gold, silver, bronze, stone, and wood, which cannot see, hear, or walk.";
csb[21] = "And they did not repent of their murders, their sorceries, their sexual immorality, or their thefts.";

hnv[20] = "The rest of mankind, who were not killed with these plagues, didn\'t repent of the works of their hands, that they wouldn\'t worship demons, and the idols of gold, and of silver, and of brass, and of stone, and of wood; which can neither see, nor hear, nor walk.";
