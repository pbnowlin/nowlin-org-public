csb[1] = "After this I heard something like the loud voice of a vast multitude in heaven, saying, Hallelujah! Salvation, glory, and power belong to our God,";

csb[11] = "Then I saw heaven opened, and there was a white horse. Its rider is called Faithful and True, and he judges and makes war with justice.";

vul[18] = "ut manducetis carnes regum et carnes tribunorum et carnes fortium et carnes equorum et sedentium in ipsis et carnes omnium liberorum ac servorum et pusillorum ac magnorum";
rsv[19] = "And I saw the beast and the kings of the earth with their armies gathered to make war against him who sits upon the horse and against his army.";
asv[19] = "And I saw the beast, and the kings of the earth, and their armies, gathered together to make war against him that sat upon the horse, and against his army.";
yng[19] = "And I saw the beast, and the kings of the earth, and their armies, having been gathered together to make war with him who is sitting upon the horse, and with his army;";
dby[19] = "And I saw the beast and the kings of the earth and their armies gathered together to make war against him that sat upon the horse, and against his army.";
web[19] = "And I saw the beast, and the kings of the earth, and their armies, assembled to make war against him that sat on the horse, and against his army.";
hnv[19] = "I saw the beast, and the kings of the eretz, and their armies, gathered together to make war against him who sat on the horse, and against his army.";
vul[19] = "et vidi bestiam et reges terrae et exercitus eorum congregatos ad faciendum proelium cum illo qui sedebat in equo et cum exercitu eius";
rsv[20] = "And the beast was captured, and with it the false prophet who in its presence had worked the signs by which he deceived those who had received the mark of the beast and those who worshiped its image. These two were thrown alive into the lake of fire that burns with sulphur.";
asv[20] = "And the beast was taken, and with him the false prophet that wrought the signs in his sight, wherewith he deceived them that had received the mark of the beast and them that worshipped his image: they two were cast alive into the lake of fire that burneth with brimstone:";
yng[20] = "and the beast was taken, and with him the false prophet who did the signs before him, in which he led astray those who did receive the mark of the beast, and those who did bow before his image; living they were cast -- the two -- to the lake of the fire, that is burning with brimstone;";
dby[20] = "And the beast was taken, and the false prophet that [was] with him, who wrought the signs before him by which he deceived them that received the mark of the beast, and those that worship his image. Alive were both cast into the lake of fire which burns with brimstone;";
web[20] = "And the beast was taken, and with him the false prophet that wrought miracles before him, with which he deceived them that had received the mark of the beast, and them that worshiped his image. These both were cast alive into a lake of fire burning with brimstone.";
hnv[20] = "The beast was taken, and with him the false prophet who worked the signs in his sight, with which he deceived those who had received the mark of the beast and those who worshiped his image. These two were thrown alive into the lake of fire that burns with sulfur.";
vul[20] = "et adprehensa est bestia et cum illo pseudopropheta qui fecit signa coram ipso quibus seduxit eos qui acceperunt caracterem bestiae qui et adorant imaginem eius vivi missi sunt hii duo in stagnum ignis ardentis sulphure";
rsv[21] = "And the rest were slain by the sword of him who sits upon the horse, the sword that issues from his mouth; and all the birds were gorged with their flesh.";
asv[21] = "and the rest were killed with the sword of him that sat upon the horse, [even the sword] which came forth out of his mouth: and all the birds were filled with their flesh.";
yng[21] = "and the rest were killed with the sword of him who is sitting on the horse, which [sword] is proceeding out of his mouth, and all the birds were filled out of their flesh.";
dby[21] = "and the rest were slain with the sword of him that sat upon the horse, which goes out of his mouth; and all the birds were filled with their flesh.";
web[21] = "And the remnant were slain with the sword of him that sat upon the horse, which [sword] proceedeth out of his mouth: and all the fowls were filled with their flesh.";
hnv[21] = "The rest were killed with the sword of him who sat on the horse, the sword which came forth out of his mouth. All the birds were filled with their flesh.";
vul[21] = "et ceteri occisi sunt in gladio sedentis super equum qui procedit de ore ipsius et omnes aves saturatae sunt carnibus eorum";
