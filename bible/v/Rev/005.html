csb[1] = "Then I saw in the right hand of the one seated on the throne a scroll with writing on both sides, sealed with seven seals.";
csb[2] = "I also saw a mighty angel proclaiming with a loud voice, &quot;Who is worthy to open the scroll and break its seals? &quot;";
csb[3] = "But no one in heaven or on earth or under the earth was able to open the scroll or even to look in it.";
csb[4] = "I wept and wept because no one was found worthy to open the scroll or even to look in it.";
csb[5] = "Then one of the elders said to me, &quot;Do not weep. Look, the Lion from the tribe of Judah, the Root of David, has conquered so that he is able to open the scroll and its seven seals.&quot;";
csb[6] = "Then I saw one like a slaughtered lamb standing in the midst of the throne and the four living creatures and among the elders. He had seven horns and seven eyes, which are the seven spirits of God sent into all the earth.";
csb[7] = "He went and took the scroll out of the right hand of the one seated on the throne.";
csb[8] = "When he took the scroll, the four living creatures and the twenty-four elders fell down before the Lamb. Each one had a harp and golden bowls filled with incense, which are the prayers of the saints.";
csb[9] = "And they sang a new song: You are worthy to take the scroll and to open its seals, because you were slaughtered, and you purchased people for God by your blood from every tribe and language and people and nation.";
csb[10] = "You made them a kingdom and priests to our God, and they will reign on the earth.";
csb[11] = "Then I looked and heard the voice of many angels around the throne, and also of the living creatures and of the elders. Their number was countless thousands, plus thousands of thousands.";
csb[12] = "They said with a loud voice, Worthy is the Lamb who was slaughtered to receive power and riches and wisdom and strength and honor and glory and blessing!";
csb[13] = "I heard every creature in heaven, on earth, under the earth, on the sea, and everything in them say, Blessing and honor and glory and power be to the one seated on the throne, and to the Lamb, forever and ever!";
csb[14] = "The four living creatures said, &quot;Amen,&quot; and the elders fell down and worshiped.";
