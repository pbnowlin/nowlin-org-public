csb[1] = "Then I saw a new heaven and a new earth; for the first heaven and the first earth had passed away, and the sea was no more.";
csb[2] = "I also saw the holy city, the new Jerusalem, coming down out of heaven from God, prepared like a bride adorned for her husband.";
csb[3] = "Then I heard a loud voice from the throne: Look, God\'s dwelling is with humanity, and he will live with them. They will be his peoples, and God himself will be with them and will be their God.";
csb[4] = "He will wipe away every tear from their eyes. Death will be no more; grief, crying, and pain will be no more, because the previous things have passed away.";
csb[5] = "Then the one seated on the throne said, &quot;Look, I am making everything new.&quot; He also said, &quot;Write, because these words are faithful and true.&quot;";
csb[6] = "Then he said to me, &quot;It is done! I am the Alpha and the Omega, the beginning and the end. I will freely give to the thirsty from the spring of the water of life.";
csb[7] = "&quot;The one who conquers will inherit these things, and I will be his God, and he will be my son.";
csb[8] = "&quot;But the cowards, faithless, detestable, murderers, sexually immoral, sorcerers, idolaters, and all liars -- their share will be in the lake that burns with fire and sulfur, which is the second death.&quot;";
csb[9] = "Then one of the seven angels, who had held the seven bowls filled with the seven last plagues, came and spoke with me: &quot;Come, I will show you the bride, the wife of the Lamb.&quot;";
csb[10] = "He then carried me away in the Spirit to a great, high mountain and showed me the holy city, Jerusalem, coming down out of heaven from God,";
csb[11] = "arrayed with God\'s glory. Her radiance was like a precious jewel, like a jasper stone, clear as crystal.";
csb[12] = "The city had a massive high wall, with twelve gates. Twelve angels were at the gates; the names of the twelve tribes of Israel\'s sons were inscribed on the gates.";
csb[13] = "There were three gates on the east, three gates on the north, three gates on the south, and three gates on the west.";
csb[14] = "The city wall had twelve foundations, and the twelve names of the twelve apostles of the Lamb were on the foundations.";
csb[15] = "The one who spoke with me had a golden measuring rod to measure the city, its gates, and its wall.";
csb[16] = "The city is laid out in a square; its length and width are the same. He measured the city with the rod at 12,000 stadia. Its length, width, and height are equal.";
csb[17] = "Then he measured its wall, 144 cubits according to human measurement, which the angel used.";
csb[18] = "The building material of its wall was jasper, and the city was pure gold clear as glass.";
csb[19] = "The foundations of the city wall were adorned with every kind of jewel: the first foundation is jasper, the second sapphire, the third chalcedony, the fourth emerald,";
csb[20] = "the fifth sardonyx, the sixth carnelian, the seventh chrysolite, the eighth beryl, the ninth topaz, the tenth chrysoprase, the eleventh jacinth, the twelfth amethyst.";
csb[21] = "The twelve gates are twelve pearls; each individual gate was made of a single pearl. The main street of the city was pure gold, transparent as glass.";
csb[22] = "I did not see a temple in it, because the Lord God the Almighty and the Lamb are its temple.";
csb[23] = "The city does not need the sun or the moon to shine on it, because the glory of God illuminates it, and its lamp is the Lamb.";
csb[24] = "The nations will walk by its light, and the kings of the earth will bring their glory into it.";
csb[25] = "Its gates will never close by day because it will never be night there.";
csb[26] = "They will bring the glory and honor of the nations into it.";
csb[27] = "Nothing unclean will ever enter it, nor anyone who does what is detestable or false, but only those written in the Lamb\'s book of life.";

dby[19] = "the foundations of the wall of the city [were] adorned with every precious stone: the first foundation, jasper; the second, sapphire; the third, chalcedony; the fourth, emerald;";
web[19] = "And the foundations of the wall of the city [were] garnished with all manner of precious stones. The first foundation [was] jasper; the second, sapphire; the third, a chalcedony; the fourth, an emerald;";
hnv[19] = "The foundations of the city\'s wall were adorned with all kinds of precious stones. The first foundation was jasper; the second, sapphire; the third, chalcedony; the fourth, yahalom;";
vul[19] = "fundamenta muri civitatis omni lapide pretioso ornata fundamentum primum iaspis secundus sapphyrus tertius carcedonius quartus zmaragdus";
kjv[20] = "The fifth, sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, a topaz; the tenth, a chrysoprasus; the eleventh, a jacinth; the twelfth, an amethyst.";

web[20] = "The fifth, sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, a topaz; the tenth, a chrysoprase; the eleventh, a jacinth; the twelfth, an amethyst.";

vul[20] = "quintus sardonix sextus sardinus septimus chrysolitus octavus berillus nonus topazius decimus chrysoprassus undecimus hyacinthus duodecimus amethistus";
kjv[21] = "And the twelve gates [were] twelve pearls; every several gate was of one pearl: and the street of the city [was] pure gold, as it were transparent glass.";
rsv[21] = "And the twelve gates were twelve pearls, each of the gates made of a single pearl, and the street of the city was pure gold, transparent as glass.";
asv[21] = "And the twelve gates were twelve pearls; each one of the several gates was of one pearl: and the street of the city was pure gold, as it were transparent glass.";
yng[21] = "And the twelve gates [are] twelve pearls, each several one of the gates was of one pearl; and the broad-place of the city [is] pure gold -- as transparent glass.";
dby[21] = "And the twelve gates, twelve pearls; each one of the gates, respectively, was of one pearl; and the street of the city pure gold, as transparent glass.";
web[21] = "And the twelve gates [were] twelve pearls; every several gate was of one pearl; and the street of the city [was] pure gold, as it were transparent glass.";
hnv[21] = "The twelve gates were twelve pearls. Each one of the gates was made of one pearl. The street of the city was pure gold, like transparent glass.";
vul[21] = "et duodecim portae duodecim margaritae sunt per singulas et singulae portae erant ex singulis margaritis et platea civitatis aurum mundum tamquam vitrum perlucidum";
kjv[22] = "And I saw no temple therein: for the Lord God Almighty and the Lamb are the temple of it.";
rsv[22] = "And I saw no temple in the city, for its temple is the Lord God the Almighty and the Lamb.";
asv[22] = "And I saw no temple therein: for the Lord God the Almighty, and the Lamb, are the temple thereof.";
yng[22] = "And a sanctuary I did not see in it, for the Lord God, the Almighty, is its sanctuary, and the Lamb,";
dby[22] = "And I saw no temple in it; for the Lord God Almighty is its temple, and the Lamb.";
web[22] = "And I saw no temple in it: for the Lord God Almighty and the Lamb are the temple of it.";
hnv[22] = "I saw no temple in it, for the Lord God, Shaddai, and the Lamb, are its temple.";
vul[22] = "et templum non vidi in ea Dominus enim Deus omnipotens templum illius est et agnus";
kjv[23] = "And the city had no need of the sun, neither of the moon, to shine in it: for the glory of God did lighten it, and the Lamb [is] the light thereof.";
rsv[23] = "And the city has no need of sun or moon to shine upon it, for the glory of God is its light, and its lamp is the Lamb.";
asv[23] = "And the city hath no need of the sun, neither of the moon, to shine upon it: for the glory of God did lighten it, and the lamp thereof [is] the Lamb.";
yng[23] = "and the city hath no need of the sun, nor of the moon, that they may shine in it; for the glory of God did lighten it, and the lamp of it [is] the Lamb;";
dby[23] = "And the city has no need of the sun nor of the moon, that they should shine for it; for the glory of God has enlightened it, and the lamp thereof [is] the Lamb.";
web[23] = "And the city had no need of the sun, neither of the moon, to shine in it: for the glory of God enlightened it, and the Lamb [is] the light of it.";
hnv[23] = "The city has no need for the sun, neither of the moon, to shine, for the very glory of God illuminated it, and its lamp is the Lamb.";
vul[23] = "et civitas non eget sole neque luna ut luceant in ea nam claritas Dei inluminavit eam et lucerna eius est agnus";
kjv[24] = "And the nations of them which are saved shall walk in the light of it: and the kings of the earth do bring their glory and honour into it.";
rsv[24] = "By its light shall the nations walk; and the kings of the earth shall bring their glory into it,";
asv[24] = "And the nations shall walk amidst the light thereof: and the kings of the earth bring their glory into it.";
yng[24] = "and the nations of the saved in its light shall walk, and the kings of the earth do bring their glory and honour into it,";
dby[24] = "And the nations shall walk by its light; and the kings of the earth bring their glory to it.";
web[24] = "And the nations of them who are saved shall walk in the light of it: and the kings of the earth bring their glory and honor into it.";
hnv[24] = "The nations will walk in its light. The kings of the eretz bring the glory and honor of the nations into it.";
vul[24] = "et ambulabunt gentes per lumen eius et reges terrae adferent gloriam suam et honorem in illam";
kjv[25] = "And the gates of it shall not be shut at all by day: for there shall be no night there.";
rsv[25] = "and its gates shall never be shut by day--and there shall be no night there;";
asv[25] = "And the gates thereof shall in no wise be shut by day (for there shall be no night there):";
yng[25] = "and its gates shall not at all be shut by day, for night shall not be there;";
dby[25] = "And its gates shall not be shut at all by day, for night shall not be there.";
web[25] = "And the gates of it shall not be shut by day: for there shall be no night there.";
hnv[25] = "Its gates will in no way be shut by day (for there will be no night there),";
vul[25] = "et portae eius non cludentur per diem nox enim non erit illic";
kjv[26] = "And they shall bring the glory and honour of the nations into it.";
rsv[26] = "they shall bring into it the glory and the honor of the nations.";
asv[26] = "and they shall bring the glory and the honor of the nations into it:";
yng[26] = "and they shall bring the glory and the honour of the nations into it;";
dby[26] = "And they shall bring the glory and the honour of the nations to it.";
web[26] = "And they shall bring the glory and honor of the nations into it.";
hnv[26] = "and they shall bring the glory and the honor of the nations into it so that they may enter.";
vul[26] = "et adferent gloriam et honorem gentium in illam";
kjv[27] = "And there shall in no wise enter into it any thing that defileth, neither [whatsoever] worketh abomination, or [maketh] a lie: but they which are written in the Lamb\'s book of life.";
rsv[27] = "But nothing unclean shall enter it, nor any one who practices abomination or falsehood, but only those who are written in the Lamb\'s book of life.";
asv[27] = "and there shall in no wise enter into it anything unclean, or he that maketh an abomination and a lie: but only they that are written in the Lamb\'s book of life.";
yng[27] = "and there may not at all enter into it any thing defiling and doing abomination, and a lie, but -- those written in the scroll of the life of the Lamb.";
dby[27] = "And nothing common, nor that maketh an abomination and a lie, shall at all enter into it; but those only who [are] written in the book of life of the Lamb.";
web[27] = "And there shall in no wise enter into it any thing that defileth, neither [whatever] worketh abomination, or [maketh] a lie; but they who are written in the Lamb\'s book of life.";
hnv[27] = "There will in no way enter into it anything profane, or one who causes an abomination or a lie, but only those who are written in the Lamb\'s book of life.";
vul[27] = "nec intrabit in ea aliquid coinquinatum et faciens abominationem et mendacium nisi qui scripti sunt in libro vitae agni";
