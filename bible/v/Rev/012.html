csb[1] = "A great sign appeared in heaven: a woman clothed with the sun, with the moon under her feet and a crown of twelve stars on her head.";
csb[2] = "She was pregnant and cried out in labor and agony as she was about to give birth.";
csb[3] = "Then another sign appeared in heaven: There was a great fiery red dragon having seven heads and ten horns, and on its heads were seven crowns.";
csb[4] = "Its tail swept away a third of the stars in heaven and hurled them to the earth. And the dragon stood in front of the woman who was about to give birth, so that when she did give birth it might devour her child.";
csb[5] = "She gave birth to a Son, a male who is going to rule all nations with an iron rod. Her child was caught up to God and to his throne.";
csb[6] = "The woman fled into the wilderness, where she had a place prepared by God, to be nourished there for 1,260 days.";
csb[7] = "Then war broke out in heaven: Michael and his angels fought against the dragon. The dragon and his angels also fought,";
csb[8] = "but he could not prevail, and there was no place for them in heaven any longer.";
csb[9] = "So the great dragon was thrown out -- the ancient serpent, who is called the devil and Satan, the one who deceives the whole world. He was thrown to earth, and his angels with him.";
csb[10] = "Then I heard a loud voice in heaven say, The salvation and the power and the kingdom of our God and the authority of his Christ have now come, because the accuser of our brothers and sisters, who accuses them before our God day and night, has been thrown down.";
csb[11] = "They conquered him by the blood of the Lamb and by the word of their testimony; for they did not love their lives to the point of death.";
csb[12] = "Therefore rejoice, you heavens, and you who dwell in them! Woe to the earth and the sea, because the devil has come down to you with great fury, because he knows his time is short.";
csb[13] = "When the dragon saw that he had been thrown down to the earth, he persecuted the woman who had given birth to the male child.";
csb[14] = "The woman was given two wings of a great eagle, so that she could fly from the serpent\'s presence to her place in the wilderness, where she was nourished for a time, times, and half a time.";
csb[15] = "From his mouth the serpent spewed water like a river flowing after the woman, to sweep her away with a flood.";
csb[16] = "But the earth helped the woman. The earth opened its mouth and swallowed up the river that the dragon had spewed from his mouth.";
csb[17] = "So the dragon was furious with the woman and went off to wage war against the rest of her offspring -- those who keep the commands of God and hold firmly to the testimony about Jesus.";
csb[18] = "The dragon stood on the sand of the sea.";
