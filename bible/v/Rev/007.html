csb[1] = "After this I saw four angels standing at the four corners of the earth, restraining the four winds of the earth so that no wind could blow on the earth or on the sea or on any tree.";
csb[2] = "Then I saw another angel rising up from the east, who had the seal of the living God. He cried out in a loud voice to the four angels who were allowed to harm the earth and the sea:";
csb[3] = "&quot;Don\'t harm the earth or the sea or the trees until we seal the servants of our God on their foreheads.&quot;";
csb[4] = "And I heard the number of the sealed: 144,000 sealed from every tribe of the Israelites:";
csb[5] = "12,000 sealed from the tribe of Judah, 12,000 from the tribe of Reuben, 12,000 from the tribe of Gad,";
csb[6] = "12,000 from the tribe of Asher, 12,000 from the tribe of Naphtali, 12,000 from the tribe of Manasseh,";
csb[7] = "12,000 from the tribe of Simeon, 12,000 from the tribe of Levi, 12,000 from the tribe of Issachar,";
csb[8] = "12,000 from the tribe of Zebulun, 12,000 from the tribe of Joseph, 12,000 sealed from the tribe of Benjamin.";
csb[9] = "After this I looked, and there was a vast multitude from every nation, tribe, people, and language, which no one could number, standing before the throne and before the Lamb. They were clothed in white robes with palm branches in their hands.";
csb[10] = "And they cried out in a loud voice: Salvation belongs to our God, who is seated on the throne, and to the Lamb!";
csb[11] = "All the angels stood around the throne, and along with the elders and the four living creatures they fell facedown before the throne and worshiped God,";
csb[12] = "saying, Amen! Blessing and glory and wisdom and thanksgiving and honor and power and strength be to our God forever and ever. Amen.";
csb[13] = "Then one of the elders asked me, &quot;Who are these people in white robes, and where did they come from? &quot;";
csb[14] = "I said to him, &quot;Sir, you know.&quot; Then he told me: These are the ones coming out of the great tribulation. They washed their robes and made them white in the blood of the Lamb.";
csb[15] = "For this reason they are before the throne of God, and they serve him day and night in his temple. The one seated on the throne will shelter them:";
csb[16] = "They will no longer hunger; they will no longer thirst; the sun will no longer strike them, nor will any scorching heat.";
csb[17] = "For the Lamb who is at the center of the throne will shepherd them; he will guide them to springs of the waters of life, and God will wipe away every tear from their eyes.";
