csb[1] = "Then I heard a loud voice from the temple saying to the seven angels, &quot;Go and pour out the seven bowls of God\'s wrath on the earth.&quot;";
csb[2] = "The first went and poured out his bowl on the earth, and severely painful sores broke out on the people who had the mark of the beast and who worshiped its image.";
csb[3] = "The second poured out his bowl into the sea. It turned to blood like that of a dead person, and all life in the sea died.";
csb[4] = "The third poured out his bowl into the rivers and the springs of water, and they became blood.";
csb[5] = "I heard the angel of the waters say, You are just, the Holy One, who is and who was, because you have passed judgment on these things.";
csb[6] = "Because they poured out the blood of the saints and the prophets, you have given them blood to drink; they deserve it!";
csb[7] = "I heard the altar say, Yes, Lord God, the Almighty, true and just are your judgments.";
csb[8] = "The fourth poured out his bowl on the sun. It was allowed to scorch people with fire,";
csb[9] = "and people were scorched by the intense heat. So they blasphemed the name of God, who has the power over these plagues, and they did not repent and give him glory.";
csb[10] = "The fifth poured out his bowl on the throne of the beast, and its kingdom was plunged into darkness. People gnawed their tongues because of their pain";
csb[11] = "and blasphemed the God of heaven because of their pains and their sores, but they did not repent of their works.";
csb[12] = "The sixth poured out his bowl on the great river Euphrates, and its water was dried up to prepare the way for the kings from the east.";
csb[13] = "Then I saw three unclean spirits like frogs coming from the dragon\'s mouth, from the beast\'s mouth, and from the mouth of the false prophet.";
csb[14] = "For they are demonic spirits performing signs, who travel to the kings of the whole world to assemble them for the battle on the great day of God, the Almighty.";
csb[15] = "&quot;Look, I am coming like a thief. Blessed is the one who is alert and remains clothed so that he may not go around naked and people see his shame.&quot;";
csb[16] = "So they assembled the kings at the place called in Hebrew, Armageddon.";
csb[17] = "Then the seventh poured out his bowl into the air, and a loud voice came out of the temple from the throne, saying, &quot;It is done! &quot;";
csb[18] = "There were flashes of lightning, rumblings, and peals of thunder. And a severe earthquake occurred like no other since people have been on the earth, so great was the quake.";
csb[19] = "The great city split into three parts, and the cities of the nations fell. Babylon the Great was remembered in God\'s presence; he gave her the cup filled with the wine of his fierce anger.";
csb[20] = "Every island fled, and the mountains disappeared.";
csb[21] = "Enormous hailstones, each weighing about a hundred pounds, fell from the sky on people, and they blasphemed God for the plague of hail because that plague was extremely severe.";

hnv[21] = "Great hailstones, about the weight of a talent, came down out of the sky on people. People blasphemed God because of the plague of the hail, for this plague is exceedingly severe.";
vul[21] = "et grando magna sicut talentum descendit de caelo in homines et blasphemaverunt homines Deum propter plagam grandinis quoniam magna facta est vehementer";
