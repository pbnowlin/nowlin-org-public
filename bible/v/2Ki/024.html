csb[1] = "During Jehoiakim\'s reign, King Nebuchadnezzar of Babylon attacked. Jehoiakim became his vassal for three years, and then he turned and rebelled against him.";
csb[2] = "The LORD sent Chaldean, Aramean, Moabite, and Ammonite raiders against Jehoiakim. He sent them against Judah to destroy it, according to the word of the LORD he had spoken through his servants the prophets.";
csb[3] = "Indeed, this happened to Judah at the LORD\'s command to remove them from his presence. It was because of the sins of Manasseh, according to all he had done,";
csb[4] = "and also because of all the innocent blood he had shed. He had filled Jerusalem with innocent blood, and the LORD was not willing to forgive.";
csb[5] = "The rest of the events of Jehoiakim\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[6] = "Jehoiakim rested with his fathers, and his son Jehoiachin became king in his place.";
csb[7] = "Now the king of Egypt did not march out of his land again, for the king of Babylon took everything that had belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.";
csb[8] = "Jehoiachin was eighteen years old when he became king, and he reigned three months in Jerusalem. His mother\'s name was Nehushta daughter of Elnathan; she was from Jerusalem.";
csb[9] = "He did what was evil in the LORD\'s sight just as his father had done.";
csb[10] = "At that time the servants of King Nebuchadnezzar of Babylon marched up to Jerusalem, and the city came under siege.";
csb[11] = "King Nebuchadnezzar of Babylon came to the city while his servants were besieging it.";
csb[12] = "King Jehoiachin of Judah, along with his mother, his servants, his commanders, and his officials, surrendered to the king of Babylon. So the king of Babylon took him captive in the eighth year of his reign.";
csb[13] = "He also carried off from there all the treasures of the LORD\'s temple and the treasures of the king\'s palace, and he cut into pieces all the gold articles that King Solomon of Israel had made for the LORD\'s sanctuary, just as the LORD had predicted.";
csb[14] = "He deported all Jerusalem and all the commanders and all the best soldiers -- ten thousand captives including all the craftsmen and metalsmiths. Except for the poorest people of the land, no one remained.";
csb[15] = "Nebuchadnezzar deported Jehoiachin to Babylon. He took the king\'s mother, the king\'s wives, his officials, and the leading men of the land into exile from Jerusalem to Babylon.";
csb[16] = "The king of Babylon brought captive into Babylon all seven thousand of the best soldiers and one thousand craftsmen and metalsmiths -- all strong and fit for war.";
csb[17] = "And the king of Babylon made Mattaniah, Jehoiachin\'s uncle, king in his place and changed his name to Zedekiah.";
csb[18] = "Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem. His mother\'s name was Hamutal daughter of Jeremiah; she was from Libnah.";
csb[19] = "Zedekiah did what was evil in the LORD\'s sight just as Jehoiakim had done.";
csb[20] = "Because of the LORD\'s anger, it came to the point in Jerusalem and Judah that he finally banished them from his presence. Then Zedekiah rebelled against the king of Babylon.";
kjv[1] = "In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him.";
rsv[1] = "In his days Nebuchadnez\'zar king of Babylon came up, and Jehoi\'akim became his servant three years; then he turned and rebelled against him.";
asv[1] = "In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him.";
yng[1] = "In his days hath Nebuchadnezzar king of Babylon come up, and Jehoiakim is to him a servant three years; and he turneth and rebelleth against him,";
dby[1] = "In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim was his servant three years; then he turned and rebelled against him.";
web[1] = "In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him.";
hnv[1] = "In his days Nevukhadnetztzar king of Bavel came up, and Yehoiakim became his servant three years: then he turned and rebelled against him.";
vul[1] = "in diebus eius ascendit Nabuchodonosor rex Babylonis et factus est ei Ioiachim servus tribus annis et rursum rebellavit contra eum";
kjv[2] = "And the LORD sent against him bands of the Chaldees, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of the LORD, which he spake by his servants the prophets.";
rsv[2] = "And the LORD sent against him bands of the Chalde\'ans, and bands of the Syrians, and bands of the Moabites, and bands of the Ammonites, and sent them against Judah to destroy it, according to the word of the LORD which he spoke by his servants the prophets.";
asv[2] = "And Jehovah sent against him bands of the Chaldeans, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of Jehovah, which he spake by his servants the prophets.";
yng[2] = "and Jehovah sendeth against him the troops of the Chaldeans, and the troops of Aram, and the troops of Moab, and the troops of the sons of Ammon, and He sendeth them against Judah to destroy it, according to the word of Jehovah, that He spake by the hand of His servants the prophets;";
dby[2] = "And Jehovah sent against him the bands of the Chaldeans, and the bands of the Syrians, and the bands of the Moabites, and the bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of Jehovah, which he spoke through his servants the prophets.";
web[2] = "And the LORD sent against him bands of the Chaldees, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of the LORD, which he spoke by his servants the prophets.";
hnv[2] = "The LORD sent against him bands of the Kasdim, and bands of the Aram, and bands of the Mo`avim, and bands of the children of `Ammon, and sent them against Yehudah to destroy it, according to the word of the LORD, which he spoke by his servants the prophets.";
vul[2] = "inmisitque ei Dominus latrunculos Chaldeorum et latrunculos Syriae latrunculos Moab et latrunculos filiorum Ammon et inmisit eos in Iudam ut disperderent eum iuxta verbum Domini quod locutus erat per servos suos prophetas";
kjv[3] = "Surely at the commandment of the LORD came [this] upon Judah, to remove [them] out of his sight, for the sins of Manasseh, according to all that he did;";
rsv[3] = "Surely this came upon Judah at the command of the LORD, to remove them out of his sight, for the sins of Manas\'seh, according to all that he had done,";
asv[3] = "Surely at the commandment of Jehovah came this upon Judah, to remove them out of his sight, for the sins of Manasseh, according to all that he did,";
yng[3] = "only, by the command of Jehovah it hath been against Judah to turn [them] aside from His presence, for the sins of Manasseh, according to all that he did,";
dby[3] = "Verily, at the commandment of Jehovah it came to pass against Judah, that they should be removed out of his sight, for the sins of Manasseh, according to all that he had done;";
web[3] = "Surely at the commandment of the LORD came [this] upon Judah, to remove [them] out of his sight, for the sins of Manasseh, according to all that he did;";
hnv[3] = "Surely at the mitzvah of the LORD came this on Yehudah, to remove them out of his sight, for the sins of Menashsheh, according to all that he did,";
vul[3] = "factum est autem hoc per verbum Domini contra Iudam ut auferret eum coram se propter peccata Manasse universa quae fecit";
kjv[4] = "And also for the innocent blood that he shed: for he filled Jerusalem with innocent blood; which the LORD would not pardon.";
rsv[4] = "and also for the innocent blood that he had shed; for he filled Jerusalem with innocent blood, and the LORD would not pardon.";
asv[4] = "and also for the innocent blood that he shed; for he filled Jerusalem with innocent blood: and Jehovah would not pardon.";
yng[4] = "and also the innocent blood that he hath shed, and he filleth Jerusalem with innocent blood, and Jehovah was not willing to forgive.";
dby[4] = "and also [because of] the innocent blood that he had shed; for he had filled Jerusalem with innocent blood, and Jehovah would not pardon.";
web[4] = "And also for the innocent blood that he shed: for he filled Jerusalem with innocent blood; which the LORD would not pardon.";
hnv[4] = "and also for the innocent blood that he shed; for he filled Yerushalayim with innocent blood: and the LORD would not pardon.";
vul[4] = "et propter sanguinem innoxium quem effudit et implevit Hierusalem cruore innocentium et ob hanc rem noluit Dominus propitiari";

vul[6] = "regnavitque Ioiachin filius eius pro eo";

yng[7] = "And the king of Egypt hath not added any more to go out from his own land, for the king of Babylon hath taken, from the brook of Egypt unto the river Phrat, all that had been to the king of Egypt.";
dby[7] = "And the king of Egypt came not again any more out of his land, for the king of Babylon had taken all that belonged to the king of Egypt, from the torrent of Egypt to the river Euphrates.";

hnv[10] = "At that time the servants of Nevukhadnetztzar king of Bavel came up to Yerushalayim, and the city was besieged.";
