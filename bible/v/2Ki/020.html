csb[1] = "In those days Hezekiah became terminally ill. The prophet Isaiah son of Amoz came and said to him, &quot;This is what the LORD says: \'Set your house in order, for you are about to die; you will not recover.\' &quot;";
csb[2] = "Then Hezekiah turned his face to the wall and prayed to the LORD,";
csb[3] = "&quot;Please, LORD, remember how I have walked before you faithfully and wholeheartedly and have done what pleases you.&quot; And Hezekiah wept bitterly.";
csb[4] = "Isaiah had not yet gone out of the inner courtyard when the word of the LORD came to him:";
csb[5] = "&quot;Go back and tell Hezekiah, the leader of my people, \'This is what the LORD God of your ancestor David says: I have heard your prayer; I have seen your tears. Look, I will heal you. On the third day from now you will go up to the LORD\'s temple.";
csb[6] = "&quot;I will add fifteen years to your life. I will rescue you and this city from the grasp of the king of Assyria. I will defend this city for my sake and for the sake of my servant David.\' &quot;";
csb[7] = "Then Isaiah said, &quot;Bring a lump of pressed figs.&quot; So they brought it and applied it to his infected skin, and he recovered.";
csb[8] = "Hezekiah had asked Isaiah, &quot;What is the sign that the LORD will heal me and that I will go up to the LORD\'s temple on the third day? &quot;";
csb[9] = "Isaiah said, &quot;This is the sign to you from the LORD that he will do what he has promised: Should the shadow go ahead ten steps or go back ten steps? &quot;";
csb[10] = "Then Hezekiah answered, &quot;It\'s easy for the shadow to lengthen ten steps. No, let the shadow go back ten steps.&quot;";
csb[11] = "So the prophet Isaiah called out to the LORD, and he brought the shadow back the ten steps it had descended on the stairway of Ahaz.";
csb[12] = "At that time Merodach-baladan son of Baladan, king of Babylon, sent letters and a gift to Hezekiah since he heard that he had been sick.";
csb[13] = "Hezekiah listened to the letters and showed the envoys his whole treasure house -- the silver, the gold, the spices, and the precious oil -- and his armory, and everything that was found in his treasuries. There was nothing in his palace and in all his realm that Hezekiah did not show them.";
csb[14] = "Then the prophet Isaiah came to King Hezekiah and asked him, &quot;Where did these men come from and what did they say to you? &quot; Hezekiah replied, &quot;They came from a distant country, from Babylon.&quot;";
csb[15] = "Isaiah asked, &quot;What have they seen in your palace? &quot; Hezekiah answered, &quot;They have seen everything in my palace. There isn\'t anything in my treasuries that I didn\'t show them.&quot;";
csb[16] = "Then Isaiah said to Hezekiah, &quot;Hear the word of the LORD:";
csb[17] = "&quot;\'Look, the days are coming when everything in your palace and all that your fathers have stored up until today will be carried off to Babylon; nothing will be left,\' says the LORD.";
csb[18] = "&quot;\'Some of your descendants -- who come from you, whom you father -- will be taken away, and they will become eunuchs in the palace of the king of Babylon.\' &quot;";
csb[19] = "Then Hezekiah said to Isaiah, &quot;The word of the LORD that you have spoken is good,&quot; for he thought: Why not, if there will be peace and security during my lifetime?";
csb[20] = "The rest of the events of Hezekiah\'s reign, along with all his might and how he made the pool and the tunnel and brought water into the city, are written in the Historical Record of Judah\'s Kings.";
csb[21] = "Hezekiah rested with his fathers, and his son Manasseh became king in his place.";
kjv[1] = "In those days was Hezekiah sick unto death. And the prophet Isaiah the son of Amoz came to him, and said unto him, Thus saith the LORD, Set thine house in order; for thou shalt die, and not live.";

yng[3] = "`I pray Thee, O Jehovah, remember, I pray Thee, how I have walked habitually before Thee in truth, and with a perfect heart, and that which [is] good in Thine eyes I have done;\' and Hezekiah weepeth -- a great weeping.";

dby[17] = "Behold, days come that all that is in thy house, and what thy fathers have laid up until this day, shall be carried to Babylon; nothing shall be left, saith Jehovah.";
web[17] = "Behold, the days come, that all that [is] in thy house, and that which thy fathers have laid up in store to this day, shall be carried into Babylon: nothing shall be left, saith the LORD.";
hnv[17] = "Behold, the days come, that all that is in your house, and that which your fathers have laid up in store to this day, shall be carried to Bavel: nothing shall be left, says the LORD.";
vul[17] = "ecce dies venient et auferentur omnia quae sunt in domo tua et quae condiderunt patres tui usque in diem hanc in Babylone non remanebit quicquam ait Dominus";
kjv[18] = "And of thy sons that shall issue from thee, which thou shalt beget, shall they take away; and they shall be eunuchs in the palace of the king of Babylon.";
rsv[18] = "And some of your own sons, who are born to you, shall be taken away; and they shall be eunuchs in the palace of the king of Babylon.&quot;";

yng[18] = "and of thy sons who go out from thee, whom thou begettest, they take away, and they have been eunuchs in the palace of the king of Babylon.\'";
dby[18] = "And of thy sons that shall issue from thee, whom thou shalt beget, shall they take away; and they shall be chamberlains in the palace of the king of Babylon.";
web[18] = "And of thy sons that shall issue from thee, which thou shalt beget, shall they take away; and they shall be eunuchs in the palace of the king of Babylon.";

kjv[19] = "Then said Hezekiah unto Isaiah, Good [is] the word of the LORD which thou hast spoken. And he said, [Is it] not [good], if peace and truth be in my days?";
rsv[19] = "Then said Hezeki\'ah to Isaiah, &quot;The word of the LORD which you have spoken is good.&quot; For he thought, &quot;Why not, if there will be peace and security in my days?&quot;";
asv[19] = "Then said Hezekiah unto Isaiah, Good is the word of Jehovah which thou hast spoken. He said moreover, Is it not so, if peace and truth shall be in my days?";
yng[19] = "And Hezekiah saith unto Isaiah, `Good [is] the word of Jehovah that thou hast spoken;\' and he saith, `Is it not -- if peace and truth are in my days?\'";
dby[19] = "And Hezekiah said to Isaiah, Good is the word of Jehovah which thou hast spoken. And he said, Is it not so? if only there shall be peace and truth in my days!";
web[19] = "Then said Hezekiah to Isaiah, Good [is] the word of the LORD which thou hast spoken. And he said, [Is it] not [good], if peace and truth shall be in my days?";
hnv[19] = "Then said Hizkiyahu to Yesha`yahu, Good is the word of the LORD which you have spoken. He said moreover, Isn\'t it so, if shalom and truth shall be in my days?";
vul[19] = "dixit Ezechias ad Esaiam bonus sermo Domini quem locutus est sit pax et veritas in diebus meis";
kjv[20] = "And the rest of the acts of Hezekiah, and all his might, and how he made a pool, and a conduit, and brought water into the city, [are] they not written in the book of the chronicles of the kings of Judah?";
rsv[20] = "The rest of the deeds of Hezeki\'ah, and all his might, and how he made the pool and the conduit and brought water into the city, are they not written in the Book of the Chronicles of the Kings of Judah?";
asv[20] = "Now the rest of the acts of Hezekiah, and all his might, and how he made the pool, and the conduit, and brought water into the city, are they not written in the book of the chronicles of the kings of Judah?";
yng[20] = "And the rest of the matters of Hezekiah, and all his might, and how he made the pool, and the conduit, and bringeth in the waters to the city, are they not written on the book of the Chronicles of the kings of Judah?";
dby[20] = "And the rest of the acts of Hezekiah, and all his might, and how he made the pool and the aqueduct, and brought the water into the city, are they not written in the book of the chronicles of the kings of Judah?";
web[20] = "And the rest of the acts of Hezekiah, and all his might, and how he made a pool, and a conduit, and brought water into the city, [are] they not written in the book of the chronicles of the kings of Judah?";
hnv[20] = "Now the rest of the acts of Hizkiyahu, and all his might, and how he made the pool, and the conduit, and brought water into the city, aren\'t they written in the book of the chronicles of the kings of Yehudah?";
vul[20] = "reliqua autem sermonum Ezechiae et omnis fortitudo eius et quomodo fecerit piscinam et aquaeductum et introduxerit aquas in civitatem nonne haec scripta sunt in libro sermonum dierum regum Iuda";
