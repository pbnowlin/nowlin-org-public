csb[1] = "In the third year of Israel\'s King Hoshea son of Elah, Hezekiah son of Ahaz became king of Judah.";
csb[2] = "He was twenty-five years old when he became king, and he reigned twenty-nine years in Jerusalem. His mother\'s name was Abi daughter of Zechariah.";
csb[3] = "He did what was right in the LORD\'s sight just as his ancestor David had done.";
csb[4] = "He removed the high places, shattered the sacred pillars, and cut down the Asherah poles. He broke into pieces the bronze snake that Moses made, for until then the Israelites were burning incense to it. It was called Nehushtan.";
csb[5] = "Hezekiah relied on the LORD God of Israel; not one of the kings of Judah was like him, either before him or after him.";
csb[6] = "He remained faithful to the LORD and did not turn from following him but kept the commands the LORD had commanded Moses.";
csb[7] = "The LORD was with him, and wherever he went he prospered. He rebelled against the king of Assyria and did not serve him.";
csb[8] = "He defeated the Philistines as far as Gaza and its borders, from watchtower to fortified city.";
csb[9] = "In the fourth year of King Hezekiah, which was the seventh year of Israel\'s King Hoshea son of Elah, Assyria\'s King Shalmaneser marched against Samaria and besieged it.";
csb[10] = "The Assyrians captured it at the end of three years. In the sixth year of Hezekiah, which was the ninth year of Israel\'s King Hoshea, Samaria was captured.";
csb[11] = "The king of Assyria deported the Israelites to Assyria and put them in Halah, along the Habor (Gozan\'s river), and in the cities of the Medes,";
csb[12] = "because they did not listen to the LORD their God but violated his covenant -- all he had commanded Moses the servant of the LORD. They did not listen, and they did not obey.";
csb[13] = "In the fourteenth year of King Hezekiah, Assyria\'s King Sennacherib attacked all the fortified cities of Judah and captured them.";
csb[14] = "So King Hezekiah of Judah sent word to the king of Assyria at Lachish: &quot;I have done wrong; withdraw from me. Whatever you demand from me, I will pay.&quot; The king of Assyria demanded eleven tons of silver and one ton of gold from King Hezekiah of Judah.";
csb[15] = "So Hezekiah gave him all the silver found in the LORD\'s temple and in the treasuries of the king\'s palace.";
csb[16] = "At that time Hezekiah stripped the gold from the doors of the LORD\'s sanctuary and from the doorposts he had overlaid and gave it to the king of Assyria.";
csb[17] = "Then the king of Assyria sent the field marshal, the chief of staff, and his royal spokesman, along with a massive army, from Lachish to King Hezekiah at Jerusalem. They advanced and came to Jerusalem, and they took their position by the aqueduct of the upper pool, by the road to the Launderer\'s Field.";
csb[18] = "They called for the king, but Eliakim son of Hilkiah, who was in charge of the palace, Shebnah the court secretary, and Joah son of Asaph, the court historian, came out to them.";
csb[19] = "Then the royal spokesman said to them, &quot;Tell Hezekiah this is what the great king, the king of Assyria, says: \'What are you relying on?";
csb[20] = "&quot;You think mere words are strategy and strength for war. Who are you now relying on so that you have rebelled against me?";
csb[21] = "&quot;Now look, you are relying on Egypt, that splintered reed of a staff that will pierce the hand of anyone who grabs it and leans on it. This is what Pharaoh king of Egypt is to all who rely on him.";
csb[22] = "&quot;Suppose you say to me, &quot;We rely on the LORD our God.&quot; Isn\'t he the one whose high places and altars Hezekiah has removed, saying to Judah and to Jerusalem, &quot;You must worship at this altar in Jerusalem&quot; ? \'";
csb[23] = "&quot;So now, make a bargain with my master the king of Assyria. I\'ll give you two thousand horses if you\'re able to supply riders for them!";
csb[24] = "&quot;How then can you drive back a single officer among the least of my master\'s servants? How can you rely on Egypt for chariots and for horsemen?";
csb[25] = "&quot;Now, have I attacked this place to destroy it without the LORD\'s approval? The LORD said to me, \'Attack this land and destroy it.\' &quot;";
csb[26] = "Then Eliakim son of Hilkiah, Shebnah, and Joah said to the royal spokesman, &quot;Please speak to your servants in Aramaic, since we understand it. Don\'t speak with us in Hebrew within earshot of the people on the wall.&quot;";
csb[27] = "But the royal spokesman said to them, &quot;Has my master sent me to speak these words only to your master and to you? Hasn\'t he also sent me to the men who sit on the wall, destined with you to eat their own excrement and drink their own urine? &quot;";
csb[28] = "The royal spokesman stood and called out loudly in Hebrew: &quot;Hear the word of the great king, the king of Assyria.";
csb[29] = "&quot;This is what the king says: \'Don\'t let Hezekiah deceive you; he can\'t rescue you from my power.";
csb[30] = "&quot;Don\'t let Hezekiah persuade you to rely on the LORD by saying, &quot;Certainly the LORD will rescue us! This city will not be handed over to the king of Assyria.&quot; \'";
csb[31] = "&quot;Don\'t listen to Hezekiah, for this is what the king of Assyria says: \'Make peace with me and surrender to me. Then each of you may eat from his own vine and his own fig tree, and each may drink water from his own cistern";
csb[32] = "&quot;until I come and take you away to a land like your own land -- a land of grain and new wine, a land of bread and vineyards, a land of olive trees and honey -- so that you may live and not die. But don\'t listen to Hezekiah when he misleads you, saying, &quot;The LORD will rescue us.&quot;";
csb[33] = "Has any of the gods of the nations ever rescued his land from the power of the king of Assyria?";
csb[34] = "Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim, Hena, and Ivvah? Have they rescued Samaria from my power?";
csb[35] = "Who among all the gods of the lands has rescued his land from my power? So will the LORD rescue Jerusalem from my power? \' &quot;";
csb[36] = "But the people kept silent; they did not answer him at all, for the king\'s command was, &quot;Don\'t answer him.&quot;";
csb[37] = "Then Eliakim son of Hilkiah, who was in charge of the palace, Shebna the court secretary, and Joah son of Asaph, the court historian, came to Hezekiah with their clothes torn and reported to him the words of the royal spokesman.";

hnv[15] = "Hizkiyahu gave [him] all the silver that was found in the house of the LORD, and in the treasures of the king\'s house.";
vul[15] = "deditque Ezechias omne argentum quod reppertum fuerat in domo Domini et in thesauris regis";
kjv[16] = "At that time did Hezekiah cut off [the gold from] the doors of the temple of the LORD, and [from] the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.";
rsv[16] = "At that time Hezeki\'ah stripped the gold from the doors of the temple of the LORD, and from the doorposts which Hezeki\'ah king of Judah had overlaid and gave it to the king of Assyria.";
asv[16] = "At that time did Hezekiah cut off [the gold from] the doors of the temple of Jehovah, and [from] the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.";
yng[16] = "at that time hath Hezekiah cut off the doors of the temple of Jehovah, and the pillars that Hezekiah king of Judah had overlaid, and giveth them to the king of Asshur.";
dby[16] = "At that time Hezekiah stripped the doors of the temple of Jehovah, and the posts that Hezekiah king of Judah had overlaid, and gave them to the king of Assyria.";
web[16] = "At that time did Hezekiah cut off [the gold from] the doors of the temple of the LORD, and [from] the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.";
hnv[16] = "At that time did Hizkiyahu cut off [the gold from] the doors of the temple of the LORD, and [from] the pillars which Hizkiyahu king of Yehudah had overlaid, and gave it to the king of Ashshur.";
vul[16] = "in tempore illo confregit Ezechias valvas templi Domini et lamminas auri quas ipse adfixerat et dedit eas regi Assyriorum";
kjv[17] = "And the king of Assyria sent Tartan and Rabsaris and Rabshakeh from Lachish to king Hezekiah with a great host against Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which [is] in the highway of the fuller\'s field.";
rsv[17] = "And the king of Assyria sent the Tartan, the Rab\'saris, and the Rab\'shakeh with a great army from Lachish to King Hezeki\'ah at Jerusalem. And they went up and came to Jerusalem. When they arrived, they came and stood by the conduit of the upper pool, which is on the highway to the Fuller\'s Field.";
asv[17] = "And the king of Assyria sent Tartan and Rab-saris and Rabshakeh from Lachish to king Hezekiah with a great army unto Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller\'s field.";
yng[17] = "And the king of Asshur sendeth Tartan, and the chief of the eunuchs, and the chief of the butlers, from Lachish, unto king Hezekiah, with a heavy force, to Jerusalem, and they go up and come in to Jerusalem, and they go up, and come in and stand by the conduit of the upper pool that [is] in the highway of the fuller\'s field.";
dby[17] = "And the king of Assyria sent Tartan and Rabsaris and Rab-shakeh from Lachish, with a strong force, against king Hezekiah, to Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the aqueduct of the upper pool, which is on the highway of the fuller\'s field.";
web[17] = "And the king of Assyria sent Tartan and Rab-saris and Rab-shakeh from Lachish to king Hezekiah with a great army against Jerusalem: and they went up, and came to Jerusalem: and when they had come up, they came and stood by the conduit of the upper pool, which [is] in the highway of the fuller\'s field.";
hnv[17] = "The king of Ashshur sent Tartan and Rav-Saris and Ravshakeh from Lakhish to king Hizkiyahu with a great army to Yerushalayim. They went up and came to Yerushalayim. When they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller\'s field.";
vul[17] = "misit autem rex Assyriorum Tharthan et Rabsaris et Rabsacen de Lachis ad regem Ezechiam cum manu valida Hierusalem qui cum ascendissent venerunt in Hierusalem et steterunt iuxta aquaeductum piscinae superioris quae est in via agri Fullonis";
kjv[18] = "And when they had called to the king, there came out to them Eliakim the son of Hilkiah, which [was] over the household, and Shebna the scribe, and Joah the son of Asaph the recorder.";
rsv[18] = "And when they called for the king, there came out to them Eli\'akim the son of Hilki\'ah, who was over the household, and Shebnah the secretary, and Jo\'ah the son of Asaph, the recorder.";
asv[18] = "And when they had called to the king, there came out to them Eliakim the son of Hilkiah, who was over the household, and Shebnah the scribe, and Joah the son of Asaph the recorder.";
yng[18] = "And they call unto the king, and go out unto them doth Eliakim son of Hilkiah, who [is] over the house, and Shebna the scribe, and Joah son of Asaph the remembrancer.";
dby[18] = "And they called to the king. Then came forth to them Eliakim the son of Hilkijah, who was over the household, and Shebnah the scribe, and Joah the son of Asaph, the chronicler.";
web[18] = "And when they had called to the king, there came out to them Eliakim the son of Hilkiah, who [was] over the household, and Shebna the scribe, and Joah the son of Asaph the recorder.";
hnv[18] = "When they had called to the king, there came out to them Elyakim the son of Hilkiyah, who was over the household, and Shebnah the Sofer, and Yo\'ach the son of Asaf the recorder.";
vul[18] = "vocaveruntque regem egressus est autem ad eos Eliachim filius Helciae praepositus domus et Sobna scriba et Ioahe filius Asaph a commentariis";
kjv[19] = "And Rabshakeh said unto them, Speak ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence [is] this wherein thou trustest?";
rsv[19] = "And the Rab\'shakeh said to them, &quot;Say to Hezeki\'ah, \'Thus says the great king, the king of Assyria: On what do you rest this confidence of yours?";
asv[19] = "And Rabshakeh said unto them, Say ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?";
yng[19] = "And the chief of the butlers saith unto them, `Say, I pray you, unto Hezekiah, Thus said the great king, the king of Asshur, What [is] this confidence in which thou hast confided?";
dby[19] = "And Rab-shakeh said to them, Say now to Hezekiah, Thus says the great king, the king of Assyria: What confidence is this wherein thou trustest?";
web[19] = "And Rab-shakeh said to them, Speak ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence [is] this in which thou trustest?";
hnv[19] = "Ravshakeh said to them, Say you now to Hizkiyahu, Thus says the great king, the king of Ashshur, What confidence is this in which you trust?";
vul[19] = "dixitque ad eos Rabsaces loquimini Ezechiae haec dicit rex magnus rex Assyriorum quae est ista fiducia qua niteris";
kjv[20] = "Thou sayest, (but [they are but] vain words,) [I have] counsel and strength for the war. Now on whom dost thou trust, that thou rebellest against me?";
rsv[20] = "Do you think that mere words are strategy and power for war? On whom do you now rely, that you have rebelled against me?";
asv[20] = "Thou sayest (but they are but vain words), [There is] counsel and strength for the war. Now on whom dost thou trust, that thou hast rebelled against me?";
yng[20] = "Thou hast said: Only a word of the lips! counsel and might [are] for battle; now, on whom hast thou trusted that thou hast rebelled against me?";
dby[20] = "Thou sayest -- but it is a word of the lips -- There is counsel and strength for war. Now on whom dost thou rely, that thou hast revolted against me?";
web[20] = "Thou sayest, but [they are but] vain words, I [have] counsel and strength for the war. Now in whom dost thou trust, that thou rebellest against me?";
hnv[20] = "You say (but they are but vain words), [There is] counsel and strength for the war. Now on whom do you trust, that you have rebelled against me?";
vul[20] = "forsitan inisti consilium ut praepares te ad proelium in quo confidis ut audeas rebellare";
kjv[21] = "Now, behold, thou trustest upon the staff of this bruised reed, [even] upon Egypt, on which if a man lean, it will go into his hand, and pierce it: so [is] Pharaoh king of Egypt unto all that trust on him.";
rsv[21] = "Behold, you are relying now on Egypt, that broken reed of a staff, which will pierce the hand of any man who leans on it. Such is Pharaoh king of Egypt to all who rely on him.";
asv[21] = "Now, behold, thou trustest upon the staff of this bruised reed, even upon Egypt; whereon if a man lean, it will go into his hand, and pierce it: so is Pharaoh king of Egypt unto all that trust on him.";
yng[21] = "`Now, lo, thou hast trusted for thee on the staff of this broken reed, on Egypt; which a man leaneth on, and it hath gone into his hand, and pierced it! -- so [is] Pharaoh king of Egypt to all those trusting on him.";
dby[21] = "Now behold, thou reliest upon the staff of that broken reed, upon Egypt, on which if a man lean, it goes into his hand and pierces it: so is Pharaoh king of Egypt to all that rely upon him.";
web[21] = "Now behold, thou trustest upon the staff of this bruised reed, [even] upon Egypt, on which if a man leaneth, it will go into his hand, and pierce it: so [is] Pharaoh king of Egypt to all that trust on him.";
hnv[21] = "Now, behold, you trust on the staff of this bruised reed, even on Mitzrayim; whereon if a man lean, it will go into his hand, and pierce it: so is Par`oh king of Mitzrayim to all who trust on him.";
vul[21] = "an speras in baculo harundineo atque confracto Aegypto super quem si incubuerit homo comminutus ingreditur manum eius et perforabit eam sic est Pharao rex Aegypti omnibus qui confidunt in se";
kjv[22] = "But if ye say unto me, We trust in the LORD our God: [is] not that he, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and Jerusalem, Ye shall worship before this altar in Jerusalem?";
rsv[22] = "But if you say to me, &quot;We rely on the LORD our God,&quot; is it not he whose high places and altars Hezeki\'ah has removed, saying to Judah and to Jerusalem, &quot;You shall worship before this altar in Jerusalem&quot;?";
asv[22] = "But if ye say unto me, We trust in Jehovah our God; is not that he, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and to Jerusalem, Ye shall worship before this altar in Jerusalem?";
yng[22] = "`And when ye say unto me, Unto Jehovah our God we have trusted, is it not He whose high places and whose altars Hezekiah hath turned aside, and saith to Judah and to Jerusalem, Before this altar do ye bow yourselves in Jerusalem?";
dby[22] = "And if ye say to me, We rely upon Jehovah our God: is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and Jerusalem, Ye shall worship before this altar in Jerusalem?";
web[22] = "But if ye say to me, We trust in the LORD our God: [is] not that he whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and Jerusalem, Ye shall worship before this altar in Jerusalem?";
hnv[22] = "But if you tell me, We trust in the LORD our God; isn\'t that he whose high places and whose altars Hizkiyahu has taken away, and has said to Yehudah and to Yerushalayim, You shall worship before this altar in Yerushalayim?";
vul[22] = "quod si dixeritis mihi in Domino Deo nostro habemus fiduciam nonne iste est cuius abstulit Ezechias excelsa et altaria et praecepit Iudae et Hierusalem ante altare hoc adorabitis in Hierusalem";
kjv[23] = "Now therefore, I pray thee, give pledges to my lord the king of Assyria, and I will deliver thee two thousand horses, if thou be able on thy part to set riders upon them.";
rsv[23] = "Come now, make a wager with my master the king of Assyria: I will give you two thousand horses, if you are able on your part to set riders upon them.";
asv[23] = "Now therefore, I pray thee, give pledges to my master the king of Assyria, and I will give thee two thousand horses, if thou be able on thy part to set riders upon them.";
yng[23] = "`And, now, give a pledge for thee, I pray thee, to my lord the king of Asshur, and I give to thee two thousand horses, if thou art able to give for thee riders on them.";
dby[23] = "And now, engage, I pray thee, with my master the king of Assyria, and I will give thee two thousand horses, if thou canst set the riders upon them.";
web[23] = "Now therefore, I pray thee, give pledges to my lord the king of Assyria, and I will deliver thee two thousand horses, if thou shalt be able on thy part to set riders upon them.";
hnv[23] = "Now therefore, Please give pledges to my master the king of Ashshur, and I will give you two thousand horses, if you are able on your part to set riders on them.";
vul[23] = "nunc igitur transite ad dominum meum regem Assyriorum et dabo vobis duo milia equorum et videte an habere valeatis ascensores eorum";
kjv[24] = "How then wilt thou turn away the face of one captain of the least of my master\'s servants, and put thy trust on Egypt for chariots and for horsemen?";
rsv[24] = "How then can you repulse a single captain among the least of my master\'s servants, when you rely on Egypt for chariots and for horsemen?";
asv[24] = "How then canst thou turn away the face of one captain of the least of my master\'s servants, and put thy trust on Egypt for chariots and for horsemen?";
yng[24] = "And how dost thou turn back the face of one captain of the least of the servants of my lord, that thou dost trust for thee on Egypt for chariot, and for horsemen?";
dby[24] = "How then wilt thou turn away the face of one captain of the least of my master\'s servants? And thou reliest upon Egypt for chariots and for horsemen!";
web[24] = "How then wilt thou turn away the face of one captain of the least of my master\'s servants, and put thy trust on Egypt for chariots and for horsemen?";
hnv[24] = "How then can you turn away the face of one captain of the least of my master\'s servants, and put your trust on Mitzrayim for chariots and for horsemen?";
vul[24] = "et quomodo potestis resistere ante unum satrapam de servis domini mei minimis an fiduciam habes in Aegypto propter currus et equites";
kjv[25] = "Am I now come up without the LORD against this place to destroy it? The LORD said to me, Go up against this land, and destroy it.";
rsv[25] = "Moreover, is it without the LORD that I have come up against this place to destroy it? The LORD said to me, Go up against this land, and destroy it.\'&quot;";
asv[25] = "Am I now come up without Jehovah against this place to destroy it? Jehovah said unto me, Go up against this land, and destroy it.";
yng[25] = "Now, without Jehovah have I come up against this place to destroy it? Jehovah said unto me, Go up against this land, and thou hast destroyed it.\'";
dby[25] = "Am I now come up without Jehovah against this place to destroy it? Jehovah said to me, Go up against this land and destroy it.";
web[25] = "Have I now come up without the LORD against this place to destroy it? The LORD said to me, Go up against this land, and destroy it.";
hnv[25] = "Am I now come up without the LORD against this place to destroy it? the LORD said to me, Go up against this land, and destroy it.";
vul[25] = "numquid sine Domini voluntate ascendi ad locum istum ut demolirer eum Dominus dixit mihi ascende ad terram hanc et demolire eam";
kjv[26] = "Then said Eliakim the son of Hilkiah, and Shebna, and Joah, unto Rabshakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand [it]: and talk not with us in the Jews\' language in the ears of the people that [are] on the wall.";
rsv[26] = "Then Eli\'akim the son of Hilki\'ah, and Shebnah, and Jo\'ah, said to the Rab\'shakeh, &quot;Pray, speak to your servants in the Aramaic language, for we understand it; do not speak to us in the language of Judah within the hearing of the people who are on the wall.&quot;";
asv[26] = "Then said Eliakim the son of Hilkiah, and Shebnah, and Joah, unto Rabshakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand it: and speak not with us in the Jews\' language, in the ears of the people that are on the wall.";
yng[26] = "And Eliakim son of Hilkiah saith -- and Shebna, and Joah -- to the chief of the butlers, `Speak, we pray thee, unto thy servants [in] Aramaean, for we are understanding, and do not speak with us [in] Jewish, in the ears of the people who [are] on the wall.\'";
dby[26] = "And Eliakim the son of Hilkijah, and Shebnah and Joah said to Rab-shakeh, Speak, we pray thee, to thy servants in Syriac, for we understand it, and talk not with us in the Jewish [language] in the ears of the people that are on the wall.";
web[26] = "Then said Eliakim the son of Hilkiah, and Shebna and Joah, to Rab-shakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand [it]: and talk not with us in the Jews language in the ears of the people that [are] on the wall.";
hnv[26] = "Then said Elyakim the son of Hilkiyah, and Shebnah, and Yo\'ach, to Ravshakeh, Please speak to your servants in the Arammian language; for we understand it: and don\'t speak with us in the Yehudim\' language, in the ears of the people who are on the wall.";
vul[26] = "dixerunt autem Eliachim filius Helciae et Sobna et Ioahe Rabsaci precamur ut loquaris nobis servis tuis syriace siquidem intellegimus hanc linguam et non loquaris nobis iudaice audiente populo qui est super murum";
kjv[27] = "But Rabshakeh said unto them, Hath my master sent me to thy master, and to thee, to speak these words? [hath he] not [sent me] to the men which sit on the wall, that they may eat their own dung, and drink their own piss with you?";
rsv[27] = "But the Rab\'shakeh said to them, &quot;Has my master sent me to speak these words to your master and to you, and not to the men sitting on the wall, who are doomed with you to eat their own dung and to drink their own urine?&quot;";
asv[27] = "But Rabshakeh said unto them, Hath my master sent me to thy master, and to thee, to speak these words? [hath he] not [sent me] to the men that sit on the wall, to eat their own dung, and to drink their own water with you?";
yng[27] = "And the chief of the butlers saith unto them, `For thy lord, and unto thee, hath my lord sent me to speak these words? is it not for the men, those sitting on the wall to eat their own dung and to drink their own water, with you?\'";
dby[27] = "And Rab-shakeh said to them, Is it to thy master and to thee that my master sent me to speak these words? Is it not to the men that sit on the wall, that they may eat their own dung and drink their own urine with you?";
web[27] = "But Rab-shakeh said to them, Hath my master sent me to thy master, and to thee, to speak these words? [hath he] not [sent me] to the men who sit on the wall, that they may feed on their vilest excretions with you?";
hnv[27] = "But Ravshakeh said to them, Has my master sent me to your master, and to you, to speak these words? Hasn\'t he sent me to the men who sit on the wall, to eat their own dung, and to drink their own water with you?";
vul[27] = "responditque eis Rabsaces numquid ad dominum tuum et ad te misit me dominus meus ut loquerer sermones hos et non ad viros qui sedent super murum ut comedant stercora sua et bibant urinam suam vobiscum";
kjv[28] = "Then Rabshakeh stood and cried with a loud voice in the Jews\' language, and spake, saying, Hear the word of the great king, the king of Assyria:";
rsv[28] = "Then the Rab\'shakeh stood and called out in a loud voice in the language of Judah: &quot;Hear the word of the great king, the king of Assyria!";
asv[28] = "Then Rabshakeh stood, and cried with a loud voice in the Jews\' language, and spake, saying, Hear ye the word of the great king, the king of Assyria.";
yng[28] = "And the chief of the butlers standeth and calleth with a great voice [in] Jewish, and speaketh and saith, `Hear ye a word of the great king, the king of Asshur:";
dby[28] = "And Rab-shakeh stood and cried with a loud voice in the Jewish [language], and spoke and said, Hear the word of the great king, the king of Assyria!";
web[28] = "Then Rab-shakeh stood and cried with a loud voice in the Jews language, and spoke, saying, Hear the word of the great king, the king of Assyria:";
hnv[28] = "Then Ravshakeh stood, and cried with a loud voice in the Yehudim\' language, and spoke, saying, Hear you the word of the great king, the king of Ashshur.";
vul[28] = "stetit itaque Rabsaces et clamavit voce magna iudaice et ait audite verba regis magni regis Assyriorum";
kjv[29] = "Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you out of his hand:";
rsv[29] = "Thus says the king: \'Do not let Hezeki\'ah deceive you, for he will not be able to deliver you out of my hand.";
asv[29] = "Thus saith the king, Let not Hezekiah deceive you; for he will not be able to deliver you out of his hand:";
yng[29] = "thus said the king, Let not Hezekiah lift you up, for he is not able to deliver you out of his hand;";
dby[29] = "Thus says the king: Let not Hezekiah deceive you; for he will not be able to deliver you out of the [king\'s] hand.";
web[29] = "Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you out of his hand:";
hnv[29] = "Thus says the king, Don\'t let Hizkiyahu deceive you; for he will not be able to deliver you out of his hand:";
vul[29] = "haec dicit rex non vos seducat Ezechias non enim poterit eruere vos de manu mea";
kjv[30] = "Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us, and this city shall not be delivered into the hand of the king of Assyria.";
rsv[30] = "Do not let Hezeki\'ah make you to rely on the LORD by saying, The LORD will surely deliver us, and this city will not be given into the hand of the king of Assyria.\'";
asv[30] = "neither let Hezekiah make you trust in Jehovah, saying, Jehovah will surely deliver us, and this city shall not be given into the hand of the king of Assyria.";
yng[30] = "and let not Hezekiah make you trust unto Jehovah, saying, Jehovah doth certainly deliver us, and this city is not given into the hand of the king of Asshur.";
dby[30] = "Neither let Hezekiah make you rely upon Jehovah, saying, Jehovah will certainly deliver us, and this city shall not be given into the hand of the king of Assyria.";
web[30] = "Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us, and this city shall not be delivered into the hand of the king of Assyria.";
hnv[30] = "neither let Hizkiyahu make you trust in the LORD, saying, the LORD will surely deliver us, and this city shall not be given into the hand of the king of Ashshur.";
vul[30] = "neque fiduciam vobis tribuat super Domino dicens eruens liberabit nos Dominus et non tradetur civitas haec in manu regis Assyriorum";
kjv[31] = "Hearken not to Hezekiah: for thus saith the king of Assyria, Make [an agreement] with me by a present, and come out to me, and [then] eat ye every man of his own vine, and every one of his fig tree, and drink ye every one the waters of his cistern:";
rsv[31] = "Do not listen to Hezeki\'ah; for thus says the king of Assyria: \'Make your peace with me and come out to me; then every one of you will eat of his own vine, and every one of his own fig tree, and every one of you will drink the water of his own cistern;";
asv[31] = "Hearken not to Hezekiah: for thus saith the king of Assyria, Make your peace with me, and come out to me; and eat ye every one of his vine, and every one of his fig-tree, and drink ye every one the waters of his own cistern;";
yng[31] = "`Do not hearken unto Hezekiah, for thus said the king of Asshur, Make with me a blessing, and come out unto me, and eat ye each of his vine, and each of his fig-tree, and drink ye each the waters of his own well,";
dby[31] = "Hearken not to Hezekiah; for thus says the king of Assyria: Make peace with me, and come out to me; and eat every one of his vine and every one of his fig-tree, and drink every one the waters of his own cistern;";
web[31] = "Hearken not to Hezekiah: for thus saith the king of Assyria, Make [an agreement] with me by a present, and come out to me, and [then] eat ye every man of his own vine, and every one of his fig-tree, and drink ye every one the waters of his cistern:";
hnv[31] = " Don\'t listen to Hizkiyahu: for thus says the king of Ashshur, Make your shalom with me, and come out to me; and eat you everyone of his vine, and everyone of his fig tree, and everyone drink the waters of his own cistern;";
vul[31] = "nolite audire Ezechiam haec enim dicit rex Assyriorum facite mecum quod vobis est utile et egredimini ad me et comedet unusquisque de vinea sua et de ficu sua et bibetis aquas de cisternis vestris";
kjv[32] = "Until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of oil olive and of honey, that ye may live, and not die: and hearken not unto Hezekiah, when he persuadeth you, saying, The LORD will deliver us.";
rsv[32] = "until I come and take you away to a land like your own land, a land of grain and wine, a land of bread and vineyards, a land of olive trees and honey, that you may live, and not die. And do not listen to Hezeki\'ah when he misleads you by saying, The LORD will deliver us.";
asv[32] = "Until I come and take you away to a land like your own land, a land of grain and new wine, a land of bread and vineyards, a land of olive-trees and of honey, that ye may live, and not die: and hearken not unto Hezekiah, when he persuadeth you, saying, Jehovah will deliver us.";
yng[32] = "till my coming in, and I have taken you unto a land like your own land, a land of corn and new wine, a land of bread and vineyards, a land of oil olive, and honey, and live, and die not; and do not hearken unto Hezekiah, when he persuadeth you, saying, Jehovah doth deliver us.";
dby[32] = "until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of olive-trees and of honey, that ye may live and not die; and hearken not to Hezekiah, when he persuades you, saying, Jehovah will deliver us.";
web[32] = "Until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of olive-oil and of honey, that ye may live, and not die: and hearken not to Hezekiah, when he persuadeth you, saying, The LORD will deliver us.";
