csb[1] = "In the second year of Israel\'s King Jehoash son of Jehoahaz, Amaziah son of Joash became king of Judah.";
csb[2] = "He was twenty-five years old when he became king, and he reigned twenty-nine years in Jerusalem. His mother\'s name was Jehoaddan; she was from Jerusalem.";
csb[3] = "He did what was right in the LORD\'s sight, but not like his ancestor David. He did everything his father Joash had done.";
csb[4] = "Yet the high places were not taken away, and the people continued sacrificing and burning incense on the high places.";
csb[5] = "As soon as the kingdom was firmly in his grasp, Amaziah killed his servants who had killed his father the king.";
csb[6] = "However, he did not put the children of the killers to death, as it is written in the book of the law of Moses where the LORD commanded, &quot;Fathers are not be put to death because of children, and children are not be put to death because of fathers; instead, each one will be put to death for his own sin.&quot;";
csb[7] = "Amaziah killed ten thousand Edomites in Salt Valley. He took Sela in battle and called it Joktheel, which is still its name today.";
csb[8] = "Amaziah then sent messengers to Jehoash son of Jehoahaz, son of Jehu, king of Israel, and challenged him: &quot;Come, let\'s meet face to face.&quot;";
csb[9] = "King Jehoash of Israel sent word to King Amaziah of Judah, saying, &quot;The thistle in Lebanon once sent a message to the cedar in Lebanon, saying, \'Give your daughter to my son as a wife.\' Then a wild animal in Lebanon passed by and trampled the thistle.";
csb[10] = "&quot;You have indeed defeated Edom, and you have become overconfident. Enjoy your glory and stay at home. Why should you stir up such trouble that you fall -- you and Judah with you? &quot;";
csb[11] = "But Amaziah would not listen, so King Jehoash of Israel advanced. He and King Amaziah of Judah met face to face at Beth-shemesh that belonged to Judah.";
csb[12] = "Judah was routed before Israel, and each man fled to his own tent.";
csb[13] = "King Jehoash of Israel captured Judah\'s King Amaziah son of Joash, son of Ahaziah, at Beth-shemesh. Then Jehoash went to Jerusalem and broke down two hundred yards of Jerusalem\'s wall from the Ephraim Gate to the Corner Gate.";
csb[14] = "He took all the gold and silver, all the articles found in the LORD\'s temple and in the treasuries of the king\'s palace, and some hostages. Then he returned to Samaria.";
csb[15] = "The rest of the events of Jehoash\'s reign, along with his accomplishments, his might, and how he waged war against King Amaziah of Judah, are written in the Historical Record of Israel\'s Kings.";
csb[16] = "Jehoash rested with his fathers, and he was buried in Samaria with the kings of Israel. His son Jeroboam became king in his place.";
csb[17] = "Judah\'s King Amaziah son of Joash lived fifteen years after the death of Israel\'s King Jehoash son of Jehoahaz.";
csb[18] = "The rest of the events of Amaziah\'s reign are written in the Historical Record of Judah\'s Kings.";
csb[19] = "A conspiracy was formed against him in Jerusalem, and he fled to Lachish. However, men were sent after him to Lachish, and they put him to death there.";
csb[20] = "They carried him back on horses, and he was buried in Jerusalem with his fathers in the city of David.";
csb[21] = "Then all the people of Judah took Azariah, who was sixteen years old, and made him king in place of his father Amaziah.";
csb[22] = "After Amaziah the king rested with his fathers, Azariah rebuilt Elath and restored it to Judah.";
csb[23] = "In the fifteenth year of Judah\'s King Amaziah son of Joash, Jeroboam son of Jehoash became king of Israel in Samaria, and he reigned forty-one years.";
csb[24] = "He did what was evil in the LORD\'s sight. He did not turn away from all the sins Jeroboam son of Nebat had caused Israel to commit.";
csb[25] = "He restored Israel\'s border from Lebo-hamath as far as the Sea of the Arabah, according to the word the LORD, the God of Israel, had spoken through his servant, the prophet Jonah son of Amittai from Gath-hepher.";
csb[26] = "For the LORD saw that the affliction of Israel was very bitter for both slaves and free people. There was no one to help Israel.";
csb[27] = "The LORD had not said he would blot out the name of Israel under heaven, so he delivered them by the hand of Jeroboam son of Jehoash.";
csb[28] = "The rest of the events of Jeroboam\'s reign -- along with all his accomplishments, the power he had to wage war, and how he recovered for Israel Damascus and Hamath, which had belonged to Judah -- are written in the Historical Record of Israel\'s Kings.";
csb[29] = "Jeroboam rested with his fathers, the kings of Israel. His son Zechariah became king in his place.";
kjv[1] = "In the second year of Joash son of Jehoahaz king of Israel reigned Amaziah the son of Joash king of Judah.";

asv[1] = "In the second year of Joash son of Joahaz king of Israel began Amaziah the son of Joash king of Judah to reign.";
yng[1] = "In the second year of Joash son of Jehoahaz king of Israel reigned hath Amaziah son of Joash king of Judah;";
dby[1] = "In the second year of Joash son of Jehoahaz, king of Israel, began Amaziah the son of Joash, king of Judah, to reign.";
web[1] = "In the second year of Joash son of Jehoahaz king of Israel, reigned Amaziah the son of Joash king of Judah.";
hnv[1] = "In the second year of Yo\'ash son of Yo\'achaz king of Yisra\'el began Amatzyah the son of Yo\'ash king of Yehudah to reign.";

kjv[2] = "He was twenty and five years old when he began to reign, and reigned twenty and nine years in Jerusalem. And his mother\'s name [was] Jehoaddan of Jerusalem.";
rsv[2] = "He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother\'s name was Jeho-ad\'din of Jerusalem.";
asv[2] = "He was twenty and five years old when he began to reign; and he reigned twenty and nine years in Jerusalem: and his mother\'s name was Jehoaddin of Jerusalem.";
yng[2] = "a son of twenty and five years was he in his reigning, and twenty and nine years he hath reigned in Jerusalem, and the name of his mother [is] Jehoaddan of Jerusalem,";
dby[2] = "He was twenty-five years old when he began to reign; and he reigned twenty-nine years in Jerusalem; and his mother\'s name was Jehoaddan of Jerusalem.";
web[2] = "He was twenty and five years old when he began to reign, and [he] reigned twenty and nine years in Jerusalem. And his mother\'s name [was] Jehoaddan of Jerusalem.";
hnv[2] = "He was twenty-five years old when he began to reign; and he reigned twenty-nine years in Yerushalayim: and his mother\'s name was Yeho`addan of Yerushalayim.";
vul[2] = "viginti quinque annorum erat cum regnare coepisset viginti autem et novem annis regnavit in Hierusalem nomen matris eius Ioaden de Hierusalem";

rsv[3] = "And he did what was right in the eyes of the LORD, yet not like David his father; he did in all things as Jo\'ash his father had done.";
asv[3] = "And he did that which was right in the eyes of Jehovah, yet not like David his father: he did according to all that Joash his father had done.";
yng[3] = "and he doth that which [is] right in the eyes of Jehovah, only not like David his father, according to all that Joash his father did he hath done,";
dby[3] = "And he did what was right in the sight of Jehovah, yet not like David his father: he did according to all that Joash his father had done.";
web[3] = "And he did [that which was] right in the sight of the LORD, yet not like David his father: he did according to all things as Joash his father did.";
hnv[3] = "He did that which was right in the eyes of the LORD, yet not like David his father: he did according to all that Yo\'ash his father had done.";

rsv[4] = "But the high places were not removed; the people still sacrificed and burned incense on the high places.";
asv[4] = "Howbeit the high places were not taken away: the people still sacrificed and burnt incense in the high places.";
yng[4] = "only, the high places have not turned aside -- yet are the people sacrificing and making perfume in high places.";
dby[4] = "Only, the high places were not removed: the people still sacrificed and burned incense on the high places.";
web[4] = "But, the high places were not taken away: as yet the people sacrificed, and burnt incense on the high places.";
hnv[4] = "However the high places were not taken away: the people still sacrificed and burnt incense in the high places.";

kjv[5] = "And it came to pass, as soon as the kingdom was confirmed in his hand, that he slew his servants which had slain the king his father.";
rsv[5] = "And as soon as the royal power was firmly in his hand he killed his servants who had slain the king his father.";
asv[5] = "And it came to pass, as soon as the kingdom was established in his hand, that he slew his servants who had slain the king his father:";
yng[5] = "And it cometh to pass, when the kingdom hath been strong in his hand, that he smiteth his servants, those smiting the king his father,";
dby[5] = "And it came to pass when the kingdom was established in his hand, that he slew his servants who had smitten the king his father.";
web[5] = "And it came to pass, as soon as the kingdom was confirmed in his hand, that he slew his servants who had slain the king his father.";
hnv[5] = "It happened, as soon as the kingdom was established in his hand, that he killed his servants who had slain the king his father:";
vul[5] = "cumque obtinuisset regnum percussit servos suos qui interfecerant regem patrem suum";
kjv[6] = "But the children of the murderers he slew not: according unto that which is written in the book of the law of Moses, wherein the LORD commanded, saying, The fathers shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall be put to death for his own sin.";
rsv[6] = "But he did not put to death the children of the murderers; according to what is written in the book of the law of Moses, where the LORD commanded, &quot;The fathers shall not be put to death for the children, or the children be put to death for the fathers; but every man shall die for his own sin.&quot;";
asv[6] = "but the children of the murderers he put not to death; according to that which is written in the book of the law of Moses, as Jehovah commanded, saying, The fathers shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall die for his own sin.";
yng[6] = "and the sons of those smiting [him] he hath not put to death, as it is written in the book of the law of Moses that Jehovah commanded, saying, `Fathers are not put to death for sons, and sons are not put to death for fathers, but each for his own sin is put to death.\'";
dby[6] = "But the children of those that smote [him] he did not put to death; according to that which is written in the book of the law of Moses, wherein Jehovah commanded saying, The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers; but every man shall be put to death for his own sin.";
web[6] = "But the children of the murderers he slew not: according to that which is written in the book of the law of Moses, in which the LORD commanded, saying, The fathers shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall be put to death for his own sin.";
hnv[6] = "but the children of the murderers he didn\'t put to death; according to that which is written in the book of the law of Moshe, as the LORD commanded, saying, The fathers shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall die for his own sin.";
vul[6] = "filios autem eorum qui occiderant non occidit iuxta quod scriptum est in libro legis Mosi sicut praecepit Dominus dicens non morientur patres pro filiis neque filii morientur pro patribus sed unusquisque in peccato suo morietur";
kjv[7] = "He slew of Edom in the valley of salt ten thousand, and took Selah by war, and called the name of it Joktheel unto this day.";
rsv[7] = "He killed ten thousand E\'domites in the Valley of Salt and took Sela by storm, and called it Jok\'the-el, which is its name to this day.";
asv[7] = "He slew of Edom in the Valley of Salt ten thousand, and took Sela by war, and called the name of it Joktheel, unto this day.";
yng[7] = "He hath smitten Edom, in the valley of salt -- ten thousand, and seized Selah in war, and [one] calleth its name Joktheel unto this day,";
dby[7] = "He smote of Edom in the valley of salt ten thousand, and took Sela in the war, and called the name of it Joktheel to this day.";

kjv[9] = "And Jehoash the king of Israel sent to Amaziah king of Judah, saying, The thistle that [was] in Lebanon sent to the cedar that [was] in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that [was] in Lebanon, and trode down the thistle.";
rsv[9] = "And Jeho\'ash king of Israel sent word to Amazi\'ah king of Judah, &quot;A thistle on Lebanon sent to a cedar on Lebanon, saying, \'Give your daughter to my son for a wife\'; and a wild beast of Lebanon passed by and trampled down the thistle.";
asv[9] = "And Jehoash the king of Israel sent to Amaziah king of Judah, saying, The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that was in Lebanon, and trod down the thistle.";
yng[9] = "And Jehoash king of Israel sendeth unto Amaziah king of Judah, saying, `The thorn that [is] in Lebanon hath sent unto the cedar that [is] in Lebanon, saying, Give thy daughter to my son for a wife; and pass by doth a beast of the field that [is] in Lebanon, and treadeth down the thorn.";
dby[9] = "And Jehoash king of Israel sent to Amaziah king of Judah, saying, The thorn-bush that is in Lebanon sent to the cedar that is in Lebanon, saying, Give thy daughter to my son as wife; and there passed by the wild beast that is in Lebanon, and trode down the thorn-bush.";
web[9] = "And Jehoash the king of Israel sent to Amaziah king of Judah, saying, The thistle that [was] in Lebanon sent to the cedar that [was] in Lebanon, saying, Give thy daughter to my son for a wife: and there passed by a wild beast that [was] in Lebanon, and trod down the thistle.";
hnv[9] = " Yeho\'ash the king of Yisra\'el sent to Amatzyah king of Yehudah, saying, The thistle that was in Levanon sent to the cedar that was in Levanon, saying, Give your daughter to my son as wife: and there passed by a wild animal that was in Levanon, and trod down the thistle.";
vul[9] = "remisitque Ioas rex Israhel ad Amasiam regem Iuda dicens carduus Libani misit ad cedrum quae est in Libano dicens da filiam tuam filio meo uxorem transieruntque bestiae saltus quae sunt in Libano et conculcaverunt carduum";
kjv[10] = "Thou hast indeed smitten Edom, and thine heart hath lifted thee up: glory [of this], and tarry at home: for why shouldest thou meddle to [thy] hurt, that thou shouldest fall, [even] thou, and Judah with thee?";
rsv[10] = "You have indeed smitten Edom, and your heart has lifted you up. Be content with your glory, and stay at home; for why should you provoke trouble so that you fall, you and Judah with you?&quot;";
asv[10] = "Thou hast indeed smitten Edom, and thy heart hath lifted thee up: glory thereof, and abide at home; for why shouldest thou meddle to [thy] hurt, that thou shouldest fall, even thou, and Judah with thee?";
yng[10] = "Thou hast certainly smitten Edom, and thy heart hath lifted thee up; be honoured, and abide in thy house; and why dost thou stir thyself up in evil, that thou hast fallen, thou, and Judah with thee?\'";
dby[10] = "Thou hast indeed smitten Edom, and thy heart has lifted thee up: boast thyself, and abide at home; for why shouldest thou contend with misfortune, that thou shouldest fall, thou, and Judah with thee?";
web[10] = "Thou hast indeed smitten Edom, and thy heart hath lifted thee up: glory [of this], and tarry at home: for why shouldst thou meddle to [thy] hurt, that thou shouldst fall, [even] thou, and Judah with thee?";
hnv[10] = "You have indeed struck Edom, and your heart has lifted you up: glory of it, and abide at home; for why should you meddle to [your] hurt, that you should fall, even you, and Yehudah with you?";
vul[10] = "percutiens invaluisti super Edom et sublevavit te cor tuum contentus esto gloria et sede in domo tua quare provocas malum ut cadas tu et Iuda tecum";

yng[11] = "And Amaziah hath not hearkened, and go up doth Jehoash king of Israel, and they look one another in the face, he and Amaziah king of Judah, in Beth-Shemesh, that [is] Judah\'s,";
dby[11] = "But Amaziah would not hear. And Jehoash king of Israel went up; and they looked one another in the face, he and Amaziah king of Judah, at Beth-shemesh, which is in Judah.";

kjv[13] = "And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash the son of Ahaziah, at Bethshemesh, and came to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits.";
rsv[13] = "And Jeho\'ash king of Israel captured Amazi\'ah king of Judah, the son of Jeho\'ash, son of Ahazi\'ah, at Beth-she\'mesh, and came to Jerusalem, and broke down the wall of Jerusalem for four hundred cubits, from the E\'phraim Gate to the Corner Gate.";
asv[13] = "And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash the son of Ahaziah, at Beth-shemesh, and came to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits.";
yng[13] = "And Amaziah king of Judah, son of Jehoash son of Ahaziah, caught hath Jehoash king of Israel in Beth-Shemesh, and they come in to Jerusalem, and he bursteth through the wall of Jerusalem, at the gate of Ephraim unto the gate of the corner, four hundred cubits,";
dby[13] = "And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash son of Ahaziah, at Beth-shemesh, and came to Jerusalem, and broke down the wall of Jerusalem from the gate of Ephraim to the corner-gate, four hundred cubits.";
web[13] = "And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash the son of Ahaziah, at Beth-shemesh, and came to Jerusalem, and broke down the wall of Jerusalem from the gate of Ephraim to the corner gate, four hundred cubits.";
hnv[13] = "Yeho\'ash king of Yisra\'el took Amatzyah king of Yehudah, the son of Yeho\'ash the son of Achazyah, at Beth-shemesh, and came to Yerushalayim, and broke down the wall of Yerushalayim from the gate of Efrayim to the corner gate, four hundred cubits.";
vul[13] = "Amasiam vero regem Iuda filium Ioas filii Ahaziae cepit Ioas rex Israhel in Bethsames et adduxit eum in Hierusalem et interrupit murum Hierusalem a porta Ephraim usque ad portam Anguli quadringentis cubitis";
kjv[14] = "And he took all the gold and silver, and all the vessels that were found in the house of the LORD, and in the treasures of the king\'s house, and hostages, and returned to Samaria.";
rsv[14] = "And he seized all the gold and silver, and all the vessels that were found in the house of the LORD and in the treasuries of the king\'s house, also hostages, and he returned to Sama\'ria.";

kjv[15] = "Now the rest of the acts of Jehoash which he did, and his might, and how he fought with Amaziah king of Judah, [are] they not written in the book of the chronicles of the kings of Israel?";
rsv[15] = "Now the rest of the acts of Jeho\'ash which he did, and his might, and how he fought with Amazi\'ah king of Judah, are they not written in the Book of the Chronicles of the Kings of Israel?";
asv[15] = "Now the rest of the acts of Jehoash which he did, and his might, and how he fought with Amaziah king of Judah, are they not written in the book of the chronicles of the kings of Israel?";
yng[15] = "And the rest of the matters of Jehoash that he did, and his might, and how he fought with Amaziah king of Judah, are they not written on the book of the Chronicles of the kings of Israel?";
dby[15] = "And the rest of the acts of Jehoash, what he did, and his might, and how he fought with Amaziah king of Judah, are they not written in the book of the chronicles of the kings of Israel?";
web[15] = "Now the rest of the acts of Jehoash which he did, and his might, and how he fought with Amaziah king of Judah, [are] they not written in the book of the chronicles of the kings of Israel?";

rsv[16] = "And Jeho\'ash slept with his fathers, and was buried in Sama\'ria with the kings of Israel; and Jerobo\'am his son reigned in his stead.";
asv[16] = "And Jehoash slept with his fathers, and was buried in Samaria with the kings of Israel; and Jeroboam his son reigned in his stead.";
yng[16] = "And Jehoash lieth with his fathers, and is buried in Samaria with the kings of Israel, and reign doth Jeroboam his son in his stead.";
dby[16] = "And Jehoash slept with his fathers, and was buried in Samaria with the kings of Israel; and Jeroboam his son reigned in his stead.";
web[16] = "And Jehoash slept with his fathers, and was buried in Samaria with the kings of Israel; and Jeroboam his son reigned in his stead.";
hnv[16] = " Yeho\'ash slept with his fathers, and was buried in Shomron with the kings of Yisra\'el; and Yarov`am his son reigned in his place.";
vul[16] = "dormivitque Ioas cum patribus suis et sepultus est in Samaria cum regibus Israhel et regnavit Hieroboam filius eius pro eo";
kjv[17] = "And Amaziah the son of Joash king of Judah lived after the death of Jehoash son of Jehoahaz king of Israel fifteen years.";
rsv[17] = "Amazi\'ah the son of Jo\'ash, king of Judah, lived fifteen years after the death of Jeho\'ash son of Jeho\'ahaz, king of Israel.";
asv[17] = "And Amaziah the son of Joash king of Judah lived after the death of Jehoash son of Jehoahaz king of Israel fifteen years.";
yng[17] = "And Amaziah son of Joash king of Judah liveth after the death of Jehoash son of Jehoahaz king of Israel fifteen years,";
dby[17] = "And Amaziah the son of Joash king of Judah lived after the death of Jehoash son of Jehoahaz, king of Israel, fifteen years.";
web[17] = "And Amaziah the son of Joash king of Judah lived after the death of Jehoash son of Jehoahaz king of Israel fifteen years.";
hnv[17] = " Amatzyah the son of Yo\'ash king of Yehudah lived after the death of Yeho\'ash son of Yeho\'achaz king of Yisra\'el fifteen years.";
vul[17] = "vixit autem Amasias filius Ioas rex Iuda postquam mortuus est Ioas filius Ioachaz regis Israhel viginti quinque annis";
kjv[18] = "And the rest of the acts of Amaziah, [are] they not written in the book of the chronicles of the kings of Judah?";
rsv[18] = "Now the rest of the deeds of Amazi\'ah, are they not written in the Book of the Chronicles of the Kings of Judah?";
asv[18] = "Now the rest of the acts of Amaziah, are they not written in the book of the chronicles of the kings of Judah?";
yng[18] = "and the rest of the matters of Amaziah are they not written on the book of the Chronicles of the kings of Judah?";
dby[18] = "And the rest of the acts of Amaziah, are they not written in the book of the chronicles of the kings of Judah?";
web[18] = "And the rest of the acts of Amaziah, [are] they not written in the book of the chronicles of the kings of Judah?";
hnv[18] = "Now the rest of the acts of Amatzyah, aren\'t they written in the book of the chronicles of the kings of Yehudah?";
vul[18] = "reliqua autem sermonum Amasiae nonne haec scripta sunt in libro sermonum dierum regum Iuda";
kjv[19] = "Now they made a conspiracy against him in Jerusalem: and he fled to Lachish; but they sent after him to Lachish, and slew him there.";
rsv[19] = "And they made a conspiracy against him in Jerusalem, and he fled to Lachish. But they sent after him to Lachish, and slew him there.";
asv[19] = "And they made a conspiracy against him in Jerusalem; and he fled to Lachish: but they sent after him to Lachish, and slew him there.";
yng[19] = "And they make a conspiracy against him in Jerusalem, and he fleeth to Lachish, and they send after him to Lachish, and put him to death there,";
dby[19] = "And they made a conspiracy against him in Jerusalem; and he fled to Lachish; and they sent after him to Lachish, and slew him there.";
web[19] = "Now they made a conspiracy against him in Jerusalem: and he fled to Lachish; but they sent after him to Lachish, and slew him there.";
hnv[19] = "They made a conspiracy against him in Yerushalayim; and he fled to Lakhish: but they sent after him to Lakhish, and killed him there.";
vul[19] = "factaque est contra eum coniuratio in Hierusalem at ille fugit in Lachis miseruntque post eum in Lachis et interfecerunt eum ibi";
kjv[20] = "And they brought him on horses: and he was buried at Jerusalem with his fathers in the city of David.";
rsv[20] = "And they brought him upon horses; and he was buried in Jerusalem with his fathers in the city of David.";
asv[20] = "And they brought him upon horses; and he was buried at Jerusalem with his fathers in the city of David.";
yng[20] = "and lift him up on the horses, and he is buried in Jerusalem, with his fathers, in the city of David.";
dby[20] = "And they brought him on horses, and he was buried at Jerusalem with his fathers, in the city of David.";
web[20] = "And they brought him on horses: and he was buried at Jerusalem with his fathers in the city of David.";
hnv[20] = "They brought him on horses; and he was buried at Yerushalayim with his fathers in the city of David.";
vul[20] = "et asportaverunt in equis sepultusque est in Hierusalem cum patribus suis in civitate David";
kjv[21] = "And all the people of Judah took Azariah, which [was] sixteen years old, and made him king instead of his father Amaziah.";
rsv[21] = "And all the people of Judah took Azari\'ah, who was sixteen years old, and made him king instead of his father Amazi\'ah.";
asv[21] = "And all the people of Judah took Azariah, who was sixteen years old, and made him king in the room of his father Amaziah.";
yng[21] = "And all the people of Judah take Azariah, and he [is] a son of sixteen years, and cause him to reign instead of his father Amaziah;";
dby[21] = "And all the people of Judah took Azariah, who was sixteen years old, and made him king instead of his father Amaziah.";
web[21] = "And all the people of Judah took Azariah, who [was] sixteen years old, and made him king instead of his father Amaziah.";
hnv[21] = "All the people of Yehudah took `Azaryah, who was sixteen years old, and made him king in the room of his father Amatzyah.";
vul[21] = "tulit autem universus populus Iudae Azariam annos natum sedecim et constituerunt eum regem pro patre eius Amasia";
kjv[22] = "He built Elath, and restored it to Judah, after that the king slept with his fathers.";
rsv[22] = "He built Elath and restored it to Judah, after the king slept with his fathers.";
asv[22] = "He built Elath, and restored it to Judah, after that the king slept with his fathers.";
yng[22] = "he hath built Elath, and bringeth it back to Judah, after the lying of the king with his fathers.";
dby[22] = "It was he that built Elath, and restored it to Judah, after the king slept with his fathers.";
web[22] = "He built Elath, and restored it to Judah, after that the king slept with his fathers.";
hnv[22] = "He built Elat, and restored it to Yehudah, after that the king slept with his fathers.";
vul[22] = "ipse aedificavit Ahilam et restituit eam Iudae postquam dormivit rex cum patribus suis";
kjv[23] = "In the fifteenth year of Amaziah the son of Joash king of Judah Jeroboam the son of Joash king of Israel began to reign in Samaria, [and reigned] forty and one years.";
rsv[23] = "In the fifteenth year of Amazi\'ah the son of Jo\'ash, king of Judah, Jerobo\'am the son of Jo\'ash, king of Israel, began to reign in Sama\'ria, and he reigned forty-one years.";
asv[23] = "In the fifteenth year of Amaziah the son of Joash king of Judah Jeroboam the son of Joash king of Israel began to reign in Samaria, [and reigned] forty and one years.";
yng[23] = "In the fifteenth year of Amaziah son of Joash king of Judah, reigned hath Jeroboam son of Joash king of Israel in Samaria -- forty and one years,";
dby[23] = "In the fifteenth year of Amaziah the son of Joash, king of Judah, Jeroboam the son of Joash, king of Israel, began to reign in Samaria, for forty-one years.";
web[23] = "In the fifteenth year of Amaziah the son of Joash king of Judah, Jeroboam the son of Joash king of Israel, began to reign in Samaria, [and reigned] forty and one years.";
hnv[23] = "In the fifteenth year of Amatzyah the son of Yo\'ash king of Yehudah Yarov`am the son of Yo\'ash king of Yisra\'el began to reign in Shomron, [and reigned] forty-one years.";
vul[23] = "anno quintodecimo Amasiae filii Ioas regis Iuda regnavit Hieroboam filius Ioas regis Israhel in Samaria quadraginta et uno anno";
kjv[24] = "And he did [that which was] evil in the sight of the LORD: he departed not from all the sins of Jeroboam the son of Nebat, who made Israel to sin.";
rsv[24] = "And he did what was evil in the sight of the LORD; he did not depart from all the sins of Jerobo\'am the son of Nebat, which he made Israel to sin.";
asv[24] = "And he did that which was evil in the sight of Jehovah: he departed not from all the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin.";
yng[24] = "and he doth the evil thing in the eyes of Jehovah, he hath not turned aside from all the sins of Jeroboam son of Nebat that he caused Israel to sin.";
dby[24] = "And he did evil in the sight of Jehovah: he departed not from any of the sins of Jeroboam the son of Nebat, who made Israel to sin.";
web[24] = "And he did [that which was] evil in the sight of the LORD: he departed not from all the sins of Jeroboam the son of Nebat, who made Israel to sin.";
hnv[24] = "He did that which was evil in the sight of the LORD: he didn\'t depart from all the sins of Yarov`am the son of Nevat, with which he made Yisra\'el to sin.";
vul[24] = "et fecit quod malum est coram Domino non recessit ab omnibus peccatis Hieroboam filii Nabath qui peccare fecit Israhel";
kjv[25] = "He restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the LORD God of Israel, which he spake by the hand of his servant Jonah, the son of Amittai, the prophet, which [was] of Gathhepher.";
rsv[25] = "He restored the border of Israel from the entrance of Hamath as far as the Sea of the Arabah, according to the word of the LORD, the God of Israel, which he spoke by his servant Jonah the son of Amit\'tai, the prophet, who was from Gath-he\'pher.";
asv[25] = "He restored the border of Israel from the entrance of Hamath unto the sea of the Arabah, according to the word of Jehovah, the God of Israel, which he spake by his servant Jonah the son of Amittai, the prophet, who was of Gath-hepher.";
yng[25] = "He hath brought back the border of Israel, from the entering in of Hamath unto the sea of the desert, according to the word of Jehovah, God of Israel, that He spake by the hand of His servant Jonah son of Amittai the prophet, who [is] of Gath-Hepher,";
dby[25] = "He restored the border of Israel from the entrance of Hamath as far as the sea of the plain, according to the word of Jehovah the God of Israel, which he had spoken through his servant Jonah the prophet, the son of Amittai, who was of Gath-Hepher.";
web[25] = "He restored the border of Israel from the entering of Hamath to the sea of the plain, according to the word of the LORD God of Israel, which he spoke by the hand of his servant Jonah, the son of Amittai, the prophet, who [was] of Gath-hepher.";
hnv[25] = "He restored the border of Yisra\'el from the entrance of Hamat to the sea of the `Aravah, according to the word of the LORD, the God of Yisra\'el, which he spoke by his servant Yonah the son of Ammittai, the prophet, who was of Gat-Hefer.";
vul[25] = "ipse restituit terminos Israhel ab introitu Emath usque ad mare Solitudinis iuxta sermonem Domini Dei Israhel quem locutus est per servum suum Ionam filium Amathi prophetam qui erat de Geth quae est in Opher";
kjv[26] = "For the LORD saw the affliction of Israel, [that it was] very bitter: for [there was] not any shut up, nor any left, nor any helper for Israel.";
rsv[26] = "For the LORD saw that the affliction of Israel was very bitter, for there was none left, bond or free, and there was none to help Israel.";
asv[26] = "For Jehovah saw the affliction of Israel, that it was very bitter; for there was none shut up nor left at large, neither was there any helper for Israel.";
yng[26] = "for Jehovah hath seen the affliction of Israel -- very bitter, and there is none restrained, and there is none left, and there is no helper to Israel;";
dby[26] = "For Jehovah saw that the affliction of Israel was very bitter; and that there was not any shut up, nor any left, nor any helper for Israel.";
web[26] = "For the LORD saw the affliction of Israel, [that it was] very bitter: for [there was] not any shut up, nor any left, nor any helper for Israel.";
hnv[26] = "For the LORD saw the affliction of Yisra\'el, that it was very bitter; for there was none shut up nor left at large, neither was there any helper for Yisra\'el.";
vul[26] = "vidit enim Dominus adflictionem Israhel amaram nimis et quod consumpti essent usque ad clausos carcere et extremos et non esset qui auxiliaretur Israhel";
kjv[27] = "And the LORD said not that he would blot out the name of Israel from under heaven: but he saved them by the hand of Jeroboam the son of Joash.";
rsv[27] = "But the LORD had not said that he would blot out the name of Israel from under heaven, so he saved them by the hand of Jerobo\'am the son of Jo\'ash.";
asv[27] = "And Jehovah said not that he would blot out the name of Israel from under heaven; but he saved them by the hand of Jeroboam the son of Joash.";
yng[27] = "and Jehovah hath not spoken to blot out the name of Israel from under the heavens, and saveth them by the hand of Jeroboam son of Joash.";
dby[27] = "And Jehovah had not said that he would blot out the name of Israel from under the heavens; and he saved them by the hand of Jeroboam the son of Joash.";
web[27] = "And the LORD said not that he would blot out the name of Israel from under heaven: but he saved them by the hand of Jeroboam the son of Joash.";
hnv[27] = "The LORD didn\'t say that he would blot out the name of Yisra\'el from under the sky; but he saved them by the hand of Yarov`am the son of Yo\'ash.";
vul[27] = "nec locutus est Dominus ut deleret nomen Israhel sub caelo sed salvavit eos in manu Hieroboam filii Ioas";
kjv[28] = "Now the rest of the acts of Jeroboam, and all that he did, and his might, how he warred, and how he recovered Damascus, and Hamath, [which belonged] to Judah, for Israel, are they not written in the book of the chronicles of the kings of Israel?";
rsv[28] = "Now the rest of the acts of Jerobo\'am, and all that he did, and his might, how he fought, and how he recovered for Israel Damascus and Hamath, which had belonged to Judah, are they not written in the Book of the Chronicles of the Kings of Israel?";
asv[28] = "Now the rest of the acts of Jeroboam, and all that he did, and his might, how he warred, and how he recovered Damascus, and Hamath, [which had belonged] to Judah, for Israel, are they not written in the book of the chronicles of the kings of Israel?";
yng[28] = "And the rest of the matters of Jeroboam, and all that he did, and his might with which he fought, and with which he brought back Damascus, and Hamath of Judah, into Israel, are they not written on the book of the Chronicles of the kings of Israel?";
dby[28] = "And the rest of the acts of Jeroboam, and all that he did, and his might, how he warred, and how he recovered for Israel that [which had belonged] to Judah in Damascus and in Hamath, are they not written in the book of the chronicles of the kings of Israel?";
web[28] = "Now the rest of the acts of Jeroboam, and all that he did, and his might, how he warred, and how he recovered Damascus, and Hamath, [which belonged] to Judah, for Israel, [are] they not written in the book of the chronicles of the kings of Israel?";
hnv[28] = "Now the rest of the acts of Yarov`am, and all that he did, and his might, how he warred, and how he recovered Dammesek, and Hamat, [which had belonged] to Yehudah, for Yisra\'el, aren\'t they written in the book of the chronicles of the kings of Yisra\'el?";
vul[28] = "reliqua autem sermonum Hieroboam et universa quae fecit et fortitudo eius qua proeliatus est et quomodo restituit Damascum et Emath Iudae in Israhel nonne haec scripta sunt in libro sermonum dierum regum Israhel";
kjv[29] = "And Jeroboam slept with his fathers, [even] with the kings of Israel; and Zachariah his son reigned in his stead.";
rsv[29] = "And Jerobo\'am slept with his fathers, the kings of Israel, and Zechari\'ah his son reigned in his stead.";
asv[29] = "And Jeroboam slept with his fathers, even with the kings of Israel; and Zechariah his son reigned in his stead.";
yng[29] = "And Jeroboam lieth with his fathers, with the kings of Israel, and reign doth Zechariah his son in his stead.";
dby[29] = "And Jeroboam slept with his fathers, with the kings of Israel; and Zechariah his son reigned in his stead.";
web[29] = "And Jeroboam slept with his fathers, [even] with the kings of Israel; and Zachariah his son reigned in his stead.";
hnv[29] = "Yarov`am slept with his fathers, even with the kings of Yisra\'el; and Zekharyah his son reigned in his place.";
vul[29] = "dormivitque Hieroboam cum patribus suis regibus Israhel et regnavit Zaccharias filius eius pro eo";
</script>
