csb[1] = "In the seventh year of Jehu, Joash became king, and he reigned forty years in Jerusalem. His mother\'s name was Zibiah; she was from Beer-sheba.";
csb[2] = "Throughout the time the priest Jehoiada instructed him, Joash did what was right in the LORD\'s sight.";
csb[3] = "Yet the high places were not taken away; the people continued sacrificing and burning incense on the high places.";
csb[4] = "Then Joash said to the priests, &quot;All the dedicated silver brought to the LORD\'s temple, census silver, silver from vows, and all silver voluntarily given for the LORD\'s temple --";
csb[5] = "&quot;each priest is to take it from his assessor and repair whatever damage is found in the temple.&quot;";
csb[6] = "But by the twenty-third year of the reign of King Joash, the priests had not repaired the damage to the temple.";
csb[7] = "So King Joash called the priest Jehoiada and the other priests and asked, &quot;Why haven\'t you repaired the temple\'s damage? Since you haven\'t, don\'t take any silver from your assessors; instead, hand it over for the repair of the temple.&quot;";
csb[8] = "So the priests agreed that they would receive no silver from the people and would not be the ones to repair the temple\'s damage.";
csb[9] = "Then the priest Jehoiada took a chest, bored a hole in its lid, and set it beside the altar on the right side as one enters the LORD\'s temple; the priests who guarded the threshold put into the chest all the silver that was brought to the LORD\'s temple.";
csb[10] = "Whenever they saw there was a large amount of silver in the chest, the king\'s secretary and the high priest would go bag up and tally the silver found in the LORD\'s temple.";
csb[11] = "Then they would give the weighed silver to those doing the work -- those who oversaw the LORD\'s temple. They in turn would pay it out to those working on the LORD\'s temple -- the carpenters, the builders,";
csb[12] = "the masons, and the stonecutters -- and would use it to buy timber and quarried stone to repair the damage to the LORD\'s temple and for all expenses for temple repairs.";
csb[13] = "However, no silver bowls, wick trimmers, sprinkling basins, trumpets, or any articles of gold or silver were made for the LORD\'s temple from the contributions brought to the LORD\'s temple.";
csb[14] = "Instead, it was given to those doing the work, and they repaired the LORD\'s temple with it.";
csb[15] = "No accounting was required from the men who received the silver to pay those doing the work, since they worked with integrity.";
csb[16] = "The silver from the guilt offering and the sin offering was not brought to the LORD\'s temple since it belonged to the priests.";
csb[17] = "At that time King Hazael of Aram marched up and fought against Gath and captured it. Then he planned to attack Jerusalem.";
csb[18] = "So King Joash of Judah took all the items consecrated by himself and by his ancestors -- Judah\'s kings Jehoshaphat, Jehoram, and Ahaziah -- as well as all the gold found in the treasuries of the LORD\'s temple and in the king\'s palace, and he sent them to King Hazael of Aram. Then Hazael withdrew from Jerusalem.";
csb[19] = "The rest of the events of Joash\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[20] = "Joash\'s servants conspired against him and attacked him at Beth-millo on the road that goes down to Silla.";
csb[21] = "It was his servants Jozabad son of Shimeath and Jehozabad son of Shomer who attacked him. He died and they buried him with his fathers in the city of David, and his son Amaziah became king in his place.";

hnv[17] = "Then Haza\'el king of Aram went up, and fought against Gat, and took it; and Haza\'el set his face to go up to Yerushalayim.";
vul[17] = "tunc ascendit Azahel rex Syriae et pugnabat contra Geth cepitque eam et direxit faciem suam ut ascenderet in Hierusalem";
kjv[18] = "And Jehoash king of Judah took all the hallowed things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold [that was] found in the treasures of the house of the LORD, and in the king\'s house, and sent [it] to Hazael king of Syria: and he went away from Jerusalem.";
rsv[18] = "Jeho\'ash king of Judah took all the votive gifts that Jehosh\'aphat and Jeho\'ram and Ahazi\'ah, his fathers, the kings of Judah, had dedicated, and his own votive gifts, and all the gold that was found in the treasuries of the house of the LORD and of the king\'s house, and sent these to Haz\'ael king of Syria. Then Haz\'ael went away from Jerusalem.";
asv[18] = "And Jehoash king of Judah took all the hallowed things that Jehoshaphat and Jehoram and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold that was found in the treasures of the house of Jehovah, and of the king\'s house, and sent it to Hazael king of Syria: and he went away from Jerusalem.";
yng[18] = "and Jehoash king of Judah taketh all the sanctified things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had sanctified, and his own sanctified things, and all the gold that is found in the treasures of the house of Jehovah and of the house of the king, and sendeth to Hazael king of Aram, and he goeth up from off Jerusalem.";
dby[18] = "And Jehoash king of Judah took all the hallowed things that Jehoshaphat and Jehoram and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold found in the treasures of the house of Jehovah and in the king\'s house, and sent it to Hazael king of Syria; and he went away from Jerusalem.";
web[18] = "And Jehoash king of Judah took all the hallowed things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold [that was] found in the treasures of the house of the LORD, and in the king\'s house, and sent [it] to Hazael king of Syria: and he went away from Jerusalem.";
hnv[18] = "Yeho\'ash king of Yehudah took all the holy things that Yehoshafat and Yehoram and Achazyah, his fathers, kings of Yehudah, had dedicated, and his own holy things, and all the gold that was found in the treasures of the house of the LORD, and of the king\'s house, and sent it to Haza\'el king of Aram: and he went away from Yerushalayim.";
vul[18] = "quam ob rem tulit Ioas rex Iuda omnia sanctificata quae consecraverant Iosaphat et Ioram et Ahazia patres eius reges Iuda et quae ipse obtulerat et universum argentum quod inveniri potuit in thesauris templi Domini et in palatio regis misitque Azaheli regi Syriae et recessit ab Hierusalem";
kjv[19] = "And the rest of the acts of Joash, and all that he did, [are] they not written in the book of the chronicles of the kings of Judah?";
rsv[19] = "Now the rest of the acts of Jo\'ash, and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?";
asv[19] = "Now the rest of the acts of Joash, and all that he did, are they not written in the book of the chronicles of the kings of Judah?";
yng[19] = "And the rest of the matters of Joash, and all that he did, are they not written on the book of the Chronicles of the kings of Judah?";
dby[19] = "And the rest of the acts of Joash, and all that he did, are they not written in the book of the chronicles of the kings of Judah?";
web[19] = "And the rest of the acts of Joash, and all that he did, [are] they not written in the book of the chronicles of the kings of Judah?";
hnv[19] = "Now the rest of the acts of Yo\'ash, and all that he did, aren\'t they written in the book of the chronicles of the kings of Yehudah?";
vul[19] = "reliqua autem sermonum Ioas et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda";
kjv[20] = "And his servants arose, and made a conspiracy, and slew Joash in the house of Millo, which goeth down to Silla.";
rsv[20] = "His servants arose and made a conspiracy, and slew Jo\'ash in the house of Millo, on the way that goes down to Silla.";
asv[20] = "And his servants arose, and made a conspiracy, and smote Joash at the house of Millo, [on the way] that goeth down to Silla.";
yng[20] = "And his servants rise, and make a conspiracy, and smite Joash in the house of Millo, that is going down to Silla:";
dby[20] = "And his servants rose up and made a conspiracy, and smote Joash in the house of Millo, at the descent of Silla.";
web[20] = "And his servants arose, and made a conspiracy, and slew Joash in the house of Millo, which goeth down to Silla.";
hnv[20] = "His servants arose, and made a conspiracy, and struck Yo\'ash at the house of Millo, [on the way] that goes down to Silla.";
vul[20] = "surrexerunt autem servi eius et coniuraverunt inter se percusseruntque Ioas in domo Mello in descensu Sela";
kjv[21] = "For Jozachar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David: and Amaziah his son reigned in his stead.";
rsv[21] = "It was Jo\'zacar the son of Shim\'e-ath and Jeho\'zabad the son of Shomer, his servants, who struck him down, so that he died. And they buried him with his fathers in the city of David, and Amazi\'ah his son reigned in his stead.";
asv[21] = "For Jozacar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David: and Amaziah his son reigned in his stead.";
yng[21] = "yea, Jozachar son of Shimeath, and Jehozabad son of Shemer, his servants, have smitten him, and he dieth, and they bury him with his fathers in the city of David, and reign doth Amaziah his son, in his stead.";
dby[21] = "And Jozachar the son of Shimeath and Jehozabad the son of Shomer, his servants, smote him and he died; and they buried him with his fathers in the city of David. And Amaziah his son reigned in his stead.";
web[21] = "For Jozachar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David: And Amaziah his son reigned in his stead.";
hnv[21] = "For Yozakhar the son of Shim`at, and Yehozavad the son of Shomer, his servants, struck him, and he died; and they buried him with his fathers in the city of David: and Amatzyah his son reigned in his place.";
vul[21] = "Iozachar namque filius Semath et Iozabad filius Somer servi eius percusserunt eum et mortuus est et sepelierunt eum cum patribus suis in civitate David regnavitque Amasias filius eius pro eo";
