csb[1] = "Manasseh was twelve years old when he became king, and he reigned fifty-five years in Jerusalem. His mother\'s name was Hephzibah.";
csb[2] = "He did what was evil in the LORD\'s sight, imitating the detestable practices of the nations that the LORD had dispossessed before the Israelites.";
csb[3] = "He rebuilt the high places that his father Hezekiah had destroyed and reestablished the altars for Baal. He made an Asherah, as King Ahab of Israel had done; he also bowed in worship to all the stars in the sky and served them.";
csb[4] = "He built altars in the LORD\'s temple, where the LORD had said, &quot;Jerusalem is where I will put my name.&quot;";
csb[5] = "He built altars to all the stars in the sky in both courtyards of the LORD\'s temple.";
csb[6] = "He sacrificed his son in the fire, practiced witchcraft and divination, and consulted mediums and spiritists. He did a huge amount of evil in the LORD\'s sight, angering him.";
csb[7] = "Manasseh set up the carved image of Asherah, which he made, in the temple that the LORD had spoken about to David and his son Solomon: &quot;I will establish my name forever in this temple and in Jerusalem, which I have chosen out of all the tribes of Israel.";
csb[8] = "&quot;I will never again cause the feet of the Israelites to wander from the land I gave to their ancestors if only they will be careful to do all I have commanded them -- the whole law that my servant Moses commanded them.&quot;";
csb[9] = "But they did not listen; Manasseh caused them to stray so that they did worse evil than the nations the LORD had destroyed before the Israelites.";
csb[10] = "The LORD said through his servants the prophets,";
csb[11] = "&quot;Since King Manasseh of Judah has committed all these detestable acts -- worse evil than the Amorites who preceded him had done -- and by means of his idols has also caused Judah to sin,";
csb[12] = "&quot;this is what the LORD God of Israel says: \'I am about to bring such disaster on Jerusalem and Judah that everyone who hears about it will shudder.";
csb[13] = "&quot;I will stretch over Jerusalem the measuring line used on Samaria and the mason\'s level used on the house of Ahab, and I will wipe Jerusalem clean as one wipes a bowl -- wiping it and turning it upside down.";
csb[14] = "&quot;I will abandon the remnant of my inheritance and hand them over to their enemies. They will become plunder and spoil to all their enemies,";
csb[15] = "&quot;because they have done what is evil in my sight and have angered me from the day their ancestors came out of Egypt until today.\' &quot;";
csb[16] = "Manasseh also shed so much innocent blood that he filled Jerusalem with it from one end to another. This was in addition to his sin that he caused Judah to commit, so that they did what was evil in the LORD\'s sight.";
csb[17] = "The rest of the events of Manasseh\'s reign, along with all his accomplishments and the sin that he committed, are written in the Historical Record of Judah\'s Kings.";
csb[18] = "Manasseh rested with his fathers and was buried in the garden of his own house, the garden of Uzza. His son Amon became king in his place.";
csb[19] = "Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem. His mother\'s name was Meshullemeth daughter of Haruz; she was from Jotbah.";
csb[20] = "He did what was evil in the LORD\'s sight, just as his father Manasseh had done.";
csb[21] = "He walked in all the ways his father had walked; he served the idols his father had served, and he bowed in worship to them.";
csb[22] = "He abandoned the LORD God of his ancestors and did not walk in the ways of the LORD.";
csb[23] = "Amon\'s servants conspired against him and put the king to death in his own house.";
csb[24] = "The common people killed all who had conspired against King Amon, and they made his son Josiah king in his place.";
csb[25] = "The rest of the events of Amon\'s reign, along with his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[26] = "He was buried in his tomb in the garden of Uzza, and his son Josiah became king in his place.";
