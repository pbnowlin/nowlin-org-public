csb[1] = "In the twelfth year of Judah\'s King Ahaz, Hoshea son of Elah became king over Israel in Samaria, and he reigned nine years.";
csb[2] = "He did what was evil in the LORD\'s sight, but not like the kings of Israel who preceded him.";
csb[3] = "King Shalmaneser of Assyria attacked him, and Hoshea became his vassal and paid him tribute.";
csb[4] = "But the king of Assyria caught Hoshea in a conspiracy: He had sent envoys to So king of Egypt and had not paid tribute to the king of Assyria as in previous years. Therefore the king of Assyria arrested him and put him in prison.";
csb[5] = "The king of Assyria invaded the whole land, marched up to Samaria, and besieged it for three years.";
csb[6] = "In the ninth year of Hoshea, the king of Assyria captured Samaria. He deported the Israelites to Assyria and settled them in Halah, along the Habor (Gozan\'s river), and in the cities of the Medes.";
csb[7] = "This disaster happened because the people of Israel sinned against the LORD their God who had brought them out of the land of Egypt from the power of Pharaoh king of Egypt and because they worshiped other gods.";
csb[8] = "They lived according to the customs of the nations that the LORD had dispossessed before the Israelites and according to what the kings of Israel did.";
csb[9] = "The Israelites secretly did things against the LORD their God that were not right. They built high places in all their towns from watchtower to fortified city.";
csb[10] = "They set up for themselves sacred pillars and Asherah poles on every high hill and under every green tree.";
csb[11] = "They burned incense there on all the high places just like the nations that the LORD had driven out before them had done. They did evil things, angering the LORD.";
csb[12] = "They served idols, although the LORD had told them, &quot;You must not do this.&quot;";
csb[13] = "Still, the LORD warned Israel and Judah through every prophet and every seer, saying, &quot;Turn from your evil ways and keep my commands and statutes according to the whole law I commanded your ancestors and sent to you through my servants the prophets.&quot;";
csb[14] = "But they would not listen. Instead they became obstinate like their ancestors who did not believe the LORD their God.";
csb[15] = "They rejected his statutes and his covenant he had made with their ancestors and the warnings he had given them. They followed worthless idols and became worthless themselves, following the surrounding nations the LORD had commanded them not to imitate.";
csb[16] = "They abandoned all the commands of the LORD their God. They made cast images for themselves, two calves, and an Asherah pole. They bowed in worship to all the stars in the sky and served Baal.";
csb[17] = "They sacrificed their sons and daughters in the fire and practiced divination and interpreted omens. They devoted themselves to do what was evil in the LORD\'s sight and angered him.";
csb[18] = "Therefore, the LORD was very angry with Israel, and he removed them from his presence. Only the tribe of Judah remained.";
csb[19] = "Even Judah did not keep the commands of the LORD their God but lived according to the customs Israel had practiced.";
csb[20] = "So the LORD rejected all the descendants of Israel, punished them, and handed them over to plunderers until he had banished them from his presence.";
csb[21] = "When the LORD tore Israel from the house of David, Israel made Jeroboam son of Nebat king. Then Jeroboam led Israel away from following the LORD and caused them to commit immense sin.";
csb[22] = "The Israelites persisted in all the sins that Jeroboam committed and did not turn away from them.";
csb[23] = "Finally, the LORD removed Israel from his presence just as he had declared through all his servants the prophets. So Israel has been exiled to Assyria from their homeland to this very day.";
csb[24] = "Then the king of Assyria brought people from Babylon, Cuthah, Avva, Hamath, and Sepharvaim and settled them in place of the Israelites in the cities of Samaria. The settlers took possession of Samaria and lived in its cities.";
csb[25] = "When they first lived there, they did not fear the LORD. So the LORD sent lions among them, which killed some of them.";
csb[26] = "The settlers said to the king of Assyria, &quot;The nations that you have deported and placed in the cities of Samaria do not know the requirements of the god of the land. Therefore he has sent lions among them that are killing them because the people don\'t know the requirements of the god of the land.&quot;";
csb[27] = "Then the king of Assyria issued a command: &quot;Send back one of the priests you deported. Have him go and live there so he can teach them the requirements of the god of the land.&quot;";
csb[28] = "So one of the priests they had deported came and lived in Bethel, and he began to teach them how they should fear the LORD.";
csb[29] = "But the people of each nation were still making their own gods in the cities where they lived and putting them in the shrines of the high places that the people of Samaria had made.";
csb[30] = "The men of Babylon made Succoth-benoth, the men of Cuth made Nergal, the men of Hamath made Ashima,";
csb[31] = "the Avvites made Nibhaz and Tartak, and the Sepharvites burned their children in the fire to Adrammelech and Anammelech, the gods of Sepharvaim.";
csb[32] = "They feared the LORD, but they also made from their ranks priests for the high places, who were working for them at the shrines of the high places.";
csb[33] = "They feared the LORD, but they also worshiped their own gods according to the practice of the nations from which they had been deported.";
csb[34] = "They are still observing the former practices to this day. None of them fear the LORD or observe the statutes and ordinances, the law and commandments that the LORD had commanded the descendants of Jacob, whom he had given the name Israel.";
csb[35] = "The LORD made a covenant with Jacob\'s descendants and commanded them, &quot;Do not fear other gods; do not bow in worship to them; do not serve them; do not sacrifice to them.";
csb[36] = "&quot;Instead fear the LORD, who brought you up from the land of Egypt with great power and an outstretched arm. You are to bow down to him, and you are to sacrifice to him.";
csb[37] = "&quot;You are to be careful always to observe the statutes, the ordinances, the law, and the commandments he wrote for you; do not fear other gods.";
csb[38] = "&quot;Do not forget the covenant that I have made with you. Do not fear other gods,";
csb[39] = "&quot;but fear the LORD your God, and he will rescue you from all your enemies.&quot;";
csb[40] = "However, these nations would not listen but continued observing their former practices.";
csb[41] = "They feared the LORD but also served their idols. Still today, their children and grandchildren continue doing as their fathers did.";

kjv[4] = "And the king of Assyria found conspiracy in Hoshea: for he had sent messengers to So king of Egypt, and brought no present to the king of Assyria, as [he had done] year by year: therefore the king of Assyria shut him up, and bound him in prison.";
rsv[4] = "But the king of Assyria found treachery in Hoshe\'a; for he had sent messengers to So, king of Egypt, and offered no tribute to the king of Assyria, as he had done year by year; therefore the king of Assyria shut him up, and bound him in prison.";
asv[4] = "And the king of Assyria found conspiracy in Hoshea; for he had sent messengers to So king of Egypt, and offered no tribute to the king of Assyria, as he had done year by year: therefore the king of Assyria shut him up, and bound him in prison.";
yng[4] = "And the king of Asshur findeth in Hoshea a conspiracy, in that he hath sent messengers unto So king of Egypt, and hath not caused a present to go up to the king of Asshur, as year by year, and the king of Asshur restraineth him, and bindeth him in a house of restraint.";
dby[4] = "But the king of Assyria found conspiracy in Hoshea; for he had sent messengers to So king of Egypt, and sent up no present to the king of Assyria as [he had done] from year to year. And the king of Assyria shut him up and bound him in prison.";
web[4] = "And the king of Assyria found conspiracy in Hoshea: for he had sent messengers to So king of Egypt, and brought no present to the king of Assyria, as [he had done] year by year: therefore the king of Assyria shut him up, and bound him in prison.";
hnv[4] = "The king of Ashshur found conspiracy in Hoshea; for he had sent messengers to So king of Mitzrayim, and offered no tribute to the king of Ashshur, as he had done year by year: therefore the king of Ashshur shut him up, and bound him in prison.";
vul[4] = "cumque deprehendisset rex Assyriorum Osee quod rebellare nitens misisset nuntios ad Sua regem Aegypti ne praestaret tributa regi Assyriorum sicut singulis annis solitus erat obsedit eum et vinctum misit in carcerem";

kjv[13] = "Yet the LORD testified against Israel, and against Judah, by all the prophets, [and by] all the seers, saying, Turn ye from your evil ways, and keep my commandments [and] my statutes, according to all the law which I commanded your fathers, and which I sent to you by my servants the prophets.";
rsv[13] = "Yet the LORD warned Israel and Judah by every prophet and every seer, saying, &quot;Turn from your evil ways and keep my commandments and my statutes, in accordance with all the law which I commanded your fathers, and which I sent to you by my servants the prophets.&quot;";
asv[13] = "Yet Jehovah testified unto Israel, and unto Judah, by every prophet, and every seer, saying, Turn ye from your evil ways, and keep my commandments and my statutes, according to all the law which I commanded your fathers, and which I sent to you by my servants the prophets.";
yng[13] = "And Jehovah testifieth against Israel, and against Judah, by the hand of every prophet, and every seer, saying, `Turn back from your evil ways, and keep My commands, My statutes, according to all the law that I commanded your fathers, and that I sent unto you by the hand of My servants the prophets;\'";

vul[13] = "et testificatus est Dominus in Israhel et in Iuda per manum omnium prophetarum et videntum dicens revertimini a viis vestris pessimis et custodite praecepta mea et caerimonias iuxta omnem legem quam praecepi patribus vestris et sicut misi ad vos in manu servorum meorum prophetarum";

kjv[15] = "And they rejected his statutes, and his covenant that he made with their fathers, and his testimonies which he testified against them; and they followed vanity, and became vain, and went after the heathen that [were] round about them, [concerning] whom the LORD had charged them, that they should not do like them.";
rsv[15] = "They despised his statutes, and his covenant that he made with their fathers, and the warnings which he gave them. They went after false idols, and became false, and they followed the nations that were round about them, concerning whom the LORD had commanded them that they should not do like them.";
asv[15] = "And they rejected his statutes, and his covenant that he made with their fathers, and his testimonies which he testified unto them; and they followed vanity, and became vain, and [went] after the nations that were round about them, concerning whom Jehovah had charged them that they should not do like them.";
yng[15] = "and reject His statutes and His covenant that He made with their fathers, and His testimonies that He testified against them, and go after the vain thing, and become vain, and after the nations that are round about them, of whom Jehovah commanded them not to do like them;";
dby[15] = "And they rejected his statutes, and his covenant which he had made with their fathers, and his testimonies which he had testified unto them; and they followed vanity and became vain, and [went] after the nations that were round about them, concerning whom Jehovah had charged them that they should not do like them.";
web[15] = "And they rejected his statutes, and his covenant that he made with their fathers, and his testimonies which he testified against them; and they followed vanity, and became vain, and went after the heathen that [were] around them, [concerning] whom the LORD had charged them, that they should not do like them.";
hnv[15] = "They rejected his statutes, and his covenant that he made with their fathers, and his testimonies which he testified to them; and they followed vanity, and became vain, and [went] after the nations that were round about them, concerning whom the LORD had charged those who they should not do like them.";
vul[15] = "et abiecerunt legitima eius et pactum quod pepigit cum patribus eorum et testificationes quibus contestatus est eos secutique sunt vanitates et vane egerunt et secuti sunt gentes quae erant per circuitum eorum super quibus praeceperat Dominus eis ut non facerent sicut et illae faciebant";
kjv[16] = "And they left all the commandments of the LORD their God, and made them molten images, [even] two calves, and made a grove, and worshipped all the host of heaven, and served Baal.";
rsv[16] = "And they forsook all the commandments of the LORD their God, and made for themselves molten images of two calves; and they made an Ashe\'rah, and worshiped all the host of heaven, and served Ba\'al.";
asv[16] = "And they forsook all the commandments of Jehovah their God, and made them molten images, even two calves, and made an Asherah, and worshipped all the host of heaven, and served Baal.";
yng[16] = "And they forsake all the commands of Jehovah their God, and make to them a molten image -- two calves, and make a shrine, and bow themselves to all the host of the heavens, and serve Baal,";
dby[16] = "And they forsook all the commandments of Jehovah their God, and made them molten images, two calves, and made an Asherah, and worshipped all the host of the heavens, and served Baal;";
web[16] = "And they left all the commandments of the LORD their God, and made for themselves molten images, [even] two calves, and made a grove, and worshiped all the host of heaven, and served Baal.";
hnv[16] = " They forsook all the mitzvot of the LORD their God, and made them molten images, even two calves, and made an Asherah, and worshiped all the host of the sky, and served Ba`al.";
vul[16] = "et dereliquerunt omnia praecepta Domini Dei sui feceruntque sibi conflatiles duos vitulos et lucos et adoraverunt universam militiam caeli servieruntque Baal";
kjv[17] = "And they caused their sons and their daughters to pass through the fire, and used divination and enchantments, and sold themselves to do evil in the sight of the LORD, to provoke him to anger.";
rsv[17] = "And they burned their sons and their daughters as offerings, and used divination and sorcery, and sold themselves to do evil in the sight of the LORD, provoking him to anger.";
asv[17] = "And they caused their sons and their daughters to pass through the fire, and used divination and enchantments, and sold themselves to do that which was evil in the sight of Jehovah, to provoke him to anger.";
yng[17] = "and cause their sons and their daughters to pass over through fire, and divine divinations, and use enchantments, and sell themselves to do the evil thing in the eyes of Jehovah, to provoke Him;";
dby[17] = "and they caused their sons and their daughters to pass through the fire, and used divination and enchantments, and sold themselves to do evil in the sight of Jehovah, to provoke him to anger.";
web[17] = "And they caused their sons and their daughters to pass through the fire, and used divination and enchantments, and sold themselves to do evil in the sight of the LORD, to provoke him to anger.";
hnv[17] = "They caused their sons and their daughters to pass through the fire, and used divination and enchantments, and sold themselves to do that which was evil in the sight of the LORD, to provoke him to anger.";
vul[17] = "et consecrabant ei filios suos et filias suas per ignem et divinationibus inserviebant et auguriis et tradiderunt se ut facerent malum coram Domino et inritarent eum";
kjv[18] = "Therefore the LORD was very angry with Israel, and removed them out of his sight: there was none left but the tribe of Judah only.";
rsv[18] = "Therefore the LORD was very angry with Israel, and removed them out of his sight; none was left but the tribe of Judah only.";
asv[18] = "Therefore Jehovah was very angry with Israel, and removed them out of his sight: there was none left but the tribe of Judah only.";
yng[18] = "That Jehovah sheweth himself very angry against Israel, and turneth them aside from His presence; none hath been left, only the tribe of Judah by itself.";
dby[18] = "Therefore Jehovah was very angry with Israel, and removed them out of his sight: there remained but the tribe of Judah only.";
web[18] = "Therefore the LORD was very angry with Israel, and removed them out of his sight: there was none left but the tribe of Judah only.";
hnv[18] = "Therefore the LORD was very angry with Yisra\'el, and removed them out of his sight: there was none left but the tribe of Yehudah only.";
vul[18] = "iratusque est Dominus vehementer Israhel et abstulit eos de conspectu suo et non remansit nisi tribus Iuda tantummodo";
kjv[19] = "Also Judah kept not the commandments of the LORD their God, but walked in the statutes of Israel which they made.";
rsv[19] = "Judah also did not keep the commandments of the LORD their God, but walked in the customs which Israel had introduced.";
asv[19] = "Also Judah kept not the commandments of Jehovah their God, but walked in the statutes of Israel which they made.";
yng[19] = "Also Judah hath not kept the commands of Jehovah their God, and they walk in the statutes of Israel that they had made.";
dby[19] = "Also Judah kept not the commandments of Jehovah their God, but walked in the statutes of Israel which they had made.";
web[19] = "Also Judah kept not the commandments of the LORD their God, but walked in the statutes of Israel which they made.";
hnv[19] = "Also Yehudah didn\'t keep the mitzvot of the LORD their God, but walked in the statutes of Yisra\'el which they made.";
vul[19] = "sed nec ipse Iuda custodivit mandata Domini Dei sui verum ambulavit in erroribus Israhel quos operatus fuerat";
kjv[20] = "And the LORD rejected all the seed of Israel, and afflicted them, and delivered them into the hand of spoilers, until he had cast them out of his sight.";
rsv[20] = "And the LORD rejected all the descendants of Israel, and afflicted them, and gave them into the hand of spoilers, until he had cast them out of his sight.";
asv[20] = "And Jehovah rejected all the seed of Israel, and afflicted them, and delivered them into the hand of spoilers, until he had cast them out of his sight.";
yng[20] = "And Jehovah kicketh against all the seed of Israel, and afflicteth them, and giveth them into the hand of spoilers, till that He hath cast them out of His presence,";
dby[20] = "And Jehovah rejected all the seed of Israel; and afflicted them, and delivered them into the hand of spoilers, until he had cast them out of his sight.";
web[20] = "And the LORD rejected all the seed of Israel, and afflicted them, and delivered them into the hand of spoilers, until he had cast them out of his sight.";
hnv[20] = "The LORD rejected all the seed of Yisra\'el, and afflicted them, and delivered them into the hand of spoilers, until he had cast them out of his sight.";
vul[20] = "proiecitque Dominus omne semen Israhel et adflixit eos et tradidit in manu diripientium donec proiceret eos a facie sua";
kjv[21] = "For he rent Israel from the house of David; and they made Jeroboam the son of Nebat king: and Jeroboam drave Israel from following the LORD, and made them sin a great sin.";
rsv[21] = "When he had torn Israel from the house of David they made Jerobo\'am the son of Nebat king. And Jerobo\'am drove Israel from following the LORD and made them commit great sin.";
asv[21] = "For he rent Israel from the house of David; and they made Jeroboam the son of Nebat king: and Jeroboam drove Israel from following Jehovah, and made them sin a great sin.";
yng[21] = "for He hath rent Israel from the house of David, and they make Jeroboam son of Nebat king, and Jeroboam driveth Israel from after Jehovah, and hath caused them to sin a great sin,";
dby[21] = "For Israel had rent [the kingdom] from the house of David; and they had made Jeroboam the son of Nebat king; and Jeroboam violently turned Israel from following Jehovah, and made them sin a great sin.";
web[21] = "For he rent Israel from the house of David; and they made Jeroboam the son of Nebat king: and Jeroboam drove Israel from following the LORD, and made them sin a great sin.";
hnv[21] = "For he tore Yisra\'el from the house of David; and they made Yarov`am the son of Nevat king: and Yarov`am drove Yisra\'el from following the LORD, and made them sin a great sin.";
vul[21] = "ex eo iam tempore quo scissus est Israhel a domo David et constituerunt sibi regem Hieroboam filium Nabath separavit enim Hieroboam Israhel a Domino et peccare eos fecit peccatum magnum";
kjv[22] = "For the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them;";
rsv[22] = "The people of Israel walked in all the sins which Jerobo\'am did; they did not depart from them,";
asv[22] = "And the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them;";
yng[22] = "and the sons of Israel walk in all the sins of Jeroboam that he did, they have not turned aside therefrom,";
dby[22] = "And the children of Israel walked in all the sins of Jeroboam which he did; they did not depart from them:";
web[22] = "For the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them;";
hnv[22] = "The children of Yisra\'el walked in all the sins of Yarov`am which he did; they didn\'t depart from them;";
vul[22] = "et ambulaverunt filii Israhel in universis peccatis Hieroboam quae fecerat non recesserunt ab eis";
kjv[23] = "Until the LORD removed Israel out of his sight, as he had said by all his servants the prophets. So was Israel carried away out of their own land to Assyria unto this day.";
rsv[23] = "until the LORD removed Israel out of his sight, as he had spoken by all his servants the prophets. So Israel was exiled from their own land to Assyria until this day.";
asv[23] = "until Jehovah removed Israel out of his sight, as he spake by all his servants the prophets. So Israel was carried away out of their own land to Assyria unto this day.";
yng[23] = "till that Jehovah hath turned Israel aside from His presence, as He spake by the hand of all His servants the prophets, and Israel is removed from off its land to Asshur, unto this day.";
dby[23] = "until Jehovah had removed Israel out of his sight, as he had said through all his servants the prophets; and Israel was carried away out of their own land to Assyria, unto this day.";
web[23] = "Until the LORD removed Israel out of his sight, as he had said by all his servants the prophets. So was Israel carried away out of their own land to Assyria to this day.";
hnv[23] = "until the LORD removed Yisra\'el out of his sight, as he spoke by all his servants the prophets. So Yisra\'el was carried away out of their own land to Ashshur to this day.";
vul[23] = "usquequo auferret Dominus Israhel a facie sua sicut locutus fuerat in manu omnium servorum suorum prophetarum translatusque est Israhel de terra sua in Assyrios usque in diem hanc";
kjv[24] = "And the king of Assyria brought [men] from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed [them] in the cities of Samaria instead of the children of Israel: and they possessed Samaria, and dwelt in the cities thereof.";
rsv[24] = "And the king of Assyria brought people from Babylon, Cuthah, Avva, Hamath, and Sephar-va\'im, and placed them in the cities of Sama\'ria instead of the people of Israel; and they took possession of Sama\'ria, and dwelt in its cities.";
asv[24] = "And the king of Assyria brought men from Babylon, and from Cuthah, and from Avva, and from Hamath and Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel; and they possessed Samaria, and dwelt in the cities thereof.";
yng[24] = "And the king of Asshur bringeth in from Babylon and from Cutha, and from Ava, and from Hamath, and Sepharvaim, and causeth [them] to dwell in the cities of Samaria instead of the sons of Israel, and they possess Samaria, and dwell in its cities;";
dby[24] = "And the king of Assyria brought [people] from Babylon, and from Cuthah, and from Avva, and from Hamath, and from Sepharvaim, and made them dwell in the cities of Samaria instead of the children of Israel; and they possessed Samaria, and dwelt in its cities.";
web[24] = "And the king of Assyria brought [men] from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed [them] in the cities of Samaria instead of the children of Israel: and they possessed Samaria, and dwelt in its cities.";
hnv[24] = "The king of Ashshur brought men from Bavel, and from Kutah, and from Avva, and from Hamat and Sefarvayim, and placed them in the cities of Shomron instead of the children of Yisra\'el; and they possessed Shomron, and lived in the cities of it.";
vul[24] = "adduxit autem rex Assyriorum de Babylone et de Chutha et de Haiath et de Emath et de Sepharvaim et conlocavit eos in civitatibus Samariae pro filiis Israhel qui possederunt Samariam et habitaverunt in urbibus eius";
kjv[25] = "And [so] it was at the beginning of their dwelling there, [that] they feared not the LORD: therefore the LORD sent lions among them, which slew [some] of them.";
rsv[25] = "And at the beginning of their dwelling there, they did not fear the LORD; therefore the LORD sent lions among them, which killed some of them.";
asv[25] = "And so it was, at the beginning of their dwelling there, that they feared not Jehovah: therefore Jehovah sent lions among them, which killed some of them.";
yng[25] = "and it cometh to pass, at the commencement of their dwelling there, they have not feared Jehovah, and Jehovah doth send among them the lions, and they are destroying among them.";
dby[25] = "And so it was, at the beginning of their dwelling there, that they feared not Jehovah; and Jehovah sent lions among them, which killed [some] of them.";
web[25] = "And [so] it was at the beginning of their dwelling there, [that] they feared not the LORD: therefore the LORD sent lions among them, which slew [some] of them.";
hnv[25] = "So it was, at the beginning of their dwelling there, that they didn\'t fear the LORD: therefore the LORD sent lions among them, which killed some of them.";
vul[25] = "cumque ibi habitare coepissent non timebant Dominum et inmisit eis Dominus leones qui interficiebant eos";
kjv[26] = "Wherefore they spake to the king of Assyria, saying, The nations which thou hast removed, and placed in the cities of Samaria, know not the manner of the God of the land: therefore he hath sent lions among them, and, behold, they slay them, because they know not the manner of the God of the land.";
rsv[26] = "So the king of Assyria was told, &quot;The nations which you have carried away and placed in the cities of Sama\'ria do not know the law of the god of the land; therefore he has sent lions among them, and behold, they are killing them, because they do not know the law of the god of the land.&quot;";
asv[26] = "Wherefore they spake to the king of Assyria, saying, The nations which thou hast carried away, and placed in the cities of Samaria, know not the law of the god of the land: therefore he hath sent lions among them, and, behold, they slay them, because they know not the law of the god of the land.";
yng[26] = "And they speak to the king of Asshur, saying, `The nations that thou hast removed, and dost place in the cities of Samaria, have not known the custom of the God of the land, and He sendeth among them the lions, and lo, they are destroying them, as they do not know the custom of the God of the land.\'";
dby[26] = "And they spoke to the king of Assyria saying, The nations that thou hast removed and made to dwell in the cities of Samaria know not the manner of the god of the land; therefore he has sent lions among them, and behold, they slay them, because they know not the manner of the god of the land.";
web[26] = "Wherefore they spoke to the king of Assyria, saying, The nations which thou hast removed, and placed in the cities of Samaria, know not the manner of the God of the land: therefore he hath sent lions among them, and behold, they slay them, because they know not the manner of the God of the land.";
hnv[26] = "Therefore they spoke to the king of Ashshur, saying, The nations which you have carried away, and placed in the cities of Shomron, don\'t know the law of the god of the land: therefore he has sent lions among them, and, behold, they kill them, because they don\'t know the law of the god of the land.";
vul[26] = "nuntiatumque est regi Assyriorum et dictum gentes quas transtulisti et habitare fecisti in civitatibus Samariae ignorant legitima Dei terrae et inmisit in eos Dominus leones et ecce interficiunt eos eo quod ignorent ritum Dei terrae";
kjv[27] = "Then the king of Assyria commanded, saying, Carry thither one of the priests whom ye brought from thence; and let them go and dwell there, and let him teach them the manner of the God of the land.";
rsv[27] = "Then the king of Assyria commanded, &quot;Send there one of the priests whom you carried away thence; and let him go and dwell there, and teach them the law of the god of the land.&quot;";
asv[27] = "Then the king of Assyria commanded, saying, Carry thither one of the priests whom ye brought from thence; and let them go and dwell there, and let him teach them the law of the god of the land.";
yng[27] = "And the king of Asshur commandeth, saying, `Cause to go thither one of the priests whom ye removed thence, and they go and dwell there, and he doth teach them the custom of the God of the land.\'";
dby[27] = "And the king of Assyria commanded saying, Carry thither one of the priests whom ye have brought away from thence; and let them go and abide there, and let him teach them the manner of the god of the land.";
web[27] = "Then the king of Assyria commanded, saying, Carry thither one of the priests whom ye brought from thence; and let them go and dwell there, and let him teach them the manner of the God of the land.";
hnv[27] = "Then the king of Ashshur commanded, saying, Carry there one of the Kohanim whom you brought from there; and let them go and dwell there, and let him teach them the law of the god of the land.";
vul[27] = "praecepit autem rex Assyriorum dicens ducite illuc unum de sacerdotibus quos inde captivos adduxistis et vadat et habitet cum eis et doceat eos legitima Dei terrae";
kjv[28] = "Then one of the priests whom they had carried away from Samaria came and dwelt in Bethel, and taught them how they should fear the LORD.";
rsv[28] = "So one of the priests whom they had carried away from Sama\'ria came and dwelt in Bethel, and taught them how they should fear the LORD.";
asv[28] = "So one of the priests whom they had carried away from Samaria came and dwelt in Beth-el, and taught them how they should fear Jehovah.";
yng[28] = "And one of the priests whom they removed from Samaria cometh in, and dwelleth in Beth-El, and he is teaching them how they do fear Jehovah,";
dby[28] = "Then one of the priests whom they had carried away from Samaria came and abode in Bethel, and taught them how they should fear Jehovah.";
web[28] = "Then one of the priests whom they had carried away from Samaria came and dwelt in Beth-el, and taught them how they should fear the LORD.";
hnv[28] = " So one of the Kohanim whom they had carried away from Shomron came and lived in Beit-El, and taught them how they should fear the LORD.";
vul[28] = "igitur cum venisset unus de sacerdotibus his qui captivi ducti fuerant de Samaria habitavit in Bethel et docebat eos quomodo colerent Dominum";
kjv[29] = "Howbeit every nation made gods of their own, and put [them] in the houses of the high places which the Samaritans had made, every nation in their cities wherein they dwelt.";
rsv[29] = "But every nation still made gods of its own, and put them in the shrines of the high places which the Samaritans had made, every nation in the cities in which they dwelt;";
asv[29] = "Howbeit every nation made gods of their own, and put them in the houses of the high places which the Samaritans had made, every nation in their cities wherein they dwelt.";
yng[29] = "and they are making each nation its gods, and place [them] in the houses of the high places that the Samaritans have made, each nation in their cities where they are dwelling.";
dby[29] = "And every nation made gods of their own, and put them in the houses of the high places that the Samaritans had made, every nation in their cities in which they dwelt.";
web[29] = "Yet, every nation made gods of their own, and put [them] in the houses of the high places which the Samaritans had made, every nation in their cities in which they dwelt.";
hnv[29] = "However every nation made gods of their own, and put them in the houses of the high places which the Shomroni had made, every nation in their cities in which they lived.";
vul[29] = "et unaquaeque gens fabricata est deum suum posueruntque eos in fanis excelsis quae fecerant Samaritae gens et gens in urbibus suis in quibus habitabant";
kjv[30] = "And the men of Babylon made Succothbenoth, and the men of Cuth made Nergal, and the men of Hamath made Ashima,";
rsv[30] = "the men of Babylon made Suc\'coth-be\'noth, the men of Cuth made Nergal, the men of Hamath made Ashi\'ma,";
asv[30] = "And the men of Babylon made Succoth-benoth, and the men of Cuth made Nergal, and the men of Hamath made Ashima,";
yng[30] = "And the men of Babylon have made Succoth-Benoth, and the men of Cuth have made Nergal, and the men of Hamath have made Ashima,";
dby[30] = "And the people of Babylon made Succoth-benoth, and the people of Cuth made Nergal, and the people of Hamath made Ashima,";
web[30] = "And the men of Babylon made Succoth-benoth, and the men of Cuth made Nergal, and the men of Hamath made Ashima,";
hnv[30] = "The men of Bavel made Sukkot-Benot, and the men of Kut made Nergal, and the men of Hamat made Ashima,";
vul[30] = "viri enim babylonii fecerunt Socchothbenoth viri autem chutheni fecerunt Nergel et viri de Emath fecerunt Asima";
kjv[31] = "And the Avites made Nibhaz and Tartak, and the Sepharvites burnt their children in fire to Adrammelech and Anammelech, the gods of Sepharvaim.";
rsv[31] = "and the Av\'vites made Nibhaz and Tartak; and the Sephar\'vites burned their children in the fire to Adram\'melech and Anam\'melech, the gods of Sephar-va\'im.";
asv[31] = "and the Avvites made Nibhaz and Tartak; and the Sepharvites burnt their children in the fire to Adrammelech and Anammelech, the gods of Sepharvaim.";
yng[31] = "and the Avites have made Nibhaz and Tartak, and the Sepharvites are burning their sons with fire to Adrammelech and Anammelech, gods of Sepharvim.";
dby[31] = "and the Avvites made Nibhaz and Tartak, and the Sepharvites burned their children in the fire to Adrammelech and Anammelech the gods of Sepharvaim.";
web[31] = "And the Avites made Nibhaz and Tartak, and the Sepharvites burnt their children in the fire to Adrammelech and Anammelech, the gods of Sepharvaim.";
hnv[31] = "and the `Avvim made Niv\'chaz and Tartak; and the Sefarvayim burnt their children in the fire to Adrammelekh and `Anammelekh, the gods of Sefarvayim.";
vul[31] = "porro Evei fecerunt Nebaaz et Tharthac hii autem qui erant de Sepharvaim conburebant filios suos igni Adramelech et Anamelech diis Sepharvaim";
kjv[32] = "So they feared the LORD, and made unto themselves of the lowest of them priests of the high places, which sacrificed for them in the houses of the high places.";
rsv[32] = "They also feared the LORD, and appointed from among themselves all sorts of people as priests of the high places, who sacrificed for them in the shrines of the high places.";
asv[32] = "So they feared Jehovah, and made unto them from among themselves priests of the high places, who sacrificed for them in the houses of the high places.";
yng[32] = "And they are fearing Jehovah, and make to themselves from their extremities priests of high places, and they are acting for them in the house of the high places.";
dby[32] = "So they feared Jehovah, and made to themselves from all classes of them priests of the high places, who offered [sacrifices] for them in the houses of the high places.";
web[32] = "So they feared the LORD, and made to themselves of the lowest of them priests of the high places, who sacrificed for them in the houses of the high places.";
hnv[32] = "So they feared the LORD, and made to them from among themselves Kohanim of the high places, who sacrificed for them in the houses of the high places.";
vul[32] = "et nihilominus colebant Dominum fecerunt autem sibi de novissimis sacerdotes excelsorum et ponebant eos in fanis sublimibus";
kjv[33] = "They feared the LORD, and served their own gods, after the manner of the nations whom they carried away from thence.";
rsv[33] = "So they feared the LORD but also served their own gods, after the manner of the nations from among whom they had been carried away.";
asv[33] = "They feared Jehovah, and served their own gods, after the manner of the nations from among whom they had been carried away.";
yng[33] = "Jehovah they are fearing, and their gods they are serving, according to the custom of the nations whence they removed them.";
dby[33] = "They feared Jehovah, and served their own gods after the manner of the nations, whence they had been carried away.";
web[33] = "They feared the LORD, and served their own gods, after the manner of the nations whom they carried away from thence.";
hnv[33] = "They feared the LORD, and served their own gods, after the manner of the nations from among whom they had been carried away.";
vul[33] = "et cum Dominum colerent diis quoque suis serviebant iuxta consuetudinem gentium de quibus translati fuerant Samariam";
kjv[34] = "Unto this day they do after the former manners: they fear not the LORD, neither do they after their statutes, or after their ordinances, or after the law and commandment which the LORD commanded the children of Jacob, whom he named Israel;";
rsv[34] = "To this day they do according to the former manner. They do not fear the LORD, and they do not follow the statutes or the ordinances or the law or the commandment which the LORD commanded the children of Jacob, whom he named Israel.";
asv[34] = "Unto this day they do after the former manner: they fear not Jehovah, neither do they after their statutes, or after their ordinances, or after the law or after the commandment which Jehovah commanded the children of Jacob, whom he named Israel;";
yng[34] = "Unto this day they are doing according to the former customs -- they are not fearing Jehovah, and are not doing according to their statutes, and according to their ordinances, and according to the law, and according to the command, that Jehovah commanded the sons of Jacob whose name He made Israel,";
dby[34] = "To this day they do after their former customs: they fear not Jehovah, neither do they after their statutes or after their ordinances, nor after the law and commandment that Jehovah commanded the sons of Jacob, whom he named Israel.";
web[34] = "To this day they do after the former manners: they fear not the LORD, neither do they after their statutes, or after their ordinances, or after the law and commandment which the LORD commanded the children of Jacob, whom he named Israel;";
hnv[34] = "To this day they do after the former manner: they don\'t fear the LORD, neither do they after their statutes, or after their ordinances, or after the law or after the mitzvah which the LORD commanded the children of Ya`akov, whom he named Yisra\'el;";
vul[34] = "usque in praesentem diem morem sequuntur antiquum non timent Dominum neque custodiunt caerimonias eius et iudicia et legem et mandatum quod praeceperat Dominus filiis Iacob quem cognominavit Israhel";
kjv[35] = "With whom the LORD had made a covenant, and charged them, saying, Ye shall not fear other gods, nor bow yourselves to them, nor serve them, nor sacrifice to them:";
rsv[35] = "The LORD made a covenant with them, and commanded them, &quot;You shall not fear other gods or bow yourselves to them or serve them or sacrifice to them;";
