csb[1] = "After Ahab\'s death, Moab rebelled against Israel.";
csb[2] = "Ahaziah had fallen through the latticed window of his upstairs room in Samaria and was injured. So he sent messengers, instructing them, &quot;Go inquire of Baal-zebub, the god of Ekron, whether I will recover from this injury.&quot;";
csb[3] = "But the angel of the LORD said to Elijah the Tishbite, &quot;Go and meet the messengers of the king of Samaria and say to them, \'Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?";
csb[4] = "&quot;Therefore, this is what the LORD says: You will not get up from your sickbed; you will certainly die.\' &quot; Then Elijah left.";
csb[5] = "The messengers returned to the king, who asked them, &quot;Why have you come back? &quot;";
csb[6] = "They replied, &quot;A man came to meet us and said, \'Go back to the king who sent you and declare to him: This is what the LORD says: Is it because there is no God in Israel that you\'re sending these men to inquire of Baal-zebub, the god of Ekron? Therefore, you will not get up from your sickbed; you will certainly die.\' &quot;";
csb[7] = "The king asked them, &quot;What sort of man came up to meet you and spoke those words to you? &quot;";
csb[8] = "They replied, &quot;A hairy man with a leather belt around his waist.&quot; He said, &quot;It\'s Elijah the Tishbite.&quot;";
csb[9] = "So King Ahaziah sent a captain with his fifty men to Elijah. When the captain went up to him, he was sitting on top of the hill. He announced, &quot;Man of God, the king declares, \'Come down! \' &quot;";
csb[10] = "Elijah responded to the captain, &quot;If I am a man of God, may fire come down from heaven and consume you and your fifty men.&quot; Then fire came down from heaven and consumed him and his fifty men.";
csb[11] = "So the king sent another captain with his fifty men to Elijah. He took in the situation and announced, &quot;Man of God, this is what the king says: \'Come down immediately! \' &quot;";
csb[12] = "Elijah responded, &quot;If I am a man of God, may fire come down from heaven and consume you and your fifty men.&quot; So a divine fire came down from heaven and consumed him and his fifty men.";
csb[13] = "Then the king sent a third captain with his fifty men. The third captain went up and fell on his knees in front of Elijah and begged him, &quot;Man of God, please let my life and the lives of these fifty servants of yours be precious to you.";
csb[14] = "&quot;Already fire has come down from heaven and consumed the first two captains with their companies, but this time let my life be precious to you.&quot;";
csb[15] = "The angel of the LORD said to Elijah, &quot;Go down with him. Don\'t be afraid of him.&quot; So he got up and went down with him to the king.";
csb[16] = "Then Elijah said to King Ahaziah, &quot;This is what the LORD says: \'Because you have sent messengers to inquire of Baal-zebub, the god of Ekron -- is it because there is no God in Israel for you to inquire of his will? -- you will not get up from your sickbed; you will certainly die.\' &quot;";
csb[17] = "Ahaziah died according to the word of the LORD that Elijah had spoken. Since he had no son, Joram became king in his place. This happened in the second year of Judah\'s King Jehoram son of Jehoshaphat.";
csb[18] = "The rest of the events of Ahaziah\'s reign, along with his accomplishments, are written in the Historical Record of Israel\'s Kings.";

kjv[16] = "And he said unto him, Thus saith the LORD, Forasmuch as thou hast sent messengers to enquire of Baalzebub the god of Ekron, [is it] not because [there is] no God in Israel to enquire of his word? therefore thou shalt not come down off that bed on which thou art gone up, but shalt surely die.";
rsv[16] = "and said to him, &quot;Thus says the LORD, \'Because you have sent messengers to inquire of Ba\'al-ze\'bub, the god of Ekron,--is it because there is no God in Israel to inquire of his word?--therefore you shall not come down from the bed to which you have gone, but you shall surely die.\'&quot;";
asv[16] = "And he said unto him, Thus saith Jehovah, Forasmuch as thou hast sent messengers to inquire of Baal-zebub, the god of Ekron, is it because there is no God in Israel to inquire of his word? therefore thou shalt not come down from the bed whither thou art gone up, but shalt surely die.";
yng[16] = "and speaketh unto him, `Thus said Jehovah, Because that thou hast sent messengers to inquire of Baal-Zebub god of Ekron -- is it because there is not a God in Israel to inquire of His word? therefore, the bed whither thou hast gone up -- thou dost not come down from it, for thou dost certainly die.\'";
