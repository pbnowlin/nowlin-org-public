csb[1] = "When King Hezekiah heard their report, he tore his clothes, covered himself with sackcloth, and went into the LORD\'s temple.";
csb[2] = "He sent Eliakim, who was in charge of the palace, Shebna the court secretary, and the leading priests, who were wearing sackcloth, to the prophet Isaiah son of Amoz.";
csb[3] = "They said to him, &quot;This is what Hezekiah says: \'Today is a day of distress, rebuke, and disgrace, for children have come to the point of birth, but there is no strength to deliver them.";
csb[4] = "&quot;Perhaps the LORD your God will hear all the words of the royal spokesman, whom his master the king of Assyria sent to mock the living God, and will rebuke him for the words that the LORD your God has heard. Therefore, offer a prayer for the surviving remnant.\' &quot;";
csb[5] = "So the servants of King Hezekiah went to Isaiah,";
csb[6] = "who said to them, &quot;Tell your master, \'The LORD says this: Don\'t be afraid because of the words you have heard, with which the king of Assyria\'s attendants have blasphemed me.";
csb[7] = "&quot;I am about to put a spirit in him, and he will hear a rumor and return to his own land, where I will cause him to fall by the sword.\' &quot;";
csb[8] = "When the royal spokesman heard that the king of Assyria had pulled out of Lachish, he left and found him fighting against Libnah.";
csb[9] = "The king had heard concerning King Tirhakah of Cush, &quot;Look, he has set out to fight against you.&quot; So he again sent messengers to Hezekiah, saying,";
csb[10] = "&quot;Say this to King Hezekiah of Judah: \'Don\'t let your God, on whom you rely, deceive you by promising that Jerusalem will not be handed over to the king of Assyria.";
csb[11] = "&quot;Look, you have heard what the kings of Assyria have done to all the countries: They completely destroyed them. Will you be rescued?";
csb[12] = "&quot;Did the gods of the nations that my predecessors destroyed rescue them -- nations such as Gozan, Haran, Rezeph, and the Edenites in Telassar?";
csb[13] = "&quot;Where is the king of Hamath, the king of Arpad, the king of the city of Sepharvaim, Hena, or Ivvah? \' &quot;";
csb[14] = "Hezekiah took the letter from the messengers\' hands, read it, then went up to the LORD\'s temple, and spread it out before the LORD.";
csb[15] = "Then Hezekiah prayed before the LORD: LORD God of Israel, enthroned between the cherubim, you are God -- you alone -- of all the kingdoms of the earth. You made the heavens and the earth.";
csb[16] = "Listen closely, LORD, and hear; open your eyes, LORD, and see. Hear the words that Sennacherib has sent to mock the living God.";
csb[17] = "LORD, it is true that the kings of Assyria have devastated the nations and their lands.";
csb[18] = "They have thrown their gods into the fire, for they were not gods but made by human hands -- wood and stone. So they have destroyed them.";
csb[19] = "Now, LORD our God, please save us from his power so that all the kingdoms of the earth may know that you, LORD, are God -- you alone.";
csb[20] = "Then Isaiah son of Amoz sent a message to Hezekiah: &quot;The LORD, the God of Israel says, \'I have heard your prayer to me about King Sennacherib of Assyria.\'";
csb[21] = "&quot;This is the word the LORD has spoken against him: Virgin Daughter Zion despises you and scorns you; Daughter Jerusalem shakes her head behind your back.";
csb[22] = "&quot;Who is it you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes in pride? Against the Holy One of Israel!";
csb[23] = "&quot;You have mocked the Lord through your messengers. You have said, \'With my many chariots I have gone up to the heights of the mountains, to the far recesses of Lebanon. I cut down its tallest cedars, its choice cypress trees. I came to its farthest outpost, its densest forest.";
csb[24] = "&quot;I dug wells and drank water in foreign lands. I dried up all the streams of Egypt with the soles of my feet.\'";
csb[25] = "&quot;Have you not heard? I designed it long ago; I planned it in days gone by. I have now brought it to pass, and you have crushed fortified cities into piles of rubble.";
csb[26] = "&quot;Their inhabitants have become powerless, dismayed, and ashamed. They are plants of the field, tender grass, grass on the rooftops, blasted by the east wind.";
csb[27] = "&quot;But I know your sitting down, your going out and your coming in, and your raging against me.";
csb[28] = "&quot;Because your raging against me and your arrogance have reached my ears, I will put my hook in your nose and my bit in your mouth; I will make you go back the way you came.";
csb[29] = "&quot;This will be the sign for you: This year you will eat what grows on its own, and in the second year what grows from that. But in the third year sow and reap, plant vineyards and eat their fruit.";
csb[30] = "&quot;The surviving remnant of the house of Judah will again take root downward and bear fruit upward.";
csb[31] = "&quot;For a remnant will go out from Jerusalem, and survivors, from Mount Zion. The zeal of the LORD of Armies will accomplish this.";
csb[32] = "&quot;Therefore, this is what the LORD says about the king of Assyria: He will not enter this city, shoot an arrow here, come before it with a shield, or build up a siege ramp against it.";
csb[33] = "&quot;He will go back the way he came, and he will not enter this city. This is the LORD\'s declaration.";
csb[34] = "&quot;I will defend this city and rescue it for my sake and for the sake of my servant David.&quot;";
csb[35] = "That night the angel of the LORD went out and struck down one hundred eighty-five thousand in the camp of the Assyrians. When the people got up the next morning -- there were all the dead bodies!";
csb[36] = "So King Sennacherib of Assyria broke camp and left. He returned home and lived in Nineveh.";
csb[37] = "One day, while he was worshiping in the temple of his god Nisroch, his sons Adrammelech and Sharezer struck him down with the sword and escaped to the land of Ararat. Then his son Esar-haddon became king in his place.";

rsv[4] = "It may be that the LORD your God heard all the words of the Rab\'shakeh, whom his master the king of Assyria has sent to mock the living God, and will rebuke the words which the LORD your God has heard; therefore lift up your prayer for the remnant that is left.&quot;";

rsv[16] = "Incline thy ear, O LORD, and hear; open thy eyes, O LORD, and see; and hear the words of Sennach\'erib, which he has sent to mock the living God.";
asv[16] = "Incline thine ear, O Jehovah, and hear; open thine eyes, O Jehovah, and see; and hear the words of Sennacherib, wherewith he hath sent him to defy the living God.";
yng[16] = "Incline, O Jehovah, Thine ear, and hear; open, O Jehovah, Thine eyes, and see; and hear Thou the words of Sennacherib with which he hath sent him to reproach the living God.";
dby[16] = "Incline thine ear, Jehovah, and hear; open, Jehovah, thine eyes, and see; and hear the words of Sennacherib, who hath sent him to reproach the living God.";
web[16] = "LORD, bow down thy ear, and hear: open, LORD, thy eyes, and see: and hear the words of Sennacherib, who hath sent him to reproach the living God.";
hnv[16] = "Incline your ear, LORD, and hear; open your eyes, LORD, and see; and hear the words of Sancheriv, with which he has sent him to defy the living God.";
vul[16] = "inclina aurem tuam et audi aperi Domine oculos tuos et vide et audi omnia verba Sennacherib qui misit ut exprobraret nobis Deum viventem";
kjv[17] = "Of a truth, LORD, the kings of Assyria have destroyed the nations and their lands,";
rsv[17] = "Of a truth, O LORD, the kings of Assyria have laid waste the nations and their lands,";
asv[17] = "Of a truth, Jehovah, the kings of Assyria have laid waste the nations and their lands,";
yng[17] = "`Truly, O Jehovah, kings of Asshur have laid waste the nations, and their land,";
dby[17] = "Of a truth, Jehovah, the kings of Assyria have laid waste the nations and their lands,";
web[17] = "Of a truth, LORD, the kings of Assyria have destroyed the nations and their lands,";
hnv[17] = " Of a truth, LORD, the kings of Ashshur have laid waste the nations and their lands,";
vul[17] = "vere Domine dissipaverunt reges Assyriorum gentes et terras omnium";
kjv[18] = "And have cast their gods into the fire: for they [were] no gods, but the work of men\'s hands, wood and stone: therefore they have destroyed them.";
rsv[18] = "and have cast their gods into the fire; for they were no gods, but the work of men\'s hands, wood and stone; therefore they were destroyed.";
asv[18] = "and have cast their gods into the fire; for they were no gods, but the work of men\'s hands, wood and stone; therefore they have destroyed them.";
yng[18] = "and have put their gods into fire, for they [are] no gods, but work of the hands of man, wood and stone, and destroy them.";
dby[18] = "and have cast their gods into the fire; for they were no gods, but the work of men\'s hands, wood and stone; therefore have they destroyed them.";
web[18] = "And have cast their gods into the fire: for they [were] no gods, but the work of men\'s hands, wood and stone: therefore they have destroyed them.";
hnv[18] = "and have cast their gods into the fire; for they were no gods, but the work of men\'s hands, wood and stone; therefore they have destroyed them.";
vul[18] = "et miserunt deos eorum in ignem non enim erant dii sed opera manuum hominum e ligno et lapide et perdiderunt eos";
kjv[19] = "Now therefore, O LORD our God, I beseech thee, save thou us out of his hand, that all the kingdoms of the earth may know that thou [art] the LORD God, [even] thou only.";
rsv[19] = "So now, O LORD our God, save us, I beseech thee, from his hand, that all the kingdoms of the earth may know that thou, O LORD, art God alone.&quot;";
asv[19] = "Now therefore, O Jehovah our God, save thou us, I beseech thee, out of his hand, that all the kingdoms of the earth may know that thou Jehovah art God alone.";
yng[19] = "And now, O Jehovah our God, save us, we pray Thee, out of his hand, and know do all kingdoms of the earth that Thou [art] Jehovah God -- Thyself alone.\'";
dby[19] = "And now, Jehovah our God, I beseech thee, save us out of his hand, that all the kingdoms of the earth may know that thou, Jehovah, art God, thou only.";
web[19] = "Now therefore, O LORD our God, I beseech thee, save thou us from his hand, that all the kingdoms of the earth may know that thou [art] the LORD God, [even] thou only.";
hnv[19] = "Now therefore, LORD our God, save you us, I beg you, out of his hand, that all the kingdoms of the eretz may know that you LORD are God alone.";
vul[19] = "nunc igitur Domine Deus noster salvos nos fac de manu eius ut sciant omnia regna terrae quia tu es Dominus Deus solus";
kjv[20] = "Then Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith the LORD God of Israel, [That] which thou hast prayed to me against Sennacherib king of Assyria I have heard.";
rsv[20] = "Then Isaiah the son of Amoz sent to Hezeki\'ah, saying, &quot;Thus says the LORD, the God of Israel: Your prayer to me about Sennach\'erib king of Assyria I have heard.";
asv[20] = "Then Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith Jehovah, the God of Israel, Whereas thou hast prayed to me against Sennacherib king of Assyria, I have heard [thee].";
yng[20] = "And Isaiah son of Amoz sendeth unto Hezekiah, saying, `Thus said Jehovah, God of Israel, That which thou hast prayed unto Me concerning Sennacherib king of Asshur I have heard:";
dby[20] = "And Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith Jehovah the God of Israel: That which thou hast prayed to me concerning Sennacherib king of Assyria I have heard.";
web[20] = "Then Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith the LORD God of Israel, [That] which thou hast prayed to me against Sennacherib king of Assyria I have heard.";
hnv[20] = "Then Yesha`yahu the son of Amotz sent to Hizkiyahu, saying, Thus says the LORD, the God of Yisra\'el, Whereas you have prayed to me against Sancheriv king of Ashshur, I have heard [you].";
vul[20] = "misit autem Esaias filius Amos ad Ezechiam dicens haec dicit Dominus Deus Israhel quae deprecatus es me super Sennacherib rege Assyriorum audivi";
kjv[21] = "This [is] the word that the LORD hath spoken concerning him; The virgin the daughter of Zion hath despised thee, [and] laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.";
rsv[21] = "This is the word that the LORD has spoken concerning him: &quot;She despises you, she scorns you--the virgin daughter of Zion; she wags her head behind you--the daughter of Jerusalem.";
asv[21] = "This is the word that Jehovah hath spoken concerning him: The virgin daughter of Zion hath despised thee and laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.";
yng[21] = "this [is] the word that Jehovah spake concerning him: `Trampled on thee -- laughed at thee, Hath the virgin daughter of Zion Behind thee shaken the head -- Hath the daughter of Jerusalem?";
dby[21] = "This is the word that Jehovah has spoken against him: The virgin-daughter of Zion despiseth thee, laugheth thee to scorn; The daughter of Jerusalem shaketh her head at thee.";
web[21] = "This [is] the word that the LORD hath spoken concerning him; The virgin the daughter of Zion hath despised thee, [and] laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.";
hnv[21] = "This is the word that the LORD has spoken concerning him: The virgin daughter of Tziyon has despised you and ridiculed you; the daughter of Yerushalayim has shaken her head at you.";
vul[21] = "iste est sermo quem locutus est Dominus de eo sprevit te et subsannavit virgo filia Sion post tergum tuum caput movit filia Hierusalem";
kjv[22] = "Whom hast thou reproached and blasphemed? and against whom hast thou exalted [thy] voice, and lifted up thine eyes on high? [even] against the Holy [One] of Israel.";
rsv[22] = "&quot;Whom have you mocked and reviled? Against whom have you raised your voice and haughtily lifted your eyes? Against the Holy One of Israel!";
asv[22] = "Whom hast thou defied and blasphemed? and against whom hast thou exalted thy voice and lifted up thine eyes on high? [even] against the Holy One of Israel.";
yng[22] = "Whom hast thou reproached and reviled? And against whom lifted up a voice? Yea, thou dost lift up on high thine eyes -- Against the Holy One of Israel!";
dby[22] = "Whom hast thou reproached and blasphemed? and against whom hast thou exalted the voice? Against the Holy one of Israel hast thou lifted up thine eyes on high.";
web[22] = "Whom hast thou reproached and blasphemed? and against whom hast thou exalted [thy] voice, and lifted up thy eyes on high: [even] against the Holy [One] of Israel.";
hnv[22] = "Whom have you defied and blasphemed? and against whom have you exalted your voice and lifted up your eyes on high? [even] against the Holy One of Yisra\'el.";
vul[22] = "cui exprobrasti et quem blasphemasti contra quem exaltasti vocem et elevasti in excelsum oculos tuos contra Sanctum Israhel";
kjv[23] = "By thy messengers thou hast reproached the Lord, and hast said, With the multitude of my chariots I am come up to the height of the mountains, to the sides of Lebanon, and will cut down the tall cedar trees thereof, [and] the choice fir trees thereof: and I will enter into the lodgings of his borders, [and into] the forest of his Carmel.";
rsv[23] = "By your messengers you have mocked the LORD, and you have said, \'With my many chariots I have gone up the heights of the mountains, to the far recesses of Lebanon; I felled its tallest cedars, its choicest cypresses; I entered its farthest retreat, its densest forest.";
asv[23] = "By thy messengers thou hast defied the Lord, and hast said, With the multitude of my chariots am I come up to the height of the mountains, to the innermost parts of Lebanon; and I will cut down the tall cedars thereof, and the choice fir-trees thereof; and I will enter into his farthest lodging-place, the forest of his fruitful field.";
yng[23] = "By the hand of thy messengers Thou hast reproached the Lord, and sayest: In the multitude of my chariots I have come up to a high place of mountains -- The sides of Lebanon, And I cut down the height of its cedars, The choice of its firs, And I enter the lodging of its extremity, The forest of its Carmel.";
dby[23] = "By thy messengers thou hast reproached the Lord, and hast said, With the multitude of my chariots have I come up To the height of the mountain, to the recesses of Lebanon, And I will cut down its tall cedars, the choice of its cypresses; And I will enter into its furthest lodging-place, [into] the forest of its fruitful field.";
web[23] = "By thy messengers thou hast reproached the Lord, and hast said, With the multitude of my chariots I am come up to the hight of the mountains, to the sides of Lebanon, and will cut down its tall cedar trees, [and] its choice fir trees: and I will enter into the lodgings of his borders, [and into] the forest of his Carmel.";
hnv[23] = "By your messengers you have defied the Lord, and have said, With the multitude of my chariots am I come up to the height of the mountains, to the innermost parts of Levanon; and I will cut down the tall cedars of it, and the choice fir trees of it; and I will enter into his farthest lodging-place, the forest of his fruitful field.";
vul[23] = "per manum servorum tuorum exprobrasti Domino et dixisti in multitudine curruum meorum ascendi excelsa montium in summitate Libani et succidi sublimes cedros eius electas abietes eius et ingressus sum usque ad terminos eius saltum Carmeli eius";
kjv[24] = "I have digged and drunk strange waters, and with the sole of my feet have I dried up all the rivers of besieged places.";
rsv[24] = "I dug wells and drank foreign waters, and I dried up with the sole of my foot all the streams of Egypt.\'";
asv[24] = "I have digged and drunk strange waters, and with the sole of my feet will I dry up all the rivers of Egypt.";
yng[24] = "I have digged, and drunk strange waters, And I dry up with the sole of my steps All floods of a bulwark.";
dby[24] = "I have digged, and have drunk strange waters, And with the sole of my feet have I dried up all the streams of Matsor.";
web[24] = "I have digged and drank strange waters, and with the sole of my feet have I dried up all the rivers of besieged places.";
hnv[24] = "I have dug and drunk strange waters, and with the sole of my feet will I dry up all the rivers of Mitzrayim.";
vul[24] = "ego succidi et bibi aquas alienas et siccavi vestigiis pedum meorum omnes aquas clausas";
kjv[25] = "Hast thou not heard long ago [how] I have done it, [and] of ancient times that I have formed it? now have I brought it to pass, that thou shouldest be to lay waste fenced cities [into] ruinous heaps.";
rsv[25] = "&quot;Have you not heard that I determined it long ago? I planned from days of old what now I bring to pass, that you should turn fortified cities into heaps of ruins,";
asv[25] = "Hast thou not heard how I have done it long ago, and formed it of ancient times? now have I brought it to pass, that it should be thine to lay waste fortified cities into ruinous heaps.";
yng[25] = "Hast thou not heard from afar, it I made, From days of old that I formed it? Now I have brought it in, And it becometh a desolation, Ruinous heaps [are] fenced cities,";
dby[25] = "Hast thou not heard long ago that I have done it? And that from ancient days I formed it? Now have I brought it to pass, that thou shouldest lay waste fortified cities [into] ruinous heaps.";
web[25] = "Hast thou not heard long ago [how] I have done it, [and] of ancient times that I have formed it? now have I brought it to pass, that thou shouldst be to lay waste fortified cities [in] ruinous heaps.";
hnv[25] = " Haven\'t you heard how I have done it long ago, and formed it of ancient times? now have I brought it to pass, that it should be yours to lay waste fortified cities into ruinous heaps.";
vul[25] = "numquid non audisti quid ab initio fecerim ex diebus antiquis plasmavi illud et nunc adduxi eruntque in ruinam collium pugnantium civitates munitae";
kjv[26] = "Therefore their inhabitants were of small power, they were dismayed and confounded; they were [as] the grass of the field, and [as] the green herb, [as] the grass on the housetops, and [as corn] blasted before it be grown up.";
rsv[26] = "while their inhabitants, shorn of strength, are dismayed and confounded, and have become like plants of the field, and like tender grass, like grass on the housetops; blighted before it is grown?";
asv[26] = "Therefore their inhabitants were of small power, they were dismayed and confounded; they were as the grass of the field, and as the green herb, as the grass on the housetops, and as grain blasted before it is grown up.";
yng[26] = "And their inhabitants [are] feeble-handed, They were broken down, and are dried up, They have been the herb of the field, And the greenness of the tender grass, Grass of the roofs, And blasted corn -- before it hath risen up!";
dby[26] = "And their inhabitants were powerless, They were dismayed and put to shame; They were [as] the growing grass, and [as] the green herb, [As] the grass on the housetops, and grain blighted before it be grown up.";
web[26] = "Therefore their inhabitants were of small power, they were dismayed and confounded; they were [as] the grass of the field, and [as] the green herb, [as] the grass on the house-tops, and [as corn] blasted before it is grown up.";
hnv[26] = "Therefore their inhabitants were of small power, they were dismayed and confounded; they were as the grass of the field, and as the green herb, as the grass on the housetops, and as grain blasted before it is grown up.";
vul[26] = "et qui sedent in eis humiles manu contremuerunt et confusi sunt facti sunt quasi faenum agri et virens herba tectorum quae arefacta est antequam veniret ad maturitatem";
kjv[27] = "But I know thy abode, and thy going out, and thy coming in, and thy rage against me.";
rsv[27] = "&quot;But I know your sitting down and your going out and coming in, and your raging against me.";
asv[27] = "But I know thy sitting down, and thy going out, and thy coming in, and thy raging against me.";
yng[27] = "And thy sitting down, and thy going out, And thy coming in, I have known, And thine anger towards Me;";
dby[27] = "But I know thine abode, and thy going out, and thy coming in, And thy raging against me.";
web[27] = "But I know thy abode, and thy going out, and thy coming in, and thy rage against me.";
hnv[27] = "But I know your sitting down, and your going out, and your coming in, and your raging against me.";
vul[27] = "habitaculum tuum et egressum tuum et viam tuam ego praescivi et furorem tuum contra me";
kjv[28] = "Because thy rage against me and thy tumult is come up into mine ears, therefore I will put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.";
rsv[28] = "Because you have raged against me and your arrogance has come into my ears, I will put my hook in your nose and my bit in your mouth, and I will turn you back on the way by which you came.";
asv[28] = "Because of thy raging against me, and because thine arrogancy is come up into mine ears, therefore will I put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.";
yng[28] = "Because of thine anger towards Me, And thy noise -- it came up into Mine ears, I have put My hook in thy nose, And My bridle in thy lips, And have caused thee to turn back, In the way in which thou camest.";
dby[28] = "Because thy raging against me and thine arrogance is come up into mine ears, I will put my ring in thy nose, and my bridle in thy lips, And I will make thee go back by the way by which thou camest.";
web[28] = "Because thy rage against me and thy tumult is come up into my ears, therefore I will put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.";
hnv[28] = "Because of your raging against me, and because your arrogance is come up into my ears, therefore will I put my hook in your nose, and my bridle in your lips, and I will turn you back by the way by which you came.";
vul[28] = "insanisti in me et superbia tua ascendit in aures meas ponam itaque circulum in naribus tuis et camum in labris tuis et reducam te in viam per quam venisti";
kjv[29] = "And this [shall be] a sign unto thee, Ye shall eat this year such things as grow of themselves, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruits thereof.";
rsv[29] = "&quot;And this shall be the sign for you: this year you shall eat what grows of itself, and in the second year what springs of the same; then in the third year sow, and reap, and plant vineyards, and eat their fruit.";
asv[29] = "And this shall be the sign unto thee: ye shall eat this year that which groweth of itself, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruit thereof.";
yng[29] = "And this to thee [is] the sign, Food of the year [is] the spontaneous growth, And in the second year the self-produced, And in the third year sow ye, and reap, And plant vineyards, and eat their fruits.";
dby[29] = "And this [shall be] the sign unto thee: They shall eat this year such as groweth of itself, And in the second year that which springeth of the same; But in the third year sow ye and reap, And plant vineyards and eat the fruit thereof.";
web[29] = "And this [shall be] a sign to thee, Ye shall eat this year such things as grow of themselves, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruits of it.";
hnv[29] = "This shall be the sign to you: You shall eat this year that which grows of itself, and in the second year that which springs of the same; and in the third year sow you, and reap, and plant vineyards, and eat the fruit of it.";
vul[29] = "tibi autem Ezechia hoc erit signum comede hoc anno quod reppereris in secundo autem anno quae sponte nascuntur porro in anno tertio seminate et metite plantate vineas et comedite fructum earum";
kjv[30] = "And the remnant that is escaped of the house of Judah shall yet again take root downward, and bear fruit upward.";
rsv[30] = "And the surviving remnant of the house of Judah shall again take root downward, and bear fruit upward;";
asv[30] = "And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward.";
yng[30] = "And it hath continued -- The escaped of the house of Judah That hath been left -- to take root beneath, And hath made fruit upward.";
dby[30] = "And the remnant that is escaped of the house of Judah Shall again take root downward, and bear fruit upward;";
web[30] = "And the remnant that hath escaped of the house of Judah shall yet again take root downward, and bear fruit upward.";
hnv[30] = "The remnant that has escaped of the house of Yehudah shall again take root downward, and bear fruit upward.";
vul[30] = "et quodcumque reliquum fuerit de domo Iuda mittet radicem deorsum et faciet fructum sursum";
kjv[31] = "For out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion: the zeal of the LORD [of hosts] shall do this.";
rsv[31] = "for out of Jerusalem shall go forth a remnant, and out of Mount Zion a band of survivors. The zeal of the LORD will do this.";
asv[31] = "For out of Jerusalem shall go forth a remnant, and out of mount Zion they that shall escape: the zeal of Jehovah shall perform this.";
yng[31] = "For from Jerusalem goeth out a remnant, And an escape from mount Zion; The zeal of Jehovah [of Hosts] doth this.";
dby[31] = "For out of Jerusalem shall go forth a remnant, And out of mount Zion they that escape: The zeal of Jehovah [of hosts] shall do this.";
web[31] = "For out of Jerusalem shall go forth a remnant, and they that escape from mount Zion: the zeal of the LORD [of hosts] shall do this.";
hnv[31] = " For out of Yerushalayim shall go forth a remnant, and out of Mount Tziyon those who shall escape: the zeal of the LORD shall perform this.";
vul[31] = "de Hierusalem quippe egredientur reliquiae et quod salvetur de monte Sion zelus Domini exercituum faciet hoc";
kjv[32] = "Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shield, nor cast a bank against it.";
rsv[32] = "&quot;Therefore thus says the LORD concerning the king of Assyria, He shall not come into this city or shoot an arrow there, or come before it with a shield or cast up a siege mound against it.";
asv[32] = "Therefore thus saith Jehovah concerning the king of Assyria, He shall not come unto this city, nor shoot an arrow there, neither shall he come before it with shield, nor cast up a mound against it.";
yng[32] = "Therefore, thus said Jehovah, Concerning the king of Asshur: He doth not come in unto this city, Nor doth he shoot there an arrow, Nor doth he come before it with shield. Nor doth he pour out against it a mount.";
dby[32] = "Therefore thus saith Jehovah concerning the king of Assyria: He shall not come into this city, Nor shoot an arrow there, Nor come before it with shield, Nor cast a bank against it.";
web[32] = "Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shield, nor cast a bank against it.";
hnv[32] = "Therefore thus says the LORD concerning the king of Ashshur, He shall not come to this city, nor shoot an arrow there, neither shall he come before it with shield, nor cast up a mound against it.";
vul[32] = "quam ob rem haec dicit Dominus de rege Assyriorum non ingredietur urbem hanc nec mittet in eam sagittam nec occupabit eam clypeus nec circumdabit eam munitio";
kjv[33] = "By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD.";
rsv[33] = "By the way that he came, by the same he shall return, and he shall not come into this city, says the LORD.";
asv[33] = "By the way that he came, by the same shall he return, and he shall not come unto this city, saith Jehovah.";
yng[33] = "In the way that he cometh in -- In it he turneth back, And unto this city he doth not come in, The affirmation of Jehovah --";
dby[33] = "By the way that he came, by the same shall he return, And shall not come into this city, saith Jehovah.";
web[33] = "By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD.";
hnv[33] = "By the way that he came, by the same shall he return, and he shall not come to this city, says the LORD.";
vul[33] = "per viam qua venit revertetur et civitatem hanc non ingredietur dicit Dominus";
kjv[34] = "For I will defend this city, to save it, for mine own sake, and for my servant David\'s sake.";
rsv[34] = "For I will defend this city to save it, for my own sake and for the sake of my servant David.&quot;";
asv[34] = "For I will defend this city to save it, for mine own sake, and for my servant David\'s sake.";
yng[34] = "And I have covered over this city, To save it, for Mine own sake, And for the sake of David My servant.\'";
dby[34] = "And I will defend this city, to save it, For mine own sake, and for my servant David\'s sake.";
web[34] = "For I will defend this city, to save it, for my own sake, and for my servant David\'s sake.";
hnv[34] = "For I will defend this city to save it, for my own sake, and for my servant David\'s sake.";
vul[34] = "protegamque urbem hanc et salvabo eam propter me et propter David servum meum";
kjv[35] = "And it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand: and when they arose early in the morning, behold, they [were] all dead corpses.";
rsv[35] = "And that night the angel of the LORD went forth, and slew a hundred and eighty-five thousand in the camp of the Assyrians; and when men arose early in the morning, behold, these were all dead bodies.";
asv[35] = "And it came to pass that night, that the angel of Jehovah went forth, and smote in the camp of the Assyrians a hundred fourscore and five thousand: and when men arose early in the morning, behold, these were all dead bodies.";
yng[35] = "And it cometh to pass, in that night, that a messenger of Jehovah goeth out, and smiteth in the camp of Asshur a hundred eighty and five thousand, and they rise early in the morning, and lo, all of them [are] dead corpses.";
dby[35] = "And it came to pass that night, that an angel of Jehovah went forth, and smote in the camp of the Assyrians a hundred and eighty-five thousand. And when they arose early in the morning, behold, they were all dead bodies.";
web[35] = "And it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians a hundred and eighty five thousand: and when they arose early in the morning, behold, they [were] all dead corpses.";
hnv[35] = " It happened that night, that the angel of the LORD went forth, and struck in the camp of the Ashshur one hundred eighty-five thousand: and when men arose early in the morning, behold, these were all dead bodies.";
vul[35] = "factum est igitur in nocte illa venit angelus Domini et percussit castra Assyriorum centum octoginta quinque milia cumque diluculo surrexisset vidit omnia corpora mortuorum et recedens abiit";
kjv[36] = "So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.";
rsv[36] = "Then Sennach\'erib king of Assyria departed, and went home, and dwelt at Nin\'eveh.";
asv[36] = "So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.";
yng[36] = "And Sennacherib king of Asshur journeyeth, and goeth, and turneth back, and dwelleth in Nineveh;";
dby[36] = "And Sennacherib king of Assyria departed, and went and returned, and abode at Nineveh.";
web[36] = "So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.";
hnv[36] = "So Sancheriv king of Ashshur departed, and went and returned, and lived at Nineveh.";
vul[36] = "et reversus est Sennacherib rex Assyriorum et mansit in Nineve";
kjv[37] = "And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword: and they escaped into the land of Armenia. And Esarhaddon his son reigned in his stead.";
rsv[37] = "And as he was worshiping in the house of Nisroch his god, Adram\'melech and Share\'zer, his sons, slew him with the sword, and escaped into the land of Ar\'arat. And Esarhad\'don his son reigned in his stead.";
asv[37] = "And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer smote him with the sword: and they escaped into the land of Ararat. And Esar-haddon his son reigned in his stead.";
yng[37] = "and it cometh to pass, he is bowing himself in the house of Nisroch his god, and Adramelech and Sharezar [his sons] have smitten him with the sword, and they have escaped to the land of Ararat, and Esar-Haddon his son reigneth in his stead.";
dby[37] = "And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer [his sons] smote him with the sword; and they escaped into the land of Ararat. And Esarhaddon his son reigned in his stead.";
web[37] = "And it came to pass, as he was worshiping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword: and they escaped into the land of Armenia. And Esar-haddon his son reigned in his stead.";
hnv[37] = "It happened, as he was worshipping in the house of Nisrokh his god, that Adrammelekh and Sar\'etzer struck him with the sword: and they escaped into the land of Ararat. Esar-Haddon his son reigned in his place.";
vul[37] = "cumque adoraret in templo Neserach deum suum Adramelech et Sarasar filii eius percusserunt eum gladio fugeruntque in terram Armeniorum et regnavit Eseraddon filius eius pro eo";
</script>
