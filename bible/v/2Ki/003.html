csb[1] = "Joram son of Ahab became king over Israel in Samaria during the eighteenth year of Judah\'s King Jehoshaphat, and he reigned twelve years.";
csb[2] = "He did what was evil in the LORD\'s sight, but not like his father and mother, for he removed the sacred pillar of Baal his father had made.";
csb[3] = "Nevertheless, Joram clung to the sins that Jeroboam son of Nebat had caused Israel to commit. He did not turn away from them.";
csb[4] = "King Mesha of Moab was a sheep breeder. He used to pay the king of Israel one hundred thousand lambs and the wool of one hundred thousand rams,";
csb[5] = "but when Ahab died, the king of Moab rebelled against the king of Israel.";
csb[6] = "So King Joram marched out from Samaria at that time and mobilized all Israel.";
csb[7] = "Then he sent a message to King Jehoshaphat of Judah: &quot;The king of Moab has rebelled against me. Will you go with me to fight against Moab? &quot; Jehoshaphat said, &quot;I will go. I am as you are, my people as your people, my horses as your horses.&quot;";
csb[8] = "He asked, &quot;Which route should we take? &quot; He replied, &quot;The route of the Wilderness of Edom.&quot;";
csb[9] = "So the king of Israel, the king of Judah, and the king of Edom set out. After they had traveled their indirect route for seven days, they had no water for the army or the animals with them.";
csb[10] = "Then the king of Israel said, &quot;Oh no, the LORD has summoned these three kings, only to hand them over to Moab.&quot;";
csb[11] = "But Jehoshaphat said, &quot;Isn\'t there a prophet of the LORD here? Let\'s inquire of the LORD through him.&quot; One of the servants of the king of Israel answered, &quot;Elisha son of Shaphat, who used to pour water on Elijah\'s hands, is here.&quot;";
csb[12] = "Jehoshaphat affirmed, &quot;The word of the LORD is with him.&quot; So the king of Israel and Jehoshaphat and the king of Edom went to him.";
csb[13] = "However, Elisha said to King Joram of Israel, &quot;What do we have in common? Go to the prophets of your father and your mother! &quot; But the king of Israel replied, &quot;No, because it is the LORD who has summoned these three kings to hand them over to Moab.&quot;";
csb[14] = "Elisha responded, &quot;By the life of the LORD of Armies, before whom I stand: If I did not have respect for King Jehoshaphat of Judah, I wouldn\'t look at you; I would not take notice of you.";
csb[15] = "&quot;Now, bring me a musician.&quot; While the musician played, the LORD\'s hand came on Elisha.";
csb[16] = "Then he said, &quot;This is what the LORD says: \'Dig ditch after ditch in this wadi.\'";
csb[17] = "&quot;For the LORD says, \'You will not see wind or rain, but the wadi will be filled with water, and you will drink -- you and your cattle and your animals.\'";
csb[18] = "&quot;This is easy in the LORD\'s sight. He will also hand Moab over to you.";
csb[19] = "&quot;Then you will attack every fortified city and every choice city. You will cut down every good tree and stop up every spring. You will ruin every good piece of land with stones.&quot;";
csb[20] = "About the time for the grain offering the next morning, water suddenly came from the direction of Edom and filled the land.";
csb[21] = "All Moab had heard that the kings had come up to fight against them. So all who could bear arms, from the youngest to the oldest, were summoned and took their stand at the border.";
csb[22] = "When they got up early in the morning, the sun was shining on the water, and the Moabites saw that the water across from them was red like blood.";
csb[23] = "&quot;This is blood! &quot; they exclaimed. &quot;The kings have crossed swords and their men have killed one another. So, to the spoil, Moab! &quot;";
csb[24] = "However, when the Moabites came to Israel\'s camp, the Israelites attacked them, and they fled from them. So Israel went into the land attacking the Moabites.";
csb[25] = "They would destroy the cities, and each of them would throw a stone to cover every good piece of land. They would stop up every spring and cut down every good tree. This went on until only the buildings of Kir-hareseth were left. Then men with slings surrounded the city and attacked it.";
csb[26] = "When the king of Moab saw that the battle was too fierce for him, he took seven hundred swordsmen with him to try to break through to the king of Edom, but they could not do it.";
csb[27] = "So he took his firstborn son, who was to become king in his place, and offered him as a burnt offering on the city wall. Great wrath was on the Israelites, and they withdrew from him and returned to their land.";

kjv[11] = "But Jehoshaphat said, [Is there] not here a prophet of the LORD, that we may enquire of the LORD by him? And one of the king of Israel\'s servants answered and said, Here [is] Elisha the son of Shaphat, which poured water on the hands of Elijah.";

asv[11] = "But Jehoshaphat said, Is there not here a prophet of Jehovah, that we may inquire of Jehovah by him? And one of the king of Israel\'s servants answered and said, Elisha the son of Shaphat is here, who poured water on the hands of Elijah.";
yng[11] = "And Jehoshaphat saith, `Is there not here a prophet of Jehovah, and we seek Jehovah by him?\' And one of the servants of the king of Israel answereth and saith, `Here [is] Elisha son of Shaphat, who poured water on the hands of Elijah.\'";

asv[17] = "For thus saith Jehovah, Ye shall not see wind, neither shall ye see rain; yet that valley shall be filled with water, and ye shall drink, both ye and your cattle and your beasts.";
yng[17] = "for thus said Jehovah, Ye do not see wind, nor do ye see rain, and that valley is full of water, and ye have drunk -- ye, and your cattle, and your beasts.";
dby[17] = "For thus saith Jehovah: Ye shall not see wind, neither shall ye see rain; yet this valley shall be filled with water, and ye shall drink, both ye, and your cattle, and your beasts.";
web[17] = "For thus saith the LORD, Ye shall not see wind, neither shall ye see rain; yet that valley shall be filled with water, that ye may drink, both ye, and your cattle, and your beasts.";
hnv[17] = "For thus says the LORD, You shall not see wind, neither shall you see rain; yet that valley shall be filled with water, and you shall drink, both you and your cattle and your animals.";
vul[17] = "haec enim dicit Dominus non videbitis ventum neque pluviam et alveus iste replebitur aquis et bibetis vos et familiae vestrae et iumenta vestra";
kjv[18] = "And this is [but] a light thing in the sight of the LORD: he will deliver the Moabites also into your hand.";
rsv[18] = "This is a light thing in the sight of the LORD; he will also give the Moabites into your hand,";
asv[18] = "And this is but a light thing in the sight of Jehovah: he will also deliver the Moabites into your hand.";
yng[18] = "`And this hath been light in the eyes of Jehovah, and he hath given Moab into your hand,";
dby[18] = "And this is a light thing in the sight of Jehovah: he will give the Moabites also into your hand.";
web[18] = "And this is [but] a light thing in the sight of the LORD: he will deliver the Moabites also into your hand.";
hnv[18] = "This is but a light thing in the sight of the LORD: he will also deliver the Mo`avim into your hand.";
vul[18] = "parumque hoc est in conspectu Domini insuper tradet etiam Moab in manu vestra";
kjv[19] = "And ye shall smite every fenced city, and every choice city, and shall fell every good tree, and stop all wells of water, and mar every good piece of land with stones.";
rsv[19] = "and you shall conquer every fortified city, and every choice city, and shall fell every good tree, and stop up all springs of water, and ruin every good piece of land with stones.&quot;";
asv[19] = "And ye shall smite every fortified city, and every choice city, and shall fell every good tree, and stop all fountains of water, and mar every good piece of land with stones.";
yng[19] = "and ye have smitten every fenced city, and every choice city, and every good tree ye cause to fall, and all fountains of waters ye stop, and every good portion ye mar with stones.\'";
dby[19] = "And ye shall smite every fortified city, and every choice city, and shall fell every good tree, and stop all wells of water, and mar every good piece of land with stones.";
web[19] = "And ye shall smite every fortified city, and every choice city, and shall fell every good tree, and stop all wells of water, and mar every good piece of land with stones.";
hnv[19] = "You shall strike every fortified city, and every choice city, and shall fell every good tree, and stop all springs of water, and mar every good piece of land with stones.";
vul[19] = "et percutietis omnem civitatem munitam et omnem urbem electam et universum lignum fructiferum succidetis cunctosque fontes aquarum obturabitis et omnem agrum egregium operietis lapidibus";
kjv[20] = "And it came to pass in the morning, when the meat offering was offered, that, behold, there came water by the way of Edom, and the country was filled with water.";
rsv[20] = "The next morning, about the time of offering the sacrifice, behold, water came from the direction of Edom, till the country was filled with water.";
asv[20] = "And it came to pass in the morning, about the time of offering the oblation, that, behold, there came water by the way of Edom, and the country was filled with water.";
yng[20] = "And it cometh to pass in the morning, at the ascending of the [morning]-present, that lo, waters are coming in from the way of Edom, and the land is filled with the waters,";
dby[20] = "And it came to pass in the morning, when the oblation was offered up, that behold, there came water by the way of Edom, and the country was filled with water.";
web[20] = "And it came to pass in the morning, when the meat-offering was offered, that behold, there came water by the way of Edom, and the country was filled with water.";
hnv[20] = "It happened in the morning, about the time of offering the offering, that behold, there came water by the way of Edom, and the country was filled with water.";
vul[20] = "factum est igitur mane quando sacrificium offerri solet et ecce aquae veniebant per viam Edom et repleta est terra aquis";
kjv[21] = "And when all the Moabites heard that the kings were come up to fight against them, they gathered all that were able to put on armour, and upward, and stood in the border.";
rsv[21] = "When all the Moabites heard that the kings had come up to fight against them, all who were able to put on armor, from the youngest to the oldest, were called out, and were drawn up at the frontier.";
asv[21] = "Now when all the Moabites heard that the kings were come up to fight against them, they gathered themselves together, all that were able to put on armor, and upward, and stood on the border.";
yng[21] = "and all Moab have heard that the kings have come up to fight against them, and they are called together, from every one girding on a girdle and upward, and they stand by the border.";
dby[21] = "And all the Moabites heard that the kings were come up to fight against them, and they were called together, all that were able to put on armour, and upward, and stood by the border.";
web[21] = "And when all the Moabites heard that the kings were come up to fight against them, they gathered all that were able to put on armor, and upward, and stood in the border.";
hnv[21] = "Now when all the Mo`avim heard that the kings had come up to fight against them, they gathered themselves together, all who were able to put on armor, and upward, and stood on the border.";
vul[21] = "universi autem Moabitae audientes quod ascendissent reges ut pugnarent adversum eos convocaverunt omnes qui accincti erant balteo desuper et steterunt in terminis";
kjv[22] = "And they rose up early in the morning, and the sun shone upon the water, and the Moabites saw the water on the other side [as] red as blood:";
rsv[22] = "And when they rose early in the morning, and the sun shone upon the water, the Moabites saw the water opposite them as red as blood.";
asv[22] = "And they rose up early in the morning, and the sun shone upon the water, and the Moabites saw the water over against them as red as blood:";
yng[22] = "And they rise early in the morning, and the sun hath shone on the waters, and the Moabites see, from over-against, the waters red as blood,";
dby[22] = "And they rose up early in the morning, and the sun rose upon the water, and the Moabites saw the water on the other side red as blood.";
web[22] = "And they rose early in the morning, and the sun shone upon the water, and the Moabites saw the water on the other side [as] red as blood:";
hnv[22] = "They rose up early in the morning, and the sun shone on the water, and the Mo`avim saw the water over against them as red as blood:";
vul[22] = "primoque mane surgentes et orto iam sole ex adverso aquarum viderunt Moabitae contra aquas rubras quasi sanguinem";
kjv[23] = "And they said, This [is] blood: the kings are surely slain, and they have smitten one another: now therefore, Moab, to the spoil.";
rsv[23] = "And they said, &quot;This is blood; the kings have surely fought together, and slain one another. Now then, Moab, to the spoil!&quot;";
asv[23] = "and they said, This is blood; the kings are surely destroyed, and they have smitten each man his fellow: now therefore, Moab, to the spoil.";
yng[23] = "and say, `Blood this [is]; the kings have been surely destroyed, and they smite each his neighbour; and now for spoil, Moab!\'";
dby[23] = "And they said, This is blood: the kings are entirely destroyed, and have smitten one another; and now, Moab, to the spoil!";
web[23] = "And they said, This [is] blood: the kings are surely slain, and they have smitten one another: now therefore, Moab, to the spoil.";
hnv[23] = "and they said, This is blood; the kings are surely destroyed, and they have struck each man his fellow: now therefore, Mo\'av, to the spoil.";
vul[23] = "dixeruntque sanguis est gladii pugnaverunt reges contra se et caesi sunt mutuo nunc perge ad praedam Moab";
kjv[24] = "And when they came to the camp of Israel, the Israelites rose up and smote the Moabites, so that they fled before them: but they went forward smiting the Moabites, even in [their] country.";
rsv[24] = "But when they came to the camp of Israel, the Israelites rose and attacked the Moabites, till they fled before them; and they went forward, slaughtering the Moabites as they went.";
asv[24] = "And when they came to the camp of Israel, the Israelites rose up and smote the Moabites, so that they fled before them; and they went forward into the land smiting the Moabites.";
yng[24] = "And they come in unto the camp of Israel, and the Israelites rise, and smite the Moabites, and they flee from their face; and they enter into Moab, so as to smite Moab,";
dby[24] = "And when they came to the camp of Israel, the Israelites rose up and smote the Moabites, and they fled before them; and they entered in and smote Moab.";
web[24] = "And when they came to the camp of Israel, the Israelites rose and smote the Moabites, so that they fled before them: but they went forward smiting the Moabites, even in [their] country.";
hnv[24] = "When they came to the camp of Yisra\'el, the Yisra\'elites rose up and struck the Mo`avim, so that they fled before them; and they went forward into the land smiting the Mo`avim.";
vul[24] = "perrexeruntque in castra Israhel porro consurgens Israhel percussit Moab at illi fugerunt coram eis venerunt igitur qui vicerant et percusserunt Moab";
kjv[25] = "And they beat down the cities, and on every good piece of land cast every man his stone, and filled it; and they stopped all the wells of water, and felled all the good trees: only in Kirharaseth left they the stones thereof; howbeit the slingers went about [it], and smote it.";
rsv[25] = "And they overthrew the cities, and on every good piece of land every man threw a stone, until it was covered; they stopped every spring of water, and felled all the good trees; till only its stones were left in Kir-har\'eseth, and the slingers surrounded and conquered it.";
asv[25] = "And they beat down the cities; and on every good piece of land they cast every man his stone, and filled it; and they stopped all the fountains of water, and felled all the good trees, until in Kir-hareseth [only] they left the stones thereof; howbeit the slingers went about it, and smote it.";
yng[25] = "and the cities they break down, and [on] every good portion they cast each his stone, and have filled it, and every fountain of water they stop, and every good tree they cause to fall -- till one had left its stones in Kir-Haraseth, and the slingers go round and smite it.";
dby[25] = "And they beat down the cities, and on every good piece of land cast every man his stone and filled it, and they stopped every well of water, and felled every good tree, until they left [only] the stones at Kirhareseth; and the slingers went about it, and smote it.";
web[25] = "And they beat down the cities, and on every good piece of land cast every man his stone, and filled it; and they stopped all the wells of water, and felled all the good trees: only in Kirhara-seth they left the stones of it; but the slingers went about [it], and smote it.";
hnv[25] = "They beat down the cities; and on every good piece of land they cast every man his stone, and filled it; and they stopped all the springs of water, and felled all the good trees, until in Kir-Hareset [only] they left the stones of it; however the men armed with slings went about it, and struck it.";
vul[25] = "et civitates destruxerunt et omnem agrum optimum mittentes singuli lapides repleverunt et universos fontes aquarum obturaverunt et omnia ligna fructifera succiderunt ita ut muri tantum fictiles remanerent et circumdata est civitas a fundibalariis et magna ex parte percussa";
kjv[26] = "And when the king of Moab saw that the battle was too sore for him, he took with him seven hundred men that drew swords, to break through [even] unto the king of Edom: but they could not.";
rsv[26] = "When the king of Moab saw that the battle was going against him, he took with him seven hundred swordsmen to break through, opposite the king of Edom; but they could not.";
asv[26] = "And when the king of Moab saw that the battle was too sore for him, he took with him seven hundred men that drew sword, to break through unto the king of Edom; but they could not.";
yng[26] = "And the king of Moab seeth that the battle has been too strong for him, and he taketh with him seven hundred men, drawing sword, to cleave through unto the king of Edom, and they have not been able,";
dby[26] = "And the king of Moab saw that the battle was too severe for him, and he took with him seven hundred men that drew swords, to break through to the king of Edom, but they could not.";
web[26] = "And when the king of Moab saw that the battle was too severe for him, he took with him seven hundred men that drew swords, to break through to the king of Edom: but they could not.";
hnv[26] = "When the king of Mo\'av saw that the battle was too severe for him, he took with him seven hundred men who drew sword, to break through to the king of Edom; but they could not.";
vul[26] = "quod cum vidisset rex Moab praevaluisse scilicet hostes tulit secum septingentos viros educentes gladium ut inrumperet ad regem Edom et non potuerunt";
kjv[27] = "Then he took his eldest son that should have reigned in his stead, and offered him [for] a burnt offering upon the wall. And there was great indignation against Israel: and they departed from him, and returned to [their own] land.";
rsv[27] = "Then he took his eldest son who was to reign in his stead, and offered him for a burnt offering upon the wall. And there came great wrath upon Israel; and they withdrew from him and returned to their own land.";
asv[27] = "Then he took his eldest son that should have reigned in his stead, and offered him for a burnt-offering upon the wall. And there was great wrath against Israel: and they departed from him, and returned to their own land.";
yng[27] = "and he taketh his son, the first-born who reigneth in his stead, and causeth him to ascend -- a burnt-offering on the wall, and there is great wrath against Israel, and they journey from off him, and turn back to the land.";
dby[27] = "And he took his eldest son, that should have reigned in his stead, and offered him up for a burnt-offering upon the wall. And there was great wrath against Israel; and they departed from him, and returned to [their own] land.";
web[27] = "Then he took his eldest son that was to reign in his stead, and offered him [for] a burnt-offering upon the wall. And there was great indignation against Israel: And they departed from him, and returned to [their own] land.";
hnv[27] = "Then he took his eldest son who would have reigned in his place, and offered him for a burnt offering on the wall. There was great wrath against Yisra\'el: and they departed from him, and returned to their own land.";
vul[27] = "arripiensque filium suum primogenitum qui regnaturus erat pro eo obtulit holocaustum super murum et facta est indignatio magna in Israhel statimque recesserunt ab eo et reversi sunt in terram suam";
</script>
