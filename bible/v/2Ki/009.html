csb[1] = "The prophet Elisha called one of the sons of the prophets and said, &quot;Tuck your mantle under your belt, take this flask of oil with you, and go to Ramoth-gilead.";
csb[2] = "&quot;When you get there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him away from his colleagues, and take him to an inner room.";
csb[3] = "&quot;Then take the flask of oil, pour it on his head, and say, \'This is what the LORD says: &quot;I anoint you king over Israel.&quot; \' Open the door and escape. Don\'t wait.&quot;";
csb[4] = "So the young prophet went to Ramoth-gilead.";
csb[5] = "When he arrived, the army commanders were sitting there, so he said, &quot;I have a message for you, commander.&quot; Jehu asked, &quot;For which one of us? &quot; He answered, &quot;For you, commander.&quot;";
csb[6] = "So Jehu got up and went into the house. The young prophet poured the oil on his head and said, &quot;This is what the LORD God of Israel says: \'I anoint you king over the LORD\'s people, Israel.";
csb[7] = "&quot;You are to strike down the house of your master Ahab so that I may avenge the blood shed by the hand of Jezebel -- the blood of my servants the prophets and of all the servants of the LORD.";
csb[8] = "&quot;The whole house of Ahab will perish, and I will wipe out all of Ahab\'s males, both slave and free, in Israel.";
csb[9] = "&quot;I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah.";
csb[10] = "&quot;The dogs will eat Jezebel in the plot of land at Jezreel -- no one will bury her.\' &quot; Then the young prophet opened the door and escaped.";
csb[11] = "When Jehu came out to his master\'s servants, they asked, &quot;Is everything all right? Why did this crazy person come to you? &quot; Then he said to them, &quot;You know the sort and their ranting.&quot;";
csb[12] = "But they replied, &quot;That\'s a lie! Tell us! &quot; So Jehu said, &quot;He talked to me about this and that and said, \'This is what the LORD says: I anoint you king over Israel.\' &quot;";
csb[13] = "Each man quickly took his garment and put it under Jehu on the bare steps. They blew the ram\'s horn and proclaimed, &quot;Jehu is king! &quot;";
csb[14] = "Then Jehu son of Jehoshaphat, son of Nimshi, conspired against Joram. Joram and all Israel had been at Ramoth-gilead on guard against King Hazael of Aram.";
csb[15] = "But King Joram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Aram\'s King Hazael. Jehu said, &quot;If you commanders wish to make me king, then don\'t let anyone escape from the city to go tell about it in Jezreel.&quot;";
csb[16] = "Jehu got into his chariot and went to Jezreel since Joram was laid up there and King Ahaziah of Judah had gone down to visit Joram.";
csb[17] = "Now the watchman was standing on the tower in Jezreel. He saw Jehu\'s mob approaching and shouted, &quot;I see a mob! &quot; Joram responded, &quot;Choose a rider and send him to meet them and have him ask, \'Do you come in peace? \' &quot;";
csb[18] = "So a horseman went to meet Jehu and said, &quot;This is what the king asks: \'Do you come in peace? \' &quot; Jehu replied, &quot;What do you have to do with peace? Fall in behind me.&quot; The watchman reported, &quot;The messenger reached them but hasn\'t started back.&quot;";
csb[19] = "So he sent out a second horseman, who went to them and said, &quot;This is what the king asks: \'Do you come in peace? \' &quot; Jehu answered, &quot;What do you have to do with peace? Fall in behind me.&quot;";
csb[20] = "Again the watchman reported, &quot;He reached them but hasn\'t started back. Also, the driving is like that of Jehu son of Nimshi -- he drives like a madman.&quot;";
csb[21] = "&quot;Get the chariot ready! &quot; Joram shouted, and they got it ready. Then King Joram of Israel and King Ahaziah of Judah set out, each in his own chariot, and met Jehu at the plot of land of Naboth the Jezreelite.";
csb[22] = "When Joram saw Jehu he asked, &quot;Do you come in peace, Jehu? &quot; He answered, &quot;What peace can there be as long as there is so much prostitution and sorcery from your mother Jezebel? &quot;";
csb[23] = "Joram turned around and fled, shouting to Ahaziah, &quot;It\'s treachery, Ahaziah! &quot;";
csb[24] = "Then Jehu drew his bow and shot Joram between the shoulders. The arrow went through his heart, and he slumped down in his chariot.";
csb[25] = "Jehu said to Bidkar his aide, &quot;Pick him up and throw him on the plot of ground belonging to Naboth the Jezreelite. For remember when you and I were riding side by side behind his father Ahab, and the LORD uttered this pronouncement against him:";
csb[26] = "&quot;\'As surely as I saw the blood of Naboth and the blood of his sons yesterday\' -- this is the LORD\'s declaration -- \'so will I repay you on this plot of land\' -- this is the LORD\'s declaration. So now, according to the word of the LORD, pick him up and throw him on the plot of land.&quot;";
csb[27] = "When King Ahaziah of Judah saw what was happening, he fled up the road toward Beth-haggan. Jehu pursued him, shouting, &quot;Shoot him too! &quot; So they shot him in his chariot at Gur Pass near Ibleam, but he fled to Megiddo and died there.";
csb[28] = "Then his servants carried him to Jerusalem in a chariot and buried him in his fathers\' tomb in the city of David.";
csb[29] = "It was in the eleventh year of Joram son of Ahab that Ahaziah had become king over Judah.";
csb[30] = "When Jehu came to Jezreel, Jezebel heard about it, so she painted her eyes, fixed her hair, and looked down from the window.";
csb[31] = "As Jehu entered the city gate, she said, &quot;Do you come in peace, Zimri, killer of your master? &quot;";
csb[32] = "He looked up toward the window and said, &quot;Who is on my side? Who? &quot; Two or three eunuchs looked down at him,";
csb[33] = "and he said, &quot;Throw her down! &quot; So they threw her down, and some of her blood splattered on the wall and on the horses, and Jehu rode over her.";
csb[34] = "Then he went in, ate and drank, and said, &quot;Take care of this cursed woman and bury her, since she\'s a king\'s daughter.&quot;";
csb[35] = "But when they went out to bury her, they did not find anything but the skull, the feet, and the hands.";
csb[36] = "So they went back and told him, and he said, &quot;This fulfills the LORD\'s word that he spoke through his servant Elijah the Tishbite: \'In the plot of land at Jezreel, the dogs will eat Jezebel\'s flesh.";
csb[37] = "&quot;Jezebel\'s corpse will be like manure on the surface of the ground in the plot of land at Jezreel so that no one will be able to say: This is Jezebel.\' &quot;";
kjv[1] = "And Elisha the prophet called one of the children of the prophets, and said unto him, Gird up thy loins, and take this box of oil in thine hand, and go to Ramothgilead:";
kjv[2] = "And when thou comest thither, look out there Jehu the son of Jehoshaphat the son of Nimshi, and go in, and make him arise up from among his brethren, and carry him to an inner chamber;";
kjv[3] = "Then take the box of oil, and pour [it] on his head, and say, Thus saith the LORD, I have anointed thee king over Israel. Then open the door, and flee, and tarry not.";
kjv[4] = "So the young man, [even] the young man the prophet, went to Ramothgilead.";
kjv[5] = "And when he came, behold, the captains of the host [were] sitting; and he said, I have an errand to thee, O captain. And Jehu said, Unto which of all us? And he said, To thee, O captain.";
kjv[6] = "And he arose, and went into the house; and he poured the oil on his head, and said unto him, Thus saith the LORD God of Israel, I have anointed thee king over the people of the LORD, [even] over Israel.";
kjv[7] = "And thou shalt smite the house of Ahab thy master, that I may avenge the blood of my servants the prophets, and the blood of all the servants of the LORD, at the hand of Jezebel.";
kjv[8] = "For the whole house of Ahab shall perish: and I will cut off from Ahab him that pisseth against the wall, and him that is shut up and left in Israel:";
kjv[9] = "And I will make the house of Ahab like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah:";
kjv[10] = "And the dogs shall eat Jezebel in the portion of Jezreel, and [there shall be] none to bury [her]. And he opened the door, and fled.";
kjv[11] = "Then Jehu came forth to the servants of his lord: and [one] said unto him, [Is] all well? wherefore came this mad [fellow] to thee? And he said unto them, Ye know the man, and his communication.";
kjv[12] = "And they said, [It is] false; tell us now. And he said, Thus and thus spake he to me, saying, Thus saith the LORD, I have anointed thee king over Israel.";
kjv[13] = "Then they hasted, and took every man his garment, and put [it] under him on the top of the stairs, and blew with trumpets, saying, Jehu is king.";
kjv[14] = "So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram had kept Ramothgilead, he and all Israel, because of Hazael king of Syria.";
kjv[15] = "But king Joram was returned to be healed in Jezreel of the wounds which the Syrians had given him, when he fought with Hazael king of Syria.) And Jehu said, If it be your minds, [then] let none go forth [nor] escape out of the city to go to tell [it] in Jezreel.";
kjv[16] = "So Jehu rode in a chariot, and went to Jezreel; for Joram lay there. And Ahaziah king of Judah was come down to see Joram.";
kjv[17] = "And there stood a watchman on the tower in Jezreel, and he spied the company of Jehu as he came, and said, I see a company. And Joram said, Take an horseman, and send to meet them, and let him say, [Is it] peace?";
kjv[18] = "So there went one on horseback to meet him, and said, Thus saith the king, [Is it] peace? And Jehu said, What hast thou to do with peace? turn thee behind me. And the watchman told, saying, The messenger came to them, but he cometh not again.";
kjv[19] = "Then he sent out a second on horseback, which came to them, and said, Thus saith the king, [Is it] peace? And Jehu answered, What hast thou to do with peace? turn thee behind me.";
kjv[20] = "And the watchman told, saying, He came even unto them, and cometh not again: and the driving [is] like the driving of Jehu the son of Nimshi; for he driveth furiously.";
kjv[21] = "And Joram said, Make ready. And his chariot was made ready. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot, and they went out against Jehu, and met him in the portion of Naboth the Jezreelite.";
kjv[22] = "And it came to pass, when Joram saw Jehu, that he said, [Is it] peace, Jehu? And he answered, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts [are so] many?";
kjv[23] = "And Joram turned his hands, and fled, and said to Ahaziah, [There is] treachery, O Ahaziah.";
kjv[24] = "And Jehu drew a bow with his full strength, and smote Jehoram between his arms, and the arrow went out at his heart, and he sunk down in his chariot.";
kjv[25] = "Then said [Jehu] to Bidkar his captain, Take up, [and] cast him in the portion of the field of Naboth the Jezreelite: for remember how that, when I and thou rode together after Ahab his father, the LORD laid this burden upon him;";
kjv[26] = "Surely I have seen yesterday the blood of Naboth, and the blood of his sons, saith the LORD; and I will requite thee in this plat, saith the LORD. Now therefore take [and] cast him into the plat [of ground], according to the word of the LORD.";
kjv[27] = "But when Ahaziah the king of Judah saw [this], he fled by the way of the garden house. And Jehu followed after him, and said, Smite him also in the chariot. [And they did so] at the going up to Gur, which [is] by Ibleam. And he fled to Megiddo, and died there.";
kjv[28] = "And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David.";
kjv[29] = "And in the eleventh year of Joram the son of Ahab began Ahaziah to reign over Judah.";
kjv[30] = "And when Jehu was come to Jezreel, Jezebel heard [of it]; and she painted her face, and tired her head, and looked out at a window.";
kjv[31] = "And as Jehu entered in at the gate, she said, [Had] Zimri peace, who slew his master?";
kjv[32] = "And he lifted up his face to the window, and said, Who [is] on my side? who? And there looked out to him two [or] three eunuchs.";
kjv[33] = "And he said, Throw her down. So they threw her down: and [some] of her blood was sprinkled on the wall, and on the horses: and he trode her under foot.";
kjv[34] = "And when he was come in, he did eat and drink, and said, Go, see now this cursed [woman], and bury her: for she [is] a king\'s daughter.";
kjv[35] = "And they went to bury her: but they found no more of her than the skull, and the feet, and the palms of [her] hands.";
kjv[36] = "Wherefore they came again, and told him. And he said, This [is] the word of the LORD, which he spake by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall dogs eat the flesh of Jezebel:";
kjv[37] = "And the carcase of Jezebel shall be as dung upon the face of the field in the portion of Jezreel; [so] that they shall not say, This [is] Jezebel.";

rsv[11] = "When Jehu came out to the servants of his master, they said to him, &quot;Is all well? Why did this mad fellow come to you?&quot; And he said to them, &quot;You know the fellow and his talk.&quot;";
asv[11] = "Then Jehu came forth to the servants of his lord: and one said unto him, Is all well? wherefore came this mad fellow to thee? And he said unto them, Ye know the man and what his talk was.";
yng[11] = "And Jehu hath gone out unto the servants of his lord, and [one] saith to him, `Is there peace? wherefore came this madman unto thee?\' and he saith unto them, `Ye have known the man and his talk.\'";
dby[11] = "And Jehu came forth to the servants of his lord. And one said to him, Is all well? why came this madman to thee? And he said to them, Ye know the man, and his mind.";
web[11] = "Then Jehu came forth to the servants of his lord: and [one] said to him, [Is] all well? Why came this mad [man] to thee? And he said to them, Ye know the man, and his communication.";
hnv[11] = "Then Yehu came forth to the servants of his lord: and one said to him, Is all well? why came this mad fellow to you? He said to them, You know the man and what his talk was.";
vul[11] = "Hieu autem egressus est ad servos domini sui qui dixerunt ei rectene sunt omnia quid venit insanus iste ad te qui ait eis nostis hominem et quid locutus sit";
rsv[12] = "And they said, &quot;That is not true; tell us now.&quot; And he said, &quot;Thus and so he spoke to me, saying, \'Thus says the LORD, I anoint you king over Israel.\'&quot;";
asv[12] = "And they said, It is false; tell us now. And he said, Thus and thus spake he to me, saying, Thus saith Jehovah, I have anointed thee king over Israel.";
yng[12] = "And they say, `False, declare, we pray thee, to us;\' and he saith, `Thus and thus spake he unto me, saying, Thus said Jehovah, I have anointed thee for king unto Israel.\'";
dby[12] = "And they said, It is false! tell us now. And he said, Thus and thus spoke he to me saying, Thus saith Jehovah: I have anointed thee king over Israel.";
web[12] = "And they said, [It is] false; tell us now. And he said, Thus and thus he spoke to me, saying, Thus saith the LORD, I have anointed thee king over Israel.";
hnv[12] = "They said, It is false; tell us now. He said, Thus and thus spoke he to me, saying, Thus says the LORD, I have anointed you king over Yisra\'el.";
vul[12] = "at illi responderunt falsum est sed magis narra nobis qui ait eis haec et haec locutus est mihi et ait haec dicit Dominus unxi te regem super Israhel";
rsv[13] = "Then in haste every man of them took his garment, and put it under him on the bare steps, and they blew the trumpet, and proclaimed, &quot;Jehu is king.&quot;";
asv[13] = "Then they hasted, and took every man his garment, and put it under him on the top of the stairs, and blew the trumpet, saying, Jehu is king.";
yng[13] = "And they haste and take each his garment, and put [it] under him at the top of the stairs, and blow with a trumpet, and say, `Reigned hath Jehu!\'";
dby[13] = "Then they hasted and took every man his garment, and put it under him on the very stairs, and blew with trumpets, and said, Jehu is king!";
web[13] = "Then they hasted, and took every man his garment, and put [it] under him on the top of the stairs, and blew with trumpets, saying, Jehu is king.";
hnv[13] = "Then they hurried, and took every man his garment, and put it under him on the top of the stairs, and blew the shofar, saying, Yehu is king.";
vul[13] = "festinaverunt itaque et unusquisque tollens pallium suum posuerunt sub pedibus eius in similitudinem tribunalis et cecinerunt tuba atque dixerunt regnavit Hieu";
rsv[14] = "Thus Jehu the son of Jehosh\'aphat the son of Nimshi conspired against Joram. (Now Joram with all Israel had been on guard at Ramoth-gilead against Haz\'ael king of Syria;";
asv[14] = "So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram was keeping Ramoth-gilead, he and all Israel, because of Hazael king of Syria;";
yng[14] = "And Jehu son of Jehoshaphat, son of Nimshi, conspireth against Joram -- (and Joram was keeping in Ramoth-Gilead, he and all Israel, from the presence of Hazael king of Aram,";
dby[14] = "And Jehu the son of Jehoshaphat, son of Nimshi, conspired against Joram. (Now Joram kept Ramoth-Gilead, he and all Israel, because of Hazael king of Syria;";
web[14] = "So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram had kept Ramoth-gilead, he and all Israel, because of Hazael king of Syria.";
hnv[14] = "So Yehu the son of Yehoshafat the son of Nimshi conspired against Yoram. (Now Yoram was keeping Ramot-Gil`ad, he and all Yisra\'el, because of Haza\'el king of Aram;";
vul[14] = "coniuravit ergo Hieu filius Iosaphat filii Namsi contra Ioram porro Ioram obsederat Ramoth Galaad ipse et omnis Israhel contra Azahel regem Syriae";
rsv[15] = "but King Joram had returned to be healed in Jezreel of the wounds which the Syrians had given him, when he fought with Haz\'ael king of Syria.) So Jehu said, &quot;If this is your mind, then let no one slip out of the city to go and tell the news in Jezreel.&quot;";
asv[15] = "but king Joram was returned to be healed in Jezreel of the wounds which the Syrians had given him, when he fought with Hazael king of Syria.) And Jehu said, If this be your mind, then let none escape and go forth out of the city, to go to tell it in Jezreel.";
yng[15] = "and king Joram turneth back to be healed in Jezreel, of the wounds with which the Aramaeans smite him, in his fighting with Hazael king of Aram) -- and Jehu saith, `If it is your mind, let not an escaped one go out from the city, to go to declare [it] in Jezreel.\'";
dby[15] = "and king Joram had returned to be healed in Jizreel of the wounds that the Syrians had given him, when he fought against Hazael king of Syria.) And Jehu said, If it be your will, let not a fugitive escape out of the city to go to tell [it] in Jizreel.";
web[15] = "But king Joram had returned to be healed in Jezreel of the wounds which the Syrians had given him, when he fought with Hazael king of Syria.) And Jehu said, If it is your minds, [then] let none go forth [nor] escape from the city to go to tell [it] in Jezreel.";
hnv[15] = "but king Yoram was returned to be healed in Yizre`el of the wounds which the Aram had given him, when he fought with Haza\'el king of Aram.) Yehu said, If this be your mind, then let none escape and go forth out of the city, to go to tell it in Yizre`el.";
vul[15] = "et reversus fuerat ut curaretur in Hiezrahel propter vulnera quia percusserant eum Syri proeliantem contra Azahel regem Syriae dixitque Hieu si placet vobis nemo egrediatur profugus de civitate ne vadat et nuntiet in Hiezrahel";
rsv[16] = "Then Jehu mounted his chariot, and went to Jezreel, for Joram lay there. And Ahazi\'ah king of Judah had come down to visit Joram.";
asv[16] = "So Jehu rode in a chariot, and went to Jezreel; for Joram lay there. And Ahaziah king of Judah was come down to see Joram.";
yng[16] = "And Jehu rideth, and goeth to Jezreel, for Joram is lying there, and Ahaziah king of Judah hath gone down to see Joram.";
dby[16] = "And Jehu rode in a chariot and went to Jizreel; for Joram lay there. And Ahaziah king of Judah had come down to see Joram.";
web[16] = "So Jehu rode in a chariot, and went to Jezreel; for Joram lay there. And Ahaziah king of Judah had come down to see Joram.";
hnv[16] = "So Yehu rode in a chariot, and went to Yizre`el; for Yoram lay there. Achazyah king of Yehudah was come down to see Yoram.";
vul[16] = "et ascendit et profectus est in Hiezrahel Ioram enim aegrotabat ibi et Ahazia rex Iuda descenderat ad visitandum Ioram";
rsv[17] = "Now the watchman was standing on the tower in Jezreel, and he spied the company of Jehu as he came, and said, &quot;I see a company.&quot; And Joram said, &quot;Take a horseman, and send to meet them, and let him say, \'Is it peace?\'&quot;";
asv[17] = "Now the watchman was standing on the tower in Jezreel, and he spied the company of Jehu as he came, and said, I see a company. And Joram said, Take a horseman, and send to meet them, and let him say, Is it peace?";
yng[17] = "And the watchman is standing on the tower in Jezreel, and seeth the company of Jehu in his coming, and saith, `A company I see;\' and Joram saith, `Take a rider and send to meet them, and let him say, Is there peace?\'";
dby[17] = "And the watchman stood on the tower in Jizreel, and saw Jehu\'s company as he came, and said, I see a company. And Joram said, Take a horseman, and send to meet them, and let him say, Is it peace?";
web[17] = "And there stood a watchman on the tower in Jezreel, and he spied the company of Jehu as he came, and said, I see a company. And Joram said, Take a horseman, and send to meet them, and let him say, [Is it] peace?";
hnv[17] = "Now the watchman was standing on the tower in Yizre`el, and he spied the company of Yehu as he came, and said, I see a company. Yoram said, Take a horseman, and send to meet them, and let him say, Is it shalom?";
vul[17] = "igitur speculator qui stabat super turrem Hiezrahel vidit globum Hieu venientis et ait video ego globum dixitque Ioram tolle currum et mitte in occursum eorum et dicat vadens rectene sunt omnia";
rsv[18] = "So a man on horseback went to meet him, and said, &quot;Thus says the king, \'Is it peace?\'&quot; And Jehu said, &quot;What have you to do with peace? Turn round and ride behind me.&quot; And the watchman reported, saying, &quot;The messenger reached them, but he is not coming back.&quot;";
asv[18] = "So there went one on horseback to meet him, and said, Thus saith the king, Is it peace? And Jehu said, What hast thou to do with peace? turn thee behind me. And the watchman told, saying, The messenger came to them, but he cometh not back.";
yng[18] = "and the rider on the horse goeth to meet him, and saith, `Thus said the king, Is there peace?\' and Jehu saith, `What -- to thee and to peace? turn round behind me.\' And the watchman declareth, saying, `The messenger came unto them, and he hath not returned.\'";
dby[18] = "So there went one on horseback to meet him; and he said, Thus saith the king: Is it peace? And Jehu said, What hast thou to do with peace? turn thee behind me. And the watchman told saying, The messenger came to them, and he does not return.";
web[18] = "So there went one on horseback to meet him, and said, Thus saith the king, [Is it] peace? And Jehu said, What hast thou to do with peace? turn thee behind me. And the watchman told, saying, The messenger came to them, but he doth not return.";
hnv[18] = "So there went one on horseback to meet him, and said, Thus says the king, Is it shalom? Yehu said, What have you to do with shalom? turn you behind me. The watchman told, saying, The messenger came to them, but he isn\'t coming back.";
vul[18] = "abiit igitur qui ascenderat currum in occursum eius et ait haec dicit rex pacata sunt omnia dixitque ei Hieu quid tibi et paci transi et sequere me nuntiavit quoque speculator dicens venit nuntius ad eos et non revertitur";
rsv[19] = "Then he sent out a second horseman, who came to them, and said, &quot;Thus the king has said, \'Is it peace?\'&quot; And Jehu answered, &quot;What have you to do with peace? Turn round and ride behind me.&quot;";
asv[19] = "Then he sent out a second on horseback, who came to them, and said, Thus saith the king, Is it peace? And Jehu answered, What hast thou to do with peace? turn thee behind me.";
yng[19] = "And he sendeth a second rider on a horse, and he cometh in unto them, and saith, `Thus said the king, Is there peace?\' and Jehu saith, `What -- to thee and to peace? turn round behind me.\'";
dby[19] = "And he sent out a second on horseback; and he came to them and said, Thus saith the king: Is it peace? And Jehu said, What hast thou to do with peace? turn thee behind me.";
web[19] = "Then he sent out a second on horseback, who came to them, and said, Thus saith the king, [Is it] peace? And Jehu answered, What hast thou to do with peace? turn thee behind me.";
hnv[19] = "Then he sent out a second on horseback, who came to them, and said, Thus says the king, Is it shalom? Yehu answered, What have you to do with shalom? turn you behind me.";
vul[19] = "misit etiam currum equorum secundum venitque ad eos et ait haec dicit rex num pax est et ait Hieu quid tibi et paci transi et sequere me";
rsv[20] = "Again the watchman reported, &quot;He reached them, but he is not coming back. And the driving is like the driving of Jehu the son of Nimshi; for he drives furiously.&quot;";
asv[20] = "And the watchman told, saying, He came even unto them, and cometh not back: and the driving is like the driving of Jehu the son of Nimshi; for he driveth furiously.";
yng[20] = "And the watchman declareth, saying, `He came unto them, and he hath not returned, and the driving [is] like the driving of Jehu son of Nimshi, for with madness he driveth.\'";
dby[20] = "And the watchman told saying, He came to them, and does not return. And the driving is like the driving of Jehu the son of Nimshi; for he drives furiously.";
web[20] = "And the watchman told, saying, He came even to them, and doth not return? and the driving [is] like the driving of Jehu the son of Nimshi; for he driveth furiously.";
hnv[20] = "The watchman told, saying, He came even to them, and isn\'t coming back: and the driving is like the driving of Yehu the son of Nimshi; for he drives furiously.";
vul[20] = "nuntiavit autem speculator dicens venit usque ad eos et non revertitur est autem incessus quasi incessus Hieu filii Namsi praeceps enim graditur";
rsv[21] = "Joram said, &quot;Make ready.&quot; And they made ready his chariot. Then Joram king of Israel and Ahazi\'ah king of Judah set out, each in his chariot, and went to meet Jehu, and met him at the property of Naboth the Jezreelite.";
asv[21] = "And Joram said, Make ready. And they made ready his chariot. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot, and they went out to meet Jehu, and found him in the portion of Naboth the Jezreelite.";
yng[21] = "And Jehoram saith, `Harness;\' and his chariot is harnessed, and Jehoram king of Israel goeth out, and Ahaziah king of Judah, each in his chariot, and they go out to meet Jehu, and find him in the portion of Naboth the Jezreelite.";
dby[21] = "Then Joram said, Make ready! And they made ready his chariot. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot; and they went out to meet Jehu, and met him in the plot of Naboth the Jizreelite.";
web[21] = "And Joram said, Make ready. And his chariot was made ready. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot, and they went out against Jehu, and met him in the portion of Naboth the Jezreelite.";
hnv[21] = "Yoram said, Make ready. They made ready his chariot. Yoram king of Yisra\'el and Achazyah king of Yehudah went out, each in his chariot, and they went out to meet Yehu, and found him in the portion of Navot the Yizre`eli.";
vul[21] = "et ait Ioram iunge currum iunxeruntque currum eius et egressus est Ioram rex Israhel et Ahazias rex Iuda singuli in curribus suis egressique sunt in occursum Hieu et invenerunt eum in agro Naboth Hiezrahelitis";
rsv[22] = "And when Joram saw Jehu, he said, &quot;Is it peace, Jehu?&quot; He answered, &quot;What peace can there be, so long as the harlotries and the sorceries of your mother Jez\'ebel are so many?&quot;";
asv[22] = "And it came to pass, when Joram saw Jehu, that he said, Is it peace, Jehu? And he answered, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?";
yng[22] = "And it cometh to pass, at Jehoram\'s seeing Jehu, that he saith, `Is there peace, Jehu?\' and he saith, `What [is] the peace, while the whoredoms of Jezebel thy mother, and her witchcrafts, are many?\'";
dby[22] = "And it came to pass when Joram saw Jehu, that he said, Is it peace, Jehu? And he said, What peace, so long as the fornications of thy mother Jezebel and her sorceries are so many?";
web[22] = "And it came to pass, when Joram saw Jehu, that he said, [Is it] peace, Jehu? And he answered, What peace, so long as the lewd acts of thy mother Jezebel and her witchcrafts [are so] many?";
hnv[22] = "It happened, when Yoram saw Yehu, that he said, Is it shalom, Yehu? He answered, What shalom, so long as the prostitution of your mother Izevel and her witchcraft abound?";
vul[22] = "cumque vidisset Ioram Hieu dixit pax est Hieu at ille respondit quae pax adhuc fornicationes Hiezabel matris tuae et veneficia eius multa vigent";
rsv[23] = "Then Joram reined about and fled, saying to Ahazi\'ah, &quot;Treachery, O Ahazi\'ah!&quot;";
asv[23] = "And Joram turned his hands, and fled, and said to Ahaziah, There is treachery, O Ahaziah.";
yng[23] = "And Jehoram turneth his hands, and fleeth, and saith unto Ahaziah, `Deceit, O Ahaziah!\'";
dby[23] = "Then Joram turned his hand, and fled, and said to Ahaziah, Treachery, Ahaziah!";
web[23] = "And Joram turned his hands, and fled, and said to Ahaziah, [There is] treachery, O Ahaziah.";
hnv[23] = "Yoram turned his hands, and fled, and said to Achazyah, There is treachery, Achazyah.";
vul[23] = "convertit autem Ioram manum suam et fugiens ait ad Ahaziam insidiae Ahazia";
rsv[24] = "And Jehu drew his bow with his full strength, and shot Joram between the shoulders, so that the arrow pierced his heart, and he sank in his chariot.";
asv[24] = "And Jehu drew his bow with his full strength, and smote Joram between his arms; and the arrow went out at his heart, and he sunk down in his chariot.";
yng[24] = "And Jehu hath filled his hand with a bow, and smiteth Jehoram between his arms, and the arrow goeth out from his heart, and he boweth down in his chariot.";
dby[24] = "And Jehu took his bow in his hand, and smote Jehoram between his arms, and the arrow went out through his heart; and he sank down in his chariot.";
web[24] = "And Jehu drew a bow with his full strength, and smote Jehoram between his arms, and the arrow went out at his heart, and he sunk down in his chariot.";
hnv[24] = "Yehu drew his bow with his full strength, and struck Yoram between his arms; and the arrow went out at his heart, and he sunk down in his chariot.";
vul[24] = "porro Hieu tetendit arcum manu et percussit Ioram inter scapulas et egressa est sagitta per cor eius statimque corruit in curru suo";
rsv[25] = "Jehu said to Bidkar his aide, &quot;Take him up, and cast him on the plot of ground belonging to Naboth the Jezreelite; for remember, when you and I rode side by side behind Ahab his father, how the LORD uttered this oracle against him:";
asv[25] = "Then said [Jehu] to Bidkar his captain, Take up, and cast him in the portion of the field of Naboth the Jezreelite; for remember how that, when I and thou rode together after Ahab his father, Jehovah laid this burden upon him:";
yng[25] = "And [Jehu] saith unto Bidkar his captain, `Lift up, cast him into the portion of the field of Naboth the Jezreelite -- for, remember, I and thou were riding together after Ahab his father, and Jehovah lifted upon him this burden:";
dby[25] = "And he said to Bidkar his captain, Take him up [and] cast him in the plot of the field of Naboth the Jizreelite. For remember how, when I and thou rode together after Ahab his father, that Jehovah laid this burden upon him:";
web[25] = "Then said [Jehu] to Bidkar his captain, Take up, [and] cast him into the portion of the field of Naboth the Jezreelite; for remember how that, when I and thou rode together after Ahab his father, the LORD laid this burden upon him;";
hnv[25] = "Then said [Yehu] to Bidgar his captain, Take up, and cast him in the portion of the field of Navot the Yizre`eli; for remember how that, when I and you rode together after Ach\'av his father, the LORD laid this burden on him:";
vul[25] = "dixitque Hieu ad Baddacer ducem tolle proice eum in agro Naboth Hiezrahelitae memini enim quando ego et tu sedentes in curru sequebamur Ahab patrem huius quod Dominus onus hoc levaverit super eum dicens";
rsv[26] = "\'As surely as I saw yesterday the blood of Naboth and the blood of his sons--says the LORD--I will requite you on this plot of ground.\' Now therefore take him up and cast him on the plot of ground, in accordance with the word of the LORD.&quot;";
asv[26] = "Surely I have seen yesterday the blood of Naboth, and the blood of his sons, saith Jehovah; and I will requite thee in this plat, saith Jehovah. Now therefore take and cast him into the plat [of ground], according to the word of Jehovah.";
yng[26] = "Have I not the blood of Naboth and the blood of his sons seen yesternight -- the affirmation of Jehovah -- yea, I have recompensed to thee in this portion -- the affirmation of Jehovah; -- and now, lift up, cast him into the portion, according to the word of Jehovah.\'";
dby[26] = "Certainly I have seen yesterday the blood of Naboth, and the blood of his sons, saith Jehovah; and I will requite thee in this plot, saith Jehovah. And now, take [and] cast him into the plot, according to the word of Jehovah.";
web[26] = "Surely I saw yesterday the blood of Naboth, and the blood of his sons, saith the LORD; and I will requite thee in this plat, saith the LORD. Now therefore take [and] cast him into the plat [of ground], according to the word of the LORD.";
hnv[26] = "Surely I have seen yesterday the blood of Navot, and the blood of his sons, says the LORD; and I will requite you in this plat, says the LORD. Now therefore take and cast him into the plat [of ground], according to the word of the LORD.";
vul[26] = "si non pro sanguine Naboth et pro sanguine filiorum eius quem vidi heri ait Dominus reddam tibi in agro isto dicit Dominus nunc igitur tolle proice eum in agro iuxta verbum Domini";
rsv[27] = "When Ahazi\'ah the king of Judah saw this, he fled in the direction of Beth-haggan. And Jehu pursued him, and said, &quot;Shoot him also&quot;; and they shot him in the chariot at the ascent of Gur, which is by Ibleam. And he fled to Megid\'do, and died there.";
asv[27] = "But when Ahaziah the king of Judah saw this, he fled by the way of the garden-house. And Jehu followed after him, and said, Smite him also in the chariot: [and they smote him] at the ascent of Gur, which is by Ibleam. And he fled to Megiddo, and died there.";
yng[27] = "And Ahaziah king of Judah hath seen, and fleeth the way of the garden-house, and Jehu pursueth after him, and saith, `Smite him -- also him -- in the chariot,\' in the going up to Gur, that [is] Ibleam, and he fleeth to Megiddo, and dieth there,";
dby[27] = "When Ahaziah king of Judah saw [that], he fled by the way of the garden-house. And Jehu followed after him, and said, Smite him also in his chariot. It was on the ascent of Gur, which is by Jibleam. And he fled to Megiddo, and died there.";
web[27] = "But when Ahaziah the king of Judah saw [this], he fled by the way of the garden house. And Jehu followed him, and said, Smite him also in the chariot. [And they did so] at the going up to Gur, which [is] by Ibleam. And he fled to Megiddo, and died there.";
hnv[27] = "But when Achazyah the king of Yehudah saw this, he fled by the way of the Beit-Haggan. Yehu followed after him, and said, Smite him also in the chariot: [and they struck him] at the ascent of Gur, which is by Yivle`am. He fled to Megiddo, and died there.";
vul[27] = "Ahazias autem rex Iuda videns hoc fugit per viam domus horti persecutusque est eum Hieu et ait etiam hunc percutite in curru suo in ascensu Gaber qui est iuxta Ieblaam qui fugit in Mageddo et mortuus est ibi";
rsv[28] = "His servants carried him in a chariot to Jerusalem, and buried him in his tomb with his fathers in the city of David.";
asv[28] = "And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David.";
yng[28] = "and his servants carry him in a chariot to Jerusalem, and bury him in his burying-place, with his fathers, in the city of David.";
dby[28] = "And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David.";
web[28] = "And his servants carried him in a chariot to Jerusalem, and buried him in his sepulcher with his fathers in the city of David.";
hnv[28] = "His servants carried him in a chariot to Yerushalayim, and buried him in his tomb with his fathers in the city of David.";
vul[28] = "et inposuerunt eum servi eius super currum suum et tulerunt Hierusalem sepelieruntque in sepulchro cum patribus suis in civitate David";
rsv[29] = "In the eleventh year of Joram the son of Ahab, Ahazi\'ah began to reign over Judah.";
asv[29] = "And in the eleventh year of Joram the son of Ahab began Ahaziah to reign over Judah.";
yng[29] = "And in the eleventh year of Joram son of Ahab reign did Ahaziah over Judah.";
dby[29] = "(And in the eleventh year of Joram the son of Ahab had Ahaziah begun to reign over Judah.)";
web[29] = "And in the eleventh year of Joram the son of Ahab began Ahaziah to reign over Judah.";
hnv[29] = "In the eleventh year of Yoram the son of Ach\'av began Achazyah to reign over Yehudah.";
vul[29] = "anno undecimo Ioram filii Ahab rege Ahazia super Iudam";
rsv[30] = "When Jehu came to Jezreel, Jez\'ebel heard of it; and she painted her eyes, and adorned her head, and looked out of the window.";
asv[30] = "And when Jehu was come to Jezreel, Jezebel heard of it; and she painted her eyes, and attired her head, and looked out at the window.";
yng[30] = "And Jehu cometh in to Jezreel, and Jezebel hath heard, and putteth her eyes in paint and maketh right her head, and looketh out through the window.";
dby[30] = "And Jehu came to Jizreel; and Jezebel heard of it, and she put paint to her eyes, and decked her head, and looked out at the window.";
web[30] = "And when Jehu had come to Jezreel, Jezebel heard [of it]; and she painted her face, and adorned her head, and looked out at a window.";
hnv[30] = " When Yehu was come to Yizre`el, Izevel heard of it; and she painted her eyes, and attired her head, and looked out at the window.";
vul[30] = "venit Hieu Hiezrahel porro Hiezabel introitu eius audito depinxit oculos suos stibio et ornavit caput suum et respexit per fenestram";
rsv[31] = "And as Jehu entered the gate, she said, &quot;Is it peace, you Zimri, murderer of your master?&quot;";
asv[31] = "And as Jehu entered in at the gate, she said, Is it peace, thou Zimri, thy master\'s murderer?";
yng[31] = "And Jehu hath come into the gate, and she saith, `Was there peace [to] Zimri -- slayer of his lord?\'";
dby[31] = "And when Jehu came in at the gate, she said, Is it peace, Zimri, murderer of his master?";
web[31] = "And as Jehu entered the gate, she said, [Had] Zimri peace, who slew his master?";
hnv[31] = "As Yehu entered in at the gate, she said, Is it shalom, you Zimri, your master\'s murderer?";
vul[31] = "ingredientem Hieu per portam et ait numquid pax esse potest Zamri qui interfecit dominum suum";
rsv[32] = "And he lifted up his face to the window, and said, &quot;Who is on my side? Who?&quot; Two or three eunuchs looked out at him.";
asv[32] = "And he lifted up his face to the window, and said, Who is on my side? who? And there looked out to him two or three eunuchs.";
yng[32] = "And he lifteth up his face unto the window, and saith, `Who [is] with me? -- who?\' and look out unto him do two [or] three eunuchs;";
dby[32] = "And he lifted up his face to the window, and said, Who is on my side? who? And two or three chamberlains looked out to him.";
web[32] = "And he lifted up his face to the window, and said, Who [is] on my side? who? And there looked out to him two [or] three eunuchs.";
hnv[32] = "He lifted up his face to the window, and said, Who is on my side? who? There looked out to him two or three eunuchs.";
vul[32] = "levavitque Hieu faciem suam ad fenestram et ait quae est ista et inclinaverunt se ad eum duo vel tres eunuchi";
rsv[33] = "He said, &quot;Throw her down.&quot; So they threw her down; and some of her blood spattered on the wall and on the horses, and they trampled on her.";
asv[33] = "And he said, Throw her down. So they threw her down; and some of her blood was sprinkled on the wall, and on the horses: and he trod her under foot.";
yng[33] = "And he saith, `Let her go;\' and they let her go, and [some] of her blood is sprinkled on the wall, and on the horses, and he treadeth her down.";
dby[33] = "And he said, Throw her down! And they threw her down; and some of her blood was sprinkled on the wall, and on the horses; and he trampled on her.";
web[33] = "And he said, Throw her down. So they threw her down: and [some] of her blood was sprinkled on the wall, and on the horses: and he trod her under foot.";
hnv[33] = "He said, Throw her down. So they threw her down; and some of her blood was sprinkled on the wall, and on the horses: and he trod her under foot.";
vul[33] = "at ille dixit eis praecipitate eam deorsum et praecipitaverunt eam aspersusque est sanguine paries et equorum ungulae qui conculcaverunt eam";
rsv[34] = "Then he went in and ate and drank; and he said, &quot;See now to this cursed woman, and bury her; for she is a king\'s daughter.&quot;";
asv[34] = "And when he was come in, he did eat and drink; and he said, See now to this cursed woman, and bury her; for she is a king\'s daughter.";
yng[34] = "And he cometh in, and eateth, and drinketh, and saith, `Look after, I pray you, this cursed one, and bury her, for she [is] a king\'s daughter.\'";
dby[34] = "And he came in, and ate and drank; and he said, Go, look, I pray you, after this cursed [woman], and bury her; for she is a king\'s daughter.";
web[34] = "And when he had come in, he ate, and drank, and said, Go, see now this cursed [woman], and bury her: for she [is] a king\'s daughter.";
hnv[34] = "When he was come in, he ate and drink; and he said, See now to this cursed woman, and bury her; for she is a king\'s daughter.";
vul[34] = "cumque ingressus esset et comederet bibissetque ait ite videte maledictam illam et sepelite eam quia filia regis est";
rsv[35] = "But when they went to bury her, they found no more of her than the skull and the feet and the palms of her hands.";
asv[35] = "And they went to bury her; but they found no more of her than the skull, and the feet, and the palms of her hands.";
yng[35] = "And they go to bury her, and have not found of her except the skull, and the feet, and the palms of the hands.";
dby[35] = "And they went to bury her; but they found no more of her than the skull, and the feet, and the palms of the hands.";
web[35] = "And they went to bury her: but they found no more of her than the skull, and the feet, and the palms of [her] hands.";
hnv[35] = "They went to bury her; but they found no more of her than the skull, and the feet, and the palms of her hands.";
vul[35] = "cumque issent ut sepelirent eam non invenerunt nisi calvariam et pedes et summas manus";
rsv[36] = "When they came back and told him, he said, &quot;This is the word of the LORD, which he spoke by his servant Eli\'jah the Tishbite, \'In the territory of Jezreel the dogs shall eat the flesh of Jez\'ebel;";
asv[36] = "Wherefore they came back, and told him. And he said, This is the word of Jehovah, which he spake by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall the dogs eat the flesh of Jezebel;";
yng[36] = "And they turn back, and declare to him, and he saith, `The word of Jehovah it [is], that He spake by the hand of this servant Elijah the Tishbite, saying, In the portion of Jezreel do the dogs eat the flesh of Jezebel,";
dby[36] = "And they came back and told him. And he said, This is the word of Jehovah, which he spoke through his servant Elijah the Tishbite saying, In the plot of Jizreel shall dogs eat the flesh of Jezebel;";
web[36] = "Wherefore they came again, and told him. And he said, This [is] the word of the LORD, which he spoke by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall dogs eat the flesh of Jezebel:";
hnv[36] = " Therefore they came back, and told him. He said, This is the word of the LORD, which he spoke by his servant Eliyah the Tishbi, saying, In the portion of Yizre`el shall the dogs eat the flesh of Izevel;";
vul[36] = "reversique nuntiaverunt ei et ait Hieu sermo Domini est quem locutus est per servum suum Heliam Thesbiten dicens in agro Hiezrahel comedent canes carnes Hiezabel";
rsv[37] = "and the corpse of Jez\'ebel shall be as dung upon the face of the field in the territory of Jezreel, so that no one can say, This is Jez\'ebel.\'&quot;";
asv[37] = "and the body of Jezebel shall be as dung upon the face of the field in the portion of Jezreel, so that they shall not say, This is Jezebel.";
yng[37] = "and the carcase of Jezebel hath been as dung on the face of the field in the portion of Jezreel, that they say not, This [is] Jezebel.\'";
dby[37] = "and the carcase of Jezebel shall be as dung upon the open field in the plot of Jizreel, so that they shall not say, This is Jezebel.";
web[37] = "And the carcass of Jezebel shall be as dung upon the face of the field in the portion of Jezreel; [so] that they shall not say, This [is] Jezebel.";
hnv[37] = " and the body of Izevel shall be as dung on the face of the field in the portion of Yizre`el, so that they shall not say, This is Izevel.";
vul[37] = "et erunt carnes Hiezabel sicut stercus super faciem terrae in agro Hiezrahel ita ut praetereuntes dicant haecine est illa Hiezabel";
