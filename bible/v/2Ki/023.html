csb[1] = "So the king sent messengers, and they gathered all the elders of Judah and Jerusalem to him.";
csb[2] = "Then the king went to the LORD\'s temple with all the men of Judah and all the inhabitants of Jerusalem, as well as the priests and the prophets -- all the people from the youngest to the oldest. He read in their hearing all the words of the book of the covenant that had been found in the LORD\'s temple.";
csb[3] = "Next, the king stood by the pillar and made a covenant in the LORD\'s presence to follow the LORD and to keep his commands, his decrees, and his statutes with all his heart and with all his soul in order to carry out the words of this covenant that were written in this book; all the people agreed to the covenant.";
csb[4] = "Then the king commanded the high priest Hilkiah and the priests of the second rank and the doorkeepers to bring out of the LORD\'s sanctuary all the articles made for Baal, Asherah, and all the stars in the sky. He burned them outside Jerusalem in the fields of the Kidron and carried their ashes to Bethel.";
csb[5] = "Then he did away with the idolatrous priests the kings of Judah had appointed to burn incense at the high places in the cities of Judah and in the areas surrounding Jerusalem. They had burned incense to Baal, and to the sun, moon, constellations, and all the stars in the sky.";
csb[6] = "He brought out the Asherah pole from the LORD\'s temple to the Kidron Valley outside Jerusalem. He burned it at the Kidron Valley, beat it to dust, and threw its dust on the graves of the common people.";
csb[7] = "He also tore down the houses of the male cult prostitutes that were in the LORD\'s temple, in which the women were weaving tapestries for Asherah.";
csb[8] = "Then Josiah brought all the priests from the cities of Judah, and he defiled the high places from Geba to Beer-sheba, where the priests had burned incense. He tore down the high places of the city gates at the entrance of the gate of Joshua the governor of the city (on the left at the city gate).";
csb[9] = "The priests of the high places, however, did not come up to the altar of the LORD in Jerusalem; instead, they ate unleavened bread with their fellow priests.";
csb[10] = "He defiled Topheth, which is in Ben Himmon Valley, so that no one could sacrifice his son or daughter in the fire to Molech.";
csb[11] = "He did away with the horses that the kings of Judah had dedicated to the sun. They had been at the entrance of the LORD\'s temple in the precincts by the chamber of Nathan-melech, the eunuch. He also burned the chariots of the sun.";
csb[12] = "The king tore down the altars that the kings of Judah had made on the roof of Ahaz\'s upper chamber. He also tore down the altars that Manasseh had made in the two courtyards of the LORD\'s temple. Then he smashed them there and threw their dust into the Kidron Valley.";
csb[13] = "The king also defiled the high places that were across from Jerusalem, to the south of the Mount of Destruction, which King Solomon of Israel had built for Ashtoreth, the abhorrent idol of the Sidonians; for Chemosh, the abhorrent idol of Moab; and for Milcom, the detestable idol of the Ammonites.";
csb[14] = "He broke the sacred pillars into pieces, cut down the Asherah poles, then filled their places with human bones.";
csb[15] = "He even tore down the altar at Bethel and the high place that had been made by Jeroboam son of Nebat, who caused Israel to sin. He burned the high place, crushed it to dust, and burned the Asherah.";
csb[16] = "As Josiah turned, he saw the tombs there on the mountain. He sent someone to take the bones out of the tombs, and he burned them on the altar. He defiled it according to the word of the LORD proclaimed by the man of God who proclaimed these things.";
csb[17] = "Then he said, &quot;What is this monument I see? &quot; The men of the city told him, &quot;It is the tomb of the man of God who came from Judah and proclaimed these things that you have done to the altar at Bethel.&quot;";
csb[18] = "So he said, &quot;Let him rest. Don\'t let anyone disturb his bones.&quot; So they left his bones undisturbed with the bones of the prophet who came from Samaria.";
csb[19] = "Josiah also removed all the shrines of the high places that were in the cities of Samaria, which the kings of Israel had made to anger the LORD. Josiah did the same things to them that he had done at Bethel.";
csb[20] = "He slaughtered on the altars all the priests of those high places, and he burned human bones on the altars. Then he returned to Jerusalem.";
csb[21] = "The king commanded all the people, &quot;Observe the Passover of the LORD your God as written in the book of the covenant.&quot;";
csb[22] = "No such Passover had ever been observed from the time of the judges who judged Israel through the entire time of the kings of Israel and Judah.";
csb[23] = "But in the eighteenth year of King Josiah, the LORD\'s Passover was observed in Jerusalem.";
csb[24] = "In addition, Josiah eradicated the mediums, the spiritists, household idols, images, and all the abhorrent things that were seen in the land of Judah and in Jerusalem. He did this in order to carry out the words of the law that were written in the book that the priest Hilkiah found in the LORD\'s temple.";
csb[25] = "Before him there was no king like him who turned to the LORD with all his heart and with all his soul and with all his strength according to all the law of Moses, and no one like him arose after him.";
csb[26] = "In spite of all that, the LORD did not turn from the fury of his intense burning anger, which burned against Judah because of all the affronts with which Manasseh had angered him.";
csb[27] = "For the LORD had said, &quot;I will also remove Judah from my presence just as I have removed Israel. I will reject this city Jerusalem, that I have chosen, and the temple about which I said, \'My name will be there.\' &quot;";
csb[28] = "The rest of the events of Josiah\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[29] = "During his reign, Pharaoh Neco king of Egypt marched up to help the king of Assyria at the Euphrates River. King Josiah went to confront him, and at Megiddo when Neco saw him he killed him.";
csb[30] = "From Megiddo his servants carried his dead body in a chariot, brought him into Jerusalem, and buried him in his own tomb. Then the common people took Jehoahaz son of Josiah, anointed him, and made him king in place of his father.";
csb[31] = "Jehoahaz was twenty-three years old when he became king, and he reigned three months in Jerusalem. His mother\'s name was Hamutal daughter of Jeremiah; she was from Libnah.";
csb[32] = "He did what was evil in the LORD\'s sight just as his ancestors had done.";
csb[33] = "Pharaoh Neco imprisoned him at Riblah in the land of Hamath to keep him from reigning in Jerusalem, and he imposed on the land a fine of seventy-five hundred pounds of silver and seventy-five pounds of gold.";
csb[34] = "Then Pharaoh Neco made Eliakim son of Josiah king in place of his father Josiah and changed Eliakim\'s name to Jehoiakim. But Neco took Jehoahaz and went to Egypt, and he died there.";
csb[35] = "So Jehoiakim gave the silver and the gold to Pharaoh, but at Pharaoh\'s command he taxed the land to give it. He exacted the silver and the gold from the common people, each according to his assessment, to give it to Pharaoh Neco.";
csb[36] = "Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. His mother\'s name was Zebidah daughter of Pedaiah; she was from Rumah.";
csb[37] = "He did what was evil in the LORD\'s sight just as his ancestors had done.";

rsv[2] = "And the king went up to the house of the LORD, and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people, both small and great; and he read in their hearing all the words of the book of the covenant which had been found in the house of the LORD.";
asv[2] = "And the king went up to the house of Jehovah, and all the men of Judah and all the inhabitants of Jerusalem with him, and the priests, and the prophets, and all the people, both small and great: and he read in their ears all the words of the book of the covenant which was found in the house of Jehovah.";
yng[2] = "and the king goeth up to the house of Jehovah, and every man of Judah, and all the inhabitants of Jerusalem, with him, and the priests, and the prophets, and all the people, from small unto great, and he readeth in their ears all the words of the book of the covenant that is found in the house of Jehovah.";

vul[2] = "ascenditque rex templum Domini et omnes viri Iuda universique qui habitant in Hierusalem cum eo sacerdotes et prophetae et omnis populus a parvo usque ad magnum legitque cunctis audientibus omnia verba libri foederis qui inventus est in domo Domini";
kjv[3] = "And the king stood by a pillar, and made a covenant before the LORD, to walk after the LORD, and to keep his commandments and his testimonies and his statutes with all [their] heart and all [their] soul, to perform the words of this covenant that were written in this book. And all the people stood to the covenant.";
rsv[3] = "And the king stood by the pillar and made a covenant before the LORD, to walk after the LORD and to keep his commandments and his testimonies and his statutes, with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people joined in the covenant.";
asv[3] = "And the king stood by the pillar, and made a covenant before Jehovah, to walk after Jehovah, and to keep his commandments, and his testimonies, and his statutes, with all [his] heart, and all [his] soul, to confirm the words of this covenant that were written in this book: and all the people stood to the covenant.";
yng[3] = "And the king standeth by the pillar, and maketh the covenant before Jehovah, to walk after Jehovah, and to keep His commands, and His testimonies, and His statutes, with all the heart, and with all the soul, to establish the words of this covenant that are written on this book, and all the people stand in the covenant.";
dby[3] = "And the king stood on the dais, and made a covenant before Jehovah, to walk after Jehovah, and to keep his commandments and his testimonies and his statutes with all [his] heart, and with all [his] soul, to establish the words of this covenant that are written in this book. And all the people stood to the covenant.";

kjv[4] = "And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the door, to bring forth out of the temple of the LORD all the vessels that were made for Baal, and for the grove, and for all the host of heaven: and he burned them without Jerusalem in the fields of Kidron, and carried the ashes of them unto Bethel.";
rsv[4] = "And the king commanded Hilki\'ah, the high priest, and the priests of the second order, and the keepers of the threshold, to bring out of the temple of the LORD all the vessels made for Ba\'al, for Ashe\'rah, and for all the host of heaven; he burned them outside Jerusalem in the fields of the Kidron, and carried their ashes to Bethel.";
asv[4] = "And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the threshold, to bring forth out of the temple of Jehovah all the vessels that were made for Baal, and for the Asherah, and for all the host of heaven, and he burned them without Jerusalem in the fields of the Kidron, and carried the ashes of them unto Beth-el.";
yng[4] = "And the king commandeth Hilkiah the high priest, and the priests of the second order, and the keepers of the threshold, to bring out from the temple of Jehovah all the vessels that are made for Baal, and for the shrine, and for all the host of the heavens, and he burneth them at the outside of Jerusalem, in the fields of Kidron, and hath borne their ashes to Beth-El.";
dby[4] = "And the king commanded Hilkijah the high priest, and the priests of the second order, and the doorkeepers, to bring forth out of the temple of Jehovah all the vessels that had been made for Baal, and for the Asherah, and for all the host of the heavens; and he burned them outside Jerusalem in the fields of Kidron, and carried the ashes of them to Bethel.";
web[4] = "And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the door, to bring forth out of the temple of the LORD all the vessels that were made for Baal, and for the grove, and for all the host of heaven: and he burned them without Jerusalem in the fields of Kidron, and carried the ashes of them to Beth-el.";
hnv[4] = "The king commanded Hilkiyah the Kohen Gadol, and the Kohanim of the second order, and the keepers of the threshold, to bring forth out of the temple of the LORD all the vessels that were made for Ba`al, and for the Asherah, and for all the host of the sky, and he burned them outside of Yerushalayim in the fields of the Kidron, and carried the ashes of them to Beit-El.";
vul[4] = "et praecepit rex Helciae pontifici et sacerdotibus secundi ordinis et ianitoribus ut proicerent de templo Domini omnia vasa quae facta fuerant Baal et in luco et universae militiae caeli et conbusit ea foris Hierusalem in convalle Cedron et tulit pulverem eorum in Bethel";
kjv[5] = "And he put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places in the cities of Judah, and in the places round about Jerusalem; them also that burned incense unto Baal, to the sun, and to the moon, and to the planets, and to all the host of heaven.";
rsv[5] = "And he deposed the idolatrous priests whom the kings of Judah had ordained to burn incense in the high places at the cities of Judah and round about Jerusalem; those also who burned incense to Ba\'al, to the sun, and the moon, and the constellations, and all the host of the heavens.";
asv[5] = "And he put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places in the cities of Judah, and in the places round about Jerusalem; them also that burned incense unto Baal, to the sun, and to the moon, and to the planets, and to all the host of heaven.";
yng[5] = "And he hath caused to cease the idolatrous priests whom the kings of Judah have appointed, (and they make perfume in high places, in cities of Judah and suburbs of Jerusalem,) and those making perfume to Baal, to the sun, and to the moon, and to the planets, and to all the host of the heavens.";
dby[5] = "And he abolished the idolatrous priests, whom the kings of Judah had ordained to burn incense on the high places in the cities of Judah, and the environs of Jerusalem; and them that burned incense to Baal, to the sun, and to the moon, and to the constellations, and to all the host of heaven.";
web[5] = "And he put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places in the cities of Judah, and in the places around Jerusalem; them also that burned incense to Baal, to the sun, and to the moon, and to the planets, and to all the host of heaven.";
hnv[5] = "He put down the idolatrous Kohanim, whom the kings of Yehudah had ordained to burn incense in the high places in the cities of Yehudah, and in the places round about Yerushalayim; those also who burned incense to Ba`al, to the sun, and to the moon, and to the planets, and to all the host of the sky.";

kjv[6] = "And he brought out the grove from the house of the LORD, without Jerusalem, unto the brook Kidron, and burned it at the brook Kidron, and stamped [it] small to powder, and cast the powder thereof upon the graves of the children of the people.";

yng[6] = "And he bringeth out the shrine from the house of Jehovah to the outside of Jerusalem, unto the brook Kidron, and burneth it at the brook Kidron, and beateth it small to dust, and casteth its dust on the grave of the sons of the people.";
dby[6] = "And he brought out the Asherah from the house of Jehovah, outside Jerusalem, to the torrent of Kidron, and burned it at the torrent of Kidron, and stamped it small to powder, and cast the powder upon the graves of the children of the people.";
web[6] = "And he brought out the grove from the house of the LORD, without Jerusalem, to the brook Kidron, and burned it at the brook Kidron, and stamped [it] small to powder, and cast the powder of it upon the graves of the children of the people.";

asv[8] = "And he brought all the priests out of the cities of Judah, and defiled the high places where the priests had burned incense, from Geba to Beer-sheba; and he brake down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city, which were on a man\'s left hand at the gate of the city.";
yng[8] = "And he bringeth in all the priests out of the cities of Judah, and defileth the high places where the priests have made perfume, from Geba unto Beer-Sheba, and hath broken down the high places of the gates that [are] at the opening of the gate of Joshua, head of the city, that [is] on a man\'s left hand at the gate of the city;";

rsv[11] = "And he removed the horses that the kings of Judah had dedicated to the sun, at the entrance to the house of the LORD, by the chamber of Nathan-melech the chamberlain, which was in the precincts; and he burned the chariots of the sun with fire.";
asv[11] = "And he took away the horses that the kings of Judah had given to the sun, at the entrance of the house of Jehovah, by the chamber of Nathan-melech the chamberlain, which was in the precincts; and he burned the chariots of the sun with fire.";
yng[11] = "And he causeth to cease the horses that the kings of Judah have given to the sun from the entering in of the house of Jehovah, by the chamber of Nathan-Melech the eunuch, that [is] in the suburbs, and the chariots of the sun he hath burnt with fire.";
dby[11] = "And he abolished the horses that the kings of Judah had appointed to the sun at the entrance of the house of Jehovah, by the chamber of Nathan-melech the chamberlain, which was in the suburbs, and burned the chariots of the sun, with fire.";
web[11] = "And he took away the horses that the kings of Judah had given to the sun, at the entrance of the house of the LORD, by the chamber of Nathan-melech the chamberlain, which [was] in the suburbs, and burned the chariots of the sun with fire.";
hnv[11] = "He took away the horses that the kings of Yehudah had given to the sun, at the entrance of the house of the LORD, by the chamber of Netan-Melekh the chamberlain, which was in the precincts; and he burned the chariots of the sun with fire.";
vul[11] = "abstulit quoque equos quos dederant reges Iudae soli in introitu templi Domini iuxta exedram Nathanmelech eunuchi qui erat in Farurim currus autem solis conbusit igni";
kjv[12] = "And the altars that [were] on the top of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the LORD, did the king beat down, and brake [them] down from thence, and cast the dust of them into the brook Kidron.";
rsv[12] = "And the altars on the roof of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manas\'seh had made in the two courts of the house of the LORD, he pulled down and broke in pieces, and cast the dust of them into the brook Kidron.";
asv[12] = "And the altars that were on the roof of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of Jehovah, did the king break down, and beat [them] down from thence, and cast the dust of them into the brook Kidron.";
yng[12] = "And the altars that [are] on the top of the upper chamber of Ahaz, that the kings of Judah made, and the altars that Manasseh made in the two courts of the house of Jehovah, hath the king broken down, and removeth thence, and hath cast their dust unto the brook Kidron.";
dby[12] = "And the king broke down the altars that were on the roof of the upper chamber of Ahaz, which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Jehovah, and he shattered them, [removing them] from thence, and cast the powder of them into the torrent of Kidron.";
web[12] = "And the altars that [were] on the top of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the LORD, did the king beat down, and broke [them] down from thence, and cast the dust of them into the brook Kidron.";
hnv[12] = "The altars that were on the roof of the upper chamber of Achaz, which the kings of Yehudah had made, and the altars which Menashsheh had made in the two courts of the house of the LORD, did the king break down, and beat [them] down from there, and cast the dust of them into the brook Kidron.";
vul[12] = "altaria quoque quae erant super tecta cenaculi Ahaz quae fecerant reges Iuda et altaria quae fecerat Manasses in duobus atriis templi Domini destruxit rex et cucurrit inde et dispersit cinerem eorum in torrentem Cedron";
kjv[13] = "And the high places that [were] before Jerusalem, which [were] on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth the abomination of the Zidonians, and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile.";
rsv[13] = "And the king defiled the high places that were east of Jerusalem, to the south of the mount of corruption, which Solomon the king of Israel had built for Ash\'toreth the abomination of the Sido\'nians, and for Chemosh the abomination of Moab, and for Milcom the abomination of the Ammonites.";
asv[13] = "And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth the abomination of the Sidonians, and for Chemosh the abomination of Moab, and for Milcom the abomination of the children of Ammon, did the king defile.";
yng[13] = "And the high places that [are] on the front of Jerusalem, that [are] on the right of the mount of corruption, that Solomon king of Israel had built to Ashtoreth abomination of the Zidonians, and Chemosh abomination of Moab, and to Milcom abomination of the sons of Ammon, hath the king defiled.";
dby[13] = "And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had built for Ashtoreth the abomination of the Zidonians, and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile.";
web[13] = "And the high places that [were] before Jerusalem, which [were] on the right hand of the mount of corruption, which Solomon the king of Israel had built for Ashtoreth the abomination of the Zidonians, and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile.";
hnv[13] = "The high places that were before Yerushalayim, which were on the right hand of the mountain of corruption, which Shlomo the king of Yisra\'el had built for `Ashoret the abomination of the Tzidonim, and for Kemosh the abomination of Mo\'av, and for Milkom the abomination of the children of `Ammon, did the king defile.";
vul[13] = "excelsa quoque quae erant in Hierusalem ad dexteram partem montis Offensionis quae aedificaverat Salomon rex Israhel Astharoth idolo Sidoniorum et Chamos offensioni Moab et Melchom abominationi filiorum Ammon polluit rex";
kjv[14] = "And he brake in pieces the images, and cut down the groves, and filled their places with the bones of men.";
rsv[14] = "And he broke in pieces the pillars, and cut down the Ashe\'rim, and filled their places with the bones of men.";
asv[14] = "And he brake in pieces the pillars, and cut down the Asherim, and filled their places with the bones of men.";
yng[14] = "And he hath broken in pieces the standing-pillars, and cutteth down the shrines, and filleth their place with bones of men;";
dby[14] = "And he broke in pieces the columns, and cut down the Asherahs, and filled their place with the bones of men.";
web[14] = "And he broke in pieces the images, and cut down the groves, and filled their places with the bones of men.";
hnv[14] = "He broke in pieces the pillars, and cut down the Asherim, and filled their places with the bones of men.";
vul[14] = "et contrivit statuas et succidit lucos replevitque loca eorum ossibus mortuorum";
kjv[15] = "Moreover the altar that [was] at Bethel, [and] the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, both that altar and the high place he brake down, and burned the high place, [and] stamped [it] small to powder, and burned the grove.";
rsv[15] = "Moreover the altar at Bethel, the high place erected by Jerobo\'am the son of Nebat, who made Israel to sin, that altar with the high place he pulled down and he broke in pieces its stones, crushing them to dust; also he burned the Ashe\'rah.";
asv[15] = "Moreover the altar that was at Beth-el, and the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, even that altar and the high place he brake down; and he burned the high place and beat it to dust, and burned the Asherah.";
yng[15] = "and also the altar that [is] in Beth-El, the high place that Jeroboam son of Nebat made, by which he made Israel sin, both that altar and the high place he hath broken down, and doth burn the high place -- he hath beat it small to dust, and hath burnt the shrine.";
dby[15] = "Moreover the altar that was at Bethel, the high place that Jeroboam the son of Nebat, who caused Israel to sin, had made, both that altar and the high place he broke down; and burned the high place, stamped it small to powder, and burned the Asherah.";
web[15] = "Moreover, the altar that [was] at Beth-el, [and] the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, both that altar and the high place he broke down, and burned the high place, [and] stamped [it] small to powder, and burned the grove.";
hnv[15] = "Moreover the altar that was at Beit-El, and the high place which Yarov`am the son of Nevat, who made Yisra\'el to sin, had made, even that altar and the high place he broke down; and he burned the high place and beat it to dust, and burned the Asherah.";
vul[15] = "insuper et altare quod erat in Bethel excelsum quod fecerat Hieroboam filius Nabath qui peccare fecit Israhel et altare illud et excelsum destruxit atque conbusit et comminuit in pulverem succenditque etiam lucum";
kjv[16] = "And as Josiah turned himself, he spied the sepulchres that [were] there in the mount, and sent, and took the bones out of the sepulchres, and burned [them] upon the altar, and polluted it, according to the word of the LORD which the man of God proclaimed, who proclaimed these words.";
rsv[16] = "And as Josi\'ah turned, he saw the tombs there on the mount; and he sent and took the bones out of the tombs, and burned them upon the altar, and defiled it, according to the word of the LORD which the man of God proclaimed, who had predicted these things.";
asv[16] = "And as Josiah turned himself, he spied the sepulchres that were there in the mount; and he sent, and took the bones out of the sepulchres, and burned them upon the altar, and defiled it, according to the word of Jehovah which the man of God proclaimed, who proclaimed these things.";
yng[16] = "And Josiah turneth, and seeth the graves that [are] there in the mount, and sendeth and taketh the bones out of the graves, and burneth [them] on the altar, and defileth it, according to the word of Jehovah that the man of God proclaimed, who proclaimed these things.";
dby[16] = "And Josiah turned himself, and saw the sepulchres that were there on the mount; and he sent and took the bones out of the sepulchres, and burned [them] upon the altar, and defiled it, according to the word of Jehovah, that the man of God had proclaimed, who proclaimed these things.";
web[16] = "And as Josiah turned himself, he espied the sepulchers that [were] there on the mount, and sent, and took the bones out of the sepulchers, and burned [them] upon the altar, and polluted it, according to the word of the LORD which the man of God proclaimed, who proclaimed these words.";
hnv[16] = "As Yoshiyahu turned himself, he spied the tombs that were there in the mountain; and he sent, and took the bones out of the tombs, and burned them on the altar, and defiled it, according to the word of the LORD which the man of God proclaimed, who proclaimed these things.";
vul[16] = "et conversus Iosias vidit ibi sepulchra quae erant in monte misitque et tulit ossa de sepulchris et conbusit ea super altare et polluit illud iuxta verbum Domini quod locutus est vir Dei qui praedixerat verba haec";
kjv[17] = "Then he said, What title [is] that that I see? And the men of the city told him, [It is] the sepulchre of the man of God, which came from Judah, and proclaimed these things that thou hast done against the altar of Bethel.";
rsv[17] = "Then he said, &quot;What is yonder monument that I see?&quot; And the men of the city told him, &quot;It is the tomb of the man of God who came from Judah and predicted these things which you have done against the altar at Bethel.&quot;";
asv[17] = "Then he said, What monument is that which I see? And the men of the city told him, It is the sepulchre of the man of God, who came from Judah, and proclaimed these things that thou hast done against the altar of Beth-el.";
yng[17] = "And he saith, `What [is] this sign that I see?\' and the men of the city say unto him, `The grave of the man of God who hath come from Judah, and proclaimeth these things that thou hast done concerning the altar of Beth-El.\'";
dby[17] = "Then he said, What tombstone is that which I see? And the men of the city told him, It is the sepulchre of the man of God who came from Judah and proclaimed these things which thou hast done against the altar of Bethel.";
web[17] = "Then he said, What title [is] that which I see? And the men of the city told him, [It is] the sepulcher of the man of God, who came from Judah, and proclaimed these things that thou hast done against the altar of Beth-el.";
hnv[17] = " Then he said, What monument is that which I see? The men of the city told him, It is the tomb of the man of God, who came from Yehudah, and proclaimed these things that you have done against the altar of Beit-El.";
vul[17] = "et ait quis est titulus ille quem video responderuntque ei cives illius urbis sepulchrum est hominis Dei qui venit de Iuda et praedixit verba haec quae fecisti super altare Bethel";
kjv[18] = "And he said, Let him alone; let no man move his bones. So they let his bones alone, with the bones of the prophet that came out of Samaria.";
rsv[18] = "And he said, &quot;Let him be; let no man move his bones.&quot; So they let his bones alone, with the bones of the prophet who came out of Sama\'ria.";
asv[18] = "And he said, Let him be; let no man move his bones. So they let his bones alone, with the bones of the prophet that came out of Samaria.";
yng[18] = "And he saith, `Let him alone, let no man touch his bones;\' and they let his bones escape, with the bones of the prophet who came out of Samaria.";
dby[18] = "And he said, Let him alone; let no man move his bones. And they saved his bones, with the bones of the prophet that came out of Samaria.";
web[18] = "And he said, Let him alone; let no man move his bones. So they let his bones alone, with the bones of the prophet that came out of Samaria.";
hnv[18] = "He said, Let him be; let no man move his bones. So they let his bones alone, with the bones of the prophet who came out of Shomron.";
vul[18] = "et ait dimittite eum nemo commoveat ossa eius et intacta manserunt ossa illius cum ossibus prophetae qui venerat de Samaria";
kjv[19] = "And all the houses also of the high places that [were] in the cities of Samaria, which the kings of Israel had made to provoke [the LORD] to anger, Josiah took away, and did to them according to all the acts that he had done in Bethel.";
rsv[19] = "And all the shrines also of the high places that were in the cities of Sama\'ria, which kings of Israel had made, provoking the LORD to anger, Josi\'ah removed; he did to them according to all that he had done at Bethel.";
asv[19] = "And all the houses also of the high places that were in the cities of Samaria, which the kings of Israel had made to provoke [Jehovah] to anger, Josiah took away, and did to them according to all the acts that he had done in Beth-el.";
yng[19] = "And also all the houses of the high places that [are] in the cities of Samaria, that the kings of Israel made to provoke to anger, hath Josiah turned aside, and doth to them according to all the deeds that he did in Beth-El.";
dby[19] = "And all the houses also of the high places that were in the cities of Samaria, which the kings of Israel had made to provoke [Jehovah] to anger, Josiah removed, and did to them according to all the acts that he had done in Bethel.";
web[19] = "And all the houses also of the high places that [were] in the cities of Samaria, which the kings of Israel had made to provoke [the LORD] to anger, Josiah took away, and did to them according to all the acts that he had done in Beth-el.";
hnv[19] = "All the houses also of the high places that were in the cities of Shomron, which the kings of Yisra\'el had made to provoke [the LORD] to anger, Yoshiyahu took away, and did to them according to all the acts that he had done in Beit-El.";
vul[19] = "insuper et omnia fana excelsorum quae erant in civitatibus Samariae quae fecerant reges Israhel ad inritandum Dominum abstulit Iosias et fecit eis secundum omnia opera quae fecerat in Bethel";
kjv[20] = "And he slew all the priests of the high places that [were] there upon the altars, and burned men\'s bones upon them, and returned to Jerusalem.";
rsv[20] = "And he slew all the priests of the high places who were there, upon the altars, and burned the bones of men upon them. Then he returned to Jerusalem.";
asv[20] = "And he slew all the priests of the high places that were there, upon the altars, and burned men\'s bones upon them; and he returned to Jerusalem.";
yng[20] = "And he slayeth all the priests of the high places who [are] there by the altars, and burneth the bones of man upon them, and turneth back to Jerusalem.";
dby[20] = "And he sacrificed upon the altars all the priests of the high places that were there, and burned men\'s bones upon them. And he returned to Jerusalem.";
web[20] = "And he slew all the priests of the high places, that [were] there upon the altars, and burnt men\'s bones upon them, and returned to Jerusalem.";
hnv[20] = "He killed all the Kohanim of the high places that were there, on the altars, and burned men\'s bones on them; and he returned to Yerushalayim.";
vul[20] = "et occidit universos sacerdotes excelsorum qui erant ibi super altaria et conbusit ossa humana super ea reversusque est Hierusalem";
kjv[21] = "And the king commanded all the people, saying, Keep the passover unto the LORD your God, as [it is] written in the book of this covenant.";
rsv[21] = "And the king commanded all the people, &quot;Keep the passover to the LORD your God, as it is written in this book of the covenant.&quot;";
asv[21] = "And the king commanded all the people, saying, Keep the passover unto Jehovah your God, as it is written in this book of the covenant.";
yng[21] = "And the king commandeth the whole of the people, saying, `Make ye a passover to Jehovah your God, as it is written on this book of the covenant.\'";
dby[21] = "And the king commanded all the people saying, Hold the passover to Jehovah your God, as it is written in this book of the covenant.";
web[21] = "And the king commanded all the people, saying, Keep the passover to the LORD your God, as [it is] written in the book of this covenant.";
hnv[21] = "The king commanded all the people, saying, Keep the Pesach to the LORD your God, as it is written in this book of the covenant.";
vul[21] = "et praecepit omni populo dicens facite phase Domino Deo vestro secundum quod scriptum est in libro foederis huius";
kjv[22] = "Surely there was not holden such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah;";
rsv[22] = "For no such passover had been kept since the days of the judges who judged Israel, or during all the days of the kings of Israel or of the kings of Judah;";
asv[22] = "Surely there was not kept such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah;";
yng[22] = "Surely there hath not been made like this passover from the days of the judges who judged Israel, even all the days of the kings of Israel, and of the kings of Judah;";
dby[22] = "For there was not holden such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah;";
web[22] = "Surely there was not held such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah.";
hnv[22] = "Surely there was not kept such a Pesach from the days of the judges who judged Yisra\'el, nor in all the days of the kings of Yisra\'el, nor of the kings of Yehudah;";
vul[22] = "nec enim factum est phase tale a diebus iudicum qui iudicaverunt Israhel et omnium dierum regum Israhel et regum Iuda";
kjv[23] = "But in the eighteenth year of king Josiah, [wherein] this passover was holden to the LORD in Jerusalem.";
rsv[23] = "but in the eighteenth year of King Josi\'ah this passover was kept to the LORD in Jerusalem.";
asv[23] = "but in the eighteenth year of king Josiah was this passover kept to Jehovah in Jerusalem.";
yng[23] = "but in the eighteenth year of king Josiah, hath this passover been made to Jehovah in Jerusalem.";
dby[23] = "but in the eighteenth year of king Josiah was this passover holden to Jehovah in Jerusalem.";
web[23] = "But in the eighteenth year of king Josiah, [in which] this passover was held to the LORD in Jerusalem.";
hnv[23] = "but in the eighteenth year of king Yoshiyahu was this Pesach kept to the LORD in Yerushalayim.";
vul[23] = "sicut in octavodecimo anno regis Iosiae factum est phase istud Domino in Hierusalem";
kjv[24] = "Moreover the [workers with] familiar spirits, and the wizards, and the images, and the idols, and all the abominations that were spied in the land of Judah and in Jerusalem, did Josiah put away, that he might perform the words of the law which were written in the book that Hilkiah the priest found in the house of the LORD.";
rsv[24] = "Moreover Josi\'ah put away the mediums and the wizards and the teraphim and the idols and all the abominations that were seen in the land of Judah and in Jerusalem, that he might establish the words of the law which were written in the book that Hilki\'ah the priest found in the house of the LORD.";
asv[24] = "Moreover them that had familiar spirits, and the wizards, and the teraphim, and the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, did Josiah put away, that he might confirm the words of the law which were written in the book that Hilkiah the priest found in the house of Jehovah.";
yng[24] = "And also, those having familiar spirits, and the wizards, and the teraphim, and the idols, and all the abominations that were seen in the land of Judah, and in Jerusalem, hath Josiah put away, in order to establish the words of the law that are written on the book that Hilkiah the priest hath found in the house of Jehovah.";
dby[24] = "Moreover the necromancers and the soothsayers, and the teraphim and the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, Josiah took away, that he might perform the words of the law which were written in the book that Hilkijah the priest had found in the house of Jehovah.";
web[24] = "Moreover the [workers with] familiar spirits, and the wizards, and the images, and the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, did Josiah put away, that he might perform the words of the law which were written in the book that Hilkiah the priest found in the house of the LORD.";
hnv[24] = "Moreover those who had familiar spirits, and the wizards, and the terafim, and the idols, and all the abominations that were seen in the land of Yehudah and in Yerushalayim, did Yoshiyahu put away, that he might confirm the words of the law which were written in the book that Hilkiyah the Kohen found in the house of the LORD.";
vul[24] = "sed et pythones et ariolos et figuras idolorum et inmunditias abominationesque quae fuerant in terra Iuda et in Hierusalem abstulit Iosias ut statueret verba legis quae scripta sunt in libro quem invenit Helcias sacerdos in templo Domini";
kjv[25] = "And like unto him was there no king before him, that turned to the LORD with all his heart, and with all his soul, and with all his might, according to all the law of Moses; neither after him arose there [any] like him.";
rsv[25] = "Before him there was no king like him, who turned to the LORD with all his heart and with all his soul and with all his might, according to all the law of Moses; nor did any like him arise after him.";
asv[25] = "And like unto him was there no king before him, that turned to Jehovah with all his heart, and with all his soul, and with all his might, according to all the law of Moses; neither after him arose there any like him.";
yng[25] = "And like him there hath not been before him a king who turned back unto Jehovah with all his heart, and with all his soul, and with all his might, according to all the law of Moses, and after him there hath none risen like him.";
dby[25] = "And before him there had been no king like him that turned to Jehovah with all his heart and with all his soul and with all his might, according to all the law of Moses; neither after him arose there his like.";
web[25] = "And like him was there no king before him, that turned to the LORD with all his heart, and with all his soul, and with all his might, according to all the law of Moses; neither after him arose there [any] like him.";
hnv[25] = "Like him was there no king before him, who turned to the LORD with all his heart, and with all his soul, and with all his might, according to all the law of Moshe; neither after him arose there any like him.";
vul[25] = "similis illi non fuit ante eum rex qui reverteretur ad Dominum in omni corde suo et in tota anima sua et in universa virtute sua iuxta omnem legem Mosi neque post eum surrexit similis illi";
kjv[26] = "Notwithstanding the LORD turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations that Manasseh had provoked him withal.";
rsv[26] = "Still the LORD did not turn from the fierceness of his great wrath, by which his anger was kindled against Judah, because of all the provocations with which Manas\'seh had provoked him.";
asv[26] = "Notwithstanding, Jehovah turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations wherewith Manasseh had provoked him.";
yng[26] = "Only, Jehovah hath not turned back from the fierceness of His great anger with which His anger burned against Judah, because of all the provocations with which Manasseh provoked him,";
dby[26] = "But Jehovah turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations with which Manasseh had provoked him.";
web[26] = "Notwithstanding, the LORD turned not from the fierceness of his great wrath, with which his anger was kindled against Judah, because of all the provocations by which Manasseh had provoked him.";
hnv[26] = "Notwithstanding, the LORD didn\'t turn from the fierceness of his great wrath, with which his anger was kindled against Yehudah, because of all the provocation with which Menashsheh had provoked him.";
vul[26] = "verumtamen non est aversus Dominus ab ira furoris sui magni quo iratus est furor eius contra Iudam propter inritationes quibus provocaverat eum Manasses";
kjv[27] = "And the LORD said, I will remove Judah also out of my sight, as I have removed Israel, and will cast off this city Jerusalem which I have chosen, and the house of which I said, My name shall be there.";
rsv[27] = "And the LORD said, &quot;I will remove Judah also out of my sight, as I have removed Israel, and I will cast off this city which I have chosen, Jerusalem, and the house of which I said, My name shall be there.&quot;";
asv[27] = "And Jehovah said, I will remove Judah also out of my sight, as I have removed Israel, and I will cast off this city which I have chosen, even Jerusalem, and the house of which I said, My name shall be there.";
yng[27] = "and Jehovah saith, `Also Judah I turn aside from my presence, as I turned Israel aside, and I have rejected this city that I have chosen -- Jerusalem, and the house of which I said, My name is there.\'";
dby[27] = "And Jehovah said, I will remove Judah also out of my sight, as I have removed Israel, and will reject this city Jerusalem which I have chosen, and the house of which I said, My name shall be there.";
web[27] = "And the LORD said, I will remove Judah also out of my sight, as I have removed Israel, and will reject this city Jerusalem which I have chosen, and the house of which I said, My name shall be there.";
hnv[27] = "The LORD said, I will remove Yehudah also out of my sight, as I have removed Yisra\'el, and I will cast off this city which I have chosen, even Yerushalayim, and the house of which I said, My name shall be there.";
vul[27] = "dixit itaque Dominus etiam Iudam auferam a facie mea sicut abstuli Israhel et proiciam civitatem hanc quam elegi Hierusalem et domum de qua dixi erit nomen meum ibi";
kjv[28] = "Now the rest of the acts of Josiah, and all that he did, [are] they not written in the book of the chronicles of the kings of Judah?";
rsv[28] = "Now the rest of the acts of Josi\'ah, and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?";
asv[28] = "Now the rest of the acts of Josiah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?";
yng[28] = "And the rest of the matters of Josiah, and all that he did, are they not written on the book of the Chronicles of the kings of Judah?";
dby[28] = "And the rest of the acts of Josiah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?";
web[28] = "Now the rest of the acts of Josiah, and all that he did, [are] they not written in the book of the chronicles of the kings of Judah?";
hnv[28] = "Now the rest of the acts of Yoshiyahu, and all that he did, aren\'t they written in the book of the chronicles of the kings of Yehudah?";

kjv[29] = "In his days Pharaohnechoh king of Egypt went up against the king of Assyria to the river Euphrates: and king Josiah went against him; and he slew him at Megiddo, when he had seen him.";
rsv[29] = "In his days Pharaoh Neco king of Egypt went up to the king of Assyria to the river Euphra\'tes. King Josi\'ah went to meet him; and Pharaoh Neco slew him at Megid\'do, when he saw him.";
asv[29] = "In his days Pharaoh-necoh king of Egypt went up against the king of Assyria to the river Euphrates: and king Josiah went against him; and [Pharaoh-necoh] slew him at Megiddo, when he had seen him.";
yng[29] = "In his days hath Pharaoh-Nechoh king of Egypt come up against the king of Asshur, by the river Phrat, and king Josiah goeth out to meet him, and he putteth him to death in Megiddo, when he seeth him.";
dby[29] = "In his days Pharaoh-Nechoh king of Egypt went up against the king of Assyria to the river Euphrates; and king Josiah went against him; but [Nechoh] slew him at Megiddo, when he had seen him.";
web[29] = "In his days Pharaoh-nechoh king of Egypt went up against the king of Assyria to the river Euphrates: and king Josiah went against him; and he slew him at Megiddo, when he had seen him.";
hnv[29] = "In his days Par`oh-Nekho king of Mitzrayim went up against the king of Ashshur to the river Perat: and king Yoshiyahu went against him; and [Par`oh-Nekho] killed him at Megiddo, when he had seen him.";
vul[29] = "in diebus eius ascendit Pharao Necho rex Aegypti contra regem Assyriorum ad flumen Eufraten et abiit Iosias rex in occursum eius et occisus est in Mageddo cum vidisset eum";
kjv[30] = "And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father\'s stead.";
rsv[30] = "And his servants carried him dead in a chariot from Megid\'do, and brought him to Jerusalem, and buried him in his own tomb. And the people of the land took Jeho\'ahaz the son of Josi\'ah, and anointed him, and made him king in his father\'s stead.";
asv[30] = "And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father\'s stead.";
yng[30] = "And his servants cause him to ride dying from Megiddo, and bring him in to Jerusalem, and bury him in his own grave, and the people of the land take Jehoahaz son of Josiah, and anoint him, and cause him to reign instead of his father.";
dby[30] = "And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father\'s stead.";
web[30] = "And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulcher. And the people of the land took Jehoahaz the son of Josiah and anointed him, and made him king in his father\'s stead.";
hnv[30] = "His servants carried him in a chariot dead from Megiddo, and brought him to Yerushalayim, and buried him in his own tomb. The people of the land took Yeho\'achaz the son of Yoshiyahu, and anointed him, and made him king in his father\'s place.";
vul[30] = "et portaverunt eum servi sui mortuum de Mageddo et pertulerunt in Hierusalem et sepelierunt eum in sepulchro suo tulitque populus terrae Ioahaz filium Iosiae et unxerunt eum et constituerunt eum regem pro patre suo";
kjv[31] = "Jehoahaz [was] twenty and three years old when he began to reign; and he reigned three months in Jerusalem. And his mother\'s name [was] Hamutal, the daughter of Jeremiah of Libnah.";
rsv[31] = "Jeho\'ahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother\'s name was Hamu\'tal the daughter of Jeremiah of Libnah.";
asv[31] = "Jehoahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem: and his mother\'s name was Hamutal the daughter of Jeremiah of Libnah.";
yng[31] = "A son of twenty and three years [is] Jehoahaz in his reigning, and three months he hath reigned in Jerusalem, and the name of his mother [is] Hamutal daughter of Jeremiah of Libnah,";
dby[31] = "Jehoahaz was twenty-three years old when he began to reign; and he reigned three months in Jerusalem; and his mother\'s name was Hamutal, daughter of Jeremiah of Libnah.";
web[31] = "Jehoahaz [was] twenty and three years old when he began to reign; and he reigned three months in Jerusalem. And his mother\'s name [was] Hamutal, the daughter of Jeremiah of Libnah.";
hnv[31] = "Yeho\'achaz was twenty-three years old when he began to reign; and he reigned three months in Yerushalayim: and his mother\'s name was Hamutal the daughter of Yirmeyahu of Livna.";
vul[31] = "viginti trium annorum erat Ioahaz cum regnare coepisset et tribus mensibus regnavit in Hierusalem nomen matris eius Amithal filia Hieremiae de Lobna";
kjv[32] = "And he did [that which was] evil in the sight of the LORD, according to all that his fathers had done.";
rsv[32] = "And he did what was evil in the sight of the LORD, according to all that his fathers had done.";
asv[32] = "And he did that which was evil in the sight of Jehovah, according to all that his fathers had done.";
yng[32] = "and he doth the evil thing in the eyes of Jehovah, according to all that his fathers did,";
dby[32] = "And he did evil in the sight of Jehovah, according to all that his fathers had done.";
web[32] = "And he did [that which was] evil in the sight of the LORD, according to all that his fathers had done.";
hnv[32] = "He did that which was evil in the sight of the LORD, according to all that his fathers had done.";
vul[32] = "et fecit malum coram Domino iuxta omnia quae fecerant patres eius";
kjv[33] = "And Pharaohnechoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem; and put the land to a tribute of an hundred talents of silver, and a talent of gold.";
rsv[33] = "And Pharaoh Neco put him in bonds at Riblah in the land of Hamath, that he might not reign in Jerusalem, and laid upon the land a tribute of a hundred talents of silver and a talent of gold.";
asv[33] = "And Pharaoh-necoh put him in bonds at Riblah in the land of Hamath, that he might not reign in Jerusalem; and put the land to a tribute of a hundred talents of silver, and a talent of gold.";
yng[33] = "and Pharaoh-Nechoh bindeth him in Riblah, in the land of Hamath, from reigning in Jerusalem, and he putteth a fine on the land -- a hundred talents of silver, and a talent of gold.";
dby[33] = "And Pharaoh-Nechoh had him bound at Riblah in the land of Hamath, that he might not reign in Jerusalem; and laid a tribute upon the land of a hundred talents of silver and a talent of gold.";
web[33] = "And Pharaoh-nechoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem; and subjected the land to a tribute of a hundred talents of silver, and a talent of gold.";
hnv[33] = " Par`oh-Nekho put him in bonds at Rivlah in the land of Hamat, that he might not reign in Yerushalayim; and put the land to a tribute of one hundred talents of silver, and a talent of gold.";
vul[33] = "vinxitque eum Pharao Necho in Rebla quae est in terra Emath ne regnaret in Hierusalem et inposuit multam terrae centum talentis argenti et talento auri";
kjv[34] = "And Pharaohnechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took Jehoahaz away: and he came to Egypt, and died there.";
rsv[34] = "And Pharaoh Neco made Eli\'akim the son of Josi\'ah king in the place of Josi\'ah his father, and changed his name to Jehoi\'akim. But he took Jeho\'ahaz away; and he came to Egypt, and died there.";
asv[34] = "And Pharaoh-necoh made Eliakim the son of Josiah king in the room of Josiah his father, and changed his name to Jehoiakim: but he took Jehoahaz away; and he came to Egypt, and died there.";
yng[34] = "And Pharaoh-Nechoh causeth Eliakim son of Josiah to reign instead of Josiah his father, and turneth his name to Jehoiakim, and Jehoahaz he hath taken away, and he cometh in to Egypt, and dieth there.";
dby[34] = "And Pharaoh-Nechoh made Eliakim the son of Josiah king instead of Josiah his father, and changed his name to Jehoiakim. And he took Jehoahaz; and he came to Egypt, and died there.";
web[34] = "And Pharaoh-nechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took Jehoahaz away: and he came to Egypt and died there.";
hnv[34] = "Par`oh-Nekho made Elyakim the son of Yoshiyahu king in the room of Yoshiyahu his father, and changed his name to Yehoiakim: but he took Yeho\'achaz away; and he came to Mitzrayim, and died there.";
vul[34] = "regemque constituit Pharao Necho Eliachim filium Iosiae pro Iosia patre eius vertitque nomen eius Ioiachim porro Ioahaz tulit et duxit in Aegyptum";
kjv[35] = "And Jehoiakim gave the silver and the gold to Pharaoh; but he taxed the land to give the money according to the commandment of Pharaoh: he exacted the silver and the gold of the people of the land, of every one according to his taxation, to give [it] unto Pharaohnechoh.";
rsv[35] = "And Jehoi\'akim gave the silver and the gold to Pharaoh, but he taxed the land to give the money according to the command of Pharaoh. He exacted the silver and the gold of the people of the land, from every one according to his assessment, to give it to Pharaoh Neco.";
asv[35] = "And Jehoiakim gave the silver and the gold to Pharaoh; but he taxed the land to give the money according to the commandment of Pharaoh: he exacted the silver and the gold of the people of the land, of every one according to his taxation, to give it unto Pharaoh-necoh.";
yng[35] = "And the silver and the gold hath Jehoiakim given to Pharaoh; only he valued the land to give the silver by the command of Pharaoh; from each, according to his valuation, he exacted the silver and the gold, from the people of the land, to give to Pharaoh-Nechoh.";
dby[35] = "And Jehoiakim gave the silver and the gold to Pharaoh; but he laid a proportional tax on the land to give the money according to the command of Pharaoh: he exacted the silver and the gold of the people of the land, of every one according to his estimation, to give it to Pharaoh-Nechoh.";
web[35] = "And Jehoiakim gave the silver and the gold to Pharaoh; but he taxed the land to give the money according to the commandment of Pharaoh: he exacted the silver and the gold from the people of the land, from every one according to his taxation, to give [it] to Pharaoh-nechoh.";
hnv[35] = "Yehoiakim gave the silver and the gold to Par`oh; but he taxed the land to give the money according to the mitzvah of Par`oh: he exacted the silver and the gold of the people of the land, of everyone according to his taxation, to give it to Par`oh-Nekho.";
vul[35] = "argentum autem et aurum dedit Ioiachim Pharaoni cum indixisset terrae per singulos ut conferretur iuxta praeceptum Pharaonis et unumquemque secundum vires suas exegit tam argentum quam aurum de populo terrae ut daret Pharaoni Necho";
kjv[36] = "Jehoiakim [was] twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem. And his mother\'s name [was] Zebudah, the daughter of Pedaiah of Rumah.";
rsv[36] = "Jehoi\'akim was twenty-five years old when he began to reign, and he reigned eleven years in Jerusalem. His mother\'s name was Zebi\'dah the daughter of Pedai\'ah of Rumah.";
asv[36] = "Jehoiakim was twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem: and his mother\'s name was Zebidah the daughter of Pedaiah of Rumah.";

dby[36] = "Jehoiakim was twenty-five years old when he began to reign; and he reigned eleven years in Jerusalem; and his mother\'s name was Zebuddah, daughter of Pedaiah of Rumah.";
web[36] = "Jehoiakim [was] twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem. And his mother\'s name [was] Zebudah, the daughter of Pedaiah of Rumah.";
hnv[36] = "Yehoiakim was twenty-five years old when he began to reign; and he reigned eleven years in Yerushalayim: and his mother\'s name was Zevudah the daughter of Pedayahu of Rumah.";
vul[36] = "viginti quinque annorum erat Ioiachim cum regnare coepisset et undecim annis regnavit in Hierusalem nomen matris eius Zebida filia Phadaia de Ruma";
