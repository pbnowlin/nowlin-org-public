csb[1] = "One of the wives of the sons of the prophets cried out to Elisha, &quot;Your servant, my husband, has died. You know that your servant feared the LORD. Now the creditor is coming to take my two children as his slaves.&quot;";
csb[2] = "Elisha asked her, &quot;What can I do for you? Tell me, what do you have in the house? &quot; She said, &quot;Your servant has nothing in the house except a jar of oil.&quot;";
csb[3] = "Then he said, &quot;Go out and borrow empty containers from all your neighbors. Do not get just a few.";
csb[4] = "&quot;Then go in and shut the door behind you and your sons, and pour oil into all these containers. Set the full ones to one side.&quot;";
csb[5] = "So she left. After she had shut the door behind her and her sons, they kept bringing her containers, and she kept pouring.";
csb[6] = "When they were full, she said to her son, &quot;Bring me another container.&quot; But he replied, &quot;There aren\'t any more.&quot; Then the oil stopped.";
csb[7] = "She went and told the man of God, and he said, &quot;Go sell the oil and pay your debt; you and your sons can live on the rest.&quot;";
csb[8] = "One day Elisha went to Shunem. A prominent woman who lived there persuaded him to eat some food. So whenever he passed by, he stopped there to eat.";
csb[9] = "Then she said to her husband, &quot;I know that the one who often passes by here is a holy man of God,";
csb[10] = "&quot;so let\'s make a small, walled-in upper room and put a bed, a table, a chair, and a lamp there for him. Whenever he comes, he can stay there.&quot;";
csb[11] = "One day he came there and stopped at the upstairs room to lie down.";
csb[12] = "He ordered his attendant Gehazi, &quot;Call this Shunammite woman.&quot; So he called her and she stood before him.";
csb[13] = "Then he said to Gehazi, &quot;Say to her, \'Look, you\'ve gone to all this trouble for us. What can we do for you? Can we speak on your behalf to the king or to the commander of the army? \' &quot; She answered, &quot;I am living among my own people.&quot;";
csb[14] = "So he asked, &quot;Then what should be done for her? &quot; Gehazi answered, &quot;Well, she has no son, and her husband is old.&quot;";
csb[15] = "&quot;Call her,&quot; Elisha said. So Gehazi called her, and she stood in the doorway.";
csb[16] = "Elisha said, &quot;At this time next year you will have a son in your arms.&quot; Then she said, &quot;No, my lord. Man of God, do not lie to your servant.&quot;";
csb[17] = "The woman conceived and gave birth to a son at the same time the following year, as Elisha had promised her.";
csb[18] = "The child grew and one day went out to his father and the harvesters.";
csb[19] = "Suddenly he complained to his father, &quot;My head! My head! &quot; His father told his servant, &quot;Carry him to his mother.&quot;";
csb[20] = "So he picked him up and took him to his mother. The child sat on her lap until noon and then died.";
csb[21] = "She went up and laid him on the bed of the man of God, shut him in, and left.";
csb[22] = "She summoned her husband and said, &quot;Please send me one of the servants and one of the donkeys, so I can hurry to the man of God and come back again.&quot;";
csb[23] = "But he said, &quot;Why go to him today? It\'s not a New Moon or a Sabbath.&quot; She replied, &quot;Everything is all right.&quot;";
csb[24] = "Then she saddled the donkey and said to her servant, &quot;Go fast; don\'t slow the pace for me unless I tell you.&quot;";
csb[25] = "So she came to the man of God at Mount Carmel. When the man of God saw her at a distance, he said to his attendant Gehazi, &quot;Look, there\'s the Shunammite woman.";
csb[26] = "&quot;Run out to meet her and ask, \'Are you all right? Is your husband all right? Is your son all right? \' &quot; And she answered, &quot;Everything\'s all right.&quot;";
csb[27] = "When she came up to the man of God at the mountain, she clung to his feet. Gehazi came to push her away, but the man of God said, &quot;Leave her alone -- she is in severe anguish, and the LORD has hidden it from me. He hasn\'t told me.&quot;";
csb[28] = "Then she said, &quot;Did I ask my lord for a son? Didn\'t I say, \'Do not lie to me? \' &quot;";
csb[29] = "So Elisha said to Gehazi, &quot;Tuck your mantle under your belt, take my staff with you, and go. If you meet anyone, don\'t stop to greet him, and if a man greets you, don\'t answer him. Then place my staff on the boy\'s face.&quot;";
csb[30] = "The boy\'s mother said to Elisha, &quot;As the LORD lives and as you yourself live, I will not leave you.&quot; So he got up and followed her.";
csb[31] = "Gehazi went ahead of them and placed the staff on the boy\'s face, but there was no sound or sign of life, so he went back to meet Elisha and told him, &quot;The boy didn\'t wake up.&quot;";
csb[32] = "When Elisha got to the house, he discovered the boy lying dead on his bed.";
csb[33] = "So he went in, closed the door behind the two of them, and prayed to the LORD.";
csb[34] = "Then he went up and lay on the boy: he put mouth to mouth, eye to eye, hand to hand. While he bent down over him, the boy\'s flesh became warm.";
csb[35] = "Elisha got up, went into the house, and paced back and forth. Then he went up and bent down over him again. The boy sneezed seven times and opened his eyes.";
csb[36] = "Elisha called Gehazi and said, &quot;Call the Shunammite woman.&quot; He called her and she came. Then Elisha said, &quot;Pick up your son.&quot;";
csb[37] = "She came, fell at his feet, and bowed to the ground; she picked up her son and left.";
csb[38] = "When Elisha returned to Gilgal, there was a famine in the land. The sons of the prophets were sitting before him. He said to his attendant, &quot;Put on the large pot and make stew for the sons of the prophets.&quot;";
csb[39] = "One went out to the field to gather herbs and found a wild vine from which he gathered as many wild gourds as his garment would hold. Then he came back and cut them up into the pot of stew, but they were unaware of what they were.";
csb[40] = "They served some for the men to eat, but when they ate the stew they cried out, &quot;There\'s death in the pot, man of God! &quot; And they were unable to eat it.";
csb[41] = "Then Elisha said, &quot;Get some flour.&quot; He threw it into the pot and said, &quot;Serve it for the people to eat.&quot; And there was nothing bad in the pot.";
csb[42] = "A man from Baal-shalishah came to the man of God with his sack full of twenty loaves of barley bread from the first bread of the harvest. Elisha said, &quot;Give it to the people to eat.&quot;";
csb[43] = "But Elisha\'s attendant asked, &quot;What? Am I to set this before a hundred men? &quot; &quot;Give it to the people to eat,&quot; Elisha said, &quot;for this is what the LORD says: \'They will eat, and they will have some left over.\' &quot;";
csb[44] = "So he set it before them, and as the LORD had promised, they ate and had some left over.";

hnv[17] = "The woman conceived, and bore a son at that season, when the time came round, as Elisha had said to her.";

dby[18] = "And the child grew, and it came to pass one day, that he went out to his father to the reapers.";

hnv[18] = " When the child was grown, it fell on a day, that he went out to his father to the reapers.";

asv[19] = "And he said unto his father, My head, my head. And he said to his servant, Carry him to his mother.";
yng[19] = "and he saith unto his father, `My head, my head;\' and he saith unto the young man, `Bear him unto his mother;\'";
dby[19] = "And he said to his father, My head, my head! And he said to the servant, Carry him to his mother.";

hnv[19] = "He said to his father, My head, my head. He said to his servant, Carry him to his mother.";

rsv[20] = "And when he had lifted him, and brought him to his mother, the child sat on her lap till noon, and then he died.";
asv[20] = "And when he had taken him, and brought him to his mother, he sat on her knees till noon, and then died.";
yng[20] = "and he beareth him, and bringeth him in unto his mother, and he sitteth on her knees till the noon, and dieth.";
dby[20] = "And he carried him, and brought him to his mother; and he sat on her knees till noon, and died.";

hnv[20] = "When he had taken him, and brought him to his mother, he sat on her knees until noon, and then died.";

hnv[21] = "She went up and laid him on the bed of the man of God, and shut [the door] on him, and went out.";

rsv[22] = "Then she called to her husband, and said, &quot;Send me one of the servants and one of the asses, that I may quickly go to the man of God, and come back again.&quot;";
asv[22] = "And she called unto her husband, and said, Send me, I pray thee, one of the servants, and one of the asses, that I may run to the man of God, and come again.";
yng[22] = "and calleth unto her husband, and saith, `Send, I pray thee, to me, one of the young men, and one of the asses, and I run unto the man of God, and return.\'";
dby[22] = "And she called to her husband, and said, Send me, I pray thee, one of the young men, and one of the asses, and I will run to the man of God, and come again.";

asv[23] = "And he said, Wherefore wilt thou go to him to-day? it is neither new moon nor sabbath. And she said, It shall be well.";
yng[23] = "And he saith, `Wherefore art thou going unto him to-day? -- neither new moon nor sabbath!\' and she saith, `Peace [to thee]!\'";
dby[23] = "And he said, Why wilt thou go to him to-day? It is neither new moon nor sabbath. And she said, [It is] well.";
web[23] = "And he said, Why wilt thou go to him to-day? [it is] neither new-moon, nor sabbath. And she said, [It shall be] well.";
hnv[23] = "He said, Why will you go to him today? it is neither new moon nor Shabbat. She said, It shall be well.";

asv[24] = "Then she saddled an ass, and said to her servant, Drive, and go forward; slacken me not the riding, except I bid thee.";

dby[24] = "Then she saddled the ass, and said to her servant, Drive and go forward; slack not the riding for me, except I bid thee.";
web[24] = "Then she saddled an ass, and said to her servant, Drive, and go forward; slack not [thy] riding for me, except I bid thee.";
hnv[24] = "Then she saddled a donkey, and said to her servant, Drive, and go forward; don\'t slacken me the riding, except I bid you.";
vul[24] = "stravitque asinam et praecepit puero mina et propera ne mihi moram facias in eundo et hoc age quod praecipio tibi";

yng[25] = "And she goeth, and cometh in unto the man of God, unto the hill of Carmel, and it cometh to pass, at the man of God\'s seeing her from over-against, that he saith unto Gehazi his young man, `Lo, this Shunammite;";
dby[25] = "And she went and came to the man of God, to mount Carmel. And it came to pass when the man of God saw her afar off, that he said to Gehazi his servant, Behold, there is the Shunammite:";

hnv[25] = "So she went, and came to the man of God to Mount Karmel. It happened, when the man of God saw her afar off, that he said to Gechazi his servant, Behold, yonder is the Shunammite:";
vul[25] = "profecta est igitur et venit ad virum Dei in montem Carmeli cumque vidisset eam vir Dei de contra ait ad Giezi puerum suum ecce Sunamitis illa";

asv[26] = "run, I pray thee, now to meet her, and say unto her, Is it well with thee? is it well with thy husband? is it well with the child? And she answered, It is well.";
yng[26] = "now, run, I pray thee, to meet her, and say to her, Is there peace to thee? is there peace to thy husband? is there peace to the lad?\' and she saith, `Peace.\'";
dby[26] = "run now, I pray thee, to meet her, and say unto her, Is it well with thee? is it well with thy husband? is it well with the child? And she said, It is well.";

hnv[26] = "please run now to meet her, and ask her, Is it well with you? is it well with your husband? is it well with the child? She answered, It is well.";
vul[26] = "vade ergo in occursum eius et dic ei rectene agitur circa te et circa virum tuum et circa filium tuum quae respondit recte";
kjv[27] = "And when she came to the man of God to the hill, she caught him by the feet: but Gehazi came near to thrust her away. And the man of God said, Let her alone; for her soul [is] vexed within her: and the LORD hath hid [it] from me, and hath not told me.";
rsv[27] = "And when she came to the mountain to the man of God, she caught hold of his feet. And Geha\'zi came to thrust her away. But the man of God said, &quot;Let her alone, for she is in bitter distress; and the LORD has hidden it from me, and has not told me.&quot;";
asv[27] = "And when she came to the man of God to the hill, she caught hold of his feet. And Gehazi came near to thrust her away; but the man of God said, Let her alone: for her soul is vexed within her; and Jehovah hath hid it from me, and hath not told me.";
yng[27] = "And she cometh in unto the man of God, unto the hill, and layeth hold on his feet, and Gehazi cometh nigh to thrust her away, and the man of God saith, `Let her alone, for her soul [is] bitter to her, and Jehovah hath hidden [it] from me, and hath not declared [it] to me.\'";
dby[27] = "And she came to the man of God to the mountain, and caught him by the feet; and Gehazi drew near to thrust her away; but the man of God said, Let her alone, for her soul is troubled within her, and Jehovah has hidden it from me, and has not told me.";
web[27] = "And when she came to the man of God to the hill, she caught him by the feet: but Gehazi came near to thrust her away. And the man of God said, Let her alone; for her soul [is] sorrowful within her: and the LORD hath hid [it] from me, and hath not told me?";
hnv[27] = "When she came to the man of God to the hill, she caught hold of his feet. Gechazi came near to thrust her away; but the man of God said, Let her alone: for her soul is vexed within her; and the LORD has hid it from me, and has not told me.";
vul[27] = "cumque venisset ad virum Dei in monte adprehendit pedes eius et accessit Giezi ut amoveret eam et ait homo Dei dimitte illam anima enim eius in amaritudine est et Dominus celavit me et non indicavit mihi";
kjv[28] = "Then she said, Did I desire a son of my lord? did I not say, Do not deceive me?";

asv[28] = "Then she said, Did I desire a son of my lord? did I not say, Do not deceive me?";
yng[28] = "And she saith, `Did I ask a son from my lord? did I not say, Do not deceive me?\'";
dby[28] = "And she said, Did I desire a son of my lord? did I not say, Do not deceive me?";
web[28] = "Then she said, Did I ask a son from my lord? did I not say, Do not deceive me.";
hnv[28] = "Then she said, Did I desire a son of my lord? Didn\'t I say, Do not deceive me?";
vul[28] = "quae dixit illi numquid petivi filium a domino meo numquid non dixi tibi ne inludas me";
kjv[29] = "Then he said to Gehazi, Gird up thy loins, and take my staff in thine hand, and go thy way: if thou meet any man, salute him not; and if any salute thee, answer him not again: and lay my staff upon the face of the child.";
rsv[29] = "He said to Geha\'zi, &quot;Gird up your loins, and take my staff in your hand, and go. If you meet any one, do not salute him; and if any one salutes you, do not reply; and lay my staff upon the face of the child.&quot;";
asv[29] = "Then he said to Gehazi, Gird up thy loins, and take my staff in thy hand, and go thy way: if thou meet any man, salute him not; and if any salute thee, answer him not again: and lay my staff upon the face of the child.";
yng[29] = "And he saith to Gehazi, `Gird up thy loins, and take my staff in thy hand, and go; when thou dost meet a man, thou dost not salute him; and when a man doth salute thee, thou dost not answer him; and thou hast laid my staff on the face of the youth.\'";
dby[29] = "And he said to Gehazi, Gird up thy loins, and take my staff in thy hand, and go thy way. If thou meet any man, salute him not, and if any salute thee, answer him not again; and lay my staff upon the face of the lad.";
web[29] = "Then he said to Gehazi, Gird up thy loins and take my staff in thy hand, and go thy way: and if thou shalt meet any man, salute him not; and if any shall salute thee, answer him not again: and lay my staff upon the face of the child.";
hnv[29] = "Then he said to Gechazi, Gird up your loins, and take my staff in your hand, and go your way: if you meet any man, Don\'t greet him; and if anyone greets you, don\'t answer him again: and lay my staff on the face of the child.";
vul[29] = "et ille ait ad Giezi accinge lumbos tuos et tolle baculum meum in manu tua et vade si occurrerit tibi homo non salutes eum et si salutaverit te quispiam non respondeas illi et pones baculum meum super faciem pueri";
kjv[30] = "And the mother of the child said, [As] the LORD liveth, and [as] thy soul liveth, I will not leave thee. And he arose, and followed her.";
rsv[30] = "Then the mother of the child said, &quot;As the LORD lives, and as you yourself live, I will not leave you.&quot; So he arose and followed her.";
asv[30] = "And the mother of the child said, As Jehovah liveth, and as thy soul liveth, I will not leave thee. And he arose, and followed her.";
yng[30] = "And the mother of the youth saith, `Jehovah liveth, and thy soul liveth -- if I leave thee;\' and he riseth and goeth after her.";
dby[30] = "And the mother of the lad said, As Jehovah liveth, and as thy soul liveth, I will not leave thee! And he rose up and followed her.";
web[30] = "And the mother of the child said, [As] the LORD liveth, and [as] thy soul liveth, I will not leave thee. And he arose, and followed her.";
hnv[30] = "The mother of the child said, As the LORD lives, and as your soul lives, I will not leave you. He arose, and followed her.";
vul[30] = "porro mater pueri ait vivit Dominus et vivit anima tua non dimittam te surrexit ergo et secutus est eam";
kjv[31] = "And Gehazi passed on before them, and laid the staff upon the face of the child; but [there was] neither voice, nor hearing. Wherefore he went again to meet him, and told him, saying, The child is not awaked.";
rsv[31] = "Geha\'zi went on ahead and laid the staff upon the face of the child, but there was no sound or sign of life. Therefore he returned to meet him, and told him, &quot;The child has not awaked.&quot;";
asv[31] = "And Gehazi passed on before them, and laid the staff upon the face of the child; but there was neither voice, nor hearing. Wherefore he returned to meet him, and told him, saying, The child is not awaked.";
yng[31] = "And Gehazi hath passed on before them, and layeth the staff on the face of the youth, and there is no voice, and there is no attention, and he turneth back to meet him, and declareth to him, saying, `The youth hath not awaked.\'";
dby[31] = "And Gehazi passed on before them, and laid the staff upon the face of the lad; but there was neither voice, nor sign of attention. And he returned to meet him, and told him saying, The lad is not awaked.";
web[31] = "And Gehazi passed on before them, and laid the staff upon the face of the child; but [there was] neither voice, nor hearing. Wherefore he went again to meet him, and told him, saying, The child is not awaked.";
hnv[31] = "Gechazi passed on before them, and laid the staff on the face of the child; but there was neither voice, nor hearing. Therefore he returned to meet him, and told him, saying, The child has not awakened.";
vul[31] = "Giezi autem praecesserat eos et posuerat baculum super faciem pueri et non erat vox neque sensus reversusque est in occursum eius et nuntiavit ei dicens non surrexit puer";
kjv[32] = "And when Elisha was come into the house, behold, the child was dead, [and] laid upon his bed.";
rsv[32] = "When Eli\'sha came into the house, he saw the child lying dead on his bed.";
asv[32] = "And when Elisha was come into the house, behold, the child was dead, and laid upon his bed.";
yng[32] = "And Elisha cometh in to the house, and lo, the youth is dead, laid on his bed,";
dby[32] = "And when Elisha came into the house, behold, the child was dead, [and] laid upon his bed.";
web[32] = "And when Elisha had come into the house, behold, the child was dead, [and] laid upon his bed.";
hnv[32] = "When Elisha was come into the house, behold, the child was dead, and laid on his bed.";
vul[32] = "ingressus est ergo Heliseus domum et ecce puer mortuus iacebat in lectulo eius";
kjv[33] = "He went in therefore, and shut the door upon them twain, and prayed unto the LORD.";
rsv[33] = "So he went in and shut the door upon the two of them, and prayed to the LORD.";
asv[33] = "He went in therefore, and shut the door upon them twain, and prayed unto Jehovah.";
yng[33] = "and he goeth in and shutteth the door upon them both, and prayeth unto Jehovah.";
dby[33] = "And he went in and shut the door upon them both, and prayed to Jehovah.";
web[33] = "He went in therefore, and shut the door upon them both, and prayed to the LORD.";
hnv[33] = "He went in therefore, and shut the door on them both, and prayed to the LORD.";
vul[33] = "ingressusque clusit ostium super se et puerum et oravit ad Dominum";

rsv[34] = "Then he went up and lay upon the child, putting his mouth upon his mouth, his eyes upon his eyes, and his hands upon his hands; and as he stretched himself upon him, the flesh of the child became warm.";
asv[34] = "And he went up, and lay upon the child, and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands: and he stretched himself upon him; and the flesh of the child waxed warm.";
yng[34] = "And he goeth up, and lieth down on the lad, and putteth his mouth on his mouth, and his eyes on his eyes, and his hands on his hands, and stretcheth himself upon him, and the flesh of the lad becometh warm;";
dby[34] = "And he went up, and lay upon the child, and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands, and bent over him; and the flesh of the child grew warm.";
web[34] = "And he went up, and lay upon the child, and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands: and he stretched himself upon the child; and the flesh of the child became warm.";
hnv[34] = "He went up, and lay on the child, and put his mouth on his mouth, and his eyes on his eyes, and his hands on his hands: and he stretched himself on him; and the flesh of the child grew warm.";
vul[34] = "et ascendit et incubuit super puerum posuitque os suum super os eius et oculos suos super oculos eius et manus suas super manus eius et incurvavit se super eum et calefacta est caro pueri";
kjv[35] = "Then he returned, and walked in the house to and fro; and went up, and stretched himself upon him: and the child sneezed seven times, and the child opened his eyes.";
rsv[35] = "Then he got up again, and walked once to and fro in the house, and went up, and stretched himself upon him; the child sneezed seven times, and the child opened his eyes.";
asv[35] = "Then he returned, and walked in the house once to and fro; and went up, and stretched himself upon him: and the child sneezed seven times, and the child opened his eyes.";
yng[35] = "and he turneth back and walketh in the house, once hither and once thither, and goeth up and stretcheth himself upon him, and the youth sneezeth till seven times, and the youth openeth his eyes.";
dby[35] = "And he returned, and walked in the house to and fro; and went up, and bent over him. And the lad sneezed seven times, and the lad opened his eyes.";
web[35] = "Then he returned, and walked in the house to and fro; and went up, and stretched himself upon him: and the child sneezed seven times, and the child opened his eyes.";
hnv[35] = " Then he returned, and walked in the house once back and forth; and went up, and stretched himself on him: and the child sneezed seven times, and the child opened his eyes.";
vul[35] = "at ille reversus deambulavit in domo semel huc et illuc et ascendit et incubuit super eum et oscitavit puer septies aperuitque oculos";
kjv[36] = "And he called Gehazi, and said, Call this Shunammite. So he called her. And when she was come in unto him, he said, Take up thy son.";
rsv[36] = "Then he summoned Geha\'zi and said, &quot;Call this Shu\'nammite.&quot; So he called her. And when she came to him, he said, &quot;Take up your son.&quot;";
asv[36] = "And he called Gehazi, and said, Call this Shunammite. So he called her. And when she was come in unto him, he said, Take up thy son.";
yng[36] = "And he calleth unto Gehazi, and saith, `Call unto this Shunammite;\' and he calleth her, and she cometh in unto him, and he saith, `Lift up thy son.\'";
dby[36] = "And he called Gehazi, and said, Call this Shunammite. And he called her; and she came to him. And he said, Take up thy son.";

yng[38] = "And Elisha hath turned back to Gilgal, and the famine [is] in the land, and the sons of the prophets are sitting before him, and he saith to his young man, `Set on the great pot, and boil pottage for the sons of the prophets.\'";
