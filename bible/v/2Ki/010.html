csb[1] = "Since Ahab had seventy sons in Samaria, Jehu wrote letters and sent them to Samaria to the rulers of Jezreel, to the elders, and to the guardians of Ahab\'s sons, saying:";
csb[2] = "Your master\'s sons are with you, and you have chariots, horses, a fortified city, and weaponry, so when this letter arrives";
csb[3] = "select the most qualified of your master\'s sons, set him on his father\'s throne, and fight for your master\'s house.";
csb[4] = "However, they were terrified and reasoned, &quot;Look, two kings couldn\'t stand against him; how can we? &quot;";
csb[5] = "So the overseer of the palace, the overseer of the city, the elders, and the guardians sent a message to Jehu: &quot;We are your servants, and we will do whatever you tell us. We will not make anyone king. Do whatever you think is right.&quot;";
csb[6] = "Then Jehu wrote them a second letter, saying: If you are on my side, and if you will obey me, bring me the heads of your master\'s sons at this time tomorrow at Jezreel. All seventy of the king\'s sons were being cared for by the city\'s prominent men.";
csb[7] = "When the letter came to them, they took the king\'s sons and slaughtered all seventy, put their heads in baskets, and sent them to Jehu at Jezreel.";
csb[8] = "When the messenger came and told him, &quot;They have brought the heads of the king\'s sons,&quot; the king said, &quot;Pile them in two heaps at the entrance of the city gate until morning.&quot;";
csb[9] = "The next morning when he went out and stood at the gate, he said to all the people, &quot;You are innocent. It was I who conspired against my master and killed him. But who struck down all these?";
csb[10] = "&quot;Know, then, that not a word the LORD spoke against the house of Ahab will fail, for the LORD has done what he promised through his servant Elijah.&quot;";
csb[11] = "So Jehu killed all who remained of the house of Ahab in Jezreel -- all his great men, close friends, and priests -- leaving him no survivors.";
csb[12] = "Then he set out and went to Samaria. On the way, while he was at Beth-eked of the Shepherds,";
csb[13] = "Jehu met the relatives of King Ahaziah of Judah and asked, &quot;Who are you? &quot; They answered, &quot;We\'re Ahaziah\'s relatives. We\'ve come down to greet the king\'s sons and the queen mother\'s sons.&quot;";
csb[14] = "Then Jehu ordered, &quot;Take them alive.&quot; So they took them alive and then slaughtered them at the pit of Beth-eked -- forty-two men. He didn\'t spare any of them.";
csb[15] = "When he left there, he found Jehonadab son of Rechab coming to meet him. He greeted him and then asked, &quot;Is your heart one with mine? &quot; &quot;It is,&quot; Jehonadab replied. Jehu said, &quot;If it is, give me your hand.&quot; So he gave him his hand, and Jehu pulled him up into the chariot with him.";
csb[16] = "Then he said, &quot;Come with me and see my zeal for the LORD! &quot; So he let him ride with him in his chariot.";
csb[17] = "When Jehu came to Samaria, he struck down all who remained from the house of Ahab in Samaria until he had annihilated his house, according to the word of the LORD spoken to Elijah.";
csb[18] = "Then Jehu brought all the people together and said to them, &quot;Ahab served Baal a little, but Jehu will serve him a lot.";
csb[19] = "&quot;Now, therefore, summon to me all the prophets of Baal, all his servants, and all his priests. None must be missing, for I have a great sacrifice for Baal. Whoever is missing will not live.&quot; However, Jehu was acting deceptively in order to destroy the servants of Baal.";
csb[20] = "Jehu commanded, &quot;Consecrate a solemn assembly for Baal.&quot; So they called one.";
csb[21] = "Then Jehu sent messengers throughout all Israel, and all the servants of Baal came; no one failed to come. They entered the temple of Baal, and it was filled from one end to the other.";
csb[22] = "Then he said to the custodian of the wardrobe, &quot;Bring out the garments for all the servants of Baal.&quot; So he brought out their garments.";
csb[23] = "Then Jehu and Jehonadab son of Rechab entered the temple of Baal, and Jehu said to the servants of Baal, &quot;Look carefully to see that there are no servants of the LORD here among you -- only servants of Baal.&quot;";
csb[24] = "Then they went in to offer sacrifices and burnt offerings. Now Jehu had stationed eighty men outside, and he warned them, &quot;Whoever allows any of the men I am placing in your hands to escape will forfeit his life for theirs.&quot;";
csb[25] = "When he finished offering the burnt offering, Jehu said to the guards and officers, &quot;Go in and kill them. Don\'t let anyone out.&quot; So they struck them down with the sword. Then the guards and officers threw the bodies out and went into the inner room of the temple of Baal.";
csb[26] = "They brought out the pillar of the temple of Baal and burned it,";
csb[27] = "and they tore down the pillar of Baal. Then they tore down the temple of Baal and made it a latrine -- which it still is today.";
csb[28] = "Jehu eliminated Baal worship from Israel,";
csb[29] = "but he did not turn away from the sins that Jeroboam son of Nebat had caused Israel to commit -- worshiping the gold calves that were in Bethel and Dan.";
csb[30] = "Nevertheless, the LORD said to Jehu, &quot;Because you have done well in carrying out what is right in my sight and have done to the house of Ahab all that was in my heart, four generations of your sons will sit on the throne of Israel.&quot;";
csb[31] = "Yet Jehu was not careful to follow the instruction of the LORD God of Israel with all his heart. He did not turn from the sins that Jeroboam had caused Israel to commit.";
csb[32] = "In those days the LORD began to reduce the size of Israel. Hazael defeated the Israelites throughout their territory";
csb[33] = "from the Jordan eastward: the whole land of Gilead -- the Gadites, the Reubenites, and the Manassites -- from Aroer which is by the Arnon Valley through Gilead to Bashan.";
csb[34] = "The rest of the events of Jehu\'s reign, along with all his accomplishments and all his might, are written in the Historical Record of Israel\'s Kings.";
csb[35] = "Jehu rested with his fathers and was buried in Samaria. His son Jehoahaz became king in his place.";
csb[36] = "The length of Jehu\'s reign over Israel in Samaria was twenty-eight years.";

rsv[5] = "So he who was over the palace, and he who was over the city, together with the elders and the guardians, sent to Jehu, saying, &quot;We are your servants, and we will do all that you bid us. We will not make any one king; do whatever is good in your eyes.&quot;";
asv[5] = "And he that was over the household, and he that was over the city, the elders also, and they that brought up [the children], sent to Jehu, saying, We are thy servants, and will do all that thou shalt bid us; we will not make any man king: do thou that which is good in thine eyes.";
yng[5] = "And he who [is] over the house, and he who [is] over the city, and the elders, and the supporters, send unto Jehu, saying, `Thy servants we [are], and all that thou sayest unto us we do; we do not make any one king -- that which [is] good in thine eyes do.\'";
dby[5] = "And he that was over the house, and he that was over the city, and the elders, and the guardians sent to Jehu, saying, We are thy servants, and will do all that thou shalt bid us; we will not make any one king; do what is good in thy sight.";

vul[5] = "miserunt ergo praepositus domus et praefectus civitatis et maiores natu et nutricii ad Hieu dicentes servi tui sumus quaecumque iusseris faciemus nec constituemus regem quodcumque tibi placet fac";
kjv[6] = "Then he wrote a letter the second time to them, saying, If ye [be] mine, and [if] ye will hearken unto my voice, take ye the heads of the men your master\'s sons, and come to me to Jezreel by to morrow this time. Now the king\'s sons, [being] seventy persons, [were] with the great men of the city, which brought them up.";
rsv[6] = "Then he wrote to them a second letter, saying, &quot;If you are on my side, and if you are ready to obey me, take the heads of your master\'s sons, and come to me at Jezreel tomorrow at this time.&quot; Now the king\'s sons, seventy persons, were with the great men of the city, who were bringing them up.";
asv[6] = "Then he wrote a letter the second time to them, saying, If ye be on my side, and if ye will hearken unto my voice, take ye the heads of the men your master\'s sons, and come to me to Jezreel by to-morrow this time. Now the king\'s sons, being seventy persons, were with the great men of the city, who brought them up.";
yng[6] = "And he writeth unto them a letter a second time, saying, `If ye [are] for me, and to my voice are hearkening, take the heads of the men -- the sons of your lord, and come unto me about this time to-morrow, to Jezreel;\' and the sons of the king [are] seventy men, with the great ones of the city those bringing them up.";
dby[6] = "And he wrote a letter the second time to them saying, If ye are mine, and will hearken to my voice, take the heads of the men your master\'s sons, and come to me to Jizreel to-morrow at this time. Now the king\'s sons, seventy persons, were with the great men of the city, who brought them up.";

kjv[13] = "Jehu met with the brethren of Ahaziah king of Judah, and said, Who [are] ye? And they answered, We [are] the brethren of Ahaziah; and we go down to salute the children of the king and the children of the queen.";
rsv[13] = "Jehu met the kinsmen of Ahazi\'ah king of Judah, and he said, &quot;Who are you?&quot; And they answered, &quot;We are the kinsmen of Ahazi\'ah, and we came down to visit the royal princes and the sons of the queen mother.&quot;";
asv[13] = "Jehu met with the brethren of Ahaziah king of Judah, and said, Who are ye? And they answered, We are the brethren of Ahaziah: and we go down to salute the children of the king and the children of the queen.";
yng[13] = "and Jehu hath found the brethren of Ahaziah king of Judah, and saith, `Who [are] ye?\' and they say, `Brethren of Ahaziah we [are], and we go down to salute the sons of the king, and the sons of the mistress.\'";
dby[13] = "Jehu found the brethren of Ahaziah king of Judah, and said, Who are ye? And they said, We are the brethren of Ahaziah; and have come down to salute the children of the king, and the children of the queen.";
web[13] = "Jehu met with the brethren of Ahaziah king of Judah, and said, Who [are] ye? And they answered, We [are] the brethren of Ahaziah; and we go down to salute the children of the king and the children of the queen.";
hnv[13] = "Yehu met with the brothers of Achazyah king of Yehudah, and said, Who are you? They answered, We are the brothers of Achazyah: and we go down to Greet the children of the king and the children of the queen.";
vul[13] = "invenit fratres Ahaziae regis Iuda dixitque ad eos quinam estis vos at illi responderunt fratres Ahaziae sumus et descendimus ad salutandos filios regis et filios reginae";
kjv[14] = "And he said, Take them alive. And they took them alive, and slew them at the pit of the shearing house, [even] two and forty men; neither left he any of them.";
rsv[14] = "He said, &quot;Take them alive.&quot; And they took them alive, and slew them at the pit of Beth-eked, forty-two persons, and he spared none of them.";
asv[14] = "And he said, Take them alive. And they took them alive, and slew them at the pit of the shearing-house, even two and forty men; neither left he any of them.";
yng[14] = "And he saith, `Catch them alive;\' and they catch them alive, and slaughter them at the pit of the shearing-house, forty and two men, and he hath not left a man of them.";
dby[14] = "And he said, Take them alive! And they took them alive, and slew them at the well of the meeting-place, forty-two men; and he left not one of them remaining.";
web[14] = "And he said, Take them alive. And they took them alive, and slew them at the pit of the shearing-house, [even] two and forty men; neither left he any of them.";
hnv[14] = "He said, Take them alive. They took them alive, and killed them at the pit of the shearing-house, even two and forty men; neither left he any of them.";
vul[14] = "qui ait conprehendite eos vivos quos cum conprehendissent vivos iugulaverunt eos in cisterna iuxta Camaram quadraginta duos viros et non reliquit ex eis quemquam";
kjv[15] = "And when he was departed thence, he lighted on Jehonadab the son of Rechab [coming] to meet him: and he saluted him, and said to him, Is thine heart right, as my heart [is] with thy heart? And Jehonadab answered, It is. If it be, give [me] thine hand. And he gave [him] his hand; and he took him up to him into the chariot.";
rsv[15] = "And when he departed from there, he met Jehon\'adab the son of Rechab coming to meet him; and he greeted him, and said to him, &quot;Is your heart true to my heart as mine is to yours?&quot; And Jehon\'adab answered, &quot;It is.&quot; Jehu said, &quot;If it is, give me your hand.&quot; So he gave him his hand. And Jehu took him up with him into the chariot.";
asv[15] = "And when he was departed thence, he lighted on Jehonadab the son of Rechab coming to meet him; and he saluted him, and said to him, Is thy heart right, as my heart is with thy heart? And Jehonadab answered, It is. If it be, give me thy hand. And he gave him his hand; and he took him up to him into the chariot.";
yng[15] = "And he goeth thence, and findeth Jehonadab son of Rechab -- to meet him, and blesseth him, and saith unto him, `Is thy heart right, as my heart [is] with thy heart?\' and Jehonadab saith, `It is;\' -- `Then it is; give thy hand;\' and he giveth his hand, and he causeth him to come up into him into the chariot,";
dby[15] = "And he departed thence, and found Jehonadab the son of Rechab [coming] to meet him; and he greeted him, and said to him, Is thy heart right, as my heart is with thy heart? And Jehonadab said, It is. -- If it be, give [me] thy hand. -- And he gave [him] his hand; and [Jehu] took him up to him into the chariot,";
web[15] = "And when he had departed thence, he lighted on Jehonadab the son of Rechab [coming] to meet him: and he saluted him, and said to him, Is thy heart right, as my heart [is] with thy heart; And Jehonadab answered, It is. If it is, give [me] thy hand. And he gave [him] his hand; and he took him up to him into the chariot.";
hnv[15] = "When he was departed there, he lighted on Yehonadav the son of Rechav coming to meet him; and he greeted him, and said to him, Is your heart right, as my heart is with your heart? Yehonadav answered, It is. If it be, give me your hand. He gave him his hand; and he took him up to him into the chariot.";
vul[15] = "cumque abisset inde invenit Ionadab filium Rechab in occursum sibi et benedixit ei et ait ad eum numquid est cor tuum rectum sicut cor meum cum corde tuo et ait Ionadab est si est inquit da manum tuam qui dedit manum suam at ille levavit eum ad se in curru";
kjv[16] = "And he said, Come with me, and see my zeal for the LORD. So they made him ride in his chariot.";
rsv[16] = "And he said, &quot;Come with me, and see my zeal for the LORD.&quot; So he had him ride in his chariot.";
asv[16] = "And he said, Come with me, and see my zeal for Jehovah. So they made him ride in his chariot.";
yng[16] = "and saith, `Come with me, and look on my zeal for Jehovah;\' and they cause him to ride in his chariot.";
dby[16] = "and said, Come with me, and see my zeal for Jehovah. So they made him ride in his chariot.";
web[16] = "And he said, Come with me, and see my zeal for the LORD. So they made him ride in his chariot.";
hnv[16] = "He said, Come with me, and see my zeal for the LORD. So they made him ride in his chariot.";
vul[16] = "dixitque ad eum veni mecum et vide zelum meum pro Domino et inpositum currui suo";
kjv[17] = "And when he came to Samaria, he slew all that remained unto Ahab in Samaria, till he had destroyed him, according to the saying of the LORD, which he spake to Elijah.";
rsv[17] = "And when he came to Sama\'ria, he slew all that remained to Ahab in Sama\'ria, till he had wiped them out, according to the word of the LORD which he spoke to Eli\'jah.";
asv[17] = "And when he came to Samaria, he smote all that remained unto Ahab in Samaria, till he had destroyed him, according to the word of Jehovah, which he spake to Elijah.";
yng[17] = "And he cometh in to Samaria, and smiteth all those left to Ahab in Samaria, till his destroying him, according to the word of Jehovah that He spake unto Elisha.";
dby[17] = "And he came to Samaria, and smote all that remained to Ahab in Samaria, until he had destroyed him, according to the word of Jehovah which he spoke to Elijah.";
web[17] = "And when he came to Samaria, he slew all that remained to Ahab in Samaria, till he had destroyed him, according to the saying of the LORD, which he spoke to Elijah.";
hnv[17] = "When he came to Shomron, he struck all who remained to Ach\'av in Shomron, until he had destroyed him, according to the word of the LORD, which he spoke to Eliyah.";
vul[17] = "duxit in Samariam et percussit omnes qui reliqui fuerant de Ahab in Samaria usque ad unum iuxta verbum Domini quod locutus est per Heliam";
kjv[18] = "And Jehu gathered all the people together, and said unto them, Ahab served Baal a little; [but] Jehu shall serve him much.";
rsv[18] = "Then Jehu assembled all the people, and said to them, &quot;Ahab served Ba\'al a little; but Jehu will serve him much.";
asv[18] = "And Jehu gathered all the people together, and said unto them, Ahab served Baal a little; but Jehu will serve him much.";
yng[18] = "And Jehu gathereth the whole of the people, and saith unto them, `Ahab served Baal a little -- Jehu doth serve him much:";
dby[18] = "And Jehu gathered all the people together, and said to them, Ahab served Baal a little: Jehu will serve him much.";
web[18] = "And Jehu convened all the people, and said to them, Ahab served Baal a little; [but] Jehu shall serve him much.";
hnv[18] = "Yehu gathered all the people together, and said to them, Ach\'av served Ba`al a little; but Yehu will serve him much.";
vul[18] = "congregavit ergo Hieu omnem populum et dixit ad eos Ahab coluit Baal parum ego autem colam eum amplius";
kjv[19] = "Now therefore call unto me all the prophets of Baal, all his servants, and all his priests; let none be wanting: for I have a great sacrifice [to do] to Baal; whosoever shall be wanting, he shall not live. But Jehu did [it] in subtilty, to the intent that he might destroy the worshippers of Baal.";
rsv[19] = "Now therefore call to me all the prophets of Ba\'al, all his worshipers and all his priests; let none be missing, for I have a great sacrifice to offer to Ba\'al; whoever is missing shall not live.&quot; But Jehu did it with cunning in order to destroy the worshipers of Ba\'al.";
asv[19] = "Now therefore call unto me all the prophets of Baal, all his worshippers, and all his priests; let none be wanting: for I have a great sacrifice [to do] to Baal; whosoever shall be wanting, he shall not live. But Jehu did it in subtlety, to the intent that he might destroy the worshippers of Baal.";
yng[19] = "and now, all the prophets of Baal, all his servants, and all his priests, call ye unto me; let not a man be lacking, for a great sacrifice I have for Baal; every one who is lacking -- he doth not live;\' and Jehu hath done [it] in subtilty, in order to destroy the servants of Baal.";
dby[19] = "And now call me all the prophets of Baal, all his servants, and all his priests: let none be wanting; for I have a great sacrifice [to do] to Baal; whoever shall be wanting shall not live. But Jehu did it in subtilty, in order that he might bring destruction upon the servants of Baal.";
web[19] = "Now therefore call to me all the prophets of Baal, all his servants, and all his priests; let none be wanting: for I have a great sacrifice [to do] to Baal: whoever shall be wanting, he shall not live. But Jehu did [it] in subtilty, to the intent that he might destroy the worshipers of Baal.";
hnv[19] = "Now therefore call to me all the prophets of Ba`al, all his worshippers, and all his Kohanim; let none be wanting: for I have a great sacrifice [to do] to Ba`al; whoever shall be wanting, he shall not live. But Yehu did it in subtlety, to the intent that he might destroy the worshippers of Ba`al.";
vul[19] = "nunc igitur omnes prophetas Baal et universos servos eius et cunctos sacerdotes ipsius vocate ad me nullus sit qui non veniat sacrificium enim grande est mihi Baal quicumque defuerit non vivet porro Hieu faciebat hoc insidiose ut disperderet cultores Baal";
kjv[20] = "And Jehu said, Proclaim a solemn assembly for Baal. And they proclaimed [it].";
rsv[20] = "And Jehu ordered, &quot;Sanctify a solemn assembly for Ba\'al.&quot; So they proclaimed it.";
asv[20] = "And Jehu said, Sanctify a solemn assembly for Baal. And they proclaimed it.";
yng[20] = "And Jehu saith, `Sanctify a restraint for Baal;\' and they proclaim [it].";
dby[20] = "And Jehu said, Hallow a solemn assembly for Baal. And they proclaimed [it].";
web[20] = "And Jehu said, Proclaim a solemn assembly for Baal. And they proclaimed [it].";
hnv[20] = "Yehu said, Sanctify a solemn assembly for Ba`al. They proclaimed it.";
vul[20] = "dixit sanctificate diem sollemnem Baal vocavitque";
kjv[21] = "And Jehu sent through all Israel: and all the worshippers of Baal came, so that there was not a man left that came not. And they came into the house of Baal; and the house of Baal was full from one end to another.";
rsv[21] = "And Jehu sent throughout all Israel; and all the worshipers of Ba\'al came, so that there was not a man left who did not come. And they entered the house of Ba\'al, and the house of Ba\'al was filled from one end to the other.";
asv[21] = "And Jehu sent through all Israel: and all the worshippers of Baal came, so that there was not a man left that came not. And they came into the house of Baal; and the house of Baal was filled from one end to another.";
yng[21] = "And Jehu sendeth into all Israel, and all the servants of Baal come in, and there hath not been left a man who hath not come in; and they come in to the house of Baal, and the house of Baal is full -- mouth to mouth.";
dby[21] = "And Jehu sent into all Israel; and all the servants of Baal came, so that there was not a man left that came not: and they entered into the house of Baal; and the house of Baal was full from one end to the other.";
web[21] = "And Jehu sent through all Israel: and all the worshipers of Baal came, so that there was not a man left that came not. And they came into the house of Baal; and the house of Baal was full from one end to another.";
hnv[21] = "Yehu sent through all Yisra\'el: and all the worshippers of Ba`al came, so that there was not a man left that didn\'t come. They came into the house of Ba`al; and the house of Ba`al was filled from one end to another.";
vul[21] = "et misit in universos terminos Israhel et venerunt cuncti servi Baal non fuit residuus ne unus quidem qui non veniret et ingressi sunt templum Baal et repleta est domus Baal a summo usque ad summum";
kjv[22] = "And he said unto him that [was] over the vestry, Bring forth vestments for all the worshippers of Baal. And he brought them forth vestments.";
rsv[22] = "He said to him who was in charge of the wardrobe, &quot;Bring out the vestments for all the worshipers of Ba\'al.&quot; So he brought out the vestments for them.";
asv[22] = "And he said unto him that was over the vestry, Bring forth vestments for all the worshippers of Baal. And he brought them forth vestments.";
yng[22] = "And he saith to him who [is] over the wardrobe, `Bring out clothing to all servants of Baal;\' and he bringeth out to them the clothing.";
dby[22] = "And he said to him that was over the wardrobe, Bring forth vestments for all the servants of Baal. And he brought them forth vestments.";
web[22] = "And he said to him that [was] over the vestry, Bring forth vestments for all the worshipers of Baal. And he brought them forth vestments.";
hnv[22] = "He said to him who was over the vestry, Bring forth vestments for all the worshippers of Ba`al. He brought them forth vestments.";
vul[22] = "dixitque his qui erant super vestes proferte vestimenta universis servis Baal et protulerunt eis vestes";
kjv[23] = "And Jehu went, and Jehonadab the son of Rechab, into the house of Baal, and said unto the worshippers of Baal, Search, and look that there be here with you none of the servants of the LORD, but the worshippers of Baal only.";
rsv[23] = "Then Jehu went into the house of Ba\'al with Jehon\'adab the son of Rechab; and he said to the worshipers of Ba\'al, &quot;Search, and see that there is no servant of the LORD here among you, but only the worshipers of Ba\'al.&quot;";
asv[23] = "And Jehu went, and Jehonadab the son of Rechab, into the house of Baal; and he said unto the worshippers of Baal, Search, and look that there be here with you none of the servants of Jehovah, but the worshippers of Baal only.";
yng[23] = "And Jehu goeth in, and Jehonadab son of Rechab, to the house of Baal, and saith to the servants of Baal, `Search and see, lest there be here with you of the servants of Jehovah -- but, the servants of Baal by themselves.\'";
dby[23] = "And Jehu and Jehonadab the son of Rechab entered into the house of Baal, and said to the servants of Baal, Search, and see that there be here with you none of the servants of Jehovah, but the servants of Baal only.";
web[23] = "And Jehu went, and Jehonadab the son of Rechab, into the house of Baal, and said to the worshipers of Baal, Search, and look that there are here with you none of the servants of the LORD, but the worshipers of Baal only.";
hnv[23] = "Yehu went, and Yehonadav the son of Rechav, into the house of Ba`al; and he said to the worshippers of Ba`al, Search, and look that there be here with you none of the servants of the LORD, but the worshippers of Ba`al only.";
vul[23] = "ingressusque Hieu et Ionadab filius Rechab templum Baal et ait cultoribus Baal perquirite et videte ne quis forte vobiscum sit de servis Domini sed ut sint soli servi Baal";
kjv[24] = "And when they went in to offer sacrifices and burnt offerings, Jehu appointed fourscore men without, and said, [If] any of the men whom I have brought into your hands escape, [he that letteth him go], his life [shall be] for the life of him.";
rsv[24] = "Then he went in to offer sacrifices and burnt offerings. Now Jehu had stationed eighty men outside, and said, &quot;The man who allows any of those whom I give into your hands to escape shall forfeit his life.&quot;";
asv[24] = "And they went in to offer sacrifices and burnt-offerings. Now Jehu had appointed him fourscore men without, and said, If any of the men whom I bring into your hands escape, [he that letteth him go], his life shall be for the life of him.";
yng[24] = "And they come in to make sacrifices and burnt-offerings, and Jehu hath set for himself in an out-place eighty men, and saith, `The man who letteth escape [any] of the men whom I am bringing in unto your hand -- his soul for his soul.\'";
dby[24] = "And they entered in to offer sacrifices and burnt-offerings. Now Jehu appointed eighty men without, and said, He that allows any of the men to escape that I have brought into your hands, his life shall be for the life of him.";
web[24] = "And when they went in to offer sacrifices and burnt-offerings, Jehu appointed eighty men without, and said, [If] any of the men whom I have brought into your hands escape, [he that letteth him go], his life [shall be] for the life of him.";
hnv[24] = "They went in to offer sacrifices and burnt offerings. Now Yehu had appointed him eighty men outside, and said, If any of the men whom I bring into your hands escape, [he who lets him go], his life shall be for the life of him.";
vul[24] = "ingressi sunt igitur ut facerent victimas et holocausta Hieu autem praeparaverat sibi foris octoginta viros et dixerat eis quicumque fugerit de hominibus his quos ego adduxero in manus vestras anima eius erit pro anima illius";
kjv[25] = "And it came to pass, as soon as he had made an end of offering the burnt offering, that Jehu said to the guard and to the captains, Go in, [and] slay them; let none come forth. And they smote them with the edge of the sword; and the guard and the captains cast [them] out, and went to the city of the house of Baal.";
rsv[25] = "So as soon as he had made an end of offering the burnt offering, Jehu said to the guard and to the officers, &quot;Go in and slay them; let not a man escape.&quot; So when they put them to the sword, the guard and the officers cast them out and went into the inner room of the house of Ba\'al";
asv[25] = "And it came to pass, as soon as he had made an end of offering the burnt-offering, that Jehu said to the guard and to the captains, Go in, and slay them; let none come forth. And they smote them with the edge of the sword; and the guard and the captains cast them out, and went to the city of the house of Baal.";
yng[25] = "And it cometh to pass at his finishing to make the burnt-offering, that Jehu saith to the runners, and to the captains, `Go in, smite them, let none come out;\' and they smite them by the mouth of the sword, and the runners and the captains cast [them] out; and they go unto the city, to the house of Baal,";
dby[25] = "And it came to pass as soon as they had ended offering up the burnt-offering, that Jehu said to the couriers and to the captains, Go in, slay them; let none come forth. And they smote them with the edge of the sword; and the couriers and the captains cast [them] there. And they went to the city of the house of Baal,";
web[25] = "And it came to pass, as soon as he had made an end of offering the burnt-offering, that Jehu said to the guard and to the captains, Go in, [and] slay them; let none come forth. And they smote them with the edge of the sword; and the guard and the captains cast [them] out, and went to the city of the house of Baal.";
hnv[25] = "It happened, as soon as he had made an end of offering the burnt offering, that Yehu said to the guard and to the captains, Go in, and kill them; let none come forth. They struck them with the edge of the sword; and the guard and the captains cast them out, and went to the city of the house of Ba`al.";
vul[25] = "factum est ergo cum conpletum esset holocaustum praecepit Hieu militibus et ducibus suis ingredimini et percutite eos nullus evadat percusseruntque eos ore gladii et proiecerunt milites et duces et ierunt in civitatem templi Baal";
kjv[26] = "And they brought forth the images out of the house of Baal, and burned them.";
rsv[26] = "and they brought out the pillar that was in the house of Ba\'al, and burned it.";
asv[26] = "And they brought forth the pillars that were in the house of Baal, and burned them.";
yng[26] = "and bring out the standing-pillars of the house of Baal, and burn them,";
dby[26] = "and brought forth the columns out of the house of Baal, and burned them;";
web[26] = "And they brought forth the images out of the house of Baal, and burned them.";
hnv[26] = "They brought forth the pillars that were in the house of Ba`al, and burned them.";
vul[26] = "et protulerunt statuam de fano Baal et conbuserunt";
kjv[27] = "And they brake down the image of Baal, and brake down the house of Baal, and made it a draught house unto this day.";
rsv[27] = "And they demolished the pillar of Ba\'al, and demolished the house of Ba\'al, and made it a latrine to this day.";
asv[27] = "And they brake down the pillar of Baal, and brake down the house of Baal, and made it a draught-house, unto this day.";
yng[27] = "and break down the standing-pillar of Baal, and break down the house of Baal, and appoint it for a draught-house unto this day.";
dby[27] = "and they broke down the column of Baal, and broke down the house of Baal, and made it a draught-house to this day.";
web[27] = "And they broke down the image of Baal, and broke down the house of Baal, and made it a draught-house to this day.";
hnv[27] = "They broke down the pillar of Ba`al, and broke down the house of Ba`al, and made it a latrine, to this day.";
vul[27] = "et comminuerunt eam destruxerunt quoque aedem Baal et fecerunt pro ea latrinas usque ad diem hanc";
kjv[28] = "Thus Jehu destroyed Baal out of Israel.";
rsv[28] = "Thus Jehu wiped out Ba\'al from Israel.";
asv[28] = "Thus Jehu destroyed Baal out of Israel.";
yng[28] = "And Jehu destroyeth Baal out of Israel,";
dby[28] = "Thus Jehu extirpated Baal out of Israel.";
web[28] = "Thus Jehu destroyed Baal out of Israel.";
hnv[28] = "Thus Yehu destroyed Ba`al out of Yisra\'el.";
vul[28] = "delevit itaque Hieu Baal de Israhel";
kjv[29] = "Howbeit [from] the sins of Jeroboam the son of Nebat, who made Israel to sin, Jehu departed not from after them, [to wit], the golden calves that [were] in Bethel, and that [were] in Dan.";
rsv[29] = "But Jehu did not turn aside from the sins of Jerobo\'am the son of Nebat, which he made Israel to sin, the golden calves that were in Bethel, and in Dan.";
asv[29] = "Howbeit from the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin, Jehu departed not from after them, [to wit], the golden calves that were in Beth-el, and that were in Dan.";
yng[29] = "only -- the sins of Jeroboam son of Nebat, that he caused Israel to sin, Jehu hath not turned aside from after them -- the calves of gold that [are] at Beth-El, and in Dan.";
dby[29] = "Only, the sins of Jeroboam the son of Nebat, who made Israel to sin, from them Jehu departed not: [from] the golden calves that were in Bethel, and that were in Dan.";
web[29] = "Yet [from] the sins of Jeroboam the son of Nebat, who made Israel to sin, Jehu departed not from after them, [to wit], the golden calves that [were] in Beth-el, and that [were] in Dan.";
hnv[29] = " However from the sins of Yarov`am the son of Nevat, with which he made Yisra\'el to sin, Yehu didn\'t depart from after them, [to wit], the golden calves that were in Beit-El, and that were in Dan.";
vul[29] = "verumtamen a peccatis Hieroboam filii Nabath qui peccare fecerat Israhel non recessit nec dereliquit vitulos aureos qui erant in Bethel et in Dan";
kjv[30] = "And the LORD said unto Jehu, Because thou hast done well in executing [that which is] right in mine eyes, [and] hast done unto the house of Ahab according to all that [was] in mine heart, thy children of the fourth [generation] shall sit on the throne of Israel.";
rsv[30] = "And the LORD said to Jehu, &quot;Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons of the fourth generation shall sit on the throne of Israel.&quot;";
asv[30] = "And Jehovah said unto Jehu, Because thou hast done well in executing that which is right in mine eyes, [and] hast done unto the house of Ahab according to all that was in my heart, thy sons of the fourth generation shall sit on the throne of Israel.";
yng[30] = "And Jehovah saith unto Jehu, `Because that thou hast done well, to do that which [is] right in Mine eyes -- according to all that [is] in My heart thou hast done to the house of Ahab -- the sons of the fourth [generation] do sit for thee on the throne of Israel.\'";
dby[30] = "And Jehovah said to Jehu, Because thou hast executed well that which is right in my sight, [and] hast done unto the house of Ahab according to all that was in my heart, thy children of the fourth [generation] shall sit on the throne of Israel.";
web[30] = "And the LORD said to Jehu, Because thou hast done well in executing [that which is] right in my eyes, [and] hast done to the house of Ahab according to all that [was] in my heart, thy children of the fourth [generation] shall sit on the throne of Israel.";
hnv[30] = "The LORD said to Yehu, Because you have done well in executing that which is right in my eyes, [and] have done to the house of Ach\'av according to all that was in my heart, your sons of the fourth generation shall sit on the throne of Yisra\'el.";
vul[30] = "dixit autem Dominus ad Hieu quia studiose fecisti quod rectum erat et placebat in oculis meis et omnia quae erant in corde meo fecisti contra domum Ahab filii tui usque ad quartam generationem sedebunt super thronum Israhel";
kjv[31] = "But Jehu took no heed to walk in the law of the LORD God of Israel with all his heart: for he departed not from the sins of Jeroboam, which made Israel to sin.";
rsv[31] = "But Jehu was not careful to walk in the law of the LORD the God of Israel with all his heart; he did not turn from the sins of Jerobo\'am, which he made Israel to sin.";
asv[31] = "But Jehu took no heed to walk in the law of Jehovah, the God of Israel, with all his heart: he departed not from the sins of Jeroboam, wherewith he made Israel to sin.";
yng[31] = "And Jehu hath not taken heed to walk in the law of Jehovah, God of Israel, with all his heart, he hath not turned aside from the sins of Jeroboam, that he caused Israel to sin.";
dby[31] = "But Jehu took no heed to walk in the law of Jehovah the God of Israel with all his heart; he departed not from the sins of Jeroboam, who made Israel to sin.";
web[31] = "But Jehu took no heed to walk in the law of the LORD God of Israel with all his heart: for he departed not from the sins of Jeroboam, who made Israel to sin.";
hnv[31] = "But Yehu took no heed to walk in the law of the LORD, the God of Yisra\'el, with all his heart: he didn\'t depart from the sins of Yarov`am, with which he made Yisra\'el to sin.";
