csb[1] = "Elisha said to the woman whose son he had restored to life, &quot;Get ready, you and your household, and go live as a resident alien wherever you can. For the LORD has announced a seven-year famine, and it has already come to the land.&quot;";
csb[2] = "So the woman got ready and did what the man of God said. She and her household lived as resident aliens in the land of the Philistines for seven years.";
csb[3] = "When the woman returned from the land of the Philistines at the end of seven years, she went to appeal to the king for her house and field.";
csb[4] = "The king had been speaking to Gehazi, the attendant of the man of God, saying, &quot;Tell me all the great things Elisha has done.&quot;";
csb[5] = "While he was telling the king how Elisha restored the dead son to life, the woman whose son he had restored to life came to appeal to the king for her house and field. So Gehazi said, &quot;My lord the king, this is the woman and this is the son Elisha restored to life.&quot;";
csb[6] = "When the king asked the woman, she told him the story. So the king appointed a court official for her, saying, &quot;Restore all that was hers, along with all the income from the field from the day she left the country until now.&quot;";
csb[7] = "Elisha came to Damascus while King Ben-hadad of Aram was sick, and the king was told, &quot;The man of God has come here.&quot;";
csb[8] = "So the king said to Hazael, &quot;Take a gift with you and go meet the man of God. Inquire of the LORD through him, \'Will I recover from this sickness? \' &quot;";
csb[9] = "Hazael went to meet Elisha, taking with him a gift: forty camel-loads of all the finest products of Damascus. When he came and stood before him, he said, &quot;Your son, King Ben-hadad of Aram, has sent me to ask you, \'Will I recover from this sickness? \' &quot;";
csb[10] = "Elisha told him, &quot;Go say to him, \'You are sure to recover.\' But the LORD has shown me that he is sure to die.&quot;";
csb[11] = "Then he stared steadily at him until he was ashamed. The man of God wept,";
csb[12] = "and Hazael asked, &quot;Why is my lord weeping? &quot; He replied, &quot;Because I know the evil you will do to the people of Israel. You will set their fortresses on fire. You will kill their young men with the sword. You will dash their children to pieces. You will rip open their pregnant women.&quot;";
csb[13] = "Hazael said, &quot;How could your servant, a mere dog, do such a mighty deed? &quot; Elisha answered, &quot;The LORD has shown me that you will be king over Aram.&quot;";
csb[14] = "Hazael left Elisha and went to his master, who asked him, &quot;What did Elisha say to you? &quot; He responded, &quot;He told me you are sure to recover.&quot;";
csb[15] = "The next day Hazael took a heavy cloth, dipped it in water, and spread it over the king\'s face. Ben-hadad died, and Hazael reigned in his place.";
csb[16] = "In the fifth year of Israel\'s King Joram son of Ahab, Jehoram son of Jehoshaphat became king of Judah, replacing his father.";
csb[17] = "He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.";
csb[18] = "He walked in the ways of the kings of Israel, as the house of Ahab had done, for Ahab\'s daughter was his wife. He did what was evil in the LORD\'s sight.";
csb[19] = "For the sake of his servant David, the LORD was unwilling to destroy Judah, since he had promised to give a lamp to David and his sons forever.";
csb[20] = "During Jehoram\'s reign, Edom rebelled against Judah\'s control and appointed their own king.";
csb[21] = "So Jehoram crossed over to Zair with all his chariots. Then at night he set out to attack the Edomites who had surrounded him and the chariot commanders, but his troops fled to their tents.";
csb[22] = "So Edom is still in rebellion against Judah\'s control today. Libnah also rebelled at that time.";
csb[23] = "The rest of the events of Jehoram\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[24] = "Jehoram rested with his fathers and was buried with his fathers in the city of David, and his son Ahaziah became king in his place.";
csb[25] = "In the twelfth year of Israel\'s King Joram son of Ahab, Ahaziah son of Jehoram became king of Judah.";
csb[26] = "Ahaziah was twenty-two years old when he became king, and he reigned one year in Jerusalem. His mother\'s name was Athaliah, granddaughter of Israel\'s King Omri.";
csb[27] = "He walked in the ways of the house of Ahab and did what was evil in the LORD\'s sight like the house of Ahab, for his father had married into the house of Ahab.";
csb[28] = "Ahaziah went with Joram son of Ahab to fight against King Hazael of Aram in Ramoth-gilead, and the Arameans wounded Joram.";
csb[29] = "So King Joram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him in Ramoth-gilead when he fought against Aram\'s King Hazael. Then Judah\'s King Ahaziah son of Jehoram went down to Jezreel to visit Joram son of Ahab since Joram was ill.";
kjv[1] = "Then spake Elisha unto the woman, whose son he had restored to life, saying, Arise, and go thou and thine household, and sojourn wheresoever thou canst sojourn: for the LORD hath called for a famine; and it shall also come upon the land seven years.";
rsv[1] = "Now Eli\'sha had said to the woman whose son he had restored to life, &quot;Arise, and depart with your household, and sojourn wherever you can; for the LORD has called for a famine, and it will come upon the land for seven years.&quot;";
asv[1] = "Now Elisha had spoken unto the woman, whose son he had restored to life, saying, Arise, and go thou and thy household, and sojourn wheresoever thou canst sojourn: for Jehovah hath called for a famine; and it shall also come upon the land seven years.";
yng[1] = "And Elisha spake unto the woman whose son he had revived, saying, `Rise and go, thou and thy household, and sojourn where thou dost sojourn, for Jehovah hath called for a famine, and also, it is coming unto the land seven years.\'";
dby[1] = "And Elisha had spoken to the woman whose son he had restored to life, saying, Rise up and go, thou and thy household, and sojourn wheresoever thou canst sojourn; for Jehovah has called for a famine, and it shall also come upon the land for seven years.";

hnv[1] = "Now Elisha had spoken to the woman, whose son he had restored to life, saying, Arise, and go you and your household, and sojourn wherever you can sojourn: for the LORD has called for a famine; and it shall also come on the land seven years.";
vul[1] = "Heliseus autem locutus est ad mulierem cuius vivere fecerat filium dicens surge vade tu et domus tua et peregrinare ubicumque reppereris vocavit enim Dominus famem et veniet super terram septem annis";

yng[2] = "And the woman riseth, and doth according to the word of the man of God, and goeth, she and her household, and sojourneth in the land of the Philistines seven years.";

kjv[3] = "And it came to pass at the seven years\' end, that the woman returned out of the land of the Philistines: and she went forth to cry unto the king for her house and for her land.";
rsv[3] = "And at the end of the seven years, when the woman returned from the land of the Philistines, she went forth to appeal to the king for her house and her land.";
asv[3] = "And it came to pass at the seven years\' end, that the woman returned out of the land of the Philistines: and she went forth to cry unto the king for her house and for her land.";
yng[3] = "And it cometh to pass, at the end of seven years, that the woman turneth back from the land of the Philistines, and goeth out to cry unto the king, for her house, and for her field.";
dby[3] = "And it came to pass at the seven years\' end, that the woman returned out of the land of the Philistines; and she went forth to cry to the king for her house and for her land.";

vul[3] = "cumque finiti essent anni septem reversa est mulier de terra Philisthim et egressa est ut interpellaret regem pro domo sua et agris suis";

yng[4] = "And the king is speaking unto Gehazi, servant of the man of God, saying, `Recount, I pray thee, to me, the whole of the great things that Elisha hath done.\'";

kjv[5] = "And it came to pass, as he was telling the king how he had restored a dead body to life, that, behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. And Gehazi said, My lord, O king, this [is] the woman, and this [is] her son, whom Elisha restored to life.";
rsv[5] = "And while he was telling the king how Eli\'sha had restored the dead to life, behold, the woman whose son he had restored to life appealed to the king for her house and her land. And Geha\'zi said, &quot;My lord, O king, here is the woman, and here is her son whom Eli\'sha restored to life.&quot;";
asv[5] = "And it came to pass, as he was telling the king how he had restored to life him that was dead, that, behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. And Gehazi said, My lord, O king, this is the woman, and this is her son, whom Elisha restored to life.";
yng[5] = "And it cometh to pass, he is recounting to the king how he had revived the dead, and lo, the woman whose son he had revived is crying unto the king, for her house and for her field, and Gehazi saith, `My lord, O king, this [is] the woman, and this her son, whom Elisha revived.\'";
dby[5] = "And it came to pass as he was telling the king how he had restored a dead body to life, that behold, the woman whose son he had restored to life cried to the king for her house and for her land. And Gehazi said, My lord, O king, this is the woman, and this is her son, whom Elisha restored to life.";
web[5] = "And it came to pass, as he was telling the king how he had restored a dead body to life, that behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. And Gehazi said, My lord, O king, this [is] the woman, and this [is] her son, whom Elisha restored to life.";
hnv[5] = "It happened, as he was telling the king how he had restored to life him who was dead, that behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. Gechazi said, My lord, O king, this is the woman, and this is her son, whom Elisha restored to life.";
vul[5] = "cumque ille narraret regi quomodo mortuum suscitasset apparuit mulier cuius vivificaverat filium clamans ad regem pro domo sua et pro agris suis dixitque Giezi domine mi rex haec est mulier et hic filius eius quem suscitavit Heliseus";

asv[6] = "And when the king asked the woman, she told him. So the king appointed unto her a certain officer, saying, Restore all that was hers, and all the fruits of the field since the day that she left the land, even until now.";
yng[6] = "And the king asketh at the woman, and she recounteth to him, and the king appointeth to her a certain eunuch, saying, `Give back all that she hath, and all the increase of the field from the day of her leaving the land even till now.\'";
dby[6] = "And the king asked the woman, and she told him. And the king appointed a certain chamberlain, saying, Restore all that was hers, and all the revenue of the land since the day that she left the country even until now.";

asv[7] = "And Elisha came to Damascus; and Benhadad the king of Syria was sick; and it was told him, saying, The man of God is come hither.";
yng[7] = "And Elisha cometh in to Damascus, and Ben-Hadad king of Aram is sick, and it is declared to him, saying, `The man of God hath come hither.\'";

kjv[9] = "So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels\' burden, and came and stood before him, and said, Thy son Benhadad king of Syria hath sent me to thee, saying, Shall I recover of this disease?";
rsv[9] = "So Haz\'ael went to meet him, and took a present with him, all kinds of goods of Damascus, forty camel loads. When he came and stood before him, he said, &quot;Your son Ben-ha\'dad king of Syria has sent me to you, saying, \'Shall I recover from this sickness?\'&quot;";
asv[9] = "So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels\' burden, and came and stood before him, and said, Thy son Benhadad king of Syria hath sent me to thee, saying, Shall I recover of this sickness?";
yng[9] = "And Hazael goeth to meet him, and taketh a present in his hand, even of every good thing of Damascus, a burden of forty camels, and he cometh in and standeth before him, and saith, `Thy son Ben-Hadad, king of Aram, hath sent me unto thee, saying, Do I revive from this sickness?\'";
dby[9] = "And Hazael went to meet him, and took with him a present, even of every good thing of Damascus, forty camels\' burden; and he came and stood before him, and said, Thy son Ben-Hadad king of Syria has sent me to thee, saying, Shall I recover from this disease?";
web[9] = "So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels burden, and came and stood before him, and said, Thy son Ben-hadad king of Syria hath sent me to thee, saying, Shall I recover of this disease?";
hnv[9] = "So Haza\'el went to meet him, and took a present with him, even of every good thing of Dammesek, forty camels\' burden, and came and stood before him, and said, Your son Ben-Hadad king of Aram has sent me to you, saying, Shall I recover of this sickness?";
vul[9] = "ivit igitur Azahel in occursum eius habens secum munera et omnia bona Damasci onera quadraginta camelorum cumque stetisset coram eo ait filius tuus Benadad rex Syriae misit me ad te dicens si sanari potero de infirmitate mea hac";

kjv[12] = "And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel: their strong holds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash their children, and rip up their women with child.";
rsv[12] = "And Haz\'ael said, &quot;Why does my lord weep?&quot; He answered, &quot;Because I know the evil that you will do to the people of Israel; you will set on fire their fortresses, and you will slay their young men with the sword, and dash in pieces their little ones, and rip up their women with child.&quot;";
asv[12] = "And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel: their strongholds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash in pieces their little ones, and rip up their women with child.";
yng[12] = "And Hazael saith, `Wherefore is my lord weeping?\' and he saith, `Because I have known the evil that thou dost to the sons of Israel -- their fenced places thou dost send into fire, and their young men with sword thou dost slay, and their sucklings thou dost dash to pieces, and their pregnant women thou dost rip up.\'";
dby[12] = "And Hazael said, Why does my lord weep? And he said, Because I know the evil that thou wilt do to the children of Israel: their strongholds wilt thou set on fire, and their young men wilt thou kill with the sword, and wilt dash in pieces their children, and rip up their women with child.";
web[12] = "And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do to the children of Israel: their strong holds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash their children, and rip up their women with child.";
hnv[12] = "Haza\'el said, Why weeps my lord? He answered, Because I know the evil that you will do to the children of Yisra\'el: their strongholds will you set on fire, and their young men will you kill with the sword, and will dash in pieces their little ones, and rip up their women with child.";
vul[12] = "cui Azahel ait quare dominus meus flet at ille respondit quia scio quae facturus sis filiis Israhel mala civitates eorum munitas igne succendes et iuvenes eorum interficies gladio et parvulos eorum elides et praegnantes divides";

web[14] = "So he departed from Elisha, and came to his master; who said to him, What said Elisha to thee? And he answered, He told me [that] thou shouldest surely recover.";
hnv[14] = "Then he departed from Elisha, and came to his master; who said to him, What said Elisha to you? He answered, He told me that you would surely recover.";
vul[14] = "qui cum recessisset ab Heliseo venit ad dominum suum qui ait ei quid tibi dixit Heliseus at ille respondit dixit mihi recipiet sanitatem";
kjv[15] = "And it came to pass on the morrow, that he took a thick cloth, and dipped [it] in water, and spread [it] on his face, so that he died: and Hazael reigned in his stead.";
rsv[15] = "But on the morrow he took the coverlet and dipped it in water and spread it over his face, till he died. And Haz\'ael became king in his stead.";
asv[15] = "And it came to pass on the morrow, that he took the coverlet, and dipped it in water, and spread it on his face, so that he died: and Hazael reigned in his stead.";
yng[15] = "And it cometh to pass on the morrow, that he taketh the coarse cloth, and dippeth in water, and spreadeth on his face, and he dieth, and Hazael reigneth in his stead.";
dby[15] = "And it came to pass the next day, that he took the coverlet and dipped [it] in water, and spread it over his face, so that he died; and Hazael reigned in his stead.";
web[15] = "And it came to pass on the morrow, that he took a thick cloth, and dipped [it] in water, and spread [it] on his face, so that he died: and Hazael reigned in his stead.";
hnv[15] = "It happened on the next day, that he took the coverlet, and dipped it in water, and spread it on his face, so that he died: and Haza\'el reigned in his place.";
vul[15] = "cumque venisset dies altera tulit sagulum et infudit aqua et expandit super faciem eius quo mortuo regnavit Azahel pro eo";
kjv[16] = "And in the fifth year of Joram the son of Ahab king of Israel, Jehoshaphat [being] then king of Judah, Jehoram the son of Jehoshaphat king of Judah began to reign.";
rsv[16] = "In the fifth year of Joram the son of Ahab, king of Israel, Jeho\'ram the son of Jehosh\'aphat, king of Judah, began to reign.";
asv[16] = "And in the fifth year of Joram the son of Ahab king of Israel, Jehoshaphat being then king of Judah, Jehoram the son of Jehoshaphat king of Judah began to reign.";
yng[16] = "And in the fifth year of Joram son of Ahab king of Israel -- and Jehoshaphat [is] king of Judah -- hath Jehoram son of Jehoshaphat king of Judah reigned;";
dby[16] = "And in the fifth year of Joram the son of Ahab, king of Israel, Jehoshaphat being then king of Judah, Jehoram the son of Jehoshaphat, king of Judah, began to reign.";
web[16] = "And in the fifth year of Joram the son of Ahab king of Israel, Jehoshaphat [being] then king of Judah, Jehoram the son of Jehoshaphat king of Judah began to reign.";
hnv[16] = "In the fifth year of Yoram the son of Ach\'av king of Yisra\'el, Yehoshafat being then king of Yehudah, Yehoram the son of Yehoshafat king of Yehudah began to reign.";
vul[16] = "anno quinto Ioram filii Ahab regis Israhel et Iosaphat regis Iuda regnavit Ioram filius Iosaphat rex Iuda";
kjv[17] = "Thirty and two years old was he when he began to reign; and he reigned eight years in Jerusalem.";
rsv[17] = "He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.";
asv[17] = "Thirty and two years old was he when he began to reign; and he reigned eight years in Jerusalem.";
yng[17] = "a son of thirty and two years was he in his reigning, and eight years he hath reigned in Jerusalem.";
dby[17] = "He was thirty-two years old when he began to reign; and he reigned eight years in Jerusalem.";
web[17] = "Thirty and two years old was he when he began to reign; and he reigned eight years in Jerusalem.";
hnv[17] = "Thirty-two years old was he when he began to reign; and he reigned eight years in Yerushalayim.";
vul[17] = "triginta duorum erat annorum cum regnare coepisset et octo annis regnavit in Hierusalem";
kjv[18] = "And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD.";
rsv[18] = "And he walked in the way of the kings of Israel, as the house of Ahab had done, for the daughter of Ahab was his wife. And he did what was evil in the sight of the LORD.";
asv[18] = "And he walked in the way of the kings of Israel, as did the house of Ahab: for he had the daughter of Ahab to wife; and he did that which was evil in the sight of Jehovah.";
yng[18] = "And he walketh in the way of the kings of Israel, as did the house of Ahab, for a daughter of Ahab was to him for a wife, and he doth the evil thing in the eyes of Jehovah,";
dby[18] = "And he walked in the way of the kings of Israel, as did the house of Ahab, for the daughter of Ahab was his wife; and he did evil in the sight of Jehovah.";
web[18] = "And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD.";
hnv[18] = "He walked in the way of the kings of Yisra\'el, as did the house of Ach\'av: for he had the daughter of Ach\'av as wife; and he did that which was evil in the sight of the LORD.";
vul[18] = "ambulavitque in viis regum Israhel sicut ambulaverat domus Ahab filia enim Ahab erat uxor eius et fecit quod malum est coram Domino";
kjv[19] = "Yet the LORD would not destroy Judah for David his servant\'s sake, as he promised him to give him alway a light, [and] to his children.";
rsv[19] = "Yet the LORD would not destroy Judah, for the sake of David his servant, since he promised to give a lamp to him and to his sons for ever.";
asv[19] = "Howbeit Jehovah would not destroy Judah, for David his servant\'s sake, as he promised him to give unto him a lamp for his children alway.";
yng[19] = "and Jehovah was not willing to destroy Judah, for the sake of David his servant, as He said to him, to give to him a lamp -- to his sons all the days.";
dby[19] = "But Jehovah would not destroy Judah, for David his servant\'s sake, as he had promised him to give him always a lamp for his sons.";
web[19] = "Yet the LORD would not destroy Judah, for David his servant\'s sake, as he promised him to give him always a light, [and] to his children.";
hnv[19] = "However the LORD would not destroy Yehudah, for David his servant\'s sake, as he promised him to give to him a lamp for his children always.";
vul[19] = "noluit autem Dominus disperdere Iudam propter David servum suum sicut promiserat ei ut daret illi lucernam et filiis eius cunctis diebus";
kjv[20] = "In his days Edom revolted from under the hand of Judah, and made a king over themselves.";
rsv[20] = "In his days Edom revolted from the rule of Judah, and set up a king of their own.";
asv[20] = "In his days Edom revolted from under the hand of Judah, and made a king over themselves.";
yng[20] = "In his days hath Edom revolted from under the hand of Judah, and they cause a king to reign over them,";
dby[20] = "In his days Edom revolted from under the hand of Judah, and they set a king over themselves.";
web[20] = "In his days Edom revolted from under the hand of Judah, and made a king over themselves.";
hnv[20] = "In his days Edom revolted from under the hand of Yehudah, and made a king over themselves.";
vul[20] = "in diebus eius recessit Edom ne esset sub Iuda et constituit sibi regem";
kjv[21] = "So Joram went over to Zair, and all the chariots with him: and he rose by night, and smote the Edomites which compassed him about, and the captains of the chariots: and the people fled into their tents.";
rsv[21] = "Then Joram passed over to Za\'ir with all his chariots, and rose by night, and he and his chariot commanders smote the E\'domites who had surrounded him; but his army fled home.";
asv[21] = "Then Joram passed over to Zair, and all his chariots with him: and he rose up by night, and smote the Edomites that compassed him about, and the captains of the chariots; and the people fled to their tents.";
yng[21] = "and Joram passeth over to Zair, and all the chariots with him, and he himself hath risen by night, and smiteth Edom, that is coming round about unto him, and the heads of the chariots, and the people fleeth to its tents;";
dby[21] = "And Joram went over to Zair, and all the chariots with him; and he rose up by night, and smote the Edomites who had surrounded him, and the captains of the chariots; and the people fled into their tents.";
web[21] = "So Joram went over to Zair, and all the chariots with him: and he rose by night, and smote the Edomites who encompassed him, and the captains of the chariots: and the people fled into their tents.";
hnv[21] = "Then Yoram passed over to Tza`ir, and all his chariots with him: and he rose up by night, and struck the Edom who surrounded him, and the captains of the chariots; and the people fled to their tents.";
vul[21] = "venitque Ioram Seira et omnis currus cum eo et surrexit nocte percussitque Idumeos qui eum circumdederant et principes curruum populus autem fugit in tabernacula sua";
kjv[22] = "Yet Edom revolted from under the hand of Judah unto this day. Then Libnah revolted at the same time.";
rsv[22] = "So Edom revolted from the rule of Judah to this day. Then Libnah revolted at the same time.";
asv[22] = "So Edom revolted from under the hand of Judah unto this day. Then did Libnah revolt at the same time.";
yng[22] = "and Edom revolteth from under the hand of Judah till this day; then doth Libnah revolt at that time.";
dby[22] = "But the Edomites revolted from under the hand of Judah unto this day. Then Libnah revolted at the same time.";
web[22] = "Yet Edom revolted from under the hand of Judah to this day. Then Libnah revolted at the same time.";
hnv[22] = "So Edom revolted from under the hand of Yehudah to this day. Then did Livna revolt at the same time.";
vul[22] = "recessit ergo Edom ne esset sub Iuda usque ad diem hanc tunc recessit et Lobna in tempore illo";
kjv[23] = "And the rest of the acts of Joram, and all that he did, [are] they not written in the book of the chronicles of the kings of Judah?";
rsv[23] = "Now the rest of the acts of Joram, and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?";
asv[23] = "And the rest of the acts of Joram, and all that he did, are they not written in the book of the chronicles of the kings of Judah?";
yng[23] = "And the rest of the matters of Joram, and all that he did, are they not written on the book of the Chronicles of the kings of Judah?";
dby[23] = "And the rest of the acts of Joram and all that he did, are they not written in the book of the chronicles of the kings of Judah?";
web[23] = "And the rest of the acts of Joram, and all that he did, [are] they not written in the book of the chronicles of the kings of Judah?";
hnv[23] = "The rest of the acts of Yoram, and all that he did, aren\'t they written in the book of the chronicles of the kings of Yehudah?";
vul[23] = "reliqua autem sermonum Ioram et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda";
kjv[24] = "And Joram slept with his fathers, and was buried with his fathers in the city of David: and Ahaziah his son reigned in his stead.";
rsv[24] = "So Joram slept with his fathers, and was buried with his fathers in the city of David; and Ahazi\'ah his son reigned in his stead.";
asv[24] = "And Joram slept with his fathers, and was buried with his fathers in the city of David; and Ahaziah his son reigned in his stead.";
yng[24] = "And Joram lieth with his fathers, and is buried with his fathers in the city of David, and reign doth Ahaziah his son in his stead.";
dby[24] = "And Joram slept with his fathers, and was buried with his fathers in the city of David; and Ahaziah his son reigned in his stead.";
web[24] = "And Joram slept with his fathers, and was buried with his fathers, in the city of David; and Ahaziah his son reigned in his stead.";
hnv[24] = "Yoram slept with his fathers, and was buried with his fathers in the city of David; and Achazyah his son reigned in his place.";
vul[24] = "et dormivit Ioram cum patribus suis sepultusque est cum eis in civitate David et regnavit Ahazias filius eius pro eo";
kjv[25] = "In the twelfth year of Joram the son of Ahab king of Israel did Ahaziah the son of Jehoram king of Judah begin to reign.";
rsv[25] = "In the twelfth year of Joram the son of Ahab, king of Israel, Ahazi\'ah the son of Jeho\'ram, king of Judah, began to reign.";
asv[25] = "In the twelfth year of Joram the son of Ahab king of Israel did Ahaziah the son of Jehoram king of Judah begin to reign.";
yng[25] = "In the twelfth year of Joram son of Ahab king of Israel reigned hath Ahaziah son of Jehoram king of Judah;";
dby[25] = "In the twelfth year of Joram the son of Ahab, king of Israel, Ahaziah the son of Jehoram, king of Judah, began to reign.";
web[25] = "In the twelfth year of Joram the son of Ahab king of Israel did Ahaziah the son of Jehoram king of Judah begin to reign.";
hnv[25] = "In the twelfth year of Yoram the son of Ach\'av king of Yisra\'el did Achazyah the son of Yehoram king of Yehudah begin to reign.";
vul[25] = "anno duodecimo Ioram filii Ahab regis Israhel regnavit Ahazias filius Ioram regis Iudae";
kjv[26] = "Two and twenty years old [was] Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother\'s name [was] Athaliah, the daughter of Omri king of Israel.";
rsv[26] = "Ahazi\'ah was twenty-two years old when he began to reign, and he reigned one year in Jerusalem. His mother\'s name was Athali\'ah; she was a granddaughter of Omri king of Israel.";
asv[26] = "Two and twenty years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother\'s name was Athaliah the daughter of Omri king of Israel.";
yng[26] = "a son of twenty and two years [is] Ahaziah in his reigning, and one year he hath reigned in Jerusalem, and the name of his mother [is] Athaliah daughter of Omri king of Israel,";
dby[26] = "Ahaziah was twenty-two years old when he began to reign; and he reigned one year in Jerusalem; and his mother\'s name was Athaliah, the daughter of Omri king of Israel.";
web[26] = "Two and twenty years old [was] Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother\'s name [was] Athaliah, the daughter of Omri king of Israel.";
hnv[26] = "Twenty-two years old was Achazyah when he began to reign; and he reigned one year in Yerushalayim. His mother\'s name was `Atalyah the daughter of `Omri king of Yisra\'el.";
vul[26] = "viginti duorum annorum erat Ahazias cum regnare coepisset et uno anno regnavit in Hierusalem nomen matris eius Athalia filia Amri regis Israhel";
kjv[27] = "And he walked in the way of the house of Ahab, and did evil in the sight of the LORD, as [did] the house of Ahab: for he [was] the son in law of the house of Ahab.";
rsv[27] = "He also walked in the way of the house of Ahab, and did what was evil in the sight of the LORD, as the house of Ahab had done, for he was son-in-law to the house of Ahab.";
asv[27] = "And he walked in the way of the house of Ahab, and did that which was evil in the sight of Jehovah, as did the house of Ahab; for he was the son-in-law of the house of Ahab.";
yng[27] = "and he walketh in the way of the house of Ahab, and doth the evil thing in the eyes of Jehovah, like the house of Ahab, for he [is] son-in-law of the house of Ahab.";
dby[27] = "And he walked in the way of the house of Ahab, and did evil in the sight of Jehovah, like the house of Ahab; for he was the son-in-law of the house of Ahab.";
web[27] = "And he walked in the way of the house of Ahab, and did evil in the sight of the LORD, as [did] the house of Ahab: for he [was] the son-in-law of the house of Ahab.";
hnv[27] = "He walked in the way of the house of Ach\'av, and did that which was evil in the sight of the LORD, as did the house of Ach\'av; for he was the son-in-law of the house of Ach\'av.";
vul[27] = "et ambulavit in viis domus Ahab et fecit quod malum est coram Domino sicut domus Ahab gener enim domus Ahab fuit";
kjv[28] = "And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramothgilead; and the Syrians wounded Joram.";
rsv[28] = "He went with Joram the son of Ahab to make war against Haz\'ael king of Syria at Ramoth-gilead, where the Syrians wounded Joram.";
asv[28] = "And he went with Joram the son of Ahab to war against Hazael king of Syria at Ramoth-gilead: and the Syrians wounded Joram.";
yng[28] = "And he goeth with Joram son of Ahab to battle with Hazael king of Aram in Ramoth-Gilead, and the Aramaeans smite Joram,";
dby[28] = "And he went with Joram the son of Ahab to the war against Hazael the king of Syria at Ramoth-Gilead; and the Syrians wounded Joram.";
web[28] = "And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramoth-gilead; and the Syrians wounded Joram.";
hnv[28] = "He went with Yoram the son of Ach\'av to war against Haza\'el king of Aram at Ramot-Gil`ad: and the Aram wounded Yoram.";
vul[28] = "abiit quoque cum Ioram filio Ahab ad proeliandum contra Azahel regem Syriae in Ramoth Galaad et vulneraverunt Syri Ioram";
kjv[29] = "And king Joram went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick.";
rsv[29] = "And King Joram returned to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Haz\'ael king of Syria. And Ahazi\'ah the son of Jeho\'ram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick.";
asv[29] = "And king Joram returned to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick.";
yng[29] = "and Joram the king turneth back to be healed in Jezreel of the wounds with which the Arameans smite him in Ramah, in his fighting with Hazael king of Aram, and Ahaziah son of Jehoram king of Judah hath gone down to see Joram son of Ahab in Jezreel, for he is sick.";
dby[29] = "And king Joram returned to be healed in Jizreel of the wounds that the Syrians had given him at Ramah, when he fought with Hazael king of Syria. And Ahaziah the son of Jehoram, king of Judah, went down to see Joram the son of Ahab at Jizreel, for he was sick.";
web[29] = "And king Joram went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick.";
hnv[29] = "King Yoram returned to be healed in Yizre`el of the wounds which the Aram had given him at Ramah, when he fought against Haza\'el king of Aram. Achazyah the son of Yehoram king of Yehudah went down to see Yoram the son of Ach\'av in Yizre`el, because he was sick.";
vul[29] = "qui reversus est ut curaretur in Hiezrahel quia vulneraverant eum Syri in Rama proeliantem contra Azahel regem Syriae porro Ahazias filius Ioram rex Iuda descendit invisere Ioram filium Ahab in Hiezrahel quia aegrotabat";
