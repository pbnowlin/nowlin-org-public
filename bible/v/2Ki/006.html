csb[1] = "The sons of the prophets said to Elisha, &quot;Please notice that the place where we live under your supervision is too small for us.";
csb[2] = "&quot;Please let us go to the Jordan where we can each get a log and can build ourselves a place to live there.&quot; &quot;Go,&quot; he said.";
csb[3] = "Then one said, &quot;Please come with your servants.&quot; &quot;I\'ll come,&quot; he answered.";
csb[4] = "So he went with them, and when they came to the Jordan, they cut down trees.";
csb[5] = "As one of them was cutting down a tree, the iron ax head fell into the water, and he cried out, &quot;Oh, my master, it was borrowed! &quot;";
csb[6] = "Then the man of God asked, &quot;Where did it fall? &quot; When he showed him the place, the man of God cut a piece of wood, threw it there, and made the iron float.";
csb[7] = "Then he said, &quot;Pick it up.&quot; So he reached out and took it.";
csb[8] = "When the king of Aram was waging war against Israel, he conferred with his servants, &quot;My camp will be at such and such a place.&quot;";
csb[9] = "But the man of God sent word to the king of Israel: &quot;Be careful passing by this place, for the Arameans are going down there.&quot;";
csb[10] = "Consequently, the king of Israel sent word to the place the man of God had told him about. The man of God repeatedly warned the king, so the king would be on his guard.";
csb[11] = "The king of Aram was enraged because of this matter, and he called his servants and demanded of them, &quot;Tell me, which one of us is for the king of Israel? &quot;";
csb[12] = "One of his servants said, &quot;No one, my lord the king. Elisha, the prophet in Israel, tells the king of Israel even the words you speak in your bedroom.&quot;";
csb[13] = "So the king said, &quot;Go and see where he is, so I can send men to capture him.&quot; When he was told, &quot;Elisha is in Dothan,&quot;";
csb[14] = "he sent horses, chariots, and a massive army there. They went by night and surrounded the city.";
csb[15] = "When the servant of the man of God got up early and went out, he discovered an army with horses and chariots surrounding the city. So he asked Elisha, &quot;Oh, my master, what are we to do? &quot;";
csb[16] = "Elisha said, &quot;Don\'t be afraid, for those who are with us outnumber those who are with them.&quot;";
csb[17] = "Then Elisha prayed, &quot;LORD, please open his eyes and let him see.&quot; So the LORD opened the servant\'s eyes, and he saw that the mountain was covered with horses and chariots of fire all around Elisha.";
csb[18] = "When the Arameans came against him, Elisha prayed to the LORD, &quot;Please strike this nation with blindness.&quot; So he struck them with blindness, according to Elisha\'s word.";
csb[19] = "Then Elisha said to them, &quot;This is not the way, and this is not the city. Follow me, and I will take you to the man you\'re looking for.&quot; And he led them to Samaria.";
csb[20] = "When they entered Samaria, Elisha said, &quot;LORD, open these men\'s eyes and let them see.&quot; So the LORD opened their eyes, and they saw that they were in the middle of Samaria.";
csb[21] = "When the king of Israel saw them, he said to Elisha, &quot;Should I kill them, should I kill them, my father? &quot;";
csb[22] = "Elisha replied, &quot;Don\'t kill them. Do you kill those you have captured with your sword or your bow? Set food and water in front of them so they can eat and drink and go to their master.&quot;";
csb[23] = "So he prepared a big feast for them. When they had eaten and drunk, he sent them away, and they went to their master. The Aramean raiders did not come into Israel\'s land again.";
csb[24] = "Some time later, King Ben-hadad of Aram brought all his military units together and marched up and laid siege to Samaria.";
csb[25] = "So there was a severe famine in Samaria, and they continued the siege against it until a donkey\'s head sold for thirty-four ounces of silver, and a cup of dove\'s dung sold for two ounces of silver.";
csb[26] = "As the king of Israel was passing by on the wall, a woman cried out to him, &quot;My lord the king, help! &quot;";
csb[27] = "He answered, &quot;If the LORD doesn\'t help you, where can I get help for you? From the threshing floor or the winepress? &quot;";
csb[28] = "Then the king asked her, &quot;What\'s the matter? &quot; She said, &quot;This woman said to me, \'Give up your son, and we will eat him today. Then we will eat my son tomorrow.\'";
csb[29] = "&quot;So we boiled my son and ate him, and I said to her the next day, \'Give up your son, and we will eat him,\' but she has hidden her son.&quot;";
csb[30] = "When the king heard the woman\'s words, he tore his clothes. Then, as he was passing by on the wall, the people saw that there was sackcloth under his clothes next to his skin.";
csb[31] = "He announced, &quot;May God punish me and do so severely if the head of Elisha son of Shaphat remains on his shoulders today.&quot;";
csb[32] = "Elisha was sitting in his house, and the elders were sitting with him. The king sent a man ahead of him, but before the messenger got to him, Elisha said to the elders, &quot;Do you see how this murderer has sent someone to remove my head? Look, when the messenger comes, shut the door to keep him out. Isn\'t the sound of his master\'s feet behind him? &quot;";
csb[33] = "While Elisha was still speaking with them, the messenger came down to him. Then he said, &quot;This disaster is from the LORD. Why should I wait for the LORD any longer? &quot;";

vul[17] = "cumque orasset Heliseus ait Domine aperi oculos huius ut videat et aperuit Dominus oculos pueri et vidit et ecce mons plenus equorum et curruum igneorum in circuitu Helisei";
kjv[18] = "And when they came down to him, Elisha prayed unto the LORD, and said, Smite this people, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha.";
rsv[18] = "And when the Syrians came down against him, Eli\'sha prayed to the LORD, and said, &quot;Strike this people, I pray thee, with blindness.&quot; So he struck them with blindness in accordance with the prayer of Eli\'sha.";
asv[18] = "And when they came down to him, Elisha prayed unto Jehovah, and said, Smite this people, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha.";
yng[18] = "And they come down unto it, and Elisha prayeth unto Jehovah, and saith, `Smite, I pray Thee, this nation with blindness;\' and He smiteth them with blindness, according to the word of Elisha.";
dby[18] = "And they came down to him; and Elisha prayed to Jehovah and said, Smite this nation, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha.";
web[18] = "And when they came down to him, Elisha prayed to the LORD, and said, Smite this people, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha.";
hnv[18] = "When they came down to him, Elisha prayed to the LORD, and said, Please smite this people with blindness. He struck them with blindness according to the word of Elisha.";
vul[18] = "hostes vero descenderunt ad eum porro Heliseus oravit Dominum dicens percute obsecro gentem hanc caecitate percussitque eos Dominus ne viderent iuxta verbum Helisei";
kjv[19] = "And Elisha said unto them, This [is] not the way, neither [is] this the city: follow me, and I will bring you to the man whom ye seek. But he led them to Samaria.";
rsv[19] = "And Eli\'sha said to them, &quot;This is not the way, and this is not the city; follow me, and I will bring you to the man whom you seek.&quot; And he led them to Sama\'ria.";
asv[19] = "And Elisha said unto them, This is not the way, neither is this the city: follow me, and I will bring you to the man whom ye seek. And he led them to Samaria.";
yng[19] = "And Elisha saith unto them, `This [is] not the way, nor [is] this the city; come after me, and I lead you unto the man whom ye seek;\' and he leadeth them to Samaria.";
dby[19] = "And Elisha said to them, This is not the way, neither is this the city: follow me, and I will bring you to the man whom ye seek. And he led them to Samaria.";
web[19] = "And Elisha said to them, This [is] not the way, neither [is] this the city: follow me, and I will bring you to the man whom ye seek. But he led them to Samaria.";
hnv[19] = "Elisha said to them, This is not the way, neither is this the city: follow me, and I will bring you to the man whom you seek. He led them to Shomron.";
vul[19] = "dixit autem ad eos Heliseus non est haec via nec ista est civitas sequimini me et ostendam vobis virum quem quaeritis duxit ergo eos in Samariam";
kjv[20] = "And it came to pass, when they were come into Samaria, that Elisha said, LORD, open the eyes of these [men], that they may see. And the LORD opened their eyes, and they saw; and, behold, [they were] in the midst of Samaria.";
rsv[20] = "As soon as they entered Sama\'ria, Eli\'sha said, &quot;O LORD, open the eyes of these men, that they may see.&quot; So the LORD opened their eyes, and they saw; and lo, they were in the midst of Sama\'ria.";
asv[20] = "And it came to pass, when they were come into Samaria, that Elisha said, Jehovah, open the eyes of these men, that they may see. And Jehovah opened their eyes, and they saw; and, behold, they were in the midst of Samaria.";
yng[20] = "And it cometh to pass, at their coming in to Samaria, that Elisha saith, `Jehovah, open the eyes of these, and they see;\' and Jehovah openeth their eyes, and they see, and lo, in the midst of Samaria!";
dby[20] = "And it came to pass when they entered into Samaria, that Elisha said, Jehovah, open the eyes of these [men] that they may see. And Jehovah opened their eyes, and they saw, and behold, they were in the midst of Samaria.";
web[20] = "And it came to pass, when they had come into Samaria, that Elisha said, LORD, open the eyes of these [men], that they may see. And the LORD opened their eyes, and they saw; and behold, [they were] in the midst of Samaria.";
hnv[20] = "It happened, when they were come into Shomron, that Elisha said, LORD, open the eyes of these men, that they may see. The LORD opened their eyes, and they saw; and, behold, they were in the midst of Shomron.";
vul[20] = "cumque ingressi fuissent in Samaria dixit Heliseus Domine aperi oculos istorum ut videant aperuitque Dominus oculos eorum et viderunt esse se in medio Samariae";
kjv[21] = "And the king of Israel said unto Elisha, when he saw them, My father, shall I smite [them]? shall I smite [them]?";
rsv[21] = "When the king of Israel saw them he said to Eli\'sha, &quot;My father, shall I slay them? Shall I slay them?&quot;";
asv[21] = "And the king of Israel said unto Elisha, when he saw them, My father, shall I smite them? shall I smite them?";
yng[21] = "And the king of Israel saith unto Elisha, at his seeing them, `Do I smite -- do I smite -- my father?\'";
dby[21] = "And the king of Israel said to Elisha, when he saw them, My father, shall I smite? shall I smite [them]?";
web[21] = "And the king of Israel said to Elisha, when he saw them, My father, shall I smite [them]? shall I smite [them]?";
hnv[21] = "The king of Yisra\'el said to Elisha, when he saw them, My father, shall I strike them? shall I strike them?";
vul[21] = "dixitque rex Israhel ad Heliseum cum vidisset eos numquid percutiam eos pater mi";
kjv[22] = "And he answered, Thou shalt not smite [them]: wouldest thou smite those whom thou hast taken captive with thy sword and with thy bow? set bread and water before them, that they may eat and drink, and go to their master.";
rsv[22] = "He answered, &quot;You shall not slay them. Would you slay those whom you have taken captive with your sword and with your bow? Set bread and water before them, that they may eat and drink and go to their master.&quot;";
asv[22] = "And he answered, Thou shalt not smite them: wouldest thou smite those whom thou hast taken captive with thy sword and with thy bow? set bread and water before them, that they may eat and drink, and go to their master.";
yng[22] = "And he saith, `Thou dost not smite; those whom thou hast taken captive with thy sword and with thy bow art thou smiting? set bread and water before them, and they eat, and drink, and go unto their lord.\'";
dby[22] = "And he said, Thou shalt not smite [them]: wouldest thou smite those whom thou hast taken captive with thy sword and with thy bow? Set bread and water before them, that they may eat and drink, and go to their master.";
web[22] = "And he answered, Thou shalt not smite [them]: wouldst thou smite those whom thou hast taken captive with thy sword and with thy bow? set bread and water before them, that they may eat and drink, and go to their master.";
hnv[22] = "He answered, You shall not strike them: would you strike those whom you have taken captive with your sword and with your bow? set bread and water before them, that they may eat and drink, and go to their master.";
vul[22] = "at ille ait non percuties neque enim cepisti eos gladio et arcu tuo ut percutias pone panem et aquam coram eis ut comedant et bibant et vadant ad dominum suum";
kjv[23] = "And he prepared great provision for them: and when they had eaten and drunk, he sent them away, and they went to their master. So the bands of Syria came no more into the land of Israel.";
rsv[23] = "So he prepared for them a great feast; and when they had eaten and drunk, he sent them away, and they went to their master. And the Syrians came no more on raids into the land of Israel.";
asv[23] = "And he prepared great provision for them; and when they had eaten and drunk, he sent them away, and they went to their master. And the bands of Syria came no more into the land of Israel.";
yng[23] = "And he prepareth for them great provision, and they eat and drink, and he sendeth them away, and they go unto their lord: and troops of Aram have not added any more to come in to the land of Israel.";
dby[23] = "And he prepared a great repast for them, and they ate and drank; and he sent them away, and they went to their master. And the bands of Syria came no more into the land of Israel.";
web[23] = "And he prepared great provision for them: and when they had eaten and drank, he sent them away, and they went to their master. So the bands of Syria came no more into the land of Israel.";
hnv[23] = "He prepared great provision for them; and when they had eaten and drunk, he sent them away, and they went to their master. The bands of Aram came no more into Eretz-Yisra\'el.";
vul[23] = "adpositaque est eis ciborum magna praeparatio et comederunt et biberunt et dimisit eos abieruntque ad dominum suum et ultra non venerunt latrones Syriae in terram Israhel";
kjv[24] = "And it came to pass after this, that Benhadad king of Syria gathered all his host, and went up, and besieged Samaria.";
rsv[24] = "Afterward Ben-ha\'dad king of Syria mustered his entire army, and went up, and besieged Sama\'ria.";
asv[24] = "And it came to pass after this, that Benhadad king of Syria gathered all his host, and went up, and besieged Samaria.";
yng[24] = "And it cometh to pass afterwards, that Ben-Hadad king of Aram gathereth all his camp, and goeth up, and layeth siege to Samaria,";
dby[24] = "And it came to pass after this that Ben-Hadad king of Syria gathered all his army, and went up and besieged Samaria.";
web[24] = "And it came to pass after this, that Ben-hadad king of Syria gathered all his army, and went up, and besieged Samaria.";
hnv[24] = "It happened after this, that Ben-Hadad king of Aram gathered all his host, and went up, and besieged Shomron.";
vul[24] = "factum est autem post haec congregavit Benadad rex Syriae universum exercitum suum et ascendit et obsidebat Samariam";
kjv[25] = "And there was a great famine in Samaria: and, behold, they besieged it, until an ass\'s head was [sold] for fourscore [pieces] of silver, and the fourth part of a cab of dove\'s dung for five [pieces] of silver.";
rsv[25] = "And there was a great famine in Sama\'ria, as they besieged it, until an ass\'s head was sold for eighty shekels of silver, and the fourth part of a kab of dove\'s dung for five shekels of silver.";
asv[25] = "And there was a great famine in Samaria: and, behold, they besieged it, until an ass\'s head was sold for fourscore [pieces] of silver, and the fourth part of a kab of dove\'s dung for five [pieces] of silver.";
yng[25] = "and there is a great famine in Samaria, and lo, they are laying siege to it, till the head of an ass is at eighty silverlings, and a forth of the cab of dovesdung at five silverlings.";
dby[25] = "And there was a great famine in Samaria; and behold, they besieged it, until an ass\'s head was worth eighty silver-pieces, and the fourth part of a cab of dove\'s dung five silver-pieces.";
web[25] = "And there was a great famine in Samaria: and behold, they besieged it, until an ass\'s head was [sold] for eighty [pieces] of silver, and the fourth part of a cab of dove\'s dung for five [pieces] of silver.";
hnv[25] = "There was a great famine in Shomron: and, behold, they besieged it, until a donkey\'s head was sold for eighty [pieces] of silver, and the fourth part of a kab of dove\'s dung for five [pieces] of silver.";
vul[25] = "factaque est fames magna in Samaria et tamdiu obsessa est donec venundaretur caput asini octoginta argenteis et quarta pars cabi stercoris columbarum quinque argenteis";
kjv[26] = "And as the king of Israel was passing by upon the wall, there cried a woman unto him, saying, Help, my lord, O king.";
rsv[26] = "Now as the king of Israel was passing by upon the wall, a woman cried out to him, saying, &quot;Help, my lord, O king!&quot;";
asv[26] = "And as the king of Israel was passing by upon the wall, there cried a woman unto him, saying, Help, my lord, O king.";
yng[26] = "And it cometh to pass, the king of Israel is passing by on the wall, and a woman hath cried unto him, saying, `Save, my lord, O king.\'";
dby[26] = "And it came to pass as the king of Israel was passing by upon the wall, there cried a woman to him saying, Help, my lord O king!";
web[26] = "And as the king of Israel was passing by upon the wall, there cried a woman to him, saying, Help, my lord, O king.";
hnv[26] = "As the king of Yisra\'el was passing by on the wall, there cried a woman to him, saying, Help, my lord, O king.";
vul[26] = "cumque rex Israhel transiret per murum mulier exclamavit ad eum dicens salva me domine mi rex";
kjv[27] = "And he said, If the LORD do not help thee, whence shall I help thee? out of the barnfloor, or out of the winepress?";
rsv[27] = "And he said, &quot;If the LORD will not help you, whence shall I help you? From the threshing floor, or from the wine press?&quot;";
asv[27] = "And he said, If Jehovah do not help thee, whence shall I help thee? out of the threshing-floor, or out of the winepress?";
yng[27] = "And he saith, `Jehovah doth not save thee -- whence do I save thee? out of the threshing-floor, or out of the wine-vat?\'";
dby[27] = "And he said, If Jehovah do not help thee, whence should I help thee? Out of the threshing-floor, or out of the winepress?";
web[27] = "And he said, If the LORD doth not help thee, whence shall I help thee? out of the barn-floor, or out of the wine-press?";
hnv[27] = "He said, If the LORD doesn\'t help you, whence shall I help you? out of the threshing floor, or out of the winepress?";
vul[27] = "qui ait non te salvet Dominus unde salvare te possum de area an de torculari dixitque ad eam rex quid tibi vis quae respondit";
kjv[28] = "And the king said unto her, What aileth thee? And she answered, This woman said unto me, Give thy son, that we may eat him to day, and we will eat my son to morrow.";
rsv[28] = "And the king asked her, &quot;What is your trouble?&quot; She answered, &quot;This woman said to me, \'Give your son, that we may eat him today, and we will eat my son tomorrow.\'";
asv[28] = "And the king said unto her, What aileth thee? And she answered, This woman said unto me, Give thy son, that we may eat him to-day, and we will eat my son to-morrow.";
yng[28] = "And the king saith to her, `What -- to thee?\' and she saith, `This woman said unto me, Give thy son, and we eat him to-day, and my son we eat to-morrow;";
dby[28] = "And the king said to her, What aileth thee? And she said, This woman said to me, Give thy son, that we may eat him to-day, and we will eat my son to-morrow.";
web[28] = "And the king said to her, What aileth thee? and she answered, This woman said to me, Give thy son, that we may eat him to-day, and we will eat my son to-morrow.";
hnv[28] = "The king said to her, What ails you? She answered, This woman said to me, Give your son, that we may eat him today, and we will eat my son tomorrow.";
vul[28] = "mulier ista dixit mihi da filium tuum ut comedamus eum hodie et filium meum comedemus cras";
kjv[29] = "So we boiled my son, and did eat him: and I said unto her on the next day, Give thy son, that we may eat him: and she hath hid her son.";
rsv[29] = "So we boiled my son, and ate him. And on the next day I said to her, \'Give your son, that we may eat him\'; but she has hidden her son.&quot;";
asv[29] = "So we boiled my son, and did eat him: and I said unto her on the next day, Give thy son, that we may eat him; and she hath hid her son.";
yng[29] = "and we boil my son and eat him, and I say unto her on the next day, Give thy son, and we eat him; and she hideth her son.\'";
dby[29] = "And we boiled my son, and ate him: and I said to her on the next day, Give thy son, that we may eat him; and she has hidden her son.";
web[29] = "So we boiled my son, and ate him: and I said to her on the next day, Give thy son, that we may eat him: and she hath hid her son.";
hnv[29] = "So we boiled my son, and ate him: and I said to her on the next day, Give your son, that we may eat him; and she has hid her son.";
vul[29] = "coximus ergo filium meum et comedimus dixique ei die altera da filium tuum ut comedamus eum quae abscondit filium suum";
kjv[30] = "And it came to pass, when the king heard the words of the woman, that he rent his clothes; and he passed by upon the wall, and the people looked, and, behold, [he had] sackcloth within upon his flesh.";
rsv[30] = "When the king heard the words of the woman he rent his clothes--now he was passing by upon the wall--and the people looked, and behold, he had sackcloth beneath upon his body--";
asv[30] = "And it came to pass, when the king heard the words of the woman, that he rent his clothes (now he was passing by upon the wall); and the people looked, and, behold, he had sackcloth within upon his flesh.";
yng[30] = "And it cometh to pass, at the king\'s hearing the words of the woman, that he rendeth his garments, and he is passing by on the wall, and the people see, and lo, the sackcloth [is] on his flesh within.";
dby[30] = "And it came to pass when the king heard the words of the woman, that he rent his garments; and he was passing by upon the wall, and the people looked, and behold, he had sackcloth within upon his flesh.";
web[30] = "And it came to pass, when the king heard the words of the woman, that he rent his clothes; and he passed by upon the wall, and the people looked, and behold, [he had] sackcloth within upon his flesh.";
hnv[30] = "It happened, when the king heard the words of the woman, that he tore his clothes (now he was passing by on the wall); and the people looked, and, behold, he had sackcloth within on his flesh.";
vul[30] = "quod cum audisset rex scidit vestimenta sua et transiebat super murum viditque omnis populus cilicium quo vestitus erat ad carnem intrinsecus";
kjv[31] = "Then he said, God do so and more also to me, if the head of Elisha the son of Shaphat shall stand on him this day.";
rsv[31] = "and he said, &quot;May God do so to me, and more also, if the head of Eli\'sha the son of Shaphat remains on his shoulders today.&quot;";
asv[31] = "Then he said, God do so to me, and more also, if the head of Elisha the son of Shaphat shall stand on him this day.";
yng[31] = "And he saith, `Thus doth God do to me, and thus He doth add -- if it remain -- the head of Elisha son of Shaphat -- upon him this day.\'";
dby[31] = "And he said, God do so, and more also to me, if the head of Elisha the son of Shaphat shall remain on him this day!";
web[31] = "Then he said, God do so and more also to me, if the head of Elisha the son of Shaphat shall stand on him this day.";
hnv[31] = "Then he said, God do so to me, and more also, if the head of Elisha the son of Shafat shall stand on him this day.";
vul[31] = "et ait haec mihi faciat Deus et haec addat si steterit caput Helisei filii Saphat super eum hodie";
kjv[32] = "But Elisha sat in his house, and the elders sat with him; and [the king] sent a man from before him: but ere the messenger came to him, he said to the elders, See ye how this son of a murderer hath sent to take away mine head? look, when the messenger cometh, shut the door, and hold him fast at the door: [is] not the sound of his master\'s feet behind him?";
rsv[32] = "Eli\'sha was sitting in his house, and the elders were sitting with him. Now the king had dispatched a man from his presence; but before the messenger arrived Eli\'sha said to the elders, &quot;Do you see how this murderer has sent to take off my head? Look, when the messenger comes, shut the door, and hold the door fast against him. Is not the sound of his master\'s feet behind him?&quot;";
asv[32] = "But Elisha was sitting in his house, and the elders were sitting with him; and [the king] sent a man from before him: but ere the messenger came to him, he said to the elders, See ye how this son of a murderer hath sent to take away my head? look, when the messenger cometh, shut the door, and hold the door fast against him: is not the sound of his master\'s feet behind him?";
yng[32] = "And Elisha is sitting in his house, and the elders are sitting with him, and [the king] sendeth a man from before him; before the messenger doth come unto him, even he himself said unto the elders, `Have ye seen that this son of the murderer hath sent to turn aside my head? see, at the coming in of the messenger, shut the door, and ye have held him fast at the door, is not the sound of the feet of his lord behind him?\'";
dby[32] = "And Elisha sat in his house, and the elders sat with him. And [the king] sent a man before him. Before the messenger came to him, he himself said to the elders, Do ye see how this son of a murderer has sent to take away my head? See, when the messenger comes; shut the door, and keep him off with the door: is not the sound of his master\'s feet behind him?";
web[32] = "But Elisha sat in his house, and the elders sat with him; and [the king] sent a man from before him: but ere the messenger came to him, he said to the elders, See ye how this son of a murderer hath sent to take away my head? look, when the messenger cometh, shut the door, and hold him fast at the door: [is] not the sound of his master\'s feet behind him?";
hnv[32] = "But Elisha was sitting in his house, and the Zakenim were sitting with him; and [the king] sent a man from before him: but before the messenger came to him, he said to the Zakenim, See you how this son of a murderer has sent to take away my head? behold, when the messenger comes, shut the door, and hold the door fast against him: isn\'t the sound of his master\'s feet behind him?";
vul[32] = "Heliseus autem sedebat in domo sua et senes sedebant cum eo praemisit itaque virum et antequam veniret nuntius ille dixit ad senes numquid scitis quod miserit filius homicidae hic ut praecidatur caput meum videte ergo cum venerit nuntius cludite ostium et non sinatis eum introire ecce enim sonitus pedum domini eius post eum est";
kjv[33] = "And while he yet talked with them, behold, the messenger came down unto him: and he said, Behold, this evil [is] of the LORD; what should I wait for the LORD any longer?";
rsv[33] = "And while he was still speaking with them, the king came down to him and said, &quot;This trouble is from the LORD! Why should I wait for the LORD any longer?&quot;";
asv[33] = "And while he was yet talking with them, behold, the messenger came down unto him: and he said, Behold, this evil is of Jehovah; why should I wait for Jehovah any longer?";
yng[33] = "He is yet speaking with them, and lo, the messenger is coming down unto him, and he saith, `Lo, this [is] the evil from Jehovah: what -- do I wait for Jehovah any more?\'";
dby[33] = "And while he yet talked with them, behold, the messenger came down to him. And [the king] said, Behold, this evil is of Jehovah: why should I wait for Jehovah any longer?";
web[33] = "And while he yet talked with them, behold, the messenger came down to him: and he said, Behold, this evil [is] from the LORD; what should I wait for the LORD any longer?";
hnv[33] = "While he was yet talking with them, behold, the messenger came down to him: and he said, Behold, this evil is of the LORD; why should I wait for the LORD any longer?";
vul[33] = "et adhuc illo loquente eis apparuit nuntius qui veniebat ad eum et ait ecce tantum malum a Domino est quid amplius expectabo a Domino";
</script>
