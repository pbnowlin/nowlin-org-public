csb[1] = "When Athaliah, Ahaziah\'s mother, saw that her son was dead, she proceeded to annihilate all the royal heirs.";
csb[2] = "Jehosheba, who was King Jehoram\'s daughter and Ahaziah\'s sister, secretly rescued Joash son of Ahaziah from among the king\'s sons who were being killed and put him and the one who nursed him in a bedroom. So he was hidden from Athaliah and was not killed.";
csb[3] = "Joash was in hiding with her in the LORD\'s temple six years while Athaliah reigned over the land.";
csb[4] = "In the seventh year, Jehoiada sent for the commanders of hundreds, the Carites, and the guards. He had them come to him in the LORD\'s temple, where he made a covenant with them and put them under oath. He showed them the king\'s son";
csb[5] = "and commanded them, &quot;This is what you are to do: A third of you who come on duty on the Sabbath are to provide protection for the king\'s palace.";
csb[6] = "&quot;A third are to be at the Foundation Gate and a third at the gate behind the guards. You are to take turns providing protection for the palace.";
csb[7] = "&quot;Your two divisions that go off duty on the Sabbath are to provide the king protection at the LORD\'s temple.";
csb[8] = "&quot;Completely surround the king with weapons in hand. Anyone who approaches the ranks is to be put to death. Be with the king in all his daily tasks.&quot;";
csb[9] = "So the commanders of hundreds did everything the priest Jehoiada commanded. They each brought their men -- those coming on duty on the Sabbath and those going off duty -- and came to the priest Jehoiada.";
csb[10] = "The priest gave to the commanders of hundreds King David\'s spears and shields that were in the LORD\'s temple.";
csb[11] = "Then the guards stood with their weapons in hand surrounding the king -- from the right side of the temple to the left side, by the altar and by the temple.";
csb[12] = "Jehoiada brought out the king\'s son, put the crown on him, gave him the testimony, and made him king. They anointed him and clapped their hands and cried, &quot;Long live the king! &quot;";
csb[13] = "When Athaliah heard the noise from the guard and the crowd, she went out to the people at the LORD\'s temple.";
csb[14] = "She looked, and there was the king standing by the pillar according to the custom. The commanders and the trumpeters were by the king, and all the people of the land were rejoicing and blowing trumpets. Athaliah tore her clothes and screamed &quot;Treason! Treason! &quot;";
csb[15] = "Then the priest Jehoiada ordered the commanders of hundreds in charge of the army, &quot;Take her out between the ranks, and put to death by the sword anyone who follows her,&quot; for the priest had said, &quot;She is not to be put to death in the LORD\'s temple.&quot;";
csb[16] = "So they arrested her, and she went through the horse entrance to the king\'s palace, where she was put to death.";
csb[17] = "Then Jehoiada made a covenant between the LORD, the king, and the people that they would be the LORD\'s people and another covenant between the king and the people.";
csb[18] = "So all the people of the land went to the temple of Baal and tore it down. They smashed its altars and images to pieces, and they killed Mattan, the priest of Baal, at the altars. Then Jehoiada the priest appointed guards for the LORD\'s temple.";
csb[19] = "He took the commanders of hundreds, the Carites, the guards, and all the people of the land, and they brought the king from the LORD\'s temple. They entered the king\'s palace by way of the guards\' gate. Then Joash sat on the throne of the kings.";
csb[20] = "All the people of the land rejoiced, and the city was quiet, for they had put Athaliah to death by the sword in the king\'s palace.";
csb[21] = "Joash was seven years old when he became king.";
kjv[1] = "And when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal.";
rsv[1] = "Now when Athali\'ah the mother of Ahazi\'ah saw that her son was dead, she arose and destroyed all the royal family.";
asv[1] = "Now when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal.";
yng[1] = "And Athaliah [is] mother of Ahaziah, and she hath seen that her son [is] dead, and she riseth, and destroyeth all the seed of the kingdom;";
dby[1] = "And when Athaliah the mother of Ahaziah saw that her son was dead, she rose up and destroyed all the royal seed.";
web[1] = "And when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal.";
hnv[1] = "Now when `Atalyah the mother of Achazyah saw that her son was dead, she arose and destroyed all the seed royal.";
vul[1] = "Athalia vero mater Ahaziae videns mortuum filium suum surrexit et interfecit omne semen regium";
kjv[2] = "But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah, and stole him from among the king\'s sons [which were] slain; and they hid him, [even] him and his nurse, in the bedchamber from Athaliah, so that he was not slain.";
rsv[2] = "But Jehosh\'eba, the daughter of King Joram, sister of Ahazi\'ah, took Jo\'ash the son of Ahazi\'ah, and stole him away from among the king\'s sons who were about to be slain, and she put him and his nurse in a bedchamber. Thus she hid him from Athali\'ah, so that he was not slain;";
asv[2] = "But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah, and stole him away from among the king\'s sons that were slain, even him and his nurse, [and put them] in the bedchamber; and they hid him from Athaliah, so that he was not slain;";
yng[2] = "and Jehosheba daughter of king Joram, sister of Ahaziah, taketh Joash son of Ahaziah, and stealeth him out of the midst of the sons of the king who are put to death, him and his nurse, in the inner part of the bed-chambers, and they hide him from the presence of Athaliah, and he hath not been put to death,";
dby[2] = "But Jehosheba, the daughter of king Joram, the sister of Ahaziah, took Joash the son of Ahaziah and stole him from among the king\'s sons that were slain, [and hid] him and his nurse in the bedchamber; and they hid him from Athaliah, so that he was not slain.";
web[2] = "But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the the son of Ahaziah, and stole him from among the king\'s sons [who were] slain; and they hid him, [even] him and his nurse, in the bed-chamber, from Athaliah, so that he was not slain.";
hnv[2] = "But Yehosheva, the daughter of king Yoram, sister of Achazyah, took Yo\'ash the son of Achazyah, and stole him away from among the king\'s sons who were slain, even him and his nurse, [and put them] in the bedchamber; and they hid him from `Atalyah, so that he was not slain;";
vul[2] = "tollens autem Iosaba filia regis Ioram soror Ahaziae Ioas filium Ahaziae furata est eum de medio filiorum regis qui interficiebantur et nutricem eius de triclinio et abscondit eum a facie Athaliae ut non interficeretur";
kjv[3] = "And he was with her hid in the house of the LORD six years. And Athaliah did reign over the land.";
rsv[3] = "and he remained with her six years, hid in the house of the LORD, while Athali\'ah reigned over the land.";
asv[3] = "And he was with her hid in the house of Jehovah six years. And Athaliah reigned over the land.";
yng[3] = "and he is with her, in the house of Jehovah, hiding himself, six years, and Athaliah is reigning over the land.";
dby[3] = "And he was with her hid in the house of Jehovah six years. And Athaliah reigned over the land.";
web[3] = "And he was with her hid in the house of the LORD six years. And Athaliah reigned over the land.";
hnv[3] = "He was with her hid in the house of the LORD six years. `Atalyah reigned over the land.";
vul[3] = "eratque cum ea in domo Domini clam sex annis porro Athalia regnavit super terram";
kjv[4] = "And the seventh year Jehoiada sent and fetched the rulers over hundreds, with the captains and the guard, and brought them to him into the house of the LORD, and made a covenant with them, and took an oath of them in the house of the LORD, and shewed them the king\'s son.";
rsv[4] = "But in the seventh year Jehoi\'ada sent and brought the captains of the Carites and of the guards, and had them come to him in the house of the LORD; and he made a covenant with them and put them under oath in the house of the LORD, and he showed them the king\'s son.";
asv[4] = "And in the seventh year Jehoiada sent and fetched the captains over hundreds of the Carites and of the guard, and brought them to him into the house of Jehovah; and he made a covenant with them, and took an oath of them in the house of Jehovah, and showed them the king\'s son.";
yng[4] = "And in the seventh year hath Jehoiada sent and taketh the heads of the hundreds, of the executioners and of the runners, and bringeth them in unto him, to the house of Jehovah, and maketh with them a covenant, and causeth them to swear in the house of Jehovah, and sheweth them the son of the king,";
dby[4] = "And in the seventh year Jehoiada sent and fetched the captains of the hundreds, of the bodyguard and the couriers, and brought them to him into the house of Jehovah, and made a covenant with them, and took an oath of them in the house of Jehovah, and shewed them the king\'s son.";
web[4] = "And in the seventh year Jehoiada sent and took the rulers over hundreds, with the captains and the guard, and brought them to him into the house of the LORD, and made a covenant with them, and took an oath of them in the house of the LORD, and showed them the king\'s son.";
hnv[4] = "In the seventh year Yehoiada sent and fetched the captains over hundreds of the Kari and of the guard, and brought them to him into the house of the LORD; and he made a covenant with them, and took an oath of them in the house of the LORD, and shown them the king\'s son.";
vul[4] = "anno autem septimo misit Ioiada et adsumens centuriones et milites introduxit ad se in templum Domini pepigitque cum eis foedus et adiurans eos in domo Domini ostendit eis filium regis";

yng[5] = "and commandeth them, saying, `This [is] the thing that ye do; The third of you [are] going in on the sabbath, and keepers of the charge of the house of the king,";

rsv[6] = "(another third being at the gate Sur and a third at the gate behind the guards), shall guard the palace;";

yng[6] = "and the third [is] at the gate of Sur, and the third at the gate behind the runners, and ye have kept the charge of the house pulled down;";
dby[6] = "and a third part shall be at the gate of Sur; and a third part at the gate behind the couriers; and ye shall keep the watch of the house for a defence.";

kjv[7] = "And two parts of all you that go forth on the sabbath, even they shall keep the watch of the house of the LORD about the king.";

dby[7] = "And the two parts of you, all those that go forth on the sabbath, even they shall keep the watch of the house of Jehovah about the king.";

yng[8] = "and ye have compassed the king round about, each with his weapons in his hand, and he who is coming unto the ranges is put to death; and be ye with the king in his going out and in his coming in.\'";
dby[8] = "And ye shall encompass the king round about, every man with his weapons in his hand; and he that comes within the ranks shall be put to death; and ye shall be with the king when he goes out and when he comes in.";

kjv[9] = "And the captains over the hundreds did according to all [things] that Jehoiada the priest commanded: and they took every man his men that were to come in on the sabbath, with them that should go out on the sabbath, and came to Jehoiada the priest.";
rsv[9] = "The captains did according to all that Jehoi\'ada the priest commanded, and each brought his men who were to go off duty on the sabbath, with those who were to come on duty on the sabbath, and came to Jehoi\'ada the priest.";
asv[9] = "And the captains over hundreds did according to all that Jehoiada the priest commanded; and they took every man his men, those that were to come in on the sabbath, with those that were to go out on the sabbath, and came to Jehoiada the priest.";
yng[9] = "And the heads of the hundreds do according to all that Jehoiada the priest commanded, and take each his men going in on the sabbath, with those going out on the sabbath, and come in unto Jehoiada the priest,";
dby[9] = "And the captains of the hundreds did according to all that Jehoiada the priest commanded; and they took every man his men, those that were to come in on the sabbath, with them that were to go forth on the sabbath, and they came to Jehoiada the priest.";
web[9] = "And the captains over the hundreds did according to all [things] that Jehoiada the priest commanded: and they took every man his men that were to come in on the sabbath, with them that should go out on the sabbath, and came to Jehoiada the priest.";
hnv[9] = "The captains over hundreds did according to all that Yehoiada the Kohen commanded; and they took every man his men, those who were to come in on the Shabbat, with those who were to go out on the Shabbat, and came to Yehoiada the Kohen.";

kjv[14] = "And when she looked, behold, the king stood by a pillar, as the manner [was], and the princes and the trumpeters by the king, and all the people of the land rejoiced, and blew with trumpets: and Athaliah rent her clothes, and cried, Treason, Treason.";
rsv[14] = "and when she looked, there was the king standing by the pillar, according to the custom, and the captains and the trumpeters beside the king, and all the people of the land rejoicing and blowing trumpets. And Athali\'ah rent her clothes, and cried, &quot;Treason! Treason!&quot;";
asv[14] = "and she looked, and, behold, the king stood by the pillar, as the manner was, and the captains and the trumpets by the king; and all the people of the land rejoiced, and blew trumpets. Then Athaliah rent her clothes, and cried, Treason! treason!";
yng[14] = "and looketh, and lo, the king is standing by the pillar, according to the ordinance, and the heads, and the trumpets, [are] by the king, and all the people of the land are rejoicing, and blowing with trumpets, and Athaliah rendeth her garments, and calleth, `Conspiracy! conspiracy!\'";
dby[14] = "And she looked, and behold, the king stood on the dais, according to the custom, and the princes and the trumpeters were by the king; and all the people of the land rejoiced, and blew with trumpets. And Athaliah rent her garments and cried, Conspiracy! Conspiracy!";
web[14] = "And when she looked, behold, the king stood by a pillar, as the manner [was], and the princes and the trumpeters by the king, and all the people of the land rejoiced, and blew with trumpets. And Athaliah rent her clothes, and cried, Treason, treason.";
hnv[14] = "and she looked, and, behold, the king stood by the pillar, as the manner was, and the captains and the trumpets by the king; and all the people of the land rejoiced, and blew trumpets. Then `Atalyah tore her clothes, and cried, Treason! treason!";
vul[14] = "vidit regem stantem super tribunal iuxta morem et cantores et tubas propter eum omnemque populum terrae laetantem et canentem tubis et scidit vestimenta sua clamavitque coniuratio coniuratio";
kjv[15] = "But Jehoiada the priest commanded the captains of the hundreds, the officers of the host, and said unto them, Have her forth without the ranges: and him that followeth her kill with the sword. For the priest had said, Let her not be slain in the house of the LORD.";
rsv[15] = "Then Jehoi\'ada the priest commanded the captains who were set over the army, &quot;Bring her out between the ranks; and slay with the sword any one who follows her.&quot; For the priest said, &quot;Let her not be slain in the house of the LORD.&quot;";
asv[15] = "And Jehoiada the priest commanded the captains of hundreds that were set over the host, and said unto them, Have her forth between the ranks; and him that followeth her slay with the sword. For the priest said, Let her not be slain in the house of Jehovah.";
yng[15] = "And Jehoiada the priest commandeth the heads of the hundreds, inspectors of the force, and saith unto them, `Bring her out unto the outside of the ranges, and him who is going after her, put to death by the sword:\' for the priest had said, `Let her not be put to death in the house of Jehovah.\'";
dby[15] = "And Jehoiada the priest commanded the captains of the hundreds that were set over the host, and said to them, Lead her forth without the ranks; and whosoever follows her, slay with the sword; for the priest said, Let her not be put to death in the house of Jehovah.";
web[15] = "But Jehoiada the priest commanded the captains of the hundreds, the officers of the host, and said to them, Have her forth without the ranges: and him that followeth her kill with the sword. For the priest had said, Let her not be slain in the house of the LORD.";
hnv[15] = " Yehoiada the Kohen commanded the captains of hundreds who were set over the host, and said to them, Have her forth between the ranks; and him who follows her kill with the sword. For the Kohen said, Don\'t let her be slain in the house of the LORD.";
vul[15] = "praecepit autem Ioiada centurionibus qui erant super exercitum et ait eis educite eam extra consepta templi et quicumque secutus eam fuerit feriatur gladio dixerat enim sacerdos non occidatur in templo Domini";
kjv[16] = "And they laid hands on her; and she went by the way by the which the horses came into the king\'s house: and there was she slain.";
rsv[16] = "So they laid hands on her; and she went through the horses\' entrance to the king\'s house, and there she was slain.";
