csb[1] = "In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham became king of Judah.";
csb[2] = "Ahaz was twenty years old when he became king, and he reigned sixteen years in Jerusalem. He did not do what was right in the sight of the LORD his God like his ancestor David";
csb[3] = "but walked in the ways of the kings of Israel. He even sacrificed his son in the fire, imitating the detestable practices of the nations the LORD had dispossessed before the Israelites.";
csb[4] = "He sacrificed and burned incense on the high places, on the hills, and under every green tree.";
csb[5] = "Then Aram\'s King Rezin and Israel\'s King Pekah son of Remaliah came to wage war against Jerusalem. They besieged Ahaz but were not able to conquer him.";
csb[6] = "At that time Aram\'s King Rezin recovered Elath for Aram and expelled the Judahites from Elath. Then the Arameans came to Elath, and they still live there today.";
csb[7] = "So Ahaz sent messengers to King Tiglath-pileser of Assyria, saying, &quot;I am your servant and your son. March up and save me from the grasp of the king of Aram and of the king of Israel, who are rising up against me.&quot;";
csb[8] = "Ahaz also took the silver and gold found in the LORD\'s temple and in the treasuries of the king\'s palace and sent them to the king of Assyria as a bribe.";
csb[9] = "So the king of Assyria listened to him and marched up to Damascus and captured it. He deported its people to Kir but put Rezin to death.";
csb[10] = "King Ahaz went to Damascus to meet King Tiglath-pileser of Assyria. When he saw the altar that was in Damascus, King Ahaz sent a model of the altar and complete plans for its construction to the priest Uriah.";
csb[11] = "Uriah built the altar according to all the instructions King Ahaz sent from Damascus. Therefore, by the time King Ahaz came back from Damascus, the priest Uriah had completed it.";
csb[12] = "When the king came back from Damascus, he saw the altar. Then he approached the altar and ascended it.";
csb[13] = "He offered his burnt offering and his grain offering, poured out his drink offering, and splattered the blood of his fellowship offerings on the altar.";
csb[14] = "He took the bronze altar that was before the LORD in front of the temple between his altar and the LORD\'s temple, and put it on the north side of his altar.";
csb[15] = "Then King Ahaz commanded the priest Uriah, &quot;Offer on the great altar the morning burnt offering, the evening grain offering, and the king\'s burnt offering and his grain offering. Also offer the burnt offering of all the people of the land, their grain offering, and their drink offerings. Splatter on the altar all the blood of the burnt offering and all the blood of sacrifice. The bronze altar will be for me to seek guidance.&quot;";
csb[16] = "The priest Uriah did everything King Ahaz commanded.";
csb[17] = "Then King Ahaz cut off the frames of the water carts and removed the bronze basin from each of them. He took the basin from the bronze oxen that were under it and put it on a stone pavement.";
csb[18] = "To satisfy the king of Assyria, he removed from the LORD\'s temple the Sabbath canopy they had built in the palace, and he closed the outer entrance for the king.";
csb[19] = "The rest of the events of Ahaz\'s reign, along with his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[20] = "Ahaz rested with his fathers and was buried with his fathers in the city of David, and his son Hezekiah became king in his place.";

yng[1] = "In the seventeenth year of Pekah son of Remaliah reigned hath Ahaz son of Jotham king of Judah.";
dby[1] = "In the seventeenth year of Pekah the son of Remaliah, Ahaz the son of Jotham, king of Judah, began to reign.";

hnv[1] = "In the seventeenth year of Pekach the son of Remalyahu Achaz the son of Yotam king of Yehudah began to reign.";

kjv[2] = "Twenty years old [was] Ahaz when he began to reign, and reigned sixteen years in Jerusalem, and did not [that which was] right in the sight of the LORD his God, like David his father.";
rsv[2] = "Ahaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem. And he did not do what was right in the eyes of the LORD his God, as his father David had done,";
asv[2] = "Twenty years old was Ahaz when he began to reign; and he reigned sixteen years in Jerusalem: and he did not that which was right in the eyes of Jehovah his God, like David his father.";
yng[2] = "A son of twenty years [is] Ahaz in his reigning, and sixteen years he hath reigned in Jerusalem, and he hath not done that which [is] right in the eyes of Jehovah his God, like David his father,";
dby[2] = "Ahaz was twenty years old when he began to reign; and he reigned sixteen years in Jerusalem. And he did not what was right in the sight of Jehovah his God, like David his father,";
web[2] = "Twenty years old [was] Ahaz when he began to reign, and reigned sixteen years in Jerusalem, and did not [that which was] right in the sight of the LORD his God, like David his father.";
hnv[2] = "Twenty years old was Achaz when he began to reign; and he reigned sixteen years in Yerushalayim: and he didn\'t do that which was right in the eyes of the LORD his God, like David his father.";
vul[2] = "viginti annorum erat Ahaz cum regnare coepisset et sedecim annis regnavit in Hierusalem non fecit quod erat placitum in conspectu Domini Dei sui sicut David pater eius";
kjv[3] = "But he walked in the way of the kings of Israel, yea, and made his son to pass through the fire, according to the abominations of the heathen, whom the LORD cast out from before the children of Israel.";
rsv[3] = "but he walked in the way of the kings of Israel. He even burned his son as an offering, according to the abominable practices of the nations whom the LORD drove out before the people of Israel.";
asv[3] = "But he walked in the way of the kings of Israel, yea, and made his son to pass through the fire, according to the abominations of the nations, whom Jehovah cast out from before the children of Israel.";
yng[3] = "and he walketh in the way of the kings of Israel, and also his son he hath caused to pass over into fire, according to the abominations of the nations that Jehovah dispossessed from the presence of the sons of Israel,";
dby[3] = "but walked in the way of the kings of Israel, and even caused his son to pass through the fire, according to the abominations of the nations that Jehovah had dispossessed from before the children of Israel.";
web[3] = "But he walked in the way of the kings of Israel, and even made his son to pass through the fire, according to the abominations of the heathen, whom the LORD cast out from before the children of Israel.";
hnv[3] = "But he walked in the way of the kings of Yisra\'el, yes, and made his son to pass through the fire, according to the abominations of the nations, whom the LORD cast out from before the children of Yisra\'el.";
vul[3] = "sed ambulavit in via regum Israhel insuper et filium suum consecravit transferens per ignem secundum idola gentium quae dissipavit Dominus coram filiis Israhel";

asv[4] = "And he sacrificed and burnt incense in the high places, and on the hills, and under every green tree.";

dby[4] = "And he sacrificed and burned incense on the high places, and on the hills, and under every green tree.";

hnv[4] = "He sacrificed and burnt incense in the high places, and on the hills, and under every green tree.";

kjv[5] = "Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome [him].";
rsv[5] = "Then Rezin king of Syria and Pekah the son of Remali\'ah, king of Israel, came up to wage war on Jerusalem, and they besieged Ahaz but could not conquer him.";
asv[5] = "Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome him.";
yng[5] = "Then doth Rezin king of Aram go up, and Pekah son of Remaliah king of Israel, to Jerusalem, to battle, and they lay siege to Ahaz, and they have not been able to fight.";
dby[5] = "Then Rezin the king of Syria, and Pekah son of Remaliah, the king of Israel, came up to Jerusalem to battle; and they besieged Ahaz, but were unable to conquer him.";
web[5] = "Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome [him].";
hnv[5] = "Then Retzin king of Aram and Pekach son of Remalyahu king of Yisra\'el came up to Yerushalayim to war: and they besieged Achaz, but could not overcome him.";
vul[5] = "tunc ascendit Rasin rex Syriae et Phacee filius Romeliae rex Israhel in Hierusalem ad proeliandum cumque obsiderent Ahaz non valuerunt superare eum";
kjv[6] = "At that time Rezin king of Syria recovered Elath to Syria, and drave the Jews from Elath: and the Syrians came to Elath, and dwelt there unto this day.";
rsv[6] = "At that time the king of Edom recovered Elath for Edom, and drove the men of Judah from Elath; and the E\'domites came to Elath, where they dwell to this day.";
asv[6] = "At that time Rezin king of Syria recovered Elath to Syria, and drove the Jews from Elath; and the Syrians came to Elath, and dwelt there, unto this day.";
yng[6] = "At that time hath Rezin king of Aram brought back Elath to Aram, and casteth out the Jews from Elath, and the Aramaeans have come in to Elath, and dwell there unto this day.";
dby[6] = "At that time Rezin king of Syria recovered Elath to Syria, and drove the Jews from Elath; and the Syrians came to Elath, and dwelt there to this day.";
web[6] = "At that time Rezin king of Syria recovered Elath to Syria, and drove the Jews from Elath: and the Syrians came to Elath, and have dwelt there to this day.";
hnv[6] = "At that time Retzin king of Aram recovered Elat to Aram, and drove the Yehudim from Elat; and the Aram came to Elat, and lived there, to this day.";
vul[6] = "in tempore illo restituit Rasin rex Syriae Ahilam Syriae et eiecit Iudaeos de Ahilam et Idumei venerunt in Ahilam et habitaverunt ibi usque in diem hanc";
kjv[7] = "So Ahaz sent messengers to Tiglathpileser king of Assyria, saying, I [am] thy servant and thy son: come up, and save me out of the hand of the king of Syria, and out of the hand of the king of Israel, which rise up against me.";
rsv[7] = "So Ahaz sent messengers to Tig\'lath-pile\'ser king of Assyria, saying, &quot;I am your servant and your son. Come up, and rescue me from the hand of the king of Syria and from the hand of the king of Israel, who are attacking me.&quot;";
asv[7] = "So Ahaz sent messengers to Tiglath-pileser king of Assyria, saying, I am thy servant and thy son: come up, and save me out of the hand of the king of Syria, and out of the hand of the king of Israel, who rise up against me.";
yng[7] = "And Ahaz sendeth messengers unto Tiglath-Pileser king of Asshur, saying, `Thy servant and thy son [am] I; come up and save me out of the hand of the king of Aram, and out of the hand of the king of Israel, who are rising up against me.\'";
dby[7] = "And Ahaz sent messengers to Tiglath-Pileser king of Assyria, saying, I am thy servant and thy son: come up, and save me out of the hand of the king of Syria, and out of the hand of the king of Israel, who have risen up against me.";
web[7] = "So Ahaz sent messengers to Tiglath-pileser king of Assyria, saying, I [am] thy servant and thy son: come up, and save me from the hand of the king of Syria, and from the hand of the king of Israel, who rise up against me.";
hnv[7] = "So Achaz sent messengers to Tiglat-Pil\'eser king of Ashshur, saying, I am your servant and your son: come up, and save me out of the hand of the king of Aram, and out of the hand of the king of Yisra\'el, who rise up against me.";
vul[7] = "misit autem Ahaz nuntios ad Theglathfalassar regem Assyriorum dicens servus tuus et filius tuus ego sum ascende et salvum me fac de manu regis Syriae et de manu regis Israhel qui consurrexerunt adversum me";
kjv[8] = "And Ahaz took the silver and gold that was found in the house of the LORD, and in the treasures of the king\'s house, and sent [it for] a present to the king of Assyria.";
rsv[8] = "Ahaz also took the silver and gold that was found in the house of the LORD and in the treasures of the king\'s house, and sent a present to the king of Assyria.";
asv[8] = "And Ahaz took the silver and gold that was found in the house of Jehovah, and in the treasures of the king\'s house, and sent it for a present to the king of Assyria.";
yng[8] = "And Ahaz taketh the silver and the gold that is found in the house of Jehovah, and in the treasures of the house of the king, and sendeth to the king of Asshur -- a bribe.";
dby[8] = "And Ahaz took the silver and the gold that was found in the house of Jehovah, and in the treasures of the king\'s house, and sent it [as] a present to the king of Assyria.";
web[8] = "And Ahaz took the silver and gold that was found in the house of the LORD, and in the treasures of the king\'s house, and sent [it for] a present to the king of Assyria.";
hnv[8] = "Achaz took the silver and gold that was found in the house of the LORD, and in the treasures of the king\'s house, and sent it for a present to the king of Ashshur.";
vul[8] = "et cum collegisset argentum et aurum quod invenire potuit in domo Domini et in thesauris regis misit regi Assyriorum munera";
kjv[9] = "And the king of Assyria hearkened unto him: for the king of Assyria went up against Damascus, and took it, and carried [the people of] it captive to Kir, and slew Rezin.";
rsv[9] = "And the king of Assyria hearkened to him; the king of Assyria marched up against Damascus, and took it, carrying its people captive to Kir, and he killed Rezin.";
asv[9] = "And the king of Assyria hearkened unto him; and the king of Assyria went up against Damascus, and took it, and carried [the people of] it captive to Kir, and slew Rezin.";
yng[9] = "And hearken unto him doth the king of Asshur, and the king of Asshur goeth up unto Damascus, and seizeth it, and removeth [the people of] it to Kir, and Rezin he hath put to death.";
dby[9] = "And the king of Assyria hearkened to him; and the king of Assyria went up against Damascus, and took it, and carried it captive to Kir, and put Rezin to death.";
web[9] = "And the king of Assyria hearkened to him: for the king of Assyria went up against Damascus, and took it, and carried [the people of] it captive to Kir, and slew Rezin.";
hnv[9] = "The king of Ashshur listened to him; and the king of Ashshur went up against Dammesek, and took it, and carried [the people of] it captive to Kir, and killed Retzin.";
vul[9] = "qui et adquievit voluntati eius ascendit enim rex Assyriorum in Damascum et vastavit eam et transtulit habitatores eius Cyrenen Rasin autem interfecit";
kjv[10] = "And king Ahaz went to Damascus to meet Tiglathpileser king of Assyria, and saw an altar that [was] at Damascus: and king Ahaz sent to Urijah the priest the fashion of the altar, and the pattern of it, according to all the workmanship thereof.";
rsv[10] = "When King Ahaz went to Damascus to meet Tig\'lath-pile\'ser king of Assyria, he saw the altar that was at Damascus. And King Ahaz sent to Uri\'ah the priest a model of the altar, and its pattern, exact in all its details.";
asv[10] = "And king Ahaz went to Damascus to meet Tiglath-pileser king of Assyria, and saw the altar that was at Damascus; and king Ahaz sent to Urijah the priest the fashion of the altar, and the pattern of it, according to all the workmanship thereof.";
yng[10] = "And king Ahaz goeth to meet Tiglath-Pileser king of Asshur [at] Damascus, and seeth the altar that [is] in Damascus, and king Ahaz sendeth unto Urijah the priest the likeness of the altar, and its pattern, according to all its work,";
dby[10] = "And king Ahaz went to Damascus to meet Tiglath-Pileser king of Assyria; and he saw the altar that was at Damascus, and king Ahaz sent to Urijah the priest the form of the altar, and the pattern of it, according to all its workmanship.";
web[10] = "And king Ahaz went to Damascus to meet Tiglath-pileser king of Assyria, and saw an altar that [was] at Damascus: and king Ahaz sent to Urijah the priest the fashion of the altar, and the pattern of it, according to all the workmanship of it.";
hnv[10] = "King Achaz went to Dammesek to meet Tiglat-Pil\'eser king of Ashshur, and saw the altar that was at Dammesek; and king Achaz sent to Uriyahu the Kohen the fashion of the altar, and the pattern of it, according to all the workmanship of it.";
vul[10] = "perrexitque rex Ahaz in occursum Theglathfalassar regis Assyriorum in Damascum cumque vidisset altare Damasci misit rex Ahaz ad Uriam sacerdotem exemplar eius et similitudinem iuxta omne opus eius";
kjv[11] = "And Urijah the priest built an altar according to all that king Ahaz had sent from Damascus: so Urijah the priest made [it] against king Ahaz came from Damascus.";
rsv[11] = "And Uri\'ah the priest built the altar; in accordance with all that King Ahaz had sent from Damascus, so Uri\'ah the priest made it, before King Ahaz arrived from Damascus.";
asv[11] = "And Urijah the priest built an altar: according to all that king Ahaz had sent from Damascus, so did Urijah the priest make it against the coming of king Ahaz from Damascus.";
yng[11] = "and Urijah the priest buildeth the altar according to all that king Ahaz hath sent from Damascus; so did Urijah the priest till the coming in of king Ahaz from Damascus.";
dby[11] = "And Urijah the priest built an altar according to all that king Ahaz had sent from Damascus; thus Urijah the priest made [it], against king Ahaz came from Damascus.";
web[11] = "And Urijah the priest built an altar according to all that king Ahaz had sent from Damascus: so Urijah the priest made [it] against king Ahaz came from Damascus.";
hnv[11] = "Uriyahu the Kohen built an altar: according to all that king Achaz had sent from Dammesek, so did Uriyahu the Kohen make it against the coming of king Achaz from Dammesek.";
vul[11] = "extruxitque Urias sacerdos altare iuxta omnia quae praeceperat rex Ahaz de Damasco ita fecit Urias sacerdos donec veniret rex Ahaz de Damasco";
kjv[12] = "And when the king was come from Damascus, the king saw the altar: and the king approached to the altar, and offered thereon.";
rsv[12] = "And when the king came from Damascus, the king viewed the altar. Then the king drew near to the altar, and went up on it,";
asv[12] = "And when the king was come from Damascus, the king saw the altar: and the king drew near unto the altar, and offered thereon.";
yng[12] = "And the king cometh in from Damascus, and the king seeth the altar, and the king draweth near on the altar, and offereth on it,";
dby[12] = "And when the king came from Damascus, the king saw the altar; and the king approached to the altar, and offered upon it.";
web[12] = "And when the king had come from Damascus, the king saw the altar: and the king approached to the altar, and offered on it.";
hnv[12] = "When the king was come from Dammesek, the king saw the altar: and the king drew near to the altar, and offered thereon.";
vul[12] = "cumque venisset rex de Damasco vidit altare et veneratus est illud ascenditque et immolavit holocausta et sacrificium suum";
kjv[13] = "And he burnt his burnt offering and his meat offering, and poured his drink offering, and sprinkled the blood of his peace offerings, upon the altar.";
rsv[13] = "and burned his burnt offering and his cereal offering, and poured his drink offering, and threw the blood of his peace offerings upon the altar.";
asv[13] = "And he burnt his burnt-offering and his meal-offering, and poured his drink-offering, and sprinkled the blood of his peace-offerings, upon the altar.";
yng[13] = "and perfumeth his burnt-offering, and his present, and poureth out his libation, and sprinkleth the blood of the peace-offerings that he hath, on the altar.";
dby[13] = "And he burned his burnt-offering and his oblation, and poured out his drink-offering, and sprinkled the blood of his peace-offering upon the altar.";
web[13] = "And he burnt his burnt-offering and his meat-offering, and poured his drink-offering, and sprinkled the blood of his peace-offerings upon the altar.";
hnv[13] = "He burnt his burnt offering and his meal-offering, and poured his drink-offering, and sprinkled the blood of his peace-offerings, on the altar.";
vul[13] = "et libavit libamina et fudit sanguinem pacificorum quae obtulerat super altare";
kjv[14] = "And he brought also the brasen altar, which [was] before the LORD, from the forefront of the house, from between the altar and the house of the LORD, and put it on the north side of the altar.";
rsv[14] = "And the bronze altar which was before the LORD he removed from the front of the house, from the place between his altar and the house of the LORD, and put it on the north side of his altar.";
asv[14] = "And the brazen altar, which was before Jehovah, he brought from the forefront of the house, from between his altar and the house of Jehovah, and put it on the north side of his altar.";
yng[14] = "As to the altar of brass that [is] before Jehovah -- he bringeth [it] near from the front of the house, from between the altar and the house of Jehovah, and putteth it on the side of the altar, northward.";
dby[14] = "And the brazen altar which was before Jehovah, he brought forward from the forefront of the house, from between [his] altar and the house of Jehovah, and put it by the side of [his] altar on the north.";
web[14] = "And he brought also the brazen altar, which [was] before the LORD, from the front of the house, from between the altar and the house of the LORD, and put it on the north side of the altar.";
hnv[14] = "The brazen altar, which was before the LORD, he brought from the forefront of the house, from between his altar and the house of the LORD, and put it on the north side of his altar.";
vul[14] = "porro altare aeneum quod erat coram Domino transtulit de facie templi et de loco altaris et de loco templi Domini posuitque illud ex latere altaris ad aquilonem";
kjv[15] = "And king Ahaz commanded Urijah the priest, saying, Upon the great altar burn the morning burnt offering, and the evening meat offering, and the king\'s burnt sacrifice, and his meat offering, with the burnt offering of all the people of the land, and their meat offering, and their drink offerings; and sprinkle upon it all the blood of the burnt offering, and all the blood of the sacrifice: and the brasen altar shall be for me to enquire [by].";
rsv[15] = "And King Ahaz commanded Uri\'ah the priest, saying, &quot;Upon the great altar burn the morning burnt offering, and the evening cereal offering, and the king\'s burnt offering, and his cereal offering, with the burnt offering of all the people of the land, and their cereal offering, and their drink offering; and throw upon it all the blood of the burnt offering, and all the blood of the sacrifice; but the bronze altar shall be for me to inquire by.&quot;";
asv[15] = "And king Ahaz commanded Urijah the priest, saying, Upon the great altar burn the morning burnt-offering, and the evening meal-offering, and the king\'s burnt-offering, and his meal-offering, with the burnt-offering of all the people of the land, and their meal-offering, and their drink-offerings; and sprinkle upon it all the blood of the burnt-offering, and all the blood of the sacrifice: but the brazen altar shall be for me to inquire by.";
yng[15] = "And king Ahaz commandeth him -- Urijah the priest -- saying, `On the great altar perfume the burnt-offering of the morning, and the present of the evening, and the burnt-offering of the king, and his present, and the burnt-offering of all the people of the land, and their present, and their libations; and all the blood of the burnt-offering, and all the blood of the sacrifice, on it thou dost sprinkle, and the altar of brass is to me to inquire [by].\'";
dby[15] = "And king Ahaz commanded Urijah the priest saying, Upon the great altar burn the morning burnt-offering, and the evening oblation, and the king\'s burnt-offering, and his oblation, and the burnt-offering of all the people of the land, and their oblation, and their drink-offerings; and sprinkle upon it all the blood of the burnt-offerings, and all the blood of the sacrifices; and the brazen altar shall be for me to inquire [by].";
web[15] = "And king Ahaz commanded Urijah the priest, saying, Upon the great altar burn the morning burnt-offering, and the evening meat-offering, and the king\'s burnt-sacrifice, and his meat-offering, with the burnt-offering of all the people of the land, and their meat-offering, and their drink-offerings; and sprinkle upon it all the blood of the burnt-offering, and all the blood of the sacrifice: and the brazen altar shall be for me to inquire [by].";
hnv[15] = "King Achaz commanded Uriyahu the Kohen, saying, On the great altar burn the morning burnt offering, and the evening meal-offering, and the king\'s burnt offering, and his meal-offering, with the burnt offering of all the people of the land, and their meal-offering, and their drink-offerings; and sprinkle on it all the blood of the burnt offering, and all the blood of the sacrifice: but the brazen altar shall be for me to inquire by.";
vul[15] = "praecepit quoque rex Ahaz Uriae sacerdoti dicens super altare maius offer holocaustum matutinum et sacrificium vespertinum et holocaustum regis et sacrificium eius et holocaustum universi populi terrae et sacrificia eorum et libamina eorum et omnem sanguinem holocausti et universum sanguinem victimae super illud effundes altare vero aeneum erit paratum ad voluntatem meam";
kjv[16] = "Thus did Urijah the priest, according to all that king Ahaz commanded.";
rsv[16] = "Uri\'ah the priest did all this, as King Ahaz commanded.";
asv[16] = "Thus did Urijah the priest, according to all that king Ahaz commanded.";
yng[16] = "And Urijah the priest doth according to all that king Ahaz commanded.";
dby[16] = "And Urijah the priest did according to all that king Ahaz had commanded.";
