csb[1] = "Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem. His mother\'s name was Jedidah the daughter of Adaiah; she was from Bozkath.";
csb[2] = "He did what was right in the LORD\'s sight and walked in all the ways of his ancestor David; he did not turn to the right or the left.";
csb[3] = "In the eighteenth year of King Josiah, the king sent the court secretary Shaphan son of Azaliah, son of Meshullam, to the LORD\'s temple, saying,";
csb[4] = "&quot;Go up to the high priest Hilkiah so that he may total up the silver brought into the LORD\'s temple -- the silver the doorkeepers have collected from the people.";
csb[5] = "&quot;It is to be given to those doing the work -- those who oversee the LORD\'s temple. They in turn are to give it to the workmen in the LORD\'s temple to repair the damage.";
csb[6] = "&quot;They are to give it to the carpenters, builders, and masons to buy timber and quarried stone to repair the temple.";
csb[7] = "&quot;But no accounting is to be required from them for the silver given to them since they work with integrity.&quot;";
csb[8] = "The high priest Hilkiah told the court secretary Shaphan, &quot;I have found the book of the law in the LORD\'s temple,&quot; and he gave the book to Shaphan, who read it.";
csb[9] = "Then the court secretary Shaphan went to the king and reported, &quot;Your servants have emptied out the silver that was found in the temple and have given it to those doing the work -- those who oversee the LORD\'s temple.&quot;";
csb[10] = "Then the court secretary Shaphan told the king, &quot;The priest Hilkiah has given me a book,&quot; and Shaphan read it in the presence of the king.";
csb[11] = "When the king heard the words of the book of the law, he tore his clothes.";
csb[12] = "Then he commanded the priest Hilkiah, Ahikam son of Shaphan, Achbor son of Micaiah, the court secretary Shaphan, and the king\'s servant Asaiah:";
csb[13] = "&quot;Go and inquire of the LORD for me, the people, and all Judah about the words in this book that has been found. For great is the LORD\'s wrath that is kindled against us because our ancestors have not obeyed the words of this book in order to do everything written about us.&quot;";
csb[14] = "So the priest Hilkiah, Ahikam, Achbor, Shaphan, and Asaiah went to the prophetess Huldah, wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second District. They spoke with her.";
csb[15] = "She said to them, &quot;This is what the LORD God of Israel says: Say to the man who sent you to me,";
csb[16] = "&quot;\'This is what the LORD says: I am about to bring disaster on this place and on its inhabitants, fulfilling all the words of the book that the king of Judah has read,";
csb[17] = "&quot;because they have abandoned me and burned incense to other gods in order to anger me with all the work of their hands. My wrath will be kindled against this place, and it will not be quenched.\'";
csb[18] = "&quot;Say this to the king of Judah who sent you to inquire of the LORD: \'This is what the LORD God of Israel says: As for the words that you heard,";
csb[19] = "&quot;because your heart was tender and you humbled yourself before the LORD when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you have torn your clothes and wept before me, I myself have heard\' -- this is the LORD\'s declaration.";
csb[20] = "&quot;\'Therefore, I will indeed gather you to your fathers, and you will be gathered to your grave in peace. Your eyes will not see all the disaster that I am bringing on this place.\' &quot; Then they reported to the king.";
