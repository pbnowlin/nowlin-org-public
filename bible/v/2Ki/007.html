csb[1] = "Elisha replied, &quot;Hear the word of the LORD! This is what the LORD says: \'About this time tomorrow at Samaria\'s gate, six quarts of fine flour will sell for a half ounce of silver and twelve quarts of barley will sell for a half ounce of silver.\' &quot;";
csb[2] = "Then the captain, the king\'s right-hand man, responded to the man of God, &quot;Look, even if the LORD were to make windows in heaven, could this really happen? &quot; Elisha announced, &quot;You will in fact see it with your own eyes, but you won\'t eat any of it.&quot;";
csb[3] = "Now four men with a skin disease were at the entrance to the city gate. They said to each other, &quot;Why just sit here until we die?";
csb[4] = "&quot;If we say, \'Let\'s go into the city,\' we will die there because the famine is in the city, but if we sit here, we will also die. So now, come on. Let\'s surrender to the Arameans\' camp. If they let us live, we will live; if they kill us, we will die.&quot;";
csb[5] = "So the diseased men got up at twilight to go to the Arameans\' camp. When they came to the camp\'s edge, they discovered that no one was there,";
csb[6] = "for the Lord had caused the Aramean camp to hear the sound of chariots, horses, and a large army. The Arameans had said to each other, &quot;The king of Israel must have hired the kings of the Hittites and the kings of Egypt to attack us.&quot;";
csb[7] = "So they had gotten up and fled at twilight, abandoning their tents, horses, and donkeys. The camp was intact, and they had fled for their lives.";
csb[8] = "When these diseased men came to the edge of the camp, they went into a tent to eat and drink. Then they picked up the silver, gold, and clothing and went off and hid them. They came back and entered another tent, picked things up, and hid them.";
csb[9] = "Then they said to each other, &quot;We\'re not doing what is right. Today is a day of good news. If we are silent and wait until morning light, our punishment will catch up with us. So let\'s go tell the king\'s household.&quot;";
csb[10] = "The diseased men came and called to the city\'s gatekeepers and told them, &quot;We went to the Aramean camp and no one was there -- no human sounds. There was nothing but tethered horses and donkeys, and the tents were intact.&quot;";
csb[11] = "The gatekeepers called out, and the news was reported to the king\'s household.";
csb[12] = "So the king got up in the night and said to his servants, &quot;Let me tell you what the Arameans have done to us. They know we are starving, so they have left the camp to hide in the open country, thinking, \'When they come out of the city, we will take them alive and go into the city.\' &quot;";
csb[13] = "But one of his servants responded, &quot;Please, let messengers take five of the horses that are left in the city. Their fate is like the entire Israelite community who will die, so let\'s send them and see.&quot;";
csb[14] = "The messengers took two chariots with horses, and the king sent them after the Aramean army, saying, &quot;Go and see.&quot;";
csb[15] = "So they followed them as far as the Jordan. They saw that the whole way was littered with clothes and equipment the Arameans had thrown off in their haste. The messengers returned and told the king.";
csb[16] = "Then the people went out and plundered the Aramean camp. It was then that six quarts of fine flour sold for a half ounce of silver and twelve quarts of barley sold for a half ounce of silver, according to the word of the LORD.";
csb[17] = "The king had appointed the captain, his right-hand man, to be in charge of the city gate, but the people trampled him in the gate. He died, just as the man of God had predicted when the king had come to him.";
csb[18] = "When the man of God had said to the king, &quot;About this time tomorrow twelve quarts of barley will sell for a half ounce of silver and six quarts of fine flour will sell for a half ounce of silver at Samaria\'s gate,&quot;";
csb[19] = "this captain had answered the man of God, &quot;Look, even if the LORD were to make windows in heaven, could this really happen? &quot; Elisha had said, &quot;You will in fact see it with your own eyes, but you won\'t eat any of it.&quot;";
csb[20] = "This is what happened to him: the people trampled him in the city gate, and he died.";
kjv[1] = "Then Elisha said, Hear ye the word of the LORD; Thus saith the LORD, To morrow about this time [shall] a measure of fine flour [be sold] for a shekel, and two measures of barley for a shekel, in the gate of Samaria.";
rsv[1] = "But Eli\'sha said, &quot;Hear the word of the LORD: thus says the LORD, Tomorrow about this time a measure of fine meal shall be sold for a shekel, and two measures of barley for a shekel, at the gate of Sama\'ria.&quot;";
asv[1] = "And Elisha said, Hear ye the word of Jehovah: thus saith Jehovah, To-morrow about this time shall a measure of fine flour be [sold] for a shekel, and two measures of barley for a shekel, in the gate of Samaria.";
yng[1] = "And Elisha saith, `Hear ye a word of Jehovah: thus said Jehovah, About this time to-morrow, a measure of fine flour [is] at a shekel, and two measures of barley at a shekel, in the gate of Samaria.\'";

kjv[2] = "Then a lord on whose hand the king leaned answered the man of God, and said, Behold, [if] the LORD would make windows in heaven, might this thing be? And he said, Behold, thou shalt see [it] with thine eyes, but shalt not eat thereof.";
rsv[2] = "Then the captain on whose hand the king leaned said to the man of God, &quot;If the LORD himself should make windows in heaven, could this thing be?&quot; But he said, &quot;You shall see it with your own eyes, but you shall not eat of it.&quot;";
asv[2] = "Then the captain on whose hand the king leaned answered the man of God, and said, Behold, if Jehovah should make windows in heaven, might this thing be? And he said, Behold, thou shalt see it with thine eyes, but shalt not eat thereof.";
yng[2] = "And the captain whom the king hath, by whose hand he hath been supported, answereth the man of God and saith, `Lo, Jehovah is making windows in the heavens -- shall this thing be?\' and he saith, `Lo, thou art seeing it with thine eyes, and thereof thou dost not eat.\'";

kjv[4] = "If we say, We will enter into the city, then the famine [is] in the city, and we shall die there: and if we sit still here, we die also. Now therefore come, and let us fall unto the host of the Syrians: if they save us alive, we shall live; and if they kill us, we shall but die.";
rsv[4] = "If we say, \'Let us enter the city,\' the famine is in the city, and we shall die there; and if we sit here, we die also. So now come, let us go over to the camp of the Syrians; if they spare our lives we shall live, and if they kill us we shall but die.&quot;";
asv[4] = "If we say, We will enter into the city, then the famine is in the city, and we shall die there; and if we sit still here, we die also. Now therefore come, and let us fall unto the host of the Syrians: if they save us alive, we shall live; and if they kill us, we shall but die.";
yng[4] = "if we have said, We go in to the city, then the famine [is] in the city, and we have died there; and if we have sat here, then we have died; and now, come and we fall unto the camp of Aram; if they keep us alive, we live, and if they put us to death -- we have died.\'";
dby[4] = "If we say, Let us enter into the city, the famine is in the city, and we shall die there; and if we abide here, we shall die. And now come, let us fall away to the camp of the Syrians: if they save us alive, we shall live; and if they put us to death, we shall but die.";

hnv[4] = "If we say, We will enter into the city, then the famine is in the city, and we shall die there; and if we sit still here, we die also. Now therefore come, and let us fall to the host of the Aram: if they save us alive, we shall live; and if they kill us, we shall but die.";
vul[4] = "sive ingredi voluerimus civitatem fame moriemur sive manserimus hic moriendum nobis est venite igitur et transfugiamus ad castra Syriae si pepercerint nobis vivemus si autem occidere voluerint nihilominus moriemur";

kjv[6] = "For the Lord had made the host of the Syrians to hear a noise of chariots, and a noise of horses, [even] the noise of a great host: and they said one to another, Lo, the king of Israel hath hired against us the kings of the Hittites, and the kings of the Egyptians, to come upon us.";
rsv[6] = "For the Lord had made the army of the Syrians hear the sound of chariots, and of horses, the sound of a great army, so that they said to one another, &quot;Behold, the king of Israel has hired against us the kings of the Hittites and the kings of Egypt to come upon us.&quot;";
asv[6] = "For the Lord had made the host of the Syrians to hear a noise of chariots, and a noise of horses, even the noise of a great host: and they said one to another, Lo, the king of Israel hath hired against us the kings of the Hittites, and the kings of the Egyptians, to come upon us.";
yng[6] = "seeing Jehovah hath caused the camp of Aram to hear a noise of chariot and a noise of horse -- a noise of great force, and they say one unto another, `Lo, the king of Israel hath hired against us the kings of the Hittites, and the kings of Egypt, to come against us.\'";
dby[6] = "For the Lord had made the army of the Syrians to hear a noise of chariots, and a noise of horses, a noise of a great host; and they said one to another, Behold, the king of Israel has hired against us the kings of the Hittites, and the kings of the Egyptians, to come upon us.";
web[6] = "For the Lord had made the army of the Syrians to hear a noise of chariots, and a noise of horses, [even] the noise of a great army: and they said one to another, Lo, the king of Israel hath hired against us the kings of the Hittites, and the kings of the Egyptians, to come upon us.";
hnv[6] = "For the Lord had made the host of the Aram to hear a noise of chariots, and a noise of horses, even the noise of a great host: and they said one to another, Behold, the king of Yisra\'el has hired against us the kings of the Hitti, and the kings of the Mitzrim, to come on us.";
vul[6] = "siquidem Dominus sonitum audiri fecerat in castris Syriae curruum et equorum et exercitus plurimi dixeruntque ad invicem ecce mercede conduxit adversum nos rex Israhel reges Hettheorum et Aegyptiorum et venerunt super nos";

kjv[8] = "And when these lepers came to the uttermost part of the camp, they went into one tent, and did eat and drink, and carried thence silver, and gold, and raiment, and went and hid [it]; and came again, and entered into another tent, and carried thence [also], and went and hid [it].";
rsv[8] = "And when these lepers came to the edge of the camp, they went into a tent, and ate and drank, and they carried off silver and gold and clothing, and went and hid them; then they came back, and entered another tent, and carried off things from it, and went and hid them.";
asv[8] = "And when these lepers came to the outermost part of the camp, they went into one tent, and did eat and drink, and carried thence silver, and gold, and raiment, and went and hid it; and they came back, and entered into another tent, and carried thence also, and went and hid it.";
yng[8] = "And these lepers come in unto the extremity of the camp, and come in unto one tent, and eat, and drink, and lift up thence silver, and gold, and garments, and go and hide; and they turn back and go in unto another tent, and lift up thence, and go and hide.";
dby[8] = "And those lepers came to the extremity of the camp; and they went into one tent, and ate and drank, and carried thence silver and gold, and garments, and went and hid it; and they came again, and entered into another tent, and carried thence, and went and hid [it].";
web[8] = "And when these lepers came to the uttermost part of the camp, they went into one tent, and ate and drank, and carried thence silver, and gold, and raiment, and went and hid [it]; and came again, and entered into another tent, and carried thence [also], and went and hid [it].";
hnv[8] = "When these lepers came to the outermost part of the camp, they went into one tent, and ate and drink, and carried there silver, and gold, and clothing, and went and hid it; and they came back, and entered into another tent, and carried there also, and went and hid it.";
vul[8] = "igitur cum venissent leprosi illi ad principium castrorum ingressi sunt unum tabernaculum et comederunt et biberunt tuleruntque inde argentum et aurum et vestes et abierunt et absconderunt et rursum reversi sunt ad aliud tabernaculum et inde similiter auferentes absconderunt";
kjv[9] = "Then they said one to another, We do not well: this day [is] a day of good tidings, and we hold our peace: if we tarry till the morning light, some mischief will come upon us: now therefore come, that we may go and tell the king\'s household.";
rsv[9] = "Then they said to one another, &quot;We are not doing right. This day is a day of good news; if we are silent and wait until the morning light, punishment will overtake us; now therefore come, let us go and tell the king\'s household.&quot;";
asv[9] = "Then they said one to another, We do not well; this day is a day of good tidings, and we hold our peace: if we tarry till the morning light, punishment will overtake us; now therefore come, let us go and tell the king\'s household.";
yng[9] = "And they say one unto another, `We are not doing right this day; a day of tidings it [is], and we are keeping silent; and -- we have waited till the light of the morning, then hath punishment found us; and now, come and we go in and declare to the house of the king.\'";
dby[9] = "And they said one to another, We are not doing right; this day is a day of good tidings, and we hold our peace: if we tarry till the morning light, the iniquity will find us out; and now come, let us go and tell the king\'s household.";
web[9] = "Then they said one to another, We do not well: this day [is] a day of good tidings, and we hold our peace: if we tarry till the morning light, some mischief will come upon us: now therefore come, that we may go and tell the king\'s household.";
hnv[9] = "Then they said one to another, We aren\'t doing right. This day is a day of good news, and we hold our shalom: if we wait until the morning light, punishment will overtake us; now therefore come, let us go and tell the king\'s household.";
vul[9] = "dixeruntque ad invicem non recte facimus haec enim dies boni nuntii est si tacuerimus et noluerimus nuntiare usque mane sceleris arguemur venite eamus et nuntiemus in aula regis";
kjv[10] = "So they came and called unto the porter of the city: and they told them, saying, We came to the camp of the Syrians, and, behold, [there was] no man there, neither voice of man, but horses tied, and asses tied, and the tents as they [were].";
rsv[10] = "So they came and called to the gatekeepers of the city, and told them, &quot;We came to the camp of the Syrians, and behold, there was no one to be seen or heard there, nothing but the horses tied, and the asses tied, and the tents as they were.&quot;";
asv[10] = "So they came and called unto the porter of the city; and they told them, saying, We came to the camp of the Syrians, and, behold, there was no man there, neither voice of man, but the horses tied, and the asses tied, and the tents as they were.";
yng[10] = "And they come in, and call unto the gatekeeper of the city, and declare for themselves, saying, `We have come in unto the camp of Aram, and lo, there is not there a man, or sound of man, but the bound horse, and the bound ass, and tents as they [are].\'";
dby[10] = "And they came and called to the porters of the city, and told them saying, We came to the camp of the Syrians, and behold, there was no one there, no sound of man, but the horses tied, and the asses tied, and the tents as they were.";

kjv[12] = "And the king arose in the night, and said unto his servants, I will now shew you what the Syrians have done to us. They know that we [be] hungry; therefore are they gone out of the camp to hide themselves in the field, saying, When they come out of the city, we shall catch them alive, and get into the city.";
rsv[12] = "And the king rose in the night, and said to his servants, &quot;I will tell you what the Syrians have prepared against us. They know that we are hungry; therefore they have gone out of the camp to hide themselves in the open country, thinking, \'When they come out of the city, we shall take them alive and get into the city.\'&quot;";
asv[12] = "And the king arose in the night, and said unto his servants, I will now show you what the Syrians have done to us. They know that we are hungry; therefore are they gone out of the camp to hide themselves in the field, saying, When they come out of the city, we shall take them alive, and get into the city.";
yng[12] = "And the king riseth by night, and saith unto his servants, `Let me declare, I pray you, to you that which the Aramaeans have done to us; they have known that we are famished, and they are gone out from the camp to be hidden in the field, saying, When they come out from the city, then we catch them alive, and unto the city we enter.\'";
dby[12] = "And the king rose up in the night and said to his servants, Let me tell you what the Syrians have done to us. They know that we are hungry, and they have gone out of the camp to hide themselves in the field, saying, When they come out of the city, we shall catch them alive, and get into the city.";
web[12] = "And the king arose in the night, and said to his servants, I will now show you what the Syrians have done to us. They know that we [are] hungry; therefore they have gone out of the camp, to hide themselves in the field, saying, When they come out of the city, we shall take them alive, and get into the city.";
hnv[12] = "The king arose in the night, and said to his servants, I will now show you what the Aram have done to us. They know that we are hungry; therefore are they gone out of the camp to hide themselves in the field, saying, When they come out of the city, we shall take them alive, and get into the city.";
vul[12] = "qui surrexit nocte et ait ad servos suos dico vobis quid fecerint nobis Syri sciunt quia fame laboramus et idcirco egressi sunt de castris et latitant in agris dicentes cum egressi fuerint de civitate capiemus eos viventes et tunc civitatem ingredi poterimus";
kjv[13] = "And one of his servants answered and said, Let [some] take, I pray thee, five of the horses that remain, which are left in the city, (behold, they [are] as all the multitude of Israel that are left in it: behold, [I say], they [are] even as all the multitude of the Israelites that are consumed:) and let us send and see.";
rsv[13] = "And one of his servants said, &quot;Let some men take five of the remaining horses, seeing that those who are left here will fare like the whole multitude of Israel that have already perished; let us send and see.&quot;";
asv[13] = "And one of his servants answered and said, Let some take, I pray thee, five of the horses that remain, which are left in the city (behold, they are as all the multitude of Israel that are left in it; behold, they are as all the multitude of Israel that are consumed); and let us send and see.";
yng[13] = "And one of his servants answereth and saith, `Then let them take, I pray thee, five of the horses that are left, that have been left in it -- lo, they [are] as all the multitude of Israel who have been left in it; lo, they are as all the multitude of Israel who have been consumed -- and we send and see.\'";
dby[13] = "And one of his servants answered and said, Let some one take, I pray thee, five of the horses that remain, which are left in the city (behold, they are as all the multitude of Israel that are left in it: behold, they are even as all the multitude of the Israelites that have perished), and let us send and see.";
web[13] = "And one of his servants answered and said, Let [some] take, I pray thee, five of the horses that remain, which are left in the city, (behold, they [are] as all the multitude of Israel that are left in it: behold, [I say], they [are] even as all the multitude of the Israelites that are consumed:) and let us send and see.";
hnv[13] = "One of his servants answered, Please let some take five of the horses that remain, which are left in the city (behold, they are as all the multitude of Yisra\'el who are left in it; behold, they are as all the multitude of Yisra\'el who are consumed); and let us send and see.";
vul[13] = "respondit autem unus servorum eius tollamus quinque equos qui remanserunt in urbe quia ipsi tantum sunt in universa multitudine Israhel alii enim consumpti sunt et mittentes explorare poterimus";

yng[14] = "And they take two chariot-horses, and the king sendeth after the camp of Aram, saying, `Go, and see.\'";

hnv[14] = "They took therefore two chariots with horses; and the king sent after the host of the Aram, saying, Go and see.";
vul[14] = "adduxerunt ergo duos equos misitque rex ad castra Syrorum dicens ite videte";

yng[15] = "And they go after them unto the Jordan, and lo, all the way is full of garments and vessels that the Aramaeans have cast away in their haste, and the messengers turn back and declare to the king.";
dby[15] = "And they went after them to the Jordan; and behold, all the way was full of garments and materials, which the Syrians had cast away in their haste. And the messengers returned and told the king.";

asv[17] = "And the king appointed the captain on whose hand he leaned to have the charge of the gate: and the people trod upon him in the gate, and he died as the man of God had said, who spake when the king came down to him.";

kjv[18] = "And it came to pass as the man of God had spoken to the king, saying, Two measures of barley for a shekel, and a measure of fine flour for a shekel, shall be to morrow about this time in the gate of Samaria:";

yng[18] = "yea, it cometh to pass, according to the speaking of the man of God unto the king, saying, `Two measures of barley at a shekel, and a measure of fine flour at a shekel are, at this time to-morrow, in the gate of Samaria;\'";
dby[18] = "And it came to pass as the man of God had spoken to the king saying, Two measures of barley shall be at a shekel, and the measure of fine flour at a shekel, to-morrow about this time in the gate of Samaria.";
