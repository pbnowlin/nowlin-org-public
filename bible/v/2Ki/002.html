csb[1] = "The time had come for the LORD to take Elijah up to heaven in a whirlwind. Elijah and Elisha were traveling from Gilgal,";
csb[2] = "and Elijah said to Elisha, &quot;Stay here; the LORD is sending me on to Bethel.&quot; But Elisha replied, &quot;As the LORD lives and as you yourself live, I will not leave you.&quot; So they went down to Bethel.";
csb[3] = "Then the sons of the prophets who were at Bethel came out to Elisha and said, &quot;Do you know that the LORD will take your master away from you today? &quot; He said, &quot;Yes, I know. Be quiet.&quot;";
csb[4] = "Elijah said to him, &quot;Elisha, stay here; the LORD is sending me to Jericho.&quot; But Elisha said, &quot;As the LORD lives and as you yourself live, I will not leave you.&quot; So they went to Jericho.";
csb[5] = "Then the sons of the prophets who were in Jericho came up to Elisha and said, &quot;Do you know that the LORD will take your master away from you today? &quot; He said, &quot;Yes, I know. Be quiet.&quot;";
csb[6] = "Elijah said to him, &quot;Stay here; the LORD is sending me to the Jordan.&quot; But Elisha said, &quot;As the LORD lives and as you yourself live, I will not leave you.&quot; So the two of them went on.";
csb[7] = "Fifty men from the sons of the prophets came and stood observing them at a distance while the two of them stood by the Jordan.";
csb[8] = "Elijah took his mantle, rolled it up, and struck the water, which parted to the right and left. Then the two of them crossed over on dry ground.";
csb[9] = "When they had crossed over, Elijah said to Elisha, &quot;Tell me what I can do for you before I am taken from you.&quot; So Elisha answered, &quot;Please, let me inherit two shares of your spirit.&quot;";
csb[10] = "Elijah replied, &quot;You have asked for something difficult. If you see me being taken from you, you will have it. If not, you won\'t.&quot;";
csb[11] = "As they continued walking and talking, a chariot of fire with horses of fire suddenly appeared and separated the two of them. Then Elijah went up into heaven in the whirlwind.";
csb[12] = "As Elisha watched, he kept crying out, &quot;My father, my father, the chariots and horsemen of Israel! &quot; When he could see him no longer, he took hold of his own clothes, tore them in two,";
csb[13] = "picked up the mantle that had fallen off Elijah, and went back and stood on the bank of the Jordan.";
csb[14] = "He took the mantle Elijah had dropped, and he struck the water. &quot;Where is the LORD God of Elijah? &quot; he asked. He struck the water himself, and it parted to the right and the left, and Elisha crossed over.";
csb[15] = "When the sons of the prophets from Jericho who were observing saw him, they said, &quot;The spirit of Elijah rests on Elisha.&quot; They came to meet him and bowed down to the ground in front of him.";
csb[16] = "Then the sons of the prophets said to Elisha, &quot;Since there are fifty strong men here with your servants, please let them go and search for your master. Maybe the Spirit of the LORD has carried him away and put him on one of the mountains or into one of the valleys.&quot; He answered, &quot;Don\'t send them.&quot;";
csb[17] = "However, they urged him to the point of embarrassment, so he said, &quot;Send them.&quot; They sent fifty men, who looked for three days but did not find him.";
csb[18] = "When they returned to him in Jericho where he was staying, he said to them, &quot;Didn\'t I tell you not to go? &quot;";
csb[19] = "The men of the city said to Elisha, &quot;My lord can see that even though the city\'s location is good, the water is bad and the land unfruitful.&quot;";
csb[20] = "He replied, &quot;Bring me a new bowl and put salt in it.&quot; After they had brought him one,";
csb[21] = "Elisha went out to the spring, threw salt in it, and said, &quot;This is what the LORD says: \'I have healed this water. No longer will death or unfruitfulness result from it.\' &quot;";
csb[22] = "Therefore, the water still remains healthy today according to the word that Elisha spoke.";
csb[23] = "From there Elisha went up to Bethel. As he was walking up the path, some small boys came out of the city and jeered at him, chanting, &quot;Go up, baldy! Go up, baldy! &quot;";
csb[24] = "He turned around, looked at them, and cursed them in the name of the LORD. Then two female bears came out of the woods and mauled forty-two of the children.";
csb[25] = "From there Elisha went to Mount Carmel, and then he returned to Samaria.";
kjv[1] = "And it came to pass, when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal.";
rsv[1] = "Now when the LORD was about to take Eli\'jah up to heaven by a whirlwind, Eli\'jah and Eli\'sha were on their way from Gilgal.";
asv[1] = "And it came to pass, when Jehovah would take up Elijah by a whirlwind into heaven, that Elijah went with Elisha from Gilgal.";
yng[1] = "And it cometh to pass, at Jehovah\'s taking up Elijah in a whirlwind to the heavens, that Elijah goeth, and Elisha, from Gilgal,";
dby[1] = "And it came to pass when Jehovah would take up Elijah into the heavens by a whirlwind, that Elijah went with Elisha from Gilgal.";
web[1] = "And it came to pass, when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal.";
hnv[1] = "It happened, when the LORD would take up Eliyah by a whirlwind into heaven, that Eliyah went with Elisha from Gilgal.";
vul[1] = "factum est autem cum levare vellet Dominus Heliam per turbinem in caelum ibant Helias et Heliseus de Galgalis";
kjv[2] = "And Elijah said unto Elisha, Tarry here, I pray thee; for the LORD hath sent me to Bethel. And Elisha said [unto him, As] the LORD liveth, and [as] thy soul liveth, I will not leave thee. So they went down to Bethel.";
rsv[2] = "And Eli\'jah said to Eli\'sha, &quot;Tarry here, I pray you; for the LORD has sent me as far as Bethel.&quot; But Eli\'sha said, &quot;As the LORD lives, and as you yourself live, I will not leave you.&quot; So they went down to Bethel.";
asv[2] = "And Elijah said unto Elisha, Tarry here, I pray thee; for Jehovah hath sent me as far as Beth-el. And Elisha said, As Jehovah liveth, and as thy soul liveth, I will not leave thee. So they went down to Beth-el.";
yng[2] = "and Elijah saith unto Elisha, `Abide, I pray thee, here, for Jehovah hath sent me unto Beth-El;\' and Elisha saith, `Jehovah liveth, and thy soul liveth, if I leave thee;\' and they go down to Beth-El.";
dby[2] = "And Elijah said to Elisha, Abide here, I pray thee; for Jehovah has sent me to Bethel. And Elisha said, As Jehovah liveth, and as thy soul liveth, I will not leave thee! So they went down to Bethel.";
web[2] = "And Elijah said to Elisha, Tarry here, I pray thee; for the LORD hath sent me to Beth-el. And Elisha said, [As] the LORD liveth, and [as] thy soul liveth, I will not leave thee. So they went down to Beth-el.";
hnv[2] = " Eliyah said to Elisha, Please wait here, for the LORD has sent me as far as Beit-El. Elisha said, As the LORD lives, and as your soul lives, I will not leave you. So they went down to Beit-El.";
vul[2] = "dixitque Helias ad Heliseum sede hic quia Dominus misit me usque Bethel cui ait Heliseus vivit Dominus et vivit anima tua quia non derelinquam te cumque descendissent Bethel";
kjv[3] = "And the sons of the prophets that [were] at Bethel came forth to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he said, Yea, I know [it]; hold ye your peace.";
rsv[3] = "And the sons of the prophets who were in Bethel came out to Eli\'sha, and said to him, &quot;Do you know that today the LORD will take away your master from over you?&quot; And he said, &quot;Yes, I know it; hold your peace.&quot;";
asv[3] = "And the sons of the prophets that were at Beth-el came forth to Elisha, and said unto him, Knowest thou that Jehovah will take away thy master from thy head to-day? And he said, Yea, I know it; hold ye your peace.";
yng[3] = "And sons of the prophets who [are] in Beth-El come out unto Elisha, and say unto him, `Hast thou known that to-day Jehovah is taking thy lord from thy head?\' and he saith, `I also have known -- keep silent.\'";
dby[3] = "And the sons of the prophets that were at Bethel came forth to Elisha, and said to him, Dost thou know that Jehovah will take away thy master from over thy head to-day? And he said, I also know it: be silent!";
web[3] = "And the sons of the prophets that [were] at Beth-el came forth to Elisha, and said to him, Knowest thou that the LORD will take away thy master from thy head to-day? And he said, Yes, I know [it]; hold ye your peace.";
hnv[3] = "The sons of the prophets who were at Beit-El came forth to Elisha, and said to him, &quot;Do you know that the LORD will take away your master from your head today?&quot; He said, &quot;Yes, I know it; hold your shalom.&quot;";
vul[3] = "egressi sunt filii prophetarum qui erant Bethel ad Heliseum et dixerunt ei numquid nosti quia hodie Dominus tollat dominum tuum a te qui respondit et ego novi silete";

dby[4] = "And Elijah said to him, Elisha, abide here, I pray thee; for Jehovah has sent me to Jericho. And he said, As Jehovah liveth, and as thy soul liveth, I will not leave thee! And they came to Jericho.";
web[4] = "And Elijah said to him, Elisha, tarry here, I pray thee; for the LORD hath sent me to Jericho. And he said, [As] the LORD liveth, and [as] thy soul liveth, I will not leave thee. So they came to Jericho.";

dby[5] = "And the sons of the prophets that were at Jericho drew near to Elisha and said to him, Dost thou know that Jehovah will take away thy master from over thy head to-day? And he said, I also know it: be silent!";

rsv[6] = "Then Eli\'jah said to him, &quot;Tarry here, I pray you; for the LORD has sent me to the Jordan.&quot; But he said, &quot;As the LORD lives, and as you yourself live, I will not leave you.&quot; So the two of them went on.";
asv[6] = "And Elijah said unto him, Tarry here, I pray thee; for Jehovah hath sent me to the Jordan. And he said, As Jehovah liveth, and as thy soul liveth, I will not leave thee. And they two went on.";

kjv[7] = "And fifty men of the sons of the prophets went, and stood to view afar off: and they two stood by Jordan.";

asv[7] = "And fifty men of the sons of the prophets went, and stood over against them afar off: and they two stood by the Jordan.";
yng[7] = "-- and fifty men of the sons of the prophets have gone on, and stand over-against afar off -- and both of them have stood by the Jordan.";
dby[7] = "And fifty men of the sons of the prophets went and stood opposite afar off; and they two stood by the Jordan.";
web[7] = "And fifty men of the sons of the prophets went, and stood to view afar off: and they two stood by Jordan.";
hnv[7] = "Fifty men of the sons of the prophets went, and stood over against them afar off: and they two stood by the Yarden.";
vul[7] = "et quinquaginta viri de filiis prophetarum secuti sunt qui et steterunt e contra longe illi autem ambo stabant super Iordanem";

rsv[8] = "Then Eli\'jah took his mantle, and rolled it up, and struck the water, and the water was parted to the one side and to the other, till the two of them could go over on dry ground.";

dby[8] = "And Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither; and they two went over on dry ground.";

kjv[9] = "And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.";
rsv[9] = "When they had crossed, Eli\'jah said to Eli\'sha, &quot;Ask what I shall do for you, before I am taken from you.&quot; And Eli\'sha said, &quot;I pray you, let me inherit a double share of your spirit.&quot;";
asv[9] = "And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I am taken from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.";
yng[9] = "And it cometh to pass, at their passing over, that Elijah hath said unto Elisha, `Ask, what do I do for thee before I am taken from thee?\' and Elisha saith, `Then let there be, I pray thee, a double portion of thy spirit unto me;\'";
dby[9] = "And it came to pass when they had gone over, that Elijah said to Elisha, Ask what I shall do for thee, before I am taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.";
web[9] = "And it came to pass, when they had gone over, that Elijah said to Elisha, Ask what I shall do for thee, before I am taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.";
hnv[9] = "It happened, when they had gone over, that Eliyah said to Elisha, Ask what I shall do for you, before I am taken from you. Elisha said, please let a double portion of your spirit be on me.";
vul[9] = "cumque transissent Helias dixit ad Heliseum postula quod vis ut faciam tibi antequam tollar a te dixitque Heliseus obsecro ut fiat duplex spiritus tuus in me";
kjv[10] = "And he said, Thou hast asked a hard thing: [nevertheless], if thou see me [when I am] taken from thee, it shall be so unto thee; but if not, it shall not be [so].";

yng[10] = "and he saith, `Thou hast asked a hard thing; if thou dost see me taken from thee, it is to thee so; and if not, it is not.\'";

kjv[11] = "And it came to pass, as they still went on, and talked, that, behold, [there appeared] a chariot of fire, and horses of fire, and parted them both asunder; and Elijah went up by a whirlwind into heaven.";
rsv[11] = "And as they still went on and talked, behold, a chariot of fire and horses of fire separated the two of them. And Eli\'jah went up by a whirlwind into heaven.";
asv[11] = "And it came to pass, as they still went on, and talked, that, behold, [there appeared] a chariot of fire, and horses of fire, which parted them both asunder; and Elijah went up by a whirlwind into heaven.";
yng[11] = "And it cometh to pass, they are going, going on and speaking, and lo, a chariot of fire, and horses of fire, and they separate between them both, and Elijah goeth up in a whirlwind, to the heavens.";
dby[11] = "And it came to pass as they went on, and talked, that behold, a chariot of fire and horses of fire; and they parted them both asunder; and Elijah went up by a whirlwind into the heavens.";

vul[11] = "cumque pergerent et incedentes sermocinarentur ecce currus igneus et equi ignei diviserunt utrumque et ascendit Helias per turbinem in caelum";
kjv[12] = "And Elisha saw [it], and he cried, My father, my father, the chariot of Israel, and the horsemen thereof. And he saw him no more: and he took hold of his own clothes, and rent them in two pieces.";
rsv[12] = "And Eli\'sha saw it and he cried, &quot;My father, my father! the chariots of Israel and its horsemen!&quot; And he saw him no more. Then he took hold of his own clothes and rent them in two pieces.";
asv[12] = "And Elisha saw it, and he cried, My father, my father, the chariots of Israel and the horsemen thereof! And he saw him no more: and he took hold of his own clothes, and rent them in two pieces.";
yng[12] = "And Elisha is seeing, and he is crying, `My father, my father, the chariot of Israel, and its horsemen;\' and he hath not seen him again; and he taketh hold on his garments, and rendeth them into two pieces.";
dby[12] = "And Elisha saw [it], and he cried, My father, my father! the chariot of Israel and the horsemen thereof! And he saw him no more. Then he took hold of his own garments and rent them in two pieces.";

hnv[12] = "Elisha saw it, and he cried, My father, my father, the chariots of Yisra\'el and the horsemen of it! He saw him no more: and he took hold of his own clothes, and tore them in two pieces.";
vul[12] = "Heliseus autem videbat et clamabat pater mi pater mi currus Israhel et auriga eius et non vidit eum amplius adprehenditque vestimenta sua et scidit illa in duas partes";
kjv[13] = "He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of Jordan;";

asv[13] = "He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of the Jordan.";
yng[13] = "And he taketh up the robe of Elijah, that fell from off him, and turneth back and standeth on the edge of the Jordan,";
dby[13] = "And he took up the mantle of Elijah which fell from him, and went back and stood by the bank of the Jordan;";

vul[13] = "et levavit pallium Heliae quod ceciderat ei reversusque stetit super ripam Iordanis";
kjv[14] = "And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where [is] the LORD God of Elijah? and when he also had smitten the waters, they parted hither and thither: and Elisha went over.";
rsv[14] = "Then he took the mantle of Eli\'jah that had fallen from him, and struck the water, saying, &quot;Where is the LORD, the God of Eli\'jah?&quot; And when he had struck the water, the water was parted to the one side and to the other; and Eli\'sha went over.";
asv[14] = "And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where is Jehovah, the God of Elijah? and when he also had smitten the waters, they were divided hither and thither; and Elisha went over.";
yng[14] = "and he taketh the robe of Elijah that fell from off him, and smiteth the waters, and saith, `Where [is] Jehovah, God of Elijah -- even He?\' and he smiteth the waters, and they are halved, hither and thither, and Elisha passeth over.";
dby[14] = "and he took the mantle of Elijah which had fallen from him, and smote the waters, and said, Where is Jehovah, the God of Elijah? He also smote the waters, and they parted hither and thither, and Elisha went over.";
web[14] = "And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where [is] the LORD God of Elijah? And when he also had smitten the waters, they parted hither and thither: and Elisha went over.";
hnv[14] = "He took the mantle of Eliyah that fell from him, and struck the waters, and said, Where is the LORD, the God of Eliyah? and when he also had struck the waters, they were divided here and there; and Elisha went over.";
vul[14] = "et pallio Heliae quod ceciderat ei percussit aquas et dixit ubi est Deus Heliae etiam nunc percussitque aquas et divisae sunt huc atque illuc et transiit Heliseus";
kjv[15] = "And when the sons of the prophets which [were] to view at Jericho saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him.";
rsv[15] = "Now when the sons of the prophets who were at Jericho saw him over against them, they said, &quot;The spirit of Eli\'jah rests on Eli\'sha.&quot; And they came to meet him, and bowed to the ground before him.";
asv[15] = "And when the sons of the prophets that were at Jericho over against him saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him.";
yng[15] = "And they see him -- the sons of the prophets who [are] in Jericho -- over-against, and they say, `Rested hath the spirit of Elijah on Elisha;\' and they come to meet him, and bow themselves to him to the earth,";
dby[15] = "And the sons of the prophets who were at Jericho on the opposite side saw him, and they said, The spirit of Elijah rests on Elisha. And they came to meet him, and bowed themselves to the ground before him,";
web[15] = "And when the sons of the prophets who [were] to view at Jericho, saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him.";
hnv[15] = "When the sons of the prophets who were at Yericho over against him saw him, they said, The spirit of Eliyah does rest on Elisha. They came to meet him, and bowed themselves to the ground before him.";
vul[15] = "videntes autem filii prophetarum qui erant in Hiericho de contra dixerunt requievit spiritus Heliae super Heliseum et venientes in occursum eius adoraverunt eum proni in terram";
kjv[16] = "And they said unto him, Behold now, there be with thy servants fifty strong men; let them go, we pray thee, and seek thy master: lest peradventure the Spirit of the LORD hath taken him up, and cast him upon some mountain, or into some valley. And he said, Ye shall not send.";
rsv[16] = "And they said to him, &quot;Behold now, there are with your servants fifty strong men; pray, let them go, and seek your master; it may be that the Spirit of the LORD has caught him up and cast him upon some mountain or into some valley.&quot; And he said, &quot;You shall not send.&quot;";
asv[16] = "And they said unto him, Behold now, there are with thy servants fifty strong men; let them go, we pray thee, and seek thy master, lest the Spirit of Jehovah hath taken him up, and cast him upon some mountain, or into some valley. And he said, Ye shall not send.";
yng[16] = "and say unto him, `Lo, we pray thee, there are with thy servants fifty men, sons of valour: let them go, we pray thee, and they seek thy lord, lest the Spirit of Jehovah hath taken him up, and doth cast him on one of the hills, or into one of the valleys;\' and he saith, `Ye do not send.\'";
dby[16] = "and said to him, Behold now, there are with thy servants fifty valiant men; let them go, we pray thee, and seek thy master, lest perhaps the Spirit of Jehovah have taken him up, and cast him upon some mountain, or into some ravine. And he said, Ye shall not send.";
web[16] = "And they said to him, Behold now, there are with thy servants fifty strong men; let them go, we pray thee, and seek thy master: lest perhaps the Spirit of the LORD hath taken him up, and cast him upon some mountain, or into some valley. And he said, Ye shall not send.";
hnv[16] = " They said to him, See now, there are with your servants fifty strong men; let them go, we pray you, and seek your master, lest the Spirit of the LORD has taken him up, and cast him on some mountain, or into some valley. He said, You shall not send.";
vul[16] = "dixeruntque illi ecce cum servis tuis sunt quinquaginta viri fortes qui possint ire et quaerere dominum tuum ne forte tulerit eum spiritus Domini et proiecerit in uno montium aut in una vallium qui ait nolite mittere";
kjv[17] = "And when they urged him till he was ashamed, he said, Send. They sent therefore fifty men; and they sought three days, but found him not.";
rsv[17] = "But when they urged him till he was ashamed, he said, &quot;Send.&quot; They sent therefore fifty men; and for three days they sought him but did not find him.";
asv[17] = "And when they urged him till he was ashamed, he said, Send. They sent therefore fifty men; and they sought three days, but found him not.";
yng[17] = "And they press upon him, till he is ashamed, and he saith, `Send ye;\' and they send fifty men, and they seek three days, and have not found him;";
dby[17] = "And they pressed him till he was ashamed, and he said, Send. They sent therefore fifty men, and they sought three days, but did not find him.";
web[17] = "And when they urged him till he was ashamed, he said, Send. They sent therefore fifty men; and they sought three days, but found him not.";
hnv[17] = "When they urged him until he was ashamed, he said, Send. They sent therefore fifty men; and they sought three days, but didn\'t find him.";
vul[17] = "coegeruntque eum donec adquiesceret et diceret mittite et miserunt quinquaginta viros qui cum quaesissent tribus diebus non invenerunt";
kjv[18] = "And when they came again to him, (for he tarried at Jericho,) he said unto them, Did I not say unto you, Go not?";
rsv[18] = "And they came back to him, while he tarried at Jericho, and he said to them, &quot;Did I not say to you, Do not go?&quot;";
asv[18] = "And they came back to him, while he tarried at Jericho; and he said unto them, Did I not say unto you, Go not?";
yng[18] = "and they turn back unto him -- and he is abiding in Jericho -- and he saith unto them, `Did I not say unto you, Do not go?\'";
dby[18] = "And they came again to him (now he was staying at Jericho); and he said to them, Did I not say to you, Go not?";
web[18] = "And when they came again to him, (for he tarried at Jericho,) he said to them, Did I not say to you, Go not?";
hnv[18] = "They came back to him, while he stayed at Yericho; and he said to them, &quot;Didn\'t I tell you, \'Don\'t go?\'&quot;";
vul[18] = "et reversi sunt ad eum at ille habitabat in Hiericho dixitque eis numquid non dixi vobis nolite ire";
kjv[19] = "And the men of the city said unto Elisha, Behold, I pray thee, the situation of this city [is] pleasant, as my lord seeth: but the water [is] naught, and the ground barren.";
rsv[19] = "Now the men of the city said to Eli\'sha, &quot;Behold, the situation of this city is pleasant, as my lord sees; but the water is bad, and the land is unfruitful.&quot;";
asv[19] = "And the men of the city said unto Elisha, Behold, we pray thee, the situation of this city is pleasant, as my lord seeth: but the water is bad, and the land miscarrieth.";
yng[19] = "And the men of the city say unto Elisha, `Lo, we pray thee, the site of the city [is] good, as my lord seeth, and the waters [are] bad, and the earth sterile.\'";
dby[19] = "And the men of the city said to Elisha, Behold now, the situation of the city is good, as my lord sees; but the water is bad, and the land is barren.";
web[19] = "And the men of the city said to Elisha, Behold, I pray thee, the situation of this city [is] pleasant, as my lord seeth: but the water [is] bad, and the ground barren.";
hnv[19] = "The men of the city said to Elisha, Behold, we pray you, the situation of this city is pleasant, as my lord sees: but the water is bad, and the land miscarries.";
vul[19] = "dixerunt quoque viri civitatis ad Heliseum ecce habitatio civitatis huius optima est sicut tu ipse domine perspicis sed aquae pessimae sunt et terra sterilis";
kjv[20] = "And he said, Bring me a new cruse, and put salt therein. And they brought [it] to him.";
rsv[20] = "He said, &quot;Bring me a new bowl, and put salt in it.&quot; So they brought it to him.";
asv[20] = "And he said, Bring me a new cruse, and put salt therein. And they brought it to him.";
yng[20] = "And he saith, `Bring to me a new dish, and place there salt;\' and they bring [it] unto him,";
dby[20] = "And he said, Bring me a new cruse, and put salt in it. And they brought it to him.";
web[20] = "And he said, Bring me a new cruse, and put salt therein. And they brought [it] to him.";
hnv[20] = "He said, Bring me a new jar, and put salt therein. They brought it to him.";
vul[20] = "at ille ait adferte mihi vas novum et mittite in illud sal qui cum adtulissent";
kjv[21] = "And he went forth unto the spring of the waters, and cast the salt in there, and said, Thus saith the LORD, I have healed these waters; there shall not be from thence any more death or barren [land].";
rsv[21] = "Then he went to the spring of water and threw salt in it, and said, &quot;Thus says the LORD, I have made this water wholesome; henceforth neither death nor miscarriage shall come from it.&quot;";
asv[21] = "And he went forth unto the spring of the waters, and cast salt therein, and said, Thus saith Jehovah, I have healed these waters; there shall not be from thence any more death or miscarrying.";
yng[21] = "and he goeth out unto the source of the waters, and casteth there salt, and saith, `Thus said Jehovah, I have given healing to these waters; there is not thence any more death and sterility.\'";
dby[21] = "And he went forth to the source of the waters, and cast the salt in there, and said, Thus saith Jehovah: I have healed these waters: there shall not be from thence any more death or barrenness.";
web[21] = "And he went forth to the spring of the waters, and cast the salt in there, and said, Thus saith the LORD, I have healed these waters; there shall not be from thence any more death or barren [land].";
hnv[21] = "He went forth to the spring of the waters, and cast salt therein, and said, Thus says the LORD, I have healed these waters; there shall not be from there any more death or miscarrying.";
vul[21] = "egressus ad fontem aquarum misit in eum sal et ait haec dicit Dominus sanavi aquas has et non erit ultra in eis mors neque sterilitas";
kjv[22] = "So the waters were healed unto this day, according to the saying of Elisha which he spake.";
rsv[22] = "So the water has been wholesome to this day, according to the word which Eli\'sha spoke.";
asv[22] = "So the waters were healed unto this day, according to the word of Elisha which he spake.";
yng[22] = "And the waters are healed unto this day, according to the word of Elisha, that he spake.";
dby[22] = "And the waters were healed to this day, according to the saying of Elisha which he spoke.";
web[22] = "So the waters were healed to this day, according to the saying of Elisha which he spoke.";
hnv[22] = "So the waters were healed to this day, according to the word of Elisha which he spoke.";
vul[22] = "sanatae sunt ergo aquae usque ad diem hanc iuxta verbum Helisei quod locutus est";
kjv[23] = "And he went up from thence unto Bethel: and as he was going up by the way, there came forth little children out of the city, and mocked him, and said unto him, Go up, thou bald head; go up, thou bald head.";
rsv[23] = "He went up from there to Bethel; and while he was going up on the way, some small boys came out of the city and jeered at him, saying, &quot;Go up, you baldhead! Go up, you baldhead!&quot;";
asv[23] = "And he went up from thence unto Beth-el; and as he was going up by the way, there came forth young lads out of the city, and mocked him, and said unto him, Go up, thou baldhead; go up, thou baldhead.";
yng[23] = "And he goeth up thence to Beth-El, and he is going up in the way, and little youths have come out from the city, and scoff at him, and say to him, `Go up, bald-head! go up, bald-head!\'";
dby[23] = "And he went up from thence to Bethel, and as he went up by the way, there came forth little boys out of the city, and mocked him, and said to him, Go up, bald head; go up, bald head!";
web[23] = "And he went up from thence to Beth-el: and as he was going up by the way, there came forth little children out of the city, and mocked him, and said to him, Go up, thou bald-head; go up, thou bald-head.";
hnv[23] = "He went up from there to Beit-El; and as he was going up by the way, there came forth young lads out of the city, and mocked him, and said to him, Go up, you baldy; go up, you baldhead.";
vul[23] = "ascendit autem inde Bethel cumque ascenderet per viam pueri parvi egressi sunt de civitate et inludebant ei dicentes ascende calve ascende calve";
kjv[24] = "And he turned back, and looked on them, and cursed them in the name of the LORD. And there came forth two she bears out of the wood, and tare forty and two children of them.";
rsv[24] = "And he turned around, and when he saw them, he cursed them in the name of the LORD. And two she-bears came out of the woods and tore forty-two of the boys.";
asv[24] = "And he looked behind him and saw them, and cursed them in the name of Jehovah. And there came forth two she-bears out of the wood, and tare forty and two lads of them.";
yng[24] = "And he looketh behind him, and seeth them, and declareth them vile in the name of Jehovah, and two bears come out of the forest, and rend of them forty and two lads.";
dby[24] = "And he turned back, and looked on them, and cursed them in the name of Jehovah. And there came forth two she-bears out of the wood, and tore forty-two children of them.";
web[24] = "And he turned back, and looked on them, and cursed them in the name of the LORD. And there came forth two she bears out of the wood, and tore forty and two children of them.";
hnv[24] = "He looked behind him and saw them, and cursed them in the name of the LORD. There came forth two she-bears out of the wood, and mauled forty-two lads of them.";
vul[24] = "qui cum se respexisset vidit eos et maledixit eis in nomine Domini egressique sunt duo ursi de saltu et laceraverunt ex eis quadraginta duos pueros";
kjv[25] = "And he went from thence to mount Carmel, and from thence he returned to Samaria.";
rsv[25] = "From there he went on to Mount Carmel, and thence he returned to Sama\'ria.";
asv[25] = "And he went from thence to mount Carmel, and from thence he returned to Samaria.";
yng[25] = "And he goeth thence unto the hill of Carmel, and thence he hath turned back to Samaria.";
dby[25] = "And he went from thence to mount Carmel, and from thence he returned to Samaria.";
web[25] = "And he went from thence to mount Carmel, and from thence he returned to Samaria.";
hnv[25] = "He went from there to Mount Karmel, and from there he returned to Shomron.";
vul[25] = "abiit autem inde in montem Carmeli et inde reversus est Samariam";
