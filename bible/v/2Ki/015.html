csb[1] = "In the twenty-seventh year of Israel\'s King Jeroboam, Azariah son of Amaziah became king of Judah.";
csb[2] = "He was sixteen years old when he became king, and he reigned fifty-two years in Jerusalem. His mother\'s name was Jecoliah; she was from Jerusalem.";
csb[3] = "Azariah did what was right in the LORD\'s sight just as his father Amaziah had done.";
csb[4] = "Yet the high places were not taken away; the people continued sacrificing and burning incense on the high places.";
csb[5] = "The LORD afflicted the king, and he had a serious skin disease until the day of his death. He lived in quarantine, while Jotham, the king\'s son, was over the household governing the people of the land.";
csb[6] = "The rest of the events of Azariah\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[7] = "Azariah rested with his fathers and was buried with his fathers in the city of David. His son Jotham became king in his place.";
csb[8] = "In the thirty-eighth year of Judah\'s King Azariah, Zechariah son of Jeroboam reigned over Israel in Samaria for six months.";
csb[9] = "He did what was evil in the LORD\'s sight as his fathers had done. He did not turn away from the sins Jeroboam son of Nebat had caused Israel to commit.";
csb[10] = "Shallum son of Jabesh conspired against Zechariah. He struck him down publicly, killed him, and became king in his place.";
csb[11] = "As for the rest of the events of Zechariah\'s reign, they are written in the Historical Record of Israel\'s Kings.";
csb[12] = "The word of the LORD that he spoke to Jehu was, &quot;Four generations of your sons will sit on the throne of Israel,&quot; and it was so.";
csb[13] = "In the thirty-ninth year of Judah\'s King Uzziah, Shallum son of Jabesh became king; he reigned in Samaria a full month.";
csb[14] = "Then Menahem son of Gadi came up from Tirzah to Samaria and struck down Shallum son of Jabesh there. He killed him and became king in his place.";
csb[15] = "As for the rest of the events of Shallum\'s reign, along with the conspiracy that he formed, they are written in the Historical Record of Israel\'s Kings.";
csb[16] = "At that time, starting from Tirzah, Menahem attacked Tiphsah, all who were in it, and its territory because they wouldn\'t surrender. He ripped open all the pregnant women.";
csb[17] = "In the thirty-ninth year of Judah\'s King Azariah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.";
csb[18] = "He did what was evil in the LORD\'s sight. Throughout his reign, he did not turn away from the sins Jeroboam son of Nebat had caused Israel to commit.";
csb[19] = "King Pul of Assyria invaded the land, so Menahem gave Pul seventy-five thousand pounds of silver so that Pul would support him to strengthen his grasp on the kingdom.";
csb[20] = "Then Menahem exacted twenty ounces of silver from each of the prominent men of Israel to give to the king of Assyria. So the king of Assyria withdrew and did not stay there in the land.";
csb[21] = "The rest of the events of Menahem\'s reign, along with all his accomplishments, are written in the Historical Record of Israel\'s Kings.";
csb[22] = "Menahem rested with his fathers, and his son Pekahiah became king in his place.";
csb[23] = "In the fiftieth year of Judah\'s King Azariah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.";
csb[24] = "He did what was evil in the LORD\'s sight and did not turn away from the sins Jeroboam son of Nebat had caused Israel to commit.";
csb[25] = "Then his officer, Pekah son of Remaliah, conspired against him and struck him down in Samaria at the citadel of the king\'s palace -- with Argob and Arieh. There were fifty Gileadite men with Pekah. He killed Pekahiah and became king in his place.";
csb[26] = "As for the rest of the events of Pekahiah\'s reign, along with all his accomplishments, they are written in the Historical Record of Israel\'s Kings.";
csb[27] = "In the fifty-second year of Judah\'s King Azariah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.";
csb[28] = "He did what was evil in the LORD\'s sight. He did not turn away from the sins Jeroboam son of Nebat had caused Israel to commit.";
csb[29] = "In the days of King Pekah of Israel, King Tiglath-pileser of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee -- all the land of Naphtali -- and deported the people to Assyria.";
csb[30] = "Then Hoshea son of Elah organized a conspiracy against Pekah son of Remaliah. He attacked him, killed him, and became king in his place in the twentieth year of Jotham son of Uzziah.";
csb[31] = "As for the rest of the events of Pekah\'s reign, along with all his accomplishments, they are written in the Historical Record of Israel\'s Kings.";
csb[32] = "In the second year of Israel\'s King Pekah son of Remaliah, Jotham son of Uzziah became king of Judah.";
csb[33] = "He was twenty-five years old when he became king, and he reigned sixteen years in Jerusalem. His mother\'s name was Jerusha daughter of Zadok.";
csb[34] = "He did what was right in the LORD\'s sight just as his father Uzziah had done.";
csb[35] = "Yet the high places were not taken away; the people continued sacrificing and burning incense on the high places. Jotham built the Upper Gate of the LORD\'s temple.";
csb[36] = "The rest of the events of Jotham\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings.";
csb[37] = "In those days the LORD began sending Aram\'s King Rezin and Pekah son of Remaliah against Judah.";
csb[38] = "Jotham rested with his fathers and was buried with his fathers in the city of his ancestor David. His son Ahaz became king in his place.";
