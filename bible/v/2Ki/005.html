csb[1] = "Naaman, commander of the army for the king of Aram, was a man important to his master and highly regarded because through him, the LORD had given victory to Aram. The man was a valiant warrior, but he had a skin disease.";
csb[2] = "Aram had gone on raids and brought back from the land of Israel a young girl who served Naaman\'s wife.";
csb[3] = "She said to her mistress, &quot;If only my master were with the prophet who is in Samaria, he would cure him of his skin disease.&quot;";
csb[4] = "So Naaman went and told his master what the girl from the land of Israel had said.";
csb[5] = "Therefore, the king of Aram said, &quot;Go, and I will send a letter with you to the king of Israel.&quot; So he went and took with him 750 pounds of silver, 150 pounds of gold, and ten sets of clothing.";
csb[6] = "He brought the letter to the king of Israel, and it read: When this letter comes to you, note that I have sent you my servant Naaman for you to cure him of his skin disease.";
csb[7] = "When the king of Israel read the letter, he tore his clothes and asked, &quot;Am I God, killing and giving life that this man expects me to cure a man of his skin disease? Recognize that he is only picking a fight with me.&quot;";
csb[8] = "When Elisha the man of God heard that the king of Israel had torn his clothes, he sent a message to the king, &quot;Why have you torn your clothes? Have him come to me, and he will know there is a prophet in Israel.&quot;";
csb[9] = "So Naaman came with his horses and chariots and stood at the door of Elisha\'s house.";
csb[10] = "Then Elisha sent him a messenger, who said, &quot;Go wash seven times in the Jordan and your skin will be restored and you will be clean.&quot;";
csb[11] = "But Naaman got angry and left, saying, &quot;I was telling myself: He will surely come out, stand and call on the name of the LORD his God, and wave his hand over the place and cure the skin disease.";
csb[12] = "&quot;Aren\'t Abana and Pharpar, the rivers of Damascus, better than all the waters of Israel? Couldn\'t I wash in them and be clean? &quot; So he turned and left in a rage.";
csb[13] = "But his servants approached and said to him, &quot;My father, if the prophet had told you to do some great thing, would you not have done it? How much more should you do it when he only tells you, \'Wash and be clean\'? &quot;";
csb[14] = "So Naaman went down and dipped himself in the Jordan seven times, according to the command of the man of God. Then his skin was restored and became like the skin of a small boy, and he was clean.";
csb[15] = "Then Naaman and his whole company went back to the man of God, stood before him, and declared, &quot;I know there\'s no God in the whole world except in Israel. Therefore, please accept a gift from your servant.&quot;";
csb[16] = "But Elisha said, &quot;As the LORD lives, in whose presence I stand, I will not accept it.&quot; Naaman urged him to accept it, but he refused.";
csb[17] = "Naaman responded, &quot;If not, please let your servant be given as much soil as a pair of mules can carry, for your servant will no longer offer a burnt offering or a sacrifice to any other god but the LORD.";
csb[18] = "&quot;However, in a particular matter may the LORD pardon your servant: When my master, the king of Aram, goes into the temple of Rimmon to bow in worship while he is leaning on my arm, and I have to bow in the temple of Rimmon -- when I bow in the temple of Rimmon, may the LORD pardon your servant in this matter.&quot;";
csb[19] = "So he said to him, &quot;Go in peace.&quot; After Naaman had traveled a short distance from Elisha,";
csb[20] = "Gehazi, the attendant of Elisha the man of God, thought, &quot;My master has let this Aramean Naaman off lightly by not accepting from him what he brought. As the LORD lives, I will run after him and get something from him.&quot;";
csb[21] = "So Gehazi pursued Naaman. When Naaman saw someone running after him, he got down from the chariot to meet him and asked, &quot;Is everything all right? &quot;";
csb[22] = "Gehazi said, &quot;It\'s all right. My master has sent me to say, \'I have just now discovered that two young men from the sons of the prophets have come to me from the hill country of Ephraim. Please give them seventy-five pounds of silver and two sets of clothing.\' &quot;";
csb[23] = "But Naaman insisted, &quot;Please, accept one hundred fifty pounds.&quot; He urged Gehazi and then packed one hundred fifty pounds of silver in two bags with two sets of clothing. Naaman gave them to two of his attendants who carried them ahead of Gehazi.";
csb[24] = "When Gehazi came to the hill, he took the gifts from them and deposited them in the house. Then he dismissed the men, and they left.";
csb[25] = "Gehazi came and stood by his master. &quot;Where did you go, Gehazi? &quot; Elisha asked him. He replied, &quot;Your servant didn\'t go anywhere.&quot;";
csb[26] = "&quot;And my heart didn\'t go when the man got down from his chariot to meet you,&quot; Elisha said. &quot;Is this a time to accept silver and clothing, olive orchards and vineyards, flocks and herds, and male and female slaves?";
csb[27] = "&quot;Therefore, Naaman\'s skin disease will cling to you and your descendants forever.&quot; So Gehazi went out from his presence diseased, resembling snow.";
kjv[1] = "Now Naaman, captain of the host of the king of Syria, was a great man with his master, and honourable, because by him the LORD had given deliverance unto Syria: he was also a mighty man in valour, [but he was] a leper.";
kjv[2] = "And the Syrians had gone out by companies, and had brought away captive out of the land of Israel a little maid; and she waited on Naaman\'s wife.";
kjv[3] = "And she said unto her mistress, Would God my lord [were] with the prophet that [is] in Samaria! for he would recover him of his leprosy.";
kjv[4] = "And [one] went in, and told his lord, saying, Thus and thus said the maid that [is] of the land of Israel.";
kjv[5] = "And the king of Syria said, Go to, go, and I will send a letter unto the king of Israel. And he departed, and took with him ten talents of silver, and six thousand [pieces] of gold, and ten changes of raiment.";
kjv[6] = "And he brought the letter to the king of Israel, saying, Now when this letter is come unto thee, behold, I have [therewith] sent Naaman my servant to thee, that thou mayest recover him of his leprosy.";
kjv[7] = "And it came to pass, when the king of Israel had read the letter, that he rent his clothes, and said, [Am] I God, to kill and to make alive, that this man doth send unto me to recover a man of his leprosy? wherefore consider, I pray you, and see how he seeketh a quarrel against me.";
kjv[8] = "And it was [so], when Elisha the man of God had heard that the king of Israel had rent his clothes, that he sent to the king, saying, Wherefore hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel.";
kjv[9] = "So Naaman came with his horses and with his chariot, and stood at the door of the house of Elisha.";
kjv[10] = "And Elisha sent a messenger unto him, saying, Go and wash in Jordan seven times, and thy flesh shall come again to thee, and thou shalt be clean.";
kjv[11] = "But Naaman was wroth, and went away, and said, Behold, I thought, He will surely come out to me, and stand, and call on the name of the LORD his God, and strike his hand over the place, and recover the leper.";
kjv[12] = "[Are] not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage.";
kjv[13] = "And his servants came near, and spake unto him, and said, My father, [if] the prophet had bid thee [do some] great thing, wouldest thou not have done [it]? how much rather then, when he saith to thee, Wash, and be clean?";
kjv[14] = "Then went he down, and dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like unto the flesh of a little child, and he was clean.";
kjv[15] = "And he returned to the man of God, he and all his company, and came, and stood before him: and he said, Behold, now I know that [there is] no God in all the earth, but in Israel: now therefore, I pray thee, take a blessing of thy servant.";
kjv[16] = "But he said, [As] the LORD liveth, before whom I stand, I will receive none. And he urged him to take [it]; but he refused.";
kjv[17] = "And Naaman said, Shall there not then, I pray thee, be given to thy servant two mules\' burden of earth? for thy servant will henceforth offer neither burnt offering nor sacrifice unto other gods, but unto the LORD.";
kjv[18] = "In this thing the LORD pardon thy servant, [that] when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand, and I bow myself in the house of Rimmon: when I bow down myself in the house of Rimmon, the LORD pardon thy servant in this thing.";
kjv[19] = "And he said unto him, Go in peace. So he departed from him a little way.";
kjv[20] = "But Gehazi, the servant of Elisha the man of God, said, Behold, my master hath spared Naaman this Syrian, in not receiving at his hands that which he brought: but, [as] the LORD liveth, I will run after him, and take somewhat of him.";
kjv[21] = "So Gehazi followed after Naaman. And when Naaman saw [him] running after him, he lighted down from the chariot to meet him, and said, [Is] all well?";
kjv[22] = "And he said, All [is] well. My master hath sent me, saying, Behold, even now there be come to me from mount Ephraim two young men of the sons of the prophets: give them, I pray thee, a talent of silver, and two changes of garments.";
kjv[23] = "And Naaman said, Be content, take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of garments, and laid [them] upon two of his servants; and they bare [them] before him.";
kjv[24] = "And when he came to the tower, he took [them] from their hand, and bestowed [them] in the house: and he let the men go, and they departed.";
kjv[25] = "But he went in, and stood before his master. And Elisha said unto him, Whence [comest thou], Gehazi? And he said, Thy servant went no whither.";
kjv[26] = "And he said unto him, Went not mine heart [with thee], when the man turned again from his chariot to meet thee? [Is it] a time to receive money, and to receive garments, and oliveyards, and vineyards, and sheep, and oxen, and menservants, and maidservants?";
kjv[27] = "The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever. And he went out from his presence a leper [as white] as snow.";
rsv[1] = "Na\'aman, commander of the army of the king of Syria, was a great man with his master and in high favor, because by him the LORD had given victory to Syria. He was a mighty man of valor, but he was a leper.";
asv[1] = "Now Naaman, captain of the host of the king of Syria, was a great man with his master, and honorable, because by him Jehovah had given victory unto Syria: he was also a mighty man of valor, [but he was] a leper.";
yng[1] = "And Naaman, head of the host of the king of Aram, was a great man before his lord, and accepted of face, for by him had Jehovah given salvation to Aram, and the man was mighty in valour -- leprous.";
dby[1] = "And Naaman, captain of the host of the king of Syria, was a great man before his master, and honourable, for by him Jehovah had given deliverance to Syria; and he was a mighty man of valour, [but] a leper.";
web[1] = "Now Naaman, captain of the army of the king of Syria, was a great man with his master, and honorable, because by him the LORD had given deliverance to Syria: he was also a mighty man in valor, [but he was] a leper.";
hnv[1] = "Now Na`aman, captain of the host of the king of Aram, was a great man with his master, and honorable, because by him the LORD had given victory to Aram: he was also a mighty man of valor, [but he was] a leper.";
vul[1] = "Naaman princeps militiae regis Syriae erat vir magnus apud dominum suum et honoratus per illum enim dedit Dominus salutem Syriae erat autem vir fortis et dives sed leprosus";
rsv[2] = "Now the Syrians on one of their raids had carried off a little maid from the land of Israel, and she waited on Na\'aman\'s wife.";
asv[2] = "And the Syrians had gone out in bands, and had brought away captive out of the land of Israel a little maiden; and she waited on Naaman\'s wife.";
yng[2] = "And the Aramaeans have gone out [by] troops, and they take captive out of the land of Israel a little damsel, and she is before the wife of Naaman,";
dby[2] = "And the Syrians had gone out in bands, and had brought away captive out of the land of Israel a little maid; and she waited on Naaman\'s wife.";
web[2] = "And the Syrians had gone out by companies, and had brought away captive out of the land of Israel a little maid; and she waited on Naaman\'s wife.";
hnv[2] = "The Aram had gone out in bands, and had brought away captive out of Eretz-Yisra\'el a little maiden; and she waited on Na`aman\'s wife.";
vul[2] = "porro de Syria egressi fuerant latrunculi et captivam duxerant de terra Israhel puellam parvulam quae erat in obsequio uxoris Naaman";
rsv[3] = "She said to her mistress, &quot;Would that my lord were with the prophet who is in Sama\'ria! He would cure him of his leprosy.&quot;";
asv[3] = "And she said unto her mistress, Would that my lord were with the prophet that is in Samaria! then would he recover him of his leprosy.";
yng[3] = "and she saith unto her mistress, `O that my lord [were] before the prophet who [is] in Samaria; then he doth recover him from his leprosy.\'";
dby[3] = "And she said to her mistress, Oh, would that my lord were before the prophet that is in Samaria! then he would cure him of his leprosy.";
web[3] = "And she said to her mistress, I would that my lord [were] with the prophet that [is] in Samaria! for he would recover him of his leprosy.";
hnv[3] = "She said to her mistress, Would that my lord were with the prophet who is in Shomron! then would he recover him of his leprosy.";
vul[3] = "quae ait ad dominam suam utinam fuisset dominus meus ad prophetam qui est in Samaria profecto curasset eum a lepra quam habet";
rsv[4] = "So Na\'aman went in and told his lord, &quot;Thus and so spoke the maiden from the land of Israel.&quot;";
asv[4] = "And one went in, and told his lord, saying, Thus and thus said the maiden that is of the land of Israel.";
yng[4] = "And [one] goeth in and declareth to his lord, saying, `Thus and thus she hath spoken, the damsel who [is] from the land of Israel.\'";
dby[4] = "And he went and told his lord saying, Thus and thus said the maid that is of the land of Israel.";
web[4] = "And [one] went in, and told his lord, saying, Thus and thus said the maid that [is] of the land of Israel.";
hnv[4] = "One went in, and told his lord, saying, Thus and thus said the maiden who is of Eretz-Yisra\'el.";
vul[4] = "ingressus est itaque Naaman ad dominum suum et nuntiavit ei dicens sic et sic locuta est puella de terra Israhel";
rsv[5] = "And the king of Syria said, &quot;Go now, and I will send a letter to the king of Israel.&quot; So he went, taking with him ten talents of silver, six thousand shekels of gold, and ten festal garments.";
asv[5] = "And the king of Syria said, Go now, and I will send a letter unto the king of Israel. And he departed, and took with him ten talents of silver, and six thousand [pieces] of gold, and ten changes of raiment.";
yng[5] = "And the king of Aram saith, `Go thou, enter, and I send a letter unto the king of Israel;\' and he goeth and taketh in his hand ten talents of silver, and six thousand [pieces] of gold, and ten changes of garments.";
dby[5] = "And the king of Syria said, Well! go, and I will send a letter to the king of Israel. And he departed, and took with him ten talents of silver, and six thousand [shekels] of gold, and ten changes of raiment.";
web[5] = "And the king of Syria said, Come, go, and I will send a letter to the king of Israel. And he departed, and took with him ten talents of silver, and six thousand [pieces] of gold, and ten changes of raiment.";
hnv[5] = "The king of Aram said, Go now, and I will send a letter to the king of Yisra\'el. He departed, and took with him ten talents of silver, and six thousand [pieces] of gold, and ten changes of clothing.";
vul[5] = "dixitque ei rex Syriae vade et mittam litteras ad regem Israhel qui cum profectus esset et tulisset secum decem talenta argenti et sex milia aureos et decem mutatoria vestimentorum";
rsv[6] = "And he brought the letter to the king of Israel, which read, &quot;When this letter reaches you, know that I have sent to you Na\'aman my servant, that you may cure him of his leprosy.&quot;";
asv[6] = "And he brought the letter to the king of Israel, saying, And now when this letter is come unto thee, behold, I have sent Naaman my servant to thee, that thou mayest recover him of his leprosy.";
yng[6] = "And he bringeth in the letter unto the king of Israel, saying, `And now, at the coming in of this letter unto thee, lo, I have sent unto thee Naaman my servant, and thou hast recovered him from his leprosy.\'";
dby[6] = "And he brought the letter to the king of Israel, saying, And now, when this letter comes to thee, behold, I have sent Naaman my servant to thee, that thou mayest cure him of his leprosy.";
web[6] = "And he brought the letter to the king of Israel, saying, Now when this letter hath come to thee, behold, I have [with this] sent Naaman my servant to thee, that thou mayest recover him of his leprosy.";
hnv[6] = "He brought the letter to the king of Yisra\'el, saying, Now when this letter is come to you, behold, I have sent Na`aman my servant to you, that you may recover him of his leprosy.";
vul[6] = "detulit litteras ad regem Israhel in haec verba cum acceperis epistulam hanc scito quod miserim ad te Naaman servum meum ut cures eum a lepra sua";
rsv[7] = "And when the king of Israel read the letter, he rent his clothes and said, &quot;Am I God, to kill and to make alive, that this man sends word to me to cure a man of his leprosy? Only consider, and see how he is seeking a quarrel with me.&quot;";
asv[7] = "And it came to pass, when the king of Israel had read the letter, that he rent his clothes, and said, Am I God, to kill and to make alive, that this man doth send unto me to recover a man of his leprosy? but consider, I pray you, and see how he seeketh a quarrel against me.";
yng[7] = "And it cometh to pass, at the king of Israel\'s reading the letter, that he rendeth his garments, and saith, `Am I God, to put to death and to keep alive, that this [one] is sending unto me to recover a man from his leprosy? for surely know, I pray you, and see, for he is presenting himself to me.\'";
dby[7] = "And it came to pass when the king of Israel had read the letter, that he rent his garments, and said, Am I God, to kill and to make alive, that this man sends to me to cure a man of his leprosy? Wherefore consider, I pray you, and see how he seeks an occasion against me.";
web[7] = "And it came to pass, when the king of Israel had read the letter, that he rent his clothes, and said, [Am] I God, to kill and to make alive, that this man doth send to me to recover a man of his leprosy? wherefore consider, I pray you, and see how he seeketh a quarrel against me.";
hnv[7] = "It happened, when the king of Yisra\'el had read the letter, that he tore his clothes, and said, Am I God, to kill and to make alive, that this man does send to me to recover a man of his leprosy? but consider, I pray you, and see how he seeks a quarrel against me.";
vul[7] = "cumque legisset rex Israhel litteras scidit vestimenta sua et ait numquid Deus sum ut occidere possim et vivificare quia iste misit ad me ut curem hominem a lepra sua animadvertite et videte quod occasiones quaerat adversum me";
rsv[8] = "But when Eli\'sha the man of God heard that the king of Israel had rent his clothes, he sent to the king, saying, &quot;Why have you rent your clothes? Let him come now to me, that he may know that there is a prophet in Israel.&quot;";
asv[8] = "And it was so, when Elisha the man of God heard that the king of Israel had rent his clothes, that he sent to the king, saying, Wherefore hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel.";
yng[8] = "And it cometh to pass, at Elisha the man of God\'s hearing that the king of Israel hath rent his garments, that he sendeth unto the king, saying, `Why hast thou rent thy garments? let him come, I pray thee, unto me, and he doth know that there is a prophet in Israel.\'";
dby[8] = "And it was so, when Elisha the man of God had heard that the king of Israel had rent his garments, that he sent to the king, saying, Why hast thou rent thy garments? let him come now to me, and he shall know that there is a prophet in Israel.";
web[8] = "And it was [so], when Elisha the man of God had heard that the king of Israel had rent his clothes, that he sent to the king, saying, Why hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel.";
hnv[8] = "It was so, when Elisha the man of God heard that the king of Yisra\'el had torn his clothes, that he sent to the king, saying, Why have you torn your clothes? let him come now to me, and he shall know that there is a prophet in Yisra\'el.";
vul[8] = "quod cum audisset Heliseus vir Dei scidisse videlicet regem Israhel vestimenta sua misit ad eum dicens quare scidisti vestimenta tua veniat ad me et sciat esse prophetam in Israhel";
rsv[9] = "So Na\'aman came with his horses and chariots, and halted at the door of Eli\'sha\'s house.";

dby[9] = "And Naaman came with his horses and with his chariot, and stood at the doorway of the house of Elisha.";

hnv[9] = "So Na`aman came with his horses and with his chariots, and stood at the door of the house of Elisha.";

rsv[10] = "And Eli\'sha sent a messenger to him, saying, &quot;Go and wash in the Jordan seven times, and your flesh shall be restored, and you shall be clean.&quot;";
asv[10] = "And Elisha sent a messenger unto him, saying, Go and wash in the Jordan seven times, and thy flesh shall come again to thee, and thou shalt be clean.";
yng[10] = "and Elisha sendeth unto him a messenger, saying, `Go, and thou hast washed seven times in Jordan, and thy flesh doth turn back to thee -- and be thou clean.";

hnv[10] = "Elisha sent a messenger to him, saying, Go and wash in the Yarden seven times, and your flesh shall come again to you, and you shall be clean.";

rsv[11] = "But Na\'aman was angry, and went away, saying, &quot;Behold, I thought that he would surely come out to me, and stand, and call on the name of the LORD his God, and wave his hand over the place, and cure the leper.";

vul[11] = "iratus Naaman recedebat dicens putabam quod egrederetur ad me et stans invocaret nomen Domini Dei sui et tangeret manu sua locum leprae et curaret me";
rsv[12] = "Are not Aba\'na and Pharpar, the rivers of Damascus, better than all the waters of Israel? Could I not wash in them, and be clean?&quot; So he turned and went away in a rage.";
asv[12] = "Are not Abanah and Pharpar, the rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage.";
yng[12] = "Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? do I not wash in them and I have been clean?\' and he turneth and goeth on in fury.";

web[12] = "[Are] not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage.";
hnv[12] = "Aren\'t Amanah and Parpar, the rivers of Dammesek, better than all the waters of Yisra\'el? may I not wash in them, and be clean? So he turned and went away in a rage.";
vul[12] = "numquid non meliores sunt Abana et Pharphar fluvii Damasci omnibus aquis Israhel ut laver in eis et munder cum ergo vertisset se et abiret indignans";
rsv[13] = "But his servants came near and said to him, &quot;My father, if the prophet had commanded you to do some great thing, would you not have done it? How much rather, then, when he says to you, \'Wash, and be clean\'?&quot;";
asv[13] = "And his servants came near, and spake unto him, and said, My father, if the prophet had bid thee do some great thing, wouldest thou not have done it? how much rather then, when he saith to thee, Wash, and be clean?";
yng[13] = "And his servants come nigh, and speak unto him, and say, `My father, a great thing had the prophet spoken unto thee -- dost thou not do [it]? and surely, when he hath said unto thee, Wash, and be clean.\'";
dby[13] = "And his servants drew near, and spoke to him and said, My father, [if] the prophet had bidden thee [do some] great thing, wouldest thou not have done it? how much rather then, when he says to thee, Wash and be clean?";
web[13] = "And his servants came near, and spoke to him, and said, My father, [if] the prophet had bid thee [do some] great thing, wouldst thou not have done [it]? how much rather then, when he saith to thee, Wash, and be clean?";
hnv[13] = "His servants came near, and spoke to him, and said, My father, if the prophet had bid you do some great thing, wouldn\'t you have done it? how much rather then, when he says to you, Wash, and be clean?";
vul[13] = "accesserunt ad eum servi sui et locuti sunt ei pater si rem grandem dixisset tibi propheta certe facere debueras quanto magis quia nunc dixit tibi lavare et mundaberis";
rsv[14] = "So he went down and dipped himself seven times in the Jordan, according to the word of the man of God; and his flesh was restored like the flesh of a little child, and he was clean.";
asv[14] = "Then went he down, and dipped [himself] seven times in the Jordan, according to the saying of the man of God; and his flesh came again like unto the flesh of a little child, and he was clean.";
yng[14] = "And he goeth down and dippeth in Jordan seven times, according to the word of the man of God, and his flesh doth turn back as the flesh of a little youth, and is clean.";
dby[14] = "Then he went down, and plunged himself seven times in the Jordan, according to the saying of the man of God. And his flesh became again like the flesh of a little child, and he was clean.";
web[14] = "Then he went down, and dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like the flesh of a little child, and he was clean.";
hnv[14] = "Then went he down, and dipped [himself] seven times in the Yarden, according to the saying of the man of God; and his flesh came again like the flesh of a little child, and he was clean.";
vul[14] = "descendit et lavit in Iordane septies iuxta sermonem viri Dei et restituta est caro eius sicut caro pueri parvuli et mundatus est";
rsv[15] = "Then he returned to the man of God, he and all his company, and he came and stood before him; and he said, &quot;Behold, I know that there is no God in all the earth but in Israel; so accept now a present from your servant.&quot;";
asv[15] = "And he returned to the man of God, he and all his company, and came, and stood before him; and he said, Behold now, I know that there is no God in all the earth, but in Israel: now therefore, I pray thee, take a present of thy servant.";
yng[15] = "And he turneth back unto the man of God, he and all his camp, and cometh in, and standeth before him, and saith, `Lo, I pray thee, I have known that there is not a God in all the earth except in Israel; and now, take, I pray thee, a blessing from thy servant.\'";
dby[15] = "And he returned to the man of God, he and all his company, and came and stood before him; and he said, Behold, I know that there is no God in all the earth but in Israel; and now, I pray thee, take a present of thy servant.";
web[15] = "And he returned to the man of God, he and all his company, and came and stood before him: and he said, Behold, now I know that [there is] no God in all the earth, but in Israel: now therefore, I pray thee, take a blessing from thy servant.";
hnv[15] = "He returned to the man of God, he and all his company, and came, and stood before him; and he said, See now, I know that there is no God in all the eretz, but in Yisra\'el: now therefore, please take a present from your servant.";
vul[15] = "reversusque ad virum Dei cum universo comitatu suo venit et stetit coram eo et ait vere scio quod non sit Deus in universa terra nisi tantum in Israhel obsecro itaque ut accipias benedictionem a servo tuo";
rsv[16] = "But he said, &quot;As the LORD lives, whom I serve, I will receive none.&quot; And he urged him to take it, but he refused.";
asv[16] = "But he said, As Jehovah liveth, before whom I stand, I will receive none. And he urged him to take it; but he refused.";
yng[16] = "And he saith, `Jehovah liveth, before whom I have stood -- if I take [it];\' and he presseth on him to take, and he refuseth.";
dby[16] = "But he said, As Jehovah liveth, before whom I stand, I will receive none! And he urged him to take it; but he refused.";
web[16] = "But he said, [As] the LORD liveth, before whom I stand, I will receive none. And he urged him to take [it]; but he refused.";
hnv[16] = "But he said, As the LORD lives, before whom I stand, I will receive none. He urged him to take it; but he refused.";
vul[16] = "at ille respondit vivit Dominus ante quem sto quia non accipiam cumque vim faceret penitus non adquievit";
rsv[17] = "Then Na\'aman said, &quot;If not, I pray you, let there be given to your servant two mules\' burden of earth; for henceforth your servant will not offer burnt offering or sacrifice to any god but the LORD.";
asv[17] = "And Naaman said, If not, yet, I pray thee, let there be given to thy servant two mules\' burden of earth; for thy servant will henceforth offer neither burnt-offering nor sacrifice unto other gods, but unto Jehovah.";
yng[17] = "And Naaman saith, `If not -- let be given, I pray thee, to thy servant, a couple of mules\' burden of earth, for thy servant doth make no more burnt-offering and sacrifice to other gods, but to Jehovah.";
dby[17] = "And Naaman said, If not, then let there, I pray thee, be given to thy servant two mules\' burden of [this] earth; for thy servant will no more offer burnt-offering and sacrifice to other gods, but to Jehovah.";
web[17] = "And Naaman said, Shall there not then, I pray thee, be given to thy servant two mules burden of earth? for thy servant will henceforth offer neither burnt-offering nor sacrifice to other gods, but to the LORD.";
hnv[17] = "Na`aman said, If not, yet, please let there be given to your servant two mules\' burden of eretz; for your servant will henceforth offer neither burnt offering nor sacrifice to other gods, but to the LORD.";
vul[17] = "dixitque Naaman ut vis sed obsecro concede mihi servo tuo ut tollam onus duorum burdonum de terra non enim faciet ultra servus tuus holocaustum aut victimam diis alienis nisi Domino";
rsv[18] = "In this matter may the LORD pardon your servant: when my master goes into the house of Rimmon to worship there, leaning on my arm, and I bow myself in the house of Rimmon, when I bow myself in the house of Rimmon, the LORD pardon your servant in this matter.&quot;";
asv[18] = "In this thing Jehovah pardon thy servant: when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand, and I bow myself in the house of Rimmon, when I bow myself in the house of Rimmon, Jehovah pardon thy servant in this thing.";
yng[18] = "For this thing Jehovah be propitious to thy servant, in the coming in of my lord into the house of Rimmon to bow himself there, and he was supported by my hand, and I bowed myself [in] the house of Rimmon; for my bowing myself in the house of Rimmon Jehovah be propitious, I pray thee, to thy servant in this thing.\'";
dby[18] = "In this thing Jehovah pardon thy servant: when my master goes into the house of Rimmon to bow down there, and he leans on my hand, and I bow down myself in the house of Rimmon -- when I bow down myself in the house of Rimmon, Jehovah pardon thy servant, I pray thee, in this thing.";
web[18] = "In this thing the LORD pardon thy servant, [that] when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand, and I bow myself in the house of Rimmon: when I bow down myself in the house of Rimmon, the LORD pardon thy servant in this thing.";
hnv[18] = "In this thing the LORD pardon your servant: when my master goes into the house of Rimmon to worship there, and he leans on my hand, and I bow myself in the house of Rimmon, when I bow myself in the house of Rimmon, the LORD pardon your servant in this thing.";
vul[18] = "hoc autem solum est de quo depreceris Dominum pro servo tuo quando ingreditur dominus meus templum Remmon ut adoret et illo innitente super manum meam si adoravero in templo Remmon adorante me in eodem loco ut ignoscat mihi Dominus servo tuo pro hac re";
rsv[19] = "He said to him, &quot;Go in peace.&quot; But when Na\'aman had gone from him a short distance,";
asv[19] = "And he said unto him, Go in peace. So he departed from him a little way.";
yng[19] = "And he saith to him, `Go in peace.\' And he goeth from him a kibrath of land,";
dby[19] = "And he said to him, Go in peace. And he departed from him a little way.";
web[19] = "And he said to him, Go in peace. So he departed from him a little way.";
hnv[19] = "He said to him, Go in shalom. So he departed from him a little way.";
vul[19] = "qui dixit ei vade in pace abiit ergo ab eo electo terrae tempore";
rsv[20] = "Geha\'zi, the servant of Eli\'sha the man of God, said, &quot;See, my master has spared this Na\'aman the Syrian, in not accepting from his hand what he brought. As the LORD lives, I will run after him, and get something from him.&quot;";
asv[20] = "But Gehazi the servant of Elisha the man of God, said, Behold, my master hath spared this Naaman the Syrian, in not receiving at his hands that which he brought: as Jehovah liveth, I will run after him, and take somewhat of him.";
yng[20] = "And Gehazi, servant of Elisha the man of God, saith, `Lo, my lord hath spared Naaman this Aramaean, not to receive from his hand that which he brought; Jehovah liveth; surely if I have run after him, then I have taken from him something.\'";
dby[20] = "And Gehazi, the servant of Elisha the man of God, said, Behold, my master has spared Naaman, this Syrian, in not receiving at his hands that which he brought; but as Jehovah liveth, I will run after him and take somewhat of him.";
web[20] = "But Gehazi, the servant of Elisha the man of God, said, Behold, my master hath spared Naaman this Syrian, in not receiving at his hands that which he brought: but [as] the LORD liveth, I will run after him, and take somewhat from him.";
hnv[20] = " But Gechazi the servant of Elisha the man of God, said, Behold, my master has spared this Na`aman the Arammian, in not receiving at his hands that which he brought: as the LORD lives, I will run after him, and take somewhat of him.";
vul[20] = "dixitque Giezi puer viri Dei pepercit dominus meus Naaman Syro isti ut non acciperet ab eo quae adtulit vivit Dominus quia curram post eum et accipiam ab eo aliquid";
rsv[21] = "So Geha\'zi followed Na\'aman. And when Na\'aman saw some one running after him, he alighted from the chariot to meet him, and said, &quot;Is all well?&quot;";
asv[21] = "So Gehazi followed after Naaman. And when Naaman saw one running after him, he alighted from the chariot to meet him, and said, Is all well?";
yng[21] = "And Gehazi pursueth after Naaman, and Naaman seeth one running after him, and alighteth from off the chariot to meet him, and saith, `Is there peace?\'";
dby[21] = "And Gehazi followed after Naaman. And when Naaman saw him running after him, he sprang down from the chariot to meet him, and said, Is all well?";
web[21] = "So Gehazi followed after Naaman. And when Naaman saw [him] running after him, he lighted down from the chariot to meet him, and said, [Is] all well?";
hnv[21] = "So Gechazi followed after Na`aman. When Na`aman saw one running after him, he alighted from the chariot to meet him, and said, Is all well?";
vul[21] = "et secutus est Giezi post tergum Naaman quem cum vidisset ille currentem ad se desilivit de curru in occursum eius et ait rectene sunt omnia";
rsv[22] = "And he said, &quot;All is well. My master has sent me to say, \'There have just now come to me from the hill country of E\'phraim two young men of the sons of the prophets; pray, give them a talent of silver and two festal garments.\'&quot;";
asv[22] = "And he said, All is well. My master hath sent me, saying, Behold, even now there are come to me from the hill-country of Ephraim two young men of the sons of the prophets; give them, I pray thee, a talent of silver, and two changes of raiment.";
yng[22] = "And he saith, `Peace; my lord hath sent me, saying, Lo, now, this, come unto me have two young men from the hill-country of Ephraim, of the sons of the prophets; give, I pray thee, to them, a talent of silver, and two changes of garments.\'";
dby[22] = "And he said, All is well. My master has sent me saying, Behold, even now there are come to me from mount Ephraim two young men of the sons of the prophets; give them, I pray thee, a talent of silver, and two changes of raiment.";
web[22] = "And he said, All [is] well. My master hath sent me, saying, Behold, even now there have come to me from mount Ephraim two young men of the sons of the prophets: give them, I pray thee, a talent of silver, and two changes of garments.";
hnv[22] = "He said, All is well. My master has sent me, saying, Behold, even now there are come to me from the hill-country of Efrayim two young men of the sons of the prophets; please give them a talent of silver, and two changes of clothing.";
vul[22] = "et ille ait recte dominus meus misit me dicens modo venerunt ad me duo adulescentes de monte Ephraim ex filiis prophetarum da eis talentum argenti et vestes mutatorias duplices";
rsv[23] = "And Na\'aman said, &quot;Be pleased to accept two talents.&quot; And he urged him, and tied up two talents of silver in two bags, with two festal garments, and laid them upon two of his servants; and they carried them before Geha\'zi.";
asv[23] = "And Naaman said, Be pleased to take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of raiment, and laid them upon two of his servants; and they bare them before him.";
yng[23] = "And Naaman saith, `Be pleased, take two talents;\' and he urgeth on him, and bindeth two talents of silver in two purses, and two changes of garments, and giveth unto two of his young men, and they bear before him;";
dby[23] = "And Naaman said, Consent to take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of raiment, and laid them upon two of his young men; and they bore them before him.";
web[23] = "And Naaman said, Be content, take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of garments, and laid [them] upon two of his servants; and they bore [them] before him.";
hnv[23] = "Na`aman said, Be pleased to take two talents. He urged him, and bound two talents of silver in two bags, with two changes of clothing, and laid them on two of his servants; and they bore them before him.";
vul[23] = "dixitque Naaman melius est ut accipias duo talenta et coegit eum ligavitque duo talenta argenti in duobus saccis et duplicia vestimenta et inposuit duobus pueris suis qui et portaverunt coram eo";
rsv[24] = "And when he came to the hill, he took them from their hand, and put them in the house; and he sent the men away, and they departed.";
asv[24] = "And when he came to the hill, he took them from their hand, and bestowed them in the house; and he let the men go, and they departed.";
yng[24] = "and he cometh in unto the high place, and taketh out of their hand, and layeth up in the house, and sendeth away the men, and they go.";
dby[24] = "And when he came to the hill, he took them from their hand, and stowed them in the house; and he let the men go, and they departed.";
web[24] = "And when he came to the tower, he took [them] from their hand, and bestowed [them] in the house: and he let the men go, and they departed.";
hnv[24] = "When he came to the hill, he took them from their hand, and bestowed them in the house; and he let the men go, and they departed.";
vul[24] = "cumque venisset iam vesperi tulit de manu eorum et reposuit in domo dimisitque viros et abierunt";
rsv[25] = "He went in, and stood before his master, and Eli\'sha said to him, &quot;Where have you been, Geha\'zi?&quot; And he said, &quot;Your servant went nowhere.&quot;";
asv[25] = "But he went in, and stood before his master. And Elisha said unto him, Whence comest thou, Gehazi? And he said, Thy servant went no whither.";
yng[25] = "And he hath come in, and doth stand by his lord, and Elisha saith unto him, `Whence -- Gehazi?\' and he saith, `Thy servant went not hither or thither.\'";
dby[25] = "And he entered in and stood before his master. And Elisha said to him, Whence [comest thou], Gehazi? And he said, Thy servant went no whither.";
web[25] = "But he went in, and stood before his master: and Elisha said to him, Whence [comest thou] Gehazi? and he said, Thy servant went no whither.";
hnv[25] = "But he went in, and stood before his master. Elisha said to him, Whence come you, Gechazi? He said, Your servant went no where.";
vul[25] = "ipse autem ingressus stetit coram domino suo et dixit Heliseus unde venis Giezi qui respondit non ivit servus tuus quoquam";
rsv[26] = "But he said to him, &quot;Did I not go with you in spirit when the man turned from his chariot to meet you? Was it a time to accept money and garments, olive orchards and vineyards, sheep and oxen, menservants and maidservants?";
asv[26] = "And he said unto him, Went not my heart [with thee], when the man turned from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards and vineyards, and sheep and oxen, and men-servants and maid-servants?";
yng[26] = "And he saith unto him, `My heart went not when the man turned from off his chariot to meet thee; is it a time to take silver, and to take garments, and olives, and vines, and flock, and herd, and men-servants, and maid-servants?";
dby[26] = "And he said to him, Did not my heart go, when the man turned again from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards, and vineyards, and sheep, and oxen, and bondmen, and bondwomen?";
web[26] = "And he said to him, Went not my heart [with thee], when the man turned again from his chariot to meet thee? [Is it] a time to receive money, and to receive garments, and olive-yards, and vineyards, and sheep, and oxen, and men-servants, and maid-servants?";
hnv[26] = " He said to him, Didn\'t my heart go with you, when the man turned from his chariot to meet you? Is it a time to receive money, and to receive garments, and olive groves and vineyards, and sheep and oxen, and men-servants and maid-servants?";
vul[26] = "at ille nonne ait cor meum in praesenti erat quando reversus est homo de curru suo in occursum tui nunc igitur accepisti argentum et accepisti vestes ut emas oliveta et vineta et oves et boves et servos et ancillas";
rsv[27] = "Therefore the leprosy of Na\'aman shall cleave to you, and to your descendants for ever.&quot; So he went out from his presence a leper, as white as snow.";
asv[27] = "The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever. And he went out from his presence a leper [as white] as snow.";
yng[27] = "yea, the leprosy of Naaman doth cleave to thee, and to thy seed, -- to the age;\' and he goeth out from before him -- leprous as snow.";
dby[27] = "But the leprosy of Naaman shall fasten upon thee, and upon thy seed for ever. And he went out from his presence leprous, as snow.";
web[27] = "The leprosy therefore of Naaman shall cleave to thee, and to thy seed for ever. And he went out from his presence a leper [as white] as snow.";
hnv[27] = "The leprosy therefore of Na`aman shall cleave to you, and to your seed forever. He went out from his presence a leper [as white] as snow.";
vul[27] = "sed et lepra Naaman adherebit tibi et semini tuo in sempiternum et egressus est ab eo leprosus quasi nix";
</script>
