csb[1] = "In the ninth year of Zedekiah\'s reign, on the tenth day of the tenth month, King Nebuchadnezzar of Babylon advanced against Jerusalem with his entire army. They laid siege to the city and built a siege wall against it all around.";
csb[2] = "The city was under siege until King Zedekiah\'s eleventh year.";
csb[3] = "By the ninth day of the fourth month the famine was so severe in the city that the common people had no food.";
csb[4] = "Then the city was broken into, and all the warriors fled at night by way of the city gate between the two walls near the king\'s garden, even though the Chaldeans surrounded the city. As the king made his way along the route to the Arabah,";
csb[5] = "the Chaldean army pursued him and overtook him in the plains of Jericho. Zedekiah\'s entire army left him and scattered.";
csb[6] = "The Chaldeans seized the king and brought him up to the king of Babylon at Riblah, and they passed sentence on him.";
csb[7] = "They slaughtered Zedekiah\'s sons before his eyes. Finally, the king of Babylon blinded Zedekiah, bound him in bronze chains, and took him to Babylon.";
csb[8] = "On the seventh day of the fifth month -- which was the nineteenth year of King Nebuchadnezzar of Babylon -- Nebuzaradan, the captain of the guards, a servant of the king of Babylon, entered Jerusalem.";
csb[9] = "He burned the LORD\'s temple, the king\'s palace, and all the houses of Jerusalem; he burned down all the great houses.";
csb[10] = "The whole Chaldean army with the captain of the guards tore down the walls surrounding Jerusalem.";
csb[11] = "Nebuzaradan, the captain of the guards, deported the rest of the people who remained in the city, the deserters who had defected to the king of Babylon, and the rest of the population.";
csb[12] = "But the captain of the guards left some of the poorest of the land to be vinedressers and farmers.";
csb[13] = "Now the Chaldeans broke into pieces the bronze pillars of the LORD\'s temple, the water carts, and the bronze basin, which were in the LORD\'s temple, and carried the bronze to Babylon.";
csb[14] = "They also took the pots, shovels, wick trimmers, dishes, and all the bronze articles used in the priests\' service.";
csb[15] = "The captain of the guards took away the firepans and sprinkling basins -- whatever was gold or silver.";
csb[16] = "As for the two pillars, the one basin, and the water carts that Solomon had made for the LORD\'s temple, the weight of the bronze of all these articles was beyond measure.";
csb[17] = "One pillar was twenty-seven feet tall and had a bronze capital on top of it. The capital, encircled by a grating and pomegranates of bronze, stood five feet high. The second pillar was the same, with its own grating.";
csb[18] = "The captain of the guards also took away Seraiah the chief priest, Zephaniah the priest of the second rank, and the three doorkeepers.";
csb[19] = "From the city he took a court official who had been appointed over the warriors; five trusted royal aides found in the city; the secretary of the commander of the army, who enlisted the people of the land for military duty; and sixty men from the common people who were found within the city.";
csb[20] = "Nebuzaradan, the captain of the guards, took them and brought them to the king of Babylon at Riblah.";
csb[21] = "The king of Babylon put them to death at Riblah in the land of Hamath. So Judah went into exile from its land.";
csb[22] = "King Nebuchadnezzar of Babylon appointed Gedaliah son of Ahikam, son of Shaphan, over the rest of the people he left in the land of Judah.";
csb[23] = "When all the commanders of the armies -- they and their men -- heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah. The commanders included Ishmael son of Nethaniah, Johanan son of Kareah, Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite -- they and their men.";
csb[24] = "Gedaliah swore an oath to them and their men, assuring them, &quot;Don\'t be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.&quot;";
csb[25] = "In the seventh month, however, Ishmael son of Nethaniah, son of Elishama, of the royal family, came with ten men and struck down Gedaliah, and he died. Also, they killed the Judeans and the Chaldeans who were with him at Mizpah.";
csb[26] = "Then all the people, from the youngest to the oldest, and the commanders of the army, left and went to Egypt, for they were afraid of the Chaldeans.";
csb[27] = "On the twenty-seventh day of the twelfth month of the thirty-seventh year of the exile of Judah\'s King Jehoiachin, in the year Evil-merodach became king of Babylon, he pardoned King Jehoiachin of Judah and released him from prison.";
csb[28] = "He spoke kindly to him and set his throne over the thrones of the kings who were with him in Babylon.";
csb[29] = "So Jehoiachin changed his prison clothes, and he dined regularly in the presence of the king of Babylon for the rest of his life.";
csb[30] = "As for his allowance, a regular allowance was given to him by the king, a portion for each day, for the rest of his life.";
kjv[1] = "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth [day] of the month, [that] Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem, and pitched against it; and they built forts against it round about.";
rsv[1] = "And in the ninth year of his reign, in the tenth month, on the tenth day of the month, Nebuchadnez\'zar king of Babylon came with all his army against Jerusalem, and laid siege to it; and they built siegeworks against it round about.";
asv[1] = "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem, and encamped against it; and they built forts against it round about.";
yng[1] = "And it cometh to pass, in the ninth year of his reign, in the tenth month, in the tenth of the month, come hath Nebuchadnezzar king of Babylon, he and all his force, against Jerusalem, and encampeth against it, and buildeth against it a fortification round about.";
dby[1] = "And it came to pass in the ninth year of his reign, in the tenth month, on the tenth of the month, [that] Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem, and encamped against it; and they built turrets against it round about.";
web[1] = "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth [day] of the month, [that] Nebuchadnezzar king of Babylon came, he, and all his army, against Jerusalem, and encamped against it; and they built forts against it on all sides.";
hnv[1] = "It happened in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nevukhadnetztzar king of Bavel came, he and all his army, against Yerushalayim, and encamped against it; and they built forts against it round about.";
vul[1] = "factum est autem anno nono regni eius mense decimo decima die mensis venit Nabuchodonosor rex Babylonis ipse et omnis exercitus eius in Hierusalem et circumdederunt eam et extruxerunt in circuitu eius munitiones";
kjv[2] = "And the city was besieged unto the eleventh year of king Zedekiah.";
rsv[2] = "So the city was besieged till the eleventh year of King Zedeki\'ah.";
asv[2] = "So the city was besieged unto the eleventh year of king Zedekiah.";
yng[2] = "And the city entereth into siege till the eleventh year of king Zedekiah,";
dby[2] = "And the city was besieged until the eleventh year of king Zedekiah.";
web[2] = "And the city was besieged to the eleventh year of king Zedekiah.";
hnv[2] = "So the city was besieged to the eleventh year of king Tzidkiyahu.";
vul[2] = "et clausa est civitas atque vallata usque ad undecimum annum regis Sedeciae";
kjv[3] = "And on the ninth [day] of the [fourth] month the famine prevailed in the city, and there was no bread for the people of the land.";
rsv[3] = "On the ninth day of the fourth month the famine was so severe in the city that there was no food for the people of the land.";
asv[3] = "On the ninth day of the [fourth] month the famine was sore in the city, so that there was no bread for the people of the land.";
yng[3] = "on the ninth of the month -- when the famine is severe in the city, and there hath not been bread for the people of the land,";
dby[3] = "On the ninth of the [fourth] month the famine prevailed in the city, and there was no bread for the people of the land.";
web[3] = "And on the ninth [day] of the [fourth] month the famine prevailed in the city, and there was no bread for the people of the land.";
hnv[3] = "On the ninth day of the [fourth] month the famine was sore in the city, so that there was no bread for the people of the land.";
vul[3] = "nona die mensis praevaluitque fames in civitate nec erat panis populo terrae";
kjv[4] = "And the city was broken up, and all the men of war [fled] by night by the way of the gate between two walls, which [is] by the king\'s garden: (now the Chaldees [were] against the city round about:) and [the king] went the way toward the plain.";
rsv[4] = "Then a breach was made in the city; the king with all the men of war fled by night by the way of the gate between the two walls, by the king\'s garden, though the Chalde\'ans were around the city. And they went in the direction of the Arabah.";
asv[4] = "Then a breach was made in the city, and all the men of war [fled] by night by the way of the gate between the two walls, which was by the king\'s garden (now the Chaldeans were against the city round about); and [the king] went by the way of the Arabah.";
yng[4] = "then the city is broken up, and all the men of war [go] by night the way of the gate, between the two walls that [are] by the garden of the king, and the Chaldeans [are] against the city round about, and [the king] goeth the way of the plain.";
dby[4] = "And the city was broken into; and all the men of war [fled] by night, by the way of the gate between the two walls, which [leads] to the king\'s garden (now the Chaldeans were by the city round about); and they went the way toward the plain.";
web[4] = "And the city was broken up, and all the men of war [fled] by night by the way of the gate between two walls, which [is] by the king\'s garden: (now the Chaldees [were] against the city on all sides:) and [the king] went the way towards the plain.";
hnv[4] = "Then a breach was made in the city, and all the men of war [fled] by night by the way of the gate between the two walls, which was by the king\'s garden (now the Kasdim were against the city round about); and [the king] went by the way of the `Aravah.";
vul[4] = "et interrupta est civitas et omnes viri bellatores nocte fugerunt per viam portae quae est inter duplicem murum ad hortum regis porro Chaldei obsidebant in circuitu civitatem fugit itaque per viam quae ducit ad campestria solitudinis";
kjv[5] = "And the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho: and all his army were scattered from him.";
rsv[5] = "But the army of the Chalde\'ans pursued the king, and overtook him in the plains of Jericho; and all his army was scattered from him.";
asv[5] = "But the army of the Chaldeans pursued after the king, and overtook him in the plains of Jericho; and all his army was scattered from him.";
yng[5] = "And the force of the Chaldeans pursue after the king, and overtake him in the plains of Jericho, and all his force have been scattered from him;";
dby[5] = "And the army of the Chaldeans pursued after the king, and overtook him in the plains of Jericho; and all his army was scattered from him.";
web[5] = "And the army of the Chaldees pursued the king, and overtook him in the plains of Jericho: and all his army were scattered from him.";
hnv[5] = "But the army of the Kasdim pursued after the king, and overtook him in the plains of Yericho; and all his army was scattered from him.";
vul[5] = "et persecutus est exercitus Chaldeorum regem conprehenditque eum in planitie Hiericho et omnes bellatores qui erant cum eo dispersi sunt et reliquerunt eum";
kjv[6] = "So they took the king, and brought him up to the king of Babylon to Riblah; and they gave judgment upon him.";
rsv[6] = "Then they captured the king, and brought him up to the king of Babylon at Riblah, who passed sentence upon him.";
asv[6] = "Then they took the king, and carried him up unto the king of Babylon to Riblah; and they gave judgment upon him.";
yng[6] = "and they seize the king, and bring him up unto the king of Babylon, to Riblah, and they speak with him -- judgment.";
dby[6] = "And they took the king, and brought him up to the king of Babylon unto Riblah; and they pronounced judgment upon him,";
web[6] = "So they took the king, and brought him to the king of Babylon to Riblah; and they gave judgment upon him.";
hnv[6] = "Then they took the king, and carried him up to the king of Bavel to Rivlah; and they gave judgment on him.";
vul[6] = "adprehensum ergo regem duxerunt ad regem Babylonis in Reblatha qui locutus est cum eo iudicium";
kjv[7] = "And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon.";
rsv[7] = "They slew the sons of Zedeki\'ah before his eyes, and put out the eyes of Zedeki\'ah, and bound him in fetters, and took him to Babylon.";
asv[7] = "And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him in fetters, and carried him to Babylon.";
yng[7] = "And the sons of Zedekiah they have slaughtered before his eyes, and the eyes of Zedekiah he hath blinded, and bindeth him with brazen fetters, and they bring him to Babylon.";
dby[7] = "and slaughtered the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with chains of brass, and carried him to Babylon.";
web[7] = "And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon.";
hnv[7] = "They killed the sons of Tzidkiyahu before his eyes, and put out the eyes of Tzidkiyahu, and bound him in fetters, and carried him to Bavel.";
vul[7] = "filios autem Sedeciae occidit coram eo et oculos eius effodit vinxitque eum catenis et adduxit in Babylonem";
kjv[8] = "And in the fifth month, on the seventh [day] of the month, which [is] the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzaradan, captain of the guard, a servant of the king of Babylon, unto Jerusalem:";
rsv[8] = "In the fifth month, on the seventh day of the month--which was the nineteenth year of King Nebuchadnez\'zar, king of Babylon--Nebu\'zarad\'an, the captain of the bodyguard, a servant of the king of Babylon, came to Jerusalem.";
asv[8] = "Now in the fifth month, on the seventh day of the month, which was the nineteenth year of king Nebuchadnezzar, king of Babylon, came Nebuzaradan the captain of the guard, a servant of the king of Babylon, unto Jerusalem.";
yng[8] = "And in the fifth month, on the seventh of the month (it [is] the nineteenth year of king Nebuchadnezzar king of Babylon), hath Nebuzaradan chief of the executioners, servant of the king of Babylon, come to Jerusalem,";
dby[8] = "And in the fifth month, on the seventh of the month, which was in the nineteenth year of king Nebuchadnezzar, king of Babylon, Nebuzar-adan, captain of the body-guard, servant of the king of Babylon, came unto Jerusalem;";
web[8] = "And in the fifth month, on the seventh [day] of the month, which [is] the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzar-adan, captain of the guard, a servant of the king of Babylon, to Jerusalem:";
hnv[8] = "Now in the fifth month, on the seventh day of the month, which was the nineteenth year of king Nevukhadnetztzar, king of Bavel, came Nevuzar\'adan the captain of the guard, a servant of the king of Bavel, to Yerushalayim.";
vul[8] = "mense quinto septima die mensis ipse est annus nonusdecimus regis Babylonis venit Nabuzardan princeps exercitus servus regis Babylonis Hierusalem";
kjv[9] = "And he burnt the house of the LORD, and the king\'s house, and all the houses of Jerusalem, and every great [man\'s] house burnt he with fire.";
rsv[9] = "And he burned the house of the LORD, and the king\'s house and all the houses of Jerusalem; every great house he burned down.";
asv[9] = "And he burnt the house of Jehovah, and the king\'s house; and all the houses of Jerusalem, even every great house, burnt he with fire.";
yng[9] = "and he burneth the house of Jehovah, and the house of the king, and all the houses of Jerusalem, yea, every great house he hath burned with fire;";
dby[9] = "and he burned the house of Jehovah, and the king\'s house, and all the houses of Jerusalem; and every great [man\'s] house he burned with fire.";
web[9] = "And he burnt the house of the LORD, and the king\'s house, and all the houses of Jerusalem, and every great [man\'s] house he burnt with fire.";
hnv[9] = "He burnt the house of the LORD, and the king\'s house; and all the houses of Yerushalayim, even every great house, burnt he with fire.";
vul[9] = "et succendit domum Domini et domum regis et domos Hierusalem omnemque domum conbusit igni";
kjv[10] = "And all the army of the Chaldees, that [were with] the captain of the guard, brake down the walls of Jerusalem round about.";
rsv[10] = "And all the army of the Chalde\'ans, who were with the captain of the guard, broke down the walls around Jerusalem.";
asv[10] = "And all the army of the Chaldeans, that were [with] the captain of the guard, brake down the walls of Jerusalem round about.";
yng[10] = "and the walls of Jerusalem round about have all the forces of the Chaldeans, who [are] with the chief of the executioners, broken down.";
dby[10] = "And all the army of the Chaldeans that were with the captain of the body-guard broke down the walls of Jerusalem round about.";
web[10] = "And all the army of the Chaldees, that [were with] the captain of the guard, broke down the walls of Jerusalem on all sides.";
hnv[10] = "All the army of the Kasdim, who were [with] the captain of the guard, broke down the walls of Yerushalayim round about.";
vul[10] = "et muros Hierusalem in circuitu destruxit omnis exercitus Chaldeorum qui erat cum principe militum";
kjv[11] = "Now the rest of the people [that were] left in the city, and the fugitives that fell away to the king of Babylon, with the remnant of the multitude, did Nebuzaradan the captain of the guard carry away.";
rsv[11] = "And the rest of the people who were left in the city and the deserters who had deserted to the king of Babylon, together with the rest of the multitude, Nebu\'zarad\'an the captain of the guard carried into exile.";
asv[11] = "And the residue of the people that were left in the city, and those that fell away, that fell to the king of Babylon, and the residue of the multitude, did Nebuzaradan the captain of the guard carry away captive.";
yng[11] = "And the rest of the people, those left in the city, and those falling who have fallen to the king of Babylon, and the rest of the multitude, hath Nebuzaradan chief of the executioners removed;";
dby[11] = "And Nebuzar-adan the captain of the body-guard carried away captive the rest of the people that were left in the city, and the deserters that had deserted to the king of Babylon, and the rest of the multitude.";
web[11] = "Now the rest of the people [that were] left in the city, and the fugitives that fell away to the king of Babylon, with the remnant of the multitude, did Nebuzar-adan the captain of the guard carry away.";
hnv[11] = "The residue of the people who were left in the city, and those who fell away, who fell to the king of Bavel, and the residue of the multitude, did Nevuzar\'adan the captain of the guard carry away captive.";

rsv[12] = "But the captain of the guard left some of the poorest of the land to be vinedressers and plowmen.";
asv[12] = "But the captain of the guard left of the poorest of the land to be vinedressers and husbandmen.";
yng[12] = "and of the poor of the land hath the chief of the executioners left for vine-dressers and for husbandmen.";
dby[12] = "But the captain of the body-guard left of the poor of the land for vinedressers and husbandmen.";
web[12] = "But the captain of the guard left of the poor of the land [to be] vine-dressers and husbandmen.";
hnv[12] = "But the captain of the guard left of the poorest of the land to work the vineyards and fields.";
vul[12] = "et de pauperibus terrae reliquit vinitores et agricolas";

yng[13] = "And the pillars of brass that [are] in the house of Jehovah, and the bases, and the sea of brass, that [is] in the house of Jehovah, have the Chaldeans broken in pieces, and bear away their brass to Babylon.";
dby[13] = "And the brazen pillars that were in the house of Jehovah, and the bases, and the brazen sea that was in the house of Jehovah, the Chaldeans broke in pieces, and carried the brass thereof to Babylon.";

dby[14] = "The cauldrons also and the shovels and the knives and the cups, and all the vessels of copper wherewith they ministered, they took away.";
web[14] = "And the pots, and the shovels, and the snuffers, and the spoons, and all the vessels of brass with which they ministered, they took away.";
hnv[14] = "The pots, and the shovels, and the snuffers, and the spoons, and all the vessels of brass with which they ministered, took they away.";

rsv[15] = "the firepans also, and the bowls. What was of gold the captain of the guard took away as gold, and what was of silver, as silver.";

kjv[16] = "The two pillars, one sea, and the bases which Solomon had made for the house of the LORD; the brass of all these vessels was without weight.";
rsv[16] = "As for the two pillars, the one sea, and the stands, which Solomon had made for the house of the LORD, the bronze of all these vessels was beyond weight.";
asv[16] = "The two pillars, the one sea, and the bases, which Solomon had made for the house of Jehovah, the brass of all these vessels was without weight.";
yng[16] = "The two pillars, the one sea, and the bases that Solomon made for the house of Jehovah, there was no weighing of the brass of all these vessels;";
dby[16] = "The two pillars, the one sea, and the bases which Solomon had made for the house of Jehovah: for the brass of all these vessels there was no weight.";
web[16] = "The two pillars, one sea, and the bases which Solomon had made for the house of the LORD; the brass of all these vessels was without weight.";
hnv[16] = "The two pillars, the one sea, and the bases, which Shlomo had made for the house of the LORD, the brass of all these vessels was without weight.";
vul[16] = "id est columnas duas mare unum et bases quas fecerat Salomon in templo Domini non erat pondus aeris omnium vasorum";
kjv[17] = "The height of the one pillar [was] eighteen cubits, and the chapiter upon it [was] brass: and the height of the chapiter three cubits; and the wreathen work, and pomegranates upon the chapiter round about, all of brass: and like unto these had the second pillar with wreathen work.";
rsv[17] = "The height of the one pillar was eighteen cubits, and upon it was a capital of bronze; the height of the capital was three cubits; a network and pomegranates, all of bronze, were upon the capital round about. And the second pillar had the like, with the network.";
asv[17] = "The height of the one pillar was eighteen cubits, and a capital of brass was upon it; and the height of the capital was three cubits, with network and pomegranates upon the capital round about, all of brass: and like unto these had the second pillar with network.";
yng[17] = "eighteen cubits [is] the height of the one pillar, and the chapiter on it [is] of brass, and the height of the chapiter [is] three cubits, and the net and the pomegranates [are] on the chapiter round about -- the whole [is] of brass; and like these hath the second pillar, with the net.";
dby[17] = "The height of one pillar was eighteen cubits, and the capital upon it was brass, and the height of the capital three cubits; and the network and the pomegranates, upon the capital round about, all of brass: and similarly for the second pillar with the network.";
web[17] = "The hight of the one pillar [was] eighteen cubits, and the capital upon it [was] brass: and the hight of the capital three cubits; and the wreathen work, and pomegranates upon the capital around, all of brass: and like to these had the second pillar with wreathen work.";
hnv[17] = "The height of the one pillar was eighteen cubits, and a capital of brass was on it; and the height of the capital was three cubits, with network and pomegranates on the capital round about, all of brass: and like to these had the second pillar with network.";
vul[17] = "decem et octo cubitos altitudinis habebat columna una et capitellum aereum super se altitudinis trium cubitorum et reticulum et malogranata super capitellum columnae omnia aerea similem et columna secunda habebat ornatum";
kjv[18] = "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:";
rsv[18] = "And the captain of the guard took Serai\'ah the chief priest, and Zephani\'ah the second priest, and the three keepers of the threshold;";
asv[18] = "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the threshold:";
yng[18] = "And the chief of the executioners taketh Seraiah the head priest, and Zephaniah the second priest, and the three keepers of the threshold,";
dby[18] = "And the captain of the body-guard took Seraiah the high priest, and Zephaniah the second priest, and the three doorkeepers.";
web[18] = "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:";
hnv[18] = "The captain of the guard took Serayah the chief Kohen, and Tzefanyah the second Kohen, and the three keepers of the threshold:";
vul[18] = "tulit quoque princeps militiae Seraian sacerdotem primum et Sophoniam sacerdotem secundum et tres ianitores";
kjv[19] = "And out of the city he took an officer that was set over the men of war, and five men of them that were in the king\'s presence, which were found in the city, and the principal scribe of the host, which mustered the people of the land, and threescore men of the people of the land [that were] found in the city:";
rsv[19] = "and from the city he took an officer who had been in command of the men of war, and five men of the king\'s council who were found in the city; and the secretary of the commander of the army who mustered the people of the land; and sixty men of the people of the land who were found in the city.";
asv[19] = "and out of the city he took an officer that was set over the men of war; and five men of them that saw the king\'s face, who were found in the city; and the scribe, the captain of the host, who mustered the people of the land; and threescore men of the people of the land, that were found in the city.";
yng[19] = "and out of the city he hath taken a certain eunuch who is appointed over the men of war, and five men of those seeing the king\'s face who have been found in the city, and the head scribe of the host, who mustereth the people of the land, and sixty men of the people of the land who are found in the city,";
dby[19] = "And out of the city he took a chamberlain that was set over the men of war, and five men of them that were in the king\'s presence, who were found in the city, and the scribe of the captain of the host, who enrolled the people of the land; and sixty men of the people of the land that were found in the city.";
web[19] = "And out of the city he took an officer that was set over the men of war, and five men of them that were in the king\'s presence, who were found in the city, and the principal scribe of the host, who mustered the people of the land, and sixty men of the people of the land [that were] found in the city:";
hnv[19] = "and out of the city he took an officer who was set over the men of war; and five men of those who saw the king\'s face, who were found in the city; and the Sofer, the captain of the host, who mustered the people of the land; and sixty men of the people of the land, who were found in the city.";
vul[19] = "et de civitate eunuchum unum qui erat praefectus super viros bellatores et quinque viros de his qui steterant coram rege quos repperit in civitate et Sopher principem exercitus qui probabat tirones de populo terrae et sex viros e vulgo qui inventi fuerant in civitate";
kjv[20] = "And Nebuzaradan captain of the guard took these, and brought them to the king of Babylon to Riblah:";
rsv[20] = "And Nebu\'zarad\'an the captain of the guard took them, and brought them to the king of Babylon at Riblah.";
asv[20] = "And Nebuzaradan the captain of the guard took them, and brought them to the king of Babylon to Riblah.";
yng[20] = "and Nebuzaradan chief of the executioners taketh them, and causeth them to go unto the king of Babylon, to Libnah,";
dby[20] = "And Nebuzar-adan the captain of the body-guard took them and brought them to the king of Babylon to Riblah;";
web[20] = "And Nebuzar-adan captain of the guard took these, and brought them to the king of Babylon to Riblah:";
hnv[20] = "Nevuzar\'adan the captain of the guard took them, and brought them to the king of Bavel to Rivlah.";
vul[20] = "quos tollens Nabuzardan princeps militum duxit ad regem Babylonis in Reblatha";
kjv[21] = "And the king of Babylon smote them, and slew them at Riblah in the land of Hamath. So Judah was carried away out of their land.";
rsv[21] = "And the king of Babylon smote them, and put them to death at Riblah in the land of Hamath. So Judah was taken into exile out of its land.";
asv[21] = "And the king of Babylon smote them, and put them to death at Riblah in the land of Hamath. So Judah was carried away captive out of his land.";
yng[21] = "and the king of Babylon smiteth them, and putteth them to death in Riblah, in the land of Hamath, and he removeth Judah from off its land.";
dby[21] = "and the king of Babylon smote them and put them to death at Riblah in the land of Hamath. Thus Judah was carried away captive out of his land.";
web[21] = "And the king of Babylon smote them, and slew them at Riblah in the land of Hamath. So Judah was carried away out of their land.";
hnv[21] = "The king of Bavel struck them, and put them to death at Rivlah in the land of Hamat. So Yehudah was carried away captive out of his land.";
vul[21] = "percussitque eos rex Babylonis et interfecit in Reblatha in terra Emath et translatus est Iuda de terra sua";
kjv[22] = "And [as for] the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.";
rsv[22] = "And over the people who remained in the land of Judah, whom Nebuchadnez\'zar king of Babylon had left, he appointed Gedali\'ah the son of Ahi\'kam, son of Shaphan, governor.";
asv[22] = "And as for the people that were left in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, governor.";
yng[22] = "And the people that is left in the land of Judah whom Nebuchadnezzar king of Babylon hath left -- he appointeth over them Gedaliah son of Ahikam, son of Shaphan.";
dby[22] = "And [as for] the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left behind, over them he appointed Gedaliah the son of Ahikam, the son of Shaphan.";
web[22] = "And [as for] the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.";
hnv[22] = "As for the people who were left in the land of Yehudah, whom Nevukhadnetztzar king of Bavel had left, even over them he made Gedalyahu the son of Achikam, the son of Shafan, governor.";
vul[22] = "populo autem qui relictus erat in terra Iuda quem dimiserat Nabuchodonosor rex Babylonis praefecit Godoliam filium Ahicham filii Saphan";
kjv[23] = "And when all the captains of the armies, they and their men, heard that the king of Babylon had made Gedaliah governor, there came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Careah, and Seraiah the son of Tanhumeth the Netophathite, and Jaazaniah the son of a Maachathite, they and their men.";
rsv[23] = "Now when all the captains of the forces in the open country and their men heard that the king of Babylon had appointed Gedali\'ah governor, they came with their men to Gedali\'ah at Mizpah, namely, Ish\'mael the son of Nethani\'ah, and Joha\'nan the son of Kare\'ah, and Serai\'ah the son of Tanhu\'meth the Netoph\'athite, and Ja-azani\'ah the son of the Ma-ac\'athite.";
asv[23] = "Now when all the captains of the forces, they and their men, heard that the king of Babylon had made Gedaliah governor, they came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Kareah, and Seraiah the son of Tanhumeth the Netophathite, and Jaazaniah the son of the Maacathite, they and their men.";
yng[23] = "And all the heads of the forces hear -- they and the men -- that the king of Babylon hath appointed Gedaliah, and they come in unto Gedaliah, to Mizpah, even Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maachathite -- they and their men;";
dby[23] = "And all the captains of the forces, they and their men, heard that the king of Babylon had appointed Gedaliah, and they came to Gedaliah to Mizpah, namely, Ishmael the son of Nethaniah, and Johanan the son of Kareah, and Seraiah the son of Tanhumeth the Netophathite, and Jaazaniah the son of a Maachathite, they and their men.";
web[23] = "And when all the captains of the armies, they and their men, heard that the king of Babylon had made Gedaliah governor, there came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Careah, and Seraiah the son of Tanhumeth the Netophathite, and Jaazaniah the son of Maachathite, they and their men.";
hnv[23] = "Now when all the captains of the forces, they and their men, heard that the king of Bavel had made Gedalyahu governor, they came to Gedalyahu to Mitzpah, even Yishma\'el the son of Netanyah, and Yochanan the son of Kareach, and Serayah the son of Tanchumet the Netofatite, and Ya`azanyah the son of the Ma`akhatite, they and their men.";
vul[23] = "quod cum audissent omnes duces militum ipsi et viri qui erant cum eis videlicet quod constituisset rex Babylonis Godoliam venerunt ad Godoliam in Maspha Ismahel filius Nathaniae et Iohanan filius Caree et Sareia filius Thenaameth Nethophathites et Iezonias filius Maachathi ipsi et socii eorum";
kjv[24] = "And Gedaliah sware to them, and to their men, and said unto them, Fear not to be the servants of the Chaldees: dwell in the land, and serve the king of Babylon; and it shall be well with you.";
rsv[24] = "And Gedali\'ah swore to them and their men, saying, &quot;Do not be afraid because of the Chalde\'an officials; dwell in the land, and serve the king of Babylon, and it shall be well with you.&quot;";
asv[24] = "And Gedaliah sware to them and to their men, and said unto them, Fear not because of the servants of the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.";
yng[24] = "and Gedaliah sweareth to them, and to their men, and saith to them, `Be not afraid of the servants of the Chaldeans, dwell in the land and serve the king of Babylon, and it is good for you.\'";
dby[24] = "And Gedaliah swore unto them and to their men, and said to them, Fear not to be servants of the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.";
web[24] = "And Gedaliah swore to them, and to their men, and said to them, Fear not to be the servants of the Chaldees: dwell in the land, and serve the king of Babylon; and it shall be well with you.";
hnv[24] = " Gedalyahu swore to them and to their men, and said to them, Don\'t be afraid because of the servants of the Kasdim: dwell in the land, and serve the king of Bavel, and it shall be well with you.";
vul[24] = "iuravitque eis Godolias et sociis eorum dicens nolite timere servire Chaldeis manete in terra et servite regi Babylonis et bene erit vobis";
kjv[25] = "But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died, and the Jews and the Chaldees that were with him at Mizpah.";
rsv[25] = "But in the seventh month, Ish\'mael the son of Nethani\'ah, son of Eli\'shama, of the royal family, came with ten men, and attacked and killed Gedali\'ah and the Jews and the Chalde\'ans who were with him at Mizpah.";
asv[25] = "But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, so that he died, and the Jews and the Chaldeans that were with him at Mizpah.";
yng[25] = "And it cometh to pass, in the seventh month, come hath Ishmael son of Nathaniah, son of Elishama of the seed of the kingdom, and ten men with him, and they smite Gedaliah, and he dieth, and the Jews and the Chaldeans who have been with him in Mizpah.";
dby[25] = "And it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the royal seed, came, and ten men with him, and smote Gedaliah, that he died, and the Jews and the Chaldeans that were with him at Mizpah.";
web[25] = "But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died, and the Jews and the Chaldees that were with him at Mizpah.";
hnv[25] = "But it happened in the seventh month, that Yishma\'el the son of Netanyah, the son of Elishama, of the royal seed came, and ten men with him, and struck Gedalyahu, so that he died, and the Yehudim and the Kasdim that were with him at Mitzpah.";
vul[25] = "factum est autem in mense septimo venit Ismahel filius Nathaniae filii Elisama de semine regio et decem viri cum eo percusseruntque Godoliam qui mortuus est sed et Iudaeos et Chaldeos qui erant cum eo in Maspha";
kjv[26] = "And all the people, both small and great, and the captains of the armies, arose, and came to Egypt: for they were afraid of the Chaldees.";
rsv[26] = "Then all the people, both small and great, and the captains of the forces arose, and went to Egypt; for they were afraid of the Chalde\'ans.";
asv[26] = "And all the people, both small and great, and the captains of the forces, arose, and came to Egypt; for they were afraid of the Chaldeans.";
yng[26] = "And all the people rise, from small even unto great, and the heads of the forces, and come in to Egypt, for they have been afraid of the presence of the Chaldeans.";
dby[26] = "And all the people, both small and great, and the captains of the forces, arose and came to Egypt; for they were afraid of the Chaldeans.";
web[26] = "And all the people, both small and great, and the captains of the armies, arose, and came to Egypt: for they were afraid of the Chaldees.";
hnv[26] = "All the people, both small and great, and the captains of the forces, arose, and came to Mitzrayim; for they were afraid of the Kasdim.";
vul[26] = "consurgens autem omnis populus a parvo usque ad magnum et principes militum venerunt in Aegyptum timentes Chaldeos";
kjv[27] = "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the seven and twentieth [day] of the month, [that] Evilmerodach king of Babylon in the year that he began to reign did lift up the head of Jehoiachin king of Judah out of prison;";
rsv[27] = "And in the thirty-seventh year of the exile of Jehoi\'achin king of Judah, in the twelfth month, on the twenty-seventh day of the month, Evil-mero\'dach king of Babylon, in the year that he began to reign, graciously freed Jehoi\'achin king of Judah from prison;";
asv[27] = "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the seven and twentieth day of the month, that Evil-merodach king of Babylon, in the year that he began to reign, did lift up the head of Jehoiachin king of Judah out of prison;";
yng[27] = "And it cometh to pass, in the thirty and seventh year of the removal of Jehoiachin king of Judah, in the twelfth month, in the twenty and seventh of the month hath Evil-Merodach king of Babylon lifted up, in the year of his reigning, the head of Jehoiachin king of Judah, out of the house of restraint,";
dby[27] = "And it came to pass in the thirty-seventh year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the twenty-seventh of the month, [that] Evil-Merodach king of Babylon, in the year that he began to reign, lifted up the head of Jehoiachin king of Judah out of prison;";
web[27] = "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the seven and twentieth [day] of the month, [that] Evil-merodach king of Babylon, in the year that he began to reign, lifted up the head of Jehoiachin king of Judah out of prison;";
hnv[27] = "It happened in the seven and thirtieth year of the captivity of Yehoiakim king of Yehudah, in the twelfth month, on the seven and twentieth day of the month, that Evil-Merodakh king of Bavel, in the year that he began to reign, did lift up the head of Yehoiakim king of Yehudah out of prison;";
vul[27] = "factum est vero anno tricesimo septimo transmigrationis Ioiachin regis Iudae mense duodecimo vicesima septima die mensis sublevavit Evilmerodach rex Babylonis anno quo regnare coeperat caput Ioiachin regis Iuda de carcere";
kjv[28] = "And he spake kindly to him, and set his throne above the throne of the kings that [were] with him in Babylon;";
rsv[28] = "and he spoke kindly to him, and gave him a seat above the seats of the kings who were with him in Babylon.";
asv[28] = "and he spake kindly to him, and set his throne above the throne of the kings that were with him in Babylon,";
yng[28] = "and speaketh with him good things and putteth his throne above the throne of the kings who [are] with him in Babylon,";
dby[28] = "and he spoke kindly to him, and set his seat above the seat of the kings that were with him in Babylon.";
web[28] = "And he spoke kindly to him, and set his throne above the throne of the kings that [were] with him in Babylon;";
hnv[28] = " and he spoke kindly to him, and set his throne above the throne of the kings who were with him in Bavel,";
vul[28] = "et locutus est ei benigna et posuit thronum eius super thronum regum qui erant cum eo in Babylone";
kjv[29] = "And changed his prison garments: and he did eat bread continually before him all the days of his life.";
rsv[29] = "So Jehoi\'achin put off his prison garments. And every day of his life he dined regularly at the king\'s table;";
asv[29] = "and changed his prison garments. And [Jehoiachin] did eat bread before him continually all the days of his life:";
yng[29] = "and hath changed the garments of his restraint, and he hath eaten bread continually before him all days of his life,";
dby[29] = "And he changed his prison garments; and he ate bread before him continually all the days of his life;";
web[29] = "And changed his prison garments: and he ate bread continually before him all the days of his life.";
hnv[29] = "and changed his prison garments. [Yehoiakim] ate bread before him continually all the days of his life:";
vul[29] = "et mutavit vestes eius quas habuerat in carcere et comedebat panem semper in conspectu eius cunctis diebus vitae suae";
kjv[30] = "And his allowance [was] a continual allowance given him of the king, a daily rate for every day, all the days of his life.";
rsv[30] = "and for his allowance, a regular allowance was given him by the king, every day a portion, as long as he lived.";
asv[30] = "and for his allowance, there was a continual allowance given him of the king, every day a portion, all the days of his life.";
yng[30] = "and his allowance -- a continual allowance -- hath been given to him from the king, the matter of a day in its day, all days of his life.";
dby[30] = "and his allowance was a continual allowance given him by the king, every day a portion, all the days of his life.";
web[30] = "And his allowance [was] a continual allowance given him by the king, a daily rate for every day, all the days of his life.";
hnv[30] = "and for his allowance, there was a continual allowance given him of the king, every day a portion, all the days of his life.";
vul[30] = "annonam quoque constituit ei absque intermissione quae et dabatur ei a rege per singulos dies omnibus diebus vitae suae";
