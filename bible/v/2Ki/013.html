csb[1] = "In the twenty-third year of Judah\'s King Joash son of Ahaziah, Jehoahaz son of Jehu became king over Israel in Samaria, and he reigned seventeen years.";
csb[2] = "He did what was evil in the LORD\'s sight and followed the sins that Jeroboam son of Nebat had caused Israel to commit; he did not turn away from them.";
csb[3] = "So the LORD\'s anger burned against Israel, and he handed them over to King Hazael of Aram and to his son Ben-hadad during their reigns.";
csb[4] = "Then Jehoahaz sought the LORD\'s favor, and the LORD heard him, for he saw the oppression the king of Aram inflicted on Israel.";
csb[5] = "Therefore, the LORD gave Israel a deliverer, and they escaped from the power of the Arameans. Then the people of Israel returned to their former way of life,";
csb[6] = "but they didn\'t turn away from the sins that the house of Jeroboam had caused Israel to commit. Jehoahaz continued them, and the Asherah pole also remained standing in Samaria.";
csb[7] = "Jehoahaz did not have an army left, except for fifty horsemen, ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them, making them like dust at threshing.";
csb[8] = "The rest of the events of Jehoahaz\'s reign, along with all his accomplishments and his might, are written in the Historical Record of Israel\'s Kings.";
csb[9] = "Jehoahaz rested with his fathers, and he was buried in Samaria. His son Jehoash became king in his place.";
csb[10] = "In the thirty-seventh year of Judah\'s King Joash, Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.";
csb[11] = "He did what was evil in the LORD\'s sight. He did not turn away from all the sins that Jeroboam son of Nebat had caused Israel to commit, but he continued them.";
csb[12] = "The rest of the events of Jehoash\'s reign, along with all his accomplishments and the power he had to wage war against Judah\'s King Amaziah, are written in the Historical Record of Israel\'s Kings.";
csb[13] = "Jehoash rested with his fathers, and Jeroboam sat on his throne. Jehoash was buried in Samaria with the kings of Israel.";
csb[14] = "When Elisha became sick with the illness from which he died, King Jehoash of Israel went down and wept over him and said, &quot;My father, my father, the chariots and horsemen of Israel! &quot;";
csb[15] = "Elisha responded, &quot;Get a bow and arrows.&quot; So he got a bow and arrows.";
csb[16] = "Then Elisha said to the king of Israel, &quot;Grasp the bow.&quot; So the king grasped it, and Elisha put his hands on the king\'s hands.";
csb[17] = "Elisha said, &quot;Open the east window.&quot; So he opened it. Elisha said, &quot;Shoot! &quot; So he shot. Then Elisha said, &quot;The LORD\'s arrow of victory, yes, the arrow of victory over Aram. You are to strike down the Arameans in Aphek until you have put an end to them.&quot;";
csb[18] = "Then Elisha said, &quot;Take the arrows! &quot; So he took them. Then Elisha said to the king of Israel, &quot;Strike the ground! &quot; So he struck the ground three times and stopped.";
csb[19] = "The man of God was angry with him and said, &quot;You should have struck the ground five or six times. Then you would have struck down Aram until you had put an end to them, but now you will strike down Aram only three times.&quot;";
csb[20] = "Then Elisha died and was buried. Now Moabite raiders used to come into the land in the spring of the year.";
csb[21] = "Once, as the Israelites were burying a man, suddenly they saw a raiding party, so they threw the man into Elisha\'s tomb. When he touched Elisha\'s bones, the man revived and stood up!";
csb[22] = "King Hazael of Aram oppressed Israel throughout the reign of Jehoahaz,";
csb[23] = "but the LORD was gracious to them, had compassion on them, and turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them. Even now he has not banished them from his presence.";
csb[24] = "King Hazael of Aram died, and his son Ben-hadad became king in his place.";
csb[25] = "Then Jehoash son of Jehoahaz took back from Ben-hadad son of Hazael the cities that Hazael had taken in war from Jehoash\'s father Jehoahaz. Jehoash defeated Ben-hadad three times and recovered the cities of Israel.";

yng[1] = "In the twenty and third year of Joash son of Ahaziah king of Judah, hath Jehoahaz son of Jehu reigned over Israel, in Samaria -- seventeen years,";
dby[1] = "In the three-and-twentieth year of Joash the son of Ahaziah, king of Judah, Jehoahaz the son of Jehu began to reign over Israel in Samaria, for seventeen years.";

kjv[17] = "And he said, Open the window eastward. And he opened [it]. Then Elisha said, Shoot. And he shot. And he said, The arrow of the LORD\'S deliverance, and the arrow of deliverance from Syria: for thou shalt smite the Syrians in Aphek, till thou have consumed [them].";
rsv[17] = "And he said, &quot;Open the window eastward&quot;; and he opened it. Then Eli\'sha said, &quot;Shoot&quot;; and he shot. And he said, &quot;The LORD\'s arrow of victory, the arrow of victory over Syria! For you shall fight the Syrians in Aphek until you have made an end of them.&quot;";
asv[17] = "And he said, Open the window eastward; and he opened it. Then Elisha said, Shoot; and he shot. And he said, Jehovah\'s arrow of victory, even the arrow of victory over Syria; for thou shalt smite the Syrians in Aphek, till thou have consumed them.";
yng[17] = "and saith, `Open the window eastward;\' and he openeth, and Elisha saith, `Shoot,\' and he shooteth; and he saith, `An arrow of salvation to Jehovah, and an arrow of salvation against Aram, and thou hast smitten Aram, in Aphek, till consuming.\'";
dby[17] = "and said, Open the window eastward. And he opened [it]. And Elisha said, Shoot. And he shot. And he said, An arrow of Jehovah\'s deliverance, even an arrow of deliverance from the Syrians; and thou shalt smite the Syrians in Aphek, till thou hast consumed [them].";
web[17] = "And he said, Open the window eastward. And he opened [it]. Then Elisha said, Shoot. And he shot. And he said, The arrow of the LORD\'S deliverance, and the arrow of deliverance from Syria: for thou shalt smite the Syrians in Aphek, till thou hast consumed [them].";
hnv[17] = "He said, Open the window eastward; and he opened it. Then Elisha said, Shoot; and he shot. He said, the LORD\'s arrow of victory, even the arrow of victory over Aram; for you shall strike the Aram in Afek, until you have consumed them.";
vul[17] = "et ait aperi fenestram orientalem cumque aperuisset dixit Heliseus iace sagittam et iecit et ait Heliseus sagitta salutis Domini et sagitta salutis contra Syriam percutiesque Syriam in Afec donec consumas eam";
kjv[18] = "And he said, Take the arrows. And he took [them]. And he said unto the king of Israel, Smite upon the ground. And he smote thrice, and stayed.";
rsv[18] = "And he said, &quot;Take the arrows&quot;; and he took them. And he said to the king of Israel, &quot;Strike the ground with them&quot;; and he struck three times, and stopped.";
asv[18] = "And he said, Take the arrows; and he took them. And he said unto the king of Israel, Smite upon the ground; and he smote thrice, and stayed.";
yng[18] = "And he saith, `Take the arrows,\' and he taketh; and he saith to the king of Israel, `Smite to the earth;\' and he smiteth three times, and stayeth.";
dby[18] = "And he said, Take the arrows. And he took [them]. And he said to the king of Israel, Smite upon the ground. And he smote thrice, and stayed.";
web[18] = "And he said, Take the arrows. And he took [them]. And he said to the king of Israel, Smite upon the ground. And he smote thrice, and ceased.";
hnv[18] = "He said, Take the arrows; and he took them. He said to the king of Yisra\'el, Smite on the ground; and he struck thrice, and stayed.";
vul[18] = "et ait tolle sagittas qui cum tulisset rursum dixit ei percute iaculo terram et cum percussisset tribus vicibus et stetisset";
kjv[19] = "And the man of God was wroth with him, and said, Thou shouldest have smitten five or six times; then hadst thou smitten Syria till thou hadst consumed [it]: whereas now thou shalt smite Syria [but] thrice.";
rsv[19] = "Then the man of God was angry with him, and said, &quot;You should have struck five or six times; then you would have struck down Syria until you had made an end of it, but now you will strike down Syria only three times.&quot;";
asv[19] = "And the man of God was wroth with him, and said, Thou shouldest have smitten five or six times: then hadst thou smitten Syria till thou hadst consumed it; whereas now thou shalt smite Syria but thrice.";
yng[19] = "And the man of God is wroth against him, and saith, `By smiting five or six times then thou hadst smitten Aram till consuming; and now, three times thou dost smite Aram.\'";
dby[19] = "And the man of God was wroth with him, and said, Thou shouldest have smitten five or six times; then wouldest thou have smitten the Syrians till thou hadst consumed [them]; whereas now thou shalt smite Syria but thrice.";
web[19] = "And the man of God was wroth with him, and said, Thou shouldst have smitten five or six times; then hadst thou smitten Syria till thou hadst consumed [it]: whereas now thou shalt smite Syria [but] thrice.";
hnv[19] = "The man of God was angry with him, and said, You should have struck five or six times: then had you struck Aram until you had consumed it, whereas now you shall strike Aram but thrice.";
vul[19] = "iratus est contra eum vir Dei et ait si percussisses quinquies aut sexies sive septies percussisses Syriam usque ad consummationem nunc autem tribus vicibus percuties eam";
kjv[20] = "And Elisha died, and they buried him. And the bands of the Moabites invaded the land at the coming in of the year.";
rsv[20] = "So Eli\'sha died, and they buried him. Now bands of Moabites used to invade the land in the spring of the year.";
asv[20] = "And Elisha died, and they buried him. Now the bands of the Moabites invaded the land at the coming in of the year.";
yng[20] = "And Elisha dieth, and they bury him, and troops of Moab come in to the land, at the coming in of the year,";
dby[20] = "And Elisha died, and they buried him. And the bands of the Moabites invaded the land at the coming in of the year.";
web[20] = "And Elisha died, and they buried him. And the bands of the Moabites invaded the land at the coming in of the year.";
hnv[20] = "Elisha died, and they buried him. Now the bands of the Mo`avim invaded the land at the coming in of the year.";
vul[20] = "mortuus est ergo Heliseus et sepelierunt eum latrunculi quoque de Moab venerunt in terra in ipso anno";
kjv[21] = "And it came to pass, as they were burying a man, that, behold, they spied a band [of men]; and they cast the man into the sepulchre of Elisha: and when the man was let down, and touched the bones of Elisha, he revived, and stood up on his feet.";
rsv[21] = "And as a man was being buried, lo, a marauding band was seen and the man was cast into the grave of Eli\'sha; and as soon as the man touched the bones of Eli\'sha, he revived, and stood on his feet.";
asv[21] = "And it came to pass, as they were burying a man, that, behold, they spied a band; and they cast the man into the sepulchre of Elisha: and as soon as the man touched the bones of Elisha, he revived, and stood up on his feet.";
yng[21] = "and it cometh to pass, they are burying a man, and lo, they have seen the troop, and cast the man into the grave of Elisha, and the man goeth and cometh against the bones of Elisha, and liveth, and riseth on his feet.";
dby[21] = "And it came to pass as they were burying a man, that behold, they saw the band, and they cast the man into the sepulchre of Elisha; and the man went [down], and touched the bones of Elisha, and he revived, and stood upon his feet.";
web[21] = "And it came to pass, as they were burying a man, that behold, they spied a band [of men]; and they cast the man into the sepulcher of Elisha: and when the man was let down, and touched the bones of Elisha, he revived, and stood on his feet.";
hnv[21] = "It happened, as they were burying a man, that behold, they spied a band; and they cast the man into the tomb of Elisha: and as soon as the man touched the bones of Elisha, he revived, and stood up on his feet.";
vul[21] = "quidam autem sepelientes hominem viderunt latrunculos et proiecerunt cadaver in sepulchro Helisei quod ambulavit et tetigit ossa Helisei et revixit homo et stetit super pedes suos";
kjv[22] = "But Hazael king of Syria oppressed Israel all the days of Jehoahaz.";
rsv[22] = "Now Haz\'ael king of Syria oppressed Israel all the days of Jeho\'ahaz.";
asv[22] = "And Hazael king of Syria oppressed Israel all the days of Jehoahaz.";
yng[22] = "And Hazael king of Aram hath oppressed Israel all the days of Jehoahaz,";
dby[22] = "And Hazael king of Syria oppressed Israel all the days of Jehoahaz.";
web[22] = "But Hazael king of Syria oppressed Israel all the days of Jehoahaz.";
hnv[22] = "Haza\'el king of Aram oppressed Yisra\'el all the days of Yeho\'achaz.";
vul[22] = "igitur Azahel rex Syriae adflixit Israhel cunctis diebus Ioachaz";
kjv[23] = "And the LORD was gracious unto them, and had compassion on them, and had respect unto them, because of his covenant with Abraham, Isaac, and Jacob, and would not destroy them, neither cast he them from his presence as yet.";
rsv[23] = "But the LORD was gracious to them and had compassion on them, and he turned toward them, because of his covenant with Abraham, Isaac, and Jacob, and would not destroy them; nor has he cast them from his presence until now.";
asv[23] = "But Jehovah was gracious unto them, and had compassion on them, and had respect unto them, because of his covenant with Abraham, Isaac, and Jacob, and would not destroy them, neither cast he them from his presence as yet.";
yng[23] = "and Jehovah doth favour them, and pity them, and turn unto them, for the sake of His covenant with Abraham, Isaac, and Jacob, and hath not been willing to destroy them, nor to cast them from His presence as yet.";
dby[23] = "And Jehovah was gracious to them, and had compassion on them, and had respect to them, because of his covenant with Abraham, Isaac, and Jacob; and he would not destroy them, neither did he cast them from his presence up to that time.";
web[23] = "And the LORD was gracious to them, and had compassion on them, and had respect to them, because of his covenant with Abraham, Isaac, and Jacob, and would not destroy them, neither did he as yet reject them from his presence.";
hnv[23] = "But the LORD was gracious to them, and had compassion on them, and had respect to them, because of his covenant with Avraham, Yitzchak, and Ya`akov, and would not destroy them, neither cast he them from his presence as yet.";
vul[23] = "et misertus est Dominus eorum et reversus est ad eos propter pactum suum quod habebat cum Abraham Isaac et Iacob et noluit disperdere eos neque proicere penitus usque in praesens tempus";
kjv[24] = "So Hazael king of Syria died; and Benhadad his son reigned in his stead.";
rsv[24] = "When Haz\'ael king of Syria died, Ben-ha\'dad his son became king in his stead.";
asv[24] = "And Hazael king of Syria died; and Benhadad his son reigned in his stead.";
yng[24] = "And Hazael king of Aram dieth, and reign doth Ben-Hadad his son in his stead,";
dby[24] = "And Hazael king of Syria died, and Ben-Hadad his son reigned in his stead.";
web[24] = "So Hazael king of Syria died; and Ben-hadad his son reigned in his stead.";
hnv[24] = "Haza\'el king of Aram died; and Ben-Hadad his son reigned in his place.";
vul[24] = "mortuus est autem Azahel rex Syriae et regnavit Benadad filius eius pro eo";
kjv[25] = "And Jehoash the son of Jehoahaz took again out of the hand of Benhadad the son of Hazael the cities, which he had taken out of the hand of Jehoahaz his father by war. Three times did Joash beat him, and recovered the cities of Israel.";
rsv[25] = "Then Jeho\'ash the son of Jeho\'ahaz took again from Ben-ha\'dad the son of Haz\'ael the cities which he had taken from Jeho\'ahaz his father in war. Three times Jo\'ash defeated him and recovered the cities of Israel.";
asv[25] = "And Jehoash the son of Jehoahaz took again out of the hand of Benhadad the son of Hazael the cities which he had taken out of the hand of Jehoahaz his father by war. Three times did Joash smite him, and recovered the cities of Israel.";
yng[25] = "and Jehoash son of Jehoahaz turneth and taketh the cities out of the hand of Ben-Hadad son of Hazael that he had taken out of the hand of Jehoahaz his father in war; three times hath Joash smitten him, and he bringeth back the cities of Israel.";
dby[25] = "And Jehoash the son of Jehoahaz took again out of the hand of Ben-Hadad the son of Hazael the cities which he had taken out of the hand of Jehoahaz his father in the war. Three times did Joash beat him, and recovered the cities of Israel.";
web[25] = "And Jehoash the son of Jehoahaz took again from the hand of Ben-hadad the son of Hazael the cities, which he had taken from the hand of Jehoahaz his father by war. Three times Joash defeated him, and recovered the cities of Israel.";
hnv[25] = "Yeho\'ash the son of Yeho\'achaz took again out of the hand of Ben-Hadad the son of Haza\'el the cities which he had taken out of the hand of Yeho\'achaz his father by war. Three times did Yo\'ash strike him, and recovered the cities of Yisra\'el.";
vul[25] = "porro Ioas filius Ioachaz tulit urbes de manu Benadad filii Azahel quas tulerat de manu Ioachaz patris sui iure proelii tribus vicibus percussit eum Ioas et reddidit civitates Israheli";
</script>
