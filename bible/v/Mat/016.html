csb[1] = "The Pharisees and Sadducees approached, and tested him, asking him to show them a sign from heaven.";
csb[2] = "He replied, &quot;When evening comes you say, \'It will be good weather because the sky is red.\'";
csb[3] = "&quot;And in the morning, \'Today will be stormy because the sky is red and threatening.\' You know how to read the appearance of the sky, but you can\'t read the signs of the times.";
csb[4] = "&quot;An evil and adulterous generation demands a sign, but no sign will be given to it except the sign of Jonah.&quot; Then he left them and went away.";
csb[5] = "The disciples reached the other shore, and they had forgotten to take bread.";
csb[6] = "Then Jesus told them, &quot;Watch out and beware of the leaven of the Pharisees and Sadducees.&quot;";
csb[7] = "They were discussing among themselves, &quot;We didn\'t bring any bread.&quot;";
csb[8] = "Aware of this, Jesus said, &quot;You of little faith, why are you discussing among yourselves that you do not have bread?";
csb[9] = "&quot;Don\'t you understand yet? Don\'t you remember the five loaves for the five thousand and how many baskets you collected?";
csb[10] = "&quot;Or the seven loaves for the four thousand and how many large baskets you collected?";
csb[11] = "&quot;Why is it you don\'t understand that when I told you, \'Beware of the leaven of the Pharisees and Sadducees,\' it wasn\'t about bread? &quot;";

csb[13] = "When Jesus came to the region of Caesarea Philippi, he asked his disciples, &quot;Who do people say that the Son of Man is? &quot;";
csb[14] = "They replied, &quot;Some say John the Baptist; others, Elijah; still others, Jeremiah or one of the prophets.&quot;";
csb[15] = "&quot;But you,&quot; he asked them, &quot;who do you say that I am? &quot;";
csb[16] = "Simon Peter answered, &quot;You are the Messiah, the Son of the living God.&quot;";
csb[17] = "Jesus responded, &quot;Blessed are you, Simon son of Jonah, because flesh and blood did not reveal this to you, but my Father in heaven.";

csb[19] = "&quot;I will give you the keys of the kingdom of heaven, and whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.&quot;";
csb[20] = "Then he gave the disciples orders to tell no one that he was the Messiah.";

csb[22] = "Peter took him aside and began to rebuke him, &quot;Oh no, Lord! This will never happen to you! &quot;";
csb[23] = "Jesus turned and told Peter, &quot;Get behind me, Satan! You are a hindrance to me because you\'re not thinking about God\'s concerns but human concerns.&quot;";
csb[24] = "Then Jesus said to his disciples, &quot;If anyone wants to follow after me, let him deny himself, take up his cross, and follow me.";

csb[27] = "&quot;For the Son of Man is going to come with his angels in the glory of his Father, and then he will reward each according to what he has done.";
