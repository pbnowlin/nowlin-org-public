csb[1] = "&quot;Do not judge, so that you won\'t be judged.";
csb[2] = "&quot;For you will be judged by the same standard with which you judge others, and you will be measured by the same measure you use.";
csb[3] = "&quot;Why do you look at the splinter in your brother\'s eye but don\'t notice the beam of wood in your own eye?";
csb[4] = "&quot;Or how can you say to your brother, \'Let me take the splinter out of your eye,\' and look, there\'s a beam of wood in your own eye?";
csb[5] = "&quot;Hypocrite! First take the beam of wood out of your eye, and then you will see clearly to take the splinter out of your brother\'s eye.";
csb[6] = "&quot;Don\'t give what is holy to dogs or toss your pearls before pigs, or they will trample them under their feet, turn, and tear you to pieces.";
csb[7] = "&quot;Ask, and it will be given to you. Seek, and you will find. Knock, and the door will be opened to you.";
csb[8] = "&quot;For everyone who asks receives, and the one who seeks finds, and to the one who knocks, the door will be opened.";
csb[9] = "&quot;Who among you, if his son asks him for bread, will give him a stone?";
csb[10] = "&quot;Or if he asks for a fish, will give him a snake?";
csb[11] = "&quot;If you then, who are evil, know how to give good gifts to your children, how much more will your Father in heaven give good things to those who ask him.";
csb[12] = "&quot;Therefore, whatever you want others to do for you, do also the same for them, for this is the Law and the Prophets.";
csb[13] = "&quot;Enter through the narrow gate. For the gate is wide and the road broad that leads to destruction, and there are many who go through it.";
csb[14] = "&quot;How narrow is the gate and difficult the road that leads to life, and few find it.";
csb[15] = "&quot;Be on your guard against false prophets who come to you in sheep\'s clothing but inwardly are ravaging wolves.";
csb[16] = "&quot;You\'ll recognize them by their fruit. Are grapes gathered from thornbushes or figs from thistles?";
csb[17] = "&quot;In the same way, every good tree produces good fruit, but a bad tree produces bad fruit.";
csb[18] = "&quot;A good tree can\'t produce bad fruit; neither can a bad tree produce good fruit.";
csb[19] = "&quot;Every tree that doesn\'t produce good fruit is cut down and thrown into the fire.";
csb[20] = "&quot;So you\'ll recognize them by their fruit.";
csb[21] = "&quot;Not everyone who says to me, \'Lord, Lord,\' will enter the kingdom of heaven, but only the one who does the will of my Father in heaven.";
csb[22] = "&quot;On that day many will say to me, \'Lord, Lord, didn\'t we prophesy in your name, drive out demons in your name, and do many miracles in your name? \'";
csb[23] = "&quot;Then I will announce to them, \'I never knew you. Depart from me, you lawbreakers! \'";
csb[24] = "&quot;Therefore, everyone who hears these words of mine and acts on them will be like a wise man who built his house on the rock.";
csb[25] = "&quot;The rain fell, the rivers rose, and the winds blew and pounded that house. Yet it didn\'t collapse, because its foundation was on the rock.";
csb[26] = "&quot;But everyone who hears these words of mine and doesn\'t act on them will be like a foolish man who built his house on the sand.";
csb[27] = "&quot;The rain fell, the rivers rose, the winds blew and pounded that house, and it collapsed. It collapsed with a great crash.&quot;";
csb[28] = "When Jesus had finished saying these things, the crowds were astonished at his teaching,";
csb[29] = "because he was teaching them like one who had authority, and not like their scribes.";
