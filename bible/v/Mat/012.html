csb[1] = "At that time Jesus passed through the grainfields on the Sabbath. His disciples were hungry and began to pick and eat some heads of grain.";
csb[2] = "When the Pharisees saw this, they said to him, &quot;See, your disciples are doing what is not lawful to do on the Sabbath.&quot;";
csb[3] = "He said to them, &quot;Haven\'t you read what David did when he and those who were with him were hungry:";
csb[4] = "&quot;how he entered the house of God, and they ate the bread of the Presence -- which is not lawful for him or for those with him to eat, but only for the priests?";
csb[5] = "&quot;Or haven\'t you read in the law that on Sabbath days the priests in the temple violate the Sabbath and are innocent?";
csb[6] = "&quot;I tell you that something greater than the temple is here.";
csb[7] = "&quot;If you had known what this means, I desire mercy and not sacrifice, you would not have condemned the innocent.";
csb[8] = "&quot;For the Son of Man is Lord of the Sabbath.&quot;";
csb[9] = "Moving on from there, he entered their synagogue.";
csb[10] = "There he saw a man who had a shriveled hand, and in order to accuse him they asked him, &quot;Is it lawful to heal on the Sabbath? &quot;";
csb[11] = "He replied to them, &quot;Who among you, if he had a sheep that fell into a pit on the Sabbath, wouldn\'t take hold of it and lift it out?";
csb[12] = "&quot;A person is worth far more than a sheep; so it is lawful to do what is good on the Sabbath.&quot;";
csb[13] = "Then he told the man, &quot;Stretch out your hand.&quot; So he stretched it out, and it was restored, as good as the other.";
csb[14] = "But the Pharisees went out and plotted against him, how they might kill him.";
csb[15] = "Jesus was aware of this and withdrew. Large crowds followed him, and he healed them all.";
csb[16] = "He warned them not to make him known,";
csb[17] = "so that what was spoken through the prophet Isaiah might be fulfilled:";
csb[18] = "Here is my servant whom I have chosen, my beloved in whom I delight; I will put my Spirit on him, and he will proclaim justice to the nations.";
csb[19] = "He will not argue or shout, and no one will hear his voice in the streets.";
csb[20] = "He will not break a bruised reed, and he will not put out a smoldering wick, until he has led justice to victory.";
csb[21] = "The nations will put their hope in his name.";
csb[22] = "Then a demon-possessed man who was blind and unable to speak was brought to him. He healed him, so that the man could both speak and see.";
csb[23] = "All the crowds were astounded and said, &quot;Could this be the Son of David? &quot;";
csb[24] = "When the Pharisees heard this, they said, &quot;This man drives out demons only by Beelzebul, the ruler of the demons.&quot;";
csb[25] = "Knowing their thoughts, he told them: &quot;Every kingdom divided against itself is headed for destruction, and no city or house divided against itself will stand.";
csb[26] = "&quot;If Satan drives out Satan, he is divided against himself. How then will his kingdom stand?";
csb[27] = "&quot;And if I drive out demons by Beelzebul, by whom do your sons drive them out? For this reason they will be your judges.";
csb[28] = "&quot;If I drive out demons by the Spirit of God, then the kingdom of God has come upon you.";
csb[29] = "&quot;How can someone enter a strong man\'s house and steal his possessions unless he first ties up the strong man? Then he can plunder his house.";
csb[30] = "&quot;Anyone who is not with me is against me, and anyone who does not gather with me scatters.";
csb[31] = "&quot;Therefore, I tell you, people will be forgiven every sin and blasphemy, but the blasphemy against the Spirit will not be forgiven.";
csb[32] = "&quot;Whoever speaks a word against the Son of Man, it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him, either in this age or in the one to come.";
csb[33] = "&quot;Either make the tree good and its fruit will be good, or make the tree bad and its fruit will be bad; for a tree is known by its fruit.";
csb[34] = "&quot;Brood of vipers! How can you speak good things when you are evil? For the mouth speaks from the overflow of the heart.";
csb[35] = "&quot;A good person produces good things from his storeroom of good, and an evil person produces evil things from his storeroom of evil.";
csb[36] = "&quot;I tell you that on the day of judgment people will have to account for every careless word they speak.";
csb[37] = "&quot;For by your words you will be acquitted, and by your words you will be condemned.&quot;";
csb[38] = "Then some of the scribes and Pharisees said to him, &quot;Teacher, we want to see a sign from you.&quot;";
csb[39] = "He answered them, &quot;An evil and adulterous generation demands a sign, but no sign will be given to it except the sign of the prophet Jonah.";
csb[40] = "&quot;For as Jonah was in the belly of the huge fish three days and three nights, so the Son of Man will be in the heart of the earth three days and three nights.";
csb[41] = "&quot;The men of Nineveh will stand up at the judgment with this generation and condemn it, because they repented at Jonah\'s preaching; and look -- something greater than Jonah is here.";
csb[42] = "&quot;The queen of the south will rise up at the judgment with this generation and condemn it, because she came from the ends of the earth to hear the wisdom of Solomon; and look -- something greater than Solomon is here.";
csb[43] = "&quot;When an unclean spirit comes out of a person, it roams through waterless places looking for rest but doesn\'t find any.";
csb[44] = "&quot;Then it says, \'I\'ll go back to my house that I came from.\' Returning, it finds the house vacant, swept, and put in order.";
csb[45] = "&quot;Then it goes and brings with it seven other spirits more evil than itself, and they enter and settle down there. As a result, that person\'s last condition is worse than the first. That\'s how it will also be with this evil generation.&quot;";
csb[46] = "While he was still speaking with the crowds, his mother and brothers were standing outside wanting to speak to him.";
csb[47] = "Someone told him, &quot;Look, your mother and your brothers are standing outside, wanting to speak to you.&quot;";
csb[48] = "He replied to the one who was speaking to him, &quot;Who is my mother and who are my brothers? &quot;";
csb[49] = "Stretching out his hand toward his disciples, he said, &quot;Here are my mother and my brothers!";
csb[50] = "&quot;For whoever does the will of my Father in heaven is my brother and sister and mother.&quot;";
