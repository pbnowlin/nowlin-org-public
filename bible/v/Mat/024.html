csb[1] = "As Jesus left and was going out of the temple, his disciples came up and called his attention to its buildings.";
csb[2] = "He replied to them, &quot;Do you see all these things? Truly I tell you, not one stone will be left here on another that will not be thrown down.&quot;";
csb[3] = "While he was sitting on the Mount of Olives, the disciples approached him privately and said, &quot;Tell us, when will these things happen? And what is the sign of your coming and of the end of the age? &quot;";
csb[4] = "Jesus replied to them: &quot;Watch out that no one deceives you.";
csb[5] = "&quot;For many will come in my name, saying, \'I am the Messiah,\' and they will deceive many.";
csb[6] = "&quot;You are going to hear of wars and rumors of wars. See that you are not alarmed, because these things must take place, but the end is not yet.";
csb[7] = "&quot;For nation will rise up against nation, and kingdom against kingdom. There will be famines and earthquakes in various places.";
csb[8] = "&quot;All these events are the beginning of labor pains.";
csb[9] = "&quot;Then they will hand you over to be persecuted, and they will kill you. You will be hated by all nations because of my name.";
csb[10] = "&quot;Then many will fall away, betray one another, and hate one another.";
csb[11] = "&quot;Many false prophets will rise up and deceive many.";
csb[12] = "&quot;Because lawlessness will multiply, the love of many will grow cold.";
csb[13] = "&quot;But the one who endures to the end will be saved.";
csb[14] = "&quot;This good news of the kingdom will be proclaimed in all the world as a testimony to all nations, and then the end will come.";
csb[15] = "&quot;So when you see the abomination of desolation, spoken of by the prophet Daniel, standing in the holy place&quot; (let the reader understand),";
csb[16] = "&quot;then those in Judea must flee to the mountains.";
csb[17] = "&quot;A man on the housetop must not come down to get things out of his house,";
csb[18] = "&quot;and a man in the field must not go back to get his coat.";
csb[19] = "&quot;Woe to pregnant women and nursing mothers in those days!";
csb[20] = "&quot;Pray that your escape may not be in winter or on a Sabbath.";
csb[21] = "&quot;For at that time there will be great distress, the kind that hasn\'t taken place from the beginning of the world until now and never will again.";
csb[22] = "&quot;Unless those days were cut short, no one would be saved. But those days will be cut short because of the elect.";
csb[23] = "&quot;If anyone tells you then, \'See, here is the Messiah! \' or, \'Over here! \' do not believe it.";
csb[24] = "&quot;For false messiahs and false prophets will arise and perform great signs and wonders to lead astray, if possible, even the elect.";
csb[25] = "&quot;Take note: I have told you in advance.";
csb[26] = "&quot;So if they tell you, \'See, he\'s in the wilderness! \' don\'t go out; or, \'See, he\'s in the storerooms! \' do not believe it.";
csb[27] = "&quot;For as the lightning comes from the east and flashes as far as the west, so will be the coming of the Son of Man.";
csb[28] = "&quot;Wherever the carcass is, there the vultures will gather.";
csb[29] = "&quot;Immediately after the distress of those days, the sun will be darkened, and the moon will not shed its light; the stars will fall from the sky, and the powers of the heavens will be shaken.";
csb[30] = "&quot;Then the sign of the Son of Man will appear in the sky, and then all the peoples of the earth will mourn; and they will see the Son of Man coming on the clouds of heaven with power and great glory.";
csb[31] = "&quot;He will send out his angels with a loud trumpet, and they will gather his elect from the four winds, from one end of the sky to the other.";
csb[32] = "&quot;Learn this lesson from the fig tree: As soon as its branch becomes tender and sprouts leaves, you know that summer is near.";
csb[33] = "&quot;In the same way, when you see all these things, recognize that he is near -- at the door.";
csb[34] = "&quot;Truly I tell you, this generation will certainly not pass away until all these things take place.";
csb[35] = "&quot;Heaven and earth will pass away, but my words will never pass away.";
csb[36] = "&quot;Now concerning that day and hour no one knows -- neither the angels of heaven nor the Son -- except the Father alone.";
csb[37] = "&quot;As the days of Noah were, so the coming of the Son of Man will be.";
csb[38] = "&quot;For in those days before the flood they were eating and drinking, marrying and giving in marriage, until the day Noah boarded the ark.";
csb[39] = "&quot;They didn\'t know until the flood came and swept them all away. This is the way the coming of the Son of Man will be.";
csb[40] = "&quot;Then two men will be in the field; one will be taken and one left.";
csb[41] = "&quot;Two women will be grinding grain with a hand mill; one will be taken and one left.";
csb[42] = "&quot;Therefore be alert, since you don\'t know what day your Lord is coming.";
csb[43] = "&quot;But know this: If the homeowner had known what time the thief was coming, he would have stayed alert and not let his house be broken into.";
csb[44] = "&quot;This is why you are also to be ready, because the Son of Man is coming at an hour you do not expect.";
csb[45] = "&quot;Who then is a faithful and wise servant, whom his master has put in charge of his household, to give them food at the proper time?";
csb[46] = "&quot;Blessed is that servant whom the master finds doing his job when he comes.";
csb[47] = "&quot;Truly I tell you, he will put him in charge of all his possessions.";
csb[48] = "&quot;But if that wicked servant says in his heart, \'My master is delayed,\'";
csb[49] = "&quot;and starts to beat his fellow servants, and eats and drinks with drunkards,";
csb[50] = "&quot;that servant\'s master will come on a day he does not expect him and at an hour he does not know.";
csb[51] = "&quot;He will cut him to pieces and assign him a place with the hypocrites, where there will be weeping and gnashing of teeth.";

hnv[23] = "&quot;Then if any man tells you, \'Behold, here is the Messiah,\' or, \'There,\' don\'t believe it.";
vul[23] = "tunc si quis vobis dixerit ecce hic Christus aut illic nolite credere";
kjv[24] = "For there shall arise false Christs, and false prophets, and shall shew great signs and wonders; insomuch that, if [it were] possible, they shall deceive the very elect.";
rsv[24] = "For false Christs and false prophets will arise and show great signs and wonders, so as to lead astray, if possible, even the elect.";
asv[24] = "For there shall arise false Christs, and false prophets, and shall show great signs and wonders; so as to lead astray, if possible, even the elect.";
yng[24] = "for there shall arise false Christs, and false prophets, and they shall give great signs and wonders, so as to lead astray, if possible, also the chosen.";
dby[24] = "For there shall arise false Christs, and false prophets, and shall give great signs and wonders, so as to mislead, if possible, even the elect.";
web[24] = "For false Christs will arise, and false prophets, and will show great signs and wonders; so that, if [it were] possible, they would deceive the very elect.";
hnv[24] = "For there will arise false messiahs, and false prophets, and they will show great signs and wonders, so as to lead astray, if possible, even the elect.";
vul[24] = "surgent enim pseudochristi et pseudoprophetae et dabunt signa magna et prodigia ita ut in errorem inducantur si fieri potest etiam electi";
kjv[25] = "Behold, I have told you before.";
rsv[25] = "Lo, I have told you beforehand.";
asv[25] = "Behold, I have told you beforehand.";
yng[25] = "Lo, I did tell you beforehand.";
dby[25] = "Behold, I have told you beforehand.";
web[25] = "Behold, I have told you before.";
hnv[25] = "&quot;Behold, I have told you beforehand.";
vul[25] = "ecce praedixi vobis";
kjv[26] = "Wherefore if they shall say unto you, Behold, he is in the desert; go not forth: behold, [he is] in the secret chambers; believe [it] not.";
rsv[26] = "So, if they say to you, \'Lo, he is in the wilderness,\' do not go out; if they say, \'Lo, he is in the inner rooms,\' do not believe it.";
asv[26] = "If therefore they shall say unto you, Behold, he is in the wilderness; go not forth: Behold, he is in the inner chambers; believe [it] not.";
yng[26] = "`If therefore they may say to you, Lo, in the wilderness he is, ye may not go forth; lo, in the inner chambers, ye may not believe;";
dby[26] = "If therefore they say to you, Behold, he is in the desert, go not forth; behold, [he is] in the inner chambers, do not believe [it].";
web[26] = "Wherefore, if they shall say to you, Behold, he is in the desert; go not forth: behold, [he is] in the secret chambers; believe [it] not.";
hnv[26] = "If therefore they tell you, \'Behold, he is in the wilderness,\' don\'t go out; \'Behold, he is in the inner chambers,\' don\'t believe it.";
vul[26] = "si ergo dixerint vobis ecce in deserto est nolite exire ecce in penetrabilibus nolite credere";
kjv[27] = "For as the lightning cometh out of the east, and shineth even unto the west; so shall also the coming of the Son of man be.";
rsv[27] = "For as the lightning comes from the east and shines as far as the west, so will be the coming of the Son of man.";
asv[27] = "For as the lightning cometh forth from the east, and is seen even unto the west; so shall be the coming of the Son of man.";
yng[27] = "for as the lightning doth come forth from the east, and doth appear unto the west, so shall be also the presence of the Son of Man;";
dby[27] = "For as the lightning goes forth from the east and shines to the west, so shall be the coming of the Son of man.";
web[27] = "For as the lightning cometh out of the east, and shineth even to the west; so shall also the coming of the Son of man be.";
hnv[27] = "For as the lightning comes forth from the east, and is seen even to the west, so will be the coming of the Son of Man.";
vul[27] = "sicut enim fulgur exit ab oriente et paret usque in occidente ita erit et adventus Filii hominis";
kjv[28] = "For wheresoever the carcase is, there will the eagles be gathered together.";
rsv[28] = "Wherever the body is, there the eagles will be gathered together.";
asv[28] = "Wheresoever the carcase is, there will the eagles be gathered together.";
yng[28] = "for wherever the carcase may be, there shall the eagles be gathered together.";
dby[28] = "[For] wherever the carcase is, there will be gathered the eagles.";
web[28] = "For wherever the carcass is, there will the eagles be collected.";
hnv[28] = "For wherever the carcass is, there will the vultures be gathered together.";
vul[28] = "ubicumque fuerit corpus illuc congregabuntur aquilae";
kjv[29] = "Immediately after the tribulation of those days shall the sun be darkened, and the moon shall not give her light, and the stars shall fall from heaven, and the powers of the heavens shall be shaken:";
rsv[29] = "&quot;Immediately after the tribulation of those days the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven, and the powers of the heavens will be shaken;";
asv[29] = "But immediately after the tribulation of those days the sun shall be darkened, and the moon shall not give her light, and the stars shall fall from heaven, and the powers of the heavens shall be shaken:";
yng[29] = "`And immediately after the tribulation of those days, the sun shall be darkened, and the moon shall not give her light, and the stars shall fall from the heaven, and the powers of the heavens shall be shaken;";
dby[29] = "But immediately after the tribulation of those days the sun shall be darkened, and the moon not give her light, and the stars shall fall from heaven, and the powers of the heavens shall be shaken.";
web[29] = "Immediately after the tribulation of those days, shall the sun be darkened, and the moon shall not give her light, and the stars shall fall from heaven, and the powers of the heavens shall be shaken:";
hnv[29] = "But immediately after the oppression of those days, the sun will be darkened, the moon will not give its light, the stars will fall from the sky, and the powers of the heavens will be shaken;";
vul[29] = "statim autem post tribulationem dierum illorum sol obscurabitur et luna non dabit lumen suum et stellae cadent de caelo et virtutes caelorum commovebuntur";
kjv[30] = "And then shall appear the sign of the Son of man in heaven: and then shall all the tribes of the earth mourn, and they shall see the Son of man coming in the clouds of heaven with power and great glory.";
rsv[30] = "then will appear the sign of the Son of man in heaven, and then all the tribes of the earth will mourn, and they will see the Son of man coming on the clouds of heaven with power and great glory;";
asv[30] = "and then shall appear the sign of the Son of man in heaven: and then shall all the tribes of the earth mourn, and they shall see the Son of man coming on the clouds of heaven with power and great glory.";
yng[30] = "and then shall appear the sign of the Son of Man in the heaven; and then shall all the tribes of the earth smite the breast, and they shall see the Son of Man coming upon the clouds of the heaven, with power and much glory;";
dby[30] = "And then shall appear the sign of the Son of man in heaven; and then shall all the tribes of the land lament, and they shall see the Son of man coming on the clouds of heaven with power and great glory.";
web[30] = "And then shall appear the sign of the Son of man in heaven: and then shall all the tribes of the earth mourn, and they shall see the Son of man coming in the clouds of heaven with power and great glory.";
hnv[30] = "and then the sign of the Son of Man will appear in the sky. Then all the tribes of the eretz will mourn, and they will see the Son of Man coming on the clouds of the sky with power and great glory.";
vul[30] = "et tunc parebit signum Filii hominis in caelo et tunc plangent omnes tribus terrae et videbunt Filium hominis venientem in nubibus caeli cum virtute multa et maiestate";
kjv[31] = "And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.";
rsv[31] = "and he will send out his angels with a loud trumpet call, and they will gather his elect from the four winds, from one end of heaven to the other.";
asv[31] = "And he shall send forth his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.";
yng[31] = "and he shall send his messengers with a great sound of a trumpet, and they shall gather together his chosen from the four winds, from the ends of the heavens unto the ends thereof.";
dby[31] = "And he shall send his angels with a great sound of trumpet, and they shall gather together his elect from the four winds, from [the one] extremity of [the] heavens to [the other] extremity of them.";
web[31] = "And he will send his angels with a great sound of a trumpet, and they will gather his elect from the four winds, from one end of heaven to the other.";
hnv[31] = "He will send out his angels with a great sound of a shofar, and they will gather together his elect from the four winds, from one end of the sky to the other.";
vul[31] = "et mittet angelos suos cum tuba et voce magna et congregabunt electos eius a quattuor ventis a summis caelorum usque ad terminos eorum";
kjv[32] = "Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer [is] nigh:";
rsv[32] = "&quot;From the fig tree learn its lesson: as soon as its branch becomes tender and puts forth its leaves, you know that summer is near.";
asv[32] = "Now from the fig tree learn her parable: when her branch is now become tender, and putteth forth its leaves, ye know that the summer is nigh;";
yng[32] = "`And from the fig-tree learn ye the simile: When already its branch may have become tender, and the leaves it may put forth, ye know that summer [is] nigh,";
dby[32] = "But learn the parable from the fig-tree: When already its branch becomes tender and produces leaves, ye know that the summer is near.";
web[32] = "Now learn a parable of the fig-tree; When its branch is yet tender and putteth forth leaves, ye know that summer [is] nigh:";
hnv[32] = "&quot;Now from the fig tree learn this parable. When its branch has now become tender, and puts forth its leaves, you know that the summer is near.";
vul[32] = "ab arbore autem fici discite parabolam cum iam ramus eius tener fuerit et folia nata scitis quia prope est aestas";
kjv[33] = "So likewise ye, when ye shall see all these things, know that it is near, [even] at the doors.";
rsv[33] = "So also, when you see all these things, you know that he is near, at the very gates.";
asv[33] = "even so ye also, when ye see all these things, know ye that he is nigh, [even] at the doors.";
yng[33] = "so also ye, when ye may see all these, ye know that it is nigh -- at the doors.";
dby[33] = "Thus also *ye*, when ye see all these things, know that it is near, at the doors.";
web[33] = "So likewise ye, when ye shall see all these things, know that it is near, [even at] the doors.";
hnv[33] = "Even so you also, when you see all these things, know that it is near, even at the doors.";
vul[33] = "ita et vos cum videritis haec omnia scitote quia prope est in ianuis";
kjv[34] = "Verily I say unto you, This generation shall not pass, till all these things be fulfilled.";
rsv[34] = "Truly, I say to you, this generation will not pass away till all these things take place.";
asv[34] = "Verily I say unto you, This generation shall not pass away, till all these things be accomplished.";
yng[34] = "Verily I say to you, this generation may not pass away till all these may come to pass.";
dby[34] = "Verily I say to you, This generation will not have passed away until all these things shall have taken place.";
web[34] = "Verily I say to you, This generation shall not pass, till all these things shall be fulfilled.";
hnv[34] = "Most assuredly I tell you, this generation will not pass away, until all these things are accomplished.";
vul[34] = "amen dico vobis quia non praeteribit haec generatio donec omnia haec fiant";
kjv[35] = "Heaven and earth shall pass away, but my words shall not pass away.";
rsv[35] = "Heaven and earth will pass away, but my words will not pass away.";
asv[35] = "Heaven and earth shall pass away, but my words shall not pass away.";
yng[35] = "The heaven and the earth shall pass away, but my words shall not pass away.";
dby[35] = "The heaven and the earth shall pass away, but my words shall in no wise pass away.";
web[35] = "Heaven and earth shall pass away, but my words shall not pass away.";
hnv[35] = "Heaven and eretz will pass away, but my words will not pass away.";
vul[35] = "caelum et terra transibunt verba vero mea non praeteribunt";
kjv[36] = "But of that day and hour knoweth no [man], no, not the angels of heaven, but my Father only.";
rsv[36] = "&quot;But of that day and hour no one knows, not even the angels of heaven, nor the Son, but the Father only.";
asv[36] = "But of that day and hour knoweth no one, not even the angels of heaven, neither the Son, but the Father only.";
yng[36] = "`And concerning that day and the hour no one hath known -- not even the messengers of the heavens -- except my Father only;";
dby[36] = "But of that day and hour no one knows, not even the angels of the heavens, but [my] Father alone.";
web[36] = "But of that day and hour knoweth no [man], no, not the angels of heaven, but my Father only.";
hnv[36] = "But no one knows of that day and hour, not even the angels of heaven, but my Father only.";
vul[36] = "de die autem illa et hora nemo scit neque angeli caelorum nisi Pater solus";
kjv[37] = "But as the days of Noe [were], so shall also the coming of the Son of man be.";

asv[37] = "And as [were] the days of Noah, so shall be the coming of the Son of man.";
yng[37] = "and as the days of Noah -- so shall be also the presence of the Son of Man;";
dby[37] = "But as the days of Noe, so also shall be the coming of the Son of man.";
web[37] = "But as the days of Noah [were], so will also the coming of the Son of man be.";
hnv[37] = "&quot;As the days of Noach were, so will be the coming of the Son of Man.";
vul[37] = "sicut autem in diebus Noe ita erit et adventus Filii hominis";
kjv[38] = "For as in the days that were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noe entered into the ark,";
rsv[38] = "For as in those days before the flood they were eating and drinking, marrying and giving in marriage, until the day when Noah entered the ark,";
asv[38] = "For as in those days which were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noah entered into the ark,";
yng[38] = "for as they were, in the days before the flood, eating, and drinking, marrying, and giving in marriage, till the day Noah entered into the ark,";
dby[38] = "For as they were in the days which were before the flood, eating and drinking, marrying and giving in marriage, until the day on which Noe entered into the ark,";
web[38] = "For as in the days that were before the flood, they were eating and drinking, marrying and giving in marriage, until the day that Noah entered into the ark,";
hnv[38] = "For as in those days which were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noach entered into the teivah,";
vul[38] = "sicut enim erant in diebus ante diluvium comedentes et bibentes nubentes et nuptum tradentes usque ad eum diem quo introivit in arcam Noe";
kjv[39] = "And knew not until the flood came, and took them all away; so shall also the coming of the Son of man be.";
rsv[39] = "and they did not know until the flood came and swept them all away, so will be the coming of the Son of man.";
asv[39] = "and they knew not until the flood came, and took them all away; so shall be the coming of the Son of man.";
yng[39] = "and they did not know till the flood came and took all away; so shall be also the presence of the Son of Man.";
dby[39] = "and they knew not till the flood came and took all away; thus also shall be the coming of the Son of man.";
web[39] = "And knew not until the flood came, and took them all away: so also will be the coming of the Son of man.";
hnv[39] = "and they didn\'t know until the flood came, and took them all away, so will be the coming of the Son of Man.";

kjv[40] = "Then shall two be in the field; the one shall be taken, and the other left.";
rsv[40] = "Then two men will be in the field; one is taken and one is left.";
asv[40] = "Then shall two men be in the field; one is taken, and one is left:";
yng[40] = "Then two men shall be in the field, the one is received, and the one is left;";
dby[40] = "Then two shall be in the field, one is taken and one is left;";
web[40] = "Then will two be in the field; the one shall be taken, and the other left.";
hnv[40] = "Then two men will be in the field: one will be taken and one will be left;";
vul[40] = "tunc duo erunt in agro unus adsumetur et unus relinquetur";
kjv[41] = "Two [women shall be] grinding at the mill; the one shall be taken, and the other left.";
rsv[41] = "Two women will be grinding at the mill; one is taken and one is left.";
asv[41] = "two women [shall be] grinding at the mill; one is taken, and one is left.";
yng[41] = "two women shall be grinding in the mill, one is received, and one is left.";
dby[41] = "two [women] grinding at the mill, one is taken and one is left.";
web[41] = "Two [women will be] grinding at the mill; the one shall be taken, and the other left.";
hnv[41] = "two women grinding at the mill, one will be taken and one will be left.";

kjv[42] = "Watch therefore: for ye know not what hour your Lord doth come.";
rsv[42] = "Watch therefore, for you do not know on what day your Lord is coming.";
asv[42] = "Watch therefore: for ye know not on what day your Lord cometh.";
yng[42] = "`Watch ye therefore, because ye have not known in what hour your Lord doth come;";
dby[42] = "Watch therefore, for ye know not in what hour your Lord comes.";
web[42] = "Watch therefore; for ye know not what hour your Lord cometh.";
hnv[42] = "Watch therefore, for you don\'t know in what hour your Lord comes.";
vul[42] = "vigilate ergo quia nescitis qua hora Dominus vester venturus sit";
kjv[43] = "But know this, that if the goodman of the house had known in what watch the thief would come, he would have watched, and would not have suffered his house to be broken up.";
rsv[43] = "But know this, that if the householder had known in what part of the night the thief was coming, he would have watched and would not have let his house be broken into.";
asv[43] = "But know this, that if the master of the house had known in what watch the thief was coming, he would have watched, and would not have suffered his house to be broken through.";
yng[43] = "and this know, that if the master of the house had known in what watch the thief doth come, he had watched, and not suffered his house to be broken through;";
dby[43] = "But know this, that if the master of the house had known in what watch the thief was coming, he would have watched and not have suffered his house to be dug through [into].";
web[43] = "But know this, that if the master of the house knew in what watch the thief would come, he would watch, and would not suffer his house to be broken up.";
hnv[43] = "But know this, that if the master of the house had known in what watch of the night the thief was coming, he would have watched, and would not have allowed his house to be broken into.";
vul[43] = "illud autem scitote quoniam si sciret pater familias qua hora fur venturus esset vigilaret utique et non sineret perfodiri domum suam";
kjv[44] = "Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh.";
rsv[44] = "Therefore you also must be ready; for the Son of man is coming at an hour you do not expect.";
asv[44] = "Therefore be ye also ready; for in an hour that ye think not the Son of man cometh.";
yng[44] = "because of this also ye, become ye ready, because in what hour ye do not think, the Son of Man doth come.";
dby[44] = "Wherefore *ye* also, be ye ready, for in that hour that ye think not the Son of man comes.";
web[44] = "Therefore be ye also ready: for in such an hour as ye think not, the Son of man cometh.";
hnv[44] = "Therefore also be ready, for in an hour that you don\'t expect, the Son of Man will come.";
vul[44] = "ideoque et vos estote parati quia qua nescitis hora Filius hominis venturus est";
kjv[45] = "Who then is a faithful and wise servant, whom his lord hath made ruler over his household, to give them meat in due season?";
rsv[45] = "&quot;Who then is the faithful and wise servant, whom his master has set over his household, to give them their food at the proper time?";
asv[45] = "Who then is the faithful and wise servant, whom his lord hath set over his household, to give them their food in due season?";
yng[45] = "`Who, then, is the servant, faithful and wise, whom his lord did set over his household, to give them the nourishment in season?";
dby[45] = "Who then is the faithful and prudent bondman whom his lord has set over his household, to give them food in season?";
web[45] = "Who then is a faithful and wise servant, whom his Lord hath made ruler over his household, to give them food in due season?";
hnv[45] = "&quot;Who then is the faithful and wise servant, whom his lord has set over his household, to give them their food in due season?";
vul[45] = "quis putas est fidelis servus et prudens quem constituit dominus suus supra familiam suam ut det illis cibum in tempore";
kjv[46] = "Blessed [is] that servant, whom his lord when he cometh shall find so doing.";
rsv[46] = "Blessed is that servant whom his master when he comes will find so doing.";
asv[46] = "Blessed is that servant, whom his lord when he cometh shall find so doing.";
yng[46] = "Happy that servant, whom his lord, having come, shall find doing so;";
dby[46] = "Blessed is that bondman whom his lord on coming shall find doing thus.";
web[46] = "Blessed [is] that servant, whom his lord, when he cometh, shall find so doing.";
hnv[46] = "Blessed is that servant whom his lord finds doing so when he comes.";
vul[46] = "beatus ille servus quem cum venerit dominus eius invenerit sic facientem";
kjv[47] = "Verily I say unto you, That he shall make him ruler over all his goods.";
rsv[47] = "Truly, I say to you, he will set him over all his possessions.";
asv[47] = "Verily I say unto you, that he will set him over all that he hath.";
yng[47] = "verily I say to you, that over all his substance he will set him.";
dby[47] = "Verily I say unto you, that he will set him over all his substance.";
web[47] = "Verily I say to you, that he will make him ruler over all his goods.";
hnv[47] = "Most assuredly I tell you that he will set him over all that he has.";
vul[47] = "amen dico vobis quoniam super omnia bona sua constituet eum";

rsv[48] = "But if that wicked servant says to himself, \'My master is delayed,\'";
asv[48] = "But if that evil servant shall say in his heart, My lord tarrieth;";
yng[48] = "`And, if that evil servant may say in his heart, My Lord doth delay to come,";
dby[48] = "But if that evil bondman should say in his heart, My lord delays to come,";

hnv[48] = "But if that evil servant should say in his heart, \'My lord is delaying his coming,\'";

yng[49] = "and may begin to beat the fellow-servants, and to eat and to drink with the drunken,";
dby[49] = "and begin to beat his fellow-bondmen, and eat and drink with the drunken;";
web[49] = "And shall begin to beat [his] fellow-servants, and to eat and drink with the drunken;";
hnv[49] = "and begins to beat his fellow-servants, and eat and drink with the drunken,";
