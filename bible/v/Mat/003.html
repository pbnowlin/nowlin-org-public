csb[1] = "In those days John the Baptist came, preaching in the wilderness of Judea";
csb[2] = "and saying, &quot;Repent, because the kingdom of heaven has come near! &quot;";
csb[3] = "For he is the one spoken of through the prophet Isaiah, who said: A voice of one crying out in the wilderness: Prepare the way for the Lord; make his paths straight!";

csb[14] = "But John tried to stop him, saying, &quot;I need to be baptized by you, and yet you come to me? &quot;";
