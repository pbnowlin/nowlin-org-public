csb[1] = "&quot;At that time the kingdom of heaven will be like ten virgins who took their lamps and went out to meet the groom.";
csb[2] = "&quot;Five of them were foolish and five were wise.";
csb[3] = "&quot;When the foolish took their lamps, they didn\'t take oil with them;";
csb[4] = "&quot;but the wise ones took oil in their flasks with their lamps.";
csb[5] = "&quot;When the groom was delayed, they all became drowsy and fell asleep.";
csb[6] = "&quot;In the middle of the night there was a shout: \'Here\'s the groom! Come out to meet him.\'";
csb[7] = "&quot;Then all the virgins got up and trimmed their lamps.";
csb[8] = "&quot;The foolish ones said to the wise ones, \'Give us some of your oil, because our lamps are going out.\'";
csb[9] = "&quot;The wise ones answered, \'No, there won\'t be enough for us and for you. Go instead to those who sell oil, and buy some for yourselves.\'";
csb[10] = "&quot;When they had gone to buy some, the groom arrived, and those who were ready went in with him to the wedding banquet, and the door was shut.";
csb[11] = "&quot;Later the rest of the virgins also came and said, \'Master, master, open up for us! \'";
csb[12] = "&quot;He replied, \'Truly I tell you, I don\'t know you! \'";
csb[13] = "&quot;Therefore be alert, because you don\'t know either the day or the hour.";
csb[14] = "&quot;For it is just like a man about to go on a journey. He called his own servants and entrusted his possessions to them.";
csb[15] = "&quot;To one he gave five talents, to another two talents, and to another one talent, depending on each one\'s ability. Then he went on a journey. Immediately";
csb[16] = "&quot;the man who had received five talents went, put them to work, and earned five more.";
csb[17] = "&quot;In the same way the man with two earned two more.";
csb[18] = "&quot;But the man who had received one talent went off, dug a hole in the ground, and hid his master\'s money.";
csb[19] = "&quot;After a long time the master of those servants came and settled accounts with them.";
csb[20] = "&quot;The man who had received five talents approached, presented five more talents, and said, \'Master, you gave me five talents. See, I\'ve earned five more talents.\'";
csb[21] = "&quot;His master said to him, \'Well done, good and faithful servant! You were faithful over a few things; I will put you in charge of many things. Share your master\'s joy.\'";
csb[22] = "&quot;The man with two talents also approached. He said, \'Master, you gave me two talents. See, I\'ve earned two more talents.\'";
csb[23] = "&quot;His master said to him, \'Well done, good and faithful servant! You were faithful over a few things; I will put you in charge of many things. Share your master\'s joy.\'";
csb[24] = "&quot;The man who had received one talent also approached and said, \'Master, I know you. You\'re a harsh man, reaping where you haven\'t sown and gathering where you haven\'t scattered seed.";
csb[25] = "&quot;So I was afraid and went off and hid your talent in the ground. See, you have what is yours.\'";
csb[26] = "&quot;His master replied to him, \'You evil, lazy servant! If you knew that I reap where I haven\'t sown and gather where I haven\'t scattered,";
csb[27] = "&quot;then you should have deposited my money with the bankers, and I would have received my money back with interest when I returned.";
csb[28] = "&quot; \'So take the talent from him and give it to the one who has ten talents.";
csb[29] = "&quot;For to everyone who has, more will be given, and he will have more than enough. But from the one who does not have, even what he has will be taken away from him.";
csb[30] = "&quot;And throw this good-for-nothing servant into the outer darkness, where there will be weeping and gnashing of teeth.\'";
csb[31] = "&quot;When the Son of Man comes in his glory, and all the angels with him, then he will sit on his glorious throne.";
csb[32] = "&quot;All the nations will be gathered before him, and he will separate them one from another, just as a shepherd separates the sheep from the goats.";
csb[33] = "&quot;He will put the sheep on his right and the goats on the left.";
csb[34] = "&quot;Then the King will say to those on his right, \'Come, you who are blessed by my Father; inherit the kingdom prepared for you from the foundation of the world.";
csb[35] = "&quot; \'For I was hungry and you gave me something to eat; I was thirsty and you gave me something to drink; I was a stranger and you took me in;";
csb[36] = "&quot;I was naked and you clothed me; I was sick and you took care of me; I was in prison and you visited me.\'";
csb[37] = "&quot;Then the righteous will answer him, \'Lord, when did we see you hungry and feed you, or thirsty and give you something to drink?";
csb[38] = "&quot;When did we see you a stranger and take you in, or without clothes and clothe you?";
csb[39] = "&quot;When did we see you sick, or in prison, and visit you? \'";
csb[40] = "&quot;And the King will answer them, \'Truly I tell you, whatever you did for one of the least of these brothers and sisters of mine, you did for me.\'";
csb[41] = "&quot;Then he will also say to those on the left, \'Depart from me, you who are cursed, into the eternal fire prepared for the devil and his angels!";
csb[42] = "&quot;For I was hungry and you gave me nothing to eat; I was thirsty and you gave me nothing to drink;";
csb[43] = "&quot;I was a stranger and you didn\'t take me in; I was naked and you didn\'t clothe me, sick and in prison and you didn\'t take care of me.\'";
csb[44] = "&quot;Then they too will answer, \'Lord, when did we see you hungry, or thirsty, or a stranger, or without clothes, or sick, or in prison, and not help you? \'";
csb[45] = "&quot;Then he will answer them, \'I tell you, whatever you did not do for one of the least of these, you did not do for me.\'";
csb[46] = "&quot;And they will go away into eternal punishment, but the righteous into eternal life.&quot;";
kjv[1] = "Then shall the kingdom of heaven be likened unto ten virgins, which took their lamps, and went forth to meet the bridegroom.";

kjv[3] = "They that [were] foolish took their lamps, and took no oil with them:";
kjv[4] = "But the wise took oil in their vessels with their lamps.";
kjv[5] = "While the bridegroom tarried, they all slumbered and slept.";
kjv[6] = "And at midnight there was a cry made, Behold, the bridegroom cometh; go ye out to meet him.";
kjv[7] = "Then all those virgins arose, and trimmed their lamps.";
kjv[8] = "And the foolish said unto the wise, Give us of your oil; for our lamps are gone out.";
kjv[9] = "But the wise answered, saying, [Not so]; lest there be not enough for us and you: but go ye rather to them that sell, and buy for yourselves.";
kjv[10] = "And while they went to buy, the bridegroom came; and they that were ready went in with him to the marriage: and the door was shut.";
kjv[11] = "Afterward came also the other virgins, saying, Lord, Lord, open to us.";
kjv[12] = "But he answered and said, Verily I say unto you, I know you not.";
kjv[13] = "Watch therefore, for ye know neither the day nor the hour wherein the Son of man cometh.";
kjv[14] = "For [the kingdom of heaven is] as a man travelling into a far country, [who] called his own servants, and delivered unto them his goods.";
kjv[15] = "And unto one he gave five talents, to another two, and to another one; to every man according to his several ability; and straightway took his journey.";
kjv[16] = "Then he that had received the five talents went and traded with the same, and made [them] other five talents.";
kjv[17] = "And likewise he that [had received] two, he also gained other two.";
kjv[18] = "But he that had received one went and digged in the earth, and hid his lord\'s money.";
kjv[19] = "After a long time the lord of those servants cometh, and reckoneth with them.";
kjv[20] = "And so he that had received five talents came and brought other five talents, saying, Lord, thou deliveredst unto me five talents: behold, I have gained beside them five talents more.";
kjv[21] = "His lord said unto him, Well done, [thou] good and faithful servant: thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.";
kjv[22] = "He also that had received two talents came and said, Lord, thou deliveredst unto me two talents: behold, I have gained two other talents beside them.";
kjv[23] = "His lord said unto him, Well done, good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.";
kjv[24] = "Then he which had received the one talent came and said, Lord, I knew thee that thou art an hard man, reaping where thou hast not sown, and gathering where thou hast not strawed:";
kjv[25] = "And I was afraid, and went and hid thy talent in the earth: lo, [there] thou hast [that is] thine.";
kjv[26] = "His lord answered and said unto him, [Thou] wicked and slothful servant, thou knewest that I reap where I sowed not, and gather where I have not strawed:";
kjv[27] = "Thou oughtest therefore to have put my money to the exchangers, and [then] at my coming I should have received mine own with usury.";
kjv[28] = "Take therefore the talent from him, and give [it] unto him which hath ten talents.";
kjv[29] = "For unto every one that hath shall be given, and he shall have abundance: but from him that hath not shall be taken away even that which he hath.";
kjv[30] = "And cast ye the unprofitable servant into outer darkness: there shall be weeping and gnashing of teeth.";
kjv[31] = "When the Son of man shall come in his glory, and all the holy angels with him, then shall he sit upon the throne of his glory:";
kjv[32] = "And before him shall be gathered all nations: and he shall separate them one from another, as a shepherd divideth [his] sheep from the goats:";
kjv[33] = "And he shall set the sheep on his right hand, but the goats on the left.";
kjv[34] = "Then shall the King say unto them on his right hand, Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world:";
kjv[35] = "For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:";
kjv[36] = "Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me.";
kjv[37] = "Then shall the righteous answer him, saying, Lord, when saw we thee an hungred, and fed [thee]? or thirsty, and gave [thee] drink?";
kjv[38] = "When saw we thee a stranger, and took [thee] in? or naked, and clothed [thee]?";
kjv[39] = "Or when saw we thee sick, or in prison, and came unto thee?";
kjv[40] = "And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done [it] unto one of the least of these my brethren, ye have done [it] unto me.";
kjv[41] = "Then shall he say also unto them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels:";
kjv[42] = "For I was an hungred, and ye gave me no meat: I was thirsty, and ye gave me no drink:";
kjv[43] = "I was a stranger, and ye took me not in: naked, and ye clothed me not: sick, and in prison, and ye visited me not.";
kjv[44] = "Then shall they also answer him, saying, Lord, when saw we thee an hungred, or athirst, or a stranger, or naked, or sick, or in prison, and did not minister unto thee?";
kjv[45] = "Then shall he answer them, saying, Verily I say unto you, Inasmuch as ye did [it] not to one of the least of these, ye did [it] not to me.";
kjv[46] = "And these shall go away into everlasting punishment: but the righteous into life eternal.";

vul[20] = "et accedens qui quinque talenta acceperat obtulit alia quinque talenta dicens domine quinque talenta mihi tradidisti ecce alia quinque superlucratus sum";
rsv[21] = "His master said to him, \'Well done, good and faithful servant; you have been faithful over a little, I will set you over much; enter into the joy of your master.\'";
asv[21] = "His lord said unto him, Well done, good and faithful servant: thou hast been faithful over a few things, I will set thee over many things; enter thou into the joy of thy lord.";
yng[21] = "`And his lord said to him, Well done, servant, good and faithful, over a few things thou wast faithful, over many things I will set thee; enter into the joy of thy lord.";
dby[21] = "His lord said to him, Well, good and faithful bondman, thou wast faithful over a few things, I will set thee over many things: enter into the joy of thy lord.";
web[21] = "His lord said to him, Well done [thou] good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.";
hnv[21] = "&quot;His lord said to him, \'Well done, good and faithful servant. You have been faithful over a few things, I will set you over many things. Enter into the joy of your lord.\'";
vul[21] = "ait illi dominus eius euge bone serve et fidelis quia super pauca fuisti fidelis super multa te constituam intra in gaudium domini tui";
rsv[22] = "And he also who had the two talents came forward, saying, \'Master, you delivered to me two talents; here I have made two talents more.\'";
asv[22] = "And he also that [received] the two talents came and said, Lord, thou deliveredst unto me two talents: lo, I have gained other two talents.";
yng[22] = "`And he who also did receive the two talents having come, said, Sir, two talents thou didst deliver to me; lo, other two talents I did gain besides them.";
dby[22] = "And he also that had received the two talents came to [him] and said, [My] lord, thou deliveredst me two talents; behold, I have gained two other talents besides them.";
web[22] = "He also that had received two talents came, and said, Lord, thou deliveredst to me two talents: behold, I have gained two other talents besides them.";
hnv[22] = "&quot;He also who got the two talents came and said, \'Lord, you delivered to me two talents. Behold, I have gained another two talents besides them.\'";
vul[22] = "accessit autem et qui duo talenta acceperat et ait domine duo talenta tradidisti mihi ecce alia duo lucratus sum";
rsv[23] = "His master said to him, \'Well done, good and faithful servant; you have been faithful over a little, I will set you over much; enter into the joy of your master.\'";
asv[23] = "His lord said unto him, Well done, good and faithful servant: thou hast been faithful over a few things, I will set thee over many things; enter thou into the joy of thy lord.";
yng[23] = "`His lord said to him, Well done, servant, good and faithful, over a few things thou wast faithful, over many things I will set thee; enter into the joy of thy lord.";
dby[23] = "His lord said to him, Well, good and faithful bondman, thou wast faithful over a few things, I will set thee over many things: enter thou into the joy of thy lord.";
web[23] = "His lord said to him, Well done, good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.";
hnv[23] = "&quot;His lord said to him, \'Well done, good and faithful servant. You have been faithful over a few things, I will set you over many things. Enter into the joy of your lord.\'";
vul[23] = "ait illi dominus eius euge serve bone et fidelis quia super pauca fuisti fidelis supra multa te constituam intra in gaudium domini tui";
rsv[24] = "He also who had received the one talent came forward, saying, \'Master, I knew you to be a hard man, reaping where you did not sow, and gathering where you did not winnow;";
asv[24] = "And he also that had received the one talent came and said, Lord, I knew thee that thou art a hard man, reaping where thou didst not sow, and gathering where thou didst not scatter;";
yng[24] = "`And he also who hath received the one talent having come, said, Sir, I knew thee, that thou art a hard man, reaping where thou didst not sow, and gathering from whence thou didst not scatter;";
dby[24] = "And he also that had received the one talent coming to [him] said, [My] lord, I knew thee that thou art a hard man, reaping where thou hadst not sowed, and gathering from where thou hadst not scattered,";
web[24] = "Then he who had received the one talent came, and said, Lord, I knew thee that thou art a hard man, reaping where thou hast not sown, and gathering where thou hast not strewed:";
hnv[24] = "&quot;He also who had received the one talent came and said, \'Lord, I knew you that you are a hard man, reaping where you did not sow, and gathering where you did not scatter.";
vul[24] = "accedens autem et qui unum talentum acceperat ait domine scio quia homo durus es metis ubi non seminasti et congregas ubi non sparsisti";
rsv[25] = "so I was afraid, and I went and hid your talent in the ground. Here you have what is yours.\'";
asv[25] = "and I was afraid, and went away and hid thy talent in the earth: lo, thou hast thine own.";
yng[25] = "and having been afraid, having gone away, I hid thy talent in the earth; lo, thou hast thine own!";
dby[25] = "and being afraid I went away and hid thy talent in the earth; behold, thou hast that which is thine.";
web[25] = "And I was afraid, and went and hid thy talent in the earth: lo, [there] thou hast [what is] thine.";
hnv[25] = "I was afraid, and went away and hid your talent in the eretz. Behold, you have what is yours.\'";
vul[25] = "et timens abii et abscondi talentum tuum in terra ecce habes quod tuum est";
rsv[26] = "But his master answered him, \'You wicked and slothful servant! You knew that I reap where I have not sowed, and gather where I have not winnowed?";
asv[26] = "But his lord answered and said unto him, Thou wicked and slothful servant, thou knewest that I reap where I sowed not, and gather where I did not scatter;";
yng[26] = "`And his lord answering said to him, Evil servant, and slothful, thou hadst known that I reap where I did not sow, and I gather whence I did not scatter!";
dby[26] = "And his lord answering said to him, Wicked and slothful bondman, thou knewest that I reap where I had not sowed, and gather from where I had not scattered;";
web[26] = "His lord answered and said to him, [Thou] wicked and slothful servant, thou knewest that I reap where I have not sown, and gather where I have not strewed:";
hnv[26] = "&quot;But his lord answered him, \'You wicked and slothful servant. You knew that I reap where I didn\'t sow, and gather where I didn\'t scatter.";
vul[26] = "respondens autem dominus eius dixit ei serve male et piger sciebas quia meto ubi non semino et congrego ubi non sparsi";
rsv[27] = "Then you ought to have invested my money with the bankers, and at my coming I should have received what was my own with interest.";
asv[27] = "thou oughtest therefore to have put my money to the bankers, and at my coming I should have received back mine own with interest.";
yng[27] = "it behoved thee then to put my money to the money-lenders, and having come I had received mine own with increase.";
dby[27] = "thou oughtest then to have put my money to the money-changers, and when I came I should have got what is mine with interest.";
web[27] = "Thou oughtest therefore to have put my money to the exchangers, and [then] at my coming I should have received my own with interest.";
hnv[27] = "You ought therefore to have deposited my money with the bankers, and at my coming I should have received back my own with interest.";
vul[27] = "oportuit ergo te mittere pecuniam meam nummulariis et veniens ego recepissem utique quod meum est cum usura";
rsv[28] = "So take the talent from him, and give it to him who has the ten talents.";
asv[28] = "Take ye away therefore the talent from him, and give it unto him that hath the ten talents.";
yng[28] = "`Take therefore from him the talent, and give to him having the ten talents,";
dby[28] = "Take therefore the talent from him, and give it to him that has the ten talents:";
web[28] = "Take therefore the talent from him, and give [it] to him who hath ten talents.";
hnv[28] = "Take away therefore the talent from him, and give it to him who has the ten talents.";
vul[28] = "tollite itaque ab eo talentum et date ei qui habet decem talenta";
rsv[29] = "For to every one who has will more be given, and he will have abundance; but from him who has not, even what he has will be taken away.";
asv[29] = "For unto every one that hath shall be given, and he shall have abundance: but from him that hath not, even that which he hath shall be taken away.";
yng[29] = "for to every one having shall be given, and he shall have overabundance, and from him who is not having, even that which he hath shall be taken from him;";
dby[29] = "for to every one that has shall be given, and he shall be in abundance; but from him that has not, that even which he has shall be taken from him.";
web[29] = "For to every one that hath shall be given, and he shall have abundance: but from him that hath not shall be taken away even that which he hath.";
hnv[29] = "For to everyone who has will be given, and he will have abundance, but from him who has not, even that which he has will be taken away.";
vul[29] = "omni enim habenti dabitur et abundabit ei autem qui non habet et quod videtur habere auferetur ab eo";
rsv[30] = "And cast the worthless servant into the outer darkness; there men will weep and gnash their teeth.\'";
asv[30] = "And cast ye out the unprofitable servant into the outer darkness: there shall be the weeping and the gnashing of teeth.";
yng[30] = "and the unprofitable servant cast ye forth to the outer darkness; there shall be the weeping and the gnashing of the teeth.";
dby[30] = "And cast out the useless bondman into the outer darkness; there shall be the weeping and the gnashing of teeth.";
web[30] = "And cast ye the unprofitable servant into utter darkness: there shall be weeping and gnashing of teeth.";
hnv[30] = "Throw out the unprofitable servant into the outer darkness, where there will be weeping and gnashing of teeth.\'";
vul[30] = "et inutilem servum eicite in tenebras exteriores illic erit fletus et stridor dentium";
rsv[31] = "&quot;When the Son of man comes in his glory, and all the angels with him, then he will sit on his glorious throne.";
asv[31] = "But when the Son of man shall come in his glory, and all the angels with him, then shall he sit on the throne of his glory:";
yng[31] = "`And whenever the Son of Man may come in his glory, and all the holy messengers with him, then he shall sit upon a throne of his glory;";
dby[31] = "But when the Son of man comes in his glory, and all the angels with him, then shall he sit down upon his throne of glory,";
web[31] = "When the Son of man shall come in his glory, and all the holy angels with him, then will he sit upon the throne of his glory:";
hnv[31] = "&quot;But when the Son of Man comes in his glory, and all the holy angels with him, then he will sit on the throne of his glory.";
vul[31] = "cum autem venerit Filius hominis in maiestate sua et omnes angeli cum eo tunc sedebit super sedem maiestatis suae";
rsv[32] = "Before him will be gathered all the nations, and he will separate them one from another as a shepherd separates the sheep from the goats,";
asv[32] = "and before him shall be gathered all the nations: and he shall separate them one from another, as the shepherd separateth the sheep from the goats;";
yng[32] = "and gathered together before him shall be all the nations, and he shall separate them from one another, as the shepherd doth separate the sheep from the goats,";
dby[32] = "and all the nations shall be gathered before him; and he shall separate them from one another, as the shepherd separates the sheep from the goats;";
web[32] = "And before him shall be gathered all nations: and he will separate them one from another, as a shepherd divideth [his] sheep from the goats:";
hnv[32] = "Before him all the nations will be gathered, and he will separate them one from another, as a shepherd separates the sheep from the goats.";
vul[32] = "et congregabuntur ante eum omnes gentes et separabit eos ab invicem sicut pastor segregat oves ab hedis";
rsv[33] = "and he will place the sheep at his right hand, but the goats at the left.";
asv[33] = "and he shall set the sheep on his right hand, but the goats on the left.";
yng[33] = "and he shall set the sheep indeed on his right hand, and the goats on the left.";
dby[33] = "and he will set the sheep on his right hand, and the goats on [his] left.";
web[33] = "And he will set the sheep on his right hand, but the goats on the left.";
hnv[33] = "He will set the sheep on his right hand, but the goats on the left.";
vul[33] = "et statuet oves quidem a dextris suis hedos autem a sinistris";
rsv[34] = "Then the King will say to those at his right hand, \'Come, O blessed of my Father, inherit the kingdom prepared for you from the foundation of the world;";
asv[34] = "Then shall the King say unto them on his right hand, Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world:";
yng[34] = "`Then shall the king say to those on his right hand, Come ye, the blessed of my Father, inherit the reign that hath been prepared for you from the foundation of the world;";
dby[34] = "Then shall the King say to those on his right hand, Come, blessed of my Father, inherit the kingdom prepared for you from [the] world\'s foundation:";
web[34] = "Then will the King say to them on his right hand, Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world:";
hnv[34] = "Then the King will tell those on his right hand, \'Come, blessed of my Father, inherit the kingdom prepared for you from the foundation of the world;";
vul[34] = "tunc dicet rex his qui a dextris eius erunt venite benedicti Patris mei possidete paratum vobis regnum a constitutione mundi";
rsv[35] = "for I was hungry and you gave me food, I was thirsty and you gave me drink, I was a stranger and you welcomed me,";
asv[35] = "for I was hungry, and ye gave me to eat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in;";
yng[35] = "for I did hunger, and ye gave me to eat; I did thirst, and ye gave me to drink; I was a stranger, and ye received me;";
dby[35] = "for I hungered, and ye gave me to eat; I thirsted, and ye gave me to drink; I was a stranger, and ye took me in;";
web[35] = "For I was hungry, and ye gave me food: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:";
hnv[35] = "for I was hungry, and you gave me food to eat; I was thirsty, and you gave me drink; I was a stranger, and you took me in;";
vul[35] = "esurivi enim et dedistis mihi manducare sitivi et dedistis mihi bibere hospes eram et collexistis me";
rsv[36] = "I was naked and you clothed me, I was sick and you visited me, I was in prison and you came to me.\'";
asv[36] = "naked, and ye clothed me; I was sick, and ye visited me; I was in prison, and ye came unto me.";
yng[36] = "naked, and ye put around me; I was infirm, and ye looked after me; in prison I was, and ye came unto me.";
dby[36] = "naked, and ye clothed me; I was ill, and ye visited me; I was in prison, and ye came to me.";
web[36] = "Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came to me.";
hnv[36] = "naked, and you clothed me; I was sick, and you visited me; I was in prison, and you came to me.\'";
vul[36] = "nudus et operuistis me infirmus et visitastis me in carcere eram et venistis ad me";
rsv[37] = "Then the righteous will answer him, \'Lord, when did we see thee hungry and feed thee, or thirsty and give thee drink?";
asv[37] = "Then shall the righteous answer him, saying, Lord, when saw we thee hungry, and fed thee? or athirst, and gave thee drink?";
yng[37] = "`Then shall the righteous answer him, saying, Lord, when did we see thee hungering, and we nourished? or thirsting, and we gave to drink?";
dby[37] = "Then shall the righteous answer him saying, Lord, when saw we thee hungering, and nourished thee; or thirsting, and gave thee to drink?";
web[37] = "Then will the righteous answer him, saying, Lord, when saw we thee hungry, and fed [thee]? or thirsty, and gave [thee] drink?";
hnv[37] = "&quot;Then the righteous will answer him, saying, \'Lord, when did we see you hungry, and feed you; or thirsty, and give you a drink?";
vul[37] = "tunc respondebunt ei iusti dicentes Domine quando te vidimus esurientem et pavimus sitientem et dedimus tibi potum";
rsv[38] = "And when did we see thee a stranger and welcome thee, or naked and clothe thee?";
asv[38] = "And when saw we thee a stranger, and took thee in? or naked, and clothed thee?";
yng[38] = "and when did we see thee a stranger, and we received? or naked, and we put around?";
dby[38] = "and when saw we thee a stranger, and took thee in; or naked, and clothed thee?";
web[38] = "When saw we thee a stranger, and took [thee] in? or naked, and clothed [thee]?";
hnv[38] = "When did we see you as a stranger, and take you in; or naked, and clothe you?";
vul[38] = "quando autem te vidimus hospitem et colleximus te aut nudum et cooperuimus";
rsv[39] = "And when did we see thee sick or in prison and visit thee?\'";
asv[39] = "And when saw we thee sick, or in prison, and came unto thee?";
yng[39] = "and when did we see thee infirm, or in prison, and we came unto thee?";
dby[39] = "and when saw we thee ill, or in prison, and came to thee?";
web[39] = "Or when saw we thee sick, or in prison, and came to thee?";
hnv[39] = "When did we see you sick, or in prison, and come to you?\'";
vul[39] = "aut quando te vidimus infirmum aut in carcere et venimus ad te";
rsv[40] = "And the King will answer them, \'Truly, I say to you, as you did it to one of the least of these my brethren, you did it to me.\'";
asv[40] = "And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye did it unto one of these my brethren, [even] these least, ye did it unto me.";
yng[40] = "`And the king answering, shall say to them, Verily I say to you, Inasmuch as ye did [it] to one of these my brethren -- the least -- to me ye did [it].";
dby[40] = "And the King answering shall say to them, Verily, I say to you, Inasmuch as ye have done it to one of the least of these my brethren, ye have done it to me.";
web[40] = "And the king will answer and say to them, Verily I say to you, Inasmuch as ye have done [it] to one of the least of these my brethren, ye have done [it] to me.";
hnv[40] = "&quot;The King will answer them, \'Most assuredly I tell you, inasmuch as you did it to one of the least of these my brothers, you did it to me.\'";
vul[40] = "et respondens rex dicet illis amen dico vobis quamdiu fecistis uni de his fratribus meis minimis mihi fecistis";
rsv[41] = "Then he will say to those at his left hand, \'Depart from me, you cursed, into the eternal fire prepared for the devil and his angels;";
asv[41] = "Then shall he say also unto them on the left hand, Depart from me, ye cursed, into the eternal fire which is prepared for the devil and his angels:";
yng[41] = "Then shall he say also to those on the left hand, Go ye from me, the cursed, to the fire, the age-during, that hath been prepared for the Devil and his messengers;";
dby[41] = "Then shall he say also to those on the left, Go from me, cursed, into eternal fire, prepared for the devil and his angels:";
web[41] = "Then will he say also to them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels:";
hnv[41] = "Then he will say also to those on the left hand, \'Depart from me, you cursed, into the eternal fire which is prepared for the devil and his angels;";
vul[41] = "tunc dicet et his qui a sinistris erunt discedite a me maledicti in ignem aeternum qui paratus est diabolo et angelis eius";
rsv[42] = "for I was hungry and you gave me no food, I was thirsty and you gave me no drink,";
asv[42] = "for I was hungry, and ye did not give me to eat; I was thirsty, and ye gave me no drink;";
yng[42] = "for I did hunger, and ye gave me not to eat; I did thirst, and ye gave me not to drink;";
dby[42] = "for I hungered, and ye gave me not to eat; I thirsted, and ye gave me not to drink;";
web[42] = "For I was hungry, and ye gave me no food: I was thirsty, and ye gave me no drink:";
hnv[42] = "for I was hungry, and you didn\'t give me food to eat; I was thirsty, and you gave me no drink;";
vul[42] = "esurivi enim et non dedistis mihi manducare sitivi et non dedistis mihi potum";
rsv[43] = "I was a stranger and you did not welcome me, naked and you did not clothe me, sick and in prison and you did not visit me.\'";
asv[43] = "I was a stranger, and ye took me not in; naked, and ye clothed me not; sick, and in prison, and ye visited me not.";
yng[43] = "a stranger I was, and ye did not receive me; naked, and ye put not around me; infirm, and in prison, and ye did not look after me.";
dby[43] = "I was a stranger, and ye took me not in; naked, and ye did not clothe me; ill, and in prison, and ye did not visit me.";
web[43] = "I was a stranger, and ye took me not in: naked, and ye clothed me not: sick, and in prison, and ye visited me not.";
hnv[43] = "I was a stranger, and you didn\'t take me in; naked, and you didn\'t clothe me; sick, and in prison, and you didn\'t visit me.\'";
vul[43] = "hospes eram et non collexistis me nudus et non operuistis me infirmus et in carcere et non visitastis me";
rsv[44] = "Then they also will answer, \'Lord, when did we see thee hungry or thirsty or a stranger or naked or sick or in prison, and did not minister to thee?\'";
asv[44] = "Then shall they also answer, saying, Lord, when saw we thee hungry, or athirst, or a stranger, or naked, or sick, or in prison, and did not minister unto thee?";
yng[44] = "`Then shall they answer, they also, saying, Lord, when did we see thee hungering, or thirsting, or a stranger, or naked, or infirm, or in prison, and we did not minister to thee?";
dby[44] = "Then shall *they* also answer saying, Lord, when saw we thee hungering, or thirsting, or a stranger, or naked, or ill, or in prison, and have not ministered to thee?";
web[44] = "Then will they also answer him, saying, Lord, when saw we thee hungry, or thirsty, or a stranger, or naked, or sick, or in prison, and did not minister to thee?";
hnv[44] = "&quot;Then they will also answer, saying, \'Lord, when did we see you hungry, or thirsty, or a stranger, or naked, or sick, or in prison, and didn\'t help you?\'";
vul[44] = "tunc respondebunt et ipsi dicentes Domine quando te vidimus esurientem aut sitientem aut hospitem aut nudum aut infirmum vel in carcere et non ministravimus tibi";
rsv[45] = "Then he will answer them, \'Truly, I say to you, as you did it not to one of the least of these, you did it not to me.\'";
asv[45] = "Then shall he answer them, saying, Verily I say unto you, Inasmuch as ye did it not unto one of these least, ye did it not unto me.";
yng[45] = "`Then shall he answer them, saying, Verily I say to you, Inasmuch as ye did [it] not to one of these, the least, ye did [it] not to me.";
dby[45] = "Then shall he answer them saying, Verily I say to you, Inasmuch as ye have not done it to one of these least, neither have ye done it to me.";
web[45] = "Then will he answer them, saying, Verily I say to you, Inasmuch as ye did [it] not to one of the least of these, ye did [it] not to me.";
hnv[45] = "&quot;Then he will answer them, saying, \'Most assuredly I tell you, inasmuch as you didn\'t do it to one of the least of these, you didn\'t do it to me.\'";
vul[45] = "tunc respondebit illis dicens amen dico vobis quamdiu non fecistis uni de minoribus his nec mihi fecistis";
rsv[46] = "And they will go away into eternal punishment, but the righteous into eternal life.&quot;";
asv[46] = "And these shall go away into eternal punishment: but the righteous into eternal life.";
yng[46] = "And these shall go away to punishment age-during, but the righteous to life age-during.\'";
dby[46] = "And these shall go away into eternal punishment, and the righteous into life eternal.";
web[46] = "And these shall go away into everlasting punishment: but the righteous into life eternal.";
hnv[46] = "These will go away into eternal punishment, but the righteous into eternal life.&quot;";
vul[46] = "et ibunt hii in supplicium aeternum iusti autem in vitam aeternam";
