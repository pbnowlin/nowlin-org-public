csb[1] = "So he got into a boat, crossed over, and came to his own town.";
csb[2] = "Just then some men brought to him a paralytic lying on a stretcher. Seeing their faith, Jesus told the paralytic, &quot;Have courage, son, your sins are forgiven.&quot;";

csb[14] = "Then John\'s disciples came to him, saying, &quot;Why do we and the Pharisees fast often, but your disciples do not fast? &quot;";
csb[15] = "Jesus said to them, &quot;Can the wedding guests be sad while the groom is with them? The time will come when the groom will be taken away from them, and then they will fast.";
csb[16] = "&quot;No one patches an old garment with unshrunk cloth, because the patch pulls away from the garment and makes the tear worse.";

csb[18] = "As he was telling them these things, suddenly one of the leaders came and knelt down before him, saying, &quot;My daughter just died, but come and lay your hand on her, and she will live.&quot;";
csb[19] = "So Jesus and his disciples got up and followed him.";
csb[20] = "Just then, a woman who had suffered from bleeding for twelve years approached from behind and touched the end of his robe,";

csb[22] = "Jesus turned and saw her. &quot;Have courage, daughter,&quot; he said. &quot;Your faith has saved you.&quot; And the woman was made well from that moment.";
csb[23] = "When Jesus came to the leader\'s house, he saw the flute players and a crowd lamenting loudly.";

csb[25] = "After the crowd had been put outside, he went in and took her by the hand, and the girl got up.";
csb[26] = "Then news of this spread throughout that whole area.";
csb[27] = "As Jesus went on from there, two blind men followed him, calling out, &quot;Have mercy on us, Son of David! &quot;";
csb[28] = "When he entered the house, the blind men approached him, and Jesus said to them, &quot;Do you believe that I can do this? &quot; They said to him, &quot;Yes, Lord.&quot;";
csb[29] = "Then he touched their eyes, saying, &quot;Let it be done for you according to your faith.&quot;";

csb[31] = "But they went out and spread the news about him throughout that whole area.";
csb[32] = "Just as they were going out, a demon-possessed man who was unable to speak was brought to him.";

csb[34] = "But the Pharisees said, &quot;He drives out demons by the ruler of the demons.&quot;";
