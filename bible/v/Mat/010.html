csb[1] = "Summoning his twelve disciples, he gave them authority over unclean spirits, to drive them out and to heal every disease and sickness.";
csb[2] = "These are the names of the twelve apostles: First, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;";
csb[3] = "Philip and Bartholomew; Thomas and Matthew the tax collector; James the son of Alphaeus, and Thaddaeus;";
csb[4] = "Simon the Zealot, and Judas Iscariot, who also betrayed him.";
csb[5] = "Jesus sent out these twelve after giving them instructions: &quot;Don\'t take the road that leads to the Gentiles, and don\'t enter any Samaritan town.";
csb[6] = "&quot;Instead, go to the lost sheep of the house of Israel.";
csb[7] = "&quot;As you go, proclaim: \'The kingdom of heaven has come near.\'";
csb[8] = "&quot;Heal the sick, raise the dead, cleanse those with leprosy, drive out demons. Freely you received, freely give.";
csb[9] = "&quot;Don\'t acquire gold, silver, or copper for your money-belts.";
csb[10] = "&quot;Don\'t take a traveling bag for the road, or an extra shirt, sandals, or a staff, for the worker is worthy of his food.";
csb[11] = "&quot;When you enter any town or village, find out who is worthy, and stay there until you leave.";
csb[12] = "&quot;Greet a household when you enter it,";
csb[13] = "&quot;and if the household is worthy, let your peace be on it; but if it is unworthy, let your peace return to you.";
csb[14] = "&quot;If anyone does not welcome you or listen to your words, shake the dust off your feet when you leave that house or town.";
csb[15] = "&quot;Truly I tell you, it will be more tolerable on the day of judgment for the land of Sodom and Gomorrah than for that town.";
csb[16] = "&quot;Look, I\'m sending you out like sheep among wolves. Therefore be as shrewd as serpents and as innocent as doves.";
csb[17] = "&quot;Beware of them, because they will hand you over to local courts and flog you in their synagogues.";
csb[18] = "&quot;You will even be brought before governors and kings because of me, to bear witness to them and to the Gentiles.";
csb[19] = "&quot;But when they hand you over, don\'t worry about how or what you are to speak. For you will be given what to say at that hour,";
csb[20] = "&quot;because it isn\'t you speaking, but the Spirit of your Father is speaking through you.";
csb[21] = "&quot;Brother will betray brother to death, and a father his child. Children will rise up against parents and have them put to death.";
csb[22] = "&quot;You will be hated by everyone because of my name. But the one who endures to the end will be saved.";
csb[23] = "&quot;When they persecute you in one town, flee to another. For truly I tell you, you will not have gone through the towns of Israel before the Son of Man comes.";
csb[24] = "&quot;A disciple is not above his teacher, or a slave above his master.";
csb[25] = "&quot;It is enough for a disciple to become like his teacher and a slave like his master. If they called the head of the house \'Beelzebul,\' how much more the members of his household!";
csb[26] = "&quot;Therefore, don\'t be afraid of them, since there is nothing covered that won\'t be uncovered and nothing hidden that won\'t be made known.";
csb[27] = "&quot;What I tell you in the dark, speak in the light. What you hear in a whisper, proclaim on the housetops.";
csb[28] = "&quot;Don\'t fear those who kill the body but are not able to kill the soul; rather, fear him who is able to destroy both soul and body in hell.";
csb[29] = "&quot;Aren\'t two sparrows sold for a penny? Yet not one of them falls to the ground without your Father\'s consent.";
csb[30] = "&quot;But even the hairs of your head have all been counted.";
csb[31] = "&quot;So don\'t be afraid; you are worth more than many sparrows.";
csb[32] = "&quot;Therefore, everyone who will acknowledge me before others, I will also acknowledge him before my Father in heaven.";
csb[33] = "&quot;But whoever denies me before others, I will also deny him before my Father in heaven.";
csb[34] = "&quot;Don\'t assume that I came to bring peace on the earth. I did not come to bring peace, but a sword.";
csb[35] = "&quot;For I came to turn a man against his father, a daughter against her mother, a daughter-in-law against her mother-in-law;";
csb[36] = "&quot;and a man\'s enemies will be the members of his household.";
csb[37] = "&quot;The one who loves a father or mother more than me is not worthy of me; the one who loves a son or daughter more than me is not worthy of me.";
csb[38] = "&quot;And whoever doesn\'t take up his cross and follow me is not worthy of me.";
csb[39] = "&quot;Anyone who finds his life will lose it, and anyone who loses his life because of me will find it.";
csb[40] = "&quot;The one who welcomes you welcomes me, and the one who welcomes me welcomes him who sent me.";
csb[41] = "&quot;Anyone who welcomes a prophet because he is a prophet will receive a prophet\'s reward. And anyone who welcomes a righteous person because he\'s righteous will receive a righteous person\'s reward.";
csb[42] = "&quot;And whoever gives even a cup of cold water to one of these little ones because he is a disciple, truly I tell you, he will never lose his reward.&quot;";
kjv[1] = "And when he had called unto [him] his twelve disciples, he gave them power [against] unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease.";
kjv[2] = "Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James [the son] of Zebedee, and John his brother;";
kjv[3] = "Philip, and Bartholomew; Thomas, and Matthew the publican; James [the son] of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;";
kjv[4] = "Simon the Canaanite, and Judas Iscariot, who also betrayed him.";
kjv[5] = "These twelve Jesus sent forth, and commanded them, saying, Go not into the way of the Gentiles, and into [any] city of the Samaritans enter ye not:";
kjv[6] = "But go rather to the lost sheep of the house of Israel.";
kjv[7] = "And as ye go, preach, saying, The kingdom of heaven is at hand.";
kjv[8] = "Heal the sick, cleanse the lepers, raise the dead, cast out devils: freely ye have received, freely give.";
kjv[9] = "Provide neither gold, nor silver, nor brass in your purses,";
kjv[10] = "Nor scrip for [your] journey, neither two coats, neither shoes, nor yet staves: for the workman is worthy of his meat.";
kjv[11] = "And into whatsoever city or town ye shall enter, enquire who in it is worthy; and there abide till ye go thence.";
kjv[12] = "And when ye come into an house, salute it.";
kjv[13] = "And if the house be worthy, let your peace come upon it: but if it be not worthy, let your peace return to you.";
kjv[14] = "And whosoever shall not receive you, nor hear your words, when ye depart out of that house or city, shake off the dust of your feet.";
kjv[15] = "Verily I say unto you, It shall be more tolerable for the land of Sodom and Gomorrha in the day of judgment, than for that city.";
kjv[16] = "Behold, I send you forth as sheep in the midst of wolves: be ye therefore wise as serpents, and harmless as doves.";
kjv[17] = "But beware of men: for they will deliver you up to the councils, and they will scourge you in their synagogues;";
kjv[18] = "And ye shall be brought before governors and kings for my sake, for a testimony against them and the Gentiles.";
kjv[19] = "But when they deliver you up, take no thought how or what ye shall speak: for it shall be given you in that same hour what ye shall speak.";
kjv[20] = "For it is not ye that speak, but the Spirit of your Father which speaketh in you.";
kjv[21] = "And the brother shall deliver up the brother to death, and the father the child: and the children shall rise up against [their] parents, and cause them to be put to death.";
kjv[22] = "And ye shall be hated of all [men] for my name\'s sake: but he that endureth to the end shall be saved.";
kjv[23] = "But when they persecute you in this city, flee ye into another: for verily I say unto you, Ye shall not have gone over the cities of Israel, till the Son of man be come.";
kjv[24] = "The disciple is not above [his] master, nor the servant above his lord.";
kjv[25] = "It is enough for the disciple that he be as his master, and the servant as his lord. If they have called the master of the house Beelzebub, how much more [shall they call] them of his household?";
kjv[26] = "Fear them not therefore: for there is nothing covered, that shall not be revealed; and hid, that shall not be known.";
kjv[27] = "What I tell you in darkness, [that] speak ye in light: and what ye hear in the ear, [that] preach ye upon the housetops.";
kjv[28] = "And fear not them which kill the body, but are not able to kill the soul: but rather fear him which is able to destroy both soul and body in hell.";
kjv[29] = "Are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father.";
kjv[30] = "But the very hairs of your head are all numbered.";
kjv[31] = "Fear ye not therefore, ye are of more value than many sparrows.";
kjv[32] = "Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven.";
kjv[33] = "But whosoever shall deny me before men, him will I also deny before my Father which is in heaven.";
kjv[34] = "Think not that I am come to send peace on earth: I came not to send peace, but a sword.";
kjv[35] = "For I am come to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law.";
kjv[36] = "And a man\'s foes [shall be] they of his own household.";
kjv[37] = "He that loveth father or mother more than me is not worthy of me: and he that loveth son or daughter more than me is not worthy of me.";
kjv[38] = "And he that taketh not his cross, and followeth after me, is not worthy of me.";
kjv[39] = "He that findeth his life shall lose it: and he that loseth his life for my sake shall find it.";
kjv[40] = "He that receiveth you receiveth me, and he that receiveth me receiveth him that sent me.";
kjv[41] = "He that receiveth a prophet in the name of a prophet shall receive a prophet\'s reward; and he that receiveth a righteous man in the name of a righteous man shall receive a righteous man\'s reward.";
kjv[42] = "And whosoever shall give to drink unto one of these little ones a cup of cold [water] only in the name of a disciple, verily I say unto you, he shall in no wise lose his reward.";

dby[19] = "But when they deliver you up, be not careful how or what ye shall speak; for it shall be given to you in that hour what ye shall speak.";
web[19] = "But when they deliver you up, be not anxious how or what ye shall speak, for it shall be given to you in that same hour what ye shall speak.";
hnv[19] = "But when they deliver you up, don\'t be anxious how or what you will say, for it will be given you in that hour what you will say.";
vul[19] = "cum autem tradent vos nolite cogitare quomodo aut quid loquamini dabitur enim vobis in illa hora quid loquamini";
rsv[20] = "for it is not you who speak, but the Spirit of your Father speaking through you.";
asv[20] = "For it is not ye that speak, but the Spirit of your Father that speaketh in you.";
yng[20] = "for ye are not the speakers, but the Spirit of your Father that is speaking in you.";
dby[20] = "For *ye* are not the speakers, but the Spirit of your Father which speaks in you.";
web[20] = "For it is not ye that speak, but the Spirit of your Father which speaketh in you.";
hnv[20] = "For it is not you who speak, but the Spirit of your Father who speaks in you.";
vul[20] = "non enim vos estis qui loquimini sed Spiritus Patris vestri qui loquitur in vobis";
rsv[21] = "Brother will deliver up brother to death, and the father his child, and children will rise against parents and have them put to death;";
asv[21] = "And brother shall deliver up brother to death, and the father his child: and children shall rise up against parents, and cause them to be put to death.";
yng[21] = "`And brother shall deliver up brother to death, and father child, and children shall rise up against parents, and shall put them to death,";
dby[21] = "But brother shall deliver up brother to death, and father child; and children shall rise up against parents and shall put them to death;";
web[21] = "And the brother will deliver up the brother to death, and the father the child: and the children will rise up against [their] parents, and cause them to be put to death.";
hnv[21] = "&quot;Brother will deliver up brother to death, and the father his child. Children will rise up against parents, and cause them to be put to death.";
vul[21] = "tradet autem frater fratrem in mortem et pater filium et insurgent filii in parentes et morte eos adficient";
rsv[22] = "and you will be hated by all for my name\'s sake. But he who endures to the end will be saved.";
asv[22] = "And ye shall be hated of all men for my name\'s sake: but he that endureth to the end, the same shall be saved.";
yng[22] = "and ye shall be hated by all because of my name, but he who hath endured to the end, he shall be saved.";
dby[22] = "and ye shall be hated of all on account of my name. But he that has endured to [the] end, *he* shall be saved.";
web[22] = "And ye will be hated by all [men] for my name\'s sake: but he that endureth to the end shall be saved.";
hnv[22] = "You will be hated by all men for my name\'s sake, but he who endures to the end will be saved.";
vul[22] = "et eritis odio omnibus propter nomen meum qui autem perseveraverit in finem hic salvus erit";
rsv[23] = "When they persecute you in one town, flee to the next; for truly, I say to you, you will not have gone through all the towns of Israel, before the Son of man comes.";
asv[23] = "But when they persecute you in this city, flee into the next: for verily I say unto you, Ye shall not have gone through the cities of Israel, till the Son of man be come.";
yng[23] = "`And whenever they may persecute you in this city, flee to the other, for verily I say to you, ye may not have completed the cities of Israel till the Son of Man may come.";
dby[23] = "But when they persecute you in this city, flee to the other; for verily I say to you, Ye shall not have completed the cities of Israel until the Son of man be come.";
web[23] = "But when they persecute you in this city, flee ye into another: for verily I say to you, Ye shall not have gone over the cities of Israel till the Son of man shall have come.";
hnv[23] = "But when they persecute you in this city, flee into the next, for most assuredly I tell you, you will not have gone through the cities of Yisra\'el, until the Son of Man has come.";
vul[23] = "cum autem persequentur vos in civitate ista fugite in aliam amen enim dico vobis non consummabitis civitates Israhel donec veniat Filius hominis";
rsv[24] = "&quot;A disciple is not above his teacher, nor a servant above his master;";
asv[24] = "A disciple is not above his teacher, nor a servant above his lord.";
yng[24] = "`A disciple is not above the teacher, nor a servant above his lord;";
dby[24] = "The disciple is not above his teacher, nor the bondman above his lord.";
web[24] = "The disciple is not above [his] teacher, nor the servant above his lord.";
hnv[24] = "&quot;A talmid is not above his teacher, nor a servant above his lord.";
vul[24] = "non est discipulus super magistrum nec servus super dominum suum";
rsv[25] = "it is enough for the disciple to be like his teacher, and the servant like his master. If they have called the master of the house Be-el\'zebul, how much more will they malign those of his household.";
asv[25] = "It is enough for the disciple that he be as his teacher, and the servant as his lord. If they have called the master of the house Beelzebub, how much more them of his household!";
yng[25] = "sufficient to the disciple that he may be as his teacher, and the servant as his lord; if the master of the house they did call Beelzeboul, how much more those of his household?";
dby[25] = "[It is] sufficient for the disciple that he should become as his teacher, and the bondman as his lord. If they have called the master of the house Beelzebub, how much more those of his household?";
web[25] = "It is enough for the disciple that he should be as his teacher, and the servant as his lord: if they have called the master of the house Beelzebub, how much more [will they call] them of his household?";
hnv[25] = "It is enough for the talmid that he be like his teacher, and the servant like his lord. If they have called the master of the house Ba`al-Zibbul, how much more those of his household!";
vul[25] = "sufficit discipulo ut sit sicut magister eius et servus sicut dominus eius si patrem familias Beelzebub vocaverunt quanto magis domesticos eius";
rsv[26] = "&quot;So have no fear of them; for nothing is covered that will not be revealed, or hidden that will not be known.";
asv[26] = "Fear them not therefore: for there is nothing covered, that shall not be revealed; and hid, that shall not be known.";
yng[26] = "`Ye may not, therefore, fear them, for there is nothing covered, that shall not be revealed, and hid, that shall not be known;";
dby[26] = "Fear them not therefore; for there is nothing covered which shall not be revealed, and secret which shall not be known.";
web[26] = "Fear them not therefore: for there is nothing covered, that shall not be revealed; and hid, that shall not be known.";
hnv[26] = " Therefore don\'t be afraid of them, for there is nothing covered that will not be revealed; and hidden that will not be known.";
vul[26] = "ne ergo timueritis eos nihil enim opertum quod non revelabitur et occultum quod non scietur";
rsv[27] = "What I tell you in the dark, utter in the light; and what you hear whispered, proclaim upon the housetops.";
asv[27] = "What I tell you in the darkness, speak ye in the light; and what ye hear in the ear, proclaim upon the house-tops.";
yng[27] = "that which I tell you in the darkness, speak in the light, and that which you hear at the ear, proclaim on the house-tops.";
dby[27] = "What I say to you in darkness speak in the light, and what ye hear in the ear preach upon the houses.";
web[27] = "What I tell you in darkness, [that] speak ye in light: and what ye hear in the ear, [that] publish ye upon the house-tops.";
hnv[27] = "What I tell you in the darkness, speak in the light; and what you hear whispered in the ear, proclaim on the housetops.";
vul[27] = "quod dico vobis in tenebris dicite in lumine et quod in aure auditis praedicate super tecta";
rsv[28] = "And do not fear those who kill the body but cannot kill the soul; rather fear him who can destroy both soul and body in hell.";
asv[28] = "And be not afraid of them that kill the body, but are not able to kill the soul: but rather fear him who is able to destroy both soul and body in hell.";
yng[28] = "`And be not afraid of those killing the body, and are not able to kill the soul, but fear rather Him who is able both soul and body to destroy in gehenna.";
dby[28] = "And be not afraid of those who kill the body, but cannot kill the soul; but fear rather him who is able to destroy both soul and body in hell.";
web[28] = "And fear not them who kill the body, but are not able to kill the soul: but rather fear him who is able to destroy both soul and body in hell.";
hnv[28] = "Don\'t be afraid of those who kill the body, but are not able to kill the soul. Rather, fear him who is able to destroy both soul and body in Gehinnom.";
vul[28] = "et nolite timere eos qui occidunt corpus animam autem non possunt occidere sed potius eum timete qui potest et animam et corpus perdere in gehennam";
rsv[29] = "Are not two sparrows sold for a penny? And not one of them will fall to the ground without your Father\'s will.";
asv[29] = "Are not two sparrows sold for a penny? and not one of them shall fall on the ground without your Father:";
yng[29] = "`Are not two sparrows sold for an assar? and one of them shall not fall on the ground without your Father;";
dby[29] = "Are not two sparrows sold for a farthing? and one of them shall not fall to the ground without your Father;";
web[29] = "Are not two sparrows sold for a farthing? and not one of them shall fall on the ground without your Father.";
hnv[29] = "&quot;Aren\'t two sparrows sold for an assarion? Not one of them falls on the ground apart from your Father\'s will,";
vul[29] = "nonne duo passeres asse veneunt et unus ex illis non cadet super terram sine Patre vestro";
rsv[30] = "But even the hairs of your head are all numbered.";
asv[30] = "but the very hairs of your head are all numbered.";
yng[30] = "and of you -- even the hairs of the head are all numbered;";
dby[30] = "but of you even the hairs of the head are all numbered.";
web[30] = "But the very hairs of your head are all numbered.";
hnv[30] = "but the very hairs of your head are all numbered.";
vul[30] = "vestri autem et capilli capitis omnes numerati sunt";
rsv[31] = "Fear not, therefore; you are of more value than many sparrows.";
asv[31] = "Fear not therefore: ye are of more value than many sparrows.";
yng[31] = "be not therefore afraid, than many sparrows ye are better.";
dby[31] = "Fear not therefore; *ye* are better than many sparrows.";
web[31] = "Fear ye not therefore, ye are of more value than many sparrows.";
hnv[31] = "Therefore don\'t be afraid. You are of more value than many sparrows.";
vul[31] = "nolite ergo timere multis passeribus meliores estis vos";
rsv[32] = "So every one who acknowledges me before men, I also will acknowledge before my Father who is in heaven;";
asv[32] = "Every one therefore who shall confess me before men, him will I also confess before my Father who is in heaven.";
yng[32] = "`Every one, therefore, who shall confess in me before men, I also will confess in him before my Father who is in the heavens;";
dby[32] = "Every one therefore who shall confess me before men, *I* also will confess him before my Father who is in [the] heavens.";
web[32] = "Whoever therefore shall confess me before men, him will I also confess before my Father who is in heaven.";
hnv[32] = "Everyone therefore who confesses me before men, him I will also confess before my Father who is in heaven.";
vul[32] = "omnis ergo qui confitebitur me coram hominibus confitebor et ego eum coram Patre meo qui est in caelis";
rsv[33] = "but whoever denies me before men, I also will deny before my Father who is in heaven.";
asv[33] = "But whosoever shall deny me before men, him will I also deny before my Father who is in heaven.";
yng[33] = "and whoever shall deny me before men, I also will deny him before my Father who is in the heavens.";
dby[33] = "But whosoever shall deny me before men, him will *I* also deny before my Father who is in [the] heavens.";
web[33] = "But whoever shall deny me before men, him will I also deny before my Father who is in heaven.";
hnv[33] = "But whoever denies me before men, him I will also deny before my Father who is in heaven.";
vul[33] = "qui autem negaverit me coram hominibus negabo et ego eum coram Patre meo qui est in caelis";
rsv[34] = "&quot;Do not think that I have come to bring peace on earth; I have not come to bring peace, but a sword.";
asv[34] = "Think not that I came to send peace on the earth: I came not to send peace, but a sword.";
yng[34] = "`Ye may not suppose that I came to put peace on the earth; I did not come to put peace, but a sword;";
dby[34] = "Do not think that I have come to send peace upon the earth: I have not come to send peace, but a sword.";
web[34] = "Think not that I am come to send peace on earth: I came not to send peace, but a sword.";
hnv[34] = "&quot;Don\'t think that I came to send shalom on the eretz. I didn\'t come to send shalom, but a sword.";
vul[34] = "nolite arbitrari quia venerim mittere pacem in terram non veni pacem mittere sed gladium";
rsv[35] = "For I have come to set a man against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law;";
asv[35] = "For I came to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law:";
yng[35] = "for I came to set a man at variance against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law,";
dby[35] = "For I have come to set a man at variance with his father, and the daughter with her mother, and the daughter-in-law with her mother-in-law;";
web[35] = "For I am come to set a man at variance against his father, and the daughter against her mother, and the daughter-in-law against her mother-in-law.";
hnv[35] = "For I came to set a man at odds against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law.";
vul[35] = "veni enim separare hominem adversus patrem suum et filiam adversus matrem suam et nurum adversus socrum suam";
rsv[36] = "and a man\'s foes will be those of his own household.";
asv[36] = "and a man\'s foes [shall be] they of his own household.";
yng[36] = "and the enemies of a man are those of his household.";
dby[36] = "and they of his household [shall be] a man\'s enemies.";
web[36] = "And a man\'s foes [will be] they of his own household.";
hnv[36] = "A man\'s foes will be those of his own household.";
vul[36] = "et inimici hominis domestici eius";
rsv[37] = "He who loves father or mother more than me is not worthy of me; and he who loves son or daughter more than me is not worthy of me;";
asv[37] = "He that loveth father or mother more than me is not worthy of me; and he that loveth son or daughter more than me is not worthy of me.";
yng[37] = "`He who is loving father or mother above me, is not worthy of me, and he who is loving son or daughter above me, is not worthy of me,";
dby[37] = "He who loves father or mother above me is not worthy of me; and he who loves son or daughter above me is not worthy of me.";
web[37] = "He that loveth father or mother more than me, is not worthy of me: and he that loveth son or daughter more than me, is not worthy of me.";
hnv[37] = "He who loves father or mother more than me is not worthy of me; and he who loves son or daughter more than me isn\'t worthy of me.";
vul[37] = "qui amat patrem aut matrem plus quam me non est me dignus et qui amat filium aut filiam super me non est me dignus";
rsv[38] = "and he who does not take his cross and follow me is not worthy of me.";
asv[38] = "And he that doth not take his cross and follow after me, is not worthy of me.";
yng[38] = "and whoever doth not receive his cross and follow after me, is not worthy of me.";
dby[38] = "And he who does not take up his cross and follow after me is not worthy of me.";
web[38] = "And he that taketh not his cross, and followeth me, is not worthy of me.";
hnv[38] = "He who doesn\'t take his cross and follow after me, isn\'t worthy of me.";
vul[38] = "et qui non accipit crucem suam et sequitur me non est me dignus";
rsv[39] = "He who finds his life will lose it, and he who loses his life for my sake will find it.";
asv[39] = "He that findeth his life shall lose it; and he that loseth his life for my sake shall find it.";
yng[39] = "`He who found his life shall lose it, and he who lost his life for my sake shall find it.";
dby[39] = "He that finds his life shall lose it, and he who has lost his life for my sake shall find it.";
web[39] = "He that findeth his life shall lose it: and he that loseth his life for my sake, shall find it.";
hnv[39] = "He who finds his life will lose it; and he who loses his life for my sake will find it.";
vul[39] = "qui invenit animam suam perdet illam et qui perdiderit animam suam propter me inveniet eam";
rsv[40] = "&quot;He who receives you receives me, and he who receives me receives him who sent me.";
asv[40] = "He that receiveth you receiveth me, and he that receiveth me receiveth him that sent me.";
yng[40] = "`He who is receiving you doth receive me, and he who is receiving me doth receive Him who sent me,";
dby[40] = "He that receives you receives me, and he that receives me receives him that sent me.";
web[40] = "He that receiveth you, receiveth me, and he that receiveth me, receiveth him that sent me.";
hnv[40] = "He who receives you receives me, and he who receives me receives him who sent me.";
vul[40] = "qui recipit vos me recipit et qui me recipit recipit eum qui me misit";
rsv[41] = "He who receives a prophet because he is a prophet shall receive a prophet\'s reward, and he who receives a righteous man because he is a righteous man shall receive a righteous man\'s reward.";
asv[41] = "He that receiveth a prophet in the name of a prophet shall receive a prophet\'s reward: and he that receiveth a righteous man in the name of a righteous man shall receive a righteous man\'s reward.";
yng[41] = "he who is receiving a prophet in the name of a prophet, shall receive a prophet\'s reward, and he who is receiving a righteous man in the name of a righteous man, shall receive a righteous man\'s reward,";
dby[41] = "He that receives a prophet in the name of a prophet, shall receive a prophet\'s reward; and he that receives a righteous man in the name of a righteous man, shall receive a righteous man\'s reward.";
web[41] = "He that receiveth a prophet in the name of a prophet, shall receive a prophet\'s reward; and he that receiveth a righteous man in the name of a righteous man, shall receive a righteous man\'s reward.";
hnv[41] = "He who receives a prophet in the name of a prophet will receive a prophet\'s reward: and he who receives a righteous man in the name of a righteous man will receive a righteous man\'s reward.";
vul[41] = "qui recipit prophetam in nomine prophetae mercedem prophetae accipiet et qui recipit iustum in nomine iusti mercedem iusti accipiet";
rsv[42] = "And whoever gives to one of these little ones even a cup of cold water because he is a disciple, truly, I say to you, he shall not lose his reward.&quot;";
asv[42] = "And whosoever shall give to drink unto one of these little ones a cup of cold water only, in the name of a disciple, verily I say unto you he shall in no wise lose his reward.";
yng[42] = "and whoever may give to drink to one of these little ones a cup of cold water only in the name of a disciple, verily I say to you, he may not lose his reward.\'";
dby[42] = "And whosoever shall give to drink to one of these little ones a cup of cold [water] only, in the name of a disciple, verily I say unto you, he shall in no wise lose his reward.";
web[42] = "And whoever shall give to drink to one of these little ones, a cup of cold [water] only, in the name of a disciple, verily, I say to you, he shall in no wise lose his reward.";
hnv[42] = "Whoever gives one of these little ones just a cup of cold water to drink in the name of a talmid, most assuredly I tell you he will in no way lose his reward.&quot;";
vul[42] = "et quicumque potum dederit uni ex minimis istis calicem aquae frigidae tantum in nomine discipuli amen dico vobis non perdet mercedem suam";
