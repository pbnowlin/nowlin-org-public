csb[1] = "When he saw the crowds, he went up on the mountain, and after he sat down, his disciples came to him.";
csb[2] = "Then he began to teach them, saying:";
csb[3] = "&quot;Blessed are the poor in spirit, for the kingdom of heaven is theirs.";
csb[4] = "&quot;Blessed are those who mourn, for they will be comforted.";
csb[5] = "&quot;Blessed are the humble, for they will inherit the earth.";
csb[6] = "&quot;Blessed are those who hunger and thirst for righteousness, for they will be filled.";
csb[7] = "&quot;Blessed are the merciful, for they will be shown mercy.";
csb[8] = "&quot;Blessed are the pure in heart, for they will see God.";
csb[9] = "&quot;Blessed are the peacemakers, for they will be called sons of God.";
csb[10] = "&quot;Blessed are those who are persecuted because of righteousness, for the kingdom of heaven is theirs.";
csb[11] = "&quot;You are blessed when they insult you and persecute you and falsely say every kind of evil against you because of me.";
csb[12] = "&quot;Be glad and rejoice, because your reward is great in heaven. For that is how they persecuted the prophets who were before you.";
csb[13] = "&quot;You are the salt of the earth. But if the salt should lose its taste, how can it be made salty? It\'s no longer good for anything but to be thrown out and trampled under people\'s feet.";
csb[14] = "&quot;You are the light of the world. A city situated on a hill cannot be hidden.";
csb[15] = "&quot;No one lights a lamp and puts it under a basket, but rather on a lampstand, and it gives light for all who are in the house.";
csb[16] = "&quot;In the same way, let your light shine&#x2009; before others, so that they may see your good works and give glory to your Father in heaven.";
csb[17] = "&quot;Don\'t think that I came to abolish the Law or the Prophets. I did not come to abolish but to fulfill.";
csb[18] = "&quot;For truly I tell you, until heaven and earth pass away, not the smallest letter or one stroke of a letter will pass away from the law until all things are accomplished.";
csb[19] = "&quot;Therefore, whoever breaks one of the least of these commands and teaches others to do the same will be called least in the kingdom of heaven. But whoever does and teaches these commands will be called great in the kingdom of heaven.";
csb[20] = "&quot;For I tell you, unless your righteousness surpasses that of the scribes and Pharisees, you will never get into the kingdom of heaven.";
csb[21] = "&quot;You have heard that it was said to our ancestors, Do not murder, and whoever murders will be subject to judgment.";
csb[22] = "&quot;But I tell you, everyone who is angry with his brother or sister will be subject to judgment. Whoever insults his brother or sister, will be subject to the court. Whoever says, \'You fool! \' will be subject to hellfire.";
csb[23] = "&quot;So if you are offering your gift on the altar, and there you remember that your brother or sister has something against you,";
csb[24] = "&quot;leave your gift there in front of the altar. First go and be reconciled with your brother or sister, and then come and offer your gift.";
csb[25] = "&quot;Reach a settlement quickly with your adversary while you\'re on the way with him to the court, or your adversary will hand you over to the judge, and the judge to the officer, and you will be thrown into prison.";
csb[26] = "&quot;Truly I tell you, you will never get out of there until you have paid the last penny.";
csb[27] = "&quot;You have heard that it was said, Do not commit adultery.";
csb[28] = "&quot;But I tell you, everyone who looks at a woman lustfully has already committed adultery with her in his heart.";
csb[29] = "&quot;If your right eye causes you to sin, gouge it out and throw it away. For it is better that you lose one of the parts of your body than for your whole body to be thrown into hell.";
csb[30] = "&quot;And if your right hand causes you to sin, cut it off and throw it away. For it is better that you lose one of the parts of your body than for your whole body to go into hell.";
csb[31] = "&quot;It was also said, Whoever divorces his wife must give her a written notice of divorce.";
csb[32] = "&quot;But I tell you, everyone who divorces his wife, except in a case of sexual immorality, causes her to commit adultery. And whoever marries a divorced woman commits adultery.";
csb[33] = "&quot;Again, you have heard that it was said to our ancestors,&#x2009; You must not break your oath, but you must keep your oaths to the Lord.";
csb[34] = "&quot;But I tell you, don\'t take an oath at all: either by heaven, because it is God\'s throne;";
csb[35] = "&quot;or by the earth, because it is his footstool; or by Jerusalem, because it is the city of the great King.";
csb[36] = "&quot;Do not swear by your head, because you cannot make a single hair white or black.";
csb[37] = "&quot;But let your \'yes\' mean \'yes,\' and your \'no\' mean \'no.\' Anything more than this is from the evil one.";
csb[38] = "&quot;You have heard that it was said, An eye for an eye and a tooth for a tooth.";
csb[39] = "&quot;But I tell you, don\'t resist an evildoer. On the contrary, if anyone slaps you on your right cheek, turn the other to him also.";
csb[40] = "&quot;As for the one who wants to sue you and take away your shirt, let him have your coat as well.";
csb[41] = "&quot;And if anyone forces you to go one mile, go with him two.";
csb[42] = "&quot;Give to the one who asks you, and don\'t turn away from the one who wants to borrow from you.";
csb[43] = "&quot;You have heard that it was said, Love your neighbor and hate your enemy.";
csb[44] = "&quot;But I tell you, love your enemies and pray for those who persecute you,";
csb[45] = "&quot;so that you may be children of your Father in heaven. For he causes his sun to rise on the evil and the good, and sends rain on the righteous and the unrighteous.";
csb[46] = "&quot;For if you love those who love you, what reward will you have? Don\'t even the tax collectors do the same?";
csb[47] = "&quot;And if you greet only your brothers and sisters, what are you doing out of the ordinary? Don\'t even the Gentiles do the same?";
csb[48] = "&quot;Be perfect, therefore, as your heavenly Father is perfect.";

kjv[22] = "But I say unto you, That whosoever is angry with his brother without a cause shall be in danger of the judgment: and whosoever shall say to his brother, Raca, shall be in danger of the council: but whosoever shall say, Thou fool, shall be in danger of hell fire.";
rsv[22] = "But I say to you that every one who is angry with his brother shall be liable to judgment; whoever insults his brother shall be liable to the council, and whoever says, \'You fool!\' shall be liable to the hell of fire.";
asv[22] = "but I say unto you, that every one who is angry with his brother shall be in danger of the judgment; and whosoever shall say to his brother, Raca, shall be in danger of the council; and whosoever shall say, Thou fool, shall be in danger of the hell of fire.";
yng[22] = "but I -- I say to you, that every one who is angry at his brother without cause, shall be in danger of the judgment, and whoever may say to his brother, Empty fellow! shall be in danger of the sanhedrim, and whoever may say, Rebel! shall be in danger of the gehenna of the fire.";
dby[22] = "But *I* say unto you, that every one that is lightly angry with his brother shall be subject to the judgment; but whosoever shall say to his brother, Raca, shall be subject to [be called before] the sanhedrim; but whosoever shall say, Fool, shall be subject to the penalty of the hell of fire.";
web[22] = "But I say to you, That whoever is angry with his brother without a cause, shall be in danger of the judgment: and whoever shall say to his brother, Raca, shall be in danger of the council: but whoever shall say, Thou fool, shall be in danger of hell-fire.";
hnv[22] = "But I tell you, that everyone who is angry with his brother without a cause shall be in danger of the judgment; and whoever shall say to his brother, \'Reyka!\' shall be in danger of the council; and whoever shall say, \'Shoteh!\' shall be in danger of the fire of Gehinnom.";
vul[22] = "ego autem dico vobis quia omnis qui irascitur fratri suo reus erit iudicio qui autem dixerit fratri suo racha reus erit concilio qui autem dixerit fatue reus erit gehennae ignis";

kjv[25] = "Agree with thine adversary quickly, whiles thou art in the way with him; lest at any time the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.";

asv[25] = "Agree with thine adversary quickly, while thou art with him in the way; lest haply the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.";
yng[25] = "`Be agreeing with thy opponent quickly, while thou art in the way with him, that the opponent may not deliver thee to the judge, and the judge may deliver thee to the officer, and to prison thou mayest be cast,";
dby[25] = "Make friends with thine adverse party quickly, whilst thou art in the way with him; lest some time the adverse party deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.";
web[25] = "Agree with thy adversary quickly, while thou art in the way with him; lest at any time the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.";
hnv[25] = "Agree with your adversary quickly, while you are with him in the way; lest perhaps the prosecutor deliver you to the judge, and the judge deliver you to the officer, and you be cast into prison.";
