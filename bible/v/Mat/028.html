csb[1] = "After the Sabbath, as the first day of the week was dawning, Mary Magdalene and the other Mary went to view the tomb.";
csb[2] = "There was a violent earthquake, because an angel of the Lord descended from heaven and approached the tomb. He rolled back the stone and was sitting on it.";
csb[3] = "His appearance was like lightning, and his clothing was as white as snow.";
csb[4] = "The guards were so shaken by fear of him that they became like dead men.";
csb[5] = "The angel told the women, &quot;Don\'t be afraid, because I know you are looking for Jesus who was crucified.";
csb[6] = "&quot;He is not here. For he has risen, just as he said. Come and see the place where he lay.";
csb[7] = "&quot;Then go quickly and tell his disciples, \'He has risen from the dead and indeed he is going ahead of you to Galilee; you will see him there.\' Listen, I have told you.&quot;";
csb[8] = "So, departing quickly from the tomb with fear and great joy, they ran to tell his disciples the news.";
csb[9] = "Just then Jesus met them and said, &quot;Greetings! &quot; They came up, took hold of his feet, and worshiped him.";
csb[10] = "Then Jesus told them, &quot;Do not be afraid. Go and tell my brothers to leave for Galilee, and they will see me there.&quot;";
csb[11] = "As they were on their way, some of the guards came into the city and reported to the chief priests everything that had happened.";
csb[12] = "After the priests had assembled with the elders and agreed on a plan, they gave the soldiers a large sum of money";
csb[13] = "and told them, &quot;Say this, \'His disciples came during the night and stole him while we were sleeping.\'";
csb[14] = "&quot;If this reaches the governor\'s ears, we will deal with him and keep you out of trouble.&quot;";
csb[15] = "They took the money and did as they were instructed, and this story has been spread among Jewish people to this day.";
csb[16] = "The eleven disciples traveled to Galilee, to the mountain where Jesus had directed them.";
csb[17] = "When they saw him, they worshiped, but some doubted.";
csb[18] = "Jesus came near and said to them, &quot;All authority has been given to me in heaven and on earth.";

csb[20] = "&quot;teaching them to observe everything I have commanded you. And remember, I am with you always, to the end of the age.&quot;";
