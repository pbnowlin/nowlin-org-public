csb[1] = "&quot;Be careful not to practice your righteousness in front of others to be seen by them. Otherwise, you have no reward with your Father in heaven.";
csb[2] = "&quot;So whenever you give to the poor, don\'t sound a trumpet before you, as the hypocrites do in the synagogues and on the streets, to be applauded by people. Truly I tell you, they have their reward.";
csb[3] = "&quot;But when you give to the poor, don\'t let your left hand know what your right hand is doing,";
csb[4] = "&quot;so that your giving may be in secret. And your Father who sees in secret will reward you.";
csb[5] = "&quot;Whenever you pray, you must not be like the hypocrites, because they love to pray standing in the synagogues and on the street corners to be seen by people. Truly I tell you, they have their reward.";
csb[6] = "&quot;But when you pray, go into your private room, shut your door, and pray to your Father who is in secret. And your Father who sees in secret will reward you.";
csb[7] = "&quot;When you pray, don\'t babble like the Gentiles, since they imagine they\'ll be heard for their many words.";
csb[8] = "&quot;Don\'t be like them, because your Father knows the things you need before you ask him.";
csb[9] = "&quot;Therefore, you should pray like this: Our Father in heaven, your name be honored as holy.";
csb[10] = "&quot;Your kingdom come. Your will be done";
csb[11] = "&quot;on earth as it is in heaven. Give us today our daily bread.";
csb[12] = "&quot;And forgive us our debts, as we also have forgiven our debtors.";
csb[13] = "&quot;And do not bring us into temptation, but deliver us from the evil one.";
csb[14] = "&quot;For if you forgive others their offenses, your heavenly Father will forgive you as well.";
csb[15] = "&quot;But if you don\'t forgive others, your Father will not forgive your offenses.";
csb[16] = "&quot;Whenever you fast, don\'t be gloomy like the hypocrites. For they make their faces unattractive so that their fasting is obvious to people. Truly I tell you, they have their reward.";
csb[17] = "&quot;But when you fast, put oil on your head and wash your face,";
csb[18] = "&quot;so that your fasting isn\'t obvious to others but to your Father who is in secret. And your Father who sees in secret will reward you.";
csb[19] = "&quot;Don\'t store up for yourselves treasures on earth, where moth and rust destroy and where thieves break in and steal.";
csb[20] = "&quot;But store up for yourselves treasures in heaven, where neither moth nor rust destroys, and where thieves don\'t break in and steal.";
csb[21] = "&quot;For where your treasure is, there your heart will be also.";
csb[22] = "&quot;The eye is the lamp of the body. If your eye is healthy, your whole body will be full of light.";
csb[23] = "&quot;But if your eye is bad, your whole body will be full of darkness. So if the light within you is darkness, how deep is that darkness!";
csb[24] = "&quot;No one can serve two masters, since either he will hate one and love the other, or he will be devoted to one and despise the other. You cannot serve both God and money.";
csb[25] = "&quot;Therefore I tell you: Don\'t worry about your life, what you will eat or what you will drink; or about your body, what you will wear. Isn\'t life more than food and the body more than clothing?";
csb[26] = "&quot;Consider the birds of the sky: They don\'t sow or reap or gather into barns, yet your heavenly Father feeds them. Aren\'t you worth more than they?";
csb[27] = "&quot;Can any of you add one moment to his life-span by worrying?";
csb[28] = "&quot;And why do you worry about clothes? Observe how the wildflowers of the field grow: They don\'t labor or spin thread.";
csb[29] = "&quot;Yet I tell you that not even Solomon in all his splendor was adorned like one of these.";
csb[30] = "&quot;If that\'s how God clothes the grass of the field, which is here today and thrown into the furnace tomorrow, won\'t he do much more for you -- you of little faith?";
csb[31] = "&quot;So don\'t worry, saying, \'What will we eat? \' or \'What will we drink? \' or \'What will we wear? \'";
csb[32] = "&quot;For the Gentiles eagerly seek all these things, and your heavenly Father knows that you need them.";
csb[33] = "&quot;But seek first the kingdom of God and his righteousness, and all these things will be provided for you.";
csb[34] = "&quot;Therefore don\'t worry about tomorrow, because tomorrow will worry about itself. Each day has enough trouble of its own.";

kjv[24] = "No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon.";
rsv[24] = "&quot;No one can serve two masters; for either he will hate the one and love the other, or he will be devoted to the one and despise the other. You cannot serve God and mammon.";
asv[24] = "No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to one, and despise the other. Ye cannot serve God and mammon.";
yng[24] = "`None is able to serve two lords, for either he will hate the one and love the other, or he will hold to the one, and despise the other; ye are not able to serve God and Mammon.";
dby[24] = "No one can serve two masters; for either he will hate the one and will love the other, or he will hold to the one and despise the other. Ye cannot serve God and mammon.";
web[24] = "No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon.";
hnv[24] = "&quot;No one can serve two masters, for either he will hate the one and love the other; or else he will be devoted to one and despise the other. You can\'t serve both God and Mammon.";
vul[24] = "nemo potest duobus dominis servire aut enim unum odio habebit et alterum diliget aut unum sustinebit et alterum contemnet non potestis Deo servire et mamonae";
kjv[25] = "Therefore I say unto you, Take no thought for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than meat, and the body than raiment?";
rsv[25] = "&quot;Therefore I tell you, do not be anxious about your life, what you shall eat or what you shall drink, nor about your body, what you shall put on. Is not life more than food, and the body more than clothing?";
asv[25] = "Therefore I say unto you, Be not anxious for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than the food, and the body than the raiment?";
yng[25] = "`Because of this I say to you, be not anxious for your life, what ye may eat, and what ye may drink, nor for your body, what ye may put on. Is not the life more than the nourishment, and the body than the clothing?";
dby[25] = "For this cause I say unto you, Do not be careful about your life, what ye should eat and what ye should drink; nor for your body what ye should put on. Is not the life more than food, and the body than raiment?";
web[25] = "Therefore I say to you, Be not anxious for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than food, and the body than raiment?";
hnv[25] = "Therefore, I tell you, don\'t be anxious for your life: what you will eat, or what you will drink; nor yet for your body, what you will wear. Isn\'t life more than food, and the body more than clothing?";
vul[25] = "ideo dico vobis ne solliciti sitis animae vestrae quid manducetis neque corpori vestro quid induamini nonne anima plus est quam esca et corpus plus est quam vestimentum";
kjv[26] = "Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?";
rsv[26] = "Look at the birds of the air: they neither sow nor reap nor gather into barns, and yet your heavenly Father feeds them. Are you not of more value than they?";
asv[26] = "Behold the birds of the heaven, that they sow not, neither do they reap, nor gather into barns; and your heavenly Father feedeth them. Are not ye of much more value than they?";
yng[26] = "look to the fowls of the heaven, for they do not sow, nor reap, nor gather into storehouses, and your heavenly Father doth nourish them; are not ye much better than they?";
dby[26] = "Look at the birds of the heaven, that they sow not, nor reap, nor gather into granaries, and your heavenly Father nourishes them. Are *ye* not much more excellent than they?";
web[26] = "Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?";
hnv[26] = "See the birds of the sky, that they don\'t sow, neither do they reap, nor gather into barns. Your heavenly Father feeds them. Aren\'t you of much more value than they?";
vul[26] = "respicite volatilia caeli quoniam non serunt neque metunt neque congregant in horrea et Pater vester caelestis pascit illa nonne vos magis pluris estis illis";
kjv[27] = "Which of you by taking thought can add one cubit unto his stature?";
rsv[27] = "And which of you by being anxious can add one cubit to his span of life?";
asv[27] = "And which of you by being anxious can add one cubit unto the measure of his life?";
yng[27] = "`And who of you, being anxious, is able to add to his age one cubit?";
dby[27] = "But which of you by carefulness can add to his growth one cubit?";
web[27] = "Which of you by anxious care can add one cubit to his stature?";
hnv[27] = "&quot;Which of you, by being anxious, can add one cubit to the measure of his life?";
vul[27] = "quis autem vestrum cogitans potest adicere ad staturam suam cubitum unum";
kjv[28] = "And why take ye thought for raiment? Consider the lilies of the field, how they grow; they toil not, neither do they spin:";
rsv[28] = "And why are you anxious about clothing? Consider the lilies of the field, how they grow; they neither toil nor spin;";
asv[28] = "And why are ye anxious concerning raiment? Consider the lilies of the field, how they grow; they toil not, neither do they spin:";
yng[28] = "and about clothing why are ye anxious? consider well the lilies of the field; how do they grow? they do not labour, nor do they spin;";
dby[28] = "And why are ye careful about clothing? Observe with attention the lilies of the field, how they grow: they toil not, neither do they spin;";
web[28] = "And why are ye anxious for raiment? Consider the lilies of the field how they grow? they toil not, neither do they spin?";
hnv[28] = "Why are you anxious about clothing? Consider the lilies of the field, how they grow. They don\'t toil, neither do they spin,";
vul[28] = "et de vestimento quid solliciti estis considerate lilia agri quomodo crescunt non laborant nec nent";
kjv[29] = "And yet I say unto you, That even Solomon in all his glory was not arrayed like one of these.";
rsv[29] = "yet I tell you, even Solomon in all his glory was not arrayed like one of these.";
asv[29] = "yet I say unto you, that even Solomon in all his glory was not arrayed like one of these.";
yng[29] = "and I say to you, that not even Solomon in all his glory was arrayed as one of these.";
dby[29] = "but I say unto you, that not even Solomon in all his glory was clothed as one of these.";
web[29] = "And yet I say to you, that even Solomon in all his glory was not arrayed like one of these.";
hnv[29] = "yet I tell you that even Shlomo in all his glory was not dressed like one of these.";
vul[29] = "dico autem vobis quoniam nec Salomon in omni gloria sua coopertus est sicut unum ex istis";
kjv[30] = "Wherefore, if God so clothe the grass of the field, which to day is, and to morrow is cast into the oven, [shall he] not much more [clothe] you, O ye of little faith?";
rsv[30] = "But if God so clothes the grass of the field, which today is alive and tomorrow is thrown into the oven, will he not much more clothe you, O men of little faith?";
asv[30] = "But if God doth so clothe the grass of the field, which to-day is, and to-morrow is cast into the oven, [shall he] not much more [clothe] you, O ye of little faith?";
yng[30] = "`And if the herb of the field, that to-day is, and to-morrow is cast to the furnace, God doth so clothe -- not much more you, O ye of little faith?";
dby[30] = "But if God so clothe the herbage of the field, which is to-day, and to-morrow is cast into [the] oven, will he not much rather you, O [ye] of little faith?";
web[30] = "Wherefore, if God so clotheth the grass of the field, which to-day is, and to-morrow is cast into the oven, [will he] not much more [clothe] you, O ye of little faith?";
hnv[30] = "But if God so clothes the grass of the field, which today exists, and tomorrow is thrown into the oven, won\'t he much more clothe you, you of little faith?";
vul[30] = "si autem faenum agri quod hodie est et cras in clibanum mittitur Deus sic vestit quanto magis vos minimae fidei";

yng[31] = "therefore ye may not be anxious, saying, What may we eat? or, What may we drink? or, What may we put round?";
dby[31] = "Be not therefore careful, saying, What shall we eat? or What shall we drink? or What shall we put on?";
web[31] = "Therefore be not anxious, saying, What shall we eat? or what shall we drink? or, with what shall we be clothed?";
hnv[31] = "&quot;Therefore don\'t be anxious, saying, \'What will we eat?\', \'What will we drink?\' or, \'With what will we be clothed?\'";

rsv[32] = "For the Gentiles seek all these things; and your heavenly Father knows that you need them all.";
asv[32] = "For after all these things do the Gentiles seek; for your heavenly Father knoweth that ye have need of all these things.";
yng[32] = "for all these do the nations seek for, for your heavenly Father doth know that ye have need of all these;";
dby[32] = "for all these things the nations seek after; for your heavenly Father knows that ye have need of all these things.";
web[32] = "(For after all these things do the Gentiles seek) for your heavenly Father knoweth that ye have need of all these things.";
hnv[32] = "For the Goyim seek after all these things, for your heavenly Father knows that you need all these things.";

rsv[33] = "But seek first his kingdom and his righteousness, and all these things shall be yours as well.";
asv[33] = "But seek ye first his kingdom, and his righteousness; and all these things shall be added unto you.";
yng[33] = "but seek ye first the reign of God and His righteousness, and all these shall be added to you.";
dby[33] = "But seek ye first the kingdom of God and his righteousness, and all these things shall be added unto you.";
web[33] = "But seek ye first the kingdom of God, and his righteousness, and all these things shall be added to you.";
hnv[33] = "But seek first God\'s Kingdom, and his righteousness; and all these things will be given to you as well.";

kjv[34] = "Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day [is] the evil thereof.";
rsv[34] = "&quot;Therefore do not be anxious about tomorrow, for tomorrow will be anxious for itself. Let the day\'s own trouble be sufficient for the day.";
asv[34] = "Be not therefore anxious for the morrow: for the morrow will be anxious for itself. Sufficient unto the day is the evil thereof.";
yng[34] = "Be not therefore anxious for the morrow, for the morrow shall be anxious for its own things; sufficient for the day [is] the evil of it.";
dby[34] = "Be not careful therefore for the morrow, for the morrow shall be careful about itself. Sufficient to the day [is] its own evil.";
web[34] = "Therefore be not anxious for the morrow: for the morrow will be solicitous for the things of itself. Sufficient to the day [is] its own evil.";
hnv[34] = "Therefore don\'t be anxious for tomorrow, for tomorrow will be anxious for itself. Each day\'s own evil is sufficient.";
