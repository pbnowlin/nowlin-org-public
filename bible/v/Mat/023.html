csb[1] = "Then Jesus spoke to the crowds and to his disciples:";
csb[2] = "&quot;The scribes and the Pharisees are seated in the chair of Moses.";
csb[3] = "&quot;Therefore do whatever they tell you, and observe it. But don\'t do what they do, because they don\'t practice what they teach.";
csb[4] = "&quot;They tie up heavy loads that are hard to carry and put them on people\'s shoulders, but they themselves aren\'t willing to lift a finger to move them.";
csb[5] = "&quot;They do everything to be seen by others: They enlarge their phylacteries and lengthen their tassels.";
csb[6] = "&quot;They love the place of honor at banquets, the front seats in the synagogues,";
csb[7] = "&quot;greetings in the marketplaces, and to be called \'Rabbi\' by people.";
csb[8] = "&quot;But you are not to be called \'Rabbi,\' because you have one Teacher, and you are all brothers and sisters.";
csb[9] = "&quot;Do not call anyone on earth your father, because you have one Father, who is in heaven.";
csb[10] = "&quot;You are not to be called instructors either, because you have one Instructor, the Messiah.";
csb[11] = "&quot;The greatest among you will be your servant.";
csb[12] = "&quot;Whoever exalts himself will be humbled, and whoever humbles himself will be exalted.";
csb[13] = "&quot;Woe to you, scribes and Pharisees, hypocrites! You shut the door of the kingdom of heaven in people\'s faces. For you don\'t go in, and you don\'t allow those entering to go in.";
csb[14] = " ";
csb[15] = "&quot;Woe to you, scribes and Pharisees, hypocrites! You travel over land and sea to make one convert, and when he becomes one, you make him twice as fit for hell as you are!";
csb[16] = "&quot;Woe to you, blind guides, who say, \'Whoever takes an oath by the temple, it means nothing. But whoever takes an oath by the gold of the temple is bound by his oath.\'";
csb[17] = "&quot;Blind fools! For which is greater, the gold or the temple that sanctified the gold?";
csb[18] = "&quot;Also, \'Whoever takes an oath by the altar, it means nothing; but whoever takes an oath by the gift that is on it is bound by his oath.\'";
csb[19] = "&quot;Blind people! For which is greater, the gift or the altar that sanctifies the gift?";
csb[20] = "&quot;Therefore, the one who takes an oath by the altar takes an oath by it and by everything on it.";
csb[21] = "&quot;The one who takes an oath by the temple takes an oath by it and by him who dwells in it.";
csb[22] = "&quot;And the one who takes an oath by heaven takes an oath by God\'s throne and by him who sits on it.";
csb[23] = "&quot;Woe to you, scribes and Pharisees, hypocrites! You pay a tenth of mint, dill, and cumin, and yet you have neglected the more important matters of the law -- justice, mercy, and faithfulness. These things should have been done without neglecting the others.";
csb[24] = "&quot;Blind guides! You strain out a gnat, but gulp down a camel!";
csb[25] = "&quot;Woe to you, scribes and Pharisees, hypocrites! You clean the outside of the cup and dish, but inside they are full of greed and self-indulgence.";
csb[26] = "&quot;Blind Pharisee! First clean the inside of the cup, so that the outside of it may also become clean.";
csb[27] = "&quot;Woe to you, scribes and Pharisees, hypocrites! You are like whitewashed tombs, which appear beautiful on the outside, but inside are full of the bones of the dead and every kind of impurity.";
csb[28] = "&quot;In the same way, on the outside you seem righteous to people, but inside you are full of hypocrisy and lawlessness.";
csb[29] = "&quot;Woe to you, scribes and Pharisees, hypocrites! You build the tombs of the prophets and decorate the graves of the righteous,";
csb[30] = "&quot;and you say, \'If we had lived in the days of our ancestors, we wouldn\'t have taken part with them in shedding the prophets\' blood.\'";
csb[31] = "&quot;So you testify against yourselves that you are descendants of those who murdered the prophets.";
csb[32] = "&quot;Fill up, then, the measure of your ancestors\' sins!";
csb[33] = "&quot;Snakes! Brood of vipers! How can you escape being condemned to hell?";
csb[34] = "&quot;This is why I am sending you prophets, sages, and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and pursue from town to town.";
csb[35] = "&quot;So all the righteous blood shed on the earth will be charged to you, from the blood of righteous Abel to the blood of Zechariah, son of Berechiah, whom you murdered between the sanctuary and the altar.";
csb[36] = "&quot;Truly I tell you, all these things will come on this generation.";
csb[37] = "&quot;Jerusalem, Jerusalem, who kills the prophets and stones those who are sent to her. How often I wanted to gather your children together, as a hen gathers her chicks under her wings, but you were not willing!";
csb[38] = "&quot;See, your house is left to you desolate.";
csb[39] = "&quot;For I tell you, you will not see me again until you say, \'Blessed is he who comes in the name of the Lord\'! &quot;";

kjv[23] = "Woe unto you, scribes and Pharisees, hypocrites! for ye pay tithe of mint and anise and cummin, and have omitted the weightier [matters] of the law, judgment, mercy, and faith: these ought ye to have done, and not to leave the other undone.";
