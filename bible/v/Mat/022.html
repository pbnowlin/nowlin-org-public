csb[1] = "Once more Jesus spoke to them in parables:";
csb[2] = "&quot;The kingdom of heaven is like a king who gave a wedding banquet for his son.";
csb[3] = "&quot;He sent his servants to summon those invited to the banquet, but they didn\'t want to come.";
csb[4] = "&quot;Again, he sent out other servants and said, \'Tell those who are invited: See, I\'ve prepared my dinner; my oxen and fattened cattle have been slaughtered, and everything is ready. Come to the wedding banquet.\'";
csb[5] = "&quot;But they paid no attention and went away, one to his own farm, another to his business,";
csb[6] = "&quot;while the rest seized his servants, mistreated them, and killed them.";
csb[7] = "&quot;The king was enraged, and he sent out his troops, killed those murderers, and burned down their city.";
csb[8] = "&quot;Then he told his servants, \'The banquet is ready, but those who were invited were not worthy.";
csb[9] = "&quot;Go then to where the roads exit the city and invite everyone you find to the banquet.\'";
csb[10] = "&quot;So those servants went out on the roads and gathered everyone they found, both evil and good. The wedding banquet was filled with guests.";
csb[11] = "&quot;When the king came in to see the guests, he saw a man there who was not dressed for a wedding.";
csb[12] = "&quot;So he said to him, \'Friend, how did you get in here without wedding clothes? \' The man was speechless.";
csb[13] = "&quot;Then the king told the attendants, \'Tie him up hand and foot, and throw him into the outer darkness, where there will be weeping and gnashing of teeth.\'";
csb[14] = "&quot;For many are invited, but few are chosen.&quot;";
csb[15] = "Then the Pharisees went and plotted how to trap him by what he said.";
csb[16] = "So they sent their disciples to him, along with the Herodians. &quot;Teacher,&quot; they said, &quot;we know that you are truthful and teach truthfully the way of God. You don\'t care what anyone thinks nor do you show partiality.";
csb[17] = "&quot;Tell us, then, what you think. Is it lawful to pay taxes to Caesar or not? &quot;";
csb[18] = "Perceiving their malicious intent, Jesus said, &quot;Why are you testing me, hypocrites?";
csb[19] = "&quot;Show me the coin used for the tax.&quot; They brought him a denarius.";
csb[20] = "&quot;Whose image and inscription is this? &quot; he asked them.";
csb[21] = "&quot;Caesar\'s,&quot; they said to him. Then he said to them, &quot;Give, then, to Caesar the things that are Caesar\'s, and to God the things that are God\'s.&quot;";
csb[22] = "When they heard this, they were amazed. So they left him and went away.";
csb[23] = "That same day some Sadducees, who say there is no resurrection, came up to him and questioned him:";
csb[24] = "&quot;Teacher, Moses said, if a man dies, having no children, his brother is to marry his wife and raise up offspring for his brother.";
csb[25] = "&quot;Now there were seven brothers among us. The first got married and died. Having no offspring, he left his wife to his brother.";
csb[26] = "&quot;The same thing happened to the second also, and the third, and so on to all seven.";
csb[27] = "&quot;Last of all, the woman died.";
csb[28] = "&quot;In the resurrection, then, whose wife will she be of the seven? For they all had married her.&quot;";
csb[29] = "Jesus answered them, &quot;You are mistaken, because you don\'t know the Scriptures or the power of God.";
csb[30] = "&quot;For in the resurrection they neither marry nor are given in marriage but are like angels in heaven.";
csb[31] = "&quot;Now concerning the resurrection of the dead, haven\'t you read what was spoken to you by God:";
csb[32] = "&quot;I am the God of Abraham and the God of Isaac and the God of Jacob? He is not the God of the dead, but of the living.&quot;";
csb[33] = "And when the crowds heard this, they were astonished at his teaching.";
csb[34] = "When the Pharisees heard that he had silenced the Sadducees, they came together.";
csb[35] = "And one of them, an expert in the law, asked a question to test him:";
csb[36] = "&quot;Teacher, which command in the law is the greatest? &quot;";
csb[37] = "He said to him, &quot;Love the Lord your God with all your heart, with all your soul, and with all your mind.";
csb[38] = "&quot;This is the greatest and most important command.";
csb[39] = "&quot;The second is like it: Love your neighbor as yourself.";
csb[40] = "&quot;All the Law and the Prophets depend on these two commands.&quot;";
csb[41] = "While the Pharisees were together, Jesus questioned them,";
csb[42] = "&quot;What do you think about the Messiah? Whose son is he? &quot; They replied, &quot;David\'s.&quot;";
csb[43] = "He asked them, &quot;How is it then that David, inspired by the Spirit, calls him \'Lord\':";
csb[44] = "&quot;The Lord declared to my Lord, \'Sit at my right hand until I put your enemies under your feet\'?";
csb[45] = "&quot;If David calls him \'Lord,\' how then can he be his son? &quot;";
csb[46] = "No one was able to answer him at all, and from that day no one dared to question him anymore.";
