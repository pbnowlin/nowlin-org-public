csb[1] = "&quot;For the kingdom of heaven is like a landowner who went out early in the morning to hire workers for his vineyard.";
csb[2] = "&quot;After agreeing with the workers on one denarius, he sent them into his vineyard for the day.";
csb[3] = "&quot;When he went out about nine in the morning, he saw others standing in the marketplace doing nothing.";
csb[4] = "&quot;He said to them, \'You also go into my vineyard, and I\'ll give you whatever is right.\' So off they went.";
csb[5] = "&quot;About noon and about three, he went out again and did the same thing.";
csb[6] = "&quot;Then about five he went and found others standing around and said to them, \'Why have you been standing here all day doing nothing? \'";
csb[7] = "&quot; \'Because no one hired us,\' they said to him. &quot; \'You also go into my vineyard,\' he told them.";
csb[8] = "&quot;When evening came, the owner of the vineyard told his foreman, \'Call the workers and give them their pay, starting with the last and ending with the first.\'";
csb[9] = "&quot;When those who were hired about five came, they each received one denarius.";
csb[10] = "&quot;So when the first ones came, they assumed they would get more, but they also received a denarius each.";
csb[11] = "&quot;When they received it, they began to complain to the landowner:";
csb[12] = "&quot;\'These last men put in one hour, and you made them equal to us who bore the burden of the day\'s work and the burning heat.\'";
csb[13] = "&quot;He replied to one of them, \'Friend, I\'m doing you no wrong. Didn\'t you agree with me on a denarius?";
csb[14] = "&quot;Take what\'s yours and go. I want to give this last man the same as I gave you.";
csb[15] = "&quot;Don\'t I have the right to do what I want with what is mine? Are you jealous because I\'m generous? \'";
csb[16] = "&quot;So the last will be first, and the first last.&quot;";
csb[17] = "While going up to Jerusalem, Jesus took the twelve disciples aside privately and said to them on the way,";
csb[18] = "&quot;See, we are going up to Jerusalem. The Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death.";
csb[19] = "&quot;They will hand him over to the Gentiles to be mocked, flogged, and crucified, and on the third day he will be raised. &quot;";
csb[20] = "Then the mother of Zebedee\'s sons approached him with her sons. She knelt down to ask him for something.";
csb[21] = "&quot;What do you want? &quot; he asked her. &quot;Promise,&quot; she said to him, &quot;that these two sons of mine may sit, one on your right and the other on your left, in your kingdom.&quot;";
csb[22] = "Jesus answered, &quot;You don\'t know what you\'re asking. Are you able to drink the cup that I am about to drink? &quot; &quot;We are able,&quot; they said to him.";
csb[23] = "He told them, &quot;You will indeed drink my cup, but to sit at my right and left is not mine to give; instead, it is for those for whom it has been prepared by my Father.&quot;";
csb[24] = "When the ten disciples heard this, they became indignant with the two brothers.";
csb[25] = "Jesus called them over and said, &quot;You know that the rulers of the Gentiles lord it over them, and those in high positions act as tyrants over them.";
csb[26] = "&quot;It must not be like that among you. On the contrary, whoever wants to become great among you must be your servant,";
csb[27] = "&quot;and whoever wants to be first among you must be your slave;";
csb[28] = "&quot;just as the Son of Man did not come to be served, but to serve, and to give his life as a ransom for many.&quot;";
csb[29] = "As they were leaving Jericho, a large crowd followed him.";
csb[30] = "There were two blind men sitting by the road. When they heard that Jesus was passing by, they cried out, &quot;Lord, have mercy on us, Son of David! &quot;";
csb[31] = "The crowd demanded that they keep quiet, but they cried out all the more, &quot;Lord, have mercy on us, Son of David! &quot;";
csb[32] = "Jesus stopped, called them, and said, &quot;What do you want me to do for you? &quot;";
csb[33] = "&quot;Lord,&quot; they said to him, &quot;open our eyes.&quot;";
csb[34] = "Moved with compassion, Jesus touched their eyes. Immediately they could see, and they followed him.";
