csb[1] = "When they approached Jerusalem and came to Bethphage at the Mount of Olives, Jesus then sent two disciples,";
csb[2] = "telling them, &quot;Go into the village ahead of you. At once you will find a donkey tied there with her foal. Untie them and bring them to me.";
csb[3] = "&quot;If anyone says anything to you, say that the Lord needs them, and he will send them at once.&quot;";
csb[4] = "This took place so that what was spoken through the prophet might be fulfilled:";
csb[5] = "Tell Daughter Zion, &quot;See, your King is coming to you, gentle, and mounted on a donkey, and on a colt, the foal of a donkey.&quot;";
csb[6] = "The disciples went and did just as Jesus directed them.";
csb[7] = "They brought the donkey and its foal; then they laid their clothes on them, and he sat on them.";
csb[8] = "A very large crowd spread their clothes on the road; others were cutting branches from the trees and spreading them on the road.";
csb[9] = "Then the crowds who went ahead of him and those who followed shouted: Hosanna to the Son of David! Blessed is he who comes in the name of the Lord! Hosanna in the highest heaven!";
csb[10] = "When he entered Jerusalem, the whole city was in an uproar, saying, &quot;Who is this? &quot;";
csb[11] = "The crowds were saying, &quot;This is the prophet Jesus from Nazareth in Galilee.&quot;";
csb[12] = "Jesus went into the temple and threw out all those buying and selling. He overturned the tables of the money changers and the chairs of those selling doves.";
csb[13] = "He said to them, &quot;It is written, my house will be called a house of prayer, but you are making it a den of thieves! &quot;";
csb[14] = "The blind and the lame came to him in the temple, and he healed them.";
csb[15] = "When the chief priests and the scribes saw the wonders that he did and the children shouting in the temple, &quot;Hosanna to the Son of David! &quot; they were indignant";
csb[16] = "and said to him, &quot;Do you hear what these children are saying? &quot; Jesus replied, &quot;Yes, have you never read: You have prepared praise from the mouths of infants and nursing babies? &quot;";
csb[17] = "Then he left them, went out of the city to Bethany, and spent the night there.";
csb[18] = "Early in the morning, as he was returning to the city, he was hungry.";
csb[19] = "Seeing a lone fig tree by the road, he went up to it and found nothing on it except leaves. And he said to it, &quot;May no fruit ever come from you again! &quot; At once the fig tree withered.";
csb[20] = "When the disciples saw it, they were amazed and said, &quot;How did the fig tree wither so quickly? &quot;";
csb[21] = "Jesus answered them, &quot;Truly I tell you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you tell this mountain, \'Be lifted up and thrown into the sea,\' it will be done.";
csb[22] = "&quot;And if you believe, you will receive whatever you ask for in prayer.&quot;";
csb[23] = "When he entered the temple, the chief priests and the elders of the people came to him as he was teaching and said, &quot;By what authority are you doing these things? Who gave you this authority? &quot;";
csb[24] = "Jesus answered them, &quot;I will also ask you one question, and if you answer it for me, then I will tell you by what authority I do these things.";
csb[25] = "&quot;Did John\'s baptism come from heaven, or was it of human origin? &quot; They discussed it among themselves, &quot;If we say, \'From heaven,\' he will say to us, \'Then why didn\'t you believe him? \'";
csb[26] = "&quot;But if we say, \'Of human origin,\' we\'re afraid of the crowd, because everyone considers John to be a prophet.&quot;";
csb[27] = "So they answered Jesus, &quot;We don\'t know.&quot; And he said to them, &quot;Neither will I tell you by what authority I do these things.";
csb[28] = "&quot;What do you think? A man had two sons. He went to the first and said, \'My son, go work in the vineyard today.\'";
csb[29] = "&quot;He answered, \'I don\'t want to,\' but later he changed his mind and went.";
csb[30] = "&quot;Then the man went to the other and said the same thing. \'I will, sir,\' he answered, but he didn\'t go.";
csb[31] = "&quot;Which of the two did his father\'s will? &quot; They said, &quot;The first.&quot; Jesus said to them, &quot;Truly I tell you, tax collectors and prostitutes are entering the kingdom of God before you.";
csb[32] = "&quot;For John came to you in the way of righteousness, and you didn\'t believe him. Tax collectors and prostitutes did believe him; but you, when you saw it, didn\'t even change your minds then and believe him.";
csb[33] = "&quot;Listen to another parable: There was a landowner, who planted a vineyard, put a fence around it, dug a winepress in it, and built a watchtower. He leased it to tenant farmers and went away.";
csb[34] = "&quot;When the time came to harvest fruit, he sent his servants to the farmers to collect his fruit.";
csb[35] = "&quot;The farmers took his servants, beat one, killed another, and stoned a third.";
csb[36] = "&quot;Again, he sent other servants, more than the first group, and they did the same to them.";
csb[37] = "&quot;Finally, he sent his son to them. \'They will respect my son,\' he said.";
csb[38] = "&quot;But when the tenant farmers saw the son, they said to each other, \'This is the heir. Come, let\'s kill him and take his inheritance.\'";
csb[39] = "&quot;So they seized him, threw him out of the vineyard, and killed him.";
csb[40] = "&quot;Therefore, when the owner of the vineyard comes, what will he do to those farmers? &quot;";
csb[41] = "&quot;He will completely destroy those terrible men,&quot; they told him, &quot;and lease his vineyard to other farmers who will give him his fruit at the harvest.&quot;";
csb[42] = "Jesus said to them, &quot;Have you never read in the Scriptures: The stone that the builders rejected has become the cornerstone. This is what the Lord has done and it is wonderful in our eyes?";
csb[43] = "&quot;Therefore I tell you, the kingdom of God will be taken away from you and given to a people producing its fruit.";
csb[44] = "&quot;Whoever falls on this stone will be broken to pieces; but on whomever it falls, it will shatter him.&quot;";
csb[45] = "When the chief priests and the Pharisees heard his parables, they knew he was speaking about them.";
csb[46] = "Although they were looking for a way to arrest him, they feared the crowds, because the people regarded him as a prophet.";
