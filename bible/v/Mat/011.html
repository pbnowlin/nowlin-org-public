csb[1] = "When Jesus had finished giving instructions to his twelve disciples, he moved on from there to teach and preach in their towns.";
csb[2] = "Now when John heard in prison what the Christ was doing, he sent a message through his disciples";
csb[3] = "and asked him, &quot;Are you the one who is to come, or should we expect someone else? &quot;";
csb[4] = "Jesus replied to them, &quot;Go and report to John what you hear and see:";
csb[5] = "&quot;The blind receive their sight, the lame walk, those with leprosy are cleansed, the deaf hear, the dead are raised, and the poor are told the good news,";
csb[6] = "&quot;and blessed is the one who isn\'t offended by me.&quot;";
csb[7] = "As these men were leaving, Jesus began to speak to the crowds about John: &quot;What did you go out into the wilderness to see? A reed swaying in the wind?";
csb[8] = "&quot;What then did you go out to see? A man dressed in soft clothes? See, those who wear soft clothes are in royal palaces.";
csb[9] = "&quot;What then did you go out to see? A prophet? Yes, I tell you, and more than a prophet.";
csb[10] = "&quot;This is the one about whom it is written: See, I am sending my messenger ahead of you; he will prepare your way before you.";
csb[11] = "&quot;Truly I tell you, among those born of women no one greater than John the Baptist has appeared, but the least in the kingdom of heaven is greater than he.";
csb[12] = "&quot;From the days of John the Baptist until now, the kingdom of heaven has been suffering violence, and the violent have been seizing it by force.";
csb[13] = "&quot;For all the prophets and the law prophesied until John.";
csb[14] = "&quot;And if you\'re willing to accept it, he is the Elijah who is to come.";
csb[15] = "&quot;Let anyone who has ears listen.";
csb[16] = "&quot;To what should I compare this generation? It\'s like children sitting in the marketplaces who call out to other children:";
csb[17] = "&quot;We played the flute for you, but you didn\'t dance; we sang a lament, but you didn\'t mourn!";
csb[18] = "&quot;For John came neither eating nor drinking, and they say, \'He has a demon! \'";
csb[19] = "&quot;The Son of Man came eating and drinking, and they say, \'Look, a glutton and a drunkard, a friend of tax collectors and sinners! \' Yet wisdom is vindicated by her deeds.&quot;";
csb[20] = "Then he proceeded to denounce the towns where most of his miracles were done, because they did not repent:";
csb[21] = "&quot;Woe to you, Chorazin! Woe to you, Bethsaida! For if the miracles that were done in you had been done in Tyre and Sidon, they would have repented in sackcloth and ashes long ago.";
csb[22] = "&quot;But I tell you, it will be more tolerable for Tyre and Sidon on the day of judgment than for you.";
csb[23] = "&quot;And you, Capernaum, will you be exalted to heaven? No, you will go down to Hades. For if the miracles that were done in you had been done in Sodom, it would have remained until today.";
csb[24] = "&quot;But I tell you, it will be more tolerable for the land of Sodom on the day of judgment than for you.&quot;";
csb[25] = "At that time Jesus said, &quot;I praise you, Father, Lord of heaven and earth, because you have hidden these things from the wise and intelligent and revealed them to infants.";
csb[26] = "&quot;Yes, Father, because this was your good pleasure.";
csb[27] = "&quot;All things have been entrusted to me by my Father. No one knows the Son except the Father, and no one knows the Father except the Son and anyone to whom the Son desires to reveal him.";
csb[28] = "&quot;Come to me, all of you who are weary and burdened, and I will give you rest.";
csb[29] = "&quot;Take up my yoke and learn from me, because I am lowly and humble in heart, and you will find rest for your souls.";
csb[30] = "&quot;For my yoke is easy and my burden is light.&quot;";
