csb[1] = "When Jesus had finished saying these things, he departed from Galilee and went to the region of Judea across the Jordan.";
csb[2] = "Large crowds followed him, and he healed them there.";
csb[3] = "Some Pharisees approached him to test him. They asked, &quot;Is it lawful for a man to divorce his wife on any grounds? &quot;";
csb[4] = "&quot;Haven\'t you read,&quot; he replied, &quot;that he who created them in the beginning made them male and female,&quot;";
csb[5] = "and he also said, &quot;For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh?";
csb[6] = "&quot;So they are no longer two, but one flesh. Therefore, what God has joined together, let no one separate.&quot;";
csb[7] = "&quot;Why then,&quot; they asked him, &quot;did Moses command us to give divorce papers and to send her away? &quot;";
csb[8] = "He told them, &quot;Moses permitted you to divorce your wives because of the hardness of your hearts, but it was not like that from the beginning.";
csb[9] = "&quot;I tell you, whoever divorces his wife, except for sexual immorality, and marries another commits adultery.&quot;";
csb[10] = "His disciples said to him, &quot;If the relationship of a man with his wife is like this, it\'s better not to marry.&quot;";
csb[11] = "He responded, &quot;Not everyone can accept this saying, but only those to whom it has been given.";
csb[12] = "&quot;For there are eunuchs who were born that way from their mother\'s womb, there are eunuchs who were made by men, and there are eunuchs who have made themselves that way because of the kingdom of heaven. The one who is able to accept it should accept it.&quot;";
csb[13] = "Then children were brought to Jesus for him to place his hands on them and pray, but the disciples rebuked them.";
csb[14] = "Jesus said, &quot;Leave the children alone, and don\'t try to keep them from coming to me, because the kingdom of heaven belongs to such as these.&quot;";
csb[15] = "After placing his hands on them, he went on from there.";
csb[16] = "Just then someone came up and asked him, &quot;Teacher, what good must I do to have eternal life? &quot;";
csb[17] = "&quot;Why do you ask me about what is good? &quot; he said to him. &quot;There is only one who is good. If you want to enter into life, keep the commandments.&quot;";
csb[18] = "&quot;Which ones? &quot; he asked him. Jesus answered: Do not murder; do not commit adultery; do not steal; do not bear false witness;";
csb[19] = "honor your father and your mother; and love your neighbor as yourself.";
csb[20] = "&quot;I have kept all these,&quot; the young man told him. &quot;What do I still lack? &quot;";
csb[21] = "&quot;If you want to be perfect,&quot; Jesus said to him, &quot;go, sell your belongings and give to the poor, and you will have treasure in heaven. Then come, follow me.&quot;";
csb[22] = "When the young man heard that, he went away grieving, because he had many possessions.";
csb[23] = "Jesus said to his disciples, &quot;Truly I tell you, it will be hard for a rich person to enter the kingdom of heaven.";
csb[24] = "&quot;Again I tell you, it is easier for a camel to go through the eye of a needle than for a rich person to enter the kingdom of God.&quot;";
csb[25] = "When the disciples heard this, they were utterly astonished and asked, &quot;Then who can be saved? &quot;";
csb[26] = "Jesus looked at them and said, &quot;With man this is impossible, but with God all things are possible.&quot;";
csb[27] = "Then Peter responded to him, &quot;See, we have left everything and followed you. So what will there be for us? &quot;";
csb[28] = "Jesus said to them, &quot;Truly I tell you, in the renewal of all things, when the Son of Man sits on his glorious throne, you who have followed me will also sit on twelve thrones, judging the twelve tribes of Israel.";
csb[29] = "&quot;And everyone who has left houses or brothers or sisters or father or mother or children or fields because of my name will receive a hundred times more and will inherit eternal life.";
csb[30] = "&quot;But many who are first will be last, and the last first.";
kjv[1] = "And it came to pass, [that] when Jesus had finished these sayings, he departed from Galilee, and came into the coasts of Judaea beyond Jordan;";

kjv[21] = "Jesus said unto him, If thou wilt be perfect, go [and] sell that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come [and] follow me.";
kjv[22] = "But when the young man heard that saying, he went away sorrowful: for he had great possessions.";

kjv[26] = "But Jesus beheld [them], and said unto them, With men this is impossible; but with God all things are possible.";

yng[20] = "The young man saith to him, `All these did I keep from my youth; what yet do I lack?\'";
dby[20] = "The young man says to him, All these have I kept; what lack I yet?";
web[20] = "The young man saith to him, All these things have I kept from my youth: what lack I yet?";
hnv[20] = "The young man said to him, &quot;All these things I have observed from my youth. What do I still lack?&quot;";
vul[20] = "dicit illi adulescens omnia haec custodivi quid adhuc mihi deest";
rsv[21] = "Jesus said to him, &quot;If you would be perfect, go, sell what you possess and give to the poor, and you will have treasure in heaven; and come, follow me.&quot;";
asv[21] = "Jesus said unto him, If thou wouldest be perfect, go, sell that which thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, follow me.";
yng[21] = "Jesus said to him, `If thou dost will to be perfect, go away, sell what thou hast, and give to the poor, and thou shalt have treasure in heaven, and come, follow me.\'";
dby[21] = "Jesus said to him, If thou wouldest be perfect, go, sell what thou hast and give to [the] poor, and thou shalt have treasure in heaven; and come, follow me.";
web[21] = "Jesus said to him, If thou wilt be perfect, go [and] sell what thou hast, and give to the poor, and thou shalt have treasure in heaven: and come [and] follow me.";
hnv[21] = "Yeshua said to him, &quot;If you want to be perfect, go, sell what you have, and give to the poor, and you will have treasure in heaven; and come, follow me.&quot;";
vul[21] = "ait illi Iesus si vis perfectus esse vade vende quae habes et da pauperibus et habebis thesaurum in caelo et veni sequere me";
rsv[22] = "When the young man heard this he went away sorrowful; for he had great possessions.";
asv[22] = "But when the young man heard the saying, he went away sorrowful; for he was one that had great possessions.";
yng[22] = "And the young man, having heard the word, went away sorrowful, for he had many possessions;";
dby[22] = "But the young man, having heard the word, went away grieved, for he had large possessions.";
web[22] = "But when the young man heard that saying, he went away sorrowful: for he had great possessions.";
hnv[22] = "But when the young man heard the saying, he went away sad, for he was one who had great possessions.";
vul[22] = "cum audisset autem adulescens verbum abiit tristis erat enim habens multas possessiones";
rsv[23] = "And Jesus said to his disciples, &quot;Truly, I say to you, it will be hard for a rich man to enter the kingdom of heaven.";
asv[23] = "And Jesus said unto his disciples, Verily I say unto you, It is hard for a rich man to enter into the kingdom of heaven.";
yng[23] = "and Jesus said to his disciples, `Verily I say to you, that hardly shall a rich man enter into the reign of the heavens;";
dby[23] = "And Jesus said to his disciples, Verily I say unto you, A rich man shall with difficulty enter into the kingdom of the heavens;";
web[23] = "Then said Jesus to his disciples, Verily I say to you, that a rich man shall with difficulty enter into the kingdom of heaven.";
hnv[23] = "Yeshua said to his talmidim, &quot;Most assuredly I say to you, a rich man will enter into the Kingdom of Heaven with difficulty.";
vul[23] = "Iesus autem dixit discipulis suis amen dico vobis quia dives difficile intrabit in regnum caelorum";
rsv[24] = "Again I tell you, it is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.&quot;";

yng[24] = "and again I say to you, it is easier for a camel through the eye of a needle to go, than for a rich man to enter into the reign of God.\'";
dby[24] = "and again I say unto you, It is easier for a camel to enter a needle\'s eye than a rich man into the kingdom of God.";
web[24] = "And again I say to you, It is easier for a camel to go through the eye of a needle, than for a rich man to enter into the kingdom of God.";
hnv[24] = " Again I tell you, it is easier for a camel to go through a needle\'s eye, than for a rich man to enter into the Kingdom of God.&quot;";
vul[24] = "et iterum dico vobis facilius est camelum per foramen acus transire quam divitem intrare in regnum caelorum";
rsv[25] = "When the disciples heard this they were greatly astonished, saying, &quot;Who then can be saved?&quot;";
asv[25] = "And when the disciples heard it, they were astonished exceedingly, saying, Who then can be saved?";
yng[25] = "And his disciples having heard, were amazed exceedingly, saying, `Who, then, is able to be saved?\'";
dby[25] = "And when the disciples heard [it] they were exceedingly astonished, saying, Who then can be saved?";
web[25] = "When his disciples heard [it], they were exceedingly amazed, saying, Who then can be saved?";
hnv[25] = "When the talmidim heard it, they were exceedingly astonished, saying, &quot;Who then can be saved?&quot;";
vul[25] = "auditis autem his discipuli mirabantur valde dicentes quis ergo poterit salvus esse";
rsv[26] = "But Jesus looked at them and said to them, &quot;With men this is impossible, but with God all things are possible.&quot;";
asv[26] = "And Jesus looking upon [them] said to them, With men this is impossible; but with God all things are possible.";
yng[26] = "And Jesus having earnestly beheld, said to them, `With men this is impossible, but with God all things are possible.\'";
dby[26] = "But Jesus, looking on [them], said to them, With men this is impossible; but with God all things are possible.";
web[26] = "But Jesus beheld [them], and said to them, With men this is impossible, but with God all things are possible.";
hnv[26] = "Looking at them, Yeshua said, &quot;With men this is impossible, but with God all things are possible.&quot;";
vul[26] = "aspiciens autem Iesus dixit illis apud homines hoc inpossibile est apud Deum autem omnia possibilia sunt";
rsv[27] = "Then Peter said in reply, &quot;Lo, we have left everything and followed you. What then shall we have?&quot;";
asv[27] = "Then answered Peter and said unto him, Lo, we have left all, and followed thee; what then shall we have?";
yng[27] = "Then Peter answering said to him, `Lo, we did leave all, and follow thee, what then shall we have?\'";
dby[27] = "Then Peter answering said to him, Behold, *we* have left all things and have followed thee; what then shall happen to us?";
web[27] = "Then answered Peter, and said to him, Behold, we have forsaken all, and followed thee? what shall we have therefore?";
hnv[27] = "Then Rock answered, &quot;Behold, we have left everything, and followed you. What then will we have?&quot;";
vul[27] = "tunc respondens Petrus dixit ei ecce nos reliquimus omnia et secuti sumus te quid ergo erit nobis";
rsv[28] = "Jesus said to them, &quot;Truly, I say to you, in the new world, when the Son of man shall sit on his glorious throne, you who have followed me will also sit on twelve thrones, judging the twelve tribes of Israel.";
asv[28] = "And Jesus said unto them, Verily I say unto you, that ye who have followed me, in the regeneration when the Son of man shall sit on the throne of his glory, ye also shall sit upon twelve thrones, judging the twelve tribes of Israel.";
yng[28] = "And Jesus said to them, `Verily I say to you, that ye who did follow me, in the regeneration, when the Son of Man may sit upon a throne of his glory, shall sit -- ye also -- upon twelve thrones, judging the twelve tribes of Israel;";
dby[28] = "And Jesus said to them, Verily I say unto you, That *ye* who have followed me, in the regeneration when the Son of man shall sit down upon his throne of glory, *ye* also shall sit on twelve thrones, judging the twelve tribes of Israel.";
web[28] = "And Jesus said to them, Verily I say to you, that ye who have followed me in the regeneration, when the Son of man shall sit on the throne of his glory, ye also shall sit upon twelve thrones, judging the twelve tribes of Israel.";
hnv[28] = "Yeshua said to them, &quot;Most assuredly I tell you that you who have followed me, in the regeneration when the Son of Man will sit on the throne of his glory, you also will sit on twelve thrones, judging the twelve tribes of Yisra\'el.";
vul[28] = "Iesus autem dixit illis amen dico vobis quod vos qui secuti estis me in regeneratione cum sederit Filius hominis in sede maiestatis suae sedebitis et vos super sedes duodecim iudicantes duodecim tribus Israhel";

dby[29] = "And every one who has left houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my name\'s sake, shall receive a hundredfold, and shall inherit life eternal.";
web[29] = "And every one that hath forsaken houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands for my name\'s sake, shall receive a hundred-fold, and shall inherit everlasting life.";
