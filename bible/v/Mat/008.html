csb[1] = "When he came down from the mountain, large crowds followed him.";
csb[2] = "Right away a man with leprosy came up and knelt before him, saying, &quot;Lord, if you are willing, you can make me clean.&quot;";
csb[3] = "Reaching out his hand, Jesus touched him, saying, &quot;I am willing; be made clean.&quot; Immediately his leprosy was cleansed.";
csb[4] = "Then Jesus told him, &quot;See that you don\'t tell anyone; but go, show yourself to the priest, and offer the gift that Moses commanded, as a testimony to them.&quot;";
csb[5] = "When he entered Capernaum, a centurion came to him, pleading with him,";
csb[6] = "&quot;Lord, my servant is lying at home paralyzed, in terrible agony.&quot;";
csb[7] = "He said to him, &quot;Am I to come and heal him? &quot;";
csb[8] = "&quot;Lord,&quot; the centurion replied, &quot;I am not worthy to have you come under my roof. But just say the word, and my servant will be healed.";
csb[9] = "&quot;For I too am a man under authority, having soldiers under my command. I say to this one, \'Go,\' and he goes; and to another, \'Come,\' and he comes; and to my servant, \'Do this! \' and he does it.&quot;";
csb[10] = "Hearing this, Jesus was amazed and said to those following him, &quot;Truly I tell you, I have not found anyone in Israel with so great a faith.";
csb[11] = "&quot;I tell you that many will come from east and west to share the banquet with Abraham, Isaac, and Jacob in the kingdom of heaven.";
csb[12] = "&quot;But the sons of the kingdom will be thrown into the outer darkness where there will be weeping and gnashing of teeth.&quot;";
csb[13] = "Then Jesus told the centurion, &quot;Go. As you have believed, let it be done for you.&quot; And his servant was healed that very moment.";
csb[14] = "Jesus went into Peter\'s house and saw his mother-in-law lying in bed with a fever.";
csb[15] = "So he touched her hand, and the fever left her. Then she got up and began to serve him.";
csb[16] = "When evening came, they brought to him many who were demon-possessed. He drove out the spirits with a word and healed all who were sick,";
csb[17] = "so that what was spoken through the prophet Isaiah might be fulfilled: He himself took our weaknesses and carried our diseases.";
csb[18] = "When Jesus saw a large crowd around him, he gave the order to go to the other side of the sea.";
csb[19] = "A scribe approached him and said, &quot;Teacher, I will follow you wherever you go.&quot;";
csb[20] = "Jesus told him, &quot;Foxes have dens, and birds of the sky have nests, but the Son of Man has no place to lay his head.&quot;";
csb[21] = "&quot;Lord,&quot; another of his disciples said, &quot;first let me go bury my father.&quot;";
csb[22] = "But Jesus told him, &quot;Follow me, and let the dead bury their own dead.&quot;";
csb[23] = "As he got into the boat, his disciples followed him.";
csb[24] = "Suddenly, a violent storm arose on the sea, so that the boat was being swamped by the waves -- but Jesus kept sleeping.";
csb[25] = "So the disciples came and woke him up, saying, &quot;Lord, save us! We\'re going to die! &quot;";
csb[26] = "He said to them, &quot;Why are you afraid, you of little faith? &quot; Then he got up and rebuked the winds and the sea, and there was a great calm.";
csb[27] = "The men were amazed and asked, &quot;What kind of man is this? Even the winds and the sea obey him! &quot;";
csb[28] = "When he had come to the other side, to the region of the Gadarenes, two demon-possessed men met him as they came out of the tombs. They were so violent that no one could pass that way.";
csb[29] = "Suddenly they shouted, &quot;What do you have to do with us, Son of God? Have you come here to torment us before the time? &quot;";
csb[30] = "A long way off from them, a large herd of pigs was feeding.";
csb[31] = "&quot;If you drive us out,&quot; the demons begged him, &quot;send us into the herd of pigs.&quot;";
csb[32] = "&quot;Go! &quot; he told them. So when they had come out, they entered the pigs, and the whole herd rushed down the steep bank into the sea and perished in the water.";
csb[33] = "Then the men who tended them fled. They went into the city and reported everything, especially what had happened to those who were demon-possessed.";
csb[34] = "At that, the whole town went out to meet Jesus. When they saw him, they begged him to leave their region.";
kjv[1] = "When he was come down from the mountain, great multitudes followed him.";
kjv[2] = "And, behold, there came a leper and worshipped him, saying, Lord, if thou wilt, thou canst make me clean.";

kjv[13] = "And Jesus said unto the centurion, Go thy way; and as thou hast believed, [so] be it done unto thee. And his servant was healed in the selfsame hour.";
kjv[14] = "And when Jesus was come into Peter\'s house, he saw his wife\'s mother laid, and sick of a fever.";
kjv[15] = "And he touched her hand, and the fever left her: and she arose, and ministered unto them.";
kjv[16] = "When the even was come, they brought unto him many that were possessed with devils: and he cast out the spirits with [his] word, and healed all that were sick:";
kjv[17] = "That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare [our] sicknesses.";
kjv[18] = "Now when Jesus saw great multitudes about him, he gave commandment to depart unto the other side.";
kjv[19] = "And a certain scribe came, and said unto him, Master, I will follow thee whithersoever thou goest.";
kjv[20] = "And Jesus saith unto him, The foxes have holes, and the birds of the air [have] nests; but the Son of man hath not where to lay [his] head.";
kjv[21] = "And another of his disciples said unto him, Lord, suffer me first to go and bury my father.";
kjv[22] = "But Jesus said unto him, Follow me; and let the dead bury their dead.";
kjv[23] = "And when he was entered into a ship, his disciples followed him.";
kjv[24] = "And, behold, there arose a great tempest in the sea, insomuch that the ship was covered with the waves: but he was asleep.";
kjv[25] = "And his disciples came to [him], and awoke him, saying, Lord, save us: we perish.";
kjv[26] = "And he saith unto them, Why are ye fearful, O ye of little faith? Then he arose, and rebuked the winds and the sea; and there was a great calm.";
kjv[27] = "But the men marvelled, saying, What manner of man is this, that even the winds and the sea obey him!";
kjv[28] = "And when he was come to the other side into the country of the Gergesenes, there met him two possessed with devils, coming out of the tombs, exceeding fierce, so that no man might pass by that way.";
kjv[29] = "And, behold, they cried out, saying, What have we to do with thee, Jesus, thou Son of God? art thou come hither to torment us before the time?";
kjv[30] = "And there was a good way off from them an herd of many swine feeding.";
kjv[31] = "So the devils besought him, saying, If thou cast us out, suffer us to go away into the herd of swine.";
kjv[32] = "And he said unto them, Go. And when they were come out, they went into the herd of swine: and, behold, the whole herd of swine ran violently down a steep place into the sea, and perished in the waters.";
kjv[33] = "And they that kept them fled, and went their ways into the city, and told every thing, and what was befallen to the possessed of the devils.";

yng[20] = "and Jesus saith to him, `The foxes have holes, and the birds of the heaven places of rest, but the Son of Man hath not where he may lay the head.\'";
dby[20] = "And Jesus says to him, The foxes have holes, and the birds of the heaven roosting-places; but the Son of man has not where he may lay his head.";
web[20] = "And Jesus saith to him, The foxes have holes, and the birds of the air [have] nests; but the Son of man hath not where to lay [his] head.";
hnv[20] = "Yeshua said to him, &quot;The foxes have holes, and the birds of the sky have nests, but the Son of Man has nowhere to lay his head.&quot;";
vul[20] = "et dicit ei Iesus vulpes foveas habent et volucres caeli tabernacula Filius autem hominis non habet ubi caput reclinet";
rsv[21] = "Another of the disciples said to him, &quot;Lord, let me first go and bury my father.&quot;";
asv[21] = "And another of the disciples said unto him, Lord, suffer me first to go and bury my father.";
yng[21] = "And another of his disciples said to him, `Sir, permit me first to depart and to bury my father;\'";
dby[21] = "But another of his disciples said to him, Lord, suffer me first to go away and bury my father.";
web[21] = "And another of his disciples said to him, Lord, suffer me first to go and bury my father.";
hnv[21] = "Another of his talmidim said to him, &quot;Lord, allow me first to go and bury my father.&quot;";
vul[21] = "alius autem de discipulis eius ait illi Domine permitte me primum ire et sepelire patrem meum";
rsv[22] = "But Jesus said to him, &quot;Follow me, and leave the dead to bury their own dead.&quot;";
asv[22] = "But Jesus saith unto him, Follow me; and leave the dead to bury their own dead.";
yng[22] = "and Jesus said to him, `Follow me, and suffer the dead to bury their own dead.\'";
dby[22] = "But Jesus said to him, Follow me, and leave the dead to bury their own dead.";
web[22] = "But Jesus said to him, Follow me; and let the dead bury their dead.";
hnv[22] = "But Yeshua said to him, &quot;Follow me, and leave the dead to bury their own dead.&quot;";
vul[22] = "Iesus autem ait illi sequere me et dimitte mortuos sepelire mortuos suos";
rsv[23] = "And when he got into the boat, his disciples followed him.";
asv[23] = "And when he was entered into a boat, his disciples followed him.";
yng[23] = "And when he entered into the boat his disciples did follow him,";
dby[23] = "And he went on board ship and his disciples followed him;";
web[23] = "And when he had entered into a boat, his disciples followed him.";
hnv[23] = "When he got into a boat, his talmidim followed him.";
vul[23] = "et ascendente eo in navicula secuti sunt eum discipuli eius";
rsv[24] = "And behold, there arose a great storm on the sea, so that the boat was being swamped by the waves; but he was asleep.";
asv[24] = "And behold, there arose a great tempest in the sea, insomuch that the boat was covered with the waves: but he was asleep.";
yng[24] = "and lo, a great tempest arose in the sea, so that the boat was being covered by the waves, but he was sleeping,";
dby[24] = "and behold, [the water] became very agitated on the sea, so that the ship was covered by the waves; but *he* slept.";
web[24] = "And behold, there arose a great tempest in the sea, insomuch that the boat was covered with the waves: but he was asleep.";
hnv[24] = " Behold, a great tempest arose in the sea, so much that the boat was covered with the waves, but he was asleep.";
vul[24] = "et ecce motus magnus factus est in mari ita ut navicula operiretur fluctibus ipse vero dormiebat";
rsv[25] = "And they went and woke him, saying, &quot;Save, Lord; we are perishing.&quot;";
asv[25] = "And they came to him, and awoke him, saying, Save, Lord; we perish.";
yng[25] = "and his disciples having come to him, awoke him, saying, `Sir, save us; we are perishing.\'";
dby[25] = "And the disciples came and awoke him, saying, Lord save: we perish.";
web[25] = "And his disciples came to [him], and awoke him, saying, Lord, save us: we perish.";
hnv[25] = "They came to him, and woke him up, saying, &quot;Save us, Lord! We are dying!&quot;";
vul[25] = "et accesserunt et suscitaverunt eum dicentes Domine salva nos perimus";
rsv[26] = "And he said to them, &quot;Why are you afraid, O men of little faith?&quot; Then he rose and rebuked the winds and the sea; and there was a great calm.";
asv[26] = "And he saith unto them, Why are ye fearful, O ye of little faith? Then he arose, and rebuked the winds and the sea; and there was a great calm.";
yng[26] = "And he saith to them, `Why are ye fearful, O ye of little faith?\' Then having risen, he rebuked the winds and the sea, and there was a great calm;";
dby[26] = "And he says to them, Why are ye fearful, O ye of little faith? Then, having arisen, he rebuked the winds and the sea, and there was a great calm.";
web[26] = "And he saith to them, Why are ye fearful, O ye of little faith? Then he arose, and rebuked the winds and the sea; and there was a great calm.";
hnv[26] = "He said to them, &quot;Why are you fearful, oh you of little faith?&quot; Then he got up, rebuked the wind and the sea, and there was a great calm.";
vul[26] = "et dicit eis quid timidi estis modicae fidei tunc surgens imperavit ventis et mari et facta est tranquillitas magna";
rsv[27] = "And the men marveled, saying, &quot;What sort of man is this, that even winds and sea obey him?&quot;";
asv[27] = "And the men marvelled, saying, What manner of man is this, that even the winds and the sea obey him?";
yng[27] = "and the men wondered, saying, `What kind -- is this, that even the wind and the sea do obey him?\'";
dby[27] = "But the men were astonished, saying, What sort [of man] is this, that even the winds and the sea obey him?";
web[27] = "But the men marveled, saying, What manner of man is this, that even the winds and the sea obey him!";
hnv[27] = "The men marveled, saying, &quot;What kind of man is this, that even the wind and the sea obey him?&quot;";
vul[27] = "porro homines mirati sunt dicentes qualis est hic quia et venti et mare oboediunt ei";
rsv[28] = "And when he came to the other side, to the country of the Gadarenes, two demoniacs met him, coming out of the tombs, so fierce that no one could pass that way.";
asv[28] = "And when he was come to the other side into the country of the Gadarenes, there met him two possessed with demons, coming forth out of the tombs, exceeding fierce, so that no man could pass by that way.";
yng[28] = "And he having come to the other side, to the region of the Gergesenes, there met him two demoniacs, coming forth out of the tombs, very fierce, so that no one was able to pass over by that way,";
dby[28] = "And there met him, when he came to the other side, to the country of the Gergesenes, two possessed by demons, coming out of the tombs, exceeding dangerous, so that no one was able to pass by that way.";
web[28] = "And when he had come to the other side, into the country of the Gergesenes, there met him two possessed with demons, coming out of the tombs, exceeding fierce, so that no man might pass by that way.";
hnv[28] = "When he came to the other side, into the country of the Gadarenes, two people possessed by demons met him there, coming out of the tombs, exceedingly fierce, so that nobody could pass by that way.";
vul[28] = "et cum venisset trans fretum in regionem Gerasenorum occurrerunt ei duo habentes daemonia de monumentis exeuntes saevi nimis ita ut nemo posset transire per viam illam";
rsv[29] = "And behold, they cried out, &quot;What have you to do with us, O Son of God? Have you come here to torment us before the time?&quot;";
asv[29] = "And behold, they cried out, saying, What have we to do with thee, thou Son of God? art thou come hither to torment us before the time?";
yng[29] = "and lo, they cried out, saying, `What -- to us and to thee, Jesus, Son of God? didst thou come hither, before the time, to afflict us?\'";
dby[29] = "And behold, they cried out, saying, What have we to do with thee, Son of God? hast thou come here before the time to torment us?";
web[29] = "And behold, they cried out, saying, What have we [to do] with thee, Jesus, [thou] Son of God? art thou come hither to torment us before the time?";
hnv[29] = "Behold, they cried out, saying, &quot;What do we have to do with you, Yeshua, Son of God? Have you come here to torment us before the time?&quot;";
vul[29] = "et ecce clamaverunt dicentes quid nobis et tibi Fili Dei venisti huc ante tempus torquere nos";
rsv[30] = "Now a herd of many swine was feeding at some distance from them.";
asv[30] = "Now there was afar off from them a herd of many swine feeding.";
yng[30] = "And there was far off from them a herd of many swine feeding,";
dby[30] = "Now there was, a great way off from them, a herd of many swine feeding;";
web[30] = "And there was a good way off from them a herd of many swine, feeding.";
hnv[30] = "Now there was a herd of many pigs feeding far away from them.";
vul[30] = "erat autem non longe ab illis grex porcorum multorum pascens";
rsv[31] = "And the demons begged him, &quot;If you cast us out, send us away into the herd of swine.&quot;";
asv[31] = "And the demons besought him, saying, If thou cast us out, send us away into the herd of swine.";
yng[31] = "and the demons were calling on him, saying, `If thou dost cast us forth, permit us to go away to the herd of the swine;\'";
dby[31] = "and the demons besought him, saying, If thou cast us out, send us away into the herd of swine.";
web[31] = "So the demons besought him, saying, If thou expellest us, suffer us to go away into the herd of swine.";
hnv[31] = "The demons begged him, saying, &quot;If you cast us out, permit us to go away into the herd of pigs.&quot;";
vul[31] = "daemones autem rogabant eum dicentes si eicis nos mitte nos in gregem porcorum";
rsv[32] = "And he said to them, &quot;Go.&quot; So they came out and went into the swine; and behold, the whole herd rushed down the steep bank into the sea, and perished in the waters.";
asv[32] = "And he said unto them, Go. And they came out, and went into the swine: and behold, the whole herd rushed down the steep into the sea, and perished in the waters.";
yng[32] = "and he saith to them, `Go.\' And having come forth, they went to the herd of the swine, and lo, the whole herd of the swine rushed down the steep, to the sea, and died in the waters,";
dby[32] = "And he said to them, Go. And they, going out, departed into the herd of swine; and lo, the whole herd [of swine] rushed down the steep slope into the sea, and died in the waters.";
web[32] = "And he said to them, Go. And when they had come out, they went into the herd of swine: and behold, the whole herd of swine ran violently down a steep place into the sea, and perished in the waters.";
hnv[32] = "He said to them, &quot;Go!&quot; They came out, and went into the herd of pigs: and behold, the whole herd of pigs rushed down the cliff into the sea, and died in the water.";
vul[32] = "et ait illis ite at illi exeuntes abierunt in porcos et ecce impetu abiit totus grex per praeceps in mare et mortui sunt in aquis";
rsv[33] = "The herdsmen fled, and going into the city they told everything, and what had happened to the demoniacs.";
asv[33] = "And they that fed them fled, and went away into the city, and told everything, and what was befallen to them that were possessed with demons.";
yng[33] = "and those feeding did flee, and, having gone to the city, they declared all, and the matter of the demoniacs.";
dby[33] = "But they that fed them fled, and went away into the city and related everything, and what had happened as to those possessed by demons.";
web[33] = "And they that kept them, fled, and went into the city, and told every thing; and what had befallen to the possessed with demons.";
hnv[33] = "Those who fed them fled, and went away into the city, and told everything, including what happened to those who were possessed with demons.";
vul[33] = "pastores autem fugerunt et venientes in civitatem nuntiaverunt omnia et de his qui daemonia habuerant";
rsv[34] = "And behold, all the city came out to meet Jesus; and when they saw him, they begged him to leave their neighborhood.";
asv[34] = "And behold, all the city came out to meet Jesus: and when they saw him, they besought [him] that he would depart from their borders.";
yng[34] = "And lo, all the city came forth to meet Jesus, and having seen him, they called on [him] that he might depart from their borders.";
dby[34] = "And behold, the whole city went out to meet Jesus; and when they saw him, they begged [him] to go away out of their coasts.";
web[34] = "And behold, the whole city came out to meet Jesus: and when they saw him, they besought him that he would depart out of their borders.";
hnv[34] = "Behold, all the city came out to meet Yeshua. When they saw him, they begged that he would depart from their borders.";
vul[34] = "et ecce tota civitas exiit obviam Iesu et viso eo rogabant ut transiret a finibus eorum";
