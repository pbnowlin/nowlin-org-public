csb[1] = "When Jesus had finished saying all these things, he told his disciples,";
csb[2] = "&quot;You know that the Passover takes place after two days, and the Son of Man will be handed over to be crucified.&quot;";
csb[3] = "Then the chief priests and the elders of the people assembled in the courtyard of the high priest, who was named Caiaphas,";
csb[4] = "and they conspired to arrest Jesus in a treacherous way and kill him.";
csb[5] = "&quot;Not during the festival,&quot; they said, &quot;so there won\'t be rioting among the people.&quot;";
csb[6] = "While Jesus was in Bethany at the house of Simon the leper,";
csb[7] = "a woman approached him with an alabaster jar of very expensive perfume. She poured it on his head as he was reclining at the table.";
csb[8] = "When the disciples saw it, they were indignant. &quot;Why this waste? &quot; they asked.";
csb[9] = "&quot;This might have been sold for a great deal and given to the poor.&quot;";
csb[10] = "Aware of this, Jesus said to them, &quot;Why are you bothering this woman? She has done a noble thing for me.";
csb[11] = "&quot;You always have the poor with you, but you do not always have me.";
csb[12] = "&quot;By pouring this perfume on my body, she has prepared me for burial.";
csb[13] = "&quot;Truly I tell you, wherever this gospel is proclaimed in the whole world, what she has done will also be told in memory of her.&quot;";
csb[14] = "Then one of the Twelve, the man called Judas Iscariot, went to the chief priests";
csb[15] = "and said, &quot;What are you willing to give me if I hand him over to you? &quot; So they weighed out thirty pieces of silver for him.";
csb[16] = "And from that time he started looking for a good opportunity to betray him.";
csb[17] = "On the first day of Unleavened Bread the disciples came to Jesus and asked, &quot;Where do you want us to make preparations for you to eat the Passover? &quot;";
csb[18] = "&quot;Go into the city to a certain man,&quot; he said, &quot;and tell him, \'The Teacher says: My time is near; I am celebrating the Passover at your place with my disciples.\' &quot;";
csb[19] = "So the disciples did as Jesus had directed them and prepared the Passover.";
csb[20] = "When evening came, he was reclining at the table with the Twelve.";
csb[21] = "While they were eating, he said, &quot;Truly I tell you, one of you will betray me.&quot;";
csb[22] = "Deeply distressed, each one began to say to him, &quot;Surely not I, Lord? &quot;";
csb[23] = "He replied, &quot;The one who dipped his hand with me in the bowl -- he will betray me.";
csb[24] = "&quot;The Son of Man will go just as it is written about him, but woe to that man by whom the Son of Man is betrayed! It would have been better for him if he had not been born.&quot;";
csb[25] = "Judas, his betrayer, replied, &quot;Surely not I, Rabbi? &quot; &quot;You have said it,&quot; he told him.";
csb[26] = "As they were eating, Jesus took bread, blessed and broke it, gave it to the disciples, and said, &quot;Take and eat it; this is my body.&quot;";
csb[27] = "Then he took a cup, and after giving thanks, he gave it to them and said, &quot;Drink from it, all of you.";
csb[28] = "&quot;For this is my blood of the covenant, which is poured out for many for the forgiveness of sins.";
csb[29] = "&quot;But I tell you, I will not drink from this fruit of the vine from now on until that day when I drink it new with you in my Father\'s kingdom.&quot;";
csb[30] = "After singing a hymn, they went out to the Mount of Olives.";
csb[31] = "Then Jesus said to them, &quot;Tonight all of you will fall away because of me, for it is written: I will strike the shepherd, and the sheep of the flock will be scattered.";
csb[32] = "&quot;But after I have risen, I will go ahead of you to Galilee.&quot;";
csb[33] = "Peter told him, &quot;Even if everyone falls away because of you, I will never fall away.&quot;";
csb[34] = "&quot;Truly I tell you,&quot; Jesus said to him, &quot;tonight, before the rooster crows, you will deny me three times.&quot;";
csb[35] = "&quot;Even if I have to die with you,&quot; Peter told him, &quot;I will never deny you,&quot; and all the disciples said the same thing.";
csb[36] = "Then Jesus came with them to a place called Gethsemane, and he told the disciples, &quot;Sit here while I go over there and pray.&quot;";
csb[37] = "Taking along Peter and the two sons of Zebedee, he began to be sorrowful and troubled.";
csb[38] = "He said to them, &quot;I am deeply grieved to the point of death. Remain here and stay awake with me.&quot;";
csb[39] = "Going a little farther, he fell facedown and prayed, &quot;My Father, if it is possible, let this cup pass from me. Yet not as I will, but as you will.&quot;";
csb[40] = "Then he came to the disciples and found them sleeping. He asked Peter, &quot;So, couldn\'t you stay awake with me one hour?";
csb[41] = "&quot;Stay awake and pray, so that you won\'t enter into temptation. The spirit is willing, but the flesh is weak.&quot;";
csb[42] = "Again, a second time, he went away and prayed, &quot;My Father, if this cannot pass unless I drink it, your will be done.&quot;";
csb[43] = "And he came again and found them sleeping, because they could not keep their eyes open.";
csb[44] = "After leaving them, he went away again and prayed a third time, saying the same thing once more.";
csb[45] = "Then he came to the disciples and said to them, &quot;Are you still sleeping and resting? See, the time is near. The Son of Man is betrayed into the hands of sinners.";
csb[46] = "&quot;Get up; let\'s go. See, my betrayer is near.&quot;";
csb[47] = "While he was still speaking, Judas, one of the Twelve, suddenly arrived. A large mob with swords and clubs was with him from the chief priests and elders of the people.";
csb[48] = "His betrayer had given them a sign: &quot;The one I kiss, he\'s the one; arrest him.&quot;";
csb[49] = "So immediately he went up to Jesus and said, &quot;Greetings, Rabbi! &quot; and kissed him.";
csb[50] = "&quot;Friend,&quot; Jesus asked him, &quot;why have you come? &quot; Then they came up, took hold of Jesus, and arrested him.";
csb[51] = "At that moment one of those with Jesus reached out his hand and drew his sword. He struck the high priest\'s servant and cut off his ear.";
csb[52] = "Then Jesus told him, &quot;Put your sword back in its place because all who take up the sword will perish by the sword.";
csb[53] = "&quot;Or do you think that I cannot call on my Father, and he will provide me here and now with more than twelve legions of angels?";
csb[54] = "&quot;How, then, would the Scriptures be fulfilled that say it must happen this way? &quot;";
csb[55] = "At that time Jesus said to the crowds, &quot;Have you come out with swords and clubs, as if I were a criminal, to capture me? Every day I used to sit, teaching in the temple, and you didn\'t arrest me.";
csb[56] = "&quot;But all this has happened so that the writings of the prophets would be fulfilled.&quot; Then all the disciples deserted him and ran away.";
csb[57] = "Those who had arrested Jesus led him away to Caiaphas the high priest, where the scribes and the elders had convened.";
csb[58] = "Peter was following him at a distance right to the high priest\'s courtyard. He went in and was sitting with the servants to see the outcome.";
csb[59] = "The chief priests and the whole Sanhedrin were looking for false testimony against Jesus so that they could put him to death,";
csb[60] = "but they could not find any, even though many false witnesses came forward. Finally, two who came forward";
csb[61] = "stated, &quot;This man said, \'I can destroy the temple of God and rebuild it in three days.\' &quot;";
csb[62] = "The high priest stood up and said to him, &quot;Don\'t you have an answer to what these men are testifying against you? &quot;";
csb[63] = "But Jesus kept silent. The high priest said to him, &quot;I charge you under oath by the living God: Tell us if you are the Messiah, the Son of God.&quot;";
csb[64] = "&quot;You have said it,&quot; Jesus told him. &quot;But I tell you, in the future you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.&quot;";
csb[65] = "Then the high priest tore his robes and said, &quot;He has blasphemed! Why do we still need witnesses? See, now you\'ve heard the blasphemy.";
csb[66] = "&quot;What is your decision? &quot; They answered, &quot;He deserves death! &quot;";
csb[67] = "Then they spat in his face and beat him; others slapped him";
csb[68] = "and said, &quot;Prophesy to us, Messiah! Who was it that hit you? &quot;";
csb[69] = "Now Peter was sitting outside in the courtyard. A servant girl approached him and said, &quot;You were with Jesus the Galilean too.&quot;";
csb[70] = "But he denied it in front of everyone: &quot;I don\'t know what you\'re talking about.&quot;";
csb[71] = "When he had gone out to the gateway, another woman saw him and told those who were there, &quot;This man was with Jesus the Nazarene! &quot;";
csb[72] = "And again he denied it with an oath: &quot;I don\'t know the man! &quot;";
csb[73] = "After a little while those standing there approached and said to Peter, &quot;You really are one of them, since even your accent gives you away.&quot;";
csb[74] = "Then he started to curse and to swear with an oath, &quot;I don\'t know the man! &quot; Immediately a rooster crowed,";
csb[75] = "and Peter remembered the words Jesus had spoken, &quot;Before the rooster crows, you will deny me three times.&quot; And he went outside and wept bitterly.";
kjv[1] = "And it came to pass, when Jesus had finished all these sayings, he said unto his disciples,";

kjv[6] = "Now when Jesus was in Bethany, in the house of Simon the leper,";

kjv[11] = "For ye have the poor always with you; but me ye have not always.";

kjv[16] = "And from that time he sought opportunity to betray him.";
kjv[17] = "Now the first [day] of the [feast of] unleavened bread the disciples came to Jesus, saying unto him, Where wilt thou that we prepare for thee to eat the passover?";
kjv[18] = "And he said, Go into the city to such a man, and say unto him, The Master saith, My time is at hand; I will keep the passover at thy house with my disciples.";
kjv[19] = "And the disciples did as Jesus had appointed them; and they made ready the passover.";

kjv[25] = "Then Judas, which betrayed him, answered and said, Master, is it I? He said unto him, Thou hast said.";
kjv[26] = "And as they were eating, Jesus took bread, and blessed [it], and brake [it], and gave [it] to the disciples, and said, Take, eat; this is my body.";

kjv[30] = "And when they had sung an hymn, they went out into the mount of Olives.";
kjv[31] = "Then saith Jesus unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep of the flock shall be scattered abroad.";

kjv[33] = "Peter answered and said unto him, Though all [men] shall be offended because of thee, [yet] will I never be offended.";
kjv[34] = "Jesus said unto him, Verily I say unto thee, That this night, before the cock crow, thou shalt deny me thrice.";
kjv[35] = "Peter said unto him, Though I should die with thee, yet will I not deny thee. Likewise also said all the disciples.";
kjv[36] = "Then cometh Jesus with them unto a place called Gethsemane, and saith unto the disciples, Sit ye here, while I go and pray yonder.";
kjv[37] = "And he took with him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy.";

kjv[39] = "And he went a little further, and fell on his face, and prayed, saying, O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou [wilt].";
kjv[40] = "And he cometh unto the disciples, and findeth them asleep, and saith unto Peter, What, could ye not watch with me one hour?";
kjv[41] = "Watch and pray, that ye enter not into temptation: the spirit indeed [is] willing, but the flesh [is] weak.";
kjv[42] = "He went away again the second time, and prayed, saying, O my Father, if this cup may not pass away from me, except I drink it, thy will be done.";

kjv[44] = "And he left them, and went away again, and prayed the third time, saying the same words.";
kjv[45] = "Then cometh he to his disciples, and saith unto them, Sleep on now, and take [your] rest: behold, the hour is at hand, and the Son of man is betrayed into the hands of sinners.";
kjv[46] = "Rise, let us be going: behold, he is at hand that doth betray me.";
kjv[47] = "And while he yet spake, lo, Judas, one of the twelve, came, and with him a great multitude with swords and staves, from the chief priests and elders of the people.";

kjv[49] = "And forthwith he came to Jesus, and said, Hail, master; and kissed him.";
kjv[50] = "And Jesus said unto him, Friend, wherefore art thou come? Then came they, and laid hands on Jesus, and took him.";
kjv[51] = "And, behold, one of them which were with Jesus stretched out [his] hand, and drew his sword, and struck a servant of the high priest\'s, and smote off his ear.";
kjv[52] = "Then said Jesus unto him, Put up again thy sword into his place: for all they that take the sword shall perish with the sword.";
kjv[53] = "Thinkest thou that I cannot now pray to my Father, and he shall presently give me more than twelve legions of angels?";
kjv[54] = "But how then shall the scriptures be fulfilled, that thus it must be?";
kjv[55] = "In that same hour said Jesus to the multitudes, Are ye come out as against a thief with swords and staves for to take me? I sat daily with you teaching in the temple, and ye laid no hold on me.";

kjv[57] = "And they that had laid hold on Jesus led [him] away to Caiaphas the high priest, where the scribes and the elders were assembled.";
kjv[58] = "But Peter followed him afar off unto the high priest\'s palace, and went in, and sat with the servants, to see the end.";
kjv[59] = "Now the chief priests, and elders, and all the council, sought false witness against Jesus, to put him to death;";

kjv[64] = "Jesus saith unto him, Thou hast said: nevertheless I say unto you, Hereafter shall ye see the Son of man sitting on the right hand of power, and coming in the clouds of heaven.";
kjv[65] = "Then the high priest rent his clothes, saying, He hath spoken blasphemy; what further need have we of witnesses? behold, now ye have heard his blasphemy.";

kjv[68] = "Saying, Prophesy unto us, thou Christ, Who is he that smote thee?";
kjv[69] = "Now Peter sat without in the palace: and a damsel came unto him, saying, Thou also wast with Jesus of Galilee.";
kjv[70] = "But he denied before [them] all, saying, I know not what thou sayest.";

kjv[72] = "And again he denied with an oath, I do not know the man.";

kjv[75] = "And Peter remembered the word of Jesus, which said unto him, Before the cock crow, thou shalt deny me thrice. And he went out, and wept bitterly.";
