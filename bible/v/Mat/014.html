csb[1] = "At that time Herod the tetrarch heard the report about Jesus.";
csb[2] = "&quot;This is John the Baptist,&quot; he told his servants. &quot;He has been raised from the dead, and that\'s why miraculous powers are at work in him.&quot;";
csb[3] = "For Herod had arrested John, chained him, and put him in prison on account of Herodias, his brother Philip\'s wife,";
csb[4] = "since John had been telling him, &quot;It\'s not lawful for you to have her.&quot;";
csb[5] = "Though Herod wanted to kill John, he feared the crowd since they regarded John as a prophet.";
csb[6] = "When Herod\'s birthday celebration came, Herodias\'s daughter danced before them and pleased Herod.";
csb[7] = "So he promised with an oath to give her whatever she asked.";
csb[8] = "Prompted by her mother, she answered, &quot;Give me John the Baptist\'s head here on a platter.&quot;";
csb[9] = "Although the king regretted it, he commanded that it be granted because of his oaths and his guests.";
csb[10] = "So he sent orders and had John beheaded in the prison.";
csb[11] = "His head was brought on a platter and given to the girl, who carried it to her mother.";
csb[12] = "Then his disciples came, removed the corpse, buried it, and went and reported to Jesus.";
csb[13] = "When Jesus heard about it, he withdrew from there by boat to a remote place to be alone. When the crowds heard this, they followed him on foot from the towns.";
csb[14] = "When he went ashore, he saw a large crowd, had compassion on them, and healed their sick.";
csb[15] = "When evening came, the disciples approached him and said, &quot;This place is deserted, and it is already late. Send the crowds away so that they can go into the villages and buy food for themselves.&quot;";
csb[16] = "&quot;They don\'t need to go away,&quot; Jesus told them. &quot;You give them something to eat.&quot;";
csb[17] = "&quot;But we only have five loaves and two fish here,&quot; they said to him.";
csb[18] = "&quot;Bring them here to me,&quot; he said.";
csb[19] = "Then he commanded the crowds to sit down on the grass. He took the five loaves and the two fish, and looking up to heaven, he blessed them. He broke the loaves and gave them to the disciples, and the disciples gave them to the crowds.";
csb[20] = "Everyone ate and was satisfied. They picked up twelve baskets full of leftover pieces.";
csb[21] = "Now those who ate were about five thousand men, besides women and children.";
csb[22] = "Immediately he made the disciples get into the boat and go ahead of him to the other side, while he dismissed the crowds.";
csb[23] = "After dismissing the crowds, he went up on the mountain by himself to pray. Well into the night, he was there alone.";
csb[24] = "Meanwhile, the boat was already some distance from land, battered by the waves, because the wind was against them.";
csb[25] = "Jesus came toward them walking on the sea very early in the morning.";
csb[26] = "When the disciples saw him walking on the sea, they were terrified. &quot;It\'s a ghost! &quot; they said, and they cried out in fear.";
csb[27] = "Immediately Jesus spoke to them. &quot;Have courage! It is I. Don\'t be afraid.&quot;";
csb[28] = "&quot;Lord, if it\'s you,&quot; Peter answered him, &quot;command me to come to you on the water.&quot;";
csb[29] = "He said, &quot;Come.&quot; And climbing out of the boat, Peter started walking on the water and came toward Jesus.";
csb[30] = "But when he saw the strength of the wind, he was afraid, and beginning to sink he cried out, &quot;Lord, save me! &quot;";
csb[31] = "Immediately Jesus reached out his hand, caught hold of him, and said to him, &quot;You of little faith, why did you doubt? &quot;";
csb[32] = "When they got into the boat, the wind ceased.";
csb[33] = "Then those in the boat worshiped him and said, &quot;Truly you are the Son of God.&quot;";
csb[34] = "When they had crossed over, they came to shore at Gennesaret.";
csb[35] = "When the men of that place recognized him, they alerted the whole vicinity and brought to him all who were sick.";
csb[36] = "They begged him that they might only touch the end of his robe, and as many as touched it were healed.";
