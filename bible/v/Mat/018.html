csb[1] = "At that time the disciples came to Jesus and asked, &quot;So who is greatest in the kingdom of heaven? &quot;";
csb[2] = "He called a child and had him stand among them.";
csb[3] = "&quot;Truly I tell you,&quot; he said, &quot;unless you turn and become like children, you will never enter the kingdom of heaven.";
csb[4] = "&quot;Therefore, whoever humbles himself like this child -- this one is the greatest in the kingdom of heaven.";
csb[5] = "&quot;And whoever welcomes one child like this in my name welcomes me.";
csb[6] = "&quot;But whoever causes one of these little ones who believe in me to fall away -- it would be better for him if a heavy millstone were hung around his neck and he were drowned in the depths of the sea.";
csb[7] = "&quot;Woe to the world because of offenses. For offenses will inevitably come, but woe to that person by whom the offense comes.";
csb[8] = "&quot;If your hand or your foot causes you to fall away, cut it off and throw it away. It is better for you to enter life maimed or lame than to have two hands or two feet and be thrown into the eternal fire.";
csb[9] = "&quot;And if your eye causes you to fall away, gouge it out and throw it away. It is better for you to enter life with one eye than to have two eyes and be thrown into hellfire.";
csb[10] = "&quot;See to it that you don\'t despise one of these little ones, because I tell you that in heaven their angels continually view the face of my Father in heaven.";
csb[11] = " ";
csb[12] = "&quot;What do you think? If someone has a hundred sheep, and one of them goes astray, won\'t he leave the ninety-nine on the hillside and go and search for the stray?";
csb[13] = "&quot;And if he finds it, truly I tell you, he rejoices over that sheep more than over the ninety-nine that did not go astray.";
csb[14] = "&quot;In the same way, it is not the will of your Father in heaven that one of these little ones perish.";
csb[15] = "&quot;If your brother sins against you, go and rebuke him in private. If he listens to you, you have won your brother.";
csb[16] = "&quot;But if he won\'t listen, take one or two others with you, so that by the testimony of two or three witnesses every fact may be established.";
csb[17] = "&quot;If he doesn\'t pay attention to them, tell the church. If he doesn\'t pay attention even to the church, let him be like a Gentile and a tax collector to you.";
csb[18] = "&quot;Truly I tell you, whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.";
csb[19] = "&quot;Again, truly I tell you, if two of you on earth agree about any matter that you pray for, it will be done for you by my Father in heaven.";
csb[20] = "&quot;For where two or three are gathered together in my name, I am there among them.&quot;";
csb[21] = "Then Peter approached him and asked, &quot;Lord, how many times shall I forgive my brother or sister who sins against me? As many as seven times? &quot;";
csb[22] = "&quot;I tell you, not as many as seven,&quot; Jesus replied, &quot;but seventy times seven.";
csb[23] = "&quot;For this reason, the kingdom of heaven can be compared to a king who wanted to settle accounts with his servants.";
csb[24] = "&quot;When he began to settle accounts, one who owed ten thousand talents was brought before him.";
csb[25] = "&quot;Since he did not have the money to pay it back, his master commanded that he, his wife, his children, and everything he had be sold to pay the debt.";
csb[26] = "&quot;At this, the servant fell facedown before him and said, \'Be patient with me, and I will pay you everything.\'";
csb[27] = "&quot;Then the master of that servant had compassion, released him, and forgave him the loan.";
csb[28] = "&quot;That servant went out and found one of his fellow servants who owed him a hundred denarii. He grabbed him, started choking him, and said, \'Pay what you owe! \'";
csb[29] = "&quot;At this, his fellow servant fell down and began begging him, \'Be patient with me, and I will pay you back.\'";
csb[30] = "&quot;But he wasn\'t willing. Instead, he went and threw him into prison until he could pay what was owed.";
csb[31] = "&quot;When the other servants saw what had taken place, they were deeply distressed and went and reported to their master everything that had happened.";
csb[32] = "&quot;Then, after he had summoned him, his master said to him, \'You wicked servant! I forgave you all that debt because you begged me.";
csb[33] = "&quot;Shouldn\'t you also have had mercy on your fellow servant, as I had mercy on you? \'";
csb[34] = "&quot;And because he was angry, his master handed him over to the jailers to be tortured until he could pay everything that was owed.";
csb[35] = "&quot;So also my heavenly Father will do to you unless every one of you forgives his brother or sister from your heart.&quot;";
