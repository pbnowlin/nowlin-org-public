csb[1] = "An account of the genealogy of Jesus Christ, the Son of David, the Son of Abraham:";
csb[2] = "Abraham fathered Isaac, Isaac fathered Jacob, Jacob fathered Judah and his brothers,";
csb[3] = "Judah fathered Perez and Zerah by Tamar, Perez fathered Hezron, Hezron fathered Aram,";
csb[4] = "Aram fathered Amminadab, Amminadab fathered Nahshon, Nahshon fathered Salmon,";
csb[5] = "Salmon fathered Boaz by Rahab, Boaz fathered Obed by Ruth, Obed fathered Jesse,";
csb[6] = "and Jesse fathered King David. David fathered Solomon by Uriah\'s wife,";
csb[7] = "Solomon fathered Rehoboam, Rehoboam fathered Abijah, Abijah fathered Asa,";
csb[8] = "Asa fathered Jehoshaphat, Jehoshaphat fathered Joram, Joram fathered Uzziah,";
csb[9] = "Uzziah fathered Jotham, Jotham fathered Ahaz, Ahaz fathered Hezekiah,";
csb[10] = "Hezekiah fathered Manasseh, Manasseh fathered Amon, Amon fathered Josiah,";
csb[11] = "and Josiah fathered Jeconiah and his brothers at the time of the exile to Babylon.";
csb[12] = "After the exile to Babylon Jeconiah fathered Shealtiel, Shealtiel fathered Zerubbabel,";
csb[13] = "Zerubbabel fathered Abiud, Abiud fathered Eliakim, Eliakim fathered Azor,";
csb[14] = "Azor fathered Zadok, Zadok fathered Achim, Achim fathered Eliud,";
csb[15] = "Eliud fathered Eleazar, Eleazar fathered Matthan, Matthan fathered Jacob,";
csb[16] = "and Jacob fathered Joseph the husband of Mary, who gave birth to Jesus who is called the Christ.";
csb[17] = "So all the generations from Abraham to David were fourteen generations; and from David until the exile to Babylon, fourteen generations; and from the exile to Babylon until the Christ, fourteen generations.";
csb[18] = "The birth of Jesus Christ came about this way: After his mother Mary had been engaged to Joseph, it was discovered before they came together that she was pregnant from the Holy Spirit.";
csb[19] = "So her husband Joseph, being a righteous man, and not wanting to disgrace her publicly, decided to divorce her secretly.";
csb[20] = "But after he had considered these things, an angel of the Lord appeared to him in a dream, saying, &quot;Joseph, son of David, don\'t be afraid to take Mary as your wife, because what has been conceived in her is from the Holy Spirit.";
csb[21] = "&quot;She will give birth to a son, and you are to name him Jesus, because he will save his people from their sins.&quot;";
csb[22] = "Now all this took place to fulfill what was spoken by the Lord through the prophet:";
csb[23] = "See, the virgin will become pregnant and give birth to a son, and they will name him Immanuel, which is translated &quot;God is with us.&quot;";
csb[24] = "When Joseph woke up, he did as the Lord\'s angel had commanded him. He married her";
csb[25] = "but did not have sexual relations with her until she gave birth to a son. And he named him Jesus.";
