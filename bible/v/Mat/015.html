csb[21] = "When Jesus left there, he withdrew to the area of Tyre and Sidon.";

csb[28] = "Then Jesus replied to her, &quot;Woman, your faith is great. Let it be done for you as you want.&quot; And from that moment her daughter was healed.";

csb[31] = "So the crowd was amazed when they saw those unable to speak talking, the crippled restored, the lame walking, and the blind seeing, and they gave glory to the God of Israel.";

csb[36] = "he took the seven loaves and the fish, gave thanks, broke them, and gave them to the disciples, and the disciples gave them to the crowds.";

csb[38] = "Now there were four thousand men who had eaten, besides women and children.";
csb[39] = "After dismissing the crowds, he got into the boat and went to the region of Magadan.";
