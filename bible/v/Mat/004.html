csb[1] = "Then Jesus was led up by the Spirit into the wilderness to be tempted by the devil.";
csb[2] = "After he had fasted forty days and forty nights, he was hungry.";

csb[13] = "He left Nazareth and went to live in Capernaum by the sea, in the region of Zebulun and Naphtali.";
csb[14] = "This was to fulfill what was spoken through the prophet Isaiah:";
csb[15] = "Land of Zebulun and land of Naphtali, along the road by the sea, beyond the Jordan, Galilee of the Gentiles.";
csb[16] = "The people who live in darkness have seen a great light, and for those living in the land of the shadow of death, a light has dawned.";

csb[25] = "Large crowds followed him from Galilee, the Decapolis, Jerusalem, Judea, and beyond the Jordan.";
