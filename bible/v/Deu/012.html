csb[1] = "&quot;Be careful to follow these statutes and ordinances in the land that the LORD, the God of your fathers, has given you to possess all the days you live on the earth.";
csb[2] = "&quot;Destroy completely all the places where the nations that you are driving out worship their gods -- on the high mountains, on the hills, and under every green tree.";
csb[3] = "&quot;Tear down their altars, smash their sacred pillars, burn their Asherah poles, cut down the carved images of their gods, and wipe out their names from every place.";
csb[4] = "&quot;Don\'t worship the LORD your God this way.";
csb[5] = "&quot;Instead, turn to the place the LORD your God chooses from all your tribes to put his name for his dwelling and go there.";
csb[6] = "&quot;You are to bring there your burnt offerings and sacrifices, your tenths and personal contributions, your vow offerings and freewill offerings, and the firstborn of your herds and flocks.";
csb[7] = "&quot;You will eat there in the presence of the LORD your God and rejoice with your household in everything you do, because the LORD your God has blessed you.";
csb[8] = "&quot;You are not to do as we are doing here today; everyone is doing whatever seems right in his own sight.";
csb[9] = "&quot;Indeed, you have not yet come into the resting place and the inheritance the LORD your God is giving you.";
csb[10] = "&quot;When you cross the Jordan and live in the land the LORD your God is giving you to inherit, and he gives you rest from all the enemies around you and you live in security,";
csb[11] = "&quot;then the LORD your God will choose the place to have his name dwell. Bring there everything I command you: your burnt offerings, sacrifices, offerings of the tenth, personal contributions, and all your choice offerings you vow to the LORD.";
csb[12] = "&quot;You will rejoice before the LORD your God -- you, your sons and daughters, your male and female slaves, and the Levite who is within your city gates, since he has no portion or inheritance among you.";
csb[13] = "&quot;Be careful not to offer your burnt offerings in all the sacred places you see.";
csb[14] = "&quot;You must offer your burnt offerings only in the place the LORD chooses in one of your tribes, and there you must do everything I command you.";
csb[15] = "&quot;But whenever you want, you may slaughter and eat meat within any of your city gates, according to the blessing the LORD your God has given you. Those who are clean or unclean may eat it, as they would a gazelle or deer,";
csb[16] = "&quot;but you must not eat the blood; pour it on the ground like water.";
csb[17] = "&quot;Within your city gates you may not eat the tenth of your grain, new wine, or fresh oil; the firstborn of your herd or flock; any of your vow offerings that you pledge; your freewill offerings; or your personal contributions.";
csb[18] = "&quot;You are to eat them in the presence of the LORD your God at the place the LORD your God chooses -- you, your son and daughter, your male and female slave, and the Levite who is within your city gates. Rejoice before the LORD your God in everything you do,";
csb[19] = "&quot;and be careful not to neglect the Levite, as long as you live in your land.";
csb[20] = "&quot;When the LORD your God enlarges your territory as he has promised you, and you say, \'I want to eat meat\' because you have a strong desire to eat meat, you may eat it whenever you want.";
csb[21] = "&quot;If the place where the LORD your God chooses to put his name is too far from you, you may slaughter any of your herd or flock he has given you, as I have commanded you, and you may eat it within your city gates whenever you want.";
csb[22] = "&quot;Indeed, you may eat it as the gazelle and deer are eaten; both the clean and the unclean may eat it.";
csb[23] = "&quot;But don\'t eat the blood, since the blood is the life, and you must not eat the life with the meat.";
csb[24] = "&quot;Do not eat blood; pour it on the ground like water.";
csb[25] = "&quot;Do not eat it, so that you and your children after you will prosper, because you will be doing what is right in the LORD\'s sight.";
csb[26] = "&quot;But you are to take the holy offerings you have and your vow offerings and go to the place the LORD chooses.";
csb[27] = "&quot;Present the meat and blood of your burnt offerings on the altar of the LORD your God. The blood of your other sacrifices is to be poured out beside the altar of the LORD your God, but you may eat the meat.";
csb[28] = "&quot;Be careful to obey all these things I command you, so that you and your children after you may prosper forever, because you will be doing what is good and right in the sight of the LORD your God.";
csb[29] = "&quot;When the LORD your God annihilates the nations before you, which you are entering to take possession of, and you drive them out and live in their land,";
csb[30] = "&quot;be careful not to be ensnared by their ways after they have been destroyed before you. Do not inquire about their gods, asking, \'How did these nations worship their gods? I\'ll also do the same.\'";
csb[31] = "&quot;You must not do the same to the LORD your God, because they practice every detestable act, which the LORD hates, for their gods. They even burn their sons and daughters in the fire to their gods.";
csb[32] = "&quot;Be careful to do everything I command you; do not add anything to it or take anything away from it.";

kjv[17] = "Thou mayest not eat within thy gates the tithe of thy corn, or of thy wine, or of thy oil, or the firstlings of thy herds or of thy flock, nor any of thy vows which thou vowest, nor thy freewill offerings, or heave offering of thine hand:";
rsv[17] = "You may not eat within your towns the tithe of your grain or of your wine or of your oil, or the firstlings of your herd or of your flock, or any of your votive offerings which you vow, or your freewill offerings, or the offering that you present;";
asv[17] = "Thou mayest not eat within thy gates the tithe of thy grain, or of thy new wine, or of thine oil, or the firstlings of thy herd or of thy flock, nor any of thy vows which thou vowest, nor thy freewill-offerings, nor the heave-offering of thy hand;";
yng[17] = "thou art not able to eat within thy gates the tithe of thy corn, and of thy new wine, and thine oil, and the firstlings of thy herd and of thy flock, and any of thy vows which thou vowest, and thy free-will offerings, and heave-offering of thy hand;";
dby[17] = "Thou mayest not eat within thy gates the tithe of thy corn, or of thy new wine, or of thine oil, or the firstlings of thy kine or of thy sheep, nor any of thy vows which thou vowest, nor thy voluntary-offerings, nor the heave-offering of thy hand;";
web[17] = "Thou mayest not eat within thy gates the tithe of thy corn, or of thy wine, or of thy oil, or the firstlings of thy herds or of thy flock, nor any of thy vows which thou vowest, nor thy free-will-offerings, or heave-offering of thy hand:";
hnv[17] = "You may not eat within your gates the tithe of your grain, or of your new wine, or of your oil, or the firstborn of your herd or of your flock, nor any of your vows which you vow, nor your freewill-offerings, nor the heave-offering of your hand;";
vul[17] = "non poteris comedere in oppidis tuis decimam frumenti et vini et olei tui primogenita armentorum et pecorum et omnia quae voveris et sponte offerre volueris et primitias manuum tuarum";
kjv[18] = "But thou must eat them before the LORD thy God in the place which the LORD thy God shall choose, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that [is] within thy gates: and thou shalt rejoice before the LORD thy God in all that thou puttest thine hands unto.";
rsv[18] = "but you shall eat them before the LORD your God in the place which the LORD your God will choose, you and your son and your daughter, your manservant and your maidservant, and the Levite who is within your towns; and you shall rejoice before the LORD your God in all that you undertake.";
asv[18] = "but thou shalt eat them before Jehovah thy God in the place which Jehovah thy God shall choose, thou, and thy son, and thy daughter, and thy man-servant, and thy maid-servant, and the Levite that is within thy gates: and thou shalt rejoice before Jehovah thy God in all that thou puttest thy hand unto.";
yng[18] = "but before Jehovah thy God thou dost eat it, in the place which Jehovah thy God doth fix on, thou, and thy son, and thy daughter, and thy man-servant, and thy handmaid, and the Levite who [is] within thy gates, and thou hast rejoiced before Jehovah thy God in every putting forth of thy hand;";
dby[18] = "but before Jehovah thy God shalt thou eat them in the place which Jehovah thy God will choose, thou and thy son, and thy daughter, and thy bondman, and thy handmaid, and the Levite that is within thy gates; and thou shalt rejoice before Jehovah thy God in all the business of thy hand.";
web[18] = "But thou must eat them before the LORD thy God in the place which the LORD thy God shall choose, thou, and thy son, and thy daughter, and thy man-servant, and thy maid-servant, and the Levite that [is] within thy gates: and thou shalt rejoice before the LORD thy God in all that thou puttest thine hands to.";
hnv[18] = "but you shall eat them before the LORD your God in the place which the LORD your God shall choose, you, and your son, and your daughter, and your man-servant, and your maid-servant, and the Levite who is within your gates: and you shall rejoice before the LORD your God in all that you put your hand to.";
vul[18] = "sed coram Domino Deo tuo comedes ea in loco quem elegerit Dominus Deus tuus tu et filius tuus ac filia servus et famula atque Levites qui manet in urbibus tuis et laetaberis et reficieris coram Domino Deo tuo in cunctis ad quae extenderis manum tuam";
kjv[19] = "Take heed to thyself that thou forsake not the Levite as long as thou livest upon the earth.";
rsv[19] = "Take heed that you do not forsake the Levite as long as you live in your land.";
asv[19] = "Take heed to thyself that thou forsake not the Levite as long as thou livest in thy land.";
yng[19] = "take heed to thee lest thou forsake the Levite all thy days on thy ground.";
dby[19] = "Take heed to thyself that thou forsake not the Levite all the days thou shalt be in thy land.";
web[19] = "Take heed to thyself that thou forsake not the Levite as long as thou livest upon the earth.";
hnv[19] = "Take heed to yourself that you don\'t forsake the Levite as long as you live in your land.";
vul[19] = "cave ne derelinquas Leviten omni tempore quo versaris in terra";
kjv[20] = "When the LORD thy God shall enlarge thy border, as he hath promised thee, and thou shalt say, I will eat flesh, because thy soul longeth to eat flesh; thou mayest eat flesh, whatsoever thy soul lusteth after.";
rsv[20] = "&quot;When the LORD your God enlarges your territory, as he has promised you, and you say, \'I will eat flesh,\' because you crave flesh, you may eat as much flesh as you desire.";
asv[20] = "When Jehovah thy God shall enlarge thy border, as he hath promised thee, and thou shalt say, I will eat flesh, because thy soul desireth to eat flesh; thou mayest eat flesh, after all the desire of thy soul.";
yng[20] = "`When Jehovah thy God doth enlarge thy border, as He hath spoken to thee, and thou hast said, Let me eat flesh -- for thy soul desireth to eat flesh -- of all the desire of thy soul thou dost eat flesh.";
dby[20] = "When Jehovah thy God shall enlarge thy border, as he promised thee, and thou say, I will eat flesh, because thy soul longeth to eat flesh, thou mayest eat flesh, according to all the desire of thy soul.";
web[20] = "When the LORD thy God shall enlarge thy border, as he hath promised thee, and thou shalt say, I will eat flesh, because thy soul longeth to eat flesh; thou mayest eat flesh, whatever thy soul desireth.";
hnv[20] = "When the LORD your God shall enlarge your border, as he has promised you, and you shall say, I will eat flesh, because your soul desires to eat flesh; you may eat flesh, after all the desire of your soul.";
vul[20] = "quando dilataverit Dominus Deus tuus terminos tuos sicut locutus est tibi et volueris vesci carnibus quas desiderat anima tua";
kjv[21] = "If the place which the LORD thy God hath chosen to put his name there be too far from thee, then thou shalt kill of thy herd and of thy flock, which the LORD hath given thee, as I have commanded thee, and thou shalt eat in thy gates whatsoever thy soul lusteth after.";
rsv[21] = "If the place which the LORD your God will choose to put his name there is too far from you, then you may kill any of your herd or your flock, which the LORD has given you, as I have commanded you; and you may eat within your towns as much as you desire.";
asv[21] = "If the place which Jehovah thy God shall choose, to put his name there, be too far from thee, then thou shalt kill of thy herd and of thy flock, which Jehovah hath given thee, as I have commanded thee; and thou mayest eat within thy gates, after all the desire of thy soul.";
yng[21] = "`When the place is far from thee which Jehovah thy God doth choose to put His name there, then thou hast sacrificed of thy herd and of thy flock which Jehovah hath given to thee, as I have commanded thee, and hast eaten within thy gates, of all the desire of thy soul;";
dby[21] = "If the place which Jehovah thy God will choose to set his name there be too far from thee, then thou shalt slay of thy kine and of thy sheep which Jehovah hath given thee, as I have commanded thee, and thou shalt eat in thy gates according to all the desire of thy soul.";
web[21] = "If the place which the LORD thy God hath chosen to put his name there, shall be too far from thee, then thou shalt kill of thy herd and of thy flock, which the LORD hath given thee, as I have commanded thee, and thou shalt eat in thy gates whatever thy soul desireth.";
hnv[21] = "If the place which the LORD your God shall choose, to put his name there, be too far from you, then you shall kill of your herd and of your flock, which the LORD has given you, as I have commanded you; and you may eat within your gates, after all the desire of your soul.";
vul[21] = "locus autem quem elegerit Dominus Deus tuus ut sit nomen eius ibi si procul fuerit occides de armentis et pecoribus quae habueris sicut praecepi tibi et comedes in oppidis tuis ut tibi placet";
kjv[22] = "Even as the roebuck and the hart is eaten, so thou shalt eat them: the unclean and the clean shall eat [of] them alike.";
rsv[22] = "Just as the gazelle or the hart is eaten, so you may eat of it; the unclean and the clean alike may eat of it.";
asv[22] = "Even as the gazelle and as the hart is eaten, so thou shalt eat thereof: the unclean and the clean may eat thereof alike.";
yng[22] = "only, as the roe and the hart is eaten, so dost thou eat it; the unclean and the clean doth alike eat it.";
dby[22] = "Even as the gazelle and the hart is eaten, so thou shalt eat them: the unclean and the clean alike may eat of them.";
web[22] = "Even as the roebuck and the hart is eaten, so thou shalt eat them: the unclean and the clean shall eat [of] them alike.";
hnv[22] = "Even as the gazelle and as the hart is eaten, so you shall eat of it: the unclean and the clean may eat of it alike.";
vul[22] = "sicut comeditur caprea et cervus ita vesceris eis et mundus et inmundus in commune vescentur";
kjv[23] = "Only be sure that thou eat not the blood: for the blood [is] the life; and thou mayest not eat the life with the flesh.";
rsv[23] = "Only be sure that you do not eat the blood; for the blood is the life, and you shall not eat the life with the flesh.";
asv[23] = "Only be sure that thou eat not the blood: for the blood is the life; and thou shalt not eat the life with the flesh.";
yng[23] = "`Only, be sure not to eat the blood, for the blood [is] the life, and thou dost not eat the life with the flesh;";
dby[23] = "Only, be sure that thou eat not the blood; for the blood is the life, and thou mayest not eat the life with the flesh;";
web[23] = "Only be sure that thou eat not the blood: for the blood [is] the life; and thou mayest not eat the life with the flesh.";
hnv[23] = " Only be sure that you don\'t eat the blood: for the blood is the life; and you shall not eat the life with the flesh.";
vul[23] = "hoc solum cave ne sanguinem comedas sanguis enim eorum pro anima est et idcirco non debes animam comedere cum carnibus";
kjv[24] = "Thou shalt not eat it; thou shalt pour it upon the earth as water.";
rsv[24] = "You shall not eat it; you shall pour it out upon the earth like water.";
asv[24] = "Thou shalt not eat it; thou shalt pour it out upon the earth as water.";
yng[24] = "thou dost not eat it, on the earth thou dost pour it as water;";
dby[24] = "thou shalt not eat it; thou shalt pour it upon the earth as water:";
web[24] = "Thou shalt not eat it: thou shalt pour it upon the earth as water.";
hnv[24] = "You shall not eat it; you shall pour it out on the eretz as water.";
vul[24] = "sed super terram fundes quasi aquam";
kjv[25] = "Thou shalt not eat it; that it may go well with thee, and with thy children after thee, when thou shalt do [that which is] right in the sight of the LORD.";
rsv[25] = "You shall not eat it; that all may go well with you and with your children after you, when you do what is right in the sight of the LORD.";
asv[25] = "Thou shalt not eat it; that it may go well with thee, and with thy children after thee, when thou shalt do that which is right in the eyes of Jehovah.";
yng[25] = "thou dost not eat it, in order that it may be well with thee, and with thy sons after thee, when thou dost that which [is] right in the eyes of Jehovah.";
dby[25] = "thou shalt not eat it; that it may go well with thee, and with thy children after thee, when thou shalt do what is right in the eyes of Jehovah.";
web[25] = "Thou shalt not eat it; that it may be well with thee, and with thy children after thee, when thou shalt do [that which is] right in the sight of the LORD.";
hnv[25] = "You shall not eat it; that it may go well with you, and with your children after you, when you shall do that which is right in the eyes of the LORD.";
vul[25] = "ut sit tibi bene et filiis tuis post te cum feceris quod placet in conspectu Domini";
kjv[26] = "Only thy holy things which thou hast, and thy vows, thou shalt take, and go unto the place which the LORD shall choose:";
rsv[26] = "But the holy things which are due from you, and your votive offerings, you shall take, and you shall go to the place which the LORD will choose,";
asv[26] = "Only thy holy things which thou hast, and thy vows, thou shalt take, and go unto the place which Jehovah shall choose;";
yng[26] = "`Only, thy holy things which thou hast, and thy vows, thou dost take up, and hast gone in unto the place which Jehovah doth choose,";
dby[26] = "But thy hallowed things which thou hast, and what thou hast vowed, thou shalt take, and come to the place which Jehovah will choose;";
web[26] = "Only thy holy things which thou hast, and thy vows, thou shalt take, and go to the place which the LORD shall choose:";
hnv[26] = "Only your holy things which you have, and your vows, you shall take, and go to the place which the LORD shall choose:";
vul[26] = "quae autem sanctificaveris et voveris Domino tolles et venies ad locum quem elegerit Dominus";
kjv[27] = "And thou shalt offer thy burnt offerings, the flesh and the blood, upon the altar of the LORD thy God: and the blood of thy sacrifices shall be poured out upon the altar of the LORD thy God, and thou shalt eat the flesh.";
rsv[27] = "and offer your burnt offerings, the flesh and the blood, on the altar of the LORD your God; the blood of your sacrifices shall be poured out on the altar of the LORD your God, but the flesh you may eat.";
asv[27] = "and thou shalt offer thy burnt-offerings, the flesh and the blood, upon the altar of Jehovah thy God; and the blood of thy sacrifices shall be poured out upon the altar of Jehovah thy God; and thou shalt eat the flesh.";
yng[27] = "and thou hast made thy burnt-offerings -- the flesh and the blood -- on the altar of Jehovah thy God; and the blood of thy sacrifices is poured out by the altar of Jehovah thy God, and the flesh thou dost eat.";
dby[27] = "and thou shalt offer thy burnt-offerings, the flesh and the blood, upon the altar of Jehovah thy God; and the blood of thy sacrifices shall be poured out upon the altar of Jehovah thy God, and the flesh shalt thou eat.";
web[27] = "And thou shalt offer thy burnt-offerings, the flesh and the blood, upon the altar of the LORD thy God: and the blood of thy sacrifices shall be poured out upon the altar of the LORD thy God, and thou shalt eat the flesh.";
hnv[27] = "and you shall offer your burnt offerings, the flesh and the blood, on the altar of the LORD your God; and the blood of your sacrifices shall be poured out on the altar of the LORD your God; and you shall eat the flesh.";
vul[27] = "et offeres oblationes tuas carnem et sanguinem super altare Domini Dei tui sanguinem hostiarum fundes in altari carnibus autem ipse vesceris";
kjv[28] = "Observe and hear all these words which I command thee, that it may go well with thee, and with thy children after thee for ever, when thou doest [that which is] good and right in the sight of the LORD thy God.";
rsv[28] = "Be careful to heed all these words which I command you, that it may go well with you and with your children after you for ever, when you do what is good and right in the sight of the LORD your God.";
asv[28] = "Observe and hear all these words which I command thee, that it may go well with thee, and with thy children after thee for ever, when thou doest that which is good and right in the eyes of Jehovah thy God.";
yng[28] = "Observe, and thou hast obeyed all these words which I am commanding thee, in order that it may be well with thee and with thy sons after thee -- to the age, when thou dost that which [is] good and right in the eyes of Jehovah thy God.";
dby[28] = "Take heed to hear all these words which I command thee, that it may be well with thee, and with thy children after thee for ever, when thou doest what is good and right in the eyes of Jehovah thy God.";
web[28] = "Observe and hear all these words which I command thee, that it may be well with thee, and with thy children after thee for ever, when thou doest [that which is] good and right in the sight of the LORD thy God.";
hnv[28] = "Observe and hear all these words which I command you, that it may go well with you, and with your children after you forever, when you do that which is good and right in the eyes of the LORD your God.";
vul[28] = "observa et audi omnia quae ego praecipio tibi ut bene sit tibi et filiis tuis post te in sempiternum cum feceris quod bonum est et placitum in conspectu Domini Dei tui";
kjv[29] = "When the LORD thy God shall cut off the nations from before thee, whither thou goest to possess them, and thou succeedest them, and dwellest in their land;";
rsv[29] = "&quot;When the LORD your God cuts off before you the nations whom you go in to dispossess, and you dispossess them and dwell in their land,";
asv[29] = "When Jehovah thy God shall cut off the nations from before thee, whither thou goest in to dispossess them, and thou dispossessest them, and dwellest in their land;";
yng[29] = "`When Jehovah thy God doth cut off the nations -- whither thou art going in to possess them -- from thy presence, and thou hast possessed them, and hast dwelt in their land --";
dby[29] = "When Jehovah thy God cutteth off from before thee the nations whither thou goest, to take possession of them, and thou hast dispossessed them, and dwellest in their land,";
web[29] = "When the LORD thy God shall cut off the nations from before thee, whither thou goest to possess them, and thou succeedest them, and dwellest in their land;";
hnv[29] = "When the LORD your God shall cut off the nations from before you, where you go in to dispossess them, and you dispossess them, and dwell in their land;";
vul[29] = "quando disperderit Dominus Deus tuus ante faciem tuam gentes ad quas ingredieris possidendas et possederis eas atque habitaveris in terra earum";
kjv[30] = "Take heed to thyself that thou be not snared by following them, after that they be destroyed from before thee; and that thou enquire not after their gods, saying, How did these nations serve their gods? even so will I do likewise.";
rsv[30] = "take heed that you be not ensnared to follow them, after they have been destroyed before you, and that you do not inquire about their gods, saying, \'How did these nations serve their gods?--that I also may do likewise.\'";
asv[30] = "take heed to thyself that thou be not ensnared to follow them, after that they are destroyed from before thee; and that thou inquire not after their gods, saying, How do these nations serve their gods? even so will I do likewise.";
yng[30] = "take heed to thee, lest thou be snared after them, after their being destroyed out of thy presence, and lest thou enquire about their gods, saying, How do these nations serve their gods, and I do so -- even I?";
dby[30] = "take heed to thyself that thou be not ensnared [to follow] after them, after that they are destroyed from before thee; and that thou inquire not after their gods, saying, How did these nations serve their gods? even so will I do likewise.";
web[30] = "Take heed to thyself that thou be not snared by following them, after that they are destroyed from before thee; and that thou inquire not after their gods, saying, How did these nations serve their gods? even so will I do likewise.";
hnv[30] = "take heed to yourself that you not be ensnared to follow them, after that they are destroyed from before you; and that you not inquire after their gods, saying, How do these nations serve their gods? even so will I do likewise.";
vul[30] = "cave ne imiteris eas postquam te fuerint introeunte subversae et requiras caerimonias earum dicens sicut coluerunt gentes istae deos suos ita et ego colam";
kjv[31] = "Thou shalt not do so unto the LORD thy God: for every abomination to the LORD, which he hateth, have they done unto their gods; for even their sons and their daughters they have burnt in the fire to their gods.";
rsv[31] = "You shall not do so to the LORD your God; for every abominable thing which the LORD hates they have done for their gods; for they even burn their sons and their daughters in the fire to their gods.";
asv[31] = "Thou shalt not do so unto Jehovah thy God: for every abomination to Jehovah, which he hateth, have they done unto their gods; for even their sons and their daughters do they burn in the fire to their gods.";
yng[31] = "`Thou dost not do so to Jehovah thy God; for every abomination of Jehovah which He is hating they have done to their gods, for even their sons and their daughters they burn with fire to their gods.";
dby[31] = "Thou shalt not do so to Jehovah thy God; for every [thing that is] abomination to Jehovah, which he hateth, have they done unto their gods; for even their sons and their daughters have they burned in the fire to their gods.";
web[31] = "Thou shalt not do so to the LORD thy God; for every abomination to the LORD which he hateth have they done to their gods; for even their sons and their daughters they have burnt in the fire to their gods.";
hnv[31] = "You shall not do so to the LORD your God: for every abomination to the LORD, which he hates, have they done to their gods; for even their sons and their daughters do they burn in the fire to their gods.";
vul[31] = "non facies similiter Domino Deo tuo omnes enim abominationes quas aversatur Dominus fecerunt diis suis offerentes filios et filias et conburentes igne";
kjv[32] = "What thing soever I command you, observe to do it: thou shalt not add thereto, nor diminish from it.";
rsv[32] = "&quot;Everything that I command you you shall be careful to do; you shall not add to it or take from it.";
asv[32] = "What thing soever I command you, that shall ye observe to do: thou shalt not add thereto, nor diminish from it.";
yng[32] = "The whole thing which I am commanding you -- it ye observe to do; thou dost not add unto it, nor diminish from it.";
dby[32] = "Everything that I command you, ye shall take heed to do it; thou shalt not add thereto, nor take from it.";
web[32] = "Whatever thing I command you, observe to do it: thou shalt not add to it, nor diminish from it.";
hnv[32] = "Whatever thing I command you, that shall you observe to do: you shall not add thereto, nor diminish from it.";
vul[32] = "quod praecipio tibi hoc tantum facito Domino nec addas quicquam nec minuas";
