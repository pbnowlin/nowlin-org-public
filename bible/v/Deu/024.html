csb[1] = "&quot;If a man marries a woman, but she becomes displeasing to him because he finds something indecent about her, he may write her a divorce certificate, hand it to her, and send her away from his house.";
csb[2] = "&quot;If after leaving his house she goes and becomes another man\'s wife,";
csb[3] = "&quot;and the second man hates her, writes her a divorce certificate, hands it to her, and sends her away from his house or if he dies,";
csb[4] = "&quot;the first husband who sent her away may not marry her again after she has been defiled, because that would be detestable to the LORD. You must not bring guilt on the land the LORD your God is giving you as an inheritance.";
csb[5] = "&quot;When a man takes a bride, he must not go out with the army or be liable for any duty. He is free to stay at home for one year, so that he can bring joy to the wife he has married.";
csb[6] = "&quot;Do not take a pair of grindstones or even the upper millstone as security for a debt, because that is like taking a life as security.";
csb[7] = "&quot;If a man is discovered kidnapping one of his Israelite brothers, whether he treats him as a slave or sells him, the kidnapper must die. You must purge the evil from you.";
csb[8] = "&quot;Be careful with a person who has a case of serious skin disease, following carefully everything the Levitical priests instruct you to do. Be careful to do as I have commanded them.";
csb[9] = "&quot;Remember what the LORD your God did to Miriam on the journey after you left Egypt.";
csb[10] = "&quot;When you make a loan of any kind to your neighbor, do not enter his house to collect what he offers as security.";
csb[11] = "&quot;Stand outside while the man you are making the loan to brings the security out to you.";
csb[12] = "&quot;If he is a poor man, do not sleep with the garment he has given as security.";
csb[13] = "&quot;Be sure to return it to him at sunset. Then he will sleep in it and bless you, and this will be counted as righteousness to you before the LORD your God.";
csb[14] = "&quot;Do not oppress a hired worker who is poor and needy, whether one of your Israelite brothers or one of the resident aliens in a town in your land.";
csb[15] = "&quot;You are to pay him his wages each day before the sun sets, because he is poor and depends on them. Otherwise he will cry out to the LORD against you, and you will be held guilty.";
csb[16] = "&quot;Fathers are not to be put to death for their children, and children are not to be put to death for their fathers; each person will be put to death for his own sin.";
csb[17] = "&quot;Do not deny justice to a resident alien or fatherless child, and do not take a widow\'s garment as security.";
csb[18] = "&quot;Remember that you were a slave in Egypt, and the LORD your God redeemed you from there. Therefore I am commanding you to do this.";
csb[19] = "&quot;When you reap the harvest in your field, and you forget a sheaf in the field, do not go back to get it. It is to be left for the resident alien, the fatherless, and the widow, so that the LORD your God may bless you in all the work of your hands.";
csb[20] = "&quot;When you knock down the fruit from your olive tree, do not go over the branches again. What remains will be for the resident alien, the fatherless, and the widow.";
csb[21] = "&quot;When you gather the grapes of your vineyard, do not glean what is left. What remains will be for the resident alien, the fatherless, and the widow.";
csb[22] = "&quot;Remember that you were a slave in the land of Egypt. Therefore I am commanding you to do this.";
kjv[1] = "When a man hath taken a wife, and married her, and it come to pass that she find no favour in his eyes, because he hath found some uncleanness in her: then let him write her a bill of divorcement, and give [it] in her hand, and send her out of his house.";
rsv[1] = "&quot;When a man takes a wife and marries her, if then she finds no favor in his eyes because he has found some indecency in her, and he writes her a bill of divorce and puts it in her hand and sends her out of his house, and she departs out of his house,";
asv[1] = "When a man taketh a wife, and marrieth her, then it shall be, if she find no favor in his eyes, because he hath found some unseemly thing in her, that he shall write her a bill of divorcement, and give it in her hand, and send her out of his house.";
yng[1] = "`When a man doth take a wife, and hath married her, and it hath been, if she doth not find grace in his eyes (for he hath found in her nakedness of anything), and he hath written for her a writing of divorce, and given [it] into her hand, and sent her out of his house,";
dby[1] = "When a man taketh a wife, and marrieth her, it shall be if she find no favour in his eyes, because he hath found some unseemly thing in her, that he shall write her a letter of divorce, and give it into her hand, and send her out of his house.";
web[1] = "When a man hath taken a wife, and married her, and it shall come to pass that she findeth no favor in his eyes, because he hath found some uncleanness in her: then let him write her a bill of divorcement, and give [it] in her hand, and send her out of his house.";
hnv[1] = "When a man takes a wife, and marries her, then it shall be, if she find no favor in his eyes, because he has found some unseemly thing in her, that he shall write her a bill of divorce, and give it in her hand, and send her out of his house.";
vul[1] = "si acceperit homo uxorem et habuerit eam et non invenerit gratiam ante oculos eius propter aliquam foeditatem scribet libellum repudii et dabit in manu illius et dimittet eam de domo sua";
kjv[2] = "And when she is departed out of his house, she may go and be another man\'s [wife].";
rsv[2] = "and if she goes and becomes another man\'s wife,";
asv[2] = "And when she is departed out of his house, she may go and be another man\'s [wife].";
yng[2] = "and she hath gone out of his house, and hath gone and been another man\'s,";
dby[2] = "And she shall depart out of his house, and go away, and may become another man\'s wife.";
web[2] = "And when she hath departed from his house, she may go and be another man\'s [wife].";
hnv[2] = "When she is departed out of his house, she may go and be another man\'s [wife].";
vul[2] = "cumque egressa alterum maritum duxerit";
kjv[3] = "And [if] the latter husband hate her, and write her a bill of divorcement, and giveth [it] in her hand, and sendeth her out of his house; or if the latter husband die, which took her [to be] his wife;";
rsv[3] = "and the latter husband dislikes her and writes her a bill of divorce and puts it in her hand and sends her out of his house, or if the latter husband dies, who took her to be his wife,";
asv[3] = "And if the latter husband hate her, and write her a bill of divorcement, and give it in her hand, and send her out of his house; or if the latter husband die, who took her to be his wife;";
yng[3] = "and the latter man hath hated her, and written for her a writing of divorce, and given [it] into her hand, and sent her out of his house, or when the latter man dieth, who hath taken her to himself for a wife:";
dby[3] = "And if the latter husband hate her, and write her a letter of divorce, and give it into her hand, and send her out of his house; or if the latter husband die who took her as his wife;";
web[3] = "And [if] the latter husband shall hate her, and write her a bill of divorcement, and give [it] in her hand, and send her out of his house; or if the latter husband shall die, who took her [to be] his wife;";
hnv[3] = "If the latter husband hate her, and write her a bill of divorce, and give it in her hand, and send her out of his house; or if the latter husband die, who took her to be his wife;";
vul[3] = "et ille quoque oderit eam dederitque ei libellum repudii et dimiserit de domo sua vel certe mortuus fuerit";
kjv[4] = "Her former husband, which sent her away, may not take her again to be his wife, after that she is defiled; for that [is] abomination before the LORD: and thou shalt not cause the land to sin, which the LORD thy God giveth thee [for] an inheritance.";
rsv[4] = "then her former husband, who sent her away, may not take her again to be his wife, after she has been defiled; for that is an abomination before the LORD, and you shall not bring guilt upon the land which the LORD your God gives you for an inheritance.";
asv[4] = "her former husband, who sent her away, may not take her again to be his wife, after that she is defiled; for that is abomination before Jehovah: and thou shalt not cause the land to sin, which Jehovah thy God giveth thee for an inheritance.";
yng[4] = "`Her former husband who sent her away is not able to turn back to take her to be to him for a wife, after that she hath become defiled; for an abomination it [is] before Jehovah, and thou dost not cause the land to sin which Jehovah thy God is giving to thee -- an inheritance.";
dby[4] = "her first husband, who sent her away, may not take her again to be his wife, after that she is defiled; for it is an abomination before Jehovah; and thou shalt not cause the land to sin, which Jehovah thy God giveth thee for an inheritance.";
web[4] = "Her former husband who sent her away, may not take her again to be his wife, after that she is defiled; for that [is] abomination before the LORD: and thou shalt not cause the land to sin, which the LORD thy God giveth thee [for] an inheritance.";
hnv[4] = "her former husband, who sent her away, may not take her again to be his wife, after that she is defiled; for that is abomination before the LORD: and you shall not cause the land to sin, which the LORD your God gives you for an inheritance.";
vul[4] = "non poterit prior maritus recipere eam in uxorem quia polluta est et abominabilis facta est coram Domino ne peccare facias terram tuam quam Dominus Deus tuus tibi tradiderit possidendam";
kjv[5] = "When a man hath taken a new wife, he shall not go out to war, neither shall he be charged with any business: [but] he shall be free at home one year, and shall cheer up his wife which he hath taken.";
rsv[5] = "&quot;When a man is newly married, he shall not go out with the army or be charged with any business; he shall be free at home one year, to be happy with his wife whom he has taken.";
asv[5] = "When a man taketh a new wife, he shall not go out in the host, neither shall he be charged with any business: he shall be free at home one year, and shall cheer his wife whom he hath taken.";
yng[5] = "`When a man taketh a new wife, he doth not go out into the host, and [one] doth not pass over unto him for anything; free he is at his own house one year, and hath rejoiced his wife whom he hath taken.";
dby[5] = "When a man hath newly taken a wife, he shall not go out with the army, neither shall any kind of business be imposed upon him; he shall be free for his house one year, and shall gladden his wife whom he hath taken.";
web[5] = "When a man hath newly taken a wife, he shall not go out to war, neither shall he be charged with any business: [but] he shall be free at home one year, and shall cheer his wife which he hath taken.";
hnv[5] = "When a man takes a new wife, he shall not go out in the host, neither shall he be charged with any business: he shall be free at home one year, and shall cheer his wife whom he has taken.";
vul[5] = "cum acceperit homo nuper uxorem non procedet ad bellum nec ei quippiam necessitatis iniungetur publicae sed vacabit absque culpa domui suae ut uno anno laetetur cum uxore sua";
kjv[6] = "No man shall take the nether or the upper millstone to pledge: for he taketh [a man\'s] life to pledge.";
rsv[6] = "&quot;No man shall take a mill or an upper millstone in pledge; for he would be taking a life in pledge.";
asv[6] = "No man shall take the mill or the upper millstone to pledge; for he taketh [a man\'s] life to pledge.";
yng[6] = "`None doth take in pledge millstones, and rider, for life it [is] he is taking in pledge.";
dby[6] = "No man shall take the hand-mill or the upper millstone in pledge; for it would be taking life in pledge.";
web[6] = "No man shall take the nether or the upper millstone for a pledge: for he taketh [a man\'s] life for a pledge.";
hnv[6] = "No man shall take the mill or the upper millstone to pledge; for he takes [a man\'s] life to pledge.";
vul[6] = "non accipies loco pignoris inferiorem et superiorem molam quia animam suam adposuit tibi";
kjv[7] = "If a man be found stealing any of his brethren of the children of Israel, and maketh merchandise of him, or selleth him; then that thief shall die; and thou shalt put evil away from among you.";
rsv[7] = "&quot;If a man is found stealing one of his brethren, the people of Israel, and if he treats him as a slave or sells him, then that thief shall die; so you shall purge the evil from the midst of you.";
asv[7] = "If a man be found stealing any of his brethren of the children of Israel, and he deal with him as a slave, or sell him; then that thief shall die: so shalt thou put away the evil from the midst of thee.";
yng[7] = "`When a man is found stealing a person, of his brethren, of the sons of Israel, and hath tyrannized over him, and sold him, then hath that thief died, and thou hast put away the evil thing out of thy midst.";
dby[7] = "If a man be found who hath stolen one of his brethren of the children of Israel, and who hath treated him as a slave and sold him, that thief shall die; and thou shalt put evil away from thy midst.";
web[7] = "If a man shall be found stealing any of his brethren of the children of Israel, and shall make merchandise of him, or sell him; then that thief shall die; and thou shalt remove evil from among you.";
hnv[7] = "If a man be found stealing any of his brothers of the children of Yisra\'el, and he deal with him as a slave, or sell him; then that thief shall die: so shall you put away the evil from the midst of you.";
vul[7] = "si deprehensus fuerit homo sollicitans fratrem suum de filiis Israhel et vendito eo accipiens pretium interficietur et auferes malum de medio tui";
kjv[8] = "Take heed in the plague of leprosy, that thou observe diligently, and do according to all that the priests the Levites shall teach you: as I commanded them, [so] ye shall observe to do.";
rsv[8] = "&quot;Take heed, in an attack of leprosy, to be very careful to do according to all that the Levitical priests shall direct you; as I commanded them, so you shall be careful to do.";
asv[8] = "Take heed in the plague of leprosy, that thou observe diligently, and do according to all that the priests the Levites shall teach you: as I commanded them, so ye shall observe to do.";
yng[8] = "`Take heed, in the plague of leprosy, to watch greatly, and to do according to all that the priests, the Levites, teach you; as I have commanded them ye observe to do;";
dby[8] = "Take heed in the plague of leprosy, that thou take great heed, and do according to all that the priests the Levites shall teach you: as I commanded them shall ye take heed to do.";
web[8] = "Take heed in the plague of leprosy, that thou observe diligently, and do according to all that the priests the Levites shall teach you: as I commanded them, [so] ye shall observe to do.";
hnv[8] = "Take heed in the plague of leprosy, that you observe diligently, and do according to all that the Kohanim the Levites shall teach you: as I commanded them, so you shall observe to do.";
vul[8] = "observa diligenter ne incurras in plagam leprae sed facies quaecumque docuerint te sacerdotes levitici generis iuxta id quod praecepi eis et imple sollicite";
kjv[9] = "Remember what the LORD thy God did unto Miriam by the way, after that ye were come forth out of Egypt.";
rsv[9] = "Remember what the LORD your God did to Miriam on the way as you came forth out of Egypt.";
asv[9] = "Remember what Jehovah thy God did unto Miriam, by the way as ye came forth out of Egypt.";
yng[9] = "remember that which Jehovah thy God hath done to Miriam in the way, in your coming out of Egypt.";
dby[9] = "Remember what Jehovah thy God did unto Miriam on the way, after that ye came forth out of Egypt.";
web[9] = "Remember what the LORD thy God did to Miriam by the way, after that ye come forth from Egypt.";
hnv[9] = "Remember what the LORD your God did to Miryam, by the way as you came forth out of Mitzrayim.";
vul[9] = "mementote quae fecerit Dominus Deus vester Mariae in via cum egrederemini de Aegypto";
kjv[10] = "When thou dost lend thy brother any thing, thou shalt not go into his house to fetch his pledge.";
rsv[10] = "&quot;When you make your neighbor a loan of any sort, you shall not go into his house to fetch his pledge.";
asv[10] = "When thou dost lend thy neighbor any manner of loan, thou shalt not go into his house to fetch his pledge.";
yng[10] = "`When thou liftest up on thy brother a debt of anything, thou dost not go in unto his house to obtain his pledge;";
dby[10] = "When thou dost lend thy brother anything, thou shalt not go into his house to secure his pledge.";
web[10] = "When thou dost lend thy brother any thing, thou shalt not go into his house to take his pledge:";
hnv[10] = "When you do lend your neighbor any manner of loan, you shall not go into his house to get his pledge.";
vul[10] = "cum repetes a proximo tuo rem aliquam quam debet tibi non ingredieris domum eius ut pignus auferas";
kjv[11] = "Thou shalt stand abroad, and the man to whom thou dost lend shall bring out the pledge abroad unto thee.";
rsv[11] = "You shall stand outside, and the man to whom you make the loan shall bring the pledge out to you.";
asv[11] = "Thou shalt stand without, and the man to whom thou dost lend shall bring forth the pledge without unto thee.";
yng[11] = "at the outside thou dost stand, and the man on whom thou art lifting [it] up is bringing out unto thee the pledge at the outside.";
dby[11] = "Thou shalt stand outside, and the man to whom thou hast made a loan shall bring out the pledge to thee without.";
web[11] = "Thou shalt stand abroad, and the man to whom thou dost lend shall bring out the pledge abroad to thee:";
hnv[11] = "You shall stand outside, and the man to whom you do lend shall bring forth the pledge outside to you.";
vul[11] = "sed stabis foris et ille tibi proferet quod habuerit";
kjv[12] = "And if the man [be] poor, thou shalt not sleep with his pledge:";
rsv[12] = "And if he is a poor man, you shall not sleep in his pledge;";
asv[12] = "And if he be a poor man, thou shalt not sleep with his pledge;";
yng[12] = "`And if he is a poor man, thou dost not lie down with his pledge;";
dby[12] = "And if the man be needy, thou shalt not lie down with his pledge;";
web[12] = "And if the man [is] poor, thou shalt not sleep with his pledge:";
hnv[12] = "If he be a poor man, you shall not sleep with his pledge;";
vul[12] = "sin autem pauper est non pernoctabit apud te pignus";
kjv[13] = "In any case thou shalt deliver him the pledge again when the sun goeth down, that he may sleep in his own raiment, and bless thee: and it shall be righteousness unto thee before the LORD thy God.";
rsv[13] = "when the sun goes down, you shall restore to him the pledge that he may sleep in his cloak and bless you; and it shall be righteousness to you before the LORD your God.";
asv[13] = "thou shalt surely restore to him the pledge when the sun goeth down, that he may sleep in his garment, and bless thee: and it shall be righteousness unto thee before Jehovah thy God.";
yng[13] = "thou dost certainly give back to him the pledge at the going in of the sun, and he hath lain down in his own raiment, and hath blessed thee; and to thee it is righteousness before Jehovah thy God.";
dby[13] = "in any case thou shalt return him the pledge at the going down of the sun, that he may sleep in his own upper garment and bless thee; and it shall be righteousness unto thee before Jehovah thy God.";
web[13] = "In any case thou shalt deliver to him the pledge again when the sun goeth down, that he may sleep in his own raiment, and bless thee; and it shall be righteousness to thee before the LORD thy God.";
hnv[13] = "you shall surely restore to him the pledge when the sun goes down, that he may sleep in his garment, and bless you: and it shall be righteousness to you before the LORD your God.";
vul[13] = "sed statim reddes ei ante solis occasum ut dormiens in vestimento suo benedicat tibi et habeas iustitiam coram Domino Deo tuo";
kjv[14] = "Thou shalt not oppress an hired servant [that is] poor and needy, [whether he be] of thy brethren, or of thy strangers that [are] in thy land within thy gates:";
rsv[14] = "&quot;You shall not oppress a hired servant who is poor and needy, whether he is one of your brethren or one of the sojourners who are in your land within your towns;";
asv[14] = "Thou shalt not oppress a hired servant that is poor and needy, whether he be of thy brethren, or of thy sojourners that are in thy land within thy gates:";
yng[14] = "`Thou dost not oppress a hireling, poor and needy, of thy brethren or of thy sojourner who is in thy land within thy gates;";
dby[14] = "Thou shalt not oppress a hired servant [who is] poor and needy of thy brethren, or of thy sojourners who are in thy land within thy gates:";
web[14] = "Thou shalt not oppress a hired servant [that is] poor and needy, [whether he is] of thy brethren, or of thy strangers that [are] in thy land within thy gates:";
hnv[14] = "You shall not oppress a hired servant who is poor and needy, whether he be of your brothers, or of your foreigners who are in your land within your gates:";
vul[14] = "non negabis mercedem indigentis et pauperis fratris tui sive advenae qui tecum moratur in terra et intra portas tuas est";
kjv[15] = "At his day thou shalt give [him] his hire, neither shall the sun go down upon it; for he [is] poor, and setteth his heart upon it: lest he cry against thee unto the LORD, and it be sin unto thee.";
rsv[15] = "you shall give him his hire on the day he earns it, before the sun goes down (for he is poor, and sets his heart upon it); lest he cry against you to the LORD, and it be sin in you.";
asv[15] = "in his day thou shalt give him his hire, neither shall the sun go down upon it (for he is poor, and setteth his heart upon it); lest he cry against thee unto Jehovah, and it be sin unto thee.";
yng[15] = "in his day thou dost give his hire, and the sun doth not go in upon it, for he [is] poor, and unto it he is lifting up his soul, and he doth not cry against thee unto Jehovah, and it hath been in thee -- sin.";
dby[15] = "on his day thou shalt give him his hire, neither shall the sun go down upon it; for he is poor, and his soul yearneth after it; lest he cry against thee to Jehovah, and it be a sin in thee.";
web[15] = "At his day thou shalt give [him] his hire, neither shall the sun go down upon it, for he [is] poor, and setteth his heart upon it: lest he should cry against thee to the LORD, and it be sin to thee.";
hnv[15] = "in his day you shall give him his hire, neither shall the sun go down on it; for he is poor, and sets his heart on it: lest he cry against you to the LORD, and it be sin to you.";
vul[15] = "sed eadem die reddes ei pretium laboris sui ante solis occasum quia pauper est et ex eo sustentat animam suam ne clamet contra te ad Dominum et reputetur tibi in peccatum";
kjv[16] = "The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.";
rsv[16] = "&quot;The fathers shall not be put to death for the children, nor shall the children be put to death for the fathers; every man shall be put to death for his own sin.";
asv[16] = "The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.";
yng[16] = "`Fathers are not put to death for sons, and sons are not put to death for fathers -- each for his own sin, they are put to death.";
dby[16] = "The fathers shall not be put to death for the sons, neither shall the sons be put to death for the fathers: every man shall be put to death for his own sin.";
web[16] = "The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.";
hnv[16] = "The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.";
vul[16] = "non occidentur patres pro filiis nec filii pro patribus sed unusquisque pro suo peccato morietur";
kjv[17] = "Thou shalt not pervert the judgment of the stranger, [nor] of the fatherless; nor take a widow\'s raiment to pledge:";
rsv[17] = "&quot;You shall not pervert the justice due to the sojourner or to the fatherless, or take a widow\'s garment in pledge;";
asv[17] = "Thou shalt not wrest the justice [due] to the sojourner, [or] to the fatherless, nor take the widow\'s raiment to pledge;";
yng[17] = "`Thou dost not turn aside the judgment of a fatherless sojourner, nor take in pledge the garment of a widow;";
dby[17] = "Thou shalt not pervert the judgment of the stranger, [or] of the fatherless; and thou shalt not take in pledge a widow\'s garment.";
web[17] = "Thou shalt not pervert the judgment of the stranger, [nor] of the fatherless, nor take a widow\'s raiment for a pledge:";
hnv[17] = " You shall not wrest the justice [due] to the foreigner, [or] to the fatherless, nor take the widow\'s clothing to pledge;";
vul[17] = "non pervertes iudicium advenae et pupilli nec auferes pignoris loco viduae vestimentum";
kjv[18] = "But thou shalt remember that thou wast a bondman in Egypt, and the LORD thy God redeemed thee thence: therefore I command thee to do this thing.";
rsv[18] = "but you shall remember that you were a slave in Egypt and the LORD your God redeemed you from there; therefore I command you to do this.";
asv[18] = "but thou shalt remember that thou wast a bondman in Egypt, and Jehovah thy God redeemed thee thence: therefore I command thee to do this thing.";
yng[18] = "and thou hast remembered that a servant thou hast been in Egypt, and Jehovah thy God doth ransom thee from thence; therefore I am commanding thee to do this thing.";
dby[18] = "And thou shalt remember that thou wast a bondman in Egypt, and that Jehovah thy God redeemed thee from thence; therefore I command thee to do this thing.";
web[18] = "But thou shalt remember that thou wast a bond-man in Egypt, and the LORD thy God redeemed thee thence: therefore I command thee to do this thing.";
hnv[18] = "but you shall remember that you were a bondservant in Mitzrayim, and the LORD your God redeemed you there: therefore I command you to do this thing.";
vul[18] = "memento quod servieris in Aegypto et eruerit te Dominus Deus tuus inde idcirco praecipio tibi ut facias hanc rem";
kjv[19] = "When thou cuttest down thine harvest in thy field, and hast forgot a sheaf in the field, thou shalt not go again to fetch it: it shall be for the stranger, for the fatherless, and for the widow: that the LORD thy God may bless thee in all the work of thine hands.";
rsv[19] = "&quot;When you reap your harvest in your field, and have forgotten a sheaf in the field, you shall not go back to get it; it shall be for the sojourner, the fatherless, and the widow; that the LORD your God may bless you in all the work of your hands.";
asv[19] = "When thou reapest thy harvest in thy field, and hast forgot a sheaf in the field, thou shalt not go again to fetch it: it shall be for the sojourner, for the fatherless, and for the widow; that Jehovah thy God may bless thee in all the work of thy hands.";
yng[19] = "`When thou reapest thy harvest in thy field, and hast forgotten a sheaf in a field, thou dost not turn back to take it; to the sojourner, to the fatherless, and to the widow, it is; so that Jehovah thy God doth bless thee in all the work of thy hands.";
dby[19] = "When thou reapest thy harvest in thy field, and forgettest a sheaf in the field, thou shalt not return to fetch it; it shall be for the stranger, for the fatherless, and for the widow; that Jehovah thy God may bless thee in all the work of thy hands.";

vul[19] = "quando messueris segetem in agro tuo et oblitus manipulum reliqueris non reverteris ut tollas eum sed advenam et pupillum et viduam auferre patieris ut benedicat tibi Dominus Deus tuus in omni opere manuum tuarum";
