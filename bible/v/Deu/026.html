csb[1] = "&quot;When you enter the land the LORD your God is giving you as an inheritance, and you take possession of it and live in it,";
csb[2] = "&quot;take some of the first of all the land\'s produce that you harvest from the land the LORD your God is giving you and put it in a basket. Then go to the place where the LORD your God chooses to have his name dwell.";
csb[3] = "&quot;When you come before the priest who is serving at that time, say to him, \'Today I declare to the LORD your God that I have entered the land the LORD swore to our fathers to give us.\'";
csb[4] = "&quot;Then the priest will take the basket from you and place it before the altar of the LORD your God.";
csb[5] = "&quot;You are to respond by saying in the presence of the LORD your God: My father was a wandering Aramean. He went down to Egypt with a few people and resided there as an alien. There he became a great, powerful, and populous nation.";
csb[6] = "&quot;But the Egyptians mistreated and oppressed us, and forced us to do hard labor.";
csb[7] = "&quot;So we called out to the LORD, the God of our fathers, and the LORD heard our cry and saw our misery, hardship, and oppression.";
csb[8] = "&quot;Then the LORD brought us out of Egypt with a strong hand and an outstretched arm, with terrifying power, and with signs and wonders.";
csb[9] = "&quot;He led us to this place and gave us this land, a land flowing with milk and honey.";
csb[10] = "&quot;I have now brought the first of the land\'s produce that you, LORD, have given me. You will then place the container before the LORD your God and bow down to him.";
csb[11] = "&quot;You, the Levites, and the resident aliens among you will rejoice in all the good things the LORD your God has given you and your household.";
csb[12] = "&quot;When you have finished paying all the tenth of your produce in the third year, the year of the tenth, you are to give it to the Levites, resident aliens, fatherless children and widows, so that they may eat in your towns and be satisfied.";
csb[13] = "&quot;Then you will say in the presence of the LORD your God: I have taken the consecrated portion out of my house; I have also given it to the Levites, resident aliens, fatherless children, and widows, according to all the commands you gave me. I have not violated or forgotten your commands.";
csb[14] = "&quot;I have not eaten any of it while in mourning, or removed any of it while unclean, or offered any of it for the dead. I have obeyed the LORD my God; I have done all you commanded me.";
csb[15] = "&quot;Look down from your holy dwelling, from heaven, and bless your people Israel and the land you have given us as you swore to our fathers, a land flowing with milk and honey.";
csb[16] = "&quot;The LORD your God is commanding you this day to follow these statutes and ordinances. Follow them carefully with all your heart and all your soul.";
csb[17] = "&quot;Today you have affirmed that the LORD is your God and that you will walk in his ways, keep his statutes, commands, and ordinances, and obey him.";
csb[18] = "&quot;And today the LORD has affirmed that you are his own possession as he promised you, that you are to keep all his commands,";
csb[19] = "&quot;that he will elevate you to praise, fame, and glory above all the nations he has made, and that you will be a holy people to the LORD your God as he promised.&quot;";

kjv[14] = "I have not eaten thereof in my mourning, neither have I taken away [ought] thereof for [any] unclean [use], nor given [ought] thereof for the dead: [but] I have hearkened to the voice of the LORD my God, [and] have done according to all that thou hast commanded me.";
