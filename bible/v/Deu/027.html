csb[1] = "Moses and the elders of Israel commanded the people, &quot;Keep every command I am giving you today.";
csb[2] = "&quot;When you cross the Jordan into the land the LORD your God is giving you, set up large stones and cover them with plaster.";
csb[3] = "&quot;Write all the words of this law on the stones after you cross to enter the land the LORD your God is giving you, a land flowing with milk and honey, as the LORD, the God of your fathers, has promised you.";
csb[4] = "&quot;When you have crossed the Jordan, you are to set up these stones on Mount Ebal, as I am commanding you today, and you are to cover them with plaster.";
csb[5] = "&quot;Build an altar of stones there to the LORD your God -- do not use any iron tool on them.";
csb[6] = "&quot;Use uncut stones to build the altar of the LORD your God and offer burnt offerings to the LORD your God on it.";
csb[7] = "&quot;There you are to sacrifice fellowship offerings, eat, and rejoice in the presence of the LORD your God.";
csb[8] = "&quot;Write clearly all the words of this law on the plastered stones.&quot;";
csb[9] = "Moses and the Levitical priests spoke to all Israel, &quot;Be silent, Israel, and listen! This day you have become the people of the LORD your God.";
csb[10] = "&quot;Obey the LORD your God and follow his commands and statutes I am giving you today.&quot;";
csb[11] = "On that day Moses commanded the people,";
csb[12] = "&quot;When you have crossed the Jordan, these tribes will stand on Mount Gerizim to bless the people: Simeon, Levi, Judah, Issachar, Joseph, and Benjamin.";
csb[13] = "&quot;And these tribes will stand on Mount Ebal to deliver the curse: Reuben, Gad, Asher, Zebulun, Dan, and Naphtali.";
csb[14] = "&quot;The Levites will proclaim in a loud voice to every Israelite:";
csb[15] = "&quot;\'The person who makes a carved idol or cast image, which is detestable to the LORD, the work of a craftsman, and sets it up in secret is cursed.\' And all the people will reply, \'Amen! \'";
csb[16] = "&quot;\'The one who dishonors his father or mother is cursed.\' And all the people will say, \'Amen! \'";
csb[17] = "&quot;\'The one who moves his neighbor\'s boundary marker is cursed.\' And all the people will say, \'Amen! \'";
csb[18] = "&quot;\'The one who leads a blind person astray on the road is cursed.\' And all the people will say, \'Amen! \'";
csb[19] = "&quot;\'The one who denies justice to a resident alien, a fatherless child, or a widow is cursed.\' And all the people will say, \'Amen! \'";
csb[20] = "&quot;\'The one who sleeps with his father\'s wife is cursed, for he has violated his father\'s marriage bed.\' And all the people will say, \'Amen! \'";
csb[21] = "&quot;\'The one who has sexual intercourse with any animal is cursed.\' And all the people will say, \'Amen! \'";
csb[22] = "&quot;\'The one who sleeps with his sister, whether his father\'s daughter or his mother\'s daughter is cursed.\' And all the people will say, \'Amen! \'";
csb[23] = "&quot;\'The one who sleeps with his mother-in-law is cursed.\' And all the people will say, \'Amen! \'";
csb[24] = "&quot;\'The one who secretly kills his neighbor is cursed.\' And all the people will say, \'Amen! \'";
csb[25] = "&quot;\'The one who accepts a bribe to kill an innocent person is cursed.\' And all the people will say, \'Amen! \'";
csb[26] = "&quot;\'Anyone who does not put the words of this law into practice is cursed.\' And all the people will say, \'Amen! \'";
