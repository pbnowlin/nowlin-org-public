csb[1] = "&quot;When all these things happen to you -- the blessings and curses I have set before you -- and you come to your senses while you are in all the nations where the LORD your God has driven you,";
csb[2] = "&quot;and you and your children return to the LORD your God and obey him with all your heart and all your soul by doing everything I am commanding you today,";
csb[3] = "&quot;then he will restore your fortunes, have compassion on you, and gather you again from all the peoples where the LORD your God has scattered you.";
csb[4] = "&quot;Even if your exiles are at the farthest horizon, he will gather you and bring you back from there.";
csb[5] = "&quot;The LORD your God will bring you into the land your fathers possessed, and you will take possession of it. He will cause you to prosper and multiply you more than he did your fathers.";
csb[6] = "&quot;The LORD your God will circumcise your heart and the hearts of your descendants, and you will love him with all your heart and all your soul so that you will live.";
csb[7] = "&quot;The LORD your God will put all these curses on your enemies who hate and persecute you.";
csb[8] = "&quot;Then you will again obey him and follow all his commands I am commanding you today.";
csb[9] = "&quot;The LORD your God will make you prosper abundantly in all the work of your hands, your offspring, the offspring of your livestock, and the produce of your land. Indeed, the LORD will again delight in your prosperity, as he delighted in that of your fathers,";
csb[10] = "&quot;when you obey the LORD your God by keeping his commands and statutes that are written in this book of the law and return to him with all your heart and all your soul.";
csb[11] = "&quot;This command that I give you today is certainly not too difficult or beyond your reach.";
csb[12] = "&quot;It is not in heaven so that you have to ask, \'Who will go up to heaven, get it for us, and proclaim it to us so that we may follow it? \'";
csb[13] = "&quot;And it is not across the sea so that you have to ask, \'Who will cross the sea, get it for us, and proclaim it to us so that we may follow it? \'";
csb[14] = "&quot;But the message is very near you, in your mouth and in your heart, so that you may follow it.";
csb[15] = "&quot;See, today I have set before you life and prosperity, death and adversity.";
csb[16] = "&quot;For I am commanding you today to love the LORD your God, to walk in his ways, and to keep his commands, statutes, and ordinances, so that you may live and multiply, and the LORD your God may bless you in the land you are entering to possess.";
csb[17] = "&quot;But if your heart turns away and you do not listen and you are led astray to bow in worship to other gods and serve them,";
csb[18] = "&quot;I tell you today that you will certainly perish and will not prolong your days in the land you are entering to possess across the Jordan.";
csb[19] = "&quot;I call heaven and earth as witnesses against you today that I have set before you life and death, blessing and curse. Choose life so that you and your descendants may live,";
csb[20] = "&quot;love the LORD your God, obey him, and remain faithful to him. For he is your life, and he will prolong your days as you live in the land the LORD swore to give to your fathers Abraham, Isaac, and Jacob.&quot;";
kjv[1] = "And it shall come to pass, when all these things are come upon thee, the blessing and the curse, which I have set before thee, and thou shalt call [them] to mind among all the nations, whither the LORD thy God hath driven thee,";
kjv[2] = "And shalt return unto the LORD thy God, and shalt obey his voice according to all that I command thee this day, thou and thy children, with all thine heart, and with all thy soul;";
kjv[3] = "That then the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations, whither the LORD thy God hath scattered thee.";
kjv[4] = "If [any] of thine be driven out unto the outmost [parts] of heaven, from thence will the LORD thy God gather thee, and from thence will he fetch thee:";
kjv[5] = "And the LORD thy God will bring thee into the land which thy fathers possessed, and thou shalt possess it; and he will do thee good, and multiply thee above thy fathers.";
kjv[6] = "And the LORD thy God will circumcise thine heart, and the heart of thy seed, to love the LORD thy God with all thine heart, and with all thy soul, that thou mayest live.";
kjv[7] = "And the LORD thy God will put all these curses upon thine enemies, and on them that hate thee, which persecuted thee.";
kjv[8] = "And thou shalt return and obey the voice of the LORD, and do all his commandments which I command thee this day.";
kjv[9] = "And the LORD thy God will make thee plenteous in every work of thine hand, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy land, for good: for the LORD will again rejoice over thee for good, as he rejoiced over thy fathers:";
kjv[10] = "If thou shalt hearken unto the voice of the LORD thy God, to keep his commandments and his statutes which are written in this book of the law, [and] if thou turn unto the LORD thy God with all thine heart, and with all thy soul.";
kjv[11] = "For this commandment which I command thee this day, it [is] not hidden from thee, neither [is] it far off.";
kjv[12] = "It [is] not in heaven, that thou shouldest say, Who shall go up for us to heaven, and bring it unto us, that we may hear it, and do it?";
kjv[13] = "Neither [is] it beyond the sea, that thou shouldest say, Who shall go over the sea for us, and bring it unto us, that we may hear it, and do it?";
kjv[14] = "But the word [is] very nigh unto thee, in thy mouth, and in thy heart, that thou mayest do it.";
kjv[15] = "See, I have set before thee this day life and good, and death and evil;";
kjv[16] = "In that I command thee this day to love the LORD thy God, to walk in his ways, and to keep his commandments and his statutes and his judgments, that thou mayest live and multiply: and the LORD thy God shall bless thee in the land whither thou goest to possess it.";
kjv[17] = "But if thine heart turn away, so that thou wilt not hear, but shalt be drawn away, and worship other gods, and serve them;";
kjv[18] = "I denounce unto you this day, that ye shall surely perish, [and that] ye shall not prolong [your] days upon the land, whither thou passest over Jordan to go to possess it.";
kjv[19] = "I call heaven and earth to record this day against you, [that] I have set before you life and death, blessing and cursing: therefore choose life, that both thou and thy seed may live:";
kjv[20] = "That thou mayest love the LORD thy God, [and] that thou mayest obey his voice, and that thou mayest cleave unto him: for he [is] thy life, and the length of thy days: that thou mayest dwell in the land which the LORD sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give them.";

yng[18] = "I have declared to you this day, that ye do certainly perish, ye do not prolong days on the ground which thou art passing over the Jordan to go in thither to possess it.";
dby[18] = "I denounce unto you this day that ye shall surely perish; ye shall not prolong your days upon the land whereunto thou passest over the Jordan to possess it.";
web[18] = "I denounce to you this day, that ye shall surely perish, [and that] ye shall not prolong [your] days upon the land, whither thou passest over Jordan to go to possess it.";
hnv[18] = "I denounce to you this day, that you shall surely perish; you shall not prolong your days in the land, where you pass over the Yarden to go in to possess it.";
vul[18] = "praedico tibi hodie quod pereas et parvo tempore moreris in terra ad quam Iordane transmisso ingredieris possidendam";
rsv[19] = "I call heaven and earth to witness against you this day, that I have set before you life and death, blessing and curse; therefore choose life, that you and your descendants may live,";
asv[19] = "I call heaven and earth to witness against you this day, that I have set before thee life and death, the blessing and the curse: therefore choose life, that thou mayest live, thou and thy seed;";
yng[19] = "`I have caused to testify against you to-day the heavens and the earth; life and death I have set before thee, the blessing and the reviling; and thou hast fixed on life, so that thou dost live, thou and thy seed,";
dby[19] = "I call heaven and earth to witness this day against you: life and death have I set before you, blessing and cursing: choose then life, that thou mayest live, thou and thy seed,";
web[19] = "I call heaven and earth to record this day against you, [that] I have set before you life and death, blessing and cursing: therefore choose life, that both thou and thy seed may live:";
hnv[19] = "I call heaven and eretz to witness against you this day, that I have set before you life and death, the blessing and the curse: therefore choose life, that you may live, you and your seed;";
vul[19] = "testes invoco hodie caelum et terram quod proposuerim vobis vitam et mortem bonum et malum benedictionem et maledictionem elige ergo vitam ut et tu vivas et semen tuum";
rsv[20] = "loving the LORD your God, obeying his voice, and cleaving to him; for that means life to you and length of days, that you may dwell in the land which the LORD swore to your fathers, to Abraham, to Isaac, and to Jacob, to give them.&quot;";
asv[20] = "to love Jehovah thy God, to obey his voice, and to cleave unto him; for he is thy life, and the length of thy days; that thou mayest dwell in the land which Jehovah sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give them.";
yng[20] = "to love Jehovah thy God, to hearken to His voice, and to cleave to Him (for He [is] thy life, and the length of thy days), to dwell on the ground which Jehovah hath sworn to thy fathers, to Abraham, to Isaac, and to Jacob, to give to them.\'";
dby[20] = "in loving Jehovah thy God, in hearkening to his voice, and in cleaving to him -- for this is thy life and the length of thy days -- that thou mayest dwell in the land which Jehovah swore unto thy fathers, to Abraham, to Isaac, and to Jacob, to give them.";
web[20] = "That thou mayest love the LORD thy God, [and] that thou mayest obey his voice, and that thou mayest cleave to him (for he [is] thy life, and the length of thy days) that thou mayest dwell in the land which the LORD swore to thy fathers, to Abraham, to Isaac, and to Jacob, to give them.";
hnv[20] = "to love the LORD your God, to obey his voice, and to cleave to him; for he is your life, and the length of your days; that you may dwell in the land which the LORD swore to your fathers, to Avraham, to Yitzchak, and to Ya`akov, to give them.";
vul[20] = "et diligas Dominum Deum tuum atque oboedias voci eius et illi adhereas ipse est enim vita tua et longitudo dierum tuorum ut habites in terra pro qua iuravit Dominus patribus tuis Abraham Isaac et Iacob ut daret eam illis";
