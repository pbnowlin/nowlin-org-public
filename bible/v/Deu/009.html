csb[1] = "&quot;Listen, Israel: Today you are about to cross the Jordan to enter and drive out nations greater and stronger than you, with large cities fortified to the heavens.";
csb[2] = "&quot;The people are strong and tall, the descendants of the Anakim. You know about them and you have heard it said about them, \'Who can stand up to the sons of Anak? \'";
csb[3] = "&quot;But understand that today the LORD your God will cross over ahead of you as a consuming fire; he will devastate and subdue them before you. You will drive them out and destroy them swiftly, as the LORD has told you.";
csb[4] = "&quot;When the LORD your God drives them out before you, do not say to yourself, \'The LORD brought me in to take possession of this land because of my righteousness.\' Instead, the LORD will drive out these nations before you because of their wickedness.";
csb[5] = "&quot;You are not going to take possession of their land because of your righteousness or your integrity. Instead, the LORD your God will drive out these nations before you because of their wickedness, in order to fulfill the promise he swore to your fathers, Abraham, Isaac, and Jacob.";
csb[6] = "&quot;Understand that the LORD your God is not giving you this good land to possess because of your righteousness, for you are a stiff-necked people.";
csb[7] = "&quot;Remember and do not forget how you provoked the LORD your God in the wilderness. You have been rebelling against the LORD from the day you left the land of Egypt until you reached this place.";
csb[8] = "&quot;You provoked the LORD at Horeb, and he was angry enough with you to destroy you.";
csb[9] = "&quot;When I went up the mountain to receive the stone tablets, the tablets of the covenant the LORD made with you, I stayed on the mountain forty days and forty nights. I did not eat food or drink water.";
csb[10] = "&quot;On the day of the assembly the LORD gave me the two stone tablets, inscribed by God\'s finger. The exact words were on them, which the LORD spoke to you from the fire on the mountain.";
csb[11] = "&quot;The LORD gave me the two stone tablets, the tablets of the covenant, at the end of the forty days and forty nights.";
csb[12] = "&quot;The LORD said to me, \'Get up and go down immediately from here. For your people whom you brought out of Egypt have acted corruptly. They have quickly turned from the way that I commanded them; they have made a cast image for themselves.\'";
csb[13] = "&quot;The LORD also said to me, \'I have seen this people, and indeed, they are a stiff-necked people.";
csb[14] = "&quot;Leave me alone, and I will destroy them and blot out their name under heaven. Then I will make you into a nation stronger and more numerous than they.\'";
csb[15] = "&quot;So I went back down the mountain, while it was blazing with fire, and the two tablets of the covenant were in my hands.";
csb[16] = "&quot;I saw how you had sinned against the LORD your God; you had made a calf image for yourselves. You had quickly turned from the way the LORD had commanded for you.";
csb[17] = "&quot;So I took hold of the two tablets and threw them from my hands, shattering them before your eyes.";
csb[18] = "&quot;I fell down like the first time in the presence of the LORD for forty days and forty nights; I did not eat food or drink water because of all the sin you committed, doing what was evil in the LORD\'s sight and angering him.";
csb[19] = "&quot;I was afraid of the fierce anger the LORD had directed against you, because he was about to destroy you. But again the LORD listened to me on that occasion.";
csb[20] = "&quot;The LORD was angry enough with Aaron to destroy him. But I prayed for Aaron at that time also.";
csb[21] = "&quot;I took the sinful calf you had made and burned it. I crushed it, thoroughly grinding it to powder as fine as dust, and threw its dust into the stream that came down from the mountain.";
csb[22] = "&quot;You continued to provoke the LORD at Taberah, Massah, and Kibroth-hattaavah.";
csb[23] = "&quot;When the LORD sent you from Kadesh-barnea, he said, \'Go up and possess the land I have given you\'; you rebelled against the command of the LORD your God. You did not believe or obey him.";
csb[24] = "&quot;You have been rebelling against the LORD ever since I have known you.";
csb[25] = "&quot;I fell down in the presence of the LORD forty days and forty nights because the LORD had threatened to destroy you.";
csb[26] = "&quot;I prayed to the LORD: Lord GOD, do not annihilate your people, your inheritance, whom you redeemed through your greatness and brought out of Egypt with a strong hand.";
csb[27] = "&quot;Remember your servants Abraham, Isaac, and Jacob. Disregard this people\'s stubbornness, and their wickedness and sin.";
csb[28] = "&quot;Otherwise, those in the land you brought us from will say, \'Because the LORD wasn\'t able to bring them into the land he had promised them, and because he hated them, he brought them out to kill them in the wilderness.\'";
csb[29] = "&quot;But they are your people, your inheritance, whom you brought out by your great power and outstretched arm.";

asv[16] = "And I looked, and, behold, ye had sinned against Jehovah your God; ye had made you a molten calf: ye had turned aside quickly out of the way which Jehovah had commanded you.";

dby[16] = "And I saw, and behold, ye had sinned against Jehovah your God: ye had made for yourselves a molten calf; ye had quickly turned aside from the way which Jehovah had commanded you.";

asv[17] = "And I took hold of the two tables, and cast them out of my two hands, and brake them before your eyes.";
yng[17] = "`And I lay hold on the two tables, and cast them out of my two hands, and break them before your eyes,";
dby[17] = "And I seized the two tables, and cast them out of my two hands, and broke them before your eyes.";
web[17] = "And I took the two tables, and cast them out of my two hands, and broke them before your eyes.";
hnv[17] = "I took hold of the two tables, and cast them out of my two hands, and broke them before your eyes.";
vul[17] = "proieci tabulas de manibus meis confregique eas in conspectu vestro";
kjv[18] = "And I fell down before the LORD, as at the first, forty days and forty nights: I did neither eat bread, nor drink water, because of all your sins which ye sinned, in doing wickedly in the sight of the LORD, to provoke him to anger.";
rsv[18] = "Then I lay prostrate before the LORD as before, forty days and forty nights; I neither ate bread nor drank water, because of all the sin which you had committed, in doing what was evil in the sight of the LORD, to provoke him to anger.";
asv[18] = "And I fell down before Jehovah, as at the first, forty days and forty nights; I did neither eat bread nor drink water; because of all your sin which ye sinned, in doing that which was evil in the sight of Jehovah, to provoke him to anger.";
yng[18] = "and I throw myself before Jehovah, as at first, forty days and forty nights; bread I have not eaten, and water I have not drunk, because of all your sins which ye have sinned, by doing the evil thing in the eyes of Jehovah, to make Him angry.";
dby[18] = "And I fell down before Jehovah, as at the first, forty days and forty nights, -- I ate no bread and drank no water, -- because of all your sin which ye had sinned, in doing what is evil in the eyes of Jehovah, to provoke him to anger.";
web[18] = "And I fell down before the LORD, as at the first, forty days and forty nights: I neither ate bread, nor drank water, because of all your sins which ye sinned, in doing wickedly in the sight of the LORD, to provoke him to anger.";
hnv[18] = "I fell down before the LORD, as at the first, forty days and forty nights; I did neither eat bread nor drink water; because of all your sin which you sinned, in doing that which was evil in the sight of the LORD, to provoke him to anger.";
vul[18] = "et procidi ante Dominum sicut prius quadraginta diebus et noctibus panem non comedens et aquam non bibens propter omnia peccata vestra quae gessistis contra Dominum et eum ad iracundiam provocastis";
kjv[19] = "For I was afraid of the anger and hot displeasure, wherewith the LORD was wroth against you to destroy you. But the LORD hearkened unto me at that time also.";
rsv[19] = "For I was afraid of the anger and hot displeasure which the LORD bore against you, so that he was ready to destroy you. But the LORD hearkened to me that time also.";
asv[19] = "For I was afraid of the anger and hot displeasure, wherewith Jehovah was wroth against you to destroy you. But Jehovah hearkened unto me that time also.";
yng[19] = "`For I have been afraid because of the anger and the fury with which Jehovah hath been wroth against you, to destroy you; and Jehovah doth hearken unto me also at this time.";
dby[19] = "For I was afraid of the anger and fury wherewith Jehovah was wroth against you to destroy you. And Jehovah listened unto me also at that time.";
web[19] = "(For I was afraid of the anger and hot displeasure with which the LORD was wroth against you to destroy you.) But the LORD hearkened to me at that time also.";
hnv[19] = "For I was afraid of the anger and hot displeasure, with which the LORD was angry against you to destroy you. But the LORD listened to me that time also.";
vul[19] = "timui enim indignationem et iram illius qua adversum vos concitatus delere vos voluit et exaudivit me Dominus etiam hac vice";
kjv[20] = "And the LORD was very angry with Aaron to have destroyed him: and I prayed for Aaron also the same time.";
rsv[20] = "And the LORD was so angry with Aaron that he was ready to destroy him; and I prayed for Aaron also at the same time.";
asv[20] = "And Jehovah was very angry with Aaron to destroy him: and I prayed for Aaron also at the same time.";
yng[20] = "`And with Aaron hath Jehovah shewed himself very angry, to destroy him, and I pray also for Aaron at that time;";
dby[20] = "And with Aaron Jehovah was very angry to destroy him; and I prayed for Aaron also at the same time.";
web[20] = "And the LORD was very angry with Aaron to have destroyed him: and I prayed for Aaron also at the same time.";
hnv[20] = "The LORD was very angry with Aharon to destroy him: and I prayed for Aharon also at the same time.";
vul[20] = "adversum Aaron quoque vehementer iratus voluit eum conterere et pro illo similiter deprecatus sum";
kjv[21] = "And I took your sin, the calf which ye had made, and burnt it with fire, and stamped it, [and] ground [it] very small, [even] until it was as small as dust: and I cast the dust thereof into the brook that descended out of the mount.";

asv[21] = "And I took your sin, the calf which ye had made, and burnt it with fire, and stamped it, grinding it very small, until it was as fine as dust: and I cast the dust thereof into the brook that descended out of the mount.";
yng[21] = "and your sin, which ye have made -- the calf -- I have taken, and I burn it with fire, and beat it, grinding well till that it [is] small as dust, and I cast its dust unto the brook which is going down out of the mount.";
dby[21] = "And I took your sin, the calf which ye had made, and burned it with fire, and crushed it, and ground it very small, until it became fine dust; and I cast the dust thereof into the brook that flowed down from the mountain.";
web[21] = "And I took your sin, the calf which ye had made, and burnt it with fire, and stamped it, [and] ground [it] very small, [even] until it was as small as dust: and I cast the dust of it into the brook that descended from the mount.";
hnv[21] = "I took your sin, the calf which you had made, and burnt it with fire, and stamped it, grinding it very small, until it was as fine as dust: and I cast the dust of it into the brook that descended out of the mountain.";

kjv[22] = "And at Taberah, and at Massah, and at Kibrothhattaavah, ye provoked the LORD to wrath.";
rsv[22] = "&quot;At Tab\'erah also, and at Massah, and at Kib\'roth-hatta\'avah, you provoked the LORD to wrath.";
asv[22] = "And at Taberah, and at Massah, and at Kibroth-hattaavah, ye provoked Jehovah to wrath.";
yng[22] = "`And in Taberah, and in Massah, and in Kibroth-Hattaavah, ye have been making Jehovah wroth:";
dby[22] = "And at Taberah, and at Massah, and at Kibroth-hattaavah, ye provoked Jehovah to wrath.";
web[22] = "And at Taberah, and at Massah, and Kibroth-hattaavah, ye provoked the LORD to wrath.";
hnv[22] = "At Tav`erah, and at Massah, and at Kivrot-Hatta\'avah, you provoked the LORD to wrath.";
vul[22] = "in Incendio quoque et in Temptatione et in sepulchris Concupiscentiae provocastis Dominum";
kjv[23] = "Likewise when the LORD sent you from Kadeshbarnea, saying, Go up and possess the land which I have given you; then ye rebelled against the commandment of the LORD your God, and ye believed him not, nor hearkened to his voice.";
rsv[23] = "And when the LORD sent you from Ka\'desh-bar\'nea, saying, \'Go up and take possession of the land which I have given you,\' then you rebelled against the commandment of the LORD your God, and did not believe him or obey his voice.";
asv[23] = "And when Jehovah sent you from Kadesh-barnea, saying, Go up and possess the land which I have given you; then ye rebelled against the commandment of Jehovah your God, and ye believed him not, nor hearkened to his voice.";
yng[23] = "and in Jehovah\'s sending you from Kadesh-Barnea, saying, Go up, and possess the land which I have given to you, then ye provoke the mouth of Jehovah your God, and have not given credence to Him, nor hearkened to His voice;";
dby[23] = "And when Jehovah sent you from Kadesh-barnea, saying, Go up and take possession of the land which I have given you, ye rebelled against the word of Jehovah your God, and ye believed him not, nor hearkened to his voice.";
web[23] = "Likewise when the LORD sent you from Kadesh-barnea, saying, Go up and possess the land which I have given you; then ye rebelled against the commandment of the LORD your God, and ye believed him not, nor hearkened to his voice.";

vul[23] = "et quando misit vos de Cadesbarne dicens ascendite et possidete terram quam dedi vobis et contempsistis imperium Domini Dei vestri et non credidistis ei neque vocem eius audire voluistis";
kjv[24] = "Ye have been rebellious against the LORD from the day that I knew you.";
rsv[24] = "You have been rebellious against the LORD from the day that I knew you.";
asv[24] = "Ye have been rebellious against Jehovah from the day that I knew you.";

hnv[24] = "You have been rebellious against the LORD from the day that I knew you.";

asv[25] = "So I fell down before Jehovah the forty days and forty nights that I fell down, because Jehovah had said he would destroy you.";
yng[25] = "`And I throw myself before Jehovah, the forty days and the forty nights, as I had thrown myself, for Jehovah hath said -- to destroy you;";
dby[25] = "So I fell down before Jehovah the forty days and forty nights, as I fell down; for Jehovah had said he would destroy you.";
web[25] = "Thus I fell down before the LORD forty days and forty nights, as I fell down [at the first]; because the LORD had said he would destroy you.";
hnv[25] = "So I fell down before the LORD the forty days and forty nights that I fell down, because the LORD had said he would destroy you.";

kjv[26] = "I prayed therefore unto the LORD, and said, O Lord GOD, destroy not thy people and thine inheritance, which thou hast redeemed through thy greatness, which thou hast brought forth out of Egypt with a mighty hand.";

asv[26] = "And I prayed unto Jehovah, and said, O Lord Jehovah, destroy not thy people and thine inheritance, that thou hast redeemed through thy greatness, that thou hast brought forth out of Egypt with a mighty hand.";
yng[26] = "and I pray unto Jehovah, and say, Lord Jehovah, destroy not Thy people, and Thine inheritance, whom Thou hast ransomed in Thy greatness; whom Thou hast brought out of Egypt with a strong hand;";
dby[26] = "I prayed therefore to Jehovah, and said, Lord Jehovah, destroy not thy people and thine inheritance, which thou hast redeemed through thy greatness, which thou hast brought forth out of Egypt with a powerful hand.";
web[26] = "I prayed therefore to the LORD, and said, O Lord GOD, destroy not thy people and thy inheritance, which thou hast redeemed through thy greatness, which thou hast brought forth out of Egypt with a mighty hand.";
hnv[26] = "I prayed to the LORD, and said, Lord GOD, don\'t destroy your people and your inheritance, that you have redeemed through your greatness, that you have brought forth out of Mitzrayim with a mighty hand.";
vul[26] = "et orans dixi Domine Deus ne disperdas populum tuum et hereditatem tuam quam redemisti in magnitudine tua quos eduxisti de Aegypto in manu forti";
kjv[27] = "Remember thy servants, Abraham, Isaac, and Jacob; look not unto the stubbornness of this people, nor to their wickedness, nor to their sin:";

asv[27] = "Remember thy servants, Abraham, Isaac, and Jacob; look not unto the stubbornness of this people, nor to their wickedness, nor to their sin,";
yng[27] = "be mindful of Thy servants, of Abraham, of Isaac, and of Jacob, turn not unto the stiffness of this people, and unto its wickedness, and unto its sin;";
dby[27] = "Remember thy servants Abraham, Isaac, and Jacob; look not at the stubbornness of this people, nor at their wickedness, nor at their sin;";
web[27] = "Remember thy servants, Abraham, Isaac, and Jacob; look not to the stubbornness of this people, nor to their wickedness, nor to their sin:";
hnv[27] = "Remember your servants, Avraham, Yitzchak, and Ya`akov; don\'t look to the stubbornness of this people, nor to their wickedness, nor to their sin,";

asv[28] = "lest the land whence thou broughtest us out say, Because Jehovah was not able to bring them into the land which he promised unto them, and because he hated them, he hath brought them out to slay them in the wilderness.";
yng[28] = "lest the land say from which Thou hast brought us out, Because of Jehovah\'s want of ability to bring them in unto the land of which He hath spoken to them, and because of His hating them, He brought them out to put them to death in the wilderness;";
dby[28] = "lest the land whence thou broughtest us out say, Because Jehovah was not able to bring them into the land which he had promised them, and because he hated them, he hath brought them out to kill them in the wilderness.";
web[28] = "Lest the land from which thou hast brought us should say, Because the LORD was not able to bring them into the land which he promised them, and because he hated them, he hath brought them out to slay them in the wilderness.";

asv[29] = "Yet they are thy people and thine inheritance, which thou broughtest out by thy great power and by thine outstretched arm.";
yng[29] = "and they [are] Thy people, and Thine inheritance, whom Thou hast brought out by Thy great power, and by Thy stretched-out arm!";
dby[29] = "They are indeed thy people and thine inheritance, which thou broughtest out with thy great power and with thy stretched-out arm.";
web[29] = "Yet they [are] thy people and thy inheritance which thou hast brought out by thy mighty power and by thy out-stretched arm.";
hnv[29] = "Yet they are your people and your inheritance, which you brought out by your great power and by your outstretched arm.";
