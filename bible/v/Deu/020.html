csb[1] = "&quot;When you go out to war against your enemies and see horses, chariots, and an army larger than yours, do not be afraid of them, for the LORD your God, who brought you out of the land of Egypt, is with you.";
csb[2] = "&quot;When you are about to engage in battle, the priest is to come forward and address the army.";
csb[3] = "&quot;He is to say to them: \'Listen, Israel: Today you are about to engage in battle with your enemies. Do not be cowardly. Do not be afraid, alarmed, or terrified because of them.";
csb[4] = "&quot;For the LORD your God is the one who goes with you to fight for you against your enemies to give you victory.\'";
csb[5] = "&quot;The officers are to address the army, \'Has any man built a new house and not dedicated it? Let him leave and return home. Otherwise, he may die in battle and another man dedicate it.";
csb[6] = "&quot;Has any man planted a vineyard and not begun to enjoy its fruit? Let him leave and return home. Otherwise he may die in battle and another man enjoy its fruit.";
csb[7] = "&quot;Has any man become engaged to a woman and not married her? Let him leave and return home. Otherwise he may die in battle and another man marry her.\'";
csb[8] = "&quot;The officers will continue to address the army and say, \'Is there any man who is afraid or cowardly? Let him leave and return home, so that his brothers won\'t lose heart as he did.\'";
csb[9] = "&quot;When the officers have finished addressing the army, they will appoint military commanders to lead it.";
csb[10] = "&quot;When you approach a city to fight against it, make an offer of peace.";
csb[11] = "&quot;If it accepts your offer of peace and opens its gates to you, all the people found in it will become forced laborers for you and serve you.";
csb[12] = "&quot;However, if it does not make peace with you but wages war against you, lay siege to it.";
csb[13] = "&quot;When the LORD your God hands it over to you, strike down all its males with the sword.";
csb[14] = "&quot;But you may take the women, dependents, animals, and whatever else is in the city -- all its spoil -- as plunder. You may enjoy the spoil of your enemies that the LORD your God has given you.";
csb[15] = "&quot;This is how you are to treat all the cities that are far away from you and are not among the cities of these nations.";
csb[16] = "&quot;However, you must not let any living thing survive among the cities of these people the LORD your God is giving you as an inheritance.";
csb[17] = "&quot;You must completely destroy them -- the Hethite, Amorite, Canaanite, Perizzite, Hivite, and Jebusite -- as the LORD your God has commanded you,";
csb[18] = "&quot;so that they won\'t teach you to do all the detestable acts they do for their gods, and you sin against the LORD your God.";
csb[19] = "&quot;When you lay siege to a city for a long time, fighting against it in order to capture it, do not destroy its trees by putting an ax to them, because you can get food from them. Do not cut them down. Are trees of the field human, to come under siege by you?";
csb[20] = "&quot;But you may destroy the trees that you know do not produce food. You may cut them down to build siege works against the city that is waging war against you, until it falls.";

kjv[19] = "When thou shalt besiege a city a long time, in making war against it to take it, thou shalt not destroy the trees thereof by forcing an axe against them: for thou mayest eat of them, and thou shalt not cut them down (for the tree of the field [is] man\'s [life]) to employ [them] in the siege:";
rsv[19] = "&quot;When you besiege a city for a long time, making war against it in order to take it, you shall not destroy its trees by wielding an axe against them; for you may eat of them, but you shall not cut them down. Are the trees in the field men that they should be besieged by you?";
asv[19] = "When thou shalt besiege a city a long time, in making war against it to take it, thou shalt not destroy the trees thereof by wielding an axe against them; for thou mayest eat of them, and thou shalt not cut them down; for is the tree of the field man, that it should be besieged of thee?";
yng[19] = "`When thou layest siege unto a city many days, to fight against it, to capture it, thou dost not destroy its trees to force an axe against them, for of them thou dost eat, and them thou dost not cut down -- for man\'s [is] the tree of the field -- to go in at thy presence in the siege.";
dby[19] = "When thou shalt besiege a city many days, in making war against it to take it, thou shalt not destroy the trees thereof by lifting up an axe against them; for thou canst eat of them; and thou shalt not cut them down, for is the tree of the field a man that it should be besieged?";
web[19] = "When thou shalt besiege a city a long time in making war against it to take it, thou shalt not destroy the trees of it by forcing an ax against them; for thou mayest eat of them: and thou shalt not cut them down (for the tree of the field [is] man\'s [life]) to employ [them] in the siege:";
hnv[19] = "When you shall besiege a city a long time, in making war against it to take it, you shall not destroy the trees of it by wielding an axe against them; for you may eat of them, and you shall not cut them down; for is the tree of the field man, that it should be besieged of you?";
vul[19] = "quando obsederis civitatem multo tempore et munitionibus circumdederis ut expugnes eam non succides arbores de quibus vesci potest nec securibus per circuitum debes vastare regionem quoniam lignum est et non homo nec potest bellantium contra te augere numerum";
kjv[20] = "Only the trees which thou knowest that they [be] not trees for meat, thou shalt destroy and cut them down; and thou shalt build bulwarks against the city that maketh war with thee, until it be subdued.";
rsv[20] = "Only the trees which you know are not trees for food you may destroy and cut down that you may build siegeworks against the city that makes war with you, until it falls.";
asv[20] = "Only the trees of which thou knowest that they are not trees for food, thou shalt destroy and cut them down; and thou shalt build bulwarks against the city that maketh war with thee, until it fall.";
yng[20] = "Only, the tree, which thou knowest that it [is] not a fruit-tree, it thou dost destroy, and hast cut down, and hast built a bulwark against the city which is making with thee war till thou hast subdued it.";
dby[20] = "Only the trees which thou knowest are not trees for meat, thou mayest destroy and cut them down, and build bulwarks against the city that maketh war with thee, until it fall.";
web[20] = "Only the trees which thou knowest that they [are] not trees for food, thou shalt destroy and cut them down; and thou shalt build bulwarks against the city that maketh war with thee, until it shall be subdued.";
hnv[20] = " Only the trees of which you know that they are not trees for food, you shall destroy and cut them down; and you shall build bulwarks against the city that makes war with you, until it fall.";
vul[20] = "si qua autem ligna non sunt pomifera sed agrestia et in ceteros apta usus succide et extrue machinas donec capias civitatem quae contra te dimicat";
