csb[1] = "&quot;When the LORD your God annihilates the nations whose land he is giving you, so that you drive them out and live in their cities and houses,";
csb[2] = "&quot;you are to set apart three cities for yourselves within the land the LORD your God is giving you to possess.";
csb[3] = "&quot;You are to determine the distances and divide the land the LORD your God is granting you as an inheritance into three regions, so that anyone who commits manslaughter can flee to these cities.";
csb[4] = "&quot;Here is the law concerning a case of someone who kills a person and flees there to save his life, having killed his neighbor accidentally without previously hating him:";
csb[5] = "&quot;If, for example, he goes into the forest with his neighbor to cut timber, and his hand swings the ax to chop down a tree, but the blade flies off the handle and strikes his neighbor so that he dies, that person may flee to one of these cities and live.";
csb[6] = "&quot;Otherwise, the avenger of blood in the heat of his anger might pursue the one who committed manslaughter, overtake him because the distance is great, and strike him dead. Yet he did not deserve to die, since he did not previously hate his neighbor.";
csb[7] = "&quot;This is why I am commanding you to set apart three cities for yourselves.";
csb[8] = "&quot;If the LORD your God enlarges your territory as he swore to your fathers, and gives you all the land he promised to give them --";
csb[9] = "&quot;provided you keep every one of these commands I am giving you today and follow them, loving the LORD your God and walking in his ways at all times -- you are to add three more cities to these three.";
csb[10] = "&quot;In this way, innocent blood will not be shed, and you will not become guilty of bloodshed in the land the LORD your God is giving you as an inheritance.";
csb[11] = "&quot;But if someone hates his neighbor, lies in ambush for him, attacks him, and strikes him fatally, and flees to one of these cities,";
csb[12] = "&quot;the elders of his city are to send for him, take him from there, and hand him over to the avenger of blood and he will die.";
csb[13] = "&quot;Do not look on him with pity but purge from Israel the guilt of shedding innocent blood, and you will prosper.";
csb[14] = "&quot;Do not move your neighbor\'s boundary marker, established at the start in the inheritance you will receive in the land the LORD your God is giving you to possess.";
csb[15] = "&quot;One witness cannot establish any iniquity or sin against a person, whatever that person has done. A fact must be established by the testimony of two or three witnesses.";
csb[16] = "&quot;If a malicious witness testifies against someone accusing him of a crime,";
csb[17] = "&quot;the two people in the dispute are to stand in the presence of the LORD before the priests and judges in authority at that time.";
csb[18] = "&quot;The judges are to make a careful investigation, and if the witness turns out to be a liar who has falsely accused his brother,";
csb[19] = "&quot;you must do to him as he intended to do to his brother. You must purge the evil from you.";
csb[20] = "&quot;Then everyone else will hear and be afraid, and they will never again do anything evil like this among you.";
csb[21] = "&quot;Do not show pity: life for life, eye for eye, tooth for tooth, hand for hand, and foot for foot.";
