csb[1] = "&quot;Therefore, love the LORD your God and always keep his mandate and his statutes, ordinances, and commands.";
csb[2] = "&quot;Understand today that it is not your children who experienced or saw the discipline of the LORD your God: His greatness, strong hand, and outstretched arm;";
csb[3] = "&quot;his signs and the works he did in Egypt to Pharaoh king of Egypt and all his land;";
csb[4] = "&quot;what he did to Egypt\'s army, its horses and chariots, when he made the water of the Red Sea flow over them as they pursued you, and he destroyed them completely;";
csb[5] = "&quot;what he did to you in the wilderness until you reached this place;";
csb[6] = "&quot;and what he did to Dathan and Abiram, the sons of Eliab the Reubenite, when in the middle of the whole Israelite camp the earth opened its mouth and swallowed them, their households, their tents, and every living thing with them.";
csb[7] = "&quot;Your own eyes have seen every great work the LORD has done.";
csb[8] = "&quot;Keep every command I am giving you today, so that you may have the strength to cross into and possess the land you are to inherit,";
csb[9] = "&quot;and so that you may live long in the land the LORD swore to your fathers to give them and their descendants, a land flowing with milk and honey.";
csb[10] = "&quot;For the land you are entering to possess is not like the land of Egypt, from which you have come, where you sowed your seed and irrigated by hand as in a vegetable garden.";
csb[11] = "&quot;But the land you are entering to possess is a land of mountains and valleys, watered by rain from the sky.";
csb[12] = "&quot;It is a land the LORD your God cares for. He is always watching over it from the beginning to the end of the year.";
csb[13] = "&quot;If you carefully obey my commands I am giving you today, to love the LORD your God and worship him with all your heart and all your soul,";
csb[14] = "&quot;I will provide rain for your land in the proper time, the autumn and spring rains, and you will harvest your grain, new wine, and fresh oil.";
csb[15] = "&quot;I will provide grass in your fields for your livestock. You will eat and be satisfied.";
csb[16] = "&quot;Be careful that you are not enticed to turn aside, serve, and bow in worship to other gods.";
csb[17] = "&quot;Then the LORD\'s anger will burn against you. He will shut the sky, and there will be no rain; the land will not yield its produce, and you will perish quickly from the good land the LORD is giving you.";
csb[18] = "&quot;Imprint these words of mine on your hearts and minds, bind them as a sign on your hands, and let them be a symbol on your foreheads.";
csb[19] = "&quot;Teach them to your children, talking about them when you sit in your house and when you walk along the road, when you lie down and when you get up.";
csb[20] = "&quot;Write them on the doorposts of your house and on your city gates,";
csb[21] = "&quot;so that as long as the heavens are above the earth, your days and those of your children may be many in the land the LORD swore to give your fathers.";
csb[22] = "&quot;For if you carefully observe every one of these commands I am giving you to follow -- to love the LORD your God, walk in all his ways, and remain faithful to him --";
csb[23] = "&quot;the LORD will drive out all these nations before you, and you will drive out nations greater and stronger than you are.";
csb[24] = "&quot;Every place the sole of your foot treads will be yours. Your territory will extend from the wilderness to Lebanon and from the Euphrates River to the Mediterranean Sea.";
csb[25] = "&quot;No one will be able to stand against you; the LORD your God will put fear and dread of you in all the land where you set foot, as he has promised you.";
csb[26] = "&quot;Look, today I set before you a blessing and a curse:";
csb[27] = "&quot;there will be a blessing, if you obey the commands of the LORD your God I am giving you today,";
csb[28] = "&quot;and a curse, if you do not obey the commands of the LORD your God and you turn aside from the path I command you today by following other gods you have not known.";
csb[29] = "&quot;When the LORD your God brings you into the land you are entering to possess, you are to proclaim the blessing at Mount Gerizim and the curse at Mount Ebal.";
csb[30] = "&quot;Aren\'t these mountains across the Jordan, beyond the western road in the land of the Canaanites, who live in the Arabah, opposite Gilgal, near the oaks of Moreh?";
csb[31] = "&quot;For you are about to cross the Jordan to enter and take possession of the land the LORD your God is giving you. When you possess it and settle in it,";
csb[32] = "&quot;be careful to follow all the statutes and ordinances I set before you today.";

dby[18] = "And ye shall lay up these my words in your heart and in your soul, and bind them for a sign upon your hand, and they shall be for frontlets between your eyes.";
web[18] = "Therefore shall ye lay up these my words in your heart and in your soul, and bind them for a sign upon your hand, that they may be as frontlets between your eyes.";
hnv[18] = "Therefore shall you lay up these my words in your heart and in your soul; and you shall bind them for a sign on your hand, and they shall be for symbols between your eyes.";
vul[18] = "ponite haec verba mea in cordibus et in animis vestris et suspendite ea pro signo in manibus et inter vestros oculos conlocate";
kjv[19] = "And ye shall teach them your children, speaking of them when thou sittest in thine house, and when thou walkest by the way, when thou liest down, and when thou risest up.";
rsv[19] = "And you shall teach them to your children, talking of them when you are sitting in your house, and when you are walking by the way, and when you lie down, and when you rise.";
asv[19] = "And ye shall teach them your children, talking of them, when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up.";
yng[19] = "and ye have taught them to your sons, by speaking of them in thy sitting in thy house, and in thy going in the way, and in thy lying down, and in thy rising up,";
dby[19] = "And ye shall teach them unto your children, speaking of them when thou sittest in thy house, and when thou goest on the way, and when thou liest down, and when thou risest up;";
web[19] = "And ye shall teach them to your children, speaking of them when thou sittest in thy house, and when thou walkest by the way, when thou liest down, and when thou risest up.";
hnv[19] = "You shall teach them your children, talking of them, when you sit in your house, and when you walk by the way, and when you lie down, and when you rise up.";
vul[19] = "docete filios vestros ut illa meditentur quando sederis in domo tua et ambulaveris in via et accubueris atque surrexeris";
kjv[20] = "And thou shalt write them upon the door posts of thine house, and upon thy gates:";
rsv[20] = "And you shall write them upon the doorposts of your house and upon your gates,";
asv[20] = "And thou shalt write them upon the door-posts of thy house, and upon thy gates;";
yng[20] = "and hast written them on the side-posts of thy house, and on thy gates,";
dby[20] = "and write them upon the posts of thy house, and upon thy gates;";
web[20] = "And thou shalt write them upon the door posts of thy house, and upon thy gates:";
hnv[20] = "You shall write them on the door-posts of your house, and on your gates;";
vul[20] = "scribes ea super postes et ianuas domus tuae";
kjv[21] = "That your days may be multiplied, and the days of your children, in the land which the LORD sware unto your fathers to give them, as the days of heaven upon the earth.";
rsv[21] = "that your days and the days of your children may be multiplied in the land which the LORD swore to your fathers to give them, as long as the heavens are above the earth.";
asv[21] = "that your days may be multiplied, and the days of your children, in the land which Jehovah sware unto your fathers to give them, as the days of the heavens above the earth.";
yng[21] = "so that your days are multiplied, and the days of your sons, on the ground which Jehovah hath sworn to your fathers to give to them, as the days of the heavens on the earth.";
dby[21] = "that your days may be multiplied, and the days of your children, in the land which Jehovah swore unto your fathers to give them, as the days of the heavens [which are] above the earth.";
web[21] = "That your days may be multiplied, and the days of your children, in the land which the LORD swore to your fathers to give to them, as the days of heaven upon the earth.";
hnv[21] = "that your days may be multiplied, and the days of your children, in the land which the LORD swore to your fathers to give them, as the days of the heavens above the eretz.";
vul[21] = "ut multiplicentur dies tui et filiorum tuorum in terra quam iuravit Dominus patribus tuis ut daret eis quamdiu caelum inminet terrae";
kjv[22] = "For if ye shall diligently keep all these commandments which I command you, to do them, to love the LORD your God, to walk in all his ways, and to cleave unto him;";
rsv[22] = "For if you will be careful to do all this commandment which I command you to do, loving the LORD your God, walking in all his ways, and cleaving to him,";
asv[22] = "For if ye shall diligently keep all this commandment which I command you, to do it, to love Jehovah your God, to walk in all his ways, and to cleave unto him;";
yng[22] = "`For, if ye diligently keep all this command which I am commanding you -- to do it, to love Jehovah your God, to walk in all His ways, and to cleave to Him,";
dby[22] = "For if ye diligently keep all this commandment which I command you [this day] to do it, to love Jehovah your God, to walk in all his ways, and to cleave unto him,";
web[22] = "For if ye shall diligently keep all these commandments which I command you, to do them, to love the LORD your God, to walk in all his ways, and to cleave to him;";
hnv[22] = "For if you shall diligently keep all this mitzvah which I command you, to do it, to love the LORD your God, to walk in all his ways, and to cleave to him;";
vul[22] = "si enim custodieritis mandata quae ego praecipio vobis et feceritis ea ut diligatis Dominum Deum vestrum et ambuletis in omnibus viis eius adherentes ei";
kjv[23] = "Then will the LORD drive out all these nations from before you, and ye shall possess greater nations and mightier than yourselves.";
rsv[23] = "then the LORD will drive out all these nations before you, and you will dispossess nations greater and mightier than yourselves.";
asv[23] = "then will Jehovah drive out all these nations from before you, and ye shall dispossess nations greater and mightier than yourselves.";
yng[23] = "then hath Jehovah dispossessed all these nations from before you, and ye have possessed nations, greater and mightier than you;";
dby[23] = "then will Jehovah dispossess all these nations from before you, and ye shall take possession of nations greater and mightier than yourselves.";
web[23] = "Then will the LORD drive out all these nations from before you, and ye shall possess greater nations and mightier than yourselves.";
hnv[23] = "then will the LORD drive out all these nations from before you, and you shall dispossess nations greater and mightier than yourselves.";
vul[23] = "disperdet Dominus omnes gentes istas ante faciem vestram et possidebitis eas quae maiores et fortiores vobis sunt";
kjv[24] = "Every place whereon the soles of your feet shall tread shall be yours: from the wilderness and Lebanon, from the river, the river Euphrates, even unto the uttermost sea shall your coast be.";
rsv[24] = "Every place on which the sole of your foot treads shall be yours; your territory shall be from the wilderness and Lebanon and from the River, the river Euphra\'tes, to the western sea.";
asv[24] = "Every place whereon the sole of your foot shall tread shall be yours: from the wilderness, and Lebanon, from the river, the river Euphrates, even unto the hinder sea shall be your border.";
yng[24] = "every place on which the sole of your foot treadeth is yours; from the wilderness, and Lebanon, from the river, the river Phrat, even unto the farther sea is your border;";
dby[24] = "Every place whereon the sole of your foot shall tread shall be yours; from the wilderness and Lebanon, from the river, the river Euphrates, even unto the hinder sea shall your border be.";
web[24] = "Every place on which the soles of your feet shall tread shall be yours: from the wilderness, and Lebanon, from the river, the river Euphrates, even to the uttermost sea shall your limit be.";
hnv[24] = "Every place whereon the sole of your foot shall tread shall be yours: from the wilderness, and Levanon, from the river, the river Perat, even to the hinder sea shall be your border.";
vul[24] = "omnis locus quem calcaverit pes vester vester erit a deserto et Libano a flumine magno Eufraten usque ad mare occidentale erunt termini vestri";
kjv[25] = "There shall no man be able to stand before you: [for] the LORD your God shall lay the fear of you and the dread of you upon all the land that ye shall tread upon, as he hath said unto you.";
rsv[25] = "No man shall be able to stand against you; the LORD your God will lay the fear of you and the dread of you upon all the land that you shall tread, as he promised you.";
asv[25] = "There shall no man be able to stand before you: Jehovah your God shall lay the fear of you and the dread of you upon all the land that ye shall tread upon, as he hath spoken unto you.";
yng[25] = "no man doth station himself in your presence; your dread and your fear doth Jehovah your God put on the face of all the land on which ye tread, as He hath spoken to you.";
dby[25] = "No man shall be able to stand before you: the fear of you and the dread of you will Jehovah your God lay upon all the land that ye shall tread upon, as he hath said unto you.";
web[25] = "There shall no man be able to stand before you: [for] the LORD your God shall lay the fear of you, and the dread of you upon all the land that ye shall tread upon, as he hath said to you.";
hnv[25] = "There shall no man be able to stand before you: the LORD your God shall lay the fear of you and the dread of you on all the land that you shall tread on, as he has spoken to you.";
vul[25] = "nullus stabit contra vos terrorem vestrum et formidinem dabit Dominus Deus vester super omnem terram quam calcaturi estis sicut locutus est vobis";
kjv[26] = "Behold, I set before you this day a blessing and a curse;";
rsv[26] = "&quot;Behold, I set before you this day a blessing and a curse:";
asv[26] = "Behold, I set before you this day a blessing and a curse:";
yng[26] = "`See, I am setting before you to-day a blessing and a reviling:";
dby[26] = "See, I set before you this day a blessing and a curse:";
web[26] = "Behold, I set before you this day a blessing and a curse:";
hnv[26] = "Behold, I set before you this day a blessing and a curse:";
vul[26] = "en propono in conspectu vestro hodie benedictionem et maledictionem";
kjv[27] = "A blessing, if ye obey the commandments of the LORD your God, which I command you this day:";
rsv[27] = "the blessing, if you obey the commandments of the LORD your God, which I command you this day,";
asv[27] = "the blessing, if ye shall hearken unto the commandments of Jehovah your God, which I command you this day;";
yng[27] = "the blessing, when ye hearken unto the commands of Jehovah your God, which I am commanding you to-day;";
dby[27] = "a blessing, if ye obey the commandments of Jehovah your God, which I command you this day;";
web[27] = "A blessing, if ye obey the commandments of the LORD your God which I command you this day;";
hnv[27] = "the blessing, if you shall listen to the mitzvot of the LORD your God, which I command you this day;";
vul[27] = "benedictionem si oboedieritis mandatis Domini Dei vestri quae ego praecipio vobis";
kjv[28] = "And a curse, if ye will not obey the commandments of the LORD your God, but turn aside out of the way which I command you this day, to go after other gods, which ye have not known.";
rsv[28] = "and the curse, if you do not obey the commandments of the LORD your God, but turn aside from the way which I command you this day, to go after other gods which you have not known.";
asv[28] = "and the curse, if ye shall not hearken unto the commandments of Jehovah your God, but turn aside out of the way which I command you this day, to go after other gods, which ye have not known.";
yng[28] = "and the reviling, if ye do not hearken unto the commands of Jehovah your God, and have turned aside out of the way which I am commanding you to-day, to go after other gods which ye have not known.";
dby[28] = "and a curse, if ye will not obey the commandments of Jehovah your God, but turn aside out of the way which I command you this day, to go after other gods which ye have not known.";
web[28] = "And a curse, if ye will not obey the commandments of the LORD your God, but turn aside from the way which I command you this day, to go after other gods which ye have not known.";
hnv[28] = "and the curse, if you shall not listen to the mitzvot of the LORD your God, but turn aside out of the way which I command you this day, to go after other gods, which you have not known.";

kjv[29] = "And it shall come to pass, when the LORD thy God hath brought thee in unto the land whither thou goest to possess it, that thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal.";
rsv[29] = "And when the LORD your God brings you into the land which you are entering to take possession of it, you shall set the blessing on Mount Ger\'izim and the curse on Mount Ebal.";
asv[29] = "And it shall come to pass, when Jehovah thy God shall bring thee into the land whither thou goest to possess it, that thou shalt set the blessing upon mount Gerizim, and the curse upon mount Ebal.";
yng[29] = "`And it hath been, when Jehovah thy God doth bring thee in unto the land whither thou art going in to possess it, that thou hast given the blessing on mount Gerizim, and the reviling on mount Ebal;";
dby[29] = "And it shall come to pass, when Jehovah thy God hath brought thee into the land whither thou enterest in to possess it, that thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal.";
web[29] = "And it shall come to pass when the LORD thy God hath brought thee in to the land whither thou goest to possess it, that thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal.";
hnv[29] = "It shall happen, when the LORD your God shall bring you into the land where you go to possess it, that you shall set the blessing on Mount Gerizim, and the curse on Mount `Eval.";

kjv[30] = "[Are] they not on the other side Jordan, by the way where the sun goeth down, in the land of the Canaanites, which dwell in the champaign over against Gilgal, beside the plains of Moreh?";
rsv[30] = "Are they not beyond the Jordan, west of the road, toward the going down of the sun, in the land of the Canaanites who live in the Arabah, over against Gilgal, beside the oak of Moreh?";
asv[30] = "Are they not beyond the Jordan, behind the way of the going down of the sun, in the land of the Canaanites that dwell in the Arabah, over against Gilgal, beside the oaks of Moreh?";
yng[30] = "are they not beyond the Jordan, behind the way of the going in of the sun, in the land of the Canaanite, who is dwelling in the plain over-against Gilgal, near the oaks of Moreh?";
dby[30] = "Are they not on the other side of the Jordan, beyond the way toward the going down of the sun, in the land of the Canaanites that dwell on the plain opposite to Gilgal, beside the oaks of Moreh?";
web[30] = "[Are] they not on the other side of Jordan, by the way where the sun goeth down in the land of the Canaanites, who dwell in the plain over against Gilgal, beside the plains of Moreh?";
hnv[30] = "Aren\'t they beyond the Yarden, behind the way of the going down of the sun, in the land of the Kana`anim who dwell in the `Aravah, over against Gilgal, beside the oaks of Moreh?";
vul[30] = "qui sunt trans Iordanem post viam quae vergit ad solis occubitum in terra Chananei qui habitat in campestribus contra Galgalam quae est iuxta vallem tendentem et intrantem procul";

yng[31] = "for ye are passing over the Jordan to go in to possess the land which Jehovah your God is giving to you; and ye have possessed it, and dwelt in it,";
dby[31] = "For ye pass over the Jordan to enter in to possess the land which Jehovah your God giveth you, and ye shall take possession of it, and dwell therein.";
web[31] = "For ye shall pass over Jordan to go in to possess the land which the LORD your God giveth you, and ye shall possess it, and dwell in it.";
hnv[31] = "For you are to pass over the Yarden to go in to possess the land which the LORD your God gives you, and you shall possess it, and dwell therein.";

yng[32] = "and observed to do all the statutes and the judgments which I am setting before you to day.";
dby[32] = "And ye shall take heed to do all the statutes and ordinances which I set before you this day.";
web[32] = "And ye shall observe to do all the statutes and judgments which I set before you this day.";
hnv[32] = "You shall observe to do all the statutes and the ordinances which I set before you this day.";
