csb[1] = "&quot;You are sons of the LORD your God; do not cut yourselves or make a bald spot on your head on behalf of the dead,";
csb[2] = "&quot;for you are a holy people belonging to the LORD your God. The LORD has chosen you to be his own possession out of all the peoples on the face of the earth.";
csb[3] = "&quot;You must not eat any detestable thing.";
csb[4] = "&quot;These are the animals you may eat: oxen, sheep, goats,";
csb[5] = "&quot;deer, gazelles, roe deer, wild goats, ibexes, antelopes, and mountain sheep.";
csb[6] = "&quot;You may eat any animal that has hooves divided in two and chews the cud.";
csb[7] = "&quot;But among the ones that chew the cud or have divided hooves, you are not to eat these: camels, hares, and hyraxes, though they chew the cud, they do not have hooves -- they are unclean for you;";
csb[8] = "&quot;and pigs, though they have hooves, they do not chew the cud -- they are unclean for you. Do not eat their meat or touch their carcasses.";
csb[9] = "&quot;You may eat everything from the water that has fins and scales,";
csb[10] = "&quot;but you may not eat anything that does not have fins and scales -- it is unclean for you.";
csb[11] = "&quot;You may eat every clean bird,";
csb[12] = "&quot;but these are the ones you may not eat: eagles, bearded vultures, black vultures,";
csb[13] = "&quot;the kites, any kind of falcon,";
csb[14] = "&quot;every kind of raven,";
csb[15] = "&quot;ostriches, short-eared owls, gulls, any kind of hawk,";
csb[16] = "&quot;little owls, long-eared owls, barn owls,";
csb[17] = "&quot;eagle owls, ospreys, cormorants,";
csb[18] = "&quot;storks, any kind of heron, hoopoes, and bats.";
csb[19] = "&quot;All winged insects are unclean for you; they may not be eaten.";
csb[20] = "&quot;But you may eat every clean flying creature.";
csb[21] = "&quot;You are not to eat any carcass; you may give it to a resident alien within your city gates, and he may eat it, or you may sell it to a foreigner. For you are a holy people belonging to the LORD your God. Do not boil a young goat in its mother\'s milk.";
csb[22] = "&quot;Each year you are to set aside a tenth of all the produce grown in your fields.";
csb[23] = "&quot;You are to eat a tenth of your grain, new wine, and fresh oil, and the firstborn of your herd and flock, in the presence of the LORD your God at the place where he chooses to have his name dwell, so that you will always learn to fear the LORD your God.";
csb[24] = "&quot;But if the distance is too great for you to carry it, since the place where the LORD your God chooses to put his name is too far away from you and since the LORD your God has blessed you,";
csb[25] = "&quot;then exchange it for silver, take the silver in your hand, and go to the place the LORD your God chooses.";
csb[26] = "&quot;You may spend the silver on anything you want: cattle, sheep, goats, wine, beer, or anything you desire. You are to feast there in the presence of the LORD your God and rejoice with your family.";
csb[27] = "&quot;Do not neglect the Levite within your city gates, since he has no portion or inheritance among you.";
csb[28] = "&quot;At the end of every three years, bring a tenth of all your produce for that year and store it within your city gates.";
csb[29] = "&quot;Then the Levite, who has no portion or inheritance among you, the resident alien, the fatherless, and the widow within your city gates may come, eat, and be satisfied. And the LORD your God will bless you in all the work of your hands that you do.";
kjv[1] = "Ye [are] the children of the LORD your God: ye shall not cut yourselves, nor make any baldness between your eyes for the dead.";
kjv[2] = "For thou [art] an holy people unto the LORD thy God, and the LORD hath chosen thee to be a peculiar people unto himself, above all the nations that [are] upon the earth.";
kjv[3] = "Thou shalt not eat any abominable thing.";
kjv[4] = "These [are] the beasts which ye shall eat: the ox, the sheep, and the goat,";
kjv[5] = "The hart, and the roebuck, and the fallow deer, and the wild goat, and the pygarg, and the wild ox, and the chamois.";
kjv[6] = "And every beast that parteth the hoof, and cleaveth the cleft into two claws, [and] cheweth the cud among the beasts, that ye shall eat.";
kjv[7] = "Nevertheless these ye shall not eat of them that chew the cud, or of them that divide the cloven hoof; [as] the camel, and the hare, and the coney: for they chew the cud, but divide not the hoof; [therefore] they [are] unclean unto you.";
kjv[8] = "And the swine, because it divideth the hoof, yet cheweth not the cud, it [is] unclean unto you: ye shall not eat of their flesh, nor touch their dead carcase.";
kjv[9] = "These ye shall eat of all that [are] in the waters: all that have fins and scales shall ye eat:";
kjv[10] = "And whatsoever hath not fins and scales ye may not eat; it [is] unclean unto you.";
kjv[11] = "[Of] all clean birds ye shall eat.";
kjv[12] = "But these [are they] of which ye shall not eat: the eagle, and the ossifrage, and the ospray,";
kjv[13] = "And the glede, and the kite, and the vulture after his kind,";
kjv[14] = "And every raven after his kind,";
kjv[15] = "And the owl, and the night hawk, and the cuckow, and the hawk after his kind,";
kjv[16] = "The little owl, and the great owl, and the swan,";
kjv[17] = "And the pelican, and the gier eagle, and the cormorant,";
kjv[18] = "And the stork, and the heron after her kind, and the lapwing, and the bat.";
kjv[19] = "And every creeping thing that flieth [is] unclean unto you: they shall not be eaten.";
kjv[20] = "[But of] all clean fowls ye may eat.";
kjv[21] = "Ye shall not eat [of] any thing that dieth of itself: thou shalt give it unto the stranger that [is] in thy gates, that he may eat it; or thou mayest sell it unto an alien: for thou [art] an holy people unto the LORD thy God. Thou shalt not seethe a kid in his mother\'s milk.";
kjv[22] = "Thou shalt truly tithe all the increase of thy seed, that the field bringeth forth year by year.";
kjv[23] = "And thou shalt eat before the LORD thy God, in the place which he shall choose to place his name there, the tithe of thy corn, of thy wine, and of thine oil, and the firstlings of thy herds and of thy flocks; that thou mayest learn to fear the LORD thy God always.";
kjv[24] = "And if the way be too long for thee, so that thou art not able to carry it; [or] if the place be too far from thee, which the LORD thy God shall choose to set his name there, when the LORD thy God hath blessed thee:";
kjv[25] = "Then shalt thou turn [it] into money, and bind up the money in thine hand, and shalt go unto the place which the LORD thy God shall choose:";
kjv[26] = "And thou shalt bestow that money for whatsoever thy soul lusteth after, for oxen, or for sheep, or for wine, or for strong drink, or for whatsoever thy soul desireth: and thou shalt eat there before the LORD thy God, and thou shalt rejoice, thou, and thine household,";
kjv[27] = "And the Levite that [is] within thy gates; thou shalt not forsake him; for he hath no part nor inheritance with thee.";
kjv[28] = "At the end of three years thou shalt bring forth all the tithe of thine increase the same year, and shalt lay [it] up within thy gates:";
kjv[29] = "And the Levite, (because he hath no part nor inheritance with thee,) and the stranger, and the fatherless, and the widow, which [are] within thy gates, shall come, and shall eat and be satisfied; that the LORD thy God may bless thee in all the work of thine hand which thou doest.";

asv[23] = "And thou shalt eat before Jehovah thy God, in the place which he shall choose, to cause his name to dwell there, the tithe of thy grain, of thy new wine, and of thine oil, and the firstlings of thy herd and of thy flock; that thou mayest learn to fear Jehovah thy God always.";
yng[23] = "and thou hast eaten before Jehovah thy God, in the place where He doth choose to cause His name to tabernacle, the tithe of thy corn, of thy new wine, and of thine oil, and the firstlings of thy herd, and of thy flock, so that thou dost learn to fear Jehovah thy God all the days.";
dby[23] = "And thou shalt eat before Jehovah thy God, in the place which he will choose to cause his name to dwell there, the tithe of thy corn, of thy new wine, and of thine oil, and the firstlings of thy herds and of thy flocks; that thou mayest learn to fear Jehovah thy God continually.";
web[23] = "And thou shalt eat before the LORD thy God, in the place which he shall choose to place his name there, the tithe of thy corn, of thy wine, and of thy oil, and the firstlings of thy herds and of thy flocks; that thou mayest learn to fear the LORD thy God always.";
hnv[23] = "You shall eat before the LORD your God, in the place which he shall choose, to cause his name to dwell there, the tithe of your grain, of your new wine, and of your oil, and the firstborn of your herd and of your flock; that you may learn to fear the LORD your God always.";
vul[23] = "et comedes in conspectu Domini Dei tui in loco quem elegerit ut in eo nomen illius invocetur decimam frumenti tui et vini et olei et primogenita de armentis et ovibus tuis ut discas timere Dominum Deum tuum omni tempore";
rsv[24] = "And if the way is too long for you, so that you are not able to bring the tithe, when the LORD your God blesses you, because the place is too far from you, which the LORD your God chooses, to set his name there,";
asv[24] = "And if the way be too long for thee, so that thou art not able to carry it, because the place is too far from thee, which Jehovah thy God shall choose, to set his name there, when Jehovah thy God shall bless thee;";
yng[24] = "`And when the way is too much for thee, that thou art not able to carry it -- when the place is too far off from thee which Jehovah thy God doth choose to put His name there, when Jehovah thy God doth bless thee; --";
dby[24] = "And if the way be too long for thee, so that thou art not able to carry it, because the place is too far from thee, which Jehovah thy God will choose to set his name there, when Jehovah thy God blesseth thee;";
web[24] = "And if the way is too long for thee, so that thou art not able to carry it; [or] if the place is too far from thee, which the LORD thy God shall choose to set his name there, when the LORD thy God hath blessed thee:";
hnv[24] = "If the way be too long for you, so that you are not able to carry it, because the place is too far from you, which the LORD your God shall choose, to set his name there, when the LORD your God shall bless you;";
vul[24] = "cum autem longior fuerit via et locus quem elegerit Dominus Deus tuus tibique benedixerit nec potueris ad eum haec cuncta portare";
rsv[25] = "then you shall turn it into money, and bind up the money in your hand, and go to the place which the LORD your God chooses,";
asv[25] = "then shalt thou turn it into money, and bind up the money in thy hand, and shalt go unto the place which Jehovah thy God shall choose:";
yng[25] = "then thou hast given [it] in money, and hast bound up the money in thy hand, and gone unto the place on which Jehovah thy God doth fix;";
dby[25] = "then shalt thou give it for money, and bind the money together in thy hand, and go to the place which Jehovah thy God will choose,";
web[25] = "Then shalt thou turn [it] into money, and bind up the money in thy hand, and shalt go to the place which the LORD thy God shall choose:";
hnv[25] = "then shall you turn it into money, and bind up the money in your hand, and shall go to the place which the LORD your God shall choose:";
vul[25] = "vendes omnia et in pretium rediges portabisque manu tua et proficisceris ad locum quem elegerit Dominus Deus tuus";
rsv[26] = "and spend the money for whatever you desire, oxen, or sheep, or wine or strong drink, whatever your appetite craves; and you shall eat there before the LORD your God and rejoice, you and your household.";
asv[26] = "and thou shalt bestow the money for whatsoever thy soul desireth, for oxen, or for sheep, or for wine, or for strong drink, or for whatsoever thy soul asketh of thee; and thou shalt eat there before Jehovah thy God, and thou shalt rejoice, thou and thy household.";
yng[26] = "and thou hast given the money for any thing which thy soul desireth, for oxen, and for sheep, and for wine, and for strong drink, and for any thing which thy soul asketh, and thou hast eaten there before Jehovah thy God, and thou hast rejoiced, thou and thy house.";
dby[26] = "and thou shalt give the money for whatever thy soul desireth, for oxen, or for sheep, or for wine, or for strong drink, or for whatever thy soul asketh of thee; and thou shalt eat there before Jehovah thy God, and thou shalt rejoice, thou, and thy house.";
web[26] = "And thou shalt bestow that money for whatever thy soul desireth, for oxen, or for sheep, or for wine, or for strong drink, or for whatever thy soul desireth: and thou shalt eat there before the LORD thy God, and thou shalt rejoice, thou, and thy household.";
hnv[26] = "and you shall bestow the money for whatever your soul desires, for oxen, or for sheep, or for wine, or for strong drink, or for whatever your soul asks of you; and you shall eat there before the LORD your God, and you shall rejoice, you and your household.";
vul[26] = "et emes ex eadem pecunia quicquid tibi placuerit sive ex armentis sive ex ovibus vinum quoque et siceram et omne quod desiderat anima tua et comedes coram Domino Deo tuo et epulaberis tu et domus tua";
rsv[27] = "And you shall not forsake the Levite who is within your towns, for he has no portion or inheritance with you.";
asv[27] = "And the Levite that is within thy gates, thou shalt not forsake him; for he hath no portion nor inheritance with thee.";
yng[27] = "As to the Levite who [is] within thy gates, thou dost not forsake him, for he hath no portion and inheritance with thee.";
dby[27] = "And thou shalt not forsake the Levite that is within thy gates; for he hath no portion nor inheritance with thee.";
web[27] = "And the Levite that [is] within thy gates, thou shalt not forsake him; for he hath no part nor inheritance with thee.";
hnv[27] = "The Levite who is within your gates, you shall not forsake him; for he has no portion nor inheritance with you.";
vul[27] = "et Levita qui intra portas tuas est cave ne derelinquas eum quia non habet aliam partem in possessione tua";
rsv[28] = "&quot;At the end of every three years you shall bring forth all the tithe of your produce in the same year, and lay it up within your towns;";
asv[28] = "At the end of every three years thou shalt bring forth all the tithe of thine increase in the same year, and shalt lay it up within thy gates:";
yng[28] = "`At the end of three years thou dost bring out all the tithe of thine increase in that year, and hast placed [it] within thy gates;";
dby[28] = "At the end of three years thou shalt bring forth all the tithe of thine increase the same year, and shalt lay it up within thy gates;";
web[28] = "At the end of three years thou shalt bring forth all the tithe of thy increase the same year, and shalt lay [it] up within thy gates:";
hnv[28] = "At the end of every three years you shall bring forth all the tithe of your increase in the same year, and shall lay it up within your gates:";
vul[28] = "anno tertio separabis aliam decimam ex omnibus quae nascuntur tibi eo tempore et repones intra ianuas tuas";
rsv[29] = "and the Levite, because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow, who are within your towns, shall come and eat and be filled; that the LORD your God may bless you in all the work of your hands that you do.";
asv[29] = "and the Levite, because he hath no portion nor inheritance with thee, and the sojourner, and the fatherless, and the widow, that are within thy gates, shall come, and shall eat and be satisfied; that Jehovah thy God may bless thee in all the work of thy hand which thou doest.";
yng[29] = "and come in hath the Levite (for he hath no part and inheritance with thee), and the sojourner, and the fatherless, and the widow, who [are] within thy gates, and they have eaten, and been satisfied, so that Jehovah thy God doth bless thee in all the work of thy hand which thou dost.";
dby[29] = "and the Levite -- for he hath no portion nor inheritance with thee -- and the stranger, and the fatherless, and the widow, that are within thy gates, shall come, and shall eat and be satisfied; that Jehovah thy God may bless thee in all the work of thy hand which thou doest.";
web[29] = "And the Levite, (because he hath no part nor inheritance with thee) and the stranger, and the fatherless, and the widow, who [are] within thy gates, shall come, and shall eat and be satisfied; that the LORD thy God may bless thee in all the work of thy hand which thou doest.";
hnv[29] = "and the Levite, because he has no portion nor inheritance with you, and the foreigner living among you, and the fatherless, and the widow, who are within your gates, shall come, and shall eat and be satisfied; that the LORD your God may bless you in all the work of your hand which you do.";
vul[29] = "venietque Levites qui aliam non habet partem nec possessionem tecum et peregrinus et pupillus ac vidua qui intra portas tuas sunt et comedent et saturabuntur ut benedicat tibi Dominus Deus tuus in cunctis operibus manuum tuarum quae feceris";
