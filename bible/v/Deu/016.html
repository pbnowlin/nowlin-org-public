csb[1] = "&quot;Set aside the month of Abib and observe the Passover to the LORD your God, because the LORD your God brought you out of Egypt by night in the month of Abib.";
csb[2] = "&quot;Sacrifice to the LORD your God a Passover animal from the herd or flock in the place where the LORD chooses to have his name dwell.";
csb[3] = "&quot;Do not eat leavened bread with it. For seven days you are to eat unleavened bread with it, the bread of hardship -- because you left the land of Egypt in a hurry -- so that you may remember for the rest of your life the day you left the land of Egypt.";
csb[4] = "&quot;No yeast is to be found anywhere in your territory for seven days, and none of the meat you sacrifice in the evening of the first day is to remain until morning.";
csb[5] = "&quot;You are not to sacrifice the Passover animal in any of the towns the LORD your God is giving you.";
csb[6] = "&quot;Sacrifice the Passover animal only at the place where the LORD your God chooses to have his name dwell. Do this in the evening as the sun sets at the same time of day you departed from Egypt.";
csb[7] = "&quot;You are to cook and eat it in the place the LORD your God chooses, and you are to return to your tents in the morning.";
csb[8] = "&quot;Eat unleavened bread for six days. On the seventh day there is to be a solemn assembly to the LORD your God; do not do any work.";
csb[9] = "&quot;You are to count seven weeks, counting the weeks from the time the sickle is first put to the standing grain.";
csb[10] = "&quot;You are to celebrate the Festival of Weeks to the LORD your God with a freewill offering that you give in proportion to how the LORD your God has blessed you.";
csb[11] = "&quot;Rejoice before the LORD your God in the place where he chooses to have his name dwell -- you, your son and daughter, your male and female slave, the Levite within your city gates, as well as the resident alien, the fatherless, and the widow among you.";
csb[12] = "&quot;Remember that you were slaves in Egypt; carefully follow these statutes.";
csb[13] = "&quot;You are to celebrate the Festival of Shelters for seven days when you have gathered in everything from your threshing floor and winepress.";
csb[14] = "&quot;Rejoice during your festival -- you, your son and daughter, your male and female slave, as well as the Levite, the resident alien, the fatherless, and the widow within your city gates.";
csb[15] = "&quot;You are to hold a seven-day festival for the LORD your God in the place he chooses, because the LORD your God will bless you in all your produce and in all the work of your hands, and you will have abundant joy.";
csb[16] = "&quot;All your males are to appear three times a year before the LORD your God in the place he chooses: at the Festival of Unleavened Bread, the Festival of Weeks, and the Festival of Shelters. No one is to appear before the LORD empty-handed.";
csb[17] = "&quot;Everyone must appear with a gift suited to his means, according to the blessing the LORD your God has given you.";
csb[18] = "&quot;Appoint judges and officials for your tribes in all your towns the LORD your God is giving you. They are to judge the people with righteous judgment.";
csb[19] = "&quot;Do not deny justice or show partiality to anyone. Do not accept a bribe, for it blinds the eyes of the wise and twists the words of the righteous.";
csb[20] = "&quot;Pursue justice and justice alone, so that you will live and possess the land the LORD your God is giving you.";
csb[21] = "&quot;Do not set up an Asherah of any kind of wood next to the altar you will build for the LORD your God,";
csb[22] = "&quot;and do not set up a sacred pillar; the LORD your God hates them.";

kjv[3] = "Thou shalt eat no leavened bread with it; seven days shalt thou eat unleavened bread therewith, [even] the bread of affliction; for thou camest forth out of the land of Egypt in haste: that thou mayest remember the day when thou camest forth out of the land of Egypt all the days of thy life.";

asv[3] = "Thou shalt eat no leavened bread with it; seven days shalt thou eat unleavened bread therewith, even the bread of affliction; for thou camest forth out of the land of Egypt in haste: that thou mayest remember the day when thou camest forth out of the land of Egypt all the days of thy life.";
yng[3] = "`Thou dost not eat with it any fermented thing, seven days thou dost eat with it unleavened things, bread of affliction; for in haste thou hast come out of the land of Egypt; so that thou dost remember the day of thy coming out of the land of Egypt all days of thy life;";
