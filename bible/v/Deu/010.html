csb[1] = "&quot;The LORD said to me at that time, \'Cut two stone tablets like the first ones and come to me on the mountain and make a wooden ark.";
csb[2] = "&quot;I will write on the tablets the words that were on the first tablets you broke, and you are to place them in the ark.\'";
csb[3] = "&quot;So I made an ark of acacia wood, cut two stone tablets like the first ones, and climbed the mountain with the two tablets in my hand.";
csb[4] = "&quot;Then on the day of the assembly, the LORD wrote on the tablets what had been written previously, the Ten Commandments that he had spoken to you on the mountain from the fire. The LORD gave them to me,";
csb[5] = "&quot;and I went back down the mountain and placed the tablets in the ark I had made. And they have remained there, as the LORD commanded me.&quot;";
csb[6] = "The Israelites traveled from Beeroth Bene-jaakan to Moserah. Aaron died and was buried there, and Eleazar his son became priest in his place.";
csb[7] = "They traveled from there to Gudgodah, and from Gudgodah to Jotbathah, a land with flowing streams.";
csb[8] = "&quot;At that time the LORD set apart the tribe of Levi to carry the ark of the LORD\'s covenant, to stand before the LORD to serve him, and to pronounce blessings in his name, as it is today.";
csb[9] = "&quot;For this reason, Levi does not have a portion or inheritance like his brothers; the LORD is his inheritance, as the LORD your God told him.";
csb[10] = "&quot;I stayed on the mountain forty days and forty nights like the first time. The LORD also listened to me on this occasion; he agreed not to annihilate you.";
csb[11] = "&quot;Then the LORD said to me, \'Get up. Continue your journey ahead of the people, so that they may enter and possess the land I swore to give their fathers.\'";
csb[12] = "&quot;And now, Israel, what does the LORD your God ask of you except to fear the LORD your God by walking in all his ways, to love him, and to worship the LORD your God with all your heart and all your soul?";
csb[13] = "&quot;Keep the LORD\'s commands and statutes I am giving you today, for your own good.";
csb[14] = "&quot;The heavens, indeed the highest heavens, belong to the LORD your God, as does the earth and everything in it.";
csb[15] = "&quot;Yet the LORD had his heart set on your fathers and loved them. He chose their descendants after them -- he chose you out of all the peoples, as it is today.";
csb[16] = "&quot;Therefore, circumcise your hearts and don\'t be stiff-necked any longer.";
csb[17] = "&quot;For the LORD your God is the God of gods and Lord of lords, the great, mighty, and awe-inspiring God, showing no partiality and taking no bribe.";
csb[18] = "&quot;He executes justice for the fatherless and the widow, and loves the resident alien, giving him food and clothing.";
csb[19] = "&quot;You are also to love the resident alien, since you were resident aliens in the land of Egypt.";
csb[20] = "&quot;You are to fear the LORD your God and worship him. Remain faithful to him and take oaths in his name.";
csb[21] = "&quot;He is your praise and he is your God, who has done for you these great and awe-inspiring works your eyes have seen.";
csb[22] = "&quot;Your fathers went down to Egypt, seventy people in all, and now the LORD your God has made you numerous, like the stars of the sky.";
