csb[1] = "Then Moses continued to speak these words to all Israel,";
csb[2] = "saying, &quot;I am now 120 years old; I can no longer act as your leader. The LORD has told me, \'You will not cross the Jordan.\'";
csb[3] = "&quot;The LORD your God is the one who will cross ahead of you. He will destroy these nations before you, and you will drive them out. Joshua is the one who will cross ahead of you, as the LORD has said.";
csb[4] = "&quot;The LORD will deal with them as he did Sihon and Og, the kings of the Amorites, and their land when he destroyed them.";
csb[5] = "&quot;The LORD will deliver them over to you, and you must do to them exactly as I have commanded you.";
csb[6] = "&quot;Be strong and courageous; don\'t be terrified or afraid of them. For the LORD your God is the one who will go with you; he will not leave you or abandon you.&quot;";
csb[7] = "Moses then summoned Joshua and said to him in the sight of all Israel, &quot;Be strong and courageous, for you will go with this people into the land the LORD swore to give to their fathers. You will enable them to take possession of it.";
csb[8] = "&quot;The LORD is the one who will go before you. He will be with you; he will not leave you or abandon you. Do not be afraid or discouraged.&quot;";
csb[9] = "Moses wrote down this law and gave it to the priests, the sons of Levi, who carried the ark of the LORD\'s covenant, and to all the elders of Israel.";
csb[10] = "Moses commanded them, &quot;At the end of every seven years, at the appointed time in the year of debt cancellation, during the Festival of Shelters,";
csb[11] = "&quot;when all Israel assembles in the presence of the LORD your God at the place he chooses, you are to read this law aloud before all Israel.";
csb[12] = "&quot;Gather the people -- men, women, dependents, and the resident aliens within your city gates -- so that they may listen and learn to fear the LORD your God and be careful to follow all the words of this law.";
csb[13] = "&quot;Then their children who do not know the law will listen and learn to fear the LORD your God as long as you live in the land you are crossing the Jordan to possess.&quot;";
csb[14] = "The LORD said to Moses, &quot;The time of your death is now approaching. Call Joshua and present yourselves at the tent of meeting so that I may commission him.&quot; When Moses and Joshua went and presented themselves at the tent of meeting,";
csb[15] = "the LORD appeared at the tent in a pillar of cloud, and the cloud stood at the entrance to the tent.";
csb[16] = "The LORD said to Moses, &quot;You are about to rest with your fathers, and these people will soon prostitute themselves with the foreign gods of the land they are entering. They will abandon me and break the covenant I have made with them.";
csb[17] = "&quot;My anger will burn against them on that day; I will abandon them and hide my face from them so that they will become easy prey. Many troubles and afflictions will come to them. On that day they will say, \'Haven\'t these troubles come to us because our God is no longer with us? \'";
csb[18] = "&quot;I will certainly hide my face on that day because of all the evil they have done by turning to other gods.";
csb[19] = "&quot;Therefore write down this song for yourselves and teach it to the Israelites; have them sing it, so that this song may be a witness for me against the Israelites.";
csb[20] = "&quot;When I bring them into the land I swore to give their fathers, a land flowing with milk and honey, they will eat their fill and prosper. They will turn to other gods and worship them, despising me and breaking my covenant.";
csb[21] = "&quot;And when many troubles and afflictions come to them, this song will testify against them, because their descendants will not have forgotten it. For I know what they are prone to do, even before I bring them into the land I swore to give them.&quot;";
csb[22] = "So Moses wrote down this song on that day and taught it to the Israelites.";
csb[23] = "The LORD commissioned Joshua son of Nun, &quot;Be strong and courageous, for you will bring the Israelites into the land I swore to them, and I will be with you.&quot;";
csb[24] = "When Moses had finished writing down on a scroll every single word of this law,";
csb[25] = "he commanded the Levites who carried the ark of the LORD\'s covenant,";
csb[26] = "&quot;Take this book of the law and place it beside the ark of the covenant of the LORD your God so that it may remain there as a witness against you.";
csb[27] = "&quot;For I know how rebellious and stiff-necked you are. If you are rebelling against the LORD now, while I am still alive, how much more will you rebel after I am dead!";
csb[28] = "&quot;Assemble all your tribal elders and officers before me so that I may speak these words directly to them and call heaven and earth as witnesses against them.";
csb[29] = "&quot;For I know that after my death you will become completely corrupt and turn from the path I have commanded you. Disaster will come to you in the future, because you will do what is evil in the LORD\'s sight, angering him with what your hands have made.&quot;";
csb[30] = "Then Moses recited aloud every single word of this song to the entire assembly of Israel:";

dby[14] = "And Jehovah said to Moses, Lo, the days are near for thee to die; call Joshua, and present yourselves at the tent of meeting, that I may give him a charge. And Moses and Joshua went and presented themselves at the tent of meeting.";

kjv[16] = "And the LORD said unto Moses, Behold, thou shalt sleep with thy fathers; and this people will rise up, and go a whoring after the gods of the strangers of the land, whither they go [to be] among them, and will forsake me, and break my covenant which I have made with them.";
rsv[16] = "And the LORD said to Moses, &quot;Behold, you are about to sleep with your fathers; then this people will rise and play the harlot after the strange gods of the land, where they go to be among them, and they will forsake me and break my covenant which I have made with them.";
asv[16] = "And Jehovah said unto Moses, Behold, thou shalt sleep with thy fathers; and this people will rise up, and play the harlot after the strange gods of the land, whither they go to be among them, and will forsake me, and break my covenant which I have made with them.";
yng[16] = "And Jehovah saith unto Moses, `Lo, thou art lying down with thy fathers, and this people hath risen, and gone a-whoring after the gods of the stranger of the land into the midst of which it hath entered, and forsaken Me, and broken My covenant which I made with it;";
dby[16] = "And Jehovah said to Moses, Behold, thou shalt sleep with thy fathers; and this people will rise up, and go a whoring after the strange gods of the land into which they enter, and will forsake me, and break my covenant which I have made with them.";
web[16] = "And the LORD said to Moses, Behold, thou shalt sleep with thy fathers, and this people will rise up, and commit idolatry with the gods of the strangers of the land, whither they go [to be] among them, and will forsake me, and break my covenant which I have made with them.";
hnv[16] = "The LORD said to Moshe, Behold, you shall sleep with your fathers; and this people will rise up, and play the prostitute after the strange gods of the land, where they go to be among them, and will forsake me, and break my covenant which I have made with them.";
vul[16] = "dixitque Dominus ad Mosen ecce tu dormies cum patribus tuis et populus iste consurgens fornicabitur post deos alienos in terra ad quam ingredietur et habitabit in ea ibi derelinquet me et irritum faciet foedus quod pepigi cum eo";
kjv[17] = "Then my anger shall be kindled against them in that day, and I will forsake them, and I will hide my face from them, and they shall be devoured, and many evils and troubles shall befall them; so that they will say in that day, Are not these evils come upon us, because our God [is] not among us?";
rsv[17] = "Then my anger will be kindled against them in that day, and I will forsake them and hide my face from them, and they will be devoured; and many evils and troubles will come upon them, so that they will say in that day, \'Have not these evils come upon us because our God is not among us?\'";
asv[17] = "Then my anger shall be kindled against them in that day, and I will forsake them, and I will hide my face from them, and they shall be devoured, and many evils and troubles shall come upon them; so that they will say in that day, Are not these evils come upon us because our God is not among us?";
yng[17] = "and Mine anger hath burned against it in that day, and I have forsaken them, and hidden My face from them, and it hath been for consumption, and many evils and distresses have found it, and it hath said in that day, Is it not because that my God is not in my midst -- these evils have found me?";
dby[17] = "And my anger shall be kindled against them in that day, and I will forsake them, and I will hide my face from them, and they shall be devoured, and many evils and troubles shall befall them, and they will say in that day, Have not these evils befallen me because my God is not in my midst?";
web[17] = "Then my anger shall be kindled against them in that day, and I will forsake them, and I will hide my face from them, and they shall be devoured, and many evils and troubles shall befall them, so that they will say in that day, Have not these evils come upon us, because our God [is] not among us?";
hnv[17] = "Then my anger shall be kindled against them in that day, and I will forsake them, and I will hide my face from them, and they shall be devoured, and many evils and troubles shall come on them; so that they will say in that day, Haven\'t these evils come on us because our God is not among us?";
vul[17] = "et irascetur furor meus contra eum in die illo et derelinquam eum et abscondam faciem meam ab eo et erit in devorationem invenient eum omnia mala et adflictiones ita ut dicat in illo die vere quia non est Deus mecum invenerunt me haec mala";
kjv[18] = "And I will surely hide my face in that day for all the evils which they shall have wrought, in that they are turned unto other gods.";
rsv[18] = "And I will surely hide my face in that day on account of all the evil which they have done, because they have turned to other gods.";
asv[18] = "And I will surely hide my face in that day for all the evil which they shall have wrought, in that they are turned unto other gods.";
yng[18] = "and I certainly hide My face in that day for all the evil which it hath done, for it hath turned unto other gods.";
dby[18] = "And I will entirely hide my face in that day for all the evils that they have wrought, because they turned unto other gods.";
web[18] = "And I will surely hide my face in that day for all the evils which they shall have wrought, in that they are turned to other gods.";
hnv[18] = "I will surely hide my face in that day for all the evil which they shall have worked, in that they are turned to other gods.";
vul[18] = "ego autem abscondam et celabo faciem meam in die illo propter omnia mala quae fecit quia secutus est deos alienos";
kjv[19] = "Now therefore write ye this song for you, and teach it the children of Israel: put it in their mouths, that this song may be a witness for me against the children of Israel.";
rsv[19] = "Now therefore write this song, and teach it to the people of Israel; put it in their mouths, that this song may be a witness for me against the people of Israel.";
asv[19] = "Now therefore write ye this song for you, and teach thou it the children of Israel: put it in their mouths, that this song may be a witness for me against the children of Israel.";
yng[19] = "`And now, write for you this song, and teach it the sons of Israel; put it in their mouths, so that this song is to Me for a witness against the sons of Israel,";
dby[19] = "And now, write ye this song, and teach it to the children of Israel; put it in their mouths, that this song may be a witness for me against the children of Israel.";
web[19] = "Now therefore write ye this song for you, and teach it to the children of Israel: put it in their mouths, that this song may be a witness for me against the children of Israel.";
hnv[19] = " Now therefore write you this song for you, and teach you it the children of Yisra\'el: put it in their mouths, that this song may be a witness for me against the children of Yisra\'el.";
vul[19] = "nunc itaque scribite vobis canticum istud et docete filios Israhel ut memoriter teneant et ore decantent et sit mihi carmen istud pro testimonio inter filios Israhel";
kjv[20] = "For when I shall have brought them into the land which I sware unto their fathers, that floweth with milk and honey; and they shall have eaten and filled themselves, and waxen fat; then will they turn unto other gods, and serve them, and provoke me, and break my covenant.";
rsv[20] = "For when I have brought them into the land flowing with milk and honey, which I swore to give to their fathers, and they have eaten and are full and grown fat, they will turn to other gods and serve them, and despise me and break my covenant.";
asv[20] = "For when I shall have brought them into the land which I sware unto their fathers, flowing with milk and honey, and they shall have eaten and filled themselves, and waxed fat; then will they turn unto other gods, and serve them, and despise me, and break my covenant.";
yng[20] = "and I bring them in unto the ground which I have sworn to their fathers -- flowing with milk and honey, and they have eaten, and been satisfied, and been fat, and have turned unto other gods, and they have served them, and despised Me, and broken My covenant.";
dby[20] = "For I shall bring them into the land which I swore unto their fathers, which floweth with milk and honey; and they will eat and fill themselves, and wax fat, and will turn unto other gods, and serve them, and despise me, and break my covenant.";
web[20] = "For when I shall have brought them into the land which I swore to their fathers, that floweth with milk and honey; and they shall have eaten and filled themselves, and waxed fat; then will they turn to other gods, and serve them, and provoke me, and break my covenant.";
hnv[20] = "For when I shall have brought them into the land which I swore to their fathers, flowing with milk and honey, and they shall have eaten and filled themselves, and grown fat; then will they turn to other gods, and serve them, and despise me, and break my covenant.";
vul[20] = "introducam enim eum in terram pro qua iuravi patribus eius lacte et melle manantem cumque comederint et saturati crassique fuerint avertentur ad deos alienos et servient eis et detrahent mihi et irritum facient pactum meum";
kjv[21] = "And it shall come to pass, when many evils and troubles are befallen them, that this song shall testify against them as a witness; for it shall not be forgotten out of the mouths of their seed: for I know their imagination which they go about, even now, before I have brought them into the land which I sware.";
rsv[21] = "And when many evils and troubles have come upon them, this song shall confront them as a witness (for it will live unforgotten in the mouths of their descendants); for I know the purposes which they are already forming, before I have brought them into the land that I swore to give.&quot;";
asv[21] = "And it shall come to pass, when many evils and troubles are come upon them, that this song shall testify before them as a witness; for it shall not be forgotten out of the mouths of their seed: for I know their imagination which they frame this day, before I have brought them into the land which I sware.";
yng[21] = "`And it hath been, when many evils and distresses do meet it, that this song hath testified to its face for a witness; for it is not forgotten out of the mouth of its seed, for I have known its imagining which it is doing to-day, before I bring them in unto the land of which I have sworn.\'";
dby[21] = "And it shall come to pass, when many evils and troubles have befallen them, that this song shall testify against them as a witness; for it shall not be forgotten out of the mouths of their seed; for I know their imagination which they are forming already this day, before I bring them into the land which I have sworn [unto them].";
web[21] = "And it shall come to pass, when many evils and troubles have befallen them, that this song shall testify against them as a witness: for it shall not be forgotten out of the mouths of their seed: for I know their imagination which they form, even now, before I have brought them into the land which I swore.";
hnv[21] = "It shall happen, when many evils and troubles are come on them, that this song shall testify before them as a witness; for it shall not be forgotten out of the mouths of their seed: for I know their imagination which they frame this day, before I have brought them into the land which I swore.";
vul[21] = "postquam invenerint eum mala multa et adflictiones respondebit ei canticum istud pro testimonio quod nulla delebit oblivio ex ore seminis tui scio enim cogitationes eius quae facturus sit hodie antequam introducam eum in terram quam ei pollicitus sum";
kjv[22] = "Moses therefore wrote this song the same day, and taught it the children of Israel.";
rsv[22] = "So Moses wrote this song the same day, and taught it to the people of Israel.";
asv[22] = "So Moses wrote this song the same day, and taught it the children of Israel.";
yng[22] = "And Moses writeth this song on that day, and doth teach it the sons of Israel,";
dby[22] = "And Moses wrote this song the same day, and taught it to the children of Israel.";
web[22] = "Moses therefore wrote this song the same day, and taught it to the children of Israel.";
hnv[22] = "So Moshe wrote this song the same day, and taught it the children of Yisra\'el.";
vul[22] = "scripsit ergo Moses canticum et docuit filios Israhel";
kjv[23] = "And he gave Joshua the son of Nun a charge, and said, Be strong and of a good courage: for thou shalt bring the children of Israel into the land which I sware unto them: and I will be with thee.";
rsv[23] = "And the LORD commissioned Joshua the son of Nun and said, &quot;Be strong and of good courage; for you shall bring the children of Israel into the land which I swore to give them: I will be with you.&quot;";
asv[23] = "And he gave Joshua the son of Nun a charge, and said, Be strong and of good courage; for thou shalt bring the children of Israel into the land which I sware unto them: and I will be with thee.";
yng[23] = "and He commandeth Joshua son of Nun, and saith, `Be strong and courageous, for thou dost bring in the sons of Israel unto the land which I have sworn to them, and I -- I am with thee.\'";
dby[23] = "And [Jehovah] commanded Joshua the son of Nun, and said, Be strong and courageous; for thou shalt bring the children of Israel into the land which I have sworn unto them; and I will be with thee.";
web[23] = "And he gave Joshua the son of Nun a charge, and said, Be strong and of a good courage: for thou shalt bring the children of Israel into the land which I swore to them: and I will be with thee.";
hnv[23] = "He gave Yehoshua the son of Nun a charge, and said, Be strong and of good courage; for you shall bring the children of Yisra\'el into the land which I swore to them: and I will be with you.";
vul[23] = "praecepitque Iosue filio Nun et ait confortare et esto robustus tu enim introduces filios Israhel in terram quam pollicitus sum et ego ero tecum";
kjv[24] = "And it came to pass, when Moses had made an end of writing the words of this law in a book, until they were finished,";
rsv[24] = "When Moses had finished writing the words of this law in a book, to the very end,";
asv[24] = "And it came to pass, when Moses had made an end of writing the words of this law in a book, until they were finished,";
yng[24] = "And it cometh to pass, when Moses finisheth to write the words of this law on a book till their completion,";
dby[24] = "And it came to pass, when Moses had ended writing the words of this law in a book, until their conclusion,";
web[24] = "And it came to pass, when Moses had made an end of writing the words of this law in a book, until they were finished,";
hnv[24] = "It happened, when Moshe had made an end of writing the words of this law in a book, until they were finished,";
vul[24] = "postquam ergo scripsit Moses verba legis huius in volumine atque conplevit";
kjv[25] = "That Moses commanded the Levites, which bare the ark of the covenant of the LORD, saying,";
rsv[25] = "Moses commanded the Levites who carried the ark of the covenant of the LORD,";
asv[25] = "that Moses commanded the Levites, that bare the ark of the covenant of Jehovah, saying,";
yng[25] = "that Moses commandeth the Levites bearing the ark of the covenant of Jehovah, saying,";
dby[25] = "that Moses commanded the Levites, who bore the ark of the covenant of Jehovah, saying,";
web[25] = "That Moses commanded the Levites who bore the ark of the covenant of the LORD, saying,";
hnv[25] = "that Moshe commanded the Levites, who bore the ark of the covenant of the LORD, saying,";
vul[25] = "praecepit Levitis qui portabant arcam foederis Domini dicens";
kjv[26] = "Take this book of the law, and put it in the side of the ark of the covenant of the LORD your God, that it may be there for a witness against thee.";
rsv[26] = "&quot;Take this book of the law, and put it by the side of the ark of the covenant of the LORD your God, that it may be there for a witness against you.";
asv[26] = "Take this book of the law, and put it by the side of the ark of the covenant of Jehovah your God, that it may be there for a witness against thee.";
yng[26] = "`Take this Book of the Law, and thou hast set it on the side of the ark of the covenant of Jehovah your God, and it hath been there against thee for a witness;";
dby[26] = "Take this book of the law, and put it at the side of the ark of the covenant of Jehovah your God, that it may be there for a witness against thee;";
web[26] = "Take this book of the law, and put it in the side of the ark of the covenant of the LORD your God, that it may be there for a witness against thee.";
hnv[26] = "Take this book of the law, and put it by the side of the ark of the covenant of the LORD your God, that it may be there for a witness against you.";
vul[26] = "tollite librum istum et ponite eum in latere arcae foederis Domini Dei vestri ut sit ibi contra te in testimonio";
kjv[27] = "For I know thy rebellion, and thy stiff neck: behold, while I am yet alive with you this day, ye have been rebellious against the LORD; and how much more after my death?";
rsv[27] = "For I know how rebellious and stubborn you are; behold, while I am yet alive with you, today you have been rebellious against the LORD; how much more after my death!";
asv[27] = "For I know thy rebellion, and thy stiff neck: behold, while I am yet alive with you this day, ye have been rebellious against Jehovah; and how much more after my death?";
yng[27] = "for I -- I have known thy rebellion, and thy stiff neck; lo, in my being yet alive with you to-day, rebellious ye have been with Jehovah, and also surely after my death.";
dby[27] = "for I know thy rebellion, and thy stiff neck. Lo, while I am yet alive with you this day, ye have been rebellious against Jehovah; and how much more after my death!";
web[27] = "For I know thy rebellion, and thy stiff neck: behold, while I am yet alive with you this day, ye have been rebellious against the LORD; and how much more after my death?";
hnv[27] = "For I know your rebellion, and your stiff neck: behold, while I am yet alive with you this day, you have been rebellious against the LORD; and how much more after my death?";
vul[27] = "ego enim scio contentionem tuam et cervicem tuam durissimam adhuc vivente me et ingrediente vobiscum semper contentiose egistis contra Dominum quanto magis cum mortuus fuero";
kjv[28] = "Gather unto me all the elders of your tribes, and your officers, that I may speak these words in their ears, and call heaven and earth to record against them.";
rsv[28] = "Assemble to me all the elders of your tribes, and your officers, that I may speak these words in their ears and call heaven and earth to witness against them.";
asv[28] = "Assemble unto me all the elders of your tribes, and your officers, that I may speak these words in their ears, and call heaven and earth to witness against them.";
yng[28] = "`Assemble unto me all the elders of your tribes, and your authorities, and I speak in their ears these words, and cause to testify against them the heavens and the earth,";
dby[28] = "Gather to me all the elders of your tribes, and your officers, that I may speak these words in their ears, and take heaven and earth to witness against them.";
web[28] = "Assemble to me all the elders of your tribes, and your officers, that I may speak these words in their ears, and call heaven and earth to record against them.";
hnv[28] = "Assemble to me all the Zakenim of your tribes, and your officers, that I may speak these words in their ears, and call heaven and eretz to witness against them.";
vul[28] = "congregate ad me omnes maiores natu per tribus vestras atque doctores et loquar audientibus eis sermones istos et invocabo contra eos caelum et terram";
kjv[29] = "For I know that after my death ye will utterly corrupt [yourselves], and turn aside from the way which I have commanded you; and evil will befall you in the latter days; because ye will do evil in the sight of the LORD, to provoke him to anger through the work of your hands.";
rsv[29] = "For I know that after my death you will surely act corruptly, and turn aside from the way which I have commanded you; and in the days to come evil will befall you, because you will do what is evil in the sight of the LORD, provoking him to anger through the work of your hands.&quot;";
asv[29] = "For I know that after my death ye will utterly corrupt yourselves, and turn aside from the way which I have commanded you; and evil will befall you in the latter days; because ye will do that which is evil in the sight of Jehovah, to provoke him to anger through the work of your hands.";
yng[29] = "for I have known that after my death ye do very corruptly, and have turned aside out of the way which I commanded you, and evil hath met you in the latter end of the days, because ye do the evil thing in the eyes of Jehovah, to make Him angry with the work of your hands.\'";
dby[29] = "For I know that after my death ye will utterly corrupt yourselves, and will turn aside from the way which I have commanded you; and mischief will befall you at the end of days; because ye do evil in the sight of Jehovah, to provoke him to anger through the work of your hands.";
web[29] = "For I know that after my death ye will utterly corrupt [yourselves], and turn aside from the way which I have commanded you; and evil will befall you in the latter days; because ye will do evil in the sight of the LORD, to provoke him to anger through the work of your hands.";
hnv[29] = "For I know that after my death you will utterly corrupt yourselves, and turn aside from the way which I have commanded you; and evil will happen to you in the latter days; because you will do that which is evil in the sight of the LORD, to provoke him to anger through the work of your hands.";
vul[29] = "novi enim quod post mortem meam inique agetis et declinabitis cito de via quam praecepi vobis et occurrent vobis mala in extremo tempore quando feceritis malum in conspectu Domini ut inritetis eum per opera manuum vestrarum";
kjv[30] = "And Moses spake in the ears of all the congregation of Israel the words of this song, until they were ended.";
rsv[30] = "Then Moses spoke the words of this song until they were finished, in the ears of all the assembly of Israel:";
asv[30] = "And Moses spake in the ears of all the assembly of Israel the words of this song, until they were finished.";
yng[30] = "And Moses speaketh in the ears of all the assembly of Israel the words of this song, till their completion: --";
dby[30] = "And Moses spoke in the ears of the whole congregation of Israel the words of this song, until their conclusion.";
web[30] = "And Moses spoke in the ears of all the congregation of Israel the words of this song until they were ended.";
hnv[30] = "Moshe spoke in the ears of all the assembly of Yisra\'el the words of this song, until they were finished.";
vul[30] = "locutus est ergo Moses audiente universo coetu Israhel verba carminis huius et ad finem usque conplevit";
