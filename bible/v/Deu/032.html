csb[1] = "Pay attention, heavens, and I will speak; listen, earth, to the words from my mouth.";
csb[2] = "Let my teaching fall like rain and my word settle like dew, like gentle rain on new grass and showers on tender plants.";
csb[3] = "For I will proclaim the LORD\'s name. Declare the greatness of our God!";
csb[4] = "The Rock -- his work is perfect; all his ways are just. A faithful God, without bias, he is righteous and true.";
csb[5] = "His people have acted corruptly toward him; this is their defect -- they are not his children but a devious and crooked generation.";
csb[6] = "Is this how you repay the LORD, you foolish and senseless people? Isn\'t he your Father and Creator? Didn\'t he make you and sustain you?";
csb[7] = "Remember the days of old; consider the years of past generations. Ask your father, and he will tell you, your elders, and they will teach you.";
csb[8] = "When the Most High gave the nations their inheritance and divided the human race, he set the boundaries of the peoples according to the number of the people of Israel.";
csb[9] = "But the LORD\'s portion is his people, Jacob, his own inheritance.";
csb[10] = "He found him in a desolate land, in a barren, howling wilderness; he surrounded him, cared for him, and protected him as the pupil of his eye.";
csb[11] = "He watches over his nest like an eagle and hovers over his young; he spreads his wings, catches him, and carries him on his feathers.";
csb[12] = "The LORD alone led him, with no help from a foreign god.";
csb[13] = "He made him ride on the heights of the land and eat the produce of the field. He nourished him with honey from the rock and oil from flinty rock,";
csb[14] = "curds from the herd and milk from the flock, with the fat of lambs, rams from Bashan, and goats, with the choicest grains of wheat; you drank wine from the finest grapes.";
csb[15] = "Then Jeshurun became fat and rebelled -- you became fat, bloated, and gorged. He abandoned the God who made him and scorned the Rock of his salvation.";
csb[16] = "They provoked his jealousy with different gods; they enraged him with detestable practices.";
csb[17] = "They sacrificed to demons, not God, to gods they had not known, new gods that had just arrived, which your fathers did not fear.";
csb[18] = "You ignored the Rock who gave you birth; you forgot the God who gave birth to you.";
csb[19] = "When the LORD saw this, he despised them, angered by his sons and daughters.";
csb[20] = "He said: &quot;I will hide my face from them; I will see what will become of them, for they are a perverse generation -- unfaithful children.";
csb[21] = "&quot;They have provoked my jealousy with what is not a god; they have enraged me with their worthless idols. So I will provoke their jealousy with what is not a people; I will enrage them with a foolish nation.";
csb[22] = "&quot;For fire has been kindled because of my anger and burns to the depths of Sheol; it devours the land and its produce, and scorches the foundations of the mountains.";
csb[23] = "&quot;I will pile disasters on them; I will use up my arrows against them.";
csb[24] = "&quot;They will be weak from hunger, ravaged by pestilence and bitter plague; I will unleash on them wild beasts with fangs, as well as venomous snakes that slither in the dust.";
csb[25] = "&quot;Outside, the sword will take their children, and inside, there will be terror; the young man and the young woman will be killed, the infant and the gray-haired man.";
csb[26] = "&quot;I would have said: I will cut them to pieces and blot out the memory of them from mankind,";
csb[27] = "&quot;if I had not feared provocation from the enemy, or feared that these foes might misunderstand and say: \'Our own hand has prevailed; it wasn\'t the LORD who did all this.\' &quot;";
csb[28] = "Israel is a nation lacking sense with no understanding at all.";
csb[29] = "If only they were wise, they would comprehend this; they would understand their fate.";
csb[30] = "How could one pursue a thousand, or two put ten thousand to flight, unless their Rock had sold them, unless the LORD had given them up?";
csb[31] = "But their &quot;rock&quot; is not like our Rock, as even our enemies concede.";
csb[32] = "For their vine is from the vine of Sodom and from the fields of Gomorrah. Their grapes are poisonous; their clusters are bitter.";
csb[33] = "Their wine is serpents\' venom, the deadly poison of cobras.";
csb[34] = "&quot;Is it not stored up with me, sealed up in my vaults?";
csb[35] = "&quot;Vengeance belongs to me; I will repay. In time their foot will slip, for their day of disaster is near, and their doom is coming quickly.&quot;";
csb[36] = "The LORD will indeed vindicate his people and have compassion on his servants when he sees that their strength is gone and no one is left -- slave or free.";
csb[37] = "He will say: &quot;Where are their gods, the \'rock\' they found refuge in?";
csb[38] = "&quot;Who ate the fat of their sacrifices and drank the wine of their drink offerings? Let them rise up and help you; let it be a shelter for you.";
csb[39] = "&quot;See now that I alone am he; there is no God but me. I bring death and I give life; I wound and I heal. No one can rescue anyone from my power.";
csb[40] = "&quot;I raise my hand to heaven and declare: As surely as I live forever,";
csb[41] = "&quot;when I sharpen my flashing sword, and my hand takes hold of judgment, I will take vengeance on my adversaries and repay those who hate me.";
csb[42] = "&quot;I will make my arrows drunk with blood while my sword devours flesh -- the blood of the slain and the captives, the heads of the enemy leaders.&quot;";
csb[43] = "Rejoice, you nations, concerning his people, for he will avenge the blood of his servants. He will take vengeance on his adversaries; he will purify his land and his people.";
csb[44] = "Moses came with Joshua son of Nun and recited all the words of this song in the presence of the people.";
csb[45] = "After Moses finished reciting all these words to all Israel,";
csb[46] = "he said to them, &quot;Take to heart all these words I am giving as a warning to you today, so that you may command your children to follow all the words of this law carefully.";
csb[47] = "&quot;For they are not meaningless words to you but they are your life, and by them you will live long in the land you are crossing the Jordan to possess.&quot;";
csb[48] = "On that same day the LORD spoke to Moses,";
csb[49] = "&quot;Go up Mount Nebo in the Abarim range in the land of Moab, across from Jericho, and view the land of Canaan I am giving the Israelites as a possession.";
csb[50] = "&quot;Then you will die on the mountain that you go up, and you will be gathered to your people, just as your brother Aaron died on Mount Hor and was gathered to his people.";
csb[51] = "&quot;For both of you broke faith with me among the Israelites at the Waters of Meribath-kadesh in the Wilderness of Zin by failing to treat me as holy in their presence.";
csb[52] = "&quot;Although from a distance you will view the land that I am giving the Israelites, you will not go there.&quot;";
kjv[1] = "Give ear, O ye heavens, and I will speak; and hear, O earth, the words of my mouth.";
kjv[2] = "My doctrine shall drop as the rain, my speech shall distil as the dew, as the small rain upon the tender herb, and as the showers upon the grass:";
kjv[3] = "Because I will publish the name of the LORD: ascribe ye greatness unto our God.";
kjv[4] = "[He is] the Rock, his work [is] perfect: for all his ways [are] judgment: a God of truth and without iniquity, just and right [is] he.";
kjv[5] = "They have corrupted themselves, their spot [is] not [the spot] of his children: [they are] a perverse and crooked generation.";
kjv[6] = "Do ye thus requite the LORD, O foolish people and unwise? [is] not he thy father [that] hath bought thee? hath he not made thee, and established thee?";
kjv[7] = "Remember the days of old, consider the years of many generations: ask thy father, and he will shew thee; thy elders, and they will tell thee.";
kjv[8] = "When the most High divided to the nations their inheritance, when he separated the sons of Adam, he set the bounds of the people according to the number of the children of Israel.";
kjv[9] = "For the LORD\'S portion [is] his people; Jacob [is] the lot of his inheritance.";
kjv[10] = "He found him in a desert land, and in the waste howling wilderness; he led him about, he instructed him, he kept him as the apple of his eye.";
kjv[11] = "As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings, taketh them, beareth them on her wings:";
kjv[12] = "[So] the LORD alone did lead him, and [there was] no strange god with him.";
kjv[13] = "He made him ride on the high places of the earth, that he might eat the increase of the fields; and he made him to suck honey out of the rock, and oil out of the flinty rock;";
kjv[14] = "Butter of kine, and milk of sheep, with fat of lambs, and rams of the breed of Bashan, and goats, with the fat of kidneys of wheat; and thou didst drink the pure blood of the grape.";
kjv[15] = "But Jeshurun waxed fat, and kicked: thou art waxen fat, thou art grown thick, thou art covered [with fatness]; then he forsook God [which] made him, and lightly esteemed the Rock of his salvation.";
kjv[16] = "They provoked him to jealousy with strange [gods], with abominations provoked they him to anger.";
kjv[17] = "They sacrificed unto devils, not to God; to gods whom they knew not, to new [gods that] came newly up, whom your fathers feared not.";
kjv[18] = "Of the Rock [that] begat thee thou art unmindful, and hast forgotten God that formed thee.";
kjv[19] = "And when the LORD saw [it], he abhorred [them], because of the provoking of his sons, and of his daughters.";
kjv[20] = "And he said, I will hide my face from them, I will see what their end [shall be]: for they [are] a very froward generation, children in whom [is] no faith.";
kjv[21] = "They have moved me to jealousy with [that which is] not God; they have provoked me to anger with their vanities: and I will move them to jealousy with [those which are] not a people; I will provoke them to anger with a foolish nation.";
kjv[22] = "For a fire is kindled in mine anger, and shall burn unto the lowest hell, and shall consume the earth with her increase, and set on fire the foundations of the mountains.";
kjv[23] = "I will heap mischiefs upon them; I will spend mine arrows upon them.";
kjv[24] = "[They shall be] burnt with hunger, and devoured with burning heat, and with bitter destruction: I will also send the teeth of beasts upon them, with the poison of serpents of the dust.";
kjv[25] = "The sword without, and terror within, shall destroy both the young man and the virgin, the suckling [also] with the man of gray hairs.";
kjv[26] = "I said, I would scatter them into corners, I would make the remembrance of them to cease from among men:";
kjv[27] = "Were it not that I feared the wrath of the enemy, lest their adversaries should behave themselves strangely, [and] lest they should say, Our hand [is] high, and the LORD hath not done all this.";
kjv[28] = "For they [are] a nation void of counsel, neither [is there any] understanding in them.";
kjv[29] = "O that they were wise, [that] they understood this, [that] they would consider their latter end!";
kjv[30] = "How should one chase a thousand, and two put ten thousand to flight, except their Rock had sold them, and the LORD had shut them up?";
kjv[31] = "For their rock [is] not as our Rock, even our enemies themselves [being] judges.";
kjv[32] = "For their vine [is] of the vine of Sodom, and of the fields of Gomorrah: their grapes [are] grapes of gall, their clusters [are] bitter:";
kjv[33] = "Their wine [is] the poison of dragons, and the cruel venom of asps.";
kjv[34] = "[Is] not this laid up in store with me, [and] sealed up among my treasures?";
kjv[35] = "To me [belongeth] vengeance, and recompence; their foot shall slide in [due] time: for the day of their calamity [is] at hand, and the things that shall come upon them make haste.";
kjv[36] = "For the LORD shall judge his people, and repent himself for his servants, when he seeth that [their] power is gone, and [there is] none shut up, or left.";
kjv[37] = "And he shall say, Where [are] their gods, [their] rock in whom they trusted,";
kjv[38] = "Which did eat the fat of their sacrifices, [and] drank the wine of their drink offerings? let them rise up and help you, [and] be your protection.";
kjv[39] = "See now that I, [even] I, [am] he, and [there is] no god with me: I kill, and I make alive; I wound, and I heal: neither [is there any] that can deliver out of my hand.";
kjv[40] = "For I lift up my hand to heaven, and say, I live for ever.";
kjv[41] = "If I whet my glittering sword, and mine hand take hold on judgment; I will render vengeance to mine enemies, and will reward them that hate me.";
kjv[42] = "I will make mine arrows drunk with blood, and my sword shall devour flesh; [and that] with the blood of the slain and of the captives, from the beginning of revenges upon the enemy.";
kjv[43] = "Rejoice, O ye nations, [with] his people: for he will avenge the blood of his servants, and will render vengeance to his adversaries, and will be merciful unto his land, [and] to his people.";
kjv[44] = "And Moses came and spake all the words of this song in the ears of the people, he, and Hoshea the son of Nun.";
kjv[45] = "And Moses made an end of speaking all these words to all Israel:";
kjv[46] = "And he said unto them, Set your hearts unto all the words which I testify among you this day, which ye shall command your children to observe to do, all the words of this law.";
kjv[47] = "For it [is] not a vain thing for you; because it [is] your life: and through this thing ye shall prolong [your] days in the land, whither ye go over Jordan to possess it.";
kjv[48] = "And the LORD spake unto Moses that selfsame day, saying,";
kjv[49] = "Get thee up into this mountain Abarim, [unto] mount Nebo, which [is] in the land of Moab, that [is] over against Jericho; and behold the land of Canaan, which I give unto the children of Israel for a possession:";
kjv[50] = "And die in the mount whither thou goest up, and be gathered unto thy people; as Aaron thy brother died in mount Hor, and was gathered unto his people:";
kjv[51] = "Because ye trespassed against me among the children of Israel at the waters of Meribah-Kadesh, in the wilderness of Zin; because ye sanctified me not in the midst of the children of Israel.";
kjv[52] = "Yet thou shalt see the land before [thee]; but thou shalt not go thither unto the land which I give the children of Israel.";

vul[13] = "constituit eum super excelsam terram ut comederet fructus agrorum ut sugeret mel de petra oleumque de saxo durissimo";
rsv[14] = "Curds from the herd, and milk from the flock, with fat of lambs and rams, herds of Bashan and goats, with the finest of the wheat--and of the blood of the grape you drank wine.";
asv[14] = "Butter of the herd, and milk of the flock, With fat of lambs, And rams of the breed of Bashan, and goats, With the finest of the wheat; And of the blood of the grape thou drankest wine. ";
yng[14] = "Butter of the herd, and milk of the flock, With fat of lambs, and rams, sons of Bashan, And he-goats, with fat of kidneys of wheat; And of the blood of the grape thou dost drink wine!";
dby[14] = "Cream of kine, and milk of sheep, With the fat of lambs, And rams of the breed of Bashan, and he-goats, With the fat of kidneys of wheat; And thou didst drink pure wine, the blood of the grape.";
web[14] = "Butter of cows, and milk of sheep, with fat of lambs, and rams of the breed of Bashan, and goats, with the fat of kidneys of wheat; and thou didst drink the pure blood of the grape.";
hnv[14] = "Butter of the herd, and milk of the flock, With fat of lambs, Rams of the breed of Bashan, and goats, With the finest of the wheat; Of the blood of the grape you drank wine.";
vul[14] = "butyrum de armento et lac de ovibus cum adipe agnorum et arietum filiorum Basan et hircos cum medulla tritici et sanguinem uvae biberet meracissimum";
rsv[15] = "&quot;But Jesh\'urun waxed fat, and kicked; you waxed fat, you grew thick, you became sleek; then he forsook God who made him, and scoffed at the Rock of his salvation.";
asv[15] = "But Jeshurun waxed fat, and kicked: Thou art waxed fat, thou art grown thick, thou art become sleek; Then he forsook God who made him, And lightly esteemed the Rock of his salvation. ";
yng[15] = "And Jeshurun waxeth fat, and doth kick: Thou hast been fat -- thou hast been thick, Thou hast been covered. And he leaveth God who made him, And dishonoureth the Rock of his salvation.";
dby[15] = "Then Jeshurun grew fat, and kicked -- Thou art waxen fat, Thou art grown thick, And thou art covered with fatness; -- He gave up God who made him, And lightly esteemed the Rock of his salvation.";
web[15] = "But Jeshurun waxed fat, and kicked: thou hast waxed fat, thou art grown thick, thou art covered [with fatness]; then he forsook God [who] made him, and lightly esteemed the Rock of his salvation.";
hnv[15] = "But Yeshurun grew fat, and kicked: You have grown fat, you are grown thick, you are become sleek; Then he forsook God who made him, Lightly esteemed the Rock of his salvation.";
vul[15] = "incrassatus est dilectus et recalcitravit incrassatus inpinguatus dilatatus dereliquit Deum factorem suum et recessit a Deo salutari suo";
rsv[16] = "They stirred him to jealousy with strange gods; with abominable practices they provoked him to anger.";
asv[16] = "They moved him to jealousy with strange [gods]; With abominations provoked they him to anger. ";
yng[16] = "They make Him zealous with strangers, With abominations they make Him angry.";
dby[16] = "They moved him to jealousy with strange gods, With abominations did they provoke him to anger.";
web[16] = "They provoked him to jealousy with strange [gods], with abominations they provoked him to anger.";
hnv[16] = "They moved him to jealousy with strange [gods]; With abominations provoked they him to anger.";
vul[16] = "provocaverunt eum in diis alienis et in abominationibus ad iracundiam concitaverunt";
rsv[17] = "They sacrificed to demons which were no gods, to gods they had never known, to new gods that had come in of late, whom your fathers had never dreaded.";
asv[17] = "They sacrificed unto demons, [which were] no God, To gods that they knew not, To new [gods] that came up of late, Which your fathers dreaded not. ";
yng[17] = "They sacrifice to demons -- no god! Gods they have not known -- New ones -- from the vicinity they came; Not feared them have your fathers!";
dby[17] = "They sacrificed unto demons who are not God; To gods whom they knew not, To new ones, who came newly up, Whom your fathers revered not.";
web[17] = "They sacrificed to devils, not to God; to gods which they knew not, to new [gods that] came newly up, whom your fathers feared not.";
hnv[17] = "They sacrificed to demons, [which were] no God, To gods that they didn\'t know, To new [gods] that came up of late, Which your fathers didn\'t dread.";
vul[17] = "immolaverunt daemonibus et non Deo diis quos ignorabant novi recentesque venerunt quos non coluerunt patres eorum";
rsv[18] = "You were unmindful of the Rock that begot you, and you forgot the God who gave you birth.";
asv[18] = "Of the Rock that begat thee thou art unmindful, And hast forgotten God that gave thee birth. ";
yng[18] = "The Rock that begat thee thou forgettest, And neglectest God who formeth thee.";
dby[18] = "Of the Rock that begot thee wast thou unmindful, And thou hast forgotten God who brought thee forth.";
web[18] = "Of the Rock [that] begat thee thou art unmindful, and hast forgotten God that formed thee.";
hnv[18] = "Of the Rock that became your father, you are unmindful, Have forgotten God who gave you birth.";
vul[18] = "Deum qui te genuit dereliquisti et oblitus es Domini creatoris tui";
rsv[19] = "&quot;The LORD saw it, and spurned them, because of the provocation of his sons and his daughters.";
asv[19] = "And Jehovah saw [it], and abhorred [them], Because of the provocation of his sons and his daughters. ";
yng[19] = "And Jehovah seeth and despiseth -- For the provocation of His sons and His daughters.";
dby[19] = "And Jehovah saw it, and despised them, Because of the provoking of his sons and of his daughters.";
web[19] = "And when the LORD saw [it], he abhorred [them], because of the provoking of his sons, and of his daughters.";
hnv[19] = "The LORD saw [it], and abhorred [them], Because of the provocation of his sons and his daughters.";
vul[19] = "vidit Dominus et ad iracundiam concitatus est quia provocaverunt eum filii sui et filiae";
rsv[20] = "And he said, \'I will hide my face from them, I will see what their end will be, for they are a perverse generation, children in whom is no faithfulness.";
asv[20] = "And he said, I will hide my face from them, I will see what their end shall be: For they are a very perverse generation, Children in whom is no faithfulness. ";
yng[20] = "And He saith: I hide My face from them, I see what [is] their latter end; For a froward generation [are] they, Sons in whom is no stedfastness.";
dby[20] = "And he said, I will hide my face from them, I will see what their end shall be; For they are a perverse generation, Children in whom is no faithfulness.";
web[20] = "And he said, I will hide my face from them, I will see what their end [will be]: for they [are] a very froward generation, children in whom [is] no faith.";
hnv[20] = "He said, I will hide my face from them, I will see what their end shall be: For they are a very perverse generation, Children in whom is no faithfulness.";
vul[20] = "et ait abscondam faciem meam ab eis et considerabo novissima eorum generatio enim perversa est et infideles filii";
rsv[21] = "They have stirred me to jealousy with what is no god; they have provoked me with their idols. So I will stir them to jealousy with those who are no people; I will provoke them with a foolish nation.";
asv[21] = "They have moved me to jealousy with that which is not God; They have provoked me to anger with their vanities: And I will move them to jealousy with those that are not a people; I will provoke them to anger with a foolish nation. ";
yng[21] = "They have made Me zealous by `no-god,\' They made Me angry by their vanities; And I make them zealous by `no-people,\' By a foolish nation I make them angry.";
dby[21] = "They have moved me to jealousy with that which is no God; They have exasperated me with their vanities; And I will move them to jealousy with that which is not a people; With a foolish nation will I provoke them to anger.";
web[21] = "They have moved me to jealousy with [that which is] not God; they have provoked me to anger with their vanities: and I will move them to jealousy with [those who are] not a people; I will provoke them to anger with a foolish nation.";
hnv[21] = "They have moved me to jealousy with that which is not God; They have provoked me to anger with their vanities: I will move them to jealousy with those who are not a people; I will provoke them to anger with a foolish nation.";
vul[21] = "ipsi me provocaverunt in eo qui non erat Deus et inritaverunt in vanitatibus suis et ego provocabo eos in eo qui non est populus et in gente stulta inritabo illos";
rsv[22] = "For a fire is kindled by my anger, and it burns to the depths of Sheol, devours the earth and its increase, and sets on fire the foundations of the mountains.";
asv[22] = "For a fire is kindled in mine anger, And burneth unto the lowest Sheol, And devoureth the earth with its increase, And setteth on fire the foundations of the mountains. ";
yng[22] = "For a fire hath been kindled in Mine anger, And it burneth unto Sheol -- the lowest, And consumeth earth and its increase, And setteth on fire foundations of mountains.";
dby[22] = "For a fire is kindled in mine anger, And it shall burn into the lowest Sheol, And shall consume the earth and its produce, And set fire to the foundations of the mountains.";
web[22] = "For a fire is kindled in my anger, and shall burn to the lowest hell, and shall consume the earth with her increase, and set on fire the foundations of the mountains.";
hnv[22] = "For a fire is kindled in my anger, Burns to the lowest She\'ol, Devours the eretz with its increase, Sets on fire the foundations of the mountains.";
vul[22] = "ignis succensus est in furore meo et ardebit usque ad inferni novissima devorabitque terram cum germine suo et montium fundamenta conburet";
rsv[23] = "&quot;\'And I will heap evils upon them; I will spend my arrows upon them;";
asv[23] = "I will heap evils upon them; I will spend mine arrows upon them: ";
yng[23] = "I gather upon them evils, Mine arrows I consume upon them.";
dby[23] = "I will heap mischiefs upon them; Mine arrows will I spend against them.";
web[23] = "I will heap mischiefs upon them; I will spend my arrows upon them.";
hnv[23] = "I will heap evils on them; I will spend my arrows on them:";
vul[23] = "congregabo super eos mala et sagittas meas conplebo in eis";
rsv[24] = "they shall be wasted with hunger, and devoured with burning heat and poisonous pestilence; and I will send the teeth of beasts against them, with venom of crawling things of the dust.";
asv[24] = " [They shall be] wasted with hunger, and devoured with burning heat And bitter destruction; And the teeth of beasts will I send upon them, With the poison of crawling things of the dust. ";
yng[24] = "Exhausted by famine, And consumed by heat, and bitter destruction. And the teeth of beasts I send upon them, With poison of fearful things of the dust.";
dby[24] = "They shall be consumed with hunger, and devoured with burning heat, And with poisonous pestilence; And the teeth of beasts will I send against them, With the poison of what crawleth in the dust.";
web[24] = "[They shall be] burnt with hunger, and devoured with burning heat, and with bitter destruction: I will also send the teeth of beasts upon them, with the poison of serpents of the dust.";
hnv[24] = "[They shall be] wasted with hunger, and devoured with burning heat Bitter destruction; The teeth of animals will I send on them, With the poison of crawling things of the dust.";
vul[24] = "consumentur fame et devorabunt eos aves morsu amarissimo dentes bestiarum inmittam in eos cum furore trahentium super terram atque serpentium";
rsv[25] = "In the open the sword shall bereave, and in the chambers shall be terror, destroying both young man and virgin, the sucking child with the man of gray hairs.";
asv[25] = "Without shall the sword bereave, And in the chambers terror; [It shall destroy] both young man and virgin, The suckling with the man of gray hairs. ";
yng[25] = "Without bereave doth the sword, And at the inner-chambers -- fear, Both youth and virgin, Suckling with man of grey hair.";
dby[25] = "From without shall the sword bereave them, and in the chambers, terror -- Both the young man and the virgin, The suckling with the man of gray hairs.";
web[25] = "The sword without, and terror within, shall destroy both the young man and the virgin, the suckling [also] with the man of gray hairs.";
hnv[25] = "Outside shall the sword bereave, In the chambers terror; [It shall destroy] both young man and virgin, The suckling with the man of gray hairs.";
vul[25] = "foris vastabit eos gladius et intus pavor iuvenem simul ac virginem lactantem cum homine sene";
rsv[26] = "I would have said, &quot;I will scatter them afar, I will make the remembrance of them cease from among men,&quot;";
asv[26] = "I said, I would scatter them afar, I would make the remembrance of them to cease from among men; ";
yng[26] = "I have said: I blow them away, I cause their remembrance to cease from man;";
dby[26] = "I would say, I will scatter, I will make the remembrance of them to cease from among men,";
web[26] = "I said, I would scatter them into corners, I would make the remembrance of them to cease from among men;";
hnv[26] = "I said, I would scatter them afar, I would make the memory of them to cease from among men;";
vul[26] = "dixi ubinam sunt cessare faciam ex hominibus memoriam eorum";
rsv[27] = "had I not feared provocation by the enemy, lest their adversaries should judge amiss, lest they should say, &quot;Our hand is triumphant, the LORD has not wrought all this.&quot;\'";
asv[27] = "Were it not that I feared the provocation of the enemy, Lest their adversaries should judge amiss, Lest they should say, Our hand is exalted, And Jehovah hath not done all this. ";
yng[27] = "If not -- the anger of an enemy I fear, Lest their adversaries know -- Lest they say, Our hand is high, And Jehovah hath not wrought all this.";
dby[27] = "If I did not fear provocation from the enemy, Lest their adversaries should misunderstand it, Lest they should say, Our hand is high, and Jehovah has not done all this.";
web[27] = "Were it not that I feared the wrath of the enemy, lest their adversaries should behave themselves strangely, [and] lest they should say, Our hand [is] high, and the LORD hath not done all this.";
hnv[27] = "Were it not that I feared the provocation of the enemy, Lest their adversaries should judge amiss, Lest they should say, Our hand is exalted, The LORD has not done all this.";
vul[27] = "sed propter iram inimicorum distuli ne forte superbirent hostes eorum et dicerent manus nostra excelsa et non Dominus fecit haec omnia";
rsv[28] = "&quot;For they are a nation void of counsel, and there is no understanding in them.";
asv[28] = "For they are a nation void of counsel, And there is no understanding in them. ";
yng[28] = "For a nation lost to counsels [are] they, And there is no understanding in them.";
dby[28] = "For they are a nation void of counsel, And understanding is not in them.";
web[28] = "For they [are] a nation void of counsel, neither [is there any] understanding in them.";
hnv[28] = "For they are a nation void of counsel, There is no understanding in them.";
vul[28] = "gens absque consilio est et sine prudentia";
rsv[29] = "If they were wise, they would understand this, they would discern their latter end!";
asv[29] = "Oh that they were wise, that they understood this, That they would consider their latter end! ";
yng[29] = "If they were wise -- They deal wisely [with] this; They attend to their latter end:";
dby[29] = "Oh that they had been wise! they would have understood this, They would have considered their latter end!";
web[29] = "O that they were wise, [that] they understood this, [that] they would consider their latter end!";
hnv[29] = "Oh that they were wise, that they understood this, That they would consider their latter end!";
vul[29] = "utinam saperent et intellegerent ac novissima providerent";
rsv[30] = "How should one chase a thousand, and two put ten thousand to flight, unless their Rock had sold them, and the LORD had given them up?";
asv[30] = "How should one chase a thousand, And two put ten thousand to flight, Except their Rock had sold them, And Jehovah had delivered them up? ";
yng[30] = "How doth one pursue a thousand, And two cause a myriad to flee! If not -- that their rock hath sold them, And Jehovah hath shut them up?";
dby[30] = "How could one chase a thousand, And two put ten thousand to flight, Were it not that their Rock had sold them, And Jehovah had delivered them up?";
web[30] = "How should one chase a thousand, and two put ten thousand to flight, except their Rock had sold them, and the LORD had shut them up?";
hnv[30] = "How should one chase a thousand, Two put ten thousand to flight, Except their Rock had sold them, The LORD had delivered them up?";
vul[30] = "quomodo persequatur unus mille et duo fugent decem milia nonne ideo quia Deus suus vendidit eos et Dominus conclusit illos";
rsv[31] = "For their rock is not as our Rock, even our enemies themselves being judges.";
asv[31] = "For their rock is not as our Rock, Even our enemies themselves being judges. ";
yng[31] = "For not as our Rock [is] their rock, (And our enemies [are] judges!)";
dby[31] = "For their rock is not as our Rock: Let our enemies themselves be judges.";
web[31] = "For their rock [is] not as our Rock, even our enemies themselves [being] judges:";
hnv[31] = "For their rock is not as our Rock, Even our enemies themselves being judges.";
vul[31] = "non enim est Deus noster ut deus eorum et inimici nostri sunt iudices";
rsv[32] = "For their vine comes from the vine of Sodom, and from the fields of Gomor\'rah; their grapes are grapes of poison, their clusters are bitter;";
asv[32] = "For their vine is of the vine of Sodom, And of the fields of Gomorrah: Their grapes are grapes of gall, Their clusters are bitter: ";
yng[32] = "For of the vine of Sodom their vine [is], And of the fields of Gomorrah; Their grapes [are] grapes of gall -- They have bitter clusters;";
dby[32] = "For their vine is of the vine of Sodom, And of the fields of Gomorrah: Their grapes are grapes of poison, Bitter are their clusters;";
web[32] = "For their vine [is] of the vine of Sodom, and of the fields of Gomorrah: their grapes [are] grapes of gall, their clusters [are] bitter:";
hnv[32] = "For their vine is of the vine of Sedom, Of the fields of `Amorah: Their grapes are grapes of gall, Their clusters are bitter:";
vul[32] = "de vinea Sodomorum vinea eorum et de suburbanis Gomorrae uva eorum uva fellis et botri amarissimi";
rsv[33] = "their wine is the poison of serpents, and the cruel venom of asps.";
asv[33] = "Their wine is the poison of serpents, And the cruel venom of asps. ";
yng[33] = "The poison of dragons [is] their wine And the fierce venom of asps.";
dby[33] = "Their wine is the poison of dragons, And the cruel venom of vipers.";
web[33] = "Their wine [is] the poison of dragons, and the cruel venom of asps.";
hnv[33] = "Their wine is the poison of serpents, The cruel venom of asps.";
vul[33] = "fel draconum vinum eorum et venenum aspidum insanabile";
rsv[34] = "&quot;Is not this laid up in store with me, sealed up in my treasuries?";
asv[34] = "Is not this laid up in store with me, Sealed up among my treasures? ";
yng[34] = "Is it not laid up with Me? Sealed among My treasures?";
dby[34] = "Is not this hidden with me, Sealed up among my treasures?";
web[34] = "[Is] not this laid up in store with me, [and] sealed up among my treasures?";
hnv[34] = "Isn\'t this laid up in store with me, Sealed up among my treasures?";
vul[34] = "nonne haec condita sunt apud me et signata in thesauris meis";
rsv[35] = "Vengeance is mine, and recompense, for the time when their foot shall slip; for the day of their calamity is at hand, and their doom comes swiftly.";
asv[35] = "Vengeance is mine, and recompense, At the time when their foot shall slide: For the day of their calamity is at hand, And the things that are to come upon them shall make haste. ";
yng[35] = "Mine [are] vengeance and recompense, At the due time -- doth their foot slide; For near is a day of their calamity, And haste do things prepared for them.";
dby[35] = "Vengeance is mine, and recompense, For the time when their foot shall slip. For the day of their calamity is at hand, And the things that shall come upon them make haste.";
web[35] = "To me [belongeth] vengeance, and recompense; their foot shall slide in [due] time: for the day of their calamity [is] at hand, and the things that shall come upon them make haste.";
hnv[35] = "Vengeance is mine, and recompense, At the time when their foot shall slide: For the day of their calamity is at hand, The things that are to come on them shall make haste.";
vul[35] = "mea est ultio et ego retribuam in tempore ut labatur pes eorum iuxta est dies perditionis et adesse festinant tempora";
rsv[36] = "For the LORD will vindicate his people and have compassion on his servants, when he sees that their power is gone, and there is none remaining, bond or free.";
asv[36] = "For Jehovah will judge his people, And repent himself for his servants; When he seeth that [their] power is gone, And there is none [remaining], shut up or left at large. ";
yng[36] = "For Jehovah doth judge His people, And for His servants doth repent Himself. For He seeth -- the going away of power, And none is restrained and left.";
dby[36] = "For Jehovah will judge his people, And shall repent in favour of his servants; When he seeth that power is gone, And there is none shut up or left.";
web[36] = "For the LORD shall judge his people, and repent for his servants: when he seeth that [their] power is gone, and [there is] none shut up, or left.";
hnv[36] = "For the LORD will judge his people, Repent himself for his servants; When he sees that [their] power is gone, There is none [remaining], shut up or left at large.";
vul[36] = "iudicabit Dominus populum suum et in servis suis miserebitur videbit quod infirmata sit manus et clausi quoque defecerint residuique consumpti sint";
rsv[37] = "Then he will say, \'Where are their gods, the rock in which they took refuge,";
asv[37] = "And he will say, Where are their gods, The rock in which they took refuge; ";
yng[37] = "And He hath said, Where [are] their gods -- The rock in which they trusted;";
dby[37] = "And he shall say, Where are their gods, Their rock in whom they trusted,";
web[37] = "And he shall say, Where [are] their gods, [their] rock in whom they trusted,";
hnv[37] = "He will say, Where are their gods, The rock in which they took refuge;";
vul[37] = "et dicet ubi sunt dii eorum in quibus habebant fiduciam";
rsv[38] = "who ate the fat of their sacrifices, and drank the wine of their drink offering? Let them rise up and help you, let them be your protection!";
asv[38] = "Which did eat the fat of their sacrifices, [And] drank the wine of their drink-offering? Let them rise up and help you, Let them be your protection. ";
yng[38] = "Which the fat of their sacrifices do eat, They drink the wine of their libation! Let them arise and help you, Let it be for you a hiding-place!";
dby[38] = "Who ate the fat of their sacrifices, [And] drank the wine of their drink-offering? Let them rise up and help you, That there may be a protection over you.";
web[38] = "Which ate the fat of their sacrifices, [and] drank the wine of their drink-offerings? let them rise up and help you, [and] be your protection.";
hnv[38] = "Which ate the fat of their sacrifices, And drank the wine of their drink-offering? Let them rise up and help you, Let them be your protection.";
vul[38] = "de quorum victimis comedebant adipes et bibebant vinum libaminum surgant et opitulentur vobis et in necessitate vos protegant";
rsv[39] = "&quot;\'See now that I, even I, am he, and there is no god beside me; I kill and I make alive; I wound and I heal; and there is none that can deliver out of my hand.";
asv[39] = "See now that I, even I, am he, And there is no god with me: I kill, and I make alive; I wound, and I heal; And there is none that can deliver out of my hand. ";
yng[39] = "See ye, now, that I -- I [am] He, And there is no god with Me: I put to death, and I keep alive; I have smitten, and I heal; And there is not from My hand a deliverer,";
dby[39] = "See now that I, I am HE, And there is no god with me; I kill, and I make alive; I wound, and I heal, And there is none that delivereth out of my hand,";
web[39] = "See now that I, [even] I [am] he, and [there is] no god with me: I kill, and I make alive; I wound, and I heal: neither [is there any] that can deliver out of my hand.";
hnv[39] = "See now that I, even I, am he, There is no god with me: I kill, and I make alive; I wound, and I heal; There is none who can deliver out of my hand.";
vul[39] = "videte quod ego sim solus et non sit alius deus praeter me ego occidam et ego vivere faciam percutiam et ego sanabo et non est qui de manu mea possit eruere";
rsv[40] = "For I lift up my hand to heaven, and swear, As I live for ever,";
asv[40] = "For I lift up my hand to heaven, And say, As I live for ever, ";
yng[40] = "For I lift up unto the heavens My hand, And have said, I live -- to the age!";
dby[40] = "For I lift up my hand to the heavens, and say, I live for ever!";
web[40] = "For I lift up my hand to heaven, and say, I live for ever.";
hnv[40] = "For I lift up my hand to heaven, And say, As I live forever,";
vul[40] = "levabo ad caelum manum meam et dicam vivo ego in aeternum";
rsv[41] = "if I whet my glittering sword, and my hand takes hold on judgment, I will take vengeance on my adversaries, and will requite those who hate me.";
asv[41] = "If I whet my glittering sword, And my hand take hold on judgment; I will render vengeance to mine adversaries, And will recompense them that hate me. ";
yng[41] = "If I have sharpened the brightness of My sword, And My hand doth lay hold on judgment, I turn back vengeance to Mine adversaries, And to those hating Me -- I repay!";
dby[41] = "If I have sharpened my gleaming sword, And my hand take hold of judgment, I will render vengeance to mine adversaries, And will recompense them that hate me.";
web[41] = "If I shall whet my glittering sword, and my hand take hold on judgment; I will render vengeance to my enemies, and will reward them that hate me.";
hnv[41] = "If I whet my glittering sword, My hand take hold on judgment; I will render vengeance to my adversaries, Will recompense those who hate me.";
vul[41] = "si acuero ut fulgur gladium meum et arripuerit iudicium manus mea reddam ultionem hostibus meis et his qui oderunt me retribuam";
rsv[42] = "I will make my arrows drunk with blood, and my sword shall devour flesh--with the blood of the slain and the captives, from the long-haired heads of the enemy.\'";
asv[42] = "I will make mine arrows drunk with blood, And my sword shall devour flesh; With the blood of the slain and the captives, From the head of the leaders of the enemy. ";
yng[42] = "I make drunk Mine arrows with blood, And My sword devoureth flesh, From the blood of the pierced and captive, From the head of the freemen of the enemy.";
dby[42] = "Mine arrows will I make drunk with blood, And my sword shall devour flesh; [I will make them drunk] with the blood of the slain and of the captives, With the head of the princes of the enemy.";
web[42] = "I will make my arrows drunk with blood, and my sword shall devour flesh; [and that] with the blood of the slain and of the captives from the beginning of revenges upon the enemy.";
hnv[42] = "I will make my arrows drunk with blood, My sword shall devour flesh; With the blood of the slain and the captives, From the head of the leaders of the enemy.";
vul[42] = "inebriabo sagittas meas sanguine et gladius meus devorabit carnes de cruore occisorum et de captivitate nudati inimicorum capitis";
rsv[43] = "&quot;Praise his people, O you nations; for he avenges the blood of his servants, and takes vengeance on his adversaries, and makes expiation for the land of his people.&quot;";
asv[43] = "Rejoice, O ye nations, [with] his people: For he will avenge the blood of his servants, And will render vengeance to his adversaries, And will make expiation for his land, for his people. ";
yng[43] = "Sing ye nations -- [with] his people, For the blood of His servants He avengeth, And vengeance He turneth back on His adversaries, And hath pardoned His land -- His people.\'";
dby[43] = "Shout for joy, ye nations, with his people, For he avengeth the blood of his servants, And rendereth vengeance to his enemies, And maketh atonement for his land, for his people.";
web[43] = "Rejoice, O ye nations, [with] his people: for he will avenge the blood of his servants, and will render vengeance to his adversaries, and will be merciful to his land, [and] to his people.";
hnv[43] = "Rejoice, you nations, [with] his people: For he will avenge the blood of his servants, Will render vengeance to his adversaries, Will make expiation for his land, for his people.";
vul[43] = "laudate gentes populum eius quia sanguinem servorum suorum ulciscetur et vindictam retribuet in hostes eorum et propitius erit terrae populi sui";
rsv[44] = "Moses came and recited all the words of this song in the hearing of the people, he and Joshua the son of Nun.";
asv[44] = "And Moses came and spake all the words of this song in the ears of the people, he, and Hoshea the son of Nun.";
yng[44] = "And Moses cometh and speaketh all the words of this song in the ears of the people, he and Hoshea son of Nun;";
dby[44] = "And Moses came and spoke all the words of this song in the ears of the people, he and Hoshea the son of Nun.";
web[44] = "And Moses came and spoke all the words of this song in the ears of the people, he and Hoshea the son of Nun.";
hnv[44] = "Moshe came and spoke all the words of this song in the ears of the people, he and Yehoshua the son of Nun.";
vul[44] = "venit ergo Moses et locutus est omnia verba cantici huius in auribus populi ipse et Iosue filius Nun";
rsv[45] = "And when Moses had finished speaking all these words to all Israel,";
asv[45] = "And Moses made an end of speaking all these words to all Israel;";
yng[45] = "and Moses finisheth to speak all these words unto all Israel,";
dby[45] = "And when Moses had ended speaking all these words to all Israel,";
web[45] = "And Moses made an end of speaking all these words to all Israel;";
hnv[45] = "Moshe made an end of speaking all these words to all Yisra\'el;";
vul[45] = "conplevitque omnes sermones istos loquens ad universum Israhel";
rsv[46] = "he said to them, &quot;Lay to heart all the words which I enjoin upon you this day, that you may command them to your children, that they may be careful to do all the words of this law.";
asv[46] = "and he said unto them, Set your heart unto all the words which I testify unto you this day, which ye shall command your children to observe to do, [even] all the words of this law.";
yng[46] = "and saith unto them, `Set your heart to all the words which I am testifying against you to-day, that ye command your sons to observe to do all the words of this law,";
dby[46] = "he said unto them, Set your hearts unto all the words that I testify among you this day, which ye shall command your children to take heed to do, all the words of this law.";
web[46] = "And he said to them, Set your hearts to all the words which I testify among you this day, which ye shall command your children to observe to do, all the words of this law.";
hnv[46] = "He said to them, Set your heart to all the words which I testify to you this day, which you shall command your children to observe to do, [even] all the words of this law.";
vul[46] = "et dixit ad eos ponite corda vestra in omnia verba quae ego testificor vobis hodie ut mandetis ea filiis vestris custodire et facere et implere universa quae scripta sunt legis huius";
rsv[47] = "For it is no trifle for you, but it is your life, and thereby you shall live long in the land which you are going over the Jordan to possess.&quot;";
asv[47] = "For it is no vain thing for you; because it is your life, and through this thing ye shall prolong your days in the land, whither ye go over the Jordan to possess it.";
yng[47] = "for it [is] not a vain thing for you, for it [is] your life, and by this thing ye prolong days on the ground whither ye are passing over the Jordan to possess it.\'";
dby[47] = "For it is no vain word for you, but it is your life, and through this word ye shall prolong your days on the land whereunto ye pass over the Jordan to possess it.";
web[47] = "For it [is] not a vain thing for you: because it [is] your life; and through this thing ye shall prolong [your] days in the land whither ye go over Jordan to possess it.";
hnv[47] = "For it is no vain thing for you; because it is your life, and through this thing you shall prolong your days in the land, where you go over the Yarden to possess it.";
vul[47] = "quia non in cassum praecepta sunt vobis sed ut singuli in eis viverent quae facientes longo perseveretis tempore in terra ad quam Iordane transmisso ingredimini possidendam";
rsv[48] = "And the LORD said to Moses that very day,";

rsv[49] = "&quot;Ascend this mountain of the Ab\'arim, Mount Nebo, which is in the land of Moab, opposite Jericho; and view the land of Canaan, which I give to the people of Israel for a possession;";
asv[49] = "Get thee up into this mountain of Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho; and behold the land of Canaan, which I give unto the children of Israel for a possession;";
yng[49] = "`Go up unto this mount Abarim, mount Nebo, which [is] in the land of Moab, which [is] on the front of Jericho, and see the land of Canaan which I am giving to the sons of Israel for a possession;";
dby[49] = "Go up into this mountain Abarim, mount Nebo, which is in the land of Moab, which is opposite Jericho; and behold the land of Canaan, which I give unto the children of Israel for a possession,";
web[49] = "Ascend this mountain Abarim, [to] mount Nebo, which [is] in the land of Moab, that [is] over against Jericho; and behold the land of Canaan which I give to the children of Israel for a Possession:";
hnv[49] = "Go up into this mountain of `Avarimen, to Mount Nevo, which is in the land of Mo\'av, that is over against Yericho; and see the land of Kana`an, which I give to the children of Yisra\'el for a possession;";
vul[49] = "ascende in montem istum Abarim id est transituum in montem Nebo qui est in terra Moab contra Hiericho et vide terram Chanaan quam ego tradam filiis Israhel obtinendam et morere in monte";
rsv[50] = "and die on the mountain which you ascend, and be gathered to your people, as Aaron your brother died in Mount Hor and was gathered to his people;";
asv[50] = "and die in the mount whither thou goest up, and be gathered unto thy people, as Aaron thy brother died in mount Hor, and was gathered unto his people:";
yng[50] = "and die in the mount whither thou art going up, and be gathered unto thy people, as Aaron thy brother hath died in the mount Hor, and is gathered unto his people:";
dby[50] = "and die on the mountain whither thou goest up, and be gathered unto thy peoples, as Aaron thy brother died on mount Hor, and was gathered unto his peoples;";
web[50] = "And die in the mount whither thou goest, and be gathered to thy people; as Aaron thy brother died in mount Hor, and was gathered to his people:";
hnv[50] = "and die on the mountain where you go up, and be gathered to your people, as Aharon your brother died on Mount Hor, and was gathered to his people:";

rsv[51] = "because you broke faith with me in the midst of the people of Israel at the waters of Mer\'i-bath-ka\'desh, in the wilderness of Zin; because you did not revere me as holy in the midst of the people of Israel.";

yng[51] = "`Because ye trespassed against me in the midst of the sons of Israel at the waters of Meribath-Kadesh, the wilderness of Zin -- because ye sanctified Me not in the midst of the sons of Israel;";
dby[51] = "because ye trespassed against me among the children of Israel at the waters of Meribah-Kadesh, in the wilderness of Zin; because ye hallowed me not in the midst of the children of Israel.";
web[51] = "Because ye trespassed against me among the children of Israel at the waters of Meribah-Kadesh, in the wilderness of Zin; because ye sanctified me not in the midst of the children of Israel.";
hnv[51] = "because you trespassed against me in the midst of the children of Yisra\'el at the waters of Merivah of Kadesh, in the wilderness of Tzin; because you didn\'t sanctify me in the midst of the children of Yisra\'el.";

yng[52] = "but over-against thou seest the land, and thither thou dost not go in, unto the land which I am giving to the sons of Israel.\'";
dby[52] = "For thou shalt see the land before [thee]; but thou shalt not go thither unto the land which I give the children of Israel.";
web[52] = "Yet thou shalt see the land before [thee], but thou shalt not go thither to the land which I give the children of Israel.";
hnv[52] = " For you shall see the land before you; but you shall not go there into the land which I give the children of Yisra\'el.";
