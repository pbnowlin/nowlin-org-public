csb[1] = "These are the words Moses spoke to all Israel across the Jordan in the wilderness, in the Arabah opposite Suph, between Paran and Tophel, Laban, Hazeroth, and Di-zahab.";
csb[2] = "It is an eleven-day journey from Horeb to Kadesh-barnea by way of Mount Seir.";
csb[3] = "In the fortieth year, in the eleventh month, on the first of the month, Moses told the Israelites everything the LORD had commanded him to say to them.";
csb[4] = "This was after he had defeated King Sihon of the Amorites, who lived in Heshbon, and King Og of Bashan, who lived in Ashtaroth, at Edrei.";
csb[5] = "Across the Jordan in the land of Moab, Moses began to explain this law, saying:";
csb[6] = "&quot;The LORD our God spoke to us at Horeb: \'You have stayed at this mountain long enough.";
csb[7] = "&quot;Resume your journey and go to the hill country of the Amorites and their neighbors in the Arabah, the hill country, the Judean foothills, the Negev and the sea coast -- to the land of the Canaanites and to Lebanon as far as the great river, the Euphrates River.";
csb[8] = "&quot;See, I have set the land before you. Enter and take possession of the land the LORD swore to give to your fathers Abraham, Isaac, and Jacob and their future descendants.\'";
csb[9] = "&quot;I said to you at that time: I can\'t bear the responsibility for you on my own.";
csb[10] = "&quot;The LORD your God has so multiplied you that today you are as numerous as the stars of the sky.";
csb[11] = "&quot;May the LORD, the God of your fathers, increase you a thousand times more, and bless you as he promised you.";
csb[12] = "&quot;But how can I bear your troubles, burdens, and disputes by myself?";
csb[13] = "&quot;Appoint for yourselves wise, understanding, and respected men from each of your tribes, and I will make them your leaders.";
csb[14] = "&quot;You replied to me, \'What you propose to do is good.\'";
csb[15] = "&quot;So I took the leaders of your tribes, wise and respected men, and set them over you as leaders: commanders for thousands, hundreds, fifties, and tens, and officers for your tribes.";
csb[16] = "&quot;I commanded your judges at that time: Hear the cases between your brothers, and judge rightly between a man and his brother or his resident alien.";
csb[17] = "&quot;Do not show partiality when deciding a case; listen to small and great alike. Do not be intimidated by anyone, for judgment belongs to God. Bring me any case too difficult for you, and I will hear it.";
csb[18] = "&quot;At that time I commanded you about all the things you were to do.";
csb[19] = "&quot;We then set out from Horeb and went across all the great and terrible wilderness you saw on the way to the hill country of the Amorites, just as the LORD our God had commanded us. When we reached Kadesh-barnea,";
csb[20] = "&quot;I said to you: You have reached the hill country of the Amorites, which the LORD our God is giving us.";
csb[21] = "&quot;See, the LORD your God has set the land before you. Go up and take possession of it as the LORD, the God of your fathers, has told you. Do not be afraid or discouraged.";
csb[22] = "&quot;Then all of you approached me and said, \'Let\'s send men ahead of us, so that they may explore the land for us and bring us back a report about the route we should go up and the cities we will come to.\'";
csb[23] = "&quot;The plan seemed good to me, so I selected twelve men from among you, one man for each tribe.";
csb[24] = "&quot;They left and went up into the hill country and came to the Valley of Eshcol, scouting the land.";
csb[25] = "&quot;They took some of the fruit from the land in their hands, carried it down to us, and brought us back a report: \'The land the LORD our God is giving us is good.\'";
csb[26] = "&quot;But you were not willing to go up. You rebelled against the command of the LORD your God.";
csb[27] = "&quot;You grumbled in your tents and said, \'The LORD brought us out of the land of Egypt to hand us over to the Amorites in order to destroy us, because he hates us.";
csb[28] = "&quot;Where can we go? Our brothers have made us lose heart, saying: The people are larger and taller than we are; the cities are large, fortified to the heavens. We also saw the descendants of the Anakim there.\'";
csb[29] = "&quot;So I said to you: Don\'t be terrified or afraid of them!";
csb[30] = "&quot;The LORD your God who goes before you will fight for you, just as you saw him do for you in Egypt.";
csb[31] = "&quot;And you saw in the wilderness how the LORD your God carried you as a man carries his son all along the way you traveled until you reached this place.";
csb[32] = "&quot;But in spite of this you did not trust the LORD your God,";
csb[33] = "&quot;who went before you on the journey to seek out a place for you to camp. He went in the fire by night and in the cloud by day to guide you on the road you were to travel.";
csb[34] = "&quot;When the LORD heard your words, he grew angry and swore an oath:";
csb[35] = "&quot;\'None of these men in this evil generation will see the good land I swore to give your fathers,";
csb[36] = "&quot;except Caleb the son of Jephunneh. He will see it, and I will give him and his descendants the land on which he has set foot, because he remained loyal to the LORD.\'";
csb[37] = "&quot;The LORD was angry with me also because of you and said: \'You will not enter there either.";
csb[38] = "&quot;Joshua son of Nun, who attends you, will enter it. Encourage him, for he will enable Israel to inherit it.";
csb[39] = "&quot;Your children, whom you said would be plunder, your sons who don\'t yet know good from evil, will enter there. I will give them the land, and they will take possession of it.";
csb[40] = "&quot;But you are to turn back and head for the wilderness by way of the Red Sea.\'";
csb[41] = "&quot;You answered me, \'We have sinned against the LORD. We will go up and fight just as the LORD our God commanded us.\' Then each of you put on his weapons of war and thought it would be easy to go up into the hill country.";
csb[42] = "&quot;But the LORD said to me, \'Tell them: Don\'t go up and fight, for I am not with you to keep you from being defeated by your enemies.\'";
csb[43] = "&quot;So I spoke to you, but you didn\'t listen. You rebelled against the LORD\'s command and defiantly went up into the hill country.";
csb[44] = "&quot;Then the Amorites who lived there came out against you and chased you like a swarm of bees. They routed you from Seir as far as Hormah.";
csb[45] = "&quot;When you returned, you wept before the LORD, but he didn\'t listen to your requests or pay attention to you.";
csb[46] = "&quot;For this reason you stayed in Kadesh as long as you did.";
