csb[1] = "&quot;Then we turned back and headed for the wilderness by way of the Red Sea, as the LORD had told me, and we traveled around the hill country of Seir for many days.";
csb[2] = "&quot;The LORD then said to me,";
csb[3] = "&quot;\'You\'ve been traveling around this hill country long enough; turn north.";
csb[4] = "&quot;Command the people: You are about to travel through the territory of your brothers, the descendants of Esau, who live in Seir. They will be afraid of you, so be very careful.";
csb[5] = "&quot;Don\'t provoke them, for I will not give you any of their land, not even a foot of it, because I have given Esau the hill country of Seir as his possession.";
csb[6] = "&quot;You may purchase food from them, so that you may eat, and buy water from them to drink.";
csb[7] = "&quot;For the LORD your God has blessed you in all the work of your hands. He has watched over your journey through this immense wilderness. The LORD your God has been with you this past forty years, and you have lacked nothing.\'";
csb[8] = "&quot;So we bypassed our brothers, the descendants of Esau, who live in Seir. We turned away from the Arabah road and from Elath and Ezion-geber. We traveled along the road to the Wilderness of Moab.";
csb[9] = "&quot;The LORD said to me, \'Show no hostility toward Moab, and do not provoke them to battle, for I will not give you any of their land as a possession, since I have given Ar as a possession to the descendants of Lot.\' &quot;";
csb[10] = "The Emim, a great and numerous people as tall as the Anakim, had previously lived there.";
csb[11] = "They were also regarded as Rephaim, like the Anakim, though the Moabites called them Emim.";
csb[12] = "The Horites had previously lived in Seir, but the descendants of Esau drove them out, destroying them completely and settling in their place, just as Israel did in the land of its possession the LORD gave them.";
csb[13] = "&quot;The LORD said, \'Now get up and cross the Zered Valley.\' So we crossed the Zered Valley.";
csb[14] = "&quot;The time we spent traveling from Kadesh-barnea until we crossed the Zered Valley was thirty-eight years until the entire generation of fighting men had perished from the camp, as the LORD had sworn to them.";
csb[15] = "&quot;Indeed, the LORD\'s hand was against them, to eliminate them from the camp until they had all perished.";
csb[16] = "&quot;When all the fighting men had died among the people,";
csb[17] = "&quot;the LORD spoke to me,";
csb[18] = "&quot;\'Today you are going to cross the border of Moab at Ar.";
csb[19] = "&quot;When you get close to the Ammonites, don\'t show any hostility to them or provoke them, for I will not give you any of the Ammonites\' land as a possession; I have given it as a possession to the descendants of Lot.\' &quot;";
csb[20] = "This too used to be regarded as the land of the Rephaim. The Rephaim lived there previously, though the Ammonites called them Zamzummim,";
csb[21] = "a great and numerous people, tall as the Anakim. The LORD destroyed the Rephaim at the advance of the Ammonites, so that they drove them out and settled in their place.";
csb[22] = "This was just as he had done for the descendants of Esau who lived in Seir, when he destroyed the Horites before them; they drove them out and have lived in their place until now.";
csb[23] = "The Caphtorim, who came from Caphtor, destroyed the Avvites, who lived in villages as far as Gaza, and settled in their place.";
csb[24] = "&quot;The LORD also said, \'Get up, move out, and cross the Arnon Valley. See, I have handed the Amorites\' King Sihon of Heshbon and his land over to you. Begin to take possession of it; engage him in battle.";
csb[25] = "&quot;Today I will begin to put the fear and dread of you on the peoples everywhere under heaven. They will hear the report about you, tremble, and be in anguish because of you.\'";
csb[26] = "&quot;So I sent messengers with an offer of peace to King Sihon of Heshbon from the Wilderness of Kedemoth, saying,";
csb[27] = "&quot;\'Let us travel through your land; we will keep strictly to the highway. We will not turn to the right or the left.";
csb[28] = "&quot;You can sell us food in exchange for silver so we may eat, and give us water for silver so we may drink. Only let us travel through on foot,";
csb[29] = "&quot;just as the descendants of Esau who live in Seir did for us, and the Moabites who live in Ar, until we cross the Jordan into the land the LORD our God is giving us.\'";
csb[30] = "&quot;But King Sihon of Heshbon would not let us travel through his land, for the LORD your God had made his spirit stubborn and his heart obstinate in order to hand him over to you, as has now taken place.";
csb[31] = "&quot;Then the LORD said to me, \'See, I have begun to give Sihon and his land to you. Begin to take possession of it.\'";
csb[32] = "&quot;So Sihon and his whole army came out against us for battle at Jahaz.";
csb[33] = "&quot;The LORD our God handed him over to us, and we defeated him, his sons, and his whole army.";
csb[34] = "&quot;At that time we captured all his cities and completely destroyed the people of every city, including the women and children. We left no survivors.";
csb[35] = "&quot;We took only the livestock and the spoil from the cities we captured as plunder for ourselves.";
csb[36] = "&quot;There was no city that was inaccessible to us, from Aroer on the rim of the Arnon Valley, along with the city in the valley, even as far as Gilead. The LORD our God gave everything to us.";
csb[37] = "&quot;But you did not go near the Ammonites\' land, all along the bank of the Jabbok River, the cities of the hill country, or any place that the LORD our God had forbidden.";
