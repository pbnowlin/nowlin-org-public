csb[1] = "&quot;When the LORD your God brings you into the land you are entering to possess, and he drives out many nations before you -- the Hethites, Girgashites, Amorites, Canaanites, Perizzites, Hivites and Jebusites, seven nations more numerous and powerful than you --";
csb[2] = "&quot;and when the LORD your God delivers them over to you and you defeat them, you must completely destroy them. Make no treaty with them and show them no mercy.";
csb[3] = "&quot;You must not intermarry with them, and you must not give your daughters to their sons or take their daughters for your sons,";
csb[4] = "&quot;because they will turn your sons away from me to worship other gods. Then the LORD\'s anger will burn against you, and he will swiftly destroy you.";
csb[5] = "&quot;Instead, this is what you are to do to them: tear down their altars, smash their sacred pillars, cut down their Asherah poles, and burn their carved images.";
csb[6] = "&quot;For you are a holy people belonging to the LORD your God. The LORD your God has chosen you to be his own possession out of all the peoples on the face of the earth.";
csb[7] = "&quot;The LORD had his heart set on you and chose you, not because you were more numerous than all peoples, for you were the fewest of all peoples.";
csb[8] = "&quot;But because the LORD loved you and kept the oath he swore to your fathers, he brought you out with a strong hand and redeemed you from the place of slavery, from the power of Pharaoh king of Egypt.";
csb[9] = "&quot;Know that the LORD your God is God, the faithful God who keeps his gracious covenant loyalty for a thousand generations with those who love him and keep his commands.";
csb[10] = "&quot;But he directly pays back and destroys those who hate him. He will not hesitate to pay back directly the one who hates him.";
csb[11] = "&quot;So keep the command -- the statutes and ordinances -- that I am giving you to follow today.";
csb[12] = "&quot;If you listen to and are careful to keep these ordinances, the LORD your God will keep his covenant loyalty with you, as he swore to your fathers.";
csb[13] = "&quot;He will love you, bless you, and multiply you. He will bless your offspring, and the produce of your land -- your grain, new wine, and fresh oil -- the young of your herds, and the newborn of your flocks, in the land he swore to your fathers that he would give you.";
csb[14] = "&quot;You will be blessed above all peoples; there will be no infertile male or female among you or your livestock.";
csb[15] = "&quot;The LORD will remove all sickness from you; he will not put on you all the terrible diseases of Egypt that you know about, but he will inflict them on all who hate you.";
csb[16] = "&quot;You must destroy all the peoples the LORD your God is delivering over to you and not look on them with pity. Do not worship their gods, for that will be a snare to you.";
csb[17] = "&quot;If you say to yourself, \'These nations are greater than I; how can I drive them out? \'";
csb[18] = "&quot;do not be afraid of them. Be sure to remember what the LORD your God did to Pharaoh and all Egypt:";
csb[19] = "&quot;the great trials that you saw, the signs and wonders, the strong hand and outstretched arm, by which the LORD your God brought you out. The LORD your God will do the same to all the peoples you fear.";
csb[20] = "&quot;The LORD your God will also send hornets against them until all the survivors and those hiding from you perish.";
csb[21] = "&quot;Don\'t be terrified of them, for the LORD your God, a great and awesome God, is among you.";
csb[22] = "&quot;The LORD your God will drive out these nations before you little by little. You will not be able to destroy them all at once; otherwise, the wild animals will become too numerous for you.";
csb[23] = "&quot;The LORD your God will give them over to you and throw them into great confusion until they are destroyed.";
csb[24] = "&quot;He will hand their kings over to you, and you will wipe out their names under heaven. No one will be able to stand against you; you will annihilate them.";
csb[25] = "&quot;Burn up the carved images of their gods. Don\'t covet the silver and gold on the images and take it for yourself, or else you will be ensnared by it, for it is detestable to the LORD your God.";
csb[26] = "&quot;Do not bring any detestable thing into your house, or you will be set apart for destruction like it. You are to abhor and detest it utterly because it is set apart for destruction.";
kjv[1] = "When the LORD thy God shall bring thee into the land whither thou goest to possess it, and hath cast out many nations before thee, the Hittites, and the Girgashites, and the Amorites, and the Canaanites, and the Perizzites, and the Hivites, and the Jebusites, seven nations greater and mightier than thou;";
