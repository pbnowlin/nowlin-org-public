csb[1] = "These are the words of the covenant the LORD commanded Moses to make with the Israelites in the land of Moab, in addition to the covenant he had made with them at Horeb.";
csb[2] = "Moses summoned all Israel and said to them, &quot;You have seen with your own eyes everything the LORD did in Egypt to Pharaoh, to all his officials, and to his entire land.";
csb[3] = "&quot;You saw with your own eyes the great trials and those great signs and wonders.";
csb[4] = "&quot;Yet to this day the LORD has not given you a mind to understand, eyes to see, or ears to hear.";
csb[5] = "&quot;I led you forty years in the wilderness; your clothes and the sandals on your feet did not wear out;";
csb[6] = "&quot;you did not eat food or drink wine or beer -- so that you might know that I am the LORD your God.";
csb[7] = "&quot;When you reached this place, King Sihon of Heshbon and King Og of Bashan came out against us in battle, but we defeated them.";
csb[8] = "&quot;We took their land and gave it as an inheritance to the Reubenites, the Gadites, and half the tribe of Manasseh.";
csb[9] = "&quot;Therefore, observe the words of this covenant and follow them, so that you will succeed in everything you do.";
csb[10] = "&quot;All of you are standing today before the LORD your God -- your leaders, tribes, elders, officials, all the men of Israel,";
csb[11] = "&quot;your dependents, your wives, and the resident aliens in your camps who cut your wood and draw your water --";
csb[12] = "&quot;so that you may enter into the covenant of the LORD your God, which he is making with you today, so that you may enter into his oath";
csb[13] = "&quot;and so that he may establish you today as his people and he may be your God as he promised you and as he swore to your fathers Abraham, Isaac, and Jacob.";
csb[14] = "&quot;I am making this covenant and this oath not only with you,";
csb[15] = "&quot;but also with those who are standing here with us today in the presence of the LORD our God and with those who are not here today.";
csb[16] = "&quot;Indeed, you know how we lived in the land of Egypt and passed through the nations where you traveled.";
csb[17] = "&quot;You saw their abhorrent images and idols made of wood, stone, silver, and gold, which were among them.";
csb[18] = "&quot;Be sure there is no man, woman, clan, or tribe among you today whose heart turns away from the LORD our God to go and worship the gods of those nations. Be sure there is no root among you bearing poisonous and bitter fruit.";
csb[19] = "&quot;When someone hears the words of this oath, he may consider himself exempt, thinking, \'I will have peace even though I follow my own stubborn heart.\' This will lead to the destruction of the well-watered land as well as the dry land.";
csb[20] = "&quot;The LORD will not be willing to forgive him. Instead, his anger and jealousy will burn against that person, and every curse written in this scroll will descend on him. The LORD will blot out his name under heaven,";
csb[21] = "&quot;and single him out for harm from all the tribes of Israel, according to all the curses of the covenant written in this book of the law.";
csb[22] = "&quot;Future generations of your children who follow you and the foreigner who comes from a distant country will see the plagues of that land and the sicknesses the LORD has inflicted on it.";
csb[23] = "&quot;All its soil will be a burning waste of sulfur and salt, unsown, producing nothing, with no plant growing on it, just like the fall of Sodom and Gomorrah, Admah and Zeboiim, which the LORD demolished in his fierce anger.";
csb[24] = "&quot;All the nations will ask, \'Why has the LORD done this to this land? Why this intense outburst of anger? \'";
csb[25] = "&quot;Then people will answer, \'It is because they abandoned the covenant of the LORD, the God of their fathers, which he had made with them when he brought them out of the land of Egypt.";
csb[26] = "&quot;They began to serve other gods, bowing in worship to gods they had not known -- gods that the LORD had not permitted them to worship.";
csb[27] = "&quot;Therefore the LORD\'s anger burned against this land, and he brought every curse written in this book on it.";
csb[28] = "&quot;The LORD uprooted them from their land in his anger, rage, and intense wrath, and threw them into another land where they are today.\'";
csb[29] = "&quot;The hidden things belong to the LORD our God, but the revealed things belong to us and our children forever, so that we may follow all the words of this law.";

kjv[23] = "[And that] the whole land thereof [is] brimstone, and salt, [and] burning, [that] it is not sown, nor beareth, nor any grass groweth therein, like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the LORD overthrew in his anger, and in his wrath:";
