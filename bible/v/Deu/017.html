csb[1] = "&quot;Do not sacrifice to the LORD your God an ox or sheep with a defect or any serious flaw, for that is detestable to the LORD your God.";
csb[2] = "&quot;If a man or woman among you in one of your towns that the LORD your God will give you is discovered doing evil in the sight of the LORD your God and violating his covenant";
csb[3] = "&quot;and has gone to serve other gods by bowing in worship to the sun, moon, or all the stars in the sky -- which I have forbidden --";
csb[4] = "&quot;and if you are told or hear about it, then investigate it thoroughly. If the report turns out to be true that this detestable act has been done in Israel,";
csb[5] = "&quot;you are to bring out to your city gates that man or woman who has done this evil thing and stone them to death.";
csb[6] = "&quot;The one condemned to die is to be executed on the testimony of two or three witnesses. No one is to be executed on the testimony of a single witness.";
csb[7] = "&quot;The witnesses\' hands are to be the first in putting him to death, and after that, the hands of all the people. You must purge the evil from you.";
csb[8] = "&quot;If a case is too difficult for you -- concerning bloodshed, lawsuits, or assaults -- cases disputed at your city gates, then go up to the place the LORD your God chooses.";
csb[9] = "&quot;You are to go to the Levitical priests and to the judge who presides at that time. Ask, and they will give you a verdict in the case.";
csb[10] = "&quot;You must abide by the verdict they give you at the place the LORD chooses. Be careful to do exactly as they instruct you.";
csb[11] = "&quot;You must abide by the instruction they give you and the verdict they announce to you. Do not turn to the right or the left from the decision they declare to you.";
csb[12] = "&quot;The person who acts arrogantly, refusing to listen either to the priest who stands there serving the LORD your God or to the judge, must die. You must purge the evil from Israel.";
csb[13] = "&quot;Then all the people will hear about it, be afraid, and no longer behave arrogantly.";
csb[14] = "&quot;When you enter the land the LORD your God is giving you, take possession of it, live in it, and say, \'I will set a king over me like all the nations around me,\'";
csb[15] = "&quot;you are to appoint over you the king the LORD your God chooses. Appoint a king from your brothers. You are not to set a foreigner over you, or one who is not of your people.";
csb[16] = "&quot;However, he must not acquire many horses for himself or send the people back to Egypt to acquire many horses, for the LORD has told you, \'You are never to go back that way again.\'";
csb[17] = "&quot;He must not acquire many wives for himself so that his heart won\'t go astray. He must not acquire very large amounts of silver and gold for himself.";
csb[18] = "&quot;When he is seated on his royal throne, he is to write a copy of this instruction for himself on a scroll in the presence of the Levitical priests.";
csb[19] = "&quot;It is to remain with him, and he is to read from it all the days of his life, so that he may learn to fear the LORD his God, to observe all the words of this instruction, and to do these statutes.";
csb[20] = "&quot;Then his heart will not be exalted above his countrymen, he will not turn from this command to the right or the left, and he and his sons will continue reigning many years in Israel.";
kjv[1] = "Thou shalt not sacrifice unto the LORD thy God [any] bullock, or sheep, wherein is blemish, [or] any evilfavouredness: for that [is] an abomination unto the LORD thy God.";
rsv[1] = "&quot;You shall not sacrifice to the LORD your God an ox or a sheep in which is a blemish, any defect whatever; for that is an abomination to the LORD your God.";
asv[1] = "Thou shalt not sacrifice unto Jehovah thy God an ox, or a sheep, wherein is a blemish, [or] anything evil; for that is an abomination unto Jehovah thy God.";
yng[1] = "`Thou dost not sacrifice to Jehovah thy God ox or sheep in which there is a blemish -- any evil thing; for it [is] the abomination of Jehovah thy God.";
dby[1] = "Thou shalt not sacrifice to Jehovah thy God an ox or sheep wherein is a defect, or anything bad; for it is an abomination to Jehovah thy God.";
web[1] = "Thou shalt not sacrifice to the LORD thy God [any] bullock, or sheep, in which is blemish, [or] any evil favoredness: for that [is] an abomination to the LORD thy God.";
hnv[1] = "You shall not sacrifice to the LORD your God an ox, or a sheep, in which is a blemish, [or] anything evil; for that is an abomination to the LORD your God.";
vul[1] = "non immolabis Domino Deo tuo bovem et ovem in quo est macula aut quippiam vitii quia abominatio est Domini Dei tui";
kjv[2] = "If there be found among you, within any of thy gates which the LORD thy God giveth thee, man or woman, that hath wrought wickedness in the sight of the LORD thy God, in transgressing his covenant,";
rsv[2] = "&quot;If there is found among you, within any of your towns which the LORD your God gives you, a man or woman who does what is evil in the sight of the LORD your God, in transgressing his covenant,";
asv[2] = "If there be found in the midst of thee, within any of thy gates which Jehovah thy God giveth thee, man or woman, that doeth that which is evil in the sight of Jehovah thy God, in transgressing his covenant,";
yng[2] = "`When there is found in thy midst, in one of thy cities which Jehovah thy God is giving to thee, a man or a woman who doth the evil thing in the eyes of Jehovah thy God by transgressing His covenant,";
dby[2] = "If there be found in thy midst in any of thy gates which Jehovah thy God giveth thee, man or woman, that doeth what is evil in the sight of Jehovah thy God, in transgressing his covenant,";
web[2] = "If there shall be found among you, within any of thy gates which the LORD thy God giveth thee, man or woman that hath wrought wickedness in the sight of of the LORD thy God, in transgressing his covenant,";
hnv[2] = "If there be found in the midst of you, within any of your gates which the LORD your God gives you, man or woman, who does that which is evil in the sight of the LORD your God, in transgressing his covenant,";
vul[2] = "cum repperti fuerint apud te intra unam portarum tuarum quas Dominus Deus tuus dabit tibi vir aut mulier qui faciant malum in conspectu Domini Dei tui et transgrediantur pactum illius";
kjv[3] = "And hath gone and served other gods, and worshipped them, either the sun, or moon, or any of the host of heaven, which I have not commanded;";
rsv[3] = "and has gone and served other gods and worshiped them, or the sun or the moon or any of the host of heaven, which I have forbidden,";
asv[3] = "and hath gone and served other gods, and worshipped them, or the sun, or the moon, or any of the host of heaven, which I have not commanded,";
yng[3] = "and he doth go and serve other gods, and doth bow himself to them, and to the sun, or to the moon, or to any of the host of the heavens, which I have not commanded --";
dby[3] = "and goeth and serveth other gods, and boweth down to them, either to the sun or to the moon, or to the whole host of heaven, which I have not commanded;";
web[3] = "And hath gone and served other gods, and worshiped them, either the sun, or moon, or any of the host of heaven, which I have not commanded;";
hnv[3] = "and has gone and served other gods, and worshiped them, or the sun, or the moon, or any of the host of the sky, which I have not commanded;";
vul[3] = "ut vadant et serviant diis alienis et adorent eos solem et lunam et omnem militiam caeli quae non praecepi";
kjv[4] = "And it be told thee, and thou hast heard [of it], and enquired diligently, and, behold, [it be] true, [and] the thing certain, [that] such abomination is wrought in Israel:";
rsv[4] = "and it is told you and you hear of it; then you shall inquire diligently, and if it is true and certain that such an abominable thing has been done in Israel,";
asv[4] = "and it be told thee, and thou hast heard of it; then shalt thou inquire diligently; and, behold, if it be true, and the thing certain, that such abomination is wrought in Israel,";
yng[4] = "and it hath been declared to thee, and thou hast heard, and hast searched diligently, and lo, truth; the thing is established; this abomination hath been done in Israel --";
dby[4] = "and it be told thee, and thou hearest of it; then thou shalt make thorough inquiry, and if it be truth [and] the thing be certain, that this abomination hath been wrought in Israel,";
web[4] = "And it shall be told thee, and thou hast heard [of it], and inquired diligently, and behold, [it is] true, [and] the thing certain, [that] such abomination is wrought in Israel:";
hnv[4] = "and it be told you, and you have heard of it, then shall you inquire diligently; and, behold, if it be true, and the thing certain, that such abomination is done in Yisra\'el,";
vul[4] = "et hoc tibi fuerit nuntiatum audiensque inquisieris diligenter et verum esse reppereris et abominatio facta est in Israhel";
kjv[5] = "Then shalt thou bring forth that man or that woman, which have committed that wicked thing, unto thy gates, [even] that man or that woman, and shalt stone them with stones, till they die.";
rsv[5] = "then you shall bring forth to your gates that man or woman who has done this evil thing, and you shall stone that man or woman to death with stones.";
asv[5] = "then shalt thou bring forth that man or that woman, who hath done this evil thing, unto thy gates, even the man or the woman; and thou shalt stone them to death with stones.";
yng[5] = "`Then thou hast brought out that man, or that woman, who hath done this evil thing, unto thy gates -- the man or the woman -- and thou hast stoned them with stones, and they have died.";
dby[5] = "thou shalt bring forth that man or that woman, who committed that wicked thing, unto thy gates, the man or the woman, and shalt stone them with stones, that they die.";
web[5] = "Then shalt thou bring forth to thy gates that man or that woman, who have committed that wicked thing, [even] that man or that woman, and shalt stone them with stones, till they die.";
hnv[5] = "then shall you bring forth that man or that woman, who has done this evil thing, to your gates, even the man or the woman; and you shall stone them to death with stones.";

kjv[6] = "At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death; [but] at the mouth of one witness he shall not be put to death.";
rsv[6] = "On the evidence of two witnesses or of three witnesses he that is to die shall be put to death; a person shall not be put to death on the evidence of one witness.";
asv[6] = "At the mouth of two witnesses, or three witnesses, shall he that is to die be put to death; at the mouth of one witness he shall not be put to death.";
yng[6] = "By the mouth of two witnesses or of three witnesses is he who is dead put to death; he is not put to death by the mouth of one witness;";
dby[6] = "At the mouth of two witnesses, or three witnesses, shall he that is to die be put to death: he shall not be put to death at the mouth of one witness.";
web[6] = "At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death; [but] at the mouth of one witness he shall not be put to death.";
hnv[6] = "At the mouth of two witnesses, or three witnesses, shall he who is to die be put to death; at the mouth of one witness he shall not be put to death.";
vul[6] = "in ore duorum aut trium testium peribit qui interficietur nemo occidatur uno contra se dicente testimonium";
kjv[7] = "The hands of the witnesses shall be first upon him to put him to death, and afterward the hands of all the people. So thou shalt put the evil away from among you.";
rsv[7] = "The hand of the witnesses shall be first against him to put him to death, and afterward the hand of all the people. So you shall purge the evil from the midst of you.";
asv[7] = "The hand of the witnesses shall be first upon him to put him to death, and afterward the hand of all the people. So thou shalt put away the evil from the midst of thee.";
yng[7] = "the hand of the witnesses is on him, in the first place, to put him to death, and the hand of all the people last; and thou hast put away the evil thing out of thy midst.";
dby[7] = "The hands of the witnesses shall be first upon him to put him to death, and afterwards the hands of all the people; and thou shalt put evil away from thy midst.";
web[7] = "The hands of the witnesses shall be first upon him to put him to death, and afterward the hands of all the people. So thou shalt remove the evil from among you.";
hnv[7] = "The hand of the witnesses shall be first on him to put him to death, and afterward the hand of all the people. So you shall put away the evil from the midst of you.";
vul[7] = "manus testium prima interficiet eum et manus reliqui populi extrema mittetur ut auferas malum de medio tui";
kjv[8] = "If there arise a matter too hard for thee in judgment, between blood and blood, between plea and plea, and between stroke and stroke, [being] matters of controversy within thy gates: then shalt thou arise, and get thee up into the place which the LORD thy God shall choose;";
rsv[8] = "&quot;If any case arises requiring decision between one kind of homicide and another, one kind of legal right and another, or one kind of assault and another, any case within your towns which is too difficult for you, then you shall arise and go up to the place which the LORD your God will choose,";
asv[8] = "If there arise a matter too hard for thee in judgment, between blood and blood, between plea and plea, and between stroke and stroke, being matters of controversy within thy gates; then shalt thou arise, and get thee up unto the place which Jehovah thy God shall choose;";
yng[8] = "`When anything is too hard for thee for judgment, between blood and blood, between plea and plea, and between stroke and stroke -- matters of strife within thy gates -- then thou hast risen, and gone up unto the place on which Jehovah thy God doth fix,";
dby[8] = "If there arise a matter too hard for thee in judgment, between blood and blood, between cause and cause, and between stroke and stroke, matters of controversy within thy gates, then shalt thou arise, and go up to the place which Jehovah thy God will choose.";
web[8] = "If there shall arise a matter too hard for thee in judgment, between blood and blood, between plea and plea, and between stroke and stroke, [being] matters of controversy within thy gates: then shalt thou arise, and go up to the place which the LORD thy God shall choose;";
hnv[8] = "If there arise a matter too hard for you in judgment, between blood and blood, between plea and plea, and between stroke and stroke, being matters of controversy within your gates; then shall you arise, and go up to the place which the LORD your God shall choose;";
vul[8] = "si difficile et ambiguum apud te iudicium esse perspexeris inter sanguinem et sanguinem causam et causam lepram et non lepram et iudicum intra portas tuas videris verba variari surge et ascende ad locum quem elegerit Dominus Deus tuus";
kjv[9] = "And thou shalt come unto the priests the Levites, and unto the judge that shall be in those days, and enquire; and they shall shew thee the sentence of judgment:";
rsv[9] = "and coming to the Levitical priests, and to the judge who is in office in those days, you shall consult them, and they shall declare to you the decision.";
asv[9] = "and thou shalt come unto the priests the Levites, and unto the judge that shall be in those days: and thou shalt inquire; and they shall show thee the sentence of judgment.";
yng[9] = "and hast come in unto the priests, the Levites, and unto the judge who is in those days, and hast inquired, and they have declared to thee the word of judgment,";
dby[9] = "And thou shalt come unto the priests, the Levites, and unto the judge that shall be in those days, and inquire; and they shall declare unto thee the sentence of judgment;";
web[9] = "And thou shalt come to the priests the Levites, and to the judge that shall be in those days, and inquire; and they shall show thee the sentence of judgment:";
hnv[9] = "and you shall come to the Kohanim the Levites, and to the judge who shall be in those days: and you shall inquire; and they shall show you the sentence of judgment.";
vul[9] = "veniesque ad sacerdotes levitici generis et ad iudicem qui fuerit illo tempore quaeresque ab eis qui indicabunt tibi iudicii veritatem";
kjv[10] = "And thou shalt do according to the sentence, which they of that place which the LORD shall choose shall shew thee; and thou shalt observe to do according to all that they inform thee:";
rsv[10] = "Then you shall do according to what they declare to you from that place which the LORD will choose; and you shall be careful to do according to all that they direct you;";
asv[10] = "And thou shalt do according to the tenor of the sentence which they shall show thee from that place which Jehovah shall choose; and thou shalt observe to do according to all that they shall teach thee:";

dby[10] = "and thou shalt do according to the tenor of the word, which they of that place which Jehovah will choose shall declare unto thee; and thou shalt take heed to do according to all that they instruct thee:";
web[10] = "And thou shalt do according to the sentence, which they of that place which the LORD shall choose shall show thee; and thou shalt observe to do according to all that they inform thee:";
hnv[10] = "You shall do according to the tenor of the sentence which they shall show you from that place which the LORD shall choose; and you shall observe to do according to all that they shall teach you:";
vul[10] = "et facies quodcumque dixerint qui praesunt loco quem elegerit Dominus et docuerint te";
kjv[11] = "According to the sentence of the law which they shall teach thee, and according to the judgment which they shall tell thee, thou shalt do: thou shalt not decline from the sentence which they shall shew thee, [to] the right hand, nor [to] the left.";
rsv[11] = "according to the instructions which they give you, and according to the decision which they pronounce to you, you shall do; you shall not turn aside from the verdict which they declare to you, either to the right hand or to the left.";
asv[11] = "according to the tenor of the law which they shall teach thee, and according to the judgment which they shall tell thee, thou shalt do; thou shalt not turn aside from the sentence which they shall show thee, to the right hand, nor to the left.";
yng[11] = "`According to the tenor of the law which they direct thee, and according to the judgment which they say to thee thou dost do; thou dost not turn aside from the word which they declare to thee, right or left.";
dby[11] = "according to the sentence of the law which they shall declare unto thee, and according to the judgment which they shall tell thee, thou shalt do: thou shalt not decline from the word which they shall declare unto thee, to the right hand, or the left.";
web[11] = "According to the sentence of the law which they shall teach thee, and according to the judgment which they shall tell thee, thou shalt do: thou shalt not decline from the sentence which they shall show thee, [to] the right hand, nor [to] the left.";
hnv[11] = "according to the tenor of the law which they shall teach you, and according to the judgment which they shall tell you, you shall do; you shall not turn aside from the sentence which they shall show you, to the right hand, nor to the left.";

kjv[12] = "And the man that will do presumptuously, and will not hearken unto the priest that standeth to minister there before the LORD thy God, or unto the judge, even that man shall die: and thou shalt put away the evil from Israel.";

asv[12] = "And the man that doeth presumptuously, in not hearkening unto the priest that standeth to minister there before Jehovah thy God, or unto the judge, even that man shall die: and thou shalt put away the evil from Israel.";
yng[12] = "And the man who acteth with presumption, so as not to hearken unto the priest (who is standing to serve there Jehovah thy God), or unto the judge, even that man hath died, and thou hast put away the evil thing from Israel,";
dby[12] = "And the man that shall act presumptuously, and not hearken unto the priest that standeth to serve there before Jehovah thy God, or unto the judge, that man shall die; and thou shalt put away evil from Israel.";

hnv[12] = "The man who does presumptuously, in not listening to the Kohen who stands to minister there before the LORD your God, or to the judge, even that man shall die: and you shall put away the evil from Yisra\'el.";

kjv[14] = "When thou art come unto the land which the LORD thy God giveth thee, and shalt possess it, and shalt dwell therein, and shalt say, I will set a king over me, like as all the nations that [are] about me;";
rsv[14] = "&quot;When you come to the land which the LORD your God gives you, and you possess it and dwell in it, and then say, \'I will set a king over me, like all the nations that are round about me\';";

hnv[14] = "When you are come to the land which the LORD your God gives you, and shall possess it, and shall dwell therein, and shall say, I will set a king over me, like all the nations that are round about me;";
vul[14] = "cum ingressus fueris terram quam Dominus Deus tuus dabit tibi et possederis eam habitaverisque in illa et dixeris constituam super me regem sicut habent omnes per circuitum nationes";
kjv[15] = "Thou shalt in any wise set [him] king over thee, whom the LORD thy God shall choose: [one] from among thy brethren shalt thou set king over thee: thou mayest not set a stranger over thee, which [is] not thy brother.";
rsv[15] = "you may indeed set as king over you him whom the LORD your God will choose. One from among your brethren you shall set as king over you; you may not put a foreigner over you, who is not your brother.";
asv[15] = "thou shalt surely set him king over thee, whom Jehovah thy God shall choose: one from among thy brethren shalt thou set king over thee; thou mayest not put a foreigner over thee, who is not thy brother.";
yng[15] = "thou dost certainly set over thee a king on whom Jehovah doth fix; from the midst of thy brethren thou dost set over thee a king; thou art not able to set over thee a stranger, who is not thy brother.";
dby[15] = "thou shalt only set him king over thee whom Jehovah thy God will choose: from among thy brethren shalt thou set a king over thee; thou mayest not set a foreigner over thee, who is not thy brother.";
web[15] = "Thou shalt in any wise set [him] king over thee whom the LORD thy God shall choose: [one] from among thy brethren shalt thou set king over thee: thou mayest not set a stranger over thee, who [is] not thy brother.";
hnv[15] = "you shall surely set him king over you, whom the LORD your God shall choose: one from among your brothers shall you set king over you; you may not put a foreigner over you, who is not your brother.";
vul[15] = "eum constitues quem Dominus Deus tuus elegerit de numero fratrum tuorum non poteris alterius gentis hominem regem facere qui non sit frater tuus";
kjv[16] = "But he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses: forasmuch as the LORD hath said unto you, Ye shall henceforth return no more that way.";
rsv[16] = "Only he must not multiply horses for himself, or cause the people to return to Egypt in order to multiply horses, since the LORD has said to you, \'You shall never return that way again.\'";
asv[16] = "Only he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he may multiply horses; forasmuch as Jehovah hath said unto you, Ye shall henceforth return no more that way.";
yng[16] = "`Only, he doth not multiply to himself horses, nor cause the people to turn back to Egypt, so as to multiply horses, seeing Jehovah hath said to you, Ye do not add to turn back in this way any more.";
dby[16] = "Only he shall not multiply horses to himself, nor lead back the people to Egypt, to multiply horses; for Jehovah hath said unto you, Ye shall not return again any more that way.";
web[16] = "But he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses: forasmuch as the LORD hath said to you, ye shall henceforth return no more that way.";
hnv[16] = "Only he shall not multiply horses to himself, nor cause the people to return to Mitzrayim, to the end that he may multiply horses; because the LORD has said to you, You shall henceforth return no more that way.";
vul[16] = "cumque fuerit constitutus non multiplicabit sibi equos nec reducet populum in Aegyptum equitatus numero sublevatus praesertim cum Dominus praeceperit vobis ut nequaquam amplius per eandem viam revertamini";
kjv[17] = "Neither shall he multiply wives to himself, that his heart turn not away: neither shall he greatly multiply to himself silver and gold.";
rsv[17] = "And he shall not multiply wives for himself, lest his heart turn away; nor shall he greatly multiply for himself silver and gold.";
asv[17] = "Neither shall he multiply wives to himself, that his heart turn not away: neither shall he greatly multiply to himself silver and gold.";
yng[17] = "And he doth not multiply to himself wives, and his heart doth not turn aside, and silver and gold he doth not multiply to himself -- exceedingly.";
dby[17] = "Neither shall he multiply wives to himself, that his heart turn not away; neither shall he greatly multiply to himself silver and gold.";
web[17] = "Neither shall he multiply wives to himself, that his heart may turn not away: neither shall he greatly accumulate to himself silver and gold.";
