kjv[1] = "And Moses called all Israel, and said unto them, Hear, O Israel, the statutes and judgments which I speak in your ears this day, that ye may learn them, and keep, and do them.";
kjv[2] = "The LORD our God made a covenant with us in Horeb.";
kjv[3] = "The LORD made not this covenant with our fathers, but with us, [even] us, who [are] all of us here alive this day.";
kjv[4] = "The LORD talked with you face to face in the mount out of the midst of the fire,";
kjv[5] = "(I stood between the LORD and you at that time, to shew you the word of the LORD: for ye were afraid by reason of the fire, and went not up into the mount;) saying,";
kjv[6] = "I [am] the LORD thy God, which brought thee out of the land of Egypt, from the house of bondage.";
kjv[7] = "Thou shalt have none other gods before me.";
kjv[8] = "Thou shalt not make thee [any] graven image, [or] any likeness [of any thing] that [is] in heaven above, or that [is] in the earth beneath, or that [is] in the waters beneath the earth:";
kjv[9] = "Thou shalt not bow down thyself unto them, nor serve them: for I the LORD thy God [am] a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth [generation] of them that hate me,";
kjv[10] = "And shewing mercy unto thousands of them that love me and keep my commandments.";
kjv[11] = "Thou shalt not take the name of the LORD thy God in vain: for the LORD will not hold [him] guiltless that taketh his name in vain.";
kjv[12] = "Keep the sabbath day to sanctify it, as the LORD thy God hath commanded thee.";
kjv[13] = "Six days thou shalt labour, and do all thy work:";
kjv[14] = "But the seventh day [is] the sabbath of the LORD thy God: [in it] thou shalt not do any work, thou, nor thy son, nor thy daughter, nor thy manservant, nor thy maidservant, nor thine ox, nor thine ass, nor any of thy cattle, nor thy stranger that [is] within thy gates; that thy manservant and thy maidservant may rest as well as thou.";
kjv[15] = "And remember that thou wast a servant in the land of Egypt, and [that] the LORD thy God brought thee out thence through a mighty hand and by a stretched out arm: therefore the LORD thy God commanded thee to keep the sabbath day.";
kjv[16] = "Honour thy father and thy mother, as the LORD thy God hath commanded thee; that thy days may be prolonged, and that it may go well with thee, in the land which the LORD thy God giveth thee.";
kjv[17] = "Thou shalt not kill.";
kjv[18] = "Neither shalt thou commit adultery.";
kjv[19] = "Neither shalt thou steal.";
kjv[20] = "Neither shalt thou bear false witness against thy neighbour.";
kjv[21] = "Neither shalt thou desire thy neighbour\'s wife, neither shalt thou covet thy neighbour\'s house, his field, or his manservant, or his maidservant, his ox, or his ass, or any [thing] that [is] thy neighbour\'s.";
kjv[22] = "These words the LORD spake unto all your assembly in the mount out of the midst of the fire, of the cloud, and of the thick darkness, with a great voice: and he added no more. And he wrote them in two tables of stone, and delivered them unto me.";
kjv[23] = "And it came to pass, when ye heard the voice out of the midst of the darkness, (for the mountain did burn with fire,) that ye came near unto me, [even] all the heads of your tribes, and your elders;";
kjv[24] = "And ye said, Behold, the LORD our God hath shewed us his glory and his greatness, and we have heard his voice out of the midst of the fire: we have seen this day that God doth talk with man, and he liveth.";
kjv[25] = "Now therefore why should we die? for this great fire will consume us: if we hear the voice of the LORD our God any more, then we shall die.";
kjv[26] = "For who [is there of] all flesh, that hath heard the voice of the living God speaking out of the midst of the fire, as we [have], and lived?";
kjv[27] = "Go thou near, and hear all that the LORD our God shall say: and speak thou unto us all that the LORD our God shall speak unto thee; and we will hear [it], and do [it].";
kjv[28] = "And the LORD heard the voice of your words, when ye spake unto me; and the LORD said unto me, I have heard the voice of the words of this people, which they have spoken unto thee: they have well said all that they have spoken.";
kjv[29] = "O that there were such an heart in them, that they would fear me, and keep all my commandments always, that it might be well with them, and with their children for ever!";
kjv[30] = "Go say to them, Get you into your tents again.";
kjv[31] = "But as for thee, stand thou here by me, and I will speak unto thee all the commandments, and the statutes, and the judgments, which thou shalt teach them, that they may do [them] in the land which I give them to possess it.";
kjv[32] = "Ye shall observe to do therefore as the LORD your God hath commanded you: ye shall not turn aside to the right hand or to the left.";
kjv[33] = "Ye shall walk in all the ways which the LORD your God hath commanded you, that ye may live, and [that it may be] well with you, and [that] ye may prolong [your] days in the land which ye shall possess.";
csb[1] = "Moses summoned all Israel and said to them, &quot;Israel, listen to the statutes and ordinances I am proclaiming as you hear them today. Learn and follow them carefully.";
csb[2] = "&quot;The LORD our God made a covenant with us at Horeb.";
csb[3] = "&quot;He did not make this covenant with our fathers, but with all of us who are alive here today.";
csb[4] = "&quot;The LORD spoke to you face to face from the fire on the mountain.";
csb[5] = "&quot;At that time I was standing between the LORD and you to report the word of the LORD to you, because you were afraid of the fire and did not go up the mountain. And he said:";
csb[6] = "&quot;I am the LORD your God, who brought you out of the land of Egypt, out of the place of slavery.";
csb[7] = "&quot;Do not have other gods besides me.";
csb[8] = "&quot;Do not make an idol for yourself in the shape of anything in the heavens above or on the earth below or in the waters under the earth.";
csb[9] = "&quot;Do not bow in worship to them, and do not serve them, because I, the LORD your God, am a jealous God, punishing the children for the fathers\' iniquity to the third and fourth generations of those who hate me,";
csb[10] = "&quot;but showing faithful love to a thousand generations of those who love me and keep my commands.";
csb[11] = "&quot;Do not misuse the name of the LORD your God, because the LORD will not leave anyone unpunished who misuses his name.";
csb[12] = "&quot;Be careful to remember the Sabbath day, to keep it holy as the LORD your God has commanded you.";
csb[13] = "&quot;You are to labor six days and do all your work,";
csb[14] = "&quot;but the seventh day is a Sabbath to the LORD your God. Do not do any work -- you, your son or daughter, your male or female slave, your ox or donkey, any of your livestock, or the resident alien who lives within your city gates, so that your male and female slaves may rest as you do.";
csb[15] = "&quot;Remember that you were a slave in the land of Egypt, and the LORD your God brought you out of there with a strong hand and an outstretched arm. That is why the LORD your God has commanded you to keep the Sabbath day.";
csb[16] = "&quot;Honor your father and your mother, as the LORD your God has commanded you, so that you may live long and so that you may prosper in the land the LORD your God is giving you.";
csb[17] = "&quot;Do not murder.";
csb[18] = "&quot;Do not commit adultery.";
csb[19] = "&quot;Do not steal.";
csb[20] = "&quot;Do not give dishonest testimony against your neighbor.";
csb[21] = "&quot;Do not covet your neighbor\'s wife or desire your neighbor\'s house, his field, his male or female slave, his ox or donkey, or anything that belongs to your neighbor.";
csb[22] = "&quot;The LORD spoke these commands in a loud voice to your entire assembly from the fire, cloud, and total darkness on the mountain; he added nothing more. He wrote them on two stone tablets and gave them to me.";
csb[23] = "&quot;All of you approached me with your tribal leaders and elders when you heard the voice from the darkness and while the mountain was blazing with fire.";
csb[24] = "&quot;You said, \'Look, the LORD our God has shown us his glory and greatness, and we have heard his voice from the fire. Today we have seen that God speaks with a person, yet he still lives.";
csb[25] = "&quot;But now, why should we die? This great fire will consume us and we will die if we hear the voice of the LORD our God any longer.";
csb[26] = "&quot;For who out of all mankind has heard the voice of the living God speaking from the fire, as we have, and lived?";
csb[27] = "&quot;Go near and listen to everything the LORD our God says. Then you can tell us everything the LORD our God tells you; we will listen and obey.\'";
csb[28] = "&quot;The LORD heard your words when you spoke to me. He said to me, \'I have heard the words that these people have spoken to you. Everything they have said is right.";
csb[29] = "&quot;If only they had such a heart to fear me and keep all my commands always, so that they and their children would prosper forever.";
csb[30] = "&quot;Go and tell them: Return to your tents.";
csb[31] = "&quot;But you stand here with me, and I will tell you every command -- the statutes and ordinances -- you are to teach them, so that they may follow them in the land I am giving them to possess.\'";
csb[32] = "&quot;Be careful to do as the LORD your God has commanded you; you are not to turn aside to the right or the left.";
csb[33] = "&quot;Follow the whole instruction the LORD your God has commanded you, so that you may live, prosper, and have a long life in the land you will possess.";

hnv[17] = "&quot;You shall not murder.";
vul[17] = "non occides";
rsv[18] = "&quot;\'Neither shall you commit adultery.";
asv[18] = "Neither shalt thou commit adultery.";
yng[18] = "`Thou dost not commit adultery.";
dby[18] = "Neither shalt thou commit adultery.";
web[18] = "Neither shalt thou commit adultery.";
hnv[18] = "&quot;Neither shall you commit adultery.";
vul[18] = "neque moechaberis";
rsv[19] = "&quot;\'Neither shall you steal.";
asv[19] = "Neither shalt thou steal.";
yng[19] = "`Thou dost not steal.";
dby[19] = "Neither shalt thou steal.";
web[19] = "Neither shalt thou steal.";

rsv[20] = "&quot;\'Neither shall you bear false witness against your neighbor.";
asv[20] = "Neither shalt thou bear false witness against thy neighbor.";
yng[20] = "`Thou dost not answer against thy neighbour -- a false testimony.";
dby[20] = "Neither shalt thou bear false witness against thy neighbour.";
web[20] = "Neither shalt thou bear false witness against thy neighbor.";
hnv[20] = "&quot;Neither shall you give false testimony against your neighbor.";
vul[20] = "nec loqueris contra proximum tuum falsum testimonium";
rsv[21] = "&quot;\'Neither shall you covet your neighbor\'s wife; and you shall not desire your neighbor\'s house, his field, or his manservant, or his maidservant, his ox, or his ass, or anything that is your neighbor\'s.\'";
asv[21] = "Neither shalt thou covet thy neighbor\'s wife; neither shalt thou desire thy neighbor\'s house, his field, or his man-servant, or his maid-servant, his ox, or his ass, or anything that is thy neighbor\'s.";
yng[21] = "`Thou dost not desire thy neighbour\'s wife; nor dost thou covet thy neighbour\'s house, his field, and his man-servant, and his handmaid, his ox, and his ass, and anything which [is] thy neighbour\'s.";
dby[21] = "Neither shalt thou desire thy neighbour\'s wife, neither shalt thou covet thy neighbour\'s house, his field, nor his bondman, nor his handmaid, his ox, nor his ass, nor anything that is thy neighbour\'s.";
web[21] = "Neither shalt thou desire thy neighbor\'s wife, neither shalt thou covet thy neighbor\'s house, his field, or his man-servant, or his maid-servant, his ox, or his ass, or any [thing] that [is] thy neighbor\'s.";
hnv[21] = "&quot;Neither shall you covet your neighbor\'s wife; neither shall you desire your neighbor\'s house, his field, or his man-servant, or his maid-servant, his ox, or his donkey, or anything that is your neighbor\'s.&quot;";
vul[21] = "non concupisces uxorem proximi tui non domum non agrum non servum non ancillam non bovem non asinum et universa quae illius sunt";
rsv[22] = "&quot;These words the LORD spoke to all your assembly at the mountain out of the midst of the fire, the cloud, and the thick darkness, with a loud voice; and he added no more. And he wrote them upon two tables of stone, and gave them to me.";
asv[22] = "These words Jehovah spake unto all your assembly in the mount out of the midst of the fire, of the cloud, and of the thick darkness, with a great voice: and he added no more. And he wrote them upon two tables of stone, and gave them unto me.";
yng[22] = "`These words hath Jehovah spoken unto all your assembly, in the mount out of the midst of the fire, of the cloud, and of the thick darkness -- a great voice; and He hath not added, and He writeth them on two tables of stone, and giveth them unto me.";
dby[22] = "These words Jehovah spoke to all your congregation on the mountain from the midst of the fire, of the cloud, and of the obscurity, with a great voice, and he added no more; and he wrote them on two tables of stone, and gave them to me.";
web[22] = "These words the LORD spoke to all your assembly on the mount from the midst of the fire, of the cloud, and of the thick darkness, with a great voice: and he added no more. And he wrote them in two tables of stone, and delivered them to me.";
hnv[22] = "These words the LORD spoke to all your assembly on the mountain out of the midst of the fire, of the cloud, and of the thick darkness, with a great voice: and he added no more. He wrote them on two tables of stone, and gave them to me.";
vul[22] = "haec verba locutus est Dominus ad omnem multitudinem vestram in monte de medio ignis et nubis et caliginis voce magna nihil addens amplius et scripsit ea in duabus tabulis lapideis quas tradidit mihi";
rsv[23] = "And when you heard the voice out of the midst of the darkness, while the mountain was burning with fire, you came near to me, all the heads of your tribes, and your elders;";
asv[23] = "And it came to pass, when ye heard the voice out of the midst of the darkness, while the mountain was burning with fire, that ye came near unto me, even all the heads of your tribes, and your elders;";
yng[23] = "`And it cometh to pass as ye hear the voice out of the midst of the darkness, and of the mountain burning with fire, that ye come near unto me, all the heads of your tribes, and your elders,";
dby[23] = "And it came to pass, when ye heard the voice from the midst of the darkness, and the mountain burned with fire, that ye came near to me, all the heads of your tribes, and your elders;";
web[23] = "And it came to pass, when ye heard the voice from the midst of the darkness, (for the mountain did burn with fire,) that ye came near to me, [even] all the heads of your tribes, and your elders;";
hnv[23] = "It happened, when you heard the voice out of the midst of the darkness, while the mountain was burning with fire, that you came near to me, even all the heads of your tribes, and your Zakenim;";
vul[23] = "vos autem postquam audistis vocem de medio tenebrarum et montem ardere vidistis accessistis ad me omnes principes tribuum et maiores natu atque dixistis";
rsv[24] = "and you said, \'Behold, the LORD our God has shown us his glory and greatness, and we have heard his voice out of the midst of the fire; we have this day seen God speak with man and man still live.";
asv[24] = "and ye said, Behold, Jehovah our God hath showed us his glory and his greatness, and we have heard his voice out of the midst of the fire: we have seen this day that God doth speak with man, and he liveth.";
yng[24] = "and say, Lo, Jehovah our God hath shewed us His honour, and His greatness; and His voice we have heard out of the midst of the fire; this day we have seen that God doth speak with man -- and he hath lived.";
dby[24] = "and ye said, Behold, Jehovah our God has shewn us his glory and his greatness, and we have heard his voice from the midst of the fire: we have seen this day that God talks with man, and he lives.";
web[24] = "And ye said, Behold, the LORD our God hath shown us his glory and his greatness, and we have heard his voice from the midst of the fire: we have seen this day that God doth talk with man, and he liveth.";
hnv[24] = "and you said, Behold, the LORD our God has shown us his glory and his greatness, and we have heard his voice out of the midst of the fire: we have seen this day that God does speak with man, and he lives.";
vul[24] = "ecce ostendit nobis Dominus Deus noster maiestatem et magnitudinem suam vocem eius audivimus de medio ignis et probavimus hodie quod loquente Deo cum homine vixerit homo";
rsv[25] = "Now therefore why should we die? For this great fire will consume us; if we hear the voice of the LORD our God any more, we shall die.";
asv[25] = "Now therefore why should we die? for this great fire will consume us: if we hear the voice of Jehovah our God any more, then we shall die.";
yng[25] = "`And, now, why do we die? for consume us doth this great fire -- if we add to hear the voice of Jehovah our God any more -- then we have died.";
dby[25] = "And now, why should we die? for this great fire will consume us. If we hear the voice of Jehovah our God any more, we shall die.";
web[25] = "Now therefore why should we die? for this great fire will consume us: if we hear the voice of the LORD our God any more, then we shall die.";
hnv[25] = "Now therefore why should we die? for this great fire will consume us: if we hear the voice of the LORD our God any more, then we shall die.";
vul[25] = "cur ergo morimur et devorabit nos ignis hic maximus si enim audierimus ultra vocem Domini Dei nostri moriemur";
rsv[26] = "For who is there of all flesh, that has heard the voice of the living God speaking out of the midst of fire, as we have, and has still lived?";
asv[26] = "For who is there of all flesh, that hath heard the voice of the living God speaking out of the midst of the fire, as we have, and lived?";
yng[26] = "For who of all flesh [is] he who hath heard the voice of the living God speaking out of the midst of the fire like us -- and doth live?";
dby[26] = "For who is there of all flesh, that has heard the voice of the living God speaking from the midst of the fire, as we, and has lived?";
web[26] = "For who [is there of] all flesh that hath heard the voice of the living God speaking out of the midst of the fire, as we [have], and lived?";
hnv[26] = "For who is there of all flesh, that has heard the voice of the living God speaking out of the midst of the fire, as we have, and lived?";
vul[26] = "quid est omnis caro ut audiat vocem Dei viventis qui de medio ignis loquitur sicut nos audivimus et possit vivere";
rsv[27] = "Go near, and hear all that the LORD our God will say; and speak to us all that the LORD our God will speak to you; and we will hear and do it.\'";
asv[27] = "Go thou near, and hear all that Jehovah our God shall say: and speak thou unto us all that Jehovah our God shall speak unto thee; and we will hear it, and do it.";
yng[27] = "Draw near thou, and hear all that which Jehovah our God saith, and thou, thou dost speak unto us all that which Jehovah our God speaketh unto thee, and we have hearkened, and done it.";
dby[27] = "Come thou near, and hear all that Jehovah our God will say; and speak thou to us all that Jehovah our God will speak to thee; and we will hear it, and do it.";
web[27] = "Go thou near, and hear all that the LORD our God shall say; and speak thou to us all that the LORD our God shall speak to thee; and we will hear [it], and do [it].";
hnv[27] = "Go you near, and hear all that the LORD our God shall say: and speak you to us all that the LORD our God shall speak to you; and we will hear it, and do it.";
vul[27] = "tu magis accede et audi cuncta quae dixerit Dominus Deus noster tibi loquerisque ad nos et nos audientes faciemus ea";
rsv[28] = "&quot;And the LORD heard your words, when you spoke to me; and the LORD said to me, \'I have heard the words of this people, which they have spoken to you; they have rightly said all that they have spoken.";
asv[28] = "And Jehovah heard the voice of your words, when ye spake unto me; and Jehovah said unto me, I have heard the voice of the words of this people, which they have spoken unto thee: they have well said all that they have spoken.";
yng[28] = "`And Jehovah heareth the voice of your words, in your speaking unto me, and Jehovah saith unto me, I have heard the voice of the words of this people which they have spoken unto thee; they have done well [in] all that they have spoken.";
dby[28] = "And Jehovah heard the voice of your words, when ye spoke to me; and Jehovah said unto me, I have heard the voice of the words of this people that have spoken to thee: they have well spoken all that they have spoken.";
web[28] = "And the LORD heard the voice of your words, when ye spoke to me; and the LORD said to me, I have heard the voice of the words of this people, which they have spoke to thee: they have well said all that they have spoken.";
hnv[28] = " The LORD heard the voice of your words, when you spoke to me; and the LORD said to me, I have heard the voice of the words of this people, which they have spoken to you: they have well said all that they have spoken.";
vul[28] = "quod cum audisset Dominus ait ad me audivi vocem verborum populi huius quae locuti sunt tibi bene omnia sunt locuti";
rsv[29] = "Oh that they had such a mind as this always, to fear me and to keep all my commandments, that it might go well with them and with their children for ever!";
asv[29] = "Oh that there were such a heart in them, that they would fear me, and keep all my commandments always, that it might be well with them, and with their children for ever!";
yng[29] = "O that their heart had been thus to them, to fear Me, and to keep My commands all the days, that it may be well with them, and with their sons -- to the age!";
dby[29] = "Oh that there were such a heart in them, that they would fear me, and keep all my commandments continually, that it might be well with them and with their sons for ever!";
web[29] = "O that there were such a heart in them, that they would fear me, and keep all my commandments always, that it might be well with them, and with their children for ever!";
hnv[29] = "Oh that there were such a heart in them, that they would fear me, and keep all my mitzvot always, that it might be well with them, and with their children forever!";
vul[29] = "quis det talem eos habere mentem ut timeant me et custodiant universa mandata mea in omni tempore ut bene sit eis et filiis eorum in sempiternum";
rsv[30] = "Go and say to them, &quot;Return to your tents.&quot;";
asv[30] = "Go say to them, Return ye to your tents.";
yng[30] = "`Go, say to them, Turn back for yourselves, to your tents;";
dby[30] = "Go, say unto them, Get you into your tents again.";
web[30] = "Go, say to them, Return to your tents again.";
hnv[30] = "Go tell them, Return you to your tents.";
vul[30] = "vade et dic eis revertimini in tentoria vestra";
rsv[31] = "But you, stand here by me, and I will tell you all the commandment and the statutes and the ordinances which you shall teach them, that they may do them in the land which I give them to possess.\'";
asv[31] = "But as for thee, stand thou here by me, and I will speak unto thee all the commandment, and the statutes, and the ordinances, which thou shalt teach them, that they may do them in the land which I give them to possess it.";
yng[31] = "and thou here stand thou with Me, and let Me speak unto thee all the command, and the statutes, and the judgments which thou dost teach them, and they have done in the land which I am giving to them to possess it.";
dby[31] = "But as for thee, stand thou here by me, and I will speak unto thee all the commandments, and the statutes, and the ordinances, which thou shalt teach them, that they may do them in the land which I give them to possess it.";
web[31] = "But as for thee, stand thou here by me, and I will speak to thee all the commandments, and the statutes, and the judgments, which thou shalt teach them, that they may do [them] in the land which I give them to possess it.";
hnv[31] = "But as for you, stand you here by me, and I will speak to you all the mitzvah, and the statutes, and the ordinances, which you shall teach them, that they may do them in the land which I give them to possess it.";
vul[31] = "tu vero hic sta mecum et loquar tibi omnia mandata et caerimonias atque iudicia quae docebis eos ut faciant ea in terra quam dabo illis in possessionem";
rsv[32] = "You shall be careful to do therefore as the LORD your God has commanded you; you shall not turn aside to the right hand or to the left.";
asv[32] = "Ye shall observe to do therefore as Jehovah your God hath commanded you: ye shall not turn aside to the right hand or to the left.";
yng[32] = "`And ye have observed to do as Jehovah your God hath commanded you, ye turn not aside -- right or left;";
dby[32] = "Take heed then to do as Jehovah your God hath commanded you: turn not aside to the right hand or to the left.";
web[32] = "Ye shall observe to do therefore as the LORD your God hath commanded you: ye shall not turn aside to the right hand or to the left.";
hnv[32] = "You shall observe to do therefore as the LORD your God has commanded you: you shall not turn aside to the right hand or to the left.";
vul[32] = "custodite igitur et facite quae praecepit Dominus Deus vobis non declinabitis neque ad dextram neque ad sinistram";
rsv[33] = "You shall walk in all the way which the LORD your God has commanded you, that you may live, and that it may go well with you, and that you may live long in the land which you shall possess.";
asv[33] = "Ye shall walk in all the way which Jehovah your God hath commanded you, that ye may live, and that it may be well with you, and that ye may prolong your days in the land which ye shall possess.";
yng[33] = "in all the way which Jehovah your God hath commanded you ye walk, so that ye live, and [it is] well with you, and ye have prolonged days in the land which ye possess.";
dby[33] = "In all the way that Jehovah your God hath commanded you shall ye walk, that ye may live, and that it may be well with you, and that ye may prolong your days in the land which ye shall possess.";
web[33] = "Ye shall walk in all the ways which the LORD your God hath commanded you, that ye may live, and [that it may be] well with you, and [that] ye may prolong [your] days in the land which ye shall possess.";
hnv[33] = "You shall walk in all the way which the LORD your God has commanded you, that you may live, and that it may be well with you, and that you may prolong your days in the land which you shall possess.";
vul[33] = "sed per viam quam praecepit Dominus Deus vester ambulabitis ut vivatis et bene sit vobis et protelentur dies in terra possessionis vestrae";
