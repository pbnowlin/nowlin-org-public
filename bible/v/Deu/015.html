csb[1] = "&quot;At the end of every seven years you must cancel debts.";
csb[2] = "&quot;This is how to cancel debt: Every creditor is to cancel what he has lent his neighbor. He is not to collect anything from his neighbor or brother, because the LORD\'s release of debts has been proclaimed.";
csb[3] = "&quot;You may collect something from a foreigner, but you must forgive whatever your brother owes you.";
csb[4] = "&quot;There will be no poor among you, however, because the LORD is certain to bless you in the land the LORD your God is giving you to possess as an inheritance --";
csb[5] = "&quot;if only you obey the LORD your God and are careful to follow every one of these commands I am giving you today.";
csb[6] = "&quot;When the LORD your God blesses you as he has promised you, you will lend to many nations but not borrow; you will rule many nations, but they will not rule you.";
csb[7] = "&quot;If there is a poor person among you, one of your brothers within any of your city gates in the land the LORD your God is giving you, do not be hardhearted or tightfisted toward your poor brother.";
csb[8] = "&quot;Instead, you are to open your hand to him and freely loan him enough for whatever need he has.";
csb[9] = "&quot;Be careful that there isn\'t this wicked thought in your heart, \'The seventh year, the year of canceling debts, is near,\' and you are stingy toward your poor brother and give him nothing. He will cry out to the LORD against you, and you will be guilty.";
csb[10] = "&quot;Give to him, and don\'t have a stingy heart when you give, and because of this the LORD your God will bless you in all your work and in everything you do.";
csb[11] = "&quot;For there will never cease to be poor people in the land; that is why I am commanding you, \'Open your hand willingly to your poor and needy brother in your land.\'";
csb[12] = "&quot;If your fellow Hebrew, a man or woman, is sold to you and serves you six years, you must set him free in the seventh year.";
csb[13] = "&quot;When you set him free, do not send him away empty-handed.";
csb[14] = "&quot;Give generously to him from your flock, your threshing floor, and your winepress. You are to give him whatever the LORD your God has blessed you with.";
csb[15] = "&quot;Remember that you were a slave in the land of Egypt and the LORD your God redeemed you; that is why I am giving you this command today.";
csb[16] = "&quot;But if your slave says to you, \'I don\'t want to leave you,\' because he loves you and your family, and is well off with you,";
csb[17] = "&quot;take an awl and pierce through his ear into the door, and he will become your slave for life. Also treat your female slave the same way.";
csb[18] = "&quot;Do not regard it as a hardship when you set him free, because he worked for you six years -- worth twice the wages of a hired worker. Then the LORD your God will bless you in everything you do.";
csb[19] = "&quot;Consecrate to the LORD your God every firstborn male produced by your herd and flock. You are not to put the firstborn of your oxen to work or shear the firstborn of your flock.";
csb[20] = "&quot;Each year you and your family are to eat it before the LORD your God in the place the LORD chooses.";
csb[21] = "&quot;But if there is a defect in the animal, if it is lame or blind or has any serious defect, you may not sacrifice it to the LORD your God.";
csb[22] = "&quot;Eat it within your city gates; both the unclean person and the clean may eat it, as though it were a gazelle or deer.";
csb[23] = "&quot;But you must not eat its blood; pour it on the ground like water.";
