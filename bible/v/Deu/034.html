csb[1] = "Then Moses went up from the plains of Moab to Mount Nebo, to the top of Pisgah, which faces Jericho, and the LORD showed him all the land: Gilead as far as Dan,";
csb[2] = "all of Naphtali, the land of Ephraim and Manasseh, all the land of Judah as far as the Mediterranean Sea,";
csb[3] = "the Negev, and the plain in the Valley of Jericho, the City of Palms, as far as Zoar.";
csb[4] = "The LORD then said to him, &quot;This is the land I promised Abraham, Isaac, and Jacob, \'I will give it to your descendants.\' I have let you see it with your own eyes, but you will not cross into it.&quot;";
csb[5] = "So Moses the servant of the LORD died there in the land of Moab, according to the LORD\'s word.";
csb[6] = "He buried him in the valley in the land of Moab facing Beth-peor, and no one to this day knows where his grave is.";
csb[7] = "Moses was one hundred twenty years old when he died; his eyes were not weak, and his vitality had not left him.";
csb[8] = "The Israelites wept for Moses in the plains of Moab thirty days. Then the days of weeping and mourning for Moses came to an end.";
csb[9] = "Joshua son of Nun was filled with the spirit of wisdom because Moses had laid his hands on him. So the Israelites obeyed him and did as the LORD had commanded Moses.";
csb[10] = "No prophet has arisen again in Israel like Moses, whom the LORD knew face to face.";
csb[11] = "He was unparalleled for all the signs and wonders the LORD sent him to do against the land of Egypt -- to Pharaoh, to all his officials, and to all his land,";
csb[12] = "and for all the mighty acts of power and terrifying deeds that Moses performed in the sight of all Israel.";
