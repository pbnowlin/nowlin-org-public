csb[1] = "&quot;Carefully follow every command I am giving you today, so that you may live and increase, and may enter and take possession of the land the LORD swore to your fathers.";
csb[2] = "&quot;Remember that the LORD your God led you on the entire journey these forty years in the wilderness, so that he might humble you and test you to know what was in your heart, whether or not you would keep his commands.";
csb[3] = "&quot;He humbled you by letting you go hungry; then he gave you manna to eat, which you and your fathers had not known, so that you might learn that man does not live on bread alone but on every word that comes from the mouth of the LORD.";
csb[4] = "&quot;Your clothing did not wear out, and your feet did not swell these forty years.";
csb[5] = "&quot;Keep in mind that the LORD your God has been disciplining you just as a man disciplines his son.";
csb[6] = "&quot;So keep the commands of the LORD your God by walking in his ways and fearing him.";
csb[7] = "&quot;For the LORD your God is bringing you into a good land, a land with streams, springs, and deep water sources, flowing in both valleys and hills;";
csb[8] = "&quot;a land of wheat, barley, vines, figs, and pomegranates; a land of olive oil and honey;";
csb[9] = "&quot;a land where you will eat food without shortage, where you will lack nothing; a land whose rocks are iron and from whose hills you will mine copper.";
csb[10] = "&quot;When you eat and are full, you will bless the LORD your God for the good land he has given you.";
csb[11] = "&quot;Be careful that you don\'t forget the LORD your God by failing to keep his commands, ordinances, and statutes that I am giving you today.";
csb[12] = "&quot;When you eat and are full, and build beautiful houses to live in,";
csb[13] = "&quot;and your herds and flocks grow large, and your silver and gold multiply, and everything else you have increases,";
csb[14] = "&quot;be careful that your heart doesn\'t become proud and you forget the LORD your God who brought you out of the land of Egypt, out of the place of slavery.";
csb[15] = "&quot;He led you through the great and terrible wilderness with its poisonous snakes and scorpions, a thirsty land where there was no water. He brought water out of the flint rock for you.";
csb[16] = "&quot;He fed you in the wilderness with manna, which your fathers had not known, in order to humble and test you, so that in the end he might cause you to prosper.";
csb[17] = "&quot;You may say to yourself, \'My power and my own ability have gained this wealth for me,\'";
csb[18] = "&quot;but remember that the LORD your God gives you the power to gain wealth, in order to confirm his covenant he swore to your fathers, as it is today.";
csb[19] = "&quot;If you ever forget the LORD your God and follow other gods to serve them and bow in worship to them, I testify against you today that you will perish.";
csb[20] = "&quot;Like the nations the LORD is about to destroy before you, you will perish if you do not obey the LORD your God.";
