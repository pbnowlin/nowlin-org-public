csb[1] = "&quot;The Levitical priests, the whole tribe of Levi, will have no portion or inheritance with Israel. They will eat the LORD\'s fire offerings; that is their inheritance.";
csb[2] = "&quot;Although Levi has no inheritance among his brothers, the LORD is his inheritance, as he promised him.";
csb[3] = "&quot;This is the priests\' share from the people who offer a sacrifice, whether it is an ox, a sheep, or a goat; the priests are to be given the shoulder, jaws, and stomach.";
csb[4] = "&quot;You are to give him the firstfruits of your grain, new wine, and fresh oil, and the first sheared wool of your flock.";
csb[5] = "&quot;For the LORD your God has chosen him and his sons from all your tribes to stand and minister in his name from now on.";
csb[6] = "&quot;When a Levite leaves one of your towns in Israel where he was staying and wants to go to the place the LORD chooses,";
csb[7] = "&quot;he may serve in the name of the LORD his God like all his fellow Levites who minister there in the presence of the LORD.";
csb[8] = "&quot;They will eat equal portions besides what he has received from the sale of the family estate.";
csb[9] = "&quot;When you enter the land the LORD your God is giving you, do not imitate the detestable customs of those nations.";
csb[10] = "&quot;No one among you is to sacrifice his son or daughter in the fire, practice divination, tell fortunes, interpret omens, practice sorcery,";
csb[11] = "&quot;cast spells, consult a medium or a spiritist, or inquire of the dead.";
csb[12] = "&quot;Everyone who does these acts is detestable to the LORD, and the LORD your God is driving out the nations before you because of these detestable acts.";
csb[13] = "&quot;You must be blameless before the LORD your God.";
csb[14] = "&quot;Though these nations you are about to drive out listen to fortune-tellers and diviners, the LORD your God has not permitted you to do this.";
csb[15] = "&quot;The LORD your God will raise up for you a prophet like me from among your own brothers. You must listen to him.";
csb[16] = "&quot;This is what you requested from the LORD your God at Horeb on the day of the assembly when you said, \'Let us not continue to hear the voice of the LORD our God or see this great fire any longer, so that we will not die! \'";
csb[17] = "&quot;Then the LORD said to me, \'They have spoken well.";
csb[18] = "&quot;I will raise up for them a prophet like you from among their brothers. I will put my words in his mouth, and he will tell them everything I command him.";
csb[19] = "&quot;I will hold accountable whoever does not listen to my words that he speaks in my name.";
csb[20] = "&quot;But the prophet who presumes to speak a message in my name that I have not commanded him to speak, or who speaks in the name of other gods -- that prophet must die.\'";
csb[21] = "&quot;You may say to yourself, \'How can we recognize a message the LORD has not spoken? \'";
csb[22] = "&quot;When a prophet speaks in the LORD\'s name, and the message does not come true or is not fulfilled, that is a message the LORD has not spoken. The prophet has spoken it presumptuously. Do not be afraid of him.";
kjv[1] = "The priests the Levites, [and] all the tribe of Levi, shall have no part nor inheritance with Israel: they shall eat the offerings of the LORD made by fire, and his inheritance.";
kjv[2] = "Therefore shall they have no inheritance among their brethren: the LORD [is] their inheritance, as he hath said unto them.";
kjv[3] = "And this shall be the priest\'s due from the people, from them that offer a sacrifice, whether [it be] ox or sheep; and they shall give unto the priest the shoulder, and the two cheeks, and the maw.";
kjv[4] = "The firstfruit [also] of thy corn, of thy wine, and of thine oil, and the first of the fleece of thy sheep, shalt thou give him.";
kjv[5] = "For the LORD thy God hath chosen him out of all thy tribes, to stand to minister in the name of the LORD, him and his sons for ever.";
kjv[6] = "And if a Levite come from any of thy gates out of all Israel, where he sojourned, and come with all the desire of his mind unto the place which the LORD shall choose;";
kjv[7] = "Then he shall minister in the name of the LORD his God, as all his brethren the Levites [do], which stand there before the LORD.";
kjv[8] = "They shall have like portions to eat, beside that which cometh of the sale of his patrimony.";
kjv[9] = "When thou art come into the land which the LORD thy God giveth thee, thou shalt not learn to do after the abominations of those nations.";
kjv[10] = "There shall not be found among you [any one] that maketh his son or his daughter to pass through the fire, [or] that useth divination, [or] an observer of times, or an enchanter, or a witch,";
kjv[11] = "Or a charmer, or a consulter with familiar spirits, or a wizard, or a necromancer.";
kjv[12] = "For all that do these things [are] an abomination unto the LORD: and because of these abominations the LORD thy God doth drive them out from before thee.";
kjv[13] = "Thou shalt be perfect with the LORD thy God.";
kjv[14] = "For these nations, which thou shalt possess, hearkened unto observers of times, and unto diviners: but as for thee, the LORD thy God hath not suffered thee so [to do].";
kjv[15] = "The LORD thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken;";
kjv[16] = "According to all that thou desiredst of the LORD thy God in Horeb in the day of the assembly, saying, Let me not hear again the voice of the LORD my God, neither let me see this great fire any more, that I die not.";
kjv[17] = "And the LORD said unto me, They have well [spoken that] which they have spoken.";
kjv[18] = "I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth; and he shall speak unto them all that I shall command him.";
kjv[19] = "And it shall come to pass, [that] whosoever will not hearken unto my words which he shall speak in my name, I will require [it] of him.";
kjv[20] = "But the prophet, which shall presume to speak a word in my name, which I have not commanded him to speak, or that shall speak in the name of other gods, even that prophet shall die.";
kjv[21] = "And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?";
kjv[22] = "When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that [is] the thing which the LORD hath not spoken, [but] the prophet hath spoken it presumptuously: thou shalt not be afraid of him.";

rsv[21] = "And if you say in your heart, \'How may we know the word which the LORD has not spoken?\'--";
asv[21] = "And if thou say in thy heart, How shall we know the word which Jehovah hath not spoken?";
yng[21] = "`And when thou sayest in thy heart, How do we know the word which Jehovah hath not spoken? --";
dby[21] = "And if thou say in thy heart, How shall we know the word that Jehovah hath not spoken?";
web[21] = "And if thou shalt say in thy heart, How shall we know the word which the LORD hath not spoken?";
hnv[21] = "If you say in your heart, How shall we know the word which the LORD has not spoken?";
vul[21] = "quod si tacita cogitatione responderis quomodo possum intellegere verbum quod non est locutus Dominus";
rsv[22] = "when a prophet speaks in the name of the LORD, if the word does not come to pass or come true, that is a word which the LORD has not spoken; the prophet has spoken it presumptuously, you need not be afraid of him.";
asv[22] = "when a prophet speaketh in the name of Jehovah, if the thing follow not, nor come to pass, that is the thing which Jehovah hath not spoken: the prophet hath spoken it presumptuously, thou shalt not be afraid of him.";
yng[22] = "that which the prophet speaketh in the name of Jehovah, and the thing is not, and cometh not -- it [is] the word which Jehovah hath not spoken; in presumption hath the prophet spoken it; -- thou art not afraid of him.";
dby[22] = "When a prophet speaketh in the name of Jehovah, and the thing followeth not, nor cometh to pass, that is the word which Jehovah hath not spoken; the prophet hath spoken it presumptuously: be not afraid of him.";
web[22] = "When a prophet speaketh in the name of the LORD, if the thing doth not follow, nor come to pass, that [is] the thing which the LORD hath not spoken, [but] the prophet hath spoken it presumptuously: thou shalt not be afraid of him.";
hnv[22] = "when a prophet speaks in the name of the LORD, if the thing doesn\'t follow, nor happen, that is the thing which the LORD has not spoken: the prophet has spoken it presumptuously, you shall not be afraid of him.";
vul[22] = "hoc habebis signum quod in nomine Domini propheta ille praedixerit et non evenerit hoc Dominus non locutus est sed per tumorem animi sui propheta confinxit et idcirco non timebis eum";
