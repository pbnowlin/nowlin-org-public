csb[1] = "&quot;If a prophet or someone who has dreams arises among you and proclaims a sign or wonder to you,";
csb[2] = "&quot;and that sign or wonder he has promised you comes about, but he says, \'Let us follow other gods,\' which you have not known, \'and let us worship them,\'";
csb[3] = "&quot;do not listen to that prophet\'s words or to that dreamer. For the LORD your God is testing you to know whether you love the LORD your God with all your heart and all your soul.";
csb[4] = "&quot;You must follow the LORD your God and fear him. You must keep his commands and listen to him; you must worship him and remain faithful to him.";
csb[5] = "&quot;That prophet or dreamer must be put to death, because he has urged rebellion against the LORD your God who brought you out of the land of Egypt and redeemed you from the place of slavery, to turn you from the way the LORD your God has commanded you to walk. You must purge the evil from you.";
csb[6] = "&quot;If your brother, the son of your mother, or your son or daughter, or the wife you embrace, or your closest friend secretly entices you, saying, \'Let us go and worship other gods\' -- which neither you nor your fathers have known,";
csb[7] = "&quot;any of the gods of the peoples around you, near you or far from you, from one end of the earth to the other --";
csb[8] = "&quot;do not yield to him or listen to him. Show him no pity, and do not spare him or shield him.";
csb[9] = "&quot;Instead, you must kill him. Your hand is to be the first against him to put him to death, and then the hands of all the people.";
csb[10] = "&quot;Stone him to death for trying to turn you away from the LORD your God who brought you out of the land of Egypt, out of the place of slavery.";
csb[11] = "&quot;All Israel will hear and be afraid, and they will no longer do anything evil like this among you.";
csb[12] = "&quot;If you hear it said about one of your cities the LORD your God is giving you to live in,";
csb[13] = "&quot;that wicked men have sprung up among you, led the inhabitants of their city astray, and said, \'Let us go and worship other gods,\' which you have not known,";
csb[14] = "&quot;you are to inquire, investigate, and interrogate thoroughly. If the report turns out to be true that this detestable act has been done among you,";
csb[15] = "&quot;you must strike down the inhabitants of that city with the sword. Completely destroy everyone in it as well as its livestock with the sword.";
csb[16] = "&quot;You are to gather all its spoil in the middle of the city square and completely burn the city and all its spoil for the LORD your God. The city is to remain a mound of ruins forever; it is not to be rebuilt.";
csb[17] = "&quot;Nothing set apart for destruction is to remain in your hand, so that the LORD will turn from his burning anger and grant you mercy, show you compassion, and multiply you as he swore to your fathers.";
csb[18] = "&quot;This will occur if you obey the LORD your God, keeping all his commands I am giving you today, doing what is right in the sight of the LORD your God.";
