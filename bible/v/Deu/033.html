csb[1] = "This is the blessing that Moses, the man of God, gave the Israelites before his death.";
csb[2] = "He said: The LORD came from Sinai and appeared to them from Seir; he shone on them from Mount Paran and came with ten thousand holy ones, with lightning from his right hand for them.";
csb[3] = "Indeed he loves the people. All your holy ones are in your hand, and they assemble at your feet. Each receives your words.";
csb[4] = "Moses gave us instruction, a possession for the assembly of Jacob.";
csb[5] = "So he became King in Jeshurun when the leaders of the people gathered with the tribes of Israel.";
csb[6] = "Let Reuben live and not die though his people become few.";
csb[7] = "He said this about Judah: LORD, hear Judah\'s cry and bring him to his people. He fights for his cause with his own hands, but may you be a help against his foes.";
csb[8] = "He said about Levi: Your Thummim and Urim belong to your faithful one; you tested him at Massah and contended with him at the Waters of Meribah.";
csb[9] = "He said about his father and mother, &quot;I do not regard them.&quot; He disregarded his brothers and didn\'t acknowledge his sons, for they kept your word and maintained your covenant.";
csb[10] = "They will teach your ordinances to Jacob and your instruction to Israel; they will set incense before you and whole burnt offerings on your altar.";
csb[11] = "LORD, bless his possessions, and accept the work of his hands. Break the back of his adversaries and enemies, so that they cannot rise again.";
csb[12] = "He said about Benjamin: The LORD\'s beloved rests securely on him. He shields him all day long, and he rests on his shoulders.";
csb[13] = "He said about Joseph: May his land be blessed by the LORD with the dew of heaven\'s bounty and the watery depths that lie beneath;";
csb[14] = "with the bountiful harvest from the sun and the abundant yield of the seasons;";
csb[15] = "with the best products of the ancient mountains and the bounty of the eternal hills;";
csb[16] = "with the choice gifts of the land and everything in it; and with the favor of him who appeared in the burning bush. May these rest on the head of Joseph, on the brow of the prince of his brothers.";
csb[17] = "His firstborn bull has splendor, and horns like those of a wild ox; he gores all the peoples with them to the ends of the earth. Such are the ten thousands of Ephraim, and such are the thousands of Manasseh.";
csb[18] = "He said about Zebulun: Rejoice, Zebulun, in your journeys, and Issachar, in your tents.";
csb[19] = "They summon the peoples to a mountain; there they offer acceptable sacrifices. For they draw from the wealth of the seas and the hidden treasures of the sand.";
csb[20] = "He said about Gad: The one who enlarges Gad\'s territory will be blessed. He lies down like a lion and tears off an arm or even a head.";
csb[21] = "He chose the best part for himself, because a ruler\'s portion was assigned there for him. He came with the leaders of the people; he carried out the LORD\'s justice and his ordinances for Israel.";
csb[22] = "He said about Dan: Dan is a young lion, leaping out of Bashan.";
csb[23] = "He said about Naphtali: Naphtali, enjoying approval, full of the LORD\'s blessing, take possession to the west and the south.";
csb[24] = "He said about Asher: May Asher be the most blessed of the sons; may he be the most favored among his brothers and dip his foot in olive oil.";
csb[25] = "May the bolts of your gate be iron and bronze, and your strength last as long as you live.";
csb[26] = "There is none like the God of Jeshurun, who rides the heavens to your aid, the clouds in his majesty.";
csb[27] = "The God of old is your dwelling place, and underneath are the everlasting arms. He drives out the enemy before you and commands, &quot;Destroy! &quot;";
csb[28] = "So Israel dwells securely; Jacob lives untroubled in a land of grain and new wine; even his skies drip with dew.";
csb[29] = "How happy you are, Israel! Who is like you, a people saved by the LORD? He is the shield that protects you, the sword you boast in. Your enemies will cringe before you, and you will tread on their backs.";
kjv[1] = "And this [is] the blessing, wherewith Moses the man of God blessed the children of Israel before his death.";

dby[1] = "And this is the blessing, wherewith Moses the man of God blessed the children of Israel before his death.";
web[1] = "And this [is] the with which Moses, the man of God, blessed the children of Israel before his death.";
hnv[1] = "This is the blessing, with which Moshe the man of God blessed the children of Yisra\'el before his death.";
vul[1] = "haec est benedictio qua benedixit Moses homo Dei filiis Israhel ante mortem suam";
kjv[2] = "And he said, The LORD came from Sinai, and rose up from Seir unto them; he shined forth from mount Paran, and he came with ten thousands of saints: from his right hand [went] a fiery law for them.";
rsv[2] = "He said, &quot;The LORD came from Sinai, and dawned from Se\'ir upon us; he shone forth from Mount Paran, he came from the ten thousands of holy ones, with flaming fire at his right hand.";
asv[2] = "And he said, Jehovah came from Sinai, And rose from Seir unto them; He shined forth from mount Paran, And he came from the ten thousands of holy ones: At his right hand was a fiery law for them. ";
yng[2] = "and he saith: -- `Jehovah from Sinai hath come, And hath risen from Seir for them; He hath shone from mount Paran, And hath come [with] myriads of holy ones; At His right hand [are] springs for them.";
dby[2] = "And he said, Jehovah came from Sinai, And rose up from Seir unto them; He shone forth from mount Paran, And he came from the myriads of the sanctuary; From his right hand [went forth] a law of fire for them.";
web[2] = "And he said, the LORD came from Sinai, and rose up from Seir to them; he shined forth from mount Paran, and he came with ten thousands of saints: from his right hand [went] a fiery law for them.";
hnv[2] = "He said, The LORD came from Sinai, Rose from Se`ir to them; He shined forth from Mount Paran, He came from the ten thousands of holy ones: At his right hand was a fiery law for them.";
vul[2] = "et ait Dominus de Sina venit et de Seir ortus est nobis apparuit de monte Pharan et cum eo sanctorum milia in dextera eius ignea lex";
kjv[3] = "Yea, he loved the people; all his saints [are] in thy hand: and they sat down at thy feet; [every one] shall receive of thy words.";
rsv[3] = "Yea, he loved his people; all those consecrated to him were in his hand; so they followed in thy steps, receiving direction from thee,";
asv[3] = "Yea, he loveth the people; All his saints are in thy hand: And they sat down at thy feet; [Every one] shall receive of thy words. ";
yng[3] = "Also He [is] loving the peoples; All His holy ones [are] in thy hand, And they -- they sat down at thy foot, [Each] He lifteth up at thy words.";
dby[3] = "Yea, he loveth the peoples, All his saints are in thy hand, And they sit down at thy feet; Each receiveth of thy words.";
web[3] = "Yea, he loved the people; all his saints [are] in thy hand: and they sat down at thy feet; [every one] shall receive of thy words.";
hnv[3] = "Yes, he loves the people; All his holy ones are in your hand: They sat down at your feet; [Everyone] shall receive of your words.";
vul[3] = "dilexit populos omnes sancti in manu illius sunt et qui adpropinquant pedibus eius accipient de doctrina illius";

rsv[4] = "when Moses commanded us a law, as a possession for the assembly of Jacob.";

yng[4] = "A law hath Moses commanded us, A possession of the assembly of Jacob.";
dby[4] = "Moses commanded us a law, The inheritance of the congregation of Jacob.";
web[4] = "Moses commanded us a law; [even] the inheritance of the congregation of Jacob.";
hnv[4] = "Moshe commanded us a law, An inheritance for the assembly of Ya`akov.";

rsv[5] = "Thus the LORD became king in Jesh\'urun, when the heads of the people were gathered, all the tribes of Israel together.";
asv[5] = "And he was king in Jeshurun, When the heads of the people were gathered, All the tribes of Israel together. ";
yng[5] = "And he is in Jeshurun king, In the heads of the people gathering together, The tribes of Israel!";
dby[5] = "And he was king in Jeshurun, When the heads of the people And the tribes of Israel were gathered together.";
web[5] = "And he was king in Jeshurun, when the heads of the people [and] the tribes of Israel were assembled.";
hnv[5] = "He was king in Yeshurun, When the heads of the people were gathered, All the tribes of Yisra\'el together.";

kjv[6] = "Let Reuben live, and not die; and let [not] his men be few.";
rsv[6] = "&quot;Let Reuben live, and not die, nor let his men be few.&quot;";
asv[6] = "Let Reuben live, and not die; Nor let his men be few. ";

dby[6] = "Let Reuben live, and not die; And let his men be few.";
web[6] = "Let Reuben live, and not die; and let [not] his men be few.";

kjv[7] = "And this [is the blessing] of Judah: and he said, Hear, LORD, the voice of Judah, and bring him unto his people: let his hands be sufficient for him; and be thou an help [to him] from his enemies.";
rsv[7] = "And this he said of Judah: &quot;Hear, O LORD, the voice of Judah, and bring him in to his people. With thy hands contend for him, and be a help against his adversaries.&quot;";
asv[7] = "And this is [the blessing] of Judah: and he said, Hear, Jehovah, the voice of Judah, And bring him in unto his people. With his hands he contended for himself; And thou shalt be a help against his adversaries. ";
yng[7] = "And this [is] for Judah; and he saith: -- Hear, O Jehovah, the voice of Judah, And unto his people do Thou bring him in; His hand hath striven for him, And an help from his adversaries art Thou.";
dby[7] = "And this of Judah; and he said, Hear, Jehovah, the voice of Judah, And bring him unto his people; May his hands strive for them; And be thou a help to him against his oppressors.";
web[7] = "And this [is the blessing] of Judah: and he said, Hear, LORD, the voice of Judah, and bring him to his people: let his hands be sufficient for him, and be thou a help [to him] from his enemies.";
hnv[7] = "This is [the blessing] of Yehudah: and he said, Hear, LORD, the voice of Yehudah, Bring him in to his people. With his hands he contended for himself; You shall be a help against his adversaries.";
vul[7] = "haec est Iudae benedictio audi Domine vocem Iudae et ad populum suum introduc eum manus eius pugnabunt pro eo et adiutor illius contra adversarios eius erit";
kjv[8] = "And of Levi he said, [Let] thy Thummim and thy Urim [be] with thy holy one, whom thou didst prove at Massah, [and with] whom thou didst strive at the waters of Meribah;";

asv[8] = "And of Levi he said, Thy Thummim and thy Urim are with thy godly one, Whom thou didst prove at Massah, With whom thou didst strive at the waters of Meribah; ";
yng[8] = "And of Levi he said: -- Thy Thummim and thy Urim [are] for thy pious one, Whom Thou hast tried in Massah, Thou dost strive with Him at the waters of Meribah;";
dby[8] = "And of Levi he said, Thy Thummim and thy Urim are for thy godly one, Whom thou didst prove at Massah, With whom thou didst strive at the waters of Meribah;";

hnv[8] = "Of Levi he said, Your Tummim and your Urim are with your godly one, Whom you did prove at Massah, With whom you did strive at the waters of Merivah;";
vul[8] = "Levi quoque ait perfectio tua et doctrina tua viro sancto tuo quem probasti in Temptatione et iudicasti ad aquas Contradictionis";
kjv[9] = "Who said unto his father and to his mother, I have not seen him; neither did he acknowledge his brethren, nor knew his own children: for they have observed thy word, and kept thy covenant.";

yng[9] = "Who is saying of his father and his mother, I have not seen him; And his brethren he hath not discerned, And his sons he hath not known; For they have observed Thy saying, And Thy covenant they keep.";
dby[9] = "Who said to his father and to his mother, I see him not, And he acknowledged not his brethren, And knew not his own children; For they have observed thy word, And kept thy covenant.";

asv[10] = "They shall teach Jacob thine ordinances, And Israel thy law: They shall put incense before thee, And whole burnt-offering upon thine altar. ";
yng[10] = "They teach Thy judgments to Jacob, And Thy law to Israel; They put perfume in Thy nose, And whole burnt-offering on Thine altar.";
dby[10] = "They shall teach Jacob thine ordinances, And Israel thy law: They shall put incense before thy nostrils, And whole burnt-offering upon thine altar.";
web[10] = "They shall teach Jacob thy judgments, and Israel thy law; they shall put incense before thee, and whole burnt sacrifice upon thy altar.";
hnv[10] = "They shall teach Ya`akov your ordinances, Yisra\'el your law: They shall put incense before you, Whole burnt offering on your altar.";

asv[11] = "Bless, Jehovah, his substance, And accept the work of his hands: Smite through the loins of them that rise up against him, And of them that hate him, that they rise not again. ";
yng[11] = "Bless, O Jehovah, his strength, And the work of his hands Thou acceptest, Smite the loins of his withstanders, And of those hating him -- that they rise not!";
dby[11] = "Bless, Jehovah, his substance! And let the work of his hands please thee; Crush the loins of his adversaries, And of them that hate him, that they may never rise again!";

hnv[11] = "Bless, LORD, his substance, Accept the work of his hands: Smite through the loins of those who rise up against him, Of those who hate him, that they not rise again.";

asv[12] = "Of Benjamin he said, The beloved of Jehovah shall dwell in safety by him; He covereth him all the day long, And he dwelleth between his shoulders. ";
yng[12] = "Of Benjamin he said: -- The beloved of Jehovah doth tabernacle confidently by him, Covering him over all the day; Yea, between his shoulders He doth tabernacle.";
dby[12] = "Of Benjamin he said, The beloved of Jehovah, -- he shall dwell in safety by him; He will cover him all the day long, And dwell between his shoulders.";

kjv[16] = "And for the precious things of the earth and fulness thereof, and [for] the good will of him that dwelt in the bush: let [the blessing] come upon the head of Joseph, and upon the top of the head of him [that was] separated from his brethren.";
rsv[16] = "with the best gifts of the earth and its fulness, and the favor of him that dwelt in the bush. Let these come upon the head of Joseph, and upon the crown of the head of him that is prince among his brothers.";
asv[16] = "And for the precious things of the earth and the fulness thereof, And the good will of him that dwelt in the bush. Let [the blessing] come upon the head of Joseph, And upon the crown of the head of him that was separate from his brethren. ";
yng[16] = "And by precious things -- of earth and its fulness, And the good pleasure Of Him who is dwelling in the bush, -- Let it come for the head of Joseph, And for the crown of him Who is separate from his brethren.";
dby[16] = "And by the precious things of the earth and the fulness thereof. And let the good will of him that dwelt in the bush Come upon the head of Joseph, Upon the top of the head of him that was separated from his brethren.";
web[16] = "And for the precious things of the earth and fullness of it, and [for] the good will of him that dwelt in the bush; let [the blessing] come upon the head of Joseph, and upon the top of the head of him that was separated from his brethren.";
hnv[16] = "For the precious things of the eretz and the fullness of it, The good will of him who lived in the bush. Let [the blessing] come on the head of Yosef, On the crown of the head of him who was separate from his brothers.";
vul[16] = "et de frugibus terrae et plenitudine eius benedictio illius qui apparuit in rubo veniat super caput Ioseph et super verticem nazarei inter fratres suos";
kjv[17] = "His glory [is like] the firstling of his bullock, and his horns [are like] the horns of unicorns: with them he shall push the people together to the ends of the earth: and they [are] the ten thousands of Ephraim, and they [are] the thousands of Manasseh.";
rsv[17] = "His firstling bull has majesty, and his horns are the horns of a wild ox; with them he shall push the peoples, all of them, to the ends of the earth; such are the ten thousands of E\'phraim, and such are the thousands of Manas\'seh.&quot;";
asv[17] = "The firstling of his herd, majesty is his; And his horns are the horns of the wild-ox: With them he shall push the peoples all of them, [even] the ends of the earth: And they are the ten thousands of Ephraim, And they are the thousands of Manasseh. ";
yng[17] = "His honour [is] a firstling of his ox, And his horns [are] horns of a reem; By them peoples he doth push together To the ends of earth; And they [are] the myriads of Ephraim, And they [are] the thousands of Manasseh.";
dby[17] = "His majesty is as the firstling of his ox; And his horns are as the horns of a buffalo. With them shall he push the peoples Together to the ends of the earth. These are the myriads of Ephraim, And these are the thousands of Manasseh.";
web[17] = "His glory [is like] the firstling of his bullock, and his horns [are like] the horns of unicorns: with them he shall push the people together to the ends of the earth: and they [are] the ten thousands of Ephraim, and they [are] the thousands of Manasseh.";
hnv[17] = "The firstborn of his herd, majesty is his; His horns are the horns of the wild-ox: With them he shall push the peoples all of them, [even] the ends of the eretz: They are the ten thousands of Efrayim, They are the thousands of Menashsheh.";
vul[17] = "quasi primogeniti tauri pulchritudo eius cornua rinocerotis cornua illius in ipsis ventilabit gentes usque ad terminos terrae hae sunt multitudines Ephraim et haec milia Manasse";
kjv[18] = "And of Zebulun he said, Rejoice, Zebulun, in thy going out; and, Issachar, in thy tents.";
rsv[18] = "And of Zeb\'ulun he said, &quot;Rejoice, Zeb\'ulun, in your going out; and Is\'sachar, in your tents.";
asv[18] = "And of Zebulun he said, Rejoice, Zebulun, in thy going out; And, Issachar, in thy tents. ";
yng[18] = "And of Zebulun he said: -- Rejoice, O Zebulun, in thy going out, And, O Issachar, in thy tents;";
dby[18] = "And of Zebulun he said, Rejoice, Zebulun, in thy going out; And thou, Issachar, in thy tents!";
web[18] = "And of Zebulun he said, Rejoice, Zebulun, in thy going out; and Issachar, in thy tents.";
hnv[18] = "Of Zevulun he said, Rejoice, Zevulun, in your going out; Yissakhar, in your tents.";
vul[18] = "et Zabulon ait laetare Zabulon in exitu tuo et Isachar in tabernaculis tuis";
kjv[19] = "They shall call the people unto the mountain; there they shall offer sacrifices of righteousness: for they shall suck [of] the abundance of the seas, and [of] treasures hid in the sand.";
rsv[19] = "They shall call peoples to their mountain; there they offer right sacrifices; for they suck the affluence of the seas and the hidden treasures of the sand.&quot;";
asv[19] = "They shall call the peoples unto the mountain; There shall they offer sacrifices of righteousness: For they shall suck the abundance of the seas, And the hidden treasures of the sand. ";
yng[19] = "Peoples [to] the mountain they call, There they sacrifice righteous sacrifices; For the abundance of the seas they suck, And hidden things hidden in the sand.";
dby[19] = "They shall invite [the] peoples to the mountain; There they shall offer sacrifices of righteousness; For they will suck the abundance of the seas, And the hidden treasures of the sand.";

kjv[20] = "And of Gad he said, Blessed [be] he that enlargeth Gad: he dwelleth as a lion, and teareth the arm with the crown of the head.";

yng[20] = "And of Gad he said: -- Blessed of the Enlarger [is] Gad, As a lioness he doth tabernacle, And hath torn the arm -- also the crown!";

kjv[21] = "And he provided the first part for himself, because there, [in] a portion of the lawgiver, [was he] seated; and he came with the heads of the people, he executed the justice of the LORD, and his judgments with Israel.";

yng[21] = "And he provideth the first part for himself, For there the portion of the lawgiver is covered, And he cometh [with] the heads of the people; The righteousness of Jehovah he hath done, And His judgments with Israel.";
dby[21] = "And he provided the first part for himself, For there was reserved the portion of the lawgiver; And he came with the heads of the people; The justice of Jehovah and his judgments Hath he executed with Israel.";
