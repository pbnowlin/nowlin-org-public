csb[1] = "&quot;Now if you faithfully obey the LORD your God and are careful to follow all his commands I am giving you today, the LORD your God will put you far above all the nations of the earth.";
csb[2] = "&quot;All these blessings will come and overtake you, because you obey the LORD your God:";
csb[3] = "&quot;You will be blessed in the city and blessed in the country.";
csb[4] = "&quot;Your offspring will be blessed, and your land\'s produce, and the offspring of your livestock, including the young of your herds and the newborn of your flocks.";
csb[5] = "&quot;Your basket and kneading bowl will be blessed.";
csb[6] = "&quot;You will be blessed when you come in and blessed when you go out.";
csb[7] = "&quot;The LORD will cause the enemies who rise up against you to be defeated before you. They will march out against you from one direction but flee from you in seven directions.";
csb[8] = "&quot;The LORD will grant you a blessing on your barns and on everything you do; he will bless you in the land the LORD your God is giving you.";
csb[9] = "&quot;The LORD will establish you as his holy people, as he swore to you, if you obey the commands of the LORD your God and walk in his ways.";
csb[10] = "&quot;Then all the peoples of the earth will see that you bear the LORD\'s name, and they will stand in awe of you.";
csb[11] = "&quot;The LORD will make you prosper abundantly with offspring, the offspring of your livestock, and your land\'s produce in the land the LORD swore to your fathers to give you.";
csb[12] = "&quot;The LORD will open for you his abundant storehouse, the sky, to give your land rain in its season and to bless all the work of your hands. You will lend to many nations, but you will not borrow.";
csb[13] = "&quot;The LORD will make you the head and not the tail; you will only move upward and never downward if you listen to the LORD your God\'s commands I am giving you today and are careful to follow them.";
csb[14] = "&quot;Do not turn aside to the right or the left from all the things I am commanding you today, and do not follow other gods to worship them.";
csb[15] = "&quot;But if you do not obey the LORD your God by carefully following all his commands and statutes I am giving you today, all these curses will come and overtake you:";
csb[16] = "&quot;You will be cursed in the city and cursed in the country.";
csb[17] = "&quot;Your basket and kneading bowl will be cursed.";
csb[18] = "&quot;Your offspring will be cursed, and your land\'s produce, the young of your herds, and the newborn of your flocks.";
csb[19] = "&quot;You will be cursed when you come in and cursed when you go out.";
csb[20] = "&quot;The LORD will send against you curses, confusion, and rebuke in everything you do until you are destroyed and quickly perish, because of the wickedness of your actions in abandoning me.";
csb[21] = "&quot;The LORD will make pestilence cling to you until he has exterminated you from the land you are entering to possess.";
csb[22] = "&quot;The LORD will afflict you with wasting disease, fever, inflammation, burning heat, drought, blight, and mildew; these will pursue you until you perish.";
csb[23] = "&quot;The sky above you will be bronze, and the earth beneath you iron.";
csb[24] = "&quot;The LORD will turn the rain of your land into falling dust; it will descend on you from the sky until you are destroyed.";
csb[25] = "&quot;The LORD will cause you to be defeated before your enemies. You will march out against them from one direction but flee from them in seven directions. You will be an object of horror to all the kingdoms of the earth.";
csb[26] = "&quot;Your corpses will be food for all the birds of the sky and the wild animals of the earth, with no one to scare them away.";
csb[27] = "&quot;The LORD will afflict you with the boils of Egypt, tumors, a festering rash, and scabies, from which you cannot be cured.";
csb[28] = "&quot;The LORD will afflict you with madness, blindness, and mental confusion,";
csb[29] = "&quot;so that at noon you will grope as a blind person gropes in the dark. You will not be successful in anything you do. You will only be oppressed and robbed continually, and no one will help you.";
csb[30] = "&quot;You will become engaged to a woman, but another man will rape her. You will build a house but not live in it. You will plant a vineyard but not enjoy its fruit.";
csb[31] = "&quot;Your ox will be slaughtered before your eyes, but you will not eat any of it. Your donkey will be taken away from you and not returned to you. Your flock will be given to your enemies, and no one will help you.";
csb[32] = "&quot;Your sons and daughters will be given to another people, while your eyes grow weary looking for them every day. But you will be powerless to do anything.";
csb[33] = "&quot;A people you don\'t know will eat your land\'s produce and everything you have labored for. You will only be oppressed and crushed continually.";
csb[34] = "&quot;You will be driven mad by what you see.";
csb[35] = "&quot;The LORD will afflict you with painful and incurable boils on your knees and thighs -- from the sole of your foot to the top of your head.";
csb[36] = "&quot;The LORD will bring you and your king that you have appointed to a nation neither you nor your fathers have known, and there you will worship other gods, of wood and stone.";
csb[37] = "&quot;You will become an object of horror, scorn, and ridicule among all the peoples where the LORD will drive you.";
csb[38] = "&quot;You will sow much seed in the field but harvest little, because locusts will devour it.";
csb[39] = "&quot;You will plant and cultivate vineyards but not drink the wine or gather the grapes, because worms will eat them.";
csb[40] = "&quot;You will have olive trees throughout your territory but not moisten your skin with oil, because your olives will drop off.";
csb[41] = "&quot;You will father sons and daughters, but they will not remain yours, because they will be taken prisoner.";
csb[42] = "&quot;Buzzing insects will take possession of all your trees and your land\'s produce.";
csb[43] = "&quot;The resident alien among you will rise higher and higher above you, while you sink lower and lower.";
csb[44] = "&quot;He will lend to you, but you won\'t lend to him. He will be the head, and you will be the tail.";
csb[45] = "&quot;All these curses will come, pursue, and overtake you until you are destroyed, since you did not obey the LORD your God and keep the commands and statutes he gave you.";
csb[46] = "&quot;These curses will be a sign and a wonder against you and your descendants forever.";
csb[47] = "&quot;Because you didn\'t serve the LORD your God with joy and a cheerful heart, even though you had an abundance of everything,";
csb[48] = "&quot;you will serve your enemies the LORD will send against you, in famine, thirst, nakedness, and a lack of everything. He will place an iron yoke on your neck until he has destroyed you.";
csb[49] = "&quot;The LORD will bring a nation from far away, from the ends of the earth, to swoop down on you like an eagle, a nation whose language you won\'t understand,";
csb[50] = "&quot;a ruthless nation, showing no respect for the old and not sparing the young.";
csb[51] = "&quot;They will eat the offspring of your livestock and your land\'s produce until you are destroyed. They will leave you no grain, new wine, fresh oil, young of your herds, or newborn of your flocks until they cause you to perish.";
csb[52] = "&quot;They will besiege you within all your city gates until your high and fortified walls, that you trust in, come down throughout your land. They will besiege you within all your city gates throughout the land the LORD your God has given you.";
csb[53] = "&quot;You will eat your offspring, the flesh of your sons and daughters the LORD your God has given you during the siege and hardship your enemy imposes on you.";
csb[54] = "&quot;The most sensitive and refined man among you will look grudgingly at his brother, the wife he embraces, and the rest of his children,";
csb[55] = "&quot;refusing to share with any of them his children\'s flesh that he will eat because he has nothing left during the siege and hardship your enemy imposes on you in all your towns.";
csb[56] = "&quot;The most sensitive and refined woman among you, who would not venture to set the sole of her foot on the ground because of her refinement and sensitivity, will begrudge the husband she embraces, her son, and her daughter,";
csb[57] = "&quot;the afterbirth that comes out from between her legs and the children she bears, because she will secretly eat them for lack of anything else during the siege and hardship your enemy imposes on you within your city gates.";
csb[58] = "&quot;If you are not careful to obey all the words of this law, which are written in this scroll, by fearing this glorious and awe-inspiring name -- the LORD, your God --";
csb[59] = "&quot;he will bring wondrous plagues on you and your descendants, severe and lasting plagues, and terrible and chronic sicknesses.";
csb[60] = "&quot;He will afflict you again with all the diseases of Egypt, which you dreaded, and they will cling to you.";
csb[61] = "&quot;The LORD will also afflict you with every sickness and plague not recorded in the book of this law, until you are destroyed.";
csb[62] = "&quot;Though you were as numerous as the stars of the sky, you will be left with only a few people, because you did not obey the LORD your God.";
csb[63] = "&quot;Just as the LORD was glad to cause you to prosper and to multiply you, so he will also be glad to cause you to perish and to destroy you. You will be ripped out of the land you are entering to possess.";
csb[64] = "&quot;Then the LORD will scatter you among all peoples from one end of the earth to the other, and there you will worship other gods, of wood and stone, which neither you nor your fathers have known.";
csb[65] = "&quot;You will find no peace among those nations, and there will be no resting place for the sole of your foot. There the LORD will give you a trembling heart, failing eyes, and a despondent spirit.";
csb[66] = "&quot;Your life will hang in doubt before you. You will be in dread night and day, never certain of survival.";
csb[67] = "&quot;In the morning you will say, \'If only it were evening! \' and in the evening you will say, \'If only it were morning! \' -- because of the dread you will have in your heart and because of what you will see.";
csb[68] = "&quot;The LORD will take you back in ships to Egypt by a route that I said you would never see again. There you will sell yourselves to your enemies as male and female slaves, but no one will buy you.&quot;";

dby[36] = "Jehovah will bring thee, and thy king whom thou shalt set over thee, unto a nation that neither thou nor thy fathers have known, and there shalt thou serve other gods, wood and stone.";

hnv[39] = "You shall plant vineyards and dress them, but you shall neither drink of the wine, nor gather [the grapes]; for the worm shall eat them.";

asv[42] = "All thy trees and the fruit of thy ground shall the locust possess.";

kjv[51] = "And he shall eat the fruit of thy cattle, and the fruit of thy land, until thou be destroyed: which [also] shall not leave thee [either] corn, wine, or oil, [or] the increase of thy kine, or flocks of thy sheep, until he have destroyed thee.";

kjv[52] = "And he shall besiege thee in all thy gates, until thy high and fenced walls come down, wherein thou trustedst, throughout all thy land: and he shall besiege thee in all thy gates throughout all thy land, which the LORD thy God hath given thee.";

kjv[57] = "And toward her young one that cometh out from between her feet, and toward her children which she shall bear: for she shall eat them for want of all [things] secretly in the siege and straitness, wherewith thine enemy shall distress thee in thy gates.";
rsv[57] = "her afterbirth that comes out from between her feet and her children whom she bears, because she will eat them secretly, for want of all things, in the siege and in the distress with which your enemy shall distress you in your towns.";
asv[57] = "and toward her young one that cometh out from between her feet, and toward her children whom she shall bear; for she shall eat them for want of all things secretly, in the siege and in the distress wherewith thine enemy shall distress thee in thy gates.";
yng[57] = "and against her seed which cometh out from between her feet, even against her sons whom she doth bear, for she doth eat them for the lacking of all things in secret, in the siege and in the straitness with which thine enemy doth straiten thee within thy gates.";
dby[57] = "because of her afterbirth which hath come out between her feet, and her children whom she shall bear; for she shall secretly eat them for want of everything in the siege and in the straitness wherewith thine enemy shall distress thee in thy gates.";
web[57] = "And towards her young one, her own offspring, and towards her children which she shall bear: for she shall eat them for want of all [things] secretly in the siege and straitness with which thy enemy shall distress thee in thy gates.";
hnv[57] = "and toward her young one who comes out from between her feet, and toward her children whom she shall bear; for she shall eat them for want of all things secretly, in the siege and in the distress with which your enemy shall distress you in your gates.";
vul[57] = "et inluvie secundarum quae egrediuntur de medio feminum eius et super liberis qui eadem hora nati sunt comedent enim eos clam propter rerum omnium penuriam in obsidione et vastitate qua opprimet te inimicus tuus intra portas tuas";
kjv[58] = "If thou wilt not observe to do all the words of this law that are written in this book, that thou mayest fear this glorious and fearful name, THE LORD THY GOD;";
rsv[58] = "&quot;If you are not careful to do all the words of this law which are written in this book, that you may fear this glorious and awful name, the LORD your God,";
asv[58] = "If thou wilt not observe to do all the words of this law that are written in this book, that thou mayest fear this glorious and fearful name, JEHOVAH THY GOD;";
yng[58] = "`If thou dost not observe to do all the words of this law which are written in this book, to fear this honoured and fearful name -- Jehovah thy God --";
dby[58] = "If thou wilt not take heed to do all the words of this law that are written in this book, to fear this glorious and fearful name, JEHOVAH THY GOD;";
web[58] = "If thou wilt not observe to do all the words of this law that are written in this book, that thou mayest fear this glorious and fearful name, THE LORD THY GOD;";
hnv[58] = "If you will not observe to do all the words of this law that are written in this book, that you may fear this glorious and fearful name, THE LORD YOUR GOD;";
vul[58] = "nisi custodieris et feceris omnia verba legis huius quae scripta sunt in hoc volumine et timueris nomen eius gloriosum et terribile hoc est Dominum Deum tuum";
kjv[59] = "Then the LORD will make thy plagues wonderful, and the plagues of thy seed, [even] great plagues, and of long continuance, and sore sicknesses, and of long continuance.";
rsv[59] = "then the LORD will bring on you and your offspring extraordinary afflictions, afflictions severe and lasting, and sicknesses grievous and lasting.";
asv[59] = "then Jehovah will make thy plagues wonderful, and the plagues of thy seed, even great plagues, and of long continuance, and sore sicknesses, and of long continuance.";
yng[59] = "then hath Jehovah made wonderful thy strokes, and the strokes of thy seed -- great strokes, and stedfast, and evil sicknesses, and stedfast.";
dby[59] = "then Jehovah will make thy plagues wonderful, and the plagues of thy seed, great and persistent plagues and evil and persistent sicknesses;";
web[59] = "Then the LORD will make thy plagues wonderful, and the plagues of thy seed, [even] great plagues, and of long continuance, and severe sicknesses, and of long continuance.";
hnv[59] = "then the LORD will make your plagues wonderful, and the plagues of your seed, even great plagues, and of long continuance, and sore sicknesses, and of long continuance.";
vul[59] = "augebit Dominus plagas tuas et plagas seminis tui plagas magnas et perseverantes infirmitates pessimas et perpetuas";
kjv[60] = "Moreover he will bring upon thee all the diseases of Egypt, which thou wast afraid of; and they shall cleave unto thee.";
rsv[60] = "And he will bring upon you again all the diseases of Egypt, which you were afraid of; and they shall cleave to you.";
asv[60] = "And he will bring upon thee again all the diseases of Egypt, which thou wast afraid of; and they shall cleave unto thee.";
yng[60] = "`And He hath brought back on thee all the diseases of Egypt, of the presence of which thou hast been afraid, and they have cleaved to thee;";
dby[60] = "and he will bring upon thee all the diseases of Egypt which thou art afraid of, and they shall cleave unto thee.";
web[60] = "Moreover, he will bring upon thee all the diseases of Egypt, of which thou wast afraid; and they shall cleave to thee.";
hnv[60] = "He will bring on you again all the diseases of Mitzrayim, which you were afraid of; and they shall cleave to you.";
vul[60] = "et convertet in te omnes adflictiones Aegypti quas timuisti et adherebunt tibi";
kjv[61] = "Also every sickness, and every plague, which [is] not written in the book of this law, them will the LORD bring upon thee, until thou be destroyed.";
rsv[61] = "Every sickness also, and every affliction which is not recorded in the book of this law, the LORD will bring upon you, until you are destroyed.";
asv[61] = "Also every sickness, and every plague, which is not written in the book of this law, them will Jehovah bring upon thee, until thou be destroyed.";
yng[61] = "also every sickness and every stroke which is not written in the book of this law; Jehovah doth cause them to go up upon thee till thou art destroyed,";
dby[61] = "Also every sickness and every plague which is not written in the book of this law, them will Jehovah bring upon thee, until thou be destroyed.";
web[61] = "Also every sickness, and every plague which [is] not written in the book of this law, them will the LORD bring upon thee, until thou art destroyed.";
hnv[61] = "Also every sickness, and every plague, which is not written in the book of this law, them will the LORD bring on you, until you are destroyed.";
vul[61] = "insuper et universos languores et plagas quae non sunt scriptae in volumine legis huius inducet Dominus super te donec te conterat";
kjv[62] = "And ye shall be left few in number, whereas ye were as the stars of heaven for multitude; because thou wouldest not obey the voice of the LORD thy God.";
rsv[62] = "Whereas you were as the stars of heaven for multitude, you shall be left few in number; because you did not obey the voice of the LORD your God.";
asv[62] = "And ye shall be left few in number, whereas ye were as the stars of heaven for multitude; because thou didst not hearken unto the voice of Jehovah thy God.";
yng[62] = "and ye have been left with few men, instead of which ye have been as stars of the heavens for multitude, because thou hast not hearkened to the voice of Jehovah thy God.";
dby[62] = "And ye shall be left a small company, whereas ye were as the stars of heaven for multitude; because thou hast not hearkened to the voice of Jehovah thy God.";
web[62] = "And ye shall be left few in number, whereas ye were as the stars of heaven for multitude; because thou wouldst not obey the voice of the LORD thy God.";
hnv[62] = "You shall be left few in number, whereas you were as the stars of the sky for multitude; because you didn\'t listen to the voice of the LORD your God.";
vul[62] = "et remanebitis pauci numero qui prius eratis sicut astra caeli prae multitudine quoniam non audisti vocem Domini Dei tui";
kjv[63] = "And it shall come to pass, [that] as the LORD rejoiced over you to do you good, and to multiply you; so the LORD will rejoice over you to destroy you, and to bring you to nought; and ye shall be plucked from off the land whither thou goest to possess it.";
rsv[63] = "And as the LORD took delight in doing you good and multiplying you, so the LORD will take delight in bringing ruin upon you and destroying you; and you shall be plucked off the land which you are entering to take possession of it.";
asv[63] = "And it shall come to pass, that, as Jehovah rejoiced over you to do you good, and to multiply you, so Jehovah will rejoice over you to cause you to perish, and to destroy you; and ye shall be plucked from off the land whither thou goest in to possess it.";
yng[63] = "`And it hath been, as Jehovah hath rejoiced over you to do you good, and to multiply you, so doth Jehovah rejoice over you to destroy you, and to lay you waste; and ye have been pulled away from off the ground whither thou art going in to possess it;";
dby[63] = "And it shall come to pass, that as Jehovah rejoiced over you to do you good and to multiply you, so Jehovah will rejoice over you to cause you to perish, and to destroy you; and ye shall be plucked from off the land whereunto thou goest to possess it.";
web[63] = "And it shall come to pass, [that] as the LORD rejoiced over you to do you good, and to multiply you; so the LORD will rejoice over you to destroy you, and to bring you to naught; and ye shall be plucked from off the land whither thou goest to possess it.";
hnv[63] = "It shall happen that as the LORD rejoiced over you to do you good, and to multiply you, so the LORD will rejoice over you to cause you to perish, and to destroy you; and you shall be plucked from off the land where you go in to possess it.";
vul[63] = "et sicut ante laetatus est Dominus super vos bene vobis faciens vosque multiplicans sic laetabitur disperdens vos atque subvertens ut auferamini de terra ad quam ingredieris possidendam";
kjv[64] = "And the LORD shall scatter thee among all people, from the one end of the earth even unto the other; and there thou shalt serve other gods, which neither thou nor thy fathers have known, [even] wood and stone.";
rsv[64] = "And the LORD will scatter you among all peoples, from one end of the earth to the other; and there you shall serve other gods, of wood and stone, which neither you nor your fathers have known.";
asv[64] = "And Jehovah will scatter thee among all peoples, from the one end of the earth even unto the other end of the earth; and there thou shalt serve other gods, which thou hast not known, thou nor thy fathers, even wood and stone.";
yng[64] = "and Jehovah hath scattered thee among all the peoples, from the end of the earth even unto the end of the earth; and thou hast served there other gods which thou hast not known, thou and thy fathers -- wood and stone.";
dby[64] = "And Jehovah will scatter thee among all peoples, from one end of the earth even unto the other end of the earth; and thou shalt there serve other gods, whom thou hast not known, neither thou nor thy fathers, wood and stone.";
web[64] = "And the LORD shall scatter thee among all people from the one end of the earth even to the other; and there thou shalt serve other gods, which neither thou nor thy fathers have known, [even] wood and stone.";
hnv[64] = "The LORD will scatter you among all peoples, from the one end of the eretz even to the other end of the eretz; and there you shall serve other gods, which you have not known, you nor your fathers, even wood and stone.";
vul[64] = "disperget te Dominus in omnes populos a summitate terrae usque ad terminos eius et servies ibi diis alienis quos et tu ignoras et patres tui lignis et lapidibus";
kjv[65] = "And among these nations shalt thou find no ease, neither shall the sole of thy foot have rest: but the LORD shall give thee there a trembling heart, and failing of eyes, and sorrow of mind:";
rsv[65] = "And among these nations you shall find no ease, and there shall be no rest for the sole of your foot; but the LORD will give you there a trembling heart, and failing eyes, and a languishing soul;";
asv[65] = "And among these nations shalt thou find no ease, and there shall be no rest for the sole of thy foot: but Jehovah will give thee there a trembling heart, and failing of eyes, and pining of soul;";
yng[65] = "`And among those nations thou dost not rest, yea, there is no resting-place for the sole of thy foot, and Jehovah hath given to thee there a trembling heart, and failing of eyes, and grief of soul;";
dby[65] = "And among these nations shalt thou have no rest, neither shall the sole of thy foot have a resting-place, and Jehovah shall give thee there a trembling heart, languishing of the eyes, and pining of the soul.";
web[65] = "And among these nations shalt thou find no ease, neither shall the sole of thy foot have rest: but the LORD shall give thee there a trembling heart, and failing of eyes, and sorrow of mind:";
hnv[65] = "Among these nations shall you find no ease, and there shall be no rest for the sole of your foot: but the LORD will give you there a trembling heart, and failing of eyes, and pining of soul;";
vul[65] = "in gentibus quoque illis non quiesces neque erit requies vestigio pedis tui dabit enim tibi Dominus ibi cor pavidum et deficientes oculos et animam maerore consumptam";
kjv[66] = "And thy life shall hang in doubt before thee; and thou shalt fear day and night, and shalt have none assurance of thy life:";
rsv[66] = "your life shall hang in doubt before you; night and day you shall be in dread, and have no assurance of your life.";
asv[66] = "and thy life shall hang in doubt before thee; and thou shalt fear night and day, and shalt have no assurance of thy life.";
yng[66] = "and thy life hath been hanging in suspense before thee, and thou hast been afraid by night and by day, and dost not believe in thy life;";
dby[66] = "And thy life shall hang in suspense before thee; and thou shalt be in terror day and night and shalt be afraid of thy life.";
web[66] = "And thy life shall hang in doubt before thee; and thou shalt fear day and night, and shalt have no assurance of thy life:";
hnv[66] = "and your life shall hang in doubt before you; and you shall fear night and day, and shall have no assurance of your life.";
vul[66] = "et erit vita tua quasi pendens ante te timebis nocte et die et non credes vitae tuae";
kjv[67] = "In the morning thou shalt say, Would God it were even! and at even thou shalt say, Would God it were morning! for the fear of thine heart wherewith thou shalt fear, and for the sight of thine eyes which thou shalt see.";
rsv[67] = "In the morning you shall say, \'Would it were evening!\' and at evening you shall say, \'Would it were morning!\' because of the dread which your heart shall fear, and the sights which your eyes shall see.";
asv[67] = "In the morning thou shalt say, Would it were even! and at even thou shalt say, Would it were morning! for the fear of thy heart which thou shalt fear, and for the sight of thine eyes which thou shalt see.";
yng[67] = "in the morning thou sayest, O that it were evening! and in the evening thou sayest, O that it were morning! from the fear of thy heart, with which thou art afraid, and from the sight of thine eyes which thou seest.";
dby[67] = "In the morning thou shalt say, Would that it were even! and in the evening thou shalt say, Would that it were morning! through the fright of thy heart wherewith thou shalt be in terror, and through the sight of thine eyes which thou shalt see.";
web[67] = "In the morning thou shalt say, O that it were evening, and at evening thou shalt say, O that it were morning! for the fear of thy heart with which thou shalt fear, and for the sight of thy eyes which thou shalt see.";
hnv[67] = "In the morning you shall say, Would it were even! and at even you shall say, Would it were morning! for the fear of your heart which you shall fear, and for the sight of your eyes which you shall see.";
vul[67] = "mane dices quis mihi det vesperum et vespere quis mihi det mane propter cordis tui formidinem qua terreberis et propter ea quae tuis videbis oculis";
kjv[68] = "And the LORD shall bring thee into Egypt again with ships, by the way whereof I spake unto thee, Thou shalt see it no more again: and there ye shall be sold unto your enemies for bondmen and bondwomen, and no man shall buy [you].";
rsv[68] = "And the LORD will bring you back in ships to Egypt, a journey which I promised that you should never make again; and there you shall offer yourselves for sale to your enemies as male and female slaves, but no man will buy you.&quot;";
asv[68] = "And Jehovah will bring thee into Egypt again with ships, by the way whereof I said unto thee, Thou shalt see it no more again: and there ye shall sell yourselves unto your enemies for bondmen and for bondwomen, and no man shall buy you.";
yng[68] = "`And Jehovah hath brought thee back to Egypt with ships, by a way of which I said to thee, Thou dost not add any more to see it, and ye have sold yourselves there to thine enemies, for men-servants and for maid-servants, and there is no buyer.\'";
dby[68] = "And Jehovah will bring thee into Egypt again with ships, by the way whereof I said unto thee, Thou shalt see it again no more; and there ye shall be sold unto your enemies for bondmen and bondwomen, and there shall be no man to buy [you].";
web[68] = "And the LORD shall bring thee into Egypt again with ships, by the way of which I have said to thee, Thou shalt see it no more again: and there ye shall be sold to your enemies for bond-men and bond-women, and no man shall buy [you].";
hnv[68] = "The LORD will bring you into Mitzrayim again with ships, by the way whereof I said to you, You shall see it no more again: and there you shall sell yourselves to your enemies for bondservants and for bondmaids, and no man shall buy you.";
vul[68] = "reducet te Dominus classibus in Aegyptum per viam de qua dixi tibi ut eam amplius non videres ibi venderis inimicis tuis in servos et ancillas et non erit qui emat";
