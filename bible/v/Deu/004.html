csb[1] = "&quot;Now, Israel, listen to the statutes and ordinances I am teaching you to follow, so that you may live, enter, and take possession of the land the LORD, the God of your fathers, is giving you.";
csb[2] = "&quot;You must not add anything to what I command you or take anything away from it, so that you may keep the commands of the LORD your God I am giving you.";
csb[3] = "&quot;Your eyes have seen what the LORD did at Baal-peor, for the LORD your God destroyed every one of you who followed Baal of Peor.";
csb[4] = "&quot;But you who have remained faithful to the LORD your God are all alive today.";
csb[5] = "&quot;Look, I have taught you statutes and ordinances as the LORD my God has commanded me, so that you may follow them in the land you are entering to possess.";
csb[6] = "&quot;Carefully follow them, for this will show your wisdom and understanding in the eyes of the peoples. When they hear about all these statutes, they will say, \'This great nation is indeed a wise and understanding people.\'";
csb[7] = "&quot;For what great nation is there that has a god near to it as the LORD our God is to us whenever we call to him?";
csb[8] = "&quot;And what great nation has righteous statutes and ordinances like this entire law I set before you today?";
csb[9] = "&quot;Only be on your guard and diligently watch yourselves, so that you don\'t forget the things your eyes have seen and so that they don\'t slip from your mind as long as you live. Teach them to your children and your grandchildren.";
csb[10] = "&quot;The day you stood before the LORD your God at Horeb, the LORD said to me, \'Assemble the people before me, and I will let them hear my words, so that they may learn to fear me all the days they live on the earth and may instruct their children.\'";
csb[11] = "&quot;You came near and stood at the base of the mountain, a mountain blazing with fire into the heavens and enveloped in a totally black cloud.";
csb[12] = "&quot;Then the LORD spoke to you from the fire. You kept hearing the sound of the words, but didn\'t see a form; there was only a voice.";
csb[13] = "&quot;He declared his covenant to you. He commanded you to follow the Ten Commandments, which he wrote on two stone tablets.";
csb[14] = "&quot;At that time the LORD commanded me to teach you statutes and ordinances for you to follow in the land you are about to cross into and possess.";
csb[15] = "&quot;Diligently watch yourselves -- because you did not see any form on the day the LORD spoke to you out of the fire at Horeb --";
csb[16] = "&quot;so you don\'t act corruptly and make an idol for yourselves in the shape of any figure: a male or female form,";
csb[17] = "&quot;or the form of any animal on the earth, any winged creature that flies in the sky,";
csb[18] = "&quot;any creature that crawls on the ground, or any fish in the waters under the earth.";
csb[19] = "&quot;When you look to the heavens and see the sun, moon, and stars -- all the stars in the sky -- do not be led astray to bow in worship to them and serve them. The LORD your God has provided them for all people everywhere under heaven.";
csb[20] = "&quot;But the LORD selected you and brought you out of Egypt\'s iron furnace to be a people for his inheritance, as you are today.";
csb[21] = "&quot;The LORD was angry with me on your account. He swore that I would not cross the Jordan and enter the good land the LORD your God is giving you as an inheritance.";
csb[22] = "&quot;I won\'t be crossing the Jordan because I am going to die in this land. But you are about to cross over and take possession of this good land.";
csb[23] = "&quot;Be careful not to forget the covenant of the LORD your God that he made with you, and make an idol for yourselves in the shape of anything he has forbidden you.";
csb[24] = "&quot;For the LORD your God is a consuming fire, a jealous God.";
csb[25] = "&quot;When you have children and grandchildren and have been in the land a long time, and if you act corruptly, make an idol in the form of anything, and do what is evil in the sight of the LORD your God, angering him,";
csb[26] = "&quot;I call heaven and earth as witnesses against you today that you will quickly perish from the land you are about to cross the Jordan to possess. You will not live long there, but you will certainly be destroyed.";
csb[27] = "&quot;The LORD will scatter you among the peoples, and you will be reduced to a few survivors among the nations where the LORD your God will drive you.";
csb[28] = "&quot;There you will worship man-made gods of wood and stone, which cannot see, hear, eat, or smell.";
csb[29] = "&quot;But from there, you will search for the LORD your God, and you will find him when you seek him with all your heart and all your soul.";
csb[30] = "&quot;When you are in distress and all these things have happened to you, in the future you will return to the LORD your God and obey him.";
csb[31] = "&quot;He will not leave you, destroy you, or forget the covenant with your fathers that he swore to them by oath, because the LORD your God is a compassionate God.";
csb[32] = "&quot;Indeed, ask about the earlier days that preceded you, from the day God created mankind on the earth and from one end of the heavens to the other: Has anything like this great event ever happened, or has anything like it been heard of?";
csb[33] = "&quot;Has a people heard God\'s voice speaking from the fire as you have, and lived?";
csb[34] = "&quot;Or has a god attempted to go and take a nation as his own out of another nation, by trials, signs, wonders, and war, by a strong hand and an outstretched arm, by great terrors, as the LORD your God did for you in Egypt before your eyes?";
csb[35] = "&quot;You were shown these things so that you would know that the LORD is God; there is no other besides him.";
csb[36] = "&quot;He let you hear his voice from heaven to instruct you. He showed you his great fire on earth, and you heard his words from the fire.";
csb[37] = "&quot;Because he loved your fathers, he chose their descendants after them and brought you out of Egypt by his presence and great power,";
csb[38] = "&quot;to drive out before you nations greater and stronger than you and to bring you in and give you their land as an inheritance, as is now taking place.";
csb[39] = "&quot;Today, recognize and keep in mind that the LORD is God in heaven above and on earth below; there is no other.";
csb[40] = "&quot;Keep his statutes and commands, which I am giving you today, so that you and your children after you may prosper and so that you may live long in the land the LORD your God is giving you for all time.&quot;";
csb[41] = "Then Moses set apart three cities across the Jordan to the east.";
csb[42] = "Someone could flee there who committed manslaughter, killing his neighbor accidentally without previously hating him. He could flee to one of these cities and stay alive:";
csb[43] = "Bezer in the wilderness on the plateau land, belonging to the Reubenites; Ramoth in Gilead, belonging to the Gadites; or Golan in Bashan, belonging to the Manassites.";
csb[44] = "This is the law Moses gave the Israelites.";
csb[45] = "These are the decrees, statutes, and ordinances Moses proclaimed to them after they came out of Egypt,";
csb[46] = "across the Jordan in the valley facing Beth-peor in the land of King Sihon of the Amorites. He lived in Heshbon, and Moses and the Israelites defeated him after they came out of Egypt.";
csb[47] = "They took possession of his land and the land of Og king of Bashan, the two Amorite kings who were across the Jordan to the east,";
csb[48] = "from Aroer on the rim of the Arnon Valley as far as Mount Sion (that is, Hermon)";
csb[49] = "and all the Arabah on the east side of the Jordan as far as the Dead Sea below the slopes of Pisgah.";

dby[15] = "And take great heed to your souls (for ye saw no form on the day that Jehovah spoke to you in Horeb from the midst of the fire),";
web[15] = "Take ye therefore good heed to yourselves; for ye saw no manner of similitude on the day [that] the LORD spoke to you in Horeb out of the midst of the fire;";
hnv[15] = "Take therefore good heed to yourselves; for you saw no manner of form on the day that the LORD spoke to you in Horev out of the midst of the fire.";
vul[15] = "custodite igitur sollicite animas vestras non vidistis aliquam similitudinem in die qua locutus est Dominus vobis in Horeb de medio ignis";
kjv[16] = "Lest ye corrupt [yourselves], and make you a graven image, the similitude of any figure, the likeness of male or female,";
rsv[16] = "beware lest you act corruptly by making a graven image for yourselves, in the form of any figure, the likeness of male or female,";
asv[16] = "lest ye corrupt yourselves, and make you a graven image in the form of any figure, the likeness of male or female,";
yng[16] = "lest ye do corruptly, and have made to you a graven image, a similitude of any figure, a form of male or female --";
dby[16] = "lest ye corrupt yourselves, and make you a graven image, the form of any figure, the pattern of male or female,";
web[16] = "Lest ye corrupt [yourselves], and make to you a graven image, the similitude of any figure, the likeness of male or female,";
hnv[16] = "Lest you corrupt yourselves, and make yourself an engraved image in the form of any figure, the likeness of male or female,";
vul[16] = "ne forte decepti faciatis vobis sculptam similitudinem aut imaginem masculi vel feminae";
kjv[17] = "The likeness of any beast that [is] on the earth, the likeness of any winged fowl that flieth in the air,";
rsv[17] = "the likeness of any beast that is on the earth, the likeness of any winged bird that flies in the air,";
asv[17] = "the likeness of any beast that is on the earth, the likeness of any winged bird that flieth in the heavens,";
yng[17] = "a form of any beast which [is] in the earth -- a form of any winged bird which flieth in the heavens --";
dby[17] = "the pattern of any beast that is on the earth, the pattern of any winged fowl that flieth in the heaven,";
web[17] = "The likeness of any beast that [is] on the earth, the likeness of any winged fowl that flieth in the air,";
hnv[17] = "the likeness of any animal that is on the eretz, the likeness of any winged bird that flies in the sky,";
vul[17] = "similitudinem omnium iumentorum quae sunt super terram vel avium sub caelo volantium";
kjv[18] = "The likeness of any thing that creepeth on the ground, the likeness of any fish that [is] in the waters beneath the earth:";
rsv[18] = "the likeness of anything that creeps on the ground, the likeness of any fish that is in the water under the earth.";
asv[18] = "the likeness of anything that creepeth on the ground, the likeness of any fish that is in the water under the earth;";
yng[18] = "a form of any creeping thing on the ground -- a form of any fish which [is] in the waters under the earth;";
dby[18] = "the pattern of anything that creepeth on the ground, the pattern of any fish that is in the waters under the earth;";
web[18] = "The likeness of any thing that creepeth on the ground, the likeness of any fish that [is] in the waters beneath the earth:";
hnv[18] = "the likeness of anything that creeps on the ground, the likeness of any fish that is in the water under the eretz;";
vul[18] = "atque reptilium quae moventur in terra sive piscium qui sub terra morantur in aquis";
kjv[19] = "And lest thou lift up thine eyes unto heaven, and when thou seest the sun, and the moon, and the stars, [even] all the host of heaven, shouldest be driven to worship them, and serve them, which the LORD thy God hath divided unto all nations under the whole heaven.";
rsv[19] = "And beware lest you lift up your eyes to heaven, and when you see the sun and the moon and the stars, all the host of heaven, you be drawn away and worship them and serve them, things which the LORD your God has allotted to all the peoples under the whole heaven.";
asv[19] = "and lest thou lift up thine eyes unto heaven, and when thou seest the sun and the moon and the stars, even all the host of heaven, thou be drawn away and worship them, and serve them, which Jehovah thy God hath allotted unto all the peoples under the whole heaven.";
yng[19] = "`And lest thou lift up thine eyes towards the heavens, and hast seen the sun, and the moon, and the stars, all the host of the heavens, and thou hast been forced, and hast bowed thyself to them, and served them, which Jehovah thy God hath apportioned to all the peoples under the whole heavens.";
dby[19] = "and lest thou lift up thine eyes to the heavens, and see the sun, and the moon, and the stars, the whole host of heaven, and be drawn away and bow down to them and serve them, which Jehovah thy God hath assigned unto all peoples under the whole heaven.";
web[19] = "And lest thou shouldst lift up thy eyes to heaven, and when thou seest the sun, and the moon, and the stars, [even] all the host of heaven, shouldst be driven to worship them, and serve them, which the LORD thy God hath divided to all nations under the whole heaven.";
hnv[19] = "and lest you lift up your eyes to the sky, and when you see the sun and the moon and the stars, even all the host of the sky, you are drawn away and worship them, and serve them, which the LORD your God has allotted to all the peoples under the whole sky.";
vul[19] = "ne forte oculis elevatis ad caelum videas solem et lunam et omnia astra caeli et errore deceptus adores ea et colas quae creavit Dominus Deus tuus in ministerium cunctis gentibus quae sub caelo sunt";
kjv[20] = "But the LORD hath taken you, and brought you forth out of the iron furnace, [even] out of Egypt, to be unto him a people of inheritance, as [ye are] this day.";
rsv[20] = "But the LORD has taken you, and brought you forth out of the iron furnace, out of Egypt, to be a people of his own possession, as at this day.";
asv[20] = "But Jehovah hath taken you, and brought you forth out of the iron furnace, out of Egypt, to be unto him a people of inheritance, as at this day.";
yng[20] = "`And you hath Jehovah taken, and He is bringing you out from the iron furnace, from Egypt, to be to Him for a people -- an inheritance, as [at] this day.";
dby[20] = "But you hath Jehovah taken, and hath brought you forth out of the iron furnace, out of Egypt, that ye might be to him a people of inheritance, as it is this day.";
web[20] = "But the LORD hath taken you, and brought you out of the iron furnace, [even] from Egypt, to be to him a people of inheritance, as [ye are] this day.";
hnv[20] = "But the LORD has taken you, and brought you forth out of the iron furnace, out of Mitzrayim, to be to him a people of inheritance, as at this day.";
vul[20] = "vos autem tulit Dominus et eduxit de fornace ferrea Aegypti ut haberet populum hereditarium sicut est in praesenti die";
kjv[21] = "Furthermore the LORD was angry with me for your sakes, and sware that I should not go over Jordan, and that I should not go in unto that good land, which the LORD thy God giveth thee [for] an inheritance:";
rsv[21] = "Furthermore the LORD was angry with me on your account, and he swore that I should not cross the Jordan, and that I should not enter the good land which the LORD your God gives you for an inheritance.";
asv[21] = "Furthermore Jehovah was angry with me for your sakes, and sware that I should not go over the Jordan, and that I should not go in unto that good land, which Jehovah thy God giveth thee for an inheritance:";
yng[21] = "`And Jehovah hath shewed himself wroth with me because of your words, and sweareth to my not passing over the Jordan, and to my not going in unto the good land which Jehovah thy God is giving to thee -- an inheritance;";
dby[21] = "And Jehovah was angry with me on your account, and swore that I should not go over the Jordan, and that I should not enter in to that good land which Jehovah thy God giveth thee [for] an inheritance;";
web[21] = "Furthermore the LORD was angry with me for your sakes, and swore that I should not go over Jordan, and that I should not enter that good land which the LORD thy God giveth thee [for] an inheritance:";
hnv[21] = "Furthermore the LORD was angry with me for your sakes, and swore that I should not go over the Yarden, and that I should not go in to that good land, which the LORD your God gives you for an inheritance:";
vul[21] = "iratusque est Dominus contra me propter sermones vestros et iuravit ut non transirem Iordanem nec ingrederer terram optimam quam daturus est vobis";
kjv[22] = "But I must die in this land, I must not go over Jordan: but ye shall go over, and possess that good land.";
rsv[22] = "For I must die in this land, I must not go over the Jordan; but you shall go over and take possession of that good land.";
asv[22] = "but I must die in this land, I must not go over the Jordan; but ye shall go over, and possess that good land.";
yng[22] = "for I am dying in this land; I am not passing over the Jordan, and ye are passing over, and have possessed this good land.";
dby[22] = "for I shall die in this land, I shall not go over the Jordan; but ye shall go over, and possess this good land.";
web[22] = "But I must die in this land, I must not go over Jordan: but ye shall go over, and possess that good land.";
hnv[22] = "but I must die in this land, I must not go over the Yarden; but you shall go over, and possess that good land.";
vul[22] = "ecce morior in hac humo non transibo Iordanem vos transibitis et possidebitis terram egregiam";
kjv[23] = "Take heed unto yourselves, lest ye forget the covenant of the LORD your God, which he made with you, and make you a graven image, [or] the likeness of any [thing], which the LORD thy God hath forbidden thee.";
rsv[23] = "Take heed to yourselves, lest you forget the covenant of the LORD your God, which he made with you, and make a graven image in the form of anything which the LORD your God has forbidden you.";
asv[23] = "Take heed unto yourselves, lest ye forget the covenant of Jehovah your God, which he made with you, and make you a graven image in the form of anything which Jehovah thy God hath forbidden thee.";
yng[23] = "`Take heed to yourselves, lest ye forget the covenant of Jehovah your God, which He hath made with you, and have made to yourselves a graven image, a similitude of anything [concerning] which Jehovah thy God hath charged thee:";
dby[23] = "Take heed to yourselves lest ye forget the covenant of Jehovah your God, which he made with you, and make yourselves a graven image, the form of anything which Jehovah thy God hath forbidden thee.";
web[23] = "Take heed to yourselves, lest ye forget the covenant of the LORD your God, which he made with you, and make you a graven image, [or] the likeness of any [thing] which the LORD thy God hath forbidden thee.";
hnv[23] = "Take heed to yourselves, lest you forget the covenant of the LORD your God, which he made with you, and make you an engraved image in the form of anything which the LORD your God has forbidden you.";
vul[23] = "cave nequando obliviscaris pacti Domini Dei tui quod pepigit tecum et facias tibi sculptam similitudinem eorum quae fieri Dominus prohibuit";
kjv[24] = "For the LORD thy God [is] a consuming fire, [even] a jealous God.";
rsv[24] = "For the LORD your God is a devouring fire, a jealous God.";
asv[24] = "For Jehovah thy God is a devouring fire, a jealous God.";
yng[24] = "for Jehovah thy God is a fire consuming -- a zealous God.";
dby[24] = "For Jehovah thy God is a consuming fire, a jealous God.";
web[24] = "For the LORD thy God [is] a consuming fire, [even] a jealous God.";
hnv[24] = "For the LORD your God is a devouring fire, a jealous God.";
vul[24] = "quia Dominus Deus tuus ignis consumens est Deus aemulator";
kjv[25] = "When thou shalt beget children, and children\'s children, and ye shall have remained long in the land, and shall corrupt [yourselves], and make a graven image, [or] the likeness of any [thing], and shall do evil in the sight of the LORD thy God, to provoke him to anger:";
rsv[25] = "&quot;When you beget children and children\'s children, and have grown old in the land, if you act corruptly by making a graven image in the form of anything, and by doing what is evil in the sight of the LORD your God, so as to provoke him to anger,";
asv[25] = "When thou shalt beget children, and children\'s children, and ye shall have been long in the land, and shall corrupt yourselves, and make a graven image in the form of anything, and shall do that which is evil in the sight of Jehovah thy God, to provoke him to anger;";
yng[25] = "`When thou begettest sons and sons\' sons, and ye have become old in the land, and have done corruptly, and have made a graven image, a similitude of anything, and have done the evil thing in the eyes of Jehovah, to provoke Him to anger: --";
dby[25] = "When thou begettest sons, and sons\' sons, and ye have remained long in the land, and shall corrupt yourselves, and make a graven image, the form of anything, and do evil in the sight of Jehovah thy God, to provoke him to anger,";
web[25] = "When thou shalt beget children, and children\'s children, and ye shall have remained long in the land, and shall corrupt [yourselves], and make a graven image, [or] the likeness of any [thing], and shall do evil in the sight of the LORD thy God, to provoke him to anger:";
hnv[25] = "When you shall father children, and children\'s children, and you shall have been long in the land, and shall corrupt yourselves, and make an engraved image in the form of anything, and shall do that which is evil in the sight of the LORD your God, to provoke him to anger;";
vul[25] = "si genueritis filios ac nepotes et morati fueritis in terra deceptique feceritis vobis aliquam similitudinem patrantes malum coram Domino Deo vestro ut eum ad iracundiam provocetis";
kjv[26] = "I call heaven and earth to witness against you this day, that ye shall soon utterly perish from off the land whereunto ye go over Jordan to possess it; ye shall not prolong [your] days upon it, but shall utterly be destroyed.";
rsv[26] = "I call heaven and earth to witness against you this day, that you will soon utterly perish from the land which you are going over the Jordan to possess; you will not live long upon it, but will be utterly destroyed.";
asv[26] = "I call heaven and earth to witness against you this day, that ye shall soon utterly perish from off the land whereunto ye go over the Jordan to possess it; ye shall not prolong your days upon it, but shall utterly be destroyed.";
yng[26] = "I have caused to testify against you this day the heavens and the earth, that ye do perish utterly hastily from off the land whither ye are passing over the Jordan to possess it; ye do not prolong days upon it, but are utterly destroyed;";
dby[26] = "I call heaven and earth to witness against you this day, that ye shall soon utterly perish from off the land whereunto ye pass over the Jordan to possess it: ye shall not prolong your days on it, but shall be utterly destroyed.";
web[26] = "I call heaven and earth to witness against you this day, that ye shall soon utterly perish from the land to which ye go over Jordan to possess it; ye shall not prolong [your] days upon it, but shall be utterly destroyed.";
hnv[26] = "I call heaven and eretz to witness against you this day, that you shall soon utterly perish from off the land whereunto you go over the Yarden to possess it; you shall not prolong your days on it, but shall utterly be destroyed.";
vul[26] = "testes invoco hodie caelum et terram cito perituros vos esse de terra quam transito Iordane possessuri estis non habitabitis in ea longo tempore sed delebit vos Dominus";
kjv[27] = "And the LORD shall scatter you among the nations, and ye shall be left few in number among the heathen, whither the LORD shall lead you.";
rsv[27] = "And the LORD will scatter you among the peoples, and you will be left few in number among the nations where the LORD will drive you.";
asv[27] = "And Jehovah will scatter you among the peoples, and ye shall be left few in number among the nations, whither Jehovah shall lead you away.";
yng[27] = "and Jehovah hath scattered you among the peoples, and ye have been left few in number among the nations, whither Jehovah leadeth you,";
dby[27] = "And Jehovah will scatter you among the peoples, and ye shall be left a small company among the nations to which Jehovah will lead you.";
web[27] = "And the LORD shall scatter you among the nations, and ye shall be left few in number among the heathen, whither the LORD shall lead you.";
hnv[27] = "The LORD will scatter you among the peoples, and you shall be left few in number among the nations, where the LORD shall lead you away.";
vul[27] = "atque disperget in omnes gentes et remanebitis pauci in nationibus ad quas vos ducturus est Dominus";
kjv[28] = "And there ye shall serve gods, the work of men\'s hands, wood and stone, which neither see, nor hear, nor eat, nor smell.";
rsv[28] = "And there you will serve gods of wood and stone, the work of men\'s hands, that neither see, nor hear, nor eat, nor smell.";
asv[28] = "And there ye shall serve gods, the work of men\'s hands, wood and stone, which neither see, nor hear, nor eat, nor smell.";
yng[28] = "and ye have served there gods, work of man\'s hands, wood and stone, which see not, nor hear, nor eat, nor smell.";
dby[28] = "And ye shall there serve gods, the work of men\'s hands, wood and stone, which neither see, nor hear, nor eat, nor smell.";
web[28] = "And there ye shall serve gods, the work of men\'s hands, wood and stone, which neither see, nor hear, nor eat, nor smell.";
hnv[28] = "There you shall serve gods, the work of men\'s hands, wood and stone, which neither see, nor hear, nor eat, nor smell.";
vul[28] = "ibique servietis diis qui hominum manu fabricati sunt ligno et lapidi qui non vident non audiunt non comedunt non odorantur";
kjv[29] = "But if from thence thou shalt seek the LORD thy God, thou shalt find [him], if thou seek him with all thy heart and with all thy soul.";
rsv[29] = "But from there you will seek the LORD your God, and you will find him, if you search after him with all your heart and with all your soul.";
asv[29] = "But from thence ye shall seek Jehovah thy God, and thou shalt find him, when thou searchest after him with all thy heart and with all thy soul.";
yng[29] = "`And -- ye have sought from thence Jehovah thy God, and hast found, when thou seekest Him with all thy heart, and with all thy soul,";
dby[29] = "And from thence ye shall seek Jehovah thy God, and thou shalt find him, if thou shalt seek him with thy whole heart and with thy whole soul.";
web[29] = "But if from thence thou shalt seek the LORD thy God, thou shalt find [him], if thou shalt seek him with all thy heart, and with all thy soul.";
hnv[29] = "But from there you shall seek the LORD your God, and you shall find him, when you search after him with all your heart and with all your soul.";
vul[29] = "cumque quaesieris ibi Dominum Deum tuum invenies eum si tamen toto corde quaesieris et tota tribulatione animae tuae";
kjv[30] = "When thou art in tribulation, and all these things are come upon thee, [even] in the latter days, if thou turn to the LORD thy God, and shalt be obedient unto his voice;";
rsv[30] = "When you are in tribulation, and all these things come upon you in the latter days, you will return to the LORD your God and obey his voice,";
asv[30] = "When thou art in tribulation, and all these things are come upon thee, in the latter days thou shalt return to Jehovah thy God, and hearken unto his voice:";
yng[30] = "in distress [being] to thee, and all these things have found thee, in the latter end of the days, and thou hast turned back unto Jehovah thy God, and hast hearkened to His voice;";
dby[30] = "In thy tribulation, and when all these things shall come upon thee, at the end of days, thou shalt return to Jehovah thy God, and shalt hearken to his voice,";
web[30] = "When thou art in tribulation, and all these things have come upon thee, [even] in the latter days, if thou shalt turn to the LORD thy God, and shalt be obedient to his voice;";
hnv[30] = "When you are in oppression, and all these things are come on you, in the latter days you shall return to the LORD your God, and listen to his voice:";
vul[30] = "postquam te invenerint omnia quae praedicta sunt novissimo tempore reverteris ad Dominum Deum tuum et audies vocem eius";
kjv[31] = "(For the LORD thy God [is] a merciful God;) he will not forsake thee, neither destroy thee, nor forget the covenant of thy fathers which he sware unto them.";
rsv[31] = "for the LORD your God is a merciful God; he will not fail you or destroy you or forget the covenant with your fathers which he swore to them.";
asv[31] = "for Jehovah thy God is a merciful God; he will not fail thee, neither destroy thee, nor forget the covenant of thy fathers which he sware unto them.";
yng[31] = "for a merciful God [is] Jehovah thy God; He doth not fail thee, nor destroy thee, nor forget the covenant of thy fathers, which He hath sworn to them.";
dby[31] = "-- for Jehovah thy God is a merciful God, -- he will not forsake thee, neither destroy thee, nor forget the covenant of thy fathers which he swore unto them.";
web[31] = "(For the LORD thy God [is] a merciful God;) he will not forsake thee, neither destroy thee, nor forget the covenant of thy fathers, which he swore to them.";
hnv[31] = "for the LORD your God is a merciful God; he will not fail you, neither destroy you, nor forget the covenant of your fathers which he swore to them.";
vul[31] = "quia Deus misericors Dominus Deus tuus est non dimittet te nec omnino delebit neque obliviscetur pacti in quo iuravit patribus tuis";
kjv[32] = "For ask now of the days that are past, which were before thee, since the day that God created man upon the earth, and [ask] from the one side of heaven unto the other, whether there hath been [any such thing] as this great thing [is], or hath been heard like it?";
rsv[32] = "&quot;For ask now of the days that are past, which were before you, since the day that God created man upon the earth, and ask from one end of heaven to the other, whether such a great thing as this has ever happened or was ever heard of.";
asv[32] = "For ask now of the days that are past, which were before thee, since the day that God created man upon the earth, and from the one end of heaven unto the other, whether there hath been [any such thing] as this great thing is, or hath been heard like it?";
yng[32] = "`For, ask, I pray thee, at the former days which have been before thee, from the day that God prepared man on the earth, and from the [one] end of the heavens even unto the [other] end of the heavens, whether there hath been as this great thing -- or hath been heard like it?";
dby[32] = "For ask now of the days that are past, which were before thee, since the day that God created man on the earth, and from one end of the heavens to the other end of the heavens, whether there hath been anything as this great thing is, or if anything hath been heard like it?";
web[32] = "For ask now of the days that are past, which were before thee, since the day that God created man upon the earth, and [ask] from the one side of heaven to the other, whether there hath been [any such thing] as this great thing [is], or hath been heard like it?";
hnv[32] = "For ask now of the days that are past, which were before you, since the day that God created man on the eretz, and from the one end of the sky to the other, whether there has been [any such thing] as this great thing is, or has been heard like it?";
vul[32] = "interroga de diebus antiquis qui fuerunt ante te ex die quo creavit Deus hominem super terram a summo caeli usque ad summum eius si facta est aliquando huiuscemodi res aut umquam cognitum est";
kjv[33] = "Did [ever] people hear the voice of God speaking out of the midst of the fire, as thou hast heard, and live?";
rsv[33] = "Did any people ever hear the voice of a god speaking out of the midst of the fire, as you have heard, and still live?";
asv[33] = "Did ever a people hear the voice of God speaking out of the midst of the fire, as thou hast heard, and live?";
yng[33] = "Hath a people heard the voice of God speaking out of the midst of the fire, as thou hast heard, thou -- and doth live?";
dby[33] = "Did [ever] people hear the voice of God speaking from the midst of the fire, as thou hast heard, and live?";
web[33] = "Did [ever] people hear the voice of God speaking from the midst of the fire, as thou hast heard, and live?";
hnv[33] = "Did ever a people hear the voice of God speaking out of the midst of the fire, as you have heard, and live?";
vul[33] = "ut audiret populus vocem Dei loquentis de medio ignis sicut tu audisti et vixisti";
kjv[34] = "Or hath God assayed to go [and] take him a nation from the midst of [another] nation, by temptations, by signs, and by wonders, and by war, and by a mighty hand, and by a stretched out arm, and by great terrors, according to all that the LORD your God did for you in Egypt before your eyes?";
rsv[34] = "Or has any god ever attempted to go and take a nation for himself from the midst of another nation, by trials, by signs, by wonders, and by war, by a mighty hand and an outstretched arm, and by great terrors, according to all that the LORD your God did for you in Egypt before your eyes?";
asv[34] = "Or hath God assayed to go and take him a nation from the midst of [another] nation, by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Jehovah your God did for you in Egypt before your eyes?";
yng[34] = "Or hath God tried to go in to take to Himself, a nation from the midst of a nation, by trials, by signs, and by wonders, and by war, and by a strong hand, and by a stretched-out arm, and by great terrors -- according to all that Jehovah your God hath done to you, in Egypt, before your eyes?";
dby[34] = "Or hath God essayed to come to take him a nation from the midst of a nation, by trials, by signs, and by wonders, and by war, and by a powerful hand, and by a stretched-out arm, and by great terrors, according to all that Jehovah your God did for you in Egypt before your eyes?";
web[34] = "Or hath God essayed to go [and] take him a nation from the midst of [another] nation, by temptations, by signs, and by wonders, and by war, and by a mighty hand, and by an out-stretched arm, and by great terrors, according to all that the LORD your God did for you in Egypt before your eyes?";
hnv[34] = "Or has God tried to go and take him a nation from the midst of [another] nation, by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that the LORD your God did for you in Mitzrayim before your eyes?";
vul[34] = "si fecit Deus ut ingrederetur et tolleret sibi gentem de medio nationum per temptationes signa atque portenta per pugnam et robustam manum extentumque brachium et horribiles visiones iuxta omnia quae fecit pro vobis Dominus Deus vester in Aegypto videntibus oculis tuis";
kjv[35] = "Unto thee it was shewed, that thou mightest know that the LORD he [is] God; [there is] none else beside him.";
rsv[35] = "To you it was shown, that you might know that the LORD is God; there is no other besides him.";
asv[35] = "Unto thee it was showed, that thou mightest know that Jehovah he is God; there is none else besides him.";
yng[35] = "Thou, thou hast been shewn [it], to know that Jehovah He [is] God; there is none else besides Him.";
dby[35] = "Unto thee it was shewn, that thou mightest know that Jehovah, he is God -- there is none other besides him.";
web[35] = "To thee it was shown, that thou mightest know that the LORD he [is] God; [there is] none besides him.";
hnv[35] = "To you it was shown, that you might know that the LORD he is God; there is none else besides him.";
vul[35] = "ut scires quoniam Dominus ipse est Deus et non est alius praeter unum";
kjv[36] = "Out of heaven he made thee to hear his voice, that he might instruct thee: and upon earth he shewed thee his great fire; and thou heardest his words out of the midst of the fire.";
rsv[36] = "Out of heaven he let you hear his voice, that he might discipline you; and on earth he let you see his great fire, and you heard his words out of the midst of the fire.";
asv[36] = "Out of heaven he made thee to hear his voice, that he might instruct thee: and upon earth he made thee to see his great fire; and thou heardest his words out of the midst of the fire.";
yng[36] = "`From the heavens He hath caused thee to hear His voice, to instruct thee, and on earth He hath shewed thee His great fire, and His words thou hast heard out of the midst of the fire.";
dby[36] = "From the heavens he made thee hear his voice, that he might instruct thee; and on the earth he shewed thee his great fire; and thou heardest his words from the midst of the fire.";
web[36] = "Out of heaven he made thee to hear his voice, that he might instruct thee; and upon earth he showed thee his great fire; and thou heardst his words from the midst of the fire.";
hnv[36] = " Out of heaven he made you to hear his voice, that he might instruct you: and on eretz he made you to see his great fire; and you heard his words out of the midst of the fire.";
vul[36] = "de caelo te fecit audire vocem suam ut doceret te et in terra ostendit tibi ignem suum maximum et audisti verba illius de medio ignis";
kjv[37] = "And because he loved thy fathers, therefore he chose their seed after them, and brought thee out in his sight with his mighty power out of Egypt;";
rsv[37] = "And because he loved your fathers and chose their descendants after them, and brought you out of Egypt with his own presence, by his great power,";
asv[37] = "And because he loved thy fathers, therefore he chose their seed after them, and brought thee out with his presence, with his great power, out of Egypt;";
yng[37] = "`And because that He hath loved thy fathers, He doth also fix on their seed after them, and doth bring thee out, in His presence, by His great power, from Egypt:";
dby[37] = "And because he loved thy fathers, and chose their seed after them, he brought thee out with his countenance, with his great power, out of Egypt,";
web[37] = "And because he loved thy fathers, therefore he chose their seed after them, and brought thee out of Egypt in his sight with his mighty power.";
hnv[37] = "Because he loved your fathers, therefore he chose their seed after them, and brought you out with his presence, with his great power, out of Mitzrayim;";
vul[37] = "quia dilexit patres tuos et elegit semen eorum post eos eduxitque te praecedens in virtute sua magna ex Aegypto";
kjv[38] = "To drive out nations from before thee greater and mightier than thou [art], to bring thee in, to give thee their land [for] an inheritance, as [it is] this day.";
rsv[38] = "driving out before you nations greater and mightier than yourselves, to bring you in, to give you their land for an inheritance, as at this day;";
asv[38] = "to drive out nations from before thee greater and mightier than thou, to bring thee in, to give thee their land for an inheritance, as at this day.";
yng[38] = "to dispossess nations greater and stronger than thou, from thy presence, to bring thee in to give to thee their land -- an inheritance, as [at] this day.";
dby[38] = "to dispossess nations from before thee greater and mightier than thou art, to bring thee in, to give thee their land for an inheritance, as it is this day.";
web[38] = "To drive out nations from before thee, greater and mightier than thou [art], to bring thee in, to give thee their land [for] an inheritance, as [it is] this day.";
hnv[38] = "to drive out nations from before you greater and mightier than you, to bring you in, to give you their land for an inheritance, as at this day.";
vul[38] = "ut deleret nationes maximas et fortiores te in introitu tuo et introduceret te daretque tibi terram earum in possessionem sicut cernis in praesenti die";
kjv[39] = "Know therefore this day, and consider [it] in thine heart, that the LORD he [is] God in heaven above, and upon the earth beneath: [there is] none else.";
rsv[39] = "know therefore this day, and lay it to your heart, that the LORD is God in heaven above and on the earth beneath; there is no other.";
asv[39] = "Know therefore this day, and lay it to thy heart, that Jehovah he is God in heaven above and upon the earth beneath; there is none else.";
yng[39] = "`And thou hast known to-day, and hast turned [it] back unto thy heart, that Jehovah He [is] God, in the heavens above, and on the earth beneath -- there is none else;";
dby[39] = "Thou shalt know therefore this day, and consider it in thy heart, that Jehovah, he is God in the heavens above, and on the earth beneath: [there is] none else.";
web[39] = "Know therefore this day, and consider [it] in thy heart, that the LORD he [is] God in heaven above, and upon the earth beneath: [there is] none else.";
hnv[39] = "Know therefore this day, and lay it to your heart, that the LORD he is God in heaven above and on the eretz beneath; there is none else.";
vul[39] = "scito ergo hodie et cogitato in corde tuo quod Dominus ipse sit Deus in caelo sursum et in terra deorsum et non sit alius";
kjv[40] = "Thou shalt keep therefore his statutes, and his commandments, which I command thee this day, that it may go well with thee, and with thy children after thee, and that thou mayest prolong [thy] days upon the earth, which the LORD thy God giveth thee, for ever.";
rsv[40] = "Therefore you shall keep his statutes and his commandments, which I command you this day, that it may go well with you, and with your children after you, and that you may prolong your days in the land which the LORD your God gives you for ever.&quot;";
asv[40] = "And thou shalt keep his statutes, and his commandments, which I command thee this day, that it may go well with thee, and with thy children after thee, and that thou mayest prolong thy days in the land, which Jehovah thy God giveth thee, for ever.";
yng[40] = "and thou hast kept His statutes and His commands which I am commanding thee to-day, so that it is well to thee, and to thy sons after thee, and so that thou prolongest days on the ground which Jehovah thy God is giving to thee -- all the days.\'";
dby[40] = "And thou shalt keep his statutes, and his commandments, which I command thee this day, that it may be well with thee and with thy sons after thee, and that thou mayest prolong thy days on the land which Jehovah thy God giveth thee, for ever.";
web[40] = "Thou shalt keep therefore his statutes and his commandments which I command thee this day, that it may be well with thee, and with thy children after thee, and that thou mayest prolong [thy] days upon the earth, which the LORD thy God giveth thee, for ever.";
hnv[40] = "You shall keep his statutes, and his mitzvot, which I command you this day, that it may go well with you, and with your children after you, and that you may prolong your days in the land, which the LORD your God gives you, forever.";
vul[40] = "custodi praecepta eius atque mandata quae ego praecipio tibi ut bene sit tibi et filiis tuis post te et permaneas multo tempore super terram quam Dominus Deus tuus daturus est tibi";
kjv[41] = "Then Moses severed three cities on this side Jordan toward the sunrising;";
rsv[41] = "Then Moses set apart three cities in the east beyond the Jordan,";
asv[41] = "Then Moses set apart three cities beyond the Jordan toward the sunrising;";
yng[41] = "Then Moses separateth three cities beyond the Jordan, towards the sun-rising,";
dby[41] = "Then Moses separated three cities on this side the Jordan toward the sun-rising,";
web[41] = "Then Moses set apart three cities on the side of Jordan, towards the sun-rising;";
hnv[41] = "Then Moshe set apart three cities beyond the Yarden toward the sunrise;";
vul[41] = "tunc separavit Moses tres civitates trans Iordanem ad orientalem plagam";
kjv[42] = "That the slayer might flee thither, which should kill his neighbour unawares, and hated him not in times past; and that fleeing unto one of these cities he might live:";
rsv[42] = "that the manslayer might flee there, who kills his neighbor unintentionally, without being at enmity with him in time past, and that by fleeing to one of these cities he might save his life:";
asv[42] = "that the manslayer might flee thither, that slayeth his neighbor unawares, and hated him not in time past; and that fleeing unto one of these cities he might live:";
yng[42] = "for the fleeing thither of the man-slayer, who slayeth his neighbour unknowingly, and he is not hating him heretofore, and he hath fled unto one of these cities, and he hath lived:";
dby[42] = "that the manslayer might flee thither, who should kill his neighbour unawares, and hated him not previously, that fleeing to one of these cities, he might live:";
web[42] = "That the slayer might flee thither, who should kill his neighbor unawares, and when he had not hated him in times past; and that fleeing to one of these cities he might live:";
hnv[42] = "that the manslayer might flee there, who kills his neighbor unawares, and didn\'t hate him in time past; and that fleeing to one of these cities he might live:";
vul[42] = "ut confugiat ad eas qui occiderit nolens proximum suum nec fuerit inimicus ante unum et alterum diem et ad harum aliquam urbium possit evadere";
kjv[43] = "[Namely], Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites.";
rsv[43] = "Bezer in the wilderness on the tableland for the Reubenites, and Ramoth in Gilead for the Gadites, and Golan in Bashan for the Manas\'sites.";
asv[43] = "[namely], Bezer in the wilderness, in the plain country, for the Reubenites; and Ramoth in Gilead, for the Gadites; and Golan in Bashan, for the Manassites.";
yng[43] = "Bezer, in the wilderness, in the land of the plain, of the Reubenite; and Ramoth, in Gilead, of the Gadite; and Golan, in Bashan, of the Manassahite.";
dby[43] = "Bezer in the wilderness, in the plateau, of the Reubenites, and Ramoth in Gilead, of the Gadites, and Golan in Bashan, of the Manassites.";
web[43] = "[Namely], Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites.";
hnv[43] = "[namely], Betzer in the wilderness, in the plain country, for the Re\'uveni; and Ramot in Gil`ad, for the Gadi; and Galon in Bashan, for the Manashshi.";
vul[43] = "Bosor in solitudine quae sita est in terra campestri de tribu Ruben et Ramoth in Galaad quae est in tribu Gad et Golam in Basan quae est in tribu Manasse";
kjv[44] = "And this [is] the law which Moses set before the children of Israel:";
rsv[44] = "This is the law which Moses set before the children of Israel;";
asv[44] = "And this is the law which Moses set before the children of Israel:";
yng[44] = "And this [is] the law which Moses hath set before the sons of Israel;";
dby[44] = "And this is the law which Moses set before the children of Israel:";
web[44] = "And this [is] the law which Moses set before the children of Israel.";
hnv[44] = "This is the law which Moshe set before the children of Yisra\'el:";
vul[44] = "ista est lex quam proposuit Moses coram filiis Israhel";
kjv[45] = "These [are] the testimonies, and the statutes, and the judgments, which Moses spake unto the children of Israel, after they came forth out of Egypt,";
rsv[45] = "these are the testimonies, the statutes, and the ordinances, which Moses spoke to the children of Israel when they came out of Egypt,";
asv[45] = "these are the testimonies, and the statutes, and the ordinances, which Moses spake unto the children of Israel, when they came forth out of Egypt,";
yng[45] = "these [are] the testimonies, and the statutes, and the judgments, which Moses hath spoken unto the sons of Israel, in their coming out of Egypt,";
dby[45] = "these are the testimonies, and the statutes, and the ordinances that Moses declared to the children of Israel, when they came out of Egypt,";
web[45] = "These [are] the testimonies, and the statutes, and the judgments, which Moses spoke to the children of Israel, after they came forth from Egypt,";
hnv[45] = "these are the testimonies, and the statutes, and the ordinances, which Moshe spoke to the children of Yisra\'el, when they came forth out of Mitzrayim,";
vul[45] = "et haec testimonia et caerimoniae atque iudicia quae locutus est ad filios Israhel quando egressi sunt de Aegypto";
kjv[46] = "On this side Jordan, in the valley over against Bethpeor, in the land of Sihon king of the Amorites, who dwelt at Heshbon, whom Moses and the children of Israel smote, after they were come forth out of Egypt:";
rsv[46] = "beyond the Jordan in the valley opposite Beth-pe\'or, in the land of Sihon the king of the Amorites, who lived at Heshbon, whom Moses and the children of Israel defeated when they came out of Egypt.";
asv[46] = "beyond the Jordan, in the valley over against Beth-peor, in the land of Sihon king of the Amorites, who dwelt at Heshbon, whom Moses and the children of Israel smote, when they came forth out of Egypt.";
yng[46] = "beyond the Jordan, in the valley over-against Beth-Peor, in the land of Sihon, king of the Amorite, who is dwelling in Heshbon, whom Moses and the sons of Israel have smitten, in their coming out of Egypt,";
dby[46] = "on this side the Jordan, in the valley opposite to Beth-Peor, in the land of Sihon the king of the Amorites, who dwelt in Heshbon, whom Moses and the children of Israel smote when they came out of Egypt;";
web[46] = "On the east side of Jordan, in the valley over against Beth-Peor, in the land of Sihon king of the Amorites, who dwelt at Heshbon, whom Moses and the children of Israel smote, after they had come forth from Egypt:";
hnv[46] = "beyond the Yarden, in the valley over against Beit-Pe`or, in the land of Sichon king of the Amori, who lived at Heshbon, whom Moshe and the children of Yisra\'el struck, when they came forth out of Mitzrayim.";
vul[46] = "trans Iordanem in valle contra fanum Phogor in terra Seon regis Amorrei qui habitavit in Esebon quem percussit Moses filii quoque Israhel egressi ex Aegypto";
kjv[47] = "And they possessed his land, and the land of Og king of Bashan, two kings of the Amorites, which [were] on this side Jordan toward the sunrising;";
rsv[47] = "And they took possession of his land and the land of Og the king of Bashan, the two kings of the Amorites, who lived to the east beyond the Jordan;";
asv[47] = "And they took his land in possession, and the land of Og king of Bashan, the two kings of the Amorites, who were beyond the Jordan toward the sunrising;";
yng[47] = "and they possess his land, and the land of Og king of Bashan, two kings of the Amorite who [are] beyond the Jordan, [towards] the sun-rising;";
dby[47] = "and they took possession of his land, and the land of Og the king of Bashan, two kings of the Amorites, who were on this side the Jordan, toward the sun-rising;";
web[47] = "And they possessed his land, and the land of Og king of Bashan, two kings of the Amorites, who [were] on the side of Jordan, towards the sun-rising;";
hnv[47] = "They took his land in possession, and the land of `Og king of Bashan, the two kings of the Amori, who were beyond the Yarden toward the sunrise;";
vul[47] = "possederunt terram eius et terram Og regis Basan duorum regum Amorreorum qui erant trans Iordanem ad solis ortum";
kjv[48] = "From Aroer, which [is] by the bank of the river Arnon, even unto mount Sion, which [is] Hermon,";
rsv[48] = "from Aro\'er, which is on the edge of the valley of the Arnon, as far as Mount Si\'rion (that is, Hermon),";
asv[48] = "from Aroer, which is on the edge of the valley of the Arnon, even unto mount Sion (the same is Hermon),";
yng[48] = "from Aroer, which [is] by the edge of the brook Arnon, even unto mount Sion, which [is] Hermon --";
dby[48] = "from Aroer, which is on the bank of the river Arnon, as far as mount Sion, which is Hermon,";
web[48] = "From Aroer, which [is] by the bank of the river Arnon, even to mount Sion, which [is] Hermon,";
hnv[48] = "from `Aro`er, which is on the edge of the valley of the Arnon, even to Mount Tzion (the same is Hermon),";
vul[48] = "ab Aroer quae sita est super ripam torrentis Arnon usque ad montem Sion qui est et Hermon";
kjv[49] = "And all the plain on this side Jordan eastward, even unto the sea of the plain, under the springs of Pisgah.";
rsv[49] = "together with all the Arabah on the east side of the Jordan as far as the Sea of the Arabah, under the slopes of Pisgah.";
asv[49] = "and all the Arabah beyond the Jordan eastward, even unto the sea of the Arabah, under the slopes of Pisgah.";
yng[49] = "and all the plain beyond the Jordan eastward, even unto the sea of the plain, under the springs of Pisgah.";
dby[49] = "and all the plain on this side the Jordan, eastward, and as far as the sea of the plain, under the slopes of Pisgah.";
web[49] = "And all the plain on the side of Jordan eastward, even to the sea of the plain, under the springs of Pisgah.";
hnv[49] = "and all the `Aravah beyond the Yarden eastward, even to the sea of the `Aravah, under the slopes of Pisgah.";
vul[49] = "omnem planitiem trans Iordanem ad orientalem plagam usque ad mare Solitudinis et usque ad radices montis Phasga";
