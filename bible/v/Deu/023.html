csb[1] = "&quot;No man whose testicles have been crushed or whose penis has been cut off may enter the LORD\'s assembly.";
csb[2] = "&quot;No one of illegitimate birth may enter the LORD\'s assembly; none of his descendants, even to the tenth generation, may enter the LORD\'s assembly.";

csb[4] = "&quot;This is because they did not meet you with food and water on the journey after you came out of Egypt, and because Balaam son of Beor from Pethor in Aram-naharaim was hired to curse you.";
csb[5] = "&quot;Yet the LORD your God would not listen to Balaam, but he turned the curse into a blessing for you because the LORD your God loves you.";
csb[6] = "&quot;Never pursue their welfare or prosperity as long as you live.";
csb[7] = "&quot;Do not despise an Edomite, because he is your brother. Do not despise an Egyptian, because you were a resident alien in his land.";
csb[8] = "&quot;The children born to them in the third generation may enter the LORD\'s assembly.";
csb[9] = "&quot;When you are encamped against your enemies, be careful to avoid anything offensive.";
csb[10] = "&quot;If there is a man among you who is unclean because of a bodily emission during the night, he must go outside the camp; he may not come anywhere inside the camp.";
csb[11] = "&quot;When evening approaches, he is to wash with water, and when the sun sets he may come inside the camp.";
csb[12] = "&quot;You are to have a place outside the camp and go there to relieve yourself.";
csb[13] = "&quot;You are to have a digging tool in your equipment; when you relieve yourself, dig a hole with it and cover up your excrement.";
csb[14] = "&quot;For the LORD your God walks throughout your camp to protect you and deliver your enemies to you; so your encampments must be holy. He must not see anything indecent among you or he will turn away from you.";
csb[15] = "&quot;Do not return a slave to his master when he has escaped from his master to you.";
csb[16] = "&quot;Let him live among you wherever he wants within your city gates. Do not mistreat him.";
csb[17] = "&quot;No Israelite woman is to be a cult prostitute, and no Israelite man is to be a cult prostitute.";

csb[19] = "&quot;Do not charge your brother interest on silver, food, or anything that can earn interest.";

csb[22] = "&quot;But if you refrain from making a vow, it will not be counted against you as sin.";
csb[23] = "&quot;Be careful to do whatever comes from your lips, because you have freely vowed what you promised to the LORD your God.";
