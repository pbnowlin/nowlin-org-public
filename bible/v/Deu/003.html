csb[1] = "&quot;Then we turned and went up the road to Bashan, and King Og of Bashan came out against us with his whole army to do battle at Edrei.";
csb[2] = "&quot;But the LORD said to me, \'Do not fear him, for I have handed him over to you along with his whole army and his land. Do to him as you did to King Sihon of the Amorites, who lived in Heshbon.\'";
csb[3] = "&quot;So the LORD our God also handed over King Og of Bashan and his whole army to us. We struck him until there was no survivor left.";
csb[4] = "&quot;We captured all his cities at that time. There wasn\'t a city that we didn\'t take from them: sixty cities, the entire region of Argob, the kingdom of Og in Bashan.";
csb[5] = "&quot;All these were fortified with high walls, gates, and bars, besides a large number of rural villages.";
csb[6] = "&quot;We completely destroyed them, as we had done to King Sihon of Heshbon, destroying the men, women, and children of every city.";
csb[7] = "&quot;But we took all the livestock and the spoil from the cities as plunder for ourselves.";
csb[8] = "&quot;At that time we took the land from the two Amorite kings across the Jordan, from the Arnon Valley as far as Mount Hermon,";
csb[9] = "&quot;which the Sidonians call Sirion, but the Amorites call Senir,";
csb[10] = "&quot;all the cities of the plateau, Gilead, and Bashan as far as Salecah and Edrei, cities of Og\'s kingdom in Bashan.";
csb[11] = "&quot;(Only King Og of Bashan was left of the remnant of the Rephaim. His bed was made of iron. Isn\'t it in Rabbah of the Ammonites? It is 13 1/2 feet long and 6 feet wide by a standard measure.)";
csb[12] = "&quot;At that time we took possession of this land. I gave to the Reubenites and Gadites the area extending from Aroer by the Arnon Valley, and half the hill country of Gilead along with its cities.";
csb[13] = "&quot;I gave to half the tribe of Manasseh the rest of Gilead and all Bashan, the kingdom of Og. The entire region of Argob, the whole territory of Bashan, used to be called the land of the Rephaim.";
csb[14] = "&quot;Jair, a descendant of Manasseh, took over the entire region of Argob as far as the border of the Geshurites and Maacathites. He called Bashan by his own name, Jair\'s Villages, as it is today.";
csb[15] = "&quot;I gave Gilead to Machir,";
csb[16] = "&quot;and I gave to the Reubenites and Gadites the area extending from Gilead to the Arnon Valley (the middle of the valley was the border) and up to the Jabbok River, the border of the Ammonites.";
csb[17] = "&quot;The Arabah and Jordan are also borders from Chinnereth as far as the Sea of the Arabah, the Dead Sea, under the slopes of Pisgah on the east.";
csb[18] = "&quot;I commanded you at that time: The LORD your God has given you this land to possess. All your valiant men will cross over in battle formation ahead of your brothers the Israelites.";
csb[19] = "&quot;But your wives, dependents, and livestock -- I know that you have a lot of livestock -- will remain in the cities I have given you";
csb[20] = "&quot;until the LORD gives rest to your brothers as he has to you, and they also take possession of the land the LORD your God is giving them across the Jordan. Then each of you may return to his possession that I have given you.";
csb[21] = "&quot;I commanded Joshua at that time: Your own eyes have seen everything the LORD your God has done to these two kings. The LORD will do the same to all the kingdoms you are about to enter.";
csb[22] = "&quot;Don\'t be afraid of them, for the LORD your God fights for you.";
csb[23] = "&quot;At that time I begged the LORD:";
csb[24] = "&quot;Lord GOD, you have begun to show your greatness and your strong hand to your servant, for what god is there in heaven or on earth who can perform deeds and mighty acts like yours?";
csb[25] = "&quot;Please let me cross over and see the beautiful land on the other side of the Jordan, that good hill country and Lebanon.";
csb[26] = "&quot;But the LORD was angry with me because of you and would not listen to me. The LORD said to me, \'That\'s enough! Do not speak to me again about this matter.";
csb[27] = "&quot;Go to the top of Pisgah and look to the west, north, south, and east, and see it with your own eyes, for you will not cross the Jordan.";
csb[28] = "&quot;But commission Joshua and encourage and strengthen him, for he will cross over ahead of the people and enable them to inherit this land that you will see.\'";
csb[29] = "&quot;So we stayed in the valley facing Beth-peor.";
kjv[1] = "All the cities of the plain, and all Gilead, and all Bashan, unto Salchah and Edrei, cities of the kingdom of Og in Bashan.";

kjv[2] = "For only Og king of Bashan remained of the remnant of giants; behold, his bedstead [was] a bedstead of iron; [is] it not in Rabbath of the children of Ammon? nine cubits [was] the length thereof, and four cubits the breadth of it, after the cubit of a man.";
rsv[2] = "But the LORD said to me, \'Do not fear him; for I have given him and all his people and his land into your hand; and you shall do to him as you did to Sihon the king of the Amorites, who dwelt at Heshbon.\'";
asv[2] = "And Jehovah said unto me, Fear him not; for I have delivered him, and all his people, and his land, into thy hand; and thou shalt do unto him as thou didst unto Sihon king of the Amorites, who dwelt at Heshbon.";
yng[2] = "`And Jehovah saith unto me, Fear him not, for into thy hand I have given him, and all his people, and his land, and thou hast done to him as thou hast done to Sihon king of the Amorite who is dwelling in Heshbon.";
dby[2] = "And Jehovah said to me, Fear him not; for into thy hand have I given him, and all his people, and his land; and thou shalt do unto him as thou didst unto Sihon the king of the Amorites, who dwelt at Heshbon.";

vul[2] = "dixitque Dominus ad me ne timeas eum quia in manu tua traditus est cum omni populo ac terra sua faciesque ei sicut fecisti Seon regi Amorreorum qui habitavit in Esebon";

rsv[3] = "So the LORD our God gave into our hand Og also, the king of Bashan, and all his people; and we smote him until no survivor was left to him.";
asv[3] = "So Jehovah our God delivered into our hand Og also, the king of Bashan, and all his people: and we smote him until none was left to him remaining.";

kjv[11] = "Until the LORD have given rest unto your brethren, as well as unto you, and [until] they also possess the land which the LORD your God hath given them beyond Jordan: and [then] shall ye return every man unto his possession, which I have given you.";
rsv[11] = "(For only Og the king of Bashan was left of the remnant of the Reph\'aim; behold, his bedstead was a bedstead of iron; is it not in Rabbah of the Ammonites? Nine cubits was its length, and four cubits its breadth, according to the common cubit.)";
asv[11] = "(For only Og king of Bashan remained of the remnant of the Rephaim; behold, his bedstead was a bedstead of iron; is it not in Rabbah of the children of Ammon? nine cubits was the length thereof, and four cubits the breadth of it, after the cubit of a man.)";
yng[11] = "for only Og king of Bashan had been left of the remnant of the Rephaim; lo, his bedstead [is] a bedstead of iron; is it not in Rabbath of the sons of Ammon? nine cubits its length, and four cubits its breadth, by the cubit of a man.";
dby[11] = "For only Og the king of Bashan remained of the residue of giants: behold, his bedstead was a bedstead of iron; is it not in Rabbah of the children of Ammon? its length was nine cubits, and its breadth four cubits, after the cubit of a man.";
web[11] = "For only Og king of Bashan remained of the remnant of giants; behold, his bedstead [was] a bedstead of iron; [is] it not in Rabbath of the children of Ammon? nine cubits [was] the length of it, and four cubits the breadth of it, after the cubit of a man.";
hnv[11] = "(For only `Og king of Bashan remained of the remnant of the Refa\'im; behold, his bedstead was a bedstead of iron; isn\'t it in Rabbah of the children of `Ammon? nine cubits was the length of it, and four cubits the breadth of it, after the cubit of a man.)";
vul[11] = "solus quippe Og rex Basan restiterat de stirpe gigantum monstratur lectus eius ferreus qui est in Rabbath filiorum Ammon novem cubitos habens longitudinis et quattuor latitudinis ad mensuram cubiti virilis manus";
kjv[12] = "And I commanded Joshua at that time, saying, Thine eyes have seen all that the LORD your God hath done unto these two kings: so shall the LORD do unto all the kingdoms whither thou passest.";
rsv[12] = "&quot;When we took possession of this land at that time, I gave to the Reubenites and the Gadites the territory beginning at Aro\'er, which is on the edge of the valley of the Arnon, and half the hill country of Gilead with its cities;";

vul[12] = "terramque possedimus in tempore illo ab Aroer quae est super ripam torrentis Arnon usque ad mediam partem montis Galaad et civitates illius dedi Ruben et Gad";

kjv[14] = "And I besought the LORD at that time, saying,";
rsv[14] = "Ja\'ir the Manas\'site took all the region of Argob, that is, Bashan, as far as the border of the Gesh\'urites and the Ma-ac\'athites, and called the villages after his own name, Hav\'voth-ja\'ir, as it is to this day.)";

vul[14] = "Iair filius Manasse possedit omnem regionem Argob usque ad terminos Gesuri et Machathi vocavitque ex nomine suo Basan Avothiair id est villas Iair usque in praesentem diem";

yng[17] = "and the plain, and the Jordan, and the border, from Chinnereth even unto the sea of the plain, the salt sea, under the springs of Pisgah, at the [sun]-rising.";
dby[17] = "the plain also, and the Jordan, and [its] border from Chinnereth as far as the sea of the plain, the salt sea, under the slopes of Pisgah eastward.";
web[17] = "The plain also, and Jordan, and the coast [of it], from Chinnereth even to the sea of the plain, [even] the salt-sea, under Ashdoth-pisgah eastward.";
hnv[17] = "the `Aravah also, and the Yarden and the border [of it], from Kinneret even to the sea of the `Aravah, the Salt Sea, under the slopes of Pisgah eastward.";
vul[17] = "et planitiem solitudinis atque Iordanem et terminos Chenereth usque ad mare Deserti quod est Salsissimum ad radices montis Phasga contra orientem";
kjv[18] = "Get thee up into the top of Pisgah, and lift up thine eyes westward, and northward, and southward, and eastward, and behold [it] with thine eyes: for thou shalt not go over this Jordan.";
rsv[18] = "&quot;And I commanded you at that time, saying, \'The LORD your God has given you this land to possess; all your men of valor shall pass over armed before your brethren the people of Israel.";
asv[18] = "And I commanded you at that time, saying, Jehovah your God hath given you this land to possess it: ye shall pass over armed before your brethren the children of Israel, all the men of valor.";
yng[18] = "`And I command you, at that time, saying, Jehovah your God hath given to you this land to possess it; armed ye pass over before your brethren the sons of Israel, all the sons of might.";
dby[18] = "And I commanded you at that time, saying, Jehovah your God hath given you this land to take possession of it: ye shall pass over armed before your brethren the children of Israel, all [who are] combatants.";
web[18] = "And I commanded you at that time, saying, The LORD your God hath given you this land to possess it; ye shall pass over armed before your brethren the children of Israel, all [that are] meet for the war.";
hnv[18] = "I commanded you at that time, saying, the LORD your God has given you this land to possess it: you shall pass over armed before your brothers the children of Yisra\'el, all the men of valor.";
vul[18] = "praecepique vobis in tempore illo dicens Dominus Deus vester dat vobis terram hanc in hereditatem expediti praecedite fratres vestros filios Israhel omnes viri robusti";
kjv[19] = "But charge Joshua, and encourage him, and strengthen him: for he shall go over before this people, and he shall cause them to inherit the land which thou shalt see.";
rsv[19] = "But your wives, your little ones, and your cattle (I know that you have many cattle) shall remain in the cities which I have given you,";
asv[19] = "But your wives, and your little ones, and your cattle (I know that ye have much cattle), shall abide in your cities which I have given you,";
yng[19] = "Only, your wives, and your infants, and your cattle -- I have known that ye have much cattle -- do dwell in your cities which I have given to you,";
dby[19] = "Only your wives, and your little ones, and your cattle, -- I know that ye have much cattle, -- shall abide in your cities which I have given you,";
web[19] = "But your wives, and your little ones, and your cattle, ([for] I know that ye have many cattle,) shall abide in your cities which I have given you;";
hnv[19] = "But your wives, and your little ones, and your cattle, (I know that you have much cattle,) shall abide in your cities which I have given you,";
vul[19] = "absque uxoribus et parvulis ac iumentis novi enim quod plura habeatis pecora et in urbibus remanere debebunt quas tradidi vobis";
kjv[20] = "So we abode in the valley over against Bethpeor.";
rsv[20] = "until the LORD gives rest to your brethren, as to you, and they also occupy the land which the LORD your God gives them beyond the Jordan; then you shall return every man to his possession which I have given you.\'";
asv[20] = "until Jehovah give rest unto your brethren, as unto you, and they also possess the land which Jehovah your God giveth them beyond the Jordan: then shall ye return every man unto his possession, which I have given you.";
yng[20] = "till that Jehovah give rest to your brethren like yourselves, and they also have possessed the land which Jehovah your God is giving to them beyond the Jordan, then ye have turned back each to his possession, which I have given to you.";
dby[20] = "until Jehovah give rest to your brethren, as well as to you, and they also take possession of the land that Jehovah your God giveth them beyond the Jordan; then shall ye return, each man to his possession, which I have given you.";
web[20] = "Until the LORD shall have given rest to your brethren, as well as to you, and [until] they also possess the land which the LORD your God hath given them beyond Jordan: and [then] shall ye return every man to his possession which I have given you.";
hnv[20] = "until the LORD give rest to your brothers, as to you, and they also possess the land which the LORD your God gives them beyond the Yarden: then shall you return every man to his possession, which I have given you.";
vul[20] = "donec requiem tribuat Dominus fratribus vestris sicut vobis tribuit et possideant etiam ipsi terram quam daturus est eis trans Iordanem tunc revertetur unusquisque in possessionem suam quam dedi vobis";
kjv[21] = "Then we turned, and went up the way to Bashan: and Og the king of Bashan came out against us, he and all his people, to battle at Edrei.";
rsv[21] = "And I commanded Joshua at that time, \'Your eyes have seen all that the LORD your God has done to these two kings; so will the LORD do to all the kingdoms into which you are going over.";
asv[21] = "And I commanded Joshua at that time, saying, Thine eyes have seen all that Jehovah your God hath done unto these two kings: so shall Jehovah do unto all the kingdoms whither thou goest over.";
yng[21] = "`And Jehoshua I have commanded at that time, saying, Thine eyes are seeing all that which Jehovah your God hath done to these two kings -- so doth Jehovah to all the kingdoms whither thou are passing over;";
dby[21] = "And I commanded Joshua at that time, saying, Thine eyes have seen all that Jehovah your God hath done to these two kings: so will Jehovah do to all the kingdoms to which thou shalt go.";
web[21] = "And I commanded Joshua at that time, saying, Thy eyes have seen all that the LORD your God hath done to these two kings: so shall the LORD do to all the kingdoms whither thou passest.";
hnv[21] = "I commanded Yehoshua at that time, saying, Your eyes have seen all that the LORD your God has done to these two kings: so shall the LORD do to all the kingdoms where you go over.";
vul[21] = "Iosue quoque in tempore illo praecepi dicens oculi tui viderunt quae fecit Dominus Deus vester duobus his regibus sic faciet omnibus regnis ad quae transiturus es";
kjv[22] = "And the LORD said unto me, Fear him not: for I will deliver him, and all his people, and his land, into thy hand; and thou shalt do unto him as thou didst unto Sihon king of the Amorites, which dwelt at Heshbon.";
rsv[22] = "You shall not fear them; for it is the LORD your God who fights for you.\'";
asv[22] = "Ye shall not fear them; for Jehovah your God, he it is that fighteth for you.";
yng[22] = "fear them not, for Jehovah your God, He is fighting for you.";
dby[22] = "Ye shall not fear them; for Jehovah your God, he will fight for you.";
web[22] = "Ye shall not fear them: for the LORD your God he shall fight for you.";
hnv[22] = "You shall not fear them; for the LORD your God, he it is who fights for you.";
vul[22] = "ne timeas eos Dominus enim Deus vester pugnabit pro vobis";
kjv[23] = "So the LORD our God delivered into our hands Og also, the king of Bashan, and all his people: and we smote him until none was left to him remaining.";
rsv[23] = "&quot;And I besought the LORD at that time, saying,";
asv[23] = "And I besought Jehovah at that time, saying,";
yng[23] = "`And I entreat for grace unto Jehovah, at that time, saying,";
dby[23] = "And I besought Jehovah at that time, saying,";
web[23] = "And I besought the LORD at that time, saying,";
hnv[23] = "I begged the LORD at that time, saying,";
vul[23] = "precatusque sum Dominum in tempore illo dicens";
kjv[24] = "And we took all his cities at that time, there was not a city which we took not from them, threescore cities, all the region of Argob, the kingdom of Og in Bashan.";
rsv[24] = "\'O Lord GOD, thou hast only begun to show thy servant thy greatness and thy mighty hand; for what god is there in heaven or on earth who can do such works and mighty acts as thine?";
asv[24] = "O Lord Jehovah, thou hast begun to show thy servant thy greatness, and thy strong hand: for what god is there in heaven or in earth, that can do according to thy works, and according to thy mighty acts?";
yng[24] = "Lord Jehovah, Thou -- Thou hast begun to shew Thy servant Thy greatness, and Thy strong hand; for who [is] a God in the heavens or in earth who doth according to Thy works, and according to Thy might?";
dby[24] = "Lord Jehovah, thou hast begun to shew thy servant thy greatness, and thy powerful hand; for what God is in the heavens or in the earth that can do like to thy works, and like to thy might?";
web[24] = "O Lord GOD, thou hast begun to show thy servant thy greatness, and thy mighty hand: for what God [is there] in heaven or in earth, that can do according to thy works, and according to thy might?";
hnv[24] = "Lord GOD, you have begun to show your servant your greatness, and your strong hand: for what god is there in heaven or in eretz, that can do according to your works, and according to your mighty acts?";
vul[24] = "Domine Deus tu coepisti ostendere servo tuo magnitudinem tuam manumque fortissimam neque enim est alius Deus vel in caelo vel in terra qui possit facere opera tua et conparari fortitudini tuae";
kjv[25] = "All these cities [were] fenced with high walls, gates, and bars; beside unwalled towns a great many.";
rsv[25] = "Let me go over, I pray, and see the good land beyond the Jordan, that goodly hill country, and Lebanon.\'";
asv[25] = "Let me go over, I pray thee, and see the good land that is beyond the Jordan, that goodly mountain, and Lebanon.";
yng[25] = "Let me pass over, I pray Thee, and see the good land which [is] beyond the Jordan, this good hill-country, and Lebanon.";
dby[25] = "Let me go over, I pray thee, and see the good land that is beyond the Jordan, that goodly mountain, and Lebanon.";
web[25] = "I pray thee, let me go over, and see the good land that [is] beyond Jordan, that goodly mountain, and Lebanon.";
hnv[25] = "Please let me go over and see the good land that is beyond the Yarden, that goodly mountain, and Levanon.";
vul[25] = "transibo igitur et videbo terram hanc optimam trans Iordanem et montem istum egregium et Libanum";
kjv[26] = "And we utterly destroyed them, as we did unto Sihon king of Heshbon, utterly destroying the men, women, and children, of every city.";
rsv[26] = "But the LORD was angry with me on your account, and would not hearken to me; and the LORD said to me, \'Let it suffice you; speak no more to me of this matter.";
asv[26] = "But Jehovah was wroth with me for your sakes, and hearkened not unto me; and Jehovah said unto me, Let it suffice thee; speak no more unto me of this matter.";
yng[26] = "`And Jehovah sheweth himself wroth with me, for your sake, and hath not hearkened unto me, and Jehovah saith unto me, Enough for thee; add not to speak unto Me any more about this thing:";
dby[26] = "But Jehovah was wroth with me on your account, and did not hear me; and Jehovah said to me, Let it suffice thee; speak no more unto me of this matter!";
web[26] = "But the LORD was wroth with me for your sakes, and would not hear me: and the LORD said to me, Let it suffice thee; speak no more to me of this matter.";
hnv[26] = "But the LORD was angry with me for your sakes, and didn\'t listen to me; and the LORD said to me, Let it suffice you; speak no more to me of this matter.";
vul[26] = "iratusque est Dominus mihi propter vos nec exaudivit me sed dixit mihi sufficit tibi nequaquam ultra loquaris de hac re ad me";
kjv[27] = "But all the cattle, and the spoil of the cities, we took for a prey to ourselves.";
rsv[27] = "Go up to the top of Pisgah, and lift up your eyes westward and northward and southward and eastward, and behold it with your eyes; for you shall not go over this Jordan.";
asv[27] = "Get thee up unto the top of Pisgah, and lift up thine eyes westward, and northward, and southward, and eastward, and behold with thine eyes: for thou shalt not go over this Jordan.";
yng[27] = "go up [to] the top of Pisgah, and lift up thine eyes westward, and northward, and southward, and eastward, and see with thine eyes -- for thou dost not pass over this Jordan;";
dby[27] = "Go up to the top of Pisgah, and lift up thine eyes westward, and northward, and southward, and eastward, and behold it with thine eyes; for thou shalt not go over this Jordan.";
web[27] = "Ascend to the top of Pisgah, and lift up thy eyes westward, and northward, and southward, and eastward, and behold with thy eyes: for thou shalt not go over this Jordan.";
hnv[27] = "Go up to the top of Pisgah, and lift up your eyes westward, and northward, and southward, and eastward, and see with your eyes: for you shall not go over this Yarden.";
vul[27] = "ascende cacumen Phasgae et oculos tuos circumfer ad occidentem et aquilonem austrumque et orientem et aspice nec enim transibis Iordanem istum";
kjv[28] = "And we took at that time out of the hand of the two kings of the Amorites the land that [was] on this side Jordan, from the river of Arnon unto mount Hermon;";
rsv[28] = "But charge Joshua, and encourage and strengthen him; for he shall go over at the head of this people, and he shall put them in possession of the land which you shall see.\'";
asv[28] = "But charge Joshua, and encourage him, and strengthen him; for he shall go over before this people, and he shall cause them to inherit the land which thou shalt see.";
yng[28] = "and charge Jehoshua, and strengthen him, and harden him, for he doth pass over before this people, and he doth cause them to inherit the land which thou seest.";
dby[28] = "But charge Joshua, and encourage him and strengthen him; for he shall go over before this people, and he shall put them in possession of the land which thou shalt see.";
web[28] = "But charge Joshua, and encourage him, and strengthen him: for he shall go over before this people, and he shall cause them to inherit the land which thou shalt see.";
hnv[28] = "But charge Yehoshua, and encourage him, and strengthen him; for he shall go over before this people, and he shall cause them to inherit the land which you shall see.";
vul[28] = "praecipe Iosue et corrobora eum atque conforta quia ipse praecedet populum istum et dividet eis terram quam visurus es";
kjv[29] = "([Which] Hermon the Sidonians call Sirion; and the Amorites call it Shenir;)";
rsv[29] = "So we remained in the valley opposite Beth-pe\'or.";
asv[29] = "So we abode in the valley over against Beth-peor.";
yng[29] = "`And we dwell in a valley over-against Beth-Peor.";
dby[29] = "And we abode in the valley opposite to Beth-Peor.";
web[29] = "So we abode in the valley over against Beth-peor.";
hnv[29] = "So we abode in the valley over against Beit-Pe`or.";
vul[29] = "mansimusque in valle contra fanum Phogor";
