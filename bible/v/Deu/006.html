csb[1] = "&quot;This is the command -- the statutes and ordinances -- the LORD your God has commanded me to teach you, so that you may follow them in the land you are about to enter and possess.";
csb[2] = "&quot;Do this so that you may fear the LORD your God all the days of your life by keeping all his statutes and commands I am giving you, your son, and your grandson, and so that you may have a long life.";
csb[3] = "&quot;Listen, Israel, and be careful to follow them, so that you may prosper and multiply greatly, because the LORD, the God of your fathers, has promised you a land flowing with milk and honey.";
csb[4] = "&quot;Listen, Israel: The LORD our God, the LORD is one.";
csb[5] = "&quot;Love the LORD your God with all your heart, with all your soul, and with all your strength.";
csb[6] = "&quot;These words that I am giving you today are to be in your heart.";
csb[7] = "&quot;Repeat them to your children. Talk about them when you sit in your house and when you walk along the road, when you lie down and when you get up.";
csb[8] = "&quot;Bind them as a sign on your hand and let them be a symbol on your forehead.";
csb[9] = "&quot;Write them on the doorposts of your house and on your city gates.";
csb[10] = "&quot;When the LORD your God brings you into the land he swore to your fathers Abraham, Isaac, and Jacob that he would give you -- a land with large and beautiful cities that you did not build,";
csb[11] = "&quot;houses full of every good thing that you did not fill them with, cisterns that you did not dig, and vineyards and olive groves that you did not plant -- and when you eat and are satisfied,";
csb[12] = "&quot;be careful not to forget the LORD who brought you out of the land of Egypt, out of the place of slavery.";
csb[13] = "&quot;Fear the LORD your God, worship him, and take your oaths in his name.";
csb[14] = "&quot;Do not follow other gods, the gods of the peoples around you,";
csb[15] = "&quot;for the LORD your God, who is among you, is a jealous God. Otherwise, the LORD your God will become angry with you and obliterate you from the face of the earth.";
csb[16] = "&quot;Do not test the LORD your God as you tested him at Massah.";
csb[17] = "&quot;Carefully observe the commands of the LORD your God, the decrees and statutes he has commanded you.";
csb[18] = "&quot;Do what is right and good in the LORD\'s sight, so that you may prosper and so that you may enter and possess the good land the LORD your God swore to give your fathers,";
csb[19] = "&quot;by driving out all your enemies before you, as the LORD has said.";
csb[20] = "&quot;When your son asks you in the future, \'What is the meaning of the decrees, statutes, and ordinances that the LORD our God has commanded you? \'";
csb[21] = "&quot;tell him, \'We were slaves of Pharaoh in Egypt, but the LORD brought us out of Egypt with a strong hand.";
csb[22] = "&quot;Before our eyes the LORD inflicted great and devastating signs and wonders on Egypt, on Pharaoh, and on all his household,";
csb[23] = "&quot;but he brought us from there in order to lead us in and give us the land that he swore to our fathers.";
csb[24] = "&quot;The LORD commanded us to follow all these statutes and to fear the LORD our God for our prosperity always and for our preservation, as it is today.";
csb[25] = "&quot;Righteousness will be ours if we are careful to follow every one of these commands before the LORD our God, as he has commanded us.\'";
