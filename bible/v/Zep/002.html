csb[1] = "Gather yourselves together; gather together, undesirable nation,";
csb[2] = "before the decree takes effect and the day passes like chaff, before the burning of the LORD\'s anger overtakes you, before the day of the LORD\'s anger overtakes you.";
csb[3] = "Seek the LORD, all you humble of the earth, who carry out what he commands. Seek righteousness, seek humility; perhaps you will be concealed on the day of the LORD\'s anger.";
csb[4] = "For Gaza will be abandoned, and Ashkelon will become a ruin. Ashdod will be driven out at noon, and Ekron will be uprooted.";
csb[5] = "Woe, inhabitants of the seacoast, nation of the Cherethites! The word of the LORD is against you, Canaan, land of the Philistines: I will destroy you until there is no one left.";
csb[6] = "The seacoast will become pasturelands with caves for shepherds and pens for sheep.";
csb[7] = "The coastland will belong to the remnant of the house of Judah; they will find pasture there. They will lie down in the evening among the houses of Ashkelon, for the LORD their God will return to them and restore their fortunes.";
csb[8] = "I have heard the taunting of Moab and the insults of the Ammonites, who have taunted my people and threatened their territory.";
csb[9] = "Therefore, as I live -- this is the declaration of the LORD of Armies, the God of Israel -- Moab will be like Sodom and the Ammonites like Gomorrah: a place overgrown with weeds, a salt pit, and a perpetual wasteland. The remnant of my people will plunder them; the remainder of my nation will dispossess them.";
csb[10] = "This is what they get for their pride, because they have taunted and acted arrogantly against the people of the LORD of Armies.";
csb[11] = "The LORD will be terrifying to them when he starves all the gods of the earth. Then all the distant coasts and islands of the nations will bow in worship to him, each in its own place.";
csb[12] = "You Cushites will also be slain by my sword.";
csb[13] = "He will also stretch out his hand against the north and destroy Assyria; he will make Nineveh a desolate ruin, dry as the desert.";
csb[14] = "Herds will lie down in the middle of it, every kind of wild animal. Both eagle owls and herons will roost in the capitals of its pillars. Their calls will sound from the window, but devastation will be on the threshold, for he will expose the cedar work.";
csb[15] = "This is the jubilant city that lives in security, that thinks to herself: I exist, and there is no one else. What a desolation she has become, a place for wild animals to lie down! Everyone who passes by her scoffs and shakes his fist.";
kjv[1] = "Gather yourselves together, yea, gather together, O nation not desired;";

yng[3] = "Seek Jehovah, all ye humble of the land, Who His judgment have done, Seek ye righteousness, seek humility, It may be ye are hidden in a day of the anger of Jehovah.";

kjv[5] = "Woe unto the inhabitants of the sea coast, the nation of the Cherethites! the word of the LORD [is] against you; O Canaan, the land of the Philistines, I will even destroy thee, that there shall be no inhabitant.";
rsv[5] = "Woe to you inhabitants of the seacoast, you nation of the Cher\'ethites! The word of the LORD is against you, O Canaan, land of the Philistines; and I will destroy you till no inhabitant is left.";
asv[5] = "Woe unto the inhabitants of the sea-coast, the nation of the Cherethites! The word of Jehovah is against you, O Canaan, the land of the Philistines; I will destroy thee, that there shall be no inhabitant.";
yng[5] = "Ho! O inhabitants of the sea-coast, Nation of the Cherethites, A word of Jehovah [is] against you, Canaan, land of the Philistines, And I have destroyed thee without an inhabitant.";
dby[5] = "Woe unto the inhabitants of the sea-coast, the nation of the Cherethites! The word of Jehovah is against you, O Canaan, land of the Philistines: I will destroy thee, that there shall be no inhabitant;";

rsv[7] = "The seacoast shall become the possession of the remnant of the house of Judah, on which they shall pasture, and in the houses of Ash\'kelon they shall lie down at evening. For the LORD their God will be mindful of them and restore their fortunes.";
asv[7] = "And the coast shall be for the remnant of the house of Judah; they shall feed [their flocks] thereupon; in the houses of Ashkelon shall they lie down in the evening; for Jehovah their God will visit them, and bring back their captivity.";
yng[7] = "And the coast hath been for the remnant of the house of Judah, By them they have pleasure, In houses of Ashkelon at even they lie down, For inspect them doth Jehovah their God, And He hath turned back [to] their captivity.";
dby[7] = "And the coast shall be for the remnant of the house of Judah; they shall feed thereon: in the houses of Ashkelon shall they lie down in the evening: for Jehovah their God shall visit them, and turn again their captivity.";

kjv[8] = "I have heard the reproach of Moab, and the revilings of the children of Ammon, whereby they have reproached my people, and magnified [themselves] against their border.";
rsv[8] = "&quot;I have heard the taunts of Moab and the revilings of the Ammonites, how they have taunted my people and made boasts against their territory.";
asv[8] = "I have heard the reproach of Moab, and the revilings of the children of Ammon, wherewith they have reproached my people, and magnified themselves against their border.";
yng[8] = "I have heard the reproach of Moab, And the revilings of the sons of Ammon, Wherewith they reproached My people, And magnify [themselves] against their border.";

web[8] = "I have heard the reproach of Moab, and the revilings of the children of Ammon, by which they have reproached my people, and magnified [themselves] against their border.";
hnv[8] = "I have heard the reproach of Mo\'av, and the insults of the children of `Ammon, with which they have reproached my people, and magnified themselves against their border.";
vul[8] = "audivi obprobrium Moab et blasphemias filiorum Ammon quae exprobraverunt populo meo et magnificati sunt super terminos eorum";
kjv[9] = "Therefore [as] I live, saith the LORD of hosts, the God of Israel, Surely Moab shall be as Sodom, and the children of Ammon as Gomorrah, [even] the breeding of nettles, and saltpits, and a perpetual desolation: the residue of my people shall spoil them, and the remnant of my people shall possess them.";
rsv[9] = "Therefore, as I live,&quot; says the LORD of hosts, the God of Israel, &quot;Moab shall become like Sodom, and the Ammonites like Gomor\'rah, a land possessed by nettles and salt pits, and a waste for ever. The remnant of my people shall plunder them, and the survivors of my nation shall possess them.&quot;";
asv[9] = "Therefore as I live, saith Jehovah of hosts, the God of Israel, Surely Moab shall be as Sodom, and the children of Ammon as Gomorrah, a possession of nettles, and saltpits, and a perpetual desolation: the residue of my people shall make a prey of them, and the remnant of my nation shall inherit them.";
yng[9] = "Therefore, I live, An affirmation of Jehovah of Hosts, God of Israel, Surely, Moab is as Sodom, And the sons of Ammon as Gomorrah, An overrunning of nettles and salt-pits, And a desolation -- unto the age. A residue of My people do seize them, And a remnant of My nation inherit them.";
dby[9] = "Therefore, [as] I live, saith Jehovah of hosts, the God of Israel, Moab shall certainly be as Sodom, and the children of Ammon as Gomorrah, a possession of nettles, and salt-pits, and a perpetual desolation; the remnant of my people shall spoil them, and the residue of my nation shall possess them.";
web[9] = "Therefore [as] I live, saith the LORD of hosts, the God of Israel, Surely Moab shall be as Sodom, and the children of Ammon as Gomorrah, [even] the breeding of nettles, and salt-pits, and a perpetual desolation: the residue of my people shall lay them waste, and the remnant of my people shall possess them.";
hnv[9] = "Therefore as I live, says the LORD of Hosts, the God of Yisra\'el, surely Mo\'av will be as Sedom, and the children of `Ammon as `Amorah, a possession of nettles, and salt pits, and a perpetual desolation. The remnant of my people will plunder them, and the survivors of my nation will inherit them.";
vul[9] = "propterea vivo ego dicit Dominus exercituum Deus Israhel quia Moab ut Sodoma erit et filii Ammon quasi Gomorra siccitas spinarum et acervi salis et desertum usque in aeternum reliquiae populi mei diripient illos residui gentis meae possidebunt eos";
kjv[10] = "This shall they have for their pride, because they have reproached and magnified [themselves] against the people of the LORD of hosts.";
rsv[10] = "This shall be their lot in return for their pride, because they scoffed and boasted against the people of the LORD of hosts.";

yng[10] = "This [is] to them for their arrogancy, Because they have reproached, And they magnify [themselves] against the people of Jehovah of Hosts.";

kjv[11] = "The LORD [will be] terrible unto them: for he will famish all the gods of the earth; and [men] shall worship him, every one from his place, [even] all the isles of the heathen.";
rsv[11] = "The LORD will be terrible against them; yea, he will famish all the gods of the earth, and to him shall bow down, each in its place, all the lands of the nations.";
asv[11] = "Jehovah will be terrible unto them; for he will famish all the gods of the earth; and men shall worship him, every one from his place, even all the isles of the nations.";
yng[11] = "Fearful [is] Jehovah against them, For He made bare all gods of the land, And bow themselves to Him, each from his place, Do all islanders of the nations.";
dby[11] = "Jehovah will be terrible unto them; for he will famish all the gods of the earth; and all the isles of the nations shall worship him, every one from his place.";

kjv[13] = "And he will stretch out his hand against the north, and destroy Assyria; and will make Nineveh a desolation, [and] dry like a wilderness.";

kjv[14] = "And flocks shall lie down in the midst of her, all the beasts of the nations: both the cormorant and the bittern shall lodge in the upper lintels of it; [their] voice shall sing in the windows; desolation [shall be] in the thresholds: for he shall uncover the cedar work.";
rsv[14] = "Herds shall lie down in the midst of her, all the beasts of the field; the vulture and the hedgehog shall lodge in her capitals; the owl shall hoot in the window, the raven croak on the threshold; for her cedar work will be laid bare.";
asv[14] = "And herds shall lie down in the midst of her, all the beasts of the nations: both the pelican and the porcupine shall lodge in the capitals thereof; [their] voice shall sing in the windows; desolation shall be in the thresholds: for he hath laid bare the cedar-work.";
yng[14] = "And crouched in her midst have droves, Every beast of the nation, Both pelican and hedge-hog in her knobs lodge, A voice doth sing at the window, `Destruction [is] at the threshold, For the cedar-work is exposed.\'";
dby[14] = "And flocks shall lie down in the midst of her, all the crowd of beasts; both the pelican and the bittern shall lodge in the chapiters thereof; a voice shall sing in the windows; desolation shall be on the thresholds: for he hath laid bare the cedar work.";
web[14] = "And flocks shall lie down in the midst of her, all the beasts of the nations: both the cormorant and the bittern shall lodge in the upper lintels of it; [their] voice shall sing in the windows; desolation [shall be] in the threshholds: for he shall uncover the cedar work.";
hnv[14] = "Herds will lie down in the midst of her, all the animals of the nations. Both the ka`at and the porcupine will lodge in its capitals. Their calls will echo through the windows. Desolation will be in the thresholds, for he has laid bare the cedar beams.";
vul[14] = "et accubabunt in medio eius greges omnes bestiae gentium et onocrotalus et ericius in liminibus eius morabuntur vox cantantis in fenestra corvus in superliminari quoniam adtenuabo robur eius";
kjv[15] = "This [is] the rejoicing city that dwelt carelessly, that said in her heart, I [am], and [there is] none beside me: how is she become a desolation, a place for beasts to lie down in! every one that passeth by her shall hiss, [and] wag his hand.";
rsv[15] = "This is the exultant city that dwelt secure, that said to herself, &quot;I am and there is none else.&quot; What a desolation she has become, a lair for wild beasts! Every one who passes by her hisses and shakes his fist.";
asv[15] = "This is the joyous city that dwelt carelessly, that said in her heart, I am, and there is none besides me: how is she become a desolation, a place for beasts to lie down in! every one that passeth by her shall hiss, and wag his hand.";
yng[15] = "This [is] the exulting city that is dwelling confidently, That is saying in her heart, `I [am], and beside me there is none,\' How hath she been for a desolation, A crouching-place for beasts, Every one passing by her doth hiss, He doth shake his hand!";
dby[15] = "This is the rejoicing city that dwelt in security, that said in her heart, I am, and there is none else beside me: how is she become a desolation, a couching-place for beasts! Every one that passeth by her shall hiss, shall wave his hand.";
web[15] = "This [is] the rejoicing city that dwelt in security, that said in her heart, I [am], and [there is] none besides me: how is she become a desolation, a place for beasts to lie down in! every one that passeth by her shall hiss, [and] wag his hand.";
hnv[15] = "This is the joyous city that lived carelessly, that said in her heart, &quot;I am, and there is none besides me.&quot; How she has become a desolation, a place for animals to lie down in! Everyone who passes by her will hiss, and shake their fists.";
vul[15] = "haec est civitas gloriosa habitans in confidentia quae dicebat in corde suo ego sum et extra me non est alia amplius quomodo facta est in desertum cubile bestiae omnis qui transit per eam sibilabit et movebit manum suam";
