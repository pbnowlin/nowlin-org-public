csb[1] = "The word of the LORD that came to Zephaniah son of Cushi, son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon, king of Judah.";
csb[2] = "I will completely sweep away everything from the face of the earth -- this is the LORD\'s declaration.";
csb[3] = "I will sweep away people and animals; I will sweep away the birds of the sky and the fish of the sea, and the ruins along with the wicked. I will cut off mankind from the face of the earth. This is the LORD\'s declaration.";
csb[4] = "I will stretch out my hand against Judah and against all the residents of Jerusalem. I will cut off every vestige of Baal from this place, the names of the pagan priests along with the priests;";
csb[5] = "those who bow in worship on the rooftops to the stars in the sky; those who bow and pledge loyalty to the LORD but also pledge loyalty to Milcom;";
csb[6] = "and those who turn back from following the LORD, who do not seek the LORD or inquire of him.";
csb[7] = "Be silent in the presence of the Lord GOD, for the day of the LORD is near. Indeed, the LORD has prepared a sacrifice; he has consecrated his guests.";
csb[8] = "On the day of the LORD\'s sacrifice I will punish the officials, the king\'s sons, and all who are dressed in foreign clothing.";
csb[9] = "On that day I will punish all who skip over the threshold, who fill their master\'s house with violence and deceit.";
csb[10] = "On that day -- this is the LORD\'s declaration -- there will be an outcry from the Fish Gate, a wailing from the Second District, and a loud crashing from the hills.";
csb[11] = "Wail, you residents of the Hollow, for all the merchants will be silenced; all those loaded with silver will be cut off.";
csb[12] = "And at that time I will search Jerusalem with lamps and punish those who settle down comfortably, who say to themselves: The LORD will not do good or evil.";
csb[13] = "Their wealth will become plunder and their houses a ruin. They will build houses but never live in them, plant vineyards but never drink their wine.";
csb[14] = "The great day of the LORD is near, near and rapidly approaching. Listen, the day of the LORD -- then the warrior\'s cry is bitter.";
csb[15] = "That day is a day of wrath, a day of trouble and distress, a day of destruction and desolation, a day of darkness and gloom, a day of clouds and total darkness,";
csb[16] = "a day of trumpet blast and battle cry against the fortified cities, and against the high corner towers.";
csb[17] = "I will bring distress on mankind, and they will walk like the blind because they have sinned against the LORD. Their blood will be poured out like dust and their flesh like dung.";
csb[18] = "Their silver and their gold will be unable to rescue them on the day of the LORD\'s wrath. The whole earth will be consumed by the fire of his jealousy, for he will make a complete, yes, a horrifying end of all the inhabitants of the earth.";
