csb[1] = "Woe to the city that is rebellious and defiled, the oppressive city!";
csb[2] = "She has not obeyed; she has not accepted discipline. She has not trusted in the LORD; she has not drawn near to her God.";
csb[3] = "The princes within her are roaring lions; her judges are wolves of the night, which leave nothing for the morning.";
csb[4] = "Her prophets are reckless -- treacherous men. Her priests profane the sanctuary; they do violence to instruction.";
csb[5] = "The righteous LORD is in her; he does no wrong. He applies his justice morning by morning; he does not fail at dawn, yet the one who does wrong knows no shame.";
csb[6] = "I have cut off nations; their corner towers are destroyed. I have laid waste their streets, with no one to pass through. Their cities lie devastated, without a person, without an inhabitant.";
csb[7] = "I thought: You will certainly fear me and accept correction. Then her dwelling place would not be cut off based on all that I had allocated to her. However, they became more corrupt in all their actions.";
csb[8] = "Therefore, wait for me -- this is the LORD\'s declaration -- until the day I rise up for plunder. For my decision is to gather nations, to assemble kingdoms, in order to pour out my indignation on them, all my burning anger; for the whole earth will be consumed by the fire of my jealousy.";
csb[9] = "For I will then restore pure speech to the peoples so that all of them may call on the name of the LORD and serve him with a single purpose.";
csb[10] = "From beyond the rivers of Cush my supplicants, my dispersed people, will bring an offering to me.";
csb[11] = "On that day you will not be put to shame because of everything you have done in rebelling against me. For then I will remove from among you your jubilant, arrogant people, and you will never again be haughty on my holy mountain.";
csb[12] = "I will leave a meek and humble people among you, and they will take refuge in the name of the LORD.";
csb[13] = "The remnant of Israel will no longer do wrong or tell lies; a deceitful tongue will not be found in their mouths. They will pasture and lie down, with nothing to make them afraid.";
csb[14] = "Sing for joy, Daughter Zion; shout loudly, Israel! Be glad and celebrate with all your heart, Daughter Jerusalem!";
csb[15] = "The LORD has removed your punishment; he has turned back your enemy. The King of Israel, the LORD, is among you; you need no longer fear harm.";
csb[16] = "On that day it will be said to Jerusalem: &quot;Do not fear; Zion, do not let your hands grow weak.";
csb[17] = "&quot;The LORD your God is among you, a warrior who saves. He will rejoice over you with gladness. He will be quiet in his love. He will delight in you with singing.&quot;";
csb[18] = "I will gather those who have been driven from the appointed festivals; they will be a tribute from you and a reproach on her.";
csb[19] = "Yes, at that time I will deal with all who oppress you. I will save the lame and gather the outcasts; I will make those who were disgraced throughout the earth receive praise and fame.";
csb[20] = "At that time I will bring you back, yes, at the time I will gather you. I will give you fame and praise among all the peoples of the earth, when I restore your fortunes before your eyes. The LORD has spoken.";
kjv[1] = "Woe to her that is filthy and polluted, to the oppressing city!";
rsv[1] = "Woe to her that is rebellious and defiled, the oppressing city!";
asv[1] = "Woe to her that is rebellious and polluted! to the oppressing city!";
yng[1] = "Wo [to] the rebellious and polluted, The oppressing city!";
dby[1] = "Woe to her that is rebellious and corrupted, to the oppressing city!";
web[1] = "Woe to her that is filthy and polluted, to the oppressing city!";
hnv[1] = "Woe to her who is rebellious and polluted, the oppressing city!";
vul[1] = "vae provocatrix et redempta civitas columba";
kjv[2] = "She obeyed not the voice; she received not correction; she trusted not in the LORD; she drew not near to her God.";
rsv[2] = "She listens to no voice, she accepts no correction. She does not trust in the LORD, she does not draw near to her God.";
asv[2] = "She obeyed not the voice; she received not correction; she trusted not in Jehovah; she drew not near to her God.";
yng[2] = "She hath not hearkened to the voice, She hath not accepted instruction, In Jehovah she hath not trusted, Unto her God she hath not drawn near.";
dby[2] = "She hearkened not to the voice; she received not correction; she confided not in Jehovah; she drew not near her God.";
web[2] = "She obeyed not the voice; she received not correction; she trusted not in the LORD; she drew not near to her God.";
hnv[2] = "She didn\'t obey the voice. She didn\'t receive correction. She didn\'t trust in the LORD. She didn\'t draw near to her God.";
vul[2] = "non audivit vocem et non suscepit disciplinam in Domino non est confisa ad Deum suum non adpropiavit";
kjv[3] = "Her princes within her [are] roaring lions; her judges [are] evening wolves; they gnaw not the bones till the morrow.";
rsv[3] = "Her officials within her are roaring lions; her judges are evening wolves that leave nothing till the morning.";
asv[3] = "Her princes in the midst of her are roaring lions; her judges are evening wolves; they leave nothing till the morrow.";
yng[3] = "Her heads in her midst [are] roaring lions, Her judges [are] evening wolves, They have not gnawn the bone in the morning.";
dby[3] = "Her princes in the midst of her are roaring lions; her judges are evening wolves, that leave nothing for the morning.";
web[3] = "Her princes within her [are] roaring lions; her judges [are] evening wolves; they gnaw not the bones till the morrow.";
hnv[3] = " Her princes in the midst of her are roaring lions. Her judges are evening wolves. They leave nothing until the next day.";
vul[3] = "principes eius in medio eius quasi leones rugientes iudices eius lupi vespere non relinquebant in mane";
kjv[4] = "Her prophets [are] light [and] treacherous persons: her priests have polluted the sanctuary, they have done violence to the law.";
rsv[4] = "Her prophets are wanton, faithless men; her priests profane what is sacred, they do violence to the law.";
asv[4] = "Her prophets are light and treacherous persons; her priests have profaned the sanctuary, they have done violence to the law.";
yng[4] = "Her prophets unstable -- men of treachery, Her priests have polluted the sanctuary, They have violated the law.";
dby[4] = "Her prophets are vain-glorious, treacherous persons; her priests profane the sanctuary, they do violence to the law.";
web[4] = "Her prophets are light [and] treacherous persons: her priests have polluted the sanctuary, they have done violence to the law.";
hnv[4] = "Her prophets are arrogant and treacherous people. Her Kohanim have profaned the sanctuary. They have done violence to the law.";
vul[4] = "prophetae eius vesani viri infideles sacerdotes eius polluerunt sanctum iniuste egerunt contra legem";
kjv[5] = "The just LORD [is] in the midst thereof; he will not do iniquity: every morning doth he bring his judgment to light, he faileth not; but the unjust knoweth no shame.";
rsv[5] = "The LORD within her is righteous, he does no wrong; every morning he shows forth his justice, each dawn he does not fail; but the unjust knows no shame.";
asv[5] = "Jehovah in the midst of her is righteous; he will not do iniquity; every morning doth he bring his justice to light, he faileth not; but the unjust knoweth no shame.";
yng[5] = "Jehovah [is] righteous in her midst, He doth not do perverseness, Morning by morning His judgment he giveth to the light, It hath not been lacking, And the perverse doth not know shame.";
dby[5] = "The righteous Jehovah is in the midst of her: he doeth no wrong. Every morning doth he bring his judgment to light; it faileth not: but the unrighteous knoweth no shame.";
web[5] = "The just LORD [is] in the midst of her; he will not do iniquity: every morning doth he bring his judgment to light, he faileth not; but the unjust knoweth no shame.";
hnv[5] = "The LORD, in the midst of her, is righteous. He will do no wrong. Every morning he brings his justice to light. He doesn\'t fail, but the unjust know no shame.";
vul[5] = "Dominus iustus in medio eius non faciet iniquitatem mane mane iudicium suum dabit in luce et non abscondetur nescivit autem iniquus confusionem";
kjv[6] = "I have cut off the nations: their towers are desolate; I made their streets waste, that none passeth by: their cities are destroyed, so that there is no man, that there is none inhabitant.";
rsv[6] = "&quot;I have cut off nations; their battlements are in ruins; I have laid waste their streets so that none walks in them; their cities have been made desolate, without a man, without an inhabitant.";
asv[6] = "I have cut off nations; their battlements are desolate; I have made their streets waste, so that none passeth by; their cities are destroyed, so that there is no man, so that there is no inhabitant.";
yng[6] = "I have cut off nations, Desolated have been their chief ones, I have laid waste their out-places without any passing by, Destroyed have been their cities, Without man, without inhabitant.";
dby[6] = "I have cut off nations: their battlements are desolate; I made their streets waste, that none passeth by; their cities are destroyed, so that there is no man, so that there is no inhabitant.";
web[6] = "I have cut off the nations: their towers are desolate; I made their streets waste, that none passeth by: their cities are destroyed, so that there is no man, that there is no inhabitant.";

kjv[7] = "I said, Surely thou wilt fear me, thou wilt receive instruction; so their dwelling should not be cut off, howsoever I punished them: but they rose early, [and] corrupted all their doings.";
rsv[7] = "I said, \'Surely she will fear me, she will accept correction; she will not lose sight of all that I have enjoined upon her.\' But all the more they were eager to make all their deeds corrupt.&quot;";
asv[7] = "I said, Only fear thou me; receive correction; so her dwelling shall not be cut off, [according to] all that I have appointed concerning her: but they rose early and corrupted all their doings.";
yng[7] = "I have said: Only, ye do fear Me, Ye do accept instruction, And her habitation is not cut off, All that I have appointed for her, But they have risen early, They have corrupted all their doings.";
dby[7] = "I said, Only fear me, receive correction; so her dwelling shall not be cut off, howsoever I may punish her. But they rose early, they corrupted all their doings.";
web[7] = "I said, Surely thou wilt fear me, thou wilt receive instruction; so their dwelling should not be cut off, however I punished them: but they rose early, [and] corrupted all their doings.";
hnv[7] = "I said, &quot;Just fear me. Receive correction, so that her dwelling won\'t be cut off, according to all that I have appointed concerning her.&quot; But they rose early and corrupted all their doings.";
vul[7] = "dixi attamen timebis me suscipies disciplinam et non peribit habitaculum eius propter omnia in quibus visitavi eam verumtamen diluculo surgentes corruperunt omnes cogitationes suas";
kjv[8] = "Therefore wait ye upon me, saith the LORD, until the day that I rise up to the prey: for my determination [is] to gather the nations, that I may assemble the kingdoms, to pour upon them mine indignation, [even] all my fierce anger: for all the earth shall be devoured with the fire of my jealousy.";
rsv[8] = "&quot;Therefore wait for me,&quot; says the LORD, &quot;for the day when I arise as a witness. For my decision is to gather nations, to assemble kingdoms, to pour out upon them my indignation, all the heat of my anger; for in the fire of my jealous wrath all the earth shall be consumed.";
asv[8] = "Therefore wait ye for me, saith Jehovah, until the day that I rise up to the prey; for my determination is to gather the nations, that I may assemble the kingdoms, to pour upon them mine indignation, even all my fierce anger; for all the earth shall be devoured with the fire of my jealousy.";
yng[8] = "Therefore, wait for Me -- an affirmation of Jehovah, For the day of My rising for prey, For My judgment [is] to gather nations, To assemble kingdoms, To pour out on them Mine indignation, All the heat of Mine anger, For by the fire of My jealousy consumed is all the earth.";
dby[8] = "Therefore wait ye for me, saith Jehovah, until the day that I rise up to the prey; for my determination is to assemble the nations, that I may gather the kingdoms together, to pour upon them mine indignation, -- all my fierce anger: for all the earth shall be devoured with the fire of my jealousy.";
web[8] = "Therefore wait ye upon me, saith the LORD, until the day that I rise up to the prey: for my determination [is] to gather the nations, that I may assemble the kingdoms, to pour upon them my indignation, [even] all my fierce anger: for all the earth shall be devoured with the fire of my jealousy.";
hnv[8] = " &quot;Therefore wait for me,&quot; says the LORD, &quot;until the day that I rise up to the prey, for my determination is to gather the nations, that I may assemble the kingdoms, to pour on them my indignation, even all my fierce anger, for all the eretz will be devoured with the fire of my jealousy.";
vul[8] = "quapropter expecta me dicit Dominus in die resurrectionis meae in futurum quia iudicium meum ut congregem gentes et colligam regna ut effundam super eas indignationem meam omnem iram furoris mei in igne enim zeli mei devorabitur omnis terra";
kjv[9] = "For then will I turn to the people a pure language, that they may all call upon the name of the LORD, to serve him with one consent.";
rsv[9] = "&quot;Yea, at that time I will change the speech of the peoples to a pure speech, that all of them may call on the name of the LORD and serve him with one accord.";
asv[9] = "For then will I turn to the peoples of a pure language, that they may all call upon the name of Jehovah, to serve him with one consent.";
yng[9] = "For then do I turn unto peoples a pure lip, To call all of them by the name of Jehovah, To serve Him [with] one shoulder.";
dby[9] = "For then will I turn to the peoples a pure language, that they may all call upon the name of Jehovah, to serve him with one consent.";
web[9] = "For then will I turn to the people a pure language, that they may all call upon the name of the LORD, to serve him with one consent.";
hnv[9] = "For then I will purify the lips of the peoples, that they may all call on the name of the LORD, to serve him shoulder to shoulder.";
vul[9] = "quia tunc reddam populis labium electum ut vocent omnes in nomine Domini et serviant ei umero uno";
kjv[10] = "From beyond the rivers of Ethiopia my suppliants, [even] the daughter of my dispersed, shall bring mine offering.";

asv[10] = "From beyond the rivers of Ethiopia my suppliants, even the daughter of my dispersed, shall bring mine offering.";
yng[10] = "From beyond the rivers of Cush, my supplicants, The daughter of My scattered ones, Do bring My present.";
dby[10] = "From beyond the rivers of Cush my suppliants, the daughter of my dispersed, shall bring mine oblation.";
web[10] = "From beyond the rivers of Cush my suppliants, [even] the daughter of my dispersed, shall bring my offering.";
hnv[10] = "From beyond the rivers of Kush, my worshipers, even the daughter of my dispersed people, will bring my offering.";
vul[10] = "ultra flumina Aethiopiae inde supplices mei filii dispersorum meorum deferent munus mihi";
kjv[11] = "In that day shalt thou not be ashamed for all thy doings, wherein thou hast transgressed against me: for then I will take away out of the midst of thee them that rejoice in thy pride, and thou shalt no more be haughty because of my holy mountain.";
rsv[11] = "&quot;On that day you shall not be put to shame because of the deeds by which you have rebelled against me; for then I will remove from your midst your proudly exultant ones, and you shall no longer be haughty in my holy mountain.";
asv[11] = "In that day shalt thou not be put to shame for all thy doings, wherein thou hast transgressed against me; for then I will take away out of the midst of thee thy proudly exulting ones, and thou shalt no more be haughty in my holy mountain.";
yng[11] = "In that day thou art not ashamed because of any of thine actions, Wherewith thou hast transgressed against Me, For then do I turn aside from thy midst The exulting ones of thine excellency, And thou dost add no more to be haughty, In My holy mountain.";
dby[11] = "In that day thou shalt not be ashamed for all thy doings wherein thou hast transgressed against me; for then I will take away out of the midst of thee them that exult in thy pride, and thou shalt no more be haughty because of my holy mountain.";
web[11] = "In that day shalt thou not be ashamed for all thy doings, in which thou hast transgressed against me: for then I will take away out of the midst of thee them that rejoice in thy pride, and thou shalt no more be haughty because of my holy mountain.";
hnv[11] = "In that day you will not be disappointed for all your doings, in which you have transgressed against me; for then I will take away out of the midst of you your proudly exulting ones, and you will no more be haughty in my holy mountain.";
vul[11] = "in die illa non confunderis super cunctis adinventionibus tuis quibus praevaricata es in me quia tunc auferam de medio tui magniloquos superbiae tuae et non adicies exaltari amplius in monte sancto meo";

asv[12] = "But I will leave in the midst of thee an afflicted and poor people, and they shall take refuge in the name of Jehovah.";
yng[12] = "And I have left in thy midst a people humble and poor, And they have trusted in the name of Jehovah.";
dby[12] = "And I will leave in the midst of thee an afflicted and poor people, and they shall trust in the name of Jehovah.";
web[12] = "I will also leave in the midst of thee an afflicted and poor people, and they shall trust in the name of the LORD.";
hnv[12] = "But I will leave in the midst of you an afflicted and poor people, and they will take refuge in the name of the LORD.";

yng[13] = "The remnant of Israel do no perversity, nor speak lies, Nor found in their mouth is a deceitful tongue, For they have delight, and have lain down, And there is none troubling.";
dby[13] = "The remnant of Israel shall not work unrighteousness, nor speak lies; neither shall a deceitful tongue be found in their mouth: but *they* shall feed and lie down, and none shall make them afraid.";

hnv[13] = "The remnant of Yisra\'el will not do iniquity, nor speak lies, neither will a deceitful tongue be found in their mouth, for they will feed and lie down, and no one will make them afraid.&quot;";

kjv[14] = "Sing, O daughter of Zion; shout, O Israel; be glad and rejoice with all the heart, O daughter of Jerusalem.";
rsv[14] = "Sing aloud, O daughter of Zion; shout, O Israel! Rejoice and exult with all your heart, O daughter of Jerusalem!";
asv[14] = "Sing, O daughter of Zion; shout, O Israel; be glad and rejoice with all the heart, O daughter of Jerusalem.";
yng[14] = "Cry aloud, O daughter of Zion, shout, O Israel, Rejoice and exult with the whole heart, O daughter of Jerusalem.";
dby[14] = "Exult, O daughter of Zion; shout, O Israel; rejoice and be glad with all the heart, O daughter of Jerusalem:";
web[14] = "Sing, O daughter of Zion; shout, O Israel; be glad and rejoice with all the heart, O daughter of Jerusalem.";
hnv[14] = "Sing, daughter of Tziyon! Shout, Yisra\'el! Be glad and rejoice with all your heart, daughter of Yerushalayim.";
vul[14] = "lauda filia Sion iubilate Israhel laetare et exulta in omni corde filia Hierusalem";
kjv[15] = "The LORD hath taken away thy judgments, he hath cast out thine enemy: the king of Israel, [even] the LORD, [is] in the midst of thee: thou shalt not see evil any more.";
rsv[15] = "The LORD has taken away the judgments against you, he has cast out your enemies. The King of Israel, the LORD, is in your midst; you shall fear evil no more.";
asv[15] = "Jehovah hath taken away thy judgments, he hath cast out thine enemy: the King of Israel, even Jehovah, is in the midst of thee; thou shalt not fear evil any more.";
yng[15] = "Jehovah hath turned aside thy judgments, He hath faced thine enemy, The king of Israel, Jehovah, [is] in thy midst, Thou seest evil no more.";
dby[15] = "Jehovah hath taken away thy judgments, he hath cast out thine enemy; the King of Israel, Jehovah, is in the midst of thee; thou shalt not see evil any more.";
web[15] = "The LORD hath taken away thy judgments, he hath cast out thy enemy: the King of Israel, [even] the LORD, [is] in the midst of thee: thou shalt not see evil any more.";
hnv[15] = "The LORD has taken away your judgments. He has thrown out your enemy. The King of Yisra\'el, the LORD, is in the midst of you. You will not be afraid of evil any more.";
vul[15] = "abstulit Dominus iudicium tuum avertit inimicos tuos rex Israhel Dominus in medio tui non timebis malum ultra";
kjv[16] = "In that day it shall be said to Jerusalem, Fear thou not: [and to] Zion, Let not thine hands be slack.";
rsv[16] = "On that day it shall be said to Jerusalem: &quot;Do not fear, O Zion; let not your hands grow weak.";
asv[16] = "In that day it shall be said to Jerusalem, Fear thou not; O Zion, let not thy hands be slack.";
yng[16] = "In that day it is said to Jerusalem, `Fear not, O Zion, let not thy hands be feeble.";
dby[16] = "In that day it shall be said to Jerusalem, Fear not; Zion, let not thy hands be slack.";
web[16] = "In that day it shall be said to Jerusalem, Fear thou not: [and to] Zion, Let not thy hands be slack.";
hnv[16] = "In that day, it will be said to Yerushalayim, &quot;Don\'t be afraid, Tziyon. Don\'t let your hands be slack.&quot;";
vul[16] = "in die illa dicetur Hierusalem noli timere Sion non dissolvantur manus tuae";
kjv[17] = "The LORD thy God in the midst of thee [is] mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.";
rsv[17] = "The LORD, your God, is in your midst, a warrior who gives victory; he will rejoice over you with gladness, he will renew you in his love; he will exult over you with loud singing";
asv[17] = "Jehovah thy God is in the midst of thee, a mighty one who will save; he will rejoice over thee with joy; he will rest in his love; he will joy over thee with singing.";
yng[17] = "Jehovah thy God [is] in thy midst, A mighty one doth save, He rejoiceth over thee with joy, He doth work in His love, He joyeth over thee with singing.\'";
dby[17] = "Jehovah thy God is in thy midst, a mighty one that will save: he will rejoice over thee with joy; he will rest in his love; he will exult over thee with singing.";
web[17] = "The LORD thy God in the midst of thee [is] mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.";
hnv[17] = "The LORD, your God, is in the midst of you, a mighty one who will save. He will rejoice over you with joy. He will rest in his love. He will rejoice over you with singing.";
vul[17] = "Dominus Deus tuus in medio tui Fortis ipse salvabit gaudebit super te in laetitia silebit in dilectione tua exultabit super te in laude";
kjv[18] = "I will gather [them that are] sorrowful for the solemn assembly, [who] are of thee, [to whom] the reproach of it [was] a burden.";
rsv[18] = "as on a day of festival. &quot;I will remove disaster from you, so that you will not bear reproach for it.";
asv[18] = "I will gather them that sorrow for the solemn assembly, who were of thee; [to whom] the burden upon her was a reproach.";
yng[18] = "Mine afflicted from the appointed place I have gathered, from thee they have been, Bearing for her sake reproach.";
dby[18] = "I will gather them that sorrow for the solemn assemblies, who were of thee: the reproach of it was a burden [unto them].";
web[18] = "I will gather [them that are] sorrowful for the solemn assembly, [who] are of thee, [to whom] the reproach of it [was] a burden.";
hnv[18] = "Those who are sad for the appointed feasts, I will remove from you. They are a burden and a reproach to you.";
vul[18] = "nugas qui a lege recesserant congregabo quia ex te erant ut non ultra habeas super eis obprobrium";
kjv[19] = "Behold, at that time I will undo all that afflict thee: and I will save her that halteth, and gather her that was driven out; and I will get them praise and fame in every land where they have been put to shame.";
rsv[19] = "Behold, at that time I will deal with all your oppressors. And I will save the lame and gather the outcast, and I will change their shame into praise and renown in all the earth.";
asv[19] = "Behold, at that time I will deal with all them that afflict thee; and I will save that which is lame, and gather that which was driven away; and I will make them a praise and a name, whose shame hath been in all the earth.";
yng[19] = "Lo, I am dealing with all afflicting thee at that time, And I have saved the halting one, And the driven out ones I do gather, And have set them for a praise and for a name, In all the land of their shame.";
dby[19] = "Behold, at that time I will deal with all them that afflict thee; and I will save her that halted, and gather her that was driven out; and I will make them a praise and a name in all the lands where they have been put to shame.";
web[19] = "Behold, at that time I will undo all that afflict thee: and I will save her that halteth, and gather her that was driven out; and I will get them praise and fame in every land where they have been put to shame.";
hnv[19] = "Behold, at that time I will deal with all those who afflict you, and I will save those who are lame, and gather those who were driven away. I will give them praise and honor, whose shame has been in all the eretz.";
vul[19] = "ecce ego interficiam omnes qui adflixerunt te in tempore illo et salvabo claudicantem et eam quae eiecta fuerat congregabo et ponam eos in laudem et in nomen in omni terra confusionis eorum";
kjv[20] = "At that time will I bring you [again], even in the time that I gather you: for I will make you a name and a praise among all people of the earth, when I turn back your captivity before your eyes, saith the LORD.";
rsv[20] = "At that time I will bring you home, at the time when I gather you together; yea, I will make you renowned and praised among all the peoples of the earth, when I restore your fortunes before your eyes,&quot; says the LORD.";
asv[20] = "At that time will I bring you in, and at that time will I gather you; for I will make you a name and a praise among all the peoples of the earth, when I bring back your captivity before your eyes, saith Jehovah.";
yng[20] = "At that time I bring you in, Even at the time of My assembling you, For I give you for a name, and for a praise, Among all peoples of the land, In My turning back [to] your captivity before your eyes, said Jehovah!";
