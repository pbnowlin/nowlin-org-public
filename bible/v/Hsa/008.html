csb[1] = "Put the horn to your mouth! One like an eagle comes against the house of the LORD, because they transgress my covenant and rebel against my law.";
csb[2] = "Israel cries out to me, My God, we know you! ";
csb[3] = "Israel has rejected what is good; an enemy will pursue him.";
csb[4] = "They have installed kings, but not through me. They have appointed leaders, but without my approval. They make their silver and gold into idols for themselves for their own destruction.";
csb[5] = "Your calf-idol is rejected, Samaria. My anger burns against them. How long will they be incapable of innocence?";
csb[6] = "For this thing is from Israel -- a craftsman made it, and it is not God. The calf of Samaria will be smashed to bits!";
csb[7] = "Indeed, they sow the wind and reap the whirlwind. There is no standing grain; what sprouts fails to yield flour. Even if they did, foreigners would swallow it up.";
csb[8] = "Israel is swallowed up! Now they are among the nations like discarded pottery.";
csb[9] = "For they have gone up to Assyria like a wild donkey going off on its own. Ephraim has paid for love.";
csb[10] = "Even though they hire lovers among the nations, I will now round them up, and they will begin to decrease in number under the burden of the king and leaders.";
csb[11] = "When Ephraim multiplied his altars for sin, they became his altars for sinning.";
csb[12] = "Though I were to write out for him ten thousand points of my instruction, they would be regarded as something strange.";
csb[13] = "Though they offer sacrificial gifts and eat the flesh, the LORD does not accept them. Now he will remember their guilt and punish their sins; they will return to Egypt.";
csb[14] = "Israel has forgotten his Maker and built palaces; Judah has also multiplied fortified cities. I will send fire on their cities, and it will consume their citadels.";
kjv[1] = "[Set] the trumpet to thy mouth. [He shall come] as an eagle against the house of the LORD, because they have transgressed my covenant, and trespassed against my law.";
rsv[1] = "Set the trumpet to your lips, for a vulture is over the house of the LORD, because they have broken my covenant, and transgressed my law.";
asv[1] = "[Set] the trumpet to thy mouth. As an eagle [he cometh] against the house of Jehovah, because they have transgressed my covenant, and trespassed against my law.";
yng[1] = "`Unto thy mouth -- a trumpet, As an eagle against the house of Jehovah, Because they transgressed My covenant, And against My law they have rebelled.";
dby[1] = "Set the trumpet to thy mouth. [He cometh] as an eagle against the house of Jehovah, because they have transgressed my covenant, and rebelled against my law.";
web[1] = "[Set] the trumpet to thy mouth. [He shall come] as an eagle against the house of the LORD, because they have transgressed my covenant, and trespassed against my law.";
hnv[1] = "&quot;Put the shofar to your lips! Something like an eagle is over the LORD\'s house, Because they have broken my covenant, And rebelled against my law.";
vul[1] = "in gutture tuo sit tuba quasi aquila super domum Domini pro eo quod transgressi sunt foedus meum et legem meam praevaricati sunt";
kjv[2] = "Israel shall cry unto me, My God, we know thee.";
rsv[2] = "To me they cry, My God, we Israel know thee.";
asv[2] = "They shall cry unto me, My God, we Israel know thee.";
yng[2] = "To Me they cry, `My God, we -- Israel -- have known Thee.\'";
dby[2] = "They shall cry unto me, My God, we know thee; [we], Israel.";
web[2] = "Israel shall cry to me, My God, we know thee.";
hnv[2] = "They cry to me, \'My God, we Yisra\'el acknowledge you!\'";
vul[2] = "me invocabunt Deus meus cognovimus te Israhel";
kjv[3] = "Israel hath cast off [the thing that is] good: the enemy shall pursue him.";
rsv[3] = "Israel has spurned the good; the enemy shall pursue him.";
asv[3] = "Israel hath cast off that which is good: the enemy shall pursue him.";
yng[3] = "Cast off good hath Israel, an enemy pursueth him.";
dby[3] = "Israel hath cast off good: the enemy shall pursue him.";
web[3] = "Israel hath cast off [the thing that is] good: the enemy shall pursue him.";
hnv[3] = "Yisra\'el has cast off that which is good. The enemy will pursue him.";
vul[3] = "proiecit Israhel bonum inimicus persequetur eum";
kjv[4] = "They have set up kings, but not by me: they have made princes, and I knew [it] not: of their silver and their gold have they made them idols, that they may be cut off.";
rsv[4] = "They made kings, but not through me. They set up princes, but without my knowledge. With their silver and gold they made idols for their own destruction.";
asv[4] = "They have set up kings, but not by me; they have made princes, and I knew it not: of their silver and their gold have they made them idols, that they may be cut off.";
yng[4] = "They have made kings, and not by Me, They have made princes, and I have not known, Their silver and their gold they have made to them idols, So that they are cut off.";
dby[4] = "They have set up kings, but not by me; they have made princes, and I knew it not; of their silver and their gold have they made them idols, that they may be cut off.";
web[4] = "They have set up kings, but not by me: they have made princes, and I knew [it] not: of their silver and their gold have they made for themselves idols, that they may be cut off.";
hnv[4] = "They have set up kings, but not by me. They have made princes, and I didn\'t approve. Of their silver and their gold they have made themselves idols, That they may be cut off.";
vul[4] = "ipsi regnaverunt et non ex me principes extiterunt et non cognovi argentum suum et aurum suum fecerunt sibi idola ut interirent";
kjv[5] = "Thy calf, O Samaria, hath cast [thee] off; mine anger is kindled against them: how long [will it be] ere they attain to innocency?";
rsv[5] = "I have spurned your calf, O Sama\'ria. My anger burns against them. How long will it be till they are pure";
asv[5] = "He hath cast off thy calf, O Samaria; mine anger is kindled against them: how long will it be ere they attain to innocency?";
yng[5] = "Cast off hath thy calf, O Samaria, Burned hath Mine anger against them, Till when are they not capable of purity?";
dby[5] = "Thy calf, O Samaria, hath cast [thee] off; mine anger is kindled against them: how long will they be incapable of purity?";
web[5] = "Thy calf, O Samaria, hath cast [thee] off; my anger is kindled against them: how long [will it be] ere they attain to innocence?";
hnv[5] = "Let Shomron throw out his calf-idol! My anger burns against them! How long will it be before the are capable of purity?";
vul[5] = "proiectus est vitulus tuus Samaria iratus est furor meus in eis usquequo non poterunt emundari";
kjv[6] = "For from Israel [was] it also: the workman made it; therefore it [is] not God: but the calf of Samaria shall be broken in pieces.";
rsv[6] = "in Israel? A workman made it; it is not God. The calf of Sama\'ria shall be broken to pieces.";
asv[6] = "For from Israel is even this; the workman made it, and it is no God; yea, the calf of Samaria shall be broken in pieces.";
yng[6] = "For even it [is] of Israel; an artificer made it, And it [is] not God, For the calf of Samaria is fragments!";
dby[6] = "For from Israel is this also: -- a workman made it, and it is no God: for the calf of Samaria shall be [broken in] pieces.";
web[6] = "For from Israel [was] it also: the workman made it; therefore it [is] not God: but the calf of Samaria shall be broken in pieces.";
hnv[6] = "For this is even from Yisra\'el! The workman made it, and it is no God; Indeed, the calf of Shomron shall be broken in pieces.";
vul[6] = "quia ex Israhel et ipse est artifex fecit illum et non est Deus quoniam in aranearum telas erit vitulus Samariae";
kjv[7] = "For they have sown the wind, and they shall reap the whirlwind: it hath no stalk: the bud shall yield no meal: if so be it yield, the strangers shall swallow it up.";
rsv[7] = "For they sow the wind, and they shall reap the whirlwind. The standing grain has no heads, it shall yield no meal; if it were to yield, aliens would devour it.";
asv[7] = "For they sow the wind, and they shall reap the whirlwind: he hath no standing grain; the blade shall yield no meal; if so be it yield, strangers shall swallow it up.";
yng[7] = "For wind they sow, and a hurricane they reap, Stalk it hath none -- a shoot not yielding grain, If so be it yield -- strangers do swallow it up.";
dby[7] = "For they have sown the wind, and they shall reap the whirlwind: it hath no stalk; should it sprout, it would yield no meal; if so be it yield, strangers shall swallow it up.";
web[7] = "For they have sown the wind, and they shall reap the whirlwind: it hath no stalk: the bud shall yield no meal: if it shall yield, the strangers shall swallow it up.";
hnv[7] = "For they sow the wind, And they will reap the whirlwind. He has no standing grain. The stalk will yield no head. If it does yield, strangers will swallow it up.";
vul[7] = "quia ventum seminabunt et turbinem metent culmus stans non est in eis germen non faciet farinam quod si et fecerit alieni comedent eam";
kjv[8] = "Israel is swallowed up: now shall they be among the Gentiles as a vessel wherein [is] no pleasure.";
rsv[8] = "Israel is swallowed up; already they are among the nations as a useless vessel.";
asv[8] = "Israel is swallowed up: now are they among the nations as a vessel wherein none delighteth.";
yng[8] = "Israel hath been swallowed up, Now they have been among nations, As a vessel in which is no delight.";
dby[8] = "Israel is swallowed up: now are they become among the nations as a vessel wherein is no pleasure.";
web[8] = "Israel is swallowed up: now shall they be among the Gentiles as a vessel in which [is] no pleasure.";
hnv[8] = "Yisra\'el is swallowed up. Now they are among the nations like a worthless thing.";
vul[8] = "devoratus est Israhel nunc factus est in nationibus quasi vas inmundum";
kjv[9] = "For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers.";
rsv[9] = "For they have gone up to Assyria, a wild ass wandering alone; E\'phraim has hired lovers.";
asv[9] = "For they are gone up to Assyria, [like] a wild ass alone by himself: Ephraim hath hired lovers.";
yng[9] = "For they -- they have gone up [to] Asshur, A wild ass alone by himself [is] Ephraim, They have hired lovers!";
dby[9] = "For they are gone up [to] Assyria [as] a wild ass alone by himself: Ephraim hath hired lovers.";
web[9] = "For they have gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers.";
hnv[9] = "For they have gone up to Ashshur, Like a wild donkey wandering alone. Efrayim has hired lovers for himself.";
vul[9] = "quia ipsi ascenderunt ad Assur onager solitarius sibi Ephraim munera dederunt amatoribus";
kjv[10] = "Yea, though they have hired among the nations, now will I gather them, and they shall sorrow a little for the burden of the king of princes.";
rsv[10] = "Though they hire allies among the nations, I will soon gather them up. And they shall cease for a little while from anointing king and princes.";
asv[10] = "Yea, though they hire among the nations, now will I gather them; and they begin to be diminished by reason of the burden of the king of princes.";
yng[10] = "Also though they hire among nations, Now I gather them, and they are pained a little, From the burden of a king of princes.";
dby[10] = "Although they hire among the nations, now will I gather them, and they shall begin to be straitened under the burden of the king of princes.";
web[10] = "Yes, though they have hired among the nations, now will I gather them, and they shall sorrow a little for the burden of the king of princes.";
hnv[10] = "But although they sold themselves among the nations, I will now gather them; and they begin to waste away because of the oppression of the king of mighty ones.";
vul[10] = "sed et cum mercede conduxerint nationes nunc congregabo eos et quiescent paulisper ab onere regis et principum";
kjv[11] = "Because Ephraim hath made many altars to sin, altars shall be unto him to sin.";
rsv[11] = "Because E\'phraim has multiplied altars for sinning, they have become to him altars for sinning.";
asv[11] = "Because Ephraim hath multiplied altars for sinning, altars have been unto him for sinning.";
yng[11] = "Because Ephraim did multiply altars to sin, They have been to him altars to sin.";
dby[11] = "Because Ephraim hath multiplied altars to sin, altars shall be unto him to sin.";
web[11] = "Because Ephraim hath made many altars to sin, altars shall be to him to sin.";
hnv[11] = "Because Efrayim has multiplied altars for sinning, They became for him altars for sinning.";
vul[11] = "quia multiplicavit Ephraim altaria ad peccandum factae sunt ei arae in delictum";
kjv[12] = "I have written to him the great things of my law, [but] they were counted as a strange thing.";
rsv[12] = "Were I to write for him my laws by ten thousands, they would be regarded as a strange thing.";
asv[12] = "I wrote for him the ten thousand things of my law; but they are counted as a strange thing.";
yng[12] = "I write for him numerous things of My law, As a strange thing they have been reckoned.";
dby[12] = "I have prescribed unto him the manifold things of my law: they are counted [as] a strange thing.";
web[12] = "I have written to him the great things of my law, [but] they were counted as a strange thing.";
hnv[12] = "I wrote for him the many things of my law; But they were regarded as a strange thing.";
vul[12] = "scribam ei multiplices leges meas quae velut alienae conputatae sunt";
kjv[13] = "They sacrifice flesh [for] the sacrifices of mine offerings, and eat [it; but] the LORD accepteth them not; now will he remember their iniquity, and visit their sins: they shall return to Egypt.";
rsv[13] = "They love sacrifice; they sacrifice flesh and eat it; but the LORD has no delight in them. Now he will remember their iniquity, and punish their sins; they shall return to Egypt.";
asv[13] = "As for the sacrifices of mine offerings, they sacrifice flesh and eat it; but Jehovah accepteth them not: now will he remember their iniquity, and visit their sins; they shall return to Egypt.";
yng[13] = "The sacrifices of Mine offerings! They sacrifice flesh, and they eat, Jehovah hath not accepted them, Now doth He remember their iniquity, And inspect their sin, They -- [to] Egypt they turn back.";
dby[13] = "They sacrifice flesh [for] the sacrifices of mine offerings, and eat it; Jehovah hath no delight in them. Now will he remember their iniquity, and visit their sins: they shall return to Egypt.";
web[13] = "They sacrifice flesh [for] the sacrifices of my offerings, and eat [it]; [but] the LORD accepteth them not; now will he remember their iniquity, and visit their sins: they shall return to Egypt.";
hnv[13] = "As for the sacrifices of my offerings, they sacrifice flesh and eat it; But the LORD doesn\'t accept them. Now he will remember their iniquity, And punish their sins. They will return to Mitzrayim.";
vul[13] = "hostias adfer adfer immolabunt carnes et comedent Dominus non suscipiet eas nunc recordabitur iniquitatis eorum et visitabit peccata eorum ipsi in Aegyptum convertentur";
kjv[14] = "For Israel hath forgotten his Maker, and buildeth temples; and Judah hath multiplied fenced cities: but I will send a fire upon his cities, and it shall devour the palaces thereof.";
rsv[14] = "For Israel has forgotten his Maker, and built palaces; and Judah has multiplied fortified cities; but I will send a fire upon his cities, and it shall devour his strongholds.";
asv[14] = "For Israel hath forgotten his Maker, and builded palaces; and Judah hath multiplied fortified cities: but I will send a fire upon his cities, and it shall devour the castles thereof.";
yng[14] = "And forget doth Israel his Maker, and buildeth temples, And Judah hath multiplied cities of defence, And I have sent a fire into his cities, And it hath consumed their palaces!";
dby[14] = "For Israel hath forgotten his Maker, and buildeth temples; and Judah hath multiplied fenced cities: but I will send a fire upon his cities, and it shall devour the palaces thereof.";
web[14] = "For Israel hath forgotten his Maker, and buildeth temples; and Judah hath multiplied fortified cities: but I will send a fire upon his cities, and it shall devour the palaces thereof.";
hnv[14] = "For Yisra\'el has forgotten his Maker and built palaces; And Yehudah has multiplied fortified cities; But I will send a fire on his cities, And it will devour its fortresses.&quot;";
vul[14] = "et oblitus est Israhel factoris sui et aedificavit delubra et Iudas multiplicavit urbes munitas et mittam ignem in civitates eius et devorabit aedes illius";
