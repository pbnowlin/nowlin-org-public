csb[1] = "when I heal Israel, the iniquity of Ephraim and the crimes of Samaria will be exposed.For they practice fraud; a thief breaks in; a raiding party pillages outside.";
csb[2] = "But they never consider that I remember all their evil.Now their actions are all around them; they are right in front of my face.";
csb[3] = "They please the king with their evil, the princes with their lies.";
csb[4] = "All of them commit adultery; they are like an oven heated by a baker who stops stirring the fire from the kneading of the dough until it is leavened.";
csb[5] = "On the day of our king, the princes are sick with the heat of wine -- there is a conspiracy with traitors.";
csb[6] = "For they -- their hearts like an oven -- draw him into their oven. Their anger smolders all night; in the morning it blazes like a flaming fire.";
csb[7] = "All of them are as hot as an oven, and they consume their rulers. All their kings fall; not one of them calls on me.";
csb[8] = "Ephraim has allowed himself to get mixed up with the nations. Ephraim is unturned bread baked on a griddle.";
csb[9] = "Foreigners consume his strength, but he does not notice. Even his hair is streaked with gray, but he does not notice.";
csb[10] = "Israel\'s arrogance testifies against them, yet they do not return to the LORD their God, and for all this, they do not seek him.";
csb[11] = "So Ephraim has become like a silly, senseless dove; they call to Egypt, and they go to Assyria.";
csb[12] = "As they are going, I will spread my net over them; I will bring them down like birds of the sky. I will discipline them in accordance with the news that reaches their assembly.";
csb[13] = "Woe to them, for they fled from me; destruction to them, for they rebelled against me! Though I want to redeem them, they speak lies against me.";
csb[14] = "They do not cry to me from their hearts; rather, they wail on their beds. They slash themselves for grain and new wine; they turn away from me.";
csb[15] = "I trained and strengthened their arms, but they plot evil against me.";
csb[16] = "They turn, but not to what is above; they are like a faulty bow. Their leaders will fall by the sword because of their insolent tongue. They will be ridiculed for this in the land of Egypt.";
kjv[1] = "When I would have healed Israel, then the iniquity of Ephraim was discovered, and the wickedness of Samaria: for they commit falsehood; and the thief cometh in, [and] the troop of robbers spoileth without.";
rsv[1] = "when I would heal Israel, the corruption of E\'phraim is revealed, and the wicked deeds of Sama\'ria; for they deal falsely, the thief breaks in, and the bandits raid without.";
asv[1] = "When I would heal Israel, then is the iniquity of Ephraim uncovered, and the wickedness of Samaria; for they commit falsehood, and the thief entereth in, and the troop of robbers ravageth without.";
yng[1] = "`When I give healing to Israel, Then revealed is the iniquity of Ephraim, And the wickedness of Samaria, For they have wrought falsehood, And a thief doth come in, Stript off hath a troop in the street,";
dby[1] = "When I would heal Israel, then the iniquity of Ephraim is discovered, and the wickedness of Samaria: for they practise falsehood; and the thief entereth in, [and] the troop of robbers assaileth without.";
web[1] = "When I would have healed Israel, then the iniquity of Ephraim was disclosed, and the wickedness of Samaria: for they commit falsehood; and the thief cometh in, [and] the troop of robbers strippeth without.";
hnv[1] = "When I would heal Yisra\'el, Then the iniquity of Efrayim is uncovered, Also the wickedness of Shomron; For they commit falsehood, And the thief enters in, And the gang of robbers ravages outside.";
vul[1] = "cum sanare vellem Israhel revelata est iniquitas Ephraim et malitia Samariae quia operati sunt mendacium et fur ingressus est spolians latrunculus foris";
kjv[2] = "And they consider not in their hearts [that] I remember all their wickedness: now their own doings have beset them about; they are before my face.";
rsv[2] = "But they do not consider that I remember all their evil works. Now their deeds encompass them, they are before my face.";
asv[2] = "And they consider not in their hearts that I remember all their wickedness: now have their own doings beset them about; they are before my face.";
yng[2] = "And they do not say to their heart, [That] all their evil I have remembered, Now compassed them have their doings, Over-against My face they have been.";
dby[2] = "And they say not in their hearts [that] I remember all their wickedness: now do their own doings encompass them; they are before my face.";
web[2] = "And they consider not in their hearts [that] I remember all their wickedness: now their own doings have beset them around; they are before my face.";
hnv[2] = "They don\'t consider in their hearts that I remember all their wickedness. Now their own deeds have engulfed them. They are before my face.";
vul[2] = "et ne forte dicant in cordibus suis omnem malitiam eorum me recordatum nunc circumdederunt eos adinventiones suae coram facie mea factae sunt";
kjv[3] = "They make the king glad with their wickedness, and the princes with their lies.";
rsv[3] = "By their wickedness they make the king glad, and the princes by their treachery.";
asv[3] = "They make the king glad with their wickedness, and the princes with their lies.";
yng[3] = "With their wickedness they make glad a king, And with their lies -- princes.";
dby[3] = "They make the king glad with their wickedness, and the princes with their lies.";
web[3] = "They make the king glad with their wickedness, and the princes with their lies.";
hnv[3] = "They make the king glad with their wickedness, And the princes with their lies.";
vul[3] = "in malitia sua laetificaverunt regem et in mendaciis suis principes";
kjv[4] = "They [are] all adulterers, as an oven heated by the baker, [who] ceaseth from raising after he hath kneaded the dough, until it be leavened.";
rsv[4] = "They are all adulterers; they are like a heated oven, whose baker ceases to stir the fire, from the kneading of the dough until it is leavened.";
asv[4] = "They are all adulterers; they are as an oven heated by the baker; he ceaseth to stir [the fire], from the kneading of the dough, until it be leavened.";
yng[4] = "All of them [are] adulterers, Like a burning oven of a baker, He ceaseth from stirring up after kneading the dough, till its leavening.";
dby[4] = "They all practise adultery, as an oven heated by the baker: he ceaseth from stirring [the fire] after he hath kneaded the dough, until it be leavened.";
web[4] = "They [are] all adulterers, as an oven heated by the baker, [who] ceaseth from raising after he hath kneaded the dough, until it is leavened.";
hnv[4] = "They are all adulterers. They are burning like an oven that the baker stops stirring, From the kneading of the dough, until it is leavened.";
vul[4] = "omnes adulterantes quasi clibanus succensus a coquente quievit paululum civitas a commixtione fermenti donec fermentaretur totum";
kjv[5] = "In the day of our king the princes have made [him] sick with bottles of wine; he stretched out his hand with scorners.";
rsv[5] = "On the day of our king the princes became sick with the heat of wine; he stretched out his hand with mockers.";
asv[5] = "On the day of our king the princes made themselves sick with the heat of wine; he stretched out his hand with scoffers.";
yng[5] = "A day of our king! Princes have polluted themselves [with] the poison of wine, He hath drawn out his hand with scorners.";
dby[5] = "In the day of our king, the princes made themselves sick with the heat of wine: he stretched out his hand to scorners.";
web[5] = "In the day of our king the princes have made [him] sick with bottles of wine; he stretched out his hand with scorners.";
hnv[5] = "On the day of our king, the princes made themselves sick with the heat of wine. He joined his hand with mockers.";
vul[5] = "dies regis nostri coeperunt principes furere a vino extendit manum suam cum inlusoribus";
kjv[6] = "For they have made ready their heart like an oven, whiles they lie in wait: their baker sleepeth all the night; in the morning it burneth as a flaming fire.";
rsv[6] = "For like an oven their hearts burn with intrigue; all night their anger smolders; in the morning it blazes like a flaming fire.";
asv[6] = "For they have made ready their heart like an oven, while they lie in wait: their baker sleepeth all the night; in the morning it burneth as a flaming fire.";
yng[6] = "For they have drawn near, As an oven [is] their heart, In their lying in wait all the night sleep doth their baker, Morning! he is burning as a flaming fire.";
dby[6] = "For they have applied their heart like an oven to their lying in wait: their baker sleepeth all the night; in the morning it burneth like a flaming fire.";
web[6] = "For they have made ready their heart like an oven, while they lie in wait: their baker sleepeth all the night; in the morning it burneth as a flaming fire.";
hnv[6] = "For they have made ready their heart like an oven, While they lie in wait. Their baker sleeps all the night. In the morning it burns as a flaming fire.";
vul[6] = "quia adplicuerunt quasi clibanum cor suum cum insidiaretur eis tota nocte dormivit coquens eos mane ipse succensus quasi ignis flammae";
kjv[7] = "They are all hot as an oven, and have devoured their judges; all their kings are fallen: [there is] none among them that calleth unto me.";
rsv[7] = "All of them are hot as an oven, and they devour their rulers. All their kings have fallen; and none of them calls upon me.";
asv[7] = "They are all hot as an oven, and devour their judges; all their kings are fallen: there is none among them that calleth unto me.";
yng[7] = "All of them are warm as an oven, And they have devoured their judges, All their kings have fallen, There is none calling unto Me among them.";
dby[7] = "They are all hot as an oven, and devour their judges; all their kings are fallen: there is none among them that calleth unto me.";
web[7] = "They are all hot as an oven, and have devoured their judges; all their kings are fallen: [there is] none among them that calleth to me.";
hnv[7] = "They are all hot as an oven, And devour their judges. All their kings have fallen. There is no one among them who calls to me.";
vul[7] = "omnes calefacti sunt quasi clibanus et devoraverunt iudices suos omnes reges eorum ceciderunt non est qui clamet in eis ad me";
kjv[8] = "Ephraim, he hath mixed himself among the people; Ephraim is a cake not turned.";
rsv[8] = "E\'phraim mixes himself with the peoples; E\'phraim is a cake not turned.";
asv[8] = "Ephraim, he mixeth himself among the peoples; Ephraim is a cake not turned.";
yng[8] = "Ephraim! among peoples he mixeth himself, Ephraim hath been a cake unturned.";
dby[8] = "Ephraim, he mixeth himself with the peoples; Ephraim is a cake not turned.";
web[8] = "Ephraim, he hath mixed himself among the people; Ephraim is a cake not turned.";
hnv[8] = "Efrayim, he mixes himself among the nations. Efrayim is a pancake not turned over.";
vul[8] = "Ephraim in populis ipse commiscebatur Ephraim factus est subcinericius qui non reversatur";
kjv[9] = "Strangers have devoured his strength, and he knoweth [it] not: yea, gray hairs are here and there upon him, yet he knoweth not.";
rsv[9] = "Aliens devour his strength, and he knows it not; gray hairs are sprinkled upon him, and he knows it not.";
asv[9] = "Strangers have devoured his strength, and he knoweth [it] not: yea, gray hairs are here and there upon him, and he knoweth [it] not.";
yng[9] = "Devoured have strangers his power, And he hath not known, Also old age hath sprinkled [itself] on him, And he hath not known.";
dby[9] = "Strangers have devoured his strength, and he knoweth [it] not; yea, gray hairs are here and there upon him, and he knoweth [it] not.";
web[9] = "Strangers have devoured his strength, and he knoweth [it] not: yes, gray hairs are here and there upon him, yet he knoweth not.";
hnv[9] = "Strangers have devoured his strength, And he doesn\'t realize it. Indeed, gray hairs are here and there on him, And he doesn\'t realize it.";
vul[9] = "comederunt alieni robur eius et ipse nescivit sed et cani effusi sunt in eo et ipse ignoravit";
kjv[10] = "And the pride of Israel testifieth to his face: and they do not return to the LORD their God, nor seek him for all this.";
rsv[10] = "The pride of Israel witnesses against him; yet they do not return to the LORD their God, nor seek him, for all this.";
asv[10] = "And the pride of Israel doth testify to his face: yet they have not returned unto Jehovah their God, nor sought him, for all this.";
yng[10] = "And humbled hath been the excellency of Israel to his face, And they have not turned back unto Jehovah their God, Nor have they sought Him for all this.";
dby[10] = "And the pride of Israel testifieth to his face; and they do not return to Jehovah their God, nor seek him for all this.";
web[10] = "And the pride of Israel testifieth to his face: and they do not return to the LORD their God, nor seek him for all this.";
hnv[10] = "The pride of Yisra\'el testifies to his face; Yet they haven\'t returned to the LORD their God, Nor sought him, for all this.";
vul[10] = "et humiliabitur superbia Israhel in facie eius nec reversi sunt ad Dominum Deum suum et non quaesierunt eum in omnibus his";
kjv[11] = "Ephraim also is like a silly dove without heart: they call to Egypt, they go to Assyria.";
rsv[11] = "E\'phraim is like a dove, silly and without sense, calling to Egypt, going to Assyria.";
asv[11] = "And Ephraim is like a silly dove, without understanding: they call unto Egypt, they go to Assyria.";
yng[11] = "And Ephraim is as a simple dove without heart, Egypt they called on -- [to] Asshur they have gone.";
dby[11] = "And Ephraim is become like a silly dove without understanding: they call to Egypt, they go to Assyria.";
web[11] = "Ephraim also is like a silly dove without heart: they call to Egypt, they go to Assyria.";
hnv[11] = "&quot;Efrayim is like an easily deceived dove, without understanding. They call to Mitzrayim. They go to Ashshur.";
vul[11] = "et factus est Ephraim quasi columba seducta non habens cor Aegyptum invocabant ad Assyrios abierunt";
kjv[12] = "When they shall go, I will spread my net upon them; I will bring them down as the fowls of the heaven; I will chastise them, as their congregation hath heard.";
rsv[12] = "As they go, I will spread over them my net; I will bring them down like birds of the air; I will chastise them for their wicked deeds.";
asv[12] = "When they shall go, I will spread my net upon them; I will bring them down as the birds of the heavens; I will chastise them, as their congregation hath heard.";
yng[12] = "When they go I spread over them My net, As the fowl of the heavens I bring them down, I chastise them as their company hath heard.";
dby[12] = "When they go, I will spread my net upon them; I will bring them down as the fowl of the heavens; I will chastise them, according as their assembly hath heard.";
web[12] = "When they shall go, I will spread my net upon them; I will bring them down as the fowls of the heaven; I will chastise them, as their congregation hath heard.";
hnv[12] = "When they go, I will spread my net on them. I will bring them down like the birds of the sky. I will chastise them, as their congregation has heard.";
vul[12] = "et cum profecti fuerint expandam super eos rete meum quasi volucrem caeli detraham eos caedam eos secundum auditionem coetus eorum";
kjv[13] = "Woe unto them! for they have fled from me: destruction unto them! because they have transgressed against me: though I have redeemed them, yet they have spoken lies against me.";
rsv[13] = "Woe to them, for they have strayed from me! Destruction to them, for they have rebelled against me! I would redeem them, but they speak lies against me.";
asv[13] = "Woe unto them! for they have wandered from me; destruction unto them! for they have trespassed against me: though I would redeem them, yet they have spoken lies against me.";
yng[13] = "Wo to them, for they wandered from Me, Destruction to them, for they transgressed against Me, And I -- I ransom them, and they have spoken lies against Me,";
dby[13] = "Woe unto them! for they have wandered from me; destruction unto them! for they have transgressed against me. And I would redeem them; but they speak lies against me.";
web[13] = "Woe to them! for they have fled from me: destruction to them! because they have transgressed against me: though I have redeemed them, yet they have spoken lies against me.";
hnv[13] = "Woe to them! For they have wandered from me. Destruction to them! For they have trespassed against me. Though I would redeem them, Yet they have spoken lies against me.";
vul[13] = "vae eis quoniam recesserunt a me vastabuntur quia praevaricati sunt in me et ego redemi eos et ipsi locuti sunt contra me mendacia";
kjv[14] = "And they have not cried unto me with their heart, when they howled upon their beds: they assemble themselves for corn and wine, [and] they rebel against me.";
rsv[14] = "They do not cry to me from the heart, but they wail upon their beds; for grain and wine they gash themselves, they rebel against me.";
asv[14] = "And they have not cried unto me with their heart, but they howl upon their beds: they assemble themselves for grain and new wine; they rebel against me.";
yng[14] = "And have not cried unto Me with their heart, but howl on their beds, For corn and new wine they assemble themselves, They turn aside against Me.";
dby[14] = "And they cried not unto me in their heart, when they howled upon their beds; they assemble themselves for corn and new wine; they have turned aside from me.";
web[14] = "And they have not cried to me with their heart, when they howled upon their beds: they assemble themselves for corn and wine, [and] they rebel against me.";
hnv[14] = "They haven\'t cried to me with their heart, But they howl on their beds. They assemble themselves for grain and new wine. They turn away from me.";
vul[14] = "et non clamaverunt ad me in corde suo sed ululabant in cubilibus suis super triticum et vinum ruminabant recesserunt a me";
kjv[15] = "Though I have bound [and] strengthened their arms, yet do they imagine mischief against me.";
rsv[15] = "Although I trained and strengthened their arms, yet they devise evil against me.";
asv[15] = "Though I have taught and strengthened their arms, yet do they devise mischief against me.";
yng[15] = "And I instructed -- I strengthened their arms, And concerning Me they think evil!";
dby[15] = "I have indeed trained, I have strengthened their arms, but they imagine mischief against me.";
web[15] = "Though I have bound [and] strengthened their arms, yet do they imagine mischief against me.";
hnv[15] = "Though I have taught and strengthened their arms, Yet they plot evil against me.";
vul[15] = "et ego erudivi et confortavi brachia eorum et in me cogitaverunt malitiam";
kjv[16] = "They return, [but] not to the most High: they are like a deceitful bow: their princes shall fall by the sword for the rage of their tongue: this [shall be] their derision in the land of Egypt.";
rsv[16] = "They turn to Ba\'al; they are like a treacherous bow, their princes shall fall by the sword because of the insolence of their tongue. This shall be their derision in the land of Egypt.";
asv[16] = "They return, but not to [him that is] on high; they are like a deceitful bow; their princes shall fall by the sword for the rage of their tongue: this shall be their derision in the land of Egypt.";
yng[16] = "They turn back -- not to the Most High, They have been as a deceitful bow, Fall by sword do their princes, From the insolence of their tongue, This [is] their derision in the land of Egypt!";
dby[16] = "They return, [but] not to the [Most] High: they are like a deceitful bow. Their princes shall fall by the sword for the rage of their tongue: this shall be their derision in the land of Egypt.";
web[16] = "They return, [but] not to the most High: they are like a deceitful bow: their princes shall fall by the sword for the rage of their tongue: this [shall be] their derision in the land of Egypt.";
hnv[16] = "They return, but not to Ha`Elyon. They are like a faulty bow. Their princes will fall by the sword for the rage of their tongue. This will be their derision in the land of Mitzrayim.";
vul[16] = "reversi sunt ut essent absque iugo facti sunt quasi arcus dolosus cadent in gladio principes eorum a furore linguae suae ista subsannatio eorum in terra Aegypti";
