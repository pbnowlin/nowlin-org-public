csb[1] = "Hear this, priests! Pay attention, house of Israel! Listen, royal house! For the judgment applies to you because you have been a snare at Mizpah and a net spread out on Tabor.";
csb[2] = "Rebels are deeply involved in slaughter; I will be a punishment for all of them.";
csb[3] = "I know Ephraim, and Israel is not hidden from me. For now, Ephraim, you have acted promiscuously; Israel is defiled.";
csb[4] = "Their actions do not allow them to return to their God, for a spirit of promiscuity is among them, and they do not know the LORD.";
csb[5] = "Israel\'s arrogance testifies against them. Both Israel and Ephraim stumble because of their iniquity; even Judah will stumble with them.";
csb[6] = "They go with their flocks and herds to seek the LORD but do not find him; he has withdrawn from them.";
csb[7] = "They betrayed the LORD; indeed, they gave birth to illegitimate children. Now the New Moon will devour them along with their fields.";
csb[8] = "Blow the horn in Gibeah, the trumpet in Ramah; raise the war cry in Beth-aven: Look behind you, Benjamin!";
csb[9] = "Ephraim will become a desolation on the day of punishment; I announce what is certain among the tribes of Israel.";
csb[10] = "The princes of Judah are like those who move boundary markers; I will pour out my fury on them like water.";
csb[11] = "Ephraim is oppressed, crushed in judgment, for he is determined to follow what is worthless.";
csb[12] = "So I am like rot to Ephraim and like decay to the house of Judah.";
csb[13] = "When Ephraim saw his sickness and Judah his wound, Ephraim went to Assyria and sent a delegation to the great king. But he cannot cure you or heal your wound.";
csb[14] = "For I am like a lion to Ephraim and like a young lion to the house of Judah. Yes, I will tear them to pieces and depart. I will carry them off, and no one can rescue them.";
csb[15] = "I will depart and return to my place until they recognize their guilt and seek my face; they will search for me in their distress.";
kjv[1] = "Hear ye this, O priests; and hearken, ye house of Israel; and give ye ear, O house of the king; for judgment [is] toward you, because ye have been a snare on Mizpah, and a net spread upon Tabor.";
rsv[1] = "Hear this, O priests! Give heed, O house of Israel! Hearken, O house of the king! For the judgment pertains to you; for you have been a snare at Mizpah, and a net spread upon Tabor.";
asv[1] = "Hear this, O ye priests, and hearken, O house of Israel, and give ear, O house of the king; for unto you pertaineth the judgment; for ye have been a snare at Mizpah, and a net spread upon Tabor.";
yng[1] = "`Hear this, O priests, and attend, O house of Israel, And, O house of the king, give ear, For the judgment [is] for you, For, a snare ye have been on Mizpah, And a net spread out on Tabor.";
dby[1] = "Hear this, ye priests; and hearken, ye house of Israel; and give ear, O house of the king: for this judgment is for you; for ye have been a snare at Mizpah, and a net spread upon Tabor.";
web[1] = "Hear ye this, O priests; and hearken, ye house of Israel; and give ye ear, O house of the king; for judgment [is] towards you, because ye have been a snare on Mizpah, and a net spread upon Tabor.";
hnv[1] = "&quot;Listen to this, you Kohanim! Listen, house of Yisra\'el, And give ear, house of the king! For the judgment is against you; For you have been a snare at Mitzpah, And a net spread on Tavor.";
vul[1] = "audite hoc sacerdotes et adtendite domus Israhel et domus regis auscultate quia vobis iudicium est quoniam laqueus facti estis speculationi et rete expansum super Thabor";
kjv[2] = "And the revolters are profound to make slaughter, though I [have been] a rebuker of them all.";
rsv[2] = "And they have made deep the pit of Shittim; but I will chastise all of them.";
asv[2] = "And the revolters are gone deep in making slaughter; but I am a rebuker of them all.";
yng[2] = "And to slaughter sinners have gone deep, And I [am] a fetter to them all.";
dby[2] = "And they have plunged themselves in the corruption of apostasy, but I will be a chastiser of them all.";
web[2] = "And the revolters are profound to make slaughter, though I [have been] a rebuker of them all.";
hnv[2] = "The rebels are deep in slaughter; But I discipline all of them.";
vul[2] = "et victimas declinastis in profundum et ego eruditor omnium eorum";
kjv[3] = "I know Ephraim, and Israel is not hid from me: for now, O Ephraim, thou committest whoredom, [and] Israel is defiled.";
rsv[3] = "I know E\'phraim, and Israel is not hid from me; for now, O E\'phraim, you have played the harlot, Israel is defiled.";
asv[3] = "I know Ephraim, and Israel is not hid from me; for now, O Ephraim, thou hast played the harlot, Israel is defiled.";
yng[3] = "I have known Ephraim, And Israel hath not been hid from me, For now thou hast gone a-whoring, Ephraim, Defiled is Israel.";
dby[3] = "I know Ephraim, and Israel is not hid from me; for now, Ephraim, thou hast committed whoredom; Israel is defiled.";
web[3] = "I know Ephraim, and Israel is not hid from me: for now, O Ephraim, thou art guilty of lewdness, [and] Israel is defiled.";
hnv[3] = "I know Efrayim, And Yisra\'el is not hidden from me; For now, Efrayim, you have played the prostitute. Yisra\'el is defiled.";
vul[3] = "ego scio Ephraim et Israhel non est absconditus a me quia nunc fornicatus est Ephraim contaminatus est Israhel";
kjv[4] = "They will not frame their doings to turn unto their God: for the spirit of whoredoms [is] in the midst of them, and they have not known the LORD.";
rsv[4] = "Their deeds do not permit them to return to their God. For the spirit of harlotry is within them, and they know not the LORD.";
asv[4] = "Their doings will not suffer them to turn unto their God; for the spirit of whoredom is within them, and they know not Jehovah.";
yng[4] = "They give not up their habitual doings, To turn back unto their God, For a spirit of whoredoms [is] in their midst, And Jehovah they have not known.";
dby[4] = "Their doings do not allow them to return unto their God; for the spirit of whoredoms is in the midst of them, and they know not Jehovah.";
web[4] = "They will not frame their doings to turn to their God: for the spirit of lewdness [is] in the midst of them, and they have not known the LORD.";
hnv[4] = "Their deeds won\'t allow them to turn to their God; For the spirit of prostitution is within them, And they don\'t know the LORD.";
vul[4] = "non dabunt cogitationes suas ut revertantur ad Dominum suum quia spiritus fornicationis in medio eorum et Dominum non cognoverunt";
kjv[5] = "And the pride of Israel doth testify to his face: therefore shall Israel and Ephraim fall in their iniquity; Judah also shall fall with them.";
rsv[5] = "The pride of Israel testifies to his face; E\'phraim shall stumble in his guilt; Judah also shall stumble with them.";
asv[5] = "And the pride of Israel doth testify to his face: therefore Israel and Ephraim shall stumble in their iniquity; Judah also shall stumble with them.";
yng[5] = "And humbled hath been the excellency of Israel to his face, And Israel and Ephraim stumble by their iniquity, Stumbled also hath Judah with them.";
dby[5] = "And Israel\'s pride doth testify to his face; and Israel and Ephraim shall fall by their iniquity: Judah also shall fall with them.";
web[5] = "And the pride of Israel doth testify to his face: therefore shall Israel and Ephraim fall in their iniquity; Judah also shall fall with them.";
hnv[5] = "The pride of Yisra\'el testifies to his face. Therefore Yisra\'el and Efrayim will stumble in their iniquity. Yehudah also will stumble with them.";
vul[5] = "et respondebit arrogantia Israhel in facie eius et Israhel et Ephraim ruent in iniquitate sua ruet etiam Iudas cum eis";
kjv[6] = "They shall go with their flocks and with their herds to seek the LORD; but they shall not find [him]; he hath withdrawn himself from them.";
rsv[6] = "With their flocks and herds they shall go to seek the LORD, but they will not find him; he has withdrawn from them.";
asv[6] = "They shall go with their flocks and with their herds to seek Jehovah; but they shall not find him: he hath withdrawn himself from them.";
yng[6] = "With their flock and with their herd, They go to seek Jehovah, and do not find, He hath withdrawn from them.";
dby[6] = "They shall go with their flocks and with their herds to seek Jehovah; but they shall not find [him]: he hath withdrawn himself from them.";
web[6] = "They shall go with their flocks and with their herds to seek the LORD; but they shall not find [him]; he hath withdrawn himself from them.";
hnv[6] = "They will go with their flocks and with their herds to seek the LORD; But they won\'t find him. He has withdrawn himself from them.";
vul[6] = "in gregibus suis et in armentis suis vadent ad quaerendum Dominum et non invenient ablatus est ab eis";
kjv[7] = "They have dealt treacherously against the LORD: for they have begotten strange children: now shall a month devour them with their portions.";
rsv[7] = "They have dealt faithlessly with the LORD; for they have borne alien children. Now the new moon shall devour them with their fields.";
asv[7] = "They have dealt treacherously against Jehovah; for they have borne strange children: now shall the new moon devour them with their fields.";
yng[7] = "Against Jehovah they dealt treacherously, For strange sons they have begotten, Now consume them doth a month [with] their portions.";
dby[7] = "They have dealt treacherously against Jehovah; for they have begotten strange children: now shall the new moon devour them, with their allotted possessions.";
web[7] = "They have dealt treacherously against the LORD: for they have begotten strange children: now shall a month devour them with their portions.";
hnv[7] = "They are unfaithful to the LORD; For they have borne illegitimate children. Now the new moon will devour them with their fields.";
vul[7] = "in Domino praevaricati sunt quia filios alienos genuerunt nunc devorabit eos mensis cum partibus suis";
kjv[8] = "Blow ye the cornet in Gibeah, [and] the trumpet in Ramah: cry aloud [at] Bethaven, after thee, O Benjamin.";
rsv[8] = "Blow the horn in Gib\'e-ah, the trumpet in Ramah. Sound the alarm at Beth-a\'ven; tremble, O Benjamin!";
asv[8] = "Blow ye the cornet in Gibeah, and the trumpet in Ramah: sound an alarm at Beth-aven; behind thee, O Benjamin.";
yng[8] = "Blow ye a cornet in Gibeah, a trumpet in Ramah, Shout, O Beth-Aven, after thee, O Benjamin.";
dby[8] = "Blow the horn in Gibeah, the trumpet in Ramah; cry aloud [at] Beth-aven: behind thee, O Benjamin!";
web[8] = "Blow ye the cornet in Gibeah, [and] the trumpet in Ramah: cry aloud [at] Beth-aven, after thee, O Benjamin.";
hnv[8] = "&quot;Blow the cornet in Gevah, And the shofar in Ramah! Sound a battle cry at Beit-Aven, behind you, Binyamin!";
vul[8] = "clangite bucina in Gabaa tuba in Rama ululate in Bethaven post tergum tuum Beniamin";
kjv[9] = "Ephraim shall be desolate in the day of rebuke: among the tribes of Israel have I made known that which shall surely be.";
rsv[9] = "E\'phraim shall become a desolation in the day of punishment; among the tribes of Israel I declare what is sure.";
asv[9] = "Ephraim shall become a desolation in the day of rebuke: among the tribes of Israel have I made known that which shall surely be.";
yng[9] = "Ephraim is for a desolation in a day of reproof, Among the tribes of Israel I have made known a sure thing.";
dby[9] = "Ephraim shall be a desolation in the day of rebuke: among the tribes of Israel have I made known that which is sure.";
web[9] = "Ephraim shall be desolate in the day of rebuke: among the tribes of Israel have I made known that which shall surely be.";
hnv[9] = "Efrayim will become a desolation in the day of rebuke. Among the tribes of Yisra\'el, I have made known that which will surely be.";
vul[9] = "Ephraim in desolatione erit in die correptionis in tribubus Israhel ostendi fidem";
kjv[10] = "The princes of Judah were like them that remove the bound: [therefore] I will pour out my wrath upon them like water.";
rsv[10] = "The princes of Judah have become like those who remove the landmark; upon them I will pour out my wrath like water.";
asv[10] = "The princes of Judah are like them that remove the landmark: I will pour out my wrath upon them like water.";
yng[10] = "Princes of Judah have been as those removing a border, On them I do pour out as water My wrath.";
dby[10] = "The princes of Judah are become like them that remove the landmark: I will pour out my wrath upon them like water.";
web[10] = "The princes of Judah were like them that remove the bound: [therefore] I will pour out my wrath upon them like water.";
hnv[10] = "The princes of Yehudah are like those who remove a landmark. I will pour out my wrath on them like water.";
vul[10] = "facti sunt principes Iuda quasi adsumentes terminum super eos effundam quasi aquam iram meam";
kjv[11] = "Ephraim [is] oppressed [and] broken in judgment, because he willingly walked after the commandment.";
rsv[11] = "E\'phraim is oppressed, crushed in judgment, because he was determined to go after vanity.";
asv[11] = "Ephraim is oppressed, he is crushed in judgment; because he was content to walk after [man\'s] command.";
yng[11] = "Oppressed is Ephraim, broken in judgment, When he pleased he went after the command.";
dby[11] = "Ephraim is oppressed, crushed in judgment, because in selfwill he walked after the commandment [of man].";
web[11] = "Ephraim [is] oppressed [and] broken in judgment, because he willingly walked after the commandment.";
hnv[11] = "Efrayim is oppressed, He is crushed in judgment; Because he is intent in his pursuit of idols.";
vul[11] = "calumniam patiens Ephraim fractus iudicio quoniam coepit abire post sordem";
kjv[12] = "Therefore [will] I [be] unto Ephraim as a moth, and to the house of Judah as rottenness.";
rsv[12] = "Therefore I am like a moth to E\'phraim, and like dry rot to the house of Judah.";
asv[12] = "Therefore am I unto Ephraim as a moth, and to the house of Judah as rottenness.";
yng[12] = "And I [am] as a moth to Ephraim, And as a rotten thing to the house of Judah.";
dby[12] = "And I will be unto Ephraim as a moth, and to the house of Judah as rottenness.";
web[12] = "Therefore [will] I [be] to Ephraim as a moth, and to the house of Judah as rottenness.";
hnv[12] = "Therefore I am to Efrayim like a moth, And to the house of Yehudah like rottenness.";
vul[12] = "et ego quasi tinea Ephraim et quasi putredo domui Iuda";
kjv[13] = "When Ephraim saw his sickness, and Judah [saw] his wound, then went Ephraim to the Assyrian, and sent to king Jareb: yet could he not heal you, nor cure you of your wound.";
rsv[13] = "When E\'phraim saw his sickness, and Judah his wound, then E\'phraim went to Assyria, and sent to the great king. But he is not able to cure you or heal your wound.";
asv[13] = "When Ephraim saw his sickness, and Judah [saw] his wound, then went Ephraim to Assyria, and sent to king Jareb: but he is not able to heal you, neither will he cure you of your wound.";
yng[13] = "And see doth Ephraim his sickness, and Judah his wound, And Ephraim goeth unto Asshur, And sendeth unto a warlike king, And he is not able to give healing to you, Nor doth he remove from you a scar.";
dby[13] = "When Ephraim saw his sickness, and Judah his sore, then went Ephraim to the Assyrian, and sent to king Jareb; but he was unable to heal you, nor hath he removed your sore.";
web[13] = "When Ephraim saw his sickness, and Judah [saw] his wound, then Ephraim went to the Assyrian, and sent to king Jareb: yet he could not heal you, nor cure you of your wound.";
hnv[13] = "When Efrayim saw his sickness, And Yehudah his wound, Then Efrayim went to Ashshur, And sent to king Yarev: But he is not able to heal you, Neither will he cure you of your wound.";
vul[13] = "et vidit Ephraim languorem suum et Iudas vinculum suum et abiit Ephraim ad Assur et misit ad regem ultorem et ipse non poterit sanare vos nec solvere poterit a vobis vinculum";
kjv[14] = "For I [will be] unto Ephraim as a lion, and as a young lion to the house of Judah: I, [even] I, will tear and go away; I will take away, and none shall rescue [him].";
rsv[14] = "For I will be like a lion to E\'phraim, and like a young lion to the house of Judah. I, even I, will rend and go away, I will carry off, and none shall rescue.";
asv[14] = "For I will be unto Ephraim as a lion, and as a young lion to the house of Judah: I, even I, will tear and go away; I will carry off, and there shall be none to deliver.";
yng[14] = "For I [am] as a lion to Ephraim, And as a young lion to the house of Judah, I -- I tear and go, I bear away, and there is no deliverer.";
dby[14] = "For I will be unto Ephraim as a lion, and as a young lion to the house of Judah. I, I will tear and go away; I will carry off, and there shall be none to deliver.";
web[14] = "For I [will be] to Ephraim as a lion, and as a young lion to the house of Judah: I, [even] I, will tear and go away; I will take away, and none shall rescue [him].";
hnv[14] = "For I will be to Efrayim like a lion, And like a young lion to the house of Yehudah. I myself will tear in pieces and go away. I will carry off, and there will be no one to deliver.";
vul[14] = "quoniam ego quasi leaena Ephraim et quasi catulus leonis domui Iuda ego ego capiam et vadam tollam et non est qui eruat";
kjv[15] = "I will go [and] return to my place, till they acknowledge their offence, and seek my face: in their affliction they will seek me early.";
rsv[15] = "I will return again to my place, until they acknowledge their guilt and seek my face, and in their distress they seek me, saying,";
asv[15] = "I will go and return to my place, till they acknowledge their offence, and seek my face: in their affliction they will seek me earnestly.";
yng[15] = "I go -- I turn back unto My place, Till that they are desolate, and have sought My face. In their distress they do seek Me speedily!\'";
dby[15] = "I will go away, I will return to my place, till they acknowledge their trespass, and seek my face: in their affliction they will seek me early.";
web[15] = "I will go [and] return to my place, till they acknowledge their offense, and seek my face: in their affliction they will seek me early.";
hnv[15] = "I will go and return to my place, until they acknowledge their offense, And seek my face. In their affliction they will seek me earnestly.&quot;";
