csb[1] = "Israel, do not rejoice jubilantly as the nations do, for you have acted promiscuously, leaving your God. You love the wages of a prostitute on every grain-threshing floor.";
csb[2] = "Threshing floor and wine vat will not sustain them, and the new wine will fail them.";
csb[3] = "They will not stay in the land of the LORD. Instead, Ephraim will return to Egypt, and they will eat unclean food in Assyria.";
csb[4] = "They will not pour out their wine offerings to the LORD, and their sacrifices will not please him. Their food will be like the bread of mourners; all who eat it become defiled. For their bread will be for their appetites alone; it will not enter the house of the LORD.";
csb[5] = "What will you do on a festival day, on the day of the LORD\'s feast?";
csb[6] = "For even if they flee from devastation, Egypt will gather them, and Memphis will bury them. Thistles will take possession of their precious silver; thorns will invade their tents.";
csb[7] = "The days of punishment have come; the days of retribution have come. Let Israel recognize it! The prophet is a fool, and the inspired man is insane, because of the magnitude of your iniquity and hostility.";
csb[8] = "Ephraim\'s watchman is with my God. Yet the prophet encounters a bird trap on all his pathways. Hostility is in the house of his God!";
csb[9] = "They have deeply corrupted themselves as in the days of Gibeah. He will remember their iniquity; he will punish their sins.";
csb[10] = "I discovered Israel like grapes in the wilderness. I saw your fathers like the first fruit of the fig tree in its first season. But they went to Baal-peor, consecrated themselves to Shame, and became abhorrent, like the thing they loved.";
csb[11] = "Ephraim\'s glory will fly away like a bird: no birth, no pregnancy, no conception.";
csb[12] = "Even if they raise children, I will bereave them of each one. Yes, woe to them when I depart from them!";
csb[13] = "I have seen Ephraim like Tyre, planted in a meadow, so Ephraim will bring out his children to the executioner.";
csb[14] = "Give them, LORD -- What should you give? Give them a womb that miscarries and breasts that are dry!";
csb[15] = "All their evil appears at Gilgal, for there I began to hate them. I will drive them from my house because of their evil, wicked actions. I will no longer love them; all their leaders are rebellious.";
csb[16] = "Ephraim is struck down; their roots are withered; they cannot bear fruit. Even if they bear children, I will kill the precious offspring of their wombs.";
csb[17] = "My God will reject them because they have not listened to him; they will become wanderers among the nations.";
kjv[1] = "Rejoice not, O Israel, for joy, as [other] people: for thou hast gone a whoring from thy God, thou hast loved a reward upon every cornfloor.";
rsv[1] = "Rejoice not, O Israel! Exult not like the peoples; for you have played the harlot, forsaking your God. You have loved a harlot\'s hire upon all threshing floors.";
asv[1] = "Rejoice not, O Israel, for joy, like the peoples; for thou hast played the harlot, [departing] from thy God; thou hast loved hire upon every grain-floor.";
yng[1] = "`Rejoice not, O Israel, be not joyful like the peoples, For thou hast gone a-whoring from thy God, Thou hast loved a gift near all floors of corn.";
dby[1] = "Rejoice not, Israel, exultingly, as the peoples; for thou hast gone a whoring from thy God, thou hast loved harlot\'s hire upon every corn-floor.";
web[1] = "Rejoice not, O Israel, for joy, as [other] people: for thou hast apostatized from thy God, thou hast loved a reward upon every corn-floor.";
hnv[1] = "Don\'t rejoice, Yisra\'el, to jubilation like the nations; For you were unfaithful to your God. You love the wages of a prostitute at every grain threshing floor.";
vul[1] = "noli laetari Israhel noli exultare sicut populi quia fornicatus es a Deo tuo dilexisti mercedem super omnes areas tritici";
kjv[2] = "The floor and the winepress shall not feed them, and the new wine shall fail in her.";
rsv[2] = "Threshing floor and winevat shall not feed them, and the new wine shall fail them.";
asv[2] = "The threshing-floor and the winepress shall not feed them, and the new wine shall fail her.";
yng[2] = "Floor and wine-press do not delight them, And new wine doth fail in her,";
dby[2] = "The floor and the winepress shall not feed them, and the new wine shall fail her.";
web[2] = "The floor and the wine-press shall not feed them, and the new wine shall fail in her.";
hnv[2] = "The threshing floor and the winepress won\'t feed them, And the new wine will fail her.";
vul[2] = "area et torcular non pascet eos et vinum mentietur eis";
kjv[3] = "They shall not dwell in the LORD\'S land; but Ephraim shall return to Egypt, and they shall eat unclean [things] in Assyria.";
rsv[3] = "They shall not remain in the land of the LORD; but E\'phraim shall return to Egypt, and they shall eat unclean food in Assyria.";
asv[3] = "They shall not dwell in Jehovah\'s land; but Ephraim shall return to Egypt, and they shall eat unclean food in Assyria.";
yng[3] = "They do not abide in the land of Jehovah, And turned back hath Ephraim [to] Egypt, And in Asshur an unclean thing they eat.";
dby[3] = "They shall not dwell in Jehovah\'s land; but Ephraim shall return to Egypt, and in Assyria shall they eat that which is unclean.";
web[3] = "They shall not dwell in the LORD\'S land; but Ephraim shall return to Egypt, and they shall eat unclean [things] in Assyria.";
hnv[3] = "They won\'t dwell in the LORD\'s land; But Efrayim will return to Mitzrayim, And they will eat unclean food in Ashshur.";
vul[3] = "non habitabunt in terra Domini reversus est Ephraim Aegyptum et in Assyriis pollutum comedit";
kjv[4] = "They shall not offer wine [offerings] to the LORD, neither shall they be pleasing unto him: their sacrifices [shall be] unto them as the bread of mourners; all that eat thereof shall be polluted: for their bread for their soul shall not come into the house of the LORD.";
rsv[4] = "They shall not pour libations of wine to the LORD; and they shall not please him with their sacrifices. Their bread shall be like mourners\' bread; all who eat of it shall be defiled; for their bread shall be for their hunger only; it shall not come to the house of the LORD.";
asv[4] = "They shall not pour out wine-[offerings] to Jehovah, neither shall they be pleasing unto him: their sacrifices shall be unto them as the bread of mourners; all that eat thereof shall be polluted; for their bread shall be for their appetite; it shall not come into the house of Jehovah.";
yng[4] = "They pour not out wine to Jehovah, Nor are they sweet to Him, Their sacrifices [are] as bread of mourners to them, All eating it are unclean: For their bread [is] for themselves, It doth not come into the house of Jehovah.";
dby[4] = "They shall pour out no [offerings of] wine to Jehovah, neither shall their sacrifices be pleasing unto him: they shall be unto them as the bread of mourners; all that eat thereof shall be defiled: for their bread shall be for themselves; it shall not come into the house of Jehovah.";
web[4] = "They shall not offer wine-[offerings] to the LORD, neither shall they be pleasing to him: their sacrifices [shall be] to them as the bread of mourners; all that eat of it shall be polluted: for their bread for their soul shall not come into the house of the LORD.";
hnv[4] = "They won\'t pour out wine offerings to the LORD, Neither will they be pleasing to him. Their sacrifices will be to them like the bread of mourners; All who eat of it will be polluted; For their bread will be for their appetite. It will not come into the house of the LORD.";
vul[4] = "non libabunt Domino vinum et non placebunt ei sacrificia eorum quasi panis lugentium omnes qui comedunt eum contaminabuntur quia panis eorum animae ipsorum non intrabit in domum Domini";
kjv[5] = "What will ye do in the solemn day, and in the day of the feast of the LORD?";
rsv[5] = "What will you do on the day of appointed festival, and on the day of the feast of the LORD?";
asv[5] = "What will ye do in the day of solemn assembly, and in the day of the feast of Jehovah?";
yng[5] = "What do ye at the day appointed? And at the day of Jehovah\'s festival?";
dby[5] = "What will ye do in the day of assembly, and in the day of the feast of Jehovah?";
web[5] = "What will ye do in the solemn day, and in the day of the feast of the LORD?";
hnv[5] = "What will you do in the day of solemn assembly, And in the day of the feast of the LORD?";
vul[5] = "quid facietis in die sollemni in die festivitatis Domini";
kjv[6] = "For, lo, they are gone because of destruction: Egypt shall gather them up, Memphis shall bury them: the pleasant [places] for their silver, nettles shall possess them: thorns [shall be] in their tabernacles.";
rsv[6] = "For behold, they are going to Assyria; Egypt shall gather them, Memphis shall bury them. Nettles shall possess their precious things of silver; thorns shall be in their tents.";
asv[6] = "For, lo, they are gone away from destruction; [yet] Egypt shall gather them up, Memphis shall bury them; their pleasant things of silver, nettles shall possess them; thorns shall be in their tents.";
yng[6] = "For, lo, they have gone because of destruction, Egypt gathereth them, Moph burieth them, The desirable things of their silver, Nettles possess them -- a thorn [is] in their tents.";
dby[6] = "For behold, they are gone away because of destruction: Egypt shall gather them up, Moph shall bury them: their pleasant things of silver, nettles shall possess them; thorns shall be in their tents.";
web[6] = "For lo, they are gone because of destruction: Egypt shall gather them up, Memphis shall bury them: the pleasant [places] for their silver, nettles shall possess them: thorns [shall be] in their tabernacles.";
hnv[6] = "For, behold, they have gone away from destruction. Mitzrayim will gather them up. Mof will bury them. Nettles will possess their pleasant things of silver. Thorns will be in their tents.";
vul[6] = "ecce enim profecti sunt a vastitate Aegyptus congregavit eos Memphis sepeliet eos desiderabile argenti eorum urtica hereditabit lappa in tabernaculis eorum";
kjv[7] = "The days of visitation are come, the days of recompence are come; Israel shall know [it]: the prophet [is] a fool, the spiritual man [is] mad, for the multitude of thine iniquity, and the great hatred.";
rsv[7] = "The days of punishment have come, the days of recompense have come; Israel shall know it. The prophet is a fool, the man of the spirit is mad, because of your great iniquity and great hatred.";
asv[7] = "The days of visitation are come, the days of recompense are come; Israel shall know it: the prophet is a fool, the man that hath the spirit is mad, for the abundance of thine iniquity, and because the enmity is great.";
yng[7] = "Come in have the days of inspection, Come in have the days of recompence, Israel doth know! a fool [is] the prophet, Mad [is] the man of the Spirit, Because of the abundance of thine iniquity, And great [is] the hatred.";
dby[7] = "The days of visitation are come; the days of recompence are come: Israel shall know [it]: the prophet is a fool, the inspired man is mad, because of the greatness of thine iniquity, and the great enmity.";
web[7] = "The days of visitation are come, the days of recompense are come; Israel shall know [it]: the prophet [is] a fool, the spiritual man [is] mad, for the multitude of thy iniquity, and the great hatred.";
hnv[7] = "The days of visitation have come. The days of reckoning have come. Yisra\'el will consider the prophet to be a fool, And the man who is inspired to be insane, Because of the abundance of your sins, And because your hostility is great.";
vul[7] = "venerunt dies visitationis venerunt dies retributionis scitote Israhel stultum prophetam insanum virum spiritalem propter multitudinem iniquitatis tuae et multitudo amentiae";
kjv[8] = "The watchman of Ephraim [was] with my God: [but] the prophet [is] a snare of a fowler in all his ways, [and] hatred in the house of his God.";
rsv[8] = "The prophet is the watchman of E\'phraim, the people of my God, yet a fowler\'s snare is on all his ways, and hatred in the house of his God.";
asv[8] = "Ephraim [was] a watchman with my God: as for the prophet, a fowler\'s snare is in all his ways, [and] enmity in the house of his God.";
yng[8] = "Ephraim is looking [away] from My God, The prophet! a snare of a fowler [is] over all his ways, Hatred [is] in the house of his God.";
dby[8] = "Is Ephraim a watchman with my God? [nay] the prophet is a fowler\'s snare on all his ways, enmity in the house of his God.";
web[8] = "The watchman of Ephraim [was] with my God: [but] the prophet [is] a snare of a fowler in all his ways, [and] hatred in the house of his God.";
hnv[8] = "A prophet watches over Efrayim with my God. A fowler\'s snare is on all of his paths, And hostility in the house of his God.";
vul[8] = "speculator Ephraim cum Deo meo propheta laqueus ruinae super omnes vias eius insania in domo Dei eius";
kjv[9] = "They have deeply corrupted [themselves], as in the days of Gibeah: [therefore] he will remember their iniquity, he will visit their sins.";
rsv[9] = "They have deeply corrupted themselves as in the days of Gib\'e-ah: he will remember their iniquity, he will punish their sins.";
asv[9] = "They have deeply corrupted themselves, as in the days of Gibeah: he will remember their iniquity, he will visit their sins.";
yng[9] = "They have gone deep -- have done corruptly, As [in] the days of Gibeah, He doth remember their iniquity, He doth inspect their sins.";
dby[9] = "They have deeply corrupted themselves as in the days of Gibeah. He will remember their iniquity, he will visit their sins.";
web[9] = "They have deeply corrupted [themselves], as in the days of Gibeah: [therefore] he will remember their iniquity, he will visit their sins.";
hnv[9] = "They have deeply corrupted themselves, As in the days of Gevah. He will remember their iniquity. He will punish them for their sins.";
vul[9] = "profunde peccaverunt sicut in diebus Gabaa recordabitur iniquitatis eorum et visitabit peccata eorum";
kjv[10] = "I found Israel like grapes in the wilderness; I saw your fathers as the firstripe in the fig tree at her first time: [but] they went to Baalpeor, and separated themselves unto [that] shame; and [their] abominations were according as they loved.";
rsv[10] = "Like grapes in the wilderness, I found Israel. Like the first fruit on the fig tree, in its first season, I saw your fathers. But they came to Ba\'al-pe\'or, and consecrated themselves to Ba\'al, and became detestable like the thing they loved.";
asv[10] = "I found Israel like grapes in the wilderness; I saw your fathers as the first-ripe in the fig-tree at its first season: but they came to Baal-peor, and consecrated themselves unto the shameful thing, and became abominable like that which they loved.";
yng[10] = "As grapes in a wilderness I found Israel, As the first-fruit in a fig-tree, at its beginning, I have seen your fathers, They -- they have gone in [to] Baal-Peor, And are separated to a shameful thing, And are become abominable like their love.";
dby[10] = "I found Israel as grapes in the wilderness; as first-ripe fruit on the fig-tree, I saw your fathers at the beginning: they went to Baal-Peor, and separated themselves unto that shame, and became abominations like their lover.";
web[10] = "I found Israel like grapes in the wilderness; I saw your fathers as the first ripe in the fig-tree at her first time: [but] they went to Baal-peor, and separated themselves to [that] shame; and [their] abominations were according as they loved.";
hnv[10] = "I found Yisra\'el like grapes in the wilderness. I saw your fathers as the first ripe in the fig tree at its first season; But they came to Ba`al-Pe`or, and consecrated themselves to the shameful thing, And became abominable like that which they loved.";
vul[10] = "quasi uvas in deserto inveni Israhel quasi prima poma ficulneae in cacumine eius vidi patres eorum ipsi autem intraverunt ad Beelphegor et abalienati sunt in confusione et facti sunt abominabiles sicut ea quae dilexerunt";
kjv[11] = "[As for] Ephraim, their glory shall fly away like a bird, from the birth, and from the womb, and from the conception.";
rsv[11] = "E\'phraim\'s glory shall fly away like a bird--no birth, no pregnancy, no conception!";
asv[11] = "As for Ephraim, their glory shall fly away like a bird: there shall be no birth, and none with child, and no conception.";
yng[11] = "Ephraim [is] as a fowl, Fly away doth their honour, without birth, And without womb, and without conception.";
dby[11] = "As for Ephraim, their glory shall fly away as a bird, -- no birth, no pregnancy, no conception!";
web[11] = "[As for] Ephraim, their glory shall fly away like a bird, from the birth, and from the womb, and from the conception.";
hnv[11] = "As for Efrayim, their glory will fly away like a bird. There will be no birth, none with child, and no conception.";
vul[11] = "Ephraim quasi avis avolavit gloria eorum a partu et ab utero et a conceptu";
kjv[12] = "Though they bring up their children, yet will I bereave them, [that there shall] not [be] a man [left]: yea, woe also to them when I depart from them!";
rsv[12] = "Even if they bring up children, I will bereave them till none is left. Woe to them when I depart from them!";
asv[12] = "Though they bring up their children, yet will I bereave them, so that not a man shall be left: yea, woe also to them when I depart from them!";
yng[12] = "For though they nourish their sons, I have made them childless -- without man, Surely also, wo to them, when I turn aside from them.";
dby[12] = "For even should they bring up their children, yet will I bereave them, [that] not a man [remain]: for woe also to them when I shall have departed from them!";
web[12] = "Though they bring up their children, yet will I bereave them, [that there shall] not [be] a man [left]: yes, woe also to them when I depart from them!";
hnv[12] = "Though they bring up their children, Yet I will bereave them, so that not a man shall be left. Indeed, woe also to them when I depart from them!";
vul[12] = "quod si et enutrierint filios suos absque liberis eos faciam in hominibus sed et vae eis cum recessero ab eis";
kjv[13] = "Ephraim, as I saw Tyrus, [is] planted in a pleasant place: but Ephraim shall bring forth his children to the murderer.";
rsv[13] = "E\'phraim\'s sons, as I have seen, are destined for a prey; E\'phraim must lead forth his sons to slaughter.";
asv[13] = "Ephraim, like as I have seen Tyre, is planted in a pleasant place: but Ephraim shall bring out his children to the slayer.";
yng[13] = "Ephraim! when I have looked to the rock, Is planted in comeliness, And Ephraim [is] to bring out unto a slayer his sons.";
dby[13] = "Ephraim, as I saw [him], was a Tyre planted in a beautiful place; but Ephraim shall bring forth his children to the slayer.";
web[13] = "Ephraim, as I saw Tyre, [is] planted in a pleasant place: but Ephraim shall bring forth his children to the murderer.";
hnv[13] = "Efrayim, like I have seen Tzor, is planted in a pleasant place; But Efrayim will bring out his children to the killer.";
vul[13] = "Ephraim ut vidi Tyrus erat fundata in pulchritudine et Ephraim educit ad interfectorem filios suos";
kjv[14] = "Give them, O LORD: what wilt thou give? give them a miscarrying womb and dry breasts.";
rsv[14] = "Give them, O LORD--what wilt thou give? Give them a miscarrying womb and dry breasts.";
asv[14] = "Give them, O Jehovah--what wilt thou give? give them a miscarrying womb and dry breasts.";
yng[14] = "Give to them, Jehovah -- what dost Thou give? Give to them miscarrying womb, and dry breasts.";
dby[14] = "Give them, Jehovah -- what wilt thou give? -- give them a miscarrying womb and dry breasts.";
web[14] = "Give them, O LORD: what wilt thou give? give them a miscarrying womb and dry breasts.";
hnv[14] = "Give them -- LORD what will you give? Give them a miscarrying womb and dry breasts.";
vul[14] = "da eis Domine quid dabis eis da eis vulvam sine liberis et ubera arentia";
kjv[15] = "All their wickedness [is] in Gilgal: for there I hated them: for the wickedness of their doings I will drive them out of mine house, I will love them no more: all their princes [are] revolters.";
rsv[15] = "Every evil of theirs is in Gilgal; there I began to hate them. Because of the wickedness of their deeds I will drive them out of my house. I will love them no more; all their princes are rebels.";
asv[15] = "All their wickedness is in Gilgal; for there I hated them: because of the wickedness of their doings I will drive them out of my house; I will love them no more; all their princes are revolters.";
yng[15] = "All their evil [is] in Gilgal, Surely there I have hated them, Because of the evil of their doings, Out of My house I do drive them, I add not to love them, all their heads [are] apostates.";
dby[15] = "All their wickedness is in Gilgal; for there I hated them: because of the wickedness of their doings, I will drive them out of my house, I will love them no more: all their princes are rebellious.";
web[15] = "All their wickedness [is] in Gilgal: for there I hated them: for the wickedness of their doings I will drive them out of my house, I will love them no more: all their princes [are] revolters.";
hnv[15] = "&quot;All their wickedness is in Gilgal; For there I hated them. Because of the wickedness of their deeds I will drive them out of my house! I will love them no more. All their princes are rebels.";
vul[15] = "omnes nequitiae eorum in Galgal quia ibi exosos habui eos propter malitiam adinventionum eorum de domo mea eiciam eos non addam ut diligam eos omnes principes eorum recedentes";
kjv[16] = "Ephraim is smitten, their root is dried up, they shall bear no fruit: yea, though they bring forth, yet will I slay [even] the beloved [fruit] of their womb.";
rsv[16] = "E\'phraim is stricken, their root is dried up, they shall bear no fruit. Even though they bring forth, I will slay their beloved children.";
asv[16] = "Ephraim is smitten, their root is dried up, they shall bear no fruit: yea, though they bring forth, yet will I slay the beloved fruit of their womb.";
yng[16] = "Ephraim hath been smitten, Their root hath dried up, fruit they yield not, Yea, though they bring forth, I have put to death the desired of their womb.";
dby[16] = "Ephraim is smitten: their root is dried up, they shall bear no fruit; yea, though they should bring forth, yet will I slay the beloved [fruit] of their womb.";
web[16] = "Ephraim is smitten, their root is dried up, they shall bear no fruit: yes, though they bring forth, yet will I slay [even] the beloved [fruit] of their womb.";
hnv[16] = "Efrayim is struck. Their root has dried up. They will bear no fruit. Even though they bring forth, yet I will kill the beloved ones of their womb.&quot;";
vul[16] = "percussus est Ephraim radix eorum exsiccata est fructum nequaquam facient quod si et genuerint interficiam amantissima uteri eorum";
kjv[17] = "My God will cast them away, because they did not hearken unto him: and they shall be wanderers among the nations.";
rsv[17] = "My God will cast them off, because they have not hearkened to him; they shall be wanderers among the nations.";
asv[17] = "My God will cast them away, because they did not hearken unto him; and they shall be wanderers among the nations.";
yng[17] = "Reject them doth my God, Because they have not hearkened to Him, And they are wanderers among nations!";
dby[17] = "My God hath rejected them, because they hearkened not unto him; and they shall be wanderers among the nations.";
web[17] = "My God will cast them away, because they did not hearken to him: and they shall be wanderers among the nations.";
hnv[17] = "My God will cast them away, because they did not listen to him; And they will be wanderers among the nations.";
vul[17] = "abiciet eos Deus meus quia non audierunt eum et erunt vagi in nationibus";
