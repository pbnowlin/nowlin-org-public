csb[1] = "Israel is a lush vine; it yields fruit for itself. The more his fruit increased, the more he increased the altars. The better his land produced, the better they made the sacred pillars.";
csb[2] = "Their hearts are devious; now they must bear their guilt. The LORD will break down their altars and demolish their sacred pillars.";
csb[3] = "In fact, they are now saying, We have no king! For we do not fear the LORD. What can a king do for us? ";
csb[4] = "They speak mere words, taking false oaths while making covenants. So lawsuits break out like poisonous weeds in the furrows of a field.";
csb[5] = "The residents of Samaria will have anxiety over the calf of Beth-aven. Indeed, its idolatrous priests rejoiced over it; the people will mourn over it, over its glory. It will certainly go into exile.";
csb[6] = "The calf itself will be taken to Assyria as an offering to the great king. Ephraim will experience shame; Israel will be ashamed of its counsel.";
csb[7] = "Samaria\'s king will disappear like foam on the surface of the water.";
csb[8] = "The high places of Aven, the sin of Israel, will be destroyed; thorns and thistles will grow over their altars. They will say to the mountains, Cover us!  and to the hills, Fall on us! ";
csb[9] = "Israel, you have sinned since the days of Gibeah; they have taken their stand there. Will not war against the unjust overtake them in Gibeah?";
csb[10] = "I will discipline them at my discretion; nations will be gathered against them to put them in bondage for their double iniquity.";
csb[11] = "Ephraim is a well-trained calf that loves to thresh, but I will place a yoke on her fine neck. I will harness Ephraim; Judah will plow; Jacob will do the final plowing.";
csb[12] = "Sow righteousness for yourselves and reap faithful love; break up your unplowed ground. It is time to seek the LORD until he comes and sends righteousness on you like the rain.";
csb[13] = "You have plowed wickedness and reaped injustice; you have eaten the fruit of lies. Because you have trusted in your own way and in your large number of soldiers,";
csb[14] = "the roar of battle will rise against your people, and all your fortifications will be demolished in a day of war, like Shalman\'s destruction of Beth-arbel. Mothers will be dashed to pieces along with their children.";
csb[15] = "So it will be done to you, Bethel, because of your extreme evil. At dawn the king of Israel will be totally destroyed.";
kjv[1] = "Israel [is] an empty vine, he bringeth forth fruit unto himself: according to the multitude of his fruit he hath increased the altars; according to the goodness of his land they have made goodly images.";
rsv[1] = "Israel is a luxuriant vine that yields its fruit. The more his fruit increased the more altars he built; as his country improved he improved his pillars.";
asv[1] = "Israel is a luxuriant vine, that putteth forth his fruit: according to the abundance of his fruit he hath multiplied his altars; according to the goodness of their land they have made goodly pillars.";
yng[1] = "`An empty vine [is] Israel, Fruit he maketh like to himself, According to the abundance of his fruit, He hath multiplied for the altars, According to the goodness of his land, They have made goodly standing-pillars.";
dby[1] = "Israel is an unpruned vine, he bringeth forth fruit unto himself: according to the abundance of his fruit he hath multiplied altars; according to the goodness of his land they have made goodly statues.";
web[1] = "Israel [is] an empty vine, he bringeth forth fruit to himself: according to the multitude of his fruit he hath multiplied the altars; according to the goodness of his land they have made goodly images.";
hnv[1] = "Yisra\'el is a luxuriant vine that puts forth his fruit. According to the abundance of his fruit he has multiplied his altars. As their land has prospered, they have adorned their sacred stones.";
vul[1] = "vitis frondosa Israhel fructus adaequatus est ei secundum multitudinem fructus sui multiplicavit altaria iuxta ubertatem terrae suae exuberavit simulacris";
kjv[2] = "Their heart is divided; now shall they be found faulty: he shall break down their altars, he shall spoil their images.";
rsv[2] = "Their heart is false; now they must bear their guilt. The LORD will break down their altars, and destroy their pillars.";
asv[2] = "Their heart is divided; now shall they be found guilty: he will smite their altars, he will destroy their pillars.";
yng[2] = "Their heart hath been divided, now they are guilty, He doth break down their altars, He doth destroy their standing-pillars.";
dby[2] = "Their heart is divided; now shall they be found guilty: he will break down their altars, he will destroy their statues.";
web[2] = "Their heart is divided; now shall they be found faulty: he shall break down their altars, he shall spoil their images.";
hnv[2] = "Their heart is divided. Now they will be found guilty. He will demolish their altars. He will destroy their sacred stones.";
vul[2] = "divisum est cor eorum nunc interibunt ipse confringet simulacra eorum depopulabitur aras eorum";
kjv[3] = "For now they shall say, We have no king, because we feared not the LORD; what then should a king do to us?";
rsv[3] = "For now they will say: &quot;We have no king, for we fear not the LORD, and a king, what could he do for us?&quot;";
asv[3] = "Surely now shall they say, We have no king; for we fear not Jehovah; and the king, what can he do for us?";
yng[3] = "For now they say: We have no king, Because we have not feared Jehovah, And the king -- what doth he for us?";
dby[3] = "For now they will say, We have no king, for we feared not Jehovah; and a king, what can he do for us?";
web[3] = "For now they shall say, We have no king, because we feared not the LORD; what then should a king do to us?";
hnv[3] = "Surely now they will say, &quot;We have no king; for we don\'t fear the LORD; And the king, what can he do for us?&quot;";
vul[3] = "quia nunc dicent non est rex nobis non enim timemus Dominum et rex quid faciet nobis";
kjv[4] = "They have spoken words, swearing falsely in making a covenant: thus judgment springeth up as hemlock in the furrows of the field.";
rsv[4] = "They utter mere words; with empty oaths they make covenants; so judgment springs up like poisonous weeds in the furrows of the field.";
asv[4] = "They speak [vain] words, swearing falsely in making covenants: therefore judgment springeth up as hemlock in the furrows of the field.";
yng[4] = "They have spoken words, To swear falsehood in making a covenant, And flourished as a poisonous herb hath judgment, on the furrows of a field.";
dby[4] = "They speak [mere] words, swearing falsely in making a covenant; therefore shall judgment spring up as hemlock in the furrows of the fields.";
web[4] = "They have spoken words, swearing falsely in making a covenant: thus judgment springeth up as hemlock in the furrows of the field.";
hnv[4] = "They make promises, swearing falsely in making covenants. Therefore judgment springs up like poisonous weeds in the furrows of the field.";
vul[4] = "loquimini verba visionis inutilis et ferietis foedus et germinabit quasi amaritudo iudicium super sulcos agri";
kjv[5] = "The inhabitants of Samaria shall fear because of the calves of Bethaven: for the people thereof shall mourn over it, and the priests thereof [that] rejoiced on it, for the glory thereof, because it is departed from it.";
rsv[5] = "The inhabitants of Sama\'ria tremble for the calf of Beth-a\'ven. Its people shall mourn for it, and its idolatrous priests shall wail over it, over its glory which has departed from it.";
asv[5] = "The inhabitants of Samaria shall be in terror for the calves of Beth-aven; for the people thereof shall mourn over it, and the priests thereof that rejoiced over it, for the glory thereof, because it is departed from it.";
yng[5] = "For the calves of Beth-Aven fear do inhabitants of Samaria, Surely mourned on account of it hath its people, And its priests on account of it leap about, Because of its honour, for it hath removed from it,";
dby[5] = "The inhabitants of Samaria shall fear because of the calf of Beth-aven; for the people thereof shall mourn over it, and the idolatrous priests thereof shall tremble for it, for its glory, because it is departed from it.";
web[5] = "The inhabitants of Samaria shall fear because of the calves of Beth-aven: for its people shall mourn over it, and its priests [that] rejoiced on it, for its glory, because it is departed from it.";
hnv[5] = "The inhabitants of Shomron will be in terror for the calves of Beit-Aven; For its people will mourn over it, Along with its Kohanim who rejoiced over it, For its glory, because it has departed from it.";
vul[5] = "vaccas Bethaven coluerunt habitatores Samariae quia luxit super eum populus eius et aeditui eius super eum exultaverunt in gloria eius quia migravit ab eo";
kjv[6] = "It shall be also carried unto Assyria [for] a present to king Jareb: Ephraim shall receive shame, and Israel shall be ashamed of his own counsel.";
rsv[6] = "Yea, the thing itself shall be carried to Assyria, as tribute to the great king. E\'phraim shall be put to shame, and Israel shall be ashamed of his idol.";
asv[6] = "It also shall be carried unto Assyria for a present to king Jareb: Ephraim shall receive shame, and Israel shall be ashamed of his own counsel.";
yng[6] = "Also it to Asshur is carried, a present to a warlike king, Shame doth Ephraim receive, And ashamed is Israel of its own counsel.";
dby[6] = "Yea, it shall be carried unto Assyria [as] a present for king Jareb: Ephraim shall be seized with shame, and Israel shall be ashamed of his own counsel.";
web[6] = "It shall also be carried to Assyria, [for] a present to king Jareb: Ephraim shall receive shame, and Israel shall be ashamed of his own counsel.";
hnv[6] = "It also will be carried to Ashshur for a present to a great king. Efrayim will receive shame, And Yisra\'el will be ashamed of his own counsel.";
vul[6] = "siquidem et ipse in Assur delatus est munus regi ultori confusio Ephraim capiet et confundetur Israhel in voluntate sua";
kjv[7] = "[As for] Samaria, her king is cut off as the foam upon the water.";
rsv[7] = "Sama\'ria\'s king shall perish, like a chip on the face of the waters.";
asv[7] = "[As for] Samaria, her king is cut off, as foam upon the water.";
yng[7] = "Cut off is Samaria! Its king [is] as a chip on the face of the waters.";
dby[7] = "As for Samaria her king is cut off as chips upon the face of the waters.";
web[7] = "[As for] Samaria, her king is cut off as the foam upon the water.";
hnv[7] = "Shomron and her king float away, Like a twig on the water.";
vul[7] = "transire fecit Samaria regem suum quasi spumam super faciem aquae";
kjv[8] = "The high places also of Aven, the sin of Israel, shall be destroyed: the thorn and the thistle shall come up on their altars; and they shall say to the mountains, Cover us; and to the hills, Fall on us.";
rsv[8] = "The high places of Aven, the sin of Israel, shall be destroyed. Thorn and thistle shall grow up on their altars; and they shall say to the mountains, Cover us, and to the hills, Fall upon us.";
asv[8] = "The high places also of Aven, the sin of Israel, shall be destroyed: the thorn and the thistle shall come up on their altars; and they shall say to the mountains, Cover us; and to the hills, Fall on us.";
yng[8] = "And destroyed have been high places of Aven, the sin of Israel. Thorn and bramble go up on their altars, And they have said to hills, Cover us, And to heights, Fall upon us.";
dby[8] = "And the high places of Aven, the sin of Israel, shall be destroyed: the thorn and the thistle shall come up upon their altars; and they shall say to the mountains, Cover us! and to the hills, Fall on us!";
web[8] = "The high places also of Aven, the sin of Israel, shall be destroyed: the thorn and the thistle shall come up on their altars; and they shall say to the mountains, Cover us; and to the hills, Fall on us.";
hnv[8] = "The high places also of Aven, the sin of Yisra\'el, will be destroyed. The thorn and the thistle will come up on their altars. They will tell the mountains, &quot;Cover us!&quot; and the hills, &quot;Fall on us!&quot;";
vul[8] = "et disperdentur excelsa idoli peccatum Israhel lappa et tribulus ascendet super aras eorum et dicent montibus operite nos et collibus cadite super nos";
kjv[9] = "O Israel, thou hast sinned from the days of Gibeah: there they stood: the battle in Gibeah against the children of iniquity did not overtake them.";
rsv[9] = "From the days of Gib\'e-ah, you have sinned, O Israel; there they have continued. Shall not war overtake them in Gib\'e-ah?";
asv[9] = "O Israel, thou hast sinned from the days of Gibeah: there they stood; the battle against the children of iniquity doth not overtake them in Gibeah.";
yng[9] = "From the days of Gibeah thou hast sinned, O Israel, There they have stood, Not overtake them in Gibeah doth battle, Because of sons of perverseness.";
dby[9] = "From the days of Gibeah hast thou sinned, O Israel: there they stood: the battle in Gibeah against the children of iniquity did not overtake them.";
web[9] = "O Israel, thou hast sinned from the days of Gibeah: there they stood: the battle in Gibeah against the children of iniquity did not overtake them.";
hnv[9] = "&quot;Yisra\'el, you have sinned from the days of Gevah. There they remained. The battle against the children of iniquity doesn\'t overtake them in Gevah.";
vul[9] = "ex diebus Gabaa peccavit Israhel ibi steterunt non conprehendet eos in Gabaa proelium super filios iniquitatis";
kjv[10] = "[It is] in my desire that I should chastise them; and the people shall be gathered against them, when they shall bind themselves in their two furrows.";
rsv[10] = "I will come against the wayward people to chastise them; and nations shall be gathered against them when they are chastised for their double iniquity.";
asv[10] = "When it is my desire, I will chastise them; and the peoples shall be gathered against them, when they are bound to their two transgressions.";
yng[10] = "When I desire, then I do bind them, And gathered against them have peoples, When they bind themselves to their two iniquities.";
dby[10] = "At my pleasure will I chastise them; and the peoples shall be assembled against them, when they are bound for their two iniquities.";
web[10] = "[It is] in my desire that I should chastise them; and the people shall be gathered against them, when they shall bind themselves in their two furrows.";
hnv[10] = "When it is my desire, I will chastise them; And the nations will be gathered against them, When they are bound to their two transgressions.";
vul[10] = "iuxta desiderium meum corripiam eos congregabuntur super eos populi cum corripientur propter duas iniquitates suas";
kjv[11] = "And Ephraim [is as] an heifer [that is] taught, [and] loveth to tread out [the corn]; but I passed over upon her fair neck: I will make Ephraim to ride; Judah shall plow, [and] Jacob shall break his clods.";
rsv[11] = "E\'phraim was a trained heifer that loved to thresh, and I spared her fair neck; but I will put E\'phraim to the yoke, Judah must plow, Jacob must harrow for himself.";
asv[11] = "And Ephraim is a heifer that is taught, that loveth to tread out [the grain]; but I have passed over upon her fair neck: I will set a rider on Ephraim; Judah shall plow, Jacob shall break his clods.";
yng[11] = "And Ephraim [is] a trained heifer -- loving to thresh, And I -- I have passed over on the goodness of its neck, I cause [one] to ride Ephraim, Plough doth Judah, harrow for him doth Jacob.";
dby[11] = "And Ephraim is a trained heifer, that loveth to tread out [the corn]; I have passed over upon her fair neck: I will make Ephraim to draw; Judah shall plough, Jacob shall break his clods.";
web[11] = "And Ephraim [is as] a heifer [that is] taught, [and] loveth to tread out [the corn]; but I passed over upon her fair neck: I will make Ephraim to ride; Judah shall plow, [and] Jacob shall break his clods.";
hnv[11] = "Efrayim is a trained heifer that loves to thresh; So I will put a yoke on her beautiful neck. I will set a rider on Efrayim. Yehudah will plow. Ya`akov will break his clods.";
vul[11] = "Ephraim vitula docta diligere trituram et ego transivi super pulchritudinem colli eius ascendam super Ephraim arabit Iudas confringet sibi sulcos Iacob";
kjv[12] = "Sow to yourselves in righteousness, reap in mercy; break up your fallow ground: for [it is] time to seek the LORD, till he come and rain righteousness upon you.";
rsv[12] = "Sow for yourselves righteousness, reap the fruit of steadfast love; break up your fallow ground, for it is the time to seek the LORD, that he may come and rain salvation upon you.";
asv[12] = "Sow to yourselves in righteousness, reap according to kindness; break up your fallow ground; for it is time to seek Jehovah, till he come and rain righteousness upon you.";
yng[12] = "Sow for yourselves in righteousness, Reap according to loving-kindness, Till for yourselves tillage of knowledge, To seek Jehovah, Till he come and shew righteousness to you.";
dby[12] = "Sow to yourselves in righteousness, reap according to mercy; break up your fallow ground: for it is time to seek Jehovah, till he come and rain righteousness upon you.";
web[12] = "Sow to yourselves in righteousness, reap in mercy; break up your fallow ground: for [it is] time to seek the LORD, till he shall come and reign righteousness upon you.";
hnv[12] = "Sow to yourselves in righteousness, Reap according to kindness. Break up your fallow ground; For it is time to seek the LORD, Until he comes and rains righteousness on you.";

kjv[13] = "Ye have plowed wickedness, ye have reaped iniquity; ye have eaten the fruit of lies: because thou didst trust in thy way, in the multitude of thy mighty men.";
rsv[13] = "You have plowed iniquity, you have reaped injustice, you have eaten the fruit of lies. Because you have trusted in your chariots and in the multitude of your warriors,";
asv[13] = "Ye have plowed wickedness, ye have reaped iniquity; ye have eaten the fruit of lies; for thou didst trust in thy way, in the multitude of thy mighty men.";
yng[13] = "Ye have ploughed wickedness, Perversity ye have reaped, Ye have eaten the fruit of lying, For thou hast trusted in thy way, In the abundance of thy might.";
dby[13] = "Ye have ploughed wickedness, reaped iniquity, eaten the fruit of lies; for thou didst confide in thy way, in the multitude of thy mighty men.";
web[13] = "Ye have plowed wickedness, ye have reaped iniquity; ye have eaten the fruit of lies: because thou hast trusted in thy way, in the multitude of thy mighty men.";
hnv[13] = "You have plowed wickedness. You have reaped iniquity. You have eaten the fruit of lies, For you trusted in your way, in the multitude of your mighty men.";

kjv[15] = "So shall Bethel do unto you because of your great wickedness: in a morning shall the king of Israel utterly be cut off.";
rsv[15] = "Thus it shall be done to you, O house of Israel, because of your great wickedness. In the storm the king of Israel shall be utterly cut off.";
asv[15] = "So shall Beth-el do unto you because of your great wickedness: at daybreak shall the king of Israel be utterly cut off.";
yng[15] = "Thus hath Beth-El done to you, Because of the evil of your wickedness, In the dawn cut off utterly is a king of Israel!";
dby[15] = "So shall Bethel do unto you because of the wickedness of your wickedness: at day-break shall the king of Israel utterly be cut off.";
web[15] = "So shall Beth-el do to you because of your great wickedness: in a morning shall the king of Israel be utterly cut off.";
hnv[15] = "So Beit-El will do to you because of your great wickedness. At daybreak the king of Yisra\'el will be destroyed.";
vul[15] = "sic fecit vobis Bethel a facie malitiae nequitiarum vestrarum";
