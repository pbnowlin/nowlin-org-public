csb[1] = "Ephraim chases the wind and pursues the east wind. He continually multiplies lies and violence. He makes a covenant with Assyria, and olive oil is carried to Egypt.";
csb[2] = "The LORD also has a dispute with Judah. He is about to punish Jacob according to his conduct; he will repay him based on his actions.";
csb[3] = "In the womb he grasped his brother\'s heel, and as an adult he wrestled with God.";
csb[4] = "Jacob struggled with the angel and prevailed; he wept and sought his favor. He found him at Bethel, and there he spoke with him.";
csb[5] = "The LORD is the God of Armies; the LORD is his name.";
csb[6] = "But you must return to your God. Maintain love and justice, and always put your hope in God.";
csb[7] = "A merchant loves to extort with dishonest scales in his hands.";
csb[8] = "But Ephraim thinks, How rich I have become; I made it all myself. In all my earnings, no one can find any iniquity in me that I can be punished for! ";
csb[9] = "I have been the LORD your God ever since the land of Egypt. I will make you live in tents again, as in the festival days.";
csb[10] = "I will speak through the prophets and grant many visions; I will give parables through the prophets.";
csb[11] = "Since Gilead is full of evil, they will certainly come to nothing. They sacrifice bulls in Gilgal; even their altars will be like piles of rocks on the furrows of a field.";
csb[12] = "Jacob fled to the territory of Aram. Israel worked to earn a wife; he tended flocks for a wife.";
csb[13] = "The LORD brought Israel from Egypt by a prophet, and Israel was tended by a prophet.";
csb[14] = "Ephraim has provoked bitter anger, so his Lord will leave his bloodguilt on him and repay him for his contempt.";
kjv[1] = "Ephraim feedeth on wind, and followeth after the east wind: he daily increaseth lies and desolation; and they do make a covenant with the Assyrians, and oil is carried into Egypt.";
rsv[1] = "E\'phraim herds the wind, and pursues the east wind all day long; they multiply falsehood and violence; they make a bargain with Assyria, and oil is carried to Egypt.";
asv[1] = "Ephraim feedeth on wind, and followeth after the east wind: he continually multiplieth lies and desolation; and they make a covenant with Assyria, and oil is carried into Egypt.";
yng[1] = "Ephraim is enjoying wind, And is pursuing an east wind, All the day lying and spoiling he multiplieth, And a covenant with Asshur they make, And oil to Egypt is carried.";
dby[1] = "Ephraim feedeth on wind, and pursueth after the east wind: all day long he multiplieth lies and desolation; and they make a covenant with Assyria, and oil is carried into Egypt.";
web[1] = "Ephraim feedeth on wind, and followeth after the east wind: he daily multiplieth lies and desolation; and they do make a covenant with the Assyrians, and oil is carried into Egypt.";
hnv[1] = "Efrayim feeds on wind, And chases the east wind. He continually multiplies lies and desolation. They make a covenant with Ashshur, And oil is carried into Mitzrayim.";
vul[1] = "Ephraim pascit ventum et sequitur aestum tota die mendacium et vastitatem multiplicat et foedus cum Assyriis iniit et oleum in Aegyptum ferebat";
kjv[2] = "The LORD hath also a controversy with Judah, and will punish Jacob according to his ways; according to his doings will he recompense him.";
rsv[2] = "The LORD has an indictment against Judah, and will punish Jacob according to his ways, and requite him according to his deeds.";
asv[2] = "Jehovah hath also a controversy with Judah, and will punish Jacob according to his ways; according to his doings will he recompense him.";
yng[2] = "And a controversy hath Jehovah with Judah, To lay a charge on Jacob according to his ways, According to his doings He returneth to him.";
dby[2] = "Jehovah hath also a controversy with Judah, and he will punish Jacob according to his ways; according to his doings will he recompense him.";
web[2] = "The LORD hath also a controversy with Judah, and will punish Jacob according to his ways; according to his doings will he recompense him.";
hnv[2] = "The LORD also has a controversy with Yehudah, And will punish Ya`akov according to his ways; According to his deeds he will repay him.";
vul[2] = "iudicium ergo Domini cum Iuda et visitatio super Iacob iuxta vias eius et iuxta adinventiones eius reddet ei";
kjv[3] = "He took his brother by the heel in the womb, and by his strength he had power with God:";
rsv[3] = "In the womb he took his brother by the heel, and in his manhood he strove with God.";
asv[3] = "In the womb he took his brother by the heel; and in his manhood he had power with God:";
yng[3] = "In the womb he took his brother by the heel, And by his strength he was a prince with God,";
dby[3] = "He took his brother by the heel in the womb, and in his strength he wrestled with God.";
web[3] = "He took his brother by the heel in the womb, and by his strength he had power with God:";
hnv[3] = "In the womb he took his brother by the heel; And in his manhood he had power with God.";
vul[3] = "in utero subplantavit fratrem suum et in fortitudine sua directus est cum angelo";
kjv[4] = "Yea, he had power over the angel, and prevailed: he wept, and made supplication unto him: he found him [in] Bethel, and there he spake with us;";
rsv[4] = "He strove with the angel and prevailed, he wept and sought his favor. He met God at Bethel, and there God spoke with him--";
asv[4] = "yea, he had power over the angel, and prevailed; he wept, and made supplication unto him: he found him at Beth-el, and there he spake with us,";
yng[4] = "Yea, he is a prince unto the Messenger, And he overcometh [by] weeping, And he maketh supplication to Him, At Bethel He doth find him, And there He doth speak with us,";
dby[4] = "Yea, he wrestled with the Angel, and prevailed; he wept, and made supplication unto him: he found him in Bethel, and there he spoke with us,";
web[4] = "Yes, he had power over the angel, and prevailed: he wept, and made supplication to him: he found him [in] Beth-el, and there he spoke with us;";
hnv[4] = "Indeed, he had power over the angel, and prevailed; He wept, and made supplication to him. He found him at Beit-El, and there he spoke with us,";
vul[4] = "et invaluit ad angelum et confortatus est flevit et rogavit eum in Bethel invenit eum et ibi locutus est nobiscum";
kjv[5] = "Even the LORD God of hosts; the LORD [is] his memorial.";
rsv[5] = "the LORD the God of hosts, the LORD is his name:";
asv[5] = "even Jehovah, the God of hosts; Jehovah is his memorial [name].";
yng[5] = "Even Jehovah, God of the Hosts, Jehovah [is] His memorial.";
dby[5] = "-- even Jehovah, the God of hosts, -- Jehovah is his memorial.";
web[5] = "Even the LORD God of hosts; the LORD [is] his memorial.";
hnv[5] = "Even the LORD, the God Tzva\'ot,; The LORD is his name of renown!";
vul[5] = "et Dominus Deus exercituum Dominus memoriale eius";
kjv[6] = "Therefore turn thou to thy God: keep mercy and judgment, and wait on thy God continually.";
rsv[6] = "&quot;So you, by the help of your God, return, hold fast to love and justice, and wait continually for your God.&quot;";
asv[6] = "Therefore turn thou to thy God: keep kindness and justice, and wait for thy God continually.";
yng[6] = "And thou, through thy God, dost turn, Kindness and judgment keep thou, And wait on thy God continually.";
dby[6] = "And thou, return unto thy God: keep loving-kindness and judgment, and wait on thy God continually.";
web[6] = "Therefore turn thou to thy God: keep mercy and judgment, and wait on thy God continually.";
hnv[6] = "Therefore turn to your God. Keep kindness and justice, And wait for your God continually.";
vul[6] = "et tu ad Deum tuum converteris misericordiam et iudicium custodi et spera in Deo tuo semper";
kjv[7] = "[He is] a merchant, the balances of deceit [are] in his hand: he loveth to oppress.";
rsv[7] = "A trader, in whose hands are false balances, he loves to oppress.";
asv[7] = "[He is] a trafficker, the balances of deceit are in his hand: he loveth to oppress.";
yng[7] = "Canaan! in his hand [are] balances of deceit! To oppress he hath loved.";
dby[7] = "[He is] a merchant, balances of deceit are in his hand; he loveth to oppress.";
web[7] = "[He is] a merchant, the balances of deceit [are] in his hand: he loveth to oppress.";
hnv[7] = "A merchant has dishonest scales in his hand. He loves to defraud.";
vul[7] = "Chanaan in manu eius statera dolosa calumniam dilexit";
kjv[8] = "And Ephraim said, Yet I am become rich, I have found me out substance: [in] all my labours they shall find none iniquity in me that [were] sin.";
rsv[8] = "E\'phraim has said, &quot;Ah, but I am rich, I have gained wealth for myself&quot;: but all his riches can never offset the guilt he has incurred.";
asv[8] = "And Ephraim said, Surely I am become rich, I have found me wealth: in all my labors they shall find in me no iniquity that were sin.";
yng[8] = "And Ephraim saith: `Surely I have become rich, I have found wealth for myself, All my labours -- they find not against me iniquity that [is] sin.\'";
dby[8] = "And Ephraim saith, Nevertheless I am become rich, I have found me out substance; in all my labours they shall find none iniquity in me that were sin.";
web[8] = "And Ephraim said, Yet I have become rich, I have found for myself substance: [in] all my labors they shall find no iniquity in me that [were] sin.";
hnv[8] = "Efrayim said, &quot;Surely I have become rich, I have found myself wealth. In all my wealth they won\'t find in me any iniquity that is sin.&quot;";
vul[8] = "et dixit Ephraim verumtamen dives effectus sum inveni idolum mihi omnes labores mei non invenient mihi iniquitatem quam peccavi";
kjv[9] = "And I [that am] the LORD thy God from the land of Egypt will yet make thee to dwell in tabernacles, as in the days of the solemn feast.";
rsv[9] = "I am the LORD your God from the land of Egypt; I will again make you dwell in tents, as in the days of the appointed feast.";
asv[9] = "But I am Jehovah thy God from the land of Egypt; I will yet again make thee to dwell in tents, as in the days of the solemn feast.";
yng[9] = "And I -- Jehovah thy God from the land of Egypt, Again do I turn thee back into tents, As in the days of the appointed time.";
dby[9] = "But I [that am] Jehovah thy God from the land of Egypt will again make thee to dwell in tents, as in the days of the solemn feast.";
web[9] = "And I [that am] the LORD thy God from the land of Egypt will yet make thee to dwell in tabernacles, as in the days of the solemn feast.";
hnv[9] = "&quot;But I am the LORD your God from the land of Mitzrayim. I will yet again make you to dwell in tents, As in the days of the solemn feast.";
vul[9] = "et ego Dominus Deus tuus ex terra Aegypti adhuc sedere te faciam in tabernaculis sicut in diebus festivitatis";
kjv[10] = "I have also spoken by the prophets, and I have multiplied visions, and used similitudes, by the ministry of the prophets.";
rsv[10] = "I spoke to the prophets; it was I who multiplied visions, and through the prophets gave parables.";
asv[10] = "I have also spoken unto the prophets, and I have multiplied visions; and by the ministry of the prophets have I used similitudes.";
yng[10] = "And I have spoken unto the prophets, And I have multiplied vision, And by the hand of the prophets I use similes.";
dby[10] = "And I have spoken to the prophets, and I have multiplied visions, and by means of the prophets have I used similitudes.";
web[10] = "I have also spoken by the prophets, and I have multiplied visions, and used similitudes by the ministry of the prophets.";
hnv[10] = "I have also spoken to the prophets, And I have multiplied visions; And by the ministry of the prophets I have used parables.";
vul[10] = "et locutus sum super prophetas et ego visionem multiplicavi et in manu prophetarum adsimilatus sum";
kjv[11] = "[Is there] iniquity [in] Gilead? surely they are vanity: they sacrifice bullocks in Gilgal; yea, their altars [are] as heaps in the furrows of the fields.";
rsv[11] = "If there is iniquity in Gilead they shall surely come to nought; if in Gilgal they sacrifice bulls, their altars also shall be like stone heaps on the furrows of the field.";
asv[11] = "Is Gilead iniquity? they are altogether false; in Gilgal they sacrifice bullocks; yea, their altars are as heaps in the furrows of the field.";
yng[11] = "Surely Gilead [is] iniquity, Only, vanity they have been, In Gilead bullocks they have sacrificed, Also their altars [are] as heaps, on the furrows of a field.";
dby[11] = "If Gilead is iniquity, surely they are but vanity: they sacrifice bullocks in Gilgal; yea, their altars are as heaps in the furrows of the fields.";
web[11] = "[Is there] iniquity [in] Gilead? surely they are vanity: they sacrifice bullocks in Gilgal; yes, their altars [are] as heaps in the furrows of the fields.";
hnv[11] = "If Gil`ad is wicked, Surely they are worthless. In Gilgal they sacrifice bulls. Indeed, their altars are like heaps in the furrows of the field.";
vul[11] = "si Galaad idolum tamen frustra erant in Galgal bubus immolantes nam et altaria eorum quasi acervi super sulcos agri";
kjv[12] = "And Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept [sheep].";
rsv[12] = "(Jacob fled to the land of Aram, there Israel did service for a wife, and for a wife he herded sheep.)";
asv[12] = "And Jacob fled into the field of Aram, and Israel served for a wife, and for a wife he kept [sheep].";
yng[12] = "And Jacob doth flee to the country of Aram, And Israel doth serve for a wife, Yea, for a wife he hath kept watch.";
dby[12] = "And Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept [sheep].";
web[12] = "And Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept [sheep].";
hnv[12] = "Ya`akov fled into the country of Aram, And Yisra\'el served to get a wife, And for a wife he tended flocks and herds.";
vul[12] = "fugit Iacob in regionem Syriae et servivit Israhel in uxore et in uxore servavit";
kjv[13] = "And by a prophet the LORD brought Israel out of Egypt, and by a prophet was he preserved.";
rsv[13] = "By a prophet the LORD brought Israel up from Egypt, and by a prophet he was preserved.";
asv[13] = "And by a prophet Jehovah brought Israel up out of Egypt, and by a prophet was he preserved.";
yng[13] = "And by a prophet hath Jehovah brought up Israel out of Egypt, And by a prophet it hath been watched.";
dby[13] = "And by a prophet Jehovah brought Israel out of Egypt, and by a prophet was he preserved.";
web[13] = "And by a prophet the LORD brought Israel out of Egypt, and by a prophet was he preserved.";
hnv[13] = "By a prophet the LORD brought Yisra\'el up out of Mitzrayim, And by a prophet he was preserved.";
vul[13] = "in propheta autem eduxit Dominus Israhel de Aegypto et in propheta servatus est";
kjv[14] = "Ephraim provoked [him] to anger most bitterly: therefore shall he leave his blood upon him, and his reproach shall his Lord return unto him.";
rsv[14] = "E\'phraim has given bitter provocation; so his LORD will leave his bloodguilt upon him, and will turn back upon him his reproaches.";
asv[14] = "Ephraim hath provoked to anger most bitterly: therefore shall his blood be left upon him, and his reproach shall his Lord return unto him.";
yng[14] = "Ephraim hath provoked most bitterly, And his blood on himself he leaveth, And his reproach turn back to him doth his Lord!";
dby[14] = "Ephraim provoked [him] to anger most bitterly; and his Lord shall leave his blood upon him, and recompense unto him his reproach.";
web[14] = "Ephraim provoked [him] to anger most bitterly: therefore will he leave his blood upon him, and his reproach will his Lord return to him.";
hnv[14] = "Efrayim has provoked to anger most bitterly. Therefore his blood will be left on him, And his his Lord will repay his contempt.";
vul[14] = "ad iracundiam me provocavit Ephraim in amaritudinibus suis et sanguis eius super eum veniet et obprobrium eius restituet ei Dominus suus";
