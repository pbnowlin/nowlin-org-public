csb[1] = "Hear the word of the LORD, people of Israel, for the LORD has a case against the inhabitants of the land: There is no truth, no faithful love, and no knowledge of God in the land!";
csb[2] = "Cursing, lying, murder, stealing, and adultery are rampant; one act of bloodshed follows another.";
csb[3] = "For this reason the land mourns, and everyone who lives in it languishes, along with the wild animals and the birds of the sky; even the fish of the sea disappear.";
csb[4] = "But let no one dispute; let no one argue, for my case is against you priests.";
csb[5] = "You will stumble by day; the prophet will also stumble with you by night. And I will destroy your mother.";
csb[6] = "My people are destroyed for lack of knowledge. Because you have rejected knowledge, I will reject you from serving as my priest. Since you have forgotten the law of your God, I will also forget your sons.";
csb[7] = "The more they multiplied, the more they sinned against me. I will change their honor into disgrace.";
csb[8] = "They feed on the sin of my people; they have an appetite for their iniquity.";
csb[9] = "The same judgment will happen to both people and priests. I will punish them for their ways and repay them for their deeds.";
csb[10] = "They will eat but not be satisfied; they will be promiscuous but not multiply. For they have abandoned their devotion to the LORD.";
csb[11] = "Promiscuity, wine, and new wine take away one\'s understanding.";
csb[12] = "My people consult their wooden idols, and their divining rods inform them. For a spirit of promiscuity leads them astray; they act promiscuously in disobedience to their God.";
csb[13] = "They sacrifice on the mountaintops, and they burn offerings on the hills, and under oaks, poplars, and terebinths, because their shade is pleasant. And so your daughters act promiscuously and your daughters-in-law commit adultery.";
csb[14] = "I will not punish your daughters when they act promiscuously or your daughters-in-law when they commit adultery, for the men themselves go off with prostitutes and make sacrifices with cult prostitutes. People without discernment are doomed.";
csb[15] = "Israel, if you act promiscuously, don\'t let Judah become guilty! Do not go to Gilgal or make a pilgrimage to Beth-aven, and do not swear an oath: As the LORD lives!";
csb[16] = "For Israel is as obstinate as a stubborn cow. Can the LORD now shepherd them like a lamb in an open meadow?";
csb[17] = "Ephraim is attached to idols; leave him alone!";
csb[18] = "When their drinking is over, they turn to promiscuity. Israel\'s leaders fervently love disgrace.";
csb[19] = "A wind with its wings will carry them off, and they will be ashamed of their sacrifices.";
kjv[1] = "Hear the word of the LORD, ye children of Israel: for the LORD hath a controversy with the inhabitants of the land, because [there is] no truth, nor mercy, nor knowledge of God in the land.";
rsv[1] = "Hear the word of the LORD, O people of Israel; for the LORD has a controversy with the inhabitants of the land. There is no faithfulness or kindness, and no knowledge of God in the land;";
asv[1] = "Hear the word of Jehovah, ye children of Israel; for Jehovah hath a controversy with the inhabitants of the land, because there is no truth, nor goodness, nor knowledge of God in the land.";
yng[1] = "`Hear a word of Jehovah, sons of Israel, For a strife [is] to Jehovah with inhabitants of the land, For there is no truth, nor kindness, Nor knowledge of God, in the land,";
dby[1] = "Hear the word of Jehovah, ye children of Israel; for Jehovah hath a controversy with the inhabitants of the land; for there is no truth, nor goodness, nor knowledge of God in the land.";
web[1] = "Hear the word of the LORD, ye children of Israel: for the LORD hath a controversy with the inhabitants of the land, because [there is] no truth, nor mercy, nor knowledge of God in the land.";
hnv[1] = "Hear the word of the LORD, you children of Yisra\'el; For the LORD has a charge against the inhabitants of the land: &quot;Indeed there is no truth, Nor goodness, Nor knowledge of God in the land.";
vul[1] = "audite verbum Domini filii Israhel quia iudicium Domino cum habitatoribus terrae non est enim veritas et non est misericordia et non est scientia Dei in terra";
kjv[2] = "By swearing, and lying, and killing, and stealing, and committing adultery, they break out, and blood toucheth blood.";
rsv[2] = "there is swearing, lying, killing, stealing, and committing adultery; they break all bounds and murder follows murder.";
asv[2] = "There is nought but swearing and breaking faith, and killing, and stealing, and committing adultery; they break out, and blood toucheth blood.";
yng[2] = "Swearing, and lying, and murdering, And stealing, and committing adultery -- have increased, And blood against blood hath touched.";
dby[2] = "Swearing, and lying, and killing, and stealing, and committing adultery, -- they break out; and blood toucheth blood.";
web[2] = "By swearing, and lying, and killing, and stealing, and committing adultery, they break out, and blood toucheth blood.";
hnv[2] = "There is cursing, lying, murder, stealing, and committing adultery; They break boundaries, and bloodshed causes bloodshed.";
vul[2] = "maledictum et mendacium et homicidium et furtum et adulterium inundaverunt et sanguis sanguinem tetigit";
kjv[3] = "Therefore shall the land mourn, and every one that dwelleth therein shall languish, with the beasts of the field, and with the fowls of heaven; yea, the fishes of the sea also shall be taken away.";
rsv[3] = "Therefore the land mourns, and all who dwell in it languish, and also the beasts of the field, and the birds of the air; and even the fish of the sea are taken away.";
asv[3] = "Therefore shall the land mourn, and every one that dwelleth therein shall languish, with the beasts of the field and the birds of the heavens; yea, the fishes of the sea also shall be taken away.";
yng[3] = "Therefore mourn doth the land, And weak is every dweller in it, With the beast of the field, And with the fowl of the heavens, And the fishes of the sea -- they are removed.";
dby[3] = "For this shall the land mourn, and every one that dwelleth therein shall languish, with the beasts of the field, and with the fowl of the heavens, yea, the fishes of the sea also shall be taken away.";
web[3] = "Therefore shall the land mourn, and every one that dwelleth in it shall languish, with the beasts of the field, and with the fowls of heaven; yes, the fishes of the sea also shall be taken away.";
hnv[3] = "Therefore the land will mourn, And everyone who dwells therein will waste away. All living things in her, Even the animals of the field and the birds of the sky; Yes, the fish of the sea also die.";
vul[3] = "propter hoc lugebit terra et infirmabitur omnis qui habitat in ea in bestia agri et in volucre caeli sed et pisces maris congregabuntur";

yng[4] = "Only, let no one strive, nor reprove a man, And thy people [are] as those striving with a priest.";
dby[4] = "Yet let no man strive, and let no man reprove; for thy people are as they that strive with the priest.";
web[4] = "Yet let no man contend, nor reprove another: for thy people [are] as they that contend with the priest.";
hnv[4] = "&quot;Yet let no man bring a charge, neither let any man accuse; For your people are like those who bring charges against a Kohen.";
vul[4] = "verumtamen unusquisque non iudicet et non arguatur vir populus enim tuus sicut hii qui contradicunt sacerdoti";

rsv[5] = "You shall stumble by day, the prophet also shall stumble with you by night; and I will destroy your mother.";

kjv[6] = "My people are destroyed for lack of knowledge: because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me: seeing thou hast forgotten the law of thy God, I will also forget thy children.";
rsv[6] = "My people are destroyed for lack of knowledge; because you have rejected knowledge, I reject you from being a priest to me. And since you have forgotten the law of your God, I also will forget your children.";
asv[6] = "My people are destroyed for lack of knowledge: because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me: seeing thou hast forgotten the law of thy God, I also will forget thy children.";
yng[6] = "Cut off have been My people for lack of knowledge, Because thou knowledge hast rejected, I reject thee from being priest to Me, And thou forgettest the law of thy God, I forget thy sons, I also!";
dby[6] = "My people are destroyed for lack of knowledge; for thou hast rejected knowledge, and I will reject thee, that thou shalt be no priest to me; seeing thou hast forgotten the law of thy God, I also will forget thy children.";
web[6] = "My people are destroyed for lack of knowledge: because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me: seeing thou hast forgotten the law of thy God, I will also forget thy children.";
hnv[6] = "My people are destroyed for lack of knowledge. Because you have rejected knowledge, I will also reject you, That you may be no Kohen to me. Because you have your God\'s law, I will also forget your children.";

asv[7] = "As they were multiplied, so they sinned against me: I will change their glory into shame.";
yng[7] = "According to their abundance so they sinned against Me, Their honour into shame I change.";
dby[7] = "As they were multiplied, so they sinned against me: I will change their glory into shame.";
web[7] = "As they were increased, so they sinned against me: [therefore] will I change their glory into shame.";
hnv[7] = "As they were multiplied, so they sinned against me. I will change their glory into shame.";
vul[7] = "secundum multitudinem eorum sic peccaverunt mihi gloriam eorum in ignominiam commutabo";

asv[8] = "They feed on the sin of my people, and set their heart on their iniquity.";
yng[8] = "The sin of My people they do eat, And unto their iniquity lift up their soul.";
dby[8] = "They eat the sin of my people, and their soul longeth for their iniquity.";

hnv[8] = "They feed on the sin of my people, And set their heart on their iniquity.";

kjv[9] = "And there shall be, like people, like priest: and I will punish them for their ways, and reward them their doings.";
rsv[9] = "And it shall be like people, like priest; I will punish them for their ways, and requite them for their deeds.";
asv[9] = "And it shall be, like people, like priest; and I will punish them for their ways, and will requite them their doings.";
yng[9] = "And it hath been, like people, like priest, And I have charged on it its ways, And its habitual doings I return to it.";
dby[9] = "And it shall be as the people so the priest; and I will visit their ways upon them, and recompense to them their doings;";
web[9] = "And there shall be, like people, like priest: and I will punish them for their ways, and reward them their doings.";
hnv[9] = "It will be, like people, like Kohen; And I will punish them for their ways, And will repay them for their deeds.";
vul[9] = "et erit sicut populus sic sacerdos et visitabo super eum vias eius et cogitationes eius reddam ei";
kjv[10] = "For they shall eat, and not have enough: they shall commit whoredom, and shall not increase: because they have left off to take heed to the LORD.";
rsv[10] = "They shall eat, but not be satisfied; they shall play the harlot, but not multiply; because they have forsaken the LORD to cherish harlotry.";
asv[10] = "And they shall eat, and not have enough; they shall play the harlot, and shall not increase; because they have left off taking heed to Jehovah.";
yng[10] = "And they have eaten, and are not satisfied, They have gone a-whoring, and increase not, For they have left off taking heed to Jehovah.";
dby[10] = "and they shall eat, and not have enough; they shall commit whoredom, and shall not increase: for they have left off taking heed to Jehovah.";
web[10] = "For they shall eat, and not have enough: they shall be guilty of lewdness, and shall not increase: because they have ceased to take heed to the LORD.";
hnv[10] = "They will eat, and not have enough. They will play the prostitute, and will not increase; Because they have abandoned giving to the LORD.";

rsv[11] = "Wine and new wine take away the understanding.";
asv[11] = "Whoredom and wine and new wine take away the understanding.";
yng[11] = "Whoredom, and wine, and new wine, take the heart,";
dby[11] = "Fornication, and wine, and new wine take away the heart.";
web[11] = "Lewdness and wine and new wine take away the heart.";
hnv[11] = "Prostitution, wine, and new wine take away understanding.";

kjv[12] = "My people ask counsel at their stocks, and their staff declareth unto them: for the spirit of whoredoms hath caused [them] to err, and they have gone a whoring from under their God.";
rsv[12] = "My people inquire of a thing of wood, and their staff gives them oracles. For a spirit of harlotry has led them astray, and they have left their God to play the harlot.";
asv[12] = "My people ask counsel at their stock, and their staff declareth unto them; for the spirit of whoredom hath caused them to err, and they have played the harlot, [departing] from under their God.";
yng[12] = "My people at its staff asketh and its rod declareth to it, For a spirit of whoredoms hath caused to err, And they go a-whoring from under their God.";
dby[12] = "My people ask counsel of their stock, and their staff declareth unto them; for the spirit of whoredoms causeth [them] to err, and they have gone a whoring from under their God:";
web[12] = "My people ask counsel at their stocks, and their staff declareth to them: for the spirit of lewdness hath caused [them] to err, and they have gone astray from under their God.";
hnv[12] = "My people consult with their wooded idol, And answer to a stick of wood. Indeed the spirit of prostitution has led them astray, And they have been unfaithful to their God.";
vul[12] = "populus meus in ligno suo interrogavit et baculus eius adnuntiavit ei spiritus enim fornicationum decepit eos et fornicati sunt a Deo suo";
kjv[13] = "They sacrifice upon the tops of the mountains, and burn incense upon the hills, under oaks and poplars and elms, because the shadow thereof [is] good: therefore your daughters shall commit whoredom, and your spouses shall commit adultery.";
rsv[13] = "They sacrifice on the tops of the mountains, and make offerings upon the hills, under oak, poplar, and terebinth, because their shade is good. Therefore your daughters play the harlot, and your brides commit adultery.";
asv[13] = "They sacrifice upon the tops of the mountains, and burn incense upon the hills, under oaks and poplars and terebinths, because the shadow thereof is good: therefore your daughters play the harlot, and your brides commit adultery.";
yng[13] = "On tops of the mountains they do sacrifice, And on the hills they make perfume, Under oak, and poplar, and terebinth, For good [is] its shade.";
dby[13] = "they sacrifice upon the tops of the mountains, and burn incense upon the hills, under oak and poplar and terebinth, because the shade thereof is good; therefore your daughters play the harlot and your daughters-in-law commit adultery.";
web[13] = "They sacrifice upon the tops of the mountains, and burn incense upon the hills, under oaks and poplars and elms, because the shade of them is agreeable: therefore your daughters shall be guilty of lewdness, and your spouses shall commit adultery.";
hnv[13] = "They sacrifice on the tops of the mountains, And burn incense on the hills, under oaks and poplars and terebinths, Because its shade is good. Therefore your daughters play the prostitute, And your brides commit adultery.";
vul[13] = "super capita montium sacrificabant et super colles accendebant thymiama subtus quercum et populum et terebinthum quia bona erat umbra eius ideo fornicabuntur filiae vestrae et sponsae vestrae adulterae erunt";
kjv[14] = "I will not punish your daughters when they commit whoredom, nor your spouses when they commit adultery: for themselves are separated with whores, and they sacrifice with harlots: therefore the people [that] doth not understand shall fall.";
rsv[14] = "I will not punish your daughters when they play the harlot, nor your brides when they commit adultery; for the men themselves go aside with harlots, and sacrifice with cult prostitutes, and a people without understanding shall come to ruin.";
asv[14] = "I will not punish your daughters when they play the harlot, nor your brides when they commit adultery; for [the men] themselves go apart with harlots, and they sacrifice with the prostitutes; and the people that doth not understand shall be overthrown.";
yng[14] = "Therefore commit whoredom do your daughters, And your spouses commit adultery, I do not see after your daughters when they commit whoredom, And after your spouses when they commit adultery, For they with the harlots are separated, And with the whores they do sacrifice, A people that doth not understand kicketh.";
dby[14] = "I will not punish your daughters when they play the harlot, nor your daughters-in-law for their committing adultery; for they themselves go aside with harlots, and they sacrifice with prostitutes: and the people that doth not understand shall come to ruin.";
web[14] = "I will not punish your daughters when they are guilty of lewdness, nor your spouses when they commit adultery: for they themselves are separated with prostitutes, and they sacrifice with harlots: therefore the people [that] doth not understand shall fall.";
hnv[14] = "I will not punish your daughters when they play the prostitute, Nor your brides when they commit adultery; Because the men consort with prostitutes, And they sacrifice with the shrine prostitutes; And the people that does not understand will come to ruin.";
vul[14] = "non visitabo super filias vestras cum fuerint fornicatae et super sponsas vestras cum adulteraverint quoniam ipsi cum meretricibus versabantur et cum effeminatis sacrificabant et populus non intellegens vapulabit";
kjv[15] = "Though thou, Israel, play the harlot, [yet] let not Judah offend; and come not ye unto Gilgal, neither go ye up to Bethaven, nor swear, The LORD liveth.";
rsv[15] = "Though you play the harlot, O Israel, let not Judah become guilty. Enter not into Gilgal, nor go up to Beth-a\'ven, and swear not, &quot;As the LORD lives.&quot;";
asv[15] = "Though thou, Israel, play the harlot, yet let not Judah offend; and come not ye unto Gilgal, neither go ye up to Beth-aven, nor swear, As Jehovah liveth.";
yng[15] = "Though a harlot thou [art], O Israel, Let not Judah become guilty, And come not ye in to Gilgal, nor go up to Beth-Aven, Nor swear ye, Jehovah liveth.";
dby[15] = "Though thou, Israel, play the harlot, let not Judah trespass; and come ye not unto Gilgal, neither go up to Beth-aven, nor swear [As] Jehovah liveth!";
web[15] = "Though thou, Israel, playest the harlot, [yet] let not Judah offend; and come not ye to Gilgal, neither go ye up to Beth-aven, nor swear, The LORD liveth.";
hnv[15] = "&quot;Though you, Yisra\'el, play the prostitute, Yet don\'t let Yehudah offend; And don\'t come to Gilgal, Neither go up to Beit-Aven, Nor swear, \'As the LORD lives.\'";
vul[15] = "si fornicaris tu Israhel non delinquat saltim Iuda et nolite ingredi in Galgala et ne ascenderitis in Bethaven neque iuraveritis vivit Dominus";
kjv[16] = "For Israel slideth back as a backsliding heifer: now the LORD will feed them as a lamb in a large place.";
rsv[16] = "Like a stubborn heifer, Israel is stubborn; can the LORD now feed them like a lamb in a broad pasture?";
asv[16] = "For Israel hath behaved himself stubbornly, like a stubborn heifer: now will Jehovah feed them as a lamb in a large place.";
yng[16] = "For as a refractory heifer hath Israel turned aside, Now doth Jehovah feed them as a lamb in a large place.";
dby[16] = "For Israel is refractory as an untractable heifer; now will Jehovah feed them as a lamb in a wide [pasture].";
web[16] = "For Israel slideth back as a backsliding heifer: now the LORD will feed them as a lamb in a large place.";
hnv[16] = "For Yisra\'el has behaved extremely stubbornly, like a stubborn heifer. Then how will the LORD feed them like a lamb in a meadow.";
vul[16] = "quoniam sicut vacca lasciviens declinavit Israhel nunc pascet eos Dominus quasi agnum in latitudine";

kjv[18] = "Their drink is sour: they have committed whoredom continually: her rulers [with] shame do love, Give ye.";
rsv[18] = "A band of drunkards, they give themselves to harlotry; they love shame more than their glory.";
asv[18] = "Their drink is become sour; they play the harlot continually; her rulers dearly love shame.";
yng[18] = "Sour [is] their drink, They have gone diligently a-whoring, Her protectors have loved shame thoroughly.";
dby[18] = "Their drink is sour; they give themselves up to whoredom; her great men passionately love [their] shame.";
web[18] = "Their drink is sour: they have been guilty of lewd deeds continually: her rulers [with] shame do love, Give ye.";

asv[19] = "The wind hath wrapped her up in its wings; and they shall be put to shame because of their sacrifices.";

dby[19] = "The wind hath wrapped her up in its wings, and they shall be ashamed because of their sacrifices.";
web[19] = "The wind hath bound her up in her wings, and they shall be ashamed because of their sacrifices.";
hnv[19] = "The wind has wrapped her up in its wings; And they shall be disappointed because of their sacrifices.";
