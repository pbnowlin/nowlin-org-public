csb[1] = "Come, let us return to the LORD. For he has torn us, and he will heal us; he has wounded us, and he will bind up our wounds.";
csb[2] = "He will revive us after two days, and on the third day he will raise us up so we can live in his presence.";
csb[3] = "Let us strive to know the LORD. His appearance is as sure as the dawn. He will come to us like the rain, like the spring showers that water the land.";
csb[4] = "What am I going to do with you, Ephraim? What am I going to do with you, Judah? Your love is like the morning mist and like the early dew that vanishes.";
csb[5] = "This is why I have used the prophets to cut them down; I have killed them with the words from my mouth. My judgment strikes like lightning.";
csb[6] = "For I desire faithful love and not sacrifice, the knowledge of God rather than burnt offerings.";
csb[7] = "But they, like Adam, have violated the covenant; there they have betrayed me.";
csb[8] = "Gilead is a city of evildoers, tracked with bloody footprints.";
csb[9] = "Like raiders who wait in ambush for someone, a band of priests murders on the road to Shechem. They commit atrocities.";
csb[10] = "I have seen something horrible in the house of Israel: Ephraim\'s promiscuity is there; Israel is defiled.";
csb[11] = "A harvest is also appointed for you, Judah. When I return my people from captivity,";
