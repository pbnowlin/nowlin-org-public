csb[1] = "When Israel was a child, I loved him, and out of Egypt I called my son.";
csb[2] = "Israel called to the Egyptians even as Israel was leaving them. They kept sacrificing to the Baals and burning offerings to idols.";
csb[3] = "It was I who taught Ephraim to walk, taking them by the hand, but they never knew that I healed them.";
csb[4] = "I led them with human cords, with ropes of love. To them I was like one who eases the yoke from their jaws; I bent down to give them food.";
csb[5] = "Israel will not return to the land of Egypt and Assyria will be his king, because they refused to repent.";
csb[6] = "A sword will whirl through his cities; it will destroy and devour the bars of his gates, because of their schemes.";
csb[7] = "My people are bent on turning from me. Though they call to him on high, he will not exalt them at all.";
csb[8] = "How can I give you up, Ephraim? How can I surrender you, Israel? How can I make you like Admah? How can I treat you like Zeboiim? I have had a change of heart; my compassion is stirred!";
csb[9] = "I will not vent the full fury of my anger; I will not turn back to destroy Ephraim. For I am God and not man, the Holy One among you; I will not come in rage.";
csb[10] = "They will follow the LORD; he will roar like a lion. When he roars, his children will come trembling from the west.";
csb[11] = "They will be roused like birds from Egypt and like doves from the land of Assyria. Then I will settle them in their homes. This is the LORD\'s declaration.";
csb[12] = "Ephraim surrounds me with lies, the house of Israel, with deceit. Judah still wanders with God and is faithful to the holy ones.";
kjv[1] = "When Israel [was] a child, then I loved him, and called my son out of Egypt.";
rsv[1] = "When Israel was a child, I loved him, and out of Egypt I called my son.";
asv[1] = "When Israel was a child, then I loved him, and called my son out of Egypt.";
yng[1] = "Because Israel [is] a youth, and I love him, Out of Egypt I have called for My Son.";
dby[1] = "When Israel was a child, then I loved him, and out of Egypt I called my son.";
web[1] = "When Israel [was] a child, then I loved him, and called my son out of Egypt.";
hnv[1] = "&quot;When Yisra\'el was a child, then I loved him, And called my son out of Mitzrayim.";
vul[1] = "sicuti mane transit pertransiit rex Israhel quia puer Israhel et dilexi eum et ex Aegypto vocavi filium meum";
kjv[2] = "[As] they called them, so they went from them: they sacrificed unto Baalim, and burned incense to graven images.";
rsv[2] = "The more I called them, the more they went from me; they kept sacrificing to the Ba\'als, and burning incense to idols.";
asv[2] = "The more [the prophets] called them, the more they went from them: they sacrificed unto the Baalim, and burned incense to graven images.";
yng[2] = "They have called to them rightly, They have gone from before them, To lords they do sacrifice, And to graven images they make perfume.";
dby[2] = "As they called them, so they went from them: they sacrificed unto the Baals, and burned incense to graven images.";
web[2] = "[As] they called them, so they went from them: they sacrificed to Baalim, and burned incense to graven images.";
hnv[2] = "They called to them, so they went from them. They sacrificed to the Ba`alim, And burned incense to engraved images.";
vul[2] = "vocaverunt eos sic abierunt a facie eorum Baalim immolabant et simulacris sacrificabant";
kjv[3] = "I taught Ephraim also to go, taking them by their arms; but they knew not that I healed them.";
rsv[3] = "Yet it was I who taught E\'phraim to walk, I took them up in my arms; but they did not know that I healed them.";
asv[3] = "Yet I taught Ephraim to walk; I took them on my arms; but they knew not that I healed them.";
yng[3] = "And I have caused Ephraim to go on foot, Taking them by their arms, And they have not known that I strengthened them.";
dby[3] = "And I it was that taught Ephraim to walk, -- He took them upon his arms, -- but they knew not that I healed them.";
web[3] = "I taught Ephraim also to go, taking them by their arms; but they knew not that I healed them.";
hnv[3] = "Yet I taught Efrayim to walk. I took them by his arms; But they didn\'t know that I healed them.";
vul[3] = "et ego quasi nutricius Ephraim portabam eos in brachiis meis et nescierunt quod curarem eos";
kjv[4] = "I drew them with cords of a man, with bands of love: and I was to them as they that take off the yoke on their jaws, and I laid meat unto them.";
rsv[4] = "I led them with cords of compassion, with the bands of love, and I became to them as one, who eases the yoke on their jaws, and I bent down to them and fed them.";
asv[4] = "I drew them with cords of a man, with bands of love; and I was to them as they that lift up the yoke on their jaws; and I laid food before them.";
yng[4] = "With cords of man I do draw them, With thick cords of love, And I am to them as a raiser up of a yoke on their jaws, And I incline unto him -- I feed [him].";
dby[4] = "I drew them with bands of a man, with cords of love; and I was to them as they that take off the yoke on their jaws, and I gently caused them to eat.";
web[4] = "I drew them with cords of a man, with bands of love: and I was to them as they that take off the yoke on their jaws, and I laid food for them.";
hnv[4] = "I drew them with cords of a man, with ties of love; And I was to them like those who lift up the yoke on their necks; And I bent down to him and I fed him.";
vul[4] = "in funiculis Adam traham eos in vinculis caritatis et ero eis quasi exaltans iugum super maxillas eorum et declinavi ad eum ut vesceretur";
kjv[5] = "He shall not return into the land of Egypt, but the Assyrian shall be his king, because they refused to return.";
rsv[5] = "They shall return to the land of Egypt, and Assyria shall be their king, because they have refused to return to me.";
asv[5] = "They shall not return into the land of Egypt; but the Assyrian shall be their king, because they refused to return [to me].";
yng[5] = "He turneth not back unto the land of Egypt, And Asshur -- he [is] his king, For they have refused to return.";
dby[5] = "He shall not return into the land of Egypt, but the Assyrian shall be his king; for they refused to return [to me];";
web[5] = "He shall not return into the land of Egypt, but the Assyrian shall be his king, because they refused to return.";
hnv[5] = "&quot;They won\'t return into the land of Mitzrayim; But the Ashshur will be their king, Because they refused to repent.";
vul[5] = "non revertetur in terram Aegypti et Assur ipse rex eius quoniam noluerunt converti";
kjv[6] = "And the sword shall abide on his cities, and shall consume his branches, and devour [them], because of their own counsels.";
rsv[6] = "The sword shall rage against their cities, consume the bars of their gates, and devour them in their fortresses.";
asv[6] = "And the sword shall fall upon their cities, and shall consume their bars, and devour [them], because of their own counsels.";
yng[6] = "Grievous hath been the sword in his cities, And it hath ended his bars, and consumed -- from their own counsels.";
dby[6] = "and the sword shall turn about in his cities, and shall consume his bars, and devour [them], because of their own counsels.";
web[6] = "And the sword shall abide on his cities, and shall consume his branches, and devour [them], because of their own counsels.";
hnv[6] = "The sword will fall on their cities, And will consume their gate bars, And will put an end to their plans.";
vul[6] = "coepit gladius in civitatibus eius et consumet electos eius et comedet capita eorum";
kjv[7] = "And my people are bent to backsliding from me: though they called them to the most High, none at all would exalt [him].";
rsv[7] = "My people are bent on turning away from me; so they are appointed to the yoke, and none shall remove it.";
asv[7] = "And my people are bent on backsliding from me: though they call them to [him that is] on high, none at all will exalt [him].";
yng[7] = "And My people are hanging in suspense, about My returning, And unto the Most High they do call, Together they exalt not.";
dby[7] = "Yea, my people are bent upon backsliding from me: though they call them to the Most High, none at all exalteth [him].";
web[7] = "And my people are bent to backsliding from me: though they called them to the most High, none at all would exalt [him].";
hnv[7] = "My people are determined to turn from me. Though they call to Ha`Elyon, He certainly won\'t exalt them.";
vul[7] = "et populus meus pendebit ad reditum meum iugum autem inponetur ei simul quod non auferetur";
kjv[8] = "How shall I give thee up, Ephraim? [how] shall I deliver thee, Israel? how shall I make thee as Admah? [how] shall I set thee as Zeboim? mine heart is turned within me, my repentings are kindled together.";
rsv[8] = "How can I give you up, O E\'phraim! How can I hand you over, O Israel! How can I make you like Admah! How can I treat you like Zeboi\'im! My heart recoils within me, my compassion grows warm and tender.";
asv[8] = "How shall I give thee up, Ephraim? [how] shall I cast thee off, Israel? how shall I make thee as Admah? [how] shall I set thee as Zeboiim? my heart is turned within me, my compassions are kindled together.";
yng[8] = "How do I give thee up, O Ephraim? Do I deliver thee up, O Israel? How do I make thee as Admah? Do I set thee as Zeboim? Turned in Me is My heart, kindled together have been My repentings.";
dby[8] = "How shall I give thee over, Ephraim? [how] shall I deliver thee up, Israel? how shall I make thee as Admah? [how] shall I set thee as Zeboim? My heart is turned within me, my repentings are kindled together.";
web[8] = "How shall I give thee up, Ephraim? [how] shall I deliver thee, Israel? how shall I make thee as Admah? [how] shall I set thee as Zeboim? my heart is turned within me, my repentings are kindled together.";
hnv[8] = "&quot;How can I give you up, Efrayim? How can I hand you over, Yisra\'el? How can I make you like Admah? How can I make you like Tzevoyim? My heart is turned within me, My compassion is aroused.";
vul[8] = "quomodo dabo te Ephraim protegam te Israhel quomodo dabo te sicut Adama ponam te ut Seboim conversum est in me cor meum pariter conturbata est paenitudo mea";
kjv[9] = "I will not execute the fierceness of mine anger, I will not return to destroy Ephraim: for I [am] God, and not man; the Holy One in the midst of thee: and I will not enter into the city.";
rsv[9] = "I will not execute my fierce anger, I will not again destroy E\'phraim; for I am God and not man, the Holy One in your midst, and I will not come to destroy.";
asv[9] = "I will not execute the fierceness of mine anger, I will not return to destroy Ephraim: for I am God, and not man; the Holy One in the midst of thee; and I will not come in wrath.";
yng[9] = "I do not the fierceness of My anger, I turn not back to destroy Ephraim, For God I [am], and not a man. In thy midst the Holy One, and I enter not in enmity,";
dby[9] = "I will not execute the fierceness of mine anger, I will not again destroy Ephraim; for I am God, and not man, -- the Holy One in the midst of thee: and I will not come in anger.";
web[9] = "I will not execute the fierceness of my anger, I will not return to destroy Ephraim: for I [am] God, and not man; the Holy One in the midst of thee: and I will not enter into the city.";
hnv[9] = "I will not execute the fierceness of my anger. I will not return to destroy Efrayim: For I am God, and not man; the Holy One in the midst of you; And I will not come in wrath.";
vul[9] = "non faciam furorem irae meae non convertar ut disperdam Ephraim quoniam Deus ego et non homo in medio tui Sanctus et non ingrediar civitatem";
kjv[10] = "They shall walk after the LORD: he shall roar like a lion: when he shall roar, then the children shall tremble from the west.";
rsv[10] = "They shall go after the LORD, he will roar like a lion; yea, he will roar, and his sons shall come trembling from the west;";
asv[10] = "They shall walk after Jehovah, who will roar like a lion; for he will roar, and the children shall come trembling from the west.";
yng[10] = "After Jehovah they go -- as a lion He roareth, When He doth roar, then tremble do the sons from the west.";
dby[10] = "They shall walk after Jehovah; he shall roar like a lion; when he shall roar, then the children shall hasten from the west:";
web[10] = "They shall walk after the LORD: he shall roar like a lion: when he shall roar, then the children shall tremble from the west.";
hnv[10] = "They will walk after the LORD, Who will roar like a lion; For he will roar, and the children will come trembling from the west.";
vul[10] = "post Dominum ambulabunt quasi leo rugiet quia ipse rugiet et formidabunt filii maris";
kjv[11] = "They shall tremble as a bird out of Egypt, and as a dove out of the land of Assyria: and I will place them in their houses, saith the LORD.";
rsv[11] = "they shall come trembling like birds from Egypt, and like doves from the land of Assyria; and I will return them to their homes, says the LORD.";
asv[11] = "They shall come trembling as a bird out of Egypt, and as a dove out of the land of Assyria; and I will make them to dwell in their houses, saith Jehovah.";
yng[11] = "They tremble as a sparrow out of Egypt, And as a dove out of the land of Asshur, And I have caused them to dwell in their own houses, An affirmation of Jehovah.";
dby[11] = "they shall hasten as a bird out of Egypt, and as a dove out of the land of Assyria; and I will cause them to dwell in their houses, saith Jehovah.";
web[11] = "They shall tremble as a bird out of Egypt, and as a dove out of the land of Assyria: and I will place them in their houses, saith the LORD.";
hnv[11] = "They will come trembling like a bird out of Mitzrayim, And like a dove out of the land of Ashshur; And I will settle them in their houses,&quot; says the LORD.";
vul[11] = "et avolabunt quasi avis ex Aegypto et quasi columba de terra Assyriorum et conlocabo eos in domibus suis dicit Dominus";
kjv[12] = "Ephraim compasseth me about with lies, and the house of Israel with deceit: but Judah yet ruleth with God, and is faithful with the saints.";
rsv[12] = "E\'phraim has encompassed me with lies, and the house of Israel with deceit; but Judah is still known by God, and is faithful to the Holy One.";
asv[12] = "Ephraim compasseth me about with falsehood, and the house of Israel with deceit; but Judah yet ruleth with God, and is faithful with the Holy One.";
yng[12] = "Compassed Me with feigning hath Ephraim, And with deceit the house of Israel. And Judah again is ruling with God, And with the Holy Ones [is] faithful!";
dby[12] = "Ephraim encompasseth me about with lies, and the house of Israel with deceit; but Judah yet walketh with God, and with the holy things of truth.";
web[12] = "Ephraim encompasseth me with lies, and the house of Israel with deceit: but Judah yet ruleth with God, and is faithful with the saints.";
hnv[12] = "Efrayim surrounds me with falsehood, And the house of Yisra\'el with deceit; And Yehudah still us unruly with God, And is unfaithful to the Holy One.";
vul[12] = "circumdedit me in negatione Ephraim et in dolo domus Israhel Iudas autem testis descendit cum Deo et cum sanctis fidelis";
</script>
