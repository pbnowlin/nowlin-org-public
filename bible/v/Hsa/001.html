csb[1] = "The word of the LORD that came to Hosea son of Beeri during the reigns of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah, and of Jeroboam son of Jehoash, king of Israel.";
csb[2] = "When the LORD first spoke to Hosea, he said this to him: Go and marry a woman of promiscuity, and have children of promiscuity, for the land is committing blatant acts of promiscuity by abandoning the LORD.";
csb[3] = "So he went and married Gomer daughter of Diblaim, and she conceived and bore him a son.";
csb[4] = "Then the LORD said to him: Name him Jezreel, for in a little while I will bring the bloodshed of Jezreel on the house of Jehu and put an end to the kingdom of the house of Israel.";
csb[5] = "On that day I will break the bow of Israel in the Valley of Jezreel.";
csb[6] = "She conceived again and gave birth to a daughter, and the LORD said to him: Name her Lo-ruhamah, for I will no longer have compassion on the house of Israel. I will certainly take them away.";
csb[7] = "But I will have compassion on the house of Judah, and I will deliver them by the LORD their God. I will not deliver them by bow, sword, or war, or by horses and cavalry.";
csb[8] = "After Gomer had weaned Lo-ruhamah, she conceived and gave birth to a son.";
csb[9] = "Then the LORD said: Name him Lo-ammi, for you are not my people, and I will not be your God.";
csb[10] = "Yet the number of the Israelites will be like the sand of the sea, which cannot be measured or counted. And in the place where they were told: You are not my people, they will be called: Sons of the living God.";
csb[11] = "And the Judeans and the Israelites will be gathered together. They will appoint for themselves a single ruler and go up from the land. For the day of Jezreel will be great.";
kjv[1] = "The word of the LORD that came unto Hosea, the son of Beeri, in the days of Uzziah, Jotham, Ahaz, [and] Hezekiah, kings of Judah, and in the days of Jeroboam the son of Joash, king of Israel.";

vul[1] = "verbum Domini quod factum est ad Osee filium Beeri in diebus Oziae Ioatham Ahaz Ezechiae regum Iuda et in diebus Hieroboam filii Ioas regis Israhel";
kjv[2] = "The beginning of the word of the LORD by Hosea. And the LORD said to Hosea, Go, take unto thee a wife of whoredoms and children of whoredoms: for the land hath committed great whoredom, [departing] from the LORD.";
rsv[2] = "When the LORD first spoke through Hose\'a, the LORD said to Hose\'a, &quot;Go, take to yourself a wife of harlotry and have children of harlotry, for the land commits great harlotry by forsaking the LORD.&quot;";
asv[2] = "When Jehovah spake at the first by Hosea, Jehovah said unto Hosea, Go, take unto thee a wife of whoredom and children of whoredom; for the land doth commit great whoredom, [departing] from Jehovah.";
yng[2] = "The commencement of Jehovah\'s speaking by Hosea. And Jehovah saith unto Hosea, `Go, take to thee a woman of whoredoms, and children of whoredoms, for utterly go a-whoring doth the land from after Jehovah.\'";
dby[2] = "The beginning of the word of Jehovah through Hosea. And Jehovah said to Hosea, Go, take unto thee a wife of whoredoms, and children of whoredoms; for the land is entirely given up to whoredom, away from Jehovah.";
web[2] = "The beginning of the word of the LORD by Hosea. And the LORD said to Hosea, Go take to thee a wife addicted to lewdness and children of lewdness; for the land hath committed great lewdness, [departing] from the LORD.";
hnv[2] = " When the LORD spoke at the first by Hoshea, the LORD said to Hoshea, &quot;Go, take for yourself a wife of prostitution and children of unfaithfulness; for the land commits great adultery against from the LORD.&quot;";

dby[6] = "And she conceived again, and bore a daughter. And he said unto him, Call her name Lo-ruhamah; for I will no more have mercy upon the house of Israel, so that I should pardon them.";

kjv[10] = "Yet the number of the children of Israel shall be as the sand of the sea, which cannot be measured nor numbered; and it shall come to pass, [that] in the place where it was said unto them, Ye [are] not my people, [there] it shall be said unto them, [Ye are] the sons of the living God.";
rsv[10] = "Yet the number of the people of Israel shall be like the sand of the sea, which can be neither measured nor numbered; and in the place where it was said to them, &quot;You are not my people,&quot; it shall be said to them, &quot;Sons of the living God.&quot;";
asv[10] = "Yet the number of the children of Israel shall be as the sand of the sea, which cannot be measured nor numbered; and it shall come to pass that, in the place where it was said unto them, Ye are not my people, it shall be said unto them, [Ye are] the sons of the living God.";
yng[10] = "and the number of the sons of Israel hath been as the sand of the sea, that is not measured nor numbered, and it hath come to pass in the place where it is said to them, Ye [are] not My people, it is said to them, Sons of the Living God;";
