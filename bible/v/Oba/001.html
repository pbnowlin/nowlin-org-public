csb[1] = "The vision of Obadiah. This is what the Lord GOD has said about Edom: We have heard a message from the LORD; an envoy has been sent among the nations: &quot;Rise up, and let us go to war against her.&quot;";
csb[2] = "Look, I will make you insignificant among the nations; you will be deeply despised.";
csb[3] = "Your arrogant heart has deceived you, you who live in clefts of the rock in your home on the heights, who say to yourself, &quot;Who can bring me down to the ground? &quot;";
csb[4] = "Though you seem to soar like an eagle and make your nest among the stars, even from there I will bring you down. This is the LORD\'s declaration.";
csb[5] = "If thieves came to you, if marauders by night -- how ravaged you would be! -- wouldn\'t they steal only what they wanted? If grape pickers came to you, wouldn\'t they leave some grapes?";
csb[6] = "How Esau will be pillaged, his hidden treasures searched out!";
csb[7] = "Everyone who has a treaty with you will drive you to the border; everyone at peace with you will deceive and conquer you. Those who eat your bread will set a trap for you. He will be unaware of it.";
csb[8] = "In that day -- this is the LORD\'s declaration -- will I not eliminate the wise ones of Edom and those who understand from the hill country of Esau?";
csb[9] = "Teman, your warriors will be terrified so that everyone from the hill country of Esau will be destroyed by slaughter.";
csb[10] = "You will be covered with shame and destroyed forever because of violence done to your brother Jacob.";
csb[11] = "On the day you stood aloof, on the day strangers captured his wealth, while foreigners entered his city gate and cast lots for Jerusalem, you were just like one of them.";
csb[12] = "Do not gloat over your brother in the day of his calamity; do not rejoice over the people of Judah in the day of their destruction; do not boastfully mock in the day of distress.";
csb[13] = "Do not enter my people\'s city gate in the day of their disaster. Yes, you -- do not gloat over their misery in the day of their disaster, and do not appropriate their possessions in the day of their disaster.";
csb[14] = "Do not stand at the crossroads to cut off their fugitives, and do not hand over their survivors in the day of distress.";
csb[15] = "For the day of the LORD is near, against all the nations. As you have done, it will be done to you; what you deserve will return on your own head.";
csb[16] = "As you have drunk on my holy mountain, so all the nations will drink continually. They will drink and gulp down and be as though they had never been.";
csb[17] = "But there will be a deliverance on Mount Zion, and it will be holy; the house of Jacob will dispossess those who dispossessed them.";
csb[18] = "Then the house of Jacob will be a blazing fire, and the house of Joseph, a burning flame, but the house of Esau will be stubble; Jacob will set them on fire and consume Edom. Therefore no survivor will remain of the house of Esau, for the LORD has spoken.";
csb[19] = "People from the Negev will possess the hill country of Esau; those from the Judean foothills will possess the land of the Philistines. They will possess the territories of Ephraim and Samaria, while Benjamin will possess Gilead.";
csb[20] = "The exiles of the Israelites who are in Halah and who are among the Canaanites as far as Zarephath as well as the exiles of Jerusalem who are in Sepharad will possess the cities of the Negev.";
csb[21] = "Saviors will ascend Mount Zion to rule over the hill country of Esau, but the kingdom will be the LORD\'s.";
kjv[1] = "The vision of Obadiah. Thus saith the Lord GOD concerning Edom; We have heard a rumour from the LORD, and an ambassador is sent among the heathen, Arise ye, and let us rise up against her in battle.";
rsv[1] = "The vision of Obadi\'ah. Thus says the Lord GOD concerning Edom: We have heard tidings from the LORD, and a messenger has been sent among the nations: &quot;Rise up! let us rise against her for battle!&quot;";
asv[1] = "The vision of Obadiah. Thus saith the Lord Jehovah concerning Edom: We have heard tidings from Jehovah, and an ambassador is sent among the nations, [saying], Arise ye, and let us rise up against her in battle.";
yng[1] = "Thus said the Lord Jehovah to Edom, A report we have heard from Jehovah, And an ambassador among nations was sent, `Rise, yea, let us rise against her for battle.\'";
dby[1] = "The vision of Obadiah. Thus saith the Lord Jehovah concerning Edom: We have heard a report from Jehovah, and an ambassador is sent among the nations. Arise ye, and let us rise up against her in battle.";
web[1] = "The vision of Obadiah. Thus saith the Lord GOD concerning Edom; We have heard a rumor from the LORD, and an embassador is sent among the heathen, Arise ye, and let us rise up against her in battle.";
hnv[1] = "The vision of `Ovadyah. This is what the Lord GOD says about Edom. We have heard news from the LORD, and an ambassador is sent among the nations, saying, &quot;Arise, and let\'s rise up against her in battle.";
vul[1] = "visio Abdiae haec dicit Dominus Deus ad Edom auditum audivimus a Domino et legatum ad gentes misit surgite et consurgamus adversum eum in proelium";
kjv[2] = "Behold, I have made thee small among the heathen: thou art greatly despised.";
rsv[2] = "Behold, I will make you small among the nations, you shall be utterly despised.";
asv[2] = "Behold, I have made thee small among the nations: thou art greatly despised.";
yng[2] = "Lo, little I have made thee among nations, Despised [art] thou exceedingly.";
dby[2] = "Behold, I have made thee small among the nations; thou art greatly despised.";
web[2] = "Behold, I have made thee small among the heathen: thou art greatly despised.";
hnv[2] = "Behold, I have made you small among the nations. You are greatly despised.";
vul[2] = "ecce parvulum te dedi in gentibus contemptibilis tu es valde";
kjv[3] = "The pride of thine heart hath deceived thee, thou that dwellest in the clefts of the rock, whose habitation [is] high; that saith in his heart, Who shall bring me down to the ground?";
rsv[3] = "The pride of your heart has deceived you, you who live in the clefts of the rock, whose dwelling is high, who say in your heart, &quot;Who will bring me down to the ground?&quot;";
asv[3] = "The pride of thy heart hath deceived thee, O thou that dwellest in the clefts of the rock, whose habitation is high; that saith in his heart, Who shall bring me down to the ground?";
yng[3] = "The pride of thy heart hath lifted thee up, O dweller in clifts of a rock, (A high place [is] his habitation, He is saying in his heart, `Who doth bring me down [to] earth?\')";
dby[3] = "The pride of thy heart hath deceived thee, thou that dwellest in the clefts of the rock, whose habitation is high; -- he that saith in his heart, Who shall bring me down to the ground?";
web[3] = "The pride of thy heart hath deceived thee, thou that dwellest in the clefts of the rock, whose habitation [is] high; that saith in his heart, Who shall bring me down to the ground?";
hnv[3] = "The pride of your heart has deceived you, you who dwell in the clefts of the rock, whose habitation is high, who says in his heart, \'Who will bring me down to the ground?\'";
vul[3] = "superbia cordis tui extulit te habitantem in scissuris petrae exaltantem solium suum qui dicit in corde suo quis detrahet me in terram";
kjv[4] = "Though thou exalt [thyself] as the eagle, and though thou set thy nest among the stars, thence will I bring thee down, saith the LORD.";
rsv[4] = "Though you soar aloft like the eagle, though your nest is set among the stars, thence I will bring you down, says the LORD.";
asv[4] = "Though thou mount on high as the eagle, and though thy nest be set among the stars, I will bring thee down from thence, saith Jehovah.";
yng[4] = "If thou dost go up high as an eagle, And if between stars thou dost set thy nest, From thence I bring thee down, An affirmation of Jehovah.";
dby[4] = "Though thou exalt thyself as the eagle, and though thou set thy nest among the stars, thence will I bring thee down, saith Jehovah.";
web[4] = "Though thou shalt exalt [thyself] as the eagle, and though thou shalt set thy nest among the stars, thence will I bring thee down, saith the LORD.";
hnv[4] = "Though you mount on high as the eagle, and though your nest is set among the stars, I will bring you down from there, says the LORD.";
vul[4] = "si exaltatus fueris ut aquila et si inter sidera posueris nidum tuum inde detraham te dicit Dominus";
kjv[5] = "If thieves came to thee, if robbers by night, (how art thou cut off!) would they not have stolen till they had enough? if the grapegatherers came to thee, would they not leave [some] grapes?";
rsv[5] = "If thieves came to you, if plunderers by night--how you have been destroyed!--would they not steal only enough for themselves? If grape gatherers came to you, would they not leave gleanings?";
asv[5] = "If thieves came to thee, if robbers by night (how art thou cut off!), would they not steal [only] till they had enough? if grape-gatherers came to thee, would they not leave some gleaning grapes?";
yng[5] = "If thieves have come in to thee, If spoilers of the night, How hast thou been cut off! Do they not steal their sufficiency? If gatherers have come in to thee, Do they not leave gleanings?";
dby[5] = "If thieves had come to thee, if robbers by night, (how art thou cut off!) would they not have stolen [till] they had had enough? If grape-gatherers had come to thee, would they not have left some gleanings?";
web[5] = "If thieves came to thee, if robbers by night, (how art thou cut off!) would they not have stolen till they had enough? if the grape-gatherers came to thee, would they not leave [some] grapes?";
hnv[5] = "If thieves came to you, if robbers by night -- oh, what disaster awaits you -- wouldn\'t they only steal until they had enough? If grape pickers came to you, wouldn\'t they leave some gleaning grapes?";
vul[5] = "si fures introissent ad te si latrones per noctem quomodo conticuisses nonne furati essent sufficientia sibi si vindemiatores introissent ad te numquid saltim racemos reliquissent tibi";
kjv[6] = "How are [the things] of Esau searched out! [how] are his hidden things sought up!";
rsv[6] = "How Esau has been pillaged, his treasures sought out!";
asv[6] = "How are [the things of] Esau searched! how are his hidden treasures sought out!";
yng[6] = "How hath Esau been searched out! Flowed out have his hidden things,";
dby[6] = "How is Esau searched! his hidden things sought out!";
web[6] = "How are [the things] of Esau searched out! [how] are his hidden things sought!";
hnv[6] = "How Esav will be ransacked! How his hidden treasures are sought out!";
vul[6] = "quomodo scrutati sunt Esau investigaverunt abscondita eius";
kjv[7] = "All the men of thy confederacy have brought thee [even] to the border: the men that were at peace with thee have deceived thee, [and] prevailed against thee; [they that eat] thy bread have laid a wound under thee: [there is] none understanding in him.";
rsv[7] = "All your allies have deceived you, they have driven you to the border; your confederates have prevailed against you; your trusted friends have set a trap under you--there is no understanding of it.";
asv[7] = "All the men of thy confederacy have brought thee on thy way, even to the border: the men that were at peace with thee have deceived thee, and prevailed against thee; [they that eat] thy bread lay a snare under thee: there is no understanding in him.";
yng[7] = "Unto the border sent thee have all thine allies, Forgotten thee, prevailed over thee, have thy friends, Thy bread they make a snare under thee, There is no understanding in him!";
dby[7] = "All the men of thy confederacy have pushed thee to the border; the men that were at peace with thee have deceived thee, they have prevailed against thee; [they that eat] thy bread have laid a snare under thee. There is no understanding in him.";
web[7] = "All the men of thy confederacy have brought thee [even] to the border: the men that were at peace with thee have deceived thee, [and] prevailed against thee; [they that eat] thy bread have laid a wound under thee: [there is] no understanding in him.";
hnv[7] = "All the men of your alliance have brought you on your way, even to the border. The men who were at shalom with you have deceived you, and prevailed against you. Friends who eat your bread lay a snare under you. There is no understanding in him.";
vul[7] = "usque ad terminum emiserunt te omnes viri foederis tui inluserunt tibi invaluerunt adversum te viri pacis tuae qui comedunt tecum ponent insidias subter te non est prudentia in eo";
kjv[8] = "Shall I not in that day, saith the LORD, even destroy the wise [men] out of Edom, and understanding out of the mount of Esau?";
rsv[8] = "Will I not on that day, says the LORD, destroy the wise men out of Edom, and understanding out of Mount Esau?";
asv[8] = "Shall I not in that day, saith Jehovah, destroy the wise men out of Edom, and understanding out of the mount of Esau?";
yng[8] = "Is it not in that day -- an affirmation of Jehovah, That I have destroyed the wise out of Edom, And understanding out of the mount of Esau?";
dby[8] = "Shall I not in that day, saith Jehovah, destroy the wise men out of Edom, and understanding out of the mount of Esau?";
web[8] = "Shall I not in that day, saith the LORD, even destroy the wise [men] out of Edom, and understanding out of the mount of Esau?";
hnv[8] = "&quot;Won\'t I in that day,&quot; says the LORD, &quot;destroy the wise men out of Edom, and understanding out of the mountain of Esav?";
vul[8] = "numquid non in die illa dicit Dominus perdam sapientes de Idumea et prudentiam de monte Esau";
kjv[9] = "And thy mighty [men], O Teman, shall be dismayed, to the end that every one of the mount of Esau may be cut off by slaughter.";
rsv[9] = "And your mighty men shall be dismayed, O Teman, so that every man from Mount Esau will be cut off by slaughter.";
asv[9] = "And thy mighty men, O Teman, shall be dismayed, to the end that every one may be cut off from the mount of Esau by slaughter.";
yng[9] = "And broken down have been thy mighty ones, O Teman, So that every one of the mount of Esau is cut off.";
dby[9] = "And thy mighty men, O Teman, shall be dismayed, to the end that every one may be cut off from the mount of Esau by slaughter.";
web[9] = "And thy mighty [men], O Teman, shall be dismayed, to the end that every one of the mount of Esau may be cut off by slaughter.";
hnv[9] = "Your mighty men, Teman, will be dismayed, to the end that everyone may be cut off from the mountain of Esav by slaughter.";
vul[9] = "et timebunt fortes tui a meridie ut intereat vir de monte Esau";
kjv[10] = "For [thy] violence against thy brother Jacob shame shall cover thee, and thou shalt be cut off for ever.";
rsv[10] = "For the violence done to your brother Jacob, shame shall cover you, and you shall be cut off for ever.";
asv[10] = "For the violence done to thy brother Jacob, shame shall cover thee, and thou shalt be cut off for ever.";
yng[10] = "For slaughter, for violence [to] thy brother Jacob, Cover thee doth shame, And thou hast been cut off -- to the age.";
dby[10] = "Because of violence against thy brother Jacob, shame shall cover thee, and thou shalt be cut off for ever.";
web[10] = "For [thy] violence against thy brother Jacob shame shall cover thee, and thou shalt be cut off for ever.";
hnv[10] = "For the violence done to your brother Ya`akov, shame will cover you, and you will be cut off forever.";
vul[10] = "propter interfectionem et propter iniquitatem in fratrem tuum Iacob operiet te confusio et peribis in aeternum";
kjv[11] = "In the day that thou stoodest on the other side, in the day that the strangers carried away captive his forces, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou [wast] as one of them.";
rsv[11] = "On the day that you stood aloof, on the day that strangers carried off his wealth, and foreigners entered his gates and cast lots for Jerusalem, you were like one of them.";
asv[11] = "In the day that thou stoodest on the other side, in the day that strangers carried away his substance, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou wast as one of them.";
yng[11] = "In the day of thy standing over-against, In the day of strangers taking captive his force, And foreigners have entered his gates, And for Jerusalem have cast a lot, Even thou [art] as one of them!";
dby[11] = "In the day that thou stoodest on the other side, in the day that strangers carried away captive his substance, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou wast as one of them.";
web[11] = "In the day that thou stoodst on the other side, in the day that the strangers carried away captive his forces, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou [wast] as one of them.";
hnv[11] = "In the day that you stood on the other side, in the day that strangers carried away his substance, and foreigners entered into his gates, and cast lots for Yerushalayim, even you were like one of them.";
vul[11] = "in die cum stares adversus quando capiebant alieni exercitum eius et extranei ingrediebantur portas eius et super Hierusalem mittebant sortem tu quoque eras quasi unus ex eis";
kjv[12] = "But thou shouldest not have looked on the day of thy brother in the day that he became a stranger; neither shouldest thou have rejoiced over the children of Judah in the day of their destruction; neither shouldest thou have spoken proudly in the day of distress.";
rsv[12] = "But you should not have gloated over the day of your brother in the day of his misfortune; you should not have rejoiced over the people of Judah in the day of their ruin; you should not have boasted in the day of distress.";
asv[12] = "But look not thou on the day of thy brother in the day of his disaster, and rejoice not over the children of Judah in the day of their destruction; neither speak proudly in the day of distress.";
yng[12] = "And -- thou dost not look on the day of thy brother, On the day of his alienation, Nor dost thou rejoice over sons of Judah, In the day of their destruction, Nor make great thy mouth in a day of distress.";
dby[12] = "But thou shouldest not have looked on the day of thy brother in the day of his disaster; neither shouldest thou have rejoiced over the children of Judah in the day of their destruction; nor have opened wide thy mouth in the day of distress.";
web[12] = "But thou shouldst not have looked on the day of thy brother in the day that he became a stranger; neither shouldst thou have rejoiced over the children of Judah in the day of their destruction; neither shouldst thou have spoken proudly in the day of distress.";
hnv[12] = "But don\'t look down on your brother in the day of his disaster, and don\'t rejoice over the children of Yehudah in the day of their destruction. Don\'t speak proudly in the day of distress.";
vul[12] = "et non despicies in die fratris tui in die peregrinationis eius et non laetaberis super filios Iuda in die perditionis eorum et non magnificabis os tuum in die angustiae";
kjv[13] = "Thou shouldest not have entered into the gate of my people in the day of their calamity; yea, thou shouldest not have looked on their affliction in the day of their calamity, nor have laid [hands] on their substance in the day of their calamity;";
rsv[13] = "You should not have entered the gate of my people in the day of his calamity; you should not have gloated over his disaster in the day of his calamity; you should not have looted his goods in the day of his calamity.";
asv[13] = "Enter not into the gate of my people in the day of their calamity; yea, look not thou on their affliction in the day of their calamity, neither lay ye [hands] on their substance in the day of their calamity.";
yng[13] = "Nor come into a gate of My people in a day of their calamity, Nor look, even thou, on its misfortune in a day of its calamity, Nor send forth against its force in a day of its calamity,";
dby[13] = "Thou shouldest not have entered into the gate of my people in the day of their calamity, nor have looked, even thou, on their affliction in the day of their calamity, neither shouldest thou have laid [hands] on their substance in the day of their calamity;";
web[13] = "Thou shouldst not have entered into the gate of my people in the day of their calamity; yes, thou shouldst not have looked on their affliction in the day of their calamity, nor have laid [hands] on their substance in the day of their calamity;";
hnv[13] = " Don\'t enter into the gate of my people in the day of their calamity. Don\'t look down on their affliction in the day of their calamity, neither seize their wealth on the day of their calamity.";
vul[13] = "neque ingredieris portam populi mei in die ruinae eorum neque despicies et tu in malis eius in die vastitatis illius et non emitteris adversum exercitum eius in die vastitatis illius";
kjv[14] = "Neither shouldest thou have stood in the crossway, to cut off those of his that did escape; neither shouldest thou have delivered up those of his that did remain in the day of distress.";
rsv[14] = "You should not have stood at the parting of the ways to cut off his fugitives; you should not have delivered up his survivors in the day of distress.";
asv[14] = "And stand thou not in the crossway, to cut off those of his that escape; and deliver not up those of his that remain in the day of distress.";
yng[14] = "Nor stand by the breach to cut off its escaped, Nor deliver up its remnant in a day of distress.";
dby[14] = "and thou shouldest not have stood on the crossway, to cut off those of his that did escape, nor have delivered up those remaining of him in the day of distress.";
web[14] = "Neither shouldst thou have stood in the cross-way, to cut off those of his that escaped; neither shouldst thou have delivered up those of his that remained in the day of distress.";
hnv[14] = "Don\'t stand in the crossroads to cut off those of his who escape. Don\'t deliver up those of his who remain in the day of distress.";
vul[14] = "neque stabis in exitibus ut interficias eos qui fugerint et non concludes reliquos eius in die tribulationis";
kjv[15] = "For the day of the LORD [is] near upon all the heathen: as thou hast done, it shall be done unto thee: thy reward shall return upon thine own head.";
rsv[15] = "For the day of the LORD is near upon all the nations. As you have done, it shall be done to you, your deeds shall return on your own head.";
asv[15] = "For the day of Jehovah is near upon all the nations: as thou hast done, it shall be done unto thee; thy dealing shall return upon thine own head.";
yng[15] = "For near [is] the day of Jehovah, on all the nations, As thou hast done, it is done to thee, Thy deed doth turn back on thine own head.";
dby[15] = "For the day of Jehovah is near upon all the nations: as thou hast done, it shall be done unto thee: thy recompence shall return upon thine own head.";
web[15] = "For the day of the LORD [is] near upon all the heathen: as thou hast done, it shall be done to thee: thy reward shall return upon thy own head.";
hnv[15] = "For the day of the LORD is near all the nations! As you have done, it will be done to you. Your deeds will return upon your own head.";
vul[15] = "quoniam iuxta est dies Domini super omnes gentes sicut fecisti fiet tibi retributionem tuam convertet in caput tuum";
kjv[16] = "For as ye have drunk upon my holy mountain, [so] shall all the heathen drink continually, yea, they shall drink, and they shall swallow down, and they shall be as though they had not been.";
rsv[16] = "For as you have drunk upon my holy mountain, all the nations round about shall drink; they shall drink, and stagger, and shall be as though they had not been.";
asv[16] = "For as ye have drunk upon my holy mountain, so shall all the nations drink continually; yea, they shall drink, and swallow down, and shall be as though they had not been.";
yng[16] = "For -- as ye have drunk on My holy mount, Drink do all the nations continually, And they have drunk and have swallowed, And they have been as they have not been.";
dby[16] = "For as ye have drunk upon my holy mountain, so shall all the nations drink continually; yea, they shall drink, and shall swallow down, and they shall be as though they had not been.";
web[16] = "For as ye have drank upon my holy mountain, [so] shall all the heathen drink continually, yes, they shall drink, and they shall swallow down, and they shall be as though they had not been.";
hnv[16] = "For as you have drunk on my holy mountain, so will all the nations drink continually. Yes, they will drink, swallow down, and will be as though they had not been.";
vul[16] = "quomodo enim bibisti super montem sanctum meum bibent omnes gentes iugiter et bibent et absorbent et erunt quasi non sint";
kjv[17] = "But upon mount Zion shall be deliverance, and there shall be holiness; and the house of Jacob shall possess their possessions.";
rsv[17] = "But in Mount Zion there shall be those that escape, and it shall be holy; and the house of Jacob shall possess their own possessions.";
asv[17] = "But in mount Zion there shall be those that escape, and it shall be holy; and the house of Jacob shall possess their possessions.";
yng[17] = "And in mount Zion there is an escape, And it hath been holy, And the house of Jacob have possessed their possessions.";
dby[17] = "But upon mount Zion shall there be deliverance, and it shall be holy; and the house of Jacob shall possess their possessions.";
web[17] = "But upon mount Zion shall be deliverance, and there shall be holiness; and the house of Jacob shall possess their possessions.";
hnv[17] = "But in Mount Tziyon, there will be those who escape, and it will be holy. The house of Ya`akov will possess their possessions.";
vul[17] = "et in monte Sion erit salvatio et erit sanctus et possidebit domus Iacob eos qui se possederant";
kjv[18] = "And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble, and they shall kindle in them, and devour them; and there shall not be [any] remaining of the house of Esau; for the LORD hath spoken [it].";
rsv[18] = "The house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau stubble; they shall burn them and consume them, and there shall be no survivor to the house of Esau; for the LORD has spoken.";
asv[18] = "And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble, and they shall burn among them, and devour them; and there shall not be any remaining to the house of Esau; for Jehovah hath spoken it.";
yng[18] = "And the house of Jacob hath been a fire, And the house of Joseph a flame, And the house of Esau for stubble, And they have burned among them, And they have consumed them, And there is not a remnant to the house of Esau, For Jehovah hath spoken.";
dby[18] = "And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble; and they shall kindle in them and devour them; and there shall not be any remaining of the house of Esau: for Jehovah hath spoken [it].";
web[18] = "And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble, and they shall kindle in them, and devour them; and there shall not be [any] remaining of the house of Esau; for the LORD hath spoken [it].";
hnv[18] = "The house of Ya`akov will be a fire, the house of Yosef a flame, and the house of Esav for stubble. They will burn among them, and devour them. There will not be any remaining to the house of Esav.&quot; Indeed, the LORD has spoken.";
vul[18] = "et erit domus Iacob ignis et domus Ioseph flamma et domus Esau stipula et succendentur in eis et devorabunt eos et non erunt reliquiae domus Esau quia Dominus locutus est";
kjv[19] = "And [they of] the south shall possess the mount of Esau; and [they of] the plain the Philistines: and they shall possess the fields of Ephraim, and the fields of Samaria: and Benjamin [shall possess] Gilead.";
rsv[19] = "Those of the Negeb shall possess Mount Esau, and those of the Shephe\'lah the land of the Philistines; they shall possess the land of E\'phraim and the land of Sama\'ria and Benjamin shall possess Gilead.";
asv[19] = "And they of the South shall possess the mount of Esau, and they of the lowland the Philistines; and they shall possess the field of Ephraim, and the field of Samaria; and Benjamin [shall possess] Gilead.";
yng[19] = "And they have possessed the south with the mount of Esau, And the low country with the Philistines, And they have possessed the field of Ephraim, And the field of Samaria, And Benjamin with Gilead.";
dby[19] = "And [they of] the south shall possess the mount of Esau; and they of the lowland the Philistines; yea, they shall possess the field of Ephraim and the field of Samaria; and Benjamin [shall possess] Gilead;";
web[19] = "And [they of] the south shall possess the mount of Esau; and [they of] the plain the Philistines: and they shall possess the fields of Ephraim, and the fields of Samaria: and Benjamin [shall possess] Gilead.";
hnv[19] = "Those of the South will possess the mountain of Esav, and those of the lowland, the Pelishtim. They will possess the field of Efrayim, and the field of Shomron. Binyamin will possess Gil`ad.";
vul[19] = "et hereditabunt hii qui ad austrum montem Esau et qui in campestribus Philisthim et possidebunt regionem Ephraim et regionem Samariae et Beniamin possidebit Galaad";
kjv[20] = "And the captivity of this host of the children of Israel [shall possess] that of the Canaanites, [even] unto Zarephath; and the captivity of Jerusalem, which [is] in Sepharad, shall possess the cities of the south.";
rsv[20] = "The exiles in Halah who are of the people of Israel shall possess Phoenicia as far as Zar\'ephath; and the exiles of Jerusalem who are in Sephar\'ad shall possess the cities of the Negeb.";
asv[20] = "And the captives of this host of the children of Israel, that are [among] the Canaanites, [shall possess] even unto Zarephath; and the captives of Jerusalem, that are in Sepharad, shall possess the cities of the South.";
yng[20] = "And the removed of this force of the sons of Israel, That [is with] the Canaanites unto Zarephat, And the removed of Jerusalem that [is] with the Sepharad, Possess the cities of the south.";
dby[20] = "and the captives of this host of the children of Israel [shall possess] what belonged to the Canaanites, unto Zarephath; and the captives of Jerusalem, who [were] in Sepharad, shall possess the cities of the south.";
web[20] = "And the captivity of this host of the children of Israel [shall possess] that of the Canaanites, [even] to Zarephath; and the captivity of Jerusalem, which [is] in Sepharad, shall possess the cities of the south.";
hnv[20] = " The captives of this host of the children of Yisra\'el, who are among the Kana`anim, will possess even to Tzarfat; and the captives of Yerushalayim, who are in Sefarad, will possess the cities of the Negev.";
vul[20] = "et transmigratio exercitus huius filiorum Israhel omnia Chananeorum usque ad Saraptham et transmigratio Hierusalem quae in Bosforo est possidebit civitates austri";
