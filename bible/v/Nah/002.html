csb[1] = "One who scatters is coming up against you. Man the fortifications! Watch the road! Brace yourself! Summon all your strength!";
csb[2] = "For the LORD will restore the majesty of Jacob, yes, the majesty of Israel, though ravagers have ravaged them and ruined their vine branches.";
csb[3] = "The shields of his warriors are dyed red; the valiant men are dressed in scarlet. The fittings of the chariot flash like fire on the day of its battle preparations, and the spears are brandished.";
csb[4] = "The chariots dash madly through the streets; they rush around in the plazas. They look like torches; they dart back and forth like lightning.";
csb[5] = "He gives orders to his officers; they stumble as they advance. They race to its wall; the protective shield is set in place.";
csb[6] = "The river gates are opened, and the palace erodes away.";
csb[7] = "Beauty is stripped; she is carried away; her ladies-in-waiting moan like the sound of doves and beat their breasts.";
csb[8] = "Nineveh has been like a pool of water from her first days, but they are fleeing. &quot;Stop! Stop! &quot; they cry, but no one turns back.";
csb[9] = "&quot;Plunder the silver! Plunder the gold! &quot; There is no end to the treasure, an abundance of every precious thing.";
csb[10] = "Desolation, decimation, devastation! Hearts melt, knees tremble, insides churn, every face grows pale!";
csb[11] = "Where is the lions\' lair, or the feeding ground of the young lions, where the lion and lioness prowled, and the lion\'s cub, with nothing to frighten them away?";
csb[12] = "The lion mauled whatever its cubs needed and strangled prey for its lionesses. It filled up its dens with the kill, and its lairs with mauled prey.";
csb[13] = "Beware, I am against you. This is the declaration of the LORD of Armies. I will make your chariots go up in smoke, and the sword will devour your young lions. I will cut off your prey from the earth, and the sound of your messengers will never be heard again.";
kjv[1] = "He that dasheth in pieces is come up before thy face: keep the munition, watch the way, make [thy] loins strong, fortify [thy] power mightily.";
rsv[1] = "The shatterer has come up against you. Man the ramparts; watch the road; gird your loins; collect all your strength.";
asv[1] = "He that dasheth in pieces is come up against thee: keep the fortress, watch the way, make thy loins strong, fortify thy power mightily.";
yng[1] = "Come up hath a scatterer to thy face, Keep the bulwark, watch the way, Strengthen the loins, strengthen power mightily.";
dby[1] = "He that dasheth in pieces is come up against thy face: keep the fortress, watch the way, make [thy] loins strong, fortify [thy] power mightily.";
web[1] = "He that dasheth in pieces is come up before thy face: keep the munition, watch the way, make [thy] loins strong, fortify [thy] power mightily.";
hnv[1] = "He who dashes in pieces has come up against you. Keep the fortress! Watch the way! Strengthen your loins! Fortify your power mightily!";
vul[1] = "ascendit qui dispergat coram te qui custodit obsidionem contemplare viam conforta lumbos robora virtutem valde";
kjv[2] = "For the LORD hath turned away the excellency of Jacob, as the excellency of Israel: for the emptiers have emptied them out, and marred their vine branches.";
rsv[2] = "(For the LORD is restoring the majesty of Jacob as the majesty of Israel, for plunderers have stripped them and ruined their branches.)";
asv[2] = "For Jehovah restoreth the excellency of Jacob, as the excellency of Israel; for the emptiers have emptied them out, and destroyed their vine-branches.";
yng[2] = "For turned back hath Jehovah to the excellency of Jacob, As [to] the excellency of Israel, For emptied them out have emptiers, And their branches they have marred.";
dby[2] = "For Jehovah hath brought again the glory of Jacob, as the glory of Israel; for the wasters have wasted them, and marred their vine-branches.";
web[2] = "For the LORD hath turned away the excellence of Jacob, as the excellence of Israel: for the emptiers have emptied them out, and marred their vine branches.";
hnv[2] = "For the LORD restores the excellency of Ya`akov, as the excellency of Yisra\'el; for the destroyers have destroyed them, and ruined their vine branches.";
vul[2] = "quia reddidit Dominus superbiam Iacob sicut superbiam Israhel quia vastatores dissipaverunt eos et propagines eorum corruperunt";
kjv[3] = "The shield of his mighty men is made red, the valiant men [are] in scarlet: the chariots [shall be] with flaming torches in the day of his preparation, and the fir trees shall be terribly shaken.";
rsv[3] = "The shield of his mighty men is red, his soldiers are clothed in scarlet. The chariots flash like flame when mustered in array; the chargers prance.";
asv[3] = "The shield of his mighty men is made red, the valiant men are in scarlet: the chariots flash with steel in the day of his preparation, and the cypress [spears] are brandished.";
yng[3] = "The shield of his mighty ones is become red, Men of might [are in] scarlet, With fiery torches [is] the chariot in a day of his preparation, And the firs have been caused to tremble.";
dby[3] = "The shield of his mighty men is made red, the valiant men are in scarlet: the chariots [glitter] with the sheen of steel, in the day of his preparation, and the spears are brandished.";
web[3] = "The shield of his mighty men is made red, the valiant men [are] in scarlet: the chariots [shall be] with flaming torches in the day of his preparation, and the fir-trees shall be terribly shaken.";
hnv[3] = "The shield of his mighty men is made red. The valiant men are in scarlet. The chariots flash with steel in the day of his preparation, and the pine spears are brandished.";
vul[3] = "clypeus fortium eius ignitus viri exercitus in coccineis igneae habenae currus in die praeparationis eius et agitatores consopiti sunt";
kjv[4] = "The chariots shall rage in the streets, they shall justle one against another in the broad ways: they shall seem like torches, they shall run like the lightnings.";
rsv[4] = "The chariots rage in the streets, they rush to and fro through the squares; they gleam like torches, they dart like lightning.";
asv[4] = "The chariots rage in the streets; they rush to and fro in the broad ways: the appearance of them is like torches; they run like the lightnings.";
yng[4] = "In out-places shine do the chariots, They go to and fro in broad places, Their appearances [are] like torches, As lightnings they run.";
dby[4] = "The chariots rush madly in the streets, they justle one against another in the broad ways: the appearance of them is like torches, they run like lightnings.";
web[4] = "The chariots shall rage in the streets, they shall jostle one against another in the broad ways: they shall seem like torches, they shall run like the lightnings.";
hnv[4] = " The chariots rage in the streets. They rush back and forth in the broad ways. Their appearance is like torches. They run like the lightnings.";
vul[4] = "in itineribus conturbati sunt quadrigae conlisae sunt in plateis aspectus eorum quasi lampades quasi fulgura discurrentia";
kjv[5] = "He shall recount his worthies: they shall stumble in their walk; they shall make haste to the wall thereof, and the defence shall be prepared.";
rsv[5] = "The officers are summoned, they stumble as they go, they hasten to the wall, the mantelet is set up.";
asv[5] = "He remembereth his nobles: they stumble in their march; they make haste to the wall thereof, and the mantelet is prepared.";
yng[5] = "He doth remember his honourable ones, They stumble in their goings, They hasten [to] its wall, and prepared is the covering.";
dby[5] = "He bethinketh him of his nobles: they stumble in their march; they make haste to the wall thereof, and the shelter is prepared.";
web[5] = "He shall recount his worthies: they shall stumble in their walk; they shall make haste to the wall thereof, and the defense shall be prepared.";
hnv[5] = "He summons his picked troops. They stumble on their way. They dash to its wall, and the protective shield is put in place.";
vul[5] = "recordabitur fortium suorum ruent in itineribus suis velociter ascendent muros eius et praeparabitur umbraculum";
kjv[6] = "The gates of the rivers shall be opened, and the palace shall be dissolved.";
rsv[6] = "The river gates are opened, the palace is in dismay;";
asv[6] = "The gates of the rivers are opened, and the palace is dissolved.";
yng[6] = "Gates of the rivers have been opened, And the palace is dissolved.";
dby[6] = "The gates of the rivers are opened, and the palace melteth away.";
web[6] = "The gates of the rivers shall be opened, and the palace shall be dissolved.";
hnv[6] = "The gates of the rivers are opened, and the palace is dissolved.";

kjv[7] = "And Huzzab shall be led away captive, she shall be brought up, and her maids shall lead [her] as with the voice of doves, tabering upon their breasts.";
rsv[7] = "its mistress is stripped, she is carried off, her maidens lamenting, moaning like doves, and beating their breasts.";

yng[7] = "And it is established -- she hath removed, She hath been brought up, And her handmaids are leading as the voice of doves, Tabering on their hearts.";

kjv[8] = "But Nineveh [is] of old like a pool of water: yet they shall flee away. Stand, stand, [shall they cry]; but none shall look back.";
rsv[8] = "Nin\'eveh is like a pool whose waters run away. &quot;Halt! Halt!&quot; they cry; but none turns back.";
asv[8] = "But Nineveh hath been from of old like a pool of water: yet they flee away. Stand, stand, [they cry]; but none looketh back.";
yng[8] = "And Nineveh [is] as a pool of waters, From of old it [is] -- and they are fleeing! `Stand ye, stand;\' and none is turning!";
dby[8] = "Nineveh hath been like a pool of water, since the day she existed, yet they flee away. ... Stand! Stand! But none looketh back.";
web[8] = "But Nineveh [is] of old like a pool of water: yet they shall flee away. Stand, stand, [shall they cry]; but none shall look back.";
hnv[8] = "But Nineveh has been from of old like a pool of water, yet they flee away. &quot;Stop! Stop!&quot; they cry, but no one looks back.";
vul[8] = "et Nineve quasi piscina aquarum aquae eius ipsi vero fugerunt state state et non est qui revertatur";

yng[9] = "Seize ye silver, seize ye gold, And there is no end to the prepared things, [To] the abundance of all desirable vessels.";
dby[9] = "Plunder the silver, plunder the gold; for there is no end of the splendid store of all precious vessels.";

kjv[10] = "She is empty, and void, and waste: and the heart melteth, and the knees smite together, and much pain [is] in all loins, and the faces of them all gather blackness.";
rsv[10] = "Desolate! Desolation and ruin! Hearts faint and knees tremble, anguish is on all loins, all faces grow pale!";
asv[10] = "She is empty, and void, and waste; and the heart melteth, and the knees smite together, and anguish is in all loins, and the faces of them all are waxed pale.";
yng[10] = "She is empty, yea, emptiness and waste, And the heart hath melted, And the knees have smitten together, And great pain [is] in all loins, And the faces of all of them have gathered paleness.";
dby[10] = "She is empty, and void, and waste; and the heart melteth, and the knees smite together, and writhing pain is in all loins, and all their faces grow pale.";
web[10] = "She is empty, and void, and waste: and the heart melteth, and the knees smite together, and much pain [is] in all loins, and the faces of them all gather blackness.";
hnv[10] = "She is empty, void, and waste. The heart melts, the knees knock together, their bodies and faces have grown pale.";

kjv[11] = "Where [is] the dwelling of the lions, and the feedingplace of the young lions, where the lion, [even] the old lion, walked, [and] the lion\'s whelp, and none made [them] afraid?";
rsv[11] = "Where is the lions\' den, the cave of the young lions, where the lion brought his prey, where his cubs were, with none to disturb?";
asv[11] = "Where is the den of the lions, and the feeding-place of the young lions, where the lion [and] the lioness walked, the lion\'s whelp, and none made them afraid?";
yng[11] = "Where [is] the habitation of lionesses? And a feeding-place it [is] for young lions Where walked hath a lion, an old lion, A lion\'s whelp, and there is none troubling.";
dby[11] = "Where is [now] the den of the lions, and the feeding-place of the young lions, where the lion, the lioness, [and] the lion\'s whelp walked, and none made them afraid?";
web[11] = "Where [is] the dwelling of the lions, and the feeding-place of the young lions, where the lion, [even] the old lion, walked, [and] the lion\'s whelp, and none made [them] afraid?";
hnv[11] = "Where is the den of the lions, and the feeding-place of the young lions, where the lion and the lioness walked, the lion\'s cubs, and no one made them afraid?";

dby[12] = "The lion tore in pieces enough for his whelps, and strangled for his lionesses, and filled his holes with prey, and his dens with ravin.";

kjv[13] = "Behold, I [am] against thee, saith the LORD of hosts, and I will burn her chariots in the smoke, and the sword shall devour thy young lions: and I will cut off thy prey from the earth, and the voice of thy messengers shall no more be heard.";
rsv[13] = "Behold, I am against you, says the LORD of hosts, and I will burn your chariots in smoke, and the sword shall devour your young lions; I will cut off your prey from the earth, and the voice of your messengers shall no more be heard.";

yng[13] = "Lo, I [am] against thee, An affirmation of Jehovah of Hosts, And I have burned in smoke its chariot, And thy young lions consume doth a sword, And I have cut off from the land thy prey, And not heard any more is the voice of thy messengers!";
