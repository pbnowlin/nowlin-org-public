csb[1] = "Woe to the city of blood, totally deceitful, full of plunder, never without prey.";
csb[2] = "The crack of the whip and rumble of the wheel, galloping horse and jolting chariot!";
csb[3] = "Charging horseman, flashing sword, shining spear; heaps of slain, mounds of corpses, dead bodies without end -- they stumble over their dead.";
csb[4] = "Because of the continual prostitution of the prostitute, the attractive mistress of sorcery, who treats nations and clans like merchandise by her prostitution and sorcery,";
csb[5] = "I am against you. This is the declaration of the LORD of Armies. I will lift your skirts over your face and display your nakedness to nations, your shame to kingdoms.";
csb[6] = "I will throw filth on you and treat you with contempt; I will make a spectacle of you.";
csb[7] = "Then all who see you will recoil from you, saying, &quot;Nineveh is devastated; who will show sympathy to her? &quot; Where can I find anyone to comfort you?";
csb[8] = "Are you better than Thebes that sat along the Nile with water surrounding her, whose rampart was the sea, the river her wall?";
csb[9] = "Cush and Egypt were her endless source of strength; Put and Libya were among her allies.";
csb[10] = "Yet she became an exile; she went into captivity. Her children were also dashed to pieces at the head of every street. They cast lots for her dignitaries, and all her nobles were bound in chains.";
csb[11] = "You also will become drunk; you will hide. You also will seek refuge from the enemy.";
csb[12] = "All your fortresses are fig trees with figs that ripened first; when shaken, they fall -- right into the mouth of the eater!";
csb[13] = "Look, your troops are like women among you; your land\'s city gates are wide open to your enemies. Fire will devour the bars of your gates.";
csb[14] = "Draw water for the siege; strengthen your fortresses. Step into the clay and tread the mortar; take hold of the brick-mold!";
csb[15] = "The fire will devour you there; the sword will cut you down. It will devour you like the young locust. Multiply yourselves like the young locust; multiply like the swarming locust!";
csb[16] = "You have made your merchants more numerous than the stars of the sky. The young locust strips the land and flies away.";
csb[17] = "Your court officials are like the swarming locust, and your scribes like clouds of locusts, which settle on the walls on a cold day; when the sun rises, they take off, and no one knows where they are.";
csb[18] = "King of Assyria, your shepherds slumber; your officers sleep. Your people are scattered across the mountains with no one to gather them together.";
csb[19] = "There is no remedy for your injury; your wound is severe. All who hear the news about you will clap their hands because of you, for who has not experienced your constant cruelty?";

yng[3] = "And the flame of a sword, and the lightning of a spear, And the abundance of the wounded, And the weight of carcases, Yea, there is no end to the bodies, They stumble over their bodies.";
