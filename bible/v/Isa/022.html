csb[1] = "A pronouncement concerning the Valley of Vision: What\'s the matter with you? Why have all of you gone up to the rooftops?";
csb[2] = "The noisy city, the jubilant town, is filled with celebration. Your dead did not die by the sword; they were not killed in battle.";
csb[3] = "All your rulers have fled together, captured without a bow. All your fugitives were captured together; they had fled far away.";
csb[4] = "Therefore I said, &quot;Look away from me! Let me weep bitterly! Do not try to comfort me about the destruction of my dear people.&quot;";
csb[5] = "For the Lord GOD of Armies had a day of tumult, trampling, and confusion in the Valley of Vision -- people shouting and crying to the mountains;";
csb[6] = "Elam took up a quiver with chariots and horsemen, and Kir uncovered the shield.";
csb[7] = "Your best valleys were full of chariots, and horsemen were positioned at the city gates.";
csb[8] = "He removed the defenses of Judah. On that day you looked to the weapons in the House of the Forest.";
csb[9] = "You saw that there were many breaches in the walls of the city of David. You collected water from the lower pool.";
csb[10] = "You counted the houses of Jerusalem so that you could tear them down to fortify the wall.";
csb[11] = "You made a reservoir between the walls for the water of the ancient pool, but you did not look to the one who made it, or consider the one who created it long ago.";
csb[12] = "On that day the Lord GOD of Armies called for weeping, for wailing, for shaven heads, and for the wearing of sackcloth.";
csb[13] = "But look: joy and gladness, butchering of cattle, slaughtering of sheep and goats, eating of meat, and drinking of wine -- &quot;Let us eat and drink, for tomorrow we die! &quot;";
csb[14] = "The LORD of Armies has directly revealed to me: &quot;This iniquity will not be wiped out for you people as long as you live.&quot; The Lord GOD of Armies has spoken.";
csb[15] = "The Lord GOD of Armies said: &quot;Go to Shebna, that steward who is in charge of the palace, and say to him:";
csb[16] = "&quot;What are you doing here? Who authorized you to carve out a tomb for yourself here, carving your tomb on the height and cutting a resting place for yourself out of rock?";
csb[17] = "&quot;Look, you strong man! The LORD is about to shake you violently. He will take hold of you,";
csb[18] = "&quot;wind you up into a ball, and sling you into a wide land. There you will die, and there your glorious chariots will be -- a disgrace to the house of your lord.";
csb[19] = "&quot;I will remove you from your office; you will be ousted from your position.";
csb[20] = "&quot;On that day I will call for my servant, Eliakim son of Hilkiah.";
csb[21] = "&quot;I will clothe him with your robe and tie your sash around him. I will hand your authority over to him, and he will be like a father to the inhabitants of Jerusalem and to the house of Judah.";
csb[22] = "&quot;I will place the key of the house of David on his shoulder; what he opens, no one can close; what he closes, no one can open.";
csb[23] = "&quot;I will drive him, like a peg, into a firm place. He will be a throne of honor for his father\'s family.";
csb[24] = "&quot;They will hang on him all the glory of his father\'s family: the descendants and the offshoots -- all the small vessels, from bowls to every kind of jar.";
csb[25] = "&quot;On that day&quot; -- the declaration of the LORD of Armies -- &quot;the peg that was driven into a firm place will give way, be cut off, and fall, and the load on it will be destroyed.&quot; Indeed, the LORD has spoken.";
