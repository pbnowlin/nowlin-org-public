csb[1] = "&quot;This is my servant; I strengthen him, this is my chosen one; I delight in him. I have put my Spirit on him; he will bring justice to the nations.";
csb[2] = "&quot;He will not cry out or shout or make his voice heard in the streets.";
csb[3] = "&quot;He will not break a bruised reed, and he will not put out a smoldering wick; he will faithfully bring justice.";
csb[4] = "&quot;He will not grow weak or be discouraged until he has established justice on earth. The coasts and islands will wait for his instruction.&quot;";
csb[5] = "This is what God, the LORD, says -- who created the heavens and stretched them out, who spread out the earth and what comes from it, who gives breath to the people on it and spirit to those who walk on it --";
csb[6] = "&quot;I am the LORD. I have called you for a righteous purpose, and I will hold you by your hand. I will watch over you, and I will appoint you to be a covenant for the people and a light to the nations,";
csb[7] = "&quot;in order to open blind eyes, to bring out prisoners from the dungeon, and those sitting in darkness from the prison house.";
csb[8] = "&quot;I am the LORD. That is my name, and I will not give my glory to another or my praise to idols.";
csb[9] = "&quot;The past events have indeed happened. Now I declare new events; I announce them to you before they occur.&quot;";
csb[10] = "Sing a new song to the LORD; sing his praise from the ends of the earth, you who go down to the sea with all that fills it, you coasts and islands with your inhabitants.";
csb[11] = "Let the desert and its cities shout, the settlements where Kedar dwells cry aloud. Let the inhabitants of Sela sing for joy; let them cry out from the mountaintops.";
csb[12] = "Let them give glory to the LORD and declare his praise in the coasts and islands.";
csb[13] = "The LORD advances like a warrior; he stirs up his zeal like a soldier. He shouts, he roars aloud, he prevails over his enemies.";
csb[14] = "&quot;I have kept silent from ages past; I have been quiet and restrained myself. But now, I will groan like a woman in labor, gasping breathlessly.";
csb[15] = "&quot;I will lay waste mountains and hills and dry up all their vegetation. I will turn rivers into islands and dry up marshes.";
csb[16] = "&quot;I will lead the blind by a way they did not know; I will guide them on paths they have not known. I will turn darkness to light in front of them and rough places into level ground. This is what I will do for them, and I will not abandon them.";
csb[17] = "&quot;They will be turned back and utterly ashamed -- those who trust in an idol and say to a cast image, \'You are our gods! \'";
csb[18] = "&quot;Listen, you deaf! Look, you blind, so that you may see.";
csb[19] = "&quot;Who is blind but my servant, or deaf like my messenger I am sending? Who is blind like my dedicated one, or blind like the servant of the LORD?";
csb[20] = "&quot;Though seeing many things, you pay no attention. Though his ears are open, he does not listen.&quot;";
csb[21] = "Because of his righteousness, the LORD was pleased to magnify his instruction and make it glorious.";
csb[22] = "But this is a people plundered and looted, all of them trapped in holes or imprisoned in dungeons. They have become plunder with no one to rescue them and loot, with no one saying, &quot;Give it back! &quot;";
csb[23] = "Who among you will hear this? Let him listen and obey in the future.";
csb[24] = "Who gave Jacob to the robber, and Israel to the plunderers? Was it not the LORD? Have we not sinned against him? They were not willing to walk in his ways, and they would not listen to his instruction.";
csb[25] = "So he poured out his furious anger and the power of war on Jacob. It surrounded him with fire, but he did not know it; it burned him, but he didn\'t take it to heart.";

kjv[21] = "The LORD is well pleased for his righteousness\' sake; he will magnify the law, and make [it] honourable.";
rsv[21] = "The LORD was pleased, for his righteousness\' sake, to magnify his law and make it glorious.";
asv[21] = "It pleased Jehovah, for his righteousness\' sake, to magnify the law, and make it honorable.";
yng[21] = "Jehovah hath delight for the sake of His righteousness, He magnifieth law, and maketh honourable.";
dby[21] = "Jehovah had delight [in him] for his righteousness\' sake: he hath magnified the law, and made it honourable.";
web[21] = "The LORD is well pleased for his righteousness\' sake; he will magnify the law, and make [it] honorable.";
hnv[21] = "It pleased the LORD, for his righteousness\' sake, to magnify the law, and make it honorable.";
vul[21] = "et Dominus voluit ut sanctificaret eum et magnificaret legem et extolleret";
kjv[22] = "But this [is] a people robbed and spoiled; [they are] all of them snared in holes, and they are hid in prison houses: they are for a prey, and none delivereth; for a spoil, and none saith, Restore.";
rsv[22] = "But this is a people robbed and plundered, they are all of them trapped in holes and hidden in prisons; they have become a prey with none to rescue, a spoil with none to say, &quot;Restore!&quot;";
asv[22] = "But this is a people robbed and plundered; they are all of them snared in holes, and they are hid in prison-houses: they are for a prey, and none delivereth; for a spoil, and none saith, Restore.";
yng[22] = "And this [is] a people seized and spoiled, Snared in holes -- all of them, And in houses of restraint they were hidden, They have been for a prey, And there is no deliverer, A spoil, and none is saying, `Restore.\'";
dby[22] = "But this is a people robbed and spoiled; they are all of them snared in holes, and hidden in prison-houses; they are become a prey, and none delivereth, -- a spoil, and none saith, Restore.";
web[22] = "But this [is] a people robbed and pillaged; [they are] all of them snared in holes, and they are hid in prison-houses; they are for a prey, and none delivereth; for a spoil, and none saith, Restore.";
hnv[22] = "But this is a people robbed and plundered; they are all of them snared in holes, and they are hid in prison-houses: they are for a prey, and none delivers; for a spoil, and none says, Restore.";
vul[22] = "ipse autem populus direptus et vastatus laqueus iuvenum omnes et in domibus carcerum absconditi sunt facti sunt in rapinam nec est qui eruat in direptionem et non est qui dicat redde";
kjv[23] = "Who among you will give ear to this? [who] will hearken and hear for the time to come?";
rsv[23] = "Who among you will give ear to this, will attend and listen for the time to come?";
asv[23] = "Who is there among you that will give ear to this? that will hearken and hear for the time to come?";
yng[23] = "Who among you giveth ear [to] this? Attendeth, and heareth afterwards.";
dby[23] = "Who among you will give ear to this, [who] will hearken and hear what is to come?";
web[23] = "Who among you will give ear to this? [who] will hearken, and hear for the time to come?";
hnv[23] = " Who is there among you who will give ear to this? who will listen and hear for the time to come?";
vul[23] = "quis est in vobis qui audiat hoc adtendat et auscultet futura";
kjv[24] = "Who gave Jacob for a spoil, and Israel to the robbers? did not the LORD, he against whom we have sinned? for they would not walk in his ways, neither were they obedient unto his law.";
rsv[24] = "Who gave up Jacob to the spoiler, and Israel to the robbers? Was it not the LORD, against whom we have sinned, in whose ways they would not walk, and whose law they would not obey?";
asv[24] = "Who gave Jacob for a spoil, and Israel to the robbers? did not Jehovah? he against whom we have sinned, and in whose ways they would not walk, neither were they obedient unto his law.";
yng[24] = "Who hath given Jacob for a spoil, And Israel to the spoilers? Is it not Jehovah -- He against whom we sinned? Yea, they have not been willing in His ways to walk, Nor have they hearkened to His law.";
dby[24] = "Who gave Jacob for a spoil, and Israel to the robbers? Did not Jehovah, he against whom we have sinned? And they would not walk in his ways, neither did they hearken unto his law.";
web[24] = "Who gave Jacob for a spoil, and Israel to the robbers? did not the LORD, he against whom we have sinned? for they would not walk in his ways, neither were they obedient to his law.";
hnv[24] = "Who gave Ya`akov for a spoil, and Yisra\'el to the robbers? Didn\'t the LORD? he against whom we have sinned, and in whose ways they would not walk, neither were they obedient to his law.";
vul[24] = "quis dedit in direptionem Iacob et Israhel vastantibus nonne Dominus ipse cui peccavimus et noluerunt in viis eius ambulare et non audierunt legem eius";
kjv[25] = "Therefore he hath poured upon him the fury of his anger, and the strength of battle: and it hath set him on fire round about, yet he knew not; and it burned him, yet he laid [it] not to heart.";
rsv[25] = "So he poured upon him the heat of his anger and the might of battle; it set him on fire round about, but he did not understand; it burned him, but he did not take it to heart.";
asv[25] = "Therefore he poured upon him the fierceness of his anger, and the strength of battle; and it set him on fire round about, yet he knew not; and it burned him, yet he laid it not to heart.";
yng[25] = "And He poureth on him fury, His anger, and the strength of battle, And it setteth him on fire round about, And he hath not known, And it burneth against him, and he layeth it not to heart!";
dby[25] = "And he hath poured upon him the fury of his anger, and the strength of battle: and it set him on fire round about, yet he knew not; and it burned him, yet he took it not to heart.";
web[25] = "Therefore he hath poured upon him the fury of his anger, and the strength of battle: and it hath set him on fire around, yet he knew not; and it burned him, yet he laid [it] not to heart.";
hnv[25] = "Therefore he poured on him the fierceness of his anger, and the strength of battle; and it set him on fire round about, yet he didn\'t know; and it burned him, yet he didn\'t lay it to heart.";
vul[25] = "et effudit super eum indignationem furoris sui et forte bellum et conbusit eum in circuitu et non cognovit et succendit eum et non intellexit";
