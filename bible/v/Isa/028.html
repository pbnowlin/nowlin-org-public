csb[1] = "Woe to the majestic crown of Ephraim\'s drunkards, and to the fading flower of its beautiful splendor, which is on the summit above the rich valley. Woe to those overcome with wine.";
csb[2] = "Look, the Lord has a strong and mighty one -- like a devastating hail storm, like a storm with strong flooding water. He will bring it across the land with his hand.";
csb[3] = "The majestic crown of Ephraim\'s drunkards will be trampled underfoot.";
csb[4] = "The fading flower of his beautiful splendor, which is on the summit above the rich valley, will be like a ripe fig before the summer harvest. Whoever sees it will swallow it while it is still in his hand.";
csb[5] = "On that day the LORD of Armies will become a crown of beauty and a diadem of splendor to the remnant of his people,";
csb[6] = "a spirit of justice to the one who sits in judgment, and strength to those who repel attacks at the city gate.";
csb[7] = "Even these stagger because of wine and stumble under the influence of beer: priest and prophet stagger because of beer, they are confused by wine. They stumble because of beer, they are muddled in their visions, they stumble in their judgments.";
csb[8] = "Indeed, all their tables are covered with vomit; there is no place without a stench.";
csb[9] = "Who is he trying to teach? Who is he trying to instruct? Infants just weaned from milk? Babies removed from the breast?";
csb[10] = "&quot;Law after law, law after law, line after line, line after line, a little here, a little there.&quot;";
csb[11] = "For he will speak to this people with stammering speech and in a foreign language.";
csb[12] = "He had said to them: &quot;This is the place of rest; let the weary rest; this is the place of repose.&quot; But they would not listen.";
csb[13] = "The word of the LORD will come to them: &quot;Law after law, law after law, line after line, line after line, a little here, a little there,&quot; so they go stumbling backward, to be broken, trapped, and captured.";
csb[14] = "Therefore hear the word of the LORD, you scoffers who rule this people in Jerusalem.";
csb[15] = "For you said, &quot;We have made a covenant with Death, and we have an agreement with Sheol; when the overwhelming catastrophe passes through, it will not touch us, because we have made falsehood our refuge and have hidden behind treachery.&quot;";
csb[16] = "Therefore the Lord GOD said: &quot;Look, I have laid a stone in Zion, a tested stone, a precious cornerstone, a sure foundation; the one who believes will be unshakable.";
csb[17] = "&quot;And I will make justice the measuring line and righteousness the mason\'s level.&quot; Hail will sweep away the false refuge, and water will flood your hiding place.";
csb[18] = "Your covenant with Death will be dissolved, and your agreement with Sheol will not last. When the overwhelming catastrophe passes through, you will be trampled.";
csb[19] = "Every time it passes through, it will carry you away; it will pass through every morning -- every day and every night. Only terror will cause you to understand the message.";
csb[20] = "Indeed, the bed is too short to stretch out on, and its cover too small to wrap up in.";
csb[21] = "For the LORD will rise up as he did at Mount Perazim. He will rise in wrath, as at the Valley of Gibeon, to do his work, his unexpected work, and to perform his task, his unfamiliar task.";
csb[22] = "So now, do not scoff, or your shackles will become stronger. Indeed, I have heard from the Lord GOD of Armies a decree of destruction for the whole land.";
csb[23] = "Listen and hear my voice. Pay attention and hear what I say.";
csb[24] = "Does the plowman plow every day to plant seed? Does he continuously break up and cultivate the soil?";
csb[25] = "When he has leveled its surface, does he not then scatter black cumin and sow cumin? He plants wheat in rows and barley in plots, with spelt as their border.";
csb[26] = "His God teaches him order; he instructs him.";
csb[27] = "Certainly black cumin is not threshed with a threshing board, and a cart wheel is not rolled over the cumin. But black cumin is beaten out with a stick, and cumin with a rod.";
csb[28] = "Bread grain is crushed, but is not threshed endlessly. Though the wheel of the farmer\'s cart rumbles, his horses do not crush it.";
csb[29] = "This also comes from the LORD of Armies. He gives wondrous advice; he gives great wisdom.";

vul[18] = "et delebitur foedus vestrum cum morte et pactum vestrum cum inferno non stabit flagellum inundans cum transierit eritis ei in conculcationem";
kjv[19] = "From the time that it goeth forth it shall take you: for morning by morning shall it pass over, by day and by night: and it shall be a vexation only [to] understand the report.";
rsv[19] = "As often as it passes through it will take you; for morning by morning it will pass through, by day and by night; and it will be sheer terror to understand the message.";
asv[19] = "As often as it passeth through, it shall take you; for morning by morning shall it pass through, by day and by night: and it shall be nought but terror to understand the message.";
yng[19] = "From the fulness of its passing over it taketh you, For morning by morning it passeth over, By day and by night, And it hath been only a trembling to consider the report.";
dby[19] = "As it passeth through it shall take you; for morning by morning shall it pass through, by day and by night; and it shall be terror only to understand the report.";
web[19] = "From the time that it goeth forth it shall take you: for morning by morning shall it pass over, by day and by night: and it shall be a vexation only [to] understand the report.";
hnv[19] = "As often as it passes though, it shall take you; for morning by morning shall it pass through, by day and by night: and it shall be nothing but terror to understand the message.";
vul[19] = "quandocumque pertransierit tollet vos quoniam mane diluculo pertransibit in die et in nocte et tantummodo sola vexatio intellectum dabit auditui";
kjv[20] = "For the bed is shorter than that [a man] can stretch himself [on it]: and the covering narrower than that he can wrap himself [in it].";
rsv[20] = "For the bed is too short to stretch oneself on it, and the covering too narrow to wrap oneself in it.";
asv[20] = "For the bed is shorter than that a man can stretch himself on it; and the covering narrower than that he can wrap himself in it.";
yng[20] = "For shorter hath been the bed Than to stretch one\'s self out in, And the covering hath been narrower Than to wrap one\'s self up in.";
dby[20] = "For the bed is too short to stretch oneself on, and the covering too narrow when he would wrap himself in it.";
web[20] = "For the bed is shorter than that [a man] can stretch himself [on it]: and the covering narrower than that he can wrap himself [in it].";
hnv[20] = "For the bed is shorter than that a man can stretch himself on it; and the covering narrower than that he can wrap himself in it.";
vul[20] = "coangustatum est enim stratum ita ut alter decidat et pallium breve utrumque operire non potest";
kjv[21] = "For the LORD shall rise up as [in] mount Perazim, he shall be wroth as [in] the valley of Gibeon, that he may do his work, his strange work; and bring to pass his act, his strange act.";
rsv[21] = "For the LORD will rise up as on Mount Pera\'zim, he will be wroth as in the valley of Gibeon; to do his deed--strange is his deed! and to work his work--alien is his work!";
asv[21] = "For Jehovah will rise up as in mount Perazim, he will be wroth as in the valley of Gibeon; that he may do his work, his strange work, and bring to pass his act, his strange act.";
yng[21] = "For as [at] mount Perazim rise doth Jehovah, As [at] the valley in Gibeon He is troubled, To do His work -- strange [is] His work, And to do His deed -- strange [is] His deed.\'";
dby[21] = "For Jehovah will rise up as on mount Perazim, he will be moved with anger as in the valley of Gibeon; that he may do his work, his strange work, and perform his act, his unwonted act.";
web[21] = "For the LORD will rise as [on] mount Perazim, he will be wroth as [in] the valley of Gibeon, that he may do his work, his strange work; and bring to pass his act, his strange act.";
hnv[21] = "For the LORD will rise up as on Mount Perazim, he will be angry as in the valley of Giv`on; that he may do his work, his strange work, and bring to pass his act, his strange act.";
vul[21] = "sicut enim in monte Divisionum stabit Dominus sicut in valle quae est in Gabao irascetur ut faciat opus suum alienum opus eius ut operetur opus suum peregrinum est opus ab eo";
kjv[22] = "Now therefore be ye not mockers, lest your bands be made strong: for I have heard from the Lord GOD of hosts a consumption, even determined upon the whole earth.";
rsv[22] = "Now therefore do not scoff, lest your bonds be made strong; for I have heard a decree of destruction from the Lord GOD of hosts upon the whole land.";
asv[22] = "Now therefore be ye not scoffers, lest your bonds be made strong; for a decree of destruction have I heard from the Lord, Jehovah of hosts, upon the whole earth.";
yng[22] = "And now, show not yourselves scorners, Lest strong be your bands, For a consumption, that is determined, I have heard, by the Lord, Jehovah of Hosts, [Is] for all the land.";
dby[22] = "Now therefore be ye not scorners, lest your bonds be made strong; for I have heard from the Lord Jehovah of hosts a consumption, and [one] determined, upon the whole land.";
web[22] = "Now therefore be ye not mockers, lest your bands be made strong: for I have heard from the Lord GOD of hosts a consumption, even determined upon the whole earth.";
hnv[22] = "Now therefore don\'t you be scoffers, lest your bonds be made strong; for a decree of destruction have I heard from the Lord, the LORD of Hosts, on the whole eretz.";
vul[22] = "et nunc nolite inludere ne forte constringantur vincula vestra consummationem enim et adbreviationem audivi a Domino Deo exercituum super universam terram";
kjv[23] = "Give ye ear, and hear my voice; hearken, and hear my speech.";
rsv[23] = "Give ear, and hear my voice; hearken, and hear my speech.";
asv[23] = "Give ye ear, and hear my voice; hearken, and hear my speech.";
yng[23] = "Give ear, and hear my voice, Attend, and hear my saying:";
dby[23] = "Give ear, and hear my voice; hearken, and hear my speech.";
web[23] = "Give ye ear, and hear my voice; hearken, and hear my speech.";
hnv[23] = "Give you ear, and hear my voice; listen, and hear my speech.";
vul[23] = "auribus percipite et audite vocem meam adtendite et audite eloquium meum";
kjv[24] = "Doth the plowman plow all day to sow? doth he open and break the clods of his ground?";
rsv[24] = "Does he who plows for sowing plow continually? does he continually open and harrow his ground?";
asv[24] = "Doth he that ploweth to sow plow continually? doth he [continually] open and harrow his ground?";
yng[24] = "The whole day plougheth the ploughman to sow? He openeth and harroweth his ground!";
dby[24] = "Doth the ploughman plough all day to sow? Is he [all day] opening and breaking the clods of his land?";
web[24] = "Doth the plowman plow all day to sow? doth he open and break the clods of his ground?";
hnv[24] = "Does he who plows to sow plow continually? does he [continually] open and harrow his ground?";
vul[24] = "numquid tota die arabit arans ut serat proscindet et sariet humum suam";
kjv[25] = "When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place?";
rsv[25] = "When he has leveled its surface, does he not scatter dill, sow cummin, and put in wheat in rows and barley in its proper place, and spelt as the border?";
asv[25] = "When he hath levelled the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and put in the wheat in rows, and the barley in the appointed place, and the spelt in the border thereof?";
yng[25] = "Hath he not, if he have made level its face, Then scattered fitches, and cummin sprinkle, And hath placed the principal wheat, And the appointed barley, And the rie [in] its own border?";
dby[25] = "Doth he not, when he hath levelled the face thereof, cast abroad dill, and scatter cummin, and set the wheat in rows, and the barley in an appointed place, and the rye in its border?";
web[25] = "When he hath made even the face of it, doth he not cast abroad the vetches, and scatter the cummin, and cast in the principal wheat, and the appointed barley, and the rye in their place?";
hnv[25] = "When he has leveled the surface of it, doesn\'t he cast abroad the dill, and scatter the cumin, and put in the wheat in rows, and the barley in the appointed place, and the spelt in the border of it?";
vul[25] = "nonne cum adaequaverit faciem eius seret gith et cyminum sparget et ponet triticum per ordinem et hordeum et milium et viciam in finibus suis";
kjv[26] = "For his God doth instruct him to discretion, [and] doth teach him.";
rsv[26] = "For he is instructed aright; his God teaches him.";
asv[26] = "For his God doth instruct him aright, [and] doth teach him.";
yng[26] = "And instruct him for judgment doth his God, He doth direct him.";
dby[26] = "His God doth instruct him in [his] judgment, he doth teach him.";
web[26] = "For his God doth instruct him to discretion, [and] doth teach him.";
hnv[26] = "For his God does instruct him aright, [and] does teach him.";
vul[26] = "et erudiet eum illud in iudicio Deus suus docebit eum illud";
kjv[27] = "For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod.";
rsv[27] = "Dill is not threshed with a threshing sledge, nor is a cart wheel rolled over cummin; but dill is beaten out with a stick, and cummin with a rod.";
asv[27] = "For the fitches are not threshed with a sharp [threshing] instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod.";
yng[27] = "For not with a sharp-pointed thing threshed are fitches, And the wheel of a cart on cummin turned round, For with a staff beaten out are fitches, And cummin with a rod.";
dby[27] = "For the dill is not threshed with a threshing instrument, neither is a cart-wheel turned about upon the cummin; but dill is beaten out with a staff, and cummin with a rod.";
web[27] = "For the vetches are not threshed with a threshing instrument, neither is a cart-wheel turned about upon the cummin; but the vetches are beaten out with a staff, and the cummin with a rod.";
hnv[27] = "For the dill are not threshed with a sharp [threshing] instrument, neither is a cart wheel turned about on the cumin; but the dill are beaten out with a staff, and the cumin with a rod.";
vul[27] = "non enim in serris triturabitur gith nec rota plaustri super cyminum circumiet sed in virga excutietur gith et cyminum in baculo";
kjv[28] = "Bread [corn] is bruised; because he will not ever be threshing it, nor break [it with] the wheel of his cart, nor bruise it [with] his horsemen.";
rsv[28] = "Does one crush bread grain? No, he does not thresh it for ever; when he drives his cart wheel over it with his horses, he does not crush it.";
asv[28] = "Bread [grain] is ground; for he will not be always threshing it: and though the wheel of his cart and his horses scatter it, he doth not grind it.";
yng[28] = "Bread-[corn] is beaten small, For not for ever doth he sorely thresh it, Nor crushed [it] hath a wheel of his cart, Nor do his hoofs beat it small.";
dby[28] = "Bread [corn] is crushed, because he will not ever be threshing it; and if he drove the wheels of his cart and his horses [over it], he would not crush it.";
web[28] = "Bread-[corn] is bruised; because he will not always be threshing it, nor break [it with] the wheel of his cart, nor bruise it [with] his horsemen.";
hnv[28] = "Bread [grain] is ground; for he will not be always threshing it: and though the wheel of his cart and his horses scatter it, he does not grind it.";
vul[28] = "panis autem comminuetur verum non in perpetuum triturans triturabit illum neque vexabit eum rota plaustri nec in ungulis suis comminuet eum";
kjv[29] = "This also cometh forth from the LORD of hosts, [which] is wonderful in counsel, [and] excellent in working.";
rsv[29] = "This also comes from the LORD of hosts; he is wonderful in counsel, and excellent in wisdom.";
asv[29] = "This also cometh forth from Jehovah of hosts, who is wonderful in counsel, and excellent in wisdom.";
yng[29] = "Even this from Jehovah of Hosts hath gone out, He hath made counsel wonderful, He hath made wisdom great!";
dby[29] = "This also cometh forth from Jehovah of hosts; he is wonderful in counsel, great in wisdom.";
web[29] = "This also cometh forth from the LORD of hosts, [who] is wonderful in counsel, [and] excellent in operation.";
hnv[29] = "This also comes forth from the LORD of Hosts, who is wonderful in counsel, and excellent in wisdom.";
