csb[1] = "A pronouncement concerning Egypt: Look, the LORD rides on a swift cloud and is coming to Egypt. Egypt\'s idols will tremble before him, and Egypt will lose heart.";
csb[2] = "I will provoke Egyptians against Egyptians; each will fight against his brother and each against his friend, city against city, kingdom against kingdom.";
csb[3] = "Egypt\'s spirit will be disturbed within it, and I will frustrate its plans. Then they will inquire of idols, ghosts, and spiritists.";
csb[4] = "I will hand over Egypt to harsh masters, and a strong king will rule it. This is the declaration of the Lord GOD of Armies.";
csb[5] = "The water of the sea will dry up, and the river will be parched and dry.";
csb[6] = "The channels will stink; they will dwindle, and Egypt\'s canals will be parched. Reed and rush will wilt.";
csb[7] = "The reeds by the Nile, by the mouth of the river, and all the cultivated areas of the Nile will wither, blow away, and vanish.";
csb[8] = "Then the fishermen will mourn. All those who cast hooks into the Nile will lament, and those who spread nets on the water will give up.";
csb[9] = "Those who work with flax will be dismayed; those combing it and weaving linen will turn pale.";
csb[10] = "Egypt\'s weavers will be dejected; all her wage earners will be demoralized.";
csb[11] = "The princes of Zoan are complete fools; Pharaoh\'s wisest advisers give stupid advice! How can you say to Pharaoh, &quot;I am one of the wise, a student of eastern kings&quot;?";
csb[12] = "Where then are your wise men? Let them tell you and reveal what the LORD of Armies has planned against Egypt.";
csb[13] = "The princes of Zoan have been fools; the princes of Memphis are deceived. Her tribal chieftains have led Egypt astray.";
csb[14] = "The LORD has mixed within her a spirit of confusion. The leaders have made Egypt stagger in all she does, as a drunkard staggers in his vomit.";
csb[15] = "No head or tail, palm or reed, will be able to do anything for Egypt.";
csb[16] = "On that day Egypt will be like women and will tremble with fear because of the threatening hand of the LORD of Armies when he raises it against them.";
csb[17] = "The land of Judah will terrify Egypt; whenever Judah is mentioned, Egypt will tremble because of what the LORD of Armies has planned against it.";
csb[18] = "On that day five cities in the land of Egypt will speak the language of Canaan and swear loyalty to the LORD of Armies. One of the cities will be called the City of the Sun.";
csb[19] = "On that day there will be an altar to the LORD in the center of the land of Egypt and a pillar to the LORD near her border.";
csb[20] = "It will be a sign and witness to the LORD of Armies in the land of Egypt. When they cry out to the LORD because of their oppressors, he will send them a savior and leader, and he will rescue them.";
csb[21] = "The LORD will make himself known to Egypt, and Egypt will know the LORD on that day. They will offer sacrifices and offerings; they will make vows to the LORD and fulfill them.";
csb[22] = "The LORD will strike Egypt, striking and healing. Then they will turn to the LORD and he will be receptive to their prayers and heal them.";
csb[23] = "On that day there will be a highway from Egypt to Assyria. Assyria will go to Egypt, Egypt to Assyria, and Egypt will worship with Assyria.";
csb[24] = "On that day Israel will form a triple alliance with Egypt and Assyria -- a blessing within the land.";
csb[25] = "The LORD of Armies will bless them, saying, &quot;Egypt my people, Assyria my handiwork, and Israel my inheritance are blessed.&quot;";
