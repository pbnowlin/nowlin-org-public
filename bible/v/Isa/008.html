csb[1] = "Then the LORD said to me, &quot;Take a large piece of parchment and write on it with an ordinary pen: Maher-shalal-hash-baz.";
csb[2] = "&quot;I have appointed trustworthy witnesses -- the priest Uriah and Zechariah son of Jeberechiah.&quot;";
csb[3] = "I was then intimate with the prophetess, and she conceived and gave birth to a son. The LORD said to me, &quot;Name him Maher-shalal-hash-baz,";
csb[4] = "&quot;for before the boy knows how to call \'Father,\' or \'Mother,\' the wealth of Damascus and the spoils of Samaria will be carried off to the king of Assyria.&quot;";
csb[5] = "The LORD spoke to me again:";
csb[6] = "Because these people rejected the slowly flowing water of Shiloah and rejoiced with Rezin and the son of Remaliah,";
csb[7] = "the Lord will certainly bring against them the mighty rushing water of the Euphrates River -- the king of Assyria and all his glory. It will overflow its channels and spill over all its banks.";
csb[8] = "It will pour into Judah, flood over it, and sweep through, reaching up to the neck; and its flooded banks will fill your entire land, Immanuel!";
csb[9] = "Band together, peoples, and be broken; pay attention, all you distant lands; prepare for war, and be broken; prepare for war, and be broken.";
csb[10] = "Devise a plan; it will fail. Make a prediction; it will not happen. For God is with us.";
csb[11] = "For this is what the LORD said to me with great power, to keep me from going the way of this people:";
csb[12] = "Do not call everything a conspiracy these people say is a conspiracy. Do not fear what they fear; do not be terrified.";
csb[13] = "You are to regard only the LORD of Armies as holy. Only he should be feared; only he should be held in awe.";
csb[14] = "He will be a sanctuary; but for the two houses of Israel, he will be a stone to stumble over and a rock to trip over, and a trap and a snare to the inhabitants of Jerusalem.";
csb[15] = "Many will stumble over these; they will fall and be broken; they will be snared and captured.";
csb[16] = "Bind up the testimony. Seal up the instruction among my disciples.";
csb[17] = "I will wait for the LORD, who is hiding his face from the house of Jacob. I will wait for him.";
csb[18] = "Here I am with the children the LORD has given me to be signs and wonders in Israel from the LORD of Armies who dwells on Mount Zion.";
csb[19] = "When they say to you, &quot;Inquire of the mediums and the spiritists who chirp and mutter,&quot; shouldn\'t a people inquire of their God? Should they inquire of the dead on behalf of the living?";
csb[20] = "Go to God\'s instruction and testimony! If they do not speak according to this word, there will be no dawn for them.";
csb[21] = "They will wander through the land, dejected and hungry. When they are famished, they will become enraged, and, looking upward, will curse their king and their God.";
csb[22] = "They will look toward the earth and see only distress, darkness, and the gloom of affliction, and they will be driven into thick darkness.";
