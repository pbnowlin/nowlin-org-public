csb[1] = "I will not keep silent because of Zion, and I will not keep still because of Jerusalem, until her righteousness shines like a bright light and her salvation, like a flaming torch.";
csb[2] = "Nations will see your righteousness and all kings, your glory. You will be given a new name that the LORD\'s mouth will announce.";
csb[3] = "You will be a glorious crown in the LORD\'s hand, and a royal diadem in the palm of your God\'s hand.";
csb[4] = "You will no longer be called Deserted, and your land will not be called Desolate; instead, you will be called My Delight Is in Her, and your land Married; for the LORD delights in you, and your land will be married.";
csb[5] = "For as a young man marries a young woman, so your sons will marry you; and as a groom rejoices over his bride, so your God will rejoice over you.";
csb[6] = "Jerusalem, I have appointed watchmen on your walls; they will never be silent, day or night. There is no rest for you, who remind the LORD.";
csb[7] = "Do not give him rest until he establishes and makes Jerusalem the praise of the earth.";
csb[8] = "The LORD has sworn with his right hand and his strong arm: I will no longer give your grain to your enemies for food, and foreigners will not drink the new wine for which you have labored.";
csb[9] = "For those who gather grain will eat it and praise the LORD, and those who harvest the grapes will drink the wine in my holy courts.";
csb[10] = "Go out, go out through the city gates; prepare a way for the people! Build it up, build up the highway; clear away the stones! Raise a banner for the peoples.";
csb[11] = "Look, the LORD has proclaimed to the ends of the earth, &quot;Say to Daughter Zion: Look, your salvation is coming, his wages are with him, and his reward accompanies him.&quot;";
csb[12] = "And they will be called the Holy People, the LORD\'s Redeemed; and you will be called Cared For, A City Not Deserted.";
kjv[1] = "For Zion\'s sake will I not hold my peace, and for Jerusalem\'s sake I will not rest, until the righteousness thereof go forth as brightness, and the salvation thereof as a lamp [that] burneth.";
