csb[1] = "The Spirit of the Lord GOD is on me, because the LORD has anointed me to bring good news to the poor. He has sent me to heal the brokenhearted, to proclaim liberty to the captives and freedom to the prisoners;";
csb[2] = "to proclaim the year of the LORD\'s favor, and the day of our God\'s vengeance; to comfort all who mourn,";
csb[3] = "to provide for those who mourn in Zion; to give them a crown of beauty instead of ashes, festive oil instead of mourning, and splendid clothes instead of despair. And they will be called righteous trees, planted by the LORD to glorify him.";
csb[4] = "They will rebuild the ancient ruins; they will restore the former devastations; they will renew the ruined cities, the devastations of many generations.";
csb[5] = "Strangers will stand and feed your flocks, and foreigners will be your plowmen and vinedressers.";
csb[6] = "But you will be called the LORD\'s priests; they will speak of you as ministers of our God; you will eat the wealth of the nations, and you will boast in their riches.";
csb[7] = "In place of your shame, you will have a double portion; in place of disgrace, they will rejoice over their share. So they will possess double in their land, and eternal joy will be theirs.";
csb[8] = "For I the LORD love justice; I hate robbery and injustice; I will faithfully reward my people and make a permanent covenant with them.";
csb[9] = "Their descendants will be known among the nations, and their posterity among the peoples. All who see them will recognize that they are a people the LORD has blessed.";
csb[10] = "I rejoice greatly in the LORD, I exult in my God; for he has clothed me with the garments of salvation and wrapped me in a robe of righteousness, as a groom wears a turban and as a bride adorns herself with her jewels.";
csb[11] = "For as the earth produces its growth, and as a garden enables what is sown to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.";
