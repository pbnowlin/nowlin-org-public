csb[1] = "A pronouncement concerning Damascus: Look, Damascus is no longer a city. It has become a ruined heap.";
csb[2] = "The cities of Aroer are abandoned; they will be places for flocks. They will lie down without fear.";
csb[3] = "The fortress disappears from Ephraim, and a kingdom from Damascus. The remnant of Aram will be like the splendor of the Israelites. This is the declaration of the LORD of Armies.";
csb[4] = "On that day the splendor of Jacob will fade, and his healthy body will become emaciated.";
csb[5] = "It will be as if a reaper had gathered standing grain -- his arm harvesting the heads of grain -- and as if one had gleaned heads of grain in the Valley of Rephaim.";
csb[6] = "Only gleanings will be left in Israel, as if an olive tree had been beaten -- two or three olives at the very top of the tree, four or five on its fruitful branches. This is the declaration of the LORD, the God of Israel.";
csb[7] = "On that day people will look to their Maker and will turn their eyes to the Holy One of Israel.";
csb[8] = "They will not look to the altars they made with their hands or to the Asherahs and shrines they made with their fingers.";
csb[9] = "On that day their strong cities will be like the abandoned woods and mountaintops that were abandoned because of the Israelites; there will be desolation.";
csb[10] = "For you have forgotten the God of your salvation, and you have failed to remember the rock of your strength; therefore you will plant beautiful plants and set out cuttings from exotic vines.";
csb[11] = "On the day that you plant, you will help them to grow, and in the morning you will help your seed to sprout, but the harvest will vanish on the day of disease and incurable pain.";
csb[12] = "Ah! The roar of many peoples -- they roar like the roaring of the seas. The raging of the nations -- they rage like the rumble of rushing water.";
csb[13] = "The nations rage like the rumble of a huge torrent. He rebukes them, and they flee far away, driven before the wind like chaff on the hills and like tumbleweeds before a gale.";
csb[14] = "In the evening -- sudden terror! Before morning -- it is gone! This is the fate of those who plunder us and the lot of those who ravage us.";
kjv[1] = "The burden of Damascus. Behold, Damascus is taken away from [being] a city, and it shall be a ruinous heap.";
rsv[1] = "An oracle concerning Damascus. Behold, Damascus will cease to be a city, and will become a heap of ruins.";
asv[1] = "The burden of Damascus. Behold, Damascus is taken away from being a city, and it shall be a ruinous heap.";
yng[1] = "The burden of Damascus. Lo, Damascus is taken away from [being] a city, And it hath been a heap -- a ruin.";
dby[1] = "The burden of Damascus. Behold, Damascus is taken away from [being] a city, and it shall be a ruinous heap.";
web[1] = "The burden of Damascus. Behold, Damascus is taken away from [being] a city, and it shall be a ruinous heap.";
hnv[1] = "The burden of Dammesek. Behold, Dammesek is taken away from being a city, and it shall be a ruinous heap.";
vul[1] = "onus Damasci ecce Damascus desinet esse civitas et erit sicut acervus lapidum in ruina";
kjv[2] = "The cities of Aroer [are] forsaken: they shall be for flocks, which shall lie down, and none shall make [them] afraid.";
rsv[2] = "Her cities will be deserted for ever; they will be for flocks, which will lie down, and none will make them afraid.";
asv[2] = "The cities of Aroer are forsaken; they shall be for flocks, which shall lie down, and none shall make them afraid.";
yng[2] = "Forsaken are the cities of Aroer, For droves they are, and they have lain down, And there is none troubling.";
dby[2] = "The cities of Aroer are forsaken: they shall be for flocks; and they shall lie down and there shall be none to make them afraid.";
web[2] = "The cities of Aroer [are] forsaken: they shall be for flocks, which shall lie down, and none shall make [them] afraid.";
hnv[2] = "The cities of `Aro`er are forsaken; they shall be for flocks, which shall lie down, and none shall make them afraid.";
vul[2] = "derelictae civitates Aroer gregibus erunt et requiescent ibi et non erit qui exterreat";
kjv[3] = "The fortress also shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria: they shall be as the glory of the children of Israel, saith the LORD of hosts.";
rsv[3] = "The fortress will disappear from E\'phraim, and the kingdom from Damascus; and the remnant of Syria will be like the glory of the children of Israel, says the LORD of hosts.";
asv[3] = "And the fortress shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria; they shall be as the glory of the children of Israel, saith Jehovah of hosts.";
yng[3] = "And ceased hath the fortress from Ephraim, And the kingdom from Damascus, And the remnant of Aram are as the honour of the sons of Israel, The affirmation of Jehovah of Hosts!";
dby[3] = "The fortress also shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria: they shall be as the glory of the children of Israel, saith Jehovah of hosts.";
web[3] = "The fortress also shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria: they shall be as the glory of the children of Israel, saith the LORD of hosts.";
hnv[3] = "The fortress shall cease from Efrayim, and the kingdom from Dammesek, and the remnant of Aram; they shall be as the glory of the children of Yisra\'el, says the LORD of Hosts.";
vul[3] = "et cessabit adiutorium ab Ephraim et regnum a Damasco et reliquiae Syriae sicut gloria filiorum Israhel erunt dicit Dominus exercituum";
kjv[4] = "And in that day it shall come to pass, [that] the glory of Jacob shall be made thin, and the fatness of his flesh shall wax lean.";
rsv[4] = "And in that day the glory of Jacob will be brought low, and the fat of his flesh will grow lean.";
asv[4] = "And it shall come to pass in that day, that the glory of Jacob shall be made thin, and the fatness of his flesh shall wax lean.";
yng[4] = "And it hath come to pass, in that day, Wax poor doth the honour of Jacob, And the fatness of his flesh doth wax lean.";
dby[4] = "And in that day it shall come to pass, that the glory of Jacob shall be made thin, and the fatness of his flesh shall become lean.";
web[4] = "And in that day it shall come to pass, [that] the glory of Jacob shall be diminished, and the fatness of his flesh shall become lean.";
hnv[4] = "It shall happen in that day, that the glory of Ya`akov shall be made thin, and the fatness of his flesh shall wax lean.";
vul[4] = "et erit in die illa adtenuabitur gloria Iacob et pingue carnis eius marcescet";
kjv[5] = "And it shall be as when the harvestman gathereth the corn, and reapeth the ears with his arm; and it shall be as he that gathereth ears in the valley of Rephaim.";
rsv[5] = "And it shall be as when the reaper gathers standing grain and his arm harvests the ears, and as when one gleans the ears of grain in the Valley of Reph\'aim.";
asv[5] = "And it shall be as when the harvestman gathereth the standing grain, and his arm reapeth the ears; yea, it shall be as when one gleaneth ears in the valley of Rephaim.";
yng[5] = "And it hath come to pass, As the gathering by the reaper of the standing corn, And his arm the ears reapeth, And it hath come to pass, As the gathering of the ears in the valley of Rephaim,";
dby[5] = "And it shall be as when the reaper gathereth the corn, and reapeth the ears with his arm; yea, it shall be as he that gathereth ears in the valley of Rephaim.";
web[5] = "And it shall be as when the harvest-man gathereth the corn, and reapeth the ears with his arm; and it shall be as he that gathereth ears in the valley of Rephaim.";
hnv[5] = " It shall be as when the harvester gathers the standing grain, and his arm reaps the ears; yes, it shall be as when one gleans ears in the valley of Refa\'im.";
vul[5] = "et erit sicut congregans in messe quod restiterit et brachium eius spicas leget et erit sicut quaerens spicas in valle Rafaim";
kjv[6] = "Yet gleaning grapes shall be left in it, as the shaking of an olive tree, two [or] three berries in the top of the uppermost bough, four [or] five in the outmost fruitful branches thereof, saith the LORD God of Israel.";
rsv[6] = "Gleanings will be left in it, as when an olive tree is beaten--two or three berries in the top of the highest bough, four or five on the branches of a fruit tree, says the LORD God of Israel.";
asv[6] = "Yet there shall be left therein gleanings, as the shaking of an olive-tree, two or three berries in the top of the uppermost bough, four or five in the outmost branches of a fruitful tree, saith Jehovah, the God of Israel.";
yng[6] = "And left in him have been gleanings, As the compassing of an olive, Two -- three berries on the top of a branch, Four -- five on the fruitful boughs, The affirmation of Jehovah, God of Israel!";
dby[6] = "And a gleaning shall be left in it, as at the shaking of an olive-tree: two, three berries above, in the tree-top; four, five in its fruitful boughs, saith Jehovah, the God of Israel.";
web[6] = "Yet gleaning grapes shall be left in it, as the shaking of an olive-tree, two [or] three berries in the top of the uppermost bough, four [or] five in the outmost fruitful branches of it, saith the LORD God of Israel.";
hnv[6] = "Yet there shall be left therein gleanings, as the shaking of an olive tree, two or three berries in the top of the uppermost bough, four or five in the outmost branches of a fruitful tree, says the LORD, the God of Yisra\'el.";
vul[6] = "et relinquetur in eo sicut racemus et sicut excussio oleae duarum aut trium olivarum in summitate rami sive quattuor aut quinque in cacuminibus eius fructus eius dicit Dominus Deus Israhel";
kjv[7] = "At that day shall a man look to his Maker, and his eyes shall have respect to the Holy One of Israel.";
rsv[7] = "In that day men will regard their Maker, and their eyes will look to the Holy One of Israel;";
asv[7] = "In that day shall men look unto their Maker, and their eyes shall have respect to the Holy One of Israel.";
yng[7] = "In that day doth man look to His Maker, Yea, his eyes to the Holy One of Israel look,";
dby[7] = "In that day shall man look to his Maker, and his eyes shall have regard to the Holy One of Israel.";
web[7] = "At that day shall a man look to his Maker, and his eyes shall have respect to the Holy One of Israel.";
hnv[7] = "In that day shall men look to their Maker, and their eyes shall have respect to the Holy One of Yisra\'el.";
vul[7] = "in die illa inclinabitur homo ad factorem suum et oculi eius ad Sanctum Israhel respicient";
kjv[8] = "And he shall not look to the altars, the work of his hands, neither shall respect [that] which his fingers have made, either the groves, or the images.";
rsv[8] = "they will not have regard for the altars, the work of their hands, and they will not look to what their own fingers have made, either the Ashe\'rim or the altars of incense.";
asv[8] = "And they shall not look to the altars, the work of their hands; neither shall they have respect to that which their fingers have made, either the Asherim, or the sun-images.";
yng[8] = "And he looketh not unto the altars. The work of his own hands, And that which his own fingers made He seeth not -- the shrines and the images.";
dby[8] = "And he will not look to the altars, the work of his hands, nor have regard to what his fingers have made, neither the Asherahs nor the sun-images.";
web[8] = "And he shall not look to the altars, the work of his hands, neither shall respect [that] which his fingers have made, either the groves, or the images.";
hnv[8] = "They shall not look to the altars, the work of their hands; neither shall they have respect to that which their fingers have made, either the Asherim, or the sun-images.";

kjv[9] = "In that day shall his strong cities be as a forsaken bough, and an uppermost branch, which they left because of the children of Israel: and there shall be desolation.";
rsv[9] = "In that day their strong cities will be like the deserted places of the Hivites and the Amorites, which they deserted because of the children of Israel, and there will be desolation.";
asv[9] = "In that day shall their strong cities be as the forsaken places in the wood and on the mountain top, which were forsaken from before the children of Israel; and it shall be a desolation.";
yng[9] = "In that day are the cities of his strength As the forsaken thing of the forest, And the branch that they have left, Because of the sons of Israel, It also hath been a desolation.";
dby[9] = "In that day shall his strong cities be as the forsaken tract in the woodland, and the mountain-top which they forsook before the children of Israel; and there shall be desolation.";
web[9] = "In that day shall his strong cities be as a forsaken bough, and an uppermost branch, which they left because of the children of Israel: and there shall be desolation.";
hnv[9] = "In that day shall their strong cities be as the forsaken places in the wood and on the mountain top, which were forsaken from before the children of Yisra\'el; and it shall be a desolation.";
vul[9] = "in die illa erunt civitates fortitudinis eius derelictae sicut aratra et segetes quae derelictae sunt a facie filiorum Israhel et erit deserta";
kjv[10] = "Because thou hast forgotten the God of thy salvation, and hast not been mindful of the rock of thy strength, therefore shalt thou plant pleasant plants, and shalt set it with strange slips:";
rsv[10] = "For you have forgotten the God of your salvation, and have not remembered the Rock of your refuge; therefore, though you plant pleasant plants and set out slips of an alien god,";
asv[10] = "For thou hast forgotten the God of thy salvation, and hast not been mindful of the rock of thy strength; therefore thou plantest pleasant plants, and settest it with strange slips.";
yng[10] = "Because thou hast forgotten the God of thy salvation, And the rock of thy strength hast not remembered, Therefore thou plantest plants of pleasantness, And with a strange slip sowest it,";
dby[10] = "For thou hast forgotten the God of thy salvation, and hast not been mindful of the rock of thy strength; therefore shalt thou plant pleasant plantations, and shalt set them with foreign slips:";
web[10] = "Because thou hast forgotten the God of thy salvation, and hast not been mindful of the rock of thy strength, therefore shalt thou plant pleasant plants, and shalt set it with foreign slips:";
hnv[10] = "For you have forgotten the God of your salvation, and have not been mindful of the rock of your strength; therefore you plant pleasant plants, and set it with strange slips.";
vul[10] = "quia oblita es Dei salvatoris tui et Fortis adiutoris tui non es recordata propterea plantabis plantationem fidelem et germen alienum seminabis";
kjv[11] = "In the day shalt thou make thy plant to grow, and in the morning shalt thou make thy seed to flourish: [but] the harvest [shall be] a heap in the day of grief and of desperate sorrow.";
rsv[11] = "though you make them grow on the day that you plant them, and make them blossom in the morning that you sow; yet the harvest will flee away in a day of grief and incurable pain.";
asv[11] = "In the day of thy planting thou hedgest it in, and in the morning thou makest thy seed to blossom; but the harvest fleeth away in the day of grief and of desperate sorrow.";
yng[11] = "In the day thy plant thou causest to become great, And in the morning thy seed makest to flourish, A heap [is] the harvest in a day of overflowing, And of mortal pain.";
dby[11] = "in the day of thy planting wilt thou make [them] to grow, and on the morrow wilt thou make thy seed to flourish; [but] the harvest will flee in the day of taking possession, and the sorrow will be incurable.";
web[11] = "In the day shalt thou make thy plant to grow, and in the morning shalt thou make thy seed to flourish: [but] the harvest [shall be] a heap in the day of grief and of desperate sorrow.";
hnv[11] = "In the day of your planting you hedge it in, and in the morning you make your seed to blossom; but the harvest flees away in the day of grief and of desperate sorrow.";
vul[11] = "in die plantationis tuae labrusca et mane semen tuum florebit ablata est messis in die hereditatis et dolebit graviter";
kjv[12] = "Woe to the multitude of many people, [which] make a noise like the noise of the seas; and to the rushing of nations, [that] make a rushing like the rushing of mighty waters!";
rsv[12] = "Ah, the thunder of many peoples, they thunder like the thundering of the sea! Ah, the roar of nations, they roar like the roaring of mighty waters!";
asv[12] = "Ah, the uproar of many peoples, that roar like the roaring of the seas; and the rushing of nations, that rush like the rushing of mighty waters!";
yng[12] = "Wo [to] the multitude of many peoples, As the sounding of seas they sound; And [to] the wasting of nations, As the wasting of mighty waters they are wasted.";
dby[12] = "Ha! a tumult of many peoples! they make a noise as the noise of the seas; -- and the rushing of nations! they rush as the rushing of mighty waters.";
web[12] = "Woe to the multitude of many people, [who] make a noise like the noise of the seas; and to the rushing of nations, [that] make a rushing like the rushing of mighty waters!";
hnv[12] = "Ah, the uproar of many peoples, who roar like the roaring of the seas; and the rushing of nations, that rush like the rushing of mighty waters!";
vul[12] = "vae multitudo populorum multorum ut multitudo maris sonantis et tumultus turbarum sicut sonitus aquarum multarum";
kjv[13] = "The nations shall rush like the rushing of many waters: but [God] shall rebuke them, and they shall flee far off, and shall be chased as the chaff of the mountains before the wind, and like a rolling thing before the whirlwind.";
rsv[13] = "The nations roar like the roaring of many waters, but he will rebuke them, and they will flee far away, chased like chaff on the mountains before the wind and whirling dust before the storm.";
asv[13] = "The nations shall rush like the rushing of many waters: but he shall rebuke them, and they shall flee far off, and shall be chased as the chaff of the mountains before the wind, and like the whirling dust before the storm.";
yng[13] = "Nations as the wasting of many waters are wasted, And He hath pushed against it, And it hath fled afar off, And been pursued as chaff of hills before wind, And as a rolling thing before a hurricane.";
dby[13] = "The nations rush as the rushing of many waters; but he will rebuke them, and they shall flee far away, and shall be chased as the chaff of the mountains before the wind, and like a whirling [of dust] before the whirlwind:";
web[13] = "The nations shall rush like the rushing of many waters: but [God] will rebuke them, and they shall flee far off, and shall be chased as the chaff of the mountains before the wind, and like a rolling thing before the whirlwind.";
hnv[13] = "The nations shall rush like the rushing of many waters: but he shall rebuke them, and they shall flee far off, and shall be chased as the chaff of the mountains before the wind, and like the whirling dust before the storm.";
vul[13] = "sonabunt populi sicut sonitus aquarum inundantium et increpabit eum et fugiet procul et rapietur sicut pulvis montium a facie venti et sicut turbo coram tempestate";
kjv[14] = "And behold at eveningtide trouble; [and] before the morning he [is] not. This [is] the portion of them that spoil us, and the lot of them that rob us.";
rsv[14] = "At evening time, behold, terror! Before morning, they are no more! This is the portion of those who despoil us, and the lot of those who plunder us.";
asv[14] = "At eventide, behold, terror; [and] before the morning they are not. This is the portion of them that despoil us, and the lot of them that rob us.";
yng[14] = "At even-time, lo, terror, before morning it is not, This [is] the portion of our spoilers, And the lot of our plunderers!";
dby[14] = "behold, at eventide, trouble; before the morning they are not. This is the portion of them that spoil us, and the lot of them that rob us.";
web[14] = "And behold at the time of evening trouble; [and] before the morning he [is] not. This [is] the portion of them that ravage us, and the lot of them that rob us.";
hnv[14] = "At evening, behold, terror; [and] before the morning they are no more. This is the portion of those who despoil us, and the lot of those who rob us.";
vul[14] = "in tempore vespere et ecce turbatio in matutino et non subsistet haec est pars eorum qui vastaverunt nos et sors diripientium nos";
