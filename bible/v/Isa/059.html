csb[1] = "Indeed, the LORD\'s arm is not too weak to save, and his ear is not too deaf to hear.";
csb[2] = "But your iniquities are separating you from your God, and your sins have hidden his face from you so that he does not listen.";
csb[3] = "For your hands are defiled with blood and your fingers, with iniquity; your lips have spoken lies, and your tongues mutter injustice.";
csb[4] = "No one makes claims justly; no one pleads honestly. They trust in empty and worthless words; they conceive trouble and give birth to iniquity.";
csb[5] = "They hatch viper\'s eggs and weave spider\'s webs. Whoever eats their eggs will die; crack one open, and a viper is hatched.";
csb[6] = "Their webs cannot become clothing, and they cannot cover themselves with their works. Their works are sinful works, and violent acts are in their hands.";
csb[7] = "Their feet run after evil, and they rush to shed innocent blood. Their thoughts are sinful thoughts; ruin and wretchedness are in their paths.";
csb[8] = "They have not known the path of peace, and there is no justice in their ways. They have made their roads crooked; no one who walks on them will know peace.";
csb[9] = "Therefore justice is far from us, and righteousness does not reach us. We hope for light, but there is darkness; for brightness, but we live in the night.";
csb[10] = "We grope along a wall like the blind; we grope like those without eyes. We stumble at noon as though it were twilight; we are like the dead among those who are healthy.";
csb[11] = "We all growl like bears and moan like doves. We hope for justice, but there is none; for salvation, but it is far from us.";
csb[12] = "For our transgressions have multiplied before you, and our sins testify against us. For our transgressions are with us, and we know our iniquities:";
csb[13] = "transgression and deception against the LORD, turning away from following our God, speaking oppression and revolt, conceiving and uttering lying words from the heart.";
csb[14] = "Justice is turned back, and righteousness stands far off. For truth has stumbled in the public square, and honesty cannot enter.";
csb[15] = "Truth is missing, and whoever turns from evil is plundered. The LORD saw that there was no justice, and he was offended.";
csb[16] = "He saw that there was no man -- he was amazed that there was no one interceding; so his own arm brought salvation, and his own righteousness supported him.";
csb[17] = "He put on righteousness as body armor, and a helmet of salvation on his head; he put on garments of vengeance for clothing, and he wrapped himself in zeal as in a cloak.";
csb[18] = "So he will repay according to their deeds: fury to his enemies, retribution to his foes, and he will repay the coasts and islands.";
csb[19] = "They will fear the name of the LORD in the west and his glory in the east; for he will come like a rushing stream driven by the wind of the LORD.";
csb[20] = "&quot;The Redeemer will come to Zion, and to those in Jacob who turn from transgression.&quot; This is the LORD\'s declaration.";
csb[21] = "&quot;As for me, this is my covenant with them,&quot; says the LORD: &quot;My Spirit who is on you, and my words that I have put in your mouth, will not depart from your mouth, or from the mouths of your children, or from the mouths of your children\'s children, from now on and forever,&quot; says the LORD.";
