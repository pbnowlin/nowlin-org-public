csb[1] = "The LORD says this to Cyrus, his anointed, whose right hand I have grasped to subdue nations before him and disarm kings, to open doors before him, and even city gates will not be shut:";
csb[2] = "&quot;I will go before you and level the uneven places; I will shatter the bronze doors and cut the iron bars in two.";
csb[3] = "&quot;I will give you the treasures of darkness and riches from secret places, so that you may know that I am the LORD. I am the God of Israel, who calls you by your name.";
csb[4] = "&quot;I call you by your name, for the sake my servant Jacob and Israel my chosen one. I give a name to you, though you do not know me.";
csb[5] = "&quot;I am the LORD, and there is no other; there is no God but me. I will strengthen you, though you do not know me,";
csb[6] = "&quot;so that all may know from the rising of the sun to its setting that there is no one but me. I am the LORD, and there is no other.";
csb[7] = "&quot;I form light and create darkness, I make success and create disaster; I am the LORD, who does all these things.";
csb[8] = "&quot;Heavens, sprinkle from above, and let the skies shower righteousness. Let the earth open up so that salvation will sprout and righteousness will spring up with it. I, the LORD, have created it.";
csb[9] = "&quot;Woe to the one who argues with his Maker -- one clay pot among many. Does clay say to the one forming it, \'What are you making? \' Or does your work say, \'He has no hands\'?";
csb[10] = "&quot;Woe to the one who says to his father, \'What are you fathering? \' or to his mother, \'What are you giving birth to? \' &quot;";
csb[11] = "This is what the LORD, the Holy One of Israel and its Maker, says: &quot;Ask me what is to happen to my sons, and instruct me about the work of my hands.";
csb[12] = "&quot;I made the earth, and created humans on it. It was my hands that stretched out the heavens, and I commanded everything in them.";
csb[13] = "&quot;I have stirred him up in righteousness, and will level all roads for him. He will rebuild my city, and set my exiles free, not for a price or a bribe,&quot; says the LORD of Armies.";
csb[14] = "This is what the LORD says: &quot;The products of Egypt and the merchandise of Cush and the Sabeans, men of stature, will come over to you and will be yours; they will follow you, they will come over in chains and bow down to you. They will confess to you, \'God is indeed with you, and there is no other; there is no other God.\' &quot;";
csb[15] = "Yes, you are a God who hides, God of Israel, Savior.";
csb[16] = "All of them are put to shame, even humiliated; the makers of idols go in humiliation together.";
csb[17] = "Israel will be saved by the LORD with an everlasting salvation; you will not be put to shame or humiliated for all eternity.";
csb[18] = "For this is what the LORD says -- the Creator of the heavens, the God who formed the earth and made it, the one who established it (he did not create it to be a wasteland, but formed it to be inhabited) -- he says, &quot;I am the LORD, and there is no other.";
csb[19] = "&quot;I have not spoken in secret, somewhere in a land of darkness. I did not say to the descendants of Jacob: Seek me in a wasteland. I am the LORD, who speaks righteously, who declares what is right.";
csb[20] = "&quot;Come, gather together, and approach, you fugitives of the nations. Those who carry their wooden idols and pray to a god who cannot save have no knowledge.";
csb[21] = "&quot;Speak up and present your case -- yes, let them consult each other. Who predicted this long ago? Who announced it from ancient times? Was it not I, the LORD? There is no other God but me, a righteous God and Savior; there is no one except me.";
csb[22] = "&quot;Turn to me and be saved, all the ends of the earth. For I am God, and there is no other.";
csb[23] = "&quot;By myself I have sworn; truth has gone from my mouth, a word that will not be revoked: Every knee will bow to me, every tongue will swear allegiance.";
csb[24] = "&quot;It will be said about me, \'Righteousness and strength are found only in the LORD.\' &quot; All who are enraged against him will come to him and be put to shame.";
csb[25] = "All the descendants of Israel will be justified and find glory through the LORD.";
kjv[1] = "Thus saith the LORD to his anointed, to Cyrus, whose right hand I have holden, to subdue nations before him; and I will loose the loins of kings, to open before him the two leaved gates; and the gates shall not be shut;";

kjv[8] = "Drop down, ye heavens, from above, and let the skies pour down righteousness: let the earth open, and let them bring forth salvation, and let righteousness spring up together; I the LORD have created it.";

asv[8] = "Distil, ye heavens, from above, and let the skies pour down righteousness: let the earth open, that it may bring forth salvation, and let it cause righteousness to spring up together; I, Jehovah, have created it.";
yng[8] = "Drop, ye heavens, from above, And clouds do cause righteousness to flow, Earth openeth, and they are fruitful, Salvation and righteousness spring up together, I, Jehovah, have prepared it.";

kjv[9] = "Woe unto him that striveth with his Maker! [Let] the potsherd [strive] with the potsherds of the earth. Shall the clay say to him that fashioneth it, What makest thou? or thy work, He hath no hands?";

asv[9] = "Woe unto him that striveth with his Maker! a potsherd among the potsherds of the earth! Shall the clay say to him that fashioneth it, What makest thou? or thy work, He hath no hands?";
yng[9] = "Wo [to] him who is striving with his Former, (A potsherd with potsherds of the ground!) Doth clay say to its Framer, `What dost thou?\' And thy work, `He hath no hands?\'";
dby[9] = "Woe unto him that striveth with his Maker! Let a potsherd [strive] with the potsherds of the earth. Shall the clay say to him that formeth it, What makest thou? Or thy work, He hath no hands?";

kjv[14] = "Thus saith the LORD, The labour of Egypt, and merchandise of Ethiopia and of the Sabeans, men of stature, shall come over unto thee, and they shall be thine: they shall come after thee; in chains they shall come over, and they shall fall down unto thee, they shall make supplication unto thee, [saying], Surely God [is] in thee; and [there is] none else, [there is] no God.";
rsv[14] = "Thus says the LORD: &quot;The wealth of Egypt and the merchandise of Ethiopia, and the Sabe\'ans, men of stature, shall come over to you and be yours, they shall follow you; they shall come over in chains and bow down to you. They will make supplication to you, saying: \'God is with you only, and there is no other, no god besides him.\'&quot;";
asv[14] = "Thus saith Jehovah, The labor of Egypt, and the merchandise of Ethiopia, and the Sabeans, men of stature, shall come over unto thee, and they shall be thine: they shall go after thee, in chains they shall come over; and they shall fall down unto thee, they shall make supplication unto thee, [saying], Surely God is in thee; and there is none else, there is no God.";
yng[14] = "Thus said Jehovah, `The labour of Egypt, And the merchandise of Cush, And of the Sebaim -- men of measure, Unto thee pass over, and thine they are, After thee they go, in fetters they pass over, And unto thee they bow themselves, Unto thee they pray: Only in thee [is] God, And there is none else, no [other] God.";
dby[14] = "Thus saith Jehovah: The wealth of Egypt, and the merchandise of Ethiopia and the Sabeans, men of stature, shall come over unto thee, and they shall be thine: they shall walk after thee; in chains they shall come over, and they shall bow down unto thee, they shall make supplication unto thee, [saying,] Surely God is in thee; and there is none else, no other God. ...";
web[14] = "Thus saith the LORD, The labor of Egypt, and merchandise of Cush and of the Sabeans, men of stature, shall come over to thee, and they shall be thine: they shall come after thee; in chains they shall come over, and they shall fall down to thee, they shall make supplication to thee, [saying], Surely God [is] in thee; and [there is] none else, [there is] no God.";
hnv[14] = "Thus says the LORD: &quot;The labor of Mitzrayim, and the merchandise of Kush, and the Seva\'im, men of stature, shall come over to you, and they shall be yours. They shall go after you. In chains they shall come over; and they shall fall down to you. They shall make supplication to you: \'Surely God is in you; and there is none else, there is no other god.";
vul[14] = "haec dicit Dominus labor Aegypti et negotiatio Aethiopiae et Sabaim viri sublimes ad te transibunt et tui erunt post te ambulabunt vincti manicis pergent et te adorabunt teque deprecabuntur tantum in te est Deus et non est absque te deus";

yng[16] = "They have been ashamed, And they have even blushed -- all of them, Together gone in confusion have those carving images.";

kjv[17] = "[But] Israel shall be saved in the LORD with an everlasting salvation: ye shall not be ashamed nor confounded world without end.";
rsv[17] = "But Israel is saved by the LORD with everlasting salvation; you shall not be put to shame or confounded to all eternity.";
asv[17] = "[But] Israel shall be saved by Jehovah with an everlasting salvation: ye shall not be put to shame nor confounded world without end.";
yng[17] = "Israel hath been saved in Jehovah, A salvation age-during! Ye are not ashamed nor confounded Unto the ages of eternity!";
dby[17] = "Israel shall be saved by Jehovah with an everlasting salvation: ye shall not be ashamed nor confounded, unto the ages of ages.";

hnv[17] = " [But] Yisra\'el shall be saved by the LORD with an everlasting salvation: you shall not be disappointed nor confounded world without end.";
vul[17] = "Israhel salvatus est in Domino salute aeterna non confundemini et non erubescetis usque in saeculum saeculi";
kjv[18] = "For thus saith the LORD that created the heavens; God himself that formed the earth and made it; he hath established it, he created it not in vain, he formed it to be inhabited: I [am] the LORD; and [there is] none else.";
rsv[18] = "For thus says the LORD, who created the heavens (he is God!), who formed the earth and made it (he established it; he did not create it a chaos, he formed it to be inhabited!): &quot;I am the LORD, and there is no other.";
asv[18] = "For thus saith Jehovah that created the heavens, the God that formed the earth and made it, that established it and created it not a waste, that formed it to be inhabited: I am Jehovah; and there is none else.";
yng[18] = "For thus said Jehovah, Creator of heaven, He is God, Former of earth, and its Maker, He established it -- not empty He prepared it, For inhabiting He formed it: `I [am] Jehovah, and there is none else.";
dby[18] = "For thus saith Jehovah who created the heavens, God himself who formed the earth and made it, he who established it, -- not as waste did he create it: he formed it to be inhabited: -- I [am] Jehovah, and there is none else.";
web[18] = "For thus saith the LORD that created the heavens; God himself that formed the earth and made it; he hath established it, he created it not in vain, he formed it to be inhabited: I [am] the LORD; and [there is] none else.";
hnv[18] = "For thus says the LORD who created the heavens, the God who formed the eretz and made it, who established it and didn\'t create it a waste, who formed it to be inhabited: I am the LORD; and there is no one else.";
vul[18] = "quia haec dicit Dominus creans caelos ipse Deus formans terram et faciens eam ipse plastes eius non in vanum creavit eam ut habitetur formavit eam ego Dominus et non est alius";
kjv[19] = "I have not spoken in secret, in a dark place of the earth: I said not unto the seed of Jacob, Seek ye me in vain: I the LORD speak righteousness, I declare things that are right.";
rsv[19] = "I did not speak in secret, in a land of darkness; I did not say to the offspring of Jacob, \'Seek me in chaos.\' I the LORD speak the truth, I declare what is right.";
asv[19] = "I have not spoken in secret, in a place of the land of darkness; I said not unto the seed of Jacob, Seek ye me in vain: I, Jehovah, speak righteousness, I declare things that are right.";
yng[19] = "Not in secret have I spoken, in a dark place of the earth, I have not said to the seed of Jacob, In vain seek ye Me, I [am] Jehovah, speaking righteousness, Declaring uprightness.";
dby[19] = "I have not spoken in secret, in a dark place of the earth; I said not unto the seed of Jacob, Seek me in vain: I [am] Jehovah, speaking righteousness, declaring things which are right.";
web[19] = "I have not spoken in secret, in a dark place of the earth: I have not said to the seed of Jacob, Seek ye me in vain: I the LORD speak righteousness, I declare things that are right.";
hnv[19] = "I have not spoken in secret, in a place of the land of darkness; I didn\'t say to the seed of Ya`akov, Seek you me in vain: I, the LORD, speak righteousness, I declare things that are right.";
vul[19] = "non in abscondito locutus sum in loco terrae tenebroso non dixi semini Iacob frustra quaerite me ego Dominus loquens iustitiam adnuntians recta";
kjv[20] = "Assemble yourselves and come; draw near together, ye [that are] escaped of the nations: they have no knowledge that set up the wood of their graven image, and pray unto a god [that] cannot save.";
rsv[20] = "&quot;Assemble yourselves and come, draw near together, you survivors of the nations! They have no knowledge who carry about their wooden idols, and keep on praying to a god that cannot save.";
asv[20] = "Assemble yourselves and come; draw near together, ye that are escaped of the nations: they have no knowledge that carry the wood of their graven image, and pray unto a god that cannot save.";
yng[20] = "Be gathered, and come in, Come nigh together, ye escaped of the nations, They have not known, Who are lifting up the wood of their graven image, And praying unto a god [that] saveth not.";
dby[20] = "Gather yourselves and come; draw near together, ye that are escaped of the nations. They have no knowledge that carry the wood of their graven image, and pray unto a god that cannot save.";
web[20] = "Assemble yourselves and come; draw near together, ye [that have] escaped of the nations: they have no knowledge that set up the wood of their graven image, and pray to a god [that] cannot save.";
hnv[20] = "Assemble yourselves and come; draw near together, you who have escaped from the nations: they have no knowledge who carry the wood of their engraved image, and pray to a god that can\'t save.";
vul[20] = "congregamini et venite et accedite simul qui salvati estis ex gentibus nescierunt qui levant lignum sculpturae suae et rogant deum non salvantem";
kjv[21] = "Tell ye, and bring [them] near; yea, let them take counsel together: who hath declared this from ancient time? [who] hath told it from that time? [have] not I the LORD? and [there is] no God else beside me; a just God and a Saviour; [there is] none beside me.";
rsv[21] = "Declare and present your case; let them take counsel together! Who told this long ago? Who declared it of old? Was it not I, the LORD? And there is no other god besides me, a righteous God and a Savior; there is none besides me.";
asv[21] = "Declare ye, and bring [it] forth; yea, let them take counsel together: who hath showed this from ancient time? who hath declared it of old? have not I, Jehovah? and there is no God else besides me, a just God and a Saviour; there is none besides me.";
yng[21] = "Declare ye, and bring near, Yea, they take counsel together, Who hath proclaimed this from of old? From that time hath declared it? Is it not I -- Jehovah? And there is no other god besides Me, A God righteous and saving, there is none save Me.";
dby[21] = "Declare and bring [them] near; yea, let them take counsel together: who hath caused this to be heard from ancient time? [who] hath declared it long ago? Is it not I, Jehovah? And there is no God else beside me; a just God and a Saviour, there is none besides me.";
web[21] = "Tell ye, and bring [them] near; yes, let them take counsel together: who hath declared this from ancient time? [who] hath told it from that time? [have] not I the LORD? and [there is] no God else besides me; a just God and a Savior; [there is] none besides me.";
hnv[21] = "Declare you, and bring [it] forth; yes, let them take counsel together: who has shown this from ancient time? who has declared it of old? Haven\'t I, the LORD? and there is no God else besides me, a just God and a Savior; there is no one besides me.";
vul[21] = "adnuntiate et venite et consiliamini simul quis auditum fecit hoc ab initio ex tunc praedixit illud numquid non ego Dominus et non est ultra Deus absque me Deus iustus et salvans non est praeter me";
kjv[22] = "Look unto me, and be ye saved, all the ends of the earth: for I [am] God, and [there is] none else.";
rsv[22] = "&quot;Turn to me and be saved, all the ends of the earth! For I am God, and there is no other.";
asv[22] = "Look unto me, and be ye saved, all the ends of the earth; for I am God, and there is none else.";
yng[22] = "Turn to Me, and be saved, all ends of the earth, For I [am] God, and there is none else.";
dby[22] = "Look unto me, and be ye saved, all the ends of the earth: for I [am] God, and there is none else.";
web[22] = "Look to me, and be ye saved, all the ends of the earth: for I [am] God, and [there is] none else.";
hnv[22] = "Look to me, and be you saved, all the ends of the eretz; for I am God, and there is none else.";
vul[22] = "convertimini ad me et salvi eritis omnes fines terrae quia ego Deus et non est alius";
kjv[23] = "I have sworn by myself, the word is gone out of my mouth [in] righteousness, and shall not return, That unto me every knee shall bow, every tongue shall swear.";
rsv[23] = "By myself I have sworn, from my mouth has gone forth in righteousness a word that shall not return: \'To me every knee shall bow, every tongue shall swear.\'";
asv[23] = "By myself have I sworn, the word is gone forth from my mouth [in] righteousness, and shall not return, that unto me every knee shall bow, every tongue shall swear.";
yng[23] = "By Myself I have sworn, Gone out from my mouth in righteousness hath a word, And it turneth not back, That to Me, bow doth every knee, every tongue swear.";
dby[23] = "I have sworn by myself, the word is gone out of my mouth [in] righteousness and shall not return, that unto me every knee shall bow, every tongue shall swear.";
web[23] = "I have sworn by myself, the word is gone out of my mouth [in] righteousness, and shall not return, That to me every knee shall bow, every tongue shall swear.";
hnv[23] = "By myself have I sworn, the word is gone forth from my mouth [in] righteousness, and shall not return, that to me every knee shall bow, every tongue shall swear.";
vul[23] = "in memet ipso iuravi egredietur de ore meo iustitiae verbum et non revertetur quia mihi curvabunt omnia genu et iurabit omnis lingua";
kjv[24] = "Surely, shall [one] say, in the LORD have I righteousness and strength: [even] to him shall [men] come; and all that are incensed against him shall be ashamed.";
rsv[24] = "&quot;Only in the LORD, it shall be said of me, are righteousness and strength; to him shall come and be ashamed, all who were incensed against him.";
asv[24] = "Only in Jehovah, it is said of me, is righteousness and strength; even to him shall men come; and all they that were incensed against him shall be put to shame.";
yng[24] = "Only in Jehovah, said hath one, Have I righteousness and strength, Unto Him he cometh in, And ashamed are all those displeased with Him.";
dby[24] = "Only in Jehovah, shall one say, have I righteousness and strength. To him shall [men] come; and all that are incensed against him shall be ashamed.";
web[24] = "Surely, shall [one] say, in the LORD have I righteousness and strength: [even] to him shall [men] come; and all that are incensed against him shall be ashamed.";
hnv[24] = "Only in the LORD, it is said of me, is righteousness and strength; even to him shall men come; and all those who were incensed against him shall be disappointed.";
vul[24] = "ergo in Domino dicet meae sunt iustitiae et imperium ad eum venient et confundentur omnes qui repugnant ei";
kjv[25] = "In the LORD shall all the seed of Israel be justified, and shall glory.";
rsv[25] = "In the LORD all the offspring of Israel shall triumph and glory.&quot;";
asv[25] = "In Jehovah shall all the seed of Israel be justified, and shall glory.";
yng[25] = "In Jehovah are all the seed of Israel justified, And they boast themselves.\'";
dby[25] = "In Jehovah shall all the seed of Israel be justified, and shall glory.";
web[25] = "In the LORD shall all the seed of Israel be justified, and shall glory.";
hnv[25] = "In the LORD shall all the seed of Yisra\'el be justified, and shall glory.";
vul[25] = "in Domino iustificabitur et laudabitur omne semen Israhel";
