csb[1] = "&quot;Listen to this, house of Jacob -- those who are called by the name Israel and have descended from Judah, who swear by the name of the LORD and declare the God of Israel, but not in truth or righteousness.";
csb[2] = "&quot;For they are named after the Holy City, and lean on the God of Israel; his name is the LORD of Armies.";
csb[3] = "&quot;I declared the past events long ago; they came out of my mouth; I proclaimed them. Suddenly I acted, and they occurred.";
csb[4] = "&quot;Because I know that you are stubborn, and your neck is iron and your forehead bronze,";
csb[5] = "&quot;therefore I declared to you long ago. I announced it to you before it occurred, so you could not claim, \'My idol caused them; my carved image and cast idol control them.\'";
csb[6] = "&quot;You have heard it. Observe it all. Will you not acknowledge it? From now on I will announce new things to you, hidden things that you have not known.";
csb[7] = "&quot;They have been created now, and not long ago; you have not heard of them before today, so you could not claim, \'I already knew them! \'";
csb[8] = "&quot;You have never heard; you have never known; for a long time your ears have not been open. For I knew that you were very treacherous, and were known as a rebel from birth.";
csb[9] = "&quot;I will delay my anger for the sake of my name, and I will restrain myself for your benefit and for my praise, so that you will not be destroyed.";
csb[10] = "&quot;Look, I have refined you, but not as silver; I have tested you in the furnace of affliction.";
csb[11] = "&quot;I will act for my own sake, indeed, my own, for how can I be defiled? I will not give my glory to another.";
csb[12] = "&quot;Listen to me, Jacob, and Israel, the one called by me: I am he; I am the first, I am also the last.";
csb[13] = "&quot;My own hand founded the earth, and my right hand spread out the heavens; when I summoned them, they stood up together.";
csb[14] = "&quot;All of you, assemble and listen! Who among the idols has declared these things? The LORD loves him; he will accomplish his will against Babylon, and his arm will be against the Chaldeans.";
csb[15] = "&quot;I -- I have spoken; yes, I have called him; I have brought him, and he will succeed in his mission.";
csb[16] = "&quot;Approach me and listen to this. From the beginning I have not spoken in secret; from the time anything existed, I was there.&quot; And now the Lord GOD has sent me and his Spirit.";
csb[17] = "This is what the LORD, your Redeemer, the Holy One of Israel says: I am the LORD your God, who teaches you for your benefit, who leads you in the way you should go.";
csb[18] = "If only you had paid attention to my commands. Then your peace would have been like a river, and your righteousness like the waves of the sea.";
csb[19] = "Your descendants would have been as countless as the sand, and the offspring of your body like its grains; their name would not be cut off or eliminated from my presence.";
csb[20] = "Leave Babylon, flee from the Chaldeans! Declare with a shout of joy, proclaim this, let it go out to the end of the earth; announce, &quot;The LORD has redeemed his servant Jacob! &quot;";
csb[21] = "They did not thirst when he led them through the deserts; he made water flow from the rock for them; he split the rock, and water gushed out.";
csb[22] = "&quot;There is no peace for the wicked,&quot; says the LORD.";
