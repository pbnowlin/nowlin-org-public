csb[1] = "Listen to me, you who pursue righteousness, you who seek the LORD: Look to the rock from which you were cut, and to the quarry from which you were dug.";
csb[2] = "Look to Abraham your father, and to Sarah who gave birth to you. When I called him, he was only one; I blessed him and made him many.";
csb[3] = "For the LORD will comfort Zion; he will comfort all her waste places, and he will make her wilderness like Eden, and her desert like the garden of the LORD. Joy and gladness will be found in her, thanksgiving and melodious song.";
csb[4] = "Pay attention to me, my people, and listen to me, my nation; for instruction will come from me, and my justice for a light to the nations. I will bring it about quickly.";
csb[5] = "My righteousness is near, my salvation appears, and my arms will bring justice to the nations. The coasts and islands will put their hope in me, and they will look to my strength.";
csb[6] = "Look up to the heavens, and look at the earth beneath; for the heavens will vanish like smoke, the earth will wear out like a garment, and its inhabitants will die like gnats. But my salvation will last forever, and my righteousness will never be shattered.";
csb[7] = "Listen to me, you who know righteousness, the people in whose heart is my instruction: do not fear disgrace by men, and do not be shattered by their taunts.";
csb[8] = "For moths will devour them like a garment, and worms will eat them like wool. But my righteousness will last forever, and my salvation for all generations.";
csb[9] = "Wake up, wake up! Arm of the LORD, clothe yourself with strength. Wake up as in days past, as in generations long ago. Wasn\'t it you who hacked Rahab to pieces, who pierced the sea monster?";
csb[10] = "Wasn\'t it you who dried up the sea, the waters of the great deep, who made the sea-bed into a road for the redeemed to pass over?";
csb[11] = "And the redeemed of the LORD will return and come to Zion with singing, crowned with unending joy. Joy and gladness will overtake them, and sorrow and sighing will flee.";
csb[12] = "I -- I am the one who comforts you. Who are you that you should fear humans who die, or a son of man who is given up like grass?";
csb[13] = "But you have forgotten the LORD, your Maker, who stretched out the heavens and laid the foundations of the earth. You are in constant dread all day long because of the fury of the oppressor, who has set himself to destroy. But where is the fury of the oppressor?";
csb[14] = "The prisoner is soon to be set free; he will not die and go to the Pit, and his food will not be lacking.";
csb[15] = "For I am the LORD your God who stirs up the sea so that its waves roar -- his name is the LORD of Armies.";
csb[16] = "I have put my words in your mouth, and covered you in the shadow of my hand, in order to plant the heavens, to found the earth, and to say to Zion, &quot;You are my people.&quot;";
csb[17] = "Wake yourself, wake yourself up! Stand up, Jerusalem, you who have drunk the cup of his fury from the LORD\'s hand; you who have drunk the goblet to the dregs -- the cup that causes people to stagger.";
csb[18] = "There is no one to guide her among all the children she has raised; there is no one to take hold of her hand among all the offspring she has brought up.";
csb[19] = "These two things have happened to you: devastation and destruction, famine and sword. Who will grieve for you? How can I comfort you?";
csb[20] = "Your children have fainted; they lie at the head of every street like an antelope in a net. They are full of the LORD\'s fury, the rebuke of your God.";
csb[21] = "So listen to this, suffering and drunken one -- but not with wine.";
csb[22] = "This is what your Lord says -- the LORD, even your God, who defends his people -- &quot;Look, I have removed from your hand the cup that causes staggering; that goblet, the cup of my fury. You will never drink it again.";
csb[23] = "&quot;I will put it into the hands of your tormentors, who said to you: Lie down, so we can walk over you. You made your back like the ground, and like a street for those who walk on it.";
kjv[1] = "Hearken to me, ye that follow after righteousness, ye that seek the LORD: look unto the rock [whence] ye are hewn, and to the hole of the pit [whence] ye are digged.";

yng[1] = "Hearken unto Me, ye pursuing righteousness, Seeking Jehovah, Look attentively unto the rock -- ye have been hewn, And unto the hole of the pit -- ye have been digged.";

asv[17] = "Awake, awake, stand up, O Jerusalem, that hast drunk at the hand of Jehovah the cup of his wrath; thou hast drunken the bowl of the cup of staggering, and drained it.";
yng[17] = "Stir thyself, stir thyself, rise, Jerusalem, Who hast drunk from the hand of Jehovah The cup of His fury, The goblet, the cup of trembling, thou hast drunk, Thou hast wrung out.";
dby[17] = "Arouse thyself, arouse thyself, stand up, Jerusalem, which hast drunk at the hand of Jehovah the cup of his fury. Thou hast drunk, hast drained out the goblet-cup of bewilderment:";

hnv[17] = "Awake, awake, stand up, Yerushalayim, that have drunk at the hand of the LORD the cup of his wrath; you have drunken the bowl of the cup of staggering, and drained it.";

asv[19] = "These two things are befallen thee, who shall bemoan thee? desolation and destruction, and the famine and the sword; how shall I comfort thee?";
yng[19] = "These two are meeting thee, who is moved for thee? Spoiling and destruction -- Famine and sword, who -- I comfort thee?";
