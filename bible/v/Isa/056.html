csb[1] = "This is what the LORD says: Preserve justice and do what is right, for my salvation is coming soon, and my righteousness will be revealed.";
csb[2] = "Happy is the person who does this, the son of man who holds it fast, who keeps the Sabbath without desecrating it, and keeps his hand from doing any evil.";
csb[3] = "No foreigner who has joined himself to the LORD should say, &quot;The LORD will exclude me from his people,&quot; and the eunuch should not say, &quot;Look, I am a dried-up tree.&quot;";
csb[4] = "For the LORD says this: &quot;For the eunuchs who keep my Sabbaths, and choose what pleases me, and hold firmly to my covenant,";
csb[5] = "&quot;I will give them, in my house and within my walls, a memorial and a name better than sons and daughters. I will give each of them an everlasting name that will never be cut off.";
csb[6] = "&quot;As for the foreigners who join themselves to the LORD to minister to him, to love the name of the LORD, and to become his servants -- all who keep the Sabbath without desecrating it and who hold firmly to my covenant --";
csb[7] = "&quot;I will bring them to my holy mountain and let them rejoice in my house of prayer. Their burnt offerings and sacrifices will be acceptable on my altar, for my house will be called a house of prayer for all nations.&quot;";
csb[8] = "This is the declaration of the Lord GOD, who gathers the dispersed of Israel: &quot;I will gather to them still others besides those already gathered.&quot;";
csb[9] = "All you animals of the field and forest, come and eat!";
csb[10] = "Israel\'s watchmen are blind, all of them, they know nothing; all of them are mute dogs, they cannot bark; they dream, lie down, and love to sleep.";
csb[11] = "These dogs have fierce appetites; they never have enough. And they are shepherds who have no discernment; all of them turn to their own way, every last one for his own profit.";
csb[12] = "&quot;Come, let me get some wine, let\'s guzzle some beer; and tomorrow will be like today, only far better! &quot;";
kjv[1] = "Thus saith the LORD, Keep ye judgment, and do justice: for my salvation [is] near to come, and my righteousness to be revealed.";

dby[1] = "Thus saith Jehovah: Keep ye judgment and do righteousness; for my salvation is near to come, and my righteousness to be revealed.";

hnv[1] = "Thus says the LORD, Keep you justice, and do righteousness; for my yeshu`ah is near to come, and my righteousness to be revealed.";

yng[2] = "O the happiness of a man who doth this, And of a son of man who keepeth hold on it, Keeping the sabbath from polluting it, And keeping his hand from doing any evil.";

yng[7] = "I have brought them unto My holy mountain, And caused them to rejoice in My house of prayer, Their burnt-offerings and their sacrifices [Are] for a pleasing thing on Mine altar, For My house, `A house of prayer,\' Is called for all the peoples.";

dby[8] = "The Lord Jehovah, who gathereth the outcasts of Israel, saith: Yet will I gather [others] to him, with those of his that are gathered.";
