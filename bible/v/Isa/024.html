csb[1] = "Look, the LORD is stripping the earth bare and making it desolate. He will twist its surface and scatter its inhabitants:";
csb[2] = "people and priest alike, servant and master, female servant and mistress, buyer and seller, lender and borrower, creditor and debtor.";
csb[3] = "The earth will be stripped completely bare and will be totally plundered, for the LORD has spoken this message.";
csb[4] = "The earth mourns and withers; the world wastes away and withers; the exalted people of the earth waste away.";
csb[5] = "The earth is polluted by its inhabitants, for they have transgressed teachings, overstepped decrees, and broken the permanent covenant.";
csb[6] = "Therefore a curse has consumed the earth, and its inhabitants have become guilty; the earth\'s inhabitants have been burned, and only a few survive.";
csb[7] = "The new wine mourns; the vine withers. All the carousers now groan.";
csb[8] = "The joyful tambourines have ceased. The noise of the jubilant has stopped. The joyful lyre has ceased.";
csb[9] = "They no longer sing and drink wine; beer is bitter to those who drink it.";
csb[10] = "The city of chaos is shattered; every house is closed to entry.";
csb[11] = "In the streets they cry for wine. All joy grows dark; earth\'s rejoicing goes into exile.";
csb[12] = "Only desolation remains in the city; its gate has collapsed in ruins.";
csb[13] = "For this is how it will be on earth among the nations: like a harvested olive tree, like a gleaning after a grape harvest.";
csb[14] = "They raise their voices, they sing out; they proclaim in the west the majesty of the LORD.";
csb[15] = "Therefore, in the east honor the LORD! In the coasts and islands of the west honor the name of the LORD, the God of Israel.";
csb[16] = "From the ends of the earth we hear songs: The Splendor of the Righteous One. But I said, &quot;I waste away! I waste away! Woe is me.&quot; The treacherous act treacherously; the treacherous deal very treacherously.";
csb[17] = "Panic, pit, and trap await you who dwell on the earth.";
csb[18] = "Whoever flees at the sound of panic will fall into a pit, and whoever escapes from the pit will be caught in a trap. For the windows on high are opened, and the foundations of the earth are shaken.";
csb[19] = "The earth is completely devastated; the earth is split open; the earth is violently shaken.";
csb[20] = "The earth staggers like a drunkard and sways like a hut. Earth\'s rebellion weighs it down, and it falls, never to rise again.";
csb[21] = "On that day the LORD will punish the army of the heights in the heights and the kings of the ground on the ground.";
csb[22] = "They will be gathered together like prisoners in a pit. They will be confined to a dungeon; after many days they will be punished.";
csb[23] = "The moon will be put to shame and the sun disgraced, because the LORD of Armies will reign as king on Mount Zion in Jerusalem, and he will display his glory in the presence of his elders.";
kjv[1] = "Behold, the LORD maketh the earth empty, and maketh it waste, and turneth it upside down, and scattereth abroad the inhabitants thereof.";
rsv[1] = "Behold, the LORD will lay waste the earth and make it desolate, and he will twist its surface and scatter its inhabitants.";
asv[1] = "Behold, Jehovah maketh the earth empty, and maketh it waste, and turneth it upside down, and scattereth abroad the inhabitants thereof.";
yng[1] = "Lo, Jehovah is emptying the land, And is making it waste, And hath overturned [it on] its face, And hath scattered its inhabitants.";
dby[1] = "Behold, Jehovah maketh the land empty, and maketh it waste, and turneth it upside down, and scattereth abroad its inhabitants.";
web[1] = "Behold, the LORD maketh the earth empty, and maketh it waste, and turneth it upside down, and scattereth abroad its inhabitants.";
hnv[1] = "Behold, the LORD makes the eretz empty, and makes it waste, and turns it upside down, and scatters abroad the inhabitants of it.";
vul[1] = "ecce Dominus dissipabit terram et nudabit eam et adfliget faciem eius et disperget habitatores eius";
kjv[2] = "And it shall be, as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the taker of usury, so with the giver of usury to him.";
rsv[2] = "And it shall be, as with the people, so with the priest; as with the slave, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the debtor.";
asv[2] = "And it shall be, as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the creditor, so with the debtor; as with the taker of interest, so with the giver of interest to him.";
yng[2] = "And it hath been -- as a people so a priest, As the servant so his master, As the maid-servant so her mistress, As the buyer so the seller, As the lender so the borrower, As the usurer so he who is lifting [it] on himself.";
dby[2] = "And it shall be, as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the taker of usury, so with him from whom usury is taken.";
web[2] = "And it shall be, as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the taker of interest, so with the giver of interest to him.";
hnv[2] = "It shall be, as with the people, so with the Kohen; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the creditor, so with the debtor; as with the taker of interest, so with the giver of interest to him.";
vul[2] = "et erit sicut populus sic sacerdos et sicut servus sic dominus eius sicut ancilla sic domina eius sicut emens sic ille qui vendit sicut fenerator sic is qui mutuum accipit sicut qui repetit sic qui debet";
kjv[3] = "The land shall be utterly emptied, and utterly spoiled: for the LORD hath spoken this word.";
rsv[3] = "The earth shall be utterly laid waste and utterly despoiled; for the LORD has spoken this word.";
asv[3] = "The earth shall be utterly emptied, and utterly laid waste; for Jehovah hath spoken this word.";
yng[3] = "Utterly emptied is the land, and utterly spoiled, For Jehovah hath spoken this word:";
dby[3] = "The land shall be utterly emptied, and utterly spoiled; for Jehovah hath spoken this word.";
web[3] = "The land shall be utterly emptied, and utterly spoiled: for the LORD hath spoken this word.";
hnv[3] = "The eretz shall be utterly emptied, and utterly laid waste; for the LORD has spoken this word.";
vul[3] = "dissipatione dissipabitur terra et direptione praedabitur Dominus enim locutus est verbum hoc";
kjv[4] = "The earth mourneth [and] fadeth away, the world languisheth [and] fadeth away, the haughty people of the earth do languish.";
rsv[4] = "The earth mourns and withers, the world languishes and withers; the heavens languish together with the earth.";
asv[4] = "The earth mourneth and fadeth away, the world languisheth and fadeth away, the lofty people of the earth do languish.";
yng[4] = "Mourned, faded hath the land, Languished, faded hath the world, Languished have they -- the high place of the people of the land.";
dby[4] = "The land mourneth, it fadeth away; the world languisheth, it fadeth away: the haughty people of the land do languish.";
web[4] = "The earth mourneth [and] fadeth away, the world languisheth [and] fadeth away, the haughty people of the earth do languish.";
hnv[4] = "The eretz mourns and fades away, the world languishes and fades away, the lofty people of the eretz do languish.";

kjv[5] = "The earth also is defiled under the inhabitants thereof; because they have transgressed the laws, changed the ordinance, broken the everlasting covenant.";
rsv[5] = "The earth lies polluted under its inhabitants; for they have transgressed the laws, violated the statutes, broken the everlasting covenant.";
asv[5] = "The earth also is polluted under the inhabitants thereof; because they have transgressed the laws, violated the statutes, broken the everlasting covenant.";
yng[5] = "And the land hath been defiled under its inhabitants, Because they have transgressed laws, They have changed a statute, They have made void a covenant age-during.";
dby[5] = "And the land is polluted under the inhabitants thereof; for they have violated the laws, changed the statute, broken the everlasting covenant.";
web[5] = "The earth also is defiled under its inhabitants; because they have transgressed the laws, changed the ordinance, broken the everlasting covenant.";
hnv[5] = "The eretz also is polluted under the inhabitants of it; because they have transgressed the laws, violated the statutes, broken the everlasting covenant.";
vul[5] = "et terra interfecta est ab habitatoribus suis quia transgressi sunt leges mutaverunt ius dissipaverunt foedus sempiternum";
kjv[6] = "Therefore hath the curse devoured the earth, and they that dwell therein are desolate: therefore the inhabitants of the earth are burned, and few men left.";
rsv[6] = "Therefore a curse devours the earth, and its inhabitants suffer for their guilt; therefore the inhabitants of the earth are scorched, and few men are left.";
asv[6] = "Therefore hath the curse devoured the earth, and they that dwell therein are found guilty: therefore the inhabitants of the earth are burned, and few men left.";
yng[6] = "Therefore a curse hath consumed the land, And the inhabitants in it are become desolate, Therefore consumed have been inhabitants of the land, And few men have been left.";
dby[6] = "Therefore doth the curse devour the earth, and they that dwell therein are held guilty; therefore the inhabitants of the earth are consumed, and few men are left.";
web[6] = "Therefore hath the curse devoured the earth, and they that dwell in it are desolate: therefore the inhabitants of the earth are burned, and few men left.";
hnv[6] = "Therefore has the curse devoured the eretz, and those who dwell therein are found guilty: therefore the inhabitants of the eretz are burned, and few men left.";
vul[6] = "propter hoc maledictio vorabit terram et peccabunt habitatores eius ideoque insanient cultores eius et relinquentur homines pauci";
kjv[7] = "The new wine mourneth, the vine languisheth, all the merryhearted do sigh.";
rsv[7] = "The wine mourns, the vine languishes, all the merry-hearted sigh.";
asv[7] = "The new wine mourneth, the vine languisheth, all the merry-hearted do sigh.";
yng[7] = "Mourned hath the new wine, languished the vine, Sighed have all the joyful of heart.";
dby[7] = "The new wine mourneth, the vine languisheth, all that were merry-hearted do sigh;";
web[7] = "The new wine mourneth, the vine languisheth, all the merry-hearted do sigh.";
hnv[7] = "The new wine mourns, the vine languishes, all the merry-hearted do sigh.";
vul[7] = "luxit vindemia infirmata est vitis ingemuerunt omnes qui laetabantur corde";
kjv[8] = "The mirth of tabrets ceaseth, the noise of them that rejoice endeth, the joy of the harp ceaseth.";
rsv[8] = "The mirth of the timbrels is stilled, the noise of the jubilant has ceased, the mirth of the lyre is stilled.";
asv[8] = "The mirth of tabrets ceaseth, the noise of them that rejoice endeth, the joy of the harp ceaseth.";
yng[8] = "Ceased hath the joy of tabrets, Ceased hath the noise of exulting ones, Ceased hath the joy of a harp.";
dby[8] = "the mirth of tambours ceaseth, the noise of them that rejoice endeth, the joy of the harp ceaseth.";
web[8] = "The mirth of tabrets ceaseth, the noise of them that rejoice endeth, the joy of the harp ceaseth.";
hnv[8] = "The mirth of timbrels ceases, the noise of those who rejoice ends, the joy of the harp ceases.";

rsv[9] = "No more do they drink wine with singing; strong drink is bitter to those who drink it.";
asv[9] = "They shall not drink wine with a song; strong drink shall be bitter to them that drink it.";
yng[9] = "With a song they drink not wine, Bitter is strong drink to those drinking it.";
dby[9] = "They do not drink wine with a song; strong drink is bitter to them that drink it.";
web[9] = "They shall not drink wine with a song; strong drink shall be bitter to them that drink it.";
hnv[9] = "They shall not drink wine with a song; strong drink shall be bitter to those who drink it.";
vul[9] = "cum cantico non bibent vinum amara erit potio bibentibus illam";
kjv[10] = "The city of confusion is broken down: every house is shut up, that no man may come in.";
rsv[10] = "The city of chaos is broken down, every house is shut up so that none can enter.";
asv[10] = "The waste city is broken down; every house is shut up, that no man may come in.";
yng[10] = "It was broken down -- a city of emptiness, Shut hath been every house from entrance.";
dby[10] = "The city of solitude is broken down; every house is shut up, so that none entereth in.";
web[10] = "The city of confusion is broken down: every house is shut up, that no man may enter.";
hnv[10] = "The waste city is broken down; every house is shut up, that no man may come in.";
vul[10] = "adtrita est civitas vanitatis clausa est omnis domus nullo introeunte";
kjv[11] = "[There is] a crying for wine in the streets; all joy is darkened, the mirth of the land is gone.";
rsv[11] = "There is an outcry in the streets for lack of wine; all joy has reached its eventide; the gladness of the earth is banished.";
asv[11] = "There is a crying in the streets because of the wine; all joy is darkened, the mirth of the land is gone.";
yng[11] = "A cry over the wine [is] in out-places, Darkened hath been all joy, Removed hath been the joy of the land.";
dby[11] = "There is a crying for wine in the streets; all joy is darkened, the mirth of the land is gone;";
web[11] = "[There] is a crying for wine in the streets; all joy is darkened, the mirth of the land is gone.";
hnv[11] = "There is a crying in the streets because of the wine; all joy is darkened, the mirth of the land is gone.";
vul[11] = "clamor erit super vino in plateis deserta est omnis laetitia translatum est gaudium terrae";
kjv[12] = "In the city is left desolation, and the gate is smitten with destruction.";
rsv[12] = "Desolation is left in the city, the gates are battered into ruins.";
asv[12] = "In the city is left desolation, and the gate is smitten with destruction.";
yng[12] = "Left in the city [is] desolation, And [with] wasting is the gate smitten.";
dby[12] = "desolation remaineth in the city, and the gate is smitten, -- a ruin.";
web[12] = "In the city is left desolation, and the gate is smitten with destruction.";
hnv[12] = " In the city is left desolation, and the gate is struck with destruction.";
vul[12] = "relicta est in urbe solitudo et calamitas opprimet portas";
kjv[13] = "When thus it shall be in the midst of the land among the people, [there shall be] as the shaking of an olive tree, [and] as the gleaning grapes when the vintage is done.";
rsv[13] = "For thus it shall be in the midst of the earth among the nations, as when an olive tree is beaten, as at the gleaning when the vintage is done.";
asv[13] = "For thus shall it be in the midst of the earth among the peoples, as the shaking of an olive-tree, as the gleanings when the vintage is done.";
yng[13] = "When thus it is in the heart of the land, In the midst of the peoples, As the compassing of the olive, As gleanings when harvest hath been finished,";
dby[13] = "For so will it be in the midst of the land among the peoples, as the shaking of an olive-tree, as the grape-gleanings when the vintage is done.";
web[13] = "When thus it shall be in the midst of the land among the people, [there shall be] as the shaking of an olive-tree, [and] as the gleaning grapes when the vintage is done.";
hnv[13] = "For thus shall it be in the midst of the eretz among the peoples, as the shaking of an olive tree, as the gleanings when the vintage is done.";

kjv[14] = "They shall lift up their voice, they shall sing for the majesty of the LORD, they shall cry aloud from the sea.";
rsv[14] = "They lift up their voices, they sing for joy; over the majesty of the LORD they shout from the west.";
asv[14] = "These shall lift up their voice, they shall shout; for the majesty of Jehovah they cry aloud from the sea.";
yng[14] = "They -- they lift up their voice, They sing of the excellency of Jehovah, They have cried aloud from the sea.";
dby[14] = "These shall lift up their voice, they shall shout for the majesty of Jehovah, they shall cry aloud from the sea.";
web[14] = "They shall lift up their voice, they shall sing for the majesty of the LORD, they shall cry aloud from the sea.";
hnv[14] = "These shall lift up their voice, they shall shout; for the majesty of the LORD they cry aloud from the sea.";
vul[14] = "hii levabunt vocem suam atque laudabunt cum glorificatus fuerit Dominus hinnient de mari";
kjv[15] = "Wherefore glorify ye the LORD in the fires, [even] the name of the LORD God of Israel in the isles of the sea.";
rsv[15] = "Therefore in the east give glory to the LORD; in the coastlands of the sea, to the name of the LORD, the God of Israel.";
asv[15] = "Wherefore glorify ye Jehovah in the east, even the name of Jehovah, the God of Israel, in the isles of the sea.";
yng[15] = "Therefore in prosperity honour ye Jehovah, In isles of the sea, the name of Jehovah, God of Israel.";
dby[15] = "Therefore glorify Jehovah in the east, the name of Jehovah, the God of Israel, in the isles of the west.";
web[15] = "Wherefore glorify ye the LORD in the fires, [even] the name of the LORD God of Israel in the isles of the sea.";
hnv[15] = "Therefore glorify the LORD in the east, even the name of the LORD, the God of Yisra\'el, in the isles of the sea!";
vul[15] = "propter hoc in doctrinis glorificate Dominum in insulis maris nomen Domini Dei Israhel";
kjv[16] = "From the uttermost part of the earth have we heard songs, [even] glory to the righteous. But I said, My leanness, my leanness, woe unto me! the treacherous dealers have dealt treacherously; yea, the treacherous dealers have dealt very treacherously.";
rsv[16] = "From the ends of the earth we hear songs of praise, of glory to the Righteous One. But I say, &quot;I pine away, I pine away. Woe is me! For the treacherous deal treacherously, the treacherous deal very treacherously.&quot;";
asv[16] = "From the uttermost part of the earth have we heard songs: Glory to the righteous. But I said, I pine away, I pine away, woe is me! the treacherous have dealt treacherously; yea, the treacherous have dealt very treacherously.";
yng[16] = "From the skirt of the earth we heard songs, The desire of the righteous. And I say, `Leanness [is] to me, Leanness [is] to me, wo [is] to me.\' Treacherous dealers dealt treacherously, Yea, treachery, treacherous dealers dealt treacherously.";
dby[16] = "From the end of the earth have we heard songs: Glory to the righteous! And I said, My leanness, my leanness, woe unto me! The treacherous have dealt treacherously; yea, the treacherous have dealt very treacherously.";
web[16] = "From the uttermost part of the earth have we heard songs, [even] glory to the righteous. But I said, My leanness, my leanness, woe to me! the treacherous dealers have dealt treacherously; yes, the treacherous dealers have dealt very treacherously.";
hnv[16] = "From the uttermost part of the eretz have we heard songs: Glory to the righteous. But I said, I pine away, I pine away, woe is me! the treacherous have dealt treacherously; yes, the treacherous have dealt very treacherously.";
vul[16] = "a finibus terrae laudes audivimus gloriam iusti et dixi secretum meum mihi secretum meum mihi vae mihi praevaricantes praevaricati sunt et praevaricatione transgressorum praevaricati sunt";
kjv[17] = "Fear, and the pit, and the snare, [are] upon thee, O inhabitant of the earth.";

asv[17] = "Fear, and the pit, and the snare, are upon thee, O inhabitant of the earth.";
yng[17] = "Fear, and a snare, and a gin, [Are] on thee, O inhabitant of the land.";
dby[17] = "Fear, and the pit, and the snare are upon thee, inhabitant of the land.";
web[17] = "Fear, and the pit, and the snare, [are] upon thee, O inhabitant of the earth.";
hnv[17] = "Fear, and the pit, and the snare, are on you, O inhabitant of the eretz.";
vul[17] = "formido et fovea et laqueus super te qui habitator es terrae";
kjv[18] = "And it shall come to pass, [that] he who fleeth from the noise of the fear shall fall into the pit; and he that cometh up out of the midst of the pit shall be taken in the snare: for the windows from on high are open, and the foundations of the earth do shake.";
rsv[18] = "He who flees at the sound of the terror shall fall into the pit; and he who climbs out of the pit shall be caught in the snare. For the windows of heaven are opened, and the foundations of the earth tremble.";
asv[18] = "And it shall come to pass, that he who fleeth from the noise of the fear shall fall into the pit; and he that cometh up out of the midst of the pit shall be taken in the snare: for the windows on high are opened, and the foundations of the earth tremble.";
yng[18] = "And it hath come to pass, He who is fleeing from the noise of the fear Doth fall into the snare, And he who is coming up from the midst of the snare, Is captured by the gin, For windows on high have been opened, And shaken are foundations of the land.";
dby[18] = "And it shall come to pass, [that] he who fleeth from the sound of the fear shall fall into the pit; and he that cometh up out of the midst of the pit shall be taken in the snare; for the windows on high are open, and the foundations of the earth shake.";
web[18] = "And it shall come to pass, [that] he who fleeth from the noise of the fear shall fall into the pit; and he that cometh up out of the midst of the pit shall be taken in the snare: for the windows from on high are open, and the foundations of the earth do shake.";
hnv[18] = "It shall happen, that he who flees from the noise of the fear shall fall into the pit; and he who comes up out of the midst of the pit shall be taken in the snare: for the windows on high are opened, and the foundations of the eretz tremble.";
vul[18] = "et erit qui fugerit a voce formidinis cadet in foveam et qui se explicuerit de fovea tenebitur laqueo quia cataractae de excelsis apertae sunt et concutientur fundamenta terrae";
kjv[19] = "The earth is utterly broken down, the earth is clean dissolved, the earth is moved exceedingly.";
rsv[19] = "The earth is utterly broken, the earth is rent asunder, the earth is violently shaken.";
asv[19] = "The earth is utterly broken, the earth is rent asunder, the earth is shaken violently.";
yng[19] = "Utterly broken down hath been the land, Utterly broken hath been the land, Utterly moved hath been the land.";
dby[19] = "The earth is utterly broken down, the earth is completely dissolved, the earth is violently moved.";
web[19] = "The earth is utterly broken down, the earth is entirely dissolved, the earth is exceedingly moved.";
hnv[19] = "The eretz is utterly broken, the eretz is torn apart, the eretz is shaken violently.";
vul[19] = "confractione confringetur terra contritione conteretur terra commotione commovebitur terra";
kjv[20] = "The earth shall reel to and fro like a drunkard, and shall be removed like a cottage; and the transgression thereof shall be heavy upon it; and it shall fall, and not rise again.";
rsv[20] = "The earth staggers like a drunken man, it sways like a hut; its transgression lies heavy upon it, and it falls, and will not rise again.";
asv[20] = "The earth shall stagger like a drunken man, and shall sway to and fro like a hammock; and the transgression thereof shall be heavy upon it, and it shall fall, and not rise again.";
yng[20] = "Stagger greatly doth the land as a drunkard, And it hath been moved as a lodge, And heavy on it hath been its transgression, And it hath fallen, and addeth not to rise.";
dby[20] = "The earth reeleth to and fro like a drunkard, and is shaken like a night hut; and its transgression is heavy upon it; and it falleth and shall not rise again.";
web[20] = "The earth shall reel to and fro like a drunkard, and shall be removed like a cottage; and the transgression of it shall be heavy upon it; and it shall fall, and not rise again.";
hnv[20] = "The eretz shall stagger like a drunken man, and shall sway back and forth like a hammock; and the disobedience of it shall be heavy on it, and it shall fall, and not rise again.";
vul[20] = "agitatione agitabitur terra sicut ebrius et auferetur quasi tabernaculum unius noctis et gravabit eam iniquitas sua et corruet et non adiciet ut resurgat";
kjv[21] = "And it shall come to pass in that day, [that] the LORD shall punish the host of the high ones [that are] on high, and the kings of the earth upon the earth.";
rsv[21] = "On that day the LORD will punish the host of heaven, in heaven, and the kings of the earth, on the earth.";
asv[21] = "And it shall come to pass in that day, that Jehovah will punish the host of the high ones on high, and the kings of the earth upon the earth.";
yng[21] = "And it hath come to pass, in that day, Jehovah layeth a charge on the host of the high place in the high place, And on the kings of the land on the land.";
dby[21] = "And it shall come to pass in that day, [that] Jehovah will punish the host of the high ones on high, and the kings of the earth upon the earth.";
web[21] = "And it shall come to pass in that day, [that] the LORD shall punish the host of the high ones [that are] on high, and the kings of the earth upon the earth.";
