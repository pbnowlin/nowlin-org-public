csb[1] = "For the LORD will have compassion on Jacob and will choose Israel again. He will settle them on their own land. The resident alien will join them and be united with the house of Jacob.";
csb[2] = "The nations will escort Israel and bring it to its homeland. Then the house of Israel will possess them as male and female slaves in the LORD\'s land. They will make captives of their captors and will rule over their oppressors.";
csb[3] = "When the LORD gives you rest from your pain, torment, and the hard labor you were forced to do,";
csb[4] = "you will sing this song of contempt about the king of Babylon and say: How the oppressor has quieted down, and how the raging has become quiet!";
csb[5] = "The LORD has broken the staff of the wicked, the scepter of the rulers.";
csb[6] = "It struck the peoples in anger with unceasing blows. It subdued the nations in rage with relentless persecution.";
csb[7] = "The whole earth is calm and at rest; people shout with a ringing cry.";
csb[8] = "Even the cypresses and the cedars of Lebanon rejoice over you: &quot;Since you have been laid low, no lumberjack has come against us.&quot;";
csb[9] = "Sheol below is eager to greet your coming, stirring up the spirits of the departed for you -- all the rulers of the earth -- making all the kings of the nations rise from their thrones.";
csb[10] = "They all respond to you, saying, &quot;You too have become as weak as we are; you have become like us!";
csb[11] = "&quot;Your splendor has been brought down to Sheol, along with the music of your harps. Maggots are spread out under you, and worms cover you.&quot;";
csb[12] = "Shining morning star, how you have fallen from the heavens! You destroyer of nations, you have been cut down to the ground.";
csb[13] = "You said to yourself, &quot;I will ascend to the heavens; I will set up my throne above the stars of God. I will sit on the mount of the gods\' assembly, in the remotest parts of the North.";
csb[14] = "&quot;I will ascend above the highest clouds; I will make myself like the Most High.&quot;";
csb[15] = "But you will be brought down to Sheol into the deepest regions of the Pit.";
csb[16] = "Those who see you will stare at you; they will look closely at you: &quot;Is this the man who caused the earth to tremble, who shook the kingdoms,";
csb[17] = "&quot;who turned the world into a wilderness, who destroyed its cities and would not release the prisoners to return home? &quot;";
csb[18] = "All the kings of the nations lie in splendor, each in his own tomb.";
csb[19] = "But you are thrown out without a grave, like a worthless branch, covered by those slain with the sword and dumped into a rocky pit like a trampled corpse.";
csb[20] = "You will not join them in burial, because you destroyed your land and slaughtered your own people. The offspring of evildoers will never be mentioned again.";
csb[21] = "Prepare a place of slaughter for his sons, because of the iniquity of their fathers. They will never rise up to possess a land or fill the surface of the earth with cities.";
csb[22] = "&quot;I will rise up against them&quot; -- this is the declaration of the LORD of Armies -- &quot;and I will cut off from Babylon her reputation, remnant, offspring, and posterity&quot; -- this is the LORD\'s declaration.";
csb[23] = "&quot;I will make her a swampland and a region for herons, and I will sweep her away with the broom of destruction.&quot; This is the declaration of the LORD of Armies.";
csb[24] = "The LORD of Armies has sworn: As I have purposed, so it will be; as I have planned it, so it will happen.";
csb[25] = "I will break Assyria in my land; I will tread him down on my mountain. Then his yoke will be taken from them, and his burden will be removed from their shoulders.";
csb[26] = "This is the plan prepared for the whole earth, and this is the hand stretched out against all the nations.";
csb[27] = "The LORD of Armies himself has planned it; therefore, who can stand in its way? It is his hand that is outstretched, so who can turn it back?";
csb[28] = "In the year that King Ahaz died, this pronouncement came:";
csb[29] = "Don\'t rejoice, all of you in Philistia, because the rod of the one who struck you is broken. For a viper will come from the root of a snake, and from its egg comes a flying serpent.";
csb[30] = "Then the firstborn of the poor will be well fed, and the impoverished will lie down in safety, but I will kill your root with hunger, and your remnant will be slain.";
csb[31] = "Wail, you gates! Cry out, city! Tremble with fear, all Philistia! For a cloud of dust is coming from the north, and there is no one missing from the invader\'s ranks.";
csb[32] = "What answer will be given to the messengers from that nation? The LORD has founded Zion, and his oppressed people find refuge in her.";
kjv[1] = "For the LORD will have mercy on Jacob, and will yet choose Israel, and set them in their own land: and the strangers shall be joined with them, and they shall cleave to the house of Jacob.";
rsv[1] = "The LORD will have compassion on Jacob and will again choose Israel, and will set them in their own land, and aliens will join them and will cleave to the house of Jacob.";
asv[1] = "For Jehovah will have compassion on Jacob, and will yet choose Israel, and set them in their own land: and the sojourner shall join himself with them, and they shall cleave to the house of Jacob.";
yng[1] = "Because Jehovah loveth Jacob, And hath fixed again on Israel, And given them rest on their own land, And joined hath been the sojourner to them, And they have been admitted to the house of Jacob.";
dby[1] = "For Jehovah will have mercy on Jacob, and will yet choose Israel, and set them in rest in their own land; and the stranger shall be united to them, and they shall be joined to the house of Jacob.";

hnv[1] = "For the LORD will have compassion on Ya`akov, and will yet choose Yisra\'el, and set them in their own land: and the foreigner shall join himself with them, and they shall cleave to the house of Ya`akov.";

yng[2] = "And peoples have taken them, And have brought them in unto their place, And the house of Israel have inherited them, On the land of Jehovah, For men-servants and for maid-servants, And they have been captors of their captors, And have ruled over their exactors.";
dby[2] = "And the peoples shall take them and bring them to their place; and the house of Israel shall possess them in the land of Jehovah for servants and handmaids; and they shall take them captive whose captives they were, and they shall rule over their oppressors.";
