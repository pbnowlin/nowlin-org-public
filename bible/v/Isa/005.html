csb[1] = "I will sing about the one I love, a song about my loved one\'s vineyard: The one I love had a vineyard on a very fertile hill.";
csb[2] = "He broke up the soil, cleared it of stones, and planted it with the finest vines. He built a tower in the middle of it and even dug out a winepress there. He expected it to yield good grapes, but it yielded worthless grapes.";
csb[3] = "So now, residents of Jerusalem and men of Judah, please judge between me and my vineyard.";
csb[4] = "What more could I have done for my vineyard than I did? Why, when I expected a yield of good grapes, did it yield worthless grapes?";
csb[5] = "Now I will tell you what I am about to do to my vineyard: I will remove its hedge, and it will be consumed; I will tear down its wall, and it will be trampled.";
csb[6] = "I will make it a wasteland. It will not be pruned or weeded; thorns and briers will grow up. I will also give orders to the clouds that rain should not fall on it.";
csb[7] = "For the vineyard of the LORD of Armies is the house of Israel, and the men of Judah, the plant he delighted in. He expected justice but saw injustice; he expected righteousness, but heard cries of despair.";
csb[8] = "Woe to those who add house to house and join field to field until there is no more room and you alone are left in the land.";
csb[9] = "I heard the LORD of Armies say: Indeed, many houses will become desolate, grand and lovely ones without inhabitants.";
csb[10] = "For a ten-acre vineyard will yield only six gallons of wine, and ten bushels of seed will yield only one bushel of grain.";
csb[11] = "Woe to those who rise early in the morning in pursuit of beer, who linger into the evening, inflamed by wine.";
csb[12] = "At their feasts they have lyre, harp, tambourine, flute, and wine. They do not perceive the LORD\'s actions, and they do not see the work of his hands.";
csb[13] = "Therefore my people will go into exile because they lack knowledge; her dignitaries are starving, and her masses are parched with thirst.";
csb[14] = "Therefore Sheol enlarges its throat and opens wide its enormous jaws, and down go Zion\'s dignitaries, her masses, her crowds, and those who celebrate in her!";
csb[15] = "Humanity is brought low, each person is humbled, and haughty eyes are humbled.";
csb[16] = "But the LORD of Armies is exalted by his justice, and the holy God shows that he is holy through his righteousness.";
csb[17] = "Lambs will graze as if in their own pastures, and resident aliens will eat among the ruins of the rich.";
csb[18] = "Woe to those who drag iniquity with cords of deceit and pull sin along with cart ropes,";
csb[19] = "to those who say: &quot;Let him hurry up and do his work quickly so that we can see it! Let the plan of the Holy One of Israel take place so that we can know it! &quot;";
csb[20] = "Woe to those who call evil good and good evil, who substitute darkness for light and light for darkness, who substitute bitter for sweet and sweet for bitter.";
csb[21] = "Woe to those who consider themselves wise and judge themselves clever.";
csb[22] = "Woe to those who are heroes at drinking wine, who are champions at pouring beer,";
csb[23] = "who acquit the guilty for a bribe and deprive the innocent of justice.";
csb[24] = "Therefore, as a tongue of fire consumes straw and as dry grass shrivels in the flame, so their roots will become like something rotten and their blossoms will blow away like dust, for they have rejected the instruction of the LORD of Armies, and they have despised the word of the Holy One of Israel.";
csb[25] = "Therefore the LORD\'s anger burned against his people. He raised his hand against them and struck them; the mountains quaked, and their corpses were like garbage in the streets. In all this, his anger has not turned away, and his hand is still raised to strike.";
csb[26] = "He raises a signal flag for the distant nations and whistles for them from the ends of the earth. Look -- how quickly and swiftly they come!";
csb[27] = "None of them grows weary or stumbles; no one slumbers or sleeps. No belt is loose and no sandal strap broken.";
csb[28] = "Their arrows are sharpened, and all their bows strung. Their horses\' hooves are like flint; their chariot wheels are like a whirlwind.";
csb[29] = "Their roaring is like a lion\'s; they roar like young lions; they growl and seize their prey and carry it off, and no one can rescue it.";
csb[30] = "On that day they will roar over it, like the roaring of the sea. When one looks at the land, there will be darkness and distress; light will be obscured by clouds.";

yng[19] = "Who are saying, `Let Him hurry, Let Him hasten His work, that we may see, And let the counsel of the Holy One of Israel Draw near and come, and we know.\'";
dby[19] = "who say, Let him hasten, let him speed his work, that we may see [it]; and let the counsel of the Holy One of Israel draw nigh and come, that we may know it!";
web[19] = "That say, Let him make speed, [and] hasten his work, that we may see [it]: and let the counsel of the Holy One of Israel draw nigh and come, that we may know [it]!";
hnv[19] = "Who say, &quot;Let him make speed, let him hasten his work, that we may see it; And let the counsel of the Holy One of Yisra\'el draw near and come, That we may know it!&quot;";
vul[19] = "qui dicitis festinet et cito veniat opus eius ut videamus et adpropiet et veniat consilium Sancti Israhel et sciemus illud";
kjv[20] = "Woe unto them that call evil good, and good evil; that put darkness for light, and light for darkness; that put bitter for sweet, and sweet for bitter!";
rsv[20] = "Woe to those who call evil good and good evil, who put darkness for light and light for darkness, who put bitter for sweet and sweet for bitter!";
asv[20] = "Woe unto them that call evil good, and good evil; that put darkness for light, and light for darkness; that put bitter for sweet, and sweet for bitter!";
yng[20] = "Wo [to] those saying to evil `good,\' And to good `evil,\' Putting darkness for light, and light for darkness, Putting bitter for sweet, and sweet for bitter.";
dby[20] = "Woe unto them who call evil good, and good evil; who put darkness for light, and light for darkness; who put bitter for sweet, and sweet for bitter!";
web[20] = "Woe to them that call evil good, and good evil; that put darkness for light, and light for darkness; that put bitter for sweet, and sweet for bitter!";
hnv[20] = "Woe to those who call evil good, and good evil; Who put darkness for light, And light for darkness; Who put bitter for sweet, And sweet for bitter!";
vul[20] = "vae qui dicitis malum bonum et bonum malum ponentes tenebras lucem et lucem tenebras ponentes amarum in dulce et dulce in amarum";
kjv[21] = "Woe unto [them that are] wise in their own eyes, and prudent in their own sight!";
rsv[21] = "Woe to those who are wise in their own eyes, and shrewd in their own sight!";
asv[21] = "Woe unto them that are wise in their own eyes, and prudent in their own sight!";
yng[21] = "Wo [to] the wise in their own eyes, And -- before their own faces -- intelligent!";
dby[21] = "Woe unto them that are wise in their own eyes, and intelligent in their own esteem!";
web[21] = "Woe to [them that are] wise in their own eyes, and prudent in their own sight!";
hnv[21] = "Woe to those who are wise in their own eyes, And prudent in their own sight!";
vul[21] = "vae qui sapientes estis in oculis vestris et coram vobismet ipsis prudentes";
kjv[22] = "Woe unto [them that are] mighty to drink wine, and men of strength to mingle strong drink:";
rsv[22] = "Woe to those who are heroes at drinking wine, and valiant men in mixing strong drink,";
asv[22] = "Woe unto them that are mighty to drink wine, and men of strength to mingle strong drink;";
yng[22] = "Wo [to] the mighty to drink wine, And men of strength to mingle strong drink.";
dby[22] = "Woe unto them that are mighty for drinking wine, and men valiant to mix strong drink;";
web[22] = "Woe to [them that are] mighty to drink wine, and men of strength to mingle strong drink:";
hnv[22] = "Woe to those who are mighty to drink wine, And champions at mixing strong drink;";
vul[22] = "vae qui potentes estis ad bibendum vinum et viri fortes ad miscendam ebrietatem";
kjv[23] = "Which justify the wicked for reward, and take away the righteousness of the righteous from him!";
rsv[23] = "who acquit the guilty for a bribe, and deprive the innocent of his right!";
asv[23] = "that justify the wicked for a bribe, and take away the righteousness of the righteous from him!";
yng[23] = "Declaring righteous the wicked for a bribe, And the righteousness of the righteous They turn aside from him.";
dby[23] = "who justify the wicked for a bribe, and turn away the righteousness of the righteous from them!";
web[23] = "Who justify the wicked for reward, and take away the righteousness of the righteous from him!";
hnv[23] = "Who acquit the guilty for a bribe, But deny justice for the innocent!";
vul[23] = "qui iustificatis impium pro muneribus et iustitiam iusti aufertis ab eo";
kjv[24] = "Therefore as the fire devoureth the stubble, and the flame consumeth the chaff, [so] their root shall be as rottenness, and their blossom shall go up as dust: because they have cast away the law of the LORD of hosts, and despised the word of the Holy One of Israel.";
rsv[24] = "Therefore, as the tongue of fire devours the stubble, and as dry grass sinks down in the flame, so their root will be as rottenness, and their blossom go up like dust; for they have rejected the law of the LORD of hosts, and have despised the word of the Holy One of Israel.";
asv[24] = "Therefore as the tongue of fire devoureth the stubble, and as the dry grass sinketh down in the flame, so their root shall be as rottenness, and their blossom shall go up as dust; because they have rejected the law of Jehovah of hosts, and despised the word of the Holy One of Israel.";
yng[24] = "Therefore, as a tongue of fire devoureth stubble, And flaming hay falleth, Their root is as muck, And their flower as dust goeth up. Because they have rejected the law of Jehovah of Hosts, And the saying of the Holy One of Israel despised.";
dby[24] = "Therefore as a tongue of fire devoureth the stubble, and dry grass sinketh down in the flame, their root shall be as rottenness, and their blossom shall go up as dust; for they have rejected the law of Jehovah of hosts, and despised the word of the Holy One of Israel.";
web[24] = "Therefore as the fire devoureth the stubble, and the flame consumeth the chaff, [so] their root shall be as rottenness, and their blossom shall go up as dust: because they have cast away the law of the LORD of hosts, and despised the word of the Holy One of Israel.";
hnv[24] = "Therefore as the tongue of fire devours the stubble, And as the dry grass sinks down in the flame, So their root shall be as rottenness, And their blossom shall go up as dust; Because they have rejected Yaweh\'s law of Hosts, And despised the word of the Holy One of Yisra\'el.";
vul[24] = "propter hoc sicut devorat stipulam lingua ignis et calor flammae exurit sic radix eorum quasi favilla erit et germen eorum ut pulvis ascendet abiecerunt enim legem Domini exercituum et eloquium Sancti Israhel blasphemaverunt";
kjv[25] = "Therefore is the anger of the LORD kindled against his people, and he hath stretched forth his hand against them, and hath smitten them: and the hills did tremble, and their carcases [were] torn in the midst of the streets. For all this his anger is not turned away, but his hand [is] stretched out still.";
rsv[25] = "Therefore the anger of the LORD was kindled against his people, and he stretched out his hand against them and smote them, and the mountains quaked; and their corpses were as refuse in the midst of the streets. For all this his anger is not turned away and his hand is stretched out still.";
asv[25] = "Therefore is the anger of Jehovah kindled against his people, and he hath stretched forth his hand against them, and hath smitten them; and the mountains tremble, and their dead bodies are as refuse in the midst of the streets. For all this his anger is not turned away, but his hand is stretched out still.";
yng[25] = "Therefore hath the anger of Jehovah burned among His people, And He stretcheth out His hand against it, And smiteth it, and the mountains tremble, And their carcase is as filth in the midst of the out-places. With all this His anger did not turn back, And still His hand is stretched out!";
dby[25] = "Therefore is the anger of Jehovah kindled against his people, and he hath stretched out his hand against them and hath smitten them; and the mountains trembled, and their carcases are become as dung in the midst of the streets. For all this his anger is not turned away, and his hand is stretched out still.";
web[25] = "Therefore is the anger of the LORD kindled against his people, and he hath stretched forth his hand against them, and hath smitten them: and the hills trembled, and their carcasses [were] torn in the midst of the streets. For all this his anger is not turned away, but his hand [is] stretched out still.";
hnv[25] = "Therefore the LORD\'s anger burns against his people, And he has stretched out his hand against them, and has struck them. The mountains tremble, And their dead bodies are as refuse in the midst of the streets. For all this, his anger is not turned away, But his hand is still stretched out.";
vul[25] = "ideo iratus est furor Domini in populo suo et extendit manum suam super eum et percussit eum et conturbati sunt montes et facta sunt morticina eorum quasi stercus in medio platearum in omnibus his non est aversus furor eius sed adhuc manus eius extenta";
kjv[26] = "And he will lift up an ensign to the nations from far, and will hiss unto them from the end of the earth: and, behold, they shall come with speed swiftly:";
rsv[26] = "He will raise a signal for a nation afar off, and whistle for it from the ends of the earth; and lo, swiftly, speedily it comes!";
asv[26] = "And he will lift up an ensign to the nations from far, and will hiss for them from the end of the earth; and, behold, they shall come with speed swiftly.";
yng[26] = "And He lifted up an ensign to nations afar off, And hissed to it from the end of the earth, And lo, with haste, swift it cometh.";
dby[26] = "And he will lift up a banner to the nations afar off, and will hiss for one from the end of the earth; and behold, it will come rapidly [and] lightly.";
web[26] = "And he will lift up an ensign to the nations from afar, and will hiss to them from the end of the earth: and behold, they shall come with speed swiftly:";
hnv[26] = "He will lift up a banner to the nations from far, And he will whistle for them from the end of the eretz. Behold, they will come speedily and swiftly.";
vul[26] = "et levabit signum nationibus procul et sibilabit ad eum de finibus terrae et ecce festinus velociter veniet";
kjv[27] = "None shall be weary nor stumble among them; none shall slumber nor sleep; neither shall the girdle of their loins be loosed, nor the latchet of their shoes be broken:";
rsv[27] = "None is weary, none stumbles, none slumbers or sleeps, not a waistcloth is loose, not a sandal-thong broken;";
asv[27] = "None shall be weary nor stumble among them; none shall slumber nor sleep; neither shall the girdle of their loins be loosed, nor the latchet of their shoes be broken:";
yng[27] = "There is none weary, nor stumbling in it, It doth not slumber, nor sleep, Nor opened hath been the girdle of its loins, Nor drawn away the latchet of its sandals.";
dby[27] = "None among them is weary, none stumbleth; they slumber not, nor sleep; none hath the girdle of his loins loosed, nor the thong of his sandals broken;";
web[27] = "None shall be weary nor stumble among them; none shall slumber nor sleep; neither shall the girdle of their loins be loosed, nor the latchet of their shoes be broken:";
hnv[27] = "None shall be weary nor stumble among them; None shall slumber nor sleep; Neither shall the belt of their loins be untied, Nor the latchet of their shoes be broken:";
vul[27] = "non est deficiens neque laborans in eo non dormitabit neque dormiet neque solvetur cingulum renum eius nec rumpetur corrigia calciamenti eius";
kjv[28] = "Whose arrows [are] sharp, and all their bows bent, their horses\' hoofs shall be counted like flint, and their wheels like a whirlwind:";
rsv[28] = "their arrows are sharp, all their bows bent, their horses\' hoofs seem like flint, and their wheels like the whirlwind.";
asv[28] = "whose arrows are sharp, and all their bows bent; their horses\' hoofs shall be accounted as flint, and their wheels as a whirlwind:";
yng[28] = "Whose arrows [are] sharp, and all its bows bent, Hoofs of its horses as flint have been reckoned, And its wheels as a hurricane!";
dby[28] = "their arrows are sharp, and all their bows bent; their horses\' hoofs are reckoned as the flint, and their wheels as a whirlwind.";
web[28] = "Whose arrows [are] sharp, and all their bows bent, their horses\' hoofs shall be counted like flint, and their wheels like a whirlwind:";
hnv[28] = "Whose arrows are sharp, And all their bows bent. Their horses\' hoofs will be like flint, And their wheels like a whirlwind.";
vul[28] = "sagittae eius acutae et omnes arcus eius extenti ungulae equorum eius ut silex et rotae eius quasi impetus tempestatis";
kjv[29] = "Their roaring [shall be] like a lion, they shall roar like young lions: yea, they shall roar, and lay hold of the prey, and shall carry [it] away safe, and none shall deliver [it].";
rsv[29] = "Their roaring is like a lion, like young lions they roar; they growl and seize their prey, they carry it off, and none can rescue.";
asv[29] = "their roaring shall be like a lioness, they shall roar like young lions; yea, they shall roar, and lay hold of the prey, and carry it away safe, and there shall be none to deliver.";
yng[29] = "Its roaring [is] like a lioness, It roareth like young lions, And it howleth, and seizeth prey, And carrieth away safely, and there is none delivering.";
dby[29] = "Their roaring is like a lioness, they roar as the young lions; yea, they growl, and snatch the prey, and carry it away safe, and there is none to deliver;";
web[29] = "Their roaring [shall be] like a lion, they shall roar like young lions: yes, they shall roar, and lay hold of the prey, and shall carry [it] away safe, and none shall deliver [it].";
hnv[29] = "Their roaring will be like a lioness. They will roar like young lions. Yes, they shall roar, And seize their prey and carry it off, And there will be no one to deliver.";
vul[29] = "rugitus eius ut leonis rugiet ut catuli leonum et frendet et tenebit praedam et amplexabitur et non erit qui eruat";
kjv[30] = "And in that day they shall roar against them like the roaring of the sea: and if [one] look unto the land, behold darkness [and] sorrow, and the light is darkened in the heavens thereof.";
rsv[30] = "They will growl over it on that day, like the roaring of the sea. And if one look to the land, behold, darkness and distress; and the light is darkened by its clouds.";
asv[30] = "And they shall roar against them in that day like the roaring of the sea: and if one look unto the land, behold, darkness [and] distress; and the light is darkened in the clouds thereof.";
yng[30] = "And it howleth against it in that day as the howling of a sea, And it hath looked attentively to the land, And lo, darkness -- distress, And light hath been darkened by its abundance!";
dby[30] = "and they shall roar against them in that day like the roaring of the sea. And if one look upon the earth, behold darkness [and] distress, and the light is darkened in the heavens thereof.";
web[30] = "And in that day they shall roar against them like the roaring of the sea: and if [one] looketh to the land, behold darkness [and] sorrow, and the light is darkened in its heavens.";
hnv[30] = "They will roar against thsem in that day like the roaring of the sea. If one looks to the land, behold, darkness and distress. The light is darkened in its clouds.";
vul[30] = "et sonabit super eum in die illa sicut sonitus maris aspiciemus in terram et ecce tenebrae tribulationis et lux obtenebrata est in caligine eius";
