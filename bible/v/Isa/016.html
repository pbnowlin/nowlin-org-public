csb[1] = "Send lambs to the ruler of the land, from Sela in the desert to the mountain of Daughter Zion.";
csb[2] = "Like a bird fleeing, forced from the nest, the daughters of Moab will be at the fords of the Arnon.";
csb[3] = "Give us counsel and make a decision. Shelter us at noonday with shade that is as dark as night. Hide the refugees; do not betray the one who flees.";
csb[4] = "Let my refugees stay with you; be a refuge for Moab from the aggressor. When the oppressor has gone, destruction has ended, and marauders have vanished from the land,";
csb[5] = "a throne will be established in love, and one will sit on it faithfully in the tent of David, judging and pursuing what is right, quick to execute justice.";
csb[6] = "We have heard of Moab\'s pride -- how very proud he is -- his haughtiness, his pride, his arrogance, and his empty boasting.";
csb[7] = "Therefore let Moab wail; let every one of them wail for Moab. You who are completely devastated, mourn for the raisin cakes of Kir-hareseth.";
csb[8] = "For Heshbon\'s terraced vineyards and the grapevines of Sibmah have withered. The rulers of the nations have trampled its choice vines that reached as far as Jazer and spread to the desert. Their shoots spread out and reached the sea.";
csb[9] = "So I join with Jazer to weep for the vines of Sibmah; I drench Heshbon and Elealeh with my tears. Triumphant shouts have fallen silent over your summer fruit and your harvest.";
csb[10] = "Joy and rejoicing have been removed from the orchard; no one is singing or shouting for joy in the vineyards. No one tramples grapes in the winepresses. I have put an end to the shouting.";
csb[11] = "Therefore I moan like the sound of a lyre for Moab, as does my innermost being for Kir-heres.";
csb[12] = "When Moab appears and tires himself out on the high place and comes to his sanctuary to pray, it will do him no good.";
csb[13] = "This is the message that the LORD previously announced about Moab.";
csb[14] = "And now the LORD says, &quot;In three years, as a hired worker counts years, Moab\'s splendor will become an object of contempt, in spite of a very large population. And those who are left will be few and weak.&quot;";
kjv[1] = "Send ye the lamb to the ruler of the land from Sela to the wilderness, unto the mount of the daughter of Zion.";
rsv[1] = "They have sent lambs to the ruler of the land, from Sela, by way of the desert, to the mount of the daughter of Zion.";
asv[1] = "Send ye the lambs for the ruler of the land from Selah to the wilderness, unto the mount of the daughter of Zion.";
yng[1] = "Send ye a lamb [to] the ruler of the land, From Selah in the wilderness, Unto the mount of the daughter of Zion.";
dby[1] = "Send the lamb of the ruler of the land from the rock to the wilderness, -- unto the mount of the daughter of Zion.";
web[1] = "Send ye the lamb to the ruler of the land from Sela to the wilderness, to the mount of the daughter of Zion.";
hnv[1] = "Send the lambs for the ruler of the land from Selah to the wilderness, to the mountain of the daughter of Tziyon.";
vul[1] = "emitte agnum dominatorem terrae de Petra deserti ad montem filiae Sion";
kjv[2] = "For it shall be, [that], as a wandering bird cast out of the nest, [so] the daughters of Moab shall be at the fords of Arnon.";
rsv[2] = "Like fluttering birds, like scattered nestlings, so are the daughters of Moab at the fords of the Arnon.";
asv[2] = "For it shall be that, as wandering birds, as a scattered nest, so shall the daughters of Moab be at the fords of the Arnon.";
yng[2] = "And it hath come to pass, As a wandering bird, a nest cast out, Are daughters of Moab, [at] fords of Arnon.";
dby[2] = "And it shall be [that] as a wandering bird, [as] a scattered nest, so shall the daughters of Moab be at the fords of the Arnon.";
web[2] = "For it shall be, [that], as a wandering bird cast out of the nest, [so] the daughters of Moab shall be at the fords of Arnon.";
hnv[2] = "For it shall be that, as wandering birds, as a scattered nest, so shall the daughters of Mo\'av be at the fords of the Arnon.";
vul[2] = "et erit sicut avis fugiens et pulli de nido avolantes sic erunt filiae Moab in transcensu Arnon";
kjv[3] = "Take counsel, execute judgment; make thy shadow as the night in the midst of the noonday; hide the outcasts; bewray not him that wandereth.";
rsv[3] = "&quot;Give counsel, grant justice; make your shade like night at the height of noon; hide the outcasts, betray not the fugitive;";
asv[3] = "Give counsel, execute justice; make thy shade as the night in the midst of the noonday; hide the outcasts; betray not the fugitive.";
yng[3] = "Bring ye in counsel, do judgment, Make as night thy shadow in the midst of noon, Hide outcasts, the wanderer reveal not.";
dby[3] = "Bring in counsel, execute justice; make thy shadow as the night in the midst of noonday; hide the outcasts, discover not the fugitive.";
web[3] = "Take counsel, execute judgment; make thy shadow as the night in the midst of the noon-day; hide the outcasts; discover not him that wandereth.";
hnv[3] = "Give counsel, execute justice; make your shade as the night in the midst of the noonday; hide the outcasts; don\'t betray the fugitive.";
vul[3] = "ini consilium coge concilium pone quasi noctem umbram tuam in meridie absconde fugientes et vagos ne prodas";
kjv[4] = "Let mine outcasts dwell with thee, Moab; be thou a covert to them from the face of the spoiler: for the extortioner is at an end, the spoiler ceaseth, the oppressors are consumed out of the land.";
rsv[4] = "let the outcasts of Moab sojourn among you; be a refuge to them from the destroyer. When the oppressor is no more, and destruction has ceased, and he who tramples under foot has vanished from the land,";
asv[4] = "Let mine outcasts dwell with thee; as for Moab, be thou a covert to him from the face of the destroyer. For the extortioner is brought to nought, destruction ceaseth, the oppressors are consumed out of the land.";
yng[4] = "Sojourn in thee do My outcasts, O Moab, Be a secret hiding-place to them, From the face of a destroyer, For ceased hath the extortioner, Finished hath been a destroyer, Consumed the treaders down out of the land.";
dby[4] = "Let mine outcasts dwell with thee, Moab; be thou a covert to them from the face of the waster. For the extortioner is at an end, the wasting hath ceased, the oppressors are consumed out of the land.";
web[4] = "Let my outcasts dwell with thee, Moab; be thou a covert to them from the face of the spoiler: for the extortioner is at an end, the spoiler ceaseth, the oppressors are consumed out of the land.";
hnv[4] = "Let my outcasts dwell with you; as for Mo\'av, be a covert to him from the face of the destroyer. For the extortioner is brought to nothing, destruction ceases, the oppressors are consumed out of the land.";
vul[4] = "habitabunt apud te profugi mei Moab esto latibulum eorum a facie vastatoris finitus est enim pulvis consummatus est miser defecit qui conculcabat terram";
kjv[5] = "And in mercy shall the throne be established: and he shall sit upon it in truth in the tabernacle of David, judging, and seeking judgment, and hasting righteousness.";
rsv[5] = "then a throne will be established in steadfast love and on it will sit in faithfulness in the tent of David one who judges and seeks justice and is swift to do righteousness.&quot;";
asv[5] = "And a throne shall be established in lovingkindness; and one shall sit thereon in truth, in the tent of David, judging, and seeking justice, and swift to do righteousness.";
yng[5] = "And established in kindness is the throne, And [one] hath sat on it in truth, in the tent of David, Judging and seeking judgment, and hasting righteousness.";
dby[5] = "And a throne shall be established in mercy: and in the tent of David there shall sit upon it, in truth, one judging and seeking justice and hastening righteousness.";
web[5] = "And in mercy shall the throne be established: and he shall sit upon it in truth in the tabernacle of David, judging, and seeking judgment, and hasting righteousness.";
hnv[5] = " A throne shall be established in lovingkindness; and one shall sit thereon in truth, in the tent of David, judging, and seeking justice, and swift to do righteousness.";
vul[5] = "et praeparabitur in misericordia solium et sedebit super eum in veritate in tabernaculo David iudicans et quaerens iudicium et velociter reddens quod iustum est";
kjv[6] = "We have heard of the pride of Moab; [he is] very proud: [even] of his haughtiness, and his pride, and his wrath: [but] his lies [shall] not [be] so.";
rsv[6] = "We have heard of the pride of Moab, how proud he was; of his arrogance, his pride, and his insolence--his boasts are false.";
asv[6] = "We have heard of the pride of Moab, [that] he is very proud; even of his arrogancy, and his pride, and his wrath; his boastings are nought.";
yng[6] = "We have heard of the pride of Moab -- very proud, His pride, and his arrogance, and his wrath, Not right [are] his devices.";
dby[6] = "We have heard of the arrogance of Moab, -- [he is] very proud, -- of his pride, and his arrogance, and his wrath: his pratings are vain.";
web[6] = "We have heard of the pride of Moab; [he is] very proud: [even] of his haughtiness, and his pride, and his wrath: [but] his lies [shall] not [be] so.";
hnv[6] = "We have heard of the pride of Mo\'av, [that] he is very proud; even of his arrogance, and his pride, and his wrath; his boastings are nothing.";
vul[6] = "audivimus superbiam Moab superbus est valde superbia eius et arrogantia eius et indignatio eius plus quam fortitudo eius";
kjv[7] = "Therefore shall Moab howl for Moab, every one shall howl: for the foundations of Kirhareseth shall ye mourn; surely [they are] stricken.";
rsv[7] = "Therefore let Moab wail, let every one wail for Moab. Mourn, utterly stricken, for the raisin-cakes of Kir-har\'eseth.";
asv[7] = "Therefore shall Moab wail for Moab, every one shall wail: for the raisin-cakes of Kir-hareseth shall ye mourn, utterly stricken.";
yng[7] = "Therefore howl doth Moab for Moab, all of it doth howl, For the grape-cakes of Kir-Hareseth it meditateth, Surely they are smitten.";
dby[7] = "Therefore shall Moab howl for Moab; every one of them shall howl. For the foundations of Kirhareseth shall ye mourn, verily afflicted.";
web[7] = "Therefore shall Moab howl for Moab, every one shall howl: for the foundations of Kir-hareseth shall ye mourn; surely [they are] stricken.";
hnv[7] = "Therefore shall Mo\'av wail for Mo\'av, everyone shall wail: for the raisin-cakes of Kir-Hareset shall you mourn, utterly stricken.";
vul[7] = "idcirco ululabit Moab ad Moab universus ululabit his qui laetantur super muro cocti lateris loquimini plagas suas";
kjv[8] = "For the fields of Heshbon languish, [and] the vine of Sibmah: the lords of the heathen have broken down the principal plants thereof, they are come [even] unto Jazer, they wandered [through] the wilderness: her branches are stretched out, they are gone over the sea.";
rsv[8] = "For the fields of Heshbon languish, and the vine of Sibmah; the lords of the nations have struck down its branches, which reached to Jazer and strayed to the desert; its shoots spread abroad and passed over the sea.";
asv[8] = "For the fields of Heshbon languish, [and] the vine of Sibmah; the lords of the nations have broken down the choice branches thereof, which reached even unto Jazer, which wandered into the wilderness; its shoots were spread abroad, they passed over the sea.";
yng[8] = "Because fields of Heshbon languish, The vine of Sibmah, Lords of nations did beat her choice vines, Unto Jazer they have come, They have wandered in a wilderness, Her plants have spread themselves, They have passed over a sea.";
dby[8] = "For the fields of Heshbon languish, the vine of Sibmah; the lords of the nations have broken down its choice plants: they reached unto Jaazer, they wandered [through] the wilderness; its shoots stretched out, they went beyond the sea.";
web[8] = "For the fields of Heshbon languish, [and] the vine of Sibmah: the lords of the heathen have broken down her principal plants, they have come [even] to Jazer, they wandered [through] the wilderness: her branches are extended, they have gone over the sea.";
hnv[8] = "For the fields of Heshbon languish, [and] the vine of Sivmah; the lords of the nations have broken down the choice branches of it, which reached even to Ya`zer, which wandered into the wilderness; its shoots were spread abroad, they passed over the sea.";
vul[8] = "quoniam suburbana Esebon deserta sunt et vinea Sabama domini gentium exciderunt flagella eius usque ad Iazer pervenerunt erraverunt in deserto propagines eius relictae sunt transierunt mare";
kjv[9] = "Therefore I will bewail with the weeping of Jazer the vine of Sibmah: I will water thee with my tears, O Heshbon, and Elealeh: for the shouting for thy summer fruits and for thy harvest is fallen.";
rsv[9] = "Therefore I weep with the weeping of Jazer for the vine of Sibmah; I drench you with my tears, O Heshbon and Ele-a\'leh; for upon your fruit and your harvest the battle shout has fallen.";
asv[9] = "Therefore I will weep with the weeping of Jazer for the vine of Sibmah; I will water thee with my tears, O Heshbon, and Elealeh: for upon thy summer fruits and upon thy harvest the [battle] shout is fallen.";
yng[9] = "Therefore I weep with the weeping of Jazer, The vine of Sibmah, I water thee [with] my tear, O Heshbon and Elealeh, For -- for thy summer fruits, and for thy harvest, The shouting hath fallen.";
dby[9] = "Therefore I will weep with the weeping of Jaazer for the vine of Sibmah; with my tears will I water thee, Heshbon, and Elealeh, for a cry is fallen upon thy summer fruits and upon thy harvest.";
web[9] = "Therefore I will bewail with the weeping of Jazer the vine of Sibmah: I will water thee with my tears, O Heshbon, and Elealeh: for the shouting for thy summer fruits and for thy harvest is fallen.";
hnv[9] = "Therefore I will weep with the weeping of Ya`zer for the vine of Sivmah; I will water you with my tears, Heshbon, and El`aleh: for on your summer fruits and on your harvest the [battle] shout is fallen.";
vul[9] = "super hoc plorabo in fletu Iazer vineam Sabama inebriabo te lacrima mea Esebon et Eleale quoniam super vindemiam tuam et super messem tuam vox calcantium inruit";
kjv[10] = "And gladness is taken away, and joy out of the plentiful field; and in the vineyards there shall be no singing, neither shall there be shouting: the treaders shall tread out no wine in [their] presses; I have made [their vintage] shouting to cease.";
rsv[10] = "And joy and gladness are taken away from the fruitful field; and in the vineyards no songs are sung, no shouts are raised; no treader treads out wine in the presses; the vintage shout is hushed.";
asv[10] = "And gladness is taken away, and joy out of the fruitful field; and in the vineyards there shall be no singing, neither joyful noise: no treader shall tread out wine in the presses; I have made the [vintage] shout to cease.";
yng[10] = "And removed have been gladness and joy from the fruitful field, And in vineyards they sing not, nor shout, Wine in the presses treadeth not the treader, Shouting I have caused to cease.";
dby[10] = "And joy and gladness is taken away out of the fruitful field; and in the vineyards there is no singing, neither is there shouting: the treaders tread out no wine in the presses, I have made the cry [of the winepress] to cease.";
web[10] = "And gladness is taken away, and joy from the plentiful field; and in the vineyards there shall be no singing, neither shall there be shouting: the treaders shall tread out no wine in [their] presses; I have made [their vintage]-shouting to cease.";
hnv[10] = "Gladness is taken away, and joy out of the fruitful field; and in the vineyards there shall be no singing, neither joyful noise: nobody shall tread out wine in the presses; I have made the [vintage] shout to cease.";
vul[10] = "et auferetur laetitia et exultatio de Carmelo et in vineis non exultabit neque iubilabit vinum in torculari non calcabit qui calcare consueverat vocem calcantium abstuli";
kjv[11] = "Wherefore my bowels shall sound like an harp for Moab, and mine inward parts for Kirharesh.";
rsv[11] = "Therefore my soul moans like a lyre for Moab, and my heart for Kir-he\'res.";
asv[11] = "Wherefore my heart soundeth like a harp for Moab, and mine inward parts for Kir-heres.";
yng[11] = "Therefore my bowels for Moab as a harp do sound, And mine inward parts for Kir-Haresh.";
dby[11] = "Therefore my bowels sound like a harp for Moab, and mine inward parts for Kirheres.";
web[11] = "Wherefore my bowels shall sound like a harp for Moab, and my inward parts for Kir-haresh.";
hnv[11] = "Why my heart sounds like a harp for Mo\'av, and my inward parts for Kir-Heres.";
vul[11] = "super hoc venter meus ad Moab quasi cithara sonabit et viscera mea ad murum cocti lateris";
kjv[12] = "And it shall come to pass, when it is seen that Moab is weary on the high place, that he shall come to his sanctuary to pray; but he shall not prevail.";
rsv[12] = "And when Moab presents himself, when he wearies himself upon the high place, when he comes to his sanctuary to pray, he will not prevail.";
asv[12] = "And it shall come to pass, when Moab presenteth himself, when he wearieth himself upon the high place, and shall come to his sanctuary to pray, that he shall not prevail.";
yng[12] = "And it hath come to pass, when it hath been seen, That weary hath been Moab on the high place, And he hath come unto his sanctuary to pray, And is not able.";
dby[12] = "And it shall come to pass, when Moab shall appear, shall weary himself on the high place, and enter into his sanctuary to pray, that he shall not prevail.";
web[12] = "And it shall come to pass, when it is seen that Moab is weary on the high place, that he shall come to his sanctuary to pray; but he shall not prevail.";
hnv[12] = "It shall happen, when Mo\'av presents himself, when he wearies himself on the high place, and shall come to his sanctuary to pray, that he shall not prevail.";
vul[12] = "et erit cum apparuerit quod laboravit Moab super excelsis suis ingredietur ad sancta sua ut obsecret et non valebit";
kjv[13] = "This [is] the word that the LORD hath spoken concerning Moab since that time.";
rsv[13] = "This is the word which the LORD spoke concerning Moab in the past.";
asv[13] = "This is the word that Jehovah spake concerning Moab in time past.";
yng[13] = "This [is] the word that Jehovah hath spoken unto Moab from that time,";
dby[13] = "This is the word which Jehovah hath spoken from of old concerning Moab.";
web[13] = "This [is] the word that the LORD hath spoken concerning Moab since that time.";
hnv[13] = "This is the word that the LORD spoke concerning Mo\'av in time past.";
vul[13] = "hoc verbum quod locutus est Dominus ad Moab ex tunc";
kjv[14] = "But now the LORD hath spoken, saying, Within three years, as the years of an hireling, and the glory of Moab shall be contemned, with all that great multitude; and the remnant [shall be] very small [and] feeble.";
rsv[14] = "But now the LORD says, &quot;In three years, like the years of a hireling, the glory of Moab will be brought into contempt, in spite of all his great multitude, and those who survive will be very few and feeble.&quot;";
asv[14] = "But now Jehovah hath spoken, saying, Within three years, as the years of a hireling, the glory of Moab shall be brought into contempt, with all his great multitude; and the remnant shall be very small and of no account.";
yng[14] = "And now hath Jehovah spoken, saying, `In three years, as years of an hireling, Lightly esteemed is the honour of Moab, With all the great multitude, And the remnant [is] little, small, not mighty!\'";
dby[14] = "And now Jehovah speaketh saying, Within three years, as the years of a hired servant, and the glory of Moab shall be brought to nothing, with all that great multitude; and the remnant shall be small, few, of no account.";
web[14] = "But now the LORD hath spoken, saying, Within three years, as the years of a hireling, and the glory of Moab shall be contemned, with all that great multitude; and the remnant [shall be] very small [and] feeble.";
hnv[14] = "But now the LORD has spoken, saying, Within three years, as the years of a hireling, the glory of Mo\'av shall be brought into contempt, with all his great multitude; and the remnant shall be very small and of no account.";
vul[14] = "et nunc locutus est Dominus dicens in tribus annis quasi anni mercennarii auferetur gloria Moab super omni populo multo et relinquetur parvus et modicus nequaquam multus";
</script>
