csb[1] = "&quot;Wake up, wake up; put on your strength, Zion! Put on your beautiful garments, Jerusalem, the Holy City! For the uncircumcised and the unclean will no longer enter you.";
csb[2] = "&quot;Stand up, shake the dust off yourself! Take your seat, Jerusalem. Remove the bonds from your neck, captive Daughter Zion.&quot;";
csb[3] = "For this is what the LORD says: &quot;You were sold for nothing, and you will be redeemed without silver.&quot;";
csb[4] = "For this is what the Lord GOD says: &quot;At first my people went down to Egypt to reside there, then Assyria oppressed them without cause.";
csb[5] = "&quot;So now what have I here&quot; -- this is the LORD\'s declaration -- &quot;that my people are taken away for nothing? Its rulers wail&quot; -- this is the LORD\'s declaration -- &quot;and my name is continually blasphemed all day long.";
csb[6] = "&quot;Therefore my people will know my name; therefore they will know on that day that I am he who says: Here I am.&quot;";
csb[7] = "How beautiful on the mountains are the feet of the herald, who proclaims peace, who brings news of good things, who proclaims salvation, who says to Zion, &quot;Your God reigns! &quot;";
csb[8] = "The voices of your watchmen -- they lift up their voices, shouting for joy together; for every eye will see when the LORD returns to Zion.";
csb[9] = "Be joyful, rejoice together, you ruins of Jerusalem! For the LORD has comforted his people; he has redeemed Jerusalem.";
csb[10] = "The LORD has displayed his holy arm in the sight of all the nations; all the ends of the earth will see the salvation of our God.";
csb[11] = "Leave, leave, go out from there! Do not touch anything unclean; go out from her, purify yourselves, you who carry the vessels of the LORD.";
csb[12] = "For you will not leave in a hurry, and you will not have to take flight; because the LORD is going before you, and the God of Israel is your rear guard.";
csb[13] = "See, my servant will be successful; he will be raised and lifted up and greatly exalted.";
csb[14] = "Just as many were appalled at you -- his appearance was so disfigured that he did not look like a man, and his form did not resemble a human being --";
csb[15] = "so he will sprinkle many nations. Kings will shut their mouths because of him, for they will see what had not been told them, and they will understand what they had not heard.";
kjv[1] = "Awake, awake; put on thy strength, O Zion; put on thy beautiful garments, O Jerusalem, the holy city: for henceforth there shall no more come into thee the uncircumcised and the unclean.";

yng[1] = "Awake, awake, put on thy strength, O Zion, Put on the garments of thy beauty, Jerusalem -- the Holy City; For enter no more into thee again, Do the uncircumcised and unclean.";
dby[1] = "Awake, awake; put on thy strength, O Zion; put on thy beautiful garments, Jerusalem, the holy city: for henceforth there shall no more come into thee the uncircumcised and the unclean.";

hnv[1] = "Awake, awake, put on your strength, Tziyon; put on your beautiful garments, Yerushalayim, the holy city: for henceforth there shall no more come into you the uncircumcised and the unclean.";
vul[1] = "consurge consurge induere fortitudine tua Sion induere vestimentis gloriae tuae Hierusalem civitas sancti quia non adiciet ultra ut pertranseat per te incircumcisus et inmundus";
kjv[2] = "Shake thyself from the dust; arise, [and] sit down, O Jerusalem: loose thyself from the bands of thy neck, O captive daughter of Zion.";
rsv[2] = "Shake yourself from the dust, arise, O captive Jerusalem; loose the bonds from your neck, O captive daughter of Zion.";
asv[2] = "Shake thyself from the dust; arise, sit [on thy throne], O Jerusalem: loose thyself from the bonds of thy neck, O captive daughter of Zion.";
yng[2] = "Shake thyself from dust, arise, sit, O Jerusalem, Bands of thy neck have loosed themselves, O captive, daughter of Zion.";
dby[2] = "Shake thyself from the dust; arise, sit down, Jerusalem: loose thyself from the bands of thy neck, captive daughter of Zion.";
web[2] = "Shake thyself from the dust; arise, [and] sit down, O Jerusalem: loose thyself from the bands of thy neck, O captive daughter of Zion.";
hnv[2] = " Shake yourself from the dust; arise, sit [on your throne], Yerushalayim: loose yourself from the bonds of your neck, captive daughter of Tziyon.";
vul[2] = "excutere de pulvere consurge sede Hierusalem solve vincula colli tui captiva filia Sion";
kjv[3] = "For thus saith the LORD, Ye have sold yourselves for nought; and ye shall be redeemed without money.";

asv[3] = "For thus saith Jehovah, Ye were sold for nought; and ye shall be redeemed without money.";
yng[3] = "For thus said Jehovah: `For nought ye have been sold, And not by money are ye redeemed.\'";
dby[3] = "For thus saith Jehovah: Ye have sold yourselves for nought, and ye shall be redeemed without money.";
web[3] = "For thus saith the LORD, Ye have sold yourselves for naught; and ye shall be redeemed without money.";
hnv[3] = "For thus says the LORD, You were sold for nothing; and you shall be redeemed without money.";
vul[3] = "quia haec dicit Dominus gratis venundati estis et sine argento redimemini";
kjv[4] = "For thus saith the Lord GOD, My people went down aforetime into Egypt to sojourn there; and the Assyrian oppressed them without cause.";
rsv[4] = "For thus says the Lord GOD: My people went down at the first into Egypt to sojourn there, and the Assyrian oppressed them for nothing.";
asv[4] = "For thus saith the Lord Jehovah, My people went down at the first into Egypt to sojourn there: and the Assyrian hath oppressed them without cause.";
yng[4] = "For thus said the Lord Jehovah: `To Egypt My people went down at first to sojourn there, And Asshur -- for nought he hath oppressed it.";
dby[4] = "For thus saith the Lord Jehovah: My people went down at the first into Egypt to sojourn there, and Assyria oppressed them without cause;";
web[4] = "For thus saith the Lord GOD, My people went down formerly into Egypt to sojourn there; and the Assyrian oppressed them without cause.";
hnv[4] = "For thus says the Lord GOD, My people went down at the first into Mitzrayim to sojourn there: and the Ashshur has oppressed them without cause.";
vul[4] = "quia haec dicit Dominus Deus in Aegyptum descendit populus meus in principio ut colonus esset ibi et Assur absque ulla causa calumniatus est eum";
kjv[5] = "Now therefore, what have I here, saith the LORD, that my people is taken away for nought? they that rule over them make them to howl, saith the LORD; and my name continually every day [is] blasphemed.";
rsv[5] = "Now therefore what have I here, says the LORD, seeing that my people are taken away for nothing? Their rulers wail, says the LORD, and continually all the day my name is despised.";

yng[5] = "And now, what -- to Me here, An affirmation of Jehovah, That taken is My people for nought? Its rulers cause howling, -- an affirmation of Jehovah, And continually all the day My name is despised.";
dby[5] = "and now, what have I here, saith Jehovah, that my people hath been taken away for nought? They that rule over them make them to howl, saith Jehovah; and continually all the day is my name scorned.";

kjv[7] = "How beautiful upon the mountains are the feet of him that bringeth good tidings, that publisheth peace; that bringeth good tidings of good, that publisheth salvation; that saith unto Zion, Thy God reigneth!";
rsv[7] = "How beautiful upon the mountains are the feet of him who brings good tidings, who publishes peace, who brings good tidings of good, who publishes salvation, who says to Zion, &quot;Your God reigns.&quot;";
asv[7] = "How beautiful upon the mountains are the feet of him that bringeth good tidings, that publisheth peace, that bringeth good tidings of good, that publisheth salvation, that saith unto Zion, Thy God reigneth!";
yng[7] = "How comely on the mountains, Have been the feet of one proclaiming tidings, Sounding peace, proclaiming good tidings, Sounding salvation, Saying to Zion, `Reigned hath thy God.\'";
dby[7] = "How beautiful upon the mountains are the feet of him that announceth glad tidings, that publisheth peace; that announceth glad tidings of good, that publisheth salvation, that saith unto Zion, Thy God reigneth!";

yng[8] = "The voice of thy watchmen! They have lifted up the voice, together they cry aloud, Because eye to eye they see, in Jehovah\'s turning back [to] Zion.";
