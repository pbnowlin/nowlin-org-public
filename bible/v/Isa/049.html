csb[1] = "Coasts and islands, listen to me; distant peoples, pay attention. The LORD called me before I was born. He named me while I was in my mother\'s womb.";
csb[2] = "He made my words like a sharp sword; he hid me in the shadow of his hand. He made me like a sharpened arrow; he hid me in his quiver.";
csb[3] = "He said to me, &quot;You are my servant, Israel, in whom I will be glorified.&quot;";
csb[4] = "But I myself said: I have labored in vain, I have spent my strength for nothing and futility; yet my vindication is with the LORD, and my reward is with my God.";
csb[5] = "And now, says the LORD, who formed me from the womb to be his servant, to bring Jacob back to him so that Israel might be gathered to him; for I am honored in the sight of the LORD, and my God is my strength --";
csb[6] = "he says, &quot;It is not enough for you to be my servant raising up the tribes of Jacob and restoring the protected ones of Israel. I will also make you a light for the nations, to be my salvation to the ends of the earth.&quot;";
csb[7] = "This is what the LORD, the Redeemer of Israel, his Holy One, says to one who is despised, to one abhorred by people, to a servant of rulers: &quot;Kings will see, princes will stand up, and they will all bow down because of the LORD, who is faithful, the Holy One of Israel -- and he has chosen you.&quot;";
csb[8] = "This is what the LORD says: I will answer you in a time of favor, and I will help you in the day of salvation. I will keep you, and I will appoint you to be a covenant for the people, to restore the land, to make them possess the desolate inheritances,";
csb[9] = "saying to the prisoners: Come out, and to those who are in darkness: Show yourselves. They will feed along the pathways, and their pastures will be on all the barren heights.";
csb[10] = "They will not hunger or thirst, the scorching heat or sun will not strike them; for their compassionate one will guide them, and lead them to springs.";
csb[11] = "I will make all my mountains into a road, and my highways will be raised up.";
csb[12] = "See, these will come from far away, from the north and from the west, and from the land of Sinim.";
csb[13] = "Shout for joy, you heavens! Earth, rejoice! Mountains break into joyful shouts! For the LORD has comforted his people, and will have compassion on his afflicted ones.";
csb[14] = "Zion says, &quot;The LORD has abandoned me; the Lord has forgotten me! &quot;";
csb[15] = "&quot;Can a woman forget her nursing child, or lack compassion for the child of her womb? Even if these forget, yet I will not forget you.";
csb[16] = "&quot;Look, I have inscribed you on the palms of my hands; your walls are continually before me.";
csb[17] = "&quot;Your builders hurry; those who destroy and devastate you will leave you.";
csb[18] = "&quot;Look up, and look around. They all gather together; they come to you. As I live&quot; -- this is the LORD\'s declaration -- &quot;you will wear all your children as jewelry, and put them on as a bride does.";
csb[19] = "&quot;For your waste and desolate places and your land marked by ruins -- will now be indeed too small for the inhabitants, and those who swallowed you up will be far away.";
csb[20] = "&quot;Yet as you listen, the children that you have been deprived of will say, \'This place is too small for me; make room for me so that I may settle.\'";
csb[21] = "&quot;Then you will say within yourself, \'Who fathered these for me? I was deprived of my children and unable to conceive, exiled and wandering -- but who brought them up? See, I was left by myself -- but these, where did they come from? \' &quot;";
csb[22] = "This is what the Lord GOD says: Look, I will lift up my hand to the nations, and raise my banner to the peoples. They will bring your sons in their arms, and your daughters will be carried on their shoulders.";
csb[23] = "Kings will be your guardians and their queens your nursing mothers. They will bow down to you with their faces to the ground and lick the dust at your feet. Then you will know that I am the LORD; those who put their hope in me will not be put to shame.";
csb[24] = "Can the prey be taken from a mighty man, or the captives of a tyrant be delivered?";
csb[25] = "For this is what the LORD says: &quot;Even the captives of a mighty man will be taken, and the prey of a tyrant will be delivered; I will contend with the one who contends with you, and I will save your children.";
csb[26] = "&quot;I will make your oppressors eat their own flesh, and they will be drunk with their own blood as with sweet wine. Then all people will know that I, the LORD, am your Savior, and your Redeemer, the Mighty One of Jacob.&quot;";

kjv[6] = "And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth.";

kjv[7] = "Thus saith the LORD, the Redeemer of Israel, [and] his Holy One, to him whom man despiseth, to him whom the nation abhorreth, to a servant of rulers, Kings shall see and arise, princes also shall worship, because of the LORD that is faithful, [and] the Holy One of Israel, and he shall choose thee.";
rsv[7] = "Thus says the LORD, the Redeemer of Israel and his Holy One, to one deeply despised, abhorred by the nations, the servant of rulers: &quot;Kings shall see and arise; princes, and they shall prostrate themselves; because of the LORD, who is faithful, the Holy One of Israel, who has chosen you.&quot;";
asv[7] = "Thus saith Jehovah, the Redeemer of Israel, [and] his Holy One, to him whom man despiseth, to him whom the nation abhorreth, to a servant of rulers: Kings shall see and arise; princes, and they shall worship; because of Jehovah that is faithful, [even] the Holy One of Israel, who hath chosen thee.";
yng[7] = "Thus said Jehovah, Redeemer of Israel, His Holy One, To the despised in soul, To the abominated of a nation, To the servant of rulers: `Kings see, and have risen, princes, and worship, For the sake of Jehovah, who is faithful, The Holy of Israel, and He chooseth thee.\'";
dby[7] = "Thus saith Jehovah, the Redeemer of Israel, his Holy One, to him whom man despiseth, to him whom the nation abhorreth, to the servant of rulers: Kings shall see and arise, princes, and they shall worship, because of Jehovah who is faithful, the Holy One of Israel, who hath chosen thee.";

hnv[7] = "Thus says the LORD, the Redeemer of Yisra\'el, [and] his Holy One, to him whom man despises, to him whom the nation abhors, to a servant of rulers: Kings shall see and arise; princes, and they shall worship; because of the LORD who is faithful, [even] the Holy One of Yisra\'el, who has chosen you.";

kjv[8] = "Thus saith the LORD, In an acceptable time have I heard thee, and in a day of salvation have I helped thee: and I will preserve thee, and give thee for a covenant of the people, to establish the earth, to cause to inherit the desolate heritages;";

kjv[18] = "Lift up thine eyes round about, and behold: all these gather themselves together, [and] come to thee. [As] I live, saith the LORD, thou shalt surely clothe thee with them all, as with an ornament, and bind them [on thee], as a bride [doeth].";
rsv[18] = "Lift up your eyes round about and see; they all gather, they come to you. As I live, says the LORD, you shall put them all on as an ornament, you shall bind them on as a bride does.";
asv[18] = "Lift up thine eyes round about, and behold: all these gather themselves together, and come to thee. As I live, saith Jehovah, thou shalt surely clothe thee with them all as with an ornament, and gird thyself with them, like a bride.";
yng[18] = "Lift up round about thine eyes and see, All of them have been gathered, They have come to thee. I live, an affirmation of Jehovah! Surely all of them as an ornament thou puttest on, And thou bindest them on like a bride.";
dby[18] = "Lift up thine eyes round about and behold: they all gather themselves together, they come to thee. As I live, saith Jehovah, thou shalt indeed clothe thee with them all as with an ornament, and bind them on as a bride doth.";
web[18] = "Lift up thy eyes around, and behold: all these assemble themselves, [and] come to thee. [As] I live, saith the LORD, thou shalt surely clothe thee with them all, as with an ornament, and bind them [on thee], as a bride [doeth].";
hnv[18] = "Lift up your eyes round about, and see: all these gather themselves together, and come to you. As I live, says the LORD, you shall surely clothe you with them all as with an ornament, and gird yourself with them, like a bride.";
vul[18] = "leva in circuitu oculos tuos et vide omnes isti congregati sunt venerunt tibi vivo ego dicit Dominus quia omnibus his velut ornamento vestieris et circumdabis tibi eos quasi sponsa";
kjv[19] = "For thy waste and thy desolate places, and the land of thy destruction, shall even now be too narrow by reason of the inhabitants, and they that swallowed thee up shall be far away.";
rsv[19] = "&quot;Surely your waste and your desolate places and your devastated land--surely now you will be too narrow for your inhabitants, and those who swallowed you up will be far away.";
asv[19] = "For, as for thy waste and thy desolate places, and thy land that hath been destroyed, surely now shalt thou be too strait for the inhabitants, and they that swallowed thee up shall be far away.";
yng[19] = "Because thy wastes, and thy desolate places, And the land of thy ruins, Surely now are straitened because of inhabitants, And far off have been those consuming thee.";
dby[19] = "For [in] thy waste and thy desolate places, and thy destroyed land, thou shalt even now be too straitened by reason of the inhabitants, and they that swallowed thee up shall be far away.";
web[19] = "For thy waste and thy desolate places, and the land of thy destruction, shall even now be too narrow by reason of the inhabitants, and they that swallowed thee up shall be far away.";
hnv[19] = "For, as for your waste and your desolate places, and your land that has been destroyed, surely now shall you be too small for the inhabitants, and those who swallowed you up shall be far away.";
vul[19] = "quia deserta tua et solitudines tuae et terra ruinae tuae nunc angusta erunt prae habitatoribus et longe fugabuntur qui absorbebant te";
kjv[20] = "The children which thou shalt have, after thou hast lost the other, shall say again in thine ears, The place [is] too strait for me: give place to me that I may dwell.";
rsv[20] = "The children born in the time of your bereavement will yet say in your ears: \'The place is too narrow for me; make room for me to dwell in.\'";
asv[20] = "The children of thy bereavement shall yet say in thine ears, The place is too strait for me; give place to me that I may dwell.";
yng[20] = "Again do the sons of thy bereavement say in thine ears: `The place is too strait for me, Come nigh to me -- and I dwell.\'";
dby[20] = "The children of thy bereavement shall yet say in thine ears, The place is too narrow for me: make room for me, that I may dwell.";
web[20] = "The children which thou shalt have, after thou hast lost the other, shall say again in thy ears, The place [is] too narrow for me: give place to me that I may dwell.";
hnv[20] = "The children of your bereavement shall yet say in your ears, The place is too small for me; give place to me that I may dwell.";
vul[20] = "adhuc dicent in auribus tuis filii sterilitatis tuae angustus mihi est locus fac spatium mihi ut habitem";
kjv[21] = "Then shalt thou say in thine heart, Who hath begotten me these, seeing I have lost my children, and am desolate, a captive, and removing to and fro? and who hath brought up these? Behold, I was left alone; these, where [had] they [been]?";
rsv[21] = "Then you will say in your heart: \'Who has borne me these? I was bereaved and barren, exiled and put away, but who has brought up these? Behold, I was left alone; whence then have these come?\'&quot;";
asv[21] = "Then shalt thou say in thy heart, Who hath begotten me these, seeing I have been bereaved of my children, and am solitary, an exile, and wandering to and fro? and who hath brought up these? Behold, I was left alone; these, where were they?";
yng[21] = "And thou hast said in thy heart: `Who hath begotten for me -- these? And I bereaved and gloomy, A captive, and turned aside, And these -- who hath nourished? Lo, I -- I was left by myself, these -- whence [are] they?";
dby[21] = "And thou shalt say in thy heart, Who hath borne me these, seeing I had lost my children and was desolate, an exile, and driven about? and who hath brought up these? behold, I was left alone; these, where were they?";
web[21] = "Then shalt thou say in thy heart, Who hath begotten these for me, seeing I have lost my children, and am desolate, a captive, and removing to and fro? and who hath brought up these? Behold, I was left alone; these, where [have] they [been]?";
hnv[21] = "Then shall you say in your heart, Who has conceived these for me, seeing I have been bereaved of my children, and am solitary, an exile, and wandering back and forth? and who has brought up these? Behold, I was left alone; these, where were they?";
vul[21] = "et dices in corde tuo quis genuit mihi istos ego sterilis et non pariens transmigrata et captiva et istos quis enutrivit ego destituta et sola et isti ubi hic erant";
kjv[22] = "Thus saith the Lord GOD, Behold, I will lift up mine hand to the Gentiles, and set up my standard to the people: and they shall bring thy sons in [their] arms, and thy daughters shall be carried upon [their] shoulders.";
rsv[22] = "Thus says the Lord GOD: &quot;Behold, I will lift up my hand to the nations, and raise my signal to the peoples; and they shall bring your sons in their bosom, and your daughters shall be carried on their shoulders.";
asv[22] = "Thus saith the Lord Jehovah, Behold, I will lift up my hand to the nations, and set up my ensign to the peoples; and they shall bring thy sons in their bosom, and thy daughters shall be carried upon their shoulders.";
yng[22] = "Thus said the Lord Jehovah: `Lo, I lift up unto nations My hand, And unto peoples I raise up Mine ensign, And they have brought thy sons in the bosom, And thy daughters on the shoulder are carried.";
dby[22] = "Thus saith the Lord Jehovah: Behold, I will lift up my hand to the nations, and set up my banner to the peoples; and they shall bring thy sons in [their] bosom, and thy daughters shall be carried upon the shoulder.";
web[22] = "Thus saith the Lord GOD, Behold, I will lift up my hand to the Gentiles, and set up my standard to the people: and they shall bring thy sons in [their] arms, and thy daughters shall be carried upon [their] shoulders.";
hnv[22] = "Thus says the Lord GOD, Behold, I will lift up my hand to the nations, and set up my ensign to the peoples; and they shall bring your sons in their bosom, and your daughters shall be carried on their shoulders.";
vul[22] = "haec dicit Dominus Deus ecce levo ad gentes manum meam et ad populos exaltabo signum meum et adferent filios tuos in ulnis et filias tuas super umeros portabunt";
kjv[23] = "And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with [their] face toward the earth, and lick up the dust of thy feet; and thou shalt know that I [am] the LORD: for they shall not be ashamed that wait for me.";
rsv[23] = "Kings shall be your foster fathers, and their queens your nursing mothers. With their faces to the ground they shall bow down to you, and lick the dust of your feet. Then you will know that I am the LORD; those who wait for me shall not be put to shame.&quot;";
asv[23] = "And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their faces to the earth, and lick the dust of thy feet; and thou shalt know that I am Jehovah; and they that wait for me shall not be put to shame.";
yng[23] = "And kings have been thy nursing fathers, And their princesses thy nursing mothers; Face to the earth -- they bow down to thee, And the dust of thy feet they lick up, And thou hast known that I [am] Jehovah, That those expecting Me are not ashamed.";
dby[23] = "And kings shall be thy nursing-fathers, and their princesses thy nursing-mothers: they shall bow down to thee with the face toward the earth, and lick up the dust of thy feet. And thou shalt know that I [am] Jehovah; for they shall not be ashamed who wait on me.";
web[23] = "And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow to thee with [their] face towards the earth, and lick up the dust of thy feet; and thou shalt know that I [am] the LORD: for they shall not be ashamed that wait for me.";
hnv[23] = "Kings shall be your nursing fathers, and their queens your nursing mothers: they shall bow down to you with their faces to the eretz, and lick the dust of your feet; and you shall know that I am the LORD; and those who wait for me shall not be disappointed.";
vul[23] = "et erunt reges nutricii tui et reginae nutrices tuae vultu in terra dimisso adorabunt te et pulverem pedum tuorum lingent et scies quia ego Dominus super quo non confundentur qui expectant eum";
kjv[24] = "Shall the prey be taken from the mighty, or the lawful captive delivered?";
rsv[24] = "Can the prey be taken from the mighty, or the captives of a tyrant be rescued?";
asv[24] = "Shall the prey be taken from the mighty, or the lawful captives be delivered?";
yng[24] = "Is prey taken from the mighty? And the captive of the righteous delivered?";
dby[24] = "Shall the prey be taken from the mighty? and shall he that is rightfully captive be delivered?";
web[24] = "Shall the prey be taken from the mighty, or the lawful captive delivered?";
hnv[24] = "Shall the prey be taken from the mighty, or the lawful captives be delivered?";
vul[24] = "numquid tolletur a forte praeda aut quod captum fuerit a robusto salvum esse poterit";
kjv[25] = "But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children.";
rsv[25] = "Surely, thus says the LORD: &quot;Even the captives of the mighty shall be taken, and the prey of the tyrant be rescued, for I will contend with those who contend with you, and I will save your children.";
asv[25] = "But thus saith Jehovah, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered; for I will contend with him that contendeth with thee, and I will save thy children.";
yng[25] = "For thus said Jehovah: Even the captive of the mighty is taken, And the prey of the terrible is delivered, And with thy striver I strive, and thy sons I save.";
dby[25] = "For thus saith Jehovah: Even the captive of the mighty shall be taken away, and the prey of the terrible shall be delivered; and I will strive with him that striveth with thee, and I will save thy children.";
web[25] = "But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children.";
hnv[25] = "But thus says the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered; for I will contend with him who contends with you, and I will save your children.";
vul[25] = "quia haec dicit Dominus equidem et captivitas a forte tolletur et quod ablatum fuerit a robusto salvabitur eos vero qui iudicaverunt te ego iudicabo et filios tuos ego salvabo";
kjv[26] = "And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I the LORD [am] thy Saviour and thy Redeemer, the mighty One of Jacob.";
rsv[26] = "I will make your oppressors eat their own flesh, and they shall be drunk with their own blood as with wine. Then all flesh shall know that I am the LORD your Savior, and your Redeemer, the Mighty One of Jacob.&quot;";
asv[26] = "And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I, Jehovah, am thy Saviour, and thy Redeemer, the Mighty One of Jacob.";
yng[26] = "And I have caused thine oppressors to eat their own flesh, And as new wine they drink their own blood, And known have all flesh that I, Jehovah, Thy saviour, and thy redeemer, [Am] the Mighty One of Jacob!\'";
dby[26] = "And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with new wine. And all flesh shall know that I, Jehovah, [am] thy Saviour and thy Redeemer, the Mighty One of Jacob.";
web[26] = "And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I the LORD [am] thy Savior and thy Redeemer, the mighty One of Jacob.";
hnv[26] = "I will feed those who oppress you with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I, the LORD, am your Savior, and your Redeemer, the Mighty One of Ya`akov.";
