csb[1] = "&quot;And now listen, Jacob my servant, Israel whom I have chosen.";
csb[2] = "&quot;This is the word of the LORD your Maker, the one who formed you from the womb: He will help you. Do not fear, Jacob my servant, Jeshurun whom I have chosen.";
csb[3] = "&quot;For I will pour water on the thirsty land and streams on the dry ground; I will pour out my Spirit on your descendants and my blessing on your offspring.";
csb[4] = "&quot;They will sprout among the grass like poplars by flowing streams.";
csb[5] = "&quot;This one will say, \'I am the LORD\'s\'; another will use the name of Jacob; still another will write on his hand, \'The LORD\'s,\' and take on the name of Israel.&quot;";
csb[6] = "This is what the LORD, the King of Israel and its Redeemer, the LORD of Armies, says: I am the first and I am the last. There is no God but me.";
csb[7] = "Who, like me, can announce the future? Let him say so and make a case before me, since I have established an ancient people. Let these gods declare the coming things, and what will take place.";
csb[8] = "Do not be startled or afraid. Have I not told you and declared it long ago? You are my witnesses! Is there any God but me? There is no other Rock; I do not know any.";
csb[9] = "All who make idols are nothing, and what they treasure benefits no one. Their witnesses do not see or know anything, so they will be put to shame.";
csb[10] = "Who makes a god or casts a metal image that benefits no one?";
csb[11] = "Look, all its worshipers will be put to shame, and the craftsmen are humans. They all will assemble and stand; they all will be startled and put to shame.";
csb[12] = "The ironworker labors over the coals, shapes the idol with hammers, and works it with his strong arm. Also he grows hungry and his strength fails; he doesn\'t drink water and is faint.";
csb[13] = "The woodworker stretches out a measuring line, he outlines it with a stylus; he shapes it with chisels and outlines it with a compass. He makes it according to a human form, like a beautiful person, to dwell in a temple.";
csb[14] = "He cuts down cedars for his use, or he takes a cypress or an oak. He lets it grow strong among the trees of the forest. He plants a laurel, and the rain makes it grow.";
csb[15] = "A person can use it for fuel. He takes some of it and warms himself; also he kindles a fire and bakes bread; he even makes it into a god and worships it; he makes an idol from it and bows down to it.";
csb[16] = "He burns half of it in a fire, and he roasts meat on that half. He eats the roast and is satisfied. He warms himself and says, &quot;Ah! I am warm, I see the blaze.&quot;";
csb[17] = "He makes a god or his idol with the rest of it. He bows down to it and worships; he prays to it, &quot;Save me, for you are my god.&quot;";
csb[18] = "Such people do not comprehend and cannot understand, for he has shut their eyes so they cannot see, and their minds so they cannot understand.";
csb[19] = "No one comes to his senses; no one has the perception or insight to say, &quot;I burned half of it in the fire, I also baked bread on its coals, I roasted meat and ate. Should I make something detestable with the rest of it? Should I bow down to a block of wood? &quot;";
csb[20] = "He feeds on ashes. His deceived mind has led him astray, and he cannot rescue himself, or say, &quot;Isn\'t there a lie in my right hand? &quot;";
csb[21] = "Remember these things, Jacob, and Israel, for you are my servant; I formed you, you are my servant; Israel, you will never be forgotten by me.";
csb[22] = "I have swept away your transgressions like a cloud, and your sins like a mist. Return to me, for I have redeemed you.";
csb[23] = "Rejoice, heavens, for the LORD has acted; shout, depths of the earth. Break out into singing, mountains, forest, and every tree in it. For the LORD has redeemed Jacob, and glorifies himself through Israel.";
csb[24] = "This is what the LORD, your Redeemer who formed you from the womb, says: I am the LORD, who made everything; who stretched out the heavens by myself; who alone spread out the earth;";
csb[25] = "who destroys the omens of the false prophets and makes fools of diviners; who confounds the wise and makes their knowledge foolishness;";
csb[26] = "who confirms the message of his servant and fulfills the counsel of his messengers; who says to Jerusalem, &quot;She will be inhabited,&quot; and to the cities of Judah, &quot;They will be rebuilt,&quot; and I will restore her ruins;";
csb[27] = "who says to the depths of the sea, &quot;Be dry,&quot; and I will dry up your rivers;";
csb[28] = "who says to Cyrus, &quot;My shepherd, he will fulfill all my pleasure&quot; and says to Jerusalem, &quot;She will be rebuilt,&quot; and of the temple, &quot;Its foundation will be laid.&quot;";

asv[5] = "One shall say, I am Jehovah\'s; and another shall call [himself] by the name of Jacob; and another shall subscribe with his hand unto Jehovah, and surname [himself] by the name of Israel.";

kjv[7] = "And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? and the things that are coming, and shall come, let them shew unto them.";
rsv[7] = "Who is like me? Let him proclaim it, let him declare and set it forth before me. Who has announced from of old the things to come? Let them tell us what is yet to be.";
asv[7] = "And who, as I, shall call, and shall declare it, and set it in order for me, since I established the ancient people? and the things that are coming, and that shall come to pass, let them declare.";
yng[7] = "And who as I, doth call and declare it, And arrange it for Me, Since My placing the people of antiquity, And things that are coming, And those that do come, declare they to them?";
dby[7] = "And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? And the coming things, and those that shall happen, let them declare unto them.";

kjv[8] = "Fear ye not, neither be afraid: have not I told thee from that time, and have declared [it]? ye [are] even my witnesses. Is there a God beside me? yea, [there is] no God; I know not [any].";
rsv[8] = "Fear not, nor be afraid; have I not told you from of old and declared it? And you are my witnesses! Is there a God besides me? There is no Rock; I know not any.&quot;";
asv[8] = "Fear ye not, neither be afraid: have I not declared unto thee of old, and showed it? and ye are my witnesses. Is there a God besides me? yea, there is no Rock; I know not any.";
yng[8] = "Fear not, nor be afraid, Have I not from that time caused thee to hear, and declared? And ye [are] My witnesses, Is there a God besides Me? yea, there is none, A Rock I have not known.";
dby[8] = "Fear not, neither be afraid. Have I not caused thee to hear from that time, and have declared it? and ye are my witnesses. Is there a God beside me? yea, there is no Rock: I know not any.";
web[8] = "Fear ye not, neither be afraid: have not I told thee from that time, and have declared [it]? ye [are] even my witnesses. Is there a God besides me? verily [there is] no God; I know not [any].";
hnv[8] = "Don\'t fear, neither be afraid: haven\'t I declared to you of old, and shown it? You are my witnesses. Is there a God besides me? Indeed, there is not. I don\'t know any Rock.";
vul[8] = "nolite timere neque conturbemini ex tunc audire te feci et adnuntiavi vos estis testes mei numquid est deus absque me et formator quem ego non noverim";
kjv[9] = "They that make a graven image [are] all of them vanity; and their delectable things shall not profit; and they [are] their own witnesses; they see not, nor know; that they may be ashamed.";
rsv[9] = "All who make idols are nothing, and the things they delight in do not profit; their witnesses neither see nor know, that they may be put to shame.";
asv[9] = "They that fashion a graven image are all of them vanity; and the things that they delight in shall not profit; and their own witnesses see not, nor know: that they may be put to shame.";
yng[9] = "Framers of a graven image [are] all of them emptiness, And their desirable things do not profit, And their own witnesses they [are], They see not, nor know, that they may be ashamed.";
dby[9] = "They that form a graven image are all of them vanity, and their delectable things are of no profit; and they are their own witnesses: they see not, nor know; -- that they may be ashamed.";
web[9] = "They that make a graven image [are] all of them vanity; and their delectable things shall not profit; and they [are] their own witnesses; they see not, nor know; that they may be ashamed.";
hnv[9] = "Those who fashion an engraved image are all of them vanity; and the things that they delight in shall not profit; and their own witnesses don\'t see, nor know: that they may be disappointed.";
vul[9] = "plastae idoli omnes nihil sunt et amantissima eorum non proderunt eis ipsi sunt testes eorum quia non vident neque intellegunt ut confundantur";

kjv[11] = "Behold, all his fellows shall be ashamed: and the workmen, they [are] of men: let them all be gathered together, let them stand up; [yet] they shall fear, [and] they shall be ashamed together.";
rsv[11] = "Behold, all his fellows shall be put to shame, and the craftsmen are but men; let them all assemble, let them stand forth, they shall be terrified, they shall be put to shame together.";

kjv[12] = "The smith with the tongs both worketh in the coals, and fashioneth it with hammers, and worketh it with the strength of his arms: yea, he is hungry, and his strength faileth: he drinketh no water, and is faint.";
rsv[12] = "The ironsmith fashions it and works it over the coals; he shapes it with hammers, and forges it with his strong arm; he becomes hungry and his strength fails, he drinks no water and is faint.";
asv[12] = "The smith [maketh] an axe, and worketh in the coals, and fashioneth it with hammers, and worketh it with his strong arm: yea, he is hungry, and his strength faileth; he drinketh no water, and is faint.";
yng[12] = "He hath wrought iron [with] an axe, And hath wrought with coals, And with hammers doth form it, And doth work it by his powerful arm, Yea, he is hungry, and there is no power, He doth not drink water, and he is wearied.";
dby[12] = "The iron-smith [hath] a chisel, and he worketh in the coals, and he fashioneth it with hammers, and worketh it with his strong arm; -- but he is hungry, and his strength faileth; he hath not drunk water, and he is faint.";
web[12] = "The smith with the tongs both worketh in the coals, and fashioneth it with hammers, and worketh it with the strength of his arms: yes, he is hungry, and his strength faileth: he drinketh no water, and is faint.";
hnv[12] = "The smith [makes] an axe, and works in the coals, and fashions it with hammers, and works it with his strong arm: yes, he is hungry, and his strength fails; he drinks no water, and is faint.";
vul[12] = "faber ferrarius lima operatus est in prunis et in malleis formavit illud et operatus est in brachio fortitudinis suae esuriet et deficiet non bibet aquam et lassescet";
kjv[13] = "The carpenter stretcheth out [his] rule; he marketh it out with a line; he fitteth it with planes, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of a man; that it may remain in the house.";
rsv[13] = "The carpenter stretches a line, he marks it out with a pencil; he fashions it with planes, and marks it with a compass; he shapes it into the figure of a man, with the beauty of a man, to dwell in a house.";
asv[13] = "The carpenter stretcheth out a line; he marketh it out with a pencil; he shapeth it with planes, and he marketh it out with the compasses, and shapeth it after the figure of a man, according to the beauty of a man, to dwell in a house.";
yng[13] = "He hath wrought [with] wood, He hath stretched out a rule, He doth mark it out with a line, He maketh it with carving tools, And with a compass he marketh it out, And maketh it according to the form of a man, According to the beauty of a man, To remain in the house.";
dby[13] = "The worker in wood stretcheth out a line; he marketh it out with red chalk; he formeth it with sharp tools, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of man: that it may remain in the house.";
web[13] = "The carpenter stretcheth out [his] rule; he marketh it out with a line; he fitteth it with planes, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of a man; that it may remain in the house.";
hnv[13] = "The carpenter stretches out a line; he marks it out with a pencil; he shapes it with planes, and he marks it out with the compasses, and shapes it after the figure of a man, according to the beauty of a man, to dwell in a house.";
vul[13] = "artifex lignarius extendit normam formavit illud in runcina fecit illud in angularibus et in circino tornavit illud et fecit imaginem viri quasi speciosum hominem habitantem in domo";
kjv[14] = "He heweth him down cedars, and taketh the cypress and the oak, which he strengtheneth for himself among the trees of the forest: he planteth an ash, and the rain doth nourish [it].";
rsv[14] = "He cuts down cedars; or he chooses a holm tree or an oak and lets it grow strong among the trees of the forest; he plants a cedar and the rain nourishes it.";
asv[14] = "He heweth him down cedars, and taketh the holm-tree and the oak, and strengtheneth for himself one among the trees of the forest: he planteth a fir-tree, and the rain doth nourish it.";
yng[14] = "Cutting down to himself cedars, He taketh also a cypress, and an oak, And he strengtheneth [it] for himself Among the trees of a forest, He hath planted an ash, and the shower doth nourish [it].";
dby[14] = "When he heweth him down cedars, he taketh also a holm-oak and a terebinth -- he chooseth for himself among the trees of the forest: he planteth a pine, and the rain maketh [it] grow.";
web[14] = "He heweth down cedars for himself, and taketh the cypress and the oak, which he strengtheneth for himself among the trees of the forest: he planteth an ash, and the rain doth nourish [it].";
hnv[14] = "He cuts down cedars for himself, and takes the cypress and the oak, and strengthens for himself one among the trees of the forest: he plants a fir tree, and the rain nourishes it.";
vul[14] = "succidit cedros tulit ilicem et quercum quae steterat inter ligna saltus plantavit pinum quam pluvia nutrivit";
kjv[15] = "Then shall it be for a man to burn: for he will take thereof, and warm himself; yea, he kindleth [it], and baketh bread; yea, he maketh a god, and worshippeth [it]; he maketh it a graven image, and falleth down thereto.";
rsv[15] = "Then it becomes fuel for a man; he takes a part of it and warms himself, he kindles a fire and bakes bread; also he makes a god and worships it, he makes it a graven image and falls down before it.";
asv[15] = "Then shall it be for a man to burn; and he taketh thereof, and warmeth himself; yea, he kindleth it, and baketh bread: yea, he maketh a god, and worshippeth it; he maketh it a graven image, and falleth down thereto.";
yng[15] = "And it hath been for man to burn, And he taketh of them, and becometh warm, Yea, he kindleth [it], and hath baked bread, Yea, he maketh a god, and boweth himself, He hath made it a graven image, And he falleth down to it.";
dby[15] = "And it shall be for a man to burn, and he taketh thereof, and warmeth himself; he kindleth it also, and baketh bread; he maketh also a god, and worshippeth it; he maketh it a graven image, and falleth down thereto.";
web[15] = "Then shall it be for a man to burn: for he will take of it, and warm himself; indeed he kindleth [it], and baketh bread; yes, he maketh a god, and worshipeth [it]; he maketh it a graven image, and falleth down to it.";
hnv[15] = "Then shall it be for a man to burn; and he takes of it, and warms himself; yes, he kindles it, and bakes bread: yes, he makes a god, and worships it; he makes it an engraved image, and falls down to it.";
vul[15] = "et facta est hominibus in focum sumpsit ex eis et calefactus est et succendit et coxit panes de reliquo autem operatus est deum et adoravit fecit sculptile et curvatus est ante illud";
kjv[16] = "He burneth part thereof in the fire; with part thereof he eateth flesh; he roasteth roast, and is satisfied: yea, he warmeth [himself], and saith, Aha, I am warm, I have seen the fire:";
rsv[16] = "Half of it he burns in the fire; over the half he eats flesh, he roasts meat and is satisfied; also he warms himself and says, &quot;Aha, I am warm, I have seen the fire!&quot;";
asv[16] = "He burneth part thereof in the fire; with part thereof he eateth flesh; he roasteth roast, and is satisfied; yea, he warmeth himself, and saith, Aha, I am warm, I have seen the fire.";
yng[16] = "Half of it he hath burnt in the fire, By [this] half of it he eateth flesh, He roasteth a roasting, and is satisfied, Yea, he is warm, and saith: `Aha, I have become warm, I have enjoyed the light.";
dby[16] = "He burneth part thereof in the fire; with part thereof he eateth flesh, he roasteth roast, and is satisfied; yea, he is warm, and saith, Aha, I am become warm, I have seen the fire.";
web[16] = "He burneth part of it in the fire; with part of it he eateth flesh; he roasteth meat, and is satisfied: yes, he warmeth [himself], and saith, Aha, I am warm, I have seen the fire:";
hnv[16] = "He burns part of it in the fire; with part of it he eats flesh; he roasts roast, and is satisfied; yes, he warms himself, and says, Aha, I am warm, I have seen the fire.";
vul[16] = "medium eius conbusit igni et de medio eius carnes comedit coxit pulmentum et saturatus est et calefactus est et dixit va calefactus sum vidi focum";
kjv[17] = "And the residue thereof he maketh a god, [even] his graven image: he falleth down unto it, and worshippeth [it], and prayeth unto it, and saith, Deliver me; for thou [art] my god.";
rsv[17] = "And the rest of it he makes into a god, his idol; and falls down to it and worships it; he prays to it and says, &quot;Deliver me, for thou art my god!&quot;";
asv[17] = "And the residue thereof he maketh a god, even his graven image; he falleth down unto it and worshippeth, and prayeth unto it, and saith, Deliver me; for thou art my god.";
yng[17] = "And its remnant for a god he hath made -- For his graven image, He falleth down to it, and worshippeth, And prayeth unto it, and he saith, `Deliver me, for my god thou [art].\'";
dby[17] = "And with the remainder thereof he maketh a god, his graven image; he falleth down unto it, and worshippeth it, and prayeth unto it, and saith, Deliver me, for thou art my god.";
web[17] = "And the residue of it he maketh a god, [even] his graven image: he falleth down to it, and worshipeth [it], and prayeth to it, and saith, Deliver me; for thou [art] my god.";
hnv[17] = "The residue of it he makes a god, even his engraved image; he falls down to it and worships, and prays to it, and says, Deliver me; for you are my god.";
vul[17] = "reliquum autem eius deum fecit sculptile sibi curvatur ante illud et adorat illud et obsecrat dicens libera me quia deus meus es tu";
kjv[18] = "They have not known nor understood: for he hath shut their eyes, that they cannot see; [and] their hearts, that they cannot understand.";
rsv[18] = "They know not, nor do they discern; for he has shut their eyes, so that they cannot see, and their minds, so that they cannot understand.";
asv[18] = "They know not, neither do they consider: for he hath shut their eyes, that they cannot see; and their hearts, that they cannot understand.";
yng[18] = "They have not known, nor do they understand, For He hath daubed their eyes from seeing, Their heart from acting wisely.";
dby[18] = "They have no knowledge, and understand not; for he hath plastered their eyes, that they may not see; and their hearts, that they may not understand.";
web[18] = "They have not known nor understood: for he hath shut their eyes, that they cannot see; [and] their hearts, that they cannot understand.";
hnv[18] = "They don\'t know, neither do they consider: for he has shut their eyes, that they can\'t see; and their hearts, that they can\'t understand.";
vul[18] = "nescierunt neque intellexerunt lutati enim sunt ne videant oculi eorum et ne intellegant corde suo";
kjv[19] = "And none considereth in his heart, neither [is there] knowledge nor understanding to say, I have burned part of it in the fire; yea, also I have baked bread upon the coals thereof; I have roasted flesh, and eaten [it]: and shall I make the residue thereof an abomination? shall I fall down to the stock of a tree?";
rsv[19] = "No one considers, nor is there knowledge or discernment to say, &quot;Half of it I burned in the fire, I also baked bread on its coals, I roasted flesh and have eaten; and shall I make the residue of it an abomination? Shall I fall down before a block of wood?&quot;";
asv[19] = "And none calleth to mind, neither is there knowledge nor understanding to say, I have burned part of it in the fire; yea, also I have baked bread upon the coals thereof; I have roasted flesh and eaten it: and shall I make the residue thereof an abomination? shall I fall down to the stock of a tree?";
yng[19] = "And none doth turn [it] back unto his heart, Nor hath knowledge nor understanding to say, `Half of it I have burned in the fire, Yea, also, I have baked bread over its coals, I roast flesh and I eat, And its remnant for an abomination I make, To the stock of a tree I fall down.\'";
dby[19] = "And none taketh it to heart, neither is there knowledge nor understanding to say, I have burned part of it in the fire, and have also baked bread upon the coals thereof, I have roasted flesh, and eaten [it], and with the rest thereof shall I make an abomination? shall I bow down to a block of wood?";
web[19] = "And none considereth in his heart, neither [is there] knowledge nor understanding to say, I have burned part of it in the fire; I have also baked bread upon its coals; I have roasted flesh, and eaten [it]: and shall I make the residue of it an abomination? shall I fall down to the stock of a tree?";
hnv[19] = "None calls to mind, neither is there knowledge nor understanding to say, I have burned part of it in the fire; yes, also I have baked bread on the coals of it; I have roasted flesh and eaten it: and shall I make the residue of it an abomination? shall I fall down to the stock of a tree?";
vul[19] = "non recogitant in mente sua neque cognoscunt neque sentiunt ut dicant medietatem eius conbusi igne et coxi super carbones eius panes coxi carnes et comedi et de reliquo eius idolum faciam ante truncum ligni procidam";
kjv[20] = "He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, [Is there] not a lie in my right hand?";
rsv[20] = "He feeds on ashes; a deluded mind has led him astray, and he cannot deliver himself or say, &quot;Is there not a lie in my right hand?&quot;";
asv[20] = "He feedeth on ashes; a deceived heart hath turned him aside; and he cannot deliver his soul, nor say, Is there not a lie in my right hand?";
yng[20] = "Feeding on ashes, the heart is deceived, It hath turned him aside, And he delivereth not his soul, nor saith: `Is there not a lie in my right hand?\'";
dby[20] = "He feedeth on ashes; a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, Is there not a lie in my right hand?";
web[20] = "He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, [Is there] not a lie in my right hand?";
hnv[20] = "He feeds on ashes; a deceived heart has turned him aside; and he can\'t deliver his soul, nor say, Is there not a lie in my right hand?";
vul[20] = "pars eius cinis est cor insipiens adoravit illud et non liberabit animam suam neque dicet forte mendacium est in dextera mea";
kjv[21] = "Remember these, O Jacob and Israel; for thou [art] my servant: I have formed thee; thou [art] my servant: O Israel, thou shalt not be forgotten of me.";
rsv[21] = "Remember these things, O Jacob, and Israel, for you are my servant; I formed you, you are my servant; O Israel, you will not be forgotten by me.";
asv[21] = "Remember these things, O Jacob, and Israel; for thou art my servant: I have formed thee; thou art my servant: O Israel, thou shalt not be forgotten of me.";
yng[21] = "Remember these, O Jacob, and Israel, For My servant thou [art], I formed thee, a servant to Me thou [art], O Israel, thou dost not forget Me.";
dby[21] = "Remember these things, O Jacob, and Israel, for thou art my servant; I have formed thee: thou art my servant, Israel; thou shalt not be forgotten of me.";
web[21] = "Remember these, O Jacob and Israel; for thou [art] my servant: I have formed thee; thou [art] my servant: O Israel, thou shalt not be forgotten by me.";
hnv[21] = "Remember these things, Ya`akov, and Yisra\'el; for you are my servant: I have formed you; you are my servant: Yisra\'el, you shall not be forgotten by me.";
vul[21] = "memento horum Iacob et Israhel quoniam servus meus es tu formavi te servus meus es tu Israhel non oblivisceris mei";
kjv[22] = "I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee.";
rsv[22] = "I have swept away your transgressions like a cloud, and your sins like mist; return to me, for I have redeemed you.";
asv[22] = "I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee.";
yng[22] = "I have blotted out, as [by] a thick cloud, Thy transgressions, And as [by] a cloud thy sins, Return unto Me, for I have redeemed thee.";
dby[22] = "I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee.";
web[22] = "I have blotted out, as a thick cloud, thy transgressions, and as a cloud, thy sins: return to me; for I have redeemed thee.";
hnv[22] = "I have blotted out, as a thick cloud, your transgressions, and, as a cloud, your sins: return to me; for I have redeemed you.";
vul[22] = "delevi ut nubem iniquitates tuas et quasi nebulam peccata tua revertere ad me quoniam redemi te";
kjv[23] = "Sing, O ye heavens; for the LORD hath done [it]: shout, ye lower parts of the earth: break forth into singing, ye mountains, O forest, and every tree therein: for the LORD hath redeemed Jacob, and glorified himself in Israel.";
rsv[23] = "Sing, O heavens, for the LORD has done it; shout, O depths of the earth; break forth into singing, O mountains, O forest, and every tree in it! For the LORD has redeemed Jacob, and will be glorified in Israel.";
asv[23] = "Sing, O ye heavens, for Jehovah hath done it; shout, ye lower parts of the earth; break forth into singing, ye mountains, O forest, and every tree therein: for Jehovah hath redeemed Jacob, and will glorify himself in Israel.";
yng[23] = "Sing, O heavens, for Jehovah hath wrought, Shout, O lower parts of earth, Break forth, O mountains, with singing, Forest, and every tree in it, For Jehovah hath redeemed Jacob, And in Israel He doth beautify Himself.";
dby[23] = "Sing, ye heavens; for Jehovah hath done it: shout, ye lower parts of the earth; break forth into singing, ye mountains, the forest, and every tree therein! For Jehovah hath redeemed Jacob, and glorified himself in Israel.";
web[23] = "Sing, O ye heavens; for the LORD hath done [it]: shout, ye lower parts of the earth: break forth into singing, ye mountains, O forest, and every tree therein: for the LORD hath redeemed Jacob, and glorified himself in Israel.";
hnv[23] = "Sing, you heavens, for the LORD has done it; shout, you lower parts of the eretz; break forth into singing, you mountains, O forest, and every tree therein: for the LORD has redeemed Ya`akov, and will glorify himself in Yisra\'el.";
vul[23] = "laudate caeli quoniam fecit Dominus iubilate extrema terrae resonate montes laudationem saltus et omne lignum eius quoniam redemit Dominus Iacob et Israhel gloriabitur";
kjv[24] = "Thus saith the LORD, thy redeemer, and he that formed thee from the womb, I [am] the LORD that maketh all [things]; that stretcheth forth the heavens alone; that spreadeth abroad the earth by myself;";
rsv[24] = "Thus says the LORD, your Redeemer, who formed you from the womb: &quot;I am the LORD, who made all things, who stretched out the heavens alone, who spread out the earth--Who was with me?--";
asv[24] = "Thus saith Jehovah, thy Redeemer, and he that formed thee from the womb: I am Jehovah, that maketh all things; that stretcheth forth the heavens alone; that spreadeth abroad the earth (who is with me?);";
yng[24] = "Thus said Jehovah, thy redeemer, And thy framer from the womb: `I [am] Jehovah, doing all things, Stretching out the heavens by Myself, Spreading out the earth -- who [is] with Me?";
dby[24] = "Thus saith Jehovah, thy Redeemer, and he that formed thee from the womb: I [am] Jehovah, the maker of all things; who alone stretched out the heavens, who did spread forth the earth by myself;";
web[24] = "Thus saith the LORD thy Redeemer, and he that formed thee from the womb, [I am] the LORD that maketh all [things]; that stretcheth forth the heavens alone; that spreadeth abroad the earth by myself:";
hnv[24] = "Thus says the LORD, your Redeemer, and he who formed you from the womb: I am the LORD, who makes all things; who stretches forth the heavens alone; who spreads abroad the eretz (who is with me?);";
vul[24] = "haec dicit Dominus redemptor tuus et formator tuus ex utero ego sum Dominus faciens omnia extendens caelos solus stabiliens terram et nullus mecum";
kjv[25] = "That frustrateth the tokens of the liars, and maketh diviners mad; that turneth wise [men] backward, and maketh their knowledge foolish;";

asv[25] = "that frustrateth the signs of the liars, and maketh diviners mad; that turneth wise men backward, and maketh their knowledge foolish;";
yng[25] = "Making void the tokens of devisers, And diviners it maketh mad, Turning the wise backward, And their knowledge it maketh foolish.";

kjv[26] = "That confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built, and I will raise up the decayed places thereof:";

asv[26] = "that confirmeth the word of his servant, and performeth the counsel of his messengers; that saith of Jerusalem, She shall be inhabited; and of the cities of Judah, They shall be built, and I will raise up the waste places thereof;";
yng[26] = "Confirming the word of His servant, The counsel of His messengers it perfecteth, Who is saying of Jerusalem, She is inhabited, And of cities of Judah, They shall be built, and her wastes I raise up,";
dby[26] = "that confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built up, and I will raise up their ruins;";
web[26] = "That confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built, and I will raise up her decayed places:";
hnv[26] = "who confirms the word of his servant, and performs the counsel of his messengers; who says of Yerushalayim, She shall be inhabited; and of the cities of Yehudah, They shall be built, and I will raise up the waste places of it;";
vul[26] = "suscitans verbum servi sui et consilium nuntiorum suorum conplens qui dico Hierusalem habitaberis et civitatibus Iuda aedificabimini et deserta eius suscitabo";
kjv[27] = "That saith to the deep, Be dry, and I will dry up thy rivers:";

kjv[28] = "That saith of Cyrus, [He is] my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid.";

yng[28] = "Who is saying of Cyrus, My shepherd, And all my delight He doth perfect, So as to say of Jerusalem, Thou art built, And of the temple, Thou art founded.";

web[28] = "That saith of Cyrus, [He is] my shepherd, and [he] shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid.";
hnv[28] = "Who says of Koresh, [He is] my shepherd, and shall perform all my pleasure, even saying of Yerushalayim, She shall be built; and of the temple, Your foundation shall be laid.";
vul[28] = "qui dico Cyro pastor meus es et omnem voluntatem meam conplebis qui dico Hierusalem aedificaberis et templo fundaberis";
