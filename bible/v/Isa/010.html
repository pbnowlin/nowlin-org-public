csb[1] = "Woe to those enacting crooked statutes and writing oppressive laws";
csb[2] = "to keep the poor from getting a fair trial and to deprive the needy among my people of justice, so that widows can be their spoil and they can plunder the fatherless.";
csb[3] = "What will you do on the day of punishment when devastation comes from far away? Who will you run to for help? Where will you leave your wealth?";
csb[4] = "There will be nothing to do except crouch among the prisoners or fall among the slain. In all this, his anger has not turned away, and his hand is still raised to strike.";
csb[5] = "Woe to Assyria, the rod of my anger -- the staff in their hands is my wrath.";
csb[6] = "I will send him against a godless nation; I will command him to go against a people destined for my rage, to take spoils, to plunder, and to trample them down like clay in the streets.";
csb[7] = "But this is not what he intends; this is not what he plans. It is his intent to destroy and to cut off many nations.";
csb[8] = "For he says, &quot;Aren\'t all my commanders kings?";
csb[9] = "&quot;Isn\'t Calno like Carchemish? Isn\'t Hamath like Arpad? Isn\'t Samaria like Damascus?";
csb[10] = "&quot;As my hand seized the idolatrous kingdoms, whose idols exceeded those of Jerusalem and Samaria,";
csb[11] = "&quot;and as I did to Samaria and its worthless images will I not also do to Jerusalem and its idols? &quot;";
csb[12] = "But when the Lord finishes all his work against Mount Zion and Jerusalem, he will say, &quot;I will punish the king of Assyria for his arrogant acts and the proud look in his eyes.&quot;";
csb[13] = "For he said: I have done this by my own strength and wisdom, for I am clever. I abolished the borders of nations and plundered their treasures; like a mighty warrior, I subjugated the inhabitants.";
csb[14] = "My hand has reached out, as if into a nest, to seize the wealth of the nations. Like one gathering abandoned eggs, I gathered the whole earth. No wing fluttered; no beak opened or chirped.";
csb[15] = "Does an ax exalt itself above the one who chops with it? Does a saw magnify itself above the one who saws with it? It would be like a rod waving the one who lifts it! It would be like a staff lifting the one who isn\'t wood!";
csb[16] = "Therefore the Lord GOD of Armies will inflict an emaciating disease on the well-fed of Assyria, and he will kindle a burning fire under its glory.";
csb[17] = "Israel\'s Light will become a fire, and its Holy One, a flame. In one day it will burn and consume Assyria\'s thorns and thistles.";
csb[18] = "He will completely destroy the glory of its forests and orchards as a sickness consumes a person.";
csb[19] = "The remaining trees of its forest will be so few in number that a child could count them.";
csb[20] = "On that day the remnant of Israel and the survivors of the house of Jacob will no longer depend on the one who struck them, but they will faithfully depend on the LORD, the Holy One of Israel.";
csb[21] = "The remnant will return, the remnant of Jacob, to the Mighty God.";
csb[22] = "Israel, even if your people were as numerous as the sand of the sea, only a remnant of them will return. Destruction has been decreed; justice overflows.";
csb[23] = "For throughout the land the Lord GOD of Armies is carrying out a destruction that was decreed.";
csb[24] = "Therefore, the Lord GOD of Armies says this: &quot;My people who dwell in Zion, do not fear Assyria, though they strike you with a rod and raise their staff over you as the Egyptians did.";
csb[25] = "&quot;In just a little while my wrath will be spent and my anger will turn to their destruction.&quot;";
csb[26] = "And the LORD of Armies will brandish a whip against him as he did when he struck Midian at the rock of Oreb; and he will raise his staff over the sea as he did in Egypt.";
csb[27] = "On that day his burden will fall from your shoulders, and his yoke from your neck. The yoke will be broken because your neck will be too large.";
csb[28] = "Assyria has come to Aiath and has gone through Migron, storing their equipment at Michmash.";
csb[29] = "They crossed over at the ford, saying, &quot;We will spend the night at Geba.&quot; The people of Ramah are trembling; those at Gibeah of Saul have fled.";
csb[30] = "Cry aloud, daughter of Gallim! Listen, Laishah! Anathoth is miserable.";
csb[31] = "Madmenah has fled. The inhabitants of Gebim have sought refuge.";
csb[32] = "Today the Assyrians will stand at Nob, shaking their fists at the mountain of Daughter Zion, the hill of Jerusalem.";
csb[33] = "Look, the Lord GOD of Armies will chop off the branches with terrifying power, and the tall trees will be cut down, the high trees felled.";
csb[34] = "He is clearing the thickets of the forest with an ax, and Lebanon with its majesty will fall.";
kjv[1] = "Woe unto them that decree unrighteous decrees, and that write grievousness [which] they have prescribed;";
kjv[2] = "To turn aside the needy from judgment, and to take away the right from the poor of my people, that widows may be their prey, and [that] they may rob the fatherless!";
kjv[3] = "And what will ye do in the day of visitation, and in the desolation [which] shall come from far? to whom will ye flee for help? and where will ye leave your glory?";
kjv[4] = "Without me they shall bow down under the prisoners, and they shall fall under the slain. For all this his anger is not turned away, but his hand [is] stretched out still.";
kjv[5] = "O Assyrian, the rod of mine anger, and the staff in their hand is mine indignation.";
kjv[6] = "I will send him against an hypocritical nation, and against the people of my wrath will I give him a charge, to take the spoil, and to take the prey, and to tread them down like the mire of the streets.";
kjv[7] = "Howbeit he meaneth not so, neither doth his heart think so; but [it is] in his heart to destroy and cut off nations not a few.";
kjv[8] = "For he saith, [Are] not my princes altogether kings?";
kjv[9] = "[Is] not Calno as Carchemish? [is] not Hamath as Arpad? [is] not Samaria as Damascus?";
kjv[10] = "As my hand hath found the kingdoms of the idols, and whose graven images did excel them of Jerusalem and of Samaria;";
kjv[11] = "Shall I not, as I have done unto Samaria and her idols, so do to Jerusalem and her idols?";
kjv[12] = "Wherefore it shall come to pass, [that] when the Lord hath performed his whole work upon mount Zion and on Jerusalem, I will punish the fruit of the stout heart of the king of Assyria, and the glory of his high looks.";
kjv[13] = "For he saith, By the strength of my hand I have done [it], and by my wisdom; for I am prudent: and I have removed the bounds of the people, and have robbed their treasures, and I have put down the inhabitants like a valiant [man]:";
kjv[14] = "And my hand hath found as a nest the riches of the people: and as one gathereth eggs [that are] left, have I gathered all the earth; and there was none that moved the wing, or opened the mouth, or peeped.";
kjv[15] = "Shall the axe boast itself against him that heweth therewith? [or] shall the saw magnify itself against him that shaketh it? as if the rod should shake [itself] against them that lift it up, [or] as if the staff should lift up [itself, as if it were] no wood.";
kjv[16] = "Therefore shall the Lord, the Lord of hosts, send among his fat ones leanness; and under his glory he shall kindle a burning like the burning of a fire.";
kjv[17] = "And the light of Israel shall be for a fire, and his Holy One for a flame: and it shall burn and devour his thorns and his briers in one day;";
kjv[18] = "And shall consume the glory of his forest, and of his fruitful field, both soul and body: and they shall be as when a standardbearer fainteth.";
kjv[19] = "And the rest of the trees of his forest shall be few, that a child may write them.";
kjv[20] = "And it shall come to pass in that day, [that] the remnant of Israel, and such as are escaped of the house of Jacob, shall no more again stay upon him that smote them; but shall stay upon the LORD, the Holy One of Israel, in truth.";
kjv[21] = "The remnant shall return, [even] the remnant of Jacob, unto the mighty God.";
kjv[22] = "For though thy people Israel be as the sand of the sea, [yet] a remnant of them shall return: the consumption decreed shall overflow with righteousness.";
kjv[23] = "For the Lord GOD of hosts shall make a consumption, even determined, in the midst of all the land.";
kjv[24] = "Therefore thus saith the Lord GOD of hosts, O my people that dwellest in Zion, be not afraid of the Assyrian: he shall smite thee with a rod, and shall lift up his staff against thee, after the manner of Egypt.";
kjv[25] = "For yet a very little while, and the indignation shall cease, and mine anger in their destruction.";
kjv[26] = "And the LORD of hosts shall stir up a scourge for him according to the slaughter of Midian at the rock of Oreb: and [as] his rod [was] upon the sea, so shall he lift it up after the manner of Egypt.";
kjv[27] = "And it shall come to pass in that day, [that] his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed because of the anointing.";
kjv[28] = "He is come to Aiath, he is passed to Migron; at Michmash he hath laid up his carriages:";
kjv[29] = "They are gone over the passage: they have taken up their lodging at Geba; Ramah is afraid; Gibeah of Saul is fled.";
kjv[30] = "Lift up thy voice, O daughter of Gallim: cause it to be heard unto Laish, O poor Anathoth.";
kjv[31] = "Madmenah is removed; the inhabitants of Gebim gather themselves to flee.";
kjv[32] = "As yet shall he remain at Nob that day: he shall shake his hand [against] the mount of the daughter of Zion, the hill of Jerusalem.";
kjv[33] = "Behold, the Lord, the LORD of hosts, shall lop the bough with terror: and the high ones of stature [shall be] hewn down, and the haughty shall be humbled.";
kjv[34] = "And he shall cut down the thickets of the forest with iron, and Lebanon shall fall by a mighty one.";

yng[16] = "Therefore doth the Lord, the Lord of Hosts, Send among his fat ones leanness, And under his honour He kindleth a burning As the burning of a fire.";
dby[16] = "Therefore shall the Lord, Jehovah of hosts, send among his fat ones leanness, and under his glory he shall kindle a burning, like the burning of a fire:";
web[16] = "Therefore will the Lord, the LORD of hosts, send among his fat ones leanness; and under his glory he will kindle a burning like the burning of a fire.";
hnv[16] = "Therefore will the Lord, the LORD of Hosts, send among his fat ones leanness; and under his glory there shall be kindled a burning like the burning of fire.";
vul[16] = "propter hoc mittet Dominator Deus exercituum in pinguibus eius tenuitatem et subtus gloriam eius succensa ardebit quasi conbustio ignis";
rsv[17] = "The light of Israel will become a fire, and his Holy One a flame; and it will burn and devour his thorns and briers in one day.";
asv[17] = "And the light of Israel will be for a fire, and his Holy One for a flame; and it will burn and devour his thorns and his briers in one day.";
yng[17] = "And the light of Israel hath been for a fire, And his Holy One for a flame, And it hath burned, and devoured his thorn And his brier in one day.";
dby[17] = "and the light of Israel shall be for a fire, and his Holy One for a flame; and it shall burn and devour his thorns and his briars in one day,";
web[17] = "And the light of Israel shall be for a fire, and his Holy One for a flame: and it shall burn and devour his thorns and his briers in one day;";
hnv[17] = "The light of Yisra\'el will be for a fire, and his Holy One for a flame; and it will burn and devour his thorns and his briers in one day.";
vul[17] = "et erit lumen Israhel in igne et Sanctus eius in flamma et succendetur et devorabitur spina eius et vepres in die una";
rsv[18] = "The glory of his forest and of his fruitful land the LORD will destroy, both soul and body, and it will be as when a sick man wastes away.";
asv[18] = "And he will consume the glory of his forest, and of his fruitful field, both soul and body: and it shall be as when a standard-bearer fainteth.";
yng[18] = "And the honour of his forest, and his fruitful field, From soul even unto flesh He doth consume, And it hath been as the fainting of a standard-bearer.";
dby[18] = "and it shall consume the glory of his forest, and of his fruitful field, both soul and body; and they shall be as when a sick man fainteth.";
web[18] = "And shall consume the glory of his forest, and of his fruitful field, both soul and body: and they shall be as when a standard-bearer fainteth.";
hnv[18] = "He will consume the glory of his forest, and of his fruitful field, both soul and body: and it shall be as when a standard-bearer faints.";
vul[18] = "et gloria saltus eius et Carmeli eius ab anima usque ad carnem consumetur et erit terrore profugus";
rsv[19] = "The remnant of the trees of his forest will be so few that a child can write them down.";
asv[19] = "And the remnant of the trees of his forest shall be few, so that a child may write them.";
yng[19] = "And the rest of the trees of his forest [are] few, And a youth doth write them.";
dby[19] = "And the remainder of the trees of his forest shall be few: yea, a child might write them.";
web[19] = "And the rest of the trees of his forest shall be few, that a child may write them.";
hnv[19] = "The remnant of the trees of his forest shall be few, so that a child may write them.";
vul[19] = "et reliquiae ligni saltus eius pro paucitate numerabuntur et puer scribet eos";
rsv[20] = "In that day the remnant of Israel and the survivors of the house of Jacob will no more lean upon him that smote them, but will lean upon the LORD, the Holy One of Israel, in truth.";
asv[20] = "And it shall come to pass in that day, that the remnant of Israel, and they that are escaped of the house of Jacob, shall no more again lean upon him that smote them, but shall lean upon Jehovah, the Holy One of Israel, in truth.";
yng[20] = "And it hath come to pass, in that day, The remnant of Israel, And the escaped of the house of Jacob, Do not add any more to lean on its smiter, And have leant on Jehovah, The Holy One of Israel, in truth.";
dby[20] = "And it shall come to pass in that day, [that] the remnant of Israel and such as are escaped of the house of Jacob shall no more again rely upon him that smote them; but they shall rely upon Jehovah, the Holy One of Israel, in truth.";
web[20] = "And it shall come to pass in that day, [that] the remnant of Israel, and such as have escaped of the house of Jacob, shall no more again lean upon him that smote them; but shall lean upon the LORD, the Holy One of Israel, in truth.";
hnv[20] = "It shall come to pass in that day, that the remnant of Yisra\'el, and those who are escaped of the house of Ya`akov, shall no more again lean on him who struck them, but shall lean on the LORD, the Holy One of Yisra\'el, in truth.";
vul[20] = "et erit in die illa non adiciet residuum Israhel et hii qui fugerint de domo Iacob inniti super eo qui percutit eos sed innitetur super Dominum Sanctum Israhel in veritate";
rsv[21] = "A remnant will return, the remnant of Jacob, to the mighty God.";
asv[21] = "A remnant shall return, [even] the remnant of Jacob, unto the mighty God.";
yng[21] = "A remnant returneth -- a remnant of Jacob, Unto the Mighty God.";
dby[21] = "The remnant shall return, the remnant of Jacob, unto the mighty God.";
web[21] = "The remnant shall return, [even] the remnant of Jacob, to the mighty God.";
hnv[21] = "A remnant shall return, [even] the remnant of Ya`akov, to the mighty God.";
vul[21] = "reliquiae convertentur reliquiae inquam Iacob ad Deum fortem";
rsv[22] = "For though your people Israel be as the sand of the sea, only a remnant of them will return. Destruction is decreed, overflowing with righteousness.";
asv[22] = "For though thy people, Israel, be as the sand of the sea, [only] a remnant of them shall return: a destruction [is] determined, overflowing with righteousness.";
yng[22] = "For though thy people Israel be as the sand of the sea, A remnant doth return of it, A consumption determined, Overflowing [with] righteousness.";
dby[22] = "For though thy people Israel be as the sand of the sea, [only] a remnant of them shall return: the consumption determined shall overflow in righteousness.";
web[22] = "For though thy people Israel be as the sand of the sea, [yet] a remnant of them shall return: the consumption decreed shall overflow with righteousness.";
hnv[22] = "For though your people, Yisra\'el, be as the sand of the sea, [only] a remnant of them shall return: a destruction [is] determined, overflowing with righteousness.";
vul[22] = "si enim fuerit populus tuus Israhel quasi harena maris reliquiae convertentur ex eo consummatio adbreviata inundabit iustitiam";
rsv[23] = "For the Lord, the LORD of hosts, will make a full end, as decreed, in the midst of all the earth.";
asv[23] = "For a full end, and that determined, will the Lord, Jehovah of hosts, make in the midst of all the earth.";
yng[23] = "For a consumption that is determined, The Lord, Jehovah of Hosts, Is making in the midst of all the land.";
dby[23] = "For a consumption, and [one] determined, will the Lord, Jehovah of hosts, accomplish in the midst of all the land.";
web[23] = "For the Lord GOD of hosts will make a consumption, even determined, in the midst of all the land.";
hnv[23] = "For a full end, and that determined, will the Lord, the LORD of Hosts, make in the midst of all the eretz.";
vul[23] = "consummationem enim et adbreviationem Dominus Deus exercituum faciet in medio omnis terrae";
rsv[24] = "Therefore thus says the Lord, the LORD of hosts: &quot;O my people, who dwell in Zion, be not afraid of the Assyrians when they smite with the rod and lift up their staff against you as the Egyptians did.";
asv[24] = "Therefore thus saith the Lord, Jehovah of hosts, O my people that dwellest in Zion, be not afraid of the Assyrian, though he smite thee with the rod, and lift up his staff against thee, after the manner of Egypt.";
yng[24] = "Therefore, thus said the Lord, Jehovah of Hosts, `Be not afraid, my people, inhabiting Zion, because of Asshur, With a rod he doth smite thee, And his staff lifteth up against thee, in the way of Egypt.";
dby[24] = "Therefore thus saith the Lord, Jehovah of hosts: O my people that dwellest in Zion, be not afraid of the Assyrian; he shall smite thee with a rod, and shall lift up his staff against thee, after the manner of Egypt:";
web[24] = "Therefore thus saith the Lord GOD of hosts, O my people that dwellest in Zion, be not afraid of the Assyrian: he shall smite thee with a rod, and shall lift up his staff against thee, after the manner of Egypt.";
hnv[24] = "Therefore thus says the Lord, the LORD of Hosts, my people who dwell in Tziyon, don\'t be afraid of the Ashshur, though he strike you with the rod, and lift up his staff against you, after the manner of Mitzrayim.";
vul[24] = "propter hoc haec dicit Dominus Deus exercituum noli timere populus meus habitator Sion ab Assur in virga percutiet te et baculum suum levabit super te in via Aegypti";
rsv[25] = "For in a very little while my indignation will come to an end, and my anger will be directed to their destruction.";
asv[25] = "For yet a very little while, and the indignation [against thee] shall be accomplished, and mine anger [shall be directed] to his destruction.";
yng[25] = "For yet a very little, And the indignation hath been completed, And Mine anger by their wearing out.";
dby[25] = "for yet a very little while, and the indignation shall be accomplished, and mine anger, in their destruction.";
web[25] = "For yet a very little while, and the indignation shall cease, and my anger in their destruction.";
hnv[25] = "For yet a very little while, and the indignation [against you] shall be accomplished, and my anger [shall be directed] to his destruction.";
vul[25] = "adhuc enim paululum modicumque et consummabitur indignatio et furor meus super scelus eorum";
rsv[26] = "And the LORD of hosts will wield against them a scourge, as when he smote Mid\'ian at the rock of Oreb; and his rod will be over the sea, and he will lift it as he did in Egypt.";
asv[26] = "And Jehovah of hosts will stir up against him a scourge, as in the slaughter of Midian at the rock of Oreb: and his rod will be over the sea, and he will lift it up after the manner of Egypt.";
yng[26] = "And awaking for him is Jehovah of Hosts, A scourge like the smiting of Midian at the rock Oreb, And his rod [is] over the sea, And he hath lifted it in the way of Egypt.";
dby[26] = "And Jehovah of hosts will stir up a scourge against him, according to the slaughter of Midian at the rock of Oreb; and his rod [shall be] upon the sea, and he will lift it up after the manner of Egypt.";
web[26] = "And the LORD of hosts will raise up a scourge for him according to the slaughter of Midian at the rock of Oreb: and [as] his rod [was] upon the sea, so shall he lift it up after the manner of Egypt.";
hnv[26] = "The LORD of Hosts will stir up against him a scourge, as in the slaughter of Midyan at the rock of `Orev: and his rod will be over the sea, and he will lift it up after the manner of Mitzrayim.";
vul[26] = "et suscitabit super eum Dominus exercituum flagellum iuxta plagam Madian in petra Oreb et virgam suam super mare et levabit eam in via Aegypti";
rsv[27] = "And in that day his burden will depart from your shoulder, and his yoke will be destroyed from your neck.&quot; He has gone up from Rimmon,";
asv[27] = "And it shall come to pass in that day, that his burden shall depart from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed by reason of fatness.";
yng[27] = "And it hath come to pass, in that day, Turned is his burden from off thy shoulder, And his yoke from off thy neck, And destroyed hath been the yoke, because of prosperity.";
dby[27] = "And it shall come to pass in that day, [that] his burden shall be taken away from off thy shoulder, and his yoke from off thy neck; and the yoke shall be destroyed because of the anointing. ...";
web[27] = "And it shall come to pass in that day, [that] his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed because of the anointing.";
hnv[27] = "It shall happen in that day, that his burden shall depart from off your shoulder, and his yoke from off your neck, and the yoke shall be destroyed by reason of fatness.";
vul[27] = "et erit in die illa auferetur onus eius de umero tuo et iugum eius de collo tuo et conputrescet iugum a facie olei";
rsv[28] = "he has come to Ai\'ath; he has passed through Migron, at Michmash he stores his baggage;";
asv[28] = "He is come to Aiath, he is passed through Migron; at Michmash he layeth up his baggage;";
yng[28] = "He hath come in against Aiath, He hath passed over into Migron, At Michmash he looketh after his vessels.";
dby[28] = "He is come to Aiath, he hath passed through Migron; at Michmash he layeth up his baggage.";
web[28] = "He is come to Aiath, he is passed to Migron; at Michmash he hath laid up his furniture.";
hnv[28] = "He is come to `Ayat, he is passed through Migron; at Mikhmash he lays up his baggage;";
vul[28] = "veniet in Aiath transibit in Magron apud Machmas commendabit vasa sua";
rsv[29] = "they have crossed over the pass, at Geba they lodge for the night; Ramah trembles, Gib\'e-ah of Saul has fled.";
asv[29] = "they are gone over the pass; they have taken up their lodging at Geba; Ramah trembleth; Gibeah of Saul is fled.";
yng[29] = "They have gone over the passage, Geba they have made a lodging place, Trembled hath Rama, Gibeah of Saul fled.";
dby[29] = "They are gone through the pass; they make their lodging at Geba: Ramah trembleth, Gibeah of Saul is fled.";
web[29] = "They have gone over the passage: they have taken up their lodging at Geba; Ramah is afraid; Gibeah of Saul hath fled.";
hnv[29] = "they are gone over the pass; they have taken up their lodging at Geva; Ramah trembles; Gevah of Sha\'ul is fled.";
vul[29] = "transierunt cursim Gabee sedes nostra obstipuit Rama Gabaath Saulis fugit";
rsv[30] = "Cry aloud, O daughter of Gallim! Hearken, O La\'ishah! Answer her, O An\'athoth!";
asv[30] = "Cry aloud with thy voice, O daughter of Gallim! hearken, O Laishah! O thou poor Anathoth!";
yng[30] = "Cry aloud [with] thy voice, daughter of Gallim, Give attention, Laish! answer her, Anathoth.";
dby[30] = "Lift up thy voice, daughter of Gallim! Hearken, O Laish! -- Poor Anathoth!";
web[30] = "Lift up thy voice, O daughter of Gallim: cause it to be heard to Laish, O poor Anathoth.";
hnv[30] = "Cry aloud with your voice, daughter of Gallim! listen, Layshah! You poor `Anatot!";
vul[30] = "hinni voce tua filia Gallim adtende Laisa paupercula Anathoth";
rsv[31] = "Madme\'nah is in flight, the inhabitants of Gebim flee for safety.";
asv[31] = "Madmenah is a fugitive; the inhabitants of Gebim flee for safety.";
yng[31] = "Fled away hath Madmenah, The inhabitants of the high places have hardened themselves.";
dby[31] = "Madmenah is fugitive; the inhabitants of Gebim take to flight.";
web[31] = "Madmenah is removed; the inhabitants of Gebim gather themselves to flee.";
hnv[31] = "Madmenah is a fugitive; the inhabitants of Gevim flee for safety.";
vul[31] = "migravit Medemena habitatores Gebim confortamini";
rsv[32] = "This very day he will halt at Nob, he will shake his fist at the mount of the daughter of Zion, the hill of Jerusalem.";
asv[32] = "This very day shall he halt at Nob: he shaketh his hand at the mount of the daughter of Zion, the hill of Jerusalem.";
yng[32] = "Yet to-day in Nob to remain, Wave its hand doth the mount of the daughter of Zion, The hill of Jerusalem.";
dby[32] = "Still a day of halting at Nob; he shaketh his hand [against] the mount of the daughter of Zion, the hill of Jerusalem. ...";
web[32] = "As yet shall he remain at Nob that day: he shall shake his hand [against] the mount of the daughter of Zion, the hill of Jerusalem.";
hnv[32] = "This very day shall he halt at Nov: he shakes his hand at the mountain of the daughter of Tziyon, the hill of Yerushalayim.";
vul[32] = "adhuc dies est ut in Nob stetur agitabit manum suam super montem filiae Sion collem Hierusalem";
rsv[33] = "Behold, the Lord, the LORD of hosts will lop the boughs with terrifying power; the great in height will be hewn down, and the lofty will be brought low.";
asv[33] = "Behold, the Lord, Jehovah of hosts, will lop the boughs with terror: and the high of stature shall be hewn down, and the lofty shall be brought low.";
yng[33] = "Lo, the Lord, Jehovah of Hosts, Is lopping a branch with violence, And the high of stature are cut down, And the lofty are become low,";
dby[33] = "Behold the Lord, Jehovah of hosts, shall lop the boughs with violence; and the high ones of stature shall be hewn down, and the haughty shall be brought low;";
web[33] = "Behold, the Lord, the LORD of hosts will lop the bough with terror: and the high ones of stature [shall be] hewn down, and the haughty shall be humbled.";
hnv[33] = "Behold, the Lord, the LORD of Hosts, will lop the boughs with terror: and the high of stature shall be hewn down, and the lofty shall be brought low.";
vul[33] = "ecce Dominator Dominus exercituum confringet lagunculam in terrore et excelsi statura succidentur et sublimes humiliabuntur";
rsv[34] = "He will cut down the thickets of the forest with an axe, and Lebanon with its majestic trees will fall.";
asv[34] = "And he will cut down the thickets of the forest with iron, and Lebanon shall fall by a mighty one.";
yng[34] = "And He hath gone round the thickets of the forest with iron, And Lebanon by a mighty one falleth!";
dby[34] = "and he shall make clearings in the thickets of the forest with iron; and Lebanon shall fall by a mighty one.";
web[34] = "And he shall cut down the thickets of the forests with iron, and Lebanon shall fall by a mighty one.";
hnv[34] = " He will cut down the thickets of the forest with iron, and Levanon shall fall by a mighty one.";
vul[34] = "et subvertentur condensa saltus ferro et Libanus cum excelsis cadet";
