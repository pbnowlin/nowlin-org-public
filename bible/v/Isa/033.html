csb[1] = "Woe, you destroyer never destroyed, you traitor never betrayed! When you have finished destroying, you will be destroyed. When you have finished betraying, they will betray you.";
csb[2] = "LORD, be gracious to us! We wait for you. Be our strength every morning and our salvation in time of trouble.";
csb[3] = "The peoples flee at the thunderous noise; the nations scatter when you rise in your majesty.";
csb[4] = "Your spoil will be gathered as locusts are gathered; people will swarm over it like an infestation of locusts.";
csb[5] = "The LORD is exalted, for he dwells on high; he has filled Zion with justice and righteousness.";
csb[6] = "There will be times of security for you -- a storehouse of salvation, wisdom, and knowledge. The fear of the LORD is Zion\'s treasure.";
csb[7] = "Listen! Their warriors cry loudly in the streets; the messengers of peace weep bitterly.";
csb[8] = "The highways are deserted; travel has ceased. An agreement has been broken, cities despised, and human life disregarded.";
csb[9] = "The land mourns and withers; Lebanon is ashamed and wilted. Sharon is like a desert; Bashan and Carmel shake off their leaves.";
csb[10] = "&quot;Now I will rise up,&quot; says the LORD. &quot;Now I will lift myself up. Now I will be exalted.";
csb[11] = "&quot;You will conceive chaff; you will give birth to stubble. Your breath is fire that will consume you.";
csb[12] = "&quot;The peoples will be burned to ashes, like thorns cut down and burned in a fire.";
csb[13] = "&quot;You who are far off, hear what I have done; you who are near, know my strength.&quot;";
csb[14] = "The sinners in Zion are afraid; trembling seizes the ungodly: &quot;Who among us can dwell with a consuming fire? Who among us can dwell with ever-burning flames? &quot;";
csb[15] = "The one who lives righteously and speaks rightly, who refuses profit from extortion, whose hand never takes a bribe, who stops his ears from listening to murderous plots and shuts his eyes against evil schemes --";
csb[16] = "he will dwell on the heights; his refuge will be the rocky fortresses, his food provided, his water assured.";
csb[17] = "Your eyes will see the King in his beauty; you will see a vast land.";
csb[18] = "Your mind will meditate on the past terror: &quot;Where is the accountant? Where is the tribute collector? Where is the one who spied out our defenses? &quot;";
csb[19] = "You will no longer see the barbarians, a people whose speech is difficult to comprehend -- who stammer in a language that is not understood.";
csb[20] = "Look at Zion, the city of our festival times. Your eyes will see Jerusalem, a peaceful pasture, a tent that does not wander; its tent pegs will not be pulled up nor will any of its cords be loosened.";
csb[21] = "For the majestic one, our LORD, will be there, a place of rivers and broad streams where ships that are rowed will not go, and majestic vessels will not pass.";
csb[22] = "For the LORD is our Judge, the LORD is our Lawgiver, the LORD is our King. He will save us.";
csb[23] = "Your ropes are slack; they cannot hold the base of the mast or spread out the flag. Then abundant spoil will be divided, the lame will plunder it,";
csb[24] = "and none there will say, &quot;I am sick.&quot; The people who dwell there will be forgiven their iniquity.";
kjv[1] = "Woe to thee that spoilest, and thou [wast] not spoiled; and dealest treacherously, and they dealt not treacherously with thee! when thou shalt cease to spoil, thou shalt be spoiled; [and] when thou shalt make an end to deal treacherously, they shall deal treacherously with thee.";
rsv[1] = "Woe to you, destroyer, who yourself have not been destroyed; you treacherous one, with whom none has dealt treacherously! When you have ceased to destroy, you will be destroyed; and when you have made an end of dealing treacherously, you will be dealt with treacherously.";
asv[1] = "Woe to thee that destroyest, and thou wast not destroyed; and dealest treacherously, and they dealt not treacherously with thee! When thou hast ceased to destroy, thou shalt be destroyed; and when thou hast made an end of dealing treacherously, they shall deal treacherously with thee.";
yng[1] = "Wo, spoiler! and thou not spoiled, And treacherous! and they dealt not treacherously with thee, When thou dost finish, O spoiler, thou art spoiled, When thou dost finish dealing treacherously, They deal treacherously with thee.";
dby[1] = "Woe to thee that spoilest, and thou wast not spoiled; and that dealest treacherously, and they dealt not treacherously with thee! When thou shalt cease to spoil, thou shalt be spoiled; when thou shalt make an end of dealing treacherously, they shall deal treacherously with thee.";
web[1] = "Woe to thee that layest waste, and thou [wast] not laid waste; and dealest treacherously, and they dealt not treacherously with thee! when thou shalt cease to lay waste, thou shalt be wasted; [and] when thou shalt make an end to deal treacherously, they shall deal treacherously with thee.";
hnv[1] = "Woe to you who destroy, and you weren\'t destroyed; and deal treacherously, and they didn\'t deal treacherously with you! When you have ceased to destroy, you shall be destroyed; and when you have made an end of dealing treacherously, they shall deal treacherously with you.";

kjv[20] = "Look upon Zion, the city of our solemnities: thine eyes shall see Jerusalem a quiet habitation, a tabernacle [that] shall not be taken down; not one of the stakes thereof shall ever be removed, neither shall any of the cords thereof be broken.";

asv[20] = "Look upon Zion, the city of our solemnities: thine eyes shall see Jerusalem a quiet habitation, a tent that shall not be removed, the stakes whereof shall never be plucked up, neither shall any of the cords thereof be broken.";
yng[20] = "See Zion, the city of our meetings, Thine eyes see Jerusalem a quiet habitation, A tent not taken down, Not removed are its pins for ever, And none of its cords are broken.";

yng[21] = "But there mighty [is] Jehovah for us, A place of rivers -- streams broad of sides, No ship with oars doth go into it, And a mighty ship doth not pass over it.";

rsv[23] = "Your tackle hangs loose; it cannot hold the mast firm in its place, or keep the sail spread out. Then prey and spoil in abundance will be divided; even the lame will take the prey.";

yng[23] = "Left have been thy ropes, They strengthen not rightly their mast, They have not spread out a sail, Then apportioned hath been a prey of much spoil, The lame have taken spoil.";
dby[23] = "Thy tacklings are loosed; they strengthen not the socket of their mast, they cannot spread the sail: then is the prey of a great spoil divided; the lame take the prey.";
