csb[1] = "This took place during the reign of Ahaz, son of Jotham, son of Uzziah king of Judah: Aram\'s King Rezin and Israel\'s King Pekah son of Remaliah went to fight against Jerusalem, but they were not able to conquer it.";
csb[2] = "When it became known to the house of David that Aram had occupied Ephraim, the heart of Ahaz and the hearts of his people trembled like trees of a forest shaking in the wind.";
csb[3] = "The LORD said to Isaiah, &quot;Go out with your son Shear-jashub to meet Ahaz at the end of the conduit of the upper pool, by the road to the Launderer\'s Field.";
csb[4] = "&quot;Say to him: Calm down and be quiet. Don\'t be afraid or cowardly because of these two smoldering sticks, the fierce anger of Rezin and Aram, and the son of Remaliah.";
csb[5] = "&quot;For Aram, along with Ephraim and the son of Remaliah, has plotted harm against you. They say,";
csb[6] = "&quot;\'Let us go up against Judah, terrorize it, and conquer it for ourselves. Then we can install Tabeel\'s son as king in it.\' &quot;";
csb[7] = "This is what the Lord GOD says: It will not happen; it will not occur.";
csb[8] = "The chief of Aram is Damascus, the chief city of Damascus is Rezin (within sixty-five years Ephraim will be too shattered to be a people),";
csb[9] = "the chief of Ephraim is Samaria, and the chief city of Samaria is the son of Remaliah. If you do not stand firm in your faith, then you will not stand at all.";
csb[10] = "Then the LORD spoke again to Ahaz:";
csb[11] = "&quot;Ask for a sign from the LORD your God -- it can be as deep as Sheol or as high as heaven.&quot;";
csb[12] = "But Ahaz replied, &quot;I will not ask. I will not test the LORD.&quot;";
csb[13] = "Isaiah said, &quot;Listen, house of David! Is it not enough for you to try the patience of men? Will you also try the patience of my God?";
csb[14] = "&quot;Therefore, the Lord himself will give you a sign: See, the virgin will conceive, have a son, and name him Immanuel.";
csb[15] = "&quot;By the time he learns to reject what is bad and choose what is good, he will be eating curds and honey.";
csb[16] = "&quot;For before the boy knows to reject what is bad and choose what is good, the land of the two kings you dread will be abandoned.";
csb[17] = "&quot;The LORD will bring on you, your people, and your father\'s house such a time as has never been since Ephraim separated from Judah: He will bring the king of Assyria.&quot;";
csb[18] = "On that day the LORD will whistle to flies at the farthest streams of the Nile and to bees in the land of Assyria.";
csb[19] = "All of them will come and settle in the steep ravines, in the clefts of the rocks, in all the thornbushes, and in all the water holes.";
csb[20] = "On that day the Lord will use a razor hired from beyond the Euphrates River -- the king of Assyria -- to shave the hair on your heads, the hair on your legs, and even your beards.";
csb[21] = "On that day a man will raise a young cow and two sheep,";
csb[22] = "and from the abundant milk they give he will eat curds, for every survivor in the land will eat curds and honey.";
csb[23] = "And on that day every place where there were a thousand vines, worth a thousand pieces of silver, will become thorns and briers.";
csb[24] = "A man will go there with bow and arrows because the whole land will be thorns and briers.";
csb[25] = "You will not go to all the hills that were once tilled with a hoe, for fear of the thorns and briers. Those hills will be places for oxen to graze and for sheep to trample.";
kjv[1] = "And it came to pass in the days of Ahaz the son of Jotham, the son of Uzziah, king of Judah, [that] Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel, went up toward Jerusalem to war against it, but could not prevail against it.";
rsv[1] = "In the days of Ahaz the son of Jotham, son of Uzzi\'ah, king of Judah, Rezin the king of Syria and Pekah the son of Remali\'ah the king of Israel came up to Jerusalem to wage war against it, but they could not conquer it.";
asv[1] = "And it came to pass in the days of Ahaz the son of Jotham, the son of Uzziah, king of Judah, that Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel, went up to Jerusalem to war against it, but could not prevail against it.";
yng[1] = "And it cometh to pass in the days of Ahaz, son of Jotham, son of Uzziah, king of Judah, gone up hath Rezin king of Aram, and Pekah, son of Remaliah, king of Israel, to Jerusalem, to battle against it, and he is not able to fight against it.";
dby[1] = "And it came to pass in the days of Ahaz, the son of Jotham, the son of Uzziah, king of Judah, [that] Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel, came up to Jerusalem to make war against it, but they were not able to fight against it.";
web[1] = "And it came to pass in the days of Ahaz the son of Jotham, the son of Uzziah, king of Judah, [that] Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel, went up towards Jerusalem to war against it, but could not prevail against it.";
hnv[1] = "It happened in the days of Achaz the son of Yotam, the son of `Uzziyah, king of Yehudah, that Retzin the king of Aram, and Pekach the son of Remalyahu, king of Yisra\'el, went up to Yerushalayim to war against it, but could not prevail against it.";
vul[1] = "et factum est in diebus Ahaz filii Ioatham filii Oziae regis Iuda ascendit Rasin rex Syriae et Phacee filius Romeliae rex Israhel in Hierusalem ad proeliandum contra eam et non potuerunt debellare eam";
