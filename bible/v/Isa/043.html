csb[1] = "Now this is what the LORD says -- the one who created you, Jacob, and the one who formed you, Israel -- &quot;Do not fear, for I have redeemed you; I have called you by your name; you are mine.";
csb[2] = "&quot;I will be with you when you pass through the waters, and when you pass through the rivers, they will not overwhelm you. You will not be scorched when you walk through the fire, and the flame will not burn you.";
csb[3] = "&quot;For I am the LORD your God, the Holy One of Israel, and your Savior. I have given Egypt as a ransom for you, Cush and Seba in your place.";
csb[4] = "&quot;Because you are precious in my sight and honored, and I love you, I will give people in exchange for you and nations instead of your life.";
csb[5] = "&quot;Do not fear, for I am with you; I will bring your descendants from the east, and gather you from the west.";
csb[6] = "&quot;I will say to the north, \'Give them up! \' and to the south, \'Do not hold them back! \' Bring my sons from far away, and my daughters from the ends of the earth --";
csb[7] = "&quot;everyone who bears my name and is created for my glory. I have formed them; indeed, I have made them.&quot;";
csb[8] = "Bring out a people who are blind, yet have eyes, and are deaf, yet have ears.";
csb[9] = "All the nations are gathered together, and the peoples are assembled. Who among them can declare this, and tell us the former things? Let them present their witnesses to vindicate themselves, so that people may hear and say, &quot;It is true.&quot;";
csb[10] = "&quot;You are my witnesses&quot; -- this is the LORD\'s declaration -- &quot;and my servant whom I have chosen, so that you may know and believe me and understand that I am he. No god was formed before me, and there will be none after me.";
csb[11] = "&quot;I -- I am the LORD. Besides me, there is no Savior.";
csb[12] = "&quot;I alone declared, saved, and proclaimed -- and not some foreign god among you. So you are my witnesses&quot; -- this is the LORD\'s declaration -- &quot;and I am God.";
csb[13] = "&quot;Also, from today on I am he alone, and none can rescue from my power. I act, and who can reverse it? &quot;";
csb[14] = "This is what the LORD, your Redeemer, the Holy One of Israel says: Because of you, I will send an army to Babylon and bring all of them as fugitives, even the Chaldeans in the ships in which they rejoice.";
csb[15] = "I am the LORD, your Holy One, the Creator of Israel, your King.";
csb[16] = "This is what the LORD says -- who makes a way in the sea, and a path through raging water,";
csb[17] = "who brings out the chariot and horse, the army and the mighty one together (they lie down, they do not rise again; they are extinguished, put out like a wick) --";
csb[18] = "&quot;Do not remember the past events, pay no attention to things of old.";
csb[19] = "&quot;Look, I am about to do something new; even now it is coming. Do you not see it? Indeed, I will make a way in the wilderness, rivers in the desert.";
csb[20] = "&quot;Wild animals -- jackals and ostriches -- will honor me, because I provide water in the wilderness, and rivers in the desert, to give drink to my chosen people.";
csb[21] = "&quot;The people I formed for myself will declare my praise.";
csb[22] = "&quot;But, Jacob, you have not called on me, because, Israel, you have become weary of me.";
csb[23] = "&quot;You have not brought me your sheep for burnt offerings or honored me with your sacrifices. I have not burdened you with offerings or wearied you with incense.";
csb[24] = "&quot;You have not bought me aromatic cane with silver, or satisfied me with the fat of your sacrifices. But you have burdened me with your sins; you have wearied me with your iniquities.";
csb[25] = "&quot;I -- I sweep away your transgressions for my own sake and remember your sins no more.";
csb[26] = "&quot;Remind me. Let\'s argue the case together. Recount the facts, so that you may be vindicated.";
csb[27] = "&quot;Your first father sinned, and your mediators have rebelled against me.";
csb[28] = "&quot;So I defiled the officers of the sanctuary, and set Jacob apart for destruction and Israel for scorn.";

vul[19] = "ecce ego facio nova et nunc orientur utique cognoscetis ea ponam in deserto viam et in invio flumina";
kjv[20] = "The beast of the field shall honour me, the dragons and the owls: because I give waters in the wilderness, [and] rivers in the desert, to give drink to my people, my chosen.";
rsv[20] = "The wild beasts will honor me, the jackals and the ostriches; for I give water in the wilderness, rivers in the desert, to give drink to my chosen people,";
asv[20] = "The beasts of the field shall honor me, the jackals and the ostriches; because I give waters in the wilderness, and rivers in the desert, to give drink to my people, my chosen,";
yng[20] = "Honour me doth the beast of the field, Dragons and daughters of an ostrich, For I have given in a wilderness waters, Floods in a desolate place, To give drink to My people -- My chosen.";
dby[20] = "The beast of the field shall glorify me, the jackals and the ostriches; for I will give waters in the wilderness, rivers in the waste, to give drink to my people, my chosen.";
web[20] = "The beast of the field shall honor me, the dragons and the owls: because I give waters in the wilderness, [and] rivers in the desert, to give drink to my people, my chosen.";
hnv[20] = "The animals of the field shall honor me, the jackals and the ostriches; because I give waters in the wilderness, and rivers in the desert, to give drink to my people, my chosen,";
vul[20] = "glorificabit me bestia agri dracones et strutiones quia dedi in deserto aquas flumina in invio ut darem potum populo meo electo meo";
kjv[21] = "This people have I formed for myself; they shall shew forth my praise.";
rsv[21] = "the people whom I formed for myself that they might declare my praise.";
asv[21] = "the people which I formed for myself, that they might set forth my praise.";
yng[21] = "This people I have formed for Myself, My praise they recount.";
dby[21] = "This people have I formed for myself: they shall shew forth my praise.";
web[21] = "This people have I formed for myself; they shall show forth my praise.";
hnv[21] = "the people which I formed for myself, that they might set forth my praise.";
vul[21] = "populum istum formavi mihi laudem meam narrabit";
kjv[22] = "But thou hast not called upon me, O Jacob; but thou hast been weary of me, O Israel.";
rsv[22] = "&quot;Yet you did not call upon me, O Jacob; but you have been weary of me, O Israel!";
asv[22] = "Yet thou hast not called upon me, O Jacob; but thou hast been weary of me, O Israel.";
yng[22] = "And Me thou hast not called, O Jacob, For thou hast been wearied of me, O Israel,";
dby[22] = "-- But thou hast not called upon me, Jacob; for thou hast been weary of me, O Israel:";
web[22] = "But thou hast not called upon me, O Jacob; but thou hast been weary of me, O Israel.";
hnv[22] = "Yet you have not called on me, Ya`akov; but you have been weary of me, Yisra\'el.";
vul[22] = "non me invocasti Iacob nec laborasti in me Israhel";
kjv[23] = "Thou hast not brought me the small cattle of thy burnt offerings; neither hast thou honoured me with thy sacrifices. I have not caused thee to serve with an offering, nor wearied thee with incense.";
rsv[23] = "You have not brought me your sheep for burnt offerings, or honored me with your sacrifices. I have not burdened you with offerings, or wearied you with frankincense.";
asv[23] = "Thou hast not brought me of thy sheep for burnt-offerings; neither hast thou honored me with thy sacrifices. I have not burdened thee with offerings, nor wearied thee with frankincense.";
yng[23] = "Thou hast not brought in to Me, The lamb of thy burnt-offerings, And [with] thy sacrifices thou hast not honoured Me, I have not caused thee to serve with a present, Nor wearied thee with frankincense.";
dby[23] = "thou hast not brought me the small cattle of thy burnt-offerings, neither hast thou glorified me with thy sacrifices. I have not caused thee to toil with an oblation, nor wearied thee with incense.";
web[23] = "Thou hast not brought me the small cattle of thy burnt-offerings; neither hast thou honored me with thy sacrifices. I have not caused thee to serve with an offering, nor wearied thee with incense.";
hnv[23] = "You have not brought me of your sheep for burnt offerings; neither have you honored me with your sacrifices. I have not burdened you with offerings, nor wearied you with frankincense.";
vul[23] = "non obtulisti mihi arietem holocausti tui et victimis tuis non glorificasti me non te servire feci in oblatione nec laborem tibi praebui in ture";
kjv[24] = "Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices: but thou hast made me to serve with thy sins, thou hast wearied me with thine iniquities.";
rsv[24] = "You have not bought me sweet cane with money, or satisfied me with the fat of your sacrifices. But you have burdened me with your sins, you have wearied me with your iniquities.";
asv[24] = "Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices; but thou hast burdened me with thy sins, thou hast wearied me with thine iniquities.";
yng[24] = "Thou hast not bought for Me with money sweet cane, And [with] the fat of thy sacrifices hast not filled Me, Only -- thou hast caused Me to serve with thy sins, Thou hast wearied Me with thine iniquities.";
dby[24] = "Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices; but thou hast made me to toil with thy sins, thou hast wearied me with thine iniquities.";
web[24] = "Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices: but thou hast made me to serve with thy sins, thou hast wearied me with thy iniquities.";
hnv[24] = "You have bought me no sweet cane with money, neither have you filled me with the fat of your sacrifices; but you have burdened me with your sins, you have wearied me with your iniquities.";
vul[24] = "non emisti mihi argento calamum et adipe victimarum tuarum non inebriasti me verumtamen servire me fecisti in peccatis tuis praebuisti mihi laborem in iniquitatibus tuis";
kjv[25] = "I, [even] I, [am] he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.";
rsv[25] = "&quot;I, I am He who blots out your transgressions for my own sake, and I will not remember your sins.";
asv[25] = "I, even I, am he that blotteth out thy transgressions for mine own sake; and I will not remember thy sins.";
yng[25] = "I -- I [am] He who is blotting out Thy transgressions for Mine own sake, And thy sins I do not remember.";
dby[25] = "-- I, I [am] He that blotteth out thy transgressions for mine own sake, and I will not remember thy sins.";
web[25] = "I, [even] I, [am] he that blotteth out thy transgressions for my own sake, and will not remember thy sins.";
hnv[25] = "I, even I, am he who blots out your transgressions for my own sake; and I will not remember your sins.";
vul[25] = "ego sum ego sum ipse qui deleo iniquitates tuas propter me et peccatorum tuorum non recordabor";
kjv[26] = "Put me in remembrance: let us plead together: declare thou, that thou mayest be justified.";
rsv[26] = "Put me in remembrance, let us argue together; set forth your case, that you may be proved right.";
asv[26] = "Put me in remembrance; let us plead together: set thou forth [thy cause], that thou mayest be justified.";
yng[26] = "Cause me to remember -- we are judged together, Declare thou that thou mayest be justified.";
dby[26] = "Put me in remembrance, let us plead together; rehearse thine own [cause], that thou mayest be justified.";
web[26] = "Put me in remembrance: let us plead together: declare thou, that thou mayest be justified.";
hnv[26] = "Put me in remembrance; let us plead together: set you forth [your cause], that you may be justified.";
vul[26] = "reduc me in memoriam et iudicemur simul narra si quid habes ut iustificeris";
kjv[27] = "Thy first father hath sinned, and thy teachers have transgressed against me.";
rsv[27] = "Your first father sinned, and your mediators transgressed against me.";
asv[27] = "Thy first father sinned, and thy teachers have transgressed against me.";
yng[27] = "Thy first father sinned, And thine interpreters transgressed against me,";
dby[27] = "Thy first father hath sinned, and thy mediators have rebelled against me.";
web[27] = "Thy first father hath sinned, and thy teachers have transgressed against me.";
hnv[27] = "Your first father sinned, and your teachers have transgressed against me.";
vul[27] = "pater tuus primus peccavit et interpretes tui praevaricati sunt in me";
kjv[28] = "Therefore I have profaned the princes of the sanctuary, and have given Jacob to the curse, and Israel to reproaches.";
rsv[28] = "Therefore I profaned the princes of the sanctuary, I delivered Jacob to utter destruction and Israel to reviling.";
asv[28] = "Therefore I will profane the princes of the sanctuary; and I will make Jacob a curse, and Israel a reviling.";
yng[28] = "And I pollute princes of the sanctuary, And I give Jacob to destruction, and Israel to revilings!";
dby[28] = "And I have profaned the princes of the sanctuary, and have given Jacob to the ban, and Israel to reproaches.";
web[28] = "Therefore I have profaned the princes of the sanctuary, and have given Jacob to the curse, and Israel to reproaches.";
hnv[28] = "Therefore I will profane the princes of the sanctuary; and I will make Ya`akov a curse, and Yisra\'el a reviling.";
vul[28] = "et contaminavi principes sanctos dedi ad internicionem Iacob et Israhel in blasphemiam";
