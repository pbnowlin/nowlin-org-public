csb[1] = "Indeed, a king will reign righteously, and rulers will rule justly.";
csb[2] = "Each will be like a shelter from the wind, a refuge from the rain, like flowing streams in a dry land and the shade of a massive rock in an arid land.";
csb[3] = "Then the eyes of those who see will not be closed, and the ears of those who hear will listen.";
csb[4] = "The reckless mind will gain knowledge, and the stammering tongue will speak clearly and fluently.";
csb[5] = "A fool will no longer be called a noble, nor a scoundrel said to be important.";
csb[6] = "For a fool speaks foolishness and his mind plots iniquity. He lives in a godless way and speaks falsely about the LORD. He leaves the hungry empty and deprives the thirsty of drink.";
csb[7] = "The scoundrel\'s weapons are destructive; he hatches plots to destroy the needy with lies, even when the poor person says what is right.";
csb[8] = "But a noble person plans noble things; he stands up for noble causes.";
csb[9] = "Stand up, you complacent women; listen to me. Pay attention to what I say, you overconfident daughters.";
csb[10] = "In a little more than a year you overconfident ones will shudder, for the grapes will fail and the harvest will not come.";
csb[11] = "Shudder, you complacent ones; tremble, you overconfident ones! Strip yourselves bare and put sackcloth around your waists.";
csb[12] = "Beat your breasts in mourning for the delightful fields and the fruitful vines,";
csb[13] = "for the ground of my people growing thorns and briers, indeed, for every joyous house in the jubilant city.";
csb[14] = "For the palace will be deserted, the busy city abandoned. The hill and the watchtower will become barren places forever, the joy of wild donkeys, and a pasture for flocks,";
csb[15] = "until the Spirit from on high is poured out on us. Then the desert will become an orchard, and the orchard will seem like a forest.";
csb[16] = "Then justice will inhabit the wilderness, and righteousness will dwell in the orchard.";
csb[17] = "The result of righteousness will be peace; the effect of righteousness will be quiet confidence forever.";
csb[18] = "Then my people will dwell in a peaceful place, in safe and secure dwellings.";
csb[19] = "But hail will level the forest, and the city will sink into the depths.";
csb[20] = "You will be happy as you sow seed beside abundant water, and as you let oxen and donkeys range freely.";
kjv[1] = "Behold, a king shall reign in righteousness, and princes shall rule in judgment.";
rsv[1] = "Behold, a king will reign in righteousness, and princes will rule in justice.";
asv[1] = "Behold, a king shall reign in righteousness, and princes shall rule in justice.";
yng[1] = "Lo, for righteousness doth a king reign, As to princes, for judgment they rule.";
dby[1] = "Behold, a king shall reign in righteousness, and princes shall rule in judgment.";
web[1] = "Behold, a king shall reign in righteousness, and princes shall rule in judgment.";
hnv[1] = "Behold, a king shall reign in righteousness, and princes shall rule in justice.";
vul[1] = "ecce in iustitia regnabit rex et principes in iudicio praeerunt";
kjv[2] = "And a man shall be as an hiding place from the wind, and a covert from the tempest; as rivers of water in a dry place, as the shadow of a great rock in a weary land.";
rsv[2] = "Each will be like a hiding place from the wind, a covert from the tempest, like streams of water in a dry place, like the shade of a great rock in a weary land.";
asv[2] = "And a man shall be as a hiding-place from the wind, and a covert from the tempest, as streams of water in a dry place, as the shade of a great rock in a weary land.";
yng[2] = "And each hath been as a hiding-place [from] wind, And as a secret hiding-place [from] inundation, As rivulets of waters in a dry place, As a shadow of a heavy rock in a weary land.";
dby[2] = "And a man shall be as a hiding-place from the wind, and a covert from the storm; as brooks of water in a dry place, as the shadow of a great rock in a thirsty land.";
web[2] = "And a man shall be as a hiding-place from the wind, and a covert from the tempest; as streams of water in a dry place, as the shade of a great rock in a weary land.";
hnv[2] = "A man shall be as a hiding-place from the wind, and a covert from the tempest, as streams of water in a dry place, as the shade of a great rock in a weary land.";
vul[2] = "et erit vir sicut qui absconditur a vento et celat se a tempestate sicut rivi aquarum in siti et umbra petrae prominentis in terra deserta";
kjv[3] = "And the eyes of them that see shall not be dim, and the ears of them that hear shall hearken.";
rsv[3] = "Then the eyes of those who see will not be closed, and the ears of those who hear will hearken.";
asv[3] = "And the eyes of them that see shall not be dim, and the ears of them that hear shall hearken.";
yng[3] = "And not dazzled are the eyes of beholders, And the ears of hearers do attend.";
dby[3] = "And the eyes of them that see shall not be dim, and the ears of them that hear shall hearken;";
web[3] = "And the eyes of them that see shall not be dim, and the ears of them that hear shall hearken.";
hnv[3] = "The eyes of those who see shall not be dim, and the ears of those who hear shall listen.";
vul[3] = "non caligabunt oculi videntium et aures audientium diligenter auscultabunt";
kjv[4] = "The heart also of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.";
rsv[4] = "The mind of the rash will have good judgment, and the tongue of the stammerers will speak readily and distinctly.";
asv[4] = "And the heart of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.";
yng[4] = "And the heart of those hastened Understandeth to know, And the tongue of stammerers hasteth to speak clearly.";
dby[4] = "and the heart of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.";
web[4] = "The heart also of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.";
hnv[4] = "The heart of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.";
vul[4] = "et cor stultorum intelleget scientiam et lingua balborum velociter loquetur et plane";
kjv[5] = "The vile person shall be no more called liberal, nor the churl said [to be] bountiful.";
rsv[5] = "The fool will no more be called noble, nor the knave said to be honorable.";
asv[5] = "The fool shall be no more called noble, nor the churl said to be bountiful.";
yng[5] = "A fool is no more called `noble,\' And to a miser it is not said, `rich;\'";
dby[5] = "The vile man shall be no more called noble, nor the churl said to be bountiful:";
web[5] = "The vile person shall be no more called liberal, nor the churl said [to be] bountiful.";
hnv[5] = " The fool shall be no more called noble, nor the scoundrel be highly respected.";
vul[5] = "non vocabitur ultra is qui insipiens est princeps neque fraudulentus appellabitur maior";
kjv[6] = "For the vile person will speak villany, and his heart will work iniquity, to practise hypocrisy, and to utter error against the LORD, to make empty the soul of the hungry, and he will cause the drink of the thirsty to fail.";
rsv[6] = "For the fool speaks folly, and his mind plots iniquity: to practice ungodliness, to utter error concerning the LORD, to leave the craving of the hungry unsatisfied, and to deprive the thirsty of drink.";
asv[6] = "For the fool will speak folly, and his heart will work iniquity, to practise profaneness, and to utter error against Jehovah, to make empty the soul of the hungry, and to cause the drink of the thirsty to fail.";
yng[6] = "For a fool speaketh folly, And his heart doth iniquity, to do profanity, And to speak concerning Jehovah error, To empty the soul of the hungry, Yea, drink of the thirsty he causeth to lack.";
dby[6] = "for the vile man will speak villainy, and his heart will work iniquity, to practise hypocrisy, and to utter error against Jehovah, to make empty the soul of the hungry, and to cause the drink of the thirsty to fail.";
web[6] = "For the vile person will speak villainy, and his heart will work iniquity, to practice hypocrisy, and to utter error against the LORD, to make empty the soul of the hungry; and he will cause the drink of the thirsty to fail.";
hnv[6] = "For the fool will speak folly, and his heart will work iniquity, to practice profanity, and to utter error against the LORD, to make empty the soul of the hungry, and to cause the drink of the thirsty to fail.";
vul[6] = "stultus enim fatua loquetur et cor eius faciet iniquitatem ut perficiat simulationem et loquatur ad Dominum fraudulenter et vacuefaciat animam esurientis et potum sitienti auferat";
kjv[7] = "The instruments also of the churl [are] evil: he deviseth wicked devices to destroy the poor with lying words, even when the needy speaketh right.";
rsv[7] = "The knaveries of the knave are evil; he devises wicked devices to ruin the poor with lying words, even when the plea of the needy is right.";
asv[7] = "And the instruments of the churl are evil: he deviseth wicked devices to destroy the meek with lying words, even when the needy speaketh right.";
yng[7] = "And the miser -- his instruments [are] evil, He hath counselled wicked devices, To corrupt the poor with lying sayings, Even when the needy speaketh justly.";
dby[7] = "The instruments also of the churl are evil: he deviseth wicked devices to destroy the meek with lying words, even when the needy speaketh right.";
web[7] = "The instruments also of the churl [are] evil: he deviseth wicked devices to destroy the poor with lying words, even when the needy speaketh right.";
hnv[7] = "The instruments of the churl are evil: he devises wicked devices to destroy the humble with lying words, even when the needy speaks right.";
vul[7] = "fraudulenti vasa pessima sunt ipse enim cogitationes concinnavit ad perdendos mites in sermone mendacii cum loqueretur pauper iudicium";
kjv[8] = "But the liberal deviseth liberal things; and by liberal things shall he stand.";
rsv[8] = "But he who is noble devises noble things, and by noble things he stands.";
asv[8] = "But the noble deviseth noble things; and in noble things shall he continue.";
yng[8] = "And the noble counselled noble things, And he for noble things riseth up.";
dby[8] = "But the noble deviseth noble things; and to noble things doth he stand.";
web[8] = "But the liberal deviseth liberal things; and by liberal things shall he stand.";
hnv[8] = "But the noble devises noble things; and in noble things shall he continue.";
vul[8] = "princeps vero ea quae digna sunt principe cogitavit et ipse super duces stabit";
kjv[9] = "Rise up, ye women that are at ease; hear my voice, ye careless daughters; give ear unto my speech.";
rsv[9] = "Rise up, you women who are at ease, hear my voice; you complacent daughters, give ear to my speech.";
asv[9] = "Rise up, ye women that are at ease, [and] hear my voice; ye careless daughters, give ear unto my speech.";
yng[9] = "Women, easy ones, rise, hear my voice, Daughters, confident ones, give ear [to] my saying,";
dby[9] = "Rise up, ye women that are at ease, hear my voice; ye careless daughters, give ear unto my speech.";
web[9] = "Rise up, ye women that are at ease; hear my voice, ye careless daughters; give ear to my speech.";
hnv[9] = "Rise up, you women who are at ease, [and] hear my voice; you careless daughters, give ear to my speech.";
vul[9] = "mulieres opulentae surgite et audite vocem meam filiae confidentes percipite auribus eloquium meum";
kjv[10] = "Many days and years shall ye be troubled, ye careless women: for the vintage shall fail, the gathering shall not come.";
rsv[10] = "In little more than a year you will shudder, you complacent women; for the vintage will fail, the fruit harvest will not come.";
asv[10] = "For days beyond a year shall ye be troubled, ye careless women; for the vintage shall fail, the ingathering shall not come.";
yng[10] = "Days and a year ye are troubled, O confident ones, For consumed hath been harvest, The gathering cometh not.";
dby[10] = "In a year and [some] days shall ye be troubled, ye careless women; for the vintage shall fail, the ingathering shall not come.";
web[10] = "Many days and years shall ye be troubled, ye careless women: for the vintage shall fail, the gathering shall not come.";
hnv[10] = "For days beyond a year shall you be troubled, you careless women; for the vintage shall fail, the harvest shall not come.";
vul[10] = "post dies et annum et vos conturbabimini confidentes consummata est enim vindemia collectio ultra non veniet";
kjv[11] = "Tremble, ye women that are at ease; be troubled, ye careless ones: strip you, and make you bare, and gird [sackcloth] upon [your] loins.";
rsv[11] = "Tremble, you women who are at ease, shudder, you complacent ones; strip, and make yourselves bare, and gird sackcloth upon your loins.";
asv[11] = "Tremble, ye women that are at ease; be troubled, ye careless ones; strip you, and make you bare, and gird [sackcloth] upon your loins.";
yng[11] = "Tremble ye women, ye easy ones, Be troubled, ye confident ones, Strip and make bare, with a girdle on the loins,";
dby[11] = "Tremble, ye women that are at ease; be troubled, ye careless ones; strip you, and make you bare, and gird [sackcloth] on your loins!";
web[11] = "Tremble, ye women that are at ease; be troubled, ye careless ones: strip ye, and make you bare, and gird [sackcloth] upon [your] loins.";
hnv[11] = "Tremble, you women who are at ease; be troubled, you careless ones; strip yourselves, and make yourselves naked, and gird [sackcloth] on your loins.";
vul[11] = "obstupescite opulentae conturbamini confidentes exuite vos et confundimini accingite lumbos vestros";
kjv[12] = "They shall lament for the teats, for the pleasant fields, for the fruitful vine.";
rsv[12] = "Beat upon your breasts for the pleasant fields, for the fruitful vine,";
asv[12] = "They shall smite upon the breasts for the pleasant fields, for the fruitful vine.";
yng[12] = "For breasts they are lamenting, For fields of desire, for the fruitful vine.";
dby[12] = "They shall smite on the breasts [in lamentation] for the pleasant fields, for the fruitful vineyards.";
web[12] = "They shall lament for the breasts, for the pleasant fields, for the fruitful vine.";
hnv[12] = "They shall strike on the breasts for the pleasant fields, for the fruitful vine.";
vul[12] = "super ubera plangite super regione desiderabili super vinea fertili";
kjv[13] = "Upon the land of my people shall come up thorns [and] briers; yea, upon all the houses of joy [in] the joyous city:";
rsv[13] = "for the soil of my people growing up in thorns and briers; yea, for all the joyous houses in the joyful city.";
asv[13] = "Upon the land of my people shall come up thorns and briers; yea, upon all the houses of joy in the joyous city.";
yng[13] = "Over the ground of my people thorn -- brier goeth up, Surely over all houses of joy of the exulting city,";
dby[13] = "Upon the land of my people shall come up thistles [and] briars, yea, upon all the houses of joy in the joyous city.";
web[13] = "Upon the land of my people shall come up thorns [and] briers; also, upon all the houses of joy [in] the joyous city:";
hnv[13] = "On the land of my people shall come up thorns and briers; yes, on all the houses of joy in the joyous city.";
vul[13] = "super humum populi mei spina et vepres ascendent quanto magis super omnes domos gaudii civitatis exultantis";
kjv[14] = "Because the palaces shall be forsaken; the multitude of the city shall be left; the forts and towers shall be for dens for ever, a joy of wild asses, a pasture of flocks;";
rsv[14] = "For the palace will be forsaken, the populous city deserted; the hill and the watchtower will become dens for ever, a joy of wild asses, a pasture of flocks;";
asv[14] = "For the palace shall be forsaken; the populous city shall be deserted; the hill and the watch-tower shall be for dens for ever, a joy of wild asses, a pasture of flocks;";
yng[14] = "Surely the palace hath been left, The multitude of the city forsaken, Fort and watch-tower hath been for dens unto the age, A joy of wild asses -- a pasture of herds;";
dby[14] = "For the palace shall be deserted, the multitude of the city shall be forsaken; hill and watchtower shall be caves for ever, a joy of wild asses, a pasture of flocks;";
web[14] = "Because the palaces shall be forsaken; the multitude of the city shall be left; the forts and towers shall be for dens for ever, a joy of wild asses, a pasture of flocks;";
hnv[14] = "For the palace shall be forsaken; the populous city shall be deserted; the hill and the watch-tower shall be for dens forever, a joy of wild donkeys, a pasture of flocks;";

asv[15] = "until the Spirit be poured upon us from on high, and the wilderness become a fruitful field, and the fruitful field be esteemed as a forest.";
yng[15] = "Till emptied out on us is the Spirit from on high, And a wilderness hath become a fruitful field, And the fruitful field for a forest is reckoned.";
dby[15] = "until the Spirit be poured upon us from on high, and the wilderness become a fruitful field, and the fruitful field be counted for a forest.";
web[15] = "Until the spirit shall be poured upon us from on high, and the wilderness shall be a fruitful field, and the fruitful field shall be counted for a forest.";
hnv[15] = " until the Spirit be poured on us from on high, and the wilderness become a fruitful field, and the fruitful field be esteemed as a forest.";

kjv[16] = "Then judgment shall dwell in the wilderness, and righteousness remain in the fruitful field.";

asv[16] = "Then justice shall dwell in the wilderness; and righteousness shall abide in the fruitful field.";
yng[16] = "And dwelt in the wilderness hath judgment, And righteousness in the fruitful field remaineth.";

web[16] = "Then judgment shall dwell in the wilderness, and righteousness remain in the fruitful field.";
hnv[16] = "Then justice shall dwell in the wilderness; and righteousness shall abide in the fruitful field.";

asv[17] = "And the work of righteousness shall be peace; and the effect of righteousness, quietness and confidence for ever.";

asv[18] = "And my people shall abide in a peaceable habitation, and in safe dwellings, and in quiet resting-places.";

dby[18] = "And my people shall dwell in a peaceable habitation, and in sure dwellings, and in quiet resting-places.";

dby[19] = "And it shall hail, coming down on the forest; and the city shall be low in a low place.";

asv[20] = "Blessed are ye that sow beside all waters, that send forth the feet of the ox and the ass.";
yng[20] = "Happy [are] ye sowing by all waters, Sending forth the foot of the ox and the ass!";
