csb[1] = "In those days Hezekiah became terminally ill. The prophet Isaiah son of Amoz came and said to him, &quot;This is what the LORD says: \'Set your house in order, for you are about to die; you will not recover.\' &quot;";
csb[2] = "Then Hezekiah turned his face to the wall and prayed to the LORD.";
csb[3] = "He said, &quot;Please, LORD, remember how I have walked before you faithfully and wholeheartedly, and have done what pleases you.&quot; And Hezekiah wept bitterly.";
csb[4] = "Then the word of the LORD came to Isaiah:";
csb[5] = "&quot;Go and tell Hezekiah, \'This is what the LORD God of your ancestor David says: I have heard your prayer; I have seen your tears. Look, I am going to add fifteen years to your life.";
csb[6] = "&quot;And I will rescue you and this city from the grasp of the king of Assyria; I will defend this city.";
csb[7] = "&quot;This is the sign to you from the LORD that he will do what he has promised:";
csb[8] = "&quot;I am going to make the sun\'s shadow that goes down on the stairway of Ahaz go back by ten steps.\' &quot; So the sun\'s shadow went back the ten steps it had descended.";
csb[9] = "A poem by King Hezekiah of Judah after he had been sick and had recovered from his illness:";
csb[10] = "I said: In the prime of my life I must go to the gates of Sheol; I am deprived of the rest of my years.";
csb[11] = "I said: I will never see the LORD, the LORD in the land of the living; I will not look on humanity any longer with the inhabitants of what is passing away.";
csb[12] = "My dwelling is plucked up and removed from me like a shepherd\'s tent. I have rolled up my life like a weaver; he cuts me off from the loom. By nightfall you make an end of me.";
csb[13] = "I thought until the morning: He will break all my bones like a lion. By nightfall you make an end of me.";
csb[14] = "I chirp like a swallow or a crane; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; support me.";
csb[15] = "What can I say? He has spoken to me, and he himself has done it. I walk along slowly all my years because of the bitterness of my soul.";
csb[16] = "Lord, by such things people live, and in every one of them my spirit finds life; you have restored me to health and let me live.";
csb[17] = "Indeed, it was for my own well-being that I had such intense bitterness; but your love has delivered me from the Pit of destruction, for you have thrown all my sins behind your back.";
csb[18] = "For Sheol cannot thank you; Death cannot praise you. Those who go down to the Pit cannot hope for your faithfulness.";
csb[19] = "The living, only the living can thank you, as I do today; a father will make your faithfulness known to children.";
csb[20] = "The LORD is ready to save me; we will play stringed instruments all the days of our lives at the house of the LORD.";
csb[21] = "Now Isaiah had said, &quot;Let them take a lump of pressed figs and apply it to his infected skin, so that he may recover.&quot;";
csb[22] = "And Hezekiah had asked, &quot;What is the sign that I will go up to the LORD\'s temple? &quot;";

yng[1] = "In those days hath Hezekiah been sick unto death, and come in unto him doth Isaiah son of Amoz, the prophet, and saith unto him, `Thus said Jehovah: Give a charge to thy house, for thou [art] dying, and dost not live.\'";
