csb[1] = "Woe to the land of buzzing insect wings beyond the rivers of Cush,";
csb[2] = "which sends envoys by sea, in reed vessels over the water. Go, swift messengers, to a nation tall and smooth-skinned, to a people feared far and near, a powerful nation with a strange language, whose land is divided by rivers.";
csb[3] = "All you inhabitants of the world and you who live on the earth, when a banner is raised on the mountains, look! When a trumpet sounds, listen!";
csb[4] = "For the LORD said to me: I will quietly look out from my place, like shimmering heat in sunshine, like a rain cloud in harvest heat.";
csb[5] = "For before the harvest, when the blossoming is over and the blossom becomes a ripening grape, he will cut off the shoots with a pruning knife, and tear away and remove the branches.";
csb[6] = "They will all be left for the birds of prey on the hills and for the wild animals of the land. The birds of prey will spend the summer feeding on them, and all the wild animals the winter.";
csb[7] = "At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, a people feared far and near, a powerful nation with a strange language, whose land is divided by rivers -- to Mount Zion, the place of the name of the LORD of Armies.";
