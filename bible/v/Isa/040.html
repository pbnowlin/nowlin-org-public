csb[1] = "&quot;Comfort, comfort my people,&quot; says your God.";
csb[2] = "&quot;Speak tenderly to Jerusalem, and announce to her that her time of forced labor is over, her iniquity has been pardoned, and she has received from the LORD\'s hand double for all her sins.&quot;";
csb[3] = "A voice of one crying out: Prepare the way of the LORD in the wilderness; make a straight highway for our God in the desert.";
csb[4] = "Every valley will be lifted up, and every mountain and hill will be leveled; the uneven ground will become smooth and the rough places, a plain.";
csb[5] = "And the glory of the LORD will appear, and all humanity together will see it, for the mouth of the LORD has spoken.";
csb[6] = "A voice was saying, &quot;Cry out! &quot; Another said, &quot;What should I cry out? &quot; &quot;All humanity is grass, and all its goodness is like the flower of the field.";
csb[7] = "&quot;The grass withers, the flowers fade when the breath of the LORD blows on them; indeed, the people are grass.";
csb[8] = "&quot;The grass withers, the flowers fade, but the word of our God remains forever.&quot;";
csb[9] = "Zion, herald of good news, go up on a high mountain. Jerusalem, herald of good news, raise your voice loudly. Raise it, do not be afraid! Say to the cities of Judah, &quot;Here is your God! &quot;";
csb[10] = "See, the Lord GOD comes with strength, and his power establishes his rule. His wages are with him, and his reward accompanies him.";
csb[11] = "He protects his flock like a shepherd; he gathers the lambs in his arms and carries them in the fold of his garment. He gently leads those that are nursing.";
csb[12] = "Who has measured the waters in the hollow of his hand or marked off the heavens with the span of his hand? Who has gathered the dust of the earth in a measure or weighed the mountains on a balance and the hills on the scales?";
csb[13] = "Who has directed the Spirit of the LORD, or who gave him counsel?";
csb[14] = "Who did he consult? Who gave him understanding and taught him the paths of justice? Who taught him knowledge and showed him the way of understanding?";
csb[15] = "Look, the nations are like a drop in a bucket; they are considered as a speck of dust on the scales; he lifts up the islands like fine dust.";
csb[16] = "Lebanon\'s cedars are not enough for fuel, or its animals enough for a burnt offering.";
csb[17] = "All the nations are as nothing before him; they are considered by him as empty nothingness.";
csb[18] = "With whom will you compare God? What likeness will you set up for comparison with him?";
csb[19] = "An idol? -- something that a smelter casts and a metalworker plates with gold and makes silver chains for?";
csb[20] = "A poor person contributes wood for a pedestal that will not rot. He looks for a skilled craftsman to set up an idol that will not fall over.";
csb[21] = "Do you not know? Have you not heard? Has it not been declared to you from the beginning? Have you not considered the foundations of the earth?";
csb[22] = "God is enthroned above the circle of the earth; its inhabitants are like grasshoppers. He stretches out the heavens like thin cloth and spreads them out like a tent to live in.";
csb[23] = "He reduces princes to nothing and makes judges of the earth like a wasteland.";
csb[24] = "They are barely planted, barely sown, their stem hardly takes root in the ground when he blows on them and they wither, and a whirlwind carries them away like stubble.";
csb[25] = "&quot;To whom will you compare me, or who is my equal? &quot; asks the Holy One.";
csb[26] = "Look up and see! Who created these? He brings out the stars by number; he calls all of them by name. Because of his great power and strength, not one of them is missing.";
csb[27] = "Jacob, why do you say, and, Israel, why do you assert: &quot;My way is hidden from the LORD, and my claim is ignored by my God&quot;?";
csb[28] = "Do you not know? Have you not heard? The LORD is the everlasting God, the Creator of the whole earth. He never becomes faint or weary; there is no limit to his understanding.";
csb[29] = "He gives strength to the faint and strengthens the powerless.";
csb[30] = "Youths may become faint and weary, and young men stumble and fall,";
csb[31] = "but those who trust in the LORD will renew their strength; they will soar on wings like eagles; they will run and not become weary, they will walk and not faint.";

kjv[21] = "Have ye not known? have ye not heard? hath it not been told you from the beginning? have ye not understood from the foundations of the earth?";
rsv[21] = "Have you not known? Have you not heard? Has it not been told you from the beginning? Have you not understood from the foundations of the earth?";
asv[21] = "Have ye not known? have ye not heard? hath it not been told you from the beginning? have ye not understood from the foundations of the earth?";
yng[21] = "Do ye not know -- do ye not hear? Hath it not been declared from the first to you? Have ye not understood [From] the foundations of the earth?";
dby[21] = "-- Do ye not know? Have ye not heard? Hath it not been told you from the beginning? Have ye not understood the foundation of the earth?";
web[21] = "Have ye not known? have ye not heard? hath it not been told you from the beginning? have ye not understood from the foundations of the earth?";
hnv[21] = "Have you not known? have yet not heard? has it not been told you from the beginning? have you not understood from the foundations of the eretz?";
vul[21] = "numquid non scietis numquid non audietis numquid non adnuntiatum est ab initio vobis numquid non intellexistis fundamenta terrae";
kjv[22] = "[It is] he that sitteth upon the circle of the earth, and the inhabitants thereof [are] as grasshoppers; that stretcheth out the heavens as a curtain, and spreadeth them out as a tent to dwell in:";
rsv[22] = "It is he who sits above the circle of the earth, and its inhabitants are like grasshoppers; who stretches out the heavens like a curtain, and spreads them like a tent to dwell in;";
asv[22] = "[It is] he that sitteth above the circle of the earth, and the inhabitants thereof are as grasshoppers; that stretcheth out the heavens as a curtain, and spreadeth them out as a tent to dwell in;";
yng[22] = "He who is sitting on the circle of the earth, And its inhabitants [are] as grasshoppers, He who is stretching out as a thin thing the heavens, And spreadeth them as a tent to dwell in.";
dby[22] = "[It is] he that sitteth upon the circle of the earth, and the inhabitants thereof are as grasshoppers; that stretcheth out the heavens as a gauze curtain, and spreadeth them out as a tent to dwell in;";
web[22] = "[It is] he that sitteth upon the circle of the earth, and its inhabitants [are] as grasshoppers; that stretcheth out the heavens as a curtain, and spreadeth them out as a tent to dwell in:";
hnv[22] = "[It is] he who sits above the circle of the eretz, and the inhabitants of it are as grasshoppers; who stretches out the heavens as a curtain, and spreads them out as a tent to dwell in;";
vul[22] = "qui sedet super gyrum terrae et habitatores eius sunt quasi lucustae qui extendit velut nihilum caelos et expandit eos sicut tabernaculum ad inhabitandum";
kjv[23] = "That bringeth the princes to nothing; he maketh the judges of the earth as vanity.";
rsv[23] = "who brings princes to nought, and makes the rulers of the earth as nothing.";
asv[23] = "that bringeth princes to nothing; that maketh the judges of the earth as vanity.";
yng[23] = "He who is making princes become nothing, Judges of earth as emptiness hath made;";
dby[23] = "that bringeth the princes to nothing, that maketh the judges of the earth as vanity.";
web[23] = "That bringeth the princes to nothing; he maketh the judges of the earth as vanity.";
hnv[23] = "who brings princes to nothing; who makes the judges of the eretz as vanity.";
vul[23] = "qui dat secretorum scrutatores quasi non sint iudices terrae velut inane fecit";
kjv[24] = "Yea, they shall not be planted; yea, they shall not be sown: yea, their stock shall not take root in the earth: and he shall also blow upon them, and they shall wither, and the whirlwind shall take them away as stubble.";
rsv[24] = "Scarcely are they planted, scarcely sown, scarcely has their stem taken root in the earth, when he blows upon them, and they wither, and the tempest carries them off like stubble.";
asv[24] = "Yea, they have not been planted; yea, they have not been sown; yea, their stock hath not taken root in the earth: moreover he bloweth upon them, and they wither, and the whirlwind taketh them away as stubble.";
yng[24] = "Yea, they have not been planted, Yea, they have not been sown, Yea, not taking root in the earth is their stock, And also He hath blown upon them, and they wither, And a whirlwind as stubble taketh them away.";
dby[24] = "Scarcely are they planted, scarcely are they sown, scarcely hath their stock taken root in the earth, but he also bloweth upon them and they wither, and the whirlwind taketh them away as stubble.";
web[24] = "Yes, they shall not be planted; yes, they shall not be sown: yes, their stock shall not take root in the earth: and he shall also blow upon them, and they shall wither, and the whirlwind shall take them away as stubble.";
hnv[24] = "Yes, they have not been planted; yes, they have not been sown; yes, their stock has not taken root in the eretz: moreover he blows on them, and they wither, and the whirlwind takes them away as stubble.";
vul[24] = "et quidem neque plantatos neque satos neque radicato in terra trunco eorum repente flavit in eos et aruerunt et turbo quasi stipulam auferet eos";
kjv[25] = "To whom then will ye liken me, or shall I be equal? saith the Holy One.";
rsv[25] = "To whom then will you compare me, that I should be like him? says the Holy One.";
asv[25] = "To whom then will ye liken me, that I should be equal [to him]? saith the Holy One.";
yng[25] = "And unto whom do ye liken Me, And [am] I equal? saith the Holy One.";
dby[25] = "To whom then will ye liken me, or shall I be equal? saith the Holy One.";
web[25] = "To whom then will ye liken me, or shall I be equaled? saith the Holy One.";
hnv[25] = "To whom then will you liken me, that I should be equal [to him]? says the Holy One.";
vul[25] = "et cui adsimilastis me et adaequastis dicit Sanctus";
kjv[26] = "Lift up your eyes on high, and behold who hath created these [things], that bringeth out their host by number: he calleth them all by names by the greatness of his might, for that [he is] strong in power; not one faileth.";
rsv[26] = "Lift up your eyes on high and see: who created these? He who brings out their host by number, calling them all by name; by the greatness of his might, and because he is strong in power not one is missing.";
asv[26] = "Lift up your eyes on high, and see who hath created these, that bringeth out their host by number; he calleth them all by name; by the greatness of his might, and for that he is strong in power, not one is lacking.";
yng[26] = "Lift up on high your eyes, And see -- who hath prepared these? He who is bringing out by number their host, To all of them by name He calleth, By abundance of strength (And [he is] strong in power) not one is lacking.";
dby[26] = "Lift up your eyes on high, and see! Who hath created these things, bringing out their host by number? He calleth them all by name; through the greatness of his might and strength of power, not one faileth.";
web[26] = "Lift up your eyes on high, and behold who hath created these [things], that bringeth out their host by number: he calleth them all by names, by the greatness of his might, for that [he] is strong in power; not one faileth.";
hnv[26] = "Lift up your eyes on high, and see who has created these, who brings out their host by number; he calls them all by name; by the greatness of his might, and because he is strong in power, not one is lacking.";
vul[26] = "levate in excelsum oculos vestros et videte quis creavit haec qui educit in numero militiam eorum et omnes ex nomine vocat prae multitudine fortitudinis et roboris virtutisque eius neque unum reliquum fuit";
kjv[27] = "Why sayest thou, O Jacob, and speakest, O Israel, My way is hid from the LORD, and my judgment is passed over from my God?";
rsv[27] = "Why do you say, O Jacob, and speak, O Israel, &quot;My way is hid from the LORD, and my right is disregarded by my God&quot;?";
asv[27] = "Why sayest thou, O Jacob, and speakest, O Israel, My way is hid from Jehovah, and the justice [due] to me is passed away from my God?";
yng[27] = "Why sayest thou, O Jacob? and speakest thou, O Israel? `My way hath been hid from Jehovah, And from my God my judgment passeth over.\'";
dby[27] = "Why sayest thou, Jacob, and speakest, O Israel, My way is hid from Jehovah, and my right is passed away from my God?";
web[27] = "Why sayest thou, O Jacob, and speakest, O Israel, My way is hid from the LORD, and my judgment is passed over by my God?";
hnv[27] = "Why say you, Ya`akov, and speak, Yisra\'el, My way is hid from the LORD, and the justice [due] to me is passed away from my God?";
vul[27] = "quare dicis Iacob et loqueris Israhel abscondita est via mea a Domino et a Deo meo iudicium meum transibit";
kjv[28] = "Hast thou not known? hast thou not heard, [that] the everlasting God, the LORD, the Creator of the ends of the earth, fainteth not, neither is weary? [there is] no searching of his understanding.";
rsv[28] = "Have you not known? Have you not heard? The LORD is the everlasting God, the Creator of the ends of the earth. He does not faint or grow weary, his understanding is unsearchable.";
asv[28] = "Hast thou not known? hast thou not heard? The everlasting God, Jehovah, the Creator of the ends of the earth, fainteth not, neither is weary; there is no searching of his understanding.";
yng[28] = "Hast thou not known? hast thou not heard? The God of the age -- Jehovah, Preparer of the ends of the earth, Is not wearied nor fatigued, There is no searching of His understanding.";
dby[28] = "Dost thou not know, hast thou not heard, that the everlasting God, Jehovah, the Creator of the ends of the earth, fainteth not nor tireth? There is no searching of his understanding.";
web[28] = "Hast thou not known? hast thou not heard, [that] the everlasting God, the LORD, the Creator of the ends of the earth, fainteth not, neither is weary? [there is] no searching of his understanding.";
hnv[28] = "Have you not known? have you not heard? The everlasting God, the LORD, the Creator of the ends of the eretz, doesn\'t faint, neither is weary; there is no searching of his understanding.";
vul[28] = "numquid nescis aut non audisti Deus sempiternus Dominus qui creavit terminos terrae non deficiet neque laborabit nec est investigatio sapientiae eius";
kjv[29] = "He giveth power to the faint; and to [them that have] no might he increaseth strength.";
rsv[29] = "He gives power to the faint, and to him who has no might he increases strength.";
asv[29] = "He giveth power to the faint; and to him that hath no might he increaseth strength.";
yng[29] = "He is giving power to the weary, And to those not strong He increaseth might.";
dby[29] = "He giveth power to the faint; and to him that hath no might he increaseth strength.";
web[29] = "He giveth power to the faint; and to [them that have] no might he increaseth strength.";
hnv[29] = " He gives power to the faint; and to him who has no might he increases strength.";
vul[29] = "qui dat lasso virtutem et his qui non sunt fortitudinem et robur multiplicat";

yng[30] = "Even youths are wearied and fatigued, And young men utterly stumble,";
dby[30] = "Even the youths shall faint and shall tire, and the young men shall stumble and fall;";
web[30] = "Even the youths shall faint and be weary, and the young men shall utterly fall:";
hnv[30] = "Even the youths shall faint and be weary, and the young men shall utterly fall:";
vul[30] = "deficient pueri et laborabunt et iuvenes in infirmitate cadent";

asv[31] = "but they that wait for Jehovah shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; they shall walk, and not faint.";
yng[31] = "But those expecting Jehovah pass [to] power, They raise up the pinion as eagles, They run and are not fatigued, They go on and do not faint!";
