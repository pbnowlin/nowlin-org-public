csb[1] = "&quot;Be silent before me, coasts and islands! And let peoples renew their strength. Let them approach; let them testify; let\'s come together for the trial.";
csb[2] = "&quot;Who has stirred up someone from the east? In righteousness he calls him to serve. The LORD hands nations over to him, and he subdues kings. He makes them like dust with his sword, like wind-driven stubble with his bow.";
csb[3] = "&quot;He pursues them, going on safely, hardly touching the path with his feet.";
csb[4] = "&quot;Who has performed and done this, calling the generations from the beginning? I am the LORD, the first and with the last -- I am he.&quot;";
csb[5] = "The coasts and islands see and are afraid, the whole earth trembles. They approach and arrive.";
csb[6] = "Each one helps the other, and says to another, &quot;Take courage! &quot;";
csb[7] = "The craftsman encourages the metalworker; the one who flattens with the hammer encourages the one who strikes the anvil, saying of the soldering, &quot;It is good.&quot; He fastens it with nails so that it will not fall over.";
csb[8] = "But you, Israel, my servant, Jacob, whom I have chosen, descendant of Abraham, my friend --";
csb[9] = "I brought you from the ends of the earth and called you from its farthest corners. I said to you: You are my servant; I have chosen you; I haven\'t rejected you.";
csb[10] = "Do not fear, for I am with you; do not be afraid, for I am your God. I will strengthen you; I will help you; I will hold on to you with my righteous right hand.";
csb[11] = "Be sure that all who are enraged against you will be ashamed and disgraced; those who contend with you will become as nothing and will perish.";
csb[12] = "You will look for those who contend with you, but you will not find them. Those who war against you will become absolutely nothing.";
csb[13] = "For I am the LORD your God, who holds your right hand, who says to you, \'Do not fear, I will help you.";
csb[14] = "Do not fear, you worm Jacob, you men of Israel. I will help you\' -- this is the LORD\'s declaration. Your Redeemer is the Holy One of Israel.";
csb[15] = "See, I will make you into a sharp threshing board, new, with many teeth. You will thresh mountains and pulverize them and make hills into chaff.";
csb[16] = "You will winnow them and a wind will carry them away, a whirlwind will scatter them. But you will rejoice in the LORD; you will boast in the Holy One of Israel.";
csb[17] = "The poor and the needy seek water, but there is none; their tongues are parched with thirst. I will answer them. I am the LORD, the God of Israel. I will not abandon them.";
csb[18] = "I will open rivers on the barren heights, and springs in the middle of the plains. I will turn the desert into a pool and dry land into springs.";
csb[19] = "I will plant cedars, acacias, myrtles, and olive trees in the wilderness. I will put juniper trees, elms, and cypress trees together in the desert,";
csb[20] = "so that all may see and know, consider and understand, that the hand of the LORD has done this, the Holy One of Israel has created it.";
csb[21] = "&quot;Submit your case,&quot; says the LORD. &quot;Present your arguments,&quot; says Jacob\'s King.";
csb[22] = "&quot;Let them come and tell us what will happen. Tell us the past events, so that we may reflect on them and know the outcome, or tell us the future.";
csb[23] = "&quot;Tell us the coming events, then we will know that you are gods. Indeed, do something good or bad, then we will be in awe when we see it.";
csb[24] = "&quot;Look, you are nothing and your work is worthless. Anyone who chooses you is detestable.";
csb[25] = "&quot;I have stirred up one from the north, and he has come, one from the east who invokes my name. He will march over rulers as if they were mud, like a potter who treads the clay.";
csb[26] = "&quot;Who told about this from the beginning, so that we might know, and from times past, so that we might say, \'He is right\'? No one announced it, no one told it, no one heard your words.";
csb[27] = "&quot;I was the first to say to Zion, \'Look! Here they are! \' And I gave Jerusalem a herald with good news.";
csb[28] = "&quot;When I look, there is no one; there is no counselor among them; when I ask them, they have nothing to say.";
csb[29] = "&quot;Look, all of them are a delusion; their works are nonexistent; their images are wind and emptiness.";

kjv[2] = "Who raised up the righteous [man] from the east, called him to his foot, gave the nations before him, and made [him] rule over kings? he gave [them] as the dust to his sword, [and] as driven stubble to his bow.";

vul[18] = "aperiam in supinis collibus flumina et in medio camporum fontes ponam desertum in stagna aquarum et terram inviam in rivos aquarum";
kjv[19] = "I will plant in the wilderness the cedar, the shittah tree, and the myrtle, and the oil tree; I will set in the desert the fir tree, [and] the pine, and the box tree together:";
rsv[19] = "I will put in the wilderness the cedar, the acacia, the myrtle, and the olive; I will set in the desert the cypress, the plane and the pine together;";
asv[19] = "I will put in the wilderness the cedar, the acacia, and the myrtle, and the oil-tree; I will set in the desert the fir-tree, the pine, and the box-tree together:";
yng[19] = "I give in a wilderness the cedar, Shittah, and myrtle, and oil-tree, I set in a desert the fir-pine and box-wood together.";
dby[19] = "I will give in the wilderness the cedar, acacia, myrtle, and oleaster; I will set in the desert the cypress, pine, and box-tree together;";
web[19] = "I will plant in the wilderness the cedar, the shittah-tree, and the myrtle, and the oil-tree; I will set in the desert the fir-tree, the pine, and the box-tree together:";
hnv[19] = "I will put in the wilderness the cedar, the shittim, and the myrtle, and the oil tree; I will set in the desert the fir tree, the pine, and the box tree together:";
vul[19] = "dabo in solitudine cedrum et spinam et myrtum et lignum olivae ponam in deserto abietem ulmum et buxum simul";
kjv[20] = "That they may see, and know, and consider, and understand together, that the hand of the LORD hath done this, and the Holy One of Israel hath created it.";
rsv[20] = "that men may see and know, may consider and understand together, that the hand of the LORD has done this, the Holy One of Israel has created it.";
asv[20] = "that they may see, and know, and consider, and understand together, that the hand of Jehovah hath done this, and the Holy One of Israel hath created it.";
yng[20] = "So that they see, and know, And regard, and act wisely together, For the hand of Jehovah hath done this, And the Holy One of Israel hath prepared it.";
dby[20] = "that they may see, and know, and consider, and understand together, that the hand of Jehovah hath done this, and the Holy One of Israel hath created it.";
web[20] = "That they may see, and know, and consider, and understand together, that the hand of the LORD hath done this, and the Holy One of Israel hath created it.";
hnv[20] = " that they may see, and know, and consider, and understand together, that the hand of the LORD has done this, and the Holy One of Yisra\'el has created it.";
vul[20] = "ut videant et sciant et recogitent et intellegant pariter quia manus Domini fecit hoc et Sanctus Israhel creavit illud";
kjv[21] = "Produce your cause, saith the LORD; bring forth your strong [reasons], saith the King of Jacob.";
rsv[21] = "Set forth your case, says the LORD; bring your proofs, says the King of Jacob.";
asv[21] = "Produce your cause, saith Jehovah; bring forth your strong reasons, saith the King of Jacob.";
yng[21] = "Bring near your cause, saith Jehovah, Bring nigh your mighty ones, saith the king of Jacob.";
dby[21] = "Produce your cause, saith Jehovah; bring forward your arguments, saith the King of Jacob.";
web[21] = "Produce your cause, saith the LORD; bring forth your strong [reasons], saith the King of Jacob.";
hnv[21] = "Produce your cause, says the LORD; bring forth your strong reasons, says the King of Ya`akov.";
vul[21] = "prope facite iudicium vestrum dicit Dominus adferte si quid forte habetis dixit Rex Iacob";
kjv[22] = "Let them bring [them] forth, and shew us what shall happen: let them shew the former things, what they [be], that we may consider them, and know the latter end of them; or declare us things for to come.";
rsv[22] = "Let them bring them, and tell us what is to happen. Tell us the former things, what they are, that we may consider them, that we may know their outcome; or declare to us the things to come.";
asv[22] = "Let them bring forth, and declare unto us what shall happen: declare ye the former things, what they are, that we may consider them, and know the latter end of them; or show us things to come.";
yng[22] = "They bring nigh, and declare to us that which doth happen, The first things -- what they [are] declare ye, And we set our heart, and know their latter end, Or the coming things cause us to hear.";
dby[22] = "Let them bring them forward, and declare to us what shall happen: shew the former things, what they are, that we may give attention to them, and know the end of them; -- or let us hear things to come:";
web[22] = "Let them bring [them] forth, and show us what shall happen: let them show the former things, what they [are] that we may consider them, and know the latter end of them; or declare to us things to come.";
hnv[22] = "Let them bring forth, and declare to us what shall happen: declare you the former things, what they are, that we may consider them, and know the latter end of them; or show us things to come.";
vul[22] = "accedant et nuntient nobis quaecumque ventura sunt priora quae fuerint nuntiate et ponemus cor nostrum et sciemus novissima eorum et quae ventura sunt indicate nobis";
kjv[23] = "Shew the things that are to come hereafter, that we may know that ye [are] gods: yea, do good, or do evil, that we may be dismayed, and behold [it] together.";
rsv[23] = "Tell us what is to come hereafter, that we may know that you are gods; do good, or do harm, that we may be dismayed and terrified.";
asv[23] = "Declare the things that are to come hereafter, that we may know that ye are gods: yea, do good, or do evil, that we may be dismayed, and behold it together.";
yng[23] = "Declare the things that are coming hereafter, And we know that ye [are] gods, Yea, ye may do good or do evil, And we look around and see [it] together.";
dby[23] = "declare the things that are to happen hereafter, that we may know that ye are gods; yea, do good, or do evil, that we may be astonished, and behold it together.";
web[23] = "Show the things that are to come hereafter, that we may know that ye [are] gods: yes, do good, or do evil, that we may be dismayed, and behold [it] together.";
hnv[23] = "Declare the things that are to come hereafter, that we may know that you are gods: yes, do good, or do evil, that we may be dismayed, and see it together.";
vul[23] = "adnuntiate quae ventura sunt in futurum et sciemus quia dii estis vos bene quoque aut male si potestis facite et loquamur et videamus simul";
kjv[24] = "Behold, ye [are] of nothing, and your work of nought: an abomination [is he that] chooseth you.";
rsv[24] = "Behold, you are nothing, and your work is nought; an abomination is he who chooses you.";
asv[24] = "Behold, ye are of nothing, and your work is of nought; an abomination is he that chooseth you.";
yng[24] = "Lo, ye [are] of nothing, and your work of nought, An abomination -- it fixeth on you.";
dby[24] = "Behold, ye are less than nothing, and your work is of nought; an abomination is he that chooseth you. ...";
web[24] = "Behold, ye [are] of nothing, and your work of naught: an abomination [is he that] chooseth you.";
hnv[24] = " Behold, you are of nothing, and your work is of nothing; an abomination is he who chooses you.";
vul[24] = "ecce vos estis ex nihilo et opus vestrum ex eo quod non est abominatio est qui elegit vos";
kjv[25] = "I have raised up [one] from the north, and he shall come: from the rising of the sun shall he call upon my name: and he shall come upon princes as [upon] morter, and as the potter treadeth clay.";
rsv[25] = "I stirred up one from the north, and he has come, from the rising of the sun, and he shall call on my name; he shall trample on rulers as on mortar, as the potter treads clay.";
asv[25] = "I have raised up one from the north, and he is come; from the rising of the sun one that calleth upon my name: and he shall come upon rulers as upon mortar, and as the potter treadeth clay.";
yng[25] = "I have stirred up [one] from the north, And he cometh, From the rising of the sun he calleth in My name, And he cometh in [on] prefects as [on] clay, And as a potter treadeth down mire.";
dby[25] = "I have raised up one from the north, and he shall come, -- from the rising of the sun, he who will call upon my name; and he shall come upon princes as on mortar, and as the potter treadeth clay.";
web[25] = "I have raised up [one] from the north, and he shall come: from the rising of the sun shall he call upon my name: and he shall come upon princes as [upon] mortar, and as the potter treadeth clay.";
hnv[25] = "I have raised up one from the north, and he has come; from the rising of the sun one who calls on my name: and he shall come on rulers as on mortar, and as the potter treads clay.";
vul[25] = "suscitavi ab aquilone et venit ab ortu solis vocabit nomen meum et adducet magistratus quasi lutum et velut plastes conculcans humum";
kjv[26] = "Who hath declared from the beginning, that we may know? and beforetime, that we may say, [He is] righteous? yea, [there is] none that sheweth, yea, [there is] none that declareth, yea, [there is] none that heareth your words.";
rsv[26] = "Who declared it from the beginning, that we might know, and beforetime, that we might say, &quot;He is right&quot;? There was none who declared it, none who proclaimed, none who heard your words.";
asv[26] = "Who hath declared it from the beginning, that we may know? and beforetime, that we may say, [He is] right? yea, there is none that declareth, yea, there is none that showeth, yea, there is none that heareth your words.";
yng[26] = "Who hath declared from the first, and we know? And beforetime, and we say, `Righteous?\' yea, there is none declaring, Yea, there is none proclaiming, Yea, there is none hearing your sayings.";
dby[26] = "Who hath declared [it] from the beginning, that we may know? and beforetime, that we may say, [It is] right? Indeed, there is none that declareth; no, none that sheweth; no, none that heareth your words.";
web[26] = "Who hath declared from the beginning, that we may know? and before time, that we may say, [He is] righteous? verily, [there is] none that showeth, verily, [there is] none that declareth, verily, [there is] none that heareth your words.";
hnv[26] = "Who has declared it from the beginning, that we may know? and before, that we may say, [He is] right? yes, there is none who declares, yes, there is none who shows, yes, there is none who hears your words.";
vul[26] = "quis adnuntiavit ab exordio ut sciamus et a principio ut dicamus iustus es non est neque adnuntians neque praedicens neque audiens sermones vestros";
kjv[27] = "The first [shall say] to Zion, Behold, behold them: and I will give to Jerusalem one that bringeth good tidings.";
rsv[27] = "I first have declared it to Zion, and I give to Jerusalem a herald of good tidings.";
asv[27] = "[I am the] first [that saith] unto Zion, Behold, behold them; and I will give to Jerusalem one that bringeth good tidings.";
yng[27] = "First to Zion, Behold, behold them, And to Jerusalem one proclaiming tidings I give,";
dby[27] = "The first, [I said] to Zion, Behold, behold them! and to Jerusalem, I will give one that bringeth glad tidings.";
web[27] = "The first [shall say] to Zion, Behold, behold them: and I will give to Jerusalem one that bringeth good tidings.";
hnv[27] = "[I am the] first [who says] to Tziyon, Behold, behold them; and I will give to Yerushalayim one who brings good news.";
vul[27] = "primus ad Sion dicet ecce adsunt et Hierusalem evangelistam dabo";
kjv[28] = "For I beheld, and [there was] no man; even among them, and [there was] no counsellor, that, when I asked of them, could answer a word.";
rsv[28] = "But when I look there is no one; among these there is no counselor who, when I ask, gives an answer.";
asv[28] = "And when I look, there is no man: even among them there is no counsellor, that, when I ask of them, can answer a word.";
yng[28] = "And I see that there is no man, Yea, of these that there is no counsellor, And I ask them, and they return word:";
dby[28] = "And I beheld, and there was no man; even among them, -- and there was no counsellor, that, when I asked of them, could answer a word.";
web[28] = "For I beheld, and [there was] no man; even among them, and [there was] no counselor, that, when I asked of them, could answer a word.";
hnv[28] = "When I look, there is no man: even among them there is no counselor who, when I ask of them, can answer a word.";
vul[28] = "et vidi et non erat neque ex istis quisquam qui iniret consilium et interrogatus responderet verbum";
kjv[29] = "Behold, they [are] all vanity; their works [are] nothing: their molten images [are] wind and confusion.";
rsv[29] = "Behold, they are all a delusion; their works are nothing; their molten images are empty wind.";
asv[29] = "Behold, all of them, their works are vanity [and] nought; their molten images are wind and confusion.";
yng[29] = "`Lo, all of them [are] vanity, Nought [are] their works, Wind and emptiness their molten images!\'";
dby[29] = "Behold, they are all vanity, their works are nought, their molten images are wind and emptiness.";
web[29] = "Behold, they [are] all vanity, their works [are] nothing: their molten images [are] wind and confusion.";
hnv[29] = "Behold, all of them, their works are vanity [and] nothing; their molten images are wind and confusion.";
vul[29] = "ecce omnes iniusti et vana opera eorum ventus et inane simulacra eorum";
