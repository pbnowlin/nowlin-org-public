csb[1] = "Woe to the rebellious children! This is the LORD\'s declaration. They carry out a plan, but not mine; they make an alliance, but against my will, piling sin on top of sin.";
csb[2] = "Without asking my advice they set out to go down to Egypt in order to seek shelter under Pharaoh\'s protection and take refuge in Egypt\'s shadow.";
csb[3] = "But Pharaoh\'s protection will become your shame, and refuge in Egypt\'s shadow your humiliation.";
csb[4] = "For though his princes are at Zoan and his messengers reach as far as Hanes,";
csb[5] = "everyone will be ashamed because of a people who can\'t help. They are of no benefit, they are no help; they are good for nothing but shame and disgrace.";
csb[6] = "A pronouncement concerning the animals of the Negev: Through a land of trouble and distress, of lioness and lion, of viper and flying serpent, they carry their wealth on the backs of donkeys and their treasures on the humps of camels, to a people who will not help them.";
csb[7] = "Egypt\'s help is completely worthless; therefore, I call her: Rahab Who Just Sits.";
csb[8] = "Go now, write it on a tablet in their presence and inscribe it on a scroll; it will be for the future, forever and ever.";
csb[9] = "They are a rebellious people, deceptive children, children who do not want to listen to the LORD\'s instruction.";
csb[10] = "They say to the seers, &quot;Do not see,&quot; and to the prophets, &quot;Do not prophesy the truth to us. Tell us flattering things. Prophesy illusions.";
csb[11] = "&quot;Get out of the way! Leave the pathway. Rid us of the Holy One of Israel.&quot;";
csb[12] = "Therefore the Holy One of Israel says: &quot;Because you have rejected this message and have trusted in oppression and deceit, and have depended on them,";
csb[13] = "&quot;this iniquity of yours will be like a crumbling gap, a bulge in a high wall whose collapse will come in an instant -- suddenly!";
csb[14] = "&quot;Its collapse will be like the shattering of a potter\'s jar, crushed to pieces, so that not even a fragment of pottery will be found among its shattered remains -- no fragment large enough to take fire from a hearth or scoop water from a cistern.&quot;";
csb[15] = "For the Lord GOD, the Holy One of Israel, has said: &quot;You will be delivered by returning and resting; your strength will lie in quiet confidence. But you are not willing.&quot;";
csb[16] = "You say, &quot;No! We will escape on horses&quot; -- therefore you will escape! -- and, &quot;We will ride on fast horses&quot; -- but those who pursue you will be faster.";
csb[17] = "One thousand will flee at the threat of one, at the threat of five you will flee, until you remain like a solitary pole on a mountaintop or a banner on a hill.";
csb[18] = "Therefore the LORD is waiting to show you mercy, and is rising up to show you compassion, for the LORD is a just God. All who wait patiently for him are happy.";
csb[19] = "For people will live on Zion in Jerusalem. You will never weep again; he will show favor to you at the sound of your outcry; as soon as he hears, he will answer you.";
csb[20] = "The Lord will give you meager bread and water during oppression, but your Teacher will not hide any longer. Your eyes will see your Teacher,";
csb[21] = "and whenever you turn to the right or to the left, your ears will hear this command behind you: &quot;This is the way. Walk in it.&quot;";
csb[22] = "Then you will defile your silver-plated idols and your gold-plated images. You will throw them away like menstrual cloths, and call them filth.";
csb[23] = "Then he will send rain for your seed that you have sown in the ground, and the food, the produce of the ground, will be rich and plentiful. On that day your cattle will graze in open pastures.";
csb[24] = "The oxen and donkeys that work the ground will eat salted fodder scattered with winnowing shovel and fork.";
csb[25] = "Streams flowing with water will be on every high mountain and every raised hill on the day of great slaughter when the towers fall.";
csb[26] = "The moonlight will be as bright as the sunlight, and the sunlight will be seven times brighter -- like the light of seven days -- on the day that the LORD bandages his people\'s injuries and heals the wounds he inflicted.";
csb[27] = "Look there! The LORD  is coming from far away, his anger burning and heavy with smoke. His lips are full of fury, and his tongue is like a consuming fire.";
csb[28] = "His breath is like an overflowing torrent that rises to the neck. He comes to sift the nations in a sieve of destruction and to put a bridle on the jaws of the peoples to lead them astray.";
csb[29] = "Your singing will be like that on the night of a holy festival, and your heart will rejoice like one who walks to the music of a flute, going up to the mountain of the LORD, to the Rock of Israel.";
csb[30] = "And the LORD will make the splendor of his voice heard and reveal his arm striking in angry wrath and a flame of consuming fire, in driving rain, a torrent, and hailstones.";
csb[31] = "Assyria will be shattered by the voice of the LORD. He will strike with a rod.";
csb[32] = "And every stroke of the appointed staff that the LORD brings down on him will be to the sound of tambourines and lyres; he will fight against him with brandished weapons.";
csb[33] = "Indeed! Topheth has been ready for the king for a long time. Its funeral pyre is deep and wide, with plenty of fire and wood. The breath of the LORD, like a torrent of burning sulfur, kindles it.";
