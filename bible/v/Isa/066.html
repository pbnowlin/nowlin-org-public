csb[1] = "This is what the LORD says: Heaven is my throne, and earth is my footstool. Where could you possibly build a house for me? And where would my resting place be?";
csb[2] = "My hand made all these things, and so they all came into being. This is the LORD\'s declaration. I will look favorably on this kind of person: one who is humble, submissive in spirit, and trembles at my word.";
csb[3] = "One person slaughters an ox, another kills a person; one person sacrifices a lamb, another breaks a dog\'s neck; one person offers a grain offering, another offers pig\'s blood; one person offers incense, another praises an idol -- all these have chosen their ways and delight in their abhorrent practices.";
csb[4] = "So I will choose their punishment, and I will bring on them what they dread because I called and no one answered; I spoke and they did not listen; they did what was evil in my sight and chose what I did not delight in.";
csb[5] = "You who tremble at his word, hear the word of the LORD: &quot;Your brothers who hate and exclude you for my name\'s sake have said, \'Let the LORD be glorified so that we can see your joy! \' But they will be put to shame.&quot;";
csb[6] = "A sound of uproar from the city! A voice from the temple -- the voice of the LORD, paying back his enemies what they deserve!";
csb[7] = "Before Zion was in labor, she gave birth; before she was in pain, she delivered a boy.";
csb[8] = "Who has heard of such a thing? Who has seen such things? Can a land be born in one day or a nation be delivered in an instant? Yet as soon as Zion was in labor, she gave birth to her sons.";
csb[9] = "&quot;Will I bring a baby to the point of birth and not deliver it? &quot; says the LORD; &quot;or will I who deliver, close the womb? &quot; says your God.";
csb[10] = "Be glad for Jerusalem and rejoice over her, all who love her. Rejoice greatly with her, all who mourn over her --";
csb[11] = "so that you may nurse and be satisfied from her comforting breast and drink deeply and delight yourselves from her glorious breasts.";
csb[12] = "For this is what the LORD says: I will make peace flow to her like a river, and the wealth of nations like a flood; you will nurse and be carried on her hip and bounced on her lap.";
csb[13] = "As a mother comforts her son, so I will comfort you, and you will be comforted in Jerusalem.";
csb[14] = "You will see, you will rejoice, and you will flourish like grass; then the LORD\'s power will be revealed to his servants, but he will show his wrath against his enemies.";
csb[15] = "Look, the LORD will come with fire -- his chariots are like the whirlwind -- to execute his anger with fury and his rebuke with flames of fire.";
csb[16] = "For the LORD will execute judgment on all people with his fiery sword, and many will be slain by the LORD.";
csb[17] = "&quot;Those who dedicate and purify themselves to enter the groves following their leader, eating meat from pigs, vermin, and rats, will perish together.&quot; This is the LORD\'s declaration.";
csb[18] = "&quot;Knowing their works and their thoughts, I have come to gather all nations and languages; they will come and see my glory.";
csb[19] = "&quot;I will establish a sign among them, and I will send survivors from them to the nations -- to Tarshish, Put, Lud (who are archers), Tubal, Javan, and the coasts and islands far away -- who have not heard about me or seen my glory. And they will proclaim my glory among the nations.";
csb[20] = "&quot;They will bring all your brothers from all the nations as a gift to the LORD on horses and chariots, in litters, and on mules and camels, to my holy mountain Jerusalem,&quot; says the LORD, &quot;just as the Israelites bring an offering in a clean vessel to the house of the LORD.";
csb[21] = "&quot;I will also take some of them as priests and Levites,&quot; says the LORD.";
csb[22] = "&quot;For just as the new heavens and the new earth, which I will make, will remain before me&quot; -- this is the LORD\'s declaration -- &quot;so your offspring and your name will remain.";
csb[23] = "&quot;All mankind will come to worship me from one New Moon to another and from one Sabbath to another,&quot; says the LORD.";
csb[24] = "&quot;As they leave, they will see the dead bodies of those who have rebelled against me; for their worm will never die, their fire will never go out, and they will be a horror to all mankind.&quot;";
kjv[1] = "Thus saith the LORD, The heaven [is] my throne, and the earth [is] my footstool: where [is] the house that ye build unto me? and where [is] the place of my rest?";
rsv[1] = "Thus says the LORD: &quot;Heaven is my throne and the earth is my footstool; what is the house which you would build for me, and what is the place of my rest?";
asv[1] = "Thus saith Jehovah, Heaven is my throne, and the earth is my footstool: what manner of house will ye build unto me? and what place shall be my rest?";
yng[1] = "Thus said Jehovah: The heavens [are] My throne, And the earth My footstool, Where [is] this -- the house that ye build for Me? And where [is] this -- the place -- My rest?";
dby[1] = "Thus saith Jehovah: The heavens are my throne, and the earth is my footstool: what is the house that ye will build unto me? and what is the place of my rest?";

vul[1] = "haec dicit Dominus caelum sedis mea et terra scabillum pedum meorum quae ista domus quam aedificabitis mihi et quis iste locus quietis meae";
kjv[2] = "For all those [things] hath mine hand made, and all those [things] have been, saith the LORD: but to this [man] will I look, [even] to [him that is] poor and of a contrite spirit, and trembleth at my word.";
rsv[2] = "All these things my hand has made, and so all these things are mine, says the LORD. But this is the man to whom I will look, he that is humble and contrite in spirit, and trembles at my word.";
asv[2] = "For all these things hath my hand made, and [so] all these things came to be, saith Jehovah: but to this man will I look, even to him that is poor and of a contrite spirit, and that trembleth at my word.";
yng[2] = "And all these My hand hath made, And all these things are, An affirmation of Jehovah! And unto this one I look attentively, Unto the humble and bruised in spirit, And who is trembling at My word.";
dby[2] = "Even all these things hath my hand made, and all these things have been, saith Jehovah. But to this man will I look: to the afflicted and contrite in spirit, and who trembleth at my word.";
web[2] = "For all these [things] hath my hand made, and all these [things] have been, saith the LORD: but to this man [will] I look, [even] to [him that is] poor and of a contrite spirit, and trembleth at my word.";
hnv[2] = "For all these things has my hand made, and [so] all these things came to be, says the LORD: but to this man will I look, even to him who is poor and of a contrite spirit, and who trembles at my word.";
vul[2] = "omnia haec manus mea fecit et facta sunt universa ista dicit Dominus ad quem autem respiciam nisi ad pauperculum et contritum spiritu et trementem sermones meos";
kjv[3] = "He that killeth an ox [is as if] he slew a man; he that sacrificeth a lamb, [as if] he cut off a dog\'s neck; he that offereth an oblation, [as if he offered] swine\'s blood; he that burneth incense, [as if] he blessed an idol. Yea, they have chosen their own ways, and their soul delighteth in their abominations.";
rsv[3] = "&quot;He who slaughters an ox is like him who kills a man; he who sacrifices a lamb, like him who breaks a dog\'s neck; he who presents a cereal offering, like him who offers swine\'s blood; he who makes a memorial offering of frankincense, like him who blesses an idol. These have chosen their own ways, and their soul delights in their abominations;";
asv[3] = "He that killeth an ox is as he that slayeth a man; he that sacrificeth a lamb, as he that breaketh a dog\'s neck; he that offereth an oblation, [as he that offereth] swine\'s blood; he that burneth frankincense, as he that blesseth an idol. Yea, they have chosen their own ways, and their soul delighteth in their abominations:";
yng[3] = "Whoso slaughtereth the ox smiteth a man, Whoso sacrificeth the lamb beheadeth a dog, Whoso is bringing up a present -- The blood of a sow, Whoso is making mention of frankincense, Is blessing iniquity. Yea, they have fixed on their own ways, And in their abominations their soul hath delighted.";
dby[3] = "He that slaughtereth an ox, smiteth a man; he that sacrificeth a lamb, breaketh a dog\'s neck; he that offereth an oblation, [it is as] swine\'s blood; he that presenteth a memorial of incense, [is as] he that blesseth an idol. As they have chosen their own ways, and their soul delighteth in their abominations,";
web[3] = "He that killeth an ox [is as if] he slew a man; he that sacrificeth a lamb, [as if] he cut off a dog\'s neck; he that offereth an oblation, [as if he offered] swine\'s blood; he that burneth incense, [as if] he blessed an idol. Yes, they have chosen their own ways, and their soul delighteth in their abominations.";
hnv[3] = "He who kills an ox is as he who kills a man; he who sacrifices a lamb, as he who breaks a dog\'s neck; he who offers an offering, [as he who offers] pig\'s blood; he who burns frankincense, as he who blesses an idol. Yes, they have chosen their own ways, and their soul delights in their abominations:";
vul[3] = "qui immolat bovem quasi qui interficiat virum qui mactat pecus quasi qui excerebret canem qui offert oblationem quasi qui sanguinem suillum offerat qui recordatur turis quasi qui benedicat idolo haec omnia elegerunt in viis suis et in abominationibus suis anima eorum delectata est";
kjv[4] = "I also will choose their delusions, and will bring their fears upon them; because when I called, none did answer; when I spake, they did not hear: but they did evil before mine eyes, and chose [that] in which I delighted not.";
rsv[4] = "I also will choose affliction for them, and bring their fears upon them; because, when I called, no one answered, when I spoke they did not listen; but they did what was evil in my eyes, and chose that in which I did not delight.&quot;";
asv[4] = "I also will choose their delusions, and will bring their fears upon them; because when I called, none did answer; when I spake, they did not hear: but they did that which was evil in mine eyes, and chose that wherein I delighted not.";
yng[4] = "I also -- I fix on their vexations, And their fears I bring in to them, Because I have called, and there is none answering, I spake, and they have not hearkened, And they do the evil things in Mine eyes, And on that which I desired not -- fixed.";
dby[4] = "I also will choose their calamities, and will bring their fears upon them; because I called, and none answered, I spoke, and they did not hear, but did that which was evil in mine eyes, and chose that wherein I delight not.";
web[4] = "I also will choose their delusions, and will bring their fears upon them; because when I called, none did answer; when I spoke, they did not hear: but they did evil before my eyes, and chose [that] in which I delighted not.";
hnv[4] = "I also will choose their delusions, and will bring their fears on them; because when I called, none did answer; when I spoke, they did not hear: but they did that which was evil in my eyes, and chose that in which I didn\'t delight.";

kjv[5] = "Hear the word of the LORD, ye that tremble at his word; Your brethren that hated you, that cast you out for my name\'s sake, said, Let the LORD be glorified: but he shall appear to your joy, and they shall be ashamed.";
rsv[5] = "Hear the word of the LORD, you who tremble at his word: &quot;Your brethren who hate you and cast you out for my name\'s sake have said, \'Let the LORD be glorified, that we may see your joy\'; but it is they who shall be put to shame.";
asv[5] = "Hear the word of Jehovah, ye that tremble at his word: Your brethren that hate you, that cast you out for my name\'s sake, have said, Let Jehovah be glorified, that we may see your joy; but it is they that shall be put to shame.";
yng[5] = "Hear a word of Jehovah, Ye who are trembling unto His word, Said have your brethren who are hating you, Who are driving you out, for My name\'s sake: `Honoured is Jehovah, and we look on your joy,\' But they are ashamed.";
dby[5] = "Hear the word of Jehovah, ye that tremble at his word: Your brethren that hated you, that cast you out for my name\'s sake, said, Let Jehovah be glorified, and let us see your joy! but they shall be ashamed.";
web[5] = "Hear the word of the LORD, ye that tremble at his word; Your brethren that hated you, that cast you out for my name\'s sake, said, Let the LORD be glorified: but he shall appear to your joy, and they shall be ashamed.";

yng[12] = "For thus said Jehovah: `Lo, I am stretching out to her peace as a river, And as an overflowing stream the honour of nations, And ye have sucked, on the side ye are carried, And on the knees ye are dandled.";

web[16] = "For by fire and by his sword will the LORD plead with all flesh: and the slain of the LORD shall be many.";
hnv[16] = " For by fire will the LORD execute judgment, and by his sword, on all flesh; and the slain of the LORD shall be many.";
vul[16] = "quia in igne Dominus diiudicatur et in gladio suo ad omnem carnem et multiplicabuntur interfecti a Domino";
kjv[17] = "They that sanctify themselves, and purify themselves in the gardens behind one [tree] in the midst, eating swine\'s flesh, and the abomination, and the mouse, shall be consumed together, saith the LORD.";
rsv[17] = "&quot;Those who sanctify and purify themselves to go into the gardens, following one in the midst, eating swine\'s flesh and the abomination and mice, shall come to an end together, says the LORD.";
asv[17] = "They that sanctify themselves and purify themselves [to go] unto the gardens, behind one in the midst, eating swine\'s flesh, and the abomination, and the mouse, they shall come to an end together, saith Jehovah.";
yng[17] = "Those sanctifying and cleansing themselves at the gardens, After Ahad in the midst, Eating flesh of the sow, And of the abomination, and of the mouse, Together are consumed, An affirmation of Jehovah.";
dby[17] = "They that sanctify themselves, and purify themselves in the gardens behind one in the midst; that eat swine\'s flesh, and the abomination, and the mouse, shall perish together, saith Jehovah.";
web[17] = "They that sanctify themselves, and purify themselves in the gardens behind one [tree] in the midst, eating swine\'s flesh, and the abomination, and the mouse, shall be consumed together, saith the LORD.";
hnv[17] = "Those who sanctify themselves and purify themselves [to go] to the gardens, behind one in the midst, eating pig\'s flesh, and the abomination, and the akbar, they shall come to an end together, says the LORD.";
vul[17] = "qui sanctificabantur et mundos se putabant in hortis post unam intrinsecus qui comedebant carnem suillam et abominationem et murem simul consumentur dicit Dominus";
kjv[18] = "For I [know] their works and their thoughts: it shall come, that I will gather all nations and tongues; and they shall come, and see my glory.";
rsv[18] = "&quot;For I know their works and their thoughts, and I am coming to gather all nations and tongues; and they shall come and shall see my glory,";
asv[18] = "For I [know] their works and their thoughts: [the time] cometh, that I will gather all nations and tongues; and they shall come, and shall see my glory.";
yng[18] = "And I -- their works and their thoughts, I come to gather all the nations and tongues, And they have come and seen My honour.";
dby[18] = "And I, -- their works and their thoughts [are before me]. ... [The time] cometh for the gathering of all nations and tongues; and they shall come, and see my glory.";
web[18] = "For I [know] their works and their thoughts: it shall come, that I will gather all nations and tongues; and they shall come, and see my glory.";
hnv[18] = " For I [know] their works and their thoughts: [the time] comes, that I will gather all nations and languages; and they shall come, and shall see my glory.";
vul[18] = "ego autem opera eorum et cogitationes eorum venio ut congregem cum omnibus gentibus et linguis et venient et videbunt gloriam meam";
kjv[19] = "And I will set a sign among them, and I will send those that escape of them unto the nations, [to] Tarshish, Pul, and Lud, that draw the bow, [to] Tubal, and Javan, [to] the isles afar off, that have not heard my fame, neither have seen my glory; and they shall declare my glory among the Gentiles.";
rsv[19] = "and I will set a sign among them. And from them I will send survivors to the nations, to Tarshish, Put, and Lud, who draw the bow, to Tubal and Javan, to the coastlands afar off, that have not heard my fame or seen my glory; and they shall declare my glory among the nations.";
asv[19] = "And I will set a sign among them, and I will send such as escape of them unto the nations, to Tarshish, Pul, and Lud, that draw the bow, to Tubal and Javan, to the isles afar off, that have not heard my fame, neither have seen my glory; and they shall declare my glory among the nations.";
yng[19] = "And I have set among them a sign, And have sent out of them those escaping unto the nations, (Tarshish, Pul, and Lud, drawing bow, Tubal and Javan, the isles that are far off,) Who have not heard My fame, nor seen Mine honour, And they have declared Mine honour among nations.";
dby[19] = "And I will set a sign among them, and I will send those that escape of them unto the nations, to Tarshish, Pul, and Lud, that draw the bow; to Tubal and Javan, to the isles afar off, that have not heard my fame, neither have seen my glory: and they shall declare my glory among the nations.";
web[19] = "And I will set a sign among them, and I will send those that escape of them to the nations, [to] Tarshish, Pul, and Lud, that draw the bow, [to] Tubal, and Javan, [to] the isles afar off, that have not heard my fame, neither have seen my glory; and they shall declare my glory among the Gentiles.";
hnv[19] = "I will set a sign among them, and I will send such as escape of them to the nations, to Tarshish, Pul, and Lud, who draw the bow, to Tuval and Yavan, to the isles afar off, who have not heard my fame, neither have seen my glory; and they shall declare my glory among the nations.";
vul[19] = "et ponam in eis signum et mittam ex eis qui salvati fuerint ad gentes in mari in Africa in Lydia tenentes sagittam in Italiam et Graeciam ad insulas longe ad eos qui non audierunt de me et non viderunt gloriam meam et adnuntiabunt gloriam meam gentibus";
kjv[20] = "And they shall bring all your brethren [for] an offering unto the LORD out of all nations upon horses, and in chariots, and in litters, and upon mules, and upon swift beasts, to my holy mountain Jerusalem, saith the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD.";
rsv[20] = "And they shall bring all your brethren from all the nations as an offering to the LORD, upon horses, and in chariots, and in litters, and upon mules, and upon dromedaries, to my holy mountain Jerusalem, says the LORD, just as the Israelites bring their cereal offering in a clean vessel to the house of the LORD.";
asv[20] = "And they shall bring all your brethren out of all the nations for an oblation unto Jehovah, upon horses, and in chariots, and in litters, and upon mules, and upon dromedaries, to my holy mountain Jerusalem, saith Jehovah, as the children of Israel bring their oblation in a clean vessel into the house of Jehovah.";
yng[20] = "And they have brought all your brethren out of all the nations, A present to Jehovah, On horses, and on chariot, and on litters, And on mules, and on dromedaries, Unto My holy mountain Jerusalem, said Jehovah, As the sons of Israel bring the present in a clean vessel, Into the house of Jehovah.";
dby[20] = "And they shall bring all your brethren out of all the nations as an oblation unto Jehovah, upon horses, and in chariots, and in covered waggons, and upon mules, and upon dromedaries, to my holy mountain, to Jerusalem, saith Jehovah, as the children of Israel bring an oblation in a clean vessel into the house of Jehovah.";
web[20] = "And they shall bring all your brethren [for] an offering to the LORD out of all nations upon horses, and in chariots, and in litters, and upon mules, and upon swift beasts, to my holy mountain Jerusalem, saith the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD.";
hnv[20] = "They shall bring all your brothers out of all the nations for an offering to the LORD, on horses, and in chariots, and in litters, and on mules, and on dromedaries, to my holy mountain Yerushalayim, says the LORD, as the children of Yisra\'el bring their offering in a clean vessel into the house of the LORD.";
vul[20] = "et adducent omnes fratres vestros de cunctis gentibus donum Domino in equis et in quadrigis et in lecticis et in mulis et in carrucis ad montem sanctum meum Hierusalem dicit Dominus quomodo si inferant filii Israhel munus in vase mundo in domum Domini";
kjv[21] = "And I will also take of them for priests [and] for Levites, saith the LORD.";
rsv[21] = "And some of them also I will take for priests and for Levites, says the LORD.";
asv[21] = "And of them also will I take for priests [and] for Levites, saith Jehovah.";
yng[21] = "And also of them I take for priests, For Levites, said Jehovah.";
dby[21] = "And I will also take of them for priests [and] for Levites, saith Jehovah.";
web[21] = "And I will also take of them for priests [and] for Levites, saith the LORD.";
hnv[21] = "Of them also will I take for Kohanim [and] for Levites, says the LORD.";
vul[21] = "et adsumam ex eis in sacerdotes et in Levitas dicit Dominus";
kjv[22] = "For as the new heavens and the new earth, which I will make, shall remain before me, saith the LORD, so shall your seed and your name remain.";
rsv[22] = "&quot;For as the new heavens and the new earth which I will make shall remain before me, says the LORD; so shall your descendants and your name remain.";
asv[22] = "For as the new heavens and the new earth, which I will make, shall remain before me, saith Jehovah, so shall your seed and your name remain.";
yng[22] = "For, as the new heavens and the new earth that I am making, Are standing before Me, An affirmation of Jehovah! So remain doth your seed and your name.";
dby[22] = "For as the new heavens and the new earth which I will make shall remain before me, saith Jehovah, so shall your seed and your name remain.";
web[22] = "For as the new heavens and the new earth, which I will make, shall remain before me, saith the LORD, so shall your seed and your name remain.";
hnv[22] = "For as the new heavens and the new eretz, which I will make, shall remain before me, says the LORD, so shall your seed and your name remain.";
vul[22] = "quia sicut caeli novi et terra nova quae ego facio stare coram me dicit Dominus sic stabit semen vestrum et nomen vestrum";
kjv[23] = "And it shall come to pass, [that] from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith the LORD.";
rsv[23] = "From new moon to new moon, and from sabbath to sabbath, all flesh shall come to worship before me, says the LORD.";
asv[23] = "And it shall come to pass, that from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith Jehovah.";
yng[23] = "And it hath been from month to month, And from sabbath to sabbath, Come do all flesh to bow themselves before Me, Said Jehovah.";
dby[23] = "And it shall come to pass from new moon to new moon, and from sabbath to sabbath, all flesh shall come to worship before me, saith Jehovah.";
web[23] = "And it shall come to pass, [that] from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith the LORD.";
hnv[23] = "It shall happen, that from one new moon to another, and from one Shabbat to another, shall all flesh come to worship before me, says the LORD.";
vul[23] = "et erit mensis ex mense et sabbatum ex sabbato veniet omnis caro ut adoret coram facie mea dicit Dominus";
kjv[24] = "And they shall go forth, and look upon the carcases of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring unto all flesh.";
rsv[24] = "&quot;And they shall go forth and look on the dead bodies of the men that have rebelled against me; for their worm shall not die, their fire shall not be quenched, and they shall be an abhorrence to all flesh.&quot;";
asv[24] = "And they shall go forth, and look upon the dead bodies of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring unto all flesh.";
yng[24] = "And they have gone forth, And looked on the carcases of the men Who are transgressing against me, For their worm dieth not, And their fire is not quenched, And they have been an abhorrence to all flesh!";
dby[24] = "And they shall go forth, and look upon the carcases of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorrence unto all flesh.";
web[24] = "And they shall go forth, and look upon the carcasses of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring to all flesh.";
hnv[24] = "They shall go forth, and look on the dead bodies of the men who have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring to all flesh.";
vul[24] = "et egredientur et videbunt cadavera virorum qui praevaricati sunt in me vermis eorum non morietur et ignis eorum non extinguetur et erunt usque ad satietatem visionis omni carni";
