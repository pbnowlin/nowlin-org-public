csb[1] = "On that day the LORD with his relentless, large, strong sword will bring judgment on Leviathan, the fleeing serpent -- Leviathan, the twisting serpent. He will slay the monster that is in the sea.";
csb[2] = "On that day sing about a desirable vineyard:";
csb[3] = "I am the LORD, who watches over it to water it regularly. So that no one disturbs it, I watch over it night and day.";
csb[4] = "I am not angry. If only there were thorns and briers for me to battle, I would trample them and burn them to the ground.";
csb[5] = "Or let it take hold of my strength; let it make peace with me -- make peace with me.";
csb[6] = "In days to come, Jacob will take root. Israel will blossom and bloom and fill the whole world with fruit.";
csb[7] = "Did the LORD strike Israel as he struck the one who struck Israel? Was Israel killed like those killed by the LORD ?";
csb[8] = "You disputed with Israel by banishing and driving her away. He removed her with his severe storm on the day of the east wind.";
csb[9] = "Therefore Jacob\'s iniquity will be atoned for in this way, and the result of the removal of his sin will be this: when he makes all the altar stones like crushed bits of chalk, no Asherah poles or incense altars will remain standing.";
csb[10] = "For the fortified city will be desolate, pastures deserted and abandoned like a wilderness. Calves will graze there, and there they will spread out and strip its branches.";
csb[11] = "When its branches dry out, they will be broken off. Women will come and make fires with them, for they are not a people with understanding. Therefore their Maker will not have compassion on them, and their Creator will not be gracious to them.";
csb[12] = "On that day the LORD will thresh grain from the Euphrates River as far as the Wadi of Egypt, and you Israelites will be gathered one by one.";
csb[13] = "On that day a great trumpet will be blown, and those lost in the land of Assyria will come, as well as those dispersed in the land of Egypt; and they will worship the LORD at Jerusalem on the holy mountain.";
kjv[1] = "In that day the LORD with his sore and great and strong sword shall punish leviathan the piercing serpent, even leviathan that crooked serpent; and he shall slay the dragon that [is] in the sea.";
rsv[1] = "In that day the LORD with his hard and great and strong sword will punish Leviathan the fleeing serpent, Leviathan the twisting serpent, and he will slay the dragon that is in the sea.";
asv[1] = "In that day Jehovah with his hard and great and strong sword will punish leviathan the swift serpent, and leviathan the crooked serpent; and he will slay the monster that is in the sea.";
yng[1] = "In that day lay a charge doth Jehovah, With his sword -- the sharp, and the great, and the strong, On leviathan -- a fleeing serpent, And on leviathan -- a crooked serpent, And He hath slain the dragon that [is] in the sea.";
dby[1] = "In that day Jehovah, with his sore and great and strong sword, will visit leviathan the fleeing serpent, and leviathan the crooked serpent; and he will slay the monster that is in the sea.";
web[1] = "In that day the LORD with his keen and great and strong sword will punish leviathan the piercing serpent, even leviathan that crooked serpent; and he will slay the dragon that [is] in the sea.";
hnv[1] = "In that day the LORD with his hard and great and strong sword will punish livyatan the swift serpent, and livyatan the crooked serpent; and he will kill the monster that is in the sea.";
vul[1] = "in die illo visitabit Dominus in gladio suo duro et grandi et forti super Leviathan serpentem vectem et super Leviathan serpentem tortuosum et occidet cetum qui in mari est";
kjv[2] = "In that day sing ye unto her, A vineyard of red wine.";
rsv[2] = "In that day: &quot;A pleasant vineyard, sing of it!";
asv[2] = "In that day: A vineyard of wine, sing ye unto it.";
yng[2] = "In that day, `A desirable vineyard,\' respond ye to her,";
dby[2] = "In that day [there shall be] a vineyard of pure wine; sing concerning it:";
web[2] = "In that day sing ye to her, A vineyard of red wine.";
hnv[2] = "In that day: A vineyard of wine, sing you to it.";
vul[2] = "in die illa vinea meri cantabit ei";
kjv[3] = "I the LORD do keep it; I will water it every moment: lest [any] hurt it, I will keep it night and day.";
rsv[3] = "I, the LORD, am its keeper; every moment I water it. Lest any one harm it, I guard it night and day;";
asv[3] = "I Jehovah am its keeper; I will water it every moment: lest any hurt it, I will keep it night and day.";
yng[3] = "I, Jehovah, am its keeper, every moment I water it, Lest any lay a charge against it, Night and day I keep it!";
dby[3] = "I Jehovah keep it, I will water it every moment; lest any harm it, I will keep it night and day.";
web[3] = "I the LORD do keep it; I will water it every moment: lest [any] hurt it, I will keep it night and day.";
hnv[3] = "I the LORD am its keeper; I will water it every moment: lest any hurt it, I will keep it night and day.";
vul[3] = "ego Dominus qui servo eam repente propinabo ei ne forte visitetur contra eam nocte et die servo eam";
kjv[4] = "Fury [is] not in me: who would set the briers [and] thorns against me in battle? I would go through them, I would burn them together.";
rsv[4] = "I have no wrath. Would that I had thorns and briers to battle! I would set out against them, I would burn them up together.";
asv[4] = "Wrath is not in me: would that the briers and thorns were against me in battle! I would march upon them, I would burn them together.";
yng[4] = "Fury is not in Me; Who giveth Me a brier -- a thorn in battle? I step into it, I burn it at once.";
dby[4] = "Fury is not in me. Oh that I had briars [and] thorns in battle against me! I would march against them, I would burn them together.";
web[4] = "Fury [is] not in me: who would set the briers [and] thorns against me in battle? I would go through them, I would burn them together.";
hnv[4] = "Wrath is not in me: would that the briers and thorns were against me in battle! I would march on them, I would burn them together.";
vul[4] = "indignatio non est mihi quis dabit me spinam et veprem in proelio gradiar super eam succendam eam pariter";
kjv[5] = "Or let him take hold of my strength, [that] he may make peace with me; [and] he shall make peace with me.";
rsv[5] = "Or let them lay hold of my protection, let them make peace with me, let them make peace with me.&quot;";
asv[5] = "Or else let him take hold of my strength, that he may make peace with me; [yea], let him make peace with me.";
yng[5] = "Or -- he doth take hold on My strength, He doth make peace with Me, Peace he doth make with Me.";
dby[5] = "Or let him take hold of my strength; let him make peace with me: [yea,] let him make peace with me.";
web[5] = "Or let him take hold of my strength, [that] he may make peace with me, [and] he shall make peace with me.";
hnv[5] = "Or else let him take hold of my strength, that he may make shalom with me; [yes], let him make shalom with me.";
vul[5] = "an potius tenebit fortitudinem meam faciet pacem mihi pacem faciet mihi";
kjv[6] = "He shall cause them that come of Jacob to take root: Israel shall blossom and bud, and fill the face of the world with fruit.";
rsv[6] = "In days to come Jacob shall take root, Israel shall blossom and put forth shoots, and fill the whole world with fruit.";
asv[6] = "In days to come shall Jacob take root; Israel shall blossom and bud; and they shall fill the face of the world with fruit.";
yng[6] = "Those coming in He causeth to take root, Jacob doth blossom, and flourished hath Israel, And they have filled the face of the world [with] increase.";
dby[6] = "In the future Jacob shall take root; Israel shall blossom and bud, and they shall fill the face of the world with fruit.";
web[6] = "He shall cause them that descend from Jacob to take root: Israel shall blossom and bud, and fill the face of the world with fruit.";
hnv[6] = "In days to come shall Ya`akov take root; Yisra\'el shall blossom and bud; and they shall fill the surface of the world with fruit.";
vul[6] = "qui egrediuntur impetu ad Iacob florebit et germinabit Israhel et implebunt faciem orbis semine";
kjv[7] = "Hath he smitten him, as he smote those that smote him? [or] is he slain according to the slaughter of them that are slain by him?";
rsv[7] = "Has he smitten them as he smote those who smote them? Or have they been slain as their slayers were slain?";
asv[7] = "Hath he smitten them as he smote those that smote them? or are they slain according to the slaughter of them that were slain by them?";
yng[7] = "As the smiting of his smiter hath He smitten him? As the slaying of his slain doth He slay?";
dby[7] = "Hath he smitten him according to the smiting of those that smote him? Is he slain according to the slaughter of those slain by him?";
web[7] = "Hath he smitten him, as he smote those that smote him? [or] is he slain according to the slaughter of them that are slain by him?";
hnv[7] = "Has he struck them as he struck those who struck them? or are they slain according to the slaughter of those who were slain by them?";
vul[7] = "numquid iuxta plagam percutientis se percussit eum aut sicut occidit interfectos eius sic occisus est";
kjv[8] = "In measure, when it shooteth forth, thou wilt debate with it: he stayeth his rough wind in the day of the east wind.";
rsv[8] = "Measure by measure, by exile thou didst contend with them; he removed them with his fierce blast in the day of the east wind.";
asv[8] = "In measure, when thou sendest them away, thou dost contend with them; he hath removed [them] with his rough blast in the day of the east wind.";
yng[8] = "In measure, in sending it forth, thou strivest with it, He hath taken away by His sharp wind, In the day of an east wind,";
dby[8] = "In measure, when sending her away, didst thou contend with her: he hath taken [her] away with his rough wind in the day of the east wind.";
web[8] = "In measure, when it shooteth forth, thou wilt debate with it: he stayeth his rough wind in the day of the east wind.";
hnv[8] = "In measure, when you send them away, you do contend with them; he has removed [them] with his rough blast in the day of the east wind.";
vul[8] = "in mensura contra mensuram cum abiecta fuerit iudicabis eam meditata est in spiritu suo duro per diem aestus";
kjv[9] = "By this therefore shall the iniquity of Jacob be purged; and this [is] all the fruit to take away his sin; when he maketh all the stones of the altar as chalkstones that are beaten in sunder, the groves and images shall not stand up.";
rsv[9] = "Therefore by this the guilt of Jacob will be expiated, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altars like chalkstones crushed to pieces, no Ashe\'rim or incense altars will remain standing.";
asv[9] = "Therefore by this shall the iniquity of Jacob be forgiven, and this is all the fruit of taking away his sin: that he maketh all the stones of the altar as chalkstones that are beaten in sunder, [so that] the Asherim and the sun-images shall rise no more.";
yng[9] = "Therefore by this is the iniquity of Jacob covered, And this [is] all the fruit -- To take away his sin, in His setting all the stones of an altar, As chalkstones beaten in pieces, They rise not -- shrines and images.";
dby[9] = "By this, therefore, shall the iniquity of Jacob be purged; and this is all the fruit of the taking away of his sin: when he shall make all the stones of the altar as chalkstones that are crumbled in pieces, -- the Asherahs and the sun-images shall not stand.";
web[9] = "By this therefore shall the iniquity of Jacob be purged; and this [is] all the fruit to take away his sin; when he maketh all the stones of the altar as chalk-stones that are beaten asunder, the groves and images shall not stand up.";
hnv[9] = " Therefore by this shall the iniquity of Ya`akov be forgiven, and this is all the fruit of taking away his sin: that he makes all the stones of the altar as chalk stones that are beaten in sunder, [so that] the Asherim and the sun-images shall rise no more.";
vul[9] = "idcirco super hoc dimittetur iniquitas domui Iacob et iste omnis fructus ut auferatur peccatum eius cum posuerit omnes lapides altaris sicut lapides cineris adlisos non stabunt luci et delubra";
kjv[10] = "Yet the defenced city [shall be] desolate, [and] the habitation forsaken, and left like a wilderness: there shall the calf feed, and there shall he lie down, and consume the branches thereof.";
rsv[10] = "For the fortified city is solitary, a habitation deserted and forsaken, like the wilderness; there the calf grazes, there he lies down, and strips its branches.";
asv[10] = "For the fortified city is solitary, a habitation deserted and forsaken, like the wilderness: there shall the calf feed, and there shall he lie down, and consume the branches thereof.";
yng[10] = "For the fenced city [is] alone, A habitation cast out and forsaken as a wilderness, There doth the calf delight, And there it lieth down, And hath consumed its branches.";
dby[10] = "For the fortified city is solitary, a habitation abandoned and forsaken like a wilderness; there shall the calf feed, and there shall he lie down, and consume its boughs.";
web[10] = "Yet the fortified city [shall be] desolate, [and] the habitation forsaken, and left like a wilderness: there shall the calf feed, and there shall he lie down, and consume its branches.";
hnv[10] = "For the fortified city is solitary, a habitation deserted and forsaken, like the wilderness: there shall the calf feed, and there shall he lie down, and consume the branches of it.";
vul[10] = "civitas enim munita desolata erit speciosa relinquetur et dimittetur quasi desertum ibi pascetur vitulus et ibi accubabit et consumet summitates eius";
kjv[11] = "When the boughs thereof are withered, they shall be broken off: the women come, [and] set them on fire: for it [is] a people of no understanding: therefore he that made them will not have mercy on them, and he that formed them will shew them no favour.";
rsv[11] = "When its boughs are dry, they are broken; women come and make a fire of them. For this is a people without discernment; therefore he who made them will not have compassion on them, he that formed them will show them no favor.";
asv[11] = "When the boughs thereof are withered, they shall be broken off; the women shall come, and set them on fire; for it is a people of no understanding: therefore he that made them will not have compassion upon them, and he that formed them will show them no favor.";
yng[11] = "In the withering of its branch it is broken off, Women are coming in setting it on fire, For it [is] not a people of understanding, Therefore pity it not doth its Maker, And its Former doth not favour it.";
dby[11] = "When its branches are withered they shall be broken off; women shall come [and] set them on fire. For it is a people of no intelligence; therefore he that made them will not have mercy on them, and he who formed them will shew them no favour.";
web[11] = "When its boughs are withered, they shall be broken off: the women come [and] set them on fire: for it [is] a people of no understanding: therefore he that made them will not have mercy on them, and he that formed them will show them no favor.";
hnv[11] = "When the boughs of it are withered, they shall be broken off; the women shall come, and set them on fire; for it is a people of no understanding: therefore he who made them will not have compassion on them, and he who formed them will show them no favor.";
vul[11] = "in siccitate messis illius conterentur mulieres venientes et docentes eam non est enim populus sapiens propterea non miserebitur eius qui fecit eum et qui formavit eum non parcet ei";
kjv[12] = "And it shall come to pass in that day, [that] the LORD shall beat off from the channel of the river unto the stream of Egypt, and ye shall be gathered one by one, O ye children of Israel.";
rsv[12] = "In that day from the river Euphra\'tes to the Brook of Egypt the LORD will thresh out the grain, and you will be gathered one by one, O people of Israel.";
asv[12] = "And it shall come to pass in that day, that Jehovah will beat off [his fruit] from the flood of the River unto the brook of Egypt; and ye shall be gathered one by one, O ye children of Israel.";
yng[12] = "And it hath come to pass, in that day, Beat out doth Jehovah from the branch of the river, Unto the stream of Egypt, And ye are gathered one by one, O sons of Israel.";
dby[12] = "And it shall come to pass in that day, that Jehovah shall beat out from the flood of the river unto the torrent of Egypt, and ye shall be gathered one by one, [ye] children of Israel.";
web[12] = "And it shall come to pass in that day, [that] the LORD shall gather from the channel of the river to the stream of Egypt, and ye shall be gathered one by one, O ye children of Israel.";
hnv[12] = "It shall happen in that day, that the LORD will beat off [his fruit] from the flood of the River to the brook of Mitzrayim; and you shall be gathered one by one, you children of Yisra\'el.";
vul[12] = "et erit in die illa percutiet Dominus ab alveo Fluminis usque ad torrentem Aegypti et vos congregabimini unus et unus filii Israhel";
kjv[13] = "And it shall come to pass in that day, [that] the great trumpet shall be blown, and they shall come which were ready to perish in the land of Assyria, and the outcasts in the land of Egypt, and shall worship the LORD in the holy mount at Jerusalem.";
rsv[13] = "And in that day a great trumpet will be blown, and those who were lost in the land of Assyria and those who were driven out to the land of Egypt will come and worship the LORD on the holy mountain at Jerusalem.";
asv[13] = "And it shall come to pass in that day, that a great trumpet shall be blown; and they shall come that were ready to perish in the land of Assyria, and they that were outcasts in the land of Egypt; and they shall worship Jehovah in the holy mountain at Jerusalem.";
yng[13] = "And it hath come to pass, in that day, It is blown with a great trumpet, And come in have those perishing in the land of Asshur, And those cast out in the land of Egypt, And have bowed themselves to Jehovah, In the holy mount -- in Jerusalem!";
dby[13] = "And it shall come to pass in that day, [that] the great trumpet shall be blown; and they shall come that were perishing in the land of Assyria, and the outcasts in the land of Egypt, and they shall worship Jehovah in the holy mountain at Jerusalem.";
web[13] = "And it shall come to pass in that day, [that] the great trumpet shall be blown, and they shall come who were ready to perish in the land of Assyria, and the outcasts in the land of Egypt, and shall worship the LORD on the holy mount at Jerusalem.";
hnv[13] = "It shall happen in that day, that a great shofar shall be blown; and they shall come who were ready to perish in the land of Ashshur, and those who were outcasts in the land of Mitzrayim; and they shall worship the LORD in the holy mountain at Yerushalayim.";
vul[13] = "et erit in die illa clangetur in tuba magna et venient qui perditi fuerant de terra Assyriorum et qui eiecti erant in terra Aegypti et adorabunt Dominum in monte sancto in Hierusalem";
</script>
