csb[2] = "&quot;They seek me day after day and delight to know my ways, like a nation that does what is right and does not abandon the justice of their God. They ask me for righteous judgments; they delight in the nearness of God.&quot;";
csb[3] = "&quot;Why have we fasted, but you have not seen? We have denied ourselves, but you haven\'t noticed! &quot; &quot;Look, you do as you please on the day of your fast, and oppress all your workers.";
csb[4] = "&quot;You fast with contention and strife to strike viciously with your fist. You cannot fast as you do today, hoping to make your voice heard on high.";
csb[5] = "&quot;Will the fast I choose be like this: A day for a person to deny himself, to bow his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast and a day acceptable to the LORD?";
csb[6] = "&quot;Isn\'t this the fast I choose: To break the chains of wickedness, to untie the ropes of the yoke, to set the oppressed free, and to tear off every yoke?";
csb[7] = "&quot;Is it not to share your bread with the hungry, to bring the poor and homeless into your house, to clothe the naked when you see him, and not to ignore your own flesh and blood?";
csb[8] = "&quot;Then your light will appear like the dawn, and your recovery will come quickly. Your righteousness will go before you, and the LORD\'s glory will be your rear guard.";
csb[9] = "&quot;At that time, when you call, the LORD will answer; when you cry out, he will say, \'Here I am.\' If you get rid of the yoke among you, the finger-pointing and malicious speaking,";
csb[10] = "&quot;and if you offer yourself to the hungry, and satisfy the afflicted one, then your light will shine in the darkness, and your night will be like noonday.";
csb[11] = "&quot;The LORD will always lead you, satisfy you in a parched land, and strengthen your bones. You will be like a watered garden and like a spring whose water never runs dry.";
csb[12] = "&quot;Some of you will rebuild the ancient ruins; you will restore the foundations laid long ago; you will be called the repairer of broken walls, the restorer of streets where people live.";
csb[13] = "&quot;If you keep from desecrating the Sabbath, from doing whatever you want on my holy day; if you call the Sabbath a delight, and the holy day of the LORD honorable; if you honor it, not going your own ways, seeking your own pleasure, or talking business;";
csb[14] = "&quot;then you will delight in the LORD, and I will make you ride over the heights of the land, and let you enjoy the heritage of your father Jacob.&quot; For the mouth of the LORD has spoken.";
kjv[1] = "Cry aloud, spare not, lift up thy voice like a trumpet, and shew my people their transgression, and the house of Jacob their sins.";
rsv[1] = "&quot;Cry aloud, spare not, lift up your voice like a trumpet; declare to my people their transgression, to the house of Jacob their sins.";
asv[1] = "Cry aloud, spare not, lift up thy voice like a trumpet, and declare unto my people their transgression, and to the house of Jacob their sins.";
yng[1] = "Call with the throat, restrain not, As a trumpet lift up thy voice, And declare to My people their transgression, And to the house of Jacob their sins;";
dby[1] = "Cry aloud, spare not, lift up thy voice like a trumpet, and declare unto my people their transgression, and to the house of Jacob their sins.";
web[1] = "Cry aloud, spare not, lift up thy voice like a trumpet, and show my people their transgression, and the house of Jacob their sins.";
hnv[1] = "Cry aloud, don\'t spare, lift up your voice like a shofar, and declare to my people their disobedience, and to the house of Ya`akov their sins.";
vul[1] = "clama ne cesses quasi tuba exalta vocem tuam et adnuntia populo meo scelera eorum et domui Iacob peccata eorum";
kjv[2] = "Yet they seek me daily, and delight to know my ways, as a nation that did righteousness, and forsook not the ordinance of their God: they ask of me the ordinances of justice; they take delight in approaching to God.";
rsv[2] = "Yet they seek me daily, and delight to know my ways, as if they were a nation that did righteousness and did not forsake the ordinance of their God; they ask of me righteous judgments, they delight to draw near to God.";
asv[2] = "Yet they seek me daily, and delight to know my ways: as a nation that did righteousness, and forsook not the ordinance of their God, they ask of me righteous judgments; they delight to draw near unto God.";
yng[2] = "Seeing -- Me day by day they seek, And the knowledge of My ways they desire, As a nation that righteousness hath done, And the judgment of its God hath not forsaken, They ask of me judgments of righteousness, The drawing near of God they desire:";
dby[2] = "Yet they seek me daily, and delight to know my ways, as a nation that doeth righteousness, and hath not forsaken the ordinance of their God; they ask of me the ordinances of righteousness, they take delight in approaching to God:";
web[2] = "Yet they seek me daily, and delight to know my ways, as a nation that did righteousness, and forsook not the ordinance of their God: they ask of me the ordinances of justice; they take delight in approaching to God.";
hnv[2] = "Yet they seek me daily, and delight to know my ways: as a nation that did righteousness, and didn\'t forsake the ordinance of their God, they ask of me righteous judgments; they delight to draw near to God.";
vul[2] = "me etenim de die in diem quaerunt et scire vias meas volunt quasi gens quae iustitiam fecerit et quae iudicium Dei sui non reliquerit rogant me iudicia iustitiae adpropinquare Deo volunt";
kjv[3] = "Wherefore have we fasted, [say they], and thou seest not? [wherefore] have we afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find pleasure, and exact all your labours.";
rsv[3] = "\'Why have we fasted, and thou seest it not? Why have we humbled ourselves, and thou takest no knowledge of it?\' Behold, in the day of your fast you seek your own pleasure, and oppress all your workers.";
asv[3] = "Wherefore have we fasted, [say they], and thou seest not? [wherefore] have we afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find [your own] pleasure, and exact all your labors.";
yng[3] = "`Why have we fasted, and Thou hast not seen? We have afflicted our soul, and Thou knowest not.\' Lo, in the day of your fast ye find pleasure, And all your labours ye exact.";
dby[3] = "-- Wherefore have we fasted, and thou seest not; have afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find what pleaseth [you], and exact all your labours.";
web[3] = "Why have we fasted, [say they], and thou seest not? [why] have we afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find pleasure, and exact all your labors.";
hnv[3] = "Why have we fasted, [say they], and you don\'t see? [why] have we afflicted our soul, and you take no knowledge? Behold, in the day of your fast you find [your own] pleasure, and exact all your labors.";
vul[3] = "quare ieiunavimus et non aspexisti humiliavimus animam nostram et nescisti ecce in die ieiunii vestri invenitur voluntas et omnes debitores vestros repetitis";
kjv[4] = "Behold, ye fast for strife and debate, and to smite with the fist of wickedness: ye shall not fast as [ye do this] day, to make your voice to be heard on high.";
rsv[4] = "Behold, you fast only to quarrel and to fight and to hit with wicked fist. Fasting like yours this day will not make your voice to be heard on high.";
asv[4] = "Behold, ye fast for strife and contention, and to smite with the fist of wickedness: ye fast not this day so as to make your voice to be heard on high.";
yng[4] = "Lo, for strife and debate ye fast, And to smite with the fist of wickedness, Ye fast not as [to]-day, To sound in the high place your voice.";
dby[4] = "Behold, ye have fasted for strife and debate, and to smite with the fist of wickedness; ye do not at present fast, to cause your voice to be heard on high.";
web[4] = "Behold, ye fast for strife and debate, and to smite with the fist of wickedness: ye shall not fast as [ye do this] day, to make your voice to be heard on high.";
hnv[4] = "Behold, you fast for strife and contention, and to strike with the fist of wickedness: you don\'t fast this day so as to make your voice to be heard on high.";
vul[4] = "ecce ad lites et contentiones ieiunatis et percutitis pugno impie nolite ieiunare sicut usque ad hanc diem ut audiatur in excelso clamor vester";
kjv[5] = "Is it such a fast that I have chosen? a day for a man to afflict his soul? [is it] to bow down his head as a bulrush, and to spread sackcloth and ashes [under him]? wilt thou call this a fast, and an acceptable day to the LORD?";
rsv[5] = "Is such the fast that I choose, a day for a man to humble himself? Is it to bow down his head like a rush, and to spread sackcloth and ashes under him? Will you call this a fast, and a day acceptable to the LORD?";
asv[5] = "Is such the fast that I have chosen? the day for a man to afflict his soul? Is it to bow down his head as a rush, and to spread sackcloth and ashes under him? wilt thou call this a fast, and an acceptable day to Jehovah?";
yng[5] = "Like this is the fast that I choose? The day of a man\'s afflicting his soul? To bow as a reed his head, And sackcloth and ashes spread out? This dost thou call a fast, And a desirable day -- to Jehovah?";
dby[5] = "Is such the fast that I have chosen, a day for a man to afflict his soul, -- that he should bow down his head as a bulrush, and spread sackcloth and ashes [under him]? Wilt thou call this a fast, and a day acceptable to Jehovah?";
web[5] = "Is it such a fast that I have chosen? a day for a man to afflict his soul? [is it] to bow down his head as a bulrush, and to spread sackcloth and ashes [under him]? wilt thou call this a fast, and an acceptable day to the LORD?";
hnv[5] = "Is such the fast that I have chosen? the day for a man to afflict his soul? Is it to bow down his head as a rush, and to spread sackcloth and ashes under him? will you call this a fast, and an acceptable day to the LORD?";
vul[5] = "numquid tale est ieiunium quod elegi per diem adfligere hominem animam suam numquid contorquere quasi circulum caput suum et saccum et cinerem sternere numquid istud vocabis ieiunium et diem acceptabilem Domino";
kjv[6] = "[Is] not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?";
rsv[6] = "&quot;Is not this the fast that I choose: to loose the bonds of wickedness, to undo the thongs of the yoke, to let the oppressed go free, and to break every yoke?";
asv[6] = "Is not this the fast that I have chosen: to loose the bonds of wickedness, to undo the bands of the yoke, and to let the oppressed go free, and that ye break every yoke?";
yng[6] = "Is not this the fast that I chose -- To loose the bands of wickedness, To shake off the burdens of the yoke, And to send out the oppressed free, And every yoke ye draw off?";
dby[6] = "Is not this the fast which I have chosen: to loose the bands of wickedness, to undo the thongs of the yoke, and to send forth free the crushed, and that ye break every yoke?";
web[6] = "[Is] not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?";
hnv[6] = "Isn\'t this the fast that I have chosen: to loose the bonds of wickedness, to undo the bands of the yoke, and to let the oppressed go free, and that you break every yoke?";
vul[6] = "nonne hoc est magis ieiunium quod elegi dissolve conligationes impietatis solve fasciculos deprimentes dimitte eos qui confracti sunt liberos et omne onus disrumpe";
kjv[7] = "[Is it] not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?";
rsv[7] = "Is it not to share your bread with the hungry, and bring the homeless poor into your house; when you see the naked, to cover him, and not to hide yourself from your own flesh?";
asv[7] = "Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?";
yng[7] = "Is it not to deal to the hungry thy bread, And the mourning poor bring home, That thou seest the naked and cover him, And from thine own flesh hide not thyself?";
dby[7] = "Is it not to deal thy bread to the hungry, and that thou bring to thy house the needy wanderers; when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?";
web[7] = "[Is it] not to deal thy bread to the hungry, and that thou shouldst bring the poor that are cast out to thy house? when thou seest the naked, that thou shouldst cover him; and that thou shouldst not hide thyself from thy own flesh?";
hnv[7] = "Isn\'t it to deal your bread to the hungry, and that you bring the poor who are cast out to your house? when you see the naked, that you cover him; and that you not hide yourself from your own flesh?";
vul[7] = "frange esurienti panem tuum et egenos vagosque induc in domum tuam cum videris nudum operi eum et carnem tuam ne despexeris";
kjv[8] = "Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward.";
rsv[8] = "Then shall your light break forth like the dawn, and your healing shall spring up speedily; your righteousness shall go before you, the glory of the LORD shall be your rear guard.";
asv[8] = "Then shall thy light break forth as the morning, and thy healing shall spring forth speedily; and thy righteousness shall go before thee; the glory of Jehovah shall be thy rearward.";
yng[8] = "Then broken up as the dawn is thy light, And thy health in haste springeth up, Gone before thee hath thy righteousness, The honour of Jehovah doth gather thee.";
dby[8] = "Then shall thy light break forth as the dawn, and thy health shall spring forth speedily; and thy righteousness shall go before thee, the glory of Jehovah shall be thy rearguard.";
web[8] = "Then shall thy light break forth as the morning, and thy health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rear-ward.";
hnv[8] = "Then shall your light break forth as the morning, and your healing shall spring forth speedily; and your righteousness shall go before you; the glory of the LORD shall by your rearward.";
vul[8] = "tunc erumpet quasi mane lumen tuum et sanitas tua citius orietur et anteibit faciem tuam iustitia tua et gloria Domini colliget te";
kjv[9] = "Then shalt thou call, and the LORD shall answer; thou shalt cry, and he shall say, Here I [am]. If thou take away from the midst of thee the yoke, the putting forth of the finger, and speaking vanity;";
rsv[9] = "Then you shall call, and the LORD will answer; you shall cry, and he will say, Here I am. &quot;If you take away from the midst of you the yoke, the pointing of the finger, and speaking wickedness,";
asv[9] = "Then shalt thou call, and Jehovah will answer; thou shalt cry, and he will say, Here I am. If thou take away from the midst of thee the yoke, the putting forth of the finger, and speaking wickedly;";
yng[9] = "Then thou callest, and Jehovah answereth, Thou criest, and He saith, `Behold Me.\' If thou turn aside from thy midst the yoke, The sending forth of the finger, And the speaking of vanity,";
dby[9] = "Then shalt thou call, and Jehovah will answer; thou shalt cry, and he will say, Here I am. If thou take away from the midst of thee the yoke, the putting forth of the finger and the unjust speech,";
web[9] = "Then shalt thou call, and the LORD will answer; thou shalt cry, and he will say, Here I [am]. If thou shalt take away from the midst of thee the yoke, the putting forth of the finger, and speaking vanity;";
hnv[9] = "Then shall you call, and the LORD will answer; you shall cry, and he will say, Here I am. If you take away from the midst of you the yoke, the putting forth of the finger, and speaking wickedly;";
vul[9] = "tunc invocabis et Dominus exaudiet clamabis et dicet ecce adsum si abstuleris de medio tui catenam et desieris digitum extendere et loqui quod non prodest";
kjv[10] = "And [if] thou draw out thy soul to the hungry, and satisfy the afflicted soul; then shall thy light rise in obscurity, and thy darkness [be] as the noonday:";
rsv[10] = "if you pour yourself out for the hungry and satisfy the desire of the afflicted, then shall your light rise in the darkness and your gloom be as the noonday.";
asv[10] = "and if thou draw out thy soul to the hungry, and satisfy the afflicted soul: then shall thy light rise in darkness, and thine obscurity be as the noonday;";
yng[10] = "And dost bring out to the hungry thy soul, And the afflicted soul dost satisfy, Then risen in the darkness hath thy light, And thy thick darkness [is] as noon.";
dby[10] = "and thou proffer thy soul to the hungry, and satisfy the afflicted soul: then shall thy light rise in the darkness, and thine obscurity be as midday;";
web[10] = "And [if] thou shalt draw out thy soul to the hungry, and satisfy the afflicted soul; then shall thy light rise in obscurity, and thy darkness [be] as the noon day:";
hnv[10] = "and if you draw out your soul to the hungry, and satisfy the afflicted soul: then shall your light rise in darkness, and your obscurity be as the noonday;";
vul[10] = "cum effuderis esurienti animam tuam et animam adflictam repleveris orietur in tenebris lux tua et tenebrae tuae erunt sicut meridies";
kjv[11] = "And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.";
rsv[11] = "And the LORD will guide you continually, and satisfy your desire with good things, and make your bones strong; and you shall be like a watered garden, like a spring of water, whose waters fail not.";
asv[11] = "and Jehovah will guide thee continually, and satisfy thy soul in dry places, and make strong thy bones; and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.";
yng[11] = "And Jehovah doth lead thee continually, And hath satisfied in drought thy soul, And thy bones He armeth, And thou hast been as a watered garden, And as an outlet of waters, whose waters lie not.";
dby[11] = "and Jehovah will guide thee continually, and satisfy thy soul in drought, and strengthen thy bones; and thou shalt be like a watered garden, and like a water-spring, whose waters deceive not.";
web[11] = "And the LORD will guide thee continually, and satisfy thy soul in drouth, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.";
hnv[11] = "and the LORD will guide you continually, and satisfy your soul in dry places, and make strong your bones; and you shall be like a watered garden, and like a spring of water, whose waters don\'t fail.";
vul[11] = "et requiem tibi dabit Dominus semper et implebit splendoribus animam tuam et ossa tua liberabit et eris quasi hortus inriguus et sicut fons aquarum cuius non deficient aquae";
kjv[12] = "And [they that shall be] of thee shall build the old waste places: thou shalt raise up the foundations of many generations; and thou shalt be called, The repairer of the breach, The restorer of paths to dwell in.";
rsv[12] = "And your ancient ruins shall be rebuilt; you shall raise up the foundations of many generations; you shall be called the repairer of the breach, the restorer of streets to dwell in.";
asv[12] = "And they that shall be of thee shall build the old waste places; thou shalt raise up the foundations of many generations; and thou shalt be called The repairer of the breach, The restorer of paths to dwell in.";
yng[12] = "And they have built out of thee the wastes of old, The foundations of many generations thou raisest up, And one calleth thee, `Repairer of the breach, Restorer of paths to rest in.\'";
dby[12] = "And they [that come] of thee shall build the old waste places: thou shalt raise up the foundations [that have remained] from generation to generation; and thou shalt be called, Repairer of the breaches, restorer of frequented paths.";
web[12] = "And [they that shall be] of thee shall build the old waste places: thou shalt raise up the foundations of many generations; and thou shalt be called, The repairer of the breach, The restorer of paths to dwell in.";
hnv[12] = "Those who shall be of you shall build the old waste places; you shall raise up the foundations of many generations; and you shall be called The repairer of the breach, The restorer of paths to dwell in.";
vul[12] = "et aedificabuntur in te deserta saeculorum fundamenta generationis et generationis suscitabis et vocaberis aedificator sepium avertens semitas in quietem";
kjv[13] = "If thou turn away thy foot from the sabbath, [from] doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking [thine own] words:";
rsv[13] = "&quot;If you turn back your foot from the sabbath, from doing your pleasure on my holy day, and call the sabbath a delight and the holy day of the LORD honorable; if you honor it, not going your own ways, or seeking your own pleasure, or talking idly;";
asv[13] = "If thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, [and] the holy of Jehovah honorable; and shalt honor it, not doing thine own ways, nor finding thine own pleasure, nor speaking [thine own] words:";
yng[13] = "If thou dost turn from the sabbath thy foot, Doing thine own pleasure on My holy day, And hast cried to the sabbath, `A delight,\' To the holy of Jehovah, `Honoured,\' And hast honoured it, without doing thine own ways, Without finding thine own pleasure, And speaking a word.";
dby[13] = "If thou turn back thy foot from the sabbath, [from] doing thy pleasure on my holy day, and call the sabbath a delight, the holy [day] of Jehovah, honourable; and thou honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking [idle] words;";
web[13] = "If thou shalt turn away thy foot from the sabbath, [from] doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honorable; and shalt honor him, not doing thy own ways, nor finding thy own pleasure, nor speaking [thy own] words:";
hnv[13] = "If you turn away your foot from the Shabbat, from doing your pleasure on my holy day; and call the Shabbat a delight, [and] the holy of the LORD honorable; and shall honor it, not doing your own ways, nor finding your own pleasure, nor speaking [your own] words:";
vul[13] = "si averteris a sabbato pedem tuum facere voluntatem tuam in die sancto meo et vocaveris sabbatum delicatum et sanctum Domini gloriosum et glorificaveris eum dum non facis vias tuas et non invenitur voluntas tua ut loquaris sermonem";
kjv[14] = "Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken [it].";
rsv[14] = "then you shall take delight in the LORD, and I will make you ride upon the heights of the earth; I will feed you with the heritage of Jacob your father, for the mouth of the LORD has spoken.&quot;";
asv[14] = "then shalt thou delight thyself in Jehovah; and I will make thee to ride upon the high places of the earth; and I will feed thee with the heritage of Jacob thy father: for the mouth of Jehovah hath spoken it.";
yng[14] = "Then dost thou delight thyself on Jehovah, And I have caused thee to ride on high places of earth, And have caused thee to eat the inheritance of Jacob thy father, For the mouth of Jehovah hath spoken!";
dby[14] = "then shalt thou delight thyself in Jehovah, and I will cause thee to ride on the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of Jehovah hath spoken.";
web[14] = "Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken [it].";
hnv[14] = "then shall you delight yourself in the LORD; and I will make you to ride on the high places of the eretz; and I will feed you with the heritage of Ya`akov your father: for the mouth of the LORD has spoken it.";
vul[14] = "tunc delectaberis super Domino et sustollam te super altitudines terrae et cibabo te hereditate Iacob patris tui os enim Domini locutum est";
