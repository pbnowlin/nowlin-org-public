csb[1] = "&quot;Come, everyone who is thirsty, come to the water; and you without silver, come, buy, and eat! Come, buy wine and milk without silver and without cost!";
csb[2] = "&quot;Why do you spend silver on what is not food, and your wages on what does not satisfy? Listen carefully to me, and eat what is good, and you will enjoy the choicest of foods.";
csb[3] = "&quot;Pay attention and come to me; listen, so that you will live. I will make a permanent covenant with you on the basis of the faithful kindnesses of David.";
csb[4] = "&quot;Since I have made him a witness to the peoples, a leader and commander for the peoples,";
csb[5] = "&quot;so you will summon a nation you do not know, and nations who do not know you will run to you. For the LORD your God, even the Holy One of Israel, has glorified you.&quot;";
csb[6] = "Seek the LORD while he may be found; call to him while he is near.";
csb[7] = "Let the wicked one abandon his way and the sinful one his thoughts; let him return to the LORD, so he may have compassion on him, and to our God, for he will freely forgive.";
csb[8] = "&quot;For my thoughts are not your thoughts, and your ways are not my ways.&quot; This is the LORD\'s declaration.";
csb[9] = "&quot;For as heaven is higher than earth, so my ways are higher than your ways, and my thoughts than your thoughts.";
csb[10] = "&quot;For just as rain and snow fall from heaven and do not return there without saturating the earth and making it germinate and sprout, and providing seed to sow and food to eat,";
csb[11] = "&quot;so my word that comes from my mouth will not return to me empty, but it will accomplish what I please and will prosper in what I send it to do.&quot;";
csb[12] = "You will indeed go out with joy and be peacefully guided; the mountains and the hills will break into singing before you, and all the trees of the field will clap their hands.";
csb[13] = "Instead of the thornbush, a cypress will come up, and instead of the brier, a myrtle will come up; this will stand as a monument for the LORD, an everlasting sign that will not be destroyed.";
