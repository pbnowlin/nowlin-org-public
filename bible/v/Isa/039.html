csb[1] = "At that time Merodach-baladan son of Baladan, king of Babylon, sent letters and a gift to Hezekiah since he heard that he had been sick and had recovered.";
csb[2] = "Hezekiah was pleased with the letters, and he showed the envoys his treasure house -- the silver, the gold, the spices, and the precious oil -- and all his armory, and everything that was found in his treasuries. There was nothing in his palace and in all his realm that Hezekiah did not show them.";
csb[3] = "Then the prophet Isaiah came to King Hezekiah and asked him, &quot;What did these men say, and where did they come to you from? &quot; Hezekiah replied, &quot;They came to me from a distant country, from Babylon.&quot;";
csb[4] = "Isaiah asked, &quot;What have they seen in your palace? &quot; Hezekiah answered, &quot;They have seen everything in my palace. There isn\'t anything in my treasuries that I didn\'t show them.&quot;";
csb[5] = "Then Isaiah said to Hezekiah, &quot;Hear the word of the LORD of Armies:";
csb[6] = "&quot;\'Look, the days are coming when everything in your palace and all that your fathers have stored up until today will be carried off to Babylon; nothing will be left,\' says the LORD.";
csb[7] = "&quot;\'Some of your descendants -- who come from you, whom you father -- will be taken away, and they will become eunuchs in the palace of the king of Babylon.\' &quot;";
csb[8] = "Then Hezekiah said to Isaiah, &quot;The word of the LORD that you have spoken is good,&quot; for he thought: There will be peace and security during my lifetime.";

kjv[2] = "And Hezekiah was glad of them, and shewed them the house of his precious things, the silver, and the gold, and the spices, and the precious ointment, and all the house of his armour, and all that was found in his treasures: there was nothing in his house, nor in all his dominion, that Hezekiah shewed them not.";
rsv[2] = "And Hezeki\'ah welcomed them; and he showed them his treasure house, the silver, the gold, the spices, the precious oil, his whole armory, all that was found in his storehouses. There was nothing in his house or in all his realm that Hezeki\'ah did not show them.";
asv[2] = "And Hezekiah was glad of them, and showed them the house of his precious things, the silver, and the gold, and the spices, and the precious oil, and all the house of his armor, and all that was found in his treasures: there was nothing in his house, nor in all his dominion, that Hezekiah showed them not.";
yng[2] = "And Hezekiah rejoiceth over them, and sheweth them the house of his spices, the silver, and the gold, and the spices, and the good ointment, and all the house of his vessels, and all that hath been found in his treasures; there hath not been a thing in his house, and in all his dominion, that Hezekiah hath not shewed them.";
dby[2] = "And Hezekiah was glad of them, and shewed them the house of his precious things, the silver and the gold, and the spices and the fine oil, and all the house of his armour, and all that was found amongst his treasures: there was nothing in his house, nor in all his dominion, that Hezekiah did not shew them.";
web[2] = "And Hezekiah was glad of them, and showed them the house of his precious things, the silver, and the gold, and the spices, and the precious ointment, and all the house of his armor, and all that was found in his treasures: there was nothing in his house, nor in all his dominion, that Hezekiah did not show them.";
hnv[2] = "Hizkiyahu was glad of them, and shown them the house of his precious things, the silver, and the gold, and the spices, and the precious oil, and all the house of his armor, and all that was found in his treasures: there was nothing in his house, nor in all his dominion, that Hizkiyahu didn\'t show them.";
