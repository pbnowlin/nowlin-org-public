csb[1] = "&quot;Rejoice, childless one, who did not give birth; burst into song and shout, you who have not been in labor! For the children of the desolate one will be more than the children of the married woman,&quot; says the LORD.";
csb[2] = "&quot;Enlarge the site of your tent, and let your tent curtains be stretched out; do not hold back; lengthen your ropes, and drive your pegs deep.";
csb[3] = "&quot;For you will spread out to the right and to the left, and your descendants will dispossess nations and inhabit the desolate cities.";
csb[4] = "&quot;Do not be afraid, for you will not be put to shame; don\'t be humiliated, for you will not be disgraced. For you will forget the shame of your youth, and you will no longer remember the disgrace of your widowhood.";
csb[5] = "&quot;Indeed, your husband is your Maker -- his name is the LORD of Armies -- and the Holy One of Israel is your Redeemer; he is called the God of the whole earth.";
csb[6] = "&quot;For the LORD has called you, like a wife deserted and wounded in spirit, a wife of one\'s youth when she is rejected,&quot; says your God.";
csb[7] = "&quot;I deserted you for a brief moment, but I will take you back with abundant compassion.";
csb[8] = "&quot;In a surge of anger I hid my face from you for a moment, but I will have compassion on you with everlasting love,&quot; says the LORD your Redeemer.";
csb[9] = "&quot;For this is like the days of Noah to me: when I swore that the water of Noah would never flood the earth again, so I have sworn that I will not be angry with you or rebuke you.";
csb[10] = "&quot;Though the mountains move and the hills shake, my love will not be removed from you and my covenant of peace will not be shaken,&quot; says your compassionate LORD.";
csb[11] = "&quot;Poor Jerusalem, storm-tossed, and not comforted, I will set your stones in black mortar, and lay your foundations in lapis lazuli.";
csb[12] = "&quot;I will make your fortifications out of rubies, your gates out of sparkling stones, and all your walls out of precious stones.";
csb[13] = "&quot;Then all your children will be taught by the LORD, their prosperity will be great,";
csb[14] = "&quot;and you will be established on a foundation of righteousness. You will be far from oppression, you will certainly not be afraid; you will be far from terror, it will certainly not come near you.";
csb[15] = "&quot;If anyone attacks you, it is not from me; whoever attacks you will fall before you.";
csb[16] = "&quot;Look, I have created the craftsman who blows on the charcoal fire and produces a weapon suitable for its task; and I have created the destroyer to cause havoc.";
csb[17] = "&quot;No weapon formed against you will succeed, and you will refute any accusation raised against you in court. This is the heritage of the LORD\'s servants, and their vindication is from me.&quot; This is the LORD\'s declaration.";
