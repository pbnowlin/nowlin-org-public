csb[1] = "A pronouncement concerning Moab: Ar in Moab is devastated, destroyed in a night. Kir in Moab is devastated, destroyed in a night.";
csb[2] = "Dibon went up to its temple to weep at its high places. Moab wails on Nebo and at Medeba. Every head is shaved; every beard is chopped short.";
csb[3] = "In its streets they wear sackcloth; on its rooftops and in its public squares everyone wails, falling down and weeping.";
csb[4] = "Heshbon and Elealeh cry out; their voices are heard as far away as Jahaz. Therefore the soldiers of Moab cry out, and they tremble.";
csb[5] = "My heart cries out over Moab, whose fugitives flee as far as Zoar, to Eglath-shelishiyah; they go up the Ascent of Luhith weeping; they raise a cry of destruction on the road to Horonaim.";
csb[6] = "The Waters of Nimrim are desolate; the grass is withered, the foliage is gone, and the vegetation has vanished.";
csb[7] = "So they carry their wealth and belongings over the Wadi of the Willows.";
csb[8] = "For their cry echoes throughout the territory of Moab. Their wailing reaches Eglaim; their wailing reaches Beer-elim.";
csb[9] = "The Waters of Dibon are full of blood, but I will bring on Dibon even more than this -- a lion for those who escape from Moab, and for the survivors in the land.";
kjv[1] = "For the cry is gone round about the borders of Moab; the howling thereof unto Eglaim, and the howling thereof unto Beerelim.";
rsv[1] = "An oracle concerning Moab. Because Ar is laid waste in a night Moab is undone; because Kir is laid waste in a night Moab is undone.";
asv[1] = "The burden of Moab. For in a night Ar of Moab is laid waste, [and] brought to nought; for in a night Kir of Moab is laid waste, [and] brought to nought.";
yng[1] = "The burden of Moab. Because in a night destroyed was Ar of Moab -- It hath been cut off, Because in a night destroyed was Kir of Moab -- It hath been cut off.";
dby[1] = "The burden of Moab: For in the night of being laid waste, Ar of Moab is destroyed; for in the night of being laid waste, Kir of Moab is destroyed!";
web[1] = "The burden of Moab. Because in the night Ar of Moab is laid waste, [and] brought to silence; because in the night Kir of Moab is laid waste, [and] brought to silence;";
hnv[1] = "The burden of Mo\'av. For in a night `Ar of Mo\'av is laid waste, [and] brought to nothing; for in a night Kir of Mo\'av is laid waste, [and] brought to nothing.";
vul[1] = "onus Moab quia nocte vastata est Ar Moab conticuit quia nocte vastatus est murus Moab conticuit";
kjv[2] = "For the waters of Dimon shall be full of blood: for I will bring more upon Dimon, lions upon him that escapeth of Moab, and upon the remnant of the land.";
rsv[2] = "The daughter of Dibon has gone up to the high places to weep; over Nebo and over Med\'eba Moab wails. On every head is baldness, every beard is shorn;";
asv[2] = "They are gone up to Bayith, and to Dibon, to the high places, to weep: Moab waileth over Nebo, and over Medeba; on all their heads is baldness, every beard is cut off.";
yng[2] = "He hath gone up to Bajith and Dibon, The high places -- to weep, On Nebo and on Medeba Moab howleth, On all its heads [is] baldness, every beard cut off.";
dby[2] = "He is gone up to Bajith, and to Dibon, to the high places, to weep; Moab howleth over Nebo, and over Medeba; on all their heads is baldness, every beard is cut off.";
web[2] = "He is gone up to Bajith, and to Dibon, the high places, to weep: Moab shall howl over Nebo, and over Medeba: on all their heads [shall be] baldness, [and] every beard shorn.";
hnv[2] = "They are gone up to Bayit, and to Divon, to the high places, to weep: Mo\'av wails over Nevo, and over Medeva; on all their heads is baldness, every beard is cut off.";
vul[2] = "ascendit domus et Dibon ad excelsa in planctum super Nabo et super Medaba Moab ululabit in cunctis capitibus eius calvitium omnis barba radetur";
kjv[3] = "The burden of Moab. Because in the night Ar of Moab is laid waste, [and] brought to silence; because in the night Kir of Moab is laid waste, [and] brought to silence;";
rsv[3] = "in the streets they gird on sackcloth; on the housetops and in the squares every one wails and melts in tears.";
asv[3] = "In their streets they gird themselves with sackcloth; on their housetops, and in their broad places, every one waileth, weeping abundantly.";
yng[3] = "In its out-places they girded on sackcloth, On its pinnacles, and in its broad places, Every one howleth -- going down with weeping.";
dby[3] = "In their streets they are girded with sackcloth; on their roofs, and in their broadways, every one howleth, melted into tears.";
web[3] = "In their streets they shall gird themselves with sackcloth: on the tops of their houses, and in their streets, every one shall howl, weeping abundantly.";
hnv[3] = " In their streets they gird themselves with sackcloth; on their housetops, and in their broad places, everyone wails, weeping abundantly.";
vul[3] = "in triviis eius accincti sunt sacco super tecta eius et in plateis eius omnis ululat descendit in fletum";
kjv[4] = "He is gone up to Bajith, and to Dibon, the high places, to weep: Moab shall howl over Nebo, and over Medeba: on all their heads [shall be] baldness, [and] every beard cut off.";
rsv[4] = "Heshbon and Ele-a\'leh cry out, their voice is heard as far as Jahaz; therefore the armed men of Moab cry aloud; his soul trembles.";
asv[4] = "And Heshbon crieth out, and Elealeh; their voice is heard even unto Jahaz: therefore the armed men of Moab cry aloud; his soul trembleth within him.";
yng[4] = "And cry doth Heshbon and Elealeh, Unto Jahaz heard hath been their voice, Therefore the armed ones of Moab do shout, His life hath been grievous to him.";
dby[4] = "And Heshbon crieth, and Elealeh: their voice is heard unto Jahaz. Therefore the armed men of Moab cry out: his soul trembleth in him.";
web[4] = "And Heshbon shall cry, and Elealeh: their voice shall be heard [even] to Jahaz: therefore the armed soldiers of Moab shall cry out; his life shall be grievous to him.";
hnv[4] = "Heshbon cries out, and El`aleh; their voice is heard even to Yahatz: therefore the armed men of Mo\'av cry aloud; his soul trembles within him.";
vul[4] = "clamavit Esebon et Eleale usque Iasa audita est vox eorum super hoc expediti Moab ululabunt anima eius ululabit sibi";
kjv[5] = "In their streets they shall gird themselves with sackcloth: on the tops of their houses, and in their streets, every one shall howl, weeping abundantly.";
rsv[5] = "My heart cries out for Moab; his fugitives flee to Zo\'ar, to Eg\'lath-shelish\'iyah. For at the ascent of Luhith they go up weeping; on the road to Horona\'im they raise a cry of destruction;";
asv[5] = "My heart crieth out for Moab; her nobles [flee] unto Zoar, to Eglath-shelishi-yah: for by the ascent of Luhith with weeping they go up; for in the way of Horonaim they raise up a cry of destruction.";
yng[5] = "My heart [is] toward Moab, Cry do her fugitives unto Zoar, a heifer of the third [year], For -- the ascent of Luhith -- With weeping he goeth up in it, For, in the way of Horonaim, A cry of destruction they wake up.";
dby[5] = "My heart crieth out for Moab; their fugitives [have fled] unto Zoar, unto Eglath-Sheli-shijah: for by the ascent of Luhith, with weeping they go up by it; for in the way of Horonaim they raise up a cry of destruction.";
web[5] = "My heart shall cry out for Moab; his fugitives [shall flee] to Zoar, a heifer of three years old: for they shall go up the ascent of Luhith with weeping; for in the way of Horonaim they shall raise a cry of destruction.";
hnv[5] = "My heart cries out for Mo\'av; her nobles [flee] to Tzo`ar, to Eglat-Shelishi-Yah: for by the ascent of Luchit with weeping they go up; for in the way of Horonayim they raise up a cry of destruction.";
vul[5] = "cor meum ad Moab clamabit vectes eius usque ad Segor vitulam conternantem per ascensum enim Luith flens ascendet et in via Oronaim clamorem contritionis levabunt";
kjv[6] = "And Heshbon shall cry, and Elealeh: their voice shall be heard [even] unto Jahaz: therefore the armed soldiers of Moab shall cry out; his life shall be grievous unto him.";
rsv[6] = "the waters of Nimrim are a desolation; the grass is withered, the new growth fails, the verdure is no more.";
asv[6] = "For the waters of Nimrim shall be desolate; for the grass is withered away, the tender grass faileth, there is no green thing.";
yng[6] = "For, the waters of Nimrim are desolations, For, withered hath been the hay, Finished hath been the tender grass, A green thing there hath not been.";
dby[6] = "For the waters of Nimrim shall be desolate; for the herbage is withered away, the grass hath failed, there is no green thing.";
web[6] = "For the waters of Nimrim shall be desolate: for the herb is withered away, the grass faileth, there is no green thing.";
hnv[6] = "For the waters of Nimrim shall be desolate; for the grass is withered away, the tender grass fails, there is no green thing.";
vul[6] = "aquae enim Nemrim desertae erunt quia aruit herba defecit germen viror omnis interiit";
kjv[7] = "My heart shall cry out for Moab; his fugitives [shall flee] unto Zoar, an heifer of three years old: for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.";
rsv[7] = "Therefore the abundance they have gained and what they have laid up they carry away over the Brook of the Willows.";
asv[7] = "Therefore the abundance they have gotten, and that which they have laid up, shall they carry away over the brook of the willows.";
yng[7] = "Therefore the abundance he made, and their store, Unto the brook of the willows they carry.";
dby[7] = "Therefore the abundance they have gotten, and that which they have laid up, do they carry away to the torrent of the willows.";
web[7] = "Therefore the abundance they have gained, and that which they have laid up, shall they carry away to the brook of the willows.";
hnv[7] = "Therefore the abundance they have gotten, and that which they have laid up, shall they carry away over the brook of the willows.";
vul[7] = "secundum magnitudinem operis et visitatio eorum ad torrentem salicum ducent eos";
kjv[8] = "For the waters of Nimrim shall be desolate: for the hay is withered away, the grass faileth, there is no green thing.";
rsv[8] = "For a cry has gone round the land of Moab; the wailing reaches to Egla\'im, the wailing reaches to Beer-e\'lim.";
asv[8] = "For the cry is gone round about the borders of Moab; the wailing thereof unto Eglaim, and the wailing thereof unto Beer-elim.";
yng[8] = "For gone round hath the cry the border of Moab, Unto Eglaim [is] its howling, And to Beer-Elim [is] its howling.";
dby[8] = "For the cry goeth round about the borders of Moab; the howling thereof unto Eglaim, and the howling thereof unto Beer-elim.";
web[8] = "For the cry hath gone round the borders of Moab, her howling to Eglaim, and her howling to Beer-elim.";
hnv[8] = "For the cry is gone round about the borders of Mo\'av; the wailing of it to Eglayim, and the wailing of it to Beer-elim.";
vul[8] = "quoniam circumiit clamor terminum Moab usque ad Gallim ululatus eius et usque ad puteum Helim clamor eius";
kjv[9] = "Therefore the abundance they have gotten, and that which they have laid up, shall they carry away to the brook of the willows.";
rsv[9] = "For the waters of Dibon are full of blood; yet I will bring upon Dibon even more, a lion for those of Moab who escape, for the remnant of the land.";
asv[9] = "For the waters of Dimon are full of blood; for I will bring yet more upon Dimon, a lion upon them of Moab that escape, and upon the remnant of the land.";
yng[9] = "For the waters of Dimon have been full of blood, For I set on Dimon additions, For the escaped of Moab a lion, And for the remnant of Adamah!";
dby[9] = "For the waters of Dimon are full of blood, for I will lay yet more upon Dimon: a lion upon them that are escaped of Moab, and upon that which remaineth of the land.";
web[9] = "For the waters of Dimon shall be full of blood: for I will bring more upon Dimon, lions upon him that escapeth of Moab, and upon the remnant of the land.";
hnv[9] = "For the waters of Dimon are full of blood; for I will bring yet more on Dimon, a lion on them of Mo\'av that escape, and on the remnant of the land.";
vul[9] = "quia aquae Dibon repletae sunt sanguine ponam enim super Dibon additamenta his qui fugerint de Moab leonem et reliquiis terrae";
