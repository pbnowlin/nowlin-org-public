csb[1] = "Then a shoot will grow from the stump of Jesse, and a branch from his roots will bear fruit.";
csb[2] = "The Spirit of the LORD will rest on him -- a Spirit of wisdom and understanding, a Spirit of counsel and strength, a Spirit of knowledge and of the fear of the LORD.";
csb[3] = "His delight will be in the fear of the LORD. He will not judge by what he sees with his eyes, he will not execute justice by what he hears with his ears,";
csb[4] = "but he will judge the poor righteously and execute justice for the oppressed of the land. He will strike the land with a scepter from his mouth, and he will kill the wicked with a command from his lips.";
csb[5] = "Righteousness will be a belt around his hips; faithfulness will be a belt around his waist.";
csb[6] = "The wolf will dwell with the lamb, and the leopard will lie down with the goat. The calf, the young lion, and the fattened calf will be together, and a child will lead them.";
csb[7] = "The cow and the bear will graze, their young ones will lie down together, and the lion will eat straw like cattle.";
csb[8] = "An infant will play beside the cobra\'s pit, and a toddler will put his hand into a snake\'s den.";
csb[9] = "They will not harm or destroy each other on my entire holy mountain, for the land will be as full of the knowledge of the LORD as the sea is filled with water.";
csb[10] = "On that day the root of Jesse will stand as a banner for the peoples. The nations will look to him for guidance, and his resting place will be glorious.";
csb[11] = "On that day the Lord will extend his hand a second time to recover the remnant of his people who survive -- from Assyria, Egypt, Pathros, Cush, Elam, Shinar, Hamath, and the coasts and islands of the west.";
csb[12] = "He will lift up a banner for the nations and gather the dispersed of Israel; he will collect the scattered of Judah from the four corners of the earth.";
csb[13] = "Ephraim\'s envy will cease; Judah\'s harassing will end. Ephraim will no longer be envious of Judah, and Judah will not harass Ephraim.";
csb[14] = "But they will swoop down on the Philistine flank to the west. Together they will plunder the people of the east. They will extend their power over Edom and Moab, and the Ammonites will be their subjects.";
csb[15] = "The LORD will divide the Gulf of Suez. He will wave his hand over the Euphrates with his mighty wind and will split it into seven streams, letting people walk through on foot.";
csb[16] = "There will be a highway for the remnant of his people who will survive from Assyria, as there was for Israel when they came up from the land of Egypt.";
