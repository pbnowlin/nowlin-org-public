csb[1] = "&quot;I was sought by those who did not ask; I was found by those who did not seek me. I said, \'Here I am, here I am,\' to a nation that did not call on my name.";
csb[2] = "&quot;I spread out my hands all day long to a rebellious people who walk in the path that is not good, following their own thoughts.";
csb[3] = "&quot;These people continually anger me to my face, sacrificing in gardens, burning incense on bricks,";
csb[4] = "&quot;sitting among the graves, spending nights in secret places, eating the meat of pigs, and putting polluted broth in their bowls.";
csb[5] = "&quot;They say, \'Keep to yourself, don\'t come near me, for I am too holy for you! \' These practices are smoke in my nostrils, a fire that burns all day long.";
csb[6] = "&quot;Look, it is written in front of me: I will not keep silent, but I will repay; I will repay them fully";
csb[7] = "&quot;for your iniquities and the iniquities of your fathers together,&quot; says the LORD. &quot;Because they burned incense on the mountains and reproached me on the hills, I will reward them fully for their former deeds.&quot;";
csb[8] = "The LORD says this: &quot;As the new wine is found in a bunch of grapes, and one says, \'Don\'t destroy it, for there\'s some good in it,\' so I will act because of my servants and not destroy them all.";
csb[9] = "&quot;I will produce descendants from Jacob, and heirs to my mountains from Judah; my chosen ones will possess it, and my servants will dwell there.";
csb[10] = "&quot;Sharon will be a pasture for flocks, and the Valley of Achor a place for herds to lie down, for my people who have sought me.";
csb[11] = "&quot;But you who abandon the LORD, who forget my holy mountain, who prepare a table for Fortune and fill bowls of mixed wine for Destiny,";
csb[12] = "&quot;I will destine you for the sword, and all of you will kneel down to be slaughtered, because I called and you did not answer, I spoke and you did not hear; you did what was evil in my sight and chose what I did not delight in.&quot;";
csb[13] = "Therefore, this is what the Lord GOD says: &quot;My servants will eat, but you will be hungry; my servants will drink, but you will be thirsty; my servants will rejoice, but you will be put to shame.";
csb[14] = "&quot;My servants will shout for joy from a glad heart, but you will cry out from an anguished heart, and you will lament out of a broken spirit.";
csb[15] = "&quot;You will leave your name behind as a curse for my chosen ones, and the Lord GOD will kill you; but he will give his servants another name.";
csb[16] = "&quot;Whoever asks for a blessing in the land will ask for a blessing by the God of truth, and whoever swears in the land will swear by the God of truth. For the former troubles will be forgotten and hidden from my sight.";
csb[17] = "&quot;For I will create a new heaven and a new earth; the past events will not be remembered or come to mind.";
csb[18] = "&quot;Then be glad and rejoice forever in what I am creating; for I will create Jerusalem to be a joy and its people to be a delight.";
csb[19] = "&quot;I will rejoice in Jerusalem and be glad in my people. The sound of weeping and crying will no longer be heard in her.";
csb[20] = "&quot;In her, a nursing infant will no longer live only a few days, or an old man not live out his days. Indeed, the one who dies at a hundred years old will be mourned as a young man, and the one who misses a hundred years will be considered cursed.";
csb[21] = "&quot;People will build houses and live in them; they will plant vineyards and eat their fruit.";
csb[22] = "&quot;They will not build and others live in them; they will not plant and others eat. For my people\'s lives will be like the lifetime of a tree. My chosen ones will fully enjoy the work of their hands.";
csb[23] = "&quot;They will not labor without success or bear children destined for disaster, for they will be a people blessed by the LORD along with their descendants.";
csb[24] = "&quot;Even before they call, I will answer; while they are still speaking, I will hear.";
csb[25] = "&quot;The wolf and the lamb will feed together, and the lion will eat straw like cattle, but the serpent\'s food will be dust! They will not do what is evil or destroy on my entire holy mountain,&quot; says the LORD.";

asv[18] = "But be ye glad and rejoice for ever in that which I create; for, behold, I create Jerusalem a rejoicing, and her people a joy.";
yng[18] = "But joy ye, and rejoice for ever, that I [am] Creator, For, lo, I am creating Jerusalem a rejoicing, And her people a joy.";
dby[18] = "But be glad and rejoice for ever in that which I create. For behold, I create Jerusalem a rejoicing, and her people a joy.";
web[18] = "But be ye glad and rejoice for ever [in that] which I create: for behold, I create Jerusalem a rejoicing, and her people a joy.";
hnv[18] = " But be you glad and rejoice forever in that which I create; for, behold, I create Yerushalayim a rejoicing, and her people a joy.";
vul[18] = "sed gaudebitis et exultabitis usque in sempiternum in his quae ego creo quia ecce ego creo Hierusalem exultationem et populum eius gaudium";
kjv[19] = "And I will rejoice in Jerusalem, and joy in my people: and the voice of weeping shall be no more heard in her, nor the voice of crying.";
rsv[19] = "I will rejoice in Jerusalem, and be glad in my people; no more shall be heard in it the sound of weeping and the cry of distress.";
asv[19] = "And I will rejoice in Jerusalem, and joy in my people; and there shall be heard in her no more the voice of weeping and the voice of crying.";
yng[19] = "And I have rejoiced in Jerusalem, And have joyed in My people, And not heard in her any more Is the voice of weeping, and the voice of crying.";
dby[19] = "And I will rejoice over Jerusalem, and will joy in my people; and the voice of weeping shall be no more heard in her, nor the voice of crying.";
web[19] = "And I will rejoice in Jerusalem, and joy in my people: and the voice of weeping shall be no more heard in her, nor the voice of crying.";
hnv[19] = "I will rejoice in Yerushalayim, and joy in my people; and there shall be heard in her no more the voice of weeping and the voice of crying.";
vul[19] = "et exultabo in Hierusalem et gaudebo in populo meo et non audietur in eo ultra vox fletus et vox clamoris";
kjv[20] = "There shall be no more thence an infant of days, nor an old man that hath not filled his days: for the child shall die an hundred years old; but the sinner [being] an hundred years old shall be accursed.";
rsv[20] = "No more shall there be in it an infant that lives but a few days, or an old man who does not fill out his days, for the child shall die a hundred years old, and the sinner a hundred years old shall be accursed.";
asv[20] = "There shall be no more thence an infant of days, nor an old man that hath not filled his days; for the child shall die a hundred years old, and the sinner being a hundred years old shall be accursed.";
yng[20] = "There is not thence any more a suckling of days, And an aged man who doth not complete his days, For the youth a hundred years old dieth, And the sinner, a hundred years old, is lightly esteemed.";
dby[20] = "There shall be no more thenceforth an infant of days, nor an old man that hath not completed his days; for the youth shall die a hundred years old, and the sinner being a hundred years old shall be accursed.";
web[20] = "There shall be no more thence an infant of days, nor an old man that hath not filled his days: for the child shall die a hundred years old: but the sinner [being] a hundred years old shall be accursed.";
hnv[20] = "There shall be no more there an infant of days, nor an old man who has not filled his days; for the child shall die one hundred years old, and the sinner being one hundred years old shall be accursed.";
vul[20] = "non erit ibi amplius infans dierum et senex qui non impleat dies suos quoniam puer centum annorum morietur et peccator centum annorum maledictus erit";
kjv[21] = "And they shall build houses, and inhabit [them]; and they shall plant vineyards, and eat the fruit of them.";
rsv[21] = "They shall build houses and inhabit them; they shall plant vineyards and eat their fruit.";
asv[21] = "And they shall build houses, and inhabit them; and they shall plant vineyards, and eat the fruit of them.";
yng[21] = "And they have built houses, and inhabited, And planted vineyards, and eaten their fruit.";
dby[21] = "And they shall build houses, and inhabit them; and they shall plant vineyards, and eat the fruit thereof:";
web[21] = "And they shall build houses, and inhabit [them]; and they shall plant vineyards, and eat the fruit of them.";
hnv[21] = "They shall build houses, and inhabit them; and they shall plant vineyards, and eat the fruit of them.";
vul[21] = "et aedificabunt domos et habitabunt et plantabunt vineas et comedent fructum earum";
kjv[22] = "They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree [are] the days of my people, and mine elect shall long enjoy the work of their hands.";
rsv[22] = "They shall not build and another inhabit; they shall not plant and another eat; for like the days of a tree shall the days of my people be, and my chosen shall long enjoy the work of their hands.";
asv[22] = "They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree shall be the days of my people, and my chosen shall long enjoy the work of their hands.";
yng[22] = "They do not build, and another inhabit, They do not plant, and another eat, For as the days of a tree [are] the days of My people, And the work of their hands wear out do My chosen ones.";
dby[22] = "they shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree shall be the days of my people, and mine elect shall long enjoy the work of their hands.";
web[22] = "They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree [are] the days of my people, and my elect shall long enjoy the work of their hands.";
hnv[22] = "They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree shall be the days of my people, and my chosen shall long enjoy the work of their hands.";
vul[22] = "non aedificabunt et alius habitabit non plantabunt et alius comedet secundum dies enim ligni erunt dies populi mei et opera manuum eorum inveterabunt";
kjv[23] = "They shall not labour in vain, nor bring forth for trouble; for they [are] the seed of the blessed of the LORD, and their offspring with them.";
rsv[23] = "They shall not labor in vain, or bear children for calamity; for they shall be the offspring of the blessed of the LORD, and their children with them.";
asv[23] = "They shall not labor in vain, nor bring forth for calamity; for they are the seed of the blessed of Jehovah, and their offspring with them.";
yng[23] = "They labour not for a vain thing, Nor do they bring forth for trouble, For the seed of the blessed of Jehovah [are] they, And their offspring with them.";
dby[23] = "They shall not labour in vain, nor bring forth for terror; for they are the seed of the blessed of Jehovah, and their offspring with them.";
web[23] = "They shall not labor in vain, nor bring forth for trouble; for they [are] the seed of the blessed of the LORD, and their offspring with them.";
hnv[23] = "They shall not labor in vain, nor bring forth for calamity; for they are the seed of the blessed of the LORD, and their offspring with them.";
vul[23] = "electis meis non laborabunt frustra neque generabunt in conturbatione quia semen benedictorum Domini est et nepotes eorum cum eis";
kjv[24] = "And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear.";
rsv[24] = "Before they call I will answer, while they are yet speaking I will hear.";
asv[24] = "And it shall come to pass that, before they call, I will answer; and while they are yet speaking, I will hear.";
yng[24] = "And it hath come to pass, They do not yet call, and I answer, They are yet speaking, and I hear.";
dby[24] = "And it shall come to pass, that before they call, I will answer; while they are yet speaking, I will hear.";
web[24] = "And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear.";
hnv[24] = "It shall happen that, before they call, I will answer; and while they are yet speaking, I will hear.";
vul[24] = "eritque antequam clament ego exaudiam adhuc illis loquentibus ego audiam";
kjv[25] = "The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock: and dust [shall be] the serpent\'s meat. They shall not hurt nor destroy in all my holy mountain, saith the LORD.";
rsv[25] = "The wolf and the lamb shall feed together, the lion shall eat straw like the ox; and dust shall be the serpent\'s food. They shall not hurt or destroy in all my holy mountain, says the LORD.&quot;";
asv[25] = "The wolf and the lamb shall feed together, and the lion shall eat straw like the ox; and dust shall be the serpent\'s food. They shall not hurt nor destroy in all my holy mountain, saith Jehovah.";
yng[25] = "Wolf and lamb do feed as one, And a lion as an ox eateth straw, As to the serpent -- dust [is] its food, They do no evil, nor destroy, In all My holy mountain, said Jehovah!";
dby[25] = "The wolf and the lamb shall feed together, and the lion shall eat straw like the ox; and dust shall be the serpent\'s meat. They shall not hurt nor destroy in all my holy mountain, saith Jehovah.";
web[25] = "The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock: and dust [shall be] the serpents\' food. They shall not hurt nor destroy in all my holy mountain, saith the LORD.";
hnv[25] = "The wolf and the lamb shall feed together, and the lion shall eat straw like the ox; and dust shall be the serpent\'s food. They shall not hurt nor destroy in all my holy mountain, says the LORD.";
vul[25] = "lupus et agnus pascentur simul et leo et bos comedent paleas et serpenti pulvis panis eius non nocebunt neque occident in omni monte sancto meo dicit Dominus";
