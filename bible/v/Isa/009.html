csb[1] = "Nevertheless, the gloom of the distressed land will not be like that of the former times when he humbled the land of Zebulun and the land of Naphtali. But in the future he will bring honor to the way of the sea, to the land east of the Jordan, and to Galilee of the nations.";
csb[2] = "The people walking in darkness have seen a great light; a light has dawned on those living in the land of darkness.";
csb[3] = "You have enlarged the nation and increased its joy. The people have rejoiced before you as they rejoice at harvest time and as they rejoice when dividing spoils.";
csb[4] = "For you have shattered their oppressive yoke and the rod on their shoulders, the staff of their oppressor, just as you did on the day of Midian.";
csb[5] = "For every trampling boot of battle and the bloodied garments of war will be burned as fuel for the fire.";
csb[6] = "For a child will be born for us, a son will be given to us, and the government will be on his shoulders. He will be named Wonderful Counselor, Mighty God, Eternal Father, Prince of Peace.";
csb[7] = "The dominion will be vast, and its prosperity will never end. He will reign on the throne of David and over his kingdom, to establish and sustain it with justice and righteousness from now on and forever. The zeal of the LORD of Armies will accomplish this.";
csb[8] = "The Lord sent a message against Jacob; it came against Israel.";
csb[9] = "All the people -- Ephraim and the inhabitants of Samaria -- will know it. They will say with pride and arrogance:";
csb[10] = "&quot;The bricks have fallen, but we will rebuild with cut stones; the sycamores have been cut down, but we will replace them with cedars.&quot;";
csb[11] = "The LORD has raised up Rezin\'s adversaries against him and stirred up his enemies.";
csb[12] = "Aram from the east and Philistia from the west have consumed Israel with open mouths. In all this, his anger has not turned away, and his hand is still raised to strike.";
csb[13] = "The people did not turn to him who struck them; they did not seek the LORD of Armies.";
csb[14] = "So the LORD cut off Israel\'s head and tail, palm branch and reed in a single day.";
csb[15] = "The head is the elder, the honored one; the tail is the prophet, the one teaching lies.";
csb[16] = "The leaders of the people mislead them, and those they mislead are swallowed up.";
csb[17] = "Therefore the Lord does not rejoice over Israel\'s young men and has no compassion on its fatherless and widows, for everyone is a godless evildoer, and every mouth speaks folly. In all this, his anger has not turned away, and his hand is still raised to strike.";
csb[18] = "For wickedness burns like a fire that consumes thorns and briers and kindles the forest thickets so that they go up in a column of smoke.";
csb[19] = "The land is scorched by the wrath of the LORD of Armies, and the people are like fuel for the fire. No one has compassion on his brother.";
csb[20] = "They carve meat on the right, but they are still hungry; they have eaten on the left, but they are still not satisfied. Each one eats the flesh of his own arm.";
csb[21] = "Manasseh is with Ephraim, and Ephraim with Manasseh; together, both are against Judah. In all this, his anger has not turned away, and his hand is still raised to strike.";
kjv[1] = "Nevertheless the dimness [shall] not [be] such as [was] in her vexation, when at the first he lightly afflicted the land of Zebulun and the land of Naphtali, and afterward did more grievously afflict [her by] the way of the sea, beyond Jordan, in Galilee of the nations.";
rsv[1] = "But there will be no gloom for her that was in anguish. In the former time he brought into contempt the land of Zeb\'ulun and the land of Naph\'tali, but in the latter time he will make glorious the way of the sea, the land beyond the Jordan, Galilee of the nations.";
asv[1] = "But there shall be no gloom to her that was in anguish. In the former time he brought into contempt the land of Zebulun and the land of Naphtali; but in the latter time hath he made it glorious, by the way of the sea, beyond the Jordan, Galilee of the nations.";
yng[1] = "As the former time made light The land of Zebulun and the land of Naphtali, So the latter hath honoured the way of the sea, Beyond the Jordan, Galilee of the nations.";
dby[1] = "Nevertheless the darkness shall not be as when the distress was in the [land], at the time he at first lightly, and afterwards heavily, visited the land of Zebulun and the land of Naphtali, -- the way of the sea, beyond the Jordan, Galilee of the nations:";

hnv[1] = "But there shall be no gloom to her who was in anguish. In the former time he brought into contempt the land of Zevulun and the land of Naftali; but in the latter time has he made it glorious, by the way of the sea, beyond the Yarden, Galil of the nations.";
