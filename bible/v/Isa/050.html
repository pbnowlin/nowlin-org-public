csb[1] = "This is what the LORD says: Where is your mother\'s divorce certificate that I used to send her away? Or to which of my creditors did I sell you? Look, you were sold for your iniquities, and your mother was sent away because of your transgressions.";
csb[2] = "Why was no one there when I came? Why was there no one to answer when I called? Is my arm too weak to redeem? Or do I have no power to rescue? Look, I dry up the sea by my rebuke; I turn the rivers into a wilderness; their fish rot because of lack of water and die of thirst.";
csb[3] = "I dress the heavens in black and make sackcloth their clothing.";
csb[4] = "The Lord GOD has given me the tongue of those who are instructed to know how to sustain the weary with a word. He awakens me each morning; he awakens my ear to listen like those being instructed.";
csb[5] = "The Lord GOD has opened my ear, and I was not rebellious; I did not turn back.";
csb[6] = "I gave my back to those who beat me, and my cheeks to those who tore out my beard. I did not hide my face from scorn and spitting.";
csb[7] = "The Lord GOD will help me; therefore I have not been humiliated; therefore I have set my face like flint, and I know I will not be put to shame.";
csb[8] = "The one who vindicates me is near; who will contend with me? Let us confront each other. Who has a case against me? Let him come near me!";
csb[9] = "In truth, the Lord GOD will help me; who will condemn me? Indeed, all of them will wear out like a garment; a moth will devour them.";
csb[10] = "Who among you fears the LORD and listens to his servant? Who among you walks in darkness, and has no light? Let him trust in the name of the LORD; let him lean on his God.";
csb[11] = "Look, all you who kindle a fire, who encircle yourselves with torches; walk in the light of your fire and of the torches you have lit! This is what you\'ll get from my hand: you will lie down in a place of torment.";
kjv[1] = "Thus saith the LORD, Where [is] the bill of your mother\'s divorcement, whom I have put away? or which of my creditors [is it] to whom I have sold you? Behold, for your iniquities have ye sold yourselves, and for your transgressions is your mother put away.";
rsv[1] = "Thus says the LORD: &quot;Where is your mother\'s bill of divorce, with which I put her away? Or which of my creditors is it to whom I have sold you? Behold, for your iniquities you were sold, and for your transgressions your mother was put away.";
asv[1] = "Thus saith Jehovah, Where is the bill of your mother\'s divorcement, wherewith I have put her away? or which of my creditors is it to whom I have sold you? Behold, for your iniquities were ye sold, and for your transgressions was your mother put away.";
yng[1] = "Thus said Jehovah: `Where [is] this -- the bill of your mother\'s divorce, Whom I sent away? Or to which of My creditors have I sold you? Lo, for your iniquities ye have been sold, And for your transgressions Hath your mother been sent away.";
dby[1] = "Thus saith Jehovah: Where is the bill of your mother\'s divorce, whom I have put away? or which of my creditors is it to whom I have sold you? Behold, through your iniquities have ye sold yourselves, and for your transgressions is your mother put away.";
web[1] = "Thus saith the LORD, Where [is] the bill of your mother\'s divorcement, whom I have put away? or which of my creditors [is it] to whom I have sold you? Behold, for your iniquities have ye sold yourselves, and for your transgressions is your mother put away.";
hnv[1] = "Thus says the LORD, Where is the bill of your mother\'s divorce, with which I have put her away? or which of my creditors is it to whom I have sold you? Behold, for your iniquities were you sold, and for your transgressions was your mother put away.";
vul[1] = "haec dicit Dominus quis est hic liber repudii matris vestrae quo dimisi eam aut quis est creditor meus cui vendidi vos ecce in iniquitatibus vestris venditi estis et in sceleribus vestris dimisi matrem vestram";
kjv[2] = "Wherefore, when I came, [was there] no man? when I called, [was there] none to answer? Is my hand shortened at all, that it cannot redeem? or have I no power to deliver? behold, at my rebuke I dry up the sea, I make the rivers a wilderness: their fish stinketh, because [there is] no water, and dieth for thirst.";
rsv[2] = "Why, when I came, was there no man? When I called, was there no one to answer? Is my hand shortened, that it cannot redeem? Or have I no power to deliver? Behold, by my rebuke I dry up the sea, I make the rivers a desert; their fish stink for lack of water, and die of thirst.";
asv[2] = "Wherefore, when I came, was there no man? when I called, was there none to answer? Is my hand shortened at all, that it cannot redeem? or have I no power to deliver? Behold, at my rebuke I dry up the sea, I make the rivers a wilderness: their fish stink, because there is no water, and die for thirst.";
yng[2] = "Wherefore have I come, and there is no one? I called, and there is none answering, Hath My hand been at all short of redemption? And is there not in me power to deliver? Lo, by My rebuke I dry up a sea, I make rivers a wilderness, Their fish stinketh, for there is no water, And dieth with thirst.";
dby[2] = "Wherefore did I come, and there was no man? I called, and there was none to answer? Is my hand at all shortened that I cannot redeem, or have I no power to deliver? behold, at my rebuke I dry up the sea, I make rivers a wilderness; their fish stink because there is no water, and die for thirst.";
web[2] = "Why, when I came, [was there] no man? when I called, [was there] none to answer? Is my hand shortened at all, that it cannot redeem? or have I no power to deliver? behold, at my rebuke I dry up the sea, I make the rivers a wilderness: their fish becometh putrid, because [there is] no water, and dieth for thirst.";
hnv[2] = "Why, when I came, was there no man? when I called, was there none to answer? Is my hand shortened at all, that it can\'t redeem? or have I no power to deliver? Behold, at my rebuke I dry up the sea, I make the rivers a wilderness: their fish stink, because there is no water, and die for thirst.";
vul[2] = "quia veni et non erat vir vocavi et non erat qui audiret numquid adbreviata et parvula facta est manus mea ut non possim redimere aut non est in me virtus ad liberandum ecce in increpatione mea desertum faciam mare ponam flumina in siccum conputrescent pisces sine aqua et morientur in siti";
kjv[3] = "I clothe the heavens with blackness, and I make sackcloth their covering.";
rsv[3] = "I clothe the heavens with blackness, and make sackcloth their covering.&quot;";
asv[3] = "I clothe the heavens with blackness, and I make sackcloth their covering.";
yng[3] = "I clothe the heavens [with] blackness, And sackcloth I make their covering.";
dby[3] = "I clothe the heavens with blackness, and I make sackcloth their covering.";
web[3] = "I clothe the heavens with blackness, and I make sackcloth their covering.";
hnv[3] = "I clothe the heavens with blackness, and I make sackcloth their covering.";
vul[3] = "induam caelos tenebris et saccum ponam operimentum eorum";
kjv[4] = "The Lord GOD hath given me the tongue of the learned, that I should know how to speak a word in season to [him that is] weary: he wakeneth morning by morning, he wakeneth mine ear to hear as the learned.";
rsv[4] = "The Lord GOD has given me the tongue of those who are taught, that I may know how to sustain with a word him that is weary. Morning by morning he wakens, he wakens my ear to hear as those who are taught.";
asv[4] = "The Lord Jehovah hath given me the tongue of them that are taught, that I may know how to sustain with words him that is weary: he wakeneth morning by morning, he wakeneth mine ear to hear as they that are taught.";
yng[4] = "The Lord Jehovah hath given to me The tongue of taught ones, To know to aid the weary [by] a word, He waketh morning by morning, He waketh for me an ear to hear as taught ones.";
dby[4] = "The Lord Jehovah hath given me the tongue of the instructed, that I should know how to succour by a word him that is weary. He wakeneth morning by morning, he wakeneth mine ear to hear as the instructed.";
web[4] = "The Lord GOD hath given me the tongue of the learned, that I should know how to speak a word in season to [him that is] weary: he wakeneth morning by morning, he wakeneth my ear to hear as the learned.";
hnv[4] = "The Lord GOD has given me the tongue of those who are taught, that I may know how to sustain with words him who is weary: he wakens morning by morning, he wakens my ear to hear as those who are taught.";
vul[4] = "Dominus dedit mihi linguam eruditam ut sciam sustentare eum qui lassus est verbo erigit mane mane erigit mihi aurem ut audiam quasi magistrum";
kjv[5] = "The Lord GOD hath opened mine ear, and I was not rebellious, neither turned away back.";
rsv[5] = "The Lord GOD has opened my ear, and I was not rebellious, I turned not backward.";
asv[5] = "The Lord Jehovah hath opened mine ear, and I was not rebellious, neither turned away backward.";
yng[5] = "The Lord Jehovah opened for me the ear, And I rebelled not -- backward I moved not.";
dby[5] = "The Lord Jehovah hath opened mine ear, and I was not rebellious; I turned not away back.";
web[5] = "The Lord GOD opened my ear, and I was not rebellious, neither turned away back.";
hnv[5] = "The Lord GOD has opened my ear, and I was not rebellious, neither turned away backward.";
vul[5] = "Dominus Deus aperuit mihi aurem ego autem non contradico retrorsum non abii";
kjv[6] = "I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting.";
rsv[6] = "I gave my back to the smiters, and my cheeks to those who pulled out the beard; I hid not my face from shame and spitting.";
asv[6] = "I gave my back to the smiters, and my cheeks to them that plucked off the hair; I hid not my face from shame and spitting.";
yng[6] = "My back I have given to those smiting, And my cheeks to those plucking out, My face I hid not from shame and spitting.";
dby[6] = "I gave my back to smiters, and my cheeks to them that plucked off the hair; I hid not my face from shame and spitting.";
web[6] = "I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting.";
hnv[6] = "I gave my back to the strikers, and my cheeks to those who plucked off the hair; I didn\'t hide my face from shame and spitting.";
vul[6] = "corpus meum dedi percutientibus et genas meas vellentibus faciem meam non averti ab increpantibus et conspuentibus";
kjv[7] = "For the Lord GOD will help me; therefore shall I not be confounded: therefore have I set my face like a flint, and I know that I shall not be ashamed.";
rsv[7] = "For the Lord GOD helps me; therefore I have not been confounded; therefore I have set my face like a flint, and I know that I shall not be put to shame;";
asv[7] = "For the Lord Jehovah will help me; therefore have I not been confounded: therefore have I set my face like a flint, and I know that I shall not be put to shame.";
yng[7] = "And the Lord Jehovah giveth help to me, Therefore I have not been ashamed, Therefore I have set my face as a flint, And I know that I am not ashamed.";
dby[7] = "But the Lord Jehovah will help me: therefore shall I not be confounded; therefore have I set my face like a flint, and I know that I shall not be ashamed.";
web[7] = "For the Lord GOD will help me; therefore shall I not be confounded: therefore have I set my face like a flint, and I know that I shall not be ashamed.";
hnv[7] = "For the Lord GOD will help me; therefore I have not been confounded: therefore have I set my face like a flint, and I know that I shall not be disappointed.";
vul[7] = "Dominus Deus auxiliator meus ideo non sum confusus ideo posui faciem meam ut petram durissimam et scio quoniam non confundar";
kjv[8] = "[He is] near that justifieth me; who will contend with me? let us stand together: who [is] mine adversary? let him come near to me.";
rsv[8] = "he who vindicates me is near. Who will contend with me? Let us stand up together. Who is my adversary? Let him come near to me.";
asv[8] = "He is near that justifieth me; who will contend with me? let us stand up together: who is mine adversary? let him come near to me.";
yng[8] = "Near [is] He who is justifying me, Who doth contend with me? We stand together, who [is] mine opponent? Let him come nigh unto me.";
dby[8] = "He is near that justifieth me: who will contend with me? let us stand together; who is mine adverse party? let him draw near unto me.";
web[8] = "[He is] near that justifieth me; who will contend with me? let us stand together; who [is] my adversary? let him come near to me.";
hnv[8] = "He is near who justifies me; who will bring charges against me? Let us stand up together: who is my adversary? Let him come near to me.";
vul[8] = "iuxta est qui iustificat me quis contradicet mihi stemus simul quis est adversarius meus accedat ad me";
kjv[9] = "Behold, the Lord GOD will help me; who [is] he [that] shall condemn me? lo, they all shall wax old as a garment; the moth shall eat them up.";
rsv[9] = "Behold, the Lord GOD helps me; who will declare me guilty? Behold, all of them will wear out like a garment; the moth will eat them up.";
asv[9] = "Behold, the Lord Jehovah will help me; who is he that shall condemn me? behold, they all shall wax old as a garment; the moth shall eat them up.";
yng[9] = "Lo, the Lord Jehovah giveth help to me, Who [is] he that declareth me wicked? Lo, all of them as a garment wear out, A moth doth eat them.";
dby[9] = "Behold, the Lord Jehovah will help me; who is he that shall condemn me? Behold, they all shall grow old as a garment; the moth shall eat them up.";
web[9] = "Behold the Lord GOD will help me; who [is] he [that] shall condemn me? lo, they all shall wax old as a garment; the moth shall eat them up.";
hnv[9] = " Behold, the Lord GOD will help me; who is he who shall condemn me? Behold, all they shall wax old as a garment, the moth shall eat them up.";
vul[9] = "ecce Dominus Deus auxiliator meus quis est qui condemnet me ecce omnes quasi vestimentum conterentur tinea comedet eos";
kjv[10] = "Who [is] among you that feareth the LORD, that obeyeth the voice of his servant, that walketh [in] darkness, and hath no light? let him trust in the name of the LORD, and stay upon his God.";
rsv[10] = "Who among you fears the LORD and obeys the voice of his servant, who walks in darkness and has no light, yet trusts in the name of the LORD and relies upon his God?";
asv[10] = "Who is among you that feareth Jehovah, that obeyeth the voice of his servant? he that walketh in darkness, and hath no light, let him trust in the name of Jehovah, and rely upon his God.";
yng[10] = "Who [is] among you, fearing Jehovah, Hearkening to the voice of His servant, That hath walked in dark places, And there is no brightness for him? Let him trust in the name of Jehovah, And lean upon his God.";
dby[10] = "Who is among you that feareth Jehovah, that hearkeneth to the voice of his servant? he that walketh in darkness, and hath no light, -- let him confide in the name of Jehovah, and stay himself upon his God.";
web[10] = "Who [is] among you that feareth the LORD, that obeyeth the voice of his servant, that walketh [in] darkness, and hath no light? let him trust in the name of the LORD, and rely upon his God.";
hnv[10] = "Who is among you who fears the LORD, who obeys the voice of his servant? He who walks in darkness, and has no light, let him trust in the name of the LORD, and rely on his God.";
vul[10] = "quis ex vobis timens Dominum audiens vocem servi sui qui ambulavit in tenebris et non est lumen ei speret in nomine Domini et innitatur super Deum suum";
kjv[11] = "Behold, all ye that kindle a fire, that compass [yourselves] about with sparks: walk in the light of your fire, and in the sparks [that] ye have kindled. This shall ye have of mine hand; ye shall lie down in sorrow.";
rsv[11] = "Behold, all you who kindle a fire, who set brands alight! Walk by the light of your fire, and by the brands which you have kindled! This shall you have from my hand: you shall lie down in torment.";
asv[11] = "Behold, all ye that kindle a fire, that gird yourselves about with firebrands; walk ye in the flame of your fire, and among the brands that ye have kindled. This shall ye have of my hand; ye shall lie down in sorrow.";
yng[11] = "Lo, all ye kindling a fire, girding on sparks, Walk ye in the light of your fire, And in the sparks ye have caused to burn, From my hand hath this been to you, In grief ye lie down!";
dby[11] = "Behold, all ye that kindle a fire, that compass yourselves about with sparks: walk in the light of your fire, and among the sparks [that] ye have kindled. This shall ye have of my hand: ye shall lie down in sorrow.";
web[11] = "Behold, all ye that kindle a fire, that encompass [yourselves] with sparks: walk in the light of your fire, and in the sparks [that] ye have kindled. This shall ye have of my hand; ye shall lie down in sorrow.";
hnv[11] = "Behold, all you who kindle a fire, who gird yourselves about with firebrands; walk you in the flame of your fire, and among the brands that you have kindled. This shall you have of my hand; you shall lie down in sorrow.";
vul[11] = "ecce omnes vos accendentes ignem accincti flammis ambulate in lumine ignis vestri et in flammis quas succendistis de manu mea factum est hoc vobis in doloribus dormietis";
