csb[1] = "Note this: The Lord GOD of Armies is about to remove from Jerusalem and from Judah every kind of security: the entire supply of bread and water,";
csb[2] = "heroes and warriors, judges and prophets, fortune-tellers and elders,";
csb[3] = "commanders of fifty and dignitaries, counselors, cunning magicians, and necromancers.";
csb[4] = "&quot;I will make youths their leaders, and unstable rulers will govern them.&quot;";
csb[5] = "The people will oppress one another, man against man, neighbor against neighbor; the young will act arrogantly toward the old, and the worthless toward the honorable.";
csb[6] = "A man will even seize his brother in his father\'s house, saying: &quot;You have a cloak -- you be our leader! This heap of rubble will be under your control.&quot;";
csb[7] = "On that day he will cry out, saying: &quot;I\'m not a healer. I don\'t even have food or clothing in my house. Don\'t make me the leader of the people! &quot;";
csb[8] = "For Jerusalem has stumbled and Judah has fallen because they have spoken and acted against the LORD, defying his glorious presence.";
csb[9] = "The look on their faces testifies against them, and like Sodom, they flaunt their sin; they do not conceal it. Woe to them, for they have brought disaster on themselves.";
csb[10] = "Tell the righteous that it will go well for them, for they will eat the fruit of their labor.";
csb[11] = "Woe to the wicked -- it will go badly for them, for what they have done will be done to them.";
csb[12] = "Youths oppress my people, and women rule over them. My people, your leaders mislead you; they confuse the direction of your paths.";
csb[13] = "The LORD rises to argue the case and stands to judge the people.";
csb[14] = "The LORD brings this charge against the elders and leaders of his people: &quot;You have devastated the vineyard. The plunder from the poor is in your houses.";
csb[15] = "&quot;Why do you crush my people and grind the faces of the poor? &quot; This is the declaration of the Lord GOD of Armies.";
csb[16] = "The LORD also says: Because the daughters of Zion are haughty, walking with heads held high and seductive eyes, prancing along, jingling their ankle bracelets,";
csb[17] = "the Lord will put scabs on the heads of the daughters of Zion, and the LORD will shave their foreheads bare.";
csb[18] = "On that day the Lord will strip their finery: ankle bracelets, headbands, crescents,";
csb[19] = "pendants, bracelets, veils,";
csb[20] = "headdresses, ankle jewelry, sashes, perfume bottles, amulets,";
csb[21] = "signet rings, nose rings,";
csb[22] = "festive robes, capes, cloaks, purses,";
csb[23] = "garments, linen clothes, turbans, and shawls.";
csb[24] = "Instead of perfume there will be a stench; instead of a belt, a rope; instead of beautifully styled hair, baldness; instead of fine clothes, sackcloth; instead of beauty, branding.";
csb[25] = "Your men will fall by the sword, your warriors in battle.";
csb[26] = "Then her gates will lament and mourn; deserted, she will sit on the ground.";

kjv[24] = "And it shall come to pass, [that] instead of sweet smell there shall be stink; and instead of a girdle a rent; and instead of well set hair baldness; and instead of a stomacher a girding of sackcloth; [and] burning instead of beauty.";
rsv[24] = "Instead of perfume there will be rottenness; and instead of a girdle, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth; instead of beauty, shame.";
asv[24] = "And it shall come to pass, that instead of sweet spices there shall be rottenness; and instead of a girdle, a rope; and instead of well set hair, baldness; and instead of a robe, a girding of sackcloth; branding instead of beauty.";
yng[24] = "And it hath been, instead of spice is muck, And instead of a girdle, a rope, And instead of curled work, baldness, And instead of a stomacher a girdle of sackcloth.";
dby[24] = "And it shall come to pass, instead of perfume there shall be rottenness; and instead of a girdle, a rope; and instead of well-set hair, baldness; and instead of a robe of display, a girding of sackcloth; brand instead of beauty.";
web[24] = "And it shall come to pass, [that] instead of sweet smell there shall be an offensive odor; and instead of a girdle a rent; and instead of well set hair baldness; and instead of a stomacher a girding of sackcloth; [and] burning instead of beauty.";
hnv[24] = "It shall happen that instead of sweet spices, there shall be rottenness; Instead of a belt, a rope; Instead of well set hair, baldness; Instead of a robe, a girding of sackcloth; And branding instead of beauty.";
vul[24] = "et erit pro suavi odore fetor et pro zona funiculus et pro crispanti crine calvitium et pro fascia pectorali cilicium";
