csb[1] = "In the fourteenth year of King Hezekiah, King Sennacherib of Assyria attacked all the fortified cities of Judah and captured them.";
csb[2] = "Then the king of Assyria sent his royal spokesman, along with a massive army, from Lachish to King Hezekiah at Jerusalem. The Assyrian stood near the conduit of the upper pool, by the road to the Launderer\'s Field.";
csb[3] = "Eliakim son of Hilkiah, who was in charge of the palace, Shebna the court secretary, and Joah son of Asaph, the court historian, came out to him.";
csb[4] = "The royal spokesman said to them, &quot;Tell Hezekiah: The great king, the king of Assyria, says this: What are you relying on?";
csb[5] = "&quot;You think mere words are strategy and strength for war. Who are you now relying on that you have rebelled against me?";
csb[6] = "&quot;Look, you are relying on Egypt, that splintered reed of a staff that will pierce the hand of anyone who grabs it and leans on it. This is how Pharaoh king of Egypt is to all who rely on him.";
csb[7] = "&quot;Suppose you say to me, \'We rely on the LORD our God.\' Isn\'t he the one whose high places and altars Hezekiah has removed, saying to Judah and Jerusalem, \'You are to worship at this altar\'?";
csb[8] = "&quot;Now make a deal with my master, the king of Assyria. I\'ll give you two thousand horses if you\'re able to supply riders for them!";
csb[9] = "&quot;How then can you drive back a single officer among the least of my master\'s servants? How can you rely on Egypt for chariots and horsemen?";
csb[10] = "&quot;Have I attacked this land to destroy it without the LORD\'s approval? The LORD said to me, \'Attack this land and destroy it.\' &quot;";
csb[11] = "Then Eliakim, Shebna, and Joah said to the royal spokesman, &quot;Please speak to your servants in Aramaic, since we understand it. Don\'t speak to us in Hebrew within earshot of the people who are on the wall.&quot;";
csb[12] = "But the royal spokesman replied, &quot;Has my master sent me to speak these words to your master and to you, and not to the men who are sitting on the wall, who are destined with you to eat their own excrement and drink their own urine? &quot;";
csb[13] = "Then the royal spokesman stood and called out loudly in Hebrew: Listen to the words of the great king, the king of Assyria!";
csb[14] = "This is what the king says: &quot;Don\'t let Hezekiah deceive you, for he cannot rescue you.";
csb[15] = "&quot;Don\'t let Hezekiah persuade you to rely on the LORD, saying, \'The LORD will certainly rescue us! This city will not be handed over to the king of Assyria.\' &quot;";
csb[16] = "Don\'t listen to Hezekiah, for this is what the king of Assyria says: &quot;Make peace with me and surrender to me. Then every one of you may eat from his own vine and his own fig tree and drink water from his own cistern";
csb[17] = "&quot;until I come and take you away to a land like your own land -- a land of grain and new wine, a land of bread and vineyards.";
csb[18] = "&quot;Beware that Hezekiah does not mislead you by saying, \'The LORD will rescue us.\' Has any one of the gods of the nations rescued his land from the power of the king of Assyria?";
csb[19] = "&quot;Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? Have they rescued Samaria from my power?";
csb[20] = "&quot;Who among all the gods of these lands ever rescued his land from my power? So will the LORD rescue Jerusalem from my power? &quot;";
csb[21] = "But they kept silent; they didn\'t say anything, for the king\'s command was, &quot;Don\'t answer him.&quot;";
csb[22] = "Then Eliakim son of Hilkiah, who was in charge of the palace, Shebna the court secretary, and Joah son of Asaph, the court historian, came to Hezekiah with their clothes torn and reported to him the words of the royal spokesman.";
kjv[1] = "Now it came to pass in the fourteenth year of king Hezekiah, [that] Sennacherib king of Assyria came up against all the defenced cities of Judah, and took them.";
rsv[1] = "In the fourteenth year of King Hezeki\'ah, Sennach\'erib king of Assyria came up against all the fortified cities of Judah and took them.";
asv[1] = "Now it came to pass in the fourteenth year of king Hezekiah, that Sennacherib king of Assyria came up against all the fortified cities of Judah, and took them.";
yng[1] = "And it cometh to pass, in the fourteenth year of king Hezekiah, come up hath Sennacherib king of Asshur against all the fenced cities of Judah, and seizeth them.";
dby[1] = "And it came to pass in the fourteenth year of king Hezekiah, that Sennacherib king of Assyria came up against all the fortified cities of Judah, and took them.";
web[1] = "Now it came to pass in the fourteenth year of king Hezekiah, [that] Sennacherib king of Assyria came up against all the fortified cities of Judah, and took them.";
hnv[1] = "Now it happened in the fourteenth year of king Hizkiyahu, that Sancheriv king of Ashshur came up against all the fortified cities of Yehudah, and took them.";
vul[1] = "et factum est in quartodecimo anno regis Ezechiae ascendit Sennacherib rex Assyriorum super omnes civitates Iuda munitas et cepit eas";
kjv[2] = "And the king of Assyria sent Rabshakeh from Lachish to Jerusalem unto king Hezekiah with a great army. And he stood by the conduit of the upper pool in the highway of the fuller\'s field.";
rsv[2] = "And the king of Assyria sent the Rab\'shakeh from Lachish to King Hezeki\'ah at Jerusalem, with a great army. And he stood by the conduit of the upper pool on the highway to the Fuller\'s Field.";
asv[2] = "And the king of Assyria sent Rabshakeh from Lachish to Jerusalem unto king Hezekiah with a great army. And he stood by the conduit of the upper pool in the highway of the fuller\'s field.";
yng[2] = "And the king of Asshur sendeth Rabshakeh from Lachish to Jerusalem, unto the king Hezekiah, with a heavy force, and he standeth by the conduit of the upper pool, in the highway of the fuller\'s field,";
dby[2] = "And the king of Assyria sent Rab-shakeh from Lachish to Jerusalem, to king Hezekiah, with a strong force. And he stood by the aqueduct of the upper pool, on the highway of the fuller\'s field.";
web[2] = "And the king of Assyria sent Rabshakeh from Lachish to Jerusalem against king Hezekiah with a great army. And he stood by the conduit of the upper pool in the highway of the fuller\'s field.";
hnv[2] = "The king of Ashshur sent Ravshakeh from Lakhish to Yerushalayim to king Hizkiyahu with a great army. He stood by the conduit of the upper pool in the highway of the fuller\'s field.";
vul[2] = "et misit rex Assyriorum Rabsacen de Lachis in Hierusalem ad regem Ezechiam in manu gravi et stetit in aquaeductu piscinae superioris in via agri Fullonis";
kjv[3] = "Then came forth unto him Eliakim, Hilkiah\'s son, which was over the house, and Shebna the scribe, and Joah, Asaph\'s son, the recorder.";
rsv[3] = "And there came out to him Eli\'akim the son of Hilki\'ah, who was over the household, and Shebna the secretary, and Jo\'ah the son of Asaph, the recorder.";
asv[3] = "Then came forth unto him Eliakim the son of Hilkiah, who was over the household, and Shebna the scribe, and Joah, the son of Asaph, the recorder.";
yng[3] = "and go forth unto him doth Eliakim son of Hilkiah, who [is] over the house, and Shebna the scribe, and Joah son of Asaph, the remembrancer.";
dby[3] = "Then came forth to him Eliakim the son of Hilkijah, who was over the household, and Shebna the scribe, and Joah the son of Asaph, the chronicler.";
web[3] = "Then came forth to him Eliakim, Hilkiah\'s son, who was over the house, and Shebna the scribe, and Joah, Asaph\'s son, the recorder.";
hnv[3] = "Then came forth to him Elyakim the son of Hilkiyah, who was over the household, and Shevna the Sofer, and Yo\'ach, the son of Asaf, the recorder.";
vul[3] = "et egressus est ad eum Eliachim filius Helciae qui erat super domum et Sobna scriba et Ioae filius Asaph a commentariis";
kjv[4] = "And Rabshakeh said unto them, Say ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence [is] this wherein thou trustest?";
rsv[4] = "And the Rab\'shakeh said to them, &quot;Say to Hezeki\'ah, \'Thus says the great king, the king of Assyria: On what do you rest this confidence of yours?";
asv[4] = "And Rabshakeh said unto them, Say ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?";
yng[4] = "And Rabshakeh saith unto them, `Say ye, I pray you, unto Hezekiah, `Thus said the great king, the king of Asshur, What [is] this confidence in which thou hast confided?";
dby[4] = "And Rab-shakeh said to them, Say now to Hezekiah, Thus says the great king, the king of Assyria: What confidence is this in which thou trustest?";
web[4] = "And Rabshakeh said to them, Say ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence [is] this in which thou trustest?";
hnv[4] = "Ravshakeh said to them, Say you now to Hizkiyahu, Thus says the great king, the king of Ashshur, What confidence is this in which you trust?";
vul[4] = "et dixit ad eos Rabsaces dicite Ezechiae haec dicit rex magnus rex Assyriorum quae est ista fiducia qua confidis";
kjv[5] = "I say, [sayest thou], (but [they are but] vain words) [I have] counsel and strength for war: now on whom dost thou trust, that thou rebellest against me?";
rsv[5] = "Do you think that mere words are strategy and power for war? On whom do you now rely, that you have rebelled against me?";
asv[5] = "I say, [thy] counsel and strength for the war are but vain words: now on whom dost thou trust, that thou hast rebelled against me?";
yng[5] = "I have said: Only, a word of the lips! counsel and might [are] for battle: now, on whom hast thou trusted, that thou hast rebelled against me?";
dby[5] = "Thou sayest, but it is a word of the lips, [There is] counsel and strength for war. Now on whom dost thou rely, that thou hast revolted against me?";
web[5] = "I say, [sayest thou] (but [they are but] vain words) [I have] counsel and strength for war: now on whom dost thou trust, that thou rebellest against me?";
hnv[5] = "I say, [your] counsel and strength for the war are but vain words: now on whom do you trust, that you have rebelled against me?";
vul[5] = "aut quo consilio vel fortitudine rebellare disponis super quem habes fiduciam quia recessisti a me";
kjv[6] = "Lo, thou trustest in the staff of this broken reed, on Egypt; whereon if a man lean, it will go into his hand, and pierce it: so [is] Pharaoh king of Egypt to all that trust in him.";
rsv[6] = "Behold, you are relying on Egypt, that broken reed of a staff, which will pierce the hand of any man who leans on it. Such is Pharaoh king of Egypt to all who rely on him.";
asv[6] = "Behold, thou trustest upon the staff of this bruised reed, even upon Egypt, whereon if a man lean, it will go into his hand, and pierce it: so is Pharaoh king of Egypt to all that trust on him.";
yng[6] = "`Lo, thou hast trusted on the staff of this broken reed -- on Egypt -- which a man leaneth on, and it hath gone into his hand, and pierced it -- so [is] Pharaoh king of Egypt to all those trusting on him.";
dby[6] = "Behold, thou reliest upon the staff of that broken reed, upon Egypt, on which if a man lean, it goes into his hand, and pierces it: so is Pharaoh king of Egypt to all that rely upon him.";
web[6] = "Lo, thou trustest in the staff of this broken reed, on Egypt; on which if a man lean, it will enter his hand, and pierce it: so [is] Pharaoh king of Egypt to all that trust in him.";
hnv[6] = "Behold, you trust on the staff of this bruised reed, even on Mitzrayim, whereon if a man lean, it will go into his hand, and pierce it: so is Par`oh king of Mitzrayim to all who trust on him.";
vul[6] = "ecce confidis super baculum harundineum confractum istum super Aegyptum cui si innisus fuerit homo intrabit in manu eius et perforabit eam sic Pharao rex Aegypti omnibus qui confidunt in eo";
kjv[7] = "But if thou say to me, We trust in the LORD our God: [is it] not he, whose high places and whose altars Hezekiah hath taken away, and said to Judah and to Jerusalem, Ye shall worship before this altar?";
rsv[7] = "But if you say to me, &quot;We rely on the LORD our God,&quot; is it not he whose high places and altars Hezeki\'ah has removed, saying to Judah and to Jerusalem, &quot;You shall worship before this altar&quot;?";
asv[7] = "But if thou say unto me, We trust in Jehovah our God: is not that he, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and to Jerusalem, Ye shall worship before this altar?";
yng[7] = "`And dost thou say unto me, Unto Jehovah our God we have trusted? is it not He, whose high places and whose altars Hezekiah hath turned aside, and saith to Judah and to Jerusalem, Before this altar ye do bow yourselves?";
dby[7] = "And if thou say to me, We rely upon Jehovah our God: is it not he, whose high places and whose altars Hezekiah has removed, saying to Judah and Jerusalem, Ye shall worship before this altar?";
web[7] = "But if thou shalt say to me, We trust in the LORD our God: [is it] not he, whose high places and whose altars Hezekiah hath taken away, and said to Judah and to Jerusalem, Ye shall worship before this altar?";
hnv[7] = "But if you tell me, We trust in the LORD our God: isn\'t that he, whose high places and whose altars Hizkiyahu has taken away, and has said to Yehudah and to Yerushalayim, You shall worship before this altar?";
vul[7] = "quod si responderis mihi in Domino Deo nostro confidimus nonne ipse est cuius abstulit Ezechias excelsa et altaria et dixit Iudae et Hierusalem coram altari isto adorabitis";
kjv[8] = "Now therefore give pledges, I pray thee, to my master the king of Assyria, and I will give thee two thousand horses, if thou be able on thy part to set riders upon them.";
rsv[8] = "Come now, make a wager with my master the king of Assyria: I will give you two thousand horses, if you are able on your part to set riders upon them.";
asv[8] = "Now therefore, I pray thee, give pledges to my master the king of Assyria, and I will give thee two thousand horses, if thou be able on thy part to set riders upon them.";
yng[8] = "`And now, negotiate, I pray thee, with my lord the king of Asshur, and I give to thee two thousand horses, if thou art able to put for thee riders on them.";
dby[8] = "And now engage, I pray thee, with my master the king of Assyria, and I will give thee two thousand horses, if thou be able on thy part to set riders upon them.";
web[8] = "Now therefore give pledges, I pray thee, to my master the king of Assyria, and I will give thee two thousand horses, if thou canst on thy part set riders upon them.";
hnv[8] = "Now therefore, please give pledges to my master the king of Ashshur, and I will give you two thousand horses, if you are able on your part to set riders on them.";
vul[8] = "et nunc trade te domino meo regi Assyriorum et dabo tibi duo milia equorum nec poteris ex te praebere ascensores eorum";
kjv[9] = "How then wilt thou turn away the face of one captain of the least of my master\'s servants, and put thy trust on Egypt for chariots and for horsemen?";
rsv[9] = "How then can you repulse a single captain among the least of my master\'s servants, when you rely on Egypt for chariots and for horsemen?";
asv[9] = "How then canst thou turn away the face of one captain of the least of my master\'s servants, and put thy trust on Egypt for chariots and for horsemen?";
yng[9] = "And how dost thou turn back the face of one captain of the least of the servants of my lord, and dost trust for thee on Egypt, for chariot and for horsemen?";
dby[9] = "How then wilt thou turn away the face of one captain of the least of my master\'s servants? And thou reliest upon Egypt for chariots and for horsemen!";
web[9] = "How then wilt thou turn away the face of one captain of the least of my master\'s servants, and put thy trust on Egypt for chariots and for horsemen?";
hnv[9] = "How then can you turn away the face of one captain of the least of my master\'s servants, and put your trust on Mitzrayim for chariots and for horsemen?";
vul[9] = "et quomodo sustinebis faciem iudicis unius loci ex servis domini mei minoribus quod si confidis in Aegypto in quadriga et in equitibus";
kjv[10] = "And am I now come up without the LORD against this land to destroy it? the LORD said unto me, Go up against this land, and destroy it.";
rsv[10] = "Moreover, is it without the LORD that I have come up against this land to destroy it? The LORD said to me, Go up against this land, and destroy it.\'&quot;";
asv[10] = "And am I now come up without Jehovah against this land to destroy it? Jehovah said unto me, Go up against this land, and destroy it.";
yng[10] = "And now, without Jehovah have I come up against this land to destroy it? Jehovah said unto me, Go up unto this land, and thou hast destroyed it.\'";
dby[10] = "And now am I come up without Jehovah against this land to destroy it? Jehovah said to me, Go up against this land and destroy it.";
web[10] = "And am I now come up without the LORD against this land to destroy it? the LORD said to me, Go up against this land, and destroy it.";
hnv[10] = "Am I now come up without the LORD against this land to destroy it? the LORD said to me, Go up against this land, and destroy it.";
vul[10] = "et nunc numquid sine Domino ascendi ad terram istam ut disperderem eam Dominus dixit ad me ascende super terram istam et disperde eam";
kjv[11] = "Then said Eliakim and Shebna and Joah unto Rabshakeh, Speak, I pray thee, unto thy servants in the Syrian language; for we understand [it]: and speak not to us in the Jews\' language, in the ears of the people that [are] on the wall.";
rsv[11] = "Then Eli\'akim, Shebna, and Jo\'ah said to the Rab\'shakeh, &quot;Pray, speak to your servants in Aramaic, for we understand it; do not speak to us in the language of Judah within the hearing of the people who are on the wall.&quot;";
asv[11] = "Then said Eliakim and Shebna and Joah unto Rabshakeh, Speak, I pray thee, unto thy servants in the Syrian language; for we understand it: and speak not to us in the Jews\' language, in the ears of the people that are on the wall.";
yng[11] = "And Eliakim saith -- and Shebna and Joah -- unto Rabshakeh, `Speak, we pray thee, unto thy servants [in] Aramaean, for we are understanding; and do not speak unto us [in] Jewish, in the ears of the people who [are] on the wall.\'";
dby[11] = "And Eliakim and Shebna and Joah said to Rab-shakeh, Speak, we pray thee, to thy servants in Syriac, for we understand it; and speak not to us in the Jewish [language] in the ears of the people that are upon the wall.";
web[11] = "Then said Eliakim and Shebna and Joah to Rabshakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand [it]: and speak not to us in the Jew\'s language, in the ears of the people that [are] on the wall.";
hnv[11] = "Then said Elyakim and Shevna and Yo\'ach to Ravshakeh, Please speak, to your servants in the Arammian language; for we understand it: and don\'t speak to us in the Yehudim\' language, in the ears of the people who are on the wall.";
vul[11] = "et dixit Eliachim et Sobna et Ioae ad Rabsacen loquere ad servos tuos syra lingua intellegimus enim ne loquaris ad nos iudaice in auribus populi qui est super murum";
kjv[12] = "But Rabshakeh said, Hath my master sent me to thy master and to thee to speak these words? [hath he] not [sent me] to the men that sit upon the wall, that they may eat their own dung, and drink their own piss with you?";
rsv[12] = "But the Rab\'shakeh said, &quot;Has my master sent me to speak these words to your master and to you, and not to the men sitting on the wall, who are doomed with you to eat their own dung and drink their own urine?&quot;";
asv[12] = "But Rabshakeh said, Hath my master sent me to thy master, and to thee, to speak these words? [hath he] not [sent me] to the men that sit upon the wall, to eat their own dung, and to drink their own water with you?";
yng[12] = "And Rabshakeh saith, `Unto thy lord, and unto thee, hath my lord sent me to speak these words? is it not for the men -- those sitting on the wall to eat their own dung and to drink their own water with you?\'";
dby[12] = "And Rab-shakeh said, Is it to thy master and to thee that my master sent me to speak these words? Is it not to the men that sit on the wall, that they may eat their own dung, and drink their own urine with you?";
web[12] = "But Rabshakeh said, Hath my master sent me to thy master and to thee to speak these words? [hath he] not [sent me] to the men that sit upon the wall, that they may devour their vilest excretions with you?";
hnv[12] = "But Ravshakeh said, Has my master sent me to your master, and to you, to speak these words? [has he] not [sent me] to the men who sit on the wall, to eat their own dung, and to drink their own water with you?";
vul[12] = "et dixit ad eos Rabsaces numquid ad dominum tuum et ad te misit me dominus meus ut loquerer omnia verba ista et non potius ad viros qui sedent in muro ut comedant stercora sua et bibant urinam pedum suorum vobiscum";
kjv[13] = "Then Rabshakeh stood, and cried with a loud voice in the Jews\' language, and said, Hear ye the words of the great king, the king of Assyria.";
rsv[13] = "Then the Rab\'shakeh stood and called out in a loud voice in the language of Judah: &quot;Hear the words of the great king, the king of Assyria!";
asv[13] = "Then Rabshakeh stood, and cried with a loud voice in the Jews\' language, and said, Hear ye the words of the great king, the king of Assyria.";
yng[13] = "And Rabshakeh standeth and calleth with a great voice [in] Jewish, and saith, `Hear ye the words of the great king, the king of Asshur:";
dby[13] = "And Rab-shakeh stood and cried with a loud voice in the Jewish [language], and said, Hear the words of the great king, the king of Assyria!";
web[13] = "Then Rabshakeh stood, and cried with a loud voice in the Jew\'s language, and said, Hear ye the words of the great king, the king of Assyria.";
hnv[13] = "Then Ravshakeh stood, and cried with a loud voice in the Yehudim\' language, and said, Hear you the words of the great king, the king of Ashshur.";
vul[13] = "et stetit Rabsaces et clamavit voce magna iudaice et dixit audite verba regis magni regis Assyriorum";
kjv[14] = "Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you.";
rsv[14] = "Thus says the king: \'Do not let Hezeki\'ah deceive you, for he will not be able to deliver you.";
asv[14] = "Thus saith the king, Let not Hezekiah deceive you; for he will not be able to deliver you:";
yng[14] = "Thus said the king, Let not Hezekiah lift you up, for he is not able to deliver you;";
dby[14] = "Thus says the king: Let not Hezekiah deceive you; for he will not be able to deliver you.";
web[14] = "Thus saith the king, Let not Hezekiah deceive you: for he will not be able to deliver you.";
hnv[14] = "Thus says the king, Don\'t let Hizkiyahu deceive you; for he will not be able to deliver you:";
vul[14] = "haec dicit rex non seducat vos Ezechias quia non poterit eruere vos";
kjv[15] = "Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us: this city shall not be delivered into the hand of the king of Assyria.";
rsv[15] = "Do not let Hezeki\'ah make you rely on the LORD by saying, &quot;The LORD will surely deliver us; this city will not be given into the hand of the king of Assyria.&quot;";
asv[15] = "neither let Hezekiah make you trust in Jehovah, saying, Jehovah will surely deliver us; this city shall not be given into the hand of the king of Assyria.";
yng[15] = "and let not Hezekiah make you trust unto Jehovah, saying, Jehovah doth certainly deliver us, this city is not given into the hand of the king of Asshur.";
dby[15] = "Neither let Hezekiah make you rely upon Jehovah, saying, Jehovah will certainly deliver us; this city shall not be given into the hand of the king of Assyria.";
web[15] = "Neither let Hezekiah make you trust in the LORD, saying, the LORD will surely deliver us: this city shall not be delivered into the hand of the king of Assyria.";
hnv[15] = "neither let Hizkiyahu make you trust in the LORD, saying, the LORD will surely deliver us; this city shall not be given into the hand of the king of Ashshur.";
vul[15] = "et non vobis tribuat fiduciam Ezechias super Domino dicens eruens liberabit nos Dominus non dabitur civitas ista in manu regis Assyriorum";
kjv[16] = "Hearken not to Hezekiah: for thus saith the king of Assyria, Make [an agreement] with me [by] a present, and come out to me: and eat ye every one of his vine, and every one of his fig tree, and drink ye every one the waters of his own cistern;";
rsv[16] = "Do not listen to Hezeki\'ah; for thus says the king of Assyria: Make your peace with me and come out to me; then every one of you will eat of his own vine, and every one of his own fig tree, and every one of you will drink the water of his own cistern;";
asv[16] = "Hearken not to Hezekiah: for thus saith the king of Assyria, Make your peace with me, and come out to me; and eat ye every one of his vine, and every one of his fig-tree, and drink ye every one the waters of his own cistern;";
yng[16] = "`Do not hearken unto Hezekiah, for thus said the king of Asshur, Make ye with me a blessing, and come out unto me, and eat ye each of his vine, and each of his fig-tree, and drink ye each the waters of his own well,";
dby[16] = "Hearken not to Hezekiah; for thus says the king of Assyria: Make peace with me and come out to me; and eat every one of his vine, and every one of his fig-tree, and drink every one the waters of his own cistern;";
web[16] = "Hearken not to Hezekiah: for thus saith the king of Assyria, Make [an agreement] with me [by] a present, and come out to me: and eat ye every one of his vine, and every one of his fig-tree, and drink ye every one the waters of his own cistern;";
