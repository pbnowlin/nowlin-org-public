csb[1] = "A pronouncement concerning Tyre: Wail, ships of Tarshish, for your haven has been destroyed. Word has reached them from the land of Cyprus.";
csb[2] = "Mourn, inhabitants of the coastland, you merchants of Sidon; your agents have crossed the sea";
csb[3] = "over deep water. Tyre\'s revenue was the grain from Shihor -- the harvest of the Nile. She was the merchant among the nations.";
csb[4] = "Be ashamed, Sidon, the stronghold of the sea, for the sea has spoken: &quot;I have not been in labor or given birth. I have not raised young men or brought up young women.&quot;";
csb[5] = "When the news reaches Egypt, they will be in anguish over the news about Tyre.";
csb[6] = "Cross over to Tarshish; wail, inhabitants of the coastland!";
csb[7] = "Is this your jubilant city, whose origin was in ancient times, whose feet have taken her to reside far away?";
csb[8] = "Who planned this against Tyre, the bestower of crowns, whose traders are princes, whose merchants are the honored ones of the earth?";
csb[9] = "The LORD of Armies planned it, to desecrate all its glorious beauty, to disgrace all the honored ones of the earth.";
csb[10] = "Overflow your land like the Nile, daughter of Tarshish; there is no longer anything to restrain you.";
csb[11] = "He stretched out his hand over the sea; he made kingdoms tremble. The LORD has commanded that the Canaanite fortresses be destroyed.";
csb[12] = "He said, &quot;You will not celebrate anymore, ravished young woman, daughter of Sidon. Get up and cross over to Cyprus -- even there you will have no rest! &quot;";
csb[13] = "Look at the land of the Chaldeans -- a people who no longer exist. Assyria destined it for desert creatures. They set up their siege towers and stripped its palaces. They made it a ruin.";
csb[14] = "Wail, ships of Tarshish, because your fortress is destroyed!";
csb[15] = "On that day Tyre will be forgotten for seventy years -- the life span of one king. At the end of seventy years, what the song says about the prostitute will happen to Tyre:";
csb[16] = "Pick up your lyre, stroll through the city, you forgotten prostitute. Play skillfully, sing many a song so that you will be remembered.";
csb[17] = "And at the end of the seventy years, the LORD will restore Tyre and she will go back into business, prostituting herself with all the kingdoms of the world throughout the earth.";
csb[18] = "But her profits and wages will be dedicated to the LORD. They will not be stored or saved, for her profit will go to those who live in the LORD\'s presence, to provide them with ample food and sacred clothing.";
kjv[1] = "The burden of Tyre. Howl, ye ships of Tarshish; for it is laid waste, so that there is no house, no entering in: from the land of Chittim it is revealed to them.";
rsv[1] = "The oracle concerning Tyre. Wail, O ships of Tarshish, for Tyre is laid waste, without house or haven! From the land of Cyprus it is revealed to them.";
asv[1] = "The burden of Tyre. Howl, ye ships of Tarshish; for it is laid waste, so that there is no house, no entering in: from the land of Kittim it is revealed to them.";
yng[1] = "The Burden of Tyre. Howl, ye ships of Tarshish, For it hath been destroyed, Without house, without entrance, From the land of Chittim it was revealed to them.";
dby[1] = "The burden of Tyre. Howl, ye ships of Tarshish! for it is laid waste, so that there is no house, none entering in. From the land of Chittim it is revealed to them.";
web[1] = "The burden of Tyre. Howl, ye ships of Tarshish; for it is laid waste, so that there is no house, no entering in: from the land of Chittim it is revealed to them.";
hnv[1] = "The burden of Tzor. Howl, you ships of Tarshish; for it is laid waste, so that there is no house, no entering in: from the land of Kittim it is revealed to them.";
vul[1] = "onus Tyri ululate naves maris quia vastata est domus unde venire consueverant de terra Cetthim revelatum est eis";

asv[2] = "Be still, ye inhabitants of the coast, thou whom the merchants of Sidon, that pass over the sea, have replenished.";
yng[2] = "Be silent, ye inhabitants of the isle, Trader of Zidon, passing the sea, they filled thee.";
dby[2] = "Be still, ye inhabitants of the isle! The merchants of Sidon, that pass over the sea, have replenished thee.";

rsv[3] = "and were on many waters; your revenue was the grain of Shihor, the harvest of the Nile; you were the merchant of the nations.";

rsv[4] = "Be ashamed, O Sidon, for the sea has spoken, the stronghold of the sea, saying: &quot;I have neither travailed nor given birth, I have neither reared young men nor brought up virgins.&quot;";

kjv[7] = "[Is] this your joyous [city], whose antiquity [is] of ancient days? her own feet shall carry her afar off to sojourn.";

yng[9] = "Jehovah of Hosts hath counselled it, To pollute the excellency of all beauty, To make light all the honoured of earth.";

kjv[11] = "He stretched out his hand over the sea, he shook the kingdoms: the LORD hath given a commandment against the merchant [city], to destroy the strong holds thereof.";
rsv[11] = "He has stretched out his hand over the sea, he has shaken the kingdoms; the LORD has given command concerning Canaan to destroy its strongholds.";
asv[11] = "He hath stretched out his hand over the sea, he hath shaken the kingdoms: Jehovah hath given commandment concerning Canaan, to destroy the strongholds thereof.";
yng[11] = "His hand He hath stretched out over the sea, He hath caused kingdoms to tremble, Jehovah hath charged concerning the merchant one, To destroy her strong places.";

kjv[12] = "And he said, Thou shalt no more rejoice, O thou oppressed virgin, daughter of Zidon: arise, pass over to Chittim; there also shalt thou have no rest.";

asv[12] = "And he said, Thou shalt no more rejoice, O thou oppressed virgin daughter of Sidon: arise, pass over to Kittim; even there shalt thou have no rest.";
yng[12] = "And He saith, `Thou dost not add any more to exult, O oppressed one, virgin daughter of Zidon, To Chittim arise, pass over, Even there -- there is no rest for thee.\'";

kjv[13] = "Behold the land of the Chaldeans; this people was not, [till] the Assyrian founded it for them that dwell in the wilderness: they set up the towers thereof, they raised up the palaces thereof; [and] he brought it to ruin.";
rsv[13] = "Behold the land of the Chalde\'ans! This is the people; it was not Assyria. They destined Tyre for wild beasts. They erected their siegetowers, they razed her palaces, they made her a ruin.";
asv[13] = "Behold, the land of the Chaldeans: this people was not; the Assyrian founded it for them that dwell in the wilderness; they set up their towers; they overthrew the palaces thereof; they made it a ruin.";
yng[13] = "Lo, the land of the Chaldeans -- this people was not, Asshur founded it for the Ziim, They raised its watch-towers, They lifted up her palaces, -- He hath appointed her for a ruin!";
dby[13] = "Behold the land of the Chaldeans: this people did not exist; the Assyrian founded it for the dwellers in the desert: they set up their towers, they destroyed the palaces thereof; he brought it to ruin.";

hnv[13] = "Behold, the land of the Kasdim: this people was not; the Ashshur founded it for those who dwell in the wilderness; they set up their towers; they overthrew the palaces of it; they made it a ruin.";

kjv[15] = "And it shall come to pass in that day, that Tyre shall be forgotten seventy years, according to the days of one king: after the end of seventy years shall Tyre sing as an harlot.";

yng[15] = "And it hath come to pass, in that day, That forgotten is Tyre seventy years, According to the days of one king. At the end of seventy years there is to Tyre as the song of the harlot.";
dby[15] = "And it shall come to pass in that day, that Tyre shall be forgotten seventy years, according to the days of one king. At the end of seventy years it shall be for Tyre as the harlot\'s song.";

kjv[16] = "Take an harp, go about the city, thou harlot that hast been forgotten; make sweet melody, sing many songs, that thou mayest be remembered.";

dby[16] = "Take a harp, go about the city, thou forgotten harlot! Make sweet melody, sing many songs, that thou mayest be remembered.";
web[16] = "Take a harp, go about the city, thou harlot that hast been forgotten; make sweet melody, sing many songs, that thou mayest be remembered.";
hnv[16] = "Take a harp, go about the city, you prostitute that has been forgotten; make sweet melody, sing many songs, that you may be remembered.";

asv[17] = "And it shall come to pass after the end of seventy years, that Jehovah will visit Tyre, and she shall return to her hire, and shall play the harlot with all the kingdoms of the world upon the face of the earth.";
yng[17] = "And it hath come to pass, At the end of seventy years Jehovah inspecteth Tyre, And she hath repented of her gift, That she committed fornication With all kingdoms of the earth on the face of the ground.";
dby[17] = "And it shall come to pass at the end of seventy years, that Jehovah will visit Tyre; and she will return to her hire, and will commit fornication with all the kingdoms of the earth upon the face of the ground.";
web[17] = "And it shall come to pass after the end of seventy years, that the LORD will visit Tyre, and she shall turn to her hire, and shall commit fornication with all the kingdoms of the world upon the face of the earth.";
hnv[17] = "It shall happen after the end of seventy years, that the LORD will visit Tzor, and she shall return to her hire, and shall play the prostitute with all the kingdoms of the world on the surface of the eretz.";

kjv[18] = "And her merchandise and her hire shall be holiness to the LORD: it shall not be treasured nor laid up; for her merchandise shall be for them that dwell before the LORD, to eat sufficiently, and for durable clothing.";
rsv[18] = "Her merchandise and her hire will be dedicated to the LORD; it will not be stored or hoarded, but her merchandise will supply abundant food and fine clothing for those who dwell before the LORD.";
asv[18] = "And her merchandise and her hire shall be holiness to Jehovah: it shall not be treasured nor laid up; for her merchandise shall be for them that dwell before Jehovah, to eat sufficiently, and for durable clothing.";
yng[18] = "And her merchandise and her gift have been holy to Jehovah, Not treasured up nor stored, For to those sitting before Jehovah is her merchandise, To eat to satiety, and for a lasting covering!";
dby[18] = "And her merchandise and her hire shall be holy to Jehovah: it shall not be treasured nor laid up; for her merchandise shall be for them that dwell before Jehovah, to eat and be sufficed, and for excellent clothing.";
web[18] = "And her merchandise and her hire shall be holiness to the LORD: it shall not be treasured nor laid up; for her merchandise shall be for them that dwell before the LORD, for sufficient food, and for durable clothing.";
hnv[18] = "Her merchandise and her hire shall be holiness to the LORD: it shall not be treasured nor laid up; for her merchandise shall be for those who dwell before the LORD, to eat sufficiently, and for durable clothing.";
vul[18] = "et erunt negotiatio eius et mercedes eius sanctificatae Domino non condentur neque reponentur quia his qui habitaverint coram Domino erit negotiatio eius ut manducent in saturitatem et vestiantur usque ad vetustatem";
