csb[1] = "When King Hezekiah heard their report, he tore his clothes, put on sackcloth, and went to the LORD\'s temple.";
csb[2] = "He sent Eliakim, who was in charge of the palace, Shebna the court secretary, and the leading priests, who were wearing sackcloth, to the prophet Isaiah son of Amoz.";
csb[3] = "They said to him, &quot;This is what Hezekiah says: \'Today is a day of distress, rebuke, and disgrace. It is as if children have come to the point of birth, and there is no strength to deliver them.";
csb[4] = "&quot;Perhaps the LORD your God will hear all the words of the royal spokesman, whom his master the king of Assyria sent to mock the living God, and will rebuke him for the words that the LORD your God has heard. Therefore offer a prayer for the surviving remnant.\' &quot;";
csb[5] = "So the servants of King Hezekiah went to Isaiah,";
csb[6] = "who said to them, &quot;Tell your master, \'The LORD says this: Don\'t be afraid because of the words you have heard, with which the king of Assyria\'s attendants have blasphemed me.";
csb[7] = "&quot;I am about to put a spirit in him and he will hear a rumor and return to his own land, where I will cause him to fall by the sword.\' &quot;";
csb[8] = "When the royal spokesman heard that the king of Assyria had pulled out of Lachish, he left and found him fighting against Libnah.";
csb[9] = "The king had heard concerning King Tirhakah of Cush, &quot;He has set out to fight against you.&quot; So when he heard this, he sent messengers to Hezekiah, saying,";
csb[10] = "&quot;Say this to King Hezekiah of Judah: \'Don\'t let your God, on whom you rely, deceive you by promising that Jerusalem won\'t be handed over to the king of Assyria.";
csb[11] = "&quot;Look, you have heard what the kings of Assyria have done to all the countries: they completely destroyed them. Will you be rescued?";
csb[12] = "&quot;Did the gods of the nations that my predecessors destroyed rescue them -- Gozan, Haran, Rezeph, and the Edenites in Telassar?";
csb[13] = "&quot;Where is the king of Hamath, the king of Arpad, the king of the city of Sepharvaim, Hena, or Ivvah? \' &quot;";
csb[14] = "Hezekiah took the letter from the messengers\' hands, read it, then went up to the LORD\'s temple and spread it out before the LORD.";
csb[15] = "Then Hezekiah prayed to the LORD:";
csb[16] = "LORD of Armies, God of Israel, enthroned between the cherubim, you are God -- you alone -- of all the kingdoms of the earth. You made the heavens and the earth.";
csb[17] = "Listen closely, LORD, and hear; open your eyes, LORD, and see. Hear all the words that Sennacherib has sent to mock the living God.";
csb[18] = "LORD, it is true that the kings of Assyria have devastated all these countries and their lands.";
csb[19] = "They have thrown their gods into the fire, for they were not gods but made from wood and stone by human hands. So they have destroyed them.";
csb[20] = "Now, LORD our God, save us from his power so that all the kingdoms of the earth may know that you, LORD, are God -- you alone.";
csb[21] = "Then Isaiah son of Amoz sent a message to Hezekiah: &quot;The LORD, the God of Israel, says, \'Because you prayed to me about King Sennacherib of Assyria,";
csb[22] = "&quot;this is the word the LORD has spoken against him: Virgin Daughter Zion despises you and scorns you; Daughter Jerusalem shakes her head behind your back.";
csb[23] = "&quot;Who is it you have mocked and blasphemed? Against whom have you raised your voice and lifted your eyes in pride? Against the Holy One of Israel!";
csb[24] = "&quot;You have mocked the LORD through your servants. You have said, &quot;With my many chariots I have gone up to the heights of the mountains, to the far recesses of Lebanon. I cut down its tallest cedars, its choice cypress trees. I came to its distant heights, its densest forest.";
csb[25] = "&quot;I dug wells and drank water in foreign lands. I dried up all the streams of Egypt with the soles of my feet.&quot;";
csb[26] = "Have you not heard? I designed it long ago; I planned it in days gone by. I have now brought it to pass, and you have crushed fortified cities into piles of rubble.";
csb[27] = "Their inhabitants have become powerless, dismayed, and ashamed. They are plants of the field, tender grass, grass on the rooftops, blasted by the east wind.";
csb[28] = "But I know your sitting down, your going out and your coming in, and your raging against me.";
csb[29] = "Because your raging against me and your arrogance have reached my ears, I will put my hook in your nose and my bit in your mouth; I will make you go back the way you came.";
csb[30] = "&quot; \'This will be the sign for you: This year you will eat what grows on its own, and in the second year what grows from that. But in the third year sow and reap, plant vineyards and eat their fruit.";
csb[31] = "&quot;The surviving remnant of the house of Judah will again take root downward and bear fruit upward.";
csb[32] = "&quot;For a remnant will go out from Jerusalem, and survivors from Mount Zion. The zeal of the LORD of Armies will accomplish this.\'";
csb[33] = "&quot;Therefore, this is what the LORD says about the king of Assyria: He will not enter this city, shoot an arrow here, come before it with a shield, or build up a siege ramp against it.";
csb[34] = "&quot;He will go back the way he came, and he will not enter this city. This is the LORD\'s declaration.";
csb[35] = "&quot;I will defend this city and rescue it for my sake and for the sake of my servant David.&quot;";
csb[36] = "Then the angel of the LORD went out and struck down one hundred eighty-five thousand in the camp of the Assyrians. When the people got up the next morning -- there were all the dead bodies!";
csb[37] = "So King Sennacherib of Assyria broke camp and left. He returned home and lived in Nineveh.";
csb[38] = "One day, while he was worshiping in the temple of his god Nisroch, his sons Adrammelech and Sharezer struck him down with the sword and escaped to the land of Ararat. Then his son Esar-haddon became king in his place.";

yng[4] = "`It may be Jehovah thy God doth hear the words of Rabshakeh with which the king of Asshur his lord hath sent him to reproach the living God, and hath decided concerning the words that Jehovah thy God hath heard, and thou hast lifted up prayer for the remnant that is found.\'";

vul[16] = "Domine exercituum Deus Israhel qui sedes super cherubin tu es Deus solus omnium regnorum terrae tu fecisti caelum et terram";

rsv[17] = "Incline thy ear, O LORD, and hear; open thy eyes, O LORD, and see; and hear all the words of Sennach\'erib, which he has sent to mock the living God.";
asv[17] = "Incline thine ear, O Jehovah, and hear; open thine eyes, O Jehovah, and see; and hear all the words of Sennacherib, who hath sent to defy the living God.";
yng[17] = "Incline, O Jehovah, Thine ear, and hear; open, O Jehovah, Thine eyes and see; and hear Thou all the words of Sennacherib that he hath sent to reproach the living God.";
dby[17] = "Incline thine ear, O Jehovah, and hear; open, Jehovah, thine eyes, and see; and hear all the words of Sennacherib, who hath sent to reproach the living God.";
web[17] = "Incline thy ear, O LORD, and hear; open thy eyes, O LORD, and see: and hear all the words of Sennacherib, who hath sent to reproach the living God.";
hnv[17] = "Turn your ear, LORD, and hear; open your eyes, LORD, and behold; and hear all the words of Sancheriv, who has sent to defy the living God.";
vul[17] = "inclina Domine aurem tuam et audi aperi Domine oculos tuos et vide et audi omnia verba Sennacherib quae misit ad blasphemandum Deum viventem";

asv[18] = "Of a truth, Jehovah, the kings of Assyria have laid waste all the countries, and their land,";
yng[18] = "`Truly, O Jehovah, kings of Asshur have laid waste all the lands and their land,";
dby[18] = "Of a truth, Jehovah, the kings of Assyria have laid waste all the lands, and their countries,";
web[18] = "Of a truth, LORD, the kings of Assyria have laid waste all the nations, and their countries,";

vul[18] = "vere enim Domine desertas fecerunt reges Assyriorum terras et regiones earum";

rsv[19] = "and have cast their gods into the fire; for they were no gods, but the work of men\'s hands, wood and stone; therefore they were destroyed.";
asv[19] = "and have cast their gods into the fire: for they were no gods, but the work of men\'s hands, wood and stone; therefore they have destroyed them.";
yng[19] = "so as to put their gods into fire -- for they [are] no gods, but work of the hands of man, wood and stone -- and they destroy them.";
dby[19] = "and have cast their gods into the fire; for they were no gods, but the work of men\'s hands, wood and stone; and they have destroyed them.";
web[19] = "And have cast their gods into the fire: for they [were] no gods, but the work of men\'s hands, wood and stone: therefore they have destroyed them.";
hnv[19] = "and have cast their gods into the fire: for they were no gods, but the work of men\'s hands, wood and stone; therefore they have destroyed them.";

kjv[20] = "Now therefore, O LORD our God, save us from his hand, that all the kingdoms of the earth may know that thou [art] the LORD, [even] thou only.";
rsv[20] = "So now, O LORD our God, save us from his hand, that all the kingdoms of the earth may know that thou alone art the LORD.&quot;";
asv[20] = "Now therefore, O Jehovah our God, save us from his hand, that all the kingdoms of the earth may know that thou art Jehovah, even thou only.";
yng[20] = "And now, Jehovah our God, save us from his hand, and all kingdoms of the earth do know that Thou [art] Jehovah, Thyself alone.\'";
dby[20] = "And now, Jehovah our God, save us out of his hand, that all the kingdoms of the earth may know that thou art Jehovah, thou only.";
web[20] = "Now therefore, O LORD our God, save us from his hand, that all the kingdoms of the earth may know that thou [art] the LORD, [even] thou only.";
hnv[20] = "Now therefore, LORD our God, save us from his hand, that all the kingdoms of the eretz may know that you are the LORD, even you only.";
vul[20] = "et nunc Domine Deus noster salva nos de manu eius et cognoscant omnia regna terrae quia tu es Dominus solus";
kjv[21] = "Then Isaiah the son of Amoz sent unto Hezekiah, saying, Thus saith the LORD God of Israel, Whereas thou hast prayed to me against Sennacherib king of Assyria:";
rsv[21] = "Then Isaiah the son of Amoz sent to Hezeki\'ah, saying, &quot;Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennach\'erib king of Assyria,";
asv[21] = "Then Isaiah the son of Amoz sent unto Hezekiah, saying, Thus saith Jehovah, the God of Israel, Whereas thou hast prayed to me against Sennacherib king of Assyria,";
yng[21] = "And Isaiah son of Amoz sendeth unto Hezekiah, saying, `Thus said Jehovah, God of Israel, That which thou hast prayed unto me concerning Sennacherib king of Asshur --";
dby[21] = "And Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith Jehovah the God of Israel, Whereas thou hast prayed to me concerning Sennacherib king of Assyria,";
web[21] = "Then Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith the LORD God of Israel, Whereas thou hast prayed to me against Sennacherib king of Assyria:";
hnv[21] = "Then Yesha`yahu the son of Amotz sent to Hizkiyahu, saying, Thus says the LORD, the God of Yisra\'el, Whereas you have prayed to me against Sancheriv king of Ashshur,";
vul[21] = "et misit Isaias filius Amos ad Ezechiam dicens haec dicit Dominus Deus Israhel pro quibus rogasti me de Sennacherib rege Assyriorum";
kjv[22] = "This [is] the word which the LORD hath spoken concerning him; The virgin, the daughter of Zion, hath despised thee, [and] laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.";
rsv[22] = "this is the word that the LORD has spoken concerning him: \'She despises you, she scorns you--the virgin daughter of Zion; she wags her head behind you--the daughter of Jerusalem.";
asv[22] = "this is the word which Jehovah hath spoken concerning him: The virgin daughter of Zion hath despised thee and laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.";
yng[22] = "this [is] the word that Jehovah spake concerning him: Trampled on thee, laughed at thee, Hath the virgin daughter of Zion, Behind thee shaken the head hath the daughter of Jerusalem.";
dby[22] = "this is the word which Jehovah hath spoken against him: The virgin-daughter of Zion despiseth thee, laugheth thee to scorn; the daughter of Jerusalem shaketh her head at thee.";
web[22] = "This [is] the word which the LORD hath spoken concerning him; The virgin, the daughter of Zion, hath despised thee, [and] derided thee; the daughter of Jerusalem hath shaken her head at thee.";
hnv[22] = "this is the word which the LORD has spoken concerning him: The virgin daughter of Tziyon has despised you and ridiculed you; the daughter of Yerushalayim has shaken her head at you.";
vul[22] = "hoc est verbum quod locutus est Dominus super eum despexit te subsannavit te virgo filia Sion post te caput movit filia Hierusalem";
kjv[23] = "Whom hast thou reproached and blasphemed? and against whom hast thou exalted [thy] voice, and lifted up thine eyes on high? [even] against the Holy One of Israel.";
rsv[23] = "\'Whom have you mocked and reviled? Against whom have you raised your voice and haughtily lifted your eyes? Against the Holy One of Israel!";
asv[23] = "Whom hast thou defied and blasphemed? and against whom hast thou exalted thy voice and lifted up thine eyes on high? [even] against the Holy One of Israel.";
yng[23] = "Whom hast thou reproached and reviled? And against whom lifted up the voice? Yea, thou dost lift up on high thine eyes Against the Holy One of Israel.";
dby[23] = "Whom hast thou reproached and blasphemed? and against whom hast thou exalted the voice? Against the Holy One of Israel hast thou lifted up thine eyes on high.";
web[23] = "Whom hast thou reproached and blasphemed; and against whom hast thou exalted [thy] voice, and lifted thy eyes on high? [even] against the Holy One of Israel.";
hnv[23] = "Whom have you defied and blasphemed? and against whom have you exalted your voice and lifted up your eyes on high? [even] against the Holy One of Yisra\'el.";
vul[23] = "cui exprobrasti et quem blasphemasti et super quem exaltasti vocem et levasti altitudinem oculorum tuorum ad Sanctum Israhel";
kjv[24] = "By thy servants hast thou reproached the Lord, and hast said, By the multitude of my chariots am I come up to the height of the mountains, to the sides of Lebanon; and I will cut down the tall cedars thereof, [and] the choice fir trees thereof: and I will enter into the height of his border, [and] the forest of his Carmel.";
rsv[24] = "By your servants you have mocked the Lord, and you have said, With my many chariots I have gone up the heights of the mountains, to the far recesses of Lebanon; I felled its tallest cedars, its choicest cypresses; I came to its remotest height, its densest forest.";
asv[24] = "By thy servants hast thou defied the Lord, and hast said, With the multitude of my chariots am I come up to the height of the mountains, to the innermost parts of Lebanon; and I will cut down the tall cedars thereof, and the choice fir-trees thereof; and I will enter into its farthest height, the forest of its fruitful field;";
yng[24] = "By the hand of thy servants Thou hast reviled the Lord, and sayest: In the multitude of my chariots I have come up to a high place of hills, The sides of Lebanon, And I cut down the height of its cedars, The choice of its firs, And I enter the high place of its extremity, The forest of its Carmel.";
dby[24] = "By thy servants thou hast reproached the Lord, and hast said, With the multitude of my chariots am I come up to the height of the mountains, to the recesses of Lebanon; and I will cut down its tall cedars, the choice of its cypresses; and I will enter into its furthest height, [into] the forest of its fruitful field.";
web[24] = "By thy servants hast thou reproached the Lord, and hast said, By the multitude of my chariots have I come up to the hight of the mountains, to the sides of Lebanon; and I will cut down its tall cedars, [and] its choice fir-trees: and I will enter into the hight of its border, [and] the forest of its Carmel.";
hnv[24] = "By your servants have you defied the Lord, and have said, With the multitude of my chariots am I come up to the height of the mountains, to the innermost parts of Levanon; and I will cut down the tall cedars of it, and the choice fir trees of it; and I will enter into its farthest height, the forest of its fruitful field;";
vul[24] = "in manu servorum tuorum exprobrasti Domino et dixisti in multitudine quadrigarum mearum ego ascendi altitudinem montium iuga Libani et succidam excelsa cedrorum eius electas abietes illius et introibo altitudinem summitatis eius saltum Carmeli eius";
kjv[25] = "I have digged, and drunk water; and with the sole of my feet have I dried up all the rivers of the besieged places.";
rsv[25] = "I dug wells and drank waters, and I dried up with the sole of my foot all the streams of Egypt.";
asv[25] = "I have digged and drunk water, and with the sole of my feet will I dry up all the rivers of Egypt.";
yng[25] = "I -- I have dug and drunk waters, And I dry up with the sole of my steps All floods of a bulwark.";
dby[25] = "I have digged and drunk water; and with the sole of my feet have I dried up all the streams of Matsor.";
web[25] = "I have digged, and drank water; and with the sole of my feet have I dried up all the rivers of the besieged places.";
hnv[25] = "I have dug and drunk water, and with the sole of my feet will I dry up all the rivers of Mitzrayim.";
vul[25] = "ego fodi et bibi aquam et exsiccavi vestigio pedis mei omnes rivos aggerum";
kjv[26] = "Hast thou not heard long ago, [how] I have done it; [and] of ancient times, that I have formed it? now have I brought it to pass, that thou shouldest be to lay waste defenced cities [into] ruinous heaps.";
rsv[26] = "\'Have you not heard that I determined it long ago? I planned from days of old what now I bring to pass, that you should make fortified cities crash into heaps of ruins,";
asv[26] = "Hast thou not heard how I have done it long ago, and formed it of ancient times? now have I brought it to pass, that it should be thine to lay waste fortified cities into ruinous heaps.";
yng[26] = "Hast thou not heard from afar? -- it I did, From days of old -- that I formed it. Now, I have brought it in, And it is to make desolate, Ruinous heaps -- fenced cities,";
dby[26] = "Hast thou not heard that long ago I did it, and that from ancient days I formed it? Now have I brought it to pass, that thou shouldest lay waste fortified cities [into] ruinous heaps.";
web[26] = "Hast thou not heard long ago, [how] I have done it; [and] of ancient times, that I have formed it? now have I brought it to pass, that thou shouldst be to lay waste fortified cities [into] ruinous heaps.";
hnv[26] = "Have you not heard how I have done it long ago, and formed it of ancient times? now have I brought it to pass, that it should be your to lay waste fortified cities into ruinous heaps.";
vul[26] = "numquid non audisti quae olim fecerim ei ex diebus antiquis ego plasmavi illud et nunc adduxi et factum est in eradicationem collium conpugnantium et civitatum munitarum";
kjv[27] = "Therefore their inhabitants [were] of small power, they were dismayed and confounded: they were [as] the grass of the field, and [as] the green herb, [as] the grass on the housetops, and [as corn] blasted before it be grown up.";
rsv[27] = "while their inhabitants, shorn of strength, are dismayed and confounded, and have become like plants of the field and like tender grass, like grass on the housetops, blighted before it is grown.";
asv[27] = "Therefore their inhabitants were of small power, they were dismayed and confounded; they were as the grass of the field, and as the green herb, as the grass on the housetops, and as a field [of grain] before it is grown up.";
yng[27] = "And their inhabitants are feeble-handed, They were broken down, and are dried up. They have been the herb of the field, And the greenness of the tender grass, Grass of the roofs, And blasted corn, before it hath risen up.";
dby[27] = "And their inhabitants were powerless, they were dismayed and put to shame; they were [as] the grass of the field and the green herb, [as] the grass on the housetops, and grain blighted before it be grown up.";
web[27] = "Therefore their inhabitants [were] of small power, they were dismayed and confounded: they were [as] the grass of the field, and [as] the green herb, [as] the grass on the house-tops, and [as corn] blasted before it is grown up.";
hnv[27] = "Therefore their inhabitants were of small power, they were dismayed and confounded; they were as the grass of the field, and as the green herb, as the grass on the housetops, and as a field [of grain] before it is grown up.";
vul[27] = "habitatores earum breviata manu contremuerunt et confusi sunt facti sunt sicut faenum agri et gramen pascuae et herba tectorum quae exaruit antequam maturesceret";
kjv[28] = "But I know thy abode, and thy going out, and thy coming in, and thy rage against me.";
rsv[28] = "\'I know your sitting down and your going out and coming in, and your raging against me.";
asv[28] = "But I know thy sitting down, and thy going out, and thy coming in, and thy raging against me.";
yng[28] = "And thy sitting down, and thy going out, And thy coming in, I have known, And thy anger towards Me.";
dby[28] = "But I know thine abode, and thy going out, and thy coming in, and thy raging against me.";
web[28] = "But I know thy abode, and thy going out, and thy coming in, and thy rage against me.";
hnv[28] = "But I know your sitting down, and your going out, and your coming in, and your raging against me.";
vul[28] = "habitationem tuam et egressum tuum et introitum tuum cognovi et insaniam tuam contra me";
kjv[29] = "Because thy rage against me, and thy tumult, is come up into mine ears, therefore will I put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.";
rsv[29] = "Because you have raged against me and your arrogance has come to my ears, I will put my hook in your nose and my bit in your mouth, and I will turn you back on the way by which you came.\'";
asv[29] = "Because of thy raging against me, and because thine arrogancy is come up into mine ears, therefore will I put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.";
yng[29] = "Because of thy anger towards Me, And thy noise -- it came up into Mine ears, I have put My hook in thy nose, And My bridle in thy lips, And I have caused thee to turn back In the way in which thou camest.";
dby[29] = "Because thy raging against me and thine arrogance is come up into mine ears, I will put my ring in thy nose, and my bridle in thy lips, and I will make thee go back by the way by which thou camest.";
web[29] = "Because thy rage against me, and thy tumult, is come up into my ears, therefore I will put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.";
hnv[29] = " Because of your raging against me, and because your arrogance is come up into my ears, therefore will I put my hook in your nose, and my bridle in your lips, and I will turn you back by the way by which you came.";
vul[29] = "cum fureres adversum me superbia tua ascendit in aures meas ponam ergo circulum in naribus tuis et frenum in labiis tuis et reducam te in viam per quam venisti";
kjv[30] = "And this [shall be] a sign unto thee, Ye shall eat [this] year such as groweth of itself; and the second year that which springeth of the same: and in the third year sow ye, and reap, and plant vineyards, and eat the fruit thereof.";
rsv[30] = "&quot;And this shall be the sign for you: this year eat what grows of itself, and in the second year what springs of the same; then in the third year sow and reap, and plant vineyards, and eat their fruit.";
asv[30] = "And this shall be the sign unto thee: ye shall eat this year that which groweth of itself, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruit thereof.";
yng[30] = "-- And this to thee [is] the sign, Food of the year [is] self-sown grain, And in the second year the spontaneous growth, And in the third year, sow ye and reap, And plant vineyards, and eat their fruit.";
dby[30] = "And this [shall be] the sign unto thee: there shall be eaten this year such as groweth of itself; and in the second year that which springeth of the same; but in the third year sow ye, and reap, and plant vineyards and eat the fruit thereof.";
web[30] = "And this [shall be] a sign to thee, Ye shall eat [this] year such as groweth of itself; and the second year that which springeth of the same: and in the third year sow ye, and reap, and plant vineyards, and eat the fruit of them.";
hnv[30] = "This shall be the sign to you: you shall eat this year that which grows of itself, and in the second year that which springs of the same; and in the third year sow you, and reap, and plant vineyards, and eat the fruit of it.";
vul[30] = "tibi autem hoc erit signum comede hoc anno quae sponte nascuntur et in anno secundo pomis vescere in anno autem tertio seminate et metite et plantate vineas et comedite fructum earum";
kjv[31] = "And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward:";
rsv[31] = "And the surviving remnant of the house of Judah shall again take root downward, and bear fruit upward;";
asv[31] = "And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward.";
yng[31] = "And it hath continued -- the escaped Of the house of Judah that hath been left -- To take root beneath, And it hath made fruit upward.";
dby[31] = "And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward;";
web[31] = "And the remnant that hath escaped of the house of Judah shall again take root downward, and bear fruit upward:";
hnv[31] = "The remnant that is escaped of the house of Yehudah shall again take root downward, and bear fruit upward.";
vul[31] = "et mittet id quod salvatum fuerit de domo Iuda et quod reliquum est radicem deorsum et faciet fructum sursum";
kjv[32] = "For out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion: the zeal of the LORD of hosts shall do this.";
rsv[32] = "for out of Jerusalem shall go forth a remnant, and out of Mount Zion a band of survivors. The zeal of the LORD of hosts will accomplish this.";
asv[32] = "For out of Jerusalem shall go forth a remnant, and out of mount Zion they that shall escape. The zeal of Jehovah of hosts will perform this.";
yng[32] = "For from Jerusalem goeth forth a remnant, And an escape from mount Zion, The zeal of Jehovah of Hosts doth this.";
dby[32] = "for out of Jerusalem shall go forth a remnant, and out of mount Zion they that escape: the zeal of Jehovah of hosts shall do this.";
web[32] = "For out of Jerusalem shall go forth a remnant, and they that escape from mount Zion: the zeal of the LORD of hosts will do this.";
hnv[32] = "For out of Yerushalayim shall go forth a remnant, and out of Mount Tziyon those who shall escape. The zeal of the LORD of Hosts will perform this.";
vul[32] = "quia de Hierusalem exibunt reliquiae et salvatio de monte Sion zelus Domini exercituum faciet istud";
kjv[33] = "Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shields, nor cast a bank against it.";
rsv[33] = "&quot;Therefore thus says the LORD concerning the king of Assyria: He shall not come into this city, or shoot an arrow there, or come before it with a shield, or cast up a siege mound against it.";
asv[33] = "Therefore thus saith Jehovah concerning the king of Assyria, He shall not come unto this city, nor shoot an arrow there, neither shall he come before it with shield, nor cast up a mound against it.";
yng[33] = "Therefore, thus said Jehovah, Concerning the king of Asshur: He doth not come in unto this city, Nor doth he shoot there an arrow, Nor doth he come before it [with] shield, Nor doth he pour out against it a mount.";
dby[33] = "Therefore thus saith Jehovah concerning the king of Assyria: He shall not come into this city, nor shoot an arrow there, nor come before it with shield, nor cast a bank against it.";
web[33] = "Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shields, nor cast a mound against it.";
hnv[33] = "Therefore thus says the LORD concerning the king of Ashshur, He shall not come to this city, nor shoot an arrow there, neither shall he come before it with shield, nor cast up a mound against it.";
vul[33] = "propterea haec dicit Dominus de rege Assyriorum non introibit civitatem hanc et non iaciet ibi sagittam et non occupabit eam clypeus et non mittet in circuitu eius aggerem";
kjv[34] = "By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD.";
rsv[34] = "By the way that he came, by the same he shall return, and he shall not come into this city, says the LORD.";
asv[34] = "By the way that he came, by the same shall he return, and he shall not come unto this city, saith Jehovah.";
yng[34] = "In the way that he came, in it he turneth back, And unto this city he doth not come in, An affirmation of Jehovah,";
dby[34] = "By the way that he came, by the same shall he return, and shall not come into this city, saith Jehovah.";
web[34] = "By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD.";
hnv[34] = "By the way that he came, by the same shall he return, and he shall not come to this city, says the LORD.";
vul[34] = "in via qua venit per eam revertetur et civitatem hanc non ingredietur dicit Dominus";
kjv[35] = "For I will defend this city to save it for mine own sake, and for my servant David\'s sake.";
rsv[35] = "For I will defend this city to save it, for my own sake and for the sake of my servant David.&quot;";
asv[35] = "For I will defend this city to save it, for mine own sake, and for my servant David\'s sake.";
yng[35] = "And I have covered over this city, To save it, for Mine own sake, And for the sake of David My servant.\'";
dby[35] = "And I will defend this city, to save it, for mine own sake, and for my servant David\'s sake.";
web[35] = "For I will defend this city, to save it for my own sake, and for my servant David\'s sake.";
hnv[35] = "For I will defend this city to save it, for my own sake, and for my servant David\'s sake.";
vul[35] = "et protegam civitatem istam ut salvem eam propter me et propter David servum meum";
kjv[36] = "Then the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand: and when they arose early in the morning, behold, they [were] all dead corpses.";
rsv[36] = "And the angel of the LORD went forth, and slew a hundred and eighty-five thousand in the camp of the Assyrians; and when men arose early in the morning, behold, these were all dead bodies.";
asv[36] = "And the angel of Jehovah went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand; and when men arose early in the morning, behold, these were all dead bodies.";
yng[36] = "And a messenger of Jehovah goeth out, and smiteth in the camp of Asshur a hundred and eighty and five thousand; and [men] rise early in the morning, and lo, all of them [are] dead corpses.";
dby[36] = "And an angel of Jehovah went forth, and smote in the camp of the Assyrians a hundred and eighty-five thousand. And when they arose early in the morning, behold, they were all dead bodies.";
web[36] = "Then the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and eighty five thousand: and when they arose early in the morning, behold, they [were] all dead corpses.";
hnv[36] = "The angel of the LORD went forth, and struck in the camp of the Ashshur one hundred and eighty-five thousand; and when men arose early in the morning, behold, these were all dead bodies.";
vul[36] = "egressus est autem angelus Domini et percussit in castris Assyriorum centum octoginta quinque milia et surrexerunt mane et ecce omnes cadavera mortuorum";
kjv[37] = "So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.";
rsv[37] = "Then Sennach\'erib king of Assyria departed, and went home and dwelt at Nin\'eveh.";
asv[37] = "So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.";
yng[37] = "And journey, and go, and turn back doth Sennacherib king of Asshur, and dwelleth in Nineveh.";
dby[37] = "And Sennacherib king of Assyria departed, and went and returned, and abode at Nineveh.";
web[37] = "So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.";
hnv[37] = "So Sancheriv king of Ashshur departed, and went and returned, and lived at Nineveh.";
vul[37] = "et egressus est et abiit et reversus est Sennacherib rex Assyriorum et habitavit in Nineve";
kjv[38] = "And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword; and they escaped into the land of Armenia: and Esarhaddon his son reigned in his stead.";
rsv[38] = "And as he was worshiping in the house of Nisroch his god, Adram\'melech and Share\'zer, his sons, slew him with the sword, and escaped into the land of Ar\'arat. And E\'sar-had\'don his son reigned in his stead.";
asv[38] = "And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword; and they escaped into the land of Ararat. And Esar-haddon his son reigned in his stead.";
yng[38] = "And it cometh to pass, he is bowing himself in the house of Nisroch his god, and Adrammelech and Sharezer his sons have smitten him with the sword, and they have escaped to the land of Ararat, and Esar-Haddon his son reigneth in his stead.";
dby[38] = "And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword; and they escaped into the land of Ararat. And Esarhaddon his son reigned in his stead.";
web[38] = "And it came to pass, as he was worshiping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword; and they escaped into the land of Armenia: and Esar-haddon his son reigned in his stead.";
hnv[38] = "It happened, as he was worshipping in the house of Nisrokh his god, that Adrammelekh and Sar\'etzer his sons struck him with the sword; and they escaped into the land of Ararat. Esar-Haddon his son reigned in his place.";
vul[38] = "et factum est cum adoraret in templo Nesrach deum suum Adramelech et Sarasar filii eius percusserunt eum gladio fugeruntque in terram Ararat et regnavit Asoraddon filius eius pro eo";
</script>
