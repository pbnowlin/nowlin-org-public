csb[1] = "Woe to those who go down to Egypt for help and who depend on horses! They trust in the abundance of chariots and in the large number of horsemen. They do not look to the Holy One of Israel and they do not seek the LORD.";
csb[2] = "But he also is wise and brings disaster. He does not go back on what he says; he will rise up against the house of the wicked and against the allies of evildoers.";
csb[3] = "Egyptians are men, not God; their horses are flesh, not spirit. When the LORD raises his hand to strike, the helper will stumble and the one who is helped will fall; both will perish together.";
csb[4] = "For this is what the LORD said to me: As a lion or young lion growls over its prey when a band of shepherds is called out against it, and is not terrified by their shouting or subdued by their noise, so the LORD of Armies will come down to fight on Mount Zion and on its hill.";
csb[5] = "Like hovering birds, so the LORD of Armies will protect Jerusalem -- by protecting it, he will rescue it, by sparing it, he will deliver it.";
csb[6] = "Return to the one the Israelites have greatly rebelled against.";
csb[7] = "For on that day, every one of you will reject the silver and gold idols that your own hands have sinfully made.";
csb[8] = "Then Assyria will fall, but not by human sword; a sword will devour him, but not one made by man. He will flee from the sword; his young men will be put to forced labor.";
csb[9] = "His rock will pass away because of fear, and his officers will be afraid because of the signal flag. This is the LORD\'s declaration -- whose fire is in Zion and whose furnace is in Jerusalem.";
kjv[1] = "Woe to them that go down to Egypt for help; and stay on horses, and trust in chariots, because [they are] many; and in horsemen, because they are very strong; but they look not unto the Holy One of Israel, neither seek the LORD!";
rsv[1] = "Woe to those who go down to Egypt for help and rely on horses, who trust in chariots because they are many and in horsemen because they are very strong, but do not look to the Holy One of Israel or consult the LORD!";
asv[1] = "Woe to them that go down to Egypt for help, and rely on horses, and trust in chariots because they are many, and in horsemen because they are very strong, but they look not unto the Holy One of Israel, neither seek Jehovah!";
yng[1] = "Wo [to] those going down to Egypt for help, And on horses lean, And trust on chariots, because many, And on horsemen, because very strong, And have not looked on the Holy One of Israel, And Jehovah have not sought.";
dby[1] = "Woe to them that go down to Egypt for help, and depend on horses, and confide in chariots because [they are] many, and in horsemen because they are very strong; and who look not unto the Holy One of Israel, neither seek Jehovah!";
web[1] = "Woe to them that go down to Egypt for help; and rely on horses, and trust in chariots, because [they are] many; and in horsemen, because they are very strong; but they look not to the Holy One of Israel, neither seek the LORD!";
hnv[1] = "Woe to those who go down to Mitzrayim for help, and rely on horses, and trust in chariots because they are many, and in horsemen because they are very strong, but they don\'t look to the Holy One of Yisra\'el, neither seek the LORD!";
vul[1] = "vae qui descendunt in Aegyptum ad auxilium in equis sperantes et habentes fiduciam super quadrigis quia multae sunt et super equitibus quia praevalidi nimis et non sunt confisi super Sanctum Israhel et Dominum non requisierunt";
kjv[2] = "Yet he also [is] wise, and will bring evil, and will not call back his words: but will arise against the house of the evildoers, and against the help of them that work iniquity.";
rsv[2] = "And yet he is wise and brings disaster, he does not call back his words, but will arise against the house of the evildoers, and against the helpers of those who work iniquity.";
asv[2] = "Yet he also is wise, and will bring evil, and will not call back his words, but will arise against the house of the evil-doers, and against the help of them that work iniquity.";
yng[2] = "And He also [is] wise, and bringeth in evil, And His words He hath not turned aside, And He hath risen against a house of evil doers, And against the help of workers of iniquity.";
dby[2] = "But he also is wise, and he bringeth evil, and recalleth not his words; and he will arise against the house of evildoers, and against the help of workers of iniquity.";
web[2] = "Yet he also [is] wise, and will bring evil, and will not call back his words: but will arise against the house of the evil-doers, and against the help of them that work iniquity.";
hnv[2] = "Yet he also is wise, and will bring evil, and will not call back his words, but will arise against the house of the evil-doers, and against the help of those who work iniquity.";
vul[2] = "ipse autem sapiens adduxit malum et verba sua non abstulit et consurget contra domum pessimorum et contra auxilium operantium iniquitatem";
kjv[3] = "Now the Egyptians [are] men, and not God; and their horses flesh, and not spirit. When the LORD shall stretch out his hand, both he that helpeth shall fall, and he that is holpen shall fall down, and they all shall fail together.";
rsv[3] = "The Egyptians are men, and not God; and their horses are flesh, and not spirit. When the LORD stretches out his hand, the helper will stumble, and he who is helped will fall, and they will all perish together.";
asv[3] = "Now the Egyptians are men, and not God; and their horses flesh, and not spirit: and when Jehovah shall stretch out his hand, both he that helpeth shall stumble, and he that is helped shall fall, and they all shall be consumed together.";
yng[3] = "And the Egyptians [are men], and not God, And their horses [are] flesh, and not spirit, And Jehovah stretcheth out His hand, And stumbled hath the helper, And fallen hath the helped one, And together all of them are consumed.";
dby[3] = "And the Egyptians are men, and not God, and their horses flesh, and not spirit; and Jehovah shall stretch forth his hand, and he that helpeth shall stumble, and he that is helped shall fall, and they all shall perish together.";
web[3] = "Now the Egyptians [are] men, and not God; and their horses flesh, and not spirit. When the LORD shall stretch out his hand, both he that helpeth shall fall, and he that is helped shall fall down, and they all shall fail together.";
hnv[3] = "Now the Mitzrim are men, and not God; and their horses flesh, and not spirit: and when the LORD shall stretch out his hand, both he who helps shall stumble, and he who is helped shall fall, and they all shall be consumed together.";
vul[3] = "Aegyptus homo et non deus et equi eorum caro et non spiritus et Dominus inclinabit manum suam et corruet auxiliator et cadet cui praestatur auxilium simulque omnes consumentur";
kjv[4] = "For thus hath the LORD spoken unto me, Like as the lion and the young lion roaring on his prey, when a multitude of shepherds is called forth against him, [he] will not be afraid of their voice, nor abase himself for the noise of them: so shall the LORD of hosts come down to fight for mount Zion, and for the hill thereof.";
rsv[4] = "For thus the LORD said to me, As a lion or a young lion growls over his prey, and when a band of shepherds is called forth against him is not terrified by their shouting or daunted at their noise, so the LORD of hosts will come down to fight upon Mount Zion and upon its hill.";
asv[4] = "For thus saith Jehovah unto me, As the lion and the young lion growling over his prey, if a multitude of shepherds be called forth against him, will not be dismayed at their voice, nor abase himself for the noise of them: so will Jehovah of hosts come down to fight upon mount Zion, and upon the hill thereof.";
yng[4] = "For thus said Jehovah unto me: `As growl doth the lion and the young lion over his prey, Called against whom is a multitude of shepherds, From their voice he is not affrighted, And from their noise he is not humbled; So come down doth Jehovah of Hosts To war on mount Zion, and on her height.";
dby[4] = "For thus hath Jehovah said unto me: Like as the lion and the young lion growling over his prey, when a multitude of shepherds is called forth against him, is not afraid of their voice, nor giveth way before the multitude of them; so will Jehovah of hosts come down to war upon mount Zion, and on the hill thereof.";
web[4] = "For thus hath the LORD spoken to me, As the lion and the young lion roaring on his prey, when a multitude of shepherds is called forth against him, [he] will not be afraid of their voice, nor abase himself for the noise of them: so will the LORD of hosts come down to fight for mount Zion, and for the hill thereof.";
hnv[4] = "For thus says the LORD to me, As the lion and the young lion growling over his prey, if a multitude of shepherds are called forth against him, will not be dismayed at their voice, nor abase himself for the noise of them: so will the LORD of Hosts come down to fight on Mount Tziyon, and on the hill of it.";
vul[4] = "quia haec dicit Dominus ad me quomodo si rugiat leo et catulus leonis super praedam suam cum occurrerit ei multitudo pastorum a voce eorum non formidabit et a multitudine eorum non pavebit sic descendet Dominus exercituum ut proelietur super montem Sion et super collem eius";
kjv[5] = "As birds flying, so will the LORD of hosts defend Jerusalem; defending also he will deliver [it; and] passing over he will preserve it.";
rsv[5] = "Like birds hovering, so the LORD of hosts will protect Jerusalem; he will protect and deliver it, he will spare and rescue it.";
asv[5] = "As birds hovering, so will Jehovah of hosts protect Jerusalem; he will protect and deliver [it], he will pass over and preserve [it].";
yng[5] = "As birds flying, so doth Jehovah of Hosts Cover over Jerusalem, covering and delivering, Passing over, and causing to escape.\'";
dby[5] = "As birds with outstretched wings, so will Jehovah of hosts cover Jerusalem; covering, he will also deliver, passing over, he will rescue [it].";
web[5] = "As birds flying, so will the LORD of hosts defend Jerusalem; defending also he will deliver [it]; [and] passing over he will preserve [it].";
hnv[5] = "As birds hovering, so will the LORD of Hosts protect Yerushalayim; he will protect and deliver [it], he will pass over and preserve [it].";
vul[5] = "sicut aves volantes sic proteget Dominus exercituum Hierusalem protegens et liberans transiens et salvans";
kjv[6] = "Turn ye unto [him from] whom the children of Israel have deeply revolted.";
rsv[6] = "Turn to him from whom you have deeply revolted, O people of Israel.";
asv[6] = "Turn ye unto him from whom ye have deeply revolted, O children of Israel.";
yng[6] = "Turn back to Him from whom sons of Israel Have deepened apostacy.";
dby[6] = "Turn unto him from whom ye have deeply revolted, ye children of Israel;";
web[6] = "Turn ye to [him from] whom the children of Israel have deeply revolted.";
hnv[6] = "Turn you to him from whom you have deeply revolted, children of Yisra\'el.";
vul[6] = "convertimini sicut in profundum recesseratis filii Israhel";
kjv[7] = "For in that day every man shall cast away his idols of silver, and his idols of gold, which your own hands have made unto you [for] a sin.";
rsv[7] = "For in that day every one shall cast away his idols of silver and his idols of gold, which your hands have sinfully made for you.";
asv[7] = "For in that day they shall cast away every man his idols of silver, and his idols of gold, which your own hands have made unto you for a sin.";
yng[7] = "For in that day despise doth each His idols of silver, and his idols of gold, That your hands made to you -- a sin.";
dby[7] = "for in that day every man shall cast away his idols of silver and his idols of gold, which your sinful hands have made unto you.";
web[7] = "For in that day every man shall cast away his idols of silver, and his idols of gold, which your own hands have made to you [for] a sin.";
hnv[7] = "For in that day they shall cast away every man his idols of silver, and his idols of gold, which your own hands have made to you for a sin.";
vul[7] = "in die enim illa abiciet vir idola argenti sui et idola auri sui quae fecerunt vobis manus vestrae in peccatum";
kjv[8] = "Then shall the Assyrian fall with the sword, not of a mighty man; and the sword, not of a mean man, shall devour him: but he shall flee from the sword, and his young men shall be discomfited.";
rsv[8] = "&quot;And the Assyrian shall fall by a sword, not of man; and a sword, not of man, shall devour him; and he shall flee from the sword, and his young men shall be put to forced labor.";
asv[8] = "And the Assyrian shall fall by the sword, not of man; and the sword, not of men, shall devour him; and he shall flee from the sword, and his young men shall become subject to taskwork.";
yng[8] = "And fallen hath Asshur by sword, not of the high, Yea, a sword -- not of the low, doth consume him, And he hath fled for himself from the face of a sword, And his young men become tributary.";
dby[8] = "And Asshur shall fall by the sword, not of a great man; and the sword, not of a mean man, shall devour him: and he shall flee from the sword, and his young men shall become tributary;";
web[8] = "Then shall the Assyrian fall with the sword, not of a mighty man; and the sword, not of a mean man, shall devour him: but he shall flee from the sword, and his young men shall be discomfited.";
hnv[8] = "The Ashshur shall fall by the sword, not of man; and the sword, not of men, shall devour him; and he shall flee from the sword, and his young men shall become subject to forced labor.";
vul[8] = "et cadet Assur in gladio non viri et gladius non hominis vorabit eum et fugiet non a facie gladii et iuvenes eius vectigales erunt";
kjv[9] = "And he shall pass over to his strong hold for fear, and his princes shall be afraid of the ensign, saith the LORD, whose fire [is] in Zion, and his furnace in Jerusalem.";
rsv[9] = "His rock shall pass away in terror, and his officers desert the standard in panic,&quot; says the LORD, whose fire is in Zion, and whose furnace is in Jerusalem.";
asv[9] = "And his rock shall pass away by reason of terror, and his princes shall be dismayed at the ensign, saith Jehovah, whose fire is in Zion, and his furnace in Jerusalem.";
yng[9] = "And [to] his rock from fear he passeth on, And affrighted by the ensign have been his princes -- an affirmation of Jehovah, Who hath a light in Zion, And who hath a furnace in Jerusalem!";
dby[9] = "and for fear, he shall pass over to his rock, and his princes shall be afraid of the banner, saith Jehovah, whose fire is in Zion, and his furnace in Jerusalem.";
web[9] = "And he shall pass over to his strong hold for fear, and his princes shall be afraid of the ensign, saith the LORD, whose fire [is] in Zion, and his furnace in Jerusalem.";
hnv[9] = "His rock shall pass away by reason of terror, and his princes shall be dismayed at the ensign, says the LORD, whose fire is in Tziyon, and his furnace in Yerushalayim.";
vul[9] = "et fortitudo eius a terrore transibit et pavebunt fugientes principes eius dixit Dominus cuius ignis est in Sion et caminus eius in Hierusalem";
