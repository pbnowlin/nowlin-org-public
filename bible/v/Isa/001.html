csb[1] = "The vision concerning Judah and Jerusalem that Isaiah son of Amoz saw during the reigns of Kings Uzziah, Jotham, Ahaz, and Hezekiah of Judah.";
csb[2] = "Listen, heavens, and pay attention, earth, for the LORD has spoken: &quot;I have raised children and brought them up, but they have rebelled against me.";
csb[3] = "&quot;The ox knows its owner, and the donkey its master\'s feeding trough, but Israel does not know; my people do not understand.&quot;";
csb[4] = "Oh sinful nation, people weighed down with iniquity, brood of evildoers, depraved children! They have abandoned the LORD; they have despised the Holy One of Israel; they have turned their backs on him.";
csb[5] = "Why do you want more beatings? Why do you keep on rebelling? The whole head is hurt, and the whole heart is sick.";
csb[6] = "From the sole of the foot even to the head, no spot is uninjured -- wounds, welts, and festering sores not cleansed, bandaged, or soothed with oil.";
csb[7] = "Your land is desolate, your cities burned down; foreigners devour your fields right in front of you -- a desolation, like a place demolished by foreigners.";
csb[8] = "Daughter Zion is abandoned like a shelter in a vineyard, like a shack in a cucumber field, like a besieged city.";
csb[9] = "If the LORD of Armies had not left us a few survivors, we would be like Sodom, we would resemble Gomorrah.";
csb[10] = "Hear the word of the LORD, you rulers of Sodom! Listen to the instruction of our God, you people of Gomorrah!";
csb[11] = "&quot;What are all your sacrifices to me? &quot; asks the LORD. &quot;I have had enough of burnt offerings and rams and the fat of well-fed cattle; I have no desire for the blood of bulls, lambs, or male goats.";
csb[12] = "&quot;When you come to appear before me, who requires this from you -- this trampling of my courts?";
csb[13] = "&quot;Stop bringing useless offerings. Your incense is detestable to me. New Moons and Sabbaths, and the calling of solemn assemblies -- I cannot stand iniquity with a festival.";
csb[14] = "&quot;I hate your New Moons and prescribed festivals. They have become a burden to me; I am tired of putting up with them.";
csb[15] = "&quot;When you spread out your hands in prayer, I will refuse to look at you; even if you offer countless prayers, I will not listen. Your hands are covered with blood.";
csb[16] = "&quot;Wash yourselves. Cleanse yourselves. Remove your evil deeds from my sight. Stop doing evil.";
csb[17] = "&quot;Learn to do what is good. Pursue justice. Correct the oppressor. Defend the rights of the fatherless. Plead the widow\'s cause.";
csb[18] = "&quot;Come, let us settle this,&quot; says the LORD. &quot;Though your sins are scarlet, they will be as white as snow; though they are crimson red, they will be like wool.";
csb[19] = "&quot;If you are willing and obedient, you will eat the good things of the land.";
csb[20] = "&quot;But if you refuse and rebel, you will be devoured by the sword.&quot; For the mouth of the LORD has spoken.";
csb[21] = "The faithful town -- what an adulteress she has become! She was once full of justice. Righteousness once dwelt in her, but now, murderers!";
csb[22] = "Your silver has become dross to be discarded, your beer is diluted with water.";
csb[23] = "Your rulers are rebels, friends of thieves. They all love graft and chase after bribes. They do not defend the rights of the fatherless, and the widow\'s case never comes before them.";
csb[24] = "Therefore the Lord GOD of Armies, the Mighty One of Israel, declares: &quot;Ah, I will get even with my foes; I will take revenge against my enemies.";
csb[25] = "&quot;I will turn my hand against you and will burn away your dross completely; I will remove all your impurities.";
csb[26] = "&quot;I will restore your judges to what they were at first, and your advisers to what they were at the start. Afterward you will be called the Righteous City, a Faithful Town.&quot;";
csb[27] = "Zion will be redeemed by justice, those who repent, by righteousness.";
csb[28] = "At the same time both rebels and sinners will be broken, and those who abandon the LORD will perish.";
csb[29] = "Indeed, they will be ashamed of the sacred trees you desired, and you will be embarrassed because of the garden shrines you have chosen.";
csb[30] = "For you will become like an oak whose leaves are withered, and like a garden without water.";
csb[31] = "The strong one will become tinder, and his work a spark; both will burn together, with no one to extinguish the flames.";
