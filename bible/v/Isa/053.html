csb[1] = "Who has believed what we have heard? And to whom has the arm of the LORD been revealed?";
csb[2] = "He grew up before him like a young plant and like a root out of dry ground. He didn\'t have an impressive form or majesty that we should look at him, no appearance that we should desire him.";
csb[3] = "He was despised and rejected by men, a man of suffering who knew what sickness was. He was like someone people turned away from; he was despised, and we didn\'t value him.";
csb[4] = "Yet he himself bore our sicknesses, and he carried our pains; but we in turn regarded him stricken, struck down by God, and afflicted.";
csb[5] = "But he was pierced because of our rebellion, crushed because of our iniquities; punishment for our peace was on him, and we are healed by his wounds.";
csb[6] = "We all went astray like sheep; we all have turned to our own way; and the LORD has punished him for the iniquity of us all.";
csb[7] = "He was oppressed and afflicted, yet he did not open his mouth. Like a lamb led to the slaughter and like a sheep silent before her shearers, he did not open his mouth.";
csb[8] = "He was taken away because of oppression and judgment; and who considered his fate? For he was cut off from the land of the living; he was struck because of my people\'s rebellion.";
csb[9] = "He was assigned a grave with the wicked, but he was with a rich man at his death, because he had done no violence and had not spoken deceitfully.";
csb[10] = "Yet the LORD was pleased to crush him severely. When you make him a guilt offering, he will see his seed, he will prolong his days, and by his hand, the LORD\'s pleasure will be accomplished.";
csb[11] = "After his anguish, he will see light and be satisfied. By his knowledge, my righteous servant will justify many, and he will carry their iniquities.";
csb[12] = "Therefore I will give him the many as a portion, and he will receive the mighty as spoil, because he willingly submitted to death, and was counted among the rebels; yet he bore the sin of many and interceded for the rebels.";
kjv[1] = "Who hath believed our report? and to whom is the arm of the LORD revealed?";
rsv[1] = "Who has believed what we have heard? And to whom has the arm of the LORD been revealed?";
asv[1] = "Who hath believed our message? and to whom hath the arm of Jehovah been revealed?";
yng[1] = "Who hath given credence to that which we heard? And the arm of Jehovah, On whom hath it been revealed?";
dby[1] = "Who hath believed our report? and to whom hath the arm of Jehovah been revealed?";
web[1] = "Who hath believed our report? and to whom is the arm of the LORD revealed?";

vul[1] = "quis credidit auditui nostro et brachium Domini cui revelatum est";
kjv[2] = "For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, [there is] no beauty that we should desire him.";
rsv[2] = "For he grew up before him like a young plant, and like a root out of dry ground; he had no form or comeliness that we should look at him, and no beauty that we should desire him.";
asv[2] = "For he grew up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we see him, there is no beauty that we should desire him.";
yng[2] = "Yea, he cometh up as a tender plant before Him, And as a root out of a dry land, He hath no form, nor honour, when we observe him, Nor appearance, when we desire him.";
dby[2] = "For he shall grow up before him as a tender sapling, and as a root out of dry ground: he hath no form nor lordliness, and when we see him, there is no beauty that we should desire him.";
web[2] = "For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, [there is] no beauty that we should desire him.";
hnv[2] = "For he grew up before him as a tender plant, and as a root out of a dry ground: he has no form nor comeliness; and when we see him, there is no beauty that we should desire him.";
vul[2] = "et ascendet sicut virgultum coram eo et sicut radix de terra sitienti non est species ei neque decor et vidimus eum et non erat aspectus et desideravimus eum";
kjv[3] = "He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were [our] faces from him; he was despised, and we esteemed him not.";
rsv[3] = "He was despised and rejected by men; a man of sorrows, and acquainted with grief; and as one from whom men hide their faces he was despised, and we esteemed him not.";
asv[3] = "He was despised, and rejected of men; a man of sorrows, and acquainted with grief: and as one from whom men hide their face he was despised; and we esteemed him not.";
yng[3] = "He is despised, and left of men, A man of pains, and acquainted with sickness, And as one hiding the face from us, He is despised, and we esteemed him not.";
dby[3] = "He is despised and left alone of men; a man of sorrows, and acquainted with grief, and like one from whom [men] hide their faces; -- despised, and we esteemed him not.";
web[3] = "He is despised and rejected by men; a man of sorrows, and acquainted with grief: and we hid as it were [our] faces from him; he was despised, and we esteemed him not.";
hnv[3] = " He was despised, and rejected by men; a man of suffering, and acquainted with disease: and as one from whom men hide their face he was despised; and we didn\'t respect him.";

rsv[4] = "Surely he has borne our griefs and carried our sorrows; yet we esteemed him stricken, smitten by God, and afflicted.";
asv[4] = "Surely he hath borne our griefs, and carried our sorrows; yet we did esteem him stricken, smitten of God, and afflicted.";
yng[4] = "Surely our sicknesses he hath borne, And our pains -- he hath carried them, And we -- we have esteemed him plagued, Smitten of God, and afflicted.";
dby[4] = "Surely *he* hath borne our griefs and carried our sorrows; and we, we did regard him stricken, smitten of God, and afflicted.";
web[4] = "Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten by God, and afflicted.";
hnv[4] = "Surely he has borne our sickness, and carried our suffering; yet we considered him plagued, struck by God, and afflicted.";
vul[4] = "vere languores nostros ipse tulit et dolores nostros ipse portavit et nos putavimus eum quasi leprosum et percussum a Deo et humiliatum";

rsv[5] = "But he was wounded for our transgressions, he was bruised for our iniquities; upon him was the chastisement that made us whole, and with his stripes we are healed.";
asv[5] = "But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed.";
yng[5] = "And he is pierced for our transgressions, Bruised for our iniquities, The chastisement of our peace [is] on him, And by his bruise there is healing to us.";
dby[5] = "But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him, and with his stripes we are healed.";
web[5] = "But he [was] wounded for our transgression, [he was] bruised for our iniquities: the chastisement of our peace [was] upon him; and with his stripes we are healed.";
hnv[5] = "But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our shalom was on him; and with his stripes we are healed.";

asv[6] = "All we like sheep have gone astray; we have turned every one to his own way; and Jehovah hath laid on him the iniquity of us all.";
yng[6] = "All of us like sheep have wandered, Each to his own way we have turned, And Jehovah hath caused to meet on him, The punishment of us all.";
dby[6] = "All we like sheep have gone astray, we have turned every one to his own way; and Jehovah hath laid upon him the iniquity of us all.";

kjv[7] = "He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.";
rsv[7] = "He was oppressed, and he was afflicted, yet he opened not his mouth; like a lamb that is led to the slaughter, and like a sheep that before its shearers is dumb, so he opened not his mouth.";
asv[7] = "He was oppressed, yet when he was afflicted he opened not his mouth; as a lamb that is led to the slaughter, and as a sheep that before its shearers is dumb, so he opened not his mouth.";
yng[7] = "It hath been exacted, and he hath answered, And he openeth not his mouth, As a lamb to the slaughter he is brought, And as a sheep before its shearers is dumb, And he openeth not his mouth.";
dby[7] = "He was oppressed, and he was afflicted, but he opened not his mouth; he was led as a lamb to the slaughter, and was as a sheep dumb before her shearers, and he opened not his mouth.";

hnv[7] = "He was oppressed, yet when he was afflicted he didn\'t open his mouth; as a lamb that is led to the slaughter, and as a sheep that before its shearers is mute, so he didn\'t open his mouth.";

rsv[8] = "By oppression and judgment he was taken away; and as for his generation, who considered that he was cut off out of the land of the living, stricken for the transgression of my people?";
asv[8] = "By oppression and judgment he was taken away; and as for his generation, who [among them] considered that he was cut off out of the land of the living for the transgression of my people to whom the stroke [was due]?";
yng[8] = "By restraint and by judgment he hath been taken, And of his generation who doth meditate, That he hath been cut off from the land of the living? By the transgression of My people he is plagued,";

rsv[9] = "And they made his grave with the wicked and with a rich man in his death, although he had done no violence, and there was no deceit in his mouth.";
asv[9] = "And they made his grave with the wicked, and with a rich man in his death; although he had done no violence, neither was any deceit in his mouth.";
yng[9] = "And it appointeth with the wicked his grave, And with the rich [are] his high places, Because he hath done no violence, Nor [is] deceit in his mouth.";
dby[9] = "And [men] appointed his grave with the wicked, but he was with the rich in his death, because he had done no violence, neither was there guile in his mouth.";
web[9] = "And he made his grave with the wicked, and with the rich in his death: because he had done no violence, neither [was any] deceit in his mouth.";

rsv[10] = "Yet it was the will of the LORD to bruise him; he has put him to grief; when he makes himself an offering for sin, he shall see his offspring, he shall prolong his days; the will of the LORD shall prosper in his hand;";
asv[10] = "Yet it pleased Jehovah to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see [his] seed, he shall prolong his days, and the pleasure of Jehovah shall prosper in his hand.";
yng[10] = "And Jehovah hath delighted to bruise him, He hath made him sick, If his soul doth make an offering for guilt, He seeth seed -- he prolongeth days, And the pleasure of Jehovah in his hand doth prosper.";
dby[10] = "Yet it pleased Jehovah to bruise him; he hath subjected [him] to suffering. When thou shalt make his soul an offering for sin, he shall see a seed, he shall prolong [his] days, and the pleasure of Jehovah shall prosper in his hand.";

dby[11] = "He shall see of [the fruit of] the travail of his soul, [and] shall be satisfied: by his knowledge shall my righteous servant instruct many in righteousness; and *he* shall bear their iniquities.";

kjv[12] = "Therefore will I divide him [a portion] with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors.";

dby[12] = "Therefore will I assign him a portion with the great, and he shall divide the spoil with the strong: because he hath poured out his soul unto death, and was reckoned with the transgressors; and he bore the sin of many, and made intercession for the transgressors.";
web[12] = "Therefore I will divide to him [a portion] with the great, and he shall divide the spoil with the strong; because he hath poured out his soul to death: and he was numbered with the transgressors; and he bore the sin of many, and made intercession for the transgressors.";
hnv[12] = "Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he poured out his soul to death, and was numbered with the transgressors: yet he bore the sin of many, and made intercession for the transgressors.";
