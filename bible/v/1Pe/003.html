csb[1] = "In the same way, wives, submit yourselves to your own husbands so that, even if some disobey the word, they may be won over without a word by the way their wives live";
csb[2] = "when they observe your pure, reverent lives.";
csb[3] = "Don\'t let your beauty consist of outward things like elaborate hairstyles and wearing gold jewelry,";
csb[4] = "but rather what is inside the heart -- the imperishable quality of a gentle and quiet spirit, which is of great worth in God\'s sight.";
csb[5] = "For in the past, the holy women who put their hope in God also adorned themselves in this way, submitting to their own husbands,";
csb[6] = "just as Sarah obeyed Abraham, calling him lord. You have become her children when you do what is good and do not fear any intimidation.";
csb[7] = "Husbands, in the same way, live with your wives in an understanding way, as with a weaker partner, showing them honor as coheirs of the grace of life, so that your prayers will not be hindered.";
csb[8] = "Finally, all of you be like-minded and sympathetic, love one another, and be compassionate and humble,";
csb[9] = "not paying back evil for evil or insult for insult but, on the contrary, giving a blessing, since you were called for this, so that you may inherit a blessing.";
csb[10] = "For the one who wants to love life and to see good days, let him keep his tongue from evil and his lips from speaking deceit,";
csb[11] = "and let him turn away from evil and do what is good. Let him seek peace and pursue it,";
csb[12] = "because the eyes of the Lord are on the righteous and his ears are open to their prayer. But the face of the Lord is against those who do what is evil.";
csb[13] = "Who then will harm you if you are devoted to what is good?";
csb[14] = "But even if you should suffer for righteousness, you are blessed. Do not fear what they fear or be intimidated,";
csb[15] = "but in your hearts regard Christ the Lord as holy, ready at any time to give a defense to anyone who asks you for a reason for the hope that is in you.";
csb[16] = "Yet do this with gentleness and respect, keeping a clear conscience, so that when you are accused, those who disparage your good conduct in Christ will be put to shame.";
csb[17] = "For it is better to suffer for doing good, if that should be God\'s will, than for doing evil.";
csb[18] = "For Christ also suffered for sins once for all, the righteous for the unrighteous, that he might bring you to God. He was put to death in the flesh but made alive by the Spirit,";
csb[19] = "in which he also went and made proclamation to the spirits in prison";
csb[20] = "who in the past were disobedient, when God patiently waited in the days of Noah while the ark was being prepared. In it a few -- that is, eight people -- were saved through water.";
csb[21] = "Baptism, which corresponds to this, now saves you (not as the removal of dirt from the body, but the pledge of a good conscience toward God) through the resurrection of Jesus Christ,";
csb[22] = "who has gone into heaven and is at the right hand of God with angels, authorities, and powers subject to him.";
