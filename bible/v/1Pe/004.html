csb[1] = "Therefore, since Christ suffered in the flesh, arm yourselves also with the same understanding -- because the one who suffers in the flesh is finished with sin --";
csb[2] = "in order to live the remaining time in the flesh no longer for human desires, but for God\'s will.";
csb[3] = "For there has already been enough time spent in doing what the Gentiles choose to do: carrying on in unrestrained behavior, evil desires, drunkenness, orgies, carousing, and lawless idolatry.";
csb[4] = "They are surprised that you don\'t join them in the same flood of wild living -- and they slander you.";
csb[5] = "They will give an account to the one who stands ready to judge the living and the dead.";
csb[6] = "For this reason the gospel was also preached to those who are now dead, so that, although they might be judged in the flesh according to human standards, they might live in the spirit according to God\'s standards.";
csb[7] = "The end of all things is near; therefore, be alert and sober-minded for prayer.";
csb[8] = "Above all, maintain constant love for one another, since love covers a multitude of sins.";
csb[9] = "Be hospitable to one another without complaining.";
csb[10] = "Just as each one has received a gift, use it to serve others, as good stewards of the varied grace of God.";
csb[11] = "If anyone speaks, let it be as one who speaks God\'s words; if anyone serves, let it be from the strength God provides, so that God may be glorified through Jesus Christ in everything. To him be the glory and the power forever and ever. Amen.";
csb[12] = "Dear friends, don\'t be surprised when the fiery ordeal comes among you to test you as if something unusual were happening to you.";
csb[13] = "Instead, rejoice as you share in the sufferings of Christ, so that you may also rejoice with great joy when his glory is revealed.";
csb[14] = "If you are ridiculed for the name of Christ, you are blessed, because the Spirit of glory and of God rests on you.";
csb[15] = "Let none of you suffer as a murderer, a thief, an evildoer, or a meddler.";
csb[16] = "But if anyone suffers as a Christian, let him not be ashamed but let him glorify God in having that name.";
csb[17] = "For the time has come for judgment to begin with God\'s household, and if it begins with us, what will the outcome be for those who disobey the gospel of God?";
csb[18] = "And if a righteous person is saved with difficulty, what will become of the ungodly and the sinner?";
csb[19] = "So then, let those who suffer according to God\'s will entrust themselves to a faithful Creator while doing what is good.";
kjv[1] = "Forasmuch then as Christ hath suffered for us in the flesh, arm yourselves likewise with the same mind: for he that hath suffered in the flesh hath ceased from sin;";
rsv[1] = "Since therefore Christ suffered in the flesh, arm yourselves with the same thought, for whoever has suffered in the flesh has ceased from sin,";
asv[1] = "Forasmuch then as Christ suffered in the flesh, arm ye yourselves also with the same mind; for he that hath suffered in the flesh hath ceased from sin;";
yng[1] = "Christ, then, having suffered for us in the flesh, ye also with the same mind arm yourselves, because he who did suffer in the flesh hath done with sin,";
dby[1] = "Christ, then, having suffered for us in [the] flesh, do *ye* also arm yourselves with the same mind; for he that has suffered in [the] flesh has done with sin,";
web[1] = "Forasmuch then as Christ hath suffered for us in the flesh, arm yourselves likewise with the same mind: for he that hath suffered in the flesh hath ceased from sin;";
hnv[1] = "Forasmuch then as Messiah suffered for us in the flesh, arm yourselves also with the same mind; for he who has suffered in the flesh has ceased from sin;";
vul[1] = "Christo igitur passo in carne et vos eadem cogitatione armamini quia qui passus est carne desiit a peccatis";
kjv[2] = "That he no longer should live the rest of [his] time in the flesh to the lusts of men, but to the will of God.";
rsv[2] = "so as to live for the rest of the time in the flesh no longer by human passions but by the will of God.";
asv[2] = "that ye no longer should live the rest of your time in the flesh to the lusts of men, but to the will of God.";
yng[2] = "no more in the desires of men, but in the will of God, to live the rest of the time in the flesh;";
dby[2] = "no longer to live the rest of [his] time in [the] flesh to men\'s lusts, but to God\'s will.";
web[2] = "That he no longer should live the rest of [his] time in the flesh to the lusts of men, but to the will of God.";
hnv[2] = "that you no longer should live the rest of your time in the flesh for the lusts of men, but for the will of God.";
vul[2] = "ut iam non hominum desideriis sed voluntate Dei quod reliquum est in carne vivat temporis";
kjv[3] = "For the time past of [our] life may suffice us to have wrought the will of the Gentiles, when we walked in lasciviousness, lusts, excess of wine, revellings, banquetings, and abominable idolatries:";
rsv[3] = "Let the time that is past suffice for doing what the Gentiles like to do, living in licentiousness, passions, drunkenness, revels, carousing, and lawless idolatry.";
asv[3] = "For the time past may suffice to have wrought the desire of the Gentiles, and to have walked in lasciviousness, lusts, winebibbings, revellings, carousings, and abominable idolatries:";
yng[3] = "for sufficient to us [is] the past time of life the will of the nations to have wrought, having walked in lasciviousnesses, desires, excesses of wines, revelings, drinking-bouts, and unlawful idolatries,";
dby[3] = "For the time past [is] sufficient [for us] to have wrought the will of the Gentiles, walking in lasciviousness, lusts, wine-drinking, revels, drinkings, and unhallowed idolatries.";
web[3] = "For the time past of [our] life may suffice us to have wrought the will of the Gentiles, when we walked in lasciviousness, lusts, excess of wine, revelings, banquetings, and abominable idolatries:";
hnv[3] = "For we have spent enough of our past time living in doing the desire of the Goyim, and to have walked in lewdness, lusts, drunken binges, orgies, carousings, and abominable idolatries.";
vul[3] = "sufficit enim praeteritum tempus ad voluntatem gentium consummandam qui ambulaverunt in luxuriis desideriis vinolentiis comesationibus potationibus et inlicitis idolorum cultibus";
kjv[4] = "Wherein they think it strange that ye run not with [them] to the same excess of riot, speaking evil of [you]:";
rsv[4] = "They are surprised that you do not now join them in the same wild profligacy, and they abuse you;";
asv[4] = "wherein they think it strange that ye run not with [them] into the same excess of riot, speaking evil of [you]:";
yng[4] = "in which they think it strange -- your not running with them to the same excess of dissoluteness, speaking evil,";
dby[4] = "Wherein they think it strange that ye run not with [them] to the same sink of corruption, speaking injuriously [of you];";
web[4] = "In which they think it strange that ye run not with [them] to the same excess of riot, speaking evil of [you]:";
hnv[4] = "They think it is strange that you don\'t run with them into the same excess of riot, blaspheming:";
vul[4] = "in quo peregrinantur non concurrentibus vobis in eandem luxuriae confusionem blasphemantes";
kjv[5] = "Who shall give account to him that is ready to judge the quick and the dead.";
rsv[5] = "but they will give account to him who is ready to judge the living and the dead.";
asv[5] = "who shall give account to him that is ready to judge the living and the dead.";
yng[5] = "who shall give an account to Him who is ready to judge living and dead,";
dby[5] = "who shall render account to him who is ready to judge [the] living and [the] dead.";
web[5] = "Who shall give account to him that is ready to judge the living and the dead.";
hnv[5] = "who will give account to him who is ready to judge the living and the dead.";
vul[5] = "qui reddent rationem ei qui paratus est iudicare vivos et mortuos";
kjv[6] = "For for this cause was the gospel preached also to them that are dead, that they might be judged according to men in the flesh, but live according to God in the spirit.";
rsv[6] = "For this is why the gospel was preached even to the dead, that though judged in the flesh like men, they might live in the spirit like God.";
asv[6] = "For unto this end was the gospel preached even to the dead, that they might be judged indeed according to men in the flesh, but live according to God in the spirit.";
yng[6] = "for for this also to dead men was good news proclaimed, that they may be judged, indeed, according to men in the flesh, and may live according to God in the spirit.";
dby[6] = "For to this [end] were the glad tidings preached to [the] dead also, that they might be judged, as regards men, after [the] flesh, but live, as regards God, after [the] Spirit.";
web[6] = "For, for this cause was the gospel preached also to them that are dead, that they might be judged according to men in the flesh, but live according to God in the spirit.";
hnv[6] = "For to this end was the Good News preached even to the dead, that they might be judged indeed as men in the flesh, but live as to God in the spirit.";
vul[6] = "propter hoc enim et mortuis evangelizatum est ut iudicentur quidem secundum homines in carne vivant autem secundum Deum spiritu";
kjv[7] = "But the end of all things is at hand: be ye therefore sober, and watch unto prayer.";

asv[7] = "But the end of all things is at hand: be ye therefore of sound mind, and be sober unto prayer:";

web[7] = "But the end of all things is at hand: be ye therefore sober, and watch to prayer.";
hnv[7] = "But the end of all things is near. Therefore be of sound mind, self-controlled, and sober in prayer.";
vul[7] = "omnium autem finis adpropinquavit estote itaque prudentes et vigilate in orationibus";

rsv[8] = "Above all hold unfailing your love for one another, since love covers a multitude of sins.";
asv[8] = "above all things being fervent in your love among yourselves; for love covereth a multitude of sins:";
yng[8] = "and, before all things, to one another having the earnest love, because the love shall cover a multitude of sins;";
dby[8] = "but before all things having fervent love among yourselves, because love covers a multitude of sins;";
web[8] = "And above all things have fervent charity among yourselves: for charity will cover a multitude of sins.";
hnv[8] = "And above all things be earnest in your love among yourselves, for love covers a multitude of sins.";
vul[8] = "ante omnia mutuam in vosmet ipsos caritatem continuam habentes quia caritas operit multitudinem peccatorum";

dby[9] = "hospitable one to another, without murmuring;";
web[9] = "Use hospitality one to another without grudging.";
hnv[9] = "Be hospitable one to another without grumbling.";

rsv[10] = "As each has received a gift, employ it for one another, as good stewards of God\'s varied grace:";

yng[10] = "each, according as he received a gift, to one another ministering it, as good stewards of the manifold grace of God;";
dby[10] = "each according as he has received a gift, ministering it to one another, as good stewards of [the] various grace of God.";
web[10] = "As every man hath received the gift, [even so] minister the same one to another, as good stewards of the manifold grace of God.";
hnv[10] = "According as each has received a gift, be ministering it among yourselves, as good stewards of the grace of God in its various forms.";

kjv[11] = "If any man speak, [let him speak] as the oracles of God; if any man minister, [let him do it] as of the ability which God giveth: that God in all things may be glorified through Jesus Christ, to whom be praise and dominion for ever and ever. Amen.";
rsv[11] = "whoever speaks, as one who utters oracles of God; whoever renders service, as one who renders it by the strength which God supplies; in order that in everything God may be glorified through Jesus Christ. To him belong glory and dominion for ever and ever. Amen.";
asv[11] = "if any man speaketh, [speaking] as it were oracles of God; if any man ministereth, [ministering] as of the strength which God supplieth: that in all things God may be glorified through Jesus Christ, whose is the glory and the dominion for ever and ever. Amen.";
yng[11] = "if any one doth speak -- `as oracles of God;\' if any one doth minister -- `as of the ability which God doth supply;\' that in all things God may be glorified through Jesus Christ, to whom is the glory and the power -- to the ages of the ages. Amen.";
dby[11] = "If any one speak -- as oracles of God; if any one minister -- as of strength which God supplies; that God in all things may be glorified through Jesus Christ, to whom is the glory and the might for the ages of ages. Amen.";
web[11] = "If any man speaketh [let him speak] as the oracles of God; if any man ministereth [let him do it] as of the ability which God giveth: that God in all things may be glorified through Jesus Christ; to whom be praise and dominion for ever and ever. Amen.";
hnv[11] = "If any man speaks, let it be as it were oracles of God. If any man serves, let it be as of the strength which God supplies, that in all things God may be glorified through Yeshua the Messiah, to whom belong the glory and the dominion forever and ever. Amein.";

kjv[12] = "Beloved, think it not strange concerning the fiery trial which is to try you, as though some strange thing happened unto you:";
rsv[12] = "Beloved, do not be surprised at the fiery ordeal which comes upon you to prove you, as though something strange were happening to you.";

yng[12] = "Beloved, think it not strange at the fiery suffering among you that is coming to try you, as if a strange thing were happening to you,";

hnv[12] = "Beloved, don\'t be astonished at the fiery trial which has come upon you, to test you, as though a strange thing happened to you.";
vul[12] = "carissimi nolite peregrinari in fervore qui ad temptationem vobis fit quasi novi aliquid vobis contingat";

dby[13] = "but as ye have share in the sufferings of Christ, rejoice, that in the revelation of his glory also ye may rejoice with exultation.";
web[13] = "But rejoice, seeing ye are partakers of Christ\'s sufferings; that, when his glory shall be revealed, ye may be glad also with exceeding joy.";

rsv[19] = "Therefore let those who suffer according to God\'s will do right and entrust their souls to a faithful Creator.";

yng[19] = "so that also those suffering according to the will of god, as to a stedfast Creator, let them commit their own souls in good doing.";
dby[19] = "Wherefore also let them who suffer according to the will of God commit their souls in well-doing to a faithful Creator.";
web[19] = "Wherefore, let them that suffer according to the will of God, commit the keeping of their souls [to him] in well-doing, as to a faithful Creator.";
