csb[1] = "Paul, a prisoner of Christ Jesus, and Timothy our brother: To Philemon our dear friend and coworker,";
csb[2] = "to Apphia our sister, to Archippus our fellow soldier, and to the church that meets in your home.";
csb[3] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
csb[4] = "I always thank my God when I mention you in my prayers,";
csb[5] = "because I hear of your love for all the saints and the faith that you have in the Lord Jesus.";
csb[6] = "I pray that your participation in the faith may become effective through knowing every good thing that is in us for the glory of Christ.";
csb[7] = "For I have great joy and encouragement from your love, because the hearts of the saints have been refreshed through you, brother.";
csb[8] = "For this reason, although I have great boldness in Christ to command you to do what is right,";
csb[9] = "I appeal to you, instead, on the basis of love. I, Paul, as an elderly man and now also as a prisoner of Christ Jesus,";
csb[10] = "appeal to you for my son, Onesimus. I became his father while I was in chains.";
csb[11] = "Once he was useless to you, but now he is useful both to you and to me.";
csb[12] = "I am sending him back to you -- I am sending my very own heart.";
csb[13] = "I wanted to keep him with me, so that in my imprisonment for the gospel he might serve me in your place.";
csb[14] = "But I didn\'t want to do anything without your consent, so that your good deed might not be out of obligation, but of your own free will.";
csb[15] = "For perhaps this is why he was separated from you for a brief time, so that you might get him back permanently,";
csb[16] = "no longer as a slave, but more than a slave -- as a dearly loved brother. He is especially so to me, but how much more to you, both in the flesh and in the Lord.";
csb[17] = "So if you consider me a partner, welcome him as you would me.";
csb[18] = "And if he has wronged you in any way, or owes you anything, charge that to my account.";
csb[19] = "I, Paul, write this with my own hand: I will repay it -- not to mention to you that you owe me even your very self.";
csb[20] = "Yes, brother, may I benefit from you in the Lord; refresh my heart in Christ.";
csb[21] = "Since I am confident of your obedience, I am writing to you, knowing that you will do even more than I say.";
csb[22] = "Meanwhile, also prepare a guest room for me, since I hope that through your prayers I will be restored to you.";
csb[23] = "Epaphras, my fellow prisoner in Christ Jesus, sends you greetings, and so do";
csb[24] = "Mark, Aristarchus, Demas, and Luke, my coworkers.";
csb[25] = "The grace of the Lord Jesus Christ be with your spirit.";
