csb[1] = "Ahab told Jezebel everything that Elijah had done and how he had killed all the prophets with the sword.";
csb[2] = "So Jezebel sent a messenger to Elijah, saying, &quot;May the gods punish me and do so severely if I don\'t make your life like the life of one of them by this time tomorrow! &quot;";
csb[3] = "Then Elijah became afraid and immediately ran for his life. When he came to Beer-sheba that belonged to Judah, he left his servant there,";
csb[4] = "but he went on a day\'s journey into the wilderness. He sat down under a broom tree and prayed that he might die. He said, &quot;I have had enough! LORD, take my life, for I\'m no better than my fathers.&quot;";
csb[5] = "Then he lay down and slept under the broom tree. Suddenly, an angel touched him. The angel told him, &quot;Get up and eat.&quot;";
csb[6] = "Then he looked, and there at his head was a loaf of bread baked over hot stones, and a jug of water. So he ate and drank and lay down again.";
csb[7] = "Then the angel of the LORD returned for a second time and touched him. He said, &quot;Get up and eat, or the journey will be too much for you.&quot;";
csb[8] = "So he got up, ate, and drank. Then on the strength from that food, he walked forty days and forty nights to Horeb, the mountain of God.";
csb[9] = "He entered a cave there and spent the night. Suddenly, the word of the LORD came to him, and he said to him, &quot;What are you doing here, Elijah? &quot;";
csb[10] = "He replied, &quot;I have been very zealous for the LORD God of Armies, but the Israelites have abandoned your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they are looking for me to take my life.&quot;";
csb[11] = "Then he said, &quot;Go out and stand on the mountain in the LORD\'s presence.&quot; At that moment, the LORD passed by. A great and mighty wind was tearing at the mountains and was shattering cliffs before the LORD, but the LORD was not in the wind. After the wind there was an earthquake, but the LORD was not in the earthquake.";
csb[12] = "After the earthquake there was a fire, but the LORD was not in the fire. And after the fire there was a voice, a soft whisper.";
csb[13] = "When Elijah heard it, he wrapped his face in his mantle and went out and stood at the entrance of the cave. Suddenly, a voice came to him and said, &quot;What are you doing here, Elijah? &quot;";
csb[14] = "&quot;I have been very zealous for the LORD God of Armies,&quot; he replied, &quot;but the Israelites have abandoned your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they\'re looking for me to take my life.&quot;";
csb[15] = "Then the LORD said to him, &quot;Go and return by the way you came to the Wilderness of Damascus. When you arrive, you are to anoint Hazael as king over Aram.";
csb[16] = "&quot;You are to anoint Jehu son of Nimshi as king over Israel and Elisha son of Shaphat from Abel-meholah as prophet in your place.";
csb[17] = "&quot;Then Jehu will put to death whoever escapes the sword of Hazael, and Elisha will put to death whoever escapes the sword of Jehu.";
csb[18] = "&quot;But I will leave seven thousand in Israel -- every knee that has not bowed to Baal and every mouth that has not kissed him.&quot;";
csb[19] = "Elijah left there and found Elisha son of Shaphat as he was plowing. Twelve teams of oxen were in front of him, and he was with the twelfth team. Elijah walked by him and threw his mantle over him.";
csb[20] = "Elisha left the oxen, ran to follow Elijah, and said, &quot;Please let me kiss my father and mother, and then I will follow you.&quot; &quot;Go on back,&quot; he replied, &quot;for what have I done to you? &quot;";
csb[21] = "So he turned back from following him, took the team of oxen, and slaughtered them. With the oxen\'s wooden yoke and plow, he cooked the meat and gave it to the people, and they ate. Then he left, followed Elijah, and served him.";

asv[16] = "and Jehu the son of Nimshi shalt thou anoint to be king over Israel; and Elisha the son of Shaphat of Abel-meholah shalt thou anoint to be prophet in thy room.";
yng[16] = "and Jehu son of Nimshi thou dost anoint for king over Israel, and Elisha son of Shaphat, of Abel-Meholah, thou dost anoint for prophet in thy stead.";
dby[16] = "and Jehu the son of Nimshi shalt thou anoint king over Israel; and Elisha the son of Shaphat of Abel-meholah shalt thou anoint prophet in thy stead.";
web[16] = "And Jehu the son of Nimshi shalt thou anoint [to be] king over Israel: and Elisha the son of Shaphat of Abel-meholah shalt thou anoint [to be] prophet in thy room.";
hnv[16] = "and Yehu the son of Nimshi shall you anoint to be king over Yisra\'el; and Elisha the son of Shafat of Avel-Mecholah shall you anoint to be prophet in your room.";
vul[16] = "et Hieu filium Namsi ungues regem super Israhel Heliseum autem filium Saphat qui est de Abelmaula ungues prophetam pro te";
kjv[17] = "And it shall come to pass, [that] him that escapeth the sword of Hazael shall Jehu slay: and him that escapeth from the sword of Jehu shall Elisha slay.";
rsv[17] = "And him who escapes from the sword of Haz\'ael shall Jehu slay; and him who escapes from the sword of Jehu shall Eli\'sha slay.";
asv[17] = "And it shall come to pass, that him that escapeth from the sword of Hazael shall Jehu slay; and him that escapeth from the sword of Jehu shall Elisha slay.";
yng[17] = "`And it hath been, him who is escaped from the sword of Hazael, put to death doth Jehu, and him who is escaped from the sword of Jehu put to death doth Elisha;";
dby[17] = "And it shall come to pass, [that] him that escapeth the sword of Hazael shall Jehu slay; and him that escapeth the sword of Jehu shall Elisha slay.";
web[17] = "And it shall come to pass, [that] him that escapeth the sword of Hazael shall Jehu slay: and him that escapeth from the sword of Jehu shall Elisha slay.";
hnv[17] = "It shall happen, that he who escapes from the sword of Haza\'el shall Yehu kill; and he who escapes from the sword of Yehu shall Elisha kill.";
vul[17] = "et erit quicumque fugerit gladium Azahel occidet eum Hieu et qui fugerit gladium Hieu interficiet eum Heliseus";
kjv[18] = "Yet I have left [me] seven thousand in Israel, all the knees which have not bowed unto Baal, and every mouth which hath not kissed him.";
rsv[18] = "Yet I will leave seven thousand in Israel, all the knees that have not bowed to Ba\'al, and every mouth that has not kissed him.&quot;";
asv[18] = "Yet will I leave [me] seven thousand in Israel, all the knees which have not bowed unto Baal, and every mouth which hath not kissed him.";
yng[18] = "and I have left in Israel seven thousand, all the knees that have not bowed to Baal, and every mouth that hath not kissed him.\'";
dby[18] = "Yet I have left [myself] seven thousand in Israel, all the knees that have not bowed unto Baal, and every mouth that hath not kissed him.";
web[18] = "Yet I have left to [me] seven thousand in Israel, all the knees which have not bowed to Baal, and every mouth which hath not kissed him.";
hnv[18] = "Yet will I leave [me] seven thousand in Yisra\'el, all the knees which have not bowed to Ba`al, and every mouth which has not kissed him.";
vul[18] = "et derelinquam mihi in Israhel septem milia universorum genua quae non sunt incurvata Baal et omne os quod non adoravit eum osculans manum";
kjv[19] = "So he departed thence, and found Elisha the son of Shaphat, who [was] plowing [with] twelve yoke [of oxen] before him, and he with the twelfth: and Elijah passed by him, and cast his mantle upon him.";
rsv[19] = "So he departed from there, and found Eli\'sha the son of Shaphat, who was plowing, with twelve yoke of oxen before him, and he was with the twelfth. Eli\'jah passed by him and cast his mantle upon him.";
asv[19] = "So he departed thence, and found Elisha the son of Shaphat, who was plowing, with twelve yoke [of oxen] before him, and he with the twelfth: and Elijah passed over unto him, and cast his mantle upon him.";
yng[19] = "And he goeth thence, and findeth Elisha son of Shaphat, and he is plowing; twelve yoke [are] before him, and he [is] with the twelfth; and Elijah passeth over unto him, and casteth his robe upon him,";
dby[19] = "And he departed thence, and found Elisha the son of Shaphat, who was ploughing [with] twelve yokes before him, and he with the twelfth; and Elijah went over to him, and cast his mantle on him.";
web[19] = "So he departed thence, and found Elisha the son of Shaphat, who [was] plowing [with] twelve yoke [of oxen] before him, and he with the twelfth: and Elijah passed by him, and cast his mantle upon him.";
hnv[19] = "So he departed there, and found Elisha the son of Shafat, who was plowing, with twelve yoke [of oxen] before him, and he with the twelfth: and Eliyah passed over to him, and cast his mantle on him.";
vul[19] = "profectus ergo inde repperit Heliseum filium Saphat arantem duodecim iugis boum et ipse in duodecim arantibus unus erat cumque venisset Helias ad eum misit pallium suum super illum";
kjv[20] = "And he left the oxen, and ran after Elijah, and said, Let me, I pray thee, kiss my father and my mother, and [then] I will follow thee. And he said unto him, Go back again: for what have I done to thee?";
rsv[20] = "And he left the oxen, and ran after Eli\'jah, and said, &quot;Let me kiss my father and my mother, and then I will follow you.&quot; And he said to him, &quot;Go back again; for what have I done to you?&quot;";
asv[20] = "And he left the oxen, and ran after Elijah, and said, Let me, I pray thee, kiss my father and my mother, and then I will follow thee. And he said unto him, Go back again; for what have I done to thee?";
yng[20] = "and he forsaketh the oxen, and runneth after Elijah, and saith, `Let me give a kiss, I pray thee, to my father and to my mother, and I go after thee.\' And he saith to him, `Go, turn back, for what have I done to thee?\'";
dby[20] = "And he left the oxen, and ran after Elijah, and said, Let me, I pray thee, kiss my father and my mother, and I will follow thee. And he said to him, Go back again; for what have I done to thee?";
web[20] = "And he left the oxen, and ran after Elijah, and said, Let me, I pray thee, kiss my father and my mother, and [then] I will follow thee. And he said to him, Go back again: for what have I done to thee?";
hnv[20] = "He left the oxen, and ran after Eliyah, and said, Let me, I pray you, kiss my father and my mother, and then I will follow you. He said to him, Go back again; for what have I done to you?";
vul[20] = "qui statim relictis bubus cucurrit post Heliam et ait osculer oro te patrem meum et matrem meam et sic sequar te dixitque ei vade et revertere quod enim meum erat feci tibi";
kjv[21] = "And he returned back from him, and took a yoke of oxen, and slew them, and boiled their flesh with the instruments of the oxen, and gave unto the people, and they did eat. Then he arose, and went after Elijah, and ministered unto him.";
rsv[21] = "And he returned from following him, and took the yoke of oxen, and slew them, and boiled their flesh with the yokes of the oxen, and gave it to the people, and they ate. Then he arose and went after Eli\'jah, and ministered to him.";
asv[21] = "And he returned from following him, and took the yoke of oxen, and slew them, and boiled their flesh with the instruments of the oxen, and gave unto the people, and they did eat. Then he arose, and went after Elijah, and ministered unto him.";
yng[21] = "And he turneth back from after him, and taketh the yoke of oxen, and sacrificeth it, and with instruments of the oxen he hath boiled their flesh, and giveth to the people, and they eat, and he riseth, and goeth after Elijah, and serveth him.";
dby[21] = "And he returned back from him, and took the yoke of oxen, and killed them, and boiled their flesh with the implements of the oxen, and gave to the people, and they ate. And he arose and went after Elijah, and ministered to him.";
web[21] = "And he returned back from him, and took a yoke of oxen, and slew them, and boiled their flesh with the instruments of the oxen, and gave to the people, and they ate. Then he arose, and went after Elijah, and ministered to him.";
hnv[21] = "He returned from following him, and took the yoke of oxen, and killed them, and boiled their flesh with the instruments of the oxen, and gave to the people, and they ate. Then he arose, and went after Eliyah, and ministered to him.";
vul[21] = "reversus autem ab eo tulit par boum et mactavit illud et in aratro boum coxit carnes et dedit populo et comederunt consurgensque abiit et secutus est Heliam et ministrabat ei";
