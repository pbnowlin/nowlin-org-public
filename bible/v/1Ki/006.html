csb[1] = "Solomon began to build the temple for the LORD in the four hundred eightieth year after the Israelites came out of the land of Egypt, in the fourth year of his reign over Israel, in the month of Ziv, which is the second month.";
csb[2] = "The temple that King Solomon built for the LORD was ninety feet long, thirty feet wide, and forty-five feet high.";
csb[3] = "The portico in front of the temple sanctuary was thirty feet long extending across the temple\'s width, and fifteen feet deep in front of the temple.";
csb[4] = "He also made windows with beveled frames for the temple.";
csb[5] = "He then built a chambered structure along the temple wall, encircling the walls of the temple, that is, the sanctuary and the inner sanctuary. And he made side chambers all around.";
csb[6] = "The lowest chamber was 7 1/2 feet wide, the middle was 9 feet wide, and the third was 10 1/2 feet wide. He also provided offset ledges for the temple all around the outside so that nothing would be inserted into the temple walls.";
csb[7] = "The temple\'s construction used finished stones cut at the quarry so that no hammer, chisel, or any iron tool was heard in the temple while it was being built.";
csb[8] = "The door for the lowest side chamber was on the right side of the temple. They went up a stairway to the middle chamber, and from the middle to the third.";
csb[9] = "When he finished building the temple, he paneled it with boards and planks of cedar.";
csb[10] = "He built the chambers along the entire temple, joined to the temple with cedar beams; each story was 7 1/2 feet high.";
csb[11] = "The word of the LORD came to Solomon:";
csb[12] = "&quot;As for this temple you are building -- if you walk in my statutes, observe my ordinances, and keep all my commands by walking in them, I will fulfill my promise to you, which I made to your father David.";
csb[13] = "&quot;I will dwell among the Israelites and not abandon my people Israel.&quot;";
csb[14] = "When Solomon finished building the temple,";
csb[15] = "he paneled the interior temple walls with cedar boards; from the temple floor to the surface of the ceiling he overlaid the interior with wood. He also overlaid the floor with cypress boards.";
csb[16] = "Then he lined thirty feet of the rear of the temple with cedar boards from the floor to the surface of the ceiling, and he built the interior as an inner sanctuary, the most holy place.";
csb[17] = "The temple, that is, the sanctuary in front of the most holy place, was sixty feet long.";
csb[18] = "The cedar paneling inside the temple was carved with ornamental gourds and flower blossoms. Everything was cedar; not a stone could be seen.";
csb[19] = "He prepared the inner sanctuary inside the temple to put the ark of the LORD\'s covenant there.";
csb[20] = "The interior of the sanctuary was thirty feet long, thirty feet wide, and thirty feet high; he overlaid it with pure gold. He also overlaid the cedar altar.";
csb[21] = "Next, Solomon overlaid the interior of the temple with pure gold, and he hung gold chains across the front of the inner sanctuary and overlaid it with gold.";
csb[22] = "So he added the gold overlay to the entire temple until everything was completely finished, including the entire altar that belongs to the inner sanctuary.";
csb[23] = "In the inner sanctuary he made two cherubim 15 feet high out of olive wood.";
csb[24] = "One wing of the first cherub was 7 1/2 feet long, and the other wing was 7 1/2 feet long. The wingspan was 15 feet from tip to tip.";
csb[25] = "The second cherub also was 15 feet; both cherubim had the same size and shape.";
csb[26] = "The first cherub\'s height was 15 feet and so was the second cherub\'s.";
csb[27] = "Then he put the cherubim inside the inner temple. Since their wings were spread out, the first one\'s wing touched one wall while the second cherub\'s wing touched the other wall, and in the middle of the temple their wings were touching wing to wing.";
csb[28] = "He also overlaid the cherubim with gold.";
csb[29] = "He carved all the surrounding temple walls with carved engravings -- cherubim, palm trees, and flower blossoms -- in the inner and outer sanctuaries.";
csb[30] = "He overlaid the temple floor with gold in both the inner and the outer sanctuaries.";
csb[31] = "For the entrance of the inner sanctuary, he made olive wood doors. The pillars of the doorposts were five-sided.";
csb[32] = "The two doors were made of olive wood. He carved cherubim, palm trees, and flower blossoms on them and overlaid them with gold, hammering gold over the cherubim and palm trees.";
csb[33] = "In the same way, he made four-sided olive wood doorposts for the sanctuary entrance.";
csb[34] = "The two doors were made of cypress wood; the first door had two folding sides, and the second door had two folding panels.";
csb[35] = "He carved cherubim, palm trees, and flower blossoms on them and overlaid them with gold applied evenly over the carving.";
csb[36] = "He built the inner courtyard with three rows of dressed stone and a row of trimmed cedar beams.";
csb[37] = "The foundation of the LORD\'s temple was laid in Solomon\'s fourth year in the month of Ziv.";
csb[38] = "In his eleventh year in the month of Bul, which is the eighth month, the temple was completed in every detail and according to every specification. So he built it in seven years.";
kjv[1] = "And it came to pass in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon\'s reign over Israel, in the month Zif, which [is] the second month, that he began to build the house of the LORD.";
rsv[1] = "In the four hundred and eightieth year after the people of Israel came out of the land of Egypt, in the fourth year of Solomon\'s reign over Israel, in the month of Ziv, which is the second month, he began to build the house of the LORD.";
asv[1] = "And it came to pass in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon\'s reign over Israel, in the month Ziv, which is the second month, that he began to build the house of Jehovah.";
yng[1] = "And it cometh to pass, in the four hundred and eightieth year of the going out of the sons of Israel from the land of Egypt, in the fourth year -- in the month of Zif, it [is] the second month -- of the reigning of Solomon over Israel, that he buildeth the house for Jehovah.";
dby[1] = "And it came to pass in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon\'s reign over Israel, in the month Zif, which is the second month, that he began to build the house of Jehovah.";
web[1] = "And it came to pass in the four hundred and eightieth year after the children of Israel had come out of the land of Egypt, in the fourth year of Solomon\'s reign over Israel, in the month of Zif, which [is] the second month, that he began to build the house of the LORD.";
hnv[1] = "It happened in the four hundred and eightieth year after the children of Yisra\'el were come out of the land of Mitzrayim, in the fourth year of Shlomo\'s reign over Yisra\'el, in the month Ziv, which is the second month, that he began to build the house of the LORD.";
vul[1] = "factum est igitur quadringentesimo et octogesimo anno egressionis filiorum Israhel de terra Aegypti in anno quarto mense zio ipse est mensis secundus regis Salomonis super Israhel aedificare coepit domum Domino";

rsv[6] = "The lowest story was five cubits broad, the middle one was six cubits broad, and the third was seven cubits broad; for around the outside of the house he made offsets on the wall in order that the supporting beams should not be inserted into the walls of the house.";

dby[6] = "The lowest floor was five cubits broad, and the middle one was six cubits broad, and the third was seven cubits broad; for in the [thickness of the wall of] the house he made resets round about outside, that nothing should be fastened in the walls of the house.";
