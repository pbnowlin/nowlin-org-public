csb[1] = "King Solomon loved many foreign women in addition to Pharaoh\'s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women";
csb[2] = "from the nations about which the LORD had told the Israelites, &quot;You must not intermarry with them, and they must not intermarry with you, because they will turn your heart away to follow their gods.&quot; To these women Solomon was deeply attached in love.";
csb[3] = "He had seven hundred wives who were princesses and three hundred who were concubines, and they turned his heart away.";
csb[4] = "When Solomon was old, his wives turned his heart away to follow other gods. He was not wholeheartedly devoted to the LORD his God, as his father David had been.";
csb[5] = "Solomon followed Ashtoreth, the goddess of the Sidonians, and Milcom, the abhorrent idol of the Ammonites.";
csb[6] = "Solomon did what was evil in the LORD\'s sight, and unlike his father David, he did not remain loyal to the LORD.";
csb[7] = "At that time, Solomon built a high place for Chemosh, the abhorrent idol of Moab, and for Milcom, the abhorrent idol of the Ammonites, on the hill across from Jerusalem.";
csb[8] = "He did the same for all his foreign wives, who were burning incense and offering sacrifices to their gods.";
csb[9] = "The LORD was angry with Solomon, because his heart had turned away from the LORD, the God of Israel, who had appeared to him twice.";
csb[10] = "He had commanded him about this, so that he would not follow other gods, but Solomon did not do what the LORD had commanded.";
csb[11] = "Then the LORD said to Solomon, &quot;Since you have done this and did not keep my covenant and my statutes, which I commanded you, I will tear the kingdom away from you and give it to your servant.";
csb[12] = "&quot;However, I will not do it during your lifetime for the sake of your father David; I will tear it out of your son\'s hand.";
csb[13] = "&quot;Yet I will not tear the entire kingdom away from him. I will give one tribe to your son for the sake of my servant David and for the sake of Jerusalem that I chose.&quot;";
csb[14] = "So the LORD raised up Hadad the Edomite as an enemy against Solomon. He was of the royal family in Edom.";
csb[15] = "Earlier, when David was in Edom, Joab, the commander of the army, had gone to bury the dead and had struck down every male in Edom.";
csb[16] = "For Joab and all Israel had remained there six months, until he had killed every male in Edom.";
csb[17] = "Hadad fled to Egypt, along with some Edomites from his father\'s servants. At the time Hadad was a small boy.";
csb[18] = "Hadad and his men set out from Midian and went to Paran. They took men with them from Paran and went to Egypt, to Pharaoh king of Egypt, who gave Hadad a house, ordered that he be given food, and gave him land.";
csb[19] = "Pharaoh liked Hadad so much that he gave him a wife, the sister of his own wife, Queen Tahpenes.";
csb[20] = "Tahpenes\'s sister gave birth to Hadad\'s son Genubath. Tahpenes herself weaned him in Pharaoh\'s palace, and Genubath lived there along with Pharaoh\'s sons.";
csb[21] = "When Hadad heard in Egypt that David rested with his fathers and that Joab, the commander of the army, was dead, Hadad said to Pharaoh, &quot;Let me leave, so I may go to my own country.&quot;";
csb[22] = "But Pharaoh asked him, &quot;What do you lack here with me for you to want to go back to your own country? &quot; &quot;Nothing,&quot; he replied, &quot;but please let me leave.&quot;";
csb[23] = "God raised up Rezon son of Eliada as an enemy against Solomon. Rezon had fled from his master King Hadadezer of Zobah";
csb[24] = "and gathered men to himself. He became leader of a raiding party when David killed the Zobaites. He went to Damascus, lived there, and became king in Damascus.";
csb[25] = "Rezon was Israel\'s enemy throughout Solomon\'s reign, adding to the trouble Hadad had caused. He reigned over Aram and loathed Israel.";
csb[26] = "Now Solomon\'s servant, Jeroboam son of Nebat, was an Ephraimite from Zeredah. His widowed mother\'s name was Zeruah. Jeroboam rebelled against Solomon,";
csb[27] = "and this is the reason he rebelled against the king: Solomon had built the supporting terraces and repaired the opening in the wall of the city of his father David.";
csb[28] = "Now the man Jeroboam was capable, and Solomon noticed the young man because he was getting things done. So he appointed him over the entire labor force of the house of Joseph.";
csb[29] = "During that time, the prophet Ahijah the Shilonite met Jeroboam on the road as Jeroboam came out of Jerusalem. Now Ahijah had wrapped himself with a new cloak, and the two of them were alone in the open field.";
csb[30] = "Then Ahijah took hold of the new cloak he had on, tore it into twelve pieces,";
csb[31] = "and said to Jeroboam, &quot;Take ten pieces for yourself, for this is what the LORD God of Israel says: \'I am about to tear the kingdom out of Solomon\'s hand. I will give you ten tribes,";
csb[32] = "&quot;but one tribe will remain his for the sake of my servant David and for the sake of Jerusalem, the city I chose out of all the tribes of Israel.";
csb[33] = "&quot;For they have abandoned me; they have bowed down to Ashtoreth, the goddess of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites. They have not walked in my ways to do what is right in my sight and to carry out my statutes and my judgments as his father David did.";
csb[34] = "&quot; \'However, I will not take the whole kingdom from him but will let him be ruler all the days of his life for the sake of my servant David, whom I chose and who kept my commands and my statutes.";
csb[35] = "&quot;I will take ten tribes of the kingdom from his son and give them to you.";
csb[36] = "&quot;I will give one tribe to his son, so that my servant David will always have a lamp before me in Jerusalem, the city I chose for myself to put my name there.";
csb[37] = "&quot;I will appoint you, and you will reign as king over all you want, and you will be king over Israel.";
csb[38] = "&quot; \'After that, if you obey all I command you, walk in my ways, and do what is right in my sight in order to keep my statutes and my commands as my servant David did, I will be with you. I will build you a lasting dynasty just as I built for David, and I will give you Israel.";
csb[39] = "&quot;I will humble David\'s descendants, because of their unfaithfulness, but not forever.\' &quot;";
csb[40] = "Therefore, Solomon tried to kill Jeroboam, but he fled to Egypt, to King Shishak of Egypt, where he remained until Solomon\'s death.";
csb[41] = "The rest of the events of Solomon\'s reign, along with all his accomplishments and his wisdom, are written in the Book of Solomon\'s Events.";
csb[42] = "The length of Solomon\'s reign in Jerusalem over all Israel totaled forty years.";
csb[43] = "Solomon rested with his fathers and was buried in the city of his father David. His son Rehoboam became king in his place.";

hnv[17] = "that Hadad fled, he and certain Edom of his father\'s servants with him, to go into Mitzrayim, Hadad being yet a little child.";
vul[17] = "fugit Adad ipse et viri idumei de servis patris eius cum eo ut ingrederetur Aegyptum erat autem Adad puer parvulus";
kjv[18] = "And they arose out of Midian, and came to Paran: and they took men with them out of Paran, and they came to Egypt, unto Pharaoh king of Egypt; which gave him an house, and appointed him victuals, and gave him land.";
rsv[18] = "They set out from Mid\'ian and came to Paran, and took men with them from Paran and came to Egypt, to Pharaoh king of Egypt, who gave him a house, and assigned him an allowance of food, and gave him land.";
asv[18] = "And they arose out of Midian, and came to Paran; and they took men with them out of Paran, and they came to Egypt, unto Pharaoh king of Egypt, who gave him a house, and appointed him victuals, and gave him land.";
yng[18] = "and they rise out of Midian, and come into Paran, and take men with them out of Paran, and come in to Egypt, unto Pharaoh king of Egypt, and he giveth to him a house, and bread hath commanded for him, and land hath given to him.";
dby[18] = "And they arose out of Midian, and came to Paran, and took men with them out of Paran, and they came to Egypt, to Pharaoh king of Egypt; who gave him a house, and appointed him victuals, and gave him land.";
web[18] = "And they arose out of Midian, and came to Paran: and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt; who gave him a house, and appointed him victuals, and gave him land.";
hnv[18] = "They arose out of Midyan, and came to Paran; and they took men with them out of Paran, and they came to Mitzrayim, to Par`oh king of Mitzrayim, who gave him a house, and appointed him victuals, and gave him land.";
vul[18] = "cumque surrexissent de Madian venerunt in Pharan tuleruntque secum viros de Pharan et introierunt Aegyptum ad Pharaonem regem Aegypti qui dedit ei domum et cibos constituit et terram delegavit";
kjv[19] = "And Hadad found great favour in the sight of Pharaoh, so that he gave him to wife the sister of his own wife, the sister of Tahpenes the queen.";
rsv[19] = "And Hadad found great favor in the sight of Pharaoh, so that he gave him in marriage the sister of his own wife, the sister of Tah\'penes the queen.";
asv[19] = "And Hadad found great favor in the sight of Pharaoh, so that he gave him to wife the sister of his own wife, the sister of Tahpenes the queen.";
yng[19] = "And Hadad findeth grace in the eyes of Pharaoh exceedingly, and he giveth to him a wife, the sister of his own wife, sister of Tahpenes the mistress;";
dby[19] = "And Hadad found great favour in the sight of Pharaoh, and he gave him as wife the sister of his own wife, the sister of Tahpenes the queen.";
web[19] = "And Hadad found great favor in the sight of Pharaoh, so that he gave him for a wife the sister of his own wife, the sister of Tahpenes the queen.";
hnv[19] = "Hadad found great favor in the sight of Par`oh, so that he gave him as wife the sister of his own wife, the sister of Tachpenes the queen.";
vul[19] = "et invenit Adad gratiam coram Pharao valde in tantum ut daret ei uxorem sororem uxoris suae germanam Tafnes reginae";
kjv[20] = "And the sister of Tahpenes bare him Genubath his son, whom Tahpenes weaned in Pharaoh\'s house: and Genubath was in Pharaoh\'s household among the sons of Pharaoh.";
rsv[20] = "And the sister of Tah\'penes bore him Genu\'bath his son, whom Tah\'penes weaned in Pharaoh\'s house; and Genu\'bath was in Pharaoh\'s house among the sons of Pharaoh.";
asv[20] = "And the sister of Tahpenes bare him Genubath his son, whom Tahpenes weaned in Pharaoh\'s house; and Genubath was in Pharaoh\'s house among the sons of Pharaoh.";
yng[20] = "and the sister of Tahpenes beareth to him Genubath his son, and Tahpenes weaneth him within the house of Pharaoh, and Genubath is in the house of Pharaoh in the midst of the sons of Pharaoh.";
dby[20] = "And the sister of Tahpenes bore him Genubath his son; and Tahpenes brought him up in Pharaoh\'s house; and Genubath was in Pharaoh\'s household, among the sons of Pharaoh.";
web[20] = "And the sister of Tahpenes bore him Genubath his son, whom Tahpenes weaned in Pharaoh\'s house: and Genubath was in Pharaoh\'s household among the sons of Pharaoh.";
hnv[20] = "The sister of Tachpenes bore him Genuvat his son, whom Tachpenes weaned in Par`oh\'s house; and Genuvat was in Par`oh\'s house among the sons of Par`oh.";
vul[20] = "genuitque ei soror Tafnes Genebath filium et nutrivit eum Tafnes in domo Pharaonis eratque Genebath habitans apud Pharaonem cum filiis eius";
kjv[21] = "And when Hadad heard in Egypt that David slept with his fathers, and that Joab the captain of the host was dead, Hadad said to Pharaoh, Let me depart, that I may go to mine own country.";
rsv[21] = "But when Hadad heard in Egypt that David slept with his fathers and that Jo\'ab the commander of the army was dead, Hadad said to Pharaoh, &quot;Let me depart, that I may go to my own country.&quot;";
asv[21] = "And when Hadad heard in Egypt that David slept with his fathers, and that Joab the captain of the host was dead, Hadad said to Pharaoh, Let me depart, that I may go to mine own country.";
yng[21] = "And Hadad hath heard in Egypt that David hath lain with his fathers, and that Joab head of the host is dead, and Hadad saith unto Pharaoh, `Send me away, and I go unto my land.\'";
dby[21] = "And Hadad heard in Egypt that David slept with his fathers, and that Joab the captain of the host was dead; and Hadad said to Pharaoh, Let me depart, that I may go to mine own country.";
web[21] = "And when Hadad heard in Egypt that David slept with his fathers, and that Joab the captain of the host was dead, Hadad said to Pharaoh, Let me depart, that I may go to my own country.";
hnv[21] = "When Hadad heard in Mitzrayim that David slept with his fathers, and that Yo\'av the captain of the host was dead, Hadad said to Par`oh, Let me depart, that I may go to my own country.";
vul[21] = "cumque audisset Adad in Aegypto dormisse David cum patribus suis et mortuum esse Ioab principem militiae dixit Pharaoni dimitte me ut vadam in terram meam";
kjv[22] = "Then Pharaoh said unto him, But what hast thou lacked with me, that, behold, thou seekest to go to thine own country? And he answered, Nothing: howbeit let me go in any wise.";
rsv[22] = "But Pharaoh said to him, &quot;What have you lacked with me that you are now seeking to go to your own country?&quot; And he said to him, &quot;Only let me go.&quot;";
asv[22] = "Then Pharaoh said unto him, But what hast thou lacked with me, that, behold, thou seekest to go to thine own country? And he answered, Nothing: howbeit only let me depart.";
yng[22] = "And Pharaoh saith to him, `But, what art thou lacking with me, that lo, thou art seeking to go unto thine own land?\' and he saith, `Nay, but thou dost certainly send me away.\'";
dby[22] = "And Pharaoh said to him, What then dost thou lack with me, that behold, thou desirest to go to thine own country? And he said, Nothing; but in any case let me depart.";
web[22] = "Then Pharaoh said to him, But what hast thou lacked with me, that, behold, thou seekest to go to thy own country? And he answered, Nothing: yet, in any wise let me go.";
hnv[22] = "Then Par`oh said to him, But what have you lacked with me, that behold, you seek to go to your own country? He answered, Nothing: however only let me depart.";
vul[22] = "dixitque ei Pharao qua enim re apud me indiges ut quaeras ire ad terram tuam at ille respondit nulla sed obsecro ut dimittas me";
kjv[23] = "And God stirred him up [another] adversary, Rezon the son of Eliadah, which fled from his lord Hadadezer king of Zobah:";
rsv[23] = "God also raised up as an adversary to him, Rezon the son of Eli\'ada, who had fled from his master Hadade\'zer king of Zobah.";
asv[23] = "And God raised up [another] adversary unto him, Rezon the son of Eliada, who had fled from his lord Hadadezer king of Zobah.";
yng[23] = "And God raiseth to him an adversary, Rezon son of Eliadah, who hath fled from Hadadezer king of Zobah, his lord,";
dby[23] = "God stirred him up yet an adversary, Rezon the son of Eliada, who had fled from Hadadezer king of Zobah, his lord.";
web[23] = "And God stirred him up [another] adversary, Rezon the son of Eliadah, who fled from his lord Hadadezer king of Zobah:";
hnv[23] = "God raised up [another] adversary to him, Rezon the son of Elyada, who had fled from his lord Hadad`ezer king of Tzovah.";
vul[23] = "suscitavit quoque ei Deus adversarium Razon filium Heliada qui fugerat Adadezer regem Soba dominum suum";
kjv[24] = "And he gathered men unto him, and became captain over a band, when David slew them [of Zobah]: and they went to Damascus, and dwelt therein, and reigned in Damascus.";
rsv[24] = "And he gathered men about him and became leader of a marauding band, after the slaughter by David; and they went to Damascus, and dwelt there, and made him king in Damascus.";
asv[24] = "And he gathered men unto him, and became captain over a troop, when David slew them [of Zobah]: and they went to Damascus, and dwelt therein, and reigned in Damascus.";
yng[24] = "and gathereth unto himself men, and is head of a troop in David\'s slaying them, and they go to Damascus, and dwell in it, and reign in Damascus;";
dby[24] = "And he collected men to him, and became captain of a band, when David slew them [of Zobah]; and they went to Damascus, and dwelt there, and reigned in Damascus.";
web[24] = "And he gathered men to him, and became captain over a band, when David slew them [of Zobah]: and they went to Damascus, and dwelt in it, and reigned in Damascus.";
hnv[24] = "He gathered men to him, and became captain over a troop, when David killed them [of Tzovah]: and they went to Dammesek, and lived therein, and reigned in Dammesek.";
vul[24] = "et congregavit contra eum viros et factus est princeps latronum cum interficeret eos David abieruntque Damascum et habitaverunt ibi et constituerunt eum regem in Damasco";
kjv[25] = "And he was an adversary to Israel all the days of Solomon, beside the mischief that Hadad [did]: and he abhorred Israel, and reigned over Syria.";
rsv[25] = "He was an adversary of Israel all the days of Solomon, doing mischief as Hadad did; and he abhorred Israel, and reigned over Syria.";
asv[25] = "And he was an adversary to Israel all the days of Solomon, besides the mischief that Hadad [did]: and he abhorred Israel, and reigned over Syria.";
yng[25] = "and he is an adversary to Israel all the days of Solomon, (besides the evil that Hadad [did]), and he cutteth off in Israel, and reigneth over Aram.";
dby[25] = "And he was an adversary to Israel all the days of Solomon, besides the mischief that Hadad [did]; and he abhorred Israel, and reigned over Syria.";
web[25] = "And he was an adversary to Israel all the days of Solomon, besides the mischief that Hadad [did]: and he abhorred Israel, and reigned over Syria.";
hnv[25] = "He was an adversary to Yisra\'el all the days of Shlomo, besides the mischief that Hadad [did]: and he abhorred Yisra\'el, and reigned over Aram.";
vul[25] = "eratque adversarius Israhel cunctis diebus Salomonis et hoc est malum Adad et odium contra Israhel regnavitque in Syria";
kjv[26] = "And Jeroboam the son of Nebat, an Ephrathite of Zereda, Solomon\'s servant, whose mother\'s name [was] Zeruah, a widow woman, even he lifted up [his] hand against the king.";
rsv[26] = "Jerobo\'am the son of Nebat, an E\'phraimite of Zer\'edah, a servant of Solomon, whose mother\'s name was Zeru\'ah, a widow, also lifted up his hand against the king.";
asv[26] = "And Jeroboam the son of Nebat, an Ephraimite of Zeredah, a servant of Solomon, whose mother\'s name was Zeruah, a widow, he also lifted up his hand against the king.";
yng[26] = "And Jeroboam son of Nebat, an Ephrathite of Zereda -- the name of whose mother [is] Zeruah, a widow woman -- servant to Solomon, he also lifteth up a hand against the king;";
dby[26] = "And Jeroboam the son of Nebat, an Ephrathite of Zeredah, Solomon\'s servant (whose mother\'s name was Zeruah, a widow woman), even he lifted up his hand against the king.";
web[26] = "And Jeroboam the son of Nebat, an Ephrathite of Zereda, Solomon\'s servant, whose mother\'s name [was] Zeruah, a widow woman, even he raised [his] hand against the king.";
hnv[26] = "Yarov`am the son of Nevat, an Efratite of Tzeredata, a servant of Shlomo, whose mother\'s name was Tzeru`ah, a widow, he also lifted up his hand against the king.";
vul[26] = "Hieroboam quoque filius Nabath Ephratheus de Sareda cuius mater erat nomine Sarva mulier vidua servus Salomonis levavit manum contra regem";
kjv[27] = "And this [was] the cause that he lifted up [his] hand against the king: Solomon built Millo, [and] repaired the breaches of the city of David his father.";
rsv[27] = "And this was the reason why he lifted up his hand against the king. Solomon built the Millo, and closed up the breach of the city of David his father.";
asv[27] = "And this was the reason why he lifted up his hand against the king: Solomon built Millo, and repaired the breach of the city of David his father.";
yng[27] = "and this [is] the thing [for] which he lifted up a hand against the king: Solomon built Millo -- he shut up the breach of the city of David his father,";
dby[27] = "And this was the cause that he lifted up his hand against the king: Solomon was building Millo, and closing the breach of the city of David his father;";
web[27] = "And this [was] the cause why he raised [his] hand against the king: Solomon built Millo, [and] repaired the breaches of the city of David his father.";
hnv[27] = "This was the reason why he lifted up his hand against the king: Shlomo built Millo, and repaired the breach of the city of David his father.";
vul[27] = "et haec causa rebellionis adversus eum quia Salomon aedificavit Mello et coaequavit voraginem civitatis David patris sui";
kjv[28] = "And the man Jeroboam [was] a mighty man of valour: and Solomon seeing the young man that he was industrious, he made him ruler over all the charge of the house of Joseph.";
rsv[28] = "The man Jerobo\'am was very able, and when Solomon saw that the young man was industrious he gave him charge over all the forced labor of the house of Joseph.";
asv[28] = "And the man Jeroboam was a mighty man of valor; and Solomon saw the young man that he was industrious, and he gave him charge over all the labor of the house of Joseph.";
yng[28] = "and the man Jeroboam [is] mighty in valour, and Solomon seeth the young man that he is doing business, and appointeth him over all the burden of the house of Joseph.";
dby[28] = "and the man Jeroboam was strong and valiant; and Solomon saw the young man that he was industrious, and he made him ruler over all the charge of the house of Joseph.";
web[28] = "And the man Jeroboam [was] a mighty man of valor: and Solomon, seeing the young man that he was industrious, he made him ruler over all the charge of the house of Joseph.";
hnv[28] = "The man Yarov`am was a mighty man of valor; and Shlomo saw the young man that he was industrious, and he gave him charge over all the labor of the house of Yosef.";
vul[28] = "erat autem Hieroboam vir fortis et potens vidensque Salomon adulescentem bonae indolis et industrium constituerat eum praefectum super tributa universae domus Ioseph";
kjv[29] = "And it came to pass at that time when Jeroboam went out of Jerusalem, that the prophet Ahijah the Shilonite found him in the way; and he had clad himself with a new garment; and they two [were] alone in the field:";
rsv[29] = "And at that time, when Jerobo\'am went out of Jerusalem, the prophet Ahi\'jah the Shi\'lonite found him on the road. Now Ahi\'jah had clad himself with a new garment; and the two of them were alone in the open country.";
asv[29] = "And it came to pass at that time, when Jeroboam went out of Jerusalem, that the prophet Ahijah the Shilonite found him in the way; now [Ahijah] had clad himself with a new garment; and they two were alone in the field.";
yng[29] = "And it cometh to pass, at that time, that Jeroboam hath gone out from Jerusalem, and Ahijah the Shilonite, the prophet, findeth him in the way, and he is covering himself with a new garment; and both of them [are] by themselves in a field,";
dby[29] = "And it came to pass at that time that Jeroboam went out of Jerusalem, and the prophet Ahijah the Shilonite found him in the way; and he had clad himself with a new garment; and they two were alone in the field.";
web[29] = "And it came to pass at that time when Jeroboam went out of Jerusalem, that the prophet Ahijah the Shilonite found him in the way; and he had clad himself with a new garment; and they two [were] alone in the field:";
hnv[29] = "It happened at that time, when Yarov`am went out of Yerushalayim, that the prophet Achiyah the Shiloni found him in the way; now [Achiyah] had clad himself with a new garment; and they two were alone in the field.";
vul[29] = "factum est igitur in tempore illo ut Hieroboam egrederetur de Hierusalem et inveniret eum Ahias Silonites propheta in via opertus pallio novo erant autem duo tantum in agro";
kjv[30] = "And Ahijah caught the new garment that [was] on him, and rent it [in] twelve pieces:";
rsv[30] = "Then Ahi\'jah laid hold of the new garment that was on him, and tore it into twelve pieces.";
asv[30] = "And Ahijah laid hold of the new garment that was on him, and rent it in twelve pieces.";
yng[30] = "and Ahijah layeth hold on the new garment that [is] on him, and rendeth it -- twelve pieces,";
dby[30] = "Then Ahijah seized the new garment that was on him, and rent it in twelve pieces;";
web[30] = "And Ahijah caught the new garment that [was] on him, and rent it [in] twelve pieces:";
hnv[30] = "Achiyah laid hold of the new garment that was on him, and tore it in twelve pieces.";
vul[30] = "adprehendensque Ahia pallium suum novum quo opertus erat scidit in duodecim partes";
kjv[31] = "And he said to Jeroboam, Take thee ten pieces: for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee:";
rsv[31] = "And he said to Jerobo\'am, &quot;Take for yourself ten pieces; for thus says the LORD, the God of Israel, \'Behold, I am about to tear the kingdom from the hand of Solomon, and will give you ten tribes";
asv[31] = "And he said to Jeroboam, Take thee ten pieces; for thus saith Jehovah, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee";
yng[31] = "and saith to Jeroboam, `Take to thee ten pieces, for thus said Jehovah, God of Israel, lo, I am rending the kingdom out of the hand of Solomon, and have given to thee the ten tribes,";
dby[31] = "and said to Jeroboam, Take thee ten pieces; for thus saith Jehovah the God of Israel: Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee;";
web[31] = "And he said to Jeroboam, Take thee ten pieces: for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom from the hand of Solomon, and will give ten tribes to thee:";
hnv[31] = "He said to Yarov`am, Take ten pieces; for thus says the LORD, the God of Yisra\'el, Behold, I will tear the kingdom out of the hand of Shlomo, and will give ten tribes to you";
vul[31] = "et ait ad Hieroboam tolle tibi decem scissuras haec enim dicit Dominus Deus Israhel ecce ego scindam regnum de manu Salomonis et dabo tibi decem tribus";
kjv[32] = "(But he shall have one tribe for my servant David\'s sake, and for Jerusalem\'s sake, the city which I have chosen out of all the tribes of Israel:)";
rsv[32] = "(but he shall have one tribe, for the sake of my servant David and for the sake of Jerusalem, the city which I have chosen out of all the tribes of Israel),";
asv[32] = "(but he shall have one tribe, for my servant David\'s sake and for Jerusalem\'s sake, the city which I have chosen out of all the tribes of Israel);";
yng[32] = "and the one tribe he hath for My servant David\'s sake, and for Jerusalem\'s sake, the city which I have fixed on, out of all the tribes of Israel.";
dby[32] = "but one tribe shall he have for my servant David\'s sake, and for Jerusalem\'s sake, the city which I have chosen out of all the tribes of Israel:";
web[32] = "(But he shall have one tribe for my servant David\'s sake, and for Jerusalem\'s sake, the city which I have chosen out of all the tribes of Israel:)";
hnv[32] = "(but he shall have one tribe, for my servant David\'s sake and for Yerushalayim\'s sake, the city which I have chosen out of all the tribes of Yisra\'el);";
vul[32] = "porro una tribus remanebit ei propter servum meum David et Hierusalem civitatem quam elegi ex omnibus tribubus Israhel";
kjv[33] = "Because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon, and have not walked in my ways, to do [that which is] right in mine eyes, and [to keep] my statutes and my judgments, as [did] David his father.";
rsv[33] = "because he has forsaken me, and worshiped Ash\'toreth the goddess of the Sido\'nians, Chemosh the god of Moab, and Milcom the god of the Ammonites, and has not walked in my ways, doing what is right in my sight and keeping my statutes and my ordinances, as David his father did.";
asv[33] = "because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Sidonians, Chemosh the god of Moab, and Milcom the god of the children of Ammon; and they have not walked in my ways, to do that which is right in mine eyes, and [to keep] my statutes and mine ordinances, as did David his father.";
yng[33] = "`Because they have forsaken Me, and bow themselves to Ashtoreth, god[dess] of the Zidonians, to Chemosh god of Moab, and to Milcom god of the sons of Ammon, and have not walked in My ways, to do that which [is] right in Mine eyes, and My statutes and My judgments, like David his father.";
dby[33] = "because they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon, and have not walked in my ways, to do that which is right in my sight, and my statutes and mine ordinances, as David his father.";
web[33] = "Because they have forsaken me, and have worshiped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon, and have not walked in my ways, to do [that which is] right in my eyes, and [to keep] my statutes and my judgments, as [did] David his father.";
hnv[33] = "because that they have forsaken me, and have worshiped `Ashoret the goddess of the Tzidonim, Kemosh the god of Mo\'av, and Milkom the god of the children of `Ammon; and they have not walked in my ways, to do that which is right in my eyes, and [to keep] my statutes and my ordinances, as did David his father.";
vul[33] = "eo quod dereliquerint me et adoraverint Astharoth deam Sidoniorum et Chamos deum Moab et Melchom deum filiorum Ammon et non ambulaverint in viis meis ut facerent iustitiam coram me et praecepta mea et iudicia sicut David pater eius";
kjv[34] = "Howbeit I will not take the whole kingdom out of his hand: but I will make him prince all the days of his life for David my servant\'s sake, whom I chose, because he kept my commandments and my statutes:";
rsv[34] = "Nevertheless I will not take the whole kingdom out of his hand; but I will make him ruler all the days of his life, for the sake of David my servant whom I chose, who kept my commandments and my statutes;";
asv[34] = "Howbeit I will not take the whole kingdom out of his hand; but I will make him prince all the days of his life, for David my servant\'s sake whom I chose, who kept my commandments and my statutes;";
yng[34] = "`And I do not take the whole of the kingdom out of his hand, for prince I make him all days of his life, for the sake of David My servant whom I chose, who kept My commands and My statutes;";
dby[34] = "But I will not take the whole kingdom out of his hand; for I will make him prince all the days of his life for David my servant\'s sake, whom I chose, who kept my commandments and my statutes;";
web[34] = "Yet I will not take the whole kingdom out of his hand: but I will make him prince all the days of his life for David my servant\'s sake, whom I chose, because he kept my commandments and my statutes:";
hnv[34] = "However I will not take the whole kingdom out of his hand; but I will make him prince all the days of his life, for David my servant\'s sake whom I chose, who kept my mitzvot and my statutes;";
vul[34] = "nec auferam omne regnum de manu eius sed ducem ponam eum cunctis diebus vitae suae propter David servum meum quem elegi qui custodivit mandata mea et praecepta mea";
kjv[35] = "But I will take the kingdom out of his son\'s hand, and will give it unto thee, [even] ten tribes.";
rsv[35] = "but I will take the kingdom out of his son\'s hand, and will give it to you, ten tribes.";
asv[35] = "but I will take the kingdom out of his son\'s hand, and will give it unto thee, even ten tribes.";
yng[35] = "and I have taken the kingdom out of the hand of his son, and given it to thee -- the ten tribes;";
dby[35] = "but I will take the kingdom out of his son\'s hand, and will give it unto thee, -- the ten tribes.";
web[35] = "But I will take the kingdom out of his son\'s hand, and will give it to thee, [even] ten tribes.";
hnv[35] = "but I will take the kingdom out of his son\'s hand, and will give it to you, even ten tribes.";
vul[35] = "auferam autem regnum de manu filii eius et dabo tibi decem tribus";
kjv[36] = "And unto his son will I give one tribe, that David my servant may have a light alway before me in Jerusalem, the city which I have chosen me to put my name there.";
rsv[36] = "Yet to his son I will give one tribe, that David my servant may always have a lamp before me in Jerusalem, the city where I have chosen to put my name.";
asv[36] = "And unto his son will I give one tribe, that David my servant may have a lamp alway before me in Jerusalem, the city which I have chosen me to put my name there.";
yng[36] = "and to his son I give one tribe, for there being a lamp to David My servant all the days before Me in Jerusalem, the city that I have chosen to Myself to put My name there.";
dby[36] = "And unto his son will I give one tribe, that David my servant may have a lamp always before me in Jerusalem, the city that I have chosen for myself to put my name there.";
web[36] = "And to his son will I give one tribe, that David my servant may have a light always before me in Jerusalem, the city which I have chosen for me to put my name there.";

kjv[37] = "And I will take thee, and thou shalt reign according to all that thy soul desireth, and shalt be king over Israel.";

kjv[38] = "And it shall be, if thou wilt hearken unto all that I command thee, and wilt walk in my ways, and do [that is] right in my sight, to keep my statutes and my commandments, as David my servant did; that I will be with thee, and build thee a sure house, as I built for David, and will give Israel unto thee.";
rsv[38] = "And if you will hearken to all that I command you, and will walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, I will be with you, and will build you a sure house, as I built for David, and I will give Israel to you.";
asv[38] = "And it shall be, if thou wilt hearken unto all that I command thee, and wilt walk in my ways, and do that which is right in mine eyes, to keep my statutes and my commandments, as David my servant did; that I will be with thee, and will build thee a sure house, as I built for David, and will give Israel unto thee.";
yng[38] = "and it hath been, if thou dost hear all that I command thee, and hast walked in My ways, and done that which is right in Mine eyes, to keep My statutes and My commands, as did David My servant, that I have been with thee, and have built for thee a stedfast house, as I built for David, and have given to thee Israel,";
dby[38] = "And it shall be, if thou wilt hearken unto all that I command thee, and wilt walk in my ways, and do that which is right in my sight, in keeping my statutes and my commandments, as David my servant did, that I will be with thee, and build thee a lasting house, as I built for David, and will give Israel unto thee.";
web[38] = "And it shall be, if thou wilt hearken to all that I command thee, and wilt walk in my ways, and do right in my sight, to keep my statutes and my commandments, as David my servant did; that I will be with thee, and build thee a sure house, as I built for David, and will give Israel to thee.";
hnv[38] = "It shall be, if you will listen to all that I command you, and will walk in my ways, and do that which is right in my eyes, to keep my statutes and my mitzvot, as David my servant did; that I will be with you, and will build you a sure house, as I built for David, and will give Yisra\'el to you.";
vul[38] = "si igitur audieris omnia quae praecepero tibi et ambulaveris in viis meis et feceris quod rectum est coram me custodiens mandata mea et praecepta mea sicut fecit David servus meus ero tecum et aedificabo tibi domum fidelem quomodo aedificavi David et tradam tibi Israhel";
