csb[1] = "Now the word of the LORD came to Jehu son of Hanani against Baasha:";
csb[2] = "&quot;Because I raised you up from the dust and made you ruler over my people Israel, but you have walked in the ways of Jeroboam and have caused my people Israel to sin, angering me with their sins,";
csb[3] = "&quot;take note: I will eradicate Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat:";
csb[4] = "&quot;Anyone who belongs to Baasha and dies in the city, the dogs will eat, and anyone who is his and dies in the field, the birds will eat.&quot;";
csb[5] = "The rest of the events of Baasha\'s reign, along with all his accomplishments and might, are written in the Historical Record of Israel\'s Kings.";
csb[6] = "Baasha rested with his fathers and was buried in Tirzah. His son Elah became king in his place.";
csb[7] = "But through the prophet Jehu son of Hanani the word of the LORD also had come against Baasha and against his house because of all the evil he had done in the LORD\'s sight. His actions angered the LORD, and Baasha\'s house became like the house of Jeroboam, because he had struck it down.";
csb[8] = "In the twenty-sixth year of Judah\'s King Asa, Elah son of Baasha became king over Israel, and he reigned in Tirzah two years.";
csb[9] = "His servant Zimri, commander of half his chariots, conspired against him while Elah was in Tirzah getting drunk in the house of Arza, who was in charge of the household at Tirzah.";
csb[10] = "In the twenty-seventh year of Judah\'s King Asa, Zimri went in, struck Elah down, killing him. Then Zimri became king in his place.";
csb[11] = "When he became king, as soon as he was seated on his throne, Zimri struck down the entire house of Baasha. He did not leave a single male, including his kinsmen and his friends.";
csb[12] = "So Zimri destroyed the entire house of Baasha, according to the word of the LORD he had spoken against Baasha through the prophet Jehu.";
csb[13] = "This happened because of all the sins of Baasha and those of his son Elah, which they committed and caused Israel to commit, angering the LORD God of Israel with their worthless idols.";
csb[14] = "The rest of the events of Elah\'s reign, along with all his accomplishments, are written in the Historical Record of Israel\'s Kings.";
csb[15] = "In the twenty-seventh year of Judah\'s King Asa, Zimri became king for seven days in Tirzah. Now the troops were encamped against Gibbethon of the Philistines.";
csb[16] = "When these troops heard that Zimri had not only conspired but had also struck down the king, then all Israel made Omri, the army commander, king over Israel that very day in the camp.";
csb[17] = "Omri along with all Israel marched up from Gibbethon and besieged Tirzah.";
csb[18] = "When Zimri saw that the city was captured, he entered the citadel of the royal palace and burned it down over himself. He died";
csb[19] = "because of the sin he committed by doing what was evil in the LORD\'s sight and by walking in the ways of Jeroboam and the sin he caused Israel to commit.";
csb[20] = "The rest of the events of Zimri\'s reign, along with the conspiracy that he instigated, are written in the Historical Record of Israel\'s Kings.";
csb[21] = "At that time the people of Israel were divided: half the people followed Tibni son of Ginath, to make him king, and half followed Omri.";
csb[22] = "However, the people who followed Omri proved stronger than those who followed Tibni son of Ginath. So Tibni died and Omri became king.";
csb[23] = "In the thirty-first year of Judah\'s King Asa, Omri became king over Israel, and he reigned twelve years. He reigned six years in Tirzah,";
csb[24] = "then he bought the hill of Samaria from Shemer for 150 pounds of silver, and he built up the hill. He named the city he built Samaria based on the name Shemer, the owner of the hill.";
csb[25] = "Omri did what was evil in the LORD\'s sight; he did more evil than all who were before him.";
csb[26] = "He walked in all the ways of Jeroboam son of Nebat in every respect and continued in his sins that he caused Israel to commit, angering the LORD God of Israel with their worthless idols.";
csb[27] = "The rest of the events of Omri\'s reign, along with his accomplishments and the might he exercised, are written in the Historical Record of Israel\'s Kings.";
csb[28] = "Omri rested with his fathers and was buried in Samaria. His son Ahab became king in his place.";
csb[29] = "Ahab son of Omri became king over Israel in the thirty-eighth year of Judah\'s King Asa; Ahab son of Omri reigned over Israel in Samaria twenty-two years.";
csb[30] = "But Ahab son of Omri did what was evil in the LORD\'s sight more than all who were before him.";
csb[31] = "Then, as if following the sin of Jeroboam son of Nebat were not enough, he married Jezebel, the daughter of Ethbaal king of the Sidonians, and then proceeded to serve Baal and bow in worship to him.";
csb[32] = "He set up an altar for Baal in the temple of Baal that he had built in Samaria.";
csb[33] = "Ahab also made an Asherah pole. Ahab did more to anger the LORD God of Israel than all the kings of Israel who were before him.";
csb[34] = "During his reign, Hiel the Bethelite built Jericho. At the cost of Abiram his firstborn, he laid its foundation, and at the cost of Segub his youngest, he finished its gates, according to the word of the LORD he had spoken through Joshua son of Nun.";

kjv[7] = "And also by the hand of the prophet Jehu the son of Hanani came the word of the LORD against Baasha, and against his house, even for all the evil that he did in the sight of the LORD, in provoking him to anger with the work of his hands, in being like the house of Jeroboam; and because he killed him.";
rsv[7] = "Moreover the word of the LORD came by the prophet Jehu the son of Hana\'ni against Ba\'asha and his house, both because of all the evil that he did in the sight of the LORD, provoking him to anger with the work of his hands, in being like the house of Jerobo\'am, and also because he destroyed it.";
asv[7] = "And moreover by the prophet Jehu the son of Hanani came the word of Jehovah against Baasha, and against his house, both because of all the evil that he did in the sight of Jehovah, to provoke him to anger with the work of his hands, in being like the house of Jeroboam, and because he smote him.";
yng[7] = "And also by the hand of Jehu son of Hanani the prophet a word of Jehovah hath been concerning Baasha, and concerning his house, and concerning all the evil that he did in the eyes of Jehovah to provoke Him to anger with the work of his hands, to be like the house of Jeroboam, and concerning that for which he smote him.";
dby[7] = "And also through the prophet Jehu the son of Hanani the word of Jehovah came against Baasha, and against his house, even for all the evil that he did in the sight of Jehovah, provoking him to anger with the work of his hands, in being like the house of Jeroboam; and because he had smitten him.";
web[7] = "And also by the hand of the prophet Jehu the son of Hanani came the word of the LORD against Baasha, and against his house, even for all the evil that he did in the sight of the LORD, in provoking him to anger with the work of his hands, in being like the house of Jeroboam; and because he killed him.";
hnv[7] = "Moreover by the prophet Yehu the son of Hanani came the word of the LORD against Ba`sha, and against his house, both because of all the evil that he did in the sight of the LORD, to provoke him to anger with the work of his hands, in being like the house of Yarov`am, and because he struck him.";

dby[17] = "And Omri went up from Gibbethon, and all Israel with him, and they besieged Tirzah.";
web[17] = "And Omri went up from Gibbethon, and all Israel with him, and they besieged Tirzah.";
hnv[17] = "`Omri went up from Gibbeton, and all Yisra\'el with him, and they besieged Tirtzah.";

yng[18] = "And it cometh to pass, at Zimri\'s seeing that the city hath been captured, that he cometh in unto a high place of the house of the king, and burneth over him the house of the king with fire, and dieth,";
dby[18] = "And it came to pass when Zimri saw that the city was taken, that he went into the citadel of the king\'s house, and burned the king\'s house over him with fire;";

kjv[19] = "For his sins which he sinned in doing evil in the sight of the LORD, in walking in the way of Jeroboam, and in his sin which he did, to make Israel to sin.";
rsv[19] = "because of his sins which he committed, doing evil in the sight of the LORD, walking in the way of Jerobo\'am, and for his sin which he committed, making Israel to sin.";
asv[19] = "for his sins which he sinned in doing that which was evil in the sight of Jehovah, in walking in the way of Jeroboam, and in his sin which he did, to make Israel to sin.";
yng[19] = "for his sins that he sinned, to do the evil thing in the eyes of Jehovah, to walk in the way of Jeroboam, and in his sin that he did, to cause Israel to sin;";
dby[19] = "and he died for his sins which he sinned in doing evil in the sight of Jehovah, in walking in the way of Jeroboam, and in his sin which he did, making Israel to sin.";
web[19] = "For his sins which he sinned in doing evil in the sight of the LORD, in walking in the way of Jeroboam, and in his sin which he did, to make Israel to sin.";

vul[19] = "in peccatis suis quae peccaverat faciens malum coram Domino et ambulans in via Hieroboam et in peccato eius quo fecit peccare Israhel";

asv[20] = "Now the rest of the acts of Zimri, and his treason that he wrought, are they not written in the book of the chronicles of the kings of Israel?";
yng[20] = "and the rest of the matters of Zimri, and his conspiracy that he made, are they not written on the book of the Chronicles of the kings of Israel?";
dby[20] = "And the rest of the acts of Zimri, and his conspiracy which he wrought, are they not written in the book of the chronicles of the kings of Israel?";
web[20] = "Now the rest of the acts of Zimri, and his treason that he wrought, [are] they not written in the book of the chronicles of the kings of Israel?";

kjv[21] = "Then were the people of Israel divided into two parts: half of the people followed Tibni the son of Ginath, to make him king; and half followed Omri.";
rsv[21] = "Then the people of Israel were divided into two parts; half of the people followed Tibni the son of Ginath, to make him king, and half followed Omri.";
asv[21] = "Then were the people of Israel divided into two parts: half of the people followed Tibni the son of Ginath, to make him king; and half followed Omri.";
yng[21] = "Then are the sons of Israel parted into halves; half of the people hath been after Tibni son of Ginath to cause him to reign, and the half after Omri;";
dby[21] = "Then were the people of Israel divided into two parts: half of the people followed Tibni the son of Ginath, to make him king; and half followed Omri.";
web[21] = "Then were the people of Israel divided into two parts: half of the people followed Tibni the son of Ginath, to make him king; and half followed Omri.";
hnv[21] = "Then were the people of Yisra\'el divided into two parts: half of the people followed Tivni the son of Ginat, to make him king; and half followed `Omri.";
vul[21] = "tunc divisus est populus Israhel in duas partes media pars populi sequebatur Thebni filium Gineth ut constitueret eum regem et media pars Amri";
kjv[22] = "But the people that followed Omri prevailed against the people that followed Tibni the son of Ginath: so Tibni died, and Omri reigned.";
rsv[22] = "But the people who followed Omri overcame the people who followed Tibni the son of Ginath; so Tibni died, and Omri became king.";
asv[22] = "But the people that followed Omri prevailed against the people that followed Tibni the son of Ginath: so Tibni died, and Omri reigned.";
yng[22] = "and stronger are the people that are after Omri than the people that are after Tibni son of Ginath, and Tibni dieth, and Omri reigneth.";
dby[22] = "But the people that followed Omri overcame the people that followed Tibni the son of Ginath; and Tibni died, and Omri reigned.";
web[22] = "But the people that followed Omri prevailed against the people that followed Tibni the son of Ginath: so Tibni died, and Omri reigned.";
hnv[22] = " But the people who followed `Omri prevailed against the people who followed Tivni the son of Ginat: so Tivni died, and `Omri reigned.";
vul[22] = "praevaluit autem populus qui erat cum Amri populo qui sequebatur Thebni filium Gineth mortuusque est Thebni et regnavit Amri";
kjv[23] = "In the thirty and first year of Asa king of Judah began Omri to reign over Israel, twelve years: six years reigned he in Tirzah.";
rsv[23] = "In the thirty-first year of Asa king of Judah, Omri began to reign over Israel, and reigned for twelve years; six years he reigned in Tirzah.";
asv[23] = "In the thirty and first year of Asa king of Judah began Omri to reign over Israel, [and reigned] twelve years: six years reigned he in Tirzah.";
yng[23] = "In the thirty and first year of Asa king of Judah reigned hath Omri over Israel twelve years; in Tirzah he hath reigned six years,";
dby[23] = "In the thirty-first year of Asa king of Judah, Omri began to reign over Israel, -- twelve years; he reigned six years in Tirzah.";
web[23] = "In the thirty and first year of Asa king of Judah began Omri to reign over Israel, twelve years: six years reigned he in Tirzah.";
hnv[23] = "In the thirty-first year of Asa king of Yehudah began `Omri to reign over Yisra\'el, [and reigned] twelve years: six years reigned he in Tirtzah.";

kjv[24] = "And he bought the hill Samaria of Shemer for two talents of silver, and built on the hill, and called the name of the city which he built, after the name of Shemer, owner of the hill, Samaria.";
rsv[24] = "He bought the hill of Sama\'ria from Shemer for two talents of silver; and he fortified the hill, and called the name of the city which he built, Sama\'ria, after the name of Shemer, the owner of the hill.";
asv[24] = "And he bought the hill Samaria of Shemer for two talents of silver; and he built on the hill, and called the name of the city which he built, after the name of Shemer, the owner of the hill, Samaria.";
yng[24] = "and he buyeth the mount Samaria from Shemer, with two talents of silver, and buildeth [on] the mount, and calleth the name of the city that he hath built by the name of Shemer, lord of the hill -- Samaria.";
dby[24] = "And he bought the hill Samaria of Shemer for two talents of silver; and built on the hill, and called the name of the city that he built, after the name of Shemer, owner of the hill, Samaria.";
web[24] = "And he bought the hill Samaria of Shemer for two talents of silver, and built on the hill, and called the name of the city which he built, after the name of Shemer, owner of the hill, Samaria.";

rsv[25] = "Omri did what was evil in the sight of the LORD, and did more evil than all who were before him.";
asv[25] = "And Omri did that which was evil in the sight of Jehovah, and dealt wickedly above all that were before him.";
yng[25] = "And Omri doth the evil thing in the eyes of Jehovah, and doth evil above all who [are] before him,";
dby[25] = "And Omri wrought evil in the sight of Jehovah, and did worse than all that were before him.";
web[25] = "But Omri wrought evil in the eyes of the LORD, and did worse than all that [were] before him.";
hnv[25] = "`Omri did that which was evil in the sight of the LORD, and dealt wickedly above all who were before him.";
vul[25] = "fecit autem Amri malum in conspectu Domini et operatus est nequiter super omnes qui fuerant ante eum";

asv[26] = "For he walked in all the way of Jeroboam the son of Nebat, and in his sins wherewith he made Israel to sin, to provoke Jehovah, the God of Israel, to anger with their vanities.";
yng[26] = "and walketh in all the way of Jeroboam son of Nebat, and in his sin that he caused Israel to sin, to provoke Jehovah, God of Israel, with their vanities.";
dby[26] = "And he walked in all the way of Jeroboam the son of Nebat, and in his sins wherewith he made Israel to sin, provoking Jehovah the God of Israel to anger with their vanities.";
web[26] = "For he walked in all the way of Jeroboam the son of Nebat, and in his sin with which he made Israel to sin, to provoke the LORD God of Israel to anger with their vanities.";
hnv[26] = "For he walked in all the way of Yarov`am the son of Nevat, and in his sins with which he made Yisra\'el to sin, to provoke the LORD, the God of Yisra\'el, to anger with their vanities.";

asv[27] = "Now the rest of the acts of Omri which he did, and his might that he showed, are they not written in the book of the chronicles of the kings of Israel?";
yng[27] = "And the rest of the matters of Omri that he did, and his might that he got, are they not written on the book of the Chronicles of the kings of Israel?";

rsv[28] = "And Omri slept with his fathers, and was buried in Sama\'ria; and Ahab his son reigned in his stead.";
asv[28] = "So Omri slept with his fathers, and was buried in Samaria; and Ahab his son reigned in his stead.";
yng[28] = "And Omri lieth with his fathers, and is buried in Samaria, and Ahab his son reigneth in his stead.";
dby[28] = "And Omri slept with his fathers, and was buried in Samaria; and Ahab his son reigned in his stead.";
web[28] = "So Omri slept with his fathers, and was buried in Samaria: and Ahab his son reigned in his stead.";
hnv[28] = " So `Omri slept with his fathers, and was buried in Shomron; and Ach\'av his son reigned in his place.";
vul[28] = "et dormivit Amri cum patribus suis et sepultus est in Samaria regnavitque Ahab filius eius pro eo";

asv[30] = "And Ahab the son of Omri did that which was evil in the sight of Jehovah above all that were before him.";
yng[30] = "and Ahab son of Omri doth the evil thing in the eyes of Jehovah above all who [are] before him.";

vul[30] = "et fecit Ahab filius Amri malum in conspectu Domini super omnes qui fuerunt ante eum";
kjv[31] = "And it came to pass, as if it had been a light thing for him to walk in the sins of Jeroboam the son of Nebat, that he took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal, and worshipped him.";
rsv[31] = "And as if it had been a light thing for him to walk in the sins of Jerobo\'am the son of Nebat, he took for wife Jez\'ebel the daughter of Ethba\'al king of the Sido\'nians, and went and served Ba\'al, and worshiped him.";
asv[31] = "And it came to pass, as if it had been a light thing for him to walk in the sins of Jeroboam the son of Nebat, that he took to wife Jezebel the daughter of Ethbaal king of the Sidonians, and went and served Baal, and worshipped him.";
yng[31] = "And it cometh to pass -- hath it been light his walking in the sins of Jeroboam son of Nebat? -- then he taketh a wife, Jezebel daughter of Ethbaal, king of the Zidonians, and goeth and serveth Baal, and boweth himself to it,";
dby[31] = "And it came to pass, as if it was a light thing for him to walk in the sins of Jeroboam the son of Nebat, that he took as wife Jezebel the daughter of Ethbaal king of the Zidonians; and he went and served Baal and worshipped him.";
web[31] = "And it came to pass, as if it had been a light thing for him to walk in the sins of Jeroboam the son of Nebat, that he took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal, and worshiped him.";
hnv[31] = "It happened, as if it had been a light thing for him to walk in the sins of Yarov`am the son of Nevat, that he took as wife Izevel the daughter of Etba`al king of the Tzidonim, and went and served Ba`al, and worshiped him.";
vul[31] = "nec suffecit ei ut ambularet in peccatis Hieroboam filii Nabath insuper duxit uxorem Hiezabel filiam Ethbaal regis Sidoniorum et abiit et servivit Baal et adoravit eum";
kjv[32] = "And he reared up an altar for Baal in the house of Baal, which he had built in Samaria.";
rsv[32] = "He erected an altar for Ba\'al in the house of Ba\'al, which he built in Sama\'ria.";
asv[32] = "And he reared up an altar for Baal in the house of Baal, which he had built in Samaria.";
yng[32] = "and raiseth up an altar for Baal, in the house of the Baal, that he built in Samaria;";
dby[32] = "And he reared up an altar for Baal in the house of Baal, which he built in Samaria.";
web[32] = "And he erected an altar for Baal in the house of Baal, which he had built in Samaria.";
hnv[32] = "He reared up an altar for Ba`al in the house of Ba`al, which he had built in Shomron.";
vul[32] = "et posuit aram Baal in templo Baal quod aedificaverat in Samaria";
kjv[33] = "And Ahab made a grove; and Ahab did more to provoke the LORD God of Israel to anger than all the kings of Israel that were before him.";
rsv[33] = "And Ahab made an Ashe\'rah. Ahab did more to provoke the LORD, the God of Israel, to anger than all the kings of Israel who were before him.";
asv[33] = "And Ahab made the Asherah; and Ahab did yet more to provoke Jehovah, the God of Israel, to anger than all the kings of Israel that were before him.";
yng[33] = "and Ahab maketh the shrine, and Ahab addeth to do so as to provoke Jehovah, God of Israel, above all the kings of Israel who have been before him.";
dby[33] = "And Ahab made the Asherah; and Ahab did more to provoke Jehovah the God of Israel to anger than all the kings of Israel that were before him.";
web[33] = "And Ahab made a grove; and Ahab did more to provoke the LORD God of Israel to anger than all the kings of Israel that were before him.";
hnv[33] = "Ach\'av made the Asherah; and Ach\'av did yet more to provoke the LORD, the God of Yisra\'el, to anger than all the kings of Yisra\'el who were before him.";
vul[33] = "et plantavit lucum et addidit Ahab in opere suo inritans Dominum Deum Israhel super omnes reges Israhel qui fuerant ante eum";
kjv[34] = "In his days did Hiel the Bethelite build Jericho: he laid the foundation thereof in Abiram his firstborn, and set up the gates thereof in his youngest [son] Segub, according to the word of the LORD, which he spake by Joshua the son of Nun.";
rsv[34] = "In his days Hi\'el of Bethel built Jericho; he laid its foundation at the cost of Abi\'ram his first-born, and set up its gates at the cost of his youngest son Segub, according to the word of the LORD, which he spoke by Joshua the son of Nun.";
asv[34] = "In his days did Hiel the Beth-elite build Jericho: he laid the foundation thereof with the loss of Abiram his first-born, and set up the gates thereof with the loss of his youngest son Segub, according to the word of Jehovah, which he spake by Joshua the son of Nun.";
yng[34] = "In his days hath Hiel the Beth-Elite built Jericho; in Abiram his first-born he laid its foundation, and in Segub his youngest he set up its doors, according to the word of Jehovah that He spake by the hand of Joshua son of Nun.";
dby[34] = "In his days Hiel the Bethelite built Jericho; he laid its foundation in Abiram his firstborn, and set up its gates in Segub his youngest, according to the word of Jehovah which he spoke through Joshua the son of Nun.";
web[34] = "In his days Hiel the Beth-elite built Jericho: he laid the foundation of it in Abiram his first-born, and set up the gates of it in his youngest [son] Segub, according to the word of the LORD, which he spoke by Joshua the son of Nun.";
hnv[34] = "In his days did Hi\'el the Beit-Eli build Yericho: he laid the foundation of it with the loss of Aviram his firstborn, and set up the gates of it with the loss of his youngest son Seguv, according to the word of the LORD, which he spoke by Yehoshua the son of Nun.";
vul[34] = "in diebus eius aedificavit Ahiel de Bethel Hiericho in Abiram primitivo suo fundavit eam et in Segub novissimo suo posuit portas eius iuxta verbum Domini quod locutus fuerat in manu Iosue filii Nun";
