csb[1] = "Now King David was old and advanced in age. Although they covered him with bedclothes, he could not get warm.";
csb[2] = "So his servants said to him: &quot;Let us search for a young virgin for my lord the king. She is to attend the king and be his caregiver. She is to lie by your side so that my lord the king will get warm.&quot;";
csb[3] = "They searched for a beautiful girl throughout the territory of Israel; they found Abishag the Shunammite and brought her to the king.";
csb[4] = "The girl was of unsurpassed beauty, and she became the king\'s caregiver. She attended to him, but he was not intimate with her.";
csb[5] = "Adonijah son of Haggith kept exalting himself, saying, &quot;I will be king! &quot; He prepared chariots, cavalry, and fifty men to run ahead of him.";
csb[6] = "But his father had never once infuriated him by asking, &quot;Why did you do that? &quot; In addition, he was quite handsome and was born after Absalom.";
csb[7] = "He conspired with Joab son of Zeruiah and with the priest Abiathar. They supported Adonijah,";
csb[8] = "but the priest Zadok, Benaiah son of Jehoiada, the prophet Nathan, Shimei, Rei, and David\'s royal guard did not side with Adonijah.";
csb[9] = "Adonijah sacrificed sheep, goats, cattle, and fattened cattle near the stone of Zoheleth, which is next to En-rogel. He invited all his royal brothers and all the men of Judah, the servants of the king,";
csb[10] = "but he did not invite the prophet Nathan, Benaiah, the royal guard, or his brother Solomon.";
csb[11] = "Then Nathan said to Bathsheba, Solomon\'s mother, &quot;Have you not heard that Adonijah son of Haggith has become king and our lord David does not know it?";
csb[12] = "&quot;Now please come and let me advise you. Save your life and the life of your son Solomon.";
csb[13] = "&quot;Go, approach King David and say to him, \'My lord the king, did you not swear to your servant: Your son Solomon is to become king after me, and he is the one who is to sit on my throne? So why has Adonijah become king? \'";
csb[14] = "&quot;At that moment, while you are still there speaking with the king, I\'ll come in after you and confirm your words.&quot;";
csb[15] = "So Bathsheba went to the king in his bedroom. Since the king was very old, Abishag the Shunammite was attending to him.";
csb[16] = "Bathsheba knelt low and paid homage to the king, and he asked, &quot;What do you want? &quot;";
csb[17] = "She replied, &quot;My lord, you swore to your servant by the LORD your God, \'Your son Solomon is to become king after me, and he is the one who is to sit on my throne.\'";
csb[18] = "&quot;Now look, Adonijah has become king. And, my lord the king, you didn\'t know it.";
csb[19] = "&quot;He has lavishly sacrificed oxen, fattened cattle, and sheep. He invited all the king\'s sons, the priest Abiathar, and Joab the commander of the army, but he did not invite your servant Solomon.";
csb[20] = "&quot;Now, my lord the king, the eyes of all Israel are on you to tell them who will sit on the throne of my lord the king after him.";
csb[21] = "&quot;Otherwise, when my lord the king rests with his fathers, I and my son Solomon will be regarded as criminals.&quot;";
csb[22] = "At that moment, while she was still speaking with the king, the prophet Nathan arrived,";
csb[23] = "and it was announced to the king, &quot;The prophet Nathan is here.&quot; He came into the king\'s presence and paid homage to him with his face to the ground.";
csb[24] = "&quot;My lord the king,&quot; Nathan said, &quot;did you say, \'Adonijah is to become king after me, and he is the one who is to sit on my throne\'?";
csb[25] = "&quot;For today he went down and lavishly sacrificed oxen, fattened cattle, and sheep. He invited all the sons of the king, the commanders of the army, and the priest Abiathar. And look! They\'re eating and drinking in his presence, and they\'re saying, \'Long live King Adonijah! \'";
csb[26] = "&quot;But he did not invite me -- me, your servant -- or the priest Zadok or Benaiah son of Jehoiada or your servant Solomon.";
csb[27] = "&quot;I\'m certain my lord the king would not have let this happen without letting your servant know who will sit on my lord the king\'s throne after him.&quot;";
csb[28] = "King David responded by saying, &quot;Call in Bathsheba for me.&quot; So she came into the king\'s presence and stood before him.";
csb[29] = "The king swore an oath and said, &quot;As the LORD lives, who has redeemed my life from every difficulty,";
csb[30] = "&quot;just as I swore to you by the LORD God of Israel: Your son Solomon is to become king after me, and he is the one who is to sit on my throne in my place, that is exactly what I will do this very day.&quot;";
csb[31] = "Bathsheba knelt low with her face to the ground, paying homage to the king, and said, &quot;May my lord King David live forever! &quot;";
csb[32] = "King David then said, &quot;Call in the priest Zadok, the prophet Nathan, and Benaiah son of Jehoiada for me.&quot; So they came into the king\'s presence.";
csb[33] = "The king said to them, &quot;Take my servants with you, have my son Solomon ride on my own mule, and take him down to Gihon.";
csb[34] = "&quot;There, the priest Zadok and the prophet Nathan are to anoint him as king over Israel. You are to blow the ram\'s horn and say, \'Long live King Solomon! \'";
csb[35] = "&quot;You are to come up after him, and he is to come in and sit on my throne. He is the one who is to become king in my place; he is the one I have commanded to be ruler over Israel and Judah.&quot;";
csb[36] = "&quot;Amen,&quot; Benaiah son of Jehoiada replied to the king. &quot;May the LORD, the God of my lord the king, so affirm it.";
csb[37] = "&quot;Just as the LORD was with my lord the king, so may he be with Solomon and make his throne greater than the throne of my lord King David.&quot;";
csb[38] = "Then the priest Zadok, the prophet Nathan, Benaiah son of Jehoiada, the Cherethites, and the Pelethites went down, had Solomon ride on King David\'s mule, and took him to Gihon.";
csb[39] = "The priest Zadok took the horn of oil from the tabernacle and anointed Solomon. Then they blew the ram\'s horn, and all the people proclaimed, &quot;Long live King Solomon! &quot;";
csb[40] = "All the people went up after him, playing flutes and rejoicing with such a great joy that the earth split open from the sound.";
csb[41] = "Adonijah and all the invited guests who were with him heard the noise as they finished eating. Joab heard the sound of the ram\'s horn and said, &quot;Why is the town in such an uproar? &quot;";
csb[42] = "He was still speaking when Jonathan son of Abiathar the priest, suddenly arrived. Adonijah said, &quot;Come in, for you are an important man, and you must be bringing good news.&quot;";
csb[43] = "&quot;Unfortunately not,&quot; Jonathan answered him. &quot;Our lord King David has made Solomon king.";
csb[44] = "&quot;And with Solomon, the king has sent the priest Zadok, the prophet Nathan, Benaiah son of Jehoiada, the Cherethites, and the Pelethites, and they have had him ride on the king\'s mule.";
csb[45] = "&quot;The priest Zadok and the prophet Nathan have anointed him king in Gihon. They have gone up from there rejoicing. The town has been in an uproar; that\'s the noise you heard.";
csb[46] = "&quot;Solomon has even taken his seat on the royal throne.";
csb[47] = "&quot;The king\'s servants have also gone to congratulate our lord King David, saying, \'May your God make the name of Solomon more well known than your name, and may he make his throne greater than your throne.\' Then the king bowed in worship on his bed.";
csb[48] = "&quot;And the king went on to say this: \'Blessed be the LORD God of Israel! Today he has provided one to sit on my throne, and I am a witness.\' &quot;";
csb[49] = "Then all of Adonijah\'s guests got up trembling and went their separate ways.";
csb[50] = "Adonijah was afraid of Solomon, so he got up and went to take hold of the horns of the altar.";
csb[51] = "It was reported to Solomon: &quot;Look, Adonijah fears King Solomon, and he has taken hold of the horns of the altar, saying, \'Let King Solomon first swear to me that he will not kill his servant with the sword.\' &quot;";
csb[52] = "Then Solomon said, &quot;If he is a man of character, not a single hair of his will fall to the ground, but if evil is found in him, he dies.&quot;";
csb[53] = "So King Solomon sent for him, and they took him down from the altar. He came and paid homage to King Solomon, and Solomon said to him, &quot;Go to your home.&quot;";

vul[35] = "et ascendetis post eum et veniet et sedebit super solium meum et ipse regnabit pro me illique praecipiam ut sit dux super Israhel et super Iudam";
kjv[36] = "And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so [too].";
rsv[36] = "And Benai\'ah the son of Jehoi\'ada answered the king, &quot;Amen! May the LORD, the God of my lord the king, say so.";
asv[36] = "And Benaiah the son of Jehoiada answered the king, and said, Amen: Jehovah, the God of my lord the king, say so [too].";
yng[36] = "And Benaiah son of Jehoiada answereth the king, and saith, `Amen! so doth Jehovah, God of my lord the king, say;";
dby[36] = "And Benaiah the son of Jehoiada answered the king and said, Amen: Jehovah, the God of my lord the king, say so too.";
web[36] = "And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so [too].";
hnv[36] = "Benayah the son of Yehoiada answered the king, and said, Amein: the LORD, the God of my lord the king, say so [too].";
vul[36] = "et respondit Banaias filius Ioiadae regi dicens amen sic loquatur Dominus Deus domini mei regis";
kjv[37] = "As the LORD hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David.";
rsv[37] = "As the LORD has been with my lord the king, even so may he be with Solomon, and make his throne greater than the throne of my lord King David.&quot;";
asv[37] = "As Jehovah hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David.";
yng[37] = "as Jehovah hath been with my lord the king, so is He with Solomon, and doth make his throne greater than the throne of my lord king David.\'";
dby[37] = "As Jehovah has been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David.";
web[37] = "As the LORD hath been with my lord the king, even so let him be with Solomon, and make his throne greater than the throne of my lord king David.";
hnv[37] = "As the LORD has been with my lord the king, even so be he with Shlomo, and make his throne greater than the throne of my lord king David.";
vul[37] = "quomodo fuit Dominus cum domino meo rege sic sit cum Salomone et sublimius faciat solium eius a solio domini mei regis David";
kjv[38] = "So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David\'s mule, and brought him to Gihon.";
rsv[38] = "So Zadok the priest, Nathan the prophet, and Benai\'ah the son of Jehoi\'ada, and the Cher\'ethites and the Pel\'ethites, went down and caused Solomon to ride on King David\'s mule, and brought him to Gihon.";
asv[38] = "So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites and the Pelethites, went down, and caused Solomon to ride upon king David\'s mule, and brought him to Gihon.";
yng[38] = "And Zadok the priest goeth down, and Nathan the prophet, and Benaiah son of Jehoiada, and the Cherethite, and the Pelethite, and they cause Solomon to ride on the mule of king David, and cause him to go unto Gihon,";
dby[38] = "And Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites and the Pelethites went down, and caused Solomon to ride upon king David\'s mule, and brought him to Gihon.";
web[38] = "So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David\'s mule, and brought him to Gihon.";
hnv[38] = "So Tzadok the Kohen, and Natan the prophet, and Benayah the son of Yehoiada, and the Kereti and the Peleti, went down, and caused Shlomo to ride on king David\'s mule, and brought him to Gichon.";
vul[38] = "descendit ergo Sadoc sacerdos et Nathan propheta et Banaias filius Ioiadae et Cherethi et Felethi et inposuerunt Salomonem super mulam regis David et adduxerunt eum in Gion";
kjv[39] = "And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon.";
rsv[39] = "There Zadok the priest took the horn of oil from the tent, and anointed Solomon. Then they blew the trumpet; and all the people said, &quot;Long live King Solomon!&quot;";
asv[39] = "And Zadok the priest took the horn of oil out of the Tent, and anointed Solomon. And they blew the trumpet; and all the people said, [Long] live king Solomon.";
yng[39] = "and Zadok the priest taketh the horn of oil out of the tent, and anointeth Solomon, and they blow with a trumpet, and all the people say, `Let king Solomon live.\'";
dby[39] = "And Zadok the priest took the horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, Long live king Solomon!";
web[39] = "And Zadok the priest took a horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon.";
hnv[39] = "Tzadok the Kohen took the horn of oil out of the Tent, and anointed Shlomo. They blew the shofar; and all the people said, [Long] live king Shlomo.";
vul[39] = "sumpsitque Sadoc sacerdos cornu olei de tabernaculo et unxit Salomonem et cecinerunt bucina et dixit omnis populus vivat rex Salomon";
kjv[40] = "And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them.";
rsv[40] = "And all the people went up after him, playing on pipes, and rejoicing with great joy, so that the earth was split by their noise.";
asv[40] = "And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them.";
yng[40] = "And all the people come up after him, and the people are piping with pipes, and rejoicing -- great joy, and the earth rendeth with their voice.";
dby[40] = "And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them.";
web[40] = "And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them.";
hnv[40] = "All the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the eretz shook with the sound of them.";
vul[40] = "et ascendit universa multitudo post eum et populus canentium tibiis et laetantium gaudio magno et insonuit terra ad clamorem eorum";
kjv[41] = "And Adonijah and all the guests that [were] with him heard [it] as they had made an end of eating. And when Joab heard the sound of the trumpet, he said, Wherefore [is this] noise of the city being in an uproar?";
rsv[41] = "Adoni\'jah and all the guests who were with him heard it as they finished feasting. And when Jo\'ab heard the sound of the trumpet, he said, &quot;What does this uproar in the city mean?&quot;";
asv[41] = "And Adonijah and all the guests that were with him heard it as they had made an end of eating. And when Joab heard the sound of the trumpet, he said, Wherefore is this noise of the city being in an uproar?";
yng[41] = "And Adonijah heareth, and all those called, who [are] with him, and they have finished to eat, and Joab heareth the noise of the trumpet, and saith, `Wherefore [is] the noise of the city roaring?\'";
dby[41] = "And Adonijah and all the guests that were with him heard [it] as they were finishing their repast; and Joab heard the sound of the trumpet, and he said, Wherefore this noise of the city in an uproar?";
web[41] = "And Adonijah and all the guests that [were] with him heard [it] as they had made an end of eating. And when Joab heard the sound of the trumpet, he said, Why [is this] noise of the city being in an uproar?";
hnv[41] = "Adoniyahu and all the guests who were with him heard it as they had made an end of eating. When Yo\'av heard the sound of the shofar, he said, Why is this noise of the city being in an uproar?";
vul[41] = "audivit autem Adonias et omnes qui invitati fuerant ab eo iamque convivium finitum erat sed et Ioab audita voce tubae ait quid sibi vult clamor civitatis tumultuantis";
kjv[42] = "And while he yet spake, behold, Jonathan the son of Abiathar the priest came: and Adonijah said unto him, Come in; for thou [art] a valiant man, and bringest good tidings.";
rsv[42] = "While he was still speaking, behold, Jonathan the son of Abi\'athar the priest came; and Adoni\'jah said, &quot;Come in, for you are a worthy man and bring good news.&quot;";
asv[42] = "While he yet spake, behold, Jonathan the son of Abiathar the priest came: and Adonijah said, Come in; for thou art a worthy man, and bringest good tidings.";
yng[42] = "He is yet speaking, and lo, Jonathan son of Abiathar the priest hath come in, and Adonijah saith, `Come in, for a man of valour thou [art], and thou bearest good tidings.\'";
dby[42] = "While he yet spoke, behold, Jonathan the son of Abiathar the priest came; and Adonijah said [to him], Come in; for thou art a valiant man, and bringest good news.";
web[42] = "And while he yet spoke, behold, Jonathan the son of Abiathar the priest came: and Adonijah said to him, Come in; for thou [art] a valiant man, and bringest good tidings.";
hnv[42] = "While he yet spoke, behold, Yonatan the son of Avyatar the Kohen came: and Adoniyahu said, Come in; for you are a worthy man, and bring good news.";
vul[42] = "adhuc illo loquente Ionathan filius Abiathar sacerdotis venit cui dixit Adonias ingredere quia vir fortis es et bona nuntians";
kjv[43] = "And Jonathan answered and said to Adonijah, Verily our lord king David hath made Solomon king.";
rsv[43] = "Jonathan answered Adoni\'jah, &quot;No, for our lord King David has made Solomon king;";
asv[43] = "And Jonathan answered and said to Adonijah, Verily our lord king David hath made Solomon king:";
yng[43] = "And Jonathan answereth and saith to Adonijah, `Verily our lord king David hath caused Solomon to reign,";
dby[43] = "And Jonathan answered and said to Adonijah, Indeed, our lord king David has made Solomon king.";
web[43] = "And Jonathan answered and said to Adonijah, Verily our lord king David hath made Solomon king.";
hnv[43] = "Yonatan answered Adoniyahu, Most assuredly our lord king David has made Shlomo king:";
vul[43] = "responditque Ionathan Adoniae nequaquam dominus enim noster rex David regem constituit Salomonem";
kjv[44] = "And the king hath sent with him Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, and they have caused him to ride upon the king\'s mule:";
rsv[44] = "and the king has sent with him Zadok the priest, Nathan the prophet, and Benai\'ah the son of Jehoi\'ada, and the Cher\'ethites and the Pel\'ethites; and they have caused him to ride on the king\'s mule;";
asv[44] = "and the king hath sent with him Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites and the Pelethites; and they have caused him to ride upon the king\'s mule;";
yng[44] = "and the king sendeth with him Zadok the priest, and Nathan the prophet, and Benaiah son of Jehoiada, and the Cherethite, and the Pelethite, and they cause him to ride on the king\'s mule,";
dby[44] = "And the king has sent with him Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites and the Pelethites, and they have caused him to ride upon the king\'s mule;";
web[44] = "And the king hath sent with him Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, and they have caused him to ride upon the king\'s mule:";
hnv[44] = "and the king has sent with him Tzadok the Kohen, and Natan the prophet, and Benayah the son of Yehoiada, and the Kereti and the Peleti; and they have caused him to ride on the king\'s mule;";
vul[44] = "misitque cum eo Sadoc sacerdotem et Nathan prophetam et Banaiam filium Ioiadae et Cherethi et Felethi et inposuerunt eum super mulam regis";
kjv[45] = "And Zadok the priest and Nathan the prophet have anointed him king in Gihon: and they are come up from thence rejoicing, so that the city rang again. This [is] the noise that ye have heard.";
rsv[45] = "and Zadok the priest and Nathan the prophet have anointed him king at Gihon; and they have gone up from there rejoicing, so that the city is in an uproar. This is the noise that you have heard.";
asv[45] = "and Zadok the priest and Nathan the prophet have anointed him king in Gihon; and they are come up from thence rejoicing, so that the city rang again. This is the noise that ye have heard.";
yng[45] = "and they anoint him -- Zadok the priest and Nathan the prophet -- for king in Gihon, and are come up thence rejoicing, and the city is moved; it [is] the noise that ye have heard.";
dby[45] = "and Zadok the priest and Nathan the prophet have anointed him king at Gihon; and they are come up from thence rejoicing, so that the city is in an uproar. This is the noise which ye have heard.";
web[45] = "And Zadok the priest and Nathan the prophet have anointed him king in Gihon: and they have come from thence rejoicing, so that the city resounded. This [is] the noise that ye have heard.";
hnv[45] = "and Tzadok the Kohen and Natan the prophet have anointed him king in Gichon; and they are come up from there rejoicing, so that the city rang again. This is the noise that you have heard.";
vul[45] = "unxeruntque eum Sadoc sacerdos et Nathan propheta regem in Gion et ascenderunt inde laetantes et insonuit civitas haec est vox quam audistis";
kjv[46] = "And also Solomon sitteth on the throne of the kingdom.";
rsv[46] = "Solomon sits upon the royal throne.";
asv[46] = "And also Solomon sitteth on the throne of the kingdom.";
yng[46] = "`And also Solomon hath sat on the throne of the kingdom,";
dby[46] = "And also Solomon is sitting on the throne of the kingdom.";
web[46] = "And also Solomon sitteth on the throne of the kingdom.";
hnv[46] = "Also Shlomo sits on the throne of the kingdom.";
vul[46] = "sed et Salomon sedit super solio regni";
kjv[47] = "And moreover the king\'s servants came to bless our lord king David, saying, God make the name of Solomon better than thy name, and make his throne greater than thy throne. And the king bowed himself upon the bed.";
rsv[47] = "Moreover the king\'s servants came to congratulate our lord King David, saying, \'Your God make the name of Solomon more famous than yours, and make his throne greater than your throne.\' And the king bowed himself upon the bed.";
asv[47] = "And moreover the king\'s servants came to bless our lord king David, saying, Thy God make the name of Solomon better than thy name, and make his throne greater than thy throne: and the king bowed himself upon the bed.";
yng[47] = "and also the servants of the king have come into bless our lord king David, saying, Thy God doth make the name of Solomon better than thy name, and his throne greater than thy throne; and the king boweth himself on the bed,";
dby[47] = "And moreover the king\'s servants came to bless our lord king David, saying, Thy God make the name of Solomon more excellent than thy name, and make his throne greater than thy throne! And the king bowed himself on the bed.";
web[47] = "And moreover the king\'s servants came to bless our lord king David, saying, God make the name of Solomon better than thy name, and make his throne greater than thy throne. And the king bowed himself upon the bed.";
hnv[47] = "Moreover the king\'s servants came to bless our lord king David, saying, Your God make the name of Shlomo better than your name, and make his throne greater than your throne: and the king bowed himself on the bed.";
vul[47] = "et ingressi servi regis benedixerunt domino nostro regi David dicentes amplificet Deus nomen Salomonis super nomen tuum et magnificet thronum eius super thronum tuum et adoravit rex in lectulo suo";
kjv[48] = "And also thus said the king, Blessed [be] the LORD God of Israel, which hath given [one] to sit on my throne this day, mine eyes even seeing [it].";
rsv[48] = "And the king also said, \'Blessed be the LORD, the God of Israel, who has granted one of my offspring to sit on my throne this day, my own eyes seeing it.\'&quot;";
asv[48] = "And also thus said the king, Blessed be Jehovah, the God of Israel, who hath given one to sit on my throne this day, mine eyes even seeing it.";
yng[48] = "and also thus hath the king said, Blessed [is] Jehovah, God of Israel, who hath given to-day [one] sitting on my throne, and mine eyes seeing.\'";
dby[48] = "And also thus said the king: Blessed be Jehovah, the God of Israel, who has given one to sit on my throne this day, mine eyes even seeing it.";
web[48] = "And also thus said the king, Blessed [be] the LORD God of Israel, who hath given [one] to sit on my throne this day, my eyes even seeing [it].";
hnv[48] = "Also thus said the king, Blessed be the LORD, the God of Yisra\'el, who has given one to sit on my throne this day, my eyes even seeing it.";
vul[48] = "insuper et haec locutus est benedictus Dominus Deus Israhel qui dedit hodie sedentem in solio meo videntibus oculis meis";
kjv[49] = "And all the guests that [were] with Adonijah were afraid, and rose up, and went every man his way.";
rsv[49] = "Then all the guests of Adoni\'jah trembled, and rose, and each went his own way.";
asv[49] = "And all the guests of Adonijah were afraid, and rose up, and went every man his way.";
yng[49] = "And they tremble, and rise -- all those called who [are] for Adonijah -- and go, each on his way;";
dby[49] = "And all Adonijah\'s guests were afraid, and rose up and went every man his way.";
web[49] = "And all the guests that [were] with Adonijah were afraid, and arose, and went every man his way.";
hnv[49] = "All the guests of Adoniyahu were afraid, and rose up, and went every man his way.";
vul[49] = "territi sunt ergo et surrexerunt omnes qui invitati fuerant ab Adonia et ivit unusquisque in viam suam";
kjv[50] = "And Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar.";
rsv[50] = "And Adoni\'jah feared Solomon; and he arose, and went, and caught hold of the horns of the altar.";
asv[50] = "And Adonijah feared because of Solomon; and he arose, and went, and caught hold on the horns of the altar.";
yng[50] = "and Adonijah feareth because of Solomon, and riseth, and goeth, and layeth hold on the horns of the altar.";
dby[50] = "And Adonijah feared because of Solomon, and arose and went and caught hold of the horns of the altar.";
web[50] = "And Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar.";
hnv[50] = "Adoniyahu feared because of Shlomo; and he arose, and went, and caught hold on the horns of the altar.";
vul[50] = "Adonias autem timens Salomonem surrexit et abiit tenuitque cornu altaris";
kjv[51] = "And it was told Solomon, saying, Behold, Adonijah feareth king Solomon: for, lo, he hath caught hold on the horns of the altar, saying, Let king Solomon swear unto me to day that he will not slay his servant with the sword.";
rsv[51] = "And it was told Solomon, &quot;Behold, Adoni\'jah fears King Solomon; for, lo, he has laid hold of the horns of the altar, saying, \'Let King Solomon swear to me first that he will not slay his servant with the sword.\'&quot;";
asv[51] = "And it was told Solomon, saying, Behold, Adonijah feareth king Solomon; for, lo, he hath laid hold on the horns of the altar, saying, Let king Solomon swear unto me first that he will not slay his servant with the sword.";
yng[51] = "And it is declared to Solomon, saying, `Lo, Adonijah feareth king Solomon, and lo, he hath laid hold on the horns of the altar, saying, Let king Solomon swear to me as to-day -- he doth not put to death his servant by the sword.\'";
dby[51] = "And it was told Solomon saying, Behold, Adonijah fears king Solomon; for behold, he has caught hold of the horns of the altar, saying, Let king Solomon swear to me this day that he will not put his servant to death with the sword.";
web[51] = "And it was told Solomon, saying, Behold, Adonijah feareth king Solomon: for lo, he hath caught hold on the horns of the altar, saying, Let king Solomon swear to me to-day that he will not slay his servant with the sword.";
hnv[51] = "It was told Shlomo, saying, Behold, Adoniyahu fears king Shlomo; for, behold, he has laid hold on the horns of the altar, saying, Let king Shlomo swear to me first that he will not kill his servant with the sword.";
vul[51] = "et nuntiaverunt Salomoni dicentes ecce Adonias timens regem Salomonem tenuit cornu altaris dicens iuret mihi hodie rex Salomon quod non interficiat servum suum gladio";
kjv[52] = "And Solomon said, If he will shew himself a worthy man, there shall not an hair of him fall to the earth: but if wickedness shall be found in him, he shall die.";
rsv[52] = "And Solomon said, &quot;If he prove to be a worthy man, not one of his hairs shall fall to the earth; but if wickedness is found in him, he shall die.&quot;";
asv[52] = "And Solomon said, If he shall show himself a worthy man, there shall not a hair of him fall to the earth; but if wickedness be found in him, he shall die.";
yng[52] = "And Solomon saith, `If he becometh a virtuous man -- there doth not fall of his hair to the earth, and if evil is found in him -- then he hath died.\'";
dby[52] = "And Solomon said, If he be a worthy man, there shall not one of his hairs fall to the earth; but if wickedness be found in him, he shall die.";
web[52] = "And Solomon said, If he will show himself a worthy man, there shall not a hair of him fall to the earth: but if wickedness shall be found in him, he shall die.";
hnv[52] = "Shlomo said, If he shall show himself a worthy man, there shall not a hair of him fall to the eretz; but if wickedness be found in him, he shall die.";
vul[52] = "dixitque Salomon si fuerit vir bonus non cadet ne unus quidem capillus eius in terram sin autem malum inventum fuerit in eo morietur";
kjv[53] = "So king Solomon sent, and they brought him down from the altar. And he came and bowed himself to king Solomon: and Solomon said unto him, Go to thine house.";
rsv[53] = "So King Solomon sent, and they brought him down from the altar. And he came and did obeisance to King Solomon; and Solomon said to him, &quot;Go to your house.&quot;";
asv[53] = "So king Solomon sent, and they brought him down from the altar. And he came and did obeisance to king Solomon; and Solomon said unto him, Go to thy house.";
yng[53] = "And king Solomon sendeth, and they bring him down from off the altar, and he cometh in and boweth himself to king Solomon, and Solomon saith to him, `Go to thy house.\'";
dby[53] = "And king Solomon sent, and they brought him down from the altar. And he came and bowed himself to king Solomon; and Solomon said to him, Go to thy house.";
web[53] = "So king Solomon sent, and they brought him down from the altar. And he came and bowed himself to king Solomon: and Solomon said to him, Go to thy house.";
hnv[53] = "So king Shlomo sent, and they brought him down from the altar. He came and did obeisance to king Shlomo; and Shlomo said to him, Go to your house.";
vul[53] = "misit ergo rex Salomon et eduxit eum ab altari et ingressus adoravit regem Salomonem dixitque ei Salomon vade in domum tuam";
