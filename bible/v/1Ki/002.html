csb[1] = "As the time approached for David to die, he ordered his son Solomon,";
csb[2] = "&quot;As for me, I am going the way of all of the earth. Be strong and be a man,";
csb[3] = "&quot;and keep your obligation to the LORD your God to walk in his ways and to keep his statutes, commands, ordinances, and decrees. This is written in the law of Moses, so that you will have success in everything you do and wherever you turn,";
csb[4] = "&quot;and so that the LORD will fulfill his promise that he made to me: \'If your sons guard their way to walk faithfully before me with all their heart and all their soul, you will never fail to have a man on the throne of Israel.\'";
csb[5] = "&quot;You also know what Joab son of Zeruiah did to me and what he did to the two commanders of Israel\'s army, Abner son of Ner and Amasa son of Jether. He murdered them in a time of peace to avenge blood shed in war. He spilled that blood on his own waistband and on the sandals of his feet.";
csb[6] = "&quot;Act according to your wisdom, and do not let his gray head descend to Sheol in peace.";
csb[7] = "&quot;Show kindness to the sons of Barzillai the Gileadite and let them be among those who eat at your table because they supported me when I fled from your brother Absalom.";
csb[8] = "&quot;Keep an eye on Shimei son of Gera, the Benjaminite from Bahurim who is with you. He uttered malicious curses against me the day I went to Mahanaim. But he came down to meet me at the Jordan River, and I swore to him by the LORD: \'I will never kill you with the sword.\'";
csb[9] = "&quot;So don\'t let him go unpunished, for you are a wise man. You know how to deal with him to bring his gray head down to Sheol with blood.&quot;";
csb[10] = "Then David rested with his fathers and was buried in the city of David.";
csb[11] = "The length of time David reigned over Israel was forty years: he reigned seven years in Hebron and thirty-three years in Jerusalem.";
csb[12] = "Solomon sat on the throne of his father David, and his kingship was firmly established.";
csb[13] = "Now Adonijah son of Haggith came to Bathsheba, Solomon\'s mother. She asked, &quot;Do you come peacefully? &quot; &quot;Peacefully,&quot; he replied,";
csb[14] = "and then asked, &quot;May I talk with you? &quot; &quot;Go ahead,&quot; she answered.";
csb[15] = "&quot;You know the kingship was mine,&quot; he said. &quot;All Israel expected me to be king, but then the kingship was turned over to my brother, for the LORD gave it to him.";
csb[16] = "&quot;So now I have just one request of you; don\'t turn me down.&quot; She said to him, &quot;Go on.&quot;";
csb[17] = "He replied, &quot;Please speak to King Solomon since he won\'t turn you down. Let him give me Abishag the Shunammite as a wife.&quot;";
csb[18] = "&quot;Very well,&quot; Bathsheba replied. &quot;I will speak to the king for you.&quot;";
csb[19] = "So Bathsheba went to King Solomon to speak to him about Adonijah. The king stood up to greet her, bowed to her, sat down on his throne, and had a throne placed for the king\'s mother. So she sat down at his right hand.";
csb[20] = "Then she said, &quot;I have just one small request of you. Don\'t turn me down.&quot; &quot;Go ahead and ask, mother,&quot; the king replied, &quot;for I won\'t turn you down.&quot;";
csb[21] = "So she said, &quot;Let Abishag the Shunammite be given to your brother Adonijah as a wife.&quot;";
csb[22] = "King Solomon answered his mother, &quot;Why are you requesting Abishag the Shunammite for Adonijah? Since he is my elder brother, you might as well ask the kingship for him, for the priest Abiathar, and for Joab son of Zeruiah.&quot;";
csb[23] = "Then King Solomon took an oath by the LORD: &quot;May God punish me and do so severely if Adonijah has not made this request at the cost of his life.";
csb[24] = "&quot;And now, as the LORD lives -- the one who established me, seated me on the throne of my father David, and made me a dynasty as he promised -- I swear Adonijah will be put to death today! &quot;";
csb[25] = "Then King Solomon dispatched Benaiah son of Jehoiada, who struck down Adonijah, and he died.";
csb[26] = "The king said to the priest Abiathar, &quot;Go to your fields in Anathoth. Even though you deserve to die, I will not put you to death today, since you carried the ark of the Lord GOD in the presence of my father David and you suffered through all that my father suffered.&quot;";
csb[27] = "So Solomon banished Abiathar from being the LORD\'s priest, and it fulfilled the LORD\'s prophecy he had spoken at Shiloh against Eli\'s family.";
csb[28] = "The news reached Joab. Since he had supported Adonijah but not Absalom, Joab fled to the LORD\'s tabernacle and took hold of the horns of the altar.";
csb[29] = "It was reported to King Solomon: &quot;Joab has fled to the LORD\'s tabernacle and is now beside the altar.&quot; Then Solomon sent Benaiah son of Jehoiada and told him, &quot;Go and strike him down! &quot;";
csb[30] = "So Benaiah went to the tabernacle and said to Joab, &quot;This is what the king says: \'Come out! \' &quot; But Joab said, &quot;No, for I will die here.&quot; So Benaiah took a message back to the king, &quot;This is what Joab said, and this is how he answered me.&quot;";
csb[31] = "The king said to him, &quot;Do just as he says. Strike him down and bury him in order to remove from me and from my father\'s family the blood that Joab shed without just cause.";
csb[32] = "&quot;The LORD will bring back his own blood on his head because he struck down two men more righteous and better than he, without my father David\'s knowledge. With his sword, Joab murdered Abner son of Ner, commander of Israel\'s army, and Amasa son of Jether, commander of Judah\'s army.";
csb[33] = "&quot;The responsibility for their deaths will come back to Joab and to his descendants forever, but for David, his descendants, his dynasty, and his throne, there will be peace from the LORD forever.&quot;";
csb[34] = "Benaiah son of Jehoiada went up, struck down Joab, and put him to death. He was buried at his house in the wilderness.";
csb[35] = "Then the king appointed Benaiah son of Jehoiada in Joab\'s place over the army, and he appointed the priest Zadok in Abiathar\'s place.";
csb[36] = "Then the king summoned Shimei and said to him, &quot;Build a house for yourself in Jerusalem and live there, but don\'t leave there and go anywhere else.";
csb[37] = "&quot;On the day you do leave and cross the Kidron Valley, know for sure that you will certainly die. Your blood will be on your own head.&quot;";
csb[38] = "Shimei said to the king, &quot;The sentence is fair; your servant will do as my lord the king has spoken.&quot; And Shimei lived in Jerusalem for a long time.";
csb[39] = "But then, at the end of three years, two of Shimei\'s slaves ran away to Achish son of Maacah, king of Gath. Shimei was informed, &quot;Look, your slaves are in Gath.&quot;";
csb[40] = "So Shimei saddled his donkey and set out to Achish at Gath to search for his slaves. He went and brought them back from Gath.";
csb[41] = "It was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.";
csb[42] = "So the king summoned Shimei and said to him, &quot;Didn\'t I make you swear by the LORD and warn you, saying, \'On the day you leave and go anywhere else, know for sure that you will certainly die\'? And you said to me, \'The sentence is fair; I will obey.\'";
csb[43] = "&quot;So why have you not kept the LORD\'s oath and the command that I gave you? &quot;";
csb[44] = "The king also said, &quot;You yourself know all the evil that you did to my father David. Therefore, the LORD has brought back your evil on your head,";
csb[45] = "&quot;but King Solomon will be blessed, and David\'s throne will remain established before the LORD forever.&quot;";
csb[46] = "Then the king commanded Benaiah son of Jehoiada, and he went out and struck Shimei down, and he died. So the kingdom was established in Solomon\'s hand.";
kjv[1] = "Now the days of David drew nigh that he should die; and he charged Solomon his son, saying,";
kjv[2] = "I go the way of all the earth: be thou strong therefore, and shew thyself a man;";
kjv[3] = "And keep the charge of the LORD thy God, to walk in his ways, to keep his statutes, and his commandments, and his judgments, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself:";
kjv[4] = "That the LORD may continue his word which he spake concerning me, saying, If thy children take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail thee (said he) a man on the throne of Israel.";
kjv[5] = "Moreover thou knowest also what Joab the son of Zeruiah did to me, [and] what he did to the two captains of the hosts of Israel, unto Abner the son of Ner, and unto Amasa the son of Jether, whom he slew, and shed the blood of war in peace, and put the blood of war upon his girdle that [was] about his loins, and in his shoes that [were] on his feet.";
kjv[6] = "Do therefore according to thy wisdom, and let not his hoar head go down to the grave in peace.";
kjv[7] = "But shew kindness unto the sons of Barzillai the Gileadite, and let them be of those that eat at thy table: for so they came to me when I fled because of Absalom thy brother.";
kjv[8] = "And, behold, [thou hast] with thee Shimei the son of Gera, a Benjamite of Bahurim, which cursed me with a grievous curse in the day when I went to Mahanaim: but he came down to meet me at Jordan, and I sware to him by the LORD, saying, I will not put thee to death with the sword.";
kjv[9] = "Now therefore hold him not guiltless: for thou [art] a wise man, and knowest what thou oughtest to do unto him; but his hoar head bring thou down to the grave with blood.";
kjv[10] = "So David slept with his fathers, and was buried in the city of David.";
kjv[11] = "And the days that David reigned over Israel [were] forty years: seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.";
kjv[12] = "Then sat Solomon upon the throne of David his father; and his kingdom was established greatly.";
kjv[13] = "And Adonijah the son of Haggith came to Bathsheba the mother of Solomon. And she said, Comest thou peaceably? And he said, Peaceably.";
kjv[14] = "He said moreover, I have somewhat to say unto thee. And she said, Say on.";
kjv[15] = "And he said, Thou knowest that the kingdom was mine, and [that] all Israel set their faces on me, that I should reign: howbeit the kingdom is turned about, and is become my brother\'s: for it was his from the LORD.";
kjv[16] = "And now I ask one petition of thee, deny me not. And she said unto him, Say on.";
kjv[17] = "And he said, Speak, I pray thee, unto Solomon the king, (for he will not say thee nay,) that he give me Abishag the Shunammite to wife.";
kjv[18] = "And Bathsheba said, Well; I will speak for thee unto the king.";
kjv[19] = "Bathsheba therefore went unto king Solomon, to speak unto him for Adonijah. And the king rose up to meet her, and bowed himself unto her, and sat down on his throne, and caused a seat to be set for the king\'s mother; and she sat on his right hand.";
kjv[20] = "Then she said, I desire one small petition of thee; [I pray thee], say me not nay. And the king said unto her, Ask on, my mother: for I will not say thee nay.";
kjv[21] = "And she said, Let Abishag the Shunammite be given to Adonijah thy brother to wife.";
kjv[22] = "And king Solomon answered and said unto his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he [is] mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah.";
kjv[23] = "Then king Solomon sware by the LORD, saying, God do so to me, and more also, if Adonijah have not spoken this word against his own life.";
kjv[24] = "Now therefore, [as] the LORD liveth, which hath established me, and set me on the throne of David my father, and who hath made me an house, as he promised, Adonijah shall be put to death this day.";
kjv[25] = "And king Solomon sent by the hand of Benaiah the son of Jehoiada; and he fell upon him that he died.";
kjv[26] = "And unto Abiathar the priest said the king, Get thee to Anathoth, unto thine own fields; for thou [art] worthy of death: but I will not at this time put thee to death, because thou barest the ark of the Lord GOD before David my father, and because thou hast been afflicted in all wherein my father was afflicted.";
kjv[27] = "So Solomon thrust out Abiathar from being priest unto the LORD; that he might fulfil the word of the LORD, which he spake concerning the house of Eli in Shiloh.";
kjv[28] = "Then tidings came to Joab: for Joab had turned after Adonijah, though he turned not after Absalom. And Joab fled unto the tabernacle of the LORD, and caught hold on the horns of the altar.";
kjv[29] = "And it was told king Solomon that Joab was fled unto the tabernacle of the LORD; and, behold, [he is] by the altar. Then Solomon sent Benaiah the son of Jehoiada, saying, Go, fall upon him.";
kjv[30] = "And Benaiah came to the tabernacle of the LORD, and said unto him, Thus saith the king, Come forth. And he said, Nay; but I will die here. And Benaiah brought the king word again, saying, Thus said Joab, and thus he answered me.";
kjv[31] = "And the king said unto him, Do as he hath said, and fall upon him, and bury him; that thou mayest take away the innocent blood, which Joab shed, from me, and from the house of my father.";
kjv[32] = "And the LORD shall return his blood upon his own head, who fell upon two men more righteous and better than he, and slew them with the sword, my father David not knowing [thereof, to wit], Abner the son of Ner, captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah.";
kjv[33] = "Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever: but upon David, and upon his seed, and upon his house, and upon his throne, shall there be peace for ever from the LORD.";
kjv[34] = "So Benaiah the son of Jehoiada went up, and fell upon him, and slew him: and he was buried in his own house in the wilderness.";
kjv[35] = "And the king put Benaiah the son of Jehoiada in his room over the host: and Zadok the priest did the king put in the room of Abiathar.";
kjv[36] = "And the king sent and called for Shimei, and said unto him, Build thee an house in Jerusalem, and dwell there, and go not forth thence any whither.";
kjv[37] = "For it shall be, [that] on the day thou goest out, and passest over the brook Kidron, thou shalt know for certain that thou shalt surely die: thy blood shall be upon thine own head.";
kjv[38] = "And Shimei said unto the king, The saying [is] good: as my lord the king hath said, so will thy servant do. And Shimei dwelt in Jerusalem many days.";
kjv[39] = "And it came to pass at the end of three years, that two of the servants of Shimei ran away unto Achish son of Maachah king of Gath. And they told Shimei, saying, Behold, thy servants [be] in Gath.";
kjv[40] = "And Shimei arose, and saddled his ass, and went to Gath to Achish to seek his servants: and Shimei went, and brought his servants from Gath.";
kjv[41] = "And it was told Solomon that Shimei had gone from Jerusalem to Gath, and was come again.";
kjv[42] = "And the king sent and called for Shimei, and said unto him, Did I not make thee to swear by the LORD, and protested unto thee, saying, Know for a certain, on the day thou goest out, and walkest abroad any whither, that thou shalt surely die? and thou saidst unto me, The word [that] I have heard [is] good.";
kjv[43] = "Why then hast thou not kept the oath of the LORD, and the commandment that I have charged thee with?";
kjv[44] = "The king said moreover to Shimei, Thou knowest all the wickedness which thine heart is privy to, that thou didst to David my father: therefore the LORD shall return thy wickedness upon thine own head;";
kjv[45] = "And king Solomon [shall be] blessed, and the throne of David shall be established before the LORD for ever.";
kjv[46] = "So the king commanded Benaiah the son of Jehoiada; which went out, and fell upon him, that he died. And the kingdom was established in the hand of Solomon.";

rsv[2] = "&quot;I am about to go the way of all the earth. Be strong, and show yourself a man,";
asv[2] = "I am going the way of all the earth: be thou strong therefore, and show thyself a man;";
yng[2] = "`I am going in the way of all the earth, and thou hast been strong, and become a man,";
dby[2] = "I go the way of all the earth: be of good courage therefore, and be a man;";
web[2] = "I go the way of all the earth: be thou strong therefore, and show thyself a man;";
hnv[2] = "I am going the way of all the eretz: be you strong therefore, and show yourself a man;";

rsv[3] = "and keep the charge of the LORD your God, walking in his ways and keeping his statutes, his commandments, his ordinances, and his testimonies, as it is written in the law of Moses, that you may prosper in all that you do and wherever you turn;";
asv[3] = "and keep the charge of Jehovah thy God, to walk in his ways, to keep his statutes, [and] his commandments, and his ordinances, and his testimonies, according to that which is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself;";
yng[3] = "and kept the charge of Jehovah thy God, to walk in His ways, to keep His statutes, His commands, and His judgments, and His testimonies, as it is written in the law of Moses, so that thou dost wisely all that thou dost, and whithersoever thou turnest,";
dby[3] = "and keep the charge of Jehovah thy God, to walk in his ways, to keep his statutes, and his commandments, and his ordinances, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest and whithersoever thou turnest thyself;";
web[3] = "And keep the charge of the LORD thy God, to walk in his ways, to keep his statutes, and his commandments, and his judgments, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself.";
hnv[3] = "and keep the charge of the LORD your God, to walk in his ways, to keep his statutes, [and] his mitzvot, and his ordinances, and his testimonies, according to that which is written in the law of Moshe, that you may prosper in all that you do, and wherever you turn yourself.";
vul[3] = "et observa custodias Domini Dei tui ut ambules in viis eius et custodias caerimonias eius et praecepta eius et iudicia et testimonia sicut scriptum est in lege Mosi ut intellegas universa quae facis et quocumque te verteris";
rsv[4] = "that the LORD may establish his word which he spoke concerning me, saying, \'If your sons take heed to their way, to walk before me in faithfulness with all their heart and with all their soul, there shall not fail you a man on the throne of Israel.\'";
asv[4] = "that Jehovah may establish his word which he spake concerning me, saying, If thy children take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail thee (said he) a man on the throne of Israel.";
yng[4] = "so that Jehovah doth establish His word which He spake unto me, saying, If thy sons observe their way to walk before Me in truth, with all their heart, and with all their soul; saying, There is not cut off a man of thine from the throne of Israel.";
dby[4] = "that Jehovah may confirm his word which he spoke concerning me, saying, If thy sons take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail thee, said he, a man upon the throne of Israel.";
web[4] = "That the LORD may continue his word which he spoke concerning me, saying, If thy children take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail thee (said he) a man on the throne of Israel.";
hnv[4] = "That the LORD may establish his word which he spoke concerning me, saying, If your children take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail you (said he) a man on the throne of Yisra\'el.";
vul[4] = "ut confirmet Dominus sermones suos quos locutus est de me dicens si custodierint filii tui viam suam et ambulaverint coram me in veritate in omni corde suo et in omni anima sua non auferetur tibi vir de solio Israhel";
rsv[5] = "&quot;Moreover you know also what Jo\'ab the son of Zeru\'iah did to me, how he dealt with the two commanders of the armies of Israel, Abner the son of Ner, and Ama\'sa the son of Jether, whom he murdered, avenging in time of peace blood which had been shed in war, and putting innocent blood upon the girdle about my loins, and upon the sandals on my feet.";
asv[5] = "Moreover thou knowest also what Joab the son of Zeruiah did unto me, even what he did to the two captains of the hosts of Israel, unto Abner the son of Ner, and unto Amasa the son of Jether, whom he slew, and shed the blood of war in peace, and put the blood of war upon his girdle that was about his loins, and in his shoes that were on his feet.";
yng[5] = "`And also, thou hast known that which he did to me -- Joab son of Zeruiah -- that which he did to two heads of the hosts of Israel, to Abner son of Ner, and to Amasa son of Jether -- that he slayeth them, and maketh the blood of war in peace, and putteth the blood of war in his girdle, that [is] on his loins, and in his sandals that [are] on his feet;";
dby[5] = "And thou knowest also what Joab the son of Zeruiah did to me, what he did to the two captains of the hosts of Israel, to Abner the son of Ner, and to Amasa the son of Jether, whom he slew, and shed the blood of war in peace, and put the blood of war upon his girdle that was about his loins, and upon his sandals that were on his feet.";
web[5] = "Moreover, thou knowest also what Joab the son of Zeruiah did to me, [and] what he did to the two captains of the armies of Israel, to Abner the son of Ner, and to Amasa the son of Jether, whom he slew, and shed the blood of war in peace, and put the blood of war upon his girdle that [was] about his loins, and in his shoes that [were] on his feet.";
hnv[5] = "Moreover you know also what Yo\'av the son of Tzeru\'yah did to me, even what he did to the two captains of the hosts of Yisra\'el, to Aviner the son of Ner, and to `Amasa the son of Yeter, whom he killed, and shed the blood of war in shalom, and put the blood of war on his sash that was about his loins, and in his shoes that were on his feet.";
vul[5] = "tu quoque nosti quae fecerit mihi Ioab filius Sarviae quae fecerit duobus principibus exercitus Israhel Abner filio Ner et Amasa filio Iether quos occidit et effudit sanguinem belli in pace et posuit cruorem proelii in balteo suo qui erat circa lumbos eius et in calciamento suo quod erat in pedibus eius";
rsv[6] = "Act therefore according to your wisdom, but do not let his gray head go down to Sheol in peace.";
asv[6] = "Do therefore according to thy wisdom, and let not his hoar head go down to Sheol in peace.";
yng[6] = "and thou hast done according to thy wisdom, and dost not let his old age go down in peace to Sheol.";
dby[6] = "And thou shalt do according to thy wisdom, and not let his hoar head go down to Sheol in peace.";
web[6] = "Do therefore according to thy wisdom, and let not his hoary head go down to the grave in peace.";
hnv[6] = "Do therefore according to your wisdom, and don\'t let his gray head go down to She\'ol in shalom.";
vul[6] = "facies ergo iuxta sapientiam tuam et non deduces canitiem eius pacifice ad inferos";
rsv[7] = "But deal loyally with the sons of Barzil\'lai the Gileadite, and let them be among those who eat at your table; for with such loyalty they met me when I fled from Ab\'salom your brother.";
asv[7] = "But show kindness unto the sons of Barzillai the Gileadite, and let them be of those that eat at thy table; for so they came to me when I fled from Absalom thy brother.";
yng[7] = "`And to the sons of Barzillai the Gileadite thou dost do kindness, and they have been among those eating at thy table, for so they drew near unto me in my fleeing from the face of Absalom thy brother.";
dby[7] = "But shew kindness to the sons of Barzillai the Gileadite, and let them be of those that eat at thy table; for so they came up to me when I fled because of Absalom thy brother.";
web[7] = "But show kindness to the sons of Barzillai the Gileadite, and let them be of those that eat at thy table: for so they came to me when I fled because of Absalom thy brother.";
hnv[7] = "But show kindness to the sons of Barzillai the Gil`adite, and let them be of those who eat at your table; for so they came to me when I fled from Avshalom your brother.";
vul[7] = "sed et filiis Berzellai Galaaditis reddes gratiam eruntque comedentes in mensa tua occurrerunt enim mihi quando fugiebam a facie Absalom fratris tui";
rsv[8] = "And there is also with you Shim\'e-i the son of Gera, the Benjaminite from Bahu\'rim, who cursed me with a grievous curse on the day when I went to Mahana\'im; but when he came down to meet me at the Jordan, I swore to him by the LORD, saying, \'I will not put you to death with the sword.\'";
asv[8] = "And, behold, there is with thee Shimei the son of Gera, the Benjamite, of Bahurim, who cursed me with a grievous curse in the day when I went to Mahanaim; but he came down to meet me at the Jordan, and I sware to him by Jehovah, saying, I will not put thee to death with the sword.";
yng[8] = "`And lo, with thee [is] Shimei son of Gera, the Benjamite of Bahurim, and he reviled me -- a grievous reviling -- in the day of my going to Mahanaim; and he hath come down to meet me at the Jordan, and I swear to him by Jehovah, saying, I do not put thee to death by the sword;";
dby[8] = "And behold, there is with thee Shimei the son of Gera, the Benjaminite of Bahurim, who cursed me with a grievous curse in the day that I went to Mahanaim; but he came down to meet me at the Jordan, and I swore to him by Jehovah saying, I will not put thee to death with the sword.";
web[8] = "And behold, [thou hast] with thee Shimei the son of Gera, a Benjaminite of Bahurim, who cursed me with a grievous curse in the day when I went to Mahanaim: but he came down to meet me at Jordan, and I swore to him by the LORD, saying, I will not put thee to death with the sword.";
hnv[8] = "Behold, there is with you Shim`i the son of Gera, the Binyamini, of Bachurim, who cursed me with a grievous curse in the day when I went to Machanayim; but he came down to meet me at the Yarden, and I swore to him by the LORD, saying, I will not put you to death with the sword.";
vul[8] = "habes quoque apud te Semei filium Gera filii Iemini de Baurim qui maledixit mihi maledictione pessima quando ibam ad Castra sed quia descendit mihi in occursum cum transirem Iordanem et iuravi ei per Dominum dicens non te interficiam gladio";
rsv[9] = "Now therefore hold him not guiltless, for you are a wise man; you will know what you ought to do to him, and you shall bring his gray head down with blood to Sheol.&quot;";
asv[9] = "Now therefore hold him not guiltless, for thou art a wise man; and thou wilt know what thou oughtest to do unto him, and thou shalt bring his hoar head down to Sheol with blood.";
yng[9] = "and now, acquit him not, for a wise man thou [art], and thou hast known that which thou dost to him, and hast brought down his old age with blood to Sheol.\'";
dby[9] = "And now hold him not guiltless; for thou art a wise man, and thou shalt know what thou oughtest to do to him; but bring his hoar head down to Sheol with blood.";
web[9] = "Now therefore hold him not guiltless: for thou [art] a wise man, and knowest what thou oughtest to do to him; but his hoary head do thou bring down to the grave with blood.";
hnv[9] = "Now therefore don\'t hold him guiltless, for you are a wise man; and you will know what you ought to do to him, and you shall bring his gray head down to She\'ol with blood.";
vul[9] = "tu noli pati esse eum innoxium vir autem sapiens es et scies quae facias ei deducesque canos eius cum sanguine ad infernum";
rsv[10] = "Then David slept with his fathers, and was buried in the city of David.";
asv[10] = "And David slept with his fathers, and was buried in the city of David.";
yng[10] = "And David lieth down with his fathers, and is buried in the city of David,";
dby[10] = "And David slept with his fathers, and was buried in the city of David.";
web[10] = "So David slept with his fathers, and was buried in the city of David.";
hnv[10] = "David slept with his fathers, and was buried in the city of David.";
vul[10] = "dormivit igitur David cum patribus suis et sepultus est in civitate David";
rsv[11] = "And the time that David reigned over Israel was forty years; he reigned seven years in Hebron, and thirty-three years in Jerusalem.";
asv[11] = "And the days that David reigned over Israel were forty years: seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.";
yng[11] = "and the days that David hath reigned over Israel [are] forty years, in Hebron he hath reigned seven years, and in Jerusalem he hath reigned thirty and three years.";
dby[11] = "And the days that David reigned over Israel were forty years: he reigned seven years in Hebron, and he reigned thirty-three years in Jerusalem.";
web[11] = "And the days that David reigned over Israel [were] forty years: seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.";
hnv[11] = "The days that David reigned over Yisra\'el were forty years; seven years reigned he in Hevron, and thirty-three years reigned he in Yerushalayim.";
vul[11] = "dies autem quibus regnavit David super Israhel quadraginta anni sunt in Hebron regnavit septem annis in Hierusalem triginta tribus";
rsv[12] = "So Solomon sat upon the throne of David his father; and his kingdom was firmly established.";
asv[12] = "And Solomon sat upon the throne of David his father; and his kingdom was established greatly.";
yng[12] = "And Solomon hath sat on the throne of David his father, and his kingdom is established greatly,";
dby[12] = "And Solomon sat on the throne of David his father; and his kingdom was established greatly.";
web[12] = "Then Solomon was seated upon the throne of David his father; and his kingdom was established greatly.";
hnv[12] = "Shlomo sat on the throne of David his father; and his kingdom was established greatly.";
vul[12] = "Salomon autem sedit super thronum David patris sui et firmatum est regnum eius nimis";
rsv[13] = "Then Adoni\'jah the son of Haggith came to Bathshe\'ba the mother of Solomon. And she said, &quot;Do you come peaceably?&quot; He said, &quot;Peaceably.&quot;";
asv[13] = "Then Adonijah the son of Haggith came to Bath-sheba the mother of Solomon. And she said, Comest thou peaceably? And he said, Peaceably.";
yng[13] = "and Adonijah son of Haggith cometh in unto Bath-Sheba, mother of Solomon, and she saith, `Is thy coming peace?\' and he saith, `Peace.\'";
dby[13] = "And Adonijah the son of Haggith came to Bathsheba the mother of Solomon. And she said, Comest thou peaceably? And he said, Peaceably.";
web[13] = "And Adonijah the son of Haggith came to Bath-sheba the mother of Solomon. And she said, Comest thou peaceably? and he said, Peaceably.";
hnv[13] = "Then Adoniyahu the son of Haggit came to Bat-Sheva the mother of Shlomo. She said, Come you peaceably? He said, Peaceably.";
vul[13] = "et ingressus est Adonias filius Aggith ad Bethsabee matrem Salomonis quae dixit ei pacificusne ingressus tuus qui respondit pacificus";
rsv[14] = "Then he said, &quot;I have something to say to you.&quot; She said, &quot;Say on.&quot;";
asv[14] = "He said moreover, I have somewhat to say unto thee. And she said, Say on.";
yng[14] = "And he saith, `I have a word unto thee,\' and she saith, `Speak.\'";
dby[14] = "And he said, I have something to say to thee. And she said, Speak.";
web[14] = "He said moreover, I have somewhat to say to thee. And she said, Say on.";
hnv[14] = "He said moreover, I have somewhat to tell you. She said, Say on.";
vul[14] = "addiditque sermo mihi est ad te cui ait loquere et ille";
rsv[15] = "He said, &quot;You know that the kingdom was mine, and that all Israel fully expected me to reign; however the kingdom has turned about and become my brother\'s, for it was his from the LORD.";
asv[15] = "And he said, Thou knowest that the kingdom was mine, and that all Israel set their faces on me, that I should reign: howbeit the kingdom is turned about, and is become my brother\'s; for it was his from Jehovah.";
yng[15] = "And he saith, `Thou hast known that the kingdom was mine, and towards me set their faces had all Israel for reigning, and the kingdom is turned round about, and is my brother\'s, for from Jehovah it was his;";
dby[15] = "And he said, Thou knowest that the kingdom was mine, and all Israel had set their faces on me that I should reign; but the kingdom is turned about and is become my brother\'s, for it was his from Jehovah.";
web[15] = "And he said, Thou knowest that the kingdom was mine, and [that] all Israel set their faces on me, that I should reign: but the kingdom is turned about, and hath become my brother\'s: for it was his from the LORD.";
hnv[15] = "He said, You know that the kingdom was mine, and that all Yisra\'el set their faces on me, that I should reign: however the kingdom is turned about, and is become my brother\'s; for it was his from the LORD.";
vul[15] = "tu inquit nosti quia meum erat regnum et me proposuerat omnis Israhel sibi in regem sed translatum est regnum et factum est fratris mei a Domino enim constitutum est ei";
rsv[16] = "And now I have one request to make of you; do not refuse me.&quot; She said to him, &quot;Say on.&quot;";
asv[16] = "And now I ask one petition of thee; deny me not. And she said unto him, Say on.";
yng[16] = "and now, one petition I am asking of thee -- turn not back my face;\' and she saith unto him, `Speak.\'";
dby[16] = "And now I ask one petition of thee; refuse me not. And she said to him, Speak.";
web[16] = "And now I ask one petition of thee, deny me not. And she said to him, Say on.";
hnv[16] = "Now I ask one petition of you; don\'t deny me. She said to him, Say on.";
vul[16] = "nunc ergo petitionem unam deprecor a te ne confundas faciem meam quae dixit ad eum loquere";
rsv[17] = "And he said, &quot;Pray ask King Solomon--he will not refuse you--to give me Ab\'ishag the Shu\'nammite as my wife.&quot;";
asv[17] = "And he said, Speak, I pray thee, unto Solomon the king (for he will not say thee nay), that he give me Abishag the Shunammite to wife.";
yng[17] = "And he saith, `Speak, I pray thee, to Solomon the king, for he doth not turn back thy face, and he doth give to me Abishag the Shunammite for a wife.\'";
dby[17] = "And he said, Speak, I pray thee, to Solomon the king -- for he will not refuse thee -- that he give me Abishag the Shunammite as wife.";
web[17] = "And he said, Speak, I pray thee, to Solomon the king, (for he will not say to thee no,) that he give me Abishag the Shunamite for a wife.";
hnv[17] = "He said, Please speak to Shlomo the king (for he will not tell you \'no\'), that he give me Avishag the Shunammite as wife.";
vul[17] = "et ille ait precor ut dicas Salomoni regi neque enim negare tibi quicquam potest ut det mihi Abisag Sunamitin uxorem";
rsv[18] = "Bathshe\'ba said, &quot;Very well; I will speak for you to the king.&quot;";
asv[18] = "And Bath-sheba said, Well; I will speak for thee unto the king.";
yng[18] = "And Bath-Sheba saith, `Good; I do speak for thee unto the king.\'";
dby[18] = "And Bathsheba said, Well, I will speak for thee to the king.";
web[18] = "And Bath-sheba said, Well; I will speak for thee to the king.";
hnv[18] = "Bat-Sheva said, Well; I will speak for you to the king.";
vul[18] = "et ait Bethsabee bene ego loquar pro te regi";
rsv[19] = "So Bathshe\'ba went to King Solomon, to speak to him on behalf of Adoni\'jah. And the king rose to meet her, and bowed down to her; then he sat on his throne, and had a seat brought for the king\'s mother; and she sat on his right.";
asv[19] = "Bath-sheba therefore went unto king Solomon, to speak unto him for Adonijah. And the king rose up to meet her, and bowed himself unto her, and sat down on his throne, and caused a throne to be set for the king\'s mother; and she sat on his right hand.";
yng[19] = "And Bath-Sheba cometh in unto king Solomon to speak to him for Adonijah, and the king riseth to meet her, and boweth himself to her, and sitteth on his throne, and placeth a throne for the mother of the king, and she sitteth at his right hand.";
dby[19] = "And Bathsheba went to king Solomon, to speak to him for Adonijah. And the king rose up to meet her, and bowed himself to her, and sat down on his throne; and he caused a throne to be set for the king\'s mother, and she sat on his right hand.";
web[19] = "Bath-sheba therefore went to king Solomon, to speak to him for Adonijah. And the king rose up to meet her, and bowed himself to her, and sat down on his throne, and caused a seat to be set for the king\'s mother; and she sat on his right hand.";
hnv[19] = "Bat-Sheva therefore went to king Shlomo, to speak to him for Adoniyahu. The king rose up to meet her, and bowed himself to her, and sat down on his throne, and caused a throne to be set for the king\'s mother; and she sat on his right hand.";
vul[19] = "venit ergo Bethsabee ad regem Salomonem ut loqueretur ei pro Adonia et surrexit rex in occursum eius adoravitque eam et sedit super thronum suum positus quoque est thronus matri regis quae sedit ad dexteram eius";
rsv[20] = "Then she said, &quot;I have one small request to make of you; do not refuse me.&quot; And the king said to her, &quot;Make your request, my mother; for I will not refuse you.&quot;";
asv[20] = "Then she said, I ask one small petition of thee; deny me not. And the king said unto her, Ask on, my mother; for I will not deny thee.";
yng[20] = "And she saith, `One small petition I ask of thee, turn not back my face;\' and the king saith to her, `Ask, my mother, for I do not turn back thy face.\'";
dby[20] = "Then she said, I desire one small petition of thee; refuse me not. And the king said to her, Ask, my mother, for I will not refuse thee.";
web[20] = "Then she said, I desire one small petition of thee; [I pray thee], deny me not. And the king said to her, Ask on, my mother: for I will not deny thee.";
hnv[20] = "Then she said, I ask one small petition of you; don\'t deny me. The king said to her, Ask on, my mother; for I will not deny you.";
vul[20] = "dixitque ei petitionem unam parvulam ego deprecor a te ne confundas faciem meam dixit ei rex pete mater mi neque enim fas est ut avertam faciem tuam";
rsv[21] = "She said, &quot;Let Ab\'ishag the Shu\'nammite be given to Adoni\'jah your brother as his wife.&quot;";
asv[21] = "And she said, Let Abishag the Shunammite be given to Adonijah thy brother to wife.";
yng[21] = "And she saith, `Let Abishag the Shunammite be given to Adonijah thy brother for a wife.\'";
dby[21] = "And she said, Let Abishag the Shunammite be given to Adonijah thy brother as wife.";
web[21] = "And she said, Let Abishag the Shunamite be given to Adonijah thy brother for a wife.";
hnv[21] = "She said, Let Avishag the Shunammite be given to Adoniyahu your brother as wife.";
vul[21] = "quae ait detur Abisag Sunamitis Adoniae fratri tuo uxor";
rsv[22] = "King Solomon answered his mother, &quot;And why do you ask Ab\'ishag the Shu\'nammite for Adoni\'jah? Ask for him the kingdom also; for he is my elder brother, and on his side are Abi\'athar the priest and Jo\'ab the son of Zeru\'iah.&quot;";
asv[22] = "And king Solomon answered and said unto his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah.";
yng[22] = "And king Solomon answereth and saith to his mother, `And why art thou asking Abishag the Shunammite for Adonijah? also ask for him the kingdom -- for he [is] mine elder brother -- even for him, and for Abiathar the priest, and for Joab son of Zeruiah.\'";
dby[22] = "And king Solomon answered and said to his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah.";
web[22] = "And king Solomon answered and said to his mother, And why dost thou ask Abishag the Shunamite for Adonijah? ask for him the kingdom also; for he [is] my elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah.";
hnv[22] = "King Shlomo answered his mother, Why do you ask Avishag the Shunammite for Adoniyahu? ask for him the kingdom also; for he is my elder brother; even for him, and for Avyatar the Kohen, and for Yo\'av the son of Tzeru\'yah.";
vul[22] = "responditque rex Salomon et dixit matri suae quare postulas Abisag Sunamitin Adoniae postula ei et regnum ipse est enim frater meus maior me et habet Abiathar sacerdotem et Ioab filium Sarviae";
rsv[23] = "Then King Solomon swore by the LORD, saying, &quot;God do so to me and more also if this word does not cost Adoni\'jah his life!";
asv[23] = "Then king Solomon sware by Jehovah, saying, God do so to me, and more also, if Adonijah hath not spoken this word against his own life.";
yng[23] = "And king Solomon sweareth by Jehovah, saying, `Thus doth God to me, and thus He doth add -- surely against his soul hath Adonijah spoken this word;";
dby[23] = "And king Solomon swore by Jehovah saying, God do so to me, and more also, -- Adonijah has spoken this word against his own life!";
web[23] = "Then king Solomon swore by the LORD, saying, God do so to me, and more also, if Adonijah hath not spoken this word against his own life.";
hnv[23] = "Then king Shlomo swore by the LORD, saying, God do so to me, and more also, if Adoniyahu has not spoken this word against his own life.";
vul[23] = "iuravit itaque rex Salomon per Dominum dicens haec faciat mihi Deus et haec addat quia contra animam suam locutus est Adonias verbum hoc";
rsv[24] = "Now therefore as the LORD lives, who has established me, and placed me on the throne of David my father, and who has made me a house, as he promised, Adoni\'jah shall be put to death this day.&quot;";
asv[24] = "Now therefore as Jehovah liveth, who hath established me, and set me on the throne of David my father, and who hath made me a house, as he promised, surely Adonijah shall be put to death this day.";
yng[24] = "and now, Jehovah liveth, who hath established me, and causeth me to sit on the throne of David my father, and who hath made for me an house as He spake -- surely to-day is Adonijah put to death.\'";
dby[24] = "And now [as] Jehovah liveth, who has established me, and set me on the throne of David my father, and who has made me a house, as he promised, Adonijah shall be put to death this day.";
web[24] = "Now therefore, [as] the LORD liveth, who hath established me, and set me on the throne of David my father, and who hath made me a house, as he promised, Adonijah shall be put to death this day.";
hnv[24] = "Now therefore as the LORD lives, who has established me, and set me on the throne of David my father, and who has made me a house, as he promised, surely Adoniyahu shall be put to death this day.";
vul[24] = "et nunc vivit Dominus qui firmavit me et conlocavit super solium David patris mei et qui fecit mihi domum sicut locutus est quia hodie occidetur Adonias";
rsv[25] = "So King Solomon sent Benai\'ah the son of Jehoi\'ada; and he struck him down, and he died.";
asv[25] = "And king Solomon sent by Benaiah the son of Jehoiada; and he fell upon him, so that he died.";
yng[25] = "And king Solomon sendeth by the hand of Benaiah son of Jehoiada, and he falleth upon him, and he dieth.";
dby[25] = "And king Solomon sent by the hand of Benaiah the son of Jehoiada; who fell on him, that he died.";
web[25] = "And king Solomon sent by the hand of Benaiah the son of Jehoiada; and he fell upon him that he died.";
hnv[25] = "King Shlomo sent by Benayah the son of Yehoiada; and he fell on him, so that he died.";
vul[25] = "misitque rex Salomon per manum Banaiae filii Ioiadae qui interfecit eum et mortuus est";
rsv[26] = "And to Abi\'athar the priest the king said, &quot;Go to An\'athoth, to your estate; for you deserve death. But I will not at this time put you to death, because you bore the ark of the Lord GOD before David my father, and because you shared in all the affliction of my father.&quot;";
asv[26] = "And unto Abiathar the priest said the king, Get thee to Anathoth, unto thine own fields; for thou art worthy of death: but I will not at this time put thee to death, because thou barest the ark of the Lord Jehovah before David my father, and because thou wast afflicted in all wherein my father was afflicted.";
yng[26] = "And to Abiathar the priest said the king, `To Anathoth go, unto thy fields; for a man of death thou [art], but in this day I do not put thee to death, because thou hast borne the ark of the Lord Jehovah before David my father, and because thou wast afflicted in all that my father was afflicted in.\'";
dby[26] = "And the king said to Abiathar the priest, Go to Anathoth, to thine own fields; for thou art worthy of death; but I will not at this time put thee to death, because thou didst bear the ark of Adonai Jehovah before David my father, and because thou hast been afflicted in all wherein my father was afflicted.";
web[26] = "And to Abiathar the priest said the king, Depart to Anathoth, to thy own fields; for thou [art] worthy of death: but I will not at this time put thee to death, because thou didst bear the ark of the Lord GOD before David my father, and because thou hast been afflicted in all in which my father was afflicted.";
hnv[26] = "To Avyatar the Kohen said the king, Get you to `Anatot, to your own fields; for you are worthy of death: but I will not at this time put you to death, because you bear the ark of the Lord GOD before David my father, and because you were afflicted in all in which my father was afflicted.";
vul[26] = "Abiathar quoque sacerdoti dixit rex vade in Anathot ad agrum tuum es quidem vir mortis sed hodie te non interficiam quia portasti arcam Domini Dei coram David patre meo et sustinuisti laborem in omnibus in quibus laboravit pater meus";
rsv[27] = "So Solomon expelled Abi\'athar from being priest to the LORD, thus fulfilling the word of the LORD which he had spoken concerning the house of Eli in Shiloh.";
asv[27] = "So Solomon thrust out Abiathar from being priest unto Jehovah, that he might fulfil the word of Jehovah, which he spake concerning the house of Eli in Shiloh.";
yng[27] = "And Solomon casteth out Abiathar from being priest to Jehovah, to fulfil the word of Jehovah which He spake concerning the house of Eli in Shiloh.";
dby[27] = "And Solomon thrust out Abiathar from being priest to Jehovah, to fulfil the word of Jehovah, which he had spoken concerning the house of Eli in Shiloh.";
web[27] = "So Solomon removed Abiathar from being priest to the LORD; that he might fulfill the word of the LORD, which he spoke concerning the house of Eli in Shiloh.";
hnv[27] = "So Shlomo thrust out Avyatar from being Kohen to the LORD, that he might fulfill the word of the LORD, which he spoke concerning the house of `Eli in Shiloh.";
vul[27] = "eiecit ergo Salomon Abiathar ut non esset sacerdos Domini ut impleretur sermo Domini quem locutus est super domum Heli in Silo";
rsv[28] = "When the news came to Jo\'ab--for Jo\'ab had supported Adoni\'jah although he had not supported Ab\'salom--Jo\'ab fled to the tent of the LORD and caught hold of the horns of the altar.";
asv[28] = "And the tidings came to Joab; for Joab had turned after Adonijah, though he turned not after Absalom. And Joab fled unto the Tent of Jehovah, and caught hold on the horns of the altar.";
yng[28] = "And the report hath come unto Joab -- for Joab hath turned aside after Adonijah, though after Absalom he did not turn aside -- and Joab fleeth unto the tent of Jehovah, and layeth hold on the horns of the altar.";
dby[28] = "And the report came to Joab (for Joab had turned after Adonijah, though he had not turned after Absalom); and Joab fled to the tent of Jehovah, and caught hold of the horns of the altar.";
web[28] = "Then tidings came to Joab: for Joab had turned after Adonijah, though he turned not after Absalom. And Joab fled to the tabernacle of the LORD, and caught hold on the horns of the altar.";
hnv[28] = "The news came to Yo\'av; for Yo\'av had turned after Adoniyahu, though he didn\'t turn after Avshalom. Yo\'av fled to the Tent of the LORD, and caught hold on the horns of the altar.";
vul[28] = "venit autem nuntius ad Ioab quod Ioab declinasset post Adoniam et post Absalom non declinasset fugit ergo Ioab in tabernaculum Domini et adprehendit cornu altaris";
rsv[29] = "And when it was told King Solomon, &quot;Jo\'ab has fled to the tent of the LORD, and behold, he is beside the altar,&quot; Solomon sent Benai\'ah the son of Jehoi\'ada, saying, &quot;Go, strike him down.&quot;";
asv[29] = "And it was told king Solomon, Joab is fled unto the Tent of Jehovah, and, behold, he is by the altar. Then Solomon sent Benaiah the son of Jehoiada, saying, Go, fall upon him.";
yng[29] = "And it is declared to king Solomon that Joab hath fled unto the tent of Jehovah, and lo, near the altar; and Solomon sendeth Benaiah son of Jehoiada, saying, `Go, fall upon him.\'";
dby[29] = "And it was told king Solomon that Joab had fled to the tent of Jehovah; and behold, he is by the altar. And Solomon sent Benaiah the son of Jehoiada, saying, Go, fall on him.";
web[29] = "And it was told to king Solomon that Joab had fled to the tabernacle of the LORD; and behold, [he is] by the altar. Then Solomon sent Benaiah the son of Jehoiada, saying, Go, fall upon him.";
hnv[29] = "It was told king Shlomo, Yo\'av is fled to the Tent of the LORD, and, behold, he is by the altar. Then Shlomo sent Benayah the son of Yehoiada, saying, Go, fall on him.";
vul[29] = "nuntiatumque est regi Salomoni quod fugisset Ioab in tabernaculum Domini et esset iuxta altare misitque Salomon Banaiam filium Ioiadae dicens vade interfice eum";
rsv[30] = "So Benai\'ah came to the tent of the LORD, and said to him, &quot;The king commands, \'Come forth.\'&quot; But he said, &quot;No, I will die here.&quot; Then Benai\'ah brought the king word again, saying, &quot;Thus said Jo\'ab, and thus he answered me.&quot;";
asv[30] = "And Benaiah came to the Tent of Jehovah, and said unto him, Thus saith the king, Come forth. And he said, Nay; but I will die here. And Benaiah brought the king word again, saying, Thus said Joab, and thus he answered me.";
yng[30] = "And Benaiah cometh in unto the tent of Jehovah, and saith unto him, `Thus said the king, Come out;\' and he saith, `Nay, but here I die.\' And Benaiah bringeth back the king word, saying, `Thus spake Joab, yea, thus he answered me.\'";
dby[30] = "And Benaiah came to the tent of Jehovah and said to him, Thus saith the king: Come forth. And he said, No; for I will die here. And Benaiah brought the king word again, saying, Thus said Joab, and thus he answered me.";
web[30] = "And Benaiah came to the tabernacle of the LORD, and said to him, Thus saith the king, Come forth. And he said, No; but I will die here. And Benaiah brought the king word again, saying, Thus said Joab, and thus he answered me.";
hnv[30] = "Benayah came to the Tent of the LORD, and said to him, Thus says the king, Come forth. He said, No; but I will die here. Benayah brought the king word again, saying, Thus said Yo\'av, and thus he answered me.";
vul[30] = "venit Banaias ad tabernaculum Domini et dixit ei haec dicit rex egredere qui ait non egrediar sed hic moriar renuntiavit Banaias regi sermonem dicens haec locutus est Ioab et haec respondit mihi";
rsv[31] = "The king replied to him, &quot;Do as he has said, strike him down and bury him; and thus take away from me and from my father\'s house the guilt for the blood which Jo\'ab shed without cause.";
asv[31] = "And the king said unto him, Do as he hath said, and fall upon him, and bury him; that thou mayest take away the blood, which Joab shed without cause, from me and from my father\'s house.";
yng[31] = "And the king saith to him, `Do as he hath spoken, and fall upon him, and thou hast buried him, and turned aside the causeless blood which Joab shed, from off me, and from off the house of my father;";
dby[31] = "And the king said to him, Do as he has said, and fall upon him, and bury him; and take away the innocent blood, which Joab shed, from me and from the house of my father.";
web[31] = "And the king said to him, Do as he hath said, and fall upon him, and bury him; that thou mayest take away the innocent blood which Joab shed, from me, and from the house of my father.";
hnv[31] = "The king said to him, Do as he has said, and fall on him, and bury him; that you may take away the blood, which Yo\'av shed without cause, from me and from my father\'s house.";
vul[31] = "dixitque ei rex fac sicut locutus est et interfice eum et sepeli et amovebis sanguinem innocentem qui effusus est a Ioab a me et a domo patris mei";
rsv[32] = "The LORD will bring back his bloody deeds upon his own head, because, without the knowledge of my father David, he attacked and slew with the sword two men more righteous and better than himself, Abner the son of Ner, commander of the army of Israel, and Ama\'sa the son of Jether, commander of the army of Judah.";
asv[32] = "And Jehovah will return his blood upon his own head, because he fell upon two men more righteous and better than he, and slew them with the sword, and my father David knew it not, [to wit], Abner the son of Ner, captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah.";
yng[32] = "and Jehovah hath turned back his blood on his own head, who hath fallen on two men more righteous and better than he, and slayeth them with the sword, -- and my father David knew not -- Abner son of Ner, head of the host of Israel, and Amasa son of Jether, head of the host of Judah;";
dby[32] = "And Jehovah shall requite the blood which he shed upon his own head, because he fell upon two men more righteous and better than he, and slew them with the sword, without my father David\'s knowledge: Abner the son of Ner, captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah.";
web[32] = "And the LORD shall return his blood upon his own head, who fell upon two men more righteous and better than he, and slew them with the sword, my father David not knowing [of it], [to wit], Abner the son of Ner captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah.";
hnv[32] = "The LORD will return his blood on his own head, because he fell on two men more righteous and better than he, and killed them with the sword, and my father David didn\'t know it, [to wit], Aviner the son of Ner, captain of the host of Yisra\'el, and `Amasa the son of Yeter, captain of the host of Yehudah.";
vul[32] = "et reddat Dominus sanguinem eius super caput eius quia interfecit duos viros iustos melioresque se et occidit eos gladio patre meo David ignorante Abner filium Ner principem militiae Israhel et Amasa filium Iether principem exercitus Iuda";
rsv[33] = "So shall their blood come back upon the head of Jo\'ab and upon the head of his descendants for ever; but to David, and to his descendants, and to his house, and to his throne, there shall be peace from the LORD for evermore.&quot;";
asv[33] = "So shall their blood return upon the head of Joab, and upon the head of his seed for ever: but unto David, and unto his seed, and unto his house, and unto his throne, shall there be peace for ever from Jehovah.";
yng[33] = "yea, turned back hath their blood on the head of Joab, and on the head of his seed to the age; and for David, and for his seed, and for his house, and for his throne, there is peace unto the age, from Jehovah.\'";
dby[33] = "And their blood shall be requited upon the head of Joab, and upon the head of his seed for ever; but upon David, and upon his seed, and upon his house, and upon his throne, shall there be peace for ever from Jehovah.";
web[33] = "Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever: but upon David, and upon his seed, and upon his house, and upon his throne, shall there be peace forever from the LORD.";
hnv[33] = "So shall their blood return on the head of Yo\'av, and on the head of his seed forever: but to David, and to his seed, and to his house, and to his throne, shall there be shalom for ever from the LORD.";
vul[33] = "et revertetur sanguis illorum in caput Ioab et in caput seminis eius in sempiternum David autem et semini eius et domui et throno illius sit pax usque in aeternum a Domino";
rsv[34] = "Then Benai\'ah the son of Jehoi\'ada went up, and struck him down and killed him; and he was buried in his own house in the wilderness.";
asv[34] = "Then Benaiah the son of Jehoiada went up, and fell upon him, and slew him; and he was buried in his own house in the wilderness.";
yng[34] = "And Benaiah son of Jehoiada goeth up and falleth upon him, and putteth him to death, and he is buried in his own house in the wilderness,";
dby[34] = "And Benaiah the son of Jehoiada went up and fell upon him, and put him to death; and he was buried in his own house in the wilderness.";
web[34] = "So Benaiah the son of Jehoiada went, and fell upon him, and slew him: and he was buried in his own house in the wilderness.";
hnv[34] = "Then Benayah the son of Yehoiada went up, and fell on him, and killed him; and he was buried in his own house in the wilderness.";
vul[34] = "ascendit itaque Banaias filius Ioiadae et adgressus eum interfecit sepultusque est in domo sua in deserto";
rsv[35] = "The king put Benai\'ah the son of Jehoi\'ada over the army in place of Jo\'ab, and the king put Zadok the priest in the place of Abi\'athar.";
asv[35] = "And the king put Benaiah the son of Jehoiada in his room over the host; and Zadok the priest did the king put in the room of Abiathar.";
yng[35] = "and the king putteth Benaiah son of Jehoiada in his stead over the host, and Zadok the priest hath the king put in the stead of Abiathar.";
dby[35] = "And the king put Benaiah the son of Jehoiada in his stead over the host; and Zadok the priest the king put in the stead of Abiathar.";
web[35] = "And the king put Benaiah the son of Jehoiada in his room over the army: and Zadok the priest the king put in the room of Abiathar.";
hnv[35] = "The king put Benayah the son of Yehoiada in his room over the host; and Tzadok the Kohen did the king put in the room of Avyatar.";
vul[35] = "et constituit rex Banaiam filium Ioiadae pro eo super exercitum et Sadoc sacerdotem posuit pro Abiathar";
rsv[36] = "Then the king sent and summoned Shim\'e-i, and said to him, &quot;Build yourself a house in Jerusalem, and dwell there, and do not go forth from there to any place whatever.";
asv[36] = "And the king sent and called for Shimei, and said unto him, Build thee a house in Jerusalem, and dwell there, and go not forth thence any whither.";
yng[36] = "And the king sendeth and calleth for Shimei, and saith to him, `Build for thee a house in Jerusalem, and thou hast dwelt there, and dost not go out thence any where;";
dby[36] = "And the king sent and called for Shimei, and said to him, Build thee a house in Jerusalem, and abide there, and go not forth thence anywhere.";
web[36] = "And the king sent and called for Shimei, and said to him, Build thee a house in Jerusalem, and dwell there, and go not forth thence to any place whatever.";
hnv[36] = "The king sent and called for Shim`i, and said to him, Build yourself a house in Yerushalayim, and dwell there, and don\'t go forth from there any where.";
vul[36] = "misit quoque rex et vocavit Semei dixitque ei aedifica tibi domum in Hierusalem et habita ibi et non egredieris inde huc atque illuc";
rsv[37] = "For on the day you go forth, and cross the brook Kidron, know for certain that you shall die; your blood shall be upon your own head.&quot;";
asv[37] = "For on the day thou goest out, and passest over the brook Kidron, know thou for certain that thou shalt surely die: thy blood shall be upon thine own head.";
yng[37] = "and it hath been, in the day of thy going out, and thou hast passed over the brook Kidron, thou dost certainly know that thou dost surely die -- thy blood is on thy head.\'";
dby[37] = "And it shall be that on the day thou goest forth, and passest over the torrent of Kidron, ... know for certain that thou shalt surely die: thy blood shall be upon thine own head.";
web[37] = "For it shall be, [that] on the day thou shalt go out, and pass over the brook Kidron, thou shalt know for certain that thou shalt surely die: thy blood shall be upon thy own head.";
hnv[37] = "For on the day you go out, and pass over the brook Kidron, know you for certain that you shall surely die: your blood shall be on your own head.";
vul[37] = "quacumque autem die egressus fueris et transieris torrentem Cedron scito te interficiendum sanguis tuus erit super caput tuum";
rsv[38] = "And Shim\'e-i said to the king, &quot;What you say is good; as my lord the king has said, so will your servant do.&quot; So Shim\'e-i dwelt in Jerusalem many days.";
asv[38] = "And Shimei said unto the king, The saying is good: as my lord the king hath said, so will thy servant do. And Shimei dwelt in Jerusalem many days.";
yng[38] = "And Shimei saith to the king, `The word [is] good; as my lord the king hath spoken so doth thy servant do;\' and Shimei dwelleth in Jerusalem many days.";
dby[38] = "And Shimei said to the king, The saying is good: as my lord the king has said, so will thy servant do. And Shimei dwelt in Jerusalem many days.";
web[38] = "And Shimei said to the king, The saying [is] good: as my lord the king hath said, so will thy servant do. And Shimei dwelt in Jerusalem many days.";
hnv[38] = "Shim`i said to the king, The saying is good: as my lord the king has said, so will your servant do. Shim`i lived in Yerushalayim many days.";
vul[38] = "dixitque Semei regi bonus sermo sicut locutus est dominus meus rex sic faciet servus tuus habitavit itaque Semei in Hierusalem diebus multis";
rsv[39] = "But it happened at the end of three years that two of Shim\'e-i\'s slaves ran away to Achish, son of Ma\'acah, king of Gath. And when it was told Shim\'e-i, &quot;Behold, your slaves are in Gath,&quot;";
asv[39] = "And it came to pass at the end of three years, that two of the servants of Shimei ran away unto Achish, son of Maacah, king of Gath. And they told Shimei, saying, Behold, thy servants are in Gath.";
yng[39] = "And it cometh to pass, at the end of three years, that flee do two of the servants of Shimei unto Achish son of Maachah, king of Gath, and they declare to Shimei, saying, `Lo, thy servants [are] in Gath;\'";
dby[39] = "And it came to pass at the end of three years, that two servants of Shimei\'s ran away to Achish son of Maachah, king of Gath. And they told Shimei saying, Behold, thy servants are in Gath.";
web[39] = "And it came to pass at the end of three years, that two of the servants of Shimei ran away to Achish son of Maachah king of Gath: and they told Shimei, saying, behold, thy servants are in Gath.";
hnv[39] = "It happened at the end of three years, that two of the servants of Shim`i ran away to Akhish, son of Ma`akhah, king of Gat. They told Shim`i, saying, Behold, your servants are in Gat.";
vul[39] = "factum est autem post annos tres ut fugerent servi Semei ad Achis filium Maacha regem Geth nuntiatumque est Semei quod servi eius essent in Geth";
rsv[40] = "Shim\'e-i arose and saddled an ass, and went to Gath to Achish, to seek his slaves; Shim\'e-i went and brought his slaves from Gath.";
asv[40] = "And Shimei arose, and saddled his ass, and went to Gath to Achish, to seek his servants; and Shimei went, and brought his servants from Gath.";
yng[40] = "and Shimei riseth, and saddleth his ass, and goeth to Gath, unto Achish, to seek his servants, and Shimei goeth and bringeth his servants from Gath.";
dby[40] = "Then Shimei arose, and saddled his ass, and went to Gath, to Achish, to seek his servants; and Shimei went, and brought his servants from Gath.";
web[40] = "And Shimei arose, and saddled his ass, and went to Gath to Achish to seek his servants: and Shimei went and brought his servants from Gath.";
hnv[40] = "Shim`i arose, and saddled his donkey, and went to Gat to Akhish, to seek his servants; and Shim`i went, and brought his servants from Gat.";
vul[40] = "et surrexit Semei et stravit asinum suum ivitque in Geth ad Achis ad requirendos servos suos et adduxit eos de Geth";
rsv[41] = "And when Solomon was told that Shim\'e-i had gone from Jerusalem to Gath and returned,";
asv[41] = "And it was told Solomon that Shimei had gone from Jerusalem to Gath, and was come again.";
yng[41] = "And it is declared to Solomon that Shimei hath gone from Jerusalem to Gath, and doth return,";
dby[41] = "And it was told Solomon that Shimei had gone from Jerusalem to Gath, and had come again.";
web[41] = "And it was told to Solomon that Shimei had gone from Jerusalem to Gath, and had returned.";
hnv[41] = "It was told Shlomo that Shim`i had gone from Yerushalayim to Gat, and was come again.";
vul[41] = "nuntiatum est autem Salomoni quod isset Semei in Geth de Hierusalem et redisset";
rsv[42] = "the king sent and summoned Shim\'e-i, and said to him, &quot;Did I not make you swear by the LORD, and solemnly admonish you, saying, \'Know for certain that on the day you go forth and go to any place whatever, you shall die\'? And you said to me, \'What you say is good; I obey.\'";
asv[42] = "And the king sent and called for Shimei, and said unto him, Did I not adjure thee by Jehovah, and protest unto thee, saying, Know for certain, that on the day thou goest out, and walkest abroad any whither, thou shalt surely die? and thou saidst unto me, The saying that I have heard is good.";
yng[42] = "and the king sendeth and calleth for Shimei, and saith unto him, `Have I not caused thee to swear by Jehovah -- and I testify against thee, saying, In the day of thy going out, and thou hast gone anywhere, thou dost certainly know that thou dost surely die; and thou sayest unto me, The word I have heard [is] good?";
dby[42] = "And the king sent and called for Shimei, and said to him, Did I not make thee swear by Jehovah, and protest to thee, saying, Know for certain, that on the day thou goest forth, and walkest abroad anywhere, thou shalt surely die? and thou saidst to me, The word that I have heard is good.";
web[42] = "And the king sent and called for Shimei, and said to him, Did I not make thee to swear by the LORD, and protest to thee, saying, Know for a certain, on the day thou goest out, and walkest any where abroad, that thou shalt surely die? and thou saidst to me, The word [that] I have heard [is] good.";
hnv[42] = "The king sent and called for Shim`i, and said to him, Didn\'t I adjure you by the LORD, and protest to you, saying, Know for certain, that on the day you go out, and walk abroad any where, you shall surely die? and you said to me, The saying that I have heard is good.";
vul[42] = "et mittens vocavit eum dixitque illi nonne testificatus sum tibi per Dominum et praedixi tibi quacumque die egressus ieris huc et illuc scito te esse moriturum et respondisti mihi bonus sermo audivi";
rsv[43] = "Why then have you not kept your oath to the LORD and the commandment with which I charged you?&quot;";
asv[43] = "Why then hast thou not kept the oath of Jehovah, and the commandment that I have charged thee with?";
yng[43] = "and wherefore hast thou not kept the oath of Jehovah, and the charge that I charged upon thee?\'";
dby[43] = "Why then hast thou not kept the oath of Jehovah, and the commandment that I charged thee with?";
web[43] = "Why then hast thou not kept the oath of the LORD, and the commandment that I have charged thee with?";
hnv[43] = "Why then have you not kept the oath of the LORD, and the mitzvah that I have charged you with?";
vul[43] = "quare ergo non custodisti iusiurandum Domini et praeceptum quod praeceperam tibi";
rsv[44] = "The king also said to Shim\'e-i, &quot;You know in your own heart all the evil that you did to David my father; so the LORD will bring back your evil upon your own head.";
asv[44] = "The king said moreover to Shimei, Thou knowest all the wickedness which thy heart is privy to, that thou didst to David my father: therefore Jehovah shall return thy wickedness upon thine own head.";
yng[44] = "And the king saith unto Shimei, `Thou hast known all the evil that thy heart hath known, which thou didest to David my father, and Jehovah hath turned back thine evil on thy head,";
dby[44] = "And the king said to Shimei, Thou knowest all the wickedness of which thy heart is conscious, which thou didst to David my father; and Jehovah returns thy wickedness upon thine own head;";
web[44] = "The king said moreover to Shimei, Thou knowest all the wickedness which thy heart is privy to, that thou didst to David my father: therefore the LORD will return thy wickedness upon thy own head;";
hnv[44] = "The king said moreover to Shim`i, You know all the wickedness which your heart is privy to, that you did to David my father: therefore the LORD shall return your wickedness on your own head.";
vul[44] = "dixitque rex ad Semei tu nosti omne malum cuius tibi conscium est cor tuum quod fecisti David patri meo reddidit Dominus malitiam tuam in caput tuum";
rsv[45] = "But King Solomon shall be blessed, and the throne of David shall be established before the LORD for ever.&quot;";
asv[45] = "But king Solomon shall be blessed, and the throne of David shall be established before Jehovah for ever.";
yng[45] = "and king Solomon [is] blessed, and the throne of David is established before Jehovah unto the age.\'";
dby[45] = "and king Solomon shall be blessed, and the throne of David shall be established before Jehovah for ever.";
web[45] = "And king Solomon [shall be] blessed, and the throne of David shall be established before the LORD for ever.";
hnv[45] = "But king Shlomo shall be blessed, and the throne of David shall be established before the LORD forever.";
vul[45] = "et rex Salomon benedictus et thronus David erit stabilis coram Domino usque in sempiternum";
rsv[46] = "Then the king commanded Benai\'ah the son of Jehoi\'ada; and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.";
asv[46] = "So the king commanded Benaiah the son of Jehoiada; and he went out, and fell upon him, so that he died. And the kingdom was established in the hand of Solomon.";
yng[46] = "And the king chargeth Benaiah son of Jehoiada, and he goeth out and falleth on him, and he dieth, and the kingdom is established in the hand of Solomon.";
dby[46] = "And the king commanded Benaiah the son of Jehoiada; who went out and fell upon him, and he died. And the kingdom was established in the hand of Solomon.";
web[46] = "So the king commanded Benaiah the son of Jehoiada; who went out, and fell upon him, that he died. And the kingdom was established in the hand of Solomon.";
hnv[46] = "So the king commanded Benayah the son of Yehoiada; and he went out, and fell on him, so that he died. The kingdom was established in the hand of Shlomo.";
vul[46] = "iussit itaque rex Banaiae filio Ioiadae qui egressus percussit eum et mortuus est";
</script>
