csb[1] = "Now Elijah the Tishbite, from the Gilead settlers, said to Ahab, &quot;As the LORD God of Israel lives, in whose presence I stand, there will be no dew or rain during these years except by my command! &quot;";
csb[2] = "Then the word of the LORD came to him:";
csb[3] = "&quot;Leave here, turn eastward, and hide at the Wadi Cherith where it enters the Jordan.";
csb[4] = "&quot;You are to drink from the wadi. I have commanded the ravens to provide for you there.&quot;";
csb[5] = "So he proceeded to do what the LORD commanded. Elijah left and lived at the Wadi Cherith where it enters the Jordan.";
csb[6] = "The ravens kept bringing him bread and meat in the morning and in the evening, and he would drink from the wadi.";
csb[7] = "After a while, the wadi dried up because there had been no rain in the land.";
csb[8] = "Then the word of the LORD came to him:";
csb[9] = "&quot;Get up, go to Zarephath that belongs to Sidon and stay there. Look, I have commanded a woman who is a widow to provide for you there.&quot;";
csb[10] = "So Elijah got up and went to Zarephath. When he arrived at the city gate, there was a widow gathering wood. Elijah called to her and said, &quot;Please bring me a little water in a cup and let me drink.&quot;";
csb[11] = "As she went to get it, he called to her and said, &quot;Please bring me a piece of bread in your hand.&quot;";
csb[12] = "But she said, &quot;As the LORD your God lives, I don\'t have anything baked -- only a handful of flour in the jar and a bit of oil in the jug. Just now, I am gathering a couple of sticks in order to go prepare it for myself and my son so we can eat it and die.&quot;";
csb[13] = "Then Elijah said to her, &quot;Don\'t be afraid; go and do as you have said. But first make me a small loaf from it and bring it out to me. Afterward, you may make some for yourself and your son,";
csb[14] = "&quot;for this is what the LORD God of Israel says, \'The flour jar will not become empty and the oil jug will not run dry until the day the LORD sends rain on the surface of the land.\' &quot;";
csb[15] = "So she proceeded to do according to the word of Elijah. Then the woman, Elijah, and her household ate for many days.";
csb[16] = "The flour jar did not become empty, and the oil jug did not run dry, according to the word of the LORD he had spoken through Elijah.";
csb[17] = "After this, the son of the woman who owned the house became ill. His illness got worse until he stopped breathing.";
csb[18] = "She said to Elijah, &quot;Man of God, why are you here? Have you come to call attention to my iniquity so that my son is put to death? &quot;";
csb[19] = "But Elijah said to her, &quot;Give me your son.&quot; So he took him from her arms, brought him up to the upstairs room where he was staying, and laid him on his own bed.";
csb[20] = "Then he cried out to the LORD and said, &quot;LORD my God, have you also brought tragedy on the widow I am staying with by killing her son? &quot;";
csb[21] = "Then he stretched himself out over the boy three times. He cried out to the LORD and said, &quot;LORD my God, please let this boy\'s life come into him again! &quot;";
csb[22] = "So the LORD listened to Elijah, and the boy\'s life came into him again, and he lived.";
csb[23] = "Then Elijah took the boy, brought him down from the upstairs room into the house, and gave him to his mother. Elijah said, &quot;Look, your son is alive.&quot;";
csb[24] = "Then the woman said to Elijah, &quot;Now I know you are a man of God and the LORD\'s word from your mouth is true.&quot;";
