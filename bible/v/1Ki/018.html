csb[1] = "After a long time, the word of the LORD came to Elijah in the third year: &quot;Go and present yourself to Ahab. I will send rain on the surface of the land.&quot;";
csb[2] = "So Elijah went to present himself to Ahab. The famine was severe in Samaria.";
csb[3] = "Ahab called for Obadiah, who was in charge of the palace. Obadiah was a man who greatly feared the LORD";
csb[4] = "and took a hundred prophets and hid them, fifty men to a cave, and provided them with food and water when Jezebel slaughtered the LORD\'s prophets.";
csb[5] = "Ahab said to Obadiah, &quot;Go throughout the land to every spring and to every wadi. Perhaps we\'ll find grass so we can keep the horses and mules alive and not have to destroy any cattle.&quot;";
csb[6] = "They divided the land between them in order to cover it. Ahab went one way by himself, and Obadiah went the other way by himself.";
csb[7] = "While Obadiah was walking along the road, Elijah suddenly met him. When Obadiah recognized him, he fell facedown and said, &quot;Is it you, my lord Elijah? &quot;";
csb[8] = "&quot;It is I,&quot; he replied. &quot;Go tell your lord, \'Elijah is here! \' &quot;";
csb[9] = "But Obadiah said, &quot;What sin have I committed, that you are handing your servant over to Ahab to put me to death?";
csb[10] = "&quot;As the LORD your God lives, there is no nation or kingdom where my lord has not sent someone to search for you. When they said, \'He is not here,\' he made that kingdom or nation swear they had not found you.";
csb[11] = "&quot;Now you say, \'Go tell your lord, &quot;Elijah is here! &quot; \'";
csb[12] = "But when I leave you, the Spirit of the LORD may carry you off to some place I don\'t know. Then when I go report to Ahab and he doesn\'t find you, he will kill me. But I, your servant, have feared the LORD from my youth.";
csb[13] = "Wasn\'t it reported to my lord what I did when Jezebel slaughtered the LORD\'s prophets? I hid a hundred of the prophets of the LORD, fifty men to a cave, and I provided them with food and water.";
csb[14] = "Now you say, \'Go tell your lord, &quot;Elijah is here! &quot; \' He will kill me! &quot;";
csb[15] = "Then Elijah said, &quot;As the LORD of Armies lives, in whose presence I stand, today I will present myself to Ahab.&quot;";
csb[16] = "Obadiah went to meet Ahab and told him. Then Ahab went to meet Elijah.";
csb[17] = "When Ahab saw Elijah, Ahab said to him, &quot;Is that you, the one ruining Israel? &quot;";
csb[18] = "He replied, &quot;I have not ruined Israel, but you and your father\'s family have, because you have abandoned the LORD\'s commands and followed the Baals.";
csb[19] = "&quot;Now summon all Israel to meet me at Mount Carmel, along with the 450 prophets of Baal and the 400 prophets of Asherah who eat at Jezebel\'s table.&quot;";
csb[20] = "So Ahab summoned all the Israelites and gathered the prophets at Mount Carmel.";
csb[21] = "Then Elijah approached all the people and said, &quot;How long will you waver between two opinions? If the LORD is God, follow him. But if Baal, follow him.&quot; But the people didn\'t answer him a word.";
csb[22] = "Then Elijah said to the people, &quot;I am the only remaining prophet of the LORD, but Baal\'s prophets are 450 men.";
csb[23] = "&quot;Let two bulls be given to us. They are to choose one bull for themselves, cut it in pieces, and place it on the wood but not light the fire. I will prepare the other bull and place it on the wood but not light the fire.";
csb[24] = "&quot;Then you call on the name of your god, and I will call on the name of the LORD. The God who answers with fire, he is God.&quot; All the people answered, &quot;That\'s fine.&quot;";
csb[25] = "Then Elijah said to the prophets of Baal, &quot;Since you are so numerous, choose for yourselves one bull and prepare it first. Then call on the name of your god but don\'t light the fire.&quot;";
csb[26] = "So they took the bull that he gave them, prepared it, and called on the name of Baal from morning until noon, saying, &quot;Baal, answer us! &quot; But there was no sound; no one answered. Then they danced around the altar they had made.";
csb[27] = "At noon Elijah mocked them. He said, &quot;Shout loudly, for he\'s a god! Maybe he\'s thinking it over; maybe he has wandered away; or maybe he\'s on the road. Perhaps he\'s sleeping and will wake up! &quot;";
csb[28] = "They shouted loudly, and cut themselves with knives and spears, according to their custom, until blood gushed over them.";
csb[29] = "All afternoon they kept on raving until the offering of the evening sacrifice, but there was no sound; no one answered, no one paid attention.";
csb[30] = "Then Elijah said to all the people, &quot;Come near me.&quot; So all the people approached him. Then he repaired the LORD\'s altar that had been torn down:";
csb[31] = "Elijah took twelve stones -- according to the number of the tribes of the sons of Jacob, to whom the word of the LORD had come, saying, &quot;Israel will be your name&quot; --";
csb[32] = "and he built an altar with the stones in the name of the LORD. Then he made a trench around the altar large enough to hold about four gallons.";
csb[33] = "Next, he arranged the wood, cut up the bull, and placed it on the wood. He said, &quot;Fill four water pots with water and pour it on the offering to be burned and on the wood.&quot;";
csb[34] = "Then he said, &quot;A second time! &quot; and they did it a second time. And then he said, &quot;A third time! &quot; and they did it a third time.";
csb[35] = "So the water ran all around the altar; he even filled the trench with water.";
csb[36] = "At the time for offering the evening sacrifice, the prophet Elijah approached the altar and said, &quot;LORD, the God of Abraham, Isaac, and Israel, today let it be known that you are God in Israel and I am your servant, and that at your word I have done all these things.";
csb[37] = "&quot;Answer me, LORD! Answer me so that this people will know that you, the LORD, are God and that you have turned their hearts back.&quot;";
csb[38] = "Then the LORD\'s fire fell and consumed the burnt offering, the wood, the stones, and the dust, and it licked up the water that was in the trench.";
csb[39] = "When all the people saw it, they fell facedown and said, &quot;The LORD, he is God! The LORD, he is God! &quot;";
csb[40] = "Then Elijah ordered them, &quot;Seize the prophets of Baal! Do not let even one of them escape.&quot; So they seized them, and Elijah brought them down to the Wadi Kishon and slaughtered them there.";
csb[41] = "Elijah said to Ahab, &quot;Go up, eat and drink, for there is the sound of a rainstorm.&quot;";
csb[42] = "So Ahab went to eat and drink, but Elijah went up to the summit of Carmel. He bent down on the ground and put his face between his knees.";
csb[43] = "Then he said to his servant, &quot;Go up and look toward the sea.&quot; So he went up, looked, and said, &quot;There\'s nothing.&quot; Seven times Elijah said, &quot;Go back.&quot;";
csb[44] = "On the seventh time, he reported, &quot;There\'s a cloud as small as a man\'s hand coming up from the sea.&quot; Then Elijah said, &quot;Go and tell Ahab, \'Get your chariot ready and go down so the rain doesn\'t stop you.\' &quot;";
csb[45] = "In a little while, the sky grew dark with clouds and wind, and there was a downpour. So Ahab got in his chariot and went to Jezreel.";
csb[46] = "The power of the LORD was on Elijah, and he tucked his mantle under his belt and ran ahead of Ahab to the entrance of Jezreel.";
kjv[1] = "And it came to pass [after] many days, that the word of the LORD came to Elijah in the third year, saying, Go, shew thyself unto Ahab; and I will send rain upon the earth.";
kjv[2] = "And Elijah went to shew himself unto Ahab. And [there was] a sore famine in Samaria.";
kjv[3] = "And Ahab called Obadiah, which [was] the governor of [his] house. (Now Obadiah feared the LORD greatly:";
kjv[4] = "For it was [so], when Jezebel cut off the prophets of the LORD, that Obadiah took an hundred prophets, and hid them by fifty in a cave, and fed them with bread and water.)";
kjv[5] = "And Ahab said unto Obadiah, Go into the land, unto all fountains of water, and unto all brooks: peradventure we may find grass to save the horses and mules alive, that we lose not all the beasts.";
kjv[6] = "So they divided the land between them to pass throughout it: Ahab went one way by himself, and Obadiah went another way by himself.";
kjv[7] = "And as Obadiah was in the way, behold, Elijah met him: and he knew him, and fell on his face, and said, [Art] thou that my lord Elijah?";
kjv[8] = "And he answered him, I [am]: go, tell thy lord, Behold, Elijah [is here].";
kjv[9] = "And he said, What have I sinned, that thou wouldest deliver thy servant into the hand of Ahab, to slay me?";
kjv[10] = "[As] the LORD thy God liveth, there is no nation or kingdom, whither my lord hath not sent to seek thee: and when they said, [He is] not [there]; he took an oath of the kingdom and nation, that they found thee not.";
kjv[11] = "And now thou sayest, Go, tell thy lord, Behold, Elijah [is here].";
kjv[12] = "And it shall come to pass, [as soon as] I am gone from thee, that the Spirit of the LORD shall carry thee whither I know not; and [so] when I come and tell Ahab, and he cannot find thee, he shall slay me: but I thy servant fear the LORD from my youth.";
kjv[13] = "Was it not told my lord what I did when Jezebel slew the prophets of the LORD, how I hid an hundred men of the LORD\'S prophets by fifty in a cave, and fed them with bread and water?";
kjv[14] = "And now thou sayest, Go, tell thy lord, Behold, Elijah [is here]: and he shall slay me.";
kjv[15] = "And Elijah said, [As] the LORD of hosts liveth, before whom I stand, I will surely shew myself unto him to day.";
kjv[16] = "So Obadiah went to meet Ahab, and told him: and Ahab went to meet Elijah.";
kjv[17] = "And it came to pass, when Ahab saw Elijah, that Ahab said unto him, [Art] thou he that troubleth Israel?";
kjv[18] = "And he answered, I have not troubled Israel; but thou, and thy father\'s house, in that ye have forsaken the commandments of the LORD, and thou hast followed Baalim.";
kjv[19] = "Now therefore send, [and] gather to me all Israel unto mount Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the groves four hundred, which eat at Jezebel\'s table.";
kjv[20] = "So Ahab sent unto all the children of Israel, and gathered the prophets together unto mount Carmel.";
kjv[21] = "And Elijah came unto all the people, and said, How long halt ye between two opinions? if the LORD [be] God, follow him: but if Baal, [then] follow him. And the people answered him not a word.";
kjv[22] = "Then said Elijah unto the people, I, [even] I only, remain a prophet of the LORD; but Baal\'s prophets [are] four hundred and fifty men.";
kjv[23] = "Let them therefore give us two bullocks; and let them choose one bullock for themselves, and cut it in pieces, and lay [it] on wood, and put no fire [under]: and I will dress the other bullock, and lay [it] on wood, and put no fire [under]:";
kjv[24] = "And call ye on the name of your gods, and I will call on the name of the LORD: and the God that answereth by fire, let him be God. And all the people answered and said, It is well spoken.";
kjv[25] = "And Elijah said unto the prophets of Baal, Choose you one bullock for yourselves, and dress [it] first; for ye [are] many; and call on the name of your gods, but put no fire [under].";
kjv[26] = "And they took the bullock which was given them, and they dressed [it], and called on the name of Baal from morning even until noon, saying, O Baal, hear us. But [there was] no voice, nor any that answered. And they leaped upon the altar which was made.";
kjv[27] = "And it came to pass at noon, that Elijah mocked them, and said, Cry aloud: for he [is] a god; either he is talking, or he is pursuing, or he is in a journey, [or] peradventure he sleepeth, and must be awaked.";
kjv[28] = "And they cried aloud, and cut themselves after their manner with knives and lancets, till the blood gushed out upon them.";
kjv[29] = "And it came to pass, when midday was past, and they prophesied until the [time] of the offering of the [evening] sacrifice, that [there was] neither voice, nor any to answer, nor any that regarded.";
kjv[30] = "And Elijah said unto all the people, Come near unto me. And all the people came near unto him. And he repaired the altar of the LORD [that was] broken down.";
kjv[31] = "And Elijah took twelve stones, according to the number of the tribes of the sons of Jacob, unto whom the word of the LORD came, saying, Israel shall be thy name:";
kjv[32] = "And with the stones he built an altar in the name of the LORD: and he made a trench about the altar, as great as would contain two measures of seed.";
kjv[33] = "And he put the wood in order, and cut the bullock in pieces, and laid [him] on the wood, and said, Fill four barrels with water, and pour [it] on the burnt sacrifice, and on the wood.";
kjv[34] = "And he said, Do [it] the second time. And they did [it] the second time. And he said, Do [it] the third time. And they did [it] the third time.";
kjv[35] = "And the water ran round about the altar; and he filled the trench also with water.";
kjv[36] = "And it came to pass at [the time of] the offering of the [evening] sacrifice, that Elijah the prophet came near, and said, LORD God of Abraham, Isaac, and of Israel, let it be known this day that thou [art] God in Israel, and [that] I [am] thy servant, and [that] I have done all these things at thy word.";
kjv[37] = "Hear me, O LORD, hear me, that this people may know that thou [art] the LORD God, and [that] thou hast turned their heart back again.";
kjv[38] = "Then the fire of the LORD fell, and consumed the burnt sacrifice, and the wood, and the stones, and the dust, and licked up the water that [was] in the trench.";
kjv[39] = "And when all the people saw [it], they fell on their faces: and they said, The LORD, he [is] the God; the LORD, he [is] the God.";
kjv[40] = "And Elijah said unto them, Take the prophets of Baal; let not one of them escape. And they took them: and Elijah brought them down to the brook Kishon, and slew them there.";
kjv[41] = "And Elijah said unto Ahab, Get thee up, eat and drink; for [there is] a sound of abundance of rain.";
kjv[42] = "So Ahab went up to eat and to drink. And Elijah went up to the top of Carmel; and he cast himself down upon the earth, and put his face between his knees,";
kjv[43] = "And said to his servant, Go up now, look toward the sea. And he went up, and looked, and said, [There is] nothing. And he said, Go again seven times.";
kjv[44] = "And it came to pass at the seventh time, that he said, Behold, there ariseth a little cloud out of the sea, like a man\'s hand. And he said, Go up, say unto Ahab, Prepare [thy chariot], and get thee down, that the rain stop thee not.";
kjv[45] = "And it came to pass in the mean while, that the heaven was black with clouds and wind, and there was a great rain. And Ahab rode, and went to Jezreel.";
kjv[46] = "And the hand of the LORD was on Elijah; and he girded up his loins, and ran before Ahab to the entrance of Jezreel.";

vul[10] = "vivit Dominus Deus tuus non est gens aut regnum quo non miserit dominus meus te requirens et respondentibus cunctis non est hic adiuravit regna singula et gentes eo quod minime repperireris";
rsv[11] = "And now you say, \'Go, tell your lord, &quot;Behold, Eli\'jah is here.&quot;\'";
asv[11] = "And now thou sayest, Go, tell thy lord, Behold, Elijah [is here].";
yng[11] = "and now, thou art saying, Go, say to thy lord, Lo, Elijah;";
dby[11] = "And now thou sayest, Go, say to thy lord, Behold Elijah!";
web[11] = "And now thou sayest, Go, tell thy lord, Behold, Elijah [is here].";
hnv[11] = "Now you say, Go, tell your lord, Behold, Eliyah [is here].";
vul[11] = "et nunc dicis mihi vade et dic domino tuo adest Helias";
rsv[12] = "And as soon as I have gone from you, the Spirit of the LORD will carry you whither I know not; and so, when I come and tell Ahab and he cannot find you, he will kill me, although I your servant have revered the LORD from my youth.";
asv[12] = "And it will come to pass, as soon as I am gone from thee, that the Spirit of Jehovah will carry thee whither I know not; and so when I come and tell Ahab, and he cannot find thee, he will slay me: but I thy servant fear Jehovah from my youth.";
yng[12] = "and it hath been, I go from thee, and the Spirit of Jehovah doth lift thee up, whither I know not, and I have come to declare to Ahab, and he doth not find thee, and he hath slain me; and thy servant is fearing Jehovah from my youth.";
dby[12] = "And it shall come to pass when I am gone from thee, that the Spirit of Jehovah shall carry thee whither I know not; and when I come and tell Ahab, and he cannot find thee, he will kill me; and I thy servant fear Jehovah from my youth.";
web[12] = "And it will come to pass, [as soon as] I have gone from thee, that the Spirit of the LORD will carry thee whither I know not; and [so] when I come and tell Ahab, and he cannot find thee, he will slay me: but I thy servant fear the LORD from my youth.";
hnv[12] = "It will happen, as soon as I am gone from you, that the Spirit of the LORD will carry you I don\'t know where; and so when I come and tell Ach\'av, and he can\'t find you, he will kill me: but I your servant fear the LORD from my youth.";
vul[12] = "cumque recessero a te spiritus Domini asportabit te in locum quem ego ignoro ingressus nuntiabo Ahab et non inveniet te et interficiet me servus autem tuus timet Dominum ab infantia sua";
rsv[13] = "Has it not been told my lord what I did when Jez\'ebel killed the prophets of the LORD, how I hid a hundred men of the LORD\'S prophets by fifties in a cave, and fed them with bread and water?";
asv[13] = "Was it not told my lord what I did when Jezebel slew the prophets of Jehovah, how I hid a hundred men of Jehovah\'s prophets by fifty in a cave, and fed them with bread and water?";
yng[13] = "`Hath it not been declared to my lord that which I have done in Jezebel\'s slaying the prophets of Jehovah, that I hide of the prophets of Jehovah a hundred men, fifty by fifty in a cave, and sustained them with bread and water?";
dby[13] = "Was it not told my lord what I did when Jezebel slew the prophets of Jehovah, how I hid a hundred men of Jehovah\'s prophets by fifty in a cave, and maintained them with bread and water?";
web[13] = "Was it not told my lord what I did when Jezebel slew the prophets of the LORD, how I hid a hundred men of the LORD\'S prophets by fifty in a cave, and fed them with bread and water?";
hnv[13] = " Wasn\'t it told my lord what I did when Izevel killed the prophets of the LORD, how I hid one hundred men of the LORD\'s prophets by fifty in a cave, and fed them with bread and water?";
vul[13] = "numquid non indicatum est tibi domino meo quid fecerim cum interficeret Hiezabel prophetas Domini quod absconderim de prophetis Domini centum viros quinquagenos et quinquagenos in speluncis et paverim eos pane et aqua";
rsv[14] = "And now you say, \'Go, tell your lord, &quot;Behold, Eli\'jah is here&quot;\'; and he will kill me.&quot;";
asv[14] = "And now thou sayest, Go, tell thy lord, Behold, Elijah [is here]; and he will slay me.";
yng[14] = "and now thou art saying, Go, say to my lord, Lo, Elijah -- and he hath slain me!\'";
dby[14] = "And now thou sayest, Go, say to thy lord, Behold Elijah! and he will kill me.";
web[14] = "And now thou sayest, Go, tell thy lord, Behold, Elijah [is here]: and he will slay me.";
hnv[14] = "Now you say, Go, tell your lord, Behold, Eliyah [is here]; and he will kill me.";
vul[14] = "et nunc tu dicis vade et dic domino tuo adest Helias ut interficiat me";
rsv[15] = "And Eli\'jah said, &quot;As the LORD of hosts lives, before whom I stand, I will surely show myself to him today.&quot;";
asv[15] = "And Elijah said, As Jehovah of hosts liveth, before whom I stand, I will surely show myself unto him to-day.";
yng[15] = "And Elijah saith, `Jehovah of Hosts liveth, before whom I have stood, surely to-day I appear unto him.\'";
dby[15] = "And Elijah said, As Jehovah of hosts liveth, before whom I stand, I will certainly shew myself to him to-day.";
web[15] = "And Elijah said, [As] the LORD of hosts liveth, before whom I stand, I will surely show myself to him to-day.";
hnv[15] = " Eliyah said, As the LORD of Hosts lives, before whom I stand, I will surely show myself to him today.";
vul[15] = "dixit Helias vivit Dominus exercituum ante cuius vultum sto quia hodie apparebo ei";
rsv[16] = "So Obadi\'ah went to meet Ahab, and told him; and Ahab went to meet Eli\'jah.";
asv[16] = "So Obadiah went to meet Ahab, and told him; and Ahab went to meet Elijah.";
yng[16] = "And Obadiah goeth to meet Ahab, and declareth [it] to him, and Ahab goeth to meet Elijah,";
dby[16] = "Then Obadiah went to meet Ahab, and told him. And Ahab went to meet Elijah.";
web[16] = "So Obadiah went to meet Ahab, and told him; and Ahab went to meet Elijah.";
hnv[16] = "So `Ovadyah went to meet Ach\'av, and told him; and Ach\'av went to meet Eliyah.";
vul[16] = "abiit ergo Abdias in occursum Ahab et indicavit ei venitque Ahab in occursum Heliae";
rsv[17] = "When Ahab saw Eli\'jah, Ahab said to him, &quot;Is it you, you troubler of Israel?&quot;";
asv[17] = "And it came to pass, when Ahab saw Elijah, that Ahab said unto him, Is it thou, thou troubler of Israel?";
yng[17] = "and it cometh to pass at Ahab\'s seeing Elijah, that Ahab saith unto him, `Art thou he -- the troubler of Israel?\'";
dby[17] = "And it came to pass when Ahab saw Elijah, that Ahab said to him, Is it thou, the troubler of Israel?";
web[17] = "And it came to pass, when Ahab saw Elijah, that Ahab said to him, [Art] thou he that troubleth Israel?";
hnv[17] = "It happened, when Ach\'av saw Eliyah, that Ach\'av said to him, Is it you, you troubler of Yisra\'el?";
vul[17] = "et cum vidisset eum ait tune es ille qui conturbas Israhel";
rsv[18] = "And he answered, &quot;I have not troubled Israel; but you have, and your father\'s house, because you have forsaken the commandments of the LORD and followed the Ba\'als.";
asv[18] = "And he answered, I have not troubled Israel; but thou, and thy father\'s house, in that ye have forsaken the commandments of Jehovah, and thou hast followed the Baalim.";
yng[18] = "And he saith, `I have not troubled Israel, but thou and the house of thy father, in your forsaking the commands of Jehovah, and thou goest after the Baalim;";
dby[18] = "And he said, I have not troubled Israel, but thou and thy father\'s house, in that ye have forsaken the commandments of Jehovah, and thou hast followed the Baals.";
web[18] = "And he answered, I have not troubled Israel; but thou, and thy father\'s house, in that ye have forsaken the commandments of the LORD, and thou hast followed Baalim.";
hnv[18] = "He answered, I have not troubled Yisra\'el; but you, and your father\'s house, in that you have forsaken the mitzvot of the LORD, and you have followed the Ba`alim.";
vul[18] = "et ille ait non turbavi Israhel sed tu et domus patris tui qui dereliquistis mandata Domini et secuti estis Baalim";
rsv[19] = "Now therefore send and gather all Israel to me at Mount Carmel, and the four hundred and fifty prophets of Ba\'al and the four hundred prophets of Ashe\'rah, who eat at Jez\'ebel\'s table.&quot;";
asv[19] = "Now therefore send, and gather to me all Israel unto mount Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the Asherah four hundred, that eat at Jezebel\'s table.";
yng[19] = "and now, send, gather unto me all Israel, unto the mount of Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the shrine, four hundred -- eating at the table of Jezebel.\'";
dby[19] = "And now send, gather to me all Israel to mount Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the Asherah four hundred, who eat at Jezebel\'s table.";
web[19] = "Now therefore send, [and] gather to me all Israel to mount Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the groves four hundred, who eat at Jezebel\'s table.";
hnv[19] = "Now therefore send, and gather to me all Yisra\'el to Mount Karmel, and the prophets of Ba`al four hundred fifty, and the prophets of the Asherah four hundred, who eat at Izevel\'s table.";
vul[19] = "verumtamen nunc mitte et congrega ad me universum Israhel in monte Carmeli et prophetas Baal quadringentos quinquaginta prophetasque lucorum quadringentos qui comedunt de mensa Hiezabel";
rsv[20] = "So Ahab sent to all the people of Israel, and gathered the prophets together at Mount Carmel.";
asv[20] = "So Ahab sent unto all the children of Israel, and gathered the prophets together unto mount Carmel.";
yng[20] = "And Ahab sendeth among all the sons of Israel, and gathereth the prophets unto the mount of Carmel;";
dby[20] = "So Ahab sent to all the children of Israel, and gathered the prophets together unto mount Carmel.";
web[20] = "So Ahab sent to all the children of Israel, and gathered the prophets to mount Carmel.";
hnv[20] = "So Ach\'av sent to all the children of Yisra\'el, and gathered the prophets together to Mount Karmel.";
vul[20] = "misit Ahab ad omnes filios Israhel et congregavit prophetas in monte Carmeli";
rsv[21] = "And Eli\'jah came near to all the people, and said, &quot;How long will you go limping with two different opinions? If the LORD is God, follow him; but if Ba\'al, then follow him.&quot; And the people did not answer him a word.";
asv[21] = "And Elijah came near unto all the people, and said, How long go ye limping between the two sides? if Jehovah be God, follow him; but if Baal, then follow him. And the people answered him not a word.";
yng[21] = "and Elijah cometh nigh unto all the people, and saith, `Till when are ye leaping on the two branches? -- if Jehovah [is] God, go after Him; and if Baal, go after him;\' and the people have not answered him a word.";
dby[21] = "Then Elijah drew near to all the people, and said, How long do ye halt between two opinions? if Jehovah be God, follow him; and if Baal, follow him. And the people answered him not a word.";
web[21] = "And Elijah came to all the people, and said, How long halt ye between two opinions? if the LORD [is] God, follow him: but if Baal, [then] follow him. And the people answered him not a word.";
hnv[21] = "Eliyah came near to all the people, and said, How long go you limping between the two sides? if the LORD is God, follow him; but if Ba`al, then follow him. The people answered him not a word.";
vul[21] = "accedens autem Helias ad omnem populum ait usquequo claudicatis in duas partes si Dominus est Deus sequimini eum si autem Baal sequimini illum et non respondit ei populus verbum";
rsv[22] = "Then Eli\'jah said to the people, &quot;I, even I only, am left a prophet of the LORD; but Ba\'al\'s prophets are four hundred and fifty men.";
asv[22] = "Then said Elijah unto the people, I, even I only, am left a prophet of Jehovah; but Baal\'s prophets are four hundred and fifty men.";
yng[22] = "And Elijah saith unto the people, `I -- I have been left a prophet of Jehovah -- by myself; and the prophets of Baal [are] four hundred and fifty men;";
dby[22] = "And Elijah said to the people, I, only I, remain a prophet of Jehovah; and Baal\'s prophets are four hundred and fifty men.";
web[22] = "Then said Elijah to the people, I [even] I only, remain a prophet of the LORD; but Baal\'s prophet\'s [are] four hundred and fifty men.";
hnv[22] = "Then said Eliyah to the people, I, even I only, am left a prophet of the LORD; but Ba`al\'s prophets are four hundred fifty men.";
vul[22] = "et ait rursum Helias ad populum ego remansi propheta Domini solus prophetae autem Baal quadringenti et quinquaginta viri sunt";
rsv[23] = "Let two bulls be given to us; and let them choose one bull for themselves, and cut it in pieces and lay it on the wood, but put no fire to it; and I will prepare the other bull and lay it on the wood, and put no fire to it.";
asv[23] = "Let them therefore give us two bullocks; and let them choose one bullock for themselves, and cut it in pieces, and lay it on the wood, and put no fire under; and I will dress the other bullock, and lay it on the wood, and put no fire under.";
yng[23] = "and let them give to us two bullocks, and they choose for themselves the one bullock, and cut it in pieces, and place [it] on the wood, and place no fire; and I -- I prepare the other bullock, and have put [it] on the wood, and fire I do not place; --";
dby[23] = "Let them therefore give us two bullocks: and let them choose one bullock for themselves, and cut it in pieces, and put it on the wood, and put no fire; and I will sacrifice the other bullock, and put it on the wood, and put no fire.";
web[23] = "Let them therefore give us two bullocks; and let them choose one bullock for themselves, and cut it in pieces, and lay [it] on wood, and put no fire [under]: and I will dress the other bullock, and lay [it] on wood, and put no fire [under]:";
hnv[23] = "Let them therefore give us two bulls; and let them choose one bull for themselves, and cut it in pieces, and lay it on the wood, and put no fire under; and I will dress the other bull, and lay it on the wood, and put no fire under.";
vul[23] = "dentur nobis duo boves et illi eligant bovem unum et in frusta caedentes ponant super ligna ignem autem non subponant et ego faciam bovem alterum et inponam super ligna ignemque non subponam";
rsv[24] = "And you call on the name of your god and I will call on the name of the LORD; and the God who answers by fire, he is God.&quot; And all the people answered, &quot;It is well spoken.&quot;";
asv[24] = "And call ye on the name of your god, and I will call on the name of Jehovah; and the God that answereth by fire, let him be God. And all the people answered and said, It is well spoken.";
yng[24] = "and ye have called in the name of your god, and I -- I call in the name of Jehovah, and it hath been, the god who answereth by fire -- He [is] the God.\' And all the people answer and say, `Good [is] the word.\'";
dby[24] = "And call ye on the name of your gods, and I will call on the name of Jehovah; and the god that answers by fire, let him be God. And all the people answered and said, The word is good.";
web[24] = "And call ye on the name of your gods, and I will call on the name of the LORD: and the God that answereth by fire, let him be God. And all the people answered and said, It is well spoken.";
hnv[24] = "Call you on the name of your god, and I will call on the name of the LORD; and the God who answers by fire, let him be God. All the people answered, It is well spoken.";
vul[24] = "invocate nomina deorum vestrorum et ego invocabo nomen Domini et deus qui exaudierit per ignem ipse sit Deus respondens omnis populus ait optima propositio";
rsv[25] = "Then Eli\'jah said to the prophets of Ba\'al, &quot;Choose for yourselves one bull and prepare it first, for you are many; and call on the name of your god, but put no fire to it.&quot;";
asv[25] = "And Elijah said unto the prophets of Baal, Choose you one bullock for yourselves, and dress it first; for ye are many; and call on the name of your god, but put no fire under.";
yng[25] = "And Elijah saith to the prophets of Baal, `Choose for you the one bullock, and prepare first, for ye [are] the multitude, and call ye in the name of your god, and place no fire.\'";
dby[25] = "And Elijah said to the prophets of Baal, Choose one bullock for yourselves, and sacrifice it first; for ye are the many; and call on the name of your god, but put no fire.";
web[25] = "And Elijah said to the prophets of Baal, Choose you one bullock for yourselves, and dress [it] first; for ye [are] many; and call on the name of your gods, but put no fire [under].";
hnv[25] = "Eliyah said to the prophets of Ba`al, Choose you one bull for yourselves, and dress it first; for you are many; and call on the name of your god, but put no fire under.";
vul[25] = "dixit ergo Helias prophetis Baal eligite vobis bovem unum et facite primi quia vos plures estis et invocate nomina deorum vestrorum ignemque non subponatis";
rsv[26] = "And they took the bull which was given them, and they prepared it, and called on the name of Ba\'al from morning until noon, saying, &quot;O Ba\'al, answer us!&quot; But there was no voice, and no one answered. And they limped about the altar which they had made.";
asv[26] = "And they took the bullock which was given them, and they dressed it, and called on the name of Baal from morning even until noon, saying, O Baal, hear us. But there was no voice, nor any that answered. And they leaped about the altar which was made.";
yng[26] = "And they take the bullock that [one] gave to them, and prepare, and call in the name of Baal from the morning even till the noon, saying, `O Baal, answer us!\' and there is no voice, and there is none answering; and they leap on the altar that one had made.";
dby[26] = "And they took the bullock which had been given them, and sacrificed it, and called on the name of Baal from morning until noon, saying, O Baal, answer us! But there was no voice, and none answered. And they leaped about the altar that had been made.";
web[26] = "And they took the bullock which was given them, and they dressed [it], and called on the name of Baal from morning even until noon, saying, O Baal, hear us. But [there was] no voice, nor any that answered. And they leaped upon the altar which was made.";
hnv[26] = "They took the bull which was given them, and they dressed it, and called on the name of Ba`al from morning even until noon, saying, Ba`al, hear us. But there was no voice, nor any who answered. They leaped about the altar which was made.";
vul[26] = "qui cum tulissent bovem quem dederat eis fecerunt et invocabant nomen Baal de mane usque ad meridiem dicentes Baal exaudi nos et non erat vox nec qui responderet transiliebantque altare quod fecerant";
rsv[27] = "And at noon Eli\'jah mocked them, saying, &quot;Cry aloud, for he is a god; either he is musing, or he has gone aside, or he is on a journey, or perhaps he is asleep and must be awakened.&quot;";
asv[27] = "And it came to pass at noon, that Elijah mocked them, and said, Cry aloud; for he is a god: either he is musing, or he is gone aside, or he is on a journey, or peradventure he sleepeth and must be awaked.";
yng[27] = "And it cometh to pass, at noon, that Elijah playeth on them, and saith, `Call with a loud voice, for he [is] a god, for he is meditating, or pursuing, or on a journey; it may be he is asleep, an doth awake.\'";
dby[27] = "And it came to pass at noon that Elijah mocked them and said, Cry aloud; for he is a god; for he is meditating, or gone aside, or he is on a journey; perhaps he sleeps, and will awake.";
web[27] = "And it came to pass at noon, that Elijah mocked them, and said, Cry aloud: for he [is] a god; either he is talking, or he is pursuing, or he is on a journey, [or] perhaps he sleepeth, and must be awaked.";
hnv[27] = "It happened at noon, that Eliyah mocked them, and said, Cry aloud; for he is a god: either he is musing, or he is gone aside, or he is on a journey, or peradventure he sleeps and must be awakened.";
vul[27] = "cumque esset iam meridies inludebat eis Helias dicens clamate voce maiore deus enim est et forsitan loquitur aut in diversorio est aut in itinere aut certe dormit ut excitetur";
rsv[28] = "And they cried aloud, and cut themselves after their custom with swords and lances, until the blood gushed out upon them.";
asv[28] = "And they cried aloud, and cut themselves after their manner with knives and lances, till the blood gushed out upon them.";
yng[28] = "And they call with a loud voice, and cut themselves, according to their ordinance, with swords and with spears, till a flowing of blood [is] on them;";
dby[28] = "And they cried aloud, and cut themselves after their manner with swords and spears, till the blood gushed out upon them.";
web[28] = "And they cried aloud, and cut themselves after their manner with knives and lancets, till the blood gushed out upon them.";
hnv[28] = "They cried aloud, and cut themselves after their manner with knives and lances, until the blood gushed out on them.";
vul[28] = "clamabant ergo voce magna et incidebant se iuxta ritum suum cultris et lanceolis donec perfunderentur sanguine";
rsv[29] = "And as midday passed, they raved on until the time of the offering of the oblation, but there was no voice; no one answered, no one heeded.";
asv[29] = "And it was so, when midday was past, that they prophesied until the time of the offering of the [evening] oblation; but there was neither voice, nor any to answer, nor any that regarded.";
yng[29] = "and it cometh to pass, at the passing by of the noon, that they feign themselves prophets till the going up of the present, and there is no voice, and there is none answering, and there is none attending.";
dby[29] = "And it came to pass when midday was past, that they prophesied until the [time] of the offering up of the oblation; but there was neither voice, nor any that answered, nor any attention.";
web[29] = "And it came to pass, when mid-day was past, and they prophesied until the [time] of the offering of the [evening] sacrifice, that [there was] neither voice, nor any to answer, nor any that regarded.";
hnv[29] = "It was so, when midday was past, that they prophesied until the time of the offering of the [evening] offering; but there was neither voice, nor any to answer, nor any who regarded.";
vul[29] = "postquam autem transiit meridies et illis prophetantibus venerat tempus quo sacrificium offerri solet nec audiebatur vox neque aliquis respondebat nec adtendebat orantes";
rsv[30] = "Then Eli\'jah said to all the people, &quot;Come near to me&quot;; and all the people came near to him. And he repaired the altar of the LORD that had been thrown down;";
asv[30] = "And Elijah said unto all the people, Come near unto me; and all the people came near unto him. And he repaired the altar of Jehovah that was thrown down.";
yng[30] = "And Elijah saith to all the people, `Come nigh unto me;\' and all the people come nigh unto him, and he repaireth the altar of Jehovah that is broken down;";
dby[30] = "Then Elijah said to all the people, Draw near to me. And all the people drew near to him. And he repaired the altar of Jehovah which was broken down.";
web[30] = "And Elijah said to all the people, Come near to me. And all the people came near to him. And he repaired the altar of the LORD [that was] broken down.";
hnv[30] = "Eliyah said to all the people, Come near to me; and all the people came near to him. He repaired the altar of the LORD that was thrown down.";
vul[30] = "dixit Helias omni populo venite ad me et accedente ad se populo curavit altare Domini quod destructum fuerat";
rsv[31] = "Eli\'jah took twelve stones, according to the number of the tribes of the sons of Jacob, to whom the word of the LORD came, saying, &quot;Israel shall be your name&quot;;";
asv[31] = "And Elijah took twelve stones, according to the number of the tribes of the sons of Jacob, unto whom the word of Jehovah came, saying, Israel shall be thy name.";
yng[31] = "and Elijah taketh twelve stones, according to the number of the tribes of the sons of Jacob, unto whom the word of Jehovah was, saying, `Israel is thy name;\'";
dby[31] = "And Elijah took twelve stones, according to the number of the tribes of the sons of Jacob, to whom the word of Jehovah came saying, Israel shall be thy name;";
web[31] = "And Elijah took twelve stones, according to the number of the tribes of the sons of Jacob, to whom the word of the LORD came, saying, Israel shall be thy name:";
hnv[31] = "Eliyah took twelve stones, according to the number of the tribes of the sons of Ya`akov, to whom the word of the LORD came, saying, Yisra\'el shall be your name.";
vul[31] = "et tulit duodecim lapides iuxta numerum tribuum filiorum Iacob ad quem factus est sermo Domini dicens Israhel erit nomen tuum";
rsv[32] = "and with the stones he built an altar in the name of the LORD. And he made a trench about the altar, as great as would contain two measures of seed.";
asv[32] = "And with the stones he built an altar in the name of Jehovah; and he made a trench about the altar, as great as would contain two measures of seed.";
yng[32] = "and he buildeth with the stones an altar, in the name of Jehovah, and maketh a trench, as about the space of two measures of seed, round about the altar.";
dby[32] = "and with the stones he built an altar in the name of Jehovah, and made a trench round about the altar, of the capacity of two measures of seed;";
web[32] = "And with the stones he built an altar in the name of the LORD: and he made a trench about the altar, as great as would contain two measures of seed.";
hnv[32] = "With the stones he built an altar in the name of the LORD; and he made a trench about the altar, as great as would contain two measures of seed.";
vul[32] = "et aedificavit lapidibus altare in nomine Domini fecitque aquaeductum quasi per duas aratiunculas in circuitu altaris";
rsv[33] = "And he put the wood in order, and cut the bull in pieces and laid it on the wood. And he said, &quot;Fill four jars with water, and pour it on the burnt offering, and on the wood.&quot;";
asv[33] = "And he put the wood in order, and cut the bullock in pieces, and laid it on the wood. And he said, Fill four jars with water, and pour it on the burnt-offering, and on the wood.";
yng[33] = "And he arrangeth the wood, and cutteth in pieces the bullock, and placeth [it] on the wood, and saith, `Fill ye four pitchers of water, and pour on the burnt-offering, and on the wood;";
dby[33] = "and he put the wood in order, and cut the bullock in pieces, and laid it on the wood. And he said, Fill four pitchers with water, and pour it on the burnt-offering, and on the wood.";

rsv[36] = "And at the time of the offering of the oblation, Eli\'jah the prophet came near and said, &quot;O LORD, God of Abraham, Isaac, and Israel, let it be known this day that thou art God in Israel, and that I am thy servant, and that I have done all these things at thy word.";
asv[36] = "And it came to pass at the time of the offering of the [evening] oblation, that Elijah the prophet came near, and said, O Jehovah, the God of Abraham, of Isaac, and of Israel, let it be known this day that thou art God in Israel, and that I am thy servant, and that I have done all these things at thy word.";
yng[36] = "And it cometh to pass, at the going up of the [evening-]present, that Elijah the prophet cometh nigh and saith, `Jehovah, God of Abraham, Isaac, and Israel, to-day let it be known that Thou [art] God in Israel, and I Thy servant, that by Thy word I have done the whole of these things;";
dby[36] = "And it came to pass at [the time of] the offering up of the oblation, that Elijah the prophet drew near, and said, Jehovah, God of Abraham, Isaac and Israel, let it be known this day that thou art God in Israel, and that I am thy servant, and that I have done all these things by thy word.";
web[36] = "And it came to pass at [the time of] the offering of the [evening] sacrifice, that Elijah the prophet came near, and said, LORD God of Abraham, Isaac, and of Israel, let it be known this day that thou [art] God in Israel, and [that] I [am] thy servant, and [that] I have done all these things at thy word.";
hnv[36] = "It happened at the time of the offering of the [evening] offering, that Eliyah the prophet came near, and said, LORD, the God of Avraham, of Yitzchak, and of Yisra\'el, let it be known this day that you are God in Yisra\'el, and that I am your servant, and that I have done all these things at your word.";
vul[36] = "cumque iam tempus esset ut offerretur holocaustum accedens Helias propheta ait Domine Deus Abraham Isaac et Israhel hodie ostende quia tu es Deus Israhel et ego servus tuus et iuxta praeceptum tuum feci omnia verba haec";
rsv[37] = "Answer me, O LORD, answer me, that this people may know that thou, O LORD, art God, and that thou hast turned their hearts back.&quot;";
asv[37] = "Hear me, O Jehovah, hear me, that this people may know that thou, Jehovah, art God, and [that] thou hast turned their heart back again.";
yng[37] = "answer me, O Jehovah, answer me, and this people doth know that Thou [art] Jehovah God; and Thou hast turned their heart backward.\'";
dby[37] = "Answer me, Jehovah, answer me, that this people may know that thou Jehovah art God, and [that] *thou* hast turned their heart back again.";
web[37] = "Hear me, O LORD, hear me, that this people may know that thou [art] the LORD God, and [that] thou hast turned their heart back again.";
hnv[37] = "Hear me, LORD, hear me, that this people may know that you, LORD, are God, and [that] you have turned their heart back again.";
vul[37] = "exaudi me Domine exaudi me ut discat populus iste quia tu es Dominus Deus et tu convertisti cor eorum iterum";

dby[38] = "And the fire of Jehovah fell, and consumed the burnt-offering, and the wood, and the stones, and the dust, and licked up the water that was in the trench.";

rsv[39] = "And when all the people saw it, they fell on their faces; and they said, &quot;The LORD, he is God; the LORD, he is God.&quot;";
asv[39] = "And when all the people saw it, they fell on their faces: and they said, Jehovah, he is God; Jehovah, he is God.";
yng[39] = "And all the people see, and fall on their faces, and say, `Jehovah, He [is] the God, Jehovah, He [is] the God.\'";

hnv[39] = "When all the people saw it, they fell on their faces: and they said, the LORD, he is God; the LORD, he is God.";
vul[39] = "quod cum vidisset omnis populus cecidit in faciem suam et ait Dominus ipse est Deus Dominus ipse est Deus";
rsv[40] = "And Eli\'jah said to them, &quot;Seize the prophets of Ba\'al; let not one of them escape.&quot; And they seized them; and Eli\'jah brought them down to the brook Kishon, and killed them there.";
asv[40] = "and Elijah said unto them, Take the prophets of Baal; let not one of them escape. And they took them; and Elijah brought them down to the brook Kishon, and slew them there.";
yng[40] = "And Elijah saith to them, `Catch ye the prophets of Baal; let not a man escape of them;\' and they catch them, and Elijah bringeth them down unto the stream Kishon, and doth slaughter them there.";
dby[40] = "And Elijah said to them, Seize the prophets of Baal; let not one of them escape! And they seized them; and Elijah brought them down to the torrent of Kishon, and slaughtered them there.";
web[40] = "And Elijah said to them, Take the prophets of Baal; let not one of them escape. And they took them: and Elijah brought them down to the brook Kishon, and slew them there.";
hnv[40] = "and Eliyah said to them, Take the prophets of Ba`al; don\'t let one of them escape. They took them; and Eliyah brought them down to the brook Kishon, and killed them there.";

rsv[41] = "And Eli\'jah said to Ahab, &quot;Go up, eat and drink; for there is a sound of the rushing of rain.&quot;";

yng[41] = "And Elijah saith to Ahab, `Go up, eat and drink, because of the sound of the noise of the shower.\'";
dby[41] = "And Elijah said to Ahab, Go up, eat and drink; for there is a sound of abundance of rain.";
web[41] = "And Elijah said to Ahab, Go up, eat and drink; for [there is] a sound of abundance of rain.";

rsv[43] = "And he said to his servant, &quot;Go up now, look toward the sea.&quot; And he went up and looked, and said, &quot;There is nothing.&quot; And he said, &quot;Go again seven times.&quot;";

rsv[44] = "And at the seventh time he said, &quot;Behold, a little cloud like a man\'s hand is rising out of the sea.&quot; And he said, &quot;Go up, say to Ahab, \'Prepare your chariot and go down, lest the rain stop you.\'&quot;";
asv[44] = "And it came to pass at the seventh time, that he said, Behold, there ariseth a cloud out of the sea, as small as a man\'s hand. And he said, Go up, say unto Ahab, Make ready [thy chariot], and get thee down, that the rain stop thee not.";
yng[44] = "And it cometh to pass, at the seventh, that he saith, `Lo, a little thickness as the palm of a man is coming up out of the sea.\' And he saith, `Go up, say unto Ahab, `Bind -- and go down, and the shower doth not restrain thee.\'";
dby[44] = "And it came to pass at the seventh time that he said, Behold there is a cloud, small as a man\'s hand, arising out of the sea. And he said, Go up, say to Ahab, Harness and go down, that the pour of rain stop thee not.";
web[44] = "And it came to pass at the seventh time, that he said, Behold, there ariseth a little cloud out of the sea, like a man\'s hand. And he said, Go up, say to Ahab, Prepare [thy chariot], and go down, that the rain may not hinder thee.";
hnv[44] = "It happened at the seventh time, that he said, Behold, there arises a cloud out of the sea, as small as a man\'s hand. He said, Go up, tell Ach\'av, Make ready [your chariot], and get you down, that the rain not stop you.";
vul[44] = "in septima autem vice ecce nubicula parva quasi vestigium hominis ascendebat de mari qui ait ascende et dic Ahab iunge et descende ne occupet te pluvia";

dby[45] = "And it came to pass in the mean while, that the heavens became black [with] clouds and wind, and there was a great pour of rain. And Ahab got on the chariot, and went to Jizreel.";
web[45] = "And it came to pass in the mean while, that the heaven was black with clouds and wind, and there was a great rain. And Ahab rode, and went to Jezreel.";
hnv[45] = "It happened in a little while, that the sky grew black with clouds and wind, and there was a great rain. Ach\'av rode, and went to Yizre`el:";
