csb[1] = "Then Rehoboam went to Shechem, for all Israel had gone to Shechem to make him king.";
csb[2] = "When Jeroboam son of Nebat heard about it, he stayed in Egypt, where he had fled from King Solomon\'s presence. Jeroboam stayed in Egypt.";
csb[3] = "But they summoned him, and Jeroboam and the whole assembly of Israel came and spoke to Rehoboam:";
csb[4] = "&quot;Your father made our yoke harsh. You, therefore, lighten your father\'s harsh service and the heavy yoke he put on us, and we will serve you.&quot;";
csb[5] = "Rehoboam replied, &quot;Go away for three days and then return to me.&quot; So the people left.";
csb[6] = "Then King Rehoboam consulted with the elders who had served his father Solomon when he was alive, asking, &quot;How do you advise me to respond to this people? &quot;";
csb[7] = "They replied, &quot;Today if you will be a servant to this people and serve them, and if you respond to them by speaking kind words to them, they will be your servants forever.&quot;";
csb[8] = "But he rejected the advice of the elders who had advised him and consulted with the young men who had grown up with him and attended him.";
csb[9] = "He asked them, &quot;What message do you advise that we send back to this people who said to me, \'Lighten the yoke your father put on us\'? &quot;";
csb[10] = "Then the young men who had grown up with him told him, &quot;This is what you should say to this people who said to you, \'Your father made our yoke heavy, but you, make it lighter on us! \' This is what you should tell them: \'My little finger is thicker than my father\'s waist!";
csb[11] = "&quot;Although my father burdened you with a heavy yoke, I will add to your yoke; my father disciplined you with whips, but I will discipline you with barbed whips.\' &quot;";
csb[12] = "So Jeroboam and all the people came to Rehoboam on the third day, as the king had ordered: &quot;Return to me on the third day.&quot;";
csb[13] = "Then the king answered the people harshly. He rejected the advice the elders had given him";
csb[14] = "and spoke to them according to the young men\'s advice: &quot;My father made your yoke heavy, but I will add to your yoke; my father disciplined you with whips, but I will discipline you with barbed whips.&quot;";
csb[15] = "The king did not listen to the people, because this turn of events came from the LORD to carry out his word, which the LORD had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.";
csb[16] = "When all Israel saw that the king had not listened to them, the people answered him: What portion do we have in David? We have no inheritance in the son of Jesse. Israel, return to your tents; David, now look after your own house! So Israel went to their tents,";
csb[17] = "but Rehoboam reigned over the Israelites living in the cities of Judah.";
csb[18] = "Then King Rehoboam sent Adoram, who was in charge of forced labor, but all Israel stoned him to death. King Rehoboam managed to get into the chariot and flee to Jerusalem.";
csb[19] = "Israel is still in rebellion against the house of David today.";
csb[20] = "When all Israel heard that Jeroboam had come back, they summoned him to the assembly and made him king over all Israel. No one followed the house of David except the tribe of Judah alone.";
csb[21] = "When Rehoboam arrived in Jerusalem, he mobilized one hundred eighty thousand fit young soldiers from the entire house of Judah and the tribe of Benjamin to fight against the house of Israel to restore the kingdom to Rehoboam son of Solomon.";
csb[22] = "But the word of God came to Shemaiah, the man of God:";
csb[23] = "&quot;Say to Rehoboam son of Solomon, king of Judah, to the whole house of Judah and Benjamin, and to the rest of the people,";
csb[24] = "&quot;\'This is what the LORD says: You are not to march up and fight against your brothers, the Israelites. Each of you return home, for this situation is from me.\' &quot; So they listened to the word of the LORD and went back according to the word of the LORD.";
csb[25] = "Jeroboam built Shechem in the hill country of Ephraim and lived there. From there he went out and built Penuel.";
csb[26] = "Jeroboam said to himself, &quot;The kingdom might now return to the house of David.";
csb[27] = "&quot;If these people regularly go to offer sacrifices in the LORD\'s temple in Jerusalem, the heart of these people will return to their lord, King Rehoboam of Judah. They will kill me and go back to the king of Judah.&quot;";
csb[28] = "So the king sought advice. Then he made two golden calves, and he said to the people, &quot;Going to Jerusalem is too difficult for you. Israel, here are your gods who brought you up from the land of Egypt.&quot;";
csb[29] = "He set up one in Bethel, and put the other in Dan.";
csb[30] = "This led to sin; the people walked in procession before one of the calves all the way to Dan.";
csb[31] = "Jeroboam also made shrines on the high places and made priests from the ranks of the people who were not Levites.";
csb[32] = "Jeroboam made a festival in the eighth month on the fifteenth day of the month, like the festival in Judah. He offered sacrifices on the altar; he made this offering in Bethel to sacrifice to the calves he had made. He also stationed the priests in Bethel for the high places he had made.";
csb[33] = "He offered sacrifices on the altar he had set up in Bethel on the fifteenth day of the eighth month. He chose this month on his own. He made a festival for the Israelites, offered sacrifices on the altar, and burned incense.";

asv[16] = "And when all Israel saw that the king hearkened not unto them, the people answered the king, saying, What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel: now see to thine own house, David. So Israel departed unto their tents.";
yng[16] = "And all Israel see that the king hath not hearkened unto them, and the people send the king back word, saying, `What portion have we in David? yea, there is no inheritance in the son of Jesse; to thy tents, O Israel; now see thy house, O David!\' and Israel goeth to its tents.";
dby[16] = "And all Israel saw that the king hearkened not to them; and the people answered the king saying, What portion have we in David? And [we have] no inheritance in the son of Jesse: To your tents, O Israel! Now see to thine own house, David! And Israel went to their tents.";
web[16] = "So when all Israel saw that the king hearkened not to them, the people answered the king, saying, What portion have we in David? neither [have we] inheritance in the son of Jesse: to your tents, O Israel: now see to thy own house, David. So Israel departed to their tents.";
hnv[16] = "When all Yisra\'el saw that the king didn\'t listen to them, the people answered the king, saying, What portion have we in David? neither have we inheritance in the son of Yishai: to your tents, Yisra\'el: now see to your own house, David. So Yisra\'el departed to their tents.";
vul[16] = "videns itaque populus quod noluisset eos audire rex respondit ei dicens quae nobis pars in David vel quae hereditas in filio Isai in tabernacula tua Israhel nunc vide domum tuam David et abiit Israhel in tabernacula sua";
kjv[17] = "But [as for] the children of Israel which dwelt in the cities of Judah, Rehoboam reigned over them.";
rsv[17] = "But Rehobo\'am reigned over the people of Israel who dwelt in the cities of Judah.";
asv[17] = "But as for the children of Israel that dwelt in the cities of Judah, Rehoboam reigned over them.";
yng[17] = "As to the sons of Israel, those dwelling in the cities of Judah -- over them reign doth Rehoboam.";
dby[17] = "But as for the children of Israel that dwelt in the cities of Judah, Rehoboam reigned over them.";
web[17] = "But [as for] the children of Israel who dwelt in the cities of Judah, Rehoboam reigned over them.";
hnv[17] = "But as for the children of Yisra\'el who lived in the cities of Yehudah, Rechav`am reigned over them.";
vul[17] = "super filios autem Israhel quicumque habitabant in civitatibus Iuda regnavit Roboam";
kjv[18] = "Then king Rehoboam sent Adoram, who [was] over the tribute; and all Israel stoned him with stones, that he died. Therefore king Rehoboam made speed to get him up to his chariot, to flee to Jerusalem.";
rsv[18] = "Then King Rehobo\'am sent Ador\'am, who was taskmaster over the forced labor, and all Israel stoned him to death with stones. And King Rehobo\'am made haste to mount his chariot, to flee to Jerusalem.";
asv[18] = "Then king Rehoboam sent Adoram, who was over the men subject to taskwork; and all Israel stoned him to death with stones. And king Rehoboam made speed to get him up to his chariot, to flee to Jerusalem.";
yng[18] = "And king Rehoboam sendeth Adoram who [is] over the tribute, and all Israel cast at him stones, and he dieth; and king Rehoboam hath strengthened himself to go up into a chariot to flee to Jerusalem;";
dby[18] = "And king Rehoboam sent Adoram, who was over the levy; but all Israel stoned him with stones, that he died. And king Rehoboam hastened to mount his chariot, to flee to Jerusalem.";
web[18] = "Then king Rehoboam sent Adoram, who [was] over the tribute; and all Israel stoned him with stones, that he died. Therefore king Rehoboam made speed to enter his chariot, to flee to Jerusalem.";
hnv[18] = "Then king Rechav`am sent Adoram, who was over the men subject to forced labor; and all Yisra\'el stoned him to death with stones. King Rechav`am made speed to get him up to his chariot, to flee to Yerushalayim.";
vul[18] = "misit igitur rex Roboam Aduram qui erat super tributum et lapidavit eum omnis Israhel et mortuus est porro rex Roboam festinus ascendit currum et fugit in Hierusalem";
kjv[19] = "So Israel rebelled against the house of David unto this day.";
rsv[19] = "So Israel has been in rebellion against the house of David to this day.";
asv[19] = "So Israel rebelled against the house of David unto this day.";
yng[19] = "and Israel transgresseth against the house of David unto this day.";
dby[19] = "And Israel rebelled against the house of David, unto this day.";
web[19] = "So Israel rebelled against the house of David to this day.";
hnv[19] = "So Yisra\'el rebelled against the house of David to this day.";
vul[19] = "recessitque Israhel a domo David usque in praesentem diem";
kjv[20] = "And it came to pass, when all Israel heard that Jeroboam was come again, that they sent and called him unto the congregation, and made him king over all Israel: there was none that followed the house of David, but the tribe of Judah only.";
rsv[20] = "And when all Israel heard that Jerobo\'am had returned, they sent and called him to the assembly and made him king over all Israel. There was none that followed the house of David, but the tribe of Judah only.";
asv[20] = "And it came to pass, when all Israel heard that Jeroboam was returned, that they sent and called him unto the congregation, and made him king over all Israel: there was none that followed the house of David, but the tribe of Judah only.";
yng[20] = "And it cometh to pass, at all Israel\'s hearing that Jeroboam hath returned, that they send and call him unto the company, and cause him to reign over all Israel; none hath been after the house of David save the tribe of Judah alone.";
dby[20] = "And it came to pass when all Israel heard that Jeroboam had come back, that they sent and called him to the assembly, and made him king over all Israel: none followed the house of David, but the tribe of Judah only.";
web[20] = "And it came to pass when all Israel heard that Jeroboam had come again, that they sent and called him to the congregation, and made him king over all Israel: there was none that followed the house of David, but the tribe of Judah only.";
hnv[20] = "It happened, when all Yisra\'el heard that Yarov`am was returned, that they sent and called him to the congregation, and made him king over all Yisra\'el: there was none who followed the house of David, but the tribe of Yehudah only.";
vul[20] = "factum est autem cum audisset omnis Israhel quod reversus esset Hieroboam miserunt et vocaverunt eum congregato coetu et constituerunt regem super omnem Israhel nec secutus est quisquam domum David praeter tribum Iuda solam";
kjv[21] = "And when Rehoboam was come to Jerusalem, he assembled all the house of Judah, with the tribe of Benjamin, an hundred and fourscore thousand chosen men, which were warriors, to fight against the house of Israel, to bring the kingdom again to Rehoboam the son of Solomon.";
rsv[21] = "When Rehobo\'am came to Jerusalem, he assembled all the house of Judah, and the tribe of Benjamin, a hundred and eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehobo\'am the son of Solomon.";
asv[21] = "And when Rehoboam was come to Jerusalem, he assembled all the house of Judah, and the tribe of Benjamin, a hundred and fourscore thousand chosen men, that were warriors, to fight against the house of Israel, to bring the kingdom again to Rehoboam the son of Solomon.";
yng[21] = "And Rehoboam cometh to Jerusalem, and assembleth all the house of Judah and the tribe of Benjamin, a hundred and eighty thousand chosen warriors, to fight with the house of Israel, to bring back the kingdom to Rehoboam son of Solomon.";
dby[21] = "And Rehoboam came to Jerusalem; and he assembled all the house of Judah, with the tribe of Benjamin, a hundred and eighty thousand chosen men apt for war, to fight against the house of Israel, that he might bring the kingdom again to Rehoboam the son of Solomon.";
web[21] = "And when Rehoboam had come to Jerusalem, he assembled all the house of Judah, with the tribe of Benjamin, a hundred and eighty thousand chosen men, who were warriors, to fight against the house of Israel, to bring the kingdom again to Rehoboam the son of Solomon.";
hnv[21] = " When Rechav`am was come to Yerushalayim, he assembled all the house of Yehudah, and the tribe of Binyamin, a hundred and eighty thousand chosen men, who were warriors, to fight against the house of Yisra\'el, to bring the kingdom again to Rechav`am the son of Shlomo.";
vul[21] = "venit autem Roboam Hierusalem et congregavit universam domum Iuda et tribum Beniamin centum octoginta milia electorum virorum et bellatorum ut pugnaret contra domum Israhel et reduceret regnum Roboam filio Salomonis";
kjv[22] = "But the word of God came unto Shemaiah the man of God, saying,";
rsv[22] = "But the word of God came to Shemai\'ah the man of God:";
asv[22] = "But the word of God came unto Shemaiah the man of God, saying,";
yng[22] = "And the word of God is unto Shemaiah a man of God, saying,";
dby[22] = "But the word of God came to Shemaiah the man of God, saying,";
web[22] = "But the word of God came to Shemaiah the man of God, saying,";
hnv[22] = "But the word of God came to Shemayah the man of God, saying,";
vul[22] = "factus est vero sermo Domini ad Semeiam virum Dei dicens";
kjv[23] = "Speak unto Rehoboam, the son of Solomon, king of Judah, and unto all the house of Judah and Benjamin, and to the remnant of the people, saying,";
rsv[23] = "&quot;Say to Rehobo\'am the son of Solomon, king of Judah, and to all the house of Judah and Benjamin, and to the rest of the people,";
asv[23] = "Speak unto Rehoboam the son of Solomon, king of Judah, and unto all the house of Judah and Benjamin, and to the rest of the people, saying,";
yng[23] = "`Speak unto Rehoboam son of Solomon, king of Judah, and unto all the house of Judah and Benjamin, and the rest of the people, saying,";
dby[23] = "Speak unto Rehoboam, the son of Solomon, king of Judah, and unto all the house of Judah and Benjamin, and to the remainder of the people, saying,";
web[23] = "Speak to Rehoboam the son of Solomon king of Judah, and to all the house of Judah and Benjamin, and to the remnant of the people, saying,";
hnv[23] = "Speak to Rechav`am the son of Shlomo, king of Yehudah, and to all the house of Yehudah and Binyamin, and to the rest of the people, saying,";
vul[23] = "loquere ad Roboam filium Salomonis regem Iuda et ad omnem domum Iuda et Beniamin et reliquos de populo dicens";
kjv[24] = "Thus saith the LORD, Ye shall not go up, nor fight against your brethren the children of Israel: return every man to his house; for this thing is from me. They hearkened therefore to the word of the LORD, and returned to depart, according to the word of the LORD.";
rsv[24] = "\'Thus says the LORD, You shall not go up or fight against your kinsmen the people of Israel. Return every man to his home, for this thing is from me.\'&quot; So they hearkened to the word of the LORD, and went home again, according to the word of the LORD.";
asv[24] = "Thus saith Jehovah, Ye shall not go up, nor fight against your brethren the children of Israel: return every man to his house; for this thing is of me. So they hearkened unto the word of Jehovah, and returned and went their way, according to the word of Jehovah.";
yng[24] = "Thus said Jehovah, Ye do not go up nor fight with your brethren the sons of Israel; turn back each to his house, for from Me hath this thing been;\' and they hear the word of Jehovah, and turn back to go according to the word of Jehovah.";
dby[24] = "Thus saith Jehovah: Go not up, nor fight with your brethren, the children of Israel; return every man to his house, for this thing is from me. And they hearkened to the word of Jehovah, and returned to depart, according to the word of Jehovah.";
web[24] = "Thus saith the LORD, Ye shall not go up, nor fight against your brethren the children of Israel: return every man to his house; for this thing is from me. They hearkened therefore to the word of the LORD, and returned to depart, according to the word of the LORD.";
hnv[24] = " Thus says the LORD, You shall not go up, nor fight against your brothers the children of Yisra\'el: return every man to his house; for this thing is of me. So they listened to the word of the LORD, and returned and went their way, according to the word of the LORD.";
vul[24] = "haec dicit Dominus non ascendetis nec bellabitis contra fratres vestros filios Israhel revertatur vir in domum suam a me enim factum est verbum hoc audierunt sermonem Domini et reversi sunt de itinere sicut eis praeceperat Dominus";
kjv[25] = "Then Jeroboam built Shechem in mount Ephraim, and dwelt therein; and went out from thence, and built Penuel.";
rsv[25] = "Then Jerobo\'am built Shechem in the hill country of E\'phraim, and dwelt there; and he went out from there and built Penu\'el.";
asv[25] = "Then Jeroboam built Shechem in the hill-country of Ephraim, and dwelt therein; and he went out from thence, and built Penuel.";
yng[25] = "And Jeroboam buildeth Shechem in the hill-country of Ephraim, and dwelleth in it, and goeth out thence, and buildeth Penuel;";
dby[25] = "And Jeroboam built Shechem in mount Ephraim, and dwelt therein; and went out from thence, and built Penuel.";
web[25] = "Then Jeroboam built Shechem in mount Ephraim, and dwelt in it, and went out from thence, and built Penuel.";
hnv[25] = " Then Yarov`am built Shekhem in the hill-country of Efrayim, and lived therein; and he went out from there, and built Penu\'el.";
vul[25] = "aedificavit autem Hieroboam Sychem in monte Ephraim et habitavit ibi et egressus inde aedificavit Phanuhel";
kjv[26] = "And Jeroboam said in his heart, Now shall the kingdom return to the house of David:";
rsv[26] = "And Jerobo\'am said in his heart, &quot;Now the kingdom will turn back to the house of David;";
asv[26] = "And Jeroboam said in his heart, Now will the kingdom return to the house of David:";
yng[26] = "and Jeroboam saith in his heart, `Now doth the kingdom turn back to the house of David --";
dby[26] = "And Jeroboam said in his heart, Now shall the kingdom return to the house of David.";
web[26] = "And Jeroboam said in his heart, Now shall the kingdom return to the house of David:";
hnv[26] = " Yarov`am said in his heart, Now will the kingdom return to the house of David:";
vul[26] = "dixitque Hieroboam in corde suo nunc revertetur regnum ad domum David";
kjv[27] = "If this people go up to do sacrifice in the house of the LORD at Jerusalem, then shall the heart of this people turn again unto their lord, [even] unto Rehoboam king of Judah, and they shall kill me, and go again to Rehoboam king of Judah.";
rsv[27] = "if this people go up to offer sacrifices in the house of the LORD at Jerusalem, then the heart of this people will turn again to their lord, to Rehobo\'am king of Judah, and they will kill me and return to Rehobo\'am king of Judah.&quot;";
asv[27] = "if this people go up to offer sacrifices in the house of Jehovah at Jerusalem, then will the heart of this people turn again unto their lord, even unto Rehoboam king of Judah; and they will kill me, and return to Rehoboam king of Judah.";
yng[27] = "if this people go up to make sacrifices in the house of Jehovah in Jerusalem, then hath the heart of this people turned back unto their lord, unto Rehoboam king of Judah, and they have slain me, and turned back unto Rehoboam king of Judah.\'";
dby[27] = "If this people go up to do sacrifice in the house of Jehovah at Jerusalem, the heart of this people will turn again to their lord, to Rehoboam king of Judah, and they will kill me, and return to Rehoboam king of Judah.";
web[27] = "If this people go up to perform sacrifice in the house of the LORD at Jerusalem, then shall the heart of this people turn again to their lord, [even] to Rehoboam king of Judah, and they shall kill me, and return to Rehoboam king of Judah.";
hnv[27] = "if this people go up to offer sacrifices in the house of the LORD at Yerushalayim, then will the heart of this people turn again to their lord, even to Rechav`am king of Yehudah; and they will kill me, and return to Rechav`am king of Yehudah.";
vul[27] = "si ascenderit populus iste ut faciat sacrificia in domo Domini in Hierusalem et convertetur cor populi huius ad dominum suum Roboam regem Iuda interficientque me et revertentur ad eum";
kjv[28] = "Whereupon the king took counsel, and made two calves [of] gold, and said unto them, It is too much for you to go up to Jerusalem: behold thy gods, O Israel, which brought thee up out of the land of Egypt.";
rsv[28] = "So the king took counsel, and made two calves of gold. And he said to the people, &quot;You have gone up to Jerusalem long enough. Behold your gods, O Israel, who brought you up out of the land of Egypt.&quot;";
asv[28] = "Whereupon the king took counsel, and made two calves of gold; and he said unto them, It is too much for you to go up to Jerusalem: behold thy gods, O Israel, which brought thee up out of the land of Egypt.";
yng[28] = "And the king taketh counsel, and maketh two calves of gold, and saith unto them, `Enough to you of going up to Jerusalem; lo, thy gods, O Israel, which brought thee up out of the land of Egypt.\'";
dby[28] = "And the king took counsel, and made two calves of gold. And he said to them, It is too much for you to go up to Jerusalem: behold thy gods, Israel, which brought thee up out of the land of Egypt!";
web[28] = "Upon which the king took counsel, and made two calves [of] gold, and said to them, It is too much for you to go up to Jerusalem: behold thy gods, O Israel, which brought thee out of the land of Egypt.";
hnv[28] = "Whereupon the king took counsel, and made two calves of gold; and he said to them, It is too much for you to go up to Yerushalayim: see your gods, Yisra\'el, which brought you up out of the land of Mitzrayim.";
vul[28] = "et excogitato consilio fecit duos vitulos aureos et dixit eis nolite ultra ascendere Hierusalem ecce dii tui Israhel qui eduxerunt te de terra Aegypti";
kjv[29] = "And he set the one in Bethel, and the other put he in Dan.";
rsv[29] = "And he set one in Bethel, and the other he put in Dan.";
asv[29] = "And he set the one in Beth-el, and the other put he in Dan.";
yng[29] = "And he setteth the one in Beth-El, and the other he hath put in Dan,";
dby[29] = "And he set the one in Bethel, and the other he put in Dan.";
web[29] = "And he set the one in Beth-el, and the other he placed in Dan.";
hnv[29] = "He set the one in Beit-El, and the other put he in Dan.";
vul[29] = "posuitque unum in Bethel et alterum in Dan";
kjv[30] = "And this thing became a sin: for the people went [to worship] before the one, [even] unto Dan.";
rsv[30] = "And this thing became a sin, for the people went to the one at Bethel and to the other as far as Dan.";
asv[30] = "And this thing became a sin; for the people went [to worship] before the one, even unto Dan.";
yng[30] = "and this thing becometh a sin, and the people go before the one -- unto Dan.";
dby[30] = "And this thing became a sin; and the people went [to worship] before the one, as far as Dan.";
web[30] = "And this thing became a sin: for the people went [to worship] before the one, [even] to Dan.";
hnv[30] = "This thing became a sin; for the people went [to worship] before the one, even to Dan.";
vul[30] = "et factum est verbum hoc in peccatum ibat enim populus ad adorandum vitulum usque in Dan";
kjv[31] = "And he made an house of high places, and made priests of the lowest of the people, which were not of the sons of Levi.";
rsv[31] = "He also made houses on high places, and appointed priests from among all the people, who were not of the Levites.";
asv[31] = "And he made houses of high places, and made priests from among all the people, that were not of the sons of Levi.";
yng[31] = "And he maketh the house of high places, and maketh priests of the extremities of the people, who were not of the sons of Levi;";
dby[31] = "And he made a house of high places, and made priests from all classes of the people, who were not of the sons of Levi.";
web[31] = "And he made a house of high places, and made priests of the lowest of the people, who were not of the sons of Levi.";
hnv[31] = "He made houses of high places, and made Kohanim from among all the people, who were not of the sons of Levi.";
vul[31] = "et fecit fana in excelsis et sacerdotes de extremis populi qui non erant de filiis Levi";
kjv[32] = "And Jeroboam ordained a feast in the eighth month, on the fifteenth day of the month, like unto the feast that [is] in Judah, and he offered upon the altar. So did he in Bethel, sacrificing unto the calves that he had made: and he placed in Bethel the priests of the high places which he had made.";
rsv[32] = "And Jerobo\'am appointed a feast on the fifteenth day of the eighth month like the feast that was in Judah, and he offered sacrifices upon the altar; so he did in Bethel, sacrificing to the calves that he had made. And he placed in Bethel the priests of the high places that he had made.";
asv[32] = "And Jeroboam ordained a feast in the eighth month, on the fifteenth day of the month, like unto the feast that is in Judah, and he went up unto the altar; so did he in Beth-el, sacrificing unto the calves that he had made: and he placed in Beth-el the priests of the high places that he had made.";
yng[32] = "and Jeroboam maketh a festival in the eighth month, in the fifteenth day of the month, like the festival that [is] in Judah, and he offereth on the altar -- so did he in Beth-El -- to sacrifice to the calves which he made, and he hath appointed in Beth-El the priests of the high places that he made.";
dby[32] = "And Jeroboam ordained a feast in the eighth month, on the fifteenth day of the month, like the feast that was in Judah, and he offered upon the altar. So did he in Bethel, sacrificing to the calves that he had made; and he placed in Bethel the priests of the high places that he had made.";
web[32] = "And Jeroboam ordained a feast in the eighth month, on the fifteenth day of the month, like the feast that [is] in Judah, and he offered upon the altar. So did he in Beth-el, sacrificing to the calves that he had made: and he placed in Beth-el the priests of the high places which he had made.";
hnv[32] = "Yarov`am ordained a feast in the eighth month, on the fifteenth day of the month, like the feast that is in Yehudah, and he went up to the altar; so did he in Beit-El, sacrificing to the calves that he had made: and he placed in Beit-El the Kohanim of the high places that he had made.";
vul[32] = "constituitque diem sollemnem in mense octavo quintadecima die mensis in similitudinem sollemnitatis quae celebratur in Iuda et ascendens altare similiter fecit in Bethel ut immolaret vitulis quos fabricatus erat constituitque in Bethel sacerdotes excelsorum quae fecerat";
kjv[33] = "So he offered upon the altar which he had made in Bethel the fifteenth day of the eighth month, [even] in the month which he had devised of his own heart; and ordained a feast unto the children of Israel: and he offered upon the altar, and burnt incense.";
rsv[33] = "He went up to the altar which he had made in Bethel on the fifteenth day in the eighth month, in the month which he had devised of his own heart; and he ordained a feast for the people of Israel, and went up to the altar to burn incense.";
asv[33] = "And he went up unto the altar which he had made in Beth-el on the fifteenth day in the eighth month, even in the month which he had devised of his own heart: and he ordained a feast for the children of Israel, and went up unto the altar, to burn incense.";
yng[33] = "And he offereth up on the altar that he made in Beth-El, on the fifteenth day of the eighth month, in the month that he devised of his own heart, and he maketh a festival to the sons of Israel, and offereth on the altar -- to make perfume.";
dby[33] = "And he offered upon the altar that he had made in Bethel, on the fifteenth day of the eighth month, in the month which he had devised of his own heart; and he made a feast for the children of Israel, and he offered upon the altar, burning incense.";
web[33] = "So he offered upon the altar which he had made in Beth-el the fifteenth day of the eighth month, [even] in the month which he had devised of his own heart; and ordained a feast to the children of Israel: and he offered upon the altar, and burnt incense.";
hnv[33] = "He went up to the altar which he had made in Beit-El on the fifteenth day in the eighth month, even in the month which he had devised of his own heart: and he ordained a feast for the children of Yisra\'el, and went up to the altar, to burn incense.";
vul[33] = "et ascendit super altare quod extruxerat in Bethel quintadecima die mensis octavi quem finxerat de corde suo et fecit sollemnitatem filiis Israhel et ascendit super altare ut adoleret incensum";
