csb[1] = "Some time passed after these events. Naboth the Jezreelite had a vineyard; it was in Jezreel next to the palace of King Ahab of Samaria.";
csb[2] = "So Ahab spoke to Naboth, saying, &quot;Give me your vineyard so I can have it for a vegetable garden, since it is right next to my palace. I will give you a better vineyard in its place, or if you prefer, I will give you its value in silver.&quot;";
csb[3] = "But Naboth said to Ahab, &quot;I will never give my fathers\' inheritance to you.&quot;";
csb[4] = "So Ahab went to his palace resentful and angry because of what Naboth the Jezreelite had told him. He had said, &quot;I will not give you my fathers\' inheritance.&quot; He lay down on his bed, turned his face away, and didn\'t eat any food.";
csb[5] = "Then his wife Jezebel came to him and said to him, &quot;Why are you so upset that you refuse to eat? &quot;";
csb[6] = "&quot;Because I spoke to Naboth the Jezreelite,&quot; he replied. &quot;I told him: Give me your vineyard for silver, or if you wish, I will give you a vineyard in its place. But he said, \'I won\'t give you my vineyard! \' &quot;";
csb[7] = "Then his wife Jezebel said to him, &quot;Now, exercise your royal power over Israel. Get up, eat some food, and be happy. For I will give you the vineyard of Naboth the Jezreelite.&quot;";
csb[8] = "So she wrote letters in Ahab\'s name and sealed them with his seal. She sent the letters to the elders and nobles who lived with Naboth in his city.";
csb[9] = "In the letters, she wrote: Proclaim a fast and seat Naboth at the head of the people.";
csb[10] = "Then seat two wicked men opposite him and have them testify against him, saying, &quot;You have cursed God and the king! &quot; Then take him out and stone him to death.";
csb[11] = "The men of his city, the elders and nobles who lived in his city, did as Jezebel had sent word to them, just as it was written in the letters she had sent them.";
csb[12] = "They proclaimed a fast and seated Naboth at the head of the people.";
csb[13] = "The two wicked men came in and sat opposite him. Then the wicked men testified against Naboth in the presence of the people, saying, &quot;Naboth has cursed God and the king! &quot; So they took him outside the city and stoned him to death with stones.";
csb[14] = "Then they sent word to Jezebel: &quot;Naboth has been stoned to death.&quot;";
csb[15] = "When Jezebel heard that Naboth had been stoned to death, she said to Ahab, &quot;Get up and take possession of the vineyard of Naboth the Jezreelite who refused to give it to you for silver, since Naboth isn\'t alive, but dead.&quot;";
csb[16] = "When Ahab heard that Naboth was dead, he got up to go down to the vineyard of Naboth the Jezreelite to take possession of it.";
csb[17] = "Then the word of the LORD came to Elijah the Tishbite:";
csb[18] = "&quot;Get up and go to meet King Ahab of Israel, who is in Samaria. He\'s in Naboth\'s vineyard, where he has gone to take possession of it.";
csb[19] = "&quot;Tell him, \'This is what the LORD says: Have you murdered and also taken possession? \' Then tell him, \'This is what the LORD says: In the place where the dogs licked up Naboth\'s blood, the dogs will also lick up your blood! \' &quot;";
csb[20] = "Ahab said to Elijah, &quot;So, my enemy, you\'ve found me, have you? &quot; He replied, &quot;I have found you because you devoted yourself to do what is evil in the LORD\'s sight.";
csb[21] = "&quot;This is what the LORD says: \'I am about to bring disaster on you and will eradicate your descendants: I will wipe out all of Ahab\'s males, both slave and free, in Israel;";
csb[22] = "&quot;I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah, because you have angered me and caused Israel to sin.\'";
csb[23] = "&quot;The LORD also speaks of Jezebel: \'The dogs will eat Jezebel in the plot of land at Jezreel:";
csb[24] = "&quot;Anyone who belongs to Ahab and dies in the city, the dogs will eat, and anyone who dies in the field, the birds will eat.\' &quot;";
csb[25] = "Still, there was no one like Ahab, who devoted himself to do what was evil in the LORD\'s sight, because his wife Jezebel incited him.";
csb[26] = "He committed the most detestable acts by following idols as the Amorites had, whom the LORD had dispossessed before the Israelites.";
csb[27] = "When Ahab heard these words, he tore his clothes, put sackcloth over his body, and fasted. He lay down in sackcloth and walked around subdued.";
csb[28] = "Then the word of the LORD came to Elijah the Tishbite:";
csb[29] = "&quot;Have you seen how Ahab has humbled himself before me? I will not bring the disaster during his lifetime, because he has humbled himself before me. I will bring the disaster on his house during his son\'s lifetime.&quot;";
kjv[1] = "And it came to pass after these things, [that] Naboth the Jezreelite had a vineyard, which [was] in Jezreel, hard by the palace of Ahab king of Samaria.";
rsv[1] = "Now Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Sama\'ria.";

yng[1] = "And it cometh to pass, after these things, a vineyard hath been to Naboth the Jezreelite, that [is] in Jezreel, near the palace of Ahab king of Samaria,";
dby[1] = "And it came to pass after these things, [that] Naboth the Jizreelite had a vineyard, which was in Jizreel, by the side of the palace of Ahab king of Samaria.";

hnv[1] = "It happened after these things, that Navot the Yizre`eli had a vineyard, which was in Yizre`el, hard by the palace of Ach\'av king of Shomron.";

kjv[2] = "And Ahab spake unto Naboth, saying, Give me thy vineyard, that I may have it for a garden of herbs, because it [is] near unto my house: and I will give thee for it a better vineyard than it; [or], if it seem good to thee, I will give thee the worth of it in money.";
rsv[2] = "And after this Ahab said to Naboth, &quot;Give me your vineyard, that I may have it for a vegetable garden, because it is near my house; and I will give you a better vineyard for it; or, if it seems good to you, I will give you its value in money.&quot;";
asv[2] = "And Ahab spake unto Naboth, saying, Give me thy vineyard, that I may have it for a garden of herbs, because it is near unto my house; and I will give thee for it a better vineyard than it: or, if it seem good to thee, I will give thee the worth of it in money.";
yng[2] = "and Ahab speaketh unto Naboth, saying, `Give to me thy vineyard, and it is to me for a garden of green herbs, for it [is] near by my house, and I give to thee in its stead a better vineyard than it; if good in thine eyes, I give to thee silver -- its price.\'";
dby[2] = "And Ahab spoke to Naboth saying, Give me thy vineyard, that I may have it for a garden of herbs, for it is near, by the side of my house; and I will give thee for it a better vineyard than it; if it seem good to thee, I will give thee its value in money.";
web[2] = "And Ahab spoke to Naboth, saying, Give me thy vineyard, that I may have it for a garden of herbs, because it [is] near to my house: and I will give thee for it a better vineyard than it; [or] if it seemeth good to thee, I will give thee the worth of it in money.";
hnv[2] = "Ach\'av spoke to Navot, saying, Give me your vineyard, that I may have it for a garden of herbs, because it is near to my house; and I will give you for it a better vineyard than it: or, if it seem good to you, I will give you the worth of it in money.";
vul[2] = "locutus est ergo Ahab ad Naboth dicens da mihi vineam tuam ut faciam mihi hortum holerum quia vicina est et prope domum meam daboque tibi pro ea vineam meliorem aut si tibi commodius putas argenti pretium quanto digna est";

kjv[4] = "And Ahab came into his house heavy and displeased because of the word which Naboth the Jezreelite had spoken to him: for he had said, I will not give thee the inheritance of my fathers. And he laid him down upon his bed, and turned away his face, and would eat no bread.";
rsv[4] = "And Ahab went into his house vexed and sullen because of what Naboth the Jezreelite had said to him; for he had said, &quot;I will not give you the inheritance of my fathers.&quot; And he lay down on his bed, and turned away his face, and would eat no food.";
asv[4] = "And Ahab came into his house heavy and displeased because of the word which Naboth the Jezreelite had spoken to him; for he had said, I will not give thee the inheritance of my fathers. And he laid him down upon his bed, and turned away his face, and would eat no bread.";
yng[4] = "and Ahab cometh in unto his house, sulky and wroth, because of the word that Naboth the Jezreelite hath spoken unto him when he saith, `I do not give to thee the inheritance of my fathers,\' and he lieth down on his bed, and turneth round his face, and hath not eaten bread.";
dby[4] = "And Ahab came into his house sullen and vexed because of the word that Naboth the Jizreelite had spoken to him; for he had said, I will not give thee the inheritance of my fathers. And he lay down on his bed, and turned away his face, and ate no bread.";
web[4] = "And Ahab came into his house heavy and displeased, because of the word which Naboth the Jezreelite had spoken to him: for he had said, I will not give thee the inheritance of my fathers. And he laid himself down upon his bed, and turned away his face, and would eat no bread.";
hnv[4] = "Ach\'av came into his house heavy and displeased because of the word which Navot the Yizre`eli had spoken to him; for he had said, I will not give you the inheritance of my fathers. He laid him down on his bed, and turned away his face, and would eat no bread.";
vul[4] = "venit ergo Ahab in domum suam indignans et frendens super verbo quod locutus fuerat ad eum Naboth Hiezrahelites dicens non do tibi hereditatem patrum meorum et proiciens se in lectulum suum avertit faciem ad parietem et non comedit panem";

asv[6] = "And he said unto her, Because I spake unto Naboth the Jezreelite, and said unto him, Give me thy vineyard for money; or else, if it please thee, I will give thee [another] vineyard for it: and he answered, I will not give thee my vineyard.";
yng[6] = "And he saith unto her, `Because I speak unto Naboth the Jezreelite, and say to him, Give to me thy vineyard for money, or if thou desire, I give to thee a vineyard in its stead; and he saith, I do not give to thee my vineyard.\'";
dby[6] = "And he said to her, Because I spoke to Naboth the Jizreelite and said to him, Give me thy vineyard for money; or else, if it please thee, I will give thee a vineyard for it; and he said, I will not give thee my vineyard.";

rsv[15] = "As soon as Jez\'ebel heard that Naboth had been stoned and was dead, Jez\'ebel said to Ahab, &quot;Arise, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for money; for Naboth is not alive, but dead.&quot;";

yng[15] = "And it cometh to pass, at Jezebel\'s hearing that Naboth hath been stoned, and is dead, that Jezebel saith unto Ahab, `Rise, possess the vineyard of Naboth the Jezreelite, that he refused to give to thee for money, for Naboth is not alive but dead.\'";
dby[15] = "And it came to pass when Jezebel heard that Naboth was stoned and was dead, that Jezebel said to Ahab, Arise, take possession of the vineyard of Naboth the Jizreelite, which he refused to give thee for money; for Naboth is not alive, but dead.";
web[15] = "And it came to pass, when Jezebel heard that Naboth was stoned, and was dead, that Jezebel said to Ahab, Arise, take possession of the vineyard of Naboth the Jezreelite, which he refused to give thee for money: for Naboth is not alive, but dead.";
hnv[15] = "It happened, when Izevel heard that Navot was stoned, and was dead, that Izevel said to Ach\'av, Arise, take possession of the vineyard of Navot the Yizre`eli, which he refused to give you for money; for Navot is not alive, but dead.";
vul[15] = "factum est autem cum audisset Hiezabel lapidatum Naboth et mortuum locuta est ad Ahab surge posside vineam Naboth Hiezrahelitae qui noluit tibi adquiescere et dare eam accepta pecunia non enim vivit Naboth sed mortuus est";
kjv[16] = "And it came to pass, when Ahab heard that Naboth was dead, that Ahab rose up to go down to the vineyard of Naboth the Jezreelite, to take possession of it.";
rsv[16] = "And as soon as Ahab heard that Naboth was dead, Ahab arose to go down to the vineyard of Naboth the Jezreelite, to take possession of it.";
asv[16] = "And it came to pass, when Ahab heard that Naboth was dead, that Ahab rose up to go down to the vineyard of Naboth the Jezreelite, to take possession of it.";
yng[16] = "And it cometh to pass, at Ahab\'s hearing that Naboth is dead, that Ahab riseth to go down unto the vineyard of Naboth the Jezreelite, to possess it.";
dby[16] = "And it came to pass when Ahab heard that Naboth was dead, that Ahab rose up to go down to the vineyard of Naboth the Jizreelite, to take possession of it.";
web[16] = "And it came to pass, when Ahab heard that Naboth was dead, that Ahab arose to go down to the vineyard of Naboth the Jezreelite, to take possession of it.";
hnv[16] = "It happened, when Ach\'av heard that Navot was dead, that Ach\'av rose up to go down to the vineyard of Navot the Yizre`eli, to take possession of it.";

kjv[18] = "Arise, go down to meet Ahab king of Israel, which [is] in Samaria: behold, [he is] in the vineyard of Naboth, whither he is gone down to possess it.";
rsv[18] = "&quot;Arise, go down to meet Ahab king of Israel, who is in Sama\'ria; behold, he is in the vineyard of Naboth, where he has gone to take possession.";
asv[18] = "Arise, go down to meet Ahab king of Israel, who dwelleth in Samaria: behold, he is in the vineyard of Naboth, whither he is gone down to take possession of it.";
yng[18] = "`Rise, go down to meet Ahab king of Israel, who [is] in Samaria, -- lo, in the vineyard of Naboth, whither he hath gone down to possess it,";
dby[18] = "Arise, go down to meet Ahab king of Israel, who is in Samaria: behold, he is in the vineyard of Naboth, whither he is gone down to take possession of it.";
web[18] = "Arise, go down to meet Ahab king of Israel, who [is] in Samaria: behold, [he is] in the vineyard of Naboth, whither he is gone down to possess it.";
hnv[18] = "Arise, go down to meet Ach\'av king of Yisra\'el, who dwells in Shomron: behold, he is in the vineyard of Navot, where he is gone down to take possession of it.";
vul[18] = "surge et descende in occursum Ahab regis Israhel qui est in Samaria ecce ad vineam Naboth descendit ut possideat eam";
kjv[19] = "And thou shalt speak unto him, saying, Thus saith the LORD, Hast thou killed, and also taken possession? And thou shalt speak unto him, saying, Thus saith the LORD, In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine.";
rsv[19] = "And you shall say to him, \'Thus says the LORD, &quot;Have you killed, and also taken possession?&quot;\' And you shall say to him, \'Thus says the LORD: &quot;In the place where dogs licked up the blood of Naboth shall dogs lick your own blood.&quot;\'&quot;";
asv[19] = "And thou shalt speak unto him, saying, Thus saith Jehovah, Hast thou killed, and also taken possession? And thou shalt speak unto him, saying, Thus saith Jehovah, In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine.";
yng[19] = "and thou hast spoken unto him, saying, Thus said Jehovah, Hast thou murdered, and also possessed? and thou hast spoken unto him, saying, Thus said Jehovah, In the place where the dogs licked the blood of Naboth, do the dogs lick thy blood, even thine.\'";
dby[19] = "And thou shalt speak unto him saying, Thus saith Jehovah: Hast thou killed, and also taken possession? And thou shalt speak unto him saying, Thus saith Jehovah: In the place where the dogs licked the blood of Naboth shall the dogs lick thy blood, even thine.";
web[19] = "And thou shalt speak to him, saying, Thus saith the LORD, Hast thou killed, and also taken possession? And thou shalt speak to him, saying, Thus saith the LORD, In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine.";
hnv[19] = "You shall speak to him, saying, Thus says the LORD, Have you killed and also taken possession? You shall speak to him, saying, Thus says the LORD, In the place where dogs licked the blood of Navot shall dogs lick your blood, even your.";
vul[19] = "et loqueris ad eum dicens haec dicit Dominus occidisti insuper et possedisti et post haec addes haec dicit Dominus in loco hoc in quo linxerunt canes sanguinem Naboth lambent tuum quoque sanguinem";
kjv[20] = "And Ahab said to Elijah, Hast thou found me, O mine enemy? And he answered, I have found [thee]: because thou hast sold thyself to work evil in the sight of the LORD.";
rsv[20] = "Ahab said to Eli\'jah, &quot;Have you found me, O my enemy?&quot; He answered, &quot;I have found you, because you have sold yourself to do what is evil in the sight of the LORD.";
asv[20] = "And Ahab said to Elijah, Hast thou found me, O mine enemy? And he answered, I have found thee, because thou hast sold thyself to do that which is evil in the sight of Jehovah.";
yng[20] = "And Ahab saith unto Elijah, `Hast thou found me, O mine enemy?\' and he saith, `I have found -- because of thy selling thyself to do the evil thing in the eyes of Jehovah;";
dby[20] = "And Ahab said to Elijah, Hast thou found me, mine enemy? And he said, I have found [thee]; because thou hast sold thyself to do evil in the sight of Jehovah.";
web[20] = "And Ahab said to Elijah, Hast thou found me, O my enemy? And he answered, I have found [thee]: because thou hast sold thyself to work evil in the sight of the LORD.";
hnv[20] = "Ach\'av said to Eliyah, Have you found me, my enemy? He answered, I have found you, because you have sold yourself to do that which is evil in the sight of the LORD.";
vul[20] = "et ait Ahab ad Heliam num invenisti me inimice mee qui dixit inveni eo quod venundatus sis ut faceres malum in conspectu Domini";
kjv[21] = "Behold, I will bring evil upon thee, and will take away thy posterity, and will cut off from Ahab him that pisseth against the wall, and him that is shut up and left in Israel,";
rsv[21] = "Behold, I will bring evil upon you; I will utterly sweep you away, and will cut off from Ahab every male, bond or free, in Israel;";
asv[21] = "Behold, I will bring evil upon thee, and will utterly sweep thee away and will cut off from Ahab every man-child, and him that is shut up and him that is left at large in Israel:";
yng[21] = "lo, I am bringing in unto thee evil, and have taken away thy posterity, and cut off to Ahab those sitting on the wall, and restrained, and left, in Israel,";
dby[21] = "Behold, I will bring evil upon thee, and will take away thy posterity, and will cut off from Ahab every male, and him that is shut up and left in Israel;";
web[21] = "Behold, I will bring evil upon thee, and will take away thy posterity, and will cut off from Ahab the males, and him that is shut up and left in Israel,";
hnv[21] = "Behold, I will bring evil on you, and will utterly sweep you away and will cut off from Ach\'av every man-child, and him who is shut up and him who is left at large in Yisra\'el:";
vul[21] = "ecce ego inducam super te malum et demetam posteriora tua et interficiam de Ahab mingentem ad parietem et clausum et ultimum in Israhel";
kjv[22] = "And will make thine house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the provocation wherewith thou hast provoked [me] to anger, and made Israel to sin.";
rsv[22] = "and I will make your house like the house of Jerobo\'am the son of Nebat, and like the house of Ba\'asha the son of Ahi\'jah, for the anger to which you have provoked me, and because you have made Israel to sin.";
asv[22] = "and I will make thy house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah for the provocation wherewith thou hast provoked me to anger, and hast made Israel to sin.";
yng[22] = "and given up thy house like the house of Jeroboam son of Nebat, and like the house of Baasha son of Ahijah, for the provocation with which thou hast provoked [Me], and dost cause Israel to sin.";
dby[22] = "and I will make thy house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the provocation wherewith thou hast provoked me to anger, and made Israel to sin.";
web[22] = "And will make thy house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the provocation with which thou hast provoked [me] to anger, and made Israel to sin.";
hnv[22] = "and I will make your house like the house of Yarov`am the son of Nevat, and like the house of Ba`sha the son of Achiyah for the provocation with which you have provoked me to anger, and have made Yisra\'el to sin.";
vul[22] = "et dabo domum tuam sicut domum Hieroboam filii Nabath et sicut domum Baasa filii Ahia quia egisti ut me ad iracundiam provocares et peccare fecisti Israhel";
kjv[23] = "And of Jezebel also spake the LORD, saying, The dogs shall eat Jezebel by the wall of Jezreel.";
rsv[23] = "And of Jez\'ebel the LORD also said, \'The dogs shall eat Jez\'ebel within the bounds of Jezreel.\'";
asv[23] = "And of Jezebel also spake Jehovah, saying, The dogs shall eat Jezebel by the rampart of Jezreel.";
yng[23] = "`And also of Jezebel hath Jehovah spoken, saying, The dogs do eat Jezebel in the bulwark of Jezreel;";
dby[23] = "And of Jezebel also spoke Jehovah saying, The dogs shall eat Jezebel by the moat of Jizreel.";

rsv[24] = "Any one belonging to Ahab who dies in the city the dogs shall eat; and any one of his who dies in the open country the birds of the air shall eat.&quot;";
asv[24] = "Him that dieth of Ahab in the city the dogs shall eat; and him that dieth in the field shall the birds of the heavens eat.";
yng[24] = "him who dieth of Ahab in a city do the dogs eat, and him who dieth in a field do fowl of the heavens eat;";
dby[24] = "Him that dieth of Ahab in the city shall the dogs eat, and him that dieth in the field shall the fowl of the heavens eat.";
web[24] = "Him that dieth of Ahab in the city the dogs shall eat; and him that dieth in the field shall the fowls of the air eat.";
hnv[24] = "Him who dies of Ach\'av in the city the dogs shall eat; and him who dies in the field shall the birds of the sky eat.";
vul[24] = "si mortuus fuerit Ahab in civitate comedent eum canes si autem mortuus fuerit in agro comedent eum volucres caeli";

asv[25] = "(But there was none like unto Ahab, who did sell himself to do that which was evil in the sight of Jehovah, whom Jezebel his wife stirred up.";

dby[25] = "(Surely there was none like to Ahab, who did sell himself to do evil in the sight of Jehovah, Jezebel his wife urging him on.";
web[25] = "But there was none like Ahab, who sold himself to work wickedness in the sight of the LORD, whom Jezebel his wife instigated.";
hnv[25] = "(But there was none like Ach\'av, who did sell himself to do that which was evil in the sight of the LORD, whom Izevel his wife stirred up.";
vul[25] = "igitur non fuit alter talis ut Ahab qui venundatus est ut faceret malum in conspectu Domini concitavit enim eum Hiezabel uxor sua";
kjv[26] = "And he did very abominably in following idols, according to all [things] as did the Amorites, whom the LORD cast out before the children of Israel.";

asv[26] = "And he did very abominably in following idols, according to all that the Amorites did, whom Jehovah cast out before the children of Israel.)";
yng[26] = "and he doth very abominably to go after the idols, according to all that the Amorite did whom Jehovah dispossessed from the presence of the sons of Israel.\'";
dby[26] = "And he did very abominably in following idols, according to all that the Amorites did, whom Jehovah had dispossessed before the children of Israel.)";
web[26] = "And he did very abominably in following idols, according to all [things] as did the Amorites, whom the LORD cast out before the children of Israel.";

vul[26] = "et abominabilis effectus est in tantum ut sequeretur idola quae fecerant Amorrei quos consumpsit Dominus a facie filiorum Israhel";
kjv[27] = "And it came to pass, when Ahab heard those words, that he rent his clothes, and put sackcloth upon his flesh, and fasted, and lay in sackcloth, and went softly.";

asv[27] = "And it came to pass, when Ahab heard those words, that he rent his clothes, and put sackcloth upon his flesh, and fasted, and lay in sackcloth, and went softly.";
yng[27] = "And it cometh to pass, at Ahab\'s hearing these words, that he rendeth his garments, and putteth sackcloth on his flesh, and fasteth, and lieth in sackcloth, and goeth gently.";
dby[27] = "And it came to pass when Ahab heard these words, that he rent his garments, and put sackcloth upon his flesh, and fasted, and lay in sackcloth, and went softly.";

kjv[29] = "Seest thou how Ahab humbleth himself before me? because he humbleth himself before me, I will not bring the evil in his days: [but] in his son\'s days will I bring the evil upon his house.";
rsv[29] = "&quot;Have you seen how Ahab has humbled himself before me? Because he has humbled himself before me, I will not bring the evil in his days; but in his son\'s days I will bring the evil upon his house.&quot;";
asv[29] = "Seest thou how Ahab humbleth himself before me? because he humbleth himself before me, I will not bring the evil in his days; but in his son\'s day will I bring the evil upon his house.";
yng[29] = "`Hast thou seen that Ahab hath been humbled before Me? because that he hath been humbled before Me, I bring not in the evil in his days; in the days of his son I bring in the evil on his house.\'";
dby[29] = "Seest thou how Ahab humbleth himself before me? because he humbleth himself before me, I will not bring the evil in his days: in his son\'s days will I bring the evil upon his house.";
web[29] = "Seest thou how Ahab humbleth himself before me? because he humbleth himself before me, I will not bring the evil in his days: [but] in his son\'s days will I bring the evil upon his house.";
hnv[29] = "See you how Ach\'av humbles himself before me? because he humbles himself before me, I will not bring the evil in his days; but in his son\'s days will I bring the evil on his house.";
vul[29] = "nonne vidisti humiliatum Ahab coram me quia igitur humiliatus est mei causa non inducam malum in diebus eius sed in diebus filii sui inferam malum domui eius";
