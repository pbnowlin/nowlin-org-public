csb[1] = "There was a lull of three years without war between Aram and Israel.";
csb[2] = "However, in the third year, King Jehoshaphat of Judah went to visit the king of Israel.";
csb[3] = "The king of Israel had said to his servants, &quot;Don\'t you know that Ramoth-gilead is ours, but we\'re doing nothing to take it from the king of Aram? &quot;";
csb[4] = "So he asked Jehoshaphat, &quot;Will you go with me to fight Ramoth-gilead? &quot; Jehoshaphat replied to the king of Israel, &quot;I am as you are, my people as your people, my horses as your horses.&quot;";
csb[5] = "But Jehoshaphat said to the king of Israel, &quot;First, please ask what the LORD\'s will is.&quot;";
csb[6] = "So the king of Israel gathered the prophets, about four hundred men, and asked them, &quot;Should I go against Ramoth-gilead for war or should I refrain? &quot; They replied, &quot;March up, and the Lord will hand it over to the king.&quot;";
csb[7] = "But Jehoshaphat asked, &quot;Isn\'t there a prophet of the LORD here anymore? Let\'s ask him.&quot;";
csb[8] = "The king of Israel said to Jehoshaphat, &quot;There is still one man who can inquire of the LORD, but I hate him because he never prophesies good about me, but only disaster. He is Micaiah son of Imlah.&quot; &quot;The king shouldn\'t say that! &quot; Jehoshaphat replied.";
csb[9] = "So the king of Israel called an officer and said, &quot;Hurry and get Micaiah son of Imlah! &quot;";
csb[10] = "Now the king of Israel and King Jehoshaphat of Judah, clothed in royal attire, were each sitting on his own throne. They were on the threshing floor at the entrance to the gate of Samaria, and all the prophets were prophesying in front of them.";
csb[11] = "Then Zedekiah son of Chenaanah made iron horns and said, &quot;This is what the LORD says: \'You will gore the Arameans with these until they are finished off.\' &quot;";
csb[12] = "And all the prophets were prophesying the same: &quot;March up to Ramoth-gilead and succeed, for the LORD will hand it over to the king.&quot;";
csb[13] = "The messenger who went to call Micaiah instructed him, &quot;Look, the words of the prophets are unanimously favorable for the king. So let your words be like theirs, and speak favorably.&quot;";
csb[14] = "But Micaiah said, &quot;As the LORD lives, I will say whatever the LORD says to me.&quot;";
csb[15] = "So he went to the king, and the king asked him, &quot;Micaiah, should we go to Ramoth-gilead for war, or should we refrain? &quot; Micaiah told him, &quot;March up and succeed. The LORD will hand it over to the king.&quot;";
csb[16] = "But the king said to him, &quot;How many times must I make you swear not to tell me anything but the truth in the name of the LORD? &quot;";
csb[17] = "So Micaiah said: I saw all Israel scattered on the hills like sheep without a shepherd. And the LORD said, &quot;They have no master; let everyone return home in peace.&quot;";
csb[18] = "So the king of Israel said to Jehoshaphat, &quot;Didn\'t I tell you he never prophesies good about me, but only disaster? &quot;";
csb[19] = "Then Micaiah said, &quot;Therefore, hear the word of the LORD: I saw the LORD sitting on his throne, and the whole heavenly army was standing by him at his right hand and at his left hand.";
csb[20] = "&quot;And the LORD said, \'Who will entice Ahab to march up and fall at Ramoth-gilead? \' So one was saying this and another was saying that.";
csb[21] = "&quot;Then a spirit came forward, stood in the LORD\'s presence, and said, \'I will entice him.\'";
csb[22] = "&quot;The LORD asked him, \'How? \' &quot;He said, \'I will go and become a lying spirit in the mouth of all his prophets.\' &quot;Then he said, \'You will certainly entice him and prevail. Go and do that.\'";
csb[23] = "&quot;You see, the LORD has put a lying spirit into the mouth of all these prophets of yours, and the LORD has pronounced disaster against you.&quot;";
csb[24] = "Then Zedekiah son of Chenaanah came up, hit Micaiah on the cheek, and demanded, &quot;Did the Spirit of the LORD leave me to speak to you? &quot;";
csb[25] = "Micaiah replied, &quot;You will soon see when you go to hide in an inner chamber on that day.&quot;";
csb[26] = "Then the king of Israel ordered, &quot;Take Micaiah and return him to Amon, the governor of the city, and to Joash, the king\'s son,";
csb[27] = "&quot;and say, \'This is what the king says: Put this guy in prison and feed him only a little bread and water until I come back safely.\' &quot;";
csb[28] = "But Micaiah said, &quot;If you ever return safely, the LORD has not spoken through me.&quot; Then he said, &quot;Listen, all you people! &quot;";
csb[29] = "Then the king of Israel and Judah\'s King Jehoshaphat went up to Ramoth-gilead.";
csb[30] = "But the king of Israel said to Jehoshaphat, &quot;I will disguise myself and go into battle, but you wear your royal attire.&quot; So the king of Israel disguised himself and went into battle.";
csb[31] = "Now the king of Aram had ordered his thirty-two chariot commanders, &quot;Do not fight with anyone at all except the king of Israel.&quot;";
csb[32] = "When the chariot commanders saw Jehoshaphat, they shouted, &quot;He must be the king of Israel! &quot; So they turned to fight against him, but Jehoshaphat cried out.";
csb[33] = "When the chariot commanders saw that he was not the king of Israel, they turned back from pursuing him.";
csb[34] = "But a man drew his bow without taking special aim and struck the king of Israel through the joints of his armor. So he said to his charioteer, &quot;Turn around and take me out of the battle, for I am badly wounded! &quot;";
csb[35] = "The battle raged throughout that day, and the king was propped up in his chariot facing the Arameans. He died that evening, and blood from his wound flowed into the bottom of the chariot.";
csb[36] = "Then the cry rang out in the army as the sun set, declaring: Each man to his own city, and each man to his own land!";
csb[37] = "So the king died and was brought to Samaria. They buried the king in Samaria.";
csb[38] = "Then someone washed the chariot at the pool of Samaria. The dogs licked up his blood, and the prostitutes bathed in it, according to the word of the LORD that he had spoken.";
csb[39] = "The rest of the events of Ahab\'s reign, along with all his accomplishments, including the ivory palace he built, and all the cities he built, are written in the Historical Record of Israel\'s Kings.";
csb[40] = "Ahab rested with his fathers, and his son Ahaziah became king in his place.";
csb[41] = "Jehoshaphat son of Asa became king over Judah in the fourth year of Israel\'s King Ahab.";
csb[42] = "Jehoshaphat was thirty-five years old when he became king; he reigned twenty-five years in Jerusalem. His mother\'s name was Azubah daughter of Shilhi.";
csb[43] = "He walked in all the ways of his father Asa; he did not turn away from them but did what was right in the LORD\'s sight. However, the high places were not taken away; the people still sacrificed and burned incense on the high places.";
csb[44] = "Jehoshaphat also made peace with the king of Israel.";
csb[45] = "The rest of the events of Jehoshaphat\'s reign, along with the might he exercised and how he waged war, are written in the Historical Record of Judah\'s Kings.";
csb[46] = "He eradicated from the land the rest of the male cult prostitutes who were left from the days of his father Asa.";
csb[47] = "There was no king in Edom; a deputy served as king.";
csb[48] = "Jehoshaphat made ships of Tarshish to go to Ophir for gold, but they did not go because the ships were wrecked at Ezion-geber.";
csb[49] = "At that time, Ahaziah son of Ahab said to Jehoshaphat, &quot;Let my servants go with your servants in the ships,&quot; but Jehoshaphat was not willing.";
csb[50] = "Jehoshaphat rested with his fathers and was buried with them in the city of his ancestor David. His son Jehoram became king in his place.";
csb[51] = "Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Judah\'s King Jehoshaphat, and he reigned over Israel two years.";
csb[52] = "He did what was evil in the LORD\'s sight. He walked in the ways of his father, in the ways of his mother, and in the ways of Jeroboam son of Nebat, who had caused Israel to sin.";
csb[53] = "He served Baal and bowed in worship to him. He angered the LORD God of Israel just as his father had done.";
kjv[1] = "And they continued three years without war between Syria and Israel.";
kjv[2] = "And it came to pass in the third year, that Jehoshaphat the king of Judah came down to the king of Israel.";
kjv[3] = "And the king of Israel said unto his servants, Know ye that Ramoth in Gilead [is] ours, and we [be] still, [and] take it not out of the hand of the king of Syria?";
kjv[4] = "And he said unto Jehoshaphat, Wilt thou go with me to battle to Ramothgilead? And Jehoshaphat said to the king of Israel, I [am] as thou [art], my people as thy people, my horses as thy horses.";
kjv[5] = "And Jehoshaphat said unto the king of Israel, Enquire, I pray thee, at the word of the LORD to day.";
kjv[6] = "Then the king of Israel gathered the prophets together, about four hundred men, and said unto them, Shall I go against Ramothgilead to battle, or shall I forbear? And they said, Go up; for the Lord shall deliver [it] into the hand of the king.";
kjv[7] = "And Jehoshaphat said, [Is there] not here a prophet of the LORD besides, that we might enquire of him?";
kjv[8] = "And the king of Israel said unto Jehoshaphat, [There is] yet one man, Micaiah the son of Imlah, by whom we may enquire of the LORD: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so.";
kjv[9] = "Then the king of Israel called an officer, and said, Hasten [hither] Micaiah the son of Imlah.";
kjv[10] = "And the king of Israel and Jehoshaphat the king of Judah sat each on his throne, having put on their robes, in a void place in the entrance of the gate of Samaria; and all the prophets prophesied before them.";
kjv[11] = "And Zedekiah the son of Chenaanah made him horns of iron: and he said, Thus saith the LORD, With these shalt thou push the Syrians, until thou have consumed them.";
kjv[12] = "And all the prophets prophesied so, saying, Go up to Ramothgilead, and prosper: for the LORD shall deliver [it] into the king\'s hand.";
kjv[13] = "And the messenger that was gone to call Micaiah spake unto him, saying, Behold now, the words of the prophets [declare] good unto the king with one mouth: let thy word, I pray thee, be like the word of one of them, and speak [that which is] good.";
kjv[14] = "And Micaiah said, [As] the LORD liveth, what the LORD saith unto me, that will I speak.";
kjv[15] = "So he came to the king. And the king said unto him, Micaiah, shall we go against Ramothgilead to battle, or shall we forbear? And he answered him, Go, and prosper: for the LORD shall deliver [it] into the hand of the king.";
kjv[16] = "And the king said unto him, How many times shall I adjure thee that thou tell me nothing but [that which is] true in the name of the LORD?";
kjv[17] = "And he said, I saw all Israel scattered upon the hills, as sheep that have not a shepherd: and the LORD said, These have no master: let them return every man to his house in peace.";
kjv[18] = "And the king of Israel said unto Jehoshaphat, Did I not tell thee that he would prophesy no good concerning me, but evil?";
kjv[19] = "And he said, Hear thou therefore the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left.";
kjv[20] = "And the LORD said, Who shall persuade Ahab, that he may go up and fall at Ramothgilead? And one said on this manner, and another said on that manner.";
kjv[21] = "And there came forth a spirit, and stood before the LORD, and said, I will persuade him.";
kjv[22] = "And the LORD said unto him, Wherewith? And he said, I will go forth, and I will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt persuade [him], and prevail also: go forth, and do so.";
kjv[23] = "Now therefore, behold, the LORD hath put a lying spirit in the mouth of all these thy prophets, and the LORD hath spoken evil concerning thee.";
kjv[24] = "But Zedekiah the son of Chenaanah went near, and smote Micaiah on the cheek, and said, Which way went the Spirit of the LORD from me to speak unto thee?";
kjv[25] = "And Micaiah said, Behold, thou shalt see in that day, when thou shalt go into an inner chamber to hide thyself.";
kjv[26] = "And the king of Israel said, Take Micaiah, and carry him back unto Amon the governor of the city, and to Joash the king\'s son;";
kjv[27] = "And say, Thus saith the king, Put this [fellow] in the prison, and feed him with bread of affliction and with water of affliction, until I come in peace.";
kjv[28] = "And Micaiah said, If thou return at all in peace, the LORD hath not spoken by me. And he said, Hearken, O people, every one of you.";
kjv[29] = "So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead.";
kjv[30] = "And the king of Israel said unto Jehoshaphat, I will disguise myself, and enter into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle.";
kjv[31] = "But the king of Syria commanded his thirty and two captains that had rule over his chariots, saying, Fight neither with small nor great, save only with the king of Israel.";
kjv[32] = "And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, Surely it [is] the king of Israel. And they turned aside to fight against him: and Jehoshaphat cried out.";
kjv[33] = "And it came to pass, when the captains of the chariots perceived that it [was] not the king of Israel, that they turned back from pursuing him.";
kjv[34] = "And a [certain] man drew a bow at a venture, and smote the king of Israel between the joints of the harness: wherefore he said unto the driver of his chariot, Turn thine hand, and carry me out of the host; for I am wounded.";
kjv[35] = "And the battle increased that day: and the king was stayed up in his chariot against the Syrians, and died at even: and the blood ran out of the wound into the midst of the chariot.";
kjv[36] = "And there went a proclamation throughout the host about the going down of the sun, saying, Every man to his city, and every man to his own country.";
kjv[37] = "So the king died, and was brought to Samaria; and they buried the king in Samaria.";
kjv[38] = "And [one] washed the chariot in the pool of Samaria; and the dogs licked up his blood; and they washed his armour; according unto the word of the LORD which he spake.";
kjv[39] = "Now the rest of the acts of Ahab, and all that he did, and the ivory house which he made, and all the cities that he built, [are] they not written in the book of the chronicles of the kings of Israel?";
kjv[40] = "So Ahab slept with his fathers; and Ahaziah his son reigned in his stead.";
kjv[41] = "And Jehoshaphat the son of Asa began to reign over Judah in the fourth year of Ahab king of Israel.";
kjv[42] = "Jehoshaphat [was] thirty and five years old when he began to reign; and he reigned twenty and five years in Jerusalem. And his mother\'s name [was] Azubah the daughter of Shilhi.";
kjv[43] = "And he walked in all the ways of Asa his father; he turned not aside from it, doing [that which was] right in the eyes of the LORD: nevertheless the high places were not taken away; [for] the people offered and burnt incense yet in the high places.";
kjv[44] = "And Jehoshaphat made peace with the king of Israel.";
kjv[45] = "Now the rest of the acts of Jehoshaphat, and his might that he shewed, and how he warred, [are] they not written in the book of the chronicles of the kings of Judah?";
kjv[46] = "And the remnant of the sodomites, which remained in the days of his father Asa, he took out of the land.";
kjv[47] = "[There was] then no king in Edom: a deputy [was] king.";
kjv[48] = "Jehoshaphat made ships of Tharshish to go to Ophir for gold: but they went not; for the ships were broken at Eziongeber.";
kjv[49] = "Then said Ahaziah the son of Ahab unto Jehoshaphat, Let my servants go with thy servants in the ships. But Jehoshaphat would not.";
kjv[50] = "And Jehoshaphat slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoram his son reigned in his stead.";
kjv[51] = "Ahaziah the son of Ahab began to reign over Israel in Samaria the seventeenth year of Jehoshaphat king of Judah, and reigned two years over Israel.";
kjv[52] = "And he did evil in the sight of the LORD, and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam the son of Nebat, who made Israel to sin:";
kjv[53] = "For he served Baal, and worshipped him, and provoked to anger the LORD God of Israel, according to all that his father had done.";

asv[8] = "And the king of Israel said unto Jehoshaphat, There is yet one man by whom we may inquire of Jehovah, Micaiah the son of Imlah: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so.";

web[8] = "And the king of Israel said to Jehoshaphat, [There is] yet one man, Micaiah the son of Imlah, by whom we may inquire of the LORD: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so.";
hnv[8] = "The king of Yisra\'el said to Yehoshafat, there is yet one man by whom we may inquire of the LORD, Mikhayahu the son of Yimlah: but I hate him; for he does not prophesy good concerning me, but evil. Yehoshafat said, &quot;Don\'t let the king say so.&quot;";
vul[8] = "et ait rex Israhel ad Iosaphat remansit vir unus per quem possimus interrogare Dominum sed ego odi eum quia non prophetat mihi bonum sed malum Micheas filius Hiemla cui Iosaphat ait ne loquaris ita rex";
rsv[9] = "Then the king of Israel summoned an officer and said, &quot;Bring quickly Micai\'ah the son of Imlah.&quot;";
asv[9] = "Then the king of Israel called an officer, and said, Fetch quickly Micaiah the son of Imlah.";
yng[9] = "And the king of Israel calleth unto a certain eunuch, and saith, `Hasten Micaiah son of Imlah.\'";
dby[9] = "Then the king of Israel called a chamberlain, and said, Fetch quickly Micah the son of Imlah.";
web[9] = "Then the king of Israel called an officer, and said, Hasten [hither] Micaiah the son of Imlah.";
hnv[9] = "Then the king of Yisra\'el called an officer, and said, Get quickly Mikhayahu the son of Yimlah.";
vul[9] = "vocavit ergo rex Israhel eunuchum quendam et dixit ei festina adducere Micheam filium Hiemla";
rsv[10] = "Now the king of Israel and Jehosh\'aphat the king of Judah were sitting on their thrones, arrayed in their robes, at the threshing floor at the entrance of the gate of Sama\'ria; and all the prophets were prophesying before them.";
asv[10] = "Now the king of Israel and Jehoshaphat the king of Judah were sitting each on his throne, arrayed in their robes, in an open place at the entrance of the gate of Samaria; and all the prophets were prophesying before them.";
yng[10] = "And the king of Israel and Jehoshaphat king of Judah are sitting, each on his throne, clothed with garments, in a threshing-floor, at the opening of the gate of Samaria, and all the prophets are prophesying before them.";
dby[10] = "And the king of Israel and Jehoshaphat the king of Judah, having put on their robes, sat each on his throne, in the open place at the entrance of the gate of Samaria; and all the prophets prophesied before them.";
web[10] = "And the king of Israel and Jehoshaphat the king of Judah sat each on his throne, having put on their robes, in a void place in the entrance of the gate of Samaria; and all the prophets prophesied before them.";
hnv[10] = "Now the king of Yisra\'el and Yehoshafat the king of Yehudah were sitting each on his throne, arrayed in their robes, in an open place at the entrance of the gate of Shomron; and all the prophets were prophesying before them.";
vul[10] = "rex autem Israhel et Iosaphat rex Iuda sedebat unusquisque in solio suo vestiti cultu regio in area iuxta ostium portae Samariae et universi prophetae prophetabant in conspectu eorum";
rsv[11] = "And Zedeki\'ah the son of Chena\'anah made for himself horns of iron, and said, &quot;Thus says the LORD, \'With these you shall push the Syrians until they are destroyed.\'&quot;";
asv[11] = "And Zedekiah the son of Chenaanah made him horns of iron, and said, Thus saith Jehovah, With these shalt thou push the Syrians, until they be consumed.";
yng[11] = "And Zedekiah son of Chenaanah maketh for himself horns of iron, and saith, `Thus said Jehovah, By these thou dost push the Aramaeans till they are consumed;\'";
dby[11] = "And Zedekiah the son of Chenaanah made for himself horns of iron, and he said, Thus saith Jehovah: With these shalt thou push the Syrians, until thou have exterminated them.";
web[11] = "And Zedekiah the son of Chenaanah made him horns of iron: and he said, Thus saith the LORD, With these shalt thou push the Syrians, until thou hast consumed them.";
hnv[11] = "Tzidkiyahu the son of Kena`anah made him horns of iron, and said, Thus says the LORD, With these shall you push the Aram, until they be consumed.";
vul[11] = "fecit quoque sibi Sedecias filius Chanaan cornua ferrea et ait haec dicit Dominus his ventilabis Syriam donec deleas eam";
rsv[12] = "And all the prophets prophesied so, and said, &quot;Go up to Ramoth-gilead and triumph; the LORD will give it into the hand of the king.&quot;";
asv[12] = "And all the prophets prophesied so, saying, Go up to Ramoth-gilead, and prosper; for Jehovah will deliver it into the hand of the king.";
yng[12] = "and all the prophets are prophesying so, saying, `Go up to Ramoth-Gilead, and prosper, and Jehovah hath given [it] into the hand of the king.\'";
dby[12] = "And all the prophets prophesied so, saying, Go up to Ramoth-Gilead, and prosper; for Jehovah will give it into the king\'s hand.";
web[12] = "And all the prophets prophesied so, saying, Go up to Ramoth-gilead, and prosper: for the LORD will deliver [it] into the king\'s hand.";
hnv[12] = "All the prophets prophesied so, saying, Go up to Ramot-Gil`ad, and prosper; for the LORD will deliver it into the hand of the king.";
vul[12] = "omnesque prophetae similiter prophetabant dicentes ascende in Ramoth Galaad et vade prospere et tradet Dominus in manu regis";
rsv[13] = "And the messenger who went to summon Micai\'ah said to him, &quot;Behold, the words of the prophets with one accord are favorable to the king; let your word be like the word of one of them, and speak favorably.&quot;";
asv[13] = "And the messenger that went to call Micaiah spake unto him, saying, Behold now, the words of the prophets [declare] good unto the king with one mouth: let thy word, I pray thee, be like the word of one of them, and speak thou good.";
yng[13] = "And the messenger who hath gone to call Micaiah hath spoken unto him, saying, `Lo, I pray thee, the words of the prophets, with one mouth, [are] good towards the king; let it be, I pray thee, thy word as the word of one of them -- and thou hast spoken good.\'";
dby[13] = "And the messenger that went to call Micah spoke to him saying, Behold now, the words of the prophets [declare] good to the king with one assent: let thy word, I pray thee, be like the word of one of them, and speak good.";
web[13] = "And the messenger that went to call Micaiah, spoke to him, saying, Behold now, the words of the prophets [declare] good to the king with one mouth: let thy word, I pray thee, be like the word of one of them, and speak [that which is] good.";
hnv[13] = "The messenger who went to call Mikhayahu spoke to him, saying, See now, the words of the prophets [declare] good to the king with one mouth: please let your word be like the word of one of them, and speak you good.";
vul[13] = "nuntius vero qui ierat ut vocaret Micheam locutus est ad eum dicens ecce sermones prophetarum ore uno bona regi praedicant sit ergo et sermo tuus similis eorum et loquere bona";
rsv[14] = "But Micai\'ah said, &quot;As the LORD lives, what the LORD says to me, that I will speak.&quot;";
asv[14] = "And Micaiah said, As Jehovah liveth, what Jehovah saith unto me, that will I speak.";
yng[14] = "And Micaiah saith, `Jehovah liveth; surely that which Jehovah saith unto me -- it I speak.\'";
dby[14] = "And Micah said, As Jehovah liveth, even what Jehovah shall say to me, that will I speak.";
web[14] = "And Micaiah said, [As] the LORD liveth, what the LORD saith to me, that will I speak.";
hnv[14] = "Mikhayahu said, As the LORD lives, what the LORD says to me, that will I speak.";
vul[14] = "cui Micheas ait vivit Dominus quia quodcumque dixerit mihi Dominus hoc loquar";
rsv[15] = "And when he had come to the king, the king said to him, &quot;Micai\'ah, shall we go to Ramoth-gilead to battle, or shall we forbear?&quot; And he answered him, &quot;Go up and triumph; the LORD will give it into the hand of the king.&quot;";
asv[15] = "And when he was come to the king, the king said unto him, Micaiah, shall we go to Ramoth-gilead to battle, or shall we forbear? And he answered him, Go up and prosper; and Jehovah will deliver it into the hand of the king.";
yng[15] = "And he cometh in unto the king, and the king saith unto him, `Micaiah, do we go unto Ramoth-Gilead, to battle, or do we forbear?\' and he saith unto him, `Go up, and prosper, and Jehovah hath given [it] into the hand of the king.\'";
dby[15] = "And he came to the king. And the king said to him, Micah, shall we go against Ramoth-Gilead to battle, or shall we forbear? And he said to him, Go up, and prosper; for Jehovah will give it into the hand of the king.";
web[15] = "So he came to the king. And the king said to him, Micaiah, shall we go against Ramoth-gilead to battle, or shall we forbear? And he answered him, Go, and prosper: for the LORD will deliver [it] into the hand of the king.";
hnv[15] = "When he was come to the king, the king said to him, Mikhayahu, shall we go to Ramot-Gil`ad to battle, or shall we forbear? He answered him, Go up and prosper; and the LORD will deliver it into the hand of the king.";
vul[15] = "venit itaque ad regem et ait illi rex Michea ire debemus in Ramoth Galaad ad proeliandum an cessare cui ille respondit ascende et vade prospere et tradet Dominus in manu regis";
rsv[16] = "But the king said to him, &quot;How many times shall I adjure you that you speak to me nothing but the truth in the name of the LORD?&quot;";
asv[16] = "And the king said unto him, How many times shall I adjure thee that thou speak unto me nothing but the truth in the name of Jehovah?";
yng[16] = "And the king saith unto him, `How many times am I adjuring thee that thou speak nothing unto me but truth in the name of Jehovah?\'";
dby[16] = "And the king said to him, How many times shall I adjure thee that thou tell me nothing but truth in the name of Jehovah?";
web[16] = "And the king said to him, How many times shall I adjure thee that thou tell me nothing but [that which is] true in the name of the LORD?";
hnv[16] = "The king said to him, How many times shall I adjure you that you speak to me nothing but the truth in the name of the LORD?";
vul[16] = "dixit autem rex ad eum iterum atque iterum adiuro te ut non loquaris mihi nisi quod verum est in nomine Domini";
rsv[17] = "And he said, &quot;I saw all Israel scattered upon the mountains, as sheep that have no shepherd; and the LORD said, \'These have no master; let each return to his home in peace.\'&quot;";
asv[17] = "And he said, I saw all Israel scattered upon the mountains, as sheep that have no shepherd: and Jehovah said, These have no master; let them return every man to his house in peace.";
yng[17] = "And he saith, `I have seen all Israel scattered on the hills as sheep that have no shepherd, and Jehovah saith, These have no master; they turn back each to his house in peace.\'";
dby[17] = "And he said, I saw all Israel scattered upon the mountains, as sheep that have no shepherd. And Jehovah said, These have no master: let them return every man to his house in peace.";
web[17] = "And he said, I saw all Israel scattered upon the hills, as sheep that have not a shepherd: and the LORD said, These have no master: let them return every man to his house in peace.";
hnv[17] = "He said, I saw all Yisra\'el scattered on the mountains, as sheep that have no shepherd: and the LORD said, These have no master; let them return every man to his house in shalom.";
vul[17] = "et ille ait vidi cunctum Israhel dispersum in montibus quasi oves non habentes pastorem et ait Dominus non habent dominum isti revertatur unusquisque in domum suam in pace";
rsv[18] = "And the king of Israel said to Jehosh\'aphat, &quot;Did I not tell you that he would not prophesy good concerning me, but evil?&quot;";
asv[18] = "And the king of Israel said to Jehoshaphat, Did I not tell thee that he would not prophesy good concerning me, but evil?";
yng[18] = "And the king of Israel saith unto Jehoshaphat, `Have I not said unto thee, He doth not prophesy of me good, but evil?\'";
dby[18] = "And the king of Israel said to Jehoshaphat, Did I not tell thee that he prophesies no good concerning me, but evil?";
web[18] = "And the king of Israel said to Jehoshaphat, Did I not tell thee that he would prophesy no good concerning me, but evil?";
hnv[18] = "The king of Yisra\'el said to Yehoshafat, Didn\'t I tell you that he would not prophesy good concerning me, but evil?";
vul[18] = "dixit ergo rex Israhel ad Iosaphat numquid non dixi tibi quia non prophetat mihi bonum sed semper malum";
rsv[19] = "And Micai\'ah said, &quot;Therefore hear the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing beside him on his right hand and on his left;";
asv[19] = "And [Micaiah] said, Therefore hear thou the word of Jehovah: I saw Jehovah sitting on his throne, and all the host of heaven standing by him on his right hand and on his left.";
yng[19] = "And he saith, `Therefore, hear a word of Jehovah; I have seen Jehovah sitting on His throne, and all the host of the heavens standing by Him, on His right and on His left;";
dby[19] = "And he said, Hear therefore the word of Jehovah: I saw Jehovah sitting upon his throne, and all the host of heaven standing by him, on his right hand and on his left;";
web[19] = "And he said, Hear thou therefore the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left.";
hnv[19] = "[Mikhayahu] said, Therefore hear you the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left.";
vul[19] = "ille vero addens ait propterea audi sermonem Domini vidi Dominum sedentem super solium suum et omnem exercitum caeli adsistentem ei a dextris et a sinistris";
rsv[20] = "and the LORD said, \'Who will entice Ahab, that he may go up and fall at Ramoth-gilead?\' And one said one thing, and another said another.";
asv[20] = "And Jehovah said, Who shall entice Ahab, that he may go up and fall at Ramoth-gilead? And one said on this manner; and another said on that manner.";
yng[20] = "and Jehovah saith, Who doth entice Ahab, and he doth go up and fall in Ramoth-Gilead? and this one saith thus, and that one is saying thus.";
dby[20] = "and Jehovah said, Who shall entice Ahab that he may go up and fall at Ramoth-Gilead? And one said after this manner, and another said after that manner.";
web[20] = "And the LORD said, Who shall persuade Ahab, that he may go up and fall at Ramoth-gilead? And one said in this manner, and another said in that manner.";
hnv[20] = "The LORD said, Who shall entice Ach\'av, that he may go up and fall at Ramot-Gil`ad? One said on this manner; and another said on that manner.";
vul[20] = "et ait Dominus quis decipiet Ahab regem Israhel ut ascendat et cadat in Ramoth Galaad et dixit unus verba huiuscemodi et alius aliter";
rsv[21] = "Then a spirit came forward and stood before the LORD, saying, \'I will entice him.\'";
asv[21] = "And there came forth a spirit, and stood before Jehovah, and said, I will entice him.";
yng[21] = "`And the spirit goeth out, and standeth before Jehovah, and saith, I -- I do entice him; and Jehovah saith unto him, By what?";
dby[21] = "And there came forth a spirit, and stood before Jehovah, and said, I will entice him.";
web[21] = "And there came forth a spirit, and stood before the LORD, and said, I will persuade him.";
hnv[21] = "There came forth a spirit, and stood before the LORD, and said, I will entice him.";
vul[21] = "egressus est autem spiritus et stetit coram Domino et ait ego decipiam illum cui locutus est Dominus in quo";
rsv[22] = "And the LORD said to him, \'By what means?\' And he said, \'I will go forth, and will be a lying spirit in the mouth of all his prophets.\' And he said, \'You are to entice him, and you shall succeed; go forth and do so.\'";
asv[22] = "And Jehovah said unto him, Wherewith? And he said, I will go forth, and will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt entice him, and shalt prevail also: go forth, and do so.";
yng[22] = "and he saith, I go out, and have been a spirit of falsehood in the mouth of all his prophets; and He saith, Thou dost entice, and also thou art able; go out and do so.";
dby[22] = "And Jehovah said unto him, Wherewith? And he said, I will go forth, and will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt entice [him], and also succeed: go forth, and do so.";
web[22] = "And the LORD said to him, With what? And he said, I will go forth, and I will be a lying spirit in the mouth of all his prophets? And he said, Thou shalt persuade [him], and prevail also: go forth, and do so.";
hnv[22] = "The LORD said to him, \'How?\' He said, \'I will go forth, and will be a lying spirit in the mouth of all his prophets.\' He said, \'You shall entice him, and shall prevail also: go forth, and do so.\'";
vul[22] = "et ille ait egrediar et ero spiritus mendax in ore omnium prophetarum eius et dixit Dominus decipies et praevalebis egredere et fac ita";
rsv[23] = "Now therefore behold, the LORD has put a lying spirit in the mouth of all these your prophets; the LORD has spoken evil concerning you.&quot;";
asv[23] = "Now therefore, behold, Jehovah hath put a lying spirit in the mouth of all these thy prophets; and Jehovah hath spoken evil concerning thee.";
yng[23] = "And now, lo, Jehovah hath put a spirit of falsehood in the mouth of all these thy prophets, and Jehovah hath spoken concerning thee -- evil.\'";
dby[23] = "And now, behold, Jehovah has put a lying spirit in the mouth of all these thy prophets, and Jehovah has spoken evil concerning thee.";
web[23] = "Now therefore, behold, the LORD hath put a lying spirit in the mouth of all these thy prophets, and the LORD hath spoken evil concerning thee.";
hnv[23] = "Now therefore, behold, the LORD has put a lying spirit in the mouth of all these your prophets; and the LORD has spoken evil concerning you.";
vul[23] = "nunc igitur ecce dedit Dominus spiritum mendacii in ore omnium prophetarum tuorum qui hic sunt et Dominus locutus est contra te malum";
rsv[24] = "Then Zedeki\'ah the son of Chena\'anah came near and struck Micai\'ah on the cheek, and said, &quot;How did the Spirit of the LORD go from me to speak to you?&quot;";
asv[24] = "Then Zedekiah the son of Chenaanah came near, and smote Micaiah on the cheek, and said, Which way went the Spirit of Jehovah from me to speak unto thee?";
yng[24] = "And Zedekiah son of Chenaanah draweth nigh, and smiteth Micaiah on the cheek, and saith, `Where [is] this -- he hath passed over -- the Spirit of Jehovah -- from me to speak with thee?\'";
dby[24] = "Then Zedekiah the son of Chenaanah went near, and smote Micah upon the cheek, and said, Where now went the Spirit of Jehovah from me to speak to thee?";
web[24] = "But Zedekiah the son of Chenaanah went near, and smote Micaiah on the cheek, and said, Which way went the Spirit of the LORD from me to speak to thee?";
hnv[24] = "Then Tzidkiyahu the son of Kena`anah came near, and struck Mikhayahu on the cheek, and said, Which way went the Spirit of the LORD from me to speak to you?";
vul[24] = "accessit autem Sedecias filius Chanaan et percussit Micheam in maxillam et dixit mene ergo dimisit spiritus Domini et locutus est tibi";
rsv[25] = "And Micai\'ah said, &quot;Behold, you shall see on that day when you go into an inner chamber to hide yourself.&quot;";
asv[25] = "And Micaiah said, Behold, thou shalt see on that day, when thou shalt go into an inner chamber to hide thyself.";
yng[25] = "And Micaiah saith, `Lo, thou art seeing on that day, when thou goest in to the innermost chamber to be hidden.\'";
dby[25] = "And Micah said, Behold, thou shalt see on that day when thou shalt go from chamber to chamber to hide thyself.";
web[25] = "And Micaiah said, Behold, thou shalt see in that day, when thou shalt go into an inner chamber to hide thyself.";
hnv[25] = "Mikhayahu said, Behold, you shall see on that day, when you shall go into an inner chamber to hide yourself.";
vul[25] = "et ait Micheas visurus es in die illa quando ingredieris cubiculum intra cubiculum ut abscondaris";
rsv[26] = "And the king of Israel said, &quot;Seize Micai\'ah, and take him back to Amon the governor of the city and to Jo\'ash the king\'s son;";
asv[26] = "And the king of Israel said, Take Micaiah, and carry him back unto Amon the governor of the city, and to Joash the king\'s son;";
yng[26] = "And the king of Israel saith, `Take Micaiah, and turn him back unto Amon head of the city, and unto Joash son of the king,";
dby[26] = "And the king of Israel said, Take Micah and carry him back to Amon the governor of the city, and to Joash the king\'s son;";
web[26] = "And the king of Israel said, Take Micaiah, and carry him back to Amon the governor of the city, and to Joash the king\'s son;";
hnv[26] = "The king of Yisra\'el said, Take Mikhayahu, and carry him back to Amon the governor of the city, and to Yo\'ash the king\'s son;";
vul[26] = "et ait rex Israhel tollite Micheam et maneat apud Amon principem civitatis et apud Ioas filium Ammelech";
rsv[27] = "and say, \'Thus says the king, &quot;Put this fellow in prison, and feed him with scant fare of bread and water, until I come in peace.&quot;\'&quot;";
asv[27] = "and say, Thus saith the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I come in peace.";
yng[27] = "and thou hast said, Thus said the king, Place ye this one in the house of restraint, and cause him to eat bread of oppression, and water of oppression, till my coming in peace.\'";
dby[27] = "and thou shalt say, Thus says the king: Put this [man] in the prison, and feed him with bread of affliction and with water of affliction, until I come in peace.";
web[27] = "And say, Thus saith the king, Put this [man] in the prison, and feed him with bread of affliction, and with water of affliction, until I come in peace.";
hnv[27] = " and say, Thus says the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I come in shalom.";
vul[27] = "et dicite eis haec dicit rex mittite virum istum in carcerem et sustentate eum pane tribulationis et aqua angustiae donec revertar in pace";
rsv[28] = "And Micai\'ah said, &quot;If you return in peace, the LORD has not spoken by me.&quot; And he said, &quot;Hear, all you peoples!&quot;";
asv[28] = "And Micaiah said, If thou return at all in peace, Jehovah hath not spoken by me. And he said, Hear, ye peoples, all of you.";
yng[28] = "And Micaiah saith, `If thou at all return in peace -- Jehovah hath not spoken by me;\' and he saith, `Hear, O peoples, all of them.\'";
dby[28] = "And Micah said, If thou return at all in peace, Jehovah has not spoken by me. And he said, Hearken, O peoples, all of you!";
web[28] = "And Micaiah said, If thou shalt return at all in peace, the LORD hath not spoken by me. And he said, Hearken, O people, every one of you.";
hnv[28] = "Mikhayahu said, If you return at all in shalom, the LORD has not spoken by me. He said, Hear, you peoples, all of you.";
vul[28] = "dixitque Micheas si reversus fueris in pace non est locutus Dominus in me et ait audite populi omnes";
rsv[29] = "So the king of Israel and Jehosh\'aphat the king of Judah went up to Ramoth-gilead.";
asv[29] = "So the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-gilead.";
yng[29] = "And the king of Israel goeth up, and Jehoshaphat king of Judah, to Ramoth-Gilead.";
dby[29] = "And the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-Gilead.";
web[29] = "So the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-gilead.";
hnv[29] = "So the king of Yisra\'el and Yehoshafat the king of Yehudah went up to Ramot-Gil`ad.";
vul[29] = "ascendit itaque rex Israhel et Iosaphat rex Iuda in Ramoth Galaad";
rsv[30] = "And the king of Israel said to Jehosh\'aphat, &quot;I will disguise myself and go into battle, but you wear your robes.&quot; And the king of Israel disguised himself and went into battle.";
asv[30] = "And the king of Israel said unto Jehoshaphat, I will disguise myself, and go into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle.";
yng[30] = "And the king of Israel saith unto Jehoshaphat to disguise himself, and to go into battle, `And thou, put on thy garments.\' And the king of Israel disguiseth himself, and goeth into battle.";
dby[30] = "And the king of Israel said to Jehoshaphat, I will disguise myself, and will enter into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle.";
web[30] = "And the king of Israel said to Jehoshaphat, I will disguise myself, and enter into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle.";
hnv[30] = "The king of Yisra\'el said to Yehoshafat, I will disguise myself, and go into the battle; but put you on your robes. The king of Yisra\'el disguised himself, and went into the battle.";
vul[30] = "dixitque rex Israhel ad Iosaphat sume arma et ingredere proelium et induere vestibus tuis porro rex Israhel mutavit habitum et ingressus est bellum";
rsv[31] = "Now the king of Syria had commanded the thirty-two captains of his chariots, &quot;Fight with neither small nor great, but only with the king of Israel.&quot;";
asv[31] = "Now the king of Syria had commanded the thirty and two captains of his chariots, saying, Fight neither with small nor great, save only with the king of Israel.";
yng[31] = "And the king of Aram commanded the heads of the charioteers whom he hath -- thirty and two -- saying, `Ye do not fight with small or with great, but with the king of Israel by himself.\'";
dby[31] = "And the king of Syria commanded the thirty-two captains of his chariots saying, Fight neither with small nor great, but with the king of Israel only.";
