csb[1] = "The queen of Sheba heard about Solomon\'s fame connected with the name of the LORD and came to test him with riddles.";
csb[2] = "She came to Jerusalem with a very large entourage, with camels bearing spices, gold in great abundance, and precious stones. She came to Solomon and spoke to him about everything that was on her mind.";
csb[3] = "So Solomon answered all her questions; nothing was too difficult for the king to explain to her.";
csb[4] = "When the queen of Sheba observed all of Solomon\'s wisdom, the palace he had built,";
csb[5] = "the food at his table, his servants\' residence, his attendants\' service and their attire, his cupbearers, and the burnt offerings he offered at the LORD\'s temple, it took her breath away.";
csb[6] = "She said to the king, &quot;The report I heard in my own country about your words and about your wisdom is true.";
csb[7] = "&quot;But I didn\'t believe the reports until I came and saw with my own eyes. Indeed, I was not even told half. Your wisdom and prosperity far exceed the report I heard.";
csb[8] = "&quot;How happy are your men. How happy are these servants of yours, who always stand in your presence hearing your wisdom.";
csb[9] = "&quot;Blessed be the LORD your God! He delighted in you and put you on the throne of Israel, because of the LORD\'s eternal love for Israel. He has made you king to carry out justice and righteousness.&quot;";
csb[10] = "Then she gave the king four and a half tons of gold, a great quantity of spices, and precious stones. Never again did such a quantity of spices arrive as those the queen of Sheba gave to King Solomon.";
csb[11] = "In addition, Hiram\'s fleet that carried gold from Ophir brought from Ophir a large quantity of almug wood and precious stones.";
csb[12] = "The king made the almug wood into steps for the LORD\'s temple and the king\'s palace and into lyres and harps for the singers. Never before did such almug wood arrive, and the like has not been seen again.";
csb[13] = "King Solomon gave the queen of Sheba her every desire -- whatever she asked -- besides what he had given her out of his royal bounty. Then she, along with her servants, returned to her own country.";
csb[14] = "The weight of gold that came to Solomon annually was twenty-five tons,";
csb[15] = "besides what came from merchants, traders\' merchandise, and all the Arabian kings and governors of the land.";
csb[16] = "King Solomon made two hundred large shields of hammered gold; fifteen pounds of gold went into each shield.";
csb[17] = "He made three hundred small shields of hammered gold; nearly four pounds of gold went into each shield. The king put them in the House of the Forest of Lebanon.";
csb[18] = "The king also made a large ivory throne and overlaid it with fine gold.";
csb[19] = "The throne had six steps; there was a rounded top at the back of the throne, armrests on either side of the seat, and two lions standing beside the armrests.";
csb[20] = "Twelve lions were standing there on the six steps, one at each end. Nothing like it had ever been made in any other kingdom.";
csb[21] = "All of King Solomon\'s drinking cups were gold, and all the utensils of the House of the Forest of Lebanon were pure gold. There was no silver, since it was considered as nothing in Solomon\'s time,";
csb[22] = "for the king had ships of Tarshish at sea with Hiram\'s fleet, and once every three years the ships of Tarshish would arrive bearing gold, silver, ivory, apes, and peacocks.";
csb[23] = "King Solomon surpassed all the kings of the world in riches and in wisdom.";
csb[24] = "The whole world wanted an audience with Solomon to hear the wisdom that God had put in his heart.";
csb[25] = "Every man would bring his annual tribute: items of silver and gold, clothing, weapons, spices, and horses and mules.";
csb[26] = "Solomon accumulated 1,400 chariots and 12,000 horsemen and stationed them in the chariot cities and with the king in Jerusalem.";
csb[27] = "The king made silver as common in Jerusalem as stones, and he made cedar as abundant as sycamore in the Judean foothills.";
csb[28] = "Solomon\'s horses were imported from Egypt and Kue. The king\'s traders bought them from Kue at the going price.";
csb[29] = "A chariot was imported from Egypt for fifteen pounds of silver, and a horse for nearly four pounds. In the same way, they exported them to all the kings of the Hittites and to the kings of Aram through their agents.";

yng[19] = "six steps hath the throne, and a round top [is] to the throne behind it, and hands [are] on this [side] and on that, unto the place of the sitting, and two lions are standing near the hands,";
dby[19] = "the throne had six steps, and the top of the throne was rounded behind; and there were arms on each side at the place of the seat, and two lions stood beside the arms;";
web[19] = "The throne had six steps, and the top of the throne [was] round behind: and [there were] stays on either side on the place of the seat, and two lions stood beside the stays.";
hnv[19] = "There were six steps to the throne, and the top of the throne was round behind; and there were stays on either side by the place of the seat, and two lions standing beside the stays.";
vul[19] = "qui habebat sex gradus et summitas throni rotunda erat in parte posteriori et duae manus hinc atque inde tenentes sedile et duo leones stabant iuxta manus singulas";
kjv[20] = "And twelve lions stood there on the one side and on the other upon the six steps: there was not the like made in any kingdom.";
rsv[20] = "while twelve lions stood there, one on each end of a step on the six steps. The like of it was never made in any kingdom.";
asv[20] = "And twelve lions stood there on the one side and on the other upon the six steps: there was not the like made in any kingdom.";
yng[20] = "and twelve lions are standing there on the six steps, on this [side] and on that; it hath not been made so for any kingdom.";
dby[20] = "and twelve lions stood there on the one side and on the other upon the six steps: there was not the like made in any kingdom.";
web[20] = "And twelve lions stood there on the one side and on the other upon the six steps: there was not the like made in any kingdom.";
hnv[20] = "Twelve lions stood there on the one side and on the other on the six steps: there was nothing like it made in any kingdom.";
vul[20] = "et duodecim leunculi stantes super sex gradus hinc atque inde non est factum tale opus in universis regnis";
kjv[21] = "And all king Solomon\'s drinking vessels [were of] gold, and all the vessels of the house of the forest of Lebanon [were of] pure gold; none [were of] silver: it was nothing accounted of in the days of Solomon.";
rsv[21] = "All King Solomon\'s drinking vessels were of gold, and all the vessels of the House of the Forest of Lebanon were of pure gold; none were of silver, it was not considered as anything in the days of Solomon.";
asv[21] = "And all king Solomon\'s drinking vessels were of gold, and all the vessels of the house of the forest of Lebanon were of pure gold: none were of silver; it was nothing accounted of in the days of Solomon.";
yng[21] = "And all the drinking vessels of king Solomon [are] of gold, and all the vessels of the house of the forest of Lebanon [are] of refined gold -- there are none of silver; it was not reckoned in the days of Solomon for anything,";
dby[21] = "And all king Solomon\'s drinking vessels were of gold, and all the vessels of the house of the forest of Lebanon were of precious gold: none were of silver, [which] was not of the least account in the days of Solomon.";
web[21] = "And all king Solomon\'s drinking vessels [were of] gold, and all the vessels of the house of the forest of Lebanon [were of] pure gold; none [were of] silver: it was nothing accounted of in the days of Solomon.";
hnv[21] = " All king Shlomo\'s drinking vessels were of gold, and all the vessels of the house of the forest of Levanon were of pure gold: none were of silver; it was nothing accounted of in the days of Shlomo.";
vul[21] = "sed et omnia vasa de quibus potabat rex Salomon erant aurea et universa supellex domus saltus Libani de auro purissimo non erat argentum nec alicuius pretii putabatur in diebus Salomonis";
kjv[22] = "For the king had at sea a navy of Tharshish with the navy of Hiram: once in three years came the navy of Tharshish, bringing gold, and silver, ivory, and apes, and peacocks.";
rsv[22] = "For the king had a fleet of ships of Tarshish at sea with the fleet of Hiram. Once every three years the fleet of ships of Tarshish used to come bringing gold, silver, ivory, apes, and peacocks.";
asv[22] = "For the king had at sea a navy of Tarshish with the navy of Hiram: once every three years came the navy of Tarshish, bringing gold, and silver, ivory, and apes, and peacocks.";
yng[22] = "for a navy of Tarshish hath the king at sea with a navy of Hiram; once in three years cometh the navy of Tarshish, bearing gold, and silver, ivory, and apes, and peacocks.";
dby[22] = "For the king had on the sea a Tarshish-fleet, with the fleet of Hiram: once in three years came the Tarshish-fleet, bringing gold and silver, ivory, and apes, and peacocks.";
web[22] = "For the king had at sea a navy of Tharshish with the navy of Hiram: once in three years came the navy of Tharshish, bringing gold, and silver, ivory, and apes, and peacocks.";
hnv[22] = "For the king had at sea a navy of Tarshish with the navy of Hiram: once every three years came the navy of Tarshish, bringing gold, and silver, ivory, and apes, and peacocks.";
vul[22] = "quia classis regis per mare cum classe Hiram semel per tres annos ibat in Tharsis deferens inde aurum et argentum dentes elefantorum et simias et pavos";
kjv[23] = "So king Solomon exceeded all the kings of the earth for riches and for wisdom.";
rsv[23] = "Thus King Solomon excelled all the kings of the earth in riches and in wisdom.";
asv[23] = "So king Solomon exceeded all the kings of the earth in riches and in wisdom.";
yng[23] = "And king Solomon is greater than any of the kings of the earth for riches and for wisdom,";
dby[23] = "And king Solomon was greater than all the kings of the earth in riches and in wisdom.";
web[23] = "So king Solomon exceeded all the kings of the earth for riches and for wisdom.";
hnv[23] = "So king Shlomo exceeded all the kings of the eretz in riches and in wisdom.";
vul[23] = "magnificatus est ergo rex Salomon super omnes reges terrae divitiis et sapientia";
kjv[24] = "And all the earth sought to Solomon, to hear his wisdom, which God had put in his heart.";
rsv[24] = "And the whole earth sought the presence of Solomon to hear his wisdom, which God had put into his mind.";
asv[24] = "And all the earth sought the presence of Solomon, to hear his wisdom, which God had put in his heart.";
yng[24] = "and all the earth is seeking the presence of Solomon, to hear his wisdom that God hath put into his heart,";
dby[24] = "And all the earth sought the presence of Solomon, to hear his wisdom, which God had put in his heart.";
web[24] = "And all the earth sought to Solomon, to hear his wisdom, which God had put in his heart.";
hnv[24] = "All the eretz sought the presence of Shlomo, to hear his wisdom, which God had put in his heart.";
vul[24] = "et universa terra desiderabat vultum Salomonis ut audiret sapientiam eius quam dederat Deus in corde eius";
kjv[25] = "And they brought every man his present, vessels of silver, and vessels of gold, and garments, and armour, and spices, horses, and mules, a rate year by year.";
rsv[25] = "Every one of them brought his present, articles of silver and gold, garments, myrrh, spices, horses, and mules, so much year by year.";
asv[25] = "And they brought every man his tribute, vessels of silver, and vessels of gold, and raiment, and armor, and spices, horses, and mules, a rate year by year.";
yng[25] = "and they are bringing each his present, vessels of silver, and vessels of gold, and garments, and armour, and spices, horses, and mules, the matter of a year in a year.";
dby[25] = "And they brought every man his present, vessels of silver, and vessels of gold, and clothing, and armour, and spices, horses and mules, a rate year by year.";
web[25] = "And they brought every man his present, vessels of silver, and vessels of gold, and garments, and armor, and spices, horses, and mules, a rate year by year.";
hnv[25] = "They brought every man his tribute, vessels of silver, and vessels of gold, and clothing, and armor, and spices, horses, and mules, a rate year by year.";
vul[25] = "et singuli deferebant ei munera vasa argentea et aurea vestes et arma bellica aromata quoque et equos et mulos per annos singulos";
kjv[26] = "And Solomon gathered together chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, whom he bestowed in the cities for chariots, and with the king at Jerusalem.";
rsv[26] = "And Solomon gathered together chariots and horsemen; he had fourteen hundred chariots and twelve thousand horsemen, whom he stationed in the chariot cities and with the king in Jerusalem.";
asv[26] = "And Solomon gathered together chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, that he bestowed in the chariot cities, and with the king at Jerusalem.";
yng[26] = "And Solomon gathereth chariots, and horsemen, and he hath a thousand and four hundred chariots, and twelve thousand horsemen, and he placeth them in the cities of the chariot, and with the king in Jerusalem.";
dby[26] = "And Solomon gathered chariots and horsemen; and he had a thousand four hundred chariots, and twelve thousand horsemen; and he placed them in the chariot-cities, and with the king at Jerusalem.";
web[26] = "And Solomon collected chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, whom he bestowed in the cities for chariots, and with the king at Jerusalem.";
hnv[26] = "Shlomo gathered together chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, that he bestowed in the chariot cities, and with the king at Yerushalayim.";
vul[26] = "congregavitque Salomon currus et equites et facti sunt ei mille quadringenti currus et duodecim milia equitum et disposuit eos per civitates munitas et cum rege in Hierusalem";
kjv[27] = "And the king made silver [to be] in Jerusalem as stones, and cedars made he [to be] as the sycomore trees that [are] in the vale, for abundance.";
rsv[27] = "And the king made silver as common in Jerusalem as stone, and he made cedar as plentiful as the sycamore of the Shephe\'lah.";
asv[27] = "And the king made silver to be in Jerusalem as stones, and cedars made he to be as the sycomore-trees that are in the lowland, for abundance.";
yng[27] = "And the king maketh the silver in Jerusalem as stones, and the cedars he hath made as the sycamores that [are] in the low country, for abundance.";
dby[27] = "And the king made silver in Jerusalem as stones, and cedars made he as the sycamores that are in the lowland for abundance.";
web[27] = "And the king made silver [to be] in Jerusalem as stones, and cedars he made [to be] as the sycamore trees that [are] in the vale, for abundance.";
hnv[27] = "The king made silver to be in Yerushalayim as stones, and cedars made he to be as the sycamore trees that are in the lowland, for abundance.";
vul[27] = "fecitque ut tanta esset abundantia argenti in Hierusalem quanta lapidum et cedrorum praebuit multitudinem quasi sycomoros quae nascuntur in campestribus";
kjv[28] = "And Solomon had horses brought out of Egypt, and linen yarn: the king\'s merchants received the linen yarn at a price.";
rsv[28] = "And Solomon\'s import of horses was from Egypt and Ku\'e, and the king\'s traders received them from Ku\'e at a price.";
asv[28] = "And the horses which Solomon had were brought out of Egypt; and the king\'s merchants received them in droves, each drove at a price.";
yng[28] = "And the outgoing of the horses that king Solomon hath [is] from Egypt, and from Keveh; merchants of the king take from Keveh at a price;";
dby[28] = "And the exportation of horses that Solomon had was from Egypt: a caravan of the king\'s merchants fetched a drove [of horses], at a price.";
web[28] = "And Solomon had horses brought from Egypt, and linen yarn: the king\'s merchants received the linen yarn at a price.";
hnv[28] = "The horses which Shlomo had were brought out of Mitzrayim; and the king\'s merchants received them in droves, each drove at a price.";
vul[28] = "et educebantur equi Salomoni de Aegypto et de Coa negotiatores enim regis emebant de Coa et statuto pretio perducebant";
kjv[29] = "And a chariot came up and went out of Egypt for six hundred [shekels] of silver, and an horse for an hundred and fifty: and so for all the kings of the Hittites, and for the kings of Syria, did they bring [them] out by their means.";
rsv[29] = "A chariot could be imported from Egypt for six hundred shekels of silver, and a horse for a hundred and fifty; and so through the king\'s traders they were exported to all the kings of the Hittites and the kings of Syria.";
asv[29] = "And a chariot came up and went out of Egypt for six hundred [shekels] of silver, and a horse for a hundred and fifty; and so for all the kings of the Hittites, and for the kings of Syria, did they bring them out by their means.";
yng[29] = "and a chariot cometh up and cometh out of Egypt for six hundred silverlings, and a horse for fifty and a hundred, and so for all the kings of the Hittites, and for the kings of Aram; by their hand they bring out.";
dby[29] = "And a chariot came up and went out of Egypt for six hundred [shekels] of silver, and a horse for a hundred and fifty; and so they brought [them] by their means, for all the kings of the Hittites and for the kings of Syria.";
web[29] = "And a chariot came up and went out of Egypt for six hundred [shekels] of silver, and a horse for a hundred and fifty: and so for all the kings of the Hittites, and for the kings of Syria, did they bring [them] out by their means.";
hnv[29] = "A chariot came up and went out of Mitzrayim for six hundred [shekels] of silver, and a horse for one hundred fifty; and so for all the kings of the Hitti, and for the kings of Aram, did they bring them out by their means.";
vul[29] = "egrediebatur autem quadriga ex Aegypto sescentis siclis argenti et equus centum quinquaginta atque in hunc modum cuncti reges Hettheorum et Syriae equos venundabant";
