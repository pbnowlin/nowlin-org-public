yng[46] = "`When they sin against Thee (for there is not a man who sinneth not), and Thou hast been angry with them, and hast given them up before an enemy, and they have taken captive their captivity unto the land of the enemy far off or near;";
dby[46] = "If they have sinned against thee, (for there is no man that sinneth not,) and thou be angry with them, and give them up to the enemy, and they have carried them away captives unto the enemy\'s land, far or near;";
web[46] = "If they shall sin against thee, (for [there is] no man that sinneth not,) and thou shalt be angry with them, and deliver them to the enemy, so that they carry them away captives to the land of the enemy, far or near;";
hnv[46] = "If they sin against you (for there is no man who doesn\'t sin), and you are angry with them, and deliver them to the enemy, so that they carry them away captive to the land of the enemy, far off or near;";
vul[46] = "quod si peccaverint tibi non est enim homo qui non peccet et iratus tradideris eos inimicis suis et capti ducti fuerint in terram inimicorum longe vel prope";
rsv[47] = "yet if they lay it to heart in the land to which they have been carried captive, and repent, and make supplication to thee in the land of their captors, saying, \'We have sinned, and have acted perversely and wickedly\';";
asv[47] = "yet if they shall bethink themselves in the land whither they are carried captive, and turn again, and make supplication unto thee in the land of them that carried them captive, saying, We have sinned, and have done perversely, we have dealt wickedly;";
yng[47] = "and they have turned [it] back unto their heart in the land whither they have been taken captive, and have turned back, and made supplication unto Thee, in the land of their captors, saying, We have sinned and done perversely -- we have done wickedly;";
dby[47] = "and if they shall take it to heart in the land whither they were carried captive, and repent, and make supplication unto thee in the land of them that carried them captive, saying, We have sinned, and have done iniquity, we have dealt perversely;";
web[47] = "[Yet] if they shall bethink themselves in the land whither they were carried captives, and repent and make supplication to thee in the land of them that carried them captives, saying, We have sinned, and have done perversely, we have committed wickedness;";
hnv[47] = "yet if they shall repent themselves in the land where they are carried captive, and turn again, and make supplication to you in the land of those who carried them captive, saying, We have sinned, and have done perversely, we have dealt wickedly;";
vul[47] = "et egerint paenitentiam in corde suo in loco captivitatis et conversi deprecati te fuerint in captivitate sua dicentes peccavimus inique egimus impie gessimus";
rsv[48] = "if they repent with all their mind and with all their heart in the land of their enemies, who carried them captive, and pray to thee toward their land, which thou gavest to their fathers, the city which thou hast chosen, and the house which I have built for thy name;";
asv[48] = "if they return unto thee with all their heart and with all their soul in the land of their enemies, who carried them captive, and pray unto thee toward their land, which thou gavest unto their fathers, the city which thou hast chosen, and the house which I have built for thy name:";
yng[48] = "yea, they have turned back unto Thee, with all their heart, and with all their soul, in the land of their enemies who have taken them captive, and have prayed unto Thee the way of their land, which Thou gavest to their fathers, the city which Thou hast chosen, and the house which I have builded for Thy name:";
dby[48] = "and if they return unto thee with all their heart and with all their soul, in the land of their enemies who led them away captive, and pray unto thee toward their land which thou gavest unto their fathers, the city that thou hast chosen, and the house that I have built unto thy name;";
web[48] = "And [so] return to thee with all their heart, and with all their soul, in the land of their enemies, who led them away captive, and pray to thee towards their land, which thou gavest to their fathers, the city which thou hast chosen, and the house which I have built for thy name:";
hnv[48] = "if they return to you with all their heart and with all their soul in the land of their enemies, who carried them captive, and pray to you toward their land, which you gave to their fathers, the city which you have chosen, and the house which I have built for your name:";
vul[48] = "et reversi fuerint ad te in universo corde suo et tota anima sua in terra inimicorum suorum ad quam captivi ducti sunt et oraverint te contra viam terrae suae quam dedisti patribus eorum et civitatis quam elegisti et templi quod aedificavi nomini tuo";
rsv[49] = "then hear thou in heaven thy dwelling place their prayer and their supplication, and maintain their cause";
asv[49] = "then hear thou their prayer and their supplication in heaven thy dwelling-place, and maintain their cause;";
yng[49] = "`Then Thou hast heard in the heavens, the settled place of Thy dwelling, their prayer and their supplication, and hast maintained their cause,";
dby[49] = "then hear thou in the heavens, the settled place of thy dwelling, their prayer and their supplication, and maintain their right;";
web[49] = "Then hear thou their prayer and their supplication in heaven thy dwelling-place, and maintain their cause,";
hnv[49] = "then hear you their prayer and their supplication in heaven, your dwelling-place, and maintain their cause;";
vul[49] = "exaudies in caelo in firmamento solii tui orationem eorum et preces et facies iudicium eorum";
rsv[50] = "and forgive thy people who have sinned against thee, and all their transgressions which they have committed against thee; and grant them compassion in the sight of those who carried them captive, that they may have compassion on them";
asv[50] = "and forgive thy people who have sinned against thee, and all their transgressions wherein they have transgressed against thee; and give them compassion before those who carried them captive, that they may have compassion on them";
yng[50] = "and hast forgiven Thy people who have sinned against Thee, even all their transgressions which they have transgressed against Thee, and hast given them mercies before their captors, and they have had mercy [on] them --";
dby[50] = "and forgive thy people their sin against thee, and all their transgressions whereby they have transgressed against thee, and give them to find compassion with those who carried them captive, that they may have compassion on them";
web[50] = "And forgive thy people that have sinned against thee, and all their transgressions in which they have transgressed against thee, and give them compassion before them who carried them captive, that they may have compassion on them:";
hnv[50] = "and forgive your people who have sinned against you, and all their transgressions in which they have transgressed against you; and give them compassion before those who carried them captive, that they may have compassion on them";
vul[50] = "et propitiaberis populo tuo qui peccavit tibi et omnibus iniquitatibus eorum quibus praevaricati sunt in te et dabis misericordiam coram eis qui eos captivos habuerint ut misereantur eis";
rsv[51] = "(for they are thy people, and thy heritage, which thou didst bring out of Egypt, from the midst of the iron furnace).";
asv[51] = "(for they are thy people, and thine inheritance, which thou broughtest forth out of Egypt, from the midst of the furnace of iron);";
yng[51] = "(for Thy people and Thy inheritance [are] they, whom Thou didst bring out of Egypt, out of the midst of the furnace of iron) --";
dby[51] = "(for they are thy people, and thine inheritance, which thou broughtest forth out of Egypt, from the midst of the furnace of iron) --";
web[51] = "For they [are] thy people, and thy inheritance, which thou broughtest out of Egypt, from the midst of the furnace of iron:";
hnv[51] = "(for they are your people, and your inheritance, which you brought forth out of Mitzrayim, from the midst of the furnace of iron);";
vul[51] = "populus enim tuus est et hereditas tua quos eduxisti de terra Aegypti de medio fornacis ferreae";
rsv[52] = "Let thy eyes be open to the supplication of thy servant, and to the supplication of thy people Israel, giving ear to them whenever they call to thee.";
asv[52] = "that thine eyes may be open unto the supplication of thy servant, and unto the supplication of thy people Israel, to hearken unto them whensoever they cry unto thee.";
yng[52] = "for Thine eyes being open unto the supplication of Thy servant, and unto the supplication of Thy people Israel, to hearken unto them in all they call unto Thee for;";
dby[52] = "thine eyes being open unto the supplication of thy servant, and unto the supplication of thy people Israel, to hearken unto them in all that they call for unto thee.";
web[52] = "That thy eyes may be open to the supplication of thy servant, and to the supplication of thy people Israel, to hearken to them in all their supplications to thee.";
hnv[52] = "that your eyes may be open to the supplication of your servant, and to the supplication of your people Yisra\'el, to listen to them whenever they cry to you.";
vul[52] = "ut sint oculi tui aperti ad deprecationem servi tui et populi tui Israhel et exaudias eos in universis pro quibus invocaverint te";
rsv[53] = "For thou didst separate them from among all the peoples of the earth, to be thy heritage, as thou didst declare through Moses, thy servant, when thou didst bring our fathers out of Egypt, O Lord GOD.&quot;";
asv[53] = "For thou didst separate them from among all the peoples of the earth, to be thine inheritance, as thou spakest by Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord Jehovah.";
yng[53] = "for Thou hast separated them to Thyself for an inheritance, out of all the peoples of the earth, as Thou didst speak by the hand of Moses Thy servant, in Thy bringing out our fathers from Egypt, O Lord Jehovah.\'";
dby[53] = "For thou hast separated them from among all peoples of the earth, to be thine inheritance, as thou spokest through Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord Jehovah.";
web[53] = "For thou didst separate them from among all the people of the earth, [to be] thy inheritance, as thou didst speak by the hand of Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord GOD.";
hnv[53] = "For you did separate them from among all the peoples of the eretz, to be your inheritance, as you spoke by Moshe your servant, when you brought our fathers out of Mitzrayim, Lord GOD.";
vul[53] = "tu enim separasti eos tibi in hereditatem de universis populis terrae sicut locutus es per Mosen servum tuum quando eduxisti patres nostros de Aegypto Domine Deus";
rsv[54] = "Now as Solomon finished offering all this prayer and supplication to the LORD, he arose from before the altar of the LORD, where he had knelt with hands outstretched toward heaven;";
asv[54] = "And it was so, that, when Solomon had made an end of praying all this prayer and supplication unto Jehovah, he arose from before the altar of Jehovah, from kneeling on his knees with his hands spread forth toward heaven.";
yng[54] = "And it cometh to pass, at Solomon\'s finishing to pray unto Jehovah all this prayer and supplication, he hath risen from before the altar of Jehovah, from bending on his knees, and his hands spread out to the heavens,";
dby[54] = "And it was so, that when Solomon had ended praying all this prayer and supplication to Jehovah, he arose from before the altar of Jehovah, from kneeling on his knees with his hands spread forth to the heavens,";
web[54] = "And it was [so], that when Solomon had made an end of praying all this prayer and supplication to the LORD, he arose from before the altar of the LORD, from kneeling on his knees, with his hands spread up to heaven.";
hnv[54] = "It was so, that when Shlomo had made an end of praying all this prayer and supplication to the LORD, he arose from before the altar of the LORD, from kneeling on his knees with his hands spread forth toward heaven.";
vul[54] = "factum est autem cum conplesset Salomon orans Dominum omnem orationem et deprecationem hanc surrexit de conspectu altaris Domini utrumque enim genu in terram fixerat et manus expanderat ad caelum";
rsv[55] = "and he stood, and blessed all the assembly of Israel with a loud voice, saying,";
asv[55] = "And he stood, and blessed all the assembly of Israel with a loud voice, saying,";
yng[55] = "and he standeth and blesseth all the assembly of Israel [with] a loud voice, saying,";
dby[55] = "and he stood and blessed the whole congregation of Israel with a loud voice, saying,";
web[55] = "And he stood, and blessed all the congregation of Israel with a loud voice, saying,";
hnv[55] = "He stood, and blessed all the assembly of Yisra\'el with a loud voice, saying,";
vul[55] = "stetit ergo et benedixit omni ecclesiae Israhel voce magna dicens";
rsv[56] = "&quot;Blessed be the LORD who has given rest to his people Israel, according to all that he promised; not one word has failed of all his good promise, which he uttered by Moses his servant.";
asv[56] = "Blessed be Jehovah, that hath given rest unto his people Israel, according to all that he promised: there hath not failed one word of all his good promise, which he promised by Moses his servant.";
yng[56] = "`Blessed [is] Jehovah who hath given rest to His people Israel, according to all that He hath spoken; there hath not fallen one word of all His good word, which He spake by the hand of Moses his servant.";
dby[56] = "Blessed be Jehovah, who has given rest to his people Israel, according to all that he promised: there has not failed one word of all his good promises which he spoke through Moses his servant!";
web[56] = "Blessed [be] the LORD, that hath given rest to his people Israel, according to all that he promised: there hath not failed one word of all his good promise, which he promised by the hand of Moses his servant.";
hnv[56] = " Blessed be the LORD, who has given rest to his people Yisra\'el, according to all that he promised: there has not failed one word of all his good promise, which he promised by Moshe his servant.";
vul[56] = "benedictus Dominus qui dedit requiem populo suo Israhel iuxta omnia quae locutus est non cecidit ne unus quidem sermo ex omnibus bonis quae locutus est per Mosen servum suum";
rsv[57] = "The LORD our God be with us, as he was with our fathers; may he not leave us or forsake us;";
asv[57] = "Jehovah our God be with us, as he was with our fathers: let him not leave us, nor forsake us;";
yng[57] = "`Jehovah our God is with us as He hath been with our fathers; He doth not forsake us nor leave us;";
dby[57] = "Jehovah our God be with us, as he was with our fathers; let him not forsake us nor cast us off:";
web[57] = "The LORD our God be with us, as he was with our fathers: let him not leave us, nor forsake us:";
hnv[57] = "The LORD our God be with us, as he was with our fathers: let him not leave us, nor forsake us;";
vul[57] = "sit Dominus Deus noster nobiscum sicut fuit cum patribus nostris non derelinquens nos neque proiciens";
rsv[58] = "that he may incline our hearts to him, to walk in all his ways, and to keep his commandments, his statutes, and his ordinances, which he commanded our fathers.";
asv[58] = "that he may incline our hearts unto him, to walk in all his ways, and to keep his commandments, and his statutes, and his ordinances, which he commanded our fathers.";
yng[58] = "to incline our heart unto Himself, to walk in all His ways, and to keep His commands, and His statutes, and His judgments, which He commanded our fathers;";
dby[58] = "that he may incline our hearts to him, to walk in all his ways, and to keep his commandments and his statutes and his ordinances, which he commanded our fathers.";
web[58] = "That he may incline our hearts to him, to walk in all his ways, and to keep his commandments, and his statutes, and his judgments, which he commanded our fathers.";
hnv[58] = "that he may incline our hearts to him, to walk in all his ways, and to keep his mitzvot, and his statutes, and his ordinances, which he commanded our fathers.";
vul[58] = "sed inclinet corda nostra ad se ut ambulemus in universis viis eius et custodiamus mandata eius et caerimonias et iudicia quaecumque mandavit patribus nostris";
rsv[59] = "Let these words of mine, wherewith I have made supplication before the LORD, be near to the LORD our God day and night, and may he maintain the cause of his servant, and the cause of his people Israel, as each day requires;";
asv[59] = "And let these my words, wherewith I have made supplication before Jehovah, be nigh unto Jehovah our God day and night, that he maintain the cause of his servant, and the cause of his people Israel, as every day shall require;";
yng[59] = "and these my words with which I have made supplication before Jehovah, are near unto Jehovah our God by day and by night, to maintain the cause of His servant, and the cause of His people Israel, the matter of a day in its day;";
dby[59] = "And let these my words, with which I have made supplication before Jehovah, be nigh to Jehovah our God day and night, that he maintain the right of his servant, and the right of his people Israel, as the matter of each day shall require;";
web[59] = "And let these my words with which I have made supplication before the LORD, be nigh to the LORD our God day and night, that he may maintain the cause of his servant, and the cause of his people Israel at all times, as the matter shall require:";
hnv[59] = "Let these my words, with which I have made supplication before the LORD, be near to the LORD our God day and night, that he maintain the cause of his servant, and the cause of his people Yisra\'el, as every day shall require;";
vul[59] = "et sint sermones mei isti quibus deprecatus sum coram Domino adpropinquantes Domino Deo nostro die et nocte ut faciat iudicium servo suo et populo suo Israhel per singulos dies";
rsv[60] = "that all the peoples of the earth may know that the LORD is God; there is no other.";
asv[60] = "that all the peoples of the earth may know that Jehovah, he is God; there is none else.";
yng[60] = "for all the peoples of the earth knowing that Jehovah, He [is] God; there is none else;";
dby[60] = "that all peoples of the earth may know that Jehovah is God, that there is none else;";
web[60] = "That all the people of the earth may know, that the LORD [is] God, [and that there is] none else.";
hnv[60] = "that all the peoples of the eretz may know that the LORD, he is God; there is none else.";
vul[60] = "et sciant omnes populi terrae quia Dominus ipse est Deus et non est ultra absque eo";
rsv[61] = "Let your heart therefore be wholly true to the LORD our God, walking in his statutes and keeping his commandments, as at this day.&quot;";
asv[61] = "Let your heart therefore be perfect with Jehovah our God, to walk in his statutes, and to keep his commandments, as at this day.";
yng[61] = "and your heart hath been perfect with Jehovah our God, to walk in His statutes, and to keep His commands, as [at] this day.\'";
dby[61] = "and that your heart may be perfect with Jehovah our God, to walk in his statutes and to keep his commandments, as at this day.";
web[61] = "Let your heart therefore be perfect with the LORD our God, to walk in his statutes, and to keep his commandments, as at this day.";
hnv[61] = "Let your heart therefore be perfect with the LORD our God, to walk in his statutes, and to keep his mitzvot, as at this day.";
vul[61] = "sit quoque cor nostrum perfectum cum Domino Deo nostro ut ambulemus in decretis eius et custodiamus mandata eius sicut et hodie";
rsv[62] = "Then the king, and all Israel with him, offered sacrifice before the LORD.";
asv[62] = "And the king, and all Israel with him, offered sacrifice before Jehovah.";
yng[62] = "And the king and all Israel with him are sacrificing a sacrifice before Jehovah;";
dby[62] = "And the king, and all Israel with him, offered sacrifices before Jehovah.";
web[62] = "And the king, and all Israel with him, offered sacrifice before the LORD.";
hnv[62] = "The king, and all Yisra\'el with him, offered sacrifice before the LORD.";
vul[62] = "igitur rex et omnis Israhel cum eo immolabant victimas coram Domino";
rsv[63] = "Solomon offered as peace offerings to the LORD twenty-two thousand oxen and a hundred and twenty thousand sheep. So the king and all the people of Israel dedicated the house of the LORD.";
asv[63] = "And Solomon offered for the sacrifice of peace-offerings, which he offered unto Jehovah, two and twenty thousand oxen, and a hundred and twenty thousand sheep. So the king and all the children of Israel dedicated the house of Jehovah.";
yng[63] = "and Solomon sacrificeth the sacrifice of peace-offerings, which he hath sacrificed to Jehovah, oxen, twenty and two thousand, and sheep, a hundred and twenty thousand; and the king and all the sons of Israel dedicate the house of Jehovah.";
dby[63] = "And Solomon sacrificed a sacrifice of peace-offerings, which he sacrificed to Jehovah, twenty-two thousand oxen and a hundred and twenty thousand sheep. So the king and all the children of Israel dedicated the house of Jehovah.";
web[63] = "And Solomon offered a sacrifice of peace-offerings, which he offered to the LORD, two and twenty thousand oxen, and a hundred and twenty thousand sheep. So the king and all the children of Israel dedicated the house of the LORD.";
hnv[63] = "Shlomo offered for the sacrifice of peace-offerings, which he offered to the LORD, two and twenty thousand oxen, and one hundred twenty thousand sheep. So the king and all the children of Yisra\'el dedicated the house of the LORD.";
vul[63] = "mactavitque Salomon hostias pacificas quas immolavit Domino boum viginti duo milia ovium centum viginti milia et dedicaverunt templum Domini rex et filii Israhel";
rsv[64] = "The same day the king consecrated the middle of the court that was before the house of the LORD; for there he offered the burnt offering and the cereal offering and the fat pieces of the peace offerings, because the bronze altar that was before the LORD was too small to receive the burnt offering and the cereal offering and the fat pieces of the peace offerings.";
asv[64] = "The same day did the king hallow the middle of the court that was before the house of Jehovah; for there he offered the burnt-offering, and the meal-offering, and the fat of the peace-offerings, because the brazen altar that was before Jehovah was too little to receive the burnt-offering, and the meal-offering, and the fat of the peace-offerings.";
yng[64] = "On that day hath the king sanctified the middle of the court that [is] before the house of Jehovah, for he hath made there the burnt-offering, and the present, and the fat of the peace-offerings; for the altar of brass that [is] before Jehovah [is] too little to contain the burnt-offering, and the present, and the fat of the peace-offerings.";
dby[64] = "The same day the king hallowed the middle of the court that was before the house of Jehovah; for there he offered the burnt-offerings, and the oblations, and the fat of the peace-offerings, because the brazen altar that was before Jehovah was too small to receive the burnt-offerings, and the oblations, and the fat of the peace-offerings.";
web[64] = "The same day did the king consecrate the middle of the court that [was] before the house of the LORD: for there he offered burnt-offerings, and meat-offerings, and the fat of the peace-offerings: because the brazen altar that [was] before the LORD [was] too little to receive the burnt-offerings, and meat-offerings, and the fat of the peace-offerings.";
hnv[64] = "The same day did the king make the middle of the court holy that was before the house of the LORD; for there he offered the burnt offering, and the meal-offering, and the fat of the peace-offerings, because the brazen altar that was before the LORD was too little to receive the burnt offering, and the meal-offering, and the fat of the peace-offerings.";
vul[64] = "in die illa sanctificavit rex medium atrii quod erat ante domum Domini fecit quippe ibi holocaustum et sacrificium et adipem pacificorum quia altare aereum quod erat coram Domino minus erat et capere non poterat holocausta et sacrificium et adipem pacificorum";
rsv[65] = "So Solomon held the feast at that time, and all Israel with him, a great assembly, from the entrance of Hamath to the Brook of Egypt, before the LORD our God, seven days.";
asv[65] = "So Solomon held the feast at that time, and all Israel with him, a great assembly, from the entrance of Hamath unto the brook of Egypt, before Jehovah our God, seven days and seven days, even fourteen days.";
yng[65] = "And Solomon maketh, at that time, the festival -- and all Israel with him, a great assembly from the entering in of Hamath unto the brook of Egypt -- before Jehovah our God, seven days and seven days; fourteen days.";
dby[65] = "And at that time Solomon held the feast, and all Israel with him, a great congregation, from the entrance of Hamath unto the torrent of Egypt, before Jehovah our God, seven days and seven days, fourteen days.";
web[65] = "And at that time Solomon held a feast, and all Israel with him, a great congregation, from the entrance into Hamath to the river of Egypt, before the LORD our God, seven days and seven days, [even] fourteen days.";
hnv[65] = "So Shlomo held the feast at that time, and all Yisra\'el with him, a great assembly, from the entrance of Hamat to the brook of Mitzrayim, before the LORD our God, seven days and seven days, even fourteen days.";
vul[65] = "fecit ergo Salomon in tempore illo festivitatem celebrem et omnis Israhel cum eo multitudo magna ab introitu Emath usque ad rivum Aegypti coram Domino Deo nostro septem diebus et septem diebus id est quattuordecim diebus";
rsv[66] = "On the eighth day he sent the people away; and they blessed the king, and went to their homes joyful and glad of heart for all the goodness that the LORD had shown to David his servant and to Israel his people.";
asv[66] = "On the eighth day he sent the people away; and they blessed the king, and went unto their tents joyful and glad of heart for all the goodness that Jehovah had showed unto David his servant, and to Israel his people.";
yng[66] = "On the eighth day he hath sent the people away, and they bless the king, and go to their tents, rejoicing and glad of heart for all the good that Jehovah hath done to David His servant, and to Israel His people.";
dby[66] = "On the eighth day he sent the people away; and they blessed the king, and went to their tents, joyful and glad of heart for all the goodness that Jehovah had done to David his servant, and to Israel his people.";
web[66] = "On the eighth day he sent the people away: and they blessed the king, and went to their tents joyful and glad of heart for all the goodness that the LORD had done for David his servant, and for Israel his people.";
hnv[66] = "On the eighth day he sent the people away; and they blessed the king, and went to their tents joyful and glad of heart for all the goodness that the LORD had shown to David his servant, and to Yisra\'el his people.";
vul[66] = "et in die octava dimisit populos qui benedicentes regi profecti sunt in tabernacula sua laetantes et alacri corde super omnibus bonis quae fecerat Dominus David servo suo et Israhel populo suo";
