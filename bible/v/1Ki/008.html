csb[1] = "At that time Solomon assembled the elders of Israel, all the tribal heads and the ancestral leaders of the Israelites before him at Jerusalem in order to bring the ark of the LORD\'s covenant from the city of David, that is Zion.";
csb[2] = "So all the men of Israel were assembled in the presence of King Solomon in the month of Ethanim, which is the seventh month, at the festival.";
csb[3] = "All the elders of Israel came, and the priests picked up the ark.";
csb[4] = "The priests and the Levites brought the ark of the LORD, the tent of meeting, and the holy utensils that were in the tent.";
csb[5] = "King Solomon and the entire congregation of Israel, who had gathered around him and were with him in front of the ark, were sacrificing sheep, goats, and cattle that could not be counted or numbered, because there were so many.";
csb[6] = "The priests brought the ark of the LORD\'s covenant to its place, into the inner sanctuary of the temple, to the most holy place beneath the wings of the cherubim.";
csb[7] = "For the cherubim were spreading their wings over the place of the ark, so that the cherubim covered the ark and its poles from above.";
csb[8] = "The poles were so long that their ends were seen from the holy place in front of the inner sanctuary, but they were not seen from outside the sanctuary; they are still there today.";
csb[9] = "Nothing was in the ark except the two stone tablets that Moses had put there at Horeb, where the LORD made a covenant with the Israelites when they came out of the land of Egypt.";
csb[10] = "When the priests came out of the holy place, the cloud filled the LORD\'s temple,";
csb[11] = "and because of the cloud, the priests were not able to continue ministering, for the glory of the LORD filled the temple.";
csb[12] = "Then Solomon said: The LORD said that he would dwell in total darkness.";
csb[13] = "I have indeed built an exalted temple for you, a place for your dwelling forever.";
csb[14] = "The king turned around and blessed the entire congregation of Israel while they were standing.";
csb[15] = "He said: Blessed be the LORD God of Israel! He spoke directly to my father David, and he has fulfilled the promise by his power. He said,";
csb[16] = "&quot;Since the day I brought my people Israel out of Egypt, I have not chosen a city to build a temple in among any of the tribes of Israel, so that my name would be there. But I have chosen David to rule my people Israel.&quot;";
csb[17] = "My father David had his heart set on building a temple for the name of the LORD, the God of Israel.";
csb[18] = "But the LORD said to my father David, &quot;Since your heart was set on building a temple for my name, you have done well to have this desire.";
csb[19] = "&quot;Yet you are not the one to build it; instead, your son, your own offspring, will build it for my name.&quot;";
csb[20] = "The LORD has fulfilled what he promised. I have taken the place of my father David, and I sit on the throne of Israel, as the LORD promised. I have built the temple for the name of the LORD, the God of Israel.";
csb[21] = "I have provided a place there for the ark, where the LORD\'s covenant is that he made with our ancestors when he brought them out of the land of Egypt.";
csb[22] = "Then Solomon stood before the altar of the LORD in front of the entire congregation of Israel and spread out his hands toward heaven.";
csb[23] = "He said: LORD God of Israel, there is no God like you in heaven above or on earth below, who keeps the gracious covenant with your servants who walk before you with all their heart.";
csb[24] = "You have kept what you promised to your servant, my father David. You spoke directly to him and you fulfilled your promise by your power as it is today.";
csb[25] = "Therefore, LORD God of Israel, keep what you promised to your servant, my father David: You will never fail to have a man to sit before me on the throne of Israel, if only your sons take care to walk before me as you have walked before me.";
csb[26] = "Now LORD  God of Israel, please confirm what you promised to your servant, my father David.";
csb[27] = "But will God indeed live on earth? Even heaven, the highest heaven, cannot contain you, much less this temple I have built.";
csb[28] = "Listen to your servant\'s prayer and his petition, LORD my God, so that you may hear the cry and the prayer that your servant prays before you today,";
csb[29] = "so that your eyes may watch over this temple night and day, toward the place where you said, &quot;My name will be there,&quot; and so that you may hear the prayer that your servant prays toward this place.";
csb[30] = "Hear the petition of your servant and your people Israel, which they pray toward this place. May you hear in your dwelling place in heaven. May you hear and forgive.";
csb[31] = "When a man sins against his neighbor and is forced to take an oath, and he comes to take an oath before your altar in this temple,";
csb[32] = "may you hear in heaven and act. May you judge your servants, condemning the wicked man by bringing what he has done on his own head and providing justice for the righteous by rewarding him according to his righteousness.";
csb[33] = "When your people Israel are defeated before an enemy, because they have sinned against you, and they return to you and praise your name, and they pray and plead with you for mercy in this temple,";
csb[34] = "may you hear in heaven and forgive the sin of your people Israel. May you restore them to the land you gave their ancestors.";
csb[35] = "When the skies are shut and there is no rain, because they have sinned against you, and they pray toward this place and praise your name, and they turn from their sins because you are afflicting them,";
csb[36] = "may you hear in heaven and forgive the sin of your servants and your people Israel, so that you may teach them the good way they should walk in. May you send rain on your land that you gave your people for an inheritance.";
csb[37] = "When there is famine in the land, when there is pestilence, when there is blight or mildew, locust or grasshopper, when their enemy besieges them in the land and its cities, when there is any plague or illness,";
csb[38] = "every prayer or petition that any person or that all your people Israel may have -- they each know their own affliction -- as they spread out their hands toward this temple,";
csb[39] = "may you hear in heaven, your dwelling place, and may you forgive, act, and give to everyone according to all their ways, since you know each heart, for you alone know every human heart,";
csb[40] = "so that they may fear you all the days they live on the land you gave our ancestors.";
csb[41] = "Even for the foreigner who is not of your people Israel but has come from a distant land because of your name --";
csb[42] = "for they will hear of your great name, strong hand, and outstretched arm, and will come and pray toward this temple --";
csb[43] = "may you hear in heaven, your dwelling place, and do according to all the foreigner asks. Then all peoples of earth will know your name, to fear you as your people Israel do and to know that this temple I have built bears your name.";
csb[44] = "When your people go out to fight against their enemies, wherever you send them, and they pray to the LORD in the direction of the city you have chosen and the temple I have built for your name,";
csb[45] = "may you hear their prayer and petition in heaven and uphold their cause.";
csb[46] = "When they sin against you -- for there is no one who does not sin -- and you are angry with them and hand them over to the enemy, and their captors deport them to the enemy\'s country -- whether distant or nearby --";
csb[47] = "and when they come to their senses in the land where they were deported and repent and petition you in their captors\' land: &quot;We have sinned and done wrong; we have been wicked,&quot;";
csb[48] = "and when they return to you with all their heart and all their soul in the land of their enemies who took them captive, and when they pray to you in the direction of their land that you gave their ancestors, the city you have chosen, and the temple I have built for your name,";
csb[49] = "may you hear in heaven, your dwelling place, their prayer and petition and uphold their cause.";
csb[50] = "May you forgive your people who sinned against you and all their rebellions against you, and may you grant them compassion before their captors, so that they may treat them compassionately.";
csb[51] = "For they are your people and your inheritance; you brought them out of Egypt, out of the middle of an iron furnace.";
csb[52] = "May your eyes be open to your servant\'s petition and to the petition of your people Israel, listening to them whenever they call to you.";
csb[53] = "For you, Lord GOD, have set them apart as your inheritance from all peoples of the earth, as you spoke through your servant Moses when you brought our ancestors out of Egypt.";
csb[54] = "When Solomon finished praying this entire prayer and petition to the LORD, he got up from kneeling before the altar of the LORD, with his hands spread out toward heaven,";
csb[55] = "and he stood and blessed the whole congregation of Israel with a loud voice:";
csb[56] = "&quot;Blessed be the LORD! He has given rest to his people Israel according to all he has said. Not one of all the good promises he made through his servant Moses has failed.";
csb[57] = "&quot;May the LORD our God be with us as he was with our ancestors. May he not abandon us or leave us";
csb[58] = "&quot;so that he causes us to be devoted to him, to walk in all his ways, and to keep his commands, statutes, and ordinances, which he commanded our ancestors.";
csb[59] = "&quot;May my words with which I have made my petition before the LORD be near the LORD our God day and night. May he uphold his servant\'s cause and the cause of his people Israel, as each day requires.";
csb[60] = "&quot;May all the peoples of the earth know that the LORD is God. There is no other!";
csb[61] = "&quot;Be wholeheartedly devoted to the LORD our God to walk in his statutes and to keep his commands, as it is today.&quot;";
csb[62] = "The king and all Israel with him were offering sacrifices in the LORD\'s presence.";
csb[63] = "Solomon offered a sacrifice of fellowship offerings to the LORD: twenty-two thousand cattle and one hundred twenty thousand sheep and goats. In this manner the king and all the Israelites dedicated the LORD\'s temple.";
csb[64] = "On the same day, the king consecrated the middle of the courtyard that was in front of the LORD\'s temple because that was where he offered the burnt offering, the grain offering, and the fat of the fellowship offerings since the bronze altar before the LORD was too small to accommodate the burnt offerings, the grain offerings, and the fat of the fellowship offerings.";
csb[65] = "Solomon and all Israel with him -- a great assembly, from the entrance of Hamath to the Brook of Egypt -- observed the festival at that time in the presence of the LORD our God, seven days, and seven more days -- fourteen days.";
csb[66] = "On the fifteenth day he sent the people away. So they blessed the king and went to their homes rejoicing and with happy hearts for all the goodness that the LORD had done for his servant David and for his people Israel.";
kjv[1] = "Then Solomon assembled the elders of Israel, and all the heads of the tribes, the chief of the fathers of the children of Israel, unto king Solomon in Jerusalem, that they might bring up the ark of the covenant of the LORD out of the city of David, which [is] Zion.";
kjv[2] = "And all the men of Israel assembled themselves unto king Solomon at the feast in the month Ethanim, which [is] the seventh month.";
kjv[3] = "And all the elders of Israel came, and the priests took up the ark.";
kjv[4] = "And they brought up the ark of the LORD, and the tabernacle of the congregation, and all the holy vessels that [were] in the tabernacle, even those did the priests and the Levites bring up.";
kjv[5] = "And king Solomon, and all the congregation of Israel, that were assembled unto him, [were] with him before the ark, sacrificing sheep and oxen, that could not be told nor numbered for multitude.";
kjv[6] = "And the priests brought in the ark of the covenant of the LORD unto his place, into the oracle of the house, to the most holy [place, even] under the wings of the cherubims.";
kjv[7] = "For the cherubims spread forth [their] two wings over the place of the ark, and the cherubims covered the ark and the staves thereof above.";
kjv[8] = "And they drew out the staves, that the ends of the staves were seen out in the holy [place] before the oracle, and they were not seen without: and there they are unto this day.";
kjv[9] = "[There was] nothing in the ark save the two tables of stone, which Moses put there at Horeb, when the LORD made [a covenant] with the children of Israel, when they came out of the land of Egypt.";
kjv[10] = "And it came to pass, when the priests were come out of the holy [place], that the cloud filled the house of the LORD,";
kjv[11] = "So that the priests could not stand to minister because of the cloud: for the glory of the LORD had filled the house of the LORD.";
kjv[12] = "Then spake Solomon, The LORD said that he would dwell in the thick darkness.";
kjv[13] = "I have surely built thee an house to dwell in, a settled place for thee to abide in for ever.";
kjv[14] = "And the king turned his face about, and blessed all the congregation of Israel: (and all the congregation of Israel stood;)";
kjv[15] = "And he said, Blessed [be] the LORD God of Israel, which spake with his mouth unto David my father, and hath with his hand fulfilled [it], saying,";
kjv[16] = "Since the day that I brought forth my people Israel out of Egypt, I chose no city out of all the tribes of Israel to build an house, that my name might be therein; but I chose David to be over my people Israel.";
kjv[17] = "And it was in the heart of David my father to build an house for the name of the LORD God of Israel.";
kjv[18] = "And the LORD said unto David my father, Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart.";
kjv[19] = "Nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house unto my name.";
kjv[20] = "And the LORD hath performed his word that he spake, and I am risen up in the room of David my father, and sit on the throne of Israel, as the LORD promised, and have built an house for the name of the LORD God of Israel.";
kjv[21] = "And I have set there a place for the ark, wherein [is] the covenant of the LORD, which he made with our fathers, when he brought them out of the land of Egypt.";
kjv[22] = "And Solomon stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands toward heaven:";
kjv[23] = "And he said, LORD God of Israel, [there is] no God like thee, in heaven above, or on earth beneath, who keepest covenant and mercy with thy servants that walk before thee with all their heart:";
kjv[24] = "Who hast kept with thy servant David my father that thou promisedst him: thou spakest also with thy mouth, and hast fulfilled [it] with thine hand, as [it is] this day.";
kjv[25] = "Therefore now, LORD God of Israel, keep with thy servant David my father that thou promisedst him, saying, There shall not fail thee a man in my sight to sit on the throne of Israel; so that thy children take heed to their way, that they walk before me as thou hast walked before me.";
kjv[26] = "And now, O God of Israel, let thy word, I pray thee, be verified, which thou spakest unto thy servant David my father.";
kjv[27] = "But will God indeed dwell on the earth? behold, the heaven and heaven of heavens cannot contain thee; how much less this house that I have builded?";
kjv[28] = "Yet have thou respect unto the prayer of thy servant, and to his supplication, O LORD my God, to hearken unto the cry and to the prayer, which thy servant prayeth before thee to day:";
kjv[29] = "That thine eyes may be open toward this house night and day, [even] toward the place of which thou hast said, My name shall be there: that thou mayest hearken unto the prayer which thy servant shall make toward this place.";
kjv[30] = "And hearken thou to the supplication of thy servant, and of thy people Israel, when they shall pray toward this place: and hear thou in heaven thy dwelling place: and when thou hearest, forgive.";
kjv[31] = "If any man trespass against his neighbour, and an oath be laid upon him to cause him to swear, and the oath come before thine altar in this house:";
kjv[32] = "Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.";
kjv[33] = "When thy people Israel be smitten down before the enemy, because they have sinned against thee, and shall turn again to thee, and confess thy name, and pray, and make supplication unto thee in this house:";
kjv[34] = "Then hear thou in heaven, and forgive the sin of thy people Israel, and bring them again unto the land which thou gavest unto their fathers.";
kjv[35] = "When heaven is shut up, and there is no rain, because they have sinned against thee; if they pray toward this place, and confess thy name, and turn from their sin, when thou afflictest them:";
kjv[36] = "Then hear thou in heaven, and forgive the sin of thy servants, and of thy people Israel, that thou teach them the good way wherein they should walk, and give rain upon thy land, which thou hast given to thy people for an inheritance.";
kjv[37] = "If there be in the land famine, if there be pestilence, blasting, mildew, locust, [or] if there be caterpiller; if their enemy besiege them in the land of their cities; whatsoever plague, whatsoever sickness [there be];";
kjv[38] = "What prayer and supplication soever be [made] by any man, [or] by all thy people Israel, which shall know every man the plague of his own heart, and spread forth his hands toward this house:";
kjv[39] = "Then hear thou in heaven thy dwelling place, and forgive, and do, and give to every man according to his ways, whose heart thou knowest; (for thou, [even] thou only, knowest the hearts of all the children of men;)";
kjv[40] = "That they may fear thee all the days that they live in the land which thou gavest unto our fathers.";
kjv[41] = "Moreover concerning a stranger, that [is] not of thy people Israel, but cometh out of a far country for thy name\'s sake;";
kjv[42] = "(For they shall hear of thy great name, and of thy strong hand, and of thy stretched out arm;) when he shall come and pray toward this house;";
kjv[43] = "Hear thou in heaven thy dwelling place, and do according to all that the stranger calleth to thee for: that all people of the earth may know thy name, to fear thee, as [do] thy people Israel; and that they may know that this house, which I have builded, is called by thy name.";
kjv[44] = "If thy people go out to battle against their enemy, whithersoever thou shalt send them, and shall pray unto the LORD toward the city which thou hast chosen, and [toward] the house that I have built for thy name:";
kjv[45] = "Then hear thou in heaven their prayer and their supplication, and maintain their cause.";
kjv[46] = "If they sin against thee, (for [there is] no man that sinneth not,) and thou be angry with them, and deliver them to the enemy, so that they carry them away captives unto the land of the enemy, far or near;";
kjv[47] = "[Yet] if they shall bethink themselves in the land whither they were carried captives, and repent, and make supplication unto thee in the land of them that carried them captives, saying, We have sinned, and have done perversely, we have committed wickedness;";
kjv[48] = "And [so] return unto thee with all their heart, and with all their soul, in the land of their enemies, which led them away captive, and pray unto thee toward their land, which thou gavest unto their fathers, the city which thou hast chosen, and the house which I have built for thy name:";
kjv[49] = "Then hear thou their prayer and their supplication in heaven thy dwelling place, and maintain their cause,";
kjv[50] = "And forgive thy people that have sinned against thee, and all their transgressions wherein they have transgressed against thee, and give them compassion before them who carried them captive, that they may have compassion on them:";
kjv[51] = "For they [be] thy people, and thine inheritance, which thou broughtest forth out of Egypt, from the midst of the furnace of iron:";
kjv[52] = "That thine eyes may be open unto the supplication of thy servant, and unto the supplication of thy people Israel, to hearken unto them in all that they call for unto thee.";
kjv[53] = "For thou didst separate them from among all the people of the earth, [to be] thine inheritance, as thou spakest by the hand of Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord GOD.";
kjv[54] = "And it was [so], that when Solomon had made an end of praying all this prayer and supplication unto the LORD, he arose from before the altar of the LORD, from kneeling on his knees with his hands spread up to heaven.";
kjv[55] = "And he stood, and blessed all the congregation of Israel with a loud voice, saying,";
kjv[56] = "Blessed [be] the LORD, that hath given rest unto his people Israel, according to all that he promised: there hath not failed one word of all his good promise, which he promised by the hand of Moses his servant.";
kjv[57] = "The LORD our God be with us, as he was with our fathers: let him not leave us, nor forsake us:";
kjv[58] = "That he may incline our hearts unto him, to walk in all his ways, and to keep his commandments, and his statutes, and his judgments, which he commanded our fathers.";
kjv[59] = "And let these my words, wherewith I have made supplication before the LORD, be nigh unto the LORD our God day and night, that he maintain the cause of his servant, and the cause of his people Israel at all times, as the matter shall require:";
kjv[60] = "That all the people of the earth may know that the LORD [is] God, [and that there is] none else.";
kjv[61] = "Let your heart therefore be perfect with the LORD our God, to walk in his statutes, and to keep his commandments, as at this day.";
kjv[62] = "And the king, and all Israel with him, offered sacrifice before the LORD.";
kjv[63] = "And Solomon offered a sacrifice of peace offerings, which he offered unto the LORD, two and twenty thousand oxen, and an hundred and twenty thousand sheep. So the king and all the children of Israel dedicated the house of the LORD.";
kjv[64] = "The same day did the king hallow the middle of the court that [was] before the house of the LORD: for there he offered burnt offerings, and meat offerings, and the fat of the peace offerings: because the brasen altar that [was] before the LORD [was] too little to receive the burnt offerings, and meat offerings, and the fat of the peace offerings.";
kjv[65] = "And at that time Solomon held a feast, and all Israel with him, a great congregation, from the entering in of Hamath unto the river of Egypt, before the LORD our God, seven days and seven days, [even] fourteen days.";
kjv[66] = "On the eighth day he sent the people away: and they blessed the king, and went unto their tents joyful and glad of heart for all the goodness that the LORD had done for David his servant, and for Israel his people.";
rsv[1] = "Then Solomon assembled the elders of Israel and all the heads of the tribes, the leaders of the fathers\' houses of the people of Israel, before King Solomon in Jerusalem, to bring up the ark of the covenant of the LORD out of the city of David, which is Zion.";
asv[1] = "Then Solomon assembled the elders of Israel, and all the heads of the tribes, the princes of the fathers\' [houses] of the children of Israel, unto king Solomon in Jerusalem, to bring up the ark of the covenant of Jehovah out of the city of David, which is Zion.";
yng[1] = "Then doth Solomon assemble the elders of Israel, and all the heads of the tribes, princes of the fathers of the sons of Israel, unto king Solomon, to Jerusalem, to bring up the ark of the covenant of Jehovah from the city of David -- it [is] Zion;";
dby[1] = "Then Solomon assembled the elders of Israel, and all the heads of the tribes, the princes of the fathers of the children of Israel, unto king Solomon in Jerusalem, to bring up the ark of the covenant of Jehovah out of the city of David, which is Zion.";
web[1] = "Then Solomon assembled the elders of Israel, and all the heads of the tribes, the chief of the fathers of the children of Israel, to king Solomon in Jerusalem, that they might bring the ark of the covenant of the LORD out of the city of David, which [is] Zion.";
hnv[1] = "Then Shlomo assembled the Zakenim of Yisra\'el, and all the heads of the tribes, the princes of the fathers\' [houses] of the children of Yisra\'el, to king Shlomo in Yerushalayim, to bring up the ark of the covenant of the LORD out of the city of David, which is Tziyon.";
vul[1] = "tunc congregavit omnes maiores natu Israhel cum principibus tribuum et duces familiarum filiorum Israhel ad regem Salomonem in Hierusalem ut deferrent arcam foederis Domini de civitate David id est de Sion";
rsv[2] = "And all the men of Israel assembled to King Solomon at the feast in the month Eth\'anim, which is the seventh month.";
asv[2] = "And all the men of Israel assembled themselves unto king Solomon at the feast, in the month Ethanim, which is the seventh month.";
yng[2] = "and all the men of Israel are assembled unto king Solomon, in the month of Ethanim, in the festival -- [is] the seventh month.";
dby[2] = "And all the men of Israel assembled themselves to king Solomon at the feast in the month Ethanim, that is, the seventh month.";
web[2] = "And all the men of Israel assembled themselves to king Solomon at the feast in the month Ethanim, which [is] the seventh month.";
hnv[2] = "All the men of Yisra\'el assembled themselves to king Shlomo at the feast, in the month Etanim, which is the seventh month.";
vul[2] = "convenitque ad regem Salomonem universus Israhel in mense hethanim in sollemni die ipse est mensis septimus";
rsv[3] = "And all the elders of Israel came, and the priests took up the ark.";
asv[3] = "And all the elders of Israel came, and the priests took up the ark.";
yng[3] = "And all the elders of Israel come in, and the priests lift up the ark,";
dby[3] = "And all the elders of Israel came; and the priests took up the ark.";
web[3] = "And all the elders of Israel came, and the priests took up the ark.";
hnv[3] = "All the Zakenim of Yisra\'el came, and the Kohanim took up the ark.";
vul[3] = "veneruntque cuncti senes ex Israhel et tulerunt sacerdotes arcam";
rsv[4] = "And they brought up the ark of the LORD, the tent of meeting, and all the holy vessels that were in the tent; the priests and the Levites brought them up.";
asv[4] = "And they brought up the ark of Jehovah, and the tent of meeting, and all the holy vessels that were in the Tent; even these did the priests and the Levites bring up.";
yng[4] = "and bring up the ark of Jehovah, and the tent of meeting, and all the holy vessels that [are] in the tent, yea, the priests and the Levites bring them up.";
dby[4] = "And they brought up the ark of Jehovah, and the tent of meeting, and all the holy vessels that were in the tent: the priests and the Levites brought them up.";
web[4] = "And they brought the ark of the LORD, and the tabernacle of the congregation, and all the holy vessels that [were] in the tabernacle, even those did the priests and the Levites bring.";
hnv[4] = "They brought up the ark of the LORD, and the tent of meeting, and all the holy vessels that were in the Tent; even these did the Kohanim and the Levites bring up.";
vul[4] = "et portaverunt arcam Domini et tabernaculum foederis et omnia vasa sanctuarii quae erant in tabernaculo et ferebant ea sacerdotes et Levitae";
rsv[5] = "And King Solomon and all the congregation of Israel, who had assembled before him, were with him before the ark, sacrificing so many sheep and oxen that they could not be counted or numbered.";
asv[5] = "And king Solomon and all the congregation of Israel, that were assembled unto him, were with him before the ark, sacrificing sheep and oxen, that could not be counted nor numbered for multitude.";
yng[5] = "And king Solomon and all the company of Israel who are met unto him [are] with him before the ark, sacrificing sheep and oxen, that are not counted nor numbered for multitude.";
dby[5] = "And king Solomon, and all the assembly of Israel that were assembled to him, [who were] with him before the ark, sacrificed sheep and oxen, which could not be counted nor numbered for multitude.";
web[5] = "And king Solomon, and all the congregation of Israel, that were assembled to him, [were] with him before the ark, sacrificing sheep and oxen, that could not be told nor numbered for multitude.";
hnv[5] = "King Shlomo and all the congregation of Yisra\'el, who were assembled to him, were with him before the ark, sacrificing sheep and oxen, that could not be counted nor numbered for multitude.";
vul[5] = "rex autem Salomon et omnis multitudo Israhel quae convenerat ad eum gradiebatur cum illo ante arcam et immolabant oves et boves absque aestimatione et numero";
rsv[6] = "Then the priests brought the ark of the covenant of the LORD to its place, in the inner sanctuary of the house, in the most holy place, underneath the wings of the cherubim.";
asv[6] = "And the priests brought in the ark of the covenant of Jehovah unto its place, into the oracle of the house, to the most holy place, even under the wings of the cherubim.";
yng[6] = "And the priests bring in the ark of the covenant of Jehovah unto its place, unto the oracle of the house, unto the holy of holies, unto the place of the wings of the cherubs;";
dby[6] = "And the priests brought in the ark of the covenant of Jehovah to its place, into the oracle of the house, into the most holy place, under the wings of the cherubim;";
web[6] = "And the priests brought the ark of the covenant of the LORD to its place, into the oracle of the house, to the most holy [place], [even] under the wings of the cherubim.";
hnv[6] = "The Kohanim brought in the ark of the covenant of the LORD to its place, into the oracle of the house, to the most holy place, even under the wings of the Keruvim.";
vul[6] = "et intulerunt sacerdotes arcam foederis Domini in locum suum in oraculum templi in sanctum sanctorum subter alas cherubin";
rsv[7] = "For the cherubim spread out their wings over the place of the ark, so that the cherubim made a covering above the ark and its poles.";
asv[7] = "For the cherubim spread forth their wings over the place of the ark, and the cherubim covered the ark and the staves thereof above.";
yng[7] = "for the cherubs are spreading forth two wings unto the place of the ark, and the cherubs cover over the ark, and over its staves from above;";
dby[7] = "for the cherubim stretched forth [their] wings over the place of the ark, and the cherubim covered the ark and its staves above.";
web[7] = "For the cherubim spread forth [their] two wings over the place of the ark, and the cherubim covered the ark and the staffs thereof above.";
hnv[7] = "For the Keruvim spread forth their wings over the place of the ark, and the Keruvim covered the ark and the poles of it above.";
vul[7] = "siquidem cherubin expandebant alas super locum arcae et protegebant arcam et vectes eius desuper";
rsv[8] = "And the poles were so long that the ends of the poles were seen from the holy place before the inner sanctuary; but they could not be seen from outside; and they are there to this day.";
asv[8] = "And the staves were so long that the ends of the staves were seen from the holy place before the oracle; but they were not seen without: and there they are unto this day.";
yng[8] = "and they lengthen the staves, and the heads of the staves are seen from the holy [place] on the front of the oracle, and are not seen without, and they are there unto this day.";
dby[8] = "And the staves were long, so that the ends of the staves were seen from the holy place before the oracle, but they were not seen without. And there they are to this day.";
web[8] = "And they drew out the staffs, that the ends of the staffs were seen out in the holy [place] before the oracle, and they were not seen without: and there they are to this day.";
hnv[8] = "The poles were so long that the ends of the poles were seen from the holy place before the oracle; but they were not seen outside: and there they are to this day.";
vul[8] = "cumque eminerent vectes et apparerent summitates eorum foris sanctuarium ante oraculum non apparebant ultra extrinsecus qui et fuerunt ibi usque in praesentem diem";
rsv[9] = "There was nothing in the ark except the two tables of stone which Moses put there at Horeb, where the LORD made a covenant with the people of Israel, when they came out of the land of Egypt.";
asv[9] = "There was nothing in the ark save the two tables of stone which Moses put there at Horeb, when Jehovah made a covenant with the children of Israel, when they came out of the land of Egypt.";
yng[9] = "There is nothing in the ark, only the two tables of stone which Moses put there in Horeb, when Jehovah covenanted with the sons of Israel in their going out of the land of Egypt.";
dby[9] = "There was nothing in the ark save the two tables of stone which Moses placed there at Horeb, when Jehovah made [a covenant] with the children of Israel, when they came out of the land of Egypt.";
web[9] = "[There was] nothing in the ark save the two tables of stone, which Moses deposited there at Horeb, when the LORD made [a covenant] with the children of Israel, when they came out of the land of Egypt.";
hnv[9] = "There was nothing in the ark save the two tables of stone which Moshe put there at Horev, when the LORD made a covenant with the children of Yisra\'el, when they came out of the land of Mitzrayim.";
vul[9] = "in arca autem non est aliud nisi duae tabulae lapideae quas posuerat in ea Moses in Horeb quando pepigit foedus Dominus cum filiis Israhel cum egrederentur de terra Aegypti";
rsv[10] = "And when the priests came out of the holy place, a cloud filled the house of the LORD,";
asv[10] = "And it came to pass, when the priests were come out of the holy place, that the cloud filled the house of Jehovah,";
yng[10] = "And it cometh to pass, in the going out of the priests from the holy [place], that the cloud hath filled the house of Jehovah,";
dby[10] = "And it came to pass when the priests were come out of the holy place, that the cloud filled the house of Jehovah,";
web[10] = "And it came to pass, when the priests had come out of the holy [place], that the cloud filled the house of the LORD,";
hnv[10] = "It came to pass, when the Kohanim were come out of the holy place, that the cloud filled the house of the LORD,";
vul[10] = "factum est autem cum exissent sacerdotes de sanctuario nebula implevit domum Domini";
rsv[11] = "so that the priests could not stand to minister because of the cloud; for the glory of the LORD filled the house of the LORD.";
asv[11] = "so that the priests could not stand to minister by reason of the cloud; for the glory of Jehovah filled the house of Jehovah.";
yng[11] = "and the priests have not been able to stand to minister because of the cloud, for the honour of Jehovah hath filled the house of Jehovah.";
dby[11] = "and the priests could not stand to do their service because of the cloud; for the glory of Jehovah had filled the house of Jehovah.";
web[11] = "So that the priests could not stand to minister because of the cloud: for the glory of the LORD had filled the house of the LORD.";
hnv[11] = "so that the Kohanim could not stand to minister by reason of the cloud; for the glory of the LORD filled the house of the LORD.";
vul[11] = "et non poterant sacerdotes stare et ministrare propter nebulam impleverat enim gloria Domini domum Domini";
rsv[12] = "Then Solomon said, &quot;The LORD has set the sun in the heavens, but has said that he would dwell in thick darkness.";
asv[12] = "Then spake Solomon, Jehovah hath said that he would dwell in the thick darkness.";
yng[12] = "Then said Solomon, `Jehovah hath said to dwell in thick darkness;";
dby[12] = "Then said Solomon: Jehovah said that he would dwell in the thick darkness.";
web[12] = "Then spoke Solomon, The LORD said that he would dwell in the thick darkness.";
hnv[12] = "Then spoke Shlomo, the LORD has said that he would dwell in the thick darkness.";
vul[12] = "tunc ait Salomon Dominus dixit ut habitaret in nebula";
rsv[13] = "I have built thee an exalted house, a place for thee to dwell in for ever.&quot;";
asv[13] = "I have surely built thee a house of habitation, a place for thee to dwell in for ever.";
yng[13] = "I have surely built a house of habitation for Thee; a fixed place for Thine abiding to the ages.\'";
dby[13] = "I have indeed built a house of habitation for thee, a settled place for thee to abide in for ever.";
web[13] = "I have surely built thee a house to dwell in, a settled place for thee to abide in for ever.";
hnv[13] = "I have surely built you a house of habitation, a place for you to dwell in forever.";
vul[13] = "aedificans aedificavi domum in habitaculum tuum firmissimum solium tuum in sempiternum";
rsv[14] = "Then the king faced about, and blessed all the assembly of Israel, while all the assembly of Israel stood.";
asv[14] = "And the king turned his face about, and blessed all the assembly of Israel: and all the assembly of Israel stood.";
yng[14] = "And the king turneth round his face, and blesseth the whole assembly of Israel; and all the assembly of Israel is standing.";
dby[14] = "And the king turned his face, and blessed the whole congregation of Israel; and the whole congregation of Israel stood.";
web[14] = "And the king turned his face about, and blessed all the congregation of Israel: and all the congregation of Israel were standing.";
hnv[14] = "The king turned his face about, and blessed all the assembly of Yisra\'el: and all the assembly of Yisra\'el stood.";
vul[14] = "convertitque rex faciem suam et benedixit omni ecclesiae Israhel omnis enim ecclesia Israhel stabat";
rsv[15] = "And he said, &quot;Blessed be the LORD, the God of Israel, who with his hand has fulfilled what he promised with his mouth to David my father, saying,";
asv[15] = "And he said, Blessed be Jehovah, the God of Israel, who spake with his mouth unto David thy father, and hath with his hand fulfilled it, saying,";
yng[15] = "And he saith, `Blessed [is] Jehovah, God of Israel, who spake by His mouth with David my father, and by His hand hath fulfilled [it], saying,";
dby[15] = "And he said: Blessed be Jehovah the God of Israel, who spoke with his mouth unto David my father, and hath with his hand fulfilled it, saying,";
web[15] = "And he said, Blessed [be] the LORD God of Israel, who spoke with his mouth to David my father, and hath with his hand fulfilled [it], saying,";
hnv[15] = "He said, Blessed be the LORD, the God of Yisra\'el, who spoke with his mouth to David your father, and has with his hand fulfilled it, saying,";
vul[15] = "et ait benedictus Dominus Deus Israhel qui locutus est ore suo ad David patrem meum et in manibus eius perfecit dicens";
rsv[16] = "\'Since the day that I brought my people Israel out of Egypt, I chose no city in all the tribes of Israel in which to build a house, that my name might be there; but I chose David to be over my people Israel.\'";
asv[16] = "Since the day that I brought forth my people Israel out of Egypt, I chose no city out of all the tribes of Israel to build a house, that my name might be there; but I chose David to be over my people Israel.";
yng[16] = "From the day that I brought out My people, even Israel, from Egypt, I have not fixed on a city out of all the tribes of Israel, to build a house for My name being there; and I fix on David to be over My people Israel.";
dby[16] = "Since the day that I brought forth my people Israel out of Egypt, I chose no city out of all the tribes of Israel to build a house in, that my name might be there; but I have chosen David to be over my people Israel.";
web[16] = "Since the day that I brought forth my people Israel from Egypt, I have chosen no city out of all the tribes of Israel to build a house, that my name might be therein; but I chose David to be over my people Israel.";
hnv[16] = "Since the day that I brought forth my people Yisra\'el out of Mitzrayim, I chose no city out of all the tribes of Yisra\'el to build a house, that my name might be there; but I chose David to be over my people Yisra\'el.";
vul[16] = "a die qua eduxi populum meum Israhel de Aegypto non elegi civitatem de universis tribubus Israhel ut aedificaretur domus et esset nomen meum ibi sed elegi David ut esset super populum meum Israhel";
rsv[17] = "Now it was in the heart of David my father to build a house for the name of the LORD, the God of Israel.";
asv[17] = "Now it was in the heart of David my father to build a house for the name of Jehovah, the God of Israel.";
yng[17] = "`And it is with the heart of David my father to build a house for the name of Jehovah, God of Israel,";
dby[17] = "And it was in the heart of David my father to build a house unto the name of Jehovah the God of Israel.";
web[17] = "And it was in the heart of David my father to build a house for the name of the LORD God of Israel.";
hnv[17] = "Now it was in the heart of David my father to build a house for the name of the LORD, the God of Yisra\'el.";
vul[17] = "voluitque David pater meus aedificare domum nomini Domini Dei Israhel";
rsv[18] = "But the LORD said to David my father, \'Whereas it was in your heart to build a house for my name, you did well that it was in your heart;";
asv[18] = "But Jehovah said unto David my father, Whereas it was in thy heart to build a house for my name, thou didst well that it was in thy heart:";
yng[18] = "and Jehovah saith unto David my father, Because that it hath been with thy heart to build a house for My name, thou hast done well that it hath been with thy heart;";
dby[18] = "But Jehovah said to David my father, Whereas it was in thy heart to build a house unto my name, thou didst well that it was in thy heart;";
web[18] = "And the LORD said to David my father, Whereas it was in thy heart to build a house to my name, thou didst well that it was in thy heart.";
hnv[18] = "But the LORD said to David my father, Whereas it was in your heart to build a house for my name, you did well that it was in your heart:";
vul[18] = "et ait Dominus ad David patrem meum quod cogitasti in corde tuo aedificare domum nomini meo bene fecisti hoc ipsum mente tractans";
rsv[19] = "nevertheless you shall not build the house, but your son who shall be born to you shall build the house for my name.\'";
asv[19] = "nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house for my name.";
yng[19] = "only, thou dost not build the house, but thy son who is coming out from thy loins, he doth build the house for My name.";
dby[19] = "nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house unto my name.";
web[19] = "Nevertheless, thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house to my name.";
hnv[19] = "nevertheless you shall not build the house; but your son who shall come forth out of your loins, he shall build the house for my name.";
vul[19] = "verumtamen tu non aedificabis domum sed filius tuus qui egredietur de renibus tuis ipse aedificabit domum nomini meo";
rsv[20] = "Now the LORD has fulfilled his promise which he made; for I have risen in the place of David my father, and sit on the throne of Israel, as the LORD promised, and I have built the house for the name of the LORD, the God of Israel.";
asv[20] = "And Jehovah hath established his word that he spake; for I am risen up in the room of David my father, and sit on the throne of Israel, as Jehovah promised, and have built the house for the name of Jehovah, the God of Israel.";
yng[20] = "`And Jehovah doth establish His word which He spake, and I am risen up instead of David my father, and sit on the throne of Israel, as Jehovah spake, and build the house for the name of Jehovah, God of Israel,";
dby[20] = "And Jehovah has performed his word which he spoke; and I am risen up in the room of David my father, and sit on the throne of Israel, as Jehovah promised, and I have built the house unto the name of Jehovah the God of Israel.";
web[20] = "And the LORD hath performed his word that he spoke, and I have risen in the room of David my father, and sit on the throne of Israel, as the LORD promised, and have built a house for the name of the LORD God of Israel.";
hnv[20] = "The LORD has established his word that he spoke; for I am risen up in the room of David my father, and sit on the throne of Yisra\'el, as the LORD promised, and have built the house for the name of the LORD, the God of Yisra\'el.";
vul[20] = "confirmavit Dominus sermonem suum quem locutus est stetique pro David patre meo et sedi super thronum Israhel sicut locutus est Dominus et aedificavi domum nomini Domini Dei Israhel";
rsv[21] = "And there I have provided a place for the ark, in which is the covenant of the LORD which he made with our fathers, when he brought them out of the land of Egypt.&quot;";
asv[21] = "And there have I set a place for the ark, wherein is the covenant of Jehovah, which he made with our fathers, when he brought them out of the land of Egypt.";
yng[21] = "and set there a place for the ark, where [is] the covenant of Jehovah which He made with our fathers in His bringing them out from the land of Egypt.\'";
dby[21] = "And I have set there a place for the ark, wherein is the covenant of Jehovah, which he made with our fathers when he brought them out of the land of Egypt.";
web[21] = "And I have set there a place for the ark, in which [is] the covenant of the LORD, which he made with our fathers, when he brought them from the land of Egypt.";
hnv[21] = "There have I set a place for the ark, in which is the covenant of the LORD, which he made with our fathers, when he brought them out of the land of Mitzrayim.";
vul[21] = "et constitui ibi locum arcae in qua foedus est Domini quod percussit cum patribus nostris quando egressi sunt de terra Aegypti";
rsv[22] = "Then Solomon stood before the altar of the LORD in the presence of all the assembly of Israel, and spread forth his hands toward heaven;";
asv[22] = "And Solomon stood before the altar of Jehovah in the presence of all the assembly of Israel, and spread forth his hands toward heaven;";
yng[22] = "And Solomon standeth before the altar of Jehovah, over-against all the assembly of Israel, and spreadeth his hands towards the heavens,";
dby[22] = "And Solomon stood before the altar of Jehovah in the presence of the whole congregation of Israel, and spread forth his hands toward the heavens.";
web[22] = "And Solomon stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands towards Heaven:";
hnv[22] = " Shlomo stood before the altar of the LORD in the presence of all the assembly of Yisra\'el, and spread forth his hands toward heaven;";
vul[22] = "stetit autem Salomon ante altare Domini in conspectu ecclesiae Israhel et expandit manus suas in caelum";
rsv[23] = "and said, &quot;O LORD, God of Israel, there is no God like thee, in heaven above or on earth beneath, keeping covenant and showing steadfast love to thy servants who walk before thee with all their heart;";
asv[23] = "and he said, O Jehovah, the God of Israel, there is no God like thee, in heaven above, or on earth beneath; who keepest covenant and lovingkindness with thy servants, that walk before thee with all their heart;";
yng[23] = "and saith, `Jehovah, God of Israel, there is not a God like Thee, in the heavens above, and on the earth beneath, keeping the covenant and the kindness for Thy servants, those walking before Thee with all their heart,";
dby[23] = "And he said, Jehovah, God of Israel! there is no God like thee, in the heavens above, or on the earth beneath, who keepest covenant and mercy with thy servants that walk before thee with all their heart;";
web[23] = "And he said, LORD God of Israel, [there is] no God like thee, in heaven above, or on earth beneath, who keepest covenant and mercy with thy servants that walk before thee with all their heart.";
hnv[23] = " and he said, LORD, the God of Yisra\'el, there is no God like you, in heaven above, or on eretz beneath; who keep covenant and lovingkindness with your servants, who walk before you with all their heart;";
vul[23] = "et ait Domine Deus Israhel non est similis tui Deus in caelo desuper et super terra deorsum qui custodis pactum et misericordiam servis tuis qui ambulant coram te in toto corde suo";
rsv[24] = "who hast kept with thy servant David my father what thou didst declare to him; yea, thou didst speak with thy mouth, and with thy hand hast fulfilled it this day.";
asv[24] = "who hast kept with thy servant David my father that which thou didst promise him: yea, thou spakest with thy mouth, and hast fulfilled it with thy hand, as it is this day.";
yng[24] = "who hast kept for Thy servant David my father that which Thou spakest to him; yea, Thou speakest with Thy mouth, and with Thy hand hast fulfilled [it], as [at] this day.";
dby[24] = "who hast kept with thy servant David my father that which thou didst promise him; thou spokest with thy mouth, and hast fulfilled [it] with thy hand, as at this day.";
web[24] = "Who hast kept with thy servant David my father that which thou didst promise him: thou didst speak also with thy mouth, and hast fulfilled [it] with thy hand, as [it is] this day.";
hnv[24] = " who have kept with your servant David my father that which you did promise him: yes, you spoke with your mouth, and have fulfilled it with your hand, as it is this day.";
vul[24] = "qui custodisti servo tuo David patri meo quae locutus es ei ore locutus es et manibus perfecisti ut et haec dies probat";
rsv[25] = "Now therefore, O LORD, God of Israel, keep with thy servant David my father what thou hast promised him, saying, \'There shall never fail you a man before me to sit upon the throne of Israel, if only your sons take heed to their way, to walk before me as you have walked before me.\'";
asv[25] = "Now therefore, O Jehovah, the God of Israel, keep with thy servant David my father that which thou hast promised him, saying, There shall not fail thee a man in my sight to sit on the throne of Israel, if only thy children take heed to their way, to walk before me as thou hast walked before me.";
yng[25] = "`And now, Jehovah, God of Israel, keep for Thy servant David my father that which Thou spakest to him, saying, There is not cut off to thee a man from before Me, sitting on the throne of Israel -- only, if thy sons watch their way, to walk before Me as thou hast walked before Me.";
dby[25] = "And now, Jehovah, God of Israel, keep with thy servant David my father that which thou hast promised him, saying, There shall not fail thee a man in my sight to sit on the throne of Israel, if only thy sons take heed to their way, to walk before me as thou hast walked before me.";
web[25] = "Therefore now, LORD God of Israel, keep with thy servant David my father that which thou didst promise him, saying, There shall not fail thee a man in my sight to sit on the throne of Israel; provided thy children take heed to their way, that they walk before me as thou hast walked before me.";
hnv[25] = "Now therefore, LORD, the God of Yisra\'el, keep with your servant David my father that which you have promised him, saying, There shall not fail you a man in my sight to sit on the throne of Yisra\'el, if only your children take heed to their way, to walk before me as you have walked before me.";
vul[25] = "nunc igitur Domine Deus Israhel conserva famulo tuo David patri meo quae locutus es ei dicens non auferetur de te vir coram me qui sedeat super thronum Israhel ita tamen si custodierint filii tui viam suam ut ambulent coram me sicut tu ambulasti in conspectu meo";
rsv[26] = "Now therefore, O God of Israel, let thy word be confirmed, which thou hast spoken to thy servant David my father.";
asv[26] = "Now therefore, O God of Israel, let thy word, I pray thee, be verified, which thou spakest unto thy servant David my father.";
yng[26] = "`And now, O God of Israel, let it be established, I pray Thee, Thy word which Thou hast spoken to Thy servant, David my father.";
dby[26] = "And now, O God of Israel, let thy words, I pray thee, be verified, which thou hast spoken unto thy servant David my father.";
web[26] = "And now, O God of Israel, let thy word, I pray thee, be verified, which thou didst speak to thy servant David my father.";
hnv[26] = "Now therefore, God of Yisra\'el, Please let your word be verified, which you spoke to your servant David my father.";
vul[26] = "et nunc Deus Israhel firmentur verba tua quae locutus es servo tuo David patri meo";
rsv[27] = "&quot;But will God indeed dwell on the earth? Behold, heaven and the highest heaven cannot contain thee; how much less this house which I have built!";
asv[27] = "But will God in very deed dwell on the earth? behold, heaven and the heaven of heavens cannot contain thee; how much less this house that I have builded!";
yng[27] = "But, is it true? -- God dwelleth on the earth! lo, the heavens, and the heavens of the heavens do not contain Thee, how much less this house which I have builded!";
dby[27] = "But will God indeed dwell on the earth? Behold, the heavens, and the heaven of heavens, cannot contain thee; how much less this house which I have built!";
web[27] = "But will God indeed dwell on the earth? behold, the heaven and heaven of heavens cannot contain thee; how much less this house that I have built?";
hnv[27] = "But will God in very deed dwell on the eretz? behold, heaven and the heaven of heavens can\'t contain you; how much less this house that I have built!";
vul[27] = "ergone putandum est quod vere Deus habitet super terram si enim caelum et caeli caelorum te capere non possunt quanto magis domus haec quam aedificavi";
rsv[28] = "Yet have regard to the prayer of thy servant and to his supplication, O LORD my God, hearkening to the cry and to the prayer which thy servant prays before thee this day;";
asv[28] = "Yet have thou respect unto the prayer of thy servant, and to his supplication, O Jehovah my God, to hearken unto the cry and to the prayer which thy servant prayeth before thee this day;";
yng[28] = "`Then thou hast turned unto the prayer of Thy servant, and unto his supplication, O Jehovah my God, to hearken unto the cry and unto the prayer which Thy servant is praying before Thee to-day,";
dby[28] = "Yet have respect unto the prayer of thy servant, and to his supplication, Jehovah, my God, to hearken unto the cry and to the prayer which thy servant prayeth before thee this day;";
web[28] = "Yet have thou respect to the prayer of thy servant, and to his supplication, O LORD my God, to hearken to the cry and to the prayer, which thy servant prayeth before thee this day:";
hnv[28] = "Yet have respect for the prayer of your servant, and for his supplication, LORD my God, to listen to the cry and to the prayer which your servant prays before you this day;";
vul[28] = "sed respice ad orationem servi tui et ad preces eius Domine Deus meus audi hymnum et orationem quam servus tuus orat coram te hodie";
rsv[29] = "that thy eyes may be open night and day toward this house, the place of which thou hast said, \'My name shall be there,\' that thou mayest hearken to the prayer which thy servant offers toward this place.";
asv[29] = "that thine eyes may be open toward this house night and day, even toward the place whereof thou hast said, My name shall be there; to hearken unto the prayer which thy servant shall pray toward this place.";
yng[29] = "for Thine eyes being open towards this house night and day, towards the place of which Thou hast said, My Name is there; to hearken unto the prayer which Thy servant prayeth towards this place.";
dby[29] = "that thine eyes may be open upon this house night and day, upon the place of which thou hast said, My name shall be there: to hearken unto the prayer which thy servant prayeth toward this place.";
web[29] = "That thy eyes may be open towards this house night and day, [even] towards the place of which thou hast said, My name shall be there: that thou mayest hearken to the prayer which thy servant shall make towards this place.";
hnv[29] = "that your eyes may be open toward this house night and day, even toward the place whereof you have said, My name shall be there; to listen to the prayer which your servant shall pray toward this place.";
vul[29] = "ut sint oculi tui aperti super domum hanc nocte et die super domum de qua dixisti erit nomen meum ibi ut exaudias orationem qua orat te servus tuus in loco isto";
rsv[30] = "And hearken thou to the supplication of thy servant and of thy people Israel, when they pray toward this place; yea, hear thou in heaven thy dwelling place; and when thou hearest, forgive.";
asv[30] = "And hearken thou to the supplication of thy servant, and of thy people Israel, when they shall pray toward this place: yea, hear thou in heaven thy dwelling-place; and when thou hearest, forgive.";
yng[30] = "`Then Thou hast hearkened unto the supplication of Thy servant, and of Thy people Israel, which they pray towards this place; yea, Thou dost hearken in the place of Thy dwelling, in the heavens -- and Thou hast hearkened, and hast forgiven,";
dby[30] = "And hearken unto the supplication of thy servant, and of thy people Israel, when they shall pray toward this place, and hear thou in thy dwelling-place, in the heavens, and when thou hearest, forgive.";
web[30] = "And hearken thou to the supplication of thy servant, and of thy people Israel, when they shall pray towards this place: and hear thou in heaven thy dwelling-place: and when thou hearest, forgive.";
hnv[30] = "Listen you to the supplication of your servant, and of your people Yisra\'el, when they shall pray toward this place: yes, hear in heaven, your dwelling-place; and when you hear, forgive.";
vul[30] = "ut exaudias deprecationem servi tui et populi tui Israhel quodcumque oraverint in loco isto et exaudies in loco habitaculi tui in caelo et cum exaudieris propitius eris";
rsv[31] = "&quot;If a man sins against his neighbor and is made to take an oath, and comes and swears his oath before thine altar in this house,";
asv[31] = "If a man sin against his neighbor, and an oath be laid upon him to cause him to swear, and he come [and] swear before thine altar in this house;";
yng[31] = "that which a man sinneth against his neighbour, and he hath lifted up upon him an oath to cause him to swear, and the oath hath come in before Thine altar in this house,";
dby[31] = "If a man have sinned against his neighbour, and an oath be laid upon him to adjure him, and the oath come before thine altar in this house;";
web[31] = "If any man shall trespass against his neighbor, and an oath be laid upon him to cause him to swear, and the oath come before thy altar in this house:";
hnv[31] = "If a man sin against his neighbor, and an oath be laid on him to cause him to swear, and he come [and] swear before your altar in this house;";
vul[31] = "si peccaverit homo in proximum suum et habuerit aliquod iuramentum quo teneatur adstrictus et venerit propter iuramentum coram altari tuo in domum tuam";
rsv[32] = "then hear thou in heaven, and act, and judge thy servants, condemning the guilty by bringing his conduct upon his own head, and vindicating the righteous by rewarding him according to his righteousness.";
asv[32] = "then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his own head, and justifying the righteous, to give him according to his righteousness.";
yng[32] = "then Thou dost hear in the heavens, and hast done, and hast judged Thy servants, to declare wicked the wicked, to put his way on his head, and to declare righteous the righteous, to give him according to his righteousness.";
dby[32] = "then hear thou in the heavens, and do, and judge thy servants, condemning the wicked, to bring his way upon his own head; and justifying the righteous, giving him according to his righteousness.";
web[32] = "Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.";
hnv[32] = "then hear you in heaven, and do, and judge your servants, condemning the wicked, to bring his way on his own head, and justifying the righteous, to give him according to his righteousness.";
vul[32] = "tu exaudies in caelo et facies et iudicabis servos tuos condemnans impium et reddens viam suam super caput eius iustificansque iustum et retribuens ei secundum iustitiam suam";
rsv[33] = "&quot;When thy people Israel are defeated before the enemy because they have sinned against thee, if they turn again to thee, and acknowledge thy name, and pray and make supplication to thee in this house;";
asv[33] = "When thy people Israel are smitten down before the enemy, because they have sinned against thee; if they turn again to thee, and confess thy name, and pray and make supplication unto thee in this house:";
yng[33] = "`In Thy people Israel being smitten before an enemy, because they sin against Thee, and they have turned back unto Thee, and have confessed Thy name, and prayed, and made supplication unto Thee in this house,";
dby[33] = "When thy people Israel are put to the worse before the enemy, because they have sinned against thee, and shall turn again to thee, and confess thy name, and pray, and make supplication unto thee in this house;";
web[33] = "When thy people Israel shall be smitten before the enemy, because they have sinned against thee, and shall turn again to thee, and confess thy name, and pray, and make supplication to thee in this house:";
hnv[33] = "When your people Yisra\'el are struck down before the enemy, because they have sinned against you; if they turn again to you, and confess your name, and pray and make supplication to you in this house:";
vul[33] = "si fugerit populus tuus Israhel inimicos suos quia peccaturus est tibi et agentes paenitentiam et confitentes nomini tuo venerint et oraverint et deprecati te fuerint in domo hac";
rsv[34] = "then hear thou in heaven, and forgive the sin of thy people Israel, and bring them again to the land which thou gavest to their fathers.";
asv[34] = "then hear thou in heaven, and forgive the sin of thy people Israel, and bring them again unto the land which thou gavest unto their fathers.";
yng[34] = "then thou dost hear in the heavens, and hast forgiven the sin of Thy people Israel, and brought them back unto the ground that Thou gavest to their fathers.";
dby[34] = "then hear thou in the heavens, and forgive the sin of thy people Israel, and bring them again unto the land that thou gavest unto their fathers.";
web[34] = "Then hear thou in heaven, and forgive the sin of thy people Israel, and bring them again to the land which thou gavest to their fathers.";
hnv[34] = "then hear you in heaven, and forgive the sin of your people Yisra\'el, and bring them again to the land which you gave to their fathers.";
vul[34] = "exaudi in caelo et dimitte peccatum populi tui Israhel et reduces eos in terram quam dedisti patribus eorum";
rsv[35] = "&quot;When heaven is shut up and there is no rain because they have sinned against thee, if they pray toward this place, and acknowledge thy name, and turn from their sin, when thou dost afflict them,";
asv[35] = "When heaven is shut up, and there is no rain, because they have sinned against thee; if they pray toward this place, and confess thy name, and turn from their sin, when thou dost afflict them:";
yng[35] = "`In the heavens being restrained, and there is no rain, because they sin against Thee, and they have prayed towards this place, and confessed Thy name, and from their sin turn back, for Thou dost afflict them,";
dby[35] = "When the heavens are shut up, and there is no rain, because they have sinned against thee; if they pray toward this place, and confess thy name, and turn from their sin, because thou hast afflicted them;";
web[35] = "When heaven is shut up, and there is no rain, because they have sinned against thee; if they pray towards this place, and confess thy name, and turn from their sin, when thou afflictest them:";
hnv[35] = "When the sky is shut up, and there is no rain, because they have sinned against you; if they pray toward this place, and confess your name, and turn from their sin, when you do afflict them:";
vul[35] = "si clausum fuerit caelum et non pluerit propter peccata eorum et orantes in loco isto paenitentiam egerint nomini tuo et a peccatis suis conversi fuerint propter adflictionem suam";
rsv[36] = "then hear thou in heaven, and forgive the sin of thy servants, thy people Israel, when thou dost teach them the good way in which they should walk; and grant rain upon thy land, which thou hast given to thy people as an inheritance.";
asv[36] = "then hear thou in heaven, and forgive the sin of thy servants, and of thy people Israel, when thou teachest them the good way wherein they should walk; and send rain upon thy land, which thou hast given to thy people for an inheritance.";
yng[36] = "then Thou dost hear in the heavens, and hast forgiven the sin of Thy servants, and of Thy people Israel, for Thou directest them the good way in which they go, and hast given rain on Thy land which Thou hast given to Thy people for inheritance.";
dby[36] = "then hear thou in the heavens, and forgive the sin of thy servants, and of thy people Israel, when thou teachest them the good way wherein they should walk; and give rain upon thy land, which thou hast given to thy people for an inheritance.";
web[36] = "Then hear thou in heaven, and forgive the sin of thy servants, and of thy people Israel, that thou mayest teach them the good way in which they should walk, and give rain upon thy land, which thou hast given to thy people for an inheritance.";
hnv[36] = "then hear in heaven, and forgive the sin of your servants, and of your people Yisra\'el, when you teach them the good way in which they should walk; and send rain on your land, which you have given to your people for an inheritance.";
vul[36] = "exaudi eos in caelo et dimitte peccata servorum tuorum et populi tui Israhel et ostende eis viam bonam per quam ambulent et da pluviam super terram tuam quam dedisti populo tuo in possessionem";
rsv[37] = "&quot;If there is famine in the land, if there is pestilence or blight or mildew or locust or caterpillar; if their enemy besieges them in any of their cities; whatever plague, whatever sickness there is;";
asv[37] = "If there be in the land famine, if there be pestilence, if there be blasting [or] mildew, locust [or] caterpillar; if their enemy besiege them in the land of their cities; whatsoever plague, whatsoever sickness there be;";
yng[37] = "`Famine -- when it is in the land; pestilence -- when it is; blasting, mildew, locust; caterpillar -- when it is; when its enemy hath distressed it in the land [in] its gates, any plague, any sickness, --";
dby[37] = "If there be famine in the land, if there be pestilence, if there be blight, mildew, locust, caterpillar; if their enemy besiege them in the land of their gates; whatever plague, whatever sickness there be:";
web[37] = "If there shall be in the land famine, if there shall be pestilence, blasting, mildew, locust, [or] if there shall be caterpillar; if their enemy shall besiege them in the land of their cities, whatever plague, whatever sickness [there shall be];";
hnv[37] = "If there be in the land famine, if there be pestilence, if there be blasting [or] mildew, arbeh [or] caterpillar; if their enemy besiege them in the land of their cities; whatever plague, whatever sickness there be;";
vul[37] = "fames si oborta fuerit in terra aut pestilentia aut corruptus aer aurugo lucusta rubigo et adflixerit eum et inimicus eius portas obsidens omnis plaga universa infirmitas";
rsv[38] = "whatever prayer, whatever supplication is made by any man or by all thy people Israel, each knowing the affliction of his own heart and stretching out his hands toward this house;";
asv[38] = "what prayer and supplication soever be made by any man, [or] by all thy people Israel, who shall know every man the plague of his own heart, and spread forth his hands toward this house:";
yng[38] = "any prayer, any supplication that [is] of any man of all Thy people Israel, who know each the plague of his own heart, and hath spread his hands towards this house,";
dby[38] = "what prayer, what supplication soever be made by any man, of all thy people Israel, when they shall know every man the plague of his own heart, and shall spread forth his hands toward this house;";
web[38] = "Whatever prayer and supplication shall be [made] by any man, [or] by all thy people Israel, who shall know every man the plague of his own heart, and spread forth his hands towards this house:";
hnv[38] = "whatever prayer and supplication be made by any man, [or] by all your people Yisra\'el, who shall know every man the plague of his own heart, and spread forth his hands toward this house:";
vul[38] = "cuncta devotatio et inprecatio quae acciderit omni homini de populo tuo Israhel si quis cognoverit plagam cordis sui et expanderit manus suas in domo hac";
rsv[39] = "then hear thou in heaven thy dwelling place, and forgive, and act, and render to each whose heart thou knowest, according to all his ways (for thou, thou only, knowest the hearts of all the children of men);";
asv[39] = "then hear thou in heaven thy dwelling-place, and forgive, and do, and render unto every man according to all his ways, whose heart thou knowest; (for thou, even thou only, knowest the hearts of all the children of men;)";
yng[39] = "then Thou dost hear in the heavens, the settled place of Thy dwelling, and hast forgiven, and hast done, and hast given to each according to all his ways, whose heart Thou knowest, (for Thou hast known -- Thyself alone -- the heart of all the sons of man),";
dby[39] = "then hear thou in the heavens, the settled place of thy dwelling, and forgive, and do, and render unto every man according to all his ways, whose heart thou knowest (for thou, thou only, knowest the hearts of all the children of men),";
web[39] = "Then hear thou in heaven thy dwelling-place, and forgive, and do, and give to every man according to his ways, whose heart thou knowest; (for thou, [even] thou only, knowest the hearts of all the children of men;)";
hnv[39] = "then hear in heaven, your dwelling-place, and forgive, and do, and render to every man according to all his ways, whose heart you know; (for you, even you only, know the hearts of all the children of men;)";
vul[39] = "tu audies in caelo in loco habitationis tuae et repropitiaberis et facies ut des unicuique secundum omnes vias suas sicut videris cor eius quia tu nosti solus cor omnium filiorum hominum";
rsv[40] = "that they may fear thee all the days that they live in the land which thou gavest to our fathers.";
asv[40] = "that they may fear thee all the days that they live in the land which thou gavest unto our fathers.";
yng[40] = "so that they fear Thee all the days that they are living on the face of the ground that Thou hast given to our fathers.";
dby[40] = "that they may fear thee all the days that they live upon the land which thou gavest unto our fathers.";
web[40] = "That they may fear thee all the days that they live in the land which thou gavest to our fathers.";
hnv[40] = "that they may fear you all the days that they live in the land which you gave to our fathers.";
vul[40] = "ut timeant te cunctis diebus quibus vivunt super faciem terrae quam dedisti patribus nostris";
rsv[41] = "&quot;Likewise when a foreigner, who is not of thy people Israel, comes from a far country for thy name\'s sake";
asv[41] = "Moreover concerning the foreigner, that is not of thy people Israel, when he shall come out of a far country for thy name\'s sake";
yng[41] = "`And also, unto the stranger who is not of Thy people Israel, and hath come from a land afar off for Thy name\'s sake --";
dby[41] = "And as to the stranger also, who is not of thy people Israel, but cometh out of a far country for thy name\'s sake";
web[41] = "Moreover, concerning a stranger, that [is] not of thy people Israel, but cometh out of a far country for thy name\'s sake;";
hnv[41] = "Moreover concerning the foreigner, who is not of your people Yisra\'el, when he shall come out of a far country for your name\'s sake";
vul[41] = "insuper et alienigena qui non est de populo tuo Israhel cum venerit de terra longinqua propter nomen tuum audietur enim nomen tuum magnum et manus tua fortis et brachium tuum";
rsv[42] = "(for they shall hear of thy great name, and thy mighty hand, and of thy outstretched arm), when he comes and prays toward this house,";
asv[42] = "(for they shall hear of thy great name, and of thy mighty hand, and of thine outstretched arm); when he shall come and pray toward this house;";
yng[42] = "(for they hear of Thy great name, and of Thy strong hand, and of Thy stretched-out arm) -- and he hath come in and prayed towards this house,";
dby[42] = "(for they shall hear of thy great name, and of thy mighty hand, and of thy stretched-out arm); when he shall come and pray toward this house,";
web[42] = "(For they shall hear of thy great name, and of thy strong hand, and of thy out-stretched arm;) when he shall come and pray towards this house;";
hnv[42] = "(for they shall hear of your great name, and of your mighty hand, and of your outstretched arm); when he shall come and pray toward this house;";
vul[42] = "extentum ubique cum venerit ergo et oraverit in loco hoc";
rsv[43] = "hear thou in heaven thy dwelling place, and do according to all for which the foreigner calls to thee; in order that all the peoples of the earth may know thy name and fear thee, as do thy people Israel, and that they may know that this house which I have built is called by thy name.";
asv[43] = "hear thou in heaven thy dwelling-place, and do according to all that the foreigner calleth to thee for; that all the peoples of the earth may know thy name, to fear thee, as doth thy people Israel, and that they may know that this house which I have built is called by thy name.";
yng[43] = "Thou dost hear in the heavens, the settled place of Thy dwelling, and hast done according to all that the stranger calleth unto Thee for, in order that all the peoples of the earth may know Thy name, to fear Thee like Thy people Israel, and to know that Thy name hath been called on this house which I have builded.";
dby[43] = "hear thou in the heavens thy dwelling-place, and do according to all that the stranger calleth to thee for; in order that all peoples of the earth may know thy name, [and] that they may fear thee as do thy people Israel; and that they may know that this house which I have built is called by thy name.";
web[43] = "Hear thou in heaven thy dwelling-place, and do according to all that the stranger calleth to thee for: that all people of the earth may know thy name, to fear thee, as [do] thy people Israel; and that they may know that this house which I have built is called by thy name.";
hnv[43] = "hear in heaven, your dwelling-place, and do according to all that the foreigner calls to you for; that all the peoples of the eretz may know your name, to fear you, as does your people Yisra\'el, and that they may know that this house which I have built is called by my name.";
vul[43] = "tu exaudies in caelo in firmamento habitaculi tui et facies omnia pro quibus invocaverit te alienigena ut discant universi populi terrarum nomen tuum timere sicut populus tuus Israhel et probent quia nomen tuum invocatum est super domum hanc quam aedificavi";
rsv[44] = "&quot;If thy people go out to battle against their enemy, by whatever way thou shalt send them, and they pray to the LORD toward the city which thou hast chosen and the house which I have built for thy name,";
asv[44] = "If thy people go out to battle against their enemy, by whatsoever way thou shalt send them, and they pray unto Jehovah toward the city which thou hast chosen, and toward the house which I have built for thy name;";
yng[44] = "`When Thy people doth go out to battle against its enemy, in the way that Thou dost send them, and they have prayed unto Jehovah the way of the city which thou hast fixed on, and of the house which I have builded for Thy name;";
dby[44] = "If thy people go out to battle against their enemy, by the way that thou shalt send them, and they pray to Jehovah toward the city that thou hast chosen, and the house that I have built unto thy name;";
web[44] = "If thy people go out to battle against their enemy, whithersoever thou shalt send them, and shall pray to the LORD towards the city which thou hast chosen, and [towards] the house that I have built for thy name:";
hnv[44] = "If your people go out to battle against their enemy, by whatever way you shall send them, and they pray to the LORD toward the city which you have chosen, and toward the house which I have built for your name;";
vul[44] = "si egressus fuerit populus tuus ad bellum contra inimicos suos per viam quocumque miseris eos orabunt te contra viam civitatis quam elegisti et contra domum quam aedificavi nomini tuo";
rsv[45] = "then hear thou in heaven their prayer and their supplication, and maintain their cause.";
asv[45] = "then hear thou in heaven their prayer and their supplication, and maintain their cause.";
yng[45] = "then Thou hast heard in the heavens their prayer and their supplication, and hast maintained their cause.";
dby[45] = "then hear thou in the heavens their prayer and their supplication, and maintain their right.";
web[45] = "Then hear thou in heaven their prayer and their supplication, and maintain their cause.";
hnv[45] = "then hear in heaven their prayer and their supplication, and maintain their cause.";
vul[45] = "et exaudies in caelo orationem eorum et preces eorum et facies iudicium eorum";
rsv[46] = "&quot;If they sin against thee--for there is no man who does not sin--and thou art angry with them, and dost give them to an enemy, so that they are carried away captive to the land of the enemy, far off or near;";
asv[46] = "If they sin against thee (for there is no man that sinneth not), and thou be angry with them, and deliver them to the enemy, so that they carry them away captive unto the land of the enemy, far off or near;";
