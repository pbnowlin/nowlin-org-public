csb[1] = "Solomon completed his entire palace complex after thirteen years of construction.";
csb[2] = "He built the House of the Forest of Lebanon. It was one hundred fifty feet long, seventy-five feet wide, and forty-five feet high on four rows of cedar pillars, with cedar beams on top of the pillars.";
csb[3] = "It was paneled above with cedar at the top of the chambers that rested on forty-five pillars, fifteen per row.";
csb[4] = "There were three rows of window frames, facing each other in three tiers.";
csb[5] = "All the doors and doorposts had rectangular frames, the openings facing each other in three tiers.";
csb[6] = "He made the hall of pillars seventy-five feet long and forty-five feet wide. A portico was in front of the pillars, and a canopy with pillars was in front of them.";
csb[7] = "He made the Hall of the Throne where he would judge -- the Hall of Judgment. It was paneled with cedar from the floor to the rafters.";
csb[8] = "Solomon\'s own palace where he would live, in the other courtyard behind the hall, was of similar construction. And he made a house like this hall for Pharaoh\'s daughter, his wife.";
csb[9] = "All of these buildings were of costly stones, cut to size and sawed with saws on the inner and outer surfaces, from foundation to coping and from the outside to the great courtyard.";
csb[10] = "The foundation was made of large, costly stones twelve and fifteen feet long.";
csb[11] = "Above were also costly stones, cut to size, as well as cedar wood.";
csb[12] = "Around the great courtyard, as well as the inner courtyard of the LORD\'s temple and the portico of the temple, were three rows of dressed stone and a row of trimmed cedar beams.";
csb[13] = "King Solomon had Hiram brought from Tyre.";
csb[14] = "He was a widow\'s son from the tribe of Naphtali, and his father was a man of Tyre, a bronze craftsman. Hiram had great skill, understanding, and knowledge to do every kind of bronze work. So he came to King Solomon and carried out all his work.";
csb[15] = "He cast two bronze pillars, each 27 feet high and 18 feet in circumference.";
csb[16] = "He also made two capitals of cast bronze to set on top of the pillars; 7 1/2 feet was the height of the first capital, and 7 1/2 feet was also the height of the second capital.";
csb[17] = "The capitals on top of the pillars had gratings of latticework, wreaths made of chainwork -- seven for the first capital and seven for the second.";
csb[18] = "He made the pillars with two encircling rows of pomegranates on the one grating to cover the capital on top; he did the same for the second capital.";
csb[19] = "And the capitals on top of the pillars in the portico were shaped like lilies, six feet high.";
csb[20] = "The capitals on the two pillars were also immediately above the rounded surface next to the grating, and two hundred pomegranates were in rows encircling each capital.";
csb[21] = "He set up the pillars at the portico of the sanctuary: he set up the right pillar and named it Jachin; then he set up the left pillar and named it Boaz.";
csb[22] = "The tops of the pillars were shaped like lilies. Then the work of the pillars was completed.";
csb[23] = "He made the cast metal basin, 15 feet from brim to brim, perfectly round. It was 7 1/2 feet high and 45 feet in circumference.";
csb[24] = "Ornamental gourds encircled it below the brim, ten every half yard, completely encircling the basin. The gourds were cast in two rows when the basin was cast.";
csb[25] = "It stood on twelve oxen, three facing north, three facing west, three facing south, and three facing east. The basin was on top of them and all their hindquarters were toward the center.";
csb[26] = "The basin was three inches thick, and its rim was fashioned like the brim of a cup or of a lily blossom. It held eleven thousand gallons.";
csb[27] = "Then he made ten bronze water carts. Each water cart was 6 feet long, 6 feet wide, and 4 1/2 feet high.";
csb[28] = "This was the design of the carts: They had frames; the frames were between the cross-pieces,";
csb[29] = "and on the frames between the cross-pieces were lions, oxen, and cherubim. On the cross-pieces there was a pedestal above, and below the lions and oxen were wreaths of hanging work.";
csb[30] = "Each cart had four bronze wheels with bronze axles. Underneath the four corners of the basin were cast supports, each next to a wreath.";
csb[31] = "And the water cart\'s opening inside the crown on top was eighteen inches wide. The opening was round, made as a pedestal twenty-seven inches wide. On it were carvings, but their frames were square, not round.";
csb[32] = "There were four wheels under the frames, and the wheel axles were part of the water cart; each wheel was twenty-seven inches tall.";
csb[33] = "The wheels\' design was similar to that of chariot wheels: their axles, rims, spokes, and hubs were all of cast metal.";
csb[34] = "Four supports were at the four corners of each water cart; each support was one piece with the water cart.";
csb[35] = "At the top of the cart was a band nine inches high encircling it; also, at the top of the cart, its braces and its frames were one piece with it.";
csb[36] = "He engraved cherubim, lions, and palm trees on the plates of its braces and on its frames, wherever each had space, with encircling wreaths.";
csb[37] = "In this way he made the ten water carts using the same casting, dimensions, and shape for all of them.";
csb[38] = "Then he made ten bronze basins -- each basin held 220 gallons and each was six feet wide -- one basin for each of the ten water carts.";
csb[39] = "He set five water carts on the right side of the temple and five on the left side. He put the basin near the right side of the temple toward the southeast.";
csb[40] = "Then Hiram made the basins, the shovels, and the sprinkling basins. So Hiram finished all the work that he was doing for King Solomon on the LORD\'s temple:";
csb[41] = "two pillars; bowls for the capitals that were on top of the two pillars; the two gratings for covering both bowls of the capitals that were on top of the pillars;";
csb[42] = "the four hundred pomegranates for the two gratings (two rows of pomegranates for each grating covering both capitals\' bowls on top of the pillars);";
csb[43] = "the ten water carts; the ten basins on the water carts;";
csb[44] = "the basin; the twelve oxen underneath the basin;";
csb[45] = "and the pots, shovels, and sprinkling basins. All the utensils that Hiram made for King Solomon at the LORD\'s temple were made of burnished bronze.";
csb[46] = "The king had them cast in clay molds in the Jordan Valley between Succoth and Zarethan.";
csb[47] = "Solomon left all the utensils unweighed because there were so many; the weight of the bronze was not determined.";
csb[48] = "Solomon also made all the equipment in the LORD\'s temple: the gold altar; the gold table that the Bread of the Presence was placed on;";
csb[49] = "the pure gold lampstands in front of the inner sanctuary, five on the right and five on the left; the gold flowers, lamps, and tongs;";
csb[50] = "the pure gold ceremonial bowls, wick trimmers, sprinkling basins, ladles, and firepans; and the gold hinges for the doors of the inner temple (that is, the most holy place) and for the doors of the temple sanctuary.";
csb[51] = "So all the work King Solomon did in the LORD\'s temple was completed. Then Solomon brought in the consecrated things of his father David -- the silver, the gold, and the utensils -- and put them in the treasuries of the LORD\'s temple.";

kjv[14] = "He [was] a widow\'s son of the tribe of Naphtali, and his father [was] a man of Tyre, a worker in brass: and he was filled with wisdom, and understanding, and cunning to work all works in brass. And he came to king Solomon, and wrought all his work.";
rsv[14] = "He was the son of a widow of the tribe of Naph\'tali, and his father was a man of Tyre, a worker in bronze; and he was full of wisdom, understanding, and skill, for making any work in bronze. He came to King Solomon, and did all his work.";

kjv[18] = "And he made the pillars, and two rows round about upon the one network, to cover the chapiters that [were] upon the top, with pomegranates: and so did he for the other chapiter.";
rsv[18] = "Likewise he made pomegranates; in two rows round about upon the one network, to cover the capital that was upon the top of the pillar; and he did the same with the other capital.";
asv[18] = "So he made the pillars; and there were two rows round about upon the one network, to cover the capitals that were upon the top of the pillars: and so did he for the other capital.";
yng[18] = "And he maketh the pillars, and two rows round about on the one net-work, to cover the chapiters that [are] on the top, with the pomegranates, and so he hath made for the second chapiter.";
dby[18] = "And he made pomegranates, namely two rows round about upon the one network, to cover the capitals that were upon the top of the pillars; and so he did for the other capital.";
web[18] = "And he made the pillars, and two rows around upon the one net-work, to cover the capitals that [were] upon the top, with pomegranates: and so he did for the other capital.";
hnv[18] = "So he made the pillars; and there were two rows round about on the one network, to cover the capitals that were on the top of the pillars: and so did he for the other capital.";
vul[18] = "et perfecit columnas et duos ordines per circuitum retiaculorum singulorum ut tegerent capitella quae erant super summitatem malogranatorum eodem modo fecit et capitello secundo";
kjv[19] = "And the chapiters that [were] upon the top of the pillars [were] of lily work in the porch, four cubits.";
rsv[19] = "Now the capitals that were upon the tops of the pillars in the vestibule were of lily-work, four cubits.";
asv[19] = "And the capitals that were upon the top of the pillars in the porch were of lily-work, four cubits.";
yng[19] = "And the chapiters that [are] on the top of the pillars [are] of lily-work in the porch, four cubits;";
dby[19] = "And the capitals that were upon the top of the pillars were of lily-work [as] in the porch, four cubits.";
web[19] = "And the capitals that [were] upon the top of the pillars [were] of lily-work in the porch, four cubits.";
hnv[19] = "The capitals that were on the top of the pillars in the porch were of lily-work, four cubits.";
vul[19] = "capitella autem quae erant super capita columnarum quasi opere lilii fabricata erant in porticu quattuor cubitorum";
kjv[20] = "And the chapiters upon the two pillars [had pomegranates] also above, over against the belly which [was] by the network: and the pomegranates [were] two hundred in rows round about upon the other chapiter.";
rsv[20] = "The capitals were upon the two pillars and also above the rounded projection which was beside the network; there were two hundred pomegranates, in two rows round about; and so with the other capital.";
asv[20] = "And there were capitals above also upon the two pillars, close by the belly which was beside the network: and the pomegranates were two hundred, in rows round about upon the other capital.";
yng[20] = "and the chapiters on the two pillars also above, over-against the protuberance that [is] beside the net; and the pomegranates [are] two hundred, in rows round about on the second chapiter.";
dby[20] = "And the capitals upon the two pillars, above also, close to the enlargement which was behind the network, had two hundred pomegranates in rows round about, [also] on the other capital.";
web[20] = "And the capitals upon the two pillars [had pomegranates] also above, over against the belly which [was] by the net-work: and the pomegranates [were] two hundred in rows around upon the other capital.";
hnv[20] = "There were capitals above also on the two pillars, close by the belly which was beside the network: and the pomegranates were two hundred, in rows round about on the other capital.";
vul[20] = "et rursum alia capitella in summitate columnarum desuper iuxta mensuram columnae contra retiacula malogranatorum autem ducenti ordines erant in circuitu capitelli secundi";

rsv[21] = "He set up the pillars at the vestibule of the temple; he set up the pillar on the south and called its name Jachin; and he set up the pillar on the north and called its name Bo\'az.";
asv[21] = "And he set up the pillars at the porch of the temple: and he set up the right pillar, and called the name thereof Jachin; and he set up the left pillar, and called the name thereof Boaz.";
yng[21] = "And he raiseth up the pillars for the porch of the temple, and he raiseth up the right pillar, and calleth its name Jachin, and he raiseth up the left pillar, and calleth its name Boaz;";
dby[21] = "And he set up the pillars for the porch of the temple; and he set up the right pillar, and called its name Jachin; and he set up the left pillar, and called its name Boaz.";
web[21] = "And he set up the pillars in the porch of the temple: and he set up the right pillar, and called its name Jachin: and he set up the left pillar, and called its name Boaz.";
hnv[21] = "He set up the pillars at the porch of the temple: and he set up the right pillar, and called the name of it Yakhin; and he set up the left pillar, and called the name of it Bo`az.";
vul[21] = "et statuit duas columnas in porticum templi cumque statuisset columnam dexteram vocavit eam nomine Iachin similiter erexit columnam secundam et vocavit nomen eius Booz";

rsv[22] = "And upon the tops of the pillars was lily-work. Thus the work of the pillars was finished.";
asv[22] = "And upon the top of the pillars was lily-work: so was the work of the pillars finished.";
yng[22] = "and on the top of the pillars [is] lily-work; and the work of the pillars [is] completed.";
dby[22] = "And upon the top of the pillars was lily-work; and the work of the pillars was finished.";
web[22] = "And upon the top of the pillars [was] lily-work: so was the work of the pillars finished.";
hnv[22] = "On the top of the pillars was lily-work: so was the work of the pillars finished.";
vul[22] = "et super capita columnarum opus in modum lilii posuit perfectumque est opus columnarum";
kjv[23] = "And he made a molten sea, ten cubits from the one brim to the other: [it was] round all about, and his height [was] five cubits: and a line of thirty cubits did compass it round about.";
rsv[23] = "Then he made the molten sea; it was round, ten cubits from brim to brim, and five cubits high, and a line of thirty cubits measured its circumference.";
asv[23] = "And he made the molten sea of ten cubits from brim to brim, round in compass, and the height thereof was five cubits; and a line of thirty cubits compassed it round about.";
yng[23] = "And he maketh the molten sea, ten by the cubit from its edge unto its edge; [it is] round all about, and five by the cubit [is] its height, and a line of thirty by the cubit doth compass it round about;";
dby[23] = "And he made the sea, molten, ten cubits from brim to brim, round all about; and its height was five cubits; and a line of thirty cubits encompassed it round about.";
web[23] = "And he made a molten sea, ten cubits from the one brim to the other: [it was] entirely round, and its hight [was] five cubits: and a line of thirty cubits encompassed it.";
hnv[23] = " He made the molten sea of ten cubits from brim to brim, round in compass, and the height of it was five cubits; and a line of thirty cubits compassed it round about.";
vul[23] = "fecit quoque mare fusile decem cubitorum a labio usque ad labium rotundum in circuitu quinque cubitorum altitudo eius et resticula triginta cubitorum cingebat illud per circuitum";
kjv[24] = "And under the brim of it round about [there were] knops compassing it, ten in a cubit, compassing the sea round about: the knops [were] cast in two rows, when it was cast.";
rsv[24] = "Under its brim were gourds, for thirty cubits, compassing the sea round about; the gourds were in two rows, cast with it when it was cast.";
asv[24] = "And under the brim of it round about there were knops which did compass it, for ten cubits, compassing the sea round about: the knops were in two rows, cast when it was cast.";
yng[24] = "and knops beneath its brim round about are compassing it, ten by the cubit, going round the sea round about; in two rows [are] the knops, cast in its being cast.";
dby[24] = "And under the brim of it round about there were colocynths, encompassing it, ten in a cubit enclosing the sea round about; two rows of colocynths, cast when it was cast.";
web[24] = "And under the brim of it around [there were] knobs compassing it, ten in a cubit, compassing the sea around: the knobs [were] cast in two rows, when it was cast.";
hnv[24] = "Under the brim of it round about there were buds which did compass it, for ten cubits, compassing the sea round about: the buds were in two rows, cast when it was cast.";
vul[24] = "et scalptura subter labium circumibat illud decem cubitis ambiens mare duo ordines scalpturarum histriatarum erant fusiles";

asv[25] = "It stood upon twelve oxen, three looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east; and the sea was set upon them above, and all their hinder parts were inward.";
yng[25] = "It is standing on twelve oxen, three facing the north, and three facing the west, and three facing the south, and three facing the east, and the sea [is] upon them above, and all their hinder parts [are] inward.";
dby[25] = "It stood upon twelve oxen, three looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east; and the sea was above upon them, and all their hinder parts were inward.";

kjv[26] = "And it [was] an hand breadth thick, and the brim thereof was wrought like the brim of a cup, with flowers of lilies: it contained two thousand baths.";
rsv[26] = "Its thickness was a handbreadth; and its brim was made like the brim of a cup, like the flower of a lily; it held two thousand baths.";
asv[26] = "And it was a handbreadth thick: and the brim thereof was wrought like the brim of a cup, like the flower of a lily: it held two thousand baths.";
yng[26] = "And its thickness [is] an handbreadth, and its edge as the work of the edge of a cup, flowers of lilies; two thousand baths it containeth.";
dby[26] = "And its thickness was a hand-breadth, and its brim was like the work of the brim of a cup, with lily-blossoms; it held two thousand baths.";
web[26] = "And it [was] a hand-breadth thick, and its brim was wrought like the brim of a cup, with flowers of lilies: it contained two thousand baths.";
hnv[26] = "It was a handbreadth thick: and the brim of it was worked like the brim of a cup, like the flower of a lily: it held two thousand baths.";
vul[26] = "grossitudo autem luteris trium unciarum erat labiumque eius quasi labium calicis et folium repandi lilii duo milia batos capiebat";
kjv[27] = "And he made ten bases of brass; four cubits [was] the length of one base, and four cubits the breadth thereof, and three cubits the height of it.";
rsv[27] = "He also made the ten stands of bronze; each stand was four cubits long, four cubits wide, and three cubits high.";
asv[27] = "And he made the ten bases of brass; four cubits was the length of one base, and four cubits the breadth thereof, and three cubits the height of it.";
yng[27] = "And he maketh the ten bases of brass; four by the cubit [is] the length of the one base, and four by the cubit its breadth, and three by the cubit its height.";
dby[27] = "And he made ten bases of brass: four cubits was the length of one base, and the breadth four cubits, and the height three cubits.";
web[27] = "And he made ten bases of brass; four cubits [was] the length of one base, and four cubits the breadth of it, and three cubits the hight of it.";
hnv[27] = "He made the ten bases of brass; four cubits was the length of one base, and four cubits the breadth of it, and three cubits the height of it.";

kjv[28] = "And the work of the bases [was] on this [manner]: they had borders, and the borders [were] between the ledges:";
rsv[28] = "This was the construction of the stands: they had panels, and the panels were set in the frames";
asv[28] = "And the work of the bases was on this manner: they had panels; and there were panels between the ledges;";
yng[28] = "And this [is] the work of the base: they have borders, and the borders [are] between the joinings;";
dby[28] = "And the work of the bases was this: they had panels, and the panels were between the fillets.";
web[28] = "And the work of the bases [was] in this [manner]: They had borders, and the borders [were] between the ledges:";
hnv[28] = "The work of the bases was on this manner: they had panels; and there were panels between the ledges;";
vul[28] = "et ipsum opus basium interrasile erat et scalpturae inter iuncturas";
kjv[29] = "And on the borders that [were] between the ledges [were] lions, oxen, and cherubims: and upon the ledges [there was] a base above: and beneath the lions and oxen [were] certain additions made of thin work.";
rsv[29] = "and on the panels that were set in the frames were lions, oxen, and cherubim. Upon the frames, both above and below the lions and oxen, there were wreaths of beveled work.";
asv[29] = "and on the panels that were between the ledges were lions, oxen, and cherubim; and upon the ledges there was a pedestal above; and beneath the lions and oxen were wreaths of hanging work.";
yng[29] = "and on the borders that [are] between the joinings [are] lions, oxen, and cherubs, and on the joinings a base above, and beneath the lions and the oxen [are] additions -- sloping work.";
dby[29] = "And on the panels that were between the fillets were lions, oxen and cherubim; and over the fillets there was a base above; and beneath the lions and oxen were garlands of festoon-work.";
web[29] = "And on the borders that [were] between the ledges [were] lions, oxen, and cherubim: and upon the ledges [there was] a base above: and beneath the lions and oxen [were] certain additions made of thin work.";
hnv[29] = "and on the panels that were between the ledges were lions, oxen, and Keruvim; and on the ledges there was a pedestal above; and beneath the lions and oxen were wreaths of hanging work.";
vul[29] = "et inter coronulas et plectas leones et boves et cherubin et in iuncturis similiter desuper et subter leones et boves quasi lora ex aere dependentia";
kjv[30] = "And every base had four brasen wheels, and plates of brass: and the four corners thereof had undersetters: under the laver [were] undersetters molten, at the side of every addition.";
rsv[30] = "Moreover each stand had four bronze wheels and axles of bronze; and at the four corners were supports for a laver. The supports were cast, with wreaths at the side of each.";
asv[30] = "And every base had four brazen wheels, and axles of brass; and the four feet thereof had undersetters: beneath the laver were the undersetters molten, with wreaths at the side of each.";
yng[30] = "And four wheels of brass [are] to the one base, and axles of brass; and its four corners have shoulders -- under the laver [are] the molten shoulders, beside each addition.";
dby[30] = "And every base had four wheels of brass, and axles of brass; and on its four corners were shoulder-pieces: under the laver were shoulder-pieces molten, behind every garland.";
web[30] = "And every base had four brazen wheels, and plates of brass: and the four corners of it had undersetters: under the laver [were] undersetters molten, at the side of every addition.";
hnv[30] = "Every base had four brazen wheels, and axles of brass; and the four feet of it had supports: beneath the basin were the supports molten, with wreaths at the side of each.";
vul[30] = "et quattuor rotae per bases singulas et axes aerei et per quattuor partes quasi umeruli subter luterem fusiles contra se invicem respectantes";
kjv[31] = "And the mouth of it within the chapiter and above [was] a cubit: but the mouth thereof [was] round [after] the work of the base, a cubit and an half: and also upon the mouth of it [were] gravings with their borders, foursquare, not round.";
rsv[31] = "Its opening was within a crown which projected upward one cubit; its opening was round, as a pedestal is made, a cubit and a half deep. At its opening there were carvings; and its panels were square, not round.";
asv[31] = "And the mouth of it within the capital and above was a cubit: and the mouth thereof was round after the work of a pedestal, a cubit and a half; and also upon the mouth of it were gravings, and their panels were foursquare, not round.";
yng[31] = "And its mouth within the chapiter and above [is] by the cubit, and its mouth [is] round, the work of the base, a cubit and half a cubit; and also on its mouth [are] carvings and their borders, square, not round.";
dby[31] = "And the mouth of it within the crown and above was a cubit; and its mouth was rounded, [as] the work of the base, a cubit and a half; and also upon its mouth was sculpture; but their panels were square, not round.";
web[31] = "And the mouth of it within the capital and above [was] a cubit: but the mouth of it [was] round [after] the work of the base, a cubit and a half: and also upon the mouth of it [were] gravings with their borders, foursquare, not round.";
hnv[31] = "The mouth of it within the capital and above was a cubit: and the mouth of it was round after the work of a pedestal, a cubit and a half; and also on the mouth of it were engravings, and their panels were foursquare, not round.";
vul[31] = "os quoque luteris intrinsecus erat in capitis summitate et quod forinsecus apparebat unius cubiti erat totum rotundum pariterque habebat unum cubitum et dimidium in angulis autem columnarum variae celaturae erant et media intercolumnia quadrata non rotunda";
kjv[32] = "And under the borders [were] four wheels; and the axletrees of the wheels [were joined] to the base: and the height of a wheel [was] a cubit and half a cubit.";
rsv[32] = "And the four wheels were underneath the panels; the axles of the wheels were of one piece with the stands; and the height of a wheel was a cubit and a half.";
asv[32] = "And the four wheels were underneath the panels; and the axletrees of the wheels were in the base: and the height of a wheel was a cubit and half a cubit.";
yng[32] = "And the four wheels [are] under the borders, and the spokes of the wheels [are] in the base, and the height of the one wheel [is] a cubit and half a cubit.";
dby[32] = "And the four wheels were under the panels; and the supports of the wheels were in the base; and the height of a wheel was a cubit and half a cubit.";
web[32] = "And under the borders [were] four wheels; and the axletrees of the wheels [were joined] to the base: and the hight of a wheel [was] a cubit and half a cubit.";
hnv[32] = " The four wheels were underneath the panels; and the axles of the wheels were in the base: and the height of a wheel was a cubit and half a cubit.";
vul[32] = "quattuor quoque rotae quae per quattuor angulos basis erant coherebant subter basi una rota habebat altitudinis cubitum et semis";
kjv[33] = "And the work of the wheels [was] like the work of a chariot wheel: their axletrees, and their naves, and their felloes, and their spokes, [were] all molten.";
rsv[33] = "The wheels were made like a chariot wheel; their axles, their rims, their spokes, and their hubs, were all cast.";
asv[33] = "And the work of the wheels was like the work of a chariot wheel: their axletrees, and their felloes, and their spokes, and their naves, were all molten.";
yng[33] = "And the work of the wheels [is] as the work of the wheel of a chariot, their spokes, and their axles, and their felloes, and their naves; the whole [is] molten.";
dby[33] = "And the work of the wheels was like the work of a chariot wheel: their supports, and their rims, and their spokes and their naves were all molten.";
web[33] = "And the work of the wheels [was] like the work of a chariot wheel: their axletrees, and their naves, and their fellies, and their spokes, [were] all molten.";
hnv[33] = "The work of the wheels was like the work of a chariot wheel: their axles, and their rims, and their spokes, and their naves, were all molten.";
vul[33] = "tales autem rotae erant quales solent in curru fieri et axes earum et radii et canti et modioli omnia fusilia";
kjv[34] = "And [there were] four undersetters to the four corners of one base: [and] the undersetters [were] of the very base itself.";
rsv[34] = "There were four supports at the four corners of each stand; the supports were of one piece with the stands.";
asv[34] = "And there were four undersetters at the four corners of each base: the undersetters thereof were of the base itself.";
yng[34] = "And four shoulders [are] unto the four corners of the one base; out of the base [are] its shoulders.";
dby[34] = "And there were four shoulder-pieces to the four corners of one base; of the base itself were its shoulder-pieces.";
web[34] = "And [there were] four undersetters to the four corners of one base: [and] the undersetters [were] of the very base itself.";
hnv[34] = "There were four supports at the four corners of each base: the supports of it were of the base itself.";
vul[34] = "nam et umeruli illi quattuor per singulos angulos basis unius ex ipsa basi fusiles et coniuncti erant";
kjv[35] = "And in the top of the base [was there] a round compass of half a cubit high: and on the top of the base the ledges thereof and the borders thereof [were] of the same.";
rsv[35] = "And on the top of the stand there was a round band half a cubit high; and on the top of the stand its stays and its panels were of one piece with it.";
asv[35] = "And in the top of the base was there a round compass half a cubit high; and on the top of the base the stays thereof and the panels thereof were of the same.";
yng[35] = "And in the top of the base [is] the half of a cubit in the height all round about; and on the top of the base its spokes and its borders [are] of the same.";
dby[35] = "And in the top of the base there was a circular elevation of half a cubit round about; and on the top of the base its stays and its panels were of the same.";
web[35] = "And in the top of the base [was there] a round compass of half a cubit high: and on the top of the base its ledges and its borders [were] of the same.";
hnv[35] = "In the top of the base was there a round compass half a cubit high; and on the top of the base the stays of it and the panels of it were of the same.";
vul[35] = "in summitate autem basis erat quaedam rotunditas dimidii cubiti ita fabrefacta ut luter desuper possit inponi habens celaturas suas et scalpturas varias ex semet ipso";

rsv[36] = "And on the surfaces of its stays and on its panels, he carved cherubim, lions, and palm trees, according to the space of each, with wreaths round about.";
asv[36] = "And on the plates of the stays thereof, and on the panels thereof, he graved cherubim, lions, and palm-trees, according to the space of each, with wreaths round about.";
yng[36] = "And he openeth on the tablets of its spokes, and on its borders, cherubs, lions, and palm-trees, according to the void space of each, and additions round about.";
dby[36] = "And he engraved on the plates of its stays and on its panels cherubim, lions and palm-trees, according to the space upon each; and garlands were round about.";
web[36] = "For on the plates of its ledges, and on its borders, he graved cherubim, lions, and palm trees, according to the proportion of every one, and additions around.";
hnv[36] = "On the plates of the stays of it, and on the panels of it, he engraved Keruvim, lions, and palm trees, according to the space of each, with wreaths round about.";
vul[36] = "scalpsit quoque in tabulatis illis quae erant ex aere et in angulis cherubin et leones et palmas quasi in similitudinem stantis hominis ut non celata sed adposita per circuitum viderentur";
kjv[37] = "After this [manner] he made the ten bases: all of them had one casting, one measure, [and] one size.";
rsv[37] = "After this manner he made the ten stands; all of them were cast alike, of the same measure and the same form.";
asv[37] = "After this manner he made the ten bases: all of them had one casting, one measure, and one form.";
yng[37] = "Thus he hath made the ten bases; one casting, one measure, one form, have they all.";
dby[37] = "After this [manner] he made the ten bases: all of them had one casting, one measure, one form.";
