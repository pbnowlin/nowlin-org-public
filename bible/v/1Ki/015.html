csb[1] = "In the eighteenth year of Israel\'s King Jeroboam son of Nebat, Abijam became king over Judah,";
csb[2] = "and he reigned three years in Jerusalem. His mother\'s name was Maacah daughter of Abishalom.";
csb[3] = "Abijam walked in all the sins his father before him had committed, and he was not wholeheartedly devoted to the LORD his God as his ancestor David had been.";
csb[4] = "But for the sake of David, the LORD his God gave him a lamp in Jerusalem by raising up his son after him and by preserving Jerusalem.";
csb[5] = "For David did what was right in the LORD\'s sight, and he did not turn aside from anything he had commanded him all the days of his life, except in the matter of Uriah the Hethite.";
csb[6] = "There had been war between Rehoboam and Jeroboam all the days of Rehoboam\'s life.";
csb[7] = "The rest of the events of Abijam\'s reign, along with all his accomplishments, are written in the Historical Record of Judah\'s Kings. There was also war between Abijam and Jeroboam.";
csb[8] = "Abijam rested with his fathers and was buried in the city of David. His son Asa became king in his place.";
csb[9] = "In the twentieth year of Israel\'s King Jeroboam, Asa became king of Judah,";
csb[10] = "and he reigned forty-one years in Jerusalem. His grandmother\'s name was Maacah daughter of Abishalom.";
csb[11] = "Asa did what was right in the LORD\'s sight, as his ancestor David had done.";
csb[12] = "He banished the male cult prostitutes from the land and removed all of the idols that his fathers had made.";
csb[13] = "He also removed his grandmother Maacah from being queen mother because she had made an obscene image of Asherah. Asa chopped down her obscene image and burned it in the Kidron Valley.";
csb[14] = "The high places were not taken away, but Asa was wholeheartedly devoted to the LORD his entire life.";
csb[15] = "He brought his father\'s consecrated gifts and his own consecrated gifts into the LORD\'s temple: silver, gold, and utensils.";
csb[16] = "There was war between Asa and King Baasha of Israel throughout their reigns.";
csb[17] = "Israel\'s King Baasha went to war against Judah. He built Ramah in order to keep anyone from leaving or coming to King Asa of Judah.";
csb[18] = "So Asa withdrew all the silver and gold that remained in the treasuries of the LORD\'s temple and the treasuries of the royal palace and gave it to his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon son of Hezion king of Aram who lived in Damascus, saying,";
csb[19] = "&quot;There is a treaty between me and you, between my father and your father. Look, I have sent you a gift of silver and gold. Go and break your treaty with King Baasha of Israel so that he will withdraw from me.&quot;";
csb[20] = "Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel. He attacked Ijon, Dan, Abel-beth-maacah, all Chinnereth, and the whole land of Naphtali.";
csb[21] = "When Baasha heard about it, he quit building Ramah and stayed in Tirzah.";
csb[22] = "Then King Asa gave a command to everyone without exception in Judah, and they carried away the stones of Ramah and the timbers Baasha had built it with. Then King Asa built Geba of Benjamin and Mizpah with them.";
csb[23] = "The rest of all the events of Asa\'s reign, along with all his might, all his accomplishments, and the cities he built, are written in the Historical Record of Judah\'s Kings. But in his old age he developed a disease in his feet.";
csb[24] = "Then Asa rested with his fathers and was buried in the city of his ancestor David. His son Jehoshaphat became king in his place.";
csb[25] = "Nadab son of Jeroboam became king over Israel in the second year of Judah\'s King Asa; he reigned over Israel two years.";
csb[26] = "Nadab did what was evil in the LORD\'s sight and walked in the ways of his father and the sin he had caused Israel to commit.";
csb[27] = "Then Baasha son of Ahijah of the house of Issachar conspired against Nadab, and Baasha struck him down at Gibbethon of the Philistines while Nadab and all Israel were besieging Gibbethon.";
csb[28] = "In the third year of Judah\'s King Asa, Baasha killed Nadab and reigned in his place.";
csb[29] = "When Baasha became king, he struck down the entire house of Jeroboam. He did not leave Jeroboam any survivors but destroyed his family according to the word of the LORD he had spoken through his servant Ahijah the Shilonite.";
csb[30] = "This was because Jeroboam had angered the LORD God of Israel by the sins he had committed and had caused Israel to commit.";
csb[31] = "The rest of the events of Nadab\'s reign, along with all his accomplishments, are written in the Historical Record of Israel\'s Kings.";
csb[32] = "There was war between Asa and King Baasha of Israel throughout their reigns.";
csb[33] = "In the third year of Judah\'s King Asa, Baasha son of Ahijah became king over all Israel, and he reigned in Tirzah twenty-four years.";
csb[34] = "He did what was evil in the LORD\'s sight and walked in the ways of Jeroboam and the sin he had caused Israel to commit.";

asv[19] = "[There is] a league between me and thee, between my father and thy father: behold, I have sent unto thee a present of silver and gold; go, break thy league with Baasha king of Israel, that he may depart from me.";
yng[19] = "`A covenant [is] between me and thee, between my father and thy father; lo, I have sent to thee a reward of silver and gold; go, break thy covenant with Baasha king of Israel, and he goeth up from off me.\'";
dby[19] = "There is a league between me and thee, [as] between my father and thy father; behold, I send thee a present of silver and gold: go, break thy league with Baasha king of Israel, that he may depart from me.";
web[19] = "[There is] a league between me and thee, [and] between my father and thy father: behold, I have sent to thee a present of silver and gold; come and break thy league with Baasha king of Israel, that he may depart from me.";
hnv[19] = "[There is] a league between me and you, between my father and your father: behold, I have sent to you a present of silver and gold; go, break your league with Ba`sha king of Yisra\'el, that he may depart from me.";
vul[19] = "foedus est inter me et te et inter patrem meum et patrem tuum ideo misi tibi munera argentum et aurum et peto ut venias et irritum facias foedus quod habes cum Baasa rege Israhel et recedat a me";
kjv[20] = "So Benhadad hearkened unto king Asa, and sent the captains of the hosts which he had against the cities of Israel, and smote Ijon, and Dan, and Abelbethmaachah, and all Cinneroth, with all the land of Naphtali.";
rsv[20] = "And Ben-ha\'dad hearkened to King Asa, and sent the commanders of his armies against the cities of Israel, and conquered Ijon, Dan, A\'bel-beth-ma\'acah, and all Chin\'neroth, with all the land of Naph\'tali.";
asv[20] = "And Ben-hadad hearkened unto king Asa, and sent the captains of his armies against the cities of Israel, and smote Ijon, and Dan, and Abel-beth-maacah, and all Chinneroth, with all the land of Naphtali.";
yng[20] = "And Ben-Hadad hearkeneth unto king Asa, and sendeth the heads of the forces that he hath against cities of Israel, and smiteth Ijon, and Dan, and Abel-Beth-Maachah, and all Chinneroth, besides all the land of Naphtali;";
dby[20] = "And Ben-Hadad hearkened to king Asa, and sent the captains of his forces against the cities of Israel, and smote Ijon, and Dan, and Abel-Beth-Maachah, and all Kinneroth, with all the land of Naphtali.";
web[20] = "So Ben-hadad hearkened to king Asa, and sent the captains of the armies which he had against the cities of Israel, and smote Ijon, and Dan, and Abel-beth-maachah, and all Cinneroth, with all the land of Naphtali.";
hnv[20] = "Ben-Hadad listened to king Asa, and sent the captains of his armies against the cities of Yisra\'el, and struck `Iyon, and Dan, and Avel-Beit-Ma`akhah, and all Kinnarot, with all the land of Naftali.";
vul[20] = "adquiescens Benadad regi Asa misit principes exercitus sui in civitates Israhel et percusserunt Ahion et Dan et Abel domum Maacha et universam Cenneroth omnem scilicet terram Nepthalim";
kjv[21] = "And it came to pass, when Baasha heard [thereof], that he left off building of Ramah, and dwelt in Tirzah.";
rsv[21] = "And when Ba\'asha heard of it, he stopped building Ramah, and he dwelt in Tirzah.";
asv[21] = "And it came to pass, when Baasha heard thereof, that he left off building Ramah, and dwelt in Tirzah.";
yng[21] = "and it cometh to pass at Baasha\'s hearing, that he ceaseth from building Ramah, and dwelleth in Tirzah.";
dby[21] = "And it came to pass when Baasha heard of it, that he left off building Ramah, and dwelt in Tirzah.";
web[21] = "And it came to pass, when Baasha heard [of it], that he left off building of Ramah, and dwelt in Tirzah.";
hnv[21] = "It happened, when Ba`sha heard of it, that he left off building Ramah, and lived in Tirtzah.";
vul[21] = "quod cum audisset Baasa intermisit aedificare Rama et reversus est in Thersa";
kjv[22] = "Then king Asa made a proclamation throughout all Judah; none [was] exempted: and they took away the stones of Ramah, and the timber thereof, wherewith Baasha had builded; and king Asa built with them Geba of Benjamin, and Mizpah.";
rsv[22] = "Then King Asa made a proclamation to all Judah, none was exempt, and they carried away the stones of Ramah and its timber, with which Ba\'asha had been building; and with them King Asa built Geba of Benjamin and Mizpah.";
asv[22] = "Then king Asa made a proclamation unto all Judah; none was exempted: and they carried away the stones of Ramah, and the timber thereof, wherewith Baasha had builded; and king Asa built therewith Geba of Benjamin, and Mizpah.";
yng[22] = "And king Asa hath summoned all Judah -- there is none exempt -- and they lift up the stones of Ramah, and its wood, that Baasha hath built, and king Asa buildeth with them Geba of Benjamin, and Mizpah.";
dby[22] = "And king Asa called together all Judah: none was exempted; and they carried away the stones and the timber from Ramah, with which Baasha had been building; and king Asa built with them Geba of Benjamin, and Mizpah.";
web[22] = "Then king Asa made a proclamation throughout all Judah; none [was] exempted: and they took away the stones of Ramah, and its timber, with which Baasha had built it; and king Asa built with them Geba of Benjamin, and Mizpah.";
hnv[22] = "Then king Asa made a proclamation to all Yehudah; none was exempted: and they carried away the stones of Ramah, and the timber of it, with which Ba`sha had built; and king Asa built therewith Geva of Binyamin, and Mitzpah.";
vul[22] = "rex autem Asa nuntium misit in omnem Iudam nemo sit excusatus et tulerunt lapides Rama et ligna eius quibus aedificaverat Baasa et extruxit de eis rex Asa Gaba Beniamin et Maspha";
kjv[23] = "The rest of all the acts of Asa, and all his might, and all that he did, and the cities which he built, [are] they not written in the book of the chronicles of the kings of Judah? Nevertheless in the time of his old age he was diseased in his feet.";
rsv[23] = "Now the rest of all the acts of Asa, all his might, and all that he did, and the cities which he built, are they not written in the Book of the Chronicles of the Kings of Judah? But in his old age he was diseased in his feet.";
asv[23] = "Now the rest of all the acts of Asa, and all his might, and all that he did, and the cities which he built, are they not written in the book of the chronicles of the kings of Judah? But in the time of his old age he was diseased in his feet.";
yng[23] = "And the rest of all the matters of Asa, and all his might, and all that he did, and the cities that he built, are they not written on the book of the Chronicles of the kings of Judah? Only, at the time of his old age he was diseased in his feet;";
dby[23] = "And the rest of all the acts of Asa, and all his might, and all that he did, and the cities that he built, are they not written in the book of the chronicles of the kings of Judah? Only, in the time of his old age he was diseased in his feet.";
web[23] = "The rest of all the acts of Asa, and all his might, and all that he did, and the cities which he built, [are] they not written in the book of the chronicles of the kings of Judah? Nevertheless in the time of his old age he was diseased in his feet.";
hnv[23] = "Now the rest of all the acts of Asa, and all his might, and all that he did, and the cities which he built, aren\'t they written in the book of the chronicles of the kings of Yehudah? But in the time of his old age he was diseased in his feet.";
vul[23] = "reliqua autem omnium sermonum Asa et universae fortitudines eius et cuncta quae fecit et civitates quas extruxit nonne haec scripta sunt in libro verborum dierum regum Iuda verumtamen in tempore senectutis suae doluit pedes";
kjv[24] = "And Asa slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoshaphat his son reigned in his stead.";
rsv[24] = "And Asa slept with his fathers, and was buried with his fathers in the city of David his father; and Jehosh\'aphat his son reigned in his stead.";
asv[24] = "And Asa slept with his fathers, and was buried with his fathers in the city of David his father; and Jehoshaphat his son reigned in his stead.";
yng[24] = "and Asa lieth with his fathers, and is buried with his fathers in the city of David his father, and Jehoshaphat his son reigneth in his stead.";
dby[24] = "And Asa slept with his fathers, and was buried with his fathers in the city of David his father. And Jehoshaphat his son reigned in his stead.";
web[24] = "And Asa slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoshaphat his son reigned in his stead.";
hnv[24] = "Asa slept with his fathers, and was buried with his fathers in the city of David his father; and Yehoshafat his son reigned in his place.";
vul[24] = "et dormivit cum patribus suis et sepultus est cum eis in civitate David patris sui regnavitque Iosaphat filius eius pro eo";
kjv[25] = "And Nadab the son of Jeroboam began to reign over Israel in the second year of Asa king of Judah, and reigned over Israel two years.";
rsv[25] = "Nadab the son of Jerobo\'am began to reign over Israel in the second year of Asa king of Judah; and he reigned over Israel two years.";
asv[25] = "And Nadab the son of Jeroboam began to reign over Israel in the second year of Asa king of Judah; and he reigned over Israel two years.";
yng[25] = "And Nadab son of Jeroboam hath reigned over Israel, in the second year of Asa king of Judah, and he reigneth over Israel two years,";
dby[25] = "And Nadab the son of Jeroboam began to reign over Israel in the second year of Asa king of Judah; and he reigned over Israel two years.";
web[25] = "And Nadab the son of Jeroboam began to reign over Israel in the second year of Asa king of Judah, and reigned over Israel two years.";
hnv[25] = "Nadav the son of Yarov`am began to reign over Yisra\'el in the second year of Asa king of Yehudah; and he reigned over Yisra\'el two years.";
vul[25] = "Nadab vero filius Hieroboam regnavit super Israhel anno secundo Asa regis Iuda regnavitque super Israhel duobus annis";
kjv[26] = "And he did evil in the sight of the LORD, and walked in the way of his father, and in his sin wherewith he made Israel to sin.";
rsv[26] = "He did what was evil in the sight of the LORD, and walked in the way of his father, and in his sin which he made Israel to sin.";
asv[26] = "And he did that which was evil in the sight of Jehovah, and walked in the way of his father, and in his sin wherewith he made Israel to sin.";
yng[26] = "and doth the evil thing in the eyes of Jehovah, and goeth in the way of his father, and in his sin that he made Israel to sin.";
dby[26] = "And he did evil in the sight of Jehovah, and walked in the way of his father, and in his sin with which he made Israel sin.";
web[26] = "And he did evil in the sight of the LORD, and walked in the way of his father, and in his sin with which he made Israel to sin.";
hnv[26] = "He did that which was evil in the sight of the LORD, and walked in the way of his father, and in his sin with which he made Yisra\'el to sin.";
vul[26] = "et fecit quod malum est in conspectu Domini et ambulavit in viis patris sui et in peccatis eius quibus peccare fecit Israhel";
kjv[27] = "And Baasha the son of Ahijah, of the house of Issachar, conspired against him; and Baasha smote him at Gibbethon, which [belonged] to the Philistines; for Nadab and all Israel laid siege to Gibbethon.";
rsv[27] = "Ba\'asha the son of Ahi\'jah, of the house of Is\'sachar, conspired against him; and Ba\'asha struck him down at Gib\'bethon, which belonged to the Philistines; for Nadab and all Israel were laying siege to Gib\'bethon.";
asv[27] = "And Baasha the son of Ahijah, of the house of Issachar, conspired against him; and Baasha smote him at Gibbethon, which belonged to the Philistines; for Nadab and all Israel were laying siege to Gibbethon.";
yng[27] = "And conspire against him doth Baasha son of Ahijah, of the house of Issachar, and Baasha smiteth him in Gibbethon, which [is] to the Philistines -- and Nadab and all Israel are laying siege against Gibbethon --";
dby[27] = "And Baasha the son of Ahijah, of the house of Issachar, conspired against him; and Baasha smote him at Gibbethon, which [belonged] to the Philistines, when Nadab and all Israel were besieging Gibbethon.";
web[27] = "And Baasha the son of Ahijah, of the house of Issachar, conspired against him; and Baasha smote him at Gibbethon, which [belonged] to the Philistines; for Nadab and all Israel laid siege to Gibbethon.";
hnv[27] = " Ba`sha the son of Achiyah, of the house of Yissakhar, conspired against him; and Ba`sha struck him at Gibbeton, which belonged to the Pelishtim; for Nadav and all Yisra\'el were laying siege to Gibbeton.";
vul[27] = "insidiatus est autem ei Baasa filius Ahia de domo Isachar et percussit eum in Gebbethon quae est urbs Philisthinorum siquidem Nadab et omnis Israhel obsidebant Gebbethon";
kjv[28] = "Even in the third year of Asa king of Judah did Baasha slay him, and reigned in his stead.";
rsv[28] = "So Ba\'asha killed him in the third year of Asa king of Judah, and reigned in his stead.";
asv[28] = "Even in the third year of Asa king of Judah did Baasha slay him, and reigned in his stead.";
yng[28] = "yea, Baasha putteth him to death in the third year of Asa king of Judah, and reigneth in his stead.";
dby[28] = "And Baasha slew him in the third year of Asa king of Judah, and reigned in his stead.";
web[28] = "Even in the third year of Asa king of Judah did Baasha slay him, and reigned in his stead.";
hnv[28] = "Even in the third year of Asa king of Yehudah did Ba`sha kill him, and reigned in his place.";
vul[28] = "interfecit igitur illum Baasa in anno tertio Asa regis Iuda et regnavit pro eo";
kjv[29] = "And it came to pass, when he reigned, [that] he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according unto the saying of the LORD, which he spake by his servant Ahijah the Shilonite:";
rsv[29] = "And as soon as he was king, he killed all the house of Jerobo\'am; he left to the house of Jerobo\'am not one that breathed, until he had destroyed it, according to the word of the LORD which he spoke by his servant Ahi\'jah the Shi\'lonite;";
asv[29] = "And it came to pass that, as soon as he was king, he smote all the house of Jeroboam: he left not to Jeroboam any that breathed, until he had destroyed him; according unto the saying of Jehovah, which he spake by his servant Ahijah the Shilonite;";
yng[29] = "And it cometh to pass, at his reigning, he hath smitten the whole house of Jeroboam, he hath not left any breathing to Jeroboam till his destroying him, according to the word of Jehovah, that He spake by the hand of His servant Ahijah the Shilonite,";
dby[29] = "And it came to pass when he was king, he smote all the house of Jeroboam; he left to Jeroboam none that breathed; until he had destroyed him, according to the word of Jehovah which he spoke by his servant Ahijah the Shilonite,";
web[29] = "And it came to pass, when he reigned, [that] he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according to the saying of the LORD, which he spoke by his servant Ahijah the Shilonite:";
hnv[29] = "It happened that, as soon as he was king, he struck all the house of Yarov`am: he didn\'t leave to Yarov`am any who breathed, until he had destroyed him; according to the saying of the LORD, which he spoke by his servant Achiyah the Shiloni;";
vul[29] = "cumque regnasset percussit omnem domum Hieroboam non dimisit ne unam quidem animam de semine eius donec deleret eum iuxta verbum Domini quod locutus fuerat in manu servi sui Ahiae Silonitis";
kjv[30] = "Because of the sins of Jeroboam which he sinned, and which he made Israel sin, by his provocation wherewith he provoked the LORD God of Israel to anger.";
rsv[30] = "it was for the sins of Jerobo\'am which he sinned and which he made Israel to sin, and because of the anger to which he provoked the LORD, the God of Israel.";
asv[30] = "for the sins of Jeroboam which he sinned, and wherewith he made Israel to sin, because of his provocation wherewith he provoked Jehovah, the God of Israel, to anger.";
yng[30] = "because of the sins of Jeroboam that he sinned, and that he caused Israel to sin, by his provocation with which he provoked to anger Jehovah, God of Israel.";
dby[30] = "because of the sins of Jeroboam which he sinned, and wherewith he made Israel to sin; by his provocation with which he provoked Jehovah the God of Israel to anger.";
web[30] = "Because of the sins of Jeroboam which he sinned, and which he made Israel sin, by his provocation with which he provoked the LORD God of Israel to anger.";
hnv[30] = "for the sins of Yarov`am which he sinned, and with which he made Yisra\'el to sin, because of his provocation with which he provoked the LORD, the God of Yisra\'el, to anger.";
vul[30] = "propter peccata Hieroboam quae peccaverat et quibus peccare fecerat Israhel et propter delictum quo inritaverat Dominum Deum Israhel";
kjv[31] = "Now the rest of the acts of Nadab, and all that he did, [are] they not written in the book of the chronicles of the kings of Israel?";
rsv[31] = "Now the rest of the acts of Nadab, and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?";
asv[31] = "Now the rest of the acts of Nadab, and all that he did, are they not written in the book of the chronicles of the kings of Israel?";
yng[31] = "And the rest of the matters of Nadab, and all that he did, are they not written on the book of the Chronicles of the kings of Israel?";
dby[31] = "And the rest of the acts of Nadab, and all that he did, are they not written in the book of the chronicles of the kings of Israel?";
web[31] = "Now the rest of the acts of Nadab, and all that he did, [are] they not written in the book of the chronicles of the kings of Israel?";
hnv[31] = "Now the rest of the acts of Nadav, and all that he did, aren\'t they written in the book of the chronicles of the kings of Yisra\'el?";
vul[31] = "reliqua autem sermonum Nadab et omnia quae operatus est nonne haec scripta sunt in libro verborum dierum regum Israhel";
kjv[32] = "And there was war between Asa and Baasha king of Israel all their days.";
rsv[32] = "And there was war between Asa and Ba\'asha king of Israel all their days.";
asv[32] = "And there was war between Asa and Baasha king of Israel all their days.";
yng[32] = "And war hath been between Asa and Baasha king of Israel all their days.";
dby[32] = "And there was war between Asa and Baasha king of Israel all their days.";
web[32] = "And there was war between Asa and Baasha king of Israel all their days.";
hnv[32] = "There was war between Asa and Ba`sha king of Yisra\'el all their days.";
vul[32] = "fuitque bellum inter Asa et Baasa regem Israhel cunctis diebus eorum";
kjv[33] = "In the third year of Asa king of Judah began Baasha the son of Ahijah to reign over all Israel in Tirzah, twenty and four years.";
rsv[33] = "In the third year of Asa king of Judah, Ba\'asha the son of Ahi\'jah began to reign over all Israel at Tirzah, and reigned twenty-four years.";
asv[33] = "In the third year of Asa king of Judah began Baasha the son of Ahijah to reign over all Israel in Tirzah, [and reigned] twenty and four years.";
yng[33] = "In the third year of Asa king of Judah reigned hath Baasha son of Ahijah over all Israel in Tirzah, twenty and four years,";
dby[33] = "In the third year of Asa king of Judah began Baasha the son of Ahijah to reign over all Israel in Tirzah, for twenty-four years.";
web[33] = "In the third year of Asa king of Judah began Baasha the son of Ahijah to reign over all Israel in Tirzah, twenty and four years.";
hnv[33] = "In the third year of Asa king of Yehudah began Ba`sha the son of Achiyah to reign over all Yisra\'el in Tirtzah, [and reigned] twenty-four years.";
vul[33] = "anno tertio Asa regis Iuda regnavit Baasa filius Ahia super omnem Israhel in Thersa viginti quattuor annis";
kjv[34] = "And he did evil in the sight of the LORD, and walked in the way of Jeroboam, and in his sin wherewith he made Israel to sin.";
rsv[34] = "He did what was evil in the sight of the LORD, and walked in the way of Jerobo\'am and in his sin which he made Israel to sin.";
asv[34] = "And he did that which was evil in the sight of Jehovah, and walked in the way of Jeroboam, and in his sin wherewith he made Israel to sin.";
yng[34] = "and he doth the evil thing in the eyes of Jehovah, and walketh in the way of Jeroboam, and in his sin that he caused Israel to sin.";
dby[34] = "And he did evil in the sight of Jehovah, and walked in the way of Jeroboam, and in his sin where with he made Israel to sin.";
web[34] = "And he did evil in the sight of the LORD, and walked in the way of Jeroboam, and in his sin with which he made Israel to sin.";
hnv[34] = " He did that which was evil in the sight of the LORD, and walked in the way of Yarov`am, and in his sin with which he made Yisra\'el to sin.";
vul[34] = "et fecit malum coram Domino ambulavitque in via Hieroboam et in peccatis eius quibus peccare fecit Israhel";
</script>
