csb[1] = "King Hiram of Tyre sent his emissaries to Solomon when he heard that he had been anointed king in his father\'s place, for Hiram had always been friends with David.";
csb[2] = "Solomon sent this message to Hiram:";
csb[3] = "&quot;You know my father David was not able to build a temple for the name of the LORD his God. This was because of the warfare all around him until the LORD put his enemies under his feet.";
csb[4] = "&quot;The LORD my God has now given me rest on every side; there is no enemy or crisis.";
csb[5] = "&quot;So I plan to build a temple for the name of the LORD my God, according to what the LORD promised my father David: \'I will put your son on your throne in your place, and he will build the temple for my name.\'";
csb[6] = "&quot;Therefore, command that cedars from Lebanon be cut down for me. My servants will be with your servants, and I will pay your servants\' wages according to whatever you say, for you know that not a man among us knows how to cut timber like the Sidonians.&quot;";
csb[7] = "When Hiram heard Solomon\'s words, he rejoiced greatly and said, &quot;Blessed be the LORD today! He has given David a wise son to be over this great people! &quot;";
csb[8] = "Then Hiram sent a reply to Solomon, saying, &quot;I have heard your message; I will do everything you want regarding the cedar and cypress timber.";
csb[9] = "&quot;My servants will bring the logs down from Lebanon to the sea, and I will make them into rafts to go by sea to the place you indicate. I will break them apart there, and you can take them away. You then can meet my needs by providing my household with food.&quot;";
csb[10] = "So Hiram provided Solomon with all the cedar and cypress timber he wanted,";
csb[11] = "and Solomon provided Hiram with one hundred thousand bushels of wheat as food for his household and one hundred ten thousand gallons of oil from crushed olives. Solomon did this for Hiram year after year.";
csb[12] = "The LORD gave Solomon wisdom, as he had promised him. There was peace between Hiram and Solomon, and the two of them made a treaty.";
csb[13] = "Then King Solomon drafted forced laborers from all Israel; the labor force numbered thirty thousand men.";
csb[14] = "He sent ten thousand to Lebanon each month in shifts; one month they were in Lebanon, two months they were at home. Adoniram was in charge of the forced labor.";
csb[15] = "Solomon had seventy thousand porters and eighty thousand stonecutters in the mountains,";
csb[16] = "not including his thirty-three hundred deputies in charge of the work. They supervised the people doing the work.";
csb[17] = "The king commanded them to quarry large, costly stones to lay the foundation of the temple with dressed stones.";
csb[18] = "So Solomon\'s builders and Hiram\'s builders, along with the Gebalites, quarried the stone and prepared the timber and stone for the temple\'s construction.";

kjv[6] = "Now therefore command thou that they hew me cedar trees out of Lebanon; and my servants shall be with thy servants: and unto thee will I give hire for thy servants according to all that thou shalt appoint: for thou knowest that [there is] not among us any that can skill to hew timber like unto the Sidonians.";
