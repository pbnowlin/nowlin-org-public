csb[1] = "At that time Abijah son of Jeroboam became sick.";
csb[2] = "Jeroboam said to his wife, &quot;Go disguise yourself, so they won\'t know that you\'re Jeroboam\'s wife, and go to Shiloh. The prophet Ahijah is there; it was he who told about me becoming king over this people.";
csb[3] = "&quot;Take with you ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.&quot;";
csb[4] = "Jeroboam\'s wife did that: she went to Shiloh and arrived at Ahijah\'s house. Ahijah could not see; he was blind due to his age.";
csb[5] = "But the LORD had said to Ahijah, &quot;Jeroboam\'s wife is coming soon to ask you about her son, for he is sick. You are to say such and such to her. When she arrives, she will be disguised.&quot;";
csb[6] = "When Ahijah heard the sound of her feet entering the door, he said, &quot;Come in, wife of Jeroboam! Why are you disguised? I have bad news for you.";
csb[7] = "&quot;Go tell Jeroboam, \'This is what the LORD God of Israel says: I raised you up from among the people, appointed you ruler over my people Israel,";
csb[8] = "&quot;tore the kingdom away from the house of David, and gave it to you. But you were not like my servant David, who kept my commands and followed me with all his heart, doing only what is right in my sight.";
csb[9] = "&quot;You behaved more wickedly than all who were before you. In order to anger me, you have proceeded to make for yourself other gods and cast images, but you have flung me behind your back.";
csb[10] = "&quot;Because of all this, I am about to bring disaster on the house of Jeroboam: I will wipe out all of Jeroboam\'s males, both slave and free, in Israel; I will sweep away the house of Jeroboam as one sweeps away dung until it is all gone!";
csb[11] = "&quot;Anyone who belongs to Jeroboam and dies in the city, the dogs will eat, and anyone who dies in the field, the birds will eat, for the LORD has spoken! \'";
csb[12] = "&quot;As for you, get up and go to your house. When your feet enter the city, the boy will die.";
csb[13] = "&quot;All Israel will mourn for him and bury him. He alone out of Jeroboam\'s house will be given a proper burial because out of the house of Jeroboam something favorable to the LORD God of Israel was found in him.";
csb[14] = "&quot;The LORD will raise up for himself a king over Israel, who will wipe out the house of Jeroboam. This is the day, yes, even today!";
csb[15] = "&quot;For the LORD will strike Israel so that they will shake as a reed shakes in water. He will uproot Israel from this good soil that he gave to their ancestors. He will scatter them beyond the Euphrates because they made their Asherah poles, angering the LORD.";
csb[16] = "&quot;He will give up Israel because of Jeroboam\'s sins that he committed and caused Israel to commit.&quot;";
csb[17] = "Then Jeroboam\'s wife got up and left and went to Tirzah. As she was crossing the threshold of the house, the boy died.";
csb[18] = "He was buried, and all Israel mourned for him, according to the word of the LORD he had spoken through his servant the prophet Ahijah.";
csb[19] = "As for the rest of the events of Jeroboam\'s reign, how he waged war and how he reigned, note that they are written in the Historical Record of Israel\'s Kings.";
csb[20] = "The length of Jeroboam\'s reign was twenty-two years. He rested with his fathers, and his son Nadab became king in his place.";
csb[21] = "Now Rehoboam, Solomon\'s son, reigned in Judah. Rehoboam was forty-one years old when he became king; he reigned seventeen years in Jerusalem, the city where the LORD had chosen from all the tribes of Israel to put his name. Rehoboam\'s mother\'s name was Naamah the Ammonite.";
csb[22] = "Judah did what was evil in the LORD\'s sight. They provoked him to jealous anger more than all that their ancestors had done with the sins they committed.";
csb[23] = "They also built for themselves high places, sacred pillars, and Asherah poles on every high hill and under every green tree;";
csb[24] = "there were even male cult prostitutes in the land. They imitated all the detestable practices of the nations the LORD had dispossessed before the Israelites.";
csb[25] = "In the fifth year of King Rehoboam, King Shishak of Egypt went to war against Jerusalem.";
csb[26] = "He seized the treasuries of the LORD\'s temple and the treasuries of the royal palace. He took everything. He took all the gold shields that Solomon had made.";
csb[27] = "King Rehoboam made bronze shields to replace them and committed them into the care of the captains of the guards who protected the entrance to the king\'s palace.";
csb[28] = "Whenever the king entered the LORD\'s temple, the guards would carry the shields, then they would take them back to the armory.";
csb[29] = "The rest of the events of Rehoboam\'s reign, along with all his accomplishments, are written about in the Historical Record of Judah\'s Kings.";
csb[30] = "There was war between Rehoboam and Jeroboam throughout their reigns.";
csb[31] = "Rehoboam rested with his fathers and was buried with his fathers in the city of David. His mother\'s name was Naamah the Ammonite. His son Abijam became king in his place.";

kjv[2] = "And Jeroboam said to his wife, Arise, I pray thee, and disguise thyself, that thou be not known to be the wife of Jeroboam; and get thee to Shiloh: behold, there [is] Ahijah the prophet, which told me that [I should be] king over this people.";
rsv[2] = "And Jerobo\'am said to his wife, &quot;Arise, and disguise yourself, that it be not known that you are the wife of Jerobo\'am, and go to Shiloh; behold, Ahi\'jah the prophet is there, who said of me that I should be king over this people.";
asv[2] = "And Jeroboam said to his wife, Arise, I pray thee, and disguise thyself, that thou be not known to be the wife of Jeroboam; and get thee to Shiloh: behold, there is Ahijah the prophet, who spake concerning me that I should be king over this people.";
yng[2] = "and Jeroboam saith to his wife, `Rise, I pray thee, and change thyself, and they know not that thou [art] wife of Jeroboam, and thou hast gone to Shiloh; lo, there [is] Ahijah the prophet; he spake unto me of [being] king over this people;";
dby[2] = "And Jeroboam said to his wife, Arise, I pray thee, and disguise thyself, that thou be not known to be the wife of Jeroboam; and go to Shiloh: behold, there is Ahijah the prophet, who told me that [I should be] king over this people.";
web[2] = "And Jeroboam said to his wife, Arise, I pray thee, and disguise thyself, that thou mayest not be known to be the wife of Jeroboam; and go to Shiloh: behold, there [is] Ahijah the prophet, who told me that [I should be] king over this people.";
hnv[2] = " Yarov`am said to his wife, Please get up and disguise yourself, that you not be known to be the wife of Yarov`am; and get you to Shiloh: behold, there is Achiyah the prophet, who spoke concerning me that I should be king over this people.";
vul[2] = "dixitque Hieroboam uxori suae surge et commuta habitum ne cognoscaris quod sis uxor Hieroboam et vade in Silo ubi est Ahia propheta qui locutus est mihi quod regnaturus essem super populum hunc";

kjv[5] = "And the LORD said unto Ahijah, Behold, the wife of Jeroboam cometh to ask a thing of thee for her son; for he [is] sick: thus and thus shalt thou say unto her: for it shall be, when she cometh in, that she shall feign herself [to be] another [woman].";
rsv[5] = "And the LORD said to Ahi\'jah, &quot;Behold, the wife of Jerobo\'am is coming to inquire of you concerning her son; for he is sick. Thus and thus shall you say to her.&quot; When she came, she pretended to be another woman.";
asv[5] = "And Jehovah said unto Ahijah, Behold, the wife of Jeroboam cometh to inquire of thee concerning her son; for he is sick: thus and thus shalt thou say unto her; for it will be, when she cometh in, that she will feign herself to be another woman.";
yng[5] = "And Jehovah said unto Ahijah, `Lo, the wife of Jeroboam is coming to seek a word from thee concerning her son, for he is sick; thus and thus thou dost speak unto her, and it cometh to pass at her coming in, that she is making herself strange.\'";
dby[5] = "And Jehovah said to Ahijah, Behold, the wife of Jeroboam cometh to ask a thing of thee about her son; for he is sick: thus and thus shalt thou say unto her; for it shall be, when she cometh in, that she shall feign to be another.";
web[5] = "And the LORD said to Ahijah, Behold, the wife of Jeroboam cometh to ask a thing of thee for her son; for he [is] sick: thus and thus shalt thou say to her: for it shall be, when she cometh in, that she will feign herself [to be] another [woman].";
hnv[5] = "The LORD said to Achiyah, Behold, the wife of Yarov`am comes to inquire of you concerning her son; for he is sick: thus and thus shall you tell her; for it will be, when she comes in, that she will feign herself to be another woman.";
vul[5] = "dixit autem Dominus ad Ahiam ecce uxor Hieroboam ingreditur ut consulat te super filio suo qui aegrotat haec et haec loqueris ei cum ergo illa intraret et dissimularet se esse quae erat";
kjv[6] = "And it was [so], when Ahijah heard the sound of her feet, as she came in at the door, that he said, Come in, thou wife of Jeroboam; why feignest thou thyself [to be] another? for I [am] sent to thee [with] heavy [tidings].";
rsv[6] = "But when Ahi\'jah heard the sound of her feet, as she came in at the door, he said, &quot;Come in, wife of Jerobo\'am; why do you pretend to be another? For I am charged with heavy tidings for you.";

dby[6] = "And it was so, when Ahijah heard the sound of her feet, as she came in at the door, that he said, Come in, thou wife of Jeroboam; why feignest thou to be another? But I am sent to thee with a hard [message].";
web[6] = "And it was [so], when Ahijah heard the sound of her feet, as she came in at the door, that he said, Come in, thou wife of Jeroboam; why feignest thou thyself [to be] another? for I [am] sent to thee [with] heavy [tidings].";

hnv[21] = "Rechav`am the son of Shlomo reigned in Yehudah. Rechav`am was forty-one years old when he began to reign, and he reigned seventeen years in Yerushalayim, the city which the LORD had chosen out of all the tribes of Yisra\'el, to put his name there: and his mother\'s name was Na`amah the `Ammonite.";
