csb[1] = "King Solomon reigned over all Israel,";
csb[2] = "and these were his officials: Azariah son of Zadok, priest;";
csb[3] = "Elihoreph and Ahijah the sons of Shisha, secretaries; Jehoshaphat son of Ahilud, court historian;";
csb[4] = "Benaiah son of Jehoiada, in charge of the army; Zadok and Abiathar, priests;";
csb[5] = "Azariah son of Nathan, in charge of the deputies; Zabud son of Nathan, a priest and adviser to the king;";
csb[6] = "Ahishar, in charge of the palace; and Adoniram son of Abda, in charge of forced labor.";
csb[7] = "Solomon had twelve deputies for all Israel. They provided food for the king and his household; each one made provision for one month out of the year.";
csb[8] = "These were their names: Ben-hur, in the hill country of Ephraim;";
csb[9] = "Ben-deker, in Makaz, Shaalbim, Beth-shemesh, and Elon-beth-hanan;";
csb[10] = "Ben-hesed, in Arubboth (he had Socoh and the whole land of Hepher);";
csb[11] = "Ben-abinadab, in all Naphath-dor (Taphath daughter of Solomon was his wife);";
csb[12] = "Baana son of Ahilud, in Taanach, Megiddo, and all Beth-shean which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as the other side of Jokmeam;";
csb[13] = "Ben-geber, in Ramoth-gilead (he had the villages of Jair son of Manasseh, which are in Gilead, and he had the region of Argob, which is in Bashan, sixty great cities with walls and bronze bars);";
csb[14] = "Ahinadab son of Iddo, in Mahanaim;";
csb[15] = "Ahimaaz, in Naphtali (he also had married a daughter of Solomon -- Basemath);";
csb[16] = "Baana son of Hushai, in Asher and Bealoth;";
csb[17] = "Jehoshaphat son of Paruah, in Issachar;";
csb[18] = "Shimei son of Ela, in Benjamin;";
csb[19] = "Geber son of Uri, in the land of Gilead, the country of King Sihon of the Amorites and of King Og of Bashan. There was one deputy in the land of Judah.";
csb[20] = "Judah and Israel were as numerous as the sand by the sea; they were eating, drinking, and rejoicing.";
csb[21] = "Solomon ruled all the kingdoms from the Euphrates River to the land of the Philistines and as far as the border of Egypt. They offered tribute and served Solomon all the days of his life.";
csb[22] = "Solomon\'s provisions for one day were 150 bushels of fine flour and 300 bushels of meal,";
csb[23] = "ten fattened cattle, twenty range cattle, and a hundred sheep and goats, besides deer, gazelles, roebucks, and pen-fed poultry,";
csb[24] = "for he had dominion over everything west of the Euphrates from Tiphsah to Gaza and over all the kings west of the Euphrates. He had peace on all his surrounding borders.";
csb[25] = "Throughout Solomon\'s reign, Judah and Israel lived in safety from Dan to Beer-sheba, each person under his own vine and his own fig tree.";
csb[26] = "Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
csb[27] = "Each of those deputies for a month in turn provided food for King Solomon and for everyone who came to King Solomon\'s table. They neglected nothing.";
csb[28] = "Each man brought the barley and the straw for the chariot teams and the other horses to the required place according to his assignment.";
csb[29] = "God gave Solomon wisdom, very great insight, and understanding as vast as the sand on the seashore.";
csb[30] = "Solomon\'s wisdom was greater than the wisdom of all the people of the East, greater than all the wisdom of Egypt.";
csb[31] = "He was wiser than anyone -- wiser than Ethan the Ezrahite, and Heman, Calcol, and Darda, sons of Mahol. His reputation extended to all the surrounding nations.";
csb[32] = "Solomon spoke 3,000 proverbs, and his songs numbered 1,005.";
csb[33] = "He spoke about trees, from the cedar in Lebanon to the hyssop growing out of the wall. He also spoke about animals, birds, reptiles, and fish.";
csb[34] = "Emissaries of all peoples, sent by every king on earth who had heard of his wisdom, came to listen to Solomon\'s wisdom.";
kjv[1] = "So king Solomon was king over all Israel.";
kjv[2] = "And these [were] the princes which he had; Azariah the son of Zadok the priest,";
kjv[3] = "Elihoreph and Ahiah, the sons of Shisha, scribes; Jehoshaphat the son of Ahilud, the recorder.";
kjv[4] = "And Benaiah the son of Jehoiada [was] over the host: and Zadok and Abiathar [were] the priests:";
kjv[5] = "And Azariah the son of Nathan [was] over the officers: and Zabud the son of Nathan [was] principal officer, [and] the king\'s friend:";
kjv[6] = "And Ahishar [was] over the household: and Adoniram the son of Abda [was] over the tribute.";
kjv[7] = "And Solomon had twelve officers over all Israel, which provided victuals for the king and his household: each man his month in a year made provision.";
kjv[8] = "And these [are] their names: The son of Hur, in mount Ephraim:";
kjv[9] = "The son of Dekar, in Makaz, and in Shaalbim, and Bethshemesh, and Elonbethhanan:";
kjv[10] = "The son of Hesed, in Aruboth; to him [pertained] Sochoh, and all the land of Hepher:";
kjv[11] = "The son of Abinadab, in all the region of Dor; which had Taphath the daughter of Solomon to wife:";
kjv[12] = "Baana the son of Ahilud; [to him pertained] Taanach and Megiddo, and all Bethshean, which [is] by Zartanah beneath Jezreel, from Bethshean to Abelmeholah, [even] unto [the place that is] beyond Jokneam:";
kjv[13] = "The son of Geber, in Ramothgilead; to him [pertained] the towns of Jair the son of Manasseh, which [are] in Gilead; to him [also pertained] the region of Argob, which [is] in Bashan, threescore great cities with walls and brasen bars:";
kjv[14] = "Ahinadab the son of Iddo [had] Mahanaim:";
kjv[15] = "Ahimaaz [was] in Naphtali; he also took Basmath the daughter of Solomon to wife:";
kjv[16] = "Baanah the son of Hushai [was] in Asher and in Aloth:";
kjv[17] = "Jehoshaphat the son of Paruah, in Issachar:";
kjv[18] = "Shimei the son of Elah, in Benjamin:";
kjv[19] = "Geber the son of Uri [was] in the country of Gilead, [in] the country of Sihon king of the Amorites, and of Og king of Bashan; and [he was] the only officer which [was] in the land.";
kjv[20] = "Judah and Israel [were] many, as the sand which [is] by the sea in multitude, eating and drinking, and making merry.";
kjv[21] = "And Solomon reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt: they brought presents, and served Solomon all the days of his life.";
kjv[22] = "And Solomon\'s provision for one day was thirty measures of fine flour, and threescore measures of meal,";
kjv[23] = "Ten fat oxen, and twenty oxen out of the pastures, and an hundred sheep, beside harts, and roebucks, and fallowdeer, and fatted fowl.";
kjv[24] = "For he had dominion over all [the region] on this side the river, from Tiphsah even to Azzah, over all the kings on this side the river: and he had peace on all sides round about him.";
kjv[25] = "And Judah and Israel dwelt safely, every man under his vine and under his fig tree, from Dan even to Beersheba, all the days of Solomon.";
kjv[26] = "And Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
kjv[27] = "And those officers provided victual for king Solomon, and for all that came unto king Solomon\'s table, every man in his month: they lacked nothing.";
kjv[28] = "Barley also and straw for the horses and dromedaries brought they unto the place where [the officers] were, every man according to his charge.";
kjv[29] = "And God gave Solomon wisdom and understanding exceeding much, and largeness of heart, even as the sand that [is] on the sea shore.";
kjv[30] = "And Solomon\'s wisdom excelled the wisdom of all the children of the east country, and all the wisdom of Egypt.";
kjv[31] = "For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol: and his fame was in all nations round about.";
kjv[32] = "And he spake three thousand proverbs: and his songs were a thousand and five.";
kjv[33] = "And he spake of trees, from the cedar tree that [is] in Lebanon even unto the hyssop that springeth out of the wall: he spake also of beasts, and of fowl, and of creeping things, and of fishes.";
kjv[34] = "And there came of all people to hear the wisdom of Solomon, from all kings of the earth, which had heard of his wisdom.";

dby[20] = "Judah and Israel were many, as the sand which is by the sea in multitude, eating and drinking and making merry.";
web[20] = "Judah and Israel [were] many, as the sand which [is] by the sea in multitude, eating and drinking, and making merry.";
hnv[20] = "Yehudah and Yisra\'el were many as the sand which is by the sea in multitude, eating and drinking and making merry.";
vul[20] = "Iuda et Israhel innumerabiles sicut harena maris in multitudine comedentes et bibentes atque laetantes";
rsv[21] = "Solomon ruled over all the kingdoms from the Euphra\'tes to the land of the Philistines and to the border of Egypt; they brought tribute and served Solomon all the days of his life.";
asv[21] = "And Solomon ruled over all the kingdoms from the River unto the land of the Philistines, and unto the border of Egypt: they brought tribute, and served Solomon all the days of his life.";
yng[21] = "And Solomon hath been ruling over all the kingdoms, from the River [to] the land of the Philistines and unto the border of Egypt: they are bringing nigh a present, and serving Solomon, all days of his life.";
dby[21] = "And Solomon ruled over all kingdoms from the river to the land of the Philistines, and as far as the border of Egypt: they brought presents, and served Solomon all the days of his life.";
web[21] = "And Solomon reigned over all kingdoms from the river to the land of the Philistines, and to the border of Egypt: they brought presents, and served Solomon all the days of his life.";
hnv[21] = "Shlomo ruled over all the kingdoms from the River to the land of the Pelishtim, and to the border of Mitzrayim: they brought tribute, and served Shlomo all the days of his life.";
vul[21] = "Salomon autem erat in dicione sua habens omnia regna sicut a flumine terrae Philisthim usque ad terminum Aegypti offerentium sibi munera et servientium ei cunctis diebus vitae eius";
rsv[22] = "Solomon\'s provision for one day was thirty cors of fine flour, and sixty cors of meal,";
asv[22] = "And Solomon\'s provision for one day was thirty measures of fine flour, and threescore measures of meal,";
yng[22] = "And the provision of Solomon for one day is thirty cors of flour, and sixty cors of meal;";
dby[22] = "And Solomon\'s provision for one day was thirty measures of fine flour, and sixty measures of meal,";
web[22] = "And Solomon\'s provision for one day was thirty measures of fine flour, and sixty measures of meal.";
hnv[22] = "Shlomo\'s provision for one day was thirty measures of fine flour, and sixty measures of meal,";
vul[22] = "erat autem cibus Salomonis per dies singulos triginta chori similae et sexaginta chori farinae";
rsv[23] = "ten fat oxen, and twenty pasture-fed cattle, a hundred sheep, besides harts, gazelles, roebucks, and fatted fowl.";
asv[23] = "ten fat oxen, and twenty oxen out of the pastures, and a hundred sheep, besides harts, and gazelles, and roebucks, and fatted fowl.";
yng[23] = "ten fat oxen, and twenty feeding oxen, and a hundred sheep, apart from hart, and roe, and fallow-deer, and fatted beasts of the stalls,";
dby[23] = "ten fatted oxen, and twenty oxen out of the pastures, and a hundred sheep, besides harts, and gazelles, and fallow-deer, and fatted fowl.";
web[23] = "Ten fat oxen, and twenty oxen out of the pastures, and a hundred sheep, besides harts, and roebucks, and fallow-deer, and fatted fowls.";
hnv[23] = "ten fat oxen, and twenty oxen out of the pastures, and one hundred sheep, besides harts, and gazelles, and roebucks, and fattened fowl.";
vul[23] = "decem boves pingues et viginti boves pascuales et centum arietes excepta venatione cervorum caprearum atque bubalorum et avium altilium";
rsv[24] = "For he had dominion over all the region west of the Euphra\'tes from Tiphsah to Gaza, over all the kings west of the Euphra\'tes; and he had peace on all sides round about him.";
asv[24] = "For he had dominion over all [the region] on this side the River, from Tiphsah even to Gaza, over all the kings on this side the River: and he had peace on all sides round about him.";
yng[24] = "for he is ruling over all beyond the river, from Tiphsah and unto Gaza, over all the kings beyond the river, and he hath peace from all his servants round about.";
dby[24] = "For he had dominion over all on this side the river, from Tiphsah as far as Gazah, over all the kings on this side the river; and he had peace on all sides round about.";
web[24] = "For he had dominion over all [the region] on this side the river, from Tiphsah even to Azzah, over all the kings on this side of the river: and he had peace on all sides around him.";
hnv[24] = " For he had dominion over all [the region] on this side the River, from Tifsach even to `Aza, over all the kings on this side the River: and he had shalom on all sides round about him.";
vul[24] = "ipse enim obtinebat omnem regionem quae erat trans flumen quasi a Thapsa usque Gazam et cunctos reges illarum regionum et habebat pacem ex omni parte in circuitu";
rsv[25] = "And Judah and Israel dwelt in safety, from Dan even to Beer-sheba, every man under his vine and under his fig tree, all the days of Solomon.";
asv[25] = "And Judah and Israel dwelt safely, every man under his vine and under his fig-tree, from Dan even to Beer-sheba, all the days of Solomon.";
yng[25] = "And Judah dwelleth -- and Israel -- in confidence, each under his vine, and under his fig-tree, from Dan even unto Beer-Sheba, all the days of Solomon.";
dby[25] = "And Judah and Israel dwelt safely, every man under his vine and under his fig-tree, from Dan even to Beer-sheba, all the days of Solomon.";
web[25] = "And Judah and Israel dwelt safely, every man under his vine and under his fig-tree, from Dan even to Beer-sheba, all the days of Solomon.";
hnv[25] = "Yehudah and Yisra\'el lived safely, every man under his vine and under his fig tree, from Dan even to Be\'er-Sheva, all the days of Shlomo.";
vul[25] = "habitabatque Iudas et Israhel absque timore ullo unusquisque sub vite sua et sub ficu sua a Dan usque Bersabee cunctis diebus Salomonis";
rsv[26] = "Solomon also had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
asv[26] = "And Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
yng[26] = "And Solomon hath forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
dby[26] = "And Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
web[26] = "And Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
hnv[26] = "Shlomo had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.";
vul[26] = "et habebat Salomon quadraginta milia praesepia equorum currulium et duodecim milia equestrium";
rsv[27] = "And those officers supplied provisions for King Solomon, and for all who came to King Solomon\'s table, each one in his month; they let nothing be lacking.";
asv[27] = "And those officers provided victuals for king Solomon, and for all that came unto king Solomon\'s table, every man in his month; they let nothing be lacking.";
yng[27] = "And these officers have sustained king Solomon and every one drawing near unto the table of king Solomon, each [in] his month; they let nothing be lacking.";
dby[27] = "And those officers provided food for king Solomon, and for all who came to king Solomon\'s table, every man in his month: they let nothing be wanting.";
web[27] = "And those officers provided victuals for king Solomon, and for all that came to king Solomon\'s table, every man in his month: they lacked nothing.";
hnv[27] = "Those officers provided victuals for king Shlomo, and for all who came to king Shlomo\'s table, every man in his month; they let nothing be lacking.";
vul[27] = "nutriebantque eos supradicti regis praefecti sed et necessaria mensae regis Salomonis cum ingenti cura praebebant in tempore suo";
rsv[28] = "Barley also and straw for the horses and swift steeds they brought to the place where it was required, each according to his charge.";
asv[28] = "Barley also and straw for the horses and swift steeds brought they unto the place where [the officers] were, every man according to his charge.";
yng[28] = "And the barley and the straw, for horses and for dromedaries, they bring in unto the place where they are, each according to his ordinance.";
dby[28] = "And the barley, and the straw for the horses and coursers, they brought to the place where [the superintendents] were, every man according to his charge.";
web[28] = "Barley also and straw for the horses and dromedaries they brought to the place where [the officers] were, every man according to his charge.";
hnv[28] = "Barley also and straw for the horses and swift steeds brought they to the place where [the officers] were, every man according to his charge.";
vul[28] = "hordeum quoque et paleas equorum et iumentorum deferebant in locum ubi erat rex iuxta constitutum sibi";
rsv[29] = "And God gave Solomon wisdom and understanding beyond measure, and largeness of mind like the sand on the seashore,";
asv[29] = "And God gave Solomon wisdom and understanding exceeding much, and largeness of heart, even as the sand that is on the sea-shore.";
yng[29] = "And God giveth wisdom to Solomon, and understanding, very much, and breadth of heart, as the sand that [is] on the edge of the sea;";
dby[29] = "And God gave Solomon wisdom and very great understanding and largeness of heart, even as the sand that is on the sea-shore.";
web[29] = "And God gave Solomon great wisdom and understanding, and largeness of heart, even as the sand that [is] on the sea-shore.";
hnv[29] = "God gave Shlomo wisdom and understanding exceeding much, and very great understanding, even as the sand that is on the sea-shore.";
vul[29] = "dedit quoque Deus sapientiam Salomoni et prudentiam multam nimis et latitudinem cordis quasi harenam quae est in litore maris";
rsv[30] = "so that Solomon\'s wisdom surpassed the wisdom of all the people of the east, and all the wisdom of Egypt.";
asv[30] = "And Solomon\'s wisdom excelled the wisdom of all the children of the east, and all the wisdom of Egypt.";
yng[30] = "and the wisdom of Solomon is greater than the wisdom of any of the sons of the east, and than all the wisdom of Egypt;";
dby[30] = "And Solomon\'s wisdom excelled the wisdom of all the sons of the east, and all the wisdom of Egypt.";
web[30] = "And Solomon\'s wisdom excelled the wisdom of all the children of the east country, and all the wisdom of Egypt.";
hnv[30] = "Shlomo\'s wisdom excelled the wisdom of all the children of the east, and all the wisdom of Mitzrayim.";
vul[30] = "et praecedebat sapientia Salomonis sapientiam omnium Orientalium et Aegyptiorum";
rsv[31] = "For he was wiser than all other men, wiser than Ethan the Ez\'rahite, and Heman, Calcol, and Darda, the sons of Mahol; and his fame was in all the nations round about.";
asv[31] = "For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Calcol, and Darda, the sons of Mahol: and his fame was in all the nations round about.";
yng[31] = "and he is wiser than all men, than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, sons of Mahol, and his name is in all the nations round about.";
dby[31] = "For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Calcol, and Darda, the sons of Mahol; and his fame was in all the nations round about.";
web[31] = "For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol: and his fame was in all the surrounding nations.";
hnv[31] = "For he was wiser than all men; than Etan the Ezrachite, and Heman, and Kalkol, and Darda, the sons of Machol: and his fame was in all the nations round about.";
vul[31] = "et erat sapientior cunctis hominibus sapientior Aethan Ezraita et Heman et Chalcal et Dorda filiis Maol et erat nominatus in universis gentibus per circuitum";
rsv[32] = "He also uttered three thousand proverbs; and his songs were a thousand and five.";
asv[32] = "And he spake three thousand proverbs; and his songs were a thousand and five.";
yng[32] = "And he speaketh three thousand similes, and his songs [are] five, and the chief one;";
dby[32] = "And he spoke three thousand proverbs; and his songs were a thousand and five.";
web[32] = "And he spoke three thousand proverbs: and his songs were a thousand and five.";
hnv[32] = "He spoke three thousand proverbs; and his songs were one thousand five.";
vul[32] = "locutus est quoque Salomon tria milia parabolas et fuerunt carmina eius quinque et mille";
rsv[33] = "He spoke of trees, from the cedar that is in Lebanon to the hyssop that grows out of the wall; he spoke also of beasts, and of birds, and of reptiles, and of fish.";
asv[33] = "And he spake of trees, from the cedar that is in Lebanon even unto the hyssop that springeth out of the wall; he spake also of beasts, and of birds, and of creeping things, and of fishes.";
yng[33] = "and he speaketh concerning the trees, from the cedar that [is] in Lebanon, even unto the hyssop that is coming out in the wall, and he speaketh concerning the cattle, and concerning the fowl, and concerning the creeping things, and concerning the fishes,";
dby[33] = "And he spoke of the trees, from the cedar-tree that is on Lebanon even to the hyssop that springs out of the wall; he spoke also of cattle, and of fowls, and of creeping things, and of fishes.";
web[33] = "And he spoke of trees, from the cedar tree that [is] in Lebanon even to the hyssop that springeth out of the wall: he spoke also of beasts, and of fowls, and of creeping animals, and of fishes.";
hnv[33] = "He spoke of trees, from the cedar that is in Levanon even to the hyssop that springs out of the wall; he spoke also of animals, and of birds, and of creeping things, and of fish.";
vul[33] = "et disputavit super lignis a cedro quae est in Libano usque ad hysopum quae egreditur de pariete et disseruit de iumentis et volucribus et reptilibus et piscibus";
rsv[34] = "And men came from all peoples to hear the wisdom of Solomon, and from all the kings of the earth, who had heard of his wisdom.";
asv[34] = "And there came of all peoples to hear the wisdom of Solomon, from all kings of the earth, who had heard of his wisdom.";
yng[34] = "and there come out of all the peoples to hear the wisdom of Solomon, from all kings of the earth who have heard of his wisdom.";
dby[34] = "And there came of all peoples to hear the wisdom of Solomon, from all the kings of the earth who had heard of his wisdom.";
web[34] = "And there came of all people to hear the wisdom of Solomon, from all kings of the earth, who had heard of his wisdom.";
hnv[34] = "There came of all peoples to hear the wisdom of Shlomo, from all kings of the eretz, who had heard of his wisdom.";
vul[34] = "et veniebant de cunctis populis ad audiendam sapientiam Salomonis et ab universis regibus terrae qui audiebant sapientiam eius";
