csb[1] = "When Solomon finished building the temple of the LORD, the royal palace, and all that Solomon desired to do,";
csb[2] = "the LORD appeared to Solomon a second time just as he had appeared to him at Gibeon.";
csb[3] = "The LORD said to him: I have heard your prayer and petition you have made before me. I have consecrated this temple you have built, to put my name there forever; my eyes and my heart will be there at all times.";
csb[4] = "As for you, if you walk before me as your father David walked, with a heart of integrity and in what is right, doing everything I have commanded you, and if you keep my statutes and ordinances,";
csb[5] = "I will establish your royal throne over Israel forever, as I promised your father David: You will never fail to have a man on the throne of Israel.";
csb[6] = "If you or your sons turn away from following me and do not keep my commands -- my statutes that I have set before you -- and if you go and serve other gods and bow in worship to them,";
csb[7] = "I will cut off Israel from the land I gave them, and I will reject the temple I have sanctified for my name. Israel will become an object of scorn and ridicule among all the peoples.";
csb[8] = "Though this temple is now exalted, everyone who passes by will be appalled and will scoff. They will say: Why did the LORD do this to this land and this temple?";
csb[9] = "Then they will say: Because they abandoned the LORD their God who brought their ancestors out of the land of Egypt. They held on to other gods and bowed in worship to them and served them. Because of this, the LORD brought all this ruin on them.";
csb[10] = "At the end of twenty years during which Solomon had built the two houses, the LORD\'s temple and the royal palace --";
csb[11] = "King Hiram of Tyre having supplied him with cedar and cypress logs and gold for his every wish -- King Solomon gave Hiram twenty towns in the land of Galilee.";
csb[12] = "So Hiram went out from Tyre to look over the towns that Solomon had given him, but he was not pleased with them.";
csb[13] = "So he said, &quot;What are these towns you\'ve given me, my brother? &quot; So he called them the Land of Cabul, as they are still called today.";
csb[14] = "Now Hiram had sent the king nine thousand pounds of gold.";
csb[15] = "This is the account of the forced labor that King Solomon had imposed to build the LORD\'s temple, his own palace, the supporting terraces, the wall of Jerusalem, and Hazor, Megiddo, and Gezer.";
csb[16] = "Pharaoh king of Egypt had attacked and captured Gezer. He then burned it, killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon\'s wife.";
csb[17] = "Then Solomon rebuilt Gezer, Lower Beth-horon,";
csb[18] = "Baalath, Tamar in the Wilderness of Judah,";
csb[19] = "all the storage cities that belonged to Solomon, the chariot cities, the cavalry cities, and whatever Solomon desired to build in Jerusalem, Lebanon, or anywhere else in the land of his dominion.";
csb[20] = "As for all the peoples who remained of the Amorites, Hethites, Perizzites, Hivites, and Jebusites, who were not Israelites --";
csb[21] = "their descendants who remained in the land after them, those whom the Israelites were unable to destroy completely -- Solomon imposed forced labor on them; it is still this way today.";
csb[22] = "But Solomon did not consign the Israelites to slavery; they were soldiers, his servants, his commanders, his captains, and commanders of his chariots and his cavalry.";
csb[23] = "These were the deputies who were over Solomon\'s work: 550 who supervised the people doing the work.";
csb[24] = "Pharaoh\'s daughter moved from the city of David to the house that Solomon had built for her; he then built the terraces.";
csb[25] = "Three times a year Solomon offered burnt offerings and fellowship offerings on the altar he had built for the LORD, and he burned incense with them in the LORD\'s presence. So he completed the temple.";
csb[26] = "King Solomon put together a fleet of ships at Ezion-geber, which is near Eloth on the shore of the Red Sea in the land of Edom.";
csb[27] = "With the fleet, Hiram sent his servants, experienced seamen, along with Solomon\'s servants.";
csb[28] = "They went to Ophir and acquired gold there -- sixteen tons -- and delivered it to Solomon.";

dby[18] = "and Baalath, and Tadmor in the wilderness, in the land,";

hnv[18] = "and Ba`alat, and Tamar in the wilderness, in the land,";

kjv[19] = "And all the cities of store that Solomon had, and cities for his chariots, and cities for his horsemen, and that which Solomon desired to build in Jerusalem, and in Lebanon, and in all the land of his dominion.";
rsv[19] = "and all the store-cities that Solomon had, and the cities for his chariots, and the cities for his horsemen, and whatever Solomon desired to build in Jerusalem, in Lebanon, and in all the land of his dominion.";
asv[19] = "and all the store-cities that Solomon had, and the cities for his chariots, and the cities for his horsemen, and that which Solomon desired to build for his pleasure in Jerusalem, and in Lebanon, and in all the land of his dominion.";
yng[19] = "and all the cities of stores that king Solomon hath, and the cities of the chariots, and the cities of the horsemen, and the desire of Solomon that he desired to build in Jerusalem, and in Lebanon, and in all the land of his dominion.";
dby[19] = "and all the store-cities that Solomon had, and cities for chariots, and cities for the horsemen, and that which Solomon desired to build in Jerusalem, and on Lebanon, and in all the land of his dominion.";
web[19] = "And all the cities of store that Solomon had, and cities for his chariots, and cities for his horsemen, and that which Solomon desired to build in Jerusalem, and in Lebanon, and in all the land of his dominion.";
hnv[19] = "and all the store-cities that Shlomo had, and the cities for his chariots, and the cities for his horsemen, and that which Shlomo desired to build for his pleasure in Yerushalayim, and in Levanon, and in all the land of his dominion.";
vul[19] = "et omnes vicos qui ad se pertinebant et erant absque muro munivit et civitates curruum et civitates equitum et quodcumque ei placuit ut aedificaret in Hierusalem et in Libano et in omni terra potestatis suae";
kjv[20] = "[And] all the people [that were] left of the Amorites, Hittites, Perizzites, Hivites, and Jebusites, which [were] not of the children of Israel,";
rsv[20] = "All the people who were left of the Amorites, the Hittites, the Per\'izzites, the Hivites, and the Jeb\'usites, who were not of the people of Israel--";
asv[20] = "As for all the people that were left of the Amorites, the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the children of Israel;";
yng[20] = "The whole of the people that is left of the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite, who [are] not of the sons of Israel --";
dby[20] = "All the people that were left of the Amorites, the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the children of Israel,";
web[20] = "[And] all the people [that were] left of the Amorites, Hittites, Perizzites, Hivites, and Jebusites, who [were] not of the children of Israel,";
hnv[20] = "As for all the people who were left of the Amori, the Hitti, the Perizzi, the Hivvi, and the Yevusi, who were not of the children of Yisra\'el;";
vul[20] = "universum populum qui remanserat de Amorreis et Hettheis et Ferezeis et Eveis et Iebuseis qui non sunt de filiis Israhel";
kjv[21] = "Their children that were left after them in the land, whom the children of Israel also were not able utterly to destroy, upon those did Solomon levy a tribute of bondservice unto this day.";
rsv[21] = "their descendants who were left after them in the land, whom the people of Israel were unable to destroy utterly--these Solomon made a forced levy of slaves, and so they are to this day.";
asv[21] = "their children that were left after them in the land, whom the children of Israel were not able utterly to destroy, of them did Solomon raise a levy of bondservants unto this day.";
yng[21] = "their sons who are left behind them in the land, whom the sons of Israel have not been able to devote -- he hath even lifted up [on] them a tribute of service unto this day.";
dby[21] = "their children that were left after them in the land, whom the children of Israel were not able utterly to destroy, upon them did Solomon impose a tribute of bondservice until this day.";
web[21] = "Their children that were left after them in the land, whom the children of Israel also were not able utterly to destroy, upon those did Solomon levy a tribute of bond-service to this day.";
hnv[21] = "their children who were left after them in the land, whom the children of Yisra\'el were not able utterly to destroy, of them did Shlomo raise a levy of bondservants to this day.";
vul[21] = "horum filios qui remanserant in terra quos scilicet non potuerant filii Israhel exterminare fecit Salomon tributarios usque ad diem hanc";
kjv[22] = "But of the children of Israel did Solomon make no bondmen: but they [were] men of war, and his servants, and his princes, and his captains, and rulers of his chariots, and his horsemen.";
rsv[22] = "But of the people of Israel Solomon made no slaves; they were the soldiers, they were his officials, his commanders, his captains, his chariot commanders and his horsemen.";
asv[22] = "But of the children of Israel did Solomon make no bondservants; but they were the men of war, and his servants, and his princes, and his captains, and rulers of his chariots and of his horsemen.";
yng[22] = "And out of the sons of Israel Solomon hath not appointed a servant, for they [are] the men of war, and his servants, and his heads, and his captains, and the heads of his chariots, and his horsemen.";
dby[22] = "But of the children of Israel did Solomon make no bondmen; but they were men of war, and his servants, and his chiefs, and his captains, and captains of his chariots, and his horsemen.";
web[22] = "But of the children of Israel did Solomon make no bond-men: but they [were] men of war, and his servants, and his princes, and his captains, and rulers of his chariots, and his horsemen.";
hnv[22] = "But of the children of Yisra\'el did Shlomo make no bondservants; but they were the men of war, and his servants, and his princes, and his captains, and rulers of his chariots and of his horsemen.";
vul[22] = "de filiis autem Israhel non constituit Salomon servire quemquam sed erant viri bellatores et ministri eius et principes et duces et praefecti curruum et equorum";
kjv[23] = "These [were] the chief of the officers that [were] over Solomon\'s work, five hundred and fifty, which bare rule over the people that wrought in the work.";
rsv[23] = "These were the chief officers who were over Solomon\'s work: five hundred and fifty, who had charge of the people who carried on the work.";
asv[23] = "These were the chief officers that were over Solomon\'s work, five hundred and fifty, who bare rule over the people that wrought in the work.";
yng[23] = "These [are] the heads of the officers who [are] over the work of Solomon, fifty and five hundred, those ruling among the people who are labouring in the work.";
dby[23] = "These were the chief superintendents that were over Solomon\'s work, five hundred and fifty, that ruled over the people that wrought in the work.";
web[23] = "These [were] the chief of the officers that [were] over Solomon\'s work, five hundred and fifty, who bore rule over the people that wrought in the work.";
hnv[23] = " These were the chief officers who were over Shlomo\'s work, five hundred fifty, who bore rule over the people who labored in the work.";
vul[23] = "erant autem principes super omnia opera Salomonis praepositi quingenti quinquaginta qui habebant subiectum populum et statutis operibus imperabant";
kjv[24] = "But Pharaoh\'s daughter came up out of the city of David unto her house which [Solomon] had built for her: then did he build Millo.";
rsv[24] = "But Pharaoh\'s daughter went up from the city of David to her own house which Solomon had built for her; then he built the Millo.";
asv[24] = "But Pharaoh\'s daughter came up out of the city of David unto her house which [Solomon] had built for her: then did he build Millo.";
yng[24] = "Only, the daughter of Pharaoh went up out of the city of David unto her house that [Solomon] built for her; then he built Millo.";
dby[24] = "But Pharaoh\'s daughter came up out of the city of David to her house which he had built for her: then he built Millo.";
web[24] = "But Pharaoh\'s daughter came up from the city of David to her house which [Solomon] had built for her: then he built Millo.";
hnv[24] = " But Par`oh\'s daughter came up out of the city of David to her house which [Shlomo] had built for her: then did he build Millo.";
vul[24] = "filia autem Pharaonis ascendit de civitate David in domum suam quam aedificaverat ei tunc aedificavit Mello";
kjv[25] = "And three times in a year did Solomon offer burnt offerings and peace offerings upon the altar which he built unto the LORD, and he burnt incense upon the altar that [was] before the LORD. So he finished the house.";
rsv[25] = "Three times a year Solomon used to offer up burnt offerings and peace offerings upon the altar which he built to the LORD, burning incense before the LORD. So he finished the house.";
asv[25] = "And three times in a year did Solomon offer burnt-offerings and peace-offerings upon the altar which he built unto Jehovah, burning incense therewith, [upon the altar] that was before Jehovah. So he finished the house.";
yng[25] = "And Solomon caused to ascend, three times in a year, burnt-offerings and peace-offerings on the altar that he built to Jehovah, and he perfumed it with that which [is] before Jehovah, and finished the house.";
dby[25] = "And three times in the year did Solomon offer up burnt-offerings and peace-offerings upon the altar that he had built to Jehovah, and he burned incense upon that which was before Jehovah. So he finished the house.";
web[25] = "And three times in a year did Solomon offer burnt-offerings and peace-offerings upon the altar which he built to the LORD, and he burnt incense upon the altar that [was] before the LORD. So he finished the house.";
hnv[25] = "Three times a year did Shlomo offer burnt offerings and peace-offerings on the altar which he built to the LORD, burning incense therewith, [on the altar] that was before the LORD. So he finished the house.";
vul[25] = "offerebat quoque Salomon tribus vicibus per annos singulos holocausta et pacificas victimas super altare quod aedificaverat Domino et adolebat thymiama coram Domino perfectumque est templum";
kjv[26] = "And king Solomon made a navy of ships in Eziongeber, which [is] beside Eloth, on the shore of the Red sea, in the land of Edom.";
rsv[26] = "King Solomon built a fleet of ships at E\'zion-ge\'ber, which is near Eloth on the shore of the Red Sea, in the land of Edom.";
asv[26] = "And king Solomon made a navy of ships in Ezion-geber, which is beside Eloth, on the shore of the Red Sea, in the land of Edom.";
yng[26] = "And a navy hath king Solomon made in Ezion-Geber, that is beside Eloth, on the edge of the Sea of Suph, in the land of Edom.";
dby[26] = "And king Solomon made a fleet of ships in Ezion-Geber, which is beside Eloth, on the shore of the Red Sea, in the land of Edom.";
web[26] = "And king Solomon made a navy of ships in Ezion-geber, which [is] beside Eloth, on the shore of the Red Sea, in the land of Edom.";
hnv[26] = " King Shlomo made a navy of ships in `Etzyon-Gever, which is beside Elot, on the shore of the Sea of Suf, in the land of Edom.";
vul[26] = "classem quoque fecit rex Salomon in Asiongaber quae est iuxta Ahilam in litore maris Rubri in terra Idumea";
kjv[27] = "And Hiram sent in the navy his servants, shipmen that had knowledge of the sea, with the servants of Solomon.";
rsv[27] = "And Hiram sent with the fleet his servants, seamen who were familiar with the sea, together with the servants of Solomon;";
asv[27] = "And Hiram sent in the navy his servants, shipmen that had knowledge of the sea, with the servants of Solomon.";
yng[27] = "And Hiram sendeth in the navy his servants, shipmen knowing the sea, with servants of Solomon,";
dby[27] = "And Hiram sent in the fleet his servants, shipmen that had knowledge of the sea, with the servants of Solomon;";
web[27] = "And Hiram sent in the navy his servants, shipmen that had knowledge of the sea, with the servants of Solomon.";
hnv[27] = "Hiram sent in the navy his servants, sailors who had knowledge of the sea, with the servants of Shlomo.";
vul[27] = "misitque Hiram in classe illa servos suos viros nauticos et gnaros maris cum servis Salomonis";
kjv[28] = "And they came to Ophir, and fetched from thence gold, four hundred and twenty talents, and brought [it] to king Solomon.";
rsv[28] = "and they went to Ophir, and brought from there gold, to the amount of four hundred and twenty talents; and they brought it to King Solomon.";
asv[28] = "And they came to Ophir, and fetched from thence gold, four hundred and twenty talents, and brought it to king Solomon.";
yng[28] = "and they come in to Ophir and take thence gold, four hundred and twenty talents, and bring [it] in unto king Solomon.";
dby[28] = "and they went to Ophir, and fetched thence gold, four hundred and twenty talents, and brought it to king Solomon.";
web[28] = "And they came to Ophir, and imported from thence gold, four hundred and twenty talents, and brought [it] to king Solomon.";
hnv[28] = "They came to Ofir, and fetched from there gold, four hundred and twenty talents, and brought it to king Shlomo.";
vul[28] = "qui cum venissent in Ophir sumptum inde aurum quadringentorum viginti talentorum detulerunt ad regem Salomonem";
