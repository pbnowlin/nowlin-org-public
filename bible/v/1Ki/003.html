csb[1] = "Solomon made an alliance with Pharaoh king of Egypt by marrying Pharaoh\'s daughter. Solomon brought her to the city of David until he finished building his palace, the LORD\'s temple, and the wall surrounding Jerusalem.";
csb[2] = "However, the people were sacrificing on the high places, because until that time a temple for the LORD\'s name had not been built.";
csb[3] = "Solomon loved the LORD by walking in the statutes of his father David, but he also sacrificed and burned incense on the high places.";
csb[4] = "The king went to Gibeon to sacrifice there because it was the most famous high place. He offered a thousand burnt offerings on that altar.";
csb[5] = "At Gibeon the LORD appeared to Solomon in a dream at night. God said, &quot;Ask. What should I give you? &quot;";
csb[6] = "And Solomon replied, &quot;You have shown great and faithful love to your servant, my father David, because he walked before you in faithfulness, righteousness, and integrity. You have continued this great and faithful love for him by giving him a son to sit on his throne, as it is today.";
csb[7] = "&quot;LORD my God, you have now made your servant king in my father David\'s place. Yet I am just a youth with no experience in leadership.";
csb[8] = "&quot;Your servant is among your people you have chosen, a people too many to be numbered or counted.";
csb[9] = "&quot;So give your servant a receptive heart to judge your people and to discern between good and evil. For who is able to judge this great people of yours? &quot;";
csb[10] = "Now it pleased the Lord that Solomon had requested this.";
csb[11] = "So God said to him, &quot;Because you have requested this and did not ask for long life or riches for yourself, or the death of your enemies, but you asked discernment for yourself to administer justice,";
csb[12] = "&quot;I will therefore do what you have asked. I will give you a wise and understanding heart, so that there has never been anyone like you before and never will be again.";
csb[13] = "&quot;In addition, I will give you what you did not ask for: both riches and honor, so that no king will be your equal during your entire life.";
csb[14] = "&quot;If you walk in my ways and keep my statutes and commands just as your father David did, I will give you a long life.&quot;";
csb[15] = "Then Solomon woke up and realized it had been a dream. He went to Jerusalem, stood before the ark of the Lord\'s covenant, and offered burnt offerings and fellowship offerings. Then he held a feast for all his servants.";
csb[16] = "Then two women who were prostitutes came to the king and stood before him.";
csb[17] = "One woman said, &quot;Please, my lord, this woman and I live in the same house, and I had a baby while she was in the house.";
csb[18] = "&quot;On the third day after I gave birth, she also had a baby and we were alone. No one else was with us in the house; just the two of us were there.";
csb[19] = "&quot;During the night this woman\'s son died because she lay on him.";
csb[20] = "&quot;She got up in the middle of the night and took my son from my side while your servant was asleep. She laid him in her arms, and she put her dead son in my arms.";
csb[21] = "&quot;When I got up in the morning to nurse my son, I discovered he was dead. That morning, when I looked closely at him I realized that he was not the son I gave birth to.&quot;";
csb[22] = "&quot;No,&quot; the other woman said. &quot;My son is the living one; your son is the dead one.&quot; The first woman said, &quot;No, your son is the dead one; my son is the living one.&quot; So they argued before the king.";
csb[23] = "The king replied, &quot;This woman says, \'This is my son who is alive, and your son is dead,\' but that woman says, \'No, your son is dead, and my son is alive.\' &quot;";
csb[24] = "The king continued, &quot;Bring me a sword.&quot; So they brought the sword to the king.";
csb[25] = "And the king said, &quot;Cut the living boy in two and give half to one and half to the other.&quot;";
csb[26] = "The woman whose son was alive spoke to the king because she felt great compassion for her son. &quot;My lord, give her the living baby,&quot; she said, &quot;but please don\'t have him killed! &quot; But the other one said, &quot;He will not be mine or yours. Cut him in two! &quot;";
csb[27] = "The king responded, &quot;Give the living baby to the first woman, and don\'t kill him. She is his mother.&quot;";
csb[28] = "All Israel heard about the judgment the king had given, and they stood in awe of the king because they saw that God\'s wisdom was in him to carry out justice.";

kjv[6] = "And Solomon said, Thou hast shewed unto thy servant David my father great mercy, according as he walked before thee in truth, and in righteousness, and in uprightness of heart with thee; and thou hast kept for him this great kindness, that thou hast given him a son to sit on his throne, as [it is] this day.";
rsv[6] = "And Solomon said, &quot;Thou hast shown great and steadfast love to thy servant David my father, because he walked before thee in faithfulness, in righteousness, and in uprightness of heart toward thee; and thou hast kept for him this great and steadfast love, and hast given him a son to sit on his throne this day.";
asv[6] = "And Solomon said, Thou hast showed unto thy servant David my father great lovingkindness, according as he walked before thee in truth, and in righteousness, and in uprightness of heart with thee; and thou hast kept for him this great lovingkindness, that thou hast given him a son to sit on his throne, as it is this day.";
yng[6] = "And Solomon saith, `Thou hast done with Thy servant David my father great kindness, as he walked before Thee in truth and in righteousness, and in uprightness of heart with Thee, and Thou dost keep for him this great kindness, and dost give to him a son sitting on his throne, as [at] this day.";

vul[6] = "et ait Salomon tu fecisti cum servo tuo David patre meo misericordiam magnam sicut ambulavit in conspectu tuo in veritate et iustitia et recto corde tecum custodisti ei misericordiam tuam grandem et dedisti ei filium sedentem super thronum eius sicut et hodie";

yng[18] = "and it cometh to pass on the third day of my bringing forth, that this woman also bringeth forth, and we [are] together, there is no stranger with us in the house, save we two, in the house.";

hnv[18] = "It happened the third day after I was delivered, that this woman was delivered also; and we were together; there was no stranger with us in the house, save we two in the house.";
vul[18] = "tertia vero die postquam ego peperi peperit et haec et eramus simul nullusque alius in domo nobiscum exceptis nobis duabus";

rsv[20] = "And she arose at midnight, and took my son from beside me, while your maidservant slept, and laid it in her bosom, and laid her dead son in my bosom.";

dby[20] = "And she arose at midnight, and took my son from beside me, while thy handmaid slept, and laid it in her bosom, and laid her dead son in my bosom.";
web[20] = "And she arose at midnight, and took my son from beside me, while thy handmaid slept, and laid it in her bosom, and laid her dead child in my bosom.";
hnv[20] = "She arose at midnight, and took my son from beside me, while your handmaid slept, and laid it in her bosom, and laid her dead child in my bosom.";

kjv[21] = "And when I rose in the morning to give my child suck, behold, it was dead: but when I had considered it in the morning, behold, it was not my son, which I did bear.";

asv[21] = "And when I rose in the morning to give my child suck, behold, it was dead; but when I had looked at it in the morning, behold, it was not my son, whom I did bear.";
yng[21] = "and I rise in the morning to suckle my son, and lo, dead; and I consider concerning it in the morning, and lo, it was not my son whom I did bear.\'";
dby[21] = "And when I rose in the morning to give my child suck, behold, it was dead; and I considered it in the morning, and behold, it was not my son, whom I bore.";
web[21] = "And when I rose in the morning to nurse my child, behold, it was dead: but when I had considered it in the morning, behold, it was not my son, which I bore.";
hnv[21] = "When I rose in the morning to give my child suck, behold, it was dead; but when I had looked at it in the morning, behold, it was not my son, whom I bore.";

kjv[22] = "And the other woman said, Nay; but the living [is] my son, and the dead [is] thy son. And this said, No; but the dead [is] thy son, and the living [is] my son. Thus they spake before the king.";
rsv[22] = "But the other woman said, &quot;No, the living child is mine, and the dead child is yours.&quot; The first said, &quot;No, the dead child is yours, and the living child is mine.&quot; Thus they spoke before the king.";
asv[22] = "And the other woman said, Nay; but the living is my son, and the dead is thy son. And this said, No; but the dead is thy son, and the living is my son. Thus they spake before the king.";
yng[22] = "And the other woman saith, `Nay, but my son [is] the living, and thy son the dead;\' and this [one] saith, `Nay, but thy son [is] the dead, and my son the living.\' And they speak before the king.";
dby[22] = "And the other woman said, No, for the living is my son, and the dead is thy son. And this one said, No, but the dead is thy son, and the living is my son. Thus they spoke before the king.";
web[22] = "And the other woman said, No; but the living [is] my son, and the dead [is] thy son. And this said, No; but the dead [is] thy son, and the living [is] my son. Thus they spoke before the king.";
hnv[22] = "The other woman said, No; but the living is my son, and the dead is your son. This said, No; but the dead is your son, and the living is my son. Thus they spoke before the king.";
vul[22] = "responditque altera mulier non est ita sed filius tuus mortuus est meus autem vivit e contrario illa dicebat mentiris filius quippe meus vivit et filius tuus mortuus est atque in hunc modum contendebant coram rege";
kjv[23] = "Then said the king, The one saith, This [is] my son that liveth, and thy son [is] the dead: and the other saith, Nay; but thy son [is] the dead, and my son [is] the living.";
rsv[23] = "Then the king said, &quot;The one says, \'This is my son that is alive, and your son is dead\'; and the other says, \'No; but your son is dead, and my son is the living one.\'&quot;";
asv[23] = "Then said the king, The one saith, This is my son that liveth, and thy son is the dead: and the other saith, Nay; but thy son is the dead, and my son is the living.";
yng[23] = "And the king saith, `This [one] saith, This [is] my son, the living, and thy son [is] the dead; and that [one] saith, Nay, but thy son [is] the dead, and my son the living.\'";
dby[23] = "Then said the king, The one says, This that is living is my son, and thy son is the dead; and the other says, No, for thy son is the dead, and my son is the living.";
web[23] = "Then said the king, The one saith, This [is] my son that liveth, and thy son [is] the dead; and the other saith, No; but thy son [is] the dead, and my son [is] the living.";
hnv[23] = "Then said the king, The one says, This is my son who lives, and your son is the dead: and the other says, No; but your son is the dead, and my son is the living.";
vul[23] = "tunc rex ait haec dicit filius meus vivit et filius tuus mortuus est et ista respondit non sed filius tuus mortuus est et filius meus vivit";

rsv[24] = "And the king said, &quot;Bring me a sword.&quot; So a sword was brought before the king.";
asv[24] = "And the king said, Fetch me a sword. And they brought a sword before the king.";
yng[24] = "And the king saith, `Take for me a sword;\' and they bring the sword before the king,";
dby[24] = "And the king said, Bring me a sword. And they brought a sword before the king.";
web[24] = "And the king said, Bring me a sword. And they brought a sword before the king.";
hnv[24] = "The king said, Get me a sword. They brought a sword before the king.";
vul[24] = "dixit ergo rex adferte mihi gladium cumque adtulissent gladium coram rege";

rsv[25] = "And the king said, &quot;Divide the living child in two, and give half to the one, and half to the other.&quot;";
asv[25] = "And the king said, Divide the living child in two, and give half to the one, and half to the other.";
yng[25] = "and the king saith, `Cut the living child into two, and give the half to the one, and the half to the other.\'";
dby[25] = "And the king said, Divide the living child in two, and give half to the one, and half to the other.";
web[25] = "And the king said, Divide the living child in two, and give half to the one, and half to the other.";
hnv[25] = "The king said, Divide the living child in two, and give half to the one, and half to the other.";

kjv[26] = "Then spake the woman whose the living child [was] unto the king, for her bowels yearned upon her son, and she said, O my lord, give her the living child, and in no wise slay it. But the other said, Let it be neither mine nor thine, [but] divide [it].";
rsv[26] = "Then the woman whose son was alive said to the king, because her heart yearned for her son, &quot;Oh, my lord, give her the living child, and by no means slay it.&quot; But the other said, &quot;It shall be neither mine nor yours; divide it.&quot;";
asv[26] = "Then spake the woman whose the living child was unto the king, for her heart yearned over her son, and she said, Oh, my lord, give her the living child, and in no wise slay it. But the other said, It shall be neither mine nor thine; divide it.";
yng[26] = "And the woman whose son [is] the living one saith unto the king (for her bowels yearned over her son), yea, she saith, `O, my lord, give to her the living child, and put it not at all to death;\' and this [one] saith, `Let it be neither mine or thine -- cut [it].\'";
dby[26] = "Then spoke the woman whose was the living child to the king, for her bowels yearned over her son, and she said, Ah, my lord! give her the living child, and in no wise put it to death. But the other said, Let it be neither mine nor thine; divide it.";
web[26] = "Then spoke the woman whose the living child [was] to the king, for her bowels yearned upon her son, and she said, O my lord, give her the living child, and in no wise slay it. But the other said, Let it be neither mine nor thine, [but] divide [it].";
hnv[26] = "Then spoke the woman whose the living child was to the king, for her heart yearned over her son, and she said, Oh, my lord, give her the living child, and in no way kill it. But the other said, It shall be neither mine nor yours; divide it.";
vul[26] = "dixit autem mulier cuius filius erat vivus ad regem commota sunt quippe viscera eius super filio suo obsecro domine date illi infantem vivum et nolite interficere eum contra illa dicebat nec mihi nec tibi sit dividatur";
kjv[27] = "Then the king answered and said, Give her the living child, and in no wise slay it: she [is] the mother thereof.";
rsv[27] = "Then the king answered and said, &quot;Give the living child to the first woman, and by no means slay it; she is its mother.&quot;";
asv[27] = "Then the king answered and said, Give her the living child, and in no wise slay it: she is the mother thereof.";
yng[27] = "And the king answereth and saith, `Give ye to her the living child, and put it not at all to death; she [is] its mother.\'";
dby[27] = "And the king answered and said, Give this one the living child, and in no wise put it to death: she is its mother.";
web[27] = "Then the king answered and said, Give her the living child, and in no wise slay it: she [is] the mother of it.";
hnv[27] = "Then the king answered, Give her the living child, and in no way kill it: she is the mother of it.";
vul[27] = "respondens rex ait date huic infantem vivum et non occidatur haec est mater eius";
kjv[28] = "And all Israel heard of the judgment which the king had judged; and they feared the king: for they saw that the wisdom of God [was] in him, to do judgment.";
rsv[28] = "And all Israel heard of the judgment which the king had rendered; and they stood in awe of the king, because they perceived that the wisdom of God was in him, to render justice.";
asv[28] = "And all Israel heard of the judgment which the king had judged; and they feared the king: for they saw that the wisdom of God was in him, to do justice.";
yng[28] = "And all Israel hear of the judgment that the king hath judged, and fear because of the king, for they have seen that the wisdom of God [is] in his heart, to do judgment.";
dby[28] = "And all Israel heard of the judgment which the king had judged; and they feared the king, for they saw that the wisdom of God was in him, to do justice.";
web[28] = "And all Israel heard of the judgment which the king had judged; and they feared the king: for they saw that the wisdom of God [was] in him, to do judgment.";
hnv[28] = "All Yisra\'el heard of the judgment which the king had judged; and they feared the king: for they saw that the wisdom of God was in him, to do justice.";
vul[28] = "audivit itaque omnis Israhel iudicium quod iudicasset rex et timuerunt regem videntes sapientiam Dei esse in eo ad faciendum iudicium";
