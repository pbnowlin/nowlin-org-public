csb[1] = "A man of God came, however, from Judah to Bethel by the word of the LORD while Jeroboam was standing beside the altar to burn incense.";
csb[2] = "The man of God cried out against the altar by the word of the LORD: &quot;Altar, altar, this is what the LORD says, \'A son will be born to the house of David, named Josiah, and he will sacrifice on you the priests of the high places who are burning incense on you. Human bones will be burned on you.\' &quot;";
csb[3] = "He gave a sign that day. He said, &quot;This is the sign that the LORD has spoken: \'The altar will now be ripped apart, and the ashes that are on it will be poured out.\' &quot;";
csb[4] = "When the king heard the message that the man of God had cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar and said, &quot;Arrest him! &quot; But the hand he stretched out against him withered, and he could not pull it back to himself.";
csb[5] = "The altar was ripped apart, and the ashes poured from the altar, according to the sign that the man of God had given by the word of the LORD.";
csb[6] = "Then the king responded to the man of God, &quot;Plead for the favor of the LORD your God and pray for me so that my hand may be restored to me.&quot; So the man of God pleaded for the favor of the LORD, and the king\'s hand was restored to him and became as it had been at first.";
csb[7] = "Then the king declared to the man of God, &quot;Come home with me, refresh yourself, and I\'ll give you a reward.&quot;";
csb[8] = "But the man of God replied, &quot;If you were to give me half your house, I still wouldn\'t go with you, and I wouldn\'t eat food or drink water in this place,";
csb[9] = "&quot;for this is what I was commanded by the word of the LORD: \'You must not eat food or drink water or go back the way you came.\' &quot;";
csb[10] = "So he went another way; he did not go back by the way he had come to Bethel.";
csb[11] = "Now a certain old prophet was living in Bethel. His son came and told him all the deeds that the man of God had done that day in Bethel. His sons also told their father the words that he had spoken to the king.";
csb[12] = "Then their father asked them, &quot;Which way did he go? &quot; His sons had seen the way taken by the man of God who had come from Judah.";
csb[13] = "Then he said to his sons, &quot;Saddle the donkey for me.&quot; So they saddled the donkey for him, and he got on it.";
csb[14] = "He followed the man of God and found him sitting under an oak tree. He asked him, &quot;Are you the man of God who came from Judah? &quot; &quot;I am,&quot; he said.";
csb[15] = "Then he said to him, &quot;Come home with me and eat some food.&quot;";
csb[16] = "But he answered, &quot;I cannot go back with you or accompany you; I will not eat food or drink water with you in this place.";
csb[17] = "&quot;For a message came to me by the word of the LORD: \'You must not eat food or drink water there or go back by the way you came.\' &quot;";
csb[18] = "He said to him, &quot;I am also a prophet like you. An angel spoke to me by the word of the LORD: \'Bring him back with you to your house so that he may eat food and drink water.\' &quot; The old prophet deceived him,";
csb[19] = "and the man of God went back with him, ate food in his house, and drank water.";
csb[20] = "While they were sitting at the table, the word of the LORD came to the prophet who had brought him back,";
csb[21] = "and the prophet cried out to the man of God who had come from Judah, &quot;This is what the LORD says: \'Because you rebelled against the LORD\'s command and did not keep the command that the LORD your God commanded you --";
csb[22] = "&quot;but you went back and ate food and drank water in the place that he said to you, &quot;Do not eat food and do not drink water&quot; -- your corpse will never reach the grave of your fathers.\' &quot;";
csb[23] = "So after he had eaten food and after he had drunk, the old prophet saddled the donkey for the prophet he had brought back.";
csb[24] = "When he left, a lion attacked him along the way and killed him. His corpse was thrown on the road, and the donkey was standing beside it; the lion was standing beside the corpse too.";
csb[25] = "There were men passing by who saw the corpse thrown on the road and the lion standing beside it, and they went and spoke about it in the city where the old prophet lived.";
csb[26] = "When the prophet who had brought him back from his way heard about it, he said, &quot;He is the man of God who disobeyed the LORD\'s command. The LORD has given him to the lion, and it has mauled and killed him, according to the word of the LORD that he spoke to him.&quot;";
csb[27] = "Then the old prophet instructed his sons, &quot;Saddle the donkey for me.&quot; They saddled it,";
csb[28] = "and he went and found the corpse thrown on the road with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse or mauled the donkey.";
csb[29] = "So the prophet lifted the corpse of the man of God and laid it on the donkey and brought it back. The old prophet came into the city to mourn and to bury him.";
csb[30] = "Then he laid the corpse in his own grave, and they mourned over him: &quot;Oh, my brother! &quot;";
csb[31] = "After he had buried him, he said to his sons, &quot;When I die, bury me in the grave where the man of God is buried; lay my bones beside his bones,";
csb[32] = "&quot;for the message that he cried out by the word of the LORD against the altar in Bethel and against all the shrines of the high places in the cities of Samaria is certain to happen.&quot;";
csb[33] = "Even after this, Jeroboam did not repent of his evil way but again made priests for the high places from the ranks of the people. He ordained whoever so desired it, and they became priests of the high places.";
csb[34] = "This was the sin that caused the house of Jeroboam to be cut off and obliterated from the face of the earth.";
kjv[1] = "And, behold, there came a man of God out of Judah by the word of the LORD unto Bethel: and Jeroboam stood by the altar to burn incense.";
kjv[2] = "And he cried against the altar in the word of the LORD, and said, O altar, altar, thus saith the LORD; Behold, a child shall be born unto the house of David, Josiah by name; and upon thee shall he offer the priests of the high places that burn incense upon thee, and men\'s bones shall be burnt upon thee.";
kjv[3] = "And he gave a sign the same day, saying, This [is] the sign which the LORD hath spoken; Behold, the altar shall be rent, and the ashes that [are] upon it shall be poured out.";
kjv[4] = "And it came to pass, when king Jeroboam heard the saying of the man of God, which had cried against the altar in Bethel, that he put forth his hand from the altar, saying, Lay hold on him. And his hand, which he put forth against him, dried up, so that he could not pull it in again to him.";
kjv[5] = "The altar also was rent, and the ashes poured out from the altar, according to the sign which the man of God had given by the word of the LORD.";
kjv[6] = "And the king answered and said unto the man of God, Intreat now the face of the LORD thy God, and pray for me, that my hand may be restored me again. And the man of God besought the LORD, and the king\'s hand was restored him again, and became as [it was] before.";
kjv[7] = "And the king said unto the man of God, Come home with me, and refresh thyself, and I will give thee a reward.";
kjv[8] = "And the man of God said unto the king, If thou wilt give me half thine house, I will not go in with thee, neither will I eat bread nor drink water in this place:";
kjv[9] = "For so was it charged me by the word of the LORD, saying, Eat no bread, nor drink water, nor turn again by the same way that thou camest.";
kjv[10] = "So he went another way, and returned not by the way that he came to Bethel.";
kjv[11] = "Now there dwelt an old prophet in Bethel; and his sons came and told him all the works that the man of God had done that day in Bethel: the words which he had spoken unto the king, them they told also to their father.";
kjv[12] = "And their father said unto them, What way went he? For his sons had seen what way the man of God went, which came from Judah.";
kjv[13] = "And he said unto his sons, Saddle me the ass. So they saddled him the ass: and he rode thereon,";
kjv[14] = "And went after the man of God, and found him sitting under an oak: and he said unto him, [Art] thou the man of God that camest from Judah? And he said, I [am].";
kjv[15] = "Then he said unto him, Come home with me, and eat bread.";
kjv[16] = "And he said, I may not return with thee, nor go in with thee: neither will I eat bread nor drink water with thee in this place:";
kjv[17] = "For it was said to me by the word of the LORD, Thou shalt eat no bread nor drink water there, nor turn again to go by the way that thou camest.";
kjv[18] = "He said unto him, I [am] a prophet also as thou [art]; and an angel spake unto me by the word of the LORD, saying, Bring him back with thee into thine house, that he may eat bread and drink water. [But] he lied unto him.";
kjv[19] = "So he went back with him, and did eat bread in his house, and drank water.";
kjv[20] = "And it came to pass, as they sat at the table, that the word of the LORD came unto the prophet that brought him back:";
kjv[21] = "And he cried unto the man of God that came from Judah, saying, Thus saith the LORD, Forasmuch as thou hast disobeyed the mouth of the LORD, and hast not kept the commandment which the LORD thy God commanded thee,";
kjv[22] = "But camest back, and hast eaten bread and drunk water in the place, of the which [the LORD] did say to thee, Eat no bread, and drink no water; thy carcase shall not come unto the sepulchre of thy fathers.";
kjv[23] = "And it came to pass, after he had eaten bread, and after he had drunk, that he saddled for him the ass, [to wit], for the prophet whom he had brought back.";
kjv[24] = "And when he was gone, a lion met him by the way, and slew him: and his carcase was cast in the way, and the ass stood by it, the lion also stood by the carcase.";
kjv[25] = "And, behold, men passed by, and saw the carcase cast in the way, and the lion standing by the carcase: and they came and told [it] in the city where the old prophet dwelt.";
kjv[26] = "And when the prophet that brought him back from the way heard [thereof], he said, It [is] the man of God, who was disobedient unto the word of the LORD: therefore the LORD hath delivered him unto the lion, which hath torn him, and slain him, according to the word of the LORD, which he spake unto him.";
kjv[27] = "And he spake to his sons, saying, Saddle me the ass. And they saddled [him].";
kjv[28] = "And he went and found his carcase cast in the way, and the ass and the lion standing by the carcase: the lion had not eaten the carcase, nor torn the ass.";
kjv[29] = "And the prophet took up the carcase of the man of God, and laid it upon the ass, and brought it back: and the old prophet came to the city, to mourn and to bury him.";
kjv[30] = "And he laid his carcase in his own grave; and they mourned over him, [saying], Alas, my brother!";
kjv[31] = "And it came to pass, after he had buried him, that he spake to his sons, saying, When I am dead, then bury me in the sepulchre wherein the man of God [is] buried; lay my bones beside his bones:";
kjv[32] = "For the saying which he cried by the word of the LORD against the altar in Bethel, and against all the houses of the high places which [are] in the cities of Samaria, shall surely come to pass.";
kjv[33] = "After this thing Jeroboam returned not from his evil way, but made again of the lowest of the people priests of the high places: whosoever would, he consecrated him, and he became [one] of the priests of the high places.";
kjv[34] = "And this thing became sin unto the house of Jeroboam, even to cut [it] off, and to destroy [it] from off the face of the earth.";

yng[12] = "And their father saith unto them, `Where [is] this -- the way he hath gone?\' and his sons see the way that the man of God hath gone who came from Judah.";
dby[12] = "And their father said to them, Which way went he? for his sons had seen which way the man of God went, who came from Judah.";
web[12] = "And their father said to them, What way went he? for his sons had seen what way the man of God went, who came from Judah.";
hnv[12] = "Their father said to them, Which way did he go? Now his sons had seen which way the man of God went, who came from Yehudah.";
vul[12] = "et dixit eis pater eorum per quam viam abiit ostenderunt ei filii sui viam per quam abierat vir Dei qui venerat de Iuda";
rsv[13] = "And he said to his sons, &quot;Saddle the ass for me.&quot; So they saddled the ass for him and he mounted it.";
asv[13] = "And he said unto his sons, Saddle me the ass. So they saddled him the ass; and he rode thereon.";
yng[13] = "And he saith unto his sons, `Saddle for me the ass,\' and they saddle for him the ass, and he rideth on it,";
dby[13] = "And he said to his sons, Saddle me the ass. So they saddled him the ass; and he rode thereon,";
web[13] = "And he said to his sons, Saddle me the ass. So they saddled him the ass: and he rode upon it.";
hnv[13] = "He said to his sons, Saddle me the donkey. So they saddled him the donkey; and he rode thereon.";
vul[13] = "et ait filiis suis sternite mihi asinum qui cum stravissent ascendit";
rsv[14] = "And he went after the man of God, and found him sitting under an oak; and he said to him, &quot;Are you the man of God who came from Judah?&quot; And he said, &quot;I am.&quot;";
asv[14] = "And he went after the man of God, and found him sitting under an oak; and he said unto him, Art thou the man of God that camest from Judah? And he said, I am.";
yng[14] = "and goeth after the man of God, and findeth him sitting under the oak, and saith unto him, `Art thou the man of God who hast come from Judah?\' and he saith, `I [am].\'";
dby[14] = "and went after the man of God, and found him sitting under a terebinth; and he said to him, Art thou the man of God that camest from Judah? And he said, I am.";
web[14] = "And went after the man of God, and found him sitting under an oak: and he said to him, [Art] thou the man of God that camest from Judah? And he said, I [am].";
hnv[14] = "He went after the man of God, and found him sitting under an oak; and he said to him, Are you the man of God who came from Yehudah? He said, I am.";
vul[14] = "et abiit post virum Dei et invenit eum sedentem subtus terebinthum et ait illi tune es vir Dei qui venisti de Iuda respondit ille ego sum";
rsv[15] = "Then he said to him, &quot;Come home with me and eat bread.&quot;";
asv[15] = "Then he said unto him, Come home with me, and eat bread.";
yng[15] = "And he saith unto him, `Come with me to the house, and eat bread.\'";
dby[15] = "And he said to him, Come home with me, and eat bread.";
web[15] = "Then he said to him, Come home with me, and eat bread.";
hnv[15] = " Then he said to him, Come home with me, and eat bread.";
vul[15] = "dixit ad eum veni mecum domum ut comedas panem";
rsv[16] = "And he said, &quot;I may not return with you, or go in with you; neither will I eat bread nor drink water with you in this place;";
asv[16] = "And he said, I may not return with thee, nor go in with thee; neither will I eat bread nor drink water with thee in this place:";
yng[16] = "And he saith, `I am not able to turn back with thee, and to go in with thee, nor do I eat bread or drink with thee water in this place,";
dby[16] = "And he said, I cannot return with thee, nor go in with thee; neither will I eat bread nor drink water with thee in this place.";
web[16] = "And he said, I may not return with thee, nor go in with thee: neither will I eat bread nor drink water with thee in this place:";
hnv[16] = "He said, I may not return with you, nor go in with you; neither will I eat bread nor drink water with you in this place:";
vul[16] = "qui ait non possum reverti neque venire tecum nec comedam panem nec bibam aquam in loco isto";
rsv[17] = "for it was said to me by the word of the LORD, \'You shall neither eat bread nor drink water there, nor return by the way that you came.\'&quot;";
asv[17] = "for it was said to me by the word of Jehovah, Thou shalt eat no bread nor drink water there, nor turn again to go by the way that thou camest.";
yng[17] = "for a word [is] unto me by the word of Jehovah, Thou dost not eat bread nor drink there water, thou dost not turn back to go in the way in which thou camest.\'";
dby[17] = "For it was said to me by the word of Jehovah, Thou shalt eat no bread nor drink water there, nor turn again to go by the way that thou wentest.";
web[17] = "For it was said to me by the word of the LORD, Thou shalt eat no bread nor drink water there, nor turn again to go by the way that thou camest.";
hnv[17] = "for it was said to me by the word of the LORD, You shall eat no bread nor drink water there, nor turn again to go by the way that you came.";
vul[17] = "quia locutus est Dominus ad me in sermone Domini dicens non comedes panem et non bibes ibi aquam nec reverteris per viam qua ieris";
rsv[18] = "And he said to him, &quot;I also am a prophet as you are, and an angel spoke to me by the word of the LORD, saying, \'Bring him back with you into your house that he may eat bread and drink water.\'&quot; But he lied to him.";
asv[18] = "And he said unto him, I also am a prophet as thou art; and an angel spake unto me by the word of Jehovah, saying, Bring him back with thee into thy house, that he may eat bread and drink water. [But] he lied unto him.";
yng[18] = "And he saith to him, `I also [am] a prophet like thee, and a messenger spake unto me by the word of Jehovah, saying, Bring him back with thee unto thy house, and he doth eat bread and drink water;\' -- he hath lied to him.";
dby[18] = "And he said to him, I am a prophet also as thou art; and an angel spoke to me by the word of Jehovah saying, Bring him back with thee into thy house, that he may eat bread and drink water. He lied unto him.";
web[18] = "He said to him, I [am] a prophet also as thou [art]; and an angel spoke to me by the word of the LORD, saying, Bring him back with thee into thy house, that he may eat bread and drink water. [But] he lied to him.";
hnv[18] = "He said to him, I also am a prophet as you are; and an angel spoke to me by the word of the LORD, saying, Bring him back with you into your house, that he may eat bread and drink water. [But] he lied to him.";
vul[18] = "qui ait illi et ego propheta sum similis tui et angelus locutus est mihi in sermone Domini dicens reduc eum tecum in domum tuam et comedat panem et bibat aquam fefellit eum";
rsv[19] = "So he went back with him, and ate bread in his house, and drank water.";
asv[19] = "So he went back with him, and did eat bread in his house, and drank water.";
yng[19] = "And he turneth back with him, and eateth bread in his house, and drinketh water.";
dby[19] = "Then he went back with him, and ate bread in his house, and drank water.";
web[19] = "So he went back with him, and ate bread in his house, and drank water.";
hnv[19] = "So he went back with him, and ate bread in his house, and drank water.";
vul[19] = "et reduxit secum comedit ergo panem in domo eius et bibit aquam";
rsv[20] = "And as they sat at the table, the word of the LORD came to the prophet who had brought him back;";
asv[20] = "And it came to pass, as they sat at the table, that the word of Jehovah came unto the prophet that brought him back;";
yng[20] = "And it cometh to pass -- they are sitting at the table -- and a word of Jehovah is unto the prophet who brought him back,";
dby[20] = "And it came to pass as they sat at the table, that the word of Jehovah came to the prophet that brought him back;";
web[20] = "And it came to pass, as they sat at the table, that the word of the LORD came to the prophet that brought him back:";
hnv[20] = "It happened, as they sat at the table, that the word of the LORD came to the prophet who brought him back;";
vul[20] = "cumque sederent ad mensam factus est sermo Domini ad prophetam qui reduxerat eum";
rsv[21] = "and he cried to the man of God who came from Judah, &quot;Thus says the LORD, \'Because you have disobeyed the word of the LORD, and have not kept the commandment which the LORD your God commanded you,";
asv[21] = "and he cried unto the man of God that came from Judah, saying, Thus saith Jehovah, Forasmuch as thou hast been disobedient unto the mouth of Jehovah, and hast not kept the commandment which Jehovah thy God commanded thee,";
yng[21] = "and he calleth unto the man of God who came from Judah, saying, `Thus said Jehovah, Because that thou hast provoked the mouth of Jehovah, and hast not kept the command that Jehovah thy God charged thee,";
dby[21] = "and he cried to the man of God that came from Judah, saying, Thus saith Jehovah: Forasmuch as thou hast disobeyed the word of Jehovah, and hast not kept the commandment that Jehovah thy God commanded thee,";
web[21] = "And he cried to the man of God that came from Judah, saying, Thus saith the LORD, Forasmuch as thou hast disobeyed the mouth of the LORD, and hast not kept the commandment which the LORD thy God commanded thee,";
hnv[21] = "and he cried to the man of God who came from Yehudah, saying, Thus says the LORD, Because you have been disobedient to the mouth of the LORD, and have not kept the mitzvah which the LORD your God commanded you,";
vul[21] = "et exclamavit ad virum Dei qui venerat de Iuda dicens haec dicit Dominus quia inoboediens fuisti ori Domini et non custodisti mandatum quod praecepit tibi Dominus Deus tuus";
rsv[22] = "but have come back, and have eaten bread and drunk water in the place of which he said to you, &quot;Eat no bread, and drink no water&quot;; your body shall not come to the tomb of your fathers.\'&quot;";
asv[22] = "but camest back, and hast eaten bread and drunk water in the place of which he said to thee, Eat no bread, and drink no water; thy body shall not come unto the sepulchre of thy fathers.";
yng[22] = "and turnest back and dost eat bread and drink water in the place of which He said unto thee, Thou dost not eat bread nor drink water -- thy carcase cometh not in unto the burying-place of thy fathers.\'";
dby[22] = "but camest back, and hast eaten bread and drunk water in the place of which he said to thee, Eat no bread and drink no water; thy carcase shall not come to the sepulchre of thy fathers.";
web[22] = "But hast returned, and hast eaten bread and drank water in the place, of which [the LORD] said to thee, Eat no bread, and drink no water; thy carcass shall not come to the sepulcher of thy fathers.";
hnv[22] = "but came back, and have eaten bread and drunk water in the place of which he said to you, Eat no bread, and drink no water; your body shall not come to the tomb of your fathers.";
vul[22] = "et reversus es et comedisti panem et bibisti aquam in loco in quo praecepit tibi ne comederes panem neque biberes aquam non inferetur cadaver tuum in sepulchrum patrum tuorum";
rsv[23] = "And after he had eaten bread and drunk, he saddled the ass for the prophet whom he had brought back.";
asv[23] = "And it came to pass, after he had eaten bread, and after he had drunk, that he saddled for him the ass, [to wit], for the prophet whom he had brought back.";
yng[23] = "And it cometh to pass, after his eating bread, and after his drinking, that he saddleth for him the ass, for the prophet whom he had brought back,";
dby[23] = "And it came to pass, after he had eaten bread, and after he had drunk, that he saddled the ass for him, for the prophet that he had brought back;";
web[23] = "And it came to pass, after he had eaten bread, and after he had drank, that he saddled for him the ass, [to wit], for the prophet whom he had brought back.";
hnv[23] = "It happened, after he had eaten bread, and after he had drunk, that he saddled for him the donkey, [to wit], for the prophet whom he had brought back.";
vul[23] = "cumque comedisset et bibisset stravit asinum prophetae quem reduxerat";
rsv[24] = "And as he went away a lion met him on the road and killed him. And his body was thrown in the road, and the ass stood beside it; the lion also stood beside the body.";
asv[24] = "And when he was gone, a lion met him by the way, and slew him: and his body was cast in the way, and the ass stood by it; the lion also stood by the body.";
yng[24] = "and he goeth, and a lion findeth him in the way, and putteth him to death, and his carcase is cast in the way, and the ass is standing near it, and the lion is standing near the carcase.";
dby[24] = "and he departed. And a lion met him by the way and slew him; and his corpse was cast in the way, and the ass stood by it; the lion also stood by the corpse.";
web[24] = "And when he had gone, a lion met him by the way, and slew him: and his carcass was cast in the way, and the ass stood by it, the lion also stood by the carcass.";
hnv[24] = "When he was gone, a lion met him by the way, and killed him: and his body was cast in the way, and the donkey stood by it; the lion also stood by the body.";
vul[24] = "qui cum abisset invenit eum leo in via et occidit et erat cadaver eius proiectum in itinere asinus autem stabat iuxta illum et leo stabat iuxta cadaver";
rsv[25] = "And behold, men passed by, and saw the body thrown in the road, and the lion standing by the body. And they came and told it in the city where the old prophet dwelt.";
asv[25] = "And, behold, men passed by, and saw the body cast in the way, and the lion standing by the body; and they came and told it in the city where the old prophet dwelt.";
yng[25] = "And lo, men are passing by, and see the carcase cast in the way, and the lion standing near the carcase, and they come and speak [of it] in the city in which the old prophet is dwelling.";
dby[25] = "And behold, men passed by, and saw the corpse cast in the way and the lion standing by the corpse; and they came and told it in the city where the old prophet dwelt.";
web[25] = "And behold, men passed by, and saw the carcass cast in the way, and the lion standing by the carcass: and they came and told [it] in the city where the old prophet dwelt.";
hnv[25] = "Behold, men passed by, and saw the body cast in the way, and the lion standing by the body; and they came and told it in the city where the old prophet lived.";
vul[25] = "et ecce viri transeuntes viderunt cadaver proiectum in via et leonem stantem iuxta cadaver et venerunt et divulgaverunt in civitate in qua prophetes senex ille habitabat";
rsv[26] = "And when the prophet who had brought him back from the way heard of it, he said, &quot;It is the man of God, who disobeyed the word of the LORD; therefore the LORD has given him to the lion, which has torn him and slain him, according to the word which the LORD spoke to him.&quot;";
asv[26] = "And when the prophet that brought him back from the way heard thereof, he said, It is the man of God, who was disobedient unto the mouth of Jehovah: therefore Jehovah hath delivered him unto the lion, which hath torn him, and slain him, according to the word of Jehovah, which he spake unto him.";
yng[26] = "And the prophet who brought him back out of the way heareth and saith, `It [is] the man of God who provoked the mouth of Jehovah, and Jehovah giveth him to the lion, and it destroyeth him, and putteth him to death, according to the word of Jehovah that he spake to him.\'";
dby[26] = "And the prophet that brought him back from the way heard [of it] and said, It is the man of God who was disobedient to the word of Jehovah; therefore Jehovah has delivered him to the lion, which has torn him and slain him, according to the word of Jehovah which he spoke to him.";
web[26] = "And when the prophet that brought him back from the way heard [of it], he said, It [is] the man of God, who was disobedient to the word of the LORD: therefore the LORD hath delivered him to the lion, which hath torn him, and slain him, according to the word of the LORD, which he spoke to him.";
hnv[26] = "When the prophet who brought him back from the way heard of it, he said, It is the man of God, who was disobedient to the mouth of the LORD: therefore the LORD has delivered him to the lion, which has torn him, and slain him, according to the word of the LORD, which he spoke to him.";
vul[26] = "quod cum audisset propheta ille qui reduxerat eum de via ait vir Dei est qui inoboediens fuit ori Domini et tradidit eum Dominus leoni et confregit eum et occidit iuxta verbum Domini quod locutus est ei";
rsv[27] = "And he said to his sons, &quot;Saddle the ass for me.&quot; And they saddled it.";
asv[27] = "And he spake to his sons, saying, Saddle me the ass. And they saddled it.";
yng[27] = "And he speaketh unto his sons saying, `Saddle for me the ass,\' and they saddle [it].";
dby[27] = "And he spoke to his sons saying, Saddle me the ass; and they saddled it.";
web[27] = "And he spoke to his sons, saying, Saddle me the ass. And they saddled [him].";
hnv[27] = "He spoke to his sons, saying, Saddle me the donkey. They saddled it.";
vul[27] = "dixitque ad filios suos sternite mihi asinum qui cum stravissent";
rsv[28] = "And he went and found his body thrown in the road, and the ass and the lion standing beside the body. The lion had not eaten the body or torn the ass.";
asv[28] = "And he went and found his body cast in the way, and the ass and the lion standing by the body: the lion had not eaten the body, nor torn the ass.";
yng[28] = "And he goeth and findeth his carcase cast in the way, and the ass and the lion are standing near the carcase -- the lion hath not eaten the carcase nor destroyed the ass.";
dby[28] = "And he went and found his corpse cast in the way, and the ass and the lion standing by the corpse: the lion had not eaten the corpse, nor torn the ass.";
web[28] = "And he went and found his carcass cast in the way, and the ass and the lion standing by the carcass: the lion had not eaten the carcass, nor torn the ass.";
hnv[28] = "He went and found his body cast in the way, and the donkey and the lion standing by the body: the lion had not eaten the body, nor torn the donkey.";
vul[28] = "et ille abisset invenit cadaver eius proiectum in via et asinum et leonem stantes iuxta cadaver non comedit leo de cadavere nec laesit asinum";
rsv[29] = "And the prophet took up the body of the man of God and laid it upon the ass, and brought it back to the city, to mourn and to bury him.";
asv[29] = "And the prophet took up the body of the man of God, and laid it upon the ass, and brought it back; and he came to the city of the old prophet, to mourn, and to bury him.";
yng[29] = "And the prophet taketh up the carcase of the man of God, and placeth it on the ass, and bringeth it back, and the old prophet cometh in unto the city to mourn and to bury him,";
dby[29] = "And the prophet took up the corpse of the man of God, and laid it upon the ass, and brought it back; and the old prophet came into the city, to mourn and to bury him.";
web[29] = "And the prophet took up the carcass of the man of God, and laid it upon the ass, and brought it back: and the old prophet came to the city, to mourn and to bury him.";
hnv[29] = " The prophet took up the body of the man of God, and laid it on the donkey, and brought it back; and he came to the city of the old prophet, to mourn, and to bury him.";
vul[29] = "tulit ergo prophetes cadaver viri Dei et posuit illud super asinum et reversus intulit in civitatem prophetae senis ut plangerent eum";
rsv[30] = "And he laid the body in his own grave; and they mourned over him, saying, &quot;Alas, my brother!&quot;";
asv[30] = "And he laid his body in his own grave; and they mourned over him, [saying], Alas, my brother!";
yng[30] = "and he placeth his carcase in his own grave, and they mourn for him, `Oh, my brother!\'";
dby[30] = "And he laid his corpse in his own sepulchre; and they mourned over him [saying], Alas, my brother!";
web[30] = "And he laid his carcass in his own grave; and they mourned over him, [saying], Alas, my brother!";
hnv[30] = "He laid his body in his own grave; and they mourned over him, [saying], Alas, my brother!";
vul[30] = "et posuit cadaver eius in sepulchro suo et planxerunt eum heu frater";
rsv[31] = "And after he had buried him, he said to his sons, &quot;When I die, bury me in the grave in which the man of God is buried; lay my bones beside his bones.";
asv[31] = "And it came to pass, after he had buried him, that he spake to his sons, saying, When I am dead, then bury me in the sepulchre wherein the man of God is buried; lay my bones beside his bones.";
yng[31] = "And it cometh to pass, after his burying him, that he speaketh unto his sons, saying, `At my death -- ye have buried me in the burying-place in which the man of God is buried; near his bones place my bones;";
dby[31] = "And it came to pass after he had buried him, that he spoke to his sons saying, When I am dead, bury me in the sepulchre in which the man of God is buried; lay my bones beside his bones.";
web[31] = "And it came to pass, after he had buried him, that he spoke to his sons, saying, When I am dead, then bury me in the sepulcher in which the man of God [is] buried; lay my bones beside his bones:";
hnv[31] = " It happened, after he had buried him, that he spoke to his sons, saying, When I am dead, then bury me in the tomb in which the man of God is buried; lay my bones beside his bones.";
vul[31] = "cumque planxissent eum dixit ad filios suos cum mortuus fuero sepelite me in sepulchro in quo vir Dei sepultus est iuxta ossa eius ponite ossa mea";
rsv[32] = "For the saying which he cried by the word of the LORD against the altar in Bethel, and against all the houses of the high places which are in the cities of Sama\'ria, shall surely come to pass.&quot;";
asv[32] = "For the saying which he cried by the word of Jehovah against the altar in Beth-el, and against all the houses of the high places which are in the cities of Samaria, shall surely come to pass.";
yng[32] = "for the word certainly cometh to pass that he called by the word of Jehovah concerning the altar which [is] Beth-El, and concerning all the houses of the high places that [are] in cities of Samaria.\'";
dby[32] = "For the word that he cried by the word of Jehovah against the altar in Bethel, and against all the houses of the high places that are in the cities of Samaria, shall certainly come to pass.";
web[32] = "For the saying which he cried by the word of the LORD against the altar in Beth-el, and against all the houses of the high places which [are] in the cities of Samaria, shall surely come to pass.";
hnv[32] = "For the saying which he cried by the word of the LORD against the altar in Beit-El, and against all the houses of the high places which are in the cities of Shomron, shall surely happen.";
vul[32] = "profecto enim veniet sermo quem praedixit in sermone Domini contra altare quod est in Bethel et contra omnia fana excelsorum quae sunt in urbibus Samariae";
rsv[33] = "After this thing Jerobo\'am did not turn from his evil way, but made priests for the high places again from among all the people; any who would, he consecrated to be priests of the high places.";
asv[33] = "After this thing Jeroboam returned not from his evil way, but made again from among all the people priests of the high places: whosoever would, he consecrated him, that there might be priests of the high places.";
yng[33] = "After this thing Jeroboam hath not turned from his evil way, and turneth back, and maketh of the extremities of the people priests of high places; he who is desirous he consecrateth his hand, and he is of the priests of the high places.";
dby[33] = "After this thing Jeroboam turned not from his evil way, but made again from all classes of the people priests of the high places: whosoever would, he consecrated him, and he became [one] of the priests of the high places.";
web[33] = "After this thing Jeroboam returned not from his evil way, but made again of the lowest of the people priests of the high places: whoever would, he consecrated him, and he became [one] of the priests of the high places.";
hnv[33] = "After this thing Yarov`am didn\'t return from his evil way, but made again from among all the people Kohanim of the high places: whoever would, he consecrated him, that there might be Kohanim of the high places.";
vul[33] = "post verba haec non est reversus Hieroboam de via sua pessima sed e contrario fecit de novissimis populi sacerdotes excelsorum quicumque volebat implebat manum suam et fiebat sacerdos excelsorum";
rsv[34] = "And this thing became sin to the house of Jerobo\'am, so as to cut it off and to destroy it from the face of the earth.";
asv[34] = "And this thing became sin unto the house of Jeroboam, even to cut it off, and to destroy it from off the face of the earth.";
yng[34] = "And in this thing is the sin of the house of Jeroboam, even to cut [it] off, and to destroy [it] from off the face of the ground.";
dby[34] = "And by this thing there was sin on the house of Jeroboam, even to cut it off and to destroy it from off the face of the earth.";
web[34] = "And this thing became sin to the house of Jeroboam, even to cut [it off], and to destroy [it] from the face of the earth.";
hnv[34] = "This thing became sin to the house of Yarov`am, even to cut it off, and to destroy it from off the surface of the eretz.";
vul[34] = "et propter hanc causam peccavit domus Hieroboam et eversa est et deleta de superficie terrae";
