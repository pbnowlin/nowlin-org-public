csb[1] = "Now King Ben-hadad of Aram assembled his entire army. Thirty-two kings, along with horses and chariots, were with him. He marched up, besieged Samaria, and fought against it.";
csb[2] = "He sent messengers into the city to King Ahab of Israel and said to him, &quot;This is what Ben-hadad says:";
csb[3] = "&quot;\'Your silver and your gold are mine! And your best wives and children are mine as well! \' &quot;";
csb[4] = "Then the king of Israel answered, &quot;Just as you say, my lord the king: I am yours, along with all that I have.&quot;";
csb[5] = "The messengers then returned and said, &quot;This is what Ben-hadad says: \'I have sent messengers to you, saying: You are to give me your silver, your gold, your wives, and your children.";
csb[6] = "&quot;But at this time tomorrow I will send my servants to you, and they will search your palace and your servants\' houses. They will lay their hands on and take away whatever is precious to you.\' &quot;";
csb[7] = "Then the king of Israel called for all the elders of the land and said, &quot;Recognize that this one is only looking for trouble, for he demanded my wives, my children, my silver, and my gold, and I didn\'t turn him down.&quot;";
csb[8] = "All the elders and all the people said to him, &quot;Don\'t listen or agree.&quot;";
csb[9] = "So he said to Ben-hadad\'s messengers, &quot;Say to my lord the king, \'Everything you demanded of your servant the first time, I will do, but this thing I cannot do.\' &quot; So the messengers left and took word back to him.";
csb[10] = "Then Ben-hadad sent messengers to him and said, &quot;May the gods punish me and do so severely if Samaria\'s dust amounts to a handful for each of the people who follow me.&quot;";
csb[11] = "The king of Israel answered, &quot;Say this: \'Don\'t let the one who puts on his armor boast like the one who takes it off.\' &quot;";
csb[12] = "When Ben-hadad heard this response, while he and the kings were drinking in their quarters, he said to his servants, &quot;Take your positions.&quot; So they took their positions against the city.";
csb[13] = "A prophet approached King Ahab of Israel and said, &quot;This is what the LORD says: \'Do you see this whole huge army? Watch, I am handing it over to you today so that you may know that I am the LORD.\' &quot;";
csb[14] = "Ahab asked, &quot;By whom? &quot; And the prophet said, &quot;This is what the LORD says: \'By the young men of the provincial leaders.\' &quot; Then he asked, &quot;Who is to start the battle? &quot; He said, &quot;You.&quot;";
csb[15] = "So Ahab mobilized the young men of the provincial leaders, and there were 232. After them he mobilized all the Israelite troops: 7,000.";
csb[16] = "They marched out at noon while Ben-hadad and the thirty-two kings who were helping him were getting drunk in their quarters.";
csb[17] = "The young men of the provincial leaders marched out first. Then Ben-hadad sent out scouts, and they reported to him, saying, &quot;Men are marching out of Samaria.&quot;";
csb[18] = "So he said, &quot;If they have marched out in peace, take them alive, and if they have marched out for battle, take them alive.&quot;";
csb[19] = "The young men of the provincial leaders and the army behind them marched out from the city,";
csb[20] = "and each one struck down his opponent. So the Arameans fled and Israel pursued them, but King Ben-hadad of Aram escaped on a horse with the cavalry.";
csb[21] = "Then the king of Israel marched out and attacked the cavalry and the chariots. He inflicted a severe slaughter on Aram.";
csb[22] = "The prophet approached the king of Israel and said to him, &quot;Go and strengthen yourself, then consider carefully what you should do, for in the spring the king of Aram will attack you.&quot;";
csb[23] = "Now the king of Aram\'s servants said to him, &quot;Their gods are gods of the hill country. That\'s why they were stronger than we were. Instead, we should fight with them on the plain; then we will certainly be stronger than they are.";
csb[24] = "&quot;Also do this: remove each king from his position and appoint captains in their place.";
csb[25] = "&quot;Raise another army for yourself like the army you lost -- horse for horse, chariot for chariot -- and let\'s fight with them on the plain; and we will certainly be stronger than they are.&quot; The king listened to them and did it.";
csb[26] = "In the spring, Ben-hadad mobilized the Arameans and went up to Aphek to battle Israel.";
csb[27] = "The Israelites mobilized, gathered supplies, and went to fight them. The Israelites camped in front of them like two little flocks of goats, while the Arameans filled the landscape.";
csb[28] = "Then the man of God approached and said to the king of Israel, &quot;This is what the LORD says: \'Because the Arameans have said: The LORD is a god of the mountains and not a god of the valleys, I will hand over all this whole huge army to you. Then you will know that I am the LORD.\' &quot;";
csb[29] = "They camped opposite each other for seven days. On the seventh day, the battle took place, and the Israelites struck down the Arameans -- one hundred thousand foot soldiers in one day.";
csb[30] = "The ones who remained fled into the city of Aphek, and the wall fell on those twenty-seven thousand remaining men. Ben-hadad also fled and went into an inner room in the city.";
csb[31] = "His servants said to him, &quot;Consider this: we have heard that the kings of the house of Israel are merciful kings. So let\'s put sackcloth around our waists and ropes around our heads, and let\'s go out to the king of Israel. Perhaps he will spare your life.&quot;";
csb[32] = "So they dressed with sackcloth around their waists and ropes around their heads, went to the king of Israel, and said, &quot;Your servant Ben-hadad says, \'Please spare my life.\' &quot; So he said, &quot;Is he still alive? He is my brother.&quot;";
csb[33] = "Now the men were looking for a sign of hope, so they quickly picked up on this and responded, &quot;Yes, it is your brother Ben-hadad.&quot; Then he said, &quot;Go and bring him.&quot; So Ben-hadad came out to him, and Ahab had him come up into the chariot.";
csb[34] = "Then Ben-hadad said to him, &quot;I restore to you the cities that my father took from your father, and you may set up marketplaces for yourself in Damascus, like my father set up in Samaria.&quot; Ahab responded, &quot;On the basis of this treaty, I release you.&quot; So he made a treaty with him and released him.";
csb[35] = "One of the sons of the prophets said to his fellow prophet by the word of the LORD, &quot;Strike me! &quot; But the man refused to strike him.";
csb[36] = "He told him, &quot;Because you did not listen to the LORD, mark my words: When you leave me, a lion will kill you.&quot; When he left him, a lion attacked and killed him.";
csb[37] = "The prophet found another man and said to him, &quot;Strike me! &quot; So the man struck him, inflicting a wound.";
csb[38] = "Then the prophet went and waited for the king on the road. He disguised himself with a bandage over his eyes.";
csb[39] = "As the king was passing by, he cried out to the king and said, &quot;Your servant marched out into the middle of the battle. Suddenly, a man turned aside and brought someone to me and said, \'Guard this man! If he is ever missing, it will be your life in place of his life, or you will weigh out seventy-five pounds of silver.\'";
csb[40] = "&quot;But while your servant was busy here and there, he disappeared.&quot; The king of Israel said to him, &quot;That will be your sentence; you yourself have decided it.&quot;";
csb[41] = "He quickly removed the bandage from his eyes. The king of Israel recognized that he was one of the prophets.";
csb[42] = "The prophet said to him, &quot;This is what the LORD says: \'Because you released from your hand the man I had set apart for destruction, it will be your life in place of his life and your people in place of his people.\' &quot;";
csb[43] = "The king of Israel left for home resentful and angry, and he entered Samaria.";
kjv[1] = "And Benhadad the king of Syria gathered all his host together: and [there were] thirty and two kings with him, and horses, and chariots: and he went up and besieged Samaria, and warred against it.";
kjv[2] = "And he sent messengers to Ahab king of Israel into the city, and said unto him, Thus saith Benhadad,";
kjv[3] = "Thy silver and thy gold [is] mine; thy wives also and thy children, [even] the goodliest, [are] mine.";
kjv[4] = "And the king of Israel answered and said, My lord, O king, according to thy saying, I [am] thine, and all that I have.";
kjv[5] = "And the messengers came again, and said, Thus speaketh Benhadad, saying, Although I have sent unto thee, saying, Thou shalt deliver me thy silver, and thy gold, and thy wives, and thy children;";
kjv[6] = "Yet I will send my servants unto thee to morrow about this time, and they shall search thine house, and the houses of thy servants; and it shall be, [that] whatsoever is pleasant in thine eyes, they shall put [it] in their hand, and take [it] away.";
kjv[7] = "Then the king of Israel called all the elders of the land, and said, Mark, I pray you, and see how this [man] seeketh mischief: for he sent unto me for my wives, and for my children, and for my silver, and for my gold; and I denied him not.";
kjv[8] = "And all the elders and all the people said unto him, Hearken not [unto him], nor consent.";
kjv[9] = "Wherefore he said unto the messengers of Benhadad, Tell my lord the king, All that thou didst send for to thy servant at the first I will do: but this thing I may not do. And the messengers departed, and brought him word again.";
kjv[10] = "And Benhadad sent unto him, and said, The gods do so unto me, and more also, if the dust of Samaria shall suffice for handfuls for all the people that follow me.";
kjv[11] = "And the king of Israel answered and said, Tell [him], Let not him that girdeth on [his harness] boast himself as he that putteth it off.";
kjv[12] = "And it came to pass, when [Benhadad] heard this message, as he [was] drinking, he and the kings in the pavilions, that he said unto his servants, Set [yourselves in array]. And they set [themselves in array] against the city.";
kjv[13] = "And, behold, there came a prophet unto Ahab king of Israel, saying, Thus saith the LORD, Hast thou seen all this great multitude? behold, I will deliver it into thine hand this day; and thou shalt know that I [am] the LORD.";
kjv[14] = "And Ahab said, By whom? And he said, Thus saith the LORD, [Even] by the young men of the princes of the provinces. Then he said, Who shall order the battle? And he answered, Thou.";
kjv[15] = "Then he numbered the young men of the princes of the provinces, and they were two hundred and thirty two: and after them he numbered all the people, [even] all the children of Israel, [being] seven thousand.";
kjv[16] = "And they went out at noon. But Benhadad [was] drinking himself drunk in the pavilions, he and the kings, the thirty and two kings that helped him.";
kjv[17] = "And the young men of the princes of the provinces went out first; and Benhadad sent out, and they told him, saying, There are men come out of Samaria.";
kjv[18] = "And he said, Whether they be come out for peace, take them alive; or whether they be come out for war, take them alive.";
kjv[19] = "So these young men of the princes of the provinces came out of the city, and the army which followed them.";
kjv[20] = "And they slew every one his man: and the Syrians fled; and Israel pursued them: and Benhadad the king of Syria escaped on an horse with the horsemen.";
kjv[21] = "And the king of Israel went out, and smote the horses and chariots, and slew the Syrians with a great slaughter.";
kjv[22] = "And the prophet came to the king of Israel, and said unto him, Go, strengthen thyself, and mark, and see what thou doest: for at the return of the year the king of Syria will come up against thee.";
kjv[23] = "And the servants of the king of Syria said unto him, Their gods [are] gods of the hills; therefore they were stronger than we; but let us fight against them in the plain, and surely we shall be stronger than they.";
kjv[24] = "And do this thing, Take the kings away, every man out of his place, and put captains in their rooms:";
kjv[25] = "And number thee an army, like the army that thou hast lost, horse for horse, and chariot for chariot: and we will fight against them in the plain, [and] surely we shall be stronger than they. And he hearkened unto their voice, and did so.";
kjv[26] = "And it came to pass at the return of the year, that Benhadad numbered the Syrians, and went up to Aphek, to fight against Israel.";
kjv[27] = "And the children of Israel were numbered, and were all present, and went against them: and the children of Israel pitched before them like two little flocks of kids; but the Syrians filled the country.";
kjv[28] = "And there came a man of God, and spake unto the king of Israel, and said, Thus saith the LORD, Because the Syrians have said, The LORD [is] God of the hills, but he [is] not God of the valleys, therefore will I deliver all this great multitude into thine hand, and ye shall know that I [am] the LORD.";
kjv[29] = "And they pitched one over against the other seven days. And [so] it was, that in the seventh day the battle was joined: and the children of Israel slew of the Syrians an hundred thousand footmen in one day.";
kjv[30] = "But the rest fled to Aphek, into the city; and [there] a wall fell upon twenty and seven thousand of the men [that were] left. And Benhadad fled, and came into the city, into an inner chamber.";
kjv[31] = "And his servants said unto him, Behold now, we have heard that the kings of the house of Israel [are] merciful kings: let us, I pray thee, put sackcloth on our loins, and ropes upon our heads, and go out to the king of Israel: peradventure he will save thy life.";
kjv[32] = "So they girded sackcloth on their loins, and [put] ropes on their heads, and came to the king of Israel, and said, Thy servant Benhadad saith, I pray thee, let me live. And he said, [Is] he yet alive? he [is] my brother.";
kjv[33] = "Now the men did diligently observe whether [any thing would come] from him, and did hastily catch [it]: and they said, Thy brother Benhadad. Then he said, Go ye, bring him. Then Benhadad came forth to him; and he caused him to come up into the chariot.";
kjv[34] = "And [Benhadad] said unto him, The cities, which my father took from thy father, I will restore; and thou shalt make streets for thee in Damascus, as my father made in Samaria. Then [said Ahab], I will send thee away with this covenant. So he made a covenant with him, and sent him away.";
kjv[35] = "And a certain man of the sons of the prophets said unto his neighbour in the word of the LORD, Smite me, I pray thee. And the man refused to smite him.";
kjv[36] = "Then said he unto him, Because thou hast not obeyed the voice of the LORD, behold, as soon as thou art departed from me, a lion shall slay thee. And as soon as he was departed from him, a lion found him, and slew him.";
kjv[37] = "Then he found another man, and said, Smite me, I pray thee. And the man smote him, so that in smiting he wounded [him].";
kjv[38] = "So the prophet departed, and waited for the king by the way, and disguised himself with ashes upon his face.";
kjv[39] = "And as the king passed by, he cried unto the king: and he said, Thy servant went out into the midst of the battle; and, behold, a man turned aside, and brought a man unto me, and said, Keep this man: if by any means he be missing, then shall thy life be for his life, or else thou shalt pay a talent of silver.";
kjv[40] = "And as thy servant was busy here and there, he was gone. And the king of Israel said unto him, So [shall] thy judgment [be]; thyself hast decided [it].";
kjv[41] = "And he hasted, and took the ashes away from his face; and the king of Israel discerned him that he [was] of the prophets.";
kjv[42] = "And he said unto him, Thus saith the LORD, Because thou hast let go out of [thy] hand a man whom I appointed to utter destruction, therefore thy life shall go for his life, and thy people for his people.";
kjv[43] = "And the king of Israel went to his house heavy and displeased, and came to Samaria.";

vul[9] = "respondit itaque nuntiis Benadad dicite domino meo regi omnia propter quae misisti ad me servum tuum initio faciam hanc autem rem facere non possum";
rsv[10] = "Ben-ha\'dad sent to him and said, &quot;The gods do so to me, and more also, if the dust of Sama\'ria shall suffice for handfuls for all the people who follow me.&quot;";
asv[10] = "And Ben-hadad sent unto him, and said, The gods do so unto me, and more also, if the dust of Samaria shall suffice for handfuls for all the people that follow me.";
yng[10] = "And Ben-Hadad sendeth unto him, and saith, `Thus do the gods to me, and thus do they add, if the dust of Samaria suffice for handfuls for all the people who [are] at my feet.\'";
dby[10] = "And Ben-Hadad sent to him and said, The gods do so to me, and more also, if the dust of Samaria shall suffice for handfuls for all the people that follow me!";
web[10] = "And Ben-hadad sent to him, and said, The gods do so to me, and more also, if the dust of Samaria shall suffice for handfuls for all the people that follow me.";
hnv[10] = "Ben-Hadad sent to him, and said, The gods do so to me, and more also, if the dust of Shomron shall suffice for handfuls for all the people who follow me.";
vul[10] = "reversique nuntii rettulerunt ei qui remisit et ait haec faciant mihi dii et haec addant si suffecerit pulvis Samariae pugillis omnis populi qui sequitur me";
rsv[11] = "And the king of Israel answered, &quot;Tell him, \'Let not him that girds on his armor boast himself as he that puts it off.\'&quot;";
asv[11] = "And the king of Israel answered and said, Tell him, Let not him that girdeth on [his armor] boast himself as he that putteth it off.";
yng[11] = "And the king of Israel answereth and saith, `Speak ye: let not him who is girding on boast himself as him who is loosing [his armour].\'";
dby[11] = "And the king of Israel answered and said, Tell [him], Let not him that girdeth on boast himself as he that putteth off!";
web[11] = "And the king of Israel answered and said, Tell [him], Let not him that girdeth on [his harness] boast himself as he that putteth it off.";
hnv[11] = "The king of Yisra\'el answered, Tell him, Don\'t let him who girds on [his armor] boast himself as he who puts it off.";
vul[11] = "et respondens rex Israhel ait dicite ei ne glorietur accinctus aeque ut discinctus";
rsv[12] = "When Ben-ha\'dad heard this message as he was drinking with the kings in the booths, he said to his men, &quot;Take your positions.&quot; And they took their positions against the city.";
asv[12] = "And it came to pass, when [Ben-hadad] heard this message, as he was drinking, he and the kings, in the pavilions, that he said unto his servants, Set [yourselves in array]. And they set [themselves in array] against the city.";
yng[12] = "And it cometh to pass at the hearing of this word -- and he is drinking, he and the kings, in the booths -- that he saith unto his servants, `Set yourselves;\' and they set themselves against the city.";
dby[12] = "And it came to pass when he heard this word, as he was drinking, he and the kings in the tents, that he said to his servants, Set yourselves. And they set themselves against the city.";
web[12] = "And it came to pass, when [Ben-hadad] heard this message as he [was] drinking, he and the kings in the pavilions, that he said to his servants, Set [yourselves in array]. And they set [themselves in array] against the city.";
hnv[12] = "It happened, when [Ben-Hadad] heard this message, as he was drinking, he and the kings, in the pavilions, that he said to his servants, Set [yourselves in array]. They set [themselves in array] against the city.";
vul[12] = "factum est autem cum audisset verbum istud bibebat ipse et reges in umbraculis et ait servis suis circumdate civitatem et circumdederunt eam";
rsv[13] = "And behold, a prophet came near to Ahab king of Israel and said, &quot;Thus says the LORD, Have you seen all this great multitude? Behold, I will give it into your hand this day; and you shall know that I am the LORD.&quot;";
asv[13] = "And, behold, a prophet came near unto Ahab king of Israel, and said, Thus saith Jehovah, Hast thou seen all this great multitude? behold, I will deliver it into thy hand this day; and thou shalt know that I am Jehovah.";
yng[13] = "And lo, a certain prophet hath come nigh unto Ahab king of Israel, and saith, `Thus said Jehovah, `Hast thou seen all this great multitude? lo, I am giving it into thy hand to-day, and thou hast known that I [am] Jehovah.\'";
dby[13] = "And behold, a prophet drew near to Ahab king of Israel, and said, Thus saith Jehovah: Hast thou seen all this great multitude? behold, I will deliver it into thy hand this day; and thou shalt know that I am Jehovah.";
web[13] = "And behold, there came a prophet to Ahab king of Israel, saying, Thus saith the LORD, Hast thou seen all this great multitude? behold, I will deliver it into thy hand this day; and thou shalt know that I [am] the LORD.";
hnv[13] = "Behold, a prophet came near to Ach\'av king of Yisra\'el, and said, Thus says the LORD, Have you seen all this great multitude? behold, I will deliver it into your hand this day; and you shall know that I am the LORD.";
vul[13] = "et ecce propheta unus accedens ad Ahab regem Israhel ait haec dicit Dominus certe vidisti omnem multitudinem hanc nimiam ecce ego tradam eam in manu tua hodie ut scias quia ego sum Dominus";
rsv[14] = "And Ahab said, &quot;By whom?&quot; He said, &quot;Thus says the LORD, By the servants of the governors of the districts.&quot; Then he said, &quot;Who shall begin the battle?&quot; He answered, &quot;You.&quot;";
asv[14] = "And Ahab said, By whom? And he said, Thus saith Jehovah, By the young men of the princes of the provinces. Then he said, Who shall begin the battle? And he answered, Thou.";
yng[14] = "And Ahab saith, `By whom?\' and he saith, `Thus said Jehovah, By the young men of the heads of the provinces;\' and he saith, `Who doth direct the battle?\' and he saith, `Thou.\'";
dby[14] = "And Ahab said, By whom? And he said, Thus saith Jehovah: By the servants of the princes of the provinces. Then he said, Who shall begin the battle? And he said, Thou.";
web[14] = "And Ahab said, By whom? And he said, Thus saith the LORD, [Even] by the young men of the princes of the provinces. Then he said, Who shall order the battle? And he answered, Thou.";
hnv[14] = "Ach\'av said, By whom? He said, Thus says the LORD, By the young men of the princes of the provinces. Then he said, Who shall begin the battle? He answered, You.";
vul[14] = "et ait Ahab per quem dixitque ei haec dicit Dominus per pedisequos principum provinciarum et ait quis incipiet proeliari et ille dixit tu";
rsv[15] = "Then he mustered the servants of the governors of the districts, and they were two hundred and thirty-two; and after them he mustered all the people of Israel, seven thousand.";
asv[15] = "Then he mustered the young men of the princes of the provinces, and they were two hundred and thirty-two: and after them he mustered all the people, even all the children of Israel, being seven thousand.";
yng[15] = "And he inspecteth the young men of the heads of the provinces, and they are two hundred, two and thirty, and after them he hath inspecteth the whole of the people, all the sons of Israel, seven thousand,";
dby[15] = "And he numbered the servants of the princes of the provinces, and they were two hundred and thirty-two; and after them he numbered all the people, all the children of Israel, seven thousand.";
web[15] = "Then he numbered the young men of the princes of the provinces, and they were two hundred and thirty two: and after them he numbered all the people, [even] all the children of Israel, [being] seven thousand.";
hnv[15] = "Then he mustered the young men of the princes of the provinces, and they were two hundred and thirty-two: and after them he mustered all the people, even all the children of Yisra\'el, being seven thousand.";
vul[15] = "recensuit ergo pueros principum provinciarum et repperit numerum ducentorum triginta duum et post eos recensuit populum omnes filios Israhel septem milia";
rsv[16] = "And they went out at noon, while Ben-ha\'dad was drinking himself drunk in the booths, he and the thirty-two kings who helped him.";
asv[16] = "And they went out at noon. But Ben-hadad was drinking himself drunk in the pavilions, he and the kings, the thirty and two kings that helped him.";
yng[16] = "and they go out at noon, and Ben-Hadad is drinking -- drunk in the booths, he and the kings, the thirty and two kings, helping him.";
dby[16] = "And they went out at noon; and Ben-Hadad drank himself drunk in the tents, he and the kings, the thirty-two kings that helped him.";
web[16] = "And they went out at noon. But Ben-hadad [was] drinking himself drunk in the pavilions, he and the kings, the thirty and two kings that helped him.";
hnv[16] = "They went out at noon. But Ben-Hadad was drinking himself drunk in the pavilions, he and the kings, the thirty-two kings who helped him.";
vul[16] = "et egressi sunt meridie Benadad autem bibebat temulentus in umbraculo suo et reges triginta duo cum eo qui ad auxilium eius venerant";
rsv[17] = "The servants of the governors of the districts went out first. And Ben-ha\'dad sent out scouts, and they reported to him, &quot;Men are coming out from Sama\'ria.&quot;";
asv[17] = "And the young men of the princes of the provinces went out first; and Ben-hadad sent out, and they told him, saying, There are men come out from Samaria.";
yng[17] = "And the young men of the heads of the provinces go out at the first, and Ben-Hadad sendeth, and they declare to him, saying, `Men have come out of Samaria.\'";
dby[17] = "And the servants of the princes of the provinces went out first; and Ben-Hadad sent out, and they told him saying, There are men come out of Samaria.";
web[17] = "And the young men of the princes of the provinces went out first; and Ben-hadad sent out, and they told him, saying, There are men come out of Samaria.";
hnv[17] = "The young men of the princes of the provinces went out first; and Ben-Hadad sent out, and they told him, saying, There are men come out from Shomron.";
vul[17] = "egressi sunt autem pueri principum provinciarum in prima fronte misit itaque Benadad qui nuntiaverunt ei dicentes viri egressi sunt de Samaria";
rsv[18] = "He said, &quot;If they have come out for peace, take them alive; or if they have come out for war, take them alive.&quot;";
asv[18] = "And he said, Whether they are come out for peace, take them alive; or whether they are come out for war, take them alive.";
yng[18] = "And he saith, `If for peace they have come out -- catch them alive; and if for battle they have come out -- alive catch them.\'";
dby[18] = "And he said, Whether they be come out for peace, take them alive; or whether they be come out for war, take them alive.";
web[18] = "And he said, Whether they have come out for peace, take them alive; or whether they have come out for war, take them alive.";
hnv[18] = "He said, Whether they are come out for shalom, take them alive, or whether they are come out for war, taken them alive.";
vul[18] = "at ille sive ait pro pace veniunt adprehendite eos vivos sive ut proelientur vivos eos capite";
rsv[19] = "So these went out of the city, the servants of the governors of the districts, and the army which followed them.";
asv[19] = "So these went out of the city, the young men of the princes of the provinces, and the army which followed them.";
yng[19] = "And these have gone out of the city -- the young men of the heads of the provinces -- and the force that [is] after them,";
dby[19] = "And these servants of the princes of the provinces came out of the city, and the army that followed them.";
web[19] = "So these young men of the princes of the provinces came out of the city, and the army which followed them.";
hnv[19] = "So these went out of the city, the young men of the princes of the provinces, and the army which followed them.";
vul[19] = "egressi sunt ergo pueri principum provinciarum ac reliquus exercitus sequebatur";
rsv[20] = "And each killed his man; the Syrians fled and Israel pursued them, but Ben-ha\'dad king of Syria escaped on a horse with horsemen.";
asv[20] = "And they slew every one his man; and the Syrians fled, and Israel pursued them: and Ben-hadad the king of Syria escaped on a horse with horsemen.";
yng[20] = "and smite each his man, and Aram fleeth, and Israel pursueth them, and Ben-Hadad king of Aram escapeth on a horse, and the horsemen;";
dby[20] = "And they slew every one his man; and the Syrians fled, and Israel pursued them; and Ben-Hadad the king of Syria escaped on a horse with the horsemen.";
web[20] = "And they slew every one his man: and the Syrians fled; and Israel pursued them: and Ben-hadad the king of Syria escaped on a horse with the horsemen.";
hnv[20] = " They killed everyone his man; and the Aram fled, and Yisra\'el pursued them: and Ben-Hadad the king of Aram escaped on a horse with horsemen.";
vul[20] = "et percussit unusquisque virum qui contra se venerat fugeruntque Syri et persecutus est eos Israhel fugit quoque Benadad rex Syriae in equo cum equitibus";
rsv[21] = "And the king of Israel went out, and captured the horses and chariots, and killed the Syrians with a great slaughter.";
asv[21] = "And the king of Israel went out, and smote the horses and chariots, and slew the Syrians with a great slaughter.";
yng[21] = "and the king of Israel goeth out, and smiteth the horses, and the charioteers, and hath smitten among the Aramaeans a great smiting.";
dby[21] = "And the king of Israel went out, and smote the horses and chariots, and slew the Syrians with a great slaughter.";
web[21] = "And the king of Israel went out, and smote the horses and chariots, and slew the Syrians with a great slaughter.";
hnv[21] = "The king of Yisra\'el went out, and struck the horses and chariots, and killed the Aram with a great slaughter.";
vul[21] = "necnon et egressus rex Israhel percussit equos et currus et percussit Syriam plaga magna";
rsv[22] = "Then the prophet came near to the king of Israel, and said to him, &quot;Come, strengthen yourself, and consider well what you have to do; for in the spring the king of Syria will come up against you.&quot;";
asv[22] = "And the prophet came near to the king of Israel, and said unto him, Go, strengthen thyself, and mark, and see what thou doest; for at the return of the year the king of Syria will come up against thee.";
yng[22] = "And the prophet cometh nigh unto the king of Israel, and saith to him, `Go, strengthen thyself, and know and see that which thou dost, for at the turn of the year the king of Aram is coming up against thee.\'";
dby[22] = "And the prophet drew near to the king of Israel, and said to him, Go, strengthen thyself, and understand, and see what thou shalt do; for at the return of the year the king of Syria will come up against thee.";
web[22] = "And the prophet came to the king of Israel, and said to him, Go, strengthen thyself, and mark, and see what thou doest: for at the return of the year the king of Syria will come up against thee.";
hnv[22] = "The prophet came near to the king of Yisra\'el, and said to him, Go, strengthen yourself, and mark, and see what you do; for at the return of the year the king of Aram will come up against you.";
vul[22] = "accedens autem propheta ad regem Israhel dixit ei vade et confortare et scito et vide quid facias sequenti enim anno rex Syriae ascendet contra te";
rsv[23] = "And the servants of the king of Syria said to him, &quot;Their gods are gods of the hills, and so they were stronger than we; but let us fight against them in the plain, and surely we shall be stronger than they.";
asv[23] = "And the servants of the king of Syria said unto him, Their god is a god of the hills; therefore they were stronger than we: but let us fight against them in the plain, and surely we shall be stronger than they.";
yng[23] = "And the servants of the king of Aram said unto him, `Gods of hills [are] their gods, therefore they were stronger than we; and yet, we fight with them in the plain -- are we not stronger than they?";
dby[23] = "And the servants of the king of Syria said to him, Their gods are gods of the mountains; therefore they were stronger than we; but if we fight against them on the plateau, shall we not be stronger than they?";
web[23] = "And the servants of the king of Syria said to him, Their gods [are] gods of the hills; therefore they were stronger than we; but let us fight against them in the plain, and surely we shall be stronger than they.";
hnv[23] = "The servants of the king of Aram said to him, Their god is a god of the hills; therefore they were stronger than we: but let us fight against them in the plain, and surely we shall be stronger than they.";
vul[23] = "servi vero regis Syriae dixerunt ei dii montium sunt dii eorum ideo superaverunt nos sed melius est ut pugnemus contra eos in campestribus et obtinebimus eos";
rsv[24] = "And do this: remove the kings, each from his post, and put commanders in their places;";
asv[24] = "And do this thing: take the kings away, every man out of his place, and put captains in their room;";
yng[24] = "`And this thing do thou: turn aside the kings each out of his place, and set captains in their stead;";
dby[24] = "And do this: take the kings away, every man out of his place, and put governors in their stead;";
web[24] = "And do this thing, Take the kings away, every man out of his place, and put captains in their rooms:";
hnv[24] = " Do this thing: take the kings away, every man out of his place, and put captains in their room;";
vul[24] = "tu ergo verbum hoc fac amove reges singulos ab exercitu suo et pone principes pro eis";
rsv[25] = "and muster an army like the army that you have lost, horse for horse, and chariot for chariot; then we will fight against them in the plain, and surely we shall be stronger than they.&quot; And he hearkened to their voice, and did so.";
asv[25] = "and number thee an army, like the army that thou hast lost, horse for horse, and chariot for chariot; and we will fight against them in the plain, and surely we shall be stronger than they. And he hearkened unto their voice, and did so.";
yng[25] = "and thou, number to thee a force as the force that is fallen from thee, and horse for horse, and chariot for chariot, and we fight with them in the plain; are we not stronger than they?\' and he hearkeneth to their voice, and doth so.";
dby[25] = "and number thee an army, like the army that thou hast lost, horse for horse, and chariot for chariot; and we will fight against them on the plateau: shall we not be stronger than they? And he hearkened to their voice, and did so.";
web[25] = "And number thee an army, like the army that thou hast lost, horse for horse, and chariot for chariot: and we will fight against them in the plain, [and] surely we shall be stronger than they. And he hearkened to their voice, and did so.";
hnv[25] = "and number you an army, like the army that you have lost, horse for horse, and chariot for chariot; and we will fight against them in the plain, and surely we shall be stronger than they. He listened to their voice, and did so.";
vul[25] = "et instaura numerum militum qui ceciderunt de tuis et equos secundum equos pristinos et currus secundum currus quos ante habuisti et pugnabimus contra eos in campestribus et videbis quod obtinebimus eos credidit consilio eorum et fecit ita";
rsv[26] = "In the spring Ben-ha\'dad mustered the Syrians, and went up to Aphek, to fight against Israel.";
asv[26] = "And it came to pass at the return of the year, that Ben-hadad mustered the Syrians, and went up to Aphek, to fight against Israel.";
yng[26] = "And it cometh to pass at the turn of the year, that Ben-Hadad inspecteth the Aramaeans, and goeth up to Aphek, to battle with Israel,";
dby[26] = "And it came to pass, at the return of the year, that Ben-Hadad numbered the Syrians, and went up to Aphek, to fight against Israel.";
web[26] = "And it came to pass at the return of the year, that Ben-hadad numbered the Syrians, and went up to Aphek, to fight against Israel.";
hnv[26] = "It happened at the return of the year, that Ben-Hadad mustered the Aram, and went up to Afek, to fight against Yisra\'el.";
vul[26] = "igitur postquam annus transierat recensuit Benadad Syros et ascendit in Afec ut pugnaret contra Israhel";
rsv[27] = "And the people of Israel were mustered, and were provisioned, and went against them; the people of Israel encamped before them like two little flocks of goats, but the Syrians filled the country.";
asv[27] = "And the children of Israel were mustered, and were victualled, and went against them: and the children of Israel encamped before them like two little flocks of kids; but the Syrians filled the country.";
yng[27] = "and the sons of Israel have been inspected, and supported, and go to meet them, and the sons of Israel encamp before them, like two flocks of goats, and the Aramaeans have filled the land.";
dby[27] = "And the children of Israel were numbered and victualled, and they went against them; and the children of Israel encamped before them like two little flocks of goats; but the Syrians filled the land.";
web[27] = "And the children of Israel were numbered, and were all present, and went against them: and the children of Israel encamped before them like two little flocks of kids; but the Syrians filled the country.";
hnv[27] = "The children of Yisra\'el were mustered, and were provisioned, and went against them: and the children of Yisra\'el encamped before them like two little flocks of kids; but the Aram filled the country.";
vul[27] = "porro filii Israhel recensiti sunt et acceptis cibariis profecti ex adverso castraque metati contra eos quasi duo parvi greges caprarum Syri autem repleverunt terram";
rsv[28] = "And a man of God came near and said to the king of Israel, &quot;Thus says the LORD, \'Because the Syrians have said, &quot;The LORD is a god of the hills but he is not a god of the valleys,&quot; therefore I will give all this great multitude into your hand, and you shall know that I am the LORD.\'&quot;";
asv[28] = "And a man of God came near and spake unto the king of Israel, and said, Thus saith Jehovah, Because the Syrians have said, Jehovah is a god of the hills, but he is not a god of the valleys; therefore will I deliver all this great multitude into thy hand, and ye shall know that I am Jehovah.";
yng[28] = "And there cometh nigh a man of God, and speaketh unto the king of Israel, and saith, `Thus said Jehovah, Because that the Aramaeans have said, God of hills [is] Jehovah, and He [is] not God of valleys -- I have given the whole of this great multitude into thy hand, and ye have known that I [am] Jehovah.\'";
dby[28] = "And the man of God drew near, and spoke to the king of Israel and said, Thus saith Jehovah: Because the Syrians have said, Jehovah is a god of the mountains, but he is not a god of the valleys, I will give all this great multitude into thy hand, and ye shall know that I am Jehovah.";
web[28] = "And there came a man of God, and spoke to the king of Israel, and said, Thus saith the LORD, Because the Syrians have said, The LORD [is] God of the hills, but he [is] not God of the valleys, therefore will I deliver all this great multitude into thy hand, and ye shall know that I [am] the LORD.";
hnv[28] = "A man of God came near and spoke to the king of Yisra\'el, and said, Thus says the LORD, Because the Aram have said, the LORD is a god of the hills, but he is not a god of the valleys; therefore will I deliver all this great multitude into your hand, and you shall know that I am the LORD.";
vul[28] = "et accedens unus vir Dei dixit ad regem Israhel haec dicit Dominus quia dixerunt Syri deus montium est Dominus et non est deus vallium dabo omnem multitudinem grandem hanc in manu tua et scietis quia ego Dominus";
rsv[29] = "And they encamped opposite one another seven days. Then on the seventh day the battle was joined; and the people of Israel smote of the Syrians a hundred thousand foot soldiers in one day.";
asv[29] = "And they encamped one over against the other seven days. And so it was, that in the seventh day the battle was joined; and the children of Israel slew of the Syrians a hundred thousand footmen in one day.";
yng[29] = "And they encamp one over-against another seven days, and it cometh to pass on the seventh day, that the battle draweth near, and the sons of Israel smite Aram -- a hundred thousand footmen in one day.";
dby[29] = "And they encamped one over against the other seven days; and it came to pass that on the seventh day the battle was joined; and the children of Israel smote of the Syrians a hundred thousand footmen in one day.";
web[29] = "And they encamped one over against the other seven days. And [so] it was, that in the seventh day the battle was joined: and the children of Israel slew of the Syrians a hundred thousand footmen in one day.";
hnv[29] = "They encamped one over against the other seven days. So it was, that in the seventh day the battle was joined; and the children of Yisra\'el killed of the Aram one hundred thousand footmen in one day.";
vul[29] = "dirigebant septem diebus ex adverso hii atque illi acies septima autem die commissum est bellum percusseruntque filii Israhel de Syris centum milia peditum in die una";
rsv[30] = "And the rest fled into the city of Aphek; and the wall fell upon twenty-seven thousand men that were left. Ben-ha\'dad also fled, and entered an inner chamber in the city.";
asv[30] = "But the rest fled to Aphek, into the city; and the wall fell upon twenty and seven thousand men that were left. And Ben-hadad fled, and came into the city, into an inner chamber.";
yng[30] = "And those left flee to Aphek, unto the city, and the wall falleth on twenty and seven chief men who are left, and Ben-Hadad hath fled, and cometh in unto the city, into the innermost part.";
dby[30] = "And the rest fled to Aphek, into the city; and the wall fell on twenty-seven thousand men of them that were left. And Ben-Hadad fled, and came into the city, [from] chamber to chamber.";
web[30] = "But the rest fled to Aphek, into the city; and [there] a wall fell upon twenty and seven thousand of the men [that were] left. And Ben-hadad fled, and came into the city, into an inner chamber.";
hnv[30] = "But the rest fled to Afek, into the city; and the wall fell on twenty-seven thousand men who were left. Ben-Hadad fled, and came into the city, into an inner chamber.";
vul[30] = "fugerunt autem qui remanserant in Afec in civitatem et cecidit murus super viginti septem milia hominum qui remanserant porro Benadad fugiens ingressus est civitatem in cubiculum quod erat intra cubiculum";
rsv[31] = "And his servants said to him, &quot;Behold now, we have heard that the kings of the house of Israel are merciful kings; let us put sackcloth on our loins and ropes upon our heads, and go out to the king of Israel; perhaps he will spare your life.&quot;";
asv[31] = "And his servants said unto him, Behold now, we have heard that the kings of the house of Israel are merciful kings: let us, we pray thee, put sackcloth on our loins, and ropes upon our heads, and go out to the king of Israel: peradventure he will save thy life.";
yng[31] = "And his servants say unto him, `Lo, we pray thee, we have heard that the kings of the house of Israel -- that they are kind kings; let us put, we pray thee, sackcloth on our loins, and ropes on our heads, and we go out unto the king of Israel; it may be he doth keep thee alive.\'";
dby[31] = "And his servants said to him, Behold now, we have heard that the kings of the house of Israel are merciful kings: let us, I pray thee, put sackcloth on our loins, and ropes upon our heads, and go out to the king of Israel; perhaps he will save thy life.";
web[31] = "And his servants said to him, Behold now, we have heard that the kings of the house of Israel [are] merciful kings: let us, I pray thee, put sackcloth on our loins, and ropes upon our heads, and go out to the king of Israel: it may be he will save thy life.";
hnv[31] = "His servants said to him, See now, we have heard that the kings of the house of Yisra\'el are merciful kings: let us, we pray you, put sackcloth on our loins, and ropes on our heads, and go out to the king of Yisra\'el: peradventure he will save your life.";
vul[31] = "dixeruntque ei servi sui ecce audivimus quod reges domus Israhel clementes sint ponamus itaque saccos in lumbis nostris et funiculos in capitibus nostris et egrediamur ad regem Israhel forsitan salvabit animas nostras";
rsv[32] = "So they girded sackcloth on their loins, and put ropes on their heads, and went to the king of Israel and said, &quot;Your servant Ben-ha\'dad says, \'Pray, let me live.\'&quot; And he said, &quot;Does he still live? He is my brother.&quot;";
asv[32] = "So they girded sackcloth on their loins, and [put] ropes on their heads, and came to the king of Israel, and said, Thy servant Ben-hadad saith, I pray thee, let me live. And he said, Is he yet alive? he is my brother.";
yng[32] = "And they gird sackcloth on their loins, and ropes [are] on their heads, and they come in unto the king of Israel, and say, `Thy servant Ben-Hadad hath said, Let me live, I pray thee;\' and he saith, `Is he yet alive? he [is] my brother.\'";
dby[32] = "And they girded sackcloth on their loins, and ropes on their heads, and came to the king of Israel, and said, Thy servant Ben-Hadad says, I pray thee, let me live. And he said, Is he yet alive? he is my brother.";
web[32] = "So they girded sackcloth on their loins, and [put] ropes on their heads, and came to the king of Israel, and said, Thy servant Ben-hadad saith, I pray thee, let me live. And he said, [Is] he yet alive? he [is] my brother.";
hnv[32] = "So they girded sackcloth on their loins, and [put] ropes on their heads, and came to the king of Yisra\'el, and said, Your servant Ben-Hadad says, please let me live. He said, Is he yet alive? he is my brother.";
vul[32] = "accinxerunt saccis lumbos suos et posuerunt funes in capitibus veneruntque ad regem Israhel et dixerunt servus tuus Benadad dicit vivat oro te anima mea et ille ait si adhuc vivit frater meus est";
rsv[33] = "Now the men were watching for an omen, and they quickly took it up from him and said, &quot;Yes, your brother Ben-ha\'dad.&quot; Then he said, &quot;Go and bring him.&quot; Then Ben-ha\'dad came forth to him; and he caused him to come up into the chariot.";
asv[33] = "Now the men observed diligently, and hasted to catch whether it were his mind; and they said, Thy brother Ben-hadad. Then he said, Go ye, bring him. Then Ben-hadad came forth to him; and he caused him to come up into the chariot.";
yng[33] = "And the men observe diligently, and hasten, and catch it from him, and say, `Thy brother Ben-Hadad;\' and he saith, `Go ye in, bring him;\' and Ben-Hadad cometh out unto him, and he causeth him to come up on the chariot.";
dby[33] = "And the men took it as a good omen, and hastened to catch what came from him, and they said, Thy brother Ben-Hadad. ... And he said, Go, bring him. And Ben-Hadad came forth to him; and he caused him to come up into the chariot.";
web[33] = "Now the men diligently observed whether [any thing would come] from him, and did hastily catch [it]: and they said, Thy brother Ben-hadad. Then he said, Go ye, bring him. Then Ben-hadad came forth to him; and he caused him to come up into the chariot.";
hnv[33] = "Now the men observed diligently, and hurried to catch whether it were his mind; and they said, Your brother Ben-Hadad. Then he said, Go you, bring him. Then Ben-Hadad came forth to him; and he caused him to come up into the chariot.";
vul[33] = "quod acceperunt viri pro omine et festinantes rapuerunt verbum ex ore eius atque dixerunt frater tuus Benadad et dixit eis ite et adducite eum egressus est ergo ad eum Benadad et levavit eum in currum suum";
rsv[34] = "And Ben-ha\'dad said to him, &quot;The cities which my father took from your father I will restore; and you may establish bazaars for yourself in Damascus, as my father did in Sama\'ria.&quot; And Ahab said, &quot;I will let you go on these terms.&quot; So he made a covenant with him and let him go.";
asv[34] = "And [Ben-hadad] said unto him, The cities which my father took from thy father I will restore; and thou shalt make streets for thee in Damascus, as my father made in Samaria. And I, [said Ahab], will let thee go with this covenant. So he made a covenant with him, and let him go.";
yng[34] = "And he saith unto him, `The cities that my father took from thy father, I give back, and streets thou dost make for thee in Damascus, as my father did in Samaria;\' -- `and I, with a covenant, send thee away;\' and he maketh with him a covenant, and sendeth him away.";
dby[34] = "And [Ben-Hadad] said to him, The cities that my father took from thy father I will restore; and thou shalt make streets for thyself in Damascus, as my father made in Samaria. And I [said Ahab] will send thee away with this covenant. So he made a covenant with him, and sent him away.";
web[34] = "And [Ben-hadad] said to him, The cities, which my father took from thy father, I will restore; and thou shalt make streets for thee in Damascus, as my father made in Samaria. Then [said Ahab], I will send thee away with this covenant. So he made a covenant with him, and sent him away.";
hnv[34] = " [Ben-Hadad] said to him, The cities which my father took from your father I will restore; and you shall make streets for you in Dammesek, as my father made in Shomron. I, [said Ach\'av], will let you go with this covenant. So he made a covenant with him, and let him go.";
vul[34] = "qui dixit ei civitates quas tulit pater meus a patre tuo reddam et plateas fac tibi in Damasco sicut fecit pater meus in Samaria et ego foederatus recedam a te pepigit ergo foedus et dimisit eum";
rsv[35] = "And a certain man of the sons of the prophets said to his fellow at the command of the LORD, &quot;Strike me, I pray.&quot; But the man refused to strike him.";
asv[35] = "And a certain man of the sons of the prophets said unto his fellow by the word of Jehovah, Smite me, I pray thee. And the man refused to smite him.";
yng[35] = "And a certain man of the sons of the prophets said unto his neighbour by the word of Jehovah, `Smite me, I pray thee;\' and the man refuseth to smite him,";
dby[35] = "And a certain man of the sons of the prophets said to another by the word of Jehovah, Smite me, I pray thee. But the man refused to smite him.";
web[35] = "And a certain man of the sons of the prophets said to his neighbor in the word of the LORD, Smite me, I pray thee. And the man refused to smite him.";
hnv[35] = " A certain man of the sons of the prophets said to his fellow by the word of the LORD, Please strike me. The man refused to strike him.";
vul[35] = "tunc vir quidam de filiis prophetarum dixit ad socium suum in sermone Domini percute me at ille noluit percutere";
rsv[36] = "Then he said to him, &quot;Because you have not obeyed the voice of the LORD, behold, as soon as you have gone from me, a lion shall kill you.&quot; And as soon as he had departed from him, a lion met him and killed him.";
asv[36] = "Then said he unto him, Because thou hast not obeyed the voice of Jehovah, behold, as soon as thou art departed from me, a lion shall slay thee. And as soon as he was departed from him, a lion found him, and slew him.";
yng[36] = "and he saith to him, `Because that thou hast not hearkened to the voice of Jehovah, lo, thou art going from me, and the lion hath smitten thee;\' and he goeth from him, and the lion findeth him, and smiteth him.";
dby[36] = "Then said he to him, Because thou hast not hearkened to the voice of Jehovah, behold, when thou departest from me, the lion will slay thee. And when he had departed from him, the lion found him and slew him.";
web[36] = "Then said he to him, Because thou hast not obeyed the voice of the LORD, behold, as soon as thou hast departed from me, a lion will slay thee. And as soon as he had departed from him, a lion found him, and slew him.";
hnv[36] = "Then said he to him, Because you have not obeyed the voice of the LORD, behold, as soon as you are departed from me, a lion shall kill you. As soon as he was departed from him, a lion found him, and killed him.";
vul[36] = "cui ait quia noluisti audire vocem Domini ecce recedes a me et percutiet te leo cumque paululum recessisset ab eo invenit eum leo atque percussit";
rsv[37] = "Then he found another man, and said, &quot;Strike me, I pray.&quot; And the man struck him, smiting and wounding him.";
asv[37] = "Then he found another man, and said, Smite me, I pray thee. And the man smote him, smiting and wounding him.";
yng[37] = "And he findeth another man, and saith, `Smite me, I pray thee;\' and the man smiteth him, smiting and wounding,";
dby[37] = "Then he found another man, and said, Smite me, I pray thee. And the man smote him violently, and wounded [him].";
web[37] = "Then he found another man, and said, Smite me, I pray thee. And the man smote him, so that in smiting he wounded [him].";
hnv[37] = "Then he found another man, and said, Please strike me. The man struck him, smiting and wounding him.";
vul[37] = "sed et alterum conveniens virum dixit ad eum percute me qui percussit eum et vulneravit";
rsv[38] = "So the prophet departed, and waited for the king by the way, disguising himself with a bandage over his eyes.";
asv[38] = "So the prophet departed, and waited for the king by the way, and disguised himself with his headband over his eyes.";
yng[38] = "and the prophet goeth and standeth for the king on the way, and disguiseth himself with ashes on his eyes.";
dby[38] = "And the prophet departed, and waited for the king by the way, and disguised himself with a sash over his eyes.";
web[38] = "So the prophet departed, and waited for the king by the way, and disguised himself with ashes upon his face.";
hnv[38] = "So the prophet departed, and waited for the king by the way, and disguised himself with his headband over his eyes.";
vul[38] = "abiit ergo propheta et occurrit regi in via et mutavit aspersione pulveris os et oculos suos";
rsv[39] = "And as the king passed, he cried to the king and said, &quot;Your servant went out into the midst of the battle; and behold, a soldier turned and brought a man to me, and said, \'Keep this man; if by any means he be missing, your life shall be for his life, or else you shall pay a talent of silver.\'";
asv[39] = "And as the king passed by, he cried unto the king; and he said, Thy servant went out into the midst of the battle; and, behold, a man turned aside, and brought a man unto me, and said, Keep this man: if by any means he be missing, then shall thy life be for his life, or else thou shalt pay a talent of silver.";
yng[39] = "And it cometh to pass -- the king is passing by -- that he hath cried unto the king, and saith, `Thy servant went out into the midst of the battle, and lo, a man hath turned aside and bringeth in unto me a man, and saith, Keep this man; if he be at all missing, then hath thy life been for his life, or a talent of silver thou dost weigh out;";
dby[39] = "And as the king passed by, he cried to the king and said, Thy servant went out into the midst of the battle; and behold, a man turned aside, and brought a man to me and said, Keep this man; if by any means he be missing, then shall thy life be for his life, or thou shalt pay a talent of silver.";
web[39] = "And as the king passed by, he cried to the king: and he said, Thy servant went out into the midst of the battle; and behold, a man turned aside, and brought a man to me, and said, Keep this man: if by any means he shall be missing, then shall thy life be for his life, or else thou shalt pay a talent of silver.";
hnv[39] = "As the king passed by, he cried to the king; and he said, Your servant went out into the midst of the battle; and, behold, a man turned aside, and brought a man to me, and said, Keep this man: if by any means he be missing, then shall your life be for his life, or else you shall pay a talent of silver.";
vul[39] = "cumque rex transiret clamavit ad regem et ait servus tuus egressus est ad proeliandum comminus cumque fugisset vir unus adduxit eum quidam ad me et ait custodi virum istum qui si lapsus fuerit erit anima tua pro anima eius aut talentum argenti adpendes";
rsv[40] = "And as your servant was busy here and there, he was gone.&quot; The king of Israel said to him, &quot;So shall your judgment be; you yourself have decided it.&quot;";
asv[40] = "And as thy servant was busy here and there, he was gone. And the king of Israel said unto him, So shall thy judgment be; thyself hast decided it.";
yng[40] = "and it cometh to pass, thy servant is working hither and thither, and he is not!\' and the king of Israel saith unto him, Right [is] thy judgment; thou hast determined [it].\'";
dby[40] = "And as thy servant was busy here and there, he was gone. And the king of Israel said to him, So [is] thy judgment: thyself hast decided [it].";
web[40] = "And as thy servant was busy here and there, he was gone. And the king of Israel said to him, So [shall] thy judgment [be]; thyself hast decided [it].";
hnv[40] = "As your servant was busy here and there, he was gone. The king of Yisra\'el said to him, So shall your judgment be; yourself have decided it.";
vul[40] = "dum autem ego turbatus huc illucque me verterem subito non conparuit et ait rex Israhel ad eum hoc est iudicium tuum quod ipse decrevisti";
rsv[41] = "Then he made haste to take the bandage away from his eyes; and the king of Israel recognized him as one of the prophets.";
asv[41] = "And he hasted, and took the headband away from his eyes; and the king of Israel discerned him that he was of the prophets.";
yng[41] = "And he hasteth and turneth aside the ashes from off his eyes, and the king of Israel discerneth him, that he [is] of the prophets,";
dby[41] = "Then he hastily took the sash away from his face; and the king of Israel discerned him, that he was of the prophets.";
web[41] = "And he hasted, and took the ashes away from his face; and the king of Israel discerned him that he [was] of the prophets.";
hnv[41] = "He hurried, and took the headband away from his eyes; and the king of Yisra\'el discerned him that he was of the prophets.";
vul[41] = "at ille statim abstersit pulverem de facie sua et cognovit eum rex Israhel quod esset de prophetis";
rsv[42] = "And he said to him, &quot;Thus says the LORD, \'Because you have let go out of your hand the man whom I had devoted to destruction, therefore your life shall go for his life, and your people for his people.\'&quot;";
asv[42] = "And he said unto him, Thus saith Jehovah, Because thou hast let go out of thy hand the man whom I had devoted to destruction, therefore thy life shall go for his life, and thy people for his people.";
yng[42] = "and he saith unto him, `Thus said Jehovah, Because thou hast sent away the man I devoted, out of [thy] hand, even thy life hath been for his life, and thy people for his people;\'";
dby[42] = "And he said to him, Thus saith Jehovah: Because thou hast let go out of thy hand the man that I had devoted to destruction, thy life shall be for his life, and thy people for his people.";
web[42] = "And he said to him, Thus saith the LORD, Because thou hast let go out of [thy] hand a man whom I appointed to utter destruction, therefore thy life shall go for his life, and thy people for his people.";
hnv[42] = "He said to him, Thus says the LORD, Because you have let go out of your hand the man whom I had devoted to destruction, therefore your life shall go for his life, and your people for his people.";
vul[42] = "qui ait ad eum haec dicit Dominus quia dimisisti virum dignum morte de manu tua erit anima tua pro anima eius et populus tuus pro populo eius";
rsv[43] = "And the king of Israel went to his house resentful and sullen, and came to Sama\'ria.";
asv[43] = "And the king of Israel went to his house heavy and displeased, and came to Samaria.";
yng[43] = "and the king of Israel goeth unto his house, sulky and wroth, and cometh in to Samaria.";
dby[43] = "And the king of Israel went to his house sullen and vexed, and came to Samaria.";
web[43] = "And the king of Israel went to his house heavy and displeased, and came to Samaria.";
hnv[43] = "The king of Yisra\'el went to his house heavy and displeased, and came to Shomron.";
vul[43] = "reversus est igitur rex Israhel in domum suam audire contemnens et furibundus venit Samariam";
