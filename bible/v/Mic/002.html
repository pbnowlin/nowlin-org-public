csb[1] = "Woe to those who dream up wickedness and prepare evil plans on their beds! At morning light they accomplish it because the power is in their hands.";
csb[2] = "They covet fields and seize them; they also take houses. They deprive a man of his home, a person of his inheritance.";
csb[3] = "Therefore, the LORD says: I am now planning a disaster against this nation; you cannot free your necks from it. Then you will not walk so proudly because it will be an evil time.";
csb[4] = "In that day one will take up a taunt against you and lament mournfully, saying, &quot;We are totally ruined! He measures out the allotted land of my people. How he removes it from me! He allots our fields to traitors.&quot;";
csb[5] = "Therefore, there will be no one in the assembly of the LORD to divide the land by casting lots.";
csb[6] = "&quot;Quit your preaching,&quot; they preach. &quot;They should not preach these things; shame will not overtake us.&quot;";
csb[7] = "House of Jacob, should it be asked, &quot;Is the Spirit of the LORD impatient? Are these the things he does? &quot; Don\'t my words bring good to the one who walks uprightly?";
csb[8] = "But recently my people have risen up like an enemy: You strip off the splendid robe from those who are passing through confidently, like those returning from war.";
csb[9] = "You force the women of my people out of their comfortable homes, and you take my blessing from their children forever.";
csb[10] = "Get up and leave, for this is not your place of rest because defilement brings destruction -- a grievous destruction!";
csb[11] = "If a man comes and utters empty lies -- &quot;I will preach to you about wine and beer&quot; -- he would be just the preacher for this people!";
csb[12] = "I will indeed gather all of you, Jacob; I will collect the remnant of Israel. I will bring them together like sheep in a pen, like a flock in the middle of its pasture. It will be noisy with people.";
csb[13] = "One who breaks open the way will advance before them; they will break out, pass through the city gate, and leave by it. Their King will pass through before them, the LORD as their leader.";
kjv[1] = "Woe to them that devise iniquity, and work evil upon their beds! when the morning is light, they practise it, because it is in the power of their hand.";
rsv[1] = "Woe to those who devise wickedness and work evil upon their beds! When the morning dawns, they perform it, because it is in the power of their hand.";
asv[1] = "Woe to them that devise iniquity and work evil upon their beds! when the morning is light, they practise it, because it is in the power of their hand.";
yng[1] = "Wo [to] those devising iniquity, And working evil on their beds, In the light of the morning they do it, For their hand is -- to God.";
dby[1] = "Woe to them that devise iniquity and work evil upon their beds! When the morning is light they practise it, because it is in the power of their hand.";
web[1] = "Woe to them that devise iniquity, and work evil upon their beds! when the morning is light, they practice it, because it is in the power of their hand.";
hnv[1] = "Woe to those who devise iniquity And work evil on their beds! When the morning is light, they practice it, Because it is in the power of their hand.";

kjv[2] = "And they covet fields, and take [them] by violence; and houses, and take [them] away: so they oppress a man and his house, even a man and his heritage.";
rsv[2] = "They covet fields, and seize them; and houses, and take them away; they oppress a man and his house, a man and his inheritance.";
asv[2] = "And they covet fields, and seize them; and houses, and take them away: and they oppress a man and his house, even a man and his heritage.";
yng[2] = "And they have desired fields, And they have taken violently, And houses, and they have taken away, And have oppressed a man and his house, Even a man and his inheritance.";
dby[2] = "And they covet fields, and take them by violence; and houses, and take them away; and they oppress a man and his house, even a man and his heritage.";

hnv[2] = "They covet fields, and seize them; And houses, and take them away: And they oppress a man and his house, Even a man and his heritage.";

kjv[3] = "Therefore thus saith the LORD; Behold, against this family do I devise an evil, from which ye shall not remove your necks; neither shall ye go haughtily: for this time [is] evil.";
rsv[3] = "Therefore thus says the LORD: Behold, against this family I am devising evil, from which you cannot remove your necks; and you shall not walk haughtily, for it will be an evil time.";
asv[3] = "Therefore thus saith Jehovah: Behold, against this family do I devise an evil, from which ye shall not remove your necks, neither shall ye walk haughtily; for it is an evil time.";
yng[3] = "Therefore, thus said Jehovah: Lo, I am devising against this family evil, From which ye do not remove your necks, Nor walk loftily, for a time of evil it [is].";
dby[3] = "Therefore thus saith Jehovah: Behold, against this family do I devise an evil, from which ye shall not remove your necks; neither shall ye walk haughtily: for it is an evil time.";
web[3] = "Therefore thus saith the LORD; Behold, against this family do I devise an evil, from which ye shall not remove your necks; neither shall ye go haughtily: for this time [is] evil.";
hnv[3] = "Therefore thus says the LORD: &quot;Behold, I am planning against these people a disaster, From which you will not remove your necks, Neither will you walk haughtily; For it is an evil time.";
vul[3] = "idcirco haec dicit Dominus ecce ego cogito super familiam istam malum unde non auferetis colla vestra et non ambulabitis superbi quoniam tempus pessimum est";
kjv[4] = "In that day shall [one] take up a parable against you, and lament with a doleful lamentation, [and] say, We be utterly spoiled: he hath changed the portion of my people: how hath he removed [it] from me! turning away he hath divided our fields.";
rsv[4] = "In that day they shall take up a taunt song against you, and wail with bitter lamentation, and say, &quot;We are utterly ruined; he changes the portion of my people; how he removes it from me! Among our captors he divides our fields.&quot;";
asv[4] = "In that day shall they take up a parable against you, and lament with a doleful lamentation, [and] say, We are utterly ruined: he changeth the portion of my people: how doth he remove [it] from me! to the rebellious he divideth our fields.";
yng[4] = "In that day doth [one] take up for you a simile, And he hath wailed a wailing of wo, He hath said, We have been utterly spoiled, The portion of my people He doth change, How doth He move toward me! To the backslider our fields He apportioneth.";
dby[4] = "In that day shall they take up a proverb concerning you, and lament with a doleful lamentation, [and] say, We are utterly spoiled: he hath changed the portion of my people: how hath he removed it from me! He hath distributed our fields to the rebellious.";
web[4] = "In that day shall [one] take up a parable against you, and lament with a grievous lamentation, [and] say, We are utterly wasted: he hath changed the portion of my people: how hath he removed [it] from me! turning away he hath divided our fields.";
hnv[4] = "In that day they will take up a parable against you, And lament with a doleful lamentation, saying, \'We are utterly ruined! My people\'s possession is divided up. Indeed he takes it from me and assigns our fields to traitors!\'&quot;";
vul[4] = "in die illa sumetur super vos parabola et cantabitur canticum cum suavitate dicentium depopulatione vastati sumus pars populi mei commutata est quomodo recedet a me cum revertatur qui regiones nostras dividat";
kjv[5] = "Therefore thou shalt have none that shall cast a cord by lot in the congregation of the LORD.";
rsv[5] = "Therefore you will have none to cast the line by lot in the assembly of the LORD.";
asv[5] = "Therefore thou shalt have none that shall cast the line by lot in the assembly of Jehovah.";
yng[5] = "Therefore, thou hast no caster of a line by lot In the assembly of Jehovah.";
dby[5] = "Therefore thou shalt have none that shall cast the measuring line upon a lot, in the congregation of Jehovah.";
web[5] = "Therefore thou shalt have none that shall cast a cord by lot in the congregation of the LORD.";
hnv[5] = "Therefore you will have no one who divides the land by lot in the assembly of the LORD.";
vul[5] = "propter hoc non erit tibi mittens funiculum sortis in coetu Domini";
kjv[6] = "Prophesy ye not, [say they to them that] prophesy: they shall not prophesy to them, [that] they shall not take shame.";
rsv[6] = "&quot;Do not preach&quot;--thus they preach--&quot;one should not preach of such things; disgrace will not overtake us.&quot;";
asv[6] = "Prophesy ye not, [thus] they prophesy. They shall not prophesy to these: reproaches shall not depart.";
yng[6] = "Ye do not prophesy -- they do prophesy, They do not prophesy to these, It doth not remove shame.";
dby[6] = "Prophesy ye not, they prophesy. If they do not prophesy to these, the ignominy will not depart.";
web[6] = "Prophesy ye not, [say they to them that] prophesy: they shall not prophesy to them, [that] they shall not take shame.";
hnv[6] = "&quot;Don\'t you prophesy!&quot; They prophesy. &quot;Don\'t prophesy about these things. Disgrace won\'t overtake us.&quot;";
vul[6] = "ne loquamini loquentes non stillabit super istos non conprehendet confusio";
kjv[7] = "O [thou that art] named the house of Jacob, is the spirit of the LORD straitened? [are] these his doings? do not my words do good to him that walketh uprightly?";
rsv[7] = "Should this be said, O house of Jacob? Is the Spirit of the LORD impatient? Are these his doings? Do not my words do good to him who walks uprightly?";
asv[7] = "Shall it be said, O house of Jacob, Is the Spirit of Jehovah straitened? are these his doings? Do not my words do good to him that walketh uprightly?";
yng[7] = "Doth the house of Jacob say, `Hath the Spirit of Jehovah been shortened? Are these His doings?\' Do not My words benefit the people that is walking uprightly?";
dby[7] = "O thou [that art] named the house of Jacob, Is Jehovah impatient? are these his doings? Do not my words do good to him that walketh uprightly?";
web[7] = "O [thou that art] named the house of Jacob, is the spirit of the LORD straitened? are these his doings? do not my words do good to him that walketh uprightly?";
hnv[7] = "Shall it be said, O house of Ya`akov: &quot;Is the Spirit of the LORD angry? Are these his doings? Don\'t my words do good to him who walks blamelessly?&quot;";
vul[7] = "dicit domus Iacob numquid adbreviatus est spiritus Domini aut tales sunt cogitationes eius nonne verba mea bona sunt cum eo qui recte graditur";
kjv[8] = "Even of late my people is risen up as an enemy: ye pull off the robe with the garment from them that pass by securely as men averse from war.";
rsv[8] = "But you rise against my people as an enemy; you strip the robe from the peaceful, from those who pass by trustingly with no thought of war.";
asv[8] = "But of late my people is risen up as an enemy: ye strip the robe from off the garment from them that pass by securely [as men] averse from war.";
yng[8] = "And yesterday My people for an enemy doth raise himself up, From the outer garment the honourable ornament ye strip off, From the confident passers by, Ye who are turning back from war.";
dby[8] = "But of late my people is risen up as an enemy: ye strip off the mantle with the garment from them that pass by securely, that are averse from war.";
web[8] = "Even of late my people hath risen up as an enemy: ye pull off the robe with the garment from them that pass by securely as men averse to war.";
hnv[8] = "But lately my people have risen up as an enemy. You strip the robe and clothing from those who pass by without a care, returning from battle.";
vul[8] = "et e contrario populus meus in adversarium consurrexit desuper tunica pallium sustulistis eos qui transiebant simpliciter convertistis in bellum";
kjv[9] = "The women of my people have ye cast out from their pleasant houses; from their children have ye taken away my glory for ever.";
rsv[9] = "The women of my people you drive out from their pleasant houses; from their young children you take away my glory for ever.";
asv[9] = "The women of my people ye cast out from their pleasant houses; from their young children ye take away my glory for ever.";
yng[9] = "The women of My people ye cast out from its delightful house, From its sucklings ye take away My honour to the age.";
dby[9] = "The women of my people do ye cast out from their pleasant houses; from their young children do ye take away my magnificence for ever.";
web[9] = "The women of my people have ye cast out from their pleasant houses; from their children have ye taken away my glory for ever.";
hnv[9] = "You drive the women of my people out from their pleasant houses; From their young children you take away my blessing forever.";
vul[9] = "mulieres populi mei eiecistis de domo deliciarum suarum a parvulis earum tulistis laudem meam in perpetuum";
kjv[10] = "Arise ye, and depart; for this [is] not [your] rest: because it is polluted, it shall destroy [you], even with a sore destruction.";
rsv[10] = "Arise and go, for this is no place to rest; because of uncleanness that destroys with a grievous destruction.";
asv[10] = "Arise ye, and depart; for this is not your resting-place; because of uncleanness that destroyeth, even with a grievous destruction.";
yng[10] = "Rise and go, for this [is] not the rest, Because of uncleanness it doth corrupt, And corruption is powerful.";
dby[10] = "Arise ye, and depart; for this is not the resting-place, because of defilement that bringeth destruction, even a grievous destruction.";
web[10] = "Arise ye, and depart; for this [is] not [your] rest: because it is polluted, it shall destroy [you], even with a grievous destruction.";
hnv[10] = "Arise, and depart! For this is not your resting place, Because of uncleanness that destroys, Even with a grievous destruction.";
vul[10] = "surgite et ite quia non habetis hic requiem propter inmunditiam eius corrumpetur putredine pessima";
kjv[11] = "If a man walking in the spirit and falsehood do lie, [saying], I will prophesy unto thee of wine and of strong drink; he shall even be the prophet of this people.";
rsv[11] = "If a man should go about and utter wind and lies, saying, &quot;I will preach to you of wine and strong drink,&quot; he would be the preacher for this people!";
asv[11] = "If a man walking in a spirit of falsehood do lie, [saying], I will prophesy unto thee of wine and of strong drink; he shall even be the prophet of this people.";
yng[11] = "If one is going [with] the wind, And [with] falsehood hath lied: `I prophesy to thee of wine, and of strong drink,\' He hath been the prophet of this people!";
dby[11] = "If a man walking in wind and falsehood do lie, [saying,] I will prophesy unto thee of wine and of strong drink, he shall be the prophet of this people.";
web[11] = "If a man walking in the spirit and falsehood doth lie, [saying], I will prophesy to thee of wine and of strong drink; he shall even be the prophet of this people.";
hnv[11] = "If a man walking in a spirit of falsehood lies: \'I will prophesy to you of wine and of strong drink;\' He would be the prophet of this people.";

kjv[12] = "I will surely assemble, O Jacob, all of thee; I will surely gather the remnant of Israel; I will put them together as the sheep of Bozrah, as the flock in the midst of their fold: they shall make great noise by reason of [the multitude of] men.";
rsv[12] = "I will surely gather all of you, O Jacob, I will gather the remnant of Israel; I will set them together like sheep in a fold, like a flock in its pasture, a noisy multitude of men.";
asv[12] = "I will surely assemble, O Jacob, all of thee; I will surely gather the remnant of Israel; I will put them together as the sheep of Bozrah, as a flock in the midst of their pasture; they shall make great noise by reason of [the multitude of] men.";
yng[12] = "I do surely gather thee, O Jacob, all of thee, I surely bring together the remnant of Israel, Together I do set it as the flock of Bozrah, As a drove in the midst of its pasture, It maketh a noise because of man.";
dby[12] = "I will surely assemble, O Jacob, the whole of thee; I will surely gather the remnant of Israel; I will put them together as sheep of Bozrah, as a flock in the midst of their pasture: they shall make great noise by reason of [the multitude of] men.";
web[12] = "I will surely assemble, O Jacob, all of thee; I will surely gather the remnant of Israel; I will put them together as the sheep of Bozrah, as the flock in the midst of their fold: they shall make great noise by reason of [the multitude of] men.";
hnv[12] = "I will surely assemble, Ya`akov, all of you; I will surely gather the remnant of Yisra\'el; I will put them together as the sheep of Botzrah, As a flock in the midst of their pasture; They will swarm with people.";

kjv[13] = "The breaker is come up before them: they have broken up, and have passed through the gate, and are gone out by it: and their king shall pass before them, and the LORD on the head of them.";
rsv[13] = "He who opens the breach will go up before them; they will break through and pass the gate, going out by it. Their king will pass on before them, the LORD at their head.";
asv[13] = "The breaker is gone up before them: they have broken forth and passed on to the gate, and are gone out thereat; and their king is passed on before them, and Jehovah at the head of them.";
yng[13] = "Gone up hath the breaker before them, They have broken through, Yea, they pass through the gate, Yea, they go out through it, And pass on doth their king before them, And Jehovah at their head!";
dby[13] = "One that breaketh through is gone up before them: they have broken forth, and have passed on to the gate, and are gone out by it; and their king passeth on before them, and Jehovah at the head of them.";
web[13] = "The breaker is come up before them: they have broken up, and have passed through the gate, and have gone out by it; and their king shall pass before them, and the LORD on the head of them.";
hnv[13] = "He who breaks open the way goes up before them. They break through the gate, and go out. And their king passes on before them, With the LORD at their head.&quot;";
