csb[1] = "In the last days the mountain of the LORD\'s house will be established at the top of the mountains and will be raised above the hills. Peoples will stream to it,";
csb[2] = "and many nations will come and say, &quot;Come, let us go up to the mountain of the LORD, to the house of the God of Jacob. He will teach us about his ways so we may walk in his paths.&quot; For instruction will go out of Zion and the word of the LORD from Jerusalem.";
csb[3] = "He will settle disputes among many peoples and provide arbitration for strong nations that are far away. They will beat their swords into plows and their spears into pruning knives. Nation will not take up the sword against nation, and they will never again train for war.";
csb[4] = "But each person will sit under his grapevine and under his fig tree with no one to frighten him. For the mouth of the LORD of Armies has spoken.";
csb[5] = "Though all the peoples each walk in the name of their gods, we will walk in the name of the LORD our God forever and ever.";
csb[6] = "On that day -- this is the LORD\'s declaration -- I will assemble the lame and gather the scattered, those I have injured.";
csb[7] = "I will make the lame into a remnant, those far removed into a strong nation. Then the LORD will reign over them in Mount Zion from this time on and forever.";
csb[8] = "And you, watchtower for the flock, fortified hill of Daughter Zion, the former rule will come to you; sovereignty will come to Daughter Jerusalem.";
csb[9] = "Now, why are you shouting loudly? Is there no king with you? Has your counselor perished so that anguish grips you like a woman in labor?";
csb[10] = "Writhe and cry out, Daughter Zion, like a woman in labor, for now you will leave the city and camp in the open fields. You will go to Babylon; there you will be rescued; there the LORD will redeem you from the grasp of your enemies!";
csb[11] = "Many nations have now assembled against you; they say, &quot;Let her be defiled, and let us feast our eyes on Zion.&quot;";
csb[12] = "But they do not know the LORD\'s intentions or understand his plan, that he has gathered them like sheaves to the threshing floor.";
csb[13] = "Rise and thresh, Daughter Zion, for I will make your horns iron and your hooves bronze so you can crush many peoples. Then you will set apart their plunder for the LORD, their wealth for the Lord of the whole earth.";
kjv[1] = "But in the last days it shall come to pass, [that] the mountain of the house of the LORD shall be established in the top of the mountains, and it shall be exalted above the hills; and people shall flow unto it.";
rsv[1] = "It shall come to pass in the latter days that the mountain of the house of the LORD shall be established as the highest of the mountains, and shall be raised up above the hills; and peoples shall flow to it,";
asv[1] = "But in the latter days it shall come to pass, that the mountain of Jehovah\'s house shall be established on the top of the mountains, and it shall be exalted above the hills; and peoples shall flow unto it.";
yng[1] = "And it hath come to pass, In the latter end of the days, The mount of the house of Jehovah Is established above the top of the mounts, And it hath been lifted up above the hills, And flowed unto it have peoples.";
dby[1] = "But it shall come to pass in the end of days [that] the mountain of Jehovah\'s house shall be established on the top of the mountains, and shall be lifted up above the hills; and the peoples shall flow unto it.";
web[1] = "But in the last days it shall come to pass, [that] the mount of the house of the LORD shall be established on the top of the mountains, and it shall be exalted above the hills; and people shall flow to it.";
hnv[1] = "But in the latter days, It will happen that the mountain of the LORD\'s temple will be established on the top of the mountains, And it will be exalted above the hills; And peoples will stream to it.";
vul[1] = "et in novissimo dierum erit mons domus Domini praeparatus in vertice montium et sublimis super colles et fluent ad eum populi";
kjv[2] = "And many nations shall come, and say, Come, and let us go up to the mountain of the LORD, and to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths: for the law shall go forth of Zion, and the word of the LORD from Jerusalem.";
rsv[2] = "and many nations shall come, and say: &quot;Come, let us go up to the mountain of the LORD, to the house of the God of Jacob; that he may teach us his ways and we may walk in his paths.&quot; For out of Zion shall go forth the law, and the word of the LORD from Jerusalem.";
asv[2] = "And many nations shall go and say, Come ye, and let us go up to the mountain of Jehovah, and to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths. For out of Zion shall go forth the law, and the word of Jehovah from Jerusalem;";
yng[2] = "And gone have many nations and said, Come and we go up to the mount of Jehovah, And unto the house of the God of Jacob, And He doth teach us of His ways, And we do walk in His paths, For from Zion doth go forth a law, And a word of Jehovah from Jerusalem.";
dby[2] = "And many nations shall go and say, Come, and let us go up to the mountain of Jehovah, and to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths. For out of Zion shall go forth the law, and Jehovah\'s word from Jerusalem.";
web[2] = "And many nations shall come, and say, Come, and let us go up to the mountain of the LORD, and to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths: for the law shall go forth from Zion, and the word of the LORD from Jerusalem.";
hnv[2] = "Many nations will go and say, &quot;Come, and let us go up to the mountain of the LORD, And to the house of the God of Ya`akov; And he will teach us of his ways, And we will walk in his paths.&quot; For out of Tziyon will go forth the law, And the word of the LORD from Yerushalayim;";
vul[2] = "et properabunt gentes multae et dicent venite ascendamus ad montem Domini et ad domum Dei Iacob et docebit nos de viis suis et ibimus in semitis eius quia de Sion egredietur lex et verbum Domini de Hierusalem";
kjv[3] = "And he shall judge among many people, and rebuke strong nations afar off; and they shall beat their swords into plowshares, and their spears into pruninghooks: nation shall not lift up a sword against nation, neither shall they learn war any more.";
rsv[3] = "He shall judge between many peoples, and shall decide for strong nations afar off; and they shall beat their swords into plowshares, and their spears into pruning hooks; nation shall not lift up sword against nation, neither shall they learn war any more;";
asv[3] = "and he will judge between many peoples, and will decide concerning strong nations afar off: and they shall beat their swords into plowshares, and their spears into pruning-hooks; nation shall not lift up sword against nation, neither shall they learn war any more.";
yng[3] = "And He hath judged between many peoples, And given a decision to mighty nations afar off, They have beaten their swords to ploughshares, And their spears to pruning-hooks, Nation lifteth not up sword unto nation, Nor do they learn war any more.";
dby[3] = "And he shall judge among many peoples, and reprove strong nations, even afar off; and they shall forge their swords into ploughshares, and their spears into pruning-knives: nation shall not lift up sword against nation, neither shall they learn war any more.";

kjv[5] = "For all people will walk every one in the name of his god, and we will walk in the name of the LORD our God for ever and ever.";
rsv[5] = "For all the peoples walk each in the name of its god, but we will walk in the name of the LORD our God for ever and ever.";
asv[5] = "For all the peoples walk every one in the name of his god; and we will walk in the name of Jehovah our God for ever and ever.";
yng[5] = "For all the peoples do walk, Each in the name of its god -- and we, We do walk in the name of Jehovah our God, To the age and for ever.";
dby[5] = "For all the peoples will walk every one in the name of his god; but we will walk in the name of Jehovah, our God for ever and ever.";
web[5] = "For all people will walk every one in the name of his god, and we will walk in the name of the LORD our God for ever and ever.";
hnv[5] = "Indeed all the nations may walk in the name of their gods; But we will walk in the name of the LORD our God forever and ever.";
vul[5] = "quia omnes populi ambulabunt unusquisque in nomine dei sui nos autem ambulabimus in nomine Domini Dei nostri in aeternum et ultra";
kjv[6] = "In that day, saith the LORD, will I assemble her that halteth, and I will gather her that is driven out, and her that I have afflicted;";
rsv[6] = "In that day, says the LORD, I will assemble the lame and gather those who have been driven away, and those whom I have afflicted;";
asv[6] = "In that day, saith Jehovah, will I assemble that which is lame, and I will gather that which is driven away, and that which I have afflicted;";
yng[6] = "In that day -- an affirmation of Jehovah, I do gather the halting one, And the driven away one I bring together, And she whom I have afflicted.";
dby[6] = "In that day, saith Jehovah, will I assemble her that halteth, and I will gather her that is driven out, and her that I have afflicted;";
web[6] = "In that day, saith the LORD, I will assemble her that halteth, and I will gather her that is driven out, and her that I have afflicted;";
hnv[6] = "&quot;In that day,&quot; says the LORD, &quot;I will assemble that which is lame, And I will gather that which is driven away, And that which I have afflicted;";
vul[6] = "in die illa dicit Dominus congregabo claudicantem et eam quam eieceram colligam et quam adflixeram";
kjv[7] = "And I will make her that halted a remnant, and her that was cast far off a strong nation: and the LORD shall reign over them in mount Zion from henceforth, even for ever.";
rsv[7] = "and the lame I will make the remnant; and those who were cast off, a strong nation; and the LORD will reign over them in Mount Zion from this time forth and for evermore.";
asv[7] = "and I will make that which was lame a remnant, and that which was cast far off a strong nation: and Jehovah will reign over them in mount Zion from henceforth even for ever.";
yng[7] = "And I have set the halting for a remnant, And the far-off for a mighty nation, And reigned hath Jehovah over them in mount Zion, From henceforth, and unto the age.";
dby[7] = "and I will make her that halted a remnant, and her that was cast far off a strong nation; and Jehovah shall reign over them in mount Zion, from henceforth even for ever.";
web[7] = "And I will make her that halted a remnant, and her that was cast far off a strong nation: and the LORD will reign over them in mount Zion from henceforth, even for ever.";
hnv[7] = "And I will make that which was lame a remnant, And that which was cast far off a strong nation: And the LORD will reign over them on Mount Tziyon from then on, even forever.";
vul[7] = "et ponam claudicantem in reliquias et eam quae laboraverat in gentem robustam et regnabit Dominus super eos in monte Sion ex hoc nunc et usque in aeternum";
kjv[8] = "And thou, O tower of the flock, the strong hold of the daughter of Zion, unto thee shall it come, even the first dominion; the kingdom shall come to the daughter of Jerusalem.";
rsv[8] = "And you, O tower of the flock, hill of the daughter of Zion, to you shall it come, the former dominion shall come, the kingdom of the daughter of Jerusalem.";
asv[8] = "And thou, O tower of the flock, the hill of the daughter of Zion, unto thee shall it come, yea, the former dominion shall come, the kingdom of the daughter of Jerusalem.";
yng[8] = "And thou, O tower of Eder, Fort of the daughter of Zion, unto thee it cometh, Yea, come in hath the former rule, The kingdom to the daughter of Jerusalem.";
dby[8] = "And thou, O tower of the flock, hill of the daughter of Zion, unto thee shall it come, yea, the first dominion shall come, -- the kingdom to the daughter of Jerusalem.";
web[8] = "And thou, O tower of the flock, the strong hold of the daughter of Zion, to thee shall it come, even the first dominion; the kingdom shall come, to the daughter of Jerusalem.";
hnv[8] = "You, tower of the flock, the hill of the daughter of Tziyon, To you it will come, Yes, the former dominion will come, The kingdom of the daughter of Yerushalayim.";
vul[8] = "et tu turris Gregis nebulosa filiae Sion usque ad te veniet et veniet potestas prima regnum filiae Hierusalem";
kjv[9] = "Now why dost thou cry out aloud? [is there] no king in thee? is thy counsellor perished? for pangs have taken thee as a woman in travail.";
rsv[9] = "Now why do you cry aloud? Is there no king in you? Has your counselor perished, that pangs have seized you like a woman in travail?";
asv[9] = "Now why dost thou cry out aloud? Is there no king in thee, is thy counsellor perished, that pangs have taken hold of thee as of a woman in travail?";
yng[9] = "Now, why dost thou shout aloud? A king -- is there none in thee? Hath thy counsellor perished, That taken hold of thee hath pain as a travailing woman?";
dby[9] = "Now why dost thou cry out aloud? Is there no king in thee? is thy counsellor perished, that pangs have seized thee as a woman in travail?";
web[9] = "Now why dost thou cry aloud? [is there] no king in thee? hath thy counselor perished? for pangs have taken thee as a woman in travail.";
hnv[9] = "Now why do you cry out aloud? Is there no king in you? Has your counselor perished, That pains have taken hold of you as of a woman in travail?";
vul[9] = "nunc quare maerore contraheris numquid rex non est tibi aut consiliarius tuus periit quia conprehendit te dolor sicut parturientem";
kjv[10] = "Be in pain, and labour to bring forth, O daughter of Zion, like a woman in travail: for now shalt thou go forth out of the city, and thou shalt dwell in the field, and thou shalt go [even] to Babylon; there shalt thou be delivered; there the LORD shall redeem thee from the hand of thine enemies.";
rsv[10] = "Writhe and groan, O daughter of Zion, like a woman in travail; for now you shall go forth from the city and dwell in the open country; you shall go to Babylon. There you shall be rescued, there the LORD will redeem you from the hand of your enemies.";
asv[10] = "Be in pain, and labor to bring forth, O daughter of Zion, like a woman in travail; for now shalt thou go forth out of the city, and shalt dwell in the field, and shalt come even unto Babylon: there shalt thou be rescued; there will Jehovah redeem thee from the hand of thine enemies.";
yng[10] = "Be pained, and bring forth, O daughter of Zion, As a travailing woman, For now, thou goest forth from the city, And thou hast dwelt in the field, And thou hast gone unto Babylon, There thou art delivered, There redeem thee doth Jehovah from the hand of thine enemies.";
dby[10] = "Be in pain, and labour to bring forth, O daughter of Zion, like a woman in travail; for now shalt thou go forth out of the city, and thou shalt dwell in the field, and thou shalt go even to Babylon: there shalt thou be delivered; there Jehovah will redeem thee from the hand of thine enemies.";
web[10] = "Be in pain, and labor to bring forth, O daughter of Zion, like a woman in travail: for now shalt thou go forth from the city, and thou shalt dwell in the field, and thou shalt go [even] to Babylon; there shalt thou be delivered; there the LORD shall redeem thee from the hand of thy enemies.";
hnv[10] = "Be in pain, and labor to bring forth, daughter of Tziyon, Like a woman in travail; For now you will go forth out of the city, And will dwell in the field, And will come even to Bavel. There you will be rescued. There the LORD will redeem you from the hand of your enemies.";
vul[10] = "dole et satage filia Sion quasi parturiens quia nunc egredieris de civitate et habitabis in regione et venies usque ad Babylonem ibi liberaberis ibi redimet te Dominus de manu inimicorum tuorum";

rsv[12] = "But they do not know the thoughts of the LORD, they do not understand his plan, that he has gathered them as sheaves to the threshing floor.";

kjv[13] = "Arise and thresh, O daughter of Zion: for I will make thine horn iron, and I will make thy hoofs brass: and thou shalt beat in pieces many people: and I will consecrate their gain unto the LORD, and their substance unto the Lord of the whole earth.";
rsv[13] = "Arise and thresh, O daughter of Zion, for I will make your horn iron and your hoofs bronze; you shall beat in pieces many peoples, and shall devote their gain to the LORD, their wealth to the Lord of the whole earth.";
asv[13] = "Arise and thresh, O daughter of Zion; for I will make thy horn iron, and I will make thy hoofs brass; and thou shalt beat in pieces many peoples: and I will devote their gain unto Jehovah, and their substance unto the Lord of the whole earth.";
yng[13] = "Arise, and thresh, O daughter of Zion, For thy horn I make iron, And thy hoofs I make brass, And thou hast beaten small many peoples, And I have devoted to Jehovah their gain, And their wealth to the Lord of the whole earth!";
dby[13] = "Arise and thresh, daughter of Zion, for I will make thy horn iron, and I will make thy hoofs brass; and thou shalt beat in pieces many peoples; and I will devote their gain to Jehovah, and their substance to the Lord of the whole earth.";
web[13] = "Arise and thresh, O daughter of Zion: for I will make thy horn iron, and I will make thy hoofs brass: and thou shalt beat in pieces many people: and I will consecrate their gain to JEHOVAH, and their substance to the Lord of the whole earth.";
hnv[13] = "Arise and thresh, daughter of Tziyon; For I will make your horn iron, And I will make your hoofs brass; And you will beat in pieces many peoples: And I will devote their gain to the LORD, And their substance to the Lord of the whole eretz.";
