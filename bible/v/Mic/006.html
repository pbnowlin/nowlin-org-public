csb[1] = "Now listen to what the LORD is saying: Rise, plead your case before the mountains, and let the hills hear your complaint.";
csb[2] = "Listen to the LORD\'s lawsuit, you mountains and enduring foundations of the earth, because the LORD has a case against his people, and he will argue it against Israel.";
csb[3] = "My people, what have I done to you, or how have I wearied you? Testify against me!";
csb[4] = "Indeed, I brought you up from the land of Egypt and redeemed you from that place of slavery. I sent Moses, Aaron, and Miriam ahead of you.";
csb[5] = "My people, remember what King Balak of Moab proposed, what Balaam son of Beor answered him, and what happened from the Acacia Grove to Gilgal so that you may acknowledge the LORD\'s righteous acts.";
csb[6] = "What should I bring before the LORD when I come to bow before God on high? Should I come before him with burnt offerings, with year-old calves?";
csb[7] = "Would the LORD be pleased with thousands of rams or with ten thousand streams of oil? Should I give my firstborn for my transgression, the offspring of my body for my own sin?";
csb[8] = "Mankind, he has told each of you what is good and what it is the LORD requires of you: to act justly, to love faithfulness, and to walk humbly with your God.";
csb[9] = "The voice of the LORD calls out to the city (and it is wise to fear your name): &quot;Pay attention to the rod and the one who ordained it.";
csb[10] = "&quot;Are there still the treasures of wickedness and the accursed short measure in the house of the wicked?";
csb[11] = "&quot;Can I excuse wicked scales or bags of deceptive weights?";
csb[12] = "&quot;For the wealthy of the city are full of violence, and its residents speak lies; the tongues in their mouths are deceitful.";
csb[13] = "&quot;As a result, I have begun to strike you severely, bringing desolation because of your sins.";
csb[14] = "&quot;You will eat but not be satisfied, for there will be hunger within you. What you acquire, you cannot save, and what you do save, I will give to the sword.";
csb[15] = "&quot;You will sow but not reap; you will press olives but not anoint yourself with oil; and you will tread grapes but not drink the wine.";
csb[16] = "&quot;The statutes of Omri and all the practices of Ahab\'s house have been observed; you have followed their policies. Therefore, I will make you a desolate place and the city\'s residents an object of contempt; you will bear the scorn of my people.&quot;";
