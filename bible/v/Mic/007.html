csb[1] = "How sad for me! For I am like one who -- when the summer fruit has been gathered after the gleaning of the grape harvest -- finds no grape cluster to eat, no early fig, which I crave.";
csb[2] = "Faithful people have vanished from the land; there is no one upright among the people. All of them wait in ambush to shed blood; they hunt each other with a net.";
csb[3] = "Both hands are good at accomplishing evil: the official and the judge demand a bribe; when the powerful man communicates his evil desire, they plot it together.";
csb[4] = "The best of them is like a brier; the most upright is worse than a hedge of thorns. The day of your watchmen, the day of your punishment, is coming; at this time their panic is here.";
csb[5] = "Do not rely on a friend; don\'t trust in a close companion. Seal your mouth from the woman who lies in your arms.";
csb[6] = "Surely a son considers his father a fool, a daughter opposes her mother, and a daughter-in-law is against her mother-in-law; a man\'s enemies are the men of his own household.";
csb[7] = "But I will look to the LORD; I will wait for the God of my salvation. My God will hear me.";
csb[8] = "Do not rejoice over me, my enemy! Though I have fallen, I will stand up; though I sit in darkness, the LORD will be my light.";
csb[9] = "Because I have sinned against him, I must endure the LORD\'s rage until he champions my cause and establishes justice for me. He will bring me into the light; I will see his salvation.";
csb[10] = "Then my enemy will see, and she will be covered with shame, the one who said to me, &quot;Where is the LORD your God? &quot; My eyes will look at her in triumph; at that time she will be trampled like mud in the streets.";
csb[11] = "A day will come for rebuilding your walls; on that day your boundary will be extended.";
csb[12] = "On that day people will come to you from Assyria and the cities of Egypt, even from Egypt to the Euphrates River and from sea to sea and mountain to mountain.";
csb[13] = "Then the earth will become a wasteland because of its inhabitants and as a result of their actions.";
csb[14] = "Shepherd your people with your staff, the flock that is your possession. They live alone in a woodland surrounded by pastures. Let them graze in Bashan and Gilead as in ancient times.";
csb[15] = "I will perform miracles for them as in the days of your exodus from the land of Egypt.";
csb[16] = "Nations will see and be ashamed of all their power. They will put their hands over their mouths, and their ears will become deaf.";
csb[17] = "They will lick the dust like a snake; they will come trembling out of their hiding places like reptiles slithering on the ground. They will tremble in the presence of the LORD our God; they will stand in awe of you.";
csb[18] = "Who is a God like you, forgiving iniquity and passing over rebellion for the remnant of his inheritance? He does not hold on to his anger forever because he delights in faithful love.";
csb[19] = "He will again have compassion on us; he will vanquish our iniquities. You will cast all our sins into the depths of the sea.";
csb[20] = "You will show loyalty to Jacob and faithful love to Abraham, as you swore to our fathers from days long ago.";
kjv[1] = "Woe is me! for I am as when they have gathered the summer fruits, as the grapegleanings of the vintage: [there is] no cluster to eat: my soul desired the firstripe fruit.";
rsv[1] = "Woe is me! For I have become as when the summer fruit has been gathered, as when the vintage has been gleaned: there is no cluster to eat, no first-ripe fig which my soul desires.";
asv[1] = "Woe is me! for I am as when they have gathered the summer fruits, as the grape gleanings of the vintage: there is no cluster to eat; my soul desireth the first-ripe fig.";
yng[1] = "My wo [is] to me, for I have been As gatherings of summer-fruit, As gleanings of harvest, There is no cluster to eat, The first-ripe fruit desired hath my soul.";
dby[1] = "Woe is me! for I am as when they have gathered the summer-fruits, as the grape-gleanings of the vintage. There is no cluster to eat; there is no early fruit [which] my soul desired.";
web[1] = "Woe is me! for I am as when they have gathered the summer fruits, as the grape-gleanings of the vintage: [there is] no cluster to eat: my soul desired the first ripe fruit.";
hnv[1] = "Misery is mine! Indeed, I am like one who gathers the summer fruits, as gleanings of the vinyard: There is no cluster of grapes to eat. My soul desires to eat the early fig.";
vul[1] = "vae mihi quia factus sum sicut qui colligit in autumno racemos vindemiae non est botrus ad comedendum praecoquas ficus desideravit anima mea";

rsv[2] = "The godly man has perished from the earth, and there is none upright among men; they all lie in wait for blood, and each hunts his brother with a net.";
asv[2] = "The godly man is perished out of the earth, and there is none upright among men: they all lie in wait for blood; they hunt every man his brother with a net.";
yng[2] = "Perished hath the kind out of the land, And upright among men -- there are none, All of them for blood lie in wait, Each his brother they hunt [with] a net.";
dby[2] = "The godly [man] hath perished out of the land, and there is none upright among men: they all lie in wait for blood, they hunt every man his brother with a net.";
web[2] = "The good [man] hath perished from the earth: and [there is] none upright among men: they all lie in wait for blood; they hunt every man his brother with a net.";
hnv[2] = "The godly man has perished out of the eretz, And there is no one upright among men. They all lie in wait for blood; Every man hunts his brother with a net.";

kjv[3] = "That they may do evil with both hands earnestly, the prince asketh, and the judge [asketh] for a reward; and the great [man], he uttereth his mischievous desire: so they wrap it up.";
rsv[3] = "Their hands are upon what is evil, to do it diligently; the prince and the judge ask for a bribe, and the great man utters the evil desire of his soul; thus they weave it together.";
asv[3] = "Their hands are upon that which is evil to do it diligently; the prince asketh, and the judge [is ready] for a reward; and the great man, he uttereth the evil desire of his soul: thus they weave it together.";
yng[3] = "On the evil [are] both hands to do [it] well, The prince is asking -- also the judge -- for recompence, And the great -- he is speaking the mischief of his soul, And they wrap it up.";
dby[3] = "Both hands are for evil, to do it well. The prince asketh, and the judge [is there] for a reward; and the great [man] uttereth his soul\'s greed: and [together] they combine it.";
web[3] = "That they may do evil with both hands earnestly, the prince asketh, and the judge [asketh] for a reward; and the great [man], he uttereth his mischievous desire: so they wrap it up.";
hnv[3] = "Their hands are on that which is evil to do it diligently. The ruler and judge ask for a bribe; And the powerful man dictates the evil desire of his soul. Thus they conspire together.";
vul[3] = "malum manuum suarum dicunt bonum princeps postulat et iudex in reddendo est et magnus locutus est desiderium animae suae et conturbaverunt eam";
