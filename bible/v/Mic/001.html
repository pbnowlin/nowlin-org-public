csb[1] = "The word of the LORD that came to Micah the Moreshite -- what he saw regarding Samaria and Jerusalem in the days of Jotham, Ahaz, and Hezekiah, kings of Judah.";
csb[2] = "Listen, all you peoples; pay attention, earth and everyone in it! The Lord GOD will be a witness against you, the Lord, from his holy temple.";
csb[3] = "Look, the LORD is leaving his place and coming down to trample the heights of the earth.";
csb[4] = "The mountains will melt beneath him, and the valleys will split apart, like wax near a fire, like water cascading down a mountainside.";
csb[5] = "All this will happen because of Jacob\'s rebellion and the sins of the house of Israel. What is the rebellion of Jacob? Isn\'t it Samaria? And what is the high place of Judah? Isn\'t it Jerusalem?";
csb[6] = "Therefore, I will make Samaria a heap of ruins in the countryside, a planting area for a vineyard. I will roll her stones into the valley and expose her foundations.";
csb[7] = "All her carved images will be smashed to pieces; all her wages will be burned in the fire, and I will destroy all her idols. Since she collected the wages of a prostitute, they will be used again for a prostitute.";
csb[8] = "Because of this I will lament and wail; I will walk barefoot and naked. I will howl like the jackals and mourn like ostriches.";
csb[9] = "For her wound is incurable and has reached even Judah; it has approached my people\'s city gate, as far as Jerusalem.";
csb[10] = "Don\'t announce it in Gath, don\'t weep at all. Roll in the dust in Beth-leaphrah.";
csb[11] = "Depart in shameful nakedness, you residents of Shaphir; the residents of Zaanan will not come out. Beth-ezel is lamenting; its support is taken from you.";
csb[12] = "Though the residents of Maroth anxiously wait for something good, disaster has come from the LORD to the gate of Jerusalem.";
csb[13] = "Harness the horses to the chariot, you residents of Lachish. This was the beginning of sin for Daughter Zion because Israel\'s acts of rebellion can be traced to you.";
csb[14] = "Therefore, send farewell gifts to Moresheth-gath; the houses of Achzib are a deception to the kings of Israel.";
csb[15] = "I will again bring a conqueror against you who live in Mareshah. The nobility of Israel will come to Adullam.";
csb[16] = "Shave yourselves bald and cut off your hair in sorrow for your precious children; make yourselves as bald as an eagle, for they have been taken from you into exile.";
kjv[1] = "The word of the LORD that came to Micah the Morasthite in the days of Jotham, Ahaz, [and] Hezekiah, kings of Judah, which he saw concerning Samaria and Jerusalem.";
rsv[1] = "The word of the LORD that came to Micah of Mo\'resheth in the days of Jotham, Ahaz, and Hezeki\'ah, kings of Judah, which he saw concerning Sama\'ria and Jerusalem.";
asv[1] = "The word of Jehovah that came to Micah the Morashtite in the days of Jotham, Ahaz, and Hezekiah, kings of Judah, which he saw concerning Samaria and Jerusalem.";
yng[1] = "A word of Jehovah that hath been unto Micah the Morashite in the days of Jotham, Ahaz, Hezekiah, kings of Judah, that he hath seen concerning Samaria and Jerusalem:";
dby[1] = "The word of Jehovah that came to Micah the Morasthite in the days of Jotham, Ahaz, [and] Hezekiah, kings of Judah, which he saw concerning Samaria and Jerusalem.";
web[1] = "The word of the LORD that came to Micah the Morasthite in the days of Jotham, Ahaz, [and] Hezekiah, kings of Judah, which he saw concerning Samaria and Jerusalem.";
hnv[1] = "The word of the LORD that came to Mikhah the Morashti in the days of Yotam, Achaz, and Hizkiyahu, kings of Yehudah, which he saw concerning Shomron and Yerushalayim.";
vul[1] = "verbum Domini quod factum est ad Micham Morasthiten in diebus Ioatham Ahaz Ezechiae regum Iuda quod vidit super Samariam et Hierusalem";
kjv[2] = "Hear, all ye people; hearken, O earth, and all that therein is: and let the Lord GOD be witness against you, the Lord from his holy temple.";
rsv[2] = "Hear, you peoples, all of you; hearken, O earth, and all that is in it; and let the Lord GOD be a witness against you, the Lord from his holy temple.";
asv[2] = "Hear, ye peoples, all of you; hearken, O earth, and all that therein is: and let the Lord Jehovah be witness against you, the Lord from his holy temple.";
yng[2] = "Hear, O peoples, all of them! Attend, O earth, and its fulness, And the Lord Jehovah is against you for a witness, The Lord from His holy temple.";
dby[2] = "Hear, ye peoples, all of you; hearken, O earth, and all that is therein: and let the Lord Jehovah be witness against you, the Lord from his holy temple!";
web[2] = "Hear, all ye people; hearken, O earth, and all that therein is: and let the Lord GOD be witness against you, the Lord from his holy temple.";
hnv[2] = "Hear, you peoples, all of you. Listen, O eretz, and all that is therein: And let the Lord GOD be witness against you, The Lord from his holy temple.";
vul[2] = "audite populi omnes et adtendat terra et plenitudo eius et sit Dominus Deus vobis in testem Dominus de templo sancto suo";
kjv[3] = "For, behold, the LORD cometh forth out of his place, and will come down, and tread upon the high places of the earth.";
rsv[3] = "For behold, the LORD is coming forth out of his place, and will come down and tread upon the high places of the earth.";
asv[3] = "For, behold, Jehovah cometh forth out of his place, and will come down, and tread upon the high places of the earth.";
yng[3] = "For lo, Jehovah is going out from His place, And He hath come down, And hath trodden on high places of earth.";
dby[3] = "For behold, Jehovah cometh forth out of his place, and will come down, and tread upon the high places of the earth.";
web[3] = "For behold, the LORD cometh forth from his place, and will come down, and tread upon the high places of the earth.";
hnv[3] = "For, behold, the LORD comes forth out of his place, And will come down and tread on the high places of the eretz.";
vul[3] = "quia ecce Dominus egreditur de loco suo et descendet et calcabit super excelsa terrae";
kjv[4] = "And the mountains shall be molten under him, and the valleys shall be cleft, as wax before the fire, [and] as the waters [that are] poured down a steep place.";
rsv[4] = "And the mountains will melt under him and the valleys will be cleft, like wax before the fire, like waters poured down a steep place.";
asv[4] = "And the mountains shall be melted under him, and the valleys shall be cleft, as wax before the fire, as waters that are poured down a steep place.";
yng[4] = "Melted have been the mountains under Him, And the valleys do rend themselves, As wax from the presence of fire, As waters cast down by a slope.";
dby[4] = "And the mountains shall be melted under him, and the valleys shall be cleft, as wax before the fire, as waters poured down a steep place.";
web[4] = "And the mountains shall be melted under him, and the valleys shall be cleft, as wax before the fire, [and] as the waters [that are] poured down a steep place.";
hnv[4] = "The mountains melt under him, And the valleys split apart, Like wax before the fire, Like waters that are poured down a steep place.";
vul[4] = "et consumentur montes subtus eum et valles scindentur sicut cera a facie ignis sicut aquae quae decurrunt in praeceps";
kjv[5] = "For the transgression of Jacob [is] all this, and for the sins of the house of Israel. What [is] the transgression of Jacob? [is it] not Samaria? and what [are] the high places of Judah? [are they] not Jerusalem?";
rsv[5] = "All this is for the transgression of Jacob and for the sins of the house of Israel. What is the transgression of Jacob? Is it not Sama\'ria? And what is the sin of the house of Judah? Is it not Jerusalem?";
asv[5] = "For the transgression of Jacob is all this, and for the sins of the house of Israel. What is the transgression of Jacob? is it not Samaria? and what are the high places of Judah? are they not Jerusalem?";
yng[5] = "For the transgression of Jacob [is] all this, And for the sins of the house of Israel. What [is] the transgression of Jacob? Is it not Samaria? And what the high places of Judah? Is it not Jerusalem?";
dby[5] = "For the transgression of Jacob is all this, and for the sins of the house of Israel. Whence is the transgression of Jacob? is it not [from] Samaria? And whence are the high places of Judah? are they not [from] Jerusalem?";
web[5] = "For the transgression of Jacob [is] all this, and for the sins of the house of Israel. What [is] the transgression of Jacob? [is it] not Samaria? and what [are] the high places of Judah? [are they] not Jerusalem?";
hnv[5] = "&quot;All this is for the disobedience of Ya`akov, And for the sins of the house of Yisra\'el. What is the disobedience of Ya`akov? Isn\'t it Shomron? And what are the high places of Yehudah? Aren\'t they Yerushalayim?";
vul[5] = "in scelere Iacob omne istud et in peccatis domus Israhel quod scelus Iacob nonne Samaria et quae excelsa Iudae nonne Hierusalem";
kjv[6] = "Therefore I will make Samaria as an heap of the field, [and] as plantings of a vineyard: and I will pour down the stones thereof into the valley, and I will discover the foundations thereof.";
rsv[6] = "Therefore I will make Sama\'ria a heap in the open country, a place for planting vineyards; and I will pour down her stones into the valley, and uncover her foundations.";
asv[6] = "Therefore I will make Samaria as a heap of the field, [and] as places for planting vineyards; and I will pour down the stones thereof into the valley, and I will uncover the foundations thereof.";
yng[6] = "And I have set Samaria for a heap of the field, For plantations of a vineyard, And poured out into a valley her stones, And her foundations I uncover.";
dby[6] = "Therefore will I make Samaria as a heap of the field, as plantings of a vineyard; and I will pour down the stones thereof into the valley, and I will lay bare the foundations thereof.";
web[6] = "Therefore I will make Samaria as a heap of the field, [and] as plantings of a vineyard: and I will pour down her stones into the valley, and I will lay bare her foundations.";
hnv[6] = "Therefore I will make Shomron like a rubble heap of the field, Like places for planting vineyards; And I will pour down its stones into the valley, And I will uncover its foundations.";
vul[6] = "et ponam Samariam quasi acervum lapidum in agro cum plantatur vinea et detraham in vallem lapides eius et fundamenta eius revelabo";
kjv[7] = "And all the graven images thereof shall be beaten to pieces, and all the hires thereof shall be burned with the fire, and all the idols thereof will I lay desolate: for she gathered [it] of the hire of an harlot, and they shall return to the hire of an harlot.";
rsv[7] = "All her images shall be beaten to pieces, all her hires shall be burned with fire, and all her idols I will lay waste; for from the hire of a harlot she gathered them, and to the hire of a harlot they shall return.";
asv[7] = "And all her graven images shall be beaten to pieces, and all her hires shall be burned with fire, and all her idols will I lay desolate; for of the hire of a harlot hath she gathered them, and unto the hire of a harlot shall they return.";
yng[7] = "And all her graven images are beaten down, And all her gifts are burnt with fire, And all her idols I make a desolation, For, from the hire of a harlot she gathered, and unto the hire of a harlot they return.";
dby[7] = "And all her graven images shall be beaten to pieces, and all her harlot-gifts shall be burned with fire, and all her idols will I make a desolation; for of the hire of a harlot hath she gathered [them], and to a harlot\'s hire shall they return.";
web[7] = "And all her graven images shall be beaten to pieces, and all her hires shall be burned with the fire, and all her idols will I lay desolate: for she gathered [it] from the hire of a harlot, and they shall return to the hire of a harlot.";
hnv[7] = "All her idols will be beaten to pieces, And all her temple gifts will be burned with fire, And all her images I will destroy; For of the hire of a prostitute has she gathered them, And to the hire of a prostitute shall they return.&quot;";
vul[7] = "et omnia sculptilia eius concidentur et omnes mercedes eius conburentur igni et omnia idola eius ponam in perditionem quia de mercedibus meretricis congregata sunt et usque ad mercedem meretricis revertentur";
kjv[8] = "Therefore I will wail and howl, I will go stripped and naked: I will make a wailing like the dragons, and mourning as the owls.";
rsv[8] = "For this I will lament and wail; I will go stripped and naked; I will make lamentation like the jackals, and mourning like the ostriches.";
asv[8] = "For this will I lament and wail; I will go stripped and naked; I will make a wailing like the jackals, and a lamentation like the ostriches.";
yng[8] = "For this I lament and howl, I go spoiled and naked, I make a lamentation like dragons, And a mourning like daughters of an ostrich.";
dby[8] = "For this will I lament, and I will howl; I will go stripped and naked: I will make a wailing like the jackals, and mourning like the ostriches.";
web[8] = "Therefore I will wail and howl, I will go stripped and naked: I will make a wailing like the dragons, and mourning as the owls.";
hnv[8] = "For this I will lament and wail; I will go stripped and naked; I will howl like the jackals, And moan like the daughters of owls.";
vul[8] = "super hoc plangam et ululabo vadam spoliatus et nudus faciam planctum velut draconum et luctum quasi strutionum";
kjv[9] = "For her wound [is] incurable; for it is come unto Judah; he is come unto the gate of my people, [even] to Jerusalem.";
rsv[9] = "For her wound is incurable; and it has come to Judah, it has reached to the gate of my people, to Jerusalem.";
asv[9] = "For her wounds are incurable; for it is come even unto Judah; it reacheth unto the gate of my people, even to Jerusalem.";
yng[9] = "For mortal [are] her wounds, For it hath come unto Judah, It hath come to a gate of My people -- to Jerusalem.";
dby[9] = "For her wounds are incurable; for it is come even unto Judah, it reacheth unto the gate of my people, even to Jerusalem.";
web[9] = "For her wound [is] incurable; for it is come to Judah; he is come to the gate of my people, [even] to Jerusalem.";
hnv[9] = "For her wounds are incurable; For it has come even to Yehudah. It reaches to the gate of my people, Even to Yerushalayim.";
vul[9] = "quia desperata est plaga eius quia venit usque ad Iudam tetigit portam populi mei usque ad Hierusalem";
kjv[10] = "Declare ye [it] not at Gath, weep ye not at all: in the house of Aphrah roll thyself in the dust.";
rsv[10] = "Tell it not in Gath, weep not at all; in Beth-le-aph\'rah roll yourselves in the dust.";
asv[10] = "Tell it not in Gath, weep not at all: at Beth-le-aphrah have I rolled myself in the dust.";
yng[10] = "In Gath tell ye not -- in Acco weep not, In Beth-Aphrah, in dust roll thyself.";
dby[10] = "Tell it not in Gath, weep not at all; at Beth-le-aphrah roll thyself in the dust.";
web[10] = "Declare ye [it] not at Gath, weep ye not at all: in the house of Aphrah roll thyself in the dust.";
hnv[10] = "Don\'t tell it in Gat, Don\'t weep at all. At Beit-La`afrah I have rolled myself in the dust.";
vul[10] = "in Geth nolite adnuntiare lacrimis ne ploretis in domo Pulveris pulvere vos conspergite";
kjv[11] = "Pass ye away, thou inhabitant of Saphir, having thy shame naked: the inhabitant of Zaanan came not forth in the mourning of Bethezel; he shall receive of you his standing.";
rsv[11] = "Pass on your way, inhabitants of Shaphir, in nakedness and shame; the inhabitants of Za\'anan do not come forth; the wailing of Beth-e\'zel shall take away from you its standing place.";
asv[11] = "Pass away, O inhabitant of Shaphir, in nakedness and shame: the inhabitant of Zaanan is not come forth; the wailing of Beth-ezel shall take from you the stay thereof.";
yng[11] = "Pass over for thee, O inhabitant of Shaphir, Naked one of shame. Not gone out hath the inhabitant of Zaanan, The lamentation of Beth-Ezel doth take from you its standing.";
dby[11] = "Pass away, inhabitress of Shaphir, in nakedness [and] shame. The inhabitress of Zaanan is not come forth for the lamentation of Beth-ezel: he will take from you its shelter.";
web[11] = "Pass ye away, thou inhabitant of Saphir, having thy shame exposed: the inhabitant of Zaanan came not forth in the mourning of Beth-ezel; he shall receive from you his standing.";
hnv[11] = "Pass on, inhabitant of Shafir, in nakedness and shame. The inhabitant of Tza\'anan won\'t come out. The wailing of Beit-Ha`etzel will take from you his protection.";
vul[11] = "et transite vobis habitatio Pulchra confusa ignominia non est egressa quae habitat in Exitu planctum domus Vicinae accipiet ex vobis quae stetit sibimet";
kjv[12] = "For the inhabitant of Maroth waited carefully for good: but evil came down from the LORD unto the gate of Jerusalem.";
rsv[12] = "For the inhabitants of Maroth wait anxiously for good, because evil has come down from the LORD to the gate of Jerusalem.";
asv[12] = "For the inhabitant of Maroth waiteth anxiously for good, because evil is come down from Jehovah unto the gate of Jerusalem.";
yng[12] = "For stayed for good hath the inhabitant of Maroth, For evil hath come down from Jehovah to the gate of Jerusalem.";
dby[12] = "For the inhabitress of Maroth waited anxiously for good; but evil hath come down from Jehovah unto the gate of Jerusalem.";
web[12] = "For the inhabitant of Maroth waited anxiously for good: but evil came down from the LORD to the gate of Jerusalem.";
hnv[12] = "For the inhabitant of Marot waits anxiously for good, Because evil has come down from the LORD to the gate of Yerushalayim.";
vul[12] = "quia infirmata est in bonum quae habitat in Amaritudinibus quia descendit malum a Domino in portam Hierusalem";
kjv[13] = "O thou inhabitant of Lachish, bind the chariot to the swift beast: she [is] the beginning of the sin to the daughter of Zion: for the transgressions of Israel were found in thee.";
rsv[13] = "Harness the steeds to the chariots, inhabitants of Lachish; you were the beginning of sin to the daughter of Zion, for in you were found the transgressions of Israel.";
asv[13] = "Bind the chariot to the swift steed, O inhabitant of Lachish: she was the beginning of sin to the daughter of Zion; for the transgressions of Israel were found in thee.";
yng[13] = "Bind the chariot to a swift beast, O inhabitant of Lachish, The beginning of sin [is] she to the daughter of Zion, For in thee have been found the transgressions of Israel.";
dby[13] = "Bind the chariot to the swift steed, O inhabitress of Lachish: she was the beginning of sin to the daughter of Zion; for in thee were found the transgressions of Israel.";
web[13] = "O thou inhabitant of Lachish, bind the chariot to the swift beast: she [is] the beginning of the sin to the daughter of Zion: for the transgressions of Israel were found in thee.";
hnv[13] = "Harness the chariot to the swift steed, inhabitant of Lakhish. She was the beginning of sin to the daughter of Tziyon; For the transgressions of Yisra\'el were found in you.";
vul[13] = "tumultus quadrigae stuporis habitanti Lachis principium peccati est filiae Sion quia in te inventa sunt scelera Israhel";
kjv[14] = "Therefore shalt thou give presents to Moreshethgath: the houses of Achzib [shall be] a lie to the kings of Israel.";
rsv[14] = "Therefore you shall give parting gifts to Mo\'resheth-gath; the houses of Achzib shall be a deceitful thing to the kings of Israel.";
asv[14] = "Therefore shalt thou give a parting gift to Moresheth-gath: the houses of Achzib shall be a deceitful thing unto the kings of Israel.";
yng[14] = "Therefore thou givest presents to Moresheth-Gath, The houses of Achzib become a lying thing to the kings of Israel.";
dby[14] = "Therefore shalt thou give parting-gifts to Moresheth-Gath: the houses of Achzib shall be a lie to the kings of Israel.";
web[14] = "Therefore shalt thou give presents to Moresheth-gath: the houses of Achzib [shall be] a lie to the kings of Israel.";
hnv[14] = "Therefore you will give a parting gift to Moreshet-Gat. The houses of Akhziv will be a deceitful thing to the kings of Yisra\'el.";
vul[14] = "propterea dabit emissarios super hereditatem Geth domus Mendacii in deceptionem regibus Israhel";
kjv[15] = "Yet will I bring an heir unto thee, O inhabitant of Mareshah: he shall come unto Adullam the glory of Israel.";
rsv[15] = "I will again bring a conqueror upon you, inhabitants of Mare\'shah; the glory of Israel shall come to Adullam.";
asv[15] = "I will yet bring unto thee, O inhabitant of Mareshah, him that shall possess thee: the glory of Israel shall come even unto Adullam.";
yng[15] = "Yet the possessor I do bring in to thee, O inhabitant of Mareshah, To Adullam come in doth the honour of Israel.";
dby[15] = "I will yet bring unto thee an heir, O inhabitress of Mareshah; the glory of Israel shall come even unto Adullam.";
web[15] = "Yet will I bring an heir to thee, O inhabitant of Mareshah: he shall come to Adullam the glory of Israel.";
hnv[15] = "I will yet bring to you, inhabitant of Mareshah, He who is the glory of Yisra\'el will come to `Adullam.";
vul[15] = "adhuc heredem adducam tibi quae habitas in Maresa usque Adollam veniet gloria Israhel";
kjv[16] = "Make thee bald, and poll thee for thy delicate children; enlarge thy baldness as the eagle; for they are gone into captivity from thee.";
rsv[16] = "Make yourselves bald and cut off your hair, for the children of your delight; make yourselves as bald as the eagle, for they shall go from you into exile.";
asv[16] = "Make thee bald, and cut off thy hair for the children of thy delight: enlarge thy baldness as the eagle; for they are gone into captivity from thee.";
yng[16] = "Make bald and shave, for thy delightful sons, Enlarge thy baldness as an eagle, For they have removed from thee!";
dby[16] = "Make thee bald, and poll thee for the children of thy delights; enlarge thy baldness as the eagle, for they are gone into captivity from thee.";
web[16] = "Make thee bald, and poll thee for thy delicate children; enlarge thy baldness as the eagle; for they are gone into captivity from thee.";
hnv[16] = "Shave your heads, And cut off your hair for the children of your delight. Enlarge your baldness like the rakham; For they have gone into captivity from you!";
vul[16] = "decalvare et tondere super filios deliciarum tuarum dilata calvitium tuum sicut aquila quoniam captivi ducti sunt ex te";
