csb[1] = "You foolish Galatians! Who has cast a spell on you, before whose eyes Jesus Christ was publicly portrayed as crucified?";
csb[2] = "I only want to learn this from you: Did you receive the Spirit by the works of the law or by believing what you heard?";
csb[3] = "Are you so foolish? After beginning by the Spirit, are you now finishing by the flesh?";
csb[4] = "Did you experience so much for nothing -- if in fact it was for nothing?";
csb[5] = "So then, does God give you the Spirit and work miracles among you by your doing the works of the law? Or is it by believing what you heard --";
csb[6] = "just like Abraham who believed God, and it was credited to him for righteousness?";
csb[7] = "You know, then, that those who have faith, these are Abraham\'s sons.";
csb[8] = "Now the Scripture saw in advance that God would justify the Gentiles by faith and proclaimed the gospel ahead of time to Abraham, saying, All the nations will be blessed through you.";
csb[9] = "Consequently those who have faith are blessed with Abraham, who had faith.";
csb[10] = "For all who rely on the works of the law are under a curse, because it is written, Everyone who does not do everything written in the book of the law is cursed.";
csb[11] = "Now it is clear that no one is justified before God by the law, because the righteous will live by faith.";
csb[12] = "But the law is not based on faith; instead, the one who does these things will live by them.";
csb[13] = "Christ redeemed us from the curse of the law by becoming a curse for us, because it is written, Cursed is everyone who is hung on a tree.";
csb[14] = "The purpose was that the blessing of Abraham would come to the Gentiles by Christ Jesus, so that we could receive the promised Spirit through faith.";
csb[15] = "Brothers and sisters, I\'m using a human illustration. No one sets aside or makes additions to a validated human will.";
csb[16] = "Now the promises were spoken to Abraham and to his seed. He does not say &quot;and to seeds,&quot; as though referring to many, but referring to one, and to your seed, who is Christ.";
csb[17] = "My point is this: The law, which came 430 years later, does not invalidate a covenant previously established by God and thus cancel the promise.";
csb[18] = "For if the inheritance is based on the law, it is no longer based on the promise; but God has graciously given it to Abraham through the promise.";
csb[19] = "Why then was the law given? It was added for the sake of transgressions until the Seed to whom the promise was made would come. The law was put into effect through angels by means of a mediator.";
csb[20] = "Now a mediator is not just for one person alone, but God is one.";
csb[21] = "Is the law therefore contrary to God\'s promises? Absolutely not! For if the law had been granted with the ability to give life, then righteousness would certainly be on the basis of the law.";
csb[22] = "But the Scripture imprisoned everything under sin\'s power, so that the promise might be given on the basis of faith in Jesus Christ to those who believe.";
csb[23] = "Before this faith came, we were confined under the law, imprisoned until the coming faith was revealed.";
csb[24] = "The law, then, was our guardian until Christ, so that we could be justified by faith.";
csb[25] = "But since that faith has come, we are no longer under a guardian,";
csb[26] = "for through faith you are all sons of God in Christ Jesus.";
csb[27] = "For those of you who were baptized into Christ have been clothed with Christ.";
csb[28] = "There is no Jew or Greek, slave or free, male and female; since you are all one in Christ Jesus.";
csb[29] = "And if you belong to Christ, then you are Abraham\'s seed, heirs according to the promise.";
kjv[1] = "O foolish Galatians, who hath bewitched you, that ye should not obey the truth, before whose eyes Jesus Christ hath been evidently set forth, crucified among you?";
kjv[2] = "This only would I learn of you, Received ye the Spirit by the works of the law, or by the hearing of faith?";
kjv[3] = "Are ye so foolish? having begun in the Spirit, are ye now made perfect by the flesh?";
kjv[4] = "Have ye suffered so many things in vain? if [it be] yet in vain.";
kjv[5] = "He therefore that ministereth to you the Spirit, and worketh miracles among you, [doeth he it] by the works of the law, or by the hearing of faith?";
kjv[6] = "Even as Abraham believed God, and it was accounted to him for righteousness.";
kjv[7] = "Know ye therefore that they which are of faith, the same are the children of Abraham.";
kjv[8] = "And the scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, [saying], In thee shall all nations be blessed.";
kjv[9] = "So then they which be of faith are blessed with faithful Abraham.";
kjv[10] = "For as many as are of the works of the law are under the curse: for it is written, Cursed [is] every one that continueth not in all things which are written in the book of the law to do them.";
kjv[11] = "But that no man is justified by the law in the sight of God, [it is] evident: for, The just shall live by faith.";
kjv[12] = "And the law is not of faith: but, The man that doeth them shall live in them.";
kjv[13] = "Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed [is] every one that hangeth on a tree:";
kjv[14] = "That the blessing of Abraham might come on the Gentiles through Jesus Christ; that we might receive the promise of the Spirit through faith.";
kjv[15] = "Brethren, I speak after the manner of men; Though [it be] but a man\'s covenant, yet [if it be] confirmed, no man disannulleth, or addeth thereto.";
kjv[16] = "Now to Abraham and his seed were the promises made. He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ.";
kjv[17] = "And this I say, [that] the covenant, that was confirmed before of God in Christ, the law, which was four hundred and thirty years after, cannot disannul, that it should make the promise of none effect.";
kjv[18] = "For if the inheritance [be] of the law, [it is] no more of promise: but God gave [it] to Abraham by promise.";
kjv[19] = "Wherefore then [serveth] the law? It was added because of transgressions, till the seed should come to whom the promise was made; [and it was] ordained by angels in the hand of a mediator.";
kjv[20] = "Now a mediator is not [a mediator] of one, but God is one.";
kjv[21] = "[Is] the law then against the promises of God? God forbid: for if there had been a law given which could have given life, verily righteousness should have been by the law.";
kjv[22] = "But the scripture hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe.";
kjv[23] = "But before faith came, we were kept under the law, shut up unto the faith which should afterwards be revealed.";
kjv[24] = "Wherefore the law was our schoolmaster [to bring us] unto Christ, that we might be justified by faith.";
kjv[25] = "But after that faith is come, we are no longer under a schoolmaster.";
kjv[26] = "For ye are all the children of God by faith in Christ Jesus.";
kjv[27] = "For as many of you as have been baptized into Christ have put on Christ.";
kjv[28] = "There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus.";
