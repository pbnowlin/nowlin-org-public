csb[1] = "Now I say that as long as the heir is a child, he differs in no way from a slave, though he is the owner of everything.";
csb[2] = "Instead, he is under guardians and trustees until the time set by his father.";
csb[3] = "In the same way we also, when we were children, were in slavery under the elements of the world.";
csb[4] = "When the time came to completion, God sent his Son, born of a woman, born under the law,";
csb[5] = "to redeem those under the law, so that we might receive adoption as sons.";
csb[6] = "And because you are sons, God sent the Spirit of his Son into our hearts, crying, &quot;Abba, Father! &quot;";
csb[7] = "So you are no longer a slave but a son, and if a son, then God has made you an heir.";
csb[8] = "But in the past, since you didn\'t know God, you were enslaved to things that by nature are not gods.";
csb[9] = "But now, since you know God, or rather have become known by God, how can you turn back again to the weak and worthless elements? Do you want to be enslaved to them all over again?";
csb[10] = "You are observing special days, months, seasons, and years.";
csb[11] = "I am fearful for you, that perhaps my labor for you has been wasted.";
csb[12] = "I beg you, brothers and sisters: Become like me, for I also became like you. You have not wronged me;";
csb[13] = "you know that previously I preached the gospel to you because of a weakness of the flesh.";
csb[14] = "You did not despise or reject me though my physical condition was a trial for you. On the contrary, you received me as an angel of God, as Christ Jesus himself.";
csb[15] = "Where, then, is your blessing? For I testify to you that, if possible, you would have torn out your eyes and given them to me.";
csb[16] = "So then, have I become your enemy because I told you the truth?";
csb[17] = "They court you eagerly, but not for good. They want to exclude you from me, so that you would pursue them.";
csb[18] = "But it is always good to be pursued in a good manner -- and not just when I am with you.";
csb[19] = "My children, I am again suffering labor pains for you until Christ is formed in you.";
csb[20] = "I would like to be with you right now and change my tone of voice, because I don\'t know what to do about you.";
csb[21] = "Tell me, you who want to be under the law, don\'t you hear the law?";
csb[22] = "For it is written that Abraham had two sons, one by a slave and the other by a free woman.";
csb[23] = "But the one by the slave was born as a result of the flesh, while the one by the free woman was born through promise.";
csb[24] = "These things are being taken figuratively, for the women represent two covenants. One is from Mount Sinai and bears children into slavery -- this is Hagar.";
csb[25] = "Now Hagar represents Mount Sinai in Arabia and corresponds to the present Jerusalem, for she is in slavery with her children.";
csb[26] = "But the Jerusalem above is free, and she is our mother.";
csb[27] = "For it is written, Rejoice, childless woman, unable to give birth. Burst into song and shout, you who are not in labor, for the children of the desolate woman will be many, more numerous than those of the woman who has a husband.";
csb[28] = "Now you too, brothers and sisters, like Isaac, are children of promise.";
csb[29] = "But just as then the child born as a result of the flesh persecuted the one born as a result of the Spirit, so also now.";
csb[30] = "But what does the Scripture say? &quot;Drive out the slave and her son, for the son of the slave will never be a coheir with the son of the free woman.&quot;";
csb[31] = "Therefore, brothers and sisters, we are not children of a slave but of the free woman.";

vul[25] = "Sina enim mons est in Arabia qui coniunctus est ei quae nunc est Hierusalem et servit cum filiis eius";
kjv[26] = "But Jerusalem which is above is free, which is the mother of us all.";
rsv[26] = "But the Jerusalem above is free, and she is our mother.";
asv[26] = "But the Jerusalem that is above is free, which is our mother.";
yng[26] = "and the Jerusalem above is the free-woman, which is mother of us all,";
dby[26] = "but the Jerusalem above is free, which is our mother.";
web[26] = "But Jerusalem which is above is free, which is the mother of us all.";
hnv[26] = "But the Yerushalayim that is above is free, which is the mother of us all.";
vul[26] = "illa autem quae sursum est Hierusalem libera est quae est mater nostra";
kjv[27] = "For it is written, Rejoice, [thou] barren that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she which hath an husband.";
rsv[27] = "For it is written, &quot;Rejoice, O barren one who does not bear; break forth and shout, you who are not in travail; for the children of the desolate one are many more than the children of her that is married.&quot;";
asv[27] = "For it is written, Rejoice, thou barren that bearest not; Break forth and cry, thou that travailest not: For more are the children of the desolate than of her that hath the husband. ";
yng[27] = "for it hath been written, `Rejoice, O barren, who art not bearing; break forth and cry, thou who art not travailing, because many [are] the children of the desolate -- more than of her having the husband.\'";
dby[27] = "For it is written, Rejoice, thou barren that bearest not; break out and cry, thou that travailest not; because the children of the desolate are more numerous than [those] of her that has a husband.";
web[27] = "For it is written, Rejoice, [thou] barren that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she who hath a husband.";
hnv[27] = "For it is written, &quot;Rejoice, you barren who don\'t bear. Break forth and shout, you that don\'t travail. For more are the children of the desolate than of her who has a husband.&quot;";
vul[27] = "scriptum est enim laetare sterilis quae non paris erumpe et exclama quae non parturis quia multi filii desertae magis quam eius quae habet virum";
kjv[28] = "Now we, brethren, as Isaac was, are the children of promise.";
rsv[28] = "Now we, brethren, like Isaac, are children of promise.";
asv[28] = "Now we, brethren, as Isaac was, are children of promise.";
yng[28] = "And we, brethren, as Isaac, are children of promise,";
dby[28] = "But *ye*, brethren, after the pattern of Isaac, are children of promise.";
web[28] = "Now we, brethren, as Isaac was, are the children of promise.";
hnv[28] = "Now we, brothers, as Yitzchak was, are children of promise.";
vul[28] = "nos autem fratres secundum Isaac promissionis filii sumus";
kjv[29] = "But as then he that was born after the flesh persecuted him [that was born] after the Spirit, even so [it is] now.";
rsv[29] = "But as at that time he who was born according to the flesh persecuted him who was born according to the Spirit, so it is now.";
asv[29] = "But as then he that was born after the flesh persecuted him [that was born] after the Spirit, so also it is now.";
yng[29] = "but as then he who was born according to the flesh did persecute him according to the spirit, so also now;";
dby[29] = "But as then he that was born according to flesh persecuted him [that was born] according to Spirit, so also [it is] now.";
web[29] = "But as then he that was born according to the flesh persecuted him [that was born] according to the Spirit, even so [it is] now.";
hnv[29] = "But as then, he who was born according to the flesh persecuted him who was born according to the Spirit, so also it is now.";
vul[29] = "sed quomodo tunc qui secundum carnem natus fuerat persequebatur eum qui secundum spiritum ita et nunc";
kjv[30] = "Nevertheless what saith the scripture? Cast out the bondwoman and her son: for the son of the bondwoman shall not be heir with the son of the freewoman.";
rsv[30] = "But what does the scripture say? &quot;Cast out the slave and her son; for the son of the slave shall not inherit with the son of the free woman.&quot;";
asv[30] = "Howbeit what saith the scripture? Cast out the handmaid and her son: for the son of the handmaid shall not inherit with the son of the freewoman.";
yng[30] = "but what saith the Writing? `Cast forth the maid-servant and her son, for the son of the maid-servant may not be heir with the son of the free-woman;\'";
dby[30] = "But what says the scripture? Cast out the maid servant and her son; for the son of the maid servant shall not inherit with the son of the free woman.";
web[30] = "Nevertheless, what saith the scripture? Cast out the bond-woman and her son: for the son of the bond-woman shall not be heir with the son of the free-woman.";
hnv[30] = " However what does the Scripture say? &quot;Throw out the handmaid and her son, for the son of the handmaid will not inherit with the son of the free woman.&quot;";
vul[30] = "sed quid dicit scriptura eice ancillam et filium eius non enim heres erit filius ancillae cum filio liberae";
kjv[31] = "So then, brethren, we are not children of the bondwoman, but of the free.";
rsv[31] = "So, brethren, we are not children of the slave but of the free woman.";
asv[31] = "Wherefore, brethren, we are not children of a handmaid, but of the freewoman.";
yng[31] = "then, brethren, we are not a maid-servant\'s children, but the free-woman\'s.";
dby[31] = "So then, brethren, we are not maid servant\'s children, but [children] of the free woman.";
web[31] = "So then, brethren, we are not children of the bond-woman, but of the free.";
hnv[31] = "So then, brothers, we are not children of a handmaid, but of the free woman.";
vul[31] = "itaque fratres non sumus ancillae filii sed liberae qua libertate nos Christus liberavit";
