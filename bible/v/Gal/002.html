csb[1] = "Then after fourteen years I went up again to Jerusalem with Barnabas, taking Titus along also.";
csb[2] = "I went up according to a revelation and presented to them the gospel I preach among the Gentiles, but privately to those recognized as leaders. I wanted to be sure I was not running, and had not been running, in vain.";
csb[3] = "But not even Titus, who was with me, was compelled to be circumcised, even though he was a Greek.";
csb[4] = "This matter arose because some false brothers had infiltrated our ranks to spy on the freedom we have in Christ Jesus in order to enslave us.";
csb[5] = "But we did not give up and submit to these people for even a moment, so that the truth of the gospel would be preserved for you.";
csb[6] = "Now from those recognized as important (what they once were makes no difference to me; God does not show favoritism) -- they added nothing to me.";
csb[7] = "On the contrary, they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter was for the circumcised,";
csb[8] = "since the one at work in Peter for an apostleship to the circumcised was also at work in me for the Gentiles.";
csb[9] = "When James, Cephas, and John -- those recognized as pillars -- acknowledged the grace that had been given to me, they gave the right hand of fellowship to me and Barnabas, agreeing that we should go to the Gentiles and they to the circumcised.";
csb[10] = "They asked only that we would remember the poor, which I had made every effort to do.";
csb[11] = "But when Cephas came to Antioch, I opposed him to his face because he stood condemned.";
csb[12] = "For he regularly ate with the Gentiles before certain men came from James. However, when they came, he withdrew and separated himself, because he feared those from the circumcision party.";
csb[13] = "Then the rest of the Jews joined his hypocrisy, so that even Barnabas was led astray by their hypocrisy.";
csb[14] = "But when I saw that they were deviating from the truth of the gospel, I told Cephas in front of everyone, &quot;If you, who are a Jew, live like a Gentile and not like a Jew, how can you compel Gentiles to live like Jews? &quot;";
csb[15] = "We are Jews by birth and not &quot;Gentile sinners,&quot;";
csb[16] = "and yet because we know that a person is not justified by the works of the law but by faith in Jesus Christ, even we ourselves have believed in Christ Jesus. This was so that we might be justified by faith in Christ and not by the works of the law, because by the works of the law no human being will be justified.";
csb[17] = "But if we ourselves are also found to be &quot;sinners&quot; while seeking to be justified by Christ, is Christ then a promoter of sin? Absolutely not!";
csb[18] = "If I rebuild those things that I tore down, I show myself to be a lawbreaker.";
csb[19] = "For through the law I died to the law, so that I might live for God.";
csb[20] = "I have been crucified with Christ, and I no longer live, but Christ lives in me. The life I now live in the body, I live by faith in the Son of God, who loved me and gave himself for me.";
csb[21] = "I do not set aside the grace of God, for if righteousness comes through the law, then Christ died for nothing.";

kjv[14] = "But when I saw that they walked not uprightly according to the truth of the gospel, I said unto Peter before [them] all, If thou, being a Jew, livest after the manner of Gentiles, and not as do the Jews, why compellest thou the Gentiles to live as do the Jews?";

yng[14] = "But when I saw that they are not walking uprightly to the truth of the good news, I said to Peter before all, `If thou, being a Jew, in the manner of the nations dost live, and not in the manner of the Jews, how the nations dost thou compel to Judaize?";

kjv[16] = "Knowing that a man is not justified by the works of the law, but by the faith of Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law: for by the works of the law shall no flesh be justified.";

yng[16] = "having known also that a man is not declared righteous by works of law, if not through the faith of Jesus Christ, also we in Christ Jesus did believe, that we might be declared righteous by the faith of Christ, and not by works of law, wherefore declared righteous by works of law shall be no flesh.\'";

vul[16] = "scientes autem quod non iustificatur homo ex operibus legis nisi per fidem Iesu Christi et nos in Christo Iesu credidimus ut iustificemur ex fide Christi et non ex operibus legis propter quod ex operibus legis non iustificabitur omnis caro";

asv[17] = "But if, while we sought to be justified in Christ, we ourselves also were found sinners, is Christ a minister of sin? God forbid.";
