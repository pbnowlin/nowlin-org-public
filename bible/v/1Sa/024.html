csb[1] = "When Saul returned from pursuing the Philistines, he was told, &quot;David is in the wilderness near En-gedi.&quot;"
csb[2] = "So Saul took three thousand of Israel\'s fit young men and went to look for David and his men in front of the Rocks of the Wild Goats.&quot;"
csb[3] = "When Saul came to the sheep pens along the road, a cave was there, and he went in to relieve himself. David and his men were staying in the recesses of the cave,&quot;"
csb[4] = "so they said to him, &quot;Look, this is the day the LORD told you about: \'I will hand your enemy over to you so you can do to him whatever you desire.\' &quot; Then David got up and secretly cut off the corner of Saul\'s robe.&quot;"
csb[5] = "Afterward, David\'s conscience bothered him because he had cut off the corner of Saul\'s robe.&quot;"
csb[6] = "He said to his men, &quot;I swear before the LORD: I would never do such a thing to my lord, the LORD\'s anointed. I will never lift my hand against him, since he is the LORD\'s anointed.&quot;"
csb[7] = "With these words David persuaded his men, and he did not let them rise up against Saul. Then Saul left the cave and went on his way.&quot;"
csb[8] = "After that, David got up, went out of the cave, and called to Saul, &quot;My lord the king! &quot; When Saul looked behind him, David knelt low with his face to the ground and paid homage.&quot;"
csb[9] = "David said to Saul, &quot;Why do you listen to the words of people who say, \'Look, David intends to harm you\'?&quot;"
csb[10] = "&quot;You can see with your own eyes that the LORD handed you over to me today in the cave. Someone advised me to kill you, but I took pity on you and said: I won\'t lift my hand against my lord, since he is the LORD\'s anointed.&quot;"
csb[11] = "&quot;Look, my father! Look at the corner of your robe in my hand, for I cut it off, but I didn\'t kill you. Recognize that I\'ve committed no crime or rebellion. I haven\'t sinned against you even though you are hunting me down to take my life.&quot;"
csb[12] = "&quot;May the LORD judge between me and you, and may the LORD take vengeance on you for me, but my hand will never be against you.&quot;"
csb[13] = "&quot;As the old proverb says, \'Wickedness comes from wicked people.\' My hand will never be against you.&quot;"
csb[14] = "&quot;Who has the king of Israel come after? What are you chasing after? A dead dog? A single flea?&quot;"
csb[15] = "&quot;May the LORD be judge and decide between you and me. May he take notice and plead my case and deliver me from you.&quot;"
csb[16] = "When David finished saying these things to him, Saul replied, &quot;Is that your voice, David my son? &quot; Then Saul wept aloud&quot;"
csb[17] = "and said to David, &quot;You are more righteous than I, for you have done what is good to me though I have done what is evil to you.&quot;"
csb[18] = "&quot;You yourself have told me today what good you did for me: when the LORD handed me over to you, you didn\'t kill me.&quot;"
csb[19] = "&quot;When a man finds his enemy, does he let him go unharmed? May the LORD repay you with good for what you\'ve done for me today.&quot;"
csb[20] = "&quot;Now I know for certain you will be king, and the kingdom of Israel will be established in your hand.&quot;"
csb[21] = "&quot;Therefore swear to me by the LORD that you will not cut off my descendants or wipe out my name from my father\'s family.&quot;"
csb[22] = "So David swore to Saul. Then Saul went back home, and David and his men went up to the stronghold.&quot;"
kjv[1] = "And it came to pass, when Saul was returned from following the Philistines, that it was told him, saying, Behold, David [is] in the wilderness of Engedi.";

kjv[3] = "And he came to the sheepcotes by the way, where [was] a cave; and Saul went in to cover his feet: and David and his men remained in the sides of the cave.";
rsv[3] = "And he came to the sheepfolds by the way, where there was a cave; and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.";

yng[3] = "and he cometh in unto folds of the flock, on the way, and there [is] a cave, and Saul goeth in to cover his feet; and David and his men in the sides of the cave are abiding.";
dby[3] = "And he came to the sheepfolds by the way, where was a cave; and Saul went in to cover his feet; and David and his men were abiding in the recesses of the cave.";

vul[3] = "[Vulgate 24:4] et venit ad caulas quoque ovium quae se offerebant vianti eratque ibi spelunca quam ingressus est Saul ut purgaret ventrem porro David et viri eius in interiori parte speluncae latebant";
kjv[4] = "And the men of David said unto him, Behold the day of which the LORD said unto thee, Behold, I will deliver thine enemy into thine hand, that thou mayest do to him as it shall seem good unto thee. Then David arose, and cut off the skirt of Saul\'s robe privily.";
rsv[4] = "And the men of David said to him, &quot;Here is the day of which the LORD said to you, \'Behold, I will give your enemy into your hand, and you shall do to him as it shall seem good to you.\'&quot; Then David arose and stealthily cut off the skirt of Saul\'s robe.";
asv[4] = "And the men of David said unto him, Behold, the day of which Jehovah said unto thee, Behold, I will deliver thine enemy into thy hand, and thou shalt do to him as it shall seem good unto thee. Then David arose, and cut off the skirt of Saul\'s robe privily.";
yng[4] = "And the men of David say unto him, `Lo, the day of which Jehovah said unto thee, Lo, I am giving thine enemy into thy hand, and thou hast done to him as it is good in thine eyes;\' and David riseth and cutteth off the skirt of the upper robe which [is] on Saul -- gently.";
dby[4] = "And David\'s men said to him, Behold the day of which Jehovah said to thee, Behold, I will give thine enemy into thy hand, that thou mayest do to him as it shall seem good to thee. And David arose, and cut off the skirt of Saul\'s robe secretly.";
web[4] = "And the men of David said to him, Behold the day of which the LORD said to thee, Behold, I will deliver thy enemy into thy hand, that thou mayest do to him as it shall seem good to thee. Then David arose, and privately cut off the skirt of Saul\'s robe.";
hnv[4] = "The men of David said to him, Behold, the day of which the LORD said to you, Behold, I will deliver your enemy into your hand, and you shall do to him as it shall seem good to you. Then David arose, and cut off the skirt of Sha\'ul\'s robe secretly.";
vul[4] = "[Vulgate 24:5] et dixerunt servi David ad eum ecce dies de qua locutus est Dominus ad te ego tradam tibi inimicum tuum ut facias ei sicut placuerit in oculis tuis surrexit ergo David et praecidit oram clamydis Saul silenter";

yng[5] = "And it cometh to pass afterwards that the heart of David smiteth him, because that he hath cut off the skirt which [is] on Saul,";

kjv[6] = "And he said unto his men, The LORD forbid that I should do this thing unto my master, the LORD\'S anointed, to stretch forth mine hand against him, seeing he [is] the anointed of the LORD.";
rsv[6] = "He said to his men, &quot;The LORD forbid that I should do this thing to my lord, the LORD\'S anointed, to put forth my hand against him, seeing he is the LORD\'S anointed.&quot;";

yng[6] = "and he saith to his men, `Far be it from me, by Jehovah; I do not do this thing to my lord -- to the anointed of Jehovah -- to put forth my hand against him, for the anointed of Jehovah he [is].\'";
dby[6] = "And he said to his men, Jehovah forbid that I should do this thing to my master, Jehovah\'s anointed, to stretch forth my hand against him, for he is the anointed of Jehovah.";

asv[7] = "So David checked his men with these words, and suffered them not to rise against Saul. And Saul rose up out of the cave, and went on his way.";
yng[7] = "And David subdueth his men by words, and hath not permitted them to rise against Saul; and Saul hath risen from the cave, and goeth on the way;";
dby[7] = "And David checked his men with these words, and suffered them not to rise against Saul. And Saul rose up out of the cave, and went on [his] way.";

kjv[10] = "Behold, this day thine eyes have seen how that the LORD had delivered thee to day into mine hand in the cave: and [some] bade [me] kill thee: but [mine eye] spared thee; and I said, I will not put forth mine hand against my lord; for he [is] the LORD\'S anointed.";
rsv[10] = "Lo, this day your eyes have seen how the LORD gave you today into my hand in the cave; and some bade me kill you, but I spared you. I said, \'I will not put forth my hand against my lord; for he is the LORD\'S anointed.\'";
asv[10] = "Behold, this day thine eyes have seen how that Jehovah had delivered thee to-day into my hand in the cave: and some bade me kill thee; but [mine eye] spared thee; and I said, I will not put forth my hand against my lord; for he is Jehovah\'s anointed.";
yng[10] = "Lo, this day have thine eyes seen how that Jehovah hath given thee to-day into my hand in the cave; and [one] said to slay thee, and [mine eye] hath pity on thee, and I say, I do not put forth my hand against my lord, for the anointed of Jehovah he [is].";
dby[10] = "Behold, this day thine eyes have seen how that Jehovah had given thee this day into my hand in the cave; and they bade me kill thee; but [mine eye] spared thee; and I said, I will not put forth my hand against my lord, for he is the anointed of Jehovah.";
web[10] = "Behold, this day thy eyes have seen how the LORD hath delivered thee to-day into my hand in the cave; and [some] bade [me] kill thee: but [my eye] spared thee; and I said, I will not put forth my hand against my lord; for he [is] the LORD\'S anointed.";
hnv[10] = "Behold, this day your eyes have seen how that the LORD had delivered you today into my hand in the cave: and some bade me kill you; but [my eye] spared you; and I said, I will not put forth my hand against my lord; for he is the LORD\'s anointed.";
vul[10] = "[Vulgate 24:11] ecce hodie viderunt oculi tui quod tradiderit te Dominus in manu mea in spelunca et cogitavi ut occiderem te sed pepercit tibi oculus meus dixi enim non extendam manum meam in domino meo quia christus Domini est";
kjv[11] = "Moreover, my father, see, yea, see the skirt of thy robe in my hand: for in that I cut off the skirt of thy robe, and killed thee not, know thou and see that [there is] neither evil nor transgression in mine hand, and I have not sinned against thee; yet thou huntest my soul to take it.";
rsv[11] = "See, my father, see the skirt of your robe in my hand; for by the fact that I cut off the skirt of your robe, and did not kill you, you may know and see that there is no wrong or treason in my hands. I have not sinned against you, though you hunt my life to take it.";
asv[11] = "Moreover, my father, see, yea, see the skirt of thy robe in my hand; for in that I cut off the skirt of thy robe, and killed thee not, know thou and see that there is neither evil nor transgression in my hand, and I have not sinned against thee, though thou huntest after my life to take it.";
yng[11] = "`And, my father, see, yea see the skirt of thine upper robe in my hand; for by cutting off the skirt of thy upper robe, and I have not slain thee, know and see that there is not in my hand evil and transgression, and I have not sinned against thee, and thou art hunting my soul to take it!";
dby[11] = "And see, my father, yes, see the skirt of thy robe in my hand. For in that I cut off the skirt of thy robe, and killed thee not, know and see that there is neither evil nor transgression in my hand, and I have not sinned against thee; yet thou liest in wait for my life to take it.";
web[11] = "Moreover, my father, see, yes, see the skirt of thy robe in my hand: for in that I cut off the skirt of thy robe, and killed thee not, know thou and see that [there is] neither evil nor transgression in my hand, and I have not sinned against thee; yet thou huntest my soul to take it.";
hnv[11] = "Moreover, my father, behold, yes, see the skirt of your robe in my hand; for in that I cut off the skirt of your robe, and didn\'t kill you, know you and see that there is neither evil nor disobedience in my hand, and I have not sinned against you, though you hunt after my life to take it.";
vul[11] = "[Vulgate 24:12] quin potius pater mi vide et cognosce oram clamydis tuae in manu mea quoniam cum praeciderem summitatem clamydis tuae nolui extendere manum meam in te animadverte et vide quoniam non est in manu mea malum neque iniquitas neque peccavi in te tu autem insidiaris animae meae ut auferas eam";
kjv[12] = "The LORD judge between me and thee, and the LORD avenge me of thee: but mine hand shall not be upon thee.";
rsv[12] = "May the LORD judge between me and you, may the LORD avenge me upon you; but my hand shall not be against you.";
asv[12] = "Jehovah judge between me and thee, and Jehovah avenge me of thee; but my hand shall not be upon thee.";
yng[12] = "`Jehovah doth judge between me and thee, and Jehovah hath avenged me of thee, and my hand is not on thee;";
dby[12] = "Jehovah judge between me and thee, and Jehovah avenge me of thee; but my hand shall not be upon thee.";

hnv[12] = "The LORD judge between me and you, and the LORD avenge me of you; but my hand shall not be on you.";
vul[12] = "[Vulgate 24:13] iudicet Dominus inter me et te et ulciscatur me Dominus ex te manus autem mea non sit in te";

rsv[13] = "As the proverb of the ancients says, \'Out of the wicked comes forth wickedness\'; but my hand shall not be against you.";
asv[13] = "As saith the proverb of the ancients, Out of the wicked cometh forth wickedness; but my hand shall not be upon thee.";
yng[13] = "as saith the simile of the ancients, From the wicked goeth out wickedness, and my hand is not on thee.";

hnv[13] = "As says the proverb of the ancients, Out of the wicked comes forth wickedness; but my hand shall not be on you.";
vul[13] = "[Vulgate 24:14] sicut et in proverbio antiquo dicitur ab impiis egredietur impietas manus ergo mea non sit in te";
kjv[14] = "After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a flea.";
rsv[14] = "After whom has the king of Israel come out? After whom do you pursue? After a dead dog! After a flea!";
asv[14] = "After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a flea.";
yng[14] = "`After whom hath the king of Israel come out? after whom art thou pursuing? -- after a dead dog! after one flea!";
dby[14] = "After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a single flea.";
web[14] = "After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a flea?";
hnv[14] = " After whom is the king of Yisra\'el come out? after whom do you pursue? after a dead dog, after a flea.";

kjv[15] = "The LORD therefore be judge, and judge between me and thee, and see, and plead my cause, and deliver me out of thine hand.";
rsv[15] = "May the LORD therefore be judge, and give sentence between me and you, and see to it, and plead my cause, and deliver me from your hand.&quot;";
asv[15] = "Jehovah therefore be judge, and give sentence between me and thee, and see, and plead my cause, and deliver me out of thy hand.";

kjv[16] = "And it came to pass, when David had made an end of speaking these words unto Saul, that Saul said, [Is] this thy voice, my son David? And Saul lifted up his voice, and wept.";
rsv[16] = "When David had finished speaking these words to Saul, Saul said, &quot;Is this your voice, my son David?&quot; And Saul lifted up his voice and wept.";
asv[16] = "And it came to pass, when David had made an end of speaking these words unto Saul, that Saul said, Is this thy voice, my son David? And Saul lifted up his voice, and wept.";
yng[16] = "And it cometh to pass, when David completeth to speak these words unto Saul, that Saul saith, `Is this thy voice, my son David?\' and Saul lifteth up his voice, and weepeth.";
dby[16] = "And as soon as David had ended speaking these words to Saul, Saul said, Is this thy voice, my son David? And Saul lifted up his voice and wept.";

hnv[16] = "It came to pass, when David had made an end of speaking these words to Sha\'ul, that Sha\'ul said, Is this your voice, my son David? Sha\'ul lifted up his voice, and wept.";
vul[16] = "[Vulgate 24:17] cum autem conplesset David loquens sermones huiuscemodi ad Saul dixit Saul numquid vox haec tua est fili mi David et levavit Saul vocem suam et flevit";
kjv[17] = "And he said to David, Thou [art] more righteous than I: for thou hast rewarded me good, whereas I have rewarded thee evil.";
rsv[17] = "He said to David, &quot;You are more righteous than I; for you have repaid me good, whereas I have repaid you evil.";
