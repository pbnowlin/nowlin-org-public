csb[1] = "When the ark of the LORD had been in Philistine territory for seven months,&quot;"
csb[2] = "the Philistines summoned the priests and the diviners and pleaded, &quot;What should we do with the ark of the LORD? Tell us how we can send it back to its place.&quot;"
csb[3] = "They replied, &quot;If you send the ark of Israel\'s God away, do not send it without an offering. Send back a guilt offering to him, and you will be healed. Then the reason his hand hasn\'t been removed from you will be revealed.&quot;"
csb[4] = "They asked, &quot;What guilt offering should we send back to him? &quot; And they answered, &quot;Five gold tumors and five gold mice corresponding to the number of Philistine rulers, since there was one plague for both you and your rulers.&quot;"
csb[5] = "&quot;Make images of your tumors and of your mice that are destroying the land. Give glory to Israel\'s God, and perhaps he will stop oppressing you, your gods, and your land.&quot;"
csb[6] = "&quot;Why harden your hearts as the Egyptians and Pharaoh hardened theirs? When he afflicted them, didn\'t they send Israel away, and Israel left?&quot;"
csb[7] = "&quot;Now then, prepare one new cart and two milk cows that have never been yoked. Hitch the cows to the cart, but take their calves away and pen them up.&quot;"
csb[8] = "&quot;Take the ark of the LORD, place it on the cart, and put the gold objects that you\'re sending him as a guilt offering in a box beside the ark. Send it off and let it go its way.&quot;"
csb[9] = "&quot;Then watch: If it goes up the road to its homeland toward Beth-shemesh, it is the LORD who has made this terrible trouble for us. However, if it doesn\'t, we will know that it was not his hand that punished us -- it was just something that happened to us by chance.&quot;"
csb[10] = "The men did this: They took two milk cows, hitched them to the cart, and confined their calves in the pen.&quot;"
csb[11] = "Then they put the ark of the LORD on the cart, along with the box containing the gold mice and the images of their tumors.&quot;"
csb[12] = "The cows went straight up the road to Beth-shemesh. They stayed on that one highway, lowing as they went; they never strayed to the right or to the left. The Philistine rulers were walking behind them to the territory of Beth-shemesh.&quot;"
csb[13] = "The people of Beth-shemesh were harvesting wheat in the valley, and when they looked up and saw the ark, they were overjoyed to see it.&quot;"
csb[14] = "The cart came to the field of Joshua of Beth-shemesh and stopped there near a large rock. The people of the city chopped up the cart and offered the cows as a burnt offering to the LORD.&quot;"
csb[15] = "The Levites removed the ark of the LORD, along with the box containing the gold objects, and placed them on the large rock. That day the people of Beth-shemesh offered burnt offerings and made sacrifices to the LORD.&quot;"
csb[16] = "When the five Philistine rulers observed this, they returned to Ekron that same day.&quot;"
csb[17] = "As a guilt offering to the LORD, the Philistines had sent back one gold tumor for each city: Ashdod, Gaza, Ashkelon, Gath, and Ekron.&quot;"
csb[18] = "The number of gold mice also corresponded to the number of Philistine cities of the five rulers, the fortified cities and the outlying villages. The large rock on which the ark of the LORD was placed is still in the field of Joshua of Beth-shemesh today.&quot;"
csb[19] = "God struck down the people of Beth-shemesh because they looked inside the ark of the LORD. He struck down seventy persons. The people mourned because the LORD struck them with a great slaughter.&quot;"
csb[20] = "The people of Beth-shemesh asked, &quot;Who is able to stand in the presence of the LORD this holy God? To whom should the ark go from here? &quot;"
csb[21] = "They sent messengers to the residents of Kiriath-jearim, saying, &quot;The Philistines have returned the ark of the LORD. Come down and get it.&quot;"

vul[15] = "Levitae autem deposuerunt arcam Dei et capsellam quae erat iuxta eam in qua erant vasa aurea et posuerunt super lapidem grandem viri autem bethsamitae obtulerunt holocausta et immolaverunt victimas in die illa Domino";

asv[16] = "And when the five lords of the Philistines had seen it, they returned to Ekron the same day.";

vul[16] = "et quinque satrapae Philisthinorum viderunt et reversi sunt in Accaron in die illa";
kjv[17] = "And these [are] the golden emerods which the Philistines returned [for] a trespass offering unto the LORD; for Ashdod one, for Gaza one, for Askelon one, for Gath one, for Ekron one;";

asv[17] = "And these are the golden tumors which the Philistines returned for a trespass-offering unto Jehovah: for Ashdod one, for Gaza one, for Ashkelon one, for Gath one, for Ekron one;";
yng[17] = "And these [are] the golden emerods which the Philistines have sent back -- a guilt-offering to Jehovah: for Ashdod one, for Gaza one, for Ashkelon one, for Gath one, for Ekron one;";

kjv[18] = "And the golden mice, [according to] the number of all the cities of the Philistines [belonging] to the five lords, [both] of fenced cities, and of country villages, even unto the great [stone of] Abel, whereon they set down the ark of the LORD: [which stone remaineth] unto this day in the field of Joshua, the Bethshemite.";
rsv[18] = "also the golden mice, according to the number of all the cities of the Philistines belonging to the five lords, both fortified cities and unwalled villages. The great stone, beside which they set down the ark of the LORD, is a witness to this day in the field of Joshua of Beth-she\'mesh.";
asv[18] = "and the golden mice, according to the number of all the cities of the Philistines belonging to the five lords, both of fortified cities and of country villages, even unto the great stone, whereon they set down the ark of Jehovah, [which stone remaineth] unto this day in the field of Joshua the Beth-shemite.";
yng[18] = "and the golden mice -- the number of all the cities of the Philistines -- for the five princes, from the fenced city even unto the hamlet of the villages, even unto the great meadow on which they placed the ark of Jehovah -- [are] unto this day in the field of Joshua the Beth-Shemeshite.";
dby[18] = "and the golden mice, [according to] the number of all the cities of the Philistines belonging to the five lords, both fortified cities and villages of the peasantry; [and they brought them] as far as the great [stone of] Abel, whereon they set down the ark of Jehovah, [which] is to this day in the field of Joshua the Beth-shemeshite.";
web[18] = "And the golden mice, [according to] the number of all the cities of the Philistines [belonging] to the five lords, [both] of fortified cities, and of country villages, even to the great [stone of] Abel, on which they set down the ark of the LORD: [which stone remaineth] to this day in the field of Joshua the Beth-shemite.";
hnv[18] = "and the golden mice, according to the number of all the cities of the Pelishtim belonging to the five lords, both of fortified cities and of country villages, even to the great stone, whereon they set down the ark of the LORD, [which stone remains] to this day in the field of Yehoshua the Beth-shemite.";
vul[18] = "et mures aureos secundum numerum urbium Philisthim quinque provinciarum ab urbe murata usque ad villam quae erat absque muro et usque ad Abel magnum super quem posuerunt arcam Domini quae erat usque in illa die in agro Iosue Bethsamitis";
kjv[19] = "And he smote the men of Bethshemesh, because they had looked into the ark of the LORD, even he smote of the people fifty thousand and threescore and ten men: and the people lamented, because the LORD had smitten [many] of the people with a great slaughter.";
rsv[19] = "And he slew some of the men of Beth-she\'mesh, because they looked into the ark of the LORD; he slew seventy men of them, and the people mourned because the LORD had made a great slaughter among the people.";
asv[19] = "And he smote of the men of Beth-shemesh, because they had looked into the ark of Jehovah, he smote of the people seventy men, [and] fifty thousand men; and the people mourned, because Jehovah had smitten the people with a great slaughter.";
yng[19] = "And He smiteth among the men of Beth-Shemesh, for they looked into the ark of Jehovah, yea, He smiteth among the people seventy men -- fifty chief men; and the people mourn, because Jehovah smote among the people -- a great smiting.";
dby[19] = "And he smote among the men of Beth-shemesh, because they had looked into the ark of Jehovah, and smote of the people seventy men; and the people lamented, because Jehovah had smitten the people with a great slaughter.";
web[19] = "And he smote the men of Beth-shemesh, because they had looked into the ark of the LORD, even he smote of the people fifty thousand and seventy men: and the people lamented, because the LORD had smitten [many] of the people with a great slaughter.";
hnv[19] = "He struck of the men of Beth-shemesh, because they had looked into the teivah of the LORD, he struck of the people fifty thousand seventy men; and the people mourned, because the LORD had struck the people with a great slaughter.";
vul[19] = "percussit autem de viris bethsamitibus eo quod vidissent arcam Domini et percussit de populo septuaginta viros et quinquaginta milia plebis luxitque populus quod percussisset Dominus plebem plaga magna";
kjv[20] = "And the men of Bethshemesh said, Who is able to stand before this holy LORD God? and to whom shall he go up from us?";

asv[20] = "And the men of Beth-shemesh said, Who is able to stand before Jehovah, this holy God? and to whom shall he go up from us?";
yng[20] = "And the men of Beth-Shemesh say, `Who is able to stand before Jehovah, this holy God? and unto whom doth He go up from us?\'";
dby[20] = "And the men of Beth-shemesh said, Who is able to stand before Jehovah, this holy God? and to whom shall he go up from us?";
