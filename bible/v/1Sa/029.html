csb[1] = "The Philistines brought all their military units together at Aphek while Israel was camped by the spring in Jezreel.&quot;"
csb[2] = "As the Philistine leaders were passing in review with their units of hundreds and thousands, David and his men were passing in review behind them with Achish.&quot;"
csb[3] = "Then the Philistine commanders asked, &quot;What are these Hebrews doing here? &quot; Achish answered the Philistine commanders, &quot;That is David, servant of King Saul of Israel. He has been with me a considerable period of time. From the day he defected until today, I\'ve found no fault with him.&quot;"
csb[4] = "The Philistine commanders, however, were enraged with Achish and told him, &quot;Send that man back and let him return to the place you assigned him. He must not go down with us into battle only to become our adversary during the battle. What better way could he ingratiate himself with his master than with the heads of our men?&quot;"
csb[5] = "&quot;Isn\'t this the David they sing about during their dances: Saul has killed his thousands, but David his tens of thousands? &quot;"
csb[6] = "So Achish summoned David and told him, &quot;As the LORD lives, you are an honorable man. I think it is good to have you fighting in this unit with me, because I have found no fault in you from the day you came to me until today. But the leaders don\'t think you are reliable.&quot;"
csb[7] = "&quot;Now go back quietly and you won\'t be doing anything the Philistine leaders think is wrong.&quot;"
csb[8] = "&quot;But what have I done? &quot; David replied to Achish. &quot;From the first day I entered your service until today, what have you found against your servant to keep me from going to fight against the enemies of my lord the king? &quot;"
csb[9] = "Achish answered David, &quot;I\'m convinced that you are as reliable as an angel of God. But the Philistine commanders have said, \'He must not go into battle with us.\'&quot;"
csb[10] = "&quot;So get up early in the morning, you and your masters\' servants who came with you. When you\'ve all gotten up early, go as soon as it\'s light.&quot;"
csb[11] = "So David and his men got up early in the morning to return to the land of the Philistines. And the Philistines went up to Jezreel.&quot;"
kjv[1] = "Now the Philistines gathered together all their armies to Aphek: and the Israelites pitched by a fountain which [is] in Jezreel.";

asv[1] = "Now the Philistines gathered together all their hosts to Aphek: and the Israelites encamped by the fountain which is in Jezreel.";
yng[1] = "And the Philistines gather all their camps to Aphek, and the Israelites are encamping at a fountain which [is] in Jezreel,";
dby[1] = "And the Philistines gathered together all their armies to Aphek; and Israel encamped by the spring that is in Jizreel.";
web[1] = "Now the Philistines collected all their armies to Aphek: and the Israelites encamped by a fountain which [is] in Jezreel.";
hnv[1] = "Now the Pelishtim gathered together all their hosts to Afek: and the Yisra\'elites encamped by the spring which is in Yizre`el.";
vul[1] = "congregata sunt ergo Philisthim universa agmina in Afec sed et Israhel castrametatus est super fontem qui erat in Iezrahel";

yng[2] = "and the princes of the Philistines are passing on by hundreds, and by thousands, and David and his men are passing on in the rear with Achish.";
dby[2] = "And the lords of the Philistines passed on by hundreds and by thousands; and David and his men passed on in the rearward with Achish.";

kjv[3] = "Then said the princes of the Philistines, What [do] these Hebrews [here]? And Achish said unto the princes of the Philistines, [Is] not this David, the servant of Saul the king of Israel, which hath been with me these days, or these years, and I have found no fault in him since he fell [unto me] unto this day?";
rsv[3] = "the commanders of the Philistines said, &quot;What are these Hebrews doing here?&quot; And A\'chish said to the commanders of the Philistines, &quot;Is not this David, the servant of Saul, king of Israel, who has been with me now for days and years, and since he deserted to me I have found no fault in him to this day.&quot;";
asv[3] = "Then said the princes of the Philistines, What [do] these Hebrews [here]? And Achish said unto the princes of the Philistines, Is not this David, the servant of Saul the king of Israel, who hath been with me these days, or [rather] these years, and I have found no fault in him since he fell away [unto me] unto this day?";
yng[3] = "And the heads of the Philistines say, `What [are] these Hebrews?\' and Achish saith unto the heads of the Philistines, `Is not this David servant of Saul king of Israel, who hath been with me these days or these years, and I have not found in him anything [wrong] from the day of his falling away till this day.\'";
dby[3] = "And the princes of the Philistines said, What are these Hebrews? And Achish said to the princes of the Philistines, Is not this David, the servant of Saul the king of Israel, who has been with me these days, or these years, and I have found nothing in him since the day of his falling away [to me] to this day?";
web[3] = "Then said the princes of the Philistines, What [do] these Hebrews [here]? And Achish said to the princes of the Philistines, [Is] not this David, the servant of Saul the king of Israel, who hath been with me these days, or these years, and I have found no fault in him since he fell [to me] to this day?";
hnv[3] = "Then said the princes of the Pelishtim, What [do] these Hebrews [here]? Akhish said to the princes of the Pelishtim, Isn\'t this David, the servant of Sha\'ul the king of Yisra\'el, who has been with me these days, or [rather] these years, and I have found no fault in him since he fell away [to me] to this day?";
vul[3] = "dixeruntque principes Philisthim quid sibi volunt Hebraei isti et ait Achis ad principes Philisthim num ignoratis David qui fuit servus Saul regis Israhel et est apud me multis diebus vel annis et non inveni in eo quicquam ex die qua transfugit ad me usque ad diem hanc";
kjv[4] = "And the princes of the Philistines were wroth with him; and the princes of the Philistines said unto him, Make this fellow return, that he may go again to his place which thou hast appointed him, and let him not go down with us to battle, lest in the battle he be an adversary to us: for wherewith should he reconcile himself unto his master? [should it] not [be] with the heads of these men?";
rsv[4] = "But the commanders of the Philistines were angry with him; and the commanders of the Philistines said to him, &quot;Send the man back, that he may return to the place to which you have assigned him; he shall not go down with us to battle, lest in the battle he become an adversary to us. For how could this fellow reconcile himself to his lord? Would it not be with the heads of the men here?";
asv[4] = "But the princes of the Philistines were wroth with him; and the princes of the Philistines said unto him, Make the man return, that he may go back to his place where thou hast appointed him, and let him not go down with us to battle, lest in the battle he become an adversary to us: for wherewith should this [fellow] reconcile himself unto his lord? should it not be with the heads of these men?";
yng[4] = "And the heads of the Philistines are wroth against him, and the heads of the Philistines say to him, `Send back the man, and he doth turn back unto his place whither thou hast appointed him, and doth not go down with us into battle, and is not to us for an adversary in battle; and wherewith doth this one reconcile himself unto his lord -- is it not with the heads of those men?\'";
dby[4] = "But the princes of the Philistines were wroth with him; and the princes of the Philistines said to him, Make the man return, that he may go again to his place where thou hast appointed him, that he go not down with us to the battle, that in the battle he be not an adversary to us; for wherewith should this [fellow] reconcile himself to his master? should it not be with the heads of these men?";
web[4] = "And the princes of the Philistines were wroth with him; and the princes of the Philistines said to him, Make this man return, that he may go again to his place which thou hast appointed him, and let him not go down with us to battle, lest in the battle he should be an adversary to us: for with what would he reconcile himself to his master? [would it] not [be] with the heads of these men?";
hnv[4] = "But the princes of the Pelishtim were angry with him; and the princes of the Pelishtim said to him, Make the man return, that he may go back to his place where you have appointed him, and let him not go down with us to battle, lest in the battle he become an adversary to us: for with what should this [fellow] reconcile himself to his lord? should it not be with the heads of these men?";
vul[4] = "irati sunt autem adversus eum principes Philisthim et dixerunt ei revertatur vir et sedeat in loco suo in quo constituisti eum et non descendat nobiscum in proelium ne fiat nobis adversarius cum proeliari coeperimus quomodo enim aliter placare poterit dominum suum nisi in capitibus nostris";
kjv[5] = "[Is] not this David, of whom they sang one to another in dances, saying, Saul slew his thousands, and David his ten thousands?";
rsv[5] = "Is not this David, of whom they sing to one another in dances, \'Saul has slain his thousands, and David his ten thousands\'?&quot;";
asv[5] = "Is not this David, of whom they sang one to another in dances, saying, Saul hath slain his thousands, And David his ten thousands? ";
yng[5] = "Is not this David, of whom they answer in choruses, saying, Saul hath smitten among his thousands, and David among his myriads?\'";

kjv[6] = "Then Achish called David, and said unto him, Surely, [as] the LORD liveth, thou hast been upright, and thy going out and thy coming in with me in the host [is] good in my sight: for I have not found evil in thee since the day of thy coming unto me unto this day: nevertheless the lords favour thee not.";
rsv[6] = "Then A\'chish called David and said to him, &quot;As the LORD lives, you have been honest, and to me it seems right that you should march out and in with me in the campaign; for I have found nothing wrong in you from the day of your coming to me to this day. Nevertheless the lords do not approve of you.";
asv[6] = "Then Achish called David, and said unto him, As Jehovah liveth, thou hast been upright, and thy going out and thy coming in with me in the host is good in my sight; for I have not found evil in thee since the day of thy coming unto me unto this day: nevertheless the lords favor thee not.";
yng[6] = "And Achish calleth unto David, and saith unto him, `Jehovah liveth, surely thou [art] upright, and good in mine eyes is thy going out, and thy coming in, with me in the camp, for I have not found in thee evil from the day of thy coming in unto me till this day; and in the eyes of the princes thou art not good;";
dby[6] = "And Achish called David, and said to him, [As] Jehovah liveth, thou art upright, and thy going out and thy coming in with me in the camp is acceptable to me; for I have not found evil in thee since the day of thy coming to me to this day; but thou art not acceptable to the lords.";
web[6] = "Then Achish called David, and said to him, Surely, [as] the LORD liveth, thou hast been upright, and thy going out and thy coming in with me in the host [is] good in my sight: for I have not found evil in thee from the day of thy coming to me to this day: nevertheless the lords favor thee not.";
hnv[6] = "Then Akhish called David, and said to him, As the LORD lives, you have been upright, and your going out and your coming in with me in the host is good in my sight; for I have not found evil in you since the day of your coming to me to this day: nevertheless the lords don\'t favor you.";
vul[6] = "vocavit ergo Achis David et ait ei vivit Dominus quia rectus es tu et bonus in conspectu meo et exitus tuus et introitus tuus mecum est in castris et non inveni in te quicquam mali ex die qua venisti ad me usque ad diem hanc sed satrapis non places";
