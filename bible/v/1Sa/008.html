csb[1] = "When Samuel grew old, he appointed his sons as judges over Israel.&quot;"
csb[2] = "His firstborn son\'s name was Joel and his second was Abijah. They were judges in Beer-sheba.&quot;"
csb[3] = "However, his sons did not walk in his ways -- they turned toward dishonest profit, took bribes, and perverted justice.&quot;"
csb[4] = "So all the elders of Israel gathered together and went to Samuel at Ramah.&quot;"
csb[5] = "They said to him, &quot;Look, you are old, and your sons do not walk in your ways. Therefore, appoint a king to judge us the same as all the other nations have.&quot;"
csb[6] = "When they said, &quot;Give us a king to judge us,&quot; Samuel considered their demand wrong, so he prayed to the LORD.&quot;"
csb[7] = "But the LORD told him, &quot;Listen to the people and everything they say to you. They have not rejected you; they have rejected me as their king.&quot;"
csb[8] = "&quot;They are doing the same thing to you that they have done to me, since the day I brought them out of Egypt until this day, abandoning me and worshiping other gods.&quot;"
csb[9] = "&quot;Listen to them, but solemnly warn them and tell them about the customary rights of the king who will reign over them.&quot;"
csb[10] = "Samuel told all the LORD\'s words to the people who were asking him for a king.&quot;"
csb[11] = "He said, &quot;These are the rights of the king who will reign over you: He will take your sons and put them to his use in his chariots, on his horses, or running in front of his chariots.&quot;"
csb[12] = "&quot;He can appoint them for his use as commanders of thousands or commanders of fifties, to plow his ground and reap his harvest, or to make his weapons of war and the equipment for his chariots.&quot;"
csb[13] = "&quot;He can take your daughters to become perfumers, cooks, and bakers.&quot;"
csb[14] = "&quot;He can take your best fields, vineyards, and olive orchards and give them to his servants.&quot;"
csb[15] = "&quot;He can take a tenth of your grain and your vineyards and give them to his officials and servants.&quot;"
csb[16] = "&quot;He can take your male servants, your female servants, your best young men, and your donkeys and use them for his work.&quot;"
csb[17] = "&quot;He can take a tenth of your flocks, and you yourselves can become his servants.&quot;"
csb[18] = "&quot;When that day comes, you will cry out because of the king you\'ve chosen for yourselves, but the LORD won\'t answer you on that day.&quot;"
csb[19] = "The people refused to listen to Samuel. &quot;No! &quot; they said. &quot;We must have a king over us.&quot;"
csb[20] = "&quot;Then we\'ll be like all the other nations: our king will judge us, go out before us, and fight our battles.&quot;"
csb[21] = "Samuel listened to all the people\'s words and then repeated them to the LORD.&quot;"
csb[22] = "&quot;Listen to them,&quot; the LORD told Samuel. &quot;Appoint a king for them.&quot; Then Samuel told the men of Israel, &quot;Each of you, go back to your city.&quot;"
