csb[1] = "There was a man from Ramathaim-zophim in the hill country of Ephraim. His name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.&quot;"
csb[2] = "He had two wives, the first named Hannah and the second Peninnah. Peninnah had children, but Hannah was childless.&quot;"
csb[3] = "This man would go up from his town every year to worship and to sacrifice to the LORD of Armies at Shiloh, where Eli\'s two sons, Hophni and Phinehas, were the LORD\'s priests.&quot;"
csb[4] = "Whenever Elkanah offered a sacrifice, he always gave portions of the meat to his wife Peninnah and to each of her sons and daughters.&quot;"
csb[5] = "But he gave a double portion to Hannah, for he loved her even though the LORD had kept her from conceiving.&quot;"
csb[6] = "Her rival would taunt her severely just to provoke her, because the LORD had kept Hannah from conceiving.&quot;"
csb[7] = "Year after year, when she went up to the LORD\'s house, her rival taunted her in this way. Hannah would weep and would not eat.&quot;"
csb[8] = "&quot;Hannah, why are you crying? &quot; her husband Elkanah would ask. &quot;Why won\'t you eat? Why are you troubled? Am I not better to you than ten sons? &quot;"
csb[9] = "On one occasion, Hannah got up after they ate and drank at Shiloh. The priest Eli was sitting on a chair by the doorpost of the LORD\'s temple.&quot;"
csb[10] = "Deeply hurt, Hannah prayed to the LORD and wept with many tears.&quot;"
csb[11] = "Making a vow, she pleaded, &quot;LORD of Armies, if you will take notice of your servant\'s affliction, remember and not forget me, and give your servant a son, I will give him to the LORD all the days of his life, and his hair will never be cut.&quot;"
csb[12] = "While she continued praying in the LORD\'s presence, Eli watched her mouth.&quot;"
csb[13] = "Hannah was praying silently, and though her lips were moving, her voice could not be heard. Eli thought she was drunk&quot;"
csb[14] = "and said to her, &quot;How long are you going to be drunk? Get rid of your wine! &quot;"
csb[15] = "&quot;No, my lord,&quot; Hannah replied. &quot;I am a woman with a broken heart. I haven\'t had any wine or beer; I\'ve been pouring out my heart before the LORD.&quot;"
csb[16] = "&quot;Don\'t think of me as a wicked woman; I\'ve been praying from the depth of my anguish and resentment.&quot;"
csb[17] = "Eli responded, &quot;Go in peace, and may the God of Israel grant the request you\'ve made of him.&quot;"
csb[18] = "&quot;May your servant find favor with you,&quot; she replied. Then Hannah went on her way; she ate and no longer looked despondent.&quot;"
csb[19] = "The next morning Elkanah and Hannah got up early to worship before the LORD. Afterward, they returned home to Ramah. Then Elkanah was intimate with his wife Hannah, and the LORD remembered her.&quot;"
csb[20] = "After some time, Hannah conceived and gave birth to a son. She named him Samuel, because she said, &quot;I requested him from the LORD.&quot;"
csb[21] = "When Elkanah and all his household went up to make the annual sacrifice and his vow offering to the LORD,&quot;"
csb[22] = "Hannah did not go and explained to her husband, &quot;After the child is weaned, I\'ll take him to appear in the LORD\'s presence and to stay there permanently.&quot;"
csb[23] = "Her husband Elkanah replied, &quot;Do what you think is best, and stay here until you\'ve weaned him. May the LORD confirm your word.&quot; So Hannah stayed there and nursed her son until she weaned him.&quot;"
csb[24] = "When she had weaned him, she took him with her to Shiloh, as well as a three-year-old bull, half a bushel of flour, and a clay jar of wine. Though the boy was still young, she took him to the LORD\'s house at Shiloh.&quot;"
csb[25] = "Then they slaughtered the bull and brought the boy to Eli.&quot;"
csb[26] = "&quot;Please, my lord,&quot; she said, &quot;as surely as you live, my lord, I am the woman who stood here beside you praying to the LORD.&quot;"
csb[27] = "&quot;I prayed for this boy, and since the LORD gave me what I asked him for,&quot;"
csb[28] = "&quot;I now give the boy to the LORD. For as long as he lives, he is given to the LORD.&quot; Then he worshiped the LORD there.&quot;"
