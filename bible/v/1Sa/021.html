csb[1] = "David went to the priest Ahimelech at Nob. Ahimelech was afraid to meet David, so he said to him, &quot;Why are you alone and no one is with you? &quot;"
csb[2] = "David answered the priest Ahimelech, &quot;The king gave me a mission, but he told me, \'Don\'t let anyone know anything about the mission I\'m sending you on or what I have ordered you to do.\' I have stationed my young men at a certain place.&quot;"
csb[3] = "&quot;Now what do you have on hand? Give me five loaves of bread or whatever can be found.&quot;"
csb[4] = "The priest told him, &quot;There is no ordinary bread on hand. However, there is consecrated bread, but the young men may eat it only if they have kept themselves from women.&quot;"
csb[5] = "David answered him, &quot;I swear that women are being kept from us, as always when I go out to battle. The young men\'s bodies are consecrated even on an ordinary mission, so of course their bodies are consecrated today.&quot;"
csb[6] = "So the priest gave him the consecrated bread, for there was no bread there except the Bread of the Presence that had been removed from the presence of the LORD. When the bread was removed, it had been replaced with warm bread.&quot;"
csb[7] = "One of Saul\'s servants, detained before the LORD, was there that day. His name was Doeg the Edomite, chief of Saul\'s shepherds.&quot;"
csb[8] = "David said to Ahimelech, &quot;Do you have a spear or sword on hand? I didn\'t even bring my sword or my weapons since the king\'s mission was urgent.&quot;"
csb[9] = "The priest replied, &quot;The sword of Goliath the Philistine, whom you killed in the Valley of Elah, is here, wrapped in a cloth behind the ephod. If you want to take it for yourself, then take it, for there isn\'t another one here.&quot; &quot;There\'s none like it! &quot; David said. &quot;Give it to me.&quot;"
csb[10] = "David fled that day from Saul\'s presence and went to King Achish of Gath.&quot;"
csb[11] = "But Achish\'s servants said to him, &quot;Isn\'t this David, the king of the land? Don\'t they sing about him during their dances: Saul has killed his thousands, but David his tens of thousands? &quot;"
csb[12] = "David took this to heart and became very afraid of King Achish of Gath,&quot;"
csb[13] = "so he pretended to be insane in their presence. He acted like a madman around them, scribbling on the doors of the city gate and letting saliva run down his beard.&quot;"
csb[14] = "&quot;Look! You can see the man is crazy,&quot; Achish said to his servants. &quot;Why did you bring him to me?&quot;"
csb[15] = "&quot;Do I have such a shortage of crazy people that you brought this one to act crazy around me? Is this one going to come into my house? &quot;"
kjv[1] = "Then came David to Nob to Ahimelech the priest: and Ahimelech was afraid at the meeting of David, and said unto him, Why [art] thou alone, and no man with thee?";

kjv[2] = "And David said unto Ahimelech the priest, The king hath commanded me a business, and hath said unto me, Let no man know any thing of the business whereabout I send thee, and what I have commanded thee: and I have appointed [my] servants to such and such a place.";
rsv[2] = "And David said to Ahim\'elech the priest, &quot;The king has charged me with a matter, and said to me, \'Let no one know anything of the matter about which I send you, and with which I have charged you.\' I have made an appointment with the young men for such and such a place.";
asv[2] = "And David said unto Ahimelech the priest, The king hath commanded me a business, and hath said unto me, Let no man know anything of the business whereabout I send thee, and what I have commanded thee: and I have appointed the young men to such and such a place.";
yng[2] = "And David saith to Ahimelech the priest, `The king hath commanded me a matter, and he saith unto me, Let no man know anything of the matter about which I am sending thee, and which I have commanded thee; and the young men I have caused to know at such and such a place;";

kjv[5] = "And David answered the priest, and said unto him, Of a truth women [have been] kept from us about these three days, since I came out, and the vessels of the young men are holy, and [the bread is] in a manner common, yea, though it were sanctified this day in the vessel.";
rsv[5] = "And David answered the priest, &quot;Of a truth women have been kept from us as always when I go on an expedition; the vessels of the young men are holy, even when it is a common journey; how much more today will their vessels be holy?&quot;";
asv[5] = "And David answered the priest, and said unto him, Of a truth women have been kept from us about these three days; when I came out, the vessels of the young men were holy, though it was but a common journey; how much more then to-day shall their vessels be holy?";
yng[5] = "And David answereth the priest, and saith to him, `Surely, if women have been restrained from us as heretofore in my going out, then the vessels of the young men are holy, and it [is] a common way: and also, surely to-day it is sanctified in the vessel.\'";
dby[5] = "And David answered the priest and said to him, Yes indeed, women have been kept from us about these three days, since I came out, and the vessels of the young men are holy, and the [bread] is in a manner common, and the more so, because to-day [new] is hallowed in the vessels.";
