csb[1] = "At that time, the Philistines gathered their military units into one army to fight against Israel. So Achish said to David, &quot;You know, of course, that you and your men must march out in the army with me.&quot;"
csb[2] = "David replied to Achish, &quot;Good, you will find out what your servant can do.&quot; So Achish said to David, &quot;Very well, I will appoint you as my permanent bodyguard.&quot;"
csb[3] = "By this time Samuel had died, all Israel had mourned for him and buried him in Ramah, his city, and Saul had removed the mediums and spiritists from the land.&quot;"
csb[4] = "The Philistines gathered and camped at Shunem. So Saul gathered all Israel, and they camped at Gilboa.&quot;"
csb[5] = "When Saul saw the Philistine camp, he was afraid and his heart pounded.&quot;"
csb[6] = "He inquired of the LORD, but the LORD did not answer him in dreams or by the Urim or by the prophets.&quot;"
csb[7] = "Saul then said to his servants, &quot;Find me a woman who is a medium, so I can go and consult her.&quot; His servants replied, &quot;There is a woman at En-dor who is a medium.&quot;"
csb[8] = "Saul disguised himself by putting on different clothes and set out with two of his men. They came to the woman at night, and Saul said, &quot;Consult a spirit for me. Bring up for me the one I tell you.&quot;"
csb[9] = "But the woman said to him, &quot;You surely know what Saul has done, how he has cut off the mediums and spiritists from the land. Why are you setting a trap for me to get me killed? &quot;"
csb[10] = "Then Saul swore to her by the LORD: &quot;As surely as the LORD lives, no punishment will come to you from this.&quot;"
csb[11] = "&quot;Who is it that you want me to bring up for you? &quot; the woman asked. &quot;Bring up Samuel for me,&quot; he answered.&quot;"
csb[12] = "When the woman saw Samuel, she screamed, and then she asked Saul, &quot;Why did you deceive me? You are Saul! &quot;"
csb[13] = "But the king said to her, &quot;Don\'t be afraid. What do you see? &quot; &quot;I see a spirit form coming up out of the earth,&quot; the woman answered.&quot;"
csb[14] = "Then Saul asked her, &quot;What does he look like? &quot; &quot;An old man is coming up,&quot; she replied. &quot;He\'s wearing a robe.&quot; Then Saul knew that it was Samuel, and he knelt low with his face to the ground and paid homage.&quot;"
csb[15] = "&quot;Why have you disturbed me by bringing me up? &quot; Samuel asked Saul. &quot;I\'m in serious trouble,&quot; replied Saul. &quot;The Philistines are fighting against me and God has turned away from me. He doesn\'t answer me anymore, either through the prophets or in dreams. So I\'ve called on you to tell me what I should do.&quot;"
csb[16] = "Samuel answered, &quot;Since the LORD has turned away from you and has become your enemy, why are you asking me?&quot;"
csb[17] = "&quot;The LORD has done exactly what he said through me: The LORD has torn the kingship out of your hand and given it to your neighbor David.&quot;"
csb[18] = "&quot;You did not obey the LORD and did not carry out his burning anger against Amalek; therefore the LORD has done this to you today.&quot;"
csb[19] = "&quot;The LORD will also hand Israel over to the Philistines along with you. Tomorrow you and your sons will be with me, and the LORD will hand Israel\'s army over to the Philistines.&quot;"
csb[20] = "Immediately, Saul fell flat on the ground. He was terrified by Samuel\'s words and was also weak because he had not eaten anything all day and all night.&quot;"
csb[21] = "The woman came over to Saul, and she saw that he was terrified and said to him, &quot;Look, your servant has obeyed you. I took my life in my hands and did what you told me to do.&quot;"
csb[22] = "&quot;Now please listen to your servant. Let me set some food in front of you. Eat and it will give you strength so you can go on your way.&quot;"
csb[23] = "He refused, saying, &quot;I won\'t eat,&quot; but when his servants and the woman urged him, he listened to them. He got up off the ground and sat on the bed.&quot;"
csb[24] = "The woman had a fattened calf at her house, and she quickly slaughtered it. She also took flour, kneaded it, and baked unleavened bread.&quot;"
csb[25] = "She served it to Saul and his servants, and they ate. Afterward, they got up and left that night.&quot;"
kjv[1] = "And it came to pass in those days, that the Philistines gathered their armies together for warfare, to fight with Israel. And Achish said unto David, Know thou assuredly, that thou shalt go out with me to battle, thou and thy men.";
rsv[1] = "In those days the Philistines gathered their forces for war, to fight against Israel. And A\'chish said to David, &quot;Understand that you and your men are to go out with me in the army.&quot;";
asv[1] = "And it came to pass in those days, that the Philistines gathered their hosts together for warfare, to fight with Israel. And Achish said unto David, Know thou assuredly, that thou shalt go out with me in the host, thou and thy men.";
yng[1] = "And it cometh to pass in those days, that the Philistines gather their camps for the war, to fight against Israel, and Achish saith unto David, `Thou dost certainly know that with me thou dost go out into the camp, thou and thy men.\'";
dby[1] = "And it came to pass in those days that the Philistines gathered together their armies for warfare to fight against Israel. And Achish said to David, Know thou assuredly that thou shalt go out with me to the camp, thou and thy men.";
web[1] = "And it came to pass in those days, that the Philistines collected their armies for warfare, to fight with Israel. And Achish said to David, Know thou assuredly, that thou shalt go out with me to battle, thou and thy men.";
hnv[1] = "It happened in those days, that the Pelishtim gathered their hosts together for warfare, to fight with Yisra\'el. Akhish said to David, Know you assuredly, that you shall go out with me in the host, you and your men.";
vul[1] = "factum est autem in diebus illis congregaverunt Philisthim agmina sua ut praepararentur ad bellum contra Israhel dixitque Achis ad David sciens nunc scito quoniam mecum egredieris in castris tu et viri tui";
kjv[2] = "And David said to Achish, Surely thou shalt know what thy servant can do. And Achish said to David, Therefore will I make thee keeper of mine head for ever.";
rsv[2] = "David said to A\'chish, &quot;Very well, you shall know what your servant can do.&quot; And A\'chish said to David, &quot;Very well, I will make you my bodyguard for life.&quot;";
asv[2] = "And David said to Achish, Therefore thou shalt know what thy servant will do. And Achish said to David, Therefore will I make thee keeper of my head for ever.";
yng[2] = "And David saith unto Achish, `Therefore -- thou dost know that which thy servant dost do.\' And Achish saith unto David, `Therefore -- keeper of my head I do appoint thee all the days.\'";
dby[2] = "And David said to Achish, Thereby thou shalt know what thy servant can do. And Achish said to David, Therefore will I make thee keeper of my person for ever.";
web[2] = "And David said to Achish, Surely thou shalt know what thy servant can do. And Achish said to David, Therefore will I make thee keeper of my head for ever.";
hnv[2] = "David said to Akhish, Therefore you shall know what your servant will do. Akhish said to David, Therefore will I make you keeper of my head for ever.";
vul[2] = "dixitque David ad Achis nunc scies quae facturus est servus tuus et ait Achis ad David et ego custodem capitis mei ponam te cunctis diebus";

asv[3] = "Now Samuel was dead, and all Israel had lamented him, and buried him in Ramah, even in his own city. And Saul had put away those that had familiar spirits, and the wizards, out of the land.";

kjv[7] = "Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and enquire of her. And his servants said to him, Behold, [there is] a woman that hath a familiar spirit at Endor.";
rsv[7] = "Then Saul said to his servants, &quot;Seek out for me a woman who is a medium, that I may go to her and inquire of her.&quot; And his servants said to him, &quot;Behold, there is a medium at Endor.&quot;";
asv[7] = "Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and inquire of her. And his servants said to him, Behold, there is a woman that hath a familiar spirit at En-dor.";
yng[7] = "And Saul saith to his servants, `Seek for me a woman possessing a familiar spirit, and I go unto her, and inquire of her;\' and his servants say unto him, `Lo, a woman possessing a familiar spirit in En-dor.\'";
dby[7] = "Then said Saul to his servants, Seek me a woman that has a spirit of Python, that I may go to her and inquire of her. And his servants said to him, Behold, there is a woman who has a spirit of Python at En-dor.";
web[7] = "Then said Saul to his servants, seek me a woman that hath a familiar spirit, that I may go to her, and inquire of her. And his servants said to him, Behold, [there is] a woman that hath a familiar spirit at En-dor.";
hnv[7] = " Then said Sha\'ul to his servants, Seek me a woman who has a familiar spirit, that I may go to her, and inquire of her. His servants said to him, Behold, there is a woman who has a familiar spirit at En-dor.";
vul[7] = "dixitque Saul servis suis quaerite mihi mulierem habentem pythonem et vadam ad eam et sciscitabor per illam et dixerunt servi eius ad eum est mulier habens pythonem in Aendor";
kjv[8] = "And Saul disguised himself, and put on other raiment, and he went, and two men with him, and they came to the woman by night: and he said, I pray thee, divine unto me by the familiar spirit, and bring me [him] up, whom I shall name unto thee.";
rsv[8] = "So Saul disguised himself and put on other garments, and went, he and two men with him; and they came to the woman by night. And he said, &quot;Divine for me by a spirit, and bring up for me whomever I shall name to you.&quot;";
asv[8] = "And Saul disguised himself, and put on other raiment, and went, he and two men with him, and they came to the woman by night: and he said, Divine unto me, I pray thee, by the familiar spirit, and bring me up whomsoever I shall name unto thee.";
yng[8] = "And Saul disguiseth himself and putteth on other garments, and goeth, he and two of the men with him, and they come in unto the woman by night, and he saith, `Divine, I pray thee, to me by the familiar spirit, and cause to come up to me him whom I say unto thee.\'";
dby[8] = "And Saul disguised himself, and put on other garments, and he went, and two men with him, and they came to the woman by night; and he said, I pray thee, divine to me by the spirit of Python, and bring me [him] up whom I shall name to thee.";
web[8] = "And Saul disguised himself, and put on other raiment, and he went, and two men with him, and they came to the woman by night: and he said, I pray thee, divine to me by the familiar spirit, and bring up for me whom I shall name to thee.";
hnv[8] = "Sha\'ul disguised himself, and put on other clothing, and went, he and two men with him, and they came to the woman by night: and he said, Please divine to me by the familiar spirit, and bring me up whoever I shall name to you.";
vul[8] = "mutavit ergo habitum suum vestitusque est aliis vestimentis abiit ipse et duo viri cum eo veneruntque ad mulierem nocte et ait divina mihi in pythone et suscita mihi quem dixero tibi";

rsv[14] = "He said to her, &quot;What is his appearance?&quot; And she said, &quot;An old man is coming up; and he is wrapped in a robe.&quot; And Saul knew that it was Samuel, and he bowed with his face to the ground, and did obeisance.";
asv[14] = "And he said unto her, What form is he of? And she said, An old man cometh up; and he is covered with a robe. And Saul perceived that it was Samuel, and he bowed with his face to the ground, and did obeisance.";
yng[14] = "And he saith to her, `What [is] his form?\' and she saith, `An aged man is coming up, and he [is] covered with an upper robe;\' and Saul knoweth that he [is] Samuel, and boweth -- face to thee earth -- and doth obeisance.";
dby[14] = "And he said to her, What is his form? And she said, An old man comes up; and he is covered with a mantle. And Saul knew that it was Samuel, and he stooped with his face to the ground, and bowed himself.";

hnv[14] = "He said to her, What form is he of? She said, An old man comes up; and he is covered with a robe. Sha\'ul perceived that it was Shemu\'el, and he bowed with his face to the ground, and did obeisance.";
vul[14] = "dixitque ei qualis est forma eius quae ait vir senex ascendit et ipse amictus est pallio intellexit Saul quod Samuhel esset et inclinavit se super faciem suam in terra et adoravit";
kjv[15] = "And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul answered, I am sore distressed; for the Philistines make war against me, and God is departed from me, and answereth me no more, neither by prophets, nor by dreams: therefore I have called thee, that thou mayest make known unto me what I shall do.";
rsv[15] = "Then Samuel said to Saul, &quot;Why have you disturbed me by bringing me up?&quot; Saul answered, &quot;I am in great distress; for the Philistines are warring against me, and God has turned away from me and answers me no more, either by prophets or by dreams; therefore I have summoned you to tell me what I shall do.&quot;";
asv[15] = "And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul answered, I am sore distressed; for the Philistines make war against me, and God is departed from me, and answereth me no more, neither by prophets, nor by dreams: therefore I have called thee, that thou mayest make known unto me what I shall do.";
yng[15] = "And Samuel saith unto Saul, `Why hast thou troubled me, to bring me up?\' And Saul saith, `I have great distress, and the Philistines are fighting against me, God hath turned aside from me, and hath not answered me any more, either by the hand of the prophets, or by dreams; and I call for thee to let me know what I do.\'";
dby[15] = "And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul said, I am sore distressed; for the Philistines make war against me, and God is departed from me, and answers me no more, neither by prophets nor by dreams; therefore I have called thee, that thou mayest make known to me what I shall do.";
web[15] = "And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul answered, I am grievously distressed; for the Philistines make war against me, and God hath departed from me, and answereth me no more, neither by prophets, nor by dreams: therefore I have called thee, that thou mayest make known to me what I shall do.";
hnv[15] = "Shemu\'el said to Sha\'ul, Why have you disquieted me, to bring me up? Sha\'ul answered, I am sore distressed; for the Pelishtim make war against me, and God is departed from me, and answers me no more, neither by prophets, nor by dreams: therefore I have called you, that you may make known to me what I shall do.";
vul[15] = "dixit autem Samuhel ad Saul quare inquietasti me ut suscitarer et ait Saul coartor nimis siquidem Philisthim pugnant adversum me et Deus recessit a me et exaudire me noluit neque in manu prophetarum neque per somnia vocavi ergo te ut ostenderes mihi quid faciam";
kjv[16] = "Then said Samuel, Wherefore then dost thou ask of me, seeing the LORD is departed from thee, and is become thine enemy?";
rsv[16] = "And Samuel said, &quot;Why then do you ask me, since the LORD has turned from you and become your enemy?";
asv[16] = "And Samuel said, Wherefore then dost thou ask of me, seeing Jehovah is departed from thee, and is become thine adversary?";
yng[16] = "And Samuel saith, `And why dost thou ask me, and Jehovah hath turned aside from thee, and is thine enemy?";
dby[16] = "And Samuel said, Why then dost thou inquire of me, seeing Jehovah is departed from thee, and is become thine enemy?";
web[16] = "Then said Samuel, Why then dost thou ask of me, seeing the LORD hath departed from thee, and hath become thy enemy?";
hnv[16] = "Shemu\'el said, Why then do you ask of me, seeing the LORD is departed from you, and is become your adversary?";
vul[16] = "et ait Samuhel quid interrogas me cum Dominus recesserit a te et transierit ad aemulum tuum";
kjv[17] = "And the LORD hath done to him, as he spake by me: for the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, [even] to David:";
rsv[17] = "The LORD has done to you as he spoke by me; for the LORD has torn the kingdom out of your hand, and given it to your neighbor, David.";
asv[17] = "And Jehovah hath done unto thee, as he spake by me: and Jehovah hath rent the kingdom out of thy hand, and given it to thy neighbor, even to David.";
yng[17] = "And Jehovah doth for Himself as He hath spoken by my hand, and Jehovah rendeth the kingdom out of thy hand, and giveth it to thy neighbour -- to David.";
dby[17] = "And Jehovah has done for himself as he spoke by me; and Jehovah has rent the kingdom out of thy hand, and given it to thy neighbour, to David.";
web[17] = "And the LORD hath done to him, as he spoke by me: for the LORD hath rent the kingdom out of thy hand, and given it to thy neighbor, [even] to David:";
hnv[17] = "The LORD has done to you, as he spoke by me: and the LORD has torn the kingdom out of your hand, and given it to your neighbor, even to David.";
vul[17] = "faciet enim Dominus tibi sicut locutus est in manu mea et scindet regnum de manu tua et dabit illud proximo tuo David";
kjv[18] = "Because thou obeyedst not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day.";
rsv[18] = "Because you did not obey the voice of the LORD, and did not carry out his fierce wrath against Am\'alek, therefore the LORD has done this thing to you this day.";
asv[18] = "Because thou obeyedst not the voice of Jehovah, and didst not execute his fierce wrath upon Amalek, therefore hath Jehovah done this thing unto thee this day.";
yng[18] = "Because thou hast not hearkened to the voice of Jehovah, nor didst the fierceness of His anger on Amalek -- therefore this thing hath Jehovah done to thee this day;";
dby[18] = "Because thou didst not hearken to the voice of Jehovah, and didst not execute his fierce anger upon Amalek, therefore has Jehovah done this thing to thee this day.";
web[18] = "Because thou didst not obey the voice of the LORD, nor execute his fierce wrath upon Amalek, therefore hath the LORD done this thing to thee this day.";
hnv[18] = " Because you didn\'t obey the voice of the LORD, and didn\'t execute his fierce wrath on `Amalek, therefore has the LORD done this thing to you this day.";
vul[18] = "quia non oboedisti voci Domini neque fecisti iram furoris eius in Amalech idcirco quod pateris fecit tibi Dominus hodie";
kjv[19] = "Moreover the LORD will also deliver Israel with thee into the hand of the Philistines: and to morrow [shalt] thou and thy sons [be] with me: the LORD also shall deliver the host of Israel into the hand of the Philistines.";
rsv[19] = "Moreover the LORD will give Israel also with you into the hand of the Philistines; and tomorrow you and your sons shall be with me; the LORD will give the army of Israel also into the hand of the Philistines.&quot;";
asv[19] = "Moreover Jehovah will deliver Israel also with thee into the hand of the Philistines; and to-morrow shalt thou and thy sons be with me: Jehovah will deliver the host of Israel also into the hand of the Philistines.";
yng[19] = "yea, Jehovah giveth also Israel with thee into the hand of the Philistines, and tomorrow thou and thy sons [are] with me; also the camp of Israel doth Jehovah give into the hand of the Philistines.\'";
dby[19] = "And Jehovah will also give Israel with thee into the hand of the Philistines; and to-morrow shalt thou and thy sons be with me; the army of Israel also will Jehovah give into the hand of the Philistines.";
web[19] = "Moreover, the LORD will also deliver Israel with thee into the hand of the Philistines: and to-morrow [shalt] thou and thy sons [be] with me: the LORD also shall deliver the host of Israel into the hand of the Philistines.";
hnv[19] = "Moreover the LORD will deliver Yisra\'el also with you into the hand of the Pelishtim; and tomorrow shall you and your sons be with me: the LORD will deliver the host of Yisra\'el also into the hand of the Pelishtim.";
vul[19] = "et dabit Dominus etiam Israhel tecum in manu Philisthim cras autem tu et filii tui mecum eritis sed et castra Israhel tradet Dominus in manu Philisthim";
kjv[20] = "Then Saul fell straightway all along on the earth, and was sore afraid, because of the words of Samuel: and there was no strength in him; for he had eaten no bread all the day, nor all the night.";
rsv[20] = "Then Saul fell at once full length upon the ground, filled with fear because of the words of Samuel; and there was no strength in him, for he had eaten nothing all day and all night.";
asv[20] = "Then Saul fell straightway his full length upon the earth, and was sore afraid, because of the words of Samuel: and there was no strength in him; for he had eaten no bread all the day, nor all the night.";
yng[20] = "And Saul hasteth and falleth -- the fulness of his stature -- to the earth, and feareth greatly because of the words of Samuel; also power was not in him, for he had not eaten bread all the day, and all the night.";
dby[20] = "And Saul fell straightway his full length on the earth, and was sore afraid because of the words of Samuel; and there was no strength in him, for he had eaten no bread all the day nor all the night.";
web[20] = "Then Saul fell immediately all along on the earth, and was exceedingly afraid, because of the words of Samuel: and there was no strength in him; for he had eaten no bread all the day, nor all the night.";
hnv[20] = "Then Sha\'ul fell immediately his full length on the eretz, and was sore afraid, because of the words of Shemu\'el: and there was no strength in him; for he had eaten no bread all the day, nor all the night.";
vul[20] = "statimque Saul cecidit porrectus in terram extimuerat enim verba Samuhel et robur non erat in eo quia non comederat panem tota die illa";
kjv[21] = "And the woman came unto Saul, and saw that he was sore troubled, and said unto him, Behold, thine handmaid hath obeyed thy voice, and I have put my life in my hand, and have hearkened unto thy words which thou spakest unto me.";
rsv[21] = "And the woman came to Saul, and when she saw that he was terrified, she said to him, &quot;Behold, your handmaid has hearkened to you; I have taken my life in my hand, and have hearkened to what you have said to me.";
asv[21] = "And the woman came unto Saul, and saw that he was sore troubled, and said unto him, Behold, thy handmaid hath hearkened unto thy voice, and I have put my life in my hand, and have hearkened unto thy words which thou spakest unto me.";
yng[21] = "And the woman cometh in unto Saul, and seeth that he hath been greatly troubled, and saith unto him, `Lo, thy maid-servant hath hearkened to thy voice, and I put my soul in my hand, and I obey thy words which thou hast spoken unto me;";
dby[21] = "And the woman came to Saul, and saw that he was sore troubled, and said to him, Behold, thy bondmaid has hearkened to thy voice, and I have put my life in my hand, and have hearkened to thy words which thou spokest to me.";
web[21] = "And the woman came to Saul, and saw that he was greatly troubled, and said to him, Behold, thy handmaid hath obeyed thy voice, and I have put my life in my hand, and have hearkened to thy words, which thou didst speak";
hnv[21] = "The woman came to Sha\'ul, and saw that he was sore troubled, and said to him, Behold, your handmaid has listened to your voice, and I have put my life in my hand, and have listened to your words which you spoke to me.";
vul[21] = "ingressa est itaque mulier ad Saul et ait conturbatus enim erat valde dixitque ad eum ecce oboedivit ancilla tua voci tuae et posui animam meam in manu mea et audivi sermones tuos quos locutus es ad me";
kjv[22] = "Now therefore, I pray thee, hearken thou also unto the voice of thine handmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength, when thou goest on thy way.";
rsv[22] = "Now therefore, you also hearken to your handmaid; let me set a morsel of bread before you; and eat, that you may have strength when you go on your way.&quot;";
asv[22] = "Now therefore, I pray thee, hearken thou also unto the voice of thy handmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength, when thou goest on thy way.";
yng[22] = "and now, hearken, I pray thee, also thou, to the voice of thy maid-servant, and I set before thee a morsel of bread, and eat, and there is in thee power when thou goest in the way.\'";
dby[22] = "And now, I pray thee, hearken thou also to the voice of thy bondmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength when thou goest on thy way.";
web[22] = "Now therefore, I pray thee, hearken thou also to the voice of thy handmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength, when thou goest on thy way.";
hnv[22] = "Now therefore, please listen also to the voice of your handmaid, and let me set a morsel of bread before you; and eat, that you may have strength, when you go on your way.";
vul[22] = "nunc igitur audi et tu vocem ancillae tuae ut ponam coram te buccellam panis et comedens convalescas ut possis iter facere";
kjv[23] = "But he refused, and said, I will not eat. But his servants, together with the woman, compelled him; and he hearkened unto their voice. So he arose from the earth, and sat upon the bed.";
rsv[23] = "He refused, and said, &quot;I will not eat.&quot; But his servants, together with the woman, urged him; and he hearkened to their words. So he arose from the earth, and sat upon the bed.";
asv[23] = "But he refused, and said, I will not eat. But his servants, together with the woman, constrained him; and he hearkened unto their voice. So he arose from the earth, and sat upon the bed.";
yng[23] = "And he refuseth, and saith, `I do not eat;\' and his servants urge on him, and also the woman, and he hearkeneth to their voice, and riseth from the earth, and sitteth on the bed.";
dby[23] = "But he refused and said, I will not eat. Then his servants, and the woman also, compelled him, and he hearkened to their voice; and he arose from the earth and sat on the bed.";
web[23] = "But he refused, and said, I will not eat. But his servants, together with the woman, compelled him; and he hearkened to their voice. So he arose from the earth, and sat upon the bed.";
hnv[23] = "But he refused, and said, I will not eat. But his servants, together with the woman, constrained him; and he listened to their voice. So he arose from the eretz, and sat on the bed.";
vul[23] = "qui rennuit et ait non comedam coegerunt autem eum servi sui et mulier et tandem audita voce eorum surrexit de terra et sedit super lectum";
kjv[24] = "And the woman had a fat calf in the house; and she hasted, and killed it, and took flour, and kneaded [it], and did bake unleavened bread thereof:";
rsv[24] = "Now the woman had a fatted calf in the house, and she quickly killed it, and she took flour, and kneaded it and baked unleavened bread of it,";
asv[24] = "And the woman had a fatted calf in the house; and she hasted, and killed it; and she took flour, and kneaded it, and did bake unleavened bread thereof:";
yng[24] = "And the woman hath a calf of the stall in the house, and she hasteth and slaughtereth it, and taketh flour, and kneadeth, and baketh it unleavened things,";
dby[24] = "And the woman had a fat calf in the house; and she hasted and killed it, and took flour, and kneaded it, and baked unleavened bread thereof;";
web[24] = "And the woman had a fat calf in the house: and she hasted and killed it, and took flour, and kneaded [it], and baked unleavened bread of it.";
hnv[24] = "The woman had a fattened calf in the house; and she hurried, and killed it; and she took flour, and kneaded it, and did bake matzah of it:";
vul[24] = "mulier autem illa habebat vitulum pascualem in domo et festinavit et occidit eum tollensque farinam miscuit eam et coxit azyma";
kjv[25] = "And she brought [it] before Saul, and before his servants; and they did eat. Then they rose up, and went away that night.";
rsv[25] = "and she put it before Saul and his servants; and they ate. Then they rose and went away that night.";
asv[25] = "and she brought it before Saul, and before his servants; and they did eat. Then they rose up, and went away that night.";
yng[25] = "and bringeth nigh before Saul, and before his servants, and they eat, and rise, and go on, during that night.";
dby[25] = "and she brought it near before Saul, and before his servants, and they ate. And they rose up and went away that night.";
web[25] = "And she brought [it] before Saul, and before his servants; and they ate. Then they arose and went away that night.";
hnv[25] = "and she brought it before Sha\'ul, and before his servants; and they ate. Then they rose up, and went away that night.";
vul[25] = "et posuit ante Saul et ante servos eius qui cum comedissent surrexerunt et ambulaverunt per totam noctem illam";
