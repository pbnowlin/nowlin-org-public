csb[1] = "The boy Samuel served the LORD in Eli\'s presence. In those days the word of the LORD was rare and prophetic visions were not widespread.&quot;"
csb[2] = "One day Eli, whose eyesight was failing, was lying in his usual place.&quot;"
csb[3] = "Before the lamp of God had gone out, Samuel was lying down in the temple of the LORD, where the ark of God was located.&quot;"
csb[4] = "Then the LORD called Samuel, and he answered, &quot;Here I am.&quot;"
csb[5] = "He ran to Eli and said, &quot;Here I am; you called me.&quot; &quot;I didn\'t call,&quot; Eli replied. &quot;Go back and lie down.&quot; So he went and lay down.&quot;"
csb[6] = "Once again the LORD called, &quot;Samuel! &quot; Samuel got up, went to Eli, and said, &quot;Here I am; you called me.&quot; &quot;I didn\'t call, my son,&quot; he replied. &quot;Go back and lie down.&quot;"
csb[7] = "Now Samuel did not yet know the LORD, because the word of the LORD had not yet been revealed to him.&quot;"
csb[8] = "Once again, for the third time, the LORD called Samuel. He got up, went to Eli, and said, &quot;Here I am; you called me.&quot; Then Eli understood that the LORD was calling the boy.&quot;"
csb[9] = "He told Samuel, &quot;Go and lie down. If he calls you, say, \'Speak, LORD, for your servant is listening.\' &quot; So Samuel went and lay down in his place.&quot;"
csb[10] = "The LORD came, stood there, and called as before, &quot;Samuel, Samuel! &quot; Samuel responded, &quot;Speak, for your servant is listening.&quot;"
csb[11] = "The LORD said to Samuel, &quot;I am about to do something in Israel that everyone who hears about it will shudder.&quot;"
csb[12] = "&quot;On that day I will carry out against Eli everything I said about his family, from beginning to end.&quot;"
csb[13] = "&quot;I told him that I am going to judge his family forever because of the iniquity he knows about: his sons are cursing God, and he has not stopped them.&quot;"
csb[14] = "&quot;Therefore, I have sworn to Eli\'s family: The iniquity of Eli\'s family will never be wiped out by either sacrifice or offering.&quot;"
csb[15] = "Samuel lay down until the morning; then he opened the doors of the LORD\'s house. He was afraid to tell Eli the vision,&quot;"
csb[16] = "but Eli called him and said, &quot;Samuel, my son.&quot; &quot;Here I am,&quot; answered Samuel.&quot;"
csb[17] = "&quot;What was the message he gave you? &quot; Eli asked. &quot;Don\'t hide it from me. May God punish you and do so severely if you hide anything from me that he told you.&quot;"
csb[18] = "So Samuel told him everything and did not hide anything from him. Eli responded, &quot;He is the LORD. Let him do what he thinks is good.&quot;"
csb[19] = "Samuel grew, and the LORD was with him, and he fulfilled everything Samuel prophesied.&quot;"
csb[20] = "All Israel from Dan to Beer-sheba knew that Samuel was a confirmed prophet of the LORD.&quot;"
csb[21] = "The LORD continued to appear in Shiloh, because there he revealed himself to Samuel by his word.&quot;"
