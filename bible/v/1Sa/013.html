csb[1] = "Saul was thirty years old when he became king, and he reigned forty-two years over Israel.&quot;"
csb[2] = "He chose three thousand men from Israel for himself: two thousand were with Saul at Michmash and in Bethel\'s hill country, and one thousand were with Jonathan in Gibeah of Benjamin. He sent the rest of the troops away, each to his own tent.&quot;"
csb[3] = "Jonathan attacked the Philistine garrison that was in Geba, and the Philistines heard about it. So Saul blew the ram\'s horn throughout the land saying, &quot;Let the Hebrews hear! &quot;"
csb[4] = "And all Israel heard the news, &quot;Saul has attacked the Philistine garrison, and Israel is now repulsive to the Philistines.&quot; Then the troops were summoned to join Saul at Gilgal.&quot;"
csb[5] = "The Philistines also gathered to fight against Israel: three thousand chariots, six thousand horsemen, and troops as numerous as the sand on the seashore. They went up and camped at Michmash, east of Beth-aven.&quot;"
csb[6] = "The men of Israel saw that they were in trouble because the troops were in a difficult situation. They hid in caves, in thickets, among rocks, and in holes and cisterns.&quot;"
csb[7] = "Some Hebrews even crossed the Jordan to the land of Gad and Gilead. Saul, however, was still at Gilgal, and all his troops were gripped with fear.&quot;"
csb[8] = "He waited seven days for the appointed time that Samuel had set, but Samuel didn\'t come to Gilgal, and the troops were deserting him.&quot;"
csb[9] = "So Saul said, &quot;Bring me the burnt offering and the fellowship offerings.&quot; Then he offered the burnt offering.&quot;"
csb[10] = "Just as he finished offering the burnt offering, Samuel arrived. So Saul went out to greet him,&quot;"
csb[11] = "and Samuel asked, &quot;What have you done? &quot; Saul answered, &quot;When I saw that the troops were deserting me and you didn\'t come within the appointed days and the Philistines were gathering at Michmash,&quot;"
csb[12] = "&quot;I thought, \'The Philistines will now descend on me at Gilgal, and I haven\'t sought the LORD\'s favor.\' So I forced myself to offer the burnt offering.&quot;"
csb[13] = "Samuel said to Saul, &quot;You have been foolish. You have not kept the command the LORD your God gave you. It was at this time that the LORD would have permanently established your reign over Israel,&quot;"
csb[14] = "&quot;but now your reign will not endure. The LORD has found a man after his own heart, and the LORD has appointed him as ruler over his people, because you have not done what the LORD commanded.&quot;"
csb[15] = "Then Samuel went from Gilgal to Gibeah in Benjamin. Saul registered the troops who were with him, about six hundred men.&quot;"
csb[16] = "Saul, his son Jonathan, and the troops who were with them were staying in Geba of Benjamin, and the Philistines were camped at Michmash.&quot;"
csb[17] = "Raiding parties went out from the Philistine camp in three divisions. One division headed toward the Ophrah road leading to the land of Shual.&quot;"
csb[18] = "The next division headed toward the Beth-horon road, and the last division headed down the border road that looks out over the Zeboim Valley toward the wilderness.&quot;"
csb[19] = "No blacksmith could be found in all the land of Israel because the Philistines had said, &quot;Otherwise, the Hebrews will make swords or spears.&quot;"
csb[20] = "So all the Israelites went to the Philistines to sharpen their plows, mattocks, axes, and sickles.&quot;"
csb[21] = "The price was two-thirds of a shekel for plows and mattocks, and one-third of a shekel for pitchforks and axes, and for putting a point on a cattle prod.&quot;"
csb[22] = "So on the day of battle not a sword or spear could be found in the hand of any of the troops who were with Saul and Jonathan; only Saul and his son Jonathan had weapons.&quot;"
csb[23] = "Now a Philistine garrison took control of the pass at Michmash.&quot;"

kjv[2] = "Saul chose him three thousand [men] of Israel; [whereof] two thousand were with Saul in Michmash and in mount Bethel, and a thousand were with Jonathan in Gibeah of Benjamin: and the rest of the people he sent every man to his tent.";

yng[2] = "and Saul chooseth for himself three thousand [men] out of Israel; and two thousand are with Saul in Michmash, and in the hill-country of Beth-El; and a thousand have been with Jonathan in Gibeah of Benjamin; and the remnant of the people he hath sent each to his tents.";

vul[2] = "et elegit sibi Saul tria milia de Israhel et erant cum Saul duo milia in Machmas et in monte Bethel mille autem cum Ionathan in Gabaath Beniamin porro ceterum populum remisit unumquemque in tabernacula sua";

yng[3] = "And Jonathan smiteth the garrison of the Philistines which [is] in Geba, and the Philistines hear, and Saul hath blown with a trumpet through all the land, saying, `Let the Hebrews hear.\'";
dby[3] = "And Jonathan smote the outpost of the Philistines that was in Geba, and the Philistines heard [of it]. And Saul blew the trumpet throughout the land, saying, Let the Hebrews hear.";

kjv[5] = "And the Philistines gathered themselves together to fight with Israel, thirty thousand chariots, and six thousand horsemen, and people as the sand which [is] on the sea shore in multitude: and they came up, and pitched in Michmash, eastward from Bethaven.";
rsv[5] = "And the Philistines mustered to fight with Israel, thirty thousand chariots, and six thousand horsemen, and troops like the sand on the seashore in multitude; they came up and encamped in Michmash, to the east of Beth-a\'ven.";

yng[5] = "And the Philistines have been gathered to fight with Israel; thirty thousand chariots, and six thousand horsemen, and a people as the sand which [is] on the sea-shore for multitude; and they come up and encamp in Michmash, east of Beth-Aven.";

yng[19] = "And an artificer is not found in all the land of Israel, for the Philistines said, `Lest the Hebrews make sword or spear;\'";
dby[19] = "Now there was no smith found throughout the land of Israel; for the Philistines said, Lest the Hebrews make them swords or spears.";

dby[22] = "And it came to pass in the day of battle, that there was neither sword nor spear found in the hand of any of the people that were with Saul and Jonathan; but with Saul and with Jonathan his son there was found.";
