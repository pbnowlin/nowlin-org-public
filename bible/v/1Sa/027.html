csb[1] = "David said to himself, &quot;One of these days I\'ll be swept away by Saul. There is nothing better for me than to escape immediately to the land of the Philistines. Then Saul will give up searching for me everywhere in Israel, and I\'ll escape from him.&quot;"
csb[2] = "So David set out with his six hundred men and went over to Achish son of Maoch, the king of Gath.&quot;"
csb[3] = "David and his men stayed with Achish in Gath. Each man had his family with him, and David had his two wives: Ahinoam of Jezreel and Abigail of Carmel, Nabal\'s widow.&quot;"
csb[4] = "When it was reported to Saul that David had fled to Gath, he no longer searched for him.&quot;"
csb[5] = "Now David said to Achish, &quot;If I have found favor with you, let me be given a place in one of the outlying towns, so I can live there. Why should your servant live in the royal city with you? &quot;"
csb[6] = "That day Achish gave Ziklag to him, and it still belongs to the kings of Judah today.&quot;"
csb[7] = "The length of time that David stayed in Philistine territory amounted to a year and four months.&quot;"
csb[8] = "David and his men went up and raided the Geshurites, the Girzites, and the Amalekites. From ancient times they had been the inhabitants of the region through Shur as far as the land of Egypt.&quot;"
csb[9] = "Whenever David attacked the land, he did not leave a single person alive, either man or woman, but he took flocks, herds, donkeys, camels, and clothing. Then he came back to Achish,&quot;"
csb[10] = "who inquired, &quot;Where did you raid today? &quot; David replied, &quot;The south country of Judah,&quot; &quot;The south country of the Jerahmeelites,&quot; or &quot;The south country of the Kenites.&quot;"
csb[11] = "David did not let a man or woman live to be brought to Gath, for he said, &quot;Or they will inform on us and say, \'This is what David did.\' &quot; This was David\'s custom during the whole time he stayed in the Philistine territory.&quot;"
csb[12] = "So Achish trusted David, thinking, &quot;Since he has made himself repulsive to his people Israel, he will be my servant forever.&quot;"
kjv[1] = "And David said in his heart, I shall now perish one day by the hand of Saul: [there is] nothing better for me than that I should speedily escape into the land of the Philistines; and Saul shall despair of me, to seek me any more in any coast of Israel: so shall I escape out of his hand.";
rsv[1] = "And David said in his heart, &quot;I shall now perish one day by the hand of Saul; there is nothing better for me than that I should escape to the land of the Philistines; then Saul will despair of seeking me any longer within the borders of Israel, and I shall escape out of his hand.&quot;";
asv[1] = "And David said in his heart, I shall now perish one day by the hand of Saul: there is nothing better for me than that I should escape into the land of the Philistines; and Saul will despair of me, to seek me any more in all the borders of Israel: so shall I escape out of his hand.";
yng[1] = "And David saith unto his heart, `Now am I consumed one day by the hand of Saul; there is nothing for me better than that I diligently escape unto the land of the Philistines, and Saul hath been despairing of me -- of seeking me any more in all the border of Israel, and I have escaped out of his hand.\'";
dby[1] = "And David said in his heart, I shall now perish one day by the hand of Saul: there is nothing better for me than that I should speedily escape into the land of the Philistines; and Saul will despair of me to seek me any more within all the limits of Israel, and I shall escape out of his hand.";
web[1] = "And David said in his heart, I shall now perish one day by the hand of Saul: [there is] nothing better for me than that I should speedily escape into the land of the Philistines; and Saul will despair of me, to seek me any more in any border of Israel; so shall I escape from his hand.";
hnv[1] = "David said in his heart, I shall now perish one day by the hand of Sha\'ul: there is nothing better for me than that I should escape into the land of the Pelishtim; and Sha\'ul will despair of me, to seek me any more in all the borders of Yisra\'el: so shall I escape out of his hand.";
vul[1] = "et ait David in corde suo aliquando incidam in uno die in manu Saul nonne melius est ut fugiam et salver in terra Philisthinorum ut desperet Saul cessetque me quaerere in cunctis finibus Israhel fugiam ergo manus eius";
kjv[2] = "And David arose, and he passed over with the six hundred men that [were] with him unto Achish, the son of Maoch, king of Gath.";
rsv[2] = "So David arose and went over, he and the six hundred men who were with him, to A\'chish the son of Ma\'och, king of Gath.";
asv[2] = "And David arose, and passed over, he and the six hundred men that were with him, unto Achish the son of Maoch, king of Gath.";
yng[2] = "And David riseth, and passeth over, he and six hundred men who [are] with him, unto Achish son of Maoch king of Gath;";
dby[2] = "And David arose and passed over, he and the six hundred men that were with him, to Achish, the son of Maoch, king of Gath.";
web[2] = "And David arose, and he passed over with the six hundred men that [were] with him to Achish, the son of Maoch, king of Gath.";
hnv[2] = "David arose, and passed over, he and the six hundred men who were with him, to Akhish the son of Ma`okh, king of Gat.";
vul[2] = "et surrexit David et abiit ipse et sescenti viri cum eo ad Achis filium Mahoc regem Geth";
kjv[3] = "And David dwelt with Achish at Gath, he and his men, every man with his household, [even] David with his two wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess, Nabal\'s wife.";
rsv[3] = "And David dwelt with A\'chish at Gath, he and his men, every man with his household, and David with his two wives, Ahin\'o-am of Jezreel, and Ab\'igail of Carmel, Nabal\'s widow.";
asv[3] = "And David dwelt with Achish at Gath, he and his men, every man with his household, even David with his two wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess, Nabal\'s wife.";
yng[3] = "and David dwelleth with Achish in Gath, he and his men, each one with his household, [even] David and his two wives, Ahinoam the Jezreelitess, and Abigail wife of Nabal the Carmelitess.";
dby[3] = "And David abode with Achish at Gath, he and his men, every man with his household; David with his two wives, Ahinoam the Jizreelitess, and Abigail the Carmelitess, Nabal\'s wife.";
web[3] = "And David dwelt with Achish at Gath, he and his men, every man with his household, [even] David with his two wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess Nabal\'s wife.";
hnv[3] = "David lived with Akhish at Gat, he and his men, every man with his household, even David with his two wives, Achino\'am the Yizre`elite, and Avigayil the Karmelite, Naval\'s wife.";
vul[3] = "et habitavit David cum Achis in Geth ipse et viri eius vir et domus eius David et duae uxores eius Ahinoem Iezrahelites et Abigail uxor Nabal Carmeli";
kjv[4] = "And it was told Saul that David was fled to Gath: and he sought no more again for him.";
rsv[4] = "And when it was told Saul that David had fled to Gath, he sought for him no more.";
asv[4] = "And it was told Saul that David was fled to Gath: and he sought no more again for him.";
yng[4] = "And it is declared to Saul that David hath fled to Gath, and he hath not added any more to seek him.";
dby[4] = "And it was told Saul that David had fled to Gath; and he sought no more for him.";
web[4] = "And it was told to Saul that David had fled to Gath: and he sought no more again for him.";
hnv[4] = "It was told Sha\'ul that David was fled to Gat: and he sought no more again for him.";
vul[4] = "et nuntiatum est Saul quod fugisset David in Geth et non addidit ultra ut quaereret eum";
kjv[5] = "And David said unto Achish, If I have now found grace in thine eyes, let them give me a place in some town in the country, that I may dwell there: for why should thy servant dwell in the royal city with thee?";
rsv[5] = "Then David said to A\'chish, &quot;If I have found favor in your eyes, let a place be given me in one of the country towns, that I may dwell there; for why should your servant dwell in the royal city with you?&quot;";
asv[5] = "And David said unto Achish, If now I have found favor in thine eyes, let them give me a place in one of the cities in the country, that I may dwell there: for why should thy servant dwell in the royal city with thee?";
yng[5] = "And David saith unto Achish, `If, I pray thee, I have found grace in thine eyes, they give to me a place in one of the cities of the field, and I dwell there, yea, why doth thy servant dwell in the royal city with thee?\'";
dby[5] = "And David said to Achish, If now I have found favour in thine eyes, let them give me a place in some country-town, that I may abide there; for why should thy servant abide in the royal city with thee?";
web[5] = "And David said to Achish, If I have now found grace in thy eyes, let them give me a place in some town in the country, that I may dwell there: for why should thy servant dwell in the royal city with thee?";
hnv[5] = "David said to Akhish, If now I have found favor in your eyes, let them give me a place in one of the cities in the country, that I may dwell there: for why should your servant dwell in the royal city with you?";
vul[5] = "dixit autem David ad Achis si inveni gratiam in oculis tuis detur mihi locus in una urbium regionis huius ut habitem ibi cur enim manet servus tuus in civitate regis tecum";
kjv[6] = "Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day.";
rsv[6] = "So that day A\'chish gave him Ziklag; therefore Ziklag has belonged to the kings of Judah to this day.";
asv[6] = "Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day.";
yng[6] = "And Achish giveth to him in that day Ziklag, therefore hath Ziklag been to the kings of Judah till this day.";
dby[6] = "And Achish gave him Ziklag that day; therefore Ziklag belongs to the kings of Judah to this day.";
web[6] = "Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth to the kings of Judah to this day.";
hnv[6] = "Then Akhish gave him Tziklag that day: why Tziklag pertains to the kings of Yehudah to this day.";
vul[6] = "dedit itaque ei Achis in die illa Siceleg propter quam causam facta est Siceleg regum Iuda usque in diem hanc";
kjv[7] = "And the time that David dwelt in the country of the Philistines was a full year and four months.";
rsv[7] = "And the number of the days that David dwelt in the country of the Philistines was a year and four months.";
asv[7] = "And the number of the days that David dwelt in the country of the Philistines was a full year and four months.";
yng[7] = "And the number of the days which David hath dwelt in the field of the Philistines [is] days and four months;";
dby[7] = "And the time that David abode in the country of the Philistines was a year and four months.";
web[7] = "And the time that David dwelt in the country of the Philistines was a full year and four months.";
hnv[7] = "The number of the days that David lived in the country of the Pelishtim was a full year and four months.";
vul[7] = "fuit autem numerus dierum quibus habitavit David in regione Philisthinorum quattuor mensuum";
kjv[8] = "And David and his men went up, and invaded the Geshurites, and the Gezrites, and the Amalekites: for those [nations were] of old the inhabitants of the land, as thou goest to Shur, even unto the land of Egypt.";
rsv[8] = "Now David and his men went up, and made raids upon the Gesh\'urites, the Gir\'zites, and the Amal\'ekites; for these were the inhabitants of the land from of old, as far as Shur, to the land of Egypt.";
asv[8] = "And David and his men went up, and made a raid upon the Geshurites, and the Girzites, and the Amalekites; for those [nations] were the inhabitants of the land, who were of old, as thou goest to Shur, even unto the land of Egypt.";
yng[8] = "and David goeth up and his men, and they push unto the Geshurite, and the Gerizite, and the Amalekite, (for they are inhabitants of the land from of old), as thou comest in to Shur and unto the land of Egypt,";
dby[8] = "And David and his men went up and made a raid upon the Geshurites, and the Gerzites, and the Amalekites: for those were of old the inhabitants of the land, as thou goest to Shur, and as far as the land of Egypt.";
web[8] = "And David and his men went up, and invaded the Geshurites, and the Gezrites, and the Amalekites: for those [nations were] of old the inhabitants of the land, as thou goest to Shur, even to the land of Egypt.";
hnv[8] = "David and his men went up, and made a raid on the Geshuri, and the Gizri, and the `Amaleki; for those [nations] were the inhabitants of the land, who were of old, as you go to Shur, even to the land of Mitzrayim.";
vul[8] = "et ascendit David et viri eius et agebant praedas de Gesuri et de Gedri et de Amalechitis hii enim pagi habitabantur in terra antiquitus euntibus Sur usque ad terram Aegypti";
kjv[9] = "And David smote the land, and left neither man nor woman alive, and took away the sheep, and the oxen, and the asses, and the camels, and the apparel, and returned, and came to Achish.";
rsv[9] = "And David smote the land, and left neither man nor woman alive, but took away the sheep, the oxen, the asses, the camels, and the garments, and came back to A\'chish.";
asv[9] = "And David smote the land, and saved neither man nor woman alive, and took away the sheep, and the oxen, and the asses, and the camels, and the apparel; and he returned, and came to Achish.";
yng[9] = "and David hath smitten the land, and doth not keep alive man and woman, and hath taken sheep, and oxen, and asses, and camels, and garments, and turneth back, and cometh in unto Achish.";
dby[9] = "And David smote the land, and left neither man nor woman alive, and took away the sheep, and the oxen, and the asses, and the camels, and the apparel, and returned, and came to Achish.";
web[9] = "And David smote the land, and left neither man nor woman alive, and took away the sheep, and the oxen, and the asses, and the camels, and the apparel, and returned, and came to Achish.";
hnv[9] = "David struck the land, and saved neither man nor woman alive, and took away the sheep, and the oxen, and the donkeys, and the camels, and the clothing; and he returned, and came to Akhish.";
vul[9] = "et percutiebat David omnem terram nec relinquebat viventem virum et mulierem tollensque oves et boves et asinos et camelos et vestes revertebatur et veniebat ad Achis";
kjv[10] = "And Achish said, Whither have ye made a road to day? And David said, Against the south of Judah, and against the south of the Jerahmeelites, and against the south of the Kenites.";
rsv[10] = "When A\'chish asked, &quot;Against whom have you made a raid today?&quot; David would say, &quot;Against the Negeb of Judah,&quot; or &quot;Against the Negeb of the Jerah\'meelites,&quot; or, &quot;Against the Negeb of the Ken\'ites.&quot;";
asv[10] = "And Achish said, Against whom have ye made a raid to-day? And David said, Against the South of Judah, and against the South of the Jerahmeelites, and against the South of the Kenites.";
yng[10] = "And Achish saith, `Whither have ye pushed to-day?\' and David saith, `Against the south of Judah, and against the south of the Jerahmeelite, and unto the south of the Kenite.\'";
dby[10] = "So Achish said, Have ye not made a raid to-day? And David said, Against the south of Judah, and against the south of the Jerahmeelites, and against the south of the Kenites.";
web[10] = "And Achish said, Whither have ye made a road to-day? And David said, Against the south of Judah, and against the south of the Jerahmeelites, and against the south of the Kenites.";
hnv[10] = "Akhish said, Against whom have you made a raid today? David said, Against the South of Yehudah, and against the South of the Yerachme\'eli, and against the South of the Kinim.";
vul[10] = "dicebat autem ei Achis in quem inruisti hodie respondebatque David contra meridiem Iudae et contra meridiem Hiramel et contra meridiem Ceni";
kjv[11] = "And David saved neither man nor woman alive, to bring [tidings] to Gath, saying, Lest they should tell on us, saying, So did David, and so [will be] his manner all the while he dwelleth in the country of the Philistines.";
rsv[11] = "And David saved neither man nor woman alive, to bring tidings to Gath, thinking, &quot;Lest they should tell about us, and say, \'So David has done.\'&quot; Such was his custom all the while he dwelt in the country of the Philistines.";
asv[11] = "And David saved neither man nor woman alive, to bring them to Gath, saying, Lest they should tell of us, saying, So did David, and so hath been his manner all the while he hath dwelt in the country of the Philistines.";
yng[11] = "Neither man nor woman doth David keep alive, to bring in [word] to Gath, saying, `Lest they declare [it] against us, saying, Thus hath David done, and thus [is] his custom all the days that he hath dwelt in the fields of the Philistines.\'";
dby[11] = "And David left neither man nor woman alive, to bring [them] to Gath, for he said, Lest they should tell of us, saying, So did David. And such was his custom as long as he abode in the country of the Philistines.";
web[11] = "And David saved neither man nor woman alive, to bring [tidings] to Gath, saying, Lest they should inform against us, saying, So did David, and so [will be] his manner all the while he dwelleth in the country of the Philistines.";
hnv[11] = "David saved neither man nor woman alive, to bring them to Gat, saying, Lest they should tell of us, saying, So did David, and so has been his manner all the while he has lived in the country of the Pelishtim.";
vul[11] = "virum et mulierem non vivificabat David nec adducebat in Geth dicens ne forte loquantur adversum nos haec fecit David et hoc erat decretum illi omnibus diebus quibus habitavit in regione Philisthinorum";
kjv[12] = "And Achish believed David, saying, He hath made his people Israel utterly to abhor him; therefore he shall be my servant for ever.";
rsv[12] = "And A\'chish trusted David, thinking, &quot;He has made himself utterly abhorred by his people Israel; therefore he shall be my servant always.&quot;";
asv[12] = "And Achish believed David, saying, He hath made his people Israel utterly to abhor him; therefore he shall be my servant for ever.";
yng[12] = "And Achish believeth in David, saying, `He hath made himself utterly abhorred among his people, in Israel, and hath been to me for a servant age-during.\'";
dby[12] = "And Achish trusted David, saying, He has made himself utterly odious among his people Israel; and he shall be my servant for ever.";
web[12] = "And Achish believed David, saying, He hath made his people Israel utterly to abhor him; therefore he shall be my servant for ever.";
hnv[12] = "Akhish believed David, saying, He has made his people Yisra\'el utterly to abhor him; therefore he shall be my servant forever.";
vul[12] = "credidit ergo Achis David dicens multa mala operatus est contra populum suum Israhel erit igitur mihi servus sempiternus";
