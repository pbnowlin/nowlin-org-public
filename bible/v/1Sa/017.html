csb[1] = "The Philistines gathered their forces for war at Socoh in Judah and camped between Socoh and Azekah in Ephes-dammim.&quot;"
csb[2] = "Saul and the men of Israel gathered and camped in the Valley of Elah; then they lined up in battle formation to face the Philistines.&quot;"
csb[3] = "The Philistines were standing on one hill, and the Israelites were standing on another hill with a ravine between them.&quot;"
csb[4] = "Then a champion named Goliath, from Gath, came out from the Philistine camp. He was nine feet, nine inches tall&quot;"
csb[5] = "and wore a bronze helmet and bronze scale armor that weighed one hundred twenty-five pounds.&quot;"
csb[6] = "There was bronze armor on his shins, and a bronze javelin was slung between his shoulders.&quot;"
csb[7] = "His spear shaft was like a weaver\'s beam, and the iron point of his spear weighed fifteen pounds. In addition, a shield-bearer was walking in front of him.&quot;"
csb[8] = "He stood and shouted to the Israelite battle formations: &quot;Why do you come out to line up in battle formation? &quot; He asked them, &quot;Am I not a Philistine and are you not servants of Saul? Choose one of your men and have him come down against me.&quot;"
csb[9] = "&quot;If he wins in a fight against me and kills me, we will be your servants. But if I win against him and kill him, then you will be our servants and serve us.&quot;"
csb[10] = "Then the Philistine said, &quot;I defy the ranks of Israel today. Send me a man so we can fight each other! &quot;"
csb[11] = "When Saul and all Israel heard these words from the Philistine, they lost their courage and were terrified.&quot;"
csb[12] = "Now David was the son of the Ephrathite from Bethlehem of Judah named Jesse. Jesse had eight sons and during Saul\'s reign was already an old man.&quot;"
csb[13] = "Jesse\'s three oldest sons had followed Saul to the war, and their names were Eliab, the firstborn, Abinadab, the next, and Shammah, the third,&quot;"
csb[14] = "and David was the youngest. The three oldest had followed Saul,&quot;"
csb[15] = "but David kept going back and forth from Saul to tend his father\'s flock in Bethlehem.&quot;"
csb[16] = "Every morning and evening for forty days the Philistine came forward and took his stand.&quot;"
csb[17] = "One day Jesse had told his son David: &quot;Take this half-bushel of roasted grain along with these ten loaves of bread for your brothers and hurry to their camp.&quot;"
csb[18] = "&quot;Also take these ten portions of cheese to the field commander. Check on the well-being of your brothers and bring a confirmation from them.&quot;"
csb[19] = "&quot;They are with Saul and all the men of Israel in the Valley of Elah fighting with the Philistines.&quot;"
csb[20] = "So David got up early in the morning, left the flock with someone to keep it, loaded up, and set out as Jesse had charged him. He arrived at the perimeter of the camp as the army was marching out to its battle formation shouting their battle cry.&quot;"
csb[21] = "Israel and the Philistines lined up in battle formation facing each other.&quot;"
csb[22] = "David left his supplies in the care of the quartermaster and ran to the battle line. When he arrived, he asked his brothers how they were.&quot;"
csb[23] = "While he was speaking with them, suddenly the champion named Goliath, the Philistine from Gath, came forward from the Philistine battle line and shouted his usual words, which David heard.&quot;"
csb[24] = "When all the Israelite men saw Goliath, they retreated from him terrified.&quot;"
csb[25] = "Previously, an Israelite man had declared: &quot;Do you see this man who keeps coming out? He comes to defy Israel. The king will make the man who kills him very rich and will give him his daughter. The king will also make the family of that man\'s father exempt from paying taxes in Israel.&quot;"
csb[26] = "David spoke to the men who were standing with him: &quot;What will be done for the man who kills that Philistine and removes this disgrace from Israel? Just who is this uncircumcised Philistine that he should defy the armies of the living God? &quot;"
csb[27] = "The troops told him about the offer, concluding, &quot;That is what will be done for the man who kills him.&quot;"
csb[28] = "David\'s oldest brother Eliab listened as he spoke to the men, and he became angry with him. &quot;Why did you come down here? &quot; he asked. &quot;Who did you leave those few sheep with in the wilderness? I know your arrogance and your evil heart -- you came down to see the battle! &quot;"
csb[29] = "&quot;What have I done now? &quot; protested David. &quot;It was just a question.&quot;"
csb[30] = "Then he turned from those beside him to others in front of him and asked about the offer. The people gave him the same answer as before.&quot;"
csb[31] = "What David said was overheard and reported to Saul, so he had David brought to him.&quot;"
csb[32] = "David said to Saul, &quot;Don\'t let anyone be discouraged by him; your servant will go and fight this Philistine! &quot;"
csb[33] = "But Saul replied, &quot;You can\'t go fight this Philistine. You\'re just a youth, and he\'s been a warrior since he was young.&quot;"
csb[34] = "David answered Saul: &quot;Your servant has been tending his father\'s sheep. Whenever a lion or a bear came and carried off a lamb from the flock,&quot;"
csb[35] = "&quot;I went after it, struck it down, and rescued the lamb from its mouth. If it reared up against me, I would grab it by its fur, strike it down, and kill it.&quot;"
csb[36] = "&quot;Your servant has killed lions and bears; this uncircumcised Philistine will be like one of them, for he has defied the armies of the living God.&quot;"
csb[37] = "Then David said, &quot;The LORD who rescued me from the paw of the lion and the paw of the bear will rescue me from the hand of this Philistine.&quot; Saul said to David, &quot;Go, and may the LORD be with you.&quot;"
csb[38] = "Then Saul had his own military clothes put on David. He put a bronze helmet on David\'s head and had him put on armor.&quot;"
csb[39] = "David strapped his sword on over the military clothes and tried to walk, but he was not used to them. &quot;I can\'t walk in these,&quot; David said to Saul, &quot;I\'m not used to them.&quot; So David took them off.&quot;"
csb[40] = "Instead, he took his staff in his hand and chose five smooth stones from the wadi and put them in the pouch, in his shepherd\'s bag. Then, with his sling in his hand, he approached the Philistine.&quot;"
csb[41] = "The Philistine came closer and closer to David, with the shield-bearer in front of him.&quot;"
csb[42] = "When the Philistine looked and saw David, he despised him because he was just a youth, healthy and handsome.&quot;"
csb[43] = "He said to David, &quot;Am I a dog that you come against me with sticks? &quot; Then he cursed David by his gods.&quot;"
csb[44] = "&quot;Come here,&quot; the Philistine called to David, &quot;and I\'ll give your flesh to the birds of the sky and the wild beasts! &quot;"
csb[45] = "David said to the Philistine: &quot;You come against me with a sword, spear, and javelin, but I come against you in the name of the LORD of Armies, the God of the ranks of Israel -- you have defied him.&quot;"
csb[46] = "&quot;Today, the LORD will hand you over to me. Today, I\'ll strike you down, remove your head, and give the corpses of the Philistine camp to the birds of the sky and the wild creatures of the earth. Then all the world will know that Israel has a God,&quot;"
csb[47] = "&quot;and this whole assembly will know that it is not by sword or by spear that the LORD saves, for the battle is the LORD\'s. He will hand you over to us.&quot;"
csb[48] = "When the Philistine started forward to attack him, David ran quickly to the battle line to meet the Philistine.&quot;"
csb[49] = "David put his hand in the bag, took out a stone, slung it, and hit the Philistine on his forehead. The stone sank into his forehead, and he fell facedown to the ground.&quot;"
csb[50] = "David defeated the Philistine with a sling and a stone. David overpowered the Philistine and killed him without having a sword.&quot;"
csb[51] = "David ran and stood over him. He grabbed the Philistine\'s sword, pulled it from its sheath, and used it to kill him. Then he cut off his head. When the Philistines saw that their hero was dead, they fled.&quot;"
csb[52] = "The men of Israel and Judah rallied, shouting their battle cry, and chased the Philistines to the entrance of the valley and to the gates of Ekron. Philistine bodies were strewn all along the Shaaraim road to Gath and Ekron.&quot;"
csb[53] = "When the Israelites returned from the pursuit of the Philistines, they plundered their camps.&quot;"
csb[54] = "David took Goliath\'s head and brought it to Jerusalem, but he put Goliath\'s weapons in his own tent.&quot;"
csb[55] = " When Saul had seen David going out to confront the Philistine, he asked Abner the commander of the army, &quot;Whose son is this youth, Abner? &quot; &quot;Your Majesty, as surely as you live, I don\'t know,&quot; Abner replied.&quot;"
csb[56] = "The king said, &quot;Find out whose son this young man is! &quot;"
csb[57] = "When David returned from killing the Philistine, Abner took him and brought him before Saul with the Philistine\'s head still in his hand.&quot;"
csb[58] = "Saul said to him, &quot;Whose son are you, young man? &quot; &quot;The son of your servant Jesse of Bethlehem,&quot; David answered.&quot;"
kjv[1] = "Now the Philistines gathered together their armies to battle, and were gathered together at Shochoh, which [belongeth] to Judah, and pitched between Shochoh and Azekah, in Ephesdammim.";
kjv[2] = "And Saul and the men of Israel were gathered together, and pitched by the valley of Elah, and set the battle in array against the Philistines.";
kjv[3] = "And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and [there was] a valley between them.";
kjv[4] = "And there went out a champion out of the camp of the Philistines, named Goliath, of Gath, whose height [was] six cubits and a span.";
kjv[5] = "And [he had] an helmet of brass upon his head, and he [was] armed with a coat of mail; and the weight of the coat [was] five thousand shekels of brass.";
kjv[6] = "And [he had] greaves of brass upon his legs, and a target of brass between his shoulders.";
kjv[7] = "And the staff of his spear [was] like a weaver\'s beam; and his spear\'s head [weighed] six hundred shekels of iron: and one bearing a shield went before him.";
kjv[8] = "And he stood and cried unto the armies of Israel, and said unto them, Why are ye come out to set [your] battle in array? [am] not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me.";
kjv[9] = "If he be able to fight with me, and to kill me, then will we be your servants: but if I prevail against him, and kill him, then shall ye be our servants, and serve us.";
kjv[10] = "And the Philistine said, I defy the armies of Israel this day; give me a man, that we may fight together.";
kjv[11] = "When Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid.";
kjv[12] = "Now David [was] the son of that Ephrathite of Bethlehemjudah, whose name [was] Jesse; and he had eight sons: and the man went among men [for] an old man in the days of Saul.";
kjv[13] = "And the three eldest sons of Jesse went [and] followed Saul to the battle: and the names of his three sons that went to the battle [were] Eliab the firstborn, and next unto him Abinadab, and the third Shammah.";
kjv[14] = "And David [was] the youngest: and the three eldest followed Saul.";
kjv[15] = "But David went and returned from Saul to feed his father\'s sheep at Bethlehem.";
kjv[16] = "And the Philistine drew near morning and evening, and presented himself forty days.";
kjv[17] = "And Jesse said unto David his son, Take now for thy brethren an ephah of this parched [corn], and these ten loaves, and run to the camp to thy brethren;";
kjv[18] = "And carry these ten cheeses unto the captain of [their] thousand, and look how thy brethren fare, and take their pledge.";
kjv[19] = "Now Saul, and they, and all the men of Israel, [were] in the valley of Elah, fighting with the Philistines.";
kjv[20] = "And David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him; and he came to the trench, as the host was going forth to the fight, and shouted for the battle.";
kjv[21] = "For Israel and the Philistines had put the battle in array, army against army.";
kjv[22] = "And David left his carriage in the hand of the keeper of the carriage, and ran into the army, and came and saluted his brethren.";
kjv[23] = "And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, out of the armies of the Philistines, and spake according to the same words: and David heard [them].";
kjv[24] = "And all the men of Israel, when they saw the man, fled from him, and were sore afraid.";
kjv[25] = "And the men of Israel said, Have ye seen this man that is come up? surely to defy Israel is he come up: and it shall be, [that] the man who killeth him, the king will enrich him with great riches, and will give him his daughter, and make his father\'s house free in Israel.";
kjv[26] = "And David spake to the men that stood by him, saying, What shall be done to the man that killeth this Philistine, and taketh away the reproach from Israel? for who [is] this uncircumcised Philistine, that he should defy the armies of the living God?";
kjv[27] = "And the people answered him after this manner, saying, So shall it be done to the man that killeth him.";
kjv[28] = "And Eliab his eldest brother heard when he spake unto the men; and Eliab\'s anger was kindled against David, and he said, Why camest thou down hither? and with whom hast thou left those few sheep in the wilderness? I know thy pride, and the naughtiness of thine heart; for thou art come down that thou mightest see the battle.";
kjv[29] = "And David said, What have I now done? [Is there] not a cause?";
kjv[30] = "And he turned from him toward another, and spake after the same manner: and the people answered him again after the former manner.";
kjv[31] = "And when the words were heard which David spake, they rehearsed [them] before Saul: and he sent for him.";
kjv[32] = "And David said to Saul, Let no man\'s heart fail because of him; thy servant will go and fight with this Philistine.";
kjv[33] = "And Saul said to David, Thou art not able to go against this Philistine to fight with him: for thou [art but] a youth, and he a man of war from his youth.";
kjv[34] = "And David said unto Saul, Thy servant kept his father\'s sheep, and there came a lion, and a bear, and took a lamb out of the flock:";
kjv[35] = "And I went out after him, and smote him, and delivered [it] out of his mouth: and when he arose against me, I caught [him] by his beard, and smote him, and slew him.";
kjv[36] = "Thy servant slew both the lion and the bear: and this uncircumcised Philistine shall be as one of them, seeing he hath defied the armies of the living God.";
kjv[37] = "David said moreover, The LORD that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said unto David, Go, and the LORD be with thee.";
kjv[38] = "And Saul armed David with his armour, and he put an helmet of brass upon his head; also he armed him with a coat of mail.";
kjv[39] = "And David girded his sword upon his armour, and he assayed to go; for he had not proved [it]. And David said unto Saul, I cannot go with these; for I have not proved [them]. And David put them off him.";
kjv[40] = "And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in a shepherd\'s bag which he had, even in a scrip; and his sling [was] in his hand: and he drew near to the Philistine.";
kjv[41] = "And the Philistine came on and drew near unto David; and the man that bare the shield [went] before him.";
kjv[42] = "And when the Philistine looked about, and saw David, he disdained him: for he was [but] a youth, and ruddy, and of a fair countenance.";
kjv[43] = "And the Philistine said unto David, [Am] I a dog, that thou comest to me with staves? And the Philistine cursed David by his gods.";
kjv[44] = "And the Philistine said to David, Come to me, and I will give thy flesh unto the fowls of the air, and to the beasts of the field.";
kjv[45] = "Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast defied.";
kjv[46] = "This day will the LORD deliver thee into mine hand; and I will smite thee, and take thine head from thee; and I will give the carcases of the host of the Philistines this day unto the fowls of the air, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel.";
kjv[47] = "And all this assembly shall know that the LORD saveth not with sword and spear: for the battle [is] the LORD\'S, and he will give you into our hands.";
kjv[48] = "And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hasted, and ran toward the army to meet the Philistine.";
kjv[49] = "And David put his hand in his bag, and took thence a stone, and slang [it], and smote the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth.";
kjv[50] = "So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but [there was] no sword in the hand of David.";
kjv[51] = "Therefore David ran, and stood upon the Philistine, and took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith. And when the Philistines saw their champion was dead, they fled.";
kjv[52] = "And the men of Israel and of Judah arose, and shouted, and pursued the Philistines, until thou come to the valley, and to the gates of Ekron. And the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron.";
kjv[53] = "And the children of Israel returned from chasing after the Philistines, and they spoiled their tents.";
kjv[54] = "And David took the head of the Philistine, and brought it to Jerusalem; but he put his armour in his tent.";
kjv[55] = "And when Saul saw David go forth against the Philistine, he said unto Abner, the captain of the host, Abner, whose son [is] this youth? And Abner said, [As] thy soul liveth, O king, I cannot tell.";
kjv[56] = "And the king said, Enquire thou whose son the stripling [is].";
kjv[57] = "And as David returned from the slaughter of the Philistine, Abner took him, and brought him before Saul with the head of the Philistine in his hand.";
kjv[58] = "And Saul said to him, Whose son [art] thou, [thou] young man? And David answered, I [am] the son of thy servant Jesse the Bethlehemite.";

asv[8] = "And he stood and cried unto the armies of Israel, and said unto them, Why are ye come out to set your battle in array? am not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me.";
yng[8] = "And he standeth and calleth unto the ranks of Israel, and saith to them, `Why are ye come out to set in array the battle? [am] not I the Philistine, and ye servants to Saul? choose for you a man, and let him come down unto me;";
dby[8] = "And he stood and cried to the ranks of Israel, and said to them, Why are ye come out to set your battle in array? am not I the Philistine, and ye servants of Saul? choose for yourselves a man, and let him come down to me.";
web[8] = "And he stood and cried to the armies of Israel, and said to them, Why have ye come out to set [your] battle in array? [am] not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me.";
hnv[8] = "He stood and cried to the armies of Yisra\'el, and said to them, Why are you come out to set your battle in array? am I not a Pelishti, and you servants to Sha\'ul? choose you a man for you, and let him come down to me.";
vul[8] = "stansque clamabat adversum falangas Israhel et dicebat eis quare venitis parati ad proelium numquid ego non sum Philistheus et vos servi Saul eligite ex vobis virum et descendat ad singulare certamen";
rsv[9] = "If he is able to fight with me and kill me, then we will be your servants; but if I prevail against him and kill him, then you shall be our servants and serve us.&quot;";
asv[9] = "If he be able to fight with me, and kill me, then will we be your servants; but if I prevail against him, and kill him, then shall ye be our servants, and serve us.";
yng[9] = "if he be able to fight with me, and have smitten me, then we have been to you for servants; and if I am able for him, and have smitten him, then ye have been to us for servants, and have served us.\'";
dby[9] = "If he be able to fight with me, and to smite me, then will we be your servants; but if I overcome and smite him, then shall ye be our servants and serve us.";
web[9] = "If he shall be able to fight with me, and to kill me, then will we be your servants: but if I shall prevail against him, and kill him, then shall ye be our servants, and serve us.";
hnv[9] = "If he be able to fight with me, and kill me, then will we be your servants; but if I prevail against him, and kill him, then shall you be our servants, and serve us.";
vul[9] = "si quiverit pugnare mecum et percusserit me erimus vobis servi si autem ego praevaluero et percussero eum vos servi eritis et servietis nobis";
rsv[10] = "And the Philistine said, &quot;I defy the ranks of Israel this day; give me a man, that we may fight together.&quot;";
asv[10] = "And the Philistine said, I defy the armies of Israel this day; give me a man, that we may fight together.";
yng[10] = "And the Philistine saith, `I have reproached the ranks of Israel this day; give to me a man, and we fight together.\'";
dby[10] = "And the Philistine said, I have defied the ranks of Israel this day; give me a man, that we may fight together.";
web[10] = "And the Philistine said, I defy the armies of Israel this day; give me a man, that we may fight together.";
hnv[10] = "The Pelishti said, I defy the armies of Yisra\'el this day; give me a man, that we may fight together.";
vul[10] = "et aiebat Philistheus ego exprobravi agminibus Israhelis hodie date mihi virum et ineat mecum singulare certamen";
rsv[11] = "When Saul and all Israel heard these words of the Philistine, they were dismayed and greatly afraid.";
asv[11] = "And when Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid.";
yng[11] = "And Saul heareth -- and all Israel -- these words of the Philistine, and they are broken down and greatly afraid.";
dby[11] = "And Saul and all Israel heard these words of the Philistine, and they were dismayed and greatly afraid.";
web[11] = "When Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid.";
hnv[11] = "When Sha\'ul and all Yisra\'el heard those words of the Pelishti, they were dismayed, and greatly afraid.";
vul[11] = "audiens autem Saul et omnes viri israhelitae sermones Philisthei huiuscemodi stupebant et metuebant nimis";
rsv[12] = "Now David was the son of an Eph\'rathite of Bethlehem in Judah, named Jesse, who had eight sons. In the days of Saul the man was already old and advanced in years.";
asv[12] = "Now David was the son of that Ephrathite of Beth-lehem-judah, whose name was Jesse; and he had eight sons: and the man was an old man in the days of Saul, stricken [in years] among men.";
yng[12] = "And David [is] son of this Ephrathite of Beth-Lehem-Judah, whose name [is] Jesse, and he hath eight sons, and the man in the days of Saul hath become aged among men;";
dby[12] = "Now David was the son of that Ephrathite of Bethlehem-Judah whose name was Jesse; and he had eight sons; and the man was old in the days of Saul, advanced [in years] among men.";
web[12] = "Now David [was] the son of that Ephrathite of Beth-lehem-judah, whose name [was] Jesse; and he had eight sons: and the man went among men [for] an old man in the days of Saul.";
hnv[12] = "Now David was the son of that Efratite of Beit-Lechem-Yehudah, whose name was Yishai; and he had eight sons: and the man was an old man in the days of Sha\'ul, stricken [in years] among men.";
vul[12] = "David autem erat filius viri ephrathei de quo supra dictum est de Bethleem Iuda cui erat nomen Isai qui habebat octo filios et erat vir in diebus Saul senex et grandevus inter viros";
rsv[13] = "The three eldest sons of Jesse had followed Saul to the battle; and the names of his three sons who went to the battle were Eli\'ab the first-born, and next to him Abin\'adab, and the third Shammah.";
asv[13] = "And the three eldest sons of Jesse had gone after Saul to the battle: and the names of his three sons that went to the battle were Eliab the first-born, and next unto him Abinadab, and the third Shammah.";
yng[13] = "and the three eldest sons of Jesse go, they have gone after Saul to battle; and the name of his three sons who have gone into battle [are] Eliab the first-born, and his second Abinadab, and the third Shammah.";
dby[13] = "And the three eldest of the sons of Jesse had gone and followed Saul to the battle; and the names of his three sons that went to the battle were Eliab the firstborn, and the second to him Abinadab, and the third Shammah.";
web[13] = "And the three eldest sons of Jesse went [and] followed Saul to the battle: and the names of his three sons that went to the battle [were] Eliab the first-born, and next to him Abinadab, and the third Shammah.";
hnv[13] = "The three eldest sons of Yishai had gone after Sha\'ul to the battle: and the names of his three sons who went to the battle were Eli\'av the firstborn, and next to him Avinadav, and the third Shammah.";
vul[13] = "abierunt autem tres filii eius maiores post Saul in proelium et nomina trium filiorum eius qui perrexerant ad bellum Heliab primogenitus et secundus Abinadab tertiusque Samma";
rsv[14] = "David was the youngest; the three eldest followed Saul,";
asv[14] = "And David was the youngest; and the three eldest followed Saul.";
yng[14] = "And David is the youngest, and the three eldest have gone after Saul,";
dby[14] = "And David was the youngest; and the three eldest had followed Saul.";
web[14] = "And David [was] the youngest: and the three eldest followed Saul.";
hnv[14] = "David was the youngest; and the three eldest followed Sha\'ul.";
vul[14] = "David autem erat minimus tribus ergo maioribus secutis Saulem";
rsv[15] = "but David went back and forth from Saul to feed his father\'s sheep at Bethlehem.";
asv[15] = "Now David went to and fro from Saul to feed his father\'s sheep at Beth-lehem.";
yng[15] = "and David is going and returning from Saul, to feed the flock of his father at Beth-Lehem.";
dby[15] = "But David went and returned from Saul to feed his father\'s sheep at Bethlehem.";
web[15] = "But David went and returned from Saul to feed his father\'s sheep at Beth-lehem.";
hnv[15] = "Now David went back and forth from Sha\'ul to feed his father\'s sheep at Beit-Lechem.";
vul[15] = "abiit David et reversus est a Saul ut pasceret gregem patris sui in Bethleem";
rsv[16] = "For forty days the Philistine came forward and took his stand, morning and evening.";
asv[16] = "And the Philistine drew near morning and evening, and presented himself forty days.";
yng[16] = "And the Philistine draweth nigh, morning and evening, and stationeth himself forty days.";
dby[16] = "And the Philistine drew near morning and evening, and presented himself forty days.";
web[16] = "And the Philistine drew near morning and evening, and presented himself forty days.";
hnv[16] = "The Pelishti drew near morning and evening, and presented himself forty days.";
vul[16] = "procedebat vero Philistheus mane et vespere et stabat quadraginta diebus";
rsv[17] = "And Jesse said to David his son, &quot;Take for your brothers an ephah of this parched grain, and these ten loaves, and carry them quickly to the camp to your brothers;";
asv[17] = "And Jesse said unto David his son, Take now for thy brethren an ephah of this parched grain, and these ten loaves, and carry [them] quickly to the camp to thy brethren;";
yng[17] = "And Jesse saith to David his son, `Take, I pray thee, to thy brethren, an ephah of this roasted [corn], and these ten loaves, and run to the camp to thy brethren;";
dby[17] = "And Jesse said to David his son, Take, I pray, for thy brethren, this ephah of parched [corn] and these ten loaves, and carry them quickly to the camp to thy brethren;";
web[17] = "And Jesse said to David his son, Take now for thy brethren an ephah of this parched [corn], and these ten loaves, and run to the camp to thy brethren;";
hnv[17] = "Yishai said to David his son, Take now for your brothers an efah of this parched grain, and these ten loaves, and carry [them] quickly to the camp to your brothers;";
vul[17] = "dixit autem Isai ad David filium suum accipe fratribus tuis oephi pulentae et decem panes istos et curre in castra ad fratres tuos";
rsv[18] = "also take these ten cheeses to the commander of their thousand. See how your brothers fare, and bring some token from them.&quot;";
asv[18] = "and bring these ten cheeses unto the captain of their thousand, and look how thy brethren fare, and take their pledge.";
yng[18] = "and these ten cuttings of the cheese thou dost take in to the head of the thousand, and thy brethren thou dost inspect for welfare, and their pledge dost receive.\'";
dby[18] = "and carry these ten cheeses to the captain of the thousand, and visit thy brethren to see how they are, and take a pledge of them.";
web[18] = "And carry these ten cheeses to the captain of [their] thousand, and see how thy brethren fare, and take their pledge.";
hnv[18] = "and bring these ten cheeses to the captain of their thousand, and look how your brothers fare, and take their pledge.";
vul[18] = "et decem formellas casei has deferes ad tribunum et fratres tuos visitabis si recte agant et cum quibus ordinati sint disce";
rsv[19] = "Now Saul, and they, and all the men of Israel, were in the valley of Elah, fighting with the Philistines.";
asv[19] = "Now Saul, and they, and all the men of Israel, were in the vale of Elah, fighting with the Philistines.";
yng[19] = "And Saul, and they, and all the men of Israel [are] in the valley of Elah, fighting with the Philistines.";
dby[19] = "Now Saul, and they, and all the men of Israel [were] in the valley of terebinths, fighting against the Philistines.";
web[19] = "Now Saul, and they, and all the men of Israel, [were] in the valley of Elah, fighting with the Philistines.";
hnv[19] = "Now Sha\'ul, and they, and all the men of Yisra\'el, were in the valley of Elah, fighting with the Pelishtim.";
vul[19] = "Saul autem et illi et omnes filii Israhel in valle Terebinthi pugnabant adversum Philisthim";
rsv[20] = "And David rose early in the morning, and left the sheep with a keeper, and took the provisions, and went, as Jesse had commanded him; and he came to the encampment as the host was going forth to the battle line, shouting the war cry.";
asv[20] = "And David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him; and he came to the place of the wagons, as the host which was going forth to the fight shouted for the battle.";
yng[20] = "And David riseth early in the morning, and leaveth the flock to a keeper, and lifteth up, and goeth, as Jesse commanded him, and he cometh in to the path, and to the force which is going out unto the rank, and they have shouted for battle;";
dby[20] = "And David rose up early in the morning, and left the sheep with a keeper, and took his charge and went, as Jesse had commanded him. And he came to the wagon-defence; and the host which was going forth to the battle-array shouted for the fight.";
web[20] = "And David rose early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him; and he came to the trench, as the host was going forth to the fight, and shouted for the battle.";
hnv[20] = "David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Yishai had commanded him; and he came to the place of the wagons, as the host which was going forth to the fight shouted for the battle.";
vul[20] = "surrexit itaque David mane et commendavit gregem custodi et onustus abiit sicut praeceperat ei Isai et venit ad locum Magala et ad exercitum qui egressus ad pugnam vociferatus erat in certamine";
rsv[21] = "And Israel and the Philistines drew up for battle, army against army.";
asv[21] = "And Israel and the Philistines put the battle in array, army against army.";
yng[21] = "and Israel and the Philistines set in array rank to meet rank.";
dby[21] = "And Israel and the Philistines put the battle in array, rank against rank.";
web[21] = "For Israel and the Philistines had put the battle in array, army against army.";
hnv[21] = "Yisra\'el and the Pelishtim put the battle in array, army against army.";
vul[21] = "direxerat enim aciem Israhel sed et Philisthim ex adverso fuerant praeparati";
rsv[22] = "And David left the things in charge of the keeper of the baggage, and ran to the ranks, and went and greeted his brothers.";
asv[22] = "And David left his baggage in the hand of the keeper of the baggage, and ran to the army, and came and saluted his brethren.";
yng[22] = "And David letteth down the goods from off him on the hand of a keeper of the goods, and runneth into the rank, and cometh and asketh of his brethren of welfare.";
dby[22] = "And David left the things he was carrying in the hand of the keeper of the baggage, and ran into the ranks, and came and saluted his brethren.";
web[22] = "And David left his furniture in the hand of the keeper of the vessels, and ran into the army, and came and saluted his brethren.";
hnv[22] = "David left his baggage in the hand of the keeper of the baggage, and ran to the army, and came and greeted his brothers.";
vul[22] = "derelinquens ergo David vasa quae adtulerat sub manu custodis ad sarcinas cucurrit ad locum certaminis et interrogabat si omnia recte agerentur erga fratres suos";
rsv[23] = "As he talked with them, behold, the champion, the Philistine of Gath, Goliath by name, came up out of the ranks of the Philistines, and spoke the same words as before. And David heard him.";
asv[23] = "And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, out of the ranks of the Philistines, and spake according to the same words: and David heard them.";
yng[23] = "And he is speaking with them, and lo, a man of the duellists is coming up, Goliath the Philistine [is] his name, of Gath, out of the ranks of the Philistines, and he speaketh according to those words, and David heareth;";
dby[23] = "And as he talked with them, behold there came up the champion, the Philistine of Gath, Goliath by name, out of the ranks of the Philistines, and spoke according to the same words; and David heard [them].";
web[23] = "And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, from the armies of the Philistines, and spoke according to the same words: and David heard [them].";
hnv[23] = "As he talked with them, behold, there came up the champion, the Pelishti of Gat, Golyat by name, out of the ranks of the Pelishtim, and spoke according to the same words: and David heard them.";
vul[23] = "cumque adhuc ille loqueretur eis apparuit vir ille spurius ascendens Goliath nomine Philistheus de Geth ex castris Philisthinorum et loquente eo haec eadem verba audivit David";
rsv[24] = "All the men of Israel, when they saw the man, fled from him, and were much afraid.";
asv[24] = "And all the men of Israel, when they saw the man, fled from him, and were sore afraid.";
yng[24] = "and all the men of Israel when they see the man flee from his presence, and are greatly afraid.";
dby[24] = "And all the men of Israel, when they saw the man, fled from him and were greatly afraid.";
web[24] = "And all the men of Israel, when they saw the man, fled from him, and were exceedingly afraid.";
hnv[24] = "All the men of Yisra\'el, when they saw the man, fled from him, and were sore afraid.";
vul[24] = "omnes autem Israhelitae cum vidissent virum fugerunt a facie eius timentes eum valde";
rsv[25] = "And the men of Israel said, &quot;Have you seen this man who has come up? Surely he has come up to defy Israel; and the man who kills him, the king will enrich with great riches, and will give him his daughter, and make his father\'s house free in Israel.&quot;";
asv[25] = "And the men of Israel said, Have ye seen this man that is come up? surely to defy Israel is he come up: and it shall be, that the man who killeth him, the king will enrich him with great riches, and will give him his daughter, and make his father\'s house free in Israel.";
yng[25] = "And the men of Israel say, `Have ye seen this man who is coming up? for, to reproach Israel he is coming up, and it hath been -- the man who smiteth him, the king doth enrich him with great riches, and his daughter he doth give to him, and his father\'s house doth make free in Israel.\'";
dby[25] = "And the men of Israel said, Have ye seen this man that comes up? for to defy Israel is he come up: and it shall be, that the man who smites him, him will the king enrich with great riches, and will give him his daughter, and make his father\'s house free in Israel.";
web[25] = "And the men of Israel said, Have ye seen this man that hath come up? surely to defy Israel hath he come: and it shall be, [that] the man who shall kill him, the king will enrich him with great riches, and will give him his daughter, and make his father\'s house free in Israel.";
hnv[25] = "The men of Yisra\'el said, Have you seen this man who is come up? surely to defy Yisra\'el is he come up: and it shall be, that the man who kills him, the king will enrich him with great riches, and will give him his daughter, and make his father\'s house free in Yisra\'el.";
vul[25] = "et dixit unus quispiam de Israhel num vidisti virum hunc qui ascendit ad exprobrandum enim Israheli ascendit virum ergo qui percusserit eum ditabit rex divitiis magnis et filiam suam dabit ei et domum patris eius faciet absque tributo in Israhel";
rsv[26] = "And David said to the men who stood by him, &quot;What shall be done for the man who kills this Philistine, and takes away the reproach from Israel? For who is this uncircumcised Philistine, that he should defy the armies of the living God?&quot;";
asv[26] = "And David spake to the men that stood by him, saying, What shall be done to the man that killeth this Philistine, and taketh away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?";
yng[26] = "And David speaketh unto the men who are standing by him, saying, `What is done to the man who smiteth this Philistine, and hath turned aside reproach from Israel? for who [is] this uncircumcised Philistine that he hath reproached the ranks of the living God?\'";
dby[26] = "And David spoke to the men that stood by him, saying, What shall be done to the man that smites this Philistine, and takes away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?";
web[26] = "And David spoke to the men that stood by him, saying, What shall be done to the man that killeth this Philistine, and taketh away the reproach from Israel? for who [is] this uncircumcised Philistine, that he should defy the armies of the living God?";
hnv[26] = "David spoke to the men who stood by him, saying, What shall be done to the man who kills this Pelishti, and takes away the reproach from Yisra\'el? for who is this uncircumcised Pelishti, that he should defy the armies of the living God?";
vul[26] = "et ait David ad viros qui stabant secum dicens quid dabitur viro qui percusserit Philistheum hunc et tulerit obprobrium de Israhel quis est enim hic Philistheus incircumcisus qui exprobravit acies Dei viventis";
rsv[27] = "And the people answered him in the same way, &quot;So shall it be done to the man who kills him.&quot;";
asv[27] = "And the people answered him after this manner, saying, So shall it be done to the man that killeth him.";
yng[27] = "And the people speak to him according to this word, saying, `Thus it is done to the man who smiteth him.\'";
dby[27] = "And the people told him after this manner, saying, So shall it be done to the man that smites him.";
web[27] = "And the people answered him after this manner, saying, So shall it be done to the man that killeth him.";
hnv[27] = "The people answered him after this manner, saying, So shall it be done to the man who kills him.";
vul[27] = "referebat autem ei populus eundem sermonem dicens haec dabuntur viro qui percusserit eum";
rsv[28] = "Now Eli\'ab his eldest brother heard when he spoke to the men; and Eli\'ab\'s anger was kindled against David, and he said, &quot;Why have you come down? And with whom have you left those few sheep in the wilderness? I know your presumption, and the evil of your heart; for you have come down to see the battle.&quot;";
asv[28] = "And Eliab his eldest brother heard when he spake unto the men; and Eliab\'s anger was kindled against David, and he said, Why art thou come down? and with whom hast thou left those few sheep in the wilderness? I know thy pride, and the naughtiness of thy heart; for thou art come down that thou mightest see the battle.";
yng[28] = "And Eliab, his eldest brother, heareth when he speaketh unto the men, and the anger of Eliab burneth against David, and he saith, `Why [is] this -- thou hast come down! and to whom hast thou left those few sheep in the wilderness? I have known thy pride, and the evil of thy heart -- for, to see the battle thou hast come down.\'";
dby[28] = "And Eliab, his eldest brother, heard while he spoke to the men; and Eliab\'s anger was kindled against David, and he said, Why art thou come down? and with whom hast thou left those few sheep in the wilderness? I know thy pride and the naughtiness of thy heart; for thou art come down that thou mightest see the battle.";
web[28] = "And Eliab his eldest brother heard when he spoke to the men; and Eliab\'s anger was kindled against David, and he said, Why camest thou down hither? and with whom hast thou left those few sheep in the wilderness? I know thy pride, and the naughtiness of thy heart; for thou art come down that thou mayest see the battle.";
hnv[28] = "Eli\'av his eldest brother heard when he spoke to the men; and Eli\'av\'s anger was kindled against David, and he said, Why are you come down? and with whom have you left those few sheep in the wilderness? I know your pride, and the naughtiness of your heart; for you have come down that you might see the battle.";
vul[28] = "quod cum audisset Heliab frater eius maior loquente eo cum aliis iratus est contra David et ait quare venisti et quare dereliquisti pauculas oves illas in deserto ego novi superbiam tuam et nequitiam cordis tui quia ut videres proelium descendisti";
rsv[29] = "And David said, &quot;What have I done now? Was it not but a word?&quot;";
asv[29] = "And David said, What have I now done? Is there not a cause?";
yng[29] = "And David saith, `What have I done now? is it not a word?\'";
dby[29] = "And David said, What have I now done? Was it not laid upon me?";
web[29] = "And David said, What have I now done? [Is there] not a cause?";
hnv[29] = " David said, What have I now done? Is there not a cause?";
vul[29] = "et dixit David quid feci numquid non verbum est";
rsv[30] = "And he turned away from him toward another, and spoke in the same way; and the people answered him again as before.";
asv[30] = "And he turned away from him toward another, and spake after the same manner: and the people answered him again after the former manner.";
yng[30] = "And he turneth round from him unto another, and saith according to this word, and the people return him word as the first word.";
dby[30] = "And he turned from him to another, and spoke after the same manner; and the people answered him again after the former manner.";
web[30] = "And he turned from him towards another, and spoke after the same manner: and the people answered him again after the former manner.";
hnv[30] = "He turned away from him toward another, and spoke after the same manner: and the people answered him again after the former manner.";
vul[30] = "et declinavit paululum ab eo ad alium dixitque eundem sermonem et respondit ei populus verbum sicut et prius";
rsv[31] = "When the words which David spoke were heard, they repeated them before Saul; and he sent for him.";
asv[31] = "And when the words were heard which David spake, they rehearsed them before Saul; and he sent for him.";
yng[31] = "And the words which David hath spoken are heard, and they declare before Saul, and he receiveth him;";
dby[31] = "And the words were heard which David spoke, and they rehearsed them before Saul; and he sent for him.";
web[31] = "And when the words were heard which David spoke, they rehearsed [them] before Saul: and he sent for him.";
hnv[31] = "When the words were heard which David spoke, they rehearsed them before Sha\'ul; and he sent for him.";
vul[31] = "audita sunt autem verba quae locutus est David et adnuntiata in conspectu Saul";
rsv[32] = "And David said to Saul, &quot;Let no man\'s heart fail because of him; your servant will go and fight with this Philistine.&quot;";
asv[32] = "And David said to Saul, Let no man\'s heart fail because of him; thy servant will go and fight with this Philistine.";
yng[32] = "and David saith unto Saul, `Let no man\'s heart fall because of him, thy servant doth go, and hath fought with this Philistine.\'";
dby[32] = "And David said to Saul, Let no man\'s heart fail because of him: thy servant will go and fight with this Philistine.";
web[32] = "And David said to Saul, Let no man\'s heart fail because of him; thy servant will go and fight with this Philistine.";
hnv[32] = "David said to Sha\'ul, Let no man\'s heart fail because of him; your servant will go and fight with this Pelishti.";
vul[32] = "ad quem cum fuisset adductus locutus est ei non concidat cor cuiusquam in eo ego servus tuus vadam et pugnabo adversus Philistheum";
rsv[33] = "And Saul said to David, &quot;You are not able to go against this Philistine to fight with him; for you are but a youth, and he has been a man of war from his youth.&quot;";
asv[33] = "And Saul said to David, Thou art not able to go against this Philistine to fight with him; for thou art but a youth, and he a man of war from his youth.";
yng[33] = "And Saul saith unto David, `Thou art not able to go unto this Philistine, to fight with him, for a youth thou [art], and he a man of war from his youth.\'";
dby[33] = "And Saul said to David, Thou art not able to go against this Philistine to fight with him; for thou art but a youth, and he a man of war from his youth.";
web[33] = "And Saul said to David, Thou art not able to go against this Philistine to fight with him: for thou [art but] a youth, and he a man of war from his youth.";
hnv[33] = "Sha\'ul said to David, You are not able to go against this Pelishti to fight with him; for you are but a youth, and he a man of war from his youth.";
vul[33] = "et ait Saul ad David non vales resistere Philistheo isti nec pugnare adversum eum quia puer es hic autem vir bellator ab adulescentia sua";
rsv[34] = "But David said to Saul, &quot;Your servant used to keep sheep for his father; and when there came a lion, or a bear, and took a lamb from the flock,";
asv[34] = "And David said unto Saul, Thy servant was keeping his father\'s sheep; and when there came a lion, or a bear, and took a lamb out of the flock,";
yng[34] = "And David saith unto Saul, `A shepherd hath thy servant been to his father among the sheep, and the lion hath come -- and the bear -- and hath taken away a sheep out of the drove,";
dby[34] = "And David said to Saul, Thy servant fed his father\'s sheep, and there came a lion, and also a bear, and took a lamb out of the flock.";
web[34] = "And David said to Saul, Thy servant kept his father\'s sheep, and there came a lion, and a bear, and took a lamb out of the flock:";
hnv[34] = "David said to Sha\'ul, Your servant was keeping his father\'s sheep; and when there came a lion, or a bear, and took a lamb out of the flock,";
vul[34] = "dixitque David ad Saul pascebat servus tuus patris sui gregem et veniebat leo vel ursus tollebatque arietem de medio gregis";
rsv[35] = "I went after him and smote him and delivered it out of his mouth; and if he arose against me, I caught him by his beard, and smote him and killed him.";
asv[35] = "I went out after him, and smote him, and delivered it out of his mouth; and when he arose against me, I caught him by his beard, and smote him, and slew him.";
yng[35] = "and I have gone out after him, and smitten him, and delivered out of his mouth, and he riseth against me, and I have taken hold on his beard, and smitten him, and put him to death.";
dby[35] = "And I went after him, and smote him, and delivered it out of his mouth; and when he arose against me, I seized him by his beard, and smote him, and slew him.";
web[35] = "And I went after him, and smote him, and delivered [it] out of his mouth: and when he arose against me, I caught [him] by his beard, and smote him, and slew him.";
hnv[35] = "I went out after him, and struck him, and delivered it out of his mouth; and when he arose against me, I caught him by his beard, and struck him, and killed him.";
vul[35] = "et sequebar eos et percutiebam eruebamque de ore eorum et illi consurgebant adversum me et adprehendebam mentum eorum et suffocabam interficiebamque eos";
rsv[36] = "Your servant has killed both lions and bears; and this uncircumcised Philistine shall be like one of them, seeing he has defied the armies of the living God.&quot;";
asv[36] = "Thy servant smote both the lion and the bear: and this uncircumcised Philistine shall be as one of them, seeing he hath defied the armies of the living God.";
yng[36] = "Both the lion and the bear hath thy servant smitten, and this uncircumcised Philistine hath been as one of them, for he hath reproached the ranks of the living God.\'";
dby[36] = "Thy servant smote both the lion and the bear; and this uncircumcised Philistine shall be as one of them, because he has defied the armies of the living God.";
web[36] = "Thy servant slew both the lion and the bear: and this uncircumcised Philistine shall be as one of them, seeing he hath defied the armies of the living God.";
hnv[36] = "Your servant struck both the lion and the bear: and this uncircumcised Pelishti shall be as one of them, seeing he has defied the armies of the living God.";
vul[36] = "nam et leonem et ursum interfeci ego servus tuus erit igitur et Philistheus hic incircumcisus quasi unus ex eis quia ausus est maledicere exercitum Dei viventis";
rsv[37] = "And David said, &quot;The LORD who delivered me from the paw of the lion and from the paw of the bear, will deliver me from the hand of this Philistine.&quot; And Saul said to David, &quot;Go, and the LORD be with you!&quot;";
asv[37] = "And David said, Jehovah that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said unto David, Go, and Jehovah shall be with thee.";
yng[37] = "And David saith, `Jehovah, who delivered me out of the paw of the lion, and out of the paw of the bear, He doth deliver me from the hand of this Philistine.\' And Saul saith unto David, `Go, and Jehovah is with thee.\'";
dby[37] = "And David said, Jehovah who delivered me out of the paw of the lion and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said to David, Go, and Jehovah be with thee.";
web[37] = "David said moreover, The LORD that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said to David, Go, and the LORD be with thee.";
hnv[37] = "David said, the LORD who delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Pelishti. Sha\'ul said to David, Go, and the LORD shall be with you.";
vul[37] = "et ait David Dominus qui eruit me de manu leonis et de manu ursi ipse liberabit me de manu Philisthei huius dixit autem Saul ad David vade et Dominus tecum sit";
rsv[38] = "Then Saul clothed David with his armor; he put a helmet of bronze on his head, and clothed him with a coat of mail.";
asv[38] = "And Saul clad David with his apparel, and he put a helmet of brass upon his head, and he clad him with a coat of mail.";
yng[38] = "And Saul clotheth David with his long robe, and hath put a helmet of brass on his head, and doth clothe him with a coat of mail.";
dby[38] = "And Saul clothed David with his dress, and put a helmet of bronze upon his head, and clothed him with a corselet.";
web[38] = "And Saul armed David with his armor, and he put a helmet of brass upon his head; also he armed him with a coat of mail.";
hnv[38] = "Sha\'ul clad David with his clothing, and he put a helmet of brass on his head, and he clad him with a coat of mail.";
vul[38] = "et induit Saul David vestimentis suis et inposuit galeam aeream super caput eius et vestivit eum lorica";
rsv[39] = "And David girded his sword over his armor, and he tried in vain to go, for he was not used to them. Then David said to Saul, &quot;I cannot go with these; for I am not used to them.&quot; And David put them off.";
asv[39] = "And David girded his sword upon his apparel, and he assayed to go; for he had not proved it. And David said unto Saul, I cannot go with these; for I have not proved them. And David put them off him.";
yng[39] = "And David girded his sword above his long robe, and beginneth to go, for he hath not tried [it]; and David saith unto Saul, `I am not able to go with these, for I had not tried;\' and David turneth them aside from off him.";
dby[39] = "And David girded his sword upon his dress, and endeavoured to go; for he had not yet tried [it]. And David said to Saul, I cannot go in these; for I have never tried [them]. And David put them off him.";
web[39] = "And David girded his sword upon his armor, and he essayed to go; for he had not proved [it]. And David said to Saul, I cannot go with these, for I have not proved [them]. And David put them off from him.";
hnv[39] = "David girded his sword on his clothing, and he tried to go; for he had not proved it. David said to Sha\'ul, I can\'t go with these; for I have not proved them. David put them off him.";
vul[39] = "accinctus ergo David gladio eius super veste sua coepit temptare si armatus posset incedere non enim habebat consuetudinem dixitque David ad Saul non possum sic incedere quia nec usum habeo et deposuit ea";
rsv[40] = "Then he took his staff in his hand, and chose five smooth stones from the brook, and put them in his shepherd\'s bag or wallet; his sling was in his hand, and he drew near to the Philistine.";
asv[40] = "And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in the shepherd\'s bag which he had, even in his wallet; and his sling was in his hand: and he drew near to the Philistine.";
yng[40] = "And he taketh his staff in his hand, and chooseth for him five smooth stones from the brook, and putteth them in the shepherds\' habiliments that he hath, even in the scrip, and his sling [is] in his hand, and he draweth nigh unto the Philistine.";
dby[40] = "And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in the shepherd\'s bag that he had, into the pocket; and his sling was in his hand. And he drew near to the Philistine.";
web[40] = "And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in a shepherd\'s bag which he had, even in a scrip; and his sling [was] in his hand; and he drew near to the Philistine.";
hnv[40] = "He took his staff in his hand, and chose him five smooth stones out of the brook, and put them in the shepherd\'s bag which he had, even in his wallet; and his sling was in his hand: and he drew near to the Pelishti.";
vul[40] = "et tulit baculum suum quem semper habebat in manibus et elegit sibi quinque limpidissimos lapides de torrente et misit eos in peram pastoralem quam habebat secum et fundam manu tulit et processit adversum Philistheum";
rsv[41] = "And the Philistine came on and drew near to David, with his shield-bearer in front of him.";
asv[41] = "And the Philistine came on and drew near unto David; and the man that bare the shield went before him.";
yng[41] = "And the Philistine goeth on, going and drawing near unto David, and the man bearing the buckler [is] before him,";
dby[41] = "And the Philistine came on and approached David; and the man that bore the shield was before him.";
web[41] = "And the Philistine advanced and drew near to David; and the man that bore the shield [went] before him.";
hnv[41] = "The Pelishti came on and drew near to David; and the man who bore the shield went before him.";
vul[41] = "ibat autem Philistheus incedens et adpropinquans adversum David et armiger eius ante eum";
rsv[42] = "And when the Philistine looked, and saw David, he disdained him; for he was but a youth, ruddy and comely in appearance.";
asv[42] = "And when the Philistine looked about, and saw David, he disdained him; for he was but a youth, and ruddy, and withal of a fair countenance.";
yng[42] = "and the Philistine looketh attentively, and seeth David, and despiseth him, for he was a youth, and ruddy, with a fair appearance.";
dby[42] = "And when the Philistine looked about and saw David, he disdained him; for he was a youth, and ruddy, and besides of a beautiful countenance.";
web[42] = "And when the Philistine looked about, and saw David, he disdained him: for he was a youth, and ruddy, and of a fair countenance.";
hnv[42] = "When the Pelishti looked about, and saw David, he disdained him; for he was but a youth, and ruddy, and withal of a fair face.";
vul[42] = "cumque inspexisset Philistheus et vidisset David despexit eum erat enim adulescens rufus et pulcher aspectu";
rsv[43] = "And the Philistine said to David, &quot;Am I a dog, that you come to me with sticks?&quot; And the Philistine cursed David by his gods.";
asv[43] = "And the Philistine said unto David, Am I a dog, that thou comest to me with staves? And the Philistine cursed David by his gods.";
yng[43] = "And the Philistine saith unto David, `Am I a dog that thou art coming unto me with staves?\' and the Philistine revileth David by his gods,";
dby[43] = "And the Philistine said to David, Am I a dog, that thou comest to me with staves? And the Philistine cursed David by his gods.";
web[43] = "And the Philistine said to David, [Am] I a dog, that thou comest to me with staffs? and the Philistine cursed David by his gods.";
hnv[43] = "The Pelishti said to David, Am I a dog, that you come to me with sticks? The Pelishti cursed David by his gods.";
vul[43] = "et dixit Philistheus ad David numquid ego canis sum quod tu venis ad me cum baculo et maledixit Philistheus David in diis suis";
rsv[44] = "The Philistine said to David, &quot;Come to me, and I will give your flesh to the birds of the air and to the beasts of the field.&quot;";
asv[44] = "And the Philistine said to David, Come to me, and I will give thy flesh unto the birds of the heavens, and to the beasts of the field.";
yng[44] = "and the Philistine saith unto David, `Come unto me, and I give thy flesh to the fowl of the heavens, and to the beast of the field.\'";
dby[44] = "And the Philistine said to David, Come to me, and I will give thy flesh to the fowls of the heavens and to the beasts of the field.";
web[44] = "And the Philistine said to David, Come to me, and I will give thy flesh to the fowls of the air, and to the beasts of the field.";
hnv[44] = "The Pelishti said to David, Come to me, and I will give your flesh to the birds of the sky, and to the animals of the field.";
vul[44] = "dixitque ad David veni ad me et dabo carnes tuas volatilibus caeli et bestiis terrae";
rsv[45] = "Then David said to the Philistine, &quot;You come to me with a sword and with a spear and with a javelin; but I come to you in the name of the LORD of hosts, the God of the armies of Israel, whom you have defied.";
asv[45] = "Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a javelin: but I come to thee in the name of Jehovah of hosts, the God of the armies of Israel, whom thou hast defied.";
yng[45] = "And David saith unto the Philistine, `Thou art coming unto me with sword, and with spear, and with buckler, and I am coming unto thee in the name of Jehovah of Hosts, God of the ranks of Israel, which thou hast reproached.";
dby[45] = "And David said to the Philistine, Thou comest to me with sword, and with spear, and with javelin; but I come to thee in the name of Jehovah of hosts, the God of the armies of Israel, whom thou hast defied.";
web[45] = "Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast defied.";
hnv[45] = "Then said David to the Pelishti, You come to me with a sword, and with a spear, and with a javelin: but I come to you in the name of the LORD of hosts, the God of the armies of Yisra\'el, whom you have defied.";
vul[45] = "dixit autem David ad Philistheum tu venis ad me cum gladio et hasta et clypeo ego autem venio ad te in nomine Domini exercituum Dei agminum Israhel quibus exprobrasti";
rsv[46] = "This day the LORD will deliver you into my hand, and I will strike you down, and cut off your head; and I will give the dead bodies of the host of the Philistines this day to the birds of the air and to the wild beasts of the earth; that all the earth may know that there is a God in Israel,";
asv[46] = "This day will Jehovah deliver thee into my hand; and I will smite thee, and take thy head from off thee; and I will give the dead bodies of the host of the Philistines this day unto the birds of the heavens, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel,";
yng[46] = "This day doth Jehovah shut thee up into my hand -- and I have smitten thee, and turned aside thy head from off thee, and given the carcase of the camp of the Philistines this day to the fowl of the heavens, and to the beast of the earth, and all the earth do know that God is for Israel.";
dby[46] = "This day will Jehovah deliver thee up into my hand; and I will smite thee, and take thy head from thee; and I will give the carcases of the camp of the Philistines this day to the fowl of the heavens and to the wild beasts of the earth. And all the earth shall know that Israel has a God;";
web[46] = "This day will the LORD deliver thee into my hand; and I will smite thee, and take thy head from thee; and I will give the carcasses of the host of the Philistines this day to the fowls of the air, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel.";
hnv[46] = "This day will the LORD deliver you into my hand; and I will strike you, and take your head from off you; and I will give the dead bodies of the host of the Pelishtim this day to the birds of the sky, and to the wild animals of the eretz; that all the eretz may know that there is a God in Yisra\'el,";
vul[46] = "hodie et dabit te Dominus in manu mea et percutiam te et auferam caput tuum a te et dabo cadaver castrorum Philisthim hodie volatilibus caeli et bestiis terrae ut sciat omnis terra quia est Deus in Israhel";
rsv[47] = "and that all this assembly may know that the LORD saves not with sword and spear; for the battle is the LORD\'S and he will give you into our hand.&quot;";
asv[47] = "and that all this assembly may know that Jehovah saveth not with sword and spear: for the battle is Jehovah\'s, and he will give you into our hand.";
yng[47] = "and all this assembly do know that not by sword and by spear doth Jehovah save, that the battle [is] Jehovah\'s, and He hath given you into our hand.\'";
dby[47] = "and all this congregation shall know that Jehovah saves not with sword and spear; for the battle is Jehovah\'s, and he will give you into our hands.";
web[47] = "And all this assembly shall know that the LORD saveth not with sword and spear: for the battle [is] the LORD\'S, and he will give you into our hands.";
hnv[47] = "and that all this assembly may know that the LORD doesn\'t save with sword and spear: for the battle is the LORD\'s, and he will give you into our hand.";
vul[47] = "et noverit universa ecclesia haec quia non in gladio nec in hasta salvat Dominus ipsius est enim bellum et tradet vos in manus nostras";
rsv[48] = "When the Philistine arose and came and drew near to meet David, David ran quickly toward the battle line to meet the Philistine.";
asv[48] = "And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hastened, and ran toward the army to meet the Philistine.";
yng[48] = "And it hath come to pass, that the Philistine hath risen, and goeth, and draweth near to meet David, and David hasteth and runneth to the rank to meet the Philistine,";
dby[48] = "And it came to pass, when the Philistine arose, and came and advanced to meet David, that David hasted, and ran towards the ranks to meet the Philistine.";
web[48] = "And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hasted, and ran towards the army to meet the Philistine.";
hnv[48] = " It happened, when the Pelishti arose, and came and drew near to meet David, that David hurried, and ran toward the army to meet the Pelishti.";
vul[48] = "cum ergo surrexisset Philistheus et veniret et adpropinquaret contra David festinavit David et cucurrit ad pugnam ex adverso Philisthei";
rsv[49] = "And David put his hand in his bag and took out a stone, and slung it, and struck the Philistine on his forehead; the stone sank into his forehead, and he fell on his face to the ground.";
asv[49] = "And David put his hand in his bag, and took thence a stone, and slang it, and smote the Philistine in his forehead; and the stone sank into his forehead, and he fell upon his face to the earth.";
yng[49] = "and David putteth forth his hand unto the vessel, and taketh thence a stone, and slingeth, and smiteth the Philistine on his forehead, and the stone sinketh into his forehead, and he falleth on his face to the earth.";
dby[49] = "And David put his hand into the bag, and took thence a stone, and slang it, and smote the Philistine in his forehead, and the stone sank into his forehead; and he fell on his face to the earth.";
web[49] = "And David put his hand in his bag, and took thence a stone, and hurled it with his sling, and smote the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth.";
hnv[49] = "David put his hand in his bag, and took there a stone, and slang it, and struck the Pelishti in his forehead; and the stone sank into his forehead, and he fell on his face to the eretz.";
vul[49] = "et misit manum suam in peram tulitque unum lapidem et funda iecit et percussit Philistheum in fronte et infixus est lapis in fronte eius et cecidit in faciem suam super terram";
rsv[50] = "So David prevailed over the Philistine with a sling and with a stone, and struck the Philistine, and killed him; there was no sword in the hand of David.";
asv[50] = "So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but there was no sword in the hand of David.";
yng[50] = "And David is stronger than the Philistine with a sling and with a stone, and smiteth the Philistine, and putteth him to death, and there is no sword in the hand of David,";
dby[50] = "So David overcame the Philistine with a sling and a stone, and smote the Philistine and killed him; and there was no sword in the hand of David.";
web[50] = "So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but [there was] no sword in the hand of David.";
hnv[50] = "So David prevailed over the Pelishti with a sling and with a stone, and struck the Pelishti, and killed him; but there was no sword in the hand of David.";
vul[50] = "praevaluitque David adversus Philistheum in funda et in lapide percussumque Philistheum interfecit cumque gladium non haberet in manu David";
rsv[51] = "Then David ran and stood over the Philistine, and took his sword and drew it out of its sheath, and killed him, and cut off his head with it. When the Philistines saw that their champion was dead, they fled.";
asv[51] = "Then David ran, and stood over the Philistine, and took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith. And when the Philistines saw that their champion was dead, they fled.";
yng[51] = "and David runneth and standeth over the Philistine, and taketh his sword, and draweth it out of its sheath, and putteth him to death, and cutteth off with it his head; and the Philistines see that their hero [is] dead, and flee.";
dby[51] = "And David ran, and stood upon the Philistine, and took his sword, and drew it out of its sheath, and killed him completely, and cut off his head with it. And when the Philistines saw that their hero was dead, they fled.";
web[51] = "Therefore David ran and stood upon the Philistine, and took his sword, and drew it out of its sheath, and slew him, and cut off his head with it. And when the Philistines saw their champion was dead, they fled.";
hnv[51] = "Then David ran, and stood over the Pelishti, and took his sword, and drew it out of the sheath of it, and killed him, and cut off his head therewith. When the Pelishtim saw that their champion was dead, they fled.";
vul[51] = "cucurrit et stetit super Philistheum et tulit gladium eius et eduxit de vagina sua et interfecit eum praeciditque caput eius videntes autem Philisthim quod mortuus esset fortissimus eorum fugerunt";
rsv[52] = "And the men of Israel and Judah rose with a shout and pursued the Philistines as far as Gath and the gates of Ekron, so that the wounded Philistines fell on the way from Sha-ara\'im as far as Gath and Ekron.";
asv[52] = "And the men of Israel and of Judah arose, and shouted, and pursued the Philistines, until thou comest to Gai, and to the gates of Ekron. And the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron.";
yng[52] = "And the men of Israel rise -- also Judah -- and shout, and pursue the Philistines till thou enter the valley, and unto the gates of Ekron, and the wounded of the Philistines fall in the way of Shaaraim, even unto Gath, and unto Ekron,";
dby[52] = "And the men of Israel and of Judah arose, and shouted, and pursued the Philistines, until thou comest to the ravine and to the gates of Ekron. And the wounded of the Philistines fell down on the way to Shaaraim, even to Gath, and to Ekron.";
web[52] = "And the men of Israel and of Judah arose, and shouted, and pursued the Philistines to the entrance of the valley, and to the gates of Ekron. And the wounded of the Philistines fell down by the way to Shaaraim, even to Gath, and to Ekron.";
hnv[52] = "The men of Yisra\'el and of Yehudah arose, and shouted, and pursued the Pelishtim, until you come to Gai, and to the gates of `Ekron. The wounded of the Pelishtim fell down by the way to Sha`arayim, even to Gat, and to `Ekron.";
vul[52] = "et consurgentes viri Israhel et Iuda vociferati sunt et persecuti Philistheos usque dum venirent in vallem et usque ad portas Accaron cecideruntque vulnerati de Philisthim in via Sarim usque ad Geth et usque Accaron";
rsv[53] = "And the Israelites came back from chasing the Philistines, and they plundered their camp.";
asv[53] = "And the children of Israel returned from chasing after the Philistines, and they plundered their camp.";
yng[53] = "and the sons of Israel turn back from burning after the Philistines, and spoil their camps.";
dby[53] = "And the children of Israel returned from chasing after the Philistines, and they pillaged their camps.";
web[53] = "And the children of Israel returned from chasing the Philistines, and they plundered their tents.";
hnv[53] = "The children of Yisra\'el returned from chasing after the Pelishtim, and they plundered their camp.";
vul[53] = "et revertentes filii Israhel postquam persecuti fuerant Philistheos invaserunt castra eorum";
rsv[54] = "And David took the head of the Philistine and brought it to Jerusalem; but he put his armor in his tent.";
asv[54] = "And David took the head of the Philistine, and brought it to Jerusalem; but he put his armor in his tent.";
yng[54] = "And David taketh the head of the Philistine, and bringeth it in to Jerusalem, and his weapons he hath put in his own tent.";
dby[54] = "And David took the head of the Philistine and brought it to Jerusalem; but he put his armour in his tent.";
