csb[1] = "The LORD said to Samuel, &quot;How long are you going to mourn for Saul, since I have rejected him as king over Israel? Fill your horn with oil and go. I am sending you to Jesse of Bethlehem because I have selected a king from his sons.&quot;"
csb[2] = "Samuel asked, &quot;How can I go? Saul will hear about it and kill me! &quot; The LORD answered, &quot;Take a young cow with you and say, \'I have come to sacrifice to the LORD.\'&quot;"
csb[3] = "&quot;Then invite Jesse to the sacrifice, and I will let you know what you are to do. You are to anoint for me the one I indicate to you.&quot;"
csb[4] = "Samuel did what the LORD directed and went to Bethlehem. When the elders of the town met him, they trembled and asked, &quot;Do you come in peace? &quot;"
csb[5] = "&quot;In peace,&quot; he replied. &quot;I\'ve come to sacrifice to the LORD. Consecrate yourselves and come with me to the sacrifice.&quot; Then he consecrated Jesse and his sons and invited them to the sacrifice.&quot;"
csb[6] = "When they arrived, Samuel saw Eliab and said, &quot;Certainly the LORD\'s anointed one is here before him.&quot;"
csb[7] = "But the LORD said to Samuel, &quot;Do not look at his appearance or his stature because I have rejected him. Humans do not see what the LORD sees, for humans see what is visible, but the LORD sees the heart.&quot;"
csb[8] = "Jesse called Abinadab and presented him to Samuel. &quot;The LORD hasn\'t chosen this one either,&quot; Samuel said.&quot;"
csb[9] = "Then Jesse presented Shammah, but Samuel said, &quot;The LORD hasn\'t chosen this one either.&quot;"
csb[10] = "After Jesse presented seven of his sons to him, Samuel told Jesse, &quot;The LORD hasn\'t chosen any of these.&quot;"
csb[11] = "Samuel asked him, &quot;Are these all the sons you have? &quot; &quot;There is still the youngest,&quot; he answered, &quot;but right now he\'s tending the sheep.&quot; Samuel told Jesse, &quot;Send for him. We won\'t sit down to eat until he gets here.&quot;"
csb[12] = "So Jesse sent for him. He had beautiful eyes and a healthy, handsome appearance. Then the LORD said, &quot;Anoint him, for he is the one.&quot;"
csb[13] = "So Samuel took the horn of oil and anointed him in the presence of his brothers, and the Spirit of the LORD came powerfully on David from that day forward. Then Samuel set out and went to Ramah.&quot;"
csb[14] = "Now the Spirit of the LORD had left Saul, and an evil spirit sent from the LORD began to torment him,&quot;"
csb[15] = "so Saul\'s servants said to him, &quot;You see that an evil spirit from God is tormenting you.&quot;"
csb[16] = "&quot;Let our lord command your servants here in your presence to look for someone who knows how to play the lyre. Whenever the evil spirit from God comes on you, that person can play the lyre, and you will feel better.&quot;"
csb[17] = "Then Saul commanded his servants, &quot;Find me someone who plays well and bring him to me.&quot;"
csb[18] = "One of the young men answered, &quot;I have seen a son of Jesse of Bethlehem who knows how to play the lyre. He is also a valiant man, a warrior, eloquent, handsome, and the LORD is with him.&quot;"
csb[19] = "Then Saul dispatched messengers to Jesse and said, &quot;Send me your son David, who is with the sheep.&quot;"
csb[20] = "So Jesse took a donkey loaded with bread, a wineskin, and one young goat and sent them by his son David to Saul.&quot;"
csb[21] = "When David came to Saul and entered his service, Saul loved him very much, and David became his armor-bearer.&quot;"
csb[22] = "Then Saul sent word to Jesse: &quot;Let David remain in my service, for he has found favor with me.&quot;"
csb[23] = "Whenever the spirit from God came on Saul, David would pick up his lyre and play, and Saul would then be relieved, feel better, and the evil spirit would leave him.&quot;"

web[17] = "And Saul said to his servants, Provide me now a man that can play well, and bring [him] to me.";
hnv[17] = "Sha\'ul said to his servants, Provide me now a man who can play well, and bring him to me.";
vul[17] = "et ait Saul ad servos suos providete mihi aliquem bene psallentem et adducite eum ad me";
kjv[18] = "Then answered one of the servants, and said, Behold, I have seen a son of Jesse the Bethlehemite, [that is] cunning in playing, and a mighty valiant man, and a man of war, and prudent in matters, and a comely person, and the LORD [is] with him.";
rsv[18] = "One of the young men answered, &quot;Behold, I have seen a son of Jesse the Bethlehemite, who is skilful in playing, a man of valor, a man of war, prudent in speech, and a man of good presence; and the LORD is with him.&quot;";
asv[18] = "Then answered one of the young men, and said, Behold, I have seen a son of Jesse the Beth-lehemite, that is skilful in playing, and a mighty man of valor, and a man of war, and prudent in speech, and a comely person; and Jehovah is with him.";
yng[18] = "And one of the servants answereth and saith, `Lo, I have seen a son of Jesse the Beth-Lehemite, skilful in playing, and a mighty virtuous man, and a man of battle, and intelligent in word, and a man of form, and Jehovah [is] with him.\'";
dby[18] = "And one of the young men answered and said, Behold, I have seen a son of Jesse the Bethlehemite, who is skilled in playing, and he is a valiant man and a man of war, and skilled in speech, and of good presence, and Jehovah is with him.";
web[18] = "Then answered one of the servants, and said, Behold, I have seen a son of Jesse the Beth-lehemite, [that is] skillful in playing, and a mighty valiant man, and a man of war, and prudent in matters, and a comely person, and the LORD [is] with him.";
hnv[18] = "Then answered one of the young men, and said, Behold, I have seen a son of Yishai the Beit-Hallachmite, who is skillful in playing, and a mighty man of valor, and a man of war, and prudent in speech, and a comely person; and the LORD is with him.";
vul[18] = "et respondens unus de pueris ait ecce vidi filium Isai Bethleemitem scientem psallere et fortissimum robore et virum bellicosum et prudentem in verbis et virum pulchrum et Dominus est cum eo";
kjv[19] = "Wherefore Saul sent messengers unto Jesse, and said, Send me David thy son, which [is] with the sheep.";
rsv[19] = "Therefore Saul sent messengers to Jesse, and said, &quot;Send me David your son, who is with the sheep.&quot;";
asv[19] = "Wherefore Saul sent messengers unto Jesse, and said, Send me David thy son, who is with the sheep.";
yng[19] = "And Saul sendeth messengers unto Jesse, and saith, `Send unto me David thy son, who [is] with the flock.\'";
dby[19] = "Then Saul sent messengers to Jesse and said, Send me David thy son, who is with the sheep.";
web[19] = "Wherefore Saul sent messengers to Jesse, and said, Send to me David thy son, who [is] with the sheep.";
hnv[19] = "Therefore Sha\'ul sent messengers to Yishai, and said, Send me David your son, who is with the sheep.";
vul[19] = "misit ergo Saul nuntios ad Isai dicens mitte ad me David filium tuum qui est in pascuis";
kjv[20] = "And Jesse took an ass [laden] with bread, and a bottle of wine, and a kid, and sent [them] by David his son unto Saul.";
rsv[20] = "And Jesse took an ass laden with bread, and a skin of wine and a kid, and sent them by David his son to Saul.";
asv[20] = "And Jesse took an ass [laden] with bread, and a bottle of wine, and a kid, and sent them by David his son unto Saul.";
yng[20] = "And Jesse taketh an ass, [with] bread, and a bottle of wine, and one kid of the goats, and sendeth by the hand of David his son unto Saul.";
dby[20] = "And Jesse took an ass with bread, and a flask of wine, and a kid, and sent [them] by David his son to Saul.";
web[20] = "And Jesse took an ass [laden] with bread, and a bottle of wine, and a kid, and sent [them] by David his son to Saul.";
hnv[20] = "Yishai took a donkey loaded with bread, and a bottle of wine, and a kid, and sent them by David his son to Sha\'ul.";
vul[20] = "tulitque Isai asinum plenum panibus et lagoenam vini et hedum de capris unum et misit per manum David filii sui Saul";
kjv[21] = "And David came to Saul, and stood before him: and he loved him greatly; and he became his armourbearer.";
rsv[21] = "And David came to Saul, and entered his service. And Saul loved him greatly, and he became his armor-bearer.";
asv[21] = "And David came to Saul, and stood before him: and he loved him greatly; and he became his armorbearer.";
yng[21] = "And David cometh in unto Saul, and standeth before him, and he loveth him greatly; and he is a bearer of his weapons.";
dby[21] = "And David came to Saul, and stood before him; and he loved him greatly; and he became his armour-bearer.";
web[21] = "And David came to Saul, and stood before him: and he loved him greatly; and he became his armor-bearer.";
hnv[21] = "David came to Sha\'ul, and stood before him: and he loved him greatly; and he became his armor bearer.";
vul[21] = "et venit David ad Saul et stetit coram eo at ille dilexit eum nimis et factus est eius armiger";
kjv[22] = "And Saul sent to Jesse, saying, Let David, I pray thee, stand before me; for he hath found favour in my sight.";
rsv[22] = "And Saul sent to Jesse, saying, &quot;Let David remain in my service, for he has found favor in my sight.&quot;";
asv[22] = "And Saul sent to Jesse, saying, Let David, I pray thee, stand before me; for he hath found favor in my sight.";
yng[22] = "And Saul sendeth unto Jesse, saying, `Let David, I pray thee, stand before me, for he hath found grace in mine eyes.\'";
dby[22] = "And Saul sent to Jesse, saying, Let David, I pray thee, stand before me; for he has found favour in my sight.";
web[22] = "And Saul sent to Jesse, saying, Let David, I pray thee, stand before me; for he hath found favor in my sight.";
hnv[22] = "Sha\'ul sent to Yishai, saying, Please let David stand before me; for he has found favor in my sight.";
vul[22] = "misitque Saul ad Isai dicens stet David in conspectu meo invenit enim gratiam in oculis meis";
kjv[23] = "And it came to pass, when the [evil] spirit from God was upon Saul, that David took an harp, and played with his hand: so Saul was refreshed, and was well, and the evil spirit departed from him.";
rsv[23] = "And whenever the evil spirit from God was upon Saul, David took the lyre and played it with his hand; so Saul was refreshed, and was well, and the evil spirit departed from him.";
asv[23] = "And it came to pass, when the [evil] spirit from God was upon Saul, that David took the harp, and played with his hand: so Saul was refreshed, and was well, and the evil spirit departed from him.";
yng[23] = "And it hath come to pass, in the spirit of [sadness from] God being on Saul, that David hath taken the harp, and played with his hand, and Saul hath refreshment and gladness, and the spirit of sadness hath turned aside from off him.";
dby[23] = "And it came to pass, when the [evil] spirit from God was upon Saul, that David took the harp, and played with his hand; and Saul was refreshed, and was well, and the evil spirit departed from him.";
web[23] = "And it came to pass, when the [evil] spirit from God was upon Saul, that David took a harp, and played with his hand: so Saul was refreshed, and was well, and the evil spirit departed from him.";
hnv[23] = "It happened, when the [evil] spirit from God was on Sha\'ul, that David took the harp, and played with his hand: so Sha\'ul was refreshed, and was well, and the evil spirit departed from him.";
vul[23] = "igitur quandocumque spiritus Dei arripiebat Saul tollebat David citharam et percutiebat manu sua et refocilabatur Saul et levius habebat recedebat enim ab eo spiritus malus";
