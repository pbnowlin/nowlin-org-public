csb[1] = "When David had finished speaking with Saul, Jonathan was bound to David in close friendship, and loved him as much as he loved himself.&quot;"
csb[2] = "Saul kept David with him from that day on and did not let him return to his father\'s house.&quot;"
csb[3] = "Jonathan made a covenant with David because he loved him as much as himself.&quot;"
csb[4] = "Then Jonathan removed the robe he was wearing and gave it to David, along with his military tunic, his sword, his bow, and his belt.&quot;"
csb[5] = "David marched out with the army and was successful in everything Saul sent him to do. Saul put him in command of the fighting men, which pleased all the people and Saul\'s servants as well.&quot;"
csb[6] = "As the troops were coming back, when David was returning from killing the Philistine, the women came out from all the cities of Israel to meet King Saul, singing and dancing with tambourines, with shouts of joy, and with three-stringed instruments.&quot;"
csb[7] = "As they danced, the women sang: Saul has killed his thousands, but David his tens of thousands.&quot;"
csb[8] = "Saul was furious and resented this song. &quot;They credited tens of thousands to David,&quot; he complained, &quot;but they only credited me with thousands. What more can he have but the kingdom? &quot;"
csb[9] = "So Saul watched David jealously from that day forward.&quot;"
csb[10] = "The next day an evil spirit sent from God came powerfully on Saul, and he began to rave inside the palace. David was playing the lyre as usual, but Saul was holding a spear,&quot;"
csb[11] = "and he threw it, thinking, &quot;I\'ll pin David to the wall.&quot; But David got away from him twice.&quot;"
csb[12] = "Saul was afraid of David, because the LORD was with David but had left Saul.&quot;"
csb[13] = "Therefore, Saul sent David away from him and made him commander over a thousand men. David led the troops&quot;"
csb[14] = "and continued to be successful in all his activities because the LORD was with him.&quot;"
csb[15] = "When Saul observed that David was very successful, he dreaded him.&quot;"
csb[16] = "But all Israel and Judah loved David because he was leading their troops.&quot;"
csb[17] = "Saul told David, &quot;Here is my oldest daughter Merab. I\'ll give her to you as a wife, if you will be a warrior for me and fight the LORD\'s battles.&quot; But Saul was thinking, &quot;I don\'t need to raise a hand against him; let the hand of the Philistines be against him.&quot;"
csb[18] = "Then David responded, &quot;Who am I, and what is my family or my father\'s clan in Israel that I should become the king\'s son-in-law? &quot;"
csb[19] = "When it was time to give Saul\'s daughter Merab to David, she was given to Adriel the Meholathite as a wife.&quot;"
csb[20] = "Now Saul\'s daughter Michal loved David, and when it was reported to Saul, it pleased him.&quot;"
csb[21] = "&quot;I\'ll give her to him,&quot; Saul thought. &quot;She\'ll be a trap for him, and the hand of the Philistines will be against him.&quot; So Saul said to David a second time, &quot;You can now be my son-in-law.&quot;"
csb[22] = "Saul then ordered his servants, &quot;Speak to David in private and tell him, \'Look, the king is pleased with you, and all his servants love you. Therefore, you should become the king\'s son-in-law.\' &quot;"
csb[23] = "Saul\'s servants reported these words directly to David, but he replied, &quot;Is it trivial in your sight to become the king\'s son-in-law? I am a poor commoner.&quot;"
csb[24] = "The servants reported back to Saul, &quot;These are the words David spoke.&quot;"
csb[25] = "Then Saul replied, &quot;Say this to David: \'The king desires no other bride-price except a hundred Philistine foreskins, to take revenge on his enemies.\' &quot; Actually, Saul intended to cause David\'s death at the hands of the Philistines.&quot;"
csb[26] = "When the servants reported these terms to David, he was pleased to become the king\'s son-in-law. Before the wedding day arrived,&quot;"
csb[27] = "David and his men went out and killed two hundred Philistines. He brought their foreskins and presented them as full payment to the king to become his son-in-law. Then Saul gave his daughter Michal to David as his wife.&quot;"
csb[28] = "Saul realized that the LORD was with David and that his daughter Michal loved him,&quot;"
csb[29] = "and he became even more afraid of David. As a result, Saul was David\'s enemy from then on.&quot;"
csb[30] = "Every time the Philistine commanders came out to fight, David was more successful than all of Saul\'s officers. So his name became well known.&quot;"

hnv[19] = "But it happened at the time when Merav, Sha\'ul\'s daughter, should have been given to David, that she was given to `Adri\'el the Mecholati as wife.";
vul[19] = "factum est autem tempus cum deberet dari Merob filia Saul David data est Hadrihel Molathitae uxor";
kjv[20] = "And Michal Saul\'s daughter loved David: and they told Saul, and the thing pleased him.";
rsv[20] = "Now Saul\'s daughter Michal loved David; and they told Saul, and the thing pleased him.";
asv[20] = "And Michal, Saul\'s daughter, loved David: and they told Saul, and the thing pleased him.";
yng[20] = "And Michal daughter of Saul loveth David, and they declare to Saul, and the thing is right in his eyes,";
dby[20] = "And Michal Saul\'s daughter loved David; and they told Saul, and the thing was right in his sight.";
web[20] = "And Michal Saul\'s daughter loved David: and they told Saul, and the thing pleased him.";
hnv[20] = "Mikhal, Sha\'ul\'s daughter, loved David: and they told Sha\'ul, and the thing pleased him.";
vul[20] = "dilexit autem Michol filia Saul altera David et nuntiatum est Saul et placuit ei";
kjv[21] = "And Saul said, I will give him her, that she may be a snare to him, and that the hand of the Philistines may be against him. Wherefore Saul said to David, Thou shalt this day be my son in law in [the one of] the twain.";
rsv[21] = "Saul thought, &quot;Let me give her to him, that she may be a snare for him, and that the hand of the Philistines may be against him.&quot; Therefore Saul said to David a second time, &quot;You shall now be my son-in-law.&quot;";
asv[21] = "And Saul said, I will give him her, that she may be a snare to him, and that the hand of the Philistines may be against him. Wherefore Saul said to David, Thou shalt this day be my son-in-law a second time.";
yng[21] = "and Saul saith, `I give her to him, and she is to him for a snare, and the hand of the Philistines is on him;\' and Saul saith unto David, `By the second -- thou dost become my son-in-law to-day.\'";
dby[21] = "And Saul said, I will give him her, that she may be a snare to him, and that the hand of the Philistines may be upon him. And Saul said to David, Thou shalt this day be my son-in-law a second time.";
web[21] = "And Saul said, I will give her to him, that she may be a snare to him, and that the hand of the Philistines may be against him. Wherefore Saul said to David, Thou shalt this day be my son-in-law, in [the one of] the two.";
hnv[21] = "Sha\'ul said, I will give her to him, that she may be a snare to him, and that the hand of the Pelishtim may be against him. Therefore Sha\'ul said to David, You shall this day be my son-in-law a second time.";
vul[21] = "dixitque Saul dabo eam illi ut fiat ei in scandalum et sit super eum manus Philisthinorum dixit ergo Saul ad David in duabus rebus gener meus eris hodie";
kjv[22] = "And Saul commanded his servants, [saying], Commune with David secretly, and say, Behold, the king hath delight in thee, and all his servants love thee: now therefore be the king\'s son in law.";
rsv[22] = "And Saul commanded his servants, &quot;Speak to David in private and say, \'Behold, the king has delight in you, and all his servants love you; now then become the king\'s son-in-law.\'&quot;";
asv[22] = "And Saul commanded his servants, [saying], Commune with David secretly, and say, Behold, the king hath delight in thee, and all his servants love thee: now therefore be the king\'s son-in-law.";
yng[22] = "And Saul commandeth his servants, `Speak unto David gently, saying, Lo, the king hath delighted in thee, and all his servants have loved thee, and now, be son-in-law to the king.\'";
dby[22] = "And Saul commanded his servants, Speak with David secretly, saying, Behold, the king has delight in thee, and all his servants love thee: now therefore be the king\'s son-in-law.";
web[22] = "And Saul commanded his servants, [saying], Commune with David secretly, and say, Behold, the king hath delight in thee, and all his servants love thee: now therefore be the king\'s son-in-law.";
hnv[22] = "Sha\'ul commanded his servants, [saying], Commune with David secretly, and say, Behold, the king has delight in you, and all his servants love you: now therefore be the king\'s son-in-law.";
vul[22] = "et mandavit Saul servis suis loquimini ad David clam me dicentes ecce places regi et omnes servi eius diligunt te nunc ergo esto gener regis";
kjv[23] = "And Saul\'s servants spake those words in the ears of David. And David said, Seemeth it to you [a] light [thing] to be a king\'s son in law, seeing that I [am] a poor man, and lightly esteemed?";
rsv[23] = "And Saul\'s servants spoke those words in the ears of David. And David said, &quot;Does it seem to you a little thing to become the king\'s son-in-law, seeing that I am a poor man and of no repute?&quot;";
asv[23] = "And Saul\'s servants spake those words in the ears of David. And David said, Seemeth it to you a light thing to be the king\'s son-in-law, seeing that I am a poor man, and lightly esteemed?";
yng[23] = "And the servants of Saul speak in the ears of David these words, and David saith, `Is it a light thing in your eyes to be son-in-law to the king -- and I a poor man, and lightly esteemed?\'";
dby[23] = "And Saul\'s servants spoke those words in the ears of David. And David said, Is it a light thing in your eyes to be the king\'s son-in-law, seeing that I am a poor man, and lightly esteemed?";
web[23] = "And Saul\'s servants spoke those words in the ears of David. And David said, Seemeth it to you [a] light [thing] to be a king\'s son-in-law, seeing that I [am] a poor man, and lightly esteemed?";
hnv[23] = "Sha\'ul\'s servants spoke those words in the ears of David. David said, Seems it to you a light thing to be the king\'s son-in-law, seeing that I am a poor man, and lightly esteemed?";
vul[23] = "et locuti sunt servi Saul in auribus David omnia verba haec et ait David num parum vobis videtur generum esse regis ego autem sum vir pauper et tenuis";
kjv[24] = "And the servants of Saul told him, saying, On this manner spake David.";
rsv[24] = "And the servants of Saul told him, &quot;Thus and so did David speak.&quot;";
asv[24] = "And the servants of Saul told him, saying, On this manner spake David.";
yng[24] = "And the servants of Saul declare to him, saying, `According to these words hath David spoken.\'";
dby[24] = "And the servants of Saul told him, saying, On this manner did David speak.";
web[24] = "And the servants of Saul told him, saying, On this manner spoke David.";
hnv[24] = "The servants of Sha\'ul told him, saying, On this manner spoke David.";
vul[24] = "et renuntiaverunt servi Saul dicentes huiuscemodi verba locutus est David";
kjv[25] = "And Saul said, Thus shall ye say to David, The king desireth not any dowry, but an hundred foreskins of the Philistines, to be avenged of the king\'s enemies. But Saul thought to make David fall by the hand of the Philistines.";
rsv[25] = "Then Saul said, &quot;Thus shall you say to David, \'The king desires no marriage present except a hundred foreskins of the Philistines, that he may be avenged of the king\'s enemies.\'&quot; Now Saul thought to make David fall by the hand of the Philistines.";
asv[25] = "And Saul said, Thus shall ye say to David, The king desireth not any dowry, but a hundred foreskins of the Philistines, to be avenged of the king\'s enemies. Now Saul thought to make David fall by the hand of the Philistines.";
yng[25] = "And Saul saith, `Thus do ye say to David, There is no delight to the king in dowry, but in a hundred foreskins of the Philistines -- to be avenged on the enemies of the king;\' and Saul thought to cause David to fall by the hand of the Philistines.";
dby[25] = "And Saul said, Thus shall ye say to David: The king does not desire any dowry, but a hundred foreskins of the Philistines, to be avenged of the king\'s enemies. But Saul thought to make David fall by the hand of the Philistines.";
web[25] = "And Saul said, Thus shall ye say to David, The king desireth not any dower, but a hundred foreskins of the Philistines, to be avenged of the king\'s enemies. But Saul thought to make David fall by the hand of the Philistines.";
hnv[25] = "Sha\'ul said, Thus shall you tell David, The king desires no dowry except one hundred foreskins of the Pelishtim, to be avenged of the king\'s enemies. Now Sha\'ul thought to make David fall by the hand of the Pelishtim.";
vul[25] = "dixit autem Saul sic loquimini ad David non habet necesse rex sponsalia nisi tantum centum praeputia Philisthinorum ut fiat ultio de inimicis regis porro Saul cogitabat tradere David in manibus Philisthinorum";
kjv[26] = "And when his servants told David these words, it pleased David well to be the king\'s son in law: and the days were not expired.";
rsv[26] = "And when his servants told David these words, it pleased David well to be the king\'s son-in-law. Before the time had expired,";
asv[26] = "And when his servants told David these words, it pleased David well to be the king\'s son-in-law. And the days were not expired;";
yng[26] = "And his servants declare to David these words, and the thing is right in the eyes of David, to be son-in-law to the king; and the days have not been full,";
dby[26] = "And his servants told David these words; and the thing was right in David\'s sight to be the king\'s son-in-law. And the days were not expired,";
web[26] = "And when his servants told David these words, it pleased David well to be the king\'s son-in-law: and the days had not expired.";
hnv[26] = "When his servants told David these words, it pleased David well to be the king\'s son-in-law. The days were not expired;";
vul[26] = "cumque renuntiassent servi eius David verba quae diximus placuit sermo in oculis David ut fieret gener regis";
kjv[27] = "Wherefore David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full tale to the king, that he might be the king\'s son in law. And Saul gave him Michal his daughter to wife.";
rsv[27] = "David arose and went, along with his men, and killed two hundred of the Philistines; and David brought their foreskins, which were given in full number to the king, that he might become the king\'s son-in-law. And Saul gave him his daughter Michal for a wife.";
asv[27] = "and David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full number to the king, that he might be the king\'s son-in-law. And Saul gave him Michal his daughter to wife.";
yng[27] = "and David riseth and goeth, he and his men, and smiteth among the Philistines two hundred men, and David bringeth in their foreskins, and they set them before the king, to be son-in-law to the king; and Saul giveth to him Michal his daughter for a wife.";
dby[27] = "when David arose and went, he and his men, and smote of the Philistines two hundred men; and David brought their foreskins, and they delivered them in full to the king, that he might be the king\'s son-in-law. And Saul gave him Michal his daughter as wife.";
web[27] = "Wherefore David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full number to the king, that he might be the king\'s son-in-law. And Saul gave him Michal his daughter for a wife.";
hnv[27] = "and David arose and went, he and his men, and killed of the Pelishtim two hundred men; and David brought their foreskins, and they gave them in full number to the king, that he might be the king\'s son-in-law. Sha\'ul gave him Mikhal his daughter as wife.";
vul[27] = "et post dies paucos surgens David abiit cum viris qui sub eo erant et percussis Philisthim ducentis viris adtulit praeputia eorum et adnumeravit ea regi ut esset gener eius dedit itaque ei Saul Michol filiam suam uxorem";
kjv[28] = "And Saul saw and knew that the LORD [was] with David, and [that] Michal Saul\'s daughter loved him.";
rsv[28] = "But when Saul saw and knew that the LORD was with David, and that all Israel loved him,";
asv[28] = "And Saul saw and knew that Jehovah was with David; and Michal, Saul\'s daughter, loved him.";
yng[28] = "And Saul seeth and knoweth that Jehovah [is] with David, and Michal daughter of Saul hath loved him,";
dby[28] = "And Saul saw and knew that Jehovah was with David; and Michal Saul\'s daughter loved him.";
web[28] = "And Saul saw and knew that the LORD [was] with David, and [that] Michal, Saul\'s daughter, loved him.";
hnv[28] = "Sha\'ul saw and knew that the LORD was with David; and Mikhal, Sha\'ul\'s daughter, loved him.";
vul[28] = "et vidit Saul et intellexit quia Dominus esset cum David Michol autem filia Saul diligebat eum";
kjv[29] = "And Saul was yet the more afraid of David; and Saul became David\'s enemy continually.";
rsv[29] = "Saul was still more afraid of David. So Saul was David\'s enemy continually.";
asv[29] = "And Saul was yet the more afraid of David; and Saul was David\'s enemy continually.";
yng[29] = "and Saul addeth to be afraid of the presence of David yet; and Saul is an enemy with David all the days.";
dby[29] = "And Saul was yet the more afraid of David; and Saul was David\'s enemy continually.";
web[29] = "And Saul was yet the more afraid of David; and Saul became David\'s enemy continually.";
hnv[29] = "Sha\'ul was yet the more afraid of David; and Sha\'ul was David\'s enemy continually.";
vul[29] = "et Saul magis coepit timere David factusque est Saul inimicus David cunctis diebus";
kjv[30] = "Then the princes of the Philistines went forth: and it came to pass, after they went forth, [that] David behaved himself more wisely than all the servants of Saul; so that his name was much set by.";
rsv[30] = "Then the princes of the Philistines came out to battle, and as often as they came out David had more success than all the servants of Saul; so that his name was highly esteemed.";
asv[30] = "Then the princes of the Philistines went forth: and it came to pass, as often as they went forth, that David behaved himself more wisely than all the servants of Saul; so that his name was much set by.";
yng[30] = "And the princes of the Philistines come out, and it cometh to pass from the time of their coming out, David hath acted more wisely than any of the servants of Saul, and his name is very precious.";
dby[30] = "And the princes of the Philistines went forth; and it came to pass, whenever they went forth, that David succeeded better than all the servants of Saul; and his name was much esteemed.";
web[30] = "Then the princes of the Philistines went forth: and it came to pass after they went forth, [that] David behaved himself more wisely than all the servants of Saul; so that his name was much esteemed.";
hnv[30] = "Then the princes of the Pelishtim went forth: and it happened, as often as they went forth, that David behaved himself more wisely than all the servants of Sha\'ul; so that his name was much set by.";
vul[30] = "et egressi sunt principes Philisthinorum a principio autem egressionis eorum prudentius se gerebat David quam omnes servi Saul et celebre factum est nomen eius nimis";
