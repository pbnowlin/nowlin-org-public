csb[1] = "And Samuel\'s words came to all Israel. Israel went out to meet the Philistines in battle and camped at Ebenezer while the Philistines camped at Aphek.&quot;"
csb[2] = "The Philistines lined up in battle formation against Israel, and as the battle intensified, Israel was defeated by the Philistines, who struck down about four thousand men on the battlefield.&quot;"
csb[3] = "When the troops returned to the camp, the elders of Israel asked, &quot;Why did the LORD defeat us today before the Philistines? Let\'s bring the ark of the LORD\'s covenant from Shiloh. Then it will go with us and save us from our enemies.&quot;"
csb[4] = "So the people sent men to Shiloh to bring back the ark of the covenant of the LORD of Armies, who is enthroned between the cherubim. Eli\'s two sons, Hophni and Phinehas, were there with the ark of the covenant of God.&quot;"
csb[5] = "When the ark of the covenant of the LORD entered the camp, all the Israelites raised such a loud shout that the ground shook.&quot;"
csb[6] = "The Philistines heard the sound of the war cry and asked, &quot;What\'s this loud shout in the Hebrews\' camp? &quot; When the Philistines discovered that the ark of the LORD had entered the camp,&quot;"
csb[7] = "they panicked. &quot;A god has entered their camp! &quot; they said. &quot;Woe to us, nothing like this has happened before.&quot;"
csb[8] = "&quot;Woe to us, who will rescue us from these magnificent gods? These are the gods that slaughtered the Egyptians with all kinds of plagues in the wilderness.&quot;"
csb[9] = "&quot;Show some courage and be men, Philistines! Otherwise, you\'ll serve the Hebrews just as they served you. Now be men and fight! &quot;"
csb[10] = "So the Philistines fought, and Israel was defeated, and each man fled to his tent. The slaughter was severe -- thirty thousand of the Israelite foot soldiers fell.&quot;"
csb[11] = "The ark of God was captured, and Eli\'s two sons, Hophni and Phinehas, died.&quot;"
csb[12] = "That same day, a Benjaminite man ran from the battle and came to Shiloh. His clothes were torn, and there was dirt on his head.&quot;"
csb[13] = "When he arrived, there was Eli sitting on his chair beside the road watching, because he was anxious about the ark of God. When the man entered the city to give a report, the entire city cried out.&quot;"
csb[14] = "Eli heard the outcry and asked, &quot;Why this commotion? &quot; The man quickly came and reported to Eli.&quot;"
csb[15] = "At that time Eli was ninety-eight years old, and his eyes didn\'t move because he couldn\'t see.&quot;"
csb[16] = "The man said to Eli, &quot;I\'m the one who came from the battle. I fled from there today.&quot; &quot;What happened, my son? &quot; Eli asked.&quot;"
csb[17] = "The messenger answered, &quot;Israel has fled from the Philistines, and also there was a great slaughter among the people. Your two sons, Hophni and Phinehas, are both dead, and the ark of God has been captured.&quot;"
csb[18] = "When he mentioned the ark of God, Eli fell backward off the chair by the city gate, and since he was old and heavy, his neck broke and he died. Eli had judged Israel forty years.&quot;"
csb[19] = "Eli\'s daughter-in-law, the wife of Phinehas, was pregnant and about to give birth. When she heard the news about the capture of God\'s ark and the deaths of her father-in-law and her husband, she collapsed and gave birth because her labor pains came on her.&quot;"
csb[20] = "As she was dying, the women taking care of her said, &quot;Don\'t be afraid. You\'ve given birth to a son! &quot; But she did not respond or pay attention.&quot;"
csb[21] = "She named the boy Ichabod, saying, &quot;The glory has departed from Israel,&quot; referring to the capture of the ark of God and to the deaths of her father-in-law and her husband.&quot;"
csb[22] = "&quot;The glory has departed from Israel,&quot; she said, &quot;because the ark of God has been captured.&quot;"

kjv[3] = "And when the people were come into the camp, the elders of Israel said, Wherefore hath the LORD smitten us to day before the Philistines? Let us fetch the ark of the covenant of the LORD out of Shiloh unto us, that, when it cometh among us, it may save us out of the hand of our enemies.";
rsv[3] = "And when the troops came to the camp, the elders of Israel said, &quot;Why has the LORD put us to rout today before the Philistines? Let us bring the ark of the covenant of the LORD here from Shiloh, that he may come among us and save us from the power of our enemies.&quot;";
asv[3] = "And when the people were come into the camp, the elders of Israel said, Wherefore hath Jehovah smitten us to-day before the Philistines? Let us fetch the ark of the covenant of Jehovah out of Shiloh unto us, that it may come among us, and save us out of the hand of our enemies.";
yng[3] = "And the people cometh in unto the camp, and the elders of Israel say, `Why hath Jehovah smitten us to-day before the Philistines? we take unto us from Shiloh the ark of the covenant of Jehovah, and it cometh into our midst, and He doth save us out of the hand of our enemies.\'";
dby[3] = "And the people came into the camp; and the elders of Israel said, Why has Jehovah smitten us to-day before the Philistines? Let us fetch ourselves the ark of the covenant of Jehovah out of Shiloh, that it may come among us, and save us out of the hand of our enemies.";
web[3] = "And when the people had come into the camp, the elders of Israel said, Why hath the LORD smitten us to-day before the Philistines? Let us bring the ark of the covenant of the LORD out of Shiloh to us, that when it cometh among us, it may save us from the hand of our enemies.";
hnv[3] = "When the people were come into the camp, the Zakenim of Yisra\'el said, Why has the LORD struck us today before the Pelishtim? Let us get the ark of the covenant of the LORD out of Shiloh to us, that it may come among us, and save us out of the hand of our enemies.";
vul[3] = "et reversus est populus ad castra dixeruntque maiores natu de Israhel quare percussit nos Dominus hodie coram Philisthim adferamus ad nos de Silo arcam foederis Domini et veniat in medium nostri ut salvet nos de manu inimicorum nostrorum";

kjv[17] = "And the messenger answered and said, Israel is fled before the Philistines, and there hath been also a great slaughter among the people, and thy two sons also, Hophni and Phinehas, are dead, and the ark of God is taken.";
rsv[17] = "He who brought the tidings answered and said, &quot;Israel has fled before the Philistines, and there has also been a great slaughter among the people; your two sons also, Hophni and Phin\'ehas, are dead, and the ark of God has been captured.&quot;";
asv[17] = "And he that brought the tidings answered and said, Israel is fled before the Philistines, and there hath been also a great slaughter among the people, and thy two sons also, Hophni and Phinehas, are dead, and the ark of God is taken.";
yng[17] = "And he who is bearing tidings answereth and saith, `Israel hath fled before the Philistines, and also a great slaughter hath been among the people, and also thy two sons have died -- Hophni and Phinehas -- and the ark of God hath been captured.\'";
dby[17] = "And the messenger answered and said, Israel has fled before the Philistines, and there has been also a great slaughter among the people, and thy two sons also, Hophni and Phinehas, are dead, and the ark of God is taken.";
web[17] = "And the messenger answered and said, Israel hath fled before the Philistines, and there hath been also a great slaughter among the people, and thy two sons also, Hophni and Phinehas, are dead, and the ark of God is taken.";
hnv[17] = "He who brought the news answered, Yisra\'el is fled before the Pelishtim, and there has been also a great slaughter among the people, and your two sons also, Hofni and Pinechas, are dead, and the ark of God is taken.";
vul[17] = "respondens autem qui nuntiabat fugit inquit Israhel coram Philisthim et ruina magna facta est in populo insuper et duo filii tui mortui sunt Ofni et Finees et arca Dei capta est";
kjv[18] = "And it came to pass, when he made mention of the ark of God, that he fell from off the seat backward by the side of the gate, and his neck brake, and he died: for he was an old man, and heavy. And he had judged Israel forty years.";
rsv[18] = "When he mentioned the ark of God, Eli fell over backward from his seat by the side of the gate; and his neck was broken and he died, for he was an old man, and heavy. He had judged Israel forty years.";
asv[18] = "And it came to pass, when he made mention of the ark of God, that [Eli] fell from off his seat backward by the side of the gate; and his neck brake, and he died: for he was an old man, and heavy. And he had judged Israel forty years.";
yng[18] = "And it cometh to pass, at his mentioning the ark of God, that he falleth from off the throne backward, by the side of the gate, and his neck is broken, and he dieth, for the man [is] old and heavy, and he hath judged Israel forty years.";
dby[18] = "And it came to pass, when he mentioned the ark of God, that he fell from off the seat backward by the side of the gate, and his neck broke, and he died; for the man was old, and heavy. And he had judged Israel forty years.";
web[18] = "And it came to pass, when he made mention of the ark of God, that he fell from off the seat backward by the side of the gate, and his neck broke, and he died: for he was an old man, and heavy. And he had judged Israel forty years.";
hnv[18] = "It happened, when he made mention of the ark of God, that [`Eli] fell from off his seat backward by the side of the gate; and his neck broke, and he died: for he was an old man, and heavy. He had judged Yisra\'el forty years.";
vul[18] = "cumque ille nominasset arcam Dei cecidit de sella retrorsum iuxta ostium et fractis cervicibus mortuus est senex enim erat vir et grandevus et ipse iudicavit Israhel quadraginta annis";
kjv[19] = "And his daughter in law, Phinehas\' wife, was with child, [near] to be delivered: and when she heard the tidings that the ark of God was taken, and that her father in law and her husband were dead, she bowed herself and travailed; for her pains came upon her.";
rsv[19] = "Now his daughter-in-law, the wife of Phin\'ehas, was with child, about to give birth. And when she heard the tidings that the ark of God was captured, and that her father-in-law and her husband were dead, she bowed and gave birth; for her pains came upon her.";
asv[19] = "And his daughter-in-law, Phinehas\' wife, was with child, near to be delivered: and when she heard the tidings that the ark of God was taken, and that her father-in-law and her husband were dead, she bowed herself and brought forth; for her pains came upon her.";
yng[19] = "And his daughter-in-law, wife of Phinehas, [is] pregnant, about to bear, and she heareth the report of the taking of the ark of God, that her father-in-law and her husband have died, and she boweth, and beareth, for her pains have turned upon her.";
dby[19] = "And his daughter-in-law, Phinehas\' wife, was with child, near to be delivered; and when she heard the tidings that the ark of God was taken, and that her father-in-law and her husband were dead, she bowed herself and travailed; for her pains came upon her.";
web[19] = "And his daughter-in-law, the wife of Phinehas, was with child [near] to be delivered: and when she heard the tidings that the ark of God was taken, and that her father-in-law, and her husband were dead, she bowed herself, and travailed; for her pains came upon her.";
hnv[19] = "His daughter-in-law, Pinechas\' wife, was with child, near to be delivered: and when she heard the news that the ark of God was taken, and that her father-in-law and her husband were dead, she bowed herself and brought forth; for her pains came on her.";
vul[19] = "nurus autem eius uxor Finees praegnans erat vicinaque partui et audito nuntio quod capta esset arca Dei et mortuus socer suus et vir suus incurvavit se et peperit inruerant enim in eam dolores subiti";
kjv[20] = "And about the time of her death the women that stood by her said unto her, Fear not; for thou hast born a son. But she answered not, neither did she regard [it].";
rsv[20] = "And about the time of her death the women attending her said to her, &quot;Fear not, for you have borne a son.&quot; But she did not answer or give heed.";
asv[20] = "And about the time of her death the women that stood by her said unto her, Fear not; for thou hast brought forth a son. But she answered not, neither did she regard it.";
yng[20] = "And at the time of her death, when the women who are standing by her say, `Fear not, for a son thou hast borne,\' she hath not answered, nor set her heart [to it];";
dby[20] = "And as she was dying, the women that stood by her said, Fear not; for thou hast borne a son. But she did not answer, neither did she take it to heart.";
web[20] = "And about the time of her death, the women that stood by her said to her, Fear not; for thou hast borne a son. But she answered not, neither did she regard [it].";
hnv[20] = "About the time of her death the women who stood by her said to her, Don\'t be afraid; for you have brought forth a son. But she didn\'t answer, neither did she regard it.";
vul[20] = "in ipso autem momento mortis eius dixerunt ei quae stabant circa eam ne timeas quia filium peperisti quae non respondit eis neque animadvertit";
kjv[21] = "And she named the child Ichabod, saying, The glory is departed from Israel: because the ark of God was taken, and because of her father in law and her husband.";
rsv[21] = "And she named the child Ich\'abod, saying, &quot;The glory has departed from Israel!&quot; because the ark of God had been captured and because of her father-in-law and her husband.";
asv[21] = "And she named the child Ichabod, saying, The glory is departed from Israel; because the ark of God was taken, and because of her father-in-law and her husband.";
yng[21] = "and she calleth the youth I-Chabod, saying, `Honour hath removed from Israel,\' because of the taking of the ark of God, and because of her father-in-law and her husband.";
dby[21] = "And she named the child Ichabod, saying, The glory is departed from Israel; because the ark of God was taken, and because of her father-in-law and her husband.";
web[21] = "And she named the child I-chabod, saying, The glory hath departed from Israel. (Because the ark of God was taken, and because of her father-in-law and her husband.)";
hnv[21] = "She named the child Ikhavod, saying, The glory is departed from Yisra\'el; because the ark of God was taken, and because of her father-in-law and her husband.";
vul[21] = "et vocavit puerum Hicabod dicens translata est gloria de Israhel quia capta est arca Dei et pro socero suo et pro viro suo";
kjv[22] = "And she said, The glory is departed from Israel: for the ark of God is taken.";
rsv[22] = "And she said, &quot;The glory has departed from Israel, for the ark of God has been captured.&quot;";
asv[22] = "And she said, The glory is departed from Israel; for the ark of God is taken.";
yng[22] = "And she saith, `Honour hath removed from Israel, for the ark of God hath been taken.\'";
dby[22] = "And she said, The glory is departed from Israel, for the ark of God is taken.";
web[22] = "And she said, The glory hath departed from Israel: for the ark of God is taken.";
hnv[22] = "She said, The glory is departed from Yisra\'el; for the ark of God is taken.";
vul[22] = "et ait translata est gloria ab Israhel eo quod capta esset arca Dei";
