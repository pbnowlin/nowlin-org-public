csb[1] = "Saul ordered his son Jonathan and all his servants to kill David. But Saul\'s son Jonathan liked David very much,&quot;"
csb[2] = "so he told him: &quot;My father Saul intends to kill you. Be on your guard in the morning and hide in a secret place and stay there.&quot;"
csb[3] = "&quot;I\'ll go out and stand beside my father in the field where you are and talk to him about you. When I see what he says, I\'ll tell you.&quot;"
csb[4] = "Jonathan spoke well of David to his father Saul. He said to him: &quot;The king should not sin against his servant David. He hasn\'t sinned against you; in fact, his actions have been a great advantage to you.&quot;"
csb[5] = "&quot;He took his life in his hands when he struck down the Philistine, and the LORD brought about a great victory for all Israel. You saw it and rejoiced, so why would you sin against innocent blood by killing David for no reason? &quot;"
csb[6] = "Saul listened to Jonathan\'s advice and swore an oath: &quot;As surely as the LORD lives, David will not be killed.&quot;"
csb[7] = "So Jonathan summoned David and told him all these words. Then Jonathan brought David to Saul, and he served him as he did before.&quot;"
csb[8] = "When war broke out again, David went out and fought against the Philistines. He defeated them with such great force that they fled from him.&quot;"
csb[9] = "Now an evil spirit sent from the LORD came on Saul as he was sitting in his palace holding a spear. David was playing the lyre,&quot;"
csb[10] = "and Saul tried to pin David to the wall with the spear. As the spear struck the wall, David eluded Saul, ran away, and escaped that night.&quot;"
csb[11] = "Saul sent agents to David\'s house to watch for him and kill him in the morning. But his wife Michal warned David, &quot;If you don\'t escape tonight, you will be dead tomorrow! &quot;"
csb[12] = "So she lowered David from the window, and he fled and escaped.&quot;"
csb[13] = "Then Michal took the household idol and put it on the bed, placed some goat hair on its head, and covered it with a garment.&quot;"
csb[14] = "When Saul sent agents to seize David, Michal said, &quot;He\'s sick.&quot;"
csb[15] = "Saul sent the agents back to see David and said, &quot;Bring him on his bed so I can kill him.&quot;"
csb[16] = "When the agents arrived, to their surprise, the household idol was on the bed with some goat hair on its head.&quot;"
csb[17] = "Saul asked Michal, &quot;Why did you deceive me like this? You sent my enemy away, and he has escaped! &quot; She answered him, &quot;He said to me, \'Let me go! Why should I kill you? \' &quot;"
csb[18] = "So David fled and escaped and went to Samuel at Ramah and told him everything Saul had done to him. Then he and Samuel left and stayed at Naioth.&quot;"
csb[19] = "When it was reported to Saul that David was at Naioth in Ramah,&quot;"
csb[20] = "he sent agents to seize David. However, when they saw the group of prophets prophesying with Samuel leading them, the Spirit of God came on Saul\'s agents, and they also started prophesying.&quot;"
csb[21] = "When they reported to Saul, he sent other agents, and they also began prophesying. So Saul tried again and sent a third group of agents, and even they began prophesying.&quot;"
csb[22] = "Then Saul himself went to Ramah. He came to the large cistern at Secu and asked, &quot;Where are Samuel and David? &quot; &quot;At Naioth in Ramah,&quot; someone said.&quot;"
csb[23] = "So he went to Naioth in Ramah. The Spirit of God also came on him, and as he walked along, he prophesied until he entered Naioth in Ramah.&quot;"
csb[24] = "Saul then removed his clothes and also prophesied before Samuel; he collapsed and lay naked all that day and all that night. That is why they say, &quot;Is Saul also among the prophets? &quot;"

dby[18] = "And David fled, and escaped, and came to Samuel to Ramah, and told him all that Saul had done to him. And he and Samuel went and dwelt in Naioth.";
web[18] = "So David fled, and escaped, and came to Samuel to Ramah, and told him all that Saul had done to him. And he and Samuel went and dwelt in Naioth.";
hnv[18] = "Now David fled, and escaped, and came to Shemu\'el to Ramah, and told him all that Sha\'ul had done to him. He and Shemu\'el went and lived in Nayot.";
vul[18] = "David autem fugiens salvatus est et venit ad Samuhel in Ramatha et nuntiavit ei omnia quae fecerat sibi Saul et abierunt ipse et Samuhel et morati sunt in Nahioth";
kjv[19] = "And it was told Saul, saying, Behold, David [is] at Naioth in Ramah.";
rsv[19] = "And it was told Saul, &quot;Behold, David is at Nai\'oth in Ramah.&quot;";
asv[19] = "And it was told Saul, saying, Behold, David is at Naioth in Ramah.";
yng[19] = "And it is declared to Saul, saying, `Lo, David [is] in Naioth in Ramah.\'";
dby[19] = "And it was told Saul, saying, Behold, David is at Naioth by Ramah.";
web[19] = "And it was told to Saul, saying, Behold, David [is] at Naioth in Ramah.";
hnv[19] = "It was told Sha\'ul, saying, Behold, David is at Nayot in Ramah.";
vul[19] = "nuntiatum est autem Sauli a dicentibus ecce David in Nahioth in Rama";
kjv[20] = "And Saul sent messengers to take David: and when they saw the company of the prophets prophesying, and Samuel standing [as] appointed over them, the Spirit of God was upon the messengers of Saul, and they also prophesied.";
rsv[20] = "Then Saul sent messengers to take David; and when they saw the company of the prophets prophesying, and Samuel standing as head over them, the Spirit of God came upon the messengers of Saul, and they also prophesied.";
asv[20] = "And Saul sent messengers to take David: and when they saw the company of the prophets prophesying, and Samuel standing as head over them, the Spirit of God came upon the messengers of Saul, and they also prophesied.";
yng[20] = "And Saul sendeth messengers to take David, and they see the assembly of the prophets prophesying, and Samuel standing, set over them, and the Spirit of God is on Saul\'s messengers, and they prophesy -- they also.";
dby[20] = "Then Saul sent messengers to take David; and they saw a company of prophets prophesying, and Samuel standing as president over them; and the Spirit of God came upon the messengers of Saul, and they also prophesied.";
web[20] = "And Saul sent messengers to take David: and when they saw the company of the prophets prophesying, and Samuel standing [as] appointed over them, the Spirit of God was upon the messengers of Saul, and they also prophesied.";
hnv[20] = "Sha\'ul sent messengers to take David: and when they saw the company of the prophets prophesying, and Shemu\'el standing as head over them, the Spirit of God came on the messengers of Sha\'ul, and they also prophesied.";
vul[20] = "misit ergo Saul lictores ut raperent David qui cum vidissent cuneum prophetarum vaticinantium et Samuhel stantem super eos factus est etiam in illis spiritus Domini et prophetare coeperunt etiam ipsi";
kjv[21] = "And when it was told Saul, he sent other messengers, and they prophesied likewise. And Saul sent messengers again the third time, and they prophesied also.";
rsv[21] = "When it was told Saul, he sent other messengers, and they also prophesied. And Saul sent messengers again the third time, and they also prophesied.";
asv[21] = "And when it was told Saul, he sent other messengers, and they also prophesied. And Saul sent messengers again the third time, and they also prophesied.";
yng[21] = "And they declare [it] to Saul, and he sendeth other messengers, and they prophesy -- they also; and Saul addeth and sendeth messengers a third time, and they prophesy -- they also.";
dby[21] = "And it was told Saul, and he sent other messengers, and they also prophesied. And Saul sent messengers again the third time, and they also prophesied.";
web[21] = "And when it was told Saul, he sent other messengers, and they prophesied likewise. And Saul sent messengers again the third time, and they prophesied also.";
hnv[21] = "When it was told Sha\'ul, he sent other messengers, and they also prophesied. Sha\'ul sent messengers again the third time, and they also prophesied.";
vul[21] = "quod cum nuntiatum esset Sauli misit alios nuntios prophetaverunt autem et illi et rursum Saul misit tertios nuntios qui et ipsi prophetaverunt";
kjv[22] = "Then went he also to Ramah, and came to a great well that [is] in Sechu: and he asked and said, Where [are] Samuel and David? And [one] said, Behold, [they be] at Naioth in Ramah.";
rsv[22] = "Then he himself went to Ramah, and came to the great well that is in Secu; and he asked, &quot;Where are Samuel and David?&quot; And one said, &quot;Behold, they are at Nai\'oth in Ramah.&quot;";
asv[22] = "Then went he also to Ramah, and came to the great well that is in Secu: and he asked and said, Where are Samuel and David? And one said, Behold, they are at Naioth in Ramah.";
yng[22] = "And he goeth -- he also -- to Ramath, and cometh in unto the great well which [is] in Sechu, and asketh, and saith, `Where [are] Samuel and David?\' and [one] saith, `Lo, in Naioth in Ramah.\'";
dby[22] = "Then went he also to Ramah, and came to the great well that is in Sechu; and he asked and said, Where are Samuel and David? And one said, Behold, at Naioth by Ramah.";
web[22] = "Then he went also to Ramah, and came to a great well that [is] in Sechu: and he asked and said, Where [are] Samuel and David? And [one] said, Behold, [they are] at Naioth in Ramah.";
hnv[22] = " Then went he also to Ramah, and came to the great well that is in Sekhu: and he asked and said, Where are Shemu\'el and David? One said, Behold, they are at Nayot in Ramah.";
vul[22] = "abiit autem etiam ipse in Ramatha et venit usque ad cisternam magnam quae est in Soccho et interrogavit et dixit in quo loco sunt Samuhel et David dictumque est ei ecce in Nahioth sunt in Rama";
kjv[23] = "And he went thither to Naioth in Ramah: and the Spirit of God was upon him also, and he went on, and prophesied, until he came to Naioth in Ramah.";
rsv[23] = "And he went from there to Nai\'oth in Ramah; and the Spirit of God came upon him also, and as he went he prophesied, until he came to Nai\'oth in Ramah.";
asv[23] = "And he went thither to Naioth in Ramah: and the Spirit of God came upon him also, and he went on, and prophesied, until he came to Naioth in Ramah.";
yng[23] = "And he goeth thither -- unto Naioth in Ramah, and the Spirit of God is upon him -- him also; and he goeth, going on, and he prophesyeth till his coming in to Naioth in Ramah,";
dby[23] = "And he went thither to Naioth by Ramah; and the Spirit of God came upon him also, and he went on, and prophesied, until he came to Naioth by Ramah.";
web[23] = "And he went thither to Naioth in Ramah: and the Spirit of God was upon him also, and he went on, and prophesied, until he came to Naioth in Ramah.";
hnv[23] = "He went there to Nayot in Ramah: and the Spirit of God came on him also, and he went on, and prophesied, until he came to Nayot in Ramah.";
vul[23] = "et abiit in Nahioth in Rama et factus est etiam super eum spiritus Dei et ambulabat ingrediens et prophetabat usque dum veniret in Nahioth in Rama";
kjv[24] = "And he stripped off his clothes also, and prophesied before Samuel in like manner, and lay down naked all that day and all that night. Wherefore they say, [Is] Saul also among the prophets?";
rsv[24] = "And he too stripped off his clothes, and he too prophesied before Samuel, and lay naked all that day and all that night. Hence it is said, &quot;Is Saul also among the prophets?&quot;";
asv[24] = "And he also stripped off his clothes, and he also prophesied before Samuel, and lay down naked all that day and all that night. Wherefore they say, Is Saul also among the prophets?";
yng[24] = "and he strippeth off -- he also -- his garments, and prophesieth -- he also -- before Samuel, and falleth down naked all that day and all the night; therefore they say, `Is Saul also among the prophets?\'";
dby[24] = "And he himself also stripped off his clothes, and prophesied, himself also, before Samuel, and lay down naked all that day and all that night. Wherefore they say, Is Saul also among the prophets?";
web[24] = "And he stripped off his clothes also, and prophesied before Samuel in like manner, and lay down naked all that day and all that night. Wherefore they say, [Is] Saul also among the prophets?";
hnv[24] = "He also stripped off his clothes, and he also prophesied before Shemu\'el, and lay down naked all that day and all that night. Therefore they say, &quot;Is Sha\'ul also among the prophets?&quot;";
vul[24] = "et expoliavit se etiam ipse vestimentis suis et prophetavit cum ceteris coram Samuhel et cecidit nudus tota die illa et nocte unde et exivit proverbium num et Saul inter prophetas";
