csb[1] = "So David left Gath and took refuge in the cave of Adullam. When David\'s brothers and his father\'s whole family heard, they went down and joined him there.&quot;"
csb[2] = "In addition, every man who was desperate, in debt, or discontented rallied around him, and he became their leader. About four hundred men were with him.&quot;"
csb[3] = "From there David went to Mizpeh of Moab where he said to the king of Moab, &quot;Please let my father and mother stay with you until I know what God will do for me.&quot;"
csb[4] = "So he left them in the care of the king of Moab, and they stayed with him the whole time David was in the stronghold.&quot;"
csb[5] = "Then the prophet Gad said to David, &quot;Don\'t stay in the stronghold. Leave and return to the land of Judah.&quot; So David left and went to the forest of Hereth.&quot;"
csb[6] = "Saul heard that David and his men had been discovered. At that time Saul was in Gibeah, sitting under the tamarisk tree at the high place. His spear was in his hand, and all his servants were standing around him.&quot;"
csb[7] = "Saul said to his servants, &quot;Listen, men of Benjamin: Is Jesse\'s son going to give all of you fields and vineyards? Do you think he\'ll make all of you commanders of thousands and commanders of hundreds?&quot;"
csb[8] = "&quot;That\'s why all of you have conspired against me! Nobody tells me when my own son makes a covenant with Jesse\'s son. None of you cares about me or tells me that my son has stirred up my own servant to wait in ambush for me, as is the case today.&quot;"
csb[9] = "Then Doeg the Edomite, who was in charge of Saul\'s servants, answered: &quot;I saw Jesse\'s son come to Ahimelech son of Ahitub at Nob.&quot;"
csb[10] = "&quot;Ahimelech inquired of the LORD for him and gave him provisions. He also gave him the sword of Goliath the Philistine.&quot;"
csb[11] = "The king sent messengers to summon the priest Ahimelech son of Ahitub, and his father\'s whole family, who were priests in Nob. All of them came to the king.&quot;"
csb[12] = "Then Saul said, &quot;Listen, son of Ahitub! &quot; &quot;I\'m at your service, my lord,&quot; he said.&quot;"
csb[13] = "Saul asked him, &quot;Why did you and Jesse\'s son conspire against me? You gave him bread and a sword and inquired of God for him, so he could rise up against me and wait in ambush, as is the case today.&quot;"
csb[14] = "Ahimelech replied to the king: &quot;Who among all your servants is as faithful as David? He is the king\'s son-in-law, captain of your bodyguard, and honored in your house.&quot;"
csb[15] = "&quot;Was today the first time I inquired of God for him? Of course not! Please don\'t let the king make an accusation against your servant or any of my father\'s family, for your servant didn\'t have any idea about all this.&quot;"
csb[16] = "But the king said, &quot;You will die, Ahimelech -- you and your father\'s whole family! &quot;"
csb[17] = "Then the king ordered the guards standing by him, &quot;Turn and kill the priests of the LORD because they sided with David. For they knew he was fleeing, but they didn\'t tell me.&quot; But the king\'s servants would not lift a hand to execute the priests of the LORD.&quot;"
csb[18] = "So the king said to Doeg, &quot;Go and execute the priests! &quot; So Doeg the Edomite went and executed the priests himself. On that day, he killed eighty-five men who wore linen ephods.&quot;"
csb[19] = "He also struck down Nob, the city of the priests, with the sword -- both men and women, infants and nursing babies, oxen, donkeys, and sheep.&quot;"
csb[20] = "However, one of the sons of Ahimelech son of Ahitub escaped. His name was Abiathar, and he fled to David.&quot;"
csb[21] = "Abiathar told David that Saul had killed the priests of the LORD.&quot;"
csb[22] = "Then David said to Abiathar, &quot;I knew that Doeg the Edomite was there that day and that he was sure to report to Saul. I myself am responsible for the lives of everyone in your father\'s family.&quot;"
csb[23] = "&quot;Stay with me. Don\'t be afraid, for the one who wants to take my life wants to take your life. You will be safe with me.&quot;"
kjv[1] = "David therefore departed thence, and escaped to the cave Adullam: and when his brethren and all his father\'s house heard [it], they went down thither to him.";
kjv[2] = "And every one [that was] in distress, and every one that [was] in debt, and every one [that was] discontented, gathered themselves unto him; and he became a captain over them: and there were with him about four hundred men.";
kjv[3] = "And David went thence to Mizpeh of Moab: and he said unto the king of Moab, Let my father and my mother, I pray thee, come forth, [and be] with you, till I know what God will do for me.";
kjv[4] = "And he brought them before the king of Moab: and they dwelt with him all the while that David was in the hold.";
kjv[5] = "And the prophet Gad said unto David, Abide not in the hold; depart, and get thee into the land of Judah. Then David departed, and came into the forest of Hareth.";
kjv[6] = "When Saul heard that David was discovered, and the men that [were] with him, (now Saul abode in Gibeah under a tree in Ramah, having his spear in his hand, and all his servants [were] standing about him;)";
kjv[7] = "Then Saul said unto his servants that stood about him, Hear now, ye Benjamites; will the son of Jesse give every one of you fields and vineyards, [and] make you all captains of thousands, and captains of hundreds;";
kjv[8] = "That all of you have conspired against me, and [there is] none that sheweth me that my son hath made a league with the son of Jesse, and [there is] none of you that is sorry for me, or sheweth unto me that my son hath stirred up my servant against me, to lie in wait, as at this day?";
kjv[9] = "Then answered Doeg the Edomite, which was set over the servants of Saul, and said, I saw the son of Jesse coming to Nob, to Ahimelech the son of Ahitub.";
kjv[10] = "And he enquired of the LORD for him, and gave him victuals, and gave him the sword of Goliath the Philistine.";
kjv[11] = "Then the king sent to call Ahimelech the priest, the son of Ahitub, and all his father\'s house, the priests that [were] in Nob: and they came all of them to the king.";
kjv[12] = "And Saul said, Hear now, thou son of Ahitub. And he answered, Here I [am], my lord.";
kjv[13] = "And Saul said unto him, Why have ye conspired against me, thou and the son of Jesse, in that thou hast given him bread, and a sword, and hast enquired of God for him, that he should rise against me, to lie in wait, as at this day?";
kjv[14] = "Then Ahimelech answered the king, and said, And who [is so] faithful among all thy servants as David, which is the king\'s son in law, and goeth at thy bidding, and is honourable in thine house?";
kjv[15] = "Did I then begin to enquire of God for him? be it far from me: let not the king impute [any] thing unto his servant, [nor] to all the house of my father: for thy servant knew nothing of all this, less or more.";
kjv[16] = "And the king said, Thou shalt surely die, Ahimelech, thou, and all thy father\'s house.";
kjv[17] = "And the king said unto the footmen that stood about him, Turn, and slay the priests of the LORD; because their hand also [is] with David, and because they knew when he fled, and did not shew it to me. But the servants of the king would not put forth their hand to fall upon the priests of the LORD.";
kjv[18] = "And the king said to Doeg, Turn thou, and fall upon the priests. And Doeg the Edomite turned, and he fell upon the priests, and slew on that day fourscore and five persons that did wear a linen ephod.";
kjv[19] = "And Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings, and oxen, and asses, and sheep, with the edge of the sword.";
kjv[20] = "And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.";
kjv[21] = "And Abiathar shewed David that Saul had slain the LORD\'S priests.";
kjv[22] = "And David said unto Abiathar, I knew [it] that day, when Doeg the Edomite [was] there, that he would surely tell Saul: I have occasioned [the death] of all the persons of thy father\'s house.";
kjv[23] = "Abide thou with me, fear not: for he that seeketh my life seeketh thy life: but with me thou [shalt be] in safeguard.";

vul[14] = "respondensque Ahimelech regi ait et quis in omnibus servis tuis sicut David fidelis et gener regis et pergens ad imperium tuum et gloriosus in domo tua";
rsv[15] = "Is today the first time that I have inquired of God for him? No! Let not the king impute anything to his servant or to all the house of my father; for your servant has known nothing of all this, much or little.&quot;";
asv[15] = "Have I to-day begun to inquire of God for him? be it far from me: let not the king impute anything unto his servant, nor to all the house of my father; for thy servant knoweth nothing of all this, less or more.";
yng[15] = "To-day have I begun to ask for him at God? far be it from me! let not the king lay anything against his servant, against any of the house of my father, for thy servant hath known nothing of all this, less or more.\'";
dby[15] = "Was it to-day that I began to inquire of God for him? be it far from me: let not the king charge anything to his servant, [nor] to all the house of my father; for thy servant knew nothing of all this, less or more.";
web[15] = "Did I then begin to inquire of God for him? be it far from me. Let not the king impute [any] thing to his servant, [nor] to all the house of my father: for thy servant knew nothing of all this, less or more.";
hnv[15] = "Have I today begun to inquire of God for him? be it far from me: don\'t let the king impute anything to his servant, nor to all the house of my father; for your servant knows nothing of all this, less or more.";
vul[15] = "num hodie coepi consulere pro eo Deum absit hoc a me ne suspicetur rex adversus servum suum rem huiuscemodi in universa domo patris mei non enim scivit servus tuus quicquam super hoc negotio vel modicum vel grande";
rsv[16] = "And the king said, &quot;You shall surely die, Ahim\'elech, you and all your father\'s house.&quot;";
asv[16] = "And the king said, Thou shalt surely die, Ahimelech, thou, and all thy father\'s house.";
yng[16] = "And the king saith, `Thou dost surely die, Ahimelech, thou, and all the house of thy father.\'";
dby[16] = "And the king said, Thou shalt certainly die, Ahimelech, thou, and all thy father\'s house.";
web[16] = "And the king said, Thou shalt surely die, Ahimelech, thou, and all thy father\'s house.";
hnv[16] = "The king said, You shall surely die, Achimelekh, you, and all your father\'s house.";
vul[16] = "dixitque rex morte morieris Ahimelech tu et omnis domus patris tui";
rsv[17] = "And the king said to the guard who stood about him, &quot;Turn and kill the priests of the LORD; because their hand also is with David, and they knew that he fled, and did not disclose it to me.&quot; But the servants of the king would not put forth their hand to fall upon the priests of the LORD.";
asv[17] = "And the king said unto the guard that stood about him, Turn, and slay the priests of Jehovah; because their hand also is with David, and because they knew that he fled, and did not disclose it to me. But the servants of the king would not put forth their hand to fall upon the priests of Jehovah.";
yng[17] = "And the king saith to runners, those standing by him, `Turn round, and put to death the priests of Jehovah, because their hand also [is] with David, and because they have known that he is fleeing, and have not uncovered mine ear;\' and the servants of the king have not been willing to put forth their hand to come against the priests of Jehovah.";
dby[17] = "And the king said to the couriers that stood about him, Turn and put the priests of Jehovah to death; because their hand also is with David, and because they knew when he fled, and did not inform me. But the servants of the king were not willing to put forth their hand to fall on the priests of Jehovah.";
web[17] = "And the king said to the footmen that stood about him, Turn, and slay the priests of the LORD: because their hand also [is] with David, and because they knew when he fled, and did not show it to me. But the servants of the king would not put forth their hand to fall upon the priests of the LORD.";
hnv[17] = "The king said to the guard who stood about him, Turn, and kill the Kohanim of the LORD; because their hand also is with David, and because they knew that he fled, and didn\'t disclose it to me. But the servants of the king wouldn\'t put forth their hand to fall on the Kohanim of the LORD.";
vul[17] = "et ait rex emissariis qui circumstabant eum convertimini et interficite sacerdotes Domini nam manus eorum cum David est scientes quod fugisset non indicaverunt mihi noluerunt autem servi regis extendere manum suam in sacerdotes Domini";
rsv[18] = "Then the king said to Do\'eg, &quot;You turn and fall upon the priests.&quot; And Do\'eg the E\'domite turned and fell upon the priests, and he killed on that day eighty-five persons who wore the linen ephod.";
asv[18] = "And the king said to Doeg, Turn thou, and fall upon the priests. And Doeg the Edomite turned, and he fell upon the priests, and he slew on that day fourscore and five persons that did wear a linen ephod.";
yng[18] = "And the king saith to Doeg, `Turn round thou, and come against the priests;\' and Doeg the Edomite turneth round, and cometh himself against the priests, and putteth to death in that day eighty and five men bearing a linen ephod,";
dby[18] = "And the king said to Doeg, Turn thou, and fall on the priests. And Doeg the Edomite turned, and fell on the priests, and put to death that day eighty-five persons who wore the linen ephod.";
web[18] = "And the king said to Doeg, Turn thou, and fall upon the priests. And Doeg the Edomite turned, and he fell upon the priests, and slew on that day eighty and five persons that wore a linen ephod.";
hnv[18] = "The king said to Do\'eg, Turn you, and fall on the Kohanim. Do\'eg the Edomite turned, and he fell on the Kohanim, and he killed on that day eighty-five persons who wore a linen efod.";
vul[18] = "et ait rex Doec convertere tu et inrue in sacerdotes conversusque Doec Idumeus inruit in sacerdotes et trucidavit in die illa octoginta quinque viros vestitos ephod lineo";
rsv[19] = "And Nob, the city of the priests, he put to the sword; both men and women, children and sucklings, oxen, asses and sheep, he put to the sword.";
asv[19] = "And Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings, and oxen and asses and sheep, with the edge of the sword.";
yng[19] = "and Nob, the city of the priests, he hath smitten by the mouth of the sword, from man even unto woman, from infant even unto suckling, and ox, and ass, and sheep, by the mouth of the sword.";
dby[19] = "And Nob, the city of the priests, he smote with the edge of the sword, both men and women, infants and sucklings, and oxen, and asses, and sheep, with the edge of the sword.";
web[19] = "And Nob, the city of the priests, he smote with the edge of the sword, both men and women, children and sucklings, and oxen, and asses, and sheep, with the edge of the sword.";
hnv[19] = "Nov, the city of the Kohanim, struck he with the edge of the sword, both men and women, children and nursing babies, and oxen and donkeys and sheep, with the edge of the sword.";
vul[19] = "Nobe autem civitatem sacerdotum percussit in ore gladii viros et mulieres parvulos et lactantes bovem et asinum et ovem in ore gladii";
rsv[20] = "But one of the sons of Ahim\'elech the son of Ahi\'tub, named Abi\'athar, escaped and fled after David.";
asv[20] = "And one of the sons of Ahimelech, the son of Ahitub, named Abiathar, escaped, and fled after David.";
yng[20] = "And there escapeth one son of Ahimelech, son of Ahitub, and his name [is] Abiathar, and he fleeth after David,";
dby[20] = "And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.";
web[20] = "And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.";
hnv[20] = "One of the sons of Achimelekh, the son of Achituv, named Avyatar, escaped, and fled after David.";
vul[20] = "evadens autem unus filius Ahimelech filii Achitob cuius nomen erat Abiathar fugit ad David";
rsv[21] = "And Abi\'athar told David that Saul had killed the priests of the LORD.";
asv[21] = "And Abiathar told David that Saul had slain Jehovah\'s priests.";
yng[21] = "and Abiathar declareth to David that Saul hath slain the priests of Jehovah.";
dby[21] = "And Abiathar informed David that Saul had slain Jehovah\'s priests.";
web[21] = "And Abiathar showed David that Saul had slain the LORD\'S priests.";
hnv[21] = "Avyatar told David that Sha\'ul had slain the LORD\'s Kohanim.";
vul[21] = "et adnuntiavit ei quod occidisset Saul sacerdotes Domini";
rsv[22] = "And David said to Abi\'athar, &quot;I knew on that day, when Do\'eg the E\'domite was there, that he would surely tell Saul. I have occasioned the death of all the persons of your father\'s house.";
asv[22] = "And David said unto Abiathar, I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned [the death] of all the persons of thy father\'s house.";
yng[22] = "And David saith to Abiathar, `I have known on that day when Doeg the Edomite [is] there, that he doth certainly declare [it] to Saul; I have brought [it] round to every person of the house of thy father;";
dby[22] = "And David said to Abiathar, I knew it that day, when Doeg the Edomite was there, that he would certainly tell Saul: I am accountable for all the lives of thy father\'s house.";
web[22] = "And David said to Abiathar, I knew that day, when Doeg the Edomite [was] there, that he would surely tell Saul: I have occasioned [the death] of all the persons of thy father\'s house.";
hnv[22] = "David said to Avyatar, I knew on that day, when Do\'eg the Edomite was there, that he would surely tell Sha\'ul: I have occasioned [the death] of all the persons of your father\'s house.";
vul[22] = "et ait David ad Abiathar sciebam in die illa quod cum ibi esset Doec Idumeus procul dubio adnuntiaret Saul ego sum reus omnium animarum patris tui";
rsv[23] = "Stay with me, fear not; for he that seeks my life seeks your life; with me you shall be in safekeeping.&quot;";
asv[23] = "Abide thou with me, fear not; for he that seeketh my life seeketh thy life: for with me thou shalt be in safeguard.";
yng[23] = "dwell with me; fear not; for he who seeketh my life seeketh thy life; for a charge [art] thou with me.\'";
dby[23] = "Abide with me, fear not; for he that seeks my life seeks thy life; for with me thou art in safe keeping.";
web[23] = "Abide thou with me, fear not: for he that seeketh my life seeketh thy life: but with me thou [shalt be] in safeguard.";
hnv[23] = "Abide you with me, don\'t be afraid; for he who seeks my life seeks your life: for with me you shall be in safeguard.";
vul[23] = "mane mecum ne timeas si quis quaesierit animam meam quaeret et animam tuam mecumque servaberis";
