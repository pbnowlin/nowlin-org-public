csb[1] = "The Philistines fought against Israel, and Israel\'s men fled from them and were killed on Mount Gilboa.&quot;"
csb[2] = "The Philistines pursued Saul and his sons and killed his sons, Jonathan, Abinadab, and Malchishua.&quot;"
csb[3] = "When the battle intensified against Saul, the archers found him and severely wounded him.&quot;"
csb[4] = "Then Saul said to his armor-bearer, &quot;Draw your sword and run me through with it, or these uncircumcised men will come and run me through and torture me! &quot; But his armor-bearer would not do it because he was terrified. Then Saul took his sword and fell on it.&quot;"
csb[5] = "When his armor-bearer saw that Saul was dead, he also fell on his own sword and died with him.&quot;"
csb[6] = "So on that day, Saul died together with his three sons, his armor-bearer, and all his men.&quot;"
csb[7] = "When the men of Israel on the other side of the valley and on the other side of the Jordan saw that Israel\'s men had fled and that Saul and his sons were dead, they abandoned the cities and fled. So the Philistines came and settled in them.&quot;"
csb[8] = "The next day when the Philistines came to strip the slain, they found Saul and his three sons dead on Mount Gilboa.&quot;"
csb[9] = "They cut off Saul\'s head, stripped off his armor, and sent messengers throughout the land of the Philistines to spread the good news in the temples of their idols and among the people.&quot;"
csb[10] = "Then they put his armor in the temple of the Ashtoreths and hung his body on the wall of Beth-shan.&quot;"
csb[11] = "When the residents of Jabesh-gilead heard what the Philistines had done to Saul,&quot;"
csb[12] = "all their brave men set out, journeyed all night, and retrieved the body of Saul and the bodies of his sons from the wall of Beth-shan. When they arrived at Jabesh, they burned the bodies there.&quot;"
csb[13] = "Afterward, they took their bones and buried them under the tamarisk tree in Jabesh and fasted seven days.&quot;"

kjv[4] = "Then said Saul unto his armourbearer, Draw thy sword, and thrust me through therewith; lest these uncircumcised come and thrust me through, and abuse me. But his armourbearer would not; for he was sore afraid. Therefore Saul took a sword, and fell upon it.";
rsv[4] = "Then Saul said to his armor-bearer, &quot;Draw your sword, and thrust me through with it, lest these uncircumcised come and thrust me through, and make sport of me.&quot; But his armor-bearer would not; for he feared greatly. Therefore Saul took his own sword, and fell upon it.";
