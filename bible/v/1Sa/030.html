csb[1] = "David and his men arrived in Ziklag on the third day. The Amalekites had raided the Negev and attacked and burned Ziklag.&quot;"
csb[2] = "They also had kidnapped the women and everyone in it from youngest to oldest. They had killed no one but had carried them off as they went on their way.&quot;"
csb[3] = "When David and his men arrived at the town, they found it burned. Their wives, sons, and daughters had been kidnapped.&quot;"
csb[4] = "David and the troops with him wept loudly until they had no strength left to weep.&quot;"
csb[5] = "David\'s two wives, Ahinoam the Jezreelite and Abigail the widow of Nabal the Carmelite, had also been kidnapped.&quot;"
csb[6] = "David was in an extremely difficult position because the troops talked about stoning him, for they were all very bitter over the loss of their sons and daughters. But David found strength in the LORD his God.&quot;"
csb[7] = "David said to the priest Abiathar son of Ahimelech, &quot;Bring me the ephod.&quot; So Abiathar brought it to him,&quot;"
csb[8] = "and David asked the LORD: &quot;Should I pursue these raiders? Will I overtake them? &quot; The LORD replied to him, &quot;Pursue them, for you will certainly overtake them and rescue the people.&quot;"
csb[9] = "So David and the six hundred men with him went. They came to the Wadi Besor, where some stayed behind.&quot;"
csb[10] = "David and four hundred of the men continued the pursuit, while two hundred stopped because they were too exhausted to cross the Wadi Besor.&quot;"
csb[11] = "David\'s men found an Egyptian in the open country and brought him to David. They gave him some bread to eat and water to drink.&quot;"
csb[12] = "Then they gave him some pressed figs and two clusters of raisins. After he ate he revived, for he hadn\'t eaten food or drunk water for three days and three nights.&quot;"
csb[13] = "Then David said to him, &quot;Who do you belong to? Where are you from? &quot; &quot;I\'m an Egyptian, the slave of an Amalekite man,&quot; he said. &quot;My master abandoned me when I got sick three days ago.&quot;"
csb[14] = "&quot;We raided the south country of the Cherethites, the territory of Judah, and the south country of Caleb, and we burned Ziklag.&quot;"
csb[15] = "David then asked him, &quot;Will you lead me to these raiders? &quot; He said, &quot;Swear to me by God that you won\'t kill me or turn me over to my master, and I will lead you to them.&quot;"
csb[16] = "So he led him, and there were the Amalekites, spread out over the entire area, eating, drinking, and celebrating because of the great amount of plunder they had taken from the land of the Philistines and the land of Judah.&quot;"
csb[17] = "David slaughtered them from twilight until the evening of the next day. None of them escaped, except four hundred young men who got on camels and fled.&quot;"
csb[18] = "David recovered everything the Amalekites had taken; he also rescued his two wives.&quot;"
csb[19] = "Nothing of theirs was missing from the youngest to the oldest, including the sons and daughters, and all the plunder the Amalekites had taken. David got everything back.&quot;"
csb[20] = "He took all the flocks and herds, which were driven ahead of the other livestock, and the people shouted, &quot;This is David\'s plunder! &quot;"
csb[21] = "When David came to the two hundred men who had been too exhausted to go with him and had been left at the Wadi Besor, they came out to meet him and to meet the troops with him. When David approached the men, he greeted them,&quot;"
csb[22] = "but all the corrupt and worthless men among those who had gone with David argued, &quot;Because they didn\'t go with us, we will not give any of the plunder we recovered to them except for each man\'s wife and children. They may take them and go.&quot;"
csb[23] = "But David said, &quot;My brothers, you must not do this with what the LORD has given us. He protected us and handed over to us the raiders who came against us.&quot;"
csb[24] = "&quot;Who can agree to your proposal? The share of the one who goes into battle is to be the same as the share of the one who remains with the supplies. They will share equally.&quot;"
csb[25] = "And it has been so from that day forward. David established this policy as a law and an ordinance for Israel and it still continues today.&quot;"
csb[26] = "When David came to Ziklag, he sent some of the plunder to his friends, the elders of Judah, saying, &quot;Here is a gift for you from the plunder of the LORD\'s enemies.&quot;"
csb[27] = "He sent gifts to those in Bethel, in Ramoth of the Negev, and in Jattir;&quot;"
csb[28] = "to those in Aroer, in Siphmoth, and in Eshtemoa;&quot;"
csb[29] = "to those in Racal, in the towns of the Jerahmeelites, and in the towns of the Kenites;&quot;"
csb[30] = "to those in Hormah, in Bor-ashan, and in Athach;&quot;"
csb[31] = "to those in Hebron, and to those in all the places where David and his men had roamed.&quot;"

dby[16] = "And he brought him down, and behold, they were spread over the whole land, eating and drinking, and dancing, because of all the great spoil that they had taken out of the land of the Philistines, and out of the land of Judah.";

vul[16] = "qui cum duxisset eum ecce illi discumbebant super faciem universae terrae comedentes et bibentes et quasi festum celebrantes diem pro cuncta praeda et spoliis quae ceperant de terra Philisthim et de terra Iuda";

yng[17] = "And David smiteth them from the twilight even unto the evening of the morrow, and there hath not escaped of them a man, except four hundred young men who have ridden on the camels, and are fled.";
dby[17] = "And David smote them from the twilight even to the evening of the next day; and there escaped not a man of them, save four hundred young men, who rode upon camels, and fled.";

kjv[18] = "And David recovered all that the Amalekites had carried away: and David rescued his two wives.";

dby[18] = "And David recovered all that the Amalekites had taken: and David recovered his two wives.";

hnv[18] = "David recovered all that the `Amaleki had taken; and David rescued his two wives.";

kjv[19] = "And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any [thing] that they had taken to them: David recovered all.";
rsv[19] = "Nothing was missing, whether small or great, sons or daughters, spoil or anything that had been taken; David brought back all.";
asv[19] = "And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor anything that they had taken to them: David brought back all.";
yng[19] = "And there hath not lacked to them [anything], from small unto great, and unto sons and daughters, and from the spoil, even unto all that they had taken to themselves, the whole hath David brought back,";
dby[19] = "And there was nothing missed by them, neither small nor great, neither sons nor daughters, neither spoil nor anything that they had taken: David brought all back.";
web[19] = "And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any [thing] that they had taken to them: David recovered all.";
hnv[19] = " There was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor anything that they had taken to them: David brought back all.";

yng[20] = "and David taketh the whole of the flock, and of the herd, they have led on before these cattle, and they say, `This [is] David\'s spoil.\'";
dby[20] = "And David took all the flocks and the herds, [which] they drove before the other cattle, and said, This is David\'s spoil.";

kjv[21] = "And David came to the two hundred men, which were so faint that they could not follow David, whom they had made also to abide at the brook Besor: and they went forth to meet David, and to meet the people that [were] with him: and when David came near to the people, he saluted them.";
rsv[21] = "Then David came to the two hundred men, who had been too exhausted to follow David, and who had been left at the brook Besor; and they went out to meet David and to meet the people who were with him; and when David drew near to the people he saluted them.";
asv[21] = "And David came to the two hundred men, who were so faint that they could not follow David, whom also they had made to abide at the brook Besor; and they went forth to meet David, and to meet the people that were with him: and when David came near to the people, he saluted them.";
yng[21] = "And David cometh in unto the two hundred men who were too faint to go after David, and whom they cause to abide at the brook of Besor, and they go out to meet David, and to meet the people who [are] with him, and David approacheth the people, and asketh of them of welfare.";
dby[21] = "And David came to the two hundred men who had been too exhausted to follow David, and whom they had left behind at the torrent Besor; and they went forth to meet David, and to meet the people that were with him; and David drew near to the people and saluted them.";
web[21] = "And David came to the two hundred men, who were so faint that they could not follow David, whom they had made also to abide at the brook Besor: and they went forth to meet David, and to meet the people that [were] with him: and when David came near to the people, he saluted them.";
hnv[21] = "David came to the two hundred men, who were so faint that they could not follow David, whom also they had made to abide at the brook Besor; and they went forth to meet David, and to meet the people who were with him: and when David came near to the people, he greeted them.";
vul[21] = "venit autem David ad ducentos viros qui lassi substiterant nec sequi potuerant David et residere eos iusserat in torrente Besor qui egressi sunt obviam David et populo qui erat cum eo accedens autem David ad populum salutavit eos pacifice";
kjv[22] = "Then answered all the wicked men and [men] of Belial, of those that went with David, and said, Because they went not with us, we will not give them [ought] of the spoil that we have recovered, save to every man his wife and his children, that they may lead [them] away, and depart.";
rsv[22] = "Then all the wicked and base fellows among the men who had gone with David said, &quot;Because they did not go with us, we will not give them any of the spoil which we have recovered, except that each man may lead away his wife and children, and depart.&quot;";
asv[22] = "Then answered all the wicked men and base fellows, of those that went with David, and said, Because they went not with us, we will not give them aught of the spoil that we have recovered, save to every man his wife and his children, that he may lead them away, and depart.";
yng[22] = "And every bad and worthless man, of the men who have gone with David, answereth, yea, they say, `Because that they have not gone with us we do not give to them of the spoil which we have delivered, except each his wife and his children, and they lead away and go.";
dby[22] = "And all the wicked men, and [men] of Belial, of those that had gone with David, answered and said, Because they went not with us, we will not give them [aught] of the spoil that we have recovered, save to every man his wife and his children, that they may lead [them] away and depart.";
web[22] = "Then answered all the wicked men, and [men] of Belial, of those that went with David, and said, Because they went not with us, we will not give them [aught] of the spoil that we have recovered, save to every man his wife and his children, that they may lead [them] away, and depart.";
hnv[22] = "Then answered all the wicked men and base fellows, of those who went with David, and said, Because they didn\'t go with us, we will not give them anything of the spoil that we have recovered, except to every man his wife and his children, that he may lead them away, and depart.";
vul[22] = "respondensque omnis vir pessimus et iniquus de viris qui ierant cum David dixit quia non venerunt nobiscum non dabimus eis quicquam de praeda quam eruimus sed sufficiat unicuique uxor sua et filii quos cum acceperint recedant";
kjv[23] = "Then said David, Ye shall not do so, my brethren, with that which the LORD hath given us, who hath preserved us, and delivered the company that came against us into our hand.";
rsv[23] = "But David said, &quot;You shall not do so, my brothers, with what the LORD has given us; he has preserved us and given into our hand the band that came against us.";
asv[23] = "Then said David, Ye shall not do so, my brethren, with that which Jehovah hath given unto us, who hath preserved us, and delivered the troop that came against us into our hand.";
yng[23] = "And David saith, `Ye do not do so, my brethren, with that which Jehovah hath given to us, and He doth preserve us, and doth give the troop which cometh against us into our hand;";
dby[23] = "Then said David, Ye shall not do so, my brethren, with that which Jehovah has given us, who has preserved us, and given the troop that came against us into our hand.";

hnv[23] = "Then said David, You shall not do so, my brothers, with that which the LORD has given to us, who has preserved us, and delivered the troop that came against us into our hand.";

kjv[24] = "For who will hearken unto you in this matter? but as his part [is] that goeth down to the battle, so [shall] his part [be] that tarrieth by the stuff: they shall part alike.";
