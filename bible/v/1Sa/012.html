csb[1] = "Then Samuel said to all Israel, &quot;I have carefully listened to everything you said to me and placed a king over you.&quot;"
csb[2] = "&quot;Now you can see that the king is leading you. As for me, I\'m old and gray, and my sons are here with you. I have led you from my youth until now.&quot;"
csb[3] = "&quot;Here I am. Bring charges against me before the LORD and his anointed: Whose ox or donkey have I taken? Whom have I wronged or mistreated? From whom have I accepted a bribe to overlook something? I will return it to you.&quot;"
csb[4] = "&quot;You haven\'t wronged us, you haven\'t mistreated us, and you haven\'t taken anything from anyone,&quot; they responded.&quot;"
csb[5] = "He said to them, &quot;The LORD is a witness against you, and his anointed is a witness today that you haven\'t found anything in my hand.&quot; &quot;He is a witness,&quot; they said.&quot;"
csb[6] = "Then Samuel said to the people, &quot;The LORD, who appointed Moses and Aaron and who brought your ancestors up from the land of Egypt, is a witness.&quot;"
csb[7] = "&quot;Now present yourselves, so I may confront you before the LORD about all the righteous acts he has done for you and your ancestors.&quot;"
csb[8] = "&quot;When Jacob went to Egypt, your ancestors cried out to the LORD, and he sent them Moses and Aaron, who led your ancestors out of Egypt and settled them in this place.&quot;"
csb[9] = "&quot;But they forgot the LORD their God, so he handed them over to Sisera commander of the army of Hazor, to the Philistines, and to the king of Moab. These enemies fought against them.&quot;"
csb[10] = "&quot;Then they cried out to the LORD and said, \'We have sinned, for we abandoned the LORD and worshiped the Baals and the Ashtoreths. Now rescue us from the power of our enemies, and we will serve you.\'&quot;"
csb[11] = "&quot;So the LORD sent Jerubbaal, Barak, Jephthah, and Samuel. He rescued you from the power of the enemies around you, and you lived securely.&quot;"
csb[12] = "&quot;But when you saw that Nahash king of the Ammonites was coming against you, you said to me, \'No, we must have a king reign over us\' -- even though the LORD your God is your king.&quot;"
csb[13] = "&quot;Now here is the king you\'ve chosen, the one you requested. Look, this is the king the LORD has placed over you.&quot;"
csb[14] = "&quot;If you fear the LORD, worship and obey him, and if you don\'t rebel against the LORD\'s command, then both you and the king who reigns over you will follow the LORD your God.&quot;"
csb[15] = "&quot;However, if you disobey the LORD and rebel against his command, the LORD\'s hand will be against you as it was against your ancestors.&quot;"
csb[16] = "&quot;Now, therefore, present yourselves and see this great thing that the LORD will do before your eyes.&quot;"
csb[17] = "&quot;Isn\'t the wheat harvest today? I will call on the LORD, and he will send thunder and rain so that you will recognize what an immense evil you committed in the LORD\'s sight by requesting a king for yourselves.&quot;"
csb[18] = "Samuel called on the LORD, and on that day the LORD sent thunder and rain. As a result, all the people greatly feared the LORD and Samuel.&quot;"
csb[19] = "They pleaded with Samuel, &quot;Pray to the LORD your God for your servants so we won\'t die! For we have added to all our sins the evil of requesting a king for ourselves.&quot;"
csb[20] = "Samuel replied, &quot;Don\'t be afraid. Even though you have committed all this evil, don\'t turn away from following the LORD. Instead, worship the LORD with all your heart.&quot;"
csb[21] = "&quot;Don\'t turn away to follow worthless things that can\'t profit or rescue you; they are worthless.&quot;"
csb[22] = "&quot;The LORD will not abandon his people, because of his great name and because he has determined to make you his own people.&quot;"
csb[23] = "&quot;As for me, I vow that I will not sin against the LORD by ceasing to pray for you. I will teach you the good and right way.&quot;"
csb[24] = "&quot;Above all, fear the LORD and worship him faithfully with all your heart; consider the great things he has done for you.&quot;"
csb[25] = "&quot;However, if you continue to do what is evil, both you and your king will be swept away.&quot;"

kjv[3] = "Behold, here I [am]: witness against me before the LORD, and before his anointed: whose ox have I taken? or whose ass have I taken? or whom have I defrauded? whom have I oppressed? or of whose hand have I received [any] bribe to blind mine eyes therewith? and I will restore it you.";
