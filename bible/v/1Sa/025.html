csb[1] = "Samuel died, and all Israel assembled to mourn for him, and they buried him by his home in Ramah. David then went down to the Wilderness of Paran.&quot;"
csb[2] = "A man in Maon had a business in Carmel; he was a very rich man with three thousand sheep and one thousand goats and was shearing his sheep in Carmel.&quot;"
csb[3] = "The man\'s name was Nabal, and his wife\'s name, Abigail. The woman was intelligent and beautiful, but the man, a Calebite, was harsh and evil in his dealings.&quot;"
csb[4] = "While David was in the wilderness, he heard that Nabal was shearing sheep,&quot;"
csb[5] = "so David sent ten young men instructing them, &quot;Go up to Carmel, and when you come to Nabal, greet him in my name.&quot;"
csb[6] = "&quot;Then say this: \'Long life to you, and peace to you, peace to your family, and peace to all that is yours.&quot;"
csb[7] = "&quot;I hear that you are shearing. When your shepherds were with us, we did not harass them, and nothing of theirs was missing the whole time they were in Carmel.&quot;"
csb[8] = "&quot;Ask your young men, and they will tell you. So let my young men find favor with you, for we have come on a feast day. Please give whatever you have on hand to your servants and to your son David.\' &quot;"
csb[9] = "David\'s young men went and said all these things to Nabal on David\'s behalf, and they waited.&quot;"
csb[10] = "Nabal asked them, &quot;Who is David? Who is Jesse\'s son? Many slaves these days are running away from their masters.&quot;"
csb[11] = "&quot;Am I supposed to take my bread, my water, and my meat that I butchered for my shearers and give them to these men? I don\'t know where they are from.&quot;"
csb[12] = "David\'s young men retraced their steps. When they returned to him, they reported all these words.&quot;"
csb[13] = "He said to his men, &quot;All of you, put on your swords! &quot; So each man put on his sword, and David also put on his sword. About four hundred men followed David while two hundred stayed with the supplies.&quot;"
csb[14] = "One of Nabal\'s young men informed Abigail, Nabal\'s wife: &quot;Look, David sent messengers from the wilderness to greet our master, but he screamed at them.&quot;"
csb[15] = "&quot;The men treated us very well. When we were in the field, we weren\'t harassed and nothing of ours was missing the whole time we were living among them.&quot;"
csb[16] = "&quot;They were a wall around us, both day and night, the entire time we were with them herding the sheep.&quot;"
csb[17] = "&quot;Now consider carefully what you should do, because there is certain to be trouble for our master and his entire family. He is such a worthless fool nobody can talk to him! &quot;"
csb[18] = "Abigail hurried, taking two hundred loaves of bread, two clay jars of wine, five butchered sheep, a bushel of roasted grain, one hundred clusters of raisins, and two hundred cakes of pressed figs, and loaded them on donkeys.&quot;"
csb[19] = "Then she said to her male servants, &quot;Go ahead of me. I will be right behind you.&quot; But she did not tell her husband Nabal.&quot;"
csb[20] = "As she rode the donkey down a mountain pass hidden from view, she saw David and his men coming toward her and met them.&quot;"
csb[21] = "David had just said, &quot;I guarded everything that belonged to this man in the wilderness for nothing. He was not missing anything, yet he paid me back evil for good.&quot;"
csb[22] = "&quot;May God punish me and do so severely if I let any of his males survive until morning.&quot;"
csb[23] = "When Abigail saw David, she quickly got off the donkey and knelt down with her face to the ground and paid homage to David.&quot;"
csb[24] = "She knelt at his feet and said, &quot;The guilt is mine, my lord, but please let your servant speak to you directly. Listen to the words of your servant.&quot;"
csb[25] = "&quot;My lord should pay no attention to this worthless fool Nabal, for he lives up to his name: His name means \'stupid,\' and stupidity is all he knows. I, your servant, didn\'t see my lord\'s young men whom you sent.&quot;"
csb[26] = "&quot;Now my lord, as surely as the LORD lives and as you yourself live-- it is the LORD who kept you from participating in bloodshed and avenging yourself by your own hand--may your enemies and those who intend to harm my lord be like Nabal.&quot;"
csb[27] = "&quot;Let this gift your servant has brought to my lord be given to the young men who follow my lord.&quot;"
csb[28] = "&quot;Please forgive your servant\'s offense, for the LORD is certain to make a lasting dynasty for my lord because he fights the LORD\'s battles. Throughout your life, may evil not be found in you.&quot;"
csb[29] = "&quot;Someone is pursuing you and intends to take your life. My lord\'s life is tucked safely in the place where the LORD your God protects the living, but he is flinging away your enemies\' lives like stones from a sling.&quot;"
csb[30] = "&quot;When the LORD does for my lord all the good he promised you and appoints you ruler over Israel,&quot;"
csb[31] = "&quot;there will not be remorse or a troubled conscience for my lord because of needless bloodshed or my lord\'s revenge. And when the LORD does good things for my lord, may you remember me your servant.&quot;"
csb[32] = "Then David said to Abigail, &quot;Blessed be the LORD God of Israel, who sent you to meet me today!&quot;"
csb[33] = "&quot;May your discernment be blessed, and may you be blessed. Today you kept me from participating in bloodshed and avenging myself by my own hand.&quot;"
csb[34] = "&quot;Otherwise, as surely as the LORD God of Israel lives, who prevented me from harming you, if you had not come quickly to meet me, Nabal wouldn\'t have had any males left by morning light.&quot;"
csb[35] = "Then David accepted what she had brought him and said, &quot;Go home in peace. See, I have heard what you said and have granted your request.&quot;"
csb[36] = "Then Abigail went to Nabal, and there he was in his house, holding a feast fit for a king. Nabal\'s heart was cheerful, and he was very drunk, so she didn\'t say anything to him until morning light.&quot;"
csb[37] = "In the morning when Nabal sobered up, his wife told him about these events. His heart died and he became a stone.&quot;"
csb[38] = "About ten days later, the LORD struck Nabal dead.&quot;"
csb[39] = "When David heard that Nabal was dead, he said, &quot;Blessed be the LORD who championed my cause against Nabal\'s insults and restrained his servant from doing evil. The LORD brought Nabal\'s evil deeds back on his own head.&quot; Then David sent messengers to speak to Abigail about marrying him.&quot;"
csb[40] = "When David\'s servants came to Abigail at Carmel, they said to her, &quot;David sent us to bring you to him as a wife.&quot;"
csb[41] = "She stood up, paid homage with her face to the ground, and said, &quot;Here I am, your servant, a slave to wash the feet of my lord\'s servants.&quot;"
csb[42] = "Then Abigail got up quickly, and with her five female servants accompanying her, rode on the donkey following David\'s messengers. And so she became his wife.&quot;"
csb[43] = "David also married Ahinoam of Jezreel, and the two of them became his wives.&quot;"
csb[44] = "But Saul gave his daughter Michal, David\'s wife, to Palti son of Laish, who was from Gallim.&quot;"
kjv[1] = "And Samuel died; and all the Israelites were gathered together, and lamented him, and buried him in his house at Ramah. And David arose, and went down to the wilderness of Paran.";
kjv[2] = "And [there was] a man in Maon, whose possessions [were] in Carmel; and the man [was] very great, and he had three thousand sheep, and a thousand goats: and he was shearing his sheep in Carmel.";
kjv[3] = "Now the name of the man [was] Nabal; and the name of his wife Abigail: and [she was] a woman of good understanding, and of a beautiful countenance: but the man [was] churlish and evil in his doings; and he [was] of the house of Caleb.";
kjv[4] = "And David heard in the wilderness that Nabal did shear his sheep.";
kjv[5] = "And David sent out ten young men, and David said unto the young men, Get you up to Carmel, and go to Nabal, and greet him in my name:";
kjv[6] = "And thus shall ye say to him that liveth [in prosperity], Peace [be] both to thee, and peace [be] to thine house, and peace [be] unto all that thou hast.";
kjv[7] = "And now I have heard that thou hast shearers: now thy shepherds which were with us, we hurt them not, neither was there ought missing unto them, all the while they were in Carmel.";
kjv[8] = "Ask thy young men, and they will shew thee. Wherefore let the young men find favour in thine eyes: for we come in a good day: give, I pray thee, whatsoever cometh to thine hand unto thy servants, and to thy son David.";
kjv[9] = "And when David\'s young men came, they spake to Nabal according to all those words in the name of David, and ceased.";
kjv[10] = "And Nabal answered David\'s servants, and said, Who [is] David? and who [is] the son of Jesse? there be many servants now a days that break away every man from his master.";
kjv[11] = "Shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give [it] unto men, whom I know not whence they [be]?";
kjv[12] = "So David\'s young men turned their way, and went again, and came and told him all those sayings.";
kjv[13] = "And David said unto his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the stuff.";
kjv[14] = "But one of the young men told Abigail, Nabal\'s wife, saying, Behold, David sent messengers out of the wilderness to salute our master; and he railed on them.";
kjv[15] = "But the men [were] very good unto us, and we were not hurt, neither missed we any thing, as long as we were conversant with them, when we were in the fields:";
kjv[16] = "They were a wall unto us both by night and day, all the while we were with them keeping the sheep.";
kjv[17] = "Now therefore know and consider what thou wilt do; for evil is determined against our master, and against all his household: for he [is such] a son of Belial, that [a man] cannot speak to him.";
kjv[18] = "Then Abigail made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched [corn], and an hundred clusters of raisins, and two hundred cakes of figs, and laid [them] on asses.";
kjv[19] = "And she said unto her servants, Go on before me; behold, I come after you. But she told not her husband Nabal.";
kjv[20] = "And it was [so, as] she rode on the ass, that she came down by the covert of the hill, and, behold, David and his men came down against her; and she met them.";
kjv[21] = "Now David had said, Surely in vain have I kept all that this [fellow] hath in the wilderness, so that nothing was missed of all that [pertained] unto him: and he hath requited me evil for good.";
kjv[22] = "So and more also do God unto the enemies of David, if I leave of all that [pertain] to him by the morning light any that pisseth against the wall.";
kjv[23] = "And when Abigail saw David, she hasted, and lighted off the ass, and fell before David on her face, and bowed herself to the ground,";
kjv[24] = "And fell at his feet, and said, Upon me, my lord, [upon] me [let this] iniquity [be]: and let thine handmaid, I pray thee, speak in thine audience, and hear the words of thine handmaid.";
kjv[25] = "Let not my lord, I pray thee, regard this man of Belial, [even] Nabal: for as his name [is], so [is] he; Nabal [is] his name, and folly [is] with him: but I thine handmaid saw not the young men of my lord, whom thou didst send.";
kjv[26] = "Now therefore, my lord, [as] the LORD liveth, and [as] thy soul liveth, seeing the LORD hath withholden thee from coming to [shed] blood, and from avenging thyself with thine own hand, now let thine enemies, and they that seek evil to my lord, be as Nabal.";
kjv[27] = "And now this blessing which thine handmaid hath brought unto my lord, let it even be given unto the young men that follow my lord.";
kjv[28] = "I pray thee, forgive the trespass of thine handmaid: for the LORD will certainly make my lord a sure house; because my lord fighteth the battles of the LORD, and evil hath not been found in thee [all] thy days.";
kjv[29] = "Yet a man is risen to pursue thee, and to seek thy soul: but the soul of my lord shall be bound in the bundle of life with the LORD thy God; and the souls of thine enemies, them shall he sling out, [as out] of the middle of a sling.";
kjv[30] = "And it shall come to pass, when the LORD shall have done to my lord according to all the good that he hath spoken concerning thee, and shall have appointed thee ruler over Israel;";
kjv[31] = "That this shall be no grief unto thee, nor offence of heart unto my lord, either that thou hast shed blood causeless, or that my lord hath avenged himself: but when the LORD shall have dealt well with my lord, then remember thine handmaid.";
kjv[32] = "And David said to Abigail, Blessed [be] the LORD God of Israel, which sent thee this day to meet me:";
kjv[33] = "And blessed [be] thy advice, and blessed [be] thou, which hast kept me this day from coming to [shed] blood, and from avenging myself with mine own hand.";
kjv[34] = "For in very deed, [as] the LORD God of Israel liveth, which hath kept me back from hurting thee, except thou hadst hasted and come to meet me, surely there had not been left unto Nabal by the morning light any that pisseth against the wall.";
kjv[35] = "So David received of her hand [that] which she had brought him, and said unto her, Go up in peace to thine house; see, I have hearkened to thy voice, and have accepted thy person.";
kjv[36] = "And Abigail came to Nabal; and, behold, he held a feast in his house, like the feast of a king; and Nabal\'s heart [was] merry within him, for he [was] very drunken: wherefore she told him nothing, less or more, until the morning light.";
kjv[37] = "But it came to pass in the morning, when the wine was gone out of Nabal, and his wife had told him these things, that his heart died within him, and he became [as] a stone.";
kjv[38] = "And it came to pass about ten days [after], that the LORD smote Nabal, that he died.";
kjv[39] = "And when David heard that Nabal was dead, he said, Blessed [be] the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept his servant from evil: for the LORD hath returned the wickedness of Nabal upon his own head. And David sent and communed with Abigail, to take her to him to wife.";
kjv[40] = "And when the servants of David were come to Abigail to Carmel, they spake unto her, saying, David sent us unto thee, to take thee to him to wife.";
kjv[41] = "And she arose, and bowed herself on [her] face to the earth, and said, Behold, [let] thine handmaid [be] a servant to wash the feet of the servants of my lord.";
kjv[42] = "And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that went after her; and she went after the messengers of David, and became his wife.";
kjv[43] = "David also took Ahinoam of Jezreel; and they were also both of them his wives.";
kjv[44] = "But Saul had given Michal his daughter, David\'s wife, to Phalti the son of Laish, which [was] of Gallim.";

web[10] = "And Nabal answered David\'s servants, and said, Who [is] David? and who [is] the son of Jesse? there are many servants in these days that break away every man from his master.";
hnv[10] = "Naval answered David\'s servants, and said, Who is David? and who is the son of Yishai? there are many servants now-a-days who break away every man from his master.";
vul[10] = "respondens autem Nabal pueris David ait quis est David et quis est filius Isai hodie increverunt servi qui fugiunt dominos suos";
rsv[11] = "Shall I take my bread and my water and my meat that I have killed for my shearers, and give it to men who come from I do not know where?&quot;";
asv[11] = "Shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give it unto men of whom I know not whence they are?";
yng[11] = "and I have taken my bread, and my water, and my flesh, which I slaughtered for my shearers, and have given [it] to men whom I have not known whence they [are]!\'";
dby[11] = "And shall I take my bread, and my water, and my flesh which I have killed for my shearers, and give [it] to men whom I know not whence they are?";
web[11] = "Shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give [it] to men, whom I know not whence they [are]?";
hnv[11] = "Shall I then take my bread, and my water, and my meat that I have killed for my shearers, and give it to men who I don\'t know where they come from?";
vul[11] = "tollam ergo panes meos et aquas meas et carnes pecorum quae occidi tonsoribus meis et dabo viris quos nescio unde sint";
rsv[12] = "So David\'s young men turned away, and came back and told him all this.";
asv[12] = "So David\'s young men turned on their way, and went back, and came and told him according to all these words.";
yng[12] = "And the young men of David turn on their way, and turn back, and come in, and declare to him according to all these words.";
dby[12] = "And David\'s young men turned their way, and went back, and came and reported to him according to all those words.";
web[12] = "So David\'s young men turned their way, and went again, and came and told him all these sayings.";
hnv[12] = "So David\'s young men turned on their way, and went back, and came and told him according to all these words.";
vul[12] = "regressi sunt itaque pueri David per viam suam et reversi venerunt et nuntiaverunt ei omnia verba quae dixerat";
rsv[13] = "And David said to his men, &quot;Every man gird on his sword!&quot; And every man of them girded on his sword; David also girded on his sword; and about four hundred men went up after David, while two hundred remained with the baggage.";
asv[13] = "And David said unto his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the baggage.";
yng[13] = "And David saith to his men, `Gird ye on each his sword;\' and they gird on each his sword, and David also girdeth on his sword, and there go up after David about four hundred men, and two hundred have remained by the vessels.";
dby[13] = "And David said to his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword; and there went up after David about four hundred men; and two hundred abode by the baggage.";
web[13] = "And David said to his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the goods.";
hnv[13] = "David said to his men, Gird you on every man his sword. They girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the baggage.";
vul[13] = "tunc David ait viris suis accingatur unusquisque gladio suo et accincti sunt singuli gladio suo accinctusque est et David ense suo et secuti sunt David quasi quadringenti viri porro ducenti remanserunt ad sarcinas";
rsv[14] = "But one of the young men told Ab\'igail, Nabal\'s wife, &quot;Behold, David sent messengers out of the wilderness to salute our master; and he railed at them.";
asv[14] = "But one of the young men told Abigail, Nabal\'s wife, saying, Behold, David sent messengers out of the wilderness to salute our master; and he railed at them.";
yng[14] = "And to Abigail wife of Nabal hath one young man of the youths declared, saying, `Lo, David hath sent messengers out of the wilderness to bless our lord, and he flieth upon them;";
dby[14] = "And one of [Nabal\'s] young men told Abigail, Nabal\'s wife, saying, Behold, David sent messengers out of the wilderness to bless our master; and he has insulted them.";
web[14] = "But one of the young men told Abigail, Nabal\'s wife, saying, Behold, David sent messengers from the wilderness to salute our master; and he railed at them.";
hnv[14] = "But one of the young men told Avigayil, Naval\'s wife, saying, Behold, David sent messengers out of the wilderness to Greet our master; and he railed at them.";
vul[14] = "Abigail autem uxori Nabal nuntiavit unus de pueris dicens ecce misit David nuntios de deserto ut benedicerent domino nostro et aversus est eos";
rsv[15] = "Yet the men were very good to us, and we suffered no harm, and we did not miss anything when we were in the fields, as long as we went with them;";
asv[15] = "But the men were very good unto us, and we were not hurt, neither missed we anything, as long as we went with them, when we were in the fields:";
yng[15] = "and the men [are] very good to us, and have not put us to shame, and we have not looked after anything all the days we have gone up and down with them, in our being in the field;";
dby[15] = "And the men were very good to us, and we were not hurt, neither missed we anything, as long as we companied with them, when we were in the fields.";
web[15] = "But the men [were] very good to us, and we were not hurt, neither missed we any thing, as long as we were conversant with them, when we were in the fields:";
hnv[15] = "But the men were very good to us, and we were not hurt, neither missed we anything, as long as we went with them, when we were in the fields:";
vul[15] = "homines isti boni satis fuerunt nobis et non molesti nec quicquam aliquando periit omni tempore quo sumus conversati cum eis in deserto";
rsv[16] = "they were a wall to us both by night and by day, all the while we were with them keeping the sheep.";
asv[16] = "they were a wall unto us both by night and by day, all the while we were with them keeping the sheep.";
yng[16] = "a wall they have been unto us both by night and by day, all the days of our being with them, feeding the flock.";
dby[16] = "They were a wall to us both by night and day, all the while we were with them feeding the sheep.";
web[16] = "They were a wall to us both by night and day, all the while we were with them keeping the sheep.";
hnv[16] = "they were a wall to us both by night and by day, all the while we were with them keeping the sheep.";
vul[16] = "pro muro erant nobis tam in nocte quam in die omnibus diebus quibus pavimus apud eos greges";
rsv[17] = "Now therefore know this and consider what you should do; for evil is determined against our master and against all his house, and he is so ill-natured that one cannot speak to him.&quot;";
asv[17] = "Now therefore know and consider what thou wilt do; for evil is determined against our master, and against all his house: for he is such a worthless fellow, that one cannot speak to him.";
yng[17] = "`And, now, know and consider what thou dost; for evil hath been determined against our lord, and against all his house, and he [is] too much a son of worthlessness to be spoken to.\'";
dby[17] = "And now know and consider what thou wilt do, for evil is determined against our master, and against all his household; and he is such a son of Belial, that one cannot speak to him.";
web[17] = "Now therefore know and consider what thou wilt do: for evil is determined against our master, and against all his household: for he [is such] a son of Belial, that [a man] cannot speak to him.";
hnv[17] = "Now therefore know and consider what you will do; for evil is determined against our master, and against all his house: for he is such a worthless fellow that one can\'t speak to him.";
vul[17] = "quam ob rem considera et recogita quid facias quoniam conpleta est malitia adversum virum tuum et adversus domum tuam et ipse filius est Belial ita ut nemo ei possit loqui";
rsv[18] = "Then Ab\'igail made haste, and took two hundred loaves, and two skins of wine, and five sheep ready dressed, and five measures of parched grain, and a hundred clusters of raisins, and two hundred cakes of figs, and laid them on asses.";
asv[18] = "Then Abigail made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched grain, and a hundred clusters of raisins, and two hundred cakes of figs, and laid them on asses.";
yng[18] = "And Abigail hasteth, and taketh two hundred loaves, and two bottles of wine, and five sheep, prepared, and five measures of roasted corn, and a hundred bunches of raisins, and two hundred bunches of figs, and setteth [them] on the asses.";
dby[18] = "And Abigail made haste, and took two hundred loaves, and two skin-bottles of wine, and five sheep ready dressed, and five measures of parched [corn], and a hundred raisin-cakes, and two hundred fig-cakes, and laid them on asses.";
web[18] = "Then Abigail made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched [corn], and a hundred clusters of raisins, and two hundred cakes of figs, and laid [them] on asses.";
hnv[18] = "Then Avigayil made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched grain, and one hundred clusters of raisins, and two hundred cakes of figs, and laid them on donkeys.";
vul[18] = "festinavit igitur Abigail et tulit ducentos panes et duos utres vini et quinque arietes coctos et quinque sata pulentae et centum ligaturas uvae passae et ducentas massas caricarum et inposuit super asinos";
rsv[19] = "And she said to her young men, &quot;Go on before me; behold, I come after you.&quot; But she did not tell her husband Nabal.";
asv[19] = "And she said unto her young men, Go on before me; behold, I come after you. But she told not her husband Nabal.";
yng[19] = "And she saith to her young men, `Pass over before me; lo, after you I am coming;\' and to her husband Nabal she hath not declared [it];";
dby[19] = "And she said to her young men, Go on before me; behold, I come after you. But she did not tell her husband Nabal.";
web[19] = "And she said to her servants, Go on before me; behold, I come after you. But she told not her husband Nabal.";
hnv[19] = "She said to her young men, Go on before me; behold, I come after you. But she didn\'t tell her husband, Naval.";
vul[19] = "dixitque pueris suis praecedite me ecce ego post tergum sequar vos viro autem suo Nabal non indicavit";
rsv[20] = "And as she rode on the ass, and came down under cover of the mountain, behold, David and his men came down toward her; and she met them.";
asv[20] = "And it was so, as she rode on her ass, and came down by the covert of the mountain, that, behold, David and his men came down toward her; and she met them.";
yng[20] = "and it hath come to pass, she is riding on the ass and is coming down in the secret part of the hill-country, and lo, David and his men are coming down to meet her, and she meeteth them.";
dby[20] = "And as she was riding on the ass, and coming down by the covert of the hill, behold, David and his men came down opposite to her; and she met them.";
web[20] = "And it was [so], [as] she rode on the ass, that she came down by the covert of the hill, and behold, David and his men came down over against her; and she met them.";
hnv[20] = "It was so, as she rode on her donkey, and came down by the covert of the mountain, that behold, David and his men came down toward her; and she met them.";
vul[20] = "cum ergo ascendisset asinum et descenderet ad radices montis David et viri eius descendebant in occursum eius quibus et illa occurrit";
rsv[21] = "Now David had said, &quot;Surely in vain have I guarded all that this fellow has in the wilderness, so that nothing was missed of all that belonged to him; and he has returned me evil for good.";
asv[21] = "Now David had said, Surely in vain have I kept all that this fellow hath in the wilderness, so that nothing was missed of all that pertained unto him: and he hath returned me evil for good.";
yng[21] = "And David said, `Only, in vain I have kept all that this [one] hath in the wilderness, and nothing hath been looked after of all that he hath, and he turneth back to me evil for good;";
dby[21] = "Now David had said, Surely, in vain have I kept all that this [man] had in the wilderness, so that nothing was missed of all that was his; and he has requited me evil for good.";
web[21] = "(Now David had said, Surely in vain have I kept all that this [man] hath in the wilderness, so that nothing was missed of all that [pertained] to him: and he hath requited me evil for good.";
hnv[21] = "Now David had said, Surely in vain have I kept all that this fellow has in the wilderness, so that nothing was missed of all that pertained to him: and he has returned me evil for good.";
vul[21] = "et ait David vere frustra servavi omnia quae huius erant in deserto et non periit quicquam de cunctis quae ad eum pertinebant et reddidit mihi malum pro bono";
rsv[22] = "God do so to David and more also, if by morning I leave so much as one male of all who belong to him.&quot;";
asv[22] = "God do so unto the enemies of David, and more also, if I leave of all that pertain to him by the morning light so much as one man-child.";
yng[22] = "thus doth God do to the enemies of David, and thus He doth add, if I leave of all that he hath till the light of the morning -- of those sitting on the wall.\'";
dby[22] = "So and more also do God to the enemies of David, if I leave of all that is his by the morning light any male.";
web[22] = "So and more also do God to the enemies of David, if I leave of all that [pertain] to him by the morning light any male person.)";
hnv[22] = "God do so to the enemies of David, and more also, if I leave of all that belongs to him by the morning light so much as one man-child.";
vul[22] = "haec faciat Deus inimicis David et haec addat si reliquero de omnibus quae ad eum pertinent usque mane mingentem ad parietem";
rsv[23] = "When Ab\'igail saw David, she made haste, and alighted from the ass, and fell before David on her face, and bowed to the ground.";
asv[23] = "And when Abigail saw David, she hasted, and alighted from her ass, and fell before David on her face, and bowed herself to the ground.";
yng[23] = "And Abigail seeth David, and hasteth and cometh down from off the ass, and falleth before David on her face, and boweth herself to the earth,";
dby[23] = "And when Abigail saw David, she hasted and lighted off the ass, and fell before David on her face, and bowed herself to the ground,";
web[23] = "And when Abigail saw David, she hasted, and lighted off the ass, and fell before David on her face, and bowed herself to the ground.";
hnv[23] = "When Avigayil saw David, she hurried, and alighted from her donkey, and fell before David on her face, and bowed herself to the ground.";
vul[23] = "cum autem vidisset Abigail David festinavit et descendit de asino et procidit coram David super faciem suam et adoravit super terram";
rsv[24] = "She fell at his feet and said, &quot;Upon me alone, my lord, be the guilt; pray let your handmaid speak in your ears, and hear the words of your handmaid.";
asv[24] = "And she fell at his feet, and said, Upon me, my lord, upon me be the iniquity; and let thy handmaid, I pray thee, speak in thine ears, and hear thou the words of thy handmaid.";
yng[24] = "and falleth at his feet and saith, `On me, my lord, the iniquity; and let, I pray thee, thy handmaid speak in thine ear, and hear the words of thy handmaid.";
dby[24] = "and fell at his feet, and said, Upon me, my lord, [upon] me let the iniquity be; but let thy handmaid, I pray thee, speak in thine ears, and hear the words of thy handmaid.";
web[24] = "And fell at his feet, and said, Upon me, my lord, [upon] me [let this] iniquity [be]: and let thy handmaid, I pray thee, speak in thy audience, and hear the words of thy handmaid.";
hnv[24] = "She fell at his feet, and said, On me, my lord, on me be the iniquity; and please let your handmaid speak in your ears. Hear the words of your handmaid.";
vul[24] = "et cecidit ad pedes eius et dixit in me sit domine mi haec iniquitas loquatur obsecro ancilla tua in auribus tuis et audi verba famulae tuae";
rsv[25] = "Let not my lord regard this ill-natured fellow, Nabal; for as his name is, so is he; Nabal is his name, and folly is with him; but I your handmaid did not see the young men of my lord, whom you sent.";
asv[25] = "Let not my lord, I pray thee, regard this worthless fellow, even Nabal; for as his name is, so is he; Nabal is his name, and folly is with him: but I thy handmaid saw not the young men of my lord, whom thou didst send.";
yng[25] = "`Let not, I pray thee, my lord set his heart to this man of worthlessness, on Nabal, for as his name [is] so [is] he; Nabal [is] his name, and folly [is] with him; and I, thine handmaid, did not see the young men of my lord whom thou didst send;";
dby[25] = "Let not my lord, I pray thee, regard this man of Belial, Nabal; for as his name is, so is he: Nabal is his name, and folly is with him; and I thy handmaid did not see the young men of my lord, whom thou didst send.";
web[25] = "Let not my lord, I pray thee, regard this man of Belial, [even] Nabal; for as his name [is], so [is] he; Nabal [is] his name, and folly [is] with him: but I thy handmaid saw not the young men of my lord, whom thou didst send.";
hnv[25] = "Please don\'t let my lord regard this worthless fellow, even Naval; for as his name is, so is he; Naval is his name, and folly is with him: but I your handmaid didn\'t see the young men of my lord, whom you did send.";
vul[25] = "ne ponat oro dominus meus rex cor suum super virum istum iniquum Nabal quia secundum nomen suum stultus est et est stultitia cum eo ego autem ancilla tua non vidi pueros tuos domine mi quos misisti";
rsv[26] = "Now then, my lord, as the LORD lives, and as your soul lives, seeing the LORD has restrained you from bloodguilt, and from taking vengeance with your own hand, now then let your enemies and those who seek to do evil to my lord be as Nabal.";
asv[26] = "Now therefore, my lord, as Jehovah liveth, and as thy soul liveth, seeing Jehovah hath withholden thee from bloodguiltiness, and from avenging thyself with thine own hand, now therefore let thine enemies, and them that seek evil to my lord, be as Nabal.";
yng[26] = "and now, my lord, Jehovah liveth, and thy soul liveth, in that Jehovah hath withheld thee from coming in with blood, and to save thy hand to thee -- now let thine enemies be as Nabal, even those seeking evil unto my lord.";
dby[26] = "And now, my lord, [as] Jehovah liveth, and [as] thy soul liveth, seeing Jehovah has restrained thee from coming with bloodshed, and from avenging thyself with thine own hand, now let thine enemies, and they that seek evil to my lord, be as Nabal.";
web[26] = "Now therefore, my lord, [as] the LORD liveth, and [as] thy soul liveth, seeing the LORD hath withheld thee from coming to [shed] blood, and from avenging thyself with thy own hand, now let thy enemies, and they that seek evil to my lord, be as Nabal.";
hnv[26] = "Now therefore, my lord, as the LORD lives, and as your soul lives, seeing the LORD has withheld you from blood guiltiness, and from avenging yourself with your own hand, now therefore let your enemies, and those who seek evil to my lord, be as Naval.";
vul[26] = "nunc ergo domine mi vivit Dominus et vivit anima tua qui prohibuit te ne venires in sanguine et salvavit manum tuam tibi et nunc fiant sicut Nabal inimici tui et qui quaerunt domino meo malum";
rsv[27] = "And now let this present which your servant has brought to my lord be given to the young men who follow my lord.";
asv[27] = "And now this present which thy servant hath brought unto my lord, let it be given unto the young men that follow my lord.";
yng[27] = "`And, now, this blessing which thy maid-servant hath brought to my lord -- it hath been given to the young men who are going up and down at the feet of my lord.";
dby[27] = "And now this blessing which thy bondmaid has brought to my lord, let it be given to the young men that follow my lord.";
web[27] = "And now this blessing which thy handmaid hath brought to my lord, let it even be given to the young men that follow my lord.";
hnv[27] = "Now this present which your servant has brought to my lord, let it be given to the young men who follow my lord.";
vul[27] = "quapropter suscipe benedictionem hanc quam adtulit ancilla tua tibi domino meo et da pueris qui sequuntur te dominum meum";
rsv[28] = "Pray forgive the trespass of your handmaid; for the LORD will certainly make my lord a sure house, because my lord is fighting the battles of the LORD; and evil shall not be found in you so long as you live.";
asv[28] = "Forgive, I pray thee, the trespass of thy handmaid: for Jehovah will certainly make my lord a sure house, because my lord fighteth the battles of Jehovah; and evil shall not be found in thee all thy days.";
yng[28] = "`Bear, I pray thee, with the transgression of thy handmaid, for Jehovah doth certainly make to my lord a stedfast house; for the battles of Jehovah hath my lord fought, and evil is not found in thee [all] thy days.";
dby[28] = "I pray thee, forgive the transgression of thy handmaid: for Jehovah will certainly make my lord a lasting house; because my lord fights the battles of Jehovah, and evil has not been found in thee all thy days.";
web[28] = "I pray thee, forgive the trespass of thy handmaid: for the LORD will certainly make my lord a sure house; because my lord fighteth the battles of the LORD, and evil hath not been found in thee [all] thy days.";
hnv[28] = "Please forgive the trespass of your handmaid: for the LORD will certainly make my lord a sure house, because my lord fights the battles of the LORD; and evil shall not be found in you all your days.";
vul[28] = "aufer iniquitatem famulae tuae faciens enim faciet tibi Dominus domino meo domum fidelem quia proelia Domini domine mi tu proeliaris malitia ergo non inveniatur in te omnibus diebus vitae tuae";
rsv[29] = "If men rise up to pursue you and to seek your life, the life of my lord shall be bound in the bundle of the living in the care of the LORD your God; and the lives of your enemies he shall sling out as from the hollow of a sling.";
asv[29] = "And though men be risen up to pursue thee, and to seek thy soul, yet the soul of my lord shall be bound in the bundle of life with Jehovah thy God; and the souls of thine enemies, them shall he sling out, as from the hollow of a sling.";
yng[29] = "And man riseth to pursue thee and to seek thy soul, and the soul of my lord hath been bound in the bundle of life with Jehovah thy God; as to the soul of thine enemies, He doth sling them out in the midst of the hollow of the sling.";
dby[29] = "And if a man is risen up to pursue thee and to seek thy life, the soul of my lord shall be bound in the bundle of the living with Jehovah thy God; and the souls of thine enemies, them shall he sling out from the hollow of the sling.";
web[29] = "Yet a man hath risen to pursue thee, and to seek thy soul: but the soul of my lord shall be bound in the bundle of life with the LORD thy God; and the souls of thy enemies, them shall he sling out, [as from] the middle of a sling.";
hnv[29] = "Though men be risen up to pursue you, and to seek your soul, yet the soul of my lord shall be bound in the bundle of life with the LORD your God; and the souls of your enemies, them shall he sling out, as from the hollow of a sling.";
vul[29] = "si enim surrexerit aliquando homo persequens te et quaerens animam tuam erit anima domini mei custodita quasi in fasciculo viventium apud Dominum Deum tuum porro anima inimicorum tuorum rotabitur quasi in impetu et circulo fundae";
rsv[30] = "And when the LORD has done to my lord according to all the good that he has spoken concerning you, and has appointed you prince over Israel,";
asv[30] = "And it shall come to pass, when Jehovah shall have done to my lord according to all the good that he hath spoken concerning thee, and shall have appointed thee prince over Israel,";
yng[30] = "`And it hath been, when Jehovah doth to my lord according to all the good which He hath spoken concerning thee, and appointed thee for leader over Israel,";
dby[30] = "And it shall come to pass, when Jehovah shall do to my lord according to all the good that he has spoken concerning thee, and shall appoint thee ruler over Israel,";
web[30] = "And it will come to pass, when the LORD shall have done to my lord according to all the good that he hath spoken concerning thee, and shall have appointed thee ruler over Israel;";
hnv[30] = "It shall come to pass, when the LORD shall have done to my lord according to all the good that he has spoken concerning you, and shall have appointed you prince over Yisra\'el,";
vul[30] = "cum ergo fecerit tibi Dominus domino meo omnia quae locutus est bona de te et constituerit te ducem super Israhel";
rsv[31] = "my lord shall have no cause of grief, or pangs of conscience, for having shed blood without cause or for my lord taking vengeance himself. And when the LORD has dealt well with my lord, then remember your handmaid.&quot;";
asv[31] = "that this shall be no grief unto thee, nor offence of heart unto my lord, either that thou hast shed blood without cause, or that my lord hath avenged himself. And when Jehovah shall have dealt well with my lord, then remember thy handmaid.";
yng[31] = "that this is not to thee for a stumbling-block, and for an offence of heart to my lord -- either to shed blood for nought, or my lord\'s restraining himself; and Jehovah hath done good to my lord, and thou hast remembered thy handmaid.\'";
dby[31] = "that this shall be no stumbling-block to thee, nor offence of heart for my lord, either that thou hast shed blood without cause, or that my lord has avenged himself. And when Jehovah shall deal well with my lord, then remember thy handmaid.";
web[31] = "That this will be no grief to thee, nor offense of heart to my lord, either that thou hast shed blood without cause, or that my lord hath avenged himself: but when the LORD shall have dealt well with my lord, then remember thy handmaid.";
hnv[31] = "that this shall be no grief to you, nor offense of heart to my lord, either that you have shed blood without cause, or that my lord has avenged himself. When the LORD shall have dealt well with my lord, then remember your handmaid.";
vul[31] = "non erit tibi hoc in singultum et in scrupulum cordis domino meo quod effuderis sanguinem innoxium aut ipse te ultus fueris et cum benefecerit Dominus domino meo recordaberis ancillae tuae";
rsv[32] = "And David said to Ab\'igail, &quot;Blessed be the LORD, the God of Israel, who sent you this day to meet me!";
asv[32] = "And David said to Abigail, Blessed be Jehovah, the God of Israel, who sent thee this day to meet me:";
yng[32] = "And David saith to Abigail, `Blessed [is] Jehovah, God of Israel, who hath sent thee this day to meet me,";
dby[32] = "And David said to Abigail, Blessed be Jehovah, the God of Israel, who sent thee this day to meet me.";
web[32] = "And David said to Abigail, Blessed [be] the LORD God of Israel, who sent thee this day to meet me:";
hnv[32] = "David said to Avigayil, Blessed be the LORD, the God of Yisra\'el, who sent you this day to meet me:";
vul[32] = "et ait David ad Abigail benedictus Dominus Deus Israhel qui misit te hodie in occursum meum et benedictum eloquium tuum";
rsv[33] = "Blessed be your discretion, and blessed be you, who have kept me this day from bloodguilt and from avenging myself with my own hand!";
asv[33] = "and blessed be thy discretion, and blessed be thou, that hast kept me this day from bloodguiltiness, and from avenging myself with mine own hand.";
yng[33] = "and blessed [is] thy discretion, and blessed [art] thou in that thou hast restrained me this day from coming in with blood, and to restrain my hand to myself.";
dby[33] = "And blessed be thy discernment, and blessed be thou, who hast kept me this day from coming with bloodshed, and from avenging myself with mine own hand.";
web[33] = "And blessed [be] thy advice, and blessed [be] thou, who hast kept me this day from coming to [shed] blood, and from avenging myself with my own hand.";
hnv[33] = "and blessed be your discretion, and blessed be you, that have kept me this day from blood guiltiness, and from avenging myself with my own hand.";
vul[33] = "et benedicta tu quae prohibuisti me hodie ne irem ad sanguinem et ulciscerer me manu mea";
rsv[34] = "For as surely as the LORD the God of Israel lives, who has restrained me from hurting you, unless you had made haste and come to meet me, truly by morning there had not been left to Nabal so much as one male.&quot;";
asv[34] = "For in very deed, as Jehovah, the God of Israel, liveth, who hath withholden me from hurting thee, except thou hadst hasted and come to meet me, surely there had not been left unto Nabal by the morning light so much as one man-child.";
yng[34] = "And yet, Jehovah liveth, God of Israel, who hath kept me back from doing evil with thee, for unless thou hadst hasted, and dost come to meet me, surely there had not been left to Nabal till the light of the morning, of those sitting on the wall.\'";
dby[34] = "But indeed, as Jehovah the God of Israel liveth, who has restrained me from hurting thee, except thou hadst hasted and come to meet me, there had not been left to Nabal by the morning light any male.";
web[34] = "For in very deed, [as] the LORD God of Israel liveth, who hath kept me back from hurting thee, except thou hadst hasted and come to meet me, surely there had not been left to Nabal by the morning light any male person.";
hnv[34] = "For in very deed, as the LORD, the God of Yisra\'el, lives, who has withheld me from hurting you, except you had hurried and come to meet me, surely there wouldn\'t have been left to Naval by the morning light so much as one man-child.";
vul[34] = "alioquin vivit Dominus Deus Israhel qui prohibuit me malum facere tibi nisi cito venisses in occursum mihi non remansisset Nabal usque ad lucem matutinam mingens ad parietem";
rsv[35] = "Then David received from her hand what she had brought him; and he said to her, &quot;Go up in peace to your house; see, I have hearkened to your voice, and I have granted your petition.&quot;";
asv[35] = "So David received of her hand that which she had brought him: and he said unto her, Go up in peace to thy house; see, I have hearkened to thy voice, and have accepted thy person.";
yng[35] = "And David receiveth from her hand that which she hath brought to him, and to her he hath said, `Go up in peace to thy house; see, I have hearkened to thy voice, and accept thy face.\'";
dby[35] = "So David received of her hand what she had brought him, and said to her, Go up in peace to thy house; see, I have hearkened to thy voice, and have accepted thy person.";
web[35] = "So David received from her hand [that] which she had brought him, and said to her, Return in peace to thy house; see, I have hearkened to thy voice, and have accepted thy person.";
hnv[35] = "So David received of her hand that which she had brought him: and he said to her, Go up in shalom to your house; behold, I have listened to your voice, and have accepted your person.";
vul[35] = "suscepit ergo David de manu eius omnia quae adtulerat ei dixitque ei vade pacifice in domum tuam ecce audivi vocem tuam et honoravi faciem tuam";
rsv[36] = "And Ab\'igail came to Nabal; and, lo, he was holding a feast in his house, like the feast of a king. And Nabal\'s heart was merry within him, for he was very drunk; so she told him nothing at all until the morning light.";
asv[36] = "And Abigail came to Nabal; and, behold, he held a feast in his house, like the feast of a king; and Nabal\'s heart was merry within him, for he was very drunken: wherefore she told him nothing, less or more, until the morning light.";
yng[36] = "And Abigail cometh in unto Nabal, and lo, he hath a banquet in his house, like a banquet of the king, and the heart of Nabal [is] glad within him, and he [is] drunk unto excess, and she hath not declared to him anything, less or more, till the light of the morning.";
dby[36] = "And Abigail came to Nabal; and behold, he held a feast in his house, like the feast of a king; and Nabal\'s heart was merry within him, for he was drunken to excess; so she told him nothing, less or more, until the morning light.";
web[36] = "And Abigail came to Nabal; and behold, he held a feast in his house, like the feast of a king; and Nabal\'s heart [was] merry within him, for he [was] very drunken: Therefore she told him nothing, less or more, until the morning light.";
hnv[36] = "Avigayil came to Naval; and, behold, he held a feast in his house, like the feast of a king; and Naval\'s heart was merry within him, for he was very drunken: therefore she told him nothing, less or more, until the morning light.";
vul[36] = "venit autem Abigail ad Nabal et ecce erat ei convivium in domo eius quasi convivium regis et cor Nabal iucundum erat enim ebrius nimis et non indicavit ei verbum pusillum aut grande usque in mane";
rsv[37] = "And in the morning, when the wine had gone out of Nabal, his wife told him these things, and his heart died within him, and he became as a stone.";
asv[37] = "And it came to pass in the morning, when the wine was gone out of Nabal, that his wife told him these things, and his heart died within him, and he became as a stone.";
yng[37] = "And it cometh to pass in the morning, when the wine is gone out from Nabal, that his wife declareth to him these things, and his heart dieth within him, and he hath been as a stone.";
dby[37] = "And it came to pass in the morning, when the wine was gone out of Nabal, that his wife told him these things; and his heart died within him, and he became [as] a stone.";
web[37] = "But it came to pass in the morning, when the wine had left Nabal, and his wife had told him these things, that his heart died within him, and he became [as] a stone.";
hnv[37] = "It happened in the morning, when the wine was gone out of Naval, that his wife told him these things, and his heart died within him, and he became as a stone.";
vul[37] = "diluculo autem cum digessisset vinum Nabal indicavit ei uxor sua verba haec et emortuum est cor eius intrinsecus et factus est quasi lapis";
rsv[38] = "And about ten days later the LORD smote Nabal; and he died.";
asv[38] = "And it came to pass about ten days after, that Jehovah smote Nabal, so that he died.";
yng[38] = "And it cometh to pass, [in] about ten days, that Jehovah smiteth Nabal, and he dieth,";
dby[38] = "And it came to pass in about ten days that Jehovah smote Nabal, and he died.";
web[38] = "And it came to pass about ten days [after], that the LORD smote Nabal, that he died.";
hnv[38] = "It happened about ten days after, that the LORD struck Naval, so that he died.";
vul[38] = "cumque pertransissent decem dies percussit Dominus Nabal et mortuus est";
rsv[39] = "When David heard that Nabal was dead, he said, &quot;Blessed be the LORD who has avenged the insult I received at the hand of Nabal, and has kept back his servant from evil; the LORD has returned the evil-doing of Nabal upon his own head.&quot; Then David sent and wooed Ab\'igail, to make her his wife.";
asv[39] = "And when David heard that Nabal was dead, he said, Blessed be Jehovah, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept back his servant from evil: and the evil-doing of Nabal hath Jehovah returned upon his own head. And David sent and spake concerning Abigail, to take her to him to wife.";
yng[39] = "and David heareth that Nabal [is] dead, and saith, `Blessed [is] Jehovah who hath pleaded the cause of my reproach from the hand of Nabal, and His servant hath kept back from evil, and the wickedness of Nabal hath Jehovah turned back on his own head;\' and David sendeth and speaketh with Abigail, to take her to him for a wife.";
dby[39] = "And when David heard that Nabal was dead, he said, Blessed be Jehovah, who has pleaded the cause of my reproach from the hand of Nabal, and has kept back his servant from evil; but Jehovah has returned Nabal\'s evil upon his own head. And David sent and communed with Abigail, to take her as his wife.";
web[39] = "And when David heard that Nabal was dead, he said, Blessed [be] the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept his servant from evil: for the LORD hath returned the wickedness of Nabal upon his own head. And David sent and communed with Abigail, to take her to himself for a wife.";
hnv[39] = " When David heard that Naval was dead, he said, Blessed be the LORD, who has pleaded the cause of my reproach from the hand of Naval, and has kept back his servant from evil: and the evil-doing of Naval has the LORD returned on his own head. David sent and spoke concerning Avigayil, to take her to him as wife.";
vul[39] = "quod cum audisset David mortuum Nabal ait benedictus Dominus qui iudicavit causam obprobrii mei de manu Nabal et servum suum custodivit a malo et malitiam Nabal reddidit Dominus in caput eius misit ergo David et locutus est ad Abigail ut sumeret eam sibi in uxorem";
rsv[40] = "And when the servants of David came to Ab\'igail at Carmel, they said to her, &quot;David has sent us to you to take you to him as his wife.&quot;";
asv[40] = "And when the servants of David were come to Abigail to Carmel, they spake unto her, saying, David hath sent us unto thee, to take thee to him to wife.";
yng[40] = "And the servants of David come in unto Abigail at Carmel, and speak unto her, saying, `David hath sent us unto thee to take thee to him for a wife.\'";
dby[40] = "And the servants of David came to Abigail to Carmel, and spoke to her, saying, David has sent us to thee, to take thee as his wife.";
web[40] = "And when the servants of David had come to Abigail to Carmel, they spoke to her, saying, David hath sent us to thee, to take thee to him for a wife.";
hnv[40] = "When the servants of David were come to Avigayil to Karmel, they spoke to her, saying, David has sent us to you, to take you to him as wife.";
vul[40] = "et venerunt pueri David ad Abigail in Carmelum et locuti sunt ad eam dicentes David misit nos ad te ut accipiat te sibi in uxorem";
rsv[41] = "And she rose and bowed with her face to the ground, and said, &quot;Behold, your handmaid is a servant to wash the feet of the servants of my lord.&quot;";
asv[41] = "And she arose, and bowed herself with her face to the earth, and said, Behold, thy handmaid is a servant to wash the feet of the servants of my lord.";
yng[41] = "And she riseth and boweth herself -- face to the earth -- and saith, `Lo, thy handmaid [is] for a maid-servant to wash the feet of the servants of my lord.\'";
dby[41] = "And she arose and bowed herself on her face to the earth, and said, Behold, let thy handmaid be a bondwoman to wash the feet of the servants of my lord.";
web[41] = "And she arose, and bowed herself on [her] face to the earth, and said, Behold, [let] thy handmaid [be] a servant to wash the feet of the servants of my lord.";
hnv[41] = "She arose, and bowed herself with her face to the eretz, and said, Behold, your handmaid is a servant to wash the feet of the servants of my lord.";
vul[41] = "quae consurgens adoravit prona in terram et ait ecce famula tua sit in ancillam ut lavet pedes servorum domini mei";
rsv[42] = "And Ab\'igail made haste and rose and mounted on an ass, and her five maidens attended her; she went after the messengers of David, and became his wife.";
asv[42] = "And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that followed her; and she went after the messengers of David, and became his wife.";
yng[42] = "And Abigail hasteth and riseth, and rideth on the ass; and five of her young women who are going at her feet; and she goeth after the messengers of David, and is to him for a wife.";
dby[42] = "And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that followed her; and she went after the messengers of David, and became his wife.";
web[42] = "And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that went after her; and she went after the messengers of David, and became his wife.";
hnv[42] = "Avigayil hurried, and arose, and rode on a donkey, with five ladies of hers who followed her; and she went after the messengers of David, and became his wife.";
vul[42] = "et festinavit et surrexit Abigail et ascendit super asinum et quinque puellae ierunt cum ea pedisequae eius et secuta est nuntios David et facta est illi uxor";
rsv[43] = "David also took Ahin\'o-am of Jezreel; and both of them became his wives.";
asv[43] = "David also took Ahinoam of Jezreel; and they became both of them his wives.";
yng[43] = "And Ahinoam hath David taken from Jezreel, and they are -- even both of them -- to him for wives;";
dby[43] = "David had also taken Ahinoam of Jizreel; and they became, even both of them, his wives.";
web[43] = "David also took Ahinoam of Jezreel; and they were also both of them his wives.";
hnv[43] = "David also took Achino\'am of Yizre`el; and they became both of them his wives.";
vul[43] = "sed et Ahinoem accepit David de Iezrahel et fuit utraque uxor eius";
rsv[44] = "Saul had given Michal his daughter, David\'s wife, to Palti the son of La\'ish, who was of Gallim.";
asv[44] = "Now Saul had given Michal his daughter, David\'s wife, to Palti the son of Laish, who was of Gallim.";
yng[44] = "and Saul gave Michal his daughter, wife to David, to Phalti son of Laish, who [is] of Gallim.";
dby[44] = "But Saul had given Michal his daughter, David\'s wife, to Phalti the son of Laish, who was of Gallim.";
web[44] = "But Saul had given Michal his daughter, David\'s wife, to Phalti the son of Laish, who [was] of Gallim.";
hnv[44] = "Now Sha\'ul had given Mikhal his daughter, David\'s wife, to Palti the son of Layish, who was of Gallim.";
vul[44] = "Saul autem dedit Michol filiam suam uxorem David Falti filio Lais qui erat de Gallim";
</script>
