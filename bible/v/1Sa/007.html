csb[1] = "So the people of Kiriath-jearim came for the ark of the LORD and took it to Abinadab\'s house on the hill. They consecrated his son Eleazar to take care of it.&quot;"
csb[2] = "Time went by until twenty years had passed since the ark had been taken to Kiriath-jearim. Then the whole house of Israel longed for the LORD.&quot;"
csb[3] = "Samuel told them, &quot;If you are returning to the LORD with all your heart, get rid of the foreign gods and the Ashtoreths that are among you, dedicate yourselves to the LORD, and worship only him. Then he will rescue you from the Philistines.&quot;"
csb[4] = "So the Israelites removed the Baals and the Ashtoreths and only worshiped the LORD.&quot;"
csb[5] = "Samuel said, &quot;Gather all Israel at Mizpah, and I will pray to the LORD on your behalf.&quot;"
csb[6] = "When they gathered at Mizpah, they drew water and poured it out in the LORD\'s presence. They fasted that day, and there they confessed, &quot;We have sinned against the LORD.&quot; And Samuel judged the Israelites at Mizpah.&quot;"
csb[7] = "When the Philistines heard that the Israelites had gathered at Mizpah, their rulers marched up toward Israel. When the Israelites heard about it, they were afraid because of the Philistines.&quot;"
csb[8] = "The Israelites said to Samuel, &quot;Don\'t stop crying out to the LORD our God for us, so that he will save us from the Philistines.&quot;"
csb[9] = "Then Samuel took a young lamb and offered it as a whole burnt offering to the LORD. He cried out to the LORD on behalf of Israel, and the LORD answered him.&quot;"
csb[10] = "Samuel was offering the burnt offering as the Philistines approached to fight against Israel. The LORD thundered loudly against the Philistines that day and threw them into such confusion that they were defeated by Israel.&quot;"
csb[11] = "Then the men of Israel charged out of Mizpah and pursued the Philistines striking them down all the way to a place below Beth-car.&quot;"
csb[12] = "Afterward, Samuel took a stone and set it upright between Mizpah and Shen. He named it Ebenezer, explaining, &quot;The LORD has helped us to this point.&quot;"
csb[13] = "So the Philistines were subdued and did not invade Israel\'s territory again. The LORD\'s hand was against the Philistines all of Samuel\'s life.&quot;"
csb[14] = "The cities from Ekron to Gath, which they had taken from Israel, were restored; Israel even rescued their surrounding territories from Philistine control. There was also peace between Israel and the Amorites.&quot;"
csb[15] = "Samuel judged Israel throughout his life.&quot;"
csb[16] = "Every year he would go on a circuit to Bethel, Gilgal, and Mizpah and would judge Israel at all these locations.&quot;"
csb[17] = "Then he would return to Ramah because his home was there, he judged Israel there, and he built an altar to the LORD there.&quot;"
kjv[1] = "And the men of Kirjathjearim came, and fetched up the ark of the LORD, and brought it into the house of Abinadab in the hill, and sanctified Eleazar his son to keep the ark of the LORD.";
rsv[1] = "And the men of Kir\'iath-je\'arim came and took up the ark of the LORD, and brought it to the house of Abin\'adab on the hill; and they consecrated his son, Elea\'zar, to have charge of the ark of the LORD.";
asv[1] = "And the men of Kiriath-jearim came, and fetched up the ark of Jehovah, and brought it into the house of Abinadab in the hill, and sanctified Eleazar his son to keep the ark of Jehovah.";
yng[1] = "And the men of Kirjath-Jearim come and bring up the ark of Jehovah, and bring it in unto the house of Abinadab, in the height, and Eleazar his son they have sanctified to keep the ark of Jehovah.";
dby[1] = "And the men of Kirjath-jearim came, and fetched up the ark of Jehovah, and brought it into the house of Abinadab on the hill, and hallowed Eleazar his son to keep the ark of Jehovah.";
web[1] = "And the men of Kirjath-jearim came, and brought up the ark of the LORD, and brought it into the house of Abinadab on the hill, and sanctified Eleazar his son to keep the ark of the LORD.";
hnv[1] = "The men of Kiryat-Ye`arim came, and fetched up the ark of the LORD, and brought it into the house of Avinadav in the hill, and sanctified El`azar his son to keep the ark of the LORD.";
vul[1] = "venerunt ergo viri Cariathiarim et duxerunt arcam Domini et intulerunt eam in domum Abinadab in Gabaa Eleazarum autem filium eius sanctificaverunt ut custodiret arcam Domini";
kjv[2] = "And it came to pass, while the ark abode in Kirjathjearim, that the time was long; for it was twenty years: and all the house of Israel lamented after the LORD.";
rsv[2] = "From the day that the ark was lodged at Kir\'iath-je\'arim, a long time passed, some twenty years, and all the house of Israel lamented after the LORD.";
asv[2] = "And it came to pass, from the day that the ark abode in Kiriath-jearim, that the time was long; for it was twenty years: and all the house of Israel lamented after Jehovah.";
yng[2] = "And it cometh to pass, from the day of the dwelling of the ark in Kirjath-Jearim, that the days are multiplied -- yea, they are twenty years -- and wail do all the house of Israel after Jehovah.";
dby[2] = "And it came to pass, from the day that the ark abode in Kirjath-jearim, that the time was long; for it was twenty years. And all the house of Israel lamented after Jehovah.";
web[2] = "And it came to pass, while the ark abode in Kirjath-jearim, that the time was long; for it was twenty years: and all the house of Israel lamented after the LORD.";
hnv[2] = "It happened, from the day that the ark abode in Kiryat-Ye`arim, that the time was long; for it was twenty years: and all the house of Yisra\'el lamented after the LORD.";
vul[2] = "et factum est ex qua die mansit arca in Cariathiarim multiplicati sunt dies erat quippe iam annus vicesimus et requievit omnis domus Israhel post Dominum";
kjv[3] = "And Samuel spake unto all the house of Israel, saying, If ye do return unto the LORD with all your hearts, [then] put away the strange gods and Ashtaroth from among you, and prepare your hearts unto the LORD, and serve him only: and he will deliver you out of the hand of the Philistines.";
rsv[3] = "Then Samuel said to all the house of Israel, &quot;If you are returning to the LORD with all your heart, then put away the foreign gods and the Ash\'taroth from among you, and direct your heart to the LORD, and serve him only, and he will deliver you out of the hand of the Philistines.&quot;";
asv[3] = "And Samuel spake unto all the house of Israel, saying, If ye do return unto Jehovah with all your heart, then put away the foreign gods and the Ashtaroth from among you, and direct your hearts unto Jehovah, and serve him only; and he will deliver you out of the hand of the Philistines.";
yng[3] = "And Samuel speaketh unto all the house of Israel, saying, `If with all your heart ye are turning back unto Jehovah -- turn aside the gods of the stranger from your midst, and Ashtaroth; and prepare your heart unto Jehovah, and serve Him only, and He doth deliver you out of the hand of the Philistines.\'";
dby[3] = "And Samuel spoke to all the house of Israel, saying, If ye return to Jehovah with all your heart, put away the strange gods and the Ashtoreths from among you, and apply your hearts unto Jehovah, and serve him only; and he will deliver you out of the hand of the Philistines.";
web[3] = "And Samuel spoke to all the house of Israel, saying, If ye do return to the LORD with all your hearts, [then] put away the strange gods, and Ashtaroth, from among you, and prepare your hearts to the LORD, and serve him only: and he will deliver you from the hand of the Philistines.";
hnv[3] = "Shemu\'el spoke to all the house of Yisra\'el, saying, If you do return to the LORD with all your heart, then put away the foreign gods and the `Ashtarot from among you, and direct your hearts to the LORD, and serve him only; and he will deliver you out of the hand of the Pelishtim.";
vul[3] = "ait autem Samuhel ad universam domum Israhel dicens si in toto corde vestro revertimini ad Dominum auferte deos alienos de medio vestrum et Astharoth et praeparate corda vestra Domino et servite ei soli et eruet vos de manu Philisthim";

rsv[10] = "As Samuel was offering up the burnt offering, the Philistines drew near to attack Israel; but the LORD thundered with a mighty voice that day against the Philistines and threw them into confusion; and they were routed before Israel.";

yng[10] = "and Samuel is causing the burnt-offering to go up -- and the Philistines have drawn nigh to battle against Israel -- and Jehovah doth thunder with a great noise, on that day, upon the Philistines, and troubleth them, and they are smitten before Israel.";
dby[10] = "And as Samuel was offering up the burnt-offering, the Philistines advanced to battle against Israel. And Jehovah thundered with a great thunder on that day upon the Philistines, and discomfited them; and they were routed before Israel.";
