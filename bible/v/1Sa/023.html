csb[1] = "It was reported to David: &quot;Look, the Philistines are fighting against Keilah and raiding the threshing floors.&quot;"
csb[2] = "So David inquired of the LORD: &quot;Should I launch an attack against these Philistines? &quot; The LORD answered David, &quot;Launch an attack against the Philistines and rescue Keilah.&quot;"
csb[3] = "But David\'s men said to him, &quot;Look, we\'re afraid here in Judah; how much more if we go to Keilah against the Philistine forces! &quot;"
csb[4] = "Once again, David inquired of the LORD, and the LORD answered him: &quot;Go at once to Keilah, for I will hand the Philistines over to you.&quot;"
csb[5] = "Then David and his men went to Keilah, fought against the Philistines, drove their livestock away, and inflicted heavy losses on them. So David rescued the inhabitants of Keilah.&quot;"
csb[6] = "Abiathar son of Ahimelech fled to David at Keilah, and he brought an ephod with him.&quot;"
csb[7] = "When it was reported to Saul that David had gone to Keilah, he said, &quot;God has handed him over to me, for he has trapped himself by entering a town with barred gates.&quot;"
csb[8] = "Then Saul summoned all the troops to go to war at Keilah and besiege David and his men.&quot;"
csb[9] = "When David learned that Saul was plotting evil against him, he said to the priest Abiathar, &quot;Bring the ephod.&quot;"
csb[10] = "Then David said, &quot;LORD God of Israel, your servant has reliable information that Saul intends to come to Keilah and destroy the town because of me.&quot;"
csb[11] = "&quot;Will the citizens of Keilah hand me over to him? Will Saul come down as your servant has heard? LORD God of Israel, please tell your servant.&quot; The LORD answered, &quot;He will come down.&quot;"
csb[12] = "Then David asked, &quot;Will the citizens of Keilah hand me and my men over to Saul? &quot; &quot;They will,&quot; the LORD responded.&quot;"
csb[13] = "So David and his men, numbering about six hundred, left Keilah at once and moved from place to place. When it was reported to Saul that David had escaped from Keilah, he called off the expedition.&quot;"
csb[14] = "David then stayed in the wilderness strongholds and in the hill country of the Wilderness of Ziph. Saul searched for him every day, but God did not hand David over to him.&quot;"
csb[15] = "David was in the Wilderness of Ziph in Horesh when he saw that Saul had come out to take his life.&quot;"
csb[16] = "Then Saul\'s son Jonathan came to David in Horesh and encouraged him in his faith in God,&quot;"
csb[17] = "saying, &quot;Don\'t be afraid, for my father Saul will never lay a hand on you. You yourself will be king over Israel, and I\'ll be your second-in-command. Even my father Saul knows it is true.&quot;"
csb[18] = "Then the two of them made a covenant in the LORD\'s presence. Afterward, David remained in Horesh, while Jonathan went home.&quot;"
csb[19] = "Some Ziphites came up to Saul at Gibeah and said, &quot;David is hiding among us in the strongholds in Horesh on the hill of Hachilah south of Jeshimon.&quot;"
csb[20] = "&quot;Now, whenever the king wants to come down, let him come down. Our part will be to hand him over to the king.&quot;"
csb[21] = "&quot;May you be blessed by the LORD,&quot; replied Saul, &quot;for you have shown concern for me.&quot;"
csb[22] = "&quot;Go and check again. Investigate where he goes and who has seen him there; they tell me he is extremely cunning.&quot;"
csb[23] = "&quot;Investigate all the places where he hides. Then come back to me with accurate information, and I\'ll go with you. If it turns out he really is in the region, I\'ll search for him among all the clans of Judah.&quot;"
csb[24] = "So they went to Ziph ahead of Saul. Now David and his men were in the wilderness near Maon in the Arabah south of Jeshimon,&quot;"
csb[25] = "and Saul and his men went to look for him. When David was told about it, he went down to the rock and stayed in the Wilderness of Maon. Saul heard of this and pursued David there.&quot;"
csb[26] = "Saul went along one side of the mountain and David and his men went along the other side. Even though David was hurrying to get away from Saul, Saul and his men were closing in on David and his men to capture them.&quot;"
csb[27] = "Then a messenger came to Saul saying, &quot;Come quickly, because the Philistines have raided the land! &quot;"
csb[28] = "So Saul broke off his pursuit of David and went to engage the Philistines. Therefore, that place was named the Rock of Separation.&quot;"
csb[29] = "From there David went up and stayed in the strongholds of En-gedi.&quot;"
