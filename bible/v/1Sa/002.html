csb[1] = "Hannah prayed: My heart rejoices in the LORD; my horn is lifted up by the LORD. My mouth boasts over my enemies, because I rejoice in your salvation.&quot;"
csb[2] = "There is no one holy like the LORD. There is no one besides you! And there is no rock like our God.&quot;"
csb[3] = "Do not boast so proudly, or let arrogant words come out of your mouth, for the LORD is a God of knowledge, and actions are weighed by him.&quot;"
csb[4] = "The bows of the warriors are broken, but the feeble are clothed with strength.&quot;"
csb[5] = "Those who are full hire themselves out for food, but those who are starving hunger no more. The woman who is childless gives birth to seven, but the woman with many sons pines away.&quot;"
csb[6] = "The LORD brings death and gives life; he sends some down to Sheol, and he raises others up.&quot;"
csb[7] = "The LORD brings poverty and gives wealth; he humbles and he exalts.&quot;"
csb[8] = "He raises the poor from the dust and lifts the needy from the trash heap. He seats them with noblemen and gives them a throne of honor. For the foundations of the earth are the LORD\'s; he has set the world on them.&quot;"
csb[9] = "He guards the steps of his faithful ones, but the wicked perish in darkness, for a person does not prevail by his own strength.&quot;"
csb[10] = "Those who oppose the LORD will be shattered; he will thunder in the heavens against them. The LORD will judge the ends of the earth. He will give power to his king; he will lift up the horn of his anointed.&quot;"
csb[11] = "Elkanah went home to Ramah, but the boy served the LORD in the presence of the priest Eli.&quot;"
csb[12] = "Eli\'s sons were wicked men; they did not respect the LORD&quot;"
csb[13] = "or the priests\' share of the sacrifices from the people. When anyone offered a sacrifice, the priest\'s servant would come with a three-pronged meat fork while the meat was boiling&quot;"
csb[14] = "and plunge it into the container, kettle, cauldron, or cooking pot. The priest would claim for himself whatever the meat fork brought up. This is the way they treated all the Israelites who came there to Shiloh.&quot;"
csb[15] = "Even before the fat was burned, the priest\'s servant would come and say to the one who was sacrificing, &quot;Give the priest some meat to roast, because he won\'t accept boiled meat from you -- only raw.&quot;"
csb[16] = "If that person said to him, &quot;The fat must be burned first; then you can take whatever you want for yourself,&quot; the servant would reply, &quot;No, I insist that you hand it over right now. If you don\'t, I\'ll take it by force! &quot;"
csb[17] = "So the servants\' sin was very severe in the presence of the LORD, because the men treated the LORD\'s offering with contempt.&quot;"
csb[18] = "Samuel served in the LORD\'s presence--this mere boy was dressed in the linen ephod.&quot;"
csb[19] = "Each year his mother made him a little robe and took it to him when she went with her husband to offer the annual sacrifice.&quot;"
csb[20] = "Eli would bless Elkanah and his wife: &quot;May the LORD give you children by this woman in place of the one she has given to the LORD.&quot; Then they would go home.&quot;"
csb[21] = "The LORD paid attention to Hannah\'s need, and she conceived and gave birth to three sons and two daughters. Meanwhile, the boy Samuel grew up in the presence of the LORD.&quot;"
csb[22] = "Now Eli was very old. He heard about everything his sons were doing to all Israel and how they were sleeping with the women who served at the entrance to the tent of meeting.&quot;"
csb[23] = "He said to them, &quot;Why are you doing these things? I have heard about your evil actions from all these people.&quot;"
csb[24] = "&quot;No, my sons, the news I hear the LORD\'s people spreading is not good.&quot;"
csb[25] = "&quot;If one person sins against another, God can intercede for him, but if a person sins against the LORD, who can intercede for him? &quot; But they would not listen to their father, since the LORD intended to kill them.&quot;"
csb[26] = "By contrast, the boy Samuel grew in stature and in favor with the LORD and with people.&quot;"
csb[27] = "A man of God came to Eli and said to him, &quot;This is what the LORD says: \'Didn\'t I reveal myself to your forefather\'s family when they were in Egypt and belonged to Pharaoh\'s palace?&quot;"
csb[28] = "&quot;Out of all the tribes of Israel, I chose your house to be my priests, to offer sacrifices on my altar, to burn incense, and to wear an ephod in my presence. I also gave your forefather\'s family all the Israelite fire offerings.&quot;"
csb[29] = "&quot;Why, then, do all of you despise my sacrifices and offerings that I require at the place of worship? You have honored your sons more than me, by making yourselves fat with the best part of all of the offerings of my people Israel.\'&quot;"
csb[30] = "&quot;Therefore, this is the declaration of the LORD, the God of Israel: \'I did say that your family and your forefather\'s family would walk before me forever. But now,\' this is the LORD\'s declaration, \'no longer! For those who honor me I will honor, but those who despise me will be disgraced.&quot;"
csb[31] = "&quot;Look, the days are coming when I will cut off your strength and the strength of your forefather\'s house, so that none in your family will reach old age.&quot;"
csb[32] = "&quot;You will see distress in the place of worship, in spite of all that is good in Israel, and no one in your family will ever again reach old age.&quot;"
csb[33] = "&quot;Any man from your family I do not cut off from my altar will bring grief and sadness to you. All your descendants will die violently.&quot;"
csb[34] = "&quot;This will be the sign that will come to you concerning your two sons Hophni and Phinehas: both of them will die on the same day.&quot;"
csb[35] = "&quot; \'Then I will raise up a faithful priest for myself. He will do whatever is in my heart and mind. I will establish a lasting dynasty for him, and he will walk before my anointed one for all time.&quot;"
csb[36] = "&quot;Anyone who is left in your family will come and bow down to him for a piece of silver or a loaf of bread. He will say: Please appoint me to some priestly office so I can have a piece of bread to eat.\' &quot;"

hnv[17] = "The sin of the young men was very great before the LORD; for the men despised the offering of the LORD.";

yng[19] = "and a small upper coat doth his mother make to him, and she hath brought it up to him from time to time, in her coming up with her husband to sacrifice the sacrifice of the time.";
dby[19] = "And his mother made him a little coat, and brought it to him from year to year, when she came up with her husband to sacrifice the yearly sacrifice.";
web[19] = "Moreover his mother made him a little coat, and brought [it] to him from year to year, when she came up with her husband, to offer the yearly sacrifice.";
hnv[19] = "Moreover his mother made him a little robe, and brought it to him from year to year, when she came up with her husband to offer the yearly sacrifice.";

kjv[20] = "And Eli blessed Elkanah and his wife, and said, The LORD give thee seed of this woman for the loan which is lent to the LORD. And they went unto their own home.";
rsv[20] = "Then Eli would bless Elka\'nah and his wife, and say, &quot;The LORD give you children by this woman for the loan which she lent to the LORD&quot;; so then they would return to their home.";
asv[20] = "And Eli blessed Elkanah and his wife, and said, Jehovah give thee seed of this woman for the petition which was asked of Jehovah. And they went unto their own home.";
yng[20] = "And Eli blessed Elkanah, and his wife, and said, `Jehovah doth appoint for thee seed of this woman, for the petition which she asked for Jehovah;\' and they have gone to their place.";
dby[20] = "And Eli blessed Elkanah and his wife, and said, Jehovah give thee seed of this woman for the loan which is lent to Jehovah. And they went to their own home.";

kjv[21] = "And the LORD visited Hannah, so that she conceived, and bare three sons and two daughters. And the child Samuel grew before the LORD.";
rsv[21] = "And the LORD visited Hannah, and she conceived and bore three sons and two daughters. And the boy Samuel grew in the presence of the LORD.";

yng[21] = "When Jehovah hath looked after Hannah, then she conceiveth and beareth three sons and two daughters; and the youth Samuel groweth up with Jehovah.";
dby[21] = "So Jehovah visited Hannah, and she conceived, and bore three sons and two daughters. And the boy Samuel grew before Jehovah.";
web[21] = "And the LORD visited Hannah, so that she conceived, and bore three sons and two daughters. And the child Samuel grew before the LORD.";
hnv[21] = "The LORD visited Hannah, and she conceived, and bore three sons and two daughters. The child Shemu\'el grew before the LORD.";

rsv[22] = "Now Eli was very old, and he heard all that his sons were doing to all Israel, and how they lay with the women who served at the entrance to the tent of meeting.";

yng[22] = "And Eli [is] very old, and hath heard all that his sons do to all Israel, and how that they lie with the women who are assembling [at] the opening of the tent of meeting,";
dby[22] = "And Eli was very old, and heard all that his sons were doing to all Israel, and that they lay with the women that served at the entrance of the tent of meeting.";
web[22] = "Now Eli was very old, and heard all that his sons did to all Israel; and how they lay with the women that assembled at the door of the tabernacle of the congregation.";

vul[22] = "Heli autem erat senex valde et audivit omnia quae faciebant filii sui universo Israheli et quomodo dormiebant cum mulieribus quae observabant ad ostium tabernaculi";
kjv[23] = "And he said unto them, Why do ye such things? for I hear of your evil dealings by all this people.";

asv[23] = "And he said unto them, Why do ye such things? for I hear of your evil dealings from all this people.";
yng[23] = "and he saith to them, `Why do ye things like these? for I am hearing of your evil words from all the people -- these!";

web[23] = "And he said to them, Why do ye such things? for I hear of your evil dealings by all this people.";
hnv[23] = "He said to them, Why do you such things? for I hear of your evil dealings from all this people.";
vul[23] = "et dixit eis quare facitis res huiuscemodi quas ego audio res pessimas ab omni populo";
kjv[24] = "Nay, my sons; for [it is] no good report that I hear: ye make the LORD\'S people to transgress.";
rsv[24] = "No, my sons; it is no good report that I hear the people of the LORD spreading abroad.";
asv[24] = "Nay, my sons; for it is no good report that I hear: ye make Jehovah\'s people to transgress.";
yng[24] = "Nay, my sons; for the report which I am hearing is not good causing the people of Jehovah to transgress. --";
dby[24] = "No, my sons, for it is no good report that I hear: ye make Jehovah\'s people transgress.";
web[24] = "No, my sons; for [it is] no good report that I hear: ye make the LORD\'S people to transgress.";
hnv[24] = "No, my sons; for it is no good report that I hear: you make the LORD\'s people to disobey.";
vul[24] = "nolite filii mi non enim est bona fama quam ego audio ut transgredi faciatis populum Domini";
kjv[25] = "If one man sin against another, the judge shall judge him: but if a man sin against the LORD, who shall intreat for him? Notwithstanding they hearkened not unto the voice of their father, because the LORD would slay them.";
rsv[25] = "If a man sins against a man, God will mediate for him; but if a man sins against the LORD, who can intercede for him?&quot; But they would not listen to the voice of their father; for it was the will of the LORD to slay them.";
asv[25] = "If one man sin against another, God shall judge him; but if a man sin against Jehovah, who shall entreat for him? Notwithstanding, they hearkened not unto the voice of their father, because Jehovah was minded to slay them.";
yng[25] = "If a man sin against a man, then hath God judged him; but if against Jehovah a man sin, who doth pray for him?\' and they hearken not to the voice of their father, though Jehovah hath delighted to put them to death.";
dby[25] = "If one man sin against another, God will judge him; but if a man sin against Jehovah, who shall intreat for him? But they hearkened not to the voice of their father, for Jehovah was minded to slay them.";
web[25] = "If one man shall sin against another, the judge shall judge him: but if a man shall sin against the LORD, who shall entreat for him? Notwithstanding they hearkened not to the voice of their father, because the LORD would slay them.";
hnv[25] = "If one man sin against another, God shall judge him; but if a man sin against the LORD, who shall entreat for him? Notwithstanding, they didn\'t listen to the voice of their father, because the LORD was minded to kill them.";
vul[25] = "si peccaverit vir in virum placari ei potest Deus si autem in Domino peccaverit vir quis orabit pro eo et non audierunt vocem patris sui quia voluit Dominus occidere eos";
kjv[26] = "And the child Samuel grew on, and was in favour both with the LORD, and also with men.";
rsv[26] = "Now the boy Samuel continued to grow both in stature and in favor with the LORD and with men.";
asv[26] = "And the child Samuel grew on, and increased in favor both with Jehovah, and also with men.";
yng[26] = "And the youth Samuel is going on and growing up, and [is] good both with Jehovah, and also with men.";
dby[26] = "And the boy Samuel grew on, and was in favour both with Jehovah and also with men.";
web[26] = "And the child Samuel continued to grow, and was in favor both with the LORD, and also with men.";
hnv[26] = "The child Shemu\'el grew on, and increased in favor both with the LORD, and also with men.";
vul[26] = "puer autem Samuhel proficiebat atque crescebat et placebat tam Deo quam hominibus";
kjv[27] = "And there came a man of God unto Eli, and said unto him, Thus saith the LORD, Did I plainly appear unto the house of thy father, when they were in Egypt in Pharaoh\'s house?";
rsv[27] = "And there came a man of God to Eli, and said to him, &quot;Thus the LORD has said, \'I revealed myself to the house of your father when they were in Egypt subject to the house of Pharaoh.";
asv[27] = "And there came a man of God unto Eli, and said unto him, Thus saith Jehovah, Did I reveal myself unto the house of thy father, when they were in Egypt [in bondage] to Pharaoh\'s house?";
yng[27] = "And there cometh a man of God unto Eli, and saith unto him, `Thus said Jehovah, Was I really revealed unto the house of thy father in their being in Egypt, before Pharaoh\'s house,";
dby[27] = "And there came a man of God to Eli and said to him, Thus saith Jehovah: Did I plainly reveal myself to the house of thy father when they were in Egypt, in Pharaoh\'s house,";
web[27] = "And there came a man of God to Eli, and said to him, Thus saith the LORD, Did I plainly appear to the house of thy father, when they were in Egypt in Pharaoh\'s house?";
hnv[27] = "There came a man of God to `Eli, and said to him, Thus says the LORD, Did I reveal myself to the house of your father, when they were in Mitzrayim [in bondage] to Par`oh\'s house?";
vul[27] = "venit autem vir Dei ad Heli et ait ad eum haec dicit Dominus numquid non aperte revelatus sum domui patris tui cum essent in Aegypto in domo Pharaonis";
kjv[28] = "And did I choose him out of all the tribes of Israel [to be] my priest, to offer upon mine altar, to burn incense, to wear an ephod before me? and did I give unto the house of thy father all the offerings made by fire of the children of Israel?";
rsv[28] = "And I chose him out of all the tribes of Israel to be my priest, to go up to my altar, to burn incense, to wear an ephod before me; and I gave to the house of your father all my offerings by fire from the people of Israel.";
asv[28] = "and did I choose him out of all the tribes of Israel to be my priest, to go up unto mine altar, to burn incense, to wear an ephod before me? and did I give unto the house of thy father all the offerings of the children of Israel made by fire?";
yng[28] = "even to choose him out of all the tribes of Israel to Me for a priest, to go up on Mine altar, to make a perfume, to bear an ephod before Me, and I give to the house of thy father all the fire-offerings of the sons of Israel?";
dby[28] = "and choose him out of all the tribes of Israel, to be my priest, to offer upon mine altar, to burn incense, to wear the ephod before me? and I gave unto the house of thy father all the offerings by fire of the children of Israel.";
web[28] = "And did I choose him out of all the tribes of Israel [to be] my priest, to offer upon my altar, to burn incense, to wear an ephod before me? and did I give to the house of thy father all the offerings made by fire of the children of Israel?";
hnv[28] = "and did I choose him out of all the tribes of Yisra\'el to be my Kohen, to go up to my altar, to burn incense, to wear an efod before me? and did I give to the house of your father all the offerings of the children of Yisra\'el made by fire?";
vul[28] = "et elegi eum ex omnibus tribubus Israhel mihi in sacerdotem ut ascenderet altare meum et adoleret mihi incensum et portaret ephod coram me et dedi domui patris tui omnia de sacrificiis filiorum Israhel";
kjv[29] = "Wherefore kick ye at my sacrifice and at mine offering, which I have commanded [in my] habitation; and honourest thy sons above me, to make yourselves fat with the chiefest of all the offerings of Israel my people?";
rsv[29] = "Why then look with greedy eye at my sacrifices and my offerings which I commanded, and honor your sons above me by fattening yourselves upon the choicest parts of every offering of my people Israel?\'";
asv[29] = "Wherefore kick ye at my sacrifice and at mine offering, which I have commanded in [my] habitation, and honorest thy sons above me, to make yourselves fat with the chiefest of all the offerings of Israel my people?";
yng[29] = "Why do ye kick at My sacrifice, and at Mine offering which I commanded [in] My habitation, and dost honour thy sons above Me, to make yourselves fat from the first part of every offering of Israel, of My people?";
dby[29] = "Wherefore do ye trample upon my sacrifice and upon mine oblation which I have commanded [in my] habitation? And thou honourest thy sons above me, to make yourselves fat with the primest of all the oblations of Israel my people.";
web[29] = "Wherefore kick ye at my sacrifice and at my offering, which I have commanded [in my] habitation; and honorest thy sons above me, to make yourselves fat with the chiefest of all the offerings of Israel my people?";
hnv[29] = "Why kick you at my sacrifice and at my offering, which I have commanded in [my] habitation, and honor your sons above me, to make yourselves fat with the best of all the offerings of Yisra\'el my people?";
vul[29] = "quare calce abicitis victimam meam et munera mea quae praecepi ut offerrentur in templo et magis honorasti filios tuos quam me ut comederetis primitias omnis sacrificii Israhel populi mei";
kjv[30] = "Wherefore the LORD God of Israel saith, I said indeed [that] thy house, and the house of thy father, should walk before me for ever: but now the LORD saith, Be it far from me; for them that honour me I will honour, and they that despise me shall be lightly esteemed.";
rsv[30] = "Therefore the LORD the God of Israel declares: \'I promised that your house and the house of your father should go in and out before me for ever\'; but now the LORD declares: \'Far be it from me; for those who honor me I will honor, and those who despise me shall be lightly esteemed.";
asv[30] = "Therefore Jehovah, the God of Israel, saith, I said indeed that thy house, and the house of thy father, should walk before me for ever: but now Jehovah saith, Be it far from me; for them that honor me I will honor, and they that despise me shall be lightly esteemed.";
yng[30] = "`Therefore -- the affirmation of Jehovah, God of Israel -- I certainly said, Thy house and the house of thy father, do walk up and down before Me to the age; and now -- the affirmation of Jehovah -- Far be it from Me! for he who is honouring Me, I honour, and those despising Me, are lightly esteemed.";
dby[30] = "Wherefore Jehovah the God of Israel saith, I said indeed, Thy house and the house of thy father should walk before me for ever. But now Jehovah saith, Be it far from me; for them that honour me I will honour, and they that despise me shall be lightly esteemed.";
web[30] = "Wherefore the LORD God of Israel saith, I said indeed [that] thy house, and the house of thy father should walk before me for ever: but now the LORD saith, Be it far from me; for them that honor me I will honor, and they that despise me shall be lightly esteemed.";
hnv[30] = "Therefore the LORD, the God of Yisra\'el, says, I said indeed that your house, and the house of your father, should walk before me forever: but now the LORD says, Be it far from me; for those who honor me I will honor, and those who despise me shall be lightly esteemed.";
vul[30] = "propterea ait Dominus Deus Israhel loquens locutus sum ut domus tua et domus patris tui ministraret in conspectu meo usque in sempiternum nunc autem dicit Dominus absit hoc a me sed quicumque glorificaverit me glorificabo eum qui autem contemnunt me erunt ignobiles";
kjv[31] = "Behold, the days come, that I will cut off thine arm, and the arm of thy father\'s house, that there shall not be an old man in thine house.";
rsv[31] = "Behold, the days are coming, when I will cut off your strength and the strength of your father\'s house, so that there will not be an old man in your house.";
asv[31] = "Behold, the days come, that I will cut off thine arm, and the arm of thy father\'s house, that there shall not be an old man in thy house.";
yng[31] = "`Lo, days [are] coming, and I have cut off thine arm, and the arm of the house of thy father, that an old man is not in thy house;";
dby[31] = "Behold, days come, that I will cut off thine arm, and the arm of thy father\'s house, that there shall not be an old man in thy house.";
web[31] = "Behold, the days come, that I will cut off thy arm, and the arm of thy father\'s house, that there shall not be an old man in thy house.";
hnv[31] = "Behold, the days come, that I will cut off your arm, and the arm of your father\'s house, that there shall not be an old man in your house.";
vul[31] = "ecce dies veniunt et praecidam brachium tuum et brachium domus patris tui ut non sit senex in domo tua";
kjv[32] = "And thou shalt see an enemy [in my] habitation, in all [the wealth] which [God] shall give Israel: and there shall not be an old man in thine house for ever.";
rsv[32] = "Then in distress you will look with envious eye on all the prosperity which shall be bestowed upon Israel; and there shall not be an old man in your house for ever.";
asv[32] = "And thou shalt behold the affliction of [my] habitation, in all the wealth which [God] shall give Israel; and there shall not be an old man in thy house for ever.";
yng[32] = "and thou hast beheld an adversary [in My] habitation, in all that He doth good with Israel, and there is not an old man in thy house all the days.";
dby[32] = "And thou shalt see an oppressor [in my] habitation, amidst all the good that shall be done to Israel; and there shall not be an old man in thy house for ever.";
web[32] = "And thou shalt see an enemy [in my] habitation, in all [the wealth] which [God] shall give Israel: and there shall not be an old man in thy house for ever.";
hnv[32] = "You shall see the affliction of [my] habitation, in all the wealth which [God] shall give Yisra\'el; and there shall not be an old man in your house forever.";
vul[32] = "et videbis aemulum tuum in templo in universis prosperis Israhel et non erit senex in domo tua omnibus diebus";
kjv[33] = "And the man of thine, [whom] I shall not cut off from mine altar, [shall be] to consume thine eyes, and to grieve thine heart: and all the increase of thine house shall die in the flower of their age.";
rsv[33] = "The man of you whom I shall not cut off from my altar shall be spared to weep out his eyes and grieve his heart; and all the increase of your house shall die by the sword of men.";
asv[33] = "And the man of thine, [whom] I shall not cut off from mine altar, [shall be] to consume thine eyes, and to grieve thy heart; and all the increase of thy house shall die in the flower of their age.";
yng[33] = "`And the man I cut not off of thine from Mine altar, [is] to consume thine eyes, and to grieve thy soul; and all the increase of thy house do die men;";
dby[33] = "And the man of thine [whom] I shall not cut off from mine altar, shall be to cause thine eyes to fail and to grieve thy soul; and all the increase of thy house shall die in their vigour.";
web[33] = "And the man of thine, [whom] I shall not cut off from my altar, [shall be] to consume thy eyes, and to grieve thy heart: and all the increase of thy house shall die in the flower of their age.";
hnv[33] = "The man of yours, [whom] I shall not cut off from my altar, [shall be] to consume your eyes, and to grieve your heart; and all the increase of your house shall die in the flower of their age.";
vul[33] = "verumtamen non auferam penitus virum ex te ab altari meo sed ut deficiant oculi tui et tabescat anima tua et pars magna domus tuae morietur cum ad virilem aetatem venerit";
kjv[34] = "And this [shall be] a sign unto thee, that shall come upon thy two sons, on Hophni and Phinehas; in one day they shall die both of them.";
rsv[34] = "And this which shall befall your two sons, Hophni and Phin\'ehas, shall be the sign to you: both of them shall die on the same day.";
asv[34] = "And this shall be the sign unto thee, that shall come upon thy two sons, on Hophni and Phinehas: in one day they shall die both of them.";
yng[34] = "and this [is] to thee the sign that cometh unto thy two sons, unto Hophni and Phinehas -- in one day they die both of them;";
dby[34] = "And this shall be the sign to thee, which shall come upon thy two sons, upon Hophni and Phinehas: in one day they shall die, both of them.";
web[34] = "And this [shall be] a sign to thee, that shall come upon thy two sons, on Hophni and Phinehas: in one day they shall die both of them.";
hnv[34] = "This shall be the sign to you, that shall come on your two sons, on Hofni and Pinechas: in one day they shall die both of them.";
vul[34] = "hoc autem erit tibi signum quod venturum est duobus filiis tuis Ofni et Finees in die uno morientur ambo";
kjv[35] = "And I will raise me up a faithful priest, [that] shall do according to [that] which [is] in mine heart and in my mind: and I will build him a sure house; and he shall walk before mine anointed for ever.";
rsv[35] = "And I will raise up for myself a faithful priest, who shall do according to what is in my heart and in my mind; and I will build him a sure house, and he shall go in and out before my anointed for ever.";
asv[35] = "And I will raise me up a faithful priest, that shall do according to that which is in my heart and in my mind: and I will build him a sure house; and he shall walk before mine anointed for ever.";
yng[35] = "and I have raised up for Me a stedfast priest; as in My heart and in My soul he doth do; and I have built for him a stedfast house, and he hath walked up and down before Mine anointed all the days;";
dby[35] = "And I will raise up for myself a faithful priest, [who] shall do according to what is in my heart and in my mind; and I will build him a sure house; and he shall walk before mine anointed continually.";
web[35] = "And I will raise me up a faithful priest, [that] shall do according to [that] which [is] in my heart and in my mind: and I will build him a sure house; and he shall walk before my Anointed for ever.";
hnv[35] = "I will raise me up a faithful Kohen, that shall do according to that which is in my heart and in my mind: and I will build him a sure house; and he shall walk before my anointed forever.";
vul[35] = "et suscitabo mihi sacerdotem fidelem qui iuxta cor meum et animam meam faciat et aedificabo ei domum fidelem et ambulabit coram christo meo cunctis diebus";
kjv[36] = "And it shall come to pass, [that] every one that is left in thine house shall come [and] crouch to him for a piece of silver and a morsel of bread, and shall say, Put me, I pray thee, into one of the priests\' offices, that I may eat a piece of bread.";
rsv[36] = "And every one who is left in your house shall come to implore him for a piece of silver or a loaf of bread, and shall say, &quot;Put me, I pray you, in one of the priest\'s places, that I may eat a morsel of bread.&quot;\'&quot;";
asv[36] = "And it shall come to pass, that every one that is left in thy house shall come and bow down to him for a piece of silver and a loaf of bread, and shall say, Put me, I pray thee, into one of the priests\' offices, that I may eat a morsel of bread.";
yng[36] = "and it hath been, every one who is left in thy house doth come in to bow himself to him, for a wage of silver, and a cake of bread, and hath said, Admit me, I pray thee, unto one of the priest\'s offices, to eat a morsel of bread.\'";
dby[36] = "And it shall come to pass [that] every one that is left of thy house shall come to crouch to him for a small piece of silver and for a cake of bread, and shall say, Put me, I pray thee, into one of the priestly offices, that I may eat a morsel of bread.";
web[36] = "And it shall come to pass, [that] every one that is left in thy house, shall come [and] crouch to him for a piece of silver and a morsel of bread, and shall say, Put me, I pray thee, into one of the priest\'s offices, that I may eat a piece of bread.";
hnv[36] = "It shall happen, that everyone who is left in your house shall come and bow down to him for a piece of silver and a loaf of bread, and shall say, Please put me into one of the Kohanim\' offices, that I may eat a morsel of bread.";
vul[36] = "futurum est autem ut quicumque remanserit in domo tua veniat ut oretur pro eo et offerat nummum argenteum et tortam panis dicatque dimitte me obsecro ad unam partem sacerdotalem ut comedam buccellam panis";
