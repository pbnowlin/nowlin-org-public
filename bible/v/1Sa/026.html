csb[1] = "Then the Ziphites came to Saul at Gibeah saying, &quot;David is hiding on the hill of Hachilah opposite Jeshimon.&quot;"
csb[2] = "So Saul, accompanied by three thousand of the fit young men of Israel, went immediately to the Wilderness of Ziph to search for David there.&quot;"
csb[3] = "Saul camped beside the road at the hill of Hachilah opposite Jeshimon. David was living in the wilderness and discovered Saul had come there after him.&quot;"
csb[4] = "So David sent out spies and knew for certain that Saul had come.&quot;"
csb[5] = "Immediately, David went to the place where Saul had camped. He saw the place where Saul and Abner son of Ner, the commander of his army, were lying down. Saul was lying inside the inner circle of the camp with the troops camped around him.&quot;"
csb[6] = "Then David asked Ahimelech the Hethite and Joab\'s brother Abishai son of Zeruiah, &quot;Who will go with me into the camp to Saul? &quot; &quot;I\'ll go with you,&quot; answered Abishai.&quot;"
csb[7] = "That night, David and Abishai came to the troops, and Saul was lying there asleep in the inner circle of the camp with his spear stuck in the ground by his head. Abner and the troops were lying around him.&quot;"
csb[8] = "Then Abishai said to David, &quot;Today God has delivered your enemy to you. Let me thrust the spear through him into the ground just once. I won\'t have to strike him twice! &quot;"
csb[9] = "But David said to Abishai, &quot;Don\'t destroy him, for who can lift a hand against the LORD\'s anointed and be innocent? &quot;"
csb[10] = "David added, &quot;As the LORD lives, the LORD will certainly strike him down: either his day will come and he will die, or he will go into battle and perish.&quot;"
csb[11] = "&quot;However, because of the LORD, I will never lift my hand against the LORD\'s anointed. Instead, take the spear and the water jug by his head, and let\'s go.&quot;"
csb[12] = "So David took the spear and the water jug by Saul\'s head, and they went their way. No one saw them, no one knew, and no one woke up; they all remained asleep because a deep sleep from the LORD came over them.&quot;"
csb[13] = "David crossed to the other side and stood on top of the mountain at a distance; there was a considerable space between them.&quot;"
csb[14] = "Then David shouted to the troops and to Abner son of Ner: &quot;Aren\'t you going to answer, Abner? &quot; &quot;Who are you who calls to the king? &quot; Abner asked.&quot;"
csb[15] = "David called to Abner, &quot;You\'re a man, aren\'t you? Who in Israel is your equal? So why didn\'t you protect your lord the king when one of the people came to destroy him?&quot;"
csb[16] = "&quot;What you have done is not good. As the LORD lives, all of you deserve to die since you didn\'t protect your lord, the LORD\'s anointed. Now look around; where are the king\'s spear and water jug that were by his head? &quot;"
csb[17] = "Saul recognized David\'s voice and asked, &quot;Is that your voice, my son David? &quot; &quot;It is my voice, my lord and king,&quot; David said.&quot;"
csb[18] = "Then he continued, &quot;Why is my lord pursuing his servant? What have I done? What crime have I committed?&quot;"
csb[19] = "&quot;Now, may my lord the king please hear the words of his servant: If it is the LORD who has incited you against me, then may he accept an offering. But if it is people, may they be cursed in the presence of the LORD, for today they have banished me from sharing in the inheritance of the LORD saying, \'Go and worship other gods.\'&quot;"
csb[20] = "&quot;So don\'t let my blood fall to the ground far from the LORD\'s presence, for the king of Israel has come out to search for a single flea, like one who pursues a partridge in the mountains.&quot;"
csb[21] = "Saul responded, &quot;I have sinned. Come back, my son David, I will never harm you again because today you considered my life precious. I have been a fool! I\'ve committed a grave error.&quot;"
csb[22] = "David answered, &quot;Here is the king\'s spear; have one of the young men come over and get it.&quot;"
csb[23] = "&quot;The LORD will repay every man for his righteousness and his loyalty. I wasn\'t willing to lift my hand against the LORD\'s anointed, even though the LORD handed you over to me today.&quot;"
csb[24] = "&quot;Just as I considered your life valuable today, so may the LORD consider my life valuable and rescue me from all trouble.&quot;"
csb[25] = "Saul said to him, &quot;You are blessed, my son David. You will certainly do great things and will also prevail.&quot; Then David went on his way, and Saul returned home.&quot;"
kjv[1] = "And the Ziphites came unto Saul to Gibeah, saying, Doth not David hide himself in the hill of Hachilah, [which is] before Jeshimon?";

yng[2] = "And Saul riseth, and goeth down unto the wilderness of Ziph, and with him three thousand men, chosen ones of Israel, to seek David in the wilderness of Ziph.";
dby[2] = "And Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph.";
web[2] = "Then Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph.";
hnv[2] = " Then Sha\'ul arose, and went down to the wilderness of Zif, having three thousand chosen men of Yisra\'el with him, to seek David in the wilderness of Zif.";

kjv[3] = "And Saul pitched in the hill of Hachilah, which [is] before Jeshimon, by the way. But David abode in the wilderness, and he saw that Saul came after him into the wilderness.";
rsv[3] = "And Saul encamped on the hill of Hachi\'lah, which is beside the road on the east of Jeshi\'mon. But David remained in the wilderness; and when he saw that Saul came after him into the wilderness,";

yng[3] = "And Saul encampeth in the height of Hachilah, which [is] on the front of the desert, by the way, and David is abiding in the wilderness, and he seeth that Saul hath come after him in to the wilderness;";
dby[3] = "And Saul encamped in the hill of Hachilah, which faces the waste, by the way side. And David abode in the wilderness; and when he saw that Saul had come after him into the wilderness,";

kjv[4] = "David therefore sent out spies, and understood that Saul was come in very deed.";
rsv[4] = "David sent out spies, and learned of a certainty that Saul had come.";
asv[4] = "David therefore sent out spies, and understood that Saul was come of a certainty.";
yng[4] = "and David sendeth spies, and knoweth that Saul hath come unto Nachon,";

kjv[5] = "And David arose, and came to the place where Saul had pitched: and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host: and Saul lay in the trench, and the people pitched round about him.";
rsv[5] = "Then David rose and came to the place where Saul had encamped; and David saw the place where Saul lay, with Abner the son of Ner, the commander of his army; Saul was lying within the encampment, while the army was encamped around him.";
asv[5] = "And David arose, and came to the place where Saul had encamped; and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host: and Saul lay within the place of the wagons, and the people were encamped round about him.";
yng[5] = "and David riseth, and cometh in unto the place where Saul hath encamped, and David seeth the place where Saul hath lain, and Abner son of Ner, head of his host, and Saul is lying in the path, and the people are encamping round about him.";
dby[5] = "And David arose and came to the place where Saul had encamped; and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host; and Saul lay within the wagon-defence, and the people were encamped round about him.";
web[5] = "And David arose, and came to the place where Saul had encamped; and David beheld the place where Saul lay, and Abner, the son of Ner, the captain of his host: and Saul lay in the trench, and the people pitched around him.";
hnv[5] = "David arose, and came to the place where Sha\'ul had encamped; and David saw the place where Sha\'ul lay, and Aviner the son of Ner, the captain of his host: and Sha\'ul lay within the place of the wagons, and the people were encamped round about him.";
vul[5] = "et surrexit David et venit ad locum ubi erat Saul cumque vidisset locum in quo dormiebat Saul et Abner filius Ner princeps militiae eius Saulem dormientem in tentorio et reliquum vulgus per circuitum eius";
kjv[6] = "Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee.";
rsv[6] = "Then David said to Ahim\'elech the Hittite, and to Jo\'ab\'s brother Abi\'shai the son of Zeru\'iah, &quot;Who will go down with me into the camp to Saul?&quot; And Abi\'shai said, &quot;I will go down with you.&quot;";
asv[6] = "Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee.";
yng[6] = "And David answereth and saith unto Ahimelech the Hittite, and unto Abishai son of Zeruiah, brother of Joab, saying, `Who doth go down with me unto Saul, unto the camp?\' and Abishai saith, `I -- I go down with thee.\'";
dby[6] = "And David spake and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, Joab\'s brother, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee.";
web[6] = "Then answered David, and said to Ahimelech the Hittite, and to Abishai, the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee.";
hnv[6] = "Then answered David and said to Achimelekh the Hittite, and to Avishai the son of Tzeru\'yah, brother to Yo\'av, saying, Who will go down with me to Sha\'ul to the camp? Avishai said, I will go down with you.";
vul[6] = "ait David ad Ahimelech Cettheum et Abisai filium Sarviae fratrem Ioab dicens quis descendet mecum ad Saul in castra dixitque Abisai ego descendam tecum";
kjv[7] = "So David and Abishai came to the people by night: and, behold, Saul lay sleeping within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay round about him.";
rsv[7] = "So David and Abi\'shai went to the army by night; and there lay Saul sleeping within the encampment, with his spear stuck in the ground at his head; and Abner and the army lay around him.";

yng[7] = "And David cometh -- and Abishai -- unto the people by night, and lo, Saul is lying sleeping in the path, and his spear struck into the earth at his pillow, and abner and the people are lying round about him.";
dby[7] = "And David and Abishai came to the people by night, and behold, Saul lay sleeping within the wagon-defence, and his spear stuck in the ground at his head; and Abner and the people lay round about him.";
web[7] = "So David and Abishai came to the people by night, and behold, Saul lay sleeping within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay about him.";
hnv[7] = "So David and Avishai came to the people by night: and, behold, Sha\'ul lay sleeping within the place of the wagons, with his spear stuck in the ground at his head; and Aviner and the people lay round about him.";
vul[7] = "venerunt ergo David et Abisai ad populum nocte et invenerunt Saul iacentem et dormientem in tentorio et hastam fixam in terra ad caput eius Abner autem et populum dormientes in circuitu eius";
kjv[8] = "Then said Abishai to David, God hath delivered thine enemy into thine hand this day: now therefore let me smite him, I pray thee, with the spear even to the earth at once, and I will not [smite] him the second time.";
rsv[8] = "Then said Abi\'shai to David, &quot;God has given your enemy into your hand this day; now therefore let me pin him to the earth with one stroke of the spear, and I will not strike him twice.&quot;";
asv[8] = "Then said Abishai to David, God hath delivered up thine enemy into thy hand this day: now therefore let me smite him, I pray thee, with the spear to the earth at one stroke, and I will not smite him the second time.";
yng[8] = "And Abishai saith unto David, `God hath shut up to-day thine enemy into thy hand; and, now, let me smite him, I pray thee, with a spear, even into the earth at once -- and I do repeat [it] to him.\'";
dby[8] = "And Abishai said to David, God has delivered thine enemy into thy hand this day; and now let me smite him, I pray thee, with the spear, even to the ground once, and I will not do it the second time.";
web[8] = "Then said Abishai to David, God hath delivered thy enemy into thy hand this day; now therefore let me smite him, I pray thee, with the spear, even to the earth at once, and I will not [smite] him the second time.";
hnv[8] = "Then said Avishai to David, God has delivered up your enemy into your hand this day: now therefore please let me strike him with the spear to the eretz at one stroke, and I will not strike him the second time.";
vul[8] = "dixitque Abisai ad David conclusit Deus hodie inimicum tuum in manus tuas nunc ergo perfodiam eum lancea in terra semel et secundo opus non erit";

asv[9] = "And David said to Abishai, Destroy him not; for who can put forth his hand against Jehovah\'s anointed, and be guiltless?";
yng[9] = "And David saith unto Abishai, `Destroy him not; for who hath put forth his hand against the anointed of Jehovah, and been acquitted?\'";
dby[9] = "And David said to Abishai, Destroy him not; for who can stretch forth his hand against Jehovah\'s anointed, and be guiltless?";
web[9] = "And David said to Abishai, Destroy him not; for who can stretch forth his hand against the LORD\'S anointed and be guiltless?";

vul[9] = "et dixit David ad Abisai ne interficias eum quis enim extendit manum suam in christum Domini et innocens erit";
kjv[10] = "David said furthermore, [As] the LORD liveth, the LORD shall smite him; or his day shall come to die; or he shall descend into battle, and perish.";
rsv[10] = "And David said, &quot;As the LORD lives, the LORD will smite him; or his day shall come to die; or he shall go down into battle and perish.";
asv[10] = "And David said, As Jehovah liveth, Jehovah will smite him; or his day shall come to die; or he shall go down into battle and perish.";
yng[10] = "And David saith, `Jehovah liveth; except Jehovah doth smite him, or his day come that he hath died, or into battle he go down, and hath been consumed --";
dby[10] = "And David said, [As] Jehovah liveth, Jehovah will surely smite him; either his day shall come to die, or he shall descend into battle and perish.";
web[10] = "David said furthermore, [As] the LORD liveth, the LORD will smite him; or his day will come to die; or he will descend into battle and perish.";
hnv[10] = "David said, As the LORD lives, the LORD will strike him; or his day shall come to die; or he shall go down into battle and perish.";

kjv[11] = "The LORD forbid that I should stretch forth mine hand against the LORD\'S anointed: but, I pray thee, take thou now the spear that [is] at his bolster, and the cruse of water, and let us go.";
rsv[11] = "The LORD forbid that I should put forth my hand against the LORD\'S anointed; but take now the spear that is at his head, and the jar of water, and let us go.&quot;";
asv[11] = "Jehovah forbid that I should put forth my hand against Jehovah\'s anointed: but now take, I pray thee, the spear that is at his head, and the cruse of water, and let us go.";
yng[11] = "far be it from me, by Jehovah, from putting forth my hand against the anointed of Jehovah; and, now, take, I pray thee, the spear which [is] at his pillow, and the cruse of water, and we go away.\'";
dby[11] = "Jehovah forbid that I should stretch forth my hand against Jehovah\'s anointed! But now take, I pray thee, the spear that is at his head, and the cruse of water, and let us go.";
web[11] = "The LORD forbid that I should stretch forth my hand against the LORD\'S anointed: but, I pray thee, take thou now the spear that [is] at his bolster, and the cruse of water, and let us go.";
hnv[11] = "The LORD forbid that I should put forth my hand against the LORD\'s anointed: but now please take the spear that is at his head, and the jar of water, and let us go.";

kjv[12] = "So David took the spear and the cruse of water from Saul\'s bolster; and they gat them away, and no man saw [it], nor knew [it], neither awaked: for they [were] all asleep; because a deep sleep from the LORD was fallen upon them.";
rsv[12] = "So David took the spear and the jar of water from Saul\'s head; and they went away. No man saw it, or knew it, nor did any awake; for they were all asleep, because a deep sleep from the LORD had fallen upon them.";
asv[12] = "So David took the spear and the cruse of water from Saul\'s head; and they gat them away: and no man saw it, nor knew it, neither did any awake; for they were all asleep, because a deep sleep from Jehovah was fallen upon them.";
yng[12] = "And David taketh the spear, and the cruse of water at the pillow of Saul, and they go away, and there is none seeing, and there is none knowing, and there is none awaking, for all of them are sleeping, for a deep sleep [from] Jehovah hath fallen upon them.";
dby[12] = "And David took the spear and the cruse of water from Saul\'s head; and they went away, and no man saw [it], and none knew [it], and none awaked, for they were all asleep; for a deep sleep from Jehovah had fallen upon them.";
web[12] = "So David took the spear and the cruse of water from Saul\'s bolster; and they departed, and no man saw [it], nor knew [it], neither awaked: for they [were] all asleep: because a deep sleep from the LORD had fallen upon them.";
hnv[12] = "So David took the spear and the jar of water from Sha\'ul\'s head; and they got them away: and no man saw it, nor knew it, neither did any awake; for they were all asleep, because a deep sleep from the LORD was fallen on them.";
vul[12] = "tulit ergo David hastam et scyphum aquae qui erat ad caput Saul et abierunt et non erat quisquam qui videret et intellegeret et vigilaret sed omnes dormiebant quia sopor Domini inruerat super eos";

asv[13] = "Then David went over to the other side, and stood on the top of the mountain afar off; a great space being between them;";
yng[13] = "And David passeth over to the other side, and standeth on the top of the hill afar off -- great [is] the place between them;";
dby[13] = "And David went over to the other side, and stood on the top of a hill afar off; a great space [being] between them.";

hnv[13] = " Then David went over to the other side, and stood on the top of the mountain afar off; a great space being between them;";
vul[13] = "cumque transisset David ex adverso et stetisset in vertice montis de longe et esset grande intervallum inter eos";
kjv[14] = "And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who [art] thou [that] criest to the king?";
rsv[14] = "and David called to the army, and to Abner the son of Ner, saying, &quot;Will you not answer, Abner?&quot; Then Abner answered, &quot;Who are you that calls to the king?&quot;";
asv[14] = "and David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who art thou that criest to the king?";
yng[14] = "and David calleth unto the people, and unto Abner son of Ner, saying, `Dost thou not answer, Abner?\' and Abner answereth and saith, `Who [art] thou [who] hast called unto the king?\'";
dby[14] = "And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who art thou that criest to the king?";
web[14] = "And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who [art] thou [that] criest to the king?";
hnv[14] = "and David cried to the people, and to Aviner the son of Ner, saying, Don\'t you answer, Aviner? Then Aviner answered, Who are you who cries to the king?";
vul[14] = "clamavit David ad populum et ad Abner filium Ner dicens nonne respondebis Abner et respondens Abner ait quis es tu qui clamas et inquietas regem";
kjv[15] = "And David said to Abner, [Art] not thou a [valiant] man? and who [is] like to thee in Israel? wherefore then hast thou not kept thy lord the king? for there came one of the people in to destroy the king thy lord.";
rsv[15] = "And David said to Abner, &quot;Are you not a man? Who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came in to destroy the king your lord.";
asv[15] = "And David said to Abner, Art not thou a [valiant] man? and who is like to thee in Israel? wherefore then hast thou not kept watch over thy lord the king? for there came one of the people in to destroy the king thy lord.";
yng[15] = "And David saith unto Abner, `Art not thou a man? and who [is] like thee in Israel? but why hast thou not watched over thy lord the king? for one of the people had come in to destroy the king, thy lord.";
dby[15] = "And David said to Abner, Art not thou a man? and who is like to thee in Israel? and why hast thou not guarded thy lord the king? for one of the people came in to destroy the king thy lord.";
web[15] = "And David said to Abner, [Art] not thou a [valiant] man? and who [is] like to thee in Israel? why then hast thou not kept thy lord the king? for there came in one of the people to destroy the king thy lord.";
hnv[15] = "David said to Aviner, Aren\'t you a [valiant] man? and who is like you in Yisra\'el? why then have you not kept watch over your lord, the king? for there came one of the people in to destroy the king your lord.";
vul[15] = "et ait David ad Abner numquid non vir tu es et quis alius similis tui in Israhel quare ergo non custodisti dominum tuum regem ingressus est enim unus de turba ut interficeret regem dominum tuum";
kjv[16] = "This thing [is] not good that thou hast done. [As] the LORD liveth, ye [are] worthy to die, because ye have not kept your master, the LORD\'S anointed. And now see where the king\'s spear [is], and the cruse of water that [was] at his bolster.";
rsv[16] = "This thing that you have done is not good. As the LORD lives, you deserve to die, because you have not kept watch over your lord, the LORD\'S anointed. And now see where the king\'s spear is, and the jar of water that was at his head.&quot;";
asv[16] = "This thing is not good that thou hast done. As Jehovah liveth, ye are worthy to die, because ye have not kept watch over your lord, Jehovah\'s anointed. And now see where the king\'s spear is, and the cruse of water that was at his head.";
yng[16] = "Not good is this thing which thou hast done; Jehovah liveth, but ye [are] sons of death, in that ye have not watched over your lord, over the anointed of Jehovah; and now, see where the king\'s spear [is], and the cruse of water which [is] at his bolster.\'";
dby[16] = "This thing is not good which thou hast done. As Jehovah liveth, ye are worthy to die, because ye have not guarded your master, Jehovah\'s anointed. And now see where the king\'s spear is, and the cruse of water that was at his head.";
web[16] = "This thing [is] not good that thou hast done. [As] the LORD liveth, [ye are] worthy to die, because ye have not kept your master the LORD\'S anointed. And now see where the king\'s spear [is], and the cruse of water that [was] at his bolster.";
hnv[16] = "This thing isn\'t good that you have done. As the LORD lives, you are worthy to die, because you have not kept watch over your lord, the LORD\'s anointed. Now see where the king\'s spear is, and the jar of water that was at his head.";
vul[16] = "non est bonum hoc quod fecisti vivit Dominus quoniam filii mortis estis vos qui non custodistis dominum vestrum christum Domini nunc ergo vide ubi sit hasta regis et ubi scyphus aquae qui erat ad caput eius";
kjv[17] = "And Saul knew David\'s voice, and said, [Is] this thy voice, my son David? And David said, [It is] my voice, my lord, O king.";
rsv[17] = "Saul recognized David\'s voice, and said, &quot;Is this your voice, my son David?&quot; And David said, &quot;It is my voice, my lord, O king.&quot;";
asv[17] = "And Saul knew David\'s voice, and said, Is this thy voice, my son David? And David said, It is my voice, my lord, O king.";
yng[17] = "And Saul discerneth the voice of David, and saith, `Is this thy voice, my son David?\' and David saith, `My voice, my lord, O king!\'";
dby[17] = "And Saul knew David\'s voice, and said, Is this thy voice, my son David? And David said, It is my voice, my lord, O king.";
web[17] = "And Saul knew David\'s voice, and said, [Is] this thy voice, my son David? and David said, [It is] my voice, my lord, O king.";
hnv[17] = "Sha\'ul knew David\'s voice, and said, Is this your voice, my son David? David said, It is my voice, my lord, O king.";
vul[17] = "cognovit autem Saul vocem David et dixit num vox tua est haec fili mi David et David vox mea domine mi rex";
kjv[18] = "And he said, Wherefore doth my lord thus pursue after his servant? for what have I done? or what evil [is] in mine hand?";
rsv[18] = "And he said, &quot;Why does my lord pursue after his servant? For what have I done? What guilt is on my hands?";
asv[18] = "And he said, Wherefore doth my lord pursue after his servant? for what have I done? or what evil is in my hand?";
yng[18] = "and he saith, `Why [is] this -- my lord is pursuing after his servant? for what have I done, and what [is] in my hand evil?";
dby[18] = "And he said, Why does my lord thus pursue after his servant? for what have I done? or what evil is in my hand?";
web[18] = "And he said, Why doth my lord thus pursue his servant? for what have I done? or what evil [is] in my hand?";
hnv[18] = "He said, Why does my lord pursue after his servant? for what have I done? or what evil is in my hand?";
vul[18] = "et ait quam ob causam dominus meus persequitur servum suum quid feci aut quod est in manu mea malum";
kjv[19] = "Now therefore, I pray thee, let my lord the king hear the words of his servant. If the LORD have stirred thee up against me, let him accept an offering: but if [they be] the children of men, cursed [be] they before the LORD; for they have driven me out this day from abiding in the inheritance of the LORD, saying, Go, serve other gods.";
rsv[19] = "Now therefore let my lord the king hear the words of his servant. If it is the LORD who has stirred you up against me, may he accept an offering; but if it is men, may they be cursed before the LORD, for they have driven me out this day that I should have no share in the heritage of the LORD, saying, \'Go, serve other gods.\'";
asv[19] = "Now therefore, I pray thee, let my lord the king hear the words of his servant. If it be Jehovah that hath stirred thee up against me, let him accept an offering: but if it be the children of men, cursed be they before Jehovah; for they have driven me out this day that I should not cleave unto the inheritance of Jehovah, saying, Go, serve other gods.";
yng[19] = "And, now, let, I pray thee, my lord the king hear the words of his servant: if Jehovah hath moved thee against me, let Him accept a present; and if the sons of men -- cursed [are] they before Jehovah, for they have cast me out to-day from being admitted into the inheritance of Jehovah, saying, Go, serve other gods.";
dby[19] = "And now, I pray thee, let my lord the king hear the words of his servant. If Jehovah have moved thee against me, let him accept an oblation; but if the sons of men, cursed be they before Jehovah; for they have driven me out this day from adhering to the inheritance of Jehovah, saying, Go, serve other gods.";
web[19] = "Now therefore, I pray thee, let my lord the king hear the words of his servant. If the LORD hath stirred thee up against me, let him accept an offering: but if [they are] the children of men, cursed [be] they before the LORD; for they have driven me out this day from abiding in the inheritance of the LORD, saying, Go, serve other gods.";
hnv[19] = " Now therefore, please let my lord the king hear the words of his servant. If it be the LORD that has stirred you up against me, let him accept an offering: but if it be the children of men, cursed be they before the LORD: for they have driven me out this day that I shouldn\'t cling to the LORD\'s inheritance, saying, Go, serve other gods.";
vul[19] = "nunc ergo audi oro domine mi rex verba servi tui si Dominus incitat te adversum me odoretur sacrificium si autem filii hominum maledicti sunt in conspectu Domini qui eiecerunt me hodie ut non habitem in hereditate Domini dicentes vade servi diis alienis";
kjv[20] = "Now therefore, let not my blood fall to the earth before the face of the LORD: for the king of Israel is come out to seek a flea, as when one doth hunt a partridge in the mountains.";
rsv[20] = "Now therefore, let not my blood fall to the earth away from the presence of the LORD; for the king of Israel has come out to seek my life, like one who hunts a partridge in the mountains.&quot;";
asv[20] = "Now therefore, let not my blood fall to the earth away from the presence of Jehovah: for the king of Israel is come out to seek a flea, as when one doth hunt a partridge in the mountains.";
yng[20] = "`And now, let not my blood fall to the earth over-against the face of Jehovah, for the king of Israel hath come out to seek one flea, as [one] pursueth the partridge in mountains.\'";
dby[20] = "And now, let not my blood fall to the earth far from the face of Jehovah; for the king of Israel is come out to seek a single flea, as when they hunt a partridge on the mountains.";
web[20] = "Now therefore, let not my blood fall to the earth before the face of the LORD: for the king of Israel hath come out to seek a flea, as when one doth hunt a partridge in the mountains.";
hnv[20] = " Now therefore, don\'t let my blood fall to the eretz away from the presence of the LORD: for the king of Yisra\'el is come out to seek a flea, as when one does hunt a partridge in the mountains.";
vul[20] = "et nunc non effundatur sanguis meus in terra coram Domino quia egressus est rex Israhel ut quaerat pulicem unum sicut persequitur perdix in montibus";
kjv[21] = "Then said Saul, I have sinned: return, my son David: for I will no more do thee harm, because my soul was precious in thine eyes this day: behold, I have played the fool, and have erred exceedingly.";
rsv[21] = "Then Saul said, &quot;I have done wrong; return, my son David, for I will no more do you harm, because my life was precious in your eyes this day; behold, I have played the fool, and have erred exceedingly.&quot;";
asv[21] = "Then said Saul, I have sinned: return, my son David; for I will no more do thee harm, because my life was precious in thine eyes this day: behold, I have played the fool, and have erred exceedingly.";
yng[21] = "And Saul saith, `I have sinned; turn back, my son David, for I do evil to thee no more, because that my soul hath been precious in thine eyes this day; lo, I have acted foolishly, and do err very greatly.\'";
dby[21] = "And Saul said, I have sinned: return, my son David; for I will no more do thee harm, because my life was precious in thine eyes this day: behold, I have acted foolishly, and have erred exceedingly.";
web[21] = "Then said Saul, I have sinned: return, my son David: for I will no more do thee harm, because my soul was precious in thy eyes this day: behold I have played the fool, and have erred exceedingly.";
hnv[21] = "Then said Sha\'ul, I have sinned: return, my son David; for I will no more do you harm, because my life was precious in your eyes this day: behold, I have played the fool, and have erred exceedingly.";
vul[21] = "et ait Saul peccavi revertere fili mi David nequaquam enim ultra male tibi faciam eo quod pretiosa fuerit anima mea in oculis tuis hodie apparet quod stulte egerim et ignoraverim multa nimis";
kjv[22] = "And David answered and said, Behold the king\'s spear! and let one of the young men come over and fetch it.";
rsv[22] = "And David made answer, &quot;Here is the spear, O king! Let one of the young men come over and fetch it.";
asv[22] = "And David answered and said, Behold the spear, O king! let then one of the young men come over and fetch it.";
yng[22] = "And David answereth and saith, `Lo, the king\'s spear; and let one of the young men pass over, and receive it;";
dby[22] = "And David answered and said, Behold the king\'s spear, and let one of the young men come over and fetch it.";
web[22] = "And David answered and said, Behold the king\'s spear! and let one of the young men come over and take it.";
hnv[22] = "David answered, Behold the spear, O king! let then one of the young men come over and get it.";
vul[22] = "et respondens David ait ecce hasta regis transeat unus de pueris et tollat eam";
kjv[23] = "The LORD render to every man his righteousness and his faithfulness: for the LORD delivered thee into [my] hand to day, but I would not stretch forth mine hand against the LORD\'S anointed.";
rsv[23] = "The LORD rewards every man for his righteousness and his faithfulness; for the LORD gave you into my hand today, and I would not put forth my hand against the LORD\'S anointed.";
asv[23] = "And Jehovah will render to every man his righteousness and his faithfulness; forasmuch as Jehovah delivered thee into my hand to-day, and I would not put forth my hand against Jehovah\'s anointed.";
yng[23] = "and Jehovah doth turn back to each his righteousness and his faithfulness, in that Jehovah hath given thee to-day into [my] hand, and I have not been willing to put forth my hand against the anointed of Jehovah,";
dby[23] = "And Jehovah will render to every man his righteousness and his faithfulness; for Jehovah gave thee into [my] hand this day, and I would not stretch forth my hand against Jehovah\'s anointed.";
web[23] = "The LORD render to every man his righteousness and his faithfulness: for the LORD delivered thee into [my] hand to-day, but I would not stretch forth my hand against the LORD\'S anointed.";
hnv[23] = "The LORD will render to every man his righteousness and his faithfulness; because the LORD delivered you into my hand today, and I wouldn\'t put forth my hand against the LORD\'s anointed.";
vul[23] = "Dominus autem retribuet unicuique secundum iustitiam suam et fidem tradidit enim te Dominus hodie in manu mea et nolui levare manum meam in christum Domini";
kjv[24] = "And, behold, as thy life was much set by this day in mine eyes, so let my life be much set by in the eyes of the LORD, and let him deliver me out of all tribulation.";
rsv[24] = "Behold, as your life was precious this day in my sight, so may my life be precious in the sight of the LORD, and may he deliver me out of all tribulation.&quot;";
asv[24] = "And, behold, as thy life was much set by this day in mine eyes, so let my life be much set by in the eyes of Jehovah, and let him deliver me out of all tribulation.";
yng[24] = "and lo, as thy soul hath been great this day in mine eyes, so is my soul great in the eyes of Jehovah, and He doth deliver me out of all distress.\'";
dby[24] = "And behold, as thy life was highly esteemed this day in mine eyes, so let my life be highly esteemed in the eyes of Jehovah, that he may deliver me out of all distress.";
web[24] = "And behold, as thy life was precious this day in my eyes, so let my life be precious in the eyes of the LORD, and let him deliver me out of all tribulation.";
hnv[24] = "Behold, as your life was much set by this day in my eyes, so let my life be much set by in the eyes of the LORD, and let him deliver me out of all oppression.";
vul[24] = "et sicuti magnificata est anima tua hodie in oculis meis sic magnificetur anima mea in oculis Domini et liberet me de omni angustia";
kjv[25] = "Then Saul said to David, Blessed [be] thou, my son David: thou shalt both do great [things], and also shalt still prevail. So David went on his way, and Saul returned to his place.";
rsv[25] = "Then Saul said to David, &quot;Blessed be you, my son David! You will do many things and will succeed in them.&quot; So David went his way, and Saul returned to his place.";
asv[25] = "Then Saul said to David, Blessed be thou, my son David: thou shalt both do mightily, and shalt surely prevail. So David went his way, and Saul returned to his place.";
yng[25] = "And Saul saith unto David, `Blessed [art] thou, my son David, also working thou dost work, and also prevailing thou dost prevail.\' And David goeth on his way, and Saul hath turned back to his place.";
dby[25] = "And Saul said to David, Blessed be thou, my son David: thou shalt certainly do [great things], and shalt certainly prevail. And David went on his way, and Saul returned to his place.";
web[25] = "Then Saul said to David, Blessed [be] thou, my son David: thou shalt both do great [things], and also shalt still prevail. So David went on his way, and Saul returned to his place.";
hnv[25] = "Then Sha\'ul said to David, Blessed be you, my son David: you shall both do mightily, and shall surely prevail. So David went his way, and Sha\'ul returned to his place.";
vul[25] = "ait ergo Saul ad David benedictus tu fili mi David et quidem faciens facies et potens poteris abiit autem David in viam suam et Saul reversus est in locum suum";
