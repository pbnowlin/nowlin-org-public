csb[1] = "Samuel told Saul, &quot;The LORD sent me to anoint you as king over his people Israel. Now, listen to the words of the LORD.&quot;"
csb[2] = "&quot;This is what the LORD of Armies says: \'I witnessed what the Amalekites did to the Israelites when they opposed them along the way as they were coming out of Egypt.&quot;"
csb[3] = "&quot;Now go and attack the Amalekites and completely destroy everything they have. Do not spare them. Kill men and women, infants and nursing babies, oxen and sheep, camels and donkeys.\' &quot;"
csb[4] = "Then Saul summoned the troops and counted them at Telaim: two hundred thousand foot soldiers and ten thousand men from Judah.&quot;"
csb[5] = "Saul came to the city of Amalek and set up an ambush in the wadi.&quot;"
csb[6] = "He warned the Kenites, &quot;Since you showed kindness to all the Israelites when they came out of Egypt, go on and leave! Get away from the Amalekites, or I\'ll sweep you away with them.&quot; So the Kenites withdrew from the Amalekites.&quot;"
csb[7] = "Then Saul struck down the Amalekites from Havilah all the way to Shur, which is next to Egypt.&quot;"
csb[8] = "He captured King Agag of Amalek alive, but he completely destroyed all the rest of the people with the sword.&quot;"
csb[9] = "Saul and the troops spared Agag, and the best of the sheep, goats, cattle, and choice animals, as well as the young rams and the best of everything else. They were not willing to destroy them, but they did destroy all the worthless and unwanted things.&quot;"
csb[10] = "Then the word of the LORD came to Samuel,&quot;"
csb[11] = "&quot;I regret that I made Saul king, for he has turned away from following me and has not carried out my instructions.&quot; So Samuel became angry and cried out to the LORD all night.&quot;"
csb[12] = "Early in the morning Samuel got up to confront Saul, but it was reported to Samuel, &quot;Saul went to Carmel where he set up a monument for himself. Then he turned around and went down to Gilgal.&quot;"
csb[13] = "When Samuel came to him, Saul said, &quot;May the LORD bless you. I have carried out the LORD\'s instructions.&quot;"
csb[14] = "Samuel replied, &quot;Then what is this sound of sheep, goats, and cattle I hear? &quot;"
csb[15] = "Saul answered, &quot;The troops brought them from the Amalekites and spared the best sheep, goats, and cattle in order to offer a sacrifice to the LORD your God, but the rest we destroyed.&quot;"
csb[16] = "&quot;Stop! &quot; exclaimed Samuel. &quot;Let me tell you what the LORD said to me last night.&quot; &quot;Tell me,&quot; he replied.&quot;"
csb[17] = "Samuel continued, &quot;Although you once considered yourself unimportant, have you not become the leader of the tribes of Israel? The LORD anointed you king over Israel&quot;"
csb[18] = "&quot;and then sent you on a mission and said: \'Go and completely destroy the sinful Amalekites. Fight against them until you have annihilated them.\'&quot;"
csb[19] = "&quot;So why didn\'t you obey the LORD? Why did you rush on the plunder and do what was evil in the LORD\'s sight? &quot;"
csb[20] = "&quot;But I did obey the LORD! &quot; Saul answered. &quot;I went on the mission the LORD gave me: I brought back King Agag of Amalek, and I completely destroyed the Amalekites.&quot;"
csb[21] = "&quot;The troops took sheep, goats, and cattle from the plunder -- the best of what was set apart for destruction -- to sacrifice to the LORD your God at Gilgal.&quot;"
csb[22] = "Then Samuel said: Does the LORD take pleasure in burnt offerings and sacrifices as much as in obeying the LORD? Look: to obey is better than sacrifice, to pay attention is better than the fat of rams.&quot;"
csb[23] = "For rebellion is like the sin of divination, and defiance is like wickedness and idolatry. Because you have rejected the word of the LORD, he has rejected you as king.&quot;"
csb[24] = "Saul answered Samuel, &quot;I have sinned. I have transgressed the LORD\'s command and your words. Because I was afraid of the people, I obeyed them.&quot;"
csb[25] = "&quot;Now therefore, please forgive my sin and return with me so I can worship the LORD.&quot;"
csb[26] = "Samuel replied to Saul, &quot;I will not return with you. Because you rejected the word of the LORD, the LORD has rejected you from being king over Israel.&quot;"
csb[27] = "When Samuel turned to go, Saul grabbed the corner of his robe, and it tore.&quot;"
csb[28] = "Samuel said to him, &quot;The LORD has torn the kingship of Israel away from you today and has given it to your neighbor who is better than you.&quot;"
csb[29] = "&quot;Furthermore, the Eternal One of Israel does not lie or change his mind, for he is not man who changes his mind.&quot;"
csb[30] = "Saul said, &quot;I have sinned. Please honor me now before the elders of my people and before Israel. Come back with me so I can bow in worship to the LORD your God.&quot;"
csb[31] = "Then Samuel went back, following Saul, and Saul bowed down to the LORD.&quot;"
csb[32] = "Samuel said, &quot;Bring me King Agag of Amalek.&quot; Agag came to him trembling, for he thought, &quot;Certainly the bitterness of death has come.&quot;"
csb[33] = "Samuel declared: As your sword has made women childless, so your mother will be childless among women. Then he hacked Agag to pieces before the LORD at Gilgal.&quot;"
csb[34] = "Samuel went to Ramah, and Saul went up to his home in Gibeah of Saul.&quot;"
csb[35] = "Even to the day of his death, Samuel never saw Saul again. Samuel mourned for Saul, and the LORD regretted he had made Saul king over Israel.&quot;"

rsv[17] = "And Samuel said, &quot;Though you are little in your own eyes, are you not the head of the tribes of Israel? The LORD anointed you king over Israel.";

yng[17] = "And Samuel saith, `Art not thou, if thou [art] little in thine own eyes, head of the tribes of Israel? and Jehovah doth anoint thee for king over Israel,";
dby[17] = "And Samuel said, Was it not when thou wast little in thine eyes that thou [becamest] the head of the tribes of Israel, and Jehovah anointed thee king over Israel?";
web[17] = "And Samuel said, When thou [wast] little in thy own sight, [wast] thou not [made] the head of the tribes of Israel, and the LORD anointed thee king over Israel?";
hnv[17] = "Shemu\'el said, &quot;Though you were little in your own sight, weren\'t you made the head of the tribes of Yisra\'el? the LORD anointed you king over Yisra\'el;";
vul[17] = "et ait Samuhel nonne cum parvulus esses in oculis tuis caput in tribubus Israhel factus es unxitque te Dominus regem super Israhel";
kjv[18] = "And the LORD sent thee on a journey, and said, Go and utterly destroy the sinners the Amalekites, and fight against them until they be consumed.";
rsv[18] = "And the LORD sent you on a mission, and said, \'Go, utterly destroy the sinners, the Amal\'ekites, and fight against them until they are consumed.\'";
asv[18] = "and Jehovah sent thee on a journey, and said, Go, and utterly destroy the sinners the Amalekites, and fight against them until they be consumed.";
yng[18] = "and Jehovah sendeth thee in the way, and saith, Go, and thou hast devoted the sinners, the Amalekite, and fought against them till they are consumed;";
dby[18] = "And Jehovah sent thee on a way and said, Go and utterly destroy the sinners the Amalekites, and fight against them until they be consumed.";
web[18] = "And the LORD sent thee on a journey, and said, Go, and utterly destroy the sinners the Amalekites, and fight against them until they are consumed.";
hnv[18] = "and the LORD sent you on a journey, and said, \'Go, and utterly destroy the sinners the `Amaleki, and fight against them until they are consumed.\'";
vul[18] = "et misit te Dominus in via et ait vade et interfice peccatores Amalech et pugnabis contra eos usque ad internicionem eorum";
kjv[19] = "Wherefore then didst thou not obey the voice of the LORD, but didst fly upon the spoil, and didst evil in the sight of the LORD?";
rsv[19] = "Why then did you not obey the voice of the LORD? Why did you swoop on the spoil, and do what was evil in the sight of the LORD?&quot;";
asv[19] = "Wherefore then didst thou not obey the voice of Jehovah, but didst fly upon the spoil, and didst that which was evil in the sight of Jehovah?";
yng[19] = "and why hast thou not hearkened to the voice of Jehovah -- and dost fly unto the spoil, and dost do the evil thing in the eyes of Jehovah?\'";
dby[19] = "Why then didst thou not hearken to the voice of Jehovah, but didst fall upon the spoil, and didst evil in the sight of Jehovah?";
web[19] = "Why then didst thou not obey the voice of the LORD, but didst fly upon the spoil, and didst evil in the sight of the LORD?";
hnv[19] = "Why then didn\'t you obey the voice of the LORD, but flew on the spoil, and did that which was evil in the sight of the LORD?&quot;";
vul[19] = "quare ergo non audisti vocem Domini sed versus ad praedam es et fecisti malum in oculis Domini";
kjv[20] = "And Saul said unto Samuel, Yea, I have obeyed the voice of the LORD, and have gone the way which the LORD sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites.";
rsv[20] = "And Saul said to Samuel, &quot;I have obeyed the voice of the LORD, I have gone on the mission on which the LORD sent me, I have brought Agag the king of Am\'alek, and I have utterly destroyed the Amal\'ekites.";
asv[20] = "And Saul said unto Samuel, Yea, I have obeyed the voice of Jehovah, and have gone the way which Jehovah sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites.";
yng[20] = "And Saul saith unto Samuel, `Because -- I have hearkened to the voice of Jehovah, and I go in the way which Jehovah hath sent me, and bring in Agag king of Amalek, and Amalek I have devoted;";
dby[20] = "And Saul said to Samuel, I have indeed hearkened to the voice of Jehovah, and have gone the way which Jehovah sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites.";
web[20] = "And Saul said to Samuel, Yea, I have obeyed the voice of the LORD, and have gone the way which the LORD sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites.";
hnv[20] = " Sha\'ul said to Shemu\'el, Yes, I have obeyed the voice of the LORD, and have gone the way which the LORD sent me, and have brought Agag the king of `Amalek, and have utterly destroyed the `Amaleki.";
vul[20] = "et ait Saul ad Samuhelem immo audivi vocem Domini et ambulavi in via per quam misit me Dominus et adduxi Agag regem Amalech et Amalech interfeci";
kjv[21] = "But the people took of the spoil, sheep and oxen, the chief of the things which should have been utterly destroyed, to sacrifice unto the LORD thy God in Gilgal.";
rsv[21] = "But the people took of the spoil, sheep and oxen, the best of the things devoted to destruction, to sacrifice to the LORD your God in Gilgal.&quot;";
asv[21] = "But the people took of the spoil, sheep and oxen, the chief of the devoted things, to sacrifice unto Jehovah thy God in Gilgal.";
yng[21] = "and the people taketh of the spoil of the flock and herd, the first part of the devoted thing, for sacrifice to Jehovah thy God in Gilgal.\'";
dby[21] = "But the people took of the spoil, sheep and oxen, the choicest of the devoted things, to sacrifice to Jehovah thy God in Gilgal.";
web[21] = "But the people took of the spoil, sheep and oxen, the chief of the things which should have been utterly destroyed, to sacrifice to the LORD thy God in Gilgal.";
hnv[21] = "But the people took of the spoil, sheep and oxen, the chief of the devoted things, to sacrifice to the LORD your God in Gilgal.";
vul[21] = "tulit autem populus de praeda oves et boves primitias eorum quae caesa sunt ut immolet Domino Deo suo in Galgalis";
kjv[22] = "And Samuel said, Hath the LORD [as great] delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey [is] better than sacrifice, [and] to hearken than the fat of rams.";
rsv[22] = "And Samuel said, &quot;Has the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to hearken than the fat of rams.";
asv[22] = "And Samuel said, Hath Jehovah as great delight in burnt-offerings and sacrifices, as in obeying the voice of Jehovah? Behold, to obey is better than sacrifice, and to hearken than the fat of rams.";
yng[22] = "And Samuel saith, `Hath Jehovah had delight in burnt-offerings and sacrifices as [in] hearkening to the voice of Jehovah? lo, hearkening than sacrifice is better; to give attention than fat of rams;";
dby[22] = "And Samuel said, Has Jehovah delight in burnt-offerings and sacrifices, As in hearkening to the voice of Jehovah? Behold, obedience is better than sacrifice, Attention than the fat of rams.";
web[22] = "And Samuel said, Hath the LORD [as great] delight in burnt-offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey [is] better than sacrifice, [and] to hearken than the fat of rams.";
hnv[22] = "Shemu\'el said, Has the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to listen than the fat of rams.";
vul[22] = "et ait Samuhel numquid vult Dominus holocausta aut victimas et non potius ut oboediatur voci Domini melior est enim oboedientia quam victimae et auscultare magis quam offerre adipem arietum";
kjv[23] = "For rebellion [is as] the sin of witchcraft, and stubbornness [is as] iniquity and idolatry. Because thou hast rejected the word of the LORD, he hath also rejected thee from [being] king.";
rsv[23] = "For rebellion is as the sin of divination, and stubbornness is as iniquity and idolatry. Because you have rejected the word of the LORD, he has also rejected you from being king.&quot;";
asv[23] = "For rebellion is as the sin of witchcraft, and stubbornness is as idolatry and teraphim. Because thou hast rejected the word of Jehovah, he hath also rejected thee from being king.";
yng[23] = "for a sin of divination [is] rebellion, and iniquity and teraphim [is] stubbornness; because thou hast rejected the word of Jehovah, He also doth reject thee from [being] king.\'";
dby[23] = "For rebellion is [as] the sin of divination, And selfwill is [as] iniquity and idolatry. Because thou hast rejected the word of Jehovah, He hath also rejected thee from being king.";
web[23] = "For rebellion [is as] the sin of witchcraft, and stubbornness [is as] iniquity and idolatry. Because thou hast rejected the word of the LORD, he hath also rejected thee from [being] king.";
hnv[23] = "For rebellion is as the sin of witchcraft, and stubbornness is as idolatry and terafim. Because you have rejected the word of the LORD, he has also rejected you from being king.";
vul[23] = "quoniam quasi peccatum ariolandi est repugnare et quasi scelus idolatriae nolle adquiescere pro eo ergo quod abiecisti sermonem Domini abiecit te ne sis rex";
kjv[24] = "And Saul said unto Samuel, I have sinned: for I have transgressed the commandment of the LORD, and thy words: because I feared the people, and obeyed their voice.";
rsv[24] = "And Saul said to Samuel, &quot;I have sinned; for I have transgressed the commandment of the LORD and your words, because I feared the people and obeyed their voice.";
asv[24] = "And Saul said unto Samuel, I have sinned; for I have transgressed the commandment of Jehovah, and thy words, because I feared the people, and obeyed their voice.";
yng[24] = "And Saul saith unto Samuel, `I have sinned, for I passed over the command of Jehovah, and thy words; because I have feared the people, I also hearken to their voice;";
dby[24] = "And Saul said to Samuel, I have sinned, for I have transgressed the commandment of Jehovah, and thy words; for I feared the people, and hearkened to their voice.";
web[24] = "And Saul said to Samuel, I have sinned: for I have transgressed the commandment of the LORD, and thy words; because I feared the people, and obeyed their voice.";
hnv[24] = "Sha\'ul said to Shemu\'el, I have sinned; for I have transgressed the mitzvah of the LORD, and your words, because I feared the people, and obeyed their voice.";
vul[24] = "dixitque Saul ad Samuhel peccavi quia praevaricatus sum sermonem Domini et verba tua timens populum et oboediens voci eorum";
kjv[25] = "Now therefore, I pray thee, pardon my sin, and turn again with me, that I may worship the LORD.";
rsv[25] = "Now therefore, I pray, pardon my sin, and return with me, that I may worship the LORD.&quot;";
asv[25] = "Now therefore, I pray thee, pardon my sin, and turn again with me, that I may worship Jehovah.";
yng[25] = "and now, bear, I pray thee, with my sin, and turn back with me, and I bow myself to Jehovah.\'";
dby[25] = "And now, I pray thee, forgive my sin, and turn again with me, that I may worship Jehovah.";
web[25] = "Now therefore, I pray thee, pardon my sin, and turn again with me, that I may worship the LORD.";
hnv[25] = "Now therefore, please pardon my sin, and turn again with me, that I may worship the LORD.";
vul[25] = "sed nunc porta quaeso peccatum meum et revertere mecum ut adorem Dominum";
kjv[26] = "And Samuel said unto Saul, I will not return with thee: for thou hast rejected the word of the LORD, and the LORD hath rejected thee from being king over Israel.";
rsv[26] = "And Samuel said to Saul, &quot;I will not return with you; for you have rejected the word of the LORD, and the LORD has rejected you from being king over Israel.&quot;";
asv[26] = "And Samuel said unto Saul, I will not return with thee; for thou hast rejected the word of Jehovah, and Jehovah hath rejected thee from being king over Israel.";
yng[26] = "And Samuel saith unto Saul, `I do not turn back with thee; for thou hast rejected the word of Jehovah, and Jehovah doth reject thee from being king over Israel.\'";
dby[26] = "And Samuel said to Saul, I will not turn again with thee; for thou hast rejected the word of Jehovah, and Jehovah has rejected thee from being king over Israel.";
web[26] = "And Samuel said to Saul, I will not return with thee: for thou hast rejected the word of the LORD, and the LORD hath rejected thee from being king over Israel.";
hnv[26] = "Shemu\'el said to Sha\'ul, I will not return with you; for you have rejected the word of the LORD, and the LORD has rejected you from being king over Yisra\'el.";
vul[26] = "et ait Samuhel ad Saul non revertar tecum quia proiecisti sermonem Domini et proiecit te Dominus ne sis rex super Israhel";
kjv[27] = "And as Samuel turned about to go away, he laid hold upon the skirt of his mantle, and it rent.";
rsv[27] = "As Samuel turned to go away, Saul laid hold upon the skirt of his robe, and it tore.";
asv[27] = "And as Samuel turned about to go away, [Saul] laid hold upon the skirt of his robe, and it rent.";
yng[27] = "And Samuel turneth round to go, and he layeth hold on the skirt of his upper robe -- and it is rent!";
dby[27] = "And as Samuel turned to go away, [Saul] laid hold upon the skirt of his mantle, and it rent.";
web[27] = "And as Samuel turned about to depart, he laid hold upon the skirt of his mantle, and it rent.";
hnv[27] = "As Shemu\'el turned about to go away, [Sha\'ul] laid hold on the skirt of his robe, and it tore.";
vul[27] = "et conversus est Samuhel ut abiret ille autem adprehendit summitatem pallii eius quae et scissa est";
kjv[28] = "And Samuel said unto him, The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, [that is] better than thou.";
rsv[28] = "And Samuel said to him, &quot;The LORD has torn the kingdom of Israel from you this day, and has given it to a neighbor of yours, who is better than you.";
asv[28] = "And Samuel said unto him, Jehovah hath rent the kingdom of Israel from thee this day, and hath given it to a neighbor of thine, that is better than thou.";
yng[28] = "And Samuel saith unto him, `Jehovah hath rent the kingdom of Israel from thee to-day, and given it to thy neighbour who is better than thou;";
dby[28] = "Then Samuel said to him, Jehovah has rent the kingdom of Israel from thee to-day, and has given it to thy neighbour, who is better than thou.";
web[28] = "And Samuel said to him, The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbor of thine, [that is] better than thou.";
hnv[28] = "Shemu\'el said to him, the LORD has torn the kingdom of Yisra\'el from you this day, and has given it to a neighbor of yours who is better than you.";
vul[28] = "et ait ad eum Samuhel scidit Dominus regnum Israhel a te hodie et tradidit illud proximo tuo meliori te";

rsv[29] = "And also the Glory of Israel will not lie or repent; for he is not a man, that he should repent.&quot;";
asv[29] = "And also the Strength of Israel will not lie nor repent; for he is not a man, that he should repent.";
yng[29] = "and also, the Pre-eminence of Israel doth not lie nor repent, for He [is] not a man to be penitent.\'";
dby[29] = "And also the Hope of Israel will not lie nor repent; for he is not a man, that he should repent.";

hnv[29] = "Also the Strength of Yisra\'el will not lie nor repent; for he is not a man, that he should repent.";

kjv[30] = "Then he said, I have sinned: [yet] honour me now, I pray thee, before the elders of my people, and before Israel, and turn again with me, that I may worship the LORD thy God.";
rsv[30] = "Then he said, &quot;I have sinned; yet honor me now before the elders of my people and before Israel, and return with me, that I may worship the LORD your God.&quot;";
asv[30] = "Then he said, I have sinned: yet honor me now, I pray thee, before the elders of my people, and before Israel, and turn again with me, that I may worship Jehovah thy God.";
yng[30] = "And he saith, `I have sinned; now, honour me, I pray thee, before the elders of my people, and before Israel, and turn back with me; and I have bowed myself to Jehovah thy God.\'";
dby[30] = "And he said, I have sinned; honour me now, I pray thee, before the elders of my people, and before Israel, and turn again with me, that I may worship Jehovah thy God.";
web[30] = "Then he said, I have sinned: [yet] honor me now, I pray thee, before the elders of my people, and before Israel, and turn again with me, that I may worship the LORD thy God.";
hnv[30] = "Then he said, I have sinned: yet honor me now, Please, before the Zakenim of my people, and before Yisra\'el, and turn again with me, that I may worship the LORD your God.";
vul[30] = "at ille ait peccavi sed nunc honora me coram senibus populi mei et coram Israhel et revertere mecum ut adorem Dominum Deum tuum";

rsv[31] = "So Samuel turned back after Saul; and Saul worshiped the LORD.";
asv[31] = "So Samuel turned again after Saul; and Saul worshipped Jehovah.";
yng[31] = "And Samuel turneth back after Saul, and Saul boweth himself to Jehovah;";
dby[31] = "So Samuel turned again after Saul; and Saul worshipped Jehovah.";
web[31] = "So Samuel turned again after Saul; and Saul worshiped the LORD.";
hnv[31] = "So Shemu\'el turned again after Sha\'ul; and Sha\'ul worshiped the LORD.";

kjv[32] = "Then said Samuel, Bring ye hither to me Agag the king of the Amalekites. And Agag came unto him delicately. And Agag said, Surely the bitterness of death is past.";
rsv[32] = "Then Samuel said, &quot;Bring here to me Agag the king of the Amal\'ekites.&quot; And Agag came to him cheerfully. Agag said, &quot;Surely the bitterness of death is past.&quot;";
asv[32] = "Then said Samuel, Bring ye hither to me Agag the king of the Amalekites. And Agag came unto him cheerfully. And Agag said, Surely the bitterness of death is past.";
yng[32] = "and Samuel saith, `Bring ye nigh unto me Agag king of Amalek,\' and Agag cometh unto him daintily, and Agag saith, `Surely the bitterness of death hath turned aside.\'";
dby[32] = "And Samuel said, Bring ye near to me Agag the king of Amalek. And Agag came to him gaily. And Agag said, Surely the bitterness of death is past.";

rsv[33] = "And Samuel said, &quot;As your sword has made women childless, so shall your mother be childless among women.&quot; And Samuel hewed Agag in pieces before the LORD in Gilgal.";
asv[33] = "And Samuel said, As thy sword hath made women childless, so shall thy mother be childless among women. And Samuel hewed Agag in pieces before Jehovah in Gilgal.";
yng[33] = "And Samuel saith, `As thy sword bereaved women -- so is thy mother bereaved above women;\' and Samuel heweth Agag in pieces before Jehovah in Gilgal.";
dby[33] = "And Samuel said, As thy sword has made women childless, so shall thy mother be childless above women. And Samuel hewed Agag in pieces before Jehovah in Gilgal.";
web[33] = "And Samuel said, As thy sword hath made women childless, so shall thy mother be childless among women. And Samuel hewed Agag in pieces before the LORD in Gilgal.";
hnv[33] = "Shemu\'el said, As your sword has made women childless, so shall your mother be childless among women. Shemu\'el hewed Agag in pieces before the LORD in Gilgal.";
vul[33] = "et ait Samuhel sicut fecit absque liberis mulieres gladius tuus sic absque liberis erit inter mulieres mater tua et in frusta concidit Samuhel Agag coram Domino in Galgalis";

asv[34] = "Then Samuel went to Ramah; and Saul went up to his house to Gibeah of Saul.";

dby[34] = "And Samuel went to Ramah; and Saul went up to his house to Gibeah of Saul.";
web[34] = "Then Samuel went to Ramah; and Saul went up to his house to Gibeah of Saul.";
hnv[34] = "Then Shemu\'el went to Ramah; and Sha\'ul went up to his house to Gevah of Sha\'ul.";

yng[35] = "And Samuel hath not added to see Saul till the day of his death, for Samuel mourned for Saul, and Jehovah repented that He had caused Saul to reign over Israel.";
dby[35] = "And Samuel saw Saul no more until the day of his death; for Samuel mourned over Saul; and Jehovah repented that he had made Saul king over Israel.";
web[35] = "And Samuel came no more to see Saul until the day of his death: nevertheless Samuel mourned for Saul: and the LORD repented that he had made Saul king over Israel.";
hnv[35] = "Shemu\'el came no more to see Sha\'ul until the day of his death; for Shemu\'el mourned for Sha\'ul: and the LORD repented that he had made Sha\'ul king over Yisra\'el.";
vul[35] = "et non vidit Samuhel ultra Saul usque ad diem mortis suae verumtamen lugebat Samuhel Saul quoniam Dominum paenitebat quod constituisset regem Saul super Israhel";
