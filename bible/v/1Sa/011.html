csb[1] = "Nahash the Ammonite came up and laid siege to Jabesh-gilead. All the men of Jabesh said to him, &quot;Make a treaty with us, and we will serve you.&quot;"
csb[2] = "Nahash the Ammonite replied, &quot;I\'ll make one with you on this condition: that I gouge out everyone\'s right eye and humiliate all Israel.&quot;"
csb[3] = "&quot;Don\'t do anything to us for seven days,&quot; the elders of Jabesh said to him, &quot;and let us send messengers throughout the territory of Israel. If no one saves us, we will surrender to you.&quot;"
csb[4] = "When the messengers came to Gibeah, Saul\'s hometown, and told the terms to the people, all wept aloud.&quot;"
csb[5] = "Just then Saul was coming in from the field behind his oxen. &quot;What\'s the matter with the people? Why are they weeping? &quot; Saul inquired, and they repeated to him the words of the men from Jabesh.&quot;"
csb[6] = "When Saul heard these words, the Spirit of God suddenly came powerfully on him, and his anger burned furiously.&quot;"
csb[7] = "He took a team of oxen, cut them in pieces, and sent them throughout the territory of Israel by messengers who said, &quot;This is what will be done to the ox of anyone who doesn\'t march behind Saul and Samuel.&quot; As a result, the terror of the LORD fell on the people, and they went out united.&quot;"
csb[8] = "Saul counted them at Bezek. There were three hundred thousand Israelites and thirty thousand men from Judah.&quot;"
csb[9] = "He told the messengers who had come, &quot;Tell this to the men of Jabesh-gilead: \'Deliverance will be yours tomorrow by the time the sun is hot.\' &quot; So the messengers told the men of Jabesh, and they rejoiced.&quot;"
csb[10] = "Then the men of Jabesh said to Nahash, &quot;Tomorrow we will come out, and you can do whatever you want to us.&quot;"
csb[11] = "The next day Saul organized the troops into three divisions. During the morning watch, they invaded the Ammonite camp and slaughtered them until the heat of the day. There were survivors, but they were so scattered that no two of them were left together.&quot;"
csb[12] = "Afterward, the people said to Samuel, &quot;Who said that Saul should not reign over us? Give us those men so we can kill them! &quot;"
csb[13] = "But Saul ordered, &quot;No one will be executed this day, for today the LORD has provided deliverance in Israel.&quot;"
csb[14] = "Then Samuel said to the people, &quot;Come, let\'s go to Gilgal, so we can renew the kingship there.&quot;"
csb[15] = "So all the people went to Gilgal, and there in the LORD\'s presence they made Saul king. There they sacrificed fellowship offerings in the LORD\'s presence, and Saul and all the men of Israel rejoiced greatly.&quot;"
kjv[1] = "Then Nahash the Ammonite came up, and encamped against Jabeshgilead: and all the men of Jabesh said unto Nahash, Make a covenant with us, and we will serve thee.";
rsv[1] = "Then Nahash the Ammonite went up and besieged Ja\'besh-gil\'ead; and all the men of Jabesh said to Nahash, &quot;Make a treaty with us, and we will serve you.&quot;";
asv[1] = "Then Nahash the Ammonite came up, and encamped against Jabesh-gilead: and all the men of Jabesh said unto Nahash, Make a covenant with us, and we will serve thee.";
yng[1] = "And Nahash the Ammonite cometh up, and encampeth against Jabesh-Gilead, and all the men of Jabesh say unto Nahash, `Make with us a covenant, and we serve thee.\'";
dby[1] = "And Nahash the Ammonite came up and encamped against Jabesh-Gilead. And all the men of Jabesh said to Nahash, Make a covenant with us, and we will serve thee.";
web[1] = "Then Nahash the Ammonite came up, and encamped against Jabesh-gilead: and all the men of Jabesh said to Nahash, Make a covenant with us, and we will serve thee.";
hnv[1] = "Then Nachash the `Ammonite came up, and encamped against Yavesh-Gil`ad: and all the men of Yavesh said to Nachash, Make a covenant with us, and we will serve you.";
vul[1] = "ascendit autem Naas Ammonites et pugnare coepit adversus Iabesgalaad dixeruntque omnes viri Iabes ad Naas habeto nos foederatos et serviemus tibi";
kjv[2] = "And Nahash the Ammonite answered them, On this [condition] will I make [a covenant] with you, that I may thrust out all your right eyes, and lay it [for] a reproach upon all Israel.";
rsv[2] = "But Nahash the Ammonite said to them, &quot;On this condition I will make a treaty with you, that I gouge out all your right eyes, and thus put disgrace upon all Israel.&quot;";
asv[2] = "And Nahash the Ammonite said unto them, On this condition will I make it with you, that all your right eyes be put out; and I will lay it for a reproach upon all Israel.";
yng[2] = "And Nahash the Ammonite saith unto them, `For this I covenant with you, by picking out to you every right eye -- and I have put it a reproach on all Israel.\'";
dby[2] = "And Nahash the Ammonite said to them, On this [condition] will I treat with you, that I thrust out all your right eyes, and lay it for a reproach upon all Israel.";
web[2] = "And Nahash the Ammonite answered them, On this [condition] will I make [a covenant] with you, that I may thrust out all your right eyes, and lay it [for] a reproach upon all Israel.";
hnv[2] = "Nachash the `Ammonite said to them, On this condition will I make it with you, that all your right eyes be put out; and I will lay it for a reproach on all Yisra\'el.";
vul[2] = "et respondit ad eos Naas Ammonites in hoc feriam vobiscum foedus ut eruam omnium vestrum oculos dextros ponamque vos obprobrium in universo Israhel";
kjv[3] = "And the elders of Jabesh said unto him, Give us seven days\' respite, that we may send messengers unto all the coasts of Israel: and then, if [there be] no man to save us, we will come out to thee.";
rsv[3] = "The elders of Jabesh said to him, &quot;Give us seven days respite that we may send messengers through all the territory of Israel. Then, if there is no one to save us, we will give ourselves up to you.&quot;";
asv[3] = "And the elders of Jabesh said unto him, Give us seven days\' respite, that we may send messengers unto all the borders of Israel; and then, if there be none to save us, we will come out to thee.";
yng[3] = "And the elders of Jabesh say to him, `Let us alone seven days, and we send messengers into all the border of Israel: and if there is none saving us -- then we have come out unto thee.\'";
dby[3] = "And the elders of Jabesh said to him, Allow us seven days, and we will send messengers into all the districts of Israel; and if there be no man to deliver us, we will come out to thee.";
web[3] = "And the elders of Jabesh said to him, Give us seven days respit, that we may send messengers to all the borders of Israel: and then, if [there is] no man to save us, we will come out to thee.";
hnv[3] = "The Zakenim of Yavesh said to him, Give us seven days\' respite, that we may send messengers to all the borders of Yisra\'el; and then, if there be none to save us, we will come out to you.";
vul[3] = "et dixerunt ad eum seniores Iabes concede nobis septem dies ut mittamus nuntios in universos terminos Israhel et si non fuerit qui defendat nos egrediemur ad te";
kjv[4] = "Then came the messengers to Gibeah of Saul, and told the tidings in the ears of the people: and all the people lifted up their voices, and wept.";
rsv[4] = "When the messengers came to Gib\'e-ah of Saul, they reported the matter in the ears of the people; and all the people wept aloud.";
asv[4] = "Then came the messengers to Gibeah of Saul, and spake these words in the ears of the people: and all the people lifted up their voice, and wept.";
yng[4] = "And the messengers come to Gibeah of Saul, and speak the words in the ears of the people, and all the people lift up their voice and weep;";
dby[4] = "And the messengers came to Gibeah of Saul and told these words in the ears of the people. And all the people lifted up their voice and wept.";
web[4] = "Then came the messengers to Gibeah of Saul, and told the tidings in the ears of the people; and all the people lifted up their voices, and wept.";
hnv[4] = " Then came the messengers to Gevah of Sha\'ul, and spoke these words in the ears of the people: and all the people lifted up their voice, and wept.";
vul[4] = "venerunt ergo nuntii in Gabaath Saulis et locuti sunt verba audiente populo et levavit omnis populus vocem suam et flevit";
kjv[5] = "And, behold, Saul came after the herd out of the field; and Saul said, What [aileth] the people that they weep? And they told him the tidings of the men of Jabesh.";
rsv[5] = "Now Saul was coming from the field behind the oxen; and Saul said, &quot;What ails the people, that they are weeping?&quot; So they told him the tidings of the men of Jabesh.";
asv[5] = "And, behold, Saul came following the oxen out of the field; and Saul said, What aileth the people that they weep? And they told him the words of the men of Jabesh.";
yng[5] = "and lo, Saul hath come after the herd out of the field, and Saul saith, `What -- to the people, that they weep?\' and they recount to him the words of the men of Jabesh.";
dby[5] = "And behold, Saul came after the oxen from the field; and Saul said, What [aileth] the people that they weep? And they related to him the words of the men of Jabesh.";
web[5] = "And behold, Saul came after the herd out of the field; and Saul said, What [aileth] the people that they weep? And they told him the tidings of the men of Jabesh.";

asv[6] = "And the Spirit of God came mightily upon Saul when he heard those words, and his anger was kindled greatly.";
yng[6] = "And the Spirit of God doth prosper over Saul, in his hearing these words, and his anger burneth greatly,";
dby[6] = "And the Spirit of God came upon Saul when he heard those words, and his anger was kindled greatly.";
web[6] = "And the Spirit of God came upon Saul when he heard those tidings, and his anger was kindled greatly.";
hnv[6] = "The Spirit of God came mightily on Sha\'ul when he heard those words, and his anger was kindled greatly.";
vul[6] = "et insilivit spiritus Domini in Saul cum audisset verba haec et iratus est furor eius nimis";
kjv[7] = "And he took a yoke of oxen, and hewed them in pieces, and sent [them] throughout all the coasts of Israel by the hands of messengers, saying, Whosoever cometh not forth after Saul and after Samuel, so shall it be done unto his oxen. And the fear of the LORD fell on the people, and they came out with one consent.";
rsv[7] = "He took a yoke of oxen, and cut them in pieces and sent them throughout all the territory of Israel by the hand of messengers, saying, &quot;Whoever does not come out after Saul and Samuel, so shall it be done to his oxen!&quot; Then the dread of the LORD fell upon the people, and they came out as one man.";
asv[7] = "And he took a yoke of oxen, and cut them in pieces, and sent them throughout all the borders of Israel by the hand of messengers, saying, Whosoever cometh not forth after Saul and after Samuel, so shall it be done unto his oxen. And the dread of Jehovah fell on the people, and they came out as one man.";
yng[7] = "and he taketh a couple of oxen, and cutteth them in pieces, and sendeth through all the border of Israel, by the hand of the messengers, saying, `He who is not coming out after Saul and after Samuel -- thus it is done to his oxen;\' and the fear of Jehovah falleth on the people, and they come out as one man.";
dby[7] = "And he took a yoke of oxen and cut them in pieces, and sent throughout the territory of Israel by the hand of messengers, saying, Whoever comes not forth after Saul and after Samuel, so shall it be done to his oxen! And the fear of Jehovah fell on the people, and they came out as one man.";
web[7] = "And he took a yoke of oxen, and hewed them in pieces, and sent [them] throughout all the borders of Israel by the hands of messengers, saying, Whoever cometh not forth after Saul and after Samuel, so shall it be done to his oxen. And the fear of the LORD fell on the people, and they came out with one consent.";
hnv[7] = "He took a yoke of oxen, and cut them in pieces, and sent them throughout all the borders of Yisra\'el by the hand of messengers, saying, Whoever doesn\'t come forth after Sha\'ul and after Shemu\'el, so shall it be done to his oxen. The dread of the LORD fell on the people, and they came out as one man.";
vul[7] = "et adsumens utrumque bovem concidit in frusta misitque in omnes terminos Israhel per manum nuntiorum dicens quicumque non exierit secutusque fuerit Saul et Samuhelem sic fiet bubus eius invasit ergo timor Domini populum et egressi sunt quasi vir unus";
kjv[8] = "And when he numbered them in Bezek, the children of Israel were three hundred thousand, and the men of Judah thirty thousand.";
rsv[8] = "When he mustered them at Bezek, the men of Israel were three hundred thousand, and the men of Judah thirty thousand.";
asv[8] = "And he numbered them in Bezek; and the children of Israel were three hundred thousand, and the men of Judah thirty thousand.";
yng[8] = "And he inspecteth them in Bezek, and the sons of Israel are three hundred thousand, and the men of Judah thirty thousand.";
dby[8] = "And he numbered them in Bezek, and the children of Israel were three hundred thousand, and the men of Judah thirty thousand.";
web[8] = "And when he numbered them in Bezek, the children of Israel were three hundred thousand, and the men of Judah thirty thousand.";
hnv[8] = "He numbered them in Bezek; and the children of Yisra\'el were three hundred thousand, and the men of Yehudah thirty thousand.";
vul[8] = "et recensuit eos in Bezec fueruntque filiorum Israhel trecenta milia virorum autem Iuda triginta milia";
kjv[9] = "And they said unto the messengers that came, Thus shall ye say unto the men of Jabeshgilead, To morrow, by [that time] the sun be hot, ye shall have help. And the messengers came and shewed [it] to the men of Jabesh; and they were glad.";
rsv[9] = "And they said to the messengers who had come, &quot;Thus shall you say to the men of Ja\'besh-gil\'ead: \'Tomorrow, by the time the sun is hot, you shall have deliverance.\'&quot; When the messengers came and told the men of Jabesh, they were glad.";
asv[9] = "And they said unto the messengers that came, Thus shall ye say unto the men of Jabesh-gilead, To-morrow, by the time the sun is hot, ye shall have deliverance. And the messengers came and told the men of Jabesh; and they were glad.";
yng[9] = "And they say to the messengers who are coming, `Thus do ye say to the men of Jabesh-Gilead: To-morrow ye have safety -- by the heat of the sun;\' and the messengers come and declare to the men of Jabesh, and they rejoice;";
dby[9] = "And they said to the messengers that had come, Thus shall ye say to the men of Jabesh-Gilead: To-morrow ye shall have deliverance when the sun is hot. And the messengers came and informed the men of Jabesh-Gilead; and they were glad.";
web[9] = "And they said to the messengers that came, thus shall ye say to the men of Jabesh-gilead, To-morrow by [the time] the sun is hot, ye shall have help. And the messengers came and showed [it] to the men of Jabesh; and they were glad.";
hnv[9] = "They said to the messengers who came, Thus shall you tell the men of Yavesh-Gil`ad, Tomorrow, by the time the sun is hot, you shall have deliverance. The messengers came and told the men of Yavesh; and they were glad.";
vul[9] = "et dixerunt nuntiis qui venerant sic dicetis viris qui sunt in Iabesgalaad cras erit vobis salus cum incaluerit sol venerunt ergo nuntii et adnuntiaverunt viris Iabes qui laetati sunt";
kjv[10] = "Therefore the men of Jabesh said, To morrow we will come out unto you, and ye shall do with us all that seemeth good unto you.";
rsv[10] = "Therefore the men of Jabesh said, &quot;Tomorrow we will give ourselves up to you, and you may do to us whatever seems good to you.&quot;";
asv[10] = "Therefore the men of Jabesh said, To-morrow we will come out unto you, and ye shall do with us all that seemeth good unto you.";
yng[10] = "and the men of Jabesh say [to the Ammonites], `To-morrow we come out unto you, and ye have done to us according to all that [is] good in your eyes.\'";
dby[10] = "And the men of Jabesh said, To-morrow we will come out to you, and ye may do with us according to all that is good in your sight.";
web[10] = "Therefore the men of Jabesh said, To-morrow we will come out to you, and ye shall do with us all that seemeth good to you.";
hnv[10] = "Therefore the men of Yavesh said, Tomorrow we will come out to you, and you shall do with us all that seems good to you.";
vul[10] = "et dixerunt mane exibimus ad vos et facietis nobis omne quod placuerit vobis";
kjv[11] = "And it was [so] on the morrow, that Saul put the people in three companies; and they came into the midst of the host in the morning watch, and slew the Ammonites until the heat of the day: and it came to pass, that they which remained were scattered, so that two of them were not left together.";
rsv[11] = "And on the morrow Saul put the people in three companies; and they came into the midst of the camp in the morning watch, and cut down the Ammonites until the heat of the day; and those who survived were scattered, so that no two of them were left together.";
asv[11] = "And it was so on the morrow, that Saul put the people in three companies; and they came into the midst of the camp in the morning watch, and smote the Ammonites until the heat of the day: and it came to pass, that they that remained were scattered, so that not two of them were left together.";
yng[11] = "And it cometh to pass, on the morrow, that Saul putteth the people in three detachments, and they come into the midst of the camp in the morning-watch, and smite Ammon till the heat of the day; and it cometh to pass that those left are scattered, and there have not been left of them two together.";
dby[11] = "And it came to pass the next day that Saul set the people in three companies; and they came into the midst of the camp in the morning watch, and smote Ammon until the heat of the day: and it came to pass that they who remained were scattered, and not two of them were left together.";
web[11] = "And it was [so] on the morrow, that Saul disposed the people in three companies; and they came into the midst of the host in the morning-watch, and slew the Ammonites until the heat of the day: and it came to pass, that they who remained were scattered, so that two of them were not left together.";
hnv[11] = "It was so on the next day, that Sha\'ul put the people in three companies; and they came into the midst of the camp in the morning watch, and struck the `Ammonim until the heat of the day: and it happened, that those who remained were scattered, so that no two of them were left together.";
vul[11] = "et factum est cum venisset dies crastinus constituit Saul populum in tres partes et ingressus est media castra in vigilia matutina et percussit Ammon usque dum incalesceret dies reliqui autem dispersi sunt ita ut non relinquerentur in eis duo pariter";
kjv[12] = "And the people said unto Samuel, Who [is] he that said, Shall Saul reign over us? bring the men, that we may put them to death.";
rsv[12] = "Then the people said to Samuel, &quot;Who is it that said, \'Shall Saul reign over us?\' Bring the men, that we may put them to death.&quot;";
asv[12] = "And the people said unto Samuel, Who is he that said, Shall Saul reign over us? bring the men, that we may put them to death.";
yng[12] = "And the people say unto Samuel, `Who is he that saith, Saul doth reign over us! give ye up the men, and we put them to death.\'";
dby[12] = "And the people said to Samuel, Who is he that said, Shall Saul reign over us? bring the men, that we may put them to death.";
web[12] = "And the people said to Samuel, Who [is] he that said, Shall Saul reign over us? bring the men, that we may put them to death.";
hnv[12] = "The people said to Shemu\'el, Who is he who said, Shall Sha\'ul reign over us? bring the men, that we may put them to death.";
vul[12] = "et ait populus ad Samuhel quis est iste qui dixit Saul non regnabit super nos date viros et interficiemus eos";
kjv[13] = "And Saul said, There shall not a man be put to death this day: for to day the LORD hath wrought salvation in Israel.";
rsv[13] = "But Saul said, &quot;Not a man shall be put to death this day, for today the LORD has wrought deliverance in Israel.&quot;";
asv[13] = "And Saul said, There shall not a man be put to death this day; for to-day Jehovah hath wrought deliverance in Israel.";
yng[13] = "And Saul saith, `There is no man put to death on this day, for to-day hath Jehovah wrought salvation in Israel.\'";
dby[13] = "But Saul said, There shall not a man be put to death this day; for to-day Jehovah has wrought deliverance in Israel.";
web[13] = "And Saul said, There shall not a man be put to death this day: for to-day the LORD hath wrought salvation in Israel.";
hnv[13] = "Sha\'ul said, There shall not a man be put to death this day; for today the LORD has worked deliverance in Yisra\'el.";
vul[13] = "et ait Saul non occidetur quisquam in die hac quia hodie fecit Dominus salutem in Israhel";
kjv[14] = "Then said Samuel to the people, Come, and let us go to Gilgal, and renew the kingdom there.";
rsv[14] = "Then Samuel said to the people, &quot;Come, let us go to Gilgal and there renew the kingdom.&quot;";
asv[14] = "Then said Samuel to the people, Come, and let us go to Gilgal, and renew the kingdom there.";
yng[14] = "And Samuel saith unto the people, `Come and we go to Gilgal, and renew the kingdom there;\'";
dby[14] = "And Samuel said to the people, Come and let us go to Gilgal, and renew the kingdom there.";

vul[14] = "dixit autem Samuhel ad populum venite et eamus in Galgala et innovemus ibi regnum";
kjv[15] = "And all the people went to Gilgal; and there they made Saul king before the LORD in Gilgal; and there they sacrificed sacrifices of peace offerings before the LORD; and there Saul and all the men of Israel rejoiced greatly.";
rsv[15] = "So all the people went to Gilgal, and there they made Saul king before the LORD in Gilgal. There they sacrificed peace offerings before the LORD, and there Saul and all the men of Israel rejoiced greatly.";
asv[15] = "And all the people went to Gilgal; and there they made Saul king before Jehovah in Gilgal; and there they offered sacrifices of peace-offerings before Jehovah; and there Saul and all the men of Israel rejoiced greatly.";
yng[15] = "and all the people go to Gilgal, and cause Saul to reign there before Jehovah in Gilgal, and sacrifice there sacrifices of peace-offerings before Jehovah, and there Saul rejoiceth -- and all the men of Israel -- very greatly.";
dby[15] = "And all the people went to Gilgal; and there they made Saul king before Jehovah in Gilgal; and there they sacrificed peace-offerings before Jehovah. And there Saul and all the men of Israel rejoiced exceedingly.";
web[15] = "And all the people went to Gilgal; and there they made Saul king before the LORD in Gilgal: and there they sacrificed sacrifices of peace-offerings before the LORD; and there Saul and all the men of Israel rejoiced greatly.";
hnv[15] = "All the people went to Gilgal; and there they made Sha\'ul king before the LORD in Gilgal; and there they offered sacrifices of peace-offerings before the LORD; and there Sha\'ul and all the men of Yisra\'el rejoiced greatly.";
vul[15] = "et perrexit omnis populus in Galgala et fecerunt ibi regem Saul coram Domino in Galgala et immolaverunt ibi victimas pacificas coram Domino et laetatus est ibi Saul et cuncti viri Israhel nimis";
