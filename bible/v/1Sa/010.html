csb[1] = "Samuel took the flask of oil, poured it out on Saul\'s head, kissed him, and said, &quot;Hasn\'t the LORD anointed you ruler over his inheritance?&quot;"
csb[2] = "&quot;Today when you leave me, you\'ll find two men at Rachel\'s Grave at Zelzah in the territory of Benjamin. They will say to you, \'The donkeys you went looking for have been found, and now your father has stopped being concerned about the donkeys and is worried about you, asking: What should I do about my son? \'&quot;"
csb[3] = "&quot;You will proceed from there until you come to the oak of Tabor. Three men going up to God at Bethel will meet you there, one bringing three goats, one bringing three loaves of bread, and one bringing a clay jar of wine.&quot;"
csb[4] = "&quot;They will ask how you are and give you two loaves of bread, which you will accept from them.&quot;"
csb[5] = "&quot;After that you will come to Gibeah of God where there are Philistine garrisons. When you arrive at the city, you will meet a group of prophets coming down from the high place prophesying. They will be preceded by harps, tambourines, flutes, and lyres.&quot;"
csb[6] = "&quot;The Spirit of the LORD will come powerfully on you, you will prophesy with them, and you will be transformed.&quot;"
csb[7] = "&quot;When these signs have happened to you, do whatever your circumstances require because God is with you.&quot;"
csb[8] = "&quot;Afterward, go ahead of me to Gilgal. I will come to you to offer burnt offerings and to sacrifice fellowship offerings. Wait seven days until I come to you and show you what to do.&quot;"
csb[9] = "When Saul turned around to leave Samuel, God changed his heart, and all the signs came about that day.&quot;"
csb[10] = "When Saul and his servant arrived at Gibeah, a group of prophets met him. Then the Spirit of God came powerfully on him, and he prophesied along with them.&quot;"
csb[11] = "Everyone who knew him previously and saw him prophesy with the prophets asked each other, &quot;What has happened to the son of Kish? Is Saul also among the prophets? &quot;"
csb[12] = "Then a man who was from there asked, &quot;And who is their father? &quot; As a result, &quot;Is Saul also among the prophets? &quot; became a popular saying.&quot;"
csb[13] = "Then Saul finished prophesying and went to the high place.&quot;"
csb[14] = "Saul\'s uncle asked him and his servant, &quot;Where did you go? &quot; &quot;To look for the donkeys,&quot; Saul answered. &quot;When we saw they weren\'t there, we went to Samuel.&quot;"
csb[15] = "&quot;Tell me,&quot; Saul\'s uncle asked, &quot;what did Samuel say to you? &quot;"
csb[16] = "Saul told him, &quot;He assured us the donkeys had been found.&quot; However, Saul did not tell him what Samuel had said about the matter of kingship.&quot;"
csb[17] = "Samuel summoned the people to the LORD at Mizpah&quot;"
csb[18] = "and said to the Israelites, &quot;This is what the LORD, the God of Israel, says: \'I brought Israel out of Egypt, and I rescued you from the power of the Egyptians and all the kingdoms that were oppressing you.\'&quot;"
csb[19] = "&quot;But today you have rejected your God, who saves you from all your troubles and afflictions. You said to him, \'You must set a king over us.\' Now therefore present yourselves before the LORD by your tribes and clans.&quot;"
csb[20] = "Samuel had all the tribes of Israel come forward, and the tribe of Benjamin was selected.&quot;"
csb[21] = "Then he had the tribe of Benjamin come forward by its clans, and the Matrite clan was selected. Finally, Saul son of Kish was selected. But when they searched for him, they could not find him.&quot;"
csb[22] = "They again inquired of the LORD, &quot;Has the man come here yet? &quot; The LORD replied, &quot;There he is, hidden among the supplies.&quot;"
csb[23] = "They ran and got him from there. When he stood among the people, he stood a head taller than anyone else.&quot;"
csb[24] = "Samuel said to all the people, &quot;Do you see the one the LORD has chosen? There is no one like him among the entire population.&quot; And all the people shouted, &quot;Long live the king! &quot;"
csb[25] = "Samuel proclaimed to the people the rights of kingship. He wrote them on a scroll, which he placed in the presence of the LORD. Then Samuel sent all the people home.&quot;"
csb[26] = "Saul also went to his home in Gibeah, and brave men whose hearts God had touched went with him.&quot;"
csb[27] = "But some wicked men said, &quot;How can this guy save us? &quot; They despised him and did not bring him a gift, but Saul said nothing.&quot;"
kjv[1] = "Then Samuel took a vial of oil, and poured [it] upon his head, and kissed him, and said, [Is it] not because the LORD hath anointed thee [to be] captain over his inheritance?";
rsv[1] = "Then Samuel took a vial of oil and poured it on his head, and kissed him and said, &quot;Has not the LORD anointed you to be prince over his people Israel? And you shall reign over the people of the LORD and you will save them from the hand of their enemies round about. And this shall be the sign to you that the LORD has anointed you to be prince over his heritage.";
asv[1] = "Then Samuel took the vial of oil, and poured it upon his head, and kissed him, and said, Is it not that Jehovah hath anointed thee to be prince over his inheritance?";
yng[1] = "And Samuel taketh the vial of the oil, and poureth on his head, and kisseth him, and saith, `Is it not because Jehovah hath appointed thee over His inheritance for leader?";
dby[1] = "Then Samuel took the vial of oil, and poured it upon his head, and kissed him, and said, Is it not because Jehovah has anointed thee prince over his inheritance?";
web[1] = "Then Samuel took a vial of oil, and poured [it] upon his head, and kissed him, and said, [Is it] not because the LORD hath anointed thee [to be] captain over his inheritance?";
hnv[1] = "Then Shemu\'el took the vial of oil, and poured it on his head, and kissed him, and said, Isn\'t it that the LORD has anointed you to be prince over his inheritance?";
vul[1] = "tulit autem Samuhel lenticulam olei et effudit super caput eius et deosculatus eum ait ecce unxit te Dominus super hereditatem suam in principem";
kjv[2] = "When thou art departed from me to day, then thou shalt find two men by Rachel\'s sepulchre in the border of Benjamin at Zelzah; and they will say unto thee, The asses which thou wentest to seek are found: and, lo, thy father hath left the care of the asses, and sorroweth for you, saying, What shall I do for my son?";
rsv[2] = "When you depart from me today you will meet two men by Rachel\'s tomb in the territory of Benjamin at Zelzah, and they will say to you, \'The asses which you went to seek are found, and now your father has ceased to care about the asses and is anxious about you, saying, &quot;What shall I do about my son?&quot;\'";
asv[2] = "When thou art departed from me to-day, then thou shalt find two men by Rachel\'s sepulchre, in the border of Benjamin at Zelzah; and they will say unto thee, The asses which thou wentest to seek are found; and, lo, thy father hath left off caring for the asses, and is anxious for you, saying, What shall I do for my son?";
yng[2] = "In thy going to-day from me -- then thou hast found two men by the grave of Rachel, in the border of Benjamin, at Zelzah, and they have said unto thee, The asses have been found which thou hast gone to seek; and lo, thy father hath left the matter of the asses, and hath sorrowed for you, saying, What do I do for my son?";
dby[2] = "When thou goest from me to-day, thou shalt meet two men by Rachel\'s sepulchre in the border of Benjamin at Zelzah; and they will say to thee, The asses are found which thou wentest to seek, and behold, thy father has dismissed the matter of the asses, and is anxious about you, saying, What shall I do for my son?";
web[2] = "When thou hast departed from me to-day, then thou shalt find two men by Rachel\'s sepulcher in the border of Benjamin at Zelzah; and they will say to thee, The asses which thou wentest to seek are found: and lo, thy father hath left the care of the asses, and sorroweth for you, saying, What shall I do for my son?";
hnv[2] = "When you are departed from me today, then you shall find two men by Rachel\'s tomb, in the border of Binyamin at Tzeltzach; and they will tell you, The donkeys which you went to seek are found; and, behold, your father has left off caring for the donkeys, and is anxious for you, saying, What shall I do for my son?";
vul[2] = "cum abieris hodie a me invenies duos viros iuxta sepulchrum Rachel in finibus Beniamin in meridie dicentque tibi inventae sunt asinae ad quas ieras perquirendas et intermissis pater tuus asinis sollicitus est pro vobis et dicit quid faciam de filio meo";
kjv[3] = "Then shalt thou go on forward from thence, and thou shalt come to the plain of Tabor, and there shall meet thee three men going up to God to Bethel, one carrying three kids, and another carrying three loaves of bread, and another carrying a bottle of wine:";
rsv[3] = "Then you shall go on from there further and come to the oak of Tabor; three men going up to God at Bethel will meet you there, one carrying three kids, another carrying three loaves of bread, and another carrying a skin of wine.";
asv[3] = "Then shalt thou go on forward from thence, and thou shalt come to the oak of Tabor; and there shall meet thee there three men going up to God to Beth-el, one carrying three kids, and another carrying three loaves of bread, and another carrying a bottle of wine:";
yng[3] = "`And thou hast passed on thence, and beyond, and hast come in unto the oak of Tabor, and found thee there have three men going up unto God to Beth-El, one bearing three kids, and one bearing three cakes of bread, and one bearing a bottle of wine,";
dby[3] = "And thou shalt go on forward from thence, and shalt come to the oak of Tabor, and there shall meet thee three men going up to God, to Bethel, one carrying three kids, and another carrying three cakes of bread, and another carrying a flask of wine.";
web[3] = "Then shalt thou go on forward from thence, and thou shalt come to the plain of Tabor, and there shall meet thee three men going up to God to Beth-el, one carrying three kids, and another carrying three loaves of bread, and another carrying a bottle of wine:";
hnv[3] = "Then shall you go on forward from there, and you shall come to the oak of Tavor; and there shall meet you there three men going up to God to Beit-El, one carrying three kids, and another carrying three loaves of bread, and another carrying a bottle of wine:";
vul[3] = "cumque abieris inde et ultra transieris et veneris ad quercum Thabor invenient te ibi tres viri ascendentes ad Deum in Bethel unus portans tres hedos et alius tres tortas panis et alius portans lagoenam vini";
kjv[4] = "And they will salute thee, and give thee two [loaves] of bread; which thou shalt receive of their hands.";
rsv[4] = "And they will greet you and give you two loaves of bread, which you shall accept from their hand.";
asv[4] = "and they will salute thee, and give thee two loaves of bread, which thou shalt receive of their hand.";

dby[4] = "And they will ask after thy welfare, and give thee two loaves, which thou shalt receive of their hands.";
web[4] = "And they will salute thee, and give thee two [loaves] of bread; which thou shalt receive from their hands.";
hnv[4] = "and they will Greet you, and give you two loaves of bread, which you shall receive of their hand.";
vul[4] = "cumque te salutaverint dabunt tibi duos panes et accipies de manu eorum";
kjv[5] = "After that thou shalt come to the hill of God, where [is] the garrison of the Philistines: and it shall come to pass, when thou art come thither to the city, that thou shalt meet a company of prophets coming down from the high place with a psaltery, and a tabret, and a pipe, and a harp, before them; and they shall prophesy:";
rsv[5] = "After that you shall come to Gib\'e-ath-elo\'him, where there is a garrison of the Philistines; and there, as you come to the city, you will meet a band of prophets coming down from the high place with harp, tambourine, flute, and lyre before them, prophesying.";
asv[5] = "After that thou shalt come to the hill of God, where is the garrison of the Philistines: and it shall come to pass, when thou art come thither to the city, that thou shalt meet a band of prophets coming down from the high place with a psaltery, and a timbrel, and a pipe, and a harp, before them; and they will be prophesying:";
yng[5] = "`Afterwards thou dost come unto the hill of God, where the garrison of the Philistines [is], and it cometh to pass, at thy coming in thither to the city, that thou hast met a band of prophets coming down from the high place, and before them psaltery, and tabret, and pipe, and harp, and they are prophesying;";
dby[5] = "After that thou shalt come to the hill of God, where are the outposts of the Philistines; and it shall come to pass, when thou comest thither, into the city, that thou shalt meet a company of prophets coming down from the high place with lute and tambour and pipe and harp before them; and they themselves prophesying.";
web[5] = "After that thou shalt come to the hill of God, where [is] the garrison of the Philistines: and it shall come to pass, when thou hast come thither to the city, that thou shalt meet a company of prophets coming down from the high place with a psaltery, and a tabret, and a pipe, and a harp before them; and they will prophesy:";
hnv[5] = "After that you shall come to the hill of God, where is the garrison of the Pelishtim: and it shall happen, when you are come there to the city, that you shall meet a band of prophets coming down from the high place with a psaltery, and a tambourine, and a pipe, and a harp, before them; and they will be prophesying:";
vul[5] = "post haec venies in collem Domini ubi est statio Philisthinorum et cum ingressus fueris ibi urbem obviam habebis gregem prophetarum descendentium de excelso et ante eos psalterium et tympanum et tibiam et citharam ipsosque prophetantes";
kjv[6] = "And the Spirit of the LORD will come upon thee, and thou shalt prophesy with them, and shalt be turned into another man.";

asv[6] = "and the Spirit of Jehovah will come mightily upon thee, and thou shalt prophesy with them, and shalt be turned into another man.";
yng[6] = "and prospered over thee hath the Spirit of Jehovah, and thou hast prophesied with them, and hast been turned to another man;";
dby[6] = "And the Spirit of Jehovah will come upon thee, and thou shalt prophesy with them, and shalt be turned into another man.";
web[6] = "And the Spirit of the LORD will come upon thee, and thou shalt prophesy with them, and shalt be turned into another man.";
hnv[6] = " and the Spirit of the LORD will come mightily on you, and you shall prophesy with them, and shall be turned into another man.";
vul[6] = "et insiliet in te spiritus Domini et prophetabis cum eis et mutaberis in virum alium";
kjv[7] = "And let it be, when these signs are come unto thee, [that] thou do as occasion serve thee; for God [is] with thee.";
rsv[7] = "Now when these signs meet you, do whatever your hand finds to do, for God is with you.";

yng[7] = "and it hath been, when these signs come to thee -- do for thyself as thy hand findeth, for God [is] with thee.";
dby[7] = "And it shall be, when these signs shall come to thee, thou shalt do as thy hand shall find; for God is with thee.";
web[7] = "And let it be, when these signs have come to thee, [that] thou do as occasion shall serve thee; for God [is] with thee.";
hnv[7] = "Let it be, when these signs are come to you, that you do as occasion shall serve you; for God is with you.";

kjv[8] = "And thou shalt go down before me to Gilgal; and, behold, I will come down unto thee, to offer burnt offerings, [and] to sacrifice sacrifices of peace offerings: seven days shalt thou tarry, till I come to thee, and shew thee what thou shalt do.";
rsv[8] = "And you shall go down before me to Gilgal; and behold, I am coming to you to offer burnt offerings and to sacrifice peace offerings. Seven days you shall wait, until I come to you and show you what you shall do.&quot;";
asv[8] = "And thou shalt go down before me to Gilgal; and, behold, I will come down unto thee, to offer burnt-offerings, and to sacrifice sacrifices of peace-offerings: seven days shalt thou tarry, till I come unto thee, and show thee what thou shalt do.";
yng[8] = "`And thou hast gone down before me to Gilgal, and lo, I am going down unto thee, to cause to ascend burnt-offerings, to sacrifice sacrifices of peace-offerings; seven days thou dost wait till my coming in unto thee, and I have made known to thee that which thou dost do.\'";
dby[8] = "And thou shalt go down before me to Gilgal; and behold, I will come down to thee, to offer up burnt-offerings, [and] to sacrifice sacrifices of peace-offerings: seven days shalt thou wait, until I come to thee and inform thee what thou shalt do.";
web[8] = "And thou shalt go down before me to Gilgal; and behold, I will come down to thee, to offer burnt-offerings, [and] to sacrifice sacrifices of peace-offerings: seven days shalt thou tarry, till I come to thee, and show thee what thou shalt do.";
hnv[8] = "You shall go down before me to Gilgal; and, behold, I will come down to you, to offer burnt offerings, and to sacrifice sacrifices of peace-offerings: seven days shall you wait, until I come to you, and show you what you shall do.";

rsv[9] = "When he turned his back to leave Samuel, God gave him another heart; and all these signs came to pass that day.";
asv[9] = "And it was so, that, when he had turned his back to go from Samuel, God gave him another heart: and all those signs came to pass that day.";
yng[9] = "And it hath been, at his turning his shoulder to go from Samuel, that God turneth to him another heart, and all these signs come on that day,";
dby[9] = "And it was [so] that when he turned his back to go away from Samuel, God gave him another heart; and all those signs came to pass that day.";

hnv[9] = "It was so, that when he had turned his back to go from Shemu\'el, God gave him another heart: and all those signs happened that day.";

dby[11] = "And it came to pass, when all that knew him before saw that, behold, he prophesied among the prophets, then the people said one to another, What is this that has happened to the son of Kish? Is Saul also among the prophets?";

kjv[16] = "And Saul said unto his uncle, He told us plainly that the asses were found. But of the matter of the kingdom, whereof Samuel spake, he told him not.";
rsv[16] = "And Saul said to his uncle, &quot;He told us plainly that the asses had been found.&quot; But about the matter of the kingdom, of which Samuel had spoken, he did not tell him anything.";

yng[16] = "And Saul saith unto his uncle, `He certainly declared to us that the asses were found;\' and of the matter of the kingdom he hath not declared to him that which Samuel said.";
dby[16] = "And Saul said to his uncle, He told us for certain that the asses were found. But of the matter of the kingdom, of which Samuel had spoken, he told him not.";
web[16] = "And Saul said to his uncle, He told us plainly that the asses were found. But of the matter of the kingdom, of which Samuel spoke, he told him not.";
hnv[16] = "Sha\'ul said to his uncle, He told us plainly that the donkeys were found. But concerning the matter of the kingdom, whereof Shemu\'el spoke, he didn\'t tell him.";
vul[16] = "et ait Saul ad patruum suum indicavit nobis quia inventae essent asinae de sermone autem regni non indicavit ei quem locutus illi fuerat Samuhel";
kjv[17] = "And Samuel called the people together unto the LORD to Mizpeh;";
rsv[17] = "Now Samuel called the people together to the LORD at Mizpah;";
asv[17] = "And Samuel called the people together unto Jehovah to Mizpah;";
yng[17] = "And Samuel calleth the people unto Jehovah to Mizpeh,";
dby[17] = "And Samuel called the people together to Jehovah to Mizpah.";
web[17] = "And Samuel called the people together to the LORD to Mizpeh;";
hnv[17] = " Shemu\'el called the people together to the LORD to Mitzpah;";
vul[17] = "et convocavit Samuhel populum ad Dominum in Maspha";
kjv[18] = "And said unto the children of Israel, Thus saith the LORD God of Israel, I brought up Israel out of Egypt, and delivered you out of the hand of the Egyptians, and out of the hand of all kingdoms, [and] of them that oppressed you:";
rsv[18] = "and he said to the people of Israel, &quot;Thus says the LORD, the God of Israel, \'I brought up Israel out of Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.\'";
asv[18] = "and he said unto the children of Israel, Thus saith Jehovah, the God of Israel, I brought up Israel out of Egypt, and I delivered you out of the hand of the Egyptians, and out of the hand of all the kingdoms that oppressed you:";
yng[18] = "and saith unto the sons of Israel, `Thus said Jehovah, God of Israel, I have brought up Israel out of Egypt, and I deliver you out of the hand of the Egyptians, and out of the hand of all the kingdoms who are oppressing you;";
dby[18] = "And he said to the children of Israel, Thus saith Jehovah, the God of Israel, *I* brought up Israel out of Egypt, and delivered you out of the hand of the Egyptians, and out of the hand of all the kingdoms that oppressed you;";
web[18] = "And said to the children of Israel, Thus saith the LORD God of Israel, I brought Israel out of Egypt, and delivered you out of the hand of the Egyptians, and out of the hand of all kingdoms, [and] of them that oppressed you:";
hnv[18] = "and he said to the children of Yisra\'el, Thus says the LORD, the God of Yisra\'el, I brought up Yisra\'el out of Mitzrayim, and I delivered you out of the hand of the Mitzrim, and out of the hand of all the kingdoms that oppressed you:";
vul[18] = "et ait ad filios Israhel haec dicit Dominus Deus Israhel ego eduxi Israhel de Aegypto et erui vos de manu Aegyptiorum et de manu omnium regum qui adfligebant vos";
kjv[19] = "And ye have this day rejected your God, who himself saved you out of all your adversities and your tribulations; and ye have said unto him, [Nay], but set a king over us. Now therefore present yourselves before the LORD by your tribes, and by your thousands.";
rsv[19] = "But you have this day rejected your God, who saves you from all your calamities and your distresses; and you have said, \'No! but set a king over us.\' Now therefore present yourselves before the LORD by your tribes and by your thousands.&quot;";
asv[19] = "but ye have this day rejected your God, who himself saveth you out of all your calamities and your distresses; and ye have said unto him, [Nay], but set a king over us. Now therefore present yourselves before Jehovah by your tribes, and by your thousands.";
yng[19] = "and ye to-day have rejected your God, who [is] Himself your saviour out of all your evils and your distresses, and ye say, `Nay, but -- a king thou dost set over us; and now, station yourselves before Jehovah, by your tribes, and by your thousands.\'";
dby[19] = "but *ye* have this day rejected your God, who himself saved you out of all your adversities and your troubles, and have said unto him, [Nay,] but a king shalt thou set over us. Now therefore present yourselves before Jehovah by your tribes, and by your thousands.";
web[19] = "And ye have this day rejected your God, who himself saved you out of all your adversities, and your tribulations; and ye have said to him, [No], but set a king over us. Now therefore present yourselves before the LORD by your tribes, and by your thousands.";
hnv[19] = "but you have this day rejected your God, who himself saves you out of all your calamities and your distresses; and you have said to him, [No], but set a king over us. Now therefore present yourselves before the LORD by your tribes, and by your thousands.";
vul[19] = "vos autem hodie proiecistis Deum vestrum qui solus salvavit vos de universis malis et tribulationibus vestris et dixistis nequaquam sed regem constitue super nos nunc ergo state coram Domino per tribus vestras et per familias";
kjv[20] = "And when Samuel had caused all the tribes of Israel to come near, the tribe of Benjamin was taken.";
rsv[20] = "Then Samuel brought all the tribes of Israel near, and the tribe of Benjamin was taken by lot.";
asv[20] = "So Samuel brought all the tribes of Israel near, and the tribe of Benjamin was taken.";
yng[20] = "And Samuel bringeth near the whole tribes of Israel, and the tribe of Benjamin is captured,";
dby[20] = "And Samuel caused all the tribes of Israel to come near, and the tribe of Benjamin was taken.";
web[20] = "And when Samuel had caused all the tribes of Israel to come near, the tribe of Benjamin was taken.";
hnv[20] = "So Shemu\'el brought all the tribes of Yisra\'el near, and the tribe of Binyamin was taken.";
vul[20] = "et adplicuit Samuhel omnes tribus Israhel et cecidit sors tribus Beniamin";
kjv[21] = "When he had caused the tribe of Benjamin to come near by their families, the family of Matri was taken, and Saul the son of Kish was taken: and when they sought him, he could not be found.";
rsv[21] = "He brought the tribe of Benjamin near by its families, and the family of the Matrites was taken by lot; finally he brought the family of the Matrites near man by man, and Saul the son of Kish was taken by lot. But when they sought him, he could not be found.";
asv[21] = "And he brought the tribe of Benjamin near by their families; and the family of the Matrites was taken; and Saul the son of Kish was taken: but when they sought him, he could not be found.";
yng[21] = "and he bringeth near the tribe of Benjamin by its families, and the family of Matri is captured, and Saul son of Kish is captured, and they seek him, and he hath not been found.";
dby[21] = "And he caused the tribe of Benjamin to come near by their families, and the family of Matri was taken; and Saul the son of Kish was taken. And they sought him, but he was not to be found.";
web[21] = "When he had caused the tribe of Benjamin to come near by their families, the family of Matri was taken, and Saul the son of Kish was taken: and when they sought him, he could not be found.";
hnv[21] = "He brought the tribe of Binyamin near by their families; and the family of the Matri was taken; and Sha\'ul the son of Kish was taken: but when they sought him, he could not be found.";
vul[21] = "et adplicuit tribum Beniamin et cognationes eius et cecidit cognatio Metri et pervenit usque ad Saul filium Cis quaesierunt ergo eum et non est inventus";
kjv[22] = "Therefore they enquired of the LORD further, if the man should yet come thither. And the LORD answered, Behold, he hath hid himself among the stuff.";
rsv[22] = "So they inquired again of the LORD, &quot;Did the man come hither?&quot; and the LORD said, &quot;Behold, he has hidden himself among the baggage.&quot;";
asv[22] = "Therefore they asked of Jehovah further, Is there yet a man to come hither? And Jehovah answered, Behold, he hath hid himself among the baggage.";
yng[22] = "And they ask again at Jehovah, `Hath the man yet come hither?\' and Jehovah saith, `Lo, he hath been hidden near the vessels.\'";
dby[22] = "Therefore they inquired of Jehovah further, Will the man yet come hither? And Jehovah answered, Behold, he hath hid himself among the baggage.";
web[22] = "Therefore they inquired of the LORD further, if the man would yet come thither. And the LORD answered, Behold, he hath hid himself among the stuff.";
hnv[22] = "Therefore they asked of the LORD further, Is there yet a man to come here? the LORD answered, Behold, he has hid himself among the baggage.";
vul[22] = "et consuluerunt post haec Dominum utrumnam venturus esset illuc responditque Dominus ecce absconditus est domi";
kjv[23] = "And they ran and fetched him thence: and when he stood among the people, he was higher than any of the people from his shoulders and upward.";
rsv[23] = "Then they ran and fetched him from there; and when he stood among the people, he was taller than any of the people from his shoulders upward.";
asv[23] = "And they ran and fetched him thence; and when he stood among the people, he was higher than any of the people from his shoulders and upward.";
yng[23] = "And they run and bring him thence, and he stationed himself in the midst of the people, and he is higher than any of the people from his shoulder and upward.";
dby[23] = "And they ran and fetched him thence; and when he stood among the people, he was higher than any of the people from his shoulders and upward.";
web[23] = "And they ran and brought him thence: and when he stood among the people, he was higher than any of the people from his shoulders and upward.";
hnv[23] = "They ran and fetched him there; and when he stood among the people, he was higher than any of the people from his shoulders and upward.";
vul[23] = "cucurrerunt itaque et tulerunt eum inde stetitque in medio populi et altior fuit universo populo ab umero et sursum";
kjv[24] = "And Samuel said to all the people, See ye him whom the LORD hath chosen, that [there is] none like him among all the people? And all the people shouted, and said, God save the king.";
rsv[24] = "And Samuel said to all the people, &quot;Do you see him whom the LORD has chosen? There is none like him among all the people.&quot; And all the people shouted, &quot;Long live the king!&quot;";
asv[24] = "And Samuel said to all the people, See ye him whom Jehovah hath chosen, that there is none like him among all the people? And all the people shouted, and said, [Long] live the king.";
yng[24] = "And Samuel saith unto all the people, `Have ye seen him on whom Jehovah hath fixed, for there is none like him among all the people?\' And all the people shout, and say, `Let the king live!\'";
dby[24] = "And Samuel said to all the people, See ye him whom Jehovah has chosen, that there is none like him among all the people? And all the people shouted and said, May the king live.";
web[24] = "And Samuel said to all the people, See ye him whom the LORD hath chosen, that [there is] none like him among all the people? And all the people shouted, and said, God save the king.";
hnv[24] = "Shemu\'el said to all the people, &quot;You see him whom the LORD has chosen, that there is none like him among all the people?&quot; All the people shouted, and said, [Long] live the king.";
vul[24] = "et ait Samuhel ad omnem populum certe videtis quem elegit Dominus quoniam non sit similis ei in omni populo et clamavit cunctus populus et ait vivat rex";
kjv[25] = "Then Samuel told the people the manner of the kingdom, and wrote [it] in a book, and laid [it] up before the LORD. And Samuel sent all the people away, every man to his house.";
rsv[25] = "Then Samuel told the people the rights and duties of the kingship; and he wrote them in a book and laid it up before the LORD. Then Samuel sent all the people away, each one to his home.";
asv[25] = "Then Samuel told the people the manner of the kingdom, and wrote it in a book, and laid it up before Jehovah. And Samuel sent all the people away, every man to his house.";
yng[25] = "And Samuel speaketh unto the people the right of the kingdom, and writeth in a book, and placeth before Jehovah; and Samuel sendeth all the people away, each to his house.";
dby[25] = "And Samuel told the people the right of the kingdom, and wrote it in the book, and laid it before Jehovah. And Samuel sent all the people away, every man to his house.";
web[25] = "Then Samuel told the people the manner of the kingdom, and wrote [it] in a book, and laid [it] up before the LORD. And Samuel sent all the people away, every man to his house.";
hnv[25] = "Then Shemu\'el told the people the manner of the kingdom, and wrote it in a book, and laid it up before the LORD. Shemu\'el sent all the people away, every man to his house.";
vul[25] = "locutus est autem Samuhel ad populum legem regni et scripsit in libro et reposuit coram Domino et dimisit Samuhel omnem populum singulos in domum suam";
kjv[26] = "And Saul also went home to Gibeah; and there went with him a band of men, whose hearts God had touched.";
rsv[26] = "Saul also went to his home at Gib\'e-ah, and with him went men of valor whose hearts God had touched.";
asv[26] = "And Saul also went to his house to Gibeah; and there went with him the host, whose hearts God had touched.";
yng[26] = "And also Saul hath gone to his house, to Gibeah, and the force go with him whose heart God hath touched;";
dby[26] = "And Saul also went home to Gibeah; and with him went the band, whose hearts God had touched.";
web[26] = "And Saul also went home to Gibeah; and there went with him a band of men, whose hearts God had touched.";
hnv[26] = "Sha\'ul also went to his house to Gevah; and there went with him the host, whose hearts God had touched.";
vul[26] = "sed et Saul abiit in domum suam in Gabaath et abiit cum eo pars exercitus quorum tetigerat Deus corda";
kjv[27] = "But the children of Belial said, How shall this man save us? And they despised him, and brought him no presents. But he held his peace.";
rsv[27] = "But some worthless fellows said, &quot;How can this man save us?&quot; And they despised him, and brought him no present. But he held his peace.";
asv[27] = "But certain worthless fellows said, How shall this man save us? And they despised him, and brought him no present. But he held his peace.";
yng[27] = "and the sons of worthlessness have said, `What! this one doth save us!\' and they despise him, and have not brought to him a present; and he is as one deaf.";
dby[27] = "But the children of Belial said, How should this man save us? And they despised him, and brought him no gifts. But he was as one deaf.";
web[27] = "But the children of Belial said, How shall this man save us? And they despised him, and brought him no presents. But he held his peace.";
hnv[27] = "But certain worthless fellows said, How shall this man save us? They despised him, and brought him no present. But he held his shalom.";
vul[27] = "filii vero Belial dixerunt num salvare nos poterit iste et despexerunt eum et non adtulerunt ei munera ille vero dissimulabat se audire";
