csb[1] = "There was a prominent man of Benjamin named Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite.&quot;"
csb[2] = "He had a son named Saul, an impressive young man. There was no one more impressive among the Israelites than he. He stood a head taller than anyone else.&quot;"
csb[3] = "One day the donkeys of Saul\'s father Kish wandered off. Kish said to his son Saul, &quot;Take one of the servants with you and go look for the donkeys.&quot;"
csb[4] = "Saul and his servant went through the hill country of Ephraim and then through the region of Shalishah, but they didn\'t find them. They went through the region of Shaalim -- nothing. Then they went through the Benjaminite region but still didn\'t find them.&quot;"
csb[5] = "When they came to the land of Zuph, Saul said to the servant who was with him, &quot;Come on, let\'s go back, or my father will stop worrying about the donkeys and start worrying about us.&quot;"
csb[6] = "&quot;Look,&quot; the servant said, &quot;there\'s a man of God in this city who is highly respected; everything he says is sure to come true. Let\'s go there now. Maybe he\'ll tell us which way we should go.&quot;"
csb[7] = "&quot;Suppose we do go,&quot; Saul said to his servant, &quot;what do we take the man? The food from our packs is gone, and there\'s no gift to take to the man of God. What do we have? &quot;"
csb[8] = "The servant answered Saul: &quot;Here, I have a little silver. I\'ll give it to the man of God, and he will tell us which way we should go.&quot;"
csb[9] = "Formerly in Israel, a man who was going to inquire of God would say, &quot;Come, let\'s go to the seer,&quot; for the prophet of today was formerly called the seer.&quot;"
csb[10] = "&quot;Good,&quot; Saul replied to his servant. &quot;Come on, let\'s go.&quot; So they went to the city where the man of God was.&quot;"
csb[11] = "As they were climbing the hill to the city, they found some young women coming out to draw water and asked, &quot;Is the seer here? &quot;"
csb[12] = "The women answered, &quot;Yes, he is ahead of you. Hurry, he just now entered the city, because there\'s a sacrifice for the people at the high place today.&quot;"
csb[13] = "&quot;As soon as you enter the city, you will find him before he goes to the high place to eat. The people won\'t eat until he comes because he must bless the sacrifice; after that, the guests can eat. Go up immediately -- you can find him now.&quot;"
csb[14] = "So they went up toward the city. Saul and his servant were entering the city when they saw Samuel coming toward them on his way to the high place.&quot;"
csb[15] = "Now the day before Saul\'s arrival, the LORD had informed Samuel,&quot;"
csb[16] = "&quot;At this time tomorrow I will send you a man from the land of Benjamin. Anoint him ruler over my people Israel. He will save them from the Philistines because I have seen the affliction of my people, for their cry has come to me.&quot;"
csb[17] = "When Samuel saw Saul, the LORD told him, &quot;Here is the man I told you about; he will govern my people.&quot;"
csb[18] = "Saul approached Samuel in the city gate and asked, &quot;Would you please tell me where the seer\'s house is? &quot;"
csb[19] = "&quot;I am the seer,&quot; Samuel answered. &quot;Go up ahead of me to the high place and eat with me today. When I send you off in the morning, I\'ll tell you everything that\'s in your heart.&quot;"
csb[20] = "&quot;As for the donkeys that wandered away from you three days ago, don\'t worry about them because they\'ve been found. And who does all Israel desire but you and all your father\'s family? &quot;"
csb[21] = "Saul responded, &quot;Am I not a Benjaminite from the smallest of Israel\'s tribes and isn\'t my clan the least important of all the clans of the Benjaminite tribe? So why have you said something like this to me? &quot;"
csb[22] = "Samuel took Saul and his servant, brought them to the banquet hall, and gave them a place at the head of the thirty or so men who had been invited.&quot;"
csb[23] = "Then Samuel said to the cook, &quot;Get the portion of meat that I gave you and told you to set aside.&quot;"
csb[24] = "The cook picked up the thigh and what was attached to it and set it before Saul. Then Samuel said, &quot;Notice that the reserved piece is set before you. Eat it because it was saved for you for this solemn event at the time I said, \'I\'ve invited the people.\' &quot; So Saul ate with Samuel that day.&quot;"
csb[25] = "Afterward, they went down from the high place to the city, and Samuel spoke with Saul on the roof.&quot;"
csb[26] = "They got up early, and just before dawn, Samuel called to Saul on the roof, &quot;Get up, and I\'ll send you on your way! &quot; Saul got up, and both he and Samuel went outside.&quot;"
csb[27] = "As they were going down to the edge of the city, Samuel said to Saul, &quot;Tell the servant to go on ahead of us, but you stay for a while, and I\'ll reveal the word of God to you.&quot; So the servant went on.&quot;"
kjv[1] = "Now there was a man of Benjamin, whose name [was] Kish, the son of Abiel, the son of Zeror, the son of Bechorath, the son of Aphiah, a Benjamite, a mighty man of power.";
kjv[2] = "And he had a son, whose name [was] Saul, a choice young man, and a goodly: and [there was] not among the children of Israel a goodlier person than he: from his shoulders and upward [he was] higher than any of the people.";
kjv[3] = "And the asses of Kish Saul\'s father were lost. And Kish said to Saul his son, Take now one of the servants with thee, and arise, go seek the asses.";
kjv[4] = "And he passed through mount Ephraim, and passed through the land of Shalisha, but they found [them] not: then they passed through the land of Shalim, and [there they were] not: and he passed through the land of the Benjamites, but they found [them] not.";
kjv[5] = "[And] when they were come to the land of Zuph, Saul said to his servant that [was] with him, Come, and let us return; lest my father leave [caring] for the asses, and take thought for us.";
kjv[6] = "And he said unto him, Behold now, [there is] in this city a man of God, and [he is] an honourable man; all that he saith cometh surely to pass: now let us go thither; peradventure he can shew us our way that we should go.";
kjv[7] = "Then said Saul to his servant, But, behold, [if] we go, what shall we bring the man? for the bread is spent in our vessels, and [there is] not a present to bring to the man of God: what have we?";
kjv[8] = "And the servant answered Saul again, and said, Behold, I have here at hand the fourth part of a shekel of silver: [that] will I give to the man of God, to tell us our way.";
kjv[9] = "(Beforetime in Israel, when a man went to enquire of God, thus he spake, Come, and let us go to the seer: for [he that is] now [called] a Prophet was beforetime called a Seer.)";
kjv[10] = "Then said Saul to his servant, Well said; come, let us go. So they went unto the city where the man of God [was].";
kjv[11] = "[And] as they went up the hill to the city, they found young maidens going out to draw water, and said unto them, Is the seer here?";
kjv[12] = "And they answered them, and said, He is; behold, [he is] before you: make haste now, for he came to day to the city; for [there is] a sacrifice of the people to day in the high place:";
kjv[13] = "As soon as ye be come into the city, ye shall straightway find him, before he go up to the high place to eat: for the people will not eat until he come, because he doth bless the sacrifice; [and] afterwards they eat that be bidden. Now therefore get you up; for about this time ye shall find him.";
kjv[14] = "And they went up into the city: [and] when they were come into the city, behold, Samuel came out against them, for to go up to the high place.";
kjv[15] = "Now the LORD had told Samuel in his ear a day before Saul came, saying,";
kjv[16] = "To morrow about this time I will send thee a man out of the land of Benjamin, and thou shalt anoint him [to be] captain over my people Israel, that he may save my people out of the hand of the Philistines: for I have looked upon my people, because their cry is come unto me.";
kjv[17] = "And when Samuel saw Saul, the LORD said unto him, Behold the man whom I spake to thee of! this same shall reign over my people.";
kjv[18] = "Then Saul drew near to Samuel in the gate, and said, Tell me, I pray thee, where the seer\'s house [is].";
kjv[19] = "And Samuel answered Saul, and said, I [am] the seer: go up before me unto the high place; for ye shall eat with me to day, and to morrow I will let thee go, and will tell thee all that [is] in thine heart.";
kjv[20] = "And as for thine asses that were lost three days ago, set not thy mind on them; for they are found. And on whom [is] all the desire of Israel? [Is it] not on thee, and on all thy father\'s house?";
kjv[21] = "And Saul answered and said, [Am] not I a Benjamite, of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin? wherefore then speakest thou so to me?";
kjv[22] = "And Samuel took Saul and his servant, and brought them into the parlour, and made them sit in the chiefest place among them that were bidden, which [were] about thirty persons.";
kjv[23] = "And Samuel said unto the cook, Bring the portion which I gave thee, of which I said unto thee, Set it by thee.";
kjv[24] = "And the cook took up the shoulder, and [that] which [was] upon it, and set [it] before Saul. And [Samuel] said, Behold that which is left! set [it] before thee, [and] eat: for unto this time hath it been kept for thee since I said, I have invited the people. So Saul did eat with Samuel that day.";
kjv[25] = "And when they were come down from the high place into the city, [Samuel] communed with Saul upon the top of the house.";
kjv[26] = "And they arose early: and it came to pass about the spring of the day, that Samuel called Saul to the top of the house, saying, Up, that I may send thee away. And Saul arose, and they went out both of them, he and Samuel, abroad.";
kjv[27] = "[And] as they were going down to the end of the city, Samuel said to Saul, Bid the servant pass on before us, (and he passed on,) but stand thou still a while, that I may shew thee the word of God.";

rsv[4] = "And they passed through the hill country of E\'phraim and passed through the land of Shal\'ishah, but they did not find them. And they passed through the land of Sha\'alim, but they were not there. Then they passed through the land of Benjamin, but did not find them.";

yng[4] = "And he passeth over through the hill-country of Ephraim, and passeth over through the land of Shalisha, and they have not found; and they pass over through the land of Shaalim, and they are not; and he passeth over through the land of Benjamin, and they have not found.";

yng[6] = "And he saith to him, `Lo, I pray thee, a man of God [is] in this city, and the man is honoured; all that he speaketh doth certainly come; now, we go there, it may be he doth declare to us our way on which we have gone.\'";

vul[12] = "quae respondentes dixerunt illis hic est ecce ante te festina nunc hodie enim venit in civitate quia sacrificium est hodie populo in excelso";
rsv[13] = "As soon as you enter the city, you will find him, before he goes up to the high place to eat; for the people will not eat till he comes, since he must bless the sacrifice; afterward those eat who are invited. Now go up, for you will meet him immediately.&quot;";
asv[13] = "as soon as ye are come into the city, ye shall straightway find him, before he goeth up to the high place to eat; for the people will not eat until he come, because he doth bless the sacrifice; [and] afterwards they eat that are bidden. Now therefore get you up; for at this time ye shall find him.";
yng[13] = "At your going in to the city so ye do find him, before he doth go up in to the high place to eat; for the people do not eat till his coming, for he doth bless the sacrifice; afterwards they eat, who are called, and now, go up, for at this time ye find him.\'";
dby[13] = "As soon as ye come into the city, ye shall straightway find him, before he goes up to the high place to eat; for the people eat not until he has come, because he blesses the sacrifice; afterwards they eat that are invited. And now go up; for this very day shall ye find him.";
web[13] = "As soon as ye shall enter the city, ye will straightway find him, before he goeth up to the high place to eat: for the people will not eat until he cometh, because he doth bless the sacrifice; [and] afterwards they eat that are invited. Now therefore go up: for about this time ye will find him.";
hnv[13] = "as soon as you are come into the city, you shall immediately find him, before he goes up to the high place to eat; for the people will not eat until he come, because he does bless the sacrifice; [and] afterwards they eat who are invited. Now therefore get you up; for at this time you shall find him.";
vul[13] = "ingredientes urbem statim invenietis eum antequam ascendat excelsum ad vescendum neque enim comesurus est populus donec ille veniat quia ipse benedicit hostiae et deinceps comedunt qui vocati sunt nunc ergo conscendite quia hodie repperietis eum";
rsv[14] = "So they went up to the city. As they were entering the city, they saw Samuel coming out toward them on his way up to the high place.";
asv[14] = "And they went up to the city; [and] as they came within the city, behold, Samuel came out toward them, to go up to the high place.";
yng[14] = "And they go up in to the city; they are coming in to the midst of the city, and lo, Samuel is coming out to meet them, to go up to the high place;";
dby[14] = "And they went up into the city. As they were coming into the midst of the city, behold, Samuel was coming out towards them, to go up to the high place.";
web[14] = "And they went up into the city: [and] when they had come into the city, behold, Samuel came out meeting them, to go up to the high place.";
hnv[14] = "They went up to the city; [and] as they came within the city, behold, Shemu\'el came out toward them, to go up to the high place.";
vul[14] = "et ascenderunt in civitatem cumque illi ambularent in medio urbis apparuit Samuhel egrediens obviam eis ut ascenderet in excelsum";
rsv[15] = "Now the day before Saul came, the LORD had revealed to Samuel:";
asv[15] = "Now Jehovah had revealed unto Samuel a day before Saul came, saying,";
yng[15] = "and Jehovah had uncovered the ear of Samuel one day before the coming of Saul, saying,";
dby[15] = "Now Jehovah had apprised Samuel one day before Saul came, saying,";
web[15] = "Now the LORD had told Samuel in his ear a day before Saul came, saying,";
hnv[15] = "Now the LORD had revealed to Shemu\'el a day before Sha\'ul came, saying,";
vul[15] = "Dominus autem revelaverat auriculam Samuhel ante unam diem quam veniret Saul dicens";
rsv[16] = "&quot;Tomorrow about this time I will send to you a man from the land of Benjamin, and you shall anoint him to be prince over my people Israel. He shall save my people from the hand of the Philistines; for I have seen the affliction of my people, because their cry has come to me.&quot;";
asv[16] = "To-morrow about this time I will send thee a man out of the land of Benjamin, and thou shalt anoint him to be prince over my people Israel; and he shall save my people out of the hand of the Philistines: for I have looked upon my people, because their cry is come unto me.";
yng[16] = "`At this time tomorrow, I send unto thee a man out of the land of Benjamin -- and thou hast anointed him for leader over My people Israel, and he hath saved My people out of the hand of the Philistines; for I have seen My people, for its cry hath come in unto Me.\'";
dby[16] = "To-morrow about this time I will send thee a man out of the land of Benjamin, and thou shalt anoint him prince over my people Israel; and he will save my people out of the hand of the Philistines; for I have looked upon my people, because their cry is come unto me.";
web[16] = "To-morrow about this time I will send thee a man out of the land of Benjamin, and thou shalt anoint him [to be] captain over my people Israel, that he may save my people from the hand of the Philistines: for I have looked upon my people, because their cry has come to me.";
hnv[16] = "Tomorrow about this time I will send you a man out of the land of Binyamin, and you shall anoint him to be prince over my people Yisra\'el; and he shall save my people out of the hand of the Pelishtim: for I have looked on my people, because their cry is come to me.";
vul[16] = "hac ipsa quae nunc est hora cras mittam ad te virum de terra Beniamin et ungues eum ducem super populum meum Israhel et salvabit populum meum de manu Philisthinorum quia respexi populum meum venit enim clamor eorum ad me";
rsv[17] = "When Samuel saw Saul, the LORD told him, &quot;Here is the man of whom I spoke to you! He it is who shall rule over my people.&quot;";
asv[17] = "And when Samuel saw Saul, Jehovah said unto him, Behold, the man of whom I spake to thee! this same shall have authority over my people.";
yng[17] = "When Samuel hath seen Saul, then hath Jehovah answered him, `Lo, the man of whom I have spoken unto thee; this [one] doth restrain My people.\'";
dby[17] = "And as Samuel saw Saul, Jehovah answered him, Behold the man of whom I spoke to thee! this man shall rule over my people.";
web[17] = "And when Samuel saw Saul, the LORD said to him, Behold the man of whom I spoke to thee! this same shall reign over my people.";
hnv[17] = "When Shemu\'el saw Sha\'ul, the LORD said to him, Behold, the man of whom I spoke to you! this same shall have authority over my people.";
vul[17] = "cumque aspexisset Samuhel Saulem Dominus ait ei ecce vir quem dixeram tibi iste dominabitur populo meo";
rsv[18] = "Then Saul approached Samuel in the gate, and said, &quot;Tell me where is the house of the seer?&quot;";
asv[18] = "Then Saul drew near to Samuel in the gate, and said, Tell me, I pray thee, where the seer\'s house is.";
yng[18] = "And Saul draweth nigh to Samuel in the midst of the gate, and saith, `Declare, I pray thee, to me, where [is] this -- the seer\'s house?\'";
dby[18] = "And Saul drew near to Samuel in the midst of the gate, and said, Tell me, I pray thee, where the seer\'s house is.";
web[18] = "Then Saul drew near to Samuel in the gate, and said, Tell me, I pray thee, where the seer\'s house [is].";
hnv[18] = "Then Sha\'ul drew near to Shemu\'el in the gate, and said, Tell me, Please, where the seer\'s house is.";
vul[18] = "accessit autem Saul ad Samuhelem in medio portae et ait indica oro mihi ubi est domus videntis";
rsv[19] = "Samuel answered Saul, &quot;I am the seer; go up before me to the high place, for today you shall eat with me, and in the morning I will let you go and will tell you all that is on your mind.";
asv[19] = "And Samuel answered Saul, and said, I am the seer; go up before me unto the high place, for ye shall eat with me to-day: and in the morning I will let thee go, and will tell thee all that is in thy heart.";
yng[19] = "And Samuel answereth Saul and saith, `I [am] the seer; go up before me into the high place, and ye have eaten with me to-day, and I have sent thee away in the morning, and all that [is] in thy heart I declare to thee.";
dby[19] = "And Samuel answered Saul and said, I am the seer: go up before me to the high place, and ye shall eat with me to-day; and to-morrow I will let thee go, and will tell thee all that is in thy heart.";
web[19] = "And Samuel answered Saul, and said, I [am] the seer: go up before me to the high place; for ye shall eat with me to-day, and to-morrow I will let thee go, and will tell thee all that [is] in thy heart.";
hnv[19] = "Shemu\'el answered Sha\'ul, and said, I am the seer; go up before me to the high place, for you shall eat with me today: and in the morning I will let you go, and will tell you all that is in your heart.";
vul[19] = "et respondit Samuhel Sauli dicens ego sum videns ascende ante me in excelsum ut comedatis mecum hodie et dimittam te mane et omnia quae sunt in corde tuo indicabo tibi";
rsv[20] = "As for your asses that were lost three days ago, do not set your mind on them, for they have been found. And for whom is all that is desirable in Israel? Is it not for you and for all your father\'s house?&quot;";
asv[20] = "And as for thine asses that were lost three days ago, set not thy mind on them; for they are found. And for whom is all that is desirable in Israel? Is it not for thee, and for all thy father\'s house?";
yng[20] = "As to the asses which are lost to thee this day three days, set not thy heart to them, for they have been found; and to whom [is] all the desire of Israel?\' is it not to thee and to all thy father\'s house?\'";
dby[20] = "And as for the asses that thou didst lose three days ago, set not thy heart on them; for they are found. And on whom is all the desire of Israel [set]? Is it not on thee, and on all thy father\'s house?";
web[20] = "And as for thy asses that were lost three days ago, set not thy mind on them; for they are found. And on whom [is] all the desire of Israel? [Is it] not on thee, and on all thy father\'s house?";
hnv[20] = "As for your donkeys who were lost three days ago, don\'t set your mind on them; for they are found. For whom is all that is desirable in Yisra\'el? Is it not for you, and for all your father\'s house?";
vul[20] = "et de asinis quas perdidisti nudius tertius ne sollicitus sis quia inventae sunt et cuius erunt optima quaeque Israhel nonne tibi et omni domui patris tui";
rsv[21] = "Saul answered, &quot;Am I not a Benjaminite, from the least of the tribes of Israel? And is not my family the humblest of all the families of the tribe of Benjamin? Why then have you spoken to me in this way?&quot;";
asv[21] = "And Saul answered and said, Am not I a Benjamite, of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin? wherefore then speakest thou to me after this manner?";
yng[21] = "And Saul answereth and saith, `Am not I a Benjamite -- of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin? and why hast thou spoken unto me according to this word?\'";
dby[21] = "And Saul answered and said, Am not I a Benjaminite, of the smallest of the tribes of Israel, and my family the least of all the families of the tribe of Benjamin? and why dost thou speak such words to me?";
web[21] = "And Saul answered and said, [Am] not I a Benjaminite, of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin? Why then speakest thou so to me?";
hnv[21] = "Sha\'ul answered, Am I not a Binyamini, of the smallest of the tribes of Yisra\'el? and my family the least of all the families of the tribe of Binyamin? why then speak you to me after this manner?";
vul[21] = "respondens autem Saul ait numquid non filius Iemini ego sum de minima tribu Israhel et cognatio mea novissima inter omnes familias de tribu Beniamin quare ergo locutus es mihi sermonem istum";
rsv[22] = "Then Samuel took Saul and his servant and brought them into the hall and gave them a place at the head of those who had been invited, who were about thirty persons.";
asv[22] = "And Samuel took Saul and his servant, and brought them into the guest-chamber, and made them sit in the chiefest place among them that were bidden, who were about thirty persons.";
yng[22] = "And Samuel taketh Saul, and his young man, and bringeth them in to the chamber, and giveth to them a place at the head of those called; and they [are] about thirty men.";
dby[22] = "And Samuel took Saul and his servant, and brought them into the chamber, and gave them a place at the head of them that were invited; and they were about thirty persons.";
web[22] = "And Samuel took Saul, and his servant, and brought them into the parlor, and made them sit in the chief place among them that were invited, who [were] about thirty persons.";
hnv[22] = "Shemu\'el took Sha\'ul and his servant, and brought them into the guest-chamber, and made them sit in the best place among those who were invited, who were about thirty persons.";
vul[22] = "adsumens itaque Samuhel Saulem et puerum eius introduxit eos in triclinium et dedit eis locum in capite eorum qui fuerant invitati erant enim quasi triginta viri";
rsv[23] = "And Samuel said to the cook, &quot;Bring the portion I gave you, of which I said to you, \'Put it aside.\'&quot;";
asv[23] = "And Samuel said unto the cook, Bring the portion which I gave thee, of which I said unto thee, Set it by thee.";
yng[23] = "And Samuel saith to the cook, `Give the portion which I gave to thee, of which I said unto thee, `Set it by thee?\'";
dby[23] = "And Samuel said to the cook, Bring the portion that I gave thee, of which I said to thee, Set it by thee.";
web[23] = "And Samuel said to the cook, Bring the portion which I gave thee, of which I said to thee, Set it by thee.";
hnv[23] = "Shemu\'el said to the cook, Bring the portion which I gave you, of which I said to you, Set it by you.";
vul[23] = "dixitque Samuhel coco da partem quam dedi tibi et praecepi ut reponeres seorsum apud te";
rsv[24] = "So the cook took up the leg and the upper portion and set them before Saul; and Samuel said, &quot;See, what was kept is set before you. Eat; because it was kept for you until the hour appointed, that you might eat with the guests.&quot; So Saul ate with Samuel that day.";
asv[24] = "And the cook took up the thigh, and that which was upon it, and set it before Saul. And [Samuel] said, Behold, that which hath been reserved! set it before thee and eat; because unto the appointed time hath it been kept for thee, for I said, I have invited the people. So Saul did eat with Samuel that day.";
yng[24] = "(and the cook lifteth up the leg, and that which [is] on it, and setteth before Saul), and he saith, `Lo, that which is left; set [it] before thee -- eat, for to this appointed season it is kept for thee, saying, The people I have called;\' and Saul eateth with Samuel on that day.";
dby[24] = "And the cook took up the shoulder, and what was on it, and set [it] before Saul. And he said, Behold that which has been reserved! set it before thee, eat; for against the set time has it been kept for thee, since I said, I will invite the people. So Saul ate with Samuel that day.";
web[24] = "And the cook took up the shoulder, and [that] which [was] upon it, and set [it] before Saul. And [Samuel] said, Behold that which is left! set [it] before thee, [and] eat; for to this time hath it been kept for thee since I said, I have invited the people. So Saul ate with Samuel that day.";
hnv[24] = "The cook took up the thigh, and that which was on it, and set it before Sha\'ul. [Shemu\'el] said, Behold, that which has been reserved! set it before you and eat; because to the appointed time has it been kept for you, for I said, I have invited the people. So Sha\'ul ate with Shemu\'el that day.";
vul[24] = "levavit autem cocus armum et posuit ante Saul dixitque Samuhel ecce quod remansit pone ante te et comede quia de industria servatum est tibi quando populum vocavi et comedit Saul cum Samuhel in die illa";
rsv[25] = "And when they came down from the high place into the city, a bed was spread for Saul upon the roof, and he lay down to sleep.";
asv[25] = "And when they were come down from the high place into the city, he communed with Saul upon the housetop.";
yng[25] = "And they come down from the high place to the city, and he speaketh with Saul on the roof.";
dby[25] = "And they came down from the high place into the city, and he spoke with Saul upon the roof.";
web[25] = "And when they had come down from the high place into the city, [Samuel] communed with Saul upon the top of the house.";
hnv[25] = "When they were come down from the high place into the city, he talked with Sha\'ul on the housetop.";
vul[25] = "et descenderunt de excelso in oppidum et locutus est cum Saul in solario";
rsv[26] = "Then at the break of dawn Samuel called to Saul upon the roof, &quot;Up, that I may send you on your way.&quot; So Saul arose, and both he and Samuel went out into the street.";
asv[26] = "And they arose early: and it came to pass about the spring of the day, that Samuel called to Saul on the housetop, saying, Up, that I may send thee away. And Saul arose, and they went out both of them, he and Samuel, abroad.";
yng[26] = "And they rise early, and it cometh to pass, at the ascending of the dawn, that Samuel calleth unto Saul, on the roof, saying, `Rise, and I send thee away;\' and Saul riseth, and they go out, both of them -- he and Samuel, without.";
dby[26] = "And they arose early; and when it was about the dawning of the day, Samuel called to Saul on the roof, saying, Arise, that I may send thee away. And Saul arose, and they went out both of them, he and Samuel, into the street.";
web[26] = "And they rose early: and it came to pass about the spring of the day, that Samuel called Saul to the top of the house, saying, Arise, that I may send thee away. And Saul arose, and they went out both of them, he and Samuel, abroad.";
hnv[26] = "They arose early: and it happened about the spring of the day, that Shemu\'el called to Sha\'ul on the housetop, saying, Up, that I may send you away. Sha\'ul arose, and they went out both of them, he and Shemu\'el, abroad.";
vul[26] = "cumque mane surrexissent et iam dilucesceret vocavit Samuhel Saul in solarium dicens surge ut dimittam te et surrexit Saul egressique sunt ambo ipse videlicet et Samuhel";
rsv[27] = "As they were going down to the outskirts of the city, Samuel said to Saul, &quot;Tell the servant to pass on before us, and when he has passed on stop here yourself for a while, that I may make known to you the word of God.&quot;";
asv[27] = "As they were going down at the end of the city, Samuel said to Saul, Bid the servant pass on before us (and he passed on), but stand thou still first, that I may cause thee to hear the word of God.";
yng[27] = "They are going down in the extremity of the city, and Samuel hath said unto Saul, `Say to the young man that he pass on before us (and he passeth on), and thou, stand at this time, and I cause thee to hear the word of God.\'";
dby[27] = "As they were going down to the end of the city, Samuel said to Saul, Tell the servant to pass on before us (and he passed on), but stand thou still now, that I may cause thee to hear the word of God.";
web[27] = "[And] as they were going down to the end of the city, Samuel said to Saul, Bid the servant pass on before us, (and he passed on,) but stand thou still a while, that I may show thee the word of God.";
hnv[27] = "As they were going down at the end of the city, Shemu\'el said to Sha\'ul, Bid the servant pass on before us (and he passed on), but stand you still first, that I may cause you to hear the word of God.";
vul[27] = "cumque descenderent in extrema parte civitatis Samuhel dixit ad Saul dic puero ut antecedat nos et transeat tu autem subsiste paulisper ut indicem tibi verbum Domini";
</script>
