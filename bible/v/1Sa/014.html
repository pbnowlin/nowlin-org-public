csb[1] = "That same day Saul\'s son Jonathan said to the attendant who carried his weapons, &quot;Come on, let\'s cross over to the Philistine garrison on the other side.&quot; However, he did not tell his father.&quot;"
csb[2] = "Saul was staying under the pomegranate tree in Migron on the outskirts of Gibeah. The troops with him numbered about six hundred.&quot;"
csb[3] = "Ahijah, who was wearing an ephod, was also there. He was the son of Ahitub, the brother of Ichabod son of Phinehas, son of Eli the LORD\'s priest at Shiloh. But the troops did not know that Jonathan had left.&quot;"
csb[4] = "There were sharp columns of rock on both sides of the pass that Jonathan intended to cross to reach the Philistine garrison. One was named Bozez and the other Seneh;&quot;"
csb[5] = "one stood to the north in front of Michmash and the other to the south in front of Geba.&quot;"
csb[6] = "Jonathan said to the attendant who carried his weapons, &quot;Come on, let\'s cross over to the garrison of these uncircumcised men. Perhaps the LORD will help us. Nothing can keep the LORD from saving, whether by many or by few.&quot;"
csb[7] = "His armor-bearer responded, &quot;Do what is in your heart. You choose. I\'m right here with you whatever you decide.&quot;"
csb[8] = "&quot;All right,&quot; Jonathan replied, &quot;we\'ll cross over to the men and then let them see us.&quot;"
csb[9] = "&quot;If they say, \'Wait until we reach you,\' then we will stay where we are and not go up to them.&quot;"
csb[10] = "&quot;But if they say, \'Come on up,\' then we\'ll go up, because the LORD has handed them over to us -- that will be our sign.&quot;"
csb[11] = "They let themselves be seen by the Philistine garrison, and the Philistines said, &quot;Look, the Hebrews are coming out of the holes where they\'ve been hiding! &quot;"
csb[12] = "The men of the garrison called to Jonathan and his armor-bearer. &quot;Come on up, and we\'ll teach you a lesson! &quot; they said. &quot;Follow me,&quot; Jonathan told his armor-bearer, &quot;for the LORD has handed them over to Israel.&quot;"
csb[13] = "Jonathan climbed up using his hands and feet, with his armor-bearer behind him. Jonathan cut them down, and his armor-bearer followed and finished them off.&quot;"
csb[14] = "In that first assault Jonathan and his armor-bearer struck down about twenty men in a half-acre field.&quot;"
csb[15] = "Terror spread through the Philistine camp and the open fields to all the troops. Even the garrison and the raiding parties were terrified. The earth shook, and terror spread from God.&quot;"
csb[16] = "When Saul\'s watchmen in Gibeah of Benjamin looked, they saw the panicking troops scattering in every direction.&quot;"
csb[17] = "So Saul said to the troops with him, &quot;Call the roll and determine who has left us.&quot; They called the roll and saw that Jonathan and his armor-bearer were gone.&quot;"
csb[18] = "Saul told Ahijah, &quot;Bring the ark of God,&quot; for it was with the Israelites at that time.&quot;"
csb[19] = "While Saul spoke to the priest, the panic in the Philistine camp increased in intensity. So Saul said to the priest, &quot;Stop what you\'re doing.&quot;"
csb[20] = "Saul and all the troops with him assembled and marched to the battle, and there the Philistines were, fighting against each other in great confusion!&quot;"
csb[21] = "There were Hebrews from the area who had gone earlier into the camp to join the Philistines, but even they joined the Israelites who were with Saul and Jonathan.&quot;"
csb[22] = "When all the Israelite men who had been hiding in the hill country of Ephraim heard that the Philistines were fleeing, they also joined Saul and Jonathan in the battle.&quot;"
csb[23] = "So the LORD saved Israel that day. The battle extended beyond Beth-aven,&quot;"
csb[24] = "and the men of Israel were worn out that day, for Saul had placed the troops under an oath: &quot;The man who eats food before evening, before I have taken vengeance on my enemies is cursed.&quot; So none of the troops tasted any food.&quot;"
csb[25] = "Everyone went into the forest, and there was honey on the ground.&quot;"
csb[26] = "When the troops entered the forest, they saw the flow of honey, but none of them ate any of it because they feared the oath.&quot;"
csb[27] = "However, Jonathan had not heard his father make the troops swear the oath. He reached out with the end of the staff he was carrying and dipped it into the honeycomb. When he ate the honey, he had renewed energy.&quot;"
csb[28] = "Then one of the troops said, &quot;Your father made the troops solemnly swear, \'The man who eats food today is cursed,\' and the troops are exhausted.&quot;"
csb[29] = "Jonathan replied, &quot;My father has brought trouble to the land. Just look at how I have renewed energy because I tasted a little of this honey.&quot;"
csb[30] = "&quot;How much better if the troops had eaten freely today from the plunder they took from their enemies! Then the slaughter of the Philistines would have been much greater.&quot;"
csb[31] = "The Israelites struck down the Philistines that day from Michmash all the way to Aijalon. Since the Israelites were completely exhausted,&quot;"
csb[32] = "they rushed to the plunder, took sheep, goats, cattle, and calves, slaughtered them on the ground, and ate meat with the blood still in it.&quot;"
csb[33] = "Some reported to Saul: &quot;Look, the troops are sinning against the LORD by eating meat with the blood still in it.&quot; Saul said, &quot;You have been unfaithful. Roll a large stone over here at once.&quot;"
csb[34] = "He then said, &quot;Go among the troops and say to them, \'Let each man bring me his ox or his sheep. Do the slaughtering here and then you can eat. Don\'t sin against the LORD by eating meat with the blood in it.\' &quot; So every one of the troops brought his ox that night and slaughtered it there.&quot;"
csb[35] = "Then Saul built an altar to the LORD; it was the first time he had built an altar to the LORD.&quot;"
csb[36] = "Saul said, &quot;Let\'s go down after the Philistines tonight and plunder them until morning. Don\'t let even one remain! &quot; &quot;Do whatever you want,&quot; the troops replied. But the priest said, &quot;Let\'s approach God here.&quot;"
csb[37] = "So Saul inquired of God, &quot;Should I go after the Philistines? Will you hand them over to Israel? &quot; But God did not answer him that day.&quot;"
csb[38] = "Saul said, &quot;All you leaders of the troops, come here. Let us investigate how this sin has occurred today.&quot;"
csb[39] = "&quot;As surely as the LORD lives who saves Israel, even if it is because of my son Jonathan, he must die! &quot; Not one of the troops answered him.&quot;"
csb[40] = "So he said to all Israel, &quot;You will be on one side, and I and my son Jonathan will be on the other side.&quot; And the troops replied, &quot;Do whatever you want.&quot;&#x2009;&quot;"
csb[41] = "So Saul said to the LORD, &quot;God of Israel, why have you not answered your servant today? If the unrighteousness is in me or in my son Jonathan, LORD God of Israel, give Urim; but if the fault is in your people Israel, give Thummim.&quot; Jonathan and Saul were selected, and the troops were cleared of the charge.&quot;"
csb[42] = "Then Saul said, &quot;Cast the lot between me and my son Jonathan,&quot; and Jonathan was selected.&quot;"
csb[43] = "Saul commanded him, &quot;Tell me what you did.&quot; Jonathan told him, &quot;I tasted a little honey with the end of the staff I was carrying. I am ready to die! &quot;"
csb[44] = "Saul declared to him, &quot;May God punish me and do so severely if you do not die, Jonathan! &quot;"
csb[45] = "But the people said to Saul, &quot;Must Jonathan die, who accomplished such a great deliverance for Israel? No, as the LORD lives, not a hair of his head will fall to the ground, for he worked with God\'s help today.&quot; So the people redeemed Jonathan, and he did not die.&quot;"
csb[46] = "Then Saul gave up the pursuit of the Philistines, and the Philistines returned to their own territory.&quot;"
csb[47] = "When Saul assumed the kingship over Israel, he fought against all his enemies in every direction: against Moab, the Ammonites, Edom, the kings of Zobah, and the Philistines. Wherever he turned, he caused havoc.&quot;"
csb[48] = "He fought bravely, defeated the Amalekites, and rescued Israel from those who plundered them.&quot;"
csb[49] = "Saul\'s sons were Jonathan, Ishvi, and Malchishua. The names of his two daughters were Merab, his firstborn, and Michal, the younger.&quot;"
csb[50] = "The name of Saul\'s wife was Ahinoam daughter of Ahimaaz. The name of the commander of his army was Abner son of Saul\'s uncle Ner.&quot;"
csb[51] = "Saul\'s father was Kish. Abner\'s father was Ner son of Abiel.&quot;"
csb[52] = "The conflict with the Philistines was fierce all of Saul\'s days, so whenever Saul noticed any strong or valiant man, he enlisted him.&quot;"

asv[4] = "And between the passes, by which Jonathan sought to go over unto the Philistines\' garrison, there was a rocky crag on the one side, and a rocky crag on the other side: and the name of the one was Bozez, and the name of the other Seneh.";

rsv[6] = "And Jonathan said to the young man who bore his armor, &quot;Come, let us go over to the garrison of these uncircumcised; it may be that the LORD will work for us; for nothing can hinder the LORD from saving by many or by few.&quot;";

hnv[13] = "Yonatan climbed up on his hands and on his feet, and his armor bearer after him: and they fell before Yonatan; and his armor bearer killed them after him.";
vul[13] = "ascendit autem Ionathan reptans manibus et pedibus et armiger eius post eum itaque alii cadebant ante Ionathan alios armiger eius interficiebat sequens eum";

rsv[14] = "and that first slaughter, which Jonathan and his armor-bearer made, was of about twenty men within as it were half a furrow\'s length in an acre of land.";

yng[14] = "And the first smiting which Jonathan and the bearer of his weapons have smitten is of about twenty men, in about half a furrow of a yoke of a field,";

web[14] = "And that first slaughter, which Jonathan and his armor-bearer made, was about twenty men, within as it were a half-acre of land, [which] a yoke [of oxen might plow].";
hnv[14] = "That first slaughter, which Yonatan and his armor bearer made, was about twenty men, within as it were half a furrow\'s length in an acre of land.";

asv[15] = "And there was a trembling in the camp, in the field, and among all the people; the garrison, and the spoilers, they also trembled; and the earth quaked: so there was an exceeding great trembling.";
yng[15] = "and there is a trembling in the camp, in the field, and among all the people, the station and the destroyers have trembled -- even they, and the earth shaketh, and it becometh a trembling of God.";
dby[15] = "And there was trembling in the camp, in the field, and among all the people; the garrison, and the ravagers, they also trembled, and the earth quaked; for it was a trembling [from] God.";

hnv[15] = "There was a trembling in the camp, in the field, and among all the people; the garrison, and the spoilers, they also trembled; and the eretz quaked: so there was an exceeding great trembling.";
vul[15] = "et factum est miraculum in castris per agros sed et omnis populus stationis eorum qui ierant ad praedandum obstipuit et conturbata est terra et accidit quasi miraculum a Deo";

asv[16] = "And the watchmen of Saul in Gibeah of Benjamin looked; and, behold, the multitude melted away, and they went [hither] and thither.";
yng[16] = "And the watchmen of Saul in Gibeah of Benjamin see, and lo, the multitude hath melted away, and it goeth on, and is beaten down.";
dby[16] = "And the watchmen of Saul in Gibeah of Benjamin looked, and behold, the multitude melted away, and they went on slaying one another.";
web[16] = "And the watchmen of Saul in Gibeah of Benjamin looked; and behold, the multitude melted away, and they went on beating down [one another].";
hnv[16] = "The watchmen of Sha\'ul in Gevah of Binyamin looked; and, behold, the multitude melted away, and they went [here] and there.";
vul[16] = "et respexerunt speculatores Saul qui erant in Gabaa Beniamin et ecce multitudo prostrata et huc illucque diffugiens";
kjv[17] = "Then said Saul unto the people that [were] with him, Number now, and see who is gone from us. And when they had numbered, behold, Jonathan and his armourbearer [were] not [there].";
rsv[17] = "Then Saul said to the people who were with him, &quot;Number and see who has gone from us.&quot; And when they had numbered, behold, Jonathan and his armor-bearer were not there.";
asv[17] = "Then said Saul unto the people that were with him, Number now, and see who is gone from us. And when they had numbered, behold, Jonathan and his armorbearer were not there.";
yng[17] = "And Saul saith to the people who [are] with him, `Inspect, I pray you, and see; who hath gone from us?\' and they inspect, and lo, Jonathan and the bearer of his weapons are not.";
dby[17] = "Then said Saul to the people that were with him, Muster now, and see who is gone from us. And they mustered, and behold, Jonathan and his armour-bearer were not there.";
web[17] = "Then said Saul to the people that [were] with him, Number now, and see who is gone from us. And when they had numbered, behold, Jonathan and his armor-bearer [were] not [there].";

dby[18] = "And Saul said to Ahijah, Bring hither the ark of God. For the ark of God was at that time with the children of Israel.";
web[18] = "And Saul said to Ahiah, Bring hither the ark of God. For the ark of God was at that time with the children of Israel.";
hnv[18] = "Sha\'ul said to Achiyah, Bring here the ark of God. For the ark of God was [there] at that time with the children of Yisra\'el.";

yng[19] = "And it cometh to pass, while Saul spake unto the priest, that the noise which [is] in the camp of the Philistines goeth on, going on and becoming great, and Saul saith unto the priest, `Remove thy hand.\'";
dby[19] = "And it came to pass while Saul talked to the priest, that the noise which was in the camp of the Philistines went on and increased; and Saul said to the priest, Withdraw thy hand.";

kjv[20] = "And Saul and all the people that [were] with him assembled themselves, and they came to the battle: and, behold, every man\'s sword was against his fellow, [and there was] a very great discomfiture.";

yng[20] = "And Saul is called, and all the people who [are] with him, and they come in unto the battle, and, lo, the sword of each hath been against his neighbour -- a very great destruction.";
dby[20] = "And Saul and all the people that were with him were called together, and they came to the battle; and behold, every man\'s sword was against his fellow, a very great confusion.";
web[20] = "And Saul and all the people that [were] with him assembled themselves, and they came to the battle: and behold, every man\'s sword was against his fellow, [and there was] a very great discomfiture.";
hnv[20] = "Sha\'ul and all the people who were with him were gathered together, and came to the battle: and, behold, every man\'s sword was against his fellow, [and there was] a very great confusion.";

asv[21] = "Now the Hebrews that were with the Philistines as beforetime, and that went up with them into the camp, [from the country] round about, even they also [turned] to be with the Israelites that were with Saul and Jonathan.";
yng[21] = "And the Hebrews [who] have been for the Philistines as heretofore, who had gone up with them into the camp, have turned round, even they, to be with Israel who [are] with Saul and Jonathan,";
dby[21] = "And there were Hebrews with the Philistines before that time, who had gone up with them into the camp round about; and they also [turned] to be with the Israelites who were with Saul and Jonathan.";

kjv[24] = "And the men of Israel were distressed that day: for Saul had adjured the people, saying, Cursed [be] the man that eateth [any] food until evening, that I may be avenged on mine enemies. So none of the people tasted [any] food.";

web[29] = "Then said Jonathan, My father hath troubled the land: see, I pray you, how my eyes have been enlightened, because I tasted a little of this honey.";

asv[30] = "How much more, if haply the people had eaten freely to-day of the spoil of their enemies which they found? for now hath there been no great slaughter among the Philistines.";

dby[33] = "And they told Saul, saying, Behold, the people sin against Jehovah, in that they eat with the blood. And he said, Ye have acted perversely: roll me now a great stone.";

vul[33] = "nuntiaverunt autem Saul dicentes quod populus peccasset Domino comedens cum sanguine qui ait praevaricati estis volvite ad me iam nunc saxum grande";
kjv[34] = "And Saul said, Disperse yourselves among the people, and say unto them, Bring me hither every man his ox, and every man his sheep, and slay [them] here, and eat; and sin not against the LORD in eating with the blood. And all the people brought every man his ox with him that night, and slew [them] there.";
rsv[34] = "And Saul said, &quot;Disperse yourselves among the people, and say to them, \'Let every man bring his ox or his sheep, and slay them here, and eat; and do not sin against the LORD by eating with the blood.\'&quot; So every one of the people brought his ox with him that night, and slew them there.";
asv[34] = "And Saul said, Disperse yourselves among the people, and say unto them, Bring me hither every man his ox, and every man his sheep, and slay them here, and eat; and sin not against Jehovah in eating with the blood. And all the people brought every man his ox with him that night, and slew them there.";
yng[34] = "And Saul saith, `Be ye scattered among the people, and ye have said to them, Bring ye nigh unto me each his ox, and each his sheep; and ye have slain [them] in this place, and eaten, and ye do not sin against Jehovah to eat with the blood.\' And all the people bring nigh each his ox, in his hand, that night, and slaughter [them] there.";
dby[34] = "And Saul said, Disperse yourselves among the people, and say to them, Bring near to me every man his ox, and every man his sheep, and slaughter them here, and eat; and sin not against Jehovah in eating with the blood. And all the people brought every man his ox with him that night, and slaughtered [them] there.";
web[34] = "And Saul said, Disperse yourselves among the people, and say to them, Bring me hither every man his ox, and every man his sheep, and slay [them] here, and eat; and sin not against the LORD in eating with the blood. And all the people brought every man his ox with him that night, and slew [them] there.";
hnv[34] = "Sha\'ul said, Disperse yourselves among the people, and tell them, Bring me here every man his ox, and every man his sheep, and kill them here, and eat; and don\'t sin against the LORD in eating with the blood. All the people brought every man his ox with him that night, and killed them there.";
vul[34] = "et dixit Saul dispergimini in vulgus et dicite eis ut adducat ad me unusquisque bovem suum et arietem et occidite super istud et vescimini et non peccabitis Domino comedentes cum sanguine adduxit itaque omnis populus unusquisque bovem in manu sua usque ad noctem et occiderunt ibi";
kjv[35] = "And Saul built an altar unto the LORD: the same was the first altar that he built unto the LORD.";
rsv[35] = "And Saul built an altar to the LORD; it was the first altar that he built to the LORD.";
asv[35] = "And Saul built an altar unto Jehovah: the same was the first altar that he built unto Jehovah.";
yng[35] = "And Saul buildeth an alter to Jehovah; with it he hath begun to build altars to Jehovah.";
dby[35] = "And Saul built an altar to Jehovah: this was the first altar he built to Jehovah.";
web[35] = "And Saul built an altar to the LORD: the same was the first altar that he built to the LORD:";
hnv[35] = "Sha\'ul built an altar to the LORD: the same was the first altar that he built to the LORD.";
vul[35] = "aedificavit autem Saul altare Domini tuncque primum coepit aedificare altare Domini";
kjv[36] = "And Saul said, Let us go down after the Philistines by night, and spoil them until the morning light, and let us not leave a man of them. And they said, Do whatsoever seemeth good unto thee. Then said the priest, Let us draw near hither unto God.";
rsv[36] = "Then Saul said, &quot;Let us go down after the Philistines by night and despoil them until the morning light; let us not leave a man of them.&quot; And they said, &quot;Do whatever seems good to you.&quot; But the priest said, &quot;Let us draw near hither to God.&quot;";
asv[36] = "And Saul said, Let us go down after the Philistines by night, and take spoil among them until the morning light, and let us not leave a man of them. And they said, Do whatsoever seemeth good unto thee. Then said the priest, Let us draw near hither unto God.";
yng[36] = "And Saul saith, `Let us go down after the Philistines by night, and we prey upon them till the light of the morning, and leave not a man of them.\' And they say, `All that is good in thine eyes do.\' And the priest saith, `Let us draw near hither unto God.\'";
dby[36] = "And Saul said, Let us go down after the Philistines by night, and plunder them until the morning light, and let us not leave a man of them. And they said, Do whatsoever is good in thy sight. Then said the priest, Let us come near hither to God.";
web[36] = "And Saul said, Let us go down after the Philistines by night, and spoil them until the morning light, and let us not leave a man of them. And they said, Do whatever seemeth good to thee. Then said the priest, Let us draw near hither to God.";
hnv[36] = "Sha\'ul said, Let us go down after the Pelishtim by night, and take spoil among them until the morning light, and let us not leave a man of them. They said, Do whatever seems good to you. Then said the Kohen, Let us draw near here to God.";
vul[36] = "et dixit Saul inruamus super Philisthim nocte et vastemus eos usque dum inlucescat mane nec relinquamus de eis virum dixitque populus omne quod bonum videtur in oculis tuis fac et ait sacerdos accedamus huc ad Deum";
kjv[37] = "And Saul asked counsel of God, Shall I go down after the Philistines? wilt thou deliver them into the hand of Israel? But he answered him not that day.";
rsv[37] = "And Saul inquired of God, &quot;Shall I go down after the Philistines? Wilt thou give them into the hand of Israel?&quot; But he did not answer him that day.";
asv[37] = "And Saul asked counsel of God, Shall I go down after the Philistines? wilt thou deliver them into the hand of Israel? But he answered him not that day.";
yng[37] = "And Saul asketh of God, `Do I go down after the Philistines? dost Thou give them into the hand of Israel?\' and He hath not answered him on that day.";
dby[37] = "And Saul inquired of God, Shall I go down after the Philistines? wilt thou give them into the hand of Israel? But he did not answer him that day.";
web[37] = "And Saul asked counsel of God, Shall I go down after the Philistines? wilt thou deliver them into the hand of Israel? But he answered him not that day.";
hnv[37] = "Sha\'ul asked counsel of God, Shall I go down after the Pelishtim? will you deliver them into the hand of Yisra\'el? But he didn\'t answer him that day.";
vul[37] = "et consuluit Saul Deum num persequar Philisthim si trades eos in manu Israhel et non respondit ei in die illa";
kjv[38] = "And Saul said, Draw ye near hither, all the chief of the people: and know and see wherein this sin hath been this day.";
rsv[38] = "And Saul said, &quot;Come hither, all you leaders of the people; and know and see how this sin has arisen today.";
asv[38] = "And Saul said, Draw nigh hither, all ye chiefs of the people; and know and see wherein this sin hath been this day.";
yng[38] = "And Saul saith, `Draw ye nigh hither all, the chiefs of the people, and know and see in what this sin hath been to-day;";
dby[38] = "And Saul said, Draw ye near hither, all the heads of the people; and know and see wherein this sin has been this day.";
web[38] = "And Saul said, Draw ye near hither all the chief of the people: and know and see wherein this sin hath been this day.";
hnv[38] = "Sha\'ul said, Draw near here, all you chiefs of the people; and know and see in which this sin has been this day.";
vul[38] = "dixitque Saul adplicate huc universos angulos populi et scitote et videte per quem acciderit peccatum hoc hodie";
kjv[39] = "For, [as] the LORD liveth, which saveth Israel, though it be in Jonathan my son, he shall surely die. But [there was] not a man among all the people [that] answered him.";
rsv[39] = "For as the LORD lives who saves Israel, though it be in Jonathan my son, he shall surely die.&quot; But there was not a man among all the people that answered him.";
asv[39] = "For, as Jehovah liveth, who saveth Israel, though it be in Jonathan my son, he shall surely die. But there was not a man among all the people that answered him.";
yng[39] = "for, Jehovah liveth, who is saving Israel: surely if it be in Jonathan my son, surely he doth certainly die;\' and none is answering him out of all the people.";
dby[39] = "For, [as] Jehovah liveth, who has saved Israel, though it be in Jonathan my son, he shall certainly die. And no one answered him among all the people.";
web[39] = "For [as] the LORD liveth, who saveth Israel, though it is in Jonathan my son, he shall surely die. But [there was] not a man among all the people [that] answered him.";
hnv[39] = "For, as the LORD lives, who saves Yisra\'el, though it be in Yonatan my son, he shall surely die. But there was not a man among all the people who answered him.";
vul[39] = "vivit Dominus salvator Israhel quia si per Ionathan filium meum factum est absque retractatione morietur ad quod nullus contradixit ei de omni populo";
kjv[40] = "Then said he unto all Israel, Be ye on one side, and I and Jonathan my son will be on the other side. And the people said unto Saul, Do what seemeth good unto thee.";
rsv[40] = "Then he said to all Israel, &quot;You shall be on one side, and I and Jonathan my son will be on the other side.&quot; And the people said to Saul, &quot;Do what seems good to you.&quot;";
asv[40] = "Then said he unto all Israel, Be ye on one side, and I and Jonathan my son will be on the other side. And the people said unto Saul, Do what seemeth good unto thee.";
yng[40] = "And he saith unto all Israel, `Ye -- ye are on one side, and I and Jonathan my son are on another side;\' and the people say unto Saul, `That which is good in thine eyes do.\'";
dby[40] = "Then said he to all Israel, Be ye on one side, and I and Jonathan my son will be on the other side. And the people said to Saul, Do what is good in thy sight.";
web[40] = "Then said he to all Israel, Be ye on one side, and I and Jonathan my son will be on the other side. And the people said to Saul, Do what seemeth good to thee.";
hnv[40] = " Then said he to all Yisra\'el, Be you on one side, and I and Yonatan my son will be on the other side. The people said to Sha\'ul, Do what seems good to you.";
vul[40] = "et ait ad universum Israhel separamini vos in partem unam et ego cum Ionathan filio meo ero in parte una respondit populus ad Saul quod bonum videtur in oculis tuis fac";
kjv[41] = "Therefore Saul said unto the LORD God of Israel, Give a perfect [lot]. And Saul and Jonathan were taken: but the people escaped.";
rsv[41] = "Therefore Saul said, &quot;O LORD God of Israel, why hast thou not answered thy servant this day? If this guilt is in me or in Jonathan my son, O LORD, God of Israel, give Urim; but if this guilt is in thy people Israel, give Thummim.&quot; And Jonathan and Saul were taken, but the people escaped.";
asv[41] = "Therefore Saul said unto Jehovah, the God of Israel, Show the right. And Jonathan and Saul were taken [by lot]; but the people escaped.";
yng[41] = "And Saul saith unto Jehovah, God of Israel, `Give perfection;\' and Jonathan and Saul are captured, and the people went out.";
dby[41] = "And Saul said to Jehovah the God of Israel, Give a perfect [testimony]! And Jonathan and Saul were taken, and the people escaped.";
web[41] = "Therefore Saul said to the LORD God of Israel, Give a perfect [lot]. And Saul and Jonathan were taken: but the people escaped.";
hnv[41] = "Therefore Sha\'ul said to the LORD, the God of Yisra\'el, Show the right. Yonatan and Sha\'ul were taken [by lot]; but the people escaped.";
vul[41] = "et dixit Saul ad Dominum Deum Israhel da indicium et deprehensus est Ionathan et Saul populus autem exivit";
kjv[42] = "And Saul said, Cast [lots] between me and Jonathan my son. And Jonathan was taken.";
rsv[42] = "Then Saul said, &quot;Cast the lot between me and my son Jonathan.&quot; And Jonathan was taken.";
asv[42] = "And Saul said, Cast [lots] between me and Jonathan my son. And Jonathan was taken.";
yng[42] = "And Saul saith, `Cast between me and Jonathan my son;\' and Jonathan is captured.";
dby[42] = "And Saul said, Cast [lots] between me and Jonathan my son. And Jonathan was taken.";
web[42] = "And Saul said, Cast [lots] between me and Jonathan my son. And Jonathan was taken.";
hnv[42] = "Sha\'ul said, Cast [lots] between me and Yonatan my son. Yonatan was taken.";
vul[42] = "et ait Saul mittite sortem inter me et inter Ionathan filium meum et captus est Ionathan";
kjv[43] = "Then Saul said to Jonathan, Tell me what thou hast done. And Jonathan told him, and said, I did but taste a little honey with the end of the rod that [was] in mine hand, [and], lo, I must die.";
rsv[43] = "Then Saul said to Jonathan, &quot;Tell me what you have done.&quot; And Jonathan told him, &quot;I tasted a little honey with the tip of the staff that was in my hand; here I am, I will die.&quot;";
asv[43] = "Then Saul said to Jonathan, Tell me what thou hast done. And Jonathan told him, and said, I did certainly taste a little honey with the end of the rod that was in my hand; and, lo, I must die.";
yng[43] = "And Saul saith unto Jonathan, `Declare to me, what hast thou done?\' and Jonathan declareth to him, and saith, `I certainly tasted with the end of the rod that [is] in my hand a little honey; lo, I die!\'";
dby[43] = "And Saul said to Jonathan, Tell me what thou hast done. And Jonathan told him and said, With the end of the staff which is in my hand I tasted a little honey, [and] behold, I must die!";
web[43] = "Then Saul said to Jonathan, Tell me what thou hast done. And Jonathan told him, and said, I did but taste a little honey with the end of the rod that [was] in my hand, [and], lo, I must die.";
hnv[43] = "Then Sha\'ul said to Yonatan, Tell me what you have done. Yonatan told him, and said, I did certainly taste a little honey with the end of the rod that was in my hand; and, behold, I must die.";
vul[43] = "dixit autem Saul ad Ionathan indica mihi quid feceris et indicavit ei Ionathan et ait gustans gustavi in summitate virgae quae erat in manu mea paululum mellis et ecce ego morior";
kjv[44] = "And Saul answered, God do so and more also: for thou shalt surely die, Jonathan.";
rsv[44] = "And Saul said, &quot;God do so to me and more also; you shall surely die, Jonathan.&quot;";
asv[44] = "And Saul said, God do so and more also; for thou shalt surely die, Jonathan.";
yng[44] = "And Saul saith, `Thus doth God do, and thus doth He add, for thou dost certainly die, Jonathan.\'";
dby[44] = "And Saul said, God do so [to me] and more also; thou shalt certainly die, Jonathan.";
web[44] = "And Saul answered, God do so, and more also: for thou shalt surely die, Jonathan.";
hnv[44] = "Sha\'ul said, God do so and more also; for you shall surely die, Yonatan.";
vul[44] = "et ait Saul haec faciat mihi Deus et haec addat quia morte morieris Ionathan";
kjv[45] = "And the people said unto Saul, Shall Jonathan die, who hath wrought this great salvation in Israel? God forbid: [as] the LORD liveth, there shall not one hair of his head fall to the ground; for he hath wrought with God this day. So the people rescued Jonathan, that he died not.";
rsv[45] = "Then the people said to Saul, &quot;Shall Jonathan die, who has wrought this great victory in Israel? Far from it! As the LORD lives, there shall not one hair of his head fall to the ground; for he has wrought with God this day.&quot; So the people ransomed Jonathan, that he did not die.";
asv[45] = "And the people said unto Saul, Shall Jonathan die, who hath wrought this great salvation in Israel? Far from it: as Jehovah liveth, there shall not one hair of his head fall to the ground; for he hath wrought with God this day. So the people rescued Jonathan, that he died not.";
yng[45] = "And the people say unto Saul, `Doth Jonathan die who wrought this great salvation in Israel? -- a profanation! Jehovah liveth, if there falleth from the hair of his head to the earth, for with God he hath wrought this day;\' and the people rescue Jonathan, and he hath not died.";
dby[45] = "And the people said to Saul, Shall Jonathan die, who has wrought this great salvation in Israel? Far be it! [as] Jehovah liveth, there shall not a hair of his head fall to the ground; for he has wrought with God this day. So the people delivered Jonathan, that he died not.";
web[45] = "And the people said to Saul, Shall Jonathan die, who hath wrought this great salvation in Israel? By no means: [as] the LORD liveth, there shall not one hair of his head fall to the ground; for he hath wrought with God this day. So the people rescued Jonathan, that he died not.";
hnv[45] = "The people said to Sha\'ul, Shall Yonatan die, who has worked this great salvation in Yisra\'el? Far from it: as the LORD lives, there shall not one hair of his head fall to the ground; for he has worked with God this day. So the people rescued Yonatan, that he didn\'t die.";
vul[45] = "dixitque populus ad Saul ergone Ionathan morietur qui fecit salutem hanc magnam in Israhel hoc nefas est vivit Dominus si ceciderit capillus de capite eius in terram quia cum Deo operatus est hodie liberavit ergo populus Ionathan ut non moreretur";
kjv[46] = "Then Saul went up from following the Philistines: and the Philistines went to their own place.";
rsv[46] = "Then Saul went up from pursuing the Philistines; and the Philistines went to their own place.";
asv[46] = "Then Saul went up from following the Philistines; and the Philistines went to their own place.";
yng[46] = "And Saul goeth up from after the Philistines, and the Philistines have gone to their place;";
dby[46] = "And Saul went up from following the Philistines; and the Philistines went to their own place.";
web[46] = "Then Saul went up from following the Philistines: and the Philistines went to their own place.";
hnv[46] = "Then Sha\'ul went up from following the Pelishtim; and the Pelishtim went to their own place.";
vul[46] = "recessitque Saul nec persecutus est Philisthim porro Philisthim abierunt in loca sua";
kjv[47] = "So Saul took the kingdom over Israel, and fought against all his enemies on every side, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines: and whithersoever he turned himself, he vexed [them].";
rsv[47] = "When Saul had taken the kingship over Israel, he fought against all his enemies on every side, against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines; wherever he turned he put them to the worse.";
asv[47] = "Now when Saul had taken the kingdom over Israel, he fought against all his enemies on every side, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines: and whithersoever he turned himself, he put [them] to the worse.";
yng[47] = "and Saul captured the kingdom over Israel, and he fighteth round about against all his enemies, against Moab, and against the Bene-Ammon, and against Edom, and against the kings of Zobah, and against the Philistines, and whithersoever he turneth he doth vex [them].";
dby[47] = "And Saul took the kingdom over Israel, and fought against all his enemies round about, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines; and whithersoever he turned himself, he discomfited [them].";
web[47] = "So Saul took the kingdom over Israel, and fought against all his enemies on every side, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines: and whithersoever he turned himself, he harassed [them].";
hnv[47] = "Now when Sha\'ul had taken the kingdom over Yisra\'el, he fought against all his enemies on every side, against Mo\'av, and against the children of `Ammon, and against Edom, and against the kings of Tzovah, and against the Pelishtim: and wherever he turned himself, he put [them] to the worse.";
vul[47] = "at Saul confirmato regno super Israhel pugnabat per circuitum adversum omnes inimicos eius contra Moab et filios Ammon et Edom et reges Suba et Philistheos et quocumque se verterat superabat";
kjv[48] = "And he gathered an host, and smote the Amalekites, and delivered Israel out of the hands of them that spoiled them.";
rsv[48] = "And he did valiantly, and smote the Amal\'ekites, and delivered Israel out of the hands of those who plundered them.";
asv[48] = "And he did valiantly, and smote the Amalekites, and delivered Israel out of the hands of them that despoiled them.";
yng[48] = "And he maketh a force, and smiteth Amalek, and delivereth Israel out of the hand of its spoiler.";
dby[48] = "And he did valiantly, and smote the Amalekites, and delivered Israel out of the hands of their spoilers.";
web[48] = "And he gathered a host, and smote the Amalekites, and delivered Israel from the hands of them that spoiled them.";
hnv[48] = "He did valiantly, and struck the `Amaleki, and delivered Yisra\'el out of the hands of those who despoiled them.";
vul[48] = "congregatoque exercitu percussit Amalech et eruit Israhel de manu vastatorum eius";
kjv[49] = "Now the sons of Saul were Jonathan, and Ishui, and Melchishua: and the names of his two daughters [were these]; the name of the firstborn Merab, and the name of the younger Michal:";
rsv[49] = "Now the sons of Saul were Jonathan, Ishvi, and Mal\'chishu\'a; and the names of his two daughters were these: the name of the first-born was Merab, and the name of the younger Michal;";
asv[49] = "Now the sons of Saul were Jonathan, and Ishvi, and Malchishua; and the names of his two daughters were these: the name of the first-born Merab, and the name of the younger Michal:";
yng[49] = "And the sons of Saul are Jonathan, and Ishui, and Melchi-Shua; as to the name of his two daughters, the name of the first-born [is] Merab, and the name of the younger Michal;";
dby[49] = "And the sons of Saul were Jonathan, and Jishvi, and Malchi-shua. And the names of his two daughters: the name of the firstborn Merab, and the name of the younger Michal.";
web[49] = "Now the sons of Saul were Jonathan, and Ishui, and Melchi-shua: and the names of his two daughters [were these]; the name of the first-born Merab, and the name of the younger Michal:";
hnv[49] = "Now the sons of Sha\'ul were Yonatan, and Yishvi, and Malki-Shua; and the names of his two daughters were these: the name of the firstborn Merav, and the name of the younger Mikhal:";
vul[49] = "fuerunt autem filii Saul Ionathan et Iesui et Melchisua nomina duarum filiarum eius nomen primogenitae Merob et nomen minoris Michol";
kjv[50] = "And the name of Saul\'s wife [was] Ahinoam, the daughter of Ahimaaz: and the name of the captain of his host [was] Abner, the son of Ner, Saul\'s uncle.";
rsv[50] = "and the name of Saul\'s wife was Ahin\'o-am the daughter of Ahim\'a-az. And the name of the commander of his army was Abner the son of Ner, Saul\'s uncle;";
asv[50] = "and the name of Saul\'s wife was Ahinoam the daughter of Ahimaaz. And the name of the captain of his host was Abner the son of Ner, Saul\'s uncle.";
yng[50] = "and the name of the wife of Saul [is] Ahinoam, daughter of Ahimaaz; and the name of the head of his host [is] Abner son of Ner, uncle of Saul;";
dby[50] = "And the name of Saul\'s wife was Ahinoam, the daughter of Ahimaaz; and the name of the captain of his host was Abner, the son of Ner, Saul\'s uncle.";
web[50] = "And the name of Saul\'s [wife] was Ahinoam, the daughter of Ahimaaz: and the name of the captain of his host [was] Abner, the son of Ner, Saul\'s uncle.";
hnv[50] = "and the name of Sha\'ul\'s wife was Achino\'am the daughter of Achima`atz. The name of the captain of his host was Aviner the son of Ner, Sha\'ul\'s uncle.";
vul[50] = "et nomen uxoris Saul Ahinoem filia Ahimaas et nomina principum militiae eius Abner filius Ner patruelis Saul";
kjv[51] = "And Kish [was] the father of Saul; and Ner the father of Abner [was] the son of Abiel.";
rsv[51] = "Kish was the father of Saul, and Ner the father of Abner was the son of Abi\'el.";
asv[51] = "And Kish was the father of Saul; and Ner the father of Abner was the son of Abiel.";
yng[51] = "and Kish [is] father of Saul, and Ner father of Abner [is] son of Ahiel.";
dby[51] = "And Kish the father of Saul, and Ner the father of Abner were sons of Abiel.";
web[51] = "And Kish [was] the father of Saul; and Ner the father of Abner [was] the son of Abiel.";
hnv[51] = "Kish was the father of Sha\'ul; and Ner the father of Aviner was the son of Aviel.";
vul[51] = "Cis fuerat pater Saul et Ner pater Abner filius Abihel";
kjv[52] = "And there was sore war against the Philistines all the days of Saul: and when Saul saw any strong man, or any valiant man, he took him unto him.";
rsv[52] = "There was hard fighting against the Philistines all the days of Saul; and when Saul saw any strong man, or any valiant man, he attached him to himself.";
asv[52] = "And there was sore war against the Philistines all the days of Saul: and when Saul saw any mighty man, or any valiant man, he took him unto him.";
yng[52] = "And the war is severe against the Philistines all the days of Saul; when Saul hath seen any mighty man, and any son of valour, then he doth gather him unto himself.";
dby[52] = "And there was sore war against the Philistines all the days of Saul; and when Saul saw any mighty man, or any valiant man, he took him to himself.";
web[52] = "And there was violent war against the Philistines all the days of Saul: and when Saul saw any strong man, or any valiant man, he took him to himself.";
hnv[52] = "There was sore war against the Pelishtim all the days of Sha\'ul: and when Sha\'ul saw any mighty man, or any valiant man, he took him to him.";
vul[52] = "erat autem bellum potens adversum Philistheos omnibus diebus Saul nam quemcumque viderat Saul virum fortem et aptum ad proelium sociabat eum sibi";
</script>
