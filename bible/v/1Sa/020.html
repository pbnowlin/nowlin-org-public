csb[1] = "David fled from Naioth in Ramah and came to Jonathan and asked, &quot;What have I done? What did I do wrong? How have I sinned against your father so that he wants to take my life? &quot;"
csb[2] = "Jonathan said to him, &quot;No, you won\'t die. Listen, my father doesn\'t do anything, great or small, without telling me. So why would he hide this matter from me? This can\'t be true.&quot;"
csb[3] = "But David said, &quot;Your father certainly knows that I have found favor with you. He has said, \'Jonathan must not know of this, or else he will be grieved.\' &quot; David also swore, &quot;As surely as the LORD lives and as you yourself live, there is but a step between me and death.&quot;"
csb[4] = "Jonathan said to David, &quot;Whatever you say, I will do for you.&quot;"
csb[5] = "So David told him, &quot;Look, tomorrow is the New Moon, and I\'m supposed to sit down and eat with the king. Instead, let me go, and I\'ll hide in the countryside for the next two nights.&quot;"
csb[6] = "&quot;If your father misses me at all, say, \'David urgently requested my permission to go quickly to his hometown Bethlehem for an annual sacrifice there involving the whole clan.\'&quot;"
csb[7] = "&quot;If he says, \'Good,\' then your servant is safe, but if he becomes angry, you will know he has evil intentions.&quot;"
csb[8] = "&quot;Deal kindly with your servant, for you have brought me into a covenant with you before the LORD. If I have done anything wrong, then kill me yourself; why take me to your father? &quot;"
csb[9] = "&quot;No! &quot; Jonathan responded. &quot;If I ever find out my father has evil intentions against you, wouldn\'t I tell you about it? &quot;"
csb[10] = "So David asked Jonathan, &quot;Who will tell me if your father answers you harshly? &quot;"
csb[11] = "He answered David, &quot;Come on, let\'s go out to the countryside.&quot; So both of them went out to the countryside.&quot;"
csb[12] = "&quot;By the LORD, the God of Israel, I will sound out my father by this time tomorrow or the next day. If I find out that he is favorable toward you, will I not send for you and tell you?&quot;"
csb[13] = "&quot;If my father intends to bring evil on you, may God punish Jonathan and do so severely if I do not tell you and send you away so you may leave safely. May the LORD be with you, just as he was with my father.&quot;"
csb[14] = "&quot;If I continue to live, show me kindness from the LORD, but if I die,&quot;"
csb[15] = "&quot;don\'t ever withdraw your kindness from my household -- not even when the LORD cuts off every one of David\'s enemies from the face of the earth.&quot;"
csb[16] = "Then Jonathan made a covenant with the house of David, saying, &quot;May the LORD hold David\'s enemies accountable.&quot;"
csb[17] = "Jonathan once again swore to David in his love for him, because he loved him as he loved himself.&quot;"
csb[18] = "Then Jonathan said to him, &quot;Tomorrow is the New Moon; you\'ll be missed because your seat will be empty.&quot;"
csb[19] = "&quot;The following day hurry down and go to the place where you hid on the day this incident began and stay beside the rock Ezel.&quot;"
csb[20] = "&quot;I will shoot three arrows beside it as if I\'m aiming at a target.&quot;"
csb[21] = "&quot;Then I will send a servant and say, \'Go and find the arrows! \' Now, if I expressly say to the servant, \'Look, the arrows are on this side of you -- get them,\' then come, because as the LORD lives, it is safe for you and there is no problem.&quot;"
csb[22] = "&quot;But if I say this to the youth, \'Look, the arrows are beyond you! \' then go, for the LORD is sending you away.&quot;"
csb[23] = "&quot;As for the matter you and I have spoken about, the LORD will be a witness between you and me forever.&quot;"
csb[24] = "So David hid in the countryside. At the New Moon, the king sat down to eat the meal.&quot;"
csb[25] = "He sat at his usual place on the seat by the wall. Jonathan sat facing him and Abner took his place beside Saul, but David\'s place was empty.&quot;"
csb[26] = "Saul did not say anything that day because he thought, &quot;Something unexpected has happened; he must be ceremonially unclean -- yes, that\'s it, he is unclean.&quot;"
csb[27] = "However, the day after the New Moon, the second day, David\'s place was still empty, and Saul asked his son Jonathan, &quot;Why didn\'t Jesse\'s son come to the meal either yesterday or today? &quot;"
csb[28] = "Jonathan answered, &quot;David asked for my permission to go to Bethlehem.&quot;"
csb[29] = "&quot;He said, \'Please let me go because our clan is holding a sacrifice in the town, and my brother has told me to be there. So now, if I have found favor with you, let me go so I can see my brothers.\' That\'s why he didn\'t come to the king\'s table.&quot;"
csb[30] = "Then Saul became angry with Jonathan and shouted, &quot;You son of a perverse and rebellious woman! Don\'t I know that you are siding with Jesse\'s son to your own shame and to the disgrace of your mother?&quot;"
csb[31] = "&quot;Every day Jesse\'s son lives on earth you and your kingship are not secure. Now send for him and bring him to me -- he must die! &quot;"
csb[32] = "Jonathan answered his father back: &quot;Why is he to be killed? What has he done? &quot;"
csb[33] = "Then Saul threw his spear at Jonathan to kill him, so he knew that his father was determined to kill David.&quot;"
csb[34] = "He got up from the table fiercely angry and did not eat any food that second day of the New Moon, for he was grieved because of his father\'s shameful behavior toward David.&quot;"
csb[35] = "In the morning Jonathan went out to the countryside for the appointed meeting with David. A young servant was with him.&quot;"
csb[36] = "He said to the servant, &quot;Run and find the arrows I\'m shooting.&quot; As the servant ran, Jonathan shot an arrow beyond him.&quot;"
csb[37] = "He came to the location of the arrow that Jonathan had shot, but Jonathan called to him and said, &quot;The arrow is beyond you, isn\'t it? &quot;"
csb[38] = "Then Jonathan called to him, &quot;Hurry up and don\'t stop! &quot; Jonathan\'s servant picked up the arrow and returned to his master.&quot;"
csb[39] = "He did not know anything; only Jonathan and David knew the arrangement.&quot;"
csb[40] = "Then Jonathan gave his equipment to the servant who was with him and said, &quot;Go, take it back to the city.&quot;"
csb[41] = "When the servant had gone, David got up from the south side of the stone Ezel, fell facedown to the ground, and payed homage three times. Then he and Jonathan kissed each other and wept with each other, though David wept more.&quot;"
csb[42] = "Jonathan then said to David, &quot;Go in the assurance the two of us pledged in the name of the LORD when we said: The LORD will be a witness between you and me and between my offspring and your offspring forever.&quot; Then David left, and Jonathan went into the city.&quot;"
kjv[1] = "And David fled from Naioth in Ramah, and came and said before Jonathan, What have I done? what [is] mine iniquity? and what [is] my sin before thy father, that he seeketh my life?";

asv[1] = "And David fled from Naioth in Ramah, and came and said before Jonathan, What have I done? what is mine iniquity? and what is my sin before thy father, that he seeketh my life?";
yng[1] = "And David fleeth from Naioth in Ramah, and cometh, and saith before Jonathan, `What have I done? what [is] mine iniquity? and what my sin before thy father, that he is seeking my life?\'";

vul[1] = "fugit autem David de Nahioth quae erat in Rama veniensque locutus est coram Ionathan quid feci quae est iniquitas mea et quod peccatum meum in patrem tuum quia quaerit animam meam";
kjv[2] = "And he said unto him, God forbid; thou shalt not die: behold, my father will do nothing either great or small, but that he will shew it me: and why should my father hide this thing from me? it [is] not [so].";
rsv[2] = "And he said to him, &quot;Far from it! You shall not die. Behold, my father does nothing either great or small without disclosing it to me; and why should my father hide this from me? It is not so.&quot;";
asv[2] = "And he said unto him, Far from it; thou shalt not die: behold, my father doeth nothing either great or small, but that he discloseth it unto me; and why should my father hide this thing from me? it is not so.";
yng[2] = "And he saith to him, `Far be it! thou dost not die; lo, my father doth not do anything great or small and doth not uncover mine ear; and wherefore doth my father hide from me this thing? this [thing] is not.\'";
dby[2] = "And he said to him, God forbid; thou shalt not die: behold, my father will do nothing either great or small, and not apprise me; and why should my father hide this thing from me? it is not so.";
web[2] = "And he said to him, Far be it from thee; thou shalt not die: behold, my father will do nothing, either great or small, but that he will show it to me: and why should my father hide this thing from me? it [is] not [so].";
hnv[2] = "He said to him, Far from it; you shall not die: behold, my father does nothing either great or small, but that he discloses it to me; and why should my father hide this thing from me? it is not so.";
vul[2] = "qui dixit ei absit non morieris neque enim faciet pater meus quicquam grande vel parvum nisi prius indicaverit mihi hunc ergo celavit me pater meus sermonem tantummodo nequaquam erit istud";
kjv[3] = "And David sware moreover, and said, Thy father certainly knoweth that I have found grace in thine eyes; and he saith, Let not Jonathan know this, lest he be grieved: but truly [as] the LORD liveth, and [as] thy soul liveth, [there is] but a step between me and death.";
rsv[3] = "But David replied, &quot;Your father knows well that I have found favor in your eyes; and he thinks, \'Let not Jonathan know this, lest he be grieved.\' But truly, as the LORD lives and as your soul lives, there is but a step between me and death.&quot;";
asv[3] = "And David sware moreover, and said, Thy father knoweth well that I have found favor in thine eyes; and he saith, Let not Jonathan know this, lest he be grieved: but truly as Jehovah liveth, and as thy soul liveth, there is but a step between me and death.";
yng[3] = "And David sweareth again, and saith, `Thy father hath certainly known that I have found grace in thine eyes, and he saith, Let not Jonathan know this, lest he be grieved; and yet, Jehovah liveth, and thy soul liveth, but -- as a step between me and death.\'";
dby[3] = "And David swore again and again, and said, Thy father certainly knows that I have found favour in thy sight: and he has thought, Jonathan shall not know this, lest he be grieved; but truly [as] Jehovah liveth, and [as] thy soul liveth, there is but a step between me and death.";
web[3] = "And David swore moreover, and said, Thy father certainly knoweth that I have found grace in thy eyes; and he saith, Let not Jonathan know this, lest he should be grieved: But truly [as] the LORD liveth, and [as] thy soul liveth, [there is] but a step between me and death.";
hnv[3] = "David swore moreover, and said, Your father knows well that I have found favor in your eyes; and he says, Don\'t let Yonatan know this, lest he be grieved: but truly as the LORD lives, and as your soul lives, there is but a step between me and death.";
vul[3] = "et iuravit rursum David et ille ait scit profecto pater tuus quia inveni gratiam in oculis tuis et dicet nesciat hoc Ionathan ne forte tristetur quinimmo vivit Dominus et vivit anima tua quia uno tantum ut ita dicam gradu ego morsque dividimur";

asv[4] = "Then said Jonathan unto David, Whatsoever thy soul desireth, I will even do it for thee.";
yng[4] = "And Jonathan saith to David, `What doth thy soul say? -- and I do it for thee.\'";
dby[4] = "And Jonathan said to David, What thy soul may say, I will even do it for thee.";
web[4] = "Then said Jonathan to David, Whatever thy soul desireth, I will even do [it] for thee.";
hnv[4] = "Then said Yonatan to David, Whatever your soul desires, I will even do it for you.";
vul[4] = "et ait Ionathan ad David quodcumque dixerit mihi anima tua faciam tibi";

asv[8] = "Therefore deal kindly with thy servant; for thou hast brought thy servant into a covenant of Jehovah with thee: but if there be in me iniquity, slay me thyself; for why shouldest thou bring me to thy father?";
yng[8] = "and thou hast done kindness, to thy servant, for into a covenant of Jehovah thou hast brought thy servant with thee; -- and if there is in me iniquity, put thou me to death; and unto thy father, why is this -- thou dost bring me in?\'";
dby[8] = "Deal kindly then with thy servant; for thou hast brought thy servant into a covenant of Jehovah with thee; but if there be in me iniquity, slay me thyself; for why shouldest thou bring me to thy father?";

kjv[9] = "And Jonathan said, Far be it from thee: for if I knew certainly that evil were determined by my father to come upon thee, then would not I tell it thee?";

asv[9] = "And Jonathan said, Far be it from thee; for if I should at all know that evil were determined by my father to come upon thee, then would not I tell it thee?";
yng[9] = "And Jonathan saith, `Far be it from thee! for I certainly do not know that the evil hath been determined by my father to come upon thee, and I do not declare it to thee.\'";
dby[9] = "And Jonathan said, Far be it from thee; for, if I knew with certainty that evil were determined by my father to come upon thee, would I not tell it thee?";
web[9] = "And Jonathan said, Far be it from thee: for if I knew certainly that evil is determined by my father to come upon thee, then would not I tell it thee?";
hnv[9] = "Yonatan said, Far be it from you; for if I should at all know that evil were determined by my father to come on you, then wouldn\'t I tell you that?";
vul[9] = "et ait Ionathan absit hoc a te neque enim fieri potest ut si certo cognovero conpletam patris mei esse malitiam contra te non adnuntiem tibi";

kjv[12] = "And Jonathan said unto David, O LORD God of Israel, when I have sounded my father about to morrow any time, [or] the third [day], and, behold, [if there be] good toward David, and I then send not unto thee, and shew it thee;";
rsv[12] = "And Jonathan said to David, &quot;The LORD, the God of Israel, be witness! When I have sounded my father, about this time tomorrow, or the third day, behold, if he is well disposed toward David, shall I not then send and disclose it to you?";
asv[12] = "And Jonathan said unto David, Jehovah, the God of Israel, [be witness]: when I have sounded my father about this time to-morrow, [or] the third day, behold, if there be good toward David, shall I not then send unto thee, and disclose it unto thee?";
yng[12] = "And Jonathan saith unto David, `Jehovah, God of Israel -- when I search my father, about [this] time to-morrow [or] the third [day], and lo, good [is] towards David, and I do not then send unto thee, and have uncovered thine ear --";
dby[12] = "And Jonathan said to David, Jehovah, God of Israel, when I sound my father about this time to-morrow, [or] the next day, and behold, there be good toward David, and I then send not to thee, and apprise thee of it,";
web[12] = "And Jonathan said to David, O LORD God of Israel, when I have sounded my father about to-morrow any time, [or] the third [day], and behold, [if there be] good towards David, and I then send not to thee, and show it thee;";
hnv[12] = "Yonatan said to David, the LORD, the God of Yisra\'el, [be witness]: when I have sounded my father about this time tomorrow, [or] the third day, behold, if there be good toward David, shall I not then send to you, and disclose it to you?";
vul[12] = "ait Ionathan ad David Domine Deus Israhel si investigavero sententiam patris mei crastino vel perendie et aliquid boni fuerit super David et non statim misero ad te et notum tibi fecero";
kjv[13] = "The LORD do so and much more to Jonathan: but if it please my father [to do] thee evil, then I will shew it thee, and send thee away, that thou mayest go in peace: and the LORD be with thee, as he hath been with my father.";
rsv[13] = "But should it please my father to do you harm, the LORD do so to Jonathan, and more also, if I do not disclose it to you, and send you away, that you may go in safety. May the LORD be with you, as he has been with my father.";
asv[13] = "Jehovah do so to Jonathan, and more also, should it please my father to do thee evil, if I disclose it not unto thee, and send thee away, that thou mayest go in peace: and Jehovah be with thee, as he hath been with my father.";
yng[13] = "thus doth Jehovah do to Jonathan, and thus doth He add; when the evil concerning thee is good to my father, then I have uncovered thine ear, and sent thee away, and thou hast gone in peace, and Jehovah is with thee, as he was with my father;";
dby[13] = "Jehovah do so and much more to Jonathan. Should it please my father [to do] thee evil, then I will apprise thee of it, and send thee away, that thou mayest go in peace; and Jehovah be with thee, as he has been with my father.";
web[13] = "The LORD do so and much more to Jonathan: but if it shall please my father [to do] thee evil, then I will show it to thee, and send thee away, that thou mayest go in peace: and the LORD be with thee, as he hath been with my father.";
hnv[13] = "The LORD do so to Yonatan, and more also, should it please my father to do you evil, if I don\'t disclose it to you, and send you away, that you may go in shalom: and the LORD be with you, as he has been with my father.";
vul[13] = "haec faciat Dominus Ionathan et haec augeat si autem perseveraverit patris mei malitia adversum te revelabo aurem tuam et dimittam te ut vadas in pace et sit Dominus tecum sicut fuit cum patre meo";
kjv[14] = "And thou shalt not only while yet I live shew me the kindness of the LORD, that I die not:";
rsv[14] = "If I am still alive, show me the loyal love of the LORD, that I may not die;";
asv[14] = "And thou shalt not only while yet I live show me the lovingkindness of Jehovah, that I die not;";
yng[14] = "and not only while I am alive dost thou do with me the kindness of Jehovah, and I die not,";
dby[14] = "And thou shalt not only while yet I live shew me the kindness of Jehovah, that I die not,";
web[14] = "And thou shalt, not only while yet I live, show me the kindness of the LORD, that I may not die:";
hnv[14] = "You shall not only while yet I live show me the lovingkindness of the LORD, that I not die;";
vul[14] = "et si vixero facies mihi misericordiam Domini si vero mortuus fuero";
kjv[15] = "But [also] thou shalt not cut off thy kindness from my house for ever: no, not when the LORD hath cut off the enemies of David every one from the face of the earth.";
rsv[15] = "and do not cut off your loyalty from my house for ever. When the LORD cuts off every one of the enemies of David from the face of the earth,";
asv[15] = "but also thou shalt not cut off thy kindness from my house for ever; no, not when Jehovah hath cut off the enemies of David every one from the face of the earth.";
yng[15] = "but thou dost not cut off thy kindness from my house unto the age, nor in Jehovah\'s cutting off the enemies of David, each one from off the face of the ground.\'";
dby[15] = "but thou shalt not cut off thy kindness from my house for ever, no, not when Jehovah cuts off the enemies of David, every one from the face of the earth.";
web[15] = "But [also] thou shalt not withdraw thy kindness from my house for ever: no, not when the LORD hath cut off the enemies of David every one from the face of the earth.";
hnv[15] = "but also you shall not cut off your kindness from my house forever; no, not when the LORD has cut off the enemies of David everyone from the surface of the eretz.";
vul[15] = "non auferas misericordiam tuam a domo mea usque in sempiternum quando eradicaverit Dominus inimicos David unumquemque de terra";
kjv[16] = "So Jonathan made [a covenant] with the house of David, [saying], Let the LORD even require [it] at the hand of David\'s enemies.";
rsv[16] = "let not the name of Jonathan be cut off from the house of David. And may the LORD take vengeance on David\'s enemies.&quot;";
asv[16] = "So Jonathan made a covenant with the house of David, [saying], And Jehovah will require it at the hand of David\'s enemies.";
yng[16] = "And Jonathan covenanteth with the house of David, and Jehovah hath sought [it] from the hand of the enemies of David;";
dby[16] = "And Jonathan made [a covenant] with the house of David, [saying,] Let Jehovah even require [it] at the hand of David\'s enemies!";
web[16] = "So Jonathan made [a covenant] with the house of David, [saying], Let the LORD even require [it] at the hand of David\'s enemies.";
hnv[16] = "So Yonatan made a covenant with the house of David, [saying], the LORD will require it at the hand of David\'s enemies.";
vul[16] = "pepigit ergo foedus Ionathan cum domo David et requisivit Dominus de manu inimicorum David";
kjv[17] = "And Jonathan caused David to swear again, because he loved him: for he loved him as he loved his own soul.";
rsv[17] = "And Jonathan made David swear again by his love for him; for he loved him as he loved his own soul.";
asv[17] = "And Jonathan caused David to swear again, for the love that he had to him; for he loved him as he loved his own soul.";
yng[17] = "and Jonathan addeth to cause David to swear, because he loveth him, for with the love of his own soul he hath loved him.";
dby[17] = "And Jonathan caused David to swear again, by the love he had for him, for he loved him as he loved his own soul.";
web[17] = "And Jonathan caused David to swear again, because he loved him: for he loved him as he loved his own soul.";
hnv[17] = "Yonatan caused David to swear again, for the love that he had to him; for he loved him as he loved his own soul.";
vul[17] = "et addidit Ionathan deierare David eo quod diligeret illum sicut animam enim suam ita diligebat eum";
kjv[18] = "Then Jonathan said to David, To morrow [is] the new moon: and thou shalt be missed, because thy seat will be empty.";
rsv[18] = "Then Jonathan said to him, &quot;Tomorrow is the new moon; and you will be missed, because your seat will be empty.";
asv[18] = "Then Jonathan said unto him, To-morrow is the new moon: and thou wilt be missed, because thy seat will be empty.";
yng[18] = "And Jonathan saith to him, `To-morrow [is] new moon, and thou hast been looked after, for thy seat is looked after;";
dby[18] = "And Jonathan said to him, To-morrow is the new moon; and thou wilt be missed, for thy seat will be empty;";
web[18] = "Then Jonathan said to David, To-morrow [is] the new-moon: and thou wilt be missed, because thy seat will be empty.";
hnv[18] = "Then Yonatan said to him, Tomorrow is the new moon: and you will be missed, because your seat will be empty.";
vul[18] = "dixitque ad eum Ionathan cras kalendae sunt et requireris";
kjv[19] = "And [when] thou hast stayed three days, [then] thou shalt go down quickly, and come to the place where thou didst hide thyself when the business was [in hand], and shalt remain by the stone Ezel.";
rsv[19] = "And on the third day you will be greatly missed; then go to the place where you hid yourself when the matter was in hand, and remain beside yonder stone heap.";
asv[19] = "And when thou hast stayed three days, thou shalt go down quickly, and come to the place where thou didst hide thyself when the business was in hand, and shalt remain by the stone Ezel.";
yng[19] = "and on the third day thou dost certainly come down, and hast come in unto the place where thou wast hidden in the day of the work, and hast remained near the stone Ezel.";
dby[19] = "but on the third day thou shalt go down quickly, and come to the place where thou didst hide thyself on the day of the business, and abide by the stone Ezel.";
web[19] = "And [when] thou hast stayed three days, [then] thou shalt go down quickly, and come to the place where thou didst hide thyself when the business was [in hand], and shalt remain by the stone Ezel.";
hnv[19] = " When you have stayed three days, you shall go down quickly, and come to the place where you did hide yourself when the business was in hand, and shall remain by the stone Ezel.";
vul[19] = "requiretur enim sessio tua usque perendie descendes ergo festinus et venies in locum ubi celandus es in die qua operari licet et sedebis iuxta lapidem cui est nomen Ezel";
kjv[20] = "And I will shoot three arrows on the side [thereof], as though I shot at a mark.";
rsv[20] = "And I will shoot three arrows to the side of it, as though I shot at a mark.";
asv[20] = "And I will shoot three arrows on the side thereof, as though I shot at a mark.";
yng[20] = "`And I shoot three of the arrows at the side, sending out for myself at a mark;";
dby[20] = "And I will shoot three arrows on the side of it, as though I shot at a mark.";
web[20] = "And I will shoot three arrows on the side [of it], as though I shot at a mark.";
hnv[20] = "I will shoot three arrows on the side of it, as though I shot at a mark.";
vul[20] = "et ego tres sagittas mittam iuxta eum et iaciam quasi exercens me ad signum";
kjv[21] = "And, behold, I will send a lad, [saying], Go, find out the arrows. If I expressly say unto the lad, Behold, the arrows [are] on this side of thee, take them; then come thou: for [there is] peace to thee, and no hurt; [as] the LORD liveth.";
rsv[21] = "And behold, I will send the lad, saying, \'Go, find the arrows.\' If I say to the lad, \'Look, the arrows are on this side of you, take them,\' then you are to come, for, as the LORD lives, it is safe for you and there is no danger.";
asv[21] = "And, behold, I will send the lad, [saying], Go, find the arrows. If I say unto the lad, Behold, the arrows are on this side of thee; take them, and come; for there is peace to thee and no hurt, as Jehovah liveth.";
yng[21] = "and lo, I send the youth: Go, find the arrows. If I at all say to the youth, Lo, the arrows [are] on this side of thee -- take them, -- then come thou, for peace [is] for thee, and there is nothing; Jehovah liveth.";
dby[21] = "And behold, I will send the lad, [saying,] Go, find the arrows. If I expressly say to the lad, Behold, the arrows are on this side of thee, take them; then come, for there is peace for thee, and it is nothing; [as] Jehovah liveth.";
web[21] = "And behold, I will send a lad, [saying], Go, find the arrows. If I expressly say to the lad, Behold, the arrows [are] on this side of thee, take them; then come thou: for [there is] peace to thee, and no hurt; [as] the LORD liveth.";
hnv[21] = "Behold, I will send the boy, [saying], Go, find the arrows. If I tell the boy, Behold, the arrows are on this side of you; take them, and come; for there is shalom to you and no hurt, as the LORD lives.";
vul[21] = "mittam quoque et puerum dicens ei vade et adfer mihi sagittas";
kjv[22] = "But if I say thus unto the young man, Behold, the arrows [are] beyond thee; go thy way: for the LORD hath sent thee away.";
rsv[22] = "But if I say to the youth, \'Look, the arrows are beyond you,\' then go; for the LORD has sent you away.";
asv[22] = "But if I say thus unto the boy, Behold, the arrows are beyond thee; go thy way; for Jehovah hath sent thee away.";
yng[22] = "And if thus I say to the young man, Lo, the arrows [are] beyond thee, -- go, for Jehovah hath sent thee away;";
dby[22] = "But if I say thus to the youth: Behold, the arrows are beyond thee, -- go thy way; for Jehovah sends thee away.";
web[22] = "But if I say thus to the young man, Behold, the arrows [are] beyond thee; go thy way: for the LORD hath sent thee away.";
hnv[22] = "But if I say thus to the boy, Behold, the arrows are beyond you; go your way; for the LORD has sent you away.";
vul[22] = "si dixero puero ecce sagittae intra te sunt tolle eas tu veni ad me quia pax tibi est et nihil est mali vivit Dominus si autem sic locutus fuero puero ecce sagittae ultra te sunt vade quia dimisit te Dominus";
kjv[23] = "And [as touching] the matter which thou and I have spoken of, behold, the LORD [be] between thee and me for ever.";
rsv[23] = "And as for the matter of which you and I have spoken, behold, the LORD is between you and me for ever.&quot;";
asv[23] = "And as touching the matter which thou and I have spoken of, behold, Jehovah is between thee and me for ever.";
yng[23] = "as to the thing which we have spoken, I and thou, lo, Jehovah [is] between me and thee -- unto the age.\'";
dby[23] = "And as to the matter which thou and I have spoken of, behold, Jehovah is between me and thee for ever.";
web[23] = "And [as to] the matter which thou and I have spoken of, behold, the LORD [be] between thee and me for ever.";
hnv[23] = "As touching the matter which you and I have spoken of, behold, the LORD is between you and me forever.";
vul[23] = "de verbo autem quod locuti fuimus ego et tu sit Dominus inter me et te usque in sempiternum";
kjv[24] = "So David hid himself in the field: and when the new moon was come, the king sat him down to eat meat.";
rsv[24] = "So David hid himself in the field; and when the new moon came, the king sat down to eat food.";
asv[24] = "So David hid himself in the field: and when the new moon was come, the king sat him down to eat food.";
yng[24] = "And David is hidden in the field, and it is the new moon, and the king sitteth down by the food to eat,";
dby[24] = "And David hid himself in the field; and it was the new moon, and the king sat at table to eat.";
web[24] = "So David hid himself in the field: and when the new-moon had come, the king sat down to eat food.";
hnv[24] = " So David hid himself in the field: and when the new moon was come, the king sat him down to eat food.";
vul[24] = "absconditus est ergo David in agro et venerunt kalendae et sedit rex ad comedendum panem";
kjv[25] = "And the king sat upon his seat, as at other times, [even] upon a seat by the wall: and Jonathan arose, and Abner sat by Saul\'s side, and David\'s place was empty.";
rsv[25] = "The king sat upon his seat, as at other times, upon the seat by the wall; Jonathan sat opposite, and Abner sat by Saul\'s side, but David\'s place was empty.";
asv[25] = "And the king sat upon his seat, as at other times, even upon the seat by the wall; and Jonathan stood up, and Abner sat by Saul\'s side: but David\'s place was empty.";
yng[25] = "and the king sitteth on his seat, as time by time, on a seat by the wall, and Jonathan riseth, and Abner sitteth at the side of Saul, and David\'s place is looked after.";
dby[25] = "And the king sat on his seat, as at other times, on the seat by the wall; and Jonathan arose, and Abner sat by Saul\'s side, and David\'s place was empty.";
web[25] = "And the king sat upon his seat, as at other times, [even] upon a seat by the wall: and Jonathan arose, and Abner sat by Saul\'s side, and David\'s place was empty.";
hnv[25] = "The king sat on his seat, as at other times, even on the seat by the wall; and Yonatan stood up, and Aviner sat by Sha\'ul\'s side: but David\'s place was empty.";
vul[25] = "cumque sedisset rex super cathedram suam secundum consuetudinem quae erat iuxta parietem surrexit Ionathan et sedit Abner ex latere Saul vacuusque apparuit locus David";
kjv[26] = "Nevertheless Saul spake not any thing that day: for he thought, Something hath befallen him, he [is] not clean; surely he [is] not clean.";
rsv[26] = "Yet Saul did not say anything that day; for he thought, &quot;Something has befallen him; he is not clean, surely he is not clean.&quot;";
asv[26] = "Nevertheless Saul spake not anything that day: for he thought, Something hath befallen him, he is not clean; surely he is not clean.";
yng[26] = "And Saul hath not spoken anything on that day, for he said, `It [is] an accident; he is not clean -- surely not clean.\'";
dby[26] = "And Saul said nothing that day; for he thought, Something has befallen [him], that he is not clean: surely he is not clean.";
web[26] = "Nevertheless Saul spoke not any thing that day: for he thought, Something hath befallen him, he [is] not clean; surely he [is] not clean.";
hnv[26] = " Nevertheless Sha\'ul didn\'t say anything that day: for he thought, Something has happened to him. He is not clean. Surely he is not clean.";
vul[26] = "et non est locutus Saul quicquam in die illa cogitabat enim quod forte evenisset ei ut non esset mundus nec purificatus";
kjv[27] = "And it came to pass on the morrow, [which was] the second [day] of the month, that David\'s place was empty: and Saul said unto Jonathan his son, Wherefore cometh not the son of Jesse to meat, neither yesterday, nor to day?";
rsv[27] = "But on the second day, the morrow after the new moon, David\'s place was empty. And Saul said to Jonathan his son, &quot;Why has not the son of Jesse come to the meal, either yesterday or today?&quot;";
asv[27] = "And it came to pass on the morrow after the new moon, [which was] the second [day], that David\'s place was empty: and Saul said unto Jonathan his son, Wherefore cometh not the son of Jesse to meat, neither yesterday, nor to-day?";
yng[27] = "And it cometh to pass on the second morrow of the new moon, that David\'s place is looked after, and Saul saith unto Jonathan his son, `Wherefore hath the son of Jesse not come in, either yesterday or to-day, unto the food?\'";
dby[27] = "And it came to pass the next day after the new moon, the second [day of the month], as David\'s place was empty, that Saul said to Jonathan his son, Why has not the son of Jesse come to table, neither yesterday nor to-day?";
web[27] = "And it came to pass on the morrow, [which was] the second [day] of the month, that David\'s place was empty: and Saul said to Jonathan his son, Why cometh not the son of Jesse to eat, neither yesterday, nor to-day?";
hnv[27] = "It happened on the next day after the new moon, [which was] the second [day], that David\'s place was empty: and Sha\'ul said to Yonatan his son, Why doesn\'t the son of Yishai come to meat, neither yesterday, nor today?";
vul[27] = "cumque inluxisset dies secunda post kalendas rursum vacuus apparuit locus David dixitque Saul ad Ionathan filium suum cur non venit filius Isai nec heri nec hodie ad vescendum";
kjv[28] = "And Jonathan answered Saul, David earnestly asked [leave] of me [to go] to Bethlehem:";
rsv[28] = "Jonathan answered Saul, &quot;David earnestly asked leave of me to go to Bethlehem;";
asv[28] = "And Jonathan answered Saul, David earnestly asked leave of me to go to Beth-lehem:";
yng[28] = "And Jonathan answereth Saul, `David hath been earnestly asked of me unto Beth-Lehem,";
dby[28] = "And Jonathan answered Saul, David earnestly asked leave of me [to go] to Bethlehem,";
web[28] = "And Jonathan answered Saul, David earnestly asked [leave] of me [to go] to Beth-lehem:";
hnv[28] = "Yonatan answered Sha\'ul, David earnestly asked leave of me to go to Beit-Lechem:";
vul[28] = "et respondit Ionathan Sauli rogavit me obnixe ut iret in Bethleem";
kjv[29] = "And he said, Let me go, I pray thee; for our family hath a sacrifice in the city; and my brother, he hath commanded me [to be there]: and now, if I have found favour in thine eyes, let me get away, I pray thee, and see my brethren. Therefore he cometh not unto the king\'s table.";
rsv[29] = "he said, \'Let me go; for our family holds a sacrifice in the city, and my brother has commanded me to be there. So now, if I have found favor in your eyes, let me get away, and see my brothers.\' For this reason he has not come to the king\'s table.&quot;";
asv[29] = "and he said, Let me go, I pray thee; for our family hath a sacrifice in the city; and my brother, he hath commanded me [to be there]: and now, if I have found favor in thine eyes, let me get away, I pray thee, and see my brethren. Therefore he is not come unto the king\'s table.";
yng[29] = "and he saith, Send me away, I pray thee, for a family sacrifice we have in the city, and my brother himself hath given command to me, and now, if I have found grace in thine eyes, let me go away, I pray thee, and see my brethren; therefore he hath not come unto the table of the king.\'";
dby[29] = "and said, Let me go, I pray thee; for we have a family sacrifice in the city; and my brother himself has commanded me [to be there]; and now, if I have found favour in thy sight, let me go away, I pray thee, and see my brethren. He has therefore not come to the king\'s table.";
web[29] = "And he said, Let me go, I pray thee; for our family hath a sacrifice in the city; and my brother he hath commanded me [to be there]: and now if I have found favor in thy eyes, let me get away, I pray thee, and see my brethren. Therefore he cometh not to the king\'s table.";
hnv[29] = "and he said, Please let me go, for our family has a sacrifice in the city; and my brother, he has commanded me [to be there]: and now, if I have found favor in your eyes, let me get away, I pray you, and see my brothers. Therefore he is not come to the king\'s table.";
vul[29] = "et ait dimitte me quoniam sacrificium sollemne est in civitate unus de fratribus meis accersivit me nunc ergo si inveni gratiam in oculis tuis vadam cito et videbo fratres meos ob hanc causam non venit ad mensam regis";
kjv[30] = "Then Saul\'s anger was kindled against Jonathan, and he said unto him, Thou son of the perverse rebellious [woman], do not I know that thou hast chosen the son of Jesse to thine own confusion, and unto the confusion of thy mother\'s nakedness?";
rsv[30] = "Then Saul\'s anger was kindled against Jonathan, and he said to him, &quot;You son of a perverse, rebellious woman, do I not know that you have chosen the son of Jesse to your own shame, and to the shame of your mother\'s nakedness?";
asv[30] = "Then Saul\'s anger was kindled against Jonathan, and he said unto him, Thou son of a perverse rebellious woman, do not I know that thou hast chosen the son of Jesse to thine own shame, and unto the shame of thy mother\'s nakedness?";
yng[30] = "And the anger of Saul burneth against Jonathan, and he saith to him, `Son of a perverse rebellious woman! have I not known that thou art fixing on the son of Jesse to thy shame, and to the shame of the nakedness of thy mother?";
dby[30] = "And Saul\'s anger was kindled against Jonathan, and he said to him, Son of the perverse rebellious woman, do not I know that thou hast chosen the son of Jesse to thine own shame and to the shame of thy mother\'s nakedness?";
web[30] = "Then Saul\'s anger was kindled against Jonathan, and he said to him, Thou son of the perverse rebellious [woman], do not I know that thou hast chosen the son of Jesse to thy own confusion, and to the confusion of thy mother\'s nakedness?";
hnv[30] = "Then Sha\'ul\'s anger was kindled against Yonatan, and he said to him, You son of a perverse rebellious woman, don\'t I know that you have chosen the son of Yishai to your own shame, and to the shame of your mother\'s nakedness?";
vul[30] = "iratus autem Saul adversus Ionathan dixit ei fili mulieris virum ultro rapientis numquid ignoro quia diligis filium Isai in confusionem tuam et in confusionem ignominiosae matris tuae";
kjv[31] = "For as long as the son of Jesse liveth upon the ground, thou shalt not be established, nor thy kingdom. Wherefore now send and fetch him unto me, for he shall surely die.";
rsv[31] = "For as long as the son of Jesse lives upon the earth, neither you nor your kingdom shall be established. Therefore send and fetch him to me, for he shall surely die.&quot;";
asv[31] = "For as long as the son of Jesse liveth upon the ground, thou shalt not be established, nor thy kingdom. Wherefore now send and fetch him unto me, for he shall surely die.";
yng[31] = "for all the days that the son of Jesse liveth on the ground thou art not established, thou and thy kingdom; and now, send and bring him unto me, for he [is] a son of death.\'";
dby[31] = "For as long as the son of Jesse lives upon earth, thou shalt not be established, nor thy kingdom. And now send and fetch him to me, for he must die.";
web[31] = "For as long as the son of Jesse liveth upon the earth, thou shalt not be established, nor thy kingdom. Wherefore now send and bring him to me, for he shall surely die.";
hnv[31] = "For as long as the son of Yishai lives on the eretz, you shall not be established, nor your kingdom. Therefore now send and bring him to me, for he shall surely die.";
vul[31] = "omnibus enim diebus quibus filius Isai vixerit super terram non stabilieris tu neque regnum tuum itaque iam nunc mitte et adduc eum ad me quia filius mortis est";
kjv[32] = "And Jonathan answered Saul his father, and said unto him, Wherefore shall he be slain? what hath he done?";
rsv[32] = "Then Jonathan answered Saul his father, &quot;Why should he be put to death? What has he done?&quot;";
asv[32] = "And Jonathan answered Saul his father, and said unto him, Wherefore should he be put to death? what hath he done?";
yng[32] = "And Jonathan answereth Saul his father, and saith unto him, `Why is he put to death? what hath he done?\'";
dby[32] = "And Jonathan answered Saul his father, and said to him, Why should he be put to death? what has he done?";
web[32] = "And Jonathan answered Saul his father, and said to him, Why shall he be slain? what hath he done?";
hnv[32] = "Yonatan answered Sha\'ul his father, and said to him, &quot;Why should he be put to death? What has he done?&quot;";
vul[32] = "respondens autem Ionathan Sauli patri suo ait quare moritur quid fecit";
kjv[33] = "And Saul cast a javelin at him to smite him: whereby Jonathan knew that it was determined of his father to slay David.";
rsv[33] = "But Saul cast his spear at him to smite him; so Jonathan knew that his father was determined to put David to death.";
asv[33] = "And Saul cast his spear at him to smite him; whereby Jonathan knew that it was determined of his father to put David to death.";
yng[33] = "And Saul casteth the javelin at him to smite him, and Jonathan knoweth that it hath been determined by his father to put David to death.";
dby[33] = "Then Saul cast the spear at him to smite him; and Jonathan knew that it was determined by his father to put David to death.";
web[33] = "And Saul cast a javelin at him to smite him: by which Jonathan knew that it was determined by his father to slay David.";
hnv[33] = "Sha\'ul cast his spear at him to strike him. By this Yonatan knew that his father was determined to put David to death.";
vul[33] = "et arripuit Saul lanceam ut percuteret eum et intellexit Ionathan quod definitum esset patri suo ut interficeret David";
kjv[34] = "So Jonathan arose from the table in fierce anger, and did eat no meat the second day of the month: for he was grieved for David, because his father had done him shame.";
rsv[34] = "And Jonathan rose from the table in fierce anger and ate no food the second day of the month, for he was grieved for David, because his father had disgraced him.";
asv[34] = "So Jonathan arose from the table in fierce anger, and did eat no food the second day of the month; for he was grieved for David, because his father had done him shame.";
yng[34] = "And Jonathan riseth from the table in the heat of anger, and hath not eaten food on the second day of the new moon, for he hath been grieved for David, for his father put him to shame.";
dby[34] = "And Jonathan arose from the table in fierce anger, and ate no meat the second day of the new moon; for he was grieved for David, because his father had done him shame.";
web[34] = "So Jonathan arose from the table in fierce anger, and ate no food the second day of the month: for he was grieved for David, because his father had done him shame.";
hnv[34] = "So Yonatan arose from the table in fierce anger, and ate no food the second day of the month; for he was grieved for David, because his father had done him shame.";
vul[34] = "surrexit ergo Ionathan a mensa in ira furoris et non comedit in die kalendarum secunda panem contristatus est enim super David eo quod confudisset eum pater suus";
kjv[35] = "And it came to pass in the morning, that Jonathan went out into the field at the time appointed with David, and a little lad with him.";
rsv[35] = "In the morning Jonathan went out into the field to the appointment with David, and with him a little lad.";
asv[35] = "And it came to pass in the morning, that Jonathan went out into the field at the time appointed with David, and a little lad with him.";
yng[35] = "And it cometh to pass in the morning, that Jonathan goeth out into the field for the appointment with David, and a little youth [is] with him.";
dby[35] = "And it came to pass in the morning that Jonathan went out into the field, to the place agreed on with David, and a little lad with him.";
web[35] = "And it came to pass in the morning, that Jonathan went out into the field at the time appointed with David, and a little lad with him.";
hnv[35] = "It happened in the morning, that Yonatan went out into the field at the time appointed with David, and a little boy with him.";
vul[35] = "cumque inluxisset mane venit Ionathan in agrum iuxta placitum David et puer parvulus cum eo";
kjv[36] = "And he said unto his lad, Run, find out now the arrows which I shoot. [And] as the lad ran, he shot an arrow beyond him.";
rsv[36] = "And he said to his lad, &quot;Run and find the arrows which I shoot.&quot; As the lad ran, he shot an arrow beyond him.";
asv[36] = "And he said unto his lad, Run, find now the arrows which I shoot. And as the lad ran, he shot an arrow beyond him.";
yng[36] = "And he saith to his youth, `Run, find, I pray thee, the arrows which I am shooting;\' the youth is running, and he hath shot the arrow, causing [it] to pass over him.";
dby[36] = "And he said to his lad, Run, find now the arrows which I shoot. The lad ran, and he shot the arrow beyond him.";
web[36] = "And he said to his lad, Run, find now the arrows which I shoot. [And] as the lad ran, he shot an arrow, beyond him.";
hnv[36] = "He said to his boy, Run, find now the arrows which I shoot. As the boy ran, he shot an arrow beyond him.";
vul[36] = "et ait ad puerum suum vade et adfer mihi sagittas quas ego iacio cumque puer cucurrisset iecit aliam sagittam trans puerum";

yng[37] = "And the youth cometh unto the place of the arrow which Jonathan hath shot, and Jonathan calleth after the youth, and saith, `Is not the arrow beyond thee?\'";
dby[37] = "And when the lad came to the place of the arrow which Jonathan had shot, Jonathan cried after the lad and said, Is not the arrow away beyond thee?";
web[37] = "And when the lad had come to the place of the arrow which Jonathan had shot, Jonathan cried after the lad, and said, [Is] not the arrow beyond thee?";
hnv[37] = "When the boy was come to the place of the arrow which Yonatan had shot, Yonatan cried after the boy, and said, Isn\'t the arrow beyond you?";
vul[37] = "venit itaque puer ad locum iaculi quod miserat Ionathan et clamavit Ionathan post tergum pueri et ait ecce ibi est sagitta porro ultra te";
kjv[38] = "And Jonathan cried after the lad, Make speed, haste, stay not. And Jonathan\'s lad gathered up the arrows, and came to his master.";
rsv[38] = "And Jonathan called after the lad, &quot;Hurry, make haste, stay not.&quot; So Jonathan\'s lad gathered up the arrows, and came to his master.";
asv[38] = "And Jonathan cried after the lad, Make speed, haste, stay not. And Jonathan\'s lad gathered up the arrows, and came to his master.";
yng[38] = "and Jonathan calleth after the youth, `Speed, haste, stand not;\' and Jonathan\'s youth gathereth the arrows, and cometh unto his lord.";
dby[38] = "And Jonathan cried after the lad, Make speed, haste, stay not! And Jonathan\'s lad gathered up the arrows, and came to his master.";
web[38] = "And Jonathan cried after the lad, Make speed, haste, stay not. And Jonathan\'s lad gathered up the arrows, and came to his master.";
hnv[38] = "Yonatan cried after the boy, Go fast! Hurry! Don\'t delay! Yonatan\'s boy gathered up the arrows, and came to his master.";
vul[38] = "clamavitque Ionathan post tergum pueri festina velociter ne steteris collegit autem puer Ionathae sagittas et adtulit ad dominum suum";
kjv[39] = "But the lad knew not any thing: only Jonathan and David knew the matter.";
rsv[39] = "But the lad knew nothing; only Jonathan and David knew the matter.";
asv[39] = "But the lad knew not anything: only Jonathan and David knew the matter.";
yng[39] = "And the youth hath not known anything, only Jonathan and David knew the word.";
dby[39] = "And the lad knew nothing: only Jonathan and David knew the matter.";
web[39] = "But the lad knew not any thing: only Jonathan and David knew the matter.";
hnv[39] = " But the boy didn\'t know anything: only Yonatan and David knew the matter.";

asv[40] = "And Jonathan gave his weapons unto his lad, and said unto him, Go, carry them to the city.";

dby[40] = "And Jonathan gave his weapons to his lad, and said to him, Go, carry them to the city.";

hnv[40] = "Yonatan gave his weapons to his boy, and said to him, Go, carry them to the city.";

kjv[41] = "[And] as soon as the lad was gone, David arose out of [a place] toward the south, and fell on his face to the ground, and bowed himself three times: and they kissed one another, and wept one with another, until David exceeded.";
rsv[41] = "And as soon as the lad had gone, David rose from beside the stone heap and fell on his face to the ground, and bowed three times; and they kissed one another, and wept with one another, until David recovered himself.";
asv[41] = "And as soon as the lad was gone, David arose out of [a place] toward the South, and fell on his face to the ground, and bowed himself three times: and they kissed one another, and wept one with another, until David exceeded.";
yng[41] = "The youth hath gone, and David hath risen from Ezel, at the south, and falleth on his face to the earth, and boweth himself three times, and they kiss one another, and they weep one with another, till David exerted himself;";
dby[41] = "The lad went, and David arose from the side of the south, and fell on his face to the ground, and bowed himself three times; and they kissed one another, and wept one with another, until David exceeded.";

kjv[42] = "And Jonathan said to David, Go in peace, forasmuch as we have sworn both of us in the name of the LORD, saying, The LORD be between me and thee, and between my seed and thy seed for ever. And he arose and departed: and Jonathan went into the city.";
rsv[42] = "Then Jonathan said to David, &quot;Go in peace, forasmuch as we have sworn both of us in the name of the LORD, saying, \'The LORD shall be between me and you, and between my descendants and your descendants, for ever.\'&quot; And he rose and departed; and Jonathan went into the city.";
asv[42] = "And Jonathan said to David, Go in peace, forasmuch as we have sworn both of us in the name of Jehovah, saying, Jehovah shall be between me and thee, and between my seed and thy seed, for ever. And he arose and departed: and Jonathan went into the city.";
yng[42] = "and Jonathan saith to David, `Go in peace, in that we have sworn -- we two -- in the name of Jehovah, saying, Jehovah is between me and thee, and between my seed and thy seed -- unto the age;\' and he riseth and goeth; and Jonathan hath gone in to the city.";
dby[42] = "And Jonathan said to David, Go in peace, forasmuch as we have both of us sworn in the name of Jehovah, saying, Jehovah be between me and thee, and between my seed and thy seed for ever! And he arose and departed; and Jonathan went into the city.";
web[42] = "And Jonathan said to David, Go in peace, forasmuch as we have sworn both of us in the name of the LORD, saying, The LORD be between me and thee, and between my seed and thy seed for ever. And he arose and departed: and Jonathan went into the city.";
hnv[42] = "Yonatan said to David, Go in shalom, because we have sworn both of us in the name of the LORD, saying, the LORD shall be between me and you, and between my seed and your seed, forever. He arose and departed: and Yonatan went into the city.";
vul[42] = "dixit ergo Ionathan ad David vade in pace quaecumque iuravimus ambo in nomine Domini dicentes Dominus sit inter me et te et inter semen meum et semen tuum usque in sempiternum [Vulgate 20:43] et surrexit et abiit sed et Ionathan ingressus est civitatem";
