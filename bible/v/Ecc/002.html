csb[1] = "I said to myself, &quot;Go ahead, I will test you with pleasure; enjoy what is good.&quot; But it turned out to be futile.";
csb[2] = "I said about laughter, &quot;It is madness,&quot; and about pleasure, &quot;What does this accomplish? &quot;";
csb[3] = "I explored with my mind the pull of wine on my body -- my mind still guiding me with wisdom -- and how to grasp folly, until I could see what is good for people to do under heaven during the few days of their lives.";
csb[4] = "I increased my achievements. I built houses and planted vineyards for myself.";
csb[5] = "I made gardens and parks for myself and planted every kind of fruit tree in them.";
csb[6] = "I constructed reservoirs for myself from which to irrigate a grove of flourishing trees.";
csb[7] = "I acquired male and female servants and had slaves who were born in my house. I also owned livestock -- large herds and flocks -- more than all who were before me in Jerusalem.";
csb[8] = "I also amassed silver and gold for myself, and the treasure of kings and provinces. I gathered male and female singers for myself, and many concubines, the delights of men.";
csb[9] = "So I became great and surpassed all who were before me in Jerusalem; my wisdom also remained with me.";
csb[10] = "All that my eyes desired, I did not deny them. I did not refuse myself any pleasure, for I took pleasure in all my struggles. This was my reward for all my struggles.";
csb[11] = "When I considered all that I had accomplished and what I had labored to achieve, I found everything to be futile and a pursuit of the wind. There was nothing to be gained under the sun.";
csb[12] = "Then I turned to consider wisdom, madness, and folly, for what will the king\'s successor be like? He will do what has already been done.";
csb[13] = "And I realized that there is an advantage to wisdom over folly, like the advantage of light over darkness.";
csb[14] = "The wise person has eyes in his head, but the fool walks in darkness. Yet I also knew that one fate comes to them both.";
csb[15] = "So I said to myself, &quot;What happens to the fool will also happen to me. Why then have I been overly wise? &quot; And I said to myself that this is also futile.";
csb[16] = "For, just like the fool, there is no lasting remembrance of the wise, since in the days to come both will be forgotten. How is it that the wise person dies just like the fool?";
csb[17] = "Therefore, I hated life because the work that was done under the sun was distressing to me. For everything is futile and a pursuit of the wind.";
csb[18] = "I hated all my work that I labored at under the sun because I must leave it to the one who comes after me.";
csb[19] = "And who knows whether he will be wise or a fool? Yet he will take over all my work that I labored at skillfully under the sun. This too is futile.";
csb[20] = "So I began to give myself over to despair concerning all my work that I had labored at under the sun.";
csb[21] = "When there is a person whose work was done with wisdom, knowledge, and skill, and he must give his portion to a person who has not worked for it, this too is futile and a great wrong.";
csb[22] = "For what does a person get with all his work and all his efforts that he labors at under the sun?";
csb[23] = "For all his days are filled with grief, and his occupation is sorrowful; even at night, his mind does not rest. This too is futile.";
csb[24] = "There is nothing better for a person than to eat, drink, and enjoy his work. I have seen that even this is from God\'s hand,";
csb[25] = "because who can eat and who can enjoy life apart from him?";
csb[26] = "For to the person who is pleasing in his sight, he gives wisdom, knowledge, and joy; but to the sinner he gives the task of gathering and accumulating in order to give to the one who is pleasing in God\'s sight. This too is futile and a pursuit of the wind.";
kjv[1] = "I said in mine heart, Go to now, I will prove thee with mirth, therefore enjoy pleasure: and, behold, this also [is] vanity.";
rsv[1] = "I said to myself, &quot;Come now, I will make a test of pleasure; enjoy yourself.&quot; But behold, this also was vanity.";
asv[1] = "I said in my heart, Come now, I will prove thee with mirth; therefore enjoy pleasure: and, behold, this also was vanity.";
yng[1] = "I said in my heart, `Pray, come, I try thee with mirth, and look thou on gladness;\' and lo, even it [is] vanity.";
dby[1] = "I said in my heart, Come now, I will try thee with mirth, therefore enjoy pleasure. But behold, this also is vanity.";
web[1] = "I said in my heart, Come now, I will prove thee with mirth, therefore enjoy pleasure: and behold, this also [is] vanity.";
hnv[1] = "I said in my heart, &quot;Come now, I will test you with mirth: therefore enjoy pleasure;&quot; and, behold, this also was vanity.";
vul[1] = "dixi ego in corde meo vadam et affluam deliciis et fruar bonis et vidi quod hoc quoque esset vanitas";
kjv[2] = "I said of laughter, [It is] mad: and of mirth, What doeth it?";
rsv[2] = "I said of laughter, &quot;It is mad,&quot; and of pleasure, &quot;What use is it?&quot;";
asv[2] = "I said of laughter, It is mad; and of mirth, What doeth it?";
yng[2] = "Of laughter I said, `Foolish!\' and of mirth, `What [is] this it is doing?\'";
dby[2] = "I said of laughter, Madness! and of mirth, What availeth it?";
web[2] = "I said of laughter, [It is] mad: and of mirth, What doeth it?";
hnv[2] = "I said of laughter, &quot;It is foolishness;&quot; and of mirth, &quot;What does it accomplish?&quot;";
vul[2] = "risum reputavi errorem et gaudio dixi quid frustra deciperis";
kjv[3] = "I sought in mine heart to give myself unto wine, yet acquainting mine heart with wisdom; and to lay hold on folly, till I might see what [was] that good for the sons of men, which they should do under the heaven all the days of their life.";
rsv[3] = "I searched with my mind how to cheer my body with wine--my mind still guiding me with wisdom--and how to lay hold on folly, till I might see what was good for the sons of men to do under heaven during the few days of their life.";
asv[3] = "I searched in my heart how to cheer my flesh with wine, my heart yet guiding [me] with wisdom, and how to lay hold on folly, till I might see what it was good for the sons of men that they should do under heaven all the days of their life.";
yng[3] = "I have sought in my heart to draw out with wine my appetite, (and my heart leading in wisdom), and to take hold on folly till that I see where [is] this -- the good to the sons of man of that which they do under the heavens, the number of the days of their lives.";
dby[3] = "I searched in my heart how to cherish my flesh with wine, while practising my heart with wisdom; and how to lay hold on folly, till I should see what was that good for the children of men which they should do under the heavens all the days of their life.";
web[3] = "I sought in my heart, to give myself to wine, yet acquainting my heart with wisdom; and to lay hold on folly, till I might see what [was] that good for the sons of men, which they should do under the heaven all the days of their life.";
hnv[3] = "I searched in my heart how to cheer my flesh with wine, my heart yet guiding me with wisdom, and how to lay hold of folly, until I might see what it was good for the sons of men that they should do under heaven all the days of their lives.";
vul[3] = "cogitavi in corde meo abstrahere a vino carnem meam ut animum meum transferrem ad sapientiam devitaremque stultitiam donec viderem quid esset utile filiis hominum quod facto opus est sub sole numero dierum vitae suae";

asv[4] = "I made me great works; I builded me houses; I planted me vineyards;";

asv[5] = "I made me gardens and parks, and I planted trees in them of all kinds of fruit;";
yng[5] = "I made for me gardens and paradises, and I planted in them trees of every fruit.";

web[5] = "I made me gardens and orchards, and I planted trees in them of all [kind of] fruits:";

rsv[6] = "I made myself pools from which to water the forest of growing trees.";
asv[6] = "I made me pools of water, to water therefrom the forest where trees were reared;";
yng[6] = "I made for me pools of water, to water from them a forest shooting forth trees.";
dby[6] = "I made me ponds of water, to water therewith the wood, where the trees are reared.";
web[6] = "I made me pools of water, to water with them the wood that bringeth forth trees:";

kjv[7] = "I got [me] servants and maidens, and had servants born in my house; also I had great possessions of great and small cattle above all that were in Jerusalem before me:";
rsv[7] = "I bought male and female slaves, and had slaves who were born in my house; I had also great possessions of herds and flocks, more than any who had been before me in Jerusalem.";
asv[7] = "I bought men-servants and maid-servants, and had servants born in my house; also I had great possessions of herds and flocks, above all that were before me in Jerusalem;";
yng[7] = "I got men-servants, and maid-servants, and sons of the house were to me; also, I had much substance -- herd and flock -- above all who had been before me in Jerusalem.";
dby[7] = "I acquired servants and maidens, and had servants born in my house; also I had great possessions of herds and flocks, above all that had been in Jerusalem before me.";
web[7] = "I procured [me] servants and maidens, and had servants born in my house; also I had great possessions of great and small cattle above all that were in Jerusalem before me:";
hnv[7] = "I bought men-servants and maid-servants, and had servants born in my house. I also had great possessions of herds and flocks, above all who were before me in Yerushalayim;";

kjv[8] = "I gathered me also silver and gold, and the peculiar treasure of kings and of the provinces: I gat me men singers and women singers, and the delights of the sons of men, [as] musical instruments, and that of all sorts.";
rsv[8] = "I also gathered for myself silver and gold and the treasure of kings and provinces; I got singers, both men and women, and many concubines, man\'s delight.";
asv[8] = "I gathered me also silver and gold, and the treasure of kings and of the provinces; I gat me men-singers and women-singers, and the delights of the sons of men, musical instruments, and that of all sorts.";
yng[8] = "I gathered for me also silver and gold, and the peculiar treasure of kings and of the provinces. I prepared for me men-singers and women-singers, and the luxuries of the sons of man -- a wife and wives.";
dby[8] = "I gathered me also silver and gold, and the peculiar treasure of kings and of the provinces; I got me men-singers and women-singers, and the delights of the children of men, a wife and concubines.";
web[8] = "I gathered me also silver and gold, and the peculiar treasure of kings, and of the provinces: I procured me men-singers and women-singers, and the delights of the sons of men, [as] musical instruments, and of all sorts.";
hnv[8] = "I also gathered silver and gold for myself, and the treasure of kings and of the provinces. I got myself men-singers and women-singers, and the delights of the sons of men -- musical instruments, and that of all sorts.";

kjv[9] = "So I was great, and increased more than all that were before me in Jerusalem: also my wisdom remained with me.";
rsv[9] = "So I became great and surpassed all who were before me in Jerusalem; also my wisdom remained with me.";
asv[9] = "So I was great, and increased more than all that were before me in Jerusalem: also my wisdom remained with me.";
yng[9] = "And I became great, and increased above every one who had been before me in Jerusalem; also, my wisdom stood with me.";
dby[9] = "And I became great, and increased more than all that had been before me in Jerusalem: also my wisdom remained with me.";
web[9] = "So I was great, and increased more than all that were before me in Jerusalem: also my wisdom remained with me.";
hnv[9] = "So I was great, and increased more than all who were before me in Yerushalayim. My wisdom also remained with me.";
vul[9] = "et supergressus sum opibus omnes qui fuerunt ante me in Hierusalem sapientia quoque perseveravit mecum";
kjv[10] = "And whatsoever mine eyes desired I kept not from them, I withheld not my heart from any joy; for my heart rejoiced in all my labour: and this was my portion of all my labour.";
rsv[10] = "And whatever my eyes desired I did not keep from them; I kept my heart from no pleasure, for my heart found pleasure in all my toil, and this was my reward for all my toil.";
asv[10] = "And whatsoever mine eyes desired I kept not from them; I withheld not my heart from any joy; for my heart rejoiced because of all my labor; and this was my portion from all my labor.";
yng[10] = "And all that mine eyes asked I kept not back from them; I withheld not my heart from any joy, for my heart rejoiced because of all my labour, and this hath been my portion, from all my labour,";
dby[10] = "And whatsoever mine eyes desired I kept not from them: I withheld not my heart from any joy; for my heart rejoiced in all my labour, and this was my portion from all my labour.";
web[10] = "And whatever my eyes desired I kept not from them, I withheld not my heart from any joy; for my heart rejoiced in all my labor: and this was my portion of all my labor.";
hnv[10] = " Whatever my eyes desired, I didn\'t keep from them. I didn\'t withhold my heart from any joy, for my heart rejoiced because of all my labor, and this was my portion from all my labor.";
vul[10] = "et omnia quae desideraverunt oculi mei non negavi eis nec prohibui cor quin omni voluptate frueretur et oblectaret se in his quae paraveram et hanc ratus sum partem meam si uterer labore meo";
kjv[11] = "Then I looked on all the works that my hands had wrought, and on the labour that I had laboured to do: and, behold, all [was] vanity and vexation of spirit, and [there was] no profit under the sun.";
rsv[11] = "Then I considered all that my hands had done and the toil I had spent in doing it, and behold, all was vanity and a striving after wind, and there was nothing to be gained under the sun.";
asv[11] = "Then I looked on all the works that my hands had wrought, and on the labor that I had labored to do; and, behold, all was vanity and a striving after wind, and there was no profit under the sun.";
yng[11] = "and I have looked on all my works that my hands have done, and on the labour that I have laboured to do, and lo, the whole [is] vanity and vexation of spirit, and there is no advantage under the sun!";
dby[11] = "Then I looked on all the works that my hands had wrought, and on the labour that it had cost me to do [them]; and behold, all was vanity and pursuit of the wind, and there was no profit under the sun.";
web[11] = "Then I looked on all the works that my hands had wrought, and on the labor that I had labored to do: and behold, all [was] vanity and vexation of spirit, and [there was] no profit under the sun.";
hnv[11] = "Then I looked at all the works that my hands had worked, and at the labor that I had labored to do; and, behold, all was vanity and a chasing after wind, and there was no profit under the sun.";
vul[11] = "cumque me convertissem ad universa opera quae fecerant manus meae et ad labores in quibus frustra sudaveram vidi in omnibus vanitatem et adflictionem animi et nihil permanere sub sole";
kjv[12] = "And I turned myself to behold wisdom, and madness, and folly: for what [can] the man [do] that cometh after the king? [even] that which hath been already done.";
rsv[12] = "So I turned to consider wisdom and madness and folly; for what can the man do who comes after the king? Only what he has already done.";
asv[12] = "And I turned myself to behold wisdom, and madness, and folly: for what [can] the man [do] that cometh after the king? [even] that which hath been done long ago.";
yng[12] = "And I turned to see wisdom, and madness, and folly, but what [is] the man who cometh after the king? that which [is] already -- they have done it!";
dby[12] = "And I turned myself to behold wisdom, and madness, and folly; for what shall the man [do] that cometh after the king? -- that which hath already been done.";
web[12] = "And I turned myself to behold wisdom, and madness, and folly: for what [can] the man [do] that cometh after the king? [even] that which hath been already done.";
hnv[12] = "I turned myself to consider wisdom, madness, and folly: for what can the king\'s successor do? Just that which has been done long ago.";
vul[12] = "transivi ad contemplandam sapientiam erroresque et stultitiam quid est inquam homo ut sequi possit regem factorem suum";
kjv[13] = "Then I saw that wisdom excelleth folly, as far as light excelleth darkness.";
rsv[13] = "Then I saw that wisdom excels folly as light excels darkness.";
asv[13] = "Then I saw that wisdom excelleth folly, as far as light excelleth darkness.";
yng[13] = "And I saw that there is an advantage to wisdom above folly, like the advantage of the light above the darkness.";
dby[13] = "And I saw that wisdom excelleth folly, as light excelleth darkness.";
web[13] = "Then I saw that wisdom excelleth folly, as far as light excelleth darkness.";
hnv[13] = "Then I saw that wisdom excels folly, as far as light excels darkness.";
vul[13] = "et vidi quia tantum praecederet sapientia stultitiam quantum differt lux tenebris";
kjv[14] = "The wise man\'s eyes [are] in his head; but the fool walketh in darkness: and I myself perceived also that one event happeneth to them all.";
rsv[14] = "The wise man has his eyes in his head, but the fool walks in darkness; and yet I perceived that one fate comes to all of them.";
asv[14] = "The wise man\'s eyes are in his head, and the fool walketh in darkness: and yet I perceived that one event happeneth to them all.";
yng[14] = "The wise! -- his eyes [are] in his head, and the fool in darkness is walking, and I also knew that one event happeneth with them all;";
dby[14] = "The wise man\'s eyes are in his head, and the fool walketh in darkness; but I myself also perceived that one event happeneth to them all.";
web[14] = "The wise man\'s eyes [are] in his head; but the fool walketh in darkness: and I myself perceived also that one event happeneth to them all.";
hnv[14] = "The wise man\'s eyes are in his head, and the fool walks in darkness -- and yet I perceived that one event happens to them all.";
vul[14] = "sapientis oculi in capite eius stultus in tenebris ambulat et didici quod unus utriusque esset interitus";
kjv[15] = "Then said I in my heart, As it happeneth to the fool, so it happeneth even to me; and why was I then more wise? Then I said in my heart, that this also [is] vanity.";
rsv[15] = "Then I said to myself, &quot;What befalls the fool will befall me also; why then have I been so very wise?&quot; And I said to myself that this also is vanity.";
asv[15] = "Then said I in my heart, As it happeneth to the fool, so will it happen even to me; and why was I then more wise? Then said I in my heart, that this also is vanity.";
yng[15] = "and I said in my heart, `As it happeneth with the fool, it happeneth also with me, and why am I then more wise?\' And I spake in my heart, that also this [is] vanity:";
dby[15] = "And I said in my heart, As it happeneth to the fool so will it happen even to me; and why was I then so wise? Then I said in my heart that this also is vanity.";
web[15] = "Then said I in my heart, As it happeneth to the fool, so it happeneth even to me; and why was I then more wise? Then I said in my heart, that this also [is] vanity.";
hnv[15] = "Then said I in my heart, &quot;As it happens to the fool, so will it happen even to me; and why was I then more wise?&quot; Then said I in my heart that this also is vanity.";
vul[15] = "et dixi in corde meo si unus et stulti et meus occasus erit quid mihi prodest quod maiorem sapientiae dedi operam locutusque cum mente mea animadverti quod hoc quoque esset vanitas";
kjv[16] = "For [there is] no remembrance of the wise more than of the fool for ever; seeing that which now [is] in the days to come shall all be forgotten. And how dieth the wise [man]? as the fool.";
rsv[16] = "For of the wise man as of the fool there is no enduring remembrance, seeing that in the days to come all will have been long forgotten. How the wise man dies just like the fool!";
asv[16] = "For of the wise man, even as of the fool, there is no remembrance for ever; seeing that in the days to come all will have been long forgotten. And how doth the wise man die even as the fool!";
yng[16] = "That there is no remembrance to the wise -- with the fool -- to the age, for that which [is] already, [in] the days that are coming is all forgotten, and how dieth the wise? with the fool!";
dby[16] = "For there shall be no remembrance of the wise more than of the fool for ever; because everything is already forgotten in the days which come. And how dieth the wise even as the fool?";
web[16] = "For [there is] no remembrance of the wise more than of the fool for ever; seeing that which now [is] in the days to come shall all be forgotten. And how dieth the wise [man]? as the fool.";
hnv[16] = "For of the wise man, even as of the fool, there is no memory for ever, seeing that in the days to come all will have been long forgotten. Indeed, the wise man must die just like the fool!";
vul[16] = "non enim erit memoria sapientis similiter ut stulti in perpetuum et futura tempora oblivione cuncta pariter obruent moritur doctus similiter et indoctus";
kjv[17] = "Therefore I hated life; because the work that is wrought under the sun [is] grievous unto me: for all [is] vanity and vexation of spirit.";
rsv[17] = "So I hated life, because what is done under the sun was grievous to me; for all is vanity and a striving after wind.";
asv[17] = "So I hated life, because the work that is wrought under the sun was grievous unto me; for all is vanity and a striving after wind.";
yng[17] = "And I have hated life, for sad to me [is] the work that hath been done under the sun, for the whole [is] vanity and vexation of spirit.";
dby[17] = "And I hated life; for the work that is wrought under the sun was grievous unto me; for all is vanity and pursuit of the wind.";
web[17] = "Therefore I hated life; because the work that is wrought under the sun [is] grievous to me: for all [is] vanity and vexation of spirit.";
hnv[17] = "So I hated life, because the work that is worked under the sun was grievous to me; for all is vanity and a chasing after wind.";
vul[17] = "et idcirco taeduit me vitae meae videntem mala esse universa sub sole et cuncta vanitatem atque adflictionem spiritus";
kjv[18] = "Yea, I hated all my labour which I had taken under the sun: because I should leave it unto the man that shall be after me.";
rsv[18] = "I hated all my toil in which I had toiled under the sun, seeing that I must leave it to the man who will come after me;";
asv[18] = "And I hated all my labor wherein I labored under the sun, seeing that I must leave it unto the man that shall be after me.";
yng[18] = "And I have hated all my labour that I labour at under the sun, because I leave it to a man who is after me.";
dby[18] = "And I hated all my labour wherewith I had been toiling under the sun, because I should leave it unto the man that shall be after me.";
web[18] = "Yes, I hated all my labor which I had taken under the sun: because I should leave it to the man that shall be after me.";
hnv[18] = "I hated all my labor in which I labored under the sun, seeing that I must leave it to the man who comes after me.";
vul[18] = "rursum detestatus sum omnem industriam meam quae sub sole studiosissime laboravi habiturus heredem post me";
kjv[19] = "And who knoweth whether he shall be a wise [man] or a fool? yet shall he have rule over all my labour wherein I have laboured, and wherein I have shewed myself wise under the sun. This [is] also vanity.";
rsv[19] = "and who knows whether he will be a wise man or a fool? Yet he will be master of all for which I toiled and used my wisdom under the sun. This also is vanity.";
asv[19] = "And who knoweth whether he will be a wise man or a fool? yet will he have rule over all my labor wherein I have labored, and wherein I have showed myself wise under the sun. This also is vanity.";
yng[19] = "And who knoweth whether he is wise or foolish? yet he doth rule over all my labour that I have laboured at, and that I have done wisely under the sun! this also [is] vanity.";
dby[19] = "And who knoweth whether he will be a wise [man] or a fool? yet shall he have rule over all my labour at which I have laboured, and wherein I have been wise under the sun. This also is vanity.";
web[19] = "And who knoweth whether he shall be a wise [man] or a fool? yet shall he have rule over all my labor in which I have labored, and in which I have showed myself wise under the sun. This [is] also vanity.";
hnv[19] = "Who knows whether he will be a wise man or a fool? Yet he will have rule over all of my labor in which I have labored, and in which I have shown myself wise under the sun. This also is vanity.";
vul[19] = "quem ignoro utrum sapiens an stultus futurus sit et dominabitur in laboribus meis quibus desudavi et sollicitus fui et est quicquam tam vanum";
kjv[20] = "Therefore I went about to cause my heart to despair of all the labour which I took under the sun.";
rsv[20] = "So I turned about and gave my heart up to despair over all the toil of my labors under the sun,";
asv[20] = "Therefore I turned about to cause my heart to despair concerning all the labor wherein I had labored under the sun.";
yng[20] = "And I turned round to cause my heart to despair concerning all the labour that I laboured at under the sun.";
dby[20] = "Then I went about to cause my heart to despair of all the labour wherewith I had laboured under the sun.";
web[20] = "Therefore I went about to cause my heart to despair of all the labor which I took under the sun.";
hnv[20] = "Therefore I began to cause my heart to despair concerning all the labor in which I had labored under the sun.";
vul[20] = "unde cessavi renuntiavitque cor meum ultra laborare sub sole";
kjv[21] = "For there is a man whose labour [is] in wisdom, and in knowledge, and in equity; yet to a man that hath not laboured therein shall he leave it [for] his portion. This also [is] vanity and a great evil.";
rsv[21] = "because sometimes a man who has toiled with wisdom and knowledge and skill must leave all to be enjoyed by a man who did not toil for it. This also is vanity and a great evil.";
asv[21] = "For there is a man whose labor is with wisdom, and with knowledge, and with skilfulness; yet to a man that hath not labored therein shall he leave it for his portion. This also is vanity and a great evil.";
yng[21] = "For there is a man whose labour [is] in wisdom, and in knowledge, and in equity, and to a man who hath not laboured therein he giveth it -- his portion! Even this [is] vanity and a great evil.";
dby[21] = "For there is a man whose labour hath been with wisdom, and with knowledge, and with skill, and who leaveth it to a man that hath not laboured therein, to be his portion. This also is vanity and a great evil.";
web[21] = "For there is a man whose labor is in wisdom, and in knowledge, and in equity; yet to a man that hath not labored in it, shall he leave it [for] his portion. This also [is] vanity and a great evil.";
hnv[21] = "For there is a man whose labor is with wisdom, with knowledge, and with skillfulness; yet he shall leave it for his portion to a man who has not labored for it. This also is vanity and a great evil.";
vul[21] = "nam cum alius laboret in sapientia et doctrina et sollicitudine homini otioso quaesita dimittit et hoc ergo vanitas et magnum malum";
kjv[22] = "For what hath man of all his labour, and of the vexation of his heart, wherein he hath laboured under the sun?";
rsv[22] = "What has a man from all the toil and strain with which he toils beneath the sun?";
asv[22] = "For what hath a man of all his labor, and of the striving of his heart, wherein he laboreth under the sun?";
yng[22] = "For what hath been to a man by all his labour, and by the thought of his heart that he laboured at under the sun?";
dby[22] = "For what will man have of all his labour and of the striving of his heart, wherewith he hath wearied himself under the sun?";
web[22] = "For what hath man of all his labor, and of the vexation of his heart, in which he hath labored under the sun?";
hnv[22] = "For what has a man of all his labor, and of the striving of his heart, in which he labors under the sun?";
vul[22] = "quid enim proderit homini de universo labore suo et adflictione spiritus qua sub sole cruciatus est";
kjv[23] = "For all his days [are] sorrows, and his travail grief; yea, his heart taketh not rest in the night. This is also vanity.";
rsv[23] = "For all his days are full of pain, and his work is a vexation; even in the night his mind does not rest. This also is vanity.";
asv[23] = "For all his days are [but] sorrows, and his travail is grief; yea, even in the night his heart taketh no rest. This also is vanity.";
yng[23] = "For all his days are sorrows, and his travail sadness; even at night his heart hath not lain down; this also [is] vanity.";
dby[23] = "For all his days are sorrows, and his travail vexation: even in the night his heart taketh no rest. This also is vanity.";
web[23] = "For all his days [are] sorrows, and his labor grief; yes, his heart taketh not rest in the night. This is also vanity.";
hnv[23] = "For all his days are sorrows, and his travail is grief; yes, even in the night his heart takes no rest. This also is vanity.";
vul[23] = "cuncti dies eius doloribus et aerumnis pleni sunt nec per noctem mente requiescit et haec non vanitas est";
kjv[24] = "[There is] nothing better for a man, [than] that he should eat and drink, and [that] he should make his soul enjoy good in his labour. This also I saw, that it [was] from the hand of God.";
rsv[24] = "There is nothing better for a man than that he should eat and drink, and find enjoyment in his toil. This also, I saw, is from the hand of God;";
asv[24] = "There is nothing better for a man [than] that he should eat and drink, and make his soul enjoy good in his labor. This also I saw, that it is from the hand of God.";
yng[24] = "There is nothing good in a man who eateth, and hath drunk, and hath shewn his soul good in his labour. This also I have seen that it [is] from the hand of God.";
dby[24] = "There is nothing good for man, but that he should eat and drink, and that he should make his soul enjoy good in his labour. This also I saw, that it was from the hand of God.";
web[24] = "[There is] nothing better for a man than that he should eat and drink, and [that] he should make his soul enjoy good in his labor. This also I saw, that it [was] from the hand of God.";
hnv[24] = "There is nothing better for a man than that he should eat and drink, and make his soul enjoy good in his labor. This also I saw, that it is from the hand of God.";
vul[24] = "nonne melius est comedere et bibere et ostendere animae suae bona de laboribus suis et hoc de manu Dei est";
kjv[25] = "For who can eat, or who else can hasten [hereunto], more than I?";
rsv[25] = "for apart from him who can eat or who can have enjoyment?";
asv[25] = "For who can eat, or who can have enjoyment, more than I?";
yng[25] = "For who eateth and who hasteth out more than I?";
dby[25] = "For who can eat, or who be eager, more than I?";
web[25] = "For who can eat, or who else can hasten [to it] more than I?";
hnv[25] = "For who can eat, or who can have enjoyment, more than I?";
vul[25] = "quis ita vorabit et deliciis affluet ut ego";
kjv[26] = "For [God] giveth to a man that [is] good in his sight wisdom, and knowledge, and joy: but to the sinner he giveth travail, to gather and to heap up, that he may give to [him that is] good before God. This also [is] vanity and vexation of spirit.";
rsv[26] = "For to the man who pleases him God gives wisdom and knowledge and joy; but to the sinner he gives the work of gathering and heaping, only to give to one who pleases God. This also is vanity and a striving after wind.";
asv[26] = "For to the man that pleaseth him [God] giveth wisdom, and knowledge, and joy; but to the sinner he giveth travail, to gather and to heap up, that he may give to him that pleaseth God. This also is vanity and a striving after wind.";
yng[26] = "For to a man who [is] good before Him, He hath given wisdom, and knowledge, and joy; and to a sinner He hath given travail, to gather and to heap up, to give to the good before God. Even this [is] vanity and vexation of spirit.";
dby[26] = "For he giveth to a man that is good in his sight wisdom, and knowledge, and joy; but to the sinner he giveth travail to gather and to heap up, that he may give to him that is good in God\'s sight. This also is vanity and pursuit of the wind.";
web[26] = "For [God] giveth to a man who [is] good in his sight, wisdom, and knowledge, and joy: but to the sinner he giveth toil, to gather, and to amass, that he may give to [him that is] good before God. This also [is] vanity and vexation of spirit.";
hnv[26] = "For to the man who pleases him, God gives wisdom, knowledge, and joy; but to the sinner he gives travail, to gather and to heap up, that he may give to him who pleases God. This also is vanity and a chasing after wind.";
vul[26] = "homini bono in conspectu suo dedit Deus sapientiam et scientiam et laetitiam peccatori autem dedit adflictionem et curam superfluam ut addat et congreget et tradat ei qui placuit Deo sed et hoc vanitas et cassa sollicitudo mentis";
</script>
