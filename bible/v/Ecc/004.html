csb[1] = "Again, I observed all the acts of oppression being done under the sun. Look at the tears of those who are oppressed; they have no one to comfort them. Power is with those who oppress them; they have no one to comfort them.";
csb[2] = "So I commended the dead, who have already died, more than the living, who are still alive.";
csb[3] = "But better than either of them is the one who has not yet existed, who has not seen the evil activity that is done under the sun.";
csb[4] = "I saw that all labor and all skillful work is due to one person\'s jealousy of another. This too is futile and a pursuit of the wind.";
csb[5] = "The fool folds his arms and consumes his own flesh.";
csb[6] = "Better one handful with rest than two handfuls with effort and a pursuit of the wind.";
csb[7] = "Again, I saw futility under the sun:";
csb[8] = "There is a person without a companion, without even a son or brother, and though there is no end to all his struggles, his eyes are still not content with riches. &quot;Who am I struggling for,&quot; he asks, &quot;and depriving myself of good things? &quot; This too is futile and a miserable task.";
csb[9] = "Two are better than one because they have a good reward for their efforts.";
csb[10] = "For if either falls, his companion can lift him up; but pity the one who falls without another to lift him up.";
csb[11] = "Also, if two lie down together, they can keep warm; but how can one person alone keep warm?";
csb[12] = "And if someone overpowers one person, two can resist him. A cord of three strands is not easily broken.";
csb[13] = "Better is a poor but wise youth than an old but foolish king who no longer pays attention to warnings.";
csb[14] = "For he came from prison to be king, even though he was born poor in his kingdom.";
csb[15] = "I saw all the living, who move about under the sun, follow a second youth who succeeds him.";
csb[16] = "There is no limit to all the people who were before them, yet those who come later will not rejoice in him. This too is futile and a pursuit of the wind.";
kjv[1] = "So I returned, and considered all the oppressions that are done under the sun: and behold the tears of [such as were] oppressed, and they had no comforter; and on the side of their oppressors [there was] power; but they had no comforter.";
rsv[1] = "Again I saw all the oppressions that are practiced under the sun. And behold, the tears of the oppressed, and they had no one to comfort them! On the side of their oppressors there was power, and there was no one to comfort them.";
asv[1] = "Then I returned and saw all the oppressions that are done under the sun: and, behold, the tears of such as were oppressed, and they had no comforter; and on the side of their oppressors there was power; but they had no comforter.";
yng[1] = "And I have turned, and I see all the oppressions that are done under the sun, and lo, the tear of the oppressed, and they have no comforter; and at the hand of their oppressors [is] power, and they have no comforter.";
dby[1] = "And I returned and saw all the oppressions that are done under the sun: and behold, the tears of the oppressed, and they had no comforter; and on the side of their oppressors was power, and they had no comforter.";
web[1] = "So I returned, and considered all the oppressions that are done under the sun: and behold the tears of [such as were] oppressed, and they had no comforter; and on the side of their oppressors [there was] power; but they had no comforter.";
hnv[1] = "Then I returned and saw all the oppressions that are done under the sun: and, behold, the tears of those who were oppressed, and they had no comforter; and on the side of their oppressors there was power; but they had no comforter.";
vul[1] = "verti me ad alia et vidi calumnias quae sub sole geruntur et lacrimas innocentum et consolatorem neminem nec posse resistere eorum violentiae cunctorum auxilio destitutos";
kjv[2] = "Wherefore I praised the dead which are already dead more than the living which are yet alive.";
rsv[2] = "And I thought the dead who are already dead more fortunate than the living who are still alive;";
asv[2] = "Wherefore I praised the dead that have been long dead more than the living that are yet alive;";
yng[2] = "And I am praising the dead who have already died above the living who are yet alive.";
dby[2] = "Then I praised the dead who are already dead more than the living who are yet alive;";
web[2] = "Wherefore I praised the dead who are already dead more than the living who are yet alive.";
hnv[2] = "Therefore I praised the dead who have been long dead more than the living who are yet alive.";
vul[2] = "et laudavi magis mortuos quam viventes";
kjv[3] = "Yea, better [is he] than both they, which hath not yet been, who hath not seen the evil work that is done under the sun.";
rsv[3] = "but better than both is he who has not yet been, and has not seen the evil deeds that are done under the sun.";
asv[3] = "yea, better than them both [did I esteem] him that hath not yet been, who hath not seen the evil work that is done under the sun.";
yng[3] = "And better than both of them [is] he who hath not yet been, in that he hath not seen the evil work that hath been done under the sun.";
dby[3] = "and more fortunate than both is he who hath not yet been, who hath not seen the evil work that is done under the sun.";
web[3] = "Yes, better is [he] than both they, who hath not yet been, who hath not seen the evil work that is done under the sun.";
hnv[3] = " Yes, better than them both is him who has not yet been, who has not seen the evil work that is done under the sun.";
vul[3] = "et feliciorem utroque iudicavi qui necdum natus est nec vidit mala quae sub sole fiunt";
kjv[4] = "Again, I considered all travail, and every right work, that for this a man is envied of his neighbour. This [is] also vanity and vexation of spirit.";
rsv[4] = "Then I saw that all toil and all skill in work come from a man\'s envy of his neighbor. This also is vanity and a striving after wind.";
asv[4] = "Then I saw all labor and every skilful work, that for this a man is envied of his neighbor. This also is vanity and a striving after wind.";
yng[4] = "And I have seen all the labour, and all the benefit of the work, because for it a man is the envy of his neighbour. Even this [is] vanity and vexation of spirit.";
dby[4] = "And I saw all labour, and all success of work, that it is man\'s jealousy of his neighbour. This also is vanity and pursuit of the wind.";
web[4] = "Again, I considered all labor, and every right work, that for this a man is envied by his neighbor. This [is] also vanity and vexation of spirit.";
hnv[4] = "Then I saw all the labor and achievement that is the envy of a man\'s neighbor. This also is vanity and a striving after wind.";
vul[4] = "rursum contemplatus omnes labores hominum et industrias animadverti patere invidiae proximi et in hoc ergo vanitas et cura superflua est";
kjv[5] = "The fool foldeth his hands together, and eateth his own flesh.";
rsv[5] = "The fool folds his hands, and eats his own flesh.";
asv[5] = "The fool foldeth his hands together, and eateth his own flesh.";
yng[5] = "The fool is clasping his hands, and eating his own flesh:";
dby[5] = "The fool foldeth his hands together, and eateth his own flesh.";
web[5] = "The fool foldeth his hands together, and eateth his own flesh.";
hnv[5] = "The fool folds his hands together and ruins himself.";
vul[5] = "stultus conplicat manus suas et comedit carnes suas dicens";
kjv[6] = "Better [is] an handful [with] quietness, than both the hands full [with] travail and vexation of spirit.";
rsv[6] = "Better is a handful of quietness than two hands full of toil and a striving after wind.";
asv[6] = "Better is a handful, with quietness, than two handfuls with labor and striving after wind.";
yng[6] = "`Better [is] a handful [with] quietness, than two handfuls [with] labour and vexation of spirit.\'";
dby[6] = "Better is a handful with quietness, than both hands full with labour and pursuit of the wind.";
web[6] = "Better [is] a handful [with] quietness, than both the hands full [with] toil and vexation of spirit.";
hnv[6] = "Better is a handful, with quietness, than two handfuls with labor and chasing after wind.";
vul[6] = "melior est pugillus cum requie quam plena utraque manus cum labore et adflictione animi";
kjv[7] = "Then I returned, and I saw vanity under the sun.";
rsv[7] = "Again, I saw vanity under the sun:";
asv[7] = "Then I returned and saw vanity under the sun.";
yng[7] = "And I have turned, and I see a vain thing under the sun:";
dby[7] = "And I returned and saw vanity under the sun.";
web[7] = "Then I returned, and I saw vanity under the sun.";
hnv[7] = "Then I returned and saw vanity under the sun.";
vul[7] = "considerans repperi et aliam vanitatem sub sole";
kjv[8] = "There is one [alone], and [there is] not a second; yea, he hath neither child nor brother: yet [is there] no end of all his labour; neither is his eye satisfied with riches; neither [saith he], For whom do I labour, and bereave my soul of good? This [is] also vanity, yea, it [is] a sore travail.";
rsv[8] = "a person who has no one, either son or brother, yet there is no end to all his toil, and his eyes are never satisfied with riches, so that he never asks, &quot;For whom am I toiling and depriving myself of pleasure?&quot; This also is vanity and an unhappy business.";
asv[8] = "There is one that is alone, and he hath not a second; yea, he hath neither son nor brother; yet is there no end of all his labor, neither are his eyes satisfied with riches. For whom then, [saith he], do I labor, and deprive my soul of good? This also is vanity, yea, it is a sore travail.";
yng[8] = "There is one, and there is not a second; even son or brother he hath not, and there is no end to all his labour! His eye also is not satisfied with riches, and [he saith not], `For whom am I labouring and bereaving my soul of good?\' This also is vanity, it is a sad travail.";
dby[8] = "There is one [alone] and without a second; also he hath neither son nor brother: yet is there no end of all his labour, neither is his eye satisfied with riches, and [he saith not], For whom then am I labouring, and depriving my soul of good? This also is vanity and a grievous occupation.";
web[8] = "There is one [alone], and [there is] not a second; yes, he hath neither child nor brother: yet [is there] no end of all his labor; neither is his eye satisfied with riches; neither [saith he], For whom do I labor, and bereave my soul of good? This [is] also vanity, yes, it [is] a grievous labor.";
hnv[8] = "There is one who is alone, and he has neither son nor brother. There is no end to all of his labor, neither are his eyes satisfied with wealth. For whom then, do I labor, and deprive my soul of enjoyment? This also is vanity, yes, it is a miserable business.";
vul[8] = "unus est et secundum non habet non filium non fratrem et tamen laborare non cessat nec satiantur oculi eius divitiis nec recogitat dicens cui laboro et fraudo animam meam bonis in hoc quoque vanitas est et adflictio pessima";
kjv[9] = "Two [are] better than one; because they have a good reward for their labour.";
rsv[9] = "Two are better than one, because they have a good reward for their toil.";
asv[9] = "Two are better than one, because they have a good reward for their labor.";
yng[9] = "The two [are] better than the one, in that they have a good reward by their labour.";
dby[9] = "Two are better than one; because they have a good reward for their labour.";
web[9] = "Two [are] better than one; because they have a good reward for their labor.";
hnv[9] = "Two are better than one, because they have a good reward for their labor.";
vul[9] = "melius ergo est duos simul esse quam unum habent enim emolumentum societatis suae";
kjv[10] = "For if they fall, the one will lift up his fellow: but woe to him [that is] alone when he falleth; for [he hath] not another to help him up.";
rsv[10] = "For if they fall, one will lift up his fellow; but woe to him who is alone when he falls and has not another to lift him up.";
asv[10] = "For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and hath not another to lift him up.";
yng[10] = "For if they fall, the one raiseth up his companion, but wo to the one who falleth and there is not a second to raise him up!";
dby[10] = "For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and who hath not another to lift him up!";
web[10] = "For if they fall, the one will lift up his fellow: but woe to him [that is] alone when he falleth; for [he hath] not another to help him to rise.";
hnv[10] = "For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn\'t have another to lift him up.";
vul[10] = "si unus ceciderit ab altero fulcietur vae soli quia cum ruerit non habet sublevantem";
kjv[11] = "Again, if two lie together, then they have heat: but how can one be warm [alone]?";
rsv[11] = "Again, if two lie together, they are warm; but how can one be warm alone?";
asv[11] = "Again, if two lie together, then they have warmth; but how can one be warm [alone]?";
yng[11] = "Also, if two lie down, then they have heat, but how hath one heat?";
dby[11] = "Again, if two lie together, then they have warmth; but how can one alone be warm?";
web[11] = "Again, if two lie together, then they have heat: but how can one be warm [alone]?";
hnv[11] = "Again, if two lie together, then they have warmth; but how can one keep warm alone?";
vul[11] = "et si dormierint duo fovebuntur mutuo unus quomodo calefiet";
kjv[12] = "And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.";
rsv[12] = "And though a man might prevail against one who is alone, two will withstand him. A threefold cord is not quickly broken.";
asv[12] = "And if a man prevail against him that is alone, two shall withstand him; and a threefold cord is not quickly broken.";
yng[12] = "And if the one strengthen himself, the two stand against him; and the threefold cord is not hastily broken.";
dby[12] = "And if a [man] overpower the one, the two shall withstand him; and a threefold cord is not quickly broken.";
web[12] = "And if one prevaileth against him, two shall withstand him; and a three-fold cord is not quickly broken.";
hnv[12] = "If a man prevails against one who is alone, two shall withstand him; and a threefold cord is not quickly broken.";
vul[12] = "et si quispiam praevaluerit contra unum duo resistent ei funiculus triplex difficile rumpitur";
kjv[13] = "Better [is] a poor and a wise child than an old and foolish king, who will no more be admonished.";
rsv[13] = "Better is a poor and wise youth than an old and foolish king, who will no longer take advice,";
asv[13] = "Better is a poor and wise youth than an old and foolish king, who knoweth not how to receive admonition any more.";
yng[13] = "Better is a poor and wise youth than an old and foolish king, who hath not known to be warned any more.";
dby[13] = "Better is a poor but wise youth than an old and foolish king, who knoweth no more how to be admonished.";
web[13] = "Better [is] a poor and a wise child, than an old and foolish king, who will no more be admonished.";
hnv[13] = "Better is a poor and wise youth than an old and foolish king who doesn\'t know how to receive admonition any more.";
vul[13] = "melior est puer pauper et sapiens rege sene et stulto qui nescit providere in posterum";
kjv[14] = "For out of prison he cometh to reign; whereas also [he that is] born in his kingdom becometh poor.";
rsv[14] = "even though he had gone from prison to the throne or in his own kingdom had been born poor.";
asv[14] = "For out of prison he came forth to be king; yea, even in his kingdom he was born poor.";
yng[14] = "For from a house of prisoners he hath come out to reign, for even in his own kingdom he hath been poor.";
dby[14] = "For out of the prison-house he came forth to reign, although he was born poor in his kingdom.";
web[14] = "For out of prison he cometh to reign; whereas also [he that is] born in his kingdom becometh poor.";
hnv[14] = "For out of prison he came forth to be king; yes, even in his kingdom he was born poor.";
vul[14] = "quod et de carcere catenisque interdum quis egrediatur ad regnum et alius natus in regno inopia consumatur";
kjv[15] = "I considered all the living which walk under the sun, with the second child that shall stand up in his stead.";
rsv[15] = "I saw all the living who move about under the sun, as well as that youth, who was to stand in his place;";
asv[15] = "I saw all the living that walk under the sun, that they were with the youth, the second, that stood up in his stead.";
yng[15] = "I have seen all the living, who are walking under the sun, with the second youth who doth stand in his place;";
dby[15] = "I saw all the living that walk under the sun, with the child, the second, that should stand up in his stead.";
web[15] = "I considered all the living who walk under the sun, with the second child that shall stand up in his stead.";
hnv[15] = "I saw all the living who walk under the sun, that they were with the youth, the other, who succeeded him.";
vul[15] = "vidi cunctos viventes qui ambulant sub sole cum adulescente secundo qui consurgit pro eo";
kjv[16] = "[There is] no end of all the people, [even] of all that have been before them: they also that come after shall not rejoice in him. Surely this also [is] vanity and vexation of spirit.";
rsv[16] = "there was no end of all the people; he was over all of them. Yet those who come later will not rejoice in him. Surely this also is vanity and a striving after wind.";
asv[16] = "There was no end of all the people, even of all them over whom he was: yet they that come after shall not rejoice in him. Surely this also is vanity and a striving after wind.";
yng[16] = "there is no end to all the people, to all who were before them; also, the latter rejoice not in him. Surely this also is vanity and vexation of spirit.";
dby[16] = "[There is] no end of all the people, of all that stood before them; those however that come after shall not rejoice in him. Surely this also is vanity and a striving after the wind.";
web[16] = "[There is] no end of all the people, [even] of all that have been before them: they also that come after shall not rejoice in him. Surely this also [is] vanity and vexation of spirit.";
hnv[16] = "There was no end of all the people, even of all them over whom he was -- yet those who come after shall not rejoice in him. Surely this also is vanity and a chasing after wind.";
vul[16] = "infinitus numerus est populi omnium qui fuerunt ante eum et qui postea futuri sunt non laetabuntur in eo sed et hoc vanitas et adflictio spiritus";
</script>
