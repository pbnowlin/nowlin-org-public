csb[1] = "Here is a tragedy I have observed under the sun, and it weighs heavily on humanity:";
csb[2] = "God gives a person riches, wealth, and honor so that he lacks nothing of all he desires for himself, but God does not allow him to enjoy them. Instead, a stranger will enjoy them. This is futile and a sickening tragedy.";
csb[3] = "A man may father a hundred children and live many years. No matter how long he lives, if he is not satisfied by good things and does not even have a proper burial, I say that a stillborn child is better off than he.";
csb[4] = "For he comes in futility and he goes in darkness, and his name is shrouded in darkness.";
csb[5] = "Though a stillborn child does not see the sun and is not conscious, it has more rest than he.";
csb[6] = "And if a person lives a thousand years twice, but does not experience happiness, do not both go to the same place?";
csb[7] = "All of a person\'s labor is for his stomach, yet the appetite is never satisfied.";
csb[8] = "What advantage then does the wise person have over the fool? What advantage is there for the poor person who knows how to conduct himself before others?";
csb[9] = "Better what the eyes see than wandering desire. This too is futile and a pursuit of the wind.";
csb[10] = "Whatever exists was given its name long ago, and it is known what mankind is. But he is not able to contend with the one stronger than he.";
csb[11] = "For when there are many words, they increase futility. What is the advantage for mankind?";
csb[12] = "For who knows what is good for anyone in life, in the few days of his futile life that he spends like a shadow? Who can tell anyone what will happen after him under the sun?";
kjv[1] = "There is an evil which I have seen under the sun, and it [is] common among men:";
rsv[1] = "There is an evil which I have seen under the sun, and it lies heavy upon men:";
asv[1] = "There is an evil which I have seen under the sun, and it is heavy upon men:";
yng[1] = "There is an evil that I have seen under the sun, and it [is] great on man:";
dby[1] = "There is an evil that I have seen under the sun, and it is frequent among men:";
web[1] = "There is an evil which I have seen under the sun, and it [is] common among men:";
hnv[1] = "There is an evil which I have seen under the sun, and it is heavy on men:";
vul[1] = "est et aliud malum quod vidi sub sole et quidem frequens apud homines";
kjv[2] = "A man to whom God hath given riches, wealth, and honour, so that he wanteth nothing for his soul of all that he desireth, yet God giveth him not power to eat thereof, but a stranger eateth it: this [is] vanity, and it [is] an evil disease.";
rsv[2] = "a man to whom God gives wealth, possessions, and honor, so that he lacks nothing of all that he desires, yet God does not give him power to enjoy them, but a stranger enjoys them; this is vanity; it is a sore affliction.";
asv[2] = "a man to whom God giveth riches, wealth, and honor, so that he lacketh nothing for his soul of all that he desireth, yet God giveth him not power to eat thereof, but an alien eateth it; this is vanity, and it is an evil disease.";
yng[2] = "A man to whom God giveth wealth, and riches, and honour, and there is no lack to his soul of all that he desireth, and God giveth him not power to eat of it, but a stranger eateth it; this [is] vanity, and it [is] an evil disease.";
dby[2] = "one to whom God giveth riches, wealth, and honour, and he wanteth nothing for his soul of all that he desireth, yet God giveth him not power to eat thereof, but a stranger eateth it: this is vanity, and a sore evil.";
web[2] = "A man to whom God hath given riches, wealth, and honor, so that he wanteth nothing for his soul of all that he desireth, yet God giveth him not power to eat of it, but a stranger eateth it: this [is] vanity, and it [is] an evil disease.";
hnv[2] = "a man to whom God gives riches, wealth, and honor, so that he lacks nothing for his soul of all that he desires, yet God gives him no power to eat of it, but an alien eats it. This is vanity, and it is an evil disease.";
vul[2] = "vir cui dedit Deus divitias et substantiam et honorem et nihil deest animae eius ex omnibus quae desiderat nec tribuit ei potestatem Deus ut comedat ex eo sed homo extraneus vorabit illud hoc vanitas et magna miseria est";
kjv[3] = "If a man beget an hundred [children], and live many years, so that the days of his years be many, and his soul be not filled with good, and also [that] he have no burial; I say, [that] an untimely birth [is] better than he.";
rsv[3] = "If a man begets a hundred children, and lives many years, so that the days of his years are many, but he does not enjoy life\'s good things, and also has no burial, I say that an untimely birth is better off than he.";
asv[3] = "If a man beget a hundred children, and live many years, so that the days of his years are many, but his soul be not filled with good, and moreover he have no burial; I say, that an untimely birth is better than he:";
yng[3] = "If a man doth beget a hundred, and live many years, and is great, because they are the days of his years, and his soul is not satisfied from the goodness, and also he hath not had a grave, I have said, `Better than he [is] the untimely birth.\'";
dby[3] = "If a man beget a hundred [sons], and live many years, so that the days of his years be many, but his soul be not filled with good, and also he have no burial, I say an untimely birth is better than he.";
web[3] = "If a man begetteth a hundred [children], and liveth many years, so that the days of his years are many, and his soul is not filled with good, and also [that] he hath no burial; I say, [that] an untimely birth [is] better than he.";
hnv[3] = "If a man fathers a hundred children, and lives many years, so that the days of his years are many, but his soul is not filled with good, and moreover he has no burial; I say, that an untimely birth is better than he:";
vul[3] = "si genuerit quispiam centum et vixerit multos annos et plures dies aetatis habuerit et anima illius non utatur bonis substantiae suae sepulturaque careat de hoc ego pronuntio quod melior illo sit abortivus";
kjv[4] = "For he cometh in with vanity, and departeth in darkness, and his name shall be covered with darkness.";
rsv[4] = "For it comes into vanity and goes into darkness, and in darkness its name is covered;";
asv[4] = "for it cometh in vanity, and departeth in darkness, and the name thereof is covered with darkness;";
yng[4] = "For in vanity he came in, and in darkness he goeth, and in darkness his name is covered,";
dby[4] = "For it cometh in vanity, and departeth in darkness, and its name is covered with darkness;";
web[4] = "For he cometh with vanity, and departeth in darkness, and his name shall be covered with darkness.";
hnv[4] = "for it comes in vanity, and departs in darkness, and its name is covered with darkness.";
vul[4] = "frustra enim venit et pergit ad tenebras et oblivione delebitur nomen eius";
kjv[5] = "Moreover he hath not seen the sun, nor known [any thing]: this hath more rest than the other.";
rsv[5] = "moreover it has not seen the sun or known anything; yet it finds rest rather than he.";
asv[5] = "moreover it hath not seen the sun nor known it; this hath rest rather than the other:";
yng[5] = "Even the sun he hath not seen nor known, more rest hath this than that.";
dby[5] = "moreover it hath not seen nor known the sun: this hath rest rather than the other.";
web[5] = "Moreover he hath not seen the sun, nor known [any thing]: this hath more rest than the other.";
hnv[5] = "Moreover it has not seen the sun nor known it. This has rest rather than the other.";
vul[5] = "non vidit solem neque cognovit distantiam boni et mali";
kjv[6] = "Yea, though he live a thousand years twice [told], yet hath he seen no good: do not all go to one place?";
rsv[6] = "Even though he should live a thousand years twice told, yet enjoy no good--do not all go to the one place?";
asv[6] = "yea, though he live a thousand years twice told, and yet enjoy no good, do not all go to one place?";
yng[6] = "And though he had lived a thousand years twice over, yet good he hath not seen; to the same place doth not every one go?";
dby[6] = "Yea, though he live twice a thousand years, yet hath he seen no good: do not all go to one place?";
web[6] = "Yes, though he liveth a thousand years twice [told], yet hath he seen no good: do not all go to one place?";
hnv[6] = "Yes, though he live a thousand years twice told, and yet fails to enjoy good, don\'t all go to one place?";
vul[6] = "etiam si duobus milibus annis vixerit et non fuerit perfruitus bonis nonne ad unum locum properant omnia";
kjv[7] = "All the labour of man [is] for his mouth, and yet the appetite is not filled.";
rsv[7] = "All the toil of man is for his mouth, yet his appetite is not satisfied.";
asv[7] = "All the labor of man is for his mouth, and yet the appetite is not filled.";
yng[7] = "All the labour of man [is] for his mouth, and yet the soul is not filled.";
dby[7] = "All the labour of man is for his mouth, and yet the appetite is not filled.";
web[7] = "All the labor of man [is] for his mouth, and yet the appetite is not filled.";
hnv[7] = "All the labor of man is for his mouth, and yet the appetite is not filled.";
vul[7] = "omnis labor hominis in ore eius sed anima illius non impletur";
kjv[8] = "For what hath the wise more than the fool? what hath the poor, that knoweth to walk before the living?";
rsv[8] = "For what advantage has the wise man over the fool? And what does the poor man have who knows how to conduct himself before the living?";
asv[8] = "For what advantage hath the wise more than the fool? [or] what hath the poor man, that knoweth how to walk before the living?";
yng[8] = "For what advantage [is] to the wise above the fool? What to the poor who knoweth to walk before the living?";
dby[8] = "For what advantage hath the wise above the fool? what hath the poor, that knoweth to walk before the living?";
web[8] = "For what hath the wise more than the fool? what hath the poor, that knoweth to walk before the living?";
hnv[8] = "For what advantage has the wise more than the fool? What has the poor man, that knows how to walk before the living?";
vul[8] = "quid habet amplius sapiens ab stulto et quid pauper nisi ut pergat illuc ubi est vita";
kjv[9] = "Better [is] the sight of the eyes than the wandering of the desire: this [is] also vanity and vexation of spirit.";
rsv[9] = "Better is the sight of the eyes than the wandering of desire; this also is vanity and a striving after wind.";
asv[9] = "Better is the sight of the eyes than the wandering of the desire: this also is vanity and a striving after wind.";
yng[9] = "Better [is] the sight of the eyes than the going of the soul. This also [is] vanity and vexation of spirit.";
dby[9] = "Better is the seeing of the eyes than the wandering of the desire: this also is vanity and pursuit of the wind.";
web[9] = "Better [is] the sight of the eyes than the wandering of the desire: this [is] also vanity and vexation of spirit.";
hnv[9] = "Better is the sight of the eyes than the wandering of the desire. This also is vanity and a chasing after wind.";
vul[9] = "melius est videre quod cupias quam desiderare quod nescias sed et hoc vanitas est et praesumptio spiritus";
kjv[10] = "That which hath been is named already, and it is known that it [is] man: neither may he contend with him that is mightier than he.";
rsv[10] = "Whatever has come to be has already been named, and it is known what man is, and that he is not able to dispute with one stronger than he.";
asv[10] = "Whatsoever hath been, the name thereof was given long ago; and it is known what man is; neither can he contend with him that is mightier than he.";
yng[10] = "What [is] that which hath been? already is its name called, and it is known that it [is] man, and he is not able to contend with him who is stronger than he.";
dby[10] = "That which is hath already been named; and what man is, is known, and that he cannot contend with him that is mightier than he.";
web[10] = "That which hath been is named already, and it is known that it [is] man: neither may he contend with him that is mightier than he.";
hnv[10] = "Whatever has been, its name was given long ago; and it is known what man is; neither can he contend with him who is mightier than he.";
vul[10] = "qui futurus est iam vocatum est nomen eius et scitur quod homo sit et non possit contra fortiorem se in iudicio contendere";
kjv[11] = "Seeing there be many things that increase vanity, what [is] man the better?";
rsv[11] = "The more words, the more vanity, and what is man the better?";
asv[11] = "Seeing there are many things that increase vanity, what is man the better?";
yng[11] = "For there are many things multiplying vanity; what advantage [is] to man?";
dby[11] = "For there are many things that increase vanity: what is man advantaged?";
web[11] = "Seeing there are many things that increase vanity, what [is] man the better?";
hnv[11] = "For there are many words that create vanity. What does that profit man?";
vul[11] = "verba sunt plurima multa in disputando habentia vanitatem";
kjv[12] = "For who knoweth what [is] good for man in [this] life, all the days of his vain life which he spendeth as a shadow? for who can tell a man what shall be after him under the sun?";
rsv[12] = "For who knows what is good for man while he lives the few days of his vain life, which he passes like a shadow? For who can tell man what will be after him under the sun?";
asv[12] = "For who knoweth what is good for man in [his] life, all the days of his vain life which he spendeth as a shadow? for who can tell a man what shall be after him under the sun?";
yng[12] = "For who knoweth what [is] good for a man in life, the number of the days of the life of his vanity, and he maketh them as a shadow? for who declareth to man what is after him under the sun?";
dby[12] = "For who knoweth what is good for man in life, all the days of his vain life which he spendeth as a shadow? for who can tell man what shall be after him under the sun?";
web[12] = "For who knoweth what [is] good for man in [this] life, all the days of his vain life which he spendeth as a shadow? for who can tell a man what shall be after him under the sun?";
hnv[12] = "For who knows what is good for man in life, all the days of his vain life which he spends like a shadow? For who can tell a man what will be after him under the sun?";
vul[12] = "[Vulgate 7:1] quid necesse est homini maiora se quaerere cum ignoret quid conducat sibi in vita sua numero dierum peregrinationis suae et tempore quo velut umbra praeterit aut quis ei poterit indicare quid post eum futurum sub sole sit";
