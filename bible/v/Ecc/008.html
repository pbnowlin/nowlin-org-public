csb[1] = "Who is like the wise person, and who knows the interpretation of a matter? A person\'s wisdom brightens his face, and the sternness of his face is changed.";
csb[2] = "Keep the king\'s command because of your oath made before God.";
csb[3] = "Do not be in a hurry; leave his presence, and don\'t persist in a bad cause, since he will do whatever he wants.";
csb[4] = "For the king\'s word is authoritative, and who can say to him, &quot;What are you doing? &quot;";
csb[5] = "The one who keeps a command will not experience anything harmful, and a wise heart knows the right time and procedure.";
csb[6] = "For every activity there is a right time and procedure, even though a person\'s troubles are heavy on him.";
csb[7] = "Yet no one knows what will happen because who can tell him what will happen?";
csb[8] = "No one has authority over the wind to restrain it, and there is no authority over the day of death; no one is discharged during battle, and wickedness will not allow those who practice it to escape.";
csb[9] = "All this I have seen, applying my mind to all the work that is done under the sun, at a time when one person has authority over another to his harm.";
csb[10] = "In such circumstances, I saw the wicked buried. They came and went from the holy place, and they were praised in the city where they did those things. This too is futile.";
csb[11] = "Because the sentence against an evil act is not carried out quickly, the heart of people is filled with the desire to commit evil.";
csb[12] = "Although a sinner does evil a hundred times and prolongs his life, I also know that it will go well with God-fearing people, for they are reverent before him.";
csb[13] = "However, it will not go well with the wicked, and they will not lengthen their days like a shadow, for they are not reverent before God.";
csb[14] = "There is a futility that is done on the earth: there are righteous people who get what the actions of the wicked deserve, and there are wicked people who get what the actions of the righteous deserve. I say that this too is futile.";
csb[15] = "So I commended enjoyment because there is nothing better for a person under the sun than to eat, drink, and enjoy himself, for this will accompany him in his labor during the days of his life that God gives him under the sun.";
csb[16] = "When I applied my mind to know wisdom and to observe the activity that is done on the earth (even though one\'s eyes do not close in sleep day or night),";
csb[17] = "I observed all the work of God and concluded that a person is unable to discover the work that is done under the sun. Even though a person labors hard to explore it, he cannot find it; even if a wise person claims to know it, he is unable to discover it.";
kjv[1] = "Who [is] as the wise [man]? and who knoweth the interpretation of a thing? a man\'s wisdom maketh his face to shine, and the boldness of his face shall be changed.";
rsv[1] = "Who is like the wise man? And who knows the interpretation of a thing? A man\'s wisdom makes his face shine, and the hardness of his countenance is changed.";
asv[1] = "Who is as the wise man? and who knoweth the interpretation of a thing? A man\'s wisdom maketh his face to shine, and the hardness of his face is changed.";
yng[1] = "Who [is] as the wise? and who knoweth the interpretation of a thing? The wisdom of man causeth his face to shine, and the hardness of his face is changed.";
dby[1] = "Who is as the wise? and who knoweth the explanation of things? A man\'s wisdom maketh his face to shine, and the boldness of his face is changed.";
web[1] = "Who [is] as the wise [man]? and who knoweth the interpretation of a thing? a man\'s wisdom maketh his face to shine, and the boldness of his face shall be changed.";
hnv[1] = "Who is like the wise man? And who knows the interpretation of a thing? A man\'s wisdom makes his face shine, and the hardness of his face is changed.";
vul[1] = "sapientia hominis lucet in vultu eius et potentissimus faciem illius commutavit";
kjv[2] = "I [counsel thee] to keep the king\'s commandment, and [that] in regard of the oath of God.";
rsv[2] = "Keep the king\'s command, and because of your sacred oath be not dismayed;";

dby[2] = "I [say], Keep the king\'s commandment, and [that] on account of the oath of God.";
web[2] = "I [counsel thee] to keep the king\'s commandment, and [that] in regard of the oath of God.";
hnv[2] = "I say, &quot;Keep the king\'s command!&quot; because of the oath to God.";
vul[2] = "ego os regis observo et praecepta iuramenti Dei";
kjv[3] = "Be not hasty to go out of his sight: stand not in an evil thing; for he doeth whatsoever pleaseth him.";
rsv[3] = "go from his presence, do not delay when the matter is unpleasant, for he does whatever he pleases.";
asv[3] = "Be not hasty to go out of his presence; persist not in an evil thing: for he doeth whatsoever pleaseth him.";
yng[3] = "Be not troubled at his presence, thou mayest go, stand not in an evil thing, for all that he pleaseth he doth.";
dby[3] = "Be not hasty to go out of his sight; persist not in an evil thing: for he doeth whatever pleaseth him,";

rsv[5] = "He who obeys a command will meet no harm, and the mind of a wise man will know the time and way.";

yng[5] = "Whoso is keeping a command knoweth no evil thing, and time and judgment the heart of the wise knoweth.";

web[5] = "He who keepeth the commandment shall feel no evil thing: and a wise man\'s heart discerneth both time and judgment.";

vul[5] = "qui custodit praeceptum non experietur quicquam mali tempus et responsionem cor sapientis intellegit";

rsv[6] = "For every matter has its time and way, although man\'s trouble lies heavy upon him.";

kjv[8] = "[There is] no man that hath power over the spirit to retain the spirit; neither [hath he] power in the day of death: and [there is] no discharge in [that] war; neither shall wickedness deliver those that are given to it.";
rsv[8] = "No man has power to retain the spirit, or authority over the day of death; there is no discharge from war, nor will wickedness deliver those who are given to it.";
asv[8] = "There is no man that hath power over the spirit to retain the spirit; neither hath he power over the day of death; and there is no discharge in war: neither shall wickedness deliver him that is given to it.";
yng[8] = "There is no man ruling over the spirit to restrain the spirit, and there is no authority over the day of death, and there is no discharge in battle, and wickedness delivereth not its possessors.";
dby[8] = "There is no man who hath control over the spirit to retain the spirit; and no one hath control over the day of death; and there is no discharge in that war, neither shall wickedness deliver those that are given to it.";

hnv[8] = "There is no man who has power over the spirit to contain the spirit; neither does he have power over the day of death. There is no discharge in war; neither shall wickedness deliver those who practices it.";

yng[9] = "All this I have seen so as to give my heart to every work that hath been done under the sun; a time that man hath ruled over man to his own evil.";
dby[9] = "All this have I seen, and applied my heart unto every work that is done under the sun: there is a time when man ruleth man to his hurt.";

hnv[9] = "All this have I seen, and applied my mind to every work that is done under the sun. There is a time in which one man has power over another to his hurt.";

kjv[10] = "And so I saw the wicked buried, who had come and gone from the place of the holy, and they were forgotten in the city where they had so done: this [is] also vanity.";
rsv[10] = "Then I saw the wicked buried; they used to go in and out of the holy place, and were praised in the city where they had done such things. This also is vanity.";
asv[10] = "So I saw the wicked buried, and they came [to the grave]; and they that had done right went away from the holy place, and were forgotten in the city: this also is vanity.";
yng[10] = "And so I have seen the wicked buried, and they went in, even from the Holy Place they go, and they are forgotten in the city whether they had so done. This also [is] vanity.";
dby[10] = "And I have also seen the wicked buried and going away; and such as had acted rightly went from [the] holy place, and were forgotten in the city. This also is vanity.";
web[10] = "And so I saw the wicked buried, who had come and gone from the place of the holy, and they were forgotten in the city where they had so done: this [is] also vanity.";
hnv[10] = "So I saw the wicked buried. Indeed they came also from holiness. They went and were forgotten in the city where they did this. This also is vanity.";
vul[10] = "vidi impios sepultos qui etiam cum adviverent in loco sancto erant et laudabantur in civitate quasi iustorum operum sed et hoc vanitas est";
kjv[11] = "Because sentence against an evil work is not executed speedily, therefore the heart of the sons of men is fully set in them to do evil.";

yng[11] = "Because sentence hath not been done [on] an evil work speedily, therefore the heart of the sons of man is full within them to do evil.";
dby[11] = "Because sentence against an evil work is not executed speedily, therefore the heart of the children of men is fully set in them to do evil.";

kjv[12] = "Though a sinner do evil an hundred times, and his [days] be prolonged, yet surely I know that it shall be well with them that fear God, which fear before him:";

yng[12] = "Though a sinner is doing evil a hundred [times], and prolonging [himself] for it, surely also I know that there is good to those fearing God, who fear before Him.";

kjv[14] = "There is a vanity which is done upon the earth; that there be just [men], unto whom it happeneth according to the work of the wicked; again, there be wicked [men], to whom it happeneth according to the work of the righteous: I said that this also [is] vanity.";
rsv[14] = "There is a vanity which takes place on earth, that there are righteous men to whom it happens according to the deeds of the wicked, and there are wicked men to whom it happens according to the deeds of the righteous. I said that this also is vanity.";

yng[14] = "There is a vanity that hath been done upon the earth, that there are righteous ones unto whom it is coming according to the work of the wicked, and there are wicked ones unto whom it is coming according to the work of the righteous. I have said that this also [is] vanity.";
dby[14] = "There is a vanity which is done upon the earth; that there are righteous [men] unto whom it happeneth according to the work of the wicked; and there are wicked [men] to whom it happeneth according to the work of the righteous. I said that this also is vanity.";
web[14] = "There is a vanity which is done upon the earth; that there are just [men], to whom it happeneth according to the work of the wicked; again, there are wicked [men], to whom it happeneth according to the work of the righteous: I said that this also [is] vanity.";
hnv[14] = "There is a vanity which is done on the eretz, that there are righteous men to whom it happens according to the work of the wicked. Again, there are wicked men to whom it happens according to the work of the righteous. I said that this also is vanity.";
vul[14] = "est et alia vanitas quae fit super terram sunt iusti quibus multa proveniunt quasi opera egerint impiorum et sunt impii qui ita securi sunt quasi iustorum facta habeant sed et hoc vanissimum iudico";

yng[15] = "And I have praised mirth because there is no good to man under the sun except to eat and to drink, and to rejoice, and it remaineth with him of his labour the days of his life that God hath given to him under the sun.";
dby[15] = "And I commended mirth, because there is nothing better for man under the sun than to eat, and to drink, and to be merry; for that shall abide with him of his labour the days of his life, which God hath given him under the sun.";

kjv[17] = "Then I beheld all the work of God, that a man cannot find out the work that is done under the sun: because though a man labour to seek [it] out, yet he shall not find [it]; yea further; though a wise [man] think to know [it], yet shall he not be able to find [it].";
rsv[17] = "then I saw all the work of God, that man cannot find out the work that is done under the sun. However much man may toil in seeking, he will not find it out; even though a wise man claims to know, he cannot find it out.";
asv[17] = "then I beheld all the work of God, that man cannot find out the work that is done under the sun: because however much a man labor to seek it out, yet he shall not find it; yea moreover, though a wise man think to know it, yet shall he not be able to find it.";
yng[17] = "then I considered all the work of God, that man is not able to find out the work that hath been done under the sun, because though man labour to seek, yet he doth not find; and even though the wise man speak of knowing he is not able to find.";
dby[17] = "then I saw that all [is] the work of God, [and] that man cannot find out the work that is done under the sun: because however man may labour to seek [it] out, yet doth he not find [it]; and even, if a wise [man] think to know [it], he shall not be able to find [it] out.";
web[17] = "Then I beheld all the work of God, that a man cannot find out the work that is done under the sun: because though a man may labor to seek [it] out, yet he shall not find [it]; yes further; though a wise [man] thinketh to know [it], yet shall he not be able to find [it].";
hnv[17] = "then I saw all the work of God, that man can\'t find out the work that is done under the sun, because however much a man labors to seek it out, yet he won\'t find it. Yes, moreover, though a wise man thinks he can comprehend it, yet he won\'t be able to find it.";
vul[17] = "et intellexi quod omnium operum Dei nullam possit homo invenire rationem eorum quae fiunt sub sole et quanto plus laboraverit ad quaerendum tanto minus inveniat etiam si dixerit sapiens se nosse non poterit repperire";
