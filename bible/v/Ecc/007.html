csb[1] = "A good name is better than fine perfume, and the day of one\'s death is better than the day of one\'s birth.";
csb[2] = "It is better to go to a house of mourning than to go to a house of feasting, since that is the end of all mankind, and the living should take it to heart.";
csb[3] = "Grief is better than laughter, for when a face is sad, a heart may be glad.";
csb[4] = "The heart of the wise is in a house of mourning, but the heart of fools is in a house of pleasure.";
csb[5] = "It is better to listen to rebuke from a wise person than to listen to the song of fools,";
csb[6] = "for like the crackling of burning thorns under the pot, so is the laughter of the fool. This too is futile.";
csb[7] = "Surely, the practice of extortion turns a wise person into a fool, and a bribe corrupts the mind.";
csb[8] = "The end of a matter is better than its beginning; a patient spirit is better than a proud spirit.";
csb[9] = "Don\'t let your spirit rush to be angry, for anger abides in the heart of fools.";
csb[10] = "Don\'t say, &quot;Why were the former days better than these? &quot; since it is not wise of you to ask this.";
csb[11] = "Wisdom is as good as an inheritance and an advantage to those who see the sun,";
csb[12] = "because wisdom is protection as silver is protection; but the advantage of knowledge is that wisdom preserves the life of its owner.";
csb[13] = "Consider the work of God, for who can straighten out what he has made crooked?";
csb[14] = "In the day of prosperity be joyful, but in the day of adversity, consider: God has made the one as well as the other, so that no one can discover anything that will come after him.";
csb[15] = "In my futile life I have seen everything: someone righteous perishes in spite of his righteousness, and someone wicked lives long in spite of his evil.";
csb[16] = "Don\'t be excessively righteous, and don\'t be overly wise. Why should you destroy yourself?";
csb[17] = "Don\'t be excessively wicked, and don\'t be foolish. Why should you die before your time?";
csb[18] = "It is good that you grasp the one and do not let the other slip from your hand. For the one who fears God will end up with both of them.";
csb[19] = "Wisdom makes the wise person stronger than ten rulers of a city.";
csb[20] = "There is certainly no one righteous on the earth who does good and never sins.";
csb[21] = "Don\'t pay attention to everything people say, or you may hear your servant cursing you,";
csb[22] = "for in your heart you know that many times you yourself have cursed others.";
csb[23] = "I have tested all this by wisdom. I resolved, &quot;I will be wise,&quot; but it was beyond me.";
csb[24] = "What exists is beyond reach and very deep. Who can discover it?";
csb[25] = "I turned my thoughts to know, explore, and examine wisdom and an explanation for things, and to know that wickedness is stupidity and folly is madness.";
csb[26] = "And I find more bitter than death the woman who is a trap: her heart a net and her hands chains. The one who pleases God will escape her, but the sinner will be captured by her.";
csb[27] = "&quot;Look,&quot; says the Teacher, &quot;I have discovered this by adding one thing to another to find out the explanation,";
csb[28] = "&quot;which my soul continually searches for but does not find: I found one person in a thousand, but none of those was a woman.";
csb[29] = "&quot;Only see this: I have discovered that God made people upright, but they pursued many schemes.&quot;";

rsv[25] = "I turned my mind to know and to search out and to seek wisdom and the sum of things, and to know the wickedness of folly and the foolishness which is madness.";
asv[25] = "I turned about, and my heart [was set] to know and to search out, and to seek wisdom and the reason [of things], and to know that wickedness is folly, and that foolishness is madness.";
yng[25] = "I have turned round, also my heart, to know and to search, and to seek out wisdom, and reason, and to know the wrong of folly, and of foolishness the madness.";
dby[25] = "I turned, I and my heart, to know, and to search, and to seek out wisdom and reason, and to know wickedness to be folly, and foolishness to be madness;";
web[25] = "I applied my heart to know, and to search, and to seek out wisdom, and the reason [of things], and to know the wickedness of folly, even of foolishness [and] madness:";
hnv[25] = " I turned around, and my heart sought to know and to search out, and to seek wisdom and the scheme of things, and to know that wickedness is stupidity, and that foolishness is madness.";
vul[25] = "[Vulgate 7:26] lustravi universa animo meo ut scirem et considerarem et quaererem sapientiam et rationem et ut cognoscerem impietatem stulti et errorem inprudentium";
kjv[26] = "And I find more bitter than death the woman, whose heart [is] snares and nets, [and] her hands [as] bands: whoso pleaseth God shall escape from her; but the sinner shall be taken by her.";
rsv[26] = "And I found more bitter than death the woman whose heart is snares and nets, and whose hands are fetters; he who pleases God escapes her, but the sinner is taken by her.";
asv[26] = "And I find more bitter than death the woman whose heart is snares and nets, [and] whose hands are bands: whoso pleaseth God shall escape from her; but the sinner shall be taken by her.";
yng[26] = "And I am finding more bitter than death, the woman whose heart [is] nets and snares, her hands [are] bands; the good before God escapeth from her, but the sinner is captured by her.";
dby[26] = "and I found more bitter than death the woman whose heart is nets and snares, [and] whose hands are bands: whoso pleaseth God shall escape from her; but the sinner shall be caught by her.";
web[26] = "And I find more bitter than death the woman whose heart [is] snares and nets, [and] her hands [as] bands: whoever pleaseth God shall escape from her; but the sinner shall be taken by her.";
hnv[26] = "I find more bitter than death the woman whose heart is snares and traps, whose hands are chains. Whoever pleases God shall escape from her; but the sinner will be ensnared by her.";
vul[26] = "[Vulgate 7:27] et inveni amariorem morte mulierem quae laqueus venatorum est et sagena cor eius vincula sunt manus illius qui placet Deo effugiet eam qui autem peccator est capietur ab illa";
kjv[27] = "Behold, this have I found, saith the preacher, [counting] one by one, to find out the account:";
rsv[27] = "Behold, this is what I found, says the Preacher, adding one thing to another to find the sum,";
asv[27] = "Behold, this have I found, saith the Preacher, [laying] one thing to another, to find out the account;";
yng[27] = "See, this I have found, said the Preacher, one to one, to find out the reason";
dby[27] = "See this which I have found, saith the Preacher, [searching] one by one to find out the reason;";
web[27] = "Behold, this have I found, saith the preacher, [counting] one by one, to find out the account:";
hnv[27] = "Behold, this have I found, says Kohelet, one to another, to find out the scheme;";
vul[27] = "[Vulgate 7:28] ecce hoc inveni dicit Ecclesiastes unum et alterum ut invenirem rationem";
kjv[28] = "Which yet my soul seeketh, but I find not: one man among a thousand have I found; but a woman among all those have I not found.";
rsv[28] = "which my mind has sought repeatedly, but I have not found. One man among a thousand I found, but a woman among all these I have not found.";
asv[28] = "which my soul still seeketh, but I have not found: one man among a thousand have I found; but a woman among all those have I not found.";
yng[28] = "(that still my soul had sought, and I had not found), One man, a teacher, I have found, and a woman among all these I have not found.";
dby[28] = "which my soul yet seeketh, and I have not found: one man among a thousand have I found, but a woman among all those have I not found.";
web[28] = "Which yet my soul seeketh, but I find not: one man among a thousand have I found; but a woman among all those have I not found.";
hnv[28] = "which my soul still seeks; but I have not found: one man among a thousand have I found; but a woman among all those have I not found.";
vul[28] = "[Vulgate 7:29] quam adhuc quaerit anima mea et non inveni virum de mille unum repperi mulierem ex omnibus non inveni";
kjv[29] = "Lo, this only have I found, that God hath made man upright; but they have sought out many inventions.";
rsv[29] = "Behold, this alone I found, that God made man upright, but they have sought out many devices.";
asv[29] = "Behold, this only have I found: that God made man upright; but they have sought out many inventions.";
yng[29] = "See, this alone I have found, that God made man upright, and they -- they have sought out many devices.";
dby[29] = "Only see this which I have found: that God made man upright, but they have sought out many devices.";
web[29] = "Lo, this only have I found, that God hath made man upright; but they have sought out many inventions.";
hnv[29] = "Behold, this only have I found: that God made man upright; but they search for many schemes.";
vul[29] = "[Vulgate 7:30] solummodo hoc inveni quod fecerit Deus hominem rectum et ipse se infinitis miscuerit quaestionibus quis talis ut sapiens est et quis cognovit solutionem verbi";
