csb[1] = "Dead flies make a perfumer\'s oil ferment and stink; so a little folly outweighs wisdom and honor.";
csb[2] = "A wise person\'s heart goes to the right, but a fool\'s heart to the left.";
csb[3] = "Even when the fool walks along the road, his heart lacks sense, and he shows everyone he is a fool.";
csb[4] = "If the ruler\'s anger rises against you, don\'t leave your post, for calmness puts great offenses to rest.";
csb[5] = "There is an evil I have seen under the sun, an error proceeding from the presence of the ruler:";
csb[6] = "The fool is appointed to great heights, but the rich remain in lowly positions.";
csb[7] = "I have seen slaves on horses, but princes walking on the ground like slaves.";
csb[8] = "The one who digs a pit may fall into it, and the one who breaks through a wall may be bitten by a snake.";
csb[9] = "The one who quarries stones may be hurt by them; the one who splits logs may be endangered by them.";
csb[10] = "If the ax is dull, and one does not sharpen its edge, then one must exert more strength; however, the advantage of wisdom is that it brings success.";
csb[11] = "If the snake bites before it is charmed, then there is no advantage for the charmer.";
csb[12] = "The words from the mouth of a wise person are gracious, but the lips of a fool consume him.";
csb[13] = "The beginning of the words from his mouth is folly, but the end of his speaking is evil madness;";
csb[14] = "yet the fool multiplies words. No one knows what will happen, and who can tell anyone what will happen after him?";
csb[15] = "The struggles of fools weary them, for they don\'t know how to go to the city.";
csb[16] = "Woe to you, land, when your king is a youth and your princes feast in the morning.";
csb[17] = "Blessed are you, land, when your king is a son of nobles and your princes feast at the proper time -- for strength and not for drunkenness.";
csb[18] = "Because of laziness the roof caves in, and because of negligent hands the house leaks.";
csb[19] = "A feast is prepared for laughter, and wine makes life happy, and money is the answer for everything.";
csb[20] = "Do not curse the king even in your thoughts, and do not curse a rich person even in your bedroom, for a bird of the sky may carry the message, and a winged creature may report the matter.";
kjv[1] = "Dead flies cause the ointment of the apothecary to send forth a stinking savour: [so doth] a little folly him that is in reputation for wisdom [and] honour.";
rsv[1] = "Dead flies make the perfumer\'s ointment give off an evil odor; so a little folly outweighs wisdom and honor.";
asv[1] = "Dead flies cause the oil of the perfumer to send forth an evil odor; [so] doth a little folly outweigh wisdom and honor.";
yng[1] = "Dead flies cause a perfumer\'s perfume To send forth a stink; The precious by reason of wisdom -- By reason of honour -- a little folly!";
dby[1] = "Dead flies cause the ointment of the apothecary to stink [and] ferment; [so] a little folly is weightier than wisdom [and] honour.";
web[1] = "Dead flies cause the ointment of the apothecary to send forth an offensive odor: [so doth] a little folly him that is in reputation for wisdom [and] honor.";
hnv[1] = "Dead flies cause the oil of the perfumer to send forth an evil odor; so does a little folly outweigh wisdom and honor.";

rsv[3] = "Even when the fool walks on the road, he lacks sense, and he says to every one that he is a fool.";

yng[3] = "And also, when he that is a fool Is walking in the way, his heart is lacking, And he hath said to every one, `He [is] a fool.\'";

rsv[10] = "If the iron is blunt, and one does not whet the edge, he must put forth more strength; but wisdom helps one to succeed.";
