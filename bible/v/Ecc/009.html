csb[1] = "Indeed, I took all this to heart and explained it all: The righteous, the wise, and their works are in God\'s hands. People don\'t know whether to expect love or hate. Everything lies ahead of them.";
csb[2] = "Everything is the same for everyone: There is one fate for the righteous and the wicked, for the good and the bad, for the clean and the unclean, for the one who sacrifices and the one who does not sacrifice. As it is for the good, so also it is for the sinner; as it is for the one who takes an oath, so also for the one who fears an oath.";
csb[3] = "This is an evil in all that is done under the sun: there is one fate for everyone. In addition, the hearts of people are full of evil, and madness is in their hearts while they live; after that they go to the dead.";
csb[4] = "But there is hope for whoever is joined with all the living, since a live dog is better than a dead lion.";
csb[5] = "For the living know that they will die, but the dead don\'t know anything. There is no longer a reward for them because the memory of them is forgotten.";
csb[6] = "Their love, their hate, and their envy have already disappeared, and there is no longer a portion for them in all that is done under the sun.";
csb[7] = "Go, eat your bread with pleasure, and drink your wine with a cheerful heart, for God has already accepted your works.";
csb[8] = "Let your clothes be white all the time, and never let oil be lacking on your head.";
csb[9] = "Enjoy life with the wife you love all the days of your fleeting life, which has been given to you under the sun, all your fleeting days. For that is your portion in life and in your struggle under the sun.";
csb[10] = "Whatever your hands find to do, do with all your strength, because there is no work, planning, knowledge, or wisdom in Sheol where you are going.";
csb[11] = "Again I saw under the sun that the race is not to the swift, or the battle to the strong, or bread to the wise, or riches to the discerning, or favor to the skillful; rather, time and chance happen to all of them.";
csb[12] = "For certainly no one knows his time: like fish caught in a cruel net or like birds caught in a trap, so people are trapped in an evil time as it suddenly falls on them.";
csb[13] = "I have observed that this also is wisdom under the sun, and it is significant to me:";
csb[14] = "There was a small city with few men in it. A great king came against it, surrounded it, and built large siege works against it.";
csb[15] = "Now a poor wise man was found in the city, and he delivered the city by his wisdom. Yet no one remembered that poor man.";
csb[16] = "And I said, &quot;Wisdom is better than strength, but the wisdom of the poor man is despised, and his words are not heeded.&quot;";
csb[17] = "The calm words of the wise are heeded more than the shouts of a ruler over fools.";
csb[18] = "Wisdom is better than weapons of war, but one sinner can destroy much good.";

yng[1] = "But all this I have laid unto my heart, so as to clear up the whole of this, that the righteous and the wise, and their works, [are] in the hand of God, neither love nor hatred doth man know, the whole [is] before them.";
dby[1] = "For all this I laid to my heart and [indeed] to investigate all this, that the righteous, and the wise, and their works, are in the hand of God; man knoweth neither love nor hatred: all is before them.";

kjv[2] = "All [things come] alike to all: [there is] one event to the righteous, and to the wicked; to the good and to the clean, and to the unclean; to him that sacrificeth, and to him that sacrificeth not: as [is] the good, so [is] the sinner; [and] he that sweareth, as [he] that feareth an oath.";
