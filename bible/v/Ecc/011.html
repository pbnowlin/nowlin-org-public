csb[1] = "Send your bread on the surface of the water, for after many days you may find it.";
csb[2] = "Give a portion to seven or even to eight, for you don\'t know what disaster may happen on earth.";
csb[3] = "If the clouds are full, they will pour out rain on the earth; whether a tree falls to the south or the north, the place where the tree falls, there it will lie.";
csb[4] = "One who watches the wind will not sow, and the one who looks at the clouds will not reap.";
csb[5] = "Just as you don\'t know the path of the wind, or how bones develop in the womb of a pregnant woman, so also you don\'t know the work of God who makes everything.";
csb[6] = "In the morning sow your seed, and at evening do not let your hand rest, because you don\'t know which will succeed, whether one or the other, or if both of them will be equally good.";
csb[7] = "Light is sweet, and it is pleasing for the eyes to see the sun.";
csb[8] = "Indeed, if someone lives many years, let him rejoice in them all, and let him remember the days of darkness, since they will be many. All that comes is futile.";
csb[9] = "Rejoice, young person, while you are young, and let your heart be glad in the days of your youth. And walk in the ways of your heart and in the desire of your eyes; but know that for all of these things God will bring you to judgment.";
csb[10] = "Remove sorrow from your heart, and put away pain from your flesh, because youth and the prime of life are fleeting.";
