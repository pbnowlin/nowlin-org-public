csb[1] = "The words of the Teacher, son of David, king in Jerusalem.";
csb[2] = "&quot;Absolute futility,&quot; says the Teacher. &quot;Absolute futility. Everything is futile.&quot;";
csb[3] = "What does a person gain for all his efforts that he labors at under the sun?";
csb[4] = "A generation goes and a generation comes, but the earth remains forever.";
csb[5] = "The sun rises and the sun sets; panting, it returns to the place where it rises.";
csb[6] = "Gusting to the south, turning to the north, turning, turning, goes the wind, and the wind returns in its cycles.";
csb[7] = "All the streams flow to the sea, yet the sea is never full; to the place where the streams flow, there they flow again.";
csb[8] = "All things are wearisome, more than anyone can say. The eye is not satisfied by seeing or the ear filled with hearing.";
csb[9] = "What has been is what will be, and what has been done is what will be done; there is nothing new under the sun.";
csb[10] = "Can one say about anything, &quot;Look, this is new&quot;? It has already existed in the ages before us.";
csb[11] = "There is no remembrance of those who came before; and of those who will come after there will also be no remembrance by those who follow them.";
csb[12] = "I, the Teacher, have been king over Israel in Jerusalem.";
csb[13] = "I applied my mind to examine and explore through wisdom all that is done under heaven. God has given people this miserable task to keep them occupied.";
csb[14] = "I have seen all the things that are done under the sun and have found everything to be futile, a pursuit of the wind.";
csb[15] = "What is crooked cannot be straightened; what is lacking cannot be counted.";
csb[16] = "I said to myself, &quot;See, I have amassed wisdom far beyond all those who were over Jerusalem before me, and my mind has thoroughly grasped wisdom and knowledge.&quot;";
csb[17] = "I applied my mind to know wisdom and knowledge, madness and folly; I learned that this too is a pursuit of the wind.";
csb[18] = "For with much wisdom is much sorrow; as knowledge increases, grief increases.";

kjv[8] = "All things [are] full of labour; man cannot utter [it]: the eye is not satisfied with seeing, nor the ear filled with hearing.";
rsv[8] = "All things are full of weariness; a man cannot utter it; the eye is not satisfied with seeing, nor the ear filled with hearing.";

kjv[10] = "Is there [any] thing whereof it may be said, See, this [is] new? it hath been already of old time, which was before us.";
rsv[10] = "Is there a thing of which it is said, &quot;See, this is new&quot;? It has been already, in the ages before us.";

yng[10] = "There is a thing of which [one] saith: `See this, it [is] new!\' already it hath been in the ages that were before us!";

hnv[10] = "Is there a thing of which it may be said, &quot;Behold, this is new?&quot; It has been long ago, in the ages which were before us.";
