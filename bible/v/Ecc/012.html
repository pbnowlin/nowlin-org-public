csb[1] = "So remember your Creator in the days of your youth: Before the days of adversity come, and the years approach when you will say, &quot;I have no delight in them&quot;;";
csb[2] = "before the sun and the light are darkened, and the moon and the stars, and the clouds return after the rain;";
csb[3] = "on the day when the guardians of the house tremble, and the strong men stoop, the women who grind grain cease because they are few, and the ones who watch through the windows see dimly,";
csb[4] = "the doors at the street are shut while the sound of the mill fades; when one rises at the sound of a bird, and all the daughters of song grow faint.";
csb[5] = "Also, they are afraid of heights and dangers on the road; the almond tree blossoms, the grasshopper loses its spring, and the caper berry has no effect; for the mere mortal is headed to his eternal home, and mourners will walk around in the street;";
csb[6] = "before the silver cord is snapped, and the gold bowl is broken, and the jar is shattered at the spring, and the wheel is broken into the well;";
csb[7] = "and the dust returns to the earth as it once was, and the spirit returns to God who gave it.";
csb[8] = "&quot;Absolute futility,&quot; says the Teacher. &quot;Everything is futile.&quot;";
csb[9] = "In addition to the Teacher being a wise man, he constantly taught the people knowledge; he weighed, explored, and arranged many proverbs.";
csb[10] = "The Teacher sought to find delightful sayings and write words of truth accurately.";
csb[11] = "The sayings of the wise are like cattle prods, and those from masters of collections are like firmly embedded nails. The sayings are given by one Shepherd.";
csb[12] = "But beyond these, my son, be warned: there is no end to the making of many books, and much study wearies the body.";
csb[13] = "When all has been heard, the conclusion of the matter is this: fear God and keep his commands, because this is for all humanity.";
csb[14] = "For God will bring every act to judgment, including every hidden thing, whether good or evil.";
