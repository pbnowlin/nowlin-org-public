csb[1] = "Guard your steps when you go to the house of God. Better to approach in obedience than to offer the sacrifice as fools do, for they ignorantly do wrong.";
csb[2] = "Do not be hasty to speak, and do not be impulsive to make a speech before God. God is in heaven and you are on earth, so let your words be few.";
csb[3] = "Just as dreams accompany much labor, so also a fool\'s voice comes with many words.";
csb[4] = "When you make a vow to God, don\'t delay fulfilling it, because he does not delight in fools. Fulfill what you vow.";
csb[5] = "Better that you do not vow than that you vow and not fulfill it.";
csb[6] = "Do not let your mouth bring guilt on you, and do not say in the presence of the messenger that it was a mistake. Why should God be angry with your words and destroy the work of your hands?";
csb[7] = "For many dreams bring futility, so do many words. Therefore, fear God.";
csb[8] = "If you see oppression of the poor and perversion of justice and righteousness in the province, don\'t be astonished at the situation, because one official protects another official, and higher officials protect them.";
csb[9] = "The profit from the land is taken by all; the king is served by the field.";
csb[10] = "The one who loves silver is never satisfied with silver, and whoever loves wealth is never satisfied with income. This too is futile.";
csb[11] = "When good things increase, the ones who consume them multiply; what, then, is the profit to the owner, except to gaze at them with his eyes?";
csb[12] = "The sleep of the worker is sweet, whether he eats little or much, but the abundance of the rich permits him no sleep.";
csb[13] = "There is a sickening tragedy I have seen under the sun: wealth kept by its owner to his harm.";
csb[14] = "That wealth was lost in a bad venture, so when he fathered a son, he was empty-handed.";
csb[15] = "As he came from his mother\'s womb, so he will go again, naked as he came; he will take nothing for his efforts that he can carry in his hands.";
csb[16] = "This too is a sickening tragedy: exactly as he comes, so he will go. What does the one gain who struggles for the wind?";
csb[17] = "What is more, he eats in darkness all his days, with much frustration, sickness, and anger.";
csb[18] = "Here is what I have seen to be good: It is appropriate to eat, drink, and experience good in all the labor one does under the sun during the few days of his life God has given him, because that is his reward.";
csb[19] = "Furthermore, everyone to whom God has given riches and wealth, he has also allowed him to enjoy them, take his reward, and rejoice in his labor. This is a gift of God,";
csb[20] = "for he does not often consider the days of his life because God keeps him occupied with the joy of his heart.";
kjv[1] = "Keep thy foot when thou goest to the house of God, and be more ready to hear, than to give the sacrifice of fools: for they consider not that they do evil.";
rsv[1] = "Guard your steps when you go to the house of God; to draw near to listen is better than to offer the sacrifice of fools; for they do not know that they are doing evil.";
asv[1] = "Keep thy foot when thou goest to the house of God; for to draw nigh to hear is better than to give the sacrifice of fools: for they know not that they do evil.";
yng[1] = "Keep thy feet when thou goest unto a house of God, and draw near to hear rather than to give of fools the sacrifice, for they do not know they do evil.";
dby[1] = "Keep thy foot when thou goest to the house of God, and draw near to hear, rather than to give the sacrifice of fools: for they know not that they do evil.";
web[1] = "Keep thy foot when thou goest to the house of God, and be more ready to hear, than to give the sacrifice of fools: for they consider not that they do evil.";
hnv[1] = "Guard your steps when you go to God\'s house; for to draw near to listen is better than to give the sacrifice of fools, for they don\'t know that they do evil.";
vul[1] = "[Vulgate 4:17] custodi pedem tuum ingrediens domum Dei multo enim melior est oboedientia quam stultorum victimae qui nesciunt quid faciant mali";
kjv[2] = "Be not rash with thy mouth, and let not thine heart be hasty to utter [any] thing before God: for God [is] in heaven, and thou upon earth: therefore let thy words be few.";
rsv[2] = "Be not rash with your mouth, nor let your heart be hasty to utter a word before God, for God is in heaven, and you upon earth; therefore let your words be few.";
asv[2] = "Be not rash with thy mouth, and let not thy heart be hasty to utter anything before God; for God is in heaven, and thou upon earth: therefore let thy words be few.";
yng[2] = "Cause not thy mouth to hasten, and let not thy heart hasten to bring out a word before God, for God is in the heavens, and thou on the earth, therefore let thy words be few.";
dby[2] = "Be not rash with thy mouth, and let not thy heart be hasty to utter anything before God: for God is in the heavens, and thou upon earth; therefore let thy words be few.";
web[2] = "Be not rash with thy mouth, and let not thy heart be hasty to utter [any] thing before God: for God [is] in heaven, and thou upon earth: therefore let thy words be few.";
hnv[2] = "Don\'t be rash with your mouth, and don\'t let your heart be hasty to utter anything before God; for God is in heaven, and you on eretz. Therefore let your words be few.";
vul[2] = "[Vulgate 5:1] ne temere quid loquaris neque cor tuum sit velox ad proferendum sermonem coram Deo Deus enim in caelo et tu super terram idcirco sint pauci sermones tui";
kjv[3] = "For a dream cometh through the multitude of business; and a fool\'s voice [is known] by multitude of words.";
rsv[3] = "For a dream comes with much business, and a fool\'s voice with many words.";
asv[3] = "For a dream cometh with a multitude of business, and a fool\'s voice with a multitude of words.";
yng[3] = "For the dream hath come by abundance of business, and the voice of a fool by abundance of words.";
dby[3] = "For a dream cometh through the multitude of business, and a fool\'s voice through a multitude of words.";
web[3] = "For a dream cometh through the multitude of business; and a fool\'s voice [is known] by a multitude of words.";
hnv[3] = "For as a dream comes with a multitude of cares, so a fool\'s speech with a multitude of words.";
vul[3] = "[Vulgate 5:2] multas curas sequuntur somnia et in multis sermonibus invenitur stultitia";
kjv[4] = "When thou vowest a vow unto God, defer not to pay it; for [he hath] no pleasure in fools: pay that which thou hast vowed.";
rsv[4] = "When you vow a vow to God, do not delay paying it; for he has no pleasure in fools. Pay what you vow.";
asv[4] = "When thou vowest a vow unto God, defer not to pay it; for he hath no pleasure in fools: pay that which thou vowest.";
yng[4] = "When thou vowest a vow to God, delay not to complete it, for there is no pleasure in fools; that which thou vowest -- complete.";
dby[4] = "When thou vowest a vow unto God, defer not to pay it; for he hath no pleasure in fools: pay that which thou hast vowed.";
web[4] = "When thou vowest a vow to God, defer not to pay it; for [he hath] no pleasure in fools: pay that which thou hast vowed.";
hnv[4] = "When you vow a vow to God, don\'t defer to pay it; for he has no pleasure in fools. Pay that which you vow.";
vul[4] = "[Vulgate 5:3] si quid vovisti Deo ne moreris reddere displicet enim ei infidelis et stulta promissio sed quodcumque voveris redde";
kjv[5] = "Better [is it] that thou shouldest not vow, than that thou shouldest vow and not pay.";
rsv[5] = "It is better that you should not vow than that you should vow and not pay.";
asv[5] = "Better is it that thou shouldest not vow, than that thou shouldest vow and not pay.";
yng[5] = "Better that thou do not vow, than that thou dost vow and dost not complete.";
dby[5] = "Better is it that thou shouldest not vow, than that thou shouldest vow and not pay.";
web[5] = "Better [is it] that thou shouldst not vow, than that thou shouldst vow and not pay.";
hnv[5] = "It is better that you should not vow, than that you should vow and not pay.";
vul[5] = "[Vulgate 5:4] multoque melius est non vovere quam post votum promissa non conplere";
kjv[6] = "Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that it [was] an error: wherefore should God be angry at thy voice, and destroy the work of thine hands?";
rsv[6] = "Let not your mouth lead you into sin, and do not say before the messenger that it was a mistake; why should God be angry at your voice, and destroy the work of your hands?";
asv[6] = "Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that is was an error: wherefore should God be angry at thy voice, and destroy the work of thy hands?";
yng[6] = "Suffer not thy mouth to cause thy flesh to sin, nor say before the messenger, that `it [is] an error,\' why is God wroth because of thy voice, and hath destroyed the work of thy hands?";
dby[6] = "Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that it was an inadvertence. Wherefore should God be wroth at thy voice, and destroy the work of thy hands?";
web[6] = "Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that it [was] an error: why should God be angry at thy voice, and destroy the work of thy hands?";
hnv[6] = "Don\'t allow your mouth to lead you into sin. Don\'t protest before the messenger that this was a mistake. Why should God be angry at your voice, and destroy the work of your hands?";
vul[6] = "[Vulgate 5:5] ne dederis os tuum ut peccare faciat carnem tuam neque dicas coram angelo non est providentia ne forte iratus Deus super sermone tuo dissipet cuncta opera manuum tuarum";
kjv[7] = "For in the multitude of dreams and many words [there are] also [divers] vanities: but fear thou God.";
rsv[7] = "For when dreams increase, empty words grow many: but do you fear God.";
asv[7] = "For in the multitude of dreams there are vanities, and in many words: but fear thou God.";
yng[7] = "For, in the abundance of dreams both vanities and words abound; but fear thou God.";
dby[7] = "For in the multitude of dreams are vanities; so with many words: but fear God.";
web[7] = "For in the multitude of dreams and many words [there are] also [divers] vanities: but fear thou God.";
hnv[7] = "For in the multitude of dreams there are vanities, as well as in many words: but you must fear God.";
vul[7] = "[Vulgate 5:6] ubi multa sunt somnia plurimae vanitates et sermones innumeri tu vero Deum time";
kjv[8] = "If thou seest the oppression of the poor, and violent perverting of judgment and justice in a province, marvel not at the matter: for [he that is] higher than the highest regardeth; and [there be] higher than they.";
rsv[8] = "If you see in a province the poor oppressed and justice and right violently taken away, do not be amazed at the matter; for the high official is watched by a higher, and there are yet higher ones over them.";
asv[8] = "If thou seest the oppression of the poor, and the violent taking away of justice and righteousness in a province, marvel not at the matter: for one higher than the high regardeth; and there are higher than they.";
yng[8] = "If oppression of the poor, and violent taking away of judgment and righteousness thou seest in a province, do not marvel at the matter, for a higher than the high is observing, and high ones [are] over them.";
dby[8] = "If thou seest the oppression of the poor, and violent perverting of judgment and justice in a province, marvel not at the matter; for a higher than the high is watching, and there are higher than they.";
web[8] = "If thou seest the oppression of the poor, and violent perversion of judgment and justice in a province, wonder not at the matter: for [he that is] higher than the highest regardeth; and [there are] higher than they.";
hnv[8] = "If you see the oppression of the poor, and the violent taking away of justice and righteousness in a district, don\'t marvel at the matter: for one official is eyed by a higher one; and there are officials over them.";
vul[8] = "[Vulgate 5:7] si videris calumnias egenorum et violenta iudicia et subverti iustitiam in provincia non mireris super hoc negotio quia excelso alius excelsior est et super hos quoque eminentiores sunt alii";

hnv[9] = "Moreover the profit of the eretz is for all. The king profits from the field.";
vul[9] = "[Vulgate 5:8] et insuper universae terrae rex imperat servienti";

rsv[10] = "He who loves money will not be satisfied with money; nor he who loves wealth, with gain: this also is vanity.";
asv[10] = "He that loveth silver shall not be satisfied with silver; nor he that loveth abundance, with increase: this also is vanity.";
yng[10] = "Whoso is loving silver is not satisfied [with] silver, nor he who is in love with stores [with] increase. Even this [is] vanity.";
dby[10] = "He that loveth silver shall not be satisfied with silver, nor he that loveth abundance with increase. This also is vanity.";
web[10] = "He that loveth silver shall not be satisfied with silver; nor he that loveth abundance with increase: this [is] also vanity.";
hnv[10] = "He who loves silver shall not be satisfied with silver; nor he who loves abundance, with increase: this also is vanity.";

kjv[11] = "When goods increase, they are increased that eat them: and what good [is there] to the owners thereof, saving the beholding [of them] with their eyes?";
rsv[11] = "When goods increase, they increase who eat them; and what gain has their owner but to see them with his eyes?";
asv[11] = "When goods increase, they are increased that eat them; and what advantage is there to the owner thereof, save the beholding [of them] with his eyes?";
yng[11] = "In the multiplying of good have its consumers been multiplied, and what benefit [is] to its possessor except the sight of his eyes?";
dby[11] = "When goods increase, they are increased that eat them; and what profit is there to the owner thereof, except the beholding [of them] with his eyes?";
web[11] = "When goods increase, they are increased that eat them: and what good [is there] to the owners of them, saving the beholding [of them] with their eyes?";
hnv[11] = "When goods increase, those who eat them are increased; and what advantage is there to its owner, except to feast on them with his eyes?";
vul[11] = "[Vulgate 5:10] ubi multae sunt opes multi et qui comedant eas et quid prodest possessori nisi quod cernit divitias oculis suis";

yng[12] = "Sweet [is] the sleep of the labourer whether he eat little or much; and the sufficiency of the wealthy is not suffering him to sleep.";
dby[12] = "The sleep of the labourer is sweet, whether he have eaten little or much; but the fulness of the rich doth not suffer him to sleep.";
web[12] = "The sleep of a laboring man [is] sweet, whether he eateth little or much: but the abundance of the rich will not suffer him to sleep.";
hnv[12] = "The sleep of a laboring man is sweet, whether he eats little or much; but the abundance of the rich will not allow him to sleep.";
vul[12] = "[Vulgate 5:11] dulcis est somnus operanti sive parum sive multum comedat saturitas autem divitis non sinit dormire eum";

asv[13] = "There is a grievous evil which I have seen under the sun, [namely], riches kept by the owner thereof to his hurt:";
yng[13] = "There is a painful evil I have seen under the sun: wealth kept for its possessor, for his evil.";
dby[13] = "There is a grievous evil that I have seen under the sun: riches kept for the owners thereof to their hurt;";
web[13] = "There is a grievous evil [which] I have seen under the sun, [namely], riches kept for the owners of them to their hurt.";
hnv[13] = "There is a grievous evil which I have seen under the sun: wealth kept by its owner to his harm.";
vul[13] = "[Vulgate 5:12] est et alia infirmitas pessima quam vidi sub sole divitiae conservatae in malum domini sui";
kjv[14] = "But those riches perish by evil travail: and he begetteth a son, and [there is] nothing in his hand.";

asv[14] = "and those riches perish by evil adventure; and if he hath begotten a son, there is nothing in his hand.";
yng[14] = "And that wealth hath been lost in an evil business, and he hath begotten a son and there is nothing in his hand!";
dby[14] = "or those riches perish by some evil circumstance, and if he have begotten a son, there is nothing in his hand.";

hnv[14] = "Those riches perish by misfortune, and if he has fathered a son, there is nothing in his hand.";
vul[14] = "[Vulgate 5:13] pereunt enim in adflictione pessima generavit filium qui in summa egestate erit";
kjv[15] = "As he came forth of his mother\'s womb, naked shall he return to go as he came, and shall take nothing of his labour, which he may carry away in his hand.";
rsv[15] = "As he came from his mother\'s womb he shall go again, naked as he came, and shall take nothing for his toil, which he may carry away in his hand.";
asv[15] = "As he came forth from his mother\'s womb, naked shall he go again as he came, and shall take nothing for his labor, which he may carry away in his hand.";
yng[15] = "As he came out from the belly of his mother, naked he turneth back to go as he came, and he taketh not away anything of his labour, that doth go in his hand.";
dby[15] = "As he came forth from his mother\'s womb, naked shall he go away again as he came, and shall take nothing of his labour, which he may carry away in his hand.";
web[15] = "As he came into the world, naked shall he return to go as he came, and shall take nothing of his labor, which he may carry away in his hand.";
hnv[15] = "As he came forth from his mother\'s womb, naked shall he go again as he came, and shall take nothing for his labor, which he may carry away in his hand.";

yng[16] = "And this also [is] a painful evil, just as he came, so he goeth, and what advantage [is] to him who laboureth for wind?";
dby[16] = "And this also is a grievous evil, that in all points as he came so doth he go away, and what profit hath he, in having laboured for the wind?";

hnv[16] = "This also is a grievous evil, that in all points as he came, so shall he go. And what profit does he have who labors for the wind?";
vul[16] = "[Vulgate 5:15] miserabilis prorsus infirmitas quomodo venit sic revertetur quid ergo prodest ei quod laboravit in ventum";

yng[17] = "Also all his days in darkness he consumeth, and sadness, and wrath, and sickness abound.";
dby[17] = "All his days also he eateth in darkness, and hath much vexation, and sickness, and irritation.";
web[17] = "All his days also he eateth in darkness, and [he hath] much sorrow and wrath with his sickness.";
hnv[17] = "All his days he also eats in darkness, he is frustrated, and has sickness and wrath.";
vul[17] = "[Vulgate 5:16] cunctis diebus vitae suae comedit in tenebris et in curis multis et in aerumna atque tristitia";
kjv[18] = "Behold [that] which I have seen: [it is] good and comely [for one] to eat and to drink, and to enjoy the good of all his labour that he taketh under the sun all the days of his life, which God giveth him: for it [is] his portion.";
rsv[18] = "Behold, what I have seen to be good and to be fitting is to eat and drink and find enjoyment in all the toil with which one toils under the sun the few days of his life which God has given him, for this is his lot.";
asv[18] = "Behold, that which I have seen to be good and to be comely is for one to eat and to drink, and to enjoy good in all his labor, wherein he laboreth under the sun, all the days of his life which God hath given him: for this is his portion.";
yng[18] = "Lo, that which I have seen: [It is] good, because beautiful, to eat, and to drink, and to see good in all one\'s labour that he laboureth at under the sun, the number of the days of his life that God hath given to him, for it [is] his portion.";
dby[18] = "Behold what I have seen good and comely: [it is] to eat and to drink, and to enjoy good in all his labour wherewith [man] laboureth under the sun, all the days of his life which God hath given him: for that is his portion.";
web[18] = "Behold [that] which I have seen: [it is] good and comely [for one] to eat and to drink, and to enjoy the good of all his labor that he taketh under the sun all the days of his life, which God giveth him: for it [is] his portion.";
hnv[18] = "Behold, that which I have seen to be good and proper is for one to eat and to drink, and to enjoy good in all his labor, in which he labors under the sun, all the days of his life which God has given him; for this is his portion.";
vul[18] = "[Vulgate 5:17] hoc itaque mihi visum est bonum ut comedat quis et bibat et fruatur laetitia ex labore suo quod laboravit ipse sub sole numerum dierum vitae suae quos dedit ei Deus et haec est pars illius";
kjv[19] = "Every man also to whom God hath given riches and wealth, and hath given him power to eat thereof, and to take his portion, and to rejoice in his labour; this [is] the gift of God.";
rsv[19] = "Every man also to whom God has given wealth and possessions and power to enjoy them, and to accept his lot and find enjoyment in his toil--this is the gift of God.";
asv[19] = "Every man also to whom God hath given riches and wealth, and hath given him power to eat thereof, and to take his portion, and to rejoice in his labor-this is the gift of God.";
yng[19] = "Every man also to whom God hath given wealth and riches, and hath given him power to eat of it, and to accept his portion, and to rejoice in his labour, this is a gift of God.";
dby[19] = "Every man also to whom God hath given riches and wealth, and power to eat thereof, and to take his portion and to rejoice in his labour: that is a gift of God.";
web[19] = "Every man also to whom God hath given riches and wealth, and hath given him power to eat of it, and to take his portion, and to rejoice in his labor; this [is] the gift of God.";
hnv[19] = "Every man also to whom God has given riches and wealth, and has given him power to eat of it, and to take his portion, and to rejoice in his labor -- this is the gift of God.";
vul[19] = "[Vulgate 5:18] et omni homini cui dedit Deus divitias atque substantiam potestatemque ei tribuit ut comedat ex eis et fruatur parte sua et laetetur de labore suo hoc est donum Dei";
kjv[20] = "For he shall not much remember the days of his life; because God answereth [him] in the joy of his heart.";
rsv[20] = "For he will not much remember the days of his life because God keeps him occupied with joy in his heart.";
asv[20] = "For he shall not much remember the days of his life; because God answereth [him] in the joy of his heart.";
yng[20] = "For he doth not much remember the days of his life, for God is answering through the joy of his heart.";
dby[20] = "For he will not much remember the days of his life, because God answereth [him] with the joy of his heart.";
web[20] = "For he shall not much remember the days of his life; because God answereth [him] in the joy of his heart.";
hnv[20] = "For he shall not often reflect on the days of his life; because God occupies him with the joy of his heart.";
vul[20] = "[Vulgate 5:19] non enim satis recordabitur dierum vitae suae eo quod Deus occupet deliciis cor eius";
