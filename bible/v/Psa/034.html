kjv[1] = "[[[A Psalm] of David, when he changed his behaviour before Abimelech; who drove him away, and he departed.]] I will bless the LORD at all times: his praise [shall] continually [be] in my mouth.";
rsv[1] = "A Psalm of David, when he feigned madness before Abimelech, so that he drove him out, and he went away. I will bless the LORD at all times; his praise shall continually be in my mouth.";
asv[1] = "[A Psalm] of David; when he changed his behavior before Abimelech, who drove him away, and he departed. I will bless Jehovah at all times: His praise shall continually be in my mouth. ";
yng[1] = "By David, in his changing his behaviour before Abimelech, and he driveth him away, and he goeth. I do bless Jehovah at all times, Continually His praise [is] in my mouth.";
dby[1] = "{[A Psalm] of David; when he changed his behaviour before Abimelech, who drove him away, and he departed.} I will bless Jehovah at all times; his praise shall continually be in my mouth.";
web[1] = "[A Psalm] of David, when he changed his behavior before Abimelech; who drove him away, and he departed. I will bless the LORD at all times: his praise [shall] continually [be] in my mouth.";
hnv[1] = "By David; when he pretended to be insane before Avimelekh, who drove him away, and he departed. I will bless the LORD at all times. His praise will always be in my mouth.";
vul[1] = "[Vulgate 33:1] David quando commutavit os suum coram Abimelech et eiecit eum et abiit [Vulgate 33:2] benedicam Domino in omni tempore semper laus eius in ore meo";
kjv[2] = "My soul shall make her boast in the LORD: the humble shall hear [thereof], and be glad.";
rsv[2] = "My soul makes its boast in the LORD; let the afflicted hear and be glad.";
asv[2] = "My soul shall make her boast in Jehovah: The meek shall hear thereof, and be glad. ";
yng[2] = "In Jehovah doth my soul boast herself, Hear do the humble and rejoice.";
dby[2] = "My soul shall make its boast in Jehovah: the meek shall hear, and rejoice.";
web[2] = "My soul shall make her boast in the LORD: the humble shall hear [of it] and be glad.";
hnv[2] = "My soul shall boast in the LORD. The humble shall hear of it, and be glad.";
vul[2] = "[Vulgate 33:3] in Domino laetabitur anima mea audiant mites et laetentur";
kjv[3] = "O magnify the LORD with me, and let us exalt his name together.";
rsv[3] = "O magnify the LORD with me, and let us exalt his name together!";
asv[3] = "Oh magnify Jehovah with me, And let us exalt his name together. ";
yng[3] = "Ascribe ye greatness to Jehovah with me, And we exalt His name together.";
dby[3] = "Magnify Jehovah with me, and let us exalt his name together.";
web[3] = "O magnify the LORD with me, and let us exalt his name together.";
hnv[3] = "Oh magnify the LORD with me. Let us exalt his name together.";
vul[3] = "[Vulgate 33:4] magnificate Dominum mecum et exaltemus nomen eius pariter";
kjv[4] = "I sought the LORD, and he heard me, and delivered me from all my fears.";
rsv[4] = "I sought the LORD, and he answered me, and delivered me from all my fears.";
asv[4] = "I sought Jehovah, and he answered me, And delivered me from all my fears. ";
yng[4] = "I sought Jehovah, and He answered me, And from all my fears did deliver me.";
dby[4] = "I sought Jehovah, and he answered me, and delivered me from all my fears.";
web[4] = "I sought the LORD, and he heard me, and delivered me from all my fears.";
hnv[4] = "I sought the LORD, and he answered me, And delivered me from all my fears.";
vul[4] = "[Vulgate 33:5] quaesivi Dominum et exaudivit me et de omnibus angustiis meis liberavit me";
kjv[5] = "They looked unto him, and were lightened: and their faces were not ashamed.";
rsv[5] = "Look to him, and be radiant; so your faces shall never be ashamed.";
asv[5] = "They looked unto him, and were radiant; And their faces shall never be confounded. ";
yng[5] = "They looked expectingly unto Him, And they became bright, And their faces are not ashamed.";
dby[5] = "They looked unto him, and were enlightened, and their faces were not confounded.";
web[5] = "They looked to him, and were lightened: and their faces were not ashamed.";
hnv[5] = "They looked to him, and were radiant. Their faces shall never be covered with shame.";
vul[5] = "[Vulgate 33:6] respicite ad eum et confluite et vultus vestri non confundentur";
kjv[6] = "This poor man cried, and the LORD heard [him], and saved him out of all his troubles.";
rsv[6] = "This poor man cried, and the LORD heard him, and saved him out of all his troubles.";
asv[6] = "This poor man cried, and Jehovah heard him, And saved him out of all his troubles. ";
yng[6] = "This poor [one] called, and Jehovah heard, And from all his distresses saved him.";
dby[6] = "This afflicted one called, and Jehovah heard [him], and saved him out of all his troubles.";
web[6] = "This poor man cried, and the LORD heard [him], and saved him out of all his troubles.";
hnv[6] = "This poor man cried, and the LORD heard him, And saved him out of all his troubles.";
vul[6] = "[Vulgate 33:7] hic pauper clamavit et Dominus exaudivit de omnibus tribulationibus salvabit eum";
kjv[7] = "The angel of the LORD encampeth round about them that fear him, and delivereth them.";
rsv[7] = "The angel of the LORD encamps around those who fear him, and delivers them.";
asv[7] = "The angel of Jehovah encampeth round about them that fear him, And delivereth them. ";
yng[7] = "A messenger of Jehovah is encamping, Round about those who fear Him, And He armeth them.";
dby[7] = "The angel of Jehovah encampeth round about them that fear him, and delivereth them.";
web[7] = "The angel of the LORD encampeth around them that fear him, and delivereth them.";
hnv[7] = "The angel of the LORD encamps round about those who fear him, And delivers them.";
vul[7] = "[Vulgate 33:8] circumdat angelus Domini in gyro timentes eum et eruet eos";
kjv[8] = "O taste and see that the LORD [is] good: blessed [is] the man [that] trusteth in him.";
rsv[8] = "O taste and see that the LORD is good! Happy is the man who takes refuge in him!";
asv[8] = "Oh taste and see that Jehovah is good: Blessed is the man that taketh refuge in him. ";
yng[8] = "Taste ye and see that Jehovah [is] good, O the happiness of the man who trusteth in Him.";
dby[8] = "Taste and see that Jehovah is good: blessed is the man that trusteth in him!";
web[8] = "O taste and see that the LORD [is] good: blessed [is] the man [that] trusteth in him.";
hnv[8] = "Oh taste and see that the LORD is good. Blessed is the man who takes refuge in him.";
vul[8] = "[Vulgate 33:9] gustate et videte quoniam bonus Dominus beatus vir qui sperat in eo";
kjv[9] = "O fear the LORD, ye his saints: for [there is] no want to them that fear him.";
rsv[9] = "O fear the LORD, you his saints, for those who fear him have no want!";
asv[9] = "Oh fear Jehovah, ye his saints; For there is no want to them that fear him. ";
yng[9] = "Fear Jehovah, ye His holy ones, For there is no lack to those fearing Him.";
dby[9] = "Fear Jehovah, ye his saints; for there is no want to them that fear him.";
web[9] = "O fear the LORD, ye his saints: for [there is] no want to them that fear him.";
hnv[9] = "Oh fear the LORD, you his holy ones, For there is no lack with those who fear him.";
vul[9] = "[Vulgate 33:10] timete Dominum sancti eius quoniam non est inopia timentibus eum";
kjv[10] = "The young lions do lack, and suffer hunger: but they that seek the LORD shall not want any good [thing].";
rsv[10] = "The young lions suffer want and hunger; but those who seek the LORD lack no good thing.";
asv[10] = "The young lions do lack, and suffer hunger; But they that seek Jehovah shall not want any good thing. ";
yng[10] = "Young lions have lacked and been hungry, And those seeking Jehovah lack not any good,";
dby[10] = "The young lions are in need and suffer hunger; but they that seek Jehovah shall not want any good.";
web[10] = "The young lions do lack, and suffer hunger: but they that seek the LORD shall not want any good [thing].";
hnv[10] = "The young lions do lack, and suffer hunger, But those who seek the LORD shall not lack any good thing.";
vul[10] = "[Vulgate 33:11] leones indiguerunt et esurierunt quaerentibus autem Dominum non deerit omne bonum";
kjv[11] = "Come, ye children, hearken unto me: I will teach you the fear of the LORD.";

asv[11] = "Come, ye children, hearken unto me: I will teach you the fear of Jehovah. ";
yng[11] = "Come ye, children, hearken to me, The fear of Jehovah I do teach you.";
dby[11] = "Come, ye sons, hearken unto me: I will teach you the fear of Jehovah.";
web[11] = "Come, ye children, hearken to me; I will teach you the fear of the LORD.";
hnv[11] = "Come, you children, listen to me. I will teach you the fear of the LORD.";
vul[11] = "[Vulgate 33:12] venite filii audite me timorem Domini docebo vos";
kjv[12] = "What man [is he that] desireth life, [and] loveth [many] days, that he may see good?";
rsv[12] = "What man is there who desires life, and covets many days, that he may enjoy good?";
asv[12] = "What man is he that desireth life, And loveth [many] days, that he may see good? ";
yng[12] = "Who [is] the man that is desiring life? Loving days to see good?";
dby[12] = "What man is he that desireth life, [and] loveth days, that he may see good?";
web[12] = "What man [is he that] desireth life, [and] loveth [many] days, that he may see good?";
hnv[12] = "Who is someone who desires life, And loves many days, that he may see good?";
vul[12] = "[Vulgate 33:13] quis est vir qui velit vitam diligens dies videre bonos";
kjv[13] = "Keep thy tongue from evil, and thy lips from speaking guile.";
rsv[13] = "Keep your tongue from evil, and your lips from speaking deceit.";
asv[13] = "Keep thy tongue from evil, And thy lips from speaking guile. ";
yng[13] = "Keep thy tongue from evil, And thy lips from speaking deceit.";
dby[13] = "Keep thy tongue from evil, and thy lips from speaking guile;";
web[13] = "Keep thy tongue from evil, and thy lips from speaking guile.";
hnv[13] = "Keep your tongue from evil, And your lips from speaking lies.";
vul[13] = "[Vulgate 33:14] custodi linguam tuam a malo et labia tua ne loquantur dolum";
kjv[14] = "Depart from evil, and do good; seek peace, and pursue it.";
rsv[14] = "Depart from evil, and do good; seek peace, and pursue it.";
asv[14] = "Depart from evil, and do good; Seek peace, and pursue it. ";
yng[14] = "Turn aside from evil and do good, Seek peace and pursue it.";
dby[14] = "Depart from evil, and do good; seek peace, and pursue it.";
web[14] = "Depart from evil, and do good; seek peace, and pursue it.";
hnv[14] = "Depart from evil, and do good. Seek shalom, and pursue it.";
vul[14] = "[Vulgate 33:15] recede a malo et fac bonum quaere pacem et persequere eam";
kjv[15] = "The eyes of the LORD [are] upon the righteous, and his ears [are open] unto their cry.";
rsv[15] = "The eyes of the LORD are toward the righteous, and his ears toward their cry.";
asv[15] = "The eyes of Jehovah are toward the righteous, And his ears are [open] unto their cry. ";
yng[15] = "The eyes of Jehovah [are] unto the righteous, And His ears unto their cry.";
dby[15] = "The eyes of Jehovah are upon the righteous, and his ears are toward their cry;";
web[15] = "The eyes of the LORD [are] upon the righteous, and his ears [are open] to their cry.";
hnv[15] = "The LORD\'s eyes are toward the righteous. His ears listen to their cry.";
vul[15] = "[Vulgate 33:16] oculi Domini ad iustos et aures eius ad clamorem eorum";
kjv[16] = "The face of the LORD [is] against them that do evil, to cut off the remembrance of them from the earth.";
rsv[16] = "The face of the LORD is against evildoers, to cut off the remembrance of them from the earth.";
asv[16] = "The face of Jehovah is against them that do evil, To cut off the remembrance of them from the earth. ";
yng[16] = "(The face of Jehovah [is] on doers of evil, To cut off from earth their memorial.)";
dby[16] = "The face of Jehovah is against them that do evil, to cut off the remembrance of them from the earth:";

hnv[16] = "The LORD\'s face is against those who do evil, To cut off the memory of them from the eretz.";
vul[16] = "[Vulgate 33:17] vultus Domini super facientes malum ut perdat de terra memoriam eorum";
kjv[17] = "[The righteous] cry, and the LORD heareth, and delivereth them out of all their troubles.";

asv[17] = " [The righteous] cried, and Jehovah heard, And delivered them out of all their troubles. ";
yng[17] = "They cried, and Jehovah heard, And from all their distresses delivered them.";
dby[17] = "[The righteous] cry, and Jehovah heareth, and delivereth them out of all their troubles.";
web[17] = "[The righteous] cry, and the LORD heareth, and delivereth them out of all their troubles.";
hnv[17] = "The righteous cry, and the LORD hears, And delivers them out of all their troubles.";
vul[17] = "[Vulgate 33:18] clamaverunt et Dominus exaudivit et ex omnibus tribulationibus eorum liberavit eos";
kjv[18] = "The LORD [is] nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.";
rsv[18] = "The LORD is near to the brokenhearted, and saves the crushed in spirit.";
asv[18] = "Jehovah is nigh unto them that are of a broken heart, And saveth such as are of a contrite spirit. ";
yng[18] = "Near [is] Jehovah to the broken of heart, And the bruised of spirit He saveth.";
dby[18] = "Jehovah is nigh to those that are of a broken heart, and saveth them that are of a contrite spirit.";
web[18] = "The LORD [is] nigh to them that are of a broken heart; and saveth such as are of a contrite spirit.";
hnv[18] = "The LORD is near to those who have a broken heart, And saves those who have a crushed spirit.";
vul[18] = "[Vulgate 33:19] iuxta est Dominus contritis corde et confractos spiritu salvabit";
kjv[19] = "Many [are] the afflictions of the righteous: but the LORD delivereth him out of them all.";
rsv[19] = "Many are the afflictions of the righteous; but the LORD delivers him out of them all.";
asv[19] = "Many are the afflictions of the righteous; But Jehovah delivereth him out of them all. ";

web[19] = "Many [are] the afflictions of the righteous: but the LORD delivereth him out of them all.";
hnv[19] = "Many are the afflictions of the righteous, But the LORD delivers him out of them all.";
vul[19] = "[Vulgate 33:20] multae tribulationes iusti et ex omnibus illis liberabit eum Dominus";
kjv[20] = "He keepeth all his bones: not one of them is broken.";
rsv[20] = "He keeps all his bones; not one of them is broken.";
asv[20] = "He keepeth all his bones: Not one of them is broken. ";
yng[20] = "He is keeping all his bones, One of them hath not been broken.";
dby[20] = "He keepeth all his bones; not one of them is broken.";
web[20] = "He keepeth all his bones: not one of them is broken.";
hnv[20] = "He protects all of his bones. Not one of them is broken.";
vul[20] = "[Vulgate 33:21] custodit omnia ossa eius unum ex eis non confringetur";
kjv[21] = "Evil shall slay the wicked: and they that hate the righteous shall be desolate.";
rsv[21] = "Evil shall slay the wicked; and those who hate the righteous will be condemned.";

yng[21] = "Evil doth put to death the wicked, And those hating the righteous are desolate.";
dby[21] = "Evil shall destroy the wicked; and they that hate the righteous shall bear their guilt.";
web[21] = "Evil shall slay the wicked: and they that hate the righteous shall be desolate.";
hnv[21] = "Evil shall kill the wicked. Those who hate the righteous shall be condemned.";

kjv[22] = "The LORD redeemeth the soul of his servants: and none of them that trust in him shall be desolate.";
rsv[22] = "The LORD redeems the life of his servants; none of those who take refuge in him will be condemned.";

yng[22] = "Jehovah redeemeth the soul of His servants, And none trusting in Him are desolate!";
dby[22] = "Jehovah redeemeth the soul of his servants; and none of them that trust in him shall bear guilt.";
web[22] = "The LORD redeemeth the soul of his servants: and none of them that trust in him shall be desolate.";
hnv[22] = "The LORD redeems the soul of his servants. None of those who take refuge in him shall be condemned. ";

csb[1] = "I will bless the LORD at all times; his praise will always be on my lips.";
csb[2] = "I will boast in the LORD; the humble will hear and be glad.";
csb[3] = "Proclaim the LORD\'s greatness with me; let us exalt his name together.";
csb[4] = "I sought the LORD, and he answered me and rescued me from all my fears.";
csb[5] = "Those who look to him are radiant with joy; their faces will never be ashamed.";
csb[6] = "This poor man cried, and the LORD heard him and saved him from all his troubles.";
csb[7] = "The angel of the LORD encamps around those who fear him, and rescues them.";
csb[8] = "Taste and see that the LORD is good. How happy is the person who takes refuge in him!";
csb[9] = "You who are his holy ones, fear the LORD, for those who fear him lack nothing.";
csb[10] = "Young lions lack food and go hungry, but those who seek the LORD will not lack any good thing.";
csb[11] = "Come, children, listen to me; I will teach you the fear of the LORD.";
csb[12] = "Who is someone who desires life, loving a long life to enjoy what is good?";
csb[13] = "Keep your tongue from evil and your lips from deceitful speech.";
csb[14] = "Turn away from evil and do what is good; seek peace and pursue it.";
csb[15] = "The eyes of the LORD are on the righteous, and his ears are open to their cry for help.";
csb[16] = "The face of the LORD is set against those who do what is evil, to remove all memory of them from the earth.";
csb[17] = "The righteous cry out, and the LORD hears, and rescues them from all their troubles.";
csb[18] = "The LORD is near the brokenhearted; he saves those crushed in spirit.";
csb[19] = "One who is righteous has many adversities, but the LORD rescues him from them all.";
csb[20] = "He protects all his bones; not one of them is broken.";
csb[21] = "Evil brings death to the wicked, and those who hate the righteous will be punished.";
csb[22] = "The LORD redeems the life of his servants, and all who take refuge in him will not be punished.";
