kjv[1] = "Wash me throughly from mine iniquity, and cleanse me from my sin.";
rsv[1] = "To the choirmaster. A Psalm of David, when Nathan the prophet came to him, after he had gone in to Bathsheba. Have mercy on me, O God, according to thy steadfast love; according to thy abundant mercy blot out my transgressions.";
asv[1] = "[For the Chief Musician. A Psalm of David; when Nathan the prophet came unto him, after he had gone in to Bathsheba.] Have mercy upon me, O God, according to thy lovingkindness: According to the multitude of thy tender mercies blot out my transgressions. ";
yng[1] = "To the Overseer. -- A Psalm of David, in the coming inn unto him of Nathan the prophet, when he hath gone in unto Bath-Sheba. Favour me, O God, according to Thy kindness, According to the abundance of Thy mercies, Blot out my transgressions.";
dby[1] = "{To the chief Musician. A Psalm of David; when Nathan the prophet came to him, after he had gone in to Bath-sheba.} Be gracious unto me, O God, according to thy loving-kindness; according to the abundance of thy tender mercies, blot out my transgressions.";
web[1] = "To the chief Musician, A Psalm of David, when Nathan the prophet came to him, after he had gone in to Bath-sheba. Have mercy upon me, O God, according to thy loving-kindness: according to the multitude of thy tender mercies, blot out my transgressions.";
hnv[1] = "For the Chief Musician. A Psalm by David, when Natan the prophet came to him, after he had gone in to Bat-Sheva. Have mercy on me, God, according to your lovingkindness. According to the multitude of your tender mercies, blot out my transgressions.";
vul[1] = "[Vulgate 50:1] victori canticum David [Vulgate 50:2] cum venisset ad eum Nathan propheta quando ingressus est ad Bethsabee [Vulgate 50:3] miserere mei Deus secundum misericordiam tuam iuxta multitudinem miserationum tuarum dele iniquitates meas";
kjv[2] = "For I acknowledge my transgressions: and my sin [is] ever before me.";
rsv[2] = "Wash me thoroughly from my iniquity, and cleanse me from my sin!";
asv[2] = "Wash me thoroughly from mine iniquity, And cleanse me from my sin. ";
yng[2] = "Thoroughly wash me from mine iniquity, And from my sin cleanse me,";
dby[2] = "Wash me fully from mine iniquity, and cleanse me from my sin.";
web[2] = "Wash me thoroughly from my iniquity, and cleanse me from my sin.";
hnv[2] = "Wash me thoroughly from my iniquity. Cleanse me from my sin.";
vul[2] = "[Vulgate 50:4] multum lava me ab iniquitate mea et a peccato meo munda me";
kjv[3] = "Against thee, thee only, have I sinned, and done [this] evil in thy sight: that thou mightest be justified when thou speakest, [and] be clear when thou judgest.";
rsv[3] = "For I know my transgressions, and my sin is ever before me.";
asv[3] = "For I know my transgressions; And my sin is ever before me. ";
yng[3] = "For my transgressions I do know, And my sin [is] before me continually.";
dby[3] = "For I acknowledge my transgressions, and my sin is continually before me.";
web[3] = "For I acknowledge my transgressions: and my sin [is] ever before me.";
hnv[3] = "For I know my transgressions. My sin is constantly before me.";
vul[3] = "[Vulgate 50:5] quoniam iniquitates meas ego novi et peccatum meum contra me est semper";
kjv[4] = "Behold, I was shapen in iniquity; and in sin did my mother conceive me.";
rsv[4] = "Against thee, thee only, have I sinned, and done that which is evil in thy sight, so that thou art justified in thy sentence and blameless in thy judgment.";
asv[4] = "Against thee, thee only, have I sinned, And done that which is evil in thy sight; That thou mayest be justified when thou speakest, And be clear when thou judgest. ";
yng[4] = "Against Thee, Thee only, I have sinned, And done the evil thing in Thine eyes, So that Thou art righteous in Thy words, Thou art pure in Thy judging.";
dby[4] = "Against thee, thee only, have I sinned, and done what is evil in thy sight; that thou mayest be justified when thou speakest, be clear when thou judgest.";
web[4] = "Against thee, thee only, have I sinned, and done [this] evil in thy sight: that thou mayest be justified when thou speakest, [and] be clear when thou judgest.";
hnv[4] = "Against you, and you only, have I sinned, And done that which is evil in your sight; That you may be proved right when you speak, And justified when you judge.";
vul[4] = "[Vulgate 50:6] tibi soli peccavi et malum coram te feci ut iustificeris in sermonibus tuis et vincas cum iudicaveris";
kjv[5] = "Behold, thou desirest truth in the inward parts: and in the hidden [part] thou shalt make me to know wisdom.";
rsv[5] = "Behold, I was brought forth in iniquity, and in sin did my mother conceive me.";
asv[5] = "Behold, I was brought forth in iniquity; And in sin did my mother conceive me. ";
yng[5] = "Lo, in iniquity I have been brought forth, And in sin doth my mother conceive me.";
dby[5] = "Behold, in iniquity was I brought forth, and in sin did my mother conceive me.";
web[5] = "Behold, I was shapen in iniquity; and in sin did my mother conceive me.";
hnv[5] = "Behold, I was brought forth in iniquity. In sin my mother conceived me.";
vul[5] = "[Vulgate 50:7] ecce in iniquitate conceptus sum et in peccato peperit me mater mea";
kjv[6] = "Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.";
rsv[6] = "Behold, thou desirest truth in the inward being; therefore teach me wisdom in my secret heart.";
asv[6] = "Behold, thou desirest truth in the inward parts; And in the hidden part thou wilt make me to know wisdom. ";
yng[6] = "Lo, truth Thou hast desired in the inward parts, And in the hidden part Wisdom Thou causest me to know.";
dby[6] = "Behold, thou wilt have truth in the inward parts; and in the hidden [part] thou wilt make me to know wisdom.";
web[6] = "Behold, thou desirest truth in the inward parts: and in the hidden [part] thou shalt make me to know wisdom.";
hnv[6] = "Behold, you desire truth in the inward parts. You teach me wisdom in the inmost place.";
vul[6] = "[Vulgate 50:8] ecce enim veritatem diligis absconditum et arcanum sapientiae manifestasti mihi";
kjv[7] = "Make me to hear joy and gladness; [that] the bones [which] thou hast broken may rejoice.";
rsv[7] = "Purge me with hyssop, and I shall be clean; wash me, and I shall be whiter than snow.";
asv[7] = "Purify me with hyssop, and I shall be clean: Wash me, and I shall be whiter than snow. ";
yng[7] = "Thou cleansest me with hyssop and I am clean, Washest me, and than snow I am whiter.";
dby[7] = "Purge me with hyssop, and I shall be clean; wash me, and I shall be whiter than snow.";
web[7] = "Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.";
hnv[7] = "Purify me with hyssop, and I will be clean. Wash me, and I will be whiter than snow.";
vul[7] = "[Vulgate 50:9] asparges me hysopo et mundabor lavabis me et super nivem dealbabor";
kjv[8] = "Hide thy face from my sins, and blot out all mine iniquities.";
rsv[8] = "Fill me with joy and gladness; let the bones which thou hast broken rejoice.";
asv[8] = "Make me to hear joy and gladness, That the bones which thou hast broken may rejoice. ";
yng[8] = "Thou causest me to hear joy and gladness, Thou makest joyful bones Thou hast bruised.";
dby[8] = "Make me to hear gladness and joy; [that] the bones which thou hast broken may rejoice.";
web[8] = "Make me to hear joy and gladness; [that] the bones [which] thou hast broken may rejoice.";
hnv[8] = "Let me hear joy and gladness, That the bones which you have broken may rejoice.";
vul[8] = "[Vulgate 50:10] auditum mihi facies gaudium et laetitiam ut exultent ossa quae confregisti";
kjv[9] = "Create in me a clean heart, O God; and renew a right spirit within me.";
rsv[9] = "Hide thy face from my sins, and blot out all my iniquities.";
asv[9] = "Hide thy face from my sins, And blot out all mine iniquities. ";
yng[9] = "Hide Thy face from my sin. And all mine iniquities blot out.";
dby[9] = "Hide thy face from my sins, and blot out all mine iniquities.";
web[9] = "Hide thy face from my sins, and blot out all my iniquities.";
hnv[9] = "Hide your face from my sins, And blot out all of my iniquities.";
vul[9] = "[Vulgate 50:11] absconde faciem tuam a peccatis meis et omnes iniquitates meas dele";
kjv[10] = "Cast me not away from thy presence; and take not thy holy spirit from me.";
rsv[10] = "Create in me a clean heart, O God, and put a new and right spirit within me.";
asv[10] = "Create in me a clean heart, O God; And renew a right spirit within me. ";
yng[10] = "A clean heart prepare for me, O God, And a right spirit renew within me.";
dby[10] = "Create in me a clean heart, O God, and renew a steadfast spirit within me.";
web[10] = "Create in me a clean heart, O God; and renew a right spirit within me.";
hnv[10] = "Create in me a clean heart, O God. Renew a right spirit within me.";
vul[10] = "[Vulgate 50:12] cor mundum crea mihi Deus et spiritum stabilem renova in visceribus meis";
kjv[11] = "Restore unto me the joy of thy salvation; and uphold me [with thy] free spirit.";
rsv[11] = "Cast me not away from thy presence, and take not thy holy Spirit from me.";
asv[11] = "Cast me not away from thy presence; And take not thy holy Spirit from me. ";
yng[11] = "Cast me not forth from Thy presence, And Thy Holy Spirit take not from me.";
dby[11] = "Cast me not away from thy presence, and take not the spirit of thy holiness from me.";
web[11] = "Cast me not away from thy presence; and take not thy holy spirit from me.";
hnv[11] = "Don\'t throw me from your presence, And don\'t take your holy Spirit from me.";
vul[11] = "[Vulgate 50:13] ne proicias me a facie tua et spiritum sanctum tuum ne auferas a me";
kjv[12] = "[Then] will I teach transgressors thy ways; and sinners shall be converted unto thee.";
rsv[12] = "Restore to me the joy of thy salvation, and uphold me with a willing spirit.";
asv[12] = "Restore unto me the joy of thy salvation; And uphold me with a willing spirit. ";
yng[12] = "Restore to me the joy of Thy salvation, And a willing spirit doth sustain me.";
dby[12] = "Restore unto me the joy of thy salvation, and let a willing spirit sustain me.";
web[12] = "Restore to me the joy of thy salvation; and uphold me [with thy] free spirit.";
hnv[12] = "Restore to me the joy of your salvation. Uphold me with a willing spirit.";
vul[12] = "[Vulgate 50:14] redde mihi laetitiam Iesu tui et spiritu potenti confirma me";
kjv[13] = "Deliver me from bloodguiltiness, O God, thou God of my salvation: [and] my tongue shall sing aloud of thy righteousness.";
rsv[13] = "Then I will teach transgressors thy ways, and sinners will return to thee.";
asv[13] = "Then will I teach transgressors thy ways; And sinners shall be converted unto thee. ";
yng[13] = "I teach transgressors Thy ways, And sinners unto Thee do return.";
dby[13] = "I will teach transgressors thy ways, and sinners shall return unto thee.";
web[13] = "[Then] will I teach transgressors thy ways; and sinners shall be converted to thee.";
hnv[13] = "Then I will teach transgressors your ways. Sinners shall be converted to you.";
vul[13] = "[Vulgate 50:15] docebo iniquos vias tuas et peccatores ad te revertentur";
kjv[14] = "O Lord, open thou my lips; and my mouth shall shew forth thy praise.";
rsv[14] = "Deliver me from bloodguiltiness, O God, thou God of my salvation, and my tongue will sing aloud of thy deliverance.";
asv[14] = "Deliver me from bloodguiltiness, O God, thou God of my salvation; [And] my tongue shall sing aloud of thy righteousness. ";
yng[14] = "Deliver me from blood, O God, God of my salvation, My tongue singeth of Thy righteousness.";
dby[14] = "Deliver me from blood-guiltiness, O God, thou God of my salvation: my tongue shall sing aloud of thy righteousness.";
web[14] = "Deliver me from blood-guiltiness, O God, thou God of my salvation: [and] my tongue shall sing aloud of thy righteousness.";
hnv[14] = "Deliver me from bloodguiltiness, O God, the God of my salvation. My tongue shall sing aloud of your righteousness.";
vul[14] = "[Vulgate 50:16] libera me de sanguinibus Deus Deus salutis meae laudabit lingua mea iustitiam tuam";
kjv[15] = "For thou desirest not sacrifice; else would I give [it]: thou delightest not in burnt offering.";
rsv[15] = "O Lord, open thou my lips, and my mouth shall show forth thy praise.";
asv[15] = "O Lord, open thou my lips; And my mouth shall show forth thy praise. ";
yng[15] = "O Lord, my lips thou dost open, And my mouth declareth Thy praise.";
dby[15] = "Lord, open my lips, and my mouth shall declare thy praise.";
web[15] = "O Lord, open thou my lips; and my mouth shall show forth thy praise.";
hnv[15] = "Lord, open my lips. My mouth shall declare your praise.";
vul[15] = "[Vulgate 50:17] Domine labia mea aperies et os meum adnuntiabit laudem tuam";
kjv[16] = "The sacrifices of God [are] a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.";
rsv[16] = "For thou hast no delight in sacrifice; were I to give a burnt offering, thou wouldst not be pleased.";
asv[16] = "For thou delightest not in sacrifice; else would I give it: Thou hast no pleasure in burnt-offering. ";
yng[16] = "For Thou desirest not sacrifice, or I give [it], Burnt-offering Thou acceptest not.";
dby[16] = "For thou desirest not sacrifice; else would I give it: thou hast no pleasure in burnt-offering.";
web[16] = "For thou desirest not sacrifice: else would I give [it]: thou delightest not in burnt-offering.";
hnv[16] = "For you don\'t delight in sacrifice, or else I would give it. You have no pleasure in burnt offering.";
vul[16] = "[Vulgate 50:18] non enim vis ut victimam feriam nec holocaustum tibi placet";
kjv[17] = "Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem.";
rsv[17] = "The sacrifice acceptable to God is a broken spirit; a broken and contrite heart, O God, thou wilt not despise.";
asv[17] = "The sacrifices of God are a broken spirit: A broken and a contrite heart, O God, thou wilt not despise. ";
yng[17] = "The sacrifices of God [are] a broken spirit, A heart broken and bruised, O God, Thou dost not despise.";
dby[17] = "The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.";
web[17] = "The sacrifices of God [are] a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.";
hnv[17] = "The sacrifices of God are a broken spirit. A broken and contrite heart, O God, you will not despise.";
vul[17] = "[Vulgate 50:19] sacrificium Dei spiritus contribulatus cor contritum et humiliatum Deus non dispicies";
kjv[18] = "Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar.";
rsv[18] = "Do good to Zion in thy good pleasure; rebuild the walls of Jerusalem,";
asv[18] = "Do good in thy good pleasure unto Zion: Build thou the walls of Jerusalem. ";
yng[18] = "Do good in Thy good pleasure with Zion, Thou dost build the walls of Jerusalem.";
dby[18] = "Do good in thy good pleasure unto Zion; build the walls of Jerusalem.";
web[18] = "Do good in thy good pleasure to Zion: build thou the walls of Jerusalem.";
hnv[18] = "Do well in your good pleasure to Tziyon. Build the walls of Yerushalayim.";
vul[18] = "[Vulgate 50:20] benefac Domine in voluntate tua Sion et aedificentur muri Hierusalem";
kjv[19] = "[[To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bathsheba.]] Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.";
rsv[19] = "then wilt thou delight in right sacrifices, in burnt offerings and whole burnt offerings; then bulls will be offered on thy altar.";
asv[19] = "Then wilt thou delight in the sacrifices of righteousness, In burnt-offering and whole burnt-offering: Then will they offer bullocks upon thine altar. ";
yng[19] = "Then Thou desirest sacrifices of righteousness, Burnt-offering, and whole burnt-offering, Then they offer bullocks on thine altar!";
dby[19] = "Then shalt thou have sacrifices of righteousness, burnt-offering, and whole burnt-offering; then shall they offer up bullocks upon thine altar.";
web[19] = "Then shalt thou be pleased with the sacrifices of righteousness, with burnt-offering and whole burnt-offering: then shall they offer bullocks upon thy altar.";
hnv[19] = "Then you will delight in the sacrifices of righteousness, In burnt offerings and in whole burnt offerings. Then they will offer bulls on your altar. ";
vul[19] = "[Vulgate 50:21] tunc suscipies sacrificium iustitiae oblationes et holocausta tunc inponent super altare tuum vitulos";
csb[1] = "Be gracious to me, God, according to your faithful love; according to your abundant compassion, blot out my rebellion.";
csb[2] = "Completely wash away my guilt and cleanse me from my sin.";
csb[3] = "For I am conscious of my rebellion, and my sin is always before me.";
csb[4] = "Against you -- you alone -- I have sinned and done this evil in your sight. So you are right when you pass sentence; you are blameless when you judge.";
csb[5] = "Indeed, I was guilty when I was born; I was sinful when my mother conceived me.";
csb[6] = "Surely you desire integrity in the inner self, and you teach me wisdom deep within.";
csb[7] = "Purify me with hyssop, and I will be clean; wash me, and I will be whiter than snow.";
csb[8] = "Let me hear joy and gladness; let the bones you have crushed rejoice.";
csb[9] = "Turn your face away from my sins and blot out all my guilt.";
csb[10] = "God, create a clean heart for me and renew a steadfast spirit within me.";
csb[11] = "Do not banish me from your presence or take your Holy Spirit from me.";
csb[12] = "Restore the joy of your salvation to me, and sustain me by giving me a willing spirit.";
csb[13] = "Then I will teach the rebellious your ways, and sinners will return to you.";
csb[14] = "Save me from the guilt of bloodshed, God -- God of my salvation -- and my tongue will sing of your righteousness.";
csb[15] = "Lord, open my lips, and my mouth will declare your praise.";
csb[16] = "You do not want a sacrifice, or I would give it; you are not pleased with a burnt offering.";
csb[17] = "The sacrifice pleasing to God is a broken spirit. You will not despise a broken and humbled heart, God.";
csb[18] = "In your good pleasure, cause Zion to prosper; build the walls of Jerusalem.";
csb[19] = "Then you will delight in righteous sacrifices, whole burnt offerings; then bulls will be offered on your altar.";
</script>
