kjv[1] = "[[To the chief Musician, Altaschith, Michtam of David, when he fled from Saul in the cave.]] Be merciful unto me, O God, be merciful unto me: for my soul trusteth in thee: yea, in the shadow of thy wings will I make my refuge, until [these] calamities be overpast.";
rsv[1] = "To the choirmaster: according to Do Not Destroy. A Miktam of David, when he fled from Saul, in the cave. Be merciful to me, O God, be merciful to me, for in thee my soul takes refuge; in the shadow of thy wings I will take refuge, till the storms of destruction pass by.";
asv[1] = "For the Chief Musician; [set to] Al-tashheth. [A Psalm] of David. Michtam; when he fled from Saul, in the cave. Be merciful unto me, O God, be merciful unto me; For my soul taketh refuge in thee: Yea, in the shadow of thy wings will I take refuge, Until [these] calamities be overpast. ";
yng[1] = "To the Overseer. -- `Destroy not.\' -- A secret treasure of David, in his fleeing from the face of Saul into a cave. Favour me, O God, favour me, For in Thee is my soul trusting, And in the shadow of Thy wings I trust, Until the calamities pass over.";
dby[1] = "{To the chief Musician. \'Destroy not.\' Of David. Michtam; when he fled from Saul in the cave.} Be gracious unto me, O God, be gracious unto me; for my soul taketh refuge in thee: yea, in the shadow of thy wings do I take refuge, until the calamities be overpast.";
web[1] = "To the chief Musician, Al-taschith, Michtam of David, when he fled from Saul in the cave. Be merciful to me, O God, be merciful to me: for my soul trusteth in thee: yes, in the shadow of thy wings will I make my refuge, until [these] calamities are overpast.";
hnv[1] = "For the Chief Musician. To the tune &quot;Do Not Destroy.&quot; A miktam by David, when he fled from Sha\'ul, in the cave. Be merciful to me, God, be merciful to me, For my soul takes refuge in you. Yes, in the shadow of your wings, I will take refuge, Until disaster has passed.";
vul[1] = "[Vulgate 56:1] pro victoria ut non disperdas David humilem et simplicem quando fugit a facie Saul in spelunca [Vulgate 56:2] miserere mei Deus miserere mei quoniam in te sperat anima mea in umbra alarum tuarum sperabo donec transeant insidiae";
kjv[2] = "I will cry unto God most high; unto God that performeth [all things] for me.";
rsv[2] = "I cry to God Most High, to God who fulfils his purpose for me.";
asv[2] = "I will cry unto God Most High, Unto God that performeth [all things] for me. ";
yng[2] = "I call to God Most High, To God [who] is perfecting for me.";
dby[2] = "I will call unto God, the Most High; unto God that performeth [all] for me.";
web[2] = "I will cry to God most high; to God that performeth [all things] for me.";
hnv[2] = "I cry out to El `Elyon, To God who accomplishes my requests for me.";
vul[2] = "[Vulgate 56:3] invocabo Deum altissimum Deum ultorem meum";
kjv[3] = "He shall send from heaven, and save me [from] the reproach of him that would swallow me up. Selah. God shall send forth his mercy and his truth.";
rsv[3] = "He will send from heaven and save me, he will put to shame those who trample upon me. [Selah] God will send forth his steadfast love and his faithfulness!";
asv[3] = "He will send from heaven, and save me, [When] he that would swallow me up reproacheth; [Selah God will send forth his lovingkindness and his truth. ";
yng[3] = "He sendeth from the heaven, and saveth me, He reproached -- who is panting after me. Selah. God sendeth forth His kindness and His truth.";
dby[3] = "He will send from the heavens and save me; he hath covered with reproach him that would swallow me up. Selah. God hath sent forth his loving-kindness and his truth.";
web[3] = "He shall send from heaven, and save me [from] the reproach of him that would swallow me up. Selah. God shall send forth his mercy and his truth.";
hnv[3] = "He will send from heaven, and save me, He rebukes the one who is pursuing me. Selah. God will send out his lovingkindness and his truth.";
vul[3] = "[Vulgate 56:4] mittet de caelo et salvabit me exprobrabit conculcantibus me semper mittet Deus misericordiam suam et veritatem suam";
kjv[4] = "My soul [is] among lions: [and] I lie [even among] them that are set on fire, [even] the sons of men, whose teeth [are] spears and arrows, and their tongue a sharp sword.";
rsv[4] = "I lie in the midst of lions that greedily devour the sons of men; their teeth are spears and arrows, their tongues sharp swords.";
asv[4] = "My soul is among lions; I lie among them that are set on fire, Even the sons of men, whose teeth are spears and arrows, And their tongue a sharp sword. ";
yng[4] = "My soul [is] in the midst of lions, I lie down [among] flames -- sons of men, Their teeth [are] a spear and arrows, And their tongue a sharp sword.";
dby[4] = "My soul is in the midst of lions; I lie down [among] them that breathe out flames, the sons of men, whose teeth are spears and arrows, and their tongue a sharp sword.";
web[4] = "My soul [is] among lions: [and] I lie [even among] them that are set on fire, [even] the sons of men, whose teeth [are] spears and arrows, and their tongue a sharp sword.";
hnv[4] = "My soul is among lions. I lie among those who are set on fire, Even the sons of men, whose teeth are spears and arrows, And their tongue a sharp sword.";
vul[4] = "[Vulgate 56:5] anima mea in medio leonum dormivit ferocientium filii hominum dentes eorum lancea et sagittae et lingua eorum gladius acutus";
kjv[5] = "Be thou exalted, O God, above the heavens; [let] thy glory [be] above all the earth.";
rsv[5] = "Be exalted, O God, above the heavens! Let thy glory be over all the earth!";
asv[5] = "Be thou exalted, O God, above the heavens; [Let] thy glory [be] above all the earth. ";
yng[5] = "Be Thou exalted above the heavens, O God, Above all the earth Thine honour.";
dby[5] = "Be exalted above the heavens, O God; let thy glory be above all the earth!";
web[5] = "Be thou exalted, O God, above the heavens; [let] thy glory [be] above all the earth.";
hnv[5] = "Be exalted, God, above the heavens! Let your glory be above all the eretz!";
vul[5] = "[Vulgate 56:6] exaltare super caelos Deus in omni terra gloria tua";
kjv[6] = "They have prepared a net for my steps; my soul is bowed down: they have digged a pit before me, into the midst whereof they are fallen [themselves]. Selah.";
rsv[6] = "They set a net for my steps; my soul was bowed down. They dug a pit in my way, but they have fallen into it themselves. [Selah]";
asv[6] = "They have prepared a net for my steps; My soul is bowed down: They have digged a pit before me; They are fallen into the midst thereof themselves. [Selah";
yng[6] = "A net they have prepared for my steps, Bowed down hath my soul, They have digged before me a pit, They have fallen into its midst. Selah.";
dby[6] = "They have prepared a net for my steps; my soul was bowed down: they have digged a pit before me; they are fallen into the midst thereof. Selah.";
web[6] = "They have prepared a net for my steps; my soul is bowed down: they have digged a pit before me, into the midst of which they have fallen [themselves]. Selah.";
hnv[6] = "They have prepared a net for my steps. My soul is bowed down. They dig a pit before me. They fall into the midst of it themselves. Selah.";
vul[6] = "[Vulgate 56:7] rete paraverunt gressibus meis ad incurvandam animam meam foderunt ante me foveam ceciderunt in medium eius semper";
kjv[7] = "My heart is fixed, O God, my heart is fixed: I will sing and give praise.";
rsv[7] = "My heart is steadfast, O God, my heart is steadfast! I will sing and make melody!";
asv[7] = "My heart is fixed, O God, my heart is fixed: I will sing, yea, I will sing praises. ";
yng[7] = "Prepared is my heart, O God, Prepared is my heart, I sing and praise.";
dby[7] = "My heart is fixed, O God, my heart is fixed: I will sing, yea, I will sing psalms.";
web[7] = "My heart is fixed, O God, my heart is fixed: I will sing and give praise.";
hnv[7] = "My heart is steadfast, God, my heart is steadfast. I will sing, yes, I will sing praises.";
vul[7] = "[Vulgate 56:8] paratum cor meum Deus paratum cor meum cantabo et psallam";
kjv[8] = "Awake up, my glory; awake, psaltery and harp: I [myself] will awake early.";
rsv[8] = "Awake, my soul! Awake, O harp and lyre! I will awake the dawn!";
asv[8] = "Awake up, my glory; awake, psaltery and harp: I myself will awake right early. ";
yng[8] = "Awake, mine honour, awake, psaltery and harp, I awake the morning dawn.";
dby[8] = "Awake, my glory; awake, lute and harp: I will wake the dawn.";
web[8] = "Awake, my glory; awake, psaltery and harp: I [myself] will awake early.";
hnv[8] = "Wake up, my glory! Wake up, psaltery and harp! I will wake up the dawn.";
vul[8] = "[Vulgate 56:9] surge gloria mea surge psalterium et cithara surgam mane";
kjv[9] = "I will praise thee, O Lord, among the people: I will sing unto thee among the nations.";
rsv[9] = "I will give thanks to thee, O Lord, among the peoples; I will sing praises to thee among the nations.";
asv[9] = "I will give thanks unto thee, O Lord, among the peoples: I will sing praises unto thee among the nations. ";
yng[9] = "I thank Thee among the peoples, O Lord, I praise Thee among the nations.";
dby[9] = "I will give thee thanks among the peoples, O Lord; of thee will I sing psalms among the nations:";
web[9] = "I will praise thee, O Lord, among the people: I will sing to thee among the nations.";
hnv[9] = "I will give thanks to you, Lord, among the peoples. I will sing praises to you among the nations.";
vul[9] = "[Vulgate 56:10] confitebor tibi in populis Domine cantabo tibi in gentibus";
kjv[10] = "For thy mercy [is] great unto the heavens, and thy truth unto the clouds.";
rsv[10] = "For thy steadfast love is great to the heavens, thy faithfulness to the clouds.";
asv[10] = "For thy lovingkindness is great unto the heavens, And thy truth unto the skies. ";
yng[10] = "For great unto the heavens [is] Thy kindness, And unto the clouds Thy truth.";
dby[10] = "For thy loving-kindness is great unto the heavens, and thy truth unto the clouds.";
web[10] = "For thy mercy [is] great to the heavens, and thy truth to the clouds.";
hnv[10] = "For your great lovingkindness reaches to the heavens, And your truth to the skies.";
vul[10] = "[Vulgate 56:11] quia magna usque ad caelos misericordia tua et usque ad nubes veritas tua";
kjv[11] = "Be thou exalted, O God, above the heavens: [let] thy glory [be] above all the earth.";
rsv[11] = "Be exalted, O God, above the heavens! Let thy glory be over all the earth!";
asv[11] = "Be thou exalted, O God, above the heavens; [Let] thy glory [be] above all the earth. ";
yng[11] = "Be thou exalted above the heavens, O God. Above all the earth Thine honour!";
dby[11] = "Be exalted above the heavens, O God; let thy glory be above all the earth!";
web[11] = "Be thou exalted, O God, above the heavens: [let] thy glory [be] above all the earth.";
hnv[11] = "Be exalted, God, above the heavens. Let your glory be over all the eretz. ";
vul[11] = "[Vulgate 56:12] exaltare super caelos Deus in omni terra gloria tua";
csb[1] = "Be gracious to me, God, be gracious to me, for I take refuge in you. I will seek refuge in the shadow of your wings until danger passes.";
csb[2] = "I call to God Most High, to God who fulfills his purpose for me.";
csb[3] = "He reaches down from heaven and saves me, challenging the one who tramples me. Selah God sends his faithful love and truth.";
csb[4] = "I am surrounded by lions; I lie down among devouring lions -- people whose teeth are spears and arrows, whose tongues are sharp swords.";
csb[5] = "God, be exalted above the heavens; let your glory be over the whole earth.";
csb[6] = "They prepared a net for my steps; I was despondent. They dug a pit ahead of me, but they fell into it! Selah";
csb[7] = "My heart is confident, God, my heart is confident. I will sing; I will sing praises.";
csb[8] = "Wake up, my soul! Wake up, harp and lyre! I will wake up the dawn.";
csb[9] = "I will praise you, Lord, among the peoples; I will sing praises to you among the nations.";
csb[10] = "For your faithful love is as high as the heavens; your faithfulness reaches the clouds.";
csb[11] = "God, be exalted above the heavens; let your glory be over the whole earth.";
</script>
