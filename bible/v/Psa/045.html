kjv = [];

kjv[1] = "[[To the chief Musician upon Shoshannim, for the sons of Korah, Maschil, A Song of loves.]] My heart is inditing a good matter: I speak of the things which I have made touching the king: my tongue [is] the pen of a ready writer.";
rsv[1] = "To the choirmaster: according to Lilies. A Maskil of the Sons of Korah; a love song. My heart overflows with a goodly theme; I address my verses to the king; my tongue is like the pen of a ready scribe.";
asv[1] = "For the Chief Musician; set to Shoshannim. [A Psalm] of the sons of Korah. Maschil. A Song of loves. My heart overfloweth with a goodly matter; I speak the things which I have made touching the king: My tongue is the pen of a ready writer. ";
yng[1] = "To the Overseer. -- `On the Lilies.\' -- By sons of Korah. -- An Instruction. -- A song of loves. My heart hath indited a good thing, I am telling my works to a king, My tongue [is] the pen of a speedy writer.";
dby[1] = "{To the chief Musician. Upon Shoshannim. Of the sons of Korah. An instruction; -- a song of the Beloved.} My heart is welling forth [with] a good matter: I say what I have composed touching the king. My tongue is the pen of a ready writer.";
web[1] = "To the chief Musician upon Shoshannim, for the sons of Korah, Maschil, A Song of loves. My heart is inditing a good matter: I speak of the things which I have made concerning the king: my tongue [is] the pen of a ready writer.";
hnv[1] = "For the Chief Musician. Set to &quot;The Lilies.&quot; A maskil by the sons of Korach. A wedding song. My heart overflows with a noble theme. I recite my verses for the king. My tongue is like the pen of a skillful writer.";
vul[1] = "[Vulgate 44:1] victori pro liliis filiorum Core eruditionis canticum amantissimi [Vulgate 44:2] eructavit cor meum verbum bonum dico ego opera mea regi lingua mea stilus scribae velocis";
kjv[2] = "Thou art fairer than the children of men: grace is poured into thy lips: therefore God hath blessed thee for ever.";
rsv[2] = "You are the fairest of the sons of men; grace is poured upon your lips; therefore God has blessed you for ever.";
asv[2] = "Thou art fairer than the children of men; Grace is poured into thy lips: Therefore God hath blessed thee for ever. ";
yng[2] = "Thou hast been beautified above the sons of men, Grace hath been poured into thy lips, Therefore hath God blessed thee to the age.";
dby[2] = "Thou art fairer than the sons of men; grace is poured into thy lips: therefore God hath blessed thee for ever.";
web[2] = "Thou art fairer than the children of men: grace is poured into thy lips: therefore God hath blessed thee for ever.";
hnv[2] = "You are the most excellent of the sons of men. Grace has anointed your lips, Therefore God has blessed you forever.";
vul[2] = "[Vulgate 44:3] decore pulchrior es filiis hominum effusa est gratia in labiis tuis propterea benedixit tibi Deus in aeternum";
kjv[3] = "Gird thy sword upon [thy] thigh, O [most] mighty, with thy glory and thy majesty.";
rsv[3] = "Gird your sword upon your thigh, O mighty one, in your glory and majesty!";
asv[3] = "Gird thy sword upon thy thigh, O mighty one, Thy glory and thy majesty. ";
yng[3] = "Gird Thy sword upon the thigh, O mighty, Thy glory and Thy majesty!";
dby[3] = "Gird thy sword upon [thy] thigh, O mighty one, [in] thy majesty and thy splendour;";
web[3] = "Gird thy sword upon [thy] thigh, O [most] mighty, with thy glory and thy majesty.";
hnv[3] = "Gird your sword on your thigh, mighty one: Your splendor and your majesty.";
vul[3] = "[Vulgate 44:4] accingere gladio tuo super femur fortissime";
kjv[4] = "And in thy majesty ride prosperously because of truth and meekness [and] righteousness; and thy right hand shall teach thee terrible things.";
rsv[4] = "In your majesty ride forth victoriously for the cause of truth and to defend the right; let your right hand teach you dread deeds!";
asv[4] = "And in thy majesty ride on prosperously, Because of truth and meekness [and] righteousness: And thy right hand shall teach thee terrible things. ";
yng[4] = "As to Thy majesty -- prosper! -- ride! Because of truth, and meekness -- righteousness, And Thy right hand showeth Thee fearful things.";
dby[4] = "And [in] thy splendour ride prosperously, because of truth and meekness [and] righteousness: and thy right hand shall teach thee terrible things.";
web[4] = "And in thy majesty ride prosperously because of truth and meekness [and] righteousness; and thy right hand shall teach thee terrible things.";
hnv[4] = "In your majesty ride on victoriously on behalf of truth, humility, and righteousness. Let your right hand display awesome deeds.";
vul[4] = "[Vulgate 44:5] gloria tua et decore tuo decore tuo prospere ascende propter veritatem et mansuetudinem iustitiae et docebit te terribilia dextera tua";
kjv[5] = "Thine arrows [are] sharp in the heart of the king\'s enemies; [whereby] the people fall under thee.";
rsv[5] = "Your arrows are sharp in the heart of the king\'s enemies; the peoples fall under you.";
asv[5] = "Thine arrows are sharp; The peoples fall under thee; [They are] in the heart of the king\'s enemies. ";
yng[5] = "Thine arrows [are] sharp, -- Peoples fall under Thee -- In the heart of the enemies of the king.";
dby[5] = "Thine arrows are sharp -- peoples fall under thee -- in the heart of the king\'s enemies.";
web[5] = "Thy arrows [are] sharp in the heart of the king\'s enemies; [by which] the people fall under thee.";
hnv[5] = "Your arrows are sharp. The nations fall under you, with arrows in the heart of the king\'s enemies.";
vul[5] = "[Vulgate 44:6] sagittae tuae acutae populi sub te cadent in corde inimicorum regis";
kjv[6] = "Thy throne, O God, [is] for ever and ever: the sceptre of thy kingdom [is] a right sceptre.";
rsv[6] = "Your divine throne endures for ever and ever. Your royal scepter is a scepter of equity;";
asv[6] = "Thy throne, O God, is for ever and ever: A sceptre of equity is the sceptre of thy kingdom. ";
yng[6] = "Thy throne, O God, [is] age-during, and for ever, A sceptre of uprightness [Is] the sceptre of Thy kingdom.";
dby[6] = "Thy throne, O God, is for ever and ever; a sceptre of uprightness is the sceptre of thy kingdom:";
web[6] = "Thy throne, O God, [is] for ever and ever: the scepter of thy kingdom [is] a scepter of justice.";
hnv[6] = "Your throne, God, is forever and ever. A scepter of equity is the scepter of your kingdom.";
vul[6] = "[Vulgate 44:7] thronus tuus Deus in saeculum et in aeternum sceptrum aequitatis sceptrum regni tui";
kjv[7] = "Thou lovest righteousness, and hatest wickedness: therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.";
rsv[7] = "you love righteousness and hate wickedness. Therefore God, your God, has anointed you with the oil of gladness above your fellows;";
asv[7] = "Thou hast loved righteousness, and hated wickedness: Therefore God, thy God, hath anointed thee With the oil of gladness above thy fellows. ";
yng[7] = "Thou hast loved righteousness and hatest wickedness, Therefore God, thy God, hath anointed thee, Oil of joy above thy companions.";
dby[7] = "Thou hast loved righteousness, and hated wickedness; therefore God, thy God, hath anointed thee with the oil of gladness above thy companions.";
web[7] = "Thou lovest righteousness, and hatest wickedness: therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.";
hnv[7] = "You have loved righteousness, and hated wickedness. Therefore God, your God, has anointed you with the oil of gladness above your fellows.";
vul[7] = "[Vulgate 44:8] dilexisti iustitiam et odisti iniquitatem propterea unxit te Deus Deus tuus oleo exultationis prae participibus tuis";
kjv[8] = "All thy garments [smell] of myrrh, and aloes, [and] cassia, out of the ivory palaces, whereby they have made thee glad.";
rsv[8] = "your robes are all fragrant with myrrh and aloes and cassia. From ivory palaces stringed instruments make you glad;";
asv[8] = "All thy garments [smell of] myrrh, and aloes, [and] cassia; Out of ivory palaces stringed instruments have made thee glad. ";
yng[8] = "Myrrh and aloes, cassia! all thy garments, Out of palaces of ivory Stringed instruments have made thee glad.";
dby[8] = "Myrrh and aloes, cassia, are all thy garments; out of ivory palaces stringed instruments have made thee glad.";
web[8] = "All thy garments [smell] of myrrh, and aloes, [and] cassia, out of the ivory palaces, by which they have made thee glad.";
hnv[8] = "All your garments smell like myrrh, aloes, and cassia. Out of ivory palaces stringed instruments have made you glad.";
vul[8] = "[Vulgate 44:9] zmyrna et stacte et cassia in cunctis vestimentis tuis de domibus eburneis quibus laetificaverunt te";
kjv[9] = "Kings\' daughters [were] among thy honourable women: upon thy right hand did stand the queen in gold of Ophir.";
rsv[9] = "daughters of kings are among your ladies of honor; at your right hand stands the queen in gold of Ophir.";
asv[9] = "Kings\' daughters are among thy honorable women: At thy right hand doth stand the queen in gold of Ophir. ";
yng[9] = "Daughters of kings [are] among thy precious ones, A queen hath stood at thy right hand, In pure gold of Ophir.";
dby[9] = "Kings\' daughters are among thine honourable women; upon thy right hand doth stand the queen in gold of Ophir.";
web[9] = "Kings daughters [were] among thy honorable women: upon thy right hand stood the queen in gold of Ophir.";
hnv[9] = "Kings\' daughters are among your honorable women. At your right hand the queen stands in gold of Ofir.";
vul[9] = "[Vulgate 44:10] filiae regum in honore tuo stetit coniux in dextera tua in diademate aureo";
kjv[10] = "Hearken, O daughter, and consider, and incline thine ear; forget also thine own people, and thy father\'s house;";
rsv[10] = "Hear, O daughter, consider, and incline your ear; forget your people and your father\'s house;";
asv[10] = "Hearken, O daughter, and consider, and incline thine ear; Forget also thine own people, and thy father\'s house: ";
yng[10] = "Hearken, O daughter, and see, incline thine ear, And forget thy people, and thy father\'s house,";
dby[10] = "Hearken, daughter, and see, and incline thine ear; and forget thine own people and thy father\'s house:";
web[10] = "Hearken, O daughter, and consider, and incline thy ear; forget also thy own people, and thy father\'s house;";
hnv[10] = "Listen, daughter, consider, and turn your ear. Forget your own people, and also your father\'s house.";
vul[10] = "[Vulgate 44:11] audi filia et vide et inclina aurem tuam et obliviscere populi tui et domus patris tui";
kjv[11] = "So shall the king greatly desire thy beauty: for he [is] thy Lord; and worship thou him.";
rsv[11] = "and the king will desire your beauty. Since he is your lord, bow to him;";
asv[11] = "So will the king desire thy beauty; For he is thy lord; and reverence thou him. ";
yng[11] = "And the king doth desire thy beauty, Because he [is] thy lord -- bow thyself to him,";
dby[11] = "And the king will desire thy beauty; for he is thy Lord, and worship thou him.";
web[11] = "So shall the king greatly desire thy beauty: for he [is] thy lord; and worship thou him.";
hnv[11] = "So the king will desire your beauty, Honor him, for he is your lord.";
vul[11] = "[Vulgate 44:12] et concupiscet rex decorem tuum quia ipse est dominus tuus et adora eum";
kjv[12] = "And the daughter of Tyre [shall be there] with a gift; [even] the rich among the people shall intreat thy favour.";
rsv[12] = "the people of Tyre will sue your favor with gifts, the richest of the people";
asv[12] = "And the daughter of Tyre [shall be there] with a gift; The rich among the people shall entreat thy favor. ";
yng[12] = "And the daughter of Tyre with a present, The rich of the people do appease thy face.";
dby[12] = "And the daughter of Tyre with a gift, the rich ones among the people, shall court thy favour.";
web[12] = "And the daughter of Tyre [shall be there] with a gift; [even] the rich among the people shall entreat thy favor.";
hnv[12] = "The daughter of Tzor comes with a gift. The rich among the people entreat your favor.";
vul[12] = "[Vulgate 44:13] et o filia fortissimi in muneribus faciem tuam deprecabuntur divites populi";
kjv[13] = "The king\'s daughter [is] all glorious within: her clothing [is] of wrought gold.";
rsv[13] = "with all kinds of wealth. The princess is decked in her chamber with gold-woven robes;";
asv[13] = "The king\'s daughter within [the palace] is all glorious: Her clothing is inwrought with gold. ";
yng[13] = "All glory [is] the daughter of the king within, Of gold-embroidered work [is] her clothing.";
dby[13] = "All glorious is the king\'s daughter within; her clothing is of wrought gold:";
web[13] = "The king\'s daughter [is] all glorious within: her clothing [is] of wrought gold.";
hnv[13] = "The princess inside is all glorious. Her clothing is interwoven with gold.";
vul[13] = "[Vulgate 44:14] omnis gloria filiae regis intrinsecus fasceis aureis vestita est";
kjv[14] = "She shall be brought unto the king in raiment of needlework: the virgins her companions that follow her shall be brought unto thee.";
rsv[14] = "in many-colored robes she is led to the king, with her virgin companions, her escort, in her train.";
asv[14] = "She shall be led unto the king in broidered work: The virgins her companions that follow her Shall be brought unto thee. ";
yng[14] = "In divers colours she is brought to the king, Virgins -- after her -- her companions, Are brought to thee.";
dby[14] = "She shall be brought unto the king in raiment of embroidery; the virgins behind her, her companions, shall be brought in unto thee:";
web[14] = "She shall be brought to the king in raiment of needle-work: the virgins her companions that follow her shall be brought to thee.";
hnv[14] = "She shall be led to the king in embroidered work. The virgins, her companions who follow her, shall be brought to you.";
vul[14] = "[Vulgate 44:15] in scutulatis ducetur ad regem virgines sequentur eam amicae eius ducentur illuc";
kjv[15] = "With gladness and rejoicing shall they be brought: they shall enter into the king\'s palace.";
rsv[15] = "With joy and gladness they are led along as they enter the palace of the king.";
asv[15] = "With gladness and rejoicing shall they be led: They shall enter into the king\'s palace. ";
yng[15] = "They are brought with joy and gladness, They come into the palace of the king.";
dby[15] = "With joy and gladness shall they be brought; they shall enter into the king\'s palace.";
web[15] = "With gladness and rejoicing shall they be brought: they shall enter into the king\'s palace.";
hnv[15] = "With gladness and rejoicing they shall be led. They shall enter into the king\'s palace.";
vul[15] = "[Vulgate 44:16] ducentur in laetitiis et exultatione ingredientur thalamum regis";
kjv[16] = "Instead of thy fathers shall be thy children, whom thou mayest make princes in all the earth.";
rsv[16] = "Instead of your fathers shall be your sons; you will make them princes in all the earth.";
asv[16] = "Instead of thy fathers shall be thy children, Whom thou shalt make princes in all the earth. ";
yng[16] = "Instead of thy fathers are thy sons, Thou dost appoint them for princes in all the earth.";
dby[16] = "Instead of thy fathers shall be thy sons; princes shalt thou make them in all the earth.";
web[16] = "Instead of thy fathers shall be thy children, whom thou mayest make princes in all the earth.";
hnv[16] = "Your sons will take the place of your fathers. You shall make them princes in all the eretz.";
vul[16] = "[Vulgate 44:17] pro patribus tuis erunt filii tibi pones eos principes in universa terra";
kjv[17] = "I will make thy name to be remembered in all generations: therefore shall the people praise thee for ever and ever.";
rsv[17] = "I will cause your name to be celebrated in all generations; therefore the peoples will praise you for ever and ever.";
asv[17] = "I will make thy name to be remembered in all generations: Therefore shall the peoples give thee thanks for ever and ever. ";
yng[17] = "I make mention of Thy name in all generations, Therefore do peoples praise Thee, To the age, and for ever!";
dby[17] = "I will make thy name to be remembered throughout all generations; therefore shall the peoples praise thee for ever and ever.";
web[17] = "I will make thy name to be remembered in all generations: therefore shall the people praise thee for ever and ever.";
hnv[17] = "I will make your name to be remembered in all generations. Therefore the peoples shall give you thanks forever and ever. ";
vul[17] = "[Vulgate 44:18] recordabor nominis tui in omni generatione et generatione propterea populi confitebuntur tibi in saeculum et in aeternum";
csb[1] = "My heart is moved by a noble theme as I recite my verses to the king; my tongue is the pen of a skillful writer.";
csb[2] = "You are the most handsome of men; grace flows from your lips. Therefore God has blessed you forever.";
csb[3] = "Mighty warrior, strap your sword at your side. In your majesty and splendor --";
csb[4] = "in your splendor ride triumphantly in the cause of truth, humility, and justice. May your right hand show your awe-inspiring acts.";
csb[5] = "Your sharpened arrows pierce the hearts of the king\'s enemies; the peoples fall under you.";
csb[6] = "Your throne, God, is forever and ever; the scepter of your kingdom is a scepter of justice.";
csb[7] = "You love righteousness and hate wickedness; therefore God, your God, has anointed you with the oil of joy more than your companions.";
csb[8] = "Myrrh, aloes, and cassia perfume all your garments; from ivory palaces harps bring you joy.";
csb[9] = "Kings\' daughters are among your honored women; the queen, adorned with gold from Ophir, stands at your right hand.";
csb[10] = "Listen, daughter, pay attention and consider: forget your people and your father\'s house,";
csb[11] = "and the king will desire your beauty. Bow down to him, for he is your lord.";
csb[12] = "The daughter of Tyre, the wealthy people, will seek your favor with gifts.";
csb[13] = "In her chamber, the royal daughter is all glorious, her clothing embroidered with gold.";
csb[14] = "In colorful garments she is led to the king; after her, the virgins, her companions, are brought to you.";
csb[15] = "They are led in with gladness and rejoicing; they enter the king\'s palace.";
csb[16] = "Your sons will succeed your ancestors; you will make them princes throughout the land.";
csb[17] = "I will cause your name to be remembered for all generations; therefore the peoples will praise you forever and ever.";
</script>
