yng[33] = "He maketh rivers become a wilderness, And fountains of waters become dry land.";
dby[33] = "He maketh rivers into a wilderness, and water-springs into dry ground;";
web[33] = "He turneth rivers into a wilderness, and the water-springs into dry ground;";
hnv[33] = "He turns rivers into a desert, Water springs into a thirsty ground,";
vul[33] = "[Vulgate 106:33] ponet flumina in desertum et fontes aquarum in sitim";
kjv[34] = "A fruitful land into barrenness, for the wickedness of them that dwell therein.";
rsv[34] = "a fruitful land into a salty waste, because of the wickedness of its inhabitants.";
asv[34] = "A fruitful land into a salt desert, For the wickedness of them that dwell therein. ";
yng[34] = "A fruitful land becometh a barren place, For the wickedness of its inhabitants.";
dby[34] = "A fruitful land into a plain of salt, for the wickedness of them that dwell therein.";
web[34] = "A fruitful land into barrenness, for the wickedness of them that dwell in it.";
hnv[34] = "And a fruitful land into a salt waste, For the wickedness of those who dwell in it.";
vul[34] = "[Vulgate 106:34] terram fructiferam in salsuginem prae malitia habitatorum eius";
kjv[35] = "He turneth the wilderness into a standing water, and dry ground into watersprings.";
rsv[35] = "He turns a desert into pools of water, a parched land into springs of water.";
asv[35] = "He turneth a wilderness into a pool of water, And a dry land into watersprings. ";
yng[35] = "He maketh a wilderness become a pool of water, And a dry land become fountains of waters.";
dby[35] = "He maketh the wilderness into a pool of water, and the dry land into water-springs;";
web[35] = "He turneth the wilderness into a standing water, and dry ground into water-springs.";
hnv[35] = "He turns a desert into a pool of water, And a dry land into water springs.";
vul[35] = "[Vulgate 106:35] ponet desertum in paludes aquarum et terram inviam in fontes aquarum";
kjv[36] = "And there he maketh the hungry to dwell, that they may prepare a city for habitation;";
rsv[36] = "And there he lets the hungry dwell, and they establish a city to live in;";
asv[36] = "And there he maketh the hungry to dwell, That they may prepare a city of habitation, ";
yng[36] = "And He causeth the hungry to dwell there, And they prepare a city of habitation.";
dby[36] = "And there he maketh the hungry to dwell, and they establish a city of habitation;";
web[36] = "And there he maketh the hungry to dwell, that they may prepare a city for habitation;";
hnv[36] = "There he makes the hungry live, That they may prepare a city to live in,";
vul[36] = "[Vulgate 106:36] et conlocabit ibi esurientes et fundabunt urbem ad habitandum";
kjv[37] = "And sow the fields, and plant vineyards, which may yield fruits of increase.";
rsv[37] = "they sow fields, and plant vineyards, and get a fruitful yield.";
asv[37] = "And sow fields, and plant vineyards, And get them fruits of increase. ";
yng[37] = "And they sow fields, and plant vineyards, And they make fruits of increase.";
dby[37] = "And sow fields, and plant vineyards, which yield fruits of increase;";
web[37] = "And sow the fields, and plant vineyards, which may yield fruits of increase.";
hnv[37] = "Sow fields, plant vineyards, And reap the fruits of increase.";
vul[37] = "[Vulgate 106:37] et serent agros et plantabunt vineas et facient fruges genimina";
kjv[38] = "He blesseth them also, so that they are multiplied greatly; and suffereth not their cattle to decrease.";
rsv[38] = "By his blessing they multiply greatly; and he does not let their cattle decrease.";
asv[38] = "He blesseth them also, so that they are multiplied greatly; And he suffereth not their cattle to decrease. ";
yng[38] = "And He blesseth them, and they multiply exceedingly, And their cattle He doth not diminish.";
dby[38] = "And he blesseth them, so that they are multiplied greatly; and he suffereth not their cattle to decrease.";
web[38] = "He blesseth them also, so that they are multiplied greatly; and suffereth not their cattle to decrease.";
hnv[38] = "He blesses them also, so that they are multiplied greatly. He doesn\'t allow their cattle to decrease.";
vul[38] = "[Vulgate 106:38] et benedicet eis et multiplicabuntur nimis et pecora eorum non inminuet";
kjv[39] = "Again, they are minished and brought low through oppression, affliction, and sorrow.";
rsv[39] = "When they are diminished and brought low through oppression, trouble, and sorrow,";
asv[39] = "Again, they are diminished and bowed down Through oppression, trouble, and sorrow. ";
yng[39] = "And they are diminished, and bow down, By restraint, evil, and sorrow.";
dby[39] = "And they are diminished and brought low, through oppression, adversity, and sorrow:";
web[39] = "Again, they are diminished and brought low through oppression, affliction, and sorrow.";
hnv[39] = "Again, they are diminished and bowed down Through oppression, trouble, and sorrow.";
vul[39] = "[Vulgate 106:39] inminuta sunt autem et adflicta propter angustiam mali et doloris";
kjv[40] = "He poureth contempt upon princes, and causeth them to wander in the wilderness, [where there is] no way.";
rsv[40] = "he pours contempt upon princes and makes them wander in trackless wastes;";
asv[40] = "He poureth contempt upon princes, And causeth them to wander in the waste, where there is no way. ";
yng[40] = "He is pouring contempt upon nobles, And causeth them to wander in vacancy -- no way.";
dby[40] = "He poureth contempt upon nobles, and causeth them to wander in a pathless waste;";
web[40] = "He poureth contempt upon princes, and causeth them to wander in the wilderness, [where there is] no way.";
hnv[40] = "He pours contempt on princes, And causes them to wander in a trackless waste.";
vul[40] = "[Vulgate 106:40] et effundet despectionem super principes et errare eos faciet in solitudine devia";
kjv[41] = "Yet setteth he the poor on high from affliction, and maketh [him] families like a flock.";
rsv[41] = "but he raises up the needy out of affliction, and makes their families like flocks.";
asv[41] = "Yet setteth he the needy on high from affliction, And maketh [him] families like a flock. ";
yng[41] = "And setteth on high the needy from affliction, And placeth families as a flock.";
dby[41] = "But he secureth the needy one on high from affliction, and maketh [him] families like flocks.";
web[41] = "Yet he setteth the poor on high from affliction, and maketh him families like a flock.";
hnv[41] = "Yet he lifts the needy out of their affliction, And increases their families like a flock.";
vul[41] = "[Vulgate 106:41] et sublevabit pauperem de inopia et ponet quasi gregem familias";
kjv[42] = "The righteous shall see [it], and rejoice: and all iniquity shall stop her mouth.";
rsv[42] = "The upright see it and are glad; and all wickedness stops its mouth.";
asv[42] = "The upright shall see it, and be glad; And all iniquity shall stop her mouth. ";
yng[42] = "The upright do see and rejoice, And all perversity hath shut her mouth.";
dby[42] = "The upright shall see it, and rejoice; and all unrighteousness shall stop its mouth.";
web[42] = "The righteous shall see [it], and rejoice: and all iniquity shall stop her mouth.";
hnv[42] = "The upright will see it, and be glad. All the wicked will shut their mouths.";
vul[42] = "[Vulgate 106:42] videbunt recti et laetabuntur et omnis iniquitas contrahet os suum";
kjv[43] = "Whoso [is] wise, and will observe these [things], even they shall understand the lovingkindness of the LORD.";
rsv[43] = "Whoever is wise, let him give heed to these things; let men consider the steadfast love of the LORD.";
asv[43] = "Whoso is wise will give heed to these things; And they will consider the lovingkindnesses of Jehovah. ";
yng[43] = "Who [is] wise, and observeth these? They understand the kind acts of Jehovah!";
dby[43] = "Whoso is wise, let him observe these things, and let them understand the loving-kindnesses of Jehovah.";
web[43] = "Whoever [is] wise, and will observe these [things], even they shall understand the loving-kindness of the LORD.";
hnv[43] = "Whoever is wise will pay attention to these things. They will consider the lovingkindnesses of the LORD. ";
vul[43] = "[Vulgate 106:43] quis sapiens et custodiet haec et intellegent misericordias Domini";
csb[1] = "Give thanks to the LORD, for he is good; his faithful love endures forever.";
csb[2] = "Let the redeemed of the LORD proclaim that he has redeemed them from the power of the foe";
csb[3] = "and has gathered them from the lands -- from the east and the west, from the north and the south.";
csb[4] = "Some wandered in the desolate wilderness, finding no way to a city where they could live.";
csb[5] = "They were hungry and thirsty; their spirits failed within them.";
csb[6] = "Then they cried out to the LORD in their trouble; he rescued them from their distress.";
csb[7] = "He led them by the right path to go to a city where they could live.";
csb[8] = "Let them give thanks to the LORD for his faithful love and his wondrous works for all humanity.";
csb[9] = "For he has satisfied the thirsty and filled the hungry with good things.";
csb[10] = "Others sat in darkness and gloom -- prisoners in cruel chains --";
csb[11] = "because they rebelled against God\'s commands and despised the counsel of the Most High.";
csb[12] = "He broke their spirits with hard labor; they stumbled, and there was no one to help.";
csb[13] = "Then they cried out to the LORD in their trouble; he saved them from their distress.";
csb[14] = "He brought them out of darkness and gloom and broke their chains apart.";
csb[15] = "Let them give thanks to the LORD for his faithful love and his wondrous works for all humanity.";
csb[16] = "For he has broken down the bronze gates and cut through the iron bars.";
csb[17] = "Fools suffered affliction because of their rebellious ways and their iniquities.";
csb[18] = "They loathed all food and came near the gates of death.";
csb[19] = "Then they cried out to the LORD in their trouble; he saved them from their distress.";
csb[20] = "He sent his word and healed them; he rescued them from the Pit.";
csb[21] = "Let them give thanks to the LORD for his faithful love and his wondrous works for all humanity.";
csb[22] = "Let them offer sacrifices of thanksgiving and announce his works with shouts of joy.";
csb[23] = "Others went to sea in ships, conducting trade on the vast water.";
csb[24] = "They saw the LORD\'s works, his wondrous works in the deep.";
csb[25] = "He spoke and raised a stormy wind that stirred up the waves of the sea.";
csb[26] = "Rising up to the sky, sinking down to the depths, their courage melting away in anguish,";
csb[27] = "they reeled and staggered like a drunkard, and all their skill was useless.";
csb[28] = "Then they cried out to the LORD in their trouble, and he brought them out of their distress.";
csb[29] = "He stilled the storm to a whisper, and the waves of the sea were hushed.";
csb[30] = "They rejoiced when the waves grew quiet. Then he guided them to the harbor they longed for.";
csb[31] = "Let them give thanks to the LORD for his faithful love and his wondrous works for all humanity.";
csb[32] = "Let them exalt him in the assembly of the people and praise him in the council of the elders.";
csb[33] = "He turns rivers into desert, springs into thirsty ground,";
csb[34] = "and fruitful land into salty wasteland, because of the wickedness of its inhabitants.";
csb[35] = "He turns a desert into a pool, dry land into springs.";
csb[36] = "He causes the hungry to settle there, and they establish a city where they can live.";
csb[37] = "They sow fields and plant vineyards that yield a fruitful harvest.";
csb[38] = "He blesses them, and they multiply greatly; he does not let their livestock decrease.";
csb[39] = "When they are diminished and are humbled by cruel oppression and sorrow,";
csb[40] = "he pours contempt on nobles and makes them wander in a trackless wasteland.";
csb[41] = "But he lifts the needy out of their suffering and makes their families multiply like flocks.";
csb[42] = "The upright see it and rejoice, and all injustice shuts its mouth.";
csb[43] = "Let whoever is wise pay attention to these things and consider the LORD\'s acts of faithful love.";
</script>
