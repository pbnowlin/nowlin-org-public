yng[30] = "Rebuke a beast of the reeds, a company of bulls, With calves of the peoples, Each humbling himself with pieces of silver, Scatter Thou peoples delighting in conflicts.";

kjv[35] = "O God, [thou art] terrible out of thy holy places: the God of Israel [is] he that giveth strength and power unto [his] people. Blessed [be] God.";
rsv[35] = "Terrible is God in his sanctuary, the God of Israel, he gives power and strength to his people. Blessed be God!";
asv[35] = "O God, [thou art] terrible out of thy holy places: The God of Israel, he giveth strength and power unto [his] people. Blessed be God. ";
yng[35] = "Fearful, O God, out of Thy sanctuaries, The God of Israel Himself, Giving strength and might to the people. Blessed [is] God!";
dby[35] = "Terrible art thou, O God, out of thy sanctuaries, -- the God of Israel! He it is that giveth strength and might unto the people. Blessed be God!";
web[35] = "O God, [thou art] terrible out of thy holy places: the God of Israel [is] he that giveth strength and power to [his] people. Blessed [be] God.";
hnv[35] = "You are awesome, God, in your sanctuaries. The God of Yisra\'el gives strength and power to his people. Praise be to God! ";

csb[1] = "God arises. His enemies scatter, and those who hate him flee from his presence.";
csb[2] = "As smoke is blown away, so you blow them away. As wax melts before the fire, so the wicked are destroyed before God.";
csb[3] = "But the righteous are glad; they rejoice before God and celebrate with joy.";
csb[4] = "Sing to God! Sing praises to his name. Exalt him who rides on the clouds -- his name is the LORD  -- and celebrate before him.";
csb[5] = "God in his holy dwelling is a father of the fatherless and a champion of widows.";
csb[6] = "God provides homes for those who are deserted. He leads out the prisoners to prosperity, but the rebellious live in a scorched land.";
csb[7] = "God, when you went out before your people, when you marched through the desert, Selah";
csb[8] = "the earth trembled and the skies poured rain before God, the God of Sinai, before God, the God of Israel.";
csb[9] = "You, God, showered abundant rain; you revived your inheritance when it languished.";
csb[10] = "Your people settled in it; God, you provided for the poor by your goodness.";
csb[11] = "The Lord gave the command; a great company of women brought the good news:";
csb[12] = "&quot;The kings of the armies flee -- they flee! &quot; She who stays at home divides the spoil.";
csb[13] = "While you lie among the sheep pens, the wings of a dove are covered with silver, and its feathers with glistening gold.";
csb[14] = "When the Almighty scattered kings in the land, it snowed on Zalmon.";
csb[15] = "Mount Bashan is God\'s towering mountain; Mount Bashan is a mountain of many peaks.";
csb[16] = "Why gaze with envy, you mountain peaks, at the mountain God desired for his abode? The LORD will dwell there forever!";
csb[17] = "God\'s chariots are tens of thousands, thousands and thousands; the Lord is among them in the sanctuary as he was at Sinai.";
csb[18] = "You ascended to the heights, taking away captives; you received gifts from people, even from the rebellious, so that the LORD God might dwell there.";
csb[19] = "Blessed be the Lord! Day after day he bears our burdens; God is our salvation. Selah";
csb[20] = "Our God is a God of salvation, and escape from death belongs to the LORD my Lord.";
csb[21] = "Surely God crushes the heads of his enemies, the hairy brow of one who goes on in his guilty acts.";
csb[22] = "The Lord said, &quot;I will bring them back from Bashan; I will bring them back from the depths of the sea";
csb[23] = "&quot;so that your foot may wade in blood and your dogs\' tongues may have their share from the enemies.&quot;";
csb[24] = "People have seen your procession, God, the procession of my God, my King, in the sanctuary.";
csb[25] = "Singers lead the way, with musicians following; among them are young women playing tambourines.";
csb[26] = "Bless God in the assemblies; bless the LORD from the fountain of Israel.";
csb[27] = "There is Benjamin, the youngest, leading them, the rulers of Judah in their assembly, the rulers of Zebulun, the rulers of Naphtali.";
csb[28] = "Your God has decreed your strength. Show your strength, God, you who have acted on our behalf.";
csb[29] = "Because of your temple at Jerusalem, kings will bring tribute to you.";
csb[30] = "Rebuke the beast in the reeds, the herd of bulls with the calves of the peoples. Trample underfoot those with bars of silver. Scatter the peoples who take pleasure in war.";
csb[31] = "Ambassadors will come from Egypt; Cush will stretch out its hands to God.";
csb[32] = "Sing to God, you kingdoms of the earth; sing praise to the Lord, Selah";
csb[33] = "to him who rides in the ancient, highest heavens. Look, he thunders with his powerful voice!";
csb[34] = "Ascribe power to God. His majesty is over Israel, his power is among the clouds.";
csb[35] = "God, you are awe-inspiring in your sanctuaries. The God of Israel gives power and strength to his people. Blessed be God!";
