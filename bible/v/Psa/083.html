csb[1] = "God, do not keep silent. Do not be deaf, God; do not be quiet.";

csb[9] = "Deal with them as you did with Midian, as you did with Sisera and Jabin at the Kishon River.";
csb[10] = "They were destroyed at En-dor; they became manure for the ground.";
csb[11] = "Make their nobles like Oreb and Zeeb, and all their tribal leaders like Zebah and Zalmunna,";
csb[12] = "who said, &quot;Let us seize God\'s pastures for ourselves.&quot;";

csb[14] = "As fire burns a forest, as a flame blazes through mountains,";
csb[15] = "so pursue them with your tempest and terrify them with your storm.";
csb[16] = "Cover their faces with shame so that they will seek your name, LORD.";
csb[17] = "Let them be put to shame and terrified forever; let them perish in disgrace.";
csb[18] = "May they know that you alone -- whose name is the LORD -- are the Most High over the whole earth.";
