kjv[1] = "[[To the chief Musician, A Psalm of David.]] I waited patiently for the LORD; and he inclined unto me, and heard my cry.";
rsv[1] = "To the choirmaster. A Psalm of David. I waited patiently for the LORD; he inclined to me and heard my cry.";
asv[1] = "[For the Chief Musician. A Psalm of David.] I waited patiently for Jehovah; And he inclined unto me, and heard my cry. ";
yng[1] = "To the Overseer. -- A Psalm of David. I have diligently expected Jehovah, And He inclineth to me, and heareth my cry,";
dby[1] = "{To the chief Musician. Of David. A Psalm.} I waited patiently for Jehovah; and he inclined unto me, and heard my cry.";
web[1] = "To the chief Musician, A Psalm of David. I waited patiently for the LORD; and he inclined to me, and heard my cry.";
hnv[1] = "For the Chief Musician. A Psalm by David. I waited patiently for the LORD. He turned to me, and heard my cry.";
vul[1] = "[Vulgate 39:1] pro victoria David canticum [Vulgate 39:2] expectans expectavi Dominum et inclinatus est ad me";
kjv[2] = "He brought me up also out of an horrible pit, out of the miry clay, and set my feet upon a rock, [and] established my goings.";
rsv[2] = "He drew me up from the desolate pit, out of the miry bog, and set my feet upon a rock, making my steps secure.";
asv[2] = "He brought me up also out of a horrible pit, out of the miry clay; And he set my feet upon a rock, and established my goings. ";
yng[2] = "And He doth cause me to come up From a pit of desolation -- from mire of mud, And He raiseth up on a rock my feet, He is establishing my steps.";
dby[2] = "And he brought me up out of the pit of destruction, out of the miry clay, and set my feet upon a rock; he hath established my goings:";
web[2] = "He brought me up also out of a horrible pit, out of the miry clay, and set my feet upon a rock, [and] established my goings.";
hnv[2] = "He brought me up also out of a horrible pit, Out of the miry clay. He set my feet on a rock, And gave me a firm place to stand.";
vul[2] = "[Vulgate 39:3] et audivit clamorem meum et eduxit me de lacu famoso de luto caeni et statuit super petram pedes meos stabilivit gressus meos";
kjv[3] = "And he hath put a new song in my mouth, [even] praise unto our God: many shall see [it], and fear, and shall trust in the LORD.";
rsv[3] = "He put a new song in my mouth, a song of praise to our God. Many will see and fear, and put their trust in the LORD.";
asv[3] = "And he hath put a new song in my mouth, even praise unto our God: Many shall see it, and fear, And shall trust in Jehovah. ";
yng[3] = "And He putteth in my mouth a new song, `Praise to our God.\' Many do see and fear, and trust in Jehovah.";
dby[3] = "And he hath put a new song in my mouth, praise unto our God. Many shall see it, and fear, and shall confide in Jehovah.";
web[3] = "And he hath put a new song in my mouth, [even] praise to our God: many shall see [it], and fear, and shall trust in the LORD.";
hnv[3] = "He has put a new song in my mouth, even praise to our God. Many shall see it, and fear, and shall trust in the LORD.";
vul[3] = "[Vulgate 39:4] et dedit in ore meo canticum novum laudem Deo nostro videbunt multi et timebunt et sperabunt in Domino";
kjv[4] = "Blessed [is] that man that maketh the LORD his trust, and respecteth not the proud, nor such as turn aside to lies.";
rsv[4] = "Blessed is the man who makes the LORD his trust, who does not turn to the proud, to those who go astray after false gods!";
asv[4] = "Blessed is the man that maketh Jehovah his trust, And respecteth not the proud, nor such as turn aside to lies. ";
yng[4] = "O the happiness of the man Who hath made Jehovah his trust, And hath not turned unto the proud, And those turning aside to lies.";
dby[4] = "Blessed is the man that hath made Jehovah his confidence, and turneth not to the proud, and to such as turn aside to lies.";
web[4] = "Blessed [is] that man that maketh the LORD his trust, and respecteth not the proud, nor such as turn aside to lies.";
hnv[4] = "Blessed is the man who makes the LORD his trust, And doesn\'t respect the proud, nor such as turn aside to lies.";
vul[4] = "[Vulgate 39:5] beatus vir qui posuit Dominum confidentiam suam et non est aversus ad superbias pompasque mendacii";
kjv[5] = "Many, O LORD my God, [are] thy wonderful works [which] thou hast done, and thy thoughts [which are] to us-ward: they cannot be reckoned up in order unto thee: [if] I would declare and speak [of them], they are more than can be numbered.";
rsv[5] = "Thou hast multiplied, O LORD my God, thy wondrous deeds and thy thoughts toward us; none can compare with thee! Were I to proclaim and tell of them, they would be more than can be numbered.";
asv[5] = "Many, O Jehovah my God, are the wonderful works which thou hast done, And thy thoughts which are to us-ward: They cannot be set in order unto thee; If I would declare and speak of them, They are more than can be numbered. ";
yng[5] = "Much hast Thou done, Jehovah my God; Thy wonders and Thy thoughts toward us, There is none to arrange unto Thee, I declare and speak: They have been more than to be numbered.";
dby[5] = "Thou, O Jehovah my God, hast multiplied thy marvellous works, and thy thoughts toward us: they cannot be reckoned up in order unto thee; would I declare and speak [them], they are more than can be numbered.";
web[5] = "Many, O LORD, my God, [are] thy wonderful works [which] thou hast done, and thy thoughts [which are] toward us, they cannot be reckoned up in order to thee: [if] I would declare and speak [of them], they are more than can be numbered.";
hnv[5] = "Many, LORD, my God, are the wonderful works which you have done, And your thoughts which are toward us. They can\'t be set in order to you; If I would declare and speak of them, they are more than can be numbered.";
vul[5] = "[Vulgate 39:6] multa fecisti tu Domine Deus meus mirabilia tua et cogitationes tuas pro nobis non invenio ordinem coram te si narrare voluero et numerare plura sunt quam ut narrari queant";
kjv[6] = "Sacrifice and offering thou didst not desire; mine ears hast thou opened: burnt offering and sin offering hast thou not required.";
rsv[6] = "Sacrifice and offering thou dost not desire; but thou hast given me an open ear. Burnt offering and sin offering thou hast not required.";
asv[6] = "Sacrifice and offering thou hast no delight in; Mine ears hast thou opened: Burnt-offering and sin-offering hast thou not required. ";
yng[6] = "Sacrifice and present Thou hast not desired, Ears Thou hast prepared for me, Burnt and sin-offering Thou hast not asked.";
dby[6] = "Sacrifice and oblation thou didst not desire: ears hast thou prepared me. Burnt-offering and sin-offering hast thou not demanded;";
web[6] = "Sacrifice and offering thou didst not desire; my ears hast thou opened: burnt-offering and sin-offering hast thou not required.";
hnv[6] = "Sacrifice and offering you didn\'t desire. You have opened my ears: Burnt offering and sin offering you have not required.";
vul[6] = "[Vulgate 39:7] victima et oblatione non indiges aures fodisti mihi holocaustum et pro peccato non petisti";
kjv[7] = "Then said I, Lo, I come: in the volume of the book [it is] written of me,";
rsv[7] = "Then I said, &quot;Lo, I come; in the roll of the book it is written of me;";
asv[7] = "Then said I, Lo, I am come; In the roll of the book it is written of me: ";
yng[7] = "Then said I, `Lo, I have come,\' In the roll of the book it is written of me,";
dby[7] = "Then said I, Behold, I come, in the volume of the book it is written of me --";
web[7] = "Then said I, Lo, I come: in the volume of the book [it is] written of me,";
hnv[7] = "Then I said, &quot;Behold, I have come. It is written about me in the book in the scroll.";
vul[7] = "[Vulgate 39:8] tunc dixi ecce venio in volumine libri scriptum est de me";
kjv[8] = "I delight to do thy will, O my God: yea, thy law [is] within my heart.";
rsv[8] = "I delight to do thy will, O my God; thy law is within my heart.&quot;";
asv[8] = "I delight to do thy will, O my God; Yea, thy law is within my heart. ";
yng[8] = "To do Thy pleasure, my God, I have delighted, And Thy law [is] within my heart.";
dby[8] = "To do thy good pleasure, my God, is my delight, and thy law is within my heart.";
web[8] = "I delight to do thy will, O my God: yea, thy law [is] within my heart.";
hnv[8] = "I delight to do your will, my God. Yes, your law is within my heart.&quot;";
vul[8] = "[Vulgate 39:9] ut facerem placitum tibi Deus meus volui et legem tuam in medio ventris mei";
kjv[9] = "I have preached righteousness in the great congregation: lo, I have not refrained my lips, O LORD, thou knowest.";
rsv[9] = "I have told the glad news of deliverance in the great congregation; lo, I have not restrained my lips, as thou knowest, O LORD.";
asv[9] = "I have proclaimed glad tidings of righteousness in the great assembly; Lo, I will not refrain my lips, O Jehovah, thou knowest. ";
yng[9] = "I have proclaimed tidings of righteousness In the great assembly, lo, my lips I restrain not, O Jehovah, Thou hast known.";
dby[9] = "I have published righteousness in the great congregation: behold, I have not withheld my lips, Jehovah, *thou* knowest.";
web[9] = "I have preached righteousness in the great congregation: lo, I have not refrained my lips, O LORD, thou knowest.";
hnv[9] = "I have proclaimed glad news of righteousness in the great assembly. Behold, I will not seal my lips, LORD, you know.";
vul[9] = "[Vulgate 39:10] adnuntiavi iustum in ecclesia multa ecce labia mea non prohibebo Domine tu nosti";
kjv[10] = "I have not hid thy righteousness within my heart; I have declared thy faithfulness and thy salvation: I have not concealed thy lovingkindness and thy truth from the great congregation.";
rsv[10] = "I have not hid thy saving help within my heart, I have spoken of thy faithfulness and thy salvation; I have not concealed thy steadfast love and thy faithfulness from the great congregation.";
asv[10] = "I have not hid thy righteousness within my heart; I have declared thy faithfulness and thy salvation; I have not concealed thy lovingkindness and thy truth from the great assembly. ";
yng[10] = "Thy righteousness I have not concealed In the midst of my heart, Thy faithfulness and Thy salvation I have told, I have not hidden Thy kindness and Thy truth, To the great assembly.";
dby[10] = "I have not hidden thy righteousness within my heart; I have declared thy faithfulness and thy salvation: I have not concealed thy loving-kindness and thy truth from the great congregation.";
web[10] = "I have not hid thy righteousness within my heart; I have declared thy faithfulness and thy salvation: I have not concealed thy loving-kindness and thy truth from the great congregation.";
hnv[10] = "I have not hidden your righteousness within my heart. I have declared your faithfulness and your salvation. I have not concealed your lovingkindness and your truth from the great assembly.";
vul[10] = "[Vulgate 39:11] iustitiam tuam non abscondi in medio cordis mei fidem tuam et salutare tuum dixi non abscondi misericordiam tuam et veritatem tuam in ecclesia multa";
kjv[11] = "Withhold not thou thy tender mercies from me, O LORD: let thy lovingkindness and thy truth continually preserve me.";
rsv[11] = "Do not thou, O LORD, withhold thy mercy from me, let thy steadfast love and thy faithfulness ever preserve me!";
asv[11] = "Withhold not thou thy tender mercies from me, O Jehovah; Let thy lovingkindness and thy truth continually preserve me. ";
yng[11] = "Thou, O Jehovah, restrainest not Thy mercies from me, Thy kindness and Thy truth do continually keep me.";
dby[11] = "Withhold not thou, Jehovah, thy tender mercies from me; let thy loving-kindness and thy truth continually preserve me.";
web[11] = "Withhold not thou thy tender mercies from me, O LORD: let thy loving-kindness and thy truth continually preserve me.";
hnv[11] = "Don\'t withhold your tender mercies from me, LORD. Let your lovingkindness and your truth continually preserve me.";
vul[11] = "[Vulgate 39:12] tu Domine non prohibebis misericordias tuas a me misericordia tua et veritas iugiter servabunt me";
kjv[12] = "For innumerable evils have compassed me about: mine iniquities have taken hold upon me, so that I am not able to look up; they are more than the hairs of mine head: therefore my heart faileth me.";
rsv[12] = "For evils have encompassed me without number; my iniquities have overtaken me, till I cannot see; they are more than the hairs of my head; my heart fails me.";
asv[12] = "For innumerable evils have compassed me about; Mine iniquities have overtaken me, so that I am not able to look up; They are more than the hairs of my head; And my heart hath failed me. ";
yng[12] = "For compassed me have evils innumerable, Overtaken me have mine iniquities, And I have not been able to see; They have been more than the hairs of my head, And my heart hath forsaken me.";
dby[12] = "For innumerable evils have compassed me about: mine iniquities have taken hold upon me, so that I cannot see; they are more than the hairs of my head: and my heart hath failed me.";
web[12] = "For innumerable evils have encompassed me: my iniquities have taken hold upon me, so that I am not able to look up; they are more than the hairs of my head: therefore my heart faileth me.";
hnv[12] = "For innumerable evils have surrounded me. My iniquities have overtaken me, so that I am not able to look up. They are more than the hairs of my head. My heart has failed me.";
vul[12] = "[Vulgate 39:13] circumdederunt enim me mala quorum non est numerus conprehenderunt me iniquitates meae et non potui videre plures factae sunt quam capilli capitis mei et cor meum dereliquit me";
kjv[13] = "Be pleased, O LORD, to deliver me: O LORD, make haste to help me.";
rsv[13] = "Be pleased, O LORD, to deliver me! O LORD, make haste to help me!";
asv[13] = "Be pleased, O Jehovah, to deliver me: Make haste to help me, O Jehovah. ";
yng[13] = "Be pleased, O Jehovah, to deliver me, O Jehovah, for my help make haste.";
dby[13] = "Be pleased, O Jehovah, to deliver me; Jehovah, make haste to my help.";
web[13] = "Be pleased, O LORD, to deliver me: O LORD, make haste to help me.";
hnv[13] = "Be pleased, LORD, to deliver me. Hurry to help me, LORD.";
vul[13] = "[Vulgate 39:14] placeat tibi Domine ut liberes me Domine ad adiuvandum me festina";
kjv[14] = "Let them be ashamed and confounded together that seek after my soul to destroy it; let them be driven backward and put to shame that wish me evil.";
rsv[14] = "Let them be put to shame and confusion altogether who seek to snatch away my life; let them be turned back and brought to dishonor who desire my hurt!";
asv[14] = "Let them be put to shame and confounded together That seek after my soul to destroy it: Let them be turned backward and brought to dishonor That delight in my hurt. ";
yng[14] = "They are ashamed and confounded together, Who are seeking my soul to destroy it, They are turned backward, And are ashamed, who are desiring my evil.";
dby[14] = "Let them be ashamed and brought to confusion together that seek after my soul to destroy it; let them be turned backward and confounded that take pleasure in mine adversity;";
web[14] = "Let them be ashamed and confounded together that seek after my soul to destroy it; let them be driven backward and put to shame that wish me evil.";
hnv[14] = "Let them be disappointed and confounded together who seek after my soul to destroy it. Let them be turned backward and brought to dishonor who delight in my hurt.";
vul[14] = "[Vulgate 39:15] confundantur et revereantur simul quaerentes animam meam ut auferant eam convertantur retrorsum et confundantur qui volunt mala mihi";
kjv[15] = "Let them be desolate for a reward of their shame that say unto me, Aha, aha.";
rsv[15] = "Let them be appalled because of their shame who say to me, &quot;Aha, Aha!&quot;";
asv[15] = "Let them be desolate by reason of their shame That say unto me, Aha, aha. ";
yng[15] = "They are desolate because of their shame, Who are saying to me, `Aha, aha.\'";
dby[15] = "Let them be desolate, because of their shame, that say unto me, Aha! Aha!";
web[15] = "Let them be desolate for a reward of their shame that say to me, Aha, aha.";
hnv[15] = "Let them be desolate by reason of their shame that tell me, &quot;Aha! Aha!&quot;";
vul[15] = "[Vulgate 39:16] pereant post confusionem suam qui dicunt mihi va va";
kjv[16] = "Let all those that seek thee rejoice and be glad in thee: let such as love thy salvation say continually, The LORD be magnified.";
rsv[16] = "But may all who seek thee rejoice and be glad in thee; may those who love thy salvation say continually, &quot;Great is the LORD!&quot;";
asv[16] = "Let all those that seek thee rejoice and be glad in thee: Let such as love thy salvation say continually, Jehovah be magnified. ";
yng[16] = "All seeking Thee rejoice and are glad in Thee, Those loving Thy salvation say continually, `Jehovah is magnified.\'";
dby[16] = "Let all those that seek thee be glad and rejoice in thee; let such as love thy salvation say continually, Jehovah be magnified!";
web[16] = "Let all those that seek thee rejoice and be glad in thee: let such as love thy salvation say continually, The LORD be magnified.";
hnv[16] = "Let all those who seek you rejoice and be glad in you. Let such as love your salvation say continually, &quot;Let the LORD be exalted!&quot;";
vul[16] = "[Vulgate 39:17] gaudeant et laetentur in te qui quaerunt te dicant iugiter magnificetur Dominus qui diligunt salutare tuum";
kjv[17] = "But I [am] poor and needy; [yet] the Lord thinketh upon me: thou [art] my help and my deliverer; make no tarrying, O my God.";
rsv[17] = "As for me, I am poor and needy; but the Lord takes thought for me. Thou art my help and my deliverer; do not tarry, O my God!";
asv[17] = "But I am poor and needy; [Yet] the Lord thinketh upon me: Thou art my help and my deliverer; Make no tarrying, O my God. ";
yng[17] = "And I [am] poor and needy, The Lord doth devise for me. My help and my deliverer [art] Thou, O my God, tarry Thou not.";
dby[17] = "But I am afflicted and needy: the Lord thinketh upon me. Thou art my help and my deliverer: my God, make no delay.";
web[17] = "But I [am] poor and needy; [yet] the Lord thinketh upon me: thou [art] my help and my deliverer; make no delay, O my God.";
hnv[17] = "But I am poor and needy; May the Lord think about me. You are my help and my deliverer. Don\'t delay, my God. ";
vul[17] = "[Vulgate 39:18] ego autem sum egens et pauper Dominus sollicitus erit pro me auxilium meum et salutare meum tu Deus meus ne moreris";
csb[1] = "I waited patiently for the LORD, and he turned to me and heard my cry for help.";
csb[2] = "He brought me up from a desolate pit, out of the muddy clay, and set my feet on a rock, making my steps secure.";
csb[3] = "He put a new song in my mouth, a hymn of praise to our God. Many will see and fear, and they will trust in the LORD.";
csb[4] = "How happy is anyone who has put his trust in the LORD and has not turned to the proud or to those who run after lies!";
csb[5] = "LORD my God, you have done many things -- your wondrous works and your plans for us; none can compare with you. If I were to report and speak of them, they are more than can be told.";
csb[6] = "You do not delight in sacrifice and offering; you open my ears to listen. You do not ask for a whole burnt offering or a sin offering.";
csb[7] = "Then I said, &quot;See, I have come; in the scroll it is written about me.";
csb[8] = "&quot;I delight to do your will, my God, and your instruction is deep within me.&quot;";
csb[9] = "I proclaim righteousness in the great assembly; see, I do not keep my mouth closed -- as you know, LORD.";
csb[10] = "I did not hide your righteousness in my heart; I spoke about your faithfulness and salvation; I did not conceal your constant love and truth from the great assembly.";
csb[11] = "LORD, you do not withhold your compassion from me. Your constant love and truth will always guard me.";
csb[12] = "For troubles without number have surrounded me; my iniquities have overtaken me; I am unable to see. They are more than the hairs of my head, and my courage leaves me.";
csb[13] = "LORD, be pleased to rescue me; hurry to help me, LORD.";
csb[14] = "Let those who intend to take my life be disgraced and confounded. Let those who wish me harm be turned back and humiliated.";
csb[15] = "Let those who say to me, &quot;Aha, aha! &quot; be appalled because of their shame.";
csb[16] = "Let all who seek you rejoice and be glad in you; let those who love your salvation continually say, &quot;The LORD is great! &quot;";
csb[17] = "I am oppressed and needy; may the Lord think of me. You are my helper and my deliverer; my God, do not delay.";
</script>
