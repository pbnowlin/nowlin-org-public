kjv[1] = "[[[A Psalm] for Solomon.]] Give the king thy judgments, O God, and thy righteousness unto the king\'s son.";
rsv[1] = "A Psalm of Solomon. Give the king thy justice, O God, and thy righteousness to the royal son!";
asv[1] = "[A Psalm] of Solomon. Give the king thy judgments, O God, And thy righteousness unto the king\'s son. ";
yng[1] = "By Solomon. O God, Thy judgments to the king give, And Thy righteousness to the king\'s son.";
dby[1] = "{For Solomon.} O God, give the king thy judgments, and thy righteousness unto the king\'s son.";
web[1] = "[A Psalm] for Solomon. Give the king thy judgments, O God, and thy righteousness to the king\'s son.";
hnv[1] = "By Shlomo. God, give the king your justice; Your righteousness to the royal son.";
vul[1] = "[Vulgate 71:1] Salomonis [Vulgate 71:2a] Deus iudicium regi da et iustitiam tuam filio regis";
kjv[2] = "He shall judge thy people with righteousness, and thy poor with judgment.";
rsv[2] = "May he judge thy people with righteousness, and thy poor with justice!";
asv[2] = "He will judge thy people with righteousness, And thy poor with justice. ";
yng[2] = "He judgeth Thy people with righteousness, And Thy poor with judgment.";
dby[2] = "He will judge thy people with righteousness, and thine afflicted with judgment.";
web[2] = "He shall judge thy people with righteousness, and thy poor with judgment.";
hnv[2] = "He will judge your people with righteousness, And your poor with justice.";
vul[2] = "[Vulgate 71:2b] iudicabit populum tuum in iustitia et pauperes tuos in iudicio";
kjv[3] = "The mountains shall bring peace to the people, and the little hills, by righteousness.";
rsv[3] = "Let the mountains bear prosperity for the people, and the hills, in righteousness!";
asv[3] = "The mountains shall bring peace to the people, And the hills, in righteousness. ";
yng[3] = "The mountains bear peace to the people, And the heights by righteousness.";
dby[3] = "The mountains shall bring peace to the people, and the hills, by righteousness.";
web[3] = "The mountains shall bring peace to the people, and the little hills, by righteousness.";
hnv[3] = "The mountains shall bring prosperity to the people. The hills bring the fruit of righteousness.";
vul[3] = "[Vulgate 71:3] adsument montes pacem populo et colles iustitiam";
kjv[4] = "He shall judge the poor of the people, he shall save the children of the needy, and shall break in pieces the oppressor.";
rsv[4] = "May he defend the cause of the poor of the people, give deliverance to the needy, and crush the oppressor!";
asv[4] = "He will judge the poor of the people, He will save the children of the needy, And will break in pieces the oppressor. ";
yng[4] = "He judgeth the poor of the people, Giveth deliverance to the sons of the needy, And bruiseth the oppressor.";
dby[4] = "He will do justice to the afflicted of the people; he will save the children of the needy, and will break in pieces the oppressor.";
web[4] = "He shall judge the poor of the people, he shall save the children of the needy, and shall break in pieces the oppressor.";
hnv[4] = "He will judge the poor of the people. He will save the children of the needy, And will break the oppressor in pieces.";
vul[4] = "[Vulgate 71:4] iudicabit pauperes populi salvabit filios pauperis et confringet calumniatorem";
kjv[5] = "They shall fear thee as long as the sun and moon endure, throughout all generations.";
rsv[5] = "May he live while the sun endures, and as long as the moon, throughout all generations!";
asv[5] = "They shall fear thee while the sun endureth, And so long as the moon, throughout all generations. ";
yng[5] = "They fear Thee with the sun, and before the moon, Generation -- generations.";
dby[5] = "They shall fear thee as long as sun and moon endure, from generation to generation.";
web[5] = "They shall fear thee as long as the sun and moon endure, throughout all generations.";
hnv[5] = "They shall fear you while the sun endures; And as long as the moon, throughout all generations.";
vul[5] = "[Vulgate 71:5] et timebunt te quamdiu erit sol et ultra lunam in generatione generationum";
kjv[6] = "He shall come down like rain upon the mown grass: as showers [that] water the earth.";
rsv[6] = "May he be like rain that falls on the mown grass, like showers that water the earth!";
asv[6] = "He will come down like rain upon the mown grass, As showers that water the earth. ";
yng[6] = "He cometh down as rain on mown grass, As showers -- sprinkling the earth.";
dby[6] = "He shall come down like rain on the mown grass, as showers that water the earth.";
web[6] = "He shall come down like rain upon the mown grass: as showers [that] water the earth.";
hnv[6] = "He will come down like rain on the mown grass, As showers that water the eretz.";
vul[6] = "[Vulgate 71:6] descendet ut pluvia super vellus ut stillae inrorantes terram";
kjv[7] = "In his days shall the righteous flourish; and abundance of peace so long as the moon endureth.";
rsv[7] = "In his days may righteousness flourish, and peace abound, till the moon be no more!";
asv[7] = "In his days shall the righteous flourish, And abundance of peace, till the moon be no more. ";
yng[7] = "Flourish in his days doth the righteous, And abundance of peace till the moon is not.";
dby[7] = "In his days shall the righteous flourish, and abundance of peace till the moon be no more.";
web[7] = "In his days shall the righteous flourish; and abundance of peace so long as the moon endureth.";
hnv[7] = "In his days, the righteous shall flourish, And abundance of shalom, until the moon is no more.";
vul[7] = "[Vulgate 71:7] germinabit in diebus eius iustitia et multitudo pacis donec non sit luna";
kjv[8] = "He shall have dominion also from sea to sea, and from the river unto the ends of the earth.";
rsv[8] = "May he have dominion from sea to sea, and from the River to the ends of the earth!";
asv[8] = "He shall have dominion also from sea to sea, And from the River unto the ends of the earth. ";
yng[8] = "And he ruleth from sea unto sea, And from the river unto the ends of earth.";
dby[8] = "And he shall have dominion from sea to sea, and from the river unto the ends of the earth.";
web[8] = "He shall have dominion also from sea to sea, and from the river to the ends of the earth.";
hnv[8] = "He shall have dominion also from sea to sea, From the River to the ends of the eretz.";
vul[8] = "[Vulgate 71:8] et dominabitur a mari usque ad mare et a flumine usque ad terminos terrae";
kjv[9] = "They that dwell in the wilderness shall bow before him; and his enemies shall lick the dust.";
rsv[9] = "May his foes bow down before him, and his enemies lick the dust!";
asv[9] = "They that dwell in the wilderness shall bow before him; And his enemies shall lick the dust. ";
yng[9] = "Before him bow do the inhabitants of the dry places, And his enemies lick the dust.";
dby[9] = "The dwellers in the desert shall bow before him, and his enemies shall lick the dust.";
web[9] = "They that dwell in the wilderness shall bow before him; and his enemies shall lick the dust.";
hnv[9] = "Those who dwell in the wilderness shall bow before him. His enemies shall lick the dust.";
vul[9] = "[Vulgate 71:9] ante eum procident Aethiopes et inimici eius pulverem lingent";
kjv[10] = "The kings of Tarshish and of the isles shall bring presents: the kings of Sheba and Seba shall offer gifts.";
rsv[10] = "May the kings of Tarshish and of the isles render him tribute, may the kings of Sheba and Seba bring gifts!";
asv[10] = "The kings of Tarshish and of the isles shall render tribute: The kings of Sheba and Seba shall offer gifts. ";
yng[10] = "Kings of Tarshish and of the isles send back a present. Kings of Sheba and Seba a reward bring near.";
dby[10] = "The kings of Tarshish and of the isles shall render presents; the kings of Sheba and Seba shall offer tribute:";
web[10] = "The kings of Tarshish and of the isles shall bring presents: the kings of Sheba and Seba shall offer gifts.";
hnv[10] = "The kings of Tarshish and of the isles will bring tribute. The kings of Sheva and Seva shall offer gifts.";
vul[10] = "[Vulgate 71:10] reges Tharsis et insulae munera offerent reges Arabiae et Saba tributum conferent";
kjv[11] = "Yea, all kings shall fall down before him: all nations shall serve him.";
rsv[11] = "May all kings fall down before him, all nations serve him!";
asv[11] = "Yea, all kings shall fall down before him; All nations shall serve him. ";
yng[11] = "And all kings do bow themselves to him, All nations do serve him,";
dby[11] = "Yea, all kings shall bow down before him; all nations shall serve him.";
web[11] = "Yes, all kings shall fall down before him: all nations shall serve him.";
hnv[11] = "Yes, all kings shall fall down before him. All nations shall serve him.";
vul[11] = "[Vulgate 71:11] et adorabunt eum omnes reges universae nationes servient ei";
kjv[12] = "For he shall deliver the needy when he crieth; the poor also, and [him] that hath no helper.";
rsv[12] = "For he delivers the needy when he calls, the poor and him who has no helper.";
asv[12] = "For he will deliver the needy when he crieth, And the poor, that hath no helper. ";
yng[12] = "For he delivereth the needy who crieth, And the poor when he hath no helper,";
dby[12] = "For he will deliver the needy who crieth, and the afflicted, who hath no helper;";
web[12] = "For he shall deliver the needy when he crieth; the poor also, and [him] that hath no helper.";
hnv[12] = "For he will deliver the needy when he cries; The poor, who has no helper.";
vul[12] = "[Vulgate 71:12] quia eruet pauperem a potente et inopem cui non est adiutor";
kjv[13] = "He shall spare the poor and needy, and shall save the souls of the needy.";
rsv[13] = "He has pity on the weak and the needy, and saves the lives of the needy.";
asv[13] = "He will have pity on the poor and needy, And the souls of the needy he will save. ";
yng[13] = "He hath pity on the poor and needy, And the souls of the needy he saveth,";
dby[13] = "He will have compassion on the poor and needy, and will save the souls of the needy:";
web[13] = "He shall spare the poor and needy, and shall save the souls of the needy.";
hnv[13] = "He will have pity on the poor and needy. He will save the souls of the needy.";
vul[13] = "[Vulgate 71:13] parcet inopi et pauperi et animas pauperum salvabit";
kjv[14] = "He shall redeem their soul from deceit and violence: and precious shall their blood be in his sight.";
rsv[14] = "From oppression and violence he redeems their life; and precious is their blood in his sight.";
asv[14] = "He will redeem their soul from oppression and violence; And precious will their blood be in his sight: ";
yng[14] = "From fraud and from violence he redeemeth their soul, And precious is their blood in his eyes.";
dby[14] = "He will redeem their souls from oppression and violence, and precious shall their blood be in his sight.";
web[14] = "He shall redeem their soul from deceit and violence: and precious shall be their blood in his sight.";
hnv[14] = "He will redeem their soul from oppression and violence. Their blood will be precious in his sight.";
vul[14] = "[Vulgate 71:14] ab usura et iniquitate redimet animam eorum et pretiosus erit sanguis eorum coram oculis eius";
kjv[15] = "And he shall live, and to him shall be given of the gold of Sheba: prayer also shall be made for him continually; [and] daily shall he be praised.";
rsv[15] = "Long may he live, may gold of Sheba be given to him! May prayer be made for him continually, and blessings invoked for him all the day!";
asv[15] = "And they shall live; and to him shall be given of the gold of Sheba: And men shall pray for him continually; They shall bless him all the day long. ";
yng[15] = "And he liveth, and giveth to him of the gold of Sheba, And prayeth for him continually, All the day he doth bless him.";
dby[15] = "And he shall live; and to him shall be given of the gold of Sheba; and prayer shall be made for him continually: all the day shall he be blessed.";
web[15] = "And he shall live, and to him shall be given of the gold of Sheba: prayer also shall be made for him continually; [and] daily shall he be praised.";
hnv[15] = "They shall live, and to him shall be given of the gold of Sheva. Men shall pray for him continually. They shall bless him all day long.";
vul[15] = "[Vulgate 71:15] et vivet et dabitur ei de auro Saba et orabunt de eo iugiter tota die benedicent ei";
kjv[16] = "There shall be an handful of corn in the earth upon the top of the mountains; the fruit thereof shall shake like Lebanon: and [they] of the city shall flourish like grass of the earth.";
rsv[16] = "May there be abundance of grain in the land; on the tops of the mountains may it wave; may its fruit be like Lebanon; and may men blossom forth from the cities like the grass of the field!";
asv[16] = "There shall be abundance of grain in the earth upon the top of the mountains; The fruit thereof shall shake like Lebanon: And they of the city shall flourish like grass of the earth. ";
yng[16] = "There is a handful of corn in the earth, On the top of mountains, Shake like Lebanon doth its fruit, And they flourish out of the city as the herb of the earth.";
dby[16] = "There shall be abundance of corn in the earth, upon the top of the mountains; the fruit thereof shall shake like Lebanon; and they of the city shall bloom like the herb of the earth.";
web[16] = "There shall be a handful of corn in the earth upon the top of the mountains; the fruit of it shall shake like Lebanon: and [they] of the city shall flourish like grass of the earth.";
hnv[16] = "There shall be abundance of grain throughout the land. Its fruit sways like Levanon. Let it flourish, thriving like the grass of the field.";
vul[16] = "[Vulgate 71:16] erit memorabile triticum in terra in capite montium elevabitur sicut Libani fructus eius et florebunt de civitate sicut faenum terrae";
kjv[17] = "His name shall endure for ever: his name shall be continued as long as the sun: and [men] shall be blessed in him: all nations shall call him blessed.";
rsv[17] = "May his name endure for ever, his fame continue as long as the sun! May men bless themselves by him, all nations call him blessed!";
asv[17] = "His name shall endure for ever; His name shall be continued as long as the sun: And men shall be blessed in him; All nations shall call him happy. ";
yng[17] = "His name is to the age, Before the sun is his name continued, And they bless themselves in him, All nations do pronounce him happy.";
dby[17] = "His name shall endure for ever; his name shall be continued as long as the sun: and [men] shall bless themselves in him; all nations shall call him blessed.";
web[17] = "His name shall endure for ever: his name shall be continued as long as the sun: and [men] shall be blessed in him: all nations shall call him blessed.";
hnv[17] = "His name endures forever. His name continues as long as the sun. Men shall be blessed by him. All nations will call him blessed.";
vul[17] = "[Vulgate 71:17] erit nomen eius in aeternum ultra solem perseverabit nomen eius et benedicentur in eo omnes gentes et beatificabunt eum";
kjv[18] = "Blessed [be] the LORD God, the God of Israel, who only doeth wondrous things.";
rsv[18] = "Blessed be the LORD, the God of Israel, who alone does wondrous things.";
asv[18] = "Blessed be Jehovah God, the God of Israel, Who only doeth wondrous things: ";
yng[18] = "Blessed is Jehovah God, God of Israel, He alone is doing wonders,";
dby[18] = "Blessed be Jehovah Elohim, the God of Israel, who alone doeth wondrous things!";
web[18] = "Blessed [be] the LORD God, the God of Israel, who only doeth wondrous things.";
hnv[18] = "Praise be to the LORD God, the God of Yisra\'el, Who alone does marvelous deeds.";
vul[18] = "[Vulgate 71:18] benedictus Dominus Deus Deus Israhel qui facit mirabilia solus";
kjv[19] = "And blessed [be] his glorious name for ever: and let the whole earth be filled [with] his glory; Amen, and Amen.";
rsv[19] = "Blessed be his glorious name for ever; may his glory fill the whole earth! Amen and Amen!";
asv[19] = "And blessed be his glorious name for ever; And let the whole earth be filled with his glory. Amen, and Amen. ";
yng[19] = "And blessed [is] the Name of His honour to the age, And the whole earth is filled [with] His honour. Amen, and amen!";
dby[19] = "And blessed be his glorious name for ever! and let the whole earth be filled with his glory! Amen, and Amen.";
web[19] = "And blessed [be] his glorious name for ever: and let the whole earth be filled [with] his glory; Amen, and amen.";
hnv[19] = "Blessed be his glorious name forever! Let the whole eretz be filled with his glory! Amein and amein.";
vul[19] = "[Vulgate 71:19] et benedictum nomen gloriae eius in sempiternum et implebitur gloria eius universa terra amen amen";
kjv[20] = "The prayers of David the son of Jesse are ended.";
rsv[20] = "The prayers of David, the son of Jesse, are ended.";
asv[20] = "The prayers of David the son of Jesse are ended. ";
yng[20] = "The prayers of David son of Jesse have been ended.";
dby[20] = "The prayers of David the son of Jesse are ended.";
web[20] = "The prayers of David the son of Jesse are ended.";
hnv[20] = "This ends the prayers by David, the son of Yishai. ";
vul[20] = "[Vulgate 71:20] conpletae sunt orationes David filii Iesse";
csb[1] = "God, give your justice to the king and your righteousness to the king\'s son.";
csb[2] = "He will judge your people with righteousness and your afflicted ones with justice.";
csb[3] = "May the mountains bring well-being to the people and the hills, righteousness.";
csb[4] = "May he vindicate the afflicted among the people, help the poor, and crush the oppressor.";
csb[5] = "May they fear you while the sun endures and as long as the moon, throughout all generations.";
csb[6] = "May the king be like rain that falls on the cut grass, like spring showers that water the earth.";
csb[7] = "May the righteous flourish in his days and well-being abound until the moon is no more.";
csb[8] = "May he rule from sea to sea and from the Euphrates to the ends of the earth.";
csb[9] = "May desert tribes kneel before him and his enemies lick the dust.";
csb[10] = "May the kings of Tarshish and the coasts and islands bring tribute, the kings of Sheba and Seba offer gifts.";
csb[11] = "Let all kings bow in homage to him, all nations serve him.";
csb[12] = "For he will rescue the poor who cry out and the afflicted who have no helper.";
csb[13] = "He will have pity on the poor and helpless and save the lives of the poor.";
csb[14] = "He will redeem them from oppression and violence, for their lives are precious in his sight.";
csb[15] = "May he live long! May gold from Sheba be given to him. May prayer be offered for him continually, and may he be blessed all day long.";
csb[16] = "May there be plenty of grain in the land; may it wave on the tops of the mountains. May its crops be like Lebanon. May people flourish in the cities like the grass of the field.";
csb[17] = "May his name endure forever; as long as the sun shines, may his fame increase. May all nations be blessed by him and call him blessed.";
csb[18] = "Blessed be the LORD God, the God of Israel, who alone does wonders.";
csb[19] = "Blessed be his glorious name forever; the whole earth is filled with his glory. Amen and amen.";
csb[20] = "The prayers of David son of Jesse are concluded.";
</script>
