yng[35] = "Consumed are sinners from the earth, And the wicked are no more. Bless, O my soul, Jehovah. Praise ye Jehovah!";
dby[35] = "Sinners shall be consumed out of the earth, and the wicked shall be no more. Bless Jehovah, O my soul. Hallelujah!";

csb[1] = "My soul, bless the LORD! LORD my God, you are very great; you are clothed with majesty and splendor.";
csb[2] = "He wraps himself in light as if it were a robe, spreading out the sky like a canopy,";
csb[3] = "laying the beams of his palace on the waters above, making the clouds his chariot, walking on the wings of the wind,";
csb[4] = "and making the winds his messengers, flames of fire his servants.";
csb[5] = "He established the earth on its foundations; it will never be shaken.";
csb[6] = "You covered it with the deep as if it were a garment; the water stood above the mountains.";
csb[7] = "At your rebuke the water fled; at the sound of your thunder they hurried away --";
csb[8] = "mountains rose and valleys sank -- to the place you established for them.";
csb[9] = "You set a boundary they cannot cross; they will never cover the earth again.";
csb[10] = "He causes the springs to gush into the valleys; they flow between the mountains.";
csb[11] = "They supply water for every wild beast; the wild donkeys quench their thirst.";
csb[12] = "The birds of the sky live beside the springs; they make their voices heard among the foliage.";
csb[13] = "He waters the mountains from his palace; the earth is satisfied by the fruit of your labor.";
csb[14] = "He causes grass to grow for the livestock and provides crops for man to cultivate, producing food from the earth,";
csb[15] = "wine that makes human hearts glad -- making his face shine with oil -- and bread that sustains human hearts.";
csb[16] = "The trees of the LORD flourish, the cedars of Lebanon that he planted.";
csb[17] = "There the birds make their nests; storks make their homes in the pine trees.";
csb[18] = "The high mountains are for the wild goats; the cliffs are a refuge for hyraxes.";
csb[19] = "He made the moon to mark the festivals; the sun knows when to set.";
csb[20] = "You bring darkness, and it becomes night, when all the forest animals stir.";
csb[21] = "The young lions roar for their prey and seek their food from God.";
csb[22] = "The sun rises; they go back and lie down in their dens.";
csb[23] = "Man goes out to his work and to his labor until evening.";
csb[24] = "How countless are your works, LORD! In wisdom you have made them all; the earth is full of your creatures.";
csb[25] = "Here is the sea, vast and wide, teeming with creatures beyond number -- living things both large and small.";
csb[26] = "There the ships move about, and Leviathan, which you formed to play there.";
csb[27] = "All of them wait for you to give them their food at the right time.";
csb[28] = "When you give it to them, they gather it; when you open your hand, they are satisfied with good things.";
csb[29] = "When you hide your face, they are terrified; when you take away their breath, they die and return to the dust.";
csb[30] = "When you send your breath, they are created, and you renew the surface of the ground.";
csb[31] = "May the glory of the LORD endure forever; may the LORD rejoice in his works.";
csb[32] = "He looks at the earth, and it trembles; he touches the mountains, and they pour out smoke.";
csb[33] = "I will sing to the LORD all my life; I will sing praise to my God while I live.";
csb[34] = "May my meditation be pleasing to him; I will rejoice in the LORD.";
csb[35] = "May sinners vanish from the earth and wicked people be no more. My soul, bless the LORD! Hallelujah!";
</script>
