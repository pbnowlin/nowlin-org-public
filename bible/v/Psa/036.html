kjv[1] = "[[To the chief Musician, [A Psalm] of David the servant of the LORD.]] The transgression of the wicked saith within my heart, [that there is] no fear of God before his eyes.";
rsv[1] = "To the choirmaster. A Psalm of David, the servant of the LORD. Transgression speaks to the wicked deep in his heart; there is no fear of God before his eyes.";
asv[1] = "For the Chief Musician. [A Psalm] of David the servant of Jehovah. The transgression of the wicked saith within my heart, There is no fear of God before his eyes. ";
yng[1] = "To the Overseer. -- By a servant of Jehovah, by David. The transgression of the wicked Is affirming within my heart, `Fear of God is not before his eyes,";
dby[1] = "{To the chief Musician. [A Psalm] of the servant of Jehovah; of David.} The transgression of the wicked uttereth within my heart, There is no fear of God before his eyes.";
web[1] = "To the chief Musician, [A Psalm] of David the servant of the LORD. The transgression of the wicked saith within my heart, [that there is] no fear of God before his eyes.";
hnv[1] = "For the Chief Musician. By David, the servant of the LORD. An oracle is within my heart about the disobedience of the wicked: &quot;There is no fear of God before his eyes.&quot;";
vul[1] = "[Vulgate 35:1] pro victoria servi Domini David [Vulgate 35:2] dixit scelus impii in medio cordis eius non esse timorem Dei ante oculos eius";
kjv[2] = "For he flattereth himself in his own eyes, until his iniquity be found to be hateful.";
rsv[2] = "For he flatters himself in his own eyes that his iniquity cannot be found out and hated.";
asv[2] = "For he flattereth himself in his own eyes, That his iniquity will not be found out and be hated. ";
yng[2] = "For he made [it] smooth to himself in his eyes, To find his iniquity to be hated.";
dby[2] = "For he flattereth himself in his own eyes, [even] when his iniquity is found to be hateful.";
web[2] = "For he flattereth himself in his own eyes, until his iniquity is found to be hateful.";
hnv[2] = "For he flatters himself in his own eyes, Too much to detect and hate his sin.";
vul[2] = "[Vulgate 35:3] quia dolose egit adversum eum in oculis suis ut inveniret iniquitatem eius ad odiendum";
kjv[3] = "The words of his mouth [are] iniquity and deceit: he hath left off to be wise, [and] to do good.";
rsv[3] = "The words of his mouth are mischief and deceit; he has ceased to act wisely and do good.";
asv[3] = "The words of his mouth are iniquity and deceit: He hath ceased to be wise [and] to do good. ";
yng[3] = "The words of his mouth [are] iniquity and deceit, He ceased to act prudently -- to do good.";
dby[3] = "The words of his mouth are wickedness and deceit: he hath left off to be wise, to do good.";
web[3] = "The words of his mouth [are] iniquity and deceit: he hath ceased to be wise, [and] to do good.";
hnv[3] = "The words of his mouth are iniquity and deceit. He has ceased to be wise and to do good.";
vul[3] = "[Vulgate 35:4] verba oris eius iniquitas et dolus cessavit cogitare benefacere";
kjv[4] = "He deviseth mischief upon his bed; he setteth himself in a way [that is] not good; he abhorreth not evil.";
rsv[4] = "He plots mischief while on his bed; he sets himself in a way that is not good; he spurns not evil.";
asv[4] = "He deviseth iniquity upon his bed; He setteth himself in a way that is not good; He abhorreth not evil. ";
yng[4] = "Iniquity he deviseth on his bed, He stationeth himself on a way not good, Evil he doth not refuse.\'";
dby[4] = "He deviseth wickedness up on his bed; he setteth himself in a way that is not good: he abhorreth not evil.";
web[4] = "He deviseth mischief upon his bed; he setteth himself in a way [that is] not good; he abhorreth not evil.";
hnv[4] = "He plots iniquity on his bed. He sets himself in a way that is not good; He doesn\'t abhor evil.";
vul[4] = "[Vulgate 35:5] iniquitatem cogitat in cubili suo stabit in via non bona malum non abiciet";
kjv[5] = "Thy mercy, O LORD, [is] in the heavens; [and] thy faithfulness [reacheth] unto the clouds.";
rsv[5] = "Thy steadfast love, O LORD, extends to the heavens, thy faithfulness to the clouds.";
asv[5] = "Thy lovingkindness, O Jehovah, is in the heavens; Thy faithfulness [reacheth] unto the skies. ";
yng[5] = "O Jehovah, in the heavens [is] Thy kindness, Thy faithfulness [is] unto the clouds.";
dby[5] = "Jehovah, thy loving-kindness is in the heavens, and thy faithfulness [reacheth] unto the clouds.";
web[5] = "Thy mercy, O LORD, [is] in the heavens; [and] thy faithfulness [reacheth] to the clouds.";
hnv[5] = "Your lovingkindness, LORD, is in the heavens. Your faithfulness reaches to the skies.";
vul[5] = "[Vulgate 35:6] Domine in caelo misericordia tua fides tua usque ad nubes";
kjv[6] = "Thy righteousness [is] like the great mountains; thy judgments [are] a great deep: O LORD, thou preservest man and beast.";
rsv[6] = "Thy righteousness is like the mountains of God, thy judgments are like the great deep; man and beast thou savest, O LORD.";
asv[6] = "Thy righteousness is like the mountains of God; Thy judgments are a great deep: O Jehovah, thou preservest man and beast. ";
yng[6] = "Thy righteousness [is] as mountains of God, Thy judgments [are] a great deep. Man and beast Thou savest, O Jehovah.";
dby[6] = "Thy righteousness is like the high mountains; thy judgments are a great deep: thou, Jehovah, preservest man and beast.";
web[6] = "Thy righteousness [is] like the great mountains; thy judgments [are] a great deep: O LORD, thou preservest man and beast.";
hnv[6] = "Your righteousness is like the mountains of God. Your judgments are like a great deep. LORD, you preserve man and animal.";
vul[6] = "[Vulgate 35:7] iustitia tua quasi montes Domine iudicium tuum abyssus multa homines et iumenta salvos facies Domine";
kjv[7] = "How excellent [is] thy lovingkindness, O God! therefore the children of men put their trust under the shadow of thy wings.";
rsv[7] = "How precious is thy steadfast love, O God! The children of men take refuge in the shadow of thy wings.";
asv[7] = "How precious is thy lovingkindness, O God! And the children of men take refuge under the shadow of thy wings. ";
yng[7] = "How precious [is] Thy kindness, O God, And the sons of men In the shadow of Thy wings do trust.";
dby[7] = "How precious is thy loving-kindness, O God! So the sons of men take refuge under the shadow of thy wings.";
web[7] = "How excellent [is] thy loving-kindness, O God! therefore the children of men put their trust under the shadow of thy wings.";
hnv[7] = "How precious is your lovingkindness, God! The children of men take refuge under the shadow of your wings.";
vul[7] = "[Vulgate 35:8] quam pretiosa est misericordia tua Domine et filii Adam in umbra alarum tuarum sperabunt";
kjv[8] = "They shall be abundantly satisfied with the fatness of thy house; and thou shalt make them drink of the river of thy pleasures.";
rsv[8] = "They feast on the abundance of thy house, and thou givest them drink from the river of thy delights.";
asv[8] = "They shall be abundantly satisfied with the fatness of thy house; And thou wilt make them drink of the river of thy pleasures. ";
yng[8] = "They are filled from the fatness of Thy house, And the stream of Thy delights Thou dost cause them to drink.";
dby[8] = "They shall be abundantly satisfied with the fatness of thy house; and thou wilt make them drink of the river of thy pleasures.";
web[8] = "They shall be abundantly satisfied with the fatness of thy house; and thou shalt make them drink of the river of thy pleasures.";
hnv[8] = "They shall be abundantly satisfied with the abundance of your house. You will make them drink of the river of your pleasures.";
vul[8] = "[Vulgate 35:9] inebriabuntur de pinguidine domus tuae et torrente deliciarum tuarum potabis eos";
kjv[9] = "For with thee [is] the fountain of life: in thy light shall we see light.";
rsv[9] = "For with thee is the fountain of life; in thy light do we see light.";
asv[9] = "For with thee is the fountain of life: In thy light shall we see light. ";
yng[9] = "For with Thee [is] a fountain of life, In Thy light we see light.";
dby[9] = "For with thee is the fountain of life: in thy light shall we see light.";
web[9] = "For with thee [is] the fountain of life: in thy light shall we see light.";
hnv[9] = "For with you is the spring of life. In your light shall we see light.";
vul[9] = "[Vulgate 35:10] quoniam tecum est fons vitae in lumine tuo videbimus lumen";
kjv[10] = "O continue thy lovingkindness unto them that know thee; and thy righteousness to the upright in heart.";
rsv[10] = "O continue thy steadfast love to those who know thee, and thy salvation to the upright of heart!";
asv[10] = "Oh continue thy lovingkindness unto them that know thee, And thy righteousness to the upright in heart. ";
yng[10] = "Draw out Thy kindness to those knowing Thee, And Thy righteousness to the upright of heart.";
dby[10] = "Continue thy loving-kindness unto them that know thee, and thy righteousness to the upright in heart;";
web[10] = "O continue thy loving-kindness to them that know thee; and thy righteousness to the upright in heart.";
hnv[10] = "Oh continue your lovingkindness to those who know you, Your righteousness to the upright in heart.";
vul[10] = "[Vulgate 35:11] adtrahe misericordiam tuam scientibus te et iustitiam tuam rectis corde";
kjv[11] = "Let not the foot of pride come against me, and let not the hand of the wicked remove me.";
rsv[11] = "Let not the foot of arrogance come upon me, nor the hand of the wicked drive me away.";
asv[11] = "Let not the foot of pride come against me, And let not the hand of the wicked drive me away. ";
yng[11] = "Let not a foot of pride meet me, And a hand of the wicked let not move me.";
dby[11] = "Let not the foot of pride come against me, and let not the hand of the wicked drive me away.";
web[11] = "Let not the foot of pride come against me, and let not the hand of the wicked remove me.";
hnv[11] = "Don\'t let the foot of pride come against me. Don\'t let the hand of the wicked drive me away.";
vul[11] = "[Vulgate 35:12] ne veniat mihi pes superbiae et manus impiorum non me commoveat";
kjv[12] = "There are the workers of iniquity fallen: they are cast down, and shall not be able to rise.";
rsv[12] = "There the evildoers lie prostrate, they are thrust down, unable to rise.";
asv[12] = "There are the workers of iniquity fallen: They are thrust down, and shall not be able to rise. ";
yng[12] = "There have workers of iniquity fallen, They have been overthrown, And have not been able to arise!";
dby[12] = "There are the workers of iniquity fallen: they are cast down, and are not able to rise.";
web[12] = "There are the workers of iniquity fallen: they are cast down, and shall not be able to rise.";
hnv[12] = "There the workers of iniquity are fallen. They are thrust down, and shall not be able to rise. ";
vul[12] = "[Vulgate 35:13] ibi ceciderunt operantes iniquitatem expulsi sunt et non potuerunt surgere";
csb[1] = "An oracle within my heart concerning the transgression of the wicked person: Dread of God has no effect on him.";
csb[2] = "For with his flattering opinion of himself, he does not discover and hate his iniquity.";
csb[3] = "The words from his mouth are malicious and deceptive; he has stopped acting wisely and doing good.";
csb[4] = "Even on his bed he makes malicious plans. He sets himself on a path that is not good, and he does not reject evil.";
csb[5] = "LORD, your faithful love reaches to heaven, your faithfulness to the clouds.";
csb[6] = "Your righteousness is like the highest mountains, your judgments like the deepest sea. LORD, you preserve people and animals.";
csb[7] = "How priceless your faithful love is, God! People take refuge in the shadow of your wings.";
csb[8] = "They are filled from the abundance of your house. You let them drink from your refreshing stream.";
csb[9] = "For the wellspring of life is with you. By means of your light we see light.";
csb[10] = "Spread your faithful love over those who know you, and your righteousness over the upright in heart.";
csb[11] = "Do not let the foot of the arrogant come near me or the hand of the wicked drive me away.";
csb[12] = "There! The evildoers have fallen. They have been thrown down and cannot rise.";
