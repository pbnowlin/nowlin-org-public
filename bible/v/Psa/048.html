csb[8] = "Just as we heard, so we have seen in the city of the LORD of Armies, in the city of our God; God will establish it forever. Selah";
csb[9] = "God, within your temple, we contemplate your faithful love.";
csb[10] = "Like your name, God, so your praise reaches to the ends of the earth; your right hand is filled with justice.";

csb[12] = "Go around Zion, encircle it; count its towers,";
csb[13] = "note its ramparts; tour its citadels so that you can tell a future generation:";
