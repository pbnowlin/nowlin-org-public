kjv[1] = "[[A Prayer of David.]] Hear the right, O LORD, attend unto my cry, give ear unto my prayer, [that goeth] not out of feigned lips.";
rsv[1] = "A Prayer of David. Hear a just cause, O LORD; attend to my cry! Give ear to my prayer from lips free of deceit!";
asv[1] = "[A Prayer of David.] Hear the right, O Jehovah, attend unto my cry; Give ear unto my prayer, that goeth not out of feigned lips. ";
yng[1] = "A Prayer of David. Hear, O Jehovah, righteousness, attend my cry, Give ear [to] my prayer, without lips of deceit.";
dby[1] = "{A Prayer of David.} Hear the right, O Jehovah, attend unto my cry; give ear unto my prayer, which is not out of feigned lips.";
web[1] = "A Prayer of David. Hear the right, O LORD, attend to my cry, give ear to my prayer, [that goeth] not out of feigned lips.";
hnv[1] = "A Prayer by David. Hear, LORD, my righteous plea; Give ear to my prayer, that doesn\'t go out of deceitful lips.";
vul[1] = "[Vulgate 16:1] oratio David audi Deus iustum intende deprecationem meam auribus percipe orationem meam absque labiis mendacii";
kjv[2] = "Let my sentence come forth from thy presence; let thine eyes behold the things that are equal.";
rsv[2] = "From thee let my vindication come! Let thy eyes see the right!";
asv[2] = "Let my sentence come forth from thy presence; Let thine eyes look upon equity. ";
yng[2] = "From before thee my judgment doth go out; Thine eyes do see uprightly.";
dby[2] = "Let my judgment come forth from thy presence, let thine eyes regard equity.";
web[2] = "Let my sentence come forth from thy presence; let thy eyes behold the things that are equal.";
hnv[2] = "Let my sentence come forth from your presence; Let your eyes look on equity.";
vul[2] = "[Vulgate 16:2] de vultu tuo iudicium meum prodeat oculi tui videant aequitates";
kjv[3] = "Thou hast proved mine heart; thou hast visited [me] in the night; thou hast tried me, [and] shalt find nothing; I am purposed [that] my mouth shall not transgress.";
rsv[3] = "If thou triest my heart, if thou visitest me by night, if thou testest me, thou wilt find no wickedness in me; my mouth does not transgress.";
asv[3] = "Thou hast proved my heart; thou hast visited me in the night; Thou hast tried me, and findest nothing; I am purposed that my mouth shall not transgress. ";
yng[3] = "Thou hast proved my heart, Thou hast inspected by night, Thou hast tried me, Thou findest nothing; My thoughts pass not over my mouth.";
dby[3] = "Thou hast proved my heart, thou hast visited me by night; thou hast tried me, thou hast found nothing: my thought goeth not beyond my word.";
web[3] = "Thou hast proved my heart; thou hast visited [me] in the night; thou hast tried me, [and] shalt find nothing; I have purposed [that] my mouth shall not transgress.";
hnv[3] = "You have proved my heart; you have visited me in the night; You have tried me, and found nothing; I have resolved that my mouth shall not disobey.";
vul[3] = "[Vulgate 16:3] probasti cor meum visitasti nocte conflasti me et non invenisti";
kjv[4] = "Concerning the works of men, by the word of thy lips I have kept [me from] the paths of the destroyer.";
rsv[4] = "With regard to the works of men, by the word of thy lips I have avoided the ways of the violent.";
asv[4] = "As for the works of men, by the word of thy lips I have kept me from the ways of the violent. ";
yng[4] = "As to doings of man, Through a word of Thy lips I have observed The paths of a destroyer;";
dby[4] = "Concerning the works of men, by the word of thy lips I have kept from the paths of the violent [man].";
web[4] = "Concerning the works of men, by the word of thy lips I have kept [me from] the paths of the destroyer.";
hnv[4] = "As for the works of men, by the word of your lips I have kept myself from the ways of the violent.";
vul[4] = "[Vulgate 16:4] cogitationes meas transire os meum in opere hominum propter verbum labiorum tuorum ego observavi vias latronis";
kjv[5] = "Hold up my goings in thy paths, [that] my footsteps slip not.";
rsv[5] = "My steps have held fast to thy paths, my feet have not slipped.";
asv[5] = "My steps have held fast to thy paths, My feet have not slipped. ";
yng[5] = "To uphold my goings in Thy paths, My steps have not slidden.";
dby[5] = "When thou holdest my goings in thy paths, my footsteps slip not.";
web[5] = "Uphold my goings in thy paths, [that] my footsteps slip not.";
hnv[5] = "My steps have held fast to your paths, My feet have not slipped.";
vul[5] = "[Vulgate 16:5] sustenta gressus meos in callibus tuis et non labentur vestigia mea";
kjv[6] = "I have called upon thee, for thou wilt hear me, O God: incline thine ear unto me, [and hear] my speech.";
rsv[6] = "I call upon thee, for thou wilt answer me, O God; incline thy ear to me, hear my words.";
asv[6] = "I have called upon thee, for thou wilt answer me, O God: Incline thine ear unto me, [and] hear my speech. ";
yng[6] = "I -- I called Thee, for Thou dost answer me, O God, incline Thine ear to me, hear my speech.";
dby[6] = "I have called upon thee, for thou answerest me, O God. Incline thine ear unto me, hear my speech.";
web[6] = "I have called upon thee, for thou wilt hear me, O God: incline thy ear to me, [and hear] my speech.";
hnv[6] = "I have called on you, for you will answer me, God: Turn your ear to me. Hear my speech.";
vul[6] = "[Vulgate 16:6] ego invocavi te quia exaudies me Deus inclina aurem tuam mihi audi eloquium meum";
kjv[7] = "Shew thy marvellous lovingkindness, O thou that savest by thy right hand them which put their trust [in thee] from those that rise up [against them].";
rsv[7] = "Wondrously show thy steadfast love, O savior of those who seek refuge from their adversaries at thy right hand.";
asv[7] = "Show thy marvellous lovingkindness, O thou that savest by thy right hand them that take refuge [in thee] From those that rise up [against them]. ";
yng[7] = "Separate wonderfully Thy kindness, O Saviour of the confiding, By Thy right hand, from withstanders.";
dby[7] = "Shew wondrously thy loving-kindnesses, O thou that savest by thy right hand them that trust [in thee] from those that rise up [against them].";
web[7] = "Show thy wonderful loving-kindness, O thou that savest by thy right hand them who put their trust [in thee] from those that rise up [against them].";
hnv[7] = "Show your marvelous lovingkindness, You who save those who take refuge by your right hand from their enemies.";
vul[7] = "[Vulgate 16:7] mirabilem fac misericordiam tuam salvator sperantium";
kjv[8] = "Keep me as the apple of the eye, hide me under the shadow of thy wings,";
rsv[8] = "Keep me as the apple of the eye; hide me in the shadow of thy wings,";
asv[8] = "Keep me as the apple of the eye; Hide me under the shadow of thy wings, ";
yng[8] = "Keep me as the apple, the daughter of the eye; In shadow of Thy wings thou dost hide me.";
dby[8] = "Keep me as the apple of the eye, hide me under the shadow of thy wings,";
web[8] = "Keep me as the apple of the eye, hide me under the shade of thy wings.";
hnv[8] = "Keep me as the apple of your eye; Hide me under the shadow of your wings,";
vul[8] = "[Vulgate 16:8] a resistentibus dexterae tuae custodi me quasi pupillam intus in oculo in umbra alarum tuarum protege me";
kjv[9] = "From the wicked that oppress me, [from] my deadly enemies, [who] compass me about.";
rsv[9] = "from the wicked who despoil me, my deadly enemies who surround me.";
asv[9] = "From the wicked that oppress me, My deadly enemies, that compass me about. ";
yng[9] = "From the face of the wicked who spoiled me. Mine enemies in soul go round against me.";
dby[9] = "From the wicked that destroy me, my deadly enemies, who compass me about.";
web[9] = "From the wicked that oppress me, [from] my deadly enemies, [who] encompass me,";
hnv[9] = "From the wicked who oppress me, My deadly enemies, who surround me.";
vul[9] = "[Vulgate 16:9] a facie impiorum vastantium me inimici mei animam meam circumdederunt";
kjv[10] = "They are inclosed in their own fat: with their mouth they speak proudly.";
rsv[10] = "They close their hearts to pity; with their mouths they speak arrogantly.";
asv[10] = "They are inclosed in their own fat: With their mouth they speak proudly. ";
yng[10] = "Their fat they have closed up, Their mouths have spoken with pride:";
dby[10] = "They are enclosed in their own fat; with their mouth they speak proudly.";
web[10] = "They are inclosed in their own fat: with their mouth they speak proudly.";
hnv[10] = "They close up their callous hearts. With their mouth they speak proudly.";
vul[10] = "[Vulgate 16:10] adipe suo concluserunt et ore locuti sunt superbe";
kjv[11] = "They have now compassed us in our steps: they have set their eyes bowing down to the earth;";
rsv[11] = "They track me down; now they surround me; they set their eyes to cast me to the ground.";
asv[11] = "They have now compassed us in our steps; They set their eyes to cast [us] down to the earth. ";
yng[11] = "`Our steps now have compassed [him];\' Their eyes they set to turn aside in the land.";
dby[11] = "They have now encompassed us in our steps; their eyes have they set, bowing down to the earth.";
web[11] = "They have now compassed us in our steps: they have set their eyes bowing down to the earth;";
hnv[11] = "They have now surrounded us in our steps. They set their eyes to cast us down to the eretz.";
vul[11] = "[Vulgate 16:11] incedentes adversum me nunc circumdederunt me oculos suos posuerunt declinare in terram";
kjv[12] = "Like as a lion [that] is greedy of his prey, and as it were a young lion lurking in secret places.";
rsv[12] = "They are like a lion eager to tear, as a young lion lurking in ambush.";
asv[12] = "He is like a lion that is greedy of his prey, And as it were a young lion lurking in secret places. ";
yng[12] = "His likeness as a lion desirous to tear, As a young lion dwelling in secret places.";
dby[12] = "He is like a lion that is greedy of its prey, and as a young lion lurking in secret places.";
web[12] = "Like as a lion [that] is greedy of his prey, and as it were a young lion lurking in secret places.";
hnv[12] = "He is like a lion that is greedy of his prey, As it were a young lion lurking in secret places.";
vul[12] = "[Vulgate 16:12] similitudo eius quasi leonis desiderantis praedam et quasi catuli leonis sedentis in absconditis";
kjv[13] = "Arise, O LORD, disappoint him, cast him down: deliver my soul from the wicked, [which is] thy sword:";
rsv[13] = "Arise, O LORD! confront them, overthrow them! Deliver my life from the wicked by thy sword,";
asv[13] = "Arise, O Jehovah, Confront him, cast him down: Deliver my soul from the wicked by thy sword; ";
yng[13] = "Arise, O Jehovah, go before his face, Cause him to bend. Deliver my soul from the wicked, Thy sword,";
dby[13] = "Arise, Jehovah, anticipate him, cast him down: deliver my soul from the wicked, thy sword;";
web[13] = "Arise, O LORD disappoint him, cast him down: deliver my soul from the wicked, [who is] thy sword:";
hnv[13] = "Arise, LORD, Confront him, cast him down. Deliver my soul from the wicked by your sword;";
vul[13] = "[Vulgate 16:13] surge Domine praeveni faciem eius incurva eum salva animam meam ab impio qui est gladius tuus";
kjv[14] = "From men [which are] thy hand, O LORD, from men of the world, [which have] their portion in [this] life, and whose belly thou fillest with thy hid [treasure]: they are full of children, and leave the rest of their [substance] to their babes.";
rsv[14] = "from men by thy hand, O LORD, from men whose portion in life is of the world. May their belly be filled with what thou hast stored up for them; may their children have more than enough; may they leave something over to their babes.";
asv[14] = "From men by thy hand, O Jehovah, From men of the world, whose portion is in [this] life, And whose belly thou fillest with thy treasure: They are satisfied with children, And leave the rest of their substance to their babes. ";
yng[14] = "From men, Thy hand, O Jehovah, From men of the world, their portion [is] in life, And [with] Thy hidden things Thou fillest their belly, They are satisfied [with] sons; And have left their abundance to their sucklings.";
dby[14] = "From men [who are] thy hand, O Jehovah, from men of this age: their portion is in [this] life, and their belly thou fillest with thy hid [treasure]; they have their fill of sons, and leave the rest of their [substance] to their children.";
web[14] = "From men [who are] thy hand, O LORD, from men of the world, [who have] their portion in [this] life, and whose belly thou fillest with thy hid [treasure]: they are full of children, and leave the rest of their [substance] to their babes.";
hnv[14] = "From men by your hand, LORD, From men of the world, whose portion is in this life. You fill the belly of your cherished ones. Your sons have plenty, And they store up wealth for their children.";
vul[14] = "[Vulgate 16:14] a viris manus tuae Domine qui mortui sunt in profundo quorum pars in vita et quorum de absconditis tuis replesti ventrem qui satiabuntur filiis et dimittent reliquias suas parvulis eorum";
kjv[15] = "As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.";
rsv[15] = "As for me, I shall behold thy face in righteousness; when I awake, I shall be satisfied with beholding thy form.";
asv[15] = "As for me, I shall behold thy face in righteousness; I shall be satisfied, when I awake, with [beholding] thy form. ";
yng[15] = "I -- in righteousness, I see Thy face; I am satisfied, in awaking, [with] Thy form!";
dby[15] = "As for me, I will behold thy face in righteousness; I shall be satisfied, when I awake, with thy likeness.";
web[15] = "As for me, I shall behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.";
hnv[15] = "As for me, I shall see your face in righteousness; I shall be satisfied, when I awake, with seeing your form. ";
vul[15] = "[Vulgate 16:15] ego in iustitia videbo faciem tuam implebor cum evigilavero similitudine tua";
csb[1] = "LORD, hear a just cause; pay attention to my cry; listen to my prayer -- from lips free of deceit.";
csb[2] = "Let my vindication come from you, for you see what is right.";
csb[3] = "You have tested my heart; you have examined me at night. You have tried me and found nothing evil; I have determined that my mouth will not sin.";
csb[4] = "Concerning what people do: by the words from your lips I have avoided the ways of the violent.";
csb[5] = "My steps are on your paths; my feet have not slipped.";
csb[6] = "I call on you, God, because you will answer me; listen closely to me; hear what I say.";
csb[7] = "Display the wonders of your faithful love, Savior of all who seek refuge from those who rebel against your right hand.";
csb[8] = "Protect me as the pupil of your eye; hide me in the shadow of your wings";
csb[9] = "from the wicked who treat me violently, my deadly enemies who surround me.";
csb[10] = "They are uncaring; their mouths speak arrogantly.";
csb[11] = "They advance against me; now they surround me. They are determined to throw me to the ground.";
csb[12] = "They are like a lion eager to tear, like a young lion lurking in ambush.";
csb[13] = "Rise up, LORD! Confront him; bring him down. With your sword, save me from the wicked.";
csb[14] = "With your hand, LORD, save me from men, from men of the world whose portion is in this life: You fill their bellies with what you have in store; their sons are satisfied, and they leave their surplus to their children.";
csb[15] = "But I will see your face in righteousness; when I awake, I will be satisfied with your presence.";
</script>
