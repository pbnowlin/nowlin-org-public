kjv[1] = "[[To the chief Musician, Altaschith, Michtam of David.]] Do ye indeed speak righteousness, O congregation? do ye judge uprightly, O ye sons of men?";
rsv[1] = "To the choirmaster: according to Do Not Destroy. A Miktam of David. Do you indeed decree what is right, you gods? Do you judge the sons of men uprightly?";
asv[1] = "For the Chief Musician; [set to] Al-tashheth. [A Psalm] of David. Michtam. Do ye indeed in silence speak righteousness? Do ye judge uprightly, O ye sons of men? ";
yng[1] = "To the Overseer. -- `Destroy not.\' -- A secret treasure, by David. Is it true, O dumb one, righteously ye speak? Uprightly ye judge, O sons of men?";
dby[1] = "{To the chief Musician. \'Destroy not.\' Of David. Michtam.} Is righteousness indeed silent? Do ye speak it? Do ye judge with equity, ye sons of men?";
web[1] = "To the chief Musician, Al-taschith, Michtam of David. Do ye indeed speak righteousness, O congregation? do ye judge uprightly, O ye sons of men?";
hnv[1] = "For the Chief Musician. To the tune &quot;Do Not Destroy.&quot; A miktam by David. Do you indeed speak righteousness, silent ones? Do you judge blamelessly, you sons of men?";
vul[1] = "[Vulgate 57:1] victori ut non disperdas David humilem et simplicem [Vulgate 57:2] si vere utique iustitiam loquimini recta iudicate filii hominum";
kjv[2] = "Yea, in heart ye work wickedness; ye weigh the violence of your hands in the earth.";
rsv[2] = "Nay, in your hearts you devise wrongs; your hands deal out violence on earth.";
asv[2] = "Nay, in heart ye work wickedness; Ye weigh out the violence of your hands in the earth. ";
yng[2] = "Even in heart ye work iniquities, In the land the violence of your hands ye ponder.";
dby[2] = "Yea, in heart ye work wickedness; ye weigh out the violence of your hands in the earth.";
web[2] = "Yes, in heart ye work wickedness; ye weigh the violence of your hands in the earth.";
hnv[2] = "No, in your heart you plot injustice. You measure out the violence of your hands in the eretz.";
vul[2] = "[Vulgate 57:3] etenim in corde iniquitates operamini in terra iniquitatis manus vestras adpendite";
kjv[3] = "The wicked are estranged from the womb: they go astray as soon as they be born, speaking lies.";
rsv[3] = "The wicked go astray from the womb, they err from their birth, speaking lies.";
asv[3] = "The wicked are estranged from the womb: They go astray as soon as they are born, speaking lies. ";
yng[3] = "The wicked have been estranged from the womb, They have erred from the belly, speaking lies.";
dby[3] = "The wicked go astray from the womb; they err as soon as they are born, speaking lies.";
web[3] = "The wicked are estranged from their birth: they go astray as soon as they are born, speaking lies.";
hnv[3] = "The wicked go astray from the womb. They are wayward as soon as they are born, speaking lies.";
vul[3] = "[Vulgate 57:4] alienati sunt peccatores a vulva erraverunt ab utero loquentes mendacium";
kjv[4] = "Their poison [is] like the poison of a serpent: [they are] like the deaf adder [that] stoppeth her ear;";
rsv[4] = "They have venom like the venom of a serpent, like the deaf adder that stops its ear,";
asv[4] = "Their poison is like the poison of a serpent: [They are] like the deaf adder that stoppeth her ear, ";
yng[4] = "Their poison [is] as poison of a serpent, As a deaf asp shutting its ear,";
dby[4] = "Their poison is like the poison of a serpent: [they are] like the deaf adder which stoppeth her ear;";
web[4] = "Their poison [is] like the poison of a serpent: [they are] like the deaf adder [that] stoppeth her ear;";
hnv[4] = "Their poison is like the poison of a snake; Like a deaf cobra that stops its ear,";
vul[4] = "[Vulgate 57:5] furor eorum sicut furor serpentis sicut reguli surdi obturantis aurem suam";
kjv[5] = "Which will not hearken to the voice of charmers, charming never so wisely.";
rsv[5] = "so that it does not hear the voice of charmers or of the cunning enchanter.";
asv[5] = "Which hearkeneth not to the voice of charmers, Charming never so wisely. ";
yng[5] = "Which hearkeneth not to the voice of whisperers, A charmer of charms most skilful.";
dby[5] = "Which doth not hearken to the voice of enchanters, of one charming ever so wisely.";
web[5] = "Which will not hearken to the voice of charmers, charming never so wisely.";
hnv[5] = "Which doesn\'t listen to the voice of charmers, No matter how skillful the charmer may be.";
vul[5] = "[Vulgate 57:6] ut non audiat vocem murmurantium nec incantatoris incantationes callidas";
kjv[6] = "Break their teeth, O God, in their mouth: break out the great teeth of the young lions, O LORD.";
rsv[6] = "O God, break the teeth in their mouths; tear out the fangs of the young lions, O LORD!";
asv[6] = "Break their teeth, O God, in their mouth: Break out the great teeth of the young lions, O Jehovah. ";
yng[6] = "O God, break their teeth in their mouth, The jaw-teeth of young lions break down, O Jehovah.";
dby[6] = "O God, break their teeth in their mouth; break out the great teeth of the young lions, O Jehovah.";
web[6] = "Break their teeth, O God, in their mouth: break out the great teeth of the young lions, O LORD.";
hnv[6] = "Break their teeth, God, in their mouth. Break out the great teeth of the young lions, LORD.";
vul[6] = "[Vulgate 57:7] Deus excute dentes eorum ex ore eorum molares leonum confringe Domine";
kjv[7] = "Let them melt away as waters [which] run continually: [when] he bendeth [his bow to shoot] his arrows, let them be as cut in pieces.";
rsv[7] = "Let them vanish like water that runs away; like grass let them be trodden down and wither.";
asv[7] = "Let them melt away as water that runneth apace: When he aimeth his arrows, let them be as though they were cut off. ";
yng[7] = "They are melted as waters, They go up and down for themselves, His arrow proceedeth as they cut themselves off.";
dby[7] = "Let them melt away as waters that flow off; when he aimeth his arrows, let them be as blunted:";
web[7] = "Let them melt away as waters [which] run continually: [when] he bendeth [his bow to shoot] his arrows, let them be as cut in pieces.";
hnv[7] = "Let them vanish as water that flows away. When they draw the bow, let their arrows be made blunt.";
vul[7] = "[Vulgate 57:8] dissolvantur quasi aquae quae defluent intendet arcum suum donec conterantur";
kjv[8] = "As a snail [which] melteth, let [every one of them] pass away: [like] the untimely birth of a woman, [that] they may not see the sun.";
rsv[8] = "Let them be like the snail which dissolves into slime, like the untimely birth that never sees the sun.";
asv[8] = " [Let them be] as a snail which melteth and passeth away, [Like] the untimely birth of a woman, that hath not seen the sun. ";
yng[8] = "As a snail that melteth he goeth on, [As] an untimely birth of a woman, They have not seen the sun.";
dby[8] = "Let them be as a snail that melteth as it passeth away; [like] the untimely birth of a woman, let them not see the sun.";
web[8] = "As a snail [which] melteth, let [every one of them] pass away: [like] the untimely birth of a woman, [that] they may not see the sun.";
hnv[8] = "Let them be like a snail which melts and passes away, Like the stillborn child, who has not seen the sun.";
vul[8] = "[Vulgate 57:9] quasi vermis tabefactus pertranseant quasi abortivum mulieris quod non vidit solem";
kjv[9] = "Before your pots can feel the thorns, he shall take them away as with a whirlwind, both living, and in [his] wrath.";
rsv[9] = "Sooner than your pots can feel the heat of thorns, whether green or ablaze, may he sweep them away!";
asv[9] = "Before your pots can feel the thorns, He will take them away with a whirlwind, the green and the burning alike. ";
yng[9] = "Before your pots discern the bramble, As well the raw as the heated He whirleth away.";
dby[9] = "Before your pots feel the thorns, green or burning, -- they shall be whirled away.";
web[9] = "Before your pots can feel the thorns, he shall take them away as with a whirlwind, both living, and in [his] wrath.";
hnv[9] = "Before your pots can feel the heat of the thorns, He will sweep away the green and the burning alike.";
vul[9] = "[Vulgate 57:10] antequam crescant spinae vestrae in ramnum quasi viventes quasi in ira tempestas rapiet eas";
kjv[10] = "The righteous shall rejoice when he seeth the vengeance: he shall wash his feet in the blood of the wicked.";
rsv[10] = "The righteous will rejoice when he sees the vengeance; he will bathe his feet in the blood of the wicked.";
asv[10] = "The righteous shall rejoice when he seeth the vengeance: He shall wash his feet in the blood of the wicked; ";
yng[10] = "The righteous rejoiceth that he hath seen vengeance, His steps he washeth in the blood of the wicked.";
dby[10] = "The righteous shall rejoice when he seeth the vengeance; he shall wash his footsteps in the blood of the wicked:";
web[10] = "The righteous shall rejoice when he seeth the vengeance: he shall wash his feet in the blood of the wicked.";
hnv[10] = "The righteous shall rejoice when he sees the vengeance. He shall wash his feet in the blood of the wicked;";
vul[10] = "[Vulgate 57:11] laetabitur iustus cum viderit ultionem pedes suos lavabit in sanguinem impii";
kjv[11] = "So that a man shall say, Verily [there is] a reward for the righteous: verily he is a God that judgeth in the earth.";
rsv[11] = "Men will say, &quot;Surely there is a reward for the righteous; surely there is a God who judges on earth.&quot;";
asv[11] = "So that men shall say, Verily there is a reward for the righteous: Verily there is a God that judgeth in the earth. ";
yng[11] = "And man saith: `Surely fruit [is] for the righteous: Surely there is a God judging in the earth!\'";
dby[11] = "And men shall say, Verily there is fruit for the righteous; verily there is a God that judgeth in the earth.";
web[11] = "So that a man shall say, Verily [there is] a reward for the righteous: verily he is a God that judgeth in the earth.";
hnv[11] = "So that men shall say, &quot;Most assuredly there is a reward for the righteous. Most assuredly there is a God who judges the eretz.&quot; ";
vul[11] = "[Vulgate 57:12] et dicet homo vere fructus est iusto vere est Deus iudicans in terra";
csb[1] = "Do you really speak righteously, you mighty ones? Do you judge people fairly?";
csb[2] = "No, you practice injustice in your hearts; with your hands you weigh out violence in the land.";
csb[3] = "The wicked go astray from the womb; liars wander about from birth.";
csb[4] = "They have venom like the venom of a snake, like the deaf cobra that stops up its ears,";
csb[5] = "that does not listen to the sound of the charmers who skillfully weave spells.";
csb[6] = "God, knock the teeth out of their mouths; LORD, tear out the young lions\' fangs.";
csb[7] = "May they vanish like water that flows by; may they aim their blunted arrows.";
csb[8] = "Like a slug that moves along in slime, like a woman\'s miscarried child, may they not see the sun.";
csb[9] = "Before your pots can feel the heat of the thorns -- whether green or burning -- he will sweep them away.";
csb[10] = "The righteous one will rejoice when he sees the retribution; he will wash his feet in the blood of the wicked.";
csb[11] = "Then people will say, &quot;Yes, there is a reward for the righteous! There is a God who judges on earth! &quot;";
</script>
