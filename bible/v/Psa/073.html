asv[2] = "But as for me, my feet were almost gone; My steps had well nigh slipped. ";

dby[2] = "But as for me, my feet were almost gone, my steps had well nigh slipped;";
web[2] = "But as for me, my feet were almost gone; my steps had well nigh slipped.";
hnv[2] = "But as for me, my feet were almost gone. My steps had nearly slipped.";
vul[2] = "[Vulgate 72:2] mei autem paene vacillaverunt pedes paene effusi sunt gressus mei";

web[3] = "For I was envious at the foolish, [when] I saw the prosperity of the wicked.";
hnv[3] = "For I was envious of the arrogant, When I saw the prosperity of the wicked.";
vul[3] = "[Vulgate 72:3] quia aemulatus sum contra iniquos pacem impiorum videns";

hnv[6] = "Therefore pride is like a chain around their neck. Violence covers them like a garment.";
vul[6] = "[Vulgate 72:6] ideo nutriti sunt ad superbiam circumdederunt iniquitatem sibi";

rsv[7] = "Their eyes swell out with fatness, their hearts overflow with follies.";

web[8] = "They are corrupt, and speak wickedly [concerning] oppression: they speak loftily.";
hnv[8] = "They scoff and speak with malice. In arrogance, they threaten oppression.";
vul[8] = "[Vulgate 72:8] inriserunt et locuti sunt in malitia calumniam de excelso loquentes";

hnv[10] = "Therefore their people return to them, And they drink up waters of abundance.";

dby[11] = "And they say, How can God know, and is there knowledge in the Most High?";
web[11] = "And they say, How doth God know? and is there knowledge in the Most High?";

hnv[13] = "Surely in vain I have cleansed my heart, And washed my hands in innocence,";

hnv[17] = "Until I entered God\'s sanctuary, And considered their latter end.";

dby[18] = "Truly thou settest them in slippery places, thou castest them down in ruins.";
web[18] = "Surely thou didst set them in slippery places: thou didst cast them down into destruction.";
hnv[18] = "Surely you set them in slippery places. You throw them down to destruction.";
vul[18] = "[Vulgate 72:18] verumtamen in lubrico posuisti eos deiecisti eos ad interitum";

dby[20] = "As a dream, when one awaketh, wilt thou, Lord, on arising despise their image.";

hnv[20] = "As a dream when one wakes up, So, Lord, when you awake, you will despise their fantasies.";

dby[23] = "Nevertheless I am continually with thee: thou hast holden my right hand;";
web[23] = "Nevertheless I [am] continually with thee: thou hast held [me] by my right hand.";
hnv[23] = "Nevertheless, I am continually with you. You have held my right hand.";

yng[25] = "Whom have I in the heavens? And with Thee none I have desired in earth.";
dby[25] = "Whom have I in the heavens? and there is none upon earth I desire beside thee.";

hnv[25] = "Who do I have in heaven? There is no one on eretz who I desire besides you.";

dby[26] = "My flesh and my heart faileth: God is the rock of my heart and my portion for ever.";
web[26] = "My flesh and my heart faileth: [but] God [is] the strength of my heart, and my portion for ever.";
hnv[26] = "My flesh and my heart fails, But God is the strength of my heart and my portion forever.";

dby[27] = "For behold, they that are far from thee shall perish; thou destroyest every one that goeth a whoring from thee.";
web[27] = "For lo, they that are far from thee shall perish: thou hast destroyed all them that go astray from thee.";
hnv[27] = "For, behold, those who are far from you shall perish. You have destroyed all those who are unfaithful to you.";
vul[27] = "[Vulgate 72:27] quia ecce qui elongant se a te peribunt perdidisti omnem fornicantem a te";

rsv[28] = "But for me it is good to be near God; I have made the Lord GOD my refuge, that I may tell of all thy works.";
asv[28] = "But it is good for me to draw near unto God: I have made the Lord Jehovah my refuge, That I may tell of all thy works. ";
yng[28] = "And I -- nearness of God to me [is] good, I have placed in the Lord Jehovah my refuge, To recount all Thy works!";
dby[28] = "But as for me, it is good for me to draw near to God: I have put my trust in the Lord Jehovah, that I may declare all thy works.";

hnv[28] = "But it is good for me to come close to God. I have made the Lord GOD my refuge, That I may tell of all your works. ";
vul[28] = "[Vulgate 72:28] mihi autem adpropinquare Deo bonum est posui in Domino Deo spem meam ut narrem omnes adnuntiationes tuas";
csb[1] = "God is indeed good to Israel, to the pure in heart.";
csb[2] = "But as for me, my feet almost slipped; my steps nearly went astray.";
csb[3] = "For I envied the arrogant; I saw the prosperity of the wicked.";
csb[4] = "They have an easy time until they die, and their bodies are well fed.";
csb[5] = "They are not in trouble like others; they are not afflicted like most people.";
csb[6] = "Therefore, pride is their necklace, and violence covers them like a garment.";
csb[7] = "Their eyes bulge out from fatness; the imaginations of their hearts run wild.";
csb[8] = "They mock, and they speak maliciously; they arrogantly threaten oppression.";
csb[9] = "They set their mouths against heaven, and their tongues strut across the earth.";
csb[10] = "Therefore his people turn to them and drink in their overflowing words.";
csb[11] = "The wicked say, &quot;How can God know? Does the Most High know everything? &quot;";
csb[12] = "Look at them -- the wicked! They are always at ease, and they increase their wealth.";
csb[13] = "Did I purify my heart and wash my hands in innocence for nothing?";
csb[14] = "For I am afflicted all day long and punished every morning.";
csb[15] = "If I had decided to say these things aloud, I would have betrayed your people.";
csb[16] = "When I tried to understand all this, it seemed hopeless";
csb[17] = "until I entered God\'s sanctuary. Then I understood their destiny.";
csb[18] = "Indeed, you put them in slippery places; you make them fall into ruin.";
csb[19] = "How suddenly they become a desolation! They come to an end, swept away by terrors.";
csb[20] = "Like one waking from a dream, Lord, when arising, you will despise their image.";
csb[21] = "When I became embittered and my innermost being was wounded,";
csb[22] = "I was stupid and didn\'t understand; I was an unthinking animal toward you.";
csb[23] = "Yet I am always with you; you hold my right hand.";
csb[24] = "You guide me with your counsel, and afterward you will take me up in glory.";
csb[25] = "Who do I have in heaven but you? And I desire nothing on earth but you.";
csb[26] = "My flesh and my heart may fail, but God is the strength of my heart, my portion forever.";
csb[27] = "Those far from you will certainly perish; you destroy all who are unfaithful to you.";
csb[28] = "But as for me, God\'s presence is my good. I have made the Lord GOD my refuge, so I can tell about all you do.";
