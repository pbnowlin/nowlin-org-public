kjv[1] = "[[To the chief Musician, [even] to Jeduthun, A Psalm of David.]] I said, I will take heed to my ways, that I sin not with my tongue: I will keep my mouth with a bridle, while the wicked is before me.";
rsv[1] = "To the choirmaster: to Jeduthun. A Psalm of David. I said, &quot;I will guard my ways, that I may not sin with my tongue; I will bridle my mouth, so long as the wicked are in my presence.&quot;";
asv[1] = "[For the Chief Musician, for Jeduthun. A Psalm of David.] I said, I will take heed to my ways, That I sin not with my tongue: I will keep my mouth with a bridle, While the wicked is before me. ";
yng[1] = "To the Overseer, to Jeduthun. -- A Psalm of David. I have said, `I observe my ways, Against sinning with my tongue, I keep for my mouth a curb, while the wicked [is] before me.\'";
dby[1] = "{To the chief Musician, to Jeduthun. A Psalm of David.} I said, I will take heed to my ways, that I sin not with my tongue: I will keep my mouth with a muzzle, while the wicked is before me.";
web[1] = "To the chief Musician, [even] to Jeduthun, A Psalm of David. I said, I will take heed to my ways, that I sin not with my tongue: I will keep my mouth with a bridle, while the wicked is before me.";
hnv[1] = "For the Chief Musician. For Yedutun. A Psalm by David. I said, &quot;I will watch my ways, so that I don\'t sin with my tongue. I will keep my mouth with a bridle while the wicked is before me.&quot;";
vul[1] = "[Vulgate 38:1] pro victoria Idithun canticum David [Vulgate 38:2] dixi custodiam vias meas ne peccem in lingua mea custodiam os meum silentio donec est impius contra me";
kjv[2] = "I was dumb with silence, I held my peace, [even] from good; and my sorrow was stirred.";
rsv[2] = "I was dumb and silent, I held my peace to no avail; my distress grew worse,";
asv[2] = "I was dumb with silence, I held my peace, even from good; And my sorrow was stirred. ";
yng[2] = "I was dumb [with] silence, I kept silent from good, and my pain is excited.";
dby[2] = "I was dumb with silence, I held my peace from good; and my sorrow was stirred.";
web[2] = "I was dumb with silence, I held my peace, [even] from good; and my sorrow was stirred.";
hnv[2] = "I was mute with silence. I held my shalom, even from good. My sorrow was stirred.";
vul[2] = "[Vulgate 38:3] obmutui silentio tacui de bono et dolor meus conturbatus est";
kjv[3] = "My heart was hot within me, while I was musing the fire burned: [then] spake I with my tongue,";
rsv[3] = "my heart became hot within me. As I mused, the fire burned; then I spoke with my tongue:";
asv[3] = "My heart was hot within me; While I was musing the fire burned; [Then] spake I with my tongue: ";
yng[3] = "Hot [is] my heart within me, In my meditating doth the fire burn, I have spoken with my tongue.";
dby[3] = "My heart burned within me; the fire was kindled in my musing: I spoke with my tongue,";
web[3] = "My heart was hot within me, while I was musing the fire burned: [then] I spoke with my tongue.";
hnv[3] = "My heart was hot within me. While I meditated, the fire burned: I spoke with my tongue:";
vul[3] = "[Vulgate 38:4] incaluit cor meum in medio mei in meditatione mea incensus sum igni";
kjv[4] = "LORD, make me to know mine end, and the measure of my days, what it [is; that] I may know how frail I [am].";
rsv[4] = "&quot;LORD, let me know my end, and what is the measure of my days; let me know how fleeting my life is!";
asv[4] = "Jehovah, make me to know mine end, And the measure of my days, what it is; Let me know how frail I am. ";
yng[4] = "`Cause me to know, O Jehovah, mine end, And the measure of my days -- what it [is],\' I know how frail I [am].";
dby[4] = "Make me to know, Jehovah, mine end, and the measure of my days, what it is: I shall know how frail I am.";
web[4] = "LORD, make me to know my end, and the measure of my days, what it [is]; [that] I may know how frail I [am].";
hnv[4] = "&quot;LORD, show me my end, What is the measure of my days. Let me know how frail I am.";
vul[4] = "[Vulgate 38:5] locutus sum lingua mea ostende mihi Domine finem meum et mensuram dierum meorum quae sit ut sciam quid mihi desit";
kjv[5] = "Behold, thou hast made my days [as] an handbreadth; and mine age [is] as nothing before thee: verily every man at his best state [is] altogether vanity. Selah.";
rsv[5] = "Behold, thou hast made my days a few handbreadths, and my lifetime is as nothing in thy sight. Surely every man stands as a mere breath! [Selah]";
asv[5] = "Behold, thou hast made my days [as] handbreadths; And my life-time is as nothing before thee: Surely every man at his best estate is altogether vanity. [Selah";
yng[5] = "Lo, handbreadths Thou hast made my days, And mine age [is] as nothing before Thee, Only, all vanity [is] every man set up. Selah.";
dby[5] = "Behold, thou hast made my days [as] hand-breadths, and my lifetime is as nothing before thee; verily, every man, [even] the high placed, is altogether vanity. Selah.";
web[5] = "Behold, thou hast made my days [as] a hand-breadth; and my age [is] as nothing before thee: verily every man at his best state [is] altogether vanity. Selah.";
hnv[5] = "Behold, you have made my days handbreadths. My lifetime is as nothing before you. Surely every man stands as a breath.&quot; Selah.";
vul[5] = "[Vulgate 38:6] ecce breves posuisti dies meos et vita mea quasi non sit in conspectu tuo omnia enim vanitas omnis homo stans semper";
kjv[6] = "Surely every man walketh in a vain shew: surely they are disquieted in vain: he heapeth up [riches], and knoweth not who shall gather them.";
rsv[6] = "Surely man goes about as a shadow! Surely for nought are they in turmoil; man heaps up, and knows not who will gather!";
asv[6] = "Surely every man walketh in a vain show; Surely they are disquieted in vain: He heapeth up [riches], and knoweth not who shall gather them. ";
yng[6] = "Only, in an image doth each walk habitually, Only, [in] vain, they are disquieted, He heapeth up and knoweth not who gathereth them.";
dby[6] = "Verily, man walketh in a vain show; verily they are disquieted in vain; he heapeth up [riches], and knoweth not who shall gather them.";
web[6] = "Surely every man walketh in a vain show: surely they are disquieted in vain: he heapeth up [riches], and knoweth not who shall gather them.";
hnv[6] = "&quot;Surely every man walks like a shadow. Surely they busy themselves in vain. He heaps up, and doesn\'t know who shall gather.";
vul[6] = "[Vulgate 38:7] tantum in imagine ambulat homo tantum frustra turbatur congregat et ignorat cui dimittat ea";
kjv[7] = "And now, Lord, what wait I for? my hope [is] in thee.";
rsv[7] = "&quot;And now, Lord, for what do I wait? My hope is in thee.";
asv[7] = "And now, Lord, what wait I for? My hope is in thee. ";
yng[7] = "And, now, what have I expected? O Lord, my hope -- it [is] of Thee.";
dby[7] = "And now, what wait I for, Lord? my hope is in thee.";
web[7] = "And now, Lord, what wait I for? my hope [is] in thee.";
hnv[7] = "Now, Lord, what do I wait for? My hope is in you.";
vul[7] = "[Vulgate 38:8] nunc ergo quid expecto Domine praestolatio mea tu es";
kjv[8] = "Deliver me from all my transgressions: make me not the reproach of the foolish.";
rsv[8] = "Deliver me from all my transgressions. Make me not the scorn of the fool!";
asv[8] = "Deliver me from all my transgressions: Make me not the reproach of the foolish. ";
yng[8] = "From all my transgressions deliver me, A reproach of the fool make me not.";
dby[8] = "Deliver me from all my transgressions; make me not the reproach of the foolish.";
web[8] = "Deliver me from all my transgressions: make me not the reproach of the foolish.";
hnv[8] = "Deliver me from all my transgressions. Don\'t make me the reproach of the foolish.";
vul[8] = "[Vulgate 38:9] ab omnibus iniquitatibus meis libera me obprobrium stulto ne ponas me";
kjv[9] = "I was dumb, I opened not my mouth; because thou didst [it].";
rsv[9] = "I am dumb, I do not open my mouth; for it is thou who hast done it.";
asv[9] = "I was dumb, I opened not my mouth; Because thou didst it. ";
yng[9] = "I have been dumb, I open not my mouth, Because Thou -- Thou hast done [it].";
dby[9] = "I was dumb, I opened not my mouth; for *thou* hast done [it].";
web[9] = "I was dumb, I opened not my mouth; because thou didst [it].";
hnv[9] = "I was mute. I didn\'t open my mouth, Because you did it.";
vul[9] = "[Vulgate 38:10] obmutui non aperiam os meum quia tu fecisti";
kjv[10] = "Remove thy stroke away from me: I am consumed by the blow of thine hand.";
rsv[10] = "Remove thy stroke from me; I am spent by the blows of thy hand.";
asv[10] = "Remove thy stroke away from me: I am consumed by the blow of thy hand. ";
yng[10] = "Turn aside from off me Thy stroke, From the striving of Thy hand I have been consumed.";
dby[10] = "Remove thy stroke away from me: I am consumed by the blow of thy hand.";
web[10] = "Remove thy stroke away from me; I am consumed by the blow of thy hand.";
hnv[10] = "Remove your scourge away from me. I am overcome by the blow of your hand.";
vul[10] = "[Vulgate 38:11] tolle a me plagas tuas";
kjv[11] = "When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man [is] vanity. Selah.";
rsv[11] = "When thou dost chasten man with rebukes for sin, thou dost consume like a moth what is dear to him; surely every man is a mere breath! [Selah]";
asv[11] = "When thou with rebukes dost correct man for iniquity, Thou makest his beauty to consume away like a moth: Surely every man is vanity. [Selah";
yng[11] = "With reproofs against iniquity, Thou hast corrected man, And dost waste as a moth his desirableness, Only, vanity [is] every man. Selah.";
dby[11] = "When thou with rebukes dost correct a man for iniquity, thou makest his beauty to consume away like a moth: surely, every man is vanity. Selah.";
web[11] = "When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man [is] vanity. Selah.";
hnv[11] = "When you rebuke and correct man for iniquity, You consume his wealth like a moth. Surely every man is but a breath.&quot; Selah.";
vul[11] = "[Vulgate 38:12] a contentione manus tuae ego consumptus sum in increpationibus pro iniquitate corripuisti virum et posuisti quasi tineam desiderabilia eius verumtamen vanitas omnis homo semper";
kjv[12] = "Hear my prayer, O LORD, and give ear unto my cry; hold not thy peace at my tears: for I [am] a stranger with thee, [and] a sojourner, as all my fathers [were].";
rsv[12] = "&quot;Hear my prayer, O LORD, and give ear to my cry; hold not thy peace at my tears! For I am thy passing guest, a sojourner, like all my fathers.";
asv[12] = "Hear my prayer, O Jehovah, and give ear unto my cry; Hold not thy peace at my tears: For I am a stranger with thee, A sojourner, as all my fathers were. ";
yng[12] = "Hear my prayer, O Jehovah, And [to] my cry give ear, Unto my tear be not silent, For a sojourner I [am] with Thee, A settler like all my fathers.";
dby[12] = "Hear my prayer, Jehovah, and give ear unto my cry; be not silent at my tears: for I am a stranger with thee, a sojourner, like all my fathers.";
web[12] = "Hear my prayer, O LORD, and give ear to my cry; hold not thy peace at my tears: for I [am] a stranger with thee, [and] a sojourner, as all my fathers [were].";
hnv[12] = "&quot;Hear my prayer, LORD, and give ear to my cry. Don\'t be silent at my tears. For I am a stranger with you, A foreigner, as all my fathers were.";
vul[12] = "[Vulgate 38:13] audi orationem meam Domine et clamorem meum exaudi ad lacrimam meam ne obsurdescas quia advena ego sum apud te et peregrinus sicut omnes patres mei";
kjv[13] = "O spare me, that I may recover strength, before I go hence, and be no more.";
rsv[13] = "Look away from me, that I may know gladness, before I depart and be no more!&quot;";
asv[13] = "Oh spare me, that I may recover strength, Before I go hence, and be no more. ";
yng[13] = "Look from me, and I brighten up before I go and am not!";
dby[13] = "Look away from me, and let me recover strength, before I go hence and be no more.";
web[13] = "O spare me, that I may recover strength, before I go hence, and be no more.";
hnv[13] = "Oh spare me, that I may recover strength, Before I go away, and be no more.&quot; ";
vul[13] = "[Vulgate 38:14] parce mihi ut rideam antequam vadam et non subsistam";
csb[1] = "I said, &quot;I will guard my ways so that I may not sin with my tongue; I will guard my mouth with a muzzle as long as the wicked are in my presence.&quot;";
csb[2] = "I was speechless and quiet; I kept silent, even from speaking good, and my pain intensified.";
csb[3] = "My heart grew hot within me; as I mused, a fire burned. I spoke with my tongue:";
csb[4] = "&quot;LORD, make me aware of my end and the number of my days so that I will know how short-lived I am.";
csb[5] = "&quot;In fact, you have made my days just inches long, and my life span is as nothing to you. Yes, every human being stands as only a vapor. Selah";
csb[6] = "&quot;Yes, a person goes about like a mere shadow. Indeed, they rush around in vain, gathering possessions without knowing who will get them.";
csb[7] = "&quot;Now, Lord, what do I wait for? My hope is in you.";
csb[8] = "&quot;Rescue me from all my transgressions; do not make me the taunt of fools.";
csb[9] = "&quot;I am speechless; I do not open my mouth because of what you have done.";
csb[10] = "&quot;Remove your torment from me. Because of the force of your hand I am finished.";
csb[11] = "&quot;You discipline a person with punishment for iniquity, consuming like a moth what is precious to him; yes, every human being is only a vapor. Selah";
csb[12] = "&quot;Hear my prayer, LORD, and listen to my cry for help; do not be silent at my tears. For I am here with you as an alien, a temporary resident like all my ancestors.";
csb[13] = "&quot;Turn your angry gaze from me so that I may be cheered up before I die and am gone.&quot;";
</script>
