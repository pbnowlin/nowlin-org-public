kjv[1] = "[[To the chief Musician upon Muthlabben, A Psalm of David.]] I will praise [thee], O LORD, with my whole heart; I will shew forth all thy marvellous works.";
rsv[1] = "To the choirmaster: according to Muth-labben. A Psalm of David. I will give thanks to the LORD with my whole heart; I will tell of all thy wonderful deeds.";
asv[1] = "[For the Chief Musician; set to Muth-labben. A Psalm of David.] I will give thanks unto Jehovah with my whole heart; I will show forth all thy marvellous works. ";
yng[1] = "To the Overseer, `On the Death of Labben.\' -- A Psalm of David. I confess, O Jehovah, with all my heart, I recount all Thy wonders,";
dby[1] = "{To the chief Musician. Upon Muthlabben. A Psalm of David.} I will praise Jehovah with my whole heart; I will recount all thy marvellous works.";
web[1] = "To the chief Musician upon Muthlabben, A Psalm of David. I will praise [thee], O LORD, with my whole heart; I will show forth all thy wonderful works.";
hnv[1] = "For the Chief Musician. Set to &quot;The Death of the Son.&quot; A Psalm by David. I will give thanks to the LORD with my whole heart. I will tell of all your marvelous works.";
vul[1] = "victori pro morte filii canticum David [Vulgate 9:2] confitebor Domino in toto corde meo narrabo omnia mirabilia tua";
kjv[2] = "I will be glad and rejoice in thee: I will sing praise to thy name, O thou most High.";
rsv[2] = "I will be glad and exult in thee, I will sing praise to thy name, O Most High.";
asv[2] = "I will be glad and exult in thee; I will sing praise to thy name, O thou Most High. ";
yng[2] = "I rejoice and exult in Thee, I praise Thy Name, O Most High.";
dby[2] = "I will be glad and rejoice in thee; I will sing forth thy name, O Most High.";
web[2] = "I will be glad and rejoice in thee: I will sing praise to thy name, O thou most High.";
hnv[2] = "I will be glad and rejoice in you. I will sing praise to your name, O Elyon.";
vul[2] = "[Vulgate 9:3] laetabor et gaudebo in te canam nomini tuo Altissimi";
kjv[3] = "When mine enemies are turned back, they shall fall and perish at thy presence.";
rsv[3] = "When my enemies turned back, they stumbled and perished before thee.";
asv[3] = "When mine enemies turn back, They stumble and perish at thy presence. ";
yng[3] = "In mine enemies turning backward, they stumble and perish from Thy face.";
dby[3] = "When mine enemies turned back, they stumbled and perished at thy presence:";
web[3] = "When my enemies are turned back, they shall fall and perish at thy presence.";
hnv[3] = "When my enemies turn back, They stumble and perish in your presence.";
vul[3] = "[Vulgate 9:4] cum ceciderint inimici mei retrorsum et corruerint et perierint a facie tua";
kjv[4] = "For thou hast maintained my right and my cause; thou satest in the throne judging right.";
rsv[4] = "For thou hast maintained my just cause; thou hast sat on the throne giving righteous judgment.";
asv[4] = "For thou hast maintained my right and my cause; Thou sittest in the throne judging righteously. ";
yng[4] = "For Thou hast done my judgment and my right. Thou hast sat on a throne, A judge of righteousness.";
dby[4] = "For thou hast maintained my right and my cause. Thou sittest on the throne, judging righteously.";
web[4] = "For thou hast maintained my right and my cause; thou sattest on the throne judging right.";
hnv[4] = "For you have maintained my right and my cause. You sit on the throne judging righteously.";
vul[4] = "[Vulgate 9:5] fecisti enim iudicium meum et causam meam sedisti super solium iudex iustitiae";
kjv[5] = "Thou hast rebuked the heathen, thou hast destroyed the wicked, thou hast put out their name for ever and ever.";
rsv[5] = "Thou hast rebuked the nations, thou hast destroyed the wicked; thou hast blotted out their name for ever and ever.";
asv[5] = "Thou hast rebuked the nations, thou hast destroyed the wicked; Thou hast blotted out their name for ever and ever. ";
yng[5] = "Thou hast rebuked nations, Thou hast destroyed the wicked, Their name Thou hast blotted out to the age and for ever.";
dby[5] = "Thou hast rebuked the nations, thou hast destroyed the wicked; thou hast put out their name for ever and ever.";
web[5] = "Thou hast rebuked the heathen, thou hast destroyed the wicked, thou hast put out their name for ever and ever.";
hnv[5] = "You have rebuked the nations. You have destroyed the wicked. You have blotted out their name forever and ever.";
vul[5] = "[Vulgate 9:6] increpuisti gentes periit impius nomen eorum delisti in sempiternum et iugiter";
kjv[6] = "O thou enemy, destructions are come to a perpetual end: and thou hast destroyed cities; their memorial is perished with them.";
rsv[6] = "The enemy have vanished in everlasting ruins; their cities thou hast rooted out; the very memory of them has perished.";
asv[6] = "The enemy are come to an end, they are desolate for ever; And the cities which thou hast overthrown, The very remembrance of them is perished. ";
yng[6] = "O thou Enemy, Finished have been destructions for ever, As to cities thou hast plucked up, Perished hath their memorial with them.";
dby[6] = "O enemy! destructions are ended for ever. -- Thou hast also destroyed cities, even the remembrance of them hath perished.";
web[6] = "O thou enemy, destructions are come to a perpetual end: and thou hast destroyed cities; their memorial hath perished with them.";
hnv[6] = "The enemy is overtaken by endless ruin. The very memory of the cities which you have overthrown has perished.";
vul[6] = "[Vulgate 9:7] conpletae sunt solitudines in finem et civitates subvertisti periit memoria eorum cum ipsis";
kjv[7] = "But the LORD shall endure for ever: he hath prepared his throne for judgment.";
rsv[7] = "But the LORD sits enthroned for ever, he has established his throne for judgment;";
asv[7] = "But Jehovah sitteth [as king] for ever: He hath prepared his throne for judgment; ";
yng[7] = "And Jehovah to the age abideth, He is preparing for judgment His throne.";
dby[7] = "But Jehovah sitteth for ever; he hath ordained his throne for judgment.";
web[7] = "But the LORD shall endure for ever: he hath prepared his throne for judgment.";
hnv[7] = "But the LORD reigns forever. He has prepared his throne for judgment.";
vul[7] = "[Vulgate 9:8] Dominus autem in sempiternum sedebit stabilivit ad iudicandum solium suum";
kjv[8] = "And he shall judge the world in righteousness, he shall minister judgment to the people in uprightness.";
rsv[8] = "and he judges the world with righteousness, he judges the peoples with equity.";
asv[8] = "And he will judge the world in righteousness, He will minister judgment to the peoples in uprightness. ";
yng[8] = "And He judgeth the world in righteousness, He judgeth the peoples in uprightness.";
dby[8] = "And it is he that will judge the world with righteousness; he shall execute judgment upon the peoples with equity.";
web[8] = "And he shall judge the world in righteousness, he shall minister judgment to the people in uprightness.";
hnv[8] = "He will judge the world in righteousness. He will administer judgment to the peoples in uprightness.";
vul[8] = "[Vulgate 9:9] et ipse iudicat orbem in iustitia iudicat populos in aequitatibus";
kjv[9] = "The LORD also will be a refuge for the oppressed, a refuge in times of trouble.";
rsv[9] = "The LORD is a stronghold for the oppressed, a stronghold in times of trouble.";
asv[9] = "Jehovah also will be a high tower for the oppressed, A high tower in times of trouble; ";
yng[9] = "And Jehovah is a tower for the bruised, A tower for times of adversity.";
dby[9] = "And Jehovah will be a refuge to the oppressed one, a refuge in times of distress.";
web[9] = "The LORD also will be a refuge for the oppressed, a refuge in times of trouble.";
hnv[9] = "The LORD will also be a high tower for the oppressed; A high tower in times of trouble.";
vul[9] = "[Vulgate 9:10] et erit Dominus elevatio oppresso elevatio oportuna in angustia";
kjv[10] = "And they that know thy name will put their trust in thee: for thou, LORD, hast not forsaken them that seek thee.";
rsv[10] = "And those who know thy name put their trust in thee, for thou, O LORD, hast not forsaken those who seek thee.";
asv[10] = "And they that know thy name will put their trust in thee; For thou, Jehovah, hast not forsaken them that seek thee. ";
yng[10] = "They trust in Thee who do know Thy name, For Thou hast not forsaken Those seeking Thee, O Jehovah.";
dby[10] = "And they that know thy name will confide in thee; for thou, Jehovah, hast not forsaken them that seek thee.";
web[10] = "And they that know thy name will put their trust in thee: for thou, LORD, hast not forsaken them that seek thee.";
hnv[10] = "Those who know your name will put their trust in you, For you, LORD, have not forsaken those who seek you.";
vul[10] = "[Vulgate 9:11] et confident in te qui noverunt nomen tuum quoniam non dereliquisti quaerentes te Domine";
kjv[11] = "Sing praises to the LORD, which dwelleth in Zion: declare among the people his doings.";
rsv[11] = "Sing praises to the LORD, who dwells in Zion! Tell among the peoples his deeds!";
asv[11] = "Sing praises to Jehovah, who dwelleth in Zion: Declare among the people his doings. ";
yng[11] = "Sing ye praise to Jehovah, inhabiting Zion, Declare ye among the peoples His acts,";
dby[11] = "Sing psalms to Jehovah who dwelleth in Zion; tell among the peoples his doings.";
web[11] = "Sing praises to the LORD, who dwelleth in Zion: declare among the people his doings.";
hnv[11] = "Sing praises to the LORD, who dwells in Tziyon, And declare among the people what he has done.";
vul[11] = "[Vulgate 9:12] cantate Domino habitatori Sion adnuntiate in populis commutationes eius";
kjv[12] = "When he maketh inquisition for blood, he remembereth them: he forgetteth not the cry of the humble.";
rsv[12] = "For he who avenges blood is mindful of them; he does not forget the cry of the afflicted.";
asv[12] = "For he that maketh inquisition for blood remembereth them; He forgetteth not the cry of the poor. ";
yng[12] = "For He who is seeking for blood Them hath remembered, He hath not forgotten the cry of the afflicted.";
dby[12] = "For when he maketh inquisition for blood, he remembereth them; the cry of the afflicted ones hath he not forgotten.";
web[12] = "When he maketh inquisition for blood, he remembereth them: he forgetteth not the cry of the humble.";
hnv[12] = "For he who avenges blood remembers them. He doesn\'t forget the cry of the afflicted.";
vul[12] = "[Vulgate 9:13] quoniam quaerens sanguinem eorum recordatus est nec oblitus est clamoris pauperum";
kjv[13] = "Have mercy upon me, O LORD; consider my trouble [which I suffer] of them that hate me, thou that liftest me up from the gates of death:";
rsv[13] = "Be gracious to me, O LORD! Behold what I suffer from those who hate me, O thou who liftest me up from the gates of death,";

yng[13] = "Favour me, O Jehovah, See mine affliction by those hating me, Thou who liftest me up from the gates of death,";
dby[13] = "Be gracious unto me, O Jehovah; consider mine affliction from them that hate me, lifting me up from the gates of death:";
web[13] = "Have mercy upon me, O LORD; consider my trouble [which I suffer] from them that hate me, thou that liftest me up from the gates of death:";
hnv[13] = "Have mercy on me, LORD. See my affliction by those who hate me, And lift me up from the gates of death;";
vul[13] = "[Vulgate 9:14] misertus est mei Dominus vidit adflictionem meam ex inimicis meis";
kjv[14] = "That I may shew forth all thy praise in the gates of the daughter of Zion: I will rejoice in thy salvation.";
rsv[14] = "that I may recount all thy praises, that in the gates of the daughter of Zion I may rejoice in thy deliverance.";
asv[14] = "That I may show forth all thy praise. In the gates of the daughter of Zion I will rejoice in thy salvation. ";
yng[14] = "So that I recount all Thy praise, In the gates of the daughter of Zion. I rejoice on Thy salvation.";
dby[14] = "That I may declare all thy praise in the gates of the daughter of Zion. I will be joyful in thy salvation.";
web[14] = "That I may show forth all thy praise in the gates of the daughter of Zion: I will rejoice in thy salvation.";
hnv[14] = "That I may show forth all your praise. In the gates of the daughter of Tziyon, I will rejoice in your salvation.";

kjv[15] = "The heathen are sunk down in the pit [that] they made: in the net which they hid is their own foot taken.";
rsv[15] = "The nations have sunk in the pit which they made; in the net which they hid has their own foot been caught.";
asv[15] = "The nations are sunk down in the pit that they made: In the net which they hid is their own foot taken. ";
yng[15] = "Sunk have nations in a pit they made, In a net that they hid hath their foot been captured.";
dby[15] = "The nations are sunk down in the pit [that] they made; in the net that they hid is their own foot taken.";
web[15] = "The heathen are sunk down in the pit [that] they made: in the net which they hid is their own foot taken.";
hnv[15] = "The nations have sunk down in the pit that they made; In the net which they hid, their own foot is taken.";

kjv[16] = "The LORD is known [by] the judgment [which] he executeth: the wicked is snared in the work of his own hands. Higgaion. Selah.";
rsv[16] = "The LORD has made himself known, he has executed judgment; the wicked are snared in the work of their own hands. [Higgaion. Selah]";
asv[16] = "Jehovah hath made himself known, he hath executed judgment: The wicked is snared in the work of his own hands. [Higgaion. Selah";
yng[16] = "Jehovah hath been known, Judgment He hath done, By a work of his hands Hath the wicked been snared. Meditation. Selah.";
dby[16] = "Jehovah is known [by] the judgment he hath executed: the wicked is ensnared in the work of his own hands. Higgaion. Selah.";
web[16] = "The LORD is known [by] the judgment [which] he executeth: the wicked is snared in the work of his own hands. Higgaion. Selah.";
hnv[16] = "The LORD has made himself known. He has executed judgment. The wicked is snared by the work of his own hands. Meditation. Selah.";
vul[16] = "[Vulgate 9:17] agnitus est Dominus iudicium faciens in opere manuum suarum corruit impius sonitu sempiterno";
kjv[17] = "The wicked shall be turned into hell, [and] all the nations that forget God.";
rsv[17] = "The wicked shall depart to Sheol, all the nations that forget God.";
asv[17] = "The wicked shall be turned back unto Sheol, Even all the nations that forget God. ";
yng[17] = "The wicked do turn back to Sheol, All nations forgetting God.";
dby[17] = "The wicked shall be turned into Sheol, all the nations that forget God.";
web[17] = "The wicked shall be turned into hell, [and] all the nations that forget God.";
hnv[17] = "The wicked shall be turned back to She\'ol, Even all the nations that forget God.";

rsv[18] = "For the needy shall not always be forgotten, and the hope of the poor shall not perish for ever.";

dby[18] = "For the needy one shall not be forgotten alway; the hope of the meek shall not perish for ever.";
web[18] = "For the needy shall not always be forgotten: the expectation of the poor shall [not] perish for ever.";
hnv[18] = "For the needy shall not always be forgotten, Nor the hope of the poor perish forever.";

kjv[19] = "Arise, O LORD; let not man prevail: let the heathen be judged in thy sight.";
rsv[19] = "Arise, O LORD! Let not man prevail; let the nations be judged before thee!";
asv[19] = "Arise, O Jehovah; let not man prevail: Let the nations be judged in thy sight. ";
yng[19] = "Rise, O Jehovah, let not man be strong, Let nations be judged before Thy face.";
dby[19] = "Arise, Jehovah; let not man prevail: let the nations be judged in thy sight.";
web[19] = "Arise, O LORD; let not man prevail: let the heathen be judged in thy sight.";
hnv[19] = "Arise, LORD! Don\'t let man prevail. Let the nations be judged in your sight.";

kjv[20] = "Put them in fear, O LORD: [that] the nations may know themselves [to be but] men. Selah.";
rsv[20] = "Put them in fear, O LORD! Let the nations know that they are but men! [Selah]";
asv[20] = "Put them in fear, O Jehovah: Let the nations know themselves to be but men. [Selah";
yng[20] = "Appoint, O Jehovah, a director to them, Let nations know they [are] men! Selah.";
dby[20] = "Put them in fear, Jehovah: that the nations may know themselves to be but men. Selah.";
web[20] = "Put them in fear, O LORD: [that] the nations may know themselves [to be but] men. Selah.";
hnv[20] = "Put them in fear, LORD. Let the nations know that they are only men. Selah. ";

csb[1] = "I will thank the LORD with all my heart; I will declare all your wondrous works.";
csb[2] = "I will rejoice and boast about you; I will sing about your name, Most High.";
csb[3] = "When my enemies retreat, they stumble and perish before you.";
csb[4] = "For you have upheld my just cause; you are seated on your throne as a righteous judge.";
csb[5] = "You have rebuked the nations: You have destroyed the wicked; you have erased their name forever and ever.";
csb[6] = "The enemy has come to eternal ruin. You have uprooted the cities, and the very memory of them has perished.";
csb[7] = "But the LORD sits enthroned forever; he has established his throne for judgment.";
csb[8] = "And he judges the world with righteousness; he executes judgment on the nations with fairness.";
csb[9] = "The LORD is a refuge for the persecuted, a refuge in times of trouble.";
csb[10] = "Those who know your name trust in you because you have not abandoned those who seek you, LORD.";
csb[11] = "Sing to the LORD, who dwells in Zion; proclaim his deeds among the nations.";
csb[12] = "For the one who seeks an accounting for bloodshed remembers them; he does not forget the cry of the oppressed.";
csb[13] = "Be gracious to me, LORD; consider my affliction at the hands of those who hate me. Lift me up from the gates of death,";
csb[14] = "so that I may declare all your praises. I will rejoice in your salvation within the gates of Daughter Zion.";
csb[15] = "The nations have fallen into the pit they made; their foot is caught in the net they have concealed.";
csb[16] = "The LORD has made himself known; he has executed justice, snaring the wicked by the work of their hands. Higgaion. Selah";
csb[17] = "The wicked will return to Sheol -- all the nations that forget God.";
csb[18] = "For the needy will not always be forgotten; the hope of the oppressed will not perish forever.";
csb[19] = "Rise up, LORD! Do not let mere humans prevail; let the nations be judged in your presence.";
csb[20] = "Put terror in them, LORD; let the nations know they are only humans. Selah";
