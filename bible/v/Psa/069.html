rsv[1] = "To the choirmaster: according to Lilies. A Psalm of David. Save me, O God! For the waters have come up to my neck.";
asv[1] = "For the Chief Musician; set to Shoshannim. [A Psalm] of David. Save me, O God; For the waters are come in unto my soul. ";
yng[1] = "To the Overseer. -- `On the Lilies,\' by David. Save me, O God, for come have waters unto the soul.";
dby[1] = "{To the chief Musician. Upon Shoshannim. [A Psalm] of David.} Save me, O God; for the waters are come in unto [my] soul.";
web[1] = "To the chief Musician upon Shoshannim, [A Psalm] of David. Save me, O God; for the waters are come in to [my] soul.";
hnv[1] = "For the Chief Musician. On the shoshanim. By David. Save me, God, For the waters have come up to my neck!";
vul[1] = "[Vulgate 68:1] victori pro liliis David [Vulgate 68:2] salva me Deus quoniam venerunt aquae usque ad animam";
rsv[2] = "I sink in deep mire, where there is no foothold; I have come into deep waters, and the flood sweeps over me.";
asv[2] = "I sink in deep mire, where there is no standing: I am come into deep waters, where the floods overflow me. ";
yng[2] = "I have sunk in deep mire, And there is no standing, I have come into the depths of the waters, And a flood hath overflown me.";
dby[2] = "I sink in deep mire, where there is no standing; I am come into the depths of waters, and the flood overfloweth me.";
web[2] = "I sink in deep mire, where [there is] no standing: I am come into deep waters, where the floods overflow me.";
hnv[2] = "I sink in deep mire, where there is no foothold. I have come into deep waters, where the floods overflow me.";
vul[2] = "[Vulgate 68:3] infixus sum in limo profundi et non possum consistere veni in profundum aquarum et flumen operuit me";
rsv[3] = "I am weary with my crying; my throat is parched. My eyes grow dim with waiting for my God.";
asv[3] = "I am weary with my crying; my throat is dried: Mine eyes fail while I wait for my God. ";
yng[3] = "I have been wearied with my calling, Burnt hath been my throat, Consumed have been mine eyes, waiting for my God.";
dby[3] = "I am weary with my crying, my throat is parched; mine eyes fail while I wait for my God.";
web[3] = "I am weary of my crying: my throat is dried: my eyes fail while I wait for my God.";
hnv[3] = "I am weary with my crying. My throat is dry. My eyes fail, looking for my God.";
vul[3] = "[Vulgate 68:4] laboravi clamans exasperatum est guttur meum defecerunt oculi mei expectantes Deum meum";
rsv[4] = "More in number than the hairs of my head are those who hate me without cause; mighty are those who would destroy me, those who attack me with lies. What I did not steal must I now restore?";
asv[4] = "They that hate me without a cause are more than the hairs of my head: They that would cut me off, being mine enemies wrongfully, are mighty: That which I took not away I have to restore. ";
yng[4] = "Those hating me without cause Have been more than the hairs of my head, Mighty have been my destroyers, My lying enemies, That which I took not away -- I bring back.";
dby[4] = "They that hate me without a cause are more than the hairs of my head; they that would destroy me, being mine enemies wrongfully, are mighty: then I restored that which I took not away.";
web[4] = "They that hate me without a cause are more than the hairs of my head: they that would destroy me, [being] my enemies wrongfully, are mighty: then I restored [that] which I took not away.";
hnv[4] = "Those who hate me without a cause are more than the hairs of my head. Those who want to cut me off, being my enemies wrongfully, are mighty. I have to restore what I didn\'t take away.";
vul[4] = "[Vulgate 68:5] multiplicati sunt super capillos capitis mei qui oderunt me gratis confortati sunt qui persequebantur me inimici mei iniuste quae non rapueram tunc reddebam";
rsv[5] = "O God, thou knowest my folly; the wrongs I have done are not hidden from thee.";
asv[5] = "O God, thou knowest my foolishness; And my sins are not hid from thee. ";
yng[5] = "O God, Thou -- Thou hast known Concerning my overturn, And my desolations from Thee have not been hid.";
dby[5] = "Thou, O God, knowest my foolishness, and my trespasses are not hidden from thee.";
web[5] = "O God, thou knowest my foolishness; and my sins are not hid from thee.";
hnv[5] = "God, you know my foolishness. My sins aren\'t hidden from you.";
vul[5] = "[Vulgate 68:6] Deus tu scis stultitiam meam et peccata mea a te non sunt abscondita";
rsv[6] = "Let not those who hope in thee be put to shame through me, O Lord GOD of hosts; let not those who seek thee be brought to dishonor through me, O God of Israel.";
asv[6] = "Let not them that wait for thee be put to shame through me, O Lord Jehovah of hosts: Let not those that seek thee be brought to dishonor through me, O God of Israel. ";
yng[6] = "Let not those waiting on Thee be ashamed because of me, O Lord, Jehovah of Hosts, Let not those seeking Thee Blush because of me, O God of Israel.";
dby[6] = "Let not them that wait on thee, Lord, Jehovah of hosts, be ashamed through me; let not those that seek thee be confounded through me, O God of Israel.";
web[6] = "Let not them that wait on thee, O Lord GOD of hosts, be ashamed for my sake: let not those that seek thee be confounded for my sake, O God of Israel.";
hnv[6] = "Don\'t let those who wait for you be shamed through me, Lord GOD of Hosts. Don\'t let those who seek you be brought to dishonor through me, God of Yisra\'el.";
vul[6] = "[Vulgate 68:7] non confundantur in me qui expectant te Domine Deus exercituum non confundantur in me qui quaerunt te Deus Israhel";
rsv[7] = "For it is for thy sake that I have borne reproach, that shame has covered my face.";
asv[7] = "Because for thy sake I have borne reproach; Shame hath covered my face. ";
yng[7] = "For because of Thee I have borne reproach, Shame hath covered my face.";
dby[7] = "Because for thy sake I have borne reproach; confusion hath covered my face.";
web[7] = "Because for thy sake I have borne reproach; shame hath covered my face.";
hnv[7] = "Because for your sake, I have borne reproach. Shame has covered my face.";
vul[7] = "[Vulgate 68:8] quia propter te portavi obprobrium operuit confusio faciem meam";
rsv[8] = "I have become a stranger to my brethren, an alien to my mother\'s sons.";
asv[8] = "I am become a stranger unto my brethren, And an alien unto my mother\'s children. ";
yng[8] = "A stranger I have been to my brother, And a foreigner to sons of my mother.";
dby[8] = "I am become a stranger unto my brethren, and an alien unto my mother\'s sons;";
web[8] = "I am become a stranger to my brethren, and an alien to my mother\'s children.";
hnv[8] = "I have become a stranger to my brothers, An alien to my mother\'s children.";
vul[8] = "[Vulgate 68:9] alienus factus sum fratribus meis et peregrinus filiis matris meae";
rsv[9] = "For zeal for thy house has consumed me, and the insults of those who insult thee have fallen on me.";
asv[9] = "For the zeal of thy house hath eaten me up; And the reproaches of them that reproach thee are fallen upon me. ";
yng[9] = "For zeal for Thy house hath consumed me, And the reproaches of Thy reproachers Have fallen upon me.";
dby[9] = "For the zeal of thy house hath devoured me, and the reproaches of them that reproach thee have fallen upon me.";
web[9] = "For the zeal of thy house hath eaten me up; and the reproaches of them that reproached thee have fallen upon me.";
hnv[9] = "For the zeal of your house consumes me. The reproaches of those who reproach you have fallen on me.";
vul[9] = "[Vulgate 68:10] quia zelus domus tuae comedit me et obprobrium exprobrantium tibi cecidit super me";
kjv[10] = "Pour out thine indignation upon them, and let thy wrathful anger take hold of them.";
rsv[10] = "When I humbled my soul with fasting, it became my reproach.";
asv[10] = "When I wept, [and chastened] my soul with fasting, That was to my reproach. ";
yng[10] = "And I weep in the fasting of my soul, And it is for a reproach to me.";
dby[10] = "And I wept, my soul was fasting: that also was to my reproach; --";
web[10] = "When I wept, [and chastened] my soul with fasting, that was to my reproach.";
hnv[10] = "When I wept and I fasted, That was to my reproach.";
vul[10] = "[Vulgate 68:11] et flevi in ieiunio animam meam et factum est in obprobria mihi";
kjv[11] = "Let their habitation be desolate; [and] let none dwell in their tents.";
rsv[11] = "When I made sackcloth my clothing, I became a byword to them.";
asv[11] = "When I made sackcloth my clothing, I became a byword unto them. ";
yng[11] = "And I make my clothing sackcloth, And I am to them for a simile.";
dby[11] = "And I made sackcloth my garment: then I became a proverb to them.";
web[11] = "I made sackcloth also my garment; and I became a proverb to them.";
hnv[11] = "When I made sackcloth my clothing, I became a byword to them.";
vul[11] = "[Vulgate 68:12] et posui vestimentum meum saccum et factus sum eis in parabulam";
kjv[12] = "For they persecute [him] whom thou hast smitten; and they talk to the grief of those whom thou hast wounded.";
rsv[12] = "I am the talk of those who sit in the gate, and the drunkards make songs about me.";
asv[12] = "They that sit in the gate talk of me; And [I am] the song of the drunkards. ";
yng[12] = "Those sitting at the gate meditate concerning me, And those drinking strong drink, Play on instruments.";
dby[12] = "They that sit in the gate talk of me, and [I am] the song of the drunkards.";
web[12] = "They that sit in the gate speak against me; and I [was] the song of the drunkards.";
hnv[12] = "Those who sit in the gate talk about me. I am the song of the drunkards.";
vul[12] = "[Vulgate 68:13] contra me loquebantur qui sedebant in porta et cantabant bibentes vinum";
kjv[13] = "Add iniquity unto their iniquity: and let them not come into thy righteousness.";
rsv[13] = "But as for me, my prayer is to thee, O LORD. At an acceptable time, O God, in the abundance of thy steadfast love answer me. With thy faithful help";
asv[13] = "But as for me, my prayer is unto thee, O Jehovah, in an acceptable time: O God, in the abundance of thy lovingkindness, Answer me in the truth of thy salvation. ";
yng[13] = "And I -- my prayer [is] to Thee, O Jehovah, A time of good pleasure, O God, In the abundance of Thy kindness, Answer me in the truth of Thy salvation.";
dby[13] = "But as for me, my prayer is unto thee, Jehovah, in an acceptable time: O God, in the abundance of thy loving-kindness answer me, according to the truth of thy salvation:";
web[13] = "But as for me, my prayer [is] to thee, O LORD, [in] an acceptable time: O God, in the multitude of thy mercy hear me, in the truth of thy salvation.";
hnv[13] = "But as for me, my prayer is to you, LORD, in an acceptable time. God, in the abundance of your lovingkindness, answer me in the truth of your salvation.";
vul[13] = "[Vulgate 68:14] mea autem oratio ad te Domine tempus reconciliationis est Deus in multitudine misericordiae tuae exaudi me in veritate salutaris tui";
kjv[14] = "Let them be blotted out of the book of the living, and not be written with the righteous.";
rsv[14] = "rescue me from sinking in the mire; let me be delivered from my enemies and from the deep waters.";
asv[14] = "Deliver me out of the mire, and let me not sink: Let me be delivered from them that hate me, and out of the deep waters. ";
yng[14] = "Deliver me from the mire, and let me not sink, Let me be delivered from those hating me, And from deep places of waters.";
dby[14] = "Deliver me out of the mire, let me not sink; let me be delivered from them that hate me, and out of the depths of waters.";
web[14] = "Deliver me out of the mire, and let me not sink: let me be delivered from them that hate me, and out of the deep waters.";
hnv[14] = "Deliver me out of the mire, and don\'t let me sink. Let me be delivered from those who hate me, and out of the deep waters.";
vul[14] = "[Vulgate 68:15] erue me de luto ut non infigar libera me ab his qui oderunt me et de profundis aquis";
kjv[15] = "But I [am] poor and sorrowful: let thy salvation, O God, set me up on high.";
rsv[15] = "Let not the flood sweep over me, or the deep swallow me up, or the pit close its mouth over me.";
asv[15] = "Let not the waterflood overwhelm me, Neither let the deep swallow me up; And let not the pit shut its mouth upon me. ";
yng[15] = "Let not a flood of waters overflow me, Nor let the deep swallow me up, Nor let the pit shut her mouth upon me.";
dby[15] = "Let not the flood of waters overflow me, neither let the deep swallow me up; and let not the pit shut its mouth upon me.";
web[15] = "Let not the water-flood overflow me, neither let the deep swallow me up, and let not the pit shut her mouth upon me.";
hnv[15] = "Don\'t let the flood waters overwhelm me, Neither let the deep swallow me up. Don\'t let the pit shut its mouth on me.";
vul[15] = "[Vulgate 68:16] ne operiat me fluvius aquae et ne absorbeat me profundum et non coronet super me puteus os suum";
kjv[16] = "I will praise the name of God with a song, and will magnify him with thanksgiving.";
rsv[16] = "Answer me, O LORD, for thy steadfast love is good; according to thy abundant mercy, turn to me.";
asv[16] = "Answer me, O Jehovah; for thy lovingkindness is good: According to the multitude of thy tender mercies turn thou unto me. ";
yng[16] = "Answer me, O Jehovah, for good [is] Thy kindness, According to the abundance Of Thy mercies turn Thou unto me,";
dby[16] = "Answer me, O Jehovah; for thy loving-kindness is good: according to the abundance of thy tender mercies, turn toward me;";
web[16] = "Hear me, O LORD; for thy loving-kindness [is] good: turn to me according to the multitude of thy tender mercies.";
hnv[16] = "Answer me, LORD, for your lovingkindness is good. According to the multitude of your tender mercies, turn to me.";
vul[16] = "[Vulgate 68:17] exaudi me Domine quoniam bona est misericordia tua secundum multitudinem miserationum tuarum respice ad me";
kjv[17] = "[This] also shall please the LORD better than an ox [or] bullock that hath horns and hoofs.";
rsv[17] = "Hide not thy face from thy servant; for I am in distress, make haste to answer me.";
asv[17] = "And hide not thy face from thy servant; For I am in distress; answer me speedily. ";
yng[17] = "And hide not Thy face from Thy servant, For I am in distress -- haste, answer me.";
dby[17] = "And hide not thy face from thy servant, for I am in trouble: answer me speedily.";
web[17] = "And hide not thy face from thy servant; for I am in trouble: hear me speedily.";
hnv[17] = "Don\'t hide your face from your servant, For I am in distress. Answer me speedily!";
vul[17] = "[Vulgate 68:18] et ne abscondas faciem tuam a servo tuo quoniam tribulor cito exaudi me";
kjv[18] = "The humble shall see [this, and] be glad: and your heart shall live that seek God.";
rsv[18] = "Draw near to me, redeem me, set me free because of my enemies!";
asv[18] = "Draw nigh unto my soul, and redeem it: Ransom me because of mine enemies. ";
yng[18] = "Be near unto my soul -- redeem it, Because of mine enemies ransom me.";
dby[18] = "Draw nigh unto my soul, be its redeemer; ransom me because of mine enemies.";
web[18] = "Draw nigh to my soul, [and] redeem it: deliver me because of my enemies.";
hnv[18] = "Draw near to my soul, and redeem it. Ransom me because of my enemies.";
vul[18] = "[Vulgate 68:19] accede ad animam meam redime eam propter inimicos meos libera me";
kjv[19] = "For the LORD heareth the poor, and despiseth not his prisoners.";
rsv[19] = "Thou knowest my reproach, and my shame and my dishonor; my foes are all known to thee.";
asv[19] = "Thou knowest my reproach, and my shame, and my dishonor: Mine adversaries are all before thee. ";
yng[19] = "Thou -- Thou hast known my reproach, And my shame, and my blushing, Before Thee [are] all mine adversaries.";
dby[19] = "*Thou* knowest my reproach, and my shame, and my dishonour: mine adversaries are all before thee.";
web[19] = "Thou hast known my reproach, and my shame, and my dishonor: my adversaries [are] all before thee.";
hnv[19] = "You know my reproach, my shame, and my dishonor. My adversaries are all before you.";
vul[19] = "[Vulgate 68:20] tu scis obprobrium meum et confusionem meam et ignominiam meam";
kjv[20] = "Let the heaven and earth praise him, the seas, and every thing that moveth therein.";
rsv[20] = "Insults have broken my heart, so that I am in despair. I looked for pity, but there was none; and for comforters, but I found none.";
asv[20] = "Reproach hath broken my heart; and I am full of heaviness: And I looked for some to take pity, but there was none; And for comforters, but I found none. ";
yng[20] = "Reproach hath broken my heart, and I am sick, And I look for a bemoaner, and there is none, And for comforters, and I have found none.";
dby[20] = "Reproach hath broken my heart, and I am overwhelmed: and I looked for sympathy, but there was none; and for comforters, but I found none.";
web[20] = "Reproach hath broken my heart; and I am full of heaviness: and I looked [for some] to take pity, but [there was] none; and for comforters, but I found none.";
hnv[20] = "Reproach has broken my heart, and I am full of heaviness. I looked for some to take pity, but there was none; For comforters, but I found none.";
vul[20] = "[Vulgate 68:21] coram te sunt omnes hostes mei obprobrio contritum est cor meum et desperatus sum et expectavi qui contristaretur et non fuit et qui consolaretur et non inveni";
kjv[21] = "For God will save Zion, and will build the cities of Judah: that they may dwell there, and have it in possession.";
rsv[21] = "They gave me poison for food, and for my thirst they gave me vinegar to drink.";
asv[21] = "They gave me also gall for my food; And in my thirst they gave me vinegar to drink. ";
yng[21] = "And they give for my food gall, And for my thirst cause me to drink vinegar.";
dby[21] = "Yea, they gave me gall for my food, and in my thirst they gave me vinegar to drink.";
web[21] = "They gave me also gall for my food; and in my thirst they gave me vinegar to drink.";
hnv[21] = "They also gave me gall for my food. In my thirst, they gave me vinegar to drink.";
vul[21] = "[Vulgate 68:22] et dederunt in esca mea fel et in siti mea potaverunt me aceto";
kjv[22] = "The seed also of his servants shall inherit it: and they that love his name shall dwell therein.";
rsv[22] = "Let their own table before them become a snare; let their sacrificial feasts be a trap.";
asv[22] = "Let their table before them become a snare; And when they are in peace, [let it become] a trap. ";
yng[22] = "Their table before them is for a snare, And for a recompence -- for a trap.";
dby[22] = "Let their table become a snare before them, and their very welfare a trap;";
web[22] = "Let their table become a snare before them: and [that which should have been] for [their] welfare, [let it become] a trap.";
hnv[22] = "Let their table before them become a snare. May it become a retribution and a trap.";
vul[22] = "[Vulgate 68:23] sit mensa eorum coram eis in laqueum et in retributiones ad corruendum";
kjv[23] = "[[To the chief Musician upon Shoshannim, [A Psalm] of David.]] Save me, O God; for the waters are come in unto [my] soul.";
rsv[23] = "Let their eyes be darkened, so that they cannot see; and make their loins tremble continually.";
asv[23] = "Let their eyes be darkened, so that they cannot see; And make their loins continually to shake. ";
yng[23] = "Darkened are their eyes from seeing, And their loins continually shake Thou.";
dby[23] = "Let their eyes be darkened, that they see not, and make their loins continually to shake.";
web[23] = "Let their eyes be darkened, that they see not; and make their loins continually to shake.";
hnv[23] = "Let their eyes be darkened, so that they can\'t see. Let their backs be continually bent.";
vul[23] = "[Vulgate 68:24] contenebrentur oculi eorum ne videant et dorsum eorum semper incurva";
kjv[24] = "I sink in deep mire, where [there is] no standing: I am come into deep waters, where the floods overflow me.";
rsv[24] = "Pour out thy indignation upon them, and let thy burning anger overtake them.";
asv[24] = "Pour out thine indignation upon them, And let the fierceness of thine anger overtake them. ";
yng[24] = "Pour upon them Thine indignation, And the fierceness of Thine anger doth seize them.";
dby[24] = "Pour out thine indignation upon them, and let the fierceness of thine anger take hold of them.";
web[24] = "Pour out thy indignation upon them, and let thy wrathful anger take hold of them.";
hnv[24] = "Pour out your indignation on them. Let the fierceness of your anger overtake them.";
vul[24] = "[Vulgate 68:25] effunde super eos indignationem tuam et ira furoris tui conprehendat eos";
kjv[25] = "I am weary of my crying: my throat is dried: mine eyes fail while I wait for my God.";
rsv[25] = "May their camp be a desolation, let no one dwell in their tents.";
asv[25] = "Let their habitation be desolate; Let none dwell in their tents. ";
yng[25] = "Their tower is desolated, In their tents there is no dweller.";
dby[25] = "Let their habitation be desolate; let there be no dweller in their tents.";
web[25] = "Let their habitation be desolate; [and] let none dwell in their tents.";
hnv[25] = "Let their habitation be desolate. Let no one dwell in their tents.";
vul[25] = "[Vulgate 68:26] fiat commoratio eorum deserta in tabernaculis eorum non sit qui habitet";
kjv[26] = "They that hate me without a cause are more than the hairs of mine head: they that would destroy me, [being] mine enemies wrongfully, are mighty: then I restored [that] which I took not away.";
rsv[26] = "For they persecute him whom thou hast smitten, and him whom thou hast wounded, they afflict still more.";
asv[26] = "For they persecute him whom thou hast smitten; And they tell of the sorrow of those whom thou hast wounded. ";
yng[26] = "For they have pursued him Thou hast smitten, And recount of the pain of Thy pierced ones.";
dby[26] = "For they persecute him whom *thou* hast smitten, and they talk for the sorrow of those whom thou hast wounded.";
web[26] = "For they persecute [him] whom thou hast smitten; and they talk to the grief of those whom thou hast wounded.";
hnv[26] = "For they persecute him whom you have wounded. They tell of the sorrow of those whom you have hurt.";
vul[26] = "[Vulgate 68:27] quoniam quem tu percussisti persecuti sunt et ut adfligerent vulneratos tuos narrabant";
kjv[27] = "O God, thou knowest my foolishness; and my sins are not hid from thee.";
rsv[27] = "Add to them punishment upon punishment; may they have no acquittal from thee.";
asv[27] = "Add iniquity unto their iniquity; And let them not come into thy righteousness. ";
yng[27] = "Give punishment for their iniquity, And they enter not into Thy righteousness.";
dby[27] = "Add iniquity unto their iniquity, and let them not come into thy righteousness.";
web[27] = "Add iniquity to their iniquity: and let them not come into thy righteousness.";
hnv[27] = "Charge them with crime upon crime. Don\'t let them come into your righteousness.";
vul[27] = "[Vulgate 68:28] da iniquitatem super iniquitatem eorum et non veniant in iustitia tua";
kjv[28] = "Let not them that wait on thee, O Lord GOD of hosts, be ashamed for my sake: let not those that seek thee be confounded for my sake, O God of Israel.";
rsv[28] = "Let them be blotted out of the book of the living; let them not be enrolled among the righteous.";
asv[28] = "Let them be blotted out of the book of life, And not be written with the righteous. ";
yng[28] = "They are blotted out of the book of life, And with the righteous are not written.";
dby[28] = "Let them be blotted out of the book of life, and not be written with the righteous.";
web[28] = "Let them be blotted out of the book of the living, and not be written with the righteous.";
hnv[28] = "Let them be blotted out of the book of life, And not be written with the righteous.";
vul[28] = "[Vulgate 68:29] deleantur de libro viventium et cum iustis non scribantur";
kjv[29] = "Because for thy sake I have borne reproach; shame hath covered my face.";
rsv[29] = "But I am afflicted and in pain; let thy salvation, O God, set me on high!";
asv[29] = "But I am poor and sorrowful: Let thy salvation, O God, set me up on high. ";
yng[29] = "And I [am] afflicted and pained, Thy salvation, O God, doth set me on high.";
dby[29] = "But I am afflicted and sorrowful: let thy salvation, O God, set me secure on high.";
web[29] = "But I [am] poor and sorrowful: let thy salvation, O God, set me up on high.";
hnv[29] = "But I am in pain and distress. Let your yeshu`ah, God, protect me.";
vul[29] = "[Vulgate 68:30] ego autem pauper et dolens salus tua Deus suscipiet me";
kjv[30] = "I am become a stranger unto my brethren, and an alien unto my mother\'s children.";
rsv[30] = "I will praise the name of God with a song; I will magnify him with thanksgiving.";
asv[30] = "I will praise the name of God with a song, And will magnify him with thanksgiving. ";
yng[30] = "I praise the name of God with a song, And I magnify Him with thanksgiving,";
dby[30] = "I will praise the name of God with a song, and will magnify him with thanksgiving;";
web[30] = "I will praise the name of God with a song, and will magnify him with thanksgiving.";
hnv[30] = "I will praise the name of God with a song, And will magnify him with thanksgiving.";
vul[30] = "[Vulgate 68:31] laudabo nomen Dei in cantico et magnificabo eum in confessione";
kjv[31] = "For the zeal of thine house hath eaten me up; and the reproaches of them that reproached thee are fallen upon me.";
rsv[31] = "This will please the LORD more than an ox or a bull with horns and hoofs.";
asv[31] = "And it will please Jehovah better than an ox, [Or] a bullock that hath horns and hoofs. ";
yng[31] = "And it is better to Jehovah than an ox, A bullock -- horned -- hoofed.";
dby[31] = "And it shall please Jehovah more than an ox, -- a bullock with horns and cloven hoofs.";
web[31] = "[This] also shall please the LORD better than an ox [or] bullock that hath horns and hoofs.";
hnv[31] = "It will please the LORD better than an ox, Or a bull that has horns and hoofs.";
vul[31] = "[Vulgate 68:32] et placebit Domino super vitulum novellum cornua efferentem et ungulas";
kjv[32] = "When I wept, [and chastened] my soul with fasting, that was to my reproach.";
rsv[32] = "Let the oppressed see it and be glad; you who seek God, let your hearts revive.";
asv[32] = "The meek have seen it, and are glad: Ye that seek after God, let your heart live. ";
yng[32] = "The humble have seen -- they rejoice, Ye who seek God -- and your heart liveth.";
dby[32] = "The meek shall see it, they shall be glad; ye that seek God, your heart shall live.";
web[32] = "The humble shall see [this], [and] be glad: and your heart shall live that seek God.";
hnv[32] = "The humble have seen it, and are glad. You who seek after God, let your heart live.";
vul[32] = "[Vulgate 68:33] videntes mansueti laetabuntur qui quaeritis Deum vivet anima vestra";
kjv[33] = "I made sackcloth also my garment; and I became a proverb to them.";
rsv[33] = "For the LORD hears the needy, and does not despise his own that are in bonds.";
asv[33] = "For Jehovah heareth the needy, And despiseth not his prisoners. ";
yng[33] = "For Jehovah hearkeneth unto the needy, And His bound ones He hath not despised.";
dby[33] = "For Jehovah heareth the needy, and despiseth not his prisoners.";
web[33] = "For the LORD heareth the poor, and despiseth not his prisoners.";
hnv[33] = "For the LORD hears the needy, And doesn\'t despise his captive people.";
vul[33] = "[Vulgate 68:34] quoniam exaudivit pauperes Dominus et vinctos suos non dispexit";
kjv[34] = "They that sit in the gate speak against me; and I [was] the song of the drunkards.";
rsv[34] = "Let heaven and earth praise him, the seas and everything that moves therein.";
asv[34] = "Let heaven and earth praise him, The seas, and everything that moveth therein. ";
yng[34] = "The heavens and earth do praise Him, Seas, and every moving thing in them.";
dby[34] = "Let heavens and earth praise him; the seas, and everything that moveth therein.";
web[34] = "Let the heaven and earth praise him, the seas, and every thing that moveth therein.";
hnv[34] = "Let heaven and eretz praise him; The seas, and everything that moves therein!";
vul[34] = "[Vulgate 68:35] laudent eum caeli et terra maria et omne quod movetur in eis";
kjv[35] = "But as for me, my prayer [is] unto thee, O LORD, [in] an acceptable time: O God, in the multitude of thy mercy hear me, in the truth of thy salvation.";
rsv[35] = "For God will save Zion and rebuild the cities of Judah; and his servants shall dwell there and possess it;";
asv[35] = "For God will save Zion, and build the cities of Judah; And they shall abide there, and have it in possession. ";
yng[35] = "For God doth save Zion, And doth build the cities of Judah, And they have dwelt there, and possess it.";
dby[35] = "For God will save Zion, and will build the cities of Judah; and they shall dwell there, and possess it:";
web[35] = "For God will save Zion, and will build the cities of Judah: that they may dwell there, and have it in possession.";
hnv[35] = "For God will save Tziyon, and build the cities of Yehudah. They shall settle there, and own it.";
vul[35] = "[Vulgate 68:36] quia Deus salvabit Sion et aedificabit civitates Iuda et habitabunt ibi et possidebunt eam";
kjv[36] = "Deliver me out of the mire, and let me not sink: let me be delivered from them that hate me, and out of the deep waters.";
rsv[36] = "the children of his servants shall inherit it, and those who love his name shall dwell in it.";
asv[36] = "The seed also of his servants shall inherit it; And they that love his name shall dwell therein. ";
yng[36] = "And the seed of His servants inherit it, And those loving His name dwell in it!";
dby[36] = "And the seed of his servants shall inherit it, and they that love his name shall dwell therein.";
web[36] = "The seed also of his servants shall inherit it: and they that love his name shall dwell therein.";
hnv[36] = "The children also of his servants shall inherit it. Those who love his name shall dwell therein. ";
vul[36] = "[Vulgate 68:37] et semen servorum eius possidebit eam et qui diligunt nomen eius habitabunt in ea";
csb[1] = "Save me, God, for the water has risen to my neck.";
csb[2] = "I have sunk in deep mud, and there is no footing; I have come into deep water, and a flood sweeps over me.";
csb[3] = "I am weary from my crying; my throat is parched. My eyes fail, looking for my God.";
csb[4] = "Those who hate me without cause are more numerous than the hairs of my head; my deceitful enemies, who would destroy me, are powerful. Though I did not steal, I must repay.";
csb[5] = "God, you know my foolishness, and my guilty acts are not hidden from you.";
csb[6] = "Do not let those who put their hope in you be disgraced because of me, Lord GOD of Armies; do not let those who seek you be humiliated because of me, God of Israel.";
csb[7] = "For I have endured insults because of you, and shame has covered my face.";
csb[8] = "I have become a stranger to my brothers and a foreigner to my mother\'s sons";
csb[9] = "because zeal for your house has consumed me, and the insults of those who insult you have fallen on me.";
csb[10] = "I mourned and fasted, but it brought me insults.";
csb[11] = "I wore sackcloth as my clothing, and I was a joke to them.";
csb[12] = "Those who sit at the city gate talk about me, and drunkards make up songs about me.";
csb[13] = "But as for me, LORD, my prayer to you is for a time of favor. In your abundant, faithful love, God, answer me with your sure salvation.";
csb[14] = "Rescue me from the miry mud; don\'t let me sink. Let me be rescued from those who hate me and from the deep water.";
csb[15] = "Don\'t let the floodwaters sweep over me or the deep swallow me up; don\'t let the Pit close its mouth over me.";
csb[16] = "Answer me, LORD, for your faithful love is good. In keeping with your abundant compassion, turn to me.";
csb[17] = "Don\'t hide your face from your servant, for I am in distress. Answer me quickly!";
csb[18] = "Come near to me and redeem me; ransom me because of my enemies.";
csb[19] = "You know the insults I endure -- my shame and disgrace. You are aware of all my adversaries.";
csb[20] = "Insults have broken my heart, and I am in despair. I waited for sympathy, but there was none; for comforters, but found no one.";
csb[21] = "Instead, they gave me gall for my food, and for my thirst they gave me vinegar to drink.";
csb[22] = "Let their table set before them be a snare, and let it be a trap for their allies.";
csb[23] = "Let their eyes grow too dim to see, and let their hips continually quake.";
csb[24] = "Pour out your rage on them, and let your burning anger overtake them.";
csb[25] = "Make their fortification desolate; may no one live in their tents.";
csb[26] = "For they persecute the one you struck and talk about the pain of those you wounded.";
csb[27] = "Charge them with crime on top of crime; do not let them share in your righteousness.";
csb[28] = "Let them be erased from the book of life and not be recorded with the righteous.";
csb[29] = "But as for me -- poor and in pain -- let your salvation protect me, God.";
csb[30] = "I will praise God\'s name with song and exalt him with thanksgiving.";
csb[31] = "That will please the LORD more than an ox, more than a bull with horns and hooves.";
csb[32] = "The humble will see it and rejoice. You who seek God, take heart!";
csb[33] = "For the LORD listens to the needy and does not despise his own who are prisoners.";
csb[34] = "Let heaven and earth praise him, the seas and everything that moves in them,";
csb[35] = "for God will save Zion and build up the cities of Judah. They will live there and possess it.";
csb[36] = "The descendants of his servants will inherit it, and those who love his name will live in it.";
kjv[1] = "[[To the chief Musician upon Shoshannim, [A Psalm] of David.]] Save me, O God; for the waters are come in unto [my] soul.";
kjv[2] = "I sink in deep mire, where [there is] no standing: I am come into deep waters, where the floods overflow me.";
kjv[3] = "I am weary of my crying: my throat is dried: mine eyes fail while I wait for my God.";
kjv[4] = "They that hate me without a cause are more than the hairs of mine head: they that would destroy me, [being] mine enemies wrongfully, are mighty: then I restored [that] which I took not away.";
kjv[5] = "O God, thou knowest my foolishness; and my sins are not hid from thee.";
kjv[6] = "Let not them that wait on thee, O Lord GOD of hosts, be ashamed for my sake: let not those that seek thee be confounded for my sake, O God of Israel.";
kjv[7] = "Because for thy sake I have borne reproach; shame hath covered my face.";
kjv[8] = "I am become a stranger unto my brethren, and an alien unto my mother's children.";
kjv[9] = "For the zeal of thine house hath eaten me up; and the reproaches of them that reproached thee are fallen upon me.";
kjv[10] = "When I wept, [and chastened] my soul with fasting, that was to my reproach.";
kjv[11] = "I made sackcloth also my garment; and I became a proverb to them.";
kjv[12] = "They that sit in the gate speak against me; and I [was] the song of the drunkards.";
kjv[13] = "But as for me, my prayer [is] unto thee, O LORD, [in] an acceptable time: O God, in the multitude of thy mercy hear me, in the truth of thy salvation.";
kjv[14] = "Deliver me out of the mire, and let me not sink: let me be delivered from them that hate me, and out of the deep waters.";
kjv[15] = "Let not the waterflood overflow me, neither let the deep swallow me up, and let not the pit shut her mouth upon me.";
kjv[16] = "Hear me, O LORD; for thy lovingkindness [is] good: turn unto me according to the multitude of thy tender mercies.";
kjv[17] = "And hide not thy face from thy servant; for I am in trouble: hear me speedily.";
kjv[18] = "Draw nigh unto my soul, [and] redeem it: deliver me because of mine enemies.";
kjv[19] = "Thou hast known my reproach, and my shame, and my dishonour: mine adversaries [are] all before thee.";
kjv[20] = "Reproach hath broken my heart; and I am full of heaviness: and I looked [for some] to take pity, but [there was] none; and for comforters, but I found none.";
kjv[21] = "They gave me also gall for my meat; and in my thirst they gave me vinegar to drink.";
kjv[22] = "Let their table become a snare before them: and [that which should have been] for [their] welfare, [let it become] a trap.";
kjv[23] = "Let their eyes be darkened, that they see not; and make their loins continually to shake.";
kjv[24] = "Pour out thine indignation upon them, and let thy wrathful anger take hold of them.";
kjv[25] = "Let their habitation be desolate; [and] let none dwell in their tents.";
kjv[26] = "For they persecute [him] whom thou hast smitten; and they talk to the grief of those whom thou hast wounded.";
kjv[27] = "Add iniquity unto their iniquity: and let them not come into thy righteousness.";
kjv[28] = "Let them be blotted out of the book of the living, and not be written with the righteous.";
kjv[29] = "But I [am] poor and sorrowful: let thy salvation, O God, set me up on high.";
kjv[30] = "I will praise the name of God with a song, and will magnify him with thanksgiving.";
kjv[31] = "[This] also shall please the LORD better than an ox [or] bullock that hath horns and hoofs.";
kjv[32] = "The humble shall see [this, and] be glad: and your heart shall live that seek God.";
kjv[33] = "For the LORD heareth the poor, and despiseth not his prisoners.";
kjv[34] = "Let the heaven and earth praise him, the seas, and every thing that moveth therein.";
kjv[35] = "For God will save Zion, and will build the cities of Judah: that they may dwell there, and have it in possession.";
kjv[36] = "The seed also of his servants shall inherit it: and they that love his name shall dwell therein.";
</script>
