kjv[1] = "[[To the chief Musician, A Psalm [and] Song of David.]] Praise waiteth for thee, O God, in Sion: and unto thee shall the vow be performed.";
rsv[1] = "To the choirmaster. A Psalm of David. A Song. Praise is due to thee, O God, in Zion; and to thee shall vows be performed,";
asv[1] = "[For the Chief Musician. A Psalm. A song of David.] Praise waiteth for thee, O God, in Zion; And unto thee shall the vow be performed. ";
yng[1] = "To the Overseer. -- A Psalm of David. A Song. To Thee, silence -- praise, O God, [is] in Zion, And to Thee is a vow completed.";
dby[1] = "{To the chief Musician. A Psalm of David: a Song.} Praise waiteth for thee in silence, O God, in Zion; and unto thee shall the vow be performed.";
web[1] = "To the chief Musician, A Psalm [and] Song of David. Praise waiteth for thee, O God, in Zion: and to thee shall the vow be performed.";
hnv[1] = "For the Chief Musician. A Psalm by David. A song. Praise waits for you, God, in Tziyon. To you shall vows be performed.";
vul[1] = "[Vulgate 64:1] victori carmen David cantici [Vulgate 64:2] tibi silens laus Deus in Sion et tibi reddetur votum";
kjv[2] = "O thou that hearest prayer, unto thee shall all flesh come.";
rsv[2] = "O thou who hearest prayer! To thee shall all flesh come";
asv[2] = "O thou that hearest prayer, Unto thee shall all flesh come. ";
yng[2] = "Hearer of prayer, to Thee all flesh cometh.";
dby[2] = "O thou that hearest prayer, unto thee shall all flesh come.";
web[2] = "O thou that hearest prayer, to thee shall all flesh come.";
hnv[2] = "You who hear prayer, To you all men will come.";
vul[2] = "[Vulgate 64:3] exaudi orationem donec ad te omnis caro veniat";
kjv[3] = "Iniquities prevail against me: [as for] our transgressions, thou shalt purge them away.";
rsv[3] = "on account of sins. When our transgressions prevail over us, thou dost forgive them.";
asv[3] = "Iniquities prevail against me: As for our transgressions, thou wilt forgive them. ";
yng[3] = "Matters of iniquities were mightier than I, Our transgressions -- Thou dost cover them.";
dby[3] = "Iniquities have prevailed against me: our transgressions, thou wilt forgive them.";
web[3] = "Iniquities prevail against me: [as for] our transgressions, thou shalt purge them away.";
hnv[3] = "Sins overwhelmed me, But you atoned for our transgressions.";
vul[3] = "[Vulgate 64:4] verba iniquitatum praevaluerunt adversum me sceleribus nostris tu propitiaberis";
kjv[4] = "Blessed [is the man whom] thou choosest, and causest to approach [unto thee, that] he may dwell in thy courts: we shall be satisfied with the goodness of thy house, [even] of thy holy temple.";
rsv[4] = "Blessed is he whom thou dost choose and bring near, to dwell in thy courts! We shall be satisfied with the goodness of thy house, thy holy temple!";
asv[4] = "Blessed is the man whom thou choosest, and causest to approach [unto thee], That he may dwell in thy courts: We shall be satisfied with the goodness of thy house, Thy holy temple. ";
yng[4] = "O the happiness of [him whom] Thou choosest, And drawest near, he inhabiteth Thy courts, We are satisfied with the goodness of Thy house, Thy holy temple.";
dby[4] = "Blessed is he whom thou choosest and causest to approach: he shall dwell in thy courts. We shall be satisfied with the goodness of thy house, of thy holy temple.";
web[4] = "Blessed [is the man whom] thou choosest, and causest to approach [to thee], [that] he may dwell in thy courts: we shall be satisfied with the goodness of thy house, [even] of thy holy temple.";
hnv[4] = "Blessed is one whom you choose, and cause to come near, That he may live in your courts. We will be filled with the goodness of your house, Your holy temple.";
vul[4] = "[Vulgate 64:5] beatus quem elegeris et susceperis habitabit enim in atriis tuis replebimur bonis domus tuae sanctificatione templi tui";
kjv[5] = "[By] terrible things in righteousness wilt thou answer us, O God of our salvation; [who art] the confidence of all the ends of the earth, and of them that are afar off [upon] the sea:";
rsv[5] = "By dread deeds thou dost answer us with deliverance, O God of our salvation, who art the hope of all the ends of the earth, and of the farthest seas;";
asv[5] = "By terrible things thou wilt answer us in righteousness, Oh God of our salvation, Thou that art the confidence of all the ends of the earth, And of them that are afar off upon the sea: ";
yng[5] = "By fearful things in righteousness Thou answerest us, O God of our salvation, The confidence of all far off ends of earth and sea.";
dby[5] = "By terrible things in righteousness wilt thou answer us, O God of our salvation, thou confidence of all the ends of the earth, and of the distant regions of the sea. ...";
web[5] = "[By] terrible things in righteousness wilt thou answer us, O God of our salvation; [who art] the confidence of all the ends of the earth, and of them that are afar off [upon] the sea:";
hnv[5] = "By awesome deeds of righteousness, you answer us, God of our salvation. You who are the hope of all the ends of the eretz, Of those who are far away on the sea;";
vul[5] = "[Vulgate 64:6] terribilis in iustitia exaudi nos Deus salvator noster confidentia omnium finium terrae et maris longinqui";
kjv[6] = "Which by his strength setteth fast the mountains; [being] girded with power:";
rsv[6] = "who by thy strength hast established the mountains, being girded with might;";
asv[6] = "Who by his strength setteth fast the mountains, Being girded about with might; ";
yng[6] = "Establishing mountains by His power, He hath been girded with might,";
dby[6] = "Who by his strength established the mountains, being girded with power;";
web[6] = "Who by his strength setteth fast the mountains; [being] girded with power:";
hnv[6] = "Who by his power forms the mountains, Having armed yourself with strength;";
vul[6] = "[Vulgate 64:7] praeparans montes in virtute tua accinctus fortitudine";
kjv[7] = "Which stilleth the noise of the seas, the noise of their waves, and the tumult of the people.";
rsv[7] = "who dost still the roaring of the seas, the roaring of their waves, the tumult of the peoples;";
asv[7] = "Who stilleth the roaring of the seas, The roaring of their waves, And the tumult of the peoples. ";
yng[7] = "Restraining the noise of seas, the noise of their billows, And the multitude of the peoples.";
dby[7] = "Who stilleth the raging of the seas, the raging of their waves, and the tumult of the peoples.";
web[7] = "Who stilleth the noise of the seas, the noise of their waves, and the tumult of the people.";
hnv[7] = "Who stills the roaring of the seas, The roaring of their waves, And the turmoil of the nations.";
vul[7] = "[Vulgate 64:8] conpescens sonitum maris fremitum fluctuum eius et multitudinem gentium";
kjv[8] = "They also that dwell in the uttermost parts are afraid at thy tokens: thou makest the outgoings of the morning and evening to rejoice.";
rsv[8] = "so that those who dwell at earth\'s farthest bounds are afraid at thy signs; thou makest the outgoings of the morning and the evening to shout for joy.";
asv[8] = "They also that dwell in the uttermost parts are afraid at thy tokens: Thou makest the outgoings of the morning and evening to rejoice. ";
yng[8] = "And the inhabitants of the uttermost parts From Thy signs are afraid, The outgoings of morning and evening Thou causest to sing.";
dby[8] = "And they that dwell in the uttermost parts are afraid at thy tokens; thou makest the outgoings of the morning and evening to rejoice.";
web[8] = "They also that dwell in the uttermost parts are afraid at thy tokens: thou makest the outgoings of the morning and evening to rejoice.";
hnv[8] = "They also who dwell in far-away places are afraid at your wonders. You call the morning\'s dawn and the evening with songs of joy.";
vul[8] = "[Vulgate 64:9] et timebunt qui habitant in extremis a signis tuis egressus matutinos et vespere laudantes facies";
kjv[9] = "Thou visitest the earth, and waterest it: thou greatly enrichest it with the river of God, [which] is full of water: thou preparest them corn, when thou hast so provided for it.";
rsv[9] = "Thou visitest the earth and waterest it, thou greatly enrichest it; the river of God is full of water; thou providest their grain, for so thou hast prepared it.";
asv[9] = "Thou visitest the earth, and waterest it, Thou greatly enrichest it; The river of God is full of water: Thou providest them grain, when thou hast so prepared the earth. ";
yng[9] = "Thou hast inspected the earth, and waterest it, Thou makest it very rich, the rivulet of God [is] full of water, Thou preparest their corn, When thus Thou dost prepare it,";
dby[9] = "Thou hast visited the earth, thou hast watered it; thou greatly enrichest it: the river of God is full of water; thou providest their corn, when thou hast so prepared it:";
web[9] = "Thou visitest the earth, and waterest it: thou greatly enrichest it with the river of God, [which] is full of water: thou preparest them corn, when thou hast so provided for it.";
hnv[9] = "You visit the eretz, and water it. You greatly enrich it. The river of God is full of water. You provide them grain, for so you have ordained it.";
vul[9] = "[Vulgate 64:10] visita terram et inriga eam ubertate dita eam rivus Dei plenus aqua praeparabis frumentum eorum quia sic fundasti eam";
kjv[10] = "Thou waterest the ridges thereof abundantly: thou settlest the furrows thereof: thou makest it soft with showers: thou blessest the springing thereof.";
rsv[10] = "Thou waterest its furrows abundantly, settling its ridges, softening it with showers, and blessing its growth.";
asv[10] = "Thou waterest its furrows abundantly; Thou settlest the ridges thereof: Thou makest it soft with showers; Thou blessest the springing thereof. ";
yng[10] = "Its ridges have been filled, Deepened hath been its furrow, With showers Thou dost soften it, Its springing up Thou blessest.";
dby[10] = "Thou dost satiate its furrows, thou smoothest its clods, thou makest it soft with showers; thou blessest the springing thereof.";
web[10] = "Thou waterest the ridges of it abundantly: thou settlest the furrows of it: thou makest it soft with showers: thou blessest the springing of it.";
hnv[10] = "You drench its furrows. You level its ridges. You soften it with showers. You bless it with a crop.";
vul[10] = "[Vulgate 64:11] sulcos eius inebria multiplica fruges eius pluviis inriga eam et germini eius benedic";
kjv[11] = "Thou crownest the year with thy goodness; and thy paths drop fatness.";
rsv[11] = "Thou crownest the year with thy bounty; the tracks of thy chariot drip with fatness.";
asv[11] = "Thou crownest the year with thy goodness; And thy paths drop fatness. ";
yng[11] = "Thou hast crowned the year of Thy goodness, And Thy paths drop fatness.";
dby[11] = "Thou crownest the year with thy goodness, and thy paths drop fatness:";
web[11] = "Thou crownest the year with thy goodness; and thy paths drop fatness.";
hnv[11] = "You crown the year with your bounty. Your carts overflow with abundance.";
vul[11] = "[Vulgate 64:12] volvetur annus in bonitate tua et vestigia tua rorabunt pinguidine";
kjv[12] = "They drop [upon] the pastures of the wilderness: and the little hills rejoice on every side.";
rsv[12] = "The pastures of the wilderness drip, the hills gird themselves with joy,";
asv[12] = "They drop upon the pastures of the wilderness; And the hills are girded with joy. ";
yng[12] = "Drop do the pastures of a wilderness, And joy of the heights Thou girdest on.";
dby[12] = "They drop upon the pastures of the wilderness, and the hills are girded with gladness.";
web[12] = "They drop [upon] the pastures of the wilderness: and the little hills rejoice on every side.";
hnv[12] = "The wilderness grasslands overflow. The hills are clothed with gladness.";
vul[12] = "[Vulgate 64:13] pinguescent pascua deserti et exultatione colles accingentur";
kjv[13] = "The pastures are clothed with flocks; the valleys also are covered over with corn; they shout for joy, they also sing.";
rsv[13] = "the meadows clothe themselves with flocks, the valleys deck themselves with grain, they shout and sing together for joy.";
asv[13] = "The pastures are clothed with flocks; The valleys also are covered over with grain; They shout for joy, they also sing. ";
yng[13] = "Clothed have lambs the flock, And valleys are covered with corn, They shout -- yea, they sing!";
dby[13] = "The meadows are clothed with flocks, and the valleys are covered over with corn; they shout for joy, yea, they sing.";
web[13] = "The pastures are clothed with flocks; the valleys also are covered over with corn; they shout for joy, they also sing.";
hnv[13] = "The pastures are covered with flocks. The valleys also are clothed with grain. They shout for joy! They also sing. ";
vul[13] = "[Vulgate 64:14] vestientur agnis greges et valles plenae erunt frumento coaequabuntur et canent";
csb[1] = "Praise is rightfully yours, God, in Zion; vows to you will be fulfilled.";
csb[2] = "All humanity will come to you, the one who hears prayer.";
csb[3] = "Iniquities overwhelm me; only you can atone for our rebellions.";
csb[4] = "How happy is the one you choose and bring near to live in your courts! We will be satisfied with the goodness of your house, the holiness of your temple.";
csb[5] = "You answer us in righteousness, with awe-inspiring works, God of our salvation, the hope of all the ends of the earth and of the distant seas.";
csb[6] = "You establish the mountains by your power; you are robed with strength.";
csb[7] = "You silence the roar of the seas, the roar of their waves, and the tumult of the nations.";
csb[8] = "Those who live far away are awed by your signs; you make east and west shout for joy.";
csb[9] = "You visit the earth and water it abundantly, enriching it greatly. God\'s stream is filled with water, for you prepare the earth in this way, providing people with grain.";
csb[10] = "You soften it with showers and bless its growth, soaking its furrows and leveling its ridges.";
csb[11] = "You crown the year with your goodness; your carts overflow with plenty.";
csb[12] = "The wilderness pastures overflow, and the hills are robed with joy.";
csb[13] = "The pastures are clothed with flocks and the valleys covered with grain. They shout in triumph; indeed, they sing.";
</script>
