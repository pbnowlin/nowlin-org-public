kjv[1] = "[[To the chief Musician, Altaschith, Michtam of David; when Saul sent, and they watched the house to kill him.]] Deliver me from mine enemies, O my God: defend me from them that rise up against me.";
rsv[1] = "To the choirmaster: according to Do Not Destroy. A Miktam of David, when Saul sent men to watch his house in order to kill him. Deliver me from my enemies, O my God, protect me from those who rise up against me,";
asv[1] = "For the Chief Musician; [set to] Al-tashheth. [A Psalm] of David. Michtam; when Saul sent, and they watched the house to kill him. Deliver me from mine enemies, O my God: Set me on high from them that rise up against me. ";
yng[1] = "To the Overseer. -- `Destroy not,\' by David. -- A secret treasure, in Saul\'s sending, and they watch the house to put him to death. Deliver me from mine enemies, O my God, From my withstanders set me on high.";
dby[1] = "{To the chief Musician. \'Destroy not.\' Of David. Michtam; when Saul sent, and they watched the house to kill him.} Deliver me from mine enemies, O my God; secure me on high from them that rise up against me.";
web[1] = "To the chief Musician, Al-taschith, Michtam of David; when Saul sent, and they watched the house to kill him. Deliver me from my enemies, O my God: defend me from them that rise up against me.";
hnv[1] = "For the Chief Musician. To the tune &quot;Do Not Destroy.&quot; A miktam by David, when Sha\'ul sent, and they watched the house to kill him. Deliver me from my enemies, my God. Set me on high from those who rise up against me.";
vul[1] = "[Vulgate 58:1] victori ut non disperdas David humilem et simplicem quando misit Saul et custodierunt domum ut occiderent eum [Vulgate 58:2] erue me de inimicis meis Deus meus et a resistentibus mihi protege me";
kjv[2] = "Deliver me from the workers of iniquity, and save me from bloody men.";
rsv[2] = "deliver me from those who work evil, and save me from bloodthirsty men.";
asv[2] = "Deliver me from the workers of iniquity, And save me from the bloodthirsty men. ";
yng[2] = "Deliver me from workers of iniquity, And from men of blood save me.";
dby[2] = "Deliver me from the workers of iniquity, and save me from men of blood.";
web[2] = "Deliver me from the workers of iniquity, and save me from bloody men.";
hnv[2] = "Deliver me from the workers of iniquity. Save me from the bloodthirsty men.";
vul[2] = "[Vulgate 58:3] libera me ab operariis iniquitatis et a viris sanguinum salva me";
kjv[3] = "For, lo, they lie in wait for my soul: the mighty are gathered against me; not [for] my transgression, nor [for] my sin, O LORD.";
rsv[3] = "For, lo, they lie in wait for my life; fierce men band themselves against me. For no transgression or sin of mine, O LORD,";
asv[3] = "For, lo, they lie in wait for my soul; The mighty gather themselves together against me: Not for my transgression, nor for my sin, O Jehovah. ";
yng[3] = "For, lo, they laid wait for my soul, Assembled against me are strong ones, Not my transgression nor my sin, O Jehovah.";
dby[3] = "For behold, they lie in wait for my soul; strong ones are gathered against me: not for my transgression, nor for my sin, O Jehovah.";
web[3] = "For lo, they lie in wait for my soul: the mighty are gathered against me; not [for] my transgression, nor [for] my sin, O LORD.";
hnv[3] = "For, behold, they lie in wait for my soul. The mighty gather themselves together against me, Not for my disobedience, nor for my sin, LORD.";
vul[3] = "[Vulgate 58:4] quia ecce insidiati sunt animae meae congregantur adversum me fortissimi";
kjv[4] = "They run and prepare themselves without [my] fault: awake to help me, and behold.";
rsv[4] = "for no fault of mine, they run and make ready. Rouse thyself, come to my help, and see!";
asv[4] = "They run and prepare themselves without [my] fault: Awake thou to help me, and behold. ";
yng[4] = "Without punishment they run and prepare themselves, Stir up to meet me, and see.";
dby[4] = "They run and prepare themselves without [my] fault: awake to meet me, and behold.";
web[4] = "They run and prepare themselves without [my] fault: awake to help me, and behold.";
hnv[4] = "I have done no wrong, yet they are ready to attack me. Rise up, behold, and help me!";
vul[4] = "[Vulgate 58:5] absque iniquitate mea et absque peccato meo Domine non egi inique et illi currunt et praeparantur";
kjv[5] = "Thou therefore, O LORD God of hosts, the God of Israel, awake to visit all the heathen: be not merciful to any wicked transgressors. Selah.";
rsv[5] = "Thou, LORD God of hosts, art God of Israel. Awake to punish all the nations; spare none of those who treacherously plot evil. [Selah]";
asv[5] = "Even thou, O Jehovah God of hosts, the God of Israel, Arise to visit all the nations: Be not merciful to any wicked transgressors. [Selah";
yng[5] = "And Thou, Jehovah, God of Hosts, God of Israel, Awake to inspect all the nations. Favour not any treacherous dealers of iniquity. Selah.";
dby[5] = "Yea, do thou, Jehovah, the God of hosts, the God of Israel, arise to visit all the nations: be not gracious to any plotters of iniquity. Selah.";
web[5] = "Thou therefore, O LORD God of hosts, the God of Israel, awake to visit all the heathen: be not merciful to any wicked transgressors. Selah.";
hnv[5] = "You, LORD God Tzva\'ot, the God of Yisra\'el, Rouse yourself to punish the nations. Show no mercy to the wicked traitors. Selah.";
vul[5] = "[Vulgate 58:6] surge ex adverso pro me et respice et tu Domine Deus exercituum Deus Israhel evigila ut visites omnes gentes non miserearis universis qui operantur iniquitatem semper";
kjv[6] = "They return at evening: they make a noise like a dog, and go round about the city.";
rsv[6] = "Each evening they come back, howling like dogs and prowling about the city.";
asv[6] = "They return at evening, they howl like a dog, And go round about the city. ";
yng[6] = "They turn back at evening, They make a noise like a dog, And go round about the city.";
dby[6] = "They return in the evening; they howl like a dog, and go round about the city:";
web[6] = "They return at evening: they make a noise like a dog, and go about the city.";
hnv[6] = "They return at evening, howling like dogs, And prowl around the city.";
vul[6] = "[Vulgate 58:7] revertantur ad vesperam et latrent ut canis et circumeant civitatem";
kjv[7] = "Behold, they belch out with their mouth: swords [are] in their lips: for who, [say they], doth hear?";
rsv[7] = "There they are, bellowing with their mouths, and snarling with their lips-- for &quot;Who,&quot; they think, &quot;will hear us?&quot;";
asv[7] = "Behold, they belch out with their mouth; Swords are in their lips: For who, [say they], doth hear? ";
yng[7] = "Lo, they belch out with their mouths, Swords [are] in their lips, for `Who heareth?\'";
dby[7] = "Behold, they belch out with their mouth; swords are in their lips: for who [say they] doth hear?";
web[7] = "Behold, they belch out with their mouth: swords [are] in their lips: for who, [say they], doth hear?";
hnv[7] = "Behold, they spew with their mouth. Swords are in their lips, &quot;For,&quot; they say, &quot;who hears us?&quot;";
vul[7] = "[Vulgate 58:8] ecce loquuntur in ore suo gladii in labiis eorum quasi nemo audiat";
kjv[8] = "But thou, O LORD, shalt laugh at them; thou shalt have all the heathen in derision.";
rsv[8] = "But thou, O LORD, dost laugh at them; thou dost hold all the nations in derision.";
asv[8] = "But thou, O Jehovah, wilt laugh at them; Thou wilt have all the nations in derision. ";
yng[8] = "And Thou, O Jehovah dost laugh at them, Thou dost mock at all the nations.";
dby[8] = "But thou, Jehovah, wilt laugh at them; thou wilt have all the nations in derision.";
web[8] = "But thou, O LORD, shalt laugh at them; thou shalt have all the heathen in derision.";
hnv[8] = "But you, LORD, laugh at them. You scoff at all the nations.";
vul[8] = "[Vulgate 58:9] tu autem Domine deridebis eos subsannabis omnes gentes";
kjv[9] = "[Because of] his strength will I wait upon thee: for God [is] my defence.";
rsv[9] = "O my Strength, I will sing praises to thee; for thou, O God, art my fortress.";
asv[9] = " [Because of] his strength I will give heed unto thee; For God is my high tower. ";
yng[9] = "O my Strength, unto Thee I take heed, For God [is] my tower -- the God of my kindness.";
dby[9] = "Their strength! ... I will take heed to thee; for God is my high fortress.";
web[9] = "[Because of] his strength will I wait upon thee: for God [is] my defense.";
hnv[9] = "Oh, my Strength, I watch for you, For God is my high tower.";
vul[9] = "[Vulgate 58:10] fortitudinem meam ad te servabo quoniam tu Deus elevator meus";
kjv[10] = "The God of my mercy shall prevent me: God shall let me see [my desire] upon mine enemies.";
rsv[10] = "My God in his steadfast love will meet me; my God will let me look in triumph on my enemies.";
asv[10] = "My God with his lovingkindness will meet me: God will let me see [my desire] upon mine enemies. ";
yng[10] = "God doth go before me, He causeth me to look on mine enemies.";
dby[10] = "God, whose loving-kindness will come to meet me, -- God shall let me see [my desire] upon mine enemies.";
web[10] = "The God of my mercy will succor me: God will let me see [my desire] upon my enemies.";
hnv[10] = "My God will go before me with his lovingkindness. God will let me look at my enemies in triumph.";
vul[10] = "[Vulgate 58:11] Dei mei misericordia praeveniet me";
kjv[11] = "Slay them not, lest my people forget: scatter them by thy power; and bring them down, O Lord our shield.";
rsv[11] = "Slay them not, lest my people forget; make them totter by thy power, and bring them down, O Lord, our shield!";
asv[11] = "Slay them not, lest my people forget: Scatter them by thy power, and bring them down, O Lord our shield. ";
yng[11] = "Slay them not, lest my people forget, Shake them by Thy strength, And bring them down, O Lord our shield.";
dby[11] = "Slay them not, lest my people forget; by thy power make them wander, and bring them down, O Lord, our shield.";
web[11] = "Slay them not, lest my people forget: scatter them by thy power; and bring them down, O Lord our shield.";
hnv[11] = "Don\'t kill them, or my people may forget. Scatter them by your power, and bring them down, Lord our shield.";
vul[11] = "[Vulgate 58:12] Deus ostendit mihi in insidiatoribus meis ne occidas eos ne forte obliviscantur populi mei disperge eos in fortitudine tua et destrue eos protector noster Domine";
kjv[12] = "[For] the sin of their mouth [and] the words of their lips let them even be taken in their pride: and for cursing and lying [which] they speak.";
rsv[12] = "For the sin of their mouths, the words of their lips, let them be trapped in their pride. For the cursing and lies which they utter,";
asv[12] = " [For] the sin of their mouth, [and] the words of their lips, Let them even be taken in their pride, And for cursing and lying which they speak. ";
yng[12] = "The sin of their mouth [is] a word of their lips, And they are captured in their pride, And from the curse and lying they recount.";
dby[12] = "[Because of] the sin of their mouth, the word of their lips, let them even be taken in their pride; and because of cursing and lying which they speak.";
web[12] = "[For] the sin of their mouth [and] the words of their lips let them even be taken in their pride: and for cursing and lying [which] they speak.";
hnv[12] = "For the sin of their mouth, and the words of their lips, Let them be caught in their pride, For the curses and lies which they utter.";
vul[12] = "[Vulgate 58:13] in peccato oris sui in sermone labiorum suorum et capiantur in superbia sua maledictionem et mendacium narrantes";
kjv[13] = "Consume [them] in wrath, consume [them], that they [may] not [be]: and let them know that God ruleth in Jacob unto the ends of the earth. Selah.";
rsv[13] = "consume them in wrath, consume them till they are no more, that men may know that God rules over Jacob to the ends of the earth. [Selah]";
asv[13] = "Consume them in wrath, consume them, so that they shall be no more: And let them know that God ruleth in Jacob, Unto the ends of the earth. [Selah";
yng[13] = "Consume in fury, consume and they are not, And they know that God is ruling in Jacob, To the ends of the earth. Selah.";
dby[13] = "Make an end in wrath, make an end, that they may be no more; that they may know that God ruleth in Jacob, unto the ends of the earth. Selah.";
web[13] = "Consume [them] in wrath, consume [them], that they [may] not [be]: and let them know that God ruleth in Jacob to the ends of the earth. Selah.";
hnv[13] = "Consume them in wrath. Consume them, and they will be no more. Let them know that God rules in Ya`akov, To the ends of the eretz. Selah.";
vul[13] = "[Vulgate 58:14] consume in furore consume ut non subsistant et sciant quoniam Deus dominatur Iacob in finibus terrae semper";
kjv[14] = "And at evening let them return; [and] let them make a noise like a dog, and go round about the city.";
rsv[14] = "Each evening they come back, howling like dogs and prowling about the city.";
asv[14] = "And at evening let them return, let them howl like a dog, And go round about the city. ";
yng[14] = "And they turn back at evening, They make a noise like a dog, And they go round about the city.";
dby[14] = "And in the evening they shall return, they shall howl like a dog, and go round about the city.";
web[14] = "And at evening let them return; [and] let them make a noise like a dog, and go about the city.";
hnv[14] = "At evening let them return. Let them howl like a dog, and go around the city.";
vul[14] = "[Vulgate 58:15] et convertantur ad vesperam et latrent ut canis et circumeant civitatem";
kjv[15] = "Let them wander up and down for meat, and grudge if they be not satisfied.";
rsv[15] = "They roam about for food, and growl if they do not get their fill.";
asv[15] = "They shall wander up and down for food, And tarry all night if they be not satisfied. ";
yng[15] = "They -- they wander for food, If they are not satisfied -- then they murmur.";
dby[15] = "They shall wander about for meat, and stay all night if they be not satisfied.";
web[15] = "Let them wander up and down for food, and grudge if they are not satisfied.";
hnv[15] = "They shall wander up and down for food, And wait all night if they aren\'t satisfied.";
vul[15] = "[Vulgate 58:16] ipsi vagabuntur ut comedant et cum saturati non fuerint murmurabunt";
kjv[16] = "But I will sing of thy power; yea, I will sing aloud of thy mercy in the morning: for thou hast been my defence and refuge in the day of my trouble.";
rsv[16] = "But I will sing of thy might; I will sing aloud of thy steadfast love in the morning. For thou hast been to me a fortress and a refuge in the day of my distress.";
asv[16] = "But I will sing of thy strength; Yea, I will sing aloud of thy lovingkindness in the morning: For thou hast been my high tower, And a refuge in the day of my distress. ";
yng[16] = "And I -- I sing [of] Thy strength, And I sing at morn [of] Thy kindness, For thou hast been a tower to me, And a refuge for me in a day of adversity.";
dby[16] = "But as for me, I will sing of thy strength; yea, I will sing aloud of thy loving-kindness in the morning; for thou hast been to me a high fortress, and a refuge in the day of my trouble.";
web[16] = "But I will sing of thy power; yes, I will sing aloud of thy mercy in the morning: for thou hast been my defense and refuge in the day of my trouble.";
hnv[16] = "But I will sing of your strength. Yes, I will sing aloud of your lovingkindness in the morning. For you have been my high tower, A refuge in the day of my distress.";
vul[16] = "[Vulgate 58:17] ego autem cantabo imperium tuum et laudabo mane misericordiam tuam quoniam factus es fortitudo mea et refugium in die tribulationis meae";
kjv[17] = "Unto thee, O my strength, will I sing: for God [is] my defence, [and] the God of my mercy.";
rsv[17] = "O my Strength, I will sing praises to thee, for thou, O God, art my fortress, the God who shows me steadfast love.";
asv[17] = "Unto thee, O my strength, will I sing praises: For God is my high tower, the God of my mercy. ";
yng[17] = "O my Strength, unto Thee I sing praise, For God [is] my tower, the God of my kindness!";
dby[17] = "Unto thee, my strength, will I sing psalms; for God is my high fortress, the God of my mercy.";
web[17] = "To thee, O my strength, will I sing: for God [is] my defense, [and] the God of my mercy.";
hnv[17] = "To you, my strength, I will sing praises. For God is my high tower, the God of my mercy. ";
vul[17] = "[Vulgate 58:18] tibi cantabo quoniam Deus adiutor meus fortitudo mea Deus misericordia mea";
csb[1] = "Rescue me from my enemies, my God; protect me from those who rise up against me.";
csb[2] = "Rescue me from those who practice sin, and save me from men of bloodshed.";
csb[3] = "Because look, LORD, they set an ambush for me. Powerful men attack me, but not because of any sin or rebellion of mine.";
csb[4] = "For no fault of mine, they run and take up a position. Awake to help me, and take notice.";
csb[5] = "LORD God of Armies, you are the God of Israel. Rise up to punish all the nations; do not show favor to any wicked traitors. Selah";
csb[6] = "They return at evening, snarling like dogs and prowling around the city.";
csb[7] = "Look, they spew from their mouths -- sharp words from their lips. &quot;For who,&quot; they say, &quot;will hear? &quot;";
csb[8] = "But you laugh at them, LORD; you ridicule all the nations.";
csb[9] = "I will keep watch for you, my strength, because God is my stronghold.";
csb[10] = "My faithful God will come to meet me; God will let me look down on my adversaries.";
csb[11] = "Do not kill them; otherwise, my people will forget. By your power, make them homeless wanderers and bring them down, Lord, our shield.";
csb[12] = "For the sin of their mouths and the words of their lips, let them be caught in their pride. They utter curses and lies.";
csb[13] = "Consume them in rage; consume them until they are gone. Then people will know throughout the earth that God rules over Jacob. Selah";
csb[14] = "And they return at evening, snarling like dogs and prowling around the city.";
csb[15] = "They scavenge for food; they growl if they are not satisfied.";
csb[16] = "But I will sing of your strength and will joyfully proclaim your faithful love in the morning. For you have been a stronghold for me, a refuge in my day of trouble.";
csb[17] = "To you, my strength, I sing praises, because God is my stronghold -- my faithful God.";
</script>
