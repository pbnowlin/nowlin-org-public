csb[1] = "God, listen to my prayer and do not hide from my plea for help.";
csb[2] = "Pay attention to me and answer me. I am restless and in turmoil with my complaint,";
csb[3] = "because of the enemy\'s words, because of the pressure of the wicked. For they bring down disaster on me and harass me in anger.";
csb[4] = "My heart shudders within me; terrors of death sweep over me.";
csb[5] = "Fear and trembling grip me; horror has overwhelmed me.";
csb[6] = "I said, &quot;If only I had wings like a dove! I would fly away and find rest.";
csb[7] = "&quot;How far away I would flee; I would stay in the wilderness. Selah";
csb[8] = "&quot;I would hurry to my shelter from the raging wind and the storm.&quot;";
csb[9] = "Lord, confuse and confound their speech, for I see violence and strife in the city;";
csb[10] = "day and night they make the rounds on its walls. Crime and trouble are within it;";
csb[11] = "destruction is inside it; oppression and deceit never leave its marketplace.";
csb[12] = "Now it is not an enemy who insults me -- otherwise I could bear it; it is not a foe who rises up against me -- otherwise I could hide from him.";
csb[13] = "But it is you, a man who is my peer, my companion and good friend!";
csb[14] = "We used to have close fellowship; we walked with the crowd into the house of God.";
csb[15] = "Let death take them by surprise; let them go down to Sheol alive, because evil is in their homes and within them.";
csb[16] = "But I call to God, and the LORD will save me.";
csb[17] = "I complain and groan morning, noon, and night, and he hears my voice.";
csb[18] = "Though many are against me, he will redeem me from my battle unharmed.";
csb[19] = "God, the one enthroned from long ago, will hear and will humiliate them Selah because they do not change and do not fear God.";
csb[20] = "My friend acts violently against those at peace with him; he violates his covenant.";
csb[21] = "His buttery words are smooth, but war is in his heart. His words are softer than oil, but they are drawn swords.";
csb[22] = "Cast your burden on the LORD, and he will sustain you; he will never allow the righteous to be shaken.";
csb[23] = "God, you will bring them down to the Pit of destruction; men of bloodshed and treachery will not live out half their days. But I will trust in you.";
