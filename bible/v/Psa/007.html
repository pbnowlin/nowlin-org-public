<script type="text/javascript">
kjv = [];
csb = [];

web = [];

vul = [];
kjv[1] = "[[Shiggaion of David, which he sang unto the LORD, concerning the words of Cush the Benjamite.]] O LORD my God, in thee do I put my trust: save me from all them that persecute me, and deliver me:";
rsv[1] = "A Shiggaion of David, which he sang to the LORD concerning Cush a Benjaminite. O LORD my God, in thee do I take refuge; save me from all my pursuers, and deliver me,";
asv[1] = "[Shiggaion of David, which he sang unto Jehovah, concerning the words of Cush a Benjamite.] O Jehovah my God, in thee do I take refuge: Save me from all them that pursue me, and deliver me, ";
yng[1] = "`The Erring One,\' by David, that he sung to Jehovah concerning the words of Cush a Benjamite. O Jehovah, my God, in Thee I have trusted, Save me from all my pursuers, and deliver me.";
dby[1] = "{Shiggaion of David, which he sang to Jehovah, concerning the words of Cush the Benjaminite.} Jehovah my God, in thee have I trusted: save me from all my pursuers, and deliver me;";
web[1] = "Shiggaion of David, which he sang to the LORD, concerning the words of Cush the Benjaminite. O LORD my God, in thee do I put my trust: save me from all them that persecute me, and deliver me:";
hnv[1] = "A shiggayon by David, which he sang to the LORD, concerning the words of Kush, the Binyamini. LORD, my God, I take refuge in you. Save me from all those who pursue me, and deliver me,";
vul[1] = "pro ignoratione David quod cecinit Domino super verbis Aethiopis filii Iemini [Vulgate 7:2] Domine Deus meus in te speravi salva me ab omnibus persequentibus me et libera me";
kjv[2] = "Lest he tear my soul like a lion, rending [it] in pieces, while [there is] none to deliver.";
rsv[2] = "lest like a lion they rend me, dragging me away, with none to rescue.";
asv[2] = "Lest they tear my soul like a lion, Rending it in pieces, while there is none to deliver. ";
yng[2] = "Lest he tear as a lion my soul, Rending, and there is no deliverer.";
dby[2] = "Lest he tear my soul like a lion, crushing it while there is no deliverer.";
web[2] = "Lest he tear my soul like a lion, rending [it] in pieces, while [there is] none to deliver.";
hnv[2] = "Lest they tear apart my soul like a lion, Ripping it in pieces, while there is none to deliver.";
vul[2] = "[Vulgate 7:3] ne forte capiat ut leo animam meam laceret et non sit qui eruat";
kjv[3] = "O LORD my God, if I have done this; if there be iniquity in my hands;";
rsv[3] = "O LORD my God, if I have done this, if there is wrong in my hands,";
asv[3] = "O Jehovah my God, if I have done this; If there be iniquity in my hands; ";
yng[3] = "O Jehovah, my God, if I have done this, If there is iniquity in my hands,";
dby[3] = "Jehovah my God, if I have done this, if there be iniquity in my hands;";
web[3] = "O LORD my God, if I have done this; if there is iniquity in my hands;";
hnv[3] = "LORD, my God, if I have done this, If there is iniquity in my hands,";
vul[3] = "[Vulgate 7:4] Domine Deus meus si feci istud si est iniquitas in manibus meis";
kjv[4] = "If I have rewarded evil unto him that was at peace with me; (yea, I have delivered him that without cause is mine enemy:)";
rsv[4] = "if I have requited my friend with evil or plundered my enemy without cause,";
asv[4] = "If I have rewarded evil unto him that was at peace with me (Yea, I have delivered him that without cause was mine adversary;) ";
yng[4] = "If I have done my well-wisher evil, And draw mine adversary without cause,";
dby[4] = "If I have rewarded evil to him that was at peace with me; (indeed I have freed him that without cause oppressed me;)";
web[4] = "If I have rewarded evil to him that was at peace with me; (yes, I have delivered him that without cause is my enemy:)";
hnv[4] = "If I have rewarded evil to him who was at shalom with me (Yes, I have delivered him who without cause was my adversary),";
vul[4] = "[Vulgate 7:5] si reddidi retribuentibus mihi malum et dimisi hostes meos vacuos";
kjv[5] = "Let the enemy persecute my soul, and take [it]; yea, let him tread down my life upon the earth, and lay mine honour in the dust. Selah.";
rsv[5] = "let the enemy pursue me and overtake me, and let him trample my life to the ground, and lay my soul in the dust. [Selah]";
asv[5] = "Let the enemy pursue my soul, and overtake it; Yea, let him tread my life down to the earth, And lay my glory in the dust. [Selah";
yng[5] = "An enemy pursueth my soul, and overtaketh, And treadeth down to the earth my life, And my honour placeth in the dust. Selah.";
dby[5] = "Let the enemy pursue after my soul, and take [it], and let him tread down my life to the earth, and lay my glory in the dust. Selah.";
web[5] = "Let the enemy persecute my soul, and take [it]; yes, let him tread down my life upon the earth, and lay my honor in the dust. Selah.";
hnv[5] = "Let the enemy pursue my soul, and overtake it; Yes, let him tread my life down to the eretz, And lay my glory in the dust. Selah.";
vul[5] = "[Vulgate 7:6] persequatur inimicus animam meam et adprehendat et conculcet in terra vitam meam et gloriam meam in pulverem conlocet semper";
kjv[6] = "Arise, O LORD, in thine anger, lift up thyself because of the rage of mine enemies: and awake for me [to] the judgment [that] thou hast commanded.";
rsv[6] = "Arise, O LORD, in thy anger, lift thyself up against the fury of my enemies; awake, O my God; thou hast appointed a judgment.";
asv[6] = "Arise, O Jehovah, in thine anger; Lift up thyself against the rage of mine adversaries, And awake for me; thou hast commanded judgment. ";
yng[6] = "Rise, O Jehovah, in Thine anger, Be lifted up at the wrath of mine adversaries, And awake Thou for me: Judgment Thou hast commanded:";
dby[6] = "Arise, Jehovah, in thine anger; lift thyself up against the raging of mine oppressors, and awake for me: thou hast commanded judgment.";
web[6] = "Arise, O LORD, in thy anger, lift up thyself because of the rage of my enemies: and awake for me [to] the judgment [that] thou hast commanded.";
hnv[6] = "Arise, LORD, in your anger. Lift up yourself against the rage of my adversaries. Awake for me. You have commanded judgment.";
vul[6] = "[Vulgate 7:7] surge Domine in furore tuo elevare indignans super hostes meos et consurge ad me iudicio quod mandasti";
kjv[7] = "So shall the congregation of the people compass thee about: for their sakes therefore return thou on high.";
rsv[7] = "Let the assembly of the peoples be gathered about thee; and over it take thy seat on high.";
asv[7] = "And let the congregation of the peoples compass thee about; And over them return thou on high. ";
yng[7] = "And a company of peoples compass Thee, And over it on high turn Thou back,";
dby[7] = "And the assembly of the peoples shall encompass thee; and for their sakes return thou on high.";
web[7] = "So shall the congregation of the people encompass thee: for their sakes therefore return thou on high.";
hnv[7] = "Let the congregation of the peoples surround you. Rule over them on high.";
vul[7] = "[Vulgate 7:8] et congregatio tribuum circumdet te et pro hac in altum revertere";
kjv[8] = "The LORD shall judge the people: judge me, O LORD, according to my righteousness, and according to mine integrity [that is] in me.";
rsv[8] = "The LORD judges the peoples; judge me, O LORD, according to my righteousness and according to the integrity that is in me.";
asv[8] = "Jehovah ministereth judgment to the peoples: Judge me, O Jehovah, according to my righteousness, and to mine integrity that is in me. ";
yng[8] = "Jehovah doth judge the peoples; Judge me, O Jehovah, According to my righteousness, And according to mine integrity on me,";
dby[8] = "Jehovah shall minister judgment to the peoples. Judge me, Jehovah, according to my righteousness, and according to mine integrity which is in me.";
web[8] = "The LORD shall judge the people: judge me, O LORD, according to my righteousness, and according to my integrity [that is] in me.";
hnv[8] = "The LORD administers judgment to the peoples. Judge me, LORD, according to my righteousness, And to my integrity that is in me.";
vul[8] = "[Vulgate 7:9] Dominus iudicabit populos iudica me Domine secundum iustitiam meam et secundum simplicitatem meam quae est in me";
kjv[9] = "Oh let the wickedness of the wicked come to an end; but establish the just: for the righteous God trieth the hearts and reins.";
rsv[9] = "O let the evil of the wicked come to an end, but establish thou the righteous, thou who triest the minds and hearts, thou righteous God.";
asv[9] = "Oh let the wickedness of the wicked come to an end, but establish thou the righteous: For the righteous God trieth the minds and hearts. ";
yng[9] = "Let, I pray Thee be ended the evil of the wicked, And establish Thou the righteous, And a trier of hearts and reins is the righteous God.";
dby[9] = "Oh let the wrong of the wicked come to an end, and establish thou the righteous [man]; even thou that triest the hearts and reins, the righteous God.";
web[9] = "Oh let the wickedness of the wicked come to an end; but establish the just: for the righteous God trieth the hearts and reins.";
hnv[9] = "Oh let the wickedness of the wicked come to an end, But establish the righteous; Their minds and hearts are searched by the righteous God.";
vul[9] = "[Vulgate 7:10] consumatur malum iniquorum et confirmetur iustitia probator cordis et renum Deus iustus";
kjv[10] = "My defence [is] of God, which saveth the upright in heart.";
rsv[10] = "My shield is with God, who saves the upright in heart.";
asv[10] = "My shield is with God, Who saveth the upright in heart. ";
yng[10] = "My shield [is] on God, Saviour of the upright in heart!";
dby[10] = "My shield is with God, who saveth the upright in heart.";
web[10] = "My defense [is] from God, who saveth the upright in heart.";
hnv[10] = "My shield is with God, Who saves the upright in heart.";
vul[10] = "[Vulgate 7:11] clipeus meus in Deo qui salvat rectos corde";
kjv[11] = "God judgeth the righteous, and God is angry [with the wicked] every day.";
rsv[11] = "God is a righteous judge, and a God who has indignation every day.";
asv[11] = "God is a righteous judge, Yea, a God that hath indignation every day. ";
yng[11] = "God [is] a righteous judge, And He is not angry at all times.";
dby[11] = "God is a righteous judge, and a God who is indignant all the day.";
web[11] = "God judgeth the righteous, and God is angry [with the wicked] every day.";
hnv[11] = "God is a righteous judge, Yes, a God who has indignation every day.";
vul[11] = "[Vulgate 7:12] Deus iudex iustus et fortis comminans tota die";
kjv[12] = "If he turn not, he will whet his sword; he hath bent his bow, and made it ready.";
rsv[12] = "If a man does not repent, God will whet his sword; he has bent and strung his bow;";
asv[12] = "If a man turn not, he will whet his sword; He hath bent his bow, and made it ready; ";
yng[12] = "If [one] turn not, His sword he sharpeneth, His bow he hath trodden -- He prepareth it,";
dby[12] = "If one turn not, he will sharpen his sword; he hath bent his bow and made it ready,";
web[12] = "If he turn not, he will whet his sword; he hath bent his bow, and made it ready.";
hnv[12] = "If a man doesn\'t relent, he will sharpen his sword; He has bent and strung his bow.";
vul[12] = "[Vulgate 7:13] non convertenti gladium suum acuet arcum suum tetendit et paravit illum";
kjv[13] = "He hath also prepared for him the instruments of death; he ordaineth his arrows against the persecutors.";
rsv[13] = "he has prepared his deadly weapons, making his arrows fiery shafts.";
asv[13] = "He hath also prepared for him the instruments of death; He maketh his arrows fiery [shafts]. ";
yng[13] = "Yea, for him He hath prepared Instruments of death, His arrows for burning pursuers He maketh.";
dby[13] = "And he hath prepared for him instruments of death; his arrows hath he made burning.";
web[13] = "He hath also prepared for him the instruments of death; he ordaineth his arrows against the persecutors.";
hnv[13] = "He has also prepared for himself the instruments of death. He makes ready his flaming arrows.";
vul[13] = "[Vulgate 7:14] et in ipso praeparavit vasa mortis sagittas suas ad conburendum operatus est";
kjv[14] = "Behold, he travaileth with iniquity, and hath conceived mischief, and brought forth falsehood.";
rsv[14] = "Behold, the wicked man conceives evil, and is pregnant with mischief, and brings forth lies.";
asv[14] = "Behold, he travaileth with iniquity; Yea, he hath conceived mischief, and brought forth falsehood. ";
yng[14] = "Lo, he travaileth [with] iniquity, And he hath conceived perverseness, And hath brought forth falsehood.";
dby[14] = "Behold, he travaileth with iniquity, yea, he hath conceived mischief, and brought forth falsehood:";
web[14] = "Behold, he travaileth with iniquity, and hath conceived mischief, and brought forth falsehood.";
hnv[14] = "Behold, he travails with iniquity; Yes, he has conceived mischief, And brought forth falsehood.";
vul[14] = "[Vulgate 7:15] ecce parturit iniquitatem et concepto dolore peperit mendacium";
kjv[15] = "He made a pit, and digged it, and is fallen into the ditch [which] he made.";
rsv[15] = "He makes a pit, digging it out, and falls into the hole which he has made.";
asv[15] = "He hath made a pit, and digged it, And is fallen into the ditch which he made. ";
yng[15] = "A pit he hath prepared, and he diggeth it, And he falleth into a ditch he maketh.";
dby[15] = "He digged a pit, and hollowed it out, and is fallen into the hole that he made.";
web[15] = "He made a pit, and digged it, and hath fallen into the ditch [which] he made.";
hnv[15] = "He has dug a hole, And has fallen into the pit which he made.";
vul[15] = "[Vulgate 7:16] lacum aperuit et effodit eum et incidet in interitum quem operatus est";
kjv[16] = "His mischief shall return upon his own head, and his violent dealing shall come down upon his own pate.";
rsv[16] = "His mischief returns upon his own head, and on his own pate his violence descends.";
asv[16] = "His mischief shall return upon his own head, And his violence shall come down upon his own pate. ";
yng[16] = "Return doth his perverseness on his head, And on his crown his violence cometh down.";
dby[16] = "His mischief shall return upon his own head, and his violence shall come down upon his own pate.";
web[16] = "His mischief shall return upon his own head, and his violent dealing shall come down upon his own pate.";
hnv[16] = "The trouble he causes shall return to his own head. His violence shall come down on the crown of his own head.";
vul[16] = "[Vulgate 7:17] revertetur dolor suus in caput eius et super verticem eius iniquitas sua descendet";
kjv[17] = "I will praise the LORD according to his righteousness: and will sing praise to the name of the LORD most high.";
rsv[17] = "I will give to the LORD the thanks due to his righteousness, and I will sing praise to the name of the LORD, the Most High.";
asv[17] = "I will give thanks unto Jehovah according to his righteousness, And will sing praise to the name of Jehovah Most High. ";
yng[17] = "I thank Jehovah, According to His righteousness, And praise the name of Jehovah Most High!";
dby[17] = "I will praise Jehovah according to his righteousness, and will sing forth the name of Jehovah the Most High.";
web[17] = "I will praise the LORD according to his righteousness: and will sing praise to the name of the LORD most high.";
hnv[17] = "I will give thanks to the LORD according to his righteousness, And will sing praise to the name of the LORD Elyon. ";
vul[17] = "[Vulgate 7:18] confitebor Domino secundum iustitiam eius et cantabo nomini Domini altissimi";
csb[1] = "LORD my God, I seek refuge in you; save me from all my pursuers and rescue me";
csb[2] = "or they will tear me like a lion, ripping me apart with no one to rescue me.";
csb[3] = "LORD my God, if I have done this, if there is injustice on my hands,";
csb[4] = "if I have done harm to one at peace with me or have plundered my adversary without cause,";
csb[5] = "may an enemy pursue and overtake me; may he trample me to the ground and leave my honor in the dust. Selah";
csb[6] = "Rise up, LORD, in your anger; lift yourself up against the fury of my adversaries; awake for me; you have ordained a judgment.";
csb[7] = "Let the assembly of peoples gather around you; take your seat on high over it.";
csb[8] = "The LORD judges the peoples; vindicate me, LORD, according to my righteousness and my integrity.";
csb[9] = "Let the evil of the wicked come to an end, but establish the righteous. The one who examines the thoughts and emotions is a righteous God.";
csb[10] = "My shield is with God, who saves the upright in heart.";
csb[11] = "God is a righteous judge and a God who shows his wrath every day.";
csb[12] = "If anyone does not repent, he will sharpen his sword; he has strung his bow and made it ready.";
csb[13] = "He has prepared his deadly weapons; he tips his arrows with fire.";
csb[14] = "See, the wicked one is pregnant with evil, conceives trouble, and gives birth to deceit.";
csb[15] = "He dug a pit and hollowed it out but fell into the hole he had made.";
csb[16] = "His trouble comes back on his own head; his own violence comes down on top of his head.";
csb[17] = "I will thank the LORD for his righteousness; I will sing about the name of the LORD Most High.";
</script>
