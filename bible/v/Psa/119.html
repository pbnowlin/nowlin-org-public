vul[106] = "[Vulgate 118:106] iuravi et perseverabo ut custodiam iudicia iustitiae tuae";
kjv[107] = "BETH. Wherewithal shall a young man cleanse his way? by taking heed [thereto] according to thy word.";
rsv[107] = "I am sorely afflicted; give me life, O LORD, according to thy word!";
asv[107] = "I am afflicted very much: Quicken me, O Jehovah, according unto thy word. ";
yng[107] = "I have been afflicted very much, O Jehovah, quicken me, according to Thy word.";
dby[107] = "I am afflicted very much; O Jehovah, quicken me according to thy word.";
web[107] = "I am afflicted very much: revive me, O LORD, according to thy word.";
hnv[107] = "I am afflicted very much. Revive me, LORD, according to your word.";
vul[107] = "[Vulgate 118:107] adflictus sum usque nimis Domine vivifica me iuxta verbum tuum";
kjv[108] = "With my whole heart have I sought thee: O let me not wander from thy commandments.";
rsv[108] = "Accept my offerings of praise, O LORD, and teach me thy ordinances.";
asv[108] = "Accept, I beseech thee, the freewill-offerings of my mouth, O Jehovah, And teach me thine ordinances. ";
yng[108] = "Free-will-offerings of my mouth, Accept, I pray Thee, O Jehovah, And Thy judgments teach Thou me.";
dby[108] = "Accept, I beseech thee, Jehovah, the voluntary-offerings of my mouth, and teach me thy judgments.";
web[108] = "Accept, I beseech thee, the free-will-offerings of my mouth, O LORD, and teach me thy judgments.";
hnv[108] = "Accept, I beg you, the willing offerings of my mouth. LORD, teach me your ordinances.";
vul[108] = "[Vulgate 118:108] voluntaria oris mei conplaceant tibi Domine et secundum iudicia tua doce me";
kjv[109] = "Thy word have I hid in mine heart, that I might not sin against thee.";
rsv[109] = "I hold my life in my hand continually, but I do not forget thy law.";
asv[109] = "My soul is continually in my hand; Yet do I not forget thy law. ";
yng[109] = "My soul [is] in my hand continually, And Thy law I have not forgotten.";
dby[109] = "My life is continually in my hand; but I do not forget thy law.";
web[109] = "My soul [is] continually in my hand: yet I do not forget thy law.";
hnv[109] = "My soul is continually in my hand, Yet I won\'t forget your law.";
vul[109] = "[Vulgate 118:109] anima mea in manu mea semper et legis tuae non sum oblitus";
kjv[110] = "Blessed [art] thou, O LORD: teach me thy statutes.";
rsv[110] = "The wicked have laid a snare for me, but I do not stray from thy precepts.";
asv[110] = "The wicked have laid a snare for me; Yet have I not gone astray from thy precepts. ";
yng[110] = "The wicked have laid a snare for me, And from thy precepts I wandered not.";
dby[110] = "The wicked have laid a snare for me; but I have not wandered from thy precepts.";
web[110] = "The wicked have laid a snare for me: yet I erred not from thy precepts.";
hnv[110] = "The wicked have laid a snare for me, Yet I haven\'t gone astray from your precepts.";
vul[110] = "[Vulgate 118:110] posuerunt impii laqueum mihi et a praeceptis tuis non aberravi";
kjv[111] = "With my lips have I declared all the judgments of thy mouth.";
rsv[111] = "Thy testimonies are my heritage for ever; yea, they are the joy of my heart.";
asv[111] = "Thy testimonies have I taken as a heritage for ever; For they are the rejoicing of my heart. ";
yng[111] = "I have inherited Thy testimonies to the age, For the joy of my heart [are] they.";
dby[111] = "Thy testimonies have I taken as a heritage for ever; for they are the rejoicing of my heart.";
web[111] = "Thy testimonies have I taken as an heritage for ever: for they [are] the rejoicing of my heart.";
hnv[111] = "I have taken your testimonies as a heritage forever, For they are the joy of my heart.";
vul[111] = "[Vulgate 118:111] hereditas mea testimonia tua in sempiternum quia gaudium cordis mei sunt";
kjv[112] = "I have rejoiced in the way of thy testimonies, as [much as] in all riches.";
rsv[112] = "I incline my heart to perform thy statutes for ever, to the end.";
asv[112] = "I have inclined my heart to perform thy statutes For ever, even unto the end. ";
yng[112] = "I have inclined my heart To do Thy statutes, to the age -- [to] the end!";
dby[112] = "I have inclined my heart to perform thy statutes for ever, unto the end.";
web[112] = "I have inclined my heart to perform thy statutes always, [even to] the end.";
hnv[112] = "I have set my heart to perform your statutes forever, Even to the end. ";
vul[112] = "[Vulgate 118:112] inclinavi cor meum ut facerem iustitias tuas propter aeternam retributionem";
kjv[113] = "I will meditate in thy precepts, and have respect unto thy ways.";
rsv[113] = "I hate double-minded men, but I love thy law.";
asv[113] = "[SAMEKH.] I hate them that are of a double mind; But thy law do I love. ";
yng[113] = "[Samech.] Doubting ones I have hated, And Thy law I have loved.";
dby[113] = "SAMECH. The double-minded have I hated; but thy law do I love.";
web[113] = "SAMECH. I hate [vain] thoughts: but thy law do I love.";
hnv[113] = "SAMEKH I hate double-minded men, But I love your law.";
vul[113] = "[Vulgate 118:113] samech tumultuosos odivi et legem tuam dilexi";
kjv[114] = "I will delight myself in thy statutes: I will not forget thy word.";
rsv[114] = "Thou art my hiding place and my shield; I hope in thy word.";
asv[114] = "Thou art my hiding-place and my shield: I hope in thy word. ";
yng[114] = "My hiding place and my shield [art] Thou, For Thy word I have hoped.";
dby[114] = "Thou art my hiding-place and my shield: I hope in thy word.";
web[114] = "Thou [art] my hiding place and my shield: I hope in thy word.";
hnv[114] = "You are my hiding place and my shield. I hope in your word.";
vul[114] = "[Vulgate 118:114] protectio mea et scutum meum tu es verbum tuum expectavi";
kjv[115] = "GIMEL. Deal bountifully with thy servant, [that] I may live, and keep thy word.";
rsv[115] = "Depart from me, you evildoers, that I may keep the commandments of my God.";
asv[115] = "Depart from me, ye evil-doers, That I may keep the commandments of my God. ";
yng[115] = "Turn aside from me, ye evil-doers, And I keep the commands of my God.";
dby[115] = "Depart from me, ye evil-doers; and I will observe the commandments of my God.";
web[115] = "Depart from me, ye evil-doers: for I will keep the commandments of my God.";
hnv[115] = "Depart from me, you evildoers, That I may keep the mitzvot of my God.";
vul[115] = "[Vulgate 118:115] recedite a me maligni et custodiam mandata Dei mei";
kjv[116] = "Open thou mine eyes, that I may behold wondrous things out of thy law.";
rsv[116] = "Uphold me according to thy promise, that I may live, and let me not be put to shame in my hope!";
asv[116] = "Uphold me according unto thy word, that I may live; And let me not be ashamed of my hope. ";
yng[116] = "Sustain me according to Thy saying, And I live, and Thou puttest me not to shame Because of my hope.";
dby[116] = "Uphold me according to thy word, that I may live; and let me not be ashamed of my hope.";
web[116] = "Uphold me according to thy word, that I may live: and let me not be ashamed of my hope.";
hnv[116] = "Uphold me according to your word, that I may live. Let me not be ashamed of my hope.";
vul[116] = "[Vulgate 118:116] confirma me secundum verbum tuum et vivam et noli me confundere ab expectatione mea";
kjv[117] = "I [am] a stranger in the earth: hide not thy commandments from me.";
rsv[117] = "Hold me up, that I may be safe and have regard for thy statutes continually!";
asv[117] = "Hold thou me up, and I shall be safe, And shall have respect unto thy statutes continually. ";
yng[117] = "Support Thou me, and I am saved, And I look on Thy statutes continually.";
dby[117] = "Hold thou me up, and I shall be safe; and I will have respect unto thy statutes continually.";
web[117] = "Support me, and I shall be safe: and I will have respect to thy statutes continually.";
hnv[117] = "Hold me up, and I will be safe, And will have respect for your statutes continually.";
vul[117] = "[Vulgate 118:117] auxiliare mihi et salvus ero et delectabor in praeceptis tuis iugiter";
kjv[118] = "My soul breaketh for the longing [that it hath] unto thy judgments at all times.";
rsv[118] = "Thou dost spurn all who go astray from thy statutes; yea, their cunning is in vain.";
asv[118] = "Thou hast set at nought all them that err from thy statutes; For their deceit is falsehood. ";
yng[118] = "Thou hast trodden down All going astray from Thy statutes, For falsehood [is] their deceit.";
dby[118] = "Thou hast set at nought all them that wander from thy statutes; for their deceit is falsehood.";
web[118] = "Thou hast trodden down all them that err from thy statutes: for their deceit is falsehood.";
hnv[118] = "You reject all those who stray from your statutes, For their deceit is in vain.";
vul[118] = "[Vulgate 118:118] abiecisti omnes qui adversantur praecepta tua quia mendax cogitatio eorum";
kjv[119] = "Thou hast rebuked the proud [that are] cursed, which do err from thy commandments.";
rsv[119] = "All the wicked of the earth thou dost count as dross; therefore I love thy testimonies.";
asv[119] = "Thou puttest away all the wicked of the earth like dross: Therefore I love thy testimonies. ";
yng[119] = "Dross! Thou hast caused to cease All the wicked of the earth; Therefore I have loved Thy testimonies.";
dby[119] = "Thou puttest away all the wicked of the earth [like] dross; therefore I love thy testimonies.";
web[119] = "Thou puttest away all the wicked of the earth [like] dross: therefore I love thy testimonies.";
hnv[119] = "You put away all the wicked of the eretz like dross. Therefore I love your testimonies.";
vul[119] = "[Vulgate 118:119] quasi scoriam conputasti omnes impios terrae propterea dilexi testimonia tua";
kjv[120] = "Remove from me reproach and contempt; for I have kept thy testimonies.";
rsv[120] = "My flesh trembles for fear of thee, and I am afraid of thy judgments.";
asv[120] = "My flesh trembleth for fear of thee; And I am afraid of thy judgments. ";
yng[120] = "Trembled from Thy fear hath my flesh, And from Thy judgments I have been afraid!";
dby[120] = "My flesh shuddereth for fear of thee; and I am afraid of thy judgments.";
web[120] = "My flesh trembleth for fear of thee; and I am afraid of thy judgments.";
hnv[120] = "My flesh trembles for fear of you. I am afraid of your judgments. ";
vul[120] = "[Vulgate 118:120] horripilavit a timore tuo caro mea et iudicia tua timui";
kjv[121] = "Princes also did sit [and] speak against me: [but] thy servant did meditate in thy statutes.";
rsv[121] = "I have done what is just and right; do not leave me to my oppressors.";
asv[121] = "[AYIN.] I have done justice and righteousness: Leave me not to mine oppressors. ";
yng[121] = "[Ain.] I have done judgment and righteousness, Leave me not to mine oppressors.";
dby[121] = "AIN. I have done judgment and justice: leave me not to mine oppressors.";
web[121] = "AIN. I have done judgment and justice; leave me not to my oppressors.";
hnv[121] = "AYIN I have done what is just and righteous. Don\'t leave me to my oppressors.";
vul[121] = "[Vulgate 118:121] ain feci iudicium et iustitiam ne derelinquas me his qui calumniantur me";
kjv[122] = "Thy testimonies also [are] my delight [and] my counsellors.";
rsv[122] = "Be surety for thy servant for good; let not the godless oppress me.";
asv[122] = "Be surety for thy servant for good: Let not the proud oppress me. ";
yng[122] = "Make sure Thy servant for good, Let not the proud oppress me.";
dby[122] = "Be surety for thy servant for good; let not the proud oppress me.";
web[122] = "Be surety for thy servant for good: let not the proud oppress me.";
hnv[122] = "Ensure your servant\'s well-being. Don\'t let the proud oppress me.";
vul[122] = "[Vulgate 118:122] sponde pro servo tuo in bonum ne calumnientur me superbi";
kjv[123] = "DALETH. My soul cleaveth unto the dust: quicken thou me according to thy word.";
rsv[123] = "My eyes fail with watching for thy salvation, and for the fulfilment of thy righteous promise.";
asv[123] = "Mine eyes fail for thy salvation, And for thy righteous word. ";
yng[123] = "Mine eyes have been consumed for Thy salvation. And for the saying of Thy righteousness.";
dby[123] = "Mine eyes fail for thy salvation, and for the word of thy righteousness.";
web[123] = "My eyes fail for thy salvation, and for the word of thy righteousness.";
hnv[123] = "My eyes fail watching for your yeshu`ah, For your righteous word.";
vul[123] = "[Vulgate 118:123] oculi mei defecerunt in salutare tuum et in eloquium iustitiae tuae";
kjv[124] = "I have declared my ways, and thou heardest me: teach me thy statutes.";
rsv[124] = "Deal with thy servant according to thy steadfast love, and teach me thy statutes.";
asv[124] = "Deal with thy servant according unto thy lovingkindness, And teach me thy statutes. ";
yng[124] = "Do with Thy servant according to Thy kindness. And Thy statutes teach Thou me.";
dby[124] = "Deal with thy servant according to thy loving-kindness, and teach me thy statutes.";
web[124] = "Deal with thy servant according to thy mercy, and teach me thy statutes.";
hnv[124] = "Deal with your servant according to your lovingkindness. Teach me your statutes.";
vul[124] = "[Vulgate 118:124] fac cum servo tuo iuxta misericordiam tuam et praecepta tua doce me";
kjv[125] = "Make me to understand the way of thy precepts: so shall I talk of thy wondrous works.";
rsv[125] = "I am thy servant; give me understanding, that I may know thy testimonies!";
asv[125] = "I am thy servant; give me understanding, That I may know thy testimonies. ";
yng[125] = "Thy servant [am] I -- cause me to understand, And I know Thy testimonies.";
dby[125] = "I am thy servant; give me understanding that I may know thy testimonies.";
web[125] = "I [am] thy servant; give me understanding, that I may know thy testimonies.";
hnv[125] = "I am your servant. Give me understanding, That I may know your testimonies.";
vul[125] = "[Vulgate 118:125] servus tuus ego instrue me et cognoscam testimonia tua";
kjv[126] = "My soul melteth for heaviness: strengthen thou me according unto thy word.";
rsv[126] = "It is time for the LORD to act, for thy law has been broken.";
asv[126] = "It is time for Jehovah to work; [For] they have made void thy law. ";
yng[126] = "Time for Jehovah to work! they have made void Thy law.";
dby[126] = "It is time for Jehovah to work: they have made void thy law.";
web[126] = "[It is] time for [thee], LORD, to work: [for] they have made void thy law.";
hnv[126] = "It is time to act, LORD, For they break your law.";
vul[126] = "[Vulgate 118:126] tempus est ut facias Domine praevaricati sunt legem tuam";
kjv[127] = "Remove from me the way of lying: and grant me thy law graciously.";
rsv[127] = "Therefore I love thy commandments above gold, above fine gold.";
asv[127] = "Therefore I love thy commandments Above gold, yea, above fine gold. ";
yng[127] = "Therefore I have loved Thy commands Above gold -- even fine gold.";
dby[127] = "Therefore I love thy commandments above gold, yea, above fine gold.";
web[127] = "Therefore I love thy commandments above gold; yes, above fine gold.";
hnv[127] = "Therefore I love your mitzvot more than gold, Yes, more than pure gold.";
vul[127] = "[Vulgate 118:127] propterea dilexi mandata tua super aurum et topazium";
kjv[128] = "I have chosen the way of truth: thy judgments have I laid [before me].";
rsv[128] = "Therefore I direct my steps by all thy precepts; I hate every false way.";
asv[128] = "Therefore I esteem all [thy] precepts concerning all [things] to be right; [And] I hate every false way. ";
yng[128] = "Therefore all my appointments I have declared wholly right, Every path of falsehood I have hated!";
dby[128] = "Therefore I regard all [thy] precepts concerning all things to be right: I hate every false path.";
web[128] = "Therefore I esteem all [thy] precepts [concerning] all [things to be] right; [and] I hate every false way.";
hnv[128] = "Therefore I consider all of your precepts to be right. I hate every false way. ";
vul[128] = "[Vulgate 118:128] propterea in universa praecepta direxi omnem semitam mendacii odio habui";
kjv[129] = "I have stuck unto thy testimonies: O LORD, put me not to shame.";
rsv[129] = "Thy testimonies are wonderful; therefore my soul keeps them.";
asv[129] = "[PE.] Thy testimonies are wonderful; Therefore doth my soul keep them. ";
yng[129] = "[Pe.] Wonderful [are] Thy testimonies, Therefore hath my soul kept them.";
dby[129] = "PE. Thy testimonies are wonderful; therefore doth my soul observe them.";
web[129] = "PE. Thy testimonies [are] wonderful: therefore doth my soul keep them.";
hnv[129] = "PEY Your testimonies are wonderful, Therefore my soul keeps them.";
vul[129] = "[Vulgate 118:129] fe mirabilia testimonia tua idcirco custodivit ea anima mea";
kjv[130] = "I will run the way of thy commandments, when thou shalt enlarge my heart.";
rsv[130] = "The unfolding of thy words gives light; it imparts understanding to the simple.";
asv[130] = "The opening of thy words giveth light; It giveth understanding unto the simple. ";
yng[130] = "The opening of Thy words enlighteneth, Instructing the simple.";
dby[130] = "The entrance of thy words giveth light, giving understanding unto the simple.";
web[130] = "The entrance of thy words giveth light; it giveth understanding to the simple.";
hnv[130] = "The entrance of your words gives light. It gives understanding to the simple.";
vul[130] = "[Vulgate 118:130] ostium sermonum tuorum lucidum doce parvulos";
kjv[131] = "HE. Teach me, O LORD, the way of thy statutes; and I shall keep it [unto] the end.";
rsv[131] = "With open mouth I pant, because I long for thy commandments.";
asv[131] = "I opened wide my mouth, and panted; For I longed for thy commandments. ";
yng[131] = "My mouth I have opened, yea, I pant, For, for Thy commands I have longed.";
dby[131] = "I opened my mouth wide and panted; for I longed for thy commandments.";
web[131] = "I opened my mouth, and panted: for I longed for thy commandments.";
hnv[131] = "I opened my mouth wide and panted, For I longed for your mitzvot.";
vul[131] = "[Vulgate 118:131] os meum aperui et respiravi quia mandata tua desiderabam";
kjv[132] = "Give me understanding, and I shall keep thy law; yea, I shall observe it with [my] whole heart.";
rsv[132] = "Turn to me and be gracious to me, as is thy wont toward those who love thy name.";
asv[132] = "Turn thee unto me, and have mercy upon me, As thou usest to do unto those that love thy name. ";
yng[132] = "Look unto me, and favour me, As customary to those loving Thy name.";
dby[132] = "Turn unto me, and be gracious unto me, as thou art wont to do unto those that love thy name.";
web[132] = "Look thou upon me, and be merciful to me, as thou usest to do to those that love thy name.";
hnv[132] = "Turn to me, and have mercy on me, As you always do to those who love your name.";
vul[132] = "[Vulgate 118:132] respice ad me et miserere mei iuxta iudicium diligentium nomen tuum";
kjv[133] = "Make me to go in the path of thy commandments; for therein do I delight.";
rsv[133] = "Keep steady my steps according to thy promise, and let no iniquity get dominion over me.";
asv[133] = "Establish my footsteps in thy word; And let not any iniquity have dominion over me. ";
yng[133] = "My steps establish by Thy saying, And any iniquity doth not rule over me.";
dby[133] = "Establish my steps in thy word; and let not any iniquity have dominion over me.";
web[133] = "Order my steps in thy word: and let not any iniquity have dominion over me.";
hnv[133] = "Establish my footsteps in your word. Don\'t let any iniquity have dominion over me.";
vul[133] = "[Vulgate 118:133] gressus meos firma in sermone tuo et non des potestatem in me universae iniquitati";
kjv[134] = "Incline my heart unto thy testimonies, and not to covetousness.";
rsv[134] = "Redeem me from man\'s oppression, that I may keep thy precepts.";
asv[134] = "Redeem me from the oppression of man: So will I observe thy precepts. ";
yng[134] = "Ransom me from the oppression of man, And I observe Thy precepts,";
dby[134] = "Deliver me from the oppression of man; and I will keep thy precepts.";
web[134] = "Deliver me from the oppression of man: so will I keep thy precepts.";
hnv[134] = "Redeem me from the oppression of man, So I will observe your precepts.";
vul[134] = "[Vulgate 118:134] redime me a calumnia hominis et custodiam praecepta tua";
kjv[135] = "Turn away mine eyes from beholding vanity; [and] quicken thou me in thy way.";
rsv[135] = "Make thy face shine upon thy servant, and teach me thy statutes.";
asv[135] = "Make thy face to shine upon thy servant; And teach me thy statutes. ";
yng[135] = "Thy face cause to shine on Thy servant, And teach me Thy statutes.";
dby[135] = "Make thy face to shine upon thy servant, and teach me thy statutes.";
web[135] = "Make thy face to shine upon thy servant: and teach me thy statutes.";
hnv[135] = "Make your face shine on your servant. Teach me your statutes.";
vul[135] = "[Vulgate 118:135] vultum tuum ostende servo tuo et doce me praecepta tua";
kjv[136] = "Stablish thy word unto thy servant, who [is devoted] to thy fear.";
rsv[136] = "My eyes shed streams of tears, because men do not keep thy law.";
asv[136] = "Streams of water run down mine eyes, Because they observe not thy law. ";
yng[136] = "Rivulets of waters have come down mine eyes, Because they have not kept Thy law!";
dby[136] = "Mine eyes run down with streams of water, because they keep not thy law.";
web[136] = "Rivers of waters run down my eyes, because they keep not thy law.";
hnv[136] = "Streams of tears run down my eyes, Because they don\'t observe your law. ";
vul[136] = "[Vulgate 118:136] rivi aquarum fluebant de oculis meis quia non custodierunt legem tuam";
kjv[137] = "Turn away my reproach which I fear: for thy judgments [are] good.";
rsv[137] = "Righteous art thou, O LORD, and right are thy judgments.";
asv[137] = "[TSADHE.] Righteous art thou, O Jehovah, And upright are thy judgments. ";
yng[137] = "[Tzade.] Righteous [art] Thou, O Jehovah, And upright [are] Thy judgments.";
dby[137] = "TZADE. Righteous art thou, Jehovah, and upright are thy judgments.";
web[137] = "TSADDI. Righteous [art] thou, O LORD, and upright [are] thy judgments.";
hnv[137] = "TZADI You are righteous, LORD. Your judgments are upright.";
vul[137] = "[Vulgate 118:137] sade iustus es Domine et rectum iudicium tuum";
kjv[138] = "Behold, I have longed after thy precepts: quicken me in thy righteousness.";
rsv[138] = "Thou hast appointed thy testimonies in righteousness and in all faithfulness.";
asv[138] = "Thou hast commanded thy testimonies in righteousness And very faithfulness. ";
yng[138] = "Thou hast appointed Thy testimonies, Righteous and exceeding faithful,";
dby[138] = "Thou hast commanded thy testimonies in righteousness and exceeding faithfulness.";
web[138] = "Thy testimonies [that] thou hast commanded [are] righteous and very faithful.";
hnv[138] = "You have commanded your statutes in righteousness. They are fully trustworthy.";
vul[138] = "[Vulgate 118:138] praecepisti iustitiam testimonii tui et veritatem nimis";
kjv[139] = "VAU. Let thy mercies come also unto me, O LORD, [even] thy salvation, according to thy word.";
rsv[139] = "My zeal consumes me, because my foes forget thy words.";
asv[139] = "My zeal hath consumed me, Because mine adversaries have forgotten thy words. ";
yng[139] = "Cut me off hath my zeal, For mine adversaries forgot Thy words.";
dby[139] = "My zeal destroyeth me, because mine oppressors have forgotten thy words.";
web[139] = "My zeal hath consumed me; because my enemies have forgotten thy words.";
hnv[139] = "My zeal wears me out, Because my enemies ignore your words.";
vul[139] = "[Vulgate 118:139] consumpsit me zelus meus quia obliti sunt verborum tuorum hostes mei";
kjv[140] = "So shall I have wherewith to answer him that reproacheth me: for I trust in thy word.";
rsv[140] = "Thy promise is well tried, and thy servant loves it.";
asv[140] = "Thy word is very pure; Therefore thy servant loveth it. ";
yng[140] = "Tried [is] thy saying exceedingly, And Thy servant hath loved it.";
dby[140] = "Thy word is exceeding pure, and thy servant loveth it.";
web[140] = "Thy word [is] very pure: therefore thy servant loveth it.";
hnv[140] = "Your promises have been thoroughly tested, And your servant loves them.";
vul[140] = "[Vulgate 118:140] probatus sermo tuus nimis et servus tuus dilexit illum";
kjv[141] = "And take not the word of truth utterly out of my mouth; for I have hoped in thy judgments.";
rsv[141] = "I am small and despised, yet I do not forget thy precepts.";
asv[141] = "I am small and despised; [Yet] do I not forget thy precepts. ";
yng[141] = "Small I [am], and despised, Thy precepts I have not forgotten.";
dby[141] = "I am little and despised: thy precepts have I not forgotten.";
web[141] = "I [am] small and despised: [yet] I do not forget thy precepts.";
hnv[141] = "I am small and despised. I don\'t forget your precepts.";

dby[142] = "Thy righteousness is an everlasting righteousness, and thy law is truth.";
web[142] = "Thy righteousness [is] an everlasting righteousness, and thy law [is] the truth.";
hnv[142] = "Your righteousness is an everlasting righteousness. Your law is truth.";

asv[143] = "Trouble and anguish have taken hold on me; [Yet] thy commandments are my delight. ";

web[144] = "The righteousness of thy testimonies [is] everlasting: give me understanding, and I shall live.";
hnv[144] = "Your testimonies are righteous forever. Give me understanding, that I may live. ";

asv[146] = "I have called unto thee; save me, And I shall observe thy testimonies. ";
yng[146] = "I have called Thee, save Thou me, And I do keep Thy testimonies.";
dby[146] = "I call upon thee; save me, and I will keep thy testimonies.";
web[146] = "I cried to thee; save me, and I shall keep thy testimonies.";

asv[147] = "I anticipated the dawning of the morning, and cried: I hoped in thy words. ";
yng[147] = "I have gone forward in the dawn, and I cry, For Thy word I have hoped.";
dby[147] = "I anticipate the morning-dawn and I cry: I hope in thy word.";
web[147] = "I came before the dawning of the morning, and cried: I hoped in thy word.";
hnv[147] = "I rise before dawn and cry for help. I put my hope in your words.";
vul[147] = "[Vulgate 118:147] surgebam adhuc in tenebris et clamabam verbum tuum expectans";

hnv[148] = "My eyes stay open through the night watches, That I might meditate on your word.";
vul[148] = "[Vulgate 118:148] praeveniebant oculi mei vigilias ut meditarer in sermonibus tuis";
kjv[149] = "The proud have had me greatly in derision: [yet] have I not declined from thy law.";
rsv[149] = "Hear my voice in thy steadfast love; O LORD, in thy justice preserve my life.";
asv[149] = "Hear my voice according unto thy lovingkindness: Quicken me, O Jehovah, according to thine ordinances. ";

dby[149] = "Hear my voice according to thy loving-kindness: O Jehovah, quicken me according to thy judgment.";
web[149] = "Hear my voice, according to thy loving-kindness: O LORD, revive me according to thy judgment.";
hnv[149] = "Hear my voice according to your lovingkindness. Revive me, LORD, according to your ordinances.";
vul[149] = "[Vulgate 118:149] vocem meam audi iuxta misericordiam tuam Domine secundum iudicium tuum vivifica me";

hnv[150] = "They draw near who follow after wickedness. They are far from your law.";

yng[151] = "Near [art] Thou, O Jehovah, And all Thy commands [are] truth.";
dby[151] = "Thou, Jehovah, art near, and all thy commandments are truth.";
web[151] = "Thou [art] near, O LORD; and all thy commandments [are] truth.";

asv[152] = "Of old have I known from thy testimonies, That thou hast founded them for ever. ";
yng[152] = "Of old I have known Thy testimonies, That to the age Thou hast founded them!";
dby[152] = "From thy testimonies, I have known of old that thou hast founded them for ever.";
web[152] = "Concerning thy testimonies, I have known of old that thou hast founded them for ever.";
hnv[152] = "Of old I have known from your testimonies, That you have founded them forever. ";

dby[153] = "RESH. See mine affliction, and deliver me; for I have not forgotten thy law.";
web[153] = "RESH. Consider my affliction, and deliver me: for I do not forget thy law.";
hnv[153] = "RESH Consider my affliction, and deliver me, For I don\'t forget your law.";

kjv[154] = "This I had, because I kept thy precepts.";

dby[154] = "Plead my cause, and redeem me: quicken me according to thy word.";
web[154] = "Plead my cause, and deliver me: revive me according to thy word.";

dby[155] = "Salvation is far from the wicked; for they seek not thy statutes.";
web[155] = "Salvation [is] far from the wicked: for they seek not thy statutes.";
hnv[155] = "Salvation is far from the wicked, For they don\'t seek your statutes.";

dby[156] = "Many are thy tender mercies, O Jehovah; quicken me according to thy judgments.";
web[156] = "Great [are] thy tender mercies, O LORD: revive me according to thy judgments.";
hnv[156] = "Great are your tender mercies, LORD. Revive me according to your ordinances.";

dby[161] = "SHIN. Princes have persecuted me without a cause; but my heart standeth in awe of thy word.";
web[161] = "SCHIN. Princes have persecuted me without a cause; but my heart standeth in awe of thy word.";

dby[162] = "I have joy in thy word, as one that findeth great spoil.";
web[162] = "I rejoice at thy word, as one that findeth great spoil.";
hnv[162] = "I rejoice at your word, As one who finds great spoil.";

web[170] = "Let my supplication come before thee: deliver me according to thy word.";

dby[171] = "My lips shall pour forth praise when thou hast taught me thy statutes.";
web[171] = "My lips shall utter praise, when thou hast taught me thy statutes.";
hnv[171] = "Let my lips utter praise, For you teach me your statutes.";

web[173] = "Let thy hand help me; for I have chosen thy precepts.";
hnv[173] = "Let your hand be ready to help me, For I have chosen your precepts.";

hnv[174] = "I have longed for your yeshu`ah, LORD. Your law is my delight.";

dby[175] = "Let my soul live, and it shall praise thee; and let thy judgments help me.";
web[175] = "Let my soul live, and it shall praise thee; and let thy judgments help me.";

dby[176] = "I have gone astray like a lost sheep: seek thy servant; for I have not forgotten thy commandments.";
web[176] = "I have gone astray like a lost sheep; seek thy servant; for I do not forget thy commandments.";
hnv[176] = "I have gone astray like a lost sheep. Seek your servant, for I don\'t forget your mitzvot. ";
vul[176] = "[Vulgate 118:176] erravi quasi ovis perdita quaere servum tuum quia mandatorum tuorum non sum oblitus";
csb[1] = "How happy are those whose way is blameless, who walk according to the LORD\'s instruction!";
csb[2] = "Happy are those who keep his decrees and seek him with all their heart.";
csb[3] = "They do nothing wrong; they walk in his ways.";
csb[4] = "You have commanded that your precepts be diligently kept.";
csb[5] = "If only my ways were committed to keeping your statutes!";
csb[6] = "Then I would not be ashamed when I think about all your commands.";
csb[7] = "I will praise you with an upright heart when I learn your righteous judgments.";
csb[8] = "I will keep your statutes; never abandon me.";
csb[9] = "How can a young man keep his way pure? By keeping your word.";
csb[10] = "I have sought you with all my heart; don\'t let me wander from your commands.";
csb[11] = "I have treasured your word in my heart so that I may not sin against you.";
csb[12] = "LORD, may you be blessed; teach me your statutes.";
csb[13] = "With my lips I proclaim all the judgments from your mouth.";
csb[14] = "I rejoice in the way revealed by your decrees as much as in all riches.";
csb[15] = "I will meditate on your precepts and think about your ways.";
csb[16] = "I will delight in your statutes; I will not forget your word.";
csb[17] = "Deal generously with your servant so that I might live; then I will keep your word.";
csb[18] = "Open my eyes so that I may contemplate wondrous things from your instruction.";
csb[19] = "I am a resident alien on earth; do not hide your commands from me.";
csb[20] = "I am continually overcome with longing for your judgments.";
csb[21] = "You rebuke the arrogant, the ones under a curse, who wander from your commands.";
csb[22] = "Take insult and contempt away from me, for I have kept your decrees.";
csb[23] = "Though princes sit together speaking against me, your servant will think about your statutes;";
csb[24] = "your decrees are my delight and my counselors.";
csb[25] = "My life is down in the dust; give me life through your word.";
csb[26] = "I told you about my life, and you answered me; teach me your statutes.";
csb[27] = "Help me understand the meaning of your precepts so that I can meditate on your wonders.";
csb[28] = "I am weary from grief; strengthen me through your word.";
csb[29] = "Keep me from the way of deceit and graciously give me your instruction.";
csb[30] = "I have chosen the way of truth; I have set your ordinances before me.";
csb[31] = "I cling to your decrees; LORD, do not put me to shame.";
csb[32] = "I pursue the way of your commands, for you broaden my understanding.";
csb[33] = "Teach me, LORD, the meaning of your statutes, and I will always keep them.";
csb[34] = "Help me understand your instruction, and I will obey it and follow it with all my heart.";
csb[35] = "Help me stay on the path of your commands, for I take pleasure in it.";
csb[36] = "Turn my heart to your decrees and not to dishonest profit.";
csb[37] = "Turn my eyes from looking at what is worthless; give me life in your ways.";
csb[38] = "Confirm what you said to your servant, for it produces reverence for you.";
csb[39] = "Turn away the disgrace I dread; indeed, your judgments are good.";
csb[40] = "How I long for your precepts! Give me life through your righteousness.";
csb[41] = "Let your faithful love come to me, LORD, your salvation, as you promised.";
csb[42] = "Then I can answer the one who taunts me, for I trust in your word.";
csb[43] = "Never take the word of truth from my mouth, for I hope in your judgments.";
csb[44] = "I will always obey your instruction, forever and ever.";
csb[45] = "I will walk freely in an open place because I study your precepts.";
csb[46] = "I will speak of your decrees before kings and not be ashamed.";
csb[47] = "I delight in your commands, which I love.";
csb[48] = "I will lift up my hands to your commands, which I love, and will meditate on your statutes.";
csb[49] = "Remember your word to your servant; you have given me hope through it.";
csb[50] = "This is my comfort in my affliction: Your promise has given me life.";
csb[51] = "The arrogant constantly ridicule me, but I do not turn away from your instruction.";
csb[52] = "LORD, I remember your judgments from long ago and find comfort.";
csb[53] = "Rage seizes me because of the wicked who reject your instruction.";
csb[54] = "Your statutes are the theme of my song during my earthly life.";
csb[55] = "LORD, I remember your name in the night, and I obey your instruction.";
csb[56] = "This is my practice: I obey your precepts.";
csb[57] = "The LORD is my portion; I have promised to keep your words.";
csb[58] = "I have sought your favor with all my heart; be gracious to me according to your promise.";
csb[59] = "I thought about my ways and turned my steps back to your decrees.";
csb[60] = "I hurried, not hesitating to keep your commands.";
csb[61] = "Though the ropes of the wicked were wrapped around me, I did not forget your instruction.";
csb[62] = "I rise at midnight to thank you for your righteous judgments.";
csb[63] = "I am a friend to all who fear you, to those who keep your precepts.";
csb[64] = "LORD, the earth is filled with your faithful love; teach me your statutes.";
csb[65] = "LORD, you have treated your servant well, just as you promised.";
csb[66] = "Teach me good judgment and discernment, for I rely on your commands.";
csb[67] = "Before I was afflicted I went astray, but now I keep your word.";
csb[68] = "You are good, and you do what is good; teach me your statutes.";
csb[69] = "The arrogant have smeared me with lies, but I obey your precepts with all my heart.";
csb[70] = "Their hearts are hard and insensitive, but I delight in your instruction.";
csb[71] = "It was good for me to be afflicted so that I could learn your statutes.";
csb[72] = "Instruction from your lips is better for me than thousands of gold and silver pieces.";
csb[73] = "Your hands made me and formed me; give me understanding so that I can learn your commands.";
csb[74] = "Those who fear you will see me and rejoice, for I put my hope in your word.";
csb[75] = "I know, LORD, that your judgments are just and that you have afflicted me fairly.";
csb[76] = "May your faithful love comfort me as you promised your servant.";
csb[77] = "May your compassion come to me so that I may live, for your instruction is my delight.";
csb[78] = "Let the arrogant be put to shame for slandering me with lies; I will meditate on your precepts.";
csb[79] = "Let those who fear you, those who know your decrees, turn to me.";
csb[80] = "May my heart be blameless regarding your statutes so that I will not be put to shame.";
csb[81] = "I long for your salvation; I put my hope in your word.";
csb[82] = "My eyes grow weary looking for what you have promised; I ask, &quot;When will you comfort me? &quot;";
csb[83] = "Though I have become like a wineskin dried by smoke, I do not forget your statutes.";
csb[84] = "How many days must your servant wait? When will you execute judgment on my persecutors?";
csb[85] = "The arrogant have dug pits for me; they violate your instruction.";
csb[86] = "All your commands are true; people persecute me with lies -- help me!";
csb[87] = "They almost ended my life on earth, but I did not abandon your precepts.";
csb[88] = "Give me life in accordance with your faithful love, and I will obey the decree you have spoken.";
csb[89] = "LORD, your word is forever; it is firmly fixed in heaven.";
csb[90] = "Your faithfulness is for all generations; you established the earth, and it stands firm.";
csb[91] = "Your judgments stand firm today, for all things are your servants.";
csb[92] = "If your instruction had not been my delight, I would have died in my affliction.";
csb[93] = "I will never forget your precepts, for you have given me life through them.";
csb[94] = "I am yours; save me, for I have studied your precepts.";
csb[95] = "The wicked hope to destroy me, but I contemplate your decrees.";
csb[96] = "I have seen a limit to all perfection, but your command is without limit.";
csb[97] = "How I love your instruction! It is my meditation all day long.";
csb[98] = "Your commands make me wiser than my enemies, for they are always with me.";
csb[99] = "I have more insight than all my teachers because your decrees are my meditation.";
csb[100] = "I understand more than the elders because I obey your precepts.";
csb[101] = "I have kept my feet from every evil path to follow your word.";
csb[102] = "I have not turned from your judgments, for you yourself have instructed me.";
csb[103] = "How sweet your word is to my taste -- sweeter than honey in my mouth.";
csb[104] = "I gain understanding from your precepts; therefore I hate every false way.";
csb[105] = "Your word is a lamp for my feet and a light on my path.";
csb[106] = "I have solemnly sworn to keep your righteous judgments.";
csb[107] = "I am severely afflicted; LORD, give me life according to your word.";
csb[108] = "LORD, please accept my freewill offerings of praise, and teach me your judgments.";
csb[109] = "My life is constantly in danger, yet I do not forget your instruction.";
csb[110] = "The wicked have set a trap for me, but I have not wandered from your precepts.";
csb[111] = "I have your decrees as a heritage forever; indeed, they are the joy of my heart.";
csb[112] = "I am resolved to obey your statutes to the very end.";
csb[113] = "I hate those who are double-minded, but I love your instruction.";
csb[114] = "You are my shelter and my shield; I put my hope in your word.";
csb[115] = "Depart from me, you evil ones, so that I may obey my God\'s commands.";
csb[116] = "Sustain me as you promised, and I will live; do not let me be ashamed of my hope.";
csb[117] = "Sustain me so that I can be safe and always be concerned about your statutes.";
csb[118] = "You reject all who stray from your statutes, for their deceit is a lie.";
csb[119] = "You remove all the wicked on earth as if they were dross from metal; therefore, I love your decrees.";
csb[120] = "I tremble in awe of you; I fear your judgments.";
csb[121] = "I have done what is just and right; do not leave me to my oppressors.";
csb[122] = "Guarantee your servant\'s well-being; do not let the arrogant oppress me.";
csb[123] = "My eyes grow weary looking for your salvation and for your righteous promise.";
csb[124] = "Deal with your servant based on your faithful love; teach me your statutes.";
csb[125] = "I am your servant; give me understanding so that I may know your decrees.";
csb[126] = "It is time for the LORD to act, for they have violated your instruction.";
csb[127] = "Since I love your commands more than gold, even the purest gold,";
csb[128] = "I carefully follow all your precepts and hate every false way.";
csb[129] = "Your decrees are wondrous; therefore I obey them.";
csb[130] = "The revelation of your words brings light and gives understanding to the inexperienced.";
csb[131] = "I open my mouth and pant because I long for your commands.";
csb[132] = "Turn to me and be gracious to me, as is your practice toward those who love your name.";
csb[133] = "Make my steps steady through your promise; don\'t let any sin dominate me.";
csb[134] = "Redeem me from human oppression, and I will keep your precepts.";
csb[135] = "Make your face shine on your servant, and teach me your statutes.";
csb[136] = "My eyes pour out streams of tears because people do not follow your instruction.";
csb[137] = "You are righteous, LORD, and your judgments are just.";
csb[138] = "The decrees you issue are righteous and altogether trustworthy.";
csb[139] = "My anger overwhelms me because my foes forget your words.";
csb[140] = "Your word is completely pure, and your servant loves it.";
csb[141] = "I am insignificant and despised, but I do not forget your precepts.";
csb[142] = "Your righteousness is an everlasting righteousness, and your instruction is true.";
csb[143] = "Trouble and distress have overtaken me, but your commands are my delight.";
csb[144] = "Your decrees are righteous forever. Give me understanding, and I will live.";
csb[145] = "I call with all my heart; answer me, LORD. I will obey your statutes.";
csb[146] = "I call to you; save me, and I will keep your decrees.";
csb[147] = "I rise before dawn and cry out for help; I put my hope in your word.";
csb[148] = "I am awake through each watch of the night to meditate on your promise.";
csb[149] = "In keeping with your faithful love, hear my voice. LORD, give me life in keeping with your justice.";
csb[150] = "Those who pursue evil plans come near; they are far from your instruction.";
csb[151] = "You are near, LORD, and all your commands are true.";
csb[152] = "Long ago I learned from your decrees that you have established them forever.";
csb[153] = "Consider my affliction and rescue me, for I have not forgotten your instruction.";
csb[154] = "Champion my cause and redeem me; give me life as you promised.";
csb[155] = "Salvation is far from the wicked because they do not study your statutes.";
csb[156] = "Your compassions are many, LORD; give me life according to your judgments.";
csb[157] = "My persecutors and foes are many. I have not turned from your decrees.";
csb[158] = "I have seen the disloyal and feel disgust because they do not keep your word.";
csb[159] = "Consider how I love your precepts; LORD, give me life according to your faithful love.";
csb[160] = "The entirety of your word is truth, each of your righteous judgments endures forever.";
csb[161] = "Princes have persecuted me without cause, but my heart fears only your word.";
csb[162] = "I rejoice over your promise like one who finds vast treasure.";
csb[163] = "I hate and abhor falsehood, but I love your instruction.";
csb[164] = "I praise you seven times a day for your righteous judgments.";
csb[165] = "Abundant peace belongs to those who love your instruction; nothing makes them stumble.";
csb[166] = "LORD, I hope for your salvation and carry out your commands.";
csb[167] = "I obey your decrees and love them greatly.";
csb[168] = "I obey your precepts and decrees, for all my ways are before you.";
csb[169] = "Let my cry reach you, LORD; give me understanding according to your word.";
csb[170] = "Let my plea reach you; rescue me according to your promise.";
csb[171] = "My lips pour out praise, for you teach me your statutes.";
csb[172] = "My tongue sings about your promise, for all your commands are righteous.";
csb[173] = "May your hand be ready to help me, for I have chosen your precepts.";
csb[174] = "I long for your salvation, LORD, and your instruction is my delight.";
csb[175] = "Let me live, and I will praise you; may your judgments help me.";
csb[176] = "I wander like a lost sheep; seek your servant, for I do not forget your commands.";
kjv[1] = "ALEPH. Blessed [are] the undefiled in the way, who walk in the law of the LORD.";
kjv[2] = "Blessed [are] they that keep his testimonies, [and that] seek him with the whole heart.";
kjv[3] = "They also do no iniquity: they walk in his ways.";
kjv[4] = "Thou hast commanded [us] to keep thy precepts diligently.";
kjv[5] = "O that my ways were directed to keep thy statutes!";
kjv[6] = "Then shall I not be ashamed, when I have respect unto all thy commandments.";
kjv[7] = "I will praise thee with uprightness of heart, when I shall have learned thy righteous judgments.";
kjv[8] = "I will keep thy statutes: O forsake me not utterly.";
kjv[9] = "BETH. Wherewithal shall a young man cleanse his way? by taking heed [thereto] according to thy word.";
kjv[10] = "With my whole heart have I sought thee: O let me not wander from thy commandments.";
kjv[11] = "Thy word have I hid in mine heart, that I might not sin against thee.";
kjv[12] = "Blessed [art] thou, O LORD: teach me thy statutes.";
kjv[13] = "With my lips have I declared all the judgments of thy mouth.";
kjv[14] = "I have rejoiced in the way of thy testimonies, as [much as] in all riches.";
kjv[15] = "I will meditate in thy precepts, and have respect unto thy ways.";
kjv[16] = "I will delight myself in thy statutes: I will not forget thy word.";
kjv[17] = "GIMEL. Deal bountifully with thy servant, [that] I may live, and keep thy word.";
kjv[18] = "Open thou mine eyes, that I may behold wondrous things out of thy law.";
kjv[19] = "I [am] a stranger in the earth: hide not thy commandments from me.";
kjv[20] = "My soul breaketh for the longing [that it hath] unto thy judgments at all times.";
kjv[21] = "Thou hast rebuked the proud [that are] cursed, which do err from thy commandments.";
kjv[22] = "Remove from me reproach and contempt; for I have kept thy testimonies.";
kjv[23] = "Princes also did sit [and] speak against me: [but] thy servant did meditate in thy statutes.";
kjv[24] = "Thy testimonies also [are] my delight [and] my counsellors.";
kjv[25] = "DALETH. My soul cleaveth unto the dust: quicken thou me according to thy word.";
kjv[26] = "I have declared my ways, and thou heardest me: teach me thy statutes.";
kjv[27] = "Make me to understand the way of thy precepts: so shall I talk of thy wondrous works.";
kjv[28] = "My soul melteth for heaviness: strengthen thou me according unto thy word.";
kjv[29] = "Remove from me the way of lying: and grant me thy law graciously.";
kjv[30] = "I have chosen the way of truth: thy judgments have I laid [before me].";
kjv[31] = "I have stuck unto thy testimonies: O LORD, put me not to shame.";
kjv[32] = "I will run the way of thy commandments, when thou shalt enlarge my heart.";
kjv[33] = "HE. Teach me, O LORD, the way of thy statutes; and I shall keep it [unto] the end.";
kjv[34] = "Give me understanding, and I shall keep thy law; yea, I shall observe it with [my] whole heart.";
kjv[35] = "Make me to go in the path of thy commandments; for therein do I delight.";
kjv[36] = "Incline my heart unto thy testimonies, and not to covetousness.";
kjv[37] = "Turn away mine eyes from beholding vanity; [and] quicken thou me in thy way.";
kjv[38] = "Stablish thy word unto thy servant, who [is devoted] to thy fear.";
kjv[39] = "Turn away my reproach which I fear: for thy judgments [are] good.";
kjv[40] = "Behold, I have longed after thy precepts: quicken me in thy righteousness.";
kjv[41] = "VAU. Let thy mercies come also unto me, O LORD, [even] thy salvation, according to thy word.";
kjv[42] = "So shall I have wherewith to answer him that reproacheth me: for I trust in thy word.";
kjv[43] = "And take not the word of truth utterly out of my mouth; for I have hoped in thy judgments.";
kjv[44] = "So shall I keep thy law continually for ever and ever.";
kjv[45] = "And I will walk at liberty: for I seek thy precepts.";
kjv[46] = "I will speak of thy testimonies also before kings, and will not be ashamed.";
kjv[47] = "And I will delight myself in thy commandments, which I have loved.";
kjv[48] = "My hands also will I lift up unto thy commandments, which I have loved; and I will meditate in thy statutes.";
kjv[49] = "ZAIN. Remember the word unto thy servant, upon which thou hast caused me to hope.";
kjv[50] = "This [is] my comfort in my affliction: for thy word hath quickened me.";
kjv[51] = "The proud have had me greatly in derision: [yet] have I not declined from thy law.";
kjv[52] = "I remembered thy judgments of old, O LORD; and have comforted myself.";
kjv[53] = "Horror hath taken hold upon me because of the wicked that forsake thy law.";
kjv[54] = "Thy statutes have been my songs in the house of my pilgrimage.";
kjv[55] = "I have remembered thy name, O LORD, in the night, and have kept thy law.";
kjv[56] = "This I had, because I kept thy precepts.";
kjv[57] = "CHETH. [Thou art] my portion, O LORD: I have said that I would keep thy words.";
kjv[58] = "I intreated thy favour with [my] whole heart: be merciful unto me according to thy word.";
kjv[59] = "I thought on my ways, and turned my feet unto thy testimonies.";
kjv[60] = "I made haste, and delayed not to keep thy commandments.";
kjv[61] = "The bands of the wicked have robbed me: [but] I have not forgotten thy law.";
kjv[62] = "At midnight I will rise to give thanks unto thee because of thy righteous judgments.";
kjv[63] = "I [am] a companion of all [them] that fear thee, and of them that keep thy precepts.";
kjv[64] = "The earth, O LORD, is full of thy mercy: teach me thy statutes.";
kjv[65] = "TETH. Thou hast dealt well with thy servant, O LORD, according unto thy word.";
kjv[66] = "Teach me good judgment and knowledge: for I have believed thy commandments.";
kjv[67] = "Before I was afflicted I went astray: but now have I kept thy word.";
kjv[68] = "Thou [art] good, and doest good; teach me thy statutes.";
kjv[69] = "The proud have forged a lie against me: [but] I will keep thy precepts with [my] whole heart.";
kjv[70] = "Their heart is as fat as grease; [but] I delight in thy law.";
kjv[71] = "[It is] good for me that I have been afflicted; that I might learn thy statutes.";
kjv[72] = "The law of thy mouth [is] better unto me than thousands of gold and silver.";
kjv[73] = "JOD. Thy hands have made me and fashioned me: give me understanding, that I may learn thy commandments.";
kjv[74] = "They that fear thee will be glad when they see me; because I have hoped in thy word.";
kjv[75] = "I know, O LORD, that thy judgments [are] right, and [that] thou in faithfulness hast afflicted me.";
kjv[76] = "Let, I pray thee, thy merciful kindness be for my comfort, according to thy word unto thy servant.";
kjv[77] = "Let thy tender mercies come unto me, that I may live: for thy law [is] my delight.";
kjv[78] = "Let the proud be ashamed; for they dealt perversely with me without a cause: [but] I will meditate in thy precepts.";
kjv[79] = "Let those that fear thee turn unto me, and those that have known thy testimonies.";
kjv[80] = "Let my heart be sound in thy statutes; that I be not ashamed.";
kjv[81] = "CAPH. My soul fainteth for thy salvation: [but] I hope in thy word.";
kjv[82] = "Mine eyes fail for thy word, saying, When wilt thou comfort me?";
kjv[83] = "For I am become like a bottle in the smoke; [yet] do I not forget thy statutes.";
kjv[84] = "How many [are] the days of thy servant? when wilt thou execute judgment on them that persecute me?";
kjv[85] = "The proud have digged pits for me, which [are] not after thy law.";
kjv[86] = "All thy commandments [are] faithful: they persecute me wrongfully; help thou me.";
kjv[87] = "They had almost consumed me upon earth; but I forsook not thy precepts.";
kjv[88] = "Quicken me after thy lovingkindness; so shall I keep the testimony of thy mouth.";
kjv[89] = "LAMED. For ever, O LORD, thy word is settled in heaven.";
kjv[90] = "Thy faithfulness [is] unto all generations: thou hast established the earth, and it abideth.";
kjv[91] = "They continue this day according to thine ordinances: for all [are] thy servants.";
kjv[92] = "Unless thy law [had been] my delights, I should then have perished in mine affliction.";
kjv[93] = "I will never forget thy precepts: for with them thou hast quickened me.";
kjv[94] = "I [am] thine, save me; for I have sought thy precepts.";
kjv[95] = "The wicked have waited for me to destroy me: [but] I will consider thy testimonies.";
kjv[96] = "I have seen an end of all perfection: [but] thy commandment [is] exceeding broad.";
kjv[97] = "MEM. O how love I thy law! it [is] my meditation all the day.";
kjv[98] = "Thou through thy commandments hast made me wiser than mine enemies: for they [are] ever with me.";
kjv[99] = "I have more understanding than all my teachers: for thy testimonies [are] my meditation.";
kjv[100] = "I understand more than the ancients, because I keep thy precepts.";
kjv[101] = "I have refrained my feet from every evil way, that I might keep thy word.";
kjv[102] = "I have not departed from thy judgments: for thou hast taught me.";
kjv[103] = "How sweet are thy words unto my taste! [yea, sweeter] than honey to my mouth!";
kjv[104] = "Through thy precepts I get understanding: therefore I hate every false way.";
kjv[105] = "NUN. Thy word [is] a lamp unto my feet, and a light unto my path.";
kjv[106] = "I have sworn, and I will perform [it], that I will keep thy righteous judgments.";
kjv[107] = "I am afflicted very much: quicken me, O LORD, according unto thy word.";
kjv[108] = "Accept, I beseech thee, the freewill offerings of my mouth, O LORD, and teach me thy judgments.";
kjv[109] = "My soul [is] continually in my hand: yet do I not forget thy law.";
kjv[110] = "The wicked have laid a snare for me: yet I erred not from thy precepts.";
kjv[111] = "Thy testimonies have I taken as an heritage for ever: for they [are] the rejoicing of my heart.";
kjv[112] = "I have inclined mine heart to perform thy statutes alway, [even unto] the end.";
kjv[113] = "SAMECH. I hate [vain] thoughts: but thy law do I love.";
kjv[114] = "Thou [art] my hiding place and my shield: I hope in thy word.";
kjv[115] = "Depart from me, ye evildoers: for I will keep the commandments of my God.";
kjv[116] = "Uphold me according unto thy word, that I may live: and let me not be ashamed of my hope.";
kjv[117] = "Hold thou me up, and I shall be safe: and I will have respect unto thy statutes continually.";
kjv[118] = "Thou hast trodden down all them that err from thy statutes: for their deceit [is] falsehood.";
kjv[119] = "Thou puttest away all the wicked of the earth [like] dross: therefore I love thy testimonies.";
kjv[120] = "My flesh trembleth for fear of thee; and I am afraid of thy judgments.";
kjv[121] = "AIN. I have done judgment and justice: leave me not to mine oppressors.";
kjv[122] = "Be surety for thy servant for good: let not the proud oppress me.";
kjv[123] = "Mine eyes fail for thy salvation, and for the word of thy righteousness.";
kjv[124] = "Deal with thy servant according unto thy mercy, and teach me thy statutes.";
kjv[125] = "I [am] thy servant; give me understanding, that I may know thy testimonies.";
kjv[126] = "[It is] time for [thee], LORD, to work: [for] they have made void thy law.";
kjv[127] = "Therefore I love thy commandments above gold; yea, above fine gold.";
kjv[128] = "Therefore I esteem all [thy] precepts [concerning] all [things to be] right; [and] I hate every false way.";
kjv[129] = "PE. Thy testimonies [are] wonderful: therefore doth my soul keep them.";
kjv[130] = "The entrance of thy words giveth light; it giveth understanding unto the simple.";
kjv[131] = "I opened my mouth, and panted: for I longed for thy commandments.";
kjv[132] = "Look thou upon me, and be merciful unto me, as thou usest to do unto those that love thy name.";
kjv[133] = "Order my steps in thy word: and let not any iniquity have dominion over me.";
kjv[134] = "Deliver me from the oppression of man: so will I keep thy precepts.";
kjv[135] = "Make thy face to shine upon thy servant; and teach me thy statutes.";
kjv[136] = "Rivers of waters run down mine eyes, because they keep not thy law.";
kjv[137] = "TZADDI. Righteous [art] thou, O LORD, and upright [are] thy judgments.";
kjv[138] = "Thy testimonies [that] thou hast commanded [are] righteous and very faithful.";
kjv[139] = "My zeal hath consumed me, because mine enemies have forgotten thy words.";
kjv[140] = "Thy word [is] very pure: therefore thy servant loveth it.";
kjv[141] = "I [am] small and despised: [yet] do not I forget thy precepts.";
kjv[142] = "Thy righteousness [is] an everlasting righteousness, and thy law [is] the truth.";
kjv[143] = "Trouble and anguish have taken hold on me: [yet] thy commandments [are] my delights.";
kjv[144] = "The righteousness of thy testimonies [is] everlasting: give me understanding, and I shall live.";
kjv[145] = "KOPH. I cried with [my] whole heart; hear me, O LORD: I will keep thy statutes.";
kjv[146] = "I cried unto thee; save me, and I shall keep thy testimonies.";
kjv[147] = "I prevented the dawning of the morning, and cried: I hoped in thy word.";
kjv[148] = "Mine eyes prevent the [night] watches, that I might meditate in thy word.";
kjv[149] = "Hear my voice according unto thy lovingkindness: O LORD, quicken me according to thy judgment.";
kjv[150] = "They draw nigh that follow after mischief: they are far from thy law.";
kjv[151] = "Thou [art] near, O LORD; and all thy commandments [are] truth.";
kjv[152] = "Concerning thy testimonies, I have known of old that thou hast founded them for ever.";
kjv[153] = "RESH. Consider mine affliction, and deliver me: for I do not forget thy law.";
kjv[154] = "Plead my cause, and deliver me: quicken me according to thy word.";
kjv[155] = "Salvation [is] far from the wicked: for they seek not thy statutes.";
kjv[156] = "Great [are] thy tender mercies, O LORD: quicken me according to thy judgments.";
kjv[157] = "Many [are] my persecutors and mine enemies; [yet] do I not decline from thy testimonies.";
kjv[158] = "I beheld the transgressors, and was grieved; because they kept not thy word.";
kjv[159] = "Consider how I love thy precepts: quicken me, O LORD, according to thy lovingkindness.";
kjv[160] = "Thy word [is] true [from] the beginning: and every one of thy righteous judgments [endureth] for ever.";
kjv[161] = "SCHIN. Princes have persecuted me without a cause: but my heart standeth in awe of thy word.";
kjv[162] = "I rejoice at thy word, as one that findeth great spoil.";
kjv[163] = "I hate and abhor lying: [but] thy law do I love.";
kjv[164] = "Seven times a day do I praise thee because of thy righteous judgments.";
kjv[165] = "Great peace have they which love thy law: and nothing shall offend them.";
kjv[166] = "LORD, I have hoped for thy salvation, and done thy commandments.";
kjv[167] = "My soul hath kept thy testimonies; and I love them exceedingly.";
kjv[168] = "I have kept thy precepts and thy testimonies: for all my ways [are] before thee.";
kjv[169] = "TAU. Let my cry come near before thee, O LORD: give me understanding according to thy word.";
kjv[170] = "Let my supplication come before thee: deliver me according to thy word.";
kjv[171] = "My lips shall utter praise, when thou hast taught me thy statutes.";
kjv[172] = "My tongue shall speak of thy word: for all thy commandments [are] righteousness.";
kjv[173] = "Let thine hand help me; for I have chosen thy precepts.";
kjv[174] = "I have longed for thy salvation, O LORD; and thy law [is] my delight.";
kjv[175] = "Let my soul live, and it shall praise thee; and let thy judgments help me.";
kjv[176] = "I have gone astray like a lost sheep; seek thy servant; for I do not forget thy commandments.";
</script>
