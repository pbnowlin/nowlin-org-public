rsv[1] = "Blessed are those whose way is blameless, who walk in the law of the LORD!";
asv[1] = "[ALEPH.] Blessed are they that are perfect in the way, Who walk in the law of Jehovah. ";
yng[1] = "[Aleph.] O the happiness of those perfect in the way, They are walking in the law of Jehovah,";
dby[1] = "ALEPH. Blessed are the perfect in the way, who walk in the law of Jehovah.";
web[1] = "ALEPH. Blessed [are] the undefiled in the way, who walk in the law of the LORD.";
hnv[1] = "ALEPH Blessed are those whose ways are blameless, Who walk according to Yaweh\'s law.";
vul[1] = "[Vulgate 118:1] aleph beati inmaculati in via qui ambulant in lege Domini";
rsv[2] = "Blessed are those who keep his testimonies, who seek him with their whole heart,";
asv[2] = "Blessed are they that keep his testimonies, That seek him with the whole heart. ";
yng[2] = "O the happiness of those keeping His testimonies, With the whole heart they seek Him.";
dby[2] = "Blessed are they that observe his testimonies, that seek him with the whole heart;";
web[2] = "Blessed [are] they that keep his testimonies, [and that] seek him with the whole heart.";
hnv[2] = "Blessed are those who keep his statutes, Who seek him with their whole heart.";
vul[2] = "[Vulgate 118:2] beati qui custodiunt testimonia eius in toto corde requirunt eum";
rsv[3] = "who also do no wrong, but walk in his ways!";
asv[3] = "Yea, they do no unrighteousness; They walk in his ways. ";
yng[3] = "Yea, they have not done iniquity, In His ways they have walked.";
dby[3] = "Who also do no unrighteousness: they walk in his ways.";
web[3] = "They also do no iniquity: they walk in his ways.";
hnv[3] = "Yes, they do nothing wrong. They walk in his ways.";
vul[3] = "[Vulgate 118:3] nec enim qui operantur iniquitatem in viis eius ambulaverunt";
rsv[4] = "Thou hast commanded thy precepts to be kept diligently.";
asv[4] = "Thou hast commanded [us] thy precepts, That we should observe them diligently. ";
yng[4] = "Thou hast commanded us Thy precepts to keep diligently,";
dby[4] = "Thou hast enjoined thy precepts, to be kept diligently.";
web[4] = "Thou hast commanded [us] to keep thy precepts diligently.";
hnv[4] = "You have commanded your precepts, That we should fully obey them.";
vul[4] = "[Vulgate 118:4] tu mandasti praecepta tua custodire nimis";
rsv[5] = "O that my ways may be steadfast in keeping thy statutes!";
asv[5] = "Oh that my ways were established To observe thy statutes! ";
yng[5] = "O that my ways were prepared to keep Thy statutes,";
dby[5] = "Oh that my ways were directed to keep thy statutes!";
web[5] = "O that my ways were directed to keep thy statutes!";
hnv[5] = "Oh that my ways were steadfast To obey your statutes!";
vul[5] = "[Vulgate 118:5] utinam dirigantur viae meae ad custodienda praecepta tua";
rsv[6] = "Then I shall not be put to shame, having my eyes fixed on all thy commandments.";
asv[6] = "Then shall I not be put to shame, When I have respect unto all thy commandments. ";
yng[6] = "Then I am not ashamed In my looking unto all Thy commands.";
dby[6] = "Then shall I not be ashamed, when I have respect unto all thy commandments.";
web[6] = "Then shall I not be ashamed, when I have respect to all thy commandments.";
hnv[6] = "Then I wouldn\'t be disappointed, When I consider all of your mitzvot.";
vul[6] = "[Vulgate 118:6] tunc non confundar cum respexero ad omnia mandata tua";
rsv[7] = "I will praise thee with an upright heart, when I learn thy righteous ordinances.";
asv[7] = "I will give thanks unto thee with uprightness of heart, When I learn thy righteous judgments. ";
yng[7] = "I confess Thee with uprightness of heart, In my learning the judgments of Thy righteousness.";
dby[7] = "I will give thee thanks with uprightness of heart, when I shall have learned thy righteous judgments.";
web[7] = "I will praise thee with uprightness of heart, when I shall have learned thy righteous judgments.";
hnv[7] = "I will give thanks to you with uprightness of heart, When I learn your righteous judgments.";
vul[7] = "[Vulgate 118:7] confitebor tibi in directione cordis cum didicero iudicia iustitiae tuae";
rsv[8] = "I will observe thy statutes; O forsake me not utterly!";
asv[8] = "I will observe thy statutes: Oh forsake me not utterly. ";
yng[8] = "Thy statutes I keep, leave me not utterly!";
dby[8] = "I will keep thy statutes: forsake me not utterly.";
web[8] = "I will keep thy statutes: O forsake me not utterly.";
hnv[8] = "I will observe your statutes. Don\'t utterly forsake me. ";
vul[8] = "[Vulgate 118:8] praecepta tua custodiam ne derelinquas me nimis";
rsv[9] = "How can a young man keep his way pure? By guarding it according to thy word.";
asv[9] = "[BETH.] Wherewith shall a young man cleanse his way? By taking heed [thereto] according to thy word. ";
yng[9] = "[Beth.] With what doth a young man purify his path? To observe -- according to Thy word.";
dby[9] = "BETH. Wherewithal shall a young man cleanse his path? by taking heed according to thy word.";
web[9] = "BETH. Wherewith shall a young man cleanse his way? by taking heed [to it], according to thy word.";
hnv[9] = "BEIT How can a young man keep his way pure? By living according to your word.";
vul[9] = "[Vulgate 118:9] beth in quo corrigit iuvenis semitam suam cum custodierit verba tua";
kjv[10] = "Quicken me after thy lovingkindness; so shall I keep the testimony of thy mouth.";
rsv[10] = "With my whole heart I seek thee; let me not wander from thy commandments!";
asv[10] = "With my whole heart have I sought thee: Oh let me not wander from thy commandments. ";
yng[10] = "With all my heart I have sought Thee, Let me not err from Thy commands.";
dby[10] = "With my whole heart have I sought thee: let me not wander from thy commandments.";
web[10] = "With my whole heart have I sought thee: O let me not wander from thy commandments.";
hnv[10] = "With my whole heart, I have sought you. Don\'t let me wander from your mitzvot.";
vul[10] = "[Vulgate 118:10] in toto corde meo exquisivi te ne errare me facias a mandatis tuis";
kjv[11] = "LAMED. For ever, O LORD, thy word is settled in heaven.";
rsv[11] = "I have laid up thy word in my heart, that I might not sin against thee.";
asv[11] = "Thy word have I laid up in my heart, That I might not sin against thee. ";
yng[11] = "In my heart I have hid Thy saying, That I sin not before Thee.";
dby[11] = "Thy word have I hid in my heart, that I might not sin against thee.";
web[11] = "Thy word have I hid in my heart, that I might not sin against thee.";
hnv[11] = "I have hidden your word in my heart, That I might not sin against you.";
vul[11] = "[Vulgate 118:11] in corde meo abscondi eloquium tuum ut non peccem tibi";
kjv[12] = "Thy faithfulness [is] unto all generations: thou hast established the earth, and it abideth.";
rsv[12] = "Blessed be thou, O LORD; teach me thy statutes!";
asv[12] = "Blessed art thou, O Jehovah: Teach me thy statutes. ";
yng[12] = "Blessed [art] Thou, O Jehovah, teach me Thy statutes.";
dby[12] = "Blessed art thou, Jehovah! teach me thy statutes.";
web[12] = "Blessed [art] thou, O LORD: teach me thy statutes.";
hnv[12] = "Blessed are you, LORD. Teach me your statutes.";
vul[12] = "[Vulgate 118:12] benedictus tu Domine doce me praecepta tua";
kjv[13] = "They continue this day according to thine ordinances: for all [are] thy servants.";
rsv[13] = "With my lips I declare all the ordinances of thy mouth.";
asv[13] = "With my lips have I declared All the ordinances of thy mouth. ";
yng[13] = "With my lips I have recounted All the judgments of Thy mouth.";
dby[13] = "With my lips have I declared all the judgments of thy mouth.";
web[13] = "With my lips have I declared all the judgments of thy mouth.";
hnv[13] = "With my lips, I have declared all the ordinances of your mouth.";
vul[13] = "[Vulgate 118:13] in labiis meis narravi omnes iustitias oris tui";
kjv[14] = "Unless thy law [had been] my delights, I should then have perished in mine affliction.";
rsv[14] = "In the way of thy testimonies I delight as much as in all riches.";
asv[14] = "I have rejoiced in the way of thy testimonies, As much as in all riches. ";
yng[14] = "In the way of Thy testimonies I have joyed, As over all wealth.";
dby[14] = "I have rejoiced in the way of thy testimonies, as [much as] in all wealth.";
web[14] = "I have rejoiced in the way of thy testimonies, as [much as] in all riches.";
hnv[14] = "I have rejoiced in the way of your testimonies, As much as in all riches.";
vul[14] = "[Vulgate 118:14] in via testimoniorum tuorum laetatus sum quasi in omnibus divitiis";
kjv[15] = "I will never forget thy precepts: for with them thou hast quickened me.";
rsv[15] = "I will meditate on thy precepts, and fix my eyes on thy ways.";
asv[15] = "I will meditate on thy precepts, And have respect unto thy ways. ";
yng[15] = "In Thy precepts I meditate, And I behold attentively Thy paths.";
dby[15] = "I will meditate upon thy precepts, and have respect unto thy paths.";
web[15] = "I will meditate in thy precepts, and have respect to thy ways.";
hnv[15] = "I will meditate on your precepts, And consider your ways.";
vul[15] = "[Vulgate 118:15] in praeceptis tuis meditabor et contemplabor semitas tuas";
kjv[16] = "I [am] thine, save me; for I have sought thy precepts.";
rsv[16] = "I will delight in thy statutes; I will not forget thy word.";
asv[16] = "I will delight myself in thy statutes: I will not forget thy word. ";
yng[16] = "In Thy statutes I delight myself, I do not forget Thy word.";
dby[16] = "I delight myself in thy statutes; I will not forget thy word.";
web[16] = "I will delight myself in thy statutes: I will not forget thy word.";
hnv[16] = "I will delight myself in your statutes. I will not forget your word. ";
vul[16] = "[Vulgate 118:16] iustitiis tuis delectabor non obliviscar verba tua";
kjv[17] = "The wicked have waited for me to destroy me: [but] I will consider thy testimonies.";
rsv[17] = "Deal bountifully with thy servant, that I may live and observe thy word.";
asv[17] = "[GIMEL.] Deal bountifully with thy servant, that I may live; So will I observe thy word. ";
yng[17] = "[Gimel.] Confer benefits on Thy servant, I live, and I keep Thy word.";
dby[17] = "GIMEL. Deal bountifully with thy servant [and] I shall live; and I will keep thy word.";
web[17] = "GIMEL. Deal bountifully with thy servant, [that] I may live, and keep thy word.";
hnv[17] = "GIMEL Do good to your servant. I will live and I will obey your word.";
vul[17] = "[Vulgate 118:17] gimel tribue servo tuo vivam et custodiam verba tua";
kjv[18] = "I have seen an end of all perfection: [but] thy commandment [is] exceeding broad.";
rsv[18] = "Open my eyes, that I may behold wondrous things out of thy law.";
asv[18] = "Open thou mine eyes, that I may behold Wondrous things out of thy law. ";
yng[18] = "Uncover mine eyes, and I behold wonders out of Thy law.";
dby[18] = "Open mine eyes, and I shall behold wondrous things out of thy law.";
web[18] = "Open thou my eyes, that I may behold wondrous things out of thy law.";
hnv[18] = "Open my eyes, That I may see wondrous things out of your law.";
vul[18] = "[Vulgate 118:18] revela oculos meos et videbo mirabilia in lege tua";
kjv[19] = "MEM. O how love I thy law! it [is] my meditation all the day.";
rsv[19] = "I am a sojourner on earth; hide not thy commandments from me!";
asv[19] = "I am a sojourner in the earth: Hide not thy commandments from me. ";
yng[19] = "A sojourner I [am] on earth, Hide not from me Thy commands.";
dby[19] = "I am a stranger in the land; hide not thy commandments from me.";
web[19] = "I [am] a stranger in the earth: hide not thy commandments from me.";
hnv[19] = "I am a stranger on the eretz. Don\'t hide your mitzvot from me.";
vul[19] = "[Vulgate 118:19] advena ego sum in terra ne abscondas a me mandata tua";
kjv[20] = "Thou through thy commandments hast made me wiser than mine enemies: for they [are] ever with me.";
rsv[20] = "My soul is consumed with longing for thy ordinances at all times.";
asv[20] = "My soul breaketh for the longing That it hath unto thine ordinances at all times. ";
yng[20] = "Broken hath my soul for desire Unto Thy judgments at all times.";
dby[20] = "My soul breaketh for longing after thy judgments at all times.";
web[20] = "My soul breaketh for the longing [that it hath] to thy judgments at all times.";
hnv[20] = "My soul is consumed with longing for your ordinances at all times.";
vul[20] = "[Vulgate 118:20] desideravit anima mea desiderare iudicia tua in omni tempore";
kjv[21] = "I have more understanding than all my teachers: for thy testimonies [are] my meditation.";
rsv[21] = "Thou dost rebuke the insolent, accursed ones, who wander from thy commandments;";
asv[21] = "Thou hast rebuked the proud that are cursed, That do wander from thy commandments. ";
yng[21] = "Thou hast rebuked the cursed proud, Who are erring from Thy commands.";
dby[21] = "Thou hast rebuked the proud [that are] cursed, who wander from thy commandments.";
web[21] = "Thou hast rebuked the proud [that are] cursed, who do err from thy commandments.";
hnv[21] = "You have rebuked the proud who are cursed, Who wander from your mitzvot.";
vul[21] = "[Vulgate 118:21] increpasti superbos maledicti qui recedunt a mandatis tuis";
kjv[22] = "I understand more than the ancients, because I keep thy precepts.";
rsv[22] = "take away from me their scorn and contempt, for I have kept thy testimonies.";
asv[22] = "Take away from me reproach and contempt; For I have kept thy testimonies. ";
yng[22] = "Remove from me reproach and contempt, For Thy testimonies I have kept.";
dby[22] = "Roll off from me reproach and contempt; for I observe thy testimonies.";
web[22] = "Remove from me reproach and contempt; for I have kept thy testimonies.";
hnv[22] = "Take reproach and contempt away from me, For I have kept your statutes.";
vul[22] = "[Vulgate 118:22] aufer a me obprobrium et contemptum quoniam testimonia tua custodivi";
kjv[23] = "I have refrained my feet from every evil way, that I might keep thy word.";
rsv[23] = "Even though princes sit plotting against me, thy servant will meditate on thy statutes.";
asv[23] = "Princes also sat and talked against me; [But] thy servant did meditate on thy statutes. ";
yng[23] = "Princes also sat -- against me they spoke, Thy servant doth meditate in Thy statutes,";
dby[23] = "Princes also did sit [and] talk together against me: thy servant doth meditate in thy statutes.";
web[23] = "Princes also did sit [and] speak against me: [but] thy servant did meditate in thy statutes.";
hnv[23] = "Though princes sit and slander me, Your servant will meditate on your statutes.";
vul[23] = "[Vulgate 118:23] etenim sedentes principes adversum me loquebantur servus autem tuus meditabatur praecepta tua";
kjv[24] = "I have not departed from thy judgments: for thou hast taught me.";
rsv[24] = "Thy testimonies are my delight, they are my counselors.";
asv[24] = "Thy testimonies also are my delight [And] my counsellors. ";
yng[24] = "Thy testimonies also [are] my delight, The men of my counsel!";
dby[24] = "Thy testimonies also are my delight [and] my counsellors.";
web[24] = "Thy testimonies also [are] my delight, [and] my counselors.";
hnv[24] = "Indeed your statutes are my delight, And my counselors. ";
vul[24] = "[Vulgate 118:24] sed et testimonia tua voluntas mea quasi viri amicissimi mei";
kjv[25] = "How sweet are thy words unto my taste! [yea, sweeter] than honey to my mouth!";
rsv[25] = "My soul cleaves to the dust; revive me according to thy word!";
asv[25] = "[DALETH.] My soul cleaveth unto the dust: Quicken thou me according to thy word. ";
yng[25] = "[Daleth.] Cleaved to the dust hath my soul, Quicken me according to Thy word.";
dby[25] = "DALETH. My soul cleaveth unto the dust: quicken me according to thy word.";
web[25] = "DALETH. My soul cleaveth to the dust: revive thou me according to thy word.";
hnv[25] = "DALED My soul is laid low in the dust. Revive me according to your word!";
vul[25] = "[Vulgate 118:25] deleth adhesit pulveri anima mea vivifica me iuxta verbum tuum";
kjv[26] = "Through thy precepts I get understanding: therefore I hate every false way.";
rsv[26] = "When I told of my ways, thou didst answer me; teach me thy statutes!";
asv[26] = "I declared my ways, and thou answeredst me: Teach me thy statutes. ";
yng[26] = "My ways I have recounted, And Thou answerest me, teach me Thy statutes,";
dby[26] = "I have declared my ways, and thou hast answered me: teach me thy statutes.";
web[26] = "I have declared my ways, and thou heardest me: teach me thy statutes.";
hnv[26] = "I declared my ways, and you answered me. Teach me your statutes.";
vul[26] = "[Vulgate 118:26] vias meas exposui et exaudisti doce me iustitiam tuam";
kjv[27] = "NUN. Thy word [is] a lamp unto my feet, and a light unto my path.";
rsv[27] = "Make me understand the way of thy precepts, and I will meditate on thy wondrous works.";
asv[27] = "Make me to understand the way of thy precepts: So shall I meditate on thy wondrous works. ";
yng[27] = "The way of Thy precepts cause me to understand, And I meditate in Thy wonders.";
dby[27] = "Make me to understand the way of thy precepts, and I will meditate upon thy wondrous works.";
web[27] = "Make me to understand the way of thy precepts: so shall I talk of thy wondrous works.";
hnv[27] = "Let me understand the teaching of your precepts! Then I will meditate on your wondrous works.";
vul[27] = "[Vulgate 118:27] viam praeceptorum tuorum fac me intellegere et loquar in mirabilibus tuis";
kjv[28] = "I have sworn, and I will perform [it], that I will keep thy righteous judgments.";
rsv[28] = "My soul melts away for sorrow; strengthen me according to thy word!";
asv[28] = "My soul melteth for heaviness: Strengthen thou me according unto thy word. ";
yng[28] = "My soul hath dropped from affliction, Establish me according to Thy word.";
dby[28] = "My soul melteth for sadness: strengthen me according to thy word.";
web[28] = "My soul melteth for heaviness: strengthen thou me according to thy word.";
hnv[28] = "My soul is weary with sorrow: Strengthen me according to your word.";
vul[28] = "[Vulgate 118:28] destillavit anima mea prae stultitia serva me iuxta eloquium tuum";
kjv[29] = "I am afflicted very much: quicken me, O LORD, according unto thy word.";
rsv[29] = "Put false ways far from me; and graciously teach me thy law!";
asv[29] = "Remove from me the way of falsehood; And grant me thy law graciously. ";
yng[29] = "The way of falsehood turn aside from me And with Thy law favour me.";
dby[29] = "Remove from me the way of falsehood, and graciously grant me thy law.";
web[29] = "Remove from me the way of lying: and grant me thy law graciously.";
hnv[29] = "Keep me from the way of deceit. Grant me your law graciously!";
vul[29] = "[Vulgate 118:29] viam mendacii aufer a me et legem tuam dona mihi";
kjv[30] = "Accept, I beseech thee, the freewill offerings of my mouth, O LORD, and teach me thy judgments.";
rsv[30] = "I have chosen the way of faithfulness, I set thy ordinances before me.";
asv[30] = "I have chosen the way of faithfulness: Thine ordinances have I set [before me]. ";
yng[30] = "The way of faithfulness I have chosen, Thy judgments I have compared,";
dby[30] = "I have chosen the way of faithfulness; thy judgments have I set [before me].";
web[30] = "I have chosen the way of truth: thy judgments have I laid [before me].";
hnv[30] = "I have chosen the way of truth. I have set my heart on your law.";
vul[30] = "[Vulgate 118:30] viam fidei elegi iudicia tua proponebam";
kjv[31] = "My soul [is] continually in my hand: yet do I not forget thy law.";
rsv[31] = "I cleave to thy testimonies, O LORD; let me not be put to shame!";
asv[31] = "I cleave unto thy testimonies: O Jehovah, put me not to shame. ";
yng[31] = "I have adhered to Thy testimonies, O Jehovah, put me not to shame.";
dby[31] = "I cleave unto thy testimonies; Jehovah, let me not be ashamed.";
web[31] = "I have adhered to thy testimonies: O LORD, put me not to shame.";
hnv[31] = "I cling to your statutes, LORD. Don\'t let me be disappointed.";
vul[31] = "[Vulgate 118:31] adhesi testimoniis tuis Domine ne confundas me";
kjv[32] = "The wicked have laid a snare for me: yet I erred not from thy precepts.";
rsv[32] = "I will run in the way of thy commandments when thou enlargest my understanding!";
asv[32] = "I will run the way of thy commandments, When thou shalt enlarge my heart. ";
yng[32] = "The way of Thy commands I run, For Thou dost enlarge my heart!";
dby[32] = "I will run the way of thy commandments when thou shalt enlarge my heart.";
web[32] = "I will run the way of thy commandments, when thou shalt enlarge my heart.";
hnv[32] = "I run in the path of your mitzvot, For you have set my heart free. ";
vul[32] = "[Vulgate 118:32] viam mandatorum tuorum curram quoniam dilatasti cor meum";
kjv[33] = "Thy testimonies have I taken as an heritage for ever: for they [are] the rejoicing of my heart.";
rsv[33] = "Teach me, O LORD, the way of thy statutes; and I will keep it to the end.";
asv[33] = "[HE.] Teach me, O Jehovah, the way of thy statutes; And I shall keep it unto the end. ";
yng[33] = "[He.] Show me, O Jehovah, the way of Thy statutes, And I keep it -- [to] the end.";
dby[33] = "HE. Teach me, O Jehovah, the way of thy statutes, and I will observe it [unto] the end.";
web[33] = "HE. Teach me, O LORD, the way of thy statutes; and I shall keep it [to] the end.";
hnv[33] = "HEY Teach me, LORD, the way of your statutes. I will keep them to the end.";
vul[33] = "[Vulgate 118:33] he ostende mihi Domine viam praeceptorum tuorum et custodiam eam per vestigium";
kjv[34] = "I have inclined mine heart to perform thy statutes alway, [even unto] the end.";
rsv[34] = "Give me understanding, that I may keep thy law and observe it with my whole heart.";
asv[34] = "Give me understanding, and I shall keep thy law; Yea, I shall observe it with my whole heart. ";
yng[34] = "Cause me to understand, and I keep Thy law, And observe it with the whole heart.";
dby[34] = "Give me understanding, and I will observe thy law; and I will keep it with [my] whole heart.";
web[34] = "Give me understanding, and I shall keep thy law; yes, I shall observe it with [my] whole heart.";
hnv[34] = "Give me understanding, and I will keep your law. Yes, I will obey it with my whole heart.";
vul[34] = "[Vulgate 118:34] doce me et observabo legem tuam et custodiam eam in toto corde";
kjv[35] = "SAMECH. I hate [vain] thoughts: but thy law do I love.";
rsv[35] = "Lead me in the path of thy commandments, for I delight in it.";
asv[35] = "Make me to go in the path of thy commandments; For therein do I delight. ";
yng[35] = "Cause me to tread in the path of Thy commands, For in it I have delighted.";
dby[35] = "Make me to walk in the path of thy commandments; for therein do I delight.";
web[35] = "Make me to go in the path of thy commandments; for in that do I delight.";
hnv[35] = "Direct me in the path of your mitzvot, For I delight in them.";
vul[35] = "[Vulgate 118:35] deduc me in semita mandatorum tuorum quia ipsam volui";
kjv[36] = "Thou [art] my hiding place and my shield: I hope in thy word.";
rsv[36] = "Incline my heart to thy testimonies, and not to gain!";
asv[36] = "Incline my heart unto thy testimonies, And not to covetousness. ";
yng[36] = "Incline my heart unto Thy testimonies, And not unto dishonest gain.";
dby[36] = "Incline my heart unto thy testimonies, and not to gain.";
web[36] = "Incline my heart to thy testimonies, and not to covetousness.";
hnv[36] = "Turn my heart toward your statutes, Not toward selfish gain.";
vul[36] = "[Vulgate 118:36] inclina cor meum ad testimonia tua et non ad avaritiam";
kjv[37] = "Depart from me, ye evildoers: for I will keep the commandments of my God.";
rsv[37] = "Turn my eyes from looking at vanities; and give me life in thy ways.";
asv[37] = "Turn away mine eyes from beholding vanity, And quicken me in thy ways. ";
yng[37] = "Remove mine eyes from seeing vanity, In Thy way quicken Thou me.";
dby[37] = "Turn away mine eyes from beholding vanity; quicken me in thy way.";
web[37] = "Turn away my eyes from beholding vanity; [and] revive thou me in thy way.";
hnv[37] = "Turn my eyes away from looking at worthless things. Revive me in your ways.";
vul[37] = "[Vulgate 118:37] averte oculos meos ne videant vanitatem in via tua vivifica me";
kjv[38] = "Uphold me according unto thy word, that I may live: and let me not be ashamed of my hope.";
rsv[38] = "Confirm to thy servant thy promise, which is for those who fear thee.";
asv[38] = "Confirm unto thy servant thy word, Which [is in order] unto the fear of thee. ";
yng[38] = "Establish to Thy servant Thy saying, That [is] concerning Thy fear.";
dby[38] = "Establish thy word unto thy servant, who is [devoted] to thy fear.";
web[38] = "Establish thy word to thy servant, who [is devoted] to thy fear.";
hnv[38] = "Fulfill your promise to your servant, That you may be feared.";
vul[38] = "[Vulgate 118:38] suscita servo tuo eloquium tuum in timorem tuum";
kjv[39] = "Hold thou me up, and I shall be safe: and I will have respect unto thy statutes continually.";
rsv[39] = "Turn away the reproach which I dread; for thy ordinances are good.";
asv[39] = "Turn away my reproach whereof I am afraid; For thine ordinances are good. ";
yng[39] = "Remove my reproach that I have feared, For Thy judgments [are] good.";
dby[39] = "Turn away my reproach which I fear; for thy judgments are good.";
web[39] = "Turn away my reproach which I fear: for thy judgments [are] good.";
hnv[39] = "Take away my disgrace that I dread, For your ordinances are good.";
vul[39] = "[Vulgate 118:39] averte obprobrium meum quod reveritus sum iudicia tua bona";
kjv[40] = "Thou hast trodden down all them that err from thy statutes: for their deceit [is] falsehood.";
rsv[40] = "Behold, I long for thy precepts; in thy righteousness give me life!";
asv[40] = "Behold, I have longed after thy precepts: Quicken me in thy righteousness. ";
yng[40] = "Lo, I have longed for Thy precepts, In Thy righteousness quicken Thou me,";
dby[40] = "Behold, I have longed after thy precepts: quicken me in thy righteousness.";
web[40] = "Behold, I have longed after thy precepts: revive me in thy righteousness.";
hnv[40] = "Behold, I long for your precepts! Revive me in your righteousness. ";
vul[40] = "[Vulgate 118:40] ecce desideravi praecepta tua iustitia tua vivifica me";
kjv[41] = "Thou puttest away all the wicked of the earth [like] dross: therefore I love thy testimonies.";
rsv[41] = "Let thy steadfast love come to me, O LORD, thy salvation according to thy promise;";
asv[41] = "[VAV.] Let thy lovingkindnesses also come unto me, O Jehovah, Even thy salvation, according to thy word. ";
yng[41] = "[Waw.] And meet me doth Thy kindness, O Jehovah, Thy salvation according to Thy saying.";
dby[41] = "VAU. And let thy loving-kindness come unto me, O Jehovah, -- thy salvation according to thy word.";
web[41] = "VAU. Let thy mercies come also to me, O LORD, [even] thy salvation, according to thy word.";
hnv[41] = "WAW Let your lovingkindness also come to me, LORD, Your yeshu`ah, according to your word.";
vul[41] = "[Vulgate 118:41] vav et veniant mihi misericordiae tuae Domine et salus tua iuxta eloquium tuum";
kjv[42] = "My flesh trembleth for fear of thee; and I am afraid of thy judgments.";
rsv[42] = "then shall I have an answer for those who taunt me, for I trust in thy word.";
asv[42] = "So shall I have an answer for him that reproacheth me; For I trust in thy word. ";
yng[42] = "And I answer him who is reproaching me a word, For I have trusted in Thy word.";
dby[42] = "So shall I have wherewith to answer him that reproacheth me; for I confide in thy word.";
web[42] = "So shall I have with which to answer him that reproacheth me: for I trust in thy word.";
hnv[42] = "So I will have an answer for him who reproaches me, For I trust in your word.";
vul[42] = "[Vulgate 118:42] et respondebo exprobranti mihi sermonem quia speravi in sermone tuo";
kjv[43] = "AIN. I have done judgment and justice: leave me not to mine oppressors.";
rsv[43] = "And take not the word of truth utterly out of my mouth, for my hope is in thy ordinances.";
asv[43] = "And take not the word of truth utterly out of my mouth; For I have hoped in thine ordinances. ";
yng[43] = "And Thou takest not utterly away From my mouth the word of truth, Because for Thy judgment I have hoped.";
dby[43] = "And take not the word of truth utterly out of my mouth; because I have hoped in thy judgments.";
web[43] = "And take not the word of truth utterly out of my mouth; for I have hoped in thy judgments.";
hnv[43] = "Don\'t snatch the word of truth out of my mouth, For I put my hope in your ordinances.";
vul[43] = "[Vulgate 118:43] et ne auferas de ore meo verbum veritatis usque nimis quoniam iudicia tua expectavi";
kjv[44] = "Be surety for thy servant for good: let not the proud oppress me.";
rsv[44] = "I will keep thy law continually, for ever and ever;";
asv[44] = "So shall I observe thy law continually For ever and ever. ";
yng[44] = "And I keep Thy law continually, To the age and for ever.";
dby[44] = "Then will I keep thy law continually, for ever and ever;";
web[44] = "So shall I keep thy law continually for ever and ever.";
hnv[44] = "So I will obey your law continually, Forever and ever.";
vul[44] = "[Vulgate 118:44] et custodiam legem tuam iugiter in sempiternum et ultra";
kjv[45] = "Mine eyes fail for thy salvation, and for the word of thy righteousness.";
rsv[45] = "and I shall walk at liberty, for I have sought thy precepts.";
asv[45] = "And I shall walk at liberty; For I have sought thy precepts. ";
yng[45] = "And I walk habitually in a broad place, For Thy precepts I have sought.";
dby[45] = "And I will walk at liberty, for I have sought thy precepts;";
web[45] = "And I will walk at liberty: for I seek thy precepts.";
hnv[45] = "I will walk in liberty, For I have sought your precepts.";
vul[45] = "[Vulgate 118:45] et ambulabo in spatioso quia praecepta tua quaesivi";
kjv[46] = "Deal with thy servant according unto thy mercy, and teach me thy statutes.";
rsv[46] = "I will also speak of thy testimonies before kings, and shall not be put to shame;";
asv[46] = "I will also speak of thy testimonies before kings, And shall not be put to shame. ";
yng[46] = "And I speak of Thy testimonies before kings, And I am not ashamed.";
dby[46] = "And I will speak of thy testimonies before kings, and will not be ashamed;";
web[46] = "I will speak of thy testimonies also before kings, and will not be ashamed.";
hnv[46] = "I will also speak of your statutes before kings, And will not be disappointed.";
vul[46] = "[Vulgate 118:46] et loquar in testimoniis tuis coram regibus et non confundar";
kjv[47] = "I [am] thy servant; give me understanding, that I may know thy testimonies.";
rsv[47] = "for I find my delight in thy commandments, which I love.";
asv[47] = "And I will delight myself in thy commandments, Which I have loved. ";
yng[47] = "And I delight myself in Thy commands, That I have loved,";
dby[47] = "And I will delight myself in thy commandments, which I have loved;";
web[47] = "And I will delight myself in thy commandments, which I have loved.";
hnv[47] = "I will delight myself in your mitzvot, Because I love them.";
vul[47] = "[Vulgate 118:47] et delectabor in mandatis tuis quae dilexi";
kjv[48] = "[It is] time for [thee], LORD, to work: [for] they have made void thy law.";
rsv[48] = "I revere thy commandments, which I love, and I will meditate on thy statutes.";
asv[48] = "I will lift up my hands also unto thy commandments, which I have loved; And I will meditate on thy statutes. ";
yng[48] = "And I lift up my hands unto Thy commands, That I have loved, And I do meditate on Thy statutes!";
dby[48] = "And I will lift up my hands unto thy commandments, which I have loved, and I will meditate in thy statutes.";
web[48] = "My hands also will I lift to thy commandments, which I have loved; and I will meditate in thy statutes.";
hnv[48] = "I reach out my hands for your mitzvot, which I love. I will meditate on your statutes. ";
vul[48] = "[Vulgate 118:48] et levabo manus meas ad mandata tua quae dilexi et loquar in praeceptis tuis";
kjv[49] = "Therefore I love thy commandments above gold; yea, above fine gold.";
rsv[49] = "Remember thy word to thy servant, in which thou hast made me hope.";
asv[49] = "[ZAYIN.] Remember the word unto thy servant, Because thou hast made me to hope. ";
yng[49] = "[Zain.] Remember the word to Thy servant, On which Thou hast caused me to hope.";
dby[49] = "ZAIN. Remember the word for thy servant, upon which thou hast caused me to hope.";
web[49] = "ZAIN. Remember the word to thy servant, upon which thou hast caused me to hope.";
hnv[49] = "ZAYIN Remember your word to your servant, Because you gave me hope.";
vul[49] = "[Vulgate 118:49] zai memento sermonis servo tuo quem me sperare fecisti";
kjv[50] = "Therefore I esteem all [thy] precepts [concerning] all [things to be] right; [and] I hate every false way.";
rsv[50] = "This is my comfort in my affliction that thy promise gives me life.";
asv[50] = "This is my comfort in my affliction; For thy word hath quickened me. ";
yng[50] = "This [is] my comfort in mine affliction, That Thy saying hath quickened me.";
dby[50] = "This is my comfort in mine affliction; for thy word hath quickened me.";
web[50] = "This [is] my comfort in my affliction: for thy word hath revived me.";
hnv[50] = "This is my comfort in my affliction, For your word has revived me.";
vul[50] = "[Vulgate 118:50] haec est consolatio mea in adflictione mea quia eloquium tuum vivificavit me";
kjv[51] = "PE. Thy testimonies [are] wonderful: therefore doth my soul keep them.";
rsv[51] = "Godless men utterly deride me, but I do not turn away from thy law.";
asv[51] = "The proud have had me greatly in derision: [Yet] have I not swerved from thy law. ";
yng[51] = "The proud have utterly scorned me, From Thy law I have not turned aside.";
dby[51] = "The proud have derided me beyond measure: I have not declined from thy law.";
web[51] = "The proud have had me greatly in derision: [yet] I have not declined from thy law.";
hnv[51] = "The arrogant mock me excessively, But I don\'t swerve from your law.";
vul[51] = "[Vulgate 118:51] superbi deridebant me nimis a lege tua non declinavi";
kjv[52] = "The entrance of thy words giveth light; it giveth understanding unto the simple.";
rsv[52] = "When I think of thy ordinances from of old, I take comfort, O LORD.";
asv[52] = "I have remembered thine ordinances of old, O Jehovah, And have comforted myself. ";
yng[52] = "I remembered Thy judgments of old, O Jehovah, And I comfort myself.";
dby[52] = "I remembered thy judgments of old, O Jehovah, and have comforted myself.";
web[52] = "I remembered thy judgments of old, O LORD; and have comforted myself.";
hnv[52] = "I remember your ordinances of old, LORD, And have comforted myself.";
vul[52] = "[Vulgate 118:52] recordatus sum iudiciorum tuorum a saeculo Domine et consolatus sum";
kjv[53] = "I opened my mouth, and panted: for I longed for thy commandments.";
rsv[53] = "Hot indignation seizes me because of the wicked, who forsake thy law.";
asv[53] = "Hot indignation hath taken hold upon me, Because of the wicked that forsake thy law. ";
yng[53] = "Horror hath seized me, Because of the wicked forsaking Thy law.";
dby[53] = "Burning indignation hath taken hold upon me because of the wicked who forsake thy law.";
web[53] = "Horror hath taken hold upon me because of the wicked that forsake thy law.";
hnv[53] = "Indignation has taken hold on me, Because of the wicked who forsake your law.";
vul[53] = "[Vulgate 118:53] horror obtinuit me ab impiis qui dereliquerunt legem tuam";
kjv[54] = "Look thou upon me, and be merciful unto me, as thou usest to do unto those that love thy name.";
rsv[54] = "Thy statutes have been my songs in the house of my pilgrimage.";
asv[54] = "Thy statutes have been my songs In the house of my pilgrimage. ";
yng[54] = "Songs have been to me Thy statutes, In the house of my sojournings.";
dby[54] = "Thy statutes have been my songs in the house of my pilgrimage.";
web[54] = "Thy statutes have been my songs in the house of my pilgrimage.";
hnv[54] = "Your statutes have been my songs, In the house where I live.";
vul[54] = "[Vulgate 118:54] carmina erant mihi praecepta tua in domo peregrinationis meae";
kjv[55] = "Order my steps in thy word: and let not any iniquity have dominion over me.";
rsv[55] = "I remember thy name in the night, O LORD, and keep thy law.";
asv[55] = "I have remembered thy name, O Jehovah, in the night, And have observed thy law. ";
yng[55] = "I have remembered in the night Thy name, O Jehovah, And I do keep Thy law.";
dby[55] = "I have remembered thy name, O Jehovah, in the night, and have kept thy law.";
web[55] = "I have remembered thy name, O LORD, in the night, and have kept thy law.";
hnv[55] = "I have remembered your name, LORD, in the night, And I obey your law.";
vul[55] = "[Vulgate 118:55] recordatus sum in nocte nominis tui Domine et custodivi legem tuam";
kjv[56] = "Deliver me from the oppression of man: so will I keep thy precepts.";
rsv[56] = "This blessing has fallen to me, that I have kept thy precepts.";
asv[56] = "This I have had, Because I have kept thy precepts. ";
yng[56] = "This hath been to me, That Thy precepts I have kept!";
dby[56] = "This I have had, because I have observed thy precepts.";
web[56] = "This I had, because I kept thy precepts.";
hnv[56] = "This is my way, That I keep your precepts. ";
vul[56] = "[Vulgate 118:56] hoc factum est mihi quia praecepta tua custodivi";
kjv[57] = "Make thy face to shine upon thy servant; and teach me thy statutes.";
rsv[57] = "The LORD is my portion; I promise to keep thy words.";
asv[57] = "[HHETH.] Jehovah is my portion: I have said that I would observe thy words. ";
yng[57] = "[Cheth.] My portion [is] Jehovah; I have said -- to keep Thy words,";
dby[57] = "CHETH. My portion, O Jehovah, I have said, is to keep thy words.";
web[57] = "CHETH. [Thou art] my portion, O LORD: I have said that I would keep thy words.";
hnv[57] = "CHET The LORD is my portion. I promised to obey your words.";
vul[57] = "[Vulgate 118:57] heth pars mea Domine dixi ut custodiam verbum tuum";
kjv[58] = "Rivers of waters run down mine eyes, because they keep not thy law.";
rsv[58] = "I entreat thy favor with all my heart; be gracious to me according to thy promise.";
asv[58] = "I entreated thy favor with my whole heart: Be merciful unto me according to thy word. ";
yng[58] = "I appeased Thy face with the whole heart, Favour me according to Thy saying.";
dby[58] = "I have sought thy favour with [my] whole heart: be gracious unto me according to thy word.";
web[58] = "I entreated thy favor with [my] whole heart: be merciful to me according to thy word.";
hnv[58] = "I sought your favor with my whole heart. Be merciful to me according to your word.";
vul[58] = "[Vulgate 118:58] deprecatus sum vultum tuum in toto corde miserere mei secundum eloquium tuum";
kjv[59] = "TZADDI. Righteous [art] thou, O LORD, and upright [are] thy judgments.";
rsv[59] = "When I think of thy ways, I turn my feet to thy testimonies;";
asv[59] = "I thought on my ways, And turned my feet unto thy testimonies. ";
yng[59] = "I have reckoned my ways, And turn back my feet unto Thy testimonies.";
dby[59] = "I have thought on my ways, and turned my feet unto thy testimonies.";
web[59] = "I thought on my ways, and turned my feet to thy testimonies.";
hnv[59] = "I considered my ways, And turned my steps to your statutes.";
vul[59] = "[Vulgate 118:59] recogitavi vias meas et converti pedes meos ad testimonia tua";
kjv[60] = "Thy testimonies [that] thou hast commanded [are] righteous and very faithful.";
rsv[60] = "I hasten and do not delay to keep thy commandments.";
asv[60] = "I made haste, and delayed not, To observe thy commandments. ";
yng[60] = "I have made haste, And delayed not, to keep Thy commands.";
dby[60] = "I have made haste, and not delayed, to keep thy commandments.";
web[60] = "I made haste, and delayed not to keep thy commandments.";
hnv[60] = "I will hurry, and not delay, To obey your mitzvot.";
vul[60] = "[Vulgate 118:60] festinavi et non neglexi custodire mandata tua";
kjv[61] = "My zeal hath consumed me, because mine enemies have forgotten thy words.";
rsv[61] = "Though the cords of the wicked ensnare me, I do not forget thy law.";
asv[61] = "The cords of the wicked have wrapped me round; [But] I have not forgotten thy law. ";
yng[61] = "Cords of the wicked have surrounded me, Thy law I have not forgotten.";
dby[61] = "The bands of the wicked have wrapped me round: I have not forgotten thy law.";
web[61] = "The bands of the wicked have robbed me: [but] I have not forgotten thy law.";
hnv[61] = "The ropes of the wicked bind me, But I won\'t forget your law.";
vul[61] = "[Vulgate 118:61] funes impiorum inplicaverunt me legem tuam non sum oblitus";
kjv[62] = "Thy word [is] very pure: therefore thy servant loveth it.";
rsv[62] = "At midnight I rise to praise thee, because of thy righteous ordinances.";
asv[62] = "At midnight I will rise to give thanks unto thee Because of thy righteous ordinances. ";
yng[62] = "At midnight I rise to give thanks to Thee, For the judgments of Thy righteousness.";
dby[62] = "At midnight I rise up to give thanks unto thee, because of thy righteous judgments.";
web[62] = "At midnight I will rise to give thanks to thee, because of thy righteous judgments.";
hnv[62] = "At midnight I will rise to give thanks to you, Because of your righteous ordinances.";
vul[62] = "[Vulgate 118:62] medio noctis surgam ad confitendum tibi super iudicia iustificationis tuae";
kjv[63] = "I [am] small and despised: [yet] do not I forget thy precepts.";
rsv[63] = "I am a companion of all who fear thee, of those who keep thy precepts.";
asv[63] = "I am a companion of all them that fear thee, And of them that observe thy precepts. ";
yng[63] = "A companion I [am] to all who fear Thee, And to those keeping Thy precepts.";
dby[63] = "I am the companion of all that fear thee, and of them that keep thy precepts.";
web[63] = "I [am] a companion of all [them] that fear thee, and of them that keep thy precepts.";
hnv[63] = "I am a friend of all those who fear you, Of those who observe your precepts.";
vul[63] = "[Vulgate 118:63] particeps ego sum omnium timentium te et custodientium praecepta tua";
kjv[64] = "Thy righteousness [is] an everlasting righteousness, and thy law [is] the truth.";
rsv[64] = "The earth, O LORD, is full of thy steadfast love; teach me thy statutes!";
asv[64] = "The earth, O Jehovah, is full of thy lovingkindness: Teach me thy statutes. ";
yng[64] = "Of Thy kindness, O Jehovah, the earth is full, Thy statutes teach Thou me!";
dby[64] = "The earth, O Jehovah, is full of thy loving-kindness: teach me thy statutes.";
web[64] = "The earth, O LORD, is full of thy mercy: teach me thy statutes.";
hnv[64] = "The eretz is full of your lovingkindness, LORD. Teach me your statutes. ";
vul[64] = "[Vulgate 118:64] misericordia tua conpleta est terra praecepta tua doce me";
kjv[65] = "Trouble and anguish have taken hold on me: [yet] thy commandments [are] my delights.";
rsv[65] = "Thou hast dealt well with thy servant, O LORD, according to thy word.";
asv[65] = "[TETH.] Thou hast dealt well with thy servant, O Jehovah, according unto thy word. ";
yng[65] = "[Teth.] Good Thou didst with Thy servant, O Jehovah, According to Thy word.";
dby[65] = "TETH. Thou hast dealt well with thy servant, O Jehovah, according to thy word.";
web[65] = "TETH. Thou hast dealt well with thy servant, O LORD, according to thy word.";
hnv[65] = "TET Do good to your servant, According to your word, LORD.";
vul[65] = "[Vulgate 118:65] teth benefecisti servo tuo Domine secundum verbum tuum";
kjv[66] = "The righteousness of thy testimonies [is] everlasting: give me understanding, and I shall live.";
rsv[66] = "Teach me good judgment and knowledge, for I believe in thy commandments.";
asv[66] = "Teach me good judgment and knowledge; For I have believed in thy commandments. ";
yng[66] = "The goodness of reason and knowledge teach me, For in Thy commands I have believed.";
dby[66] = "Teach me good discernment and knowledge; for I have believed in thy commandments.";
web[66] = "Teach me good judgment and knowledge: for I have believed thy commandments.";
hnv[66] = "Teach me good judgment and knowledge, For I believe in your mitzvot.";
vul[66] = "[Vulgate 118:66] bonum sermonem et scientiam doce me quia mandatis tuis credidi";
kjv[67] = "KOPH. I cried with [my] whole heart; hear me, O LORD: I will keep thy statutes.";
rsv[67] = "Before I was afflicted I went astray; but now I keep thy word.";
asv[67] = "Before I was afflicted I went astray; But now I observe thy word. ";
yng[67] = "Before I am afflicted, I -- I am erring, And now Thy saying I have kept.";
dby[67] = "Before I was afflicted I went astray, but now I keep thy word.";
web[67] = "Before I was afflicted I went astray: but now have I kept thy word.";
hnv[67] = "Before I was afflicted, I went astray; But now I observe your word.";
vul[67] = "[Vulgate 118:67] antequam audirem ego ignoravi nunc autem eloquium tuum custodivi";
kjv[68] = "I cried unto thee; save me, and I shall keep thy testimonies.";
rsv[68] = "Thou art good and doest good; teach me thy statutes.";
asv[68] = "Thou art good, and doest good; Teach me thy statutes. ";
yng[68] = "Good Thou [art], and doing good, Teach me Thy statutes.";
dby[68] = "Thou art good, and doest good; teach me thy statutes.";
web[68] = "Thou [art] good, and doest good; teach me thy statutes.";
hnv[68] = "You are good, and do good. Teach me your statutes.";
vul[68] = "[Vulgate 118:68] bonus tu et beneficus doce me praecepta tua";
kjv[69] = "I prevented the dawning of the morning, and cried: I hoped in thy word.";
rsv[69] = "The godless besmear me with lies, but with my whole heart I keep thy precepts;";
asv[69] = "The proud have forged a lie against me: With my whole heart will I keep thy precepts. ";
yng[69] = "Forged against me falsehood have the proud, I with the whole heart keep Thy precepts.";
dby[69] = "The proud have forged falsehood against me: I will observe thy precepts with [my] whole heart.";
web[69] = "The proud have forged a lie against me: [but] I will keep thy precepts with [my] whole heart.";
hnv[69] = "The proud have smeared a lie upon me. With my whole heart, I will keep your precepts.";
vul[69] = "[Vulgate 118:69] adplicabant mihi mendacium superbi ego autem in toto corde servabam praecepta tua";
kjv[70] = "Mine eyes prevent the [night] watches, that I might meditate in thy word.";
rsv[70] = "their heart is gross like fat, but I delight in thy law.";
asv[70] = "Their heart is as fat as grease; But I delight in thy law. ";
yng[70] = "Insensate as fat hath been their heart, I -- in Thy law I have delighted.";
dby[70] = "Their heart is as fat as grease: as for me, I delight in thy law.";
web[70] = "Their heart is as gross as fat; [but] I delight in thy law.";
hnv[70] = "Their heart is as callous as the fat, But I delight in your law.";
vul[70] = "[Vulgate 118:70] incrassatum est velut adeps cor eorum et ego in lege tua delectabar";
kjv[71] = "Hear my voice according unto thy lovingkindness: O LORD, quicken me according to thy judgment.";
rsv[71] = "It is good for me that I was afflicted, that I might learn thy statutes.";
asv[71] = "It is good for me that I have been afflicted; That I may learn thy statutes. ";
yng[71] = "Good for me that I have been afflicted, That I might learn Thy statutes.";
dby[71] = "It is good for me that I have been afflicted, that I might learn thy statutes.";
web[71] = "[It is] good for me that I have been afflicted; that I might learn thy statutes.";
hnv[71] = "It is good for me that I have been afflicted, That I may learn your statutes.";
vul[71] = "[Vulgate 118:71] bonum mihi quia adflictus sum ut discerem praecepta tua";
kjv[72] = "They draw nigh that follow after mischief: they are far from thy law.";
rsv[72] = "The law of thy mouth is better to me than thousands of gold and silver pieces.";
asv[72] = "The law of thy mouth is better unto me Than thousands of gold and silver. ";
yng[72] = "Better to me [is] the law of Thy mouth Than thousands of gold and silver!";
dby[72] = "The law of thy mouth is better unto me than thousands of gold and silver.";
web[72] = "The law of thy mouth [is] better to me than thousands of gold and silver.";
hnv[72] = "The law of your mouth is better to me than thousands of pieces of gold and silver. ";

hnv[73] = "YUD Your hands have made me and formed me. Give me understanding, that I may learn your mitzvot.";

dby[74] = "They that fear thee will see me, and rejoice; because I have hoped in thy word.";

hnv[74] = "Those who fear you will see me and be glad, Because I have put my hope in your word.";

rsv[75] = "I know, O LORD, that thy judgments are right, and that in faithfulness thou hast afflicted me.";
asv[75] = "I know, O Jehovah, that thy judgments are righteous, And that in faithfulness thou hast afflicted me. ";
yng[75] = "I have known, O Jehovah, That righteous [are] Thy judgments, And [in] faithfulness Thou hast afflicted me.";
dby[75] = "I know, Jehovah, that thy Judgments are righteousness, and that in faithfulness thou hast afflicted me.";
web[75] = "I know, O LORD, that thy judgments [are] right, and [that] thou in faithfulness hast afflicted me.";
hnv[75] = "LORD, I know that your judgments are righteous, That in faithfulness you have afflicted me.";

dby[76] = "Oh let thy loving-kindness be for my comfort, according to thy word unto thy servant.";
web[76] = "Let, I pray thee, thy merciful kindness be for my comfort, according to thy word to thy servant.";
hnv[76] = "Please let your lovingkindness be for my comfort, According to your word to your servant.";

rsv[77] = "Let thy mercy come to me, that I may live; for thy law is my delight.";
asv[77] = "Let thy tender mercies come unto me, that I may live; For thy law is my delight. ";
yng[77] = "Meet me do Thy mercies, and I live, For Thy law [is] my delight.";
dby[77] = "Let thy tender mercies come unto me, that I may live; for thy law is my delight.";
web[77] = "Let thy tender mercies come to me, that I may live: for thy law [is] my delight.";
hnv[77] = "Let your tender mercies come to me, that I may live; For your law is my delight.";
vul[77] = "[Vulgate 118:77] veniant mihi misericordiae tuae et vivam quia lex tua delectatio mea";
kjv[78] = "Great [are] thy tender mercies, O LORD: quicken me according to thy judgments.";
rsv[78] = "Let the godless be put to shame, because they have subverted me with guile; as for me, I will meditate on thy precepts.";
asv[78] = "Let the proud be put to shame; For they have overthrown me wrongfully: [But] I will meditate on thy precepts. ";
yng[78] = "Ashamed are the proud, For [with] falsehood they dealt perversely with me. I meditate in Thy precepts.";
dby[78] = "Let the proud be ashamed; for they have acted perversely towards me with falsehood: as for me, I meditate in thy precepts.";
web[78] = "Let the proud be ashamed; for they dealt perversely with me without a cause: [but] I will meditate in thy precepts.";
hnv[78] = "Let the proud be disappointed, for they have overthrown me wrongfully. I will meditate on your precepts.";
vul[78] = "[Vulgate 118:78] confundantur superbi quoniam inique contriverunt me ego autem loquar in praeceptis tuis";
kjv[79] = "Many [are] my persecutors and mine enemies; [yet] do I not decline from thy testimonies.";
rsv[79] = "Let those who fear thee turn to me, that they may know thy testimonies.";
asv[79] = "Let those that fear thee turn unto me; And they shall know thy testimonies. ";
yng[79] = "Those fearing Thee turn back to me, And those knowing Thy testimonies.";
dby[79] = "Let those that fear thee turn unto me, and those that know thy testimonies.";
web[79] = "Let those that fear thee turn to me, and those that have known thy testimonies.";
hnv[79] = "Let those who fear you turn to me. They will know your statutes.";

kjv[80] = "I beheld the transgressors, and was grieved; because they kept not thy word.";
rsv[80] = "May my heart be blameless in thy statutes, that I may not be put to shame!";
asv[80] = "Let my heart be perfect in thy statutes, That I be not put to shame. ";
yng[80] = "My heart is perfect in Thy statutes, So that I am not ashamed.";
dby[80] = "Let my heart be perfect in thy statutes, that I be not ashamed.";
web[80] = "Let my heart be sound in thy statutes; that I may not be ashamed.";
hnv[80] = "Let my heart be blameless toward your decrees, That I may not be disappointed. ";
vul[80] = "[Vulgate 118:80] fiat cor meum perfectum in praeceptis tuis ut non confundar";

yng[81] = "[Kaph.] Consumed for Thy salvation hath been my soul, For Thy word I have hoped.";

web[81] = "CAPH. My soul fainteth for thy salvation: [but] I hope in thy word.";
hnv[81] = "KAF My soul faints for your salvation. I hope in your word.";
vul[81] = "[Vulgate 118:81] caph defecit in salutare tuum anima mea verbum tuum expectavi";
kjv[82] = "Thy word [is] true [from] the beginning: and every one of thy righteous judgments [endureth] for ever.";

asv[82] = "Mine eyes fail for thy word, While I say, When wilt thou comfort me? ";
yng[82] = "Consumed have been mine eyes for Thy word, Saying, `When doth it comfort me?\'";
dby[82] = "Mine eyes fail for thy word, saying, When wilt thou comfort me?";
web[82] = "My eyes fail for thy word, saying, When wilt thou comfort me?";
hnv[82] = "My eyes fail for your word. I say, &quot;When will you comfort me?&quot;";

asv[83] = "For I am become like a wine-skin in the smoke; Yet do I not forget thy statutes. ";

dby[83] = "For I am become like a bottle in the smoke; I do not forget thy statutes.";
web[83] = "For I am become like a bottle in the smoke; [yet] I do not forget thy statutes.";
hnv[83] = "For I have become like a wineskin in the smoke. I don\'t forget your statutes.";
