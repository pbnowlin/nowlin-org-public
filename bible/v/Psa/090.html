kjv[1] = "[[A Prayer of Moses the man of God.]] Lord, thou hast been our dwelling place in all generations.";
rsv[1] = "A Prayer of Moses, the man of God. LORD, thou hast been our dwelling place in all generations.";
asv[1] = "[A Prayer of Moses the man of God.] Lord, thou hast been our dwelling-place In all generations. ";
yng[1] = "A Prayer of Moses, the man of God. Lord, a habitation Thou -- Thou hast been, To us -- in generation and generation,";
dby[1] = "{A Prayer of Moses, the man of God.} Lord, *thou* hast been our dwelling-place in all generations.";
web[1] = "A prayer of Moses the man of God. Lord, thou hast been our dwelling-place in all generations.";
hnv[1] = "A Prayer by Moshe, the man of God. Lord, you have been our dwelling place for all generations.";
vul[1] = "[Vulgate 89:1] oratio Mosi viri Dei Domine habitaculum tu factus es nobis in generatione et generatione";
kjv[2] = "Before the mountains were brought forth, or ever thou hadst formed the earth and the world, even from everlasting to everlasting, thou [art] God.";
rsv[2] = "Before the mountains were brought forth, or ever thou hadst formed the earth and the world, from everlasting to everlasting thou art God.";
asv[2] = "Before the mountains were brought forth, Or ever thou hadst formed the earth and the world, Even from everlasting to everlasting, thou art God. ";
yng[2] = "Before mountains were brought forth, And Thou dost form the earth and the world, Even from age unto age Thou [art] God.";
dby[2] = "Before the mountains were brought forth, and thou hadst formed the earth and the world, even from eternity to eternity thou art God.";
web[2] = "Before the mountains were brought forth, or ever thou hadst formed the earth and the world, even from everlasting to everlasting, thou [art] God.";
hnv[2] = "Before the mountains were brought forth, Or ever you had formed the eretz and the world, Even from everlasting to everlasting, you are God.";
vul[2] = "[Vulgate 89:2] antequam montes nascerentur et parturiretur terra et orbis a saeculo et usque in saeculum tu es";
kjv[3] = "Thou turnest man to destruction; and sayest, Return, ye children of men.";
rsv[3] = "Thou turnest man back to the dust, and sayest, &quot;Turn back, O children of men!&quot;";
asv[3] = "Thou turnest man to destruction, And sayest, Return, ye children of men. ";
yng[3] = "Thou turnest man unto a bruised thing, And sayest, Turn back, ye sons of men.";
dby[3] = "Thou makest [mortal] man to return to dust, and sayest, Return, children of men.";
web[3] = "Thou turnest man to destruction; and sayest, Return, ye children of men.";
hnv[3] = "You turn man to destruction, saying, &quot;Return, you children of men.&quot;";
vul[3] = "[Vulgate 89:3] convertes hominem usque ad contritionem et dices revertimini filii Adam";
kjv[4] = "For a thousand years in thy sight [are but] as yesterday when it is past, and [as] a watch in the night.";
rsv[4] = "For a thousand years in thy sight are but as yesterday when it is past, or as a watch in the night.";
asv[4] = "For a thousand years in thy sight Are but as yesterday when it is past, And as a watch in the night. ";
yng[4] = "For a thousand years in Thine eyes [are] as yesterday, For it passeth on, yea, a watch by night.";
dby[4] = "For a thousand years, in thy sight, are as yesterday when it is past, and [as] a watch in the night.";
web[4] = "For a thousand years in thy sight [are but] as yesterday when it is past, and [as] a watch in the night.";
hnv[4] = "For a thousand years in your sight Are but as yesterday when it is past, As a watch in the night.";
vul[4] = "[Vulgate 89:4] quia mille anni in oculis tuis sicut dies hesterna quae pertransiit et vigilia nocturna";
kjv[5] = "Thou carriest them away as with a flood; they are [as] a sleep: in the morning [they are] like grass [which] groweth up.";
rsv[5] = "Thou dost sweep men away; they are like a dream, like grass which is renewed in the morning:";
asv[5] = "Thou carriest them away as with a flood; they are as a sleep: In the morning they are like grass which groweth up. ";
yng[5] = "Thou hast inundated them, they are asleep, In the morning as grass he changeth.";
dby[5] = "Thou carriest them away as with a flood; they are [as] a sleep: in the morning they are like grass [that] groweth up:";
web[5] = "Thou carriest them away as with a flood; they are [as] a sleep; in the morning [they are] like grass [which] groweth.";
hnv[5] = "You sweep them away as they sleep. In the morning they sprout like new grass.";
vul[5] = "[Vulgate 89:5] percutiente te eos somnium erunt";
kjv[6] = "In the morning it flourisheth, and groweth up; in the evening it is cut down, and withereth.";
rsv[6] = "in the morning it flourishes and is renewed; in the evening it fades and withers.";
asv[6] = "In the morning it flourisheth, and groweth up; In the evening it is cut down, and withereth. ";
yng[6] = "In the morning it flourisheth, and hath changed, At evening it is cut down, and hath withered.";
dby[6] = "In the morning it flourisheth and groweth up; in the evening it is cut down and withereth.";
web[6] = "In the morning it flourisheth, and groweth; in the evening it is cut down, and withereth.";
hnv[6] = "In the morning it sprouts and springs up. By evening, it is withered and dry.";
vul[6] = "[Vulgate 89:6] mane quasi herba pertransiens mane floruit et abiit ad vesperam conteretur atque siccabitur";
kjv[7] = "For we are consumed by thine anger, and by thy wrath are we troubled.";
rsv[7] = "For we are consumed by thy anger; by thy wrath we are overwhelmed.";
asv[7] = "For we are consumed in thine anger, And in thy wrath are we troubled. ";
yng[7] = "For we were consumed in Thine anger, And in Thy fury we have been troubled.";
dby[7] = "For we are consumed by thine anger, and by thy fury are we troubled.";
web[7] = "For we are consumed by thy anger, and by thy wrath are we troubled.";
hnv[7] = "For we are consumed in your anger. We are troubled in your wrath.";
vul[7] = "[Vulgate 89:7] consumpti enim sumus in furore tuo et in indignatione tua conturbati sumus";
kjv[8] = "Thou hast set our iniquities before thee, our secret [sins] in the light of thy countenance.";
rsv[8] = "Thou hast set our iniquities before thee, our secret sins in the light of thy countenance.";
asv[8] = "Thou hast set our iniquities before thee, Our secret sins in the light of thy countenance. ";
yng[8] = "Thou hast set our iniquities before Thee, Our hidden things at the light of Thy face,";
dby[8] = "Thou hast set our iniquities before thee, our secret [sins] in the light of thy countenance.";
web[8] = "Thou hast set our iniquities before thee, our secret [sins] in the light of thy countenance.";
hnv[8] = "You have set our iniquities before you, Our secret sins in the light of your presence.";
vul[8] = "[Vulgate 89:8] posuisti iniquitates nostras coram te neglegentias nostras in luce vultus tui";
kjv[9] = "For all our days are passed away in thy wrath: we spend our years as a tale [that is told].";
rsv[9] = "For all our days pass away under thy wrath, our years come to an end like a sigh.";
asv[9] = "For all our days are passed away in thy wrath: We bring our years to an end as a sigh. ";
yng[9] = "For all our days pined away in Thy wrath, We consumed our years as a meditation.";
dby[9] = "For all our days pass away in thy wrath: we spend our years as a [passing] thought.";
web[9] = "For all our days are passed away in thy wrath: we spend our years, as a tale [that is told].";
hnv[9] = "For all our days have passed away in your wrath. We bring our years to an end as a sigh.";
vul[9] = "[Vulgate 89:9] omnes enim dies nostri transierunt in furore tuo consumpsimus annos nostros quasi sermonem loquens";
kjv[10] = "The days of our years [are] threescore years and ten; and if by reason of strength [they be] fourscore years, yet [is] their strength labour and sorrow; for it is soon cut off, and we fly away.";
rsv[10] = "The years of our life are threescore and ten, or even by reason of strength fourscore; yet their span is but toil and trouble; they are soon gone, and we fly away.";
asv[10] = "The days of our years are threescore years and ten, Or even by reason of strength fourscore years; Yet is their pride but labor and sorrow; For it is soon gone, and we fly away. ";
yng[10] = "Days of our years, in them [are] seventy years, And if, by reason of might, eighty years, Yet [is] their enlargement labour and vanity, For it hath been cut off hastily, and we fly away.";
dby[10] = "The days of our years are threescore years and ten; and if, by reason of strength, they be fourscore years, yet their pride is labour and vanity, for it is soon cut off, and we fly away.";
web[10] = "The days of our years [are] seventy years; and if by reason of strength [they are] eighty years, yet [is] their strength labor and sorrow; for it is soon cut off, and we fly away.";
hnv[10] = "The days of our years are seventy, Or even by reason of strength eighty years; Yet their pride is but labor and sorrow, For it passes quickly, and we fly away.";
vul[10] = "[Vulgate 89:10] dies annorum nostrorum in ipsis septuaginta anni si autem multum octoginta anni et quod amplius est labor et dolor quoniam transivimus cito et avolavimus";
kjv[11] = "Who knoweth the power of thine anger? even according to thy fear, [so is] thy wrath.";
rsv[11] = "Who considers the power of thy anger, and thy wrath according to the fear of thee?";
asv[11] = "Who knoweth the power of thine anger, And thy wrath according to the fear that is due unto thee? ";
yng[11] = "Who knoweth the power of Thine anger? And according to Thy fear -- Thy wrath?";
dby[11] = "Who knoweth the power of thine anger? and thy wrath according to the fear of thee?";
web[11] = "Who knoweth the power of thy anger? even according to thy fear, [so is] thy wrath.";
hnv[11] = "Who knows the power of your anger, Your wrath according to the fear that is due to you?";
vul[11] = "[Vulgate 89:11] quis novit fortitudinem irae tuae et secundum timorem tuum indignationem tuam";
kjv[12] = "So teach [us] to number our days, that we may apply [our] hearts unto wisdom.";
rsv[12] = "So teach us to number our days that we may get a heart of wisdom.";
asv[12] = "So teach us to number our days, That we may get us a heart of wisdom. ";
yng[12] = "To number our days aright let [us] know, And we bring the heart to wisdom.";
dby[12] = "So teach [us] to number our days, that we may acquire a wise heart.";
web[12] = "So teach [us] to number [our] days, that we may apply our hearts to wisdom.";
hnv[12] = "So teach us to number our days, That we may gain a heart of wisdom.";
vul[12] = "[Vulgate 89:12] ut numerentur dies nostri sic ostende et veniemus corde sapienti";
kjv[13] = "Return, O LORD, how long? and let it repent thee concerning thy servants.";
rsv[13] = "Return, O LORD! How long? Have pity on thy servants!";
asv[13] = "Return, O Jehovah; how long? And let it repent thee concerning thy servants. ";
yng[13] = "Turn back, O Jehovah, till when? And repent concerning Thy servants.";
dby[13] = "Return, Jehovah: how long? and let it repent thee concerning thy servants.";
web[13] = "Return, O LORD, how long? and repent thou concerning thy servants.";
hnv[13] = "Relent, LORD! How long? Have compassion on your servants!";
vul[13] = "[Vulgate 89:13] revertere Domine usquequo et exorabilis esto super servis tuis";
kjv[14] = "O satisfy us early with thy mercy; that we may rejoice and be glad all our days.";
rsv[14] = "Satisfy us in the morning with thy steadfast love, that we may rejoice and be glad all our days.";
asv[14] = "Oh satisfy us in the morning with thy lovingkindness, That we may rejoice and be glad all our days. ";
yng[14] = "Satisfy us at morn [with] Thy kindness, And we sing and rejoice all our days.";
dby[14] = "Satisfy us early with thy loving-kindness; that we may sing for joy and be glad all our days.";
web[14] = "O satisfy us early with thy mercy; that we may rejoice and be glad all our days.";
hnv[14] = "Satisfy us in the morning with your lovingkindness, That we may rejoice and be glad all our days.";
vul[14] = "[Vulgate 89:14] imple nos matutina misericordia tua et laudabimus et laetabimur in cunctis diebus nostris";
kjv[15] = "Make us glad according to the days [wherein] thou hast afflicted us, [and] the years [wherein] we have seen evil.";
rsv[15] = "Make us glad as many days as thou hast afflicted us, and as many years as we have seen evil.";
asv[15] = "Make us glad according to the days wherein thou hast afflicted us, And the years wherein we have seen evil. ";
yng[15] = "Cause us to rejoice according to the days Wherein Thou hast afflicted us, The years we have seen evil.";
dby[15] = "Make us glad according to the days [wherein] thou hast afflicted us, according to the years [wherein] we have seen evil.";
web[15] = "Make us glad according to the days [in which] thou hast afflicted us, [and] the years [in which] we have seen evil.";
hnv[15] = "Make us glad for as many days as you have afflicted us, For as many years as we have seen evil.";
vul[15] = "[Vulgate 89:15] laetifica nos pro diebus quibus adflixisti nos et annis in quibus vidimus mala";
kjv[16] = "Let thy work appear unto thy servants, and thy glory unto their children.";
rsv[16] = "Let thy work be manifest to thy servants, and thy glorious power to their children.";
asv[16] = "Let thy work appear unto thy servants, And thy glory upon their children. ";
yng[16] = "Let Thy work appear unto Thy servants, And Thine honour on their sons.";
dby[16] = "Let thy work appear unto thy servants, and thy majesty unto their sons.";
web[16] = "Let thy work appear to thy servants, and thy glory to their children.";
hnv[16] = "Let your work appear to your servants; Your glory to their children.";
vul[16] = "[Vulgate 89:16] appareat apud servos tuos opus tuum et gloria tua super filios eorum";
kjv[17] = "And let the beauty of the LORD our God be upon us: and establish thou the work of our hands upon us; yea, the work of our hands establish thou it.";
rsv[17] = "Let the favor of the Lord our God be upon us, and establish thou the work of our hands upon us, yea, the work of our hands establish thou it.";
asv[17] = "And let the favor of the Lord our God be upon us; And establish thou the work of our hands upon us; Yea, the work of our hands establish thou it. ";
yng[17] = "And let the pleasantness of Jehovah our God be upon us, And the work of our hands establish on us, Yea, the work of our hands establish it!";
dby[17] = "And let the beauty of Jehovah our God be upon us; and establish thou the work of our hands upon us: yea, the work of our hands, establish thou it.";
web[17] = "And let the beauty of the LORD our God be upon us: and establish thou the work of our hands upon us; yes, the work of our hands establish thou it.";
hnv[17] = "Let the favor of the Lord our God be on us; Establish the work of our hands for us; Yes, establish the work of our hands. ";
vul[17] = "[Vulgate 89:17] et sit decor Domini Dei nostri super nos et opus manuum nostrarum fac stabile super nos opus manuum nostrarum confirma";
csb[1] = "Lord, you have been our refuge in every generation.";
csb[2] = "Before the mountains were born, before you gave birth to the earth and the world, from eternity to eternity, you are God.";
csb[3] = "You return mankind to the dust, saying, &quot;Return, descendants of Adam.&quot;";
csb[4] = "For in your sight a thousand years are like yesterday that passes by, like a few hours of the night.";
csb[5] = "You end their lives; they sleep. They are like grass that grows in the morning --";
csb[6] = "in the morning it sprouts and grows; by evening it withers and dries up.";
csb[7] = "For we are consumed by your anger; we are terrified by your wrath.";
csb[8] = "You have set our iniquities before you, our secret sins in the light of your presence.";
csb[9] = "For all our days ebb away under your wrath; we end our years like a sigh.";
csb[10] = "Our lives last seventy years or, if we are strong, eighty years. Even the best of them are struggle and sorrow; indeed, they pass quickly and we fly away.";
csb[11] = "Who understands the power of your anger? Your wrath matches the fear that is due you.";
csb[12] = "Teach us to number our days carefully so that we may develop wisdom in our hearts.";
csb[13] = "LORD -- how long? Turn and have compassion on your servants.";
csb[14] = "Satisfy us in the morning with your faithful love so that we may shout with joy and be glad all our days.";
csb[15] = "Make us rejoice for as many days as you have humbled us, for as many years as we have seen adversity.";
csb[16] = "Let your work be seen by your servants, and your splendor by their children.";
csb[17] = "Let the favor of the Lord our God be on us; establish for us the work of our hands -- establish the work of our hands!";
</script>
