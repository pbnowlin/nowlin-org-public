kjv[1] = "[[[A Psalm] of David.]] Unto thee will I cry, O LORD my rock; be not silent to me: lest, [if] thou be silent to me, I become like them that go down into the pit.";
rsv[1] = "A Psalm of David. To thee, O LORD, I call; my rock, be not deaf to me, lest, if thou be silent to me, I become like those who go down to the Pit.";
asv[1] = "[A Psalm] of David. Unto thee, O Jehovah, will I call: My rock, be not thou deaf unto me; Lest, if thou be silent unto me, I become like them that go down into the pit. ";
yng[1] = "By David. Unto Thee, O Jehovah, I call, My rock, be not silent to me! Lest Thou be silent to me, And I have been compared With those going down to the pit.";
dby[1] = "{[A Psalm] of David.} Unto thee, Jehovah, do I call; my rock, be not silent unto me, lest, [if] thou keep silence toward me, I become like them that go down into the pit.";
web[1] = "[A Psalm] of David. To thee will I cry, O LORD my rock; be not silent to me: lest, [if] thou shouldst be silent to me, I should become like them that go down into the pit.";
hnv[1] = "By David. To you, LORD, I call. My rock, don\'t be deaf to me; Lest, if you are silent to me, I would become like those who go down into the pit.";
vul[1] = "[Vulgate 27:1] David ad te Domine clamabo Fortis meus ne obsurdescas mihi ne forte tacente te mihi conparer his qui descendunt in lacum";
kjv[2] = "Hear the voice of my supplications, when I cry unto thee, when I lift up my hands toward thy holy oracle.";
rsv[2] = "Hear the voice of my supplication, as I cry to thee for help, as I lift up my hands toward thy most holy sanctuary.";
asv[2] = "Hear the voice of my supplications, when I cry unto thee, When I lift up my hands toward thy holy oracle. ";
yng[2] = "Hear the voice of my supplications, In my crying unto Thee, In my lifting up my hands toward thy holy oracle.";
dby[2] = "Hear the voice of my supplications, when I cry unto thee, when I lift up my hands toward the oracle of thy holiness.";
web[2] = "Hear the voice of my supplications, when I cry to thee, when I lift my hands towards thy holy oracle.";
hnv[2] = "Hear the voice of my petitions, when I cry to you, When I lift up my hands toward your Most Holy Place.";
vul[2] = "[Vulgate 27:2] audi Domine deprecationem meam cum clamavero ad te cum levavero manus meas ad oraculum sanctum tuum";
kjv[3] = "Draw me not away with the wicked, and with the workers of iniquity, which speak peace to their neighbours, but mischief [is] in their hearts.";
rsv[3] = "Take me not off with the wicked, with those who are workers of evil, who speak peace with their neighbors, while mischief is in their hearts.";
asv[3] = "Draw me not away with the wicked, And with the workers of iniquity; That speak peace with their neighbors, But mischief is in their hearts. ";
yng[3] = "Draw me not with the wicked, And with workers of iniquity, Speaking peace with their neighbours, And evil in their heart.";
dby[3] = "Draw me not away with the wicked, and with the workers of iniquity, who speak peace to their neighbours, and mischief is in their heart.";
web[3] = "Draw me not away with the wicked, and with the workers of iniquity, who speak peace to their neighbors, but mischief [is] in their hearts.";
hnv[3] = "Don\'t draw me away with the wicked, With the workers of iniquity who speak shalom with their neighbors, But mischief is in their hearts.";
vul[3] = "[Vulgate 27:3] ne trahas me cum impiis et cum operantibus iniquitatem qui loquuntur pacem cum amicis suis et est malum in corde eorum";
kjv[4] = "Give them according to their deeds, and according to the wickedness of their endeavours: give them after the work of their hands; render to them their desert.";
rsv[4] = "Requite them according to their work, and according to the evil of their deeds; requite them according to the work of their hands; render them their due reward.";
asv[4] = "Give them according to their work, and according to the wickedness of their doings: Give them after the operation of their hands; Render to them their desert. ";
yng[4] = "Give to them according to their acting, And according to the evil of their doings. According to the work of their hands give to them. Return their deed to them.";
dby[4] = "Give them according to their doing, and according to the wickedness of their deeds; give them after the work of their hands, render to them their desert.";
web[4] = "Give them according to their deeds, and according to the wickedness of their endeavors: give them after the work of their hands; render to them their desert.";
hnv[4] = "Give them according to their work, and according to the wickedness of their doings. Give them according to the operation of their hands. Bring back on them what they deserve.";
vul[4] = "[Vulgate 27:4] da eis secundum opus suum et secundum malum adinventionum suarum iuxta opus manuum suarum da eis redde retributionem suam illis";
kjv[5] = "Because they regard not the works of the LORD, nor the operation of his hands, he shall destroy them, and not build them up.";
rsv[5] = "Because they do not regard the works of the LORD, or the work of his hands, he will break them down and build them up no more.";
asv[5] = "Because they regard not the works of Jehovah, Nor the operation of his hands, He will break them down and not build them up. ";
yng[5] = "For they attend not to the doing of Jehovah, And unto the work of His hands. He throweth them down, And doth not build them up.";
dby[5] = "For they regard not the deeds of Jehovah, nor the work of his hands: he will destroy them, and not build them up.";
web[5] = "Because they regard not the works of the LORD, nor the operation of his hands, he will destroy them, and not build them up.";
hnv[5] = "Because they don\'t regard the works of the LORD, Nor the operation of his hands, He will break them down and not build them up.";
vul[5] = "[Vulgate 27:5] quoniam non intellegunt opera Domini et opus manuum eius destrues eos et non aedificabis";
kjv[6] = "Blessed [be] the LORD, because he hath heard the voice of my supplications.";
rsv[6] = "Blessed be the LORD! for he has heard the voice of my supplications.";
asv[6] = "Blessed be Jehovah, Because he hath heard the voice of my supplications. ";
yng[6] = "Blessed [is] Jehovah, For He hath heard the voice of my supplications.";
dby[6] = "Blessed be Jehovah, for he hath heard the voice of my supplications.";
web[6] = "Blessed [be] the LORD, because he hath heard the voice of my supplications.";
hnv[6] = "Blessed be the LORD, Because he has heard the voice of my petitions.";
vul[6] = "[Vulgate 27:6] benedictus Dominus qui audivit vocem deprecationis meae";
kjv[7] = "The LORD [is] my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him.";
rsv[7] = "The LORD is my strength and my shield; in him my heart trusts; so I am helped, and my heart exults, and with my song I give thanks to him.";
asv[7] = "Jehovah is my strength and my shield; My heart hath trusted in him, and I am helped: Therefore my heart greatly rejoiceth; And with my song will I praise him. ";
yng[7] = "Jehovah [is] my strength, and my shield, In Him my heart trusted, and I have been helped. And my heart exulteth, And with my song I thank Him.";
dby[7] = "Jehovah is my strength and my shield; my heart confided in him, and I was helped: therefore my heart exulteth, and with my song will I praise him.";
web[7] = "The LORD [is] my strength, and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him.";
hnv[7] = "The LORD is my strength and my shield. My heart has trusted in him, and I am helped. Therefore my heart greatly rejoices. With my song I will thank him.";
vul[7] = "[Vulgate 27:7] Dominus fortitudo mea et scutum meum in ipso confisum est cor meum et habui adiutorium gavisum est cor meum et in cantico meo confitebor illi";
kjv[8] = "The LORD [is] their strength, and he [is] the saving strength of his anointed.";
rsv[8] = "The LORD is the strength of his people, he is the saving refuge of his anointed.";
asv[8] = "Jehovah is their strength, And he is a stronghold of salvation to his anointed. ";
yng[8] = "Jehovah [is] strength to him, Yea, the strength of the salvation of His anointed [is] He.";
dby[8] = "Jehovah is their strength; and he is the stronghold of salvation to his anointed one.";
web[8] = "The LORD [is] their strength, and he [is] the saving strength of his anointed.";
hnv[8] = "The LORD is their strength. He is a stronghold of salvation to his anointed.";
vul[8] = "[Vulgate 27:8] Dominus fortitudo mea et robur salutarium christi sui est";
kjv[9] = "Save thy people, and bless thine inheritance: feed them also, and lift them up for ever.";
rsv[9] = "O save thy people, and bless thy heritage; be thou their shepherd, and carry them for ever.";
asv[9] = "Save thy people, and bless thine inheritance: Be their shepherd also, and bear them up for ever. ";
yng[9] = "Save Thy people, and bless Thine inheritance, And feed them, and carry them to the age!";
dby[9] = "Save thy people, and bless thine inheritance; and feed them, and lift them up for ever.";
web[9] = "Save thy people, and bless thy inheritance: feed them also, and lift them up for ever.";
hnv[9] = "Save your people, And bless your inheritance. Be their shepherd also, And bear them up forever. ";
vul[9] = "[Vulgate 27:9] salva populum tuum et benedic hereditati tuae et pasce eos et subleva eos usque in sempiternum";
csb[1] = "LORD, I call to you; my rock, do not be deaf to me. If you remain silent to me, I will be like those going down to the Pit.";
csb[2] = "Listen to the sound of my pleading when I cry to you for help, when I lift up my hands toward your holy sanctuary.";
csb[3] = "Do not drag me away with the wicked, with the evildoers, who speak in friendly ways with their neighbors while malice is in their hearts.";
csb[4] = "Repay them according to what they have done -- according to the evil of their deeds. Repay them according to the work of their hands; give them back what they deserve.";
csb[5] = "Because they do not consider what the LORD has done or the work of his hands, he will tear them down and not rebuild them.";
csb[6] = "Blessed be the LORD, for he has heard the sound of my pleading.";
csb[7] = "The LORD is my strength and my shield; my heart trusts in him, and I am helped. Therefore my heart celebrates, and I give thanks to him with my song.";
csb[8] = "The LORD is the strength of his people; he is a stronghold of salvation for his anointed.";
csb[9] = "Save your people, bless your possession, shepherd them, and carry them forever.";
</script>
