web[4] = "Blessed [are] they that dwell in thy house: they will be still praising thee. Selah.";
hnv[4] = "Blessed are those who dwell in your house. They are always praising you. Selah.";

kjv[6] = "[Who] passing through the valley of Baca make it a well; the rain also filleth the pools.";

yng[6] = "Those passing through a valley of weeping, A fountain do make it, Blessings also cover the director.";

web[7] = "They go from strength to strength, [every one of them] in Zion appeareth before God.";

dby[8] = "Jehovah, God of hosts, hear my prayer; give ear, O God of Jacob. Selah.";
web[8] = "O LORD God of hosts, hear my prayer: give ear, O God of Jacob. Selah.";
hnv[8] = "LORD, God Tzva\'ot, hear my prayer. Listen, God of Ya`akov. Selah.";
vul[8] = "[Vulgate 83:9] Domine Deus exercituum exaudi orationem meam ausculta Deus Iacob semper";

web[11] = "For the LORD God [is] a sun and shield: the LORD will give grace and glory: no good will he withhold from them that walk uprightly.";
hnv[11] = "For the LORD God is a sun and a shield. The LORD will give grace and glory. He withholds no good thing from those who walk blamelessly.";

yng[12] = "Jehovah of Hosts! O the happiness of a man trusting in Thee.";
dby[12] = "Jehovah of hosts, blessed is the man that confideth in thee!";
web[12] = "O LORD of hosts, blessed [is] the man that trusteth in thee.";
hnv[12] = "LORD of Hosts, Blessed is the man who trusts in you. ";
vul[12] = "[Vulgate 83:13] nec prohibebit bonum ab his qui ambulant in perfectione Domine exercituum beatus homo qui confidet in te";
csb[1] = "How lovely is your dwelling place, LORD of Armies.";
csb[2] = "I long and yearn for the courts of the LORD; my heart and flesh cry out for the living God.";
csb[3] = "Even a sparrow finds a home, and a swallow, a nest for herself where she places her young -- near your altars, LORD of Armies, my King and my God.";
csb[4] = "How happy are those who reside in your house, who praise you continually. Selah";
csb[5] = "Happy are the people whose strength is in you, whose hearts are set on pilgrimage.";
csb[6] = "As they pass through the Valley of Baca, they make it a source of springwater; even the autumn rain will cover it with blessings.";
csb[7] = "They go from strength to strength; each appears before God in Zion.";
csb[8] = "LORD God of Armies, hear my prayer; listen, God of Jacob. Selah";
csb[9] = "Consider our shield, God; look on the face of your anointed one.";
csb[10] = "Better a day in your courts than a thousand anywhere else. I would rather stand at the threshold of the house of my God than live in the tents of wicked people.";
csb[11] = "For the LORD God is a sun and shield. The LORD grants favor and honor; he does not withhold the good from those who live with integrity.";
csb[12] = "Happy is the person who trusts in you, LORD of Armies!";
