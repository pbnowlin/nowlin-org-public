kjv[1] = "[[To the chief Musician upon Jonathelemrechokim, Michtam of David, when the Philistines took him in Gath.]] Be merciful unto me, O God: for man would swallow me up; he fighting daily oppresseth me.";
rsv[1] = "To the choirmaster: according to The Dove on Far-off Terebinths. A Miktam of David, when the Philistines seized him in Gath. Be gracious to me, O God, for men trample upon me; all day long foemen oppress me;";
asv[1] = "For the Chief Musician; set to Jonath elem rehokim. [A Psalm] of David. Michtam: when the Philistines took him in Gath. Be merciful unto me, O God; for man would swallow me up: All the day long he fighting oppresseth me. ";
yng[1] = "To the Overseer. -- `On the Dumb Dove far off.\' -- A secret treasure of David, in the Philistines\' taking hold of him in Gath. Favour me, O God, for man swallowed me up, All the day fighting he oppresseth me,";
dby[1] = "{To the chief Musician. On Jonathelem-rechokim. Of David. Michtam; when the Philistines took him in Gath.} Be gracious unto me, O God; for man would swallow me up: all the day long fighting he oppresseth me.";
web[1] = "To the chief Musician upon Jonathelem-rechokim, Michtam of David, when the Philistines took him in Gath. Be merciful to me, O God: for man would swallow me up; he fighting daily oppresseth me.";
hnv[1] = "For the Chief Musician. To the tune &quot;Silent Dove in Distant Lands.&quot; A miktam by David, when the Pelishtim seized him in Gat. Be merciful to me, God, for man wants to swallow me up. All day long, he attacks and oppresses me.";
vul[1] = "[Vulgate 55:1] victori pro columba muta eo quod procul abierit David humilis et simplex quando tenuerunt eum Palestini in Geth [Vulgate 55:2] miserere mei Deus quoniam conculcavit me homo tota die pugnans tribulavit me";
kjv[2] = "Mine enemies would daily swallow [me] up: for [they be] many that fight against me, O thou most High.";
rsv[2] = "my enemies trample upon me all day long, for many fight against me proudly.";
asv[2] = "Mine enemies would swallow me up all the day long; For they are many that fight proudly against me. ";
yng[2] = "Mine enemies have swallowed up all the day, For many [are] fighting against me, O most High,";
dby[2] = "Mine enemies would swallow [me] up all the day long; for they are many that fight against me haughtily.";
web[2] = "My enemies would daily swallow [me] up: for [they are] many that fight against me, O thou Most High.";
hnv[2] = "My enemies want to swallow me up all day long, For they are many who fight proudly against me.";
vul[2] = "[Vulgate 55:3] conculcaverunt me insidiatores mei tota die multi enim qui pugnant contra me Altissime";
kjv[3] = "What time I am afraid, I will trust in thee.";
rsv[3] = "When I am afraid, I put my trust in thee.";
asv[3] = "What time I am afraid, I will put my trust in thee. ";
yng[3] = "The day I am afraid I am confident toward Thee.";
dby[3] = "In the day that I am afraid, I will confide in thee.";
web[3] = "In the time when I am afraid, I will trust in thee.";
hnv[3] = "When I am afraid, I will put my trust in you.";
vul[3] = "[Vulgate 55:4] quacumque die territus fuero ego in te confidam";
kjv[4] = "In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me.";
rsv[4] = "In God, whose word I praise, in God I trust without a fear. What can flesh do to me?";
asv[4] = "In God (I will praise his word), In God have I put my trust, I will not be afraid; What can flesh do unto me? ";
yng[4] = "In God I praise His word, in God I have trusted, I fear not what flesh doth to me.";
dby[4] = "In God will I praise his word, in God I put my confidence: I will not fear; what can flesh do unto me?";
web[4] = "In God I will praise his word, in God I have put my trust; I will not fear what flesh can do to me.";
hnv[4] = "In God, I praise his word. In God, I put my trust. I will not be afraid. What can flesh do to me?";
vul[4] = "[Vulgate 55:5] in Deo laudavi verbum in Deo speravi non timebo quid faciat caro mihi";
kjv[5] = "Every day they wrest my words: all their thoughts [are] against me for evil.";
rsv[5] = "All day long they seek to injure my cause; all their thoughts are against me for evil.";
asv[5] = "All the day long they wrest my words: All their thoughts are against me for evil. ";
yng[5] = "All the day they wrest my words, Concerning me all their thoughts [are] for evil,";
dby[5] = "All the day long they wrest my words; all their thoughts are against me for evil.";
web[5] = "Every day they wrest my words: all their thoughts [are] against me for evil.";
hnv[5] = "All day long they twist my words. All their thoughts are against me for evil.";
vul[5] = "[Vulgate 55:6] tota die sermonibus me adfligebant contra me omnes cogitationes eorum in malum";
kjv[6] = "They gather themselves together, they hide themselves, they mark my steps, when they wait for my soul.";
rsv[6] = "They band themselves together, they lurk, they watch my steps. As they have waited for my life,";
asv[6] = "They gather themselves together, they hide themselves, They mark my steps, Even as they have waited for my soul. ";
yng[6] = "They assemble, they hide, they watch my heels, When they have expected my soul.";
dby[6] = "They gather themselves together, they hide themselves; they mark my steps, because they wait for my soul.";
web[6] = "They assemble themselves, they hide themselves, they mark my steps, when they wait for my soul.";
hnv[6] = "They conspire and lurk, Watching my steps, they are eager to take my life.";
vul[6] = "[Vulgate 55:7] congregabuntur abscondite plantas meas observabunt expectantes animam meam";
kjv[7] = "Shall they escape by iniquity? in [thine] anger cast down the people, O God.";
rsv[7] = "so recompense them for their crime; in wrath cast down the peoples, O God!";
asv[7] = "Shall they escape by iniquity? In anger cast down the peoples, O God. ";
yng[7] = "By iniquity they escape, In anger the peoples put down, O God.";
dby[7] = "Shall they escape by iniquity? In anger cast down the peoples, O God.";
web[7] = "Shall they escape by iniquity; in [thy] anger cast down the people, O God.";
hnv[7] = "Shall they escape by iniquity? In anger cast down the peoples, God.";
vul[7] = "[Vulgate 55:8] quia nullus est salvus in eis in furore populos detrahet Deus";
kjv[8] = "Thou tellest my wanderings: put thou my tears into thy bottle: [are they] not in thy book?";
rsv[8] = "Thou hast kept count of my tossings; put thou my tears in thy bottle! Are they not in thy book?";
asv[8] = "Thou numberest my wanderings: Put thou my tears into thy bottle; Are they not in thy book? ";
yng[8] = "My wandering Thou hast counted, Thou -- place Thou my tear in Thy bottle, Are they not in Thy book?";
dby[8] = "*Thou* countest my wanderings; put my tears into thy bottle: are they not in thy book?";
web[8] = "Thou numberest my wanderings: put thou my tears into thy bottle: [are they] not in thy book?";
hnv[8] = "You number my wanderings. You put my tears into your bottle. Aren\'t they in your book?";
vul[8] = "[Vulgate 55:9] secretiora mea numerasti pone lacrimam meam in conspectu tuo sed non in narratione tua";
kjv[9] = "When I cry [unto thee], then shall mine enemies turn back: this I know; for God [is] for me.";
rsv[9] = "Then my enemies will be turned back in the day when I call. This I know, that God is for me.";
asv[9] = "Then shall mine enemies turn back in the day that I call: This I know, that God is for me. ";
yng[9] = "Then turn back do mine enemies in the day I call. This I have known, that God [is] for me.";
dby[9] = "Then shall mine enemies return backward in the day when I call: this I know, for God is for me.";
web[9] = "When I cry [to thee], then shall my enemies turn back: this I know; for God [is] for me.";
hnv[9] = "Then my enemies shall turn back in the day that I call. I know this, that God is for me.";
vul[9] = "[Vulgate 55:10] tunc convertentur inimici mei retrorsum in quacumque die invocavero hoc scio quia Deus meus es";
kjv[10] = "In God will I praise [his] word: in the LORD will I praise [his] word.";
rsv[10] = "In God, whose word I praise, in the LORD, whose word I praise,";
asv[10] = "In God (I will praise [his] word), In Jehovah (I will praise [his] word), ";
yng[10] = "In God I praise the word, In Jehovah I praise the word.";
dby[10] = "In God will I praise [his] word; in Jehovah will I praise [his] word.";
web[10] = "In God will I praise [his] word: in the LORD will I praise [his] word.";
hnv[10] = "In God, I will praise his word. In the LORD, I will praise his word.";

kjv[11] = "In God have I put my trust: I will not be afraid what man can do unto me.";
rsv[11] = "in God I trust without a fear. What can man do to me?";
asv[11] = "In God have I put my trust, I will not be afraid; What can man do unto me? ";
yng[11] = "In God I trusted, I fear not what man doth to me,";
dby[11] = "In God have I put my confidence: I will not fear; what can man do unto me?";
web[11] = "In God have I put my trust: I will not be afraid what man can do to me.";
hnv[11] = "I have put my trust in God. I will not be afraid. What can man do to me?";
vul[11] = "[Vulgate 55:11b] in Deo speravi non timebo quid faciat homo mihi";
kjv[12] = "Thy vows [are] upon me, O God: I will render praises unto thee.";
rsv[12] = "My vows to thee I must perform, O God; I will render thank offerings to thee.";
asv[12] = "Thy vows are upon me, O God: I will render thank-offerings unto thee. ";
yng[12] = "On me, O God, [are] Thy vows, I repay thank-offerings to Thee.";
dby[12] = "Thy vows are upon me, O God: I will render thanks unto thee.";
web[12] = "Thy vows [are] upon me, O God: I will render praises to thee.";
hnv[12] = "Your vows are on me, God. I will give thank offerings to you.";
vul[12] = "[Vulgate 55:12] in me sunt Deus vota tua reddam gratiarum actiones tibi";
kjv[13] = "For thou hast delivered my soul from death: [wilt] not [thou deliver] my feet from falling, that I may walk before God in the light of the living?";
rsv[13] = "For thou hast delivered my soul from death, yea, my feet from falling, that I may walk before God in the light of life.";
asv[13] = "For thou hast delivered my soul from death: [Hast thou] not [delivered] my feet from falling, That I may walk before God In the light of the living? ";
yng[13] = "For Thou hast delivered my soul from death, Dost Thou not my feet from falling? To walk habitually before God in the light of the living!";
dby[13] = "For thou hast delivered my soul from death; [wilt thou] not [keep] my feet from falling, that I may walk before God in the light of the living?";
web[13] = "For thou hast delivered my soul from death: [wilt thou] not [deliver] my feet from falling, that I may walk before God in the light of the living?";
hnv[13] = "For you have delivered my soul from death, And prevented my feet from falling, That I may walk before God in the light of the living. ";
vul[13] = "[Vulgate 55:13] quia liberasti animam meam de morte et pedes meos de lapsu ut ambulem coram Deo in luce viventium";
csb[1] = "Be gracious to me, God, for a man is trampling me; he fights and oppresses me all day long.";
csb[2] = "My adversaries trample me all day, for many arrogantly fight against me.";
csb[3] = "When I am afraid, I will trust in you.";
csb[4] = "In God, whose word I praise, in God I trust; I will not be afraid. What can mere mortals do to me?";
csb[5] = "They twist my words all day long; all their thoughts against me are evil.";
csb[6] = "They stir up strife, they lurk; they watch my steps while they wait to take my life.";
csb[7] = "Will they escape in spite of such sin? God, bring down the nations in wrath.";
csb[8] = "You yourself have recorded my wanderings. Put my tears in your bottle. Are they not in your book?";
csb[9] = "Then my enemies will retreat on the day when I call. This I know: God is for me.";
csb[10] = "In God, whose word I praise, in the LORD, whose word I praise,";
csb[11] = "in God I trust; I will not be afraid. What can mere humans do to me?";
csb[12] = "I am obligated by vows to you, God; I will make my thank offerings to you.";
csb[13] = "For you rescued me from death, even my feet from stumbling, to walk before God in the light of life.";
