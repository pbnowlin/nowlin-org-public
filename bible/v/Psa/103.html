csb[1] = "My soul, bless the LORD, and all that is within me, bless his holy name.";
csb[2] = "My soul, bless the LORD, and do not forget all his benefits.";
csb[3] = "He forgives all your iniquity; he heals all your diseases.";
csb[4] = "He redeems your life from the Pit; he crowns you with faithful love and compassion.";
csb[5] = "He satisfies you with good things; your youth is renewed like the eagle.";
csb[6] = "The LORD executes acts of righteousness and justice for all the oppressed.";
csb[7] = "He revealed his ways to Moses, his deeds to the people of Israel.";
csb[8] = "The LORD is compassionate and gracious, slow to anger and abounding in faithful love.";
csb[9] = "He will not always accuse us or be angry forever.";
csb[10] = "He has not dealt with us as our sins deserve or repaid us according to our iniquities.";
csb[11] = "For as high as the heavens are above the earth, so great is his faithful love toward those who fear him.";
csb[12] = "As far as the east is from the west, so far has he removed our transgressions from us.";
csb[13] = "As a father has compassion on his children, so the LORD has compassion on those who fear him.";
csb[14] = "For he knows what we are made of, remembering that we are dust.";
csb[15] = "As for man, his days are like grass -- he blooms like a flower of the field;";
csb[16] = "when the wind passes over it, it vanishes, and its place is no longer known.";

csb[18] = "of those who keep his covenant, who remember to observe his precepts.";

csb[22] = "Bless the LORD, all his works in all the places where he rules. My soul, bless the LORD!";
