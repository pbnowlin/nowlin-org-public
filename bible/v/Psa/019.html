csb[1] = "The heavens declare the glory of God, and the expanse proclaims the work of his hands.";
csb[2] = "Day after day they pour out speech; night after night they communicate knowledge.";
csb[3] = "There is no speech; there are no words; their voice is not heard.";
csb[4] = "Their message has gone out to the whole earth, and their words to the ends of the world. In the heavens he has pitched a tent for the sun.";

csb[9] = "The fear of the LORD is pure, enduring forever; the ordinances of the LORD are reliable and altogether righteous.";

csb[12] = "Who perceives his unintentional sins? Cleanse me from my hidden faults.";
csb[13] = "Moreover, keep your servant from willful sins; do not let them rule me. Then I will be blameless and cleansed from blatant rebellion.";
csb[14] = "May the words of my mouth and the meditation of my heart be acceptable to you, LORD, my rock and my Redeemer.";
