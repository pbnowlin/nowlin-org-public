kjv[1] = "[[A Psalm of Asaph.]] O God, the heathen are come into thine inheritance; thy holy temple have they defiled; they have laid Jerusalem on heaps.";
rsv[1] = "A Psalm of Asaph. O God, the heathen have come into thy inheritance; they have defiled thy holy temple; they have laid Jerusalem in ruins.";
asv[1] = "[A Psalm of Asaph.] O God, the nations are come into thine inheritance; Thy holy temple have they defiled; They have laid Jerusalem in heaps. ";
yng[1] = "A Psalm of Asaph. O God, nations have come into Thy inheritance, They have defiled Thy holy temple, They made Jerusalem become heaps,";
dby[1] = "{A Psalm of Asaph.} O God, the nations are come into thine inheritance: thy holy temple have they defiled; they have laid Jerusalem in heaps.";
web[1] = "A Psalm of Asaph. O God, the heathen have come into thy inheritance; thy holy temple have they defiled; they have laid Jerusalem on heaps.";
hnv[1] = "A Psalm by Asaf. God, the nations have come into your inheritance. They have defiled your holy temple. They have laid Yerushalayim in heaps.";
vul[1] = "[Vulgate 78:1] canticum Asaph Deus venerunt gentes in hereditatem tuam polluerunt templum sanctum tuum posuerunt Hierusalem in acervis lapidum";
kjv[2] = "The dead bodies of thy servants have they given [to be] meat unto the fowls of the heaven, the flesh of thy saints unto the beasts of the earth.";
rsv[2] = "They have given the bodies of thy servants to the birds of the air for food, the flesh of thy saints to the beasts of the earth.";
asv[2] = "The dead bodies of thy servants have they given to be food unto the birds of the heavens, The flesh of thy saints unto the beasts of the earth. ";
yng[2] = "They gave the dead bodies of Thy servants Food for the fowls of the heavens, The flesh of Thy saints For the wild beast of the earth.";
dby[2] = "The dead bodies of thy servants have they given to be meat unto the fowl of the heavens, the flesh of thy saints unto the beasts of the earth:";
web[2] = "The dead bodies of thy servants have they given [to be] food to the fowls of the heaven, the flesh of thy saints, to the beasts of the earth.";
hnv[2] = "They have given the dead bodies of your servants to be food for the birds of the sky, The flesh of your holy ones to the animals of the eretz.";
vul[2] = "[Vulgate 78:2] dederunt cadavera servorum tuorum escam volatilibus caeli carnes sanctorum tuorum bestiis terrae";
kjv[3] = "Their blood have they shed like water round about Jerusalem; and [there was] none to bury [them].";
rsv[3] = "They have poured out their blood like water round about Jerusalem, and there was none to bury them.";
asv[3] = "Their blood have they shed like water round about Jerusalem; And there was none to bury them. ";
yng[3] = "They have shed their blood As water round about Jerusalem, And there is none burying.";
dby[3] = "Their blood have they shed like water round about Jerusalem, and there was none to bury [them].";
web[3] = "Their blood have they shed like water around Jerusalem; and [there was] none to bury [them].";
hnv[3] = "Their blood they have shed like water around Yerushalayim. There was no one to bury them.";
vul[3] = "[Vulgate 78:3] effuderunt sanguinem eorum quasi aquam in circuitu Hierusalem et non erat qui sepeliret";
kjv[4] = "We are become a reproach to our neighbours, a scorn and derision to them that are round about us.";
rsv[4] = "We have become a taunt to our neighbors, mocked and derided by those round about us.";
asv[4] = "We are become a reproach to our neighbors, A scoffing and derision to them that are round about us. ";
yng[4] = "We have been a reproach to our neighbours, A scorn and a derision to our surrounders.";
dby[4] = "We are become a reproach to our neighbours, a mockery and a derision to them that are round about us.";
web[4] = "We have become a reproach to our neighbors, a scorn and derision to them that are around us.";
hnv[4] = "We have become a reproach to our neighbors, A scoffing and derision to those who are around us.";
vul[4] = "[Vulgate 78:4] facti sumus obprobrium vicinis nostris subsannatio et derisio his qui in circuitu nostro sunt";
kjv[5] = "How long, LORD? wilt thou be angry for ever? shall thy jealousy burn like fire?";
rsv[5] = "How long, O LORD? Wilt thou be angry for ever? Will thy jealous wrath burn like fire?";
asv[5] = "How long, O Jehovah? wilt thou be angry for ever? Shall thy jealousy burn like fire? ";
yng[5] = "Till when, O Jehovah? art Thou angry for ever? Thy jealousy doth burn as fire.";
dby[5] = "How long, O Jehovah? wilt thou be angry for ever? Shall thy jealousy burn like fire?";
web[5] = "How long, LORD? wilt thou be angry for ever? shall thy jealousy burn like fire?";
hnv[5] = "How long, LORD? Will you be angry forever? Will your jealousy burn like fire?";
vul[5] = "[Vulgate 78:5] usquequo Domine irasceris in finem ardebit quasi ignis zelus tuus";
kjv[6] = "Pour out thy wrath upon the heathen that have not known thee, and upon the kingdoms that have not called upon thy name.";
rsv[6] = "Pour out thy anger on the nations that do not know thee, and on the kingdoms that do not call on thy name!";
asv[6] = "Pour out thy wrath upon the nations that know thee not, And upon the kingdoms that call not upon thy name. ";
yng[6] = "Pour Thy fury on the nations who have not known Thee, And on kingdoms that have not called in Thy name.";
dby[6] = "Pour out thy fury upon the nations that have not known thee, and upon the kingdoms that call not upon thy name:";
web[6] = "Pour out thy wrath upon the heathen that have not known thee, and upon the kingdoms that have not called upon thy name.";
hnv[6] = "Pour out your wrath on the nations that don\'t know you; On the kingdoms that don\'t call on your name;";
vul[6] = "[Vulgate 78:6] effunde furorem tuum super gentes quae non cognoverunt te et super regna quae nomen tuum non invocaverunt";
kjv[7] = "For they have devoured Jacob, and laid waste his dwelling place.";
rsv[7] = "For they have devoured Jacob, and laid waste his habitation.";
asv[7] = "For they have devoured Jacob, And laid waste his habitation. ";
yng[7] = "For [one] hath devoured Jacob, And his habitation they have made desolate.";
dby[7] = "For they have devoured Jacob, and laid waste his habitation.";
web[7] = "For they have devoured Jacob, and laid waste his dwelling-place.";
hnv[7] = "For they have devoured Ya`akov, And destroyed his homeland.";
vul[7] = "[Vulgate 78:7] quia comederunt Iacob et decorem eius desolaverunt";
kjv[8] = "O remember not against us former iniquities: let thy tender mercies speedily prevent us: for we are brought very low.";
rsv[8] = "Do not remember against us the iniquities of our forefathers; let thy compassion come speedily to meet us, for we are brought very low.";
asv[8] = "Remember not against us the iniquities of our forefathers: Let thy tender mercies speedily meet us; For we are brought very low. ";
yng[8] = "Remember not for us the iniquities of forefathers, Haste, let Thy mercies go before us, For we have been very weak.";
dby[8] = "Remember not against us the iniquities of [our] forefathers; let thy tender mercies speedily come to meet us: for we are brought very low.";
web[8] = "O remember not against us former iniquities: let thy tender mercies speedily succor us: for we are brought very low.";
hnv[8] = "Don\'t hold the iniquities of our forefathers against us. Let your tender mercies speedily meet us, For we are in desperate need.";
vul[8] = "[Vulgate 78:8] ne recorderis iniquitatum nostrarum veterum cito occupent nos misericordiae tuae quia adtenuati sumus nimis";
kjv[9] = "Help us, O God of our salvation, for the glory of thy name: and deliver us, and purge away our sins, for thy name\'s sake.";
rsv[9] = "Help us, O God of our salvation, for the glory of thy name; deliver us, and forgive our sins, for thy name\'s sake!";
asv[9] = "Help us, O God of our salvation, for the glory of thy name; And deliver us, and forgive our sins, for thy name\'s sake. ";
yng[9] = "Help us, O God of our salvation, Because of the honour of Thy name, And deliver us, and cover over our sins, For Thy name\'s sake.";
dby[9] = "Help us, O God of our salvation, because of the glory of thy name; and deliver us, and forgive our sins, for thy name\'s sake.";
web[9] = "Help us, O God of our salvation, for the glory of thy name: and deliver us, and purge away our sins, for thy name\'s sake.";
hnv[9] = "Help us, God of our salvation, for the glory of your name. Deliver us, and forgive our sins, for your name\'s sake.";
vul[9] = "[Vulgate 78:9] auxiliare nobis Deus Iesus noster propter gloriam nominis tui et libera nos et propitiare peccatis nostris propter nomen tuum";
kjv[10] = "Wherefore should the heathen say, Where [is] their God? let him be known among the heathen in our sight [by] the revenging of the blood of thy servants [which is] shed.";
rsv[10] = "Why should the nations say, &quot;Where is their God?&quot; Let the avenging of the outpoured blood of thy servants be known among the nations before our eyes!";
asv[10] = "Wherefore should the nations say, Where is their God? Let the avenging of the blood of thy servants which is shed Be known among the nations in our sight. ";
yng[10] = "Why do the nations say, `Where [is] their God?\' Let be known among the nations before our eyes, The vengeance of the blood of Thy servants that is shed.";
dby[10] = "Wherefore should the nations say, Where is their God? Let the avenging of the blood of thy servants that is shed be known among the nations in our sight.";
web[10] = "Why should the heathen say, Where [is] their God? let him be known among the heathen in our sight [by] avenging the blood of thy servants [which is] shed.";
hnv[10] = "Why should the nations say, &quot;Where is their God?&quot; Let it be known among the nations, before our eyes, That vengeance for your servants\' blood is being poured out.";
vul[10] = "[Vulgate 78:10] quare dicunt gentes ubi est Deus eorum nota fiat in gentibus ante oculos nostros ultio sanguinis servorum tuorum qui effusus est";
kjv[11] = "Let the sighing of the prisoner come before thee; according to the greatness of thy power preserve thou those that are appointed to die;";
rsv[11] = "Let the groans of the prisoners come before thee; according to thy great power preserve those doomed to die!";
asv[11] = "Let the sighing of the prisoner come before thee: According to the greatness of thy power preserve thou those that are appointed to death; ";
yng[11] = "Let the groaning of the prisoner come in before Thee, According to the greatness of Thine arm, Leave Thou the sons of death.";
dby[11] = "Let the groaning of the prisoner come before thee; according to the greatness of thine arm, preserve those that are appointed to die;";
web[11] = "Let the sighing of the prisoner come before thee; according to the greatness of thy power preserve thou those that are appointed to die;";
hnv[11] = "Let the sighing of the prisoner come before you. According to the greatness of your power, preserve those who are sentenced to death;";
vul[11] = "[Vulgate 78:11] ingrediatur coram te gemitus vinctorum in magnitudine brachii tui relinque filios interitus";
kjv[12] = "And render unto our neighbours sevenfold into their bosom their reproach, wherewith they have reproached thee, O Lord.";
rsv[12] = "Return sevenfold into the bosom of our neighbors the taunts with which they have taunted thee, O Lord!";
asv[12] = "And render unto our neighbors sevenfold into their bosom Their reproach, wherewith they have reproached thee, O Lord. ";
yng[12] = "And turn Thou back to our neighbours, Sevenfold unto their bosom, their reproach, Wherewith they reproached Thee, O Lord.";
dby[12] = "And render unto our neighbours, sevenfold into their bosom, their reproach, wherewith they have reproached thee, O Lord.";
web[12] = "And render to our neighbors seven-fold into their bosom their reproach, with which they have reproached thee, O Lord.";
hnv[12] = "Pay back to our neighbors seven times into their bosom Their reproach with which they have reproached you, Lord.";
vul[12] = "[Vulgate 78:12] et redde vicinis nostris septuplum in sinu eorum obprobrium suum quo exprobraverunt tibi Domine";
kjv[13] = "So we thy people and sheep of thy pasture will give thee thanks for ever: we will shew forth thy praise to all generations.";
rsv[13] = "Then we thy people, the flock of thy pasture, will give thanks to thee for ever; from generation to generation we will recount thy praise.";
asv[13] = "So we thy people and sheep of thy pasture Will give thee thanks for ever: We will show forth thy praise to all generations. ";
yng[13] = "And we, Thy people, and the flock of Thy pasture, We give thanks to Thee to the age, To all generations we recount Thy praise!";
dby[13] = "And we, thy people and the sheep of thy pasture, will give thanks unto thee for ever; we will shew forth thy praise from generation to generation.";
web[13] = "So we thy people and sheep of thy pasture will give thee thanks for ever: we will show forth thy praise to all generations.";
hnv[13] = "So we, your people and sheep of your pasture, Will give you thanks forever. We will praise you forever, to all generations. ";
vul[13] = "[Vulgate 78:13] nos enim populus tuus et grex pascuae tuae confitebimur tibi in sempiternum in generatione et generatione narrabimus laudes tuas";
csb[1] = "God, the nations have invaded your inheritance, desecrated your holy temple, and turned Jerusalem into ruins.";
csb[2] = "They gave the corpses of your servants to the birds of the sky for food, the flesh of your faithful ones to the beasts of the earth.";
csb[3] = "They poured out their blood like water all around Jerusalem, and there was no one to bury them.";
csb[4] = "We have become an object of reproach to our neighbors, a source of mockery and ridicule to those around us.";
csb[5] = "How long, LORD? Will you be angry forever? Will your jealousy keep burning like fire?";
csb[6] = "Pour out your wrath on the nations that don\'t acknowledge you, on the kingdoms that don\'t call on your name,";
csb[7] = "for they have devoured Jacob and devastated his homeland.";
csb[8] = "Do not hold past iniquities against us; let your compassion come to us quickly, for we have become very weak.";
csb[9] = "God of our salvation, help us -- for the glory of your name. Rescue us and atone for our sins, for your name\'s sake.";
csb[10] = "Why should the nations ask, &quot;Where is their God? &quot; Before our eyes, let vengeance for the shed blood of your servants be known among the nations.";
csb[11] = "Let the groans of the prisoners reach you; according to your great power, preserve those condemned to die.";
csb[12] = "Pay back sevenfold to our neighbors the reproach they have hurled at you, Lord.";
csb[13] = "Then we, your people, the sheep of your pasture, will thank you forever; we will declare your praise to generation after generation.";
</script>
