kjv[1] = "In thee, O LORD, do I put my trust: let me never be put to confusion.";
rsv[1] = "In thee, O LORD, do I take refuge; let me never be put to shame!";
asv[1] = "In thee, O Jehovah, do I take refuge: Let me never be put to shame. ";
yng[1] = "In Thee, O Jehovah, I have trusted, Let me not be ashamed to the age.";
dby[1] = "In thee, Jehovah, do I trust: let me never be ashamed.";
web[1] = "In thee, O LORD, do I put my trust: let me never be put to confusion.";
hnv[1] = "In you, LORD, I take refuge. Never let me be disappointed.";
vul[1] = "[Vulgate 70:1] in te Domine speravi ne confundar in aeternum";
kjv[2] = "Deliver me in thy righteousness, and cause me to escape: incline thine ear unto me, and save me.";
rsv[2] = "In thy righteousness deliver me and rescue me; incline thy ear to me, and save me!";
asv[2] = "Deliver me in thy righteousness, and rescue me: Bow down thine ear unto me, and save me. ";
yng[2] = "In Thy righteousness Thou dost deliver me, And dost cause me to escape, Incline unto me Thine ear, and save me.";
dby[2] = "Deliver me in thy righteousness, and rescue me; incline thine ear unto me, and save me.";
web[2] = "Deliver me in thy righteousness, and cause me to escape: incline thy ear to me, and save me.";
hnv[2] = "Deliver me in your righteousness, and rescue me. Turn your ear to me, and save me.";
vul[2] = "[Vulgate 70:2] iustitia tua erue me et libera inclina ad me aurem tuam et salva me";
kjv[3] = "Be thou my strong habitation, whereunto I may continually resort: thou hast given commandment to save me; for thou [art] my rock and my fortress.";
rsv[3] = "Be thou to me a rock of refuge, a strong fortress, to save me, for thou art my rock and my fortress.";
asv[3] = "Be thou to me a rock of habitation, whereunto I may continually resort: Thou hast given commandment to save me; For thou art my rock and my fortress. ";
yng[3] = "Be to me for a rock -- a habitation, To go in continually, Thou hast given command to save me, For my rock and my bulwark [art] Thou.";
dby[3] = "Be to me a rock of habitation, whereunto I may continually resort: thou hast given commandment to save me; for thou art my rock and my fortress.";
web[3] = "Be thou my strong habitation, to which I may continually resort: thou hast given commandment to save me; for thou [art] my rock and my fortress.";
hnv[3] = "Be to me a rock of refuge to which I may always go. Give the command to save me, For you are my rock and my fortress.";
vul[3] = "[Vulgate 70:3] esto mihi robustum habitaculum ut ingrediar iugiter praecepisti ut salvares me quia petra mea et fortitudo mea es tu";
kjv[4] = "Deliver me, O my God, out of the hand of the wicked, out of the hand of the unrighteous and cruel man.";
rsv[4] = "Rescue me, O my God, from the hand of the wicked, from the grasp of the unjust and cruel man.";
asv[4] = "Rescue me, O my God, out of the hand of the wicked, Out of the hand of the unrighteous and cruel man. ";
yng[4] = "O my God, cause me to escape From the hand of the wicked, From the hand of the perverse and violent.";
dby[4] = "My God, rescue me out of the hand of the wicked, out of the hand of the unrighteous and cruel man.";
web[4] = "Deliver me, O my God, from the hand of the wicked, from the hand of the unrighteous and cruel man.";
hnv[4] = "Rescue me, my God, from the hand of the wicked, From the hand of the unrighteous and cruel man.";
vul[4] = "[Vulgate 70:4] Deus meus salva me de manu impii de manu iniqui et nocentis";
kjv[5] = "For thou [art] my hope, O Lord GOD: [thou art] my trust from my youth.";
rsv[5] = "For thou, O Lord, art my hope, my trust, O LORD, from my youth.";
asv[5] = "For thou art my hope, O Lord Jehovah: [Thou art] my trust from my youth. ";
yng[5] = "For Thou [art] my hope, O Lord Jehovah, My trust from my youth.";
dby[5] = "For thou art my hope, O Lord Jehovah, my confidence from my youth.";
web[5] = "For thou [art] my hope, O Lord GOD: [thou art] my trust from my youth.";
hnv[5] = "For you are my hope, Lord GOD; My confidence from my youth.";
vul[5] = "[Vulgate 70:5] quia tu es expectatio mea Deus Domine fiducia mea ab adulescentia mea";
kjv[6] = "By thee have I been holden up from the womb: thou art he that took me out of my mother\'s bowels: my praise [shall be] continually of thee.";
rsv[6] = "Upon thee I have leaned from my birth; thou art he who took me from my mother\'s womb. My praise is continually of thee.";
asv[6] = "By thee have I been holden up from the womb; Thou art he that took me out of my mother\'s bowels: My praise shall be continually of thee. ";
yng[6] = "By Thee I have been supported from the womb, From my mother\'s bowels Thou dost cut me out, In Thee [is] my praise continually.";
dby[6] = "On thee have I been stayed from the womb; from the bowels of my mother thou didst draw me forth: my praise shall be continually of thee.";
web[6] = "By thee have I been sustained from my birth: thou art he that brought me into life: my praise [shall be] continually of thee.";
hnv[6] = "I have relied on you from the womb. You are he who took me out of my mother\'s womb. I will always praise you.";
vul[6] = "[Vulgate 70:6] a te sustentatus sum ex utero de ventre matris meae tu es protector meus in te laus mea semper";
kjv[7] = "I am as a wonder unto many; but thou [art] my strong refuge.";
rsv[7] = "I have been as a portent to many; but thou art my strong refuge.";
asv[7] = "I am as a wonder unto many; But thou art my strong refuge. ";
yng[7] = "As a wonder I have been to many, And Thou [art] my strong refuge.";
dby[7] = "I have been as a wonder unto many; but thou art my strong refuge.";
web[7] = "I am as a wonder to many; but thou [art] my strong refuge.";
hnv[7] = "I am a marvel to many, But you are my strong refuge.";
vul[7] = "[Vulgate 70:7] quasi portentum factus sum multis et tu spes mea fortissima";
kjv[8] = "Let my mouth be filled [with] thy praise [and with] thy honour all the day.";
rsv[8] = "My mouth is filled with thy praise, and with thy glory all the day.";
asv[8] = "My mouth shall be filled with thy praise, And with thy honor all the day. ";
yng[8] = "Filled is my mouth [with] Thy praise, All the day [with] Thy beauty.";
dby[8] = "My mouth shall be filled with thy praise, with thy glory, all the day.";
web[8] = "Let my mouth be filled [with] thy praise [and with] thy honor all the day.";
hnv[8] = "My mouth shall be filled with your praise, With your honor all the day.";
vul[8] = "[Vulgate 70:8] impleatur os meum laude tua tota die magnitudine tua";
kjv[9] = "Cast me not off in the time of old age; forsake me not when my strength faileth.";
rsv[9] = "Do not cast me off in the time of old age; forsake me not when my strength is spent.";
asv[9] = "Cast me not off in the time of old age; Forsake me not when my strength faileth. ";
yng[9] = "Cast me not off at the time of old age, According to the consumption of my power forsake me not.";
dby[9] = "Cast me not off in the time of old age; forsake me not when my strength faileth.";
web[9] = "Cast me not off in the time of old age; forsake me not when my strength faileth.";
hnv[9] = "Don\'t reject me in my old age. Don\'t forsake me when my strength fails.";
vul[9] = "[Vulgate 70:9] ne proicias me in tempore senectutis cum defecerit fortitudo mea ne derelinquas me";
kjv[10] = "For mine enemies speak against me; and they that lay wait for my soul take counsel together,";
rsv[10] = "For my enemies speak concerning me, those who watch for my life consult together,";
asv[10] = "For mine enemies speak concerning me; And they that watch for my soul take counsel together, ";
yng[10] = "For mine enemies have spoken against me, And those watching my soul have taken counsel together,";
dby[10] = "For mine enemies speak against me, and they that watch for my soul consult together,";
web[10] = "For my enemies speak against me; and they that lay wait for my soul take counsel together,";
hnv[10] = "For my enemies talk about me. Those who watch for my soul conspire together,";
vul[10] = "[Vulgate 70:10] quia dixerunt inimici mei mihi et qui observabant animam meam inierunt consilium pariter";
kjv[11] = "Saying, God hath forsaken him: persecute and take him; for [there is] none to deliver [him].";
rsv[11] = "and say, &quot;God has forsaken him; pursue and seize him, for there is none to deliver him.&quot;";
asv[11] = "Saying, God hath forsaken him: Pursue and take him; for there is none to deliver. ";
yng[11] = "Saying, `God hath forsaken him, Pursue and catch him, for there is no deliverer.\'";
dby[11] = "Saying, God hath forsaken him; pursue and seize him, for there is none to deliver.";
web[11] = "Saying, God hath forsaken him: persecute and take him; for [there is] none to deliver [him].";
hnv[11] = "Saying, &quot;God has forsaken him. Pursue and take him, for no one will rescue him.&quot;";
vul[11] = "[Vulgate 70:11] dicentes Deus dereliquit eum persequimini et conprehendite eum quia non est qui eruat";
kjv[12] = "O God, be not far from me: O my God, make haste for my help.";
rsv[12] = "O God, be not far from me; O my God, make haste to help me!";
asv[12] = "O God, be not far from me; O my God, make haste to help me. ";
yng[12] = "O God, be not far from me, O my God, for my help make haste.";
dby[12] = "O God, be not far from me; my God, hasten to my help.";
web[12] = "O God, be not far from me: O my God, make haste for my help.";
hnv[12] = "God, don\'t be far from me. My God, hurry to help me.";
vul[12] = "[Vulgate 70:12] Deus ne elongeris a me Deus meus ad auxiliandum mihi festina";
kjv[13] = "Let them be confounded [and] consumed that are adversaries to my soul; let them be covered [with] reproach and dishonour that seek my hurt.";
rsv[13] = "May my accusers be put to shame and consumed; with scorn and disgrace may they be covered who seek my hurt.";
asv[13] = "Let them be put to shame [and] consumed that are adversaries to my soul; Let them be covered with reproach and dishonor that seek my hurt. ";
yng[13] = "They are ashamed, they are consumed, Who are opposing my soul, They are covered [with] reproach and blushing, Who are seeking my evil,";
dby[13] = "Let them be ashamed, let them be consumed, that are adversaries to my soul; let them be covered with reproach and dishonour that seek my hurt.";
web[13] = "Let them be confounded [and] consumed that are adversaries to my soul; let them be covered [with] reproach and dishonor that seek my hurt.";
hnv[13] = "Let my accusers be disappointed and consumed. Let them be covered with disgrace and scorn who want to harm me.";
vul[13] = "[Vulgate 70:13] confundantur et consumantur adversarii animae meae operiantur obprobrio et confusione qui quaerunt malum mihi";
kjv[14] = "But I will hope continually, and will yet praise thee more and more.";
rsv[14] = "But I will hope continually, and will praise thee yet more and more.";
asv[14] = "But I will hope continually, And will praise thee yet more and more. ";
yng[14] = "And I continually do wait with hope, And have added unto all Thy praise.";
dby[14] = "But as for me, I will hope continually, and will praise thee yet more and more.";
web[14] = "But I will hope continually, and will yet praise thee more and more.";
hnv[14] = "But I will always hope, And will add to all of your praise.";
vul[14] = "[Vulgate 70:14] ego autem iugiter expectabo et adiciam super omnes laudationes tuas";
kjv[15] = "My mouth shall shew forth thy righteousness [and] thy salvation all the day; for I know not the numbers [thereof].";
rsv[15] = "My mouth will tell of thy righteous acts, of thy deeds of salvation all the day, for their number is past my knowledge.";
asv[15] = "My mouth shall tell of thy righteousness, [And] of thy salvation all the day; For I know not the numbers [thereof]. ";
yng[15] = "My mouth recounteth Thy righteousness, All the day Thy salvation, For I have not known the numbers.";
dby[15] = "My mouth shall declare thy righteousness, [and] thy salvation all the day: for I know not the numbers [thereof].";
web[15] = "My mouth shall show forth thy righteousness [and] thy salvation all the day; for I know not the numbers [thereof].";
hnv[15] = "My mouth will tell about your righteousness, And of your salvation all day, Though I don\'t know its full measure.";
vul[15] = "[Vulgate 70:15] os meum narrabit iustitiam tuam tota die salutare tuum quia non cognovi litteraturas";
kjv[16] = "I will go in the strength of the Lord GOD: I will make mention of thy righteousness, [even] of thine only.";
rsv[16] = "With the mighty deeds of the Lord GOD I will come, I will praise thy righteousness, thine alone.";
asv[16] = "I will come with the mighty acts of the Lord Jehovah: I will make mention of thy righteousness, even of thine only. ";
yng[16] = "I come in the might of the Lord Jehovah, I mention Thy righteousness -- Thine only.";
dby[16] = "I will go in the might of the Lord Jehovah; I will recall thy righteousness, thine alone.";
web[16] = "I will go in the strength of the Lord GOD: I will make mention of thy righteousness, [even] of thine only.";
hnv[16] = "I will come with the mighty acts of the Lord GOD. I will make mention of your righteousness, even of yours alone.";
vul[16] = "[Vulgate 70:16] ingrediar in fortitudine Domini Dei recordabor iustitiae tuae solius";
kjv[17] = "O God, thou hast taught me from my youth: and hitherto have I declared thy wondrous works.";
rsv[17] = "O God, from my youth thou hast taught me, and I still proclaim thy wondrous deeds.";
asv[17] = "O God, thou hast taught me from my youth; And hitherto have I declared thy wondrous works. ";
yng[17] = "God, Thou hast taught me from my youth, And hitherto I declare Thy wonders.";
dby[17] = "O God, thou hast taught me from my youth, and hitherto have I proclaimed thy marvellous works:";
web[17] = "O God, thou hast taught me from my youth: and hitherto have I declared thy wondrous works.";
hnv[17] = "God, you have taught me from my youth. Until now, I have declared your wondrous works.";
vul[17] = "[Vulgate 70:17] Deus docuisti me ab adulescentia mea et usque nunc adnuntiabo mirabilia tua";
kjv[18] = "Now also when I am old and grayheaded, O God, forsake me not; until I have shewed thy strength unto [this] generation, [and] thy power to every one [that] is to come.";
rsv[18] = "So even to old age and gray hairs, O God, do not forsake me, till I proclaim thy might to all the generations to come. Thy power";
asv[18] = "Yea, even when I am old and grayheaded, O God, forsake me not, Until I have declared thy strength unto [the next] generation, Thy might to every one that is to come. ";
yng[18] = "And also unto old age and grey hairs, O God, forsake me not, Till I declare Thy strength to a generation, To every one that cometh Thy might.";
dby[18] = "Now also, when I am old and greyheaded, O God, forsake me not, until I have proclaimed thine arm unto [this] generation, thy might to every one that is to come.";
web[18] = "Now also when I am old and gray-headed, O God, forsake me not; until I have shown thy strength to [this] generation, [and] thy power to every one [that] is to come.";
hnv[18] = "Yes, even when I am old and gray-haired, God, don\'t forsake me, Until I have declared your strength to the next generation, Your might to everyone who is to come.";
vul[18] = "[Vulgate 70:18] insuper et usque ad senectutem et canos Deus ne derelinquas me donec adnuntiem brachium tuum generationi cunctisque qui venturi sunt fortitudines tuas";
kjv[19] = "Thy righteousness also, O God, [is] very high, who hast done great things: O God, who [is] like unto thee!";
rsv[19] = "and thy righteousness, O God, reach the high heavens. Thou who hast done great things, O God, who is like thee?";
asv[19] = "Thy righteousness also, O God, is very high; Thou who hast done great things, O God, who is like unto thee? ";
yng[19] = "And Thy righteousness, O God, [is] unto the heights, Because Thou hast done great things, O God, who [is] like Thee?";
dby[19] = "And thy righteousness, O God, reacheth on high, thou who hast done great things: O God, who is like unto thee?";
web[19] = "Thy righteousness also, O God, [is] very high, who hast done great things: O God, who [is] like to thee!";
hnv[19] = "Your righteousness also, God, reaches to the heavens; You have done great things. God, who is like you?";
vul[19] = "[Vulgate 70:19] et iustitiam tuam Deus usque in excelsum quanta fecisti magnalia Deus quis similis tibi";
kjv[20] = "[Thou], which hast shewed me great and sore troubles, shalt quicken me again, and shalt bring me up again from the depths of the earth.";
rsv[20] = "Thou who hast made me see many sore troubles wilt revive me again; from the depths of the earth thou wilt bring me up again.";
asv[20] = "Thou, who hast showed us many and sore troubles, Wilt quicken us again, And wilt bring us up again from the depths of the earth. ";
yng[20] = "Because Thou hast showed me many and sad distresses, Thou turnest back -- Thou revivest me, And from the depths of the earth, Thou turnest back -- Thou bringest me up.";
dby[20] = "Thou, who hast shewn us many and sore troubles, wilt revive us again, and wilt bring us up again from the depths of the earth;";
web[20] = "[Thou], who hast shown me great and severe troubles, wilt revive me again, and wilt bring me again from the depths of the earth.";
hnv[20] = "You, who have shown us many and bitter troubles, You will let me live. You will bring us up again from the depths of the eretz.";
vul[20] = "[Vulgate 70:20] qui ostendisti mihi tribulationes plurimas et adflictiones conversus vivificabis nos et de abyssis terrae rursum educes nos";
kjv[21] = "Thou shalt increase my greatness, and comfort me on every side.";
rsv[21] = "Thou wilt increase my honor, and comfort me again.";
asv[21] = "Increase thou my greatness, And turn again and comfort me. ";
yng[21] = "Thou dost increase my greatness, And Thou surroundest -- Thou comfortest me,";
dby[21] = "Thou wilt increase my greatness, and comfort me on every side.";
web[21] = "Thou wilt increase my greatness, and comfort me on every side.";
hnv[21] = "Increase my honor, And comfort me again.";
vul[21] = "[Vulgate 70:21] multiplicabis magnitudinem meam et conversus consolaberis me";
kjv[22] = "I will also praise thee with the psaltery, [even] thy truth, O my God: unto thee will I sing with the harp, O thou Holy One of Israel.";
rsv[22] = "I will also praise thee with the harp for thy faithfulness, O my God; I will sing praises to thee with the lyre, O Holy One of Israel.";
asv[22] = "I will also praise thee with the psaltery, [Even] thy truth, O my God: Unto thee will I sing praises with the harp, O thou Holy One of Israel. ";
yng[22] = "I also thank Thee with a vessel of psaltery, Thy truth, O my God, I sing to Thee with a harp, O Holy One of Israel,";
dby[22] = "I will also praise thee with the psaltery, even thy truth, my God; unto thee will I sing psalms with the harp, thou holy One of Israel.";
web[22] = "I will also praise thee with the psaltery, [even] thy truth, O my God: to thee will I sing with the harp, O thou Holy One of Israel.";
hnv[22] = "I will also praise you with the harp for your faithfulness, my God. I sing praises to you with the lyre, Holy One of Yisra\'el.";
vul[22] = "[Vulgate 70:22] ego autem confitebor tibi in vasis psalterii veritatem tuam Deus meus cantabo tibi in cithara Sancte Israhel";
kjv[23] = "My lips shall greatly rejoice when I sing unto thee; and my soul, which thou hast redeemed.";
rsv[23] = "My lips will shout for joy, when I sing praises to thee; my soul also, which thou hast rescued.";
asv[23] = "My lips shall shout for joy when I sing praises unto thee; And my soul, which thou hast redeemed. ";
yng[23] = "My lips cry aloud when I sing praise to Thee, And my soul that Thou hast redeemed,";
dby[23] = "My lips shall exult when I sing psalms unto thee; and my soul, which thou hast redeemed.";
web[23] = "My lips shall greatly rejoice when I sing to thee; and my soul, which thou hast redeemed.";
hnv[23] = "My lips shall shout for joy! My soul, which you have redeemed, sings praises to you!";
vul[23] = "[Vulgate 70:23] laudabunt labia mea cum cantavero tibi et anima mea quam redemisti";
kjv[24] = "My tongue also shall talk of thy righteousness all the day long: for they are confounded, for they are brought unto shame, that seek my hurt.";
rsv[24] = "And my tongue will talk of thy righteous help all the day long, for they have been put to shame and disgraced who sought to do me hurt.";
asv[24] = "My tongue also shall talk of thy righteousness all the day long; For they are put to shame, for they are confounded, that seek my hurt. ";
yng[24] = "My tongue also all the day uttereth Thy righteousness, Because ashamed -- because confounded, Have been those seeking my evil!";
dby[24] = "My tongue also shall talk of thy righteousness all the day; for they shall be ashamed, for they shall be brought to confusion, that seek my hurt.";
web[24] = "My tongue also shall talk of thy righteousness all the day long: for they are confounded, for they are brought to shame, that seek my hurt.";
hnv[24] = "My tongue will also talk about your righteousness all day long, For they are disappointed, and they are confounded, who want to harm me. ";
vul[24] = "[Vulgate 70:24] insuper et lingua mea tota die meditabitur iustitiam tuam quia confusi sunt et dehonestati quaerentes malum mihi";
csb[1] = "LORD, I seek refuge in you; let me never be disgraced.";
csb[2] = "In your justice, rescue and deliver me; listen closely to me and save me.";
csb[3] = "Be a rock of refuge for me, where I can always go. Give the command to save me, for you are my rock and fortress.";
csb[4] = "Deliver me, my God, from the power of the wicked, from the grasp of the unjust and oppressive.";
csb[5] = "For you are my hope, Lord GOD, my confidence from my youth.";
csb[6] = "I have leaned on you from birth; you took me from my mother\'s womb. My praise is always about you.";
csb[7] = "I am like a miraculous sign to many, and you are my strong refuge.";
csb[8] = "My mouth is full of praise and honor to you all day long.";
csb[9] = "Don\'t discard me in my old age. As my strength fails, do not abandon me.";
csb[10] = "For my enemies talk about me, and those who spy on me plot together,";
csb[11] = "saying, &quot;God has abandoned him; chase him and catch him, for there is no one to rescue him.&quot;";
csb[12] = "God, do not be far from me; my God, hurry to help me.";
csb[13] = "May my adversaries be disgraced and destroyed; may those who intend to harm me be covered with disgrace and humiliation.";
csb[14] = "But I will hope continually and will praise you more and more.";
csb[15] = "My mouth will tell about your righteousness and your salvation all day long, though I cannot sum them up.";
csb[16] = "I come because of the mighty acts of the Lord GOD; I will proclaim your righteousness, yours alone.";
csb[17] = "God, you have taught me from my youth, and I still proclaim your wondrous works.";
csb[18] = "Even while I am old and gray, God, do not abandon me, while I proclaim your power to another generation, your strength to all who are to come.";
csb[19] = "Your righteousness reaches the heights, God, you who have done great things; God, who is like you?";
csb[20] = "You caused me to experience many troubles and misfortunes, but you will revive me again. You will bring me up again, even from the depths of the earth.";
csb[21] = "You will increase my honor and comfort me once again.";
csb[22] = "Therefore, I will praise you with a harp for your faithfulness, my God; I will sing to you with a lyre, Holy One of Israel.";
csb[23] = "My lips will shout for joy when I sing praise to you because you have redeemed me.";
csb[24] = "Therefore, my tongue will proclaim your righteousness all day long, for those who intend to harm me will be disgraced and confounded.";
</script>
