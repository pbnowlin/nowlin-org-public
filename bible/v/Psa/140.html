csb[1] = "Rescue me, LORD, from evil men. Keep me safe from violent men";
csb[2] = "who plan evil in their hearts. They stir up wars all day long.";

csb[8] = "LORD, do not grant the desires of the wicked; do not let them achieve their goals. Otherwise, they will become proud. Selah";
csb[9] = "When those who surround me rise up, may the trouble their lips cause overwhelm them.";
csb[10] = "Let hot coals fall on them. Let them be thrown into the fire, into the abyss, never again to rise.";
csb[11] = "Do not let a slanderer stay in the land. Let evil relentlessly hunt down a violent man.";
csb[12] = "I know that the LORD upholds the just cause of the poor, justice for the needy.";
