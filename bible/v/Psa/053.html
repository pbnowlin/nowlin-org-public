kjv[1] = "[[To the chief Musician upon Mahalath, Maschil, [A Psalm] of David.]] The fool hath said in his heart, [There is] no God. Corrupt are they, and have done abominable iniquity: [there is] none that doeth good.";
rsv[1] = "To the choirmaster: according to Mahalath. A Maskil of David. The fool says in his heart, &quot;There is no God.&quot; They are corrupt, doing abominable iniquity; there is none that does good.";
asv[1] = "[For the Chief Musician; set to Mahalath. Maschil of David.] The fool hath said in his heart, There is no God. Corrupt are they, and have done abominable iniquity; There is none that doeth good. ";
yng[1] = "To the Overseer. -- `On a disease.\' -- An instruction, by David. A fool said in his heart, `There is no God.\' They have done corruptly, Yea, they have done abominable iniquity, There is none doing good.";
dby[1] = "{To the chief Musician. On Mahalath: an instruction. Of David.} The fool hath said in his heart, There is no God! They have corrupted themselves, and have done abominable iniquity: there is none that doeth good.";
web[1] = "To the chief Musician upon Mahalath, Maschil, [A Psalm] of David. The fool hath said in his heart, [There is] no God. They are corrupt, and have done abominable iniquity: [there is] none that doeth good.";
hnv[1] = "For the Chief Musician. To the tune &quot;on machalat.&quot; A maskil by David. The fool has said in his heart, &quot;There is no God.&quot; They are corrupt, and have done abominable iniquity. There is no one who does good.";
vul[1] = "[Vulgate 52:1] victori per chorum eruditi David dixit stultus in corde suo non est Deus [Vulgate 52:2] corrupti sunt et abominabiles facti sunt in iniquitate non est qui faciat bonum";
kjv[2] = "God looked down from heaven upon the children of men, to see if there were [any] that did understand, that did seek God.";
rsv[2] = "God looks down from heaven upon the sons of men to see if there are any that are wise, that seek after God.";
asv[2] = "God looked down from heaven upon the children of men, To see if there were any that did understand, That did seek after God. ";
yng[2] = "God from the heavens looked on the sons of men, To see if there be an understanding one, [One] seeking God.";
dby[2] = "God looked down from the heavens upon the children of men, to see if there were any that did understand, that did seek God.";
web[2] = "God looked down from heaven upon the children of men, to see if there were [any] that did understand, that did seek God.";
hnv[2] = "God looks down from heaven on the children of men, To see if there are any who understood, Who seek after God.";
vul[2] = "[Vulgate 52:3] Deus de caelo prospexit super filios hominum ut videret si esset intellegens requirens Deum";
kjv[3] = "Every one of them is gone back: they are altogether become filthy; [there is] none that doeth good, no, not one.";
rsv[3] = "They have all fallen away; they are all alike depraved; there is none that does good, no, not one.";
asv[3] = "Every one of them is gone back; they are together become filthy; There is none that doeth good, no, not one. ";
yng[3] = "Every one went back, together they became filthy, There is none doing good -- not even one.";
dby[3] = "Every one of them is gone back, they are together become corrupt: there is none that doeth good, not even one.";
web[3] = "Every one of them is gone back: they are altogether become filthy; [there is] none that doeth good, no, not one.";
hnv[3] = "Every one of them has gone back. They have become filthy together. There is no one who does good, no, not one.";
vul[3] = "[Vulgate 52:4] omnes aversi sunt pariter adheserunt non est qui faciat bonum non est usque ad unum";
kjv[4] = "Have the workers of iniquity no knowledge? who eat up my people [as] they eat bread: they have not called upon God.";
rsv[4] = "Have those who work evil no understanding, who eat up my people as they eat bread, and do not call upon God?";
asv[4] = "Have the workers of iniquity no knowledge, Who eat up my people [as] they eat bread, And call not upon God? ";
yng[4] = "Have not workers of iniquity known, Those eating my people have eaten bread, God they have not called.";
dby[4] = "Have the workers of iniquity no knowledge, eating up my people [as] they eat bread? they call not upon God.";
web[4] = "Have the workers of iniquity no knowledge? who eat up my people [as] they eat bread! they have not called upon God.";
hnv[4] = "Have the workers of iniquity no knowledge, Who eat up my people as they eat bread, And don\'t call on God?";
vul[4] = "[Vulgate 52:5] numquid non cognoverunt qui operantur iniquitatem qui comedunt populum meum ut cibum panis";
kjv[5] = "There were they in great fear, [where] no fear was: for God hath scattered the bones of him that encampeth [against] thee: thou hast put [them] to shame, because God hath despised them.";
rsv[5] = "There they are, in great terror, in terror such as has not been! For God will scatter the bones of the ungodly; they will be put to shame, for God has rejected them.";
asv[5] = "There were they in great fear, where no fear was; For God hath scattered the bones of him that encampeth against thee: Thou hast put them to shame, because God hath rejected them. ";
yng[5] = "There they feared a fear -- there was no fear, For God hath scattered the bones of him Who is encamping against thee, Thou hast put to shame, For God hath despised them.";
dby[5] = "There were they in great fear, where no fear was; for God scattereth the bones of him that encampeth against thee. Thou hast put [them] to shame, for God hath despised them.";
web[5] = "There they were in great fear, [where] no fear was: for God hath scattered the bones of him that encampeth [against] thee: thou hast put [them] to shame, because God hath despised them.";
hnv[5] = "There they were in great fear, where no fear was, For God has scattered the bones of him who encamps against you. You have put them to shame, Because God has rejected them.";
vul[5] = "[Vulgate 52:6] Deum non invocaverunt ibi timuerunt timore ubi non est timor quoniam Deus dispersit ossa circumdantium te confunderis quia Deus proiecit eos";
kjv[6] = "Oh that the salvation of Israel [were come] out of Zion! When God bringeth back the captivity of his people, Jacob shall rejoice, [and] Israel shall be glad.";
rsv[6] = "O that deliverance for Israel would come from Zion! When God restores the fortunes of his people, Jacob will rejoice and Israel be glad.";
asv[6] = "Oh that the salvation of Israel were come out of Zion! When God bringeth back the captivity of his people, Then shall Jacob rejoice, [and] Israel shall be glad. ";
yng[6] = "Who doth give from Zion the salvation of Israel? When God turneth back [to] a captivity of His people, Jacob doth rejoice -- Israel is glad!";
dby[6] = "Oh that the salvation of Israel were come out of Zion! When God turneth again the captivity of his people, Jacob shall be glad, Israel shall rejoice.";
web[6] = "O that the salvation of Israel [were come] out of Zion! when God bringeth back the captivity of his people, Jacob shall rejoice, [and] Israel shall be glad.";
hnv[6] = "Oh that the yeshu`ah of Yisra\'el would come out of Tziyon! When God brings back the captivity of his people, Then Ya`akov shall rejoice. Yisra\'el shall be glad. ";
vul[6] = "[Vulgate 52:7] quis dabit ex Sion salutare Israhel cum reduxerit Deus captivitatem populi sui exultabit Iacob laetabitur Israhel";
csb[1] = "The fool says in his heart, &quot;There\'s no God.&quot; They are corrupt, and they do vile deeds. There is no one who does good.";
csb[2] = "God looks down from heaven on the human race to see if there is one who is wise, one who seeks God.";
csb[3] = "All have turned away; all alike have become corrupt. There is no one who does good, not even one.";
csb[4] = "Will evildoers never understand? They consume my people as they consume bread; they do not call on God.";
csb[5] = "Then they will be filled with dread -- dread like no other -- because God will scatter the bones of those who besiege you. You will put them to shame, for God has rejected them.";
csb[6] = "Oh, that Israel\'s deliverance would come from Zion! When God restores the fortunes of his people, let Jacob rejoice, let Israel be glad.";
</script>
