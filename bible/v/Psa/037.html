kjv[34] = "Wait on the LORD, and keep his way, and he shall exalt thee to inherit the land: when the wicked are cut off, thou shalt see [it].";
rsv[34] = "Wait for the LORD, and keep to his way, and he will exalt you to possess the land; you will look on the destruction of the wicked.";
asv[34] = "Wait for Jehovah, and keep his way, And he will exalt thee to inherit the land: When the wicked are cut off, thou shalt see it. ";
yng[34] = "Look unto Jehovah, and keep His way, And He doth exalt thee to possess the land, In the wicked being cut off -- thou seest!";
dby[34] = "Wait for Jehovah, and keep his way, and he will exalt thee to possess the land: when the wicked are cut off, thou shalt see [it].";
web[34] = "Wait on the LORD, and keep his way, and he will exalt thee to inherit the land: when the wicked are cut off, thou shalt see [it].";
hnv[34] = "Wait for the LORD, and keep his way, And he will exalt you to inherit the land. When the wicked are cut off, you shall see it.";

rsv[35] = "I have seen a wicked man overbearing, and towering like a cedar of Lebanon.";
asv[35] = "I have seen the wicked in great power, And spreading himself like a green tree in its native soil. ";
yng[35] = "I have seen the wicked terrible, And spreading as a green native plant,";
dby[35] = "I have seen the wicked in great power, and spreading like a green tree in its native soil:";
web[35] = "I have seen the wicked in great power, and spreading himself like a green bay tree.";

rsv[36] = "Again I passed by, and, lo, he was no more; though I sought him, he could not be found.";
asv[36] = "But one passed by, and, lo, he was not: Yea, I sought him, but he could not be found. ";
yng[36] = "And he passeth away, and lo, he is not, And I seek him, and he is not found!";
dby[36] = "but he passed away, and behold, he was not; and I sought him, but he was not found.";
web[36] = "Yet he passed away, and lo, he [was] not: yes, I sought him, but he could not be found.";
hnv[36] = "But he passed away, and, behold, he was not. Yes, I sought him, but he could not be found.";
vul[36] = "[Vulgate 36:36] et transivi et ecce non erat et quaesivi eum et non est inventus";
kjv[37] = "Mark the perfect [man], and behold the upright: for the end of [that] man [is] peace.";
rsv[37] = "Mark the blameless man, and behold the upright, for there is posterity for the man of peace.";
asv[37] = "Mark the perfect man, and behold the upright; For there is a [happy] end to the man of peace. ";
yng[37] = "Observe the perfect, and see the upright, For the latter end of each [is] peace.";
dby[37] = "Mark the perfect, and behold the upright, for the end of [that] man is peace;";
web[37] = "Mark the perfect [man], and behold the upright: for the end of [that] man [is] peace.";
hnv[37] = "Mark the perfect man, and see the upright, For there is a future for the man of shalom.";
vul[37] = "[Vulgate 36:37] sen custodi simplicitatem et vide rectum quia erit ad extremum viro pax";
kjv[38] = "But the transgressors shall be destroyed together: the end of the wicked shall be cut off.";
rsv[38] = "But transgressors shall be altogether destroyed; the posterity of the wicked shall be cut off.";
asv[38] = "As for transgressors, they shall be destroyed together: The end of the wicked shall be cut off. ";
yng[38] = "And transgressors were destroyed together, The latter end of the wicked was cut off.";
dby[38] = "but the transgressors shall be destroyed together; the future of the wicked shall be cut off.";
web[38] = "But the transgressors shall be destroyed together: the end of the wicked shall be cut off.";
hnv[38] = "As for transgressors, they shall be destroyed together. The future of the wicked shall be cut off.";
vul[38] = "[Vulgate 36:38] iniqui autem delebuntur pariter et novissimum impiorum peribit";

rsv[39] = "The salvation of the righteous is from the LORD; he is their refuge in the time of trouble.";
asv[39] = "But the salvation of the righteous is of Jehovah: He is their stronghold in the time of trouble. ";
yng[39] = "And the salvation of the righteous [is] from Jehovah, Their strong place in a time of adversity.";
dby[39] = "But the salvation of the righteous is of Jehovah: he is their strength in the time of trouble.";
web[39] = "But the salvation of the righteous [is] of the LORD: [he is] their strength in the time of trouble.";
hnv[39] = "But the salvation of the righteous is from the LORD. He is their stronghold in the time of trouble.";
vul[39] = "[Vulgate 36:39] thau salus iustorum a Domino fortitudo eorum in tempore tribulationis";
kjv[40] = "And the LORD shall help them, and deliver them: he shall deliver them from the wicked, and save them, because they trust in him.";
rsv[40] = "The LORD helps them and delivers them; he delivers them from the wicked, and saves them, because they take refuge in him.";
asv[40] = "And Jehovah helpeth them, and rescueth them: He rescueth them from the wicked, and saveth them, Because they have taken refuge in him. ";
yng[40] = "And Jehovah doth help them and deliver them, He delivereth them from the wicked, And saveth them, Because they trusted in Him!";
dby[40] = "And Jehovah will help them and deliver them: he will deliver them from the wicked, and save them; for they trust in him.";
web[40] = "And the LORD will help them, and deliver them: he will deliver them from the wicked, and save them, because they trust in him.";
hnv[40] = "The LORD helps them, and rescues them. He rescues them from the wicked, and saves them, Because they have taken refuge in him. ";

csb[1] = "Do not be agitated by evildoers; do not envy those who do wrong.";
csb[2] = "For they wither quickly like grass and wilt like tender green plants.";
csb[3] = "Trust in the LORD and do what is good; dwell in the land and live securely.";
csb[4] = "Take delight in the LORD, and he will give you your heart\'s desires.";
csb[5] = "Commit your way to the LORD; trust in him, and he will act,";
csb[6] = "making your righteousness shine like the dawn, your justice like the noonday.";
csb[7] = "Be silent before the LORD and wait expectantly for him; do not be agitated by one who prospers in his way, by the person who carries out evil plans.";
csb[8] = "Refrain from anger and give up your rage; do not be agitated -- it can only bring harm.";
csb[9] = "For evildoers will be destroyed, but those who put their hope in the LORD will inherit the land.";
csb[10] = "A little while, and the wicked person will be no more; though you look for him, he will not be there.";
csb[11] = "But the humble will inherit the land and will enjoy abundant prosperity.";
csb[12] = "The wicked person schemes against the righteous and gnashes his teeth at him.";
csb[13] = "The Lord laughs at him because he sees that his day is coming.";
csb[14] = "The wicked have drawn the sword and strung the bow to bring down the poor and needy and to slaughter those whose way is upright.";
csb[15] = "Their swords will enter their own hearts, and their bows will be broken.";
csb[16] = "The little that the righteous person has is better than the abundance of many wicked people.";
csb[17] = "For the arms of the wicked will be broken, but the LORD supports the righteous.";
csb[18] = "The LORD watches over the blameless all their days, and their inheritance will last forever.";
csb[19] = "They will not be disgraced in times of adversity; they will be satisfied in days of hunger.";
csb[20] = "But the wicked will perish; the LORD\'s enemies, like the glory of the pastures, will fade away -- they will fade away like smoke.";
csb[21] = "The wicked person borrows and does not repay, but the righteous one is gracious and giving.";
csb[22] = "Those who are blessed by the LORD will inherit the land, but those cursed by him will be destroyed.";
csb[23] = "A person\'s steps are established by the LORD, and he takes pleasure in his way.";
csb[24] = "Though he falls, he will not be overwhelmed, because the LORD supports him with his hand.";
csb[25] = "I have been young and now I am old, yet I have not seen the righteous abandoned or his children begging for bread.";
csb[26] = "He is always generous, always lending, and his children are a blessing.";
csb[27] = "Turn away from evil, do what is good, and settle permanently.";
csb[28] = "For the LORD loves justice and will not abandon his faithful ones. They are kept safe forever, but the children of the wicked will be destroyed.";
csb[29] = "The righteous will inherit the land and dwell in it permanently.";
csb[30] = "The mouth of the righteous utters wisdom; his tongue speaks what is just.";
csb[31] = "The instruction of his God is in his heart; his steps do not falter.";
csb[32] = "The wicked one lies in wait for the righteous and intends to kill him;";
csb[33] = "the LORD will not leave him in the power of the wicked one or allow him to be condemned when he is judged.";
csb[34] = "Wait for the LORD and keep his way, and he will exalt you to inherit the land. You will watch when the wicked are destroyed.";
csb[35] = "I have seen a wicked, violent person well-rooted, like a flourishing native tree.";
csb[36] = "Then I passed by and noticed he was gone; I searched for him, but he could not be found.";
csb[37] = "Watch the blameless and observe the upright, for the person of peace will have a future.";
csb[38] = "But transgressors will all be eliminated; the future of the wicked will be destroyed.";
csb[39] = "The salvation of the righteous is from the LORD, their refuge in a time of distress.";
csb[40] = "The LORD helps and delivers them; he will deliver them from the wicked and will save them because they take refuge in him.";
