hnv[31] = "For he will stand at the right hand of the needy, To save him from those who judge his soul. ";
vul[31] = "[Vulgate 108:31] quoniam stabit a dextris pauperis ut salvet a iudicibus animam eius";
csb[1] = "God of my praise, do not be silent.";
csb[2] = "For wicked and deceitful mouths open against me; they speak against me with lying tongues.";
csb[3] = "They surround me with hateful words and attack me without cause.";
csb[4] = "In return for my love they accuse me, but I continue to pray.";
csb[5] = "They repay me evil for good, and hatred for my love.";
csb[6] = "Set a wicked person over him; let an accuser stand at his right hand.";
csb[7] = "When he is judged, let him be found guilty, and let his prayer be counted as sin.";
csb[8] = "Let his days be few; let another take over his position.";
csb[9] = "Let his children be fatherless and his wife a widow.";
csb[10] = "Let his children wander as beggars, searching for food far from their demolished homes.";
csb[11] = "Let a creditor seize all he has; let strangers plunder what he has worked for.";
csb[12] = "Let no one show him kindness, and let no one be gracious to his fatherless children.";
csb[13] = "Let the line of his descendants be cut off; let their name be blotted out in the next generation.";
csb[14] = "Let the iniquity of his fathers be remembered before the LORD, and do not let his mother\'s sin be blotted out.";
csb[15] = "Let their sins always remain before the LORD, and let him remove all memory of them from the earth.";
csb[16] = "For he did not think to show kindness, but pursued the suffering, needy, and brokenhearted in order to put them to death.";
csb[17] = "He loved cursing -- let it fall on him; he took no delight in blessing -- let it be far from him.";
csb[18] = "He wore cursing like his coat -- let it enter his body like water and go into his bones like oil.";
csb[19] = "Let it be like a robe he wraps around himself, like a belt he always wears.";
csb[20] = "Let this be the LORD\'s payment to my accusers, to those who speak evil against me.";
csb[21] = "But you, LORD, my Lord, deal kindly with me for your name\'s sake; because your faithful love is good, rescue me.";
csb[22] = "For I am suffering and needy; my heart is wounded within me.";
csb[23] = "I fade away like a lengthening shadow; I am shaken off like a locust.";
csb[24] = "My knees are weak from fasting, and my body is emaciated.";
csb[25] = "I have become an object of ridicule to my accusers; when they see me, they shake their heads in scorn.";
csb[26] = "Help me, LORD my God; save me according to your faithful love";
csb[27] = "so they may know that this is your hand and that you, LORD, have done it.";
csb[28] = "Though they curse, you will bless. When they rise up, they will be put to shame, but your servant will rejoice.";
csb[29] = "My accusers will be clothed with disgrace; they will wear their shame like a cloak.";
csb[30] = "I will fervently thank the LORD with my mouth; I will praise him in the presence of many.";
csb[31] = "For he stands at the right hand of the needy to save him from those who would condemn him.";
</script>
