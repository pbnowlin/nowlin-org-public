csb[1] = "I love you, LORD, my strength.";
csb[2] = "The LORD is my rock, my fortress, and my deliverer, my God, my rock where I seek refuge, my shield and the horn of my salvation, my stronghold.";
csb[3] = "I called to the LORD, who is worthy of praise, and I was saved from my enemies.";
csb[4] = "The ropes of death were wrapped around me; the torrents of destruction terrified me.";
csb[5] = "The ropes of Sheol entangled me; the snares of death confronted me.";
csb[6] = "I called to the LORD in my distress, and I cried to my God for help. From his temple he heard my voice, and my cry to him reached his ears.";
csb[7] = "Then the earth shook and quaked; the foundations of the mountains trembled; they shook because he burned with anger.";
csb[8] = "Smoke rose from his nostrils, and consuming fire came from his mouth; coals were set ablaze by it.";
csb[9] = "He bent the heavens and came down, total darkness beneath his feet.";
csb[10] = "He rode on a cherub and flew, soaring on the wings of the wind.";
csb[11] = "He made darkness his hiding place, dark storm clouds his canopy around him.";
csb[12] = "From the radiance of his presence, his clouds swept onward with hail and blazing coals.";
csb[13] = "The LORD thundered from heaven; the Most High made his voice heard.";
csb[14] = "He shot his arrows and scattered them; he hurled lightning bolts and routed them.";
csb[15] = "The depths of the sea became visible, the foundations of the world were exposed, at your rebuke, LORD, at the blast of the breath of your nostrils.";
csb[16] = "He reached down from on high and took hold of me; he pulled me out of deep water.";
csb[17] = "He rescued me from my powerful enemy and from those who hated me, for they were too strong for me.";
csb[18] = "They confronted me in the day of my calamity, but the LORD was my support.";
csb[19] = "He brought me out to a spacious place; he rescued me because he delighted in me.";
csb[20] = "The LORD rewarded me according to my righteousness; he repaid me according to the cleanness of my hands.";
csb[21] = "For I have kept the ways of the LORD and have not turned from my God to wickedness.";
csb[22] = "Indeed, I let all his ordinances guide me and have not disregarded his statutes.";
csb[23] = "I was blameless toward him and kept myself from my iniquity.";
csb[24] = "So the LORD repaid me according to my righteousness, according to the cleanness of my hands in his sight.";
csb[25] = "With the faithful you prove yourself faithful, with the blameless you prove yourself blameless,";
csb[26] = "with the pure you prove yourself pure; but with the crooked you prove yourself shrewd.";
csb[27] = "For you rescue an oppressed people, but you humble those with haughty eyes.";
csb[28] = "LORD, you light my lamp; my God illuminates my darkness.";
csb[29] = "With you I can attack a barricade, and with my God I can leap over a wall.";
csb[30] = "God -- his way is perfect; the word of the LORD is pure. He is a shield to all who take refuge in him.";
csb[31] = "For who is God besides the LORD? And who is a rock? Only our God.";
csb[32] = "God -- he clothes me with strength and makes my way perfect.";
csb[33] = "He makes my feet like the feet of a deer and sets me securely on the heights.";
csb[34] = "He trains my hands for war; my arms can bend a bow of bronze.";
csb[35] = "You have given me the shield of your salvation; your right hand upholds me, and your humility exalts me.";
csb[36] = "You make a spacious place beneath me for my steps, and my ankles do not give way.";
csb[37] = "I pursue my enemies and overtake them; I do not turn back until they are wiped out.";
csb[38] = "I crush them, and they cannot get up; they fall beneath my feet.";
csb[39] = "You have clothed me with strength for battle; you subdue my adversaries beneath me.";
csb[40] = "You have made my enemies retreat before me; I annihilate those who hate me.";
csb[41] = "They cry for help, but there is no one to save them -- they cry to the LORD, but he does not answer them.";
csb[42] = "I pulverize them like dust before the wind; I trample them like mud in the streets.";
csb[43] = "You have freed me from the feuds among the people; you have appointed me the head of nations; a people I had not known serve me.";
csb[44] = "Foreigners submit to me cringing; as soon as they hear they obey me.";
csb[45] = "Foreigners lose heart and come trembling from their fortifications.";
csb[46] = "The LORD lives -- blessed be my rock! The God of my salvation is exalted.";
csb[47] = "God -- he grants me vengeance and subdues peoples under me.";
csb[48] = "He frees me from my enemies. You exalt me above my adversaries; you rescue me from violent men.";
csb[49] = "Therefore I will give thanks to you among the nations, LORD; I will sing praises about your name.";
csb[50] = "He gives great victories to his king; he shows loyalty to his anointed, to David and his descendants forever.";
</script>
