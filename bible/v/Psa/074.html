kjv[1] = "[[Maschil of Asaph.]] O God, why hast thou cast [us] off for ever? [why] doth thine anger smoke against the sheep of thy pasture?";
rsv[1] = "A Maskil of Asaph. O God, why dost thou cast us off for ever? Why does thy anger smoke against the sheep of thy pasture?";
asv[1] = "[Maschil of Asaph.] O God, why hast thou cast [us] off for ever? Why doth thine anger smoke against the sheep of thy pasture? ";
yng[1] = "An Instruction of Asaph. Why, O God, hast Thou cast off for ever? Thine anger smoketh against the flock of Thy pasture.";
dby[1] = "{An instruction: of Asaph.} Why, O God, hast thou cast off for ever? [why] doth thine anger smoke against the sheep of thy pasture?";
web[1] = "Maschil of Asaph. O God, why hast thou cast [us] off for ever? [why] doth thy anger smoke against the sheep of thy pasture?";
hnv[1] = "A maskil by Asaf. God, why have you rejected us forever? Why does your anger smolder against the sheep of your pasture?";
vul[1] = "[Vulgate 73:1] eruditionis Asaph ut quid Deus reppulisti in finem fumavit furor tuus in gregem pascuae tuae";
kjv[2] = "Remember thy congregation, [which] thou hast purchased of old; the rod of thine inheritance, [which] thou hast redeemed; this mount Zion, wherein thou hast dwelt.";
rsv[2] = "Remember thy congregation, which thou hast gotten of old, which thou hast redeemed to be the tribe of thy heritage! Remember Mount Zion, where thou hast dwelt.";
asv[2] = "Remember thy congregation, which thou hast gotten of old, Which thou hast redeemed to be the tribe of thine inheritance; [And] mount Zion, wherein thou hast dwelt. ";
yng[2] = "Remember Thy company. Thou didst purchase of old, Thou didst redeem the rod of Thy inheritance, This mount Zion -- Thou didst dwell in it.";
dby[2] = "Remember thine assembly, which thou hast purchased of old, which thou hast redeemed [to be] the portion of thine inheritance, this mount Zion, wherein thou hast dwelt.";
web[2] = "Remember thy congregation, [which] thou hast purchased of old: the rod of thy inheritance, [which] thou hast redeemed; this mount Zion, in which thou hast dwelt.";
hnv[2] = "Remember your congregation, which you purchased of old, Which you have redeemed to be the tribe of your inheritance; Mount Tziyon, in which you have lived.";
vul[2] = "[Vulgate 73:2] recordare congregationis tuae quam possedisti ab initio et redemisti virgam hereditatis tuae montis Sion in quo habitasti";
kjv[3] = "Lift up thy feet unto the perpetual desolations; [even] all [that] the enemy hath done wickedly in the sanctuary.";
rsv[3] = "Direct thy steps to the perpetual ruins; the enemy has destroyed everything in the sanctuary!";
asv[3] = "Lift up thy feet unto the perpetual ruins, All the evil that the enemy hath done in the sanctuary. ";
yng[3] = "Lift up Thy steps to the perpetual desolations, Everything the enemy did wickedly in the sanctuary.";
dby[3] = "Lift up thy steps unto the perpetual desolations: everything in the sanctuary hath the enemy destroyed.";
web[3] = "Lift up thy feet to the perpetual desolations; [even] all [that] the enemy hath done wickedly in the sanctuary.";
hnv[3] = "Lift up your feet to the perpetual ruins, All the evil that the enemy has done in the sanctuary.";
vul[3] = "[Vulgate 73:3] sublimitas pedum tuorum dissipata est usque ad finem omnia mala egit inimicus in sanctuario";
kjv[4] = "Thine enemies roar in the midst of thy congregations; they set up their ensigns [for] signs.";
rsv[4] = "Thy foes have roared in the midst of thy holy place; they set up their own signs for signs.";
asv[4] = "Thine adversaries have roared in the midst of thine assembly; They have set up their ensigns for signs. ";
yng[4] = "Roared have thine adversaries, In the midst of Thy meeting-places, They have set their ensigns as ensigns.";
dby[4] = "Thine adversaries roar in the midst of thy place of assembly; they set up their signs [for] signs.";
web[4] = "Thy enemies roar in the midst of thy congregations; they set up their ensigns [for] signs.";
hnv[4] = "Your adversaries have roared in the midst of your assembly. They have set up their standards as signs.";
vul[4] = "[Vulgate 73:4] fremuerunt hostes tui in medio pacti tui posuerunt signa sua in tropeum";
kjv[5] = "[A man] was famous according as he had lifted up axes upon the thick trees.";
rsv[5] = "At the upper entrance they hacked the wooden trellis with axes.";
asv[5] = "They seemed as men that lifted up Axes upon a thicket of trees. ";
yng[5] = "He is known as one bringing in on high Against a thicket of wood -- axes.";
dby[5] = "[A man] was known as he could lift up axes in the thicket of trees;";
web[5] = "[A man] was famous according as he had lifted up axes upon the thick trees.";
hnv[5] = "They behaved like men wielding axes, Cutting through a thicket of trees.";
vul[5] = "[Vulgate 73:5] manifesta in introitu desuper in saltu lignorum secures";
kjv[6] = "But now they break down the carved work thereof at once with axes and hammers.";
rsv[6] = "And then all its carved wood they broke down with hatchets and hammers.";
asv[6] = "And now all the carved work thereof They break down with hatchet and hammers. ";
yng[6] = "And now, its carvings together With axe and hatchet they break down,";
dby[6] = "And now they break down its carved work altogether, with hatchets and hammers.";
web[6] = "But now they break down the carved work of it at once with axes and hammers.";
hnv[6] = "Now all its carved work They break down with hatchet and hammers.";
vul[6] = "[Vulgate 73:6] et nunc scalpturas eius pariter bipinne et dolatoriis deraserunt";
kjv[7] = "They have cast fire into thy sanctuary, they have defiled [by casting down] the dwelling place of thy name to the ground.";
rsv[7] = "They set thy sanctuary on fire; to the ground they desecrated the dwelling place of thy name.";
asv[7] = "They have set thy sanctuary on fire; They have profaned the dwelling-place of thy name [by casting it] to the ground. ";
yng[7] = "They have sent into fire Thy sanctuary, to the earth they polluted the tabernacle of Thy name,";
dby[7] = "They have set on fire thy sanctuary, they have profaned the habitation of thy name to the ground.";
web[7] = "They have cast fire into thy sanctuary, they have defiled [by casting down] the dwelling-place of thy name to the ground.";
hnv[7] = "They have burned your sanctuary to the ground. They have profaned the dwelling-place of your Name.";
vul[7] = "[Vulgate 73:7] miserunt ignem in sanctuarium tuum in terram contaminaverunt habitaculum nominis tui";
kjv[8] = "They said in their hearts, Let us destroy them together: they have burned up all the synagogues of God in the land.";
rsv[8] = "They said to themselves, &quot;We will utterly subdue them&quot;; they burned all the meeting places of God in the land.";
asv[8] = "They said in their heart, Let us make havoc of them altogether: They have burned up all the synagogues of God in the land. ";
yng[8] = "They said in their hearts, `Let us oppress them together,\' They did burn all the meeting-places of God in the land.";
dby[8] = "They said in their heart, Let us destroy them together: they have burned up all God\'s places of assembly in the land.";
web[8] = "They said in their hearts, Let us destroy them together: they have burned up all the synagogues of God in the land.";
hnv[8] = "They said in their heart, &quot;We will crush them completely.&quot; They have burned up all the places in the land where God was worshiped.";
vul[8] = "[Vulgate 73:8] dixerunt in cordibus suis posteri eorum simul incenderunt omnes sollemnitates Dei in terra";
kjv[9] = "We see not our signs: [there is] no more any prophet: neither [is there] among us any that knoweth how long.";
rsv[9] = "We do not see our signs; there is no longer any prophet, and there is none among us who knows how long.";
asv[9] = "We see not our signs: There is no more any prophet; Neither is there among us any that knoweth how long. ";
yng[9] = "Our ensigns we have not seen, There is no more a prophet, Nor with us is one knowing how long.";
dby[9] = "We see not our signs; there is no more any prophet, neither is there among us any that knoweth how long.";
web[9] = "We see not our signs: [there is] no more any prophet: neither [is there] among us any that knoweth how long.";
hnv[9] = "We see no miraculous signs. There is no longer any prophet, Neither is there among us anyone who knows how long.";
vul[9] = "[Vulgate 73:9] signa nostra non vidimus non est ultra propheta et non est nobiscum qui sciat usquequo";
kjv[10] = "O God, how long shall the adversary reproach? shall the enemy blaspheme thy name for ever?";
rsv[10] = "How long, O God, is the foe to scoff? Is the enemy to revile thy name for ever?";
asv[10] = "How long, O God, shall the adversary reproach? Shall the enemy blaspheme thy name for ever? ";
yng[10] = "Till when, O God, doth an adversary reproach? Doth an enemy despise thy name for ever?";
dby[10] = "How long, O God, shall the adversary reproach? Shall the enemy contemn thy name for ever?";
web[10] = "O God, how long shall the adversary reproach? shall the enemy blaspheme thy name for ever?";
hnv[10] = "How long, God, shall the adversary reproach? Shall the enemy blaspheme your name forever?";
vul[10] = "[Vulgate 73:10] usquequo Deus exprobrabit adversarius blasphemabit inimicus nomen tuum in finem";
kjv[11] = "Why withdrawest thou thy hand, even thy right hand? pluck [it] out of thy bosom.";
rsv[11] = "Why dost thou hold back thy hand, why dost thou keep thy right hand in thy bosom?";
asv[11] = "Why drawest thou back thy hand, even thy right hand? [Pluck it] out of thy bosom [and] consume [them]. ";
yng[11] = "Why dost Thou turn back Thy hand, Even Thy right hand? From the midst of Thy bosom remove [it].";
dby[11] = "Why withdrawest thou thy hand, and thy right hand? [pluck it] out of thy bosom: consume [them].";
web[11] = "Why withdrawest thou thy hand, even thy right hand? pluck [it] out of thy bosom.";
hnv[11] = "Why do you draw back your hand, even your right hand? Take it out of your pocket and consume them!";
vul[11] = "[Vulgate 73:11] quare convertis manum tuam et dexteram tuam ad medium sinum tuum consume";
kjv[12] = "For God [is] my King of old, working salvation in the midst of the earth.";
rsv[12] = "Yet God my King is from of old, working salvation in the midst of the earth.";
asv[12] = "Yet God is my King of old, Working salvation in the midst of the earth. ";
yng[12] = "And God [is] my king of old, Working salvation in the midst of the earth.";
dby[12] = "But God is my king of old, accomplishing deliverances in the midst of the earth.";
web[12] = "For God [is] my King of old, working salvation in the midst of the earth.";
hnv[12] = "Yet God is my King of old, Working salvation in the midst of the eretz.";
vul[12] = "[Vulgate 73:12] Deus autem rex meus ab initio operatur salutes in medio terrae";
kjv[13] = "Thou didst divide the sea by thy strength: thou brakest the heads of the dragons in the waters.";
rsv[13] = "Thou didst divide the sea by thy might; thou didst break the heads of the dragons on the waters.";
asv[13] = "Thou didst divide the sea by thy strength: Thou brakest the heads of the sea-monsters in the waters. ";
yng[13] = "Thou hast broken by Thy strength a sea-[monster], Thou hast shivered Heads of dragons by the waters,";
dby[13] = "*Thou* didst divide the sea by thy strength; thou didst break the heads of the monsters on the waters:";
web[13] = "Thou didst divide the sea by thy strength: thou didst break the heads of the dragons in the waters.";
hnv[13] = "You divided the sea by your strength. You broke the heads of the sea monsters in the waters.";
vul[13] = "[Vulgate 73:13] tu dissipasti in fortitudine tua mare contrivisti capita draconum in aquis";
kjv[14] = "Thou brakest the heads of leviathan in pieces, [and] gavest him [to be] meat to the people inhabiting the wilderness.";
rsv[14] = "Thou didst crush the heads of Leviathan, thou didst give him as food for the creatures of the wilderness.";
asv[14] = "Thou brakest the heads of leviathan in pieces; Thou gavest him to be food to the people inhabiting the wilderness. ";
yng[14] = "Thou hast broken the heads of leviathan, Thou makest him food, For the people of the dry places.";
dby[14] = "*Thou* didst break in pieces the heads of leviathan, thou gavest him to be meat to those that people the desert.";
web[14] = "Thou didst break the head of leviathan in pieces, [and] didst give him [to be] food to the people inhabiting the wilderness.";
hnv[14] = "You broke the heads of Livyatan in pieces. You gave him as food to people and desert creatures.";
vul[14] = "[Vulgate 73:14] tu confregisti capita Leviathan dedisti eum in escam populo Aethiopum";
kjv[15] = "Thou didst cleave the fountain and the flood: thou driedst up mighty rivers.";
rsv[15] = "Thou didst cleave open springs and brooks; thou didst dry up ever-flowing streams.";
asv[15] = "Thou didst cleave fountain and flood: Thou driedst up mighty rivers. ";
yng[15] = "Thou hast cleaved a fountain and a stream, Thou hast dried up perennial flowings.";
dby[15] = "*Thou* didst cleave fountain and torrent, *thou* driedst up ever-flowing rivers.";
web[15] = "Thou didst cleave the fountain and the flood: thou didst dry up mighty rivers.";
hnv[15] = "You opened up spring and stream. You dried up mighty rivers.";
vul[15] = "[Vulgate 73:15] tu disrupisti fontem et torrentem tu exsiccasti flumina fortia";
kjv[16] = "The day [is] thine, the night also [is] thine: thou hast prepared the light and the sun.";
rsv[16] = "Thine is the day, thine also the night; thou hast established the luminaries and the sun.";
asv[16] = "The day is thine, the night also is thine: Thou hast prepared the light and the sun. ";
yng[16] = "Thine [is] the day, also Thine [is] the night, Thou hast prepared a light giver -- the sun.";
dby[16] = "The day is thine, the night also is thine; *thou* hast prepared the moon and the sun:";
web[16] = "The day [is] thine, the night also [is] thine: thou hast prepared the light and the sun.";
hnv[16] = "The day is yours, the night is also yours. You have prepared the light and the sun.";
vul[16] = "[Vulgate 73:16] tua est dies et tua est nox tu ordinasti luminaria et solem";
kjv[17] = "Thou hast set all the borders of the earth: thou hast made summer and winter.";
rsv[17] = "Thou hast fixed all the bounds of the earth; thou hast made summer and winter.";
asv[17] = "Thou hast set all the borders of the earth: Thou hast made summer and winter. ";
yng[17] = "Thou hast set up all the borders of earth, Summer and winter Thou hast formed them.";
dby[17] = "*Thou* hast set all the borders of the earth; summer and winter -- *thou* didst form them.";
web[17] = "Thou hast set all the borders of the earth: thou hast made summer and winter.";
hnv[17] = "You have set all the boundaries of the eretz. You have made summer and winter.";
vul[17] = "[Vulgate 73:17] tu statuisti omnes terminos terrae aestatem et hiemem tu plasmasti";
kjv[18] = "Remember this, [that] the enemy hath reproached, O LORD, and [that] the foolish people have blasphemed thy name.";
rsv[18] = "Remember this, O LORD, how the enemy scoffs, and an impious people reviles thy name.";
asv[18] = "Remember this, that the enemy hath reproached, O Jehovah, And that a foolish people hath blasphemed thy name. ";
yng[18] = "Remember this -- an enemy reproached Jehovah, And a foolish people have despised Thy name.";
dby[18] = "Remember this, that an enemy hath reproached Jehovah, and a foolish people have contemned thy name.";
web[18] = "Remember this, the enemy hath reproached, O LORD, and the foolish people have blasphemed thy name.";
hnv[18] = "Remember this, that the enemy has mocked you, LORD. Foolish people have blasphemed your name.";
vul[18] = "[Vulgate 73:18] memento huius inimicus exprobravit Domino et populus insipiens blasphemavit nomen tuum";
kjv[19] = "O deliver not the soul of thy turtledove unto the multitude [of the wicked]: forget not the congregation of thy poor for ever.";
rsv[19] = "Do not deliver the soul of thy dove to the wild beasts; do not forget the life of thy poor for ever.";
asv[19] = "Oh deliver not the soul of thy turtle-dove unto the wild beast: Forget not the life of thy poor for ever. ";
yng[19] = "Give not up to a company, The soul of Thy turtle-dove, The company of Thy poor ones forget not for ever.";
dby[19] = "Give not up the soul of thy turtle-dove unto the wild beast; forget not the troop of thine afflicted for ever.";
web[19] = "O deliver not the soul of thy turtle dove to the multitude [of the wicked]: forget not the congregation of thy poor for ever.";
hnv[19] = "Don\'t deliver the soul of your dove to wild beasts. Don\'t forget the life of your poor forever.";
vul[19] = "[Vulgate 73:19] ne tradas bestiis animam eruditam lege tua vitae pauperum tuorum ne obliviscaris in perpetuum";
kjv[20] = "Have respect unto the covenant: for the dark places of the earth are full of the habitations of cruelty.";
rsv[20] = "Have regard for thy covenant; for the dark places of the land are full of the habitations of violence.";
asv[20] = "Have respect unto the covenant; For the dark places of the earth are full of the habitations of violence. ";
yng[20] = "Look attentively to the covenant, For the dark places of earth, Have been full of habitations of violence.";
dby[20] = "Have respect unto the covenant; for the dark places of the earth are full of the dwellings of violence.";
web[20] = "Have respect to the covenant: for the dark places of the earth are full of the habitations of cruelty.";
hnv[20] = "Honor your covenant, For haunts of violence fill the dark places of the eretz.";
vul[20] = "[Vulgate 73:20] respice ad pactum quia repletae sunt tenebris terrae habitationes iniquae subrutae";
kjv[21] = "O let not the oppressed return ashamed: let the poor and needy praise thy name.";
rsv[21] = "Let not the downtrodden be put to shame; let the poor and needy praise thy name.";
asv[21] = "Oh let not the oppressed return ashamed: Let the poor and needy praise thy name. ";
yng[21] = "Let not the oppressed turn back ashamed, Let the poor and needy praise Thy name,";
dby[21] = "Oh let not the oppressed one return ashamed; let the afflicted and needy praise thy name.";
web[21] = "O let not the oppressed return ashamed: let the poor and needy praise thy name.";
hnv[21] = "Don\'t let the oppressed return ashamed. Let the poor and needy praise your name.";
vul[21] = "[Vulgate 73:21] ne revertatur confractus et confusus egenus et pauper laudabunt nomen tuum";
kjv[22] = "Arise, O God, plead thine own cause: remember how the foolish man reproacheth thee daily.";
rsv[22] = "Arise, O God, plead thy cause; remember how the impious scoff at thee all the day!";
asv[22] = "Arise, O God, plead thine own cause: Remember how the foolish man reproacheth thee all the day. ";
yng[22] = "Arise, O God, plead Thy plea, Remember Thy reproach from a fool all the day.";
dby[22] = "Rise up, O God, plead thine own cause: remember how the foolish man reproacheth thee all the day;";
web[22] = "Arise, O God, plead thy own cause: remember how the foolish man reproacheth thee daily.";
hnv[22] = "Arise, God! Plead your own cause. Remember how the foolish man mocks you all day.";
vul[22] = "[Vulgate 73:22] surge Deus iudica causam tuam memento obprobrii tui ab insipiente tota die";
kjv[23] = "Forget not the voice of thine enemies: the tumult of those that rise up against thee increaseth continually.";
rsv[23] = "Do not forget the clamor of thy foes, the uproar of thy adversaries which goes up continually!";
asv[23] = "Forget not the voice of thine adversaries: The tumult of those that rise up against thee ascendeth continually. ";
yng[23] = "Forget not the voice of Thine adversaries, The noise of Thy withstanders is going up continually!";
dby[23] = "Forget not the voice of thine adversaries: the tumult of those that rise up against thee ascendeth continually.";
web[23] = "Forget not the voice of thy enemies: the tumult of those that rise against thee increaseth continually.";
hnv[23] = "Don\'t forget the voice of your adversaries. The tumult of those who rise up against you ascends continually. ";
vul[23] = "[Vulgate 73:23] ne obliviscaris vocis hostium tuorum sonitus adversariorum tuorum ascendit iugiter";
csb[1] = "Why have you rejected us forever, God? Why does your anger burn against the sheep of your pasture?";
csb[2] = "Remember your congregation, which you purchased long ago and redeemed as the tribe for your own possession. Remember Mount Zion where you dwell.";
csb[3] = "Make your way to the perpetual ruins, to all that the enemy has destroyed in the sanctuary.";
csb[4] = "Your adversaries roared in the meeting place where you met with us. They set up their emblems as signs.";
csb[5] = "It was like men in a thicket of trees, wielding axes,";
csb[6] = "then smashing all the carvings with hatchets and picks.";
csb[7] = "They set your sanctuary on fire; they utterly desecrated the dwelling place of your name.";
csb[8] = "They said in their hearts, &quot;Let us oppress them relentlessly.&quot; They burned every place throughout the land where God met with us.";
csb[9] = "There are no signs for us to see. There is no longer a prophet. And none of us knows how long this will last.";
csb[10] = "God, how long will the enemy mock? Will the foe insult your name forever?";
csb[11] = "Why do you hold back your hand? Stretch out your right hand and destroy them!";
csb[12] = "God my King is from ancient times, performing saving acts on the earth.";
csb[13] = "You divided the sea with your strength; you smashed the heads of the sea monsters in the water;";
csb[14] = "you crushed the heads of Leviathan; you fed him to the creatures of the desert.";
csb[15] = "You opened up springs and streams; you dried up ever-flowing rivers.";
csb[16] = "The day is yours, also the night; you established the moon and the sun.";
csb[17] = "You set all the boundaries of the earth; you made summer and winter.";
csb[18] = "Remember this: the enemy has mocked the LORD, and a foolish people has insulted your name.";
csb[19] = "Do not give to beasts the life of your dove; do not forget the lives of your poor people forever.";
csb[20] = "Consider the covenant, for the dark places of the land are full of violence.";
csb[21] = "Do not let the oppressed turn away in shame; let the poor and needy praise your name.";
csb[22] = "Rise up, God, champion your cause! Remember the insults that fools bring against you all day long.";
csb[23] = "Do not forget the clamor of your adversaries, the tumult of your opponents that goes up constantly.";
</script>
