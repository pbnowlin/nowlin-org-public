csb[1] = "Hallelujah! Give thanks to the LORD, for he is good; his faithful love endures forever.";
csb[2] = "Who can declare the LORD\'s mighty acts or proclaim all the praise due him?";
csb[3] = "How happy are those who uphold justice, who practice righteousness at all times.";
csb[4] = "Remember me, LORD, when you show favor to your people. Come to me with your salvation";
csb[5] = "so that I may enjoy the prosperity of your chosen ones, rejoice in the joy of your nation, and boast about your heritage.";
csb[6] = "Both we and our fathers have sinned; we have done wrong and have acted wickedly.";
csb[7] = "Our fathers in Egypt did not grasp the significance of your wondrous works or remember your many acts of faithful love; instead, they rebelled by the sea -- the Red Sea.";
csb[8] = "Yet he saved them for his name\'s sake, to make his power known.";
csb[9] = "He rebuked the Red Sea, and it dried up; he led them through the depths as through a desert.";
csb[10] = "He saved them from the power of the adversary; he redeemed them from the power of the enemy.";
csb[11] = "Water covered their foes; not one of them remained.";
csb[12] = "Then they believed his promises and sang his praise.";
csb[13] = "They soon forgot his works and would not wait for his counsel.";
csb[14] = "They were seized with craving in the wilderness and tested God in the desert.";
csb[15] = "He gave them what they asked for, but sent a wasting disease among them.";
csb[16] = "In the camp they were envious of Moses and of Aaron, the LORD\'s holy one.";
csb[17] = "The earth opened up and swallowed Dathan; it covered the assembly of Abiram.";
csb[18] = "Fire blazed throughout their assembly; flames consumed the wicked.";
csb[19] = "At Horeb they made a calf and worshiped the cast metal image.";
csb[20] = "They exchanged their glory for the image of a grass-eating ox.";
csb[21] = "They forgot God their Savior, who did great things in Egypt,";
csb[22] = "wondrous works in the land of Ham, awe-inspiring acts at the Red Sea.";
csb[23] = "So he said he would have destroyed them -- if Moses his chosen one had not stood before him in the breach to turn his wrath away from destroying them.";
csb[24] = "They despised the pleasant land and did not believe his promise.";
csb[25] = "They grumbled in their tents and did not listen to the LORD.";
csb[26] = "So he raised his hand against them with an oath that he would make them fall in the desert";
csb[27] = "and would disperse their descendants among the nations, scattering them throughout the lands.";
csb[28] = "They aligned themselves with Baal of Peor and ate sacrifices offered to lifeless gods.";
csb[29] = "They angered the LORD with their deeds, and a plague broke out against them.";
csb[30] = "But Phinehas stood up and intervened, and the plague was stopped.";
csb[31] = "It was credited to him as righteousness throughout all generations to come.";
csb[32] = "They angered the LORD at the Waters of Meribah, and Moses suffered because of them;";
csb[33] = "for they embittered his spirit, and he spoke rashly with his lips.";
csb[34] = "They did not destroy the peoples as the LORD had commanded them";
csb[35] = "but mingled with the nations and adopted their ways.";
csb[36] = "They served their idols, which became a snare to them.";
csb[37] = "They sacrificed their sons and daughters to demons.";
csb[38] = "They shed innocent blood -- the blood of their sons and daughters whom they sacrificed to the idols of Canaan; so the land became polluted with blood.";
csb[39] = "They defiled themselves by their actions and prostituted themselves by their deeds.";
csb[40] = "Therefore the LORD\'s anger burned against his people, and he abhorred his own inheritance.";
csb[41] = "He handed them over to the nations; those who hated them ruled over them.";
csb[42] = "Their enemies oppressed them, and they were subdued under their power.";
csb[43] = "He rescued them many times, but they continued to rebel deliberately and were beaten down by their iniquity.";
csb[44] = "When he heard their cry, he took note of their distress,";
csb[45] = "remembered his covenant with them, and relented according to the abundance of his faithful love.";
csb[46] = "He caused them to be pitied before all their captors.";
csb[47] = "Save us, LORD our God, and gather us from the nations, so that we may give thanks to your holy name and rejoice in your praise.";
csb[48] = "Blessed be the LORD God of Israel, from everlasting to everlasting. Let all the people say, &quot;Amen! &quot; Hallelujah!";
