kjv[1] = "Rejoice in the LORD, O ye righteous: [for] praise is comely for the upright.";
rsv[1] = "Rejoice in the LORD, O you righteous! Praise befits the upright.";
asv[1] = "Rejoice in Jehovah, O ye righteous: Praise is comely for the upright. ";
yng[1] = "Sing, ye righteous, in Jehovah, For upright ones praise [is] comely.";
dby[1] = "Exult, ye righteous, in Jehovah: praise is comely for the upright.";
web[1] = "Rejoice in the LORD, O ye righteous: [for] praise is comely for the upright.";
hnv[1] = "Rejoice in the LORD, you righteous! Praise is fitting for the upright.";
vul[1] = "[Vulgate 32:1] laudate iusti Dominum rectos decet laudatio";
kjv[2] = "Praise the LORD with harp: sing unto him with the psaltery [and] an instrument of ten strings.";
rsv[2] = "Praise the LORD with the lyre, make melody to him with the harp of ten strings!";
asv[2] = "Give thanks unto Jehovah with the harp: Sing praises unto him with the psaltery of ten strings. ";
yng[2] = "Give ye thanks to Jehovah with a harp, With psaltery of ten strings sing praise to Him,";
dby[2] = "Give thanks unto Jehovah with the harp; sing psalms unto him with the ten-stringed lute.";
web[2] = "Praise the LORD with harp: sing to him with the psaltery [and] an instrument of ten strings.";
hnv[2] = "Give thanks to the LORD with the lyre. Sing praises to him with the harp of ten strings.";
vul[2] = "[Vulgate 32:2] confitemini Domino in cithara in psalterio decacordo cantate ei";
kjv[3] = "Sing unto him a new song; play skilfully with a loud noise.";
rsv[3] = "Sing to him a new song, play skilfully on the strings, with loud shouts.";
asv[3] = "Sing unto him a new song; Play skilfully with a loud noise. ";
yng[3] = "Sing ye to Him a new song, Play skilfully with shouting.";
dby[3] = "Sing unto him a new song; play skilfully with a loud sound.";
web[3] = "Sing to him a new song; play skillfully with a loud noise.";
hnv[3] = "Sing to him a new song. Play skillfully with a shout of joy!";
vul[3] = "[Vulgate 32:3] cantate ei canticum novum diligenter psallite in iubilo";
kjv[4] = "For the word of the LORD [is] right; and all his works [are done] in truth.";
rsv[4] = "For the word of the LORD is upright; and all his work is done in faithfulness.";
asv[4] = "For the word of Jehovah is right; And all his work is [done] in faithfulness. ";
yng[4] = "For upright [is] the word of Jehovah, And all His work [is] in faithfulness.";
dby[4] = "For the word of Jehovah is right, and all his work is in faithfulness.";
web[4] = "For the word of the LORD [is] right; and all his works [are done] in truth.";
hnv[4] = "For the word of the LORD is right. All his work is done in faithfulness.";
vul[4] = "[Vulgate 32:4] quia rectum est verbum Domini et omne opus eius in fide";
kjv[5] = "He loveth righteousness and judgment: the earth is full of the goodness of the LORD.";
rsv[5] = "He loves righteousness and justice; the earth is full of the steadfast love of the LORD.";
asv[5] = "He loveth righteousness and justice: The earth is full of the lovingkindness of Jehovah. ";
yng[5] = "Loving righteousness and judgment, Of the kindness of Jehovah is the earth full.";
dby[5] = "He loveth righteousness and judgment: the earth is full of the loving-kindness of Jehovah.";
web[5] = "He loveth righteousness and judgment: the earth is full of the goodness of the LORD.";
hnv[5] = "He loves righteousness and justice. The eretz is full of the lovingkindness of the LORD.";
vul[5] = "[Vulgate 32:5] diligit iustitiam et iudicium misericordia Domini plena est terra";
kjv[6] = "By the word of the LORD were the heavens made; and all the host of them by the breath of his mouth.";
rsv[6] = "By the word of the LORD the heavens were made, and all their host by the breath of his mouth.";
asv[6] = "By the word of Jehovah were the heavens made, And all the host of them by the breath of his mouth. ";
yng[6] = "By the word of Jehovah The heavens have been made, And by the breath of His mouth all their host.";
dby[6] = "By the word of Jehovah were the heavens made, and all the host of them by the breath of his mouth.";
web[6] = "By the word of the LORD were the heavens made; and all the host of them by the breath of his mouth.";
hnv[6] = "By the LORD\'s word the heavens were made; All their host by the breath of his mouth.";
vul[6] = "[Vulgate 32:6] verbo Domini caeli facti sunt et spiritu oris eius omnis ornatus eorum";
kjv[7] = "He gathereth the waters of the sea together as an heap: he layeth up the depth in storehouses.";
rsv[7] = "He gathered the waters of the sea as in a bottle; he put the deeps in storehouses.";
asv[7] = "He gathereth the waters of the sea together as a heap: He layeth up the deeps in store-houses. ";
yng[7] = "Gathering as a heap the waters of the sea, Putting in treasuries the depths.";
dby[7] = "He gathereth the waters of the sea together as a heap; he layeth up the deeps in storehouses.";
web[7] = "He gathereth the waters of the sea together as a heap: he layeth up the depth in store-houses.";
hnv[7] = "He gathers the waters of the sea together as a heap. He lays up the deeps in storehouses.";
vul[7] = "[Vulgate 32:7] congregans quasi in utre aquas maris ponens in thesauris abyssos";
kjv[8] = "Let all the earth fear the LORD: let all the inhabitants of the world stand in awe of him.";
rsv[8] = "Let all the earth fear the LORD, let all the inhabitants of the world stand in awe of him!";
asv[8] = "Let all the earth fear Jehovah: Let all the inhabitants of the world stand in awe of him. ";
yng[8] = "Afraid of Jehovah are all the earth, Of Him are all the inhabitants of the world afraid.";
dby[8] = "Let all the earth fear Jehovah; let all the inhabitants of the world stand in awe of him.";
web[8] = "Let all the earth fear the LORD: let all the inhabitants of the world stand in awe of him.";
hnv[8] = "Let all the eretz fear the LORD. Let all the inhabitants of the world stand in awe of him.";
vul[8] = "[Vulgate 32:8] timeat Dominum omnis terra ipsum formident universi habitatores orbis";
kjv[9] = "For he spake, and it was [done]; he commanded, and it stood fast.";
rsv[9] = "For he spoke, and it came to be; he commanded, and it stood forth.";
asv[9] = "For he spake, and it was done; He commanded, and it stood fast. ";
yng[9] = "For He hath said, and it is, He hath commanded, and it standeth.";
dby[9] = "For *he* spoke, and it was [done]; *he* commanded, and it stood fast.";
web[9] = "For he spoke, and it was [done]; he commanded, and it stood fast.";
hnv[9] = "For he spoke, and it was done. He commanded, and it stood firm.";
vul[9] = "[Vulgate 32:9] quia ipse mandavit et factus est ipso praecipiente stetit";
kjv[10] = "The LORD bringeth the counsel of the heathen to nought: he maketh the devices of the people of none effect.";
rsv[10] = "The LORD brings the counsel of the nations to nought; he frustrates the plans of the peoples.";
asv[10] = "Jehovah bringeth the counsel of the nations to nought; He maketh the thoughts of the peoples to be of no effect. ";
yng[10] = "Jehovah made void the counsel of nations, He disallowed the thoughts of the peoples.";
dby[10] = "Jehovah frustrateth the counsel of the nations; he maketh the thoughts of the peoples of none effect.";
web[10] = "The LORD bringeth the counsel of the heathen to naught: he maketh the devices of the people of no effect.";
hnv[10] = "The LORD brings the counsel of the nations to nothing. He makes the thoughts of the peoples to be of no effect.";
vul[10] = "[Vulgate 32:10] Dominus dissolvit consilium gentium irritas fecit cogitationes populorum";
kjv[11] = "The counsel of the LORD standeth for ever, the thoughts of his heart to all generations.";
rsv[11] = "The counsel of the LORD stands for ever, the thoughts of his heart to all generations.";
asv[11] = "The counsel of Jehovah standeth fast for ever, The thoughts of his heart to all generations. ";
yng[11] = "The counsel of Jehovah to the age standeth, The thoughts of His heart to all generations.";
dby[11] = "The counsel of Jehovah standeth for ever, the thoughts of his heart from generation to generation.";
web[11] = "The counsel of the LORD standeth for ever, the thoughts of his heart to all generations.";
hnv[11] = "The counsel of the LORD stands fast forever, The thoughts of his heart to all generations.";
vul[11] = "[Vulgate 32:11] consilium Domini in aeternum stabit cogitationes cordis eius in generatione et generatione";
kjv[12] = "Blessed [is] the nation whose God [is] the LORD; [and] the people [whom] he hath chosen for his own inheritance.";
rsv[12] = "Blessed is the nation whose God is the LORD, the people whom he has chosen as his heritage!";
asv[12] = "Blessed is the nation whose God is Jehovah, The people whom he hath chosen for his own inheritance. ";
yng[12] = "O the happiness of the nation whose God [is] Jehovah, Of the people He did choose, For an inheritance to Him.";
dby[12] = "Blessed is the nation whose God is Jehovah, the people that he hath chosen for his inheritance!";
web[12] = "Blessed [is] the nation whose God [is] the LORD; [and] the people [whom] he hath chosen for his own inheritance.";
hnv[12] = "Blessed is the nation whose God is the LORD, The people whom he has chosen for his own inheritance.";
vul[12] = "[Vulgate 32:12] beata gens cuius Dominus Deus eius populus quem elegit in hereditatem sibi";
kjv[13] = "The LORD looketh from heaven; he beholdeth all the sons of men.";
rsv[13] = "The LORD looks down from heaven, he sees all the sons of men;";
asv[13] = "Jehovah looketh from heaven; He beholdeth all the sons of men; ";
yng[13] = "From the heavens hath Jehovah looked, He hath seen all the sons of men.";
dby[13] = "Jehovah looketh from the heavens; he beholdeth all the sons of men:";
web[13] = "The LORD looketh from heaven; he beholdeth all the sons of men.";
hnv[13] = "The LORD looks from heaven. He sees all the sons of men.";
vul[13] = "[Vulgate 32:13] de caelo respexit Dominus vidit omnes filios Adam";
kjv[14] = "From the place of his habitation he looketh upon all the inhabitants of the earth.";
rsv[14] = "from where he sits enthroned he looks forth on all the inhabitants of the earth,";
asv[14] = "From the place of his habitation he looketh forth Upon all the inhabitants of the earth, ";
yng[14] = "From the fixed place of His dwelling, He looked unto all inhabitants of the earth;";
dby[14] = "From the place of his habitation he looketh forth upon all the inhabitants of the earth;";
web[14] = "From the place of his habitation he looketh upon all the inhabitants of the earth.";
hnv[14] = "From the place of his habitation he looks out on all the inhabitants of the eretz,";
vul[14] = "[Vulgate 32:14] de firmissimo solio suo prospexit ad universos habitatores terrae";
kjv[15] = "He fashioneth their hearts alike; he considereth all their works.";
rsv[15] = "he who fashions the hearts of them all, and observes all their deeds.";
asv[15] = "He that fashioneth the hearts of them all, That considereth all their works. ";
yng[15] = "Who is forming their hearts together, Who is attending unto all their works.";
dby[15] = "He who fashioneth the hearts of them all, who considereth all their works.";
web[15] = "He fashioneth their hearts alike; he considereth all their works.";
hnv[15] = "He who fashions all of their hearts; And he considers all of their works.";
vul[15] = "[Vulgate 32:15] fingens pariter cor eorum intellegens omnia opera eorum";
kjv[16] = "There is no king saved by the multitude of an host: a mighty man is not delivered by much strength.";
rsv[16] = "A king is not saved by his great army; a warrior is not delivered by his great strength.";
asv[16] = "There is no king saved by the multitude of a host: A mighty man is not delivered by great strength. ";
yng[16] = "The king is not saved by the multitude of a force. A mighty man is not delivered, By abundance of power.";
dby[16] = "The king is not saved by the multitude of [his] forces; a mighty man is not delivered by much strength.";
web[16] = "There is no king saved by the multitude of a host: a mighty man is not delivered by much strength.";
hnv[16] = "There is no king saved by the multitude of a host. A mighty man is not delivered by great strength.";
vul[16] = "[Vulgate 32:16] non salvatur rex in multitudine exercitus nec fortis liberabitur in multiplicatione virtutis";
kjv[17] = "An horse [is] a vain thing for safety: neither shall he deliver [any] by his great strength.";
rsv[17] = "The war horse is a vain hope for victory, and by its great might it cannot save.";
asv[17] = "A horse is a vain thing for safety; Neither doth he deliver any by his great power. ";
yng[17] = "A false thing [is] the horse for safety, And by the abundance of his strength He doth not deliver.";
dby[17] = "The horse is a vain thing for safety; neither doth he deliver by his great power.";
web[17] = "A horse [is] a vain thing for safety: neither shall he deliver [any] by his great strength.";
hnv[17] = "A horse is a vain thing for safety, Neither does he deliver any by his great power.";
vul[17] = "[Vulgate 32:17] fallax equus ad salutem et in multitudine roboris sui non salvabit";
kjv[18] = "Behold, the eye of the LORD [is] upon them that fear him, upon them that hope in his mercy;";
rsv[18] = "Behold, the eye of the LORD is on those who fear him, on those who hope in his steadfast love,";
asv[18] = "Behold, the eye of Jehovah is upon them that fear him, Upon them that hope in his lovingkindness; ";
yng[18] = "Lo, the eye of Jehovah [is] to those fearing Him, To those waiting for His kindness,";
dby[18] = "Behold, the eye of Jehovah is upon them that fear him, upon them that hope in his loving-kindness,";
web[18] = "Behold, the eye of the LORD [is] upon them that fear him, upon them that hope in his mercy;";
hnv[18] = "Behold, the LORD\'s eye is on those who fear him, On those who hope in his lovingkindness;";
vul[18] = "[Vulgate 32:18] ecce oculus Domini super timentes eum et expectantes misericordiam eius";
kjv[19] = "To deliver their soul from death, and to keep them alive in famine.";
rsv[19] = "that he may deliver their soul from death, and keep them alive in famine.";
asv[19] = "To deliver their soul from death, And to keep them alive in famine. ";
yng[19] = "To deliver from death their soul, And to keep them alive in famine.";
dby[19] = "To deliver their soul from death, and to keep them alive in famine.";
web[19] = "To deliver their soul from death, and to keep them alive in famine.";
hnv[19] = "To deliver their soul from death, To keep them alive in famine.";
vul[19] = "[Vulgate 32:19] ut eruat de morte animam eorum et vivificet eos in fame";
kjv[20] = "Our soul waiteth for the LORD: he [is] our help and our shield.";
rsv[20] = "Our soul waits for the LORD; he is our help and shield.";
asv[20] = "Our soul hath waited for Jehovah: He is our help and our shield. ";
yng[20] = "Our soul hath waited for Jehovah, Our help and our shield [is] He,";
dby[20] = "Our soul waiteth for Jehovah: he is our help and our shield.";
web[20] = "Our soul waiteth for the LORD: he [is] our help and our shield.";
hnv[20] = "Our soul has waited for the LORD. He is our help and our shield.";
vul[20] = "[Vulgate 32:20] anima nostra expectavit Dominum auxilium nostrum et clipeus noster est";
kjv[21] = "For our heart shall rejoice in him, because we have trusted in his holy name.";
rsv[21] = "Yea, our heart is glad in him, because we trust in his holy name.";
asv[21] = "For our heart shall rejoice in him, Because we have trusted in his holy name. ";
yng[21] = "For in Him doth our heart rejoice, For in His holy name we have trusted.";
dby[21] = "For in him shall our heart rejoice, because we have confided in his holy name.";
web[21] = "For our heart shall rejoice in him, because we have trusted in his holy name.";
hnv[21] = "For our heart rejoices in him, Because we have trusted in his holy name.";
vul[21] = "[Vulgate 32:21] in ipso enim laetabitur cor nostrum quia in nomine sancto eius speravimus";
kjv[22] = "Let thy mercy, O LORD, be upon us, according as we hope in thee.";
rsv[22] = "Let thy steadfast love, O LORD, be upon us, even as we hope in thee.";
asv[22] = "Let thy lovingkindness, O Jehovah, be upon us, According as we have hoped in thee. ";
yng[22] = "Let Thy kindness, O Jehovah, be upon us, As we have waited for Thee!";
dby[22] = "Let thy loving-kindness, O Jehovah, be upon us, according as we have hoped in thee.";
web[22] = "Let thy mercy, O LORD, be upon us, according as we hope in thee.";
hnv[22] = "Let your lovingkindness be on us, LORD, Since we have hoped in you. ";
vul[22] = "[Vulgate 32:22] sit misericordia tua Domine super nos sicut expectavimus te";
csb[1] = "Rejoice in the LORD, you righteous ones; praise from the upright is beautiful.";
csb[2] = "Praise the LORD with the lyre; make music to him with a ten-stringed harp.";
csb[3] = "Sing a new song to him; play skillfully on the strings, with a joyful shout.";
csb[4] = "For the word of the LORD is right, and all his work is trustworthy.";
csb[5] = "He loves righteousness and justice; the earth is full of the LORD\'s unfailing love.";
csb[6] = "The heavens were made by the word of the LORD, and all the stars, by the breath of his mouth.";
csb[7] = "He gathers the water of the sea into a heap; he puts the depths into storehouses.";
csb[8] = "Let the whole earth fear the LORD; let all the inhabitants of the world stand in awe of him.";
csb[9] = "For he spoke, and it came into being; he commanded, and it came into existence.";
csb[10] = "The LORD frustrates the counsel of the nations; he thwarts the plans of the peoples.";
csb[11] = "The counsel of the LORD stands forever, the plans of his heart from generation to generation.";
csb[12] = "Happy is the nation whose God is the LORD -- the people he has chosen to be his own possession!";
csb[13] = "The LORD looks down from heaven; he observes everyone.";
csb[14] = "He gazes on all the inhabitants of the earth from his dwelling place.";
csb[15] = "He forms the hearts of them all; he considers all their works.";
csb[16] = "A king is not saved by a large army; a warrior will not be rescued by great strength.";
csb[17] = "The horse is a false hope for safety; it provides no escape by its great power.";
csb[18] = "But look, the LORD keeps his eye on those who fear him -- those who depend on his faithful love";
csb[19] = "to rescue them from death and to keep them alive in famine.";
csb[20] = "We wait for the LORD; he is our help and shield.";
csb[21] = "For our hearts rejoice in him because we trust in his holy name.";
csb[22] = "May your faithful love rest on us, LORD, for we put our hope in you.";
</script>
