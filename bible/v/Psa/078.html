kjv[63] = "The fire consumed their young men; and their maidens were not given to marriage.";
rsv[63] = "Fire devoured their young men, and their maidens had no marriage song.";
asv[63] = "Fire devoured their young men; And their virgins had no marriage-song. ";
yng[63] = "His young men hath fire consumed, And His virgins have not been praised.";
dby[63] = "The fire consumed their young men, and their maidens were not praised in [nuptial] song;";
web[63] = "The fire consumed their young men; and their maidens were not given to marriage.";
hnv[63] = "Fire devoured their young men; Their virgins had no wedding song.";
vul[63] = "[Vulgate 77:63] iuvenes eius devoravit ignis et virgines eius nemo luxit";
kjv[64] = "Their priests fell by the sword; and their widows made no lamentation.";
rsv[64] = "Their priests fell by the sword, and their widows made no lamentation.";
asv[64] = "Their priests fell by the sword; And their widows made no lamentation. ";
yng[64] = "His priests by the sword have fallen, And their widows weep not.";
dby[64] = "Their priests fell by the sword, and their widows made no lamentation.";
web[64] = "Their priests fell by the sword; and their widows made no lamentation.";
hnv[64] = "Their Kohanim fell by the sword, And their widows couldn\'t weep.";
vul[64] = "[Vulgate 77:64] sacerdotes eius gladio ceciderunt et viduae eius non sunt fletae";
kjv[65] = "Then the Lord awaked as one out of sleep, [and] like a mighty man that shouteth by reason of wine.";
rsv[65] = "Then the Lord awoke as from sleep, like a strong man shouting because of wine.";
asv[65] = "Then the Lord awaked as one out of sleep, Like a mighty man that shouteth by reason of wine. ";
yng[65] = "And the Lord waketh as a sleeper, As a mighty one crying aloud from wine.";
dby[65] = "Then the Lord awoke as one out of sleep, like a mighty man that shouteth aloud by reason of wine;";
web[65] = "Then the Lord awaked as one out of sleep, [and] like a mighty man that shouteth by reason of wine.";
hnv[65] = "Then the Lord awakened as one out of sleep, Like a mighty man who shouts by reason of wine.";
vul[65] = "[Vulgate 77:65] et evigilavit quasi dormiens Dominus quasi fortis post crapulam vini";
kjv[66] = "And he smote his enemies in the hinder parts: he put them to a perpetual reproach.";
rsv[66] = "And he put his adversaries to rout; he put them to everlasting shame.";
asv[66] = "And he smote his adversaries backward: He put them to a perpetual reproach. ";
yng[66] = "And He smiteth His adversaries backward, A reproach age-during He hath put on them,";
dby[66] = "And he smote his adversaries in the hinder part, and put them to everlasting reproach.";
web[66] = "And he smote his enemies in the hinder part: he put them to a perpetual reproach.";
hnv[66] = "He struck his adversaries backward. He put them to a perpetual reproach.";
vul[66] = "[Vulgate 77:66] et percussit hostes suos retrorsum obprobrium sempiternum dedit eos";
kjv[67] = "Moreover he refused the tabernacle of Joseph, and chose not the tribe of Ephraim:";
rsv[67] = "He rejected the tent of Joseph, he did not choose the tribe of E\'phraim;";
asv[67] = "Moreover he refused the tent of Joseph, And chose not the tribe of Ephraim, ";
yng[67] = "And He kicketh against the tent of Joseph, And on the tribe of Ephraim hath not fixed.";
dby[67] = "And he rejected the tent of Joseph, and chose not the tribe of Ephraim,";
web[67] = "Moreover he refused the tabernacle of Joseph, and chose not the tribe of Ephraim:";
hnv[67] = "Moreover he rejected the tent of Yosef, And didn\'t choose the tribe of Efrayim,";
vul[67] = "[Vulgate 77:67] et proiecit tabernaculum Ioseph et tribum Efraim non elegit";
kjv[68] = "But chose the tribe of Judah, the mount Zion which he loved.";
rsv[68] = "but he chose the tribe of Judah, Mount Zion, which he loves.";
asv[68] = "But chose the tribe of Judah, The mount Zion which he loved. ";
yng[68] = "And He chooseth the tribe of Judah, With mount Zion that He loved,";
dby[68] = "But chose the tribe of Judah, the mount Zion which he loved;";
web[68] = "But chose the tribe of Judah, the mount Zion which he loved.";
hnv[68] = "But chose the tribe of Yehudah, Mount Tziyon which he loved.";
vul[68] = "[Vulgate 77:68] sed elegit tribum Iuda montem Sion quem dilexit";
kjv[69] = "And he built his sanctuary like high [palaces], like the earth which he hath established for ever.";
rsv[69] = "He built his sanctuary like the high heavens, like the earth, which he has founded for ever.";
asv[69] = "And he built his sanctuary like the heights, Like the earth which he hath established for ever. ";
yng[69] = "And buildeth His sanctuary as a high place, Like the earth, He founded it to the age.";
dby[69] = "And he built his sanctuary like the heights, like the earth which he hath founded for ever.";
web[69] = "And he built his sanctuary like high [palaces], like the earth which he hath established for ever.";
hnv[69] = "He built his sanctuary like the heights, Like the eretz which he has established forever.";
vul[69] = "[Vulgate 77:69] et aedificavit in similitudinem monoceroton sanctuarium suum quasi terram fundavit illud in saeculum";
kjv[70] = "He chose David also his servant, and took him from the sheepfolds:";
rsv[70] = "He chose David his servant, and took him from the sheepfolds;";
asv[70] = "He chose David also his servant, And took him from the sheepfolds: ";
yng[70] = "And He fixeth on David His servant, And taketh him from the folds of a flock,";
dby[70] = "And he chose David his servant, and took him from the sheepfolds:";
web[70] = "He chose David also his servant, and took him from the sheep-folds:";
hnv[70] = "He also chose David his servant, And took him from the sheepfolds;";
vul[70] = "[Vulgate 77:70] et elegit David servum suum et tulit eum de gregibus ovium sequentem fetas adduxit eum";
kjv[71] = "From following the ewes great with young he brought him to feed Jacob his people, and Israel his inheritance.";
rsv[71] = "from tending the ewes that had young he brought him to be the shepherd of Jacob his people, of Israel his inheritance.";
asv[71] = "From following the ewes that have their young he brought him, To be the shepherd of Jacob his people, and Israel his inheritance. ";
yng[71] = "From behind suckling ones He hath brought him in, To rule over Jacob His people, And over Israel His inheritance.";
dby[71] = "From following the suckling-ewes, he brought him to feed Jacob his people, and Israel his inheritance.";
web[71] = "From following the ewes great with young he brought him to feed Jacob his people, and Israel his inheritance.";
hnv[71] = "From following the ewes that have their young, He brought him to be the shepherd of Ya`akov, his people, And Yisra\'el, his inheritance.";
vul[71] = "[Vulgate 77:71] ut pasceret Iacob populum eius et Israhel hereditatem eius";
kjv[72] = "So he fed them according to the integrity of his heart; and guided them by the skilfulness of his hands.";
rsv[72] = "With upright heart he tended them, and guided them with skilful hand.";
asv[72] = "So he was their shepherd according to the integrity of his heart, And guided them by the skilfulness of his hands. ";
yng[72] = "And he ruleth them according to the integrity of his heart, And by the skilfulness of his hands leadeth them!";
dby[72] = "And he fed them according to the integrity of his heart, and led them by the skilfulness of his hands.";
web[72] = "So he fed them according to the integrity of his heart; and guided them by the skillfulness of his hands.";
hnv[72] = "So he was their shepherd according to the integrity of his heart, And guided them by the skillfulness of his hands. ";
vul[72] = "[Vulgate 77:72] qui pavit eos in simplicitate cordis sui et in prudentia manuum suarum dux eorum fuit";
csb[1] = "My people, hear my instruction; listen to the words from my mouth.";
csb[2] = "I will declare wise sayings; I will speak mysteries from the past --";
csb[3] = "things we have heard and known and that our fathers have passed down to us.";
csb[4] = "We will not hide them from their children, but will tell a future generation the praiseworthy acts of the LORD, his might, and the wondrous works he has performed.";
csb[5] = "He established a testimony in Jacob and set up a law in Israel, which he commanded our fathers to teach to their children";
csb[6] = "so that a future generation -- children yet to be born -- might know. They were to rise and tell their children";
csb[7] = "so that they might put their confidence in God and not forget God\'s works, but keep his commands.";
csb[8] = "Then they would not be like their fathers, a stubborn and rebellious generation, a generation whose heart was not loyal and whose spirit was not faithful to God.";
csb[9] = "The Ephraimite archers turned back on the day of battle.";
csb[10] = "They did not keep God\'s covenant and refused to live by his law.";
csb[11] = "They forgot what he had done, the wondrous works he had shown them.";
csb[12] = "He worked wonders in the sight of their fathers in the land of Egypt, the territory of Zoan.";
csb[13] = "He split the sea and brought them across; the water stood firm like a wall.";
csb[14] = "He led them with a cloud by day and with a fiery light throughout the night.";
csb[15] = "He split rocks in the wilderness and gave them drink as abundant as the depths.";
csb[16] = "He brought streams out of the stone and made water flow down like rivers.";
csb[17] = "But they continued to sin against him, rebelling in the desert against the Most High.";
csb[18] = "They deliberately tested God, demanding the food they craved.";
csb[19] = "They spoke against God, saying, &quot;Is God able to provide food in the wilderness?";
csb[20] = "&quot;Look! He struck the rock and water gushed out; torrents overflowed. But can he also provide bread or furnish meat for his people? &quot;";
csb[21] = "Therefore, the LORD heard and became furious; then fire broke out against Jacob, and anger flared up against Israel";
csb[22] = "because they did not believe God or rely on his salvation.";
csb[23] = "He gave a command to the clouds above and opened the doors of heaven.";
csb[24] = "He rained manna for them to eat; he gave them grain from heaven.";
csb[25] = "People ate the bread of angels. He sent them an abundant supply of food.";
csb[26] = "He made the east wind blow in the skies and drove the south wind by his might.";
csb[27] = "He rained meat on them like dust, and winged birds like the sand of the seas.";
csb[28] = "He made them fall in the camp, all around the tents.";
csb[29] = "The people ate and were completely satisfied, for he gave them what they craved.";
csb[30] = "Before they had turned from what they craved, while the food was still in their mouths,";
csb[31] = "God\'s anger flared up against them, and he killed some of their best men. He struck down Israel\'s fit young men.";
csb[32] = "Despite all this, they kept sinning and did not believe his wondrous works.";
csb[33] = "He made their days end in futility, their years in sudden disaster.";
csb[34] = "When he killed some of them, the rest began to seek him; they repented and searched for God.";
csb[35] = "They remembered that God was their rock, the Most High God, their Redeemer.";
csb[36] = "But they deceived him with their mouths, they lied to him with their tongues,";
csb[37] = "their hearts were insincere toward him, and they were unfaithful to his covenant.";
csb[38] = "Yet he was compassionate; he atoned for their iniquity and did not destroy them. He often turned his anger aside and did not unleash all his wrath.";
csb[39] = "He remembered that they were only flesh, a wind that passes and does not return.";
csb[40] = "How often they rebelled against him in the wilderness and grieved him in the desert.";
csb[41] = "They constantly tested God and provoked the Holy One of Israel.";
csb[42] = "They did not remember his power shown on the day he redeemed them from the foe,";
csb[43] = "when he performed his miraculous signs in Egypt and his wonders in the territory of Zoan.";
csb[44] = "He turned their rivers into blood, and they could not drink from their streams.";
csb[45] = "He sent among them swarms of flies, which fed on them, and frogs, which devastated them.";
csb[46] = "He gave their crops to the caterpillar and the fruit of their labor to the locust.";
csb[47] = "He killed their vines with hail and their sycamore fig trees with a flood.";
csb[48] = "He handed over their livestock to hail and their cattle to lightning bolts.";
csb[49] = "He sent his burning anger against them: fury, indignation, and calamity -- a band of deadly messengers.";
csb[50] = "He cleared a path for his anger. He did not spare them from death but delivered their lives to the plague.";
csb[51] = "He struck all the firstborn in Egypt, the first progeny of the tents of Ham.";
csb[52] = "He led his people out like sheep and guided them like a flock in the wilderness.";
csb[53] = "He led them safely, and they were not afraid; but the sea covered their enemies.";
csb[54] = "He brought them to his holy territory, to the mountain his right hand acquired.";
csb[55] = "He drove out nations before them. He apportioned their inheritance by lot and settled the tribes of Israel in their tents.";
csb[56] = "But they rebelliously tested the Most High God, for they did not keep his decrees.";
csb[57] = "They treacherously turned away like their fathers; they became warped like a faulty bow.";
csb[58] = "They enraged him with their high places and provoked his jealousy with their carved images.";
csb[59] = "God heard and became furious; he completely rejected Israel.";
csb[60] = "He abandoned the tabernacle at Shiloh, the tent where he resided among mankind.";
csb[61] = "He gave up his strength to captivity and his splendor to the hand of a foe.";
csb[62] = "He surrendered his people to the sword because he was enraged with his heritage.";
csb[63] = "Fire consumed his chosen young men, and his young women had no wedding songs.";
csb[64] = "His priests fell by the sword, and the widows could not lament.";
csb[65] = "The Lord awoke as if from sleep, like a warrior from the effects of wine.";
csb[66] = "He beat back his foes; he gave them lasting disgrace.";
csb[67] = "He rejected the tent of Joseph and did not choose the tribe of Ephraim.";
csb[68] = "He chose instead the tribe of Judah, Mount Zion, which he loved.";
csb[69] = "He built his sanctuary like the heights, like the earth that he established forever.";
csb[70] = "He chose David his servant and took him from the sheep pens;";
csb[71] = "he brought him from tending ewes to be shepherd over his people Jacob -- over Israel, his inheritance.";
csb[72] = "He shepherded them with a pure heart and guided them with his skillful hands.";
</script>
