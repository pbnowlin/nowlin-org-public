kjv[1] = "[[To the chief Musician, to Jeduthun, A Psalm of David.]] Truly my soul waiteth upon God: from him [cometh] my salvation.";

dby[1] = "{To the chief Musician. On Jeduthun. A Psalm of David.} Upon God alone doth my soul rest peacefully; from him is my salvation.";

dby[2] = "He only is my rock and my salvation; my high fortress: I shall not be greatly moved.";
web[2] = "He only [is] my rock and my salvation; [he is] my defense; I shall not be greatly moved.";
hnv[2] = "He alone is my rock and my yeshu`ah, my fortress -- I will never be greatly shaken.";
vul[2] = "[Vulgate 61:3] attamen ipse est scutum meum et salus mea fortitudo mea non commovebor amplius";
kjv[3] = "How long will ye imagine mischief against a man? ye shall be slain all of you: as a bowing wall [shall ye be, and as] a tottering fence.";
rsv[3] = "How long will you set upon a man to shatter him, all of you, like a leaning wall, a tottering fence?";
asv[3] = "How long will ye set upon a man, That ye may slay [him], all of you, Like a leaning wall, like a tottering fence? ";
yng[3] = "Till when do ye devise mischief against a man? Ye are destroyed all of you, As a wall inclined, a hedge that is cast down.";
dby[3] = "How long will ye assail a man; will ye [seek], all of you, to break him down as a bowing wall or a tottering fence?";
web[3] = "How long will ye imagine mischief against a man? ye shall be slain all of you: as a bowing wall [shall ye be], [and as] a tottering fence.";

kjv[4] = "They only consult to cast [him] down from his excellency: they delight in lies: they bless with their mouth, but they curse inwardly. Selah.";
rsv[4] = "They only plan to thrust him down from his eminence. They take pleasure in falsehood. They bless with their mouths, but inwardly they curse. [Selah]";
asv[4] = "They only consult to thrust him down from his dignity; They delight in lies; They bless with their mouth, but they curse inwardly. [Selah";
yng[4] = "Only -- from his excellency They have consulted to drive away, They enjoy a lie, with their mouth they bless, And with their heart revile. Selah.";
dby[4] = "They only consult to thrust [him] down from his excellency; they delight in lies; they bless with their mouth, but in their inward part they curse. Selah.";
web[4] = "They only consult to cast [him] down from his excellence: they delight in lies: they bless with their mouth, but they curse inwardly. Selah.";
hnv[4] = "They fully intend to throw him down from his lofty place. They delight in lies. They bless with their mouth, but they curse inwardly. Selah.";

hnv[6] = "He alone is my rock and my yeshu`ah, my fortress. I will not be shaken.";

hnv[8] = "Trust in him at all times, you people. Pour out your heart before him. God is a refuge for us. Selah.";

csb[1] = "I am at rest in God alone; my salvation comes from him.";

csb[6] = "He alone is my rock and my salvation, my stronghold; I will not be shaken.";
csb[7] = "My salvation and glory depend on God, my strong rock. My refuge is in God.";
csb[8] = "Trust in him at all times, you people; pour out your hearts before him. God is our refuge. Selah";
csb[9] = "Common people are only a vapor; important people, an illusion. Together on a scale, they weigh less than a vapor.";
csb[10] = "Place no trust in oppression, or false hope in robbery. If wealth increases, don\'t set your heart on it.";
csb[11] = "God has spoken once; I have heard this twice: strength belongs to God,";
csb[12] = "and faithful love belongs to you, LORD. For you repay each according to his works.";
