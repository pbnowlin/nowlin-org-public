rsv[1] = "To the choirmaster: according to Shushan Eduth. A Miktam of David; for instruction; when he strove with Aram-naharaim and with Aram-zobah, and when Joab on his return killed twelve thousand of Edom in the Valley of Salt. O God, thou hast rejected us, broken our defenses; thou hast been angry; oh, restore us.";
asv[1] = "For the Chief Musician; [set to] Shushan Eduth. Michtam of David, to teach; when he strove with Aram-naharaim and with Aram-zobah, and Joab returned, and smote of Edom in the Valley of Salt twelve thousand. O God thou hast cast us off, thou hast broken us down; Thou hast been angry; oh restore us again. ";
yng[1] = "To the Overseer. -- `Concerning the Lily of Testimony,\' a secret treasure of David, to teach, in his striving with Aram-Naharaim, and with Aram-Zobah, and Joab turneth back and smiteth Edom in the valley of Salt -- twelve thousand. O God, Thou hadst cast us off, Thou hadst broken us -- hadst been angry! -- Thou dost turn back to us.";
dby[1] = "{To the chief Musician. On Shushan. Testimony. Michtam of David; to teach: when he strove with the Syrians of Mesopotamia, and the Syrians of Zobah, and Joab returned, and smote the Edomites in the valley of salt, twelve thousand.} O God, thou hast cast us off, thou hast scattered us, thou hast been displeased: restore us again.";
web[1] = "To the chief Musician upon Shushan-eduth, Michtam of David, to teach; when he strove with Aram-naharaim and with Aram-zobah, when Joab returned, and smote of Edom in the valley of salt twelve thousand. O God, thou hast cast us off, thou hast scattered us, thou hast been displeased; O turn thyself to us again.";
hnv[1] = "For the Chief Musician. To the tune &quot;The Lily of the Covenant.&quot; A miktam by David, when he fought with Aram-Naharayim and with Aram-Tzovah, and Yo\'av returned, and killed twelve thousand of Edom in the Valley of Salt. God, you have rejected us. You have broken us down. You have been angry. Restore us, again.";
vul[1] = "[Vulgate 59:1] victori pro liliis testimonium humilis et perfecti David ad docendum [Vulgate 59:2] quando pugnavit adversum Syriam Mesopotamiae et adversum Syriam Suba et reversus est Ioab et percussit Edom in valle Salinarum duodecim milia [Vulgate 59:3] Deus proiecisti nos et scidisti iratus convertisti nos";
rsv[2] = "Thou hast made the land to quake, thou hast rent it open; repair its breaches, for it totters.";
asv[2] = "Thou hast made the land to tremble; thou hast rent it: Heal the breaches thereof; for it shaketh. ";
yng[2] = "Thou hast caused the land to tremble, Thou hast broken it, Heal its breaches, for it hath moved.";
dby[2] = "Thou hast made the earth to tremble, thou hast rent it: heal the breaches thereof; for it shaketh.";
web[2] = "Thou hast made the earth to tremble; thou hast broken it: heal its breaches; for it shaketh.";
hnv[2] = "You have made the land tremble. You have torn it. Mend its fractures, For it quakes.";
vul[2] = "[Vulgate 59:4] commovisti terram et disrupisti eam sana contritiones eius quoniam commota est";
rsv[3] = "Thou hast made thy people suffer hard things; thou hast given us wine to drink that made us reel.";
asv[3] = "Thou hast showed thy people hard things: Thou hast made us to drink the wine of staggering. ";
yng[3] = "Thou hast shewn Thy people a hard thing, Thou hast caused us to drink wine of trembling.";
dby[3] = "Thou hast shewn thy people hard things; thou hast made us to drink the wine of bewilderment.";
web[3] = "Thou hast shown thy people hard things: thou hast made us to drink the wine of astonishment.";
hnv[3] = "You have shown your people hard things. You have made us drink the wine that makes us stagger.";
vul[3] = "[Vulgate 59:5] ostendisti populo tuo duritiam potasti nos vino consopiente";
rsv[4] = "Thou hast set up a banner for those who fear thee, to rally to it from the bow. [Selah]";
asv[4] = "Thou hast given a banner to them that fear thee, That it may be displayed because of the truth. [Selah";
yng[4] = "Thou hast given to those fearing thee an ensign. To be lifted up as an ensign Because of truth. Selah.";
dby[4] = "Thou hast given a banner to them that fear thee, that it may be displayed because of the truth, (Selah,)";
web[4] = "Thou hast given a banner to them that fear thee, that it may be displayed because of the truth. Selah.";
hnv[4] = "You have given a banner to those who fear you, That it may be displayed because of the truth. Selah.";
vul[4] = "[Vulgate 59:6] dedisti timentibus te signum ut fugerent a facie arcus semper ut liberentur amici tui";
rsv[5] = "That thy beloved may be delivered, give victory by thy right hand and answer us!";
asv[5] = "That thy beloved may be delivered, Save with thy right hand, and answer us. ";
yng[5] = "That Thy beloved ones may be drawn out, Save [with] Thy right hand, and answer us.";
dby[5] = "That thy beloved ones may be delivered. Save with thy right hand, and answer me.";
web[5] = "That thy beloved may be delivered; save [with] thy right hand, and hear me.";
hnv[5] = "So that your beloved may be delivered, Save with your right hand, and answer us.";
vul[5] = "[Vulgate 59:7] salva dextera tua et exaudi me";
rsv[6] = "God has spoken in his sanctuary: &quot;With exultation I will divide up Shechem and portion out the Vale of Succoth.";
asv[6] = "God hath spoken in his holiness: I will exult; I will divide Shechem, and mete out the valley of Succoth. ";
yng[6] = "God hath spoken in His holiness: I exult -- I apportion Shechem, And the valley of Succoth I measure,";
dby[6] = "God hath spoken in his holiness: I will exult, I will divide Shechem, and mete out the valley of Succoth.";
web[6] = "God hath spoken in his holiness; I will rejoice, I will divide Shechem, and measure out the valley of Succoth.";
hnv[6] = "God has spoken from his sanctuary: &quot;I will triumph. I will divide Shekhem, And measure out the valley of Sukkot.";
vul[6] = "[Vulgate 59:8] Deus locutus est in sanctuario suo laetabor dividam Sicimam et vallem Soccoth dimetiar";
rsv[7] = "Gilead is mine; Manas\'seh is mine; E\'phraim is my helmet; Judah is my scepter.";
asv[7] = "Gilead is mine, and Manasseh is mine; Ephraim also is the defence of my head; Judah is my sceptre. ";
yng[7] = "Mine [is] Gilead, and mine [is] Manasseh, And Ephraim [is] the strength of my head, Judah [is] my lawgiver,";
dby[7] = "Gilead is mine, and Manasseh is mine, and Ephraim is the strength of my head; Judah is my law-giver;";
web[7] = "Gilead [is] mine, and Manasseh [is] mine; Ephraim also [is] the strength of my head; Judah [is] my lawgiver;";
hnv[7] = "Gil`ad is mine, and Menashsheh is mine. Efrayim also is the defense of my head. Yehudah is my scepter.";
vul[7] = "[Vulgate 59:9] meus est Galaad et meus Manasse et Efraim fortitudo capitis mei Iudas legifer meus";
rsv[8] = "Moab is my washbasin; upon Edom I cast my shoe; over Philistia I shout in triumph.&quot;";
asv[8] = "Moab is my washpot; Upon Edom will I cast my shoe: Philistia, shout thou because of me. ";
yng[8] = "Moab [is] my pot for washing, over Edom I cast my shoe, Shout, concerning me, O Philistia.";
dby[8] = "Moab is my wash-pot; upon Edom will I cast my sandal; Philistia, shout aloud because of me.";
web[8] = "Moab [is] my washpot; over Edom will I cast out my shoe: Philistia, triumph thou because of me.";
hnv[8] = "Mo\'av is my wash basin. I will throw my shoe on Edom. I shout in triumph over Peleshet.&quot;";
vul[8] = "[Vulgate 59:10] Moab olla lavacri mei super Idumeam incedam calciamento meo mihi Palestina foederata est";
rsv[9] = "Who will bring me to the fortified city? Who will lead me to Edom?";
asv[9] = "Who will bring me into the strong city? Who hath led me unto Edom? ";
yng[9] = "Who doth bring me [to] a city of bulwarks? Who hath led me unto Edom?";
dby[9] = "Who will bring me into the strong city? who will lead me unto Edom?";
web[9] = "Who will bring me [into] the strong city? who will lead me into Edom?";
hnv[9] = "Who will bring me into the strong city? Who has led me to Edom?";
vul[9] = "[Vulgate 59:11] quis deducet me ad civitatem munitam quis deducet me usque ad Idumeam";
kjv[10] = "That thy beloved may be delivered; save [with] thy right hand, and hear me.";
rsv[10] = "Hast thou not rejected us, O God? Thou dost not go forth, O God, with our armies.";
asv[10] = "Hast not thou, O God, cast us off? And thou goest not forth, O God, with our hosts. ";
yng[10] = "Is it not Thou, O God? hast Thou cast us off? And dost Thou not go forth, O God, with our hosts!";
dby[10] = "[Wilt] not thou, O God, who didst cast us off? and didst not go forth, O God, with our armies?";
web[10] = "[Wilt] thou not, O God, [who] hadst cast us off? and [thou], O God, [who] didst not go out with our armies?";
hnv[10] = "Haven\'t you, God, rejected us? You don\'t go out with our armies, God.";
vul[10] = "[Vulgate 59:12] nonne tu Deus qui proiecisti nos et non egredieris Deus in exercitibus nostris";
kjv[11] = "God hath spoken in his holiness; I will rejoice, I will divide Shechem, and mete out the valley of Succoth.";
rsv[11] = "O grant us help against the foe, for vain is the help of man!";
asv[11] = "Give us help against the adversary; For vain is the help of man. ";
yng[11] = "Give to us help from adversity, And vain [is] the deliverance of man.";
dby[11] = "Give us help from trouble; for vain is man\'s deliverance.";
web[11] = "Give us help from trouble: for vain [is] the help of man.";
hnv[11] = "Give us help against the adversary, For the help of man is vain.";
vul[11] = "[Vulgate 59:13] da nobis auxilium in tribulatione vana est enim salus ab homine";
kjv[12] = "Gilead [is] mine, and Manasseh [is] mine; Ephraim also [is] the strength of mine head; Judah [is] my lawgiver;";
rsv[12] = "With God we shall do valiantly; it is he who will tread down our foes.";
asv[12] = "Through God we shall do valiantly; For he it is that will tread down our adversaries. ";
yng[12] = "In God we do mightily, And He treadeth down our adversaries!";
dby[12] = "Through God we shall do valiantly; and he it is that will tread down our adversaries.";
web[12] = "Through God we shall do valiantly: for he will tread down our enemies.";
hnv[12] = "Through God we shall do valiantly, For it is he who will tread down our adversaries. ";
vul[12] = "[Vulgate 59:14] in Deo faciemus virtutem et ipse conculcabit tribulantes nos";
csb[1] = "God, you have rejected us; you have broken us down; you have been angry. Restore us!";
csb[2] = "You have shaken the land and split it open. Heal its fissures, for it shudders.";
csb[3] = "You have made your people suffer hardship; you have given us wine to drink that made us stagger.";
csb[4] = "You have given a signal flag to those who fear you, so that they can flee before the archers. Selah";
csb[5] = "Save with your right hand, and answer me, so that those you love may be rescued.";
csb[6] = "God has spoken in his sanctuary: &quot;I will celebrate! I will divide up Shechem. I will apportion the Valley of Succoth.";
csb[7] = "&quot;Gilead is mine, Manasseh is mine, and Ephraim is my helmet; Judah is my scepter.";
csb[8] = "&quot;Moab is my washbasin. I throw my sandal on Edom; I shout in triumph over Philistia.&quot;";
csb[9] = "Who will bring me to the fortified city? Who will lead me to Edom?";
csb[10] = "God, haven\'t you rejected us? God, you do not march out with our armies.";
csb[11] = "Give us aid against the foe, for human help is worthless.";
csb[12] = "With God we will perform valiantly; he will trample our foes.";
kjv[1] = "[[To the chief Musician upon Shushaneduth, Michtam of David, to teach; when he strove with Aramnaharaim and with Aramzobah, when Joab returned, and smote of Edom in the valley of salt twelve thousand.]] O God, thou hast cast us off, thou hast scattered us, thou hast been displeased; O turn thyself to us again.";

kjv[4] = "Thou hast given a banner to them that fear thee, that it may be displayed because of the truth. Selah.";
kjv[5] = "That thy beloved may be delivered; save [with] thy right hand, and hear me.";
kjv[6] = "God hath spoken in his holiness; I will rejoice, I will divide Shechem, and mete out the valley of Succoth.";
kjv[7] = "Gilead [is] mine, and Manasseh [is] mine; Ephraim also [is] the strength of mine head; Judah [is] my lawgiver;";
kjv[8] = "Moab [is] my washpot; over Edom will I cast out my shoe: Philistia, triumph thou because of me.";
kjv[9] = "Who will bring me [into] the strong city? who will lead me into Edom?";
kjv[10] = "[Wilt] not thou, O God, [which] hadst cast us off? and [thou], O God, [which] didst not go out with our armies?";
kjv[11] = "Give us help from trouble: for vain [is] the help of man.";
kjv[12] = "Through God we shall do valiantly: for he [it is that] shall tread down our enemies.";
