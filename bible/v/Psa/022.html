yng[29] = "And the fat ones of earth have eaten, And they bow themselves, Before Him bow do all going down to dust, And he [who] hath not revived his soul.";
dby[29] = "All the fat ones of the earth shall eat and worship; all they that go down to the dust shall bow before him, and he that cannot keep alive his own soul.";
web[29] = "All [they that are] fat upon earth shall eat and worship: all they that go down to the dust shall bow before him: and none can keep alive his own soul.";
hnv[29] = "All the rich ones of the eretz shall eat and worship. All those who go down to the dust shall bow before him, Even he who can\'t keep his soul alive.";
vul[29] = "[Vulgate 21:30] comederunt et adoraverunt omnes pingues terrae ante faciem eius curvabunt genu universi qui descendunt in pulverem";
kjv[30] = "A seed shall serve him; it shall be accounted to the Lord for a generation.";
rsv[30] = "Posterity shall serve him; men shall tell of the Lord to the coming generation,";
asv[30] = "A seed shall serve him; It shall be told of the Lord unto the [next] generation. ";
yng[30] = "A seed doth serve Him, It is declared of the Lord to the generation.";
dby[30] = "A seed shall serve him; it shall be accounted to the Lord for a generation.";
web[30] = "A seed shall serve him; it shall be accounted to the Lord for a generation.";
hnv[30] = "Posterity shall serve him. Future generations shall be told about the Lord.";
vul[30] = "[Vulgate 21:31] et anima eius ipsi vivet semen serviet ei";
kjv[31] = "They shall come, and shall declare his righteousness unto a people that shall be born, that he hath done [this].";
rsv[31] = "and proclaim his deliverance to a people yet unborn, that he has wrought it.";
asv[31] = "They shall come and shall declare his righteousness Unto a people that shall be born, that he hath done it. ";
yng[31] = "They come and declare His righteousness, To a people that is borne, that He hath made!";
dby[31] = "They shall come, and shall declare his righteousness unto a people that shall be born, that he hath done [it].";
web[31] = "They shall come, and shall declare his righteousness to a people that shall be born, that he hath done [this].";
hnv[31] = "They shall come and shall declare his righteousness to a people that shall be born, For he has done it. ";
vul[31] = "[Vulgate 21:32] narrabitur Domino in generatione venient et adnuntiabunt iustitias eius populo qui nascetur quas fecit";
csb[1] = "My God, my God, why have you abandoned me? Why are you so far from my deliverance and from my words of groaning?";
csb[2] = "My God, I cry by day, but you do not answer, by night, yet I have no rest.";
csb[3] = "But you are holy, enthroned on the praises of Israel.";
csb[4] = "Our fathers trusted in you; they trusted, and you rescued them.";
csb[5] = "They cried to you and were set free; they trusted in you and were not disgraced.";
csb[6] = "But I am a worm and not a man, scorned by mankind and despised by people.";
csb[7] = "Everyone who sees me mocks me; they sneer and shake their heads:";
csb[8] = "&quot;He relies on the LORD; let him save him; let the LORD  rescue him, since he takes pleasure in him.&quot;";
csb[9] = "It was you who brought me out of the womb, making me secure at my mother\'s breast.";
csb[10] = "I was given over to you at birth; you have been my God from my mother\'s womb.";
csb[11] = "Don\'t be far from me, because distress is near and there\'s no one to help.";
csb[12] = "Many bulls surround me; strong ones of Bashan encircle me.";
csb[13] = "They open their mouths against me -- lions, mauling and roaring.";
csb[14] = "I am poured out like water, and all my bones are disjointed; my heart is like wax, melting within me.";
csb[15] = "My strength is dried up like baked clay; my tongue sticks to the roof of my mouth. You put me into the dust of death.";
csb[16] = "For dogs have surrounded me; a gang of evildoers has closed in on me; they pierced my hands and my feet.";
csb[17] = "I can count all my bones; people look and stare at me.";
csb[18] = "They divided my garments among themselves, and they cast lots for my clothing.";
csb[19] = "But you, LORD, don\'t be far away. My strength, come quickly to help me.";
csb[20] = "Rescue my life from the sword, my only life from the power of these dogs.";
csb[21] = "Save me from the lion\'s mouth, from the horns of wild oxen. You answered me!";
csb[22] = "I will proclaim your name to my brothers and sisters; I will praise you in the assembly.";
csb[23] = "You who fear the LORD, praise him! All you descendants of Jacob, honor him! All you descendants of Israel, revere him!";
csb[24] = "For he has not despised or abhorred the torment of the oppressed. He did not hide his face from him but listened when he cried to him for help.";
csb[25] = "I will give praise in the great assembly because of you; I will fulfill my vows before those who fear you.";
csb[26] = "The humble will eat and be satisfied; those who seek the LORD will praise him. May your hearts live forever!";
csb[27] = "All the ends of the earth will remember and turn to the LORD. All the families of the nations will bow down before you,";
csb[28] = "for kingship belongs to the LORD; he rules the nations.";
csb[29] = "All who prosper on earth will eat and bow down; all those who go down to the dust will kneel before him -- even the one who cannot preserve his life.";
csb[30] = "Their descendants will serve him; the next generation will be told about the Lord.";
csb[31] = "They will come and declare his righteousness; to a people yet to be born they will declare what he has done.";
</script>
