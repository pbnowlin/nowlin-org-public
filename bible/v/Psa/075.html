kjv[1] = "[[To the chief Musician, Altaschith, A Psalm [or] Song of Asaph.]] Unto thee, O God, do we give thanks, [unto thee] do we give thanks: for [that] thy name is near thy wondrous works declare.";
rsv[1] = "To the choirmaster: according to Do Not Destroy. A Psalm of Asaph. A Song. We give thanks to thee, O God; we give thanks; we call on thy name and recount thy wondrous deeds.";

dby[1] = "{To the chief Musician. \'Destroy not.\' A Psalm of Asaph: a Song.} Unto thee we give thanks, O God, we give thanks; and thy name is near: thy marvellous works declare it.";
web[1] = "To the chief Musician, Al-taschith, A Psalm [or] Song of Asaph. To thee, O God, do we give thanks, [to thee] do we give thanks: for [that] thy name is near, thy wondrous works declare.";
hnv[1] = "For the Chief Musician. To the tune &quot;Do Not Destroy.&quot; A Psalm by Asaf. A song. We give thanks to you, God, We give thanks, for your Name is near. Men tell about your wondrous works.";
vul[1] = "[Vulgate 74:1] victori ut non disperdas psalmus Asaph cantici [Vulgate 74:2] confitebimur tibi Deus confitebimur et iuxta nomen tuum narrabunt mirabilia tua";
kjv[2] = "When I shall receive the congregation I will judge uprightly.";
rsv[2] = "At the set time which I appoint I will judge with equity.";

web[2] = "When I shall receive the congregation I will judge uprightly.";
hnv[2] = "When I choose the appointed time, I will judge blamelessly.";

web[7] = "But God [is] the judge: he putteth down one, and setteth up another.";

kjv[8] = "For in the hand of the LORD [there is] a cup, and the wine is red; it is full of mixture; and he poureth out of the same: but the dregs thereof, all the wicked of the earth shall wring [them] out, [and] drink [them].";
