rsv[1] = "A Psalm of David. Contend, O LORD, with those who contend with me; fight against those who fight against me!";

yng[1] = "By David. Strive, Jehovah, with my strivers, fight with my fighters,";
dby[1] = "{[A Psalm] of David.} Strive, O Jehovah, with them that strive with me; fight against them that fight against me:";
web[1] = "[A Psalm] of David. Plead [my cause], O LORD, with them that strive with me: fight against them that fight against me.";
hnv[1] = "By David. Contend, LORD, with those who contend with me. Fight against those who fight against me.";

rsv[2] = "Take hold of shield and buckler, and rise for my help!";
asv[2] = "Take hold of shield and buckler, And stand up for my help. ";
yng[2] = "Take hold of shield and buckler, and rise for my help,";
dby[2] = "Take hold of shield and buckler, and stand up for my help;";
web[2] = "Take hold of shield and buckler, and stand up for my help.";
hnv[2] = "Take hold of shield and buckler, And stand up for my help.";
vul[2] = "[Vulgate 34:2] adprehende scutum et hastam et consurge in auxilium meum";
rsv[3] = "Draw the spear and javelin against my pursuers! Say to my soul, &quot;I am your deliverance!&quot;";
asv[3] = "Draw out also the spear, and stop the way against them that pursue me: Say unto my soul, I am thy salvation. ";
yng[3] = "And draw out spear and lance, To meet my pursuers. Say to my soul, `Thy salvation I [am].\'";
dby[3] = "And draw out the spear, and stop [the way] against my pursuers: say unto my soul, I am thy salvation.";
web[3] = "Draw out also the spear, and stop [the way] against them that persecute me: say to my soul, I [am] thy salvation.";
hnv[3] = "Brandish the spear and block those who pursue me. Tell my soul, &quot;I am your yeshu`ah.&quot;";
vul[3] = "[Vulgate 34:3] evagina gladium et praeoccupa ex adverso persequentem me dic animae meae salus tua ego sum";
rsv[4] = "Let them be put to shame and dishonor who seek after my life! Let them be turned back and confounded who devise evil against me!";
asv[4] = "Let them be put to shame and brought to dishonor that seek after my soul: Let them be turned back and confounded that devise my hurt. ";
yng[4] = "They are ashamed and blush, those seeking my soul, Turned backward and confounded, Those devising my evil.";
dby[4] = "Let them be put to shame and confounded that seek after my life; let them be turned backward and brought to confusion that devise my hurt:";
web[4] = "Let them be confounded and put to shame that seek after my soul: let them be turned back and brought to confusion that devise my hurt.";
hnv[4] = "Let those who seek after my soul be disappointed and brought to dishonor. Let those who plot my ruin be turned back and confounded.";
vul[4] = "[Vulgate 34:4] confundantur et revereantur qui quaerunt animam meam convertantur retrorsum et confundantur qui cogitant malum mihi";
rsv[5] = "Let them be like chaff before the wind, with the angel of the LORD driving them on!";
asv[5] = "Let them be as chaff before the wind, And the angel of Jehovah driving [them] on. ";
yng[5] = "They are as chaff before wind, And a messenger of Jehovah driving away.";
dby[5] = "Let them be as chaff before the wind, and let the angel of Jehovah drive [them] away;";
web[5] = "Let them be as chaff before the wind: and let the angel of the LORD chase [them].";
hnv[5] = "Let them be as chaff before the wind, The LORD\'s angel driving them on.";
vul[5] = "[Vulgate 34:5] fiant sicut pulvis ante faciem venti et angelus Domini inpellat";
rsv[6] = "Let their way be dark and slippery, with the angel of the LORD pursuing them!";
asv[6] = "Let their way be dark and slippery, And the angel of Jehovah pursuing them. ";
yng[6] = "Their way is darkness and slipperiness, And a messenger of Jehovah their pursuer.";
dby[6] = "Let their way be dark and slippery, and let the angel of Jehovah pursue them.";
web[6] = "Let their way be dark and slippery: and let the angel of the LORD persecute them.";
hnv[6] = "Let their way be dark and slippery, The LORD\'s angel pursuing them.";
vul[6] = "[Vulgate 34:6] sit via eorum tenebrae et lubricum et angelus Domini persequatur eos";
rsv[7] = "For without cause they hid their net for me; without cause they dug a pit for my life.";
asv[7] = "For without cause have they hid for me their net [in] a pit; Without cause have they digged [a pit] for my soul. ";
yng[7] = "For without cause they hid for me their netpit, Without cause they digged for my soul.";
dby[7] = "For without cause have they hidden for me their net [in] a pit; without cause they have digged [it] for my soul.";
web[7] = "For without cause they have hid for me their net [in] a pit, [which] without cause they have digged for my soul.";
hnv[7] = "For without cause they have hidden their net in a pit for me. Without cause they have dug a pit for my soul.";
vul[7] = "[Vulgate 34:7] quia frustra absconderunt mihi insidias retis sui sine causa foderunt animae meae";
rsv[8] = "Let ruin come upon them unawares! And let the net which they hid ensnare them; let them fall therein to ruin!";
asv[8] = "Let destruction come upon him unawares; And let his net that he hath hid catch himself: With destruction let him fall therein. ";
yng[8] = "Meet him doth desolation -- he knoweth not, And his net that he hid catcheth him, For desolation he falleth into it.";
dby[8] = "Let destruction come upon him unawares, and let his net which he hath hidden catch himself: for destruction let him fall therein.";
web[8] = "Let destruction come upon him at unawares; and let his net that he hath hid catch himself: into that very destruction let him fall.";
hnv[8] = "Let destruction come on him unawares. Let his net that he has hidden catch himself. Let him fall into that destruction.";
vul[8] = "[Vulgate 34:8] veniat ei calamitas quam ignorat et rete suum quod abscondit conprehendat eum et cadat in laqueum";

asv[9] = "And my soul shall be joyful in Jehovah: It shall rejoice in his salvation. ";
yng[9] = "And my soul is joyful in Jehovah, It rejoiceth in His salvation.";
dby[9] = "And my soul shall be joyful in Jehovah; it shall rejoice in his salvation.";
web[9] = "And my soul shall be joyful in the LORD: it shall rejoice in his salvation.";
hnv[9] = "My soul shall be joyful in the LORD. It shall rejoice in his yeshu`ah.";
vul[9] = "[Vulgate 34:9] anima autem mea exultabit in Domino et laetabitur in salute sua";
kjv[10] = "Let them not say in their hearts, Ah, so would we have it: let them not say, We have swallowed him up.";
rsv[10] = "All my bones shall say, &quot;O LORD, who is like thee, thou who deliverest the weak from him who is too strong for him, the weak and needy from him who despoils him?&quot;";
asv[10] = "All my bones shall say, Jehovah, who is like unto thee, Who deliverest the poor from him that is too strong for him, Yea, the poor and the needy from him that robbeth him? ";
yng[10] = "All my bones say, `Jehovah, who is like Thee, Delivering the poor from the stronger than he, And the poor and needy from his plunderer.\'";
dby[10] = "All my bones shall say, Jehovah, who is like unto thee, who deliverest the afflicted from one stronger than he, yea, the afflicted and the needy from him that spoileth him!";
web[10] = "All my bones shall say, LORD, who [is] like thee, who deliverest the poor from him that is too strong for him, even the poor and the needy from him that spoileth him?";
hnv[10] = "All my bones shall say, &quot;LORD, who is like you, Who delivers the poor from him who is too strong for him, Yes, the poor and the needy from him who robs him?&quot;";
vul[10] = "[Vulgate 34:10] omnia ossa mea dicent Domine quis similis tui eruens inopem a validiore et pauperem et mendicum a violento";
kjv[11] = "Let them be ashamed and brought to confusion together that rejoice at mine hurt: let them be clothed with shame and dishonour that magnify [themselves] against me.";
rsv[11] = "Malicious witnesses rise up; they ask me of things that I know not.";
asv[11] = "Unrighteous witnesses rise up; They ask me of things that I know not. ";
yng[11] = "Violent witnesses rise up, That which I have not known they ask me.";
dby[11] = "Unrighteous witnesses rise up; they lay to my charge things which I know not.";
web[11] = "False witnesses arose; they laid to my charge [things] that I knew not.";
hnv[11] = "Unrighteous witnesses rise up. They ask me about things that I don\'t know about.";
vul[11] = "[Vulgate 34:11] surgentes testes iniqui quae nesciebam interrogabant me";
kjv[12] = "Let them shout for joy, and be glad, that favour my righteous cause: yea, let them say continually, Let the LORD be magnified, which hath pleasure in the prosperity of his servant.";
rsv[12] = "They requite me evil for good; my soul is forlorn.";
asv[12] = "They reward me evil for good, [To] the bereaving of my soul. ";
yng[12] = "They pay me evil for good, bereaving my soul,";
dby[12] = "They reward me evil for good, [to] the bereavement of my soul.";
web[12] = "They rewarded me evil for good [to] the spoiling of my soul.";
hnv[12] = "They reward me evil for good, To the bereaving of my soul.";
vul[12] = "[Vulgate 34:12] reddebant mihi mala pro bono sterilitatem animae meae";
kjv[13] = "And my tongue shall speak of thy righteousness [and] of thy praise all the day long.";
rsv[13] = "But I, when they were sick--I wore sackcloth, I afflicted myself with fasting. I prayed with head bowed on my bosom,";

yng[13] = "And I -- in their sickness my clothing [is] sackcloth, I have humbled with fastings my soul, And my prayer unto my bosom returneth.";
dby[13] = "But as for me, when they were sick, my clothing was sackcloth; I chastened my soul with fasting, and my prayer returned into mine own bosom:";
web[13] = "But as for me, when they were sick, my clothing [was] sackcloth: I humbled my soul with fasting; and my prayer returned into my own bosom.";
hnv[13] = "But as for me, when they were sick, my clothing was sackcloth. I afflicted my soul with fasting. My prayer returned into my own bosom.";

kjv[14] = "[[[A Psalm] of David.]] Plead [my cause], O LORD, with them that strive with me: fight against them that fight against me.";
rsv[14] = "as though I grieved for my friend or my brother; I went about as one who laments his mother, bowed down and in mourning.";
asv[14] = "I behaved myself as though it had been my friend or my brother: I bowed down mourning, as one that bewaileth his mother. ";
yng[14] = "As [if] a friend, as [if] my brother, I walked habitually, As a mourner for a mother, Mourning I have bowed down.";
dby[14] = "I behaved myself as though [he had been] a friend, a brother to me; I bowed down in sadness, as one that mourneth [for] a mother.";
web[14] = "I behaved myself as though [he had been] my friend [or] brother: I bowed down heavily, as one that mourneth [for his] mother.";
hnv[14] = "I behaved myself as though it had been my friend or my brother. I bowed down mourning, as one who mourns his mother.";
vul[14] = "[Vulgate 34:14] quasi ad amicum quasi ad fratrem meum sic ambulabam quasi lugens mater tristis incurvabar";
kjv[15] = "Take hold of shield and buckler, and stand up for mine help.";
rsv[15] = "But at my stumbling they gathered in glee, they gathered together against me; cripples whom I knew not slandered me without ceasing;";
asv[15] = "But in mine adversity they rejoiced, and gathered themselves together: The abjects gathered themselves together against me, and I knew [it] not; They did tear me, and ceased not: ";
yng[15] = "And -- in my halting they have rejoiced, And have been gathered together, Gathered against me were the smiters, And I have not known, They have rent, and they have not ceased;";
dby[15] = "But at my halting they rejoiced, and gathered together: the slanderers gathered themselves together against me, and I knew [it] not; they did tear [me], and ceased not:";
web[15] = "But in my adversity they rejoiced, and assembled themselves: [yes], the abjects assembled themselves against me, and I knew [it] not; they did tear [me], and ceased not:";
hnv[15] = "But in my adversity, they rejoiced, and gathered themselves together. The attackers gathered themselves together against me, and I didn\'t know it. They tore at me, and didn\'t cease.";
vul[15] = "[Vulgate 34:15] et in infirmitate mea laetabantur et congregabantur collecti sunt adversum me percutientes et nesciebam";

asv[16] = "Like the profane mockers in feasts, They gnashed upon me with their teeth. ";
yng[16] = "With profane ones, mockers in feasts, Gnashing against me their teeth.";
dby[16] = "With profane jesters for bread, they have gnashed their teeth against me.";
web[16] = "With hypocritical mockers in feasts, they gnashed upon me with their teeth.";
hnv[16] = "Like the profane mockers in feasts, They gnashed their teeth at me.";
vul[16] = "[Vulgate 34:16] scindentes et non tacentes in simulatione verborum fictorum frendebant contra me dentibus suis";
kjv[17] = "Let them be confounded and put to shame that seek after my soul: let them be turned back and brought to confusion that devise my hurt.";
rsv[17] = "How long, O LORD, wilt thou look on? Rescue me from their ravages, my life from the lions!";
asv[17] = "Lord, how long wilt thou look on? Rescue my soul from their destructions, My darling from the lions. ";
yng[17] = "Lord, how long dost thou behold? Keep back my soul from their desolations, From young lions my only one.";
dby[17] = "Lord, how long wilt thou look on? Rescue my soul from their destructions, my only one from the young lions.";
web[17] = "Lord, how long wilt thou look on? rescue my soul from their destructions, my darling from the lions.";
hnv[17] = "Lord, how long will you look on? Rescue my soul from their destruction, My precious life from the lions.";
vul[17] = "[Vulgate 34:17] Domine quanta aspicies converte animam meam a calamitatibus suis a leonibus solitariam meam";
kjv[18] = "Let them be as chaff before the wind: and let the angel of the LORD chase [them].";
rsv[18] = "Then I will thank thee in the great congregation; in the mighty throng I will praise thee.";
asv[18] = "I will give thee thanks in the great assembly: I will praise thee among much people. ";
yng[18] = "I thank Thee in a great assembly, Among a mighty people I praise Thee.";
dby[18] = "I will give thee thanks in the great congregation; I will praise thee among much people.";
web[18] = "I will give thee thanks in the great congregation: I will praise thee among many people.";
hnv[18] = "I will give you thanks in the great assembly. I will praise you among many people.";
vul[18] = "[Vulgate 34:18] confitebor tibi in ecclesia grandi in populo forti laudabo te";
kjv[19] = "Let their way be dark and slippery: and let the angel of the LORD persecute them.";
rsv[19] = "Let not those rejoice over me who are wrongfully my foes, and let not those wink the eye who hate me without cause.";
asv[19] = "Let not them that are mine enemies wrongfully rejoice over me; Neither let them wink with the eye that hate me without a cause. ";
yng[19] = "Mine enemies rejoice not over me [with] falsehood, Those hating me without cause wink the eye.";
dby[19] = "Let not them that are wrongfully mine enemies rejoice over me; let them not wink with the eye that hate me without cause.";
web[19] = "Let not them that are my enemies wrongfully rejoice over me: [neither] let them wink with the eye that hate me without a cause.";
hnv[19] = "Don\'t let those who are my enemies wrongfully rejoice over me; Neither let them wink with the eye who hate me without a cause.";
vul[19] = "[Vulgate 34:19] non laetentur super me inimici mei mendaces odientes me frustra coniventes oculo";
kjv[20] = "For without cause have they hid for me their net [in] a pit, [which] without cause they have digged for my soul.";
rsv[20] = "For they do not speak peace, but against those who are quiet in the land they conceive words of deceit.";
asv[20] = "For they speak not peace; But they devise deceitful words against them that are quiet in the land. ";
yng[20] = "For they speak not peace, And against the quiet of the land, Deceitful words they devise,";
dby[20] = "For they speak not peace; and they devise deceitful words against the quiet in the land.";
web[20] = "For they speak not peace: but they devise deceitful matters against [them that are] quiet in the land.";
hnv[20] = "For they don\'t speak shalom, But they devise deceitful words against those who are quiet in the land.";
vul[20] = "[Vulgate 34:20] non enim pacem loquuntur sed in rapina terrae verba fraudulenta concinnant";
kjv[21] = "Let destruction come upon him at unawares; and let his net that he hath hid catch himself: into that very destruction let him fall.";
rsv[21] = "They open wide their mouths against me; they say, &quot;Aha, Aha! our eyes have seen it!&quot;";
asv[21] = "Yea, they opened their mouth wide against me; They said, Aha, aha, our eye hath seen it. ";
yng[21] = "And they enlarge against me their mouth, They said, `Aha, aha, our eye hath seen.\'";
dby[21] = "And they opened their mouth wide against me; they said, Aha! aha! our eye hath seen [it].";
web[21] = "Yes, they opened their mouth wide against me, [and] said, Aha, aha, our eye hath seen [it].";
hnv[21] = "Yes, they opened their mouth wide against me. They said, &quot;Aha! Aha! Our eye has seen it!&quot;";
vul[21] = "[Vulgate 34:21] et dilataverunt super me os suum dixerunt va va vidit oculus noster";
kjv[22] = "And my soul shall be joyful in the LORD: it shall rejoice in his salvation.";
rsv[22] = "Thou hast seen, O LORD; be not silent! O Lord, be not far from me!";
asv[22] = "Thou hast seen it, O Jehovah; keep not silence: O Lord, be not far from me. ";
yng[22] = "Thou hast seen, O Jehovah, Be not silent, O Lord -- be not far from me,";
dby[22] = "Thou hast seen [it], Jehovah: keep not silence; O Lord, be not far from me.";
web[22] = "[This] thou hast seen, O LORD: keep not silence: O Lord, be not far from me.";
hnv[22] = "You have seen it, LORD. Don\'t keep silent. Lord, don\'t be far from me.";
vul[22] = "[Vulgate 34:22] vidisti Domine ne taceas Domine ne elongeris a me";
kjv[23] = "All my bones shall say, LORD, who [is] like unto thee, which deliverest the poor from him that is too strong for him, yea, the poor and the needy from him that spoileth him?";
rsv[23] = "Bestir thyself, and awake for my right, for my cause, my God and my Lord!";
asv[23] = "Stir up thyself, and awake to the justice [due] unto me, [Even] unto my cause, my God and my Lord. ";
yng[23] = "Stir up, and wake to my judgment, My God, and my Lord, to my plea.";
dby[23] = "Stir up thyself, and awake for my right, for my cause, my God and Lord!";
web[23] = "Stir up thyself, and awake to my judgment, [even] to my cause, my God and my Lord.";
hnv[23] = "Wake up! Rise up to defend me, my God! My Lord, contend for me!";
vul[23] = "[Vulgate 34:23] consurge et evigila in iudicium meum Deus meus et Domine in causam meam";
kjv[24] = "False witnesses did rise up; they laid to my charge [things] that I knew not.";
rsv[24] = "Vindicate me, O LORD, my God, according to thy righteousness; and let them not rejoice over me!";
asv[24] = "Judge me, O Jehovah my God, according to thy righteousness; And let them not rejoice over me. ";
yng[24] = "Judge me according to Thy righteousness, O Jehovah my God, And they do not rejoice over me.";
dby[24] = "Judge me, Jehovah my God, according to thy righteousness, and let them not rejoice over me.";
web[24] = "Judge me, O LORD my God, according to thy righteousness; and let them not rejoice over me.";
hnv[24] = "Vindicate me, LORD my God, according to your righteousness; Don\'t let them gloat over me.";
vul[24] = "[Vulgate 34:24] iudica me secundum iustitiam meam Domine Deus meus et ne insultent mihi";
kjv[25] = "They rewarded me evil for good [to] the spoiling of my soul.";
rsv[25] = "Let them not say to themselves, &quot;Aha, we have our heart\'s desire!&quot; Let them not say, &quot;We have swallowed him up.&quot;";
asv[25] = "Let them not say in their heart, Aha, so would we have it: Let them not say, We have swallowed him up. ";
yng[25] = "They do not say in their heart, `Aha, our desire.\' They do not say, `We swallowed him up.\'";
dby[25] = "Let them not say in their heart, Aha! so would we have it. Let them not say, We have swallowed him up.";
web[25] = "Let them not say in their hearts, Ah, so would we have it: let them not say, We have swallowed him up.";
hnv[25] = "Don\'t let them say in their heart, &quot;Aha! That\'s the way we want it!&quot; Don\'t let them say, &quot;We have swallowed him up!&quot;";
vul[25] = "[Vulgate 34:25] ne dicant in corde suo va va va animae nostrae ne dicant absorbuimus eum";
kjv[26] = "But as for me, when they were sick, my clothing [was] sackcloth: I humbled my soul with fasting; and my prayer returned into mine own bosom.";
rsv[26] = "Let them be put to shame and confusion altogether who rejoice at my calamity! Let them be clothed with shame and dishonor who magnify themselves against me!";
asv[26] = "Let them be put to shame and confounded together that rejoice at my hurt: Let them be clothed with shame and dishonor that magnify themselves against me. ";
yng[26] = "They are ashamed and confounded together, Who are rejoicing at my evil. They put on shame and confusion, Who are magnifying themselves against me.";
dby[26] = "Let them be ashamed and brought to confusion together that rejoice at mine adversity; let them be clothed with shame and dishonour that magnify themselves against me.";
web[26] = "Let them be ashamed and brought to confusion together that rejoice at my hurt: let them be clothed with shame and dishonor that magnify [themselves] against me.";
hnv[26] = "Let them be disappointed and confounded together who rejoice at my calamity. Let them be clothed with shame and dishonor who magnify themselves against me.";
vul[26] = "[Vulgate 34:26] confundantur et revereantur pariter qui laetantur in adflictione mea induantur confusione et verecundia qui magnificantur super me";
kjv[27] = "I behaved myself as though [he had been] my friend [or] brother: I bowed down heavily, as one that mourneth [for his] mother.";
rsv[27] = "Let those who desire my vindication shout for joy and be glad, and say evermore, &quot;Great is the LORD, who delights in the welfare of his servant!&quot;";
asv[27] = "Let them shout for joy, and be glad, that favor my righteous cause: Yea, let them say continually, Jehovah be magnified, Who hath pleasure in the prosperity of his servant. ";
yng[27] = "They sing and rejoice, who are desiring my righteousness, And they say continually, `Jehovah is magnified, Who is desiring the peace of His servant.\'";
dby[27] = "Let them exult and rejoice that delight in my righteousness; and let them say continually, Jehovah be magnified, who delighteth in the prosperity of his servant.";
web[27] = "Let them shout for joy, and be glad, that favor my righteous cause: yes, let them say continually, Let the LORD be magnified, who hath pleasure in the prosperity of his servant.";
hnv[27] = "Let them shout for joy and be glad, who favor my righteous cause. Yes, let them say continually, &quot;The LORD be magnified, Who has pleasure in the prosperity of his servant!&quot;";
vul[27] = "[Vulgate 34:27] laudent et laetentur qui volunt iustitiam meam et dicant semper magnificetur Dominus qui vult pacem servi sui";
kjv[28] = "But in mine adversity they rejoiced, and gathered themselves together: [yea], the abjects gathered themselves together against me, and I knew [it] not; they did tear [me], and ceased not:";
rsv[28] = "Then my tongue shall tell of thy righteousness and of thy praise all the day long.";
asv[28] = "And my tongue shall talk of thy righteousness [And] of thy praise all the day long. ";
yng[28] = "And my tongue uttereth Thy righteousness, All the day Thy praise!";
dby[28] = "And my tongue shall talk of thy righteousness, [and] of thy praise, all the day.";
web[28] = "And my tongue shall speak of thy righteousness [and] of thy praise all the day long.";
hnv[28] = "My tongue shall talk about your righteousness and about your praise all day long. ";
vul[28] = "[Vulgate 34:28] et lingua mea meditabitur iustitiam tuam tota die laudem tuam";
csb[1] = "Oppose my opponents, LORD; fight those who fight me.";
csb[2] = "Take your shields -- large and small -- and come to my aid.";
csb[3] = "Draw the spear and javelin against my pursuers, and assure me: &quot;I am your deliverance.&quot;";
csb[4] = "Let those who intend to take my life be disgraced and humiliated; let those who plan to harm me be turned back and ashamed.";
csb[5] = "Let them be like chaff in the wind, with the angel of the LORD driving them away.";
csb[6] = "Let their way be dark and slippery, with the angel of the LORD pursuing them.";
csb[7] = "They hid their net for me without cause; they dug a pit for me without cause.";
csb[8] = "Let ruin come on him unexpectedly, and let the net that he hid ensnare him; let him fall into it -- to his ruin.";
csb[9] = "Then I will rejoice in the LORD; I will delight in his deliverance.";
csb[10] = "All my bones will say, &quot;LORD, who is like you, rescuing the poor from one too strong for him, the poor or the needy from one who robs him? &quot;";
csb[11] = "Malicious witnesses come forward; they question me about things I do not know.";
csb[12] = "They repay me evil for good, making me desolate.";
csb[13] = "Yet when they were sick, my clothing was sackcloth; I humbled myself with fasting, and my prayer was genuine.";
csb[14] = "I went about mourning as if for my friend or brother; I was bowed down with grief, like one mourning for a mother.";
csb[15] = "But when I stumbled, they gathered in glee; they gathered against me. Assailants I did not know tore at me and did not stop.";
csb[16] = "With godless mockery they gnashed their teeth at me.";
csb[17] = "Lord, how long will you look on? Rescue me from their ravages; rescue my precious life from the young lions.";
csb[18] = "I will praise you in the great assembly; I will exalt you among many people.";
csb[19] = "Do not let my deceitful enemies rejoice over me; do not let those who hate me without cause wink at me maliciously.";
csb[20] = "For they do not speak in friendly ways, but contrive fraudulent schemes against those who live peacefully in the land.";
csb[21] = "They open their mouths wide against me and say, &quot;Aha, aha! We saw it! &quot;";
csb[22] = "You saw it, LORD; do not be silent. Lord, do not be far from me.";
csb[23] = "Wake up and rise to my defense, to my cause, my God and my Lord!";
csb[24] = "Vindicate me, LORD my God, in keeping with your righteousness, and do not let them rejoice over me.";
csb[25] = "Do not let them say in their hearts, &quot;Aha! Just what we wanted.&quot; Do not let them say, &quot;We have swallowed him up! &quot;";
csb[26] = "Let those who rejoice at my misfortune be disgraced and humiliated; let those who exalt themselves over me be clothed with shame and reproach.";
csb[27] = "Let those who want my vindication shout for joy and be glad; let them continually say, &quot;The LORD be exalted. He takes pleasure in his servant\'s well-being.&quot;";
csb[28] = "And my tongue will proclaim your righteousness, your praise all day long.";
kjv[1] = "[[[A Psalm] of David.]] Plead [my cause], O LORD, with them that strive with me: fight against them that fight against me.";
kjv[2] = "Take hold of shield and buckler, and stand up for mine help.";
kjv[3] = "Draw out also the spear, and stop [the way] against them that persecute me: say unto my soul, I [am] thy salvation.";
kjv[4] = "Let them be confounded and put to shame that seek after my soul: let them be turned back and brought to confusion that devise my hurt.";
kjv[5] = "Let them be as chaff before the wind: and let the angel of the LORD chase [them].";
kjv[6] = "Let their way be dark and slippery: and let the angel of the LORD persecute them.";
kjv[7] = "For without cause have they hid for me their net [in] a pit, [which] without cause they have digged for my soul.";
kjv[8] = "Let destruction come upon him at unawares; and let his net that he hath hid catch himself: into that very destruction let him fall.";
kjv[9] = "And my soul shall be joyful in the LORD: it shall rejoice in his salvation.";
kjv[10] = "All my bones shall say, LORD, who [is] like unto thee, which deliverest the poor from him that is too strong for him, yea, the poor and the needy from him that spoileth him?";
kjv[11] = "False witnesses did rise up; they laid to my charge [things] that I knew not.";
kjv[12] = "They rewarded me evil for good [to] the spoiling of my soul.";
kjv[13] = "But as for me, when they were sick, my clothing [was] sackcloth: I humbled my soul with fasting; and my prayer returned into mine own bosom.";
kjv[14] = "I behaved myself as though [he had been] my friend [or] brother: I bowed down heavily, as one that mourneth [for his] mother.";
kjv[15] = "But in mine adversity they rejoiced, and gathered themselves together: [yea], the abjects gathered themselves together against me, and I knew [it] not; they did tear [me], and ceased not:";
kjv[16] = "With hypocritical mockers in feasts, they gnashed upon me with their teeth.";
kjv[17] = "Lord, how long wilt thou look on? rescue my soul from their destructions, my darling from the lions.";
kjv[18] = "I will give thee thanks in the great congregation: I will praise thee among much people.";
kjv[19] = "Let not them that are mine enemies wrongfully rejoice over me: [neither] let them wink with the eye that hate me without a cause.";
kjv[20] = "For they speak not peace: but they devise deceitful matters against [them that are] quiet in the land.";
kjv[21] = "Yea, they opened their mouth wide against me, [and] said, Aha, aha, our eye hath seen [it].";
kjv[22] = "[This] thou hast seen, O LORD: keep not silence: O Lord, be not far from me.";
kjv[23] = "Stir up thyself, and awake to my judgment, [even] unto my cause, my God and my Lord.";
kjv[24] = "Judge me, O LORD my God, according to thy righteousness; and let them not rejoice over me.";
kjv[25] = "Let them not say in their hearts, Ah, so would we have it: let them not say, We have swallowed him up.";
kjv[26] = "Let them be ashamed and brought to confusion together that rejoice at mine hurt: let them be clothed with shame and dishonour that magnify [themselves] against me.";
kjv[27] = "Let them shout for joy, and be glad, that favour my righteous cause: yea, let them say continually, Let the LORD be magnified, which hath pleasure in the prosperity of his servant.";
kjv[28] = "And my tongue shall speak of thy righteousness [and] of thy praise all the day long.";</script>
