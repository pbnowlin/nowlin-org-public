kjv[1] = "[[To the chief Musician, A Psalm of David.]] Blessed [is] he that considereth the poor: the LORD will deliver him in time of trouble.";
rsv[1] = "To the choirmaster. A Psalm of David. Blessed is he who considers the poor! The LORD delivers him in the day of trouble;";

yng[1] = "To the Overseer. -- A Psalm of David. O the happiness of him Who is acting wisely unto the poor, In a day of evil doth Jehovah deliver him.";
dby[1] = "{To the chief Musician. A Psalm of David.} Blessed is he that understandeth the poor: Jehovah will deliver him in the day of evil.";

vul[1] = "[Vulgate 40:1] pro victoria canticum David [Vulgate 40:2] beatus qui cogitat de paupere in die mala salvabit eum Dominus";
kjv[2] = "The LORD will preserve him, and keep him alive; [and] he shall be blessed upon the earth: and thou wilt not deliver him unto the will of his enemies.";
rsv[2] = "the LORD protects him and keeps him alive; he is called blessed in the land; thou dost not give him up to the will of his enemies.";
asv[2] = "Jehovah will preserve him, and keep him alive, And he shall be blessed upon the earth; And deliver not thou him unto the will of his enemies. ";
yng[2] = "Jehovah doth preserve him and revive him, He is happy in the land, And Thou givest him not into the will of his enemies.";
dby[2] = "Jehovah will preserve him, and keep him alive; he shall be made happy in the land; and thou wilt not deliver him to the will of his enemies.";
web[2] = "The LORD will preserve him, and keep him alive; [and] he shall be blessed upon the earth: and thou wilt not deliver him to the will of his enemies.";
hnv[2] = "The LORD will preserve him, and keep him alive, He shall be blessed on the eretz, And he will not surrender him to the will of his enemies.";
vul[2] = "[Vulgate 40:3] Dominus custodiet eum et vivificabit eum et beatus erit in terra et non tradet eum animae inimicorum suorum";
kjv[3] = "The LORD will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness.";
rsv[3] = "The LORD sustains him on his sickbed; in his illness thou healest all his infirmities.";
asv[3] = "Jehovah will support him upon the couch of languishing: Thou makest all his bed in his sickness. ";
yng[3] = "Jehovah supporteth on a couch of sickness, All his bed Thou hast turned in his weakness.";
dby[3] = "Jehovah will sustain him upon the bed of languishing: thou turnest all his bed in his sickness.";
web[3] = "The LORD will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness.";
hnv[3] = "The LORD will sustain him on his sickbed, And restore him from his bed of illness.";
vul[3] = "[Vulgate 40:4] Dominus confortabit eum in lecto infirmitatis totum stratum eius vertisti in aegrotatione sua";
kjv[4] = "I said, LORD, be merciful unto me: heal my soul; for I have sinned against thee.";
rsv[4] = "As for me, I said, &quot;O LORD, be gracious to me; heal me, for I have sinned against thee!&quot;";
asv[4] = "I said, O Jehovah, have mercy upon me: Heal my soul; for I have sinned against thee. ";
yng[4] = "I -- I said, `O Jehovah, favour me, Heal my soul, for I did sin against Thee,\'";
dby[4] = "As for me, I said, Jehovah, be gracious unto me: heal my soul; for I have sinned against thee.";
web[4] = "I said, LORD, be merciful to me: heal my soul; for I have sinned against thee.";
hnv[4] = "I said, &quot;LORD, have mercy on me! Heal me, for I have sinned against you.&quot;";
vul[4] = "[Vulgate 40:5] ego dixi Domine miserere mei sana animam meam quoniam peccavi tibi";
kjv[5] = "Mine enemies speak evil of me, When shall he die, and his name perish?";
rsv[5] = "My enemies say of me in malice: &quot;When will he die, and his name perish?&quot;";
asv[5] = "Mine enemies speak evil against me, [saying], When will he die, and his name perish? ";
yng[5] = "Mine enemies say evil of me: When he dieth -- his name hath perished!";
dby[5] = "Mine enemies wish me evil: When will he die, and his name perish?";
web[5] = "My enemies speak evil of me, When shall he die, and his name perish?";
hnv[5] = "My enemies speak evil against me: &quot;When will he die, and his name perish?&quot;";
vul[5] = "[Vulgate 40:6] inimici mei loquentur malum mihi quando morietur et periet nomen eius";
kjv[6] = "And if he come to see [me], he speaketh vanity: his heart gathereth iniquity to itself; [when] he goeth abroad, he telleth [it].";
rsv[6] = "And when one comes to see me, he utters empty words, while his heart gathers mischief; when he goes out, he tells it abroad.";
asv[6] = "And if he come to see [me], he speaketh falsehood; His heart gathereth iniquity to itself: When he goeth abroad, he telleth it. ";
yng[6] = "And if he came to see -- vanity he speaketh, His heart gathereth iniquity to itself, He goeth out -- at the street he speaketh.";
dby[6] = "And if one come to see [me], he speaketh falsehood; his heart gathereth wickedness to itself: he goeth abroad, he telleth [it].";
web[6] = "And if he cometh to see [me], he speaketh vanity: his heart gathereth iniquity to itself; [when] he goeth abroad, he telleth [it].";
hnv[6] = "If he comes to see me, he speaks falsehood. His heart gathers iniquity to itself. When he goes abroad, he tells it.";
vul[6] = "[Vulgate 40:7] et si venerit ut visitet vana loquetur cor eius congregabit iniquitatem sibi et egrediens foras detrahet";
kjv[7] = "All that hate me whisper together against me: against me do they devise my hurt.";
rsv[7] = "All who hate me whisper together about me; they imagine the worst for me.";
asv[7] = "All that hate me whisper together against me; Against me do they devise my hurt. ";
yng[7] = "All hating me whisper together against me, Against me they devise evil to me:";
dby[7] = "All that hate me whisper together against me; against me do they devise my hurt.";
web[7] = "All that hate me whisper together against me: against me do they devise my hurt.";
hnv[7] = "All who hate me whisper together against me. They imagine the worst for me.";
vul[7] = "[Vulgate 40:8] simul adversum me murmurabant omnes odientes me contra cogitabant malum mihi";
kjv[8] = "An evil disease, [say they], cleaveth fast unto him: and [now] that he lieth he shall rise up no more.";
rsv[8] = "They say, &quot;A deadly thing has fastened upon him; he will not rise again from where he lies.&quot;";
asv[8] = "An evil disease, [say they], cleaveth fast unto him; And now that he lieth he shall rise up no more. ";
yng[8] = "A thing of Belial is poured out on him, And because he lay down he riseth not again.";
dby[8] = "A thing of Belial cleaveth fast unto him; and now that he is laid down, he will rise up no more.";
web[8] = "An evil disease, [say they], cleaveth fast to him: and [now] that he lieth he shall rise no more.";
hnv[8] = "&quot;An evil disease,&quot; they say, &quot;has afflicted him. Now that he lies he shall rise up no more.&quot;";
vul[8] = "[Vulgate 40:9] verbum diabuli infundebant sibi qui dormivit non addet ut resurgat";
kjv[9] = "Yea, mine own familiar friend, in whom I trusted, which did eat of my bread, hath lifted up [his] heel against me.";
rsv[9] = "Even my bosom friend in whom I trusted, who ate of my bread, has lifted his heel against me.";
asv[9] = "Yea, mine own familiar friend, in whom I trusted, Who did eat of my bread, Hath lifted up his heel against me. ";
yng[9] = "Even mine ally, in whom I trusted, One eating my bread, made great the heel against me,";
dby[9] = "Yea, mine own familiar friend, in whom I confided, who did eat of my bread, hath lifted up [his] heel against me.";
web[9] = "Yes, my own familiar friend, in whom I trusted, who ate of my bread, hath lifted up [his] heel against me.";
hnv[9] = "Yes, my own familiar friend, in whom I trusted, Who ate bread with me, Has lifted up his heel against me.";
vul[9] = "[Vulgate 40:10] sed et homo pacificus meus in quo habui fiduciam qui manducabat panem meum levavit contra me plantam";
kjv[10] = "But thou, O LORD, be merciful unto me, and raise me up, that I may requite them.";
rsv[10] = "But do thou, O LORD, be gracious to me, and raise me up, that I may requite them!";
asv[10] = "But thou, O Jehovah, have mercy upon me, and raise me up, That I may requite them. ";
yng[10] = "And Thou, Jehovah, favour me, And cause me to rise, And I give recompence to them.";
dby[10] = "But thou, Jehovah, be gracious unto me, and raise me up, that I may requite them.";
web[10] = "But thou, O LORD, be merciful to me, and raise me up, that I may requite them.";
hnv[10] = "But you, LORD, have mercy on me, and raise me up, That I may repay them.";
vul[10] = "[Vulgate 40:11] tu autem Domine miserere mei et leva me ut reddam eis";
kjv[11] = "By this I know that thou favourest me, because mine enemy doth not triumph over me.";
rsv[11] = "By this I know that thou art pleased with me, in that my enemy has not triumphed over me.";
asv[11] = "By this I know that thou delightest in me, Because mine enemy doth not triumph over me. ";
yng[11] = "By this I have known, That Thou hast delighted in me, Because my enemy shouteth not over me.";
dby[11] = "By this I know that thou delightest in me, because mine enemy doth not triumph over me.";
web[11] = "By this I know that thou favorest me, because my enemy doth not triumph over me.";
hnv[11] = "By this I know that you delight in me, Because my enemy doesn\'t triumph over me.";
vul[11] = "[Vulgate 40:12] in hoc cognovi quod velis me quia non insultavit inimicus meus mihi";
kjv[12] = "And as for me, thou upholdest me in mine integrity, and settest me before thy face for ever.";
rsv[12] = "But thou hast upheld me because of my integrity, and set me in thy presence for ever.";
asv[12] = "And as for me, thou upholdest me in mine integrity, And settest me before thy face for ever. ";
yng[12] = "As to me, in mine integrity, Thou hast taken hold upon me, And causest me to stand before Thee to the age.";
dby[12] = "But as for me, thou upholdest me in mine integrity, and settest me before thy face for ever.";
web[12] = "And as for me, thou upholdest me in my integrity, and settest me before thy face for ever.";
hnv[12] = "As for me, you uphold me in my integrity, And set me in your presence forever.";
vul[12] = "[Vulgate 40:13] ego autem in simplicitate mea adiutus sum a te et statues me ante faciem tuam in perpetuum";
kjv[13] = "Blessed [be] the LORD God of Israel from everlasting, and to everlasting. Amen, and Amen.";
rsv[13] = "Blessed be the LORD, the God of Israel, from everlasting to everlasting! Amen and Amen.";
asv[13] = "Blessed be Jehovah, the God of Israel, From everlasting and to everlasting. Amen, and Amen. ";
yng[13] = "Blessed [is] Jehovah, God of Israel, From the age -- and unto the age. Amen and Amen.";
dby[13] = "Blessed be Jehovah, the God of Israel, from eternity to eternity! Amen, and Amen.";
web[13] = "Blessed [be] the LORD God of Israel from everlasting, and to everlasting. Amen, and amen.";
hnv[13] = "Blessed be the LORD, the God of Yisra\'el, From everlasting and to everlasting! Amein and amein. ";
vul[13] = "[Vulgate 40:14] benedictus Dominus Deus Israhel a saeculo et usque in saeculum amen amen";
csb[1] = "Happy is one who is considerate of the poor; the LORD will save him in a day of adversity.";
csb[2] = "The LORD will keep him and preserve him; he will be blessed in the land. You will not give him over to the desire of his enemies.";
csb[3] = "The LORD will sustain him on his sickbed; you will heal him on the bed where he lies.";
csb[4] = "I said, &quot;LORD, be gracious to me; heal me, for I have sinned against you.&quot;";
csb[5] = "My enemies speak maliciously about me: &quot;When will he die and be forgotten? &quot;";
csb[6] = "When one of them comes to visit, he speaks deceitfully; he stores up evil in his heart; he goes out and talks.";
csb[7] = "All who hate me whisper together about me; they plan to harm me.";
csb[8] = "&quot;Something awful has overwhelmed him, and he won\'t rise again from where he lies! &quot;";
csb[9] = "Even my friend in whom I trusted, one who ate my bread, has raised his heel against me.";
csb[10] = "But you, LORD, be gracious to me and raise me up; then I will repay them.";
csb[11] = "By this I know that you delight in me: my enemy does not shout in triumph over me.";
csb[12] = "You supported me because of my integrity and set me in your presence forever.";
csb[13] = "Blessed be the LORD God of Israel, from everlasting to everlasting. Amen and amen.";
