csb[1] = "The Mighty One, God, the LORD, speaks; he summons the earth from the rising of the sun to its setting.";
csb[2] = "From Zion, the perfection of beauty, God appears in radiance.";
csb[3] = "Our God is coming; he will not be silent! Devouring fire precedes him, and a storm rages around him.";
csb[4] = "On high, he summons heaven and earth in order to judge his people:";
csb[5] = "&quot;Gather my faithful ones to me, those who made a covenant with me by sacrifice.&quot;";
csb[6] = "The heavens proclaim his righteousness, for God is the Judge. Selah";
csb[7] = "&quot;Listen, my people, and I will speak; I will testify against you, Israel. I am God, your God.";
csb[8] = "&quot;I do not rebuke you for your sacrifices or for your burnt offerings, which are continually before me.";
csb[9] = "&quot;I will not take a bull from your household or male goats from your pens,";
csb[10] = "&quot;for every animal of the forest is mine, the cattle on a thousand hills.";
csb[11] = "&quot;I know every bird of the mountains, and the creatures of the field are mine.";
csb[12] = "&quot;If I were hungry, I would not tell you, for the world and everything in it is mine.";
csb[13] = "&quot;Do I eat the flesh of bulls or drink the blood of goats?";
csb[14] = "&quot;Sacrifice a thank offering to God, and pay your vows to the Most High.";
csb[15] = "&quot;Call on me in a day of trouble; I will rescue you, and you will honor me.&quot;";
csb[16] = "But God says to the wicked: &quot;What right do you have to recite my statutes and to take my covenant on your lips?";
csb[17] = "&quot;You hate instruction and fling my words behind you.";
csb[18] = "&quot;When you see a thief, you make friends with him, and you associate with adulterers.";
csb[19] = "&quot;You unleash your mouth for evil and harness your tongue for deceit.";
csb[20] = "&quot;You sit, maligning your brother, slandering your mother\'s son.";
csb[21] = "&quot;You have done these things, and I kept silent; you thought I was just like you. But I will rebuke you and lay out the case before you.";
csb[22] = "&quot;Understand this, you who forget God, or I will tear you apart, and there will be no one to rescue you.";
csb[23] = "&quot;Whoever sacrifices a thank offering honors me, and whoever orders his conduct, I will show him the salvation of God.&quot;";
