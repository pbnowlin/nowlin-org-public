rsv[1] = "Why dost thou stand afar off, O LORD? Why dost thou hide thyself in times of trouble?";
asv[1] = "Why standest thou afar off, O Jehovah? Why hidest thou thyself in times of trouble? ";
yng[1] = "Why, Jehovah, dost Thou stand at a distance? Thou dost hide in times of adversity,";
dby[1] = "Why, Jehovah, standest thou afar off? [Why] hidest thou thyself in times of distress?";
web[1] = "Why standest thou afar off, O LORD? [why] hidest thou [thyself] in times of trouble?";
hnv[1] = "Why do you stand far off, LORD? Why do you hide yourself in times of trouble?";
vul[1] = "[Vulgate 9:22] quare Domine stas a longe dispicis in temporibus angustiae";
rsv[2] = "In arrogance the wicked hotly pursue the poor; let them be caught in the schemes which they have devised.";
asv[2] = "In the pride of the wicked the poor is hotly pursued; Let them be taken in the devices that they have conceived. ";
yng[2] = "Through the pride of the wicked, Is the poor inflamed, They are caught in devices that they devised.";
dby[2] = "The wicked, in his pride, doth hotly pursue the afflicted. They shall be taken in the devices that they have imagined.";
web[2] = "The wicked in [his] pride doth persecute the poor: let them be taken in the devices that they have imagined.";
hnv[2] = "In arrogance, the wicked hunt down the weak; They are caught in the schemes that they devise.";
vul[2] = "[Vulgate 9:23] in superbia impii ardet pauper capiantur in sceleribus quae cogitaverunt";
rsv[3] = "For the wicked boasts of the desires of his heart, and the man greedy for gain curses and renounces the LORD.";
asv[3] = "For the wicked boasteth of his heart\'s desire, And the covetous renounceth, [yea], contemneth Jehovah. ";
yng[3] = "Because the wicked hath boasted Of the desire of his soul, And a dishonest gainer he hath blessed, He hath despised Jehovah.";
dby[3] = "For the wicked boasteth of his soul\'s desire, and he blesseth the covetous; he contemneth Jehovah.";
web[3] = "For the wicked boasteth of his heart\'s desire, and blesseth the covetous, [whom] the LORD abhorreth.";
hnv[3] = "For the wicked boasts of his heart\'s cravings, He blesses the greedy, and condemns the LORD.";
vul[3] = "[Vulgate 9:24] quia laudavit impius desiderium animae suae et avarus adplaudens sibi";
rsv[4] = "In the pride of his countenance the wicked does not seek him; all his thoughts are, &quot;There is no God.&quot;";
asv[4] = "The wicked, in the pride of his countenance, [saith], He will not require [it]. All his thoughts are, There is no God. ";
yng[4] = "The wicked according to the height of his face, inquireth not. `God is not!\' [are] all his devices.";
dby[4] = "The wicked [saith], in the haughtiness of his countenance, He doth not search out: all his thoughts are, There is no God!";
web[4] = "The wicked, through the pride of his countenance, will not seek [after God]: God [is] not in all his thoughts.";
hnv[4] = "The wicked, in the pride of his face, Has no room in his thoughts for God.";
vul[4] = "[Vulgate 9:25] blasphemavit Dominum impius secundum altitudinem furoris sui non requiret";
rsv[5] = "His ways prosper at all times; thy judgments are on high, out of his sight; as for all his foes, he puffs at them.";
asv[5] = "His ways are firm at all times; Thy judgments are far above out of his sight: As for all his adversaries, he puffeth at them. ";
yng[5] = "Pain do his ways at all times, On high [are] Thy judgments before him, All his adversaries -- he puffeth at them.";
dby[5] = "His ways always succeed; thy judgments are far above out of his sight; [as for] all his adversaries, he puffeth at them.";
web[5] = "His ways are always grievous; thy judgments [are] far above out of his sight: [as for] all his enemies, he puffeth at them.";
hnv[5] = "His ways are prosperous at all times; He is haughty, and your laws are far from his sight: As for all his adversaries, he sneers at them.";
vul[5] = "[Vulgate 9:26] nec est Deus in omnibus cogitationibus eius parturiunt viae eius in omni tempore longe sunt iudicia tua a facie eius omnes inimicos suos dispicit";
rsv[6] = "He thinks in his heart, &quot;I shall not be moved; throughout all generations I shall not meet adversity.&quot;";
asv[6] = "He saith in his heart, I shall not be moved; To all generations I shall not be in adversity. ";
yng[6] = "He hath said in his heart, `I am not moved,\' To generation and generation not in evil.";
dby[6] = "He saith in his heart, I shall not be moved; from generation to generation I shall be in no adversity.";
web[6] = "He hath said in his heart, I shall not be moved: for [I shall] never [be] in adversity.";
hnv[6] = "He says in his heart, &quot;I shall not be shaken; For generations I shall have no trouble.&quot;";
vul[6] = "[Vulgate 9:27] loquitur in corde suo non movebor in generatione et generatione ero sine malo";
rsv[7] = "His mouth is filled with cursing and deceit and oppression; under his tongue are mischief and iniquity.";
asv[7] = "His mouth is full of cursing and deceit and oppression: Under his tongue is mischief and iniquity. ";
yng[7] = "Of oaths his mouth is full, And deceits, and fraud: Under his tongue [is] perverseness and iniquity,";
dby[7] = "His mouth is full of cursing, and deceit, and oppression; under his tongue is mischief and iniquity.";
web[7] = "His mouth is full of cursing and deceit and fraud: under his tongue [is] mischief and vanity.";
hnv[7] = "His mouth is full of cursing, deceit, and oppression. Under his tongue is mischief and iniquity.";
vul[7] = "[Vulgate 9:28] maledictione os eius plenum est et dolis et avaritia sub lingua eius dolor et iniquitas";
rsv[8] = "He sits in ambush in the villages; in hiding places he murders the innocent. His eyes stealthily watch for the hapless,";
asv[8] = "He sitteth in the lurking-places of the villages; In the secret places doth he murder the innocent; His eyes are privily set against the helpless. ";
yng[8] = "He doth sit in an ambush of the villages, In secret places he doth slay the innocent. His eyes for the afflicted watch secretly,";
dby[8] = "He sitteth in the lurking-places of the villages; in the secret places doth he slay the innocent: his eyes watch for the wretched.";
web[8] = "He sitteth in the lurking places of the villages: in the secret places doth he murder the innocent: his eyes are privily set against the poor.";
hnv[8] = "He lies in wait near the villages. From ambushes, he murders the innocent. His eyes are secretly set against the helpless.";
vul[8] = "[Vulgate 9:29] sedet insidians iuxta vestibula in absconditis ut interficiat innocentem";
rsv[9] = "he lurks in secret like a lion in his covert; he lurks that he may seize the poor, he seizes the poor when he draws him into his net.";
asv[9] = "He lurketh in secret as a lion in his covert; He lieth in wait to catch the poor: He doth catch the poor, when he draweth him in his net. ";
yng[9] = "He lieth in wait in a secret place, as a lion in a covert. He lieth in wait to catch the poor, He catcheth the poor, drawing him into his net.";
dby[9] = "He lieth in wait secretly, like a lion in his thicket; he lieth in wait to catch the afflicted: he doth catch the afflicted, drawing him into his net.";
web[9] = "He lieth in wait secretly as a lion in his den: he lieth in wait to catch the poor: he doth catch the poor, when he draweth him into his net.";
hnv[9] = "He lurks in secret as a lion in his ambush. He lies in wait to catch the helpless. He catches the helpless, when he draws him in his net.";
vul[9] = "[Vulgate 9:30] oculi eius robustos tuos circumspiciunt insidiatur in abscondito quasi leo in cubili insidiatur ut rapiat pauperem rapiet pauperem cum adtraxerit eum ad rete suum";
kjv[10] = "He sitteth in the lurking places of the villages: in the secret places doth he murder the innocent: his eyes are privily set against the poor.";
rsv[10] = "The hapless is crushed, sinks down, and falls by his might.";
asv[10] = "He croucheth, he boweth down, And the helpless fall by his strong ones. ";
yng[10] = "He is bruised -- he boweth down, Fallen by his mighty ones hath the afflicted.";
dby[10] = "He croucheth, he boweth down, that the wretched may fall by his strong ones.";
web[10] = "He croucheth, [and] humbleth himself, that the poor may fall by his strong ones.";
hnv[10] = "The helpless are crushed, they collapse, They fall under his strength.";
vul[10] = "[Vulgate 9:31] et confractum subiciet et inruet viribus suis valenter";
kjv[11] = "He lieth in wait secretly as a lion in his den: he lieth in wait to catch the poor: he doth catch the poor, when he draweth him into his net.";
rsv[11] = "He thinks in his heart, &quot;God has forgotten, he has hidden his face, he will never see it.&quot;";
asv[11] = "He saith in his heart: God hath forgotten; He hideth his face, he will never see it. ";
yng[11] = "He said in his heart, `God hath forgotten, He hath hid His face, He hath never seen.\'";
dby[11] = "He saith in his heart, God hath forgotten, he hideth his face, he will never see [it].";
web[11] = "He hath said in his heart, God hath forgotten: he hideth his face; he will never see [it].";
hnv[11] = "He says in his heart, &quot;God has forgotten. He hides his face. He will never see it.&quot;";
vul[11] = "[Vulgate 9:32] dixit in corde suo oblitus est Deus abscondit faciem suam non respiciet in perpetuum";
kjv[12] = "He croucheth, [and] humbleth himself, that the poor may fall by his strong ones.";
rsv[12] = "Arise, O LORD; O God, lift up thy hand; forget not the afflicted.";
asv[12] = "Arise, O Jehovah; O God, lift up thy hand: Forget not the poor. ";
yng[12] = "Arise, O Jehovah! O God, lift up Thy hand! Forget not the humble.";
dby[12] = "Arise, Jehovah; O God, lift up thy hand: forget not the afflicted.";
web[12] = "Arise, O LORD; O God, lift up thy hand: forget not the humble.";
hnv[12] = "Arise, LORD! God, lift up your hand! Don\'t forget the helpless.";
vul[12] = "[Vulgate 9:33] surge Domine Deus leva manum tuam noli oblivisci pauperum";
kjv[13] = "He hath said in his heart, God hath forgotten: he hideth his face; he will never see [it].";
rsv[13] = "Why does the wicked renounce God, and say in his heart, &quot;Thou wilt not call to account&quot;?";
asv[13] = "Wherefore doth the wicked contemn God, And say in his heart, Thou wilt not require [it]? ";
yng[13] = "Wherefore hath the wicked despised God? He hath said in his heart, `It is not required.\'";
dby[13] = "Wherefore doth the wicked contemn God? He hath said in his heart, Thou wilt not require [it].";
web[13] = "Why doth the wicked contemn God? he hath said in his heart, Thou wilt not require [it].";
hnv[13] = "Why does the wicked condemn God, And say in his heart, &quot;God won\'t call me into account?&quot;";
vul[13] = "[Vulgate 9:34] quare blasphemat impius Deum dicens in corde suo quod non requirat";
kjv[14] = "Arise, O LORD; O God, lift up thine hand: forget not the humble.";
rsv[14] = "Thou dost see; yea, thou dost note trouble and vexation, that thou mayest take it into thy hands; the hapless commits himself to thee; thou hast been the helper of the fatherless.";
asv[14] = "Thou hast seen [it]; for thou beholdest mischief and spite, to requite it with thy hand: The helpless committeth [himself] unto thee; Thou hast been the helper of the fatherless. ";
yng[14] = "Thou hast seen, For Thou perverseness and anger beholdest; By giving into Thy hand, On Thee doth the afflicted leave [it], Of the fatherless Thou hast been an helper.";
dby[14] = "Thou hast seen [it], for thou thyself beholdest trouble and vexation, to requite by thy hand. The wretched committeth himself unto thee; thou hast been the helper of the fatherless.";
web[14] = "Thou hast seen [it]; for thou beholdest mischief and spite, to requite [it] with thy hand: the poor committeth himself to thee; thou art the helper of the fatherless.";
hnv[14] = "But you do see trouble and grief; You consider it to take it into your hand. You help the victim and the fatherless.";
vul[14] = "[Vulgate 9:35] vides quia tu laborem et furorem respicis ut detur in manu tua tibi relinquuntur fortes tui pupillo tu es factus adiutor";
kjv[15] = "Wherefore doth the wicked contemn God? he hath said in his heart, Thou wilt not require [it].";
rsv[15] = "Break thou the arm of the wicked and evildoer; seek out his wickedness till thou find none.";
asv[15] = "Break thou the arm of the wicked; And as for the evil man, seek out his wickedness till thou find none. ";
yng[15] = "Break the arm of the wicked and the evil, Seek out his wickedness, find none;";
dby[15] = "Break thou the arm of the wicked, and as for the evil man, seek out his wickedness [till] thou find none.";
web[15] = "Break thou the arm of the wicked and the evil [man]: seek out his wickedness [till] thou shalt find none.";
hnv[15] = "Break the arm of the wicked. As for the evil man, seek out his wickedness until you find none.";
vul[15] = "[Vulgate 9:36] contere brachium impii et maligni quaeres impietatem eius et non invenies";
kjv[16] = "Thou hast seen [it]; for thou beholdest mischief and spite, to requite [it] with thy hand: the poor committeth himself unto thee; thou art the helper of the fatherless.";
rsv[16] = "The LORD is king for ever and ever; the nations shall perish from his land.";
asv[16] = "Jehovah is King for ever and ever: The nations are perished out of his land. ";
yng[16] = "Jehovah [is] king to the age, and for ever, The nations have perished out of His land!";
dby[16] = "Jehovah is King for ever and ever: the nations have perished out of his land.";
web[16] = "The LORD [is] King for ever and ever: the heathen have perished out of his land.";
hnv[16] = "The LORD is King forever and ever! The nations will perish out of his land.";
vul[16] = "[Vulgate 9:37] Dominus rex saeculi et aeternitatis perierunt gentes de terra eius";
kjv[17] = "Break thou the arm of the wicked and the evil [man]: seek out his wickedness [till] thou find none.";
rsv[17] = "O LORD, thou wilt hear the desire of the meek; thou wilt strengthen their heart, thou wilt incline thy ear";
asv[17] = "Jehovah, thou hast heard the desire of the meek: Thou wilt prepare their heart, thou wilt cause thine ear to hear; ";
yng[17] = "The desire of the humble Thou hast heard, O Jehovah. Thou preparest their heart; Thou causest Thine ear to attend,";
dby[17] = "Jehovah, thou hast heard the desire of the meek, thou hast established their heart: thou causest thine ear to hear,";
web[17] = "LORD, thou hast heard the desire of the humble: thou wilt prepare their heart, thou wilt cause thy ear to hear:";
hnv[17] = "LORD, you have heard the desire of the humble. You will prepare their heart. You will cause your ear to hear,";
vul[17] = "[Vulgate 9:38] desiderium pauperum audit Dominus praeparasti ut cor eorum audiat auris tua";
kjv[18] = "The LORD [is] King for ever and ever: the heathen are perished out of his land.";
rsv[18] = "to do justice to the fatherless and the oppressed, so that man who is of the earth may strike terror no more.";
asv[18] = "To judge the fatherless and the oppressed, That man who is of the earth may be terrible no more. ";
yng[18] = "To judge the fatherless and bruised: He addeth no more to oppress -- man of the earth!";
dby[18] = "To do justice to the fatherless and the oppressed one, that the man of the earth may terrify no more.";
web[18] = "To judge the fatherless and the oppressed, that the man of the earth may no more oppress.";
hnv[18] = "To judge the fatherless and the oppressed, That man who is of the eretz may terrify no more. ";
vul[18] = "[Vulgate 9:39] ut iudices pupillum et oppressum et nequaquam ultra superbiat homo de terra";
csb[1] = "LORD, why do you stand so far away? Why do you hide in times of trouble?";
csb[2] = "In arrogance the wicked relentlessly pursue their victims; let them be caught in the schemes they have devised.";
csb[3] = "For the wicked one boasts about his own cravings; the one who is greedy curses and despises the LORD.";
csb[4] = "In all his scheming, the wicked person arrogantly thinks, &quot;There\'s no accountability, since there\'s no God.&quot;";
csb[5] = "His ways are always secure; your lofty judgments have no effect on him; he scoffs at all his adversaries.";
csb[6] = "He says to himself, &quot;I will never be moved -- from generation to generation without calamity.&quot;";
csb[7] = "Cursing, deceit, and violence fill his mouth; trouble and malice are under his tongue.";
csb[8] = "He waits in ambush near settlements; he kills the innocent in secret places. His eyes are on the lookout for the helpless;";
csb[9] = "he lurks in secret like a lion in a thicket. He lurks in order to seize a victim; he seizes a victim and drags him in his net.";
csb[10] = "So he is oppressed and beaten down; helpless people fall because of the wicked one\'s strength.";
csb[11] = "He says to himself, &quot;God has forgotten; he hides his face and will never see.&quot;";
csb[12] = "Rise up, LORD God! Lift up your hand. Do not forget the oppressed.";
csb[13] = "Why has the wicked person despised God? He says to himself, &quot;You will not demand an account.&quot;";
csb[14] = "But you yourself have seen trouble and grief, observing it in order to take the matter into your hands. The helpless one entrusts himself to you; you are a helper of the fatherless.";
csb[15] = "Break the arm of the wicked, evil person, until you look for his wickedness, but it can\'t be found.";
csb[16] = "The LORD is King forever and ever; the nations will perish from his land.";
csb[17] = "LORD, you have heard the desire of the humble; you will strengthen their hearts. You will listen carefully,";
csb[18] = "doing justice for the fatherless and the oppressed so that mere humans from the earth may terrify them no more.";
kjv[1] = "Why standest thou afar off, O LORD? [why] hidest thou [thyself] in times of trouble?";
kjv[2] = "The wicked in [his] pride doth persecute the poor: let them be taken in the devices that they have imagined.";
kjv[3] = "For the wicked boasteth of his heart\'s desire, and blesseth the covetous, [whom] the LORD abhorreth.";
kjv[4] = "The wicked, through the pride of his countenance, will not seek [after God]: God [is] not in all his thoughts.";
kjv[5] = "His ways are always grievous; thy judgments [are] far above out of his sight: [as for] all his enemies, he puffeth at them.";
kjv[6] = "He hath said in his heart, I shall not be moved: for [I shall] never [be] in adversity.";
kjv[7] = "His mouth is full of cursing and deceit and fraud: under his tongue [is] mischief and vanity.";
kjv[8] = "He sitteth in the lurking places of the villages: in the secret places doth he murder the innocent: his eyes are privily set against the poor.";
kjv[9] = "He lieth in wait secretly as a lion in his den: he lieth in wait to catch the poor: he doth catch the poor, when he draweth him into his net.";
kjv[10] = "He croucheth, [and] humbleth himself, that the poor may fall by his strong ones.";
kjv[11] = "He hath said in his heart, God hath forgotten: he hideth his face; he will never see [it].";
kjv[12] = "Arise, O LORD; O God, lift up thine hand: forget not the humble.";
kjv[13] = "Wherefore doth the wicked contemn God? he hath said in his heart, Thou wilt not require [it].";
kjv[14] = "Thou hast seen [it]; for thou beholdest mischief and spite, to requite [it] with thy hand: the poor committeth himself unto thee; thou art the helper of the fatherless.";
kjv[15] = "Break thou the arm of the wicked and the evil [man]: seek out his wickedness [till] thou find none.";
kjv[16] = "The LORD [is] King for ever and ever: the heathen are perished out of his land.";
kjv[17] = "LORD, thou hast heard the desire of the humble: thou wilt prepare their heart, thou wilt cause thine ear to hear:";
kjv[18] = "To judge the fatherless and the oppressed, that the man of the earth may no more oppress.";
</script>
