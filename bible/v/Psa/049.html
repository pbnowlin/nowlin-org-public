csb[1] = "Hear this, all you peoples; listen, all who inhabit the world,";
csb[2] = "both low and high, rich and poor together.";
csb[3] = "My mouth speaks wisdom; my heart\'s meditation brings understanding.";
csb[4] = "I turn my ear to a proverb; I explain my riddle with a lyre.";
csb[5] = "Why should I fear in times of trouble? The iniquity of my foes surrounds me.";
csb[6] = "They trust in their wealth and boast of their abundant riches.";
csb[7] = "Yet these cannot redeem a person or pay his ransom to God --";
csb[8] = "since the price of redeeming him is too costly, one should forever stop trying --";
csb[9] = "so that he may live forever and not see the Pit.";
csb[10] = "For one can see that the wise die; the foolish and stupid also pass away. Then they leave their wealth to others.";
csb[11] = "Their graves are their permanent homes, their dwellings from generation to generation, though they have named estates after themselves.";
csb[12] = "But despite his assets, mankind will not last; he is like the animals that perish.";
csb[13] = "This is the way of those who are arrogant, and of their followers, who approve of their words. Selah";
csb[14] = "Like sheep they are headed for Sheol; Death will shepherd them. The upright will rule over them in the morning, and their form will waste away in Sheol, far from their lofty abode.";
csb[15] = "But God will redeem me from the power of Sheol, for he will take me. Selah";
csb[16] = "Do not be afraid when a person gets rich, when the wealth of his house increases.";
csb[17] = "For when he dies, he will take nothing at all; his wealth will not follow him down.";
csb[18] = "Though he blesses himself during his lifetime -- and you are acclaimed when you do well for yourself --";
csb[19] = "he will go to the generation of his fathers; they will never see the light.";
csb[20] = "Mankind, with his assets but without understanding, is like the animals that perish.";
