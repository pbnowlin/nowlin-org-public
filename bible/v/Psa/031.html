dby[22] = "As for me, I said in my haste, I am cut off from before thine eyes; nevertheless thou heardest the voice of my supplications when I cried unto thee.";
web[22] = "For I said in my haste, I am cut off from before thy eyes: nevertheless thou heardest the voice of my supplications when I cried to thee.";
hnv[22] = "As for me, I said in my haste, &quot;I am cut off from before your eyes.&quot; Nevertheless you heard the voice of my petitions when I cried to you.";

dby[23] = "Love Jehovah, all ye his saints. Jehovah preserveth the faithful, and plentifully requiteth the proud doer.";
web[23] = "O love the LORD, all ye his saints: [for] the LORD preserveth the faithful, and plentifully rewardeth the proud doer.";
hnv[23] = "Oh love the LORD, all you his holy ones! The LORD preserves the faithful, And pays back him who deals proudly in full.";

rsv[24] = "Be strong, and let your heart take courage, all you who wait for the LORD!";
asv[24] = "Be strong, and let your heart take courage, All ye that hope in Jehovah. ";
yng[24] = "Be strong, and He strengtheneth your heart, All ye who are waiting for Jehovah!";
dby[24] = "Be strong, and let your heart take courage, all ye that hope in Jehovah.";
web[24] = "Be of good courage, and he will strengthen your heart, all ye that hope in the LORD.";
hnv[24] = "Be strong, and let your heart take courage, All you who hope in the LORD. ";
vul[24] = "[Vulgate 30:25] confortamini et roboretur cor vestrum omnes qui expectatis Dominum";
csb[1] = "LORD, I seek refuge in you; let me never be disgraced. Save me by your righteousness.";
csb[2] = "Listen closely to me; rescue me quickly. Be a rock of refuge for me, a mountain fortress to save me.";
csb[3] = "For you are my rock and my fortress; you lead and guide me for your name\'s sake.";
csb[4] = "You will free me from the net that is secretly set for me, for you are my refuge.";
csb[5] = "Into your hand I entrust my spirit; you have redeemed me, LORD, God of truth.";
csb[6] = "I hate those who are devoted to worthless idols, but I trust in the LORD.";
csb[7] = "I will rejoice and be glad in your faithful love because you have seen my affliction. You know the troubles of my soul";
csb[8] = "and have not handed me over to the enemy. You have set my feet in a spacious place.";
csb[9] = "Be gracious to me, LORD, because I am in distress; my eyes are worn out from frustration -- my whole being as well.";
csb[10] = "Indeed, my life is consumed with grief and my years with groaning; my strength has failed because of my iniquity, and my bones waste away.";
csb[11] = "I am ridiculed by all my adversaries and even by my neighbors. I am dreaded by my acquaintances; those who see me in the street run from me.";
csb[12] = "I am forgotten: gone from memory like a dead person -- like broken pottery.";
csb[13] = "I have heard the gossip of many; terror is on every side. When they conspired against me, they plotted to take my life.";
csb[14] = "But I trust in you, LORD; I say, &quot;You are my God.&quot;";
csb[15] = "The course of my life is in your power; rescue me from the power of my enemies and from my persecutors.";
csb[16] = "Make your face shine on your servant; save me by your faithful love.";
csb[17] = "LORD, do not let me be disgraced when I call on you. Let the wicked be disgraced; let them be quiet in Sheol.";
csb[18] = "Let lying lips that arrogantly speak against the righteous in proud contempt be silenced.";
csb[19] = "How great is your goodness that you have stored up for those who fear you and accomplished in the sight of everyone for those who take refuge in you.";
csb[20] = "You hide them in the protection of your presence; you conceal them in a shelter from human schemes, from quarrelsome tongues.";
csb[21] = "Blessed be the LORD, for he has wondrously shown his faithful love to me in a city under siege.";
csb[22] = "In my alarm I said, &quot;I am cut off from your sight.&quot; But you heard the sound of my pleading when I cried to you for help.";
csb[23] = "Love the LORD, all his faithful ones. The LORD protects the loyal, but fully repays the arrogant.";
