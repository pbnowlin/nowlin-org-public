kjv[1] = "[[A Psalm of David, to bring to remembrance.]] O LORD, rebuke me not in thy wrath: neither chasten me in thy hot displeasure.";
rsv[1] = "A Psalm of David, for the memorial offering. O LORD, rebuke me not in thy anger, nor chasten me in thy wrath!";
asv[1] = "[A Psalm of David, to bring to remembrance.] O Jehovah, rebuke me not in thy wrath; Neither chasten me in thy hot displeasure. ";
yng[1] = "A Psalm of David, `To cause to remember.\' Jehovah, in Thy wrath reprove me not, Nor in Thy fury chastise me.";
dby[1] = "{A Psalm of David, to bring to remembrance.} Jehovah, rebuke me not in thy wrath; neither chasten me in thy hot displeasure.";
web[1] = "A Psalm of David, to bring to remembrance. O LORD, rebuke me not in thy wrath: neither chasten me in thy hot displeasure.";
hnv[1] = "A Psalm by David, for a memorial. LORD, don\'t rebuke me in your wrath, Neither chasten me in your hot displeasure.";
vul[1] = "[Vulgate 37:1] canticum David in commemoratione [Vulgate 37:2] Domine ne in ira tua arguas me neque in furore tuo corripias me";
kjv[2] = "For thine arrows stick fast in me, and thy hand presseth me sore.";
rsv[2] = "For thy arrows have sunk into me, and thy hand has come down on me.";
asv[2] = "For thine arrows stick fast in me, And thy hand presseth me sore. ";
yng[2] = "For Thine arrows have come down on me, And Thou lettest down upon me Thy hand.";
dby[2] = "For thine arrows stick fast in me, and thy hand cometh down upon me.";
web[2] = "For thy arrows stick fast in me, and thy hand falleth heavy upon me.";
hnv[2] = "For your arrows have pierced me, Your hand presses hard on me.";
vul[2] = "[Vulgate 37:3] quia sagittae tuae infixae sunt mihi et tetigit me manus tua";
kjv[3] = "[There is] no soundness in my flesh because of thine anger; neither [is there any] rest in my bones because of my sin.";
rsv[3] = "There is no soundness in my flesh because of thy indignation; there is no health in my bones because of my sin.";
asv[3] = "There is no soundness in my flesh because of thine indignation; Neither is there any health in my bones because of my sin. ";
yng[3] = "Soundness is not in my flesh, Because of Thine indignation, Peace is not in my bones because of my sin.";
dby[3] = "There is no soundness in my flesh because of thine indignation; no peace in my bones, because of my sin.";
web[3] = "[There is] no soundness in my flesh because of thy anger; neither [is there any] rest in my bones because of my sin.";
hnv[3] = "There is no soundness in my flesh because of your indignation, Neither is there any health in my bones because of my sin.";
vul[3] = "[Vulgate 37:4] non est sanitas in carne mea a facie indignationis tuae non est pax ossibus meis a facie peccati mei";
kjv[4] = "For mine iniquities are gone over mine head: as an heavy burden they are too heavy for me.";
rsv[4] = "For my iniquities have gone over my head; they weigh like a burden too heavy for me.";
asv[4] = "For mine iniquities are gone over my head: As a heavy burden they are too heavy for me. ";
yng[4] = "For mine iniquities have passed over my head, As a heavy burden -- too heavy for me.";
dby[4] = "For mine iniquities are gone over my head: as a heavy burden they are too heavy for me.";
web[4] = "For my iniquities have gone over my head: as a heavy burden they are too heavy for me.";
hnv[4] = "For my iniquities have gone over my head. As a heavy burden, they are too heavy for me.";
vul[4] = "[Vulgate 37:5] quia iniquitates meae transierunt caput meum quasi onus grave adgravatae sunt super me";
kjv[5] = "My wounds stink [and] are corrupt because of my foolishness.";
rsv[5] = "My wounds grow foul and fester because of my foolishness,";
asv[5] = "My wounds are loathsome and corrupt, Because of my foolishness. ";
yng[5] = "Stunk -- become corrupt have my wounds, Because of my folly.";
dby[5] = "My wounds stink, they are corrupt, because of my foolishness.";
web[5] = "My wounds are offensive, [and] are corrupt because of my foolishness.";
hnv[5] = "My wounds are loathsome and corrupt, Because of my foolishness.";
vul[5] = "[Vulgate 37:6] conputruerunt et tabuerunt cicatrices meae a facie insipientiae meae";
kjv[6] = "I am troubled; I am bowed down greatly; I go mourning all the day long.";
rsv[6] = "I am utterly bowed down and prostrate; all the day I go about mourning.";
asv[6] = "I am pained and bowed down greatly; I go mourning all the day long. ";
yng[6] = "I have been bent down, I have been bowed down -- unto excess, All the day I have gone mourning.";
dby[6] = "I am depressed; I am bowed down beyond measure; I go mourning all the day.";
web[6] = "I am troubled; I am bowed down greatly; I go mourning all the day long.";
hnv[6] = "I am pained and bowed down greatly. I go mourning all day long.";
vul[6] = "[Vulgate 37:7] adflictus sum et incurvatus nimis tota die maerens ambulabam";
kjv[7] = "For my loins are filled with a loathsome [disease]: and [there is] no soundness in my flesh.";
rsv[7] = "For my loins are filled with burning, and there is no soundness in my flesh.";
asv[7] = "For my loins are filled with burning; And there is no soundness in my flesh. ";
yng[7] = "For my flanks have been full of drought, And soundness is not in my flesh.";
dby[7] = "For my loins are full of burning, and there is no soundness in my flesh.";
web[7] = "For my loins are filled with a lothsome [disease]: and [there is] no soundness in my flesh.";
hnv[7] = "For my loins are filled with burning. There is no soundness in my flesh.";
vul[7] = "[Vulgate 37:8] quia lumbi mei repleti sunt ignominia et non est sanitas in carne mea";
kjv[8] = "I am feeble and sore broken: I have roared by reason of the disquietness of my heart.";
rsv[8] = "I am utterly spent and crushed; I groan because of the tumult of my heart.";
asv[8] = "I am faint and sore bruised: I have groaned by reason of the disquietness of my heart. ";
yng[8] = "I have been feeble and smitten -- unto excess, I have roared from disquietude of heart.";
dby[8] = "I am faint and broken beyond measure; I roar by reason of the agitation of my heart.";
web[8] = "I am feeble and grievously broken: I have roared by reason of the disquietness of my heart.";
hnv[8] = "I am faint and severely bruised. I have groaned by reason of the anguish of my heart.";
vul[8] = "[Vulgate 37:9] evigilavi et adflictus sum nimis rugiebam a gemitu cordis mei";
kjv[9] = "Lord, all my desire [is] before thee; and my groaning is not hid from thee.";
rsv[9] = "Lord, all my longing is known to thee, my sighing is not hidden from thee.";
asv[9] = "Lord, all my desire is before thee; And my groaning is not hid from thee. ";
yng[9] = "Lord, before Thee [is] all my desire, And my sighing from Thee hath not been hid.";
dby[9] = "Lord, all my desire is before thee, and my sighing is not hid from thee.";
web[9] = "Lord, all my desire [is] before thee; and my groaning is not hid from thee.";
hnv[9] = "Lord, all my desire is before you. My groaning is not hidden from you.";
vul[9] = "[Vulgate 37:10] Domine in conspectu tuo omne desiderium meum et gemitus meus a te non est absconditus";
kjv[10] = "My heart panteth, my strength faileth me: as for the light of mine eyes, it also is gone from me.";
rsv[10] = "My heart throbs, my strength fails me; and the light of my eyes--it also has gone from me.";
asv[10] = "My heart throbbeth, my strength faileth me: As for the light of mine eyes, it also is gone from me. ";
yng[10] = "My heart [is] panting, my power hath forsaken me, And the light of mine eyes, Even they are not with me.";
dby[10] = "My heart throbbeth, my strength hath left me; and the light of mine eyes, it also is no more with me.";
web[10] = "My heart panteth, my strength faileth me: as for the light of my eyes, that also is gone from me.";
hnv[10] = "My heart throbs. My strength fails me. As for the light of my eyes, it has also left me.";
vul[10] = "[Vulgate 37:11] cor meum fluctuabat dereliquit me fortitudo mea et lux oculorum meorum etiam ipsa non est mecum";
kjv[11] = "My lovers and my friends stand aloof from my sore; and my kinsmen stand afar off.";
rsv[11] = "My friends and companions stand aloof from my plague, and my kinsmen stand afar off.";
asv[11] = "My lovers and my friends stand aloof from my plague; And my kinsmen stand afar off. ";
yng[11] = "My lovers and my friends over-against my plague stand. And my neighbours afar off have stood.";
dby[11] = "My lovers and mine associates stand aloof from my stroke; and my kinsmen stand afar off.";
web[11] = "My lovers and my friends stand aloof from my affliction; and my kinsmen stand afar off.";
hnv[11] = "My lovers and my friends stand aloof from my plague. My kinsmen stand far away.";

kjv[12] = "They also that seek after my life lay snares [for me]: and they that seek my hurt speak mischievous things, and imagine deceits all the day long.";
rsv[12] = "Those who seek my life lay their snares, those who seek my hurt speak of ruin, and meditate treachery all the day long.";
asv[12] = "They also that seek after my life lay snares [for me]; And they that seek my hurt speak mischievous things, And meditate deceits all the day long. ";
yng[12] = "And those seeking my soul lay a snare, And those seeking my evil Have spoken mischievous things, And they do deceits meditate all the day.";
dby[12] = "And they that seek after my life lay snares [for me]; and they that seek my hurt speak mischievous things, and meditate deceits all the day long.";
web[12] = "They also that seek after my life lay snares [for me]: and they that seek my hurt speak mischievous things, and imagine deceits all the day long.";
hnv[12] = "They also who seek after my life lay snares. Those who seek my hurt speak mischievous things, And meditate deceits all day long.";
vul[12] = "[Vulgate 37:13] et inruebant quaerentes animam meam et investigantes mala mihi loquebantur insidias et dolos tota die meditabantur";
kjv[13] = "But I, as a deaf [man], heard not; and [I was] as a dumb man [that] openeth not his mouth.";
rsv[13] = "But I am like a deaf man, I do not hear, like a dumb man who does not open his mouth.";
asv[13] = "But I, as a deaf man, hear not; And I am as a dumb man that openeth not his mouth. ";
yng[13] = "And I, as deaf, hear not. And as a dumb one who openeth not his mouth.";
dby[13] = "But I, as a deaf [man], hear not; and am as a dumb man that openeth not his mouth.";
web[13] = "But I, as a deaf [man], heard not; and [I was] as a dumb man [that] openeth not his mouth.";
hnv[13] = "But I, as a deaf man, don\'t hear. I am as a mute man who doesn\'t open his mouth.";
vul[13] = "[Vulgate 37:14] ego autem quasi surdus non audiebam et quasi mutus non aperiebam os meum";
kjv[14] = "Thus I was as a man that heareth not, and in whose mouth [are] no reproofs.";
rsv[14] = "Yea, I am like a man who does not hear, and in whose mouth are no rebukes.";
asv[14] = "Yea, I am as a man that heareth not, And in whose mouth are no reproofs. ";
yng[14] = "Yea, I am as a man who heareth not, And in his mouth are no reproofs.";
dby[14] = "Yea, I am as a man that heareth not, and in whose mouth are no reproofs.";
web[14] = "Thus I was as a man that heareth not, and in whose mouth [are] no reproofs.";
hnv[14] = "Yes, I am as a man who doesn\'t hear, In whose mouth are no reproofs.";
vul[14] = "[Vulgate 37:15] et eram quasi homo non audiens nec habens in ore suo redargutiones";
kjv[15] = "For in thee, O LORD, do I hope: thou wilt hear, O Lord my God.";
rsv[15] = "But for thee, O LORD, do I wait; it is thou, O LORD my God, who wilt answer.";
asv[15] = "For in thee, O Jehovah, do I hope: Thou wilt answer, O Lord my God. ";
yng[15] = "Because for Thee, O Jehovah, I have waited, Thou dost answer, O Lord my God.";
dby[15] = "For in thee, Jehovah, do I hope: *thou* wilt answer, O Lord my God.";
web[15] = "For in thee, O LORD, do I hope: thou wilt hear, O Lord my God.";
hnv[15] = "For in you, LORD, do I hope. You will answer, Lord my God.";
vul[15] = "[Vulgate 37:16] te enim Domine expectabam tu exaudies Domine Deus meus";
kjv[16] = "For I said, [Hear me], lest [otherwise] they should rejoice over me: when my foot slippeth, they magnify [themselves] against me.";
rsv[16] = "For I pray, &quot;Only let them not rejoice over me, who boast against me when my foot slips!&quot;";
asv[16] = "For I said, Lest they rejoice over me: When my foot slippeth, they magnify themselves against me. ";
yng[16] = "When I said, `Lest they rejoice over me, In the slipping of my foot against me they magnified themselves.";
dby[16] = "For I said, Let them not rejoice over me! When my foot slipped, they magnified [themselves] against me.";
web[16] = "For I said, [Hear me], lest [otherwise] they should rejoice over me: when my foot slippeth, they magnify [themselves] against me.";
hnv[16] = "For I said, &quot;Don\'t let them gloat over me, Or exalt themselves over me when my foot slips.&quot;";
vul[16] = "[Vulgate 37:17] quia dixi ne forte insultent mihi et cum vacillaverint pedes mei super me magnificentur";
kjv[17] = "For I [am] ready to halt, and my sorrow [is] continually before me.";
rsv[17] = "For I am ready to fall, and my pain is ever with me.";
asv[17] = "For I am ready to fall, And my sorrow is continually before me. ";
yng[17] = "For I am ready to halt, And my pain [is] before me continually.";
dby[17] = "For I am ready to halt, and my pain is continually before me.";
web[17] = "For I [am] ready to halt, and my sorrow [is] continually before me.";
hnv[17] = "For I am ready to fall. My pain is continually before me.";
vul[17] = "[Vulgate 37:18] quia ego ad plagas paratus et dolor meus contra me est semper";
kjv[18] = "For I will declare mine iniquity; I will be sorry for my sin.";
rsv[18] = "I confess my iniquity, I am sorry for my sin.";
asv[18] = "For I will declare mine iniquity; I will be sorry for my sin. ";
yng[18] = "For mine iniquity I declare, I am sorry for my sin.";
dby[18] = "For I will declare mine iniquity, I am grieved for my sin.";
web[18] = "For I will declare my iniquity; I will be sorry for my sin.";
hnv[18] = "For I will declare my iniquity. I will be sorry for my sin.";
vul[18] = "[Vulgate 37:19] quia iniquitatem meam adnuntio sollicitus ero pro peccato meo";
kjv[19] = "But mine enemies [are] lively, [and] they are strong: and they that hate me wrongfully are multiplied.";
rsv[19] = "Those who are my foes without cause are mighty, and many are those who hate me wrongfully.";
asv[19] = "But mine enemies are lively, [and] are strong; And they that hate me wrongfully are multiplied. ";
yng[19] = "And mine enemies [are] lively, They have been strong, and those hating me without cause, Have been multiplied.";
dby[19] = "But mine enemies are lively, they are strong; and they that hate me wrongfully are multiplied:";
web[19] = "But my enemies [are] lively, [and] they are strong: and they that hate me wrongfully are multiplied.";
hnv[19] = "But my enemies are vigorous and many. Those who hate me without reason are numerous.";
vul[19] = "[Vulgate 37:20] inimici autem mei viventes confortati sunt et multiplicati sunt odientes me mendaciter";
kjv[20] = "They also that render evil for good are mine adversaries; because I follow [the thing that] good [is].";
rsv[20] = "Those who render me evil for good are my adversaries because I follow after good.";
asv[20] = "They also that render evil for good Are adversaries unto me, because I follow the thing that is good. ";
yng[20] = "And those paying evil for good accuse me, Because of my pursuing good.";
dby[20] = "And they that render evil for good are adversaries unto me; because I pursue what is good.";
web[20] = "They also that render evil for good are my adversaries; because I follow [the thing that is] good.";
hnv[20] = "They who also render evil for good are adversaries to me, Because I follow what is good.";
vul[20] = "[Vulgate 37:21] et qui reddunt malum pro bono adversabantur mihi quia sequebar bonum";
kjv[21] = "Forsake me not, O LORD: O my God, be not far from me.";
rsv[21] = "Do not forsake me, O LORD! O my God, be not far from me!";
asv[21] = "Forsake me not, O Jehovah: O my God, be not far from me. ";
yng[21] = "Do not forsake me, O Jehovah, My God, be not far from me,";
dby[21] = "Forsake me not, Jehovah; O my God, be not far from me.";
web[21] = "Forsake me not, O LORD: O my God, be not far from me.";
hnv[21] = "Don\'t forsake me, LORD. My God, don\'t be far from me.";
vul[21] = "[Vulgate 37:22] ne derelinquas me Domine Deus meus ne elongeris a me";
kjv[22] = "Make haste to help me, O Lord my salvation.";
rsv[22] = "Make haste to help me, O Lord, my salvation!";
asv[22] = "Make haste to help me, O Lord, my salvation. ";
yng[22] = "Haste to help me, O Lord, my salvation!";
dby[22] = "Make haste to help me, O Lord, my salvation.";
web[22] = "Make haste to help me, O Lord my salvation.";
hnv[22] = "Hurry to help me, Lord, my salvation. ";
vul[22] = "[Vulgate 37:23] festina in auxilium meum Domine salutis meae";
csb[1] = "LORD, do not punish me in your anger or discipline me in your wrath.";
csb[2] = "For your arrows have sunk into me, and your hand has pressed down on me.";
csb[3] = "There is no soundness in my body because of your indignation; there is no health in my bones because of my sin.";
csb[4] = "For my iniquities have flooded over my head; they are a burden too heavy for me to bear.";
csb[5] = "My wounds are foul and festering because of my foolishness.";
csb[6] = "I am bent over and brought very low; all day long I go around in mourning.";
csb[7] = "For my insides are full of burning pain, and there is no soundness in my body.";
csb[8] = "I am faint and severely crushed; I groan because of the anguish of my heart.";
csb[9] = "Lord, my every desire is in front of you; my sighing is not hidden from you.";
csb[10] = "My heart races, my strength leaves me, and even the light of my eyes has faded.";
csb[11] = "My loved ones and friends stand back from my affliction, and my relatives stand at a distance.";
csb[12] = "Those who intend to kill me set traps, and those who want to harm me threaten to destroy me; they plot treachery all day long.";
csb[13] = "I am like a deaf person; I do not hear. I am like a speechless person who does not open his mouth.";
csb[14] = "I am like a man who does not hear and has no arguments in his mouth.";
csb[15] = "For I put my hope in you, LORD; you will answer me, my Lord, my God.";
csb[16] = "For I said, &quot;Don\'t let them rejoice over me -- those who are arrogant toward me when I stumble.&quot;";
csb[17] = "For I am about to fall, and my pain is constantly with me.";
csb[18] = "So I confess my iniquity; I am anxious because of my sin.";
csb[19] = "But my enemies are vigorous and powerful; many hate me for no reason.";
csb[20] = "Those who repay evil for good attack me for pursuing good.";
csb[21] = "LORD, do not abandon me; my God, do not be far from me.";
csb[22] = "Hurry to help me, my Lord, my salvation.";
