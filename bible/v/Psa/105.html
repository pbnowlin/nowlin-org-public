kjv[36] = "He smote also all the firstborn in their land, the chief of all their strength.";
rsv[36] = "He smote all the first-born in their land, the first issue of all their strength.";
asv[36] = "He smote also all the first-born in their land, The chief of all their strength. ";
yng[36] = "And He smiteth every first-born in their land, The first-fruit of all their strength,";
dby[36] = "And he smote every firstborn in their land, the firstfruits of all their vigour.";
web[36] = "He smote also all the first-born in their land, the chief of all their strength.";
hnv[36] = "He struck also all the firstborn in their land, The first fruits of all their manhood.";
vul[36] = "[Vulgate 104:36] et percussit omne primogenitum in terra eorum primitias universi partus eorum";
kjv[37] = "He brought them forth also with silver and gold: and [there was] not one feeble [person] among their tribes.";
rsv[37] = "Then he led forth Israel with silver and gold, and there was none among his tribes who stumbled.";
asv[37] = "And he brought them forth with silver and gold; And there was not one feeble person among his tribes. ";
yng[37] = "And bringeth them out with silver and gold, And there is not in its tribes a feeble one.";
dby[37] = "And he brought them forth with silver and gold; and there was not one feeble among their tribes.";
web[37] = "He brought them forth also with silver and gold: and [there was] not one feeble [person] among their tribes.";
hnv[37] = "He brought them forth with silver and gold. There was not one feeble person among his tribes.";
vul[37] = "[Vulgate 104:37] et eduxit eos cum argento et auro et non erat in tribubus eorum infirmus";
kjv[38] = "Egypt was glad when they departed: for the fear of them fell upon them.";
rsv[38] = "Egypt was glad when they departed, for dread of them had fallen upon it.";
asv[38] = "Egypt was glad when they departed; For the fear of them had fallen upon them. ";
yng[38] = "Rejoiced hath Egypt in their going forth, For their fear had fallen upon them.";
dby[38] = "Egypt rejoiced at their departure; for the fear of them had fallen upon them.";
web[38] = "Egypt was glad when they departed: for the fear of them fell upon them.";
hnv[38] = "Mitzrayim was glad when they departed, For the fear of them had fallen on them.";
vul[38] = "[Vulgate 104:38] laetata est Aegyptus cum egrederentur quoniam inruerat terror eorum super eos";
kjv[39] = "He spread a cloud for a covering; and fire to give light in the night.";
rsv[39] = "He spread a cloud for a covering, and fire to give light by night.";
asv[39] = "He spread a cloud for a covering, And fire to give light in the night. ";
yng[39] = "He hath spread a cloud for a covering, And fire to enlighten the night.";
dby[39] = "He spread a cloud for a covering, and fire to give light in the night.";
web[39] = "He spread a cloud for a covering; and fire to give light in the night.";
hnv[39] = "He spread a cloud for a covering, Fire to give light in the night.";
vul[39] = "[Vulgate 104:39] expandit nubem in tentorium et ignem ut luceret nocte";
kjv[40] = "[The people] asked, and he brought quails, and satisfied them with the bread of heaven.";
rsv[40] = "They asked, and he brought quails, and gave them bread from heaven in abundance.";
asv[40] = "They asked, and he brought quails, And satisfied them with the bread of heaven. ";
yng[40] = "They have asked, and He bringeth quails, And [with] bread of heaven satisfieth them.";
dby[40] = "They asked, and he brought quails, and satisfied them with the bread of heaven.";
web[40] = "[The people] asked, and he brought quails, and satisfied them with the bread of heaven.";
hnv[40] = "They asked, and he brought quails, And satisfied them with the bread of the sky.";
vul[40] = "[Vulgate 104:40] petierunt et adduxit ortygometran et pane caelesti saturavit eos";
kjv[41] = "He opened the rock, and the waters gushed out; they ran in the dry places [like] a river.";
rsv[41] = "He opened the rock, and water gushed forth; it flowed through the desert like a river.";
asv[41] = "He opened the rock, and waters gushed out; They ran in the dry places [like] a river. ";
yng[41] = "He hath opened a rock, and waters issue, They have gone on in dry places -- a river.";
dby[41] = "He opened the rock, and waters gushed forth; they ran in the dry places [like] a river.";
web[41] = "He opened the rock, and the waters gushed out; they ran in the dry places [like] a river.";
hnv[41] = "He opened the rock, and waters gushed out. They ran as a river in the dry places.";
vul[41] = "[Vulgate 104:41] aperuit petram et fluxerunt aquae cucurrerunt in aridis flumina";
kjv[42] = "For he remembered his holy promise, [and] Abraham his servant.";
rsv[42] = "For he remembered his holy promise, and Abraham his servant.";
asv[42] = "For he remembered his holy word, [And] Abraham his servant. ";
yng[42] = "For He hath remembered His holy word, With Abraham His servant,";
dby[42] = "For he remembered his holy word, [and] Abraham his servant;";
web[42] = "For he remembered his holy promise, [and] Abraham his servant.";
hnv[42] = "For he remembered his holy word, And Avraham, his servant.";
vul[42] = "[Vulgate 104:42] quia recordatus est verbi sancti sui cum Abraham servo suo";
kjv[43] = "And he brought forth his people with joy, [and] his chosen with gladness:";
rsv[43] = "So he led forth his people with joy, his chosen ones with singing.";
asv[43] = "And he brought forth his people with joy, [And] his chosen with singing. ";
yng[43] = "And He bringeth forth His people with joy, With singing His chosen ones.";
dby[43] = "And he brought forth his people with gladness, his chosen with rejoicing;";
web[43] = "And he brought forth his people with joy, [and] his chosen with gladness:";
hnv[43] = "He brought forth his people with joy, His chosen with singing.";
vul[43] = "[Vulgate 104:43] et eduxit populum suum in laetitia laudantes electos suos";
kjv[44] = "And gave them the lands of the heathen: and they inherited the labour of the people;";
rsv[44] = "And he gave them the lands of the nations; and they took possession of the fruit of the peoples\' toil,";
asv[44] = "And he gave them the lands of the nations; And they took the labor of the peoples in possession: ";
yng[44] = "And He giveth to them the lands of nations, And the labour of peoples they possess,";
dby[44] = "And he gave them the lands of the nations, and they took possession of the labour of the peoples:";
web[44] = "And gave them the lands of the heathen: and they inherited the labor of the people;";
hnv[44] = "He gave them the lands of the nations. They took the labor of the peoples in possession,";
vul[44] = "[Vulgate 104:44] et dedit eis terras gentium et laborem tribuum possederunt";
kjv[45] = "That they might observe his statutes, and keep his laws. Praise ye the LORD.";
rsv[45] = "to the end that they should keep his statutes, and observe his laws. Praise the LORD!";
asv[45] = "That they might keep his statutes, And observe his laws. Praise ye Jehovah. ";
yng[45] = "That they may observe His statutes, And His laws may keep. Praise ye Jehovah!";
dby[45] = "That they might keep his statutes, and observe his laws. Hallelujah!";
web[45] = "That they might observe his statutes, and keep his laws. Praise ye the LORD.";
hnv[45] = "That they might keep his statutes, And observe his laws. Praise the LORD! ";
vul[45] = "[Vulgate 104:45] ut custodirent caerimonias eius et leges eius servarent alleluia";
csb[1] = "Give thanks to the LORD, call on his name; proclaim his deeds among the peoples.";
csb[2] = "Sing to him, sing praise to him; tell about all his wondrous works!";
csb[3] = "Honor his holy name; let the hearts of those who seek the LORD rejoice.";
csb[4] = "Seek the LORD and his strength; seek his face always.";
csb[5] = "Remember the wondrous works he has done, his wonders, and the judgments he has pronounced,";
csb[6] = "you offspring of Abraham his servant, Jacob\'s descendants -- his chosen ones.";
csb[7] = "He is the LORD our God; his judgments govern the whole earth.";
csb[8] = "He remembers his covenant forever, the promise he ordained for a thousand generations --";
csb[9] = "the covenant he made with Abraham, swore to Isaac,";
csb[10] = "and confirmed to Jacob as a decree and to Israel as a permanent covenant:";
csb[11] = "&quot;I will give the land of Canaan to you as your inherited portion.&quot;";
csb[12] = "When they were few in number, very few indeed, and resident aliens in Canaan,";
csb[13] = "wandering from nation to nation and from one kingdom to another,";
csb[14] = "he allowed no one to oppress them; he rebuked kings on their behalf:";
csb[15] = "&quot;Do not touch my anointed ones, or harm my prophets.&quot;";
csb[16] = "He called down famine against the land and destroyed the entire food supply.";
csb[17] = "He had sent a man ahead of them -- Joseph, who was sold as a slave.";
csb[18] = "They hurt his feet with shackles; his neck was put in an iron collar.";
csb[19] = "Until the time his prediction came true, the word of the LORD tested him.";
csb[20] = "The king sent for him and released him; the ruler of peoples set him free.";
csb[21] = "He made him master of his household, ruler over all his possessions --";
csb[22] = "binding his officials at will and instructing his elders.";
csb[23] = "Then Israel went to Egypt; Jacob lived as an alien in the land of Ham.";
csb[24] = "The LORD  made his people very fruitful; he made them more numerous than their foes,";
csb[25] = "whose hearts he turned to hate his people and to deal deceptively with his servants.";
csb[26] = "He sent Moses his servant, and Aaron, whom he had chosen.";
csb[27] = "They performed his miraculous signs among them, and wonders in the land of Ham.";
csb[28] = "He sent darkness, and it became dark -- for did they not defy his commands?";
csb[29] = "He turned their water into blood and caused their fish to die.";
csb[30] = "Their land was overrun with frogs, even in their royal chambers.";
csb[31] = "He spoke, and insects came -- gnats throughout their country.";
csb[32] = "He gave them hail for rain, and lightning throughout their land.";
csb[33] = "He struck their vines and fig trees and shattered the trees of their territory.";
csb[34] = "He spoke, and locusts came -- young locusts without number.";
csb[35] = "They devoured all the vegetation in their land and consumed the produce of their land.";
csb[36] = "He struck all the firstborn in their land, all their first progeny.";
csb[37] = "Then he brought Israel out with silver and gold, and no one among his tribes stumbled.";
csb[38] = "Egypt was glad when they left, for the dread of Israel had fallen on them.";
csb[39] = "He spread a cloud as a covering and gave a fire to light up the night.";
csb[40] = "They asked, and he brought quail and satisfied them with bread from heaven.";
csb[41] = "He opened a rock, and water gushed out; it flowed like a stream in the desert.";
csb[42] = "For he remembered his holy promise to Abraham his servant.";
csb[43] = "He brought his people out with rejoicing, his chosen ones with shouts of joy.";
csb[44] = "He gave them the lands of the nations, and they inherited what other peoples had worked for.";
csb[45] = "All this happened so that they might keep his statutes and obey his instructions. Hallelujah!";
</script>
