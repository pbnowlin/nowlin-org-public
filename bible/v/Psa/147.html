vul[16] = "qui dat nivem quasi lanam pruinas quasi cinerem spargit";

dby[20] = "He hath not dealt thus with any nation; and as for [his] judgments, they have not known them. Hallelujah!";
web[20] = "He hath not dealt so with any nation: and [as for his] judgments, they have not known them. Praise ye the LORD.";

csb[1] = "Hallelujah! How good it is to sing to our God, for praise is pleasant and lovely.";
csb[2] = "The LORD rebuilds Jerusalem; he gathers Israel\'s exiled people.";
csb[3] = "He heals the brokenhearted and bandages their wounds.";
csb[4] = "He counts the number of the stars; he gives names to all of them.";
csb[5] = "Our Lord is great, vast in power; his understanding is infinite.";
csb[6] = "The LORD helps the oppressed but brings the wicked to the ground.";
csb[7] = "Sing to the LORD with thanksgiving; play the lyre to our God,";
csb[8] = "who covers the sky with clouds, prepares rain for the earth, and causes grass to grow on the hills.";
csb[9] = "He provides the animals with their food, and the young ravens, what they cry for.";
csb[10] = "He is not impressed by the strength of a horse; he does not value the power of a warrior.";
csb[11] = "The LORD values those who fear him, those who put their hope in his faithful love.";
csb[12] = "Exalt the LORD, Jerusalem; praise your God, Zion!";
csb[13] = "For he strengthens the bars of your city gates and blesses your children within you.";
csb[14] = "He endows your territory with prosperity; he satisfies you with the finest wheat.";
csb[15] = "He sends his command throughout the earth; his word runs swiftly.";
csb[16] = "He spreads snow like wool; he scatters frost like ashes;";
csb[17] = "he throws his hailstones like crumbs. Who can withstand his cold?";
csb[18] = "He sends his word and melts them; he unleashes his winds, and the water flows.";
csb[19] = "He declares his word to Jacob, his statutes and judgments to Israel.";
csb[20] = "He has not done this for every nation; they do not know his judgments. Hallelujah!";
