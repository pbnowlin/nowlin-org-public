kjv[1] = "[[Maschil of David; A Prayer when he was in the cave.]] I cried unto the LORD with my voice; with my voice unto the LORD did I make my supplication.";
rsv[1] = "A Maskil of David, when he was in the cave. A Prayer. I cry with my voice to the LORD, with my voice I make supplication to the LORD,";
asv[1] = "[Maschil of David, when he was in the cave; a Prayer.] I cry with my voice unto Jehovah; With my voice unto Jehovah do I make supplication. ";
yng[1] = "An Instruction of David, a Prayer when he is in the cave. My voice [is] unto Jehovah, I cry, My voice [is] unto Jehovah, I entreat grace.";
dby[1] = "{An instruction of David; when he was in the cave: a prayer.} I cry unto Jehovah with my voice: with my voice unto Jehovah do I make supplication.";
web[1] = "Maschil of David; a prayer when he was in the cave. I cried to the LORD with my voice; with my voice to the LORD I made my supplication.";
hnv[1] = "A maskil by David, when he was in the cave. A Prayer. I cry with my voice to the LORD. With my voice, I ask the LORD for mercy.";
vul[1] = "[Vulgate 141:1] eruditio David cum esset in spelunca oratio [Vulgate 141:2] voce mea ad Dominum clamavi voce mea ad Dominum deprecatus sum";
kjv[2] = "I poured out my complaint before him; I shewed before him my trouble.";
rsv[2] = "I pour out my complaint before him, I tell my trouble before him.";
asv[2] = "I pour out my complaint before him; I show before him my trouble. ";
yng[2] = "I pour forth before Him my meditation, My distress before Him I declare.";
dby[2] = "I pour out my plaint before him; I shew before him my trouble.";
web[2] = "I poured out my complaint before him; I showed before him my trouble.";
hnv[2] = "I pour out my complaint before him. I tell him my troubles.";
vul[2] = "[Vulgate 141:3] effundam in conspectu eius eloquium meum tribulationem meam coram illo adnuntiabo";
kjv[3] = "When my spirit was overwhelmed within me, then thou knewest my path. In the way wherein I walked have they privily laid a snare for me.";
rsv[3] = "When my spirit is faint, thou knowest my way! In the path where I walk they have hidden a trap for me.";
asv[3] = "When my spirit was overwhelmed within me, Thou knewest my path. In the way wherein I walk Have they hidden a snare for me. ";
yng[3] = "When my spirit hath been feeble in me, Then Thou hast known my path; In the way [in] which I walk, They have hid a snare for me.";
dby[3] = "When my spirit was overwhelmed within me, then *thou* knewest my path. In the way wherein I walked have they hidden a snare for me.";
web[3] = "When my spirit was overwhelmed within me, then thou knewest my path. In the way in which I walked have they privily laid a snare for me.";
hnv[3] = "When my spirit was overwhelmed within me, You knew my path. In the way in which I walk, They have hidden a snare for me.";
vul[3] = "[Vulgate 141:4] cum anxius in me fuerit spiritus meus tu enim nosti semitam meam in via hac qua ambulabo absconderunt laqueum mihi";
kjv[4] = "I looked on [my] right hand, and beheld, but [there was] no man that would know me: refuge failed me; no man cared for my soul.";
rsv[4] = "I look to the right and watch, but there is none who takes notice of me; no refuge remains to me, no man cares for me.";
asv[4] = "Look on [my] right hand, and see; For there is no man that knoweth me: Refuge hath failed me; No man careth for my soul. ";
yng[4] = "Looking on the right hand -- and seeing, And I have none recognizing; Perished hath refuge from me, There is none inquiring for my soul.";
dby[4] = "Look on the right hand and see; there is no man that knoweth me: refuge hath failed me; no man careth for my soul.";
web[4] = "I looked on [my] right hand, and beheld, but [there was] no man that would know me: refuge failed me; no man cared for my soul.";
hnv[4] = "Look on my right, and see; For there is no one who is concerned for me. Refuge has fled from me. No one cares for my soul.";
vul[4] = "[Vulgate 141:5] respice ad dexteram et vide quia non sit qui cognoscat me periit fuga a me non est qui quaerat animam meam";
kjv[5] = "I cried unto thee, O LORD: I said, Thou [art] my refuge [and] my portion in the land of the living.";
rsv[5] = "I cry to thee, O LORD; I say, Thou art my refuge, my portion in the land of the living.";
asv[5] = "I cried unto thee, O Jehovah; I said, Thou art my refuge, My portion in the land of the living. ";
yng[5] = "I have cried unto thee, O Jehovah, I have said, `Thou [art] my refuge, My portion in the land of the living.\'";
dby[5] = "I cried unto thee, Jehovah; I said, Thou art my refuge, my portion in the land of the living.";
web[5] = "I cried to thee, O LORD: I said, Thou [art] my refuge [and] my portion in the land of the living.";
hnv[5] = "I cried to you, the LORD. I said, &quot;You are my refuge, My portion in the land of the living.&quot;";
vul[5] = "[Vulgate 141:6] clamavi ad te Domine dixi tu spes mea pars mea in terra viventium";
kjv[6] = "Attend unto my cry; for I am brought very low: deliver me from my persecutors; for they are stronger than I.";
rsv[6] = "Give heed to my cry; for I am brought very low! Deliver me from my persecutors; for they are too strong for me!";
asv[6] = "Attend unto my cry; For I am brought very low: Deliver me from my persecutors; For they are stronger than I. ";
yng[6] = "Attend Thou unto my loud cry, For I have become very low, Deliver Thou me from my pursuers, For they have been stronger than I.";
dby[6] = "Attend unto my cry, for I am brought very low; deliver me from my persecutors, for they are stronger than I.";
web[6] = "Attend to my cry; for I am brought very low: deliver me from my persecutors; for they are stronger than I.";
hnv[6] = "Listen to my cry, For I am in desperate need. Deliver me from my persecutors, For they are stronger than me.";
vul[6] = "[Vulgate 141:7] ausculta deprecationem meam quoniam infirmatus sum nimis libera me a persecutoribus quoniam confortati sunt super me";
kjv[7] = "Bring my soul out of prison, that I may praise thy name: the righteous shall compass me about; for thou shalt deal bountifully with me.";
rsv[7] = "Bring me out of prison, that I may give thanks to thy name! The righteous will surround me; for thou wilt deal bountifully with me.";
asv[7] = "Bring my soul out of prison, That I may give thanks unto thy name: The righteous shall compass me about; For thou wilt deal bountifully with me. ";
yng[7] = "Bring forth from prison my soul to confess Thy name, The righteous do compass me about, When Thou conferrest benefits upon me!";
dby[7] = "Bring my soul out of prison, that I may celebrate thy name. The righteous shall surround me, because thou dealest bountifully with me.";
web[7] = "Bring my soul out of prison, that I may praise thy name: the righteous shall encompass me; for thou wilt deal bountifully with me.";
hnv[7] = "Bring my soul out of prison, That I may give thanks to your name. The righteous will surround me, For you will be good to me. ";
vul[7] = "[Vulgate 141:8] educ de carcere animam meam ut confiteatur nomini tuo me expectant iusti cum retribueris mihi";
csb[1] = "I cry aloud to the LORD; I plead aloud to the LORD for mercy.";
csb[2] = "I pour out my complaint before him; I reveal my trouble to him.";
csb[3] = "Although my spirit is weak within me, you know my way. Along this path I travel they have hidden a trap for me.";
csb[4] = "Look to the right and see: no one stands up for me; there is no refuge for me; no one cares about me.";
csb[5] = "I cry to you, LORD; I say, &quot;You are my shelter, my portion in the land of the living.&quot;";
csb[6] = "Listen to my cry, for I am very weak. Rescue me from those who pursue me, for they are too strong for me.";
csb[7] = "Free me from prison so that I can praise your name. The righteous will gather around me because you deal generously with me.";
</script>
