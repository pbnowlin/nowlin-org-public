csb[1] = "LORD, God of vengeance -- God of vengeance, shine!";
csb[2] = "Rise up, Judge of the earth; repay the proud what they deserve.";
csb[3] = "LORD, how long will the wicked -- how long will the wicked celebrate?";
csb[4] = "They pour out arrogant words; all the evildoers boast.";
csb[5] = "LORD, they crush your people; they oppress your heritage.";
csb[6] = "They kill the widow and the resident alien and murder the fatherless.";
csb[7] = "They say, &quot;The LORD doesn\'t see it. The God of Jacob doesn\'t pay attention.&quot;";
csb[8] = "Pay attention, you stupid people! Fools, when will you be wise?";
csb[9] = "Can the one who shaped the ear not hear, the one who formed the eye not see?";
csb[10] = "The one who instructs nations, the one who teaches mankind knowledge -- does he not discipline?";
csb[11] = "The LORD knows the thoughts of mankind; they are futile.";
csb[12] = "LORD, how happy is anyone you discipline and teach from your law";
csb[13] = "to give him relief from troubled times until a pit is dug for the wicked.";
csb[14] = "The LORD will not leave his people or abandon his heritage,";
csb[15] = "for the administration of justice will again be righteous, and all the upright in heart will follow it.";
csb[16] = "Who stands up for me against the wicked? Who takes a stand for me against evildoers?";
csb[17] = "If the LORD had not been my helper, I would soon rest in the silence of death.";
csb[18] = "If I say, &quot;My foot is slipping,&quot; your faithful love will support me, LORD.";
csb[19] = "When I am filled with cares, your comfort brings me joy.";
csb[20] = "Can a corrupt throne be your ally, a throne that makes evil laws?";
csb[21] = "They band together against the life of the righteous and condemn the innocent to death.";
csb[22] = "But the LORD is my refuge; my God is the rock of my protection.";
csb[23] = "He will pay them back for their sins and destroy them for their evil. The LORD our God will destroy them.";
