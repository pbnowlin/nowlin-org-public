kjv = [];

rsv[1] = "A Psalm of David. I call upon thee, O LORD; make haste to me! Give ear to my voice, when I call to thee!";
asv[1] = "[A Psalm of David.] Jehovah, I have called upon thee; make haste unto me: Give ear unto my voice, when I call unto thee. ";
yng[1] = "A Psalm, by David. O Jehovah, I have called Thee, haste to me, Give ear [to] my voice when I call to Thee.";
dby[1] = "{A Psalm of David.} Jehovah, I have called upon thee: make haste unto me; give ear unto my voice, when I call unto thee.";
web[1] = "A Psalm of David. LORD, I cry to thee: make haste to me; give ear to my voice, when I cry to thee.";
hnv[1] = "A Psalm by David. LORD, I have called on you. Come to me quickly! Listen to my voice when I call to you.";
vul[1] = "[Vulgate 140:1] canticum David Domine clamavi ad te festina mihi exaudi vocem meam clamantis ad te";
rsv[2] = "Let my prayer be counted as incense before thee, and the lifting up of my hands as an evening sacrifice!";
asv[2] = "Let my prayer be set forth as incense before thee; The lifting up of my hands as the evening sacrifice. ";
yng[2] = "My prayer is prepared -- incense before Thee, The lifting up of my hands -- the evening present.";
dby[2] = "Let my prayer be set forth before thee as incense, the lifting up of my hands as the evening oblation.";
web[2] = "Let my prayer be set forth before thee [as] incense; [and] the lifting up of my hands [as] the evening sacrifice.";
hnv[2] = "Let my prayer be set before you like incense; The lifting up of my hands like the evening sacrifice.";
vul[2] = "[Vulgate 140:2] dirigatur oratio mea sicut incensum in conspectu tuo elevatio manuum mearum sacrificium vespertinum";
rsv[3] = "Set a guard over my mouth, O LORD, keep watch over the door of my lips!";
asv[3] = "Set a watch, O Jehovah, before my mouth; Keep the door of my lips. ";
yng[3] = "Set, O Jehovah, a watch for my mouth, Watch Thou over the door of my lips.";
dby[3] = "Set a watch, O Jehovah, before my mouth; keep the door of my lips.";
web[3] = "Set a watch, O LORD, before my mouth; keep the door of my lips.";
hnv[3] = "Set a watch, LORD, before my mouth. Keep the door of my lips.";
vul[3] = "[Vulgate 140:3] pone Domine custodem ori meo serva paupertatem labiorum meorum";
rsv[4] = "Incline not my heart to any evil, to busy myself with wicked deeds in company with men who work iniquity; and let me not eat of their dainties!";
asv[4] = "Incline not my heart to any evil thing, To practise deeds of wickedness With men that work iniquity: And let me not eat of their dainties. ";
yng[4] = "Incline not my heart to an evil thing, To do habitually actions in wickedness, With men working iniquity, Yea, I eat not of their pleasant things.";
dby[4] = "Incline not my heart to any evil thing, to practise deeds of wickedness with men that are workers of iniquity; and let me not eat of their dainties.";
web[4] = "Incline not my heart to [any] evil thing, to practice wicked works with men that work iniquity: and let me not eat of their dainties.";
hnv[4] = "Don\'t incline my heart to any evil thing, To practice deeds of wickedness with men who work iniquity. Don\'t let me eat of their delicacies.";
vul[4] = "[Vulgate 140:4] ne declines cor meum in verbum malum volvere cogitationes impias cum viris operantibus iniquitatem neque comedere in deliciis eorum";
rsv[5] = "Let a good man strike or rebuke me in kindness, but let the oil of the wicked never anoint my head; for my prayer is continually against their wicked deeds.";
asv[5] = "Let the righteous smite me, [it shall be] a kindness; And let him reprove me, [it shall be as] oil upon the head; Let not my head refuse it: For even in their wickedness shall my prayer continue. ";
yng[5] = "The righteous doth beat me [in] kindness. And doth reprove me, Oil of the head my head disalloweth not, For still my prayer [is] about their vexations.";
dby[5] = "Let the righteous smite me, it is kindness; and let him reprove me, it is an excellent oil which my head shall not refuse: for yet my prayer also is [for them] in their calamities.";
web[5] = "Let the righteous smite me; [it shall be] a kindness: and let him reprove me; [it shall be] an excellent oil, [which] shall not break my head: for yet my prayer also [shall be] in their calamities.";
hnv[5] = "Let the righteous strike me, it is kindness; Let him reprove me, it is like oil on the head; Don\'t let my head refuse it; Yet my prayer is always against evil deeds.";
vul[5] = "[Vulgate 140:5] corripiat me iustus in misericordia et arguat me oleum amaritudinis non inpinguet caput meum quia adhuc et oratio mea pro malitiis eorum";
rsv[6] = "When they are given over to those who shall condemn them, then they shall learn that the word of the LORD is true.";
asv[6] = "Their judges are thrown down by the sides of the rock; And they shall hear my words; for they are sweet. ";
yng[6] = "Their judges have been released by the sides of a rock, And they have heard my sayings, For they have been pleasant.";
dby[6] = "When their judges are thrown down from the rocks, they shall hear my words, for they are sweet.";
web[6] = "When their judges are overthrown in stony places, they shall hear my words; for they are sweet.";
hnv[6] = "Their judges are thrown down by the sides of the rock. They will hear my words, for they are well spoken.";
vul[6] = "[Vulgate 140:6] sublati sunt iuxta petram iudices eorum et audient verba mea quoniam decora sunt";
rsv[7] = "As a rock which one cleaves and shatters on the land, so shall their bones be strewn at the mouth of Sheol.";
asv[7] = "As when one ploweth and cleaveth the earth, Our bones are scattered at the mouth of Sheol. ";
yng[7] = "As one tilling and ripping up in the land, Have our bones been scattered at the command of Saul.";
dby[7] = "Our bones are scattered at the mouth of Sheol, as when one cutteth and cleaveth [wood] upon the earth.";
web[7] = "Our bones are scattered at the grave\'s mouth, as when one cutteth and cleaveth [wood] upon the earth.";
hnv[7] = "&quot;As when one plows and breaks up the eretz, Our bones are scattered at the mouth of She\'ol.&quot;";
vul[7] = "[Vulgate 140:7] sicut agricola cum scindit terram sic dissipata sunt ossa nostra in ore inferi";
rsv[8] = "But my eyes are toward thee, O LORD God; in thee I seek refuge; leave me not defenseless!";
asv[8] = "For mine eyes are unto thee, O Jehovah the Lord: In thee do I take refuge; leave not my soul destitute. ";
yng[8] = "But to Thee, O Jehovah, my Lord, [are] mine eyes, In Thee I have trusted, Make not bare my soul.";
dby[8] = "For unto thee, Jehovah, Lord, are mine eyes; in thee do I trust: leave not my soul destitute.";
web[8] = "But my eyes [are] to thee, O GOD the Lord: in thee is my trust; leave not my soul destitute.";
hnv[8] = "For my eyes are on you, LORD, the Lord. In you, I take refuge. Don\'t leave my soul destitute.";
vul[8] = "[Vulgate 140:8] quia ad te Domine Deus oculi mei in te speravi ne evacues animam meam";
rsv[9] = "Keep me from the trap which they have laid for me, and from the snares of evildoers!";
asv[9] = "Keep me from the snare which they have laid for me, And from the gins of the workers of iniquity. ";
yng[9] = "Keep me from the gin they laid for me, Even snares of workers of iniquity.";
dby[9] = "Keep me from the snare which they have laid for me, and from the traps of the workers of iniquity.";
web[9] = "Keep me from the snare [which] they have laid for me, and the gins of the workers of iniquity.";
hnv[9] = "Keep me from the snare which they have laid for me, From the traps of the workers of iniquity.";
vul[9] = "[Vulgate 140:9] custodi me de manibus laquei quod posuerunt mihi et de offendiculis operantium iniquitatem";
kjv[10] = "But mine eyes [are] unto thee, O GOD the Lord: in thee is my trust; leave not my soul destitute.";
rsv[10] = "Let the wicked together fall into their own nets, while I escape.";
asv[10] = "Let the wicked fall into their own nets, Whilst that I withal escape. ";
yng[10] = "The wicked fall in their nets together, till I pass over!";
dby[10] = "Let the wicked fall into their own nets, whilst that *I* withal pass over.";
web[10] = "Let the wicked fall into their own nets, whilst I escape.";
hnv[10] = "Let the wicked fall together into their own nets, While I pass by. ";
vul[10] = "[Vulgate 140:10] incident in rete eius impii simul ego autem transibo";
csb[1] = "LORD, I call on you; hurry to help me. Listen to my voice when I call on you.";
csb[2] = "May my prayer be set before you as incense, the raising of my hands as the evening offering.";
csb[3] = "LORD, set up a guard for my mouth; keep watch at the door of my lips.";
csb[4] = "Do not let my heart turn to any evil thing or perform wicked acts with men who commit sin. Do not let me feast on their delicacies.";
csb[5] = "Let the righteous one strike me -- it is an act of faithful love; let him rebuke me -- it is oil for my head; let me not refuse it. Even now my prayer is against the evil acts of the wicked.";
csb[6] = "When their rulers will be thrown off the sides of a cliff, the people will listen to my words, for they are pleasing.";
csb[7] = "As when one plows and breaks up the soil, turning up rocks, so our bones have been scattered at the mouth of Sheol.";
csb[8] = "But my eyes look to you, LORD, my Lord. I seek refuge in you; do not let me die.";
csb[9] = "Protect me from the trap they have set for me, and from the snares of evildoers.";
csb[10] = "Let the wicked fall into their own nets, while I pass by safely.";

kjv[6] = "When their judges are overthrown in stony places, they shall hear my words; for they are sweet.";
kjv[7] = "Our bones are scattered at the grave's mouth, as when one cutteth and cleaveth [wood] upon the earth.";

kjv[10] = "Let the wicked fall into their own nets, whilst that I withal escape.";

</script>
