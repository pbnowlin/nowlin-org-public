kjv[1] = "[[A Song [or] Psalm for the sons of Korah, to the chief Musician upon Mahalath Leannoth, Maschil of Heman the Ezrahite.]] O LORD God of my salvation, I have cried day [and] night before thee:";
rsv[1] = "A Song. A Psalm of the Sons of Korah. To the choirmaster: according to Mahalath Leannoth. A Maskil of Heman the Ezrahite. O LORD, my God, I call for help by day; I cry out in the night before thee.";
asv[1] = "[A Song, a Psalm of the sons of Korah; for the Chief Musician; set to Mahalath Leannoth. Maschil of Heman the Ezrahite.] O Jehovah, the God of my salvation, I have cried day and night before thee. ";
yng[1] = "A Song, a Psalm, by sons of Korah, to the Overseer, `Concerning the Sickness of Afflictions.\' -- An instruction, by Heman the Ezrahite. O Jehovah, God of my salvation, Daily I have cried, nightly before Thee,";
dby[1] = "{A Song, a Psalm for the sons of Korah. To the chief Musician. Upon Mahalath Leannoth. An instruction. Of Heman the Ezrahite.} Jehovah, God of my salvation, I have cried by day [and] in the night before thee.";
web[1] = "A Song [or] Psalm for the sons of Korah, to the chief Musician upon Mahalath Leannoth, Maschil of Heman the Ezrahite. O LORD God of my salvation, I have cried day [and] night before thee:";
hnv[1] = "A Song. A Psalm by the sons of Korach. For the Chief Musician. To the tune &quot;The Suffering of Affliction.&quot; A maskil by Heman, the Ezrachite. LORD, the God of my salvation, I have cried day and night before you.";
vul[1] = "[Vulgate 87:1] canticum carminis filiorum Core victori per chorum ad praecinendum eruditionis Eman Ezraitae [Vulgate 87:2] Domine Deus salutis meae per diem clamavi in nocte coram te";
kjv[2] = "Let my prayer come before thee: incline thine ear unto my cry;";
rsv[2] = "Let my prayer come before thee, incline thy ear to my cry!";
asv[2] = "Let my prayer enter into thy presence; Incline thine ear unto my cry. ";
yng[2] = "My prayer cometh in before Thee, Incline Thine ear to my loud cry,";
dby[2] = "Let my prayer come before thee; incline thine ear unto my cry.";
web[2] = "Let my prayer come before thee: incline thy ear to my cry;";
hnv[2] = "Let my prayer enter into your presence. Turn your ear to my cry.";
vul[2] = "[Vulgate 87:3] ingrediatur ante te oratio mea inclina aurem tuam ad laudationem meam";
kjv[3] = "For my soul is full of troubles: and my life draweth nigh unto the grave.";
rsv[3] = "For my soul is full of troubles, and my life draws near to Sheol.";
asv[3] = "For my soul is full of troubles, And my life draweth nigh unto Sheol. ";
yng[3] = "For my soul hath been full of evils, And my life hath come to Sheol.";
dby[3] = "For my soul is full of troubles, and my life draweth nigh to Sheol.";
web[3] = "For my soul is full of troubles: and my life draweth nigh to the grave.";
hnv[3] = "For my soul is full of troubles. My life draws near to She\'ol.";
vul[3] = "[Vulgate 87:4] quia repleta est malis anima mea et vita mea ad infernum descendit";
kjv[4] = "I am counted with them that go down into the pit: I am as a man [that hath] no strength:";
rsv[4] = "I am reckoned among those who go down to the Pit; I am a man who has no strength,";
asv[4] = "I am reckoned with them that go down into the pit; I am as a man that hath no help, ";
yng[4] = "I have been reckoned with those going down [to] the pit, I have been as a man without strength.";
dby[4] = "I am reckoned with them that go down into the pit; I am as a man that hath no strength:";
web[4] = "I am counted with them that go down into the pit: I am as a man [that hath] no strength:";
hnv[4] = "I am counted among those who go down into the pit. I am like a man who has no help,";
vul[4] = "[Vulgate 87:5] reputatus sum cum descendentibus lacum factus sum quasi homo invalidus";
kjv[5] = "Free among the dead, like the slain that lie in the grave, whom thou rememberest no more: and they are cut off from thy hand.";
rsv[5] = "like one forsaken among the dead, like the slain that lie in the grave, like those whom thou dost remember no more, for they are cut off from thy hand.";
asv[5] = "Cast off among the dead, Like the slain that lie in the grave, Whom thou rememberest no more, And they are cut off from thy hand. ";
yng[5] = "Among the dead -- free, As pierced ones lying in the grave, Whom Thou hast not remembered any more, Yea, they by Thy hand have been cut off.";
dby[5] = "Prostrate among the dead, like the slain that lie in the grave; whom thou rememberest no more, and who are cut off from thy hand.";
web[5] = "Free among the dead, like the slain that lie in the grave, whom thou rememberest no more: and they are cut off from thy hand.";
hnv[5] = "Set apart among the dead, Like the slain who lie in the grave, Whom you remember no more. They are cut off from your hand.";
vul[5] = "[Vulgate 87:6] inter mortuos liber sicut interfecti et dormientes in sepulchro quorum non recordaris amplius et qui a manu tua abscisi sunt";
kjv[6] = "Thou hast laid me in the lowest pit, in darkness, in the deeps.";
rsv[6] = "Thou hast put me in the depths of the Pit, in the regions dark and deep.";
asv[6] = "Thou hast laid me in the lowest pit, In dark places, in the deeps. ";
yng[6] = "Thou hast put me in the lowest pit, In dark places, in depths.";
dby[6] = "Thou hast laid me in the lowest pit, in dark places, in the deeps.";
web[6] = "Thou hast laid me in the lowest pit, in darkness, in the deeps.";
hnv[6] = "You have laid me in the lowest pit, In the darkest depths.";
vul[6] = "[Vulgate 87:7] posuisti me in lacu novissimo in tenebris in profundis";
kjv[7] = "Thy wrath lieth hard upon me, and thou hast afflicted [me] with all thy waves. Selah.";
rsv[7] = "Thy wrath lies heavy upon me, and thou dost overwhelm me with all thy waves. [Selah]";
asv[7] = "Thy wrath lieth hard upon me, And thou hast afflicted me with all thy waves. [Selah";
yng[7] = "Upon me hath Thy fury lain, And [with] all Thy breakers Thou hast afflicted. Selah.";
dby[7] = "Thy fury lieth hard upon me, and thou hast afflicted [me] with all thy waves. Selah.";
web[7] = "Thy wrath lieth hard upon me, and thou hast afflicted [me] with all thy waves. Selah.";
hnv[7] = "Your wrath lies heavily on me. You have afflicted me with all your waves. Selah.";
vul[7] = "[Vulgate 87:8] super me confirmatus est furor tuus et cunctis fluctibus tuis adflixisti me semper";
kjv[8] = "Thou hast put away mine acquaintance far from me; thou hast made me an abomination unto them: [I am] shut up, and I cannot come forth.";
rsv[8] = "Thou hast caused my companions to shun me; thou hast made me a thing of horror to them. I am shut in so that I cannot escape;";
asv[8] = "Thou hast put mine acquaintance far from me; Thou hast made me an abomination unto them: I am shut up, and I cannot come forth. ";
yng[8] = "Thou hast put mine acquaintance far from me, Thou hast made me an abomination to them, Shut up -- I go not forth.";
dby[8] = "Thou hast put my familiar friends far from me; thou hast made me an abomination unto them: I am shut up, and I cannot come forth.";
web[8] = "Thou hast put away my acquaintance far from me; thou hast made me an abomination to them: [I am] shut up, and I cannot come forth.";
hnv[8] = "You have taken my friends from me. You have made me an abomination to them. I am confined, and I can\'t escape.";
vul[8] = "[Vulgate 87:9] longe fecisti notos meos a me posuisti me abominationem eis clausum et non prodeuntem";
kjv[9] = "Mine eye mourneth by reason of affliction: LORD, I have called daily upon thee, I have stretched out my hands unto thee.";
rsv[9] = "my eye grows dim through sorrow. Every day I call upon thee, O LORD; I spread out my hands to thee.";
asv[9] = "Mine eye wasteth away by reason of affliction: I have called daily upon thee, O Jehovah; I have spread forth my hands unto thee. ";
yng[9] = "Mine eye hath grieved because of affliction, I called Thee, O Jehovah, all the day, I have spread out unto Thee my hands.";
dby[9] = "Mine eye consumeth by reason of affliction. Upon thee, Jehovah, have I called every day; I have stretched out my hands unto thee.";
web[9] = "My eye mourneth by reason of affliction: LORD, I have called daily upon thee, I have stretched out my hands to thee.";
hnv[9] = "My eyes are dim from grief. I have called on you daily, LORD. I have spread out my hands to you.";
vul[9] = "[Vulgate 87:10] oculus meus infirmatus est ab adflictione invocavi te Domine tota die expandi ad te palmas meas";
kjv[10] = "Wilt thou shew wonders to the dead? shall the dead arise [and] praise thee? Selah.";
rsv[10] = "Dost thou work wonders for the dead? Do the shades rise up to praise thee? [Selah]";
asv[10] = "Wilt thou show wonders to the dead? Shall they that are deceased arise and praise thee? [Selah";
yng[10] = "To the dead dost Thou do wonders? Do Rephaim rise? do they thank Thee? Selah.";
dby[10] = "Wilt thou do wonders to the dead? shall the shades arise and praise thee? Selah.";
web[10] = "Wilt thou show wonders to the dead? shall the dead arise [and] praise thee? Selah.";
hnv[10] = "Do you show wonders to the dead? Do the dead rise up and praise you? Selah.";
vul[10] = "[Vulgate 87:11] numquid mortuis facies mirabilia aut gigantes surgent et confitebuntur tibi semper";
kjv[11] = "Shall thy lovingkindness be declared in the grave? [or] thy faithfulness in destruction?";
rsv[11] = "Is thy steadfast love declared in the grave, or thy faithfulness in Abaddon?";
asv[11] = "Shall thy lovingkindness be declared in the grave? Or thy faithfulness in Destruction? ";
yng[11] = "Is Thy kindness recounted in the grave? Thy faithfulness in destruction?";
dby[11] = "Shall thy loving-kindness be declared in the grave? thy faithfulness in Destruction?";
web[11] = "Shall thy loving-kindness be declared in the grave? [or] thy faithfulness in destruction?";
hnv[11] = "Is your lovingkindness declared in the grave? Or your faithfulness in Destruction?";
vul[11] = "[Vulgate 87:12] numquid narrabitur in sepulchro misericordia tua et veritas tua in perditione";
kjv[12] = "Shall thy wonders be known in the dark? and thy righteousness in the land of forgetfulness?";
rsv[12] = "Are thy wonders known in the darkness, or thy saving help in the land of forgetfulness?";
asv[12] = "Shall thy wonders be known in the dark? And thy righteousness in the land of forgetfulness? ";
yng[12] = "Are Thy wonders known in the darkness? And Thy righteousness in the land of forgetfulness?";
dby[12] = "Shall thy wonders be known in the dark? and thy righteousness in the land of forgetfulness?";
web[12] = "Shall thy wonders be known in the dark? and thy righteousness in the land of forgetfulness?";
hnv[12] = "Are your wonders made known in the dark? Or your righteousness in the land of forgetfulness?";
vul[12] = "[Vulgate 87:13] numquid noscentur in tenebris mirabilia tua et iustitia tua in terra quae oblivioni tradita est";
kjv[13] = "But unto thee have I cried, O LORD; and in the morning shall my prayer prevent thee.";
rsv[13] = "But I, O LORD, cry to thee; in the morning my prayer comes before thee.";
asv[13] = "But unto thee, O Jehovah, have I cried; And in the morning shall my prayer come before thee. ";
yng[13] = "And I, unto Thee, O Jehovah, I have cried, And in the morning doth my prayer come before Thee.";
dby[13] = "But as for me, Jehovah, I cry unto thee, and in the morning my prayer cometh before thee.";
web[13] = "But to thee have I cried, O LORD; and in the morning shall my prayer come before thee.";
hnv[13] = "But to you, LORD, I have cried. In the morning, my prayer comes before you.";
vul[13] = "[Vulgate 87:14] ego autem ad te Domine clamavi et mane oratio mea praeveniet te";
kjv[14] = "LORD, why castest thou off my soul? [why] hidest thou thy face from me?";
rsv[14] = "O LORD, why dost thou cast me off? Why dost thou hide thy face from me?";
asv[14] = "Jehovah, why castest thou off my soul? Why hidest thou thy face from me? ";
yng[14] = "Why, O Jehovah, castest Thou off my soul? Thou hidest Thy face from me.";
dby[14] = "Why, O Jehovah, castest thou off my soul? [why] hidest thou thy face from me?";
web[14] = "LORD, why castest thou off my soul? [why] hidest thou thy face from me?";
hnv[14] = "LORD, why do you reject my soul? Why do you hide your face from me?";
vul[14] = "[Vulgate 87:15] quare Domine abicis animam meam abscondis faciem tuam a me";
kjv[15] = "I [am] afflicted and ready to die from [my] youth up: [while] I suffer thy terrors I am distracted.";
rsv[15] = "Afflicted and close to death from my youth up, I suffer thy terrors; I am helpless.";
asv[15] = "I am afflicted and ready to die from my youth up: While I suffer thy terrors I am distracted. ";
yng[15] = "I [am] afflicted, and expiring from youth, I have borne Thy terrors -- I pine away.";
dby[15] = "I am afflicted and expiring from my youth up; I suffer thy terrors, [and] I am distracted.";
web[15] = "I [am] afflicted and ready to die from [my] youth up: [while] I suffer thy terrors I am distracted.";
hnv[15] = "I am afflicted and ready to die from my youth up. While I suffer your terrors, I am distracted.";
vul[15] = "[Vulgate 87:16] pauper ego et aerumnosus ab adulescentia portavi furorem tuum et conturbatus sum";
kjv[16] = "Thy fierce wrath goeth over me; thy terrors have cut me off.";
rsv[16] = "Thy wrath has swept over me; thy dread assaults destroy me.";
asv[16] = "Thy fierce wrath is gone over me; Thy terrors have cut me off. ";
yng[16] = "Over me hath Thy wrath passed, Thy terrors have cut me off,";
dby[16] = "Thy fierce anger hath gone over me; thy terrors have brought me to nought:";
web[16] = "Thy fierce wrath goeth over me; thy terrors have cut me off.";
hnv[16] = "Your fierce wrath has gone over me. Your terrors have cut me off.";
vul[16] = "[Vulgate 87:17] per me transierunt irae tuae terrores tui oppresserunt me";
kjv[17] = "They came round about me daily like water; they compassed me about together.";
rsv[17] = "They surround me like a flood all day long; they close in upon me together.";
asv[17] = "They came round about me like water all the day long; They compassed me about together. ";
yng[17] = "They have surrounded me as waters all the day, They have gone round against me together,";
dby[17] = "They have surrounded me all the day like water; they have compassed me about together.";
web[17] = "They came around me daily like water; they encompassed me together.";
hnv[17] = "They came around me like water all day long. They completely engulfed me.";
vul[17] = "[Vulgate 87:18] circumdederunt me quasi aquae tota die vallaverunt me pariter";
kjv[18] = "Lover and friend hast thou put far from me, [and] mine acquaintance into darkness.";
rsv[18] = "Thou hast caused lover and friend to shun me; my companions are in darkness.";
asv[18] = "Lover and friend hast thou put far from me, And mine acquaintance into darkness. ";
yng[18] = "Thou hast put far from me lover and friend, Mine acquaintance [is] the place of darkness!";
dby[18] = "Lover and associate hast thou put far from me: my familiar friends are darkness.";
web[18] = "Lover and friend hast thou put far from me, [and] my acquaintance into darkness.";
hnv[18] = "You have put lover and friend far from me, And my friends into darkness. ";
vul[18] = "[Vulgate 87:19] longe fecisti a me amicum et sodalem notos meos abstulisti";
csb[1] = "LORD, God of my salvation, I cry out before you day and night.";
csb[2] = "May my prayer reach your presence; listen to my cry.";
csb[3] = "For I have had enough troubles, and my life is near Sheol.";
csb[4] = "I am counted among those going down to the Pit. I am like a man without strength,";
csb[5] = "abandoned among the dead. I am like the slain lying in the grave, whom you no longer remember, and who are cut off from your care.";
csb[6] = "You have put me in the lowest part of the Pit, in the darkest places, in the depths.";
csb[7] = "Your wrath weighs heavily on me; you have overwhelmed me with all your waves. Selah";
csb[8] = "You have distanced my friends from me; you have made me repulsive to them. I am shut in and cannot go out.";
csb[9] = "My eyes are worn out from crying. LORD, I cry out to you all day long; I spread out my hands to you.";
csb[10] = "Do you work wonders for the dead? Do departed spirits rise up to praise you? Selah";
csb[11] = "Will your faithful love be declared in the grave, your faithfulness in Abaddon?";
csb[12] = "Will your wonders be known in the darkness or your righteousness in the land of oblivion?";
csb[13] = "But I call to you for help, LORD; in the morning my prayer meets you.";
csb[14] = "LORD, why do you reject me? Why do you hide your face from me?";
csb[15] = "From my youth, I have been suffering and near death. I suffer your horrors; I am desperate.";
csb[16] = "Your wrath sweeps over me; your terrors destroy me.";
csb[17] = "They surround me like water all day long; they close in on me from every side.";
csb[18] = "You have distanced loved one and neighbor from me; darkness is my only friend.";
