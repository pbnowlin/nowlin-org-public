csb[1] = "LORD, hear my prayer; let my cry for help come before you.";
csb[2] = "Do not hide your face from me in my day of trouble. Listen closely to me; answer me quickly when I call.";
csb[3] = "For my days vanish like smoke, and my bones burn like a furnace.";
csb[4] = "My heart is suffering, withered like grass; I even forget to eat my food.";
csb[5] = "Because of the sound of my groaning, my flesh sticks to my bones.";
csb[6] = "I am like an eagle owl, like a little owl among the ruins.";
csb[7] = "I stay awake; I am like a solitary bird on a roof.";
csb[8] = "My enemies taunt me all day long; they ridicule and use my name as a curse.";
csb[9] = "I eat ashes like bread and mingle my drinks with tears";
csb[10] = "because of your indignation and wrath; for you have picked me up and thrown me aside.";
csb[11] = "My days are like a lengthening shadow, and I wither away like grass.";
csb[12] = "But you, LORD, are enthroned forever; your fame endures to all generations.";
csb[13] = "You will rise up and have compassion on Zion, for it is time to show favor to her -- the appointed time has come.";
csb[14] = "For your servants take delight in its stones and favor its dust.";
csb[15] = "Then the nations will fear the name of the LORD, and all the kings of the earth your glory,";
csb[16] = "for the LORD will rebuild Zion; he will appear in his glory.";
csb[17] = "He will pay attention to the prayer of the destitute and will not despise their prayer.";
csb[18] = "This will be written for a later generation, and a people who have not yet been created will praise the LORD:";
csb[19] = "He looked down from his holy heights -- the LORD gazed out from heaven to earth --";
csb[20] = "to hear a prisoner\'s groaning, to set free those condemned to die,";
csb[21] = "so that they might declare the name of the LORD in Zion and his praise in Jerusalem,";
csb[22] = "when peoples and kingdoms are assembled to serve the LORD.";
csb[23] = "He has broken my strength in midcourse; he has shortened my days.";
csb[24] = "I say: &quot;My God, do not take me in the middle of my life! Your years continue through all generations.";
csb[25] = "&quot;Long ago you established the earth, and the heavens are the work of your hands.";
csb[26] = "&quot;They will perish, but you will endure; all of them will wear out like clothing. You will change them like a garment, and they will pass away.";
csb[27] = "&quot;But you are the same, and your years will never end.";
csb[28] = "&quot;Your servants\' children will dwell securely, and their offspring will be established before you.&quot;";
