csb[1] = "Listen to my words, LORD; consider my sighing.";
csb[2] = "Pay attention to the sound of my cry, my King and my God, for I pray to you.";

csb[8] = "LORD, lead me in your righteousness because of my adversaries; make your way straight before me.";

csb[11] = "But let all who take refuge in you rejoice; let them shout for joy forever. May you shelter them, and may those who love your name boast about you.";
csb[12] = "For you, LORD, bless the righteous one; you surround him with favor like a shield.";
