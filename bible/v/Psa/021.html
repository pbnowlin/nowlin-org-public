csb[1] = "LORD, the king finds joy in your strength. How greatly he rejoices in your victory!";
csb[2] = "You have given him his heart\'s desire and have not denied the request of his lips. Selah";
csb[3] = "For you meet him with rich blessings; you place a crown of pure gold on his head.";
csb[4] = "He asked you for life, and you gave it to him -- length of days forever and ever.";
csb[5] = "His glory is great through your victory; you confer majesty and splendor on him.";
csb[6] = "You give him blessings forever; you cheer him with joy in your presence.";
csb[7] = "For the king relies on the LORD; through the faithful love of the Most High he is not shaken.";
csb[8] = "Your hand will capture all your enemies; your right hand will seize those who hate you.";
csb[9] = "You will make them burn like a fiery furnace when you appear; the LORD will engulf them in his wrath, and fire will devour them.";
csb[10] = "You will wipe their progeny from the earth and their offspring from the human race.";
csb[11] = "Though they intend to harm you and devise a wicked plan, they will not prevail.";
csb[12] = "Instead, you will put them to flight when you ready your bowstrings to shoot at them.";
csb[13] = "Be exalted, LORD, in your strength; we will sing and praise your might.";
