csb[1] = "The pronouncement that the prophet Habakkuk saw.";
csb[2] = "How long, LORD, must I call for help and you do not listen or cry out to you about violence and you do not save?";
csb[3] = "Why do you force me to look at injustice? Why do you tolerate wrongdoing? Oppression and violence are right in front of me. Strife is ongoing, and conflict escalates.";
csb[4] = "This is why the law is ineffective and justice never emerges. For the wicked restrict the righteous; therefore, justice comes out perverted.";
csb[5] = "Look at the nations and observe -- be utterly astounded! For I am doing something in your days that you will not believe when you hear about it.";
csb[6] = "Look! I am raising up the Chaldeans, that bitter, impetuous nation that marches across the earth\'s open spaces to seize territories not its own.";
csb[7] = "They are fierce and terrifying; their views of justice and sovereignty stem from themselves.";
csb[8] = "Their horses are swifter than leopards and more fierce than wolves of the night. Their horsemen charge ahead; their horsemen come from distant lands. They fly like eagles, swooping to devour.";
csb[9] = "All of them come to do violence; their faces are set in determination. They gather prisoners like sand.";
csb[10] = "They mock kings, and rulers are a joke to them. They laugh at every fortress and build siege ramps to capture it.";
csb[11] = "Then they sweep by like the wind and pass through. They are guilty; their strength is their god.";
csb[12] = "Are you not from eternity, LORD my God? My Holy One, you will not die. LORD, you appointed them to execute judgment; my Rock, you destined them to punish us.";
csb[13] = "Your eyes are too pure to look on evil, and you cannot tolerate wrongdoing. So why do you tolerate those who are treacherous? Why are you silent while one who is wicked swallows up one who is more righteous than himself?";
csb[14] = "You have made mankind like the fish of the sea, like marine creatures that have no ruler.";
csb[15] = "The Chaldeans pull them all up with a hook, catch them in their dragnet, and gather them in their fishing net; that is why they are glad and rejoice.";
csb[16] = "That is why they sacrifice to their dragnet and burn incense to their fishing net, for by these things their portion is rich and their food plentiful.";
csb[17] = "Will they therefore empty their net and continually slaughter nations without mercy?";

kjv[2] = "O LORD, how long shall I cry, and thou wilt not hear! [even] cry out unto thee [of] violence, and thou wilt not save!";
rsv[2] = "O LORD, how long shall I cry for help, and thou wilt not hear? Or cry to thee &quot;Violence!&quot; and thou wilt not save?";
asv[2] = "O Jehovah, how long shall I cry, and thou wilt not hear? I cry out unto thee of violence, and thou wilt not save.";
yng[2] = "Till when, O Jehovah, have I cried, And Thou dost not hear? I cry unto Thee -- `Violence,\' and Thou dost not save.";
dby[2] = "Jehovah, how long shall I cry and thou wilt not hear? I cry out unto thee, Violence! and thou dost not save.";
web[2] = "O LORD, how long shall I cry, and thou wilt not hear! [even] cry out to thee [of] violence, and thou wilt not save!";
hnv[2] = "LORD, how long will I cry, and you will not hear? I cry out to you &quot;Violence!&quot; and will you not save?";
vul[2] = "usquequo Domine clamabo et non exaudies vociferabor ad te vim patiens et non salvabis";
kjv[3] = "Why dost thou shew me iniquity, and cause [me] to behold grievance? for spoiling and violence [are] before me: and there are [that] raise up strife and contention.";
rsv[3] = "Why dost thou make me see wrongs and look upon trouble? Destruction and violence are before me; strife and contention arise.";
asv[3] = "Why dost thou show me iniquity, and look upon perverseness? for destruction and violence are before me; and there is strife, and contention riseth up.";
yng[3] = "Why dost Thou shew me iniquity, And perversity dost cause to behold? And spoiling and violence [are] before me, And there is strife, and contention doth lift [itself] up,";
dby[3] = "Why dost thou cause me to see iniquity, and lookest thou upon grievance? For spoiling and violence are before me; and there is strife, and contention riseth up.";
web[3] = "Why dost thou show me iniquity, and cause [me] to behold grievance? for devastation and violence [are] before me: and there are [that] raise strife and contention.";
hnv[3] = "Why do you show me iniquity, and look at perversity? For destruction and violence are before me. There is strife, and contention rises up.";
vul[3] = "quare ostendisti mihi iniquitatem et laborem videre praeda et iniustitia contra me et factum est iudicium et contradictio potentior";
kjv[4] = "Therefore the law is slacked, and judgment doth never go forth: for the wicked doth compass about the righteous; therefore wrong judgment proceedeth.";
rsv[4] = "So the law is slacked and justice never goes forth. For the wicked surround the righteous, so justice goes forth perverted.";
asv[4] = "Therefore the law is slacked, and justice doth never go forth; for the wicked doth compass about the righteous; therefore justice goeth forth perverted.";
yng[4] = "Therefore doth law cease, And judgment doth not go forth for ever, For the wicked is compassing the righteous, Therefore wrong judgment goeth forth.";
dby[4] = "Therefore the law is powerless, and justice doth never go forth; for the wicked encompasseth the righteous; therefore judgment goeth forth perverted.";
web[4] = "Therefore the law is slackened, and judgment doth never go forth: for the wicked doth encompass the righteous; therefore wrong judgment proceedeth.";
hnv[4] = "Therefore the law is paralyzed, and justice never goes forth; for the wicked surround the righteous; therefore justice goes forth perverted.";
vul[4] = "propter hoc lacerata est lex et non pervenit usque ad finem iudicium quia impius praevalet adversus iustum propterea egreditur iudicium perversum";
kjv[5] = "Behold ye among the heathen, and regard, and wonder marvellously: for [I] will work a work in your days, [which] ye will not believe, though it be told [you].";
rsv[5] = "Look among the nations, and see; wonder and be astounded. For I am doing a work in your days that you would not believe if told.";
asv[5] = "Behold ye among the nations, and look, and wonder marvellously; for I am working a work in your days, which ye will not believe though it be told you.";
yng[5] = "Look ye on nations, and behold and marvel greatly. For a work He is working in your days, Ye do not believe though it is declared.";
dby[5] = "See ye among the nations, and behold, and wonder marvellously; for [I] work a work in your days, which ye will not believe, though it be declared [to you].";
web[5] = "Behold ye among the heathen, and regard, and wonder marvelously: for [I] will work a work in your days, [which] ye will not believe though it be told [you].";
hnv[5] = "&quot;Look among the nations, watch, and wonder marvelously; for I am working a work in your days, which you will not believe though it is told you.";

rsv[7] = "Dread and terrible are they; their justice and dignity proceed from themselves.";
asv[7] = "They are terrible and dreadful; their judgment and their dignity proceed from themselves.";

dby[7] = "They are terrible and dreadful: their judgment and their dignity proceed from themselves.";
web[7] = "They [are] terrible and dreadful: their judgment and their dignity shall proceed from themselves.";

kjv[8] = "Their horses also are swifter than the leopards, and are more fierce than the evening wolves: and their horsemen shall spread themselves, and their horsemen shall come from far; they shall fly as the eagle [that] hasteth to eat.";
rsv[8] = "Their horses are swifter than leopards, more fierce than the evening wolves; their horsemen press proudly on. Yea, their horsemen come from afar; they fly like an eagle swift to devour.";
asv[8] = "Their horses also are swifter than leopards, and are more fierce than the evening wolves; and their horsemen press proudly on: yea, their horsemen come from far; they fly as an eagle that hasteth to devour.";
yng[8] = "Swifter than leopards have been its horses, And sharper than evening wolves, And increased have its horsemen, Even its horsemen from afar come in, They fly as an eagle, hasting to consume.";
dby[8] = "And their horses are swifter than the leopards, and are more agile than the evening wolves; and their horsemen prance proudly, and their horsemen come from afar: they fly as an eagle that hasteth to devour.";
web[8] = "Their horses also are swifter than the leopards, and are more fierce than the evening wolves: and their horsemen shall spread themselves, and their horsemen shall come from far; they shall fly as the eagle [that] hasteth to eat.";
hnv[8] = "Their horses also are swifter than leopards, and are more fierce than the evening wolves. Their horsemen press proudly on. Yes, their horsemen come from afar. They fly as an eagle that hurries to devour.";

kjv[10] = "And they shall scoff at the kings, and the princes shall be a scorn unto them: they shall deride every strong hold; for they shall heap dust, and take it.";
rsv[10] = "At kings they scoff, and of rulers they make sport. They laugh at every fortress, for they heap up earth and take it.";
asv[10] = "Yea, he scoffeth at kings, and princes are a derision unto him; he derideth every stronghold; for he heapeth up dust, and taketh it.";
yng[10] = "And at kings it doth scoff, And princes [are] a laughter to it, At every fenced place it doth laugh, And it heapeth up dust, and captureth it.";
dby[10] = "Yea, he scoffeth at kings, and princes are a scorn unto him; he derideth every stronghold: for he heapeth up dust, and taketh it.";

hnv[10] = "Yes, he scoffs at kings, and princes are a derision to him. He laughs at every stronghold, for he builds up an earthen ramp, and takes it.";

yng[11] = "Then passed on hath the spirit, Yea, he doth transgress, And doth ascribe this his power to his god.";
dby[11] = "Then will his mind change, and he will pass on, and become guilty: this his power is become his god.";
web[11] = "Then shall [his] mind change, and he shall pass over, and offend, [imputing] this his power to his god.";
hnv[11] = "Then he sweeps by like the wind, and goes on. He is indeed guilty, whose strength is his god.&quot;";

yng[12] = "Art not Thou of old, O Jehovah, my God, my Holy One? We do not die, O Jehovah, For judgment Thou hast appointed it, And, O Rock, for reproof Thou hast founded it.";
dby[12] = "-- Art thou not from everlasting, Jehovah my God, my Holy One? We shall not die. Jehovah, thou hast ordained him for judgment; and thou, O Rock, hast appointed him for correction.";

hnv[12] = "Aren\'t you from everlasting, LORD my God, my Holy One? We will not die. LORD, you have appointed him for judgment. You, Rock, have established him to punish.";

yng[13] = "Purer of eyes than to behold evil, To look on perverseness Thou art not able, Why dost Thou behold the treacherous? Thou keepest silent when the wicked Doth swallow the more righteous than he,";
dby[13] = "[Thou art] of purer eyes than to behold evil, and canst not look on mischief: wherefore lookest thou upon them that deal treacherously, [and] keepest silence when the wicked swalloweth up a [man] more righteous than he?";
