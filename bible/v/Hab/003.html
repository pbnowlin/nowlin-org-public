csb[1] = "A prayer of the prophet Habakkuk. According to Shigionoth.";
csb[2] = "LORD, I have heard the report about you; LORD, I stand in awe of your deeds. Revive your work in these years; make it known in these years. In your wrath remember mercy!";
csb[3] = "God comes from Teman, the Holy One from Mount Paran. Selah His splendor covers the heavens, and the earth is full of his praise.";
csb[4] = "His brilliance is like light; rays are flashing from his hand. This is where his power is hidden.";
csb[5] = "Plague goes before him, and pestilence follows in his steps.";
csb[6] = "He stands and shakes the earth; he looks and startles the nations. The age-old mountains break apart; the ancient hills sink down. His pathways are ancient.";
csb[7] = "I see the tents of Cushan in distress; the tent curtains of the land of Midian tremble.";
csb[8] = "Are you angry at the rivers, LORD? Is your wrath against the rivers? Or is your rage against the sea when you ride on your horses, your victorious chariot?";
csb[9] = "You took the sheath from your bow; the arrows are ready to be used with an oath. Selah You split the earth with rivers.";
csb[10] = "The mountains see you and shudder; a downpour of water sweeps by. The deep roars with its voice and lifts its waves high.";
csb[11] = "Sun and moon stand still in their lofty residence, at the flash of your flying arrows, at the brightness of your shining spear.";
csb[12] = "You march across the earth with indignation; you trample down the nations in wrath.";
csb[13] = "You come out to save your people, to save your anointed. You crush the leader of the house of the wicked and strip him from foot to neck. Selah";
csb[14] = "You pierce his head with his own spears; his warriors storm out to scatter us, gloating as if ready to secretly devour the weak.";
csb[15] = "You tread the sea with your horses, stirring up the vast water.";
csb[16] = "I heard, and I trembled within; my lips quivered at the sound. Rottenness entered my bones; I trembled where I stood. Now I must quietly wait for the day of distress to come against the people invading us.";
csb[17] = "Though the fig tree does not bud and there is no fruit on the vines, though the olive crop fails and the fields produce no food, though the flocks disappear from the pen and there are no herds in the stalls,";
csb[18] = "yet I will celebrate in the LORD; I will rejoice in the God of my salvation!";
csb[19] = "The LORD my Lord is my strength; he makes my feet like those of a deer and enables me to walk on mountain heights! For the choir director: on stringed instruments.";

kjv[2] = "O LORD, I have heard thy speech, [and] was afraid: O LORD, revive thy work in the midst of the years, in the midst of the years make known; in wrath remember mercy.";

asv[2] = "O Jehovah, I have heard the report of thee, and am afraid: O Jehovah, revive thy work in the midst of the years; In the midst of the years make it known; In wrath remember mercy. ";
yng[2] = "O Jehovah, I heard thy report, I have been afraid, O Jehovah, Thy work! in midst of years revive it, In the midst of years Thou makest known In anger Thou dost remember mercy.";
dby[2] = "Jehovah, I heard the report of thee, [and] I feared. Jehovah, revive thy work in the midst of the years, In the midst of the years make [it] known: In wrath remember mercy!";

hnv[2] = "LORD, I have heard of your fame. I stand in awe of your deeds, LORD. Renew your work in the midst of the years. In the midst of the years make it known. In wrath, you remember mercy.";

kjv[3] = "God came from Teman, and the Holy One from mount Paran. Selah. His glory covered the heavens, and the earth was full of his praise.";

yng[3] = "God from Teman doth come, The Holy One from mount Paran. Pause! Covered the heavens hath His majesty, And His praise hath filled the earth.";
dby[3] = "God came from Teman, And the Holy One from mount Paran. Selah. His glory covereth the heavens, And the earth is full of his praise.";

web[4] = "And [his] brightness was as the light; he had horns [coming] out of his hand; and there [was] the hiding of his power.";

asv[5] = "Before him went the pestilence, And fiery bolts went forth at his feet. ";

kjv[6] = "He stood, and measured the earth: he beheld, and drove asunder the nations; and the everlasting mountains were scattered, the perpetual hills did bow: his ways [are] everlasting.";
rsv[6] = "He stood and measured the earth; he looked and shook the nations; then the eternal mountains were scattered, the everlasting hills sank low. His ways were as of old.";
asv[6] = "He stood, and measured the earth; He beheld, and drove asunder the nations; And the eternal mountains were scattered; The everlasting hills did bow; His goings were [as] of old. ";
yng[6] = "He hath stood, and He measureth earth, He hath seen, and He shaketh off nations, And scatter themselves do mountains of antiquity, Bowed have the hills of old, The ways of old [are] His.";
dby[6] = "He stood, and measured the earth; He beheld, and discomfited the nations; And the eternal mountains were scattered, The everlasting hills gave way: His ways are everlasting.";

kjv[8] = "Was the LORD displeased against the rivers? [was] thine anger against the rivers? [was] thy wrath against the sea, that thou didst ride upon thine horses [and] thy chariots of salvation?";

yng[9] = "Utterly naked Thou dost make Thy bow, Sworn are the tribes -- saying, `Pause!\' [With] rivers Thou dost cleave the earth.";

kjv[10] = "The mountains saw thee, [and] they trembled: the overflowing of the water passed by: the deep uttered his voice, [and] lifted up his hands on high.";

asv[10] = "The mountains saw thee, and were afraid; The tempest of waters passed by; The deep uttered its voice, And lifted up its hands on high. ";
yng[10] = "Seen thee -- pained are mountains, An inundation of waters hath passed over, Given forth hath the deep its voice, High its hands it hath lifted up.";
dby[10] = "The mountains saw thee, they were in travail: Torrents of waters passed by; The deep uttered its voice, Lifted up its hands on high.";
web[10] = "The mountains saw thee, [and] they trembled: the overflowing of the water passed by: the deep uttered his voice, [and] lifted up his hands on high.";
hnv[10] = "The mountains saw you, and were afraid. The tempest of waters passed by. The deep roared and lifted up its hands on high.";

kjv[11] = "The sun [and] moon stood still in their habitation: at the light of thine arrows they went, [and] at the shining of thy glittering spear.";

yng[11] = "Sun -- moon -- hath stood -- a habitation, At the light thine arrows go on, At the brightness, the glittering of thy spear.";
