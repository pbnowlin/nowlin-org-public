csb[1] = "I will stand at my guard post and station myself on the lookout tower. I will watch to see what he will say to me and what I should reply about my complaint.";
csb[2] = "The LORD answered me: Write down this vision; clearly inscribe it on tablets so one may easily read it.";
csb[3] = "For the vision is yet for the appointed time; it testifies about the end and will not lie. Though it delays, wait for it, since it will certainly come and not be late.";
csb[4] = "Look, his ego is inflated; he is without integrity. But the righteous one will live by his faith.";
csb[5] = "Moreover, wine betrays; an arrogant man is never at rest. He enlarges his appetite like Sheol, and like Death he is never satisfied. He gathers all the nations to himself; he collects all the peoples for himself.";
csb[6] = "Won\'t all of these take up a taunt against him, with mockery and riddles about him? They will say: Woe to him who amasses what is not his -- how much longer? -- and loads himself with goods taken in pledge.";
csb[7] = "Won\'t your creditors suddenly arise, and those who disturb you wake up? Then you will become spoil for them.";
csb[8] = "Since you have plundered many nations, all the peoples who remain will plunder you -- because of human bloodshed and violence against lands, cities, and all who live in them.";
csb[9] = "Woe to him who dishonestly makes wealth for his house to place his nest on high, to escape the grasp of disaster!";
csb[10] = "You have planned shame for your house by wiping out many peoples and sinning against your own self.";
csb[11] = "For the stones will cry out from the wall, and the rafters will answer them from the woodwork.";
csb[12] = "Woe to him who builds a city with bloodshed and founds a town with injustice!";
csb[13] = "Is it not from the LORD of Armies that the peoples labor only to fuel the fire and countries exhaust themselves for nothing?";
csb[14] = "For the earth will be filled with the knowledge of the LORD\'s glory, as the water covers the sea.";
csb[15] = "Woe to him who gives his neighbors drink, pouring out your wrath and even making them drunk, in order to look at their nakedness!";
csb[16] = "You will be filled with disgrace instead of glory. You also -- drink, and expose your uncircumcision! The cup in the LORD\'s right hand will come around to you, and utter disgrace will cover your glory.";
csb[17] = "For your violence against Lebanon will overwhelm you; the destruction of animals will terrify you because of your human bloodshed and violence against lands, cities, and all who live in them.";
csb[18] = "What use is a carved idol after its craftsman carves it? It is only a cast image, a teacher of lies. For the one who crafts its shape trusts in it and makes idols that cannot speak.";
csb[19] = "Woe to him who says to wood: Wake up! or to mute stone: Come alive! Can it teach? Look! It may be plated with gold and silver, yet there is no breath in it at all.";
csb[20] = "But the LORD is in his holy temple; let the whole earth be silent in his presence.";
kjv[1] = "I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me, and what I shall answer when I am reproved.";
rsv[1] = "I will take my stand to watch, and station myself on the tower, and look forth to see what he will say to me, and what I will answer concerning my complaint.";
asv[1] = "I will stand upon my watch, and set me upon the tower, and will look forth to see what he will speak with me, and what I shall answer concerning my complaint.";
yng[1] = "On my charge I stand, and I station myself on a bulwark, and I watch to see what He doth speak against me, and what I do reply to my reproof.";
dby[1] = "I will stand upon my watch, and set me upon the tower, and will look forth to see what he will say unto me, and what I shall answer as to my reproof.";
web[1] = "I will stand upon my watch, and seat myself upon the tower, and will watch to see what he will say to me, and what I shall answer when I am reproved.";
hnv[1] = "I will stand at my watch, and set myself on the ramparts, and will look out to see what he will say to me, and what I will answer concerning my complaint.";
vul[1] = "super custodiam meam stabo et figam gradum super munitionem et contemplabor ut videam quid dicatur mihi et quid respondeam ad arguentem me";

rsv[2] = "And the LORD answered me: &quot;Write the vision; make it plain upon tablets, so he may run who reads it.";

yng[2] = "And Jehovah answereth me and saith: `Write a vision, and explain on the tables, That he may run who is reading it.";
dby[2] = "And Jehovah answered me and said, Write the vision, and engrave it upon tablets, that he may run that readeth it.";
web[2] = "And the LORD answered me, and said, Write the vision, and make [it] plain upon tables, that he may run that readeth it.";
hnv[2] = "The LORD answered me, &quot;Write the vision, and make it plain on tablets, that he may run who reads it.";
vul[2] = "et respondit mihi Dominus et dixit scribe visum et explana eum super tabulas ut percurrat qui legerit eum";
kjv[3] = "For the vision [is] yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry.";
rsv[3] = "For still the vision awaits its time; it hastens to the end--it will not lie. If it seem slow, wait for it; it will surely come, it will not delay.";
asv[3] = "For the vision is yet for the appointed time, and it hasteth toward the end, and shall not lie: though it tarry, wait for it; because it will surely come, it will not delay.";
yng[3] = "For yet the vision [is] for a season, And it breatheth for the end, and doth not lie, If it tarry, wait for it, For surely it cometh, it is not late.";
dby[3] = "For the vision is yet for an appointed time, but it hasteth to the end, and shall not lie: though it tarry, wait for it; for it will surely come, it will not delay.";
web[3] = "For the vision [is] yet for an appointed time, but at the end it shall speak, and not lie: though it may tarry, wait for it; because it will surely come, it will not tarry.";
hnv[3] = "For the vision is yet for the appointed time, and it hurries toward the end, and won\'t prove false. Though it takes time, wait for it; because it will surely come. It won\'t delay.";
vul[3] = "quia adhuc visus procul et apparebit in finem et non mentietur si moram fecerit expecta illum quia veniens veniet et non tardabit";
kjv[4] = "Behold, his soul [which] is lifted up is not upright in him: but the just shall live by his faith.";
rsv[4] = "Behold, he whose soul is not upright in him shall fail, but the righteous shall live by his faith.";
asv[4] = "Behold, his soul is puffed up, it is not upright in him; but the righteous shall live by his faith.";
yng[4] = "Lo, a presumptuous one! Not upright is his soul within him, And the righteous by his stedfastness liveth.";
dby[4] = "Behold, his soul is puffed up, it is not upright within him: but the just shall live by his faith.";
web[4] = "Behold, his soul [which] is lifted up, is not upright in him: but the just shall live by his faith.";
hnv[4] = "Behold, his soul is puffed up. It is not upright in him, but the righteous will live by his faith.";
vul[4] = "ecce qui incredulus est non erit recta anima eius in semet ipso iustus autem in fide sua vivet";
kjv[5] = "Yea also, because he transgresseth by wine, [he is] a proud man, neither keepeth at home, who enlargeth his desire as hell, and [is] as death, and cannot be satisfied, but gathereth unto him all nations, and heapeth unto him all people:";
rsv[5] = "Moreover, wine is treacherous; the arrogant man shall not abide. His greed is as wide as Sheol; like death he has never enough. He gathers for himself all nations, and collects as his own all peoples.&quot;";
asv[5] = "Yea, moreover, wine is treacherous, a haughty man, that keepeth not at home; who enlargeth his desire as Sheol, and he is as death, and cannot be satisfied, but gathereth unto him all nations, and heapeth unto him all peoples.";
yng[5] = "And also, because the wine [is] treacherous, A man is haughty, and remaineth not at home, Who hath enlarged as sheol his soul, And is as death that is not satisfied, And doth gather unto itself all the nations, And doth assemble unto itself all the peoples,";
dby[5] = "And moreover, the wine is treacherous: he is a proud man, and keepeth not at rest, he enlargeth his desire as Sheol, and he is like death and cannot be satisfied; and he assembleth unto him all nations, and gathereth unto him all peoples.";
web[5] = "Yes also, because he transgresseth by wine, [he is] a proud man, neither keepeth at home, who enlargeth his desire, as hell, and [is] as death, and cannot be satisfied, but gathereth to him all nations, and collecteth to him all people:";
hnv[5] = "Yes, moreover, wine is treacherous. A haughty man who doesn\'t stay at home, who enlarges his desire as She\'ol, and he is like death, and can\'t be satisfied, but gathers to himself all nations, and heaps to himself all peoples.";
vul[5] = "et quomodo vinum potantem decipit sic erit vir superbus et non decorabitur qui dilatavit quasi infernus animam suam et ipse quasi mors et non adimpletur et congregabit ad se omnes gentes et coacervabit ad se omnes populos";
kjv[6] = "Shall not all these take up a parable against him, and a taunting proverb against him, and say, Woe to him that increaseth [that which is] not his! how long? and to him that ladeth himself with thick clay!";
rsv[6] = "Shall not all these take up their taunt against him, in scoffing derision of him, and say, &quot;Woe to him who heaps up what is not his own--for how long?--and loads himself with pledges!&quot;";
asv[6] = "Shall not all these take up a parable against him, and a taunting proverb against him, and say, Woe to him that increaseth that which is not his! how long? and that ladeth himself with pledges!";
yng[6] = "Do not these -- all of them -- against him a simile taken up, And a moral of acute sayings for him, And say, Wo [to] him who is multiplying [what is] not his? Till when also is he multiplying to himself heavy pledges?";
dby[6] = "Shall not all these take up a proverb about him, and a taunting riddle against him, and say, Woe to him that increaseth that which is not his! how long? -- and to him that loadeth himself with pledges!";
web[6] = "Shall not all these take up a parable against him, and a taunting proverb against him, and say, Woe to him that increaseth [that which is] not his! how long? and to him that ladeth himself with thick clay!";
hnv[6] = "Won\'t all these take up a parable against him, and a taunting proverb against him, and say, \'Woe to him who increases that which is not his, and who enriches himself by extortion! How long?\'";
vul[6] = "numquid non omnes isti super eum parabolam sument et loquellam enigmatum eius et dicetur vae ei qui multiplicat non sua usquequo et adgravat contra se densum lutum";
kjv[7] = "Shall they not rise up suddenly that shall bite thee, and awake that shall vex thee, and thou shalt be for booties unto them?";
rsv[7] = "Will not your debtors suddenly arise, and those awake who will make you tremble? Then you will be booty for them.";
asv[7] = "Shall they not rise up suddenly that shall bite thee, and awake that shall vex thee, and thou shalt be for booty unto them?";
yng[7] = "Do not thy usurers instantly rise up, And those shaking thee awake up, And thou hast been for a spoil to them?";

yng[9] = "Wo [to] him who is gaining evil gain for his house, To set on high his nest, To be delivered from the hand of evil,";
dby[9] = "Woe to him that getteth iniquitous gain to his house, that he may set his nest on high, that he may be delivered from the grasp of evil!";

yng[16] = "Thou hast been filled -- shame without honour, Drink thou also, and be uncircumcised, Turn round unto thee doth the cup of the right hand of Jehovah, And shameful spewing [is] on thine honour.";

hnv[16] = "You are filled with shame, and not glory. You will also drink, and be exposed! The cup of the LORD\'s right hand will come around to you, and disgrace will cover your glory.";

dby[17] = "For the violence [done] to Lebanon shall cover thee, and the destruction of beasts which made them afraid; because of men\'s blood, and for the violence [done] to the land, to the city, and all that dwell therein.";

kjv[18] = "What profiteth the graven image that the maker thereof hath graven it; the molten image, and a teacher of lies, that the maker of his work trusteth therein, to make dumb idols?";
rsv[18] = "What profit is an idol when its maker has shaped it, a metal image, a teacher of lies? For the workman trusts in his own creation when he makes dumb idols!";
asv[18] = "What profiteth the graven image, that the maker thereof hath graven it; the molten image, even the teacher of lies, that he that fashioneth its form trusteth therein, to make dumb idols?";
yng[18] = "What profit hath a graven image given That its former hath graven it? A molten image and teacher of falsehood, That trusted hath the former on his own formation -- to make dumb idols?";
dby[18] = "What profiteth the graven image that the maker thereof hath graven it? the molten image, and the teacher of falsehood, that the maker of his work dependeth thereon, to make dumb idols?";
web[18] = "What profiteth the graven image that its maker hath graven it; the molten image, and a teacher of lies, that the maker of his work trusteth therein, to make dumb idols?";
hnv[18] = "&quot;What value does the engraved image have, that its maker has engraved it; the molten image, even the teacher of lies, that he who fashions its form trusts in it, to make mute idols?";

yng[19] = "Wo [to] him who is saying to wood, `Awake,\' `Stir up,\' to a dumb stone, It a teacher! lo, it is overlaid -- gold and silver, And there is no spirit in its midst.";
dby[19] = "Woe unto him that saith to the wood, Awake! to the dumb stone, Arise! Shall it teach? Behold it is overlaid with gold and silver, and there is no breath at all in the midst of it.";
web[19] = "Woe to him that saith to the wood, Awake; to the dumb stone, Arise, it shall teach! Behold, it [is] laid over with gold and silver, and [there is] no breath at all in the midst of it.";
hnv[19] = "Woe to him who says to the wood, \'Awake!\' or to the mute stone, \'Arise!\' Shall this teach? Behold, it is overlaid with gold and silver, and there is no breath at all in the midst of it.";
