csb[1] = "A pronouncement: The word of the LORD to Israel through Malachi.";
csb[2] = "&quot;I have loved you,&quot; says the LORD. Yet you ask, &quot;How have you loved us? &quot; &quot;Wasn\'t Esau Jacob\'s brother? &quot; This is the LORD\'s declaration. &quot;Even so, I loved Jacob,";
csb[3] = "&quot;but I hated Esau. I turned his mountains into a wasteland, and gave his inheritance to the desert jackals.&quot;";
csb[4] = "Though Edom says: &quot;We have been devastated, but we will rebuild the ruins,&quot; the LORD of Armies says this: &quot;They may build, but I will demolish. They will be called a wicked country and the people the LORD has cursed forever.";
csb[5] = "&quot;Your own eyes will see this, and you yourselves will say, \'The LORD is great, even beyond the borders of Israel.\'";
csb[6] = "&quot;A son honors his father, and a servant his master. But if I am a father, where is my honor? And if I am a master, where is your fear of me? says the LORD of Armies to you priests, who despise my name.&quot; Yet you ask: &quot;How have we despised your name? &quot;";
csb[7] = "&quot;By presenting defiled food on my altar.&quot; &quot;How have we defiled you? &quot; you ask. When you say: &quot;The LORD\'s table is contemptible.&quot;";
csb[8] = "&quot;When you present a blind animal for sacrifice, is it not wrong? And when you present a lame or sick animal, is it not wrong? Bring it to your governor! Would he be pleased with you or show you favor? &quot; asks the LORD of Armies.";
csb[9] = "&quot;And now plead for God\'s favor. Will he be gracious to us? Since this has come from your hands, will he show any of you favor? &quot; asks the LORD of Armies.";
csb[10] = "&quot;I wish one of you would shut the temple doors, so that you would no longer kindle a useless fire on my altar! I am not pleased with you,&quot; says the LORD of Armies, &quot;and I will accept no offering from your hands.";
csb[11] = "&quot;My name will be great among the nations, from the rising of the sun to its setting. Incense and pure offerings will be presented in my name in every place because my name will be great among the nations,&quot; says the LORD of Armies.";
csb[12] = "&quot;But you are profaning it when you say: \'The Lord\'s table is defiled, and its product, its food, is contemptible.\'";
csb[13] = "&quot;You also say: \'Look, what a nuisance! \' And you scorn it,&quot; says the LORD of Armies. &quot;You bring stolen, lame, or sick animals. You bring this as an offering! Am I to accept that from your hands? &quot; asks the LORD.";
csb[14] = "&quot;The deceiver is cursed who has an acceptable male in his flock and makes a vow but sacrifices a defective animal to the Lord. For I am a great King,&quot; says the LORD of Armies, &quot;and my name will be feared among the nations.";

kjv[4] = "Whereas Edom saith, We are impoverished, but we will return and build the desolate places; thus saith the LORD of hosts, They shall build, but I will throw down; and they shall call them, The border of wickedness, and, The people against whom the LORD hath indignation for ever.";
rsv[4] = "If Edom says, &quot;We are shattered but we will rebuild the ruins,&quot; the LORD of hosts says, &quot;They may build, but I will tear down, till they are called the wicked country, the people with whom the LORD is angry for ever.&quot;";
asv[4] = "Whereas Edom saith, We are beaten down, but we will return and build the waste places; thus saith Jehovah of hosts, They shall build, but I will throw down; and men shall call them The border of wickedness, and The people against whom Jehovah hath indignation for ever.";
yng[4] = "Because Edom saith, `We have been made poor, And we turn back and we build the wastes,\' Thus said Jehovah of Hosts: They do build, and I do destroy, And [men] have called to them, `O region of wickedness,\' `O people whom Jehovah defied to the age.\'";
dby[4] = "If Edom say, We are broken down, but we will build again the ruined places, -- thus saith Jehovah of hosts: They shall build, but I will throw down; and [men] shall call them the territory of wickedness, and the people against whom Jehovah hath indignation for ever.";
web[4] = "Whereas Edom saith, We are impoverished, but we will return and build the desolate places; thus saith the LORD of hosts, They shall build, but I will throw down; and they shall call them, The border of wickedness, and, The people against whom the LORD hath indignation for ever.";
hnv[4] = "Whereas Edom says, &quot;We are beaten down, but we will return and build the waste places;&quot; thus says the LORD of Hosts, &quot;They shall build, but I will throw down; and men will call them \'The Wicked Land,\' even the people against whom the LORD shows wrath forever.&quot;";
vul[4] = "quod si dixerit Idumea destructi sumus sed revertentes aedificabimus quae deserta sunt haec dicit Dominus exercituum isti aedificabunt et ego destruam et vocabuntur Termini impietatis et Populus cui iratus est Dominus usque in aeternum";

kjv[6] = "A son honoureth [his] father, and a servant his master: if then I [be] a father, where [is] mine honour? and if I [be] a master, where [is] my fear? saith the LORD of hosts unto you, O priests, that despise my name. And ye say, Wherein have we despised thy name?";
rsv[6] = "&quot;A son honors his father, and a servant his master. If then I am a father, where is my honor? And if I am a master, where is my fear? says the LORD of hosts to you, O priests, who despise my name. You say, \'How have we despised thy name?\'";
asv[6] = "A son honoreth his father, and a servant his master: if then I am a father, where is mine honor? and if I am a master, where is my fear? saith Jehovah of hosts unto you, O priests, that despise my name. And ye say, Wherein have we despised thy name?";
yng[6] = "A son honoureth a father, and a servant his master. And if I [am] a father, where [is] Mine honour? And if I [am] a master, where [is] My fear? Said Jehovah of Hosts to you, O priests, despising My name! And ye have said: `In what have we despised Thy name?\'";

hnv[6] = "&quot;A son honors his father, and a servant his master. If I am a father, then where is my honor? And if I am a master, where is the respect due me? Says the LORD of Hosts to you, Kohanim, who despise my name. You say, \'How have we despised your name?\'";
vul[6] = "filius honorat patrem et servus dominum suum si ergo pater ego sum ubi est honor meus et si dominus ego sum ubi est timor meus dicit Dominus exercituum ad vos o sacerdotes qui despicitis nomen meum et dixistis in quo despeximus nomen tuum";

kjv[8] = "And if ye offer the blind for sacrifice, [is it] not evil? and if ye offer the lame and sick, [is it] not evil? offer it now unto thy governor; will he be pleased with thee, or accept thy person? saith the LORD of hosts.";
rsv[8] = "When you offer blind animals in sacrifice, is that no evil? And when you offer those that are lame or sick, is that no evil? Present that to your governor; will he be pleased with you or show you favor? says the LORD of hosts.";
asv[8] = "And when ye offer the blind for sacrifice, it is no evil! and when ye offer the lame and sick, it is no evil! Present it now unto thy governor; will he be pleased with thee? or will he accept thy person? saith Jehovah of hosts.";
yng[8] = "And when ye bring nigh the blind for sacrifice, `There is no evil,\' And when ye bring nigh the lame and sick, `There is no evil;\' Bring it near, I pray thee, to thy governor -- Doth he accept thee? or doth he lift up thy face? Said Jehovah of Hosts.";
dby[8] = "And if ye offer the blind for sacrifice, is it not evil? And if ye offer the lame and sick, is it not evil? Present it now unto thy governor: will he be pleased with thee? or will he accept thy person? saith Jehovah of hosts.";

vul[8] = "si offeratis caecum ad immolandum nonne malum est et si offeratis claudum et languidum nonne malum est offer illud duci tuo si placuerit ei aut si susceperit faciem tuam dicit Dominus exercituum";
kjv[9] = "And now, I pray you, beseech God that he will be gracious unto us: this hath been by your means: will he regard your persons? saith the LORD of hosts.";

asv[10] = "Oh that there were one among you that would shut the doors, that ye might not kindle [fire on] mine altar in vain! I have no pleasure in you, saith Jehovah of hosts, neither will I accept an offering at your hand.";
yng[10] = "Who [is] even among you, And he shutteth the two-leaved doors? Yea, ye do not kindle Mine altar for nought, I have no pleasure in you, said Jehovah of Hosts, And a present I do not accept of your hand.";

kjv[13] = "Ye said also, Behold, what a weariness [is it]! and ye have snuffed at it, saith the LORD of hosts; and ye brought [that which was] torn, and the lame, and the sick; thus ye brought an offering: should I accept this of your hand? saith the LORD.";
rsv[13] = "\'What a weariness this is,\' you say, and you sniff at me, says the LORD of hosts. You bring what has been taken by violence or is lame or sick, and this you bring as your offering! Shall I accept that from your hand? says the LORD.";
asv[13] = "Ye say also, Behold, what a weariness is it! and ye have snuffed at it, saith Jehovah of hosts; and ye have brought that which was taken by violence, and the lame, and the sick; thus ye bring the offering: should I accept this at your hand? saith Jehovah.";
yng[13] = "And ye have said, `Lo, what a weariness,\' And ye have puffed at it, said Jehovah of Hosts, And ye have brought in plunder, And the lame and the sick, And ye have brought in the present! Do I accept it from your hand? said Jehovah.";
dby[13] = "And ye say, Behold, what a weariness! And ye have puffed at it, saith Jehovah of hosts, and ye bring [that which was] torn, and the lame, and the sick; thus ye bring the oblation: should I accept this of your hand? saith Jehovah.";
web[13] = "Ye said also, Behold, what a weariness [is it]! and ye have snuffed at it, saith the LORD of hosts; and ye brought [that which was] torn, and the lame, and the sick; thus ye brought an offering: should I accept this from your hand? saith the LORD.";
hnv[13] = "You say also, \'Behold, what a weariness it is!\' and you have sniffed at it,&quot; says the LORD of Hosts; &quot;and you have brought that which was taken by violence, the lame, and the sick; thus you bring the offering. Should I accept this at your hand?&quot; says the LORD.";
vul[13] = "et dixistis ecce de labore et exsuflastis illud dicit Dominus exercituum et intulistis de rapinis claudum et languidum et intulistis munus numquid suscipiam illud de manu vestra dicit Dominus";
kjv[14] = "But cursed [be] the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing: for I [am] a great King, saith the LORD of hosts, and my name [is] dreadful among the heathen.";
rsv[14] = "Cursed be the cheat who has a male in his flock, and vows it, and yet sacrifices to the Lord what is blemished; for I am a great King, says the LORD of hosts, and my name is feared among the nations.";
asv[14] = "But cursed be the deceiver, who hath in his flock a male, and voweth, and sacrificeth unto the Lord a blemished thing; for I am a great King, saith Jehovah of hosts, and my name is terrible among the Gentiles.";
yng[14] = "And cursed [is] a deceiver, who hath in his drove a male, And is vowing, and is sacrificing a marred thing to the Lord, For a great king [am] I, said Jehovah of Hosts, And My name [is] revered among nations!";
dby[14] = "Yea, cursed be the deceiver, who hath in his flock a male, and voweth and sacrificeth unto the Lord a corrupt thing; for I am a great King, saith Jehovah of hosts, and my name is terrible among the nations.";
web[14] = "But cursed [be] the deceiver, who hath in his flock a male, and voweth, and sacrificeth to the Lord a corrupt thing: for I [am] a great King, saith the LORD of hosts, and my name [is] dreadful among the heathen.";
hnv[14] = "&quot;But the deceiver is cursed, who has in his flock a male, and vows, and sacrifices to the Lord a blemished thing; for I am a great King,&quot; says the LORD of hosts, &quot;and my name is awesome among the nations.&quot;";
vul[14] = "maledictus dolosus qui habet in grege suo masculum et votum faciens immolat debile Domino quia rex magnus ego dicit Dominus exercituum et nomen meum horribile in gentibus";
