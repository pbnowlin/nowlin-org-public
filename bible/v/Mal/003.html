csb[1] = "&quot;See, I am going to send my messenger, and he will clear the way before me. Then the Lord you seek will suddenly come to his temple, the Messenger of the covenant you delight in -- see, he is coming,&quot; says the LORD of Armies.";
csb[2] = "But who can endure the day of his coming? And who will be able to stand when he appears? For he will be like a refiner\'s fire and like launderer\'s bleach.";
csb[3] = "He will be like a refiner and purifier of silver; he will purify the sons of Levi and refine them like gold and silver. Then they will present offerings to the LORD in righteousness.";
csb[4] = "And the offerings of Judah and Jerusalem will please the LORD as in days of old and years gone by.";
csb[5] = "&quot;I will come to you in judgment, and I will be ready to witness against sorcerers and adulterers; against those who swear falsely; against those who oppress the hired worker, the widow, and the fatherless; and against those who deny justice to the resident alien. They do not fear me,&quot; says the LORD of Armies.";
csb[6] = "&quot;Because I, the LORD, have not changed, you descendants of Jacob have not been destroyed.";
csb[7] = "&quot;Since the days of your fathers, you have turned from my statutes; you have not kept them. Return to me, and I will return to you,&quot; says the LORD of Armies. Yet you ask, &quot;How can we return? &quot;";
csb[8] = "&quot;Will a man rob God? Yet you are robbing me! &quot; &quot;How do we rob you? &quot; you ask. &quot;By not making the payments of the tenth and the contributions.";
csb[9] = "&quot;You are suffering under a curse, yet you -- the whole nation -- are still robbing me.";
csb[10] = "&quot;Bring the full tenth into the storehouse so that there may be food in my house. Test me in this way,&quot; says the LORD of Armies. &quot;See if I will not open the floodgates of heaven and pour out a blessing for you without measure.";
csb[11] = "&quot;I will rebuke the devourer for you, so that it will not ruin the produce of your land and your vine in your field will not fail to produce fruit,&quot; says the LORD of Armies.";
csb[12] = "&quot;Then all the nations will consider you fortunate, for you will be a delightful land,&quot; says the LORD of Armies.";
csb[13] = "&quot;Your words against me are harsh,&quot; says the LORD. Yet you ask, &quot;What have we spoken against you? &quot;";
csb[14] = "You have said: &quot;It is useless to serve God. What have we gained by keeping his requirements and walking mournfully before the LORD of Armies?";
csb[15] = "&quot;So now we consider the arrogant to be fortunate. Not only do those who commit wickedness prosper, they even test God and escape.&quot;";
csb[16] = "At that time those who feared the LORD spoke to one another. The LORD took notice and listened. So a book of remembrance was written before him for those who feared the LORD and had high regard for his name.";
csb[17] = "&quot;They will be mine,&quot; says the LORD of Armies, &quot;my own possession on the day I am preparing. I will have compassion on them as a man has compassion on his son who serves him.";
csb[18] = "&quot;So you will again see the difference between the righteous and the wicked, between one who serves God and one who does not serve him.";

kjv[5] = "And I will come near to you to judgment; and I will be a swift witness against the sorcerers, and against the adulterers, and against false swearers, and against those that oppress the hireling in [his] wages, the widow, and the fatherless, and that turn aside the stranger [from his right], and fear not me, saith the LORD of hosts.";
