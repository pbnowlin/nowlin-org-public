csb[1] = "&quot;Therefore, this decree is for you priests:";
csb[2] = "&quot;If you don\'t listen, and if you don\'t take it to heart to honor my name,&quot; says the LORD of Armies, &quot;I will send a curse among you, and I will curse your blessings. In fact, I have already begun to curse them because you are not taking it to heart.";
csb[3] = "&quot;Look, I am going to rebuke your descendants, and I will spread animal waste over your faces, the waste from your festival sacrifices, and you will be taken away with it.";
csb[4] = "&quot;Then you will know that I sent you this decree, so that my covenant with Levi may continue,&quot; says the LORD of Armies.";
csb[5] = "&quot;My covenant with him was one of life and peace, and I gave these to him; it called for reverence, and he revered me and stood in awe of my name.";
csb[6] = "&quot;True instruction was in his mouth, and nothing wrong was found on his lips. He walked with me in peace and integrity and turned many from iniquity.";
csb[7] = "&quot;For the lips of a priest should guard knowledge, and people should desire instruction from his mouth, because he is the messenger of the LORD of Armies.";
csb[8] = "&quot;You, on the other hand, have turned from the way. You have caused many to stumble by your instruction. You have violated the covenant of Levi,&quot; says the LORD of Armies.";
csb[9] = "&quot;So I in turn have made you despised and humiliated before all the people because you are not keeping my ways but are showing partiality in your instruction.&quot;";
csb[10] = "Don\'t all of us have one Father? Didn\'t one God create us? Why then do we act treacherously against one another, profaning the covenant of our fathers?";
csb[11] = "Judah has acted treacherously, and a detestable act has been done in Israel and in Jerusalem. For Judah has profaned the LORD\'s sanctuary, which he loves, and has married the daughter of a foreign god.";
csb[12] = "May the LORD cut off from the tents of Jacob the man who does this, whoever he may be, even if he presents an offering to the LORD of Armies.";
csb[13] = "This is another thing you do. You are covering the LORD\'s altar with tears, with weeping and groaning, because he no longer respects your offerings or receives them gladly from your hands.";
csb[14] = "And you ask, &quot;Why? &quot; Because even though the LORD has been a witness between you and the wife of your youth, you have acted treacherously against her. She was your marriage partner and your wife by covenant.";
csb[15] = "Didn\'t God make them one and give them a portion of spirit? What is the one seeking? Godly offspring. So watch yourselves carefully, so that no one acts treacherously against the wife of his youth.";
csb[16] = "&quot;If he hates and divorces his wife,&quot; says the LORD God of Israel, &quot;he covers his garment with injustice,&quot; says the LORD of Armies. Therefore, watch yourselves carefully, and do not act treacherously.";
csb[17] = "You have wearied the LORD with your words. Yet you ask, &quot;How have we wearied him? &quot; When you say, &quot;Everyone who does what is evil is good in the LORD\'s sight, and he is delighted with them, or else where is the God of justice? &quot;";
kjv[1] = "And now, O ye priests, this commandment [is] for you.";
kjv[2] = "If ye will not hear, and if ye will not lay [it] to heart, to give glory unto my name, saith the LORD of hosts, I will even send a curse upon you, and I will curse your blessings: yea, I have cursed them already, because ye do not lay [it] to heart.";
kjv[3] = "Behold, I will corrupt your seed, and spread dung upon your faces, [even] the dung of your solemn feasts; and [one] shall take you away with it.";
kjv[4] = "And ye shall know that I have sent this commandment unto you, that my covenant might be with Levi, saith the LORD of hosts.";
kjv[5] = "My covenant was with him of life and peace; and I gave them to him [for] the fear wherewith he feared me, and was afraid before my name.";
kjv[6] = "The law of truth was in his mouth, and iniquity was not found in his lips: he walked with me in peace and equity, and did turn many away from iniquity.";
kjv[7] = "For the priest\'s lips should keep knowledge, and they should seek the law at his mouth: for he [is] the messenger of the LORD of hosts.";
kjv[8] = "But ye are departed out of the way; ye have caused many to stumble at the law; ye have corrupted the covenant of Levi, saith the LORD of hosts.";
kjv[9] = "Therefore have I also made you contemptible and base before all the people, according as ye have not kept my ways, but have been partial in the law.";
kjv[10] = "Have we not all one father? hath not one God created us? why do we deal treacherously every man against his brother, by profaning the covenant of our fathers?";
kjv[11] = "Judah hath dealt treacherously, and an abomination is committed in Israel and in Jerusalem; for Judah hath profaned the holiness of the LORD which he loved, and hath married the daughter of a strange god.";
kjv[12] = "The LORD will cut off the man that doeth this, the master and the scholar, out of the tabernacles of Jacob, and him that offereth an offering unto the LORD of hosts.";
kjv[13] = "And this have ye done again, covering the altar of the LORD with tears, with weeping, and with crying out, insomuch that he regardeth not the offering any more, or receiveth [it] with good will at your hand.";
kjv[14] = "Yet ye say, Wherefore? Because the LORD hath been witness between thee and the wife of thy youth, against whom thou hast dealt treacherously: yet [is] she thy companion, and the wife of thy covenant.";
kjv[15] = "And did not he make one? Yet had he the residue of the spirit. And wherefore one? That he might seek a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth.";
kjv[16] = "For the LORD, the God of Israel, saith that he hateth putting away: for [one] covereth violence with his garment, saith the LORD of hosts: therefore take heed to your spirit, that ye deal not treacherously.";
kjv[17] = "Ye have wearied the LORD with your words. Yet ye say, Wherein have we wearied [him]? When ye say, Every one that doeth evil [is] good in the sight of the LORD, and he delighteth in them; or, Where [is] the God of judgment?";

asv[5] = "My covenant was with him of life and peace; and I gave them to him that he might fear; and he feared me, and stood in awe of my name.";
yng[5] = "My covenant hath been with him of life and of peace, And I make them to him a fear, and he doth fear Me, And because of My name he hath been affrighted.";

hnv[6] = "The law of truth was in his mouth, and unrighteousness was not found in his lips. He walked with me in shalom and uprightness, and turned many away from iniquity.";

dby[9] = "And I also have made you contemptible and base before all the people, because ye have not kept my ways, but have respect of persons in [administering] the law.";

rsv[14] = "You ask, &quot;Why does he not?&quot; Because the LORD was witness to the covenant between you and the wife of your youth, to whom you have been faithless, though she is your companion and your wife by covenant.";

vul[14] = "et dixistis quam ob causam quia Dominus testificatus est inter te et uxorem pubertatis tuae quam tu despexisti et haec particeps tua et uxor foederis tui";
rsv[15] = "Has not the one God made and sustained for us the spirit of life? And what does he desire? Godly offspring. So take heed to yourselves, and let none be faithless to the wife of his youth.";

yng[15] = "And He did not make one [only], And He hath the remnant of the Spirit. And what [is] the one [alone]! He is seeking a godly seed. And ye have been watchful over your spirit, And with the wife of thy youth, None doth deal treacherously.";
dby[15] = "And did not one make [them]? and the remnant of the Spirit was his. And wherefore the one? He sought a seed of God. Take heed then to your spirit, and let none deal unfaithfully against the wife of his youth,";
web[15] = "And did he not make one? Yet had he the residue of the spirit. And why one? That he might seek a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth.";
hnv[15] = "Did he not make one, although he had the residue of the Spirit? Why one? He sought a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth.";
vul[15] = "nonne unus fecit et residuum spiritus eius est et quid unus quaerit nisi semen Dei custodite ergo spiritum vestrum et uxorem adulescentiae tuae noli despicere";

vul[16] = "cum odio habueris dimitte dicit Dominus Deus Israhel operiet autem iniquitas vestimentum eius dicit Dominus exercituum custodite spiritum vestrum et nolite despicere";
rsv[17] = "You have wearied the LORD with your words. Yet you say, &quot;How have we wearied him?&quot; By saying, &quot;Every one who does evil is good in the sight of the LORD, and he delights in them.&quot; Or by asking, &quot;Where is the God of justice?&quot;";

dby[17] = "Ye have wearied Jehovah with your words, and ye say, Wherein have we wearied [him]? In that ye say, Every one that doeth evil is good in the sight of Jehovah, and he delighteth in them; or, Where is the God of judgment?";
web[17] = "Ye have wearied the LORD with your words. Yet ye say, In what have we wearied [him]? When ye say, Every one that doeth evil [is] good in the sight of the LORD, and he delighteth in them; or, Where [is] the God of judgment?";
hnv[17] = "You have wearied the LORD with your words. Yet you say, \'How have we wearied him?\' In that you say, \'Everyone who does evil is good in the sight of the LORD, and he delights in them;\' or \'Where is the God of justice?\'";
vul[17] = "laborare fecistis Dominum in sermonibus vestris et dixistis in quo eum fecimus laborare in eo cum diceretis omnis qui facit malum bonus est in conspectu Domini et tales ei placent aut certe ubi est Deus iudicii";
