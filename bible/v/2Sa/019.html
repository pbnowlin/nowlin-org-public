csb[1] = "It was reported to Joab, &quot;The king is weeping. He\'s mourning over Absalom.&quot;";
csb[2] = "That day\'s victory was turned into mourning for all the troops because on that day the troops heard, &quot;The king is grieving over his son.&quot;";
csb[3] = "So they returned to the city quietly that day like troops come in when they are humiliated after fleeing in battle.";
csb[4] = "But the king covered his face and cried loudly, &quot;My son Absalom! Absalom, my son, my son! &quot;";
csb[5] = "Then Joab went into the house to the king and said, &quot;Today you have shamed all your soldiers -- those who saved your life as well as your sons, your wives, and your concubines --";
csb[6] = "&quot;by loving your enemies and hating those who love you! Today you have made it clear that the commanders and soldiers mean nothing to you. In fact, today I know that if Absalom were alive and all of us were dead, it would be fine with you!";
csb[7] = "&quot;Now get up! Go out and encourage your soldiers, for I swear by the LORD that if you don\'t go out, not a man will remain with you tonight. This will be worse for you than all the trouble that has come to you from your youth until now! &quot;";
csb[8] = "So the king got up and sat in the city gate, and all the people were told: &quot;Look, the king is sitting in the city gate.&quot; Then they all came into the king\'s presence. Meanwhile, each Israelite had fled to his tent.";
csb[9] = "People throughout all the tribes of Israel were arguing among themselves, saying, &quot;The king rescued us from the grasp of our enemies, and he saved us from the grasp of the Philistines, but now he has fled from the land because of Absalom.";
csb[10] = "&quot;But Absalom, the man we anointed over us, has died in battle. So why do you say nothing about restoring the king? &quot;";
csb[11] = "King David sent word to the priests Zadok and Abiathar: &quot;Say to the elders of Judah, \'Why should you be the last to restore the king to his palace? The talk of all Israel has reached the king at his house.";
csb[12] = "&quot;You are my brothers, my flesh and blood. So why should you be the last to restore the king? \'";
csb[13] = "&quot;And tell Amasa, \'Aren\'t you my flesh and blood? May God punish me and do so severely if you don\'t become commander of my army from now on instead of Joab! \' &quot;";
csb[14] = "So he won over all the men of Judah, and they unanimously sent word to the king: &quot;Come back, you and all your servants.&quot;";
csb[15] = "Then the king returned. When he arrived at the Jordan, Judah came to Gilgal to meet the king and escort him across the Jordan.";
csb[16] = "Shimei son of Gera, the Benjaminite from Bahurim, hurried down with the men of Judah to meet King David.";
csb[17] = "There were a thousand men from Benjamin with him. Ziba, an attendant from the house of Saul, with his fifteen sons and twenty servants also rushed down to the Jordan ahead of the king.";
csb[18] = "They forded the Jordan to bring the king\'s household across and do whatever the king desired. When Shimei son of Gera crossed the Jordan, he fell facedown before the king";
csb[19] = "and said to him, &quot;My lord, don\'t hold me guilty, and don\'t remember your servant\'s wrongdoing on the day my lord the king left Jerusalem. May the king not take it to heart.";
csb[20] = "&quot;For your servant knows that I have sinned. But look! Today I am the first one of the entire house of Joseph to come down to meet my lord the king.&quot;";
csb[21] = "Abishai son of Zeruiah asked, &quot;Shouldn\'t Shimei be put to death for this, because he cursed the LORD\'s anointed? &quot;";
csb[22] = "David answered, &quot;Sons of Zeruiah, do we agree on anything? Have you become my adversary today? Should any man be killed in Israel today? Am I not aware that today I\'m king over Israel? &quot;";
csb[23] = "So the king said to Shimei, &quot;You will not die.&quot; Then the king gave him his oath.";
csb[24] = "Mephibosheth, Saul\'s grandson, also went down to meet the king. He had not taken care of his feet, trimmed his mustache, or washed his clothes from the day the king left until the day he returned safely.";
csb[25] = "When he came from Jerusalem to meet the king, the king asked him, &quot;Mephibosheth, why didn\'t you come with me? &quot;";
csb[26] = "&quot;My lord the king,&quot; he replied, &quot;my servant Ziba betrayed me. Actually your servant said: \'I\'ll saddle the donkey for myself so that I may ride it and go with the king\' -- for your servant is lame.";
csb[27] = "&quot;Ziba slandered your servant to my lord the king. But my lord the king is like the angel of God, so do whatever you think best.";
csb[28] = "&quot;For my grandfather\'s entire family deserves death from my lord the king, but you set your servant among those who eat at your table. So what further right do I have to keep on making appeals to the king? &quot;";
csb[29] = "The king said to him, &quot;Why keep on speaking about these matters of yours? I hereby declare: you and Ziba are to divide the land.&quot;";
csb[30] = "Mephibosheth said to the king, &quot;Instead, since my lord the king has come to his palace safely, let Ziba take it all! &quot;";
csb[31] = "Barzillai the Gileadite had come down from Rogelim and accompanied the king to the Jordan River to see him off at the Jordan.";
csb[32] = "Barzillai was a very old man -- eighty years old -- and since he was a very wealthy man, he had provided for the needs of the king while he stayed in Mahanaim.";
csb[33] = "The king said to Barzillai, &quot;Cross over with me, and I\'ll provide for you at my side in Jerusalem.&quot;";
csb[34] = "Barzillai replied to the king, &quot;How many years of my life are left that I should go up to Jerusalem with the king?";
csb[35] = "&quot;I\'m now eighty years old. Can I discern what is pleasant and what is not? Can your servant taste what he eats or drinks? Can I still hear the voice of male and female singers? Why should your servant be an added burden to my lord the king?";
csb[36] = "&quot;Since your servant is only going with the king a little way across the Jordan, why should the king repay me with such a reward?";
csb[37] = "&quot;Please let your servant return so that I may die in my own city near the tomb of my father and mother. But here is your servant Chimham: let him cross over with my lord the king. Do for him what seems good to you.&quot;";
csb[38] = "The king replied, &quot;Chimham will cross over with me, and I will do for him what seems good to you, and whatever you desire from me I will do for you.&quot;";
csb[39] = "So all the people crossed the Jordan, and then the king crossed. The king kissed Barzillai and blessed him, and Barzillai returned to his home.";
csb[40] = "The king went on to Gilgal, and Chimham went with him. All the troops of Judah and half of Israel\'s escorted the king.";
csb[41] = "Suddenly, all the men of Israel came to the king. They asked him, &quot;Why did our brothers, the men of Judah, take you away secretly and transport the king and his household across the Jordan, along with all of David\'s men? &quot;";
csb[42] = "All the men of Judah responded to the men of Israel, &quot;Because the king is our relative. Why does this make you angry? Have we ever eaten anything of the king\'s or been honored at all? &quot;";
csb[43] = "The men of Israel answered the men of Judah: &quot;We have ten shares in the king, so we have a greater claim to David than you. Why then do you despise us? Weren\'t we the first to speak of restoring our king? &quot; But the words of the men of Judah were harsher than those of the men of Israel.";
kjv[1] = "And it was told Joab, Behold, the king weepeth and mourneth for Absalom.";
kjv[2] = "And the victory that day was [turned] into mourning unto all the people: for the people heard say that day how the king was grieved for his son.";
kjv[3] = "And the people gat them by stealth that day into the city, as people being ashamed steal away when they flee in battle.";
kjv[4] = "But the king covered his face, and the king cried with a loud voice, O my son Absalom, O Absalom, my son, my son!";
kjv[5] = "And Joab came into the house to the king, and said, Thou hast shamed this day the faces of all thy servants, which this day have saved thy life, and the lives of thy sons and of thy daughters, and the lives of thy wives, and the lives of thy concubines;";
kjv[6] = "In that thou lovest thine enemies, and hatest thy friends. For thou hast declared this day, that thou regardest neither princes nor servants: for this day I perceive, that if Absalom had lived, and all we had died this day, then it had pleased thee well.";
kjv[7] = "Now therefore arise, go forth, and speak comfortably unto thy servants: for I swear by the LORD, if thou go not forth, there will not tarry one with thee this night: and that will be worse unto thee than all the evil that befell thee from thy youth until now.";
kjv[8] = "Then the king arose, and sat in the gate. And they told unto all the people, saying, Behold, the king doth sit in the gate. And all the people came before the king: for Israel had fled every man to his tent.";
kjv[9] = "And all the people were at strife throughout all the tribes of Israel, saying, The king saved us out of the hand of our enemies, and he delivered us out of the hand of the Philistines; and now he is fled out of the land for Absalom.";
kjv[10] = "And Absalom, whom we anointed over us, is dead in battle. Now therefore why speak ye not a word of bringing the king back?";
kjv[11] = "And king David sent to Zadok and to Abiathar the priests, saying, Speak unto the elders of Judah, saying, Why are ye the last to bring the king back to his house? seeing the speech of all Israel is come to the king, [even] to his house.";
kjv[12] = "Ye [are] my brethren, ye [are] my bones and my flesh: wherefore then are ye the last to bring back the king?";
kjv[13] = "And say ye to Amasa, [Art] thou not of my bone, and of my flesh? God do so to me, and more also, if thou be not captain of the host before me continually in the room of Joab.";
kjv[14] = "And he bowed the heart of all the men of Judah, even as [the heart of] one man; so that they sent [this word] unto the king, Return thou, and all thy servants.";
kjv[15] = "So the king returned, and came to Jordan. And Judah came to Gilgal, to go to meet the king, to conduct the king over Jordan.";
kjv[16] = "And Shimei the son of Gera, a Benjamite, which [was] of Bahurim, hasted and came down with the men of Judah to meet king David.";
kjv[17] = "And [there were] a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went over Jordan before the king.";
kjv[18] = "And there went over a ferry boat to carry over the king\'s household, and to do what he thought good. And Shimei the son of Gera fell down before the king, as he was come over Jordan;";
kjv[19] = "And said unto the king, Let not my lord impute iniquity unto me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to his heart.";
kjv[20] = "For thy servant doth know that I have sinned: therefore, behold, I am come the first this day of all the house of Joseph to go down to meet my lord the king.";
kjv[21] = "But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed the LORD\'S anointed?";
kjv[22] = "And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? shall there any man be put to death this day in Israel? for do not I know that I [am] this day king over Israel?";
kjv[23] = "Therefore the king said unto Shimei, Thou shalt not die. And the king sware unto him.";
kjv[24] = "And Mephibosheth the son of Saul came down to meet the king, and had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came [again] in peace.";
kjv[25] = "And it came to pass, when he was come to Jerusalem to meet the king, that the king said unto him, Wherefore wentest not thou with me, Mephibosheth?";
kjv[26] = "And he answered, My lord, O king, my servant deceived me: for thy servant said, I will saddle me an ass, that I may ride thereon, and go to the king; because thy servant [is] lame.";
kjv[27] = "And he hath slandered thy servant unto my lord the king; but my lord the king [is] as an angel of God: do therefore [what is] good in thine eyes.";
kjv[28] = "For all [of] my father\'s house were but dead men before my lord the king: yet didst thou set thy servant among them that did eat at thine own table. What right therefore have I yet to cry any more unto the king?";
kjv[29] = "And the king said unto him, Why speakest thou any more of thy matters? I have said, Thou and Ziba divide the land.";
kjv[30] = "And Mephibosheth said unto the king, Yea, let him take all, forasmuch as my lord the king is come again in peace unto his own house.";
kjv[31] = "And Barzillai the Gileadite came down from Rogelim, and went over Jordan with the king, to conduct him over Jordan.";
kjv[32] = "Now Barzillai was a very aged man, [even] fourscore years old: and he had provided the king of sustenance while he lay at Mahanaim; for he [was] a very great man.";
kjv[33] = "And the king said unto Barzillai, Come thou over with me, and I will feed thee with me in Jerusalem.";
kjv[34] = "And Barzillai said unto the king, How long have I to live, that I should go up with the king unto Jerusalem?";
kjv[35] = "I [am] this day fourscore years old: [and] can I discern between good and evil? can thy servant taste what I eat or what I drink? can I hear any more the voice of singing men and singing women? wherefore then should thy servant be yet a burden unto my lord the king?";
kjv[36] = "Thy servant will go a little way over Jordan with the king: and why should the king recompense it me with such a reward?";
kjv[37] = "Let thy servant, I pray thee, turn back again, that I may die in mine own city, [and be buried] by the grave of my father and of my mother. But behold thy servant Chimham; let him go over with my lord the king; and do to him what shall seem good unto thee.";
kjv[38] = "And the king answered, Chimham shall go over with me, and I will do to him that which shall seem good unto thee: and whatsoever thou shalt require of me, [that] will I do for thee.";
kjv[39] = "And all the people went over Jordan. And when the king was come over, the king kissed Barzillai, and blessed him; and he returned unto his own place.";
kjv[40] = "Then the king went on to Gilgal, and Chimham went on with him: and all the people of Judah conducted the king, and also half the people of Israel.";
kjv[41] = "And, behold, all the men of Israel came to the king, and said unto the king, Why have our brethren the men of Judah stolen thee away, and have brought the king, and his household, and all David\'s men with him, over Jordan?";
kjv[42] = "And all the men of Judah answered the men of Israel, Because the king [is] near of kin to us: wherefore then be ye angry for this matter? have we eaten at all of the king\'s [cost]? or hath he given us any gift?";
kjv[43] = "And the men of Israel answered the men of Judah, and said, We have ten parts in the king, and we have also more [right] in David than ye: why then did ye despise us, that our advice should not be first had in bringing back our king? And the words of the men of Judah were fiercer than the words of the men of Israel.";

dby[9] = "And all the people were at strife throughout the tribes of Israel, saying, The king delivered us out of the hand of our enemies, and he saved us out of the hand of the Philistines; and now he is fled out of the land because of Absalom.";
web[9] = "And all the people were at strife throughout all the tribes of Israel, saying, The king saved us from the hand of our enemies, and he delivered us from the hand of the Philistines; and now he hath fled out of the land for Absalom.";
hnv[9] = "All the people were at strife throughout all the tribes of Yisra\'el, saying, The king delivered us out of the hand of our enemies, and he saved us out of the hand of the Pelishtim; and now he is fled out of the land from Avshalom.";
vul[9] = "omnis quoque populus certabat in cunctis tribubus Israhel dicens rex liberavit nos de manu inimicorum nostrorum ipse salvavit nos de manu Philisthinorum et nunc fugit de terra propter Absalom";
rsv[10] = "But Ab\'salom, whom we anointed over us, is dead in battle. Now therefore why do you say nothing about bringing the king back?&quot;";
asv[10] = "And Absalom, whom we anointed over us, is dead in battle. Now therefore why speak ye not a word of bringing the king back?";
yng[10] = "and Absalom whom we anointed over us [is] dead in battle, and now, why are ye silent -- to bring back the king?\'";
dby[10] = "And Absalom, whom we anointed over us, is dead in battle; and now why are ye silent as to bringing the king back?";
web[10] = "And Absalom, whom we anointed over us, is dead in battle. Now therefore why speak ye not a word of bringing the king back?";
hnv[10] = "Avshalom, whom we anointed over us, is dead in battle. Now therefore why don\'t you speak a word of bringing the king back?";
vul[10] = "Absalom autem quem unximus super nos mortuus est in bello usquequo siletis et non reducitis regem";
rsv[11] = "And King David sent this message to Zadok and Abi\'athar the priests, &quot;Say to the elders of Judah, \'Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king?";
asv[11] = "And king David sent to Zadok and to Abiathar the priests, saying, Speak unto the elders of Judah, saying, Why are ye the last to bring the king back to his house? seeing the speech of all Israel is come to the king, [to bring him] to his house.";
yng[11] = "And king David sent unto Zadok and unto Abiathar the priests, saying, `Speak ye unto the elders of Judah, saying, Why are ye last to bring back the king unto his house? (and the word of all Israel hath come unto the king, unto his house;)";
dby[11] = "And king David sent to Zadok and to Abiathar the priests, saying, Speak to the elders of Judah saying, Why are ye the last to bring the king back to his house? seeing the speech of all Israel is come to the king, to his house.";
web[11] = "And king David sent to Zadok and to Abiathar the priests, saying, Speak to the elders of Judah, saying, Why are ye the last to bring the king back to his house? seeing the speech of all Israel is come to the king, [even] to his house.";
hnv[11] = "King David sent to Tzadok and to Avyatar the Kohanim, saying, Speak to the Zakenim of Yehudah, saying, Why are you the last to bring the king back to his house? seeing the speech of all Yisra\'el is come to the king, [to bring him] to his house.";
vul[11] = "rex vero David misit ad Sadoc et ad Abiathar sacerdotes dicens loquimini ad maiores natu Iuda dicentes cur venitis novissimi ad reducendum regem in domum suam sermo autem omnis Israhel pervenerat ad regem in domo eius";
rsv[12] = "You are my kinsmen, you are my bone and my flesh; why then should you be the last to bring back the king?\'";
asv[12] = "Ye are my brethren, ye are my bone and my flesh: wherefore then are ye the last to bring back the king?";
yng[12] = "my brethren ye [are], my bone and my flesh ye [are], and why are ye last to bring back the king?";
dby[12] = "Ye are my brethren, ye are my bone and my flesh; and why will ye be the last to bring back the king?";
web[12] = "Ye [are] my brethren, ye [are] my bones and my flesh: why then are ye the last to bring back the king?";
hnv[12] = "You are my brothers, you are my bone and my flesh: why then are you the last to bring back the king?";
vul[12] = "fratres mei vos os meum et caro mea vos quare novissimi reducitis regem";
rsv[13] = "And say to Ama\'sa, \'Are you not my bone and my flesh? God do so to me, and more also, if you are not commander of my army henceforth in place of Jo\'ab.\'&quot;";
asv[13] = "And say ye to Amasa, Art thou not my bone and my flesh? God do so to me, and more also, if thou be not captain of the host before me continually in the room of Joab.";
yng[13] = "And to Amasa say ye, Art not thou my bone and my flesh? Thus doth God do to me, and thus He doth add, if thou art not head of the host before me all the days instead of Joab.\'";
dby[13] = "And say to Amasa, Art thou not my bone and my flesh? God do so to me and more also, if thou be not captain of the host before me continually instead of Joab.";
web[13] = "And say ye to Amasa, [Art] thou not of my bone, and of my flesh? God do so to me, and more also, if thou be not captain of the host before me continually in the room of Joab.";
hnv[13] = "Say you to `Amasa, Aren\'t you my bone and my flesh? God do so to me, and more also, if you aren\'t captain of the host before me continually in the room of Yo\'av.";
vul[13] = "et Amasae dicite nonne os meum es et caro mea haec faciat mihi Deus et haec addat si non magister militiae fueris coram me omni tempore pro Ioab";
rsv[14] = "And he swayed the heart of all the men of Judah as one man; so that they sent word to the king, &quot;Return, both you and all your servants.&quot;";
asv[14] = "And he bowed the heart of all the men of Judah, even as [the heart of] one man; so that they sent unto the king, [saying], Return thou, and all thy servants.";
yng[14] = "And he inclineth the heart of all the men of Judah as one man, and they send unto the king, `Turn back, thou, and all thy servants.\'";
dby[14] = "And he bowed the heart of all the men of Judah as of one man; and they sent to the king, Return, thou and all thy servants.";
web[14] = "And he bowed the heart of all the men of Judah, even as [the heart of] one man; so that they sent [this word] to the king, Return thou, and all thy servants.";
hnv[14] = "He bowed the heart of all the men of Yehudah, even as [the heart of] one man; so that they sent to the king, [saying], Return you, and all your servants.";
vul[14] = "et inclinavit cor omnium virorum Iuda quasi viri unius miseruntque ad regem dicentes revertere tu et omnes servi tui";
rsv[15] = "So the king came back to the Jordan; and Judah came to Gilgal to meet the king and to bring the king over the Jordan.";
asv[15] = "So the king returned, and came to the Jordan. And Judah came to Gilgal, to go to meet the king, to bring the king over the Jordan.";
yng[15] = "And the king turneth back, and cometh in unto the Jordan, and Judah hath come to Gilgal, to go to meet the king, to bring the king over the Jordan,";
dby[15] = "And the king returned and came as far as the Jordan. And Judah came to Gilgal, to go to meet the king, to conduct the king over the Jordan.";
web[15] = "So the king returned, and came to Jordan. And Judah came to Gilgal, to go to meet the king, to conduct the king over Jordan.";
hnv[15] = "So the king returned, and came to the Yarden. Yehudah came to Gilgal, to go to meet the king, to bring the king over the Yarden.";
vul[15] = "et reversus est rex et venit usque ad Iordanem et Iuda venit in Galgala ut occurreret regi et transduceret eum Iordanem";
rsv[16] = "And Shim\'e-i the son of Gera, the Benjaminite, from Bahu\'rim, made haste to come down with the men of Judah to meet King David;";
asv[16] = "And Shimei the son of Gera, the Benjamite, who was of Bahurim, hasted and came down with the men of Judah to meet king David.";
yng[16] = "and Shimei son of Gera, the Benjamite, who [is] from Bahurim, hasteth, and cometh down with the men of Judah, to meet king David,";
dby[16] = "And Shimei the son of Gera, the Benjaminite, who was of Bahurim, hasted and came down with the men of Judah to meet king David.";
web[16] = "And Shimei the son of Gera, a Benjaminite, who [was] of Bahurim, hasted and came down with the men of Judah to meet king David.";
hnv[16] = "Shim`i the son of Gera, the Binyamini, who was of Bachurim, hurried and came down with the men of Yehudah to meet king David.";
vul[16] = "festinavit autem Semei filius Gera filii Iemini de Baurim et descendit cum viris Iuda in occursum regis David";
rsv[17] = "and with him were a thousand men from Benjamin. And Ziba the servant of the house of Saul, with his fifteen sons and his twenty servants, rushed down to the Jordan before the king,";
asv[17] = "And there were a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went through the Jordan in the presence of the king.";
yng[17] = "and a thousand men [are] with him from Benjamin, and Ziba servant of the house of Saul, and his fifteen sons and his twenty servants with him, and they have gone prosperously over the Jordan before the king.";
dby[17] = "And there were a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they forded the Jordan before the king.";
web[17] = "And [there were] a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went over Jordan before the king.";
hnv[17] = "There were a thousand men of Binyamin with him, and Tziva the servant of the house of Sha\'ul, and his fifteen sons and his twenty servants with him; and they went through the Yarden in the presence of the king.";
vul[17] = "cum mille viris de Beniamin et Siba puer de domo Saul et quindecim filii eius ac viginti servi erant cum eo et inrumpentes Iordanem ante regem";
rsv[18] = "and they crossed the ford to bring over the king\'s household, and to do his pleasure. And Shim\'e-i the son of Gera fell down before the king, as he was about to cross the Jordan,";
asv[18] = "And there went over a ferry-boat to bring over the king\'s household, and to do what he thought good. And Shimei the son of Gera fell down before the king, when he was come over the Jordan.";
yng[18] = "And passed over hath the ferry-boat to carry over the household of the king, and to do that which [is] good in his eyes, and Shimei son of Gera hath fallen before the king in his passing over into Jordan,";
dby[18] = "And a ferry boat passed to and fro to carry over the king\'s household, and to do what he thought good. And Shimei the son of Gera fell down before the king as he was [just] crossing over the Jordan.";
web[18] = "And there went over a ferry-boat to carry over the king\'s household, and to do what he thought good. And Shimei the son of Gera fell down before the king, as he came over Jordan;";
hnv[18] = "There went over a ferry-boat to bring over the king\'s household, and to do what he thought good. Shim`i the son of Gera fell down before the king, when he was come over the Yarden.";
vul[18] = "transierunt vada ut transducerent domum regis et facerent iuxta iussionem eius Semei autem filius Gera prostratus coram rege cum iam transisset Iordanem";
rsv[19] = "and said to the king, &quot;Let not my lord hold me guilty or remember how your servant did wrong on the day my lord the king left Jerusalem; let not the king bear it in mind.";
asv[19] = "And he said unto the king, Let not my lord impute iniquity unto me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to his heart.";
yng[19] = "and saith unto the king, `Let not my lord impute to me iniquity; neither do thou remember that which thy servant did perversely in the day that my lord the king went out from Jerusalem, -- for the king to set [it] unto his heart;";
dby[19] = "And he said to the king, Let not my lord impute iniquity to me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to heart.";
web[19] = "And said to the king, Let not my lord impute iniquity to me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to his heart.";
hnv[19] = "He said to the king, Don\'t let my lord impute iniquity to me, neither do you remember that which your servant did perversely the day that my lord the king went out of Yerushalayim, that the king should take it to his heart.";
vul[19] = "dixit ad eum ne reputes mihi domine mi iniquitatem neque memineris iniuriam servi tui in die qua egressus es domine mi rex de Hierusalem neque ponas rex in corde tuo";
rsv[20] = "For your servant knows that I have sinned; therefore, behold, I have come this day, the first of all the house of Joseph to come down to meet my lord the king.&quot;";
asv[20] = "For thy servant doth know that I have sinned: therefore, behold, I am come this day the first of all the house of Joseph to go down to meet my lord the king.";
yng[20] = "for thy servant hath known that I have sinned; and lo, I have come to-day, first of all the house of Joseph, to go down to meet my lord the king.\'";
dby[20] = "For thy servant knows that I have sinned; and behold, I am come the first this day of all the house of Joseph to go down to meet my lord the king.";
web[20] = "For thy servant doth know that I have sinned: therefore behold, I have come the first this day of all the house of Joseph to go down to meet my lord the king.";
hnv[20] = "For your servant does know that I have sinned: therefore, behold, I am come this day the first of all the house of Yosef to go down to meet my lord the king.";
vul[20] = "agnosco enim servus tuus peccatum meum et idcirco hodie primus veni de omni domo Ioseph descendique in occursum domini mei regis";
rsv[21] = "Abi\'shai the son of Zeru\'iah answered, &quot;Shall not Shim\'e-i be put to death for this, because he cursed the LORD\'S anointed?&quot;";
asv[21] = "But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed Jehovah\'s anointed?";
yng[21] = "And Abishai son of Zeruiah answereth and saith, `For this is not Shimei put to death -- because he reviled the anointed of Jehovah?\'";
dby[21] = "And Abishai the son of Zeruiah answered and said, Should not Shimei be put to death for this, because he cursed Jehovah\'s anointed?";
web[21] = "But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed the LORD\'S anointed?";
hnv[21] = "But Avishai the son of Tzeru\'yah answered, Shall Shim`i not be put to death for this, because he cursed the LORD\'s anointed?";
vul[21] = "respondens vero Abisai filius Sarviae dixit numquid pro his verbis non occidetur Semei quia maledixit christo Domini";
rsv[22] = "But David said, &quot;What have I to do with you, you sons of Zeru\'iah, that you should this day be as an adversary to me? Shall any one be put to death in Israel this day? For do I not know that I am this day king over Israel?&quot;";
asv[22] = "And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? shall there any man be put to death this day in Israel? for do not I know that I am this day king over Israel?";
yng[22] = "And David saith, `What -- to me and to you, O sons of Zeruiah, that ye are to me to-day for an adversary? to-day is any man put to death in Israel? for have I not known that to-day I [am] king over Israel?\'";
dby[22] = "And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries to me? Should there any man be put to death this day in Israel? for do not I know that I am this day king over Israel?";
web[22] = "And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries to me? shall there any man be put to death this day in Israel? for do not I know that I [am] this day king over Israel?";
hnv[22] = "David said, What have I to do with you, you sons of Tzeru\'yah, that you should this day be adversaries to me? shall there any man be put to death this day in Yisra\'el? for don\'t I know that I am this day king over Yisra\'el?";
vul[22] = "et ait David quid mihi et vobis filii Sarviae cur efficimini mihi hodie in Satan ergone hodie interficietur vir in Israhel an ignoro hodie me factum regem super Israhel";
rsv[23] = "And the king said to Shim\'e-i, &quot;You shall not die.&quot; And the king gave him his oath.";
asv[23] = "And the king said unto Shimei, Thou shalt not die. And the king sware unto him.";
yng[23] = "And the king saith unto Shimei, `Thou dost not die;\' and the king sweareth to him.";
dby[23] = "And the king said to Shimei, Thou shalt not die. And the king swore to him.";
web[23] = "Therefore the king said to Shimei, Thou shalt not die. And the king swore to him.";
hnv[23] = "The king said to Shim`i, You shall not die. The king swore to him.";
vul[23] = "et ait rex Semei non morieris iuravitque ei";
rsv[24] = "And Mephib\'osheth the son of Saul came down to meet the king; he had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came back in safety.";
asv[24] = "And Mephibosheth the son of Saul came down to meet the king; and he had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came home in peace.";
yng[24] = "And Mephibosheth son of Saul hath come down to meet the king -- and he prepared not his feet, nor did he prepare his upper lip, yea, his garments he washed not, even from the day of the going away of the king, till the day that he came in peace --";
dby[24] = "And Mephibosheth the son of Saul came down to meet the king. Now he had neither washed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came [again] in peace.";
web[24] = "And Mephibosheth the son of Saul came down to meet the king, and had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came [again] in peace.";
hnv[24] = "Mefivoshet the son of Sha\'ul came down to meet the king; and he had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came home in shalom.";
vul[24] = "Mifiboseth quoque filius Saul descendit in occursum regis inlotis pedibus et intonsa barba vestesque suas non laverat a die qua egressus fuerat rex usque ad diem reversionis eius in pace";
rsv[25] = "And when he came from Jerusalem to meet the king, the king said to him, &quot;Why did you not go with me, Mephib\'osheth?&quot;";
asv[25] = "And it came to pass, when he was come to Jerusalem to meet the king, that the king said unto him, Wherefore wentest not thou with me, Mephibosheth?";
yng[25] = "and it cometh to pass, when he hath come to Jerusalem to meet the king, that the king saith to him, `Why didst thou not go with me, Mephibosheth?\'";
dby[25] = "And as soon as Jerusalem came to meet the king, the king said to him, Why didst thou not go with me, Mephibosheth?";
web[25] = "And it came to pass, when he had come to Jerusalem to meet the king, that the king said to him, Why didst thou not go with me, Mephibosheth?";
hnv[25] = "It happened, when he was come to Yerushalayim to meet the king, that the king said to him, Why didn\'t you go with me, Mefivoshet?";
vul[25] = "cumque Hierusalem occurrisset regi dixit ei rex quare non venisti mecum Mifiboseth";
rsv[26] = "He answered, &quot;My lord, O king, my servant deceived me; for your servant said to him, \'Saddle an ass for me, that I may ride upon it and go with the king.\' For your servant is lame.";
asv[26] = "And he answered, My lord, O king, my servant deceived me: for thy servant said, I will saddle me an ass, that I may ride thereon, and go with the king; because thy servant is lame.";
yng[26] = "And he saith, `My lord, O king, my servant deceived me, for thy servant said, I saddle for me the ass, and ride on it, and go with the king, for thy servant [is] lame;";
dby[26] = "And he said, My lord, O king, my servant deceived me; for thy servant said, I will saddle me the ass, and ride thereon, and go with the king; for thy servant is lame.";
web[26] = "And he answered, My lord, O king, my servant deceived me: for thy servant said, I will saddle me an ass, that I may ride on it, and go to the king; because thy servant [is] lame.";
hnv[26] = "He answered, My lord, O king, my servant deceived me: for your servant said, I will saddle me a donkey, that I may ride thereon, and go with the king; because your servant is lame.";
vul[26] = "qui respondens ait domine mi rex servus meus contempsit me dixi ei ego famulus tuus ut sterneret mihi asinum et ascendens abirem cum rege claudus enim sum servus tuus";
rsv[27] = "He has slandered your servant to my lord the king. But my lord the king is like the angel of God; do therefore what seems good to you.";
asv[27] = "And he hath slandered thy servant unto my lord the king; but my lord the king is as an angel of God: do therefore what is good in thine eyes.";
yng[27] = "and he uttereth slander against thy servant unto my lord the king, and my lord the king [is] as a messenger of God; and do thou that which is good in thine eyes,";
dby[27] = "And he has slandered thy servant to my lord the king; but my lord the king is as an angel of God; do therefore what is good in thy sight.";
web[27] = "And he hath slandered thy servant to my lord the king; but my lord the king [is] as an angel of God: do therefore [what is] good in thy eyes.";
hnv[27] = "He has slandered your servant to my lord the king; but my lord the king is as an angel of God: do therefore what is good in your eyes.";
vul[27] = "insuper et accusavit me servum tuum ad te dominum meum regem tu autem domine mi rex sicut angelus Dei fac quod placitum est tibi";
rsv[28] = "For all my father\'s house were but men doomed to death before my lord the king; but you set your servant among those who eat at your table. What further right have I, then, to cry to the king?&quot;";
asv[28] = "For all my father\'s house were but dead men before my lord the king; yet didst thou set thy servant among them that did eat at thine own table. What right therefore have I yet that I should cry any more unto the king?";
yng[28] = "for all the house of my father have been nothing except men of death before my lord the king, and thou dost set thy servant among those eating at thy table, and what right have I any more -- even to cry any more unto the king?\'";
dby[28] = "For all my father\'s house were but dead men before my lord the king; and thou didst set thy servant among them that eat at thine own table. What further right therefore have I? and for what should I cry any more to the king?";
web[28] = "For all [of] my father\'s house were but dead men before my lord the king: yet didst thou set thy servant among them that ate at thy own table. What right therefore have I yet to cry any more to the king?";
hnv[28] = "For all my father\'s house were but dead men before my lord the king; yet you set your servant among those who ate at your own table. What right therefore have I yet that I should cry any more to the king?";
vul[28] = "neque enim fuit domus patris mei nisi morti obnoxia domino meo regi tu autem posuisti me servum tuum inter convivas mensae tuae quid igitur habeo iustae querellae aut quid possum ultra vociferari ad regem";
rsv[29] = "And the king said to him, &quot;Why speak any more of your affairs? I have decided: you and Ziba shall divide the land.&quot;";
asv[29] = "And the king said unto him, Why speakest thou any more of thy matters? I say, Thou and Ziba divide the land.";
yng[29] = "And the king saith to him, `Why dost thou speak any more of thy matters? I have said, Thou and Ziba -- share ye the field.\'";
dby[29] = "And the king said to him, Why speakest thou any more of thy matters? I have said, Thou and Ziba divide the land.";
web[29] = "And the king said to him, Why speakest thou any more of thy matters? I have said, Thou and Ziba divide the land.";
hnv[29] = "The king said to him, Why speak you any more of your matters? I say, You and Tziva divide the land.";
vul[29] = "ait ergo ei rex quid ultra loqueris fixum est quod locutus sum tu et Siba dividite possessiones";
rsv[30] = "And Mephib\'osheth said to the king, &quot;Oh, let him take it all, since my lord the king has come safely home.&quot;";
asv[30] = "And Mephibosheth said unto the king, yea, let him take all, forasmuch as my lord the king is come in peace unto his own house.";
yng[30] = "And Mephibosheth saith unto the king, `Yea, the whole let him take, after that my lord the king hath come in peace unto his house.\'";
dby[30] = "And Mephibosheth said to the king, Let him even take all, since my lord the king is come again in peace to his own house.";
web[30] = "And Mephibosheth said to the king, Yes, let him take all, forasmuch as my lord the king hath come again in peace to his own house.";
hnv[30] = "Mefivoshet said to the king, yes, let him take all, because my lord the king is come in shalom to his own house.";
vul[30] = "responditque Mifiboseth regi etiam cuncta accipiat postquam reversus est dominus meus rex pacifice in domum suam";
rsv[31] = "Now Barzil\'lai the Gileadite had come down from Ro\'gelim; and he went on with the king to the Jordan, to escort him over the Jordan.";
asv[31] = "And Barzillai the Gileadite came down from Rogelim; and he went over the Jordan with the king, to conduct him over the Jordan.";
yng[31] = "And Barzillai the Gileadite hath gone down from Rogelim, and passeth over the Jordan with the king, to send him away over the Jordan;";
dby[31] = "And Barzillai the Gileadite came down from Rogelim, and went over the Jordan with the king, to conduct him over the Jordan.";
web[31] = "And Barzillai the Gileadite came down from Rogelim, and went over Jordan with the king, to conduct him over Jordan.";
hnv[31] = " Barzillai the Gil`adite came down from Roglim; and he went over the Yarden with the king, to conduct him over the Yarden.";
vul[31] = "Berzellai quoque Galaadites descendens de Rogelim transduxit regem Iordanem paratus etiam ultra fluvium prosequi eum";
rsv[32] = "Barzil\'lai was a very aged man, eighty years old; and he had provided the king with food while he stayed at Mahana\'im; for he was a very wealthy man.";
asv[32] = "Now Barzillai was a very aged man, even fourscore years old: and he had provided the king with sustenance while he lay at Mahanaim; for he was a very great man.";
yng[32] = "and Barzillai [is] very aged, a son of eighty years, and he hath sustained the king in his abiding in Mahanaim, for he [is] a very great man;";
dby[32] = "And Barzillai was very aged, eighty years old; and it was he that had maintained the king while he abode at Mahanaim; for he was a very great man.";
web[32] = "Now Barzillai was a very aged man, [even] eighty years old: and he had provided the king with sustenance while he lay at Mahanaim: for he [was] a very great man.";
hnv[32] = "Now Barzillai was a very aged man, even eighty years old: and he had provided the king with sustenance while he lay at Machanayim; for he was a very great man.";
vul[32] = "erat autem Berzellai Galaadites senex valde id est octogenarius et ipse praebuit alimenta regi cum moraretur in Castris fuit quippe vir dives nimis";
rsv[33] = "And the king said to Barzil\'lai, &quot;Come over with me, and I will provide for you with me in Jerusalem.&quot;";
asv[33] = "And the king said unto Barzillai, Come thou over with me, and I will sustain thee with me in Jerusalem.";
yng[33] = "and the king saith unto Barzillai, `Pass thou over with me, and I have sustained thee with me in Jerusalem.\'";
dby[33] = "And the king said to Barzillai, Pass thou over with me, and I will maintain thee with me in Jerusalem.";
web[33] = "And the king said to Barzillai, Come thou over with me, and I will feed thee with me in Jerusalem.";
hnv[33] = "The king said to Barzillai, Come you over with me, and I will sustain you with me in Yerushalayim.";
vul[33] = "dixit itaque rex ad Berzellai veni mecum ut requiescas secure mecum in Hierusalem";
rsv[34] = "But Barzil\'lai said to the king, &quot;How many years have I still to live, that I should go up with the king to Jerusalem?";
asv[34] = "And Barzillai said unto the king, How many are the days of the years of my life, that I should go up with the king unto Jerusalem?";
yng[34] = "And Barzillai saith unto the king, `How many [are] the days of the years of my life, that I go up with the king to Jerusalem?";
dby[34] = "And Barzillai said to the king, How many are the days of the years of my life, that I should go up with the king to Jerusalem?";
web[34] = "And Barzillai said to the king, How long have I to live, that I should go up with the king to Jerusalem?";
hnv[34] = " Barzillai said to the king, How many are the days of the years of my life, that I should go up with the king to Yerushalayim?";
vul[34] = "et ait Berzellai ad regem quot sunt dies annorum vitae meae ut ascendam cum rege Hierusalem";
rsv[35] = "I am this day eighty years old; can I discern what is pleasant and what is not? Can your servant taste what he eats or what he drinks? Can I still listen to the voice of singing men and singing women? Why then should your servant be an added burden to my lord the king?";
asv[35] = "I am this day fourscore years old: can I discern between good and bad? can thy servant taste what I eat or what I drink? can I hear any more the voice of singing men and singing women? wherefore then should thy servant be yet a burden unto my lord the king?";
yng[35] = "A son of eighty years I [am] to-day; do I know between good and evil? doth thy servant taste that which I am eating, and that which I drink? do I hearken any more to the voice of singers and songstresses? and why is thy servant any more for a burden unto my lord the king?";
dby[35] = "I am this day eighty years old: can I discern between good and bad? can thy servant taste what I eat and what I drink? can I hear any more the voice of singing men and singing women? and why should thy servant be yet a burden to my lord the king?";
web[35] = "I [am] this day eighty years old: [and] can I discern between good and evil? can thy servant taste what I eat or what I drink? can I hear any more the voice of singing-men and singing-women? why then should thy servant be yet a burden to my lord the king?";
hnv[35] = "I am this day eighty years old: can I discern between good and bad? can your servant taste what I eat or what I drink? can I hear any more the voice of singing men and singing women? why then should your servant be yet a burden to my lord the king?";
vul[35] = "octogenarius sum hodie numquid vigent sensus mei ad discernendum suave aut amarum aut delectare potest servum tuum cibus et potus vel audire ultra possum vocem cantorum atque cantricum quare servus tuus fit oneri domino meo regi";
rsv[36] = "Your servant will go a little way over the Jordan with the king. Why should the king recompense me with such a reward?";
asv[36] = "Thy servant would but just go over the Jordan with the king: and why should the king recompense it me with such a reward?";
yng[36] = "As a little thing, thy servant doth pass over the Jordan with the king, and why doth the king recompense me this recompense?";
dby[36] = "Thy servant will go a little way over the Jordan with the king; and why should the king recompense it to me with this reward?";
web[36] = "Thy servant will go a little way over Jordan with the king: and why should the king recompense me with such a reward?";
hnv[36] = "Your servant would but just go over the Yarden with the king: and why should the king recompense it me with such a reward?";
vul[36] = "paululum procedam famulus tuus ab Iordane tecum nec indigeo hac vicissitudine";
rsv[37] = "Pray let your servant return, that I may die in my own city, near the grave of my father and my mother. But here is your servant Chimham; let him go over with my lord the king; and do for him whatever seems good to you.&quot;";
asv[37] = "Let thy servant, I pray thee, turn back again, that I may die in mine own city, by the grave of my father and my mother. But behold, thy servant Chimham; let him go over with my lord the king; and do to him what shall seem good unto thee.";
yng[37] = "Let, I pray thee, thy servant turn back again, and I die in mine own city, near the burying-place of my father and of my mother, -- and lo, thy servant Chimham, let him pass over with my lord the king, and do thou to him that which [is] good in thine eyes.\'";
dby[37] = "Let thy servant, I pray thee, turn back again, that I may die in mine own city, by the grave of my father and of my mother. But behold thy servant Chimham: let him go over with my lord the king; and do to him what seems good to thee.";
web[37] = "Let thy servant, I pray thee, return again, that I may die in my own city, [and be buried] by the grave of my father and of my mother. But behold thy servant Chimham; let him go over with my lord the king; and do to him what shall seem good to thee.";
hnv[37] = "Please let your servant turn back again, that I may die in my own city, by the grave of my father and my mother. But behold, your servant Kemoham; let him go over with my lord the king; and do to him what shall seem good to you.";
vul[37] = "sed obsecro ut revertar servus tuus et moriar in civitate mea iuxta sepulchrum patris mei et matris meae est autem servus tuus Chamaam ipse vadat tecum domine mi rex et fac ei quod tibi bonum videtur";
rsv[38] = "And the king answered, &quot;Chimham shall go over with me, and I will do for him whatever seems good to you; and all that you desire of me I will do for you.&quot;";
asv[38] = "And the king answered, Chimham shall go over with me, and I will do to him that which shall seem good unto thee: and whatsoever thou shalt require of me, that will I do for thee.";
yng[38] = "And the king saith, `With me doth Chimham go over, and I do to him that which [is] good in thine eyes, yea, all that thou dost fix on me I do to thee.\'";
dby[38] = "And the king said, Chimham shall go over with me, and I will do to him that which seems good to thee; and whatsoever thou shalt require of me, that will I do for thee.";
web[38] = "And the king answered, Chimham shall go over with me, and I will do to him that which shall seem good to thee: and whatever thou shalt require of me, [that] will I do for thee.";
hnv[38] = "The king answered, Kemoham shall go over with me, and I will do to him that which shall seem good to you: and whatever you shall require of me, that will I do for you.";
vul[38] = "dixitque rex mecum transeat Chamaam et ego faciam ei quicquid tibi placuerit et omne quod petieris a me inpetrabis";
rsv[39] = "Then all the people went over the Jordan, and the king went over; and the king kissed Barzil\'lai and blessed him, and he returned to his own home.";
asv[39] = "And all the people went over the Jordan, and the king went over: and the king kissed Barzillai, and blessed him; and he returned unto his own place.";
yng[39] = "And all the people pass over the Jordan, and the king hath passed over, and the king giveth a kiss to Barzillai, and blesseth him, and he turneth back to his place.";
dby[39] = "And all the people went over the Jordan; and the king went over; and the king kissed Barzillai, and blessed him; and he returned to his own place.";
web[39] = "And all the people went over Jordan. And when the king had come over, the king kissed Barzillai, and blessed him; and he returned to his own place.";
hnv[39] = "All the people went over the Yarden, and the king went over: and the king kissed Barzillai, and blessed him; and he returned to his own place.";
vul[39] = "cumque transisset universus populus et rex Iordanem osculatus est rex Berzellai et benedixit ei et ille reversus est in locum suum";
rsv[40] = "The king went on to Gilgal, and Chimham went on with him; all the people of Judah, and also half the people of Israel, brought the king on his way.";
asv[40] = "So the king went over to Gilgal, and Chimham went over with him: and all the people of Judah brought the king over, and also half the people of Israel.";
yng[40] = "And the king passeth over to Gilgal, and Chimham hath passed over with him, and all the people of Judah, and they bring over the king, and also the half of the people of Israel.";
dby[40] = "And the king went on to Gilgal, and Chimham went on with him; and all the people of Judah conducted the king, and also half the people of Israel.";
web[40] = "Then the king went on to Gilgal, and Chimham went on with him: and all the people of Judah conducted the king, and also half the people of Israel.";
hnv[40] = "So the king went over to Gilgal, and Kemoham went over with him: and all the people of Yehudah brought the king over, and also half the people of Yisra\'el.";
vul[40] = "transivit ergo rex in Galgalam et Chamaam cum eo omnis autem populus Iuda transduxerat regem et media tantum pars adfuerat de populo Israhel";
rsv[41] = "Then all the men of Israel came to the king, and said to the king, &quot;Why have our brethren the men of Judah stolen you away, and brought the king and his household over the Jordan, and all David\'s men with him?&quot;";
asv[41] = "And, behold, all the men of Israel came to the king, and said unto the king, Why have our brethren the men of Judah stolen thee away, and brought the king, and his household, over the Jordan, and all David\'s men with him?";
yng[41] = "And, lo, all the men of Israel are coming unto the king, and they say unto the king, `Wherefore have they stolen thee -- our brethren, the men of Judah?\' (and they bring the king and his household over the Jordan, and all the men of David with him).";
dby[41] = "And behold, all the men of Israel came to the king, and said to the king, Why have our brethren the men of Judah stolen thee away, and have brought the king, and his household, and all David\'s men with him, over the Jordan?";
web[41] = "And behold, all the men of Israel came to the king, and said to him, Why have our brethren the men of Judah stolen thee away, and have brought the king, and his household, and all David\'s men with him, over Jordan?";
hnv[41] = "Behold, all the men of Yisra\'el came to the king, and said to the king, Why have our brothers the men of Yehudah stolen you away, and brought the king, and his household, over the Yarden, and all David\'s men with him?";
vul[41] = "itaque omnes viri Israhel concurrentes ad regem dixerunt ei quare te furati sunt fratres nostri viri Iuda et transduxerunt regem et domum eius Iordanem omnesque viros David cum eo";
rsv[42] = "All the men of Judah answered the men of Israel, &quot;Because the king is near of kin to us. Why then are you angry over this matter? Have we eaten at all at the king\'s expense? Or has he given us any gift?&quot;";
asv[42] = "And all the men of Judah answered the men of Israel, Because the king is near of kin to us: wherefore then are ye angry for this matter? have we eaten at all at the king\'s cost? or hath he given us any gift?";
yng[42] = "And all the men of Judah answer against the men of Israel, `Because the king [is] near unto us, and why [is] this -- ye are displeased about this matter? have we at all eaten of the king\'s [substance?] a gift hath he lifted up to us?\'";
dby[42] = "And all the men of Judah answered the men of Israel, Because the king is near of kin to me; and why then are ye angry for this matter? have we eaten anything which came from the king, or has he given us any present?";
web[42] = "And all the men of Judah answered the men of Israel, Because the king [is] near of kin to us: why then are ye angry for this matter? have we eaten at all at the king\'s [cost]? or hath he given us any gift?";
hnv[42] = " All the men of Yehudah answered the men of Yisra\'el, Because the king is a close relative to us: why then are you angry for this matter? have we eaten at all at the king\'s cost? or has he given us any gift?";
vul[42] = "et respondit omnis vir Iuda ad viros Israhel quia propior mihi est rex cur irasceris super hac re numquid comedimus aliquid ex rege aut munera nobis data sunt";
rsv[43] = "And the men of Israel answered the men of Judah, &quot;We have ten shares in the king, and in David also we have more than you. Why then did you despise us? Were we not the first to speak of bringing back our king?&quot; But the words of the men of Judah were fiercer than the words of the men of Israel.";
asv[43] = "And the men of Israel answered the men of Judah, and said, We have ten parts in the king, and we have also more [right] in David than ye: why then did ye despise us, that our advice should not be first had in bringing back our king? And the words of the men of Judah were fiercer than the words of the men of Israel.";
yng[43] = "And the men of Israel answer the men of Judah, and say, `Ten parts we have in the king, and also in David more than you; and wherefore have ye lightly esteemed us, that our word hath not been first to bring back our king?\' And the word of the men of Judah is sharper than the word of the men of Israel.";
dby[43] = "And the men of Israel answered the men of Judah and said, I have ten parts in the king and I have also more right in David than thou; and why didst thou slight me? and was not my advice the first, to bring back my king? And the words of the men of Judah were harsher than the words of the men of Israel.";
web[43] = "And the men of Israel answered the men of Judah, and said, We have ten parts in the king, and we have also more [right] in David than ye: why then did ye despise us, that our advice should not be first had in bringing back our king? And the words of the men of Judah were fiercer than the words of the men of Israel.";
hnv[43] = "The men of Yisra\'el answered the men of Yehudah, and said, We have ten parts in the king, and we have also more [right] in David than you: why then did you despise us, that our advice should not be first had in bringing back our king? The words of the men of Yehudah were fiercer than the words of the men of Yisra\'el.";
vul[43] = "et respondit vir Israhel ad viros Iuda et ait decem partibus maior ego sum apud regem magisque ad me pertinet David quam ad te cur mihi fecisti iniuriam et non mihi nuntiatum est priori ut reducerem regem meum durius autem responderunt viri Iuda viris Israhel";
</script>
