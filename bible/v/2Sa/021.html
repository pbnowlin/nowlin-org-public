csb[1] = "During David\'s reign there was a famine for three successive years, so David inquired of the LORD. The LORD answered, &quot;It is due to Saul and to his bloody family, because he killed the Gibeonites.&quot;";
csb[2] = "The Gibeonites were not Israelites but rather a remnant of the Amorites. The Israelites had taken an oath concerning them, but Saul had tried to kill them in his zeal for the Israelites and Judah. So David summoned the Gibeonites and spoke to them.";
csb[3] = "He asked the Gibeonites, &quot;What should I do for you? How can I make atonement so that you will bring a blessing on the LORD\'s inheritance? &quot;";
csb[4] = "The Gibeonites said to him, &quot;We are not asking for silver and gold from Saul or his family, and we cannot put anyone to death in Israel.&quot; &quot;Whatever you say, I will do for you,&quot; he said.";
csb[5] = "They replied to the king, &quot;As for the man who annihilated us and plotted to destroy us so we would not exist within the whole territory of Israel,";
csb[6] = "&quot;let seven of his male descendants be handed over to us so we may hang them in the presence of the LORD at Gibeah of Saul, the LORD\'s chosen.&quot; The king answered, &quot;I will hand them over.&quot;";
csb[7] = "David spared Mephibosheth, the son of Saul\'s son Jonathan, because of the oath of the LORD that was between David and Jonathan, Saul\'s son.";
csb[8] = "But the king took Armoni and Mephibosheth, who were the two sons whom Rizpah daughter of Aiah had borne to Saul, and the five sons whom Merab daughter of Saul had borne to Adriel son of Barzillai the Meholathite";
csb[9] = "and handed them over to the Gibeonites. They hanged them on the hill in the presence of the LORD; the seven of them died together. They were executed in the first days of the harvest at the beginning of the barley harvest.";
csb[10] = "Rizpah, Aiah\'s daughter, took sackcloth and spread it out for herself on the rock from the beginning of the harvest until the rain poured down from heaven on the bodies. She kept the birds of the sky from them by day and the wild animals by night.";
csb[11] = "When it was reported to David what Saul\'s concubine Rizpah daughter of Aiah had done,";
csb[12] = "he went and got the bones of Saul and his son Jonathan from the citizens of Jabesh-gilead. They had stolen them from the public square of Beth-shan where the Philistines had hung the bodies the day the Philistines killed Saul at Gilboa.";
csb[13] = "David had the bones brought from there. They gathered up the bones of Saul\'s family who had been hanged";
csb[14] = "and buried the bones of Saul and his son Jonathan at Zela in the land of Benjamin in the tomb of Saul\'s father Kish. They did everything the king commanded. After this, God was receptive to prayer for the land.";
csb[15] = "The Philistines again waged war against Israel. David went down with his soldiers, and they fought the Philistines, but David became exhausted.";
csb[16] = "Then Ishbi-benob, one of the descendants of the giant, whose bronze spear weighed about eight pounds and who wore new armor, intended to kill David.";
csb[17] = "But Abishai son of Zeruiah came to his aid, struck the Philistine, and killed him. Then David\'s men swore to him: &quot;You must never again go out with us to battle. You must not extinguish the lamp of Israel.&quot;";
csb[18] = "After this, there was another battle with the Philistines at Gob. At that time Sibbecai the Hushathite killed Saph, who was one of the descendants of the giant.";
csb[19] = "Once again there was a battle with the Philistines at Gob, and Elhanan son of Jaare-oregim the Bethlehemite killed Goliath of Gath. The shaft of his spear was like a weaver\'s beam.";
csb[20] = "At Gath there was still another battle. A huge man was there with six fingers on each hand and six toes on each foot -- twenty-four in all. He, too, was descended from the giant.";
csb[21] = "When he taunted Israel, Jonathan, son of David\'s brother Shimei, killed him.";
csb[22] = "These four were descended from the giant in Gath and were killed by David and his soldiers.";
kjv[1] = "Then there was a famine in the days of David three years, year after year; and David enquired of the LORD. And the LORD answered, [It is] for Saul, and for [his] bloody house, because he slew the Gibeonites.";
kjv[2] = "And the king called the Gibeonites, and said unto them; (now the Gibeonites [were] not of the children of Israel, but of the remnant of the Amorites; and the children of Israel had sworn unto them: and Saul sought to slay them in his zeal to the children of Israel and Judah.)";
kjv[3] = "Wherefore David said unto the Gibeonites, What shall I do for you? and wherewith shall I make the atonement, that ye may bless the inheritance of the LORD?";
kjv[4] = "And the Gibeonites said unto him, We will have no silver nor gold of Saul, nor of his house; neither for us shalt thou kill any man in Israel. And he said, What ye shall say, [that] will I do for you.";
kjv[5] = "And they answered the king, The man that consumed us, and that devised against us [that] we should be destroyed from remaining in any of the coasts of Israel,";
kjv[6] = "Let seven men of his sons be delivered unto us, and we will hang them up unto the LORD in Gibeah of Saul, [whom] the LORD did choose. And the king said, I will give [them].";
kjv[7] = "But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of the LORD\'S oath that [was] between them, between David and Jonathan the son of Saul.";
kjv[8] = "But the king took the two sons of Rizpah the daughter of Aiah, whom she bare unto Saul, Armoni and Mephibosheth; and the five sons of Michal the daughter of Saul, whom she brought up for Adriel the son of Barzillai the Meholathite:";
kjv[9] = "And he delivered them into the hands of the Gibeonites, and they hanged them in the hill before the LORD: and they fell [all] seven together, and were put to death in the days of harvest, in the first [days], in the beginning of barley harvest.";
kjv[10] = "And Rizpah the daughter of Aiah took sackcloth, and spread it for her upon the rock, from the beginning of harvest until water dropped upon them out of heaven, and suffered neither the birds of the air to rest on them by day, nor the beasts of the field by night.";
kjv[11] = "And it was told David what Rizpah the daughter of Aiah, the concubine of Saul, had done.";
kjv[12] = "And David went and took the bones of Saul and the bones of Jonathan his son from the men of Jabeshgilead, which had stolen them from the street of Bethshan, where the Philistines had hanged them, when the Philistines had slain Saul in Gilboa:";
kjv[13] = "And he brought up from thence the bones of Saul and the bones of Jonathan his son; and they gathered the bones of them that were hanged.";
kjv[14] = "And the bones of Saul and Jonathan his son buried they in the country of Benjamin in Zelah, in the sepulchre of Kish his father: and they performed all that the king commanded. And after that God was intreated for the land.";
kjv[15] = "Moreover the Philistines had yet war again with Israel; and David went down, and his servants with him, and fought against the Philistines: and David waxed faint.";
kjv[16] = "And Ishbibenob, which [was] of the sons of the giant, the weight of whose spear [weighed] three hundred [shekels] of brass in weight, he being girded with a new [sword], thought to have slain David.";
kjv[17] = "But Abishai the son of Zeruiah succoured him, and smote the Philistine, and killed him. Then the men of David sware unto him, saying, Thou shalt go no more out with us to battle, that thou quench not the light of Israel.";
kjv[18] = "And it came to pass after this, that there was again a battle with the Philistines at Gob: then Sibbechai the Hushathite slew Saph, which [was] of the sons of the giant.";
kjv[19] = "And there was again a battle in Gob with the Philistines, where Elhanan the son of Jaareoregim, a Bethlehemite, slew [the brother of] Goliath the Gittite, the staff of whose spear [was] like a weaver\'s beam.";
kjv[20] = "And there was yet a battle in Gath, where was a man of [great] stature, that had on every hand six fingers, and on every foot six toes, four and twenty in number; and he also was born to the giant.";
kjv[21] = "And when he defied Israel, Jonathan the son of Shimea the brother of David slew him.";
kjv[22] = "These four were born to the giant in Gath, and fell by the hand of David, and by the hand of his servants.";
rsv[1] = "Now there was a famine in the days of David for three years, year after year; and David sought the face of the LORD. And the LORD said, &quot;There is bloodguilt on Saul and on his house, because he put the Gib\'eonites to death.&quot;";
asv[1] = "And there was a famine in the days of David three years, year after year; and David sought the face of Jehovah. And Jehovah said, It is for Saul, and for his bloody house, because he put to death the Gibeonites.";
yng[1] = "And there is a famine in the days of David three years, year after year, and David seeketh the face of Jehovah, and Jehovah saith, `For Saul and for the bloody house, because that he put to death the Gibeonites.\'";
dby[1] = "And there was a famine in the days of David three years, year after year; and David inquired of Jehovah. And Jehovah said, It is for Saul, and for [his] house of blood, because he slew the Gibeonites.";
web[1] = "Then there was a famine in the days of David three years, year after year; and David inquired of the LORD. And the LORD answered, [It is] for Saul, and for [his] bloody house, because he slew the Gibeonites.";
hnv[1] = "There was a famine in the days of David three years, year after year; and David sought the face of the LORD. The LORD said, It is for Sha\'ul, and for his bloody house, because he put to death the Giv`onim.";
vul[1] = "facta est quoque fames in diebus David tribus annis iugiter et consuluit David oraculum Domini dixitque Dominus propter Saul et domum eius et sanguinem quia occidit Gabaonitas";
rsv[2] = "So the king called the Gib\'eonites. Now the Gib\'eonites were not of the people of Israel, but of the remnant of the Amorites; although the people of Israel had sworn to spare them, Saul had sought to slay them in his zeal for the people of Israel and Judah.";
asv[2] = "And the king called the Gibeonites, and said unto them (now the Gibeonites were not of the children of Israel, but of the remnant of the Amorites; and the children of Israel had sworn unto them: and Saul sought to slay them in his zeal for the children of Israel and Judah);";
yng[2] = "And the king calleth for the Gibeonites, and saith unto them -- as to the Gibeonites, they [are] not of the sons of Israel, but of the remnant of the Amorite, and the sons of Israel had sworn to them, and Saul seeketh to smite them in his zeal for the sons of Israel and Judah --";
dby[2] = "And the king called the Gibeonites, and spoke to them. (Now the Gibeonites were not of the children of Israel, but of the remainder of the Amorites; and the children of Israel had sworn to them; and Saul sought to smite them in his zeal for the children of Israel and Judah.)";
web[2] = "And the king called the Gibeonites, and said to them; (now the Gibeonites [were] not of the children of Israel, but of the remnant of the Amorites; and the children of Israel had sworn to them: and Saul sought to slay them, in his zeal to the children of Israel and Judah.)";
hnv[2] = "The king called the Giv`onim, and said to them (now the Giv`onim were not of the children of Yisra\'el, but of the remnant of the Amori; and the children of Yisra\'el had sworn to them: and Sha\'ul sought to kill them in his zeal for the children of Yisra\'el and Yehudah);";
vul[2] = "vocatis ergo Gabaonitis rex dixit ad eos porro Gabaonitae non sunt de filiis Israhel sed reliquiae Amorreorum filii quippe Israhel iuraverant eis et voluit Saul percutere eos zelo quasi pro filiis Israhel et Iuda";
rsv[3] = "And David said to the Gib\'eonites, &quot;What shall I do for you? And how shall I make expiation, that you may bless the heritage of the LORD?&quot;";
asv[3] = "and David said unto the Gibeonites, What shall I do for you? and wherewith shall I make atonement, that ye may bless the inheritance of Jehovah?";
yng[3] = "yea, David saith unto the Gibeonites, `What do I do for you? and with what do I make atonement? and bless ye the inheritance of Jehovah.\'";
dby[3] = "And David said to the Gibeonites, What shall I do for you? and with what shall I make atonement, that ye may bless the inheritance of Jehovah?";
web[3] = "Wherefore David said to the Gibeonites, What shall I do for you? and with what shall I make the atonement, that ye may bless the inheritance of the LORD?";
hnv[3] = "and David said to the Giv`onim, What shall I do for you? And with what shall I make atonement, that you may bless the inheritance of the LORD?";
vul[3] = "dixit ergo David ad Gabaonitas quid faciam vobis et quod erit vestri piaculum ut benedicatis hereditati Domini";
rsv[4] = "The Gib\'eonites said to him, &quot;It is not a matter of silver or gold between us and Saul or his house; neither is it for us to put any man to death in Israel.&quot; And he said, &quot;What do you say that I shall do for you?&quot;";
asv[4] = "And the Gibeonites said unto him, It is no matter of silver or gold between us and Saul, or his house; neither is it for us to put any man to death in Israel. And he said, What ye shall say, that will I do for you.";
yng[4] = "And the Gibeonites say to him, `We have no silver and gold by Saul and by his house, and we have no man to put to death in Israel;\' and he saith, `What ye are saying I do to you.\'";
dby[4] = "And the Gibeonites said to him, As to Saul and his house, it is with us no question of receiving silver or gold, neither is it for us to have any man put to death in Israel. And he said, What ye say will I do for you.";
web[4] = "And the Gibeonites said to him, We will have no silver nor gold of Saul, nor of his house; neither for us shalt thou kill any man in Israel. And he said, What ye shall say, [that] will I do for you.";
hnv[4] = "The Giv`onim said to him, It is no matter of silver or gold between us and Sha\'ul, or his house; neither is it for us to put any man to death in Yisra\'el. He said, What you shall say, that will I do for you.";
vul[4] = "dixeruntque ei Gabaonitae non est nobis super argento et auro quaestio contra Saul et contra domum eius neque volumus ut interficiatur homo de Israhel ad quos ait quid ergo vultis ut faciam vobis";
rsv[5] = "They said to the king, &quot;The man who consumed us and planned to destroy us, so that we should have no place in all the territory of Israel,";
asv[5] = "And they said unto the king, The man that consumed us, and that devised against us, [that] we should be destroyed from remaining in any of the borders of Israel,";
yng[5] = "And they say unto the king, `The man who consumed us, and who devised against us -- we have been destroyed from stationing ourselves in all the border of Israel --";
dby[5] = "And they said to the king, The man that consumed us, and that devised against us that we should be destroyed from remaining in all the borders of Israel,";
web[5] = "And they answered the king, The man that consumed us, and that devised against us [that] we should be destroyed from remaining within the borders of Israel,";
hnv[5] = "They said to the king, The man who consumed us, and who devised against us, [that] we should be destroyed from remaining in any of the borders of Yisra\'el,";
vul[5] = "qui dixerunt regi virum qui adtrivit nos et oppressit inique ita delere debemus ut ne unus quidem residuus sit de stirpe eius in cunctis finibus Israhel";
rsv[6] = "let seven of his sons be given to us, so that we may hang them up before the LORD at Gibeon on the mountain of the LORD.&quot; And the king said, &quot;I will give them.&quot;";

vul[6] = "dentur nobis septem viri de filiis eius et crucifigamus eos Domino in Gabaath Saul quondam electi Domini et ait rex ego dabo";
rsv[7] = "But the king spared Mephib\'osheth, the son of Saul\'s son Jonathan, because of the oath of the LORD which was between them, between David and Jonathan the son of Saul.";
asv[7] = "But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of Jehovah\'s oath that was between them, between David and Jonathan the son of Saul.";
yng[7] = "and the king hath pity on Mephibosheth son of Jonathan, son of Saul, because of the oath of Jehovah that [is] between them, between David and Jonathan son of Saul;";
dby[7] = "But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of Jehovah\'s oath that was between them, between David and Jonathan the son of Saul.";
web[7] = "But the king spared Mephibosheth, the son of Jonathan, the son of Saul, because of the LORD\'S oath that [was] between them, between David and Jonathan the son of Saul.";

vul[7] = "pepercitque rex Mifiboseth filio Ionathan filii Saul propter iusiurandum Domini quod fuerat inter David et inter Ionathan filium Saul";
rsv[8] = "The king took the two sons of Rizpah the daughter of Ai\'ah, whom she bore to Saul, Armo\'ni and Mephib\'osheth; and the five sons of Merab the daughter of Saul, whom she bore to A\'dri-el the son of Barzil\'lai the Meho\'lathite;";
asv[8] = "But the king took the two sons of Rizpah the daughter of Aiah, whom she bare unto Saul, Armoni and Mephibosheth; and the five sons of Michal the daughter of Saul, whom she bare to Adriel the son of Barzillai the Meholathite:";
yng[8] = "and the king taketh the two sons of Rizpah daughter of Aiah, whom she bore to Saul, Armoni and Mephibosheth, and the five sons of Michal daughter of Saul whom she bare to Adriel son of Barzillai the Meholathite,";
dby[8] = "And the king took the two sons of Rizpah the daughter of Aiah, whom she had borne to Saul, Armoni and Mephibosheth; and the five sons of [the sister of] Michal the daughter of Saul, whom she had borne to Adriel the son of Barzillai the Meholathite;";
web[8] = "But the king took the two sons of Rizpah the daughter of Aiah, whom she bore to Saul, Armoni and Mephibosheth; and the five sons of Michal the daughter of Saul, whom she brought up for Adriel the son of Barzillai the Meholathite:";
hnv[8] = "But the king took the two sons of Ritzpah the daughter of Ayah, whom she bore to Sha\'ul, Armoni and Mefivoshet; and the five sons of Mikhal the daughter of Sha\'ul, whom she bore to `Adri\'el the son of Barzillai the Mecholati:";
vul[8] = "tulit itaque rex duos filios Respha filiae Ahia quos peperit Saul Armoni et Mifiboseth et quinque filios Michol filiae Saul quos genuerat Hadriheli filio Berzellai qui fuit de Molathi";
rsv[9] = "and he gave them into the hands of the Gib\'eonites, and they hanged them on the mountain before the LORD, and the seven of them perished together. They were put to death in the first days of harvest, at the beginning of barley harvest.";
asv[9] = "And he delivered them into the hands of the Gibeonites, and they hanged them in the mountain before Jehovah, and they fell [all] seven together. And they were put to death in the days of harvest, in the first days, at the beginning of barley harvest.";
yng[9] = "and giveth them into the hand of the Gibeonites, and they hang them in the hill before Jehovah; and the seven fall together, and they have been put to death in the days of harvest, in the first [days], the commencement of barley-harvest.";
dby[9] = "and he gave them into the hands of the Gibeonites, and they hanged them on the hill before Jehovah. And they fell all seven together, and were put to death in the first days of the harvest, in the beginning of barley harvest.";

hnv[9] = "He delivered them into the hands of the Giv`onim, and they hanged them in the mountain before the LORD, and they fell [all] seven together. They were put to death in the days of harvest, in the first days, at the beginning of barley harvest.";
vul[9] = "et dedit eos in manu Gabaonitarum qui crucifixerunt illos in monte coram Domino et ceciderunt hii septem simul occisi in diebus messis primis incipiente messione hordei";
rsv[10] = "Then Rizpah the daughter of Ai\'ah took sackcloth, and spread it for herself on the rock, from the beginning of harvest until rain fell upon them from the heavens; and she did not allow the birds of the air to come upon them by day, or the beasts of the field by night.";
asv[10] = "And Rizpah the daughter of Aiah took sackcloth, and spread it for her upon the rock, from the beginning of harvest until water was poured upon them from heaven; and she suffered neither the birds of the heavens to rest on them by day, nor the beasts of the field by night.";
yng[10] = "And Rizpah daughter of Aiah taketh the sackcloth, and stretcheth it out for herself on the rock, from the commencement of harvest till water hath been poured out upon them from the heavens, and hath not suffered a fowl of the heavens to rest upon them by day, or the beast of the field by night.";
dby[10] = "Then Rizpah the daughter of Aiah took sackcloth, and spread it for her upon the rock, from the beginning of harvest until water poured on them out of the heavens, and suffered neither the fowl of the heavens to rest on them by day, nor the beasts of the field by night.";
web[10] = "And Rizpah the daughter of Aiah took sackcloth, and spread it for her upon the rock, from the beginning of harvest until water dropped upon them out of heaven, and suffered neither the birds of the air to rest on them by day, nor the beasts of the field by night.";
hnv[10] = "Ritzpah the daughter of Ayah took sackcloth, and spread it for her on the rock, from the beginning of harvest until water was poured on them from the sky; and she allowed neither the birds of the sky to rest on them by day, nor the animals of the field by night.";
vul[10] = "tollens autem Respha filia Ahia cilicium substravit sibi super petram ab initio messis donec stillaret aqua super eos de caelo et non dimisit aves lacerare eos per diem neque bestias per noctem";

yng[11] = "And it is declared to David that which Rizpah daughter of Aiah, concubine of Saul, hath done,";
dby[11] = "And it was told David what Rizpah the daughter of Aiah, the concubine of Saul, had done.";
web[11] = "And it was told David what Rizpah the daughter of Aiah the concubine of Saul had done.";
hnv[11] = "It was told David what Ritzpah the daughter of Ayah, the concubine of Sha\'ul, had done.";
vul[11] = "et nuntiata sunt David quae fecerat Respha filia Ahia concubina Saul";
rsv[12] = "David went and took the bones of Saul and the bones of his son Jonathan from the men of Ja\'besh-gil\'ead, who had stolen them from the public square of Beth-shan, where the Philistines had hanged them, on the day the Philistines killed Saul on Gilbo\'a;";
asv[12] = "And David went and took the bones of Saul and the bones of Jonathan his son from the men of Jabesh-gilead, who had stolen them from the street of Beth-shan, where the Philistines had hanged them, in the day that the Philistines slew Saul in Gilboa;";
yng[12] = "and David goeth and taketh the bones of Saul, and the bones of Jonathan his son, from the possessors of Jabesh-Gilead, who had stolen them from the broad place of Beth-Shan, where the Philistines hanged them, in the day of the Philistines smiting Saul in Gilboa;";
dby[12] = "And David went and took the bones of Saul and the bones of Jonathan his son from the men of Jabesh-Gilead, who had stolen them from the open place of Beth-shan, where the Philistines had hanged them, the day the Philistines had smitten Saul in Gilboa;";
web[12] = "And David went and took the bones of Saul and the bones of Jonathan his son from the men of Jabesh-gilead, who had stolen them from the street of Beth-shan, where the Philistines had hanged them, when the Philistines had slain Saul in Gilboa:";
hnv[12] = "David went and took the bones of Sha\'ul and the bones of Yonatan his son from the men of Yavesh-Gil`ad, who had stolen them from the street of Beth-shan, where the Pelishtim had hanged them, in the day that the Pelishtim killed Sha\'ul in Gilboa;";
vul[12] = "et abiit David et tulit ossa Saul et ossa Ionathan filii eius a viris Iabesgalaad qui furati fuerant ea de platea Bethsan in qua suspenderant eos Philisthim cum interfecissent Saul in Gelboe";
rsv[13] = "and he brought up from there the bones of Saul and the bones of his son Jonathan; and they gathered the bones of those who were hanged.";
asv[13] = "and he brought up from thence the bones of Saul and the bones of Jonathan his son: and they gathered the bones of them that were hanged.";
yng[13] = "and he bringeth up thence the bones of Saul, and the bones of Jonathan his son, and they gather the bones of those hanged,";
dby[13] = "and he brought up from thence the bones of Saul and the bones of Jonathan his son; and they gathered the bones of them that were hanged.";
web[13] = "And he brought up from thence the bones of Saul and the bones of Jonathan his son; and they gathered the bones of them that were hanged.";
hnv[13] = "and he brought up from there the bones of Sha\'ul and the bones of Yonatan his son: and they gathered the bones of those who were hanged.";
vul[13] = "et asportavit inde ossa Saul et ossa Ionathan filii eius et colligentes ossa eorum qui adfixi fuerant";
rsv[14] = "And they buried the bones of Saul and his son Jonathan in the land of Benjamin in Zela, in the tomb of Kish his father; and they did all that the king commanded. And after that God heeded supplications for the land.";
asv[14] = "And they buried the bones of Saul and Jonathan his son in the country of Benjamin in Zela, in the sepulchre of Kish his father: and they performed all that the king commanded. And after that God was entreated for the land.";
yng[14] = "and bury the bones of Saul and of Jonathan his son in the land of Benjamin, in Zelah, in the burying-place of Kish his father, and do all that the king commanded, and God is entreated for the land afterwards.";
dby[14] = "And they buried [them] with the bones of Saul and Jonathan his son in the country of Benjamin in Zela, in the sepulchre of Kish his father; and they did all that the king had commanded. And afterwards God was propitious to the land.";
web[14] = "And the bones of Saul and Jonathan his son they buried in the country of Benjamin in Zelah, in the sepulcher of Kish his father: and they performed all that the king commanded. And after that God was entreated for the land.";
hnv[14] = "They buried the bones of Sha\'ul and Yonatan his son in the country of Binyamin in Zela, in the tomb of Kish his father: and they performed all that the king commanded. After that God was entreated for the land.";
vul[14] = "sepelierunt ea cum ossibus Saul et Ionathan filii eius in terra Beniamin in latere in sepulchro Cis patris eius feceruntque omnia quae praeceperat rex et repropitiatus est Deus terrae post haec";
rsv[15] = "The Philistines had war again with Israel, and David went down together with his servants, and they fought against the Philistines; and David grew weary.";
asv[15] = "And the Philistines had war again with Israel; and David went down, and his servants with him, and fought against the Philistines. And David waxed faint;";
yng[15] = "And again have the Philistines war with Israel, and David goeth down, and his servants with him, and they fight with the Philistines; and David is weary,";
dby[15] = "And the Philistines had yet war again with Israel; and David went down, and his servants with him, and fought with the Philistines. And David was exhausted.";
web[15] = "Moreover, the Philistines had yet war again with Israel; and David went down, and his servants with him, and fought against the Philistines: and David became faint.";
hnv[15] = "The Pelishtim had war again with Yisra\'el; and David went down, and his servants with him, and fought against the Pelishtim. David grew faint;";
vul[15] = "factum est autem rursum proelium Philisthinorum adversum Israhel et descendit David et servi eius cum eo et pugnabant contra Philisthim deficiente autem David";
rsv[16] = "And Ish\'bi-be\'nob, one of the descendants of the giants, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword, thought to kill David.";
asv[16] = "and Ishbibenob, who was of the sons of the giant, the weight of whose spear was three hundred [shekels] of brass in weight, he being girded with a new [sword], thought to have slain David.";
yng[16] = "and Ishbi-Benob, who [is] among the children of the giant -- the weight of his spear [is] three hundred [shekels] weight of brass, and he is girded with a new one -- speaketh of smiting David,";
dby[16] = "And Ishbibenob, who was of the children of Raphah -- the weight of his lance was three hundred shekels of bronze, and he was girded with new [armour] -- thought to smite David.";
web[16] = "And Ishbi-benob, who [was] of the sons of the giant, the weight of whose spear was three hundred [shekels] of brass in weight, he being girded with a new [sword], thought to have slain David.";
hnv[16] = "and Yishbi-Benov, who was of the sons of the Rafa, the weight of whose spear was three hundred [shekels] of brass in weight, he being girded with a new [sword], thought to have slain David.";
vul[16] = "Iesbidenob qui fuit de genere Arafa cuius ferrum hastae trecentas uncias adpendebat et accinctus erat ense novo nisus est percutere David";
rsv[17] = "But Abi\'shai the son of Zeru\'iah came to his aid, and attacked the Philistine and killed him. Then David\'s men adjured him, &quot;You shall no more go out with us to battle, lest you quench the lamp of Israel.&quot;";
asv[17] = "But Abishai the son of Zeruiah succored him, and smote the Philistine, and killed him. Then the men of David sware unto him, saying, Thou shalt go no more out with us to battle, that thou quench not the lamp of Israel.";
yng[17] = "and Abishai son of Zeruiah giveth help to him, and smiteth the Philistine, and putteth him to death; then swear the men of David to him, saying, `Thou dost not go out again with us to battle, nor quench the lamp of Israel.\'";
dby[17] = "And Abishai the son of Zeruiah succoured him, and smote the Philistine and killed him. Then the men of David swore to him, saying, Thou shalt go no more out with us to battle, that thou quench not the lamp of Israel.";
web[17] = "But Abishai the son of Zeruiah succored him, and smote the Philistine, and killed him. Then the men of David swore to him, saying, Thou shalt go out no more with us to battle, that thou mayest not extinguish the light of Israel.";
hnv[17] = "But Avishai the son of Tzeru\'yah helped him, and struck the Pelishti, and killed him. Then the men of David swore to him, saying, You shall go no more out with us to battle, that you don\'t quench the lamp of Yisra\'el.";
vul[17] = "praesidioque ei fuit Abisai filius Sarviae et percussum Philistheum interfecit tunc iuraverunt viri David dicentes non egredieris nobiscum in bellum ne extinguas lucernam Israhel";
rsv[18] = "After this there was again war with the Philistines at Gob; then Sib\'becai the Hu\'shathite slew Saph, who was one of the descendants of the giants.";
asv[18] = "And it came to pass after this, that there was again war with the Philistines at Gob: then Sibbecai the Hushathite slew Saph, who was of the sons of the giant.";
yng[18] = "And it cometh to pass afterwards, that the battle is again in Gob with the Philistines, then hath Sibbechai the Hushathite smitten Saph, who [is] among the children of the giant.";
dby[18] = "And it came to pass after this, that there was again a battle with the Philistines, at Gob; then Sibbechai the Hushathite smote Saph, who was of the children of Raphah.";
web[18] = "And it came to pass after this, that there was again a battle with the Philistines at Gob: then Sibbechai the Hushathite slew Saph, who [was] of the sons of the giant.";
hnv[18] = "It came to pass after this, that there was again war with the Pelishtim at Gov: then Sibbekhai the Hushatite killed Saf, who was of the sons of the Rafa.";
vul[18] = "secundum quoque fuit bellum in Gob contra Philistheos tunc percussit Sobbochai de Usathi Seph de stirpe Arafa";
rsv[19] = "And there was again war with the Philistines at Gob; and Elha\'nan the son of Ja\'areor\'egim, the Bethlehemite, slew Goliath the Gittite, the shaft of whose spear was like a weaver\'s beam.";
asv[19] = "And there was again war with the Philistines at Gob; and Elhanan the son of Jaare-oregim the Beth-lehemite slew Goliath the Gittite, the staff of whose spear was like a weaver\'s beam.";
yng[19] = "And the battle is again in Gob with the Philistines, and Elhanan son of Jaare-Oregim, the Beth-Lehemite, smiteth [a brother of] Goliath the Gittite, and the wood of his spear [is] like a beam of weavers.";
dby[19] = "And there was again a battle at Gob with the Philistines; and Elhanan the son of Jaare-oregim, a Bethlehemite, smote Goliath the Gittite; now the shaft of his spear was like a weaver\'s beam.";
web[19] = "And there was again a battle in Gob with the Philistines, where Elhanan the son of Jaareoregim, a Beth-lehemite, slew [the brother of] Goliath the Gittite, the staff of whose spear [was] like a weaver\'s beam.";
hnv[19] = "There was again war with the Pelishtim at Gov; and Elchanan the son of Ya`are-Oregim the Beit-Hallachmite killed Golyat the Gittite\'s brother, the staff of whose spear was like a weaver\'s beam.";
vul[19] = "tertium quoque fuit bellum in Gob contra Philistheos in quo percussit Adeodatus filius Saltus polymitarius bethleemites Goliath Gettheum cuius hastile hastae erat quasi liciatorium texentium";
rsv[20] = "And there was again war at Gath, where there was a man of great stature, who had six fingers on each hand, and six toes on each foot, twenty-four in number; and he also was descended from the giants.";
asv[20] = "And there was again war at Gath, where was a man of great stature, that had on every hand six fingers, and on every foot six toes, four and twenty in number; and he also was born to the giant.";
yng[20] = "And the battle is again in Gath, and there is a man of stature, and the fingers of his hands [are] six, and the toes of his feet [are] six, twenty and four in number, and he also hath been born to the giant,";
dby[20] = "And there was again a battle, at Gath; and there was a man [there] of great stature, that had on each hand six fingers, and on each foot six toes, four and twenty in number; and he also was born to Raphah.";
web[20] = "And there was yet a battle in Gath, where was a man of [great] stature, that had on every hand six fingers, and on every foot six toes, four and twenty in number; and he also was born to the giant.";
hnv[20] = "There was again war at Gat, where was a man of great stature, who had on every hand six fingers, and on every foot six toes, four and twenty in number; and he also was born to the Rafa.";
vul[20] = "quartum bellum fuit in Geth in quo vir excelsus qui senos in manibus pedibusque habebat digitos id est viginti et quattuor et erat de origine Arafa";
rsv[21] = "And when he taunted Israel, Jonathan the son of Shim\'e-i, David\'s brother, slew him.";
asv[21] = "And when he defied Israel, Jonathan the son of Shimei, David\'s brother, slew him.";
yng[21] = "and he reproacheth Israel, and smite him doth Jonathan son of Shimeah, brother of David;";
dby[21] = "And he defied Israel; but Jonathan the son of Shimea David\'s brother smote him.";
web[21] = "And when he defied Israel, Jonathan the son of Shimeah the brother of David slew him.";
hnv[21] = "When he defied Yisra\'el, Yonatan the son of Shim`i, David\'s brother, killed him.";
vul[21] = "blasphemavit Israhel percussit autem eum Ionathan filius Sammaa fratris David";
rsv[22] = "These four were descended from the giants in Gath; and they fell by the hand of David and by the hand of his servants.";
asv[22] = "These four were born to the giant in Gath; and they fell by the hand of David, and by the hand of his servants.";
yng[22] = "these four have been born to the giant in Gath, and they fall by the hand of David, and by the hand of his servants.";
dby[22] = "These four were born to Raphah, in Gath; and they fell by the hand of David, and by the hand of his servants.";
web[22] = "These four were born to the giant in Gath, and fell by the hand of David, and by the hand of his servants.";
hnv[22] = "These four were born to the Rafa in Gat; and they fell by the hand of David, and by the hand of his servants.";
vul[22] = "hii quattuor nati sunt de Arafa in Geth et ceciderunt in manu David et servorum eius";
