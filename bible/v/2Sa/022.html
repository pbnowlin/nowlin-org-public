csb[1] = "David spoke the words of this song to the LORD on the day the LORD rescued him from the grasp of all his enemies and from the grasp of Saul.";
csb[2] = "He said: The LORD is my rock, my fortress, and my deliverer,";
csb[3] = "my God, my rock where I seek refuge. My shield, the horn of my salvation, my stronghold, my refuge, and my Savior, you save me from violence.";
csb[4] = "I called to the LORD, who is worthy of praise, and I was saved from my enemies.";
csb[5] = "For the waves of death engulfed me; the torrents of destruction terrified me.";
csb[6] = "The ropes of Sheol entangled me; the snares of death confronted me.";
csb[7] = "I called to the LORD in my distress; I called to my God. From his temple he heard my voice, and my cry for help reached his ears.";
csb[8] = "Then the earth shook and quaked; the foundations of the heavens trembled; they shook because he burned with anger.";
csb[9] = "Smoke rose from his nostrils, and consuming fire came from his mouth; coals were set ablaze by it.";
csb[10] = "He bent the heavens and came down, total darkness beneath his feet.";
csb[11] = "He rode on a cherub and flew, soaring on the wings of the wind.";
csb[12] = "He made darkness a canopy around him, a gathering of water and thick clouds.";
csb[13] = "From the radiance of his presence, blazing coals were ignited.";
csb[14] = "The LORD thundered from heaven; the Most High made his voice heard.";
csb[15] = "He shot arrows and scattered them; he hurled lightning bolts and routed them.";
csb[16] = "The depths of the sea became visible, the foundations of the world were exposed at the rebuke of the LORD, at the blast of the breath of his nostrils.";
csb[17] = "He reached down from on high and took hold of me; he pulled me out of deep water.";
csb[18] = "He rescued me from my powerful enemy and from those who hated me, for they were too strong for me.";
csb[19] = "They confronted me in the day of my calamity, but the LORD was my support.";
csb[20] = "He brought me out to a spacious place; he rescued me because he delighted in me.";
csb[21] = "The LORD rewarded me according to my righteousness; he repaid me according to the cleanness of my hands.";
csb[22] = "For I have kept the ways of the LORD and have not turned from my God to wickedness.";
csb[23] = "Indeed, I let all his ordinances guide me and have not disregarded his statutes.";
csb[24] = "I was blameless before him and kept myself from my iniquity.";
csb[25] = "So the LORD repaid me according to my righteousness, according to my cleanness in his sight.";
csb[26] = "With the faithful you prove yourself faithful, with the blameless you prove yourself blameless,";
csb[27] = "with the pure you prove yourself pure; but with the crooked you prove yourself shrewd.";
csb[28] = "You rescue an oppressed people, but your eyes are set against the proud -- you humble them.";
csb[29] = "LORD, you are my lamp; the LORD illuminates my darkness.";
csb[30] = "With you I can attack a barricade, and with my God I can leap over a wall.";
csb[31] = "God -- his way is perfect; the word of the LORD is pure. He is a shield to all who take refuge in him.";
csb[32] = "For who is God besides the LORD? And who is a rock? Only our God.";
csb[33] = "God is my strong refuge; he makes my way perfect.";
csb[34] = "He makes my feet like the feet of a deer and sets me securely on the heights.";
csb[35] = "He trains my hands for war; my arms can bend a bow of bronze.";
csb[36] = "You have given me the shield of your salvation; your help exalts me.";
csb[37] = "You make a spacious place beneath me for my steps, and my ankles do not give way.";
csb[38] = "I pursue my enemies and destroy them; I do not turn back until they are wiped out.";
csb[39] = "I wipe them out and crush them, and they do not rise; they fall beneath my feet.";
csb[40] = "You have clothed me with strength for battle; you subdue my adversaries beneath me.";
csb[41] = "You have made my enemies retreat before me; I annihilate those who hate me.";
csb[42] = "They look, but there is no one to save them -- they look to the LORD, but he does not answer them.";
csb[43] = "I pulverize them like dust of the earth; I crush them and trample them like mud in the streets.";
csb[44] = "You have freed me from the feuds among my people; you have preserved me as head of nations; a people I had not known serve me.";
csb[45] = "Foreigners submit to me cringing; as soon as they hear, they obey me.";
csb[46] = "Foreigners lose heart and come trembling from their fortifications.";
csb[47] = "The LORD lives -- blessed be my rock! God, the rock of my salvation, is exalted.";
csb[48] = "God -- he grants me vengeance and casts down peoples under me.";
csb[49] = "He frees me from my enemies. You exalt me above my adversaries; you rescue me from violent men.";
csb[50] = "Therefore I will give thanks to you among the nations, LORD; I will sing praises about your name.";
csb[51] = "He is a tower of salvation for his king; he shows loyalty to his anointed, to David and his descendants forever.";
