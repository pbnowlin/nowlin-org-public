csb[1] = "The LORD\'s anger burned against Israel again, and he stirred up David against them to say: &quot;Go, count the people of Israel and Judah.&quot;";
csb[2] = "So the king said to Joab, the commander of his army, &quot;Go through all the tribes of Israel from Dan to Beer-sheba and register the troops so I can know their number.&quot;";
csb[3] = "Joab replied to the king, &quot;May the LORD your God multiply the troops a hundred times more than they are -- while my lord the king looks on! But why does my lord the king want to do this? &quot;";
csb[4] = "Yet the king\'s order prevailed over Joab and the commanders of the army. So Joab and the commanders of the army left the king\'s presence to register the troops of Israel.";
csb[5] = "They crossed the Jordan and camped in Aroer, south of the town in the middle of the valley, and then proceeded toward Gad and Jazer.";
csb[6] = "They went to Gilead and to the land of the Hittites and continued on to Dan-jaan and around to Sidon.";
csb[7] = "They went to the fortress of Tyre and all the cities of the Hivites and Canaanites. Afterward, they went to the Negev of Judah at Beer-sheba.";
csb[8] = "When they had gone through the whole land, they returned to Jerusalem at the end of nine months and twenty days.";
csb[9] = "Joab gave the king the total of the registration of the troops. There were eight hundred thousand valiant armed men from Israel and five hundred thousand men from Judah.";
csb[10] = "David\'s conscience troubled him after he had taken a census of the troops. He said to the LORD, &quot;I have sinned greatly in what I\'ve done. Now, LORD, because I\'ve been very foolish, please take away your servant\'s guilt.&quot;";
csb[11] = "When David got up in the morning, the word of the LORD had come to the prophet Gad, David\'s seer:";
csb[12] = "&quot;Go and say to David, \'This is what the LORD says: I am offering you three choices. Choose one of them, and I will do it to you.\' &quot;";
csb[13] = "So Gad went to David, told him the choices, and asked him, &quot;Do you want three years of famine to come on your land, to flee from your foes three months while they pursue you, or to have a plague in your land three days? Now, consider carefully what answer I should take back to the one who sent me.&quot;";
csb[14] = "David answered Gad, &quot;I have great anxiety. Please, let us fall into the LORD\'s hands because his mercies are great, but don\'t let me fall into human hands.&quot;";
csb[15] = "So the LORD sent a plague on Israel from that morning until the appointed time, and from Dan to Beer-sheba seventy thousand men died.";
csb[16] = "Then the angel extended his hand toward Jerusalem to destroy it, but the LORD relented concerning the destruction and said to the angel who was destroying the people, &quot;Enough, withdraw your hand now! &quot; The angel of the LORD was then at the threshing floor of Araunah the Jebusite.";
csb[17] = "When David saw the angel striking the people, he said to the LORD, &quot;Look, I am the one who has sinned; I am the one who has done wrong. But these sheep, what have they done? Please, let your hand be against me and my father\'s family.&quot;";
csb[18] = "Gad came to David that day and said to him, &quot;Go up and set up an altar to the LORD on the threshing floor of Araunah the Jebusite.&quot;";
csb[19] = "David went up in obedience to Gad\'s command, just as the LORD had commanded.";
csb[20] = "Araunah looked down and saw the king and his servants coming toward him, so he went out and paid homage to the king with his face to the ground.";
csb[21] = "Araunah said, &quot;Why has my lord the king come to his servant? &quot; David replied, &quot;To buy the threshing floor from you in order to build an altar to the LORD, so the plague on the people may be halted.&quot;";
csb[22] = "Araunah said to David, &quot;My lord the king may take whatever he wants and offer it. Here are the oxen for a burnt offering and the threshing sledges and ox yokes for the wood.";
csb[23] = "&quot;Your Majesty, Araunah gives everything here to the king.&quot; Then he said to the king, &quot;May the LORD your God accept you.&quot;";
csb[24] = "The king answered Araunah, &quot;No, I insist on buying it from you for a price, for I will not offer to the LORD my God burnt offerings that cost me nothing.&quot; David bought the threshing floor and the oxen for twenty ounces of silver.";
csb[25] = "He built an altar to the LORD there and offered burnt offerings and fellowship offerings. Then the LORD was receptive to prayer for the land, and the plague on Israel ended.";

kjv[2] = "For the king said to Joab the captain of the host, which [was] with him, Go now through all the tribes of Israel, from Dan even to Beersheba, and number ye the people, that I may know the number of the people.";

yng[2] = "And the king saith unto Joab, head of the host that [is] with him, `Go to and fro, I pray thee, through all the tribes of Israel, from Dan even unto Beer-Sheba, and inspect ye the people -- and I have known the number of the people.\'";
dby[2] = "And the king said to Joab the captain of the host, who was with him, Go, I pray thee, through all the tribes of Israel, from Dan even to Beer-sheba, and count the people, that I may know the number of the people.";

hnv[2] = "The king said to Yo\'av the captain of the host, who was with him, Go now back and forth through all the tribes of Yisra\'el, from Dan even to Be\'er-Sheva, and number you the people, that I may know the sum of the people.";

yng[3] = "And Joab saith unto the king, `Yea, Jehovah thy God doth add unto the people, as they are, a hundred times, and the eyes of my lord the king are seeing; and my lord the king, why is he desirous of this thing?\'";
dby[3] = "And Joab said to the king, May Jehovah thy God even add to the people, how many soever they be, a hundredfold, and that the eyes of my lord the king may see [it]; but why does my lord the king delight in this thing?";

asv[10] = "And David\'s heart smote him after that he had numbered the people. And David said unto Jehovah, I have sinned greatly in that which I have done: but now, O Jehovah, put away, I beseech thee, the iniquity of thy servant; for I have done very foolishly.";

kjv[13] = "So Gad came to David, and told him, and said unto him, Shall seven years of famine come unto thee in thy land? or wilt thou flee three months before thine enemies, while they pursue thee? or that there be three days\' pestilence in thy land? now advise, and see what answer I shall return to him that sent me.";

asv[13] = "So Gad came to David, and told him, and said unto him, Shall seven years of famine come unto thee in thy land? or wilt thou flee three months before thy foes while they pursue thee? or shall there be three days\' pestilence in thy land? now advise thee, and consider what answer I shall return to him that sent me.";
yng[13] = "And Gad cometh in unto David, and declareth to him, and saith to him, `Do seven years of famine come in to thee in thy land? or three months art thou fleeing before thine adversary -- and he pursuing thee? or are three days\' pestilence in thy land? now, know and see what word I take back to Him sending me.\'";

kjv[16] = "And when the angel stretched out his hand upon Jerusalem to destroy it, the LORD repented him of the evil, and said to the angel that destroyed the people, It is enough: stay now thine hand. And the angel of the LORD was by the threshingplace of Araunah the Jebusite.";
rsv[16] = "And when the angel stretched forth his hand toward Jerusalem to destroy it, the LORD repented of the evil, and said to the angel who was working destruction among the people, &quot;It is enough; now stay your hand.&quot; And the angel of the LORD was by the threshing floor of Arau\'nah the Jeb\'usite.";
asv[16] = "And when the angel stretched out his hand toward Jerusalem to destroy it, Jehovah repented him of the evil, and said to the angel that destroyed the people, It is enough; now stay thy hand. And the angel of Jehovah was by the threshing-floor of Araunah the Jebusite.";
yng[16] = "and the messenger putteth forth his hand to Jerusalem to destroy it, and Jehovah repenteth concerning the evil, and saith to the messenger who is destroying among the people, `Enough, now, cease thy hand;\' and the messenger of Jehovah was near the threshing-floor of Araunah the Jebusite.";
dby[16] = "And the angel stretched out his hand upon Jerusalem to destroy it; but Jehovah repented him of the evil, and said to the angel that destroyed among the people, It is enough: withdraw now thine hand. And the angel of Jehovah was by the threshing-floor of Araunah the Jebusite.";
web[16] = "And when the angel stretched out his hand upon Jerusalem to destroy it, the LORD repented of the evil, and said to the angel that destroyed the people, It is enough: stay now thy hand. And the angel of the LORD was by the threshing-place of Araunah the Jebusite.";
hnv[16] = "When the angel stretched out his hand toward Yerushalayim to destroy it, the LORD repented him of the evil, and said to the angel who destroyed the people, It is enough; now stay your hand. The angel of the LORD was by the threshing floor of Aravna the Yevusi.";
vul[16] = "cumque extendisset manum angelus Dei super Hierusalem ut disperderet eam misertus est Dominus super adflictione et ait angelo percutienti populum sufficit nunc contine manum tuam erat autem angelus Domini iuxta aream Areuna Iebusei";
kjv[17] = "And David spake unto the LORD when he saw the angel that smote the people, and said, Lo, I have sinned, and I have done wickedly: but these sheep, what have they done? let thine hand, I pray thee, be against me, and against my father\'s house.";
rsv[17] = "Then David spoke to the LORD when he saw the angel who was smiting the people, and said, &quot;Lo, I have sinned, and I have done wickedly; but these sheep, what have they done? Let thy hand, I pray thee, be against me and against my father\'s house.&quot;";
asv[17] = "And David spake unto Jehovah when he saw the angel that smote the people, and said, Lo, I have sinned, and I have done perversely; but these sheep, what have they done? let thy hand, I pray thee, be against me, and against my father\'s house.";
yng[17] = "And David speaketh unto Jehovah, when he seeth the messenger who is smiting among the people, and saith, `Lo, I have sinned, yea, I have done perversely; and these -- the flock -- what have they done? Let, I pray Thee, Thy hand be on me, and on the house of my father.\'";
dby[17] = "And David spoke to Jehovah when he saw the angel that smote among the people, and said, Behold, it is I that have sinned, and it is I that have committed iniquity; but these sheep, what have they done? let thy hand, I pray thee, be on me, and on my father\'s house!";
web[17] = "And David spoke to the LORD when he saw the angel that smote the people, and said, Lo, I have sinned, and I have done wickedly: but these sheep, what have they done? let thy hand, I pray thee, be against me, and against my father\'s house.";
hnv[17] = "David spoke to the LORD when he saw the angel who struck the people, and said, Behold, I have sinned, and I have done perversely; but these sheep, what have they done? Please let your hand be against me, and against my father\'s house.";
vul[17] = "dixitque David ad Dominum cum vidisset angelum caedentem populum ego sum qui peccavi ego inique egi isti qui oves sunt quid fecerunt vertatur obsecro manus tua contra me et contra domum patris mei";
kjv[18] = "And Gad came that day to David, and said unto him, Go up, rear an altar unto the LORD in the threshingfloor of Araunah the Jebusite.";
rsv[18] = "And Gad came that day to David, and said to him, &quot;Go up, rear an altar to the LORD on the threshing floor of Arau\'nah the Jeb\'usite.&quot;";
asv[18] = "And Gad came that day to David, and said unto him, Go up, rear an altar unto Jehovah in the threshing-floor of Araunah the Jebusite.";
yng[18] = "And Gad cometh in unto David on that day, and saith to him, `Go up, raise to Jehovah an altar in the threshing-floor of Araunah the Jebusite;\'";
dby[18] = "And Gad came that day to David, and said to him, Go up, rear an altar to Jehovah in the threshing-floor of Araunah the Jebusite.";
web[18] = "And Gad came that day to David, and said to him, Go up, rear an altar to the LORD in the threshing-floor of Araunah the Jebusite.";
hnv[18] = "Gad came that day to David, and said to him, Go up, rear an altar to the LORD in the threshing floor of Aravna the Yevusi.";
vul[18] = "venit autem Gad ad David in die illa et dixit ei ascende constitue Domino altare in area Areuna Iebusei";
kjv[19] = "And David, according to the saying of Gad, went up as the LORD commanded.";
rsv[19] = "So David went up at Gad\'s word, as the LORD commanded.";
asv[19] = "And David went up according to the saying of Gad, as Jehovah commanded.";
yng[19] = "and David goeth up, according to the word of Gad, as Jehovah commanded.";
dby[19] = "And David, according to the saying of Gad, went up as Jehovah had commanded.";
web[19] = "And David, according to the saying of Gad, went up as the LORD commanded.";
hnv[19] = "David went up according to the saying of Gad, as the LORD commanded.";
vul[19] = "et ascendit David iuxta sermonem Gad quem praeceperat ei Dominus";
kjv[20] = "And Araunah looked, and saw the king and his servants coming on toward him: and Araunah went out, and bowed himself before the king on his face upon the ground.";
rsv[20] = "And when Arau\'nah looked down, he saw the king and his servants coming on toward him; and Arau\'nah went forth, and did obeisance to the king with his face to the ground.";
asv[20] = "And Araunah looked forth, and saw the king and his servants coming on toward him: and Araunah went out, and bowed himself before the king with his face to the ground.";
yng[20] = "And Araunah looketh, and seeth the king and his servants passing over unto him, and Araunah goeth out and boweth himself to the king -- his face to the earth.";
dby[20] = "And Araunah looked, and saw the king and his servants coming on towards him; and Araunah went out, and bowed himself before the king with his face to the ground.";
web[20] = "And Araunah looked, and saw the king and his servants coming towards him: And Araunah went out, and bowed himself before the king on his face upon the ground.";
hnv[20] = "Aravna looked forth, and saw the king and his servants coming on toward him: and Aravna went out, and bowed himself before the king with his face to the ground.";
vul[20] = "conspiciensque Areuna animadvertit regem et servos eius transire ad se";
kjv[21] = "And Araunah said, Wherefore is my lord the king come to his servant? And David said, To buy the threshingfloor of thee, to build an altar unto the LORD, that the plague may be stayed from the people.";
rsv[21] = "And Arau\'nah said, &quot;Why has my lord the king come to his servant?&quot; David said, &quot;To buy the threshing floor of you, in order to build an altar to the LORD, that the plague may be averted from the people.&quot;";
asv[21] = "And Araunah said, Wherefore is my lord the king come to his servant? And David said, To buy the threshing-floor of thee, to build an altar unto Jehovah, that the plague may be stayed from the people.";
yng[21] = "And Araunah saith, `Wherefore hath my lord the king come unto his servant?\' and David saith, `To buy from thee the threshing-floor, to build an altar to Jehovah, and the plague is restrained from the people.\'";
dby[21] = "And Araunah said, Why is my lord the king come to his servant? And David said, To buy the threshing-floor of thee, to build an altar to Jehovah, that the plague may be stayed from the people.";
web[21] = "And Araunah said, Why is my lord the king come to his servant? And David said, To buy the threshing-floor of thee, to build an altar to the LORD, that the plague may be stayed from the people.";
hnv[21] = "Aravna said, Why is my lord the king come to his servant? David said, To buy the threshing floor of you, to build an altar to the LORD, that the plague may be stayed from the people.";
vul[21] = "et egressus adoravit regem prono vultu in terra et ait quid causae est ut veniat dominus meus rex ad servum suum cui David ait ut emam a te aream et aedificem altare Domino et cesset interfectio quae grassatur in populo";
kjv[22] = "And Araunah said unto David, Let my lord the king take and offer up what [seemeth] good unto him: behold, [here be] oxen for burnt sacrifice, and threshing instruments and [other] instruments of the oxen for wood.";
rsv[22] = "Then Arau\'nah said to David, &quot;Let my lord the king take and offer up what seems good to him; here are the oxen for the burnt offering, and the threshing sledges and the yokes of the oxen for the wood.";
asv[22] = "And Araunah said unto David, Let my lord the king take and offer up what seemeth good unto him: behold, the oxen for the burnt-offering, and the threshing instruments and the yokes of the oxen for the wood:";
yng[22] = "And Araunah saith unto David, `Let my lord the king take and cause to ascend that which is good in his eyes; see, the oxen for a burnt-offering, and the threshing instruments, and the instruments of the oxen, for wood;\'";
dby[22] = "And Araunah said to David, Let my lord the king take and offer up that which is good in his sight: see, [here are] oxen for the burnt-offering, and the threshing-sledges and implements of the oxen for wood.";
web[22] = "And Araunah said to David, Let my lord the king take and offer up what [seemeth] good to him: behold, [here are] oxen for burnt-sacrifice, and threshing-instruments and [other] instruments of the oxen for wood.";
hnv[22] = "Aravna said to David, Let my lord the king take and offer up what seems good to him: behold, the oxen for the burnt offering, and the threshing instruments and the yokes of the oxen for the wood:";
vul[22] = "et ait Areuna ad David accipiat et offerat dominus meus rex sicut ei placet habes boves in holocaustum et plaustrum et iuga boum in usum lignorum";
kjv[23] = "All these [things] did Araunah, [as] a king, give unto the king. And Araunah said unto the king, The LORD thy God accept thee.";
rsv[23] = "All this, O king, Arau\'nah gives to the king.&quot; And Arau\'nah said to the king, &quot;The LORD your God accept you.&quot;";
asv[23] = "all this, O king, doth Araunah give unto the king. And Araunah said unto the king, Jehovah thy God accept thee.";
yng[23] = "the whole hath Araunah given, [as] a king to a king; and Araunah saith unto the king, `Jehovah thy God doth accept thee.\'";
dby[23] = "All these things, O king, doth Araunah give to the king. And Araunah said to the king, Jehovah thy God accept thee.";
web[23] = "All these [things] did Araunah, [as] a king, give to the king. And Araunah said to the king, The LORD thy God accept thee.";
hnv[23] = "all this, king, does Aravna give to the king. Aravna said to the king, the LORD your God accept you.";
vul[23] = "omnia dedit Areuna rex regi dixitque Areuna ad regem Dominus Deus tuus suscipiat votum tuum";
kjv[24] = "And the king said unto Araunah, Nay; but I will surely buy [it] of thee at a price: neither will I offer burnt offerings unto the LORD my God of that which doth cost me nothing. So David bought the threshingfloor and the oxen for fifty shekels of silver.";
rsv[24] = "But the king said to Arau\'nah, &quot;No, but I will buy it of you for a price; I will not offer burnt offerings to the LORD my God which cost me nothing.&quot; So David bought the threshing floor and the oxen for fifty shekels of silver.";
asv[24] = "And the king said unto Araunah, Nay; but I will verily buy it of thee at a price. Neither will I offer burnt-offerings unto Jehovah my God which cost me nothing. So David bought the threshing-floor and the oxen for fifty shekels of silver.";
yng[24] = "And the king saith unto Araunah, `Nay, for I do surely buy from thee for a price, and I do not cause to ascend to Jehovah my God burnt-offerings for nought;\' and David buyeth the threshing-floor and the oxen for fifty shekels of silver,";
dby[24] = "And the king said to Araunah, No; but I will in any case buy [them] of thee at a price: neither will I offer up to Jehovah my God burnt-offerings without cost. And David bought the threshing-floor and the oxen for fifty shekels of silver.";
web[24] = "And the king said to Araunah, No; but I will surely buy [it] of thee at a price: neither will I offer burnt-offerings to the LORD my God of that which doth cost me nothing. So David bought the threshing-floor and the oxen for fifty shekels of silver.";
hnv[24] = "The king said to Aravna, No; but I will most assuredly buy it of you at a price. Neither will I offer burnt-offerings to the LORD my God which cost me nothing. So David bought the threshing floor and the oxen for fifty shekels of silver.";
vul[24] = "cui respondens rex ait nequaquam ut vis sed emam pretio a te et non offeram Domino Deo meo holocausta gratuita emit ergo David aream et boves argenti siclis quinquaginta";
kjv[25] = "And David built there an altar unto the LORD, and offered burnt offerings and peace offerings. So the LORD was intreated for the land, and the plague was stayed from Israel.";
rsv[25] = "And David built there an altar to the LORD, and offered burnt offerings and peace offerings. So the LORD heeded supplications for the land, and the plague was averted from Israel.";
asv[25] = "And David built there an altar unto Jehovah, and offered burnt-offerings and peace-offerings. So Jehovah was entreated for the land, and the plague was stayed from Israel.";
yng[25] = "and David buildeth there an altar to Jehovah, and causeth to ascend burnt-offerings and peace-offerings, and Jehovah is entreated for the land, and the plague is restrained from Israel.";
dby[25] = "And David built there an altar to Jehovah, and offered up burnt-offerings and peace-offerings. And Jehovah was propitious to the land, and the plague was stayed from Israel.";
web[25] = "And David built there an altar to the LORD, and offered burnt-offerings and peace-offerings. So the LORD was entreated for the land, and the plague was stayed from Israel.";
hnv[25] = "David built there an altar to the LORD, and offered burnt offerings and peace-offerings. So the LORD was entreated for the land, and the plague was stayed from Yisra\'el.";
vul[25] = "et aedificavit ibi David altare Domino et obtulit holocausta et pacifica et repropitiatus est Dominus terrae et cohibita est plaga ab Israhel";
