csb[1] = "When Saul\'s son Ish-bosheth heard that Abner had died in Hebron, he gave up, and all Israel was dismayed.";
csb[2] = "Saul\'s son had two men who were leaders of raiding parties: one named Baanah and the other Rechab, sons of Rimmon the Beerothite of the Benjaminites. Beeroth is also considered part of Benjamin,";
csb[3] = "and the Beerothites fled to Gittaim and still reside there as aliens today.";
csb[4] = "Saul\'s son Jonathan had a son whose feet were crippled. He was five years old when the report about Saul and Jonathan came from Jezreel. His nanny picked him up and fled, but as she was hurrying to flee, he fell and became lame. His name was Mephibosheth.";
csb[5] = "Rechab and Baanah, the sons of Rimmon the Beerothite, set out and arrived at Ish-bosheth\'s house during the heat of the day while the king was taking his midday nap.";
csb[6] = "They entered the interior of the house as if to get wheat and stabbed him in the stomach. Then Rechab and his brother Baanah escaped.";
csb[7] = "They had entered the house while Ish-bosheth was lying on his bed in his bedroom and stabbed and killed him. They removed his head, took it, and traveled by way of the Arabah all night.";
csb[8] = "They brought Ish-bosheth\'s head to David at Hebron and said to the king, &quot;Here\'s the head of Ish-bosheth son of Saul, your enemy who intended to take your life. Today the LORD has granted vengeance to my lord the king against Saul and his offspring.&quot;";
csb[9] = "But David answered Rechab and his brother Baanah, sons of Rimmon the Beerothite, &quot;As the LORD lives, the one who has redeemed my life from every distress,";
csb[10] = "&quot;when the person told me, \'Look, Saul is dead,\' he thought he was a bearer of good news, but I seized him and put him to death at Ziklag. That was my reward to him for his news!";
csb[11] = "&quot;How much more when wicked men kill a righteous man in his own house on his own bed! So now, should I not require his blood from you and purge you from the earth? &quot;";
csb[12] = "So David gave orders to the young men, and they killed Rechab and Baanah. They cut off their hands and feet and hung their bodies by the pool in Hebron, but they took Ish-bosheth\'s head and buried it in Abner\'s tomb in Hebron.";
kjv[1] = "And when Saul\'s son heard that Abner was dead in Hebron, his hands were feeble, and all the Israelites were troubled.";
rsv[1] = "When Ish-bo\'sheth, Saul\'s son, heard that Abner had died at Hebron, his courage failed, and all Israel was dismayed.";
asv[1] = "And when [Ish-bosheth], Saul\'s son, heard that Abner was dead in Hebron, his hands became feeble, and all the Israelites were troubled.";
yng[1] = "And the son of Saul heareth that Abner [is] dead in Hebron, and his hands are feeble, and all Israel have been troubled.";
dby[1] = "And when Saul\'s son heard that Abner was dead in Hebron, his hands were enfeebled, and all Israel was troubled.";
web[1] = "And when Saul\'s son heard that Abner was dead in Hebron, his hands were feeble, and all the Israelites were troubled.";
hnv[1] = "When [Ish-Boshet], Sha\'ul\'s son, heard that Aviner was dead in Hevron, his hands became feeble, and all the Yisra\'elites were troubled.";
vul[1] = "audivit autem filius Saul quod cecidisset Abner in Hebron et dissolutae sunt manus eius omnisque Israhel perturbatus est";
kjv[2] = "And Saul\'s son had two men [that were] captains of bands: the name of the one [was] Baanah, and the name of the other Rechab, the sons of Rimmon a Beerothite, of the children of Benjamin: (for Beeroth also was reckoned to Benjamin:";
rsv[2] = "Now Saul\'s son had two men who were captains of raiding bands; the name of the one was Ba\'anah, and the name of the other Rechab, sons of Rimmon a man of Benjamin from Be-er\'oth (for Be-er\'oth also is reckoned to Benjamin;";
asv[2] = "And [Ish-bosheth], Saul\'s son, [had] two men that were captains of bands: the name of the one was Baanah, and the name of the other Rechab, the sons of Rimmon the Beerothite, of the children of Benjamin (for Beeroth also is reckoned to Benjamin:";
yng[2] = "And two men, heads of troops, have been [to] the son of Saul, the name of the one [is] Baanah, and the name of the second Rechab, sons of Rimmon the Beerothite, of the sons of Benjamin, for also Beeroth is reckoned to Benjamin,";
dby[2] = "And Saul\'s son had two men, captains of bands: the name of the one was Baanah, and the name of the other Rechab, the sons of Rimmon the Beerothite, of the children of Benjamin; for Beeroth also was reckoned to Benjamin.";
web[2] = "And Saul\'s son had two men [that were] captains of bands: the name of the one [was] Baanah, and the name of the other Rechab, the sons of Rimmon a Beerothite, of the children of Benjamin: (For Beeroth also was reckoned to Benjamin:";
hnv[2] = "[Ish-Boshet], Sha\'ul\'s son, [had] two men who were captains of bands: the name of the one was Ba`anah, and the name of the other Rechav, the sons of Rimmon the Be\'erotite, of the children of Binyamin (for Be\'erot also is reckoned to Binyamin:";
vul[2] = "duo autem viri principes latronum erant filio Saul nomen uni Baana et nomen alteri Rechab filii Remmon Berothitae de filiis Beniamin siquidem et Beroth reputata est in Beniamin";
kjv[3] = "And the Beerothites fled to Gittaim, and were sojourners there until this day.)";
rsv[3] = "the Be-er\'othites fled to Gitta\'im, and have been sojourners there to this day).";
asv[3] = "and the Beerothites fled to Gittaim, and have been sojourners there until this day).";
yng[3] = "and the Beerothites flee to Gittaim, and are there sojourners unto this day.";
dby[3] = "And the Beerothites had fled to Gittaim, and were sojourners there until this day.";
web[3] = "And the Beerothites fled to Gittaim, and have been sojourners there until this day.)";
hnv[3] = "and the Be\'erotites fled to Gittayim, and have lived as foreigners there until this day).";
vul[3] = "et fugerunt Berothitae in Getthaim fueruntque ibi advenae usque in tempus illud";
kjv[4] = "And Jonathan, Saul\'s son, had a son [that was] lame of [his] feet. He was five years old when the tidings came of Saul and Jonathan out of Jezreel, and his nurse took him up, and fled: and it came to pass, as she made haste to flee, that he fell, and became lame. And his name [was] Mephibosheth.";
rsv[4] = "Jonathan, the son of Saul, had a son who was crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel; and his nurse took him up, and fled; and, as she fled in her haste, he fell, and became lame. And his name was Mephib\'osheth.";
asv[4] = "Now Jonathan, Saul\'s son, had a son that was lame of his feet. He was five years old when the tidings came of Saul and Jonathan out of Jezreel; and his nurse took him up, and fled: and it came to pass, as she made haste to flee, that he fell, and became lame. And his name was Mephibosheth.";
yng[4] = "And to Jonathan son of Saul [is] a son -- lame; he was a son of five years at the coming in of the rumour of [the death of] Saul and Jonathan, out of Jezreel, and his nurse lifteth him up, and fleeth, and it cometh to pass in her hasting to flee, that he falleth, and becometh lame, and his name [is] Mephibosheth.";
dby[4] = "And Jonathan Saul\'s son had a son that was lame of [his] feet. He was five years old when the news came of Saul and Jonathan out of Jizreel; and his nurse took him up and fled. And it came to pass, as she made haste to flee, that he fell, and became lame. And his name was Mephibosheth.";
web[4] = "And Jonathan, Saul\'s son, had a son [that was] lame of [his] feet: he was five years old when the tidings came of Saul and Jonathan out of Jezreel, and his nurse took him up, and fled: and it came to pass, as she made haste to flee, that he fell, and became lame. And his name [was] Mephibosheth.";
hnv[4] = "Now Yonatan, Sha\'ul\'s son, had a son who was lame of his feet. He was five years old when the news came of Sha\'ul and Yonatan out of Yizre`el; and his nurse took him up, and fled: and it happened, as she made haste to flee, that he fell, and became lame. His name was Mefivoshet.";
vul[4] = "erat autem Ionathan filio Saul filius debilis pedibus quinquennis enim fuit quando venit nuntius de Saul et Ionathan ex Iezrahel tollens itaque eum nutrix sua fugit cumque festinaret ut fugeret cecidit et claudus effectus est habuitque vocabulum Mifiboseth";
kjv[5] = "And the sons of Rimmon the Beerothite, Rechab and Baanah, went, and came about the heat of the day to the house of Ishbosheth, who lay on a bed at noon.";
rsv[5] = "Now the sons of Rimmon the Be-er\'othite, Rechab and Ba\'anah, set out, and about the heat of the day they came to the house of Ish-bo\'sheth, as he was taking his noonday rest.";
asv[5] = "And the sons of Rimmon the Beerothite, Rechab and Baanah, went, and came about the heat of the day to the house of Ish-bosheth, as he took his rest at noon.";
yng[5] = "And the sons of Rimmon the Beerothite, Rechab and Baanah, go, and come in at the heat of the day unto the house of Ish-Bosheth, and he is lying down -- the lying down of noon;";
dby[5] = "And the sons of Rimmon the Beerothite, Rechab and Baanah, went and came in about the heat of the day into the house of Ishbosheth, who was taking his noonday rest.";
web[5] = "And the sons of Rimmon the Beerothite, Rechab and Baanah, went, and came about the heat of the day to the house of Ish-bosheth, who lay on a bed at noon.";
hnv[5] = "The sons of Rimmon the Be\'erotite, Rechav and Ba`anah, went, and came about the heat of the day to the house of Ish-Boshet, as he took his rest at noon.";
vul[5] = "venientes igitur filii Remmon Berothitae Rechab et Baana ingressi sunt fervente die domum Hisboseth qui dormiebat super stratum suum meridie";
kjv[6] = "And they came thither into the midst of the house, [as though] they would have fetched wheat; and they smote him under the fifth [rib]: and Rechab and Baanah his brother escaped.";
rsv[6] = "And behold, the doorkeeper of the house had been cleaning wheat, but she grew drowsy and slept; so Rechab and Ba\'anah his brother slipped in.";
asv[6] = "And they came thither into the midst of the house, as though they would have fetched wheat; and they smote him in the body: and Rechab and Baanah his brother escaped.";
yng[6] = "and thither they have come, unto the midst of the house, taking wheat, and they smite him unto the fifth [rib], and Rechab and Baanah his brother have escaped;";
dby[6] = "And they came thither into the midst of the house, [as though] they would fetch wheat; and they smote him in the belly; and Rechab and Baanah his brother escaped.";
web[6] = "And they came thither into the midst of the house, [as though] they would have fetched wheat; and they smote him under the fifth [rib]: and Rechab and Baanah his brother escaped.";
hnv[6] = "They came there into the midst of the house, as though they would have fetched wheat; and they struck him in the body: and Rechav and Ba`anah his brother escaped.";
vul[6] = "ingressi sunt autem domum adsumentes spicas tritici et percusserunt eum in inguine Rechab et Baana frater eius et fugerunt";
kjv[7] = "For when they came into the house, he lay on his bed in his bedchamber, and they smote him, and slew him, and beheaded him, and took his head, and gat them away through the plain all night.";
rsv[7] = "When they came into the house, as he lay on his bed in his bedchamber, they smote him, and slew him, and beheaded him. They took his head, and went by the way of the Arabah all night,";
asv[7] = "Now when they came into the house, as he lay on his bed in his bedchamber, they smote him, and slew him, and beheaded him, and took his head, and went by the way of the Arabah all night.";
yng[7] = "yea, they come in to the house, and he is lying on his bed, in the inner part of his bed-chamber, and they smite him, and put him to death, and turn aside his head, and they take his head, and go the way of the plain all the night,";
dby[7] = "They came into the house, as he lay on his bed in his bedchamber, and they smote him, and slew him, and beheaded him; and they took his head, and went by the way of the plain all night.";
web[7] = "For when they came into the house, he lay on his bed in his bed-chamber, and they smote him, and slew him, and beheaded him, and took his head, and went away through the plain all night.";
hnv[7] = "Now when they came into the house, as he lay on his bed in his bedchamber, they struck him, and killed him, and beheaded him, and took his head, and went by the way of the `Aravah all night.";
vul[7] = "cum autem ingressi fuissent domum ille dormiebat super lectulum suum in conclavi et percutientes interfecerunt eum sublatoque capite eius abierunt per viam deserti tota nocte";
kjv[8] = "And they brought the head of Ishbosheth unto David to Hebron, and said to the king, Behold the head of Ishbosheth the son of Saul thine enemy, which sought thy life; and the LORD hath avenged my lord the king this day of Saul, and of his seed.";
rsv[8] = "and brought the head of Ish-bo\'sheth to David at Hebron. And they said to the king, &quot;Here is the head of Ish-bo\'sheth, the son of Saul, your enemy, who sought your life; the LORD has avenged my lord the king this day on Saul and on his offspring.&quot;";
asv[8] = "And they brought the head of Ish-bosheth unto David to Hebron, and said to the king, Behold, the head of Ish-bosheth, the son of Saul, thine enemy, who sought thy life; and Jehovah hath avenged my lord the king this day of Saul, and of his seed.";
yng[8] = "and bring in the head of Ish-Bosheth unto David in Hebron, and say unto the king, `Lo, the head of Ish-Bosheth, son of Saul, thine enemy, who sought thy life; and Jehovah doth give to my lord the king vengeance this day, of Saul and of his seed.\'";
dby[8] = "And they brought the head of Ishbosheth to David in Hebron, and said to the king, Behold the head of Ishbosheth the son of Saul, thine enemy who sought thy life; and Jehovah has given to my lord the king to be avenged this day of Saul and of his seed.";
web[8] = "And they brought the head of Ish-bosheth to David to Hebron, and said to the king, Behold the head of Ish-bosheth the son of Saul thy enemy, who sought thy life; and the LORD hath avenged my lord the king this day of Saul and of his seed.";
hnv[8] = "They brought the head of Ish-Boshet to David to Hevron, and said to the king, Behold, the head of Ish-Boshet, the son of Sha\'ul, your enemy, who sought your life; and the LORD has avenged my lord the king this day of Sha\'ul, and of his seed.";
vul[8] = "et adtulerunt caput Hisboseth ad David in Hebron dixeruntque ad regem ecce caput Hisboseth filii Saul inimici tui qui quaerebat animam tuam et dedit Dominus domino meo regi ultiones hodie de Saul et de semine eius";
kjv[9] = "And David answered Rechab and Baanah his brother, the sons of Rimmon the Beerothite, and said unto them, [As] the LORD liveth, who hath redeemed my soul out of all adversity,";
rsv[9] = "But David answered Rechab and Ba\'anah his brother, the sons of Rimmon the Be-er\'othite, &quot;As the LORD lives, who has redeemed my life out of every adversity,";
asv[9] = "And David answered Rechab and Baanah his brother, the sons of Rimmon the Beerothite, and said unto them, As Jehovah liveth, who hath redeemed my soul out of all adversity,";
yng[9] = "And David answereth Rechab and Baanah his brother, sons of Rimmon the Beerothite, and saith to them, `Jehovah liveth, who hath redeemed my soul out of all adversity,";
dby[9] = "Then David answered Rechab and Baanah his brother, the sons of Rimmon the Beerothite, and said to them, [As] Jehovah liveth, who has redeemed my soul out of all distress,";
web[9] = "And David answered Rechab and Baanah his brother, the sons of Rimmon the Beerothite, and said to them, [As] the LORD liveth, who hath redeemed my soul out of all adversity,";
hnv[9] = "David answered Rechav and Ba`anah his brother, the sons of Rimmon the Be\'erotite, and said to them, As the LORD lives, who has redeemed my soul out of all adversity,";
vul[9] = "respondens autem David Rechab et Baana fratri eius filiis Remmon Berothei dixit ad eos vivit Dominus qui eruit animam meam de omni angustia";
kjv[10] = "When one told me, saying, Behold, Saul is dead, thinking to have brought good tidings, I took hold of him, and slew him in Ziklag, who [thought] that I would have given him a reward for his tidings:";
rsv[10] = "when one told me, \'Behold, Saul is dead,\' and thought he was bringing good news, I seized him and slew him at Ziklag, which was the reward I gave him for his news.";
asv[10] = "when one told me, saying, Behold, Saul is dead, thinking to have brought good tidings, I took hold of him, and slew him in Ziklag, which was the reward I gave him for his tidings.";
yng[10] = "when one is declaring to me, saying, Lo, Saul is dead, and he was as a bearer of tidings in his own eyes, then I take hold on him, and slay him in Ziklag, instead of my giving to him [for] the tidings.";
dby[10] = "when one told me, saying, Behold, Saul is dead! and he was in his own sight a messenger of good, I took hold of him, and slew him in Ziklag -- to whom forsooth I should give a reward for his good tidings:";
web[10] = "When one told me, saying, Behold, Saul is dead, (thinking to have brought good tidings,) I took hold of him, and slew him in Ziklag, who [thought] that I would have given him a reward for his tidings:";
hnv[10] = " when one told me, saying, Behold, Sha\'ul is dead, thinking to have brought good news, I took hold of him, and killed him in Tziklag, which was the reward I gave him for his news.";
vul[10] = "quoniam eum qui adnuntiaverat mihi et dixerat mortuus est Saul qui putabat se prospera nuntiare tenui et occidi in Siceleg cui oportebat me dare mercedem pro nuntio";
kjv[11] = "How much more, when wicked men have slain a righteous person in his own house upon his bed? shall I not therefore now require his blood of your hand, and take you away from the earth?";
rsv[11] = "How much more, when wicked men have slain a righteous man in his own house upon his bed, shall I not now require his blood at your hand, and destroy you from the earth?&quot;";
asv[11] = "How much more, when wicked men have slain a righteous person in his own house upon his bed, shall I not now require his blood of your hand, and take you away from the earth?";
yng[11] = "Also -- when wicked men have slain the righteous man in his own house, on his bed; and now, do not I require his blood of your hand, and have taken you away from the earth?\'";
dby[11] = "how much more, when wicked men have slain a righteous person in his own house upon his bed? and should I not now demand his blood of your hand, and take you away from the earth?";
web[11] = "How much more, when wicked men have slain a righteous person in his own house upon his bed? shall I not therefore now require his blood of your hand, and take you away from the earth?";
hnv[11] = "How much more, when wicked men have slain a righteous person in his own house on his bed, shall I not now require his blood of your hand, and take you away from the eretz?";
vul[11] = "quanto magis nunc cum homines impii interfecerint virum innoxium in domo sua super lectulum suum non quaeram sanguinem eius de manu vestra et auferam vos de terra";
kjv[12] = "And David commanded his young men, and they slew them, and cut off their hands and their feet, and hanged [them] up over the pool in Hebron. But they took the head of Ishbosheth, and buried [it] in the sepulchre of Abner in Hebron.";
rsv[12] = "And David commanded his young men, and they killed them, and cut off their hands and feet, and hanged them beside the pool at Hebron. But they took the head of Ish-bo\'sheth, and buried it in the tomb of Abner at Hebron.";
asv[12] = "And David commanded his young men, and they slew them, and cut off their hands and their feet, and hanged them up beside the pool in Hebron. But they took the head of Ish-bosheth, and buried it in the grave of Abner in Hebron.";
yng[12] = "And David commandeth the young men, and they slay them, and cut off their hands and their feet, and hang [them] over the pool in Hebron, and the head of Ish-Bosheth they have taken, and bury [it] in the burying-place of Abner in Hebron.";
dby[12] = "And David commanded his young men, and they slew them, and cut off their hands and their feet, and hanged [them] up over the pool in Hebron. But they took the head of Ishbosheth, and buried it in the sepulchre of Abner in Hebron.";
web[12] = "And David commanded his young men, and they slew them, and cut off their hands and their feet, and hanged [them] over the pool in Hebron. But they took the head of Ish-bosheth, and buried [it] in the sepulcher of Abner in Hebron.";
hnv[12] = "David commanded his young men, and they killed them, and cut off their hands and their feet, and hanged them up beside the pool in Hevron. But they took the head of Ish-Boshet, and buried it in the grave of Aviner in Hevron.";
vul[12] = "praecepit itaque David pueris et interfecerunt eos praecidentesque manus et pedes eorum suspenderunt eos super piscinam in Hebron caput autem Hisboseth tulerunt et sepelierunt in sepulchro Abner in Hebron";
</script>
