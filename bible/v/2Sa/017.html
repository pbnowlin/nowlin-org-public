csb[1] = "Ahithophel said to Absalom, &quot;Let me choose twelve thousand men, and I will set out in pursuit of David tonight.";
csb[2] = "&quot;I will attack him while he is weary and discouraged, throw him into a panic, and all the people with him will scatter. I will strike down only the king";
csb[3] = "&quot;and bring all the people back to you. When everyone returns except the man you\'re looking for, all the people will be at peace.&quot;";
csb[4] = "This proposal seemed right to Absalom and all the elders of Israel.";
csb[5] = "Then Absalom said, &quot;Summon Hushai the Archite also. Let\'s hear what he has to say as well.&quot;";
csb[6] = "So Hushai came to Absalom, and Absalom told him: &quot;Ahithophel offered this proposal. Should we carry out his proposal? If not, what do you say? &quot;";
csb[7] = "Hushai replied to Absalom, &quot;The advice Ahithophel has given this time is not good.&quot;";
csb[8] = "Hushai continued, &quot;You know your father and his men. They are warriors and are desperate like a wild bear robbed of her cubs. Your father is an experienced soldier who won\'t spend the night with the people.";
csb[9] = "&quot;He\'s probably already hiding in one of the caves or some other place. If some of our troops fall first, someone is sure to hear and say, \'There\'s been a slaughter among the people who follow Absalom.\'";
csb[10] = "&quot;Then, even a brave man with the heart of a lion will lose heart because all Israel knows that your father and the valiant men with him are warriors.";
csb[11] = "&quot;Instead, I advise that all Israel from Dan to Beer-sheba -- as numerous as the sand by the sea -- be gathered to you and that you personally go into battle.";
csb[12] = "&quot;Then we will attack David wherever we find him, and we will descend on him like dew on the ground. Not even one will be left--neither he nor any of the men with him.";
csb[13] = "&quot;If he retreats to some city, all Israel will bring ropes to that city, and we will drag its stones into the valley until not even a pebble can be found there.&quot;";
csb[14] = "Since the LORD had decreed that Ahithophel\'s good advice be undermined in order to bring about Absalom\'s ruin, Absalom and all the men of Israel said, &quot;The advice of Hushai the Archite is better than Ahithophel\'s advice.&quot;";
csb[15] = "Hushai then told the priests Zadok and Abiathar, &quot;This is what Ahithophel advised Absalom and the elders of Israel, and this is what I advised.";
csb[16] = "&quot;Now send someone quickly and tell David, \'Don\'t spend the night at the wilderness ford, but be sure to cross over the Jordan, or the king and all the people with him will be devoured.\' &quot;";
csb[17] = "Jonathan and Ahimaaz were staying at En-rogel, where a servant girl would come and pass along information to them. They in turn would go and inform King David, because they dared not be seen entering the city.";
csb[18] = "However, a young man did see them and informed Absalom. So the two left quickly and came to the house of a man in Bahurim. He had a well in his courtyard, and they climbed down into it.";
csb[19] = "Then his wife took the cover, placed it over the mouth of the well, and scattered grain on it so nobody would know anything.";
csb[20] = "Absalom\'s servants came to the woman at the house and asked, &quot;Where are Ahimaaz and Jonathan? &quot; &quot;They passed by toward the water,&quot; the woman replied to them. The men searched but did not find them, so they returned to Jerusalem.";
csb[21] = "After they had gone, Ahimaaz and Jonathan climbed out of the well and went and informed King David. They told him, &quot;Get up and immediately ford the river, for Ahithophel has given this advice against you.&quot;";
csb[22] = "So David and all the people with him got up and crossed the Jordan. By daybreak, there was no one who had not crossed the Jordan.";
csb[23] = "When Ahithophel realized that his advice had not been followed, he saddled his donkey and set out for his house in his hometown. He set his house in order and hanged himself. So he died and was buried in his father\'s tomb.";
csb[24] = "David had arrived at Mahanaim by the time Absalom crossed the Jordan with all the men of Israel.";
csb[25] = "Now Absalom had appointed Amasa over the army in Joab\'s place. Amasa was the son of a man named Ithra the Israelite; Ithra had married Abigail daughter of Nahash. Abigail was a sister to Zeruiah, Joab\'s mother.";
csb[26] = "And Israel and Absalom camped in the land of Gilead.";
csb[27] = "When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim";
csb[28] = "brought beds, basins, and pottery items. They also brought wheat, barley, flour, roasted grain, beans, lentils,";
csb[29] = "honey, curds, sheep, goats, and cheese from the herd for David and the people with him to eat. They had reasoned, &quot;The people must be hungry, exhausted, and thirsty in the wilderness.&quot;";

kjv[8] = "For, said Hushai, thou knowest thy father and his men, that they [be] mighty men, and they [be] chafed in their minds, as a bear robbed of her whelps in the field: and thy father [is] a man of war, and will not lodge with the people.";
rsv[8] = "Hushai said moreover, &quot;You know that your father and his men are mighty men, and that they are enraged, like a bear robbed of her cubs in the field. Besides, your father is expert in war; he will not spend the night with the people.";
asv[8] = "Hushai said moreover, Thou knowest thy father and his men, that they are mighty men, and they are chafed in their minds, as a bear robbed of her whelps in the field; and thy father is a man of war, and will not lodge with the people.";
yng[8] = "And Hushai saith, `Thou hast known thy father and his men, that they [are] heroes, and they are bitter in soul as a bereaved bear in a field, and thy father [is] a man of war, and doth not lodge with the people;";
dby[8] = "And Hushai said, Thou knowest thy father and his men, that they are mighty men, and they are of exasperated spirit, as a bear robbed of her whelps in the field; and thy father is a man of war, and will not lodge with the people.";
web[8] = "For, said Hushai, thou knowest thy father and his men, that they [are] mighty men, and they [are] chafed in their minds, as a bear robbed of her whelps in the field: and thy father [is] a man of war, and will not lodge with the people.";
hnv[8] = "Hushai said moreover, You know your father and his men, that they are mighty men, and they are fierce in their minds, as a bear robbed of her cubs in the field; and your father is a man of war, and will not lodge with the people.";
vul[8] = "et rursum intulit Husai tu nosti patrem tuum et viros qui cum eo sunt esse fortissimos et amaro animo veluti si ursa raptis catulis in saltu saeviat sed et pater tuus vir bellator est nec morabitur cum populo";
kjv[9] = "Behold, he is hid now in some pit, or in some [other] place: and it will come to pass, when some of them be overthrown at the first, that whosoever heareth it will say, There is a slaughter among the people that follow Absalom.";

kjv[11] = "Therefore I counsel that all Israel be generally gathered unto thee, from Dan even to Beersheba, as the sand that [is] by the sea for multitude; and that thou go to battle in thine own person.";

dby[11] = "But I counsel that all Israel be speedily gathered to thee, from Dan even to Beer-sheba, as the sand that is by the sea for multitude; and that thou go to battle in thine own person.";

kjv[13] = "Moreover, if he be gotten into a city, then shall all Israel bring ropes to that city, and we will draw it into the river, until there be not one small stone found there.";
rsv[13] = "If he withdraws into a city, then all Israel will bring ropes to that city, and we shall drag it into the valley, until not even a pebble is to be found there.&quot;";
asv[13] = "Moreover, if he be gotten into a city, then shall all Israel bring ropes to that city, and we will draw it into the river, until there be not one small stone found there.";
yng[13] = "And if unto a city he is gathered, then they have caused all Israel to bear unto that city ropes, and we have drawn it unto the brook till that there hath not been found there even a stone.\'";
dby[13] = "And if he withdraw into a city, then shall all Israel bring ropes to that city, and we will draw it into the torrent, until there be not one small stone found there.";

kjv[14] = "And Absalom and all the men of Israel said, The counsel of Hushai the Archite [is] better than the counsel of Ahithophel. For the LORD had appointed to defeat the good counsel of Ahithophel, to the intent that the LORD might bring evil upon Absalom.";
rsv[14] = "And Ab\'salom and all the men of Israel said, &quot;The counsel of Hushai the Archite is better than the counsel of Ahith\'ophel.&quot; For the LORD had ordained to defeat the good counsel of Ahith\'ophel, so that the LORD might bring evil upon Ab\'salom.";
asv[14] = "And Absalom and all the men of Israel said, The counsel of Hushai the Archite is better than the counsel of Ahithophel. For Jehovah had ordained to defeat the good counsel of Ahithophel, to the intent that Jehovah might bring evil upon Absalom.";
yng[14] = "And Absalom saith -- and all the men of Israel -- `Better [is] the counsel of Hushai the Archite than the counsel of Ahithophel;\' and Jehovah willed to make void the good counsel of Ahithophel for the sake of Jehovah\'s bringing unto Absalom the evil.";
dby[14] = "And Absalom and all the men of Israel said, The counsel of Hushai the Archite is better than the counsel of Ahithophel. And Jehovah had appointed to defeat the good counsel of Ahithophel, in order that Jehovah might bring evil upon Absalom.";
web[14] = "And Absalom and all the men of Israel said, The counsel of Hushai the Archite [is] better than the counsel of Ahithophel. For the LORD had appointed to defeat the good counsel of Ahithophel, to the intent that the LORD might bring evil upon Absalom.";
hnv[14] = "Avshalom and all the men of Yisra\'el said, The counsel of Hushai the Arki is better than the counsel of Achitofel. For the LORD had ordained to defeat the good counsel of Achitofel, to the intent that the LORD might bring evil on Avshalom.";
vul[14] = "dixitque Absalom et omnis vir Israhel melius consilium Husai Arachitae consilio Ahitofel Domini autem nutu dissipatum est consilium Ahitofel utile ut induceret Dominus super Absalom malum";
kjv[15] = "Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled.";
rsv[15] = "Then Hushai said to Zadok and Abi\'athar the priests, &quot;Thus and so did Ahith\'ophel counsel Ab\'salom and the elders of Israel; and thus and so have I counseled.";
asv[15] = "Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled.";
yng[15] = "And Hushai saith unto Zadok and unto Abiathar the priests, `Thus and thus hath Ahithophel counselled Absalom and the elders of Israel, and thus and thus I have counselled;";
dby[15] = "And Hushai said to Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled.";
web[15] = "Then said Hushai to Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counseled.";
hnv[15] = "Then said Hushai to Tzadok and to Avyatar the Kohanim, Thus and thus did Achitofel counsel Avshalom and the Zakenim of Yisra\'el; and thus and thus have I counseled.";
vul[15] = "et ait Husai Sadoc et Abiathar sacerdotibus hoc et hoc modo consilium dedit Ahitofel Absalom et senibus Israhel et ego tale et tale dedi consilium";
kjv[16] = "Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that [are] with him.";
rsv[16] = "Now therefore send quickly and tell David, \'Do not lodge tonight at the fords of the wilderness, but by all means pass over; lest the king and all the people who are with him be swallowed up.\'&quot;";
asv[16] = "Now therefore send quickly, and tell David, saying, Lodge not this night at the fords of the wilderness, but by all means pass over; lest the king be swallowed up, and all the people that are with him.";
yng[16] = "and now, send hastily, and declare to David, saying, Lodge not to-night in the plains of the wilderness, and also, certainly pass over, lest there be a swallowing up of the king and of all the people who are with him.\'";
dby[16] = "And now send quickly, and tell David saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that are with him.";
web[16] = "Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that [are] with him.";
hnv[16] = "Now therefore send quickly, and tell David, saying, Don\'t lodge this night at the fords of the wilderness, but by all means pass over; lest the king be swallowed up, and all the people who are with him.";
vul[16] = "nunc ergo mittite cito et nuntiate David dicentes ne moremini nocte hac in campestribus deserti sed absque dilatione transgredere ne forte absorbeatur rex et omnis populus qui cum eo est";
kjv[17] = "Now Jonathan and Ahimaaz stayed by Enrogel; for they might not be seen to come into the city: and a wench went and told them; and they went and told king David.";
rsv[17] = "Now Jonathan and Ahim\'a-az were waiting at En-ro\'gel; a maidservant used to go and tell them, and they would go and tell King David; for they must not be seen entering the city.";
asv[17] = "Now Jonathan and Ahimaaz were staying by En-rogel; and a maid-servant used to go and tell them; and they went and told king David: for they might not be seen to come into the city.";
yng[17] = "And Jonathan and Ahimaaz are standing at En-Rogel, and the maid-servant hath gone and declared to them -- and they go and have declared [it] to king David -- for they are not able to be seen to go in to the city.";
dby[17] = "And Jonathan and Ahimaaz stayed by En-rogel; and the maid went and told them; and they went and told king David, for they might not be seen to come into the city.";
web[17] = "Now Jonathan and Ahimaaz stayed by En-rogel; for they might not be seen to come into the city: and a maid servant went and told them; and they went and told king David.";
hnv[17] = "Now Yonatan and Achima`atz were staying by `En-Rogel; and a maid-servant used to go and tell them; and they went and told king David: for they might not be seen to come into the city.";
vul[17] = "Ionathan autem et Achimaas stabant iuxta fontem Rogel abiit ancilla et nuntiavit eis et illi profecti sunt ut referrent ad regem David nuntium non enim poterant videri aut introire civitatem";
kjv[18] = "Nevertheless a lad saw them, and told Absalom: but they went both of them away quickly, and came to a man\'s house in Bahurim, which had a well in his court; whither they went down.";
rsv[18] = "But a lad saw them, and told Ab\'salom; so both of them went away quickly, and came to the house of a man at Bahu\'rim, who had a well in his courtyard; and they went down into it.";
asv[18] = "But a lad saw them, and told Absalom: and they went both of them away quickly, and came to the house of a man in Bahurim, who had a well in his court; and they went down thither.";
yng[18] = "And a youth seeth them, and declareth to Absalom; and they go on both of them hastily, and come in unto the house of a man in Bahurim, and he hath a well in his court, and they go down there,";
dby[18] = "But a lad saw them, and told Absalom. Then they went both of them away quickly, and came to the house of a man at Bahurim, who had a well in his court; and they went down there.";
web[18] = "Nevertheless, a lad saw them, and told Absalom: but they went both of them away quickly, and came to the house of a man in Bahurim, who had a well in his court; into which they descended.";
hnv[18] = "But a boy saw them, and told Avshalom: and they went both of them away quickly, and came to the house of a man in Bachurim, who had a well in his court; and they went down there.";
vul[18] = "vidit autem eos quidam puer et indicavit Absalom illi vero concito gradu ingressi sunt domum cuiusdam viri in Baurim qui habebat puteum in vestibulo suo et descenderunt in eum";
kjv[19] = "And the woman took and spread a covering over the well\'s mouth, and spread ground corn thereon; and the thing was not known.";
rsv[19] = "And the woman took and spread a covering over the well\'s mouth, and scattered grain upon it; and nothing was known of it.";
asv[19] = "And the woman took and spread the covering over the well\'s mouth, and strewed bruised grain thereon; and nothing was known.";
yng[19] = "and the woman taketh and spreadeth the covering over the face of the well, and spreadeth on it the ground corn, and the thing hath not been known.";
dby[19] = "And the woman took and spread the covering over the well\'s mouth, and spread ground corn on it; and the thing was not known.";
web[19] = "And the woman took and spread a covering over the well\'s mouth, and spread ground corn upon it; and the thing was not known.";
hnv[19] = "The woman took and spread the covering over the well\'s mouth, and strewed bruised grain thereon; and nothing was known.";
vul[19] = "tulit autem mulier et expandit velamen super os putei quasi siccans ptisanas et sic res latuit";
kjv[20] = "And when Absalom\'s servants came to the woman to the house, they said, Where [is] Ahimaaz and Jonathan? And the woman said unto them, They be gone over the brook of water. And when they had sought and could not find [them], they returned to Jerusalem.";
rsv[20] = "When Ab\'salom\'s servants came to the woman at the house, they said, &quot;Where are Ahim\'a-az and Jonathan?&quot; And the woman said to them, &quot;They have gone over the brook of water.&quot; And when they had sought and could not find them, they returned to Jerusalem.";
asv[20] = "And Absalom\'s servants came to the woman to the house; and they said, Where are Ahimaaz and Jonathan? And the woman said unto them, They are gone over the brook of water. And when they had sought and could not find them, they returned to Jerusalem.";
yng[20] = "And the servants of Absalom come in unto the woman to the house, and say, `Where [are] Ahimaaz and Jonathan?\' and the woman saith to them, `They passed over the brook of water;\' and they seek, and have not found, and turn back to Jerusalem.";
dby[20] = "And Absalom\'s servants came to the woman to the house, and said, Where are Ahimaaz and Jonathan? And the woman said to them, They have gone over the brook of water. And they sought and could not find [them], and returned to Jerusalem.";
web[20] = "And when Absalom\'s servants came to the woman to the house, they said, Where [is] Ahimaaz and Jonathan? And the woman said to them, they have gone over the brook of water. And when they had sought and could not find [them], they returned to Jerusalem.";
hnv[20] = "Avshalom\'s servants came to the woman to the house; and they said, Where are Achima`atz and Yonatan? The woman said to them, They have gone over the brook of water. When they had sought and could not find them, they returned to Yerushalayim.";
vul[20] = "cumque venissent servi Absalom ad mulierem in domum dixerunt ubi est Achimaas et Ionathan et respondit eis mulier transierunt gustata paululum aqua at hii qui quaerebant cum non repperissent reversi sunt Hierusalem";
kjv[21] = "And it came to pass, after they were departed, that they came up out of the well, and went and told king David, and said unto David, Arise, and pass quickly over the water: for thus hath Ahithophel counselled against you.";
rsv[21] = "After they had gone, the men came up out of the well, and went and told King David. They said to David, &quot;Arise, and go quickly over the water; for thus and so has Ahith\'ophel counseled against you.&quot;";
asv[21] = "And it came to pass, after they were departed, that they came up out of the well, and went and told king David; and they said unto David, Arise ye, and pass quickly over the water; for thus hath Ahithophel counselled against you.";
yng[21] = "And it cometh to pass, after their going on, that they come up out of the well, and go and declare to king David, and say unto David, `Rise ye, and pass over hastily the waters, for thus hath Ahithophel counselled against you.\'";
dby[21] = "And it came to pass after they had departed, that they came up out of the well, and went and told king David; and they said to David, Arise and pass quickly over the water; for thus has Ahithophel counselled against you.";
web[21] = "And it came to pass, after they had departed, that they came out of the well, and went and told king David, and said to David, Arise, and pass quickly over the water: for thus hath Ahithophel counseled against you.";
hnv[21] = "It happened, after they had departed, that they came up out of the well, and went and told king David; and they said to David, Arise you, and pass quickly over the water; for thus has Achitofel counseled against you.";
vul[21] = "cumque abissent ascenderunt illi de puteo et pergentes nuntiaverunt regi David atque dixerunt surgite transite cito fluvium quoniam huiuscemodi dedit consilium contra vos Ahitofel";
kjv[22] = "Then David arose, and all the people that [were] with him, and they passed over Jordan: by the morning light there lacked not one of them that was not gone over Jordan.";
rsv[22] = "Then David arose, and all the people who were with him, and they crossed the Jordan; by daybreak not one was left who had not crossed the Jordan.";
asv[22] = "Then David arose, and all the people that were with him, and they passed over the Jordan: by the morning light there lacked not one of them that was not gone over the Jordan.";
yng[22] = "And David riseth, and all the people who [are] with him, and they pass over the Jordan, till the light of the morning, till one hath not been lacking who hath not passed over the Jordan.";
dby[22] = "Then David arose, and all the people that were with him, and they passed over the Jordan; by the morning light there was not one of them missing that had not gone over the Jordan.";
web[22] = "Then David arose, and all the people that [were] with him, and they passed over Jordan: by the morning light there lacked not one of them that had not gone over Jordan.";
hnv[22] = "Then David arose, and all the people who were with him, and they passed over the Yarden: by the morning light there lacked not one of them who had not gone over the Yarden.";
vul[22] = "surrexit ergo David et omnis populus qui erat cum eo et transierunt Iordanem donec dilucesceret et ne unus quidem residuus fuit qui non transisset fluvium";
kjv[23] = "And when Ahithophel saw that his counsel was not followed, he saddled [his] ass, and arose, and gat him home to his house, to his city, and put his household in order, and hanged himself, and died, and was buried in the sepulchre of his father.";
rsv[23] = "When Ahith\'ophel saw that his counsel was not followed, he saddled his ass, and went off home to his own city. And he set his house in order, and hanged himself; and he died, and was buried in the tomb of his father.";
asv[23] = "And when Ahithophel saw that his counsel was not followed, he saddled his ass, and arose, and gat him home, unto his city, and set his house in order, and hanged himself; and he died, and was buried in the sepulchre of his father.";
yng[23] = "And Ahithophel hath seen that his counsel was not done, and he saddleth the ass, and riseth and goeth unto his house, unto his city, and giveth charge unto his household, and strangleth himself, and dieth, and he is buried in the burying-place of his father.";
dby[23] = "And when Ahithophel saw that his counsel was not followed, he saddled his ass, and arose and went to his house, to his city, and gave charge to his household, and hanged himself, and he died; and he was buried in the sepulchre of his father.";
web[23] = "And when Ahithophel saw that his counsel was not followed, he saddled [his] ass, and arose, and went home to his house, to his city, and put his household in order, and hanged himself, and died. and was buried in the sepulcher of his father.";
hnv[23] = "When Achitofel saw that his counsel was not followed, he saddled his donkey, and arose, and got him home, to his city, and set his house in order, and hanged himself; and he died, and was buried in the tomb of his father.";
vul[23] = "porro Ahitofel videns quod non fuisset factum consilium suum stravit asinum suum et surrexit et abiit in domum suam et in civitatem suam et disposita domo sua suspendio interiit et sepultus est in sepulchro patris sui";
kjv[24] = "Then David came to Mahanaim. And Absalom passed over Jordan, he and all the men of Israel with him.";
rsv[24] = "Then David came to Mahana\'im. And Ab\'salom crossed the Jordan with all the men of Israel.";
asv[24] = "Then David came to Mahanaim. And Absalom passed over the Jordan, he and all the men of Israel with him.";
yng[24] = "And David came to Mahanaim, and Absalom passed over the Jordan, he and all the men of Israel with him;";
dby[24] = "And David came to Mahanaim. And Absalom passed over the Jordan, he and all the men of Israel with him.";
web[24] = "Then David came to Mahanaim. And Absalom passed over Jordan, he and all the men of Israel with him.";
hnv[24] = "Then David came to Machanayim. Avshalom passed over the Yarden, he and all the men of Yisra\'el with him.";
vul[24] = "David autem venit in Castra et Absalom transivit Iordanem ipse et omnis vir Israhel cum eo";
kjv[25] = "And Absalom made Amasa captain of the host instead of Joab: which Amasa [was] a man\'s son, whose name [was] Ithra an Israelite, that went in to Abigail the daughter of Nahash, sister to Zeruiah Joab\'s mother.";
rsv[25] = "Now Ab\'salom had set Ama\'sa over the army instead of Jo\'ab. Ama\'sa was the son of a man named Ithra the Ish\'maelite, who had married Ab\'igal the daughter of Nahash, sister of Zeru\'iah, Jo\'ab\'s mother.";
asv[25] = "And Absalom set Amasa over the host instead of Joab. Now Amasa was the son of a man, whose name was Ithra the Israelite, that went in to Abigal the daughter of Nahash, sister to Zeruiah, Joab\'s mother.";
yng[25] = "and Amasa hath Absalom set instead of Joab over the host, and Amasa [is] a man\'s son whose name is Ithra the Israelite who hath gone in unto Abigail, daughter of Nahash, sister of Zeruiah, mother of Joab;";
dby[25] = "And Absalom set Amasa over the host instead of Joab; which Amasa was the son of a man whose name was Jithra the Israelite, that went in to Abigail the daughter of Nahash, sister to Zeruiah, Joab\'s mother.";
web[25] = "And Absalom made Amasa captain of the host instead of Joab: which Amasa [was] a man\'s son, whose name [was] Ithra, an Israelite, that went in to Abigail the daughter of Nahash, sister to Zeruiah, Joab\'s mother.";
hnv[25] = "Avshalom set `Amasa over the host instead of Yo\'av. Now `Amasa was the son of a man, whose name was Yitra the Yisra\'elite, who went in to Avigayil the daughter of Nachash, sister to Tzeru\'yah, Yo\'av\'s mother.";
vul[25] = "Amasam vero constituit Absalom pro Ioab super exercitum Amasa autem erat filius viri qui vocabatur Iethra de Hiesreli qui ingressus est ad Abigail filiam Naas sororem Sarviae quae fuit mater Ioab";
kjv[26] = "So Israel and Absalom pitched in the land of Gilead.";
rsv[26] = "And Israel and Ab\'salom encamped in the land of Gilead.";
asv[26] = "And Israel and Absalom encamped in the land of Gilead.";
yng[26] = "and Israel encampeth with Absalom [in] the land of Gilead.";
dby[26] = "And Israel and Absalom encamped in the land of Gilead.";
web[26] = "So Israel and Absalom encamped in the land of Gilead.";
hnv[26] = "Yisra\'el and Avshalom encamped in the land of Gil`ad.";
vul[26] = "et castrametatus est Israhel cum Absalom in terra Galaad";
kjv[27] = "And it came to pass, when David was come to Mahanaim, that Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lodebar, and Barzillai the Gileadite of Rogelim,";
rsv[27] = "When David came to Mahana\'im, Shobi the son of Nahash from Rabbah of the Ammonites, and Machir the son of Am\'miel from Lo-debar, and Barzil\'lai the Gileadite from Ro\'gelim,";
asv[27] = "And it came to pass, when David was come to Mahanaim, that Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lodebar, and Barzillai the Gileadite of Rogelim,";
yng[27] = "And it cometh to pass at the coming in of David to Mahanaim, that Shobi, son of Nahash, from Rabbah of the Bene-Ammon, and Machir son of Ammiel, from Lo-Debar, and Barzillai the Gileadite, from Rogelim,";
dby[27] = "And as soon as David came to Mahanaim, Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lo-debar, and Barzillai the Gileadite of Rogelim,";
web[27] = "And it came to pass, when David had come to Mahanaim, that Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lo-debar, and Barzillai the Gileadite of Rogelim,";
hnv[27] = "It happened, when David was come to Machanayim, that Shovi the son of Nachash of Rabbah of the children of `Ammon, and Makhir the son of `Ammi\'el of Lodebar, and Barzillai the Gil`adite of Roglim,";
vul[27] = "cumque venisset David in Castra Sobi filius Naas de Rabbath filiorum Ammon et Machir filius Ammihel de Lodabar et Berzellai Galaadites de Rogelim";

asv[28] = "brought beds, and basins, and earthen vessels, and wheat, and barley, and meal, and parched [grain], and beans, and lentils, and parched [pulse],";
yng[28] = "couch, and basin, and earthen vessel, and wheat, and barley, and flour, and roasted [corn], and beans, and lentiles, and roasted [pulse],";
dby[28] = "brought beds, and basons, and earthen vessels, and wheat, and barley, and flour, and parched [corn], and beans, and lentils, and parched [pulse],";
web[28] = "Brought beds, and basins, and earthen vessels, and wheat, and barley, and flour, and parched [corn], and beans, and lentils, and parched [pulse],";
hnv[28] = "brought beds, and basins, and earthen vessels, and wheat, and barley, and meal, and parched [grain], and beans, and lentils, and parched [pulse],";

kjv[29] = "And honey, and butter, and sheep, and cheese of kine, for David, and for the people that [were] with him, to eat: for they said, The people [is] hungry, and weary, and thirsty, in the wilderness.";
rsv[29] = "honey and curds and sheep and cheese from the herd, for David and the people with him to eat; for they said, &quot;The people are hungry and weary and thirsty in the wilderness.&quot;";
asv[29] = "and honey, and butter, and sheep, and cheese of the herd, for David, and for the people that were with him, to eat: for they said, The people are hungry, and weary, and thirsty, in the wilderness.";
yng[29] = "and honey, and butter, and sheep, and cheese of kine, have brought nigh for David, and for the people who [are] with him to eat, for they said, `Thy people [is] hungry, and weary, and thirsty, in the wilderness.\'";
dby[29] = "and honey, and cream, and sheep, and cheese of kine to David, and to the people that were with him, to eat; for they said, The people is hungry, and weary, and thirsty in the wilderness.";
web[29] = "And honey, and butter, and sheep, and cheese of cows, for David, and for the people that [were] with him, to eat: for they said, The people [are] hungry, and weary, and thirsty, in the wilderness.";
hnv[29] = "and honey, and butter, and sheep, and cheese of the herd, for David, and for the people who were with him, to eat: for they said, The people are hungry, and weary, and thirsty, in the wilderness.";
vul[29] = "et mel et butyrum oves et pingues vitulos dederuntque David et populo qui cum eo erat ad vescendum suspicati enim sunt populum fame et siti fatigari in deserto";
