csb[1] = "Some time later, the king of the Ammonites died, and his son Hanun became king in his place.";
csb[2] = "Then David said, &quot;I\'ll show kindness to Hanun son of Nahash, just as his father showed kindness to me.&quot; So David sent his emissaries to console Hanun concerning his father. However, when they arrived in the land of the Ammonites,";
csb[3] = "the Ammonite leaders said to Hanun their lord, &quot;Just because David has sent men with condolences for you, do you really believe he\'s showing respect for your father? Instead, hasn\'t David sent his emissaries in order to scout out the city, spy on it, and demolish it? &quot;";
csb[4] = "So Hanun took David\'s emissaries, shaved off half their beards, cut their clothes in half at the hips, and sent them away.";
csb[5] = "When this was reported to David, he sent someone to meet them, since they were deeply humiliated. The king said, &quot;Stay in Jericho until your beards grow back; then return.&quot;";
csb[6] = "When the Ammonites realized they had become repulsive to David, they hired twenty thousand foot soldiers from the Arameans of Beth-rehob and Zobah, one thousand men from the king of Maacah, and twelve thousand men from Tob.";
csb[7] = "David heard about it and sent Joab and all the elite troops.";
csb[8] = "The Ammonites marched out and lined up in battle formation at the entrance to the city gate while the Arameans of Zobah and Rehob and the men of Tob and Maacah were in the field by themselves.";
csb[9] = "When Joab saw that there was a battle line in front of him and another behind him, he chose some of Israel\'s finest young men and lined up in formation to engage the Arameans.";
csb[10] = "He placed the rest of the forces under the command of his brother Abishai. They lined up in formation to engage the Ammonites.";
csb[11] = "&quot;If the Arameans are too strong for me,&quot; Joab said, &quot;then you will be my help. However, if the Ammonites are too strong for you, I\'ll come to help you.";
csb[12] = "&quot;Be strong! Let\'s prove ourselves strong for our people and for the cities of our God. May the LORD\'s will be done.&quot;";
csb[13] = "Joab and his troops advanced to fight against the Arameans, and they fled before him.";
csb[14] = "When the Ammonites saw that the Arameans had fled, they too fled before Abishai and entered the city. So Joab withdrew from the attack against the Ammonites and went to Jerusalem.";
csb[15] = "When the Arameans saw that they had been defeated by Israel, they regrouped.";
csb[16] = "Hadadezer sent messengers to bring the Arameans who were beyond the Euphrates River, and they came to Helam with Shobach, commander of Hadadezer\'s army, leading them.";
csb[17] = "When this was reported to David, he gathered all Israel, crossed the Jordan, and went to Helam. Then the Arameans lined up to engage David in battle and fought against him.";
csb[18] = "But the Arameans fled before Israel, and David killed seven hundred of their charioteers and forty thousand foot soldiers. He also struck down Shobach commander of their army, who died there.";
csb[19] = "When all the kings who were Hadadezer\'s subjects saw that they had been defeated by Israel, they made peace with Israel and became their subjects. After this, the Arameans were afraid to ever help the Ammonites again.";
kjv[1] = "And it came to pass after this, that the king of the children of Ammon died, and Hanun his son reigned in his stead.";
rsv[1] = "After this the king of the Ammonites died, and Hanun his son reigned in his stead.";
asv[1] = "And it came to pass after this, that the king of the children of Ammon died, and Hanun his son reigned in his stead.";
yng[1] = "And it cometh to pass afterwards, that the king of the Bene-Ammon dieth, and Hanun his son reigneth in his stead,";
dby[1] = "And it came to pass after this that the king of the children of Ammon died, and Hanun his son reigned in his stead.";
web[1] = "And it came to pass after this, that the king of the children of Ammon died, and Hanun his son reigned in his stead.";
hnv[1] = "It happened after this, that the king of the children of `Ammon died, and Hanun his son reigned in his place.";
vul[1] = "factum est autem post haec ut moreretur rex filiorum Ammon et regnaret Anon filius eius pro eo";
kjv[2] = "Then said David, I will shew kindness unto Hanun the son of Nahash, as his father shewed kindness unto me. And David sent to comfort him by the hand of his servants for his father. And David\'s servants came into the land of the children of Ammon.";
rsv[2] = "And David said, &quot;I will deal loyally with Hanun the son of Nahash, as his father dealt loyally with me.&quot; So David sent by his servants to console him concerning his father. And David\'s servants came into the land of the Ammonites.";
asv[2] = "And David said, I will show kindness unto Hanun the son of Nahash, as his father showed kindness unto me. So David sent by his servants to comfort him concerning his father. And David\'s servants came into the land of the children of Ammon.";
yng[2] = "and David saith, `I do kindness with Hanun son of Nahash, as his father did with me kindness;\' and David sendeth to comfort him by the hand of his servants concerning his father, and the servants of David come in to the land of the Bene-Ammon.";
dby[2] = "And David said, I will shew kindness to Hanun the son of Nahash, as his father shewed kindness to me. And David sent to comfort him by the hand of his servants for his father. And David\'s servants came into the land of the children of Ammon.";
web[2] = "Then said David, I will show kindness to Hanun the son of Nahash, as his father showed kindness to me. And David sent to comfort him by the hand of his servants for his father. And David\'s servants came into the land of the children of Ammon.";
hnv[2] = "David said, I will show kindness to Hanun the son of Nachash, as his father shown kindness to me. So David sent by his servants to comfort him concerning his father. David\'s servants came into the land of the children of `Ammon.";
vul[2] = "dixitque David faciam misericordiam cum Anon filio Naas sicut fecit pater eius mecum misericordiam misit ergo David consolans eum per servos suos super patris interitu cum autem venissent servi David in terram filiorum Ammon";
kjv[3] = "And the princes of the children of Ammon said unto Hanun their lord, Thinkest thou that David doth honour thy father, that he hath sent comforters unto thee? hath not David [rather] sent his servants unto thee, to search the city, and to spy it out, and to overthrow it?";
rsv[3] = "But the princes of the Ammonites said to Hanun their lord, &quot;Do you think, because David has sent comforters to you, that he is honoring your father? Has not David sent his servants to you to search the city, and to spy it out, and to overthrow it?&quot;";
asv[3] = "But the princes of the children of Ammon said unto Hanun their lord, Thinkest thou that David doth honor thy father, in that he hath sent comforters unto thee? hath not David sent his servants unto thee to search the city, and to spy it out, and to overthrow it?";
yng[3] = "And the heads of the Bene-Ammon say unto Hanun their lord, `Is David honouring thy father in thine eyes because he hath sent to thee comforters? for to search the city, and to spy it, and to overthrow it, hath not David sent his servants unto thee?\'";
dby[3] = "And the princes of the children of Ammon said to Hanun their lord, Is it, in thine eyes, to honour thy father that David has sent comforters to thee? Is it not to search the city and to spy it out, and to overthrow it, that David has sent his servants to thee?";
web[3] = "And the princes of the children of Ammon said to Hanun their lord, Thinkest thou that David doth honor thy father, that he hath sent comforters to thee? hath not David [rather] sent his servants to thee, to search the city, and to spy it out, and to overthrow it?";
hnv[3] = "But the princes of the children of `Ammon said to Hanun their lord, Do you think that David honors your father, in that he has sent comforters to you? Hasn\'t David sent his servants to you to search the city, and to spy it out, and to overthrow it?";
vul[3] = "dixerunt principes filiorum Ammon ad Anon dominum suum putas quod propter honorem patris tui David miserit ad te consolatores et non ideo ut investigaret et exploraret civitatem et everteret eam misit David servos suos ad te";
kjv[4] = "Wherefore Hanun took David\'s servants, and shaved off the one half of their beards, and cut off their garments in the middle, [even] to their buttocks, and sent them away.";

asv[4] = "So Hanun took David\'s servants, and shaved off the one half of their beards, and cut off their garments in the middle, even to their buttocks, and sent them away.";

dby[4] = "And Hanun took David\'s servants, and had the one half of their beards shaved off, and their raiment cut off in the midst, as far as their buttocks, and sent them away.";

vul[4] = "tulit itaque Anon servos David rasitque dimidiam partem barbae eorum et praecidit vestes eorum medias usque ad nates et dimisit eos";
kjv[5] = "When they told [it] unto David, he sent to meet them, because the men were greatly ashamed: and the king said, Tarry at Jericho until your beards be grown, and [then] return.";
rsv[5] = "When it was told David, he sent to meet them, for the men were greatly ashamed. And the king said, &quot;Remain at Jericho until your beards have grown, and then return.&quot;";
asv[5] = "When they told it unto David, he sent to meet them; for the men were greatly ashamed. And the king said, Tarry at Jericho until your beards be grown, and then return.";
yng[5] = "and they declare [it] to David, and he sendeth to meet them, for the men have been greatly ashamed, and the king saith, `Abide in Jericho till your beard doth spring up -- then ye have returned.\'";
dby[5] = "And they told [it] to David; and he sent to meet them, for the men were greatly ashamed. And the king said, Abide at Jericho until your beards be grown, and then return.";
web[5] = "When they told [it] to David, he sent to meet them, because the men were greatly ashamed. And the king said, Tarry at Jericho until your beards are grown, and [then] return.";
hnv[5] = "When they told it to David, he sent to meet them; for the men were greatly ashamed. The king said, Wait at Yericho until your beards be grown, and then return.";
vul[5] = "quod cum nuntiatum esset David misit in occursum eorum erant enim viri confusi turpiter valde et mandavit eis David manete Hiericho donec crescat barba vestra et tunc revertimini";
kjv[6] = "And when the children of Ammon saw that they stank before David, the children of Ammon sent and hired the Syrians of Bethrehob, and the Syrians of Zoba, twenty thousand footmen, and of king Maacah a thousand men, and of Ishtob twelve thousand men.";
rsv[6] = "When the Ammonites saw that they had become odious to David, the Ammonites sent and hired the Syrians of Beth-re\'hob, and the Syrians of Zobah, twenty thousand foot soldiers, and the king of Ma\'acah with a thousand men, and the men of Tob, twelve thousand men.";
asv[6] = "And when the children of Ammon saw that they were become odious to David, the children of Ammon sent and hired the Syrians of Beth-rehob, and the Syrians of Zobah, twenty thousand footmen, and the king of Maacah with a thousand men, and the men of Tob twelve thousand men.";
yng[6] = "And the Bene-Ammon see that they have been abhorred by David, and the Bene-Ammon send and hire Aram of Beth-Rehob, and Aram of Zoba, twenty thousand footmen, and the king of Maacah [with] a thousand men, and Ish-Tob [with] twelve thousand men;";
dby[6] = "And the children of Ammon saw that they had made themselves odious to David; and the children of Ammon sent and hired the Syrians of Beth-Rehob, and the Syrians of Zoba, twenty thousand footmen, and the king of Maacah [with] a thousand men, and the men of Tob twelve thousand men.";
web[6] = "And when the children of Ammon saw that they had made themselves odious before David, the children of Ammon sent and hired the Syrians of Beth-rehob, and the Syrians of Zoba, twenty thousand footmen, and of king Maacah a thousand men, and of Ish-tob twelve thousand men.";
hnv[6] = "When the children of `Ammon saw that they were become odious to David, the children of `Ammon sent and hired the Aram of Beit-Rechov, and the Aram of Tzovah, twenty thousand footmen, and the king of Ma`akhah with one thousand men, and the men of Tov twelve thousand men.";
vul[6] = "videntes autem filii Ammon quod iniuriam fecissent David miserunt et conduxerunt mercede Syrum Roob et Syrum Soba viginti milia peditum et a rege Maacha mille viros et ab Histob duodecim milia virorum";
kjv[7] = "And when David heard of [it], he sent Joab, and all the host of the mighty men.";
rsv[7] = "And when David heard of it, he sent Jo\'ab and all the host of the mighty men.";
asv[7] = "And when David heard of it, he sent Joab, and all the host of the mighty men.";
yng[7] = "and David heareth, and sendeth Joab, and all the host -- the mighty men.";
dby[7] = "And David heard [of it], and he sent Joab, and all the host, the mighty men.";
web[7] = "And when David heard of [it], he sent Joab, and all the host of the mighty men.";
hnv[7] = "When David heard of it, he sent Yo\'av, and all the host of the mighty men.";
vul[7] = "quod cum audisset David misit Ioab et omnem exercitum bellatorum";
kjv[8] = "And the children of Ammon came out, and put the battle in array at the entering in of the gate: and the Syrians of Zoba, and of Rehob, and Ishtob, and Maacah, [were] by themselves in the field.";
rsv[8] = "And the Ammonites came out and drew up in battle array at the entrance of the gate; and the Syrians of Zobah and of Rehob, and the men of Tob and Ma\'acah, were by themselves in the open country.";
asv[8] = "And the children of Ammon came out, and put the battle in array at the entrance of the gate: and the Syrians of Zobah and of Rehob, and the men of Tob and Maacah, were by themselves in the field.";
yng[8] = "And the Bene-Ammon come out, and set battle in array, at the opening of the gate, and Aram of Zoba, and Rehob, and Ish-Tob, and Maacah, [are] by themselves in the field;";
dby[8] = "And the children of Ammon came out, and put the battle in array at the entrance of the gate; and the Syrians of Zoba and of Rehob, and the men of Tob and Maacah were by themselves in the field.";
web[8] = "And the children of Ammon came out, and put the battle in array at the entrance of the gate: and the Syrians of Zoba, and of Rehob, and Ish-tob, and Maacah, [were] by themselves in the field.";
hnv[8] = "The children of `Ammon came out, and put the battle in array at the entrance of the gate: and the Aram of Tzovah and of Rechov, and the men of Tov and Ma`akhah, were by themselves in the field.";
vul[8] = "egressi sunt ergo filii Ammon et direxerunt aciem ante ipsum introitum portae Syrus autem Soba et Roob et Histob et Maacha seorsum erant in campo";
kjv[9] = "When Joab saw that the front of the battle was against him before and behind, he chose of all the choice [men] of Israel, and put [them] in array against the Syrians:";
rsv[9] = "When Jo\'ab saw that the battle was set against him both in front and in the rear, he chose some of the picked men of Israel, and arrayed them against the Syrians;";
asv[9] = "Now when Joab saw that the battle was set against him before and behind, he chose of all the choice men of Israel, and put them in array against the Syrians:";
yng[9] = "and Joab seeth that the front of the battle hath been unto him before and behind, and he chooseth of all the chosen in Israel, and setteth in array to meet Aram,";
dby[9] = "And Joab saw that the front of the battle was against him before and behind; and he chose out of all the choice men of Israel, and put them in array against the Syrians;";
web[9] = "When Joab saw that the front of the battle was against him before and behind, he selected of all the choice [men] of Israel, and put [them] in array against the Syrians:";
hnv[9] = "Now when Yo\'av saw that the battle was set against him before and behind, he chose of all the choice men of Yisra\'el, and put them in array against the Aram:";
vul[9] = "videns igitur Ioab quod praeparatum esset adversum se proelium et ex adverso et post tergum elegit ex omnibus electis Israhel et instruxit aciem contra Syrum";

asv[10] = "and the rest of the people he committed into the hand of Abishai his brother; and he put them in array against the children of Ammon.";
yng[10] = "and the rest of the people he hath given into the hand of Abishai his brother, and setteth in array to meet the Bene-Ammon.";

kjv[11] = "And he said, If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, then I will come and help thee.";

yng[11] = "And he saith, `If Aram be stronger than I, then thou hast been to me for salvation, and if the Bene-Ammon be stronger than thou, then I have come to give salvation to thee;";
dby[11] = "And he said, If the Syrians be too strong for me, then thou shalt help me; and if the children of Ammon be too strong for thee, then I will come and help thee.";

kjv[12] = "Be of good courage, and let us play the men for our people, and for the cities of our God: and the LORD do that which seemeth him good.";
rsv[12] = "Be of good courage, and let us play the man for our people, and for the cities of our God; and may the LORD do what seems good to him.&quot;";
asv[12] = "Be of good courage, and let us play the man for our people, and for the cities of our God: and Jehovah do that which seemeth him good.";
yng[12] = "be strong and strengthen thyself for our people, and for the cities of our God, and Jehovah doth that which is good in His eyes.\'";
dby[12] = "Be strong, and let us shew ourselves valiant for our people and for the cities of our God; and Jehovah do what is good in his sight.";
web[12] = "Be of good courage, and let us play the men for our people, and for the cities of our God: and the LORD do that which seemeth him good.";
hnv[12] = "Be of good courage, and let us play the man for our people, and for the cities of our God: and the LORD do that which seems him good.";

kjv[13] = "And Joab drew nigh, and the people that [were] with him, unto the battle against the Syrians: and they fled before him.";
rsv[13] = "So Jo\'ab and the people who were with him drew near to battle against the Syrians; and they fled before him.";
asv[13] = "So Joab and the people that were with him drew nigh unto the battle against the Syrians: and they fled before him.";
yng[13] = "And Joab draweth nigh, and the people who [are] with him, to battle against Aram, and they flee from his presence;";
dby[13] = "And Joab drew near, and the people that were with him, unto the battle against the Syrians; and they fled before him.";
web[13] = "And Joab and the people that [were] with him drew near to the battle against the Syrians: and they fled before him.";
hnv[13] = "So Yo\'av and the people who were with him drew near to the battle against the Aram: and they fled before him.";
vul[13] = "iniit itaque Ioab et populus qui erat cum eo certamen contra Syros qui statim fugerunt a facie eius";
kjv[14] = "And when the children of Ammon saw that the Syrians were fled, then fled they also before Abishai, and entered into the city. So Joab returned from the children of Ammon, and came to Jerusalem.";
rsv[14] = "And when the Ammonites saw that the Syrians fled, they likewise fled before Abi\'shai, and entered the city. Then Jo\'ab returned from fighting against the Ammonites, and came to Jerusalem.";
asv[14] = "And when the children of Ammon saw that the Syrians were fled, they likewise fled before Abishai, and entered into the city. Then Joab returned from the children of Ammon, and came to Jerusalem.";
yng[14] = "and the Bene-Ammon have seen that Aram hath fled, and they flee from the presence of Abishai, and go in to the city; and Joab turneth back from the Bene-Ammon, and cometh in to Jerusalem.";
dby[14] = "And when the children of Ammon saw that the Syrians fled, they fled before Abishai, and entered into the city. And Joab returned from the children of Ammon, and came to Jerusalem.";
web[14] = "And when the children of Ammon saw that the Syrians had fled, then fled they also before Abishai, and entered into the city. So Joab returned from the children of Ammon, and came to Jerusalem.";
hnv[14] = "When the children of `Ammon saw that the Aram were fled, they likewise fled before Avishai, and entered into the city. Then Yo\'av returned from the children of `Ammon, and came to Yerushalayim.";
vul[14] = "filii autem Ammon videntes quod fugissent Syri fugerunt et ipsi a facie Abisai et ingressi sunt civitatem reversusque est Ioab a filiis Ammon et venit Hierusalem";
kjv[15] = "And when the Syrians saw that they were smitten before Israel, they gathered themselves together.";
rsv[15] = "But when the Syrians saw that they had been defeated by Israel, they gathered themselves together.";
asv[15] = "And when the Syrians saw that they were put to the worse before Israel, they gathered themselves together.";
yng[15] = "And Aram seeth that it is smitten before Israel, and they are gathered together;";
dby[15] = "And when the Syrians saw that they were routed before Israel, they gathered themselves together.";
web[15] = "And when the Syrians saw that they were smitten before Israel, they assembled themselves.";
hnv[15] = " When the Aram saw that they were put to the worse before Yisra\'el, they gathered themselves together.";
vul[15] = "videntes igitur Syri quoniam corruissent coram Israhel congregati sunt pariter";
kjv[16] = "And Hadarezer sent, and brought out the Syrians that [were] beyond the river: and they came to Helam; and Shobach the captain of the host of Hadarezer [went] before them.";
rsv[16] = "And Hadade\'zer sent, and brought out the Syrians who were beyond the Euphra\'tes; and they came to Helam, with Shobach the commander of the army of Hadade\'zer at their head.";
asv[16] = "And Hadarezer sent, and brought out the Syrians that were beyond the River: and they came to Helam, with Shobach the captain of the host of Hadarezer at their head.";
yng[16] = "and Hadadezer sendeth, and bringeth out Aram which [is] beyond the River, and they come in to Helam, and Shobach head of the host of Hadadezer [is] before them.";
dby[16] = "And Hadarezer sent, and drew forth the Syrians that were beyond the river; and they came to Helam; and Shobach the captain of the host of Hadarezer [went] before them.";

hnv[16] = "Hadad`ezer sent, and brought out the Aram who were beyond the River: and they came to Helam, with Shovakh the captain of the host of Hadad`ezer at their head.";

kjv[17] = "And when it was told David, he gathered all Israel together, and passed over Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.";
rsv[17] = "And when it was told David, he gathered all Israel together, and crossed the Jordan, and came to Helam. And the Syrians arrayed themselves against David, and fought with him.";
asv[17] = "And it was told David; and he gathered all Israel together, and passed over the Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.";
yng[17] = "And it is declared to David, and he gathereth all Israel, and passeth over the Jordan, and cometh in to Helam, and Aram setteth itself in array to meet David, and they fight with him;";
dby[17] = "And it was told David; and he gathered all Israel, and passed over the Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.";
web[17] = "And when it was told David, he assembled all Israel, and passed over Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.";
hnv[17] = "It was told David; and he gathered all Yisra\'el together, and passed over the Yarden, and came to Helam. The Aram set themselves in array against David, and fought with him.";
vul[17] = "quod cum nuntiatum esset David contraxit omnem Israhelem et transivit Iordanem venitque in Helema et direxerunt aciem Syri ex adverso David et pugnaverunt contra eum";
kjv[18] = "And the Syrians fled before Israel; and David slew [the men of] seven hundred chariots of the Syrians, and forty thousand horsemen, and smote Shobach the captain of their host, who died there.";
rsv[18] = "And the Syrians fled before Israel; and David slew of the Syrians the men of seven hundred chariots, and forty thousand horsemen, and wounded Shobach the commander of their army, so that he died there.";
asv[18] = "And the Syrians fled before Israel; and David slew of the Syrians [the men of] seven hundred chariots, and forty thousand horsemen, and smote Shobach the captain of their host, so that he died there.";
yng[18] = "and Aram fleeth from the presence of Israel, and David slayeth of Aram seven hundred charioteers, and forty thousand horsemen, and Shobach head of its host he hath smitten, and he dieth there.";
dby[18] = "And the Syrians fled before Israel; and David slew of the Syrians seven hundred [in] chariots, and forty thousand horsemen, and smote Shobach the captain of their host, who died there.";
web[18] = "And the Syrians fled before Israel; and David slew [the men of] seven hundred chariots of the Syrians, and forty thousand horsemen, and smote Shobach the captain of their host, who died there.";
hnv[18] = "The Aram fled before Yisra\'el; and David killed of the Aram [the men of] seven hundred chariots, and forty thousand horsemen, and struck Shovakh the captain of their host, so that he died there.";
vul[18] = "fugeruntque Syri a facie Israhel et occidit David de Syris septingentos currus et quadraginta milia equitum et Sobach principem militiae percussit qui statim mortuus est";
kjv[19] = "And when all the kings [that were] servants to Hadarezer saw that they were smitten before Israel, they made peace with Israel, and served them. So the Syrians feared to help the children of Ammon any more.";
rsv[19] = "And when all the kings who were servants of Hadade\'zer saw that they had been defeated by Israel, they made peace with Israel, and became subject to them. So the Syrians feared to help the Ammonites any more.";
asv[19] = "And when all the kings that were servants to Hadarezer saw that they were put to the worse before Israel, they made peace with Israel, and served them. So the Syrians feared to help the children of Ammon any more.";
yng[19] = "And all the kings -- servants of Hadadezer -- see that they have been smitten before Israel, and make peace with Israel, and serve them; and Aram is afraid to help any more the Bene-Ammon.";
dby[19] = "And all the kings that were servants to Hadarezer saw that they were routed before Israel, and they made peace with Israel, and served them. And the Syrians feared to help the children of Ammon any more.";
web[19] = "And when all the kings [that were] servants to Hadarezer saw that they were smitten before Israel, they made peace with Israel, and served them. So the Syrians feared to help the children of Ammon any more.";
hnv[19] = "When all the kings who were servants to Hadad`ezer saw that they were put to the worse before Yisra\'el, they made shalom with Yisra\'el, and served them. So the Aram feared to help the children of `Ammon any more.";
vul[19] = "videntes autem universi reges qui erant in praesidio Adadezer victos se ab Israhel fecerunt pacem cum Israhel et servierunt eis timueruntque Syri auxilium praebere filiis Ammon";
