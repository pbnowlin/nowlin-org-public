csb[1] = "After this, Absalom got himself a chariot, horses, and fifty men to run before him.";
csb[2] = "He would get up early and stand beside the road leading to the city gate. Whenever anyone had a grievance to bring before the king for settlement, Absalom called out to him and asked, &quot;What city are you from? &quot; If he replied, &quot;Your servant is from one of the tribes of Israel,&quot;";
csb[3] = "Absalom said to him, &quot;Look, your claims are good and right, but the king does not have anyone to listen to you.&quot;";
csb[4] = "He added, &quot;If only someone would appoint me judge in the land. Then anyone who had a grievance or dispute could come to me, and I would make sure he received justice.&quot;";
csb[5] = "When a person approached to pay homage to him, Absalom reached out his hand, took hold of him, and kissed him.";
csb[6] = "Absalom did this to all the Israelites who came to the king for a settlement. So Absalom stole the hearts of the men of Israel.";
csb[7] = "When four years had passed, Absalom said to the king, &quot;Please let me go to Hebron to fulfill a vow I made to the LORD.";
csb[8] = "&quot;For your servant made a vow when I lived in Geshur of Aram, saying: If the LORD really brings me back to Jerusalem, I will worship the LORD in Hebron.&quot;";
csb[9] = "&quot;Go in peace,&quot; the king said to him. So he went to Hebron.";
csb[10] = "Then Absalom sent agents throughout the tribes of Israel with this message: &quot;When you hear the sound of the ram\'s horn, you are to say, \'Absalom has become king in Hebron! \' &quot;";
csb[11] = "Two hundred men from Jerusalem went with Absalom. They had been invited and were going innocently, for they did not know the whole situation.";
csb[12] = "While he was offering the sacrifices, Absalom sent for David\'s adviser Ahithophel the Gilonite, from his city of Giloh. So the conspiracy grew strong, and the people supporting Absalom continued to increase.";
csb[13] = "Then an informer came to David and reported, &quot;The hearts of the men of Israel are with Absalom.&quot;";
csb[14] = "David said to all the servants with him in Jerusalem, &quot;Get up. We have to flee, or we will not escape from Absalom! Leave quickly, or he will overtake us quickly, heap disaster on us, and strike the city with the edge of the sword.&quot;";
csb[15] = "The king\'s servants said to the king, &quot;Whatever my lord the king decides, we are your servants.&quot;";
csb[16] = "Then the king set out, and his entire household followed him. But he left behind ten concubines to take care of the palace.";
csb[17] = "So the king set out, and all the people followed him. They stopped at the last house";
csb[18] = "while all his servants marched past him. Then all the Cherethites, the Pelethites, and the people of Gath-- six hundred men who came with him from there -- marched past the king.";
csb[19] = "The king said to Ittai of Gath, &quot;Why are you also going with us? Go back and stay with the new king since you\'re both a foreigner and an exile from your homeland.";
csb[20] = "&quot;Besides, you only arrived yesterday; should I make you wander around with us today while I go wherever I can? Go back and take your brothers with you. May the LORD show you kindness and faithfulness.&quot;";
csb[21] = "But in response, Ittai vowed to the king, &quot;As the LORD lives and as my lord the king lives, wherever my lord the king is, whether it means life or death, your servant will be there! &quot;";
csb[22] = "&quot;March on,&quot; David replied to Ittai. So Ittai of Gath marched past with all his men and the dependents who were with him.";
csb[23] = "Everyone in the countryside was weeping loudly while all the people were marching out of the city. As the king was crossing the Kidron Valley, all the people were marching past on the road that leads to the wilderness.";
csb[24] = "Zadok was also there, and all the Levites with him were carrying the ark of the covenant of God. They set the ark of God down, and Abiathar offered sacrifices until the people had finished marching past.";
csb[25] = "Then the king instructed Zadok, &quot;Return the ark of God to the city. If I find favor with the LORD, he will bring me back and allow me to see both it and its dwelling place.";
csb[26] = "&quot;However, if he should say, \'I do not delight in you,\' then here I am -- he can do with me whatever pleases him.&quot;";
csb[27] = "The king also said to the priest Zadok, &quot;Look, return to the city in peace and your two sons with you: your son Ahimaaz and Abiathar\'s son Jonathan.";
csb[28] = "&quot;Remember, I\'ll wait at the fords of the wilderness until word comes from you to inform me.&quot;";
csb[29] = "So Zadok and Abiathar returned the ark of God to Jerusalem and stayed there.";
csb[30] = "David was climbing the slope of the Mount of Olives, weeping as he ascended. His head was covered, and he was walking barefoot. All of the people with him covered their heads and went up, weeping as they ascended.";
csb[31] = "Then someone reported to David: &quot;Ahithophel is among the conspirators with Absalom.&quot; &quot;LORD,&quot; David pleaded, &quot;please turn the counsel of Ahithophel into foolishness! &quot;";
csb[32] = "When David came to the summit where he used to worship God, Hushai the Archite was there to meet him with his robe torn and dust on his head.";
csb[33] = "David said to him, &quot;If you go away with me, you\'ll be a burden to me,";
csb[34] = "&quot;but if you return to the city and tell Absalom, \'I will be your servant, Your Majesty! Previously, I was your father\'s servant, but now I will be your servant,\' then you can counteract Ahithophel\'s counsel for me.";
csb[35] = "&quot;Won\'t the priests Zadok and Abiathar be there with you? Report everything you hear from the palace to the priests Zadok and Abiathar.";
csb[36] = "&quot;Take note: their two sons are there with them--Zadok\'s son Ahimaaz and Abiathar\'s son Jonathan. Send them to tell me everything you hear.&quot;";
csb[37] = "So Hushai, David\'s personal adviser, entered Jerusalem just as Absalom was entering the city.";

kjv[2] = "And Absalom rose up early, and stood beside the way of the gate: and it was [so], that when any man that had a controversy came to the king for judgment, then Absalom called unto him, and said, Of what city [art] thou? And he said, Thy servant [is] of one of the tribes of Israel.";
rsv[2] = "And Ab\'salom used to rise early and stand beside the way of the gate; and when any man had a suit to come before the king for judgment, Ab\'salom would call to him, and say, &quot;From what city are you?&quot; And when he said, &quot;Your servant is of such and such a tribe in Israel,&quot;";

dby[2] = "And Absalom rose early, and stood beside the way of the gate; and it was so, that when any man who had a controversy had to come to the king for judgment, then Absalom called him, and said, Of what city art thou? And he said, Thy servant is of one of the tribes of Israel.";
web[2] = "And Absalom rose early, and stood beside the way of the gate: and it was [so], that when any man that had a controversy came to the king for judgment, then Absalom called to him, and said, Of what city [art] thou? And he said, Thy servant [is] one of the tribes of Israel.";
hnv[2] = "Avshalom rose up early, and stood beside the way of the gate: and it was so, that when any man had a suit which should come to the king for judgment, then Avshalom called to him, and said, Of what city are you? He said, Your servant is of one of the tribes of Yisra\'el.";
vul[2] = "et mane consurgens Absalom stabat iuxta introitum portae et omnem virum qui habebat negotium ut veniret ad regis iudicium vocabat Absalom ad se et dicebat de qua civitate es tu qui respondens aiebat ex una tribu Israhel ego sum servus tuus";

kjv[14] = "And David said unto all his servants that [were] with him at Jerusalem, Arise, and let us flee; for we shall not [else] escape from Absalom: make speed to depart, lest he overtake us suddenly, and bring evil upon us, and smite the city with the edge of the sword.";
rsv[14] = "Then David said to all his servants who were with him at Jerusalem, &quot;Arise, and let us flee; or else there will be no escape for us from Ab\'salom; go in haste, lest he overtake us quickly, and bring down evil upon us, and smite the city with the edge of the sword.&quot;";
asv[14] = "And David said unto all his servants that were with him at Jerusalem, Arise, and let us flee; for else none of us shall escape from Absalom: make speed to depart, lest he overtake us quickly, and bring down evil upon us, and smite the city with the edge of the sword.";
yng[14] = "And David saith to all his servants who [are] with him in Jerusalem, `Rise, and we flee, for we have no escape from the face of Absalom; haste to go, lest he hasten, and have overtaken us, and forced on us evil, and smitten the city by the mouth of the sword.\'";
dby[14] = "And David said to all his servants that were with him at Jerusalem, Rise up and let us flee; for we shall not [else] escape from Absalom. Be quick to depart, lest he overtake us quickly, and bring evil upon us, and smite the city with the edge of the sword.";
web[14] = "And David said to all his servants that [were] with him at Jerusalem, Arise, and let us flee; for we shall not [else] escape from Absalom: make speed to depart, lest he should overtake us suddenly, and bring evil upon us, and smite the city with the edge of the sword.";
hnv[14] = "David said to all his servants who were with him at Yerushalayim, Arise, and let us flee; for else none of us shall escape from Avshalom: make speed to depart, lest he overtake us quickly, and bring down evil on us, and strike the city with the edge of the sword.";
vul[14] = "et ait David servis suis qui erant cum eo in Hierusalem surgite fugiamus neque enim erit nobis effugium a facie Absalom festinate egredi ne forte veniens occupet nos et inpellat super nos ruinam et percutiat civitatem in ore gladii";

hnv[16] = "The king went forth, and all his household after him. The king left ten women, who were concubines, to keep the house.";
vul[16] = "egressus est ergo rex et universa domus eius pedibus suis et dereliquit rex decem mulieres concubinas ad custodiendam domum";
kjv[17] = "And the king went forth, and all the people after him, and tarried in a place that was far off.";
rsv[17] = "And the king went forth, and all the people after him; and they halted at the last house.";
asv[17] = "And the king went forth, and all the people after him; and they tarried in Beth-merhak.";
yng[17] = "And the king goeth out, and all the people at his feet, and they stand still at the farthest off house.";
dby[17] = "And the king went forth, and all the people after him, and stayed at the remote house.";
web[17] = "And the king went forth, and all the people after him, and tarried in a place that was far off.";
hnv[17] = "The king went forth, and all the people after him; and they stayed in Beit-Merhak.";
vul[17] = "egressusque rex et omnis Israhel pedibus suis stetit procul a domo";
kjv[18] = "And all his servants passed on beside him; and all the Cherethites, and all the Pelethites, and all the Gittites, six hundred men which came after him from Gath, passed on before the king.";
rsv[18] = "And all his servants passed by him; and all the Cher\'ethites, and all the Pel\'ethites, and all the six hundred Gittites who had followed him from Gath, passed on before the king.";
asv[18] = "And all his servants passed on beside him; and all the Cherethites, and all the Pelethites, and all the Gittites, six hundred men that came after him from Gath, passed on before the king.";
yng[18] = "And all his servants are passing on at his side, and all the Cherethite, and all the Pelethite, and all the Gittites, six hundred men who came at his feet from Gath, are passing on at the front of the king.";
dby[18] = "And all his servants passed on beside him; and all the Cherethites, and all the Pelethites, and all the Gittites, six hundred men that came after him from Gath, passed over before the king.";
web[18] = "And all his servants passed on by his side; and all the Cherethites, and all the Pelethites, and all the Gittites, six hundred men who came after him from Gath, passed on before the king.";
hnv[18] = "All his servants passed on beside him; and all the Kereti, and all the Peleti, and all the Gitti, six hundred men who came after him from Gat, passed on before the king.";
vul[18] = "et universi servi eius ambulabant iuxta eum et legiones Cherethi et Felethi et omnes Getthei sescenti viri qui secuti eum fuerant de Geth praecedebant regem";
kjv[19] = "Then said the king to Ittai the Gittite, Wherefore goest thou also with us? return to thy place, and abide with the king: for thou [art] a stranger, and also an exile.";
rsv[19] = "Then the king said to It\'tai the Gittite, &quot;Why do you also go with us? Go back, and stay with the king; for you are a foreigner, and also an exile from your home.";
asv[19] = "Then said the king to Ittai the Gittite, Wherefore goest thou also with us? return, and abide with the king: for thou art a foreigner, and also an exile; [return] to thine own place.";
yng[19] = "And the king saith unto Ittai the Gittite, `Why dost thou go -- thou also -- with us? turn back -- and abide with the king, for thou [art] a stranger, and also an exile thou -- to thy place.";
dby[19] = "And the king said to Ittai the Gittite, Why dost thou also go with us? return to thy place, and abide with the king; for thou art a foreigner, and besides, thou hast emigrated to the place where thou [dwellest].";
web[19] = "Then said the king to Ittai the Gittite, Why goest thou also with us? return to thy place, and abide with the king; for thou [art] a stranger, and also an exile.";
hnv[19] = "Then said the king to Ittai the Gittite, Why go you also with us? return, and abide with the king: for you are a foreigner, and also an exile; [return] to your own place.";
vul[19] = "dixit autem rex ad Ethai Gettheum cur venis nobiscum revertere et habita cum rege quia peregrinus es et egressus de loco tuo";
kjv[20] = "Whereas thou camest [but] yesterday, should I this day make thee go up and down with us? seeing I go whither I may, return thou, and take back thy brethren: mercy and truth [be] with thee.";
rsv[20] = "You came only yesterday, and shall I today make you wander about with us, seeing I go I know not where? Go back, and take your brethren with you; and may the LORD show steadfast love and faithfulness to you.&quot;";
asv[20] = "Whereas thou camest but yesterday, should I this day make thee go up and down with us, seeing I go whither I may? return thou, and take back thy brethren; mercy and truth be with thee.";
yng[20] = "Yesterday [is] thy coming in, and to-day I move thee to go with us, and I am going on that which I am going! -- turn back, and take back thy brethren with thee, -- kindness and truth.\'";
dby[20] = "Thou didst come yesterday, and should I this day make thee go up and down with us, seeing I go whither I can? Return and take back thy brethren. Mercy and truth be with thee!";
web[20] = "Whereas thou camest [but] yesterday, should I this day make thee go up and down with us? seeing I go whither I may; return thou, and take back thy brethren: mercy and truth [be] with thee.";
hnv[20] = "Whereas you came but yesterday, should I this day make you go up and down with us, seeing I go where I may? return you, and take back your brothers; mercy and truth be with you.";
vul[20] = "heri venisti et hodie inpelleris nobiscum egredi ego autem vadam quo iturus sum revertere et reduc tecum fratres tuos ostendisti gratiam et fidem";
kjv[21] = "And Ittai answered the king, and said, [As] the LORD liveth, and [as] my lord the king liveth, surely in what place my lord the king shall be, whether in death or life, even there also will thy servant be.";
rsv[21] = "But It\'tai answered the king, &quot;As the LORD lives, and as my lord the king lives, wherever my lord the king shall be, whether for death or for life, there also will your servant be.&quot;";
asv[21] = "And Ittai answered the king, and said, As Jehovah liveth, and as my lord the king liveth, surely in what place my lord the king shall be, whether for death or for life, even there also will thy servant be.";
yng[21] = "And Ittai answereth the king and saith, `Jehovah liveth, and my lord the king liveth, surely in the place where my lord the king is -- if for death, if for life, surely there is thy servant.\'";
dby[21] = "And Ittai answered the king and said, [As] Jehovah liveth, and [as] my lord the king liveth, surely in what place my lord the king shall be, whether in death or life, even there also will thy servant be.";
web[21] = "And Ittai answered the king, and said, [As] the LORD liveth, and [as] my lord the king liveth, surely in what place my lord the king shall be, whether in death or life, even there also will thy servant be.";
hnv[21] = " Ittai answered the king, and said, As the LORD lives, and as my lord the king lives, surely in what place my lord the king shall be, whether for death or for life, even there also will your servant be.";
vul[21] = "et respondit Ethai regi dicens vivit Dominus et vivit dominus meus rex quoniam in quocumque loco fueris domine mi rex sive in morte sive in vita ibi erit servus tuus";
kjv[22] = "And David said to Ittai, Go and pass over. And Ittai the Gittite passed over, and all his men, and all the little ones that [were] with him.";
rsv[22] = "And David said to It\'tai, &quot;Go then, pass on.&quot; So It\'tai the Gittite passed on, with all his men and all the little ones who were with him.";
asv[22] = "And David said to Ittai, Go and pass over. And Ittai the Gittite passed over, and all his men, and all the little ones that were with him.";
yng[22] = "And David saith unto Ittai, `Go and pass over;\' and Ittai the Gittite passeth over, and all his men, and all the infants who [are] with him.";
dby[22] = "And David said to Ittai, Go and pass over. And Ittai the Gittite passed over, and all his men, and all the little ones that were with him.";
web[22] = "And David said to Ittai, Go and pass over. And Ittai the Gittite passed over, and all his men, and all the little ones that [were] with him.";
hnv[22] = " David said to Ittai, Go and pass over. Ittai the Gittite passed over, and all his men, and all the little ones who were with him.";
vul[22] = "et ait David Ethai veni et transi et transivit Ethai Gettheus et omnes viri qui cum eo erant et reliqua multitudo";
kjv[23] = "And all the country wept with a loud voice, and all the people passed over: the king also himself passed over the brook Kidron, and all the people passed over, toward the way of the wilderness.";
rsv[23] = "And all the country wept aloud as all the people passed by, and the king crossed the brook Kidron, and all the people passed on toward the wilderness.";
asv[23] = "And all the country wept with a loud voice, and all the people passed over: the king also himself passed over the brook Kidron, and all the people passed over, toward the way of the wilderness.";
yng[23] = "And all the land are weeping -- a great voice, and all the people are passing over; and the king is passing over through the brook Kidron, and all the people are passing over on the front of the way of the wilderness;";
dby[23] = "And all the country wept with a loud voice, and all the people passed over; the king also himself passed over the torrent Kidron, and all the people passed over, towards the way of the wilderness.";
web[23] = "And all the country wept with a loud voice, and all the people passed over: the king also himself passed over the brook Kidron, and all the people passed over, towards the way of the wilderness.";
hnv[23] = "All the country wept with a loud voice, and all the people passed over: the king also himself passed over the brook Kidron, and all the people passed over, toward the way of the wilderness.";
vul[23] = "omnesque flebant voce magna et universus populus transiebat rex quoque transgrediebatur torrentem Cedron et cunctus populus incedebat contra viam quae respicit ad desertum";
kjv[24] = "And lo Zadok also, and all the Levites [were] with him, bearing the ark of the covenant of God: and they set down the ark of God; and Abiathar went up, until all the people had done passing out of the city.";
rsv[24] = "And Abi\'athar came up, and lo, Zadok came also, with all the Levites, bearing the ark of the covenant of God; and they set down the ark of God, until the people had all passed out of the city.";
asv[24] = "And, lo, Zadok also [came], and all the Levites with him, bearing the ark of the covenant of God; and they set down the ark of God; and Abiathar went up, until all the people had done passing out of the city.";
yng[24] = "and lo, also Zadok, and all the Levites with him, bearing the ark of the covenant of God, and they make the ark of God firm, and Abiathar goeth up, till the completion of all the people to pass over out of the city.";
dby[24] = "And behold, Zadok also, and all the Levites with him, bearing the ark of the covenant of God; and they set down the ark of God; and Abiathar went up, until all the people had passed completely out of the city.";
web[24] = "And lo, Zadok also, and all the Levites [were] with him bearing the ark of the covenant of God: and they set down the ark of God; and Abiathar went up, until all the people had done passing out of the city.";
hnv[24] = "Behold, Tzadok also [came], and all the Levites with him, bearing the ark of the covenant of God; and they set down the ark of God; and Avyatar went up, until all the people had done passing out of the city.";
vul[24] = "venit autem et Sadoc et universi Levitae cum eo portantes arcam foederis Dei et deposuerunt arcam Dei et ascendit Abiathar donec expletus est omnis populus qui egressus fuerat de civitate";
kjv[25] = "And the king said unto Zadok, Carry back the ark of God into the city: if I shall find favour in the eyes of the LORD, he will bring me again, and shew me [both] it, and his habitation:";
rsv[25] = "Then the king said to Zadok, &quot;Carry the ark of God back into the city. If I find favor in the eyes of the LORD, he will bring me back and let me see both it and his habitation;";
asv[25] = "And the king said unto Zadok, Carry back the ark of God into the city: if I shall find favor in the eyes of Jehovah, he will bring me again, and show me both it, and his habitation:";
yng[25] = "And the king saith to Zadok, `Take back the ark of God to the city; if I find grace in the eyes of Jehovah, then He hath brought me back, and shewn me it and His habitation;";
dby[25] = "And the king said to Zadok, Carry back the ark of God into the city. If I shall find favour in the eyes of Jehovah, he will bring me again, and shew me it, and its habitation.";
web[25] = "And the king said to Zadok, Carry back the ark of God into the city: if I shall find favor in the eyes of the LORD, he will bring me again, and show me [both] it, and his habitation:";
hnv[25] = "The king said to Tzadok, Carry back the ark of God into the city: if I shall find favor in the eyes of the LORD, he will bring me again, and show me both it, and his habitation:";
vul[25] = "et dixit rex ad Sadoc reporta arcam Dei in urbem si invenero gratiam in oculis Domini reducet me et ostendet mihi eam et tabernaculum suum";
kjv[26] = "But if he thus say, I have no delight in thee; behold, [here am] I, let him do to me as seemeth good unto him.";
rsv[26] = "but if he says, \'I have no pleasure in you,\' behold, here I am, let him do to me what seems good to him.&quot;";
asv[26] = "but if he say thus, I have no delight in thee; behold, here am I, let him do to me as seemeth good unto him.";
yng[26] = "and if thus He say, I have not delighted in thee; here [am] I, He doth to me as [is] good in His eyes.\'";
dby[26] = "But if he thus say, I have no delight in thee; behold, [here am] I, let him do to me as seemeth good to him.";
web[26] = "But if he shall thus say, I have no delight in thee; behold, [here am] I, let him do to me as seemeth good to him.";
hnv[26] = "but if he say thus, I have no delight in you; behold, here am I, let him do to me as seems good to him.";
vul[26] = "si autem dixerit non places praesto sum faciat quod bonum est coram se";
kjv[27] = "The king said also unto Zadok the priest, [Art not] thou a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar.";
rsv[27] = "The king also said to Zadok the priest, &quot;Look, go back to the city in peace, you and Abi\'athar, with your two sons, Ahim\'a-az your son, and Jonathan the son of Abi\'athar.";
asv[27] = "The king said also unto Zadok the priest, Art thou [not] a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar.";
yng[27] = "And the king saith unto Zadok the priest, `Art thou a seer? turn back to the city in peace, and Ahimaaz thy son, and Jonathan son of Abiathar, your two sons with you;";
dby[27] = "And the king said to Zadok the priest, Thou art the seer: return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar.";
web[27] = "The king said also to Zadok the priest, [Art not] thou a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar.";
hnv[27] = "The king said also to Tzadok the Kohen, &quot;Aren\'t you a seer? Return into the city in shalom, and your two sons with you, Achima`atz your son, and Yonatan the son of Avyatar.";
vul[27] = "et dixit rex ad Sadoc sacerdotem o videns revertere in civitatem in pace et Achimaas filius tuus et Ionathan filius Abiathar duo filii vestri sint vobiscum";
kjv[28] = "See, I will tarry in the plain of the wilderness, until there come word from you to certify me.";
rsv[28] = "See, I will wait at the fords of the wilderness, until word comes from you to inform me.&quot;";
asv[28] = "See, I will tarry at the fords of the wilderness, until there come word from you to certify me.";
yng[28] = "see ye, I am tarrying in the plains of the wilderness till the coming in of a word from you to declare to me.\'";
dby[28] = "See, I will stop in the plains of the desert, until there come word from you to inform me.";
web[28] = "See, I will tarry in the plain of the wilderness, until word shall come from you to certify me.";
hnv[28] = "Behold, I will stay at the fords of the wilderness, until word comes from you to inform me.&quot;";
vul[28] = "ecce ego abscondar in campestribus deserti donec veniat sermo a vobis indicans mihi";
kjv[29] = "Zadok therefore and Abiathar carried the ark of God again to Jerusalem: and they tarried there.";
rsv[29] = "So Zadok and Abi\'athar carried the ark of God back to Jerusalem; and they remained there.";
asv[29] = "Zadok therefore and Abiathar carried the ark of God again to Jerusalem: and they abode there.";
yng[29] = "And Zadok taketh back -- and Abiathar -- the ark of God to Jerusalem, and they abide there.";
dby[29] = "And Zadok and Abiathar carried the ark of God again to Jerusalem; and they abode there.";
web[29] = "Zadok therefore and Abiathar carried the ark of God again to Jerusalem: and they tarried there.";
hnv[29] = "Tzadok therefore and Avyatar carried the ark of God again to Yerushalayim: and they abode there.";
vul[29] = "reportaverunt igitur Sadoc et Abiathar arcam Dei Hierusalem et manserunt ibi";
kjv[30] = "And David went up by the ascent of [mount] Olivet, and wept as he went up, and had his head covered, and he went barefoot: and all the people that [was] with him covered every man his head, and they went up, weeping as they went up.";
rsv[30] = "But David went up the ascent of the Mount of Olives, weeping as he went, barefoot and with his head covered; and all the people who were with him covered their heads, and they went up, weeping as they went.";
asv[30] = "And David went up by the ascent of the [mount of] Olives, and wept as he went up; and he had his head covered, and went barefoot: and all the people that were with him covered every man his head, and they went up, weeping as they went up.";
yng[30] = "And David is going up in the ascent of the olives, going up and weeping, and he hath the head covered, and he is going barefooted, and all the people who [are] with him have covered each his head, and have gone up, going up and weeping;";
dby[30] = "But David went up by the ascent of the Olives, and wept as he went up, and had his head covered, and he went barefoot; and all the people that was with him covered every man his head, and they went up, weeping as they went up.";
web[30] = "And David went up by the ascent of [mount] Olivet, and wept as he went, and had his head covered, and he went barefoot: and all the people that [were] with him covered every man his head, and they went up, weeping as they went.";
hnv[30] = "David went up by the ascent of the [Mount of] Olives, and wept as he went up; and he had his head covered, and went barefoot: and all the people who were with him covered every man his head, and they went up, weeping as they went up.";
vul[30] = "porro David ascendebat clivum Olivarum scandens et flens operto capite et nudis pedibus incedens sed et omnis populus qui erat cum eo operto capite ascendebat plorans";
kjv[31] = "And [one] told David, saying, Ahithophel [is] among the conspirators with Absalom. And David said, O LORD, I pray thee, turn the counsel of Ahithophel into foolishness.";
rsv[31] = "And it was told David, &quot;Ahith\'ophel is among the conspirators with Ab\'salom.&quot; And David said, &quot;O LORD, I pray thee, turn the counsel of Ahith\'ophel into foolishness.&quot;";
asv[31] = "And one told David, saying, Ahithophel is among the conspirators with Absalom. And David said, O Jehovah, I pray thee, turn the counsel of Ahithophel into foolishness.";
yng[31] = "and David declared, saying, `Ahithophel [is] among the conspirators with Absalom;\' and David saith, `Make foolish, I pray Thee, the counsel of Ahithophel, O Jehovah.\'";
dby[31] = "And one told David saying, Ahithophel is among the conspirators with Absalom. Then said David, Jehovah, I pray thee, turn the counsel of Ahithophel into foolishness.";
web[31] = "And [one] told David, saying, Ahithophel [is] among the conspirators with Absalom. And David said, O LORD, I pray thee, turn the counsel of Ahithophel into foolishness.";
hnv[31] = "One told David, saying, Achitofel is among the conspirators with Avshalom. David said, LORD, please turn the counsel of Achitofel into foolishness.";
vul[31] = "nuntiatum est autem David quod et Ahitofel esset in coniuratione cum Absalom dixitque David infatua quaeso consilium Ahitofel Domine";
kjv[32] = "And it came to pass, that [when] David was come to the top [of the mount], where he worshipped God, behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head:";
rsv[32] = "When David came to the summit, where God was worshiped, behold, Hushai the Archite came to meet him with his coat rent and earth upon his head.";
asv[32] = "And it came to pass, that, when David was come to the top [of the ascent], where God was worshipped, behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head.";
yng[32] = "And it cometh to pass, David hath come unto the top, where he boweth himself to God, and lo, to meet him [is] Hushai the Archite, his coat rent, and earth on his head;";
dby[32] = "And it came to pass, when David had come to the summit, where he worshipped God, that behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head.";
web[32] = "And it came to pass, that [when] David had come to the top [of the mount], where he worshiped God, behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head;";
hnv[32] = "It happened that when David had come to the top [of the ascent], where God was worshiped, behold, Hushai the Arki came to meet him with his coat torn, and dirt on his head.";
vul[32] = "cumque ascenderet David summitatem montis in quo adoraturus erat Dominum ecce occurrit ei Husai Arachites scissa veste et terra pleno capite";
kjv[33] = "Unto whom David said, If thou passest on with me, then thou shalt be a burden unto me:";
rsv[33] = "David said to him, &quot;If you go on with me, you will be a burden to me.";
asv[33] = "And David said unto him, If thou passest on with me, then thou wilt be a burden unto me:";
yng[33] = "and David saith to him, `If thou hast passed on with me then thou hast been on me for a burden,";
dby[33] = "And David said to him, If thou passest on with me, thou wilt be a burden to me;";
web[33] = "To whom David said, If thou shalt pass on with me, then thou wilt be a burden to me:";
hnv[33] = " David said to him, If you pass on with me, then you will be a burden to me:";
vul[33] = "et dixit ei David si veneris mecum eris mihi oneri";
kjv[34] = "But if thou return to the city, and say unto Absalom, I will be thy servant, O king; [as] I [have been] thy father\'s servant hitherto, so [will] I now also [be] thy servant: then mayest thou for me defeat the counsel of Ahithophel.";
rsv[34] = "But if you return to the city, and say to Ab\'salom, \'I will be your servant, O king; as I have been your father\'s servant in time past, so now I will be your servant,\' then you will defeat for me the counsel of Ahith\'ophel.";
asv[34] = "but if thou return to the city, and say unto Absalom, I will be thy servant, O king; as I have been thy father\'s servant in time past, so will I now be thy servant; then wilt thou defeat for me the counsel of Ahithophel.";
yng[34] = "and if to the city thou dost turn back, and hast said to Absalom, Thy servant I am, O king; servant of thy father I [am] also hitherto, and now, I [am] also thy servant; then thou hast made void for me the counsel of Ahithophel;";
dby[34] = "but if thou return to the city, and say to Absalom, I will be thy servant, O king; as I have been thy father\'s servant hitherto, so now will I be thy servant; then mayest thou for me defeat the counsel of Ahithophel.";
web[34] = "But if thou shalt return to the city, and say to Absalom, I will be thy servant, O king; [as] I [have been] thy father\'s servant hitherto, so [will] I now also [be] thy servant: then mayest thou for me defeat the counsel of Ahithophel.";
hnv[34] = "but if you return to the city, and tell Avshalom, I will be your servant, O king; as I have been your father\'s servant in time past, so will I now be your servant; then will you defeat for me the counsel of Achitofel.";
vul[34] = "si autem in civitatem revertaris et dixeris Absalom servus tuus sum rex sicut fui servus patris tui sic ero servus tuus dissipabis consilium Ahitofel";
kjv[35] = "And [hast thou] not there with thee Zadok and Abiathar the priests? therefore it shall be, [that] what thing soever thou shalt hear out of the king\'s house, thou shalt tell [it] to Zadok and Abiathar the priests.";
rsv[35] = "Are not Zadok and Abi\'athar the priests with you there? So whatever you hear from the king\'s house, tell it to Zadok and Abi\'athar the priests.";
asv[35] = "And hast thou not there with thee Zadok and Abiathar the priests? therefore it shall be, that what thing soever thou shalt hear out of the king\'s house, thou shalt tell it to Zadok and Abiathar the priests.";
yng[35] = "and are there not with thee there Zadok and Abiathar the priests? and it hath been, the whole of the matter that thou hearest from the house of the king thou dost declare to Zadok and to Abiathar the priests.";
dby[35] = "And hast thou not there with thee Zadok and Abiathar the priests? and it shall be, [that] whatsoever thing thou shalt hear out of the king\'s house, thou shalt tell it to Zadok and Abiathar the priests.";
