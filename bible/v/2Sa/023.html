csb[1] = "These are the last words of David: The declaration of David son of Jesse, the declaration of the man raised on high, the one anointed by the God of Jacob. This is the most delightful of Israel\'s songs.";
csb[2] = "The Spirit of the LORD spoke through me, his word was on my tongue.";
csb[3] = "The God of Israel spoke; the Rock of Israel said to me, &quot;The one who rules the people with justice, who rules in the fear of God,";
csb[4] = "&quot;is like the morning light when the sun rises on a cloudless morning, the glisten of rain on sprouting grass.&quot;";
csb[5] = "Is it not true my house is with God? For he has established a permanent covenant with me, ordered and secured in every detail. Will he not bring about my whole salvation and my every desire?";
csb[6] = "But all the wicked are like thorns raked aside; they can never be picked up by hand.";
csb[7] = "The man who touches them must be armed with iron and the shaft of a spear. They will be completely burned up on the spot.";
csb[8] = "These are the names of David\'s warriors: Josheb-basshebeth the Tahchemonite was chief of the officers. He wielded his spear against eight hundred men that he killed at one time.";
csb[9] = "After him, Eleazar son of Dodo son of an Ahohite was among the three warriors with David when they defied the Philistines. The men of Israel retreated in the place they had gathered for battle,";
csb[10] = "but Eleazar stood his ground and attacked the Philistines until his hand was tired and stuck to his sword. The LORD brought about a great victory that day. Then the troops came back to him, but only to plunder the dead.";
csb[11] = "After him was Shammah son of Agee the Hararite. The Philistines had assembled in formation where there was a field full of lentils. The troops fled from the Philistines,";
csb[12] = "but Shammah took his stand in the middle of the field, defended it, and struck down the Philistines. So the LORD brought about a great victory.";
csb[13] = "Three of the thirty leading warriors went down at harvest time and came to David at the cave of Adullam, while a company of Philistines was camping in the Valley of Rephaim.";
csb[14] = "At that time David was in the stronghold, and a Philistine garrison was at Bethlehem.";
csb[15] = "David was extremely thirsty and said, &quot;If only someone would bring me water to drink from the well at the city gate of Bethlehem! &quot;";
csb[16] = "So three of the warriors broke through the Philistine camp and drew water from the well at the gate of Bethlehem. They brought it back to David, but he refused to drink it. Instead, he poured it out to the LORD.";
csb[17] = "David said, &quot;LORD, I would never do such a thing! Is this not the blood of men who risked their lives? &quot; So he refused to drink it. Such were the exploits of the three warriors.";
csb[18] = "Abishai, Joab\'s brother and son of Zeruiah, was leader of the Three. He wielded his spear against three hundred men and killed them, gaining a reputation among the Three.";
csb[19] = "Was he not more honored than the Three? He became their commander even though he did not become one of the Three.";
csb[20] = "Benaiah son of Jehoiada was the son of a brave man from Kabzeel, a man of many exploits. Benaiah killed two sons of Ariel of Moab, and he went down into a pit on a snowy day and killed a lion.";
csb[21] = "He also killed an Egyptian, an impressive man. Even though the Egyptian had a spear in his hand, Benaiah went down to him with a club, snatched the spear out of the Egyptian\'s hand, and then killed him with his own spear.";
csb[22] = "These were the exploits of Benaiah son of Jehoiada, who had a reputation among the three warriors.";
csb[23] = "He was the most honored of the Thirty, but he did not become one of the Three. David put him in charge of his bodyguard.";
csb[24] = "Among the Thirty were Joab\'s brother Asahel, Elhanan son of Dodo of Bethlehem,";
csb[25] = "Shammah the Harodite, Elika the Harodite,";
csb[26] = "Helez the Paltite, Ira son of Ikkesh the Tekoite,";
csb[27] = "Abiezer the Anathothite, Mebunnai the Hushathite,";
csb[28] = "Zalmon the Ahohite, Maharai the Netophathite,";
csb[29] = "Heleb son of Baanah the Netophahite, Ittai son of Ribai from Gibeah of the Benjaminites,";
csb[30] = "Benaiah the Pirathonite, Hiddai from the wadis of Gaash,";
csb[31] = "Abi-albon the Arbathite, Azmaveth the Barhumite,";
csb[32] = "Eliahba the Shaalbonite, the sons of Jashen, Jonathan son of";
csb[33] = "Shammah the Hararite, Ahiam son of Sharar the Hararite,";
csb[34] = "Eliphelet son of Ahasbai son of the Maacathite, Eliam son of Ahithophel the Gilonite,";
csb[35] = "Hezro the Carmelite, Paarai the Arbite,";
csb[36] = "Igal son of Nathan from Zobah, Bani the Gadite,";
csb[37] = "Zelek the Ammonite, Naharai the Beerothite, the armor-bearer for Joab son of Zeruiah,";
csb[38] = "Ira the Ithrite, Gareb the Ithrite,";
csb[39] = "and Uriah the Hethite. There were thirty-seven in all.";

kjv[5] = "Although my house [be] not so with God; yet he hath made with me an everlasting covenant, ordered in all [things], and sure: for [this is] all my salvation, and all [my] desire, although he make [it] not to grow.";
rsv[5] = "Yea, does not my house stand so with God? For he has made with me an everlasting covenant, ordered in all things and secure. For will he not cause to prosper all my help and my desire?";
asv[5] = "Verily my house is not so with God; Yet he hath made with me an everlasting covenant, Ordered in all things, and sure: For it is all my salvation, and all [my] desire, Although he maketh it not to grow. ";
yng[5] = "For -- not so [is] my house with God; For -- a covenant age-during He made with me, Arranged in all things, and kept; For -- all my salvation, and all desire, For -- He hath not caused [it] to spring up.";
dby[5] = "Although my house be not so before God, Yet he hath made with me an everlasting covenant, Ordered in every way and sure; For [this is] all my salvation, and every desire, Although he make [it] not to grow.";

hnv[5] = "Most assuredly my house is not so with God; Yet he has made with me an everlasting covenant, Ordered in all things, and sure: For it is all my salvation, and all [my] desire, Although he doesn\'t make it grow.";

dby[16] = "And the three mighty men broke through the camp of the Philistines, and drew water out of the well of Bethlehem, which is in the gate, and took it, and brought it to David; however he would not drink of it, but poured it out to Jehovah.";
web[16] = "And the three mighty men broke through the host of the Philistines, and drew water out of the well of Beth-lehem, that [was] by the gate, and took [it], and brought [it] to David: nevertheless he would not drink of it, but poured it out to the LORD.";
hnv[16] = "The three mighty men broke through the host of the Pelishtim, and drew water out of the well of Beit-Lechem, that was by the gate, and took it, and brought it to David: but he would not drink of it, but poured it out to the LORD.";
vul[16] = "inruperunt ergo tres fortes castra Philisthinorum et hauserunt aquam de cisterna Bethleem quae erat iuxta portam et adtulerunt ad David at ille noluit bibere sed libavit illam Domino";
kjv[17] = "And he said, Be it far from me, O LORD, that I should do this: [is not this] the blood of the men that went in jeopardy of their lives? therefore he would not drink it. These things did these three mighty men.";
rsv[17] = "and said, &quot;Far be it from me, O LORD, that I should do this. Shall I drink the blood of the men who went at the risk of their lives?&quot; Therefore he would not drink it. These things did the three mighty men.";
asv[17] = "And he said, Be it far from me, O Jehovah, that I should do this: [shall I drink] the blood of the men that went in jeopardy of their lives? therefore he would not drink it. These things did the three mighty men.";
yng[17] = "and saith, `Far be it from me, O Jehovah, to do this; is it the blood of the men who are going with their lives?\' and he was not willing to drink it; these [things] did the three mighty ones.";
dby[17] = "And he said, Be it far from me, Jehovah, that I should do this thing! is it not the blood of the men that went at the risk of their lives? Therefore he would not drink it. These things did the three mighty men.";
web[17] = "And he said, Be it far from me, O LORD, that I should do this: [is not this] the blood of the men that went in jeopardy of their lives? therefore he would not drink it. These things did these three mighty men.";
hnv[17] = "He said, Be it far from me, LORD, that I should do this: [shall I drink] the blood of the men who went in jeopardy of their lives? therefore he would not drink it. These things did the three mighty men.";
vul[17] = "dicens propitius mihi sit Dominus ne faciam hoc num sanguinem hominum istorum qui profecti sunt et animarum periculum bibam noluit ergo bibere haec fecerunt tres robustissimi";
kjv[18] = "And Abishai, the brother of Joab, the son of Zeruiah, was chief among three. And he lifted up his spear against three hundred, [and] slew [them], and had the name among three.";
rsv[18] = "Now Abi\'shai, the brother of Jo\'ab, the son of Zeru\'iah, was chief of the thirty. And he wielded his spear against three hundred men and slew them, and won a name beside the three.";
asv[18] = "And Abishai, the brother of Joab, the son of Zeruiah, was chief of the three. And he lifted up his spear against three hundred and slew them, and had a name among the three.";
yng[18] = "And Abishai brother of Joab, son of Zeruiah, he [is] head of three, and he is lifting up his spear against three hundred -- wounded, and he hath a name among three.";
dby[18] = "And Abishai, the brother of Joab, the son of Zeruiah, was the chief of three; and he brandished his spear against three hundred and slew them; and he had a name among the three.";
web[18] = "And Abishai, the brother of Joab, the son of Zeruiah, was chief among three. And he lifted up his spear against three hundred, [and] slew [them], and had the name among three.";
hnv[18] = " Avishai, the brother of Yo\'av, the son of Tzeru\'yah, was chief of the three. He lifted up his spear against three hundred and killed them, and had a name among the three.";
vul[18] = "Abisai quoque frater Ioab filius Sarviae princeps erat de tribus ipse est qui elevavit hastam suam contra trecentos quos interfecit nominatus in tribus";
kjv[19] = "Was he not most honourable of three? therefore he was their captain: howbeit he attained not unto the [first] three.";
rsv[19] = "He was the most renowned of the thirty, and became their commander; but he did not attain to the three.";
asv[19] = "Was he not most honorable of the three? therefore he was made their captain: howbeit he attained not unto the [first] three.";
yng[19] = "Of the three is he not the honoured? and he becometh their head; and unto the [first] three he hath not come.";
dby[19] = "Was he not most honourable of three? and he was their captain; but he did not attain to the [first] three.";

vul[19] = "et inter tres nobilior eratque eorum princeps sed usque ad tres primos non pervenerat";
kjv[20] = "And Benaiah the son of Jehoiada, the son of a valiant man, of Kabzeel, who had done many acts, he slew two lionlike men of Moab: he went down also and slew a lion in the midst of a pit in time of snow:";
rsv[20] = "And Benai\'ah the son of Jehoi\'ada was a valiant man of Kabzeel, a doer of great deeds; he smote two ariels of Moab. He also went down and slew a lion in a pit on a day when snow had fallen.";
asv[20] = "And Benaiah the son of Jehoiada, the son of a valiant man of Kabzeel, who had done mighty deeds, he slew the two [sons of] Ariel of Moab: he went down also and slew a lion in the midst of a pit in time of snow.";
yng[20] = "And Benaiah son of Jehoiada (son of a man of valour, great in deeds from Kabzeel), he hath smitten two lion-like men of Moab, and he hath gone down and smitten the lion in the midst of the pit in a day of snow.";
dby[20] = "And Benaiah the son of Jehoiada, son of a valiant man, great in exploits, of Kabzeel: he it was that smote two lions of Moab; and he went down and smote a lion in the midst of a pit on a snowy day.";
web[20] = "And Benaiah the son of Jehoiada, the son of a valiant man, of Kabzeel, who had done many acts, he slew two lion-like men of Moab: he went down also and slew a lion in the midst of a pit in time of snow:";
hnv[20] = "Benayah the son of Yehoiada, the son of a valiant man of Kavtz\'el, who had done mighty deeds, he killed the two [sons of] Ari\'el of Mo\'av: he went down also and killed a lion in the midst of a pit in time of snow.";
vul[20] = "et Banaias filius Ioiada viri fortissimi magnorum operum de Capsehel ipse percussit duos leones Moab et ipse descendit et percussit leonem in media cisterna diebus nivis";
kjv[21] = "And he slew an Egyptian, a goodly man: and the Egyptian had a spear in his hand; but he went down to him with a staff, and plucked the spear out of the Egyptian\'s hand, and slew him with his own spear.";
rsv[21] = "And he slew an Egyptian, a handsome man. The Egyptian had a spear in his hand; but Benai\'ah went down to him with a staff, and snatched the spear out of the Egyptian\'s hand, and slew him with his own spear.";
asv[21] = "And he slew an Egyptian, a goodly man: and the Egyptian had a spear in his hand; but he went down to him with a staff, and plucked the spear out of the Egyptian\'s hand, and slew him with his own spear.";
yng[21] = "And he hath smitten the Egyptian man, a man of appearance, and in the hand of the Egyptian [is] a spear, and he goeth down unto him with a rod, and taketh violently away the spear out of the hand of the Egyptian, and slayeth him with his own spear.";
dby[21] = "He also smote the Egyptian, an imposing man: and the Egyptian had a spear in his hand; and he went down to him with a staff, and plucked the spear out of the Egyptian\'s hand, and slew him with his own spear.";
web[21] = "And he slew an Egyptian, a goodly man: and the Egyptian had a spear in his hand; but he went down to him with a staff, and plucked the spear out of the Egyptian\'s hand, and slew him with his own spear.";
hnv[21] = "He killed a Mitzrian, a goodly man: and the Mitzrian had a spear in his hand; but he went down to him with a staff, and plucked the spear out of the Mitzrian\'s hand, and killed him with his own spear.";
vul[21] = "ipse quoque interfecit virum aegyptium virum dignum spectaculo habentem in manu hastam itaque cum descendisset ad eum in virga vi extorsit hastam de manu Aegyptii et interfecit eum hasta sua";
