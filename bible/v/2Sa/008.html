csb[1] = "After this, David defeated the Philistines, subdued them, and took Metheg-ammah from Philistine control.";
csb[2] = "He also defeated the Moabites, and after making them lie down on the ground, he measured them off with a cord. He measured every two cord lengths of those to be put to death and one full length of those to be kept alive. So the Moabites became David\'s subjects and brought tribute.";
csb[3] = "David also defeated Hadadezer son of Rehob, king of Zobah, when he went to restore his control at the Euphrates River.";
csb[4] = "David captured seventeen hundred horsemen and twenty thousand foot soldiers from him, and he hamstrung all the horses and kept a hundred chariots.";
csb[5] = "When the Arameans of Damascus came to assist King Hadadezer of Zobah, David struck down twenty-two thousand Aramean men.";
csb[6] = "Then he placed garrisons in Aram of Damascus, and the Arameans became David\'s subjects and brought tribute. The LORD made David victorious wherever he went.";
csb[7] = "David took the gold shields of Hadadezer\'s officers and brought them to Jerusalem.";
csb[8] = "King David also took huge quantities of bronze from Betah and Berothai, Hadadezer\'s cities.";
csb[9] = "When King Toi of Hamath heard that David had defeated the entire army of Hadadezer,";
csb[10] = "he sent his son Joram to King David to greet him and to congratulate him because David had fought against Hadadezer and defeated him, for Toi and Hadadezer had fought many wars. Joram had items of silver, gold, and bronze with him.";
csb[11] = "King David also dedicated these to the LORD, along with the silver and gold he had dedicated from all the nations he had subdued --";
csb[12] = "from Edom, Moab, the Ammonites, the Philistines, the Amalekites, and the spoil of Hadadezer son of Rehob, king of Zobah.";
csb[13] = "David made a reputation for himself when he returned from striking down eighteen thousand Edomites in Salt Valley.";
csb[14] = "He placed garrisons throughout Edom, and all the Edomites were subject to David. The LORD made David victorious wherever he went.";
csb[15] = "So David reigned over all Israel, administering justice and righteousness for all his people.";
csb[16] = "Joab son of Zeruiah was over the army; Jehoshaphat son of Ahilud was court historian;";
csb[17] = "Zadok son of Ahitub and Ahimelech son of Abiathar were priests; Seraiah was court secretary;";
csb[18] = "Benaiah son of Jehoiada was over the Cherethites and the Pelethites; and David\'s sons were chief officials.";
kjv[1] = "And after this it came to pass, that David smote the Philistines, and subdued them: and David took Methegammah out of the hand of the Philistines.";
rsv[1] = "After this David defeated the Philistines and subdued them, and David took Meth\'eg-am\'mah out of the hand of the Philistines.";
asv[1] = "And after this it came to pass, that David smote the Philistines, and subdued them: and David took the bridle of the mother city out of the hand of the Philistines.";
yng[1] = "And it cometh to pass afterwards that David smiteth the Philistines, and humbleth them, and David taketh the bridle of the metropolis out of the hand of the Philistines.";
dby[1] = "And after this it came to pass that David smote the Philistines, and subdued them; and David took the power of the capital out of the hand of the Philistines.";
web[1] = "And after this it came to pass, that David smote the Philistines, and subdued them: and David took Metheg-ammah out of the hand of the Philistines.";
hnv[1] = "After this it happened that David struck the Pelishtim, and subdued them: and David took the bridle of the mother city out of the hand of the Pelishtim.";
vul[1] = "factum est autem post haec percussit David Philisthim et humiliavit eos et tulit David frenum tributi de manu Philisthim";
kjv[2] = "And he smote Moab, and measured them with a line, casting them down to the ground; even with two lines measured he to put to death, and with one full line to keep alive. And [so] the Moabites became David\'s servants, [and] brought gifts.";
rsv[2] = "And he defeated Moab, and measured them with a line, making them lie down on the ground; two lines he measured to be put to death, and one full line to be spared. And the Moabites became servants to David and brought tribute.";
asv[2] = "And he smote Moab, and measured them with the line, making them to lie down on the ground; and he measured two lines to put to death, and one full line to keep alive. And the Moabites became servants to David, and brought tribute.";
yng[2] = "And he smiteth Moab, and measureth them with a line, causing them to lie down on the earth, and he measureth two lines to put to death, and the fulness of the line to keep alive, and the Moabites are to David for servants, bearers of a present.";
dby[2] = "And he smote the Moabites, and measured them with a line, making them lie down on the ground; and he measured two lines to put to death, and one full line to keep alive. And the Moabites became David\'s servants, [and] brought gifts.";
web[2] = "And he smote Moab, and measured them with a line, casting them down to the ground; even with two lines he measured to put to death, and with one full line to keep alive. And [so] the Moabites became David\'s servants, [and] brought gifts.";
hnv[2] = "He struck Mo\'av, and measured them with the line, making them to lie down on the ground; and he measured two lines to put to death, and one full line to keep alive. The Mo`avim became servants to David, and brought tribute.";
vul[2] = "et percussit Moab et mensus est eos funiculo coaequans terrae mensus est autem duos funiculos unum ad occidendum et unum ad vivificandum factusque est Moab David serviens sub tributo";
kjv[3] = "David smote also Hadadezer, the son of Rehob, king of Zobah, as he went to recover his border at the river Euphrates.";
rsv[3] = "David also defeated Hadade\'zer the son of Rehob, king of Zobah, as he went to restore his power at the river Euphra\'tes.";
asv[3] = "David smote also Hadadezer the son of Rehob, king of Zobah, as he went to recover his dominion at the River.";
yng[3] = "And David smiteth Hadadezer son of Rehob, king of Zobah, in his going to bring back his power by the River [Euphrates;]";
dby[3] = "And David smote Hadadezer, the son of Rehob, king of Zobah, as he went to recover his dominion by the river Euphrates.";
web[3] = "David smote also Hadadezer, the son of Rehob, king of Zobah, as he went to recover his border at the river Euphrates.";
hnv[3] = "David struck also Hadad`ezer the son of Rechov, king of Tzovah, as he went to recover his dominion at the River.";
vul[3] = "et percussit David Adadezer filium Roob regem Soba quando profectus est ut dominaretur super flumen Eufraten";
kjv[4] = "And David took from him a thousand [chariots], and seven hundred horsemen, and twenty thousand footmen: and David houghed all the chariot [horses], but reserved of them [for] an hundred chariots.";
rsv[4] = "And David took from him a thousand and seven hundred horsemen, and twenty thousand foot soldiers; and David hamstrung all the chariot horses, but left enough for a hundred chariots.";
asv[4] = "And David took from him a thousand and seven hundred horsemen, and twenty thousand footmen: and David hocked all the chariot horses, but reserved of them for a hundred chariots.";
yng[4] = "and David captureth from him a thousand and seven hundred horsemen, and twenty thousand footmen, and David destroyeth utterly the whole of the charioteers, only he leaveth of them a hundred charioteers.";
dby[4] = "And David took from him one thousand seven hundred horsemen, and twenty thousand footmen; and David houghed all the chariot [horses], but reserved of them [for] a hundred chariots.";
web[4] = "And David took from him a thousand [chariots], and seven hundred horsemen, and twenty thousand footmen: and David houghed all the chariot-[horses], but reserved of them [for] a hundred chariots.";
hnv[4] = "David took from him one thousand seven hundred horsemen, and twenty thousand footmen: and David hamstrung all the chariot horses, but reserved of them for one hundred chariots.";
vul[4] = "et captis David ex parte eius mille septingentis equitibus et viginti milibus peditum subnervavit omnes iugales curruum dereliquit autem ex eis centum currus";
kjv[5] = "And when the Syrians of Damascus came to succour Hadadezer king of Zobah, David slew of the Syrians two and twenty thousand men.";
rsv[5] = "And when the Syrians of Damascus came to help Hadade\'zer king of Zobah, David slew twenty-two thousand men of the Syrians.";
asv[5] = "And when the Syrians of Damascus came to succor Hadadezer king of Zobah, David smote of the Syrians two and twenty thousand men.";
yng[5] = "And Aram of Damascus cometh to give help to Hadadezer king of Zobah, and David smiteth of Aram twenty and two thousand men;";
dby[5] = "And the Syrians of Damascus came to help Hadadezer king of Zobah, and David smote of the Syrians twenty-two thousand men.";
web[5] = "And when the Syrians of Damascus came to succor Hadadezer king of Zobah, David slew of the Syrians two and twenty thousand men.";
hnv[5] = "When the Aram of Dammesek came to help Hadad`ezer king of Tzovah, David struck of the Aram two and twenty thousand men.";
vul[5] = "venit quoque Syria Damasci ut praesidium ferret Adadezer regi Soba et percussit David de Syria viginti duo milia virorum";
kjv[6] = "Then David put garrisons in Syria of Damascus: and the Syrians became servants to David, [and] brought gifts. And the LORD preserved David whithersoever he went.";
rsv[6] = "Then David put garrisons in Aram of Damascus; and the Syrians became servants to David and brought tribute. And the LORD gave victory to David wherever he went.";
asv[6] = "Then David put garrisons in Syria of Damascus; and the Syrians became servants to David, and brought tribute. And Jehovah gave victory to David whithersoever he went.";
yng[6] = "and David putteth garrisons in Aram of Damascus, and Aram is to David for a servant, bearing a present; and Jehovah saveth David whithersoever he hath gone;";
dby[6] = "And David put garrisons in Syria of Damascus; and the Syrians became servants to David, [and] brought gifts. And Jehovah preserved David whithersoever he went.";
web[6] = "Then David put garrisons in Syria of Damascus: and the Syrians became servants to David, [and] brought gifts. And the LORD preserved David whithersoever he went.";
hnv[6] = "Then David put garrisons in Aram of Dammesek; and the Aram became servants to David, and brought tribute. The LORD gave victory to David wherever he went.";
vul[6] = "et posuit David praesidium in Syria Damasci factaque est Syria David serviens sub tributo servavit Dominus David in omnibus ad quaecumque profectus est";
kjv[7] = "And David took the shields of gold that were on the servants of Hadadezer, and brought them to Jerusalem.";
rsv[7] = "And David took the shields of gold which were carried by the servants of Hadade\'zer, and brought them to Jerusalem.";
asv[7] = "And David took the shields of gold that were on the servants of Hadadezer, and brought them to Jerusalem.";
yng[7] = "and David taketh the shields of gold which were on the servants of Hadadezer, and bringeth them to Jerusalem;";
dby[7] = "And David took the shields of gold that were on the servants of Hadadezer, and brought them to Jerusalem.";
web[7] = "And David took the shields of gold that were on the servants of Hadadezer, and brought them to Jerusalem.";
hnv[7] = "David took the shields of gold that were on the servants of Hadad`ezer, and brought them to Yerushalayim.";
vul[7] = "et tulit David arma aurea quae habebant servi Adadezer et detulit ea in Hierusalem";
kjv[8] = "And from Betah, and from Berothai, cities of Hadadezer, king David took exceeding much brass.";
rsv[8] = "And from Betah and from Bero\'thai, cities of Hadade\'zer, King David took very much bronze.";
asv[8] = "And from Betah and from Berothai, cities of Hadadezer, king David took exceeding much brass.";
yng[8] = "and from Betah, and from Berothai, cities of Hadadezer, hath king David taken very much brass.";
dby[8] = "And from Betah, and from Berothai, cities of Hadadezer, king David took exceeding much bronze.";
web[8] = "And from Betah, and from Berothai, cities of Hadadezer, king David took very much brass.";
hnv[8] = "From Betach and from Berotai, cities of Hadad`ezer, king David took exceeding much brass.";
vul[8] = "et de Bete et de Beroth civitatibus Adadezer tulit rex David aes multum nimis";
kjv[9] = "When Toi king of Hamath heard that David had smitten all the host of Hadadezer,";
rsv[9] = "When To\'i king of Hamath heard that David had defeated the whole army of Hadade\'zer,";
asv[9] = "And when Toi king of Hamath heard that David had smitten all the host of Hadadezer,";
yng[9] = "And Toi king of Hamath heareth that David hath smitten all the force of Hadadezer,";
dby[9] = "And Toi king of Hamath heard that David had smitten all the forces of Hadadezer;";

vul[9] = "audivit autem Thou rex Emath quod percussisset David omne robur Adadezer";
kjv[10] = "Then Toi sent Joram his son unto king David, to salute him, and to bless him, because he had fought against Hadadezer, and smitten him: for Hadadezer had wars with Toi. And [Joram] brought with him vessels of silver, and vessels of gold, and vessels of brass:";
rsv[10] = "To\'i sent his son Joram to King David, to greet him, and to congratulate him because he had fought against Hadade\'zer and defeated him; for Hadade\'zer had often been at war with To\'i. And Joram brought with him articles of silver, of gold, and of bronze;";
asv[10] = "then Toi sent Joram his son unto king David, to salute him, and to bless him, because he had fought against Hadadezer and smitten him: for Hadadezer had wars with Toi. And [Joram] brought with him vessels of silver, and vessels of gold, and vessels of brass:";
yng[10] = "and Toi sendeth Joram his son unto king David to ask of him of welfare, and to bless him, (because that he hath fought against Hadadezer, and smiteth him, for a man of wars [with] Toi had Hadadezer been), and in his hand have been vessels of silver, and vessels of gold, and vessels of brass,";
dby[10] = "and Toi sent Joram his son to king David, to inquire of his welfare, and to congratulate him, because he had fought against Hadadezer and smitten him; for Hadadezer was continually at war with Toi. And he brought with him vessels of silver, and vessels of gold, and vessels of bronze.";
web[10] = "Then Toi sent Joram his son to king David, to salute him, and to bless him, because he had fought against Hadadezer, and smitten him: (for Hadadezer had wars with Toi) and [Joram] brought with him vessels of silver, and vessels of gold, and vessels of brass:";
hnv[10] = "then To`i sent Yoram his son to king David, to Greet him, and to bless him, because he had fought against Hadad`ezer and struck him: for Hadad`ezer had wars with To`i. [Yoram] brought with him vessels of silver, and vessels of gold, and vessels of brass:";
vul[10] = "et misit Thou Ioram filium suum ad regem David ut salutaret eum congratulans et gratias ageret eo quod expugnasset Adadezer et percussisset eum hostis quippe erat Thou Adadezer et in manu eius erant vasa argentea et vasa aurea et vasa aerea";
kjv[11] = "Which also king David did dedicate unto the LORD, with the silver and gold that he had dedicated of all nations which he subdued;";
rsv[11] = "these also King David dedicated to the LORD, together with the silver and gold which he dedicated from all the nations he subdued,";
asv[11] = "These also did king David dedicate unto Jehovah, with the silver and gold that he dedicated of all the nations which he subdued;";
yng[11] = "also them did king David sanctify to Jehovah, with the silver and the gold which he sanctified of all the nations which he subdued:";
dby[11] = "Them also king David dedicated to Jehovah, with the silver and the gold that he had dedicated of all the nations that he had subdued:";
web[11] = "Which also king David dedicated to the LORD, with the silver and gold that he had dedicated of all nations which he subdued;";
hnv[11] = "These also did king David dedicate to the LORD, with the silver and gold that he dedicated of all the nations which he subdued;";
vul[11] = "quae et ipsa sanctificavit rex David Domino cum argento et auro quae sanctificaverat de universis gentibus quas subegerat";

kjv[13] = "And David gat [him] a name when he returned from smiting of the Syrians in the valley of salt, [being] eighteen thousand [men].";
rsv[13] = "And David won a name for himself. When he returned, he slew eighteen thousand E\'domites in the Valley of Salt.";

yng[13] = "And David maketh a name in his turning back from his smiting Aram in the valley of Salt -- eighteen thousand;";
dby[13] = "And David made him a name when he returned, after he had smitten the Syrians in the valley of salt, eighteen thousand [men].";
