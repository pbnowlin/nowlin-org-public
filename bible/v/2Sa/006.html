csb[1] = "David again assembled all the fit young men in Israel: thirty thousand.";
csb[2] = "He and all his troops set out to bring the ark of God from Baale-judah. The ark bears the Name, the name of the LORD of Armies who is enthroned between the cherubim.";
csb[3] = "They set the ark of God on a new cart and transported it from Abinadab\'s house, which was on the hill. Uzzah and Ahio, sons of Abinadab, were guiding the cart";
csb[4] = "and brought it with the ark of God from Abinadab\'s house on the hill. Ahio walked in front of the ark.";
csb[5] = "David and the whole house of Israel were dancing before the LORD with all kinds of fir wood instruments, lyres, harps, tambourines, sistrums, and cymbals.";
csb[6] = "When they came to Nacon\'s threshing floor, Uzzah reached out to the ark of God and took hold of it because the oxen had stumbled.";
csb[7] = "Then the LORD\'s anger burned against Uzzah, and God struck him dead on the spot for his irreverence, and he died there next to the ark of God.";
csb[8] = "David was angry because of the LORD\'s outburst against Uzzah, so he named that place Outburst Against Uzzah, as it is today.";
csb[9] = "David feared the LORD that day and said, &quot;How can the ark of the LORD ever come to me? &quot;";
csb[10] = "So he was not willing to bring the ark of the LORD to the city of David; instead, he diverted it to the house of Obed-edom of Gath.";
csb[11] = "The ark of the LORD remained in his house three months, and the LORD blessed Obed-edom and his whole family.";
csb[12] = "It was reported to King David: &quot;The LORD has blessed Obed-edom\'s family and all that belongs to him because of the ark of God.&quot; So David went and had the ark of God brought up from Obed-edom\'s house to the city of David with rejoicing.";
csb[13] = "When those carrying the ark of the LORD advanced six steps, he sacrificed an ox and a fattened calf.";
csb[14] = "David was dancing with all his might before the LORD wearing a linen ephod.";
csb[15] = "He and the whole house of Israel were bringing up the ark of the LORD with shouts and the sound of the ram\'s horn.";
csb[16] = "As the ark of the LORD was entering the city of David, Saul\'s daughter Michal looked down from the window and saw King David leaping and dancing before the LORD, and she despised him in her heart.";
csb[17] = "They brought the ark of the LORD and set it in its place inside the tent David had pitched for it. Then David offered burnt offerings and fellowship offerings in the LORD\'s presence.";
csb[18] = "When David had finished offering the burnt offering and the fellowship offerings, he blessed the people in the name of the LORD of Armies.";
csb[19] = "Then he distributed a loaf of bread, a date cake, and a raisin cake to each one in the entire Israelite community, both men and women. Then all the people went home.";
csb[20] = "When David returned home to bless his household, Saul\'s daughter Michal came out to meet him. &quot;How the king of Israel honored himself today! &quot; she said. &quot;He exposed himself today in the sight of the slave girls of his subjects like a vulgar person would expose himself.&quot;";
csb[21] = "David replied to Michal, &quot;It was before the LORD who chose me over your father and his whole family to appoint me ruler over the LORD\'s people Israel. I will dance before the LORD,";
csb[22] = "&quot;and I will dishonor myself and humble myself even more. However, by the slave girls you spoke about, I will be honored.&quot;";
csb[23] = "And Saul\'s daughter Michal had no child to the day of her death.";

web[18] = "And as soon as David had made an end of offering burnt-offerings and peace-offerings, he blessed the people in the name of the LORD of hosts.";
hnv[18] = "When David had made an end of offering the burnt offering and the peace-offerings, he blessed the people in the name of the LORD of Hosts.";
vul[18] = "cumque conplesset offerens holocaustum et pacifica benedixit populo in nomine Domini exercituum";
kjv[19] = "And he dealt among all the people, [even] among the whole multitude of Israel, as well to the women as men, to every one a cake of bread, and a good piece [of flesh], and a flagon [of wine]. So all the people departed every one to his house.";
rsv[19] = "and distributed among all the people, the whole multitude of Israel, both men and women, to each a cake of bread, a portion of meat, and a cake of raisins. Then all the people departed, each to his house.";
asv[19] = "And he dealt among all the people, even among the whole multitude of Israel, both to men and women, to every one a cake of bread, and a portion [of flesh], and a cake of raisins. So all the people departed every one to his house.";
yng[19] = "and he apportioneth to all the people, to all the multitude of Israel, from man even unto woman, to each, one cake of bread, and one eshpar, and one ashisha, and all the people go, each to his house.";
dby[19] = "And he dealt to all the people, to the whole multitude of Israel, both men and women, to every one a cake of bread, and a measure [of wine], and a raisin-cake. And all the people departed every one to his house.";
web[19] = "And he dealt among all the people, [even] among the whole multitude of Israel, as well to the women as men, to every one a cake of bread, and a good piece [of flesh], and a flagon [of wine]. So all the people departed every one to his house.";
hnv[19] = "He dealt among all the people, even among the whole multitude of Yisra\'el, both to men and women, to everyone a cake of bread, and a portion [of flesh], and a cake of raisins. So all the people departed everyone to his house.";
vul[19] = "et partitus est multitudini universae Israhel tam viro quam mulieri singulis collyridam panis unam et assaturam bubulae carnis unam et similam frixam oleo et abiit omnis populus unusquisque in domum suam";
kjv[20] = "Then David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How glorious was the king of Israel to day, who uncovered himself to day in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovereth himself!";
rsv[20] = "And David returned to bless his household. But Michal the daughter of Saul came out to meet David, and said, &quot;How the king of Israel honored himself today, uncovering himself today before the eyes of his servants\' maids, as one of the vulgar fellows shamelessly uncovers himself!&quot;";
asv[20] = "Then David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How glorious was the king of Israel to-day, who uncovered himself to-day in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovereth himself!";
yng[20] = "And David turneth back to bless his house, and Michal daughter of Saul goeth out to meet David, and saith, `How honourable to-day was the king of Israel, who was uncovered to-day before the eyes of the handmaids of his servants, as one of the vain ones is openly uncovered!\'";
dby[20] = "And David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How honourable did the king of Israel make himself to-day, who uncovered himself to-day in the eyes of the handmaids of his servants, as one of the lewd fellows shamelessly uncovers himself!";
web[20] = "Then David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How glorious was the king of Israel to-day, who uncovered himself to-day in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovereth himself!";
hnv[20] = "Then David returned to bless his household. Mikhal the daughter of Sha\'ul came out to meet David, and said, How glorious was the king of Yisra\'el today, who uncovered himself today in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovers himself!";
vul[20] = "reversusque est et David ut benediceret domui suae et egressa Michol filia Saul in occursum David ait quam gloriosus fuit hodie rex Israhel discoperiens se ante ancillas servorum suorum et nudatus est quasi si nudetur unus de scurris";
kjv[21] = "And David said unto Michal, [It was] before the LORD, which chose me before thy father, and before all his house, to appoint me ruler over the people of the LORD, over Israel: therefore will I play before the LORD.";
rsv[21] = "And David said to Michal, &quot;It was before the LORD, who chose me above your father, and above all his house, to appoint me as prince over Israel, the people of the LORD--and I will make merry before the LORD.";
asv[21] = "And David said unto Michal, [It was] before Jehovah, who chose me above thy father, and above all his house, to appoint me prince over the people of Jehovah, over Israel: therefore will I play before Jehovah.";
yng[21] = "And David saith unto Michal, `-- Before Jehovah, who fixed on me above thy father, and above all his house, to appoint me leader over the people of Jehovah, and over Israel, -- yea, I played before Jehovah;";
dby[21] = "And David said to Michal, It was before Jehovah, who chose me rather than thy father, and than all his house, to appoint me ruler over the people of Jehovah, over Israel; and I played before Jehovah.";
web[21] = "And David said to Michal, [It was] before the LORD, who chose me before thy father, and before all his house, to appoint me ruler over the people of the LORD, over Israel: therefore will I play before the LORD.";
hnv[21] = "David said to Mikhal, [It was] before the LORD, who chose me above your father, and above all his house, to appoint me prince over the people of the LORD, over Yisra\'el: therefore will I play before the LORD.";
vul[21] = "dixitque David ad Michol ante Dominum qui elegit me potius quam patrem tuum et quam omnem domum eius et praecepit mihi ut essem dux super populum Domini Israhel";
kjv[22] = "And I will yet be more vile than thus, and will be base in mine own sight: and of the maidservants which thou hast spoken of, of them shall I be had in honour.";
rsv[22] = "I will make myself yet more contemptible than this, and I will be abased in your eyes; but by the maids of whom you have spoken, by them I shall be held in honor.&quot;";
asv[22] = "And I will be yet more vile than this, and will be base in mine own sight: but of the handmaids of whom thou hast spoken, of them shall I be had in honor.";
yng[22] = "and I have been more vile than this, and have been low in mine eyes, and with the handmaids whom thou hast spoken of, with them I am honoured.\'";
dby[22] = "And I will make myself yet more vile than thus, and will be base in mine own sight; and of the handmaids that thou hast spoken of, of them shall I be had in honour.";
web[22] = "And I shall yet be more vile than thus, and shall be base in my own sight: and by the maid-servants which thou hast spoken of, by them shall I be had in honor.";
hnv[22] = "I will be yet more vile than this, and will be base in my own sight: but of the handmaids of whom you have spoken, they shall honor me.";
vul[22] = "et ludam et vilior fiam plus quam factus sum et ero humilis in oculis meis et cum ancillis de quibus locuta es gloriosior apparebo";
kjv[23] = "Therefore Michal the daughter of Saul had no child unto the day of her death.";
rsv[23] = "And Michal the daughter of Saul had no child to the day of her death.";
asv[23] = "And Michal the daughter of Saul had no child unto the day of her death.";
yng[23] = "As to Michal daughter of Saul, she had no child till the day of her death.";
dby[23] = "And Michal the daughter of Saul had no child to the day of her death.";
web[23] = "Therefore Michal the daughter of Saul had no child until the day of her death.";
hnv[23] = "Mikhal the daughter of Sha\'ul had no child to the day of her death.";
vul[23] = "igitur Michol filiae Saul non est natus filius usque ad diem mortis suae";
