csb[1] = "Now a wicked man, a Benjaminite named Sheba son of Bichri, happened to be there. He blew the ram\'s horn and shouted: We have no portion in David, no inheritance in Jesse\'s son. Each man to his tent, Israel!";
csb[2] = "So all the men of Israel deserted David and followed Sheba son of Bichri, but the men of Judah from the Jordan all the way to Jerusalem remained loyal to their king.";
csb[3] = "When David came to his palace in Jerusalem, he took the ten concubines he had left to take care of the palace and placed them under guard. He provided for them, but he was not intimate with them. They were confined until the day of their death, living as widows.";
csb[4] = "The king said to Amasa, &quot;Summon the men of Judah to me within three days and be here yourself.&quot;";
csb[5] = "Amasa went to summon Judah, but he took longer than the time allotted him.";
csb[6] = "So David said to Abishai, &quot;Sheba son of Bichri will do more harm to us than Absalom. Take your lord\'s soldiers and pursue him, or he will find fortified cities and elude us.&quot;";
csb[7] = "So Joab\'s men, the Cherethites, the Pelethites, and all the warriors marched out under Abishai\'s command; they left Jerusalem to pursue Sheba son of Bichri.";
csb[8] = "They were at the great stone in Gibeon when Amasa joined them. Joab was wearing his uniform and over it was a belt around his waist with a sword in its sheath. As he approached, the sword fell out.";
csb[9] = "Joab asked Amasa, &quot;Are you well, my brother? &quot; Then with his right hand Joab grabbed Amasa by the beard to kiss him.";
csb[10] = "Amasa was not on guard against the sword in Joab\'s hand, and Joab stabbed him in the stomach with it and spilled his intestines out on the ground. Joab did not stab him again, and Amasa died. Joab and his brother Abishai pursued Sheba son of Bichri.";
csb[11] = "One of Joab\'s young men had stood over Amasa saying, &quot;Whoever favors Joab and whoever is for David, follow Joab! &quot;";
csb[12] = "Now Amasa had been writhing in his blood in the middle of the highway, and the man had seen that all the troops stopped. So he moved Amasa from the highway to the field and threw a garment over him because he realized that all those who encountered Amasa were stopping.";
csb[13] = "When he was removed from the highway, all the men passed by and followed Joab to pursue Sheba son of Bichri.";
csb[14] = "Sheba passed through all the tribes of Israel to Abel of Beth-maacah. All the Berites came together and followed him.";
csb[15] = "Joab\'s troops came and besieged Sheba in Abel of Beth-maacah. They built a siege ramp against the outer wall of the city. While all the troops with Joab were battering the wall to make it collapse,";
csb[16] = "a wise woman called out from the city, &quot;Listen! Listen! Please tell Joab to come here and let me speak with him.&quot;";
csb[17] = "When he had come near her, the woman asked, &quot;Are you Joab? &quot; &quot;I am,&quot; he replied. &quot;Listen to the words of your servant,&quot; she said to him. He answered, &quot;I\'m listening.&quot;";
csb[18] = "She said, &quot;In the past they used to say, \'Seek counsel in Abel,\' and that\'s how they settled disputes.";
csb[19] = "&quot;I am one of the peaceful and faithful in Israel, but you\'re trying to destroy a city that is like a mother in Israel. Why would you devour the LORD\'s inheritance? &quot;";
csb[20] = "Joab protested: &quot;Never! I would never devour or demolish!";
csb[21] = "&quot;That is not the case. There is a man named Sheba son of Bichri, from the hill country of Ephraim, who has rebelled against King David. Deliver this one man, and I will withdraw from the city.&quot; The woman replied to Joab, &quot;Watch! His head will be thrown over the wall to you.&quot;";
csb[22] = "The woman went to all the people with her wise counsel, and they cut off the head of Sheba son of Bichri and threw it to Joab. So he blew the ram\'s horn, and they dispersed from the city, each to his own tent. Joab returned to the king in Jerusalem.";
csb[23] = "Joab commanded the whole army of Israel; Benaiah son of Jehoiada was over the Cherethites and Pelethites;";
csb[24] = "Adoram was over forced labor; Jehoshaphat son of Ahilud was court historian;";
csb[25] = "Sheva was court secretary; Zadok and Abiathar were priests;";
csb[26] = "and in addition, Ira the Jairite was David\'s priest.";
kjv[1] = "And there happened to be there a man of Belial, whose name [was] Sheba, the son of Bichri, a Benjamite: and he blew a trumpet, and said, We have no part in David, neither have we inheritance in the son of Jesse: every man to his tents, O Israel.";
rsv[1] = "Now there happened to be there a worthless fellow, whose name was Sheba, the son of Bichri, a Benjaminite; and he blew the trumpet, and said, &quot;We have no portion in David, and we have no inheritance in the son of Jesse; every man to his tents, O Israel!&quot;";
asv[1] = "And there happened to be there a base fellow, whose name was Sheba, the son of Bichri, a Benjamite: and he blew the trumpet, and said, We have no portion in David, neither have we inheritance in the son of Jesse: every man to his tents, O Israel.";
yng[1] = "And there hath been called there a man of worthlessness, and his name [is] Sheba, son of Bichri, a Benjamite, and he bloweth with a trumpet, and saith, `We have no portion in David, and we have no inheritance in the son of Jesse; each to his tents, O Israel.\'";
dby[1] = "And there happened to be there a man of Belial, whose name was Sheba, the son of Bichri, a Benjaminite; and he blew a trumpet, and said, We have no portion in David, neither have we inheritance in the son of Jesse: every man to his tents, Israel.";
web[1] = "And there happened to be there a man of Belial, whose name [was] Sheba, the son of Bichri, a Benjaminite: and he blew a trumpet, and said, We have no part in David, neither have we inheritance in the son of Jesse: every man to his tents, O Israel.";
hnv[1] = "There happened to be there a base fellow, whose name was Sheva, the son of Bikhri, a Binyamini: and he blew the shofar, and said, We have no portion in David, neither have we inheritance in the son of Yishai: every man to his tents, Yisra\'el.";
vul[1] = "accidit quoque ut ibi esset vir Belial nomine Seba filius Bochri vir iemineus et cecinit bucina et ait non est nobis pars in David neque hereditas in filio Isai vir in tabernacula tua Israhel";
kjv[2] = "So every man of Israel went up from after David, [and] followed Sheba the son of Bichri: but the men of Judah clave unto their king, from Jordan even to Jerusalem.";
rsv[2] = "So all the men of Israel withdrew from David, and followed Sheba the son of Bichri; but the men of Judah followed their king steadfastly from the Jordan to Jerusalem.";
asv[2] = "So all the men of Israel went up from following David, and followed Sheba the son of Bichri; but the men of Judah clave unto their king, from the Jordan even to Jerusalem.";
yng[2] = "And every man of Israel goeth up from after David, after Sheba son of Bichri, and the men of Judah have cleaved to their king, from the Jordan even unto Jerusalem.";
dby[2] = "Then all the men of Israel went up from after David, following Sheba the son of Bichri. But the men of Judah clave to their king, from the Jordan even to Jerusalem.";
web[2] = "So every man of Israel, withdrawing from David, followed Sheba the son of Bichri: but the men of Judah adhered to their king, from Jordan even to Jerusalem.";
hnv[2] = "So all the men of Yisra\'el went up from following David, and followed Sheva the son of Bikhri; but the men of Yehudah joined with their king, from the Yarden even to Yerushalayim.";
vul[2] = "et separatus est omnis Israhel a David secutusque est Seba filium Bochri viri autem Iuda adheserunt regi suo a Iordane usque Hierusalem";
kjv[3] = "And David came to his house at Jerusalem; and the king took the ten women [his] concubines, whom he had left to keep the house, and put them in ward, and fed them, but went not in unto them. So they were shut up unto the day of their death, living in widowhood.";
rsv[3] = "And David came to his house at Jerusalem; and the king took the ten concubines whom he had left to care for the house, and put them in a house under guard, and provided for them, but did not go in to them. So they were shut up until the day of their death, living as if in widowhood.";
asv[3] = "And David came to his house at Jerusalem; and the king took the ten women his concubines, whom he had left to keep the house, and put them in ward, and provided them with sustenance, but went not in unto them. So they were shut up unto the day of their death, living in widowhood.";
yng[3] = "And David cometh in unto his house at Jerusalem, and the king taketh the ten women-concubines -- whom he had left to keep the house, and putteth them in a house of ward, and sustaineth them, and unto them he hath not gone in, and they are shut up unto the day of their death, in widowhood living.";
dby[3] = "And David came to his house at Jerusalem; and the king took the ten women, concubines, whom he had left to keep the house, and put them in a house of confinement and maintained them, but did not go in to them. So they were shut up unto the day of their death, living in widowhood.";
web[3] = "And David came to his house at Jerusalem; and the king took the ten women [his] concubines, whom he had left to keep the house, and put them in custody, and fed them, but went not in to them. So they were shut up to the day of their death, living in widowhood.";
hnv[3] = "David came to his house at Yerushalayim; and the king took the ten women his concubines, whom he had left to keep the house, and put them in custody, and provided them with sustenance, but didn\'t go in to them. So they were shut up to the day of their death, living in widowhood.";
vul[3] = "cumque venisset rex in domum suam Hierusalem tulit decem mulieres concubinas quas dereliquerat ad custodiendam domum et tradidit eas in custodiam alimenta eis praebens et non est ingressus ad eas sed erant clausae usque ad diem mortis suae in viduitate viventes";
kjv[4] = "Then said the king to Amasa, Assemble me the men of Judah within three days, and be thou here present.";
rsv[4] = "Then the king said to Ama\'sa, &quot;Call the men of Judah together to me within three days, and be here yourself.&quot;";
asv[4] = "Then said the king to Amasa, Call me the men of Judah together within three days, and be thou here present.";
yng[4] = "And the king saith unto Amasa, `Call for me the men of Judah [in] three days, and thou, stand here,\'";
dby[4] = "And the king said to Amasa, Call me the men of Judah together within three days, and do thou attend here.";
web[4] = "Then said the king to Amasa, Assemble to me the men of Judah within three days, and be thou here present.";
hnv[4] = "Then said the king to `Amasa, Call me the men of Yehudah together within three days, and be here present.";
vul[4] = "dixit autem rex Amasae convoca mihi omnes viros Iuda in diem tertium et tu adesto praesens";
kjv[5] = "So Amasa went to assemble [the men of] Judah: but he tarried longer than the set time which he had appointed him.";
rsv[5] = "So Ama\'sa went to summon Judah; but he delayed beyond the set time which had been appointed him.";
asv[5] = "So Amasa went to call [the men of] Judah together; but he tarried longer than the set time which he had appointed him.";
yng[5] = "and Amasa goeth to call Judah, and tarrieth beyond the appointed time that he had appointed him;";
dby[5] = "So Amasa went to call together [the men of] Judah; but he delayed longer than the set time which he had appointed him.";
web[5] = "So Amasa went to assemble [the men of] Judah: but he tarried longer than the set time which he had appointed him.";
hnv[5] = "So `Amasa went to call [the men of] Yehudah together; but he stayed longer than the set time which he had appointed him.";
vul[5] = "abiit ergo Amasa ut convocaret Iudam et moratus est extra placitum quod ei constituerat";
kjv[6] = "And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than [did] Absalom: take thou thy lord\'s servants, and pursue after him, lest he get him fenced cities, and escape us.";
rsv[6] = "And David said to Abi\'shai, &quot;Now Sheba the son of Bichri will do us more harm than Ab\'salom; take your lord\'s servants and pursue him, lest he get himself fortified cities, and cause us trouble.&quot;";
asv[6] = "And David said to Abishai, Now will Sheba the son of Bichri do us more harm than did Absalom: take thou thy lord\'s servants, and pursue after him, lest he get him fortified cities, and escape out of our sight.";
yng[6] = "and David saith unto Abishai, `Now doth Sheba son of Bichri do evil to us more than Absalom; thou, take the servants of thy lord, and pursue after him, lest he have found for himself fenced cities, and delivered himself [from] our eye.\'";
dby[6] = "And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than did Absalom. Take thou thy lord\'s servants, and pursue after him, lest he get him fortified cities and escape our sight.";
web[6] = "And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than [did] Absalom: take thou thy lord\'s servants, and pursue him, lest he get for himself fortified cities, and escape us.";
hnv[6] = "David said to Avishai, Now will Sheva the son of Bikhri do us more harm than did Avshalom: take your lord\'s servants, and pursue after him, lest he get him fortified cities, and escape out of our sight.";
vul[6] = "ait autem David ad Abisai nunc magis adflicturus est nos Seba filius Bochri quam Absalom tolle igitur servos domini tui et persequere eum ne forte inveniat civitates munitas et effugiat nos";
kjv[7] = "And there went out after him Joab\'s men, and the Cherethites, and the Pelethites, and all the mighty men: and they went out of Jerusalem, to pursue after Sheba the son of Bichri.";
rsv[7] = "And there went out after Abi\'shai, Jo\'ab and the Cher\'ethites and the Pel\'ethites, and all the mighty men; they went out from Jerusalem to pursue Sheba the son of Bichri.";
asv[7] = "And there went out after him Joab\'s men, and the Cherethites and the Pelethites, and all the mighty men; and they went out of Jerusalem, to pursue after Sheba the son of Bichri.";
yng[7] = "And the men of Joab go out after him, and the Cherethite, and the Pelethite, and all the mighty men, and they go out from Jerusalem to pursue after Sheba son of Bichri;";
dby[7] = "And there went out after him Joab\'s men, and the Cherethites, and the Pelethites, and all the mighty men; and they went out of Jerusalem, to pursue after Sheba the son of Bichri.";
web[7] = "And there went out after him Joab\'s men, and the Cherethites, and the Pelethites, and all the mighty men: and they went out of Jerusalem, to pursue after Sheba the son of Bichri.";
hnv[7] = "There went out after him Yo\'av\'s men, and the Kereti and the Peleti, and all the mighty men; and they went out of Yerushalayim, to pursue after Sheva the son of Bikhri.";
vul[7] = "egressi sunt ergo cum eo viri Ioab Cherethi quoque et Felethi et omnes robusti exierunt de Hierusalem ad persequendum Seba filium Bochri";
kjv[8] = "When they [were] at the great stone which [is] in Gibeon, Amasa went before them. And Joab\'s garment that he had put on was girded unto him, and upon it a girdle [with] a sword fastened upon his loins in the sheath thereof; and as he went forth it fell out.";
rsv[8] = "When they were at the great stone which is in Gibeon, Ama\'sa came to meet them. Now Jo\'ab was wearing a soldier\'s garment, and over it was a girdle with a sword in its sheath fastened upon his loins, and as he went forward it fell out.";
asv[8] = "When they were at the great stone which is in Gibeon, Amasa came to meet them. And Joab was girded with his apparel of war that he had put on, and thereon was a girdle with a sword fastened upon his loins in the sheath thereof; and as he went forth it fell out.";
yng[8] = "they [are] near the great stone that [is] in Gibeon, and Amasa hath gone before them, and Joab [is] girded; his long robe he hath put on him, and upon it a girdle -- a sword [is] fastened upon his loins in its sheath; and he hath gone out, and it falleth.";
dby[8] = "When they were at the great stone which is in Gibeon, Amasa came before them. And Joab was girded with his coat, his dress, and upon it was the girdle of the sword which was fastened on his loins in its sheath; and as he went forth it fell out.";
web[8] = "When they [were] at the great stone which [is] in Gibeon, Amasa went before them. And Joab\'s garment that he had put on was girded to him, and upon it a girdle [with] a sword fastened upon his loins in its sheath; and as he went forth it fell out.";
hnv[8] = "When they were at the great stone which is in Giv`on, `Amasa came to meet them. Yo\'av was girded with his apparel of war that he had put on, and thereon was a sash with a sword fastened on his loins in the sheath of it; and as he went forth it fell out.";
vul[8] = "cumque illi essent iuxta lapidem grandem qui est in Gabaon Amasa veniens occurrit eis porro Ioab vestitus erat tunica stricta ad mensuram habitus sui et desuper accinctus gladio dependente usque ad ilia in vagina qui fabrefactus levi motu egredi poterat et percutere";
kjv[9] = "And Joab said to Amasa, [Art] thou in health, my brother? And Joab took Amasa by the beard with the right hand to kiss him.";
rsv[9] = "And Jo\'ab said to Ama\'sa, &quot;Is it well with you, my brother?&quot; And Jo\'ab took Ama\'sa by the beard with his right hand to kiss him.";
asv[9] = "And Joab said to Amasa, Is it well with thee, my brother? And Joab took Amasa by the beard with his right hand to kiss him.";
yng[9] = "And Joab saith to Amasa, `Art thou [in] peace, my brother?\' and the right hand of Joab layeth hold on the beard of Amasa to give a kiss to him;";
dby[9] = "And Joab said to Amasa, Art thou well, my brother? And Joab took Amasa by the beard with the right hand to kiss him.";
web[9] = "And Joab said to Amasa, [Art] thou in health, my brother? And Joab took Amasa by the beard with the right hand to kiss him.";
hnv[9] = "Yo\'av said to `Amasa, Is it well with you, my brother? Yo\'av took `Amasa by the beard with his right hand to kiss him.";
vul[9] = "dixit itaque Ioab ad Amasa salve mi frater et tenuit manu dextra mentum Amasae quasi osculans eum";
kjv[10] = "But Amasa took no heed to the sword that [was] in Joab\'s hand: so he smote him therewith in the fifth [rib], and shed out his bowels to the ground, and struck him not again; and he died. So Joab and Abishai his brother pursued after Sheba the son of Bichri.";
rsv[10] = "But Ama\'sa did not observe the sword which was in Jo\'ab\'s hand; so Jo\'ab struck him with it in the body, and shed his bowels to the ground, without striking a second blow; and he died. Then Jo\'ab and Abi\'shai his brother pursued Sheba the son of Bichri.";
asv[10] = "But Amasa took no heed to the sword that was in Joab\'s hand: so he smote him therewith in the body, and shed out his bowels to the ground, and struck him not again; and he died. And Joab and Abishai his brother pursued after Sheba the son of Bichri.";
yng[10] = "and Amasa hath not been watchful of the sword that [is] in the hand of Joab, and he smiteth him with it unto the fifth [rib], and sheddeth out his bowels to the earth, and he hath not repeated [it] to him, and he dieth; and Joab and Abishai his brother have pursued after Sheba son of Bichri.";
dby[10] = "And Amasa had taken no notice of the sword that was in Joab\'s hand: so he smote him with it in the belly and shed out his bowels to the ground, and struck him not again; and he died. And Joab and Abishai his brother pursued after Sheba the son of Bichri.";
web[10] = "But Amasa took no heed to the sword that [was] in Joab\'s hand: so he smote him in the fifth [rib], and shed out his bowels to the ground, and struck him not again; and he died. So Joab and Abishai his brother pursued after Sheba the son of Bichri.";
hnv[10] = "But `Amasa took no heed to the sword that was in Yo\'av\'s hand: so he struck him therewith in the body, and shed out his bowels to the ground, and didn\'t strike him again; and he died. Yo\'av and Avishai his brother pursued after Sheva the son of Bikhri.";
vul[10] = "porro Amasa non observavit gladium quem habebat Ioab qui percussit eum in latere et effudit intestina eius in terram nec secundum vulnus adposuit Ioab autem et Abisai frater eius persecuti sunt Seba filium Bochri";
kjv[11] = "And one of Joab\'s men stood by him, and said, He that favoureth Joab, and he that [is] for David, [let him go] after Joab.";
rsv[11] = "And one of Jo\'ab\'s men took his stand by Ama\'sa, and said, &quot;Whoever favors Jo\'ab, and whoever is for David, let him follow Jo\'ab.&quot;";
asv[11] = "And there stood by him one of Joab\'s young men, and said, He that favoreth Joab, and he that is for David, let him follow Joab.";
yng[11] = "And a man hath stood by him, of the young men of Joab, and saith, `He who hath delight in Joab, and he who [is] for David -- after Joab!\'";
dby[11] = "And one of Joab\'s young men stood by [Amasa] and said, He that favours Joab, and he that is for David, let him follow Joab.";
web[11] = "And one of Joab\'s men stood by him, and said, He that favoreth Joab, and he that [is] for David, [let him go] after Joab.";
hnv[11] = " There stood by him one of Yo\'av\'s young men, and said, He who favors Yo\'av, and he who is for David, let him follow Yo\'av.";
vul[11] = "interea quidam viri cum stetissent iuxta cadaver Amasae de sociis Ioab dixerunt ecce qui esse voluit pro Ioab comes David pro Ioab";
kjv[12] = "And Amasa wallowed in blood in the midst of the highway. And when the man saw that all the people stood still, he removed Amasa out of the highway into the field, and cast a cloth upon him, when he saw that every one that came by him stood still.";
rsv[12] = "And Ama\'sa lay wallowing in his blood in the highway. And any one who came by, seeing him, stopped; and when the man saw that all the people stopped, he carried Ama\'sa out of the highway into the field, and threw a garment over him.";
asv[12] = "And Amasa lay wallowing in his blood in the midst of the highway. And when the man saw that all the people stood still, he carried Amasa out of the highway into the field, and cast a garment over him, when he saw that every one that came by him stood still.";
yng[12] = "And Amasa is rolling himself in blood, in the midst of the highway, and the man seeth that all the people have stood still, and he bringeth round Amasa out of the highway to the field, and casteth over him a garment, when he hath seen that every one who hath come by him -- hath stood still.";
dby[12] = "Now Amasa wallowed in blood in the midst of the highway. And when the man saw that all the people stood still, he removed Amasa out of the highway into the field, and cast a cloth upon him, when he saw that every one that came by stood still.";
web[12] = "And Amasa wallowed in blood in the midst of the highway. And when the man saw that all the people stood still, he removed Amasa out of the highway into the field, and cast a cloth upon him, when he saw that every one that came by him stood still.";
hnv[12] = "`Amasa lay wallowing in his blood in the midst of the highway. When the man saw that all the people stood still, he carried `Amasa out of the highway into the field, and cast a garment over him, when he saw that everyone who came by him stood still.";
vul[12] = "Amasa autem conspersus sanguine iacebat in media via vidit hoc quidam vir quod subsisteret omnis populus ad videndum eum et amovit Amasam de via in agrum operuitque eum vestimento ne subsisterent transeuntes propter eum";
kjv[13] = "When he was removed out of the highway, all the people went on after Joab, to pursue after Sheba the son of Bichri.";
rsv[13] = "When he was taken out of the highway, all the people went on after Jo\'ab to pursue Sheba the son of Bichri.";
asv[13] = "When he was removed out of the highway, all the people went on after Joab, to pursue after Sheba the son of Bichri.";
yng[13] = "When he hath been removed out of the highway, every man hath passed on after Joab, to pursue after Sheba son of Bichri.";
dby[13] = "When he was removed out of the highway, all the people went on after Joab, to pursue after Sheba the son of Bichri,";
web[13] = "When he was removed out of the highway, all the people went on after Joab, to pursue after Sheba the son of Bichri.";
hnv[13] = "When he was removed out of the highway, all the people went on after Yo\'av, to pursue after Sheva the son of Bikhri.";
vul[13] = "amoto igitur illo de via transiebat omnis vir sequens Ioab ad persequendum Seba filium Bochri";
kjv[14] = "And he went through all the tribes of Israel unto Abel, and to Bethmaachah, and all the Berites: and they were gathered together, and went also after him.";
rsv[14] = "And Sheba passed through all the tribes of Israel to Abel of Beth-ma\'acah; and all the Bichrites assembled, and followed him in.";
asv[14] = "And he went through all the tribes of Israel unto Abel, and to Beth-maacah, and all the Berites: and they were gathered together, and went also after him.";
yng[14] = "And he passeth over through all the tribes of Israel to Abel, and to Beth-Maachah, and to all the Berites, and they are assembled, and go in also after him,";
dby[14] = "who went through all the tribes of Israel to Abel, and to Beth-Maacah, and all the Berim; and they gathered together, and went also after him.";
web[14] = "And he went through all the tribes of Israel to Abel, and to Beth-maachah, and all the Berites: and they were assembled, and went also after him.";
hnv[14] = "He went through all the tribes of Yisra\'el to Hevel, and to Beit-Ma`akha, and all the Beri`i: and they were gathered together, and went also after him.";
vul[14] = "porro ille transierat per omnes tribus Israhel in Abelam et in Bethmacha omnesque electi congregati fuerant ad eum";
kjv[15] = "And they came and besieged him in Abel of Bethmaachah, and they cast up a bank against the city, and it stood in the trench: and all the people that [were] with Joab battered the wall, to throw it down.";
rsv[15] = "And all the men who were with Jo\'ab came and besieged him in Abel of Beth-ma\'acah; they cast up a mound against the city, and it stood against the rampart; and they were battering the wall, to throw it down.";
asv[15] = "And they came and besieged him in Abel of Beth-maacah, and they cast up a mound against the city, and it stood against the rampart; and all the people that were with Joab battered the wall, to throw it down.";
yng[15] = "and they go in and lay siege against him, in Abel of Beth-Maachah, and cast up a mount against the city, and it standeth in a trench, and all the people who are [are] with Joab are destroying, to cause the wall to fall.";
dby[15] = "And they came and besieged him in Abel-Beth-Maacah, and they cast up a bank against the city, and it was raised in the trench; and all the people that were with Joab sapped the wall, to throw it down.";
web[15] = "And they came and besieged him in Abel of Beth-maachah, and they cast up a bank against the city, and it stood in the trench: and all the people that [were] with Joab battered the wall, to throw it down.";
hnv[15] = "They came and besieged him in Hevel of Beit-Ma`akha, and they cast up a mound against the city, and it stood against the rampart; and all the people who were with Yo\'av battered the wall, to throw it down.";
vul[15] = "venerunt itaque et obpugnabant eum in Abela et in Bethmacha et circumdederunt munitionibus civitatem et obsessa est urbs omnis autem turba quae erat cum Ioab moliebatur destruere muros";
kjv[16] = "Then cried a wise woman out of the city, Hear, hear; say, I pray you, unto Joab, Come near hither, that I may speak with thee.";
rsv[16] = "Then a wise woman called from the city, &quot;Hear! Hear! Tell Jo\'ab, \'Come here, that I may speak to you.\'&quot;";
asv[16] = "Then cried a wise woman out of the city, Hear, hear; say, I pray you, unto Joab, Come near hither, that I may speak with thee.";
yng[16] = "And a wise woman calleth out of the city, `Hear, hear; say, I pray you, unto Joab, Come near hither, and I speak unto thee.\'";
dby[16] = "And a wise woman cried out of the city, Hear, hear: say, I pray you, unto Joab, Come near hither, that I may speak with thee.";
web[16] = "Then cried a wise woman out of the city, Hear, hear; say, I pray you, to Joab, Come near hither, that I may speak with thee.";
hnv[16] = "Then cried a wise woman out of the city, &quot;Hear, hear! Please say to Yo\'av, \'Come near here, that I may speak with you.\'&quot;";
vul[16] = "et exclamavit mulier sapiens de civitate audite audite dicite Ioab adpropinqua huc et loquar tecum";
kjv[17] = "And when he was come near unto her, the woman said, [Art] thou Joab? And he answered, I [am he]. Then she said unto him, Hear the words of thine handmaid. And he answered, I do hear.";
rsv[17] = "And he came near her; and the woman said, &quot;Are you Jo\'ab?&quot; He answered, &quot;I am.&quot; Then she said to him, &quot;Listen to the words of your maidservant.&quot; And he answered, &quot;I am listening.&quot;";
asv[17] = "And he came near unto her; and the woman said, Art thou Joab? And he answered, I am. Then she said unto him, Hear the words of thy handmaid. And he answered, I do hear.";
yng[17] = "And he cometh near unto her, and the woman saith, `Art thou Joab?\' and he saith, `I [am].\' And she saith to him, `Hear the words of thy handmaid;\' and he saith, `I am hearing.\'";
dby[17] = "And he came near to her; and the woman said, Art thou Joab? And he said, I [am he]. And she said to him, Listen to the words of thy handmaid. And he said, I am listening.";
web[17] = "And when he was come near to her, the woman said, [Art] thou Joab? And he answered, I [am he]. Then she said to him, Hear the words of thy handmaid. And he answered, I do hear.";
hnv[17] = "He came near to her; and the woman said, Are you Yo\'av? He answered, I am. Then she said to him, Hear the words of your handmaid. He answered, I do hear.";
vul[17] = "qui cum accessisset ad eam ait illi tu es Ioab et ille respondit ego ad quem sic locuta est audi sermones ancillae tuae qui respondit audio";
kjv[18] = "Then she spake, saying, They were wont to speak in old time, saying, They shall surely ask [counsel] at Abel: and so they ended [the matter].";
rsv[18] = "Then she said, &quot;They were wont to say in old time, \'Let them but ask counsel at Abel\'; and so they settled a matter.";
asv[18] = "Then she spake, saying, They were wont to speak in old time, saying, They shall surely ask [counsel] at Abel: and so they ended [the matter].";
yng[18] = "and she speaketh, saying, `They spake often in former times, saying, Let them diligently ask at Abel, and so they finished.";
dby[18] = "And she spoke saying, They were wont to speak in old time saying, Just inquire in Abel; and so they ended.";
web[18] = "Then she spoke, saying, They were wont to speak in old time, saying, They will surely ask [counsel] at Abel: and so they ended [the matter].";
hnv[18] = " Then she spoke, saying, They were wont to speak in old time, saying, They shall surely ask [counsel] at Hevel: and so they ended [the matter].";
vul[18] = "rursumque illa sermo inquit dicebatur in veteri proverbio qui interrogant interrogent in Abela et sic perficiebant";
kjv[19] = "I [am one of them that are] peaceable [and] faithful in Israel: thou seekest to destroy a city and a mother in Israel: why wilt thou swallow up the inheritance of the LORD?";
rsv[19] = "I am one of those who are peaceable and faithful in Israel; you seek to destroy a city which is a mother in Israel; why will you swallow up the heritage of the LORD?&quot;";
asv[19] = "I am of them that are peaceable and faithful in Israel: thou seekest to destroy a city and a mother in Israel: why wilt thou swallow up the inheritance of Jehovah?";
yng[19] = "I [am] of the peaceable -- faithful ones of Israel; thou art seeking to destroy a city, and a mother in Israel; why dost thou swallow up the inheritance of Jehovah?";
dby[19] = "I am peaceable [and] faithful in Israel: thou seekest to destroy a city and a mother in Israel. Why wilt thou swallow up the inheritance of Jehovah?";
web[19] = "I [am one of them that are] peaceable [and] faithful in Israel: thou seekest to destroy a city and a mother in Israel: why wilt thou swallow up the inheritance of the LORD?";
hnv[19] = "I am of those who are peaceable and faithful in Yisra\'el: you seek to destroy a city and a mother in Yisra\'el: why will you swallow up the inheritance of the LORD?";
vul[19] = "nonne ego sum quae respondeo veritatem Israhel et tu quaeris subruere civitatem et evertere matrem in Israhel quare praecipitas hereditatem Domini";
kjv[20] = "And Joab answered and said, Far be it, far be it from me, that I should swallow up or destroy.";
rsv[20] = "Jo\'ab answered, &quot;Far be it from me, far be it, that I should swallow up or destroy!";
asv[20] = "And Joab answered and said, Far be it, far be it from me, that I should swallow up or destroy.";
yng[20] = "And Joab answereth and saith, `Far be it -- far be it from me; I do not swallow up nor destroy.";
dby[20] = "And Joab answered and said, Far be it, far be it from me, that I should swallow up or destroy.";
web[20] = "And Joab answered and said, Far be it, far be it from me, that I should swallow up or destroy.";
hnv[20] = "Yo\'av answered, Far be it, far be it from me, that I should swallow up or destroy.";
vul[20] = "respondensque Ioab ait absit absit hoc a me non praecipito neque demolior";
kjv[21] = "The matter [is] not so: but a man of mount Ephraim, Sheba the son of Bichri by name, hath lifted up his hand against the king, [even] against David: deliver him only, and I will depart from the city. And the woman said unto Joab, Behold, his head shall be thrown to thee over the wall.";
rsv[21] = "That is not true. But a man of the hill country of E\'phraim, called Sheba the son of Bichri, has lifted up his hand against King David; give up him alone, and I will withdraw from the city.&quot; And the woman said to Jo\'ab, &quot;Behold, his head shall be thrown to you over the wall.&quot;";
asv[21] = "The matter is not so: but a man of the hill-country of Ephraim, Sheba the son of Bichri by name, hath lifted up his hand against the king, even against David; deliver him only, and I will depart from the city. And the woman said unto Joab, Behold, his head shall be thrown to thee over the wall.";
yng[21] = "The matter [is] not so; for a man of the hill-country of Ephraim -- Sheba son of Bichri his name -- hath lifted up his hand against the king, against David; give ye up him by himself, and I go away from the city.\' And the woman saith unto Joab, `Lo, his head is cast unto thee over the wall.\'";
dby[21] = "The matter is not so; but a man of mount Ephraim, Sheba the son of Bichri by name, has lifted up his hand against the king, against David: give up him only, and I will depart from the city. And the woman said to Joab, Behold, his head shall be thrown to thee over the wall.";
web[21] = "The matter [is] not so: but a man of mount Ephraim, Sheba the son of Bichri by name, hath lifted up his hand against the king, [even] against David: deliver him only, and I will depart from the city. And the woman said to Joab, Behold, his head shall be thrown to thee over the wall.";
hnv[21] = " The matter is not so: but a man of the hill-country of Efrayim, Sheva the son of Bikhri by name, has lifted up his hand against the king, even against David; deliver him only, and I will depart from the city. The woman said to Yo\'av, Behold, his head shall be thrown to you over the wall.";
vul[21] = "non se sic habet res sed homo de monte Ephraim Seba filius Bochri cognomine levavit manum contra regem David tradite illum solum et recedemus a civitate et ait mulier ad Ioab ecce caput eius mittetur ad te per murum";
kjv[22] = "Then the woman went unto all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and cast [it] out to Joab. And he blew a trumpet, and they retired from the city, every man to his tent. And Joab returned to Jerusalem unto the king.";
rsv[22] = "Then the woman went to all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and threw it out to Jo\'ab. So he blew the trumpet, and they dispersed from the city, every man to his home. And Jo\'ab returned to Jerusalem to the king.";
asv[22] = "Then the woman went unto all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and threw it out to Joab. And he blew the trumpet, and they were dispersed from the city, every man to his tent. And Joab returned to Jerusalem unto the king.";
yng[22] = "And the woman cometh unto all the people in her wisdom, and they cut off the head of Sheba son of Bichri, and cast [it] unto Joab, and he bloweth with a trumpet, and they are scattered from the city, each to his tents, and Joab hath turned back to Jerusalem unto the king.";
dby[22] = "Then the woman went to all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and cast it to Joab. And he blew a trumpet, and they dispersed from the city, every man to his tent. And Joab returned to Jerusalem to the king.";
web[22] = "Then the woman went to all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and cast [it] out to Joab. And he blew a trumpet, and they retired from the city, every man to his tent. And Joab returned to Jerusalem to the king.";
hnv[22] = "Then the woman went to all the people in her wisdom. They cut off the head of Sheva the son of Bikhri, and threw it out to Yo\'av. He blew the shofar, and they were dispersed from the city, every man to his tent. Yo\'av returned to Yerushalayim to the king.";
vul[22] = "ingressa est ergo ad omnem populum et locuta est eis sapienter qui abscisum caput Seba filii Bochri proiecerunt ad Ioab et ille cecinit tuba et recesserunt ab urbe unusquisque in tabernacula sua Ioab autem reversus est Hierusalem ad regem";
kjv[23] = "Now Joab [was] over all the host of Israel: and Benaiah the son of Jehoiada [was] over the Cherethites and over the Pelethites:";
rsv[23] = "Now Jo\'ab was in command of all the army of Israel; and Benai\'ah the son of Jehoi\'ada was in command of the Cher\'ethites and the Pel\'ethites;";
asv[23] = "Now Joab was over all the host of Israel; and Benaiah the son of Jehoiada was over the Cherethites and over the Pelethites;";
yng[23] = "And Joab [is] over all the host of Israel, and Benaiah son of Jehoiada [is] over the Cherethite, and over the Pelethite,";
dby[23] = "And Joab was over all the host of Israel; and Benaiah the son of Jehoiada was over the Cherethites and over the Pelethites;";
web[23] = "Now Joab [was] over all the host of Israel: and Benaiah the son of Jehoiada [was] over the Cherethites and over the Pelethites:";
hnv[23] = " Now Yo\'av was over all the host of Yisra\'el; and Benayah the son of Yehoiada was over the Kereti and over the Peleti;";
vul[23] = "fuit ergo Ioab super omnem exercitum Israhel Banaias autem filius Ioiadae super Cheretheos et Feletheos";
kjv[24] = "And Adoram [was] over the tribute: and Jehoshaphat the son of Ahilud [was] recorder:";
rsv[24] = "and Ador\'am was in charge of the forced labor; and Jehosh\'aphat the son of Ahi\'lud was the recorder;";
asv[24] = "and Adoram was over the men subject to taskwork; and Jehoshaphat the son of Ahilud was the recorder;";
yng[24] = "and Adoram [is] over the tribute, and Jehoshaphat son of Ahilud [is] the remembrancer,";
dby[24] = "and Adoram was over the levy; and Jehoshaphat the son of Ahilud was recorder;";
web[24] = "And Adoram [was] over the tribute: and Jehoshaphat the son of Ahilud [was] recorder:";
hnv[24] = "and Adoram was over the men subject to forced labor; and Yehoshafat the son of Achilud was the recorder;";
vul[24] = "Aduram vero super tributa porro Iosaphat filius Ahilud a commentariis";
kjv[25] = "And Sheva [was] scribe: and Zadok and Abiathar [were] the priests:";
rsv[25] = "and Sheva was secretary; and Zadok and Abi\'athar were priests;";
asv[25] = "and Sheva was scribe; and Zadok and Abiathar were priests;";
yng[25] = "and Sheva [is] scribe, and Zadok and Abiathar [are] priests,";
dby[25] = "and Sheva was scribe; and Zadok and Abiathar were priests;";
web[25] = "And Sheva [was] scribe: and Zadok and Abiathar [were] the priests:";
hnv[25] = "and Sheva was Sofer; and Tzadok and Avyatar were Kohanim;";
vul[25] = "Sia autem scriba Sadoc vero et Abiathar sacerdotes";
kjv[26] = "And Ira also the Jairite was a chief ruler about David.";
rsv[26] = "and Ira the Ja\'irite was also David\'s priest.";
asv[26] = "and also Ira the Jairite was chief minister unto David.";
yng[26] = "and also, Ira the Jairite hath been minister to David.";
dby[26] = "and Ira also, the Jairite, was David\'s chief ruler.";
web[26] = "And Ira also the Jairite was a chief ruler about David.";
hnv[26] = "and also `Ira the Ya\'irite was chief minister to David.";
vul[26] = "Hira autem Hiaiarites erat sacerdos David";
