csb[1] = "Joab son of Zeruiah realized that the king\'s mind was on Absalom.";
csb[2] = "So Joab sent someone to Tekoa to bring a wise woman from there. He told her, &quot;Pretend to be in mourning: dress in mourning clothes and don\'t put on any oil. Act like a woman who has been mourning for the dead for a long time.";
csb[3] = "&quot;Go to the king and speak these words to him.&quot; Then Joab told her exactly what to say.";
csb[4] = "When the woman from Tekoa came to the king, she fell facedown to the ground, paid homage, and said, &quot;Help me, Your Majesty! &quot;";
csb[5] = "&quot;What\'s the matter? &quot; the king asked her. &quot;Sadly, I am a widow; my husband died,&quot; she said.";
csb[6] = "&quot;Your servant had two sons. They were fighting in the field with no one to separate them, and one struck the other and killed him.";
csb[7] = "&quot;Now the whole clan has risen up against your servant and said, \'Hand over the one who killed his brother so we may put him to death for the life of the brother he murdered. We will eliminate the heir! \' They would extinguish my one remaining ember by not preserving my husband\'s name or posterity on earth.&quot;";
csb[8] = "The king told the woman, &quot;Go home. I will issue a command on your behalf.&quot;";
csb[9] = "Then the woman of Tekoa said to the king, &quot;My lord the king, may any blame be on me and my father\'s family, and may the king and his throne be innocent.&quot;";
csb[10] = "&quot;Whoever speaks to you,&quot; the king said, &quot;bring him to me. He will not trouble you again! &quot;";
csb[11] = "She replied, &quot;Please, may the king invoke the LORD your God, so that the avenger of blood will not increase the loss, and they will not eliminate my son! &quot; &quot;As the LORD lives,&quot; he vowed, &quot;not a hair of your son will fall to the ground.&quot;";
csb[12] = "Then the woman said, &quot;Please, may your servant speak a word to my lord the king? &quot; &quot;Speak,&quot; he replied.";
csb[13] = "The woman asked, &quot;Why have you devised something similar against the people of God? When the king spoke as he did about this matter, he has pronounced his own guilt. The king has not brought back his own banished one.";
csb[14] = "&quot;We will certainly die and be like water poured out on the ground, which can\'t be recovered. But God would not take away a life; he would devise plans so that the one banished from him does not remain banished.";
csb[15] = "&quot;Now therefore, I\'ve come to present this matter to my lord the king because the people have made me afraid. Your servant thought: I must speak to the king. Perhaps the king will grant his servant\'s request.";
csb[16] = "&quot;The king will surely listen in order to keep his servant from the grasp of this man who would eliminate both me and my son from God\'s inheritance.";
csb[17] = "&quot;Your servant thought: May the word of my lord the king bring relief, for my lord the king is able to discern the good and the bad like the angel of God. May the LORD your God be with you.&quot;";
csb[18] = "Then the king answered the woman, &quot;I\'m going to ask you something; don\'t conceal it from me! &quot; &quot;Let my lord the king speak,&quot; the woman replied.";
csb[19] = "The king asked, &quot;Did Joab put you up to all this? &quot; The woman answered. &quot;As you live, my lord the king, no one can turn to the right or left from all my lord the king says. Yes, your servant Joab is the one who gave orders to me; he told your servant exactly what to say.";
csb[20] = "&quot;Joab your servant has done this to address the issue indirectly, but my lord has wisdom like the wisdom of the angel of God, knowing everything on earth.&quot;";
csb[21] = "Then the king said to Joab, &quot;I hereby grant this request. Go, bring back the young man Absalom.&quot;";
csb[22] = "Joab fell with his face to the ground in homage and blessed the king. &quot;Today,&quot; Joab said, &quot;your servant knows I have found favor with you, my lord the king, because the king has granted the request of your servant.&quot;";
csb[23] = "So Joab got up, went to Geshur, and brought Absalom to Jerusalem.";
csb[24] = "However, the king added, &quot;He may return to his house, but he may not see my face.&quot; So Absalom returned to his house, but he did not see the king.";
csb[25] = "No man in all Israel was as handsome and highly praised as Absalom. From the sole of his foot to the top of his head, he did not have a single flaw.";
csb[26] = "When he shaved his head -- he shaved it at the end of every year because his hair got so heavy for him that he had to shave it off -- he would weigh the hair from his head and it would be five pounds according to the royal standard.";
csb[27] = "Three sons were born to Absalom, and a daughter named Tamar, who was a beautiful woman.";
csb[28] = "Absalom resided in Jerusalem two years but never saw the king.";
csb[29] = "Then Absalom sent for Joab in order to send him to the king, but Joab was unwilling to come to him. So he sent again, a second time, but he still would not come.";
csb[30] = "Then Absalom said to his servants, &quot;See, Joab has a field right next to mine, and he has barley there. Go and set fire to it! &quot; So Absalom\'s servants set the field on fire.";
csb[31] = "Then Joab came to Absalom\'s house and demanded, &quot;Why did your servants set my field on fire? &quot;";
csb[32] = "&quot;Look,&quot; Absalom explained to Joab, &quot;I sent for you and said, \'Come here. I want to send you to the king to ask: Why have I come back from Geshur? I\'d be better off if I were still there.\' So now, let me see the king. If I am guilty, let him kill me.&quot;";
csb[33] = "Joab went to the king and told him. So David summoned Absalom, who came to the king and paid homage with his face to the ground before him. Then the king kissed Absalom.";

hnv[1] = "Now Yo\'av the son of Tzeru\'yah perceived that the king\'s heart was toward Avshalom.";

kjv[2] = "And Joab sent to Tekoah, and fetched thence a wise woman, and said unto her, I pray thee, feign thyself to be a mourner, and put on now mourning apparel, and anoint not thyself with oil, but be as a woman that had a long time mourned for the dead:";
rsv[2] = "And Jo\'ab sent to Teko\'a, and fetched from there a wise woman, and said to her, &quot;Pretend to be a mourner, and put on mourning garments; do not anoint yourself with oil, but behave like a woman who has been mourning many days for the dead;";
asv[2] = "And Joab sent to Tekoa, and fetched thence a wise woman, and said unto her, I pray thee, feign thyself to be a mourner, and put on mourning apparel, I pray thee, and anoint not thyself with oil, but be as a woman that hath a long time mourned for the dead:";
yng[2] = "and Joab sendeth to Tekoah, and taketh thence a wise woman, and saith unto her, `Feign thyself a mourner, I pray thee, and put on, I pray thee, garments of mourning, and anoint not thyself with oil, and thou hast been as a woman these many days mourning for the dead,";

rsv[7] = "And now the whole family has risen against your handmaid, and they say, \'Give up the man who struck his brother, that we may kill him for the life of his brother whom he slew\'; and so they would destroy the heir also. Thus they would quench my coal which is left, and leave to my husband neither name nor remnant upon the face of the earth.&quot;";
asv[7] = "And, behold, the whole family is risen against thy handmaid, and they say, Deliver him that smote his brother, that we may kill him for the life of his brother whom he slew, and so destroy the heir also. Thus will they quench my coal which is left, and will leave to my husband neither name nor remainder upon the face of the earth.";

kjv[11] = "Then said she, I pray thee, let the king remember the LORD thy God, that thou wouldest not suffer the revengers of blood to destroy any more, lest they destroy my son. And he said, [As] the LORD liveth, there shall not one hair of thy son fall to the earth.";
rsv[11] = "Then she said, &quot;Pray let the king invoke the LORD your God, that the avenger of blood slay no more, and my son be not destroyed.&quot; He said, &quot;As the LORD lives, not one hair of your son shall fall to the ground.&quot;";
asv[11] = "Then said she, I pray thee, let the king remember Jehovah thy God, that the avenger of blood destroy not any more, lest they destroy my son. And he said, As Jehovah liveth, there shall not one hair of thy son fall to the earth.";
yng[11] = "And she saith, `Let, I pray thee, the king remember by Jehovah thy God, that the redeemer of blood add not to destroy, and they destroy not my son;\' and he saith, `Jehovah liveth; if there doth fall of the hair of thy son to the earth.\'";

asv[13] = "And the woman said, Wherefore then hast thou devised such a thing against the people of God? for in speaking this word the king is as one that is guilty, in that the king doth not fetch home again his banished one.";
yng[13] = "And the woman saith, `And why hast thou thought thus concerning the people of God? yea, the king is speaking this thing as a guilty one, in that the king hath not brought back his outcast;";
dby[13] = "And the woman said, Why then hast thou thought such a thing against God\'s people? and the king in saying this thing, is as one guilty, in that the king does not bring back his banished one.";

kjv[14] = "For we must needs die, and [are] as water spilt on the ground, which cannot be gathered up again; neither doth God respect [any] person: yet doth he devise means, that his banished be not expelled from him.";
rsv[14] = "We must all die, we are like water spilt on the ground, which cannot be gathered up again; but God will not take away the life of him who devises means not to keep his banished one an outcast.";
asv[14] = "For we must needs die, and are as water spilt on the ground, which cannot be gathered up again; neither doth God take away life, but deviseth means, that he that is banished be not an outcast from him.";
yng[14] = "for we do surely die, and [are] as water which is running down to the earth, which is not gathered, and God doth not accept a person, and hath devised devices in that the outcast is not outcast by Him.";
dby[14] = "For we must needs die, and are as water spilt on the ground, which cannot be gathered up again; and God has not taken away his life, but devises means that the banished one be not expelled from him.";

hnv[14] = "For we must needs die, and are as water split on the ground, which can\'t be gathered up again; neither does God take away life, but devises means, that he who is banished not be an outcast from him.";
vul[14] = "omnes morimur et quasi aquae delabimur in terram quae non revertuntur nec vult perire Deus animam sed retractat cogitans ne penitus pereat qui abiectus est";
kjv[15] = "Now therefore that I am come to speak of this thing unto my lord the king, [it is] because the people have made me afraid: and thy handmaid said, I will now speak unto the king; it may be that the king will perform the request of his handmaid.";
rsv[15] = "Now I have come to say this to my lord the king because the people have made me afraid; and your handmaid thought, \'I will speak to the king; it may be that the king will perform the request of his servant.";
asv[15] = "Now therefore seeing that I am come to speak this word unto my lord the king, it is because the people have made me afraid: and thy handmaid said, I will now speak unto the king; it may be that the king will perform the request of his servant.";
yng[15] = "`And now that I have come to speak unto the king my lord this word, [it is] because the people made me afraid, and thy maid-servant saith, Let me speak, I pray thee, unto the king; it may be the king doth do the word of his handmaid,";
dby[15] = "And now that I am come to speak of this thing to my lord the king, it is because the people have made me afraid; and thy bondmaid said, I will now speak to the king; perhaps the king will perform the request of his handmaid.";
web[15] = "Now therefore that I have come to speak of this thing to my lord the king, [it is] because the people have made me afraid: and thy handmaid said, I will now speak to the king; it may be that the king will perform the request of his handmaid.";
hnv[15] = "Now therefore seeing that I have come to speak this word to my lord the king, it is because the people have made me afraid: and your handmaid said, I will now speak to the king; it may be that the king will perform the request of his servant.";
vul[15] = "nunc igitur veni ut loquar ad regem dominum meum verbum hoc praesente populo et dixit ancilla tua loquar ad regem si quo modo faciat rex verbum ancillae suae";
kjv[16] = "For the king will hear, to deliver his handmaid out of the hand of the man [that would] destroy me and my son together out of the inheritance of God.";
rsv[16] = "For the king will hear, and deliver his servant from the hand of the man who would destroy me and my son together from the heritage of God.\'";
asv[16] = "For the king will hear, to deliver his servant out of the hand of the man that would destroy me and my son together out of the inheritance of God.";
yng[16] = "for the king doth hearken to deliver his handmaid out of the paw of the man [seeking] to destroy me and my son together out of the inheritance of God,";
dby[16] = "For the king will hear, to deliver his handmaid out of the hand of the man that would destroy me and my son together out of the inheritance of God.";
web[16] = "For the king will hear, to deliver his handmaid from the hand of the man [that would] destroy me and my son together out of the inheritance of God.";
hnv[16] = "For the king will hear, to deliver his servant out of the hand of the man who would destroy me and my son together out of the inheritance of God.";
vul[16] = "et audivit rex ut liberaret ancillam suam de manu omnium qui volebant delere me et filium meum simul de hereditate Dei";
kjv[17] = "Then thine handmaid said, The word of my lord the king shall now be comfortable: for as an angel of God, so [is] my lord the king to discern good and bad: therefore the LORD thy God will be with thee.";
rsv[17] = "And your handmaid thought, \'The word of my lord the king will set me at rest\'; for my lord the king is like the angel of God to discern good and evil. The LORD your God be with you!&quot;";
asv[17] = "Then thy handmaid said, Let, I pray thee, the word of my lord the king be comfortable; for as an angel of God, so is my lord the king to discern good and bad: and Jehovah thy God be with thee.";
yng[17] = "and thy maid-servant saith, Let, I pray thee, the word of my lord the king be for ease; for as a messenger of God so [is] my lord the king, to understand the good and the evil; and Jehovah thy God is with thee.\'";
dby[17] = "And thy bondmaid said, Let the word of my lord the king now be comfortable; for as an angel of God, so is my lord the king to discern good and bad; and Jehovah thy God will be with thee.";
web[17] = "Then thy handmaid said, The word of my lord the king, will now be comfortable: for as an angel of God, so [is] my lord the king to discern good and bad: therefore the LORD thy God will be with thee.";
hnv[17] = "Then your handmaid said, Please let the word of my lord the king be comfortable; for as an angel of God, so is my lord the king to discern good and bad: and the LORD your God be with you.";
vul[17] = "dicat ergo ancilla tua ut fiat verbum domini mei regis quasi sacrificium sicut enim angelus Dei sic est dominus meus rex ut nec benedictione nec maledictione moveatur unde et Dominus Deus tuus est tecum";
kjv[18] = "Then the king answered and said unto the woman, Hide not from me, I pray thee, the thing that I shall ask thee. And the woman said, Let my lord the king now speak.";
rsv[18] = "Then the king answered the woman, &quot;Do not hide from me anything I ask you.&quot; And the woman said, &quot;Let my lord the king speak.&quot;";
asv[18] = "Then the king answered and said unto the woman, Hide not from me, I pray thee, aught that I shall ask thee. And the woman said, Let my lord the king now speak.";
yng[18] = "And the king answereth and saith unto the woman, `Do not, I pray thee, hide from me the thing that I am asking thee;\' and the woman saith, `Let, I pray thee, my lord the king speak.\'";
dby[18] = "And the king answered and said to the woman, Hide not from me, I pray thee, the thing that I shall ask thee. And the woman said, Let my lord the king now speak.";
web[18] = "Then the king answered and said to the woman, Hide not from me, I pray thee, the thing that I shall ask thee. And the woman said, Let my lord the king now speak.";
hnv[18] = "Then the king answered the woman, Please don\'t hide anything from me that I shall ask you. The woman said, Let my lord the king now speak.";
vul[18] = "et respondens rex dixit ad mulierem ne abscondas a me verbum quod te interrogo dixitque mulier loquere domine mi rex";
kjv[19] = "And the king said, [Is not] the hand of Joab with thee in all this? And the woman answered and said, [As] thy soul liveth, my lord the king, none can turn to the right hand or to the left from ought that my lord the king hath spoken: for thy servant Joab, he bade me, and he put all these words in the mouth of thine handmaid:";
rsv[19] = "The king said, &quot;Is the hand of Jo\'ab with you in all this?&quot; The woman answered and said, &quot;As surely as you live, my lord the king, one cannot turn to the right hand or to the left from anything that my lord the king has said. It was your servant Jo\'ab who bade me; it was he who put all these words in the mouth of your handmaid.";
asv[19] = "And the king said, Is the hand of Joab with thee in all this? And the woman answered and said, As thy soul liveth, my lord the king, none can turn to the right hand or to the left from aught that my lord the king hath spoken; for thy servant Joab, he bade me, and he put all these words in the mouth of thy handmaid;";
yng[19] = "And the king saith, `Is the hand of Joab with thee in all this?\' And the woman answereth and saith, `Thy soul liveth, my lord, O king, none [doth turn] to the right or to the left from all that my lord the king hath spoken; for thy servant Joab he commanded me, and he put in the mouth of thy maid-servant all these words;";
dby[19] = "And the king said, Is the hand of Joab with thee in all this? And the woman answered and said, [As] thy soul liveth, my lord, O king, there is no turning to the right hand or to the left from aught that my lord the king has spoken; for thy servant Joab, he bade me, and he put all these words into the mouth of thy bondmaid:";
web[19] = "And the king said, [Is not] the hand of Joab with thee in all this? And the woman answered and said, [As] thy soul liveth, my lord the king, none can turn to the right hand or to the left from aught that my lord the king hath spoken: for thy servant Joab, he bade me, and he put all these words in the mouth of thy handmaid:";
hnv[19] = "The king said, Is the hand of Yo\'av with you in all this? The woman answered, As your soul lives, my lord the king, none can turn to the right hand or to the left from anything that my lord the king has spoken; for your servant Yo\'av, he bade me, and he put all these words in the mouth of your handmaid;";
vul[19] = "et ait rex numquid manus Ioab tecum est in omnibus istis respondit mulier et ait per salutem animae tuae domine mi rex nec ad dextram nec ad sinistram est ex omnibus his quae locutus est dominus meus rex servus enim tuus Ioab ipse praecepit mihi et ipse posuit in os ancillae tuae omnia verba haec";
kjv[20] = "To fetch about this form of speech hath thy servant Joab done this thing: and my lord [is] wise, according to the wisdom of an angel of God, to know all [things] that [are] in the earth.";
rsv[20] = "In order to change the course of affairs your servant Jo\'ab did this. But my lord has wisdom like the wisdom of the angel of God to know all things that are on the earth.&quot;";
asv[20] = "to change the face of the matter hath thy servant Joab done this thing: and my lord is wise, according to the wisdom of an angel of God, to know all things that are in the earth.";
yng[20] = "in order to bring round the appearance of the thing hath thy servant Joab done this thing, and my lord [is] wise, according to the wisdom of a messenger of God, to know all that [is] in the land.\'";
dby[20] = "in order to turn the appearance of the thing has thy servant Joab done this thing; but my lord is wise, according to the wisdom of an angel of God, to know all that is in the earth.";
web[20] = "To bring about this form of speech hath thy servant Joab done this thing: and my lord [is] wise, according to the wisdom of an angel of God, to know all [things] that [are] on the earth.";
hnv[20] = "to change the face of the matter has your servant Yo\'av done this thing: and my lord is wise, according to the wisdom of an angel of God, to know all things that are in the eretz.";
vul[20] = "ut verterem figuram sermonis huius servus tuus Ioab praecepit istud tu autem domine mi sapiens es sicut habet sapientiam angelus Dei ut intellegas omnia super terram";
kjv[21] = "And the king said unto Joab, Behold now, I have done this thing: go therefore, bring the young man Absalom again.";
rsv[21] = "Then the king said to Jo\'ab, &quot;Behold now, I grant this; go, bring back the young man Ab\'salom.&quot;";
asv[21] = "And the king said unto Joab, Behold now, I have done this thing: go therefore, bring the young man Absalom back.";
yng[21] = "And the king saith unto Joab, `Lo, I pray thee, thou hast done this thing; and go, bring back the young man Absalom.\'";
dby[21] = "And the king said to Joab, Behold now, I have done this thing: so go, bring back the young man Absalom.";
web[21] = "And the king said to Joab, Behold now, I have done this thing: go therefore, bring the young man Absalom again.";
hnv[21] = "The king said to Yo\'av, Behold now, I have done this thing: go therefore, bring the young man Avshalom back.";
vul[21] = "et ait rex ad Ioab ecce placatus feci verbum tuum vade igitur et revoca puerum Absalom";
kjv[22] = "And Joab fell to the ground on his face, and bowed himself, and thanked the king: and Joab said, To day thy servant knoweth that I have found grace in thy sight, my lord, O king, in that the king hath fulfilled the request of his servant.";
rsv[22] = "And Jo\'ab fell on his face to the ground, and did obeisance, and blessed the king; and Jo\'ab said, &quot;Today your servant knows that I have found favor in your sight, my lord the king, in that the king has granted the request of his servant.&quot;";
asv[22] = "And Joab fell to the ground on his face, and did obeisance, and blessed the king; and Joab said, To-day thy servant knoweth that I have found favor in thy sight, my lord, O king, in that the king hath performed the request of his servant.";
yng[22] = "And Joab falleth on his face to the earth, and doth obeisance, and blesseth the king, and Joab saith, `To-day hath thy servant known that I have found grace in thine eyes, my lord, O king, in that the king hath done the word of his servant.\'";
dby[22] = "And Joab fell to the ground on his face and bowed himself, and blessed the king; and Joab said, To-day thy servant knows that I have found favour in thy sight, my lord, O king, in that the king has fulfilled the request of his servant.";
web[22] = "And Joab fell to the ground on his face, and bowed himself, and thanked the king: and Joab said, To-day thy servant knoweth that I have found grace in thy sight, my lord, O king, in that the king hath fulfilled the request of his servant.";
hnv[22] = "Yo\'av fell to the ground on his face, and did obeisance, and blessed the king: and Yo\'av said, Today your servant knows that I have found favor in your sight, my lord, king, in that the king has performed the request of his servant.";
vul[22] = "cadensque Ioab super faciem suam in terram adoravit et benedixit regi et dixit Ioab hodie intellexit servus tuus quia inveni gratiam in oculis tuis domine mi rex fecisti enim sermonem servi tui";
kjv[23] = "So Joab arose and went to Geshur, and brought Absalom to Jerusalem.";
rsv[23] = "So Jo\'ab arose and went to Geshur, and brought Ab\'salom to Jerusalem.";
asv[23] = "So Joab arose and went to Geshur, and brought Absalom to Jerusalem.";
yng[23] = "And Joab riseth and goeth to Geshur, and bringeth in Absalom to Jerusalem,";
dby[23] = "And Joab arose and went to Geshur, and brought Absalom to Jerusalem.";
web[23] = "So Joab arose and went to Geshur, and brought Absalom to Jerusalem.";
hnv[23] = "So Yo\'av arose and went to Geshur, and brought Avshalom to Yerushalayim.";
vul[23] = "surrexit ergo Ioab et abiit in Gessur et adduxit Absalom in Hierusalem";
kjv[24] = "And the king said, Let him turn to his own house, and let him not see my face. So Absalom returned to his own house, and saw not the king\'s face.";
rsv[24] = "And the king said, &quot;Let him dwell apart in his own house; he is not to come into my presence.&quot; So Ab\'salom dwelt apart in his own house, and did not come into the king\'s presence.";
asv[24] = "And the king said, Let him turn to his own house, but let him not see my face. So Absalom turned to his own house, and saw not the king\'s face.";
yng[24] = "and the king saith, `Let him turn round unto his house, and my face he doth not see.\' And Absalom turneth round unto his house, and the face of the king he hath not seen.";
dby[24] = "And the king said, Let him turn to his own house, and let him not see my face. And Absalom withdrew to his own house, and saw not the king\'s face.";
web[24] = "And the king said, Let him turn to his own house, and let him not see my face. So Absalom returned to his own house, and saw not the king\'s face.";
hnv[24] = "The king said, Let him turn to his own house, but let him not see my face. So Avshalom turned to his own house, and didn\'t see the king\'s face.";
vul[24] = "dixit autem rex revertatur in domum suam et faciem meam non videat reversus est itaque Absalom in domum suam et faciem regis non vidit";
kjv[25] = "But in all Israel there was none to be so much praised as Absalom for his beauty: from the sole of his foot even to the crown of his head there was no blemish in him.";
rsv[25] = "Now in all Israel there was no one so much to be praised for his beauty as Ab\'salom; from the sole of his foot to the crown of his head there was no blemish in him.";
asv[25] = "Now in all Israel there was none to be so much praised as Absalom for his beauty: from the sole of his foot even to the crown of his head there was no blemish in him.";
yng[25] = "And like Absalom there was no man [so] fair in all Israel, to praise greatly; from the sole of his foot even unto his crown there was no blemish in him;";
dby[25] = "But in all Israel there was none to be so much praised as Absalom for his beauty: from the sole of his foot even to the crown of his head there was no blemish in him.";
web[25] = "But in all Israel there was none to be so much praised as Absalom for his beauty: from the sole of his foot even to the crown of his head there was no blemish in him.";
hnv[25] = "Now in all Yisra\'el there was none to be so much praised as Avshalom for his beauty: from the sole of his foot even to the crown of his head there was no blemish in him.";
vul[25] = "porro sicut Absalom vir non erat pulcher in omni Israhel et decorus nimis a vestigio pedis usque ad verticem non erat in eo ulla macula";
kjv[26] = "And when he polled his head, (for it was at every year\'s end that he polled [it]: because [the hair] was heavy on him, therefore he polled it:) he weighed the hair of his head at two hundred shekels after the king\'s weight.";
rsv[26] = "And when he cut the hair of his head (for at the end of every year he used to cut it; when it was heavy on him, he cut it), he weighed the hair of his head, two hundred shekels by the king\'s weight.";
asv[26] = "And when he cut the hair of his head (now it was at every year\'s end that he cut it; because it was heavy on him, therefore he cut it); he weighed the hair of his head at two hundred shekels, after the king\'s weight.";
yng[26] = "and in his polling his head -- and it hath been at the end of year by year that he polleth [it], for it [is] heavy on him, and he hath polled it -- he hath even weighed out the hair of his head -- two hundred shekels by the king\'s weight.";
dby[26] = "And when he shaved his head (for it was at every year\'s end that he shaved it, because it was heavy on him, therefore he shaved it), he weighed the hair of his head at two hundred shekels after the king\'s weight.";
web[26] = "And when he polled his head, (for it was at every year\'s end that he polled [it]: because [the hair] was heavy on him, therefore he polled it:) he weighed the hair of his head at two hundred shekels after the king\'s weight.";
hnv[26] = " When he cut the hair of his head (now it was at every year\'s end that he cut it; because it was heavy on him, therefore he cut it); he weighed the hair of his head at two hundred shekels, after the king\'s weight.";
vul[26] = "et quando tondebatur capillum semel autem in anno tondebatur quia gravabat eum caesaries ponderabat capillos capitis sui ducentis siclis pondere publico";
kjv[27] = "And unto Absalom there were born three sons, and one daughter, whose name [was] Tamar: she was a woman of a fair countenance.";
rsv[27] = "There were born to Ab\'salom three sons, and one daughter whose name was Tamar; she was a beautiful woman.";
asv[27] = "And unto Absalom there were born three sons, and one daughter, whose name was Tamar: she was a woman of a fair countenance.";
yng[27] = "And there are born to Absalom three sons, and one daughter, and her name [is] Tamar; she was a woman of a fair appearance.";
dby[27] = "And to Absalom there were born three sons, and one daughter, whose name was Tamar: she was a woman of a beautiful countenance.";
web[27] = "And to Absalom there were born three sons, and one daughter, whose name [was] Tamar: she was a woman of a fair countenance.";
hnv[27] = "To Avshalom there were born three sons, and one daughter, whose name was Tamar: she was a woman of a beautiful face.";
vul[27] = "nati sunt autem Absalom filii tres et filia una nomine Thamar eleganti forma";
kjv[28] = "So Absalom dwelt two full years in Jerusalem, and saw not the king\'s face.";
rsv[28] = "So Ab\'salom dwelt two full years in Jerusalem, without coming into the king\'s presence.";
asv[28] = "And Absalom dwelt two full years in Jerusalem; and he saw not the king\'s face.";
yng[28] = "And Absalom dwelleth in Jerusalem two years of days, and the face of the king he hath not seen;";
dby[28] = "So Absalom dwelt two full years in Jerusalem, and did not see the king\'s face.";
web[28] = "So Absalom dwelt two full years in Jerusalem, and saw not the king\'s face.";
hnv[28] = "Avshalom lived two full years in Yerushalayim; and he didn\'t see the king\'s face.";
vul[28] = "mansitque Absalom Hierusalem duobus annis et faciem regis non vidit";
kjv[29] = "Therefore Absalom sent for Joab, to have sent him to the king; but he would not come to him: and when he sent again the second time, he would not come.";
rsv[29] = "Then Ab\'salom sent for Jo\'ab, to send him to the king; but Jo\'ab would not come to him. And he sent a second time, but Jo\'ab would not come.";
asv[29] = "Then Absalom sent for Joab, to send him to the king; but he would not come to him: and he sent again a second time, but he would not come.";
yng[29] = "and Absalom sendeth unto Joab, to send him unto the king, and he hath not been willing to come unto him; and he sendeth again a second time, and he hath not been willing to come.";
dby[29] = "Then Absalom sent for Joab, to send him to the king; but he would not come to him; and he sent again the second time, but he would not come.";
web[29] = "Therefore Absalom sent for Joab, that he might send him to the king; but he would not come to him: and when he sent again the second time, he would not come.";
hnv[29] = "Then Avshalom sent for Yo\'av, to send him to the king; but he would not come to him: and he sent again a second time, but he would not come.";
vul[29] = "misit itaque ad Ioab ut mitteret eum ad regem qui noluit venire ad eum cumque secundo misisset et ille noluisset venire";
kjv[30] = "Therefore he said unto his servants, See, Joab\'s field is near mine, and he hath barley there; go and set it on fire. And Absalom\'s servants set the field on fire.";
rsv[30] = "Then he said to his servants, &quot;See, Jo\'ab\'s field is next to mine, and he has barley there; go and set it on fire.&quot; So Ab\'salom\'s servants set the field on fire.";
asv[30] = "Therefore he said unto his servants, See, Joab\'s field is near mine, and he hath barley there; go and set it on fire. And Absalom\'s servants set the field on fire.";
yng[30] = "And he saith unto his servants, `See, the portion of Joab [is] by the side of mine, and he hath barley there; go, and burn it with fire;\' and the servants of Absalom burn the portion with fire.";
dby[30] = "Then he said to his servants, See, Joab\'s allotment is near mine and he has barley there: go and set it on fire. And Absalom\'s servants set the allotment on fire.";
web[30] = "Therefore he said to his servants, See, Joab\'s field is near mine, and he hath barley there; go and set it on fire. And Absalom\'s servants set the field on fire.";
hnv[30] = "Therefore he said to his servants, Behold, Yo\'av\'s field is near mine, and he has barley there; go and set it on fire. Avshalom\'s servants set the field on fire.";
vul[30] = "dixit servis suis scitis agrum Ioab iuxta agrum meum habentem messem hordei ite igitur et succendite eum igni succenderunt ergo servi Absalom segetem igni";
kjv[31] = "Then Joab arose, and came to Absalom unto [his] house, and said unto him, Wherefore have thy servants set my field on fire?";
rsv[31] = "Then Jo\'ab arose and went to Ab\'salom at his house, and said to him, &quot;Why have your servants set my field on fire?&quot;";
asv[31] = "Then Joab arose, and came to Absalom unto his house, and said unto him, Wherefore have thy servants set my field on fire?";
yng[31] = "And Joab riseth and cometh unto Absalom in the house, and saith unto him, `Why have thy servants burned the portion that I have with fire?\'";
dby[31] = "Then Joab arose, and came to Absalom to [his] house, and said to him, Why have thy servants set my allotment on fire?";
web[31] = "Then Joab arose, and came to Absalom, to [his] house, and said to him, Why have thy servants set my field on fire?";
hnv[31] = "Then Yo\'av arose, and came to Avshalom to his house, and said to him, Why have your servants set my field on fire?";
vul[31] = "surrexitque Ioab et venit ad Absalom in domum eius et dixit quare succenderunt servi tui segetem meam igni";
kjv[32] = "And Absalom answered Joab, Behold, I sent unto thee, saying, Come hither, that I may send thee to the king, to say, Wherefore am I come from Geshur? [it had been] good for me [to have been] there still: now therefore let me see the king\'s face; and if there be [any] iniquity in me, let him kill me.";
rsv[32] = "Ab\'salom answered Jo\'ab, &quot;Behold, I sent word to you, \'Come here, that I may send you to the king, to ask, &quot;Why have I come from Geshur? It would be better for me to be there still.&quot; Now therefore let me go into the presence of the king; and if there is guilt in me, let him kill me.\'&quot;";
asv[32] = "And Absalom answered Joab, Behold, I sent unto thee, saying, Come hither, that I may send thee to the king, to say, Wherefore am I come from Geshur? it were better for me to be there still. Now therefore let me see the king\'s face; and if there be iniquity in me, let him kill me.";
yng[32] = "And Absalom saith unto Joab, `Lo, I sent unto thee, saying, Come hither, and I send thee unto the king to say, Why have I come in from Geshur? -- good for me while I [am] there -- and now, let me see the king\'s face, and if there is in me iniquity then thou hast put me to death.\'";
dby[32] = "And Absalom said to Joab, Behold, I sent to thee, saying, Come hither, that I may send thee to the king, to say, Why am I come from Geshur? it would have been better for me to be there still. And now let me see the king\'s face; and if there be iniquity in me, let him slay me.";
web[32] = "And Absalom answered Joab, Behold, I sent to thee, saying, Come hither, that I may send thee to the king, to say, Why am I come from Geshur? it [had been] good for me [had I been] there still: now therefore let me see the king\'s face; and if there is [any] iniquity in me, let him kill me.";
hnv[32] = "Avshalom answered Yo\'av, Behold, I sent to you, saying, Come here, that I may send you to the king, to say, Why am I come from Geshur? it were better for me to be there still. Now therefore let me see the king\'s face; and if there be iniquity in me, let him kill me.";
vul[32] = "et respondit Absalom ad Ioab misi ad te obsecrans ut venires ad me et mitterem te ad regem ut diceres ei quare veni de Gessur melius mihi erat ibi esse obsecro ergo ut videam faciem regis quod si memor est iniquitatis meae interficiat me";
kjv[33] = "So Joab came to the king, and told him: and when he had called for Absalom, he came to the king, and bowed himself on his face to the ground before the king: and the king kissed Absalom.";
rsv[33] = "Then Jo\'ab went to the king, and told him; and he summoned Ab\'salom. So he came to the king, and bowed himself on his face to the ground before the king; and the king kissed Ab\'salom.";
asv[33] = "So Joab came to the king, and told him; and when he had called for Absalom, he came to the king, and bowed himself on his face to the ground before the king: and the king kissed Absalom.";
yng[33] = "And Joab cometh unto the king, and declareth [it] to him, and he calleth unto Absalom, and he cometh unto the king, and boweth himself to him, on his face, to the earth, before the king, and the king giveth a kiss to Absalom.";
dby[33] = "And Joab came to the king, and told him. And he called Absalom, and he came to the king, and bowed himself on his face to the ground before the king; and the king kissed Absalom.";
web[33] = "So Joab came to the king, and told him: and when he had called for Absalom, he came to the king, and bowed himself on his face to the ground before the king: and the king kissed Absalom.";
hnv[33] = "So Yo\'av came to the king, and told him; and when he had called for Avshalom, he came to the king, and bowed himself on his face to the ground before the king: and the king kissed Avshalom.";
