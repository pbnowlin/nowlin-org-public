csb[1] = "When the king had settled into his palace and the LORD had given him rest on every side from all his enemies,";
csb[2] = "the king said to the prophet Nathan, &quot;Look, I am living in a cedar house while the ark of God sits inside tent curtains.&quot;";
csb[3] = "So Nathan told the king, &quot;Go and do all that is on your mind, for the LORD is with you.&quot;";
csb[4] = "But that night the word of the LORD came to Nathan:";
csb[5] = "&quot;Go to my servant David and say, \'This is what the LORD says: Are you to build me a house to dwell in?";
csb[6] = "&quot;From the time I brought the Israelites out of Egypt until today I have not dwelt in a house; instead, I have been moving around with a tent as my dwelling.";
csb[7] = "&quot;In all my journeys with all the Israelites, have I ever spoken a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, asking: Why haven\'t you built me a house of cedar? \'";
csb[8] = "&quot;So now this is what you are to say to my servant David: \'This is what the LORD of Armies says: I took you from the pasture, from tending the flock, to be ruler over my people Israel.";
csb[9] = "&quot;I have been with you wherever you have gone, and I have destroyed all your enemies before you. I will make a great name for you like that of the greatest on the earth.";
csb[10] = "&quot;I will designate a place for my people Israel and plant them, so that they may live there and not be disturbed again. Evildoers will not continue to oppress them as they have done";
csb[11] = "&quot;ever since the day I ordered judges to be over my people Israel. I will give you rest from all your enemies. &quot; \'The LORD declares to you: The LORD himself will make a house for you.";
csb[12] = "&quot;When your time comes and you rest with your fathers, I will raise up after you your descendant, who will come from your body, and I will establish his kingdom.";
csb[13] = "&quot;He is the one who will build a house for my name, and I will establish the throne of his kingdom forever.";
csb[14] = "&quot;I will be his father, and he will be my son. When he does wrong, I will discipline him with a rod of men and blows from mortals.";
csb[15] = "&quot;But my faithful love will never leave him as it did when I removed it from Saul, whom I removed from before you.";
csb[16] = "&quot;Your house and kingdom will endure before me forever, and your throne will be established forever.\' &quot;";
csb[17] = "Nathan reported all these words and this entire vision to David.";
csb[18] = "Then King David went in, sat in the LORD\'s presence, and said, Who am I, Lord GOD, and what is my house that you have brought me this far?";
csb[19] = "What you have done so far was a little thing to you, Lord GOD, for you have also spoken about your servant\'s house in the distant future. And this is a revelation for mankind, Lord GOD.";
csb[20] = "What more can David say to you? You know your servant, Lord GOD.";
csb[21] = "Because of your word and according to your will, you have revealed all these great things to your servant.";
csb[22] = "This is why you are great, Lord GOD. There is no one like you, and there is no God besides you, as all we have heard confirms.";
csb[23] = "And who is like your people Israel? God came to one nation on earth in order to redeem a people for himself, to make a name for himself, and to perform for them great and awesome acts, driving out nations and their gods before your people you redeemed for yourself from Egypt.";
csb[24] = "You established your people Israel to be your own people forever, and you, LORD, have become their God.";
csb[25] = "Now, LORD God, fulfill the promise forever that you have made to your servant and his house. Do as you have promised,";
csb[26] = "so that your name will be exalted forever, when it is said, &quot;The LORD of Armies is God over Israel.&quot; The house of your servant David will be established before you";
csb[27] = "since you, LORD of Armies, God of Israel, have revealed this to your servant when you said, &quot;I will build a house for you.&quot; Therefore, your servant has found the courage to pray this prayer to you.";
csb[28] = "Lord GOD, you are God; your words are true, and you have promised this good thing to your servant.";
csb[29] = "Now, please bless your servant\'s house so that it will continue before you forever. For you, Lord GOD, have spoken, and with your blessing your servant\'s house will be blessed forever.";

rsv[19] = "And yet this was a small thing in thy eyes, O Lord GOD; thou hast spoken also of thy servant\'s house for a great while to come, and hast shown me future generations, O Lord GOD!";
asv[19] = "And this was yet a small thing in thine eyes, O Lord Jehovah; but thou hast spoken also of thy servant\'s house for a great while to come; and this [too] after the manner of men, O Lord Jehovah!";
yng[19] = "And yet this [is] little in Thine eyes, Lord Jehovah, and Thou dost speak also concerning the house of Thy servant afar off; and this [is] the law of the Man, Lord Jehovah.";
dby[19] = "And yet this hath been a small thing in thy sight, Lord Jehovah; but thou hast spoken also of thy servant\'s house for a great while to come. And is this the manner of man, Lord Jehovah?";
web[19] = "And this was yet a small thing in thy sight, O Lord GOD; but thou hast spoken also of thy servant\'s house for a great while to come. And [is] this the manner of man, O Lord GOD?";
hnv[19] = "This was yet a small thing in your eyes, Lord GOD; but you have spoken also of your servant\'s house for a great while to come; and this [too] after the manner of men, Lord GOD!";
vul[19] = "sed et hoc parum visum est in conspectu tuo Domine Deus nisi loquereris etiam de domo servi tui in longinquum ista est enim lex Adam Domine Deus";
kjv[20] = "And what can David say more unto thee? for thou, Lord GOD, knowest thy servant.";
rsv[20] = "And what more can David say to thee? For thou knowest thy servant, O Lord GOD!";
asv[20] = "And what can David say more unto thee? for thou knowest thy servant, O Lord Jehovah.";
yng[20] = "And what doth David add more to speak unto Thee? and Thou, Thou hast known Thy servant, Lord Jehovah.";
dby[20] = "And what can David say more to thee? for thou, Lord Jehovah, knowest thy servant.";
web[20] = "And what can David say more to thee? for thou, Lord GOD, knowest thy servant.";
hnv[20] = " What can David say more to you? for you know your servant, Lord GOD.";
vul[20] = "quid ergo addere poterit adhuc David ut loquatur ad te tu enim scis servum tuum Domine Deus";
kjv[21] = "For thy word\'s sake, and according to thine own heart, hast thou done all these great things, to make thy servant know [them].";
rsv[21] = "Because of thy promise, and according to thy own heart, thou hast wrought all this greatness, to make thy servant know it.";
asv[21] = "For thy word\'s sake, and according to thine own heart, hast thou wrought all this greatness, to make thy servant know it.";
yng[21] = "Because of Thy word, and according to Thy heart, Thou hast done all this greatness, to cause Thy servant to know [it].";
dby[21] = "For thy word\'s sake, and according to thine own heart, hast thou done all this greatness, to make thy servant know [it].";
web[21] = "For thy word\'s sake, and according to thy own heart, hast thou done all these great things, to make thy servant know [them].";
hnv[21] = "For your word\'s sake, and according to your own heart, have you worked all this greatness, to make your servant know it.";
vul[21] = "propter verbum tuum et secundum cor tuum fecisti omnia magnalia haec ita ut notum faceres servo tuo";
kjv[22] = "Wherefore thou art great, O LORD God: for [there is] none like thee, neither [is there any] God beside thee, according to all that we have heard with our ears.";
rsv[22] = "Therefore thou art great, O LORD God; for there is none like thee, and there is no God besides thee, according to all that we have heard with our ears.";
asv[22] = "Wherefore thou art great, O Jehovah God: for there is none like thee, neither is there any God besides thee, according to all that we have heard with our ears.";
yng[22] = "Therefore Thou hast been great, Jehovah God, for there is none like Thee, and there is no God save Thee, according to all that we have heard with our ears.";
dby[22] = "Wherefore thou art great, Jehovah Elohim; for there is none like thee, neither is there any God beside thee, according to all that we have heard with our ears.";
web[22] = "Wherefore thou art great, O LORD God: for [there is] none like thee, neither [is there any] God besides thee, according to all that we have heard with our ears.";
hnv[22] = " Therefore you are great, LORD God: for there is none like you, neither is there any God besides you, according to all that we have heard with our ears.";
vul[22] = "idcirco magnificatus es Domine Deus quia non est similis tui neque est deus extra te in omnibus quae audivimus auribus nostris";
kjv[23] = "And what one nation in the earth [is] like thy people, [even] like Israel, whom God went to redeem for a people to himself, and to make him a name, and to do for you great things and terrible, for thy land, before thy people, which thou redeemedst to thee from Egypt, [from] the nations and their gods?";
rsv[23] = "What other nation on earth is like thy people Israel, whom God went to redeem to be his people, making himself a name, and doing for them great and terrible things, by driving out before his people a nation and its gods?";
asv[23] = "And what one nation in the earth is like thy people, even like Israel, whom God went to redeem unto himself for a people, and to make him a name, and to do great things for you, and terrible things for thy land, before thy people, whom thou redeemest to thee out of Egypt, [from] the nations and their gods?";
yng[23] = "`And who [is] as Thy people, as Israel -- one nation in the earth, whom God hath gone to redeem to Him for a people, and to make for Him a name -- and to do for you the greatness -- even fearful things for Thy land, at the presence of Thy people, whom Thou hast redeemed to Thee out of Egypt -- [among the] nations and their gods?";
dby[23] = "And who is like thy people, like Israel, the one nation in the earth that God went to redeem to be a people to himself, and to make himself a name, and to do for them great things and terrible, for thy land, before thy people, which thou redeemedst to thyself from Egypt, from the nations and their gods?";
web[23] = "And what one nation in the earth [is] like thy people, [even] like Israel, whom God went to redeem for a people to himself, and to make him a name, and to do for you great things and terrible, for thy land, before thy people which thou redeemedst to thee from Egypt, [from] the nations and their gods?";
hnv[23] = "What one nation in the eretz is like your people, even like Yisra\'el, whom God went to redeem to himself for a people, and to make him a name, and to do great things for you, and awesome things for your land, before your people, whom you redeem to you out of Mitzrayim, [from] the nations and their gods?";
vul[23] = "quae est autem ut populus tuus Israhel gens in terra propter quam ivit Deus ut redimeret eam sibi in populum et poneret sibi nomen faceretque eis magnalia et horribilia super terram a facie populi tui quem redemisti tibi ex Aegypto gentem et deum eius";
kjv[24] = "For thou hast confirmed to thyself thy people Israel [to be] a people unto thee for ever: and thou, LORD, art become their God.";
rsv[24] = "And thou didst establish for thyself thy people Israel to be thy people for ever; and thou, O LORD, didst become their God.";
asv[24] = "And thou didst establish to thyself thy people Israel to be a people unto thee for ever; and thou, Jehovah, becamest their God.";
yng[24] = "Yea, Thou dost establish to Thee Thy people Israel, to Thee for a people unto the age, and Thou, Jehovah, hast been to them for God.";
dby[24] = "And thou hast established to thyself thy people Israel to be a people unto thee for ever; and thou, Jehovah, art become their God.";
web[24] = "For thou hast confirmed to thyself thy people Israel [to be] a people to thee for ever: and thou, LORD, art become their God.";
hnv[24] = "You did establish to yourself your people Yisra\'el to be a people to you forever; and you, LORD, became their God.";
vul[24] = "et firmasti tibi populum tuum Israhel in populum sempiternum et tu Domine factus es eis in Deum";
kjv[25] = "And now, O LORD God, the word that thou hast spoken concerning thy servant, and concerning his house, establish [it] for ever, and do as thou hast said.";
rsv[25] = "And now, O LORD God, confirm for ever the word which thou hast spoken concerning thy servant and concerning his house, and do as thou hast spoken;";
asv[25] = "And now, O Jehovah God, the word that thou hast spoken concerning thy servant, and concerning his house, confirm thou it for ever, and do as thou hast spoken.";
yng[25] = "`And now, Jehovah God, the word which Thou hast spoken concerning Thy servant, and concerning his house, establish unto the age, and do as Thou hast spoken;";
dby[25] = "And now, Jehovah Elohim, the word that thou hast spoken concerning thy servant and concerning his house, fulfil it for ever, and do as thou hast said.";
web[25] = "And now, O LORD God, the word that thou hast spoken concerning thy servant, and concerning his house, establish [it] for ever, and do as thou hast said.";
hnv[25] = "Now, LORD God, the word that you have spoken concerning your servant, and concerning his house, confirm you it forever, and do as you have spoken.";
vul[25] = "nunc ergo Domine Deus verbum quod locutus es super servum tuum et super domum eius suscita in sempiternum et fac sicut locutus es";
kjv[26] = "And let thy name be magnified for ever, saying, The LORD of hosts [is] the God over Israel: and let the house of thy servant David be established before thee.";
rsv[26] = "and thy name will be magnified for ever, saying, \'The LORD of hosts is God over Israel,\' and the house of thy servant David will be established before thee.";
asv[26] = "And let thy name be magnified for ever, saying, Jehovah of hosts is God over Israel; and the house of thy servant David shall be established before thee.";
yng[26] = "And Thy Name is great unto the age, saying, Jehovah of Hosts [is] God over Israel, and the house of Thy servant David is established before Thee,";
dby[26] = "And let thy name be magnified for ever, saying, Jehovah of hosts is God over Israel; and let the house of thy servant David be established before thee.";
web[26] = "And let thy name be magnified for ever, saying, The LORD of hosts [is] the God over Israel: and let the house of thy servant David be established before thee.";
hnv[26] = "Let your name be magnified forever, saying, the LORD of hosts is God over Yisra\'el; and the house of your servant David shall be established before you.";
vul[26] = "et magnificetur nomen tuum usque in sempiternum atque dicatur Dominus exercituum Deus super Israhel et domus servi tui David erit stabilita coram Domino";
kjv[27] = "For thou, O LORD of hosts, God of Israel, hast revealed to thy servant, saying, I will build thee an house: therefore hath thy servant found in his heart to pray this prayer unto thee.";
rsv[27] = "For thou, O LORD of hosts, the God of Israel, hast made this revelation to thy servant, saying, \'I will build you a house\'; therefore thy servant has found courage to pray this prayer to thee.";
asv[27] = "For thou, O Jehovah of hosts, the God of Israel, hast revealed to thy servant, saying, I will build thee a house: therefore hath thy servant found in his heart to pray this prayer unto thee.";
yng[27] = "For Thou, Jehovah of Hosts, God of Israel, Thou hast uncovered the ear of Thy servant, saying, A house I build for thee, therefore hath Thy servant found his heart to pray unto Thee this prayer;";
dby[27] = "For thou, Jehovah of hosts, the God of Israel, hast revealed to thy servant, saying, I will build thee a house; therefore hath thy servant found in his heart to pray this prayer unto thee.";
web[27] = "For thou, O LORD of hosts, God of Israel, hast revealed to thy servant, saying, I will build thee a house: therefore hath thy servant found in his heart to pray this prayer to thee.";
hnv[27] = "For you, LORD of Hosts, the God of Yisra\'el, have revealed to your servant, saying, I will build you a house: therefore has your servant found in his heart to pray this prayer to you.";
vul[27] = "quia tu Domine exercituum Deus Israhel revelasti aurem servi tui dicens domum aedificabo tibi propterea invenit servus tuus cor suum ut oraret te oratione hac";
kjv[28] = "And now, O Lord GOD, thou [art] that God, and thy words be true, and thou hast promised this goodness unto thy servant:";
rsv[28] = "And now, O Lord GOD, thou art God, and thy words are true, and thou hast promised this good thing to thy servant;";
asv[28] = "And now, O Lord Jehovah, thou art God, and thy words are truth, and thou hast promised this good thing unto thy servant:";
yng[28] = "And now, Lord Jehovah, Thou [art] God Himself, and Thy words are truth, and Thou speakest unto Thy servant this goodness,";
dby[28] = "And now, Lord Jehovah, thou art that God, and thy words are true, and thou hast promised this goodness unto thy servant;";
web[28] = "And now, O Lord GOD, thou [art] that God, and thy words are true, and thou hast promised this goodness to thy servant:";
hnv[28] = "Now, O Lord GOD, you are God, and your words are truth, and you have promised this good thing to your servant:";
vul[28] = "nunc ergo Domine Deus tu es Deus et verba tua erunt vera locutus es enim ad servum tuum bona haec";
kjv[29] = "Therefore now let it please thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Lord GOD, hast spoken [it]: and with thy blessing let the house of thy servant be blessed for ever.";
rsv[29] = "now therefore may it please thee to bless the house of thy servant, that it may continue for ever before thee; for thou, O Lord GOD, hast spoken, and with thy blessing shall the house of thy servant be blessed for ever.&quot;";
asv[29] = "now therefore let it please thee to bless the house of thy servant, that it may continue for ever before thee; for thou, O Lord Jehovah, hast spoken it: and with thy blessing let the house of thy servant be blessed for ever.";
yng[29] = "And now, begin and bless the house of Thy servant, to be unto the age before Thee, for Thou, Lord Jehovah, hast spoken, and by Thy blessing is the house of Thy servant blessed -- to the age.\'";
dby[29] = "and now let it please thee to bless the house of thy servant, that it may be before thee for ever; for thou, Lord Jehovah, hast spoken it; and with thy blessing shall the house of thy servant be blessed for ever.";
web[29] = "Therefore now let it please thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Lord GOD, hast spoken [it]: and with thy blessing let the house of thy servant be blessed for ever.";
hnv[29] = "now therefore let it please you to bless the house of your servant, that it may continue forever before you; for you, Lord GOD, have spoken it: and with your blessing let the house of your servant be blessed forever.";
vul[29] = "incipe igitur et benedic domui servi tui ut sit in sempiternum coram te quia tu Domine Deus locutus es et benedictione tua benedicetur domus servi tui in sempiternum";
