csb[1] = "David asked, &quot;Is there anyone remaining from the family of Saul I can show kindness to for Jonathan\'s sake? &quot;";
csb[2] = "There was a servant of Saul\'s family named Ziba. They summoned him to David, and the king said to him, &quot;Are you Ziba? &quot; &quot;I am your servant,&quot; he replied.";
csb[3] = "So the king asked, &quot;Is there anyone left of Saul\'s family that I can show the kindness of God to? &quot; Ziba said to the king, &quot;There is still Jonathan\'s son who was injured in both feet.&quot;";
csb[4] = "The king asked him, &quot;Where is he? &quot; Ziba answered the king, &quot;You\'ll find him in Lo-debar at the house of Machir son of Ammiel.&quot;";
csb[5] = "So King David had him brought from the house of Machir son of Ammiel in Lo-debar.";
csb[6] = "Mephibosheth son of Jonathan son of Saul came to David, fell facedown, and paid homage. David said, &quot;Mephibosheth! &quot; &quot;I am your servant, &quot; he replied.";
csb[7] = "&quot;Don\'t be afraid,&quot; David said to him, &quot;since I intend to show you kindness for the sake of your father Jonathan. I will restore to you all your grandfather Saul\'s fields, and you will always eat meals at my table.&quot;";
csb[8] = "Mephibosheth paid homage and said, &quot;What is your servant that you take an interest in a dead dog like me? &quot;";
csb[9] = "Then the king summoned Saul\'s attendant Ziba and said to him, &quot;I have given to your master\'s grandson all that belonged to Saul and his family.";
csb[10] = "&quot;You, your sons, and your servants are to work the ground for him, and you are to bring in the crops so your master\'s grandson will have food to eat. But Mephibosheth, your master\'s grandson, is always to eat at my table.&quot; Now Ziba had fifteen sons and twenty servants.";
csb[11] = "Ziba said to the king, &quot;Your servant will do all my lord the king commands.&quot; So Mephibosheth ate at David\'s table just like one of the king\'s sons.";
csb[12] = "Mephibosheth had a young son whose name was Mica. All those living in Ziba\'s house were Mephibosheth\'s servants.";
csb[13] = "However, Mephibosheth lived in Jerusalem because he always ate at the king\'s table. His feet had been injured.";

kjv[10] = "Thou therefore, and thy sons, and thy servants, shall till the land for him, and thou shalt bring in [the fruits], that thy master\'s son may have food to eat: but Mephibosheth thy master\'s son shall eat bread alway at my table. Now Ziba had fifteen sons and twenty servants.";
rsv[10] = "And you and your sons and your servants shall till the land for him, and shall bring in the produce, that your master\'s son may have bread to eat; but Mephib\'osheth your master\'s son shall always eat at my table.&quot; Now Ziba had fifteen sons and twenty servants.";
asv[10] = "And thou shalt till the land for him, thou, and thy sons, and thy servants; and thou shalt bring in [the fruits], that thy master\'s son may have bread to eat: but Mephibosheth thy master\'s son shall eat bread alway at my table. Now Ziba had fifteen sons and twenty servants.";
yng[10] = "and thou hast served for him the land, thou and thy sons, and thy servants, and hast brought in, and there hath been to the son of thy lord bread, and he hath eaten it; and Mephibosheth son of thy lord doth eat continually bread at my table;\' and Ziba hath fifteen sons and twenty servants.";

kjv[11] = "Then said Ziba unto the king, According to all that my lord the king hath commanded his servant, so shall thy servant do. As for Mephibosheth, [said the king], he shall eat at my table, as one of the king\'s sons.";

dby[11] = "And Ziba said to the king, According to all that my lord the king has commanded his servant, so will thy servant do. And Mephibosheth [said David] shall eat at my table, as one of the king\'s sons.";
