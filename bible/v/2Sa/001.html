csb[1] = "After the death of Saul, David returned from defeating the Amalekites and stayed at Ziklag two days.";
csb[2] = "On the third day a man with torn clothes and dust on his head came from Saul\'s camp. When he came to David, he fell to the ground and paid homage.";
csb[3] = "David asked him, &quot;Where have you come from? &quot; He replied to him, &quot;I\'ve escaped from the Israelite camp.&quot;";
csb[4] = "&quot;What was the outcome? Tell me,&quot; David asked him. &quot;The troops fled from the battle,&quot; he answered. &quot;Many of the troops have fallen and are dead. Also, Saul and his son Jonathan are dead.&quot;";
csb[5] = "David asked the young man who had brought him the report, &quot;How do you know Saul and his son Jonathan are dead? &quot;";
csb[6] = "&quot;I happened to be on Mount Gilboa,&quot; he replied, &quot;and there was Saul, leaning on his spear. At that very moment the chariots and the cavalry were closing in on him.";
csb[7] = "&quot;When he turned around and saw me, he called out to me, so I answered: I\'m at your service.";
csb[8] = "&quot;He asked me, \'Who are you? \' I told him: I\'m an Amalekite.";
csb[9] = "&quot;Then he begged me, \'Stand over me and kill me, for I\'m mortally wounded, but my life still lingers.\'";
csb[10] = "&quot;So I stood over him and killed him because I knew that after he had fallen he couldn\'t survive. I took the crown that was on his head and the armband that was on his arm, and I\'ve brought them here to my lord.&quot;";
csb[11] = "Then David took hold of his clothes and tore them, and all the men with him did the same.";
csb[12] = "They mourned, wept, and fasted until the evening for those who died by the sword -- for Saul, his son Jonathan, the LORD\'s people, and the house of Israel.";
csb[13] = "David inquired of the young man who had brought him the report, &quot;Where are you from? &quot; &quot;I\'m the son of a resident alien,&quot; he said. &quot;I\'m an Amalekite.&quot;";
csb[14] = "David questioned him, &quot;How is it that you were not afraid to lift your hand to destroy the LORD\'s anointed? &quot;";
csb[15] = "Then David summoned one of his servants and said, &quot;Come here and kill him! &quot; The servant struck him, and he died.";
csb[16] = "For David had said to the Amalekite, &quot;Your blood is on your own head because your own mouth testified against you by saying, \'I killed the LORD\'s anointed.\' &quot;";
csb[17] = "David sang the following lament for Saul and his son Jonathan,";
csb[18] = "and he ordered that the Judahites be taught The Song of the Bow. It is written in the Book of Jashar:";
csb[19] = "The splendor of Israel lies slain on your heights. How the mighty have fallen!";
csb[20] = "Do not tell it in Gath, don\'t announce it in the marketplaces of Ashkelon, or the daughters of the Philistines will rejoice, and the daughters of the uncircumcised will celebrate.";
csb[21] = "Mountains of Gilboa, let no dew or rain be on you, or fields of offerings, for there the shield of the mighty was defiled -- the shield of Saul, no longer anointed with oil.";
csb[22] = "Jonathan\'s bow never retreated, Saul\'s sword never returned unstained, from the blood of the slain, from the flesh of the mighty.";
csb[23] = "Saul and Jonathan, loved and delightful, they were not parted in life or in death. They were swifter than eagles, stronger than lions.";
csb[24] = "Daughters of Israel, weep for Saul, who clothed you in scarlet, with luxurious things, who decked your garments with gold ornaments.";
csb[25] = "How the mighty have fallen in the thick of battle! Jonathan lies slain on your heights.";
csb[26] = "I grieve for you, Jonathan, my brother. You were such a friend to me. Your love for me was more wondrous than the love of women.";
csb[27] = "How the mighty have fallen and the weapons of war have perished!";

yng[20] = "Declare [it] not in Gath, Proclaim not the tidings in the streets of Ashkelon, Lest they rejoice -- The daughters of the Philistines, Lest they exult -- The daughters of the Uncircumcised!";

kjv[21] = "Ye mountains of Gilboa, [let there be] no dew, neither [let there be] rain, upon you, nor fields of offerings: for there the shield of the mighty is vilely cast away, the shield of Saul, [as though he had] not [been] anointed with oil.";

asv[21] = "Ye mountains of Gilboa, Let there be no dew nor rain upon you, neither fields of offerings: For there the shield of the mighty was vilely cast away, The shield of Saul, not anointed with oil. ";
yng[21] = "Mountains of Gilboa! No dew nor rain be on you, And fields of heave-offerings! For there hath become loathsome The shield of the mighty, The shield of Saul -- without the anointed with oil.";

kjv[22] = "From the blood of the slain, from the fat of the mighty, the bow of Jonathan turned not back, and the sword of Saul returned not empty.";
rsv[22] = "&quot;From the blood of the slain, from the fat of the mighty, the bow of Jonathan turned not back, and the sword of Saul returned not empty.";
asv[22] = "From the blood of the slain, from the fat of the mighty, The bow of Jonathan turned not back, And the sword of Saul returned not empty. ";
yng[22] = "From the blood of the wounded, From the fat of the mighty, The bow of Jonathan Hath not turned backward; And the sword of Saul doth not return empty.";
dby[22] = "From the blood of the slain, from the fat of the mighty, The bow of Jonathan turned not back, And the sword of Saul returned not empty.";
web[22] = "From the blood of the slain, from the fat of the mighty, the bow of Jonathan turned not back, and the sword of Saul returned not empty.";

kjv[23] = "Saul and Jonathan [were] lovely and pleasant in their lives, and in their death they were not divided: they were swifter than eagles, they were stronger than lions.";
rsv[23] = "&quot;Saul and Jonathan, beloved and lovely! In life and in death they were not divided; they were swifter than eagles, they were stronger than lions.";
asv[23] = "Saul and Jonathan were lovely and pleasant in their lives, And in their death they were not divided: They were swifter than eagles, They were stronger than lions. ";
yng[23] = "Saul and Jonathan! They are loved and pleasant in their lives, And in their death they have not been parted. Than eagles they have been lighter, Than lions they have been mightier!";
dby[23] = "Saul and Jonathan, beloved and pleasant in their lives, Even in their death were not divided; They were swifter than eagles, they were stronger than lions.";
web[23] = "Saul and Jonathan [were] lovely and pleasant in their lives, and in their death they were not divided: they were swifter than eagles, they were stronger than lions.";
hnv[23] = "Sha\'ul and Yonatan were lovely and pleasant in their lives, In their death they were not divided: They were swifter than eagles, They were stronger than lions.";
vul[23] = "Saul et Ionathan amabiles et decori in vita sua in morte quoque non sunt divisi aquilis velociores leonibus fortiores";

yng[24] = "Daughters of Israel! for Saul weep ye, Who is clothing you [in] scarlet with delights. Who is lifting up ornaments of gold on your clothing.";
dby[24] = "Ye daughters of Israel, weep over Saul, who clothed you in scarlet with splendour, Who put ornaments of gold upon your apparel.";
web[24] = "Ye daughters of Israel, weep over Saul, who clothed you in scarlet, with [other] delights, who put ornaments of gold upon your apparel.";
hnv[24] = "You daughters of Yisra\'el, weep over Sha\'ul, Who clothed you in scarlet delicately, Who put ornaments of gold on your clothing.";
