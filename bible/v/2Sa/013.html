csb[1] = "Some time passed. David\'s son Absalom had a beautiful sister named Tamar, and David\'s son Amnon was infatuated with her.";
csb[2] = "Amnon was frustrated to the point of making himself sick over his sister Tamar because she was a virgin, but it seemed impossible to do anything to her.";
csb[3] = "Amnon had a friend named Jonadab, a son of David\'s brother Shimeah. Jonadab was a very shrewd man,";
csb[4] = "and he asked Amnon, &quot;Why are you, the king\'s son, so miserable every morning? Won\'t you tell me? &quot; Amnon replied, &quot;I\'m in love with Tamar, my brother Absalom\'s sister.&quot;";
csb[5] = "Jonadab said to him, &quot;Lie down on your bed and pretend you\'re sick. When your father comes to see you, say to him, \'Please let my sister Tamar come and give me something to eat. Let her prepare a meal in my presence so I can watch and eat from her hand.\' &quot;";
csb[6] = "So Amnon lay down and pretended to be sick. When the king came to see him, Amnon said to him, &quot;Please let my sister Tamar come and make a couple of cakes in my presence so I can eat from her hand.&quot;";
csb[7] = "David sent word to Tamar at the palace: &quot;Please go to your brother Amnon\'s house and prepare a meal for him.&quot;";
csb[8] = "Then Tamar went to his house while Amnon was lying down. She took dough, kneaded it, made cakes in his presence, and baked them.";
csb[9] = "She brought the pan and set it down in front of him, but he refused to eat. Amnon said, &quot;Everyone leave me! &quot; And everyone left him.";
csb[10] = "&quot;Bring the meal to the bedroom,&quot; Amnon told Tamar, &quot;so I can eat from your hand.&quot; Tamar took the cakes she had made and went to her brother Amnon\'s bedroom.";
csb[11] = "When she brought them to him to eat, he grabbed her and said, &quot;Come sleep with me, my sister! &quot;";
csb[12] = "&quot;Don\'t, my brother! &quot; she cried. &quot;Don\'t disgrace me, for such a thing should never be done in Israel. Don\'t commit this outrage!";
csb[13] = "&quot;Where could I ever go with my humiliation? And you -- you would be like one of the outrageous fools in Israel! Please, speak to the king, for he won\'t keep me from you.&quot;";
csb[14] = "But he refused to listen to her, and because he was stronger than she was, he disgraced her by raping her.";
csb[15] = "So Amnon hated Tamar with such intensity that the hatred he hated her with was greater than the love he had loved her with. &quot;Get out of here! &quot; he said.";
csb[16] = "&quot;No,&quot; she cried, &quot;sending me away is much worse than the great wrong you\'ve already done to me! &quot; But he refused to listen to her.";
csb[17] = "Instead, he called to the servant who waited on him: &quot;Get this away from me, throw her out, and bolt the door behind her! &quot;";
csb[18] = "Amnon\'s servant threw her out and bolted the door behind her. Now Tamar was wearing a long-sleeved garment, because this is what the king\'s virgin daughters wore.";
csb[19] = "Tamar put ashes on her head and tore the long-sleeved garment she was wearing. She put her hand on her head and went away crying out.";
csb[20] = "Her brother Absalom said to her: &quot;Has your brother Amnon been with you? Be quiet for now, my sister. He is your brother. Don\'t take this thing to heart.&quot; So Tamar lived as a desolate woman in the house of her brother Absalom.";
csb[21] = "When King David heard about all these things, he was furious.";
csb[22] = "Absalom didn\'t say anything to Amnon, either good or bad, because he hated Amnon since he disgraced his sister Tamar.";
csb[23] = "Two years later, Absalom\'s sheepshearers were at Baal-hazor near Ephraim, and Absalom invited all the king\'s sons.";
csb[24] = "Then he went to the king and said, &quot;Your servant has just hired sheepshearers. Will the king and his servants please come with your servant? &quot;";
csb[25] = "The king replied to Absalom, &quot;No, my son, we should not all go, or we would be a burden to you.&quot; Although Absalom urged him, he wasn\'t willing to go, though he did bless him.";
csb[26] = "&quot;If not,&quot; Absalom said, &quot;please let my brother Amnon go with us.&quot; The king asked him, &quot;Why should he go with you? &quot;";
csb[27] = "But Absalom urged him, so he sent Amnon and all the king\'s sons.";
csb[28] = "Now Absalom commanded his young men, &quot;Watch Amnon until he is in a good mood from the wine. When I order you to strike Amnon, then kill him. Don\'t be afraid. Am I not the one who has commanded you? Be strong and valiant! &quot;";
csb[29] = "So Absalom\'s young men did to Amnon just as Absalom had commanded. Then all the rest of the king\'s sons got up, and each fled on his mule.";
csb[30] = "While they were on the way, a report reached David: &quot;Absalom struck down all the king\'s sons; not even one of them survived! &quot;";
csb[31] = "In response the king stood up, tore his clothes, and lay down on the ground, and all his servants stood by with their clothes torn.";
csb[32] = "But Jonadab, son of David\'s brother Shimeah, spoke up: &quot;My lord must not think they have killed all the young men, the king\'s sons, because only Amnon is dead. In fact, Absalom has planned this ever since the day Amnon disgraced his sister Tamar.";
csb[33] = "&quot;So now, my lord the king, don\'t take seriously the report that says all the king\'s sons are dead. Only Amnon is dead.&quot;";
csb[34] = "Meanwhile, Absalom had fled. When the young man who was standing watch looked up, there were many people coming from the road west of him from the side of the mountain.";
csb[35] = "Jonadab said to the king, &quot;Look, the king\'s sons have come! It\'s exactly like your servant said.&quot;";
csb[36] = "Just as he finished speaking, the king\'s sons entered and wept loudly. Then the king and all his servants also wept very bitterly.";
csb[37] = "But Absalom fled and went to Talmai son of Ammihud, king of Geshur. And David mourned for his son every day.";
csb[38] = "After Absalom had fled to Geshur and had been there three years,";
csb[39] = "King David longed to go to Absalom, for David had finished grieving over Amnon\'s death.";

yng[2] = "And Amnon hath distress -- even to become sick, because of Tamar his sister, for she [is] a virgin, and it is hard in the eyes of Amnon to do anything to her.";
dby[2] = "And Amnon was so vexed, that he fell sick for his sister Tamar; for she was a virgin; and it seemed difficult for Amnon to do the least thing to her.";

rsv[4] = "And he said to him, &quot;O son of the king, why are you so haggard morning after morning? Will you not tell me?&quot; Amnon said to him, &quot;I love Tamar, my brother Ab\'salom\'s sister.&quot;";

yng[4] = "and saith to him, `Wherefore [art] thou thus lean, O king\'s son, morning by morning? dost thou not declare to me?\' And Amnon saith to him, `Tamar -- sister of Absalom my brother -- I am loving.\'";

rsv[5] = "Jon\'adab said to him, &quot;Lie down on your bed, and pretend to be ill; and when your father comes to see you, say to him, \'Let my sister Tamar come and give me bread to eat, and prepare the food in my sight, that I may see it, and eat it from her hand.\'&quot;";
asv[5] = "And Jonadab said unto him, Lay thee down on thy bed, and feign thyself sick: and when thy father cometh to see thee, say unto him, Let my sister Tamar come, I pray thee, and give me bread to eat, and dress the food in my sight, that I may see it, and eat it from her hand.";
yng[5] = "And Jonadab saith to him, `Lie down on thy couch, and feign thyself sick, and thy father hath come in to see thee, and thou hast said unto him, `Let, I pray thee, Tamar my sister come in and give me bread to eat; and she hath made the food before mine eyes so that I see [it], and have eaten from her hand.\'";

rsv[15] = "Then Amnon hated her with very great hatred; so that the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, &quot;Arise, be gone.&quot;";
asv[15] = "Then Amnon hated her with exceeding great hatred; for the hatred wherewith he hated her was greater than the love wherewith he had loved her. And Amnon said unto her, Arise, be gone.";
yng[15] = "And Amnon hateth her -- a very great hatred -- that greater [is] the hatred with which he hath hated her than the love with which he loved her, and Amnon saith to her, `Rise, go.\'";
dby[15] = "And Amnon hated her with an exceeding great hatred, for the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, Arise, be gone.";
web[15] = "Then Amnon hated her exceedingly; so that the hatred with which he hated her [was] greater than the love with which he had loved her. And Amnon said to her, Arise, be gone.";
hnv[15] = "Then Amnon hated her with exceeding great hatred; for the hatred with which he hated her was greater than the love with which he had loved her. Amnon said to her, Arise, be gone.";
vul[15] = "et exosam eam habuit Amnon magno odio nimis ita ut maius esset odium quo oderat eam amore quo ante dilexerat dixitque ei Amnon surge vade";
kjv[16] = "And she said unto him, [There is] no cause: this evil in sending me away [is] greater than the other that thou didst unto me. But he would not hearken unto her.";
rsv[16] = "But she said to him, &quot;No, my brother; for this wrong in sending me away is greater than the other which you did to me.&quot; But he would not listen to her.";
asv[16] = "And she said unto him, Not so, because this great wrong in putting me forth is [worse] than the other that thou didst unto me. But he would not hearken unto her.";
yng[16] = "And she saith to him, `Because of the circumstances this evil is greater than the other that thou hast done with me -- to send me away;\' and he hath not been willing to hearken to her,";
dby[16] = "And she said to him, There is no cause for this evil in sending me away, [which] is greater than the other that thou didst to me. But he would not hearken to her.";
web[16] = "And she said to him, [There is] no cause: this evil in sending me away [is] greater than the other that thou didst to me. But he would not hearken to her.";
hnv[16] = "She said to him, Not so, because this great wrong in putting me forth is [worse] than the other that you did to me. But he would not listen to her.";
vul[16] = "quae respondit ei maius est hoc malum quod nunc agis adversum me quam quod ante fecisti expellens me et noluit audire eam";
kjv[17] = "Then he called his servant that ministered unto him, and said, Put now this [woman] out from me, and bolt the door after her.";
rsv[17] = "He called the young man who served him and said, &quot;Put this woman out of my presence, and bolt the door after her.&quot;";
asv[17] = "Then he called his servant that ministered unto him, and said, Put now this woman out from me, and bolt the door after her.";
yng[17] = "and calleth his young man, his servant, and saith, `Send away, I pray thee, this one from me without, and bolt the door after her;\'";
dby[17] = "Then he called his young man that attended upon him, and said, Put now this [woman] out from me, and bolt the door after her.";
web[17] = "Then he called his servant that ministered to him, and said, Put now this [woman] out from me, and bolt the door after her.";
hnv[17] = "Then he called his servant who ministered to him, and said, Put now this woman out from me, and bolt the door after her.";
vul[17] = "sed vocato puero qui ministrabat ei dixit eice hanc a me foras et claude ostium post eam";
kjv[18] = "And [she had] a garment of divers colours upon her: for with such robes were the king\'s daughters [that were] virgins apparelled. Then his servant brought her out, and bolted the door after her.";
rsv[18] = "Now she was wearing a long robe with sleeves; for thus were the virgin daughters of the king clad of old. So his servant put her out, and bolted the door after her.";
asv[18] = "And she had a garment of divers colors upon her; for with such robes were the king\'s daughters that were virgins apparelled. Then his servant brought her out, and bolted the door after her.";
yng[18] = "-- and upon her [is] a long coat, for such upper robes do daughters of the king who [are] virgins put on, -- and his servant taketh her out without, and hath bolted the door after her.";
dby[18] = "Now she had a vest of many colours upon her; for so were the king\'s daughters that were virgins apparelled. And his attendant brought her out, and bolted the door after her.";
web[18] = "And [she had] a garment of divers colors upon her: for with such robes were the king\'s daughters [that were] virgins appareled. Then his servant brought her out, and bolted the door after her.";
hnv[18] = "She had a garment of various colors on her; for with such robes were the king\'s daughters who were virgins dressed. Then his servant brought her out, and bolted the door after her.";
vul[18] = "quae induta erat talari tunica huiuscemodi enim filiae regis virgines vestibus utebantur eiecit itaque eam minister illius foras clausitque fores post eam";
kjv[19] = "And Tamar put ashes on her head, and rent her garment of divers colours that [was] on her, and laid her hand on her head, and went on crying.";
rsv[19] = "And Tamar put ashes on her head, and rent the long robe which she wore; and she laid her hand on her head, and went away, crying aloud as she went.";
asv[19] = "And Tamar put ashes on her head, and rent her garment of divers colors that was on her; and she laid her hand on her head, and went her way, crying aloud as she went.";
yng[19] = "And Tamar taketh ashes for her head, and the long coat that [is] on her she hath rent, and putteth her hand on her head, and goeth, going on and crying;";
dby[19] = "And Tamar put ashes on her head, and rent her vest of many colours which was on her, and laid her hand on her head, and went away, crying out as she went.";
web[19] = "And Tamar put ashes on her head, and rent her garment of divers colors that [was] on her, and laid her hand on her head, and went on crying.";
hnv[19] = "Tamar put ashes on her head, and tore her garment of various colors that was on her; and she laid her hand on her head, and went her way, crying aloud as she went.";
vul[19] = "quae aspergens cinerem capiti suo scissa talari tunica inpositisque manibus super caput suum ibat ingrediens et clamans";
kjv[20] = "And Absalom her brother said unto her, Hath Amnon thy brother been with thee? but hold now thy peace, my sister: he [is] thy brother; regard not this thing. So Tamar remained desolate in her brother Absalom\'s house.";
rsv[20] = "And her brother Ab\'salom said to her, &quot;Has Amnon your brother been with you? Now hold your peace, my sister; he is your brother; do not take this to heart.&quot; So Tamar dwelt, a desolate woman, in her brother Ab\'salom\'s house.";
asv[20] = "And Absalom her brother said unto her, Hath Amnon thy brother been with thee? but now hold thy peace, my sister: he is thy brother; take not this thing to heart. So Tamar remained desolate in her brother Absalom\'s house.";
yng[20] = "and Absalom her brother saith unto her, `Hath Amnon thy brother been with thee? and now, my sister, keep silent, he [is] thy brother; set not thy heart to this thing;\' and Tamar dwelleth -- but desolate -- in the house of Absalom her brother.";
dby[20] = "And Absalom her brother said to her, Has Amnon thy brother been with thee? and now, my sister, be still: he is thy brother; take not this thing to heart. And Tamar remained, and [that] desolate, in her brother Absalom\'s house.";
web[20] = "And Absalom her brother said to her, Hath Amnon thy brother been with thee? but hold now thy peace, my sister: he [is] thy brother; regard not this thing. So Tamar remained desolate in her brother Absalom\'s house.";
hnv[20] = "Avshalom her brother said to her, Has Amnon your brother been with you? but now hold your shalom, my sister: he is your brother; don\'t take this thing to heart. So Tamar remained desolate in her brother Avshalom\'s house.";
vul[20] = "dixit autem ei Absalom frater suus num Amnon frater tuus concubuit tecum sed nunc soror tace frater tuus est neque adfligas cor tuum pro re hac mansit itaque Thamar contabescens in domo Absalom fratris sui";
kjv[21] = "But when king David heard of all these things, he was very wroth.";
rsv[21] = "When King David heard of all these things, he was very angry.";
asv[21] = "But when king David heard of all these things, he was very wroth.";
yng[21] = "And king David hath heard all these things, and it is very displeasing to him;";
dby[21] = "And king David heard of all these things, and he was very angry.";
web[21] = "But when king David heard of all these things, he was very wroth.";
hnv[21] = "But when king David heard of all these things, he was very angry.";
vul[21] = "cum autem audisset rex David verba haec contristatus est valde";
kjv[22] = "And Absalom spake unto his brother Amnon neither good nor bad: for Absalom hated Amnon, because he had forced his sister Tamar.";
rsv[22] = "But Ab\'salom spoke to Amnon neither good nor bad; for Ab\'salom hated Amnon, because he had forced his sister Tamar.";
asv[22] = "And Absalom spake unto Amnon neither good nor bad; for Absalom hated Amnon, because he had forced his sister Tamar.";
yng[22] = "and Absalom hath not spoken with Amnon either evil or good, for Absalom is hating Amnon, because that he humbled Tamar his sister.";
dby[22] = "And Absalom spoke to Amnon neither good nor bad; for Absalom hated Amnon, because he had humbled his sister Tamar.";
web[22] = "And Absalom spoke to his brother Amnon neither good nor bad: for Absalom hated Amnon, because he had forced his sister Tamar.";
hnv[22] = "Avshalom spoke to Amnon neither good nor bad; for Avshalom hated Amnon, because he had forced his sister Tamar.";
vul[22] = "porro non est locutus Absalom ad Amnon nec malum nec bonum oderat enim Absalom Amnon eo quod violasset Thamar sororem suam";
kjv[23] = "And it came to pass after two full years, that Absalom had sheepshearers in Baalhazor, which [is] beside Ephraim: and Absalom invited all the king\'s sons.";
rsv[23] = "After two full years Ab\'salom had sheepshearers at Ba\'al-ha\'zor, which is near E\'phraim, and Ab\'salom invited all the king\'s sons.";
asv[23] = "And it came to pass after two full years, that Absalom had sheep-shearers in Baal-hazor, which is beside Ephraim: and Absalom invited all the king\'s sons.";
yng[23] = "And it cometh to pass, after two years of days, that Absalom hath shearers in Baal-Hazor, which [is] with Ephraim, and Absalom calleth for all the sons of the king.";
dby[23] = "And it came to pass after two full years, that Absalom had sheepshearers in Baal-Hazor, which is beside Ephraim; and Absalom invited all the king\'s sons.";
web[23] = "And it came to pass after two full years, that Absalom had sheep-shearers in Baal-hazor, which [is] beside Ephraim: and Absalom invited all the king\'s sons.";
hnv[23] = "It happened after two full years, that Avshalom had sheep-shearers in Ba`al-Hatzor, which is beside Efrayim: and Avshalom invited all the king\'s sons.";
vul[23] = "factum est autem post tempus biennii ut tonderentur oves Absalom in Baalasor quae est iuxta Ephraim et vocavit Absalom omnes filios regis";
kjv[24] = "And Absalom came to the king, and said, Behold now, thy servant hath sheepshearers; let the king, I beseech thee, and his servants go with thy servant.";
rsv[24] = "And Ab\'salom came to the king, and said, &quot;Behold, your servant has sheepshearers; pray let the king and his servants go with your servant.&quot;";
asv[24] = "And Absalom came to the king, and said, Behold now, thy servant hath sheep-shearers; let the king, I pray thee, and his servants go with thy servant.";
yng[24] = "And Absalom cometh unto the king, and saith, `Lo, I pray thee, thy servant hath shearers, let the king go, I pray thee, and his servants, with thy servant.\'";
dby[24] = "And Absalom came to the king, and said, Behold, now, thy servant has sheepshearers; let the king, I pray thee, and his servants go with thy servant.";
web[24] = "And Absalom came to the king, and said, Behold now, thy servant hath sheep-shearers; let the king, I beseech thee, and his servants go with thy servant.";
hnv[24] = "Avshalom came to the king, and said, See now, your servant has sheep-shearers; let the king, I pray you, and his servants go with your servant.";
vul[24] = "venitque ad regem et ait ad eum ecce tondentur oves servi tui veniat oro rex cum servis suis ad servum suum";
kjv[25] = "And the king said to Absalom, Nay, my son, let us not all now go, lest we be chargeable unto thee. And he pressed him: howbeit he would not go, but blessed him.";
rsv[25] = "But the king said to Ab\'salom, &quot;No, my son, let us not all go, lest we be burdensome to you.&quot; He pressed him, but he would not go but gave him his blessing.";
asv[25] = "And the king said to Absalom, Nay, my son, let us not all go, lest we be burdensome unto thee. And he pressed him: howbeit he would not go, but blessed him.";
yng[25] = "And the king saith unto Absalom, `Nay, my son, let us not all go, I pray thee, and we are not too heavy on thee;\' and he presseth on him, and he hath not been willing to go, and he blesseth him.";
dby[25] = "And the king said to Absalom, No, my son, let us not all go, lest we be burdensome to thee. And he urged him, but he would not go; and he blessed him.";
web[25] = "And the king said to Absalom, Nay, my son, let us not all now go, lest we be chargeable to thee. And he pressed him: yet he would not go, but blessed him.";
hnv[25] = "The king said to Avshalom, No, my son, let us not all go, lest we be burdensome to you. He pressed him: however he would not go, but blessed him.";
vul[25] = "dixitque rex ad Absalom noli fili mi noli rogare ut veniamus omnes et gravemus te cum autem cogeret eum et noluisset ire benedixit ei";
kjv[26] = "Then said Absalom, If not, I pray thee, let my brother Amnon go with us. And the king said unto him, Why should he go with thee?";
rsv[26] = "Then Ab\'salom said, &quot;If not, pray let my brother Amnon go with us.&quot; And the king said to him, &quot;Why should he go with you?&quot;";
asv[26] = "Then said Absalom, If not, I pray thee, let my brother Amnon go with us. And the king said unto him, Why should he go with thee?";
yng[26] = "And Absalom saith, `If not -- let, I pray thee, Amnon my brother go with us;\' and the king saith to him, `Why doth he go with thee?\'";
dby[26] = "And Absalom said, If not, I pray thee, let my brother Amnon go with us. And the king said to him, Why should he go with thee?";
web[26] = "Then said Absalom, If not, I pray thee, let my brother Amnon go with us. And the king said to him, Why should he go with thee?";
hnv[26] = "Then said Avshalom, If not, please let my brother Amnon go with us. The king said to him, Why should he go with you?";
vul[26] = "et ait Absalom si non vis venire veniat obsecro nobiscum saltem Amnon frater meus dixitque ad eum rex non est necesse ut vadat tecum";
kjv[27] = "But Absalom pressed him, that he let Amnon and all the king\'s sons go with him.";
rsv[27] = "But Ab\'salom pressed him until he let Amnon and all the king\'s sons go with him.";
asv[27] = "But Absalom pressed him, and he let Amnon and all the king\'s sons go with him.";
yng[27] = "and Absalom urgeth on him, and he sendeth with him Amnon, and all the sons of the king.";
dby[27] = "But Absalom pressed him; and he let Amnon and all the king\'s sons go with him.";
web[27] = "But Absalom pressed him that he should let Amnon and all the king\'s sons go with him.";
hnv[27] = "But Avshalom pressed him, and he let Amnon and all the king\'s sons go with him.";
vul[27] = "coegit itaque eum Absalom et dimisit cum eo Amnon et universos filios regis";
kjv[28] = "Now Absalom had commanded his servants, saying, Mark ye now when Amnon\'s heart is merry with wine, and when I say unto you, Smite Amnon; then kill him, fear not: have not I commanded you? be courageous, and be valiant.";
rsv[28] = "Then Ab\'salom commanded his servants, &quot;Mark when Amnon\'s heart is merry with wine, and when I say to you, \'Strike Amnon,\' then kill him. Fear not; have I not commanded you? Be courageous and be valiant.&quot;";
asv[28] = "And Absalom commanded his servants, saying, Mark ye now, when Amnon\'s heart is merry with wine; and when I say unto you, Smite Amnon, then kill him; fear not; have not I commanded you? be courageous, and be valiant.";
yng[28] = "And Absalom commandeth his young men, saying, `See, I pray thee, when the heart of Amnon [is] glad with wine, and I have said unto you, Smite Amnon, that ye have put him to death; fear not; is it not because I have commanded you? be strong, yea, become sons of valour.\'";
dby[28] = "And Absalom commanded his servants, saying, Mark ye now when Amnon\'s heart is merry with wine, and when I say to you, Smite Amnon; then slay him, fear not: have not I commanded you? be courageous, and be valiant.";
web[28] = "Now Absalom had commanded his servants, saying, Mark ye now when Amnon\'s heart is merry with wine, and when I say to you, Smite Amnon; then kill him, fear not: have I not commanded you? be courageous, and be valiant.";
hnv[28] = "Avshalom commanded his servants, saying, Mark you now, when Amnon\'s heart is merry with wine; and when I tell you, Smite Amnon, then kill him; don\'t be afraid; haven\'t I commanded you? be courageous, and be valiant.";
vul[28] = "praeceperat autem Absalom pueris suis dicens observate cum temulentus fuerit Amnon vino et dixero vobis percutite eum et interficite nolite timere ego enim sum qui praecepi vobis roboramini et estote viri fortes";
kjv[29] = "And the servants of Absalom did unto Amnon as Absalom had commanded. Then all the king\'s sons arose, and every man gat him up upon his mule, and fled.";
rsv[29] = "So the servants of Ab\'salom did to Amnon as Ab\'salom had commanded. Then all the king\'s sons arose, and each mounted his mule and fled.";
asv[29] = "And the servants of Absalom did unto Amnon as Absalom had commanded. Then all the king\'s sons arose, and every man gat him up upon his mule, and fled.";
yng[29] = "And the young men of Absalom do to Amnon as Absalom commanded, and rise do all the sons of the king, and they ride, each on his mule, and flee.";
dby[29] = "And the servants of Absalom did to Amnon as Absalom had commanded. Then all the king\'s sons arose, and they rode each upon his mule and fled.";
web[29] = "And the servants of Absalom did to Amnon as Absalom had commanded. Then all the king\'s sons arose, and every man rode upon his mule, and fled.";
hnv[29] = "The servants of Avshalom did to Amnon as Avshalom had commanded. Then all the king\'s sons arose, and every man got him up on his mule, and fled.";
vul[29] = "fecerunt ergo pueri Absalom adversum Amnon sicut praeceperat eis Absalom surgentesque omnes filii regis ascenderunt singuli mulas suas et fugerunt";
kjv[30] = "And it came to pass, while they were in the way, that tidings came to David, saying, Absalom hath slain all the king\'s sons, and there is not one of them left.";
rsv[30] = "While they were on the way, tidings came to David, &quot;Ab\'salom has slain all the king\'s sons, and not one of them is left.&quot;";
asv[30] = "And it came to pass, while they were in the way, that the tidings came to David, saying, Absalom hath slain all the king\'s sons, and there is not one of them left.";
yng[30] = "And it cometh to pass -- they [are] in the way -- and the report hath come unto David, saying, `Absalom hath smitten all the sons of the king, and there is not left of them one;\'";
dby[30] = "And it came to pass, while they were in the way, that tidings came to David, saying, Absalom has smitten all the king\'s sons, and there is not one of them left.";
web[30] = "And it came to pass, while they were in the way, that information came to David, saying, Absalom hath slain all the king\'s sons, and there is not one of them left.";
hnv[30] = "It happened, while they were in the way, that the news came to David, saying, Avshalom has slain all the king\'s sons, and there is not one of them left.";
vul[30] = "cumque adhuc pergerent in itinere fama praevenit ad David dicens percussit Absalom omnes filios regis et non remansit ex eis saltem unus";
kjv[31] = "Then the king arose, and tare his garments, and lay on the earth; and all his servants stood by with their clothes rent.";
rsv[31] = "Then the king arose, and rent his garments, and lay on the earth; and all his servants who were standing by rent their garments.";
asv[31] = "Then the king arose, and rent his garments, and lay on the earth; and all his servants stood by with their clothes rent.";
yng[31] = "and the king riseth, and rendeth his garments, and lieth on the earth, and all his servants are standing by [with] rent garments.";
dby[31] = "Then the king arose, and rent his garments, and lay on the earth; and all his servants stood by with their garments rent.";
web[31] = "Then the king arose, and tore his garments, and lay on the earth; and all his servants stood by with their clothes rent.";
hnv[31] = " Then the king arose, and tore his garments, and lay on the eretz; and all his servants stood by with their clothes torn.";
vul[31] = "surrexit itaque rex et scidit vestimenta sua et cecidit super terram et omnes servi ipsius qui adsistebant ei sciderunt vestimenta sua";
kjv[32] = "And Jonadab, the son of Shimeah David\'s brother, answered and said, Let not my lord suppose [that] they have slain all the young men the king\'s sons; for Amnon only is dead: for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar.";
rsv[32] = "But Jon\'adab the son of Shim\'e-ah, David\'s brother, said, &quot;Let not my lord suppose that they have killed all the young men the king\'s sons, for Amnon alone is dead, for by the command of Ab\'salom this has been determined from the day he forced his sister Tamar.";
asv[32] = "And Jonadab, the son of Shimeah, David\'s brother, answered and said, Let not my lord suppose that they have killed all the young men the king\'s sons; for Amnon only is dead: for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar.";
yng[32] = "And Jonadab son of Shimeah, David\'s brother, answereth and saith, `Let not my lord say, The whole of the young men, the sons of the king, they have put to death; for Amnon alone [is] dead, for by the command of Absalom it hath been appointed from the day of his humbling Tamar his sister;";
dby[32] = "And Jonadab, the son of Shimeah David\'s brother, answered and said, Let not my lord suppose that they have slain all the young men the king\'s sons; for Amnon only is dead; for by the appointment of Absalom this has been determined from the day that he humbled his sister Tamar.";
web[32] = "And Jonadab, the son of Shimeah David\'s brother, answered and said, Let not my lord suppose [that] they have slain all the young men the king\'s sons; for Amnon only is dead: for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar.";
hnv[32] = "Yehonadav, the son of Shim`a, David\'s brother, answered, Don\'t let my lord suppose that they have killed all the young men the king\'s sons; for Amnon only is dead; for by the appointment of Avshalom this has been determined from the day that he forced his sister Tamar.";
vul[32] = "respondens autem Ionadab filius Samaa fratris David dixit ne aestimet dominus meus quod omnes pueri filii regis occisi sint Amnon solus mortuus est quoniam in ore Absalom erat positus ex die qua oppressit Thamar sororem eius";
kjv[33] = "Now therefore let not my lord the king take the thing to his heart, to think that all the king\'s sons are dead: for Amnon only is dead.";
rsv[33] = "Now therefore let not my lord the king so take it to heart as to suppose that all the king\'s sons are dead; for Amnon alone is dead.&quot;";
asv[33] = "Now therefore let not my lord the king take the thing to his heart, to think that all the king\'s sons are dead; for Amnon only is dead.";
yng[33] = "and now, let not my lord the king lay unto his heart the word, saying, All the sons of the king have died, for Amnon alone [is] dead.\'";
dby[33] = "And now let not my lord the king take the thing to heart, to say, All the king\'s sons are dead; for Amnon only is dead.";
web[33] = "Now therefore let not my lord the king take the thing to his heart, to think that all the king\'s sons are dead: for Amnon only is dead.";
hnv[33] = "Now therefore don\'t let my lord the king take the thing to his heart, to think that all the king\'s sons are dead; for Amnon only is dead.";
vul[33] = "nunc ergo ne ponat dominus meus rex super cor suum verbum istud dicens omnes filii regis occisi sunt quoniam Amnon solus mortuus est";
kjv[34] = "But Absalom fled. And the young man that kept the watch lifted up his eyes, and looked, and, behold, there came much people by the way of the hill side behind him.";
rsv[34] = "But Ab\'salom fled. And the young man who kept the watch lifted up his eyes, and looked, and behold, many people were coming from the Horona\'im road by the side of the mountain.";
asv[34] = "But Absalom fled. And the young man that kept the watch lifted up his eyes, and looked, and, behold, there came much people by the way of the hill-side behind him.";
yng[34] = "And Absalom fleeth, and the young man who is watching lifteth up his eyes and looketh, and lo, much people are coming by the way behind him, on the side of the hill.";
dby[34] = "And Absalom fled. And the young man that watched lifted up his eyes and looked, and behold, there came much people from the way behind him, from the hill-side.";
web[34] = "But Absalom fled. And the young man that kept the watch lifted up his eyes, and looked, and behold, there came many people by the way of the hillside behind him.";
hnv[34] = "But Avshalom fled. The young man who kept the watch lifted up his eyes, and looked, and, behold, there came much people by the way of the hill-side behind him.";
vul[34] = "fugit autem Absalom et levavit puer speculator oculos suos et aspexit et ecce populus multus veniebat per iter devium ex latere montis";
kjv[35] = "And Jonadab said unto the king, Behold, the king\'s sons come: as thy servant said, so it is.";
rsv[35] = "And Jon\'adab said to the king, &quot;Behold, the king\'s sons have come; as your servant said, so it has come about.&quot;";
asv[35] = "And Jonadab said unto the king, Behold, the king\'s sons are come: as thy servant said, so it is.";
yng[35] = "And Jonadab saith unto the king, `Lo, the sons of the king have come; as the word of thy servant, so it hath been.\'";
dby[35] = "And Jonadab said to the king, Behold, the king\'s sons come: as thy servant said, so it is.";
web[35] = "And Jonadab said to the king, Behold, the king\'s sons come; as thy servant said, so it is.";
hnv[35] = "Yehonadav said to the king, Behold, the king\'s sons are come: as your servant said, so it is.";
vul[35] = "dixit autem Ionadab ad regem ecce filii regis adsunt iuxta verbum servi tui sic factum est";
kjv[36] = "And it came to pass, as soon as he had made an end of speaking, that, behold, the king\'s sons came, and lifted up their voice and wept: and the king also and all his servants wept very sore.";
rsv[36] = "And as soon as he had finished speaking, behold, the king\'s sons came, and lifted up their voice and wept; and the king also and all his servants wept very bitterly.";
asv[36] = "And it came to pass, as soon as he had made an end of speaking, that, behold, the king\'s sons came, and lifted up their voice, and wept: and the king also and all his servants wept very sore.";
yng[36] = "And it cometh to pass at his finishing to speak, that lo, the sons of the king have come, and they lift up their voice, and weep, and also the king and all his servants have wept -- a very great weeping.";
dby[36] = "And as soon as he had ended speaking, behold, the king\'s sons came, and lifted up their voice and wept; and the king also and all his servants wept very bitterly.";
web[36] = "And it came to pass, as soon as he had made an end of speaking, that behold, the king\'s sons came, and lifted up their voice and wept: and the king also and all his servants wept exceedingly.";
hnv[36] = "It happened, as soon as he had made an end of speaking, that behold, the king\'s sons came, and lifted up their voice, and wept: and the king also and all his servants wept very sore.";
vul[36] = "cumque cessasset loqui apparuerunt et filii regis et intrantes levaverunt vocem suam et fleverunt sed et rex et omnes servi eius fleverunt ploratu magno nimis";
kjv[37] = "But Absalom fled, and went to Talmai, the son of Ammihud, king of Geshur. And [David] mourned for his son every day.";
rsv[37] = "But Ab\'salom fled, and went to Talmai the son of Ammi\'hud, king of Geshur. And David mourned for his son day after day.";
asv[37] = "But Absalom fled, and went to Talmai the son of Ammihur, king of Geshur. And [David] mourned for his son every day.";
yng[37] = "And Absalom hath fled, and goeth unto Talmai, son of Ammihud, king of Geshur, and [David] mourneth for his son all the days.";
dby[37] = "And Absalom fled, and went to Talmai, the son of Ammihud, king of Geshur. And [David] mourned for his son every day.";
web[37] = "But Absalom fled, and went to Talmai, the son of Ammihud, king of Geshur. And [David] mourned for his son every day.";
hnv[37] = "But Avshalom fled, and went to Talmai the son of `Ammihud, king of Geshur. [David] mourned for his son every day.";
vul[37] = "porro Absalom fugiens abiit ad Tholomai filium Amiur regem Gessur luxit ergo David filium suum cunctis diebus";
kjv[38] = "So Absalom fled, and went to Geshur, and was there three years.";
rsv[38] = "So Ab\'salom fled, and went to Geshur, and was there three years.";
asv[38] = "So Absalom fled, and went to Geshur, and was there three years.";
yng[38] = "And Absalom hath fled, and goeth to Geshur, and is there three years;";
dby[38] = "Now Absalom fled, and went to Geshur, and was there three years.";
web[38] = "So Absalom fled, and went to Geshur, and was there three years.";
hnv[38] = "So Avshalom fled, and went to Geshur, and was there three years.";
vul[38] = "Absalom autem cum fugisset et venisset in Gessur fuit ibi tribus annis";
kjv[39] = "And [the soul of] king David longed to go forth unto Absalom: for he was comforted concerning Amnon, seeing he was dead.";
rsv[39] = "And the spirit of the king longed to go forth to Ab\'salom; for he was comforted about Amnon, seeing he was dead.";
asv[39] = "And [the soul of] king David longed to go forth unto Absalom: for he was comforted concerning Amnon, seeing he was dead.";
yng[39] = "and [the soul of] king David determineth to go out unto Absalom, for he hath been comforted for Amnon, for [he is] dead.";
dby[39] = "And king David longed to go forth to Absalom; for he was comforted concerning Amnon, seeing he was dead.";
web[39] = "And [the soul of] king David longed to go forth to Absalom: for he was comforted concerning Amnon, seeing he was dead.";
hnv[39] = "[the soul of] king David longed to go forth to Avshalom: for he was comforted concerning Amnon, seeing he was dead.";
vul[39] = "cessavitque David rex persequi Absalom eo quod consolatus esset super Amnon interitu";
</script>
