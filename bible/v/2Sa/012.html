csb[1] = "So the LORD sent Nathan to David. When he arrived, he said to him: There were two men in a certain city, one rich and the other poor.";
csb[2] = "The rich man had very large flocks and herds,";
csb[3] = "but the poor man had nothing except one small ewe lamb that he had bought. He raised her, and she grew up with him and with his children. From his meager food she would eat, from his cup she would drink, and in his arms she would sleep. She was like a daughter to him.";
csb[4] = "Now a traveler came to the rich man, but the rich man could not bring himself to take one of his own sheep or cattle to prepare for the traveler who had come to him. Instead, he took the poor man\'s lamb and prepared it for his guest.";
csb[5] = "David was infuriated with the man and said to Nathan: &quot;As the LORD lives, the man who did this deserves to die!";
csb[6] = "&quot;Because he has done this thing and shown no pity, he must pay four lambs for that lamb.&quot;";
csb[7] = "Nathan replied to David, &quot;You are the man! This is what the LORD God of Israel says: \'I anointed you king over Israel, and I rescued you from Saul.";
csb[8] = "&quot;I gave your master\'s house to you and your master\'s wives into your arms, and I gave you the house of Israel and Judah, and if that was not enough, I would have given you even more.";
csb[9] = "&quot;Why then have you despised the LORD\'s command by doing what I consider evil? You struck down Uriah the Hethite with the sword and took his wife as your own wife -- you murdered him with the Ammonite\'s sword.";
csb[10] = "&quot;Now therefore, the sword will never leave your house because you despised me and took the wife of Uriah the Hethite to be your own wife.\'";
csb[11] = "&quot;This is what the LORD says, \'I am going to bring disaster on you from your own family: I will take your wives and give them to another before your very eyes, and he will sleep with them in broad daylight.";
csb[12] = "&quot;You acted in secret, but I will do this before all Israel and in broad daylight.\' &quot;";
csb[13] = "David responded to Nathan, &quot;I have sinned against the LORD.&quot; Then Nathan replied to David, &quot;And the LORD has taken away your sin; you will not die.";
csb[14] = "&quot;However, because you treated the LORD with such contempt in this matter, the son born to you will die.&quot;";
csb[15] = "Then Nathan went home. The LORD struck the baby that Uriah\'s wife had borne to David, and he became deathly ill.";
csb[16] = "David pleaded with God for the boy. He fasted, went home, and spent the night lying on the ground.";
csb[17] = "The elders of his house stood beside him to get him up from the ground, but he was unwilling and would not eat anything with them.";
csb[18] = "On the seventh day the baby died. But David\'s servants were afraid to tell him the baby was dead. They said, &quot;Look, while the baby was alive, we spoke to him, and he wouldn\'t listen to us. So how can we tell him the baby is dead? He may do something desperate.&quot;";
csb[19] = "When David saw that his servants were whispering to each other, he guessed that the baby was dead. So he asked his servants, &quot;Is the baby dead? &quot; &quot;He is dead,&quot; they replied.";
csb[20] = "Then David got up from the ground. He washed, anointed himself, changed his clothes, went to the LORD\'s house, and worshiped. Then he went home and requested something to eat. So they served him food, and he ate.";
csb[21] = "His servants asked him, &quot;Why have you done this? While the baby was alive, you fasted and wept, but when he died, you got up and ate food.&quot;";
csb[22] = "He answered, &quot;While the baby was alive, I fasted and wept because I thought, \'Who knows? The LORD may be gracious to me and let him live.\'";
csb[23] = "&quot;But now that he is dead, why should I fast? Can I bring him back again? I\'ll go to him, but he will never return to me.&quot;";
csb[24] = "Then David comforted his wife Bathsheba; he went to her and slept with her. She gave birth to a son and named him Solomon. The LORD loved him,";
csb[25] = "and he sent a message through the prophet Nathan, who named him Jedidiah, because of the LORD.";
csb[26] = "Joab fought against Rabbah of the Ammonites and captured the royal fortress.";
csb[27] = "Then Joab sent messengers to David to say, &quot;I have fought against Rabbah and have also captured its water supply.";
csb[28] = "&quot;Now therefore, assemble the rest of the troops, lay siege to the city, and capture it. Otherwise I will be the one to capture the city, and it will be named after me.&quot;";
csb[29] = "So David assembled all the troops and went to Rabbah; he fought against it and captured it.";
csb[30] = "He took the crown from the head of their king, and it was placed on David\'s head. The crown weighed seventy-five pounds of gold, and it had a precious stone in it. In addition, David took away a large quantity of plunder from the city.";
csb[31] = "He removed the people who were in the city and put them to work with saws, iron picks, and iron axes, and to labor at brickmaking. He did the same to all the Ammonite cities. Then he and all his troops returned to Jerusalem.";

rsv[17] = "And the elders of his house stood beside him, to raise him from the ground; but he would not, nor did he eat food with them.";
asv[17] = "And the elders of his house arose, [and stood] beside him, to raise him up from the earth: but he would not, neither did he eat bread with them.";
yng[17] = "And the elders of his house rise against him, to raise him up from the earth, and he hath not been willing, nor hath he eaten with them bread;";
dby[17] = "And the elders of his house arose, [and went] to him, to raise him up from the earth; but he would not, and he ate no bread with them.";
web[17] = "And the elders of his house arose, [and went] to him, to raise him from the earth: but he would not, neither did he eat bread with them.";
hnv[17] = "The Zakenim of his house arose, [and stood] beside him, to raise him up from the eretz: but he would not, neither did he eat bread with them.";
vul[17] = "venerunt autem seniores domus eius cogentes eum ut surgeret de terra qui noluit neque comedit cum eis cibum";
kjv[18] = "And it came to pass on the seventh day, that the child died. And the servants of David feared to tell him that the child was dead: for they said, Behold, while the child was yet alive, we spake unto him, and he would not hearken unto our voice: how will he then vex himself, if we tell him that the child is dead?";
rsv[18] = "On the seventh day the child died. And the servants of David feared to tell him that the child was dead; for they said, &quot;Behold, while the child was yet alive, we spoke to him, and he did not listen to us; how then can we say to him the child is dead? He may do himself some harm.&quot;";
asv[18] = "And it came to pass on the seventh day, that the child died. And the servants of David feared to tell him that the child was dead; for they said, Behold, while the child was yet alive, we spake unto him, and he hearkened not unto our voice: how will he then vex himself, if we tell him that the child is dead!";
yng[18] = "and it cometh to pass on the seventh day, that the lad dieth, and the servants of David fear to declare to him that the lad is dead, for they said, `Lo, in the lad being alive we spake unto him, and he did not hearken to our voice; and how do we say unto him, The lad is dead? -- then he hath done evil.\'";
dby[18] = "And it came to pass on the seventh day, that the child died. And the servants of David feared to tell him that the child was dead; for they said, Behold, while the child was yet alive, we spoke to him, and he would not hearken to our voice; and how shall we say to him, The child is dead? he may do some harm.";
web[18] = "And it came to pass on the seventh day, that the child died. And the servants of David feared to tell him that the child was dead: for they said, Behold while the child was yet alive, we spoke to him, and he would not hearken to our voice: how will he then be grieved, if we tell him that the child is dead?";
hnv[18] = "It happened on the seventh day, that the child died. The servants of David feared to tell him that the child was dead; for they said, Behold, while the child was yet alive, we spoke to him, and he didn\'t listen to our voice: how will he then vex himself, if we tell him that the child is dead!";
vul[18] = "accidit autem die septima ut moreretur infans timueruntque servi David nuntiare ei quod mortuus esset parvulus dixerunt enim ecce cum parvulus adhuc viveret loquebamur ad eum et non audiebat vocem nostram quanto magis si dixerimus mortuus est puer se adfliget";
kjv[19] = "But when David saw that his servants whispered, David perceived that the child was dead: therefore David said unto his servants, Is the child dead? And they said, He is dead.";
rsv[19] = "But when David saw that his servants were whispering together, David perceived that the child was dead; and David said to his servants, &quot;Is the child dead?&quot; They said, &quot;He is dead.&quot;";
asv[19] = "But when David saw that his servants were whispering together, David perceived that the child was dead; and David said unto his servants, Is the child dead? And they said, He is dead.";
yng[19] = "And David seeth that his servants are whispering, and David understandeth that the lad is dead, and David saith unto his servants, `Is the lad dead?\' and they say, `Dead.\'";
dby[19] = "But David saw that his servants whispered, and David perceived that the child was dead; and David said to his servants, Is the child dead? And they said, He is dead.";
web[19] = "But when David saw that his servants whispered, David perceived that the child was dead: therefore David said to his servants, Is the child dead? And they said, He is dead.";
hnv[19] = "But when David saw that his servants were whispering together, David perceived that the child was dead; and David said to his servants, Is the child dead? They said, He is dead.";
vul[19] = "cum ergo vidisset David servos suos musitantes intellexit quod mortuus esset infantulus dixitque ad servos suos num mortuus est puer qui responderunt ei mortuus est";
kjv[20] = "Then David arose from the earth, and washed, and anointed [himself], and changed his apparel, and came into the house of the LORD, and worshipped: then he came to his own house; and when he required, they set bread before him, and he did eat.";
rsv[20] = "Then David arose from the earth, and washed, and anointed himself, and changed his clothes; and he went into the house of the LORD, and worshiped; he then went to his own house; and when he asked, they set food before him, and he ate.";
asv[20] = "Then David arose from the earth, and washed, and anointed himself, and changed his apparel; and he came into the house of Jehovah, and worshipped: then he came to his own house; and when he required, they set bread before him, and he did eat.";
yng[20] = "And David riseth from the earth, and doth bathe and anoint [himself], and changeth his raiment, and cometh in to the house of Jehovah, and boweth himself, and cometh unto his house, and asketh and they place for him bread, and he eateth.";
dby[20] = "Then David arose from the earth, and washed, and anointed himself, and changed his clothing, and entered into the house of Jehovah and worshipped; then he came to his own house and required them to set bread before him, and he ate.";
web[20] = "Then David arose from the earth, and washed, and anointed [himself], and changed his apparel, and came into the house of the LORD, and worshiped: then he came to his own house; and when he required, they set bread before him, and he ate.";
hnv[20] = "Then David arose from the eretz, and washed, and anointed himself, and changed his clothing; and he came into the house of the LORD, and worshiped: then he came to his own house; and when he required, they set bread before him, and he ate.";
vul[20] = "surrexit igitur David de terra et lotus unctusque est cumque mutasset vestem ingressus est domum Domini et adoravit et venit in domum suam petivitque ut ponerent ei panem et comedit";
kjv[21] = "Then said his servants unto him, What thing [is] this that thou hast done? thou didst fast and weep for the child, [while it was] alive; but when the child was dead, thou didst rise and eat bread.";
rsv[21] = "Then his servants said to him, &quot;What is this thing that you have done? You fasted and wept for the child while it was alive; but when the child died, you arose and ate food.&quot;";
asv[21] = "Then said his servants unto him, What thing is this that thou hast done? thou didst fast and weep for the child, while it was alive; but when the child was dead, thou didst rise and eat bread.";
yng[21] = "And his servants say unto him, `What [is] this thing thou hast done? because of the living lad thou hast fasted and dost weep, and when the lad is dead thou hast risen and dost eat bread.\'";
dby[21] = "And his servants said to him, What thing is this which thou hast done? thou didst fast and weep for the child alive; but as soon as the child is dead, thou dost rise and eat bread.";
web[21] = "Then said his servants to him, What thing [is] this that thou hast done? thou didst fast and weep for the child, [while it was] alive; but after the child was dead, thou didst rise and eat bread.";
hnv[21] = "Then said his servants to him, What thing is this that you have done? you did fast and weep for the child, while it was alive; but when the child was dead, you did rise and eat bread.";
vul[21] = "dixerunt autem ei servi sui quis est sermo quem fecisti propter infantem cum adhuc viveret ieiunasti et flebas mortuo autem puero surrexisti et comedisti panem";
kjv[22] = "And he said, While the child was yet alive, I fasted and wept: for I said, Who can tell [whether] GOD will be gracious to me, that the child may live?";
rsv[22] = "He said, &quot;While the child was still alive, I fasted and wept; for I said, \'Who knows whether the LORD will be gracious to me, that the child may live?\'";
asv[22] = "And he said, While the child was yet alive, I fasted and wept: for I said, Who knoweth whether Jehovah will not be gracious to me, that the child may live?";
yng[22] = "And he saith, `While the lad is alive I have fasted, and weep, for I said, Who knoweth? -- Jehovah doth pity me, and the lad hath lived;";
dby[22] = "And he said, While the child was yet alive, I fasted and wept; for I thought, Who knows? [perhaps] Jehovah will be gracious to me, that the child may live.";
web[22] = "And he said, While the child was yet alive, I fasted, and wept: for I said, Who can tell [whether] GOD will be gracious to me, that the child may live?";
hnv[22] = "He said, While the child was yet alive, I fasted and wept: for I said, Who knows whether the LORD will not be gracious to me, that the child may live?";
vul[22] = "qui ait propter infantem dum adhuc viveret ieiunavi et flevi dicebam enim quis scit si forte donet eum mihi Dominus et vivet infans";
kjv[23] = "But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.";
rsv[23] = "But now he is dead; why should I fast? Can I bring him back again? I shall go to him, but he will not return to me.&quot;";
asv[23] = "But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he will not return to me.";
yng[23] = "and now, he hath died, why [is] this -- I fast? am I able to bring him back again? I am going unto him, and he doth not turn back unto me.\'";
dby[23] = "But now he is dead, why should I fast? can I bring him back again? I shall go to him, but he will not return to me.";
web[23] = "But now he is dead, Why should I fast? can I bring him back again? I shall go to him, but he will not return to me.";
hnv[23] = "But now he is dead, why should I fast? can I bring him back again? I shall go to him, but he will not return to me.";
vul[23] = "nunc autem quia mortuus est quare ieiuno numquid potero revocare eum amplius ego vadam magis ad eum ille vero non revertetur ad me";
kjv[24] = "And David comforted Bathsheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon: and the LORD loved him.";
rsv[24] = "Then David comforted his wife, Bathshe\'ba, and went in to her, and lay with her; and she bore a son, and he called his name Solomon. And the LORD loved him,";
asv[24] = "And David comforted Bath-sheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon. And Jehovah loved him;";
yng[24] = "And David comforteth Bath-Sheba his wife, and goeth in unto her, and lieth with her, and she beareth a son, and he calleth his name Solomon; and Jehovah hath loved him,";
dby[24] = "And David comforted Bathsheba his wife, and went in to her and lay with her; and she bore a son, and he called his name Solomon; and Jehovah loved him.";
web[24] = "And David comforted Bath-sheba his wife, and went in to her, and lay with her: and she bore a son, and he called his name Solomon: and the LORD loved him.";
hnv[24] = "David comforted Bat-Sheva his wife, and went in to her, and lay with her: and she bore a son, and he called his name Shlomo. The LORD loved him;";
vul[24] = "et consolatus est David Bethsabee uxorem suam ingressusque ad eam dormivit cum ea quae genuit filium et vocavit nomen eius Salomon et Dominus dilexit eum";
kjv[25] = "And he sent by the hand of Nathan the prophet; and he called his name Jedidiah, because of the LORD.";
rsv[25] = "and sent a message by Nathan the prophet; so he called his name Jedidi\'ah, because of the LORD.";
asv[25] = "and he sent by the hand of Nathan the prophet; and he called his name Jedidiah, for Jehovah\'s sake.";
yng[25] = "and sendeth by the hand of Nathan the prophet, and calleth his name Jedidiah, because of Jehovah.";
dby[25] = "And he sent by the hand of Nathan the prophet; and he called his name Jedidiah, for Jehovah\'s sake.";
web[25] = "And he sent by the hand of Nathan the prophet; and he called his name Jedidiah, because of the LORD.";
hnv[25] = "and he sent by the hand of Natan the prophet; and he named him Yedidyah, for the LORD\'s sake.";
vul[25] = "misitque in manu Nathan prophetae et vocavit nomen eius Amabilis Domino eo quod diligeret eum Dominus";
kjv[26] = "And Joab fought against Rabbah of the children of Ammon, and took the royal city.";
rsv[26] = "Now Jo\'ab fought against Rabbah of the Ammonites, and took the royal city.";
asv[26] = "Now Joab fought against Rabbah of the children of Ammon, and took the royal city.";
yng[26] = "And Joab fighteth against Rabbah of the Bene-Ammon, and captureth the royal city,";
dby[26] = "And Joab fought against Rabbah of the children of Ammon, and took the royal city.";
web[26] = "And Joab fought against Rabbah of the children of Ammon, and took the royal city.";
hnv[26] = "Now Yo\'av fought against Rabbah of the children of `Ammon, and took the royal city.";
vul[26] = "igitur pugnabat Ioab contra Rabbath filiorum Ammon et expugnabat urbem regiam";
kjv[27] = "And Joab sent messengers to David, and said, I have fought against Rabbah, and have taken the city of waters.";
rsv[27] = "And Jo\'ab sent messengers to David, and said, &quot;I have fought against Rabbah; moreover, I have taken the city of waters.";

yng[27] = "and Joab sendeth messengers unto David, and saith, `I have fought against Rabbah -- also I have captured the city of waters;";
dby[27] = "And Joab sent messengers to David, and said, I have fought against Rabbah, and have taken the city of waters.";
web[27] = "And Joab sent messengers to David, and said, I have fought against Rabbah, and have taken the city of waters.";
hnv[27] = "Yo\'av sent messengers to David, and said, I have fought against Rabbah; yes, I have taken the city of waters.";
vul[27] = "misitque Ioab nuntios ad David dicens dimicavi adversum Rabbath et capienda est urbs Aquarum";
kjv[28] = "Now therefore gather the rest of the people together, and encamp against the city, and take it: lest I take the city, and it be called after my name.";
rsv[28] = "Now, then, gather the rest of the people together, and encamp against the city, and take it; lest I take the city, and it be called by my name.&quot;";
asv[28] = "Now therefore gather the rest of the people together, and encamp against the city, and take it; lest I take the city, and it be called after my name.";
yng[28] = "and now, gather the rest of the people, and encamp against the city, and capture it, lest I capture the city, and my name hath been called upon it.\'";
dby[28] = "And now gather the rest of the people, and encamp against the city and take it: lest I take the city and it be called by my name.";
web[28] = "Now therefore collect the rest of the people, and encamp against the city, and take it: lest I take the city, and it be called after my name.";
hnv[28] = "Now therefore gather the rest of the people together, and encamp against the city, and take it; lest I take the city, and it be called after my name.";
vul[28] = "nunc igitur congrega reliquam partem populi et obside civitatem et cape eam ne cum a me vastata fuerit urbs nomini meo adscribatur victoria";
kjv[29] = "And David gathered all the people together, and went to Rabbah, and fought against it, and took it.";
rsv[29] = "So David gathered all the people together and went to Rabbah, and fought against it and took it.";
asv[29] = "And David gathered all the people together, and went to Rabbah, and fought against it, and took it.";
yng[29] = "And David gathereth all the people, and goeth to Rabbah, and fighteth against it, and captureth it;";
dby[29] = "And David gathered all the people, and went to Rabbah, and fought against it and took it.";
web[29] = "And David collected all the people, and went to Rabbah, and fought against it, and took it.";
hnv[29] = "David gathered all the people together, and went to Rabbah, and fought against it, and took it.";
vul[29] = "congregavit itaque David omnem populum et profectus est adversum Rabbath cumque dimicasset cepit eam";
kjv[30] = "And he took their king\'s crown from off his head, the weight whereof [was] a talent of gold with the precious stones: and it was [set] on David\'s head. And he brought forth the spoil of the city in great abundance.";
rsv[30] = "And he took the crown of their king from his head; the weight of it was a talent of gold, and in it was a precious stone; and it was placed on David\'s head. And he brought forth the spoil of the city, a very great amount.";
asv[30] = "And he took the crown of their king from off his head; and the weight thereof was a talent of gold, and [in it were] precious stones; and it was set on David\'s head. And he brought forth the spoil of the city, exceeding much.";
yng[30] = "and he taketh the crown of their king from off his head, and its weight [is] a talent of gold, and precious stones, and it is on the head of David; and the spoil of the city he hath brought out, very much;";
dby[30] = "And he took the crown of their king from off his head, the weight of which was a talent of gold with [the] precious stones; and it was [set] on David\'s head; and he brought forth the spoil of the city in great abundance.";
web[30] = "And he took their king\'s crown from off his head, the weight of which [was] a talent of gold with the precious stones: and it was [set] on David\'s head. And he brought forth the spoil of the city in great abundance.";
hnv[30] = "He took the crown of their king from off his head; and the weight of it was a talent of gold, and [in it were] precious stones; and it was set on David\'s head. He brought forth the spoil of the city, exceeding much.";
vul[30] = "et tulit diadema regis eorum de capite eius pondo auri talentum habens gemmas pretiosissimas et inpositum est super caput David sed et praedam civitatis asportavit multam valde";
kjv[31] = "And he brought forth the people that [were] therein, and put [them] under saws, and under harrows of iron, and under axes of iron, and made them pass through the brickkiln: and thus did he unto all the cities of the children of Ammon. So David and all the people returned unto Jerusalem.";
rsv[31] = "And he brought forth the people who were in it, and set them to labor with saws and iron picks and iron axes, and made them toil at the brickkilns; and thus he did to all the cities of the Ammonites. Then David and all the people returned to Jerusalem.";
asv[31] = "And he brought forth the people that were therein, and put them under saws, and under harrows of iron, and under axes of iron, and made them pass through the brickkiln: and thus did he unto all the cities of the children of Ammon. And David and all the people returned unto Jerusalem.";
yng[31] = "and the people who [are] in it he hath brought out, and setteth to the saw, and to cutting instruments of iron, and to axes of iron, and hath caused them to pass over into the brick-kiln; and so he doth to all the cities of the Bene-Ammon; and David turneth back, and all the people, to Jerusalem.";
dby[31] = "And he brought out the people that were in it, and put them under the saw, and under harrows of iron, and under axes of iron, and made them pass through the brickkilns. And so did he to all the cities of the children of Ammon. And David and all the people returned to Jerusalem.";
web[31] = "And he brought forth the people that [were] in it, and put [them] under saws, and under harrows of iron, and under axes of iron, and made them pass through the brick-kiln: and thus he did to all the cities of the children of Ammon. So David and all the people returned to Jerusalem.";
hnv[31] = "He brought forth the people who were therein, and put them under saws, and under harrows of iron, and under axes of iron, and made them pass through the brick kiln: and thus did he to all the cities of the children of `Ammon. David and all the people returned to Yerushalayim.";
vul[31] = "populum quoque eius adducens serravit et circumegit super eos ferrata carpenta divisitque cultris et transduxit in typo laterum sic fecit universis civitatibus filiorum Ammon et reversus est David et omnis exercitus Hierusalem";
