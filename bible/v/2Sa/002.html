csb[1] = "Some time later, David inquired of the LORD: &quot;Should I go to one of the towns of Judah? &quot; The LORD answered him, &quot;Go.&quot; Then David asked, &quot;Where should I go? &quot; &quot;To Hebron,&quot; the LORD replied.";
csb[2] = "So David went there with his two wives, Ahinoam the Jezreelite and Abigail, the widow of Nabal the Carmelite.";
csb[3] = "In addition, David brought the men who were with him, each one with his family, and they settled in the towns near Hebron.";
csb[4] = "Then the men of Judah came, and there they anointed David king over the house of Judah. They told David: &quot;It was the men of Jabesh-gilead who buried Saul.&quot;";
csb[5] = "David sent messengers to the men of Jabesh-gilead and said to them, &quot;The LORD bless you, because you have shown this kindness to Saul your lord when you buried him.";
csb[6] = "&quot;Now, may the LORD show kindness and faithfulness to you, and I will also show the same goodness to you because you have done this deed.";
csb[7] = "&quot;Therefore, be strong and valiant, for though Saul your lord is dead, the house of Judah has anointed me king over them.&quot;";
csb[8] = "Abner son of Ner, commander of Saul\'s army, took Saul\'s son Ish-bosheth and moved him to Mahanaim.";
csb[9] = "He made him king over Gilead, Asher, Jezreel, Ephraim, Benjamin -- over all Israel.";
csb[10] = "Saul\'s son Ish-bosheth was forty years old when he became king over Israel; he reigned for two years. The house of Judah, however, followed David.";
csb[11] = "The length of time that David was king in Hebron over the house of Judah was seven years and six months.";
csb[12] = "Abner son of Ner and soldiers of Ish-bosheth son of Saul marched out from Mahanaim to Gibeon.";
csb[13] = "So Joab son of Zeruiah and David\'s soldiers marched out and met them by the pool of Gibeon. The two groups took up positions on opposite sides of the pool.";
csb[14] = "Then Abner said to Joab, &quot;Let\'s have the young men get up and compete in front of us.&quot; &quot;Let them get up,&quot; Joab replied.";
csb[15] = "So they got up and were counted off -- twelve for Benjamin and Ish-bosheth son of Saul, and twelve from David\'s soldiers.";
csb[16] = "Then each man grabbed his opponent by the head and thrust his sword into his opponent\'s side so that they all died together. So this place, which is in Gibeon, is named Field of Blades.";
csb[17] = "The battle that day was extremely fierce, and Abner and the men of Israel were defeated by David\'s soldiers.";
csb[18] = "The three sons of Zeruiah were there: Joab, Abishai, and Asahel. Asahel was a fast runner, like one of the wild gazelles.";
csb[19] = "He chased Abner and did not turn to the right or the left in his pursuit of him.";
csb[20] = "Abner glanced back and said, &quot;Is that you, Asahel? &quot; &quot;Yes it is,&quot; Asahel replied.";
csb[21] = "Abner said to him, &quot;Turn to your right or left, seize one of the young soldiers, and take whatever you can get from him.&quot; But Asahel would not stop chasing him.";
csb[22] = "Once again, Abner warned Asahel, &quot;Stop chasing me. Why should I strike you to the ground? How could I ever look your brother Joab in the face? &quot;";
csb[23] = "But Asahel refused to turn away, so Abner hit him in the stomach with the butt of his spear. The spear went through his body, and he fell and died right there. As they all came to the place where Asahel had fallen and died, they stopped,";
csb[24] = "but Joab and Abishai pursued Abner. By sunset, they had gone as far as the hill of Ammah, which is opposite Giah on the way to the wilderness of Gibeon.";
csb[25] = "The Benjaminites rallied to Abner; they formed a unit and took their stand on top of a hill.";
csb[26] = "Then Abner called out to Joab: &quot;Must the sword devour forever? Don\'t you realize this will only end in bitterness? How long before you tell the troops to stop pursuing their brothers? &quot;";
csb[27] = "&quot;As God lives,&quot; Joab replied, &quot;if you had not spoken up, the troops wouldn\'t have stopped pursuing their brothers until morning.&quot;";
csb[28] = "Then Joab blew the ram\'s horn, and all the troops stopped; they no longer pursued Israel or continued to fight.";
csb[29] = "So Abner and his men marched through the Arabah all that night. They crossed the Jordan, marched all morning, and arrived at Mahanaim.";
csb[30] = "When Joab had turned back from pursuing Abner, he gathered all the troops. In addition to Asahel, nineteen of David\'s soldiers were missing,";
csb[31] = "but they had killed 360 of the Benjaminites and Abner\'s men.";
csb[32] = "Afterward, they carried Asahel to his father\'s tomb in Bethlehem and buried him. Then Joab and his men marched all night and reached Hebron at dawn.";
kjv[1] = "And it came to pass after this, that David enquired of the LORD, saying, Shall I go up into any of the cities of Judah? And the LORD said unto him, Go up. And David said, Whither shall I go up? And he said, Unto Hebron.";
rsv[1] = "After this David inquired of the LORD, &quot;Shall I go up into any of the cities of Judah?&quot; And the LORD said to him, &quot;Go up.&quot; David said, &quot;To which shall I go up?&quot; And he said, &quot;To Hebron.&quot;";
asv[1] = "And it came to pass after this, that David inquired of Jehovah, saying, Shall I go up into any of the cities of Judah? And Jehovah said unto him, Go up. And David said, Whither shall I go up? And he said, Unto Hebron.";
yng[1] = "And it cometh to pass afterwards, that David asketh at Jehovah, saying, `Do I go up into one of the cities of Judah?\' and Jehovah saith unto him, `Go up.\' And David saith, `Whither do I go up?\' and He saith, `To Hebron.\'";
dby[1] = "And it came to pass after this that David inquired of Jehovah, saying, Shall I go up into one of the cities of Judah? And Jehovah said to him, Go up. And David said, Whither shall I go up? And he said, Unto Hebron.";

yng[17] = "and the battle is very hard on that day, and Abner is smitten, and the men of Israel, before the servants of David.";
dby[17] = "And the battle that day was very severe; and Abner and the men of Israel were routed before the servants of David.";
web[17] = "And there was a very severe battle that day; and Abner was defeated, and the men of Israel, before the servants of David.";
hnv[17] = "The battle was very severe that day: and Aviner was beaten, and the men of Yisra\'el, before the servants of David.";
vul[17] = "et ortum est bellum durum satis in die illa fugatusque est Abner et viri Israhel a pueris David";
kjv[18] = "And there were three sons of Zeruiah there, Joab, and Abishai, and Asahel: and Asahel [was as] light of foot as a wild roe.";
rsv[18] = "And the three sons of Zeru\'iah were there, Jo\'ab, Abi\'shai, and As\'ahel. Now As\'ahel was as swift of foot as a wild gazelle;";
asv[18] = "And the three sons of Zeruiah were there, Joab, and Abishai, and Asahel: and Asahel was as light of foot as a wild roe.";
yng[18] = "And there are there three sons of Zeruiah, Joab, and Abishai, and Asahel, and Asahel [is] light on his feet, as one of the roes which [are] in the field,";
dby[18] = "And there were three sons of Zeruiah there, Joab, and Abishai, and Asahel. Now Asahel was swift of foot, as one of the gazelles that are in the field.";
web[18] = "And there were three sons of Zeruiah there, Joab, and Abishai, and Asahel: and Asahel [was as] light of foot as a wild roe.";
hnv[18] = "The three sons of Tzeru\'yah were there, Yo\'av, and Avishai, and `Asa\'el: and `Asa\'el was as light of foot as a wild gazelle.";
vul[18] = "erant autem ibi tres filii Sarviae Ioab et Abisai et Asahel porro Asahel cursor velocissimus fuit quasi unus ex capreis quae morantur in silvis";
kjv[19] = "And Asahel pursued after Abner; and in going he turned not to the right hand nor to the left from following Abner.";
rsv[19] = "and As\'ahel pursued Abner, and as he went he turned neither to the right hand nor to the left from following Abner.";
asv[19] = "And Asahel pursued after Abner; and in going he turned not to the right hand nor to the left from following Abner.";
yng[19] = "And Asahel pursueth after Abner, and hath not turned aside to go to the right or to the left, from after Abner.";
dby[19] = "And Asahel pursued after Abner; and in going he turned not to the right hand nor to the left from behind Abner.";
web[19] = "And Asahel pursued after Abner; and in going he turned not to the right hand nor to the left from following Abner.";
hnv[19] = "`Asa\'el pursued after Aviner; and in going he didn\'t turn to the right hand nor to the left from following Aviner.";
vul[19] = "persequebatur autem Asahel Abner et non declinavit ad dexteram sive ad sinistram omittens persequi Abner";
kjv[20] = "Then Abner looked behind him, and said, [Art] thou Asahel? And he answered, I [am].";
rsv[20] = "Then Abner looked behind him and said, &quot;Is it you, As\'ahel?&quot; And he answered, &quot;It is I.&quot;";
asv[20] = "Then Abner looked behind him, and said, Is it thou, Asahel? And he answered, It is I.";
yng[20] = "And Abner looketh behind him, and saith, `Art thou he -- Asahel?\' and he saith, `I [am].\'";
dby[20] = "Then Abner looked behind him, and said, Art thou Asahel? And he said, I am.";
web[20] = "Then Abner looked behind him, and said, [Art] thou Asahel? And he answered, I [am].";
hnv[20] = "Then Aviner looked behind him, and said, Is it you, `Asa\'el? He answered, It is I.";
vul[20] = "respexit itaque Abner post tergum suum et ait tune es Asahel qui respondit ego sum";
kjv[21] = "And Abner said to him, Turn thee aside to thy right hand or to thy left, and lay thee hold on one of the young men, and take thee his armour. But Asahel would not turn aside from following of him.";
rsv[21] = "Abner said to him, &quot;Turn aside to your right hand or to your left, and seize one of the young men, and take his spoil.&quot; But As\'ahel would not turn aside from following him.";
asv[21] = "And Abner said to him, Turn thee aside to thy right hand or to thy left, and lay thee hold on one of the young men, and take thee his armor. But Asahel would not turn aside from following him.";
yng[21] = "And Abner saith to him, `Turn thee aside to thy right hand or to thy left, and seize for thee one of the youths, and take to thee his armour;\' and Asahel hath not been willing to turn aside from after him.";
dby[21] = "And Abner said to him, Turn thee aside, to thy right hand or to thy left, and lay hold of one of the young men, and take for thyself his armour. But Asahel would not turn aside from following him.";
web[21] = "And Abner said to him, Turn thee aside to thy right hand or to thy left, and lay hold on one of the young men, and take to thee his armor. But Asahel would not turn aside from following him.";
hnv[21] = "Aviner said to him, Turn you aside to your right hand or to your left, and lay you hold on one of the young men, and take you his armor. But `Asa\'el would not turn aside from following him.";
vul[21] = "dixitque ei Abner vade ad dextram sive ad sinistram et adprehende unum de adulescentibus et tolle tibi spolia eius noluit autem Asahel omittere quin urgueret eum";
kjv[22] = "And Abner said again to Asahel, Turn thee aside from following me: wherefore should I smite thee to the ground? how then should I hold up my face to Joab thy brother?";
rsv[22] = "And Abner said again to As\'ahel, &quot;Turn aside from following me; why should I smite you to the ground? How then could I lift up my face to your brother Jo\'ab?&quot;";
asv[22] = "And Abner said again to Asahel, Turn thee aside from following me: wherefore should I smite thee to the ground? how then should I hold up my face to Joab thy brother?";
yng[22] = "And Abner addeth again, saying unto Asahel, `Turn thee aside from after me, why do I smite thee to the earth? and how do I lift up my face unto Joab thy brother?\'";
dby[22] = "And Abner said again to Asahel, Turn thee aside from following me: why should I smite thee to the ground? how then should I hold up my face to Joab thy brother?";
web[22] = "And Abner said again to Asahel, Turn thee aside from following me: Why should I smite thee to the ground? how then should I hold up my face to Joab thy brother?";
hnv[22] = "Aviner said again to `Asa\'el, Turn you aside from following me: why should I strike you to the ground? how then should I hold up my face to Yo\'av your brother?";
vul[22] = "rursumque locutus est Abner ad Asahel recede noli me sequi ne conpellar confodere te in terra et levare non potero faciem meam ad Ioab fratrem tuum";
kjv[23] = "Howbeit he refused to turn aside: wherefore Abner with the hinder end of the spear smote him under the fifth [rib], that the spear came out behind him; and he fell down there, and died in the same place: and it came to pass, [that] as many as came to the place where Asahel fell down and died stood still.";
rsv[23] = "But he refused to turn aside; therefore Abner smote him in the belly with the butt of his spear, so that the spear came out at his back; and he fell there, and died where he was. And all who came to the place where As\'ahel had fallen and died, stood still.";
asv[23] = "Howbeit he refused to turn aside: wherefore Abner with the hinder end of the spear smote him in the body, so that the spear came out behind him; and he fell down there, and died in the same place: and it came to pass, that as many as came to the place where Asahel fell down and died stood still.";
yng[23] = "And he refuseth to turn aside, and Abner smiteth him with the hinder part of the spear unto the fifth [rib], and the spear cometh out from behind him, and he falleth there, and dieth under it; and it cometh to pass, every one who hath come unto the place where Asahel hath fallen and dieth -- they stand still.";
dby[23] = "But he refused to turn aside; therefore Abner with the hinder end of the spear smote him in the belly, so that the spear came out behind him; and he fell down there, and died in the same place. And it came to pass, that as many as came to the place where Asahel fell down and died stood still.";
web[23] = "But he refused to turn aside: wherefore Abner with the hinder end of the spear smote him under the fifth [rib], that the spear came out behind him; and he fell down there, and died in the same place: and it came to pass, [that] as many as came to the place where Asahel fell down and died, stood still.";
hnv[23] = " However he refused to turn aside: therefore Aviner with the hinder end of the spear struck him in the body, so that the spear came out behind him; and he fell down there, and died in the same place: and it happened, that as many as came to the place where `Asa\'el fell down and died stood still.";
vul[23] = "qui audire contempsit et noluit declinare percussit ergo eum Abner aversa hasta in inguine et transfodit et mortuus est in eodem loco omnesque qui transiebant per locum in quo ceciderat Asahel et mortuus erat subsistebant";
kjv[24] = "Joab also and Abishai pursued after Abner: and the sun went down when they were come to the hill of Ammah, that [lieth] before Giah by the way of the wilderness of Gibeon.";
rsv[24] = "But Jo\'ab and Abi\'shai pursued Abner; and as the sun was going down they came to the hill of Ammah, which lies before Gi\'ah on the way to the wilderness of Gibeon.";
asv[24] = "But Joab and Abishai pursued after Abner: and the sun went down when they were come to the hill of Ammah, that lieth before Giah by the way of the wilderness of Gibeon.";
yng[24] = "And Joab and Abishai pursue after Abner, and the sun hath gone in, and they have come in unto the height of Ammah, which [is] on the front of Giah, the way of the wilderness of Gibeon.";
dby[24] = "And Joab and Abishai pursued after Abner; and the sun went down when they came to the hill of Ammah, which is before Giah on the way to the wilderness of Gibeon.";
web[24] = "Joab also, and Abishai pursued Abner: and the sun went down when they had come to the hill of Ammah, that [lieth] before Giah by the way of the wilderness of Gibeon.";
hnv[24] = "But Yo\'av and Avishai pursued after Aviner: and the sun went down when they were come to the hill of Ammah, that lies before Giach by the way of the wilderness of Giv`on.";
vul[24] = "persequentibus autem Ioab et Abisai fugientem Abner sol occubuit et venerunt usque ad collem Aquaeductus qui est ex adverso vallis et itineris deserti in Gabaon";
kjv[25] = "And the children of Benjamin gathered themselves together after Abner, and became one troop, and stood on the top of an hill.";
rsv[25] = "And the Benjaminites gathered themselves together behind Abner, and became one band, and took their stand on the top of a hill.";
asv[25] = "And the children of Benjamin gathered themselves together after Abner, and became one band, and stood on the top of a hill.";
yng[25] = "And the sons of Benjamin gather themselves together after Abner, and become one troop, and stand on the top of a certain height,";
dby[25] = "And the children of Benjamin gathered themselves together after Abner, and became one troop, and stood on the top of a hill.";
web[25] = "And the children of Benjamin assembled themselves after Abner, and became one troop, and stood on the top of a hill.";
hnv[25] = "The children of Binyamin gathered themselves together after Aviner, and became one band, and stood on the top of a hill.";
vul[25] = "congregatique sunt filii Beniamin ad Abner et conglobati in unum cuneum steterunt in summitate tumuli unius";
kjv[26] = "Then Abner called to Joab, and said, Shall the sword devour for ever? knowest thou not that it will be bitterness in the latter end? how long shall it be then, ere thou bid the people return from following their brethren?";
rsv[26] = "Then Abner called to Jo\'ab, &quot;Shall the sword devour for ever? Do you not know that the end will be bitter? How long will it be before you bid your people turn from the pursuit of their brethren?&quot;";
asv[26] = "Then Abner called to Joab, and said, Shall the sword devour for ever? knowest thou not that it will be bitterness in the latter end? how long shall it be then, ere thou bid the people return from following their brethren?";
yng[26] = "and Abner calleth unto Joab, and saith, `For ever doth the sword consume? hast thou not known that it is bitterness in the latter end? and till when dost thou not say to the people to turn back from after their brethren?\'";
dby[26] = "And Abner called to Joab, and said, Shall the sword devour for ever? knowest thou not that it will be bitterness in the latter end? and how long shall it be ere thou bid the people return from following their brethren?";
web[26] = "Then Abner called to Joab, and said, Shall the sword devour for ever? knowest thou not that it will be bitterness in the latter end? how long shall it be then, ere thou wilt bid the people return from following their brethren?";
hnv[26] = "Then Aviner called to Yo\'av, and said, &quot;Shall the sword devour forever? Don\'t you know that it will be bitterness in the latter end? How long shall it be then, before you bid the people return from following their brothers?&quot;";
vul[26] = "et exclamavit Abner ad Ioab et ait num usque ad internicionem tuus mucro desaeviet an ignoras quod periculosa sit desperatio usquequo non dicis populo ut omittat persequi fratres suos";
kjv[27] = "And Joab said, [As] God liveth, unless thou hadst spoken, surely then in the morning the people had gone up every one from following his brother.";
rsv[27] = "And Jo\'ab said, &quot;As God lives, if you had not spoken, surely the men would have given up the pursuit of their brethren in the morning.&quot;";
asv[27] = "And Joab said, As God liveth, if thou hadst not spoken, surely then in the morning the people had gone away, nor followed every one his brother.";
yng[27] = "And Joab saith, `God liveth! for unless thou hadst spoken, surely then from the morning had the people gone up each from after his brother.\'";
dby[27] = "And Joab said, [As] God liveth, unless thou hadst spoken, surely then in the morning the people had gone up every one from following his brother.";
web[27] = "And Joab said, [As] God liveth, unless thou hadst spoken, surely then in the morning the people had gone up every one from following his brother.";
hnv[27] = "Yo\'av said, As God lives, if you had not spoken, surely then in the morning the people had gone away, nor followed everyone his brother.";
vul[27] = "et ait Ioab vivit Dominus si locutus fuisses mane recessisset populus persequens fratrem suum";
kjv[28] = "So Joab blew a trumpet, and all the people stood still, and pursued after Israel no more, neither fought they any more.";
rsv[28] = "So Jo\'ab blew the trumpet; and all the men stopped, and pursued Israel no more, nor did they fight any more.";
asv[28] = "So Joab blew the trumpet; and all the people stood still, and pursued after Israel no more, neither fought they any more.";
yng[28] = "And Joab bloweth with a trumpet, and all the people stand still, and pursue no more after Israel, nor have they added any more to fight.";
dby[28] = "And Joab blew the trumpet, and all the people stood still, and pursued after Israel no more, neither did they fight any more.";
web[28] = "So Joab blew a trumpet, and all the people stood still, and pursued Israel no more, neither fought they any more.";
hnv[28] = "So Yo\'av blew the shofar; and all the people stood still, and pursued after Yisra\'el no more, neither fought they any more.";
vul[28] = "insonuit ergo Ioab bucina et stetit omnis exercitus nec persecuti sunt ultra Israhel neque iniere certamen";
kjv[29] = "And Abner and his men walked all that night through the plain, and passed over Jordan, and went through all Bithron, and they came to Mahanaim.";
rsv[29] = "And Abner and his men went all that night through the Arabah; they crossed the Jordan, and marching the whole forenoon they came to Mahana\'im.";
asv[29] = "And Abner and his men went all that night through the Arabah; and they passed over the Jordan, and went through all Bithron, and came to Mahanaim.";
yng[29] = "And Abner and his men have gone through the plain all that night, and pass over the Jordan, and go on [through] all Bithron, and come in to Mahanaim.";
dby[29] = "And Abner and his men walked all that night through the plain, and passed over the Jordan, and went through all Bithron, and they came to Mahanaim.";
web[29] = "And Abner and his men walked all that night through the plain, and passed over Jordan, and went through all Bithron, and they came to Mahanaim.";
hnv[29] = "Aviner and his men went all that night through the `Aravah; and they passed over the Yarden, and went through all Bitron, and came to Machanayim.";
vul[29] = "Abner autem et viri eius abierunt per campestria tota nocte illa et transierunt Iordanem et lustrata omni Bethoron venerunt ad Castra";
kjv[30] = "And Joab returned from following Abner: and when he had gathered all the people together, there lacked of David\'s servants nineteen men and Asahel.";
rsv[30] = "Jo\'ab returned from the pursuit of Abner; and when he had gathered all the people together, there were missing of David\'s servants nineteen men besides As\'ahel.";
asv[30] = "And Joab returned from following Abner: and when he had gathered all the people together, there lacked of David\'s servants nineteen men and Asahel.";
yng[30] = "And Joab hath turned back from after Abner, and gathereth all the people, and there are lacking of the servants of David nineteen men, and Asahel;";
dby[30] = "And Joab returned from following Abner, and gathered all the people together; and there lacked of David\'s servants nineteen men, and Asahel.";
web[30] = "And Joab returned from following Abner: and when he had assembled all the people, there lacked of David\'s servants nineteen men, and Asahel.";
hnv[30] = "Yo\'av returned from following Aviner: and when he had gathered all the people together, there lacked of David\'s servants nineteen men and `Asa\'el.";
vul[30] = "porro Ioab reversus omisso Abner congregavit omnem populum et defuerunt de pueris David decem et novem viri excepto Asahele";
kjv[31] = "But the servants of David had smitten of Benjamin, and of Abner\'s men, [so that] three hundred and threescore men died.";
rsv[31] = "But the servants of David had slain of Benjamin three hundred and sixty of Abner\'s men.";
asv[31] = "But the servants of David had smitten of Benjamin, and of Abner\'s men, [so that] three hundred and threescore men died.";
yng[31] = "and the servants of David have smitten of Benjamin, even among the men of Abner, three hundred and sixty men -- they died.";
dby[31] = "And the servants of David had smitten of Benjamin, and of Abner\'s men, three hundred and sixty men, who had died.";
web[31] = "But the servants of David had smitten of Benjamin, and of Abner\'s men, [so that] three hundred and sixty men died.";
hnv[31] = "But the servants of David had struck of Binyamin, and of Aviner\'s men, [so that] three hundred sixty men died.";
vul[31] = "servi autem David percusserunt de Beniamin et de viris qui erant cum Abner trecentos sexaginta qui et mortui sunt";
kjv[32] = "And they took up Asahel, and buried him in the sepulchre of his father, which [was in] Bethlehem. And Joab and his men went all night, and they came to Hebron at break of day.";
rsv[32] = "And they took up As\'ahel, and buried him in the tomb of his father, which was at Bethlehem. And Jo\'ab and his men marched all night, and the day broke upon them at Hebron.";
asv[32] = "And they took up Asahel, and buried him in the sepulchre of his father, which was in Beth-lehem. And Joab and his men went all night, and the day brake upon them at Hebron.";
yng[32] = "And they lift up Asahel, and bury him in the burying-place of his father, which [is] in Beth-Lehem, and they go all the night -- Joab and his men -- and it is light to them in Hebron.";
dby[32] = "And they took up Asahel, and buried him in the sepulchre of his father, which was in Bethlehem. And Joab and his men went all night, and they came to Hebron at break of day.";
web[32] = "And they took up Asahel, and buried him in the sepulcher of his father, which [was in] Beth-lehem. And Joab and his men went all night, and they came to Hebron at break of day.";
hnv[32] = "They took up `Asa\'el, and buried him in the tomb of his father, which was in Beit-Lechem. Yo\'av and his men went all night, and the day broke on them at Hevron.";
vul[32] = "tuleruntque Asahel et sepelierunt eum in sepulchro patris sui in Bethleem et ambulaverunt tota nocte Ioab et viri qui erant cum eo et in ipso crepusculo pervenerunt in Hebron";
</script>
