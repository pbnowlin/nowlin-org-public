csb[1] = "When David had gone a little beyond the summit, Ziba, Mephibosheth\'s servant, was right there to meet him. He had a pair of saddled donkeys loaded with two hundred loaves of bread, one hundred clusters of raisins, one hundred bunches of summer fruit, and a clay jar of wine.";
csb[2] = "The king said to Ziba, &quot;Why do you have these? &quot; Ziba answered, &quot;The donkeys are for the king\'s household to ride, the bread and summer fruit are for the young men to eat, and the wine is for those to drink who become exhausted in the wilderness.&quot;";
csb[3] = "&quot;Where is your master\'s grandson? &quot; the king asked. &quot;Why, he\'s staying in Jerusalem,&quot; Ziba replied to the king, &quot;for he said, \'Today, the house of Israel will restore my grandfather\'s kingdom to me.\' &quot;";
csb[4] = "The king said to Ziba, &quot;All that belongs to Mephibosheth is now yours! &quot; &quot;I bow before you,&quot; Ziba said. &quot;May I find favor with you, my lord the king! &quot;";
csb[5] = "When King David got to Bahurim, a man belonging to the family of the house of Saul was just coming out. His name was Shimei son of Gera, and he was yelling curses as he approached.";
csb[6] = "He threw stones at David and at all the royal servants, the people and the warriors on David\'s right and left.";
csb[7] = "Shimei said as he cursed: &quot;Get out, get out, you man of bloodshed, you wicked man!";
csb[8] = "&quot;The LORD has paid you back for all the blood of the house of Saul in whose place you became king, and the LORD has handed the kingdom over to your son Absalom. Look, you are in trouble because you\'re a man of bloodshed! &quot;";
csb[9] = "Then Abishai son of Zeruiah said to the king, &quot;Why should this dead dog curse my lord the king? Let me go over and remove his head! &quot;";
csb[10] = "The king replied, &quot;Sons of Zeruiah, do we agree on anything? He curses me this way because the LORD  told him, \'Curse David! \' Therefore, who can say, \'Why did you do that? \' &quot;";
csb[11] = "Then David said to Abishai and all his servants, &quot;Look, my own son, my own flesh and blood, intends to take my life -- how much more now this Benjaminite! Leave him alone and let him curse me; the LORD has told him to.";
csb[12] = "&quot;Perhaps the LORD will see my affliction and restore goodness to me instead of Shimei\'s curses today.&quot;";
csb[13] = "So David and his men proceeded along the road as Shimei was going along the ridge of the hill opposite him. As Shimei went, he cursed David, threw stones at him, and kicked up dust.";
csb[14] = "Finally, the king and all the people with him arrived exhausted, so they rested there.";
csb[15] = "Now Absalom and all the Israelites came to Jerusalem. Ahithophel was also with him.";
csb[16] = "When David\'s friend Hushai the Archite came to Absalom, Hushai said to Absalom, &quot;Long live the king! Long live the king! &quot;";
csb[17] = "&quot;Is this your loyalty to your friend? &quot; Absalom asked Hushai. &quot;Why didn\'t you go with your friend? &quot;";
csb[18] = "&quot;Not at all,&quot; Hushai answered Absalom. &quot;I am on the side of the one that the LORD, this people, and all the men of Israel have chosen. I will stay with him.";
csb[19] = "&quot;Furthermore, whom will I serve if not his son? As I served in your father\'s presence, I will also serve in yours.&quot;";
csb[20] = "Then Absalom said to Ahithophel, &quot;Give me your advice. What should we do? &quot;";
csb[21] = "Ahithophel replied to Absalom, &quot;Sleep with your father\'s concubines whom he left to take care of the palace. When all Israel hears that you have become repulsive to your father, everyone with you will be encouraged.&quot;";
csb[22] = "So they pitched a tent for Absalom on the roof, and he slept with his father\'s concubines in the sight of all Israel.";
csb[23] = "Now the advice Ahithophel gave in those days was like someone asking about a word from God -- such was the regard that both David and Absalom had for Ahithophel\'s advice.";

yng[16] = "and it cometh to pass, when Hushai the Archite, David\'s friend, hath come unto Absalom, that Hushai saith unto Absalom, `Let the king live! let the king live!\'";
dby[16] = "And it came to pass, when Hushai the Archite, David\'s friend, came to Absalom, that Hushai said to Absalom, Long live the king! Long live the king!";

hnv[16] = "It happened, when Hushai the Arki, David\'s friend, was come to Avshalom, that Hushai said to Avshalom, [Long] live the king, [Long] live the king.";

asv[17] = "And Absalom said to Hushai, Is this thy kindness to thy friend? why wentest thou not with thy friend?";
yng[17] = "And Absalom saith unto Hushai, `This thy kindness with thy friend! why hast thou not gone with thy friend?\'";
dby[17] = "And Absalom said to Hushai, Is this thy kindness to thy friend? why didst thou not go with thy friend?";
web[17] = "And Absalom said to Hushai, [Is] this thy kindness to thy friend? why wentest thou not with thy friend?";
hnv[17] = "Avshalom said to Hushai, Is this your kindness to your friend? Why didn\'t you go with your friend?";

kjv[18] = "And Hushai said unto Absalom, Nay; but whom the LORD, and this people, and all the men of Israel, choose, his will I be, and with him will I abide.";

yng[18] = "And Hushai saith unto Absalom, `Nay, for he whom Jehovah hath chosen, and this people, even all the men of Israel, his I am, and with him I abide;";

yng[19] = "and secondly, for whom do I labour? is it not before his son? as I served before thy father so am I before thee.\'";
dby[19] = "And again, whom should I serve? should it not be in the presence of his son? as I have served in thy father\'s presence, so will I be in thy presence.";

dby[20] = "And Absalom said to Ahithophel, Give counsel among you what we shall do.";
web[20] = "Then said Absalom to Ahithophel, Give counsel among you what we shall do.";
hnv[20] = "Then said Avshalom to Achitofel, Give your counsel what we shall do.";
vul[20] = "dixit autem Absalom ad Ahitofel inite consilium quid agere debeamus";
kjv[21] = "And Ahithophel said unto Absalom, Go in unto thy father\'s concubines, which he hath left to keep the house; and all Israel shall hear that thou art abhorred of thy father: then shall the hands of all that [are] with thee be strong.";
rsv[21] = "Ahith\'ophel said to Ab\'salom, &quot;Go in to your father\'s concubines, whom he has left to keep the house; and all Israel will hear that you have made yourself odious to your father, and the hands of all who are with you will be strengthened.&quot;";
asv[21] = "And Ahithophel said unto Absalom, Go in unto thy father\'s concubines, that he hath left to keep the house; and all Israel will hear that thou art abhorred of thy father: then will the hands of all that are with thee be strong.";
yng[21] = "And Ahithophel saith unto Absalom, `Go in unto the concubines of thy father, whom he left to keep the house, and all Israel hath heard that thou hast been abhorred by thy father, and the hands of all who [are] with thee have been strong.\'";
dby[21] = "And Ahithophel said to Absalom, Go in to thy father\'s concubines, whom he has left to keep the house; and all Israel shall hear that thou art become odious with thy father; and the hands of all that are with thee shall be strong.";
web[21] = "And Ahithophel said to Absalom, Go in to thy father\'s concubines, which he hath left to keep the house; and all Israel shall hear that thou art abhorred by thy father: then shall the hands of all that [are] with thee be strong.";

vul[21] = "et ait Ahitofel ad Absalom ingredere ad concubinas patris tui quas dimisit ad custodiendam domum ut cum audierit omnis Israhel quod foedaveris patrem tuum roborentur manus eorum tecum";

asv[22] = "So they spread Absalom a tent upon the top of the house; and Absalom went in unto his father\'s concubines in the sight of all Israel.";
yng[22] = "And they spread out for Absalom the tent on the roof, and Absalom goeth in unto the concubines of his father before the eyes of all Israel.";
dby[22] = "So they spread a tent for Absalom upon the roof; and Absalom went in to his father\'s concubines in the sight of all Israel.";
web[22] = "So they spread Absalom a tent upon the top of the house; and Absalom went in to his father\'s concubines in the sight of all Israel.";
hnv[22] = "So they spread Avshalom a tent on the top of the house; and Avshalom went in to his father\'s concubines in the sight of all Yisra\'el.";
