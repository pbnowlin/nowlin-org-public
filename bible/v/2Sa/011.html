csb[1] = "In the spring when kings march out to war, David sent Joab with his officers and all Israel. They destroyed the Ammonites and besieged Rabbah, but David remained in Jerusalem.";
csb[2] = "One evening David got up from his bed and strolled around on the roof of the palace. From the roof he saw a woman bathing -- a very beautiful woman.";
csb[3] = "So David sent someone to inquire about her, and he said, &quot;Isn\'t this Bathsheba, daughter of Eliam and wife of Uriah the Hethite? &quot;";
csb[4] = "David sent messengers to get her, and when she came to him, he slept with her. Now she had just been purifying herself from her uncleanness. Afterward, she returned home.";
csb[5] = "The woman conceived and sent word to inform David: &quot;I am pregnant.&quot;";
csb[6] = "David sent orders to Joab: &quot;Send me Uriah the Hethite.&quot; So Joab sent Uriah to David.";
csb[7] = "When Uriah came to him, David asked how Joab and the troops were doing and how the war was going.";
csb[8] = "Then he said to Uriah, &quot;Go down to your house and wash your feet.&quot; So Uriah left the palace, and a gift from the king followed him.";
csb[9] = "But Uriah slept at the door of the palace with all his master\'s servants; he did not go down to his house.";
csb[10] = "When it was reported to David, &quot;Uriah didn\'t go home,&quot; David questioned Uriah, &quot;Haven\'t you just come from a journey? Why didn\'t you go home? &quot;";
csb[11] = "Uriah answered David, &quot;The ark, Israel, and Judah are dwelling in tents, and my master Joab and his soldiers are camping in the open field. How can I enter my house to eat and drink and sleep with my wife? As surely as you live and by your life, I will not do this! &quot;";
csb[12] = "&quot;Stay here today also,&quot; David said to Uriah, &quot;and tomorrow I will send you back.&quot; So Uriah stayed in Jerusalem that day and the next.";
csb[13] = "Then David invited Uriah to eat and drink with him, and David got him drunk. He went out in the evening to lie down on his cot with his master\'s servants, but he did not go home.";
csb[14] = "The next morning David wrote a letter to Joab and sent it with Uriah.";
csb[15] = "In the letter he wrote: Put Uriah at the front of the fiercest fighting, then withdraw from him so that he is struck down and dies.";
csb[16] = "When Joab was besieging the city, he put Uriah in the place where he knew the best enemy soldiers were.";
csb[17] = "Then the men of the city came out and attacked Joab, and some of the men from David\'s soldiers fell in battle; Uriah the Hethite also died.";
csb[18] = "Joab sent someone to report to David all the details of the battle.";
csb[19] = "He commanded the messenger, &quot;When you\'ve finished telling the king all the details of the battle --";
csb[20] = "&quot;if the king\'s anger gets stirred up and he asks you, \'Why did you get so close to the city to fight? Didn\'t you realize they would shoot from the top of the wall?";
csb[21] = "&quot;At Thebez, who struck Abimelech son of Jerubbesheth? Didn\'t a woman drop an upper millstone on him from the top of the wall so that he died? Why did you get so close to the wall? \' -- then say, \'Your servant Uriah the Hethite is dead also.\' &quot;";
csb[22] = "Then the messenger left. When he arrived, he reported to David all that Joab had sent him to tell.";
csb[23] = "The messenger reported to David, &quot;The men gained the advantage over us and came out against us in the field, but we counterattacked right up to the entrance of the city gate.";
csb[24] = "&quot;However, the archers shot down on your servants from the top of the wall, and some of the king\'s servants died. Your servant Uriah the Hethite is also dead.&quot;";
csb[25] = "David told the messenger, &quot;Say this to Joab: \'Don\'t let this matter upset you because the sword devours all alike. Intensify your fight against the city and demolish it.\' Encourage him.&quot;";
csb[26] = "When Uriah\'s wife heard that her husband Uriah had died, she mourned for him.";
csb[27] = "When the time of mourning ended, David had her brought to his house. She became his wife and bore him a son. However, the LORD considered what David had done to be evil.";
kjv[1] = "And it came to pass, after the year was expired, at the time when kings go forth [to battle], that David sent Joab, and his servants with him, and all Israel; and they destroyed the children of Ammon, and besieged Rabbah. But David tarried still at Jerusalem.";
kjv[2] = "And it came to pass in an eveningtide, that David arose from off his bed, and walked upon the roof of the king\'s house: and from the roof he saw a woman washing herself; and the woman [was] very beautiful to look upon.";
kjv[3] = "And David sent and enquired after the woman. And [one] said, [Is] not this Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?";
kjv[4] = "And David sent messengers, and took her; and she came in unto him, and he lay with her; for she was purified from her uncleanness: and she returned unto her house.";
kjv[5] = "And the woman conceived, and sent and told David, and said, I [am] with child.";
kjv[6] = "And David sent to Joab, [saying], Send me Uriah the Hittite. And Joab sent Uriah to David.";
kjv[7] = "And when Uriah was come unto him, David demanded [of him] how Joab did, and how the people did, and how the war prospered.";
kjv[8] = "And David said to Uriah, Go down to thy house, and wash thy feet. And Uriah departed out of the king\'s house, and there followed him a mess [of meat] from the king.";
kjv[9] = "But Uriah slept at the door of the king\'s house with all the servants of his lord, and went not down to his house.";
kjv[10] = "And when they had told David, saying, Uriah went not down unto his house, David said unto Uriah, Camest thou not from [thy] journey? why [then] didst thou not go down unto thine house?";
kjv[11] = "And Uriah said unto David, The ark, and Israel, and Judah, abide in tents; and my lord Joab, and the servants of my lord, are encamped in the open fields; shall I then go into mine house, to eat and to drink, and to lie with my wife? [as] thou livest, and [as] thy soul liveth, I will not do this thing.";
kjv[12] = "And David said to Uriah, Tarry here to day also, and to morrow I will let thee depart. So Uriah abode in Jerusalem that day, and the morrow.";
kjv[13] = "And when David had called him, he did eat and drink before him; and he made him drunk: and at even he went out to lie on his bed with the servants of his lord, but went not down to his house.";
kjv[14] = "And it came to pass in the morning, that David wrote a letter to Joab, and sent [it] by the hand of Uriah.";
kjv[15] = "And he wrote in the letter, saying, Set ye Uriah in the forefront of the hottest battle, and retire ye from him, that he may be smitten, and die.";
kjv[16] = "And it came to pass, when Joab observed the city, that he assigned Uriah unto a place where he knew that valiant men [were].";
kjv[17] = "And the men of the city went out, and fought with Joab: and there fell [some] of the people of the servants of David; and Uriah the Hittite died also.";
kjv[18] = "Then Joab sent and told David all the things concerning the war;";
kjv[19] = "And charged the messenger, saying, When thou hast made an end of telling the matters of the war unto the king,";
kjv[20] = "And if so be that the king\'s wrath arise, and he say unto thee, Wherefore approached ye so nigh unto the city when ye did fight? knew ye not that they would shoot from the wall?";
kjv[21] = "Who smote Abimelech the son of Jerubbesheth? did not a woman cast a piece of a millstone upon him from the wall, that he died in Thebez? why went ye nigh the wall? then say thou, Thy servant Uriah the Hittite is dead also.";
kjv[22] = "So the messenger went, and came and shewed David all that Joab had sent him for.";
kjv[23] = "And the messenger said unto David, Surely the men prevailed against us, and came out unto us into the field, and we were upon them even unto the entering of the gate.";
kjv[24] = "And the shooters shot from off the wall upon thy servants; and [some] of the king\'s servants be dead, and thy servant Uriah the Hittite is dead also.";
kjv[25] = "Then David said unto the messenger, Thus shalt thou say unto Joab, Let not this thing displease thee, for the sword devoureth one as well as another: make thy battle more strong against the city, and overthrow it: and encourage thou him.";
kjv[26] = "And when the wife of Uriah heard that Uriah her husband was dead, she mourned for her husband.";
kjv[27] = "And when the mourning was past, David sent and fetched her to his house, and she became his wife, and bare him a son. But the thing that David had done displeased the LORD.";

hnv[15] = "He wrote in the letter, saying, Set Uriyah in the forefront of the hottest battle, and retire you from him, that he may be struck, and die.";
vul[15] = "scribens in epistula ponite Uriam ex adverso belli ubi fortissimum proelium est et derelinquite eum ut percussus intereat";
rsv[16] = "And as Jo\'ab was besieging the city, he assigned Uri\'ah to the place where he knew there were valiant men.";
asv[16] = "And it came to pass, when Joab kept watch upon the city, that he assigned Uriah unto the place where he knew that valiant men were.";
yng[16] = "And it cometh to pass in Joab\'s watching of the city, that he appointeth Uriah unto the place where he knew that valiant men [are];";
dby[16] = "And it came to pass as Joab watched the city, that he assigned Urijah to a place where he knew that the valiant men were.";
web[16] = "And it came to pass, when Joab observed the city, that he assigned Uriah to a place where he knew that valiant men [were].";
hnv[16] = "It happened, when Yo\'av kept watch on the city, that he assigned Uriyah to the place where he knew that valiant men were.";
vul[16] = "igitur cum Ioab obsideret urbem posuit Uriam in loco quo sciebat viros esse fortissimos";
rsv[17] = "And the men of the city came out and fought with Jo\'ab; and some of the servants of David among the people fell. Uri\'ah the Hittite was slain also.";
asv[17] = "And the men of the city went out, and fought with Joab: and there fell some of the people, even of the servants of David; and Uriah the Hittite died also.";
yng[17] = "and the men of the city go out and fight with Joab, and there fall [some] of the people, of the servants of David; and there dieth also Uriah the Hittite.";
dby[17] = "And the men of the city went out and fought with Joab; and there fell some of the people, of the servants of David; and Urijah the Hittite died also.";
web[17] = "And the men of the city went out, and fought with Joab: and there fell [some] of the people of the servants of David; and Uriah the Hittite died also.";
hnv[17] = "The men of the city went out, and fought with Yo\'av: and there fell some of the people, even of the servants of David; and Uriyah the Hittite died also.";
vul[17] = "egressique viri de civitate bellabant adversum Ioab et ceciderunt de populo servorum David et mortuus est etiam Urias Hettheus";
rsv[18] = "Then Jo\'ab sent and told David all the news about the fighting;";
asv[18] = "Then Joab sent and told David all the things concerning the war;";
yng[18] = "And Joab sendeth and declareth to David all the matters of the war,";
dby[18] = "Then Joab sent and told David all the matters of the war;";
web[18] = "Then Joab sent and told David all the things concerning the war;";
hnv[18] = "Then Yo\'av sent and told David all the things concerning the war;";
vul[18] = "misit itaque Ioab et nuntiavit David omnia verba proelii";
rsv[19] = "and he instructed the messenger, &quot;When you have finished telling all the news about the fighting to the king,";
asv[19] = "and he charged the messenger, saying, When thou hast made an end of telling all the things concerning the war unto the king,";
yng[19] = "and commandeth the messenger, saying, `At thy finishing all the matters of the war to speak unto the king,";
dby[19] = "and charged the messenger, saying, When thou hast ended telling the matters of the war to the king,";
web[19] = "And charged the messenger, saying, When thou hast made an end of telling the matters of the war to the king,";
hnv[19] = "and he charged the messenger, saying, &quot;When you have made an end of telling all the things concerning the war to the king,";
vul[19] = "praecepitque nuntio dicens cum conpleveris universos sermones belli ad regem";
rsv[20] = "then, if the king\'s anger rises, and if he says to you, \'Why did you go so near the city to fight? Did you not know that they would shoot from the wall?";
asv[20] = "it shall be that, if the king\'s wrath arise, and he say unto thee, Wherefore went ye so nigh unto the city to fight? knew ye not that they would shoot from the wall?";
yng[20] = "then, it hath been, if the king\'s fury ascend, and he hath said to thee, Wherefore did ye draw nigh unto the city to fight? did ye not know that they shoot from off the wall?";
dby[20] = "and if so be that the king\'s wrath arise, and he say to thee, Why did ye go so near to the city to fight? did ye not know that they would shoot from the wall?";
web[20] = "And if the king\'s wrath shall rise, and he shall say to thee, Why approached ye so nigh to the city for the fight? knew ye not that they would shoot from the wall?";
hnv[20] = "it shall be that, if the king\'s wrath arise, and he tells you, \'Why did you go so near to the city to fight? Didn\'t you know that they would shoot from the wall?";
vul[20] = "si eum videris indignari et dixerit quare accessistis ad murum ut proeliaremini an ignorabatis quod multa desuper ex muro tela mittantur";
rsv[21] = "Who killed Abim\'elech the son of Jerub\'besheth? Did not a woman cast an upper millstone upon him from the wall, so that he died at Thebez? Why did you go so near the wall?\' then you shall say, \'Your servant Uri\'ah the Hittite is dead also.\'&quot;";
asv[21] = "who smote Abimelech the son of Jerubbesheth? did not a woman cast an upper millstone upon him from the wall, so that he died at Thebez? why went ye so nigh the wall? then shalt thou say, Thy servant Uriah the Hittite is dead also.";
yng[21] = "Who smote Abimelech son of Jerubbesheth? did not a woman cast on him a piece of a rider from the wall, and he dieth in Thebez? why drew ye nigh unto the wall? that thou hast said, Also thy servant Uriah the Hittite is dead.\'";
dby[21] = "Who smote Abimelech the son of Jerubbesheth? did not a woman cast the upper stone of a handmill from the wall, that he died in Thebez? why did ye go near the wall? -- then say thou, Thy servant Urijah the Hittite is dead also.";
web[21] = "Who smote Abimelech the son of Jerubbesheth? did not a woman cast a piece of a millstone upon him from the wall, that he died in Thebez? why went ye nigh the wall? then say thou, Thy servant Uriah the Hittite is dead also.";
hnv[21] = "who struck Avimelekh the son of Yerubeshet? Didn\'t a woman cast an upper millstone on him from the wall, so that he died at Tevetz? Why did you go so near the wall?\' then shall you say, \'Your servant Uriyah the Hittite is dead also.\'&quot;";
vul[21] = "quis percussit Abimelech filium Hieroboseth nonne mulier misit super eum fragmen molae de muro et interfecit eum in Thebes quare iuxta murum accessistis dices etiam servus tuus Urias Hettheus occubuit";
rsv[22] = "So the messenger went, and came and told David all that Jo\'ab had sent him to tell.";
asv[22] = "So the messenger went, and came and showed David all that Joab had sent him for.";
yng[22] = "And the messenger goeth, and cometh in, and declareth to David all that with which Joab sent him,";
dby[22] = "And the messenger went; and he came and told David all that Joab had sent him for.";
web[22] = "So the messenger went, and came and showed David all that Joab had sent him for.";
hnv[22] = "So the messenger went, and came and shown David all that Yo\'av had sent him for.";
vul[22] = "abiit ergo nuntius et venit et narravit David omnia quae ei praeceperat Ioab";
rsv[23] = "The messenger said to David, &quot;The men gained an advantage over us, and came out against us in the field; but we drove them back to the entrance of the gate.";
asv[23] = "And the messenger said unto David, The men prevailed against us, and came out unto us into the field, and we were upon them even unto the entrance of the gate.";
yng[23] = "and the messenger saith unto David, `Surely the men have been mighty against us, and come out unto us into the field, and we are upon them unto the opening of the gate,";
dby[23] = "And the messenger said to David, The men prevailed against us, and came out against us into the field, and we were upon them as far as the entrance of the gate.";
web[23] = "And the messenger said to David, Surely the men prevailed against us, and came out to us into the field, and we were upon them even to the entrance of the gate.";
hnv[23] = "The messenger said to David, The men prevailed against us, and came out to us into the field, and we were on them even to the entrance of the gate.";
vul[23] = "et dixit nuntius ad David praevaluerunt adversum nos viri et egressi sunt ad nos in agrum nos autem facto impetu persecuti eos sumus usque ad portam civitatis";
rsv[24] = "Then the archers shot at your servants from the wall; some of the king\'s servants are dead; and your servant Uri\'ah the Hittite is dead also.&quot;";
asv[24] = "And the shooters shot at thy servants from off the wall; and some of the king\'s servants are dead, and thy servant Uriah the Hittite is dead also.";
yng[24] = "and those shooting shoot at thy servants from off the wall, and [some] of the servants of the king are dead, and also, thy servant Uriah the Hittite is dead.";
dby[24] = "And the shooters shot from upon the wall against thy servants; and some of the king\'s servants are dead, and thy servant Urijah the Hittite is dead also.";
web[24] = "And the shooters shot from off the wall upon thy servants: and [some] of the king\'s servants are dead, and thy servant Uriah the Hittite is dead also.";
hnv[24] = "The shooters shot at your servants from off the wall; and some of the king\'s servants are dead, and your servant Uriyah the Hittite is dead also.";
vul[24] = "et direxerunt iacula sagittarii ad servos tuos ex muro desuper mortuique sunt de servis regis quin etiam servus tuus Urias Hettheus mortuus est";
rsv[25] = "David said to the messenger, &quot;Thus shall you say to Jo\'ab, \'Do not let this matter trouble you, for the sword devours now one and now another; strengthen your attack upon the city, and overthrow it.\' And encourage him.&quot;";
asv[25] = "Then David said unto the messenger, Thus shalt thou say unto Joab, Let not this thing displease thee, for the sword devoureth one as well as another; make thy battle more strong against the city, and overthrow it: and encourage thou him.";
yng[25] = "And David saith unto the messenger, `Thus dost thou say unto Joab, Let not this thing be evil in thine eyes; for thus and thus doth the sword devour; strengthen thy warfare against the city, and throw it down -- and strengthen thou him.\'";
dby[25] = "Then David said to the messenger, Thus shalt thou say to Joab: Let not this thing displease thee, for the sword devours one as well as another: make thy battle strong against the city, and overthrow it; -- and encourage him.";
web[25] = "Then David said to the messenger, Thus shalt thou say to Joab, Let not this thing displease thee, for the sword devoureth one as well as another: make thy battle more strong against the city, and overthrow it: and encourage thou him.";
hnv[25] = "Then David said to the messenger, Thus shall you tell Yo\'av, Don\'t let this thing displease you, for the sword devours one as well as another; make your battle more strong against the city, and overthrow it: and encourage you him.";
vul[25] = "et dixit David ad nuntium haec dices Ioab non te frangat ista res varius enim eventus est proelii et nunc hunc nunc illum consumit gladius conforta bellatores tuos adversum urbem ut destruas eam et exhortare eos";
rsv[26] = "When the wife of Uri\'ah heard that Uri\'ah her husband was dead, she made lamentation for her husband.";
asv[26] = "And when the wife of Uriah heard that Uriah her husband was dead, she made lamentation for her husband.";
yng[26] = "And the wife of Uriah heareth that Uriah her husband [is] dead, and lamenteth for her lord;";
dby[26] = "And the wife of Urijah heard that Urijah her husband was dead, and she mourned for her husband.";
web[26] = "And when the wife of Uriah heard that Uriah her husband was dead, she mourned for her husband.";
hnv[26] = "When the wife of Uriyah heard that Uriyah her husband was dead, she made lamentation for her husband.";
vul[26] = "audivit autem uxor Uriae quod mortuus esset Urias vir suus et planxit eum";
rsv[27] = "And when the mourning was over, David sent and brought her to his house, and she became his wife, and bore him a son. But the thing that David had done displeased the LORD.";
asv[27] = "And when the mourning was past, David sent and took her home to his house, and she became his wife, and bare him a son. But the thing that David had done displeased Jehovah.";
yng[27] = "and the mourning passeth by, and David sendeth and gathereth her unto his house, and she is to him for a wife, and beareth to him a son; and the thing which David hath done is evil in the eyes of Jehovah.";
dby[27] = "And when the mourning was past, David sent and fetched her to his house, and she became his wife, and bore him a son. But the thing that David had done was evil in the sight of Jehovah.";
web[27] = "And when the mourning was past, David sent and brought her to his house, and she became his wife, and bore him a son. But the thing that David had done displeased the LORD.";
hnv[27] = " When the mourning was past, David sent and took her home to his house, and she became his wife, and bore him a son. But the thing that David had done displeased the LORD.";
vul[27] = "transactoque luctu misit David et introduxit eam domum suam et facta est ei uxor peperitque ei filium et displicuit verbum hoc quod fecerat David coram Domino";
