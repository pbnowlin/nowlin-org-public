csb[1] = "All the tribes of Israel came to David at Hebron and said, &quot;Here we are, your own flesh and blood.";
csb[2] = "&quot;Even while Saul was king over us, you were the one who led us out to battle and brought us back. The LORD also said to you, \'You will shepherd my people Israel, and you will be ruler over Israel.\' &quot;";
csb[3] = "So all the elders of Israel came to the king at Hebron. King David made a covenant with them at Hebron in the LORD\'s presence, and they anointed David king over Israel.";
csb[4] = "David was thirty years old when he began his reign; he reigned forty years.";
csb[5] = "In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.";
csb[6] = "The king and his men marched to Jerusalem against the Jebusites who inhabited the land. The Jebusites had said to David: &quot;You will never get in here. Even the blind and lame can repel you&quot; thinking, &quot;David can\'t get in here.&quot;";
csb[7] = "Yet David did capture the stronghold of Zion, that is, the city of David.";
csb[8] = "He said that day, &quot;Whoever attacks the Jebusites must go through the water shaft to reach the lame and the blind who are despised by David.&quot; For this reason it is said, &quot;The blind and the lame will never enter the house.&quot;";
csb[9] = "David took up residence in the stronghold, which he named the city of David. He built it up all the way around from the supporting terraces inward.";
csb[10] = "David became more and more powerful, and the LORD God of Armies was with him.";
csb[11] = "King Hiram of Tyre sent envoys to David; he also sent cedar logs, carpenters, and stonemasons, and they built a palace for David.";
csb[12] = "Then David knew that the LORD had established him as king over Israel and had exalted his kingdom for the sake of his people Israel.";
csb[13] = "After he arrived from Hebron, David took more concubines and wives from Jerusalem, and more sons and daughters were born to him.";
csb[14] = "These are the names of those born to him in Jerusalem: Shammua, Shobab, Nathan, Solomon,";
csb[15] = "Ibhar, Elishua, Nepheg, Japhia,";
csb[16] = "Elishama, Eliada, and Eliphelet.";
csb[17] = "When the Philistines heard that David had been anointed king over Israel, they all went in search of David, but he heard about it and went down to the stronghold.";
csb[18] = "So the Philistines came and spread out in the Valley of Rephaim.";
csb[19] = "Then David inquired of the LORD: &quot;Should I attack the Philistines? Will you hand them over to me? &quot; The LORD replied to David, &quot;Attack, for I will certainly hand the Philistines over to you.&quot;";
csb[20] = "So David went to Baal-perazim and defeated them there and said, &quot;Like a bursting flood, the LORD has burst out against my enemies before me.&quot; Therefore, he named that place The Lord Bursts Out.";
csb[21] = "The Philistines abandoned their idols there, and David and his men carried them off.";
csb[22] = "The Philistines came up again and spread out in the Valley of Rephaim.";
csb[23] = "So David inquired of the LORD, and he answered, &quot;Do not attack directly, but circle around behind them and come at them opposite the balsam trees.";
csb[24] = "&quot;When you hear the sound of marching in the tops of the balsam trees, act decisively, for then the LORD will have gone out ahead of you to strike down the army of the Philistines.&quot;";
csb[25] = "So David did exactly as the LORD commanded him, and he struck down the Philistines all the way from Geba to Gezer.";

rsv[6] = "And the king and his men went to Jerusalem against the Jeb\'usites, the inhabitants of the land, who said to David, &quot;You will not come in here, but the blind and the lame will ward you off&quot;--thinking, &quot;David cannot come in here.&quot;";

yng[6] = "And the king goeth, and his men, to Jerusalem, unto the Jebusite, the inhabitant of the land, and they speak to David, saying, `Thou dost not come in hither, except thou turn aside the blind and the lame;\' saying, `David doth not come in hither.\'";
dby[6] = "And the king and his men went to Jerusalem against the Jebusites, the inhabitants of the land; and they spoke to David, saying, Thou shalt not come in hither, but the blind and the lame will drive thee back; as much as to say, David will not come in hither.";

kjv[8] = "And David said on that day, Whosoever getteth up to the gutter, and smiteth the Jebusites, and the lame and the blind, [that are] hated of David\'s soul, [he shall be chief and captain]. Wherefore they said, The blind and the lame shall not come into the house.";

asv[8] = "And David said on that day, Whosoever smiteth the Jebusites, let him get up to the watercourse, and [smite] the lame and the blind, that are hated of David\'s soul. Wherefore they say, There are the blind and the lame; he cannot come into the house.";
