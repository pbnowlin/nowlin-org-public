csb[1] = "During the long war between the house of Saul and the house of David, David was growing stronger and the house of Saul was becoming weaker.";
csb[2] = "Sons were born to David in Hebron: His firstborn was Amnon, by Ahinoam the Jezreelite;";
csb[3] = "his second was Chileab, by Abigail, the widow of Nabal the Carmelite; the third was Absalom, son of Maacah the daughter of King Talmai of Geshur;";
csb[4] = "the fourth was Adonijah, son of Haggith; the fifth was Shephatiah, son of Abital;";
csb[5] = "the sixth was Ithream, by David\'s wife Eglah. These were born to David in Hebron.";
csb[6] = "During the war between the house of Saul and the house of David, Abner kept acquiring more power in the house of Saul.";
csb[7] = "Now Saul had a concubine whose name was Rizpah daughter of Aiah, and Ish-bosheth questioned Abner, &quot;Why did you sleep with my father\'s concubine? &quot;";
csb[8] = "Abner was very angry about Ish-bosheth\'s accusation. &quot;Am I a dog\'s head who belongs to Judah? &quot; he asked. &quot;All this time I\'ve been loyal to the family of your father Saul, to his brothers, and to his friends and haven\'t betrayed you to David, but now you accuse me of wrongdoing with this woman!";
csb[9] = "&quot;May God punish Abner and do so severely if I don\'t do for David what the LORD swore to him:";
csb[10] = "&quot;to transfer the kingdom from the house of Saul and establish the throne of David over Israel and Judah from Dan to Beer-sheba.&quot;";
csb[11] = "Ish-bosheth did not dare respond to Abner because he was afraid of him.";
csb[12] = "Abner sent messengers as his representatives to say to David, &quot;Whose land is it? Make your covenant with me, and you can be certain I am on your side to turn all Israel over to you.&quot;";
csb[13] = "David replied, &quot;Good, I will make a covenant with you. However, there\'s one thing I require of you: You will not see my face unless you first bring Saul\'s daughter Michal when you come to see me.&quot;";
csb[14] = "Then David sent messengers to say to Ish-bosheth son of Saul, &quot;Give me back my wife, Michal. I was engaged to her for the price of a hundred Philistine foreskins.&quot;";
csb[15] = "So Ish-bosheth sent someone to take her away from her husband, Paltiel son of Laish.";
csb[16] = "Her husband followed her, weeping all the way to Bahurim. Abner said to him, &quot;Go back.&quot; So he went back.";
csb[17] = "Abner conferred with the elders of Israel: &quot;In the past you wanted David to be king over you.";
csb[18] = "&quot;Now take action, because the LORD has spoken concerning David: \'Through my servant David I will save my people Israel from the power of the Philistines and the power of all Israel\'s enemies.\' &quot;";
csb[19] = "Abner also informed the Benjaminites and went to Hebron to inform David about all that was agreed on by Israel and the whole house of Benjamin.";
csb[20] = "When Abner and twenty men came to David at Hebron, David held a banquet for him and his men.";
csb[21] = "Abner said to David, &quot;Let me now go and I will gather all Israel to my lord the king. They will make a covenant with you, and you will reign over all you desire.&quot; So David dismissed Abner, and he went in peace.";
csb[22] = "Just then David\'s soldiers and Joab returned from a raid and brought a large amount of plundered goods with them. Abner was not with David in Hebron because David had dismissed him, and he had gone in peace.";
csb[23] = "When Joab and his whole army arrived, Joab was informed, &quot;Abner son of Ner came to see the king, the king dismissed him, and he went in peace.&quot;";
csb[24] = "Joab went to the king and said, &quot;What have you done? Look here, Abner came to you. Why did you dismiss him? Now he\'s getting away.";
csb[25] = "&quot;You know that Abner son of Ner came to deceive you and to find out about your military activities and everything you\'re doing.&quot;";
csb[26] = "Then Joab left David and sent messengers after Abner. They brought him back from the well of Sirah, but David was unaware of it.";
csb[27] = "When Abner returned to Hebron, Joab pulled him aside to the middle of the city gate, as if to speak to him privately, and there Joab stabbed him in the stomach. So Abner died in revenge for the death of Asahel, Joab\'s brother.";
csb[28] = "David heard about it later and said: &quot;I and my kingdom are forever innocent before the LORD concerning the blood of Abner son of Ner.";
csb[29] = "&quot;May it hang over Joab\'s head and his father\'s whole family, and may the house of Joab never be without someone who has a discharge or a skin disease, or a man who can only work a spindle, or someone who falls by the sword or starves.&quot;";
csb[30] = "Joab and his brother Abishai killed Abner because he had put their brother Asahel to death in the battle at Gibeon.";
csb[31] = "David then ordered Joab and all the people who were with him, &quot;Tear your clothes, put on sackcloth, and mourn over Abner.&quot; And King David walked behind the coffin.";
csb[32] = "When they buried Abner in Hebron, the king wept aloud at Abner\'s tomb. All the people wept,";
csb[33] = "and the king sang a lament for Abner: Should Abner die as a fool dies?";
csb[34] = "Your hands were not bound, your feet not placed in bronze shackles. You fell like one who falls victim to criminals. And all the people wept over him even more.";
csb[35] = "Then they came to urge David to eat food while it was still day, but David took an oath: &quot;May God punish me and do so severely if I taste bread or anything else before sunset! &quot;";
csb[36] = "All the people took note of this, and it pleased them. In fact, everything the king did pleased them.";
csb[37] = "On that day all the troops and all Israel were convinced that the king had no part in the killing of Abner son of Ner.";
csb[38] = "Then the king said to his soldiers, &quot;You must know that a great leader has fallen in Israel today.";
csb[39] = "&quot;As for me, even though I am the anointed king, I have little power today. These men, the sons of Zeruiah, are too fierce for me. May the LORD repay the evildoer according to his evil! &quot;";
kjv[1] = "Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker.";
kjv[2] = "And unto David were sons born in Hebron: and his firstborn was Amnon, of Ahinoam the Jezreelitess;";
kjv[3] = "And his second, Chileab, of Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah the daughter of Talmai king of Geshur;";
kjv[4] = "And the fourth, Adonijah the son of Haggith; and the fifth, Shephatiah the son of Abital;";
kjv[5] = "And the sixth, Ithream, by Eglah David\'s wife. These were born to David in Hebron.";
kjv[6] = "And it came to pass, while there was war between the house of Saul and the house of David, that Abner made himself strong for the house of Saul.";
kjv[7] = "And Saul had a concubine, whose name [was] Rizpah, the daughter of Aiah: and [Ishbosheth] said to Abner, Wherefore hast thou gone in unto my father\'s concubine?";
kjv[8] = "Then was Abner very wroth for the words of Ishbosheth, and said, [Am] I a dog\'s head, which against Judah do shew kindness this day unto the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou chargest me to day with a fault concerning this woman?";
kjv[9] = "So do God to Abner, and more also, except, as the LORD hath sworn to David, even so I do to him;";
kjv[10] = "To translate the kingdom from the house of Saul, and to set up the throne of David over Israel and over Judah, from Dan even to Beersheba.";
kjv[11] = "And he could not answer Abner a word again, because he feared him.";
kjv[12] = "And Abner sent messengers to David on his behalf, saying, Whose [is] the land? saying [also], Make thy league with me, and, behold, my hand [shall be] with thee, to bring about all Israel unto thee.";
kjv[13] = "And he said, Well; I will make a league with thee: but one thing I require of thee, that is, Thou shalt not see my face, except thou first bring Michal Saul\'s daughter, when thou comest to see my face.";
kjv[14] = "And David sent messengers to Ishbosheth Saul\'s son, saying, Deliver [me] my wife Michal, which I espoused to me for an hundred foreskins of the Philistines.";
kjv[15] = "And Ishbosheth sent, and took her from [her] husband, [even] from Phaltiel the son of Laish.";
kjv[16] = "And her husband went with her along weeping behind her to Bahurim. Then said Abner unto him, Go, return. And he returned.";
kjv[17] = "And Abner had communication with the elders of Israel, saying, Ye sought for David in times past [to be] king over you:";
kjv[18] = "Now then do [it]: for the LORD hath spoken of David, saying, By the hand of my servant David I will save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies.";
kjv[19] = "And Abner also spake in the ears of Benjamin: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin.";
kjv[20] = "So Abner came to David to Hebron, and twenty men with him. And David made Abner and the men that [were] with him a feast.";
kjv[21] = "And Abner said unto David, I will arise and go, and will gather all Israel unto my lord the king, that they may make a league with thee, and that thou mayest reign over all that thine heart desireth. And David sent Abner away; and he went in peace.";
kjv[22] = "And, behold, the servants of David and Joab came from [pursuing] a troop, and brought in a great spoil with them: but Abner [was] not with David in Hebron; for he had sent him away, and he was gone in peace.";
kjv[23] = "When Joab and all the host that [was] with him were come, they told Joab, saying, Abner the son of Ner came to the king, and he hath sent him away, and he is gone in peace.";
kjv[24] = "Then Joab came to the king, and said, What hast thou done? behold, Abner came unto thee; why [is] it [that] thou hast sent him away, and he is quite gone?";
kjv[25] = "Thou knowest Abner the son of Ner, that he came to deceive thee, and to know thy going out and thy coming in, and to know all that thou doest.";
kjv[26] = "And when Joab was come out from David, he sent messengers after Abner, which brought him again from the well of Sirah: but David knew [it] not.";
kjv[27] = "And when Abner was returned to Hebron, Joab took him aside in the gate to speak with him quietly, and smote him there under the fifth [rib], that he died, for the blood of Asahel his brother.";
kjv[28] = "And afterward when David heard [it], he said, I and my kingdom [are] guiltless before the LORD for ever from the blood of Abner the son of Ner:";
kjv[29] = "Let it rest on the head of Joab, and on all his father\'s house; and let there not fail from the house of Joab one that hath an issue, or that is a leper, or that leaneth on a staff, or that falleth on the sword, or that lacketh bread.";
kjv[30] = "So Joab and Abishai his brother slew Abner, because he had slain their brother Asahel at Gibeon in the battle.";
kjv[31] = "And David said to Joab, and to all the people that [were] with him, Rend your clothes, and gird you with sackcloth, and mourn before Abner. And king David [himself] followed the bier.";
kjv[32] = "And they buried Abner in Hebron: and the king lifted up his voice, and wept at the grave of Abner; and all the people wept.";
kjv[33] = "And the king lamented over Abner, and said, Died Abner as a fool dieth?";
kjv[34] = "Thy hands [were] not bound, nor thy feet put into fetters: as a man falleth before wicked men, [so] fellest thou. And all the people wept again over him.";
kjv[35] = "And when all the people came to cause David to eat meat while it was yet day, David sware, saying, So do God to me, and more also, if I taste bread, or ought else, till the sun be down.";
kjv[36] = "And all the people took notice [of it], and it pleased them: as whatsoever the king did pleased all the people.";
kjv[37] = "For all the people and all Israel understood that day that it was not of the king to slay Abner the son of Ner.";
kjv[38] = "And the king said unto his servants, Know ye not that there is a prince and a great man fallen this day in Israel?";
kjv[39] = "And I [am] this day weak, though anointed king; and these men the sons of Zeruiah [be] too hard for me: the LORD shall reward the doer of evil according to his wickedness.";

rsv[8] = "Then Abner was very angry over the words of Ish-bo\'sheth, and said, &quot;Am I a dog\'s head of Judah? This day I keep showing loyalty to the house of Saul your father, to his brothers, and to his friends, and have not given you into the hand of David; and yet you charge me today with a fault concerning a woman.";
asv[8] = "Then was Abner very wroth for the words of Ish-bosheth, and said, Am I a dog\'s head that belongeth to Judah? This day do I show kindness unto the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David; and yet thou chargest me this day with a fault concerning this woman.";
yng[8] = "And it is displeasing to Abner exceedingly, because of the words of Ish-Bosheth, and he saith, `The head of a dog [am] I -- that in reference to Judah to-day I do kindness with the house of Saul thy father, unto his brethren, and unto his friends, and have not delivered thee into the hand of David -- that thou chargest against me iniquity concerning the woman to-day?";
dby[8] = "Then was Abner very wroth for the words of Ishbosheth, and said, Am I a dog\'s head, I who against Judah do shew kindness this day to the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou reproachest me this day with the fault of this woman?";
web[8] = "Then was Abner very wroth for the words of Ish-bosheth, and said, [Am] I a dog\'s head, who against Judah do show kindness this day to the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou chargest me to-day with a fault concerning this woman?";
hnv[8] = "Then was Aviner very angry for the words of Ish-Boshet, and said, Am I a dog\'s head that belongs to Yehudah? This day do I show kindness to the house of Sha\'ul your father, to his brothers, and to his friends, and have not delivered you into the hand of David; and yet you charge me this day with a fault concerning this woman.";
vul[8] = "quare ingressus es ad concubinam patris mei qui iratus nimis propter verba Hisboseth ait numquid caput canis ego sum adversum Iuda hodie qui fecerim misericordiam super domum Saul patris tui et super fratres et proximos eius et non tradidi te in manu David et tu requisisti in me quod argueres pro muliere hodie";

rsv[12] = "And Abner sent messengers to David at Hebron, saying, &quot;To whom does the land belong? Make your covenant with me, and behold, my hand shall be with you to bring over all Israel to you.&quot;";
asv[12] = "And Abner sent messengers to David on his behalf, saying, Whose is the land? saying [also], Make thy league with me, and, behold, my hand shall be with thee, to bring about all Israel unto thee.";
yng[12] = "And Abner sendeth messengers unto David for himself, saying, `Whose [is] the land?\' saying, `Make thy covenant with me, and lo, my hand [is] with thee, to bring round unto thee all Israel.\'";
dby[12] = "And Abner sent messengers to David on his behalf, saying, Whose is the land? saying [also], Make thy covenant with me, and behold, my hand shall be with thee, to turn all Israel to thee.";

rsv[13] = "And he said, &quot;Good; I will make a covenant with you; but one thing I require of you; that is, you shall not see my face, unless you first bring Michal, Saul\'s daughter, when you come to see my face.&quot;";
asv[13] = "And he said, Well; I will make a league with thee; but one thing I require of thee: that is, thou shalt not see my face, except thou first bring Michal, Saul\'s daughter, when thou comest to see my face.";
yng[13] = "And he saith, `Good -- I make with thee a covenant; only, one thing I am asking of thee, that is, Thou dost not see my face, except thou dost first bring in Michal, daughter of Saul in thy coming into see my face.\'";
dby[13] = "And he said, Well, I will make a covenant with thee; only I require one thing of thee, that is, Thou shalt not see my face, except thou first bring Michal Saul\'s daughter, when thou comest to see my face.";
web[13] = "And he said, Well; I will make a league with thee: but one thing I require of thee, that is, Thou shalt not see my face, except thou shalt first bring Michal, Saul\'s daughter, when thou comest to see my face.";
hnv[13] = "He said, Well; I will make a league with you; but one thing I require of you: that is, you shall not see my face, except you first bring Mikhal, Sha\'ul\'s daughter, when you come to see my face.";
vul[13] = "qui ait optime ego faciam tecum amicitias sed unam rem peto a te dicens non videbis faciem meam antequam adduxeris Michol filiam Saul et sic venies et videbis me";
rsv[14] = "Then David sent messengers to Ish-bo\'sheth Saul\'s son, saying, &quot;Give me my wife Michal, whom I betrothed at the price of a hundred foreskins of the Philistines.&quot;";
asv[14] = "And David sent messengers to Ish-bosheth, Saul\'s son, saying, Deliver me my wife Michal, whom I betrothed to me for a hundred foreskins of the Philistines.";
yng[14] = "And David sendeth messengers unto Ish-Bosheth son of Saul, saying, `Give up my wife Michal, whom I betrothed to myself with a hundred foreskins of the Philistines.\'";
dby[14] = "And David sent messengers to Ishbosheth Saul\'s son, saying, Deliver me my wife Michal, whom I espoused to me for a hundred foreskins of the Philistines.";
web[14] = "And David sent messengers to Ish-bosheth, Saul\'s son, saying, Deliver to [me] my wife Michal, whom I espoused to me for a hundred foreskins of the Philistines.";
hnv[14] = "David sent messengers to Ish-Boshet, Sha\'ul\'s son, saying, Deliver me my wife Mikhal, whom I pledged to be married to me for one hundred foreskins of the Pelishtim.";
vul[14] = "misit autem David nuntios ad Hisboseth filium Saul dicens redde uxorem meam Michol quam despondi mihi centum praeputiis Philisthim";
rsv[15] = "And Ish-bo\'sheth sent, and took her from her husband Pal\'ti-el the son of La\'ish.";
asv[15] = "And Ish-bosheth sent, and took her from her husband, even from Paltiel the son of Laish.";
yng[15] = "And Ish-Bosheth sendeth, and taketh her from a man, from Phaltiel son of Laish,";
dby[15] = "And Ishbosheth sent, and took her from [her] husband, from Phaltiel the son of Laish.";
web[15] = "And Ish-bosheth sent, and took her from [her] husband, [even] from Phaltiel the son of Laish.";
hnv[15] = "Ish-Boshet sent, and took her from her husband, even from Palti\'el the son of Layish.";
vul[15] = "misit ergo Hisboseth et tulit eam a viro suo Faltihel filio Lais";
rsv[16] = "But her husband went with her, weeping after her all the way to Bahu\'rim. Then Abner said to him, &quot;Go, return&quot;; and he returned.";
asv[16] = "And her husband went with her, weeping as he went, and followed her to Bahurim. Then said Abner unto him, Go, return: and he returned.";
yng[16] = "and her husband goeth with her, going on and weeping behind her, unto Bahurim, and Abner saith unto him, `Go, turn back;\' and he turneth back.";
dby[16] = "And her husband went with her along weeping behind her to Bahurim. Then said Abner to him, Go, return. And he returned.";
web[16] = "And her husband went with her, weeping behind her to Bahurim. Then said Abner to him, Go, return. And he returned.";
hnv[16] = "Her husband went with her, weeping as he went, and followed her to Bachurim. Then said Aviner to him, Go, return: and he returned.";
vul[16] = "sequebaturque eam vir suus plorans usque Baurim et dixit ad eum Abner vade revertere qui reversus est";
rsv[17] = "And Abner conferred with the elders of Israel, saying, &quot;For some time past you have been seeking David as king over you.";
asv[17] = "And Abner had communication with the elders of Israel, saying, In times past ye sought for David to be king over you:";
yng[17] = "And the word of Abner was with the elders of Israel, saying, `Heretofore ye have been seeking David for king over you,";
dby[17] = "Now Abner had communicated with the elders of Israel, saying, Ye sought for David aforetime to be king over you;";
web[17] = "And Abner had communication with the elders of Israel, saying, Ye sought for David in times past [to be] king over you:";
hnv[17] = "Aviner had communication with the Zakenim of Yisra\'el, saying, In times past you sought for David to be king over you:";
vul[17] = "sermonem quoque intulit Abner ad seniores Israhel dicens tam heri quam nudius tertius quaerebatis David ut regnaret super vos";
rsv[18] = "Now then bring it about; for the LORD has promised David, saying, \'By the hand of my servant David I will save my people Israel from the hand of the Philistines, and from the hand of all their enemies.\'&quot;";
asv[18] = "now then do it; for Jehovah hath spoken of David, saying, By the hand of my servant David I will save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies.";
yng[18] = "and now, do [it], for Jehovah hath spoken of David saying, By the hand of David my servant -- to save My people Israel out of the hand of the Philistines, and out of the hand of all their enemies.\'";
dby[18] = "and now do [it], for Jehovah has spoken of David, saying, By my servant David will I save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies.";
web[18] = "Now then do [it]: for the LORD hath spoken of David, saying, By the hand of my servant David I will save my people Israel from the hand of the Philistines, and from the hand of all their enemies.";
hnv[18] = "now then do it; for the LORD has spoken of David, saying, By the hand of my servant David I will save my people Yisra\'el out of the hand of the Pelishtim, and out of the hand of all their enemies.";
vul[18] = "nunc ergo facite quoniam Dominus locutus est ad David dicens in manu servi mei David salvabo populum meum Israhel de manu Philisthim et omnium inimicorum eius";
rsv[19] = "Abner also spoke to Benjamin; and then Abner went to tell David at Hebron all that Israel and the whole house of Benjamin thought good to do.";
asv[19] = "And Abner also spake in the ears of Benjamin: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and to the whole house of Benjamin.";
yng[19] = "And Abner speaketh also in the ears of Benjamin, and Abner goeth also to speak in the ears of David in Hebron all that [is] good in the eyes of Israel, and in the eyes of all the house of Benjamin,";
dby[19] = "And Abner also spoke in the ears of Benjamin; and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin.";
web[19] = "And Abner also spoke in the ears of Benjamin: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin.";
hnv[19] = "Aviner also spoke in the ears of Binyamin: and Aviner went also to speak in the ears of David in Hevron all that seemed good to Yisra\'el, and to the whole house of Binyamin.";
vul[19] = "locutus est autem Abner etiam ad Beniamin et abiit ut loqueretur ad David in Hebron omnia quae placuerant Israhel et universo Beniamin";
rsv[20] = "When Abner came with twenty men to David at Hebron, David made a feast for Abner and the men who were with him.";
asv[20] = "So Abner came to David to Hebron, and twenty men with him. And David made Abner and the men that were with him a feast.";
yng[20] = "and Abner cometh in unto David, to Hebron, and with him twenty men, and David maketh for Abner, and for the men who [are] with him, a banquet.";
dby[20] = "So Abner came to David to Hebron, and twenty men with him. And David made Abner and the men that were with him a repast.";
web[20] = "So Abner came to David in Hebron, and twenty men with him: and David made Abner and the men that [were] with him, a feast.";
hnv[20] = "So Aviner came to David to Hevron, and twenty men with him. David made Aviner and the men who were with him a feast.";
vul[20] = "venitque ad David in Hebron cum viginti viris et fecit David Abner et viris eius qui venerant cum eo convivium";
rsv[21] = "And Abner said to David, &quot;I will arise and go, and will gather all Israel to my lord the king, that they may make a covenant with you, and that you may reign over all that your heart desires.&quot; So David sent Abner away; and he went in peace.";
asv[21] = "And Abner said unto David, I will arise and go, and will gather all Israel unto my lord the king, that they may make a covenant with thee, and that thou mayest reign over all that thy soul desireth. And David sent Abner away; and he went in peace.";
yng[21] = "And Abner saith unto David, `I arise, and go, and gather unto my lord the king the whole of Israel, and they make with thee a covenant, and thou hast reigned over all that thy soul desireth;\' and David sendeth away Abner, and he goeth in peace.";
dby[21] = "And Abner said to David, I will arise and go, and will gather all Israel to my lord the king, that they may make a covenant with thee, and that thou mayest reign over all that thy heart desires. And David sent Abner away; and he went in peace.";
web[21] = "And Abner said to David, I will arise and go, and will gather all Israel to my lord the king, that they may make a league with thee, and that thou mayest reign over all that thy heart desireth. And David sent Abner away; and he went in peace.";
hnv[21] = "Aviner said to David, I will arise and go, and will gather all Yisra\'el to my lord the king, that they may make a covenant with you, and that you may reign over all that your soul desires. David sent Aviner away; and he went in shalom.";
vul[21] = "et dixit Abner ad David surgam ut congregem ad te dominum meum regem omnem Israhel et ineam tecum foedus et imperes omnibus sicut desiderat anima tua cum ergo deduxisset David Abner et ille isset in pace";
rsv[22] = "Just then the servants of David arrived with Jo\'ab from a raid, bringing much spoil with them. But Abner was not with David at Hebron, for he had sent him away, and he had gone in peace.";
asv[22] = "And, behold, the servants of David and Joab came from a foray, and brought in a great spoil with them: but Abner was not with David in Hebron; for he had sent him away, and he was gone in peace.";
yng[22] = "And lo, the servants of David, and Joab, have come from the troop, and much spoil have brought with them, and Abner is not with David in Hebron, for he hath sent him away, and he goeth in peace;";
dby[22] = "And behold, the servants of David and Joab came from an expedition, and brought in a great spoil with them; but Abner was no longer with David in Hebron, for he had sent him away, and he had gone in peace.";
web[22] = "And behold, the servants of David and Joab came from [pursuing] a troop, and brought in a great spoil with them: but Abner [was] not with David in Hebron; for he had sent him away, and he had gone in peace.";
hnv[22] = "Behold, the servants of David and Yo\'av came from a foray, and brought in a great spoil with them: but Aviner was not with David in Hevron; for he had sent him away, and he was gone in shalom.";
vul[22] = "statim pueri David et Ioab venerunt caesis latronibus cum praeda magna nimis Abner autem non erat cum David in Hebron quia iam dimiserat eum et profectus fuerat in pace";
rsv[23] = "When Jo\'ab and all the army that was with him came, it was told Jo\'ab, &quot;Abner the son of Ner came to the king, and he has let him go, and he has gone in peace.&quot;";
asv[23] = "When Joab and all the host that was with him were come, they told Joab, saying, Abner the son of Ner came to the king, and he hath sent him away, and he is gone in peace.";
yng[23] = "and Joab and all the host that [is] with him have come, and they declare to Joab, saying, `Abner son of Ner hath come unto the king, and he sendeth him away, and he goeth in peace.\'";
dby[23] = "And Joab and all the host that was with him came; and they told Joab, saying, Abner the son of Ner came to the king, and he has sent him away; and he is gone in peace.";
web[23] = "When Joab and all the host that [was] with him had come, they told Joab, saying, Abner the son of Ner came to the king, and he hath sent him away, and he hath gone in peace.";
hnv[23] = "When Yo\'av and all the host who was with him had come, they told Yo\'av, saying, Aviner the son of Ner came to the king, and he has sent him away, and he is gone in shalom.";
vul[23] = "et Ioab et omnis exercitus qui erat cum eo postea venerant nuntiatum est itaque Ioab a narrantibus venit Abner filius Ner ad regem et dimisit eum et abiit in pace";
rsv[24] = "Then Jo\'ab went to the king and said, &quot;What have you done? Behold, Abner came to you; why is it that you have sent him away, so that he is gone?";
asv[24] = "Then Joab came to the king, and said, What hast thou done? behold, Abner came unto thee; why is it that thou hast sent him away, and he is quite gone?";
yng[24] = "And Joab cometh unto the king, and saith, `What hast thou done? lo, Abner hath come unto thee! why [is] this -- thou hast sent him away, and he is really gone?";
dby[24] = "Then Joab came to the king, and said, What hast thou done? behold, Abner came to thee; why is it [that] thou hast sent him away, and he is gone?";
web[24] = "Then Joab came to the king, and said, What hast thou done? behold, Abner came to thee; why [is] it [that] thou hast sent him away, and he is quite gone?";
hnv[24] = "Then Yo\'av came to the king, and said, What have you done? behold, Aviner came to you; why is it that you have sent him away, and he is quite gone?";
vul[24] = "et ingressus est Ioab ad regem et ait quid fecisti ecce venit Abner ad te quare dimisisti eum et abiit et recessit";
rsv[25] = "You know that Abner the son of Ner came to deceive you, and to know your going out and your coming in, and to know all that you are doing.&quot;";
asv[25] = "Thou knowest Abner the son of Ner, that he came to deceive thee, and to know thy going out and thy coming in, and to know all that thou doest.";
yng[25] = "Thou hast known Abner son of Ner, that to deceive thee he came, and to know thy going out and thy coming in, and to know all that thou art doing.\'";
dby[25] = "Thou knowest Abner the son of Ner, that he came to deceive thee, to know thy going out and thy coming in, and to know all that thou doest.";
web[25] = "Thou knowest Abner the son of Ner, that he came to deceive thee, and to know thy going-out and thy coming-in, and to know all that thou doest.";
hnv[25] = "You know Aviner the son of Ner, that he came to deceive you, and to know your going out and your coming in, and to know all that you do.";
vul[25] = "ignoras Abner filium Ner quoniam ad hoc venit ut deciperet te et sciret exitum tuum et introitum tuum et nosset omnia quae agis";
rsv[26] = "When Jo\'ab came out from David\'s presence, he sent messengers after Abner, and they brought him back from the cistern of Sirah; but David did not know about it.";
asv[26] = "And when Joab was come out from David, he sent messengers after Abner, and they brought him back from the well of Sirah: but David knew it not.";
yng[26] = "And Joab goeth out from David, and sendeth messengers after Abner, and they bring him back from the well of Sirah, and David knew not.";
dby[26] = "And when Joab was come out from David, he sent messengers after Abner, who brought him again from the well of Sirah; but David did not know it.";
web[26] = "And when Joab had come out from David, he sent messengers after Abner, who brought him again from the well of Sirah: but David knew [it] not.";
hnv[26] = "When Yo\'av was come out from David, he sent messengers after Aviner, and they brought him back from the well of Sirah: but David didn\'t know it.";
vul[26] = "egressus itaque Ioab a David misit nuntios post Abner et reduxit eum a cisterna Sira ignorante David";
rsv[27] = "And when Abner returned to Hebron, Jo\'ab took him aside into the midst of the gate to speak with him privately, and there he smote him in the belly, so that he died, for the blood of As\'ahel his brother.";
asv[27] = "And when Abner was returned to Hebron, Joab took him aside into the midst of the gate to speak with him quietly, and smote him there in the body, so that he died, for the blood of Asahel his brother.";
yng[27] = "And Abner turneth back to Hebron, and Joab turneth him aside unto the midst of the gate to speak with him quietly, and smiteth him there in the fifth [rib] -- and he dieth -- for the blood of Asahel his brother.";
dby[27] = "And when Abner was returned to Hebron, Joab took him aside in the gate to speak with him secretly, and smote him there in the belly, that he died, for the blood of Asahel his brother.";
web[27] = "And when Abner had returned to Hebron, Joab took him aside in the gate to speak with him quietly, and smote him there under the fifth [rib] that he died, for the blood of Asahel his brother.";
hnv[27] = "When Aviner was returned to Hevron, Yo\'av took him aside into the midst of the gate to speak with him quietly, and struck him there in the body, so that he died, for the blood of `Asa\'el his brother.";
vul[27] = "cumque redisset Abner in Hebron seorsum abduxit eum Ioab ad medium portae ut loqueretur ei in dolo et percussit illum ibi in inguine et mortuus est in ultionem sanguinis Asahel fratris eius";
rsv[28] = "Afterward, when David heard of it, he said, &quot;I and my kingdom are for ever guiltless before the LORD for the blood of Abner the son of Ner.";
asv[28] = "And afterward, when David heard it, he said, I and my kingdom are guiltless before Jehovah for ever of the blood of Abner the son of Ner:";
yng[28] = "And David heareth afterwards and saith, `Acquitted [am] I, and my kingdom, by Jehovah, unto the age, from the blood of Abner son of Ner;";
dby[28] = "And afterwards David heard [it], and he said, I and my kingdom are guiltless before Jehovah for ever from the blood of Abner the son of Ner:";
web[28] = "And afterward when David heard [it], he said, I and my kingdom [are] guiltless before the LORD for ever from the blood of Abner the son of Ner:";
hnv[28] = "Afterward, when David heard it, he said, I and my kingdom are guiltless before the LORD forever of the blood of Aviner the son of Ner:";
vul[28] = "quod cum audisset David rem iam gestam ait mundus ego sum et regnum meum apud Dominum usque in sempiternum a sanguine Abner filii Ner";
rsv[29] = "May it fall upon the head of Jo\'ab, and upon all his father\'s house; and may the house of Jo\'ab never be without one who has a discharge, or who is leprous, or who holds a spindle, or who is slain by the sword, or who lacks bread!&quot;";
asv[29] = "let it fall upon the head of Joab, and upon all his father\'s house; and let there not fail from the house of Joab one that hath an issue, or that is a leper, or that leaneth on a staff, or that falleth by the sword, or that lacketh bread.";
yng[29] = "it doth stay on the head of Joab, and on all the house of his father, and there is not cut off from the house of Joab one having an issue, and leprous, and laying hold on a staff, and falling by a sword, and lacking bread.\'";
dby[29] = "let it fall on the head of Joab, and on all his father\'s house; and let there not fail from the house of Joab one that has an issue, or that is a leper, or that leans on a staff, or that falls by the sword, or that lacks bread!";
web[29] = "Let it rest on the head of Joab, and on all his father\'s house; and let there not fail from the house of Joab one that hath an issue, or that is a leper, or that leaneth on a staff, or that falleth on the sword, or that lacketh bread.";
hnv[29] = "let it fall on the head of Yo\'av, and on all his father\'s house; and let there not fail from the house of Yo\'av one who has an issue, or who is a leper, or who leans on a staff, or who falls by the sword, or who lacks bread.";
vul[29] = "et veniat super caput Ioab et super omnem domum patris eius nec deficiat de domo Ioab fluxum seminis sustinens et leprosus tenens fusum et cadens gladio et indigens pane";
rsv[30] = "So Jo\'ab and Abi\'shai his brother slew Abner, because he had killed their brother As\'ahel in the battle at Gibeon.";
asv[30] = "So Joab and Abishai his brother slew Abner, because he had killed their brother Asahel at Gibeon in the battle.";
yng[30] = "And Joab and Abishai his brother slew Abner because that he put to death Asahel their brother, in Gibeon, in battle.";
dby[30] = "So Joab and Abishai his brother killed Abner, because he had slain their brother Asahel at Gibeon in the battle.";
web[30] = "So Joab and Abishai his brother slew Abner, because he had slain their brother Asahel at Gibeon in the battle.";
hnv[30] = "So Yo\'av and Avishai his brother killed Aviner, because he had killed their brother `Asa\'el at Giv`on in the battle.";
vul[30] = "igitur Ioab et Abisai frater eius interfecerunt Abner eo quod occidisset Asahel fratrem eorum in Gabaon in proelio";
rsv[31] = "Then David said to Jo\'ab and to all the people who were with him, &quot;Rend your clothes, and gird on sackcloth, and mourn before Abner.&quot; And King David followed the bier.";
asv[31] = "And David said to Joab, and to all the people that were with him, Rend your clothes, and gird you with sackcloth, and mourn before Abner. And king David followed the bier.";
yng[31] = "And David saith unto Joab, and unto all the people who [are] with him, `Rend your garments, and gird on sackcloth, and mourn before Abner;\' and king David is going after the bier.";
dby[31] = "And David said to Joab, and to all the people that were with him, Rend your garments, and gird yourselves with sackcloth, and mourn before Abner. And king David followed the bier.";
web[31] = "And David said to Joab, and to all the people that [were] with him, Rend your clothes, and gird you with sackcloth, and mourn before Abner. And king David [himself] followed the bier.";
hnv[31] = "David said to Yo\'av, and to all the people who were with him, Tear your clothes, and gird you with sackcloth, and mourn before Aviner. King David followed the bier.";
vul[31] = "dixit autem David ad Ioab et ad omnem populum qui erat cum eo scindite vestimenta vestra et accingimini saccis et plangite ante exequias Abner porro rex David sequebatur feretrum";
rsv[32] = "They buried Abner at Hebron; and the king lifted up his voice and wept at the grave of Abner; and all the people wept.";
asv[32] = "And they buried Abner in Hebron: and the king lifted up his voice, and wept at the grave of Abner; and all the people wept.";
yng[32] = "And they bury Abner in Hebron, and the king lifteth up his voice, and weepeth at the grave of Abner, and all the people weep;";
dby[32] = "And they buried Abner in Hebron; and the king lifted up his voice and wept at the grave of Abner; and all the people wept.";
web[32] = "And they buried Abner in Hebron: and the king lifted up his voice and wept at the grave of Abner; and all the people wept.";
hnv[32] = "They buried Aviner in Hevron: and the king lifted up his voice, and wept at the grave of Aviner; and all the people wept.";
vul[32] = "cumque sepelissent Abner in Hebron levavit rex vocem suam et flevit super tumulum Abner flevit autem et omnis populus";
rsv[33] = "And the king lamented for Abner, saying, &quot;Should Abner die as a fool dies?";
asv[33] = "And the king lamented for Abner, and said, Should Abner die as a fool dieth? ";
yng[33] = "and the king lamenteth for Abner, and saith: -- `As the death of a fool doth Abner die?";
dby[33] = "And the king lamented over Abner, and said, Should Abner die as a fool dieth?";
web[33] = "And the king lamented over Abner, and said, Died Abner as a fool dieth?";
hnv[33] = "The king lamented for Aviner, and said, Should Aviner die as a fool dies?";
vul[33] = "plangensque rex Abner ait nequaquam ut mori solent ignavi mortuus est Abner";
rsv[34] = "Your hands were not bound, your feet were not fettered; as one falls before the wicked you have fallen.&quot; And all the people wept again over him.";
asv[34] = "Thy hands were not bound, nor thy feet put into fetters: As a man falleth before the children of iniquity, so didst thou fall. And all the people wept again over him.";
yng[34] = "Thy hands not bound, And thy feet to fetters not brought nigh! As one falling before sons of evil -- Thou hast fallen!\' and all the people add to weep over him.";
dby[34] = "Thy hands were not bound, Nor thy feet put into fetters; As a man falleth before wicked men, Fellest thou! And all the people wept again over him.";
web[34] = "Thy hands [were] not bound, nor thy feet put into fetters: as a man falleth before wicked men, [so] fellest thou. And all the people wept again over him.";
hnv[34] = "Your hands were not bound, nor your feet put into fetters: As a man falls before the children of iniquity, so did you fall. All the people wept again over him.";
vul[34] = "manus tuae non sunt ligatae et pedes tui non sunt conpedibus adgravati sed sicut solent cadere coram filiis iniquitatis corruisti congeminansque omnis populus flevit super eum";
rsv[35] = "Then all the people came to persuade David to eat bread while it was yet day; but David swore, saying, &quot;God do so to me and more also, if I taste bread or anything else till the sun goes down!&quot;";
asv[35] = "And all the people came to cause David to eat bread while it was yet day; but David sware, saying, God do so to me, and more also, if I taste bread, or aught else, till the sun be down.";
yng[35] = "And all the people come to cause David to eat bread while yet day, and David sweareth, saying, `Thus doth God to me, and thus He doth add, for -- before the going in of the sun, I taste no bread or any other thing.\'";
