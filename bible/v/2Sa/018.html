csb[1] = "David reviewed his troops and appointed commanders of thousands and of hundreds over them.";
csb[2] = "He then sent out the troops, a third under Joab, a third under Joab\'s brother Abishai son of Zeruiah, and a third under Ittai of Gath. The king said to the troops, &quot;I must also march out with you.&quot;";
csb[3] = "&quot;You must not go! &quot; the people pleaded. &quot;If we have to flee, they will not pay any attention to us. Even if half of us die, they will not pay any attention to us because you are worth ten thousand of us. Therefore, it is better if you support us from the city.&quot;";
csb[4] = "&quot;I will do whatever you think is best,&quot; the king replied to them. So he stood beside the city gate while all the troops marched out by hundreds and thousands.";
csb[5] = "The king commanded Joab, Abishai, and Ittai, &quot;Treat the young man Absalom gently for my sake.&quot; All the people heard the king\'s orders to all the commanders about Absalom.";
csb[6] = "Then David\'s forces marched into the field to engage Israel in battle, which took place in the forest of Ephraim.";
csb[7] = "Israel\'s army was defeated by David\'s soldiers, and the slaughter there was vast that day -- twenty thousand dead.";
csb[8] = "The battle spread over the entire area, and that day the forest claimed more people than the sword.";
csb[9] = "Absalom was riding on his mule when he happened to meet David\'s soldiers. When the mule went under the tangled branches of a large oak tree, Absalom\'s head was caught fast in the tree. The mule under him kept going, so he was suspended in midair.";
csb[10] = "One of the men saw him and informed Joab. He said, &quot;I just saw Absalom hanging in an oak tree! &quot;";
csb[11] = "&quot;You just saw him! &quot; Joab exclaimed. &quot;Why didn\'t you strike him to the ground right there? I would have given you ten silver pieces and a belt! &quot;";
csb[12] = "The man replied to Joab, &quot;Even if I had the weight of a thousand pieces of silver in my hand, I would not raise my hand against the king\'s son. For we heard the king command you, Abishai, and Ittai, \'Protect the young man Absalom for me.\'";
csb[13] = "&quot;If I had jeopardized my own life -- and nothing is hidden from the king -- you would have abandoned me.&quot;";
csb[14] = "Joab said, &quot;I\'m not going to waste time with you! &quot; He then took three spears in his hand and thrust them into Absalom\'s chest. While Absalom was still alive in the oak tree,";
csb[15] = "ten young men who were Joab\'s armor-bearers surrounded Absalom, struck him, and killed him.";
csb[16] = "Joab blew the ram\'s horn, and the troops broke off their pursuit of Israel because Joab restrained them.";
csb[17] = "They took Absalom, threw him into a large pit in the forest, and raised up a huge mound of stones over him. And all Israel fled, each to his tent.";
csb[18] = "When he was alive, Absalom had taken a pillar and raised it up for himself in the King\'s Valley, since he thought, &quot;I have no son to preserve the memory of my name.&quot; So he named the pillar after himself. It is still called Absalom\'s Monument today.";
csb[19] = "Ahimaaz son of Zadok said, &quot;Please let me run and tell the king the good news that the LORD has vindicated him by freeing him from his enemies.&quot;";
csb[20] = "Joab replied to him, &quot;You are not the man to take good news today. You may do it another day, but today you aren\'t taking good news, because the king\'s son is dead.&quot;";
csb[21] = "Joab then said to a Cushite, &quot;Go tell the king what you have seen.&quot; The Cushite bowed to Joab and took off running.";
csb[22] = "However, Ahimaaz son of Zadok persisted and said to Joab, &quot;No matter what, please let me also run behind the Cushite! &quot; Joab replied, &quot;My son, why do you want to run since you won\'t get a reward? &quot;";
csb[23] = "&quot;No matter what, I want to run! &quot; &quot;Then run! &quot; Joab said to him. So Ahimaaz ran by way of the plain and outran the Cushite.";
csb[24] = "David was sitting between the city gates when the watchman went up to the roof of the city gate and over to the wall. The watchman looked out and saw a man running alone.";
csb[25] = "He called out and told the king. The king said, &quot;If he\'s alone, he bears good news.&quot; As the first runner came closer,";
csb[26] = "the watchman saw another man running. He called out to the gatekeeper, &quot;Look! Another man is running alone! &quot; &quot;This one is also bringing good news,&quot; said the king.";
csb[27] = "The watchman said, &quot;The way the first man runs looks to me like the way Ahimaaz son of Zadok runs.&quot; &quot;This is a good man; he comes with good news,&quot; the king commented.";
csb[28] = "Ahimaaz called out to the king, &quot;All is well,&quot; and paid homage to the king with his face to the ground. He continued, &quot;Blessed be the LORD your God! He delivered up the men who rebelled against my lord the king.&quot;";
csb[29] = "The king asked, &quot;Is the young man Absalom all right? &quot; Ahimaaz replied, &quot;When Joab sent the king\'s servant and your servant, I saw a big disturbance, but I don\'t know what it was.&quot;";
csb[30] = "The king said, &quot;Move aside and stand here.&quot; So he stood to one side.";
csb[31] = "Just then the Cushite came and said, &quot;May my lord the king hear the good news: The LORD has vindicated you today by freeing you from all who rise against you! &quot;";
csb[32] = "The king asked the Cushite, &quot;Is the young man Absalom all right? &quot; The Cushite replied, &quot;I wish that the enemies of my lord the king, along with all who rise up against you with evil intent, would become like that young man.&quot;";
csb[33] = "The king was deeply moved and went up to the chamber above the city gate and wept. As he walked, he cried, &quot;My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son, my son! &quot;";
kjv[1] = "And David numbered the people that [were] with him, and set captains of thousands and captains of hundreds over them.";
rsv[1] = "Then David mustered the men who were with him, and set over them commanders of thousands and commanders of hundreds.";
asv[1] = "And David numbered the people that were with him, and set captains of thousands and captains of hundreds over them.";
yng[1] = "And David inspecteth the people who [are] with him, and setteth over them heads of thousands and heads of hundreds,";
dby[1] = "And David marshalled the people that were with him, and set captains of thousands and captains of hundreds over them.";
web[1] = "And David numbered the people that [were] with him, and set over them captains of thousands and captains of hundreds.";
hnv[1] = "David numbered the people who were with him, and set captains of thousands and captains of hundreds over them.";
vul[1] = "igitur considerato David populo suo constituit super eum tribunos et centuriones";
kjv[2] = "And David sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab\'s brother, and a third part under the hand of Ittai the Gittite. And the king said unto the people, I will surely go forth with you myself also.";
rsv[2] = "And David sent forth the army, one third under the command of Jo\'ab, one third under the command of Abi\'shai the son of Zeru\'iah, Jo\'ab\'s brother, and one third under the command of It\'tai the Gittite. And the king said to the men, &quot;I myself will also go out with you.&quot;";
asv[2] = "And David sent forth the people, a third part under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab\'s brother, and a third part under the hand of Ittai the Gittite. And the king said unto the people, I will surely go forth with you myself also.";
yng[2] = "and David sendeth the third of the people by the hand of Joab, and the third by the hand of Abishai, son of Zeruiah, brother of Joab, and the third by the hand of Ittai the Gittite, and the king saith unto the people, `I certainly go out -- I also -- with you.\'";
dby[2] = "And David sent forth the people, a third part under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab\'s brother, and a third part under the hand of Ittai the Gittite. And the king said to the people, I will surely go forth with you myself also.";
web[2] = "And David sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab\'s brother, and a third part under the hand of Ittai the Gittite. And the king said to the people, I will surely go forth with you myself also.";
hnv[2] = "David sent forth the people, a third part under the hand of Yo\'av, and a third part under the hand of Avishai the son of Tzeru\'yah, Yo\'av\'s brother, and a third part under the hand of Ittai the Gittite. The king said to the people, I will surely go forth with you myself also.";
vul[2] = "et dedit populi tertiam partem sub manu Ioab et tertiam in manu Abisai filii Sarviae fratris Ioab et tertiam sub manu Ethai qui erat de Geth dixitque rex ad populum egrediar et ego vobiscum";
kjv[3] = "But the people answered, Thou shalt not go forth: for if we flee away, they will not care for us; neither if half of us die, will they care for us: but now [thou art] worth ten thousand of us: therefore now [it is] better that thou succour us out of the city.";
rsv[3] = "But the men said, &quot;You shall not go out. For if we flee, they will not care about us. If half of us die, they will not care about us. But you are worth ten thousand of us; therefore it is better that you send us help from the city.&quot;";
asv[3] = "But the people said, Thou shalt not go forth: for if we flee away, they will not care for us; neither if half of us die, will they care for us: but thou art worth ten thousand of us; therefore now it is better that thou be ready to succor us out of the city.";
yng[3] = "And the people say, `Thou dost not go out, for if we utterly flee, they do not set [their] heart upon us; and if half of us die, they do not set [their] heart unto us -- for now like us [are] ten thousand; and now, better that thou be to us from the city for an helper.\'";
dby[3] = "But the people said, Thou shalt not go forth, for if we should in any case flee, they will not care for us; neither if half of us die, will they care for us; for *thou* art worth ten thousand of us; and now it is better that thou succour us out of the city.";
web[3] = "But the people answered, Thou shalt not go forth: for if we flee away, they will not care for us; neither if half of us die, will they care for us: but now [thou art] worth ten thousand of us: therefore now [it is] better that thou shouldst succor us out of the city.";
hnv[3] = "But the people said, You shall not go forth: for if we flee away, they will not care for us; neither if half of us die, will they care for us: but you are worth ten thousand of us; therefore now it is better that you are ready to help us out of the city.";
vul[3] = "et respondit populus non exibis sive enim fugerimus non magnopere ad eos de nobis pertinebit sive media pars ceciderit e nobis non satis curabunt quia tu unus pro decem milibus conputaris melius est igitur ut sis nobis in urbe praesidio";
kjv[4] = "And the king said unto them, What seemeth you best I will do. And the king stood by the gate side, and all the people came out by hundreds and by thousands.";
rsv[4] = "The king said to them, &quot;Whatever seems best to you I will do.&quot; So the king stood at the side of the gate, while all the army marched out by hundreds and by thousands.";
asv[4] = "And the king said unto them, What seemeth you best I will do. And the king stood by the gate-side, and all the people went out by hundreds and by thousands.";
yng[4] = "And the king saith unto them, `That which is good in your eyes I do;\' and the king standeth at the side of the gate, and all the people have gone out by hundreds and by thousands,";
dby[4] = "And the king said to them, I will do what is good in your sight. And the king stood by the gate-side, and all the people came out by hundreds and by thousands.";
web[4] = "And the king said to them, What seemeth to you best I will do. And the king stood by the gate side, and all the people came out by hundreds and by thousands.";
hnv[4] = "The king said to them, What seems you best I will do. The king stood by the gate-side, and all the people went out by hundreds and by thousands.";
vul[4] = "ad quos rex ait quod vobis rectum videtur hoc faciam stetit ergo rex iuxta portam egrediebaturque populus per turmas suas centeni et milleni";
kjv[5] = "And the king commanded Joab and Abishai and Ittai, saying, [Deal] gently for my sake with the young man, [even] with Absalom. And all the people heard when the king gave all the captains charge concerning Absalom.";
rsv[5] = "And the king ordered Jo\'ab and Abi\'shai and It\'tai, &quot;Deal gently for my sake with the young man Ab\'salom.&quot; And all the people heard when the king gave orders to all the commanders about Ab\'salom.";
asv[5] = "And the king commanded Joab and Abishai and Ittai, saying, Deal gently for my sake with the young man, even with Absalom. And all the people heard when the king gave all the captains charge concerning Absalom.";
yng[5] = "and the king chargeth Joab, and Abishai, and Ittai, saying, `Gently -- for me, for the youth, for Absalom;\' and all the people heard in the king\'s charging all the heads concerning Absalom.";
dby[5] = "And the king commanded Joab and Abishai and Ittai, saying, [Deal] gently for my sake with the young man Absalom. And all the people heard when the king gave all the captains charge concerning Absalom.";
web[5] = "And the king commanded Joab and Abishai and Ittai, saying, [Deal] gently for my sake with the young man, [even] with Absalom. And all the people heard when the king gave all the captains charge concerning Absalom.";
hnv[5] = "The king commanded Yo\'av and Avishai and Ittai, saying, Deal gently for my sake with the young man, even with Avshalom. All the people heard when the king gave all the captains charge concerning Avshalom.";
vul[5] = "et praecepit rex Ioab et Abisai et Ethai dicens servate mihi puerum Absalom et omnis populus audiebat praecipientem regem cunctis principibus pro Absalom";
kjv[6] = "So the people went out into the field against Israel: and the battle was in the wood of Ephraim;";
rsv[6] = "So the army went out into the field against Israel; and the battle was fought in the forest of E\'phraim.";
asv[6] = "So the people went out into the field against Israel: and the battle was in the forest of Ephraim.";
yng[6] = "And the people goeth out into the field to meet Israel, and the battle is in a forest of Ephraim;";
dby[6] = "And the people went out into the field against Israel; and the battle was in the forest of Ephraim.";
web[6] = "So the people went out into the field against Israel: and the battle was in the wood of Ephraim;";
hnv[6] = "So the people went out into the field against Yisra\'el: and the battle was in the forest of Efrayim.";
vul[6] = "itaque egressus est populus in campum contra Israhel et factum est proelium in saltu Ephraim";
kjv[7] = "Where the people of Israel were slain before the servants of David, and there was there a great slaughter that day of twenty thousand [men].";
rsv[7] = "And the men of Israel were defeated there by the servants of David, and the slaughter there was great on that day, twenty thousand men.";
asv[7] = "And the people of Israel were smitten there before the servants of David, and there was a great slaughter there that day of twenty thousand men.";
yng[7] = "and smitten there are the people of Israel before the servants of David, and the smiting there is great on that day -- twenty thousand;";
dby[7] = "And the people of Israel were routed before the servants of David, and there was a great slaughter there that day: twenty thousand men.";
web[7] = "Where the people of Israel were slain before the servants of David, and there was there a great slaughter that day of twenty thousand [men].";
hnv[7] = "The people of Yisra\'el were struck there before the servants of David, and there was a great slaughter there that day of twenty thousand men.";
vul[7] = "et caesus est ibi populus Israhel ab exercitu David factaque est ibi plaga magna in die illa viginti milium";
kjv[8] = "For the battle was there scattered over the face of all the country: and the wood devoured more people that day than the sword devoured.";
rsv[8] = "The battle spread over the face of all the country; and the forest devoured more people that day than the sword.";
asv[8] = "For the battle was there spread over the face of all the country; and the forest devoured more people that day than the sword devoured.";
yng[8] = "and the battle is there scattered over the face of all the land, and the forest multiplieth to devour among the people more than those whom the sword hath devoured in that day.";
dby[8] = "And the battle was there scattered over the face of all the country; and the forest devoured more people that day than the sword devoured.";
web[8] = "For the battle was there scattered over the face of all the country: and the wood devoured more people that day than the sword devoured.";
hnv[8] = "For the battle was there spread over the surface of all the country; and the forest devoured more people that day than the sword devoured.";
vul[8] = "fuit autem ibi proelium dispersum super faciem omnis terrae et multo plures erant quos saltus consumpserat de populo quam hii quos voraverat gladius in die illa";
kjv[9] = "And Absalom met the servants of David. And Absalom rode upon a mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was taken up between the heaven and the earth; and the mule that [was] under him went away.";
rsv[9] = "And Ab\'salom chanced to meet the servants of David. Ab\'salom was riding upon his mule, and the mule went under the thick branches of a great oak, and his head caught fast in the oak, and he was left hanging between heaven and earth, while the mule that was under him went on.";
asv[9] = "And Absalom chanced to meet the servants of David. And Absalom was riding upon his mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was taken up between heaven and earth; and the mule that was under him went on.";
yng[9] = "And Absalom meeteth before the servants of David, and Absalom is riding on the mule, and the mule cometh in under an entangled bough of the great oak, and his head taketh hold on the oak, and he is placed between the heavens and the earth, and the mule that [is] under him hath passed on.";
dby[9] = "And Absalom found himself in the presence of David\'s servants. And Absalom was riding upon a mule, and the mule went under the thick boughs of the great terebinth, and his head caught in the terebinth, and he was taken up between the heaven and the earth; and the mule that was under him went away.";
web[9] = "And Absalom met the servants of David. And Absalom rode upon a mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was suspended between the heaven and the earth; and the mule that [was] under him went away.";
hnv[9] = "Avshalom happened to meet the servants of David. Avshalom was riding on his mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was taken up between the sky and eretz; and the mule that was under him went on.";
vul[9] = "accidit autem ut occurreret Absalom servis David sedens mulo cumque ingressus fuisset mulus subter condensam quercum et magnam adhesit caput eius quercui et illo suspenso inter caelum et terram mulus cui sederat pertransivit";
kjv[10] = "And a certain man saw [it], and told Joab, and said, Behold, I saw Absalom hanged in an oak.";
rsv[10] = "And a certain man saw it, and told Jo\'ab, &quot;Behold, I saw Ab\'salom hanging in an oak.&quot;";
asv[10] = "And a certain man saw it, and told Joab, and said, Behold, I saw Absalom hanging in an oak.";
yng[10] = "And one man seeth, and declareth to Joab, and saith, `Lo, I saw Absalom hanged in an oak.\'";
dby[10] = "And a man saw it, and told Joab, and said, Behold, I saw Absalom hanging in a terebinth.";
web[10] = "And a certain man saw [it], and told Joab, and said, Behold, I saw Absalom hanging in an oak.";
hnv[10] = "A certain man saw it, and told Yo\'av, and said, Behold, I saw Avshalom hanging in an oak.";
vul[10] = "vidit autem hoc quispiam et nuntiavit Ioab dicens vidi Absalom pendere de quercu";
kjv[11] = "And Joab said unto the man that told him, And, behold, thou sawest [him], and why didst thou not smite him there to the ground? and I would have given thee ten [shekels] of silver, and a girdle.";
rsv[11] = "Jo\'ab said to the man who told him, &quot;What, you saw him! Why then did you not strike him there to the ground? I would have been glad to give you ten pieces of silver and a girdle.&quot;";
asv[11] = "And Joab said unto the man that told him, And, behold, thou sawest it, and why didst thou not smite him there to the ground? and I would have given thee ten [pieces of] silver, and a girdle.";
yng[11] = "And Joab saith to the man who is declaring [it] to him, `And lo, thou hast seen -- and wherefore didst thou not smite him there to the earth -- and on me to give to thee ten silverlings and one girdle?\'";
dby[11] = "And Joab said to the man that told him, And behold, thou sawest [him], and why didst thou not smite him there to the ground? and I would have given thee ten silver pieces and a girdle.";
web[11] = "And Joab said to the man that told him, And behold, thou sawest [him], and why didst thou not smite him there to the ground? and I would have given thee ten [shekels] of silver, and a girdle.";
hnv[11] = "Yo\'av said to the man who told him, Behold, you saw it, and why didn\'t you strike him there to the ground? and I would have given you ten [pieces of] silver, and a sash.";
vul[11] = "et ait Ioab viro qui nuntiaverat ei si vidisti quare non confodisti eum cum terra et ego dedissem tibi decem argenti siclos et unum balteum";
kjv[12] = "And the man said unto Joab, Though I should receive a thousand [shekels] of silver in mine hand, [yet] would I not put forth mine hand against the king\'s son: for in our hearing the king charged thee and Abishai and Ittai, saying, Beware that none [touch] the young man Absalom.";
rsv[12] = "But the man said to Jo\'ab, &quot;Even if I felt in my hand the weight of a thousand pieces of silver, I would not put forth my hand against the king\'s son; for in our hearing the king commanded you and Abi\'shai and It\'tai, \'For my sake protect the young man Ab\'salom.\'";
asv[12] = "And the man said unto Joab, Though I should receive a thousand [pieces of] silver in my hand, yet would I not put forth my hand against the king\'s son: for in our hearing the king charged thee and Abishai and Ittai, saying, Beware that none touch the young man Absalom.";
yng[12] = "And the man saith unto Joab, `Yea, though I am weighing on my hand a thousand silverlings, I do not put forth my hand unto the son of the king; for in our ears hath the king charged thee, and Abishai, and Ittai, saying, Observe ye who [is] against the youth -- against Absalom;";
dby[12] = "And the man said to Joab, Though I should receive a thousand silver pieces in my hand, yet would I not put forth my hand against the king\'s son; for in our hearing the king charged thee and Abishai and Ittai, saying, Take care, whoever it be [of you], of the young man Absalom.";
web[12] = "And the man said to Joab, Though I should receive a thousand [shekels] of silver in my hand, [yet] would I not put forth my hand against the king\'s son: for in our hearing the king charged thee and Abishai and Ittai, saying, Beware that none [touch] the young man Absalom.";
hnv[12] = "The man said to Yo\'av, Though I should receive a thousand [pieces of] silver in my hand, I still wouldn\'t put forth my hand against the king\'s son; for in our hearing the king charged you and Avishai and Ittai, saying, Beware that none touch the young man Avshalom.";
vul[12] = "qui dixit ad Ioab si adpenderes in manibus meis mille argenteos nequaquam mitterem manum meam in filium regis audientibus enim nobis praecepit rex tibi et Abisai et Ethai dicens custodite mihi puerum Absalom";
kjv[13] = "Otherwise I should have wrought falsehood against mine own life: for there is no matter hid from the king, and thou thyself wouldest have set thyself against [me].";
rsv[13] = "On the other hand, if I had dealt treacherously against his life (and there is nothing hidden from the king), then you yourself would have stood aloof.&quot;";
asv[13] = "Otherwise if I had dealt falsely against his life (and there is no matter hid from the king), then thou thyself wouldest have set thyself against [me].";
yng[13] = "or I had done against my soul a vain thing, and no matter is hid from the king, and thou -- thou dost station thyself over-against.\'";
dby[13] = "Or I should have acted falsely against mine own life, for there is no matter concealed from the king, and thou wouldest have set thyself against [me].";
web[13] = "Otherwise I should have wrought falsehood against my own life: for there is no matter hid from the king, and thou thyself wouldst have set thyself against [me].";
hnv[13] = "Otherwise if I had dealt falsely against his life (and there is no matter hid from the king), then you yourself would have set yourself against [me].";
vul[13] = "sed et si fecissem contra animam meam audacter nequaquam hoc regem latere potuisset et tu stares ex adverso";
kjv[14] = "Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom, while he [was] yet alive in the midst of the oak.";
rsv[14] = "Jo\'ab said, &quot;I will not waste time like this with you.&quot; And he took three darts in his hand, and thrust them into the heart of Ab\'salom, while he was still alive in the oak.";
asv[14] = "Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom, while he was yet alive in the midst of the oak.";
yng[14] = "And Joab saith, `Not right -- I tarry before thee;\' and he taketh three darts in his hand, and striketh them into the heart of Absalom, while he [is] alive, in the midst of the oak.";
dby[14] = "Then said Joab, I may not tarry thus with thee. And he took three spears in his hand, and thrust them into Absalom\'s body, while he was yet alive in the midst of the terebinth.";
web[14] = "Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom, while he [was] yet alive in the midst of the oak.";
hnv[14] = "Then said Yo\'av, I may not wait thus with you. He took three darts in his hand, and thrust them through the heart of Avshalom, while he was yet alive in the midst of the oak.";
vul[14] = "et ait Ioab non sicut tu vis sed adgrediar eum coram te tulit ergo tres lanceas in manu sua et infixit eas in corde Absalom cumque adhuc palpitaret herens in quercu";
kjv[15] = "And ten young men that bare Joab\'s armour compassed about and smote Absalom, and slew him.";
rsv[15] = "And ten young men, Jo\'ab\'s armor-bearers, surrounded Ab\'salom and struck him, and killed him.";
asv[15] = "And ten young men that bare Joab\'s armor compassed about and smote Absalom, and slew him.";
yng[15] = "And they go round -- ten youths bearing weapons of Joab -- and smite Absalom, and put him to death.";
dby[15] = "And ten young men that bore Joab\'s armour surrounded and smote Absalom, and killed him.";
web[15] = "And ten young men that bore Joab\'s armor compassed about and smote Absalom, and slew him.";
hnv[15] = "Ten young men who bore Yo\'av\'s armor compassed about and struck Avshalom, and killed him.";
vul[15] = "cucurrerunt decem iuvenes armigeri Ioab et percutientes interfecerunt eum";
kjv[16] = "And Joab blew the trumpet, and the people returned from pursuing after Israel: for Joab held back the people.";
rsv[16] = "Then Jo\'ab blew the trumpet, and the troops came back from pursuing Israel; for Jo\'ab restrained them.";
asv[16] = "And Joab blew the trumpet, and the people returned from pursuing after Israel; for Joab held back the people.";
yng[16] = "And Joab bloweth with a trumpet, and the people turneth back from pursuing after Israel, for Joab hath kept back the people;";
dby[16] = "And Joab blew the trumpet, and the people returned from pursuing after Israel; for Joab kept back the people.";
web[16] = "And Joab blew the trumpet, and the people returned from pursuing Israel: for Joab restrained the people.";
hnv[16] = "Yo\'av blew the shofar, and the people returned from pursuing after Yisra\'el; for Yo\'av held back the people.";
vul[16] = "cecinit autem Ioab bucina et retinuit populum ne persequeretur fugientem Israhel volens parcere multitudini";
kjv[17] = "And they took Absalom, and cast him into a great pit in the wood, and laid a very great heap of stones upon him: and all Israel fled every one to his tent.";
rsv[17] = "And they took Ab\'salom, and threw him into a great pit in the forest, and raised over him a very great heap of stones; and all Israel fled every one to his own home.";
asv[17] = "And they took Absalom, and cast him into the great pit in the forest, and raised over him a very great heap of stones: and all Israel fled every one to his tent.";
yng[17] = "and they take Absalom and cast him in the forest unto the great pit, and set up over him a very great heap of stones, and all Israel have fled -- each to his tent.";
dby[17] = "And they took Absalom, and cast him into a great pit in the wood, and raised a very great heap of stones upon him. And all Israel fled every one to his tent.";
web[17] = "And they took Absalom, and cast him into a great pit in the wood, and laid a very great heap of stones upon him: and all Israel fled every one to his tent.";
hnv[17] = "They took Avshalom, and cast him into the great pit in the forest, and raised over him a very great heap of stones: and all Yisra\'el fled everyone to his tent.";
vul[17] = "et tulerunt Absalom et proiecerunt eum in saltu in foveam grandem et conportaverunt super eum acervum lapidum magnum nimis omnis autem Israhel fugit in tabernacula sua";
kjv[18] = "Now Absalom in his lifetime had taken and reared up for himself a pillar, which [is] in the king\'s dale: for he said, I have no son to keep my name in remembrance: and he called the pillar after his own name: and it is called unto this day, Absalom\'s place.";
rsv[18] = "Now Ab\'salom in his lifetime had taken and set up for himself the pillar which is in the King\'s Valley, for he said, &quot;I have no son to keep my name in remembrance&quot;; he called the pillar after his own name, and it is called Ab\'salom\'s monument to this day.";
asv[18] = "Now Absalom in his lifetime had taken and reared up for himself the pillar, which is in the king\'s dale; for he said, I have no son to keep my name in remembrance: and he called the pillar after his own name; and it is called Absalom\'s monument, unto this day.";
yng[18] = "And Absalom hath taken, and setteth up for himself in his life, the standing-pillar that [is] in the king\'s valley, for he said, `I have no son to cause my name to be remembered;\' and he calleth the standing-pillar by his own name, and it is called `The monument of Absalom\' unto this day.";
dby[18] = "Now Absalom in his lifetime had taken and reared up for himself a monument, which is in the king\'s dale; for he said, I have no son to keep my name in remembrance; and he called the monument after his own name; and it is called unto this day, Absalom\'s memorial.";
web[18] = "Now Absalom in his life-time had taken and raised for himself a pillar, which [is] in the king\'s dale: for he said, I have no son to keep my name in remembrance: and he called the pillar after his own name: and it is called to this day, Absalom\'s place.";
hnv[18] = "Now Avshalom in his lifetime had taken and reared up for himself the pillar, which is in the king\'s dale; for he said, I have no son to keep my name in memory: and he called the pillar after his own name; and it is called Avshalom\'s monument, to this day.";
vul[18] = "porro Absalom erexerat sibi cum adhuc viveret titulum qui est in valle Regis dixerat enim non habeo filium et hoc erit monumentum nominis mei vocavitque titulum nomine suo et appellatur manus Absalom usque ad hanc diem";
kjv[19] = "Then said Ahimaaz the son of Zadok, Let me now run, and bear the king tidings, how that the LORD hath avenged him of his enemies.";
rsv[19] = "Then said Ahi\'ma-az the son of Zadok, &quot;Let me run, and carry tidings to the king that the LORD has delivered him from the power of his enemies.&quot;";
asv[19] = "Then said Ahimaaz the son of Zadok, Let me now run, and bear the king tidings, how that Jehovah hath avenged him of his enemies.";
yng[19] = "And Ahimaaz son of Zadok said, `Let me run, I pray thee, and I bear the king tidings, for Jehovah hath delivered him out of the hand of his enemies;\'";
dby[19] = "And Ahimaaz the son of Zadok said, Let me run, I pray, and carry the king the news that Jehovah has avenged him of his enemies.";
web[19] = "Then said Ahimaaz the son of Zadok, Let me now run, and inform the king, how the LORD hath avenged himself of his enemies.";
hnv[19] = "Then said Achima`atz the son of Tzadok, Let me now run, and bear the king news, how that the LORD has avenged him of his enemies.";
vul[19] = "Achimaas autem filius Sadoc ait curram et nuntiabo regi quia iudicium fecerit ei Dominus de manu inimicorum eius";
kjv[20] = "And Joab said unto him, Thou shalt not bear tidings this day, but thou shalt bear tidings another day: but this day thou shalt bear no tidings, because the king\'s son is dead.";
rsv[20] = "And Jo\'ab said to him, &quot;You are not to carry tidings today; you may carry tidings another day, but today you shall carry no tidings, because the king\'s son is dead.&quot;";
asv[20] = "And Joab said unto him, Thou shalt not be the bearer of tidings this day, but thou shalt bear tidings another day; but this day thou shalt bear no tidings, because the king\'s son is dead.";
yng[20] = "and Joab saith to him, `Thou art not a man of tidings this day, but thou hast borne tidings on another day, and this day thou dost not bear tidings, because the king\'s son [is] dead.\'";
dby[20] = "And Joab said to him, Thou shalt not be a bearer of news to-day, but thou shalt carry the news another day; but to-day thou shalt carry no news, because the king\'s son is dead.";
web[20] = "And Joab said to him, Thou shalt not bear tidings this day, but thou shalt bear tidings another day: but this day thou shalt bear no tidings, because the king\'s son is dead.";
hnv[20] = "Yo\'av said to him, You shall not be the bearer of news this day, but you shall bear news another day; but this day you shall bear no news, because the king\'s son is dead.";
vul[20] = "ad quem Ioab dixit non eris nuntius in hac die sed nuntiabis in alia hodie nolo te nuntiare filius enim regis est mortuus";
kjv[21] = "Then said Joab to Cushi, Go tell the king what thou hast seen. And Cushi bowed himself unto Joab, and ran.";
rsv[21] = "Then Jo\'ab said to the Cushite, &quot;Go, tell the king what you have seen.&quot; The Cushite bowed before Jo\'ab, and ran.";
asv[21] = "Then said Joab to the Cushite, Go, tell the king what thou hast seen. And the Cushite bowed himself unto Joab, and ran.";
yng[21] = "And Joab saith to Cushi, `Go, declare to the king that which thou hast seen;\' and Cushi boweth himself to Joab, and runneth.";
dby[21] = "Then said Joab to the Cushite, Go, tell the king what thou hast seen. And the Cushite bowed himself to Joab, and ran.";
web[21] = "Then said Joab to Cushi, Go, tell the king what thou hast seen. And Cushi bowed himself to Joab, and ran.";
hnv[21] = "Then said Yo\'av to the Kushite, Go, tell the king what you have seen. The Kushite bowed himself to Yo\'av, and ran.";
vul[21] = "et ait Ioab Chusi vade et nuntia regi quae vidisti adoravit Chusi Ioab et cucurrit";
kjv[22] = "Then said Ahimaaz the son of Zadok yet again to Joab, But howsoever, let me, I pray thee, also run after Cushi. And Joab said, Wherefore wilt thou run, my son, seeing that thou hast no tidings ready?";
rsv[22] = "Then Ahi\'ma-az the son of Zadok said again to Jo\'ab, &quot;Come what may, let me also run after the Cushite.&quot; And Jo\'ab said, &quot;Why will you run, my son, seeing that you will have no reward for the tidings?&quot;";
asv[22] = "Then said Ahimaaz the son of Zadok yet again to Joab, But come what may, let me, I pray thee, also run after the Cushite. And Joab said, Wherefore wilt thou run, my son, seeing that thou wilt have no reward for the tidings?";
yng[22] = "And Ahimaaz son of Zadok addeth again, and saith unto Joab, `And whatever it be, let me run, I pray thee, I also, after the Cushite.\' And Joab saith, `Why [is] this -- thou art running, my son, and for thee there are no tidings found?\' --";
dby[22] = "And Ahimaaz the son of Zadok said yet again to Joab, Come what may, let me, I pray thee, also run after the Cushite. And Joab said, Why wilt thou run, my son, seeing that there is no news suited [to thee]?";
web[22] = "Then said Ahimaaz the son of Zadok yet again to Joab, But however, let me also, I pray thee, run after Cushi. And Joab said, Why wilt thou run, my son, seeing that thou hast no tidings ready?";
hnv[22] = "Then said Achima`atz the son of Tzadok yet again to Yo\'av, But come what may, Please let me also run after the Kushite. Yo\'av said, Why will you run, my son, seeing that you will have no reward for the news?";
vul[22] = "rursum autem Achimaas filius Sadoc dixit ad Ioab quid inpedit si etiam ego curram post Chusi dixitque Ioab quid vis currere fili mi non eris boni nuntii baiulus";
kjv[23] = "But howsoever, [said he], let me run. And he said unto him, Run. Then Ahimaaz ran by the way of the plain, and overran Cushi.";
rsv[23] = "&quot;Come what may,&quot; he said, &quot;I will run.&quot; So he said to him, &quot;Run.&quot; Then Ahi\'ma-az ran by the way of the plain, and outran the Cushite.";
asv[23] = "But come what may, [said he], I will run. And he said unto him, Run. Then Ahimaaz ran by the way of the Plain, and outran the Cushite.";
yng[23] = "`And, whatever it be, [said he,] let me run.\' And he saith to him, `Run;\' and Ahimaaz runneth the way of the circuit, and passeth by the Cushite.";
dby[23] = "-- But, come what may, let me run. And he said to him, Run. And Ahimaaz ran by the way of the plain, and outstripped the Cushite.";
web[23] = "But however, [said he], let me run. And he said to him, Run. Then Ahimaaz ran by the way of the plain, and outran Cushi.";
hnv[23] = "But come what may, [said he], I will run. He said to him, Run. Then Achima`atz ran by the way of the Plain, and outran the Kushite.";
vul[23] = "qui respondit quid enim si cucurrero et ait ei curre currens ergo Achimaas per viam conpendii transivit Chusi";
kjv[24] = "And David sat between the two gates: and the watchman went up to the roof over the gate unto the wall, and lifted up his eyes, and looked, and behold a man running alone.";
rsv[24] = "Now David was sitting between the two gates; and the watchman went up to the roof of the gate by the wall, and when he lifted up his eyes and looked, he saw a man running alone.";
asv[24] = "Now David was sitting between the two gates: and the watchman went up to the roof of the gate unto the wall, and lifted up his eyes, and looked, and, behold, a man running alone.";
yng[24] = "And David is sitting between the two gates, and the watchman goeth unto the roof of the gate, unto the wall, and lifteth up his eyes, and looketh, and lo, a man running by himself.";
dby[24] = "And David sat between the two gates; and the watchman went up to the roof of the gate, on to the wall, and lifted up his eyes and looked, and behold, a man running alone.";
web[24] = "And David sat between the two gates: and the watchman went up to the roof over the gate to the wall, and lifted up his eyes, and looked, and behold a man running alone.";
hnv[24] = "Now David was sitting between the two gates: and the watchman went up to the roof of the gate to the wall, and lifted up his eyes, and looked, and, behold, a man running alone.";
vul[24] = "David autem sedebat inter duas portas speculator vero qui erat in fastigio portae super murum elevans oculos vidit hominem currentem solum";
kjv[25] = "And the watchman cried, and told the king. And the king said, If he [be] alone, [there is] tidings in his mouth. And he came apace, and drew near.";
rsv[25] = "And the watchman called out and told the king. And the king said, &quot;If he is alone, there are tidings in his mouth.&quot; And he came apace, and drew near.";
asv[25] = "And the watchman cried, and told the king. And the king said, If he be alone, there is tidings in his mouth. And he came apace, and drew near.";
yng[25] = "And the watchman calleth, and declareth to the king, and the king saith, `If by himself, tidings [are] in his mouth;\' and he cometh, coming on and drawing near.";
dby[25] = "And the watchman cried, and told the king. And the king said, If he be alone, there is news in his mouth. And he came on and drew near.";
web[25] = "And the watchman called, and told the king. And the king said, If he [is] alone [there is] tidings in his mouth. And he came apace, and drew near.";
hnv[25] = "The watchman cried, and told the king. The king said, If he be alone, there is news in his mouth. He came apace, and drew near.";
vul[25] = "et exclamans indicavit regi dixitque rex si solus est bonus est nuntius in ore eius properante autem illo et accedente propius";
kjv[26] = "And the watchman saw another man running: and the watchman called unto the porter, and said, Behold [another] man running alone. And the king said, He also bringeth tidings.";
rsv[26] = "And the watchman saw another man running; and the watchman called to the gate and said, &quot;See, another man running alone!&quot; The king said, &quot;He also brings tidings.&quot;";
asv[26] = "And the watchman saw another man running; and the watchman called unto the porter, and said, Behold, [another] man running alone. And the king said, He also bringeth tidings.";
yng[26] = "And the watchman seeth another man running, and the watchman calleth unto the gatekeeper, and saith, `Lo, a man running by himself;\' and the king saith, `Also this one is bearing tidings.\'";
dby[26] = "And the watchman saw another man running; and the watchman called to the porter and said, Behold a man running alone. And the king said, He also is a bearer of news.";
web[26] = "And the watchman saw another man running: and the watchman called to the porter, and said, Behold [another] man running alone. And the king said, He also bringeth tidings.";
hnv[26] = "The watchman saw another man running; and the watchman called to the porter, and said, Behold, [another] man running alone. The king said, He also brings news.";
vul[26] = "vidit speculator hominem alterum currentem et vociferans in culmine ait apparet mihi homo currens solus dixitque rex et iste bonus est nuntius";
kjv[27] = "And the watchman said, Me thinketh the running of the foremost is like the running of Ahimaaz the son of Zadok. And the king said, He [is] a good man, and cometh with good tidings.";
rsv[27] = "And the watchman said, &quot;I think the running of the foremost is like the running of Ahi\'ma-az the son of Zadok.&quot; And the king said, &quot;He is a good man, and comes with good tidings.&quot;";
asv[27] = "And the watchman said, I think the running of the foremost is like the running of Ahimaaz the son of Zadok. And the king said, He is a good man, and cometh with good tidings.";
yng[27] = "And the watchman saith, `I see the running of the first as the running of Ahimaaz son of Zadok.\' And the king saith, `This [is] a good man, and with good tidings he cometh.\'";
dby[27] = "And the watchman said, I see the running of the foremost like the running of Ahimaaz the son of Zadok. And the king said, He is a good man; and comes with good news.";
web[27] = "And the watchman said, I think the running of the foremost is like the running of Ahimaaz the son of Zadok. And the king said, He [is] a good man, and cometh with good news.";
hnv[27] = "The watchman said, I think the running of the foremost is like the running of Achima`atz the son of Tzadok. The king said, He is a good man, and comes with good news.";
vul[27] = "speculator autem contemplor ait cursum prioris quasi cursum Achimaas filii Sadoc et ait rex vir bonus est et nuntium portans bonum venit";
kjv[28] = "And Ahimaaz called, and said unto the king, All is well. And he fell down to the earth upon his face before the king, and said, Blessed [be] the LORD thy God, which hath delivered up the men that lifted up their hand against my lord the king.";
rsv[28] = "Then Ahi\'ma-az cried out to the king, &quot;All is well.&quot; And he bowed before the king with his face to the earth, and said, &quot;Blessed be the LORD your God, who has delivered up the men who raised their hand against my lord the king.&quot;";
asv[28] = "And Ahimaaz called, and said unto the king, All is well. And he bowed himself before the king with his face to the earth, and said, Blessed be Jehovah thy God, who hath delivered up the men that lifted up their hand against my lord the king.";
yng[28] = "And Ahimaaz calleth and saith unto the king, `Peace;\' and he boweth himself to the king, on his face, to the earth, and saith, `Blessed [is] Jehovah thy God who hath shut up the men who lifted up their hand against my lord the king.\'";
dby[28] = "And Ahimaaz called and said to the king, Peace! And he fell down to the earth on his face before the king, and said, Blessed be Jehovah thy God, who has delivered up the men that lifted up their hand against my lord the king.";
web[28] = "And Ahimaaz called, and said to the king, All is well. And he fell down to the earth upon his face before the king, and said, Blessed [be] the LORD thy God, who hath delivered up the men that raised their hand against my lord the king.";
hnv[28] = " Achima`atz called, and said to the king, All is well. He bowed himself before the king with his face to the eretz, and said, Blessed be the LORD your God, who has delivered up the men who lifted up their hand against my lord the king.";
vul[28] = "clamans autem Achimaas dixit ad regem salve et adorans regem coram eo pronus in terram ait benedictus Dominus Deus tuus qui conclusit homines qui levaverunt manus suas contra dominum meum regem";
kjv[29] = "And the king said, Is the young man Absalom safe? And Ahimaaz answered, When Joab sent the king\'s servant, and [me] thy servant, I saw a great tumult, but I knew not what [it was].";
rsv[29] = "And the king said, &quot;Is it well with the young man Ab\'salom?&quot; Ahi\'ma-az answered, &quot;When Jo\'ab sent your servant, I saw a great tumult, but I do not know what it was.&quot;";
asv[29] = "And the king said, Is it well with the young man Absalom? And Ahimaaz answered, When Joab sent the king\'s servant, even me thy servant, I saw a great tumult, but I knew not what it was.";
yng[29] = "And the king saith, `Peace to the youth -- to Absalom?\' And Ahimaaz saith, `I saw the great multitude, at the sending away of the servant of the king, even thy servant [by] Joab, and I have not known what [it is].\'";
dby[29] = "And the king said, Is it well with the young man Absalom? And Ahimaaz said, I saw a great tumult when Joab sent the king\'s servant, and me thy servant; but I knew not what it was.";
web[29] = "And the king said, Is the young man Absalom safe? And Ahimaaz answered, When Joab sent the king\'s servant, and [me] thy servant, I saw a great tumult, but I knew not what [it was].";
hnv[29] = "The king said, Is it well with the young man Avshalom? Achima`atz answered, When Yo\'av sent the king\'s servant, even me your servant, I saw a great tumult, but I don\'t know what it was.";
vul[29] = "et ait rex estne pax puero Absalom dixitque Achimaas vidi tumultum magnum cum mitteret Ioab servus tuus o rex me servum tuum nescio aliud";
kjv[30] = "And the king said [unto him], Turn aside, [and] stand here. And he turned aside, and stood still.";
rsv[30] = "And the king said, &quot;Turn aside, and stand here.&quot; So he turned aside, and stood still.";
asv[30] = "And the king said, Turn aside, and stand here. And he turned aside, and stood still.";
yng[30] = "And the king saith, `Turn round, station thyself here;\' and he turneth round and standeth still.";
dby[30] = "And the king said, Turn aside [and] stand here. And he turned aside and stood still.";
web[30] = "And the king said [to him], Turn aside, [and] stand here. And he turned aside, and stood still.";
hnv[30] = "The king said, Turn aside, and stand here. He turned aside, and stood still.";
vul[30] = "ad quem rex transi ait et sta hic cumque ille transisset et staret";
kjv[31] = "And, behold, Cushi came; and Cushi said, Tidings, my lord the king: for the LORD hath avenged thee this day of all them that rose up against thee.";
rsv[31] = "And behold, the Cushite came; and the Cushite said, &quot;Good tidings for my lord the king! For the LORD has delivered you this day from the power of all who rose up against you.&quot;";
asv[31] = "And, behold, the Cushite came; and the Cushite said, Tidings for my lord the king; for Jehovah hath avenged thee this day of all them that rose up against thee.";
yng[31] = "And lo, the Cushite hath come, and the Cushite saith, `Let tidings be proclaimed, my lord, O king; for Jehovah hath delivered thee to-day out of the hand of all those rising up against thee.\'";
dby[31] = "And behold, the Cushite came; and the Cushite said, Let my lord the king receive good tidings, for Jehovah has avenged thee this day of all them that rose up against thee.";
web[31] = "And behold, Cushi came; and Cushi said, Tidings, my lord the king: for the LORD hath avenged thee this day of all them that rose up against thee.";
hnv[31] = "Behold, the Kushite came; and the Kushite said, News for my lord the king; for the LORD has avenged you this day of all those who rose up against you.";
vul[31] = "apparuit Chusi et veniens ait bonum adporto nuntium domine mi rex iudicavit enim pro te Dominus hodie de manu omnium qui surrexerunt contra te";
kjv[32] = "And the king said unto Cushi, Is the young man Absalom safe? And Cushi answered, The enemies of my lord the king, and all that rise against thee to do [thee] hurt, be as [that] young man [is].";
rsv[32] = "The king said to the Cushite, &quot;Is it well with the young man Ab\'salom?&quot; And the Cushite answered, &quot;May the enemies of my lord the king, and all who rise up against you for evil, be like that young man.&quot;";
asv[32] = "And the king said unto the Cushite, Is it well with the young man Absalom? And the Cushite answered, The enemies of my lord the king, and all that rise up against thee to do thee hurt, be as that young man is.";
yng[32] = "And the king saith unto the Cushite, `Peace to the youth -- to Absalom?\' And the Cushite saith, `Let them be -- as the youth -- the enemies of my lord the king, and all who have risen up against thee for evil.\'";
dby[32] = "And the king said to the Cushite, Is it well with the young man Absalom? And the Cushite said, The enemies of my lord the king, and all that rise against thee for evil, be as that young man.";
web[32] = "And the king said to Cushi, [Is] the young man Absalom safe? And Cushi answered, May the enemies of my lord the king, and all that rise against thee to do [thee] hurt, be as [that] young man [is].";
hnv[32] = "The king said to the Kushite, Is it well with the young man Avshalom? The Kushite answered, The enemies of my lord the king, and all who rise up against you to do you hurt, be as that young man is.";
vul[32] = "dixit autem rex ad Chusi estne pax puero Absalom cui respondens Chusi fiant inquit sicut puer inimici domini mei regis et universi qui consurgunt adversum eum in malum";
kjv[33] = "And the king was much moved, and went up to the chamber over the gate, and wept: and as he went, thus he said, O my son Absalom, my son, my son Absalom! would God I had died for thee, O Absalom, my son, my son!";
