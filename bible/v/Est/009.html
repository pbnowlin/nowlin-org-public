csb[1] = "The king\'s command and law went into effect on the thirteenth day of the twelfth month, the month Adar. On the day when the Jews\' enemies had hoped to overpower them, just the opposite happened. The Jews overpowered those who hated them.";
csb[2] = "In each of King Ahasuerus\'s provinces the Jews assembled in their cities to attack those who intended to harm them. Not a single person could withstand them; fear of them fell on every nationality.";
csb[3] = "All the officials of the provinces, the satraps, the governors, and the royal civil administrators aided the Jews because they feared Mordecai.";
csb[4] = "For Mordecai exercised great power in the palace, and his fame spread throughout the provinces as he became more and more powerful.";
csb[5] = "The Jews put all their enemies to the sword, killing and destroying them. They did what they pleased to those who hated them.";
csb[6] = "In the fortress of Susa the Jews killed and destroyed five hundred men,";
csb[7] = "including Parshandatha, Dalphon, Aspatha,";
csb[8] = "Poratha, Adalia, Aridatha,";
csb[9] = "Parmashta, Arisai, Aridai, and Vaizatha.";
csb[10] = "They killed these ten sons of Haman son of Hammedatha, the enemy of the Jews. However, they did not seize any plunder.";
csb[11] = "On that day the number of people killed in the fortress of Susa was reported to the king.";
csb[12] = "The king said to Queen Esther, &quot;In the fortress of Susa the Jews have killed and destroyed five hundred men, including Haman\'s ten sons. What have they done in the rest of the royal provinces? Whatever you ask will be given to you. Whatever you seek will also be done.&quot;";
csb[13] = "Esther answered, &quot;If it pleases the king, may the Jews who are in Susa also have tomorrow to carry out today\'s law, and may the bodies of Haman\'s ten sons be hung on the gallows.&quot;";
csb[14] = "The king gave the orders for this to be done, so a law was announced in Susa, and they hung the bodies of Haman\'s ten sons.";
csb[15] = "The Jews in Susa assembled again on the fourteenth day of the month of Adar and killed three hundred men in Susa, but they did not seize any plunder.";
csb[16] = "The rest of the Jews in the royal provinces assembled, defended themselves, and gained relief from their enemies. They killed seventy-five thousand of those who hated them, but they did not seize any plunder.";
csb[17] = "They fought on the thirteenth day of the month of Adar and rested on the fourteenth, and it became a day of feasting and rejoicing.";
csb[18] = "But the Jews in Susa had assembled on the thirteenth and the fourteenth days of the month. They rested on the fifteenth day of the month, and it became a day of feasting and rejoicing.";
csb[19] = "This explains why the rural Jews who live in villages observe the fourteenth day of the month of Adar as a time of rejoicing and feasting. It is a holiday when they send gifts to one another.";
csb[20] = "Mordecai recorded these events and sent letters to all the Jews in all of King Ahasuerus\'s provinces, both near and far.";
csb[21] = "He ordered them to celebrate the fourteenth and fifteenth days of the month of Adar every year";
csb[22] = "because during those days the Jews gained relief from their enemies. That was the month when their sorrow was turned into rejoicing and their mourning into a holiday. They were to be days of feasting, rejoicing, and of sending gifts to one another and to the poor.";
csb[23] = "So the Jews agreed to continue the practice they had begun, as Mordecai had written them to do.";
csb[24] = "For Haman son of Hammedatha the Agagite, the enemy of all the Jews, had plotted against the Jews to destroy them. He cast the Pur -- that is, the lot -- to crush and destroy them.";
csb[25] = "But when the matter was brought before the king, he commanded by letter that the evil plan Haman had devised against the Jews return on his own head and that he should be hanged with his sons on the gallows.";
csb[26] = "For this reason these days are called Purim, from the word Pur. Because of all the instructions in this letter as well as what they had witnessed and what had happened to them,";
csb[27] = "the Jews bound themselves, their descendants, and all who joined with them to a commitment that they would not fail to celebrate these two days each and every year according to the written instructions and according to the time appointed.";
csb[28] = "These days are remembered and celebrated by every generation, family, province, and city, so that these days of Purim will not lose their significance in Jewish life and their memory will not fade from their descendants.";
csb[29] = "Queen Esther, daughter of Abihail, along with Mordecai the Jew, wrote this second letter with full authority to confirm the letter about Purim.";
csb[30] = "He sent letters with assurances of peace and security to all the Jews who were in the 127 provinces of the kingdom of Ahasuerus,";
csb[31] = "in order to confirm these days of Purim at their proper time just as Mordecai the Jew and Esther the queen had established them and just as they had committed themselves and their descendants to the practices of fasting and lamentation.";
csb[32] = "So Esther\'s command confirmed these customs of Purim, which were then written into the record.";
kjv[1] = "Now in the twelfth month, that [is], the month Adar, on the thirteenth day of the same, when the king\'s commandment and his decree drew near to be put in execution, in the day that the enemies of the Jews hoped to have power over them, (though it was turned to the contrary, that the Jews had rule over them that hated them;)";
rsv[1] = "Now in the twelfth month, which is the month of Adar, on the thirteenth day of the same, when the king\'s command and edict were about to be executed, on the very day when the enemies of the Jews hoped to get the mastery over them, but which had been changed to a day when the Jews should get the mastery over their foes,";
asv[1] = "Now in the twelfth month, which is the month Adar, on the thirteenth day of the same, when the king\'s commandment and his decree drew near to be put in execution, on the day that the enemies of the Jews hoped to have rule over them (whereas it was turned to the contrary, that the Jews had rule over them that hated them),";
yng[1] = "And in the twelfth month -- it [is] the month of Adar -- on the thirteenth day of it, in which the word of the king, even his law, hath come to be done, in the day that the enemies of the Jews had hoped to rule over them, and it is turned that the Jews rule over those hating them --";
dby[1] = "And in the twelfth month, that is, the month Adar, on the thirteenth day thereof, when the king\'s commandment and his decree drew near to be put in execution, in the day that the enemies of the Jews hoped to have power over them (but it was turned to the contrary, that the Jews had power over them that hated them),";
web[1] = "Now in the twelfth month, that [is], the month Adar, on the thirteenth day of the same, when the king\'s commandment and his decree drew near to be put in execution, in the day that the enemies of the Jews hoped to have power over them, (though it was turned to the contrary, that the Jews had rule over them that hated them;)";
hnv[1] = "Now in the twelfth month, which is the month Adar, on the thirteenth day of the same, when the king\'s mitzvah and his decree drew near to be put in execution, on the day that the enemies of the Yehudim hoped to have rule over them, (whereas it was turned to the contrary, that the Yehudim had rule over those who hated them,)";
vul[1] = "igitur duodecimi mensis quem adar vocari ante iam diximus tertiadecima die quando cunctis Iudaeis interfectio parabatur et hostes eorum inhiabant sanguini versa vice Iudaei superiores esse coeperunt et se de adversariis vindicare";
kjv[2] = "The Jews gathered themselves together in their cities throughout all the provinces of the king Ahasuerus, to lay hand on such as sought their hurt: and no man could withstand them; for the fear of them fell upon all people.";

kjv[12] = "And the king said unto Esther the queen, The Jews have slain and destroyed five hundred men in Shushan the palace, and the ten sons of Haman; what have they done in the rest of the king\'s provinces? now what [is] thy petition? and it shall be granted thee: or what [is] thy request further? and it shall be done.";
rsv[12] = "And the king said to Queen Esther, &quot;In Susa the capital the Jews have slain five hundred men and also the ten sons of Haman. What then have they done in the rest of the king\'s provinces! Now what is your petition? It shall be granted you. And what further is your request? It shall be fulfilled.&quot;";
asv[12] = "And the king said unto Esther the queen, The Jews have slain and destroyed five hundred men in Shushan the palace, and the ten sons of Haman; what then have they done in the rest of the king\'s provinces! Now what is thy petition? and it shall be granted thee: or what is thy request further? and it shall be done.";
yng[12] = "and the king saith to Esther the queen, `In Shushan the palace have the Jews slain and destroyed five hundred men, and the ten sons of Haman; in the rest of the provinces of the king what have they done? and what [is] thy petition? and it is given to thee; and what thy request again? and it is done.\'";
dby[12] = "And the king said to Esther the queen, The Jews have slain and destroyed five hundred men in Shushan the fortress, and the ten sons of Haman; what have they done in the rest of the king\'s provinces? And what is thy petition? and it shall be granted thee; and what is thy request further? and it shall be done.";
web[12] = "And the king said to Esther the queen, the Jews have slain and destroyed five hundred men in Shushan the palace, and the ten sons of Haman; what have they done in the rest of the king\'s provinces? now what [is] thy petition? and it shall be granted thee: or what [is] thy request further? and it shall be done.";

hnv[17] = "[This was done] on the thirteenth day of the month Adar; and on the fourteenth day of the same they rested, and made it a day of feasting and gladness.";
vul[17] = "dies autem tertiusdecimus mensis adar unus apud omnes interfectionis fuit et quartodecimo die caedere desierunt quem constituerunt esse sollemnem ut in eo omni deinceps tempore vacarent epulis gaudio atque conviviis";
kjv[18] = "But the Jews that [were] at Shushan assembled together on the thirteenth [day] thereof, and on the fourteenth thereof; and on the fifteenth [day] of the same they rested, and made it a day of feasting and gladness.";
rsv[18] = "But the Jews who were in Susa gathered on the thirteenth day and on the fourteenth, and rested on the fifteenth day, making that a day of feasting and gladness.";
asv[18] = "But the Jews that were in Shushan assembled together on the thirteenth [day] thereof, and on the fourteenth thereof; and on the fifteenth [day] of the same they rested, and made it a day of feasting and gladness.";
yng[18] = "And the Jews who [are] in Shushan have been assembled, on the thirteenth day of it, and on the fourteenth of it, even to rest on the fifteenth of it, and to make it a day of banquet and of joy.";
dby[18] = "But the Jews that were at Shushan gathered themselves together on the thirteenth [day] thereof, and on the fourteenth thereof; and on the fifteenth of the same they rested, and made it a day of feasting and joy.";
web[18] = "But the Jews that [were] at Shushan assembled on the thirteenth [day] of the month, and on the fourteenth of it: and on the fifteenth [day] of the same they rested, and made it a day of feasting and gladness.";
hnv[18] = "But the Yehudim who were in Shushan assembled together on the thirteenth [day] of it, and on the fourteenth of it; and on the fifteenth [day] of the same they rested, and made it a day of feasting and gladness.";
vul[18] = "at hii qui in urbe Susis caedem exercuerant tertiodecimo et quartodecimo eiusdem mensis die in caede versati sunt quintodecimo autem die percutere desierunt et idcirco eandem diem constituere sollemnem epularum atque laetitiae";
kjv[19] = "Therefore the Jews of the villages, that dwelt in the unwalled towns, made the fourteenth day of the month Adar [a day of] gladness and feasting, and a good day, and of sending portions one to another.";
rsv[19] = "Therefore the Jews of the villages, who live in the open towns, hold the fourteenth day of the month of Adar as a day for gladness and feasting and holiday-making, and a day on which they send choice portions to one another.";
asv[19] = "Therefore do the Jews of the villages, that dwell in the unwalled towns, make the fourteenth day of the month Adar [a day of] gladness and feasting, and a good day, and of sending portions one to another.";
yng[19] = "Therefore the Jews of the villages, who are dwelling in cities of the villages, are making the fourteenth day of the month of Adar -- joy and banquet, and a good day, and of sending portions one to another.";
dby[19] = "Therefore the Jews of the villages that dwell in the country towns make the fourteenth of the month Adar a day of joy and feasting, and a good day, and on which they send portions one to another.";
web[19] = "Therefore the Jews of the villages, that dwelt in the unwalled towns, made the fourteenth day of the month Adar [a day of] gladness and feasting, and a good day, and of sending portions one to another.";
hnv[19] = " Therefore do the Yehudim of the villages, who dwell in the unwalled towns, make the fourteenth day of the month Adar [a day of] gladness and feasting, and a good day, and of sending portions one to another.";
vul[19] = "hii vero Iudaei qui in oppidis non muratis ac villis morabantur quartumdecimum diem mensis adar conviviorum et gaudii decreverunt ita ut exultent in eo et mittant sibi mutuo partes epularum et ciborum";
kjv[20] = "And Mordecai wrote these things, and sent letters unto all the Jews that [were] in all the provinces of the king Ahasuerus, [both] nigh and far,";
rsv[20] = "And Mor\'decai recorded these things, and sent letters to all the Jews who were in all the provinces of King Ahasu-e\'rus, both near and far,";
asv[20] = "And Mordecai wrote these things, and sent letters unto all the Jews that were in all the provinces of the king Ahasuerus, both nigh and far,";
yng[20] = "And Mordecai writeth these things, and sendeth letters unto all the Jews who [are] in all provinces of the king Ahasuerus, who are near and who are far off,";
dby[20] = "And Mordecai wrote these things, and sent letters to all the Jews near and far that were in all the provinces of king Ahasuerus,";
web[20] = "And Mordecai wrote these things, and sent letters to all the Jews that [were] in all the provinces of the king Ahasuerus, [both] nigh and far,";
hnv[20] = "Mordekhai wrote these things, and sent letters to all the Yehudim who were in all the provinces of the king Achashverosh, both near and far,";
vul[20] = "scripsit itaque Mardocheus omnia haec et litteris conprehensa misit ad Iudaeos qui in omnibus regis provinciis morabantur tam in vicino positis quam procul";
kjv[21] = "To stablish [this] among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,";
rsv[21] = "enjoining them that they should keep the fourteenth day of the month Adar and also the fifteenth day of the same, year by year,";
asv[21] = "to enjoin them that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,";
yng[21] = "to establish on them, to be keeping the fourteenth day of the month of Adar, and the fifteenth day of it, in every year and year,";
dby[21] = "to establish [this] among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,";
web[21] = "To establish [this] among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,";
hnv[21] = "to enjoin those who they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,";
vul[21] = "ut quartamdecimam et quintamdecimam diem mensis adar pro festis susciperent et revertente semper anno sollemni honore celebrarent";
kjv[22] = "As the days wherein the Jews rested from their enemies, and the month which was turned unto them from sorrow to joy, and from mourning into a good day: that they should make them days of feasting and joy, and of sending portions one to another, and gifts to the poor.";
rsv[22] = "as the days on which the Jews got relief from their enemies, and as the month that had been turned for them from sorrow into gladness and from mourning into a holiday; that they should make them days of feasting and gladness, days for sending choice portions to one another and gifts to the poor.";
asv[22] = "as the days wherein the Jews had rest from their enemies, and the month which was turned unto them from sorrow to gladness, and from mourning into a good day; that they should make them days of feasting and gladness, and of sending portions one to another, and gifts to the poor.";
yng[22] = "as days on which the Jews have rested from their enemies, and the month that hath been turned to them from sorrow to joy, and from mourning to a good day, to make them days of banquet and of joy, and of sending portions one to another, and gifts to the needy.";
dby[22] = "as the days on which the Jews rested from their enemies, and the month that was turned to them from sorrow to joy, and from mourning into a good day; that they should make them days of feasting and joy, and of sending portions one to another, and gifts to the poor.";
web[22] = "As the days in which the Jews rested from their enemies, and the month which was turned to them from sorrow to joy, and from mourning into a good day, that they should make them days of feasting and joy, and of sending portions one to another, and gifts to the poor.";
hnv[22] = "as the days in which the Yehudim had rest from their enemies, and the month which was turned to them from sorrow to gladness, and from mourning into a good day; that they should make them days of feasting and gladness, and of sending portions one to another, and gifts to the needy.";
vul[22] = "quia in ipsis diebus se ulti sunt Iudaei de inimicis suis et luctus atque tristitia in hilaritatem gaudiumque conversa sint essentque istae dies epularum atque laetitiae et mitterent sibi invicem ciborum partes et pauperibus munuscula largirentur";
kjv[23] = "And the Jews undertook to do as they had begun, and as Mordecai had written unto them;";
rsv[23] = "So the Jews undertook to do as they had begun, and as Mor\'decai had written to them.";
asv[23] = "And the Jews undertook to do as they had begun, and as Mordecai had written unto them;";
yng[23] = "And the Jews have received that which they had begun to do, and that which Mordecai hath written unto them,";
dby[23] = "And the Jews undertook to do as they had begun, and as Mordecai had written to them.";
web[23] = "And the Jews undertook to do as they had begun, and as Mordecai had written to them;";
hnv[23] = "The Yehudim undertook to do as they had begun, and as Mordekhai had written to them;";
vul[23] = "susceperuntque Iudaei in sollemnem ritum cuncta quae eo tempore facere coeperant et quae Mardocheus litteris facienda mandaverat";
kjv[24] = "Because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had devised against the Jews to destroy them, and had cast Pur, that [is], the lot, to consume them, and to destroy them;";
rsv[24] = "For Haman the Ag\'agite, the son of Hammeda\'tha, the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur, that is the lot, to crush and destroy them;";
asv[24] = "because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur, that is the lot, to consume them, and to destroy them;";
yng[24] = "because Haman son of Hammedatha the Agagite, adversary of all the Jews, had devised concerning the Jews to destroy them, and had caused to fall Pur -- that [is] the lot -- to crush them and to destroy them;";
dby[24] = "For Haman the son of Hammedatha the Agagite, the oppressor of all the Jews, had devised against the Jews to destroy them, and had cast Pur, that is, the lot, to consume them and to destroy them;";
web[24] = "Because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had devised against the Jews to destroy them, and had cast Pur, that [is], the lot, to consume them, and to destroy them;";
hnv[24] = "because Haman the son of Hammedata, the Agagite, the enemy of all the Yehudim, had plotted against the Yehudim to destroy them, and had cast Pur, that is the lot, to consume them, and to destroy them;";
vul[24] = "Aman enim filius Amadathi stirpis Agag hostis et adversarius Iudaeorum cogitavit contra eos malum ut occideret illos atque deleret et misit phur quod nostra lingua vertitur in sortem";
kjv[25] = "But when [Esther] came before the king, he commanded by letters that his wicked device, which he devised against the Jews, should return upon his own head, and that he and his sons should be hanged on the gallows.";
rsv[25] = "but when Esther came before the king, he gave orders in writing that his wicked plot which he had devised against the Jews should come upon his own head, and that he and his sons should be hanged on the gallows.";
asv[25] = "but when [the matter] came before the king, he commanded by letters that his wicked device, which he had devised against the Jews, should return upon his own head, and that he and his sons should be hanged on the gallows.";
yng[25] = "and in her coming in before the king, he said with the letter, `Let his evil device that he devised against the Jews turn back upon his own head,\' and they have hanged him and his sons on the tree,";
dby[25] = "and when [Esther] came before the king, he commanded by letters that his wicked device, which he had devised against the Jews, should return upon his own head; and they hanged him and his sons on the gallows.";
web[25] = "But when [Esther] came before the king, he commanded by letters that his wicked device, which he devised against the Jews, should return upon his own head, and that he and his sons should be hanged on the gallows.";
hnv[25] = "but when [the matter] came before the king, he commanded by letters that his wicked device, which he had devised against the Yehudim, should return on his own head, and that he and his sons should be hanged on the gallows.";
vul[25] = "et postea ingressa est Hester ad regem obsecrans ut conatus eius litteris regis irriti fierent et malum quod contra Iudaeos cogitaverat reverteretur in caput eius denique et ipsum et filios eius adfixerunt cruci";
kjv[26] = "Wherefore they called these days Purim after the name of Pur. Therefore for all the words of this letter, and [of that] which they had seen concerning this matter, and which had come unto them,";
rsv[26] = "Therefore they called these days Purim, after the term Pur. And therefore, because of all that was written in this letter, and of what they had faced in this matter, and of what had befallen them,";
asv[26] = "Wherefore they called these days Purim, after the name of Pur. Therefore because of all the words of this letter, and of that which they had seen concerning this matter, and that which had come unto them,";
yng[26] = "therefore they have called these days Purim -- by the name of the lot -- therefore, because of all the words of this letter, and what they have seen concerning this, and what hath come unto them,";
dby[26] = "Therefore they called these days Purim after the name of Pur. Therefore, according to all the words of this letter, and for what they had seen concerning this matter and what had happened to them,";
web[26] = "Wherefore they called these days Purim after the name of Pur. Therefore for all the words of this letter, and [of that] which they had seen concerning this matter, and which had come to them,";
hnv[26] = "Therefore they called these days Purim, after the name of Pur. Therefore because of all the words of this letter, and of that which they had seen concerning this matter, and that which had come to them,";
vul[26] = "atque ex illo tempore dies isti appellati sunt Phurim id est Sortium eo quod phur id est sors in urnam missa fuerit et cuncta quae gesta sunt epistulae id est libri huius volumine continentur";
kjv[27] = "The Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves unto them, so as it should not fail, that they would keep these two days according to their writing, and according to their [appointed] time every year;";
rsv[27] = "the Jews ordained and took it upon themselves and their descendants and all who joined them, that without fail they would keep these two days according to what was written and at the time appointed every year,";
asv[27] = "the Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves unto them, so that it should not fail, that they would keep these two days according to the writing thereof, and according to the appointed time thereof, every year;";
yng[27] = "the Jews have established and received upon them, and upon their seed, and upon all those joined unto them, and it doth not pass away, to be keeping these two days according to their writing, and according to their season, in every year and year;";
dby[27] = "the Jews ordained and took upon them, and upon their seed, and upon all such as joined themselves to them, so that it should not fail, that they would observe these two days according to their writing and according to their fixed time, every year;";
web[27] = "The Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves to them, so as it should not fail, that they would keep these two days according to their writing, and according to their [appointed] time every year;";
hnv[27] = "the Yehudim ordained, and took on them, and on their seed, and on all such as joined themselves to them, so that it should not fail, that they would keep these two days according to the writing of it, and according to the appointed time of it, every year;";
vul[27] = "quaeque sustinuerint et quae deinceps inmutata sint suscepere Iudaei super se et semen suum et super cunctos qui religioni eorum voluerint copulari ut nulli liceat duos hos dies absque sollemnitate transigere quam scriptura testatur et certa expetunt tempora annis sibi iugiter succedentibus";
kjv[28] = "And [that] these days [should be] remembered and kept throughout every generation, every family, every province, and every city; and [that] these days of Purim should not fail from among the Jews, nor the memorial of them perish from their seed.";
rsv[28] = "that these days should be remembered and kept throughout every generation, in every family, province, and city, and that these days of Purim should never fall into disuse among the Jews, nor should the commemoration of these days cease among their descendants.";
asv[28] = "and that these days should be remembered and kept throughout every generation, every family, every province, and every city; and that these days of Purim should not fail from among the Jews, nor the remembrance of them perish from their seed.";
yng[28] = "and these days are remembered and kept in every generation and generation, family and family, province and province, and city and city, and these days of Purim do not pass away from the midst of the Jews, and their memorial is not ended from their seed.";
dby[28] = "and that these days should be remembered and observed throughout every generation, in every family, every province, and every city, and that these days of Purim should not fail from among the Jews, nor the memorial of them cease from among their seed.";
web[28] = "And [that] these days [should be] remembered and kept throughout every generation, every family, every province, and every city; and [that] these days of Purim should not fail from among the Jews, nor the memorial of them perish from their seed.";
hnv[28] = "and that these days should be remembered and kept throughout every generation, every family, every province, and every city; and that these days of Purim should not fail from among the Yehudim, nor the memory of them perish from their seed.";
vul[28] = "isti sunt dies quos nulla umquam delebit oblivio et per singulas generationes cunctae in toto orbe provinciae celebrabunt nec est ulla civitas in qua dies Phurim id est Sortium non observentur a Iudaeis et ab eorum progenie quae his caerimoniis obligata est";
kjv[29] = "Then Esther the queen, the daughter of Abihail, and Mordecai the Jew, wrote with all authority, to confirm this second letter of Purim.";
rsv[29] = "Then Queen Esther, the daughter of Ab\'ihail, and Mor\'decai the Jew gave full written authority, confirming this second letter about Purim.";
asv[29] = "Then Esther the queen, the daughter of Abihail, and Mordecai the Jew, wrote with all authority to confirm this second letter of Purim.";
yng[29] = "And Esther the queen, daughter of Abihail, writeth, and Mordecai the Jew, with all might, to establish this second letter of Purim,";
dby[29] = "And queen Esther the daughter of Abihail, and Mordecai the Jew, wrote with all authority to confirm this second letter of Purim.";
web[29] = "Then Esther the queen, the daughter of Abihail, and Mordecai the Jew, wrote with all authority, to confirm this second letter of Purim.";
hnv[29] = "Then Ester the queen, the daughter of Avichayil, and Mordekhai the Yehudi, wrote with all authority to confirm this second letter of Purim.";
vul[29] = "scripseruntque Hester regina filia Abiahil et Mardocheus Iudaeus etiam secundam epistulam ut omni studio dies ista sollemnis sanciretur in posterum";
kjv[30] = "And he sent the letters unto all the Jews, to the hundred twenty and seven provinces of the kingdom of Ahasuerus, [with] words of peace and truth,";
rsv[30] = "Letters were sent to all the Jews, to the hundred and twenty-seven provinces of the kingdom of Ahasu-e\'rus, in words of peace and truth,";
asv[30] = "And he sent letters unto all the Jews, to the hundred twenty and seven provinces of the kingdom of Ahasuerus, [with] words of peace and truth,";
yng[30] = "and he sendeth letters unto all the Jews, unto the seven and twenty and a hundred provinces of the kingdom of Ahasuerus -- words of peace and truth --";
dby[30] = "And he sent letters to all the Jews, to the hundred and twenty-seven provinces of the kingdom of Ahasuerus, words of peace and truth,";
web[30] = "And he sent the letters to all the Jews, to the hundred twenty and seven provinces of the kingdom of Ahasuerus, [with] words of peace and truth,";
hnv[30] = "He sent letters to all the Yehudim, to the hundred twenty-seven provinces of the kingdom of Achashverosh, [with] words of shalom and truth,";
vul[30] = "et miserunt ad omnes Iudaeos qui in centum viginti septem regis Asueri provinciis versabantur ut haberent pacem et susciperent veritatem";
kjv[31] = "To confirm these days of Purim in their times [appointed], according as Mordecai the Jew and Esther the queen had enjoined them, and as they had decreed for themselves and for their seed, the matters of the fastings and their cry.";
rsv[31] = "that these days of Purim should be observed at their appointed seasons, as Mor\'decai the Jew and Queen Esther enjoined upon the Jews, and as they had laid down for themselves and for their descendants, with regard to their fasts and their lamenting.";
asv[31] = "to confirm these days of Purim in their appointed times, according as Mordecai the Jew and Esther the queen had enjoined them, and as they had ordained for themselves and for their seed, in the matter of the fastings and their cry.";
yng[31] = "to establish these days of Purim, in their seasons, as Mordecai the Jew hath established on them, and Esther the queen, and as they had established on themselves, and on their seed -- matters of the fastings, and of their cry.";
dby[31] = "to confirm these days of Purim in their fixed times, according as Mordecai the Jew and queen Esther had enjoined them, and as they had decreed for themselves and for their seed, as to the matters of the fastings and their cry.";
web[31] = "To confirm these days of Purim in their times [appointed], according as Mordecai the Jew and Esther the queen had enjoined them, and as they had decreed for themselves and for their seed, the matters of the fastings and their cry.";
hnv[31] = "to confirm these days of Purim in their appointed times, according as Mordekhai the Yehudi and Ester the queen had enjoined them, and as they had ordained for themselves and for their seed, in the matter of the fastings and their cry.";
vul[31] = "observantes dies Sortium et suo tempore cum gaudio celebrarent sicut constituerat Mardocheus et Hester et illi observanda susceperant a se et a semine suo ieiunia atque clamores et Sortium dies";
kjv[32] = "And the decree of Esther confirmed these matters of Purim; and it was written in the book.";
rsv[32] = "The command of Queen Esther fixed these practices of Purim, and it was recorded in writing.";
asv[32] = "And the commandment of Esther confirmed these matters of Purim; and it was written in the book.";
yng[32] = "And a saying of Esther hath established these matters of Purim, and it is written in the Book.";
dby[32] = "And the decree of Esther confirmed these matters of Purim; and it was written in the book.";
web[32] = "And the decree of Esther confirmed these matters of Purim; and it was written in the book.";
hnv[32] = "The mitzvah of Ester confirmed these matters of Purim; and it was written in the book.";
vul[32] = "et omnia quae libri huius qui vocatur Hester historia continentur";
