csb[1] = "When Mordecai learned all that had occurred, he tore his clothes, put on sackcloth and ashes, went into the middle of the city, and cried loudly and bitterly.";
csb[2] = "He went only as far as the King\'s Gate, since the law prohibited anyone wearing sackcloth from entering the King\'s Gate.";
csb[3] = "There was great mourning among the Jewish people in every province where the king\'s command and edict came. They fasted, wept, and lamented, and many lay in sackcloth and ashes.";
csb[4] = "Esther\'s female servants and her eunuchs came and reported the news to her, and the queen was overcome with fear. She sent clothes for Mordecai to wear so that he would take off his sackcloth, but he did not accept them.";
csb[5] = "Esther summoned Hathach, one of the king\'s eunuchs who attended her, and dispatched him to Mordecai to learn what he was doing and why.";
csb[6] = "So Hathach went out to Mordecai in the city square in front of the King\'s Gate.";
csb[7] = "Mordecai told him everything that had happened as well as the exact amount of money Haman had promised to pay the royal treasury for the slaughter of the Jews.";
csb[8] = "Mordecai also gave him a copy of the written decree issued in Susa ordering their destruction, so that Hathach might show it to Esther, explain it to her, and command her to approach the king, implore his favor, and plead with him personally for her people.";
csb[9] = "Hathach came and repeated Mordecai\'s response to Esther.";
csb[10] = "Esther spoke to Hathach and commanded him to tell Mordecai,";
csb[11] = "&quot;All the royal officials and the people of the royal provinces know that one law applies to every man or woman who approaches the king in the inner courtyard and who has not been summoned -- the death penalty -- unless the king extends the gold scepter, allowing that person to live. I have not been summoned to appear before the king for the last thirty days.&quot;";
csb[12] = "Esther\'s response was reported to Mordecai.";
csb[13] = "Mordecai told the messenger to reply to Esther, &quot;Don\'t think that you will escape the fate of all the Jews because you are in the king\'s palace.";
csb[14] = "&quot;If you keep silent at this time, relief and deliverance will come to the Jewish people from another place, but you and your father\'s family will be destroyed. Who knows, perhaps you have come to your royal position for such a time as this.&quot;";
csb[15] = "Esther sent this reply to Mordecai:";
csb[16] = "&quot;Go and assemble all the Jews who can be found in Susa and fast for me. Don\'t eat or drink for three days, night or day. I and my female servants will also fast in the same way. After that, I will go to the king even if it is against the law. If I perish, I perish.&quot;";
csb[17] = "So Mordecai went and did everything Esther had commanded him.";

kjv[4] = "So Esther\'s maids and her chamberlains came and told [it] her. Then was the queen exceedingly grieved; and she sent raiment to clothe Mordecai, and to take away his sackcloth from him: but he received [it] not.";

rsv[8] = "Mor\'decai also gave him a copy of the written decree issued in Susa for their destruction, that he might show it to Esther and explain it to her and charge her to go to the king to make supplication to him and entreat him for her people.";

kjv[11] = "All the king\'s servants, and the people of the king\'s provinces, do know, that whosoever, whether man or woman, shall come unto the king into the inner court, who is not called, [there is] one law of his to put [him] to death, except such to whom the king shall hold out the golden sceptre, that he may live: but I have not been called to come in unto the king these thirty days.";
rsv[11] = "&quot;All the king\'s servants and the people of the king\'s provinces know that if any man or woman goes to the king inside the inner court without being called, there is but one law; all alike are to be put to death, except the one to whom the king holds out the golden scepter that he may live. And I have not been called to come in to the king these thirty days.&quot;";
asv[11] = "All the king\'s servants, and the people of the king\'s provinces, do know, that whosoever, whether man or woman, shall come unto the king into the inner court, who is not called, there is one law for him, that he be put to death, except those to whom the king shall hold out the golden sceptre, that he may live: but I have not been called to come in unto the king these thirty days.";
yng[11] = "`All servants of the king, and people of the provinces of the king, do know that any man and woman, who cometh in unto the king, unto the inner court, who is not called -- one law [of] his [is] to put [them] to death, apart from him to whom the king holdeth out the golden sceptre, then he hath lived; and I -- I have not been called to come in unto the king these thirty days.\'";
dby[11] = "All the king\'s servants and the people of the king\'s provinces do know that whoever, whether man or woman, shall come to the king into the inner court, who is not called, there is *one* law, to put [him] to death, except [such] to whom the king shall hold out the golden sceptre, that he may live; and I have not been called to come in unto the king these thirty days.";
web[11] = "All the king\'s servants, and the people of the king\'s provinces, do know, that whoever, whether man or woman, shall come to the king into the inner court, who is not called, [there is] one law of his to put [him] to death, except him to whom the king shall hold out the golden scepter, that he may live: but I have not been called to come in to the king these thirty days.";
hnv[11] = "All the king\'s servants, and the people of the king\'s provinces, do know, that whoever, whether man or woman, shall come to the king into the inner court, who is not called, there is one law for him, that he be put to death, except those to whom the king shall hold out the golden scepter, that he may live: but I have not been called to come in to the king these thirty days.";
vul[11] = "omnes servi regis et cunctae quae sub dicione eius sunt norunt provinciae quod sive vir sive mulier invocatus interius atrium regis intraverit absque ulla cunctatione statim interficiatur nisi forte rex auream virgam ad eum tetenderit pro signo clementiae atque ita possit vivere ego igitur quomodo ad regem intrare potero quae triginta iam diebus non sum vocata ad eum";

kjv[14] = "For if thou altogether holdest thy peace at this time, [then] shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father\'s house shall be destroyed: and who knoweth whether thou art come to the kingdom for [such] a time as this?";
rsv[14] = "For if you keep silence at such a time as this, relief and deliverance will rise for the Jews from another quarter, but you and your father\'s house will perish. And who knows whether you have not come to the kingdom for such a time as this?&quot;";
asv[14] = "For if thou altogether holdest thy peace at this time, then will relief and deliverance arise to the Jews from another place, but thou and thy father\'s house will perish: and who knoweth whether thou art not come to the kingdom for such a time as this?";
yng[14] = "but if thou keep entirely silent at this time, respite and deliverance remaineth to the Jews from another place, and thou and the house of thy fathers are destroyed; and who knoweth whether for a time like this thou hast come to the kingdom?\'";
dby[14] = "For if thou altogether holdest thy peace at this time, then shall there arise relief and deliverance to the Jews from another place; but thou and thy father\'s house shall perish. And who knows whether thou art [not] come to the kingdom for such a time as this?";
web[14] = "For if thou shalt altogether hold thy peace at this time, [then] will there enlargement and deliverance arise to the Jews from another place; but thou and thy father\'s house will be destroyed: and who knoweth, whether thou hast come to the kingdom for [such] a time as this?";
hnv[14] = "For if you altogether hold your shalom at this time, then will relief and deliverance arise to the Yehudim from another place, but you and your father\'s house will perish: and who knows whether you haven\'t come to the kingdom for such a time as this?";
vul[14] = "si enim nunc silueris per aliam occasionem liberabuntur Iudaei et tu et domus patris tui peribitis et quis novit utrum idcirco ad regnum veneris ut in tali tempore parareris";

kjv[16] = "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which [is] not according to the law: and if I perish, I perish.";
rsv[16] = "&quot;Go, gather all the Jews to be found in Susa, and hold a fast on my behalf, and neither eat nor drink for three days, night or day. I and my maids will also fast as you do. Then I will go to the king, though it is against the law; and if I perish, I perish.&quot;";
asv[16] = "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast in like manner; and so will I go in unto the king, which is not according to the law: and if I perish, I perish.";
yng[16] = "`Go, gather all the Jews who are found in Shushan, and fast for me, and do not eat nor drink three days, by night and by day; also I and my young women do fast likewise, and so I go in unto the king, that [is] not according to law, and when I have perished -- I have perished.\'";
dby[16] = "Go, gather together all the Jews that are found in Shushan, and fast for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise, and so will I go in unto the king, which is not according to the law; and if I perish, I perish.";
web[16] = "Go, assemble all the Jews [that are] present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in to the king, which [is] not according to the law; and if I perish, I perish.";
hnv[16] = "Go, gather together all the Yehudim who are present in Shushan, and fast you for me, and neither eat nor drink three days, night or day: I also and my maidens will fast in like manner; and so will I go in to the king, which is not according to the law: and if I perish, I perish.";
vul[16] = "vade et congrega omnes Iudaeos quos in Susis reppereris et orate pro me non comedatis et non bibatis tribus diebus ac noctibus et ego cum ancillulis meis similiter ieiunabo et tunc ingrediar ad regem contra legem faciens invocata tradensque me morti et periculo";

vul[17] = "ivit itaque Mardocheus et fecit omnia quae ei Hester praeceperat";
