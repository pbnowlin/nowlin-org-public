csb[1] = "On the third day, Esther dressed in her royal clothing and stood in the inner courtyard of the palace facing it. The king was sitting on his royal throne in the royal courtroom, facing its entrance.";
csb[2] = "As soon as the king saw Queen Esther standing in the courtyard, she gained favor in his eyes. The king extended the gold scepter in his hand toward Esther, and she approached and touched the tip of the scepter.";
csb[3] = "&quot;What is it, Queen Esther? &quot; the king asked her. &quot;Whatever you want, even to half the kingdom, will be given to you.&quot;";
csb[4] = "&quot;If it pleases the king,&quot; Esther replied, &quot;may the king and Haman come today to the banquet I have prepared for them.&quot;";
csb[5] = "The king said, &quot;Hurry, and get Haman so we can do as Esther has requested.&quot; So the king and Haman went to the banquet Esther had prepared.";
csb[6] = "While drinking the wine, the king asked Esther, &quot;Whatever you ask will be given to you. Whatever you want, even to half the kingdom, will be done.&quot;";
csb[7] = "Esther answered, &quot;This is my petition and my request:";
csb[8] = "&quot;If I have found favor in the eyes of the king, and if it pleases the king to grant my petition and perform my request, may the king and Haman come to the banquet I will prepare for them. Tomorrow I will do what the king has asked.&quot;";
csb[9] = "That day Haman left full of joy and in good spirits. But when Haman saw Mordecai at the King\'s Gate, and Mordecai didn\'t rise or tremble in fear at his presence, Haman was filled with rage toward Mordecai.";
csb[10] = "Yet Haman controlled himself and went home. He sent for his friends and his wife Zeresh to join him.";
csb[11] = "Then Haman described for them his glorious wealth and his many sons. He told them all how the king had honored him and promoted him in rank over the other officials and the royal staff.";
csb[12] = "&quot;What\'s more,&quot; Haman added, &quot;Queen Esther invited no one but me to join the king at the banquet she had prepared. I am invited again tomorrow to join her with the king.";
csb[13] = "&quot;Still, none of this satisfies me since I see Mordecai the Jew sitting at the King\'s Gate all the time.&quot;";
csb[14] = "His wife Zeresh and all his friends told him, &quot;Have them build a gallows seventy-five feet tall. Ask the king in the morning to hang Mordecai on it. Then go to the banquet with the king and enjoy yourself.&quot; The advice pleased Haman, so he had the gallows constructed.";
kjv[1] = "Now it came to pass on the third day, that Esther put on [her] royal [apparel], and stood in the inner court of the king\'s house, over against the king\'s house: and the king sat upon his royal throne in the royal house, over against the gate of the house.";
kjv[2] = "And it was so, when the king saw Esther the queen standing in the court, [that] she obtained favour in his sight: and the king held out to Esther the golden sceptre that [was] in his hand. So Esther drew near, and touched the top of the sceptre.";
kjv[3] = "Then said the king unto her, What wilt thou, queen Esther? and what [is] thy request? it shall be even given thee to the half of the kingdom.";
kjv[4] = "And Esther answered, If [it seem] good unto the king, let the king and Haman come this day unto the banquet that I have prepared for him.";
kjv[5] = "Then the king said, Cause Haman to make haste, that he may do as Esther hath said. So the king and Haman came to the banquet that Esther had prepared.";
kjv[6] = "And the king said unto Esther at the banquet of wine, What [is] thy petition? and it shall be granted thee: and what [is] thy request? even to the half of the kingdom it shall be performed.";
kjv[7] = "Then answered Esther, and said, My petition and my request [is];";
kjv[8] = "If I have found favour in the sight of the king, and if it please the king to grant my petition, and to perform my request, let the king and Haman come to the banquet that I shall prepare for them, and I will do to morrow as the king hath said.";
kjv[9] = "Then went Haman forth that day joyful and with a glad heart: but when Haman saw Mordecai in the king\'s gate, that he stood not up, nor moved for him, he was full of indignation against Mordecai.";
kjv[10] = "Nevertheless Haman refrained himself: and when he came home, he sent and called for his friends, and Zeresh his wife.";
kjv[11] = "And Haman told them of the glory of his riches, and the multitude of his children, and all [the things] wherein the king had promoted him, and how he had advanced him above the princes and servants of the king.";
kjv[12] = "Haman said moreover, Yea, Esther the queen did let no man come in with the king unto the banquet that she had prepared but myself; and to morrow am I invited unto her also with the king.";
kjv[13] = "Yet all this availeth me nothing, so long as I see Mordecai the Jew sitting at the king\'s gate.";
kjv[14] = "Then said Zeresh his wife and all his friends unto him, Let a gallows be made of fifty cubits high, and to morrow speak thou unto the king that Mordecai may be hanged thereon: then go thou in merrily with the king unto the banquet. And the thing pleased Haman; and he caused the gallows to be made.";
