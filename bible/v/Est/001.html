csb[1] = "These events took place during the days of Ahasuerus, who ruled 127 provinces from India to Cush.";
csb[2] = "In those days King Ahasuerus reigned from his royal throne in the fortress at Susa.";
csb[3] = "He held a feast in the third year of his reign for all his officials and staff, the army of Persia and Media, the nobles, and the officials from the provinces.";
csb[4] = "He displayed the glorious wealth of his kingdom and the magnificent splendor of his greatness for a total of 180 days.";
csb[5] = "At the end of this time, the king held a week-long banquet in the garden courtyard of the royal palace for all the people, from the greatest to the least, who were present in the fortress of Susa.";
csb[6] = "White and violet linen hangings were fastened with fine white and purple linen cords to silver rods on marble columns. Gold and silver couches were arranged on a mosaic pavement of red feldspar, marble, mother-of-pearl, and precious stones.";
csb[7] = "Drinks were served in an array of gold goblets, each with a different design. Royal wine flowed freely, according to the king\'s bounty.";
csb[8] = "The drinking was according to royal decree: &quot;There are no restrictions.&quot; The king had ordered every wine steward in his household to serve whatever each person wanted.";
csb[9] = "Queen Vashti also gave a feast for the women of King Ahasuerus\'s palace.";
csb[10] = "On the seventh day, when the king was feeling good from the wine, Ahasuerus commanded Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar, and Carkas -- the seven eunuchs who personally served him --";
csb[11] = "to bring Queen Vashti before him with her royal crown. He wanted to show off her beauty to the people and the officials, because she was very beautiful.";
csb[12] = "But Queen Vashti refused to come at the king\'s command that was delivered by his eunuchs. The king became furious and his anger burned within him.";
csb[13] = "The king consulted the wise men who understood the times, for it was his normal procedure to confer with experts in law and justice.";
csb[14] = "The most trusted ones were Carshena, Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan. They were the seven officials of Persia and Media who had personal access to the king and occupied the highest positions in the kingdom.";
csb[15] = "The king asked, &quot;According to the law, what should be done with Queen Vashti, since she refused to obey King Ahasuerus\'s command that was delivered by the eunuchs? &quot;";
csb[16] = "Memucan said in the presence of the king and his officials, &quot;Queen Vashti has wronged not only the king, but all the officials and the peoples who are in every one of King Ahasuerus\'s provinces.";
csb[17] = "&quot;For the queen\'s action will become public knowledge to all the women and cause them to despise their husbands and say, \'King Ahasuerus ordered Queen Vashti brought before him, but she did not come.\'";
csb[18] = "&quot;Before this day is over, the noble women of Persia and Media who hear about the queen\'s act will say the same thing to all the king\'s officials, resulting in more contempt and fury.";
csb[19] = "&quot;If it meets the king\'s approval, he should personally issue a royal decree. Let it be recorded in the laws of Persia and Media, so that it cannot be revoked: Vashti is not to enter King Ahasuerus\'s presence, and her royal position is to be given to another woman who is more worthy than she.";
csb[20] = "&quot;The decree the king issues will be heard throughout his vast kingdom, so all women will honor their husbands, from the greatest to the least.&quot;";
csb[21] = "The king and his counselors approved the proposal, and he followed Memucan\'s advice.";
csb[22] = "He sent letters to all the royal provinces, to each province in its own script and to each ethnic group in its own language, that every man should be master of his own house and speak in the language of his own people.";

dby[6] = "White, green, and blue [hangings] were fastened with cords of byssus and purple to silver rings and pillars of white marble; couches of gold and silver [lay] upon a pavement of red and white marble, and alabaster, and black marble.";

kjv[16] = "And Memucan answered before the king and the princes, Vashti the queen hath not done wrong to the king only, but also to all the princes, and to all the people that [are] in all the provinces of the king Ahasuerus.";
rsv[16] = "Then Memu\'can said in presence of the king and the princes, &quot;Not only to the king has Queen Vashti done wrong, but also to all the princes and all the peoples who are in all the provinces of King Ahasu-e\'rus.";
asv[16] = "And Memucan answered before the king and the princes, Vashti the queen hath not done wrong to the king only, but also to all the princes, and to all the peoples that are in all the provinces of the king Ahasuerus.";
yng[16] = "And Memucan saith before the king and the heads, `Not against the king by himself hath Vashti the queen done perversely, but against all the heads, and against all the peoples that [are] in all provinces of the king Ahasuerus;";
dby[16] = "Then said Memucan before the king and the princes, The queen Vashti has not done wrong to the king only, but also to all the princes, and to all the peoples that are in all the provinces of the king Ahasuerus.";

vul[16] = "responditque Mamuchan audiente rege atque principibus non solum regem laesit regina Vasthi sed omnes principes et populos qui sunt in cunctis provinciis regis Asueri";
kjv[17] = "For [this] deed of the queen shall come abroad unto all women, so that they shall despise their husbands in their eyes, when it shall be reported, The king Ahasuerus commanded Vashti the queen to be brought in before him, but she came not.";
rsv[17] = "For this deed of the queen will be made known to all women, causing them to look with contempt upon their husbands, since they will say, \'King Ahasu-e\'rus commanded Queen Vashti to be brought before him, and she did not come.\'";
asv[17] = "For this deed of the queen will come abroad unto all women, to make their husbands contemptible in their eyes, when it shall be reported, The king Ahasuerus commanded Vashti the queen to be brought in before him, but she came not.";
yng[17] = "for go forth doth the word of the queen unto all the women, to render their husbands contemptible in their eyes, in their saying, The king Ahasuerus said to bring in Vashti the queen before him, and she did not come;";
dby[17] = "For the act of the queen will come abroad to all women, so as to render their husbands contemptible in their eyes, when they shall say, The king Ahasuerus commanded the queen Vashti to be brought in before him, and she came not!";
web[17] = "For [this] deed of the queen will come abroad to all women, so that they will despise their husbands in their eyes, when it shall be reported, The king Ahasuerus commanded Vashti the queen to be brought in before him, but she came not.";
hnv[17] = "For this deed of the queen will come abroad to all women, to make their husbands contemptible in their eyes, when it shall be reported, The king Achashverosh commanded Vashti the queen to be brought in before him, but she didn\'t come.";
vul[17] = "egredietur enim sermo reginae ad omnes mulieres ut contemnant viros suos et dicant rex Asuerus iussit ut regina Vasthi intraret ad eum et illa noluit";
kjv[18] = "[Likewise] shall the ladies of Persia and Media say this day unto all the king\'s princes, which have heard of the deed of the queen. Thus [shall there arise] too much contempt and wrath.";
rsv[18] = "This very day the ladies of Persia and Media who have heard of the queen\'s behavior will be telling it to all the king\'s princes, and there will be contempt and wrath in plenty.";
asv[18] = "And this day will the princesses of Persia and Media who have heard of the deed of the queen say [the like] unto all the king\'s princes. So [will there arise] much contempt and wrath.";
yng[18] = "yea, this day do princesses of Persia and Media, who have heard the word of the queen, say [so] to all heads of the king, even according to the sufficiency of contempt and wrath.";
dby[18] = "And the princesses of Persia and Media who have heard of the queen\'s act, will say it this day to all the king\'s princes, and there will be contempt and anger enough.";
web[18] = "[Likewise] will the ladies of Persia and Media say this day to all the king\'s princes, who have heard of the deed of the queen. Thus [will there arise] too much contempt and wrath.";
hnv[18] = "This day will the princesses of Paras and Madai who have heard of the deed of the queen say [the like] to all the king\'s princes. So [will there arise] much contempt and wrath.";
vul[18] = "atque hoc exemplo omnes principum coniuges Persarum atque Medorum parvipendent imperia maritorum unde regis iusta est indignatio";
kjv[19] = "If it please the king, let there go a royal commandment from him, and let it be written among the laws of the Persians and the Medes, that it be not altered, That Vashti come no more before king Ahasuerus; and let the king give her royal estate unto another that is better than she.";
rsv[19] = "If it please the king, let a royal order go forth from him, and let it be written among the laws of the Persians and the Medes so that it may not be altered, that Vashti is to come no more before King Ahasu-e\'rus; and let the king give her royal position to another who is better than she.";
asv[19] = "If it please the king, let there go forth a royal commandment from him, and let it be written among the laws of the Persians and the Medes, that it be not altered, that Vashti come no more before king Ahasuerus; and let the king give her royal estate unto another that is better than she.";
yng[19] = "`If to the king [it be] good, there goeth forth a royal word from before him, and it is written with the laws of Persia and Media, and doth not pass away, that Vashti doth not come in before the king Ahasuerus, and her royalty doth the king give to her companion who [is] better than she;";
dby[19] = "If it please the king, let a royal order go forth from him, and let it be written among the laws of the Persians and the Medes, that it may not pass, That Vashti come no more before king Ahasuerus; and let the king give her royal estate to another that is better than she;";
web[19] = "If it pleaseth the king, let a royal commandment go from him, and let it be written among the laws of the Persians and the Medes, that it be not altered, That Vashti come no more before king Ahasuerus; and let the king give her royal estate to another that is better than she.";
hnv[19] = " If it please the king, let there go forth a royal mitzvah from him, and let it be written among the laws of the Paras and the Madai, that it not be altered, that Vashti come no more before king Achashverosh; and let the king give her royal estate to another who is better than she.";
vul[19] = "et si tibi placet egrediatur edictum a facie tua et scribatur iuxta legem Persarum atque Medorum quam praeteriri inlicitum est ut nequaquam ultra Vasthi ingrediatur ad regem sed regnum illius altera quae melior illa est accipiat";
kjv[20] = "And when the king\'s decree which he shall make shall be published throughout all his empire, (for it is great,) all the wives shall give to their husbands honour, both to great and small.";

web[20] = "And when the king\'s decree which he shall make shall be published throughout all his empire, (for it is great,) all the wives will give to their husbands honor, both to great and small.";

kjv[22] = "For he sent letters into all the king\'s provinces, into every province according to the writing thereof, and to every people after their language, that every man should bear rule in his own house, and that [it] should be published according to the language of every people.";

asv[22] = "for he sent letters into all the king\'s provinces, into every province according to the writing thereof, and to every people after their language, that every man should bear rule in his own house, and should speak according to the language of his people.";
yng[22] = "and sendeth letters unto all provinces of the king, unto province and province according to its writing, and unto people and people according to its tongue, for every man being head in his own house -- and speaking according to the language of his people.";
dby[22] = "And he sent letters into all the king\'s provinces, into every province according to the writing thereof, and to every people according to their language, That every man should bear rule in his own house, and should speak according to the language of his people.";
web[22] = "For he sent letters into all the king\'s provinces, into every province according to the writing of it, and to every people after their language, that every man should bear rule in his own house, and that [it] should be published according to the language of every people.";
