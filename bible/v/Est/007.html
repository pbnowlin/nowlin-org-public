csb[1] = "The king and Haman came to feast with Esther the queen.";
csb[2] = "Once again, on the second day while drinking wine, the king asked Esther, &quot;Queen Esther, whatever you ask will be given to you. Whatever you seek, even to half the kingdom, will be done.&quot;";
csb[3] = "Queen Esther answered, &quot;If I have found favor in your eyes, Your Majesty, and if the king is pleased, spare my life; this is my request. And spare my people; this is my desire.";
csb[4] = "&quot;For my people and I have been sold to destruction, death, and extermination. If we had merely been sold as male and female slaves, I would have kept silent. Indeed, the trouble wouldn\'t be worth burdening the king.&quot;";
csb[5] = "King Ahasuerus spoke up and asked Queen Esther, &quot;Who is this, and where is the one who would devise such a scheme? &quot;";
csb[6] = "Esther answered, &quot;The adversary and enemy is this evil Haman.&quot; Haman stood terrified before the king and queen.";
csb[7] = "The king arose in anger and went from where they were drinking wine to the palace garden. Haman remained to beg Queen Esther for his life because he realized the king was planning something terrible for him.";
csb[8] = "Just as the king returned from the palace garden to the banquet hall, Haman was falling on the couch where Esther was reclining. The king exclaimed, &quot;Would he actually violate the queen while I am in the house? &quot; As soon as the statement left the king\'s mouth, they covered Haman\'s face.";
csb[9] = "Harbona, one of the king\'s eunuchs, said: &quot;There is a gallows seventy-five feet tall at Haman\'s house that he made for Mordecai, who gave the report that saved the king.&quot; The king said, &quot;Hang him on it.&quot;";
csb[10] = "They hanged Haman on the gallows he had prepared for Mordecai. Then the king\'s anger subsided.";
kjv[1] = "So the king and Haman came to banquet with Esther the queen.";

kjv[2] = "And the king said again unto Esther on the second day at the banquet of wine, What [is] thy petition, queen Esther? and it shall be granted thee: and what [is] thy request? and it shall be performed, [even] to the half of the kingdom.";
rsv[2] = "And on the second day, as they were drinking wine, the king again said to Esther, &quot;What is your petition, Queen Esther? It shall be granted you. And what is your request? Even to the half of my kingdom, it shall be fulfilled.&quot;";
asv[2] = "And the king said again unto Esther on the second day at the banquet of wine, What is thy petition, queen Esther? and it shall be granted thee: and what is thy request? even to the half of the kingdom it shall be performed.";
yng[2] = "and the king saith to Esther also on the second day, during the banquet of wine, `What [is] thy petition, Esther, O queen? and it is given to thee; and what thy request? unto the half of the kingdom -- and it is done.\'";
dby[2] = "And the king said again to Esther on the second day, at the banquet of wine, What is thy petition, queen Esther? and it shall be granted thee; and what is thy request? even to the half of the kingdom it shall be done.";
web[2] = "And the king said again to Esther on the second day at the banquet of wine, What [is] thy petition, queen Esther? and it shall be granted thee: and what [is] thy request? and it shall be performed, [even] to the half of the kingdom.";
hnv[2] = "The king said again to Ester on the second day at the banquet of wine, What is your petition, queen Ester? and it shall be granted you: and what is your request? even to the half of the kingdom it shall be performed.";
vul[2] = "dixitque ei rex etiam in secundo die postquam vino incaluerat quae est petitio tua Hester ut detur tibi et quid vis fieri etiam si dimidiam regni mei partem petieris inpetrabis";
kjv[3] = "Then Esther the queen answered and said, If I have found favour in thy sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request:";
rsv[3] = "Then Queen Esther answered, &quot;If I have found favor in your sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request.";
asv[3] = "Then Esther the queen answered and said, If I have found favor in thy sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request:";
yng[3] = "And Esther the queen answereth and saith, `If I have found grace in thine eyes, O king, and if to the king [it be] good, let my life be given to me at my petition, and my people at my request;";
dby[3] = "And Esther the queen answered and said, If I have found grace in thy sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request;";
web[3] = "Then Esther the queen answered and said, If I have found favor in thy sight, O king, and if it shall please the king, let my life be given me at my petition, and my people at my request:";
hnv[3] = "Then Ester the queen answered, If I have found favor in your sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request:";
vul[3] = "ad quem illa respondit si inveni gratiam in oculis tuis o rex et si tibi placet dona mihi animam meam pro qua rogo et populum meum pro quo obsecro";
kjv[4] = "For we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bondmen and bondwomen, I had held my tongue, although the enemy could not countervail the king\'s damage.";
rsv[4] = "For we are sold, I and my people, to be destroyed, to be slain, and to be annihilated. If we had been sold merely as slaves, men and women, I would have held my peace; for our affliction is not to be compared with the loss to the king.&quot;";
asv[4] = "for we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bondmen and bondwomen, I had held my peace, although the adversary could not have compensated for the king\'s damage.";
yng[4] = "for we have been sold, I and my people, to cut off, to slay, and to destroy; and if for men-servants and for maid-servants we had been sold I had kept silent -- but the adversity is not equal to the loss of the king.\'";
dby[4] = "for we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bondmen and bondwomen, I had held my tongue, although the adversary could not compensate the king\'s damage.";
web[4] = "For we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bond-men and bond-women, I had held my tongue, although the enemy could not countervail the king\'s damage.";
hnv[4] = "for we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bondservants and bondmaids, I had held my shalom, although the adversary could not have compensated for the king\'s damage.";
vul[4] = "traditi enim sumus ego et populus meus ut conteramur iugulemur et pereamus atque utinam in servos et famulas venderemur esset tolerabile malum et gemens tacerem nunc autem hostis noster est cuius crudelitas redundat in regem";
kjv[5] = "Then the king Ahasuerus answered and said unto Esther the queen, Who is he, and where is he, that durst presume in his heart to do so?";
rsv[5] = "Then King Ahasu-e\'rus said to Queen Esther, &quot;Who is he, and where is he, that would presume to do this?&quot;";
asv[5] = "Then spake the king Ahasuerus and said unto Esther the queen, Who is he, and where is he, that durst presume in his heart to do so?";
yng[5] = "And the king Ahasuerus saith, yea, he saith to Esther the queen, `Who [is] he -- this one? and where [is] this one? -- he whose heart hath filled him to do so?\'";
dby[5] = "And king Ahasuerus spoke and said to Esther the queen, Who is he, and where is he that has filled his heart to do so?";
web[5] = "Then the king Ahasuerus answered and said to Esther the queen, Who is he, and where is he, that durst presume in his heart to do so?";
hnv[5] = "Then spoke the king Achashverosh and said to Ester the queen, Who is he, and where is he, that dared presume in his heart to do so?";
vul[5] = "respondensque rex Asuerus ait quis est iste et cuius potentiae ut haec audeat facere";
kjv[6] = "And Esther said, The adversary and enemy [is] this wicked Haman. Then Haman was afraid before the king and the queen.";
rsv[6] = "And Esther said, &quot;A foe and enemy! This wicked Haman!&quot; Then Haman was in terror before the king and the queen.";
asv[6] = "And Esther said, An adversary and an enemy, even this wicked Haman. Then Haman was afraid before the king and the queen.";
yng[6] = "And Esther saith, `The man -- adversary and enemy -- [is] this wicked Haman;\' and Haman hath been afraid at the presence of the king and of the queen.";
dby[6] = "And Esther said, The adversary and enemy is this wicked Haman. Then Haman was terrified before the king and the queen.";
web[6] = "And Esther said, The adversary and enemy [is] this wicked Haman. Then Haman was afraid before the king and the queen.";
hnv[6] = "Ester said, An adversary and an enemy, even this wicked Haman. Then Haman was afraid before the king and the queen.";
vul[6] = "dixit Hester hostis et inimicus noster pessimus iste est Aman quod ille audiens ilico obstipuit vultum regis ac reginae ferre non sustinens";
kjv[7] = "And the king arising from the banquet of wine in his wrath [went] into the palace garden: and Haman stood up to make request for his life to Esther the queen; for he saw that there was evil determined against him by the king.";
rsv[7] = "And the king rose from the feast in wrath and went into the palace garden; but Haman stayed to beg his life from Queen Esther, for he saw that evil was determined against him by the king.";
asv[7] = "And the king arose in his wrath from the banquet of wine [and went] into the palace garden: and Haman stood up to make request for his life to Esther the queen; for he saw that there was evil determined against him by the king.";
yng[7] = "And the king hath risen, in his fury, from the banquet of wine, unto the garden of the house, and Haman hath remained to seek for his life from Esther the queen, for he hath seen that evil hath been determined against him by the king.";
dby[7] = "And the king in his wrath rose up from the banquet of wine, [and went] into the palace garden; but Haman stayed to make request for his life to Esther the queen, for he saw that there was evil determined against him by the king.";
web[7] = "And the king arising from the banquet of wine in his wrath [went] into the palace-garden: and Haman stood up to make request for his life to Esther the queen; for he saw that there was evil determined against him by the king.";
hnv[7] = "The king arose in his wrath from the banquet of wine [and went] into the palace garden: and Haman stood up to make request for his life to Ester the queen; for he saw that there was evil determined against him by the king.";
vul[7] = "rex autem surrexit iratus et de loco convivii intravit in hortum arboribus consitum Aman quoque surrexit ut rogaret Hester reginam pro anima sua intellexit enim a rege sibi paratum malum";
kjv[8] = "Then the king returned out of the palace garden into the place of the banquet of wine; and Haman was fallen upon the bed whereon Esther [was]. Then said the king, Will he force the queen also before me in the house? As the word went out of the king\'s mouth, they covered Haman\'s face.";
rsv[8] = "And the king returned from the palace garden to the place where they were drinking wine, as Haman was falling on the couch where Esther was; and the king said, &quot;Will he even assault the queen in my presence, in my own house?&quot; As the words left the mouth of the king, they covered Haman\'s face.";
asv[8] = "Then the king returned out of the palace garden into the place of the banquet of wine; and Haman was fallen upon the couch whereon Esther was. Then said the king, Will he even force the queen before me in the house? As the word went out of the king\'s mouth, they covered Haman\'s face.";
yng[8] = "And the king hath turned back out of the garden of the house unto the house of the banquet of wine, and Haman is falling on the couch on which Esther [is], and the king saith, `Also to subdue the queen with me in the house?\' the word hath gone out from the mouth of the king, and the face of Haman they have covered.";
dby[8] = "And the king returned out of the palace garden into the house of the banquet of wine, and Haman was fallen upon the couch on which Esther was. And the king said, Will he even force the queen before me in the house? The word went forth out of the king\'s mouth, and they covered Haman\'s face.";
web[8] = "Then the king returned out of the palace-garden into the place of the banquet of wine; and Haman had fallen upon the bed on which Esther [was]. Then said the king, Will he force the queen also before me in the house? As the word went out of the king\'s mouth, they covered Haman\'s face.";
hnv[8] = "Then the king returned out of the palace garden into the place of the banquet of wine; and Haman was fallen on the couch whereon Ester was. Then said the king, Will he even force the queen before me in the house? As the word went out of the king\'s mouth, they covered Haman\'s face.";
vul[8] = "qui cum reversus esset de horto nemoribus consito et intrasset convivii locum repperit Aman super lectulum corruisse in quo iacebat Hester et ait etiam reginam vult opprimere me praesente in domo mea necdum verbum de ore regis exierat et statim operuerunt faciem eius";
kjv[9] = "And Harbonah, one of the chamberlains, said before the king, Behold also, the gallows fifty cubits high, which Haman had made for Mordecai, who had spoken good for the king, standeth in the house of Haman. Then the king said, Hang him thereon.";
rsv[9] = "Then said Harbo\'na, one of the eunuchs in attendance on the king, &quot;Moreover, the gallows which Haman has prepared for Mor\'decai, whose word saved the king, is standing in Haman\'s house, fifty cubits high.&quot;";
asv[9] = "Then said Harbonah, one of the chamberlains that were before the king, Behold also, the gallows fifty cubits high, which Haman hath made for Mordecai, who spake good for the king, standeth in the house of Haman. And the king said, Hang him thereon.";
yng[9] = "And Harbonah, one of the eunuchs, saith before the king, `Also lo, the tree that Haman made for Mordecai, who spake good for the king, is standing in the house of Haman, in height fifty cubits;\' and the king saith, `Hang him upon it.\'";
dby[9] = "And Harbonah, one of the chamberlains, said before the king, Behold, also, the gallows fifty cubits high, that Haman made for Mordecai, who spoke good for the king, stands in the house of Haman. And the king said, Hang him on it!";
web[9] = "And Harbonah, one of the chamberlains, said before the king, Behold also, the gallows fifty cubits high, which Haman had made for Mordecai, who had spoken good for the king, standeth in the house of Haman. Then the king said, Hang him upon it.";
hnv[9] = "Then said Harvonah, one of the chamberlains who were before the king, Behold also, the gallows fifty cubits high, which Haman has made for Mordekhai, who spoke good for the king, stands in the house of Haman. The king said, Hang him thereon.";
vul[9] = "dixitque Arbona unus de eunuchis qui stabant in ministerio regis en lignum quod paraverat Mardocheo qui locutus est pro rege stat in domo Aman habens altitudinis quinquaginta cubitos cui dixit rex adpendite eum in eo";
kjv[10] = "So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king\'s wrath pacified.";
rsv[10] = "And the king said, &quot;Hang him on that.&quot; So they hanged Haman on the gallows which he had prepared for Mor\'decai. Then the anger of the king abated.";
asv[10] = "So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king\'s wrath pacified.";
yng[10] = "And they hang Haman upon the tree that he had prepared for Mordecai, and the fury of the king hath lain down.";
dby[10] = "So they hanged Haman on the gallows that he had prepared for Mordecai. And the king\'s wrath was appeased.";
web[10] = "So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king\'s wrath pacified.";
hnv[10] = "So they hanged Haman on the gallows that he had prepared for Mordekhai. Then was the king\'s wrath pacified.";
vul[10] = "suspensus est itaque Aman in patibulo quod paraverat Mardocheo et regis ira quievit";
