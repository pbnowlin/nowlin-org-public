csb[1] = "That same day King Ahasuerus awarded Queen Esther the estate of Haman, the enemy of the Jews. Mordecai entered the king\'s presence because Esther had revealed her relationship to Mordecai.";
csb[2] = "The king removed his signet ring he had recovered from Haman and gave it to Mordecai, and Esther put him in charge of Haman\'s estate.";
csb[3] = "Then Esther addressed the king again. She fell at his feet, wept, and begged him to revoke the evil of Haman the Agagite and his plot he had devised against the Jews.";
csb[4] = "The king extended the gold scepter toward Esther, so she got up and stood before the king.";
csb[5] = "She said, &quot;If it pleases the king and I have found favor before him, if the matter seems right to the king and I am pleasing in his eyes, let a royal edict be written. Let it revoke the documents the scheming Haman son of Hammedatha the Agagite wrote to destroy the Jews who are in all the king\'s provinces.";
csb[6] = "&quot;For how could I bear to see the disaster that would come on my people? How could I bear to see the destruction of my relatives? &quot;";
csb[7] = "King Ahasuerus said to Esther the queen and to Mordecai the Jew, &quot;Look, I have given Haman\'s estate to Esther, and he was hanged on the gallows because he attacked the Jews.";
csb[8] = "&quot;Write in the king\'s name whatever pleases you concerning the Jews, and seal it with the royal signet ring. A document written in the king\'s name and sealed with the royal signet ring cannot be revoked.&quot;";
csb[9] = "On the twenty-third day of the third month -- that is, the month Sivan -- &#x2009;the royal scribes were summoned. Everything was written exactly as Mordecai commanded for the Jews, to the satraps, the governors, and the officials of the 127 provinces from India to Cush. The edict was written for each province in its own script, for each ethnic group in its own language, and to the Jews in their own script and language.";
csb[10] = "Mordecai wrote in King Ahasuerus\'s name and sealed the edicts with the royal signet ring. He sent the documents by mounted couriers, who rode fast horses bred in the royal stables.";
csb[11] = "The king\'s edict gave the Jews in each and every city the right to assemble and defend themselves, to destroy, kill, and annihilate every ethnic and provincial army hostile to them, including women and children, and to take their possessions as spoils of war.";
csb[12] = "This would take place on a single day throughout all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, the month Adar.";
csb[13] = "A copy of the text, issued as law throughout every province, was distributed to all the peoples so the Jews could be ready to avenge themselves against their enemies on that day.";
csb[14] = "The couriers rode out in haste on their royal horses at the king\'s urgent command. The law was also issued in the fortress of Susa.";
csb[15] = "Mordecai went from the king\'s presence clothed in royal purple and white, with a great gold crown and a purple robe of fine linen. The city of Susa shouted and rejoiced,";
csb[16] = "and the Jews celebrated with gladness, joy, and honor.";
csb[17] = "In every province and every city, wherever the king\'s command and his law reached, joy and rejoicing took place among the Jews. There was a celebration and a holiday. And many of the ethnic groups of the land professed themselves to be Jews because fear of the Jews had overcome them.";
kjv[1] = "On that day did the king Ahasuerus give the house of Haman the Jews\' enemy unto Esther the queen. And Mordecai came before the king; for Esther had told what he [was] unto her.";
rsv[1] = "On that day King Ahasu-e\'rus gave to Queen Esther the house of Haman, the enemy of the Jews. And Mor\'decai came before the king, for Esther had told what he was to her;";
asv[1] = "On that day did the king Ahasuerus give the house of Haman the Jews\' enemy unto Esther the queen. And Mordecai came before the king; for Esther had told what he was unto her.";
yng[1] = "On that day hath the king Ahasuerus given to Esther the queen the house of Haman, adversary of the Jews, and Mordecai hath come in before the king, for Esther hath declared what he [is] to her,";
dby[1] = "On that day did king Ahasuerus give the house of Haman the Jews\' oppressor to Esther the queen. And Mordecai came before the king; for Esther had told what he was to her.";
web[1] = "On that day the king Ahasuerus gave the house of Haman, the Jews\' enemy, to Esther the queen. And Mordecai came before the king; for Esther had told what he [was] to her.";
hnv[1] = "On that day did the king Achashverosh give the house of Haman the Yehudim\' enemy to Ester the queen. Mordekhai came before the king; for Ester had told what he was to her.";
vul[1] = "die illo dedit rex Asuerus Hester reginae domum Aman adversarii Iudaeorum et Mardocheus ingressus est ante faciem regis confessa est enim ei Hester quod esset patruus suus";

rsv[2] = "and the king took off his signet ring, which he had taken from Haman, and gave it to Mor\'decai. And Esther set Mor\'decai over the house of Haman.";
asv[2] = "And the king took off his ring, which he had taken from Haman, and gave it unto Mordecai. And Esther set Mordecai over the house of Haman.";

dby[2] = "And the king took off his ring, which he had taken from Haman, and gave it to Mordecai. And Esther set Mordecai over the house of Haman.";
web[2] = "And the king took off his ring which he had taken from Haman, and gave it to Mordecai. And Esther set Mordecai over the house of Haman.";

rsv[3] = "Then Esther spoke again to the king; she fell at his feet and besought him with tears to avert the evil design of Haman the Ag\'agite and the plot which he had devised against the Jews.";
asv[3] = "And Esther spake yet again before the king, and fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite, and his device that he had devised against the Jews.";
yng[3] = "And Esther addeth, and speaketh before the king, and falleth before his feet, and weepeth, and maketh supplication to him, to cause the evil of Haman the Agagite to pass away, and his device that he had devised against the Jews;";
dby[3] = "And Esther spoke yet again before the king, and fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite, and his device which he had devised against the Jews.";
web[3] = "And Esther spoke yet again before the king, and fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite, and his device that he had devised against the Jews.";
hnv[3] = "Ester spoke yet again before the king, and fell down at his feet, and begged him with tears to put away the mischief of Haman the Agagite, and his device that he had devised against the Yehudim.";
vul[3] = "nec his contenta procidit ad pedes regis flevitque et locuta ad eum oravit ut malitiam Aman Agagitae et machinationes eius pessimas quas excogitaverat contra Iudaeos iuberet irritas fieri";

kjv[5] = "And said, If it please the king, and if I have found favour in his sight, and the thing [seem] right before the king, and I [be] pleasing in his eyes, let it be written to reverse the letters devised by Haman the son of Hammedatha the Agagite, which he wrote to destroy the Jews which [are] in all the king\'s provinces:";
rsv[5] = "and Esther rose and stood before the king. And she said, &quot;If it please the king, and if I have found favor in his sight, and if the thing seem right before the king, and I be pleasing in his eyes, let an order be written to revoke the letters devised by Haman the Ag\'agite, the son of Hammeda\'tha, which he wrote to destroy the Jews who are in all the provinces of the king.";
asv[5] = "And she said, If it please the king, and if I have found favor in his sight, and the thing seem right before the king, and I be pleasing in his eyes, let it be written to reverse the letters devised by Haman, the son of Hammedatha the Agagite, which he wrote to destroy the Jews that are in all the king\'s provinces:";
yng[5] = "and saith, `If to the king [it be] good, and if I have found grace before him, and the thing hath been right before the king, and I [be] good in his eyes, let it be written to bring back the letters -- a device of Haman son of Hammedatha the Agagite -- that he wrote to destroy the Jews who [are] in all provinces of the king,";
dby[5] = "and said, If it please the king and if I have found grace before him, and the thing seem right to the king, and I be pleasing in his sight, let it be written to reverse the letters devised by Haman the son of Hammedatha the Agagite, which he wrote to destroy the Jews that are in all the king\'s provinces.";
web[5] = "And said, If it shall please the king, and if I have found favor in his sight, and the thing [shall seem] right before the king, and I [am] pleasing in his eyes, let it be written to reverse the letters devised by Haman the son of Hammedatha the Agagite, which he wrote to destroy the Jews who [are] in all the king\'s provinces:";
hnv[5] = " She said, If it please the king, and if I have found favor in his sight, and the thing seem right before the king, and I be pleasing in his eyes, let it be written to reverse the letters devised by Haman, the son of Hammedata the Agagite, which he wrote to destroy the Yehudim who are in all the king\'s provinces:";
vul[5] = "et ait si placet regi et inveni gratiam coram oculis eius et deprecatio mea non ei videtur esse contraria obsecro ut novis epistulis veteres Aman litterae insidiatoris et hostis Iudaeorum quibus eos in cunctis regis provinciis perire praeceperat corrigantur";

kjv[7] = "Then the king Ahasuerus said unto Esther the queen and to Mordecai the Jew, Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he laid his hand upon the Jews.";
rsv[7] = "Then King Ahasu-e\'rus said to Queen Esther and to Mor\'decai the Jew, &quot;Behold, I have given Esther the house of Haman, and they have hanged him on the gallows, because he would lay hands on the Jews.";
asv[7] = "Then the king Ahasuerus said unto Esther the queen and to Mordecai the Jew, Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he laid his hand upon the Jews.";
yng[7] = "And the king Ahasuerus saith to Esther the queen, and to Mordecai the Jew, `Lo, the house of Haman I have given to Esther, and him they have hanged on the tree, because that he put forth his hand on the Jews,";
dby[7] = "And king Ahasuerus said to queen Esther and to Mordecai the Jew, Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he stretched forth his hand against the Jews.";
web[7] = "Then the king Ahasuerus said to Esther the queen and to Mordecai the Jew, Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he laid his hand upon the Jews.";

vul[7] = "responditque rex Asuerus Hester reginae et Mardocheo Iudaeo domum Aman concessi Hester et ipsum iussi adfigi cruci qui ausus est manum in Iudaeos mittere";
kjv[8] = "Write ye also for the Jews, as it liketh you, in the king\'s name, and seal [it] with the king\'s ring: for the writing which is written in the king\'s name, and sealed with the king\'s ring, may no man reverse.";
rsv[8] = "And you may write as you please with regard to the Jews, in the name of the king, and seal it with the king\'s ring; for an edict written in the name of the king and sealed with the king\'s ring cannot be revoked.&quot;";
asv[8] = "Write ye also to the Jews, as it pleaseth you, in the king\'s name, and seal it with the king\'s ring; for the writing which is written in the king\'s name, and sealed with the king\'s ring, may no man reverse.";
yng[8] = "and ye, write ye for the Jews, as [it is] good in your eyes, in the name of the king, and seal with the signet of the king -- for the writing that is written in the name of the king, and sealed with the signet of the king, there is none to turn back.\'";
dby[8] = "Write ye then for the Jews as seems good to you, in the king\'s name, and seal [it] with the king\'s ring. For a writing that is written in the king\'s name, and sealed with the king\'s ring, cannot be reversed.";
web[8] = "Write ye also for the Jews, as it pleaseth you, in the king\'s name, and seal [it] with the king\'s ring: for the writing which is written in the king\'s name, and sealed with the king\'s ring, no man may reverse.";
hnv[8] = "Write you also to the Yehudim, as it pleases you, in the king\'s name, and seal it with the king\'s ring; for the writing which is written in the king\'s name, and sealed with the king\'s ring, may no man reverse.";
vul[8] = "scribite ergo Iudaeis sicut vobis placet ex regis nomine signantes litteras anulo meo haec enim consuetudo erat ut epistulis quae ex regis nomine mittebantur et illius anulo signatae erant nemo auderet contradicere";
kjv[9] = "Then were the king\'s scribes called at that time in the third month, that [is], the month Sivan, on the three and twentieth [day] thereof; and it was written according to all that Mordecai commanded unto the Jews, and to the lieutenants, and the deputies and rulers of the provinces which [are] from India unto Ethiopia, an hundred twenty and seven provinces, unto every province according to the writing thereof, and unto every people after their language, and to the Jews according to their writing, and according to their language.";
rsv[9] = "The king\'s secretaries were summoned at that time, in the third month, which is the month of Sivan, on the twenty-third day; and an edict was written according to all that Mor\'decai commanded concerning the Jews to the satraps and the governors and the princes of the provinces from India to Ethiopia, a hundred and twenty-seven provinces, to every province in its own script and to every people in its own language, and also to the Jews in their script and their language.";
asv[9] = "Then were the king\'s scribes called at that time, in the third month, which is the month Sivan, on the three and twentieth [day] thereof; and it was written according to all that Mordecai commanded unto the Jews, and to the satraps, and the governors and princes of the provinces which are from India unto Ethiopia, a hundred twenty and seven provinces, unto every province according to the writing thereof, and unto every people after their language, and to the Jews according to their writing, and according to their language.";
yng[9] = "And the scribes of the king are called, at that time, in the third month -- it [is] the month of Sivan -- in the three and twentieth of it, and it is written, according to all that Mordecai hath commanded, unto the Jews, and unto the lieutenants, and the governors, and the heads of the provinces, that [are] from Hodu even unto Cush, seven and twenty and a hundred provinces -- province and province according to its writing, and people and people according to its tongue, and unto the Jews according to their writing, and according to their tongue.";
dby[9] = "Then were the king\'s scribes called at that time, in the third month, that is, the month Sivan, on the three and twentieth [day] thereof; and it was written according to all that Mordecai commanded, to the Jews, and to the satraps, and the governors, and the princes of the provinces which are from India even to Ethiopia, a hundred and twenty-seven provinces, to every province according to the writing thereof, and to every people according to their language, and to the Jews according to their writing and according to their language.";
web[9] = "Then were the king\'s scribes called at that time in the third month, that [is], the month Sivan, on the three and twentieth [day] of it; and it was written, according to all that Mordecai commanded, to the Jews, and to the lieutenants, and the deputies and rulers of the provinces which [are] from India to Cush, a hundred twenty and seven provinces, to every province according to the writing of it, and to every people after their language, and to the Jews according to their writing, and according to their language.";
hnv[9] = "Then were the king\'s Sofrim called at that time, in the third month Sivan, on the three and twentieth [day] of it; and it was written according to all that Mordekhai commanded to the Yehudim, and to the satraps, and the governors and princes of the provinces which are from Hoddu to Kush, one hundred twenty-seven provinces, to every province according to the writing of it, and to every people after their language, and to the Yehudim according to their writing, and according to their language.";
vul[9] = "accitisque scribis et librariis regis erat autem tempus tertii mensis qui appellatur siban vicesima et tertia illius die scriptae sunt epistulae ut Mardocheus voluerat ad Iudaeos et ad principes procuratoresque et iudices qui centum viginti septem provinciis ab India usque Aethiopiam praesidebant provinciae atque provinciae populo et populo iuxta linguas et litteras suas et Iudaeis ut legere poterant et audire";
kjv[10] = "And he wrote in the king Ahasuerus\' name, and sealed [it] with the king\'s ring, and sent letters by posts on horseback, [and] riders on mules, camels, [and] young dromedaries:";
rsv[10] = "The writing was in the name of King Ahasu-e\'rus and sealed with the king\'s ring, and letters were sent by mounted couriers riding on swift horses that were used in the king\'s service, bred from the royal stud.";
asv[10] = "And he wrote the name of king Ahasuerus, and sealed it with the king\'s ring, and sent letters by posts on horseback, riding on swift steeds that were used in the king\'s service, bred of the stud:";
yng[10] = "And he writeth in the name of the king Ahasuerus, and sealeth with the signet of the king, and sendeth letters by the hand of the runners with horses, riders of the dromedary, the mules, the young mares,";
dby[10] = "And he wrote in the name of king Ahasuerus, and sealed [it] with the king\'s ring, and sent letters by couriers on horseback riding on coursers, horses of blood reared in the breeding studs:";

hnv[10] = "He wrote the name of king Achashverosh, and sealed it with the king\'s ring, and sent letters by post on horseback, riding on swift steeds that were used in the king\'s service, bred of the stud:";
vul[10] = "ipsaeque epistulae quae ex regis nomine mittebantur anulo illius obsignatae sunt et missae per veredarios qui per omnes provincias discurrentes veteres litteras novis nuntiis praevenirent";
kjv[11] = "Wherein the king granted the Jews which [were] in every city to gather themselves together, and to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them, [both] little ones and women, and [to take] the spoil of them for a prey,";
rsv[11] = "By these the king allowed the Jews who were in every city to gather and defend their lives, to destroy, to slay, and to annihilate any armed force of any people or province that might attack them, with their children and women, and to plunder their goods,";
asv[11] = "wherein the king granted the Jews that were in every city to gather themselves together, and to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them, [their] little ones and women, and to take the spoil of them for a prey,";
yng[11] = "that the king hath given to the Jews who [are] in every city and city, to be assembled, and to stand for their life, to cut off, to slay, and to destroy the whole force of the people and province who are distressing them, infants and women, and their spoil to seize.";
dby[11] = "[stating] that the king granted the Jews that were in every city to gather themselves together, and to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that might assault them, [their] little ones and women, and to [take] the spoil of them for a prey,";
web[11] = "In which the king granted the Jews who [were] in every city to assemble, and to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them, [both] little ones and women, and [to take] the spoil of them for a prey,";
hnv[11] = " in which the king granted the Yehudim who were in every city to gather themselves together, and to stand for their life, to destroy, to kill, and to cause to perish, all the power of the people and province that would assault them, [their] little ones and women, and to take the spoil of them for a prey,";
vul[11] = "quibus imperavit rex ut convenirent Iudaeos per singulas civitates et in unum praeciperent congregari ut starent pro animabus suis et omnes inimicos suos cum coniugibus ac liberis et universis domibus interficerent atque delerent";
kjv[12] = "Upon one day in all the provinces of king Ahasuerus, [namely], upon the thirteenth [day] of the twelfth month, which [is] the month Adar.";
rsv[12] = "upon one day throughout all the provinces of King Ahasu-e\'rus, on the thirteenth day of the twelfth month, which is the month of Adar.";
asv[12] = "upon one day in all the provinces of king Ahasuerus, [namely], upon the thirteenth [day] of the twelfth month, which is the month Adar.";
yng[12] = "In one day, in all the provinces of the king Ahasuerus, on the thirteenth of the twelfth month -- it [is] the month of Adar --";
dby[12] = "upon one day in all the provinces of king Ahasuerus, upon the thirteenth of the twelfth month, that is, the month Adar.";
web[12] = "Upon one day in all the provinces of king Ahasuerus, [namely], upon the thirteenth [day] of the twelfth month, which [is] the month Adar,";
hnv[12] = "on one day in all the provinces of king Achashverosh, [namely], on the thirteenth [day] of the twelfth month, which is the month Adar.";
vul[12] = "et constituta est per omnes provincias una ultionis dies id est tertiadecima mensis duodecimi adar";
kjv[13] = "The copy of the writing for a commandment to be given in every province [was] published unto all people, and that the Jews should be ready against that day to avenge themselves on their enemies.";
rsv[13] = "A copy of what was written was to be issued as a decree in every province, and by proclamation to all peoples, and the Jews were to be ready on that day to avenge themselves upon their enemies.";
asv[13] = "A copy of the writing, that the decree should be given out in every province, was published unto all the peoples, and that the Jews should be ready against that day to avenge themselves on their enemies.";
yng[13] = "a copy of the writing to be made law in every province and province is revealed to all the peoples, and for the Jews being ready at this day to be avenged of their enemies.";
dby[13] = "That the decree might be given in every province, a copy of the writing was published to all the peoples, and that the Jews should be ready against that day to avenge themselves on their enemies.";
web[13] = "The copy of the writing for a commandment, to be given in every province [was] published to all people, and that the Jews should be ready against that day to avenge themselves on their enemies.";
hnv[13] = "A copy of the writing, that the decree should be given out in every province, was published to all the peoples, and that the Yehudim should be ready against that day to avenge themselves on their enemies.";
vul[13] = "summaque epistulae fuit ut in omnibus terris ac populis qui regis Asueri imperio subiacebant notum fieret paratos esse Iudaeos ad capiendam vindictam de hostibus suis";
kjv[14] = "[So] the posts that rode upon mules [and] camels went out, being hastened and pressed on by the king\'s commandment. And the decree was given at Shushan the palace.";
rsv[14] = "So the couriers, mounted on their swift horses that were used in the king\'s service, rode out in haste, urged by the king\'s command; and the decree was issued in Susa the capital.";
asv[14] = "So the posts that rode upon swift steeds that were used in the king\'s service went out, being hastened and pressed on by the king\'s commandment; and the decree was given out in Shushan the palace.";
yng[14] = "The runners, riding on the dromedary, [and] the mules, have gone out, hastened and pressed by the word of the king, and the law hath been given in Shushan the palace.";
dby[14] = "The couriers mounted on coursers [and] horses of blood went out, being hastened and pressed on by the king\'s commandment. And the decree was given at Shushan the fortress.";
web[14] = "[So] the posts that rode upon mules [and] camels went out, being hastened and pressed on by the king\'s commandment. And the decree was given at Shushan the palace.";
hnv[14] = "So the posts who rode on swift steeds that were used in the king\'s service went out, being hurried and pressed on by the king\'s mitzvah; and the decree was given out in Shushan the palace.";
vul[14] = "egressique sunt veredarii celeres nuntios perferentes et edictum regis pependit in Susis";

kjv[17] = "And in every province, and in every city, whithersoever the king\'s commandment and his decree came, the Jews had joy and gladness, a feast and a good day. And many of the people of the land became Jews; for the fear of the Jews fell upon them.";
rsv[17] = "And in every province and in every city, wherever the king\'s command and his edict came, there was gladness and joy among the Jews, a feast and a holiday. And many from the peoples of the country declared themselves Jews, for the fear of the Jews had fallen upon them.";
asv[17] = "And in every province, and in every city, whithersoever the king\'s commandment and his decree came, the Jews had gladness and joy, a feast and a good day. And many from among the peoples of the land became Jews; for the fear of the Jews was fallen upon them.";
yng[17] = "and in every province and province, and in every city and city, the place where the word of the king, even his law, is coming, gladness and joy [are] to the Jews, a banquet, and a good day; and many of the peoples of the land are becoming Jews, for a fear of the Jews hath fallen upon them.";
dby[17] = "And in every province, and in every city, wherever the king\'s commandment and his decree came, the Jews had joy and gladness, a feast and a good day. And many among the peoples of the land became Jews; for the fear of the Jews had fallen upon them.";
web[17] = "And in every province, and in every city, whithersoever the king\'s commandment and his decree came, the Jews had joy and gladness, a feast and a good day. And many of the people of the land became Jews; for the fear of the Jews fell upon them.";
hnv[17] = "In every province, and in every city, wherever the king\'s mitzvah and his decree came, the Yehudim had gladness and joy, a feast and a good day. Many from among the peoples of the land became Yehudim; for the fear of the Yehudim was fallen on them.";
vul[17] = "apud omnes populos urbes atque provincias quocumque regis iussa veniebant mira exultatio epulae atque convivia et festus dies in tantum ut plures alterius gentis et sectae eorum religioni et caerimoniis iungerentur grandis enim cunctos iudaici nominis terror invaserat";
