csb[1] = "That night sleep escaped the king, so he ordered the book recording daily events to be brought and read to the king.";
csb[2] = "They found the written report of how Mordecai had informed on Bigthana and Teresh, two of the king\'s eunuchs who guarded the entrance, when they planned to assassinate King Ahasuerus.";
csb[3] = "The king inquired, &quot;What honor and special recognition have been given to Mordecai for this act? &quot; The king\'s personal attendants replied, &quot;Nothing has been done for him.&quot;";
csb[4] = "The king asked, &quot;Who is in the court? &quot; Now Haman was just entering the outer court of the palace to ask the king to hang Mordecai on the gallows he had prepared for him.";
csb[5] = "The king\'s attendants answered him, &quot;Haman is there, standing in the court.&quot; &quot;Have him enter,&quot; the king ordered.";
csb[6] = "Haman entered, and the king asked him, &quot;What should be done for the man the king wants to honor? &quot; Haman thought to himself, &quot;Who is it the king would want to honor more than me? &quot;";
csb[7] = "Haman told the king, &quot;For the man the king wants to honor:";
csb[8] = "&quot;Have them bring a royal garment that the king himself has worn and a horse the king himself has ridden, which has a royal crown on its head.";
csb[9] = "&quot;Put the garment and the horse under the charge of one of the king\'s most noble officials. Have them clothe the man the king wants to honor, parade him on the horse through the city square, and proclaim before him, \'This is what is done for the man the king wants to honor.\' &quot;";
csb[10] = "The king told Haman, &quot;Hurry, and do just as you proposed. Take a garment and a horse for Mordecai the Jew, who is sitting at the King\'s Gate. Do not leave out anything you have suggested.&quot;";
csb[11] = "So Haman took the garment and the horse. He clothed Mordecai and paraded him through the city square, crying out before him, &quot;This is what is done for the man the king wants to honor.&quot;";
csb[12] = "Then Mordecai returned to the King\'s Gate, but Haman hurried off for home, mournful and with his head covered.";
csb[13] = "Haman told his wife Zeresh and all his friends everything that had happened. His advisers and his wife Zeresh said to him, &quot;Since Mordecai is Jewish, and you have begun to fall before him, you won\'t overcome him, because your downfall is certain.&quot;";
csb[14] = "While they were still speaking with him, the king\'s eunuchs arrived and rushed Haman to the banquet Esther had prepared.";
