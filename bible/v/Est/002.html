csb[1] = "Some time later, when King Ahasuerus\'s rage had cooled down, he remembered Vashti, what she had done, and what was decided against her.";
csb[2] = "The king\'s personal attendants suggested, &quot;Let a search be made for beautiful young virgins for the king.";
csb[3] = "&quot;Let the king appoint commissioners in each province of his kingdom, so that they may gather all the beautiful young virgins to the harem at the fortress of Susa. Put them under the supervision of Hegai, the king\'s eunuch, keeper of the women, and give them the required beauty treatments.";
csb[4] = "&quot;Then the young woman who pleases the king will become queen instead of Vashti.&quot; This suggestion pleased the king, and he did accordingly.";
csb[5] = "In the fortress of Susa, there was a Jewish man named Mordecai son of Jair, son of Shimei, son of Kish, a Benjaminite.";
csb[6] = "He had been taken into exile from Jerusalem with the other captives when King Nebuchadnezzar of Babylon took King Jeconiah of Judah into exile.";
csb[7] = "Mordecai was the legal guardian of his cousin Hadassah (that is, Esther), because she had no father or mother. The young woman had a beautiful figure and was extremely good-looking. When her father and mother died, Mordecai had adopted her as his own daughter.";
csb[8] = "When the king\'s command and edict became public knowledge and when many young women were gathered at the fortress of Susa under Hegai\'s supervision, Esther was taken to the palace, into the supervision of Hegai, keeper of the women.";
csb[9] = "The young woman pleased him and gained his favor so that he accelerated the process of the beauty treatments and the special diet that she received. He assigned seven hand-picked female servants to her from the palace and transferred her and her servants to the harem\'s best quarters.";
csb[10] = "Esther did not reveal her ethnicity or her family background, because Mordecai had ordered her not to make them known.";
csb[11] = "Every day Mordecai took a walk in front of the harem\'s courtyard to learn how Esther was doing and to see what was happening to her.";
csb[12] = "During the year before each young woman\'s turn to go to King Ahasuerus, the harem regulation required her to receive beauty treatments with oil of myrrh for six months and then with perfumes and cosmetics for another six months.";
csb[13] = "When the young woman would go to the king, she was given whatever she requested to take with her from the harem to the palace.";
csb[14] = "She would go in the evening, and in the morning she would return to a second harem under the supervision of the king\'s eunuch Shaashgaz, keeper of the concubines. She never went to the king again, unless he desired her and summoned her by name.";
csb[15] = "Esther was the daughter of Abihail, the uncle of Mordecai who had adopted her as his own daughter. When her turn came to go to the king, she did not ask for anything except what Hegai, the king\'s eunuch, keeper of the women, suggested. Esther gained favor in the eyes of everyone who saw her.";
csb[16] = "She was taken to King Ahasuerus in the palace in the tenth month, the month Tebeth, in the seventh year of his reign.";
csb[17] = "The king loved Esther more than all the other women. She won more favor and approval from him than did any of the other virgins. He placed the royal crown on her head and made her queen in place of Vashti.";
csb[18] = "The king held a great banquet for all his officials and staff. It was Esther\'s banquet. He freed his provinces from tax payments and gave gifts worthy of the king\'s bounty.";
csb[19] = "When the virgins were gathered a second time, Mordecai was sitting at the King\'s Gate.";
csb[20] = "(Esther had not revealed her family background or her ethnicity, as Mordecai had directed. She obeyed Mordecai\'s orders, as she always had while he raised her.)";
csb[21] = "During those days while Mordecai was sitting at the King\'s Gate, Bigthan and Teresh, two of the king\'s eunuchs who guarded the entrance, became infuriated and planned to assassinate King Ahasuerus.";
csb[22] = "When Mordecai learned of the plot, he reported it to Queen Esther, and she told the king on Mordecai\'s behalf.";
csb[23] = "When the report was investigated and verified, both men were hanged on the gallows. This event was recorded in the Historical Record in the king\'s presence.";

yng[3] = "and the king doth appoint inspectors in all provinces of his kingdom, and they gather every young woman -- virgin, of good appearance -- unto Shushan the palace, unto the house of the women, unto the hand of Hege eunuch of the king, keeper of the women, and to give their purifications,";

kjv[7] = "And he brought up Hadassah, that [is], Esther, his uncle\'s daughter: for she had neither father nor mother, and the maid [was] fair and beautiful; whom Mordecai, when her father and mother were dead, took for his own daughter.";
rsv[7] = "He had brought up Hadas\'sah, that is Esther, the daughter of his uncle, for she had neither father nor mother; the maiden was beautiful and lovely, and when her father and her mother died, Mor\'decai adopted her as his own daughter.";
asv[7] = "And he brought up Hadassah, that is, Esther, his uncle\'s daughter: for she had neither father nor mother, and the maiden was fair and beautiful; and when her father and mother were dead, Mordecai took her for his own daughter.";
yng[7] = "and he is supporting Hadassah -- she [is] Esther -- daughter of his uncle, for she hath neither father nor mother, and the young woman [is] of fair form, and of good appearance, and at the death of her father and her mother hath Mordecai taken her to him for a daughter.";
dby[7] = "And he brought up Hadassah, that is, Esther, his uncle\'s daughter; for she had neither father nor mother -- and the maiden was fair and beautiful -- and when her father and mother were dead, Mordecai took her for his own daughter.";

kjv[8] = "So it came to pass, when the king\'s commandment and his decree was heard, and when many maidens were gathered together unto Shushan the palace, to the custody of Hegai, that Esther was brought also unto the king\'s house, to the custody of Hegai, keeper of the women.";
rsv[8] = "So when the king\'s order and his edict were proclaimed, and when many maidens were gathered in Susa the capital in custody of Hegai, Esther also was taken into the king\'s palace and put in custody of Hegai who had charge of the women.";
asv[8] = "So it came to pass, when the king\'s commandment and his decree was heard, and when many maidens were gathered together unto Shushan the palace, to the custody of Hegai, that Esther was taken into the king\'s house, to the custody of Hegai, keeper of the women.";
yng[8] = "And it cometh to pass, in the word of the king, even his law, being heard, and in many young women being gathered unto Shushan the palace, unto the hand of Hegai, that Esther is taken unto the house of the king, unto the hand of Hegai, keeper of the women,";
dby[8] = "And it came to pass when the king\'s commandment and his decree was heard, and when many maidens were gathered together unto Shushan the fortress, unto the custody of Hegai, that Esther also was brought into the king\'s house, unto the custody of Hegai, keeper of the women.";
web[8] = "So it came to pass, when the king\'s commandment and his decree were heard, and when many maidens were assembled at Shushan the palace, to the custody of Hegai, that Esther was brought also to the king\'s house, to the custody of Hegai, keeper of the women.";
hnv[8] = "So it happened, when the king\'s mitzvah and his decree was heard, and when many maidens were gathered together to Shushan the palace, to the custody of Hegai, that Ester was taken into the king\'s house, to the custody of Hegai, keeper of the women.";
vul[8] = "cumque percrebuisset regis imperium et iuxta mandata illius multae virgines pulchrae adducerentur Susan et Aegaeo traderentur eunucho Hester quoque inter ceteras puellas ei tradita est ut servaretur in numero feminarum";
kjv[9] = "And the maiden pleased him, and she obtained kindness of him; and he speedily gave her her things for purification, with such things as belonged to her, and seven maidens, [which were] meet to be given her, out of the king\'s house: and he preferred her and her maids unto the best [place] of the house of the women.";
rsv[9] = "And the maiden pleased him and won his favor; and he quickly provided her with her ointments and her portion of food, and with seven chosen maids from the king\'s palace, and advanced her and her maids to the best place in the harem.";
asv[9] = "And the maiden pleased him, and she obtained kindness of him; and he speedily gave her her things for purification, with her portions, and the seven maidens who were meet to be given her out of the king\'s house: and he removed her and her maidens to the best place of the house of the women.";
yng[9] = "and the young woman is good in his eyes, and she receiveth kindness before him, and he hasteneth her purifications and her portions -- to give to her, and the seven young women who are provided -- to give to her, from the house of the king, and he changeth her and her young women to a good [place in] the house of the women.";
dby[9] = "And the maiden pleased him, and obtained favour before him; and he speedily gave her her things for purification, and her portions, and the seven maidens selected to be given her, out of the king\'s house; and he removed her and her maids to the best [place] of the house of the women.";
web[9] = "And the maiden pleased him, and she obtained kindness from him; and he speedily gave her her things for purification, with such things as belonged to her, and seven maidens [who were] meet to be given her, out of the king\'s house: and he preferred her and her maids to the best [place] of the house of the women.";
hnv[9] = "The maiden pleased him, and she obtained kindness of him; and he speedily gave her things for her purification, with her portions, and the seven maidens who were meet to be given her out of the king\'s house: and he removed her and her maidens to the best place of the house of the women.";

kjv[12] = "Now when every maid\'s turn was come to go in to king Ahasuerus, after that she had been twelve months, according to the manner of the women, (for so were the days of their purifications accomplished, [to wit], six months with oil of myrrh, and six months with sweet odours, and with [other] things for the purifying of the women;)";
rsv[12] = "Now when the turn came for each maiden to go in to King Ahasu-e\'rus, after being twelve months under the regulations for the women, since this was the regular period of their beautifying, six months with oil of myrrh and six months with spices and ointments for women--";
asv[12] = "Now when the turn of every maiden was come to go in to king Ahasuerus, after that it had been done to her according to the law for the women twelve months (for so were the days of their purifications accomplished, [to wit], six months with oil of myrrh, and six months with sweet odors and with the things for the purifying of the women),";
yng[12] = "And in the drawing nigh of the turn of each young woman to come in unto the king Ahasuerus, at the end of there being to her -- according to the law of the women -- twelve months, for so they fulfil the days of their purifications; six months with oil of myrrh, and six months with spices, and with the purifications of women,";
dby[12] = "And when every maiden\'s turn came to go in to king Ahasuerus after that she had been treated for twelve months, according to the manner of the women (for so were the days of their purification accomplished -- six months with oil of myrrh, and six months with spices, and with things for the purifying of the women,";
web[12] = "Now when every maid\'s turn had come to go in to king Ahasuerus, after that she had been twelve months, according to the manner of the women, (for so were the days of their purifications accomplished, [to wit], six months with oil of myrrh, and six months with sweet odors, and with [other] things for the purifying of the women;)";
hnv[12] = "Now when the turn of every maiden was come to go in to king Achashverosh, after it had been done to her as prescribed for the women twelve months (for so were the days of their purification accomplished, [to wit], six months with oil of myrrh, and six months with sweet odors and with the things for the purifying of the women),";
vul[12] = "cum autem venisset tempus singularum per ordinem puellarum ut intrarent ad regem expletis omnibus quae ad cultum muliebrem pertinebant mensis duodecimus vertebatur ita dumtaxat ut sex menses oleo unguerentur myrtino et aliis sex quibusdam pigmentis et aromatibus uterentur";
kjv[13] = "Then thus came [every] maiden unto the king; whatsoever she desired was given her to go with her out of the house of the women unto the king\'s house.";

yng[13] = "and with this the young woman hath come in unto the king, all that she saith is given to her, to go in with her, out of the house of the women, unto the house of the king;";
dby[13] = "and thus came the maiden in unto the king), whatever she desired was given her to go with her out of the house of the women to the king\'s house.";

kjv[14] = "In the evening she went, and on the morrow she returned into the second house of the women, to the custody of Shaashgaz, the king\'s chamberlain, which kept the concubines: she came in unto the king no more, except the king delighted in her, and that she were called by name.";
rsv[14] = "In the evening she went, and in the morning she came back to the second harem in custody of Sha-ash\'gaz the king\'s eunuch who was in charge of the concubines; she did not go in to the king again, unless the king delighted in her and she was summoned by name.";
asv[14] = "In the evening she went, and on the morrow she returned into the second house of the women, to the custody of Shaashgaz, the king\'s chamberlain, who kept the concubines: she came in unto the king no more, except the king delighted in her, and she were called by name.";
yng[14] = "in the evening she hath gone in, and in the morning she hath turned back unto the second house of the women, unto the hand of Shaashgaz eunuch of the king, keeper of the concubines; she cometh not in any more unto the king except the king hath delighted in her, and she hath been called by name.";
dby[14] = "In the evening she went, and on the morrow she returned into the second house of the women, unto the custody of Shaashgaz, the king\'s chamberlain, keeper of the concubines. She came in to the king no more, unless the king delighted in her, and she were called by name.";
web[14] = "In the evening she went, and on the morrow she returned into the second house of the women, to the custody of Shaashgaz, the king\'s chamberlain, who kept the concubines: she came in to the king no more, except that the king delighted in her, and she was called by name.";
hnv[14] = "In the evening she went, and on the next day she returned into the second house of the women, to the custody of Sha`ashgaz, the king\'s chamberlain, who kept the concubines: she came in to the king no more, except the king delighted in her, and she were called by name.";
vul[14] = "et quae intraverat vespere egrediebatur mane atque inde in secundas aedes deducebatur quae sub manu Sasagazi eunuchi erant qui concubinis regis praesidebat nec habebat potestatem ad regem ultra redeundi nisi voluisset rex et eam venire iussisset ex nomine";
kjv[15] = "Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, was come to go in unto the king, she required nothing but what Hegai the king\'s chamberlain, the keeper of the women, appointed. And Esther obtained favour in the sight of all them that looked upon her.";
rsv[15] = "When the turn came for Esther the daughter of Ab\'ihail the uncle of Mor\'decai, who had adopted her as his own daughter, to go in to the king, she asked for nothing except what Hegai the king\'s eunuch, who had charge of the women, advised. Now Esther found favor in the eyes of all who saw her.";
asv[15] = "Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, was come to go in unto the king, she required nothing but what Hegai the king\'s chamberlain, the keeper of the women, appointed. And Esther obtained favor in the sight of all them that looked upon her.";
yng[15] = "And in the drawing nigh of the turn of Esther -- daughter of Abihail, uncle of Mordecai, whom he had taken to him for a daughter -- to come in unto the king, she hath not sought a thing except that which Hegai eunuch of the king, keeper of the women, saith, and Esther is receiving grace in the eyes of all seeing her.";
dby[15] = "And when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, came to go in to the king, she required nothing but what Hegai the king\'s chamberlain, keeper of the women, appointed. And Esther obtained grace in the sight of all them that saw her.";
web[15] = "Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, had come to go in to the king, she required nothing but what Hegai the king\'s chamberlain, the keeper of the women, appointed. And Esther obtained favor in the sight of all them that looked upon her.";
hnv[15] = "Now when the turn of Ester, the daughter of Avichayil the uncle of Mordekhai, who had taken her for his daughter, was come to go in to the king, she required nothing but what Hegai the king\'s chamberlain, the keeper of the women, appointed. Ester obtained favor in the sight of all those who looked at her.";
vul[15] = "evoluto autem tempore per ordinem instabat dies quo Hester filia Abiahil fratris Mardochei quam sibi adoptaverat in filiam intrare deberet ad regem quae non quaesivit muliebrem cultum sed quaecumque voluit Aegaeus eunuchus custos virginum haec ei ad ornatum dedit erat enim formonsa valde et incredibili pulchritudine omnium oculis gratiosa et amabilis videbatur";
kjv[16] = "So Esther was taken unto king Ahasuerus into his house royal in the tenth month, which [is] the month Tebeth, in the seventh year of his reign.";
rsv[16] = "And when Esther was taken to King Ahasu-e\'rus into his royal palace in the tenth month, which is the month of Tebeth, in the seventh year of his reign,";
asv[16] = "So Esther was taken unto king Ahasuerus into his house royal in the tenth month, which is the month Tebeth, in the seventh year of his reign.";
yng[16] = "And Esther is taken unto the king Ahasuerus, unto his royal house, in the tenth month -- it [is] the month of Tebeth -- in the seventh year of his reign,";
dby[16] = "So Esther was taken to king Ahasuerus, into his royal house, in the tenth month, that is, the month Tebeth, in the seventh year of his reign.";
web[16] = "So Esther was taken to king Ahasuerus into his house royal in the tenth month, which [is] the month Tebeth, in the seventh year of his reign.";
hnv[16] = "So Ester was taken to king Achashverosh into his house royal in the tenth month, which is the month Tevet, in the seventh year of his reign.";
vul[16] = "ducta est itaque ad cubiculum regis Asueri mense decimo qui vocatur tebeth septimo anno regni eius";
kjv[17] = "And the king loved Esther above all the women, and she obtained grace and favour in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.";
rsv[17] = "the king loved Esther more than all the women, and she found grace and favor in his sight more than all the virgins, so that he set the royal crown on her head and made her queen instead of Vashti.";
asv[17] = "And the king loved Esther above all the women, and she obtained favor and kindness in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.";
yng[17] = "and the king loveth Esther above all the women, and she receiveth grace and kindness before him above all the virgins, and he setteth a royal crown on her head, and causeth her to reign instead of Vashti,";
dby[17] = "And the king loved Esther above all the women, and she obtained grace and favour in his sight more than all the virgins, and he set the royal crown upon her head, and made her queen instead of Vashti.";
web[17] = "And the king loved Esther above all the women, and she obtained grace and favor in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.";
hnv[17] = "The king loved Ester above all the women, and she obtained favor and kindness in his sight more than all the virgins; so that he set the royal crown on her head, and made her queen instead of Vashti.";
vul[17] = "et amavit eam rex plus quam omnes mulieres habuitque gratiam et misericordiam coram eo super omnes mulieres et posuit diadema regni in capite eius fecitque eam regnare in loco Vasthi";
kjv[18] = "Then the king made a great feast unto all his princes and his servants, [even] Esther\'s feast; and he made a release to the provinces, and gave gifts, according to the state of the king.";
rsv[18] = "Then the king gave a great banquet to all his princes and servants; it was Esther\'s banquet. He also granted a remission of taxes to the provinces, and gave gifts with royal liberality.";
asv[18] = "Then the king made a great feast unto all his princes and his servants, even Esther\'s feast; and he made a release to the provinces, and gave gifts, according to the bounty of the king.";
yng[18] = "and the king maketh a great banquet to all his heads and his servants -- the banquet of Esther -- and a release to the provinces hath made, and giveth gifts as a memorial of the king.";
dby[18] = "And the king made a great feast to all his princes and his servants, Esther\'s feast; and he made a release to the provinces, and gave presents according to the king\'s bounty.";
web[18] = "Then the king made a great feast to all his princes and his servants, [even] Esther\'s feast; and he made a release to the provinces, and gave gifts, according to the state of the king.";
hnv[18] = "Then the king made a great feast to all his princes and his servants, even Ester\'s feast; and he made a release to the provinces, and gave gifts, according to the bounty of the king.";
vul[18] = "et iussit convivium praeparari permagnificum cunctis principibus et servis suis pro coniunctione et nuptiis Hester et dedit requiem in universis provinciis ac dona largitus est iuxta magnificentiam principalem";
kjv[19] = "And when the virgins were gathered together the second time, then Mordecai sat in the king\'s gate.";
rsv[19] = "When the virgins were gathered together the second time, Mor\'decai was sitting at the king\'s gate.";
asv[19] = "And when the virgins were gathered together the second time, then Mordecai was sitting in the king\'s gate.";
yng[19] = "And in the virgins being gathered a second time, then Mordecai is sitting in the gate of the king;";
dby[19] = "And when the virgins were gathered together the second time, Mordecai sat in the king\'s gate.";
web[19] = "And when the virgins were assembled the second time, then Mordecai sat in the king\'s gate.";
hnv[19] = " When the virgins were gathered together the second time, then Mordekhai was sitting in the king\'s gate.";
vul[19] = "cumque et secundo quaererentur virgines et congregarentur Mardocheus manebat ad regis ianuam";
kjv[20] = "Esther had not [yet] shewed her kindred nor her people; as Mordecai had charged her: for Esther did the commandment of Mordecai, like as when she was brought up with him.";
rsv[20] = "Now Esther had not made known her kindred or her people, as Mor\'decai had charged her; for Esther obeyed Mor\'decai just as when she was brought up by him.";
asv[20] = "Esther had not yet made known her kindred nor her people; as Mordecai had charged her: for Esther did the commandment of Mordecai, like as when she was brought up with him.";
yng[20] = "Esther is not declaring her kindred and her people, as Mordecai hath laid a charge upon her, and the saying of Mordecai Esther is doing as when she was truly with him.";
dby[20] = "(Esther, as Mordecai had charged her, had not yet made known her birth nor her people; for Esther did what Mordecai told her, like as when she was brought up with him.)";
web[20] = "Esther had not [yet] showed her kindred, nor her people; as Mordecai had charged her: for Esther performed the commandment of Mordecai, as when she was brought up with him.";
hnv[20] = "Ester had not yet made known her relatives nor her people; as Mordekhai had charged her: for Ester did the mitzvah of Mordekhai, like as when she was brought up with him.";
vul[20] = "necdumque prodiderat Hester patriam et populum suum iuxta mandatum eius quicquid enim ille praecipiebat observabat Hester et ita cuncta faciebat ut eo tempore solita erat quo eam parvulam nutriebat";
kjv[21] = "In those days, while Mordecai sat in the king\'s gate, two of the king\'s chamberlains, Bigthan and Teresh, of those which kept the door, were wroth, and sought to lay hand on the king Ahasuerus.";
rsv[21] = "And in those days, as Mor\'decai was sitting at the king\'s gate, Bigthan and Teresh, two of the king\'s eunuchs, who guarded the threshold, became angry and sought to lay hands on King Ahasu-e\'rus.";
asv[21] = "In those days, while Mordecai was sitting in the king\'s gate, two of the king\'s chamberlains, Bigthan and Teresh, of those that kept the threshold, were wroth, and sought to lay hands on the king Ahasuerus.";
yng[21] = "In those days, when Mordecai is sitting in the gate of the king, hath Bigthan been wroth, and Teresh, (two of the eunuchs of the king, the keepers of the threshold,) and they seek to put forth a hand on king Ahasuerus,";
dby[21] = "In those days, while Mordecai sat in the king\'s gate, two of the king\'s chamberlains, Bigthan and Teresh, of those which kept the threshold, were wroth, and sought to lay hand on the king Ahasuerus.";
web[21] = "In those days, while Mordecai sat in the king\'s gate, two of the king\'s chamberlains, Bigthan and Teresh, of those who kept the door, were wroth, and sought to lay hand on the king Ahasuerus.";
hnv[21] = "In those days, while Mordekhai was sitting in the king\'s gate, two of the king\'s chamberlains, Bigthan and Teresh, of those who kept the threshold, were angry, and sought to lay hands on the king Achashverosh.";
vul[21] = "eo igitur tempore quo Mardocheus ad regis ianuam morabatur irati sunt Bagathan et Thares duo eunuchi regis qui ianitores erant et in primo palatii limine praesidebant volueruntque insurgere in regem et occidere eum";
kjv[22] = "And the thing was known to Mordecai, who told [it] unto Esther the queen; and Esther certified the king [thereof] in Mordecai\'s name.";
rsv[22] = "And this came to the knowledge of Mor\'decai, and he told it to Queen Esther, and Esther told the king in the name of Mor\'decai.";
asv[22] = "And the thing became known to Mordecai, who showed it unto Esther the queen; and Esther told the king [thereof] in Mordecai\'s name.";
yng[22] = "and the thing is known to Mordecai, and he declareth [it] to Esther the queen, and Esther speaketh to the king in the name of Mordecai,";
dby[22] = "And the thing became known to Mordecai, and he related it to Esther the queen, and Esther told it to the king in Mordecai\'s name.";
web[22] = "And the thing was known to Mordecai, who told [it] to Esther the queen; and Esther certified the king [of it] in Mordecai\'s name.";
hnv[22] = "The thing became known to Mordekhai, who shown it to Ester the queen; and Ester told the king [of it] in Mordekhai\'s name.";
vul[22] = "quod Mardocheum non latuit statimque nuntiavit reginae Hester et illa regi ex nomine Mardochei qui ad se rem detulerat";
kjv[23] = "And when inquisition was made of the matter, it was found out; therefore they were both hanged on a tree: and it was written in the book of the chronicles before the king.";
rsv[23] = "When the affair was investigated and found to be so, the men were both hanged on the gallows. And it was recorded in the Book of the Chronicles in the presence of the king.";
asv[23] = "And when inquisition was made of the matter, and it was found to be so, they were both hanged on a tree: and it was written in the book of the chronicles before the king.";
yng[23] = "and the thing is sought out, and found, and they are hanged both of them on a tree, and it is written in the book of the Chronicles before the king.";
dby[23] = "And the matter was investigated and found out; and they were both hanged on a tree. And it was written in the book of the chronicles before the king.";
web[23] = "And when inquisition was made of the matter, it was discovered; therefore they were both hanged on a tree: and it was written in the book of the chronicles before the king.";
hnv[23] = "When inquisition was made of the matter, and it was found to be so, they were both hanged on a tree: and it was written in the book of the chronicles before the king.";
vul[23] = "quaesitum est et inventum et adpensus uterque eorum in patibulo mandatumque historiis et annalibus traditum coram rege";
