csb[1] = "After all this took place, King Ahasuerus honored Haman, son of Hammedatha the Agagite. He promoted him in rank and gave him a higher position than all the other officials.";
csb[2] = "The entire royal staff at the King\'s Gate bowed down and paid homage to Haman, because the king had commanded this to be done for him. But Mordecai would not bow down or pay homage.";
csb[3] = "The members of the royal staff at the King\'s Gate asked Mordecai, &quot;Why are you disobeying the king\'s command? &quot;";
csb[4] = "When they had warned him day after day and he still would not listen to them, they told Haman in order to see if Mordecai\'s actions would be tolerated, since he had told them he was a Jew.";
csb[5] = "When Haman saw that Mordecai was not bowing down or paying him homage, he was filled with rage.";
csb[6] = "And when he learned of Mordecai\'s ethnic identity, it seemed repugnant to Haman to do away with Mordecai alone. He planned to destroy all of Mordecai\'s people, the Jews, throughout Ahasuerus\'s kingdom.";
csb[7] = "In the first month, the month of Nisan, in King Ahasuerus\'s twelfth year, the Pur -- that is, the lot -- was cast before Haman for each day in each month, and it fell on the twelfth month, the month Adar.";
csb[8] = "Then Haman informed King Ahasuerus, &quot;There is one ethnic group, scattered throughout the peoples in every province of your kingdom, keeping themselves separate. Their laws are different from everyone else\'s and they do not obey the king\'s laws. It is not in the king\'s best interest to tolerate them.";
csb[9] = "&quot;If the king approves, let an order be drawn up authorizing their destruction, and I will pay 375 tons of silver to the officials for deposit in the royal treasury.&quot;";
csb[10] = "The king removed his signet ring from his finger and gave it to Haman son of Hammedatha the Agagite, the enemy of the Jewish people.";
csb[11] = "Then the king told Haman, &quot;The money and people are given to you to do with as you see fit.&quot;";
csb[12] = "The royal scribes were summoned on the thirteenth day of the first month, and the order was written exactly as Haman commanded. It was intended for the royal satraps, the governors of each of the provinces, and the officials of each ethnic group and written for each province in its own script and to each ethnic group in its own language. It was written in the name of King Ahasuerus and sealed with the royal signet ring.";
csb[13] = "Letters were sent by couriers to each of the royal provinces telling the officials to destroy, kill, and annihilate all the Jewish people -- young and old, women and children -- and plunder their possessions on a single day, the thirteenth day of Adar, the twelfth month.";
csb[14] = "A copy of the text, issued as law throughout every province, was distributed to all the peoples so that they might get ready for that day.";
csb[15] = "The couriers left, spurred on by royal command, and the law was issued in the fortress of Susa. The king and Haman sat down to drink, while the city of Susa was in confusion.";

kjv[4] = "Now it came to pass, when they spake daily unto him, and he hearkened not unto them, that they told Haman, to see whether Mordecai\'s matters would stand: for he had told them that he [was] a Jew.";
rsv[4] = "And when they spoke to him day after day and he would not listen to them, they told Haman, in order to see whether Mor\'decai\'s words would avail; for he had told them that he was a Jew.";
asv[4] = "Now it came to pass, when they spake daily unto him, and he hearkened not unto them, that they told Haman, to see whether Mordecai\'s matters would stand: for he had told them that he was a Jew.";
yng[4] = "And it cometh to pass, in their speaking unto him, day by day, and he hath not hearkened unto them, that they declare [it] to Haman, to see whether the words of Mordecai do stand, for he hath declared to them that he [is] a Jew.";
dby[4] = "And it came to pass as they spoke daily to him, and he hearkened not to them, that they informed Haman, to see whether Mordecai\'s matters would stand; for he had told them that he was a Jew.";

kjv[6] = "And he thought scorn to lay hands on Mordecai alone; for they had shewed him the people of Mordecai: wherefore Haman sought to destroy all the Jews that [were] throughout the whole kingdom of Ahasuerus, [even] the people of Mordecai.";
rsv[6] = "But he disdained to lay hands on Mor\'decai alone. So, as they had made known to him the people of Mor\'decai, Haman sought to destroy all the Jews, the people of Mor\'decai, throughout the whole kingdom of Ahasu-e\'rus.";
asv[6] = "But he thought scorn to lay hands on Mordecai alone; for they had made known to him the people of Mordecai: wherefore Haman sought to destroy all the Jews that were throughout the whole kingdom of Ahasuerus, even the people of Mordecai.";
yng[6] = "and it is contemptible in his eyes to put forth a hand on Mordecai by himself, for they have declared to him the people of Mordecai, and Haman seeketh to destroy all the Jews who [are] in all the kingdom of Ahasuerus -- the people of Mordecai.";
dby[6] = "But he scorned to lay hands on Mordecai alone; for they had made known to him the people of Mordecai; therefore Haman sought to destroy all the Jews that were in all the kingdom of Ahasuerus -- the people of Mordecai.";
web[6] = "And he scorned to lay hands on Mordecai alone; for they had shown him the people of Mordecai: wherefore Haman sought to destroy all the Jews that [were] throughout the whole kingdom of Ahasuerus, [even] the people of Mordecai.";
hnv[6] = "But he scorned the thought of laying hands on Mordekhai alone; for they had made known to him the people of Mordekhai: therefore Haman sought to destroy all the Yehudim who were throughout the whole kingdom of Achashverosh, even the people of Mordekhai.";
vul[6] = "et pro nihilo duxit in unum Mardocheum mittere manus suas audierat enim quod esset gentis iudaeae magisque voluit omnem Iudaeorum qui erant in regno Asueri perdere nationem";
kjv[7] = "In the first month, that [is], the month Nisan, in the twelfth year of king Ahasuerus, they cast Pur, that [is], the lot, before Haman from day to day, and from month to month, [to] the twelfth [month], that [is], the month Adar.";
rsv[7] = "In the first month, which is the month of Nisan, in the twelfth year of King Ahasu-e\'rus, they cast Pur, that is the lot, before Haman day after day; and they cast it month after month till the twelfth month, which is the month of Adar.";
asv[7] = "In the first month, which is the month Nisan, in the twelfth year of king Ahasuerus, they cast Pur, that is, the lot, before Haman from day to day, and from month to month, [to] the twelfth [month], which is the month Adar.";
yng[7] = "In the first month -- it [is] the month of Nisan -- in the twelfth year of the king Ahasuerus, hath one caused to fall Pur (that [is] the lot) before Haman, from day to day, and from month to month, [to] the twelfth, it [is] the month of Adar.";
dby[7] = "In the first month, that is, the month Nisan, in the twelfth year of king Ahasuerus, they cast Pur, that is, the lot, before Haman for each day and for each month, to the twelfth [month], that is, the month Adar.";
web[7] = "In the first month, (that [is], the month Nisan,) in the twelfth year of king Ahasuerus, they cast Pur, that [is], the lot, before Haman from day to day, and from month to month, [to] the twelfth [month], that [is], the month Adar.";
hnv[7] = "In the first month, which is the month Nisan, in the twelfth year of king Achashverosh, they cast Pur, that is, the lot, before Haman from day to day, and from month to month, [to] the twelfth [month], which is the month Adar.";
vul[7] = "mense primo cuius vocabulum est nisan anno duodecimo regni Asueri missa est sors in urnam quae hebraice dicitur phur coram Aman quo die et quo mense gens Iudaeorum deberet interfici et exivit mensis duodecimus qui vocatur adar";
kjv[8] = "And Haman said unto king Ahasuerus, There is a certain people scattered abroad and dispersed among the people in all the provinces of thy kingdom; and their laws [are] diverse from all people; neither keep they the king\'s laws: therefore it [is] not for the king\'s profit to suffer them.";
rsv[8] = "Then Haman said to King Ahasu-e\'rus, &quot;There is a certain people scattered abroad and dispersed among the peoples in all the provinces of your kingdom; their laws are different from those of every other people, and they do not keep the king\'s laws, so that it is not for the king\'s profit to tolerate them.";
asv[8] = "And Haman said unto king Ahasuerus, There is a certain people scattered abroad and dispersed among the peoples in all the provinces of thy kingdom; and their laws are diverse from [those of] every people; neither keep they the king\'s laws: therefore it is not for the king\'s profit to suffer them.";
yng[8] = "And Haman saith to the king Ahasuerus, `There is one people scattered and separated among the peoples, in all provinces of thy kingdom, and their laws [are] diverse from all people, and the laws of the king they are not doing, and for the king it is not profitable to suffer them;";
dby[8] = "And Haman said to king Ahasuerus, There is a people scattered abroad and dispersed among the peoples in all the provinces of thy kingdom; and their laws are diverse from [those of] every people, and they keep not the king\'s laws; and it is not for the king\'s profit to suffer them.";
web[8] = "And Haman said to king Ahasuerus, There is a certain people scattered abroad and dispersed among the people in all the provinces of thy kingdom; and their laws [are] diverse from all people; neither keep they the king\'s laws: therefore it [is] not for the king\'s profit to suffer them.";
hnv[8] = "Haman said to king Achashverosh, There is a certain people scattered abroad and dispersed among the peoples in all the provinces of your kingdom; and their laws are diverse from [those of] every people; neither keep they the king\'s laws: therefore it is not for the king\'s profit to allow them.";
vul[8] = "dixitque Aman regi Asuero est populus per omnes provincias regni tui dispersus et a se mutuo separatus novis utens legibus et caerimoniis insuper et regis scita contemnens et optime nosti quod non expediat regno tuo ut insolescat per licentiam";

kjv[12] = "Then were the king\'s scribes called on the thirteenth day of the first month, and there was written according to all that Haman had commanded unto the king\'s lieutenants, and to the governors that [were] over every province, and to the rulers of every people of every province according to the writing thereof, and [to] every people after their language; in the name of king Ahasuerus was it written, and sealed with the king\'s ring.";
rsv[12] = "Then the king\'s secretaries were summoned on the thirteenth day of the first month, and an edict, according to all that Haman commanded, was written to the king\'s satraps and to the governors over all the provinces and to the princes of all the peoples, to every province in its own script and every people in its own language; it was written in the name of King Ahasu-e\'rus and sealed with the king\'s ring.";
asv[12] = "Then were the king\'s scribes called in the first month, on the thirteenth day thereof; and there was written according to all that Haman commanded unto the king\'s satraps, and to the governors that were over every province, and to the princes of every people, to every province according to the writing thereof, and to every people after their language; in the name of king Ahasuerus was it written, and it was sealed with the king\'s ring.";
yng[12] = "And scribes of the king are called, on the first month, on the thirteenth day of it, and it is written according to all that Haman hath commanded, unto lieutenants of the king, and unto the governors who [are] over province and province, and unto the heads of people and people, province and province, according to its writing, and people and people according to its tongue, in the name of the king Ahasuerus it hath been written and sealed with the signet of the king,";
dby[12] = "Then were the king\'s scribes called, in the first month, on the thirteenth day of the [month], and there was written according to all that Haman commanded unto the king\'s satraps, and to the governors over every province, and to the princes of every people; to every province according to the writing thereof, and to every people according to their language: in the name of king Ahasuerus was it written, and sealed with the king\'s ring.";
web[12] = "Then were the king\'s scribes called on the thirteenth day of the first month, and there was written according to all that Haman had commanded to the king\'s lieutenants, and to the governors that [were] over every province, and to the rulers of every people of every province, according to the writing of it, and [to] every people after their language; in the name of king Ahasuerus was it written, and sealed with the king\'s ring.";
hnv[12] = "Then were the king\'s Sofrim called in the first month, on the thirteenth day of it; and there was written according to all that Haman commanded to the king\'s satraps, and to the governors who were over every province, and to the princes of every people, to every province according to the writing of it, and to every people after their language; in the name of king Achashverosh was it written, and it was sealed with the king\'s ring.";
vul[12] = "vocatique sunt scribae regis mense primo nisan tertiadecima die eius et scriptum est ut iusserat Aman ad omnes satrapas regis et iudices provinciarum diversarumque gentium ut quaeque gens legere poterat et audire pro varietate linguarum ex nomine regis Asueri et litterae ipsius signatae anulo";
kjv[13] = "And the letters were sent by posts into all the king\'s provinces, to destroy, to kill, and to cause to perish, all Jews, both young and old, little children and women, in one day, [even] upon the thirteenth [day] of the twelfth month, which is the month Adar, and [to take] the spoil of them for a prey.";
rsv[13] = "Letters were sent by couriers to all the king\'s provinces, to destroy, to slay, and to annihilate all Jews, young and old, women and children, in one day, the thirteenth day of the twelfth month, which is the month of Adar, and to plunder their goods.";
asv[13] = "And letters were sent by posts into all the king\'s provinces, to destroy, to slay, and to cause to perish, all Jews, both young and old, little children and women, in one day, even upon the thirteenth [day] of the twelfth month, which is the month Adar, and to take the spoil of them for a prey.";
yng[13] = "and letters to be sent by the hand of the runners unto all provinces of the king, to cut off, to slay, and to destroy all the Jews, from young even unto old, infant and women, on one day, on the thirteenth of the twelfth month -- it [is] the month of Adar -- and their spoil to seize,";
dby[13] = "And the letters were sent by couriers into all the king\'s provinces, to destroy, to kill, and to cause to perish, all Jews, both young and old, little children and women, in one day, upon the thirteenth of the twelfth month, that is, the month Adar, and [to take] the spoil of them for a prey.";
web[13] = "And the letters were sent by posts into all the king\'s provinces, to destroy, to kill, and to cause to perish, all Jews, both young and old, little children and women, in one day, [even] upon the thirteenth [day] of the twelfth month, which [is] the month Adar, and [to take] the spoil of them for a prey.";
hnv[13] = "Letters were sent by posts into all the king\'s provinces, to destroy, to kill, and to cause to perish, all Yehudim, both young and old, little children and women, in one day, even on the thirteenth [day] of the twelfth month, which is the month Adar, and to take the spoil of them for a prey.";
vul[13] = "missae sunt per cursores regis ad universas provincias ut occiderent atque delerent omnes Iudaeos a puero usque ad senem parvulos et mulieres uno die hoc est tertiodecimo mensis duodecimi qui vocatur adar et bona eorum diriperent";
kjv[14] = "The copy of the writing for a commandment to be given in every province was published unto all people, that they should be ready against that day.";
rsv[14] = "A copy of the document was to be issued as a decree in every province by proclamation to all the peoples to be ready for that day.";
asv[14] = "A copy of the writing, that the decree should be given out in every province, was published unto all the peoples, that they should be ready against that day.";
yng[14] = "a copy of the writing to be made law in every province and province is revealed to all the peoples, to be ready for this day.";
dby[14] = "That the decree might be given in every province, a copy of the writing was published to all peoples, that they should be ready against that day.";
web[14] = "The copy of the writing for a commandment to be given in every province, was published to all people, that they should be ready against that day.";
hnv[14] = "A copy of the writing, that the decree should be given out in every province, was published to all the peoples, that they should be ready against that day.";
vul[14] = "summa autem epistularum haec fuit ut omnes provinciae scirent et pararent se ad praedictam diem";
kjv[15] = "The posts went out, being hastened by the king\'s commandment, and the decree was given in Shushan the palace. And the king and Haman sat down to drink; but the city Shushan was perplexed.";
rsv[15] = "The couriers went in haste by order of the king, and the decree was issued in Susa the capital. And the king and Haman sat down to drink; but the city of Susa was perplexed.";
