csb[1] = "Accept anyone who is weak in faith, but don\'t argue about disputed matters.";
csb[2] = "One person believes he may eat anything, while one who is weak eats only vegetables.";
csb[3] = "One who eats must not look down on one who does not eat, and one who does not eat must not judge one who does, because God has accepted him.";
csb[4] = "Who are you to judge another\'s household servant? Before his own Lord he stands or falls. And he will stand, because the Lord is able to make him stand.";
csb[5] = "One person judges one day to be more important than another day. Someone else judges every day to be the same. Let each one be fully convinced in his own mind.";
csb[6] = "Whoever observes the day, observes it for the honor of the Lord. Whoever eats, eats for the Lord, since he gives thanks to God; and whoever does not eat, it is for the Lord that he does not eat it, and he gives thanks to God.";
csb[7] = "For none of us lives for himself, and no one dies for himself.";
csb[8] = "If we live, we live for the Lord; and if we die, we die for the Lord. Therefore, whether we live or die, we belong to the Lord.";
csb[9] = "Christ died and returned to life for this: that he might be Lord over both the dead and the living.";
csb[10] = "But you, why do you judge your brother or sister? Or you, why do you despise your brother or sister? For we will all stand before the judgment seat of God.";
csb[11] = "For it is written, As I live, says the Lord, every knee will bow to me, and every tongue will give praise to God.";
csb[12] = "So then, each of us will give an account of himself to God.";
csb[13] = "Therefore, let us no longer judge one another. Instead decide never to put a stumbling block or pitfall in the way of your brother or sister.";
csb[14] = "I know and am persuaded in the Lord Jesus that nothing is unclean in itself. Still, to someone who considers a thing to be unclean, to that one it is unclean.";
csb[15] = "For if your brother or sister is hurt by what you eat, you are no longer walking according to love. Do not destroy, by what you eat, someone for whom Christ died.";
csb[16] = "Therefore, do not let your good be slandered,";
csb[17] = "for the kingdom of God is not eating and drinking, but righteousness, peace, and joy in the Holy Spirit.";
csb[18] = "Whoever serves Christ in this way is acceptable to God and receives human approval.";
csb[19] = "So then, let us pursue what promotes peace and what builds up one another.";
csb[20] = "Do not tear down God\'s work because of food. Everything is clean, but it is wrong to make someone fall by what he eats.";
csb[21] = "It is a good thing not to eat meat, or drink wine, or do anything that makes your brother or sister stumble.";
csb[22] = "Whatever you believe about these things, keep between yourself and God. Blessed is the one who does not condemn himself by what he approves.";
csb[23] = "But whoever doubts stands condemned if he eats, because his eating is not from faith, and everything that is not from faith is sin.";

kjv[3] = "Let not him that eateth despise him that eateth not; and let not him which eateth not judge him that eateth: for God hath received him.";
