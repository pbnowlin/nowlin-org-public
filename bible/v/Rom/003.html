csb[1] = "So what advantage does the Jew have? Or what is the benefit of circumcision?";
csb[2] = "Considerable in every way. First, they were entrusted with the very words of God.";
csb[3] = "What then? If some were unfaithful, will their unfaithfulness  ify God\'s faithfulness?";
csb[4] = "Absolutely not! Let God be true, even though everyone is a liar, as it is written: That you may be justified in your words and triumph when you judge.";
csb[5] = "But if our unrighteousness highlights God\'s righteousness, what are we to say? I am using a human argument: Is God unrighteous to inflict wrath?";
csb[6] = "Absolutely not! Otherwise, how will God judge the world?";
csb[7] = "But if by my lie God\'s truth abounds to his glory, why am I also still being judged as a sinner?";
csb[8] = "And why not say, just as some people slanderously claim we say, &quot;Let us do what is evil so that good may come&quot;? Their condemnation is deserved!";
csb[9] = "What then? Are we any better off? Not at all! For we have already charged that both Jews and Gentiles are all under sin,";
csb[10] = "as it is written: There is no one righteous, not even one.";
csb[11] = "There is no one who understands; there is no one who seeks God.";
csb[12] = "All have turned away; all alike have become worthless. There is no one who does what is good, not even one.";
csb[13] = "Their throat is an open grave; they deceive with their tongues. Vipers\' venom is under their lips.";
csb[14] = "Their mouth is full of cursing and bitterness.";
csb[15] = "Their feet are swift to shed blood;";
csb[16] = "ruin and wretchedness are in their paths,";
csb[17] = "and the path of peace they have not known.";
csb[18] = "There is no fear of God before their eyes.";
csb[19] = "Now we know that whatever the law says, it speaks to those who are subject to the law, so that every mouth may be shut and the whole world may become subject to God\'s judgment.";
csb[20] = "For no one will be justified in his sight by the works of the law, because the knowledge of sin comes through the law.";
csb[21] = "But now, apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets.";
csb[22] = "The righteousness of God is through faith in Jesus Christ to all who believe, since there is no distinction.";
csb[23] = "For all have sinned and fall short of the glory of God.";
csb[24] = "They are justified freely by his grace through the redemption that is in Christ Jesus.";
csb[25] = "God presented him as an atoning sacrifice in his blood, received through faith, to demonstrate his righteousness, because in his restraint God passed over the sins previously committed.";
csb[26] = "God presented him to demonstrate his righteousness at the present time, so that he would be righteous and declare righteous the one who has faith in Jesus.";
csb[27] = "Where, then, is boasting? It is excluded. By what kind of law? By one of works? No, on the contrary, by a law of faith.";
csb[28] = "For we conclude that a person is justified by faith apart from the works of the law.";
csb[29] = "Or is God the God of Jews only? Is he not the God of Gentiles too? Yes, of Gentiles too,";
csb[30] = "since there is one God who will justify the circumcised by faith and the uncircumcised through faith.";
csb[31] = "Do we then  ify the law through faith? Absolutely not! On the contrary, we uphold the law.";
kjv[1] = "What advantage then hath the Jew? or what profit [is there] of circumcision?";
kjv[2] = "Much every way: chiefly, because that unto them were committed the oracles of God.";

kjv[5] = "But if our unrighteousness commend the righteousness of God, what shall we say? [Is] God unrighteous who taketh vengeance? (I speak as a man)";

kjv[21] = "But now the righteousness of God without the law is manifested, being witnessed by the law and the prophets;";

yng[26] = "for the shewing forth of His righteousness in the present time, for His being righteous, and declaring him righteous who [is] of the faith of Jesus.";
dby[26] = "for [the] shewing forth of his righteousness in the present time, so that he should be just, and justify him that is of [the] faith of Jesus.";
web[26] = "To declare, [I say], at this time his righteousness: that he may be just, and the justifier of him who believeth in Jesus.";
hnv[26] = "to demonstrate his righteousness at this present time; that he might himself be just, and the justifier of him who has faith in Yeshua.";
vul[26] = "in sustentatione Dei ad ostensionem iustitiae eius in hoc tempore ut sit ipse iustus et iustificans eum qui ex fide est Iesu";
rsv[27] = "Then what becomes of our boasting? It is excluded. On what principle? On the principle of works? No, but on the principle of faith.";
asv[27] = "Where then is the glorying? It is excluded. By what manner of law? of works? Nay: but by a law of faith.";
yng[27] = "Where then [is] the boasting? it was excluded; by what law? of works? no, but by a law of faith:";
dby[27] = "Where then [is] boasting? It has been excluded. By what law? of works? Nay, but by law of faith;";
web[27] = "Where [is] boasting then? It is excluded. By what law? of works? No; but by the law of faith.";
hnv[27] = "Where then is the boasting? It is excluded. By what manner of law? Of works? No, but by a law of faith.";
vul[27] = "ubi est ergo gloriatio exclusa est per quam legem factorum non sed per legem fidei";
rsv[28] = "For we hold that a man is justified by faith apart from works of law.";
asv[28] = "We reckon therefore that a man is justified by faith apart from the works of the law.";
yng[28] = "therefore do we reckon a man to be declared righteous by faith, apart from works of law.";
dby[28] = "for we reckon that a man is justified by faith, without works of law.";
web[28] = "Therefore we conclude, that a man is justified by faith without the deeds of the law.";
hnv[28] = "We maintain therefore that a man is justified by faith apart from the works of the law.";
vul[28] = "arbitramur enim iustificari hominem per fidem sine operibus legis";
rsv[29] = "Or is God the God of Jews only? Is he not the God of Gentiles also? Yes, of Gentiles also,";
asv[29] = "Or is God [the God] of Jews only? is he not [the God] of Gentiles also? Yea, of Gentiles also:";
yng[29] = "The God of Jews only [is He], and not also of nations?";
dby[29] = "Is [God] the God of Jews only? is he not of [the] nations also? Yea, of nations also:";
web[29] = "[Is he] the God of the Jews only? [is he] not also of the Gentiles? Yes, of the Gentiles also:";
hnv[29] = "Or is God the God of Yehudim only? Isn\'t he the God of Goyim also? Yes, of Goyim also,";
vul[29] = "an Iudaeorum Deus tantum nonne et gentium immo et gentium";
rsv[30] = "since God is one; and he will justify the circumcised on the ground of their faith and the uncircumcised through their faith.";
asv[30] = "if so be that God is one, and he shall justify the circumcision by faith, and the uncircumcision through faith.";
yng[30] = "yes, also of nations; since one [is] God who shall declare righteous the circumcision by faith, and the uncircumcision through the faith.";
dby[30] = "since indeed [it is] one God who shall justify [the] circumcision on the principle of faith, and uncircumcision by faith.";
web[30] = "Seeing [it is] one God who will justify the circumcision by faith, and uncircumcision through faith.";
hnv[30] = "since indeed there is one God who will justify the circumcised by faith, and the uncircumcised through faith.";
vul[30] = "quoniam quidem unus Deus qui iustificabit circumcisionem ex fide et praeputium per fidem";
rsv[31] = "Do we then overthrow the law by this faith? By no means! On the contrary, we uphold the law.";
asv[31] = "Do we then make the law of none effect through faith? God forbid: nay, we establish the law.";
yng[31] = "Law then do we make useless through the faith? let it not be! yea, we do establish law.";
dby[31] = "Do we then make void law by faith? Far be the thought: [no,] but we establish law.";
web[31] = "Do we then make void the law through faith? By no means: but we establish the law.";
hnv[31] = "Do we then nullify the law through faith? May it never be! No, we establish the law.";
vul[31] = "legem ergo destruimus per fidem absit sed legem statuimus";
