csb[1] = "I ask, then, has God rejected his people? Absolutely not! For I too am an Israelite, a descendant of Abraham, from the tribe of Benjamin.";
csb[2] = "God has not rejected his people whom he foreknew. Or don\'t you know what the Scripture says in the passage about Elijah -- how he pleads with God against Israel?";
csb[3] = "Lord, they have killed your prophets and torn down your altars. I am the only one left, and they are trying to take my life!";
csb[4] = "But what was God\'s answer to him? I have left seven thousand for myself who have not bowed down to Baal.";
csb[5] = "In the same way, then, there is also at the present time a remnant chosen by grace.";
csb[6] = "Now if by grace, then it is not by works; otherwise grace ceases to be grace.";
csb[7] = "What then? Israel did not find what it was looking for, but the elect did find it. The rest were hardened,";
csb[8] = "as it is written, God gave them a spirit of stupor, eyes that cannot see and ears that cannot hear, to this day.";
csb[9] = "And David says, Let their table become a snare and a trap, a pitfall and a retribution to them.";
csb[10] = "Let their eyes be darkened so that they cannot see, and their backs be bent continually.";
csb[11] = "I ask, then, have they stumbled so as to fall? Absolutely not! On the contrary, by their transgression, salvation has come to the Gentiles to make Israel jealous.";
csb[12] = "Now if their transgression brings riches for the world, and their failure riches for the Gentiles, how much more will their fullness bring!";
csb[13] = "Now I am speaking to you Gentiles. Insofar as I am an apostle to the Gentiles, I magnify my ministry,";
csb[14] = "if I might somehow make my own people jealous and save some of them.";
csb[15] = "For if their rejection brings reconciliation to the world, what will their acceptance mean but life from the dead?";
csb[16] = "Now if the firstfruits are holy, so is the whole batch. And if the root is holy, so are the branches.";
csb[17] = "Now if some of the branches were broken off, and you, though a wild olive branch, were grafted in among them and have come to share in the rich root of the cultivated olive tree,";
csb[18] = "do not boast that you are better than those branches. But if you do boast -- you do not sustain the root, but the root sustains you.";
csb[19] = "Then you will say, &quot;Branches were broken off so that I might be grafted in.&quot;";
csb[20] = "True enough; they were broken off because of unbelief, but you stand by faith. Do not be arrogant, but beware,";
csb[21] = "because if God did not spare the natural branches, he will not spare you either.";
csb[22] = "Therefore, consider God\'s kindness and severity: severity toward those who have fallen but God\'s kindness toward you -- if you remain in his kindness. Otherwise you too will be cut off.";
csb[23] = "And even they, if they do not remain in unbelief, will be grafted in, because God has the power to graft them in again.";
csb[24] = "For if you were cut off from your native wild olive tree and against nature were grafted into a cultivated olive tree, how much more will these -- the natural branches -- be grafted into their own olive tree?";
csb[25] = "I don\'t want you to be ignorant of this mystery, brothers and sisters, so that you will not be conceited: A partial hardening has come upon Israel until the fullness of the Gentiles has come in.";
csb[26] = "And in this way all Israel will be saved, as it is written, The Deliverer will come from Zion; he will turn godlessness away from Jacob.";
csb[27] = "And this will be my covenant with them when I take away their sins.";
csb[28] = "Regarding the gospel, they are enemies for your advantage, but regarding election, they are loved because of the patriarchs,";
csb[29] = "since God\'s gracious gifts and calling are irrevocable.";
csb[30] = "As you once disobeyed God but now have received mercy through their disobedience,";
csb[31] = "so they too have now disobeyed, resulting in mercy to you, so that they also may now receive mercy.";
csb[32] = "For God has imprisoned all in disobedience so that he may have mercy on all.";
csb[33] = "Oh, the depth of the riches both of the wisdom and of the knowledge of God! How unsearchable his judgments and untraceable his ways!";
csb[34] = "For who has known the mind of the Lord? Or who has been his counselor?";
csb[35] = "And who has ever given to God, that he should be repaid?";
csb[36] = "For from him and through him and to him are all things. To him be the glory forever. Amen.";

kjv[22] = "Behold therefore the goodness and severity of God: on them which fell, severity; but toward thee, goodness, if thou continue in [his] goodness: otherwise thou also shalt be cut off.";
rsv[22] = "Note then the kindness and the severity of God: severity toward those who have fallen, but God\'s kindness to you, provided you continue in his kindness; otherwise you too will be cut off.";
asv[22] = "Behold then the goodness and severity of God: toward them that fell, severity; but toward thee, God\'s goodness, if thou continue in his goodness: otherwise thou also shalt be cut off.";
yng[22] = "Lo, then, goodness and severity of God -- upon those indeed who fell, severity; and upon thee, goodness, if thou mayest remain in the goodness, otherwise, thou also shalt be cut off.";
dby[22] = "Behold then [the] goodness and severity of God: upon them who have fallen, severity; upon thee goodness of God, if thou shalt abide in goodness, since [otherwise] *thou* also wilt be cut away.";
web[22] = "Behold therefore the goodness and severity of God: on them who fell, severity; but towards thee, goodness, if thou shalt continue in [his] goodness: otherwise thou also shalt be cut off.";
hnv[22] = "See then the goodness and severity of God. Toward those who fell, severity; but toward you, goodness, if you continue in his goodness; otherwise you also will be cut off.";
vul[22] = "vide ergo bonitatem et severitatem Dei in eos quidem qui ceciderunt severitatem in te autem bonitatem Dei si permanseris in bonitate alioquin et tu excideris";
kjv[23] = "And they also, if they abide not still in unbelief, shall be graffed in: for God is able to graff them in again.";
rsv[23] = "And even the others, if they do not persist in their unbelief, will be grafted in, for God has the power to graft them in again.";
asv[23] = "And they also, if they continue not in their unbelief, shall be grafted in: for God is able to graft them in again.";
yng[23] = "And those also, if they may not remain in unbelief, shall be graffed in, for God is able again to graff them in;";
dby[23] = "And *they* too, if they abide not in unbelief, shall be grafted in; for God is able again to graft them in.";
web[23] = "And they also, if they abide not still in unbelief, shall be ingrafted: for God is able to ingraft them again.";
hnv[23] = "They also, if they don\'t continue in their unbelief, will be grafted in, for God is able to graft them in again.";
vul[23] = "sed et illi si non permanserint in incredulitate inserentur potens est enim Deus iterum inserere illos";
kjv[24] = "For if thou wert cut out of the olive tree which is wild by nature, and wert graffed contrary to nature into a good olive tree: how much more shall these, which be the natural [branches], be graffed into their own olive tree?";
rsv[24] = "For if you have been cut from what is by nature a wild olive tree, and grafted, contrary to nature, into a cultivated olive tree, how much more will these natural branches be grafted back into their own olive tree.";
asv[24] = "For if thou wast cut out of that which is by nature a wild olive tree, and wast grafted contrary to nature into a good olive tree; how much more shall these, which are the natural [branches], be grafted into their own olive tree?";
yng[24] = "for if thou, out of the olive tree, wild by nature, wast cut out, and, contrary to nature, wast graffed into a good olive tree, how much rather shall they, who [are] according to nature, be graffed into their own olive tree?";
dby[24] = "For if *thou* hast been cut out of the olive tree wild by nature, and, contrary to nature, hast been grafted into the good olive tree, how much rather shall they, who are according to nature be grafted into their own olive tree?";
web[24] = "For if thou wast cut out of the olive-tree which is wild by nature, and wast ingrafted contrary to nature into a good olive-tree; how much more shall these, which are the natural [branches], be grafted into their own olive-tree?";
hnv[24] = "For if you were cut out of that which is by nature a wild olive tree, and were grafted contrary to nature into a good olive tree, how much more will these, which are the natural branches, be grafted into their own olive tree?";
vul[24] = "nam si tu ex naturali excisus es oleastro et contra naturam insertus es in bonam olivam quanto magis hii secundum naturam inserentur suae olivae";
kjv[25] = "For I would not, brethren, that ye should be ignorant of this mystery, lest ye should be wise in your own conceits; that blindness in part is happened to Israel, until the fulness of the Gentiles be come in.";
rsv[25] = "Lest you be wise in your own conceits, I want you to understand this mystery, brethren: a hardening has come upon part of Israel, until the full number of the Gentiles come in,";
asv[25] = "For I would not, brethren, have you ignorant of this mystery, lest ye be wise in your own conceits, that a hardening in part hath befallen Israel, until the fulness of the Gentiles be come in;";
yng[25] = "For I do not wish you to be ignorant, brethren, of this secret -- that ye may not be wise in your own conceits -- that hardness in part to Israel hath happened till the fulness of the nations may come in;";
dby[25] = "For I do not wish you to be ignorant, brethren, of this mystery, that ye may not be wise in your own conceits, that blindness in part is happened to Israel, until the fulness of the nations be come in;";
web[25] = "For I would not, brethren, that ye should be ignorant of this mystery, (lest ye should be wise in your own conceits) that blindness in part hath happened to Israel, until the fullness of the Gentiles shall be come in.";
hnv[25] = "For I don\'t desire, brothers, to have you ignorant of this mystery, so that you won\'t be wise in your own conceits, that a partial hardening has happened to Yisra\'el, until the fullness of the Goyim has come in,";
vul[25] = "nolo enim vos ignorare fratres mysterium hoc ut non sitis vobis ipsis sapientes quia caecitas ex parte contigit in Israhel donec plenitudo gentium intraret";
kjv[26] = "And so all Israel shall be saved: as it is written, There shall come out of Sion the Deliverer, and shall turn away ungodliness from Jacob:";
rsv[26] = "and so all Israel will be saved; as it is written, &quot;The Deliverer will come from Zion, he will banish ungodliness from Jacob&quot;;";
asv[26] = "and so all Israel shall be saved: even as it is written, There shall come out of Zion the Deliverer; He shall turn away ungodliness from Jacob: ";
yng[26] = "and so all Israel shall be saved, according as it hath been written, `There shall come forth out of Sion he who is delivering, and he shall turn away impiety from Jacob,";
dby[26] = "and so all Israel shall be saved. According as it is written, The deliverer shall come out of Zion; he shall turn away ungodliness from Jacob.";
web[26] = "And so all Israel shall be saved: as it is written, There shall come out of Sion the Deliverer, and shall turn away ungodliness from Jacob:";
hnv[26] = "and so all Yisra\'el will be saved. Even as it is written, &quot;There will come out of Tziyon the Deliverer, And he will turn away ungodliness from Ya`akov.";
vul[26] = "et sic omnis Israhel salvus fieret sicut scriptum est veniet ex Sion qui eripiat avertet impietates ab Iacob";
kjv[27] = "For this [is] my covenant unto them, when I shall take away their sins.";
rsv[27] = "&quot;and this will be my covenant with them when I take away their sins.&quot;";
asv[27] = "And this is my covenant unto them, When I shall take away their sins. ";
yng[27] = "and this to them [is] the covenant from Me, when I may take away their sins.\'";
dby[27] = "And this is the covenant from me to them, when I shall have taken away their sins.";
web[27] = "For this [is] my covenant to them, when I shall take away their sins.";
hnv[27] = "This is my covenant to them, When I will take away their sins.&quot;";
vul[27] = "et hoc illis a me testamentum cum abstulero peccata eorum";
kjv[28] = "As concerning the gospel, [they are] enemies for your sakes: but as touching the election, [they are] beloved for the fathers\' sakes.";
rsv[28] = "As regards the gospel they are enemies of God, for your sake; but as regards election they are beloved for the sake of their forefathers.";
asv[28] = "As touching the gospel, they are enemies for your sake: but as touching the election, they are beloved for the fathers\' sake.";
yng[28] = "As regards, indeed, the good tidings, [they are] enemies on your account; and as regards the choice -- beloved on account of the fathers;";
dby[28] = "As regards the glad tidings, [they are] enemies on your account; but as regards election, beloved on account of the fathers.";
web[28] = "As concerning the gospel, [they are] enemies for your sakes: but as concerning the election, [they are] beloved for the father\'s sakes.";
hnv[28] = "Concerning the Good News, they are enemies for your sake. But concerning the election, they are beloved for the fathers\' sake.";
vul[28] = "secundum evangelium quidem inimici propter vos secundum electionem autem carissimi propter patres";
kjv[29] = "For the gifts and calling of God [are] without repentance.";
rsv[29] = "For the gifts and the call of God are irrevocable.";
asv[29] = "For the gifts and the calling of God are not repented of.";
yng[29] = "for unrepented of [are] the gifts and the calling of God;";
dby[29] = "For the gifts and the calling of God [are] not subject to repentance.";
web[29] = "For the gifts and calling of God [are] without repentance.";
hnv[29] = "For the gifts and the calling of God are irrevocable.";

kjv[30] = "For as ye in times past have not believed God, yet have now obtained mercy through their unbelief:";
rsv[30] = "Just as you were once disobedient to God but now have received mercy because of their disobedience,";
asv[30] = "For as ye in time past were disobedient to God, but now have obtained mercy by their disobedience,";
yng[30] = "for as ye also once did not believe in God, and now did find kindness by the unbelief of these:";
dby[30] = "For as indeed *ye* [also] once have not believed in God, but now have been objects of mercy through the unbelief of *these*;";
web[30] = "For as ye in times past have not believed God, yet have now obtained mercy through their unbelief;";
hnv[30] = " For as you in time past were disobedient to God, but now have obtained mercy by their disobedience,";
vul[30] = "sicut enim aliquando et vos non credidistis Deo nunc autem misericordiam consecuti estis propter illorum incredulitatem";
kjv[31] = "Even so have these also now not believed, that through your mercy they also may obtain mercy.";
rsv[31] = "so they have now been disobedient in order that by the mercy shown to you they also may receive mercy.";
asv[31] = "even so have these also now been disobedient, that by the mercy shown to you they also may now obtain mercy.";
yng[31] = "so also these now did not believe, that in your kindness they also may find kindness;";
dby[31] = "so these also have now not believed in your mercy, in order that *they* also may be objects of mercy.";
web[31] = "Even so have these also now not believed, that through your mercy they also may obtain mercy.";
hnv[31] = "even so these also have now been disobedient, that by the mercy shown to you they may also obtain mercy.";

kjv[32] = "For God hath concluded them all in unbelief, that he might have mercy upon all.";
rsv[32] = "For God has consigned all men to disobedience, that he may have mercy upon all.";
asv[32] = "For God hath shut up all unto disobedience, that he might have mercy upon all.";
yng[32] = "for God did shut up together the whole to unbelief, that to the whole He might do kindness.";
dby[32] = "For God hath shut up together all in unbelief, in order that he might shew mercy to all.";
web[32] = "For God hath concluded them all in unbelief, that he might have mercy upon all.";
hnv[32] = "For God has shut up all to disobedience, that he might have mercy on all.";
vul[32] = "conclusit enim Deus omnia in incredulitatem ut omnium misereatur";

yng[33] = "O depth of riches, and wisdom and knowledge of God! how unsearchable His judgments, and untraceable His ways!";
dby[33] = "O depth of riches both of [the] wisdom and knowledge of God! how unsearchable his judgments, and untraceable his ways!";

hnv[33] = "Oh the depth of the riches both of the wisdom and the knowledge of God! How unsearchable are his judgments, and his ways past tracing out!";
