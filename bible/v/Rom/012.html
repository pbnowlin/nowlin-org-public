csb[1] = "Therefore, brothers and sisters, in view of the mercies of God, I urge you to present your bodies as a living sacrifice, holy and pleasing to God; this is your true worship.";
csb[2] = "Do not be conformed to this age, but be transformed by the renewing of your mind, so that you may discern what is the good, pleasing, and perfect will of God.";
csb[3] = "For by the grace given to me, I tell everyone among you not to think of himself more highly than he should think. Instead, think sensibly, as God has distributed a measure of faith to each one.";
csb[4] = "Now as we have many parts in one body, and all the parts do not have the same function,";
csb[5] = "in the same way we who are many are one body in Christ and individually members of one another.";
csb[6] = "According to the grace given to us, we have different gifts: If prophecy, use it according to the proportion of one\'s faith;";
csb[7] = "if service, use it in service; if teaching, in teaching;";
csb[8] = "if exhorting, in exhortation; giving, with generosity; leading, with diligence; showing mercy, with cheerfulness.";
csb[9] = "Let love be without hypocrisy. Detest evil; cling to what is good.";
csb[10] = "Love one another deeply as brothers and sisters. Outdo one another in showing honor.";
csb[11] = "Do not lack diligence in zeal; be fervent in the Spirit; serve the Lord.";
csb[12] = "Rejoice in hope; be patient in affliction; be persistent in prayer.";
csb[13] = "Share with the saints in their needs; pursue hospitality.";
csb[14] = "Bless those who persecute you; bless and do not curse.";
csb[15] = "Rejoice with those who rejoice; weep with those who weep.";
csb[16] = "Live in harmony with one another. Do not be proud; instead, associate with the humble. Do not be wise in your own estimation.";
csb[17] = "Do not repay anyone evil for evil. Give careful thought to do what is honorable in everyone\'s eyes.";
csb[18] = "If possible, as far as it depends on you, live at peace with everyone.";
csb[19] = "Friends, do not avenge yourselves; instead, leave room for God\'s wrath, because it is written, Vengeance belongs to me; I will repay, says the Lord.";
csb[20] = "But If your enemy is hungry, feed him. If he is thirsty, give him something to drink. For in so doing you will be heaping fiery coals on his head.";
csb[21] = "Do not be conquered by evil, but conquer evil with good.";
kjv[1] = "I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, [which is] your reasonable service.";

yng[1] = "I call upon you, therefore, brethren, through the compassions of God, to present your bodies a sacrifice -- living, sanctified, acceptable to God -- your intelligent service;";
dby[1] = "I beseech you therefore, brethren, by the compassions of God, to present your bodies a living sacrifice, holy, acceptable to God, [which is] your intelligent service.";

vul[1] = "obsecro itaque vos fratres per misericordiam Dei ut exhibeatis corpora vestra hostiam viventem sanctam Deo placentem rationabile obsequium vestrum";
kjv[2] = "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what [is] that good, and acceptable, and perfect, will of God.";
rsv[2] = "Do not be conformed to this world but be transformed by the renewal of your mind, that you may prove what is the will of God, what is good and acceptable and perfect.";

yng[2] = "and be not conformed to this age, but be transformed by the renewing of your mind, for your proving what [is] the will of God -- the good, and acceptable, and perfect.";
dby[2] = "And be not conformed to this world, but be transformed by the renewing of [your] mind, that ye may prove what [is] the good and acceptable and perfect will of God.";

hnv[2] = "Don\'t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good and acceptable and perfect will of God.";

kjv[3] = "For I say, through the grace given unto me, to every man that is among you, not to think [of himself] more highly than he ought to think; but to think soberly, according as God hath dealt to every man the measure of faith.";
rsv[3] = "For by the grace given to me I bid every one among you not to think of himself more highly than he ought to think, but to think with sober judgment, each according to the measure of faith which God has assigned him.";
asv[3] = "For I say, through the grace that was given me, to every man that is among you, not to think of himself more highly than he ought to think; but so to think as to think soberly, according as God hath dealt to each man a measure of faith.";
yng[3] = "For I say, through the grace that was given to me, to every one who is among you, not to think above what it behoveth to think; but to think so as to think wisely, as to each God did deal a measure of faith,";
dby[3] = "For I say, through the grace which has been given to me, to every one that is among you, not to have high thoughts above what he should think; but to think so as to be wise, as God has dealt to each a measure of faith.";
web[3] = "For through the grace given to me, I say, to every man that is among you, not to think [of himself] more highly than he ought to think; but to think soberly, according as God hath dealt to every man the measure of faith.";
hnv[3] = "For I say, through the grace that was given me, to every man who is among you, not to think of himself more highly than he ought to think; but to think reasonably, as God has apportioned to each person a measure of faith.";
vul[3] = "dico enim per gratiam quae data est mihi omnibus qui sunt inter vos non plus sapere quam oportet sapere sed sapere ad sobrietatem unicuique sicut Deus divisit mensuram fidei";
