csb[1] = "Brothers and sisters, my heart\'s desire and prayer to God concerning them is for their salvation.";
csb[2] = "I can testify about them that they have zeal for God, but not according to knowledge.";
csb[3] = "Since they are ignorant of the righteousness of God and attempted to establish their own righteousness, they have not submitted to God\'s righteousness.";
csb[4] = "For Christ is the end of the law for righteousness to everyone who believes,";
csb[5] = "since Moses writes about the righteousness that is from the law: The one who does these things will live by them.";
csb[6] = "But the righteousness that comes from faith speaks like this: Do not say in your heart, &quot;Who will go up to heaven? &quot; that is, to bring Christ down";
csb[7] = "or, &quot;Who will go down into the abyss? &quot; that is, to bring Christ up from the dead.";
csb[8] = "On the contrary, what does it say? The message is near you, in your mouth and in your heart. This is the message of faith that we proclaim:";
csb[9] = "If you confess with your mouth, &quot;Jesus is Lord,&quot; and believe in your heart that God raised him from the dead, you will be saved.";
csb[10] = "One believes with the heart, resulting in righteousness, and one confesses with the mouth, resulting in salvation.";
csb[11] = "For the Scripture says, Everyone who believes on him will not be put to shame,";
csb[12] = "since there is no distinction between Jew and Greek, because the same Lord of all richly blesses all who call on him.";
csb[13] = "For everyone who calls on the name of the Lord will be saved.";
csb[14] = "How, then, can they call on him they have not believed in? And how can they believe without hearing about him? And how can they hear without a preacher?";
csb[15] = "And how can they preach unless they are sent? As it is written: How beautiful are the feet of those who bring good news.";
csb[16] = "But not all obeyed the gospel. For Isaiah says, Lord, who has believed our message?";
csb[17] = "So faith comes from what is heard, and what is heard comes through the message about Christ.";
csb[18] = "But I ask, &quot;Did they not hear? &quot; Yes, they did: Their voice has gone out to the whole earth, and their words to the ends of the world.";
csb[19] = "But I ask, &quot;Did Israel not understand? &quot; First, Moses said, I will make you jealous of those who are not a nation; I will make you angry by a nation that lacks understanding.";
csb[20] = "And Isaiah says boldly, I was found by those who were not looking for me; I revealed myself to those who were not asking for me.";
csb[21] = "But to Israel he says, All day long I have held out my hands to a disobedient and defiant people.";
