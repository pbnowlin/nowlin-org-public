csb[1] = "Now we who are strong have an obligation to bear the weaknesses of those without strength, and not to please ourselves.";
csb[2] = "Each one of us is to please his neighbor for his good, to build him up.";
csb[3] = "For even Christ did not please himself. On the contrary, as it is written, The insults of those who insult you have fallen on me.";
csb[4] = "For whatever was written in the past was written for our instruction, so that we may have hope through endurance and through the encouragement from the Scriptures.";
csb[5] = "Now may the God who gives endurance and encouragement grant you to live in harmony with one another, according to Christ Jesus,";
csb[6] = "so that you may glorify the God and Father of our Lord Jesus Christ with one mind and one voice.";
csb[7] = "Therefore accept one another, just as Christ also accepted you, to the glory of God.";
csb[8] = "For I say that Christ became a servant of the circumcised on behalf of God\'s truth, to confirm the promises to the fathers,";
csb[9] = "and so that Gentiles may glorify God for his mercy. As it is written, Therefore I will praise you among the Gentiles, and I will sing praise to your name.";
csb[10] = "Again it says, Rejoice, you Gentiles, with his people!";
csb[11] = "And again, Praise the Lord, all you Gentiles; let all the peoples praise him!";
csb[12] = "And again, Isaiah says, The root of Jesse will appear, the one who rises to rule the Gentiles; the Gentiles will hope in him.";
csb[13] = "Now may the God of hope fill you with all joy and peace as you believe so that you may overflow with hope by the power of the Holy Spirit.";
csb[14] = "My brothers and sisters, I myself am convinced about you that you also are full of goodness, filled with all knowledge, and able to instruct one another.";
csb[15] = "Nevertheless, I have written to remind you more boldly on some points because of the grace given me by God";
csb[16] = "to be a minister of Christ Jesus to the Gentiles, serving as a priest of the gospel of God. My purpose is that the Gentiles may be an acceptable offering, sanctified by the Holy Spirit.";
csb[17] = "Therefore I have reason to boast in Christ Jesus regarding what pertains to God.";
csb[18] = "For I would not dare say anything except what Christ has accomplished through me by word and deed for the obedience of the Gentiles,";
csb[19] = "by the power of miraculous signs and wonders, and by the power of God\'s Spirit. As a result, I have fully proclaimed the gospel of Christ from Jerusalem all the way around to Illyricum.";
csb[20] = "My aim is to preach the gospel where Christ has not been named, so that I will not build on someone else\'s foundation,";
csb[21] = "but, as it is written, Those who were not told about him will see, and those who have not heard will understand.";
csb[22] = "That is why I have been prevented many times from coming to you.";
csb[23] = "But now I no longer have any work to do in these regions, and I have strongly desired for many years to come to you";
csb[24] = "whenever I travel to Spain. For I hope to see you when I pass through and to be assisted by you for my journey there, once I have first enjoyed your company for a while.";
csb[25] = "Right now I am traveling to Jerusalem to serve the saints,";
csb[26] = "because Macedonia and Achaia were pleased to make a contribution for the poor among the saints in Jerusalem.";
csb[27] = "Yes, they were pleased, and indeed are indebted to them. For if the Gentiles have shared in their spiritual benefits, then they are obligated to minister to them in material needs.";
csb[28] = "So when I have finished this and safely delivered the funds to them, I will visit you on the way to Spain.";
csb[29] = "I know that when I come to you, I will come in the fullness of the blessing of Christ.";
csb[30] = "Now I appeal to you, brothers and sisters, through our Lord Jesus Christ and through the love of the Spirit, to strive together with me in fervent prayers to God on my behalf.";
csb[31] = "Pray that I may be rescued from the unbelievers in Judea, that my ministry to Jerusalem may be acceptable to the saints,";
csb[32] = "and that, by God\'s will, I may come to you with joy and be refreshed together with you.";
csb[33] = "May the God of peace be with all of you. Amen.";

asv[23] = "but now, having no more any place in these regions, and having these many years a longing to come unto you,";
yng[23] = "and now, no longer having place in these parts, and having a longing to come unto you for many years,";
dby[23] = "But now, having no longer place in these regions, and having great desire to come to you these many years,";
web[23] = "But now having no more place in these parts, and having a great desire these many years to come to you;";
hnv[23] = "but now, no longer having any place in these regions, and having these many years a longing to come to you,";
vul[23] = "nunc vero ulterius locum non habens in his regionibus cupiditatem autem habens veniendi ad vos ex multis iam annis";
kjv[24] = "Whensoever I take my journey into Spain, I will come to you: for I trust to see you in my journey, and to be brought on my way thitherward by you, if first I be somewhat filled with your [company].";
rsv[24] = "I hope to see you in passing as I go to Spain, and to be sped on my journey there by you, once I have enjoyed your company for a little.";
asv[24] = "whensoever I go unto Spain (for I hope to see you in my journey, and to be brought on my way thitherward by you, if first in some measure I shall have been satisfied with your company)--";
yng[24] = "when I may go on to Spain I will come unto you, for I hope in going through, to see you, and by you to be set forward thither, if of you first, in part, I shall be filled.";
dby[24] = "whenever I should go to Spain; (for I hope to see you as I go through, and by you to be set forward thither, if first I shall have been in part filled with your company;)";
web[24] = "Whenever I take my journey into Spain, I will come to you: for I trust to see you in my journey, and to be brought on my way thitherward by you, if first I shall be somewhat filled with your [company].";
hnv[24] = "whenever I journey to Spain, I will come to you. For I hope to see you on my journey, and to be helped on my way there by you, if first I may enjoy your company for a while.";
vul[24] = "cum in Hispaniam proficisci coepero spero quod praeteriens videam vos et a vobis deducar illuc si vobis primum ex parte fruitus fuero";
kjv[25] = "But now I go unto Jerusalem to minister unto the saints.";
rsv[25] = "At present, however, I am going to Jerusalem with aid for the saints.";
asv[25] = "but now, [I say], I go unto Jerusalem, ministering unto the saints.";
yng[25] = "And, now, I go on to Jerusalem, ministering to the saints;";
dby[25] = "but now I go to Jerusalem, ministering to the saints;";
web[25] = "But now I go to Jerusalem to minister to the saints.";
hnv[25] = "But now, I say, I am going to Yerushalayim, serving the holy ones.";
vul[25] = "nunc igitur proficiscar in Hierusalem ministrare sanctis";
kjv[26] = "For it hath pleased them of Macedonia and Achaia to make a certain contribution for the poor saints which are at Jerusalem.";
rsv[26] = "For Macedo\'nia and Acha\'ia have been pleased to make some contribution for the poor among the saints at Jerusalem;";
asv[26] = "For it hath been the good pleasure of Macedonia and Achaia to make a certain contribution for the poor among the saints that are at Jerusalem.";
yng[26] = "for it pleased Macedonia and Achaia well to make a certain contribution for the poor of the saints who [are] in Jerusalem;";
dby[26] = "for Macedonia and Achaia have been well pleased to make a certain contribution for the poor of the saints who [are] in Jerusalem.";
web[26] = "For it hath pleased them of Macedonia and Achaia to make a certain contribution for the poor of the saints who are at Jerusalem.";
hnv[26] = "For it has been the good pleasure of Macedonia and Achaia to make a certain contribution for the poor among the holy ones who are at Yerushalayim.";
vul[26] = "probaverunt enim Macedonia et Achaia conlationem aliquam facere in pauperes sanctorum qui sunt in Hierusalem";
kjv[27] = "It hath pleased them verily; and their debtors they are. For if the Gentiles have been made partakers of their spiritual things, their duty is also to minister unto them in carnal things.";
rsv[27] = "they were pleased to do it, and indeed they are in debt to them, for if the Gentiles have come to share in their spiritual blessings, they ought also to be of service to them in material blessings.";
asv[27] = "Yea, it hath been their good pleasure; and their debtors they are. For if the Gentiles have been made partakers of their spiritual things, they owe it [to them] also to minister unto them in carnal things.";
yng[27] = "for it pleased well, and their debtors they are, for if in their spiritual things the nations did participate, they ought also, in the fleshly things, to minister to them.";
dby[27] = "They have been well pleased indeed, and they are their debtors; for if the nations have participated in their spiritual things, they ought also in fleshly to minister to them.";
web[27] = "It hath pleased them verily; and their debtors they are. For if the Gentiles have been made partakers of their spiritual things, their duty is also to minister to them in carnal things.";
hnv[27] = "Yes, it has been their good pleasure, and they are their debtors. For if the Goyim have been made partakers of their spiritual things, they owe it to them also to serve them in fleshly things.";
vul[27] = "placuit enim eis et debitores sunt eorum nam si spiritalium eorum participes facti sunt gentiles debent et in carnalibus ministrare eis";
kjv[28] = "When therefore I have performed this, and have sealed to them this fruit, I will come by you into Spain.";
rsv[28] = "When therefore I have completed this, and have delivered to them what has been raised, I shall go on by way of you to Spain;";
asv[28] = "When therefore I have accomplished this, and have sealed to them this fruit, I will go on by you unto Spain.";
yng[28] = "This, then, having finished, and having sealed to them this fruit, I will return through you, to Spain;";
dby[28] = "Having finished this therefore, and having sealed to them this fruit, I will set off by you into Spain.";
web[28] = "When therefore I have performed this, and have sealed to them this fruit, I will go by you into Spain.";
hnv[28] = "When therefore I have accomplished this, and have sealed to them this fruit, I will go on by way of you to Spain.";
vul[28] = "hoc igitur cum consummavero et adsignavero eis fructum hunc proficiscar per vos in Hispaniam";
kjv[29] = "And I am sure that, when I come unto you, I shall come in the fulness of the blessing of the gospel of Christ.";
rsv[29] = "and I know that when I come to you I shall come in the fulness of the blessing of Christ.";
asv[29] = "And I know that, when I come unto you, I shall come in the fulness of the blessing of Christ.";
yng[29] = "and I have known that coming unto you -- in the fulness of the blessing of the good news of Christ I shall come.";
dby[29] = "But I know that, coming to you, I shall come in [the] fulness of [the] blessing of Christ.";
web[29] = "And I am sure that when I come to you, I shall come in the fullness of the blessing of the gospel of Christ.";
hnv[29] = "I know that, when I come to you, I will come in the fullness of the blessing of the Good News of Messiah.";
vul[29] = "scio autem quoniam veniens ad vos in abundantia benedictionis Christi veniam";
kjv[30] = "Now I beseech you, brethren, for the Lord Jesus Christ\'s sake, and for the love of the Spirit, that ye strive together with me in [your] prayers to God for me;";
rsv[30] = "I appeal to you, brethren, by our Lord Jesus Christ and by the love of the Spirit, to strive together with me in your prayers to God on my behalf,";
asv[30] = "Now I beseech you, brethren, by our Lord Jesus Christ, and by the love of the Spirit, that ye strive together with me in your prayers to God for me;";
yng[30] = "And I call upon you, brethren, through our Lord Jesus Christ, and through the love of the Spirit, to strive together with me in the prayers for me unto God,";
dby[30] = "But I beseech you, brethren, by our Lord Jesus Christ, and by the love of the Spirit, that ye strive together with me in prayers for me to God;";
web[30] = "Now I beseech you, brethren, for the Lord Jesus Christ\'s sake, and for the love of the Spirit, that ye strive together with me in [your] prayers to God for me;";
hnv[30] = "Now I beg you, brothers, by our Lord Yeshua the Messiah, and by the love of the Spirit, that you strive together with me in your prayers to God for me,";
vul[30] = "obsecro igitur vos fratres per Dominum nostrum Iesum Christum et per caritatem Spiritus ut adiuvetis me in orationibus pro me ad Deum";
kjv[31] = "That I may be delivered from them that do not believe in Judaea; and that my service which [I have] for Jerusalem may be accepted of the saints;";
rsv[31] = "that I may be delivered from the unbelievers in Judea, and that my service for Jerusalem may be acceptable to the saints,";
asv[31] = "that I may be delivered from them that are disobedient in Judaea, and [that] my ministration which [I have] for Jerusalem may be acceptable to the saints;";
yng[31] = "that I may be delivered from those not believing in Judea, and that my ministration, that [is] for Jerusalem, may become acceptable to the saints;";
dby[31] = "that I may be saved from those that do not believe in Judaea; and that my ministry which [I have] for Jerusalem may be acceptable to the saints;";
web[31] = "That I may be delivered from them in Judea who do not believe; and that my service which [I have] for Jerusalem, may be acceptable to the saints;";
hnv[31] = "that I may be delivered from those who are disobedient in Yehudah, and that my service which I have for Yerushalayim may be acceptable to the holy ones;";
vul[31] = "ut liberer ab infidelibus qui sunt in Iudaea et obsequii mei oblatio accepta fiat in Hierosolyma sanctis";
kjv[32] = "That I may come unto you with joy by the will of God, and may with you be refreshed.";
rsv[32] = "so that by God\'s will I may come to you with joy and be refreshed in your company.";
asv[32] = "that I may come unto you in joy through the will of God, and together with you find rest.";
yng[32] = "that in joy I may come unto you, through the will of God, and may be refreshed with you,";
dby[32] = "in order that I may come to you in joy by God\'s will, and that I may be refreshed with you.";
web[32] = "That I may come to you with joy by the will of God, and may with you be refreshed.";
hnv[32] = "that I may come to you in joy through the will of God, and together with you, find rest.";
vul[32] = "ut veniam ad vos in gaudio per voluntatem Dei et refrigerer vobiscum";

rsv[33] = "The God of peace be with you all. Amen.";
asv[33] = "Now the God of peace be with you all. Amen.";
yng[33] = "and the God of the peace [be] with you all. Amen.";
dby[33] = "And the God of peace be with you all. Amen.";
web[33] = "Now the God of peace [be] with you all. Amen.";
