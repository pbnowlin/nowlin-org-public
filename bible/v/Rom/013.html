csb[1] = "Let everyone submit to the governing authorities, since there is no authority except from God, and the authorities that exist are instituted by God.";
csb[2] = "So then, the one who resists the authority is opposing God\'s command, and those who oppose it will bring judgment on themselves.";
csb[3] = "For rulers are not a terror to good conduct, but to bad. Do you want to be unafraid of the authority? Do what is good, and you will have its approval.";
csb[4] = "For it is God\'s servant for your good. But if you do wrong, be afraid, because it does not carry the sword for no reason. For it is God\'s servant, an avenger that brings wrath on the one who does wrong.";
csb[5] = "Therefore, you must submit, not only because of wrath but also because of your conscience.";
csb[6] = "And for this reason you pay taxes, since the authorities are God\'s servants, continually attending to these tasks.";
csb[7] = "Pay your obligations to everyone: taxes to those you owe taxes, tolls to those you owe tolls, respect to those you owe respect, and honor to those you owe honor.";
csb[8] = "Do not owe anyone anything, except to love one another, for the one who loves another has fulfilled the law.";
csb[9] = "The commandments, Do not commit adultery; do not murder; do not steal; do not covet; and any other commandment, are summed up by this commandment: Love your neighbor as yourself.";
csb[10] = "Love does no wrong to a neighbor. Love, therefore, is the fulfillment of the law.";
csb[11] = "Besides this, since you know the time, it is already the hour for you to wake up from sleep, because now our salvation is nearer than when we first believed.";
csb[12] = "The night is nearly over, and the day is near; so let us discard the deeds of darkness and put on the armor of light.";
csb[13] = "Let us walk with decency, as in the daytime: not in carousing and drunkenness; not in sexual impurity and promiscuity; not in quarreling and jealousy.";
csb[14] = "But put on the Lord Jesus Christ, and don\'t make plans to gratify the desires of the flesh.";
