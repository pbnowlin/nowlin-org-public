csb[1] = "I commend to you our sister Phoebe, who is a servant of the church in Cenchreae.";
csb[2] = "So you should welcome her in the Lord in a manner worthy of the saints and assist her in whatever matter she may require your help. For indeed she has been a benefactor of many -- and of me also.";
csb[3] = "Give my greetings to Prisca and Aquila, my coworkers in Christ Jesus,";
csb[4] = "who risked their own necks for my life. Not only do I thank them, but so do all the Gentile churches.";
csb[5] = "Greet also the church that meets in their home. Greet my dear friend Epaenetus, who is the first convert to Christ from Asia.";
csb[6] = "Greet Mary, who has worked very hard for you.";
csb[7] = "Greet Andronicus and Junia, my fellow Jews and fellow prisoners. They are noteworthy in the eyes of the apostles, and they were also in Christ before me.";
csb[8] = "Greet Ampliatus, my dear friend in the Lord.";
csb[9] = "Greet Urbanus, our coworker in Christ, and my dear friend Stachys.";
csb[10] = "Greet Apelles, who is approved in Christ. Greet those who belong to the household of Aristobulus.";
csb[11] = "Greet Herodion, my fellow Jew. Greet those who belong to the household of Narcissus who are in the Lord.";
csb[12] = "Greet Tryphaena and Tryphosa, who have worked hard in the Lord. Greet my dear friend Persis, who has worked very hard in the Lord.";
csb[13] = "Greet Rufus, chosen in the Lord; also his mother -- and mine.";
csb[14] = "Greet Asyncritus, Phlegon, Hermes, Patrobas, Hermas, and the brothers and sisters who are with them.";
csb[15] = "Greet Philologus and Julia, Nereus and his sister, and Olympas, and all the saints who are with them.";
csb[16] = "Greet one another with a holy kiss. All the churches of Christ send you greetings.";
csb[17] = "Now I urge you, brothers and sisters, to watch out for those who create divisions and obstacles contrary to the teaching that you learned. Avoid them,";
csb[18] = "because such people do not serve our Lord Christ but their own appetites. They deceive the hearts of the unsuspecting with smooth talk and flattering words.";
csb[19] = "The report of your obedience has reached everyone. Therefore I rejoice over you, but I want you to be wise about what is good, and yet innocent about what is evil.";
csb[20] = "The God of peace will soon crush Satan under your feet. The grace of our Lord Jesus be with you.";
csb[21] = "Timothy, my coworker, and Lucius, Jason, and Sosipater, my fellow countrymen, greet you.";
csb[22] = "I Tertius, who wrote this letter, greet you in the Lord.";
csb[23] = "Gaius, who is host to me and to the whole church, greets you. Erastus, the city treasurer, and our brother Quartus greet you.";
csb[24] = " ";
csb[25] = "Now to him who is able to strengthen you according to my gospel and the proclamation about Jesus Christ, according to the revelation of the mystery kept silent for long ages";
csb[26] = "but now revealed and made known through the prophetic Scriptures, according to the command of the eternal God to advance the obedience of faith among all the Gentiles --";
csb[27] = "to the only wise God, through Jesus Christ -- to him be the glory forever! Amen.";
