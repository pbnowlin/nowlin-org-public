csb[1] = "Therefore, since we have been declared righteous by faith, we have peace with God through our Lord Jesus Christ.";
csb[2] = "We have also obtained access through him by faith into this grace in which we stand, and we rejoice in the hope of the glory of God.";
csb[3] = "And not only that, but we also rejoice in our afflictions, because we know that affliction produces endurance,";
csb[4] = "endurance produces proven character, and proven character produces hope.";
csb[5] = "This hope will not disappoint us, because God\'s love has been poured out in our hearts through the Holy Spirit who was given to us.";
csb[6] = "For while we were still helpless, at the right time, Christ died for the ungodly.";
csb[7] = "For rarely will someone die for a just person -- though for a good person perhaps someone might even dare to die.";

csb[9] = "How much more then, since we have now been declared righteous by his blood, will we be saved through him from wrath.";
csb[10] = "For if, while we were enemies, we were reconciled to God through the death of his Son, then how much more, having been reconciled, will we be saved by his life.";
csb[11] = "And not only that, but we also rejoice in God through our Lord Jesus Christ, through whom we have now received this reconciliation.";
csb[12] = "Therefore, just as sin entered the world through one man, and death through sin, in this way death spread to all people, because all sinned.";
csb[13] = "In fact, sin was in the world before the law, but sin is not charged to a person\'s account when there is no law.";
csb[14] = "Nevertheless, death reigned from Adam to Moses, even over those who did not sin in the likeness of Adam\'s transgression. He is a type of the Coming One.";
csb[15] = "But the gift is not like the trespass. For if by the one man\'s trespass the many died, how much more have the grace of God and the gift which comes through the grace of the one man Jesus Christ overflowed to the many.";
csb[16] = "And the gift is not like the one man\'s sin, because from one sin came the judgment, resulting in condemnation, but from many trespasses came the gift, resulting in justification.";
csb[17] = "Since by the one man\'s trespass, death reigned through that one man, how much more will those who receive the overflow of grace and the gift of righteousness reign in life through the one man, Jesus Christ.";
csb[18] = "So then, as through one trespass there is condemnation for everyone, so also through one righteous act there is justification leading to life for everyone.";
csb[19] = "For just as through one man\'s disobedience the many were made sinners, so also through the one man\'s obedience the many will be made righteous.";
csb[20] = "The law came along to multiply the trespass. But where sin multiplied, grace multiplied even more";
csb[21] = "so that, just as sin reigned in death, so also grace will reign through righteousness, resulting in eternal life through Jesus Christ our Lord.";
