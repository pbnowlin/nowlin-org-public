csb[1] = "Therefore, every one of you who judges is without excuse. For when you judge another, you condemn yourself, since you, the judge, do the same things.";
csb[2] = "We know that God\'s judgment on those who do such things is based on the truth.";
csb[3] = "Do you really think -- anyone of you who judges those who do such things yet do the same -- that you will escape God\'s judgment?";
csb[4] = "Or do you despise the riches of his kindness, restraint, and patience, not recognizing that God\'s kindness is intended to lead you to repentance?";
csb[5] = "Because of your hardened and unrepentant heart you are storing up wrath for yourself in the day of wrath, when God\'s righteous judgment is revealed.";
csb[6] = "He will repay each one according to his works:";
csb[7] = "eternal life to those who by persistence in doing good seek glory, honor, and immortality;";
csb[8] = "but wrath and anger to those who are self-seeking and disobey the truth while obeying unrighteousness.";
csb[9] = "There will be affliction and distress for every human being who does evil, first to the Jew, and also to the Greek;";
csb[10] = "but glory, honor, and peace for everyone who does what is good, first to the Jew, and also to the Greek.";
csb[11] = "For there is no favoritism with God.";
csb[12] = "All who sin without the law will also perish without the law, and all who sin under the law will be judged by the law.";
csb[13] = "For the hearers of the law are not righteous before God, but the doers of the law will be justified.";
csb[14] = "So, when Gentiles, who do not by nature have the law, do what the law demands, they are a law to themselves even though they do not have the law.";
csb[15] = "They show that the work of the law is written on their hearts. Their consciences confirm this. Their competing thoughts either accuse or even excuse them";
csb[16] = "on the day when God judges what people have kept secret, according to my gospel through Christ Jesus.";
csb[17] = "Now if you call yourself a Jew, and rely on the law, and boast in God,";
csb[18] = "and know his will, and approve the things that are superior, being instructed from the law,";
csb[19] = "and if you are convinced that you are a guide for the blind, a light to those in darkness,";
csb[20] = "an instructor of the ignorant, a teacher of the immature, having the embodiment of knowledge and truth in the law --";
csb[21] = "you then, who teach another, don\'t you teach yourself? You who preach, &quot;You must not steal&quot; -- do you steal?";
csb[22] = "You who say, &quot;You must not commit adultery&quot; -- do you commit adultery? You who detest idols, do you rob their temples?";
csb[23] = "You who boast in the law, do you dishonor God by breaking the law?";
csb[24] = "For, as it is written: The name of God is blasphemed among the Gentiles because of you.";
csb[25] = "Circumcision benefits you if you observe the law, but if you are a lawbreaker, your circumcision has become uncircumcision.";
csb[26] = "So if an uncircumcised man keeps the law\'s requirements, will not his uncircumcision be counted as circumcision?";
csb[27] = "A man who is physically uncircumcised, but who keeps the law, will judge you who are a lawbreaker in spite of having the letter of the law and circumcision.";
csb[28] = "For a person is not a Jew who is one outwardly, and true circumcision is not something visible in the flesh.";
csb[29] = "On the contrary, a person is a Jew who is one inwardly, and circumcision is of the heart -- by the Spirit, not the letter. That person\'s praise is not from people but from God.";
kjv[1] = "Therefore thou art inexcusable, O man, whosoever thou art that judgest: for wherein thou judgest another, thou condemnest thyself; for thou that judgest doest the same things.";

web[24] = "For the name of God is blasphemed among the Gentiles, through you, as it is written.";
hnv[24] = "For &quot;the name of God is blasphemed among the Goyim because of you,&quot; just as it is written.";
vul[24] = "nomen enim Dei per vos blasphematur inter gentes sicut scriptum est";
kjv[25] = "For circumcision verily profiteth, if thou keep the law: but if thou be a breaker of the law, thy circumcision is made uncircumcision.";
rsv[25] = "Circumcision indeed is of value if you obey the law; but if you break the law, your circumcision becomes uncircumcision.";
asv[25] = "For circumcision indeed profiteth, if thou be a doer of the law: but if thou be a transgressor of the law, thy circumcision is become uncircumcision.";
yng[25] = "For circumcision, indeed, doth profit, if law thou mayest practise, but if a transgressor of law thou mayest be, thy circumcision hath become uncircumcision.";
dby[25] = "For circumcision indeed profits if thou keep [the] law; but if thou be a law-transgressor, thy circumcision is become uncircumcision.";
web[25] = "For circumcision verily profiteth, if thou keepest the law; but if thou art a breaker of the law, thy circumcision is made uncircumcision.";
hnv[25] = "For circumcision indeed profits, if you are a doer of the law, but if you are a transgressor of the law, your circumcision has become uncircumcision.";
vul[25] = "circumcisio quidem prodest si legem observes si autem praevaricator legis sis circumcisio tua praeputium facta est";
kjv[26] = "Therefore if the uncircumcision keep the righteousness of the law, shall not his uncircumcision be counted for circumcision?";
rsv[26] = "So, if a man who is uncircumcised keeps the precepts of the law, will not his uncircumcision be regarded as circumcision?";
asv[26] = "If therefore the uncircumcision keep the ordinances of the law, shall not his uncircumcision be reckoned for circumcision?";
yng[26] = "If, therefore the uncircumcision the righteousness of the law may keep, shall not his uncircumcision for circumcision be reckoned?";
dby[26] = "If therefore the uncircumcision keep the requirements of the law, shall not his uncircumcision be reckoned for circumcision,";
web[26] = "Therefore, if the uncircumcision keepeth the righteousness of the law, shall not his uncircumcision be counted for circumcision?";
hnv[26] = "If therefore the uncircumcised keep the ordinances of the law, won\'t his uncircumcision be accounted as circumcision?";
vul[26] = "si igitur praeputium iustitias legis custodiat nonne praeputium illius in circumcisionem reputabitur";
kjv[27] = "And shall not uncircumcision which is by nature, if it fulfil the law, judge thee, who by the letter and circumcision dost transgress the law?";
rsv[27] = "Then those who are physically uncircumcised but keep the law will condemn you who have the written code and circumcision but break the law.";
asv[27] = "and shall not the uncircumcision which is by nature, if it fulfil the law, judge thee, who with the letter and circumcision art a transgressor of the law?";
yng[27] = "and the uncircumcision, by nature, fulfilling the law, shall judge thee who, through letter and circumcision, [art] a transgressor of law.";
dby[27] = "and uncircumcision by nature, fulfilling the law, judge thee, who, with letter and circumcision, [art] a law-transgressor?";
web[27] = "And shall not uncircumcision which is by nature, if it fulfilleth the law, judge thee, who by the letter and circumcision dost transgress the law?";
hnv[27] = "Won\'t the uncircumcision which is by nature, if it fulfills the law, judge you, who with the letter and circumcision are a transgressor of the law?";
vul[27] = "et iudicabit quod ex natura est praeputium legem consummans te qui per litteram et circumcisionem praevaricator legis es";
kjv[28] = "For he is not a Jew, which is one outwardly; neither [is that] circumcision, which is outward in the flesh:";
rsv[28] = "For he is not a real Jew who is one outwardly, nor is true circumcision something external and physical.";
asv[28] = "For he is not a Jew who is one outwardly; neither is that circumcision which is outward in the flesh:";
yng[28] = "For he is not a Jew who is [so] outwardly, neither [is] circumcision that which is outward in flesh;";
dby[28] = "For he is not a Jew who [is] one outwardly, neither that circumcision which is outward in flesh;";
web[28] = "For he is not a Jew, who is one outwardly; neither [is that] circumcision, which is outward in the flesh:";
hnv[28] = "For he is not a Yehudi who is one outwardly, neither is that circumcision which is outward in the flesh;";
vul[28] = "non enim qui in manifesto Iudaeus est neque quae in manifesto in carne circumcisio";
kjv[29] = "But he [is] a Jew, which is one inwardly; and circumcision [is that] of the heart, in the spirit, [and] not in the letter; whose praise [is] not of men, but of God.";
rsv[29] = "He is a Jew who is one inwardly, and real circumcision is a matter of the heart, spiritual and not literal. His praise is not from men but from God.";
asv[29] = "but he is a Jew who is one inwardly; and circumcision is that of the heart, in the spirit not in the letter; whose praise is not of men, but of God.";
yng[29] = "but a Jew [is] he who is [so] inwardly, and circumcision [is] of the heart, in spirit, not in letter, of which the praise is not of men, but of God.";
dby[29] = "but he [is] a Jew [who is so] inwardly; and circumcision, of the heart, in spirit, not in letter; whose praise [is] not of men, but of God.";
web[29] = "But he [is] a Jew who is one inwardly; and circumcision [is that] of the heart, in the spirit, [and] not in the letter; whose praise [is] not from men, but from God.";
hnv[29] = "but he is a Yehudi who is one inwardly, and circumcision is that of the heart, in the spirit not in the letter; whose praise is not from men, but from God.";
vul[29] = "sed qui in abscondito Iudaeus et circumcisio cordis in spiritu non littera cuius laus non ex hominibus sed ex Deo est";
