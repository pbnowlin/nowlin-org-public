csb[1] = "Therefore, there is now no condemnation for those in Christ Jesus,";
csb[2] = "because the law of the Spirit of life in Christ Jesus has set you free from the law of sin and death.";
csb[3] = "What the law could not do since it was weakened by the flesh, God did. He condemned sin in the flesh by sending his own Son in the likeness of sinful flesh as a sin offering,";
csb[4] = "in order that the law\'s requirement would be fulfilled in us who do not walk according to the flesh but according to the Spirit.";
csb[5] = "For those who live according to the flesh have their minds set on the things of the flesh, but those who live according to the Spirit have their minds set on the things of the Spirit.";
csb[6] = "Now the mind-set of the flesh is death, but the mind-set of the Spirit is life and peace.";
csb[7] = "The mind-set of the flesh is hostile to God because it does not submit to God\'s law. Indeed, it is unable to do so.";
csb[8] = "Those who are in the flesh cannot please God.";
csb[9] = "You, however, are not in the flesh, but in the Spirit, if indeed the Spirit of God lives in you. If anyone does not have the Spirit of Christ, he does not belong to him.";
csb[10] = "Now if Christ is in you, the body is dead because of sin, but the Spirit gives life because of righteousness.";
csb[11] = "And if the Spirit of him who raised Jesus from the dead lives in you, then he who raised Christ from the dead will also bring your mortal bodies to life through his Spirit who lives in you.";
csb[12] = "So then, brothers and sisters, we are not obligated to the flesh to live according to the flesh,";
csb[13] = "because if you live according to the flesh, you are going to die. But if by the Spirit you put to death the deeds of the body, you will live.";
csb[14] = "For all those led by God\'s Spirit are God\'s sons.";
csb[15] = "You did not receive a spirit of slavery to fall back into fear. Instead, you received the Spirit of adoption, by whom we cry out, &quot;Abba, Father! &quot;";
csb[16] = "The Spirit himself testifies together with our spirit that we are God\'s children,";
csb[17] = "and if children, also heirs -- heirs of God and coheirs with Christ -- if indeed we suffer with him so that we may also be glorified with him.";
csb[18] = "For I consider that the sufferings of this present time are not worth comparing with the glory that is going to be revealed to us.";
csb[19] = "For the creation eagerly waits with anticipation for God\'s sons to be revealed.";
csb[20] = "For the creation was subjected to futility -- not willingly, but because of him who subjected it -- in the hope";
csb[21] = "that the creation itself will also be set free from the bondage to decay into the glorious freedom of God\'s children.";
csb[22] = "For we know that the whole creation has been groaning together with labor pains until now.";
csb[23] = "Not only that, but we ourselves who have the Spirit as the firstfruits -- we also groan within ourselves, eagerly waiting for adoption, the redemption of our bodies.";
csb[24] = "Now in this hope we were saved, but hope that is seen is not hope, because who hopes for what he sees?";
csb[25] = "Now if we hope for what we do not see, we eagerly wait for it with patience.";
csb[26] = "In the same way the Spirit also helps us in our weakness, because we do not know what to pray for as we should, but the Spirit himself intercedes for us with unspoken groanings.";
csb[27] = "And he who searches our hearts knows the mind of the Spirit, because he intercedes for the saints according to the will of God.";
csb[28] = "We know that all things work together for the good of those who love God, who are called according to his purpose.";
csb[29] = "For those he foreknew he also predestined to be conformed to the image of his Son, so that he would be the firstborn among many brothers and sisters.";
csb[30] = "And those he predestined, he also called; and those he called, he also justified; and those he justified, he also glorified.";
csb[31] = "What then are we to say about these things? If God is for us, who is against us?";
csb[32] = "He did not even spare his own Son but offered him up for us all. How will he not also with him grant us everything?";
csb[33] = "Who can bring an accusation against God\'s elect? God is the one who justifies.";
csb[34] = "Who is the one who condemns? Christ Jesus is the one who died, but even more, has been raised; he also is at the right hand of God and intercedes for us.";
csb[35] = "Who can separate us from the love of Christ? Can affliction or distress or persecution or famine or nakedness or danger or sword?";
csb[36] = "As it is written: Because of you we are being put to death all day long; we are counted as sheep to be slaughtered.";
csb[37] = "No, in all these things we are more than conquerors through him who loved us.";
csb[38] = "For I am persuaded that neither death nor life, nor angels nor rulers, nor things present nor things to come, nor powers,";
csb[39] = "nor height nor depth, nor any other created thing will be able to separate us from the love of God that is in Christ Jesus our Lord.";

rsv[23] = "and not only the creation, but we ourselves, who have the first fruits of the Spirit, groan inwardly as we wait for adoption as sons, the redemption of our bodies.";

yng[23] = "And not only [so], but also we ourselves, having the first-fruit of the Spirit, we also ourselves in ourselves do groan, adoption expecting -- the redemption of our body;";

kjv[24] = "For we are saved by hope: but hope that is seen is not hope: for what a man seeth, why doth he yet hope for?";
rsv[24] = "For in this hope we were saved. Now hope that is seen is not hope. For who hopes for what he sees?";
asv[24] = "For in hope were we saved: but hope that is seen is not hope: for who hopeth for that which he seeth?";
yng[24] = "for in hope we were saved, and hope beheld is not hope; for what any one doth behold, why also doth he hope for [it]?";
dby[24] = "For we have been saved in hope; but hope seen is not hope; for what any one sees, why does he also hope?";
web[24] = "For we are saved by hope: But hope that is seen, is not hope: for what a man seeth, why doth he yet hope for?";
hnv[24] = "For we were saved in hope, but hope that is seen is not hope. For who hopes for that which he sees?";
vul[24] = "spe enim salvi facti sumus spes autem quae videtur non est spes nam quod videt quis quid sperat";
kjv[25] = "But if we hope for that we see not, [then] do we with patience wait for [it].";
rsv[25] = "But if we hope for what we do not see, we wait for it with patience.";
asv[25] = "But if we hope for that which we see not, [then] do we with patience wait for it.";
yng[25] = "and if what we do not behold we hope for, through continuance we expect [it].";

web[25] = "But if we hope for what we see not, [then] with patience we wait for [it].";

vul[25] = "si autem quod non videmus speramus per patientiam expectamus";
kjv[26] = "Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered.";

yng[26] = "And, in like manner also, the Spirit doth help our weaknesses; for, what we may pray for, as it behoveth [us], we have not known, but the Spirit himself doth make intercession for us with groanings unutterable,";
dby[26] = "And in like manner the Spirit joins also its help to our weakness; for we do not know what we should pray for as is fitting, but the Spirit itself makes intercession with groanings which cannot be uttered.";

yng[27] = "and He who is searching the hearts hath known what [is] the mind of the Spirit, because according to God he doth intercede for saints.";
