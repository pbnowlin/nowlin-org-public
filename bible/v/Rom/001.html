csb[1] = "Paul, a servant of Christ Jesus, called as an apostle and set apart for the gospel of God --";
csb[2] = "which he promised beforehand through his prophets in the Holy Scriptures --";
csb[3] = "concerning his Son, Jesus Christ our Lord, who was a descendant of David according to the flesh";
csb[4] = "and was appointed to be the powerful Son of God according to the Spirit of holiness by the resurrection of the dead.";
csb[5] = "Through him we have received grace and apostleship to bring about the obedience of faith for the sake of his name among all the Gentiles,";
csb[6] = "including you who are also called by Jesus Christ.";
csb[7] = "To all who are in Rome, loved by God, called as saints. Grace to you and peace from God our Father and the Lord Jesus Christ.";
csb[8] = "First, I thank my God through Jesus Christ for all of you because the news of your faith is being reported in all the world.";
csb[9] = "God is my witness, whom I serve with my spirit in telling the good news about his Son -- that I constantly mention you,";
csb[10] = "always asking in my prayers that if it is somehow in God\'s will, I may now at last succeed in coming to you.";
csb[11] = "For I want very much to see you, so that I may impart to you some spiritual gift to strengthen you,";
csb[12] = "that is, to be mutually encouraged by each other\'s faith, both yours and mine.";
csb[13] = "Now I don\'t want you to be unaware, brothers and sisters, that I often planned to come to you (but was prevented until now) in order that I might have a fruitful ministry among you, just as I have had among the rest of the Gentiles.";
csb[14] = "I am obligated both to Greeks and barbarians, both to the wise and the foolish.";
csb[15] = "So I am eager to preach the gospel to you also who are in Rome.";
csb[16] = "For I am not ashamed of the gospel, because it is the power of God for salvation to everyone who believes, first to the Jew, and also to the Greek.";
csb[17] = "For in it the righteousness of God is revealed from faith to faith, just as it is written: The righteous will live by faith.";
csb[18] = "For God\'s wrath is revealed from heaven against all godlessness and unrighteousness of people who by their unrighteousness suppress the truth,";
csb[19] = "since what can be known about God is evident among them, because God has shown it to them.";
csb[20] = "For his invisible attributes, that is, his eternal power and divine nature, have been clearly seen since the creation of the world, being understood through what he has made. As a result, people are without excuse.";
csb[21] = "For though they knew God, they did not glorify him as God or show gratitude. Instead, their thinking became worthless, and their senseless hearts were darkened.";
csb[22] = "Claiming to be wise, they became fools";
csb[23] = "and exchanged the glory of the immortal God for images resembling mortal man, birds, four-footed animals, and reptiles.";
csb[24] = "Therefore God delivered them over in the desires of their hearts to sexual impurity, so that their bodies were degraded among themselves.";
csb[25] = "They exchanged the truth of God for a lie, and worshiped and served what has been created instead of the Creator, who is praised forever. Amen.";
csb[26] = "For this reason God delivered them over to disgraceful passions. Their women exchanged natural sexual relations for unnatural ones.";
csb[27] = "The men in the same way also left natural relations with women and were inflamed in their lust for one another. Men committed shameless acts with men and received in their own persons the appropriate penalty of their error.";
csb[28] = "And because they did not think it worthwhile to acknowledge God, God delivered them over to a corrupt mind so that they do what is not right.";
csb[29] = "They are filled with all unrighteousness, evil, greed, and wickedness. They are full of envy, murder, quarrels, deceit, and malice. They are gossips,";
csb[30] = "slanderers, God-haters, arrogant, proud, boastful, inventors of evil, disobedient to parents,";
csb[31] = "senseless, untrustworthy, unloving, and unmerciful.";
csb[32] = "Although they know God\'s just sentence -- that those who practice such things deserve to die -- they not only do them, but even applaud others who practice them.";

vul[23] = "et mutaverunt gloriam incorruptibilis Dei in similitudinem imaginis corruptibilis hominis et volucrum et quadrupedum et serpentium";
kjv[24] = "Wherefore God also gave them up to uncleanness through the lusts of their own hearts, to dishonour their own bodies between themselves:";
rsv[24] = "Therefore God gave them up in the lusts of their hearts to impurity, to the dishonoring of their bodies among themselves,";
asv[24] = "Wherefore God gave them up in the lusts of their hearts unto uncleanness, that their bodies should be dishonored among themselves:";
yng[24] = "Wherefore also God did give them up, in the desires of their hearts, to uncleanness, to dishonour their bodies among themselves;";
dby[24] = "Wherefore God gave them up [also] in the lusts of their hearts to uncleanness, to dishonour their bodies between themselves:";
web[24] = "Wherefore God also gave them up to uncleanness, through the lusts of their own hearts, to dishonor their own bodies between themselves:";
hnv[24] = "Therefore God also gave them up in the lusts of their hearts to uncleanness, that their bodies should be dishonored among themselves,";
vul[24] = "propter quod tradidit illos Deus in desideria cordis eorum in inmunditiam ut contumeliis adficiant corpora sua in semet ipsis";
kjv[25] = "Who changed the truth of God into a lie, and worshipped and served the creature more than the Creator, who is blessed for ever. Amen.";
rsv[25] = "because they exchanged the truth about God for a lie and worshiped and served the creature rather than the Creator, who is blessed for ever! Amen.";
asv[25] = "for that they exchanged the truth of God for a lie, and worshipped and served the creature rather than the Creator, who is blessed for ever. Amen.";
yng[25] = "who did change the truth of God into a falsehood, and did honour and serve the creature rather than the Creator, who is blessed to the ages. Amen.";
dby[25] = "who changed the truth of God into falsehood, and honoured and served the creature more than him who had created [it], who is blessed for ever. Amen.";
web[25] = "Who changed the truth of God into a lie, and worshiped and served the creature more than the Creator, who is blessed for ever. Amen.";
hnv[25] = "who exchanged the truth of God for a lie, and worshiped and served the creature rather than the Creator, who is blessed forever. Amein.";
vul[25] = "qui commutaverunt veritatem Dei in mendacio et coluerunt et servierunt creaturae potius quam creatori qui est benedictus in saecula amen";
kjv[26] = "For this cause God gave them up unto vile affections: for even their women did change the natural use into that which is against nature:";
rsv[26] = "For this reason God gave them up to dishonorable passions. Their women exchanged natural relations for unnatural,";
asv[26] = "For this cause God gave them up unto vile passions: for their women changed the natural use into that which is against nature:";
yng[26] = "Because of this did God give them up to dishonourable affections, for even their females did change the natural use into that against nature;";
dby[26] = "For this reason God gave them up to vile lusts; for both their females changed the natural use into that contrary to nature;";
web[26] = "For this cause God gave them up to vile affections. For even their women did change the natural use into that which is against nature:";
hnv[26] = "For this reason, God gave them up to vile passions. For their women changed the natural function into that which is against nature.";
vul[26] = "propterea tradidit illos Deus in passiones ignominiae nam feminae eorum inmutaverunt naturalem usum in eum usum qui est contra naturam";
kjv[27] = "And likewise also the men, leaving the natural use of the woman, burned in their lust one toward another; men with men working that which is unseemly, and receiving in themselves that recompence of their error which was meet.";
rsv[27] = "and the men likewise gave up natural relations with women and were consumed with passion for one another, men committing shameless acts with men and receiving in their own persons the due penalty for their error.";
asv[27] = "and likewise also the men, leaving the natural use of the woman, burned in their lust one toward another, men with men working unseemliness, and receiving in themselves that recompense of their error which was due.";
yng[27] = "and in like manner also the males having left the natural use of the female, did burn in their longing toward one another; males with males working shame, and the recompense of their error that was fit, in themselves receiving.";
dby[27] = "and in like manner the males also, leaving the natural use of the female, were inflamed in their lust towards one another; males with males working shame, and receiving in themselves the recompense of their error which was fit.";
web[27] = "And likewise also the men, leaving the natural use of the woman, burned in their lust one towards another; men with men working that which is unseemly, and receiving in themselves that recompense of their error which was meet.";
hnv[27] = "Likewise also the men, leaving the natural function of the woman, burned in their lust toward one another, men doing what is inappropriate with men, and receiving in themselves the due penalty of their error.";
vul[27] = "similiter autem et masculi relicto naturali usu feminae exarserunt in desideriis suis in invicem masculi in masculos turpitudinem operantes et mercedem quam oportuit erroris sui in semet ipsis recipientes";
kjv[28] = "And even as they did not like to retain God in [their] knowledge, God gave them over to a reprobate mind, to do those things which are not convenient;";
rsv[28] = "And since they did not see fit to acknowledge God, God gave them up to a base mind and to improper conduct.";
asv[28] = "And even as they refused to have God in [their] knowledge, God gave them up unto a reprobate mind, to do those things which are not fitting;";
yng[28] = "And, according as they did not approve of having God in knowledge, God gave them up to a disapproved mind, to do the things not seemly;";
dby[28] = "And according as they did not think good to have God in [their] knowledge, God gave them up to a reprobate mind to practise unseemly things;";
web[28] = "And even as they did not like to retain God in [their] knowledge, God gave them over to a reprobate mind, to do those things which are not convenient;";
hnv[28] = "Even as they refused to have God in their knowledge, God gave them up to a reprobate mind, to do those things which are not fitting;";
vul[28] = "et sicut non probaverunt Deum habere in notitia tradidit eos Deus in reprobum sensum ut faciant quae non conveniunt";

dby[29] = "being filled with all unrighteousness, wickedness, covetousness, malice; full of envy, murder, strife, deceit, evil dispositions; whisperers,";
web[29] = "Being filled with all unrighteousness, fornication, wickedness, covetousness, maliciousness; full of envy, murder, debate, deceit, malignity; whisperers,";
hnv[29] = "being filled with all unrighteousness, sexual immorality, wickedness, covetousness, maliciousness; full of envy, murder, strife, deceit, evil habits, secret slanderers,";

asv[31] = "without understanding, covenant-breakers, without natural affection, unmerciful:";
yng[31] = "unintelligent, faithless, without natural affection, implacable, unmerciful;";
dby[31] = "void of understanding, faithless, without natural affection, unmerciful;";

kjv[32] = "Who knowing the judgment of God, that they which commit such things are worthy of death, not only do the same, but have pleasure in them that do them.";
rsv[32] = "Though they know God\'s decree that those who do such things deserve to die, they not only do them but approve those who practice them.";
asv[32] = "who, knowing the ordinance of God, that they that practise such things are worthy of death, not only do the same, but also consent with them that practise them.";
yng[32] = "who the righteous judgment of God having known -- that those practising such things are worthy of death -- not only do them, but also have delight with those practising them.";
dby[32] = "who knowing the righteous judgment of God, that they who do such things are worthy of death, not only practise them, but have fellow delight in those who do [them].";
web[32] = "Who, knowing the judgment of God, that they who commit such things are worthy of death; not only do the same, but have pleasure in them that do them.";
hnv[32] = "who, knowing the ordinance of God, that those who practice such things are worthy of death, not only do the same, but also approve of those who practice them.";
vul[32] = "qui cum iustitiam Dei cognovissent non intellexerunt quoniam qui talia agunt digni sunt morte non solum ea faciunt sed et consentiunt facientibus";
