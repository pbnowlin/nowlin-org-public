csb[1] = "Since I am speaking to those who know the law, brothers and sisters, don\'t you know that the law rules over someone as long as he lives?";
csb[2] = "For example, a married woman is legally bound to her husband while he lives. But if her husband dies, she is released from the law regarding the husband.";
csb[3] = "So then, if she is married to another man while her husband is living, she will be called an adulteress. But if her husband dies, she is free from that law. Then, if she is married to another man, she is not an adulteress.";
csb[4] = "Therefore, my brothers and sisters, you also were put to death in relation to the law through the body of Christ so that you may belong to another. You belong to him who was raised from the dead in order that we may bear fruit for God.";
csb[5] = "For when we were in the flesh, the sinful passions aroused through the law were working in us to bear fruit for death.";
csb[6] = "But now we have been released from the law, since we have died to what held us, so that we may serve in the newness of the Spirit and not in the old letter of the law.";
csb[7] = "What should we say then? Is the law sin? Absolutely not! On the contrary, I would not have known sin if it were not for the law. For example, I would not have known what it is to covet if the law had not said, Do not covet.";
csb[8] = "And sin, seizing an opportunity through the commandment, produced in me coveting of every kind. For apart from the law sin is dead.";
csb[9] = "Once I was alive apart from the law, but when the commandment came, sin sprang to life again";
csb[10] = "and I died. The commandment that was meant for life resulted in death for me.";
csb[11] = "For sin, seizing an opportunity through the commandment, deceived me, and through it killed me.";
csb[12] = "So then, the law is holy, and the commandment is holy and just and good.";
csb[13] = "Therefore, did what is good become death to me? Absolutely not! On the contrary, sin, in order to be recognized as sin, was producing death in me through what is good, so that through the commandment, sin might become sinful beyond measure.";
csb[14] = "For we know that the law is spiritual, but I am of the flesh, sold as a slave to sin.";
csb[15] = "For I do not understand what I am doing, because I do not practice what I want to do, but I do what I hate.";
csb[16] = "Now if I do what I do not want to do, I agree with the law that it is good.";
csb[17] = "So now I am no longer the one doing it, but it is sin living in me.";
csb[18] = "For I know that nothing good lives in me, that is, in my flesh. For the desire to do what is good is with me, but there is no ability to do it.";
csb[19] = "For I do not do the good that I want to do, but I practice the evil that I do not want to do.";
csb[20] = "Now if I do what I do not want, I am no longer the one that does it, but it is the sin that lives in me.";
csb[21] = "So I discover this law: When I want to do what is good, evil is present with me.";
csb[22] = "For in my inner self I delight in God\'s law,";
csb[23] = "but I see a different law in the parts of my body, waging war against the law of my mind and taking me prisoner to the law of sin in the parts of my body.";
csb[24] = "What a wretched man I am! Who will rescue me from this body of death?";
csb[25] = "Thanks be to God through Jesus Christ our Lord! So then, with my mind I myself am serving the law of God, but with my flesh, the law of sin.";
kjv[1] = "Know ye not, brethren, (for I speak to them that know the law,) how that the law hath dominion over a man as long as he liveth?";
kjv[2] = "For the woman which hath an husband is bound by the law to [her] husband so long as he liveth; but if the husband be dead, she is loosed from the law of [her] husband.";
kjv[3] = "So then if, while [her] husband liveth, she be married to another man, she shall be called an adulteress: but if her husband be dead, she is free from that law; so that she is no adulteress, though she be married to another man.";
kjv[4] = "Wherefore, my brethren, ye also are become dead to the law by the body of Christ; that ye should be married to another, [even] to him who is raised from the dead, that we should bring forth fruit unto God.";
kjv[5] = "For when we were in the flesh, the motions of sins, which were by the law, did work in our members to bring forth fruit unto death.";
kjv[6] = "But now we are delivered from the law, that being dead wherein we were held; that we should serve in newness of spirit, and not [in] the oldness of the letter.";
kjv[7] = "What shall we say then? [Is] the law sin? God forbid. Nay, I had not known sin, but by the law: for I had not known lust, except the law had said, Thou shalt not covet.";
kjv[8] = "But sin, taking occasion by the commandment, wrought in me all manner of concupiscence. For without the law sin [was] dead.";
kjv[9] = "For I was alive without the law once: but when the commandment came, sin revived, and I died.";
kjv[10] = "And the commandment, which [was ordained] to life, I found [to be] unto death.";
kjv[11] = "For sin, taking occasion by the commandment, deceived me, and by it slew [me].";
kjv[12] = "Wherefore the law [is] holy, and the commandment holy, and just, and good.";
kjv[13] = "Was then that which is good made death unto me? God forbid. But sin, that it might appear sin, working death in me by that which is good; that sin by the commandment might become exceeding sinful.";
kjv[14] = "For we know that the law is spiritual: but I am carnal, sold under sin.";
kjv[15] = "For that which I do I allow not: for what I would, that do I not; but what I hate, that do I.";
kjv[16] = "If then I do that which I would not, I consent unto the law that [it is] good.";
kjv[17] = "Now then it is no more I that do it, but sin that dwelleth in me.";
kjv[18] = "For I know that in me (that is, in my flesh,) dwelleth no good thing: for to will is present with me; but [how] to perform that which is good I find not.";
kjv[19] = "For the good that I would I do not: but the evil which I would not, that I do.";
kjv[20] = "Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me.";
kjv[21] = "I find then a law, that, when I would do good, evil is present with me.";
kjv[22] = "For I delight in the law of God after the inward man:";
kjv[23] = "But I see another law in my members, warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members.";
kjv[24] = "O wretched man that I am! who shall deliver me from the body of this death?";
kjv[25] = "I thank God through Jesus Christ our Lord. So then with the mind I myself serve the law of God; but with the flesh the law of sin.";
rsv[1] = "Do you not know, brethren--for I am speaking to those who know the law--that the law is binding on a person only during his life?";
