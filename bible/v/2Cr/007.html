csb[1] = "So then, dear friends, since we have these promises, let us cleanse ourselves from every impurity of the flesh and spirit, bringing holiness to completion in the fear of God.";
csb[2] = "Make room for us in your hearts. We have wronged no one, corrupted no one, taken advantage of no one.";
csb[3] = "I don\'t say this to condemn you, since I have already said that you are in our hearts, to die together and to live together.";
csb[4] = "I am very frank with you; I have great pride in you. I am filled with encouragement; I am overflowing with joy in all our afflictions.";
csb[5] = "In fact, when we came into Macedonia, we had no rest. Instead, we were troubled in every way: conflicts on the outside, fears within.";
csb[6] = "But God, who comforts the downcast, comforted us by the arrival of Titus,";
csb[7] = "and not only by his arrival but also by the comfort he received from you. He told us about your deep longing, your sorrow, and your zeal for me, so that I rejoiced even more.";
csb[8] = "For even if I grieved you with my letter, I don\'t regret it. And if I regretted it -- since I saw that the letter grieved you, yet only for a while --";
csb[9] = "I now rejoice, not because you were grieved, but because your grief led to repentance. For you were grieved as God willed, so that you didn\'t experience any loss from us.";
csb[10] = "For godly grief produces a repentance that leads to salvation without regret, but worldly grief produces death.";
csb[11] = "For consider how much diligence this very thing -- this grieving as God wills -- has produced in you: what a desire to clear yourselves, what indignation, what fear, what deep longing, what zeal, what justice! In every way you showed yourselves to be pure in this matter.";
csb[12] = "So even though I wrote to you, it was not because of the one who did wrong, or because of the one who was wronged, but in order that your devotion to us might be made plain to you in the sight of God.";
csb[13] = "For this reason we have been comforted. In addition to our own comfort, we rejoiced even more over the joy Titus had, because his spirit was refreshed by all of you.";
csb[14] = "For if I have made any boast to him about you, I have not been disappointed; but as I have spoken everything to you in truth, so our boasting to Titus has also turned out to be the truth.";
csb[15] = "And his affection toward you is even greater as he remembers the obedience of all of you, and how you received him with fear and trembling.";
csb[16] = "I rejoice that I have complete confidence in you.";
kjv[1] = "Having therefore these promises, dearly beloved, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God.";
rsv[1] = "Since we have these promises, beloved, let us cleanse ourselves from every defilement of body and spirit, and make holiness perfect in the fear of God.";
asv[1] = "Having therefore these promises, beloved, let us cleanse ourselves from all defilement of flesh and spirit, perfecting holiness in the fear of God.";
yng[1] = "Having, then, these promises, beloved, may we cleanse ourselves from every pollution of flesh and spirit, perfecting sanctification in the fear of God;";
dby[1] = "Having therefore these promises, beloved, let us purify ourselves from every pollution of flesh and spirit, perfecting holiness in God\'s fear.";
web[1] = "Having therefore these promises, dearly beloved, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God.";
hnv[1] = "Having therefore these promises, beloved, let us cleanse ourselves from all defilement of flesh and spirit, perfecting holiness in the fear of God.";
vul[1] = "has igitur habentes promissiones carissimi mundemus nos ab omni inquinamento carnis et spiritus perficientes sanctificationem in timore Dei";
kjv[2] = "Receive us; we have wronged no man, we have corrupted no man, we have defrauded no man.";
rsv[2] = "Open your hearts to us; we have wronged no one, we have corrupted no one, we have taken advantage of no one.";
asv[2] = "Open your hearts to us: we wronged no man, we corrupted no man, we took advantage of no man.";
yng[2] = "receive us; no one did we wrong; no one did we waste; no one did we defraud;";
dby[2] = "Receive us: we have injured no one, we have ruined no one, we have made gain of no one.";
web[2] = "Receive us; we have wronged no man, we have corrupted no man, we have defrauded no man.";
hnv[2] = "Open your hearts to us. We wronged no one. We corrupted no one. We took advantage of no one.";
vul[2] = "capite nos neminem laesimus neminem corrupimus neminem circumvenimus";
kjv[3] = "I speak not [this] to condemn [you]: for I have said before, that ye are in our hearts to die and live with [you].";
rsv[3] = "I do not say this to condemn you, for I said before that you are in our hearts, to die together and to live together.";
asv[3] = "I say it not to condemn [you]: for I have said before, that ye are in our hearts to die together and live together.";
yng[3] = "not to condemn you do I say [it], for I have said before that in our hearts ye are to die with and to live with;";
dby[3] = "I do not speak for condemnation, for I have already said that ye are in our hearts, to die together, and live together.";
web[3] = "I speak not [this] to condemn [you]: for I have said before, that ye are in our hearts to die and live with [you].";
hnv[3] = "I say this not to condemn you, for I have said before, that you are in our hearts to die together and live together.";
vul[3] = "non ad condemnationem dico praedixi enim quod in cordibus nostris estis ad conmoriendum et ad convivendum";
kjv[4] = "Great [is] my boldness of speech toward you, great [is] my glorying of you: I am filled with comfort, I am exceeding joyful in all our tribulation.";
rsv[4] = "I have great confidence in you; I have great pride in you; I am filled with comfort. With all our affliction, I am overjoyed.";
asv[4] = "Great is my boldness of speech toward you, great is my glorying on your behalf: I am filled with comfort, I overflow with joy in all our affliction.";
yng[4] = "great [is] my freedom of speech unto you, great my glory on your behalf; I have been filled with the comfort, I overabound with the joy on all our tribulation,";
dby[4] = "Great [is] my boldness towards you, great my exulting in respect of you; I am filled with encouragement; I overabound in joy under all our affliction.";
web[4] = "Great [is] my boldness of speech towards you, great [is] my glorying concerning you: I am filled with comfort, I am exceeding joyful in all our tribulation.";
hnv[4] = "Great is my boldness of speech toward you. Great is my boasting on your behalf. I am filled with comfort. I overflow with joy in all our affliction.";
vul[4] = "multa mihi fiducia est apud vos multa mihi gloriatio pro vobis repletus sum consolatione superabundo gaudio in omni tribulatione nostra";
kjv[5] = "For, when we were come into Macedonia, our flesh had no rest, but we were troubled on every side; without [were] fightings, within [were] fears.";
rsv[5] = "For even when we came into Macedo\'nia, our bodies had no rest but we were afflicted at every turn--fighting without and fear within.";
asv[5] = "For even when we were come into Macedonia our flesh had no relief, but [we were] afflicted on every side; without [were] fightings, within [were] fears.";
yng[5] = "for also we, having come to Macedonia, no relaxation hath our flesh had, but on every side we are in tribulation, without [are] fightings, within -- fears;";
dby[5] = "For indeed, when we came into Macedonia, our flesh had no rest, but [we were] afflicted in every way; without combats, within fears.";
web[5] = "For, when we had come into Macedonia, our flesh had no rest, but we were troubled on every side; without [were] fightings, within [were] fears.";
hnv[5] = "For even when we had come into Macedonia, our flesh had no relief, but we were afflicted on every side. Fightings were outside. Fear was inside.";
vul[5] = "nam et cum venissemus Macedoniam nullam requiem habuit caro nostra sed omnem tribulationem passi foris pugnae intus timores";
kjv[6] = "Nevertheless God, that comforteth those that are cast down, comforted us by the coming of Titus;";
rsv[6] = "But God, who comforts the downcast, comforted us by the coming of Titus,";
asv[6] = "Nevertheless he that comforteth the lowly, [even] God, comforted us by the coming of Titus;";
yng[6] = "but He who is comforting the cast-down -- God -- He did comfort us in the presence of Titus;";
dby[6] = "But he who encourages those that are [brought] low, [even] God, encouraged us by the coming of Titus;";
web[6] = "Nevertheless God, that comforteth those that are cast down, comforted us by the coming of Titus;";
hnv[6] = " Nevertheless, he who comforts the lowly, God, comforted us by the coming of Titus;";
vul[6] = "sed qui consolatur humiles consolatus est nos Deus in adventu Titi";
kjv[7] = "And not by his coming only, but by the consolation wherewith he was comforted in you, when he told us your earnest desire, your mourning, your fervent mind toward me; so that I rejoiced the more.";
rsv[7] = "and not only by his coming but also by the comfort with which he was comforted in you, as he told us of your longing, your mourning, your zeal for me, so that I rejoiced still more.";
asv[7] = "and not by his coming only, but also by the comfort wherewith he was comforted in you, while he told us your longing, your mourning, your zeal for me; so that I rejoiced yet more.";
yng[7] = "and not only in his presence, but also in the comfort with which he was comforted over you, declaring to us your longing desire, your lamentation, your zeal for me, so that the more I did rejoice,";
dby[7] = "and not by his coming only, but also through the encouragement with which he was encouraged as to you; relating to us your ardent desire, your mourning, your zeal for me; so that I the more rejoiced.";
web[7] = "And not by his coming only, but by the consolation with which he was comforted in you, when he told us your earnest desire, your mourning, your fervent mind towards me; so that I rejoiced the more.";
hnv[7] = "and not by his coming only, but also by the comfort with which he was comforted in you, while he told us of your longing, your mourning, and your zeal for me; so that I rejoiced still more.";
vul[7] = "non solum autem in adventu eius sed etiam in solacio quo consolatus est in vobis referens nobis vestrum desiderium vestrum fletum vestram aemulationem pro me ita ut magis gauderem";
kjv[8] = "For though I made you sorry with a letter, I do not repent, though I did repent: for I perceive that the same epistle hath made you sorry, though [it were] but for a season.";
rsv[8] = "For even if I made you sorry with my letter, I do not regret it (though I did regret it), for I see that that letter grieved you, though only for a while.";
asv[8] = "For though I made you sorry with my epistle, I do not regret it: though I did regret [it] (for I see that that epistle made you sorry, though but for a season),";
yng[8] = "because even if I made you sorry in the letter, I do not repent -- if even I did repent -- for I perceive that the letter, even if for an hour, did make you sorry.";
dby[8] = "For if also I grieved you in the letter, I do not regret [it], if even I have regretted it; for I see that that letter, if even [it were] only for a time, grieved you.";
web[8] = "For though I made you sorry with a letter, I do not repent, though I did repent: for I perceive that the same epistle hath made you sorry, though [it was] but for a season.";
hnv[8] = "For though I made you sorry with my letter, I do not regret it, though I did regret it. For I see that my letter made you sorry, though just for a while.";
vul[8] = "quoniam et si contristavi vos in epistula non me paenitet et si paeniteret videns quod epistula illa et si ad horam vos contristavit";
kjv[9] = "Now I rejoice, not that ye were made sorry, but that ye sorrowed to repentance: for ye were made sorry after a godly manner, that ye might receive damage by us in nothing.";
rsv[9] = "As it is, I rejoice, not because you were grieved, but because you were grieved into repenting; for you felt a godly grief, so that you suffered no loss through us.";
asv[9] = "I now rejoice, not that ye were made sorry, but that ye were made sorry unto repentance; for ye were made sorry after a godly sort, that ye might suffer loss by us in nothing.";
yng[9] = "I now do rejoice, not that ye were made sorry, but that ye were made sorry to reformation, for ye were made sorry toward God, that in nothing ye might receive damage from us;";
dby[9] = "Now I rejoice, not that ye have been grieved, but that ye have been grieved to repentance; for ye have been grieved according to God, that in nothing ye might be injured by us.";
web[9] = "Now I rejoice, not that ye were made sorry, but that ye sorrowed to repentance: for ye were made sorry after a godly manner, that ye might receive damage by us in nothing.";
hnv[9] = "I now rejoice, not that you were made sorry, but that you were made sorry to repentance. For you were made sorry in a godly way, that you might suffer loss by us in nothing.";
vul[9] = "nunc gaudeo non quia contristati estis sed quia contristati estis ad paenitentiam contristati enim estis secundum Deum ut in nullo detrimentum patiamini ex nobis";
kjv[10] = "For godly sorrow worketh repentance to salvation not to be repented of: but the sorrow of the world worketh death.";
rsv[10] = "For godly grief produces a repentance that leads to salvation and brings no regret, but worldly grief produces death.";
asv[10] = "For godly sorrow worketh repentance unto salvation, [a repentance] which bringeth no regret: but the sorrow of the world worketh death.";
yng[10] = "for the sorrow toward God reformation to salvation not to be repented of doth work, and the sorrow of the world doth work death,";
dby[10] = "For grief according to God works repentance to salvation, never to be regretted; but the grief of the world works death.";
web[10] = "For godly sorrow worketh penitence to salvation not to be repented of: but the sorrow of the world worketh death.";
hnv[10] = "For godly sorrow works repentance to salvation, which brings no regret. But the sorrow of the world works death.";
vul[10] = "quae enim secundum Deum tristitia est paenitentiam in salutem stabilem operatur saeculi autem tristitia mortem operatur";
kjv[11] = "For behold this selfsame thing, that ye sorrowed after a godly sort, what carefulness it wrought in you, yea, [what] clearing of yourselves, yea, [what] indignation, yea, [what] fear, yea, [what] vehement desire, yea, [what] zeal, yea, [what] revenge! In all [things] ye have approved yourselves to be clear in this matter.";
rsv[11] = "For see what earnestness this godly grief has produced in you, what eagerness to clear yourselves, what indignation, what alarm, what longing, what zeal, what punishment! At every point you have proved yourselves guiltless in the matter.";
asv[11] = "For behold, this selfsame thing, that ye were made sorry after a godly sort, what earnest care it wrought in you, yea what clearing of yourselves, yea what indignation, yea what fear, yea what longing, yea what zeal, yea what avenging! In everything ye approved yourselves to be pure in the matter.";
yng[11] = "for, lo, this same thing -- your being made sorry toward God -- how much diligence it doth work in you! but defence, but displeasure, but fear, but longing desire, but zeal, but revenge; in every thing ye did approve yourselves to be pure in the matter.";
dby[11] = "For, behold, this same thing, your being grieved according to God, how much diligence it wrought in *you*, but [what] excusing [of yourselves], but [what] indignation, but [what] fear, but [what] ardent desire, but [what] zeal, but [what] vengeance: in every way ye have proved yourselves to be pure in the matter.";
web[11] = "For behold this very thing, that ye sorrowed after a godly sort, what carefulness it wrought in you, yea, [what] clearing of yourselves, yea, [what] indignation, yea, [what] fear, yea, [what] vehement desire, yea, [what] zeal, yea, [what] avenging! In all [things] ye have approved yourselves to be clear in this matter.";
hnv[11] = "For behold, this same thing, that you were made sorry in a godly way, what earnest care it worked in you. Yes, what defense, indignation, fear, longing, zeal, and vengeance! In everything you demonstrated yourselves to be pure in the matter.";
vul[11] = "ecce enim hoc ipsum secundum Deum contristari vos quantam in vobis operatur sollicitudinem sed defensionem sed indignationem sed timorem sed desiderium sed aemulationem sed vindictam in omnibus exhibuistis vos incontaminatos esse negotio";
kjv[12] = "Wherefore, though I wrote unto you, [I did it] not for his cause that had done the wrong, nor for his cause that suffered wrong, but that our care for you in the sight of God might appear unto you.";
rsv[12] = "So although I wrote to you, it was not on account of the one who did the wrong, nor on account of the one who suffered the wrong, but in order that your zeal for us might be revealed to you in the sight of God.";
asv[12] = "So although I wrote unto you, [I wrote] not for his cause that did the wrong, nor for his cause that suffered the wrong, but that your earnest care for us might be made manifest unto you in the sight of God.";
yng[12] = "If, then, I also wrote to you -- not for his cause who did wrong, nor for his cause who did suffer wrong, but for our diligence in your behalf being manifested unto you before God --";
dby[12] = "So then, if also I wrote to you, [it was] not for the sake of him that injured, nor for the sake of him that was injured, but for the sake of our diligent zeal for you being manifested to you before God.";
web[12] = "Wherefore, though I wrote to you, [I did it] not for his cause that had done the wrong, nor for his cause that suffered wrong, but that our care for you in the sight of God might appear to you.";
hnv[12] = "So although I wrote to you, I wrote not for his cause that did the wrong, nor for his cause that suffered the wrong, but that your earnest care for us might be revealed in you in the sight of God.";
vul[12] = "igitur et si scripsi vobis non propter eum qui fecit iniuriam nec propter eum qui passus est sed ad manifestandam sollicitudinem nostram quam pro vobis habemus ad vos coram Deo";
kjv[13] = "Therefore we were comforted in your comfort: yea, and exceedingly the more joyed we for the joy of Titus, because his spirit was refreshed by you all.";
rsv[13] = "Therefore we are comforted. And besides our own comfort we rejoiced still more at the joy of Titus, because his mind has been set at rest by you all.";
asv[13] = "Therefore we have been comforted: and in our comfort we joyed the more exceedingly for the joy of Titus, because his spirit hath been refreshed by you all.";
yng[13] = "because of this we have been comforted in your comfort, and more abundantly the more did we rejoice in the joy of Titus, that his spirit hath been refreshed from you all;";
dby[13] = "For this reason we have been encouraged. And we the rather rejoiced in our encouragement more abundantly by reason of the joy of Titus, because his spirit has been refreshed by you all.";
web[13] = "Therefore we were comforted in your comfort: and exceedingly the more we rejoiced for the joy of Titus, because his spirit was refreshed by you all.";
hnv[13] = "Therefore we have been comforted. In our comfort we rejoiced the more exceedingly for the joy of Titus, because his spirit has been refreshed by you all.";
vul[13] = "ideo consolati sumus in consolatione autem nostra abundantius magis gavisi sumus super gaudium Titi quia refectus est spiritus eius ab omnibus vobis";
kjv[14] = "For if I have boasted any thing to him of you, I am not ashamed; but as we spake all things to you in truth, even so our boasting, which [I made] before Titus, is found a truth.";
rsv[14] = "For if I have expressed to him some pride in you, I was not put to shame; but just as everything we said to you was true, so our boasting before Titus has proved true.";
asv[14] = "For if in anything I have gloried to him on your behalf, I was not put to shame; but as we spake all things to you in truth, so our glorying also which I made before Titus was found to be truth.";
yng[14] = "because if anything to him in your behalf I have boasted, I was not put to shame; but as all things in truth we did speak to you, so also our boasting before Titus became truth,";
dby[14] = "Because if I boasted to him anything about you, I have not been put to shame; but as we have spoken to you all things in truth, so also our boasting to Titus has been [the] truth;";
web[14] = "For if I have boasted any thing to him concerning you, I am not ashamed; but as we spoke all things to you in truth, even so our boasting, which [I made] before Titus, is found a truth.";
hnv[14] = "For if in anything I have boasted to him on your behalf, I was not disappointed. But as we spoke all things to you in truth, so our glorying also which I made before Titus was found to be truth.";
vul[14] = "et si quid apud illum de vobis gloriatus sum non sum confusus sed sicut omnia vobis in veritate locuti sumus ita et gloriatio nostra quae fuit ad Titum veritas facta est";
kjv[15] = "And his inward affection is more abundant toward you, whilst he remembereth the obedience of you all, how with fear and trembling ye received him.";
rsv[15] = "And his heart goes out all the more to you, as he remembers the obedience of you all, and the fear and trembling with which you received him.";
asv[15] = "And his affection is more abundantly toward you, while he remembereth the obedience of you all, how with fear and trembling ye received him.";
yng[15] = "and his tender affection is more abundantly toward you, remembering the obedience of you all, how with fear and trembling ye did receive him;";
dby[15] = "and his affections are more abundantly towards you, calling to mind the obedience of you all, how with fear and trembling ye received him.";
web[15] = "And his tender affection is more abundant towards you, whilst he remembereth the obedience of you all, how with fear and trembling ye received him.";
hnv[15] = "His affection is more abundantly toward you, while he remembers all of your obedience, how with fear and trembling you received him.";
vul[15] = "et viscera eius abundantius in vos sunt reminiscentis omnium vestrum oboedientiam quomodo cum timore et tremore excepistis eum";
kjv[16] = "I rejoice therefore that I have confidence in you in all [things].";
rsv[16] = "I rejoice, because I have perfect confidence in you.";
asv[16] = "I rejoice that in everything I am of good courage concerning you.";
yng[16] = "I rejoice, therefore, that in everything I have courage in you.";
dby[16] = "I rejoice that in everything I am confident as to you.";
web[16] = "I rejoice therefore that I have confidence in you in all [things].";
hnv[16] = "I rejoice that in everything I am of good courage concerning you.";
vul[16] = "gaudeo quod in omnibus confido in vobis";
