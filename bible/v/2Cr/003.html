csb[1] = "Are we beginning to commend ourselves again? Or do we need, like some, letters of recommendation to you or from you?";
csb[2] = "You yourselves are our letter, written on our hearts, known and read by everyone.";
csb[3] = "You show that you are Christ\'s letter, delivered by us, not written with ink but with the Spirit of the living God -- not on tablets of stone but on tablets of human hearts.";
csb[4] = "Such is the confidence we have through Christ before God.";
csb[5] = "It is not that we are competent in ourselves to claim anything as coming from ourselves, but our adequacy is from God.";
csb[6] = "He has made us competent to be ministers of a new covenant, not of the letter, but of the Spirit. For the letter kills, but the Spirit gives life.";
csb[7] = "Now if the ministry that brought death, chiseled in letters on stones, came with glory, so that the Israelites were not able to gaze steadily at Moses\'s face because of its glory, which was set aside,";
csb[8] = "how will the ministry of the Spirit not be more glorious?";
csb[9] = "For if the ministry that brought condemnation had glory, the ministry that brings righteousness overflows with even more glory.";
csb[10] = "In fact, what had been glorious is not glorious now by comparison because of the glory that surpasses it.";
csb[11] = "For if what was set aside was glorious, what endures will be even more glorious.";
csb[12] = "Since, then, we have such a hope, we act with great boldness.";
csb[13] = "We are not like Moses, who used to put a veil over his face to prevent the Israelites from gazing steadily until the end of the glory of what was being set aside,";
csb[14] = "but their minds were hardened. For to this day, at the reading of the old covenant, the same veil remains; it is not lifted, because it is set aside only in Christ.";
csb[15] = "Yet still today, whenever Moses is read, a veil lies over their hearts,";
csb[16] = "but whenever a person turns to the Lord, the veil is removed.";
csb[17] = "Now the Lord is the Spirit, and where the Spirit of the Lord is, there is freedom.";
csb[18] = "We all, with unveiled faces, are looking as in a mirror at the glory of the Lord and are being transformed into the same image from glory to glory; this is from the Lord who is the Spirit.";
kjv[1] = "Do we begin again to commend ourselves? or need we, as some [others], epistles of commendation to you, or [letters] of commendation from you?";
rsv[1] = "Are we beginning to commend ourselves again? Or do we need, as some do, letters of recommendation to you, or from you?";
asv[1] = "Are we beginning again to commend ourselves? or need we, as do some, epistles of commendation to you or from you?";
yng[1] = "Do we begin again to recommend ourselves, except we need, as some, letters of recommendation unto you, or from you?";
dby[1] = "Do we begin again to commend ourselves? or do we need, as some, commendatory letters to you, or [commendatory] from you?";
web[1] = "Do we begin again to commend ourselves? or need we, as some [others], epistles of commendation to you, or [letters] of commendation from you.";
hnv[1] = "Are we beginning again to commend ourselves? Or do we need, as do some, letters of commendation to you or from you?";
vul[1] = "incipimus iterum nosmet ipsos commendare aut numquid egemus sicut quidam commendaticiis epistulis ad vos aut ex vobis";
kjv[2] = "Ye are our epistle written in our hearts, known and read of all men:";
rsv[2] = "You yourselves are our letter of recommendation, written on your hearts, to be known and read by all men;";
asv[2] = "Ye are our epistle, written in our hearts, known and read of all men;";
yng[2] = "our letter ye are, having been written in our hearts, known and read by all men,";
dby[2] = "*Ye* are our letter, written in our hearts, known and read of all men,";
web[2] = "Ye are our epistle written in our hearts, known and read by all men:";
hnv[2] = "You are our letter, written in our hearts, known and read by all men;";
vul[2] = "epistula nostra vos estis scripta in cordibus nostris quae scitur et legitur ab omnibus hominibus";
kjv[3] = "[Forasmuch as ye are] manifestly declared to be the epistle of Christ ministered by us, written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart.";
rsv[3] = "and you show that you are a letter from Christ delivered by us, written not with ink but with the Spirit of the living God, not on tablets of stone but on tablets of human hearts.";
asv[3] = "being made manifest that ye are an epistle of Christ, ministered by us, written not with ink, but with the Spirit of the living God; not in tables of stone, but in tables [that are] hearts of flesh.";
yng[3] = "manifested that ye are a letter of Christ ministered by us, written not with ink, but with the Spirit of the living God, not in the tablets of stone, but in fleshy tablets of the heart,";
dby[3] = "being manifested to be Christ\'s epistle ministered by us, written, not with ink, but [the] Spirit of [the] living God; not on stone tables, but on fleshy tables of [the] heart.";
web[3] = "[Forasmuch as ye are] manifestly declared to be the epistle of Christ ministered by us, written not with ink, but with the Spirit of the living God; not on tables of stone, but on fleshly tables of the heart.";
hnv[3] = "being revealed that you are a letter of Messiah, ministered by us, written not with ink, but with the Spirit of the living God; not in tablets of stone, but in tablets that are hearts of flesh.";
vul[3] = "manifestati quoniam epistula estis Christi ministrata a nobis et scripta non atramento sed Spiritu Dei vivi non in tabulis lapideis sed in tabulis cordis carnalibus";
kjv[4] = "And such trust have we through Christ to God-ward:";
rsv[4] = "Such is the confidence that we have through Christ toward God.";
asv[4] = "And such confidence have we through Christ to God-ward:";
yng[4] = "and such trust we have through the Christ toward God,";
dby[4] = "And such confidence have we through the Christ towards God:";
web[4] = "And such trust we have through Christ toward God.";
hnv[4] = "Such confidence we have through Messiah toward God;";
vul[4] = "fiduciam autem talem habemus per Christum ad Deum";
kjv[5] = "Not that we are sufficient of ourselves to think any thing as of ourselves; but our sufficiency [is] of God;";
rsv[5] = "Not that we are competent of ourselves to claim anything as coming from us; our competence is from God,";
asv[5] = "not that we are sufficient of ourselves, to account anything as from ourselves; but our sufficiency is from God;";
yng[5] = "not that we are sufficient of ourselves to think anything, as of ourselves, but our sufficiency [is] of God,";
dby[5] = "not that we are competent of ourselves to think anything as of ourselves, but our competency [is] of God;";
web[5] = "Not that we are sufficient by ourselves to think any thing as from ourselves; but our sufficiency [is] from God;";
hnv[5] = "not that we are sufficient of ourselves, to account anything as from ourselves; but our sufficiency is from God;";
vul[5] = "non quod sufficientes simus cogitare aliquid a nobis quasi ex nobis sed sufficientia nostra ex Deo est";
kjv[6] = "Who also hath made us able ministers of the new testament; not of the letter, but of the spirit: for the letter killeth, but the spirit giveth life.";
rsv[6] = "who has made us competent to be ministers of a new covenant, not in a written code but in the Spirit; for the written code kills, but the Spirit gives life.";
asv[6] = "who also made us sufficient as ministers of a new covenant; not of the letter, but of the spirit: for the letter killeth, but the spirit giveth life.";
yng[6] = "who also made us sufficient [to be] ministrants of a new covenant, not of letter, but of spirit; for the letter doth kill, and the spirit doth make alive.";
dby[6] = "who has also made us competent, [as] ministers of [the] new covenant; not of letter, but of spirit. For the letter kills, but the Spirit quickens.";
web[6] = "Who also hath made us able ministers of the new testament; not of the letter, but of the spirit: for the letter killeth, but the spirit giveth life.";
hnv[6] = "who also made us sufficient as servants of a new covenant; not of the letter, but of the Spirit. For the letter kills, but the Spirit gives life.";
vul[6] = "qui et idoneos nos fecit ministros novi testamenti non litterae sed Spiritus littera enim occidit Spiritus autem vivificat";
kjv[7] = "But if the ministration of death, written [and] engraven in stones, was glorious, so that the children of Israel could not stedfastly behold the face of Moses for the glory of his countenance; which [glory] was to be done away:";
rsv[7] = "Now if the dispensation of death, carved in letters on stone, came with such splendor that the Israelites could not look at Moses\' face because of its brightness, fading as this was,";
asv[7] = "But if the ministration of death, written, [and] engraven on stones, came with glory, so that the children of Israel could not look stedfastly upon the face of Moses for the glory of his face; which [glory] was passing away:";
yng[7] = "and if the ministration of the death, in letters, engraved in stones, came in glory, so that the sons of Israel were not able to look stedfastly to the face of Moses, because of the glory of his face -- which was being made useless,";
dby[7] = "(But if the ministry of death, in letters, graven in stones, began with glory, so that the children of Israel could not fix their eyes on the face of Moses, on account of the glory of his face, [a glory] which is annulled;";
web[7] = "But if the ministration of death, written [and] engraven on stones, was glorious, so that the children of Israel could not steadfastly behold the face of Moses for the glory of his countenance; which [glory] was to be done away;";
hnv[7] = "But if the service of death, written engraved on stones, came with glory, so that the children of Yisra\'el could not look steadfastly on the face of Moshe for the glory of his face; which was passing away:";
vul[7] = "quod si ministratio mortis litteris deformata in lapidibus fuit in gloria ita ut non possent intendere filii Israhel in faciem Mosi propter gloriam vultus eius quae evacuatur";
kjv[8] = "How shall not the ministration of the spirit be rather glorious?";
rsv[8] = "will not the dispensation of the Spirit be attended with greater splendor?";
asv[8] = "how shall not rather the ministration of the spirit be with glory?";
yng[8] = "how shall the ministration of the Spirit not be more in glory?";
dby[8] = "how shall not rather the ministry of the Spirit subsist in glory?";
web[8] = "How shall not the ministration of the Spirit be rather glorious?";
hnv[8] = "won\'t service of the Spirit be with much more glory?";
vul[8] = "quomodo non magis ministratio Spiritus erit in gloria";
kjv[9] = "For if the ministration of condemnation [be] glory, much more doth the ministration of righteousness exceed in glory.";
rsv[9] = "For if there was splendor in the dispensation of condemnation, the dispensation of righteousness must far exceed it in splendor.";
asv[9] = "For if the ministration of condemnation hath glory, much rather doth the ministration of righteousness exceed in glory.";
yng[9] = "for if the ministration of the condemnation [is] glory, much more doth the ministration of the righteousness abound in glory;";
dby[9] = "For if the ministry of condemnation [be] glory, much rather the ministry of righteousness abounds in glory.";
web[9] = "For if the ministration of condemnation [was] glory, much more doth the ministration of righteousness exceed in glory.";
hnv[9] = "For if the service of condemnation has glory, the service of righteousness exceeds much more in glory.";
vul[9] = "nam si ministratio damnationis gloria est multo magis abundat ministerium iustitiae in gloria";
kjv[10] = "For even that which was made glorious had no glory in this respect, by reason of the glory that excelleth.";
rsv[10] = "Indeed, in this case, what once had splendor has come to have no splendor at all, because of the splendor that surpasses it.";
asv[10] = "For verily that which hath been made glorious hath not been made glorious in this respect, by reason of the glory that surpasseth.";
yng[10] = "for also even that which hath been glorious, hath not been glorious -- in this respect, because of the superior glory;";
dby[10] = "For also that [which was] glorified is not glorified in this respect, on account of the surpassing glory.";
web[10] = "For even that which was made glorious had no glory in this respect, by reason of the glory that excelleth.";
hnv[10] = "For most assuredly that which has been made glorious has not been made glorious in this respect, by reason of the glory that surpasses.";
vul[10] = "nam nec glorificatum est quod claruit in hac parte propter excellentem gloriam";
kjv[11] = "For if that which is done away [was] glorious, much more that which remaineth [is] glorious.";
rsv[11] = "For if what faded away came with splendor, what is permanent must have much more splendor.";
asv[11] = "For if that which passeth away [was] with glory, much more that which remaineth [is] in glory.";
yng[11] = "for if that which is being made useless [is] through glory, much more that which is remaining [is] in glory.";
dby[11] = "For if that annulled [was introduced] with glory, much rather that which abides [subsists] in glory.";
web[11] = "For if that which was done away [was] glorious, much more that which remaineth [is] glorious.";
hnv[11] = " For if that which passes away was with glory, much more that which remains is in glory.";
vul[11] = "si enim quod evacuatur per gloriam est multo magis quod manet in gloria est";
kjv[12] = "Seeing then that we have such hope, we use great plainness of speech:";
rsv[12] = "Since we have such a hope, we are very bold,";
asv[12] = "Having therefore such a hope, we use great boldness of speech,";
yng[12] = "Having, then, such hope, we use much freedom of speech,";
dby[12] = "Having therefore such hope, we use much boldness:";
web[12] = "Seeing then that we have such hope, we use great plainness of speech:";
hnv[12] = "Having therefore such a hope, we use great boldness of speech,";
vul[12] = "habentes igitur talem spem multa fiducia utimur";
kjv[13] = "And not as Moses, [which] put a vail over his face, that the children of Israel could not stedfastly look to the end of that which is abolished:";
rsv[13] = "not like Moses, who put a veil over his face so that the Israelites might not see the end of the fading splendor.";
asv[13] = "and [are] not as Moses, [who] put a veil upon his face, that the children of Israel should not look stedfastly on the end of that which was passing away:";
yng[13] = "and [are] not as Moses, who was putting a vail upon his own face, for the sons of Israel not stedfastly to look to the end of that which is being made useless,";
dby[13] = "and not according as Moses put a veil on his own face, so that the children of Israel should not fix their eyes on the end of that annulled.";
web[13] = "And not as Moses, [who] put a vail over his face, that the children of Israel could not steadfastly look to the end of that which is abolished:";
hnv[13] = "and not as Moshe, who put a veil on his face, that the children of Yisra\'el wouldn\'t look steadfastly on the end of that which was passing away.";
vul[13] = "et non sicut Moses ponebat velamen super faciem suam ut non intenderent filii Israhel in faciem eius quod evacuatur";
kjv[14] = "But their minds were blinded: for until this day remaineth the same vail untaken away in the reading of the old testament; which [vail] is done away in Christ.";
rsv[14] = "But their minds were hardened; for to this day, when they read the old covenant, that same veil remains unlifted, because only through Christ is it taken away.";
asv[14] = "but their minds were hardened: for until this very day at the reading of the old covenant the same veil remaineth, it not being revealed [to them] that it is done away in Christ.";
yng[14] = "but their minds were hardened, for unto this day the same vail at the reading of the Old Covenant doth remain unwithdrawn -- which in Christ is being made useless --";
dby[14] = "But their thoughts have been darkened, for unto this day the same veil remains in reading the old covenant, unremoved, which in Christ is annulled.";
web[14] = "But their minds were blinded: for until this day the same vail remaineth untaken away in the reading of the old testament; which [vail] is done away in Christ.";
hnv[14] = "But their minds were hardened, for until this very day at the reading of the old covenant the same veil remains, because in Messiah it passes away.";
vul[14] = "sed obtusi sunt sensus eorum usque in hodiernum enim diem id ipsum velamen in lectione veteris testamenti manet non revelatum quoniam in Christo evacuatur";
kjv[15] = "But even unto this day, when Moses is read, the vail is upon their heart.";
rsv[15] = "Yes, to this day whenever Moses is read a veil lies over their minds;";
asv[15] = "But unto this day, whensoever Moses is read, a veil lieth upon their heart.";
yng[15] = "but till to-day, when Moses is read, a vail upon their heart doth lie,";
dby[15] = "But unto this day, when Moses is read, the veil lies upon their heart.";
web[15] = "But even to this day, when Moses is read, the vail is upon their heart.";
hnv[15] = "But to this day, when Moshe is read, a veil lies on their heart.";
vul[15] = "sed usque in hodiernum diem cum legitur Moses velamen est positum super cor eorum";
kjv[16] = "Nevertheless when it shall turn to the Lord, the vail shall be taken away.";
rsv[16] = "but when a man turns to the Lord the veil is removed.";
asv[16] = "But whensoever it shall turn to the Lord, the veil is taken away.";
yng[16] = "and whenever they may turn unto the Lord, the vail is taken away.";
dby[16] = "But when it shall turn to [the] Lord, the veil is taken away.)";
web[16] = "Nevertheless, when it shall turn to the Lord, the vail shall be taken away.";
hnv[16] = "But whenever one turns to the Lord, the veil is taken away.";
vul[16] = "cum autem conversus fuerit ad Deum aufertur velamen";
kjv[17] = "Now the Lord is that Spirit: and where the Spirit of the Lord [is], there [is] liberty.";
rsv[17] = "Now the Lord is the Spirit, and where the Spirit of the Lord is, there is freedom.";
asv[17] = "Now the Lord is the Spirit: and where the Spirit of the Lord is, [there] is liberty.";
yng[17] = "And the Lord is the Spirit; and where the Spirit of the Lord [is], there [is] liberty;";
dby[17] = "Now the Lord is the Spirit, but where the Spirit of [the] Lord [is, there is] liberty.";
web[17] = "Now the Lord is that Spirit: and where the Spirit of the Lord [is], there [is] liberty.";
hnv[17] = "Now the Lord is the Spirit and where the Spirit of the Lord is, there is liberty.";
vul[17] = "Dominus autem Spiritus est ubi autem Spiritus Domini ibi libertas";
kjv[18] = "But we all, with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, [even] as by the Spirit of the Lord.";
rsv[18] = "And we all, with unveiled face, beholding the glory of the Lord, are being changed into his likeness from one degree of glory to another; for this comes from the Lord who is the Spirit.";
asv[18] = "But we all, with unveiled face beholding as in a mirror the glory of the Lord, are transformed into the same image from glory to glory, even as from the Lord the Spirit.";
yng[18] = "and we all, with unvailed face, the glory of the Lord beholding in a mirror, to the same image are being transformed, from glory to glory, even as by the Spirit of the Lord.";
dby[18] = "But *we* all, looking on the glory of the Lord, with unveiled face, are transformed according to the same image from glory to glory, even as by [the] Lord [the] Spirit.";
web[18] = "But we all, with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, [even] as by the Spirit of the Lord.";
hnv[18] = "But we all, with unveiled face beholding as in a mirror the glory of the Lord, are transformed into the same image from glory to glory, even as from the Lord, the Spirit.";
vul[18] = "nos vero omnes revelata facie gloriam Domini speculantes in eandem imaginem transformamur a claritate in claritatem tamquam a Domini Spiritu";
