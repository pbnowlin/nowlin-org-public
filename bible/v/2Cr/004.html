csb[1] = "Therefore, since we have this ministry because we were shown mercy, we do not give up.";
csb[2] = "Instead, we have renounced secret and shameful things, not acting deceitfully or distorting the word of God, but commending ourselves before God to everyone\'s conscience by an open display of the truth.";
csb[3] = "But if our gospel is veiled, it is veiled to those who are perishing.";
csb[4] = "In their case, the god of this age has blinded the minds of the unbelievers to keep them from seeing the light of the gospel of the glory of Christ, who is the image of God.";
csb[5] = "For we are not proclaiming ourselves but Jesus Christ as Lord, and ourselves as your servants for Jesus\'s sake.";
csb[6] = "For God who said, &quot;Let light shine out of darkness,&quot; has shone in our hearts to give the light of the knowledge of God\'s glory in the face of Jesus Christ.";
csb[7] = "Now we have this treasure in clay jars, so that this extraordinary power may be from God and not from us.";
csb[8] = "We are afflicted in every way but not crushed; we are perplexed but not in despair;";
csb[9] = "we are persecuted but not abandoned; we are struck down but not destroyed.";
csb[10] = "We always carry the death of Jesus in our body, so that the life of Jesus may also be displayed in our body.";
csb[11] = "For we who live are always being given over to death for Jesus\'s sake, so that Jesus\'s life may also be displayed in our mortal flesh.";
csb[12] = "So then, death is at work in us, but life in you.";
csb[13] = "And since we have the same spirit of faith in keeping with what is written, I believed, therefore I spoke, we also believe, and therefore speak.";
csb[14] = "For we know that the one who raised the Lord Jesus will also raise us with Jesus and present us with you.";
csb[15] = "Indeed, everything is for your benefit so that, as grace extends through more and more people, it may cause thanksgiving to increase to the glory of God.";

csb[17] = "For our momentary light affliction is producing for us an absolutely incomparable eternal weight of glory.";
