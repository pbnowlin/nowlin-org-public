csb[1] = "This is the third time I am coming to you. Every matter must be established by the testimony of two or three witnesses.";
csb[2] = "I gave a warning when I was present the second time, and now I give a warning while I am absent to those who sinned before and to all the rest: If I come again, I will not be lenient,";
csb[3] = "since you seek proof of Christ speaking in me. He is not weak in dealing with you, but powerful among you.";
csb[4] = "For he was crucified in weakness, but he lives by the power of God. For we also are weak in him, but in dealing with you we will live with him by God\'s power.";
csb[5] = "Test yourselves to see if you are in the faith. Examine yourselves. Or do you yourselves not recognize that Jesus Christ is in you? -- unless you fail the test.";
csb[6] = "And I hope you will recognize that we ourselves do not fail the test.";
csb[7] = "But we pray to God that you do nothing wrong -- not that we may appear to pass the test, but that you may do what is right, even though we may appear to fail.";
csb[8] = "For we can\'t do anything against the truth, but only for the truth.";
csb[9] = "We rejoice when we are weak and you are strong. We also pray that you become fully mature.";
csb[10] = "This is why I am writing these things while absent, so that when I am there I may not have to deal harshly with you, in keeping with the authority the Lord gave me for building up and not for tearing down.";
csb[11] = "Finally, brothers and sisters, rejoice. Become mature, be encouraged, be of the same mind, be at peace, and the God of love and peace will be with you.";
csb[12] = "Greet one another with a holy kiss. All the saints send you greetings.";
csb[13] = "The grace of the Lord Jesus Christ, and the love of God, and the fellowship of the Holy Spirit be with you all.";
csb[14] = " ";
