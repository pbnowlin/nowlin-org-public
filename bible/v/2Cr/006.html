csb[1] = "Working together with him, we also appeal to you, &quot;Don\'t receive the grace of God in vain.&quot;";
csb[2] = "For he says: At an acceptable time I listened to you, and in the day of salvation I helped you. See, now is the acceptable time; now is the day of salvation!";
csb[3] = "We are not giving anyone an occasion for offense, so that the ministry will not be blamed.";
csb[4] = "Instead, as God\'s ministers, we commend ourselves in everything: by great endurance, by afflictions, by hardships, by difficulties,";
csb[5] = "by beatings, by imprisonments, by riots, by labors, by sleepless nights, by times of hunger,";
csb[6] = "by purity, by knowledge, by patience, by kindness, by the Holy Spirit, by sincere love,";
csb[7] = "by the word of truth, by the power of God; through weapons of righteousness for the right hand and the left,";
csb[8] = "through glory and dishonor, through slander and good report; regarded as deceivers, yet true;";
csb[9] = "as unknown, yet recognized; as dying, yet see -- we live; as being disciplined, yet not killed;";
csb[10] = "as grieving, yet always rejoicing; as poor, yet enriching many; as having nothing, yet possessing everything.";
csb[11] = "We have spoken openly to you, Corinthians; our heart has been opened wide.";
csb[12] = "We are not withholding our affection from you, but you are withholding yours from us.";
csb[13] = "I speak as to my children; as a proper response, open your heart to us.";
csb[14] = "Don\'t become partners with those who do not believe. For what partnership is there between righteousness and lawlessness? Or what fellowship does light have with darkness?";
csb[15] = "What agreement does Christ have with Belial? Or what does a believer have in common with an unbeliever?";
csb[16] = "And what agreement does the temple of God have with idols? For we are the temple of the living God, as God said: I will dwell and walk among them, and I will be their God, and they will be my people.";
csb[17] = "Therefore, come out from among them and be separate, says the Lord; do not touch any unclean thing, and I will welcome you.";
csb[18] = "And I will be a Father to you, and you will be sons and daughters to me, says the Lord Almighty.";
