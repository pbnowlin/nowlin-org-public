csb[1] = "Paul, an apostle of Christ Jesus by God\'s will, and Timothy our brother: To the church of God at Corinth, with all the saints who are throughout Achaia.";
csb[2] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
csb[3] = "Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies and the God of all comfort.";
csb[4] = "He comforts us in all our affliction, so that we may be able to comfort those who are in any kind of affliction, through the comfort we ourselves receive from God.";
csb[5] = "For just as the sufferings of Christ overflow to us, so also through Christ our comfort overflows.";
csb[6] = "If we are afflicted, it is for your comfort and salvation. If we are comforted, it is for your comfort, which produces in you patient endurance of the same sufferings that we suffer.";
csb[7] = "And our hope for you is firm, because we know that as you share in the sufferings, so you will also share in the comfort.";
csb[8] = "We don\'t want you to be unaware, brothers and sisters, of our affliction that took place in Asia. We were completely overwhelmed -- beyond our strength -- so that we even despaired of life itself.";
csb[9] = "Indeed, we felt that we had received the sentence of death, so that we would not trust in ourselves but in God who raises the dead.";
csb[10] = "He has delivered us from such a terrible death, and he will deliver us. We have put our hope in him that he will deliver us again";
csb[11] = "while you join in helping us by your prayers. Then many will give thanks on our behalf for the gift that came to us through the prayers of many.";
csb[12] = "Indeed, this is our boast: The testimony of our conscience is that we have conducted ourselves in the world, and especially toward you, with godly sincerity and purity, not by human wisdom but by God\'s grace.";
csb[13] = "For we are writing nothing to you other than what you can read and also understand. I hope you will understand completely --";
csb[14] = "just as you have partially understood us -- that we are your reason for pride, just as you also are ours in the day of our Lord Jesus.";
csb[15] = "Because of this confidence, I planned to come to you first, so that you could have a second benefit,";
csb[16] = "and to visit you on my way to Macedonia, and then come to you again from Macedonia and be helped by you on my journey to Judea.";
csb[17] = "Now when I planned this, was I of two minds? Or what I plan, do I plan in a purely human way so that I say &quot;Yes, yes&quot; and &quot;No, no&quot; at the same time?";
csb[18] = "As God is faithful, our message to you is not &quot;Yes and no.&quot;";
csb[19] = "For the Son of God, Jesus Christ, whom we proclaimed among you -- Silvanus, Timothy, and I -- did not become &quot;Yes and no.&quot; On the contrary, in him it is always &quot;Yes.&quot;";
csb[20] = "For every one of God\'s promises is &quot;Yes&quot; in him. Therefore, through him we also say &quot;Amen&quot; to the glory of God.";
csb[21] = "Now it is God who strengthens us together with you in Christ, and who has anointed us.";
csb[22] = "He has also put his seal on us and given us the Spirit in our hearts as a down payment.";
csb[23] = "I call on God as a witness, on my life, that it was to spare you that I did not come to Corinth.";
csb[24] = "I do not mean that we lord it over your faith, but we are workers with you for your joy, because you stand firm in your faith.";
