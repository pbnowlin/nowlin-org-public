csb[1] = "Now I Paul, myself, appeal to you by the meekness and gentleness of Christ -- I who am humble among you in person but bold toward you when absent.";
csb[2] = "I beg you that when I am present I will not need to be bold with the confidence by which I plan to challenge certain people who think we are behaving according to the flesh.";
csb[3] = "For although we live in the flesh, we do not wage war according to the flesh,";
csb[4] = "since the weapons of our warfare are not of the flesh, but are powerful through God for the demolition of strongholds. We demolish arguments";
csb[5] = "and every proud thing that is raised up against the knowledge of God, and we take every thought captive to obey Christ.";
csb[6] = "And we are ready to punish any disobedience, once your obedience is complete.";
csb[7] = "Look at what is obvious. If anyone is confident that he belongs to Christ, let him remind himself of this: Just as he belongs to Christ, so do we.";
csb[8] = "For if I boast a little too much about our authority, which the Lord gave for building you up and not for tearing you down, I will not be put to shame.";
csb[9] = "I don\'t want to seem as though I am trying to terrify you with my letters.";
csb[10] = "For it is said, &quot;His letters are weighty and powerful, but his physical presence is weak and his public speaking amounts to nothing.&quot;";
csb[11] = "Let such a person consider this: What we are in our letters, when we are absent, we will also be in our actions when we are present.";
csb[12] = "For we don\'t dare classify or compare ourselves with some who commend themselves. But in measuring themselves by themselves and comparing themselves to themselves, they lack understanding.";
csb[13] = "We, however, will not boast beyond measure but according to the measure of the area of ministry that God has assigned to us, which reaches even to you.";
csb[14] = "For we are not overextending ourselves, as if we had not reached you, since we have come to you with the gospel of Christ.";
csb[15] = "We are not boasting beyond measure about other people\'s labors. On the contrary, we have the hope that as your faith increases, our area of ministry will be greatly enlarged,";
csb[16] = "so that we may preach the gospel to the regions beyond you without boasting about what has already been done in someone else\'s area of ministry.";
csb[17] = "So let the one who boasts, boast in the Lord.";
csb[18] = "For it is not the one commending himself who is approved, but the one the Lord commends.";
kjv[1] = "Now I Paul myself beseech you by the meekness and gentleness of Christ, who in presence [am] base among you, but being absent am bold toward you:";
rsv[1] = "I, Paul, myself entreat you, by the meekness and gentleness of Christ--I who am humble when face to face with you, but bold to you when I am away!--";
asv[1] = "Now I Paul myself entreat you by the meekness and gentleness of Christ, I who in your presence am lowly among you, but being absent am of good courage toward you:";
yng[1] = "And I, Paul, myself, do call upon you -- through the meekness and gentleness of the Christ -- who in presence, indeed [am] humble among you, and being absent, have courage toward you,";
dby[1] = "But I myself, Paul, entreat you by the meekness and gentleness of the Christ, who, as to appearance, [when present] [am] mean among you, but absent am bold towards you;";
web[1] = "Now I Paul myself beseech you, by the meekness and gentleness of Christ, who in presence [am] base among you, but being absent am bold towards you:";
hnv[1] = "Now I Sha\'ul, myself, entreat you by the humility and gentleness of Messiah; I who in your presence am lowly among you, but being absent am of good courage toward you.";
vul[1] = "ipse autem ego Paulus obsecro vos per mansuetudinem et modestiam Christi qui in facie quidem humilis inter vos absens autem confido in vobis";
kjv[2] = "But I beseech [you], that I may not be bold when I am present with that confidence, wherewith I think to be bold against some, which think of us as if we walked according to the flesh.";
rsv[2] = "I beg of you that when I am present I may not have to show boldness with such confidence as I count on showing against some who suspect us of acting in worldly fashion.";
asv[2] = "yea, I beseech you, that I may not when present show courage with the confidence wherewith I count to be bold against some, who count of us as if we walked according to the flesh.";
yng[2] = "and I beseech [you], that, being present, I may not have courage, with the confidence with which I reckon to be bold against certain reckoning us as walking according to the flesh;";
dby[2] = "but I beseech that present I may not be bold with the confidence with which I think to be daring towards some who think of us as walking according to flesh.";
web[2] = "But I beseech [you], that I may not be bold when I am present with that confidence, with which I think to be bold against some, who think of us as if we walked according to the flesh.";
hnv[2] = "Yes, I beg you that I may not, when present, show courage with the confidence with which I intend to be bold against some, who consider us to be walking according to the flesh.";
vul[2] = "rogo autem ne praesens audeam per eam confidentiam qua existimo audere in quosdam qui arbitrantur nos tamquam secundum carnem ambulemus";
kjv[3] = "For though we walk in the flesh, we do not war after the flesh:";
rsv[3] = "For though we live in the world we are not carrying on a worldly war,";
asv[3] = "For though we walk in the flesh, we do not war according to the flesh";
yng[3] = "for walking in the flesh, not according to the flesh do we war,";
dby[3] = "For walking in flesh, we do not war according to flesh.";
web[3] = "For though we walk in the flesh, we do not war according to the flesh:";
hnv[3] = "For though we walk in the flesh, we don\'t wage war according to the flesh;";
vul[3] = "in carne enim ambulantes non secundum carnem militamus";
kjv[4] = "(For the weapons of our warfare [are] not carnal, but mighty through God to the pulling down of strong holds;)";
rsv[4] = "for the weapons of our warfare are not worldly but have divine power to destroy strongholds.";
asv[4] = "(for the weapons of our warfare are not of the flesh, but mighty before God to the casting down of strongholds);";
yng[4] = "for the weapons of our warfare [are] not fleshly, but powerful to God for bringing down of strongholds,";
dby[4] = "For the arms of our warfare [are] not fleshly, but powerful according to God to [the] overthrow of strongholds;";
web[4] = "(For the weapons of our warfare [are] not carnal, but mighty through God to the pulling down of strong holds;)";
hnv[4] = "for the weapons of our warfare are not of the flesh, but mighty before God to the throwing down of strongholds,";
vul[4] = "nam arma militiae nostrae non carnalia sed potentia Deo ad destructionem munitionum consilia destruentes";
kjv[5] = "Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;";
rsv[5] = "We destroy arguments and every proud obstacle to the knowledge of God, and take every thought captive to obey Christ,";
asv[5] = "casting down imaginations, and every high thing that is exalted against the knowledge of God, and bringing every thought into captivity to the obedience of Christ;";
yng[5] = "reasonings bringing down, and every high thing lifted up against the knowledge of God, and bringing into captivity every thought to the obedience of the Christ,";
dby[5] = "overthrowing reasonings and every high thing that lifts itself up against the knowledge of God, and leading captive every thought into the obedience of the Christ;";
web[5] = "Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;";
hnv[5] = "throwing down imaginations and every high thing that is exalted against the knowledge of God, and bringing every thought into captivity to the obedience of Messiah;";
vul[5] = "et omnem altitudinem extollentem se adversus scientiam Dei et in captivitatem redigentes omnem intellectum in obsequium Christi";
kjv[6] = "And having in a readiness to revenge all disobedience, when your obedience is fulfilled.";
rsv[6] = "being ready to punish every disobedience, when your obedience is complete.";
asv[6] = "and being in readiness to avenge all disobedience, when your obedience shall be made full.";
yng[6] = "and being in readiness to avenge every disobedience, whenever your obedience may be fulfilled.";
dby[6] = "and having in readiness to avenge all disobedience when your obedience shall have been fulfilled.";
web[6] = "And having in a readiness to avenge all disobedience, when your obedience is fulfilled.";
hnv[6] = "and being in readiness to avenge all disobedience, when your obedience will be made full.";
vul[6] = "et in promptu habentes ulcisci omnem inoboedientiam cum impleta fuerit vestra oboedientia";
kjv[7] = "Do ye look on things after the outward appearance? If any man trust to himself that he is Christ\'s, let him of himself think this again, that, as he [is] Christ\'s, even so [are] we Christ\'s.";
rsv[7] = "Look at what is before your eyes. If any one is confident that he is Christ\'s, let him remind himself that as he is Christ\'s, so are we.";
asv[7] = "Ye look at the things that are before your face. If any man trusteth in himself that he is Christ\'s, let him consider this again with himself, that, even as he is Christ\'s, so also are we.";
yng[7] = "The things in presence do ye see? if any one hath trusted in himself to be Christ\'s, this let him reckon again from himself, that according as he is Christ\'s, so also we [are] Christ\'s;";
dby[7] = "Do ye look at what concerns appearance? If any one has confidence in himself that he is of Christ, let him think this again in himself, that even as he [is] of Christ, so also [are] we.";
web[7] = "Do ye look on things after the outward appearance? If any man trusteth to himself that he is Christ\'s, let him of himself think this again, that, as he [is] Christ\'s, even so [are] we Christ\'s.";
hnv[7] = "Do you look at things only as they appear in front of your face? If anyone trusts in himself that he is Messiah\'s, let him consider this again with himself, that, even as he is Messiah\'s, so also we are Messiah\'s.";
vul[7] = "quae secundum faciem sunt videte si quis confidit sibi Christi se esse hoc cogitet iterum apud se quia sicut ipse Christi est ita et nos";
kjv[8] = "For though I should boast somewhat more of our authority, which the Lord hath given us for edification, and not for your destruction, I should not be ashamed:";
rsv[8] = "For even if I boast a little too much of our authority, which the Lord gave for building you up and not for destroying you, I shall not be put to shame.";
asv[8] = "For though I should glory somewhat abundantly concerning our authority (which the Lord gave for building you up, and not for casting you down), I shall not be put to shame:";
yng[8] = "for even if also anything more abundantly I shall boast concerning our authority, that the Lord gave us for building up, and not for casting you down, I shall not be ashamed;";
dby[8] = "For and if I should boast even somewhat more abundantly of our authority, which the Lord has given [to us] for building up and not for your overthrowing, I shall not be put to shame;";
web[8] = "For though I should boast somewhat more of our authority, which the Lord hath given us for edification, and not for your destruction, I should not be ashamed:";
hnv[8] = "For though I should boast somewhat abundantly concerning our authority, (which the Lord gave for building you up, and not for casting you down) I will not be disappointed,";
vul[8] = "nam et si amplius aliquid gloriatus fuero de potestate nostra quam dedit Dominus in aedificationem et non in destructionem vestram non erubescam";
kjv[9] = "That I may not seem as if I would terrify you by letters.";
rsv[9] = "I would not seem to be frightening you with letters.";
asv[9] = "that I may not seem as if I would terrify you by my letters.";
yng[9] = "that I may not seem as if I would terrify you through the letters,";
dby[9] = "that I may not seem as if I was frightening you by letters:";
web[9] = "That I may not seem as if I would terrify you by letters.";
hnv[9] = "that I may not seem as if I desire to terrify you by my letters.";
vul[9] = "ut autem non existimer tamquam terrere vos per epistulas";
kjv[10] = "For [his] letters, say they, [are] weighty and powerful; but [his] bodily presence [is] weak, and [his] speech contemptible.";
rsv[10] = "For they say, &quot;His letters are weighty and strong, but his bodily presence is weak, and his speech of no account.&quot;";
asv[10] = "For, His letters, they say, are weighty and strong; but his bodily presence is weak, and his speech of no account.";
yng[10] = "`because the letters indeed -- saith one -- [are] weighty and strong, and the bodily presence weak, and the speech despicable.\'";
dby[10] = "because his letters, he says, [are] weighty and strong, but his presence in the body weak, and his speech naught.";
web[10] = "For [his] letters (say they) [are] weighty and powerful; but [his] bodily presence [is] weak, and [his] speech contemptible.";
hnv[10] = "For, &quot;His letters,&quot; they say, &quot;are weighty and strong, but his bodily presence is weak, and his speech is despised.&quot;";
vul[10] = "quoniam quidem epistulae inquiunt graves sunt et fortes praesentia autem corporis infirma et sermo contemptibilis";
kjv[11] = "Let such an one think this, that, such as we are in word by letters when we are absent, such [will we be] also in deed when we are present.";
rsv[11] = "Let such people understand that what we say by letter when absent, we do when present.";
asv[11] = "Let such a one reckon this, that, what we are in word by letters when we are absent, such [are we] also in deed when we are present.";
yng[11] = "This one -- let him reckon thus: that such as we are in word, through letters, being absent, such also, being present, [we are] in deed.";
dby[11] = "Let such a one think this, that such as we are in word by letters [when] absent, such also present in deed.";
web[11] = "Let such one think this, that such as we are in word by letters when we are absent, such [will we be] also in deed when we are present.";
hnv[11] = "Let such a person consider this, that what we are in word by letters when we are absent, such are we also in deed when we are present.";
vul[11] = "hoc cogitet qui eiusmodi est quia quales sumus verbo per epistulas absentes tales et praesentes in facto";
kjv[12] = "For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise.";
rsv[12] = "Not that we venture to class or compare ourselves with some of those who commend themselves. But when they measure themselves by one another, and compare themselves with one another, they are without understanding.";
asv[12] = "For we are not bold to number or compare ourselves with certain of them that commend themselves: but they themselves, measuring themselves by themselves, and comparing themselves with themselves, are without understanding.";
yng[12] = "For we do not make bold to rank or to compare ourselves with certain of those commending themselves, but they, among themselves measuring themselves, and comparing themselves with themselves, are not wise,";
dby[12] = "For we dare not class ourselves or compare ourselves with some who commend themselves; but these, measuring themselves by themselves, and comparing themselves with themselves, are not intelligent.";
web[12] = "For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise.";
hnv[12] = "For we are not bold to number or compare ourselves with some of those who commend themselves. But they themselves, measuring themselves by themselves, and comparing themselves with themselves, are without understanding.";
vul[12] = "non enim audemus inserere aut conparare nos quibusdam qui se ipsos commendant sed ipsi in nobis nosmet ipsos metientes et conparantes nosmet ipsos nobis";
kjv[13] = "But we will not boast of things without [our] measure, but according to the measure of the rule which God hath distributed to us, a measure to reach even unto you.";
rsv[13] = "But we will not boast beyond limit, but will keep to the limits God has apportioned us, to reach even to you.";
asv[13] = "But we will not glory beyond [our] measure, but according to the measure of the province which God apportioned to us as a measure, to reach even unto you.";
yng[13] = "and we in regard to the unmeasured things will not boast ourselves, but after the measure of the line that the God of measure did appoint to us -- to reach even unto you;";
dby[13] = "Now *we* will not boast out of measure, but according to the measure of the rule which the God of measure has apportioned to us, to reach to you also.";
web[13] = "But we will not boast of things without [our] measure, but according to the measure of the rule which God hath distributed to us, a measure to reach even to you.";
hnv[13] = "But we will not boast beyond proper limits, but within the boundaries with which God appointed to us, which reach even to you.";
vul[13] = "nos autem non in inmensum gloriabimur sed secundum mensuram regulae quam mensus est nobis Deus mensuram pertingendi usque ad vos";
kjv[14] = "For we stretch not ourselves beyond [our measure], as though we reached not unto you: for we are come as far as to you also in [preaching] the gospel of Christ:";
rsv[14] = "For we are not overextending ourselves, as though we did not reach you; we were the first to come all the way to you with the gospel of Christ.";
asv[14] = "For we stretch not ourselves overmuch, as though we reached not unto you: for we came even as far as unto you in the gospel of Christ:";
yng[14] = "for not as not reaching to you do we stretch ourselves overmuch, for even unto you did we come in the good news of the Christ,";
dby[14] = "For we do not, as not reaching to you, overstretch ourselves, (for we have come to you also in the glad tidings of the Christ;)";
web[14] = "For we stretch not ourselves beyond [our measure], as though we reached not to you; for we are come as far as to you also in [preaching] the gospel of Christ:";
hnv[14] = "For we don\'t stretch ourselves too much, as though we didn\'t reach to you. For we came even as far as to you with the Good News of Messiah,";
vul[14] = "non enim quasi non pertingentes ad vos superextendimus nos usque ad vos enim pervenimus in evangelio Christi";
kjv[15] = "Not boasting of things without [our] measure, [that is], of other men\'s labours; but having hope, when your faith is increased, that we shall be enlarged by you according to our rule abundantly,";
rsv[15] = "We do not boast beyond limit, in other men\'s labors; but our hope is that as your faith increases, our field among you may be greatly enlarged,";
asv[15] = "not glorying beyond [our] measure, [that is,] in other men\'s labors; but having hope that, as your faith groweth, we shall be magnified in you according to our province unto [further] abundance,";
yng[15] = "not boasting of the things not measured, in other men\'s labours, and having hope -- your faith increasing -- in you to be enlarged, according to our line -- into abundance,";
dby[15] = "not boasting out of measure in other people\'s labours, but having hope, your faith increasing, to be enlarged amongst you, according to our rule, yet more abundantly";
web[15] = "Not boasting of things without [our] measure, [that is], of other men\'s labors; but having hope, when your faith is increased, that we shall be enlarged by you, according to our rule abundantly,";
hnv[15] = "not boasting beyond proper limits in other men\'s labors, but having hope that as your faith grows, we will be abundantly enlarged by you in our sphere of influence,";
vul[15] = "non in inmensum gloriantes in alienis laboribus spem autem habentes crescentis fidei vestrae in vobis magnificari secundum regulam nostram in abundantiam";
kjv[16] = "To preach the gospel in the [regions] beyond you, [and] not to boast in another man\'s line of things made ready to our hand.";
rsv[16] = "so that we may preach the gospel in lands beyond you, without boasting of work already done in another\'s field.";
asv[16] = "so as to preach the gospel even unto the parts beyond you, [and] not to glory in another\'s province in regard of things ready to our hand.";
yng[16] = "in the [places] beyond you to proclaim good news, not in another\'s line in regard to the things made ready, to boast;";
dby[16] = "to announce the glad tidings to that [which is] beyond you, not to be boasting in another\'s rule of things made ready to hand.";
web[16] = "To preach the gospel in the [regions] beyond you, [and] not to boast in another man\'s line of things made ready to our hand.";
hnv[16] = "so as to preach the Good News even to the parts beyond you, not to boast in what someone else has already done.";
vul[16] = "etiam in illa quae ultra vos sunt evangelizare non in aliena regula in his quae praeparata sunt gloriari";

rsv[18] = "For it is not the man who commends himself that is accepted, but the man whom the Lord commends.";
asv[18] = "For not he that commendeth himself is approved, but whom the Lord commendeth.";
yng[18] = "for not he who is commending himself is approved, but he whom the Lord doth commend.";
dby[18] = "For not *he* that commends himself is approved, but whom the Lord commends.";
web[18] = "For not he that commendeth himself is approved, but whom the Lord commendeth.";
hnv[18] = "For it isn\'t he who commends himself who is approved, but whom the Lord commends.";
