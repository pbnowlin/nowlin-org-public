csb[1] = "I wish you would put up with a little foolishness from me. Yes, do put up with me!";
csb[2] = "For I am jealous for you with a godly jealousy, because I have promised you in marriage to one husband -- to present a pure virgin to Christ.";
csb[3] = "But I fear that, as the serpent deceived Eve by his cunning, your minds may be seduced from a sincere and pure devotion to Christ.";
csb[4] = "For if a person comes and preaches another Jesus, whom we did not preach, or you receive a different spirit, which you had not received, or a different gospel, which you had not accepted, you put up with it splendidly!";
csb[5] = "Now I consider myself in no way inferior to those &quot;super-apostles.&quot;";
csb[6] = "Even if I am untrained in public speaking, I am certainly not untrained in knowledge. Indeed, we have in every way made that clear to you in everything.";
csb[7] = "Or did I commit a sin by humbling myself so that you might be exalted, because I preached the gospel of God to you free of charge?";
csb[8] = "I robbed other churches by taking pay from them to minister to you.";
csb[9] = "When I was present with you and in need, I did not burden anyone, since the brothers who came from Macedonia supplied my needs. I have kept myself, and will keep myself, from burdening you in any way.";
csb[10] = "As the truth of Christ is in me, this boasting of mine will not be stopped in the regions of Achaia.";
csb[11] = "Why? Because I don\'t love you? God knows I do!";
csb[12] = "But I will continue to do what I am doing, in order to deny an opportunity to those who want to be regarded as our equals in what they boast about.";
csb[13] = "For such people are false apostles, deceitful workers, disguising themselves as apostles of Christ.";
csb[14] = "And no wonder! For Satan disguises himself as an angel of light.";
csb[15] = "So it is no great surprise if his servants also disguise themselves as servants of righteousness. Their end will be according to their works.";
csb[16] = "I repeat: Let no one consider me a fool. But if you do, at least accept me as a fool so that I can also boast a little.";
csb[17] = "What I am saying in this matter of boasting, I don\'t speak as the Lord would, but as it were, foolishly.";
csb[18] = "Since many boast according to the flesh, I will also boast.";
csb[19] = "For you, being so wise, gladly put up with fools!";
csb[20] = "In fact, you put up with it if someone enslaves you, if someone exploits you, if someone takes advantage of you, if someone is arrogant toward you, if someone slaps you in the face.";
csb[21] = "I say this to our shame: We have been too weak for that! But in whatever anyone dares to boast -- I am talking foolishly -- I also dare:";
csb[22] = "Are they Hebrews? So am I. Are they Israelites? So am I. Are they the descendants of Abraham? So am I.";
csb[23] = "Are they servants of Christ? I\'m talking like a madman -- I\'m a better one: with far more labors, many more imprisonments, far worse beatings, many times near death.";
csb[24] = "Five times I received the forty lashes minus one from the Jews.";
csb[25] = "Three times I was beaten with rods. Once I received a stoning. Three times I was shipwrecked. I have spent a night and a day in the open sea.";
csb[26] = "On frequent journeys, I faced dangers from rivers, dangers from robbers, dangers from my own people, dangers from Gentiles, dangers in the city, dangers in the wilderness, dangers at sea, and dangers among false brothers;";
csb[27] = "toil and hardship, many sleepless nights, hunger and thirst, often without food, cold, and without clothing.";
csb[28] = "Not to mention other things, there is the daily pressure on me: my concern for all the churches.";
csb[29] = "Who is weak, and I am not weak? Who is made to stumble, and I do not burn with indignation?";
csb[30] = "If boasting is necessary, I will boast about my weaknesses.";
csb[31] = "The God and Father of the Lord Jesus, who is blessed forever, knows I am not lying.";
csb[32] = "In Damascus, a ruler under King Aretas guarded the city of Damascus in order to arrest me.";
csb[33] = "So I was let down in a basket through a window in the wall and escaped from his hands.";
kjv[1] = "Would to God ye could bear with me a little in [my] folly: and indeed bear with me.";
rsv[1] = "I wish you would bear with me in a little foolishness. Do bear with me!";
asv[1] = "Would that ye could bear with me in a little foolishness: but indeed ye do bear with me.";
yng[1] = "O that ye were bearing with me a little of the folly, but ye also do bear with me:";
dby[1] = "Would that ye would bear with me [in] a little folly; but indeed bear with me.";
web[1] = "I earnestly wish ye could bear with me a little in [my] folly: and indeed bear with me.";
hnv[1] = "I wish that you would bear with me in a little foolishness, but indeed you do bear with me.";
vul[1] = "utinam sustineretis modicum quid insipientiae meae sed et subportate me";
kjv[2] = "For I am jealous over you with godly jealousy: for I have espoused you to one husband, that I may present [you as] a chaste virgin to Christ.";
rsv[2] = "I feel a divine jealousy for you, for I betrothed you to Christ to present you as a pure bride to her one husband.";
asv[2] = "For I am jealous over you with a godly jealousy: for I espoused you to one husband, that I might present you [as] a pure virgin to Christ.";
yng[2] = "for I am zealous for you with zeal of God, for I did betroth you to one husband, a pure virgin, to present to Christ,";
dby[2] = "For I am jealous as to you with a jealousy [which is] of God; for I have espoused you unto one man, to present [you] a chaste virgin to Christ.";
web[2] = "For I am jealous over you with godly jealousy: for I have espoused you to one husband, that I may present [you as] a chaste virgin to Christ.";
hnv[2] = "For I am jealous over you with a godly jealousy. For I married you to one husband, that I might present you as a pure virgin to Messiah.";
vul[2] = "aemulor enim vos Dei aemulatione despondi enim vos uni viro virginem castam exhibere Christo";
kjv[3] = "But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.";
rsv[3] = "But I am afraid that as the serpent deceived Eve by his cunning, your thoughts will be led astray from a sincere and pure devotion to Christ.";
asv[3] = "But I fear, lest by any means, as the serpent beguiled Eve in his craftiness, your minds should be corrupted from the simplicity and the purity that is toward Christ.";
yng[3] = "and I fear, lest, as the serpent did beguile Eve in his subtilty, so your minds may be corrupted from the simplicity that [is] in the Christ;";
dby[3] = "But I fear lest by any means, as the serpent deceived Eve by his craft, [so] your thoughts should be corrupted from simplicity as to the Christ.";
web[3] = "But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.";
hnv[3] = "But I am afraid that somehow, as the serpent deceived Havah in his craftiness, so your minds might be corrupted from the simplicity that is in Messiah.";
vul[3] = "timeo autem ne sicut serpens Evam seduxit astutia sua ita corrumpantur sensus vestri et excidant a simplicitate quae est in Christo";
kjv[4] = "For if he that cometh preacheth another Jesus, whom we have not preached, or [if] ye receive another spirit, which ye have not received, or another gospel, which ye have not accepted, ye might well bear with [him].";
rsv[4] = "For if some one comes and preaches another Jesus than the one we preached, or if you receive a different spirit from the one you received, or if you accept a different gospel from the one you accepted, you submit to it readily enough.";
asv[4] = "For if he that cometh preacheth another Jesus, whom we did not preach, or [if] ye receive a different spirit, which ye did not receive, or a different gospel, which ye did not accept, ye do well to bear with [him].";
yng[4] = "for if, indeed, he who is coming doth preach another Jesus whom we did not preach, or another Spirit ye receive which ye did not receive, or other good news which ye did not accept -- well were ye bearing [it],";
dby[4] = "For if indeed he that comes preaches another Jesus, whom we have not preached, or ye get a different Spirit, which ye have not got, or a different glad tidings, which ye have not received, ye might well bear with [it].";
web[4] = "For if he that cometh preacheth another Jesus, whom we have not preached, or [if] ye receive another spirit, which ye have not received, or another gospel, which ye have not accepted, ye might well bear with [him].";
hnv[4] = "For if he who comes preaches another Yeshua, whom we did not preach, or if you receive a different spirit, which you did not receive, or a different Good News, which you did not accept, you put up with that well enough.";
vul[4] = "nam si is qui venit alium Christum praedicat quem non praedicavimus aut alium spiritum accipitis quem non accepistis aut aliud evangelium quod non recepistis recte pateremini";
kjv[5] = "For I suppose I was not a whit behind the very chiefest apostles.";
rsv[5] = "I think that I am not in the least inferior to these superlative apostles.";
asv[5] = "For I reckon that I am not a whit behind the very chiefest apostles.";
yng[5] = "for I reckon that I have been nothing behind the very chiefest apostles,";
dby[5] = "For I reckon that in nothing I am behind those who are in surpassing degree apostles.";
web[5] = "For I suppose I was not a whit behind the very greatest apostles.";
hnv[5] = "For I reckon that I am not at all behind the very best apostles.";
vul[5] = "existimo enim nihil me minus fecisse magnis apostolis";
kjv[6] = "But though [I be] rude in speech, yet not in knowledge; but we have been throughly made manifest among you in all things.";
rsv[6] = "Even if I am unskilled in speaking, I am not in knowledge; in every way we have made this plain to you in all things.";
asv[6] = "But though [I be] rude in speech, yet [am I] not in knowledge; nay, in every way have we made [this] manifest unto you in all things.";
yng[6] = "and even if unlearned in word -- yet not in knowledge, but in every thing we were made manifest in all things to you.";
dby[6] = "But if [I am] a simple person in speech, yet not in knowledge, but in everything making [the truth] manifest in all things to you.";
web[6] = "But though [I am] rude in speech, yet not in knowledge; but we have been thoroughly made manifest among you in all things.";
hnv[6] = "But though I am unskilled in speech, yet I am not unskilled in knowledge. No, in every way we have been revealed to you in all things.";
vul[6] = "et si inperitus sermone sed non scientia in omnibus autem manifestatus sum vobis";
kjv[7] = "Have I committed an offence in abasing myself that ye might be exalted, because I have preached to you the gospel of God freely?";
rsv[7] = "Did I commit a sin in abasing myself so that you might be exalted, because I preached God\'s gospel without cost to you?";

yng[7] = "The sin did I do -- myself humbling that ye might be exalted, because freely the good news of God I did proclaim to you?";
dby[7] = "Have I committed sin, abasing myself in order that *ye* might be exalted, because I gratuitously announced to you the glad tidings of God?";
web[7] = "Have I committed an offense in abasing myself that ye might be exalted, because I have preached to you the gospel of God without reward?";
hnv[7] = "Or did I commit a sin in humbling myself that you might be exalted, because I preached to you God\'s Good News free of charge?";
vul[7] = "aut numquid peccatum feci me ipsum humilians ut vos exaltemini quoniam gratis evangelium Dei evangelizavi vobis";
kjv[8] = "I robbed other churches, taking wages [of them], to do you service.";

asv[8] = "I robbed other churches, taking wages [of them] that I might minister unto you;";

kjv[9] = "And when I was present with you, and wanted, I was chargeable to no man: for that which was lacking to me the brethren which came from Macedonia supplied: and in all [things] I have kept myself from being burdensome unto you, and [so] will I keep [myself].";
rsv[9] = "And when I was with you and was in want, I did not burden any one, for my needs were supplied by the brethren who came from Macedo\'nia. So I refrained and will refrain from burdening you in any way.";
asv[9] = "and when I was present with you and was in want, I was not a burden on any man; for the brethren, when they came from Macedonia, supplied the measure of my want; and in everything I kept myself from being burdensome unto you, and [so] will I keep [myself].";
yng[9] = "and being present with you, and having been in want, I was chargeable to no one, for my lack did the brethren supply -- having come from Macedonia -- and in everything burdenless to you I did keep myself, and will keep.";
dby[9] = "And being present with you and lacking, I did not lazily burden any one, (for the brethren who came from Macedonia supplied what I lacked,) and in everything I kept myself from being a burden to you, and will keep myself.";
web[9] = "And when I was present with you, and wanted, I was chargeable to no man: for that which was lacking to me the brethren who came from Macedonia supplied: and in all [things] I have kept myself from being burdensome to you, and [so] will I keep [myself].";
hnv[9] = "When I was present with you and was in need, I wasn\'t a burden on anyone, for the brothers, when they came from Macedonia, supplied the measure of my need. In everything I kept myself from being burdensome to you, and I will continue to do so.";
vul[9] = "et cum essem apud vos et egerem nulli onerosus fui nam quod mihi deerat suppleverunt fratres qui venerunt a Macedonia et in omnibus sine onere me vobis servavi et servabo";

kjv[11] = "Wherefore? because I love you not? God knoweth.";

yng[11] = "wherefore? because I do not love you? God hath known!";

kjv[12] = "But what I do, that I will do, that I may cut off occasion from them which desire occasion; that wherein they glory, they may be found even as we.";
rsv[12] = "And what I do I will continue to do, in order to undermine the claim of those who would like to claim that in their boasted mission they work on the same terms as we do.";
asv[12] = "But what I do, that I will do, that I may cut off occasion from them that desire an occasion; that wherein they glory, they may be found even as we.";
yng[12] = "and what I do, I also will do, that I may cut off the occasion of those wishing an occasion, that in that which they boast they may be found according as we also;";
dby[12] = "But what I do, I will also do, that I may cut off the opportunity of those wishing [for] an opportunity, that wherein they boast they may be found even as we.";
web[12] = "But what I do, that I will do, that I may cut off occasion from them who desire occasion; that in what they glory, they may be found even as we.";
hnv[12] = "But what I do, that I will do, that I may cut off occasion from them that desire an occasion, that in which they boast, they may be found even as we.";

kjv[13] = "For such [are] false apostles, deceitful workers, transforming themselves into the apostles of Christ.";
rsv[13] = "For such men are false apostles, deceitful workmen, disguising themselves as apostles of Christ.";
asv[13] = "For such men are false apostles, deceitful workers, fashioning themselves into apostles of Christ.";
yng[13] = "for those such [are] false apostles, deceitful workers, transforming themselves into apostles of Christ,";
dby[13] = "For such [are] false apostles, deceitful workers, transforming themselves into apostles of Christ.";
web[13] = "For such [are] false apostles, deceitful workers, transforming themselves into the apostles of Christ.";
hnv[13] = "For such men are false apostles, deceitful workers, masquerading as Messiah\'s apostles.";

kjv[14] = "And no marvel; for Satan himself is transformed into an angel of light.";

asv[14] = "And no marvel; for even Satan fashioneth himself into an angel of light.";
yng[14] = "and no wonder -- for even the Adversary doth transform himself into a messenger of light;";
dby[14] = "And [it is] not wonderful, for Satan himself transforms himself into an angel of light.";

kjv[16] = "I say again, Let no man think me a fool; if otherwise, yet as a fool receive me, that I may boast myself a little.";

dby[19] = "For ye bear fools readily, being wise.";

hnv[19] = "For you bear with the foolish gladly, being wise.";

kjv[20] = "For ye suffer, if a man bring you into bondage, if a man devour [you], if a man take [of you], if a man exalt himself, if a man smite you on the face.";
rsv[20] = "For you bear it if a man makes slaves of you, or preys upon you, or takes advantage of you, or puts on airs, or strikes you in the face.";
asv[20] = "For ye bear with a man, if he bringeth you into bondage, if he devoureth you, if he taketh you [captive], if he exalteth himself, if he smiteth you on the face.";
yng[20] = "for ye bear, if any one is bringing you under bondage, if any one doth devour, if any one doth take away, if any one doth exalt himself, if any one on the face doth smite you;";
dby[20] = "For ye bear if any one bring you into bondage, if any one devour [you], if any one get [your money], if any one exalt himself, if any one beat you on the face.";

hnv[20] = "For you bear with a man, if he brings you into bondage, if he devours you, if he takes you captive, if he exalts himself, if he strikes you on the face.";

kjv[21] = "I speak as concerning reproach, as though we had been weak. Howbeit whereinsoever any is bold, (I speak foolishly,) I am bold also.";
rsv[21] = "To my shame, I must say, we were too weak for that! But whatever any one dares to boast of--I am speaking as a fool--I also dare to boast of that.";

dby[21] = "I speak as to dishonour, as though *we* had been weak; but wherein any one is daring, (I speak in folly,) *I* also am daring.";
web[21] = "I speak as concerning reproach, as though we had been weak. But in whatever respect any is bold, (I speak foolishly) I am bold also.";
hnv[21] = "I speak by way of disparagement, as though we had been weak. Yet however any is bold (I speak in foolishness), I am bold also.";
vul[21] = "secundum ignobilitatem dico quasi nos infirmi fuerimus in quo quis audet in insipientia dico audeo et ego";

yng[22] = "Hebrews are they? I also! Israelites are they? I also! seed of Abraham are they? I also!";
dby[22] = "Are they Hebrews? *I* also. Are they Israelites? *I* also. Are they seed of Abraham? *I* also.";
web[22] = "Are they Hebrews? so [am] I. Are they Israelites? so [am] I. Are they the offspring of Abraham? so [am] I.";
hnv[22] = "Are they Hebrews? So am I. Are they Yisra\'elites? So am I. Are they the seed of Avraham? So am I.";
vul[22] = "Hebraei sunt et ego Israhelitae sunt et ego semen Abrahae sunt et ego";
kjv[23] = "Are they ministers of Christ? (I speak as a fool) I [am] more; in labours more abundant, in stripes above measure, in prisons more frequent, in deaths oft.";
rsv[23] = "Are they servants of Christ? I am a better one--I am talking like a madman--with far greater labors, far more imprisonments, with countless beatings, and often near death.";
asv[23] = "Are they ministers of Christ? (I speak as one beside himself) I more; in labors more abundantly, in prisons more abundantly, in stripes above measure, in deaths oft.";
yng[23] = "ministrants of Christ are they? -- as beside myself I speak -- I more; in labours more abundantly, in stripes above measure, in prisons more frequently, in deaths many times;";
dby[23] = "Are they ministers of Christ? (I speak as being beside myself) *I* above measure [so]; in labours exceedingly abundant, in stripes to excess, in prisons exceedingly abundant, in deaths oft.";
web[23] = "Are they ministers of Christ? (I speak as a fool) I [am] more; in labors more abundant, in stripes above measure, in prisons more frequent, in deaths often.";
hnv[23] = "Are they servants of Messiah? (I speak as one beside himself) I am more so; in labors more abundantly, in prisons more abundantly, in stripes above measure, in deaths often.";
vul[23] = "ministri Christi sunt minus sapiens dico plus ego in laboribus plurimis in carceribus abundantius in plagis supra modum in mortibus frequenter";
kjv[24] = "Of the Jews five times received I forty [stripes] save one.";
rsv[24] = "Five times I have received at the hands of the Jews the forty lashes less one.";
asv[24] = "Of the Jews five times received I forty [stripes] save one.";
yng[24] = "from Jews five times forty [stripes] save one I did receive;";
dby[24] = "From the Jews five times have I received forty [stripes], save one.";
web[24] = "From the Jews five times I received forty [stripes] save one.";
hnv[24] = " Five times from the Yehudim I received forty stripes minus one.";
vul[24] = "a Iudaeis quinquies quadragenas una minus accepi";
kjv[25] = "Thrice was I beaten with rods, once was I stoned, thrice I suffered shipwreck, a night and a day I have been in the deep;";
rsv[25] = "Three times I have been beaten with rods; once I was stoned. Three times I have been shipwrecked; a night and a day I have been adrift at sea;";
asv[25] = "Thrice was I beaten with rods, once was I stoned, thrice I suffered shipwreck, a night and a day have I been in the deep;";
yng[25] = "thrice was I beaten with rods, once was I stoned, thrice was I shipwrecked, a night and a day in the deep I have passed;";
dby[25] = "Thrice have I been scourged, once I have been stoned, three times I have suffered shipwreck, a night and day I passed in the deep:";
web[25] = "Thrice was I beaten with rods, once I was stoned, thrice I suffered shipwreck, a night and a day I have been in the deep;";
hnv[25] = " Three times I was beaten with rods. Once I was stoned. Three times I suffered shipwreck. I have been a night and a day in the deep.";
vul[25] = "ter virgis caesus sum semel lapidatus sum ter naufragium feci nocte et die in profundo maris fui";
kjv[26] = "[In] journeyings often, [in] perils of waters, [in] perils of robbers, [in] perils by [mine own] countrymen, [in] perils by the heathen, [in] perils in the city, [in] perils in the wilderness, [in] perils in the sea, [in] perils among false brethren;";
rsv[26] = "on frequent journeys, in danger from rivers, danger from robbers, danger from my own people, danger from Gentiles, danger in the city, danger in the wilderness, danger at sea, danger from false brethren;";
asv[26] = "[in] journeyings often, [in] perils of rivers, [in] perils of robbers, [in] perils from [my] countrymen, [in] perils from the Gentiles, [in] perils in the city, [in] perils in the wilderness, [in] perils in the sea, [in] perils among false brethren;";
yng[26] = "journeyings many times, perils of rivers, perils of robbers, perils from kindred, perils from nations, perils in city, perils in wilderness, perils in sea, perils among false brethren;";
dby[26] = "in journeyings often, in perils of rivers, in perils of robbers, in perils from [my own] race, in perils from [the] nations, in perils in [the] city, in perils in [the] desert, in perils on [the] sea, in perils among false brethren;";
web[26] = "[In] journeyings often, [in] perils of waters, [in] perils of robbers, [in] perils by [my own] countrymen, [in] perils by the heathen, [in] perils in the city, [in] perils in the wilderness, [in] perils in the sea, [in] perils among false brethren;";
hnv[26] = " I have been in travels often, perils of rivers, perils of robbers, perils from my countrymen, perils from the Goyim, perils in the city, perils in the wilderness, perils in the sea, perils among false brothers;";
vul[26] = "in itineribus saepe periculis fluminum periculis latronum periculis ex genere periculis ex gentibus periculis in civitate periculis in solitudine periculis in mari periculis in falsis fratribus";
kjv[27] = "In weariness and painfulness, in watchings often, in hunger and thirst, in fastings often, in cold and nakedness.";
rsv[27] = "in toil and hardship, through many a sleepless night, in hunger and thirst, often without food, in cold and exposure.";
asv[27] = "[in] labor and travail, in watchings often, in hunger and thirst, in fastings often, in cold and nakedness.";
yng[27] = "in laboriousness and painfulness, in watchings many times, in hunger and thirst, in fastings many times, in cold and nakedness;";
dby[27] = "in labour and toil, in watchings often, in hunger and thirst, in fastings often, in cold and nakedness.";
web[27] = "In weariness and painfulness, in watchings often, in hunger and thirst, in fastings often, in cold and nakedness.";
hnv[27] = "in labor and travail, in watchings often, in hunger and thirst, in fastings often, and in cold and nakedness.";
vul[27] = "in labore et aerumna in vigiliis multis in fame et siti in ieiuniis multis in frigore et nuditate";
kjv[28] = "Beside those things that are without, that which cometh upon me daily, the care of all the churches.";
rsv[28] = "And, apart from other things, there is the daily pressure upon me of my anxiety for all the churches.";
asv[28] = "Besides those things that are without, there is that which presseth upon me daily, anxiety for all the churches.";
yng[28] = "apart from the things without -- the crowding upon me that is daily -- the care of all the assemblies.";
dby[28] = "Besides those things that are without, the crowd [of cares] pressing on me daily, the burden of all the assemblies.";
web[28] = "Besides those things that are without, that which cometh upon me daily, the care of all the churches.";
hnv[28] = "Besides those things that are outside, there is that which presses on me daily, anxiety for all the assemblies.";
vul[28] = "praeter illa quae extrinsecus sunt instantia mea cotidiana sollicitudo omnium ecclesiarum";
kjv[29] = "Who is weak, and I am not weak? who is offended, and I burn not?";
rsv[29] = "Who is weak, and I am not weak? Who is made to fall, and I am not indignant?";
asv[29] = "Who is weak, and I am not weak? who is caused to stumble, and I burn not?";
yng[29] = "Who is infirm, and I am not infirm? who is stumbled, and I am not fired;";
dby[29] = "Who is weak, and I am not weak? Who is stumbled, and I burn not?";
web[29] = "Who is weak, and I am not weak? who is made to fall into sin, and I burn not?";
hnv[29] = "Who is weak, and I am not weak? Who is caused to stumble, and I don\'t burn with indignation?";
vul[29] = "quis infirmatur et non infirmor quis scandalizatur et ego non uror";

rsv[30] = "If I must boast, I will boast of the things that show my weakness.";
asv[30] = "If I must needs glory, I will glory of the things that concern my weakness.";
yng[30] = "if to boast it behoveth [me], of the things of my infirmity I will boast;";
dby[30] = "If it is needful to boast, I will boast in the things which concern my infirmity.";
web[30] = "If I must needs glory, I will glory of the things which concern my infirmities.";
hnv[30] = "If I must boast, I will boast of the things that concern my weakness.";
vul[30] = "si gloriari oportet quae infirmitatis meae sunt gloriabor";

rsv[31] = "The God and Father of the Lord Jesus, he who is blessed for ever, knows that I do not lie.";
asv[31] = "The God and Father of the Lord Jesus, he who is blessed for evermore knoweth that I lie not.";
yng[31] = "the God and Father of our Lord Jesus Christ -- who is blessed to the ages -- hath known that I do not lie! --";
dby[31] = "The God and Father of the Lord Jesus knows -- he who is blessed for ever -- that I do not lie.";
web[31] = "The God and Father of our Lord Jesus Christ, who is blessed for evermore, knoweth that I lie not.";
hnv[31] = "The God and Father of the Lord Yeshua the Messiah, he who is blessed forevermore, knows that I don\'t lie.";

dby[32] = "In Damascus the ethnarch of Aretas the king kept the city of the Damascenes shut up, wishing to take me;";
web[32] = "In Damascus the governor under Aretas the king kept the city of the Damascenes with a garrison, desirous to apprehend me:";
hnv[32] = "In Dammesek the governor under Aretas the king guarded the city of the Damascenes desiring to arrest me.";
