csb[1] = "For we know that if our earthly tent we live in is destroyed, we have a building from God, an eternal dwelling in the heavens, not made with hands.";
csb[2] = "Indeed, we groan in this tent, desiring to put on our heavenly dwelling,";
csb[3] = "since, when we have taken it off, we will not be found naked.";
csb[4] = "Indeed, we groan while we are in this tent, burdened as we are, because we do not want to be unclothed but clothed, so that mortality may be swallowed up by life.";
csb[5] = "Now the one who prepared us for this very purpose is God, who gave us the Spirit as a down payment.";
csb[6] = "So we are always confident and know that while we are at home in the body we are away from the Lord.";
csb[7] = "For we walk by faith, not by sight.";
csb[8] = "In fact, we are confident, and we would prefer to be away from the body and at home with the Lord.";
csb[9] = "Therefore, whether we are at home or away, we make it our aim to be pleasing to him.";
csb[10] = "For we must all appear before the judgment seat of Christ, so that each may be repaid for what he has done in the body, whether good or evil.";
csb[11] = "Therefore, since we know the fear of the Lord, we try to persuade people. What we are is plain to God, and I hope it is also plain to your consciences.";
csb[12] = "We are not commending ourselves to you again, but giving you an opportunity to be proud of us, so that you may have a reply for those who take pride in outward appearance rather than in the heart.";
csb[13] = "For if we are out of our mind, it is for God; if we are in our right mind, it is for you.";
csb[14] = "For the love of Christ compels us, since we have reached this conclusion: If one died for all, then all died.";
csb[15] = "And he died for all so that those who live should no longer live for themselves, but for the one who died for them and was raised.";
csb[16] = "From now on, then, we do not know anyone from a worldly perspective. Even if we have known Christ from a worldly perspective, yet now we no longer know him in this way.";
csb[17] = "Therefore, if anyone is in Christ, he is a new creation; the old has passed away, and see, the new has come!";
csb[18] = "Everything is from God, who has reconciled us to himself through Christ and has given us the ministry of reconciliation.";
csb[19] = "That is, in Christ, God was reconciling the world to himself, not counting their trespasses against them, and he has committed the message of reconciliation to us.";
csb[20] = "Therefore, we are ambassadors for Christ, since God is making his appeal through us. We plead on Christ\'s behalf: &quot;Be reconciled to God.&quot;";
csb[21] = "He made the one who did not know sin to be sin for us, so that in him we might become the righteousness of God.";
kjv[1] = "For we know that if our earthly house of [this] tabernacle were dissolved, we have a building of God, an house not made with hands, eternal in the heavens.";

dby[1] = "For we know that if our earthly tabernacle house be destroyed, we have a building from God, a house not made with hands, eternal in the heavens.";

web[2] = "For in this we groan, earnestly desiring to be clothed with our house which is from heaven:";

hnv[3] = " if so be that being clothed we will not be found naked.";

dby[4] = "For indeed we who are in the tabernacle groan, being burdened; while yet we do not wish to be unclothed, but clothed, that [what is] mortal may be swallowed up by life.";

kjv[5] = "Now he that hath wrought us for the selfsame thing [is] God, who also hath given unto us the earnest of the Spirit.";
rsv[5] = "He who has prepared us for this very thing is God, who has given us the Spirit as a guarantee.";

kjv[11] = "Knowing therefore the terror of the Lord, we persuade men; but we are made manifest unto God; and I trust also are made manifest in your consciences.";
