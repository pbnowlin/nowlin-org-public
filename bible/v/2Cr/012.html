csb[1] = "Boasting is necessary. It is not profitable, but I will move on to visions and revelations of the Lord.";
csb[2] = "I know a man in Christ who was caught up to the third heaven fourteen years ago. Whether he was in the body or out of the body, I don\'t know; God knows.";
csb[3] = "I know that this man -- whether in the body or out of the body I don\'t know; God knows --";
csb[4] = "was caught up into paradise and heard inexpressible words, which a human being is not allowed to speak.";
csb[5] = "I will boast about this person, but not about myself, except of my weaknesses.";
csb[6] = "For if I want to boast, I wouldn\'t be a fool, because I would be telling the truth. But I will spare you, so that no one can credit me with something beyond what he sees in me or hears from me,";
csb[7] = "especially because of the extraordinary revelations. Therefore, so that I would not exalt myself, a thorn in the flesh was given to me, a messenger of Satan to torment me so that I would not exalt myself.";
csb[8] = "Concerning this, I pleaded with the Lord three times that it would leave me.";
csb[9] = "But he said to me, &quot;My grace is sufficient for you, for my power is perfected in weakness.&quot; Therefore, I will most gladly boast all the more about my weaknesses, so that Christ\'s power may reside in me.";
csb[10] = "So I take pleasure in weaknesses, insults, hardships, persecutions, and in difficulties, for the sake of Christ. For when I am weak, then I am strong.";
csb[11] = "I have been a fool; you forced it on me. You ought to have commended me, since I am not in any way inferior to those &quot;super-apostles,&quot; even though I am nothing.";
csb[12] = "The signs of an apostle were performed with unfailing endurance among you, including signs and wonders and miracles.";
csb[13] = "So in what way are you worse off than the other churches, except that I personally did not burden you? Forgive me for this wrong!";
csb[14] = "Look, I am ready to come to you this third time. I will not burden you, since I am not seeking what is yours, but you. For children ought not save up for their parents, but parents for their children.";
csb[15] = "I will most gladly spend and be spent for you. If I love you more, am I to be loved less?";
csb[16] = "Now granted, I did not burden you; yet sly as I am, I took you in by deceit!";
csb[17] = "Did I take advantage of you by any of those I sent you?";
csb[18] = "I urged Titus to go, and I sent the brother with him. Titus didn\'t take advantage of you, did he? Didn\'t we walk in the same spirit and in the same footsteps?";
csb[19] = "Have you been thinking all along that we were defending ourselves to you? No, in the sight of God we are speaking in Christ, and everything, dear friends, is for building you up.";
csb[20] = "For I fear that perhaps when I come I will not find you to be what I want, and you may not find me to be what you want. Perhaps there will be quarreling, jealousy, angry outbursts, selfish ambitions, slander, gossip, arrogance, and disorder.";
csb[21] = "I fear that when I come my God will again humiliate me in your presence, and I will grieve for many who sinned before and have not repented of the moral impurity, sexual immorality, and sensuality they practiced.";
kjv[1] = "It is not expedient for me doubtless to glory. I will come to visions and revelations of the Lord.";
kjv[2] = "I knew a man in Christ above fourteen years ago, (whether in the body, I cannot tell; or whether out of the body, I cannot tell: God knoweth;) such an one caught up to the third heaven.";
kjv[3] = "And I knew such a man, (whether in the body, or out of the body, I cannot tell: God knoweth;)";
kjv[4] = "How that he was caught up into paradise, and heard unspeakable words, which it is not lawful for a man to utter.";
kjv[5] = "Of such an one will I glory: yet of myself I will not glory, but in mine infirmities.";
kjv[6] = "For though I would desire to glory, I shall not be a fool; for I will say the truth: but [now] I forbear, lest any man should think of me above that which he seeth me [to be], or [that] he heareth of me.";
kjv[7] = "And lest I should be exalted above measure through the abundance of the revelations, there was given to me a thorn in the flesh, the messenger of Satan to buffet me, lest I should be exalted above measure.";
kjv[8] = "For this thing I besought the Lord thrice, that it might depart from me.";
kjv[9] = "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.";
kjv[10] = "Therefore I take pleasure in infirmities, in reproaches, in necessities, in persecutions, in distresses for Christ\'s sake: for when I am weak, then am I strong.";
kjv[11] = "I am become a fool in glorying; ye have compelled me: for I ought to have been commended of you: for in nothing am I behind the very chiefest apostles, though I be nothing.";
kjv[12] = "Truly the signs of an apostle were wrought among you in all patience, in signs, and wonders, and mighty deeds.";
kjv[13] = "For what is it wherein ye were inferior to other churches, except [it be] that I myself was not burdensome to you? forgive me this wrong.";
kjv[14] = "Behold, the third time I am ready to come to you; and I will not be burdensome to you: for I seek not yours, but you: for the children ought not to lay up for the parents, but the parents for the children.";
kjv[15] = "And I will very gladly spend and be spent for you; though the more abundantly I love you, the less I be loved.";
kjv[16] = "But be it so, I did not burden you: nevertheless, being crafty, I caught you with guile.";
kjv[17] = "Did I make a gain of you by any of them whom I sent unto you?";
kjv[18] = "I desired Titus, and with [him] I sent a brother. Did Titus make a gain of you? walked we not in the same spirit? [walked we] not in the same steps?";
kjv[19] = "Again, think ye that we excuse ourselves unto you? we speak before God in Christ: but [we do] all things, dearly beloved, for your edifying.";
kjv[20] = "For I fear, lest, when I come, I shall not find you such as I would, and [that] I shall be found unto you such as ye would not: lest [there be] debates, envyings, wraths, strifes, backbitings, whisperings, swellings, tumults:";
kjv[21] = "[And] lest, when I come again, my God will humble me among you, and [that] I shall bewail many which have sinned already, and have not repented of the uncleanness and fornication and lasciviousness which they have committed.";

yng[20] = "for I fear lest, having come, not such as I wish I may find you, and I -- I may be found by you such as ye do not wish, lest there be strifes, envyings, wraths, revelries, evil-speakings, whisperings, puffings up, insurrections,";
dby[20] = "For I fear lest perhaps coming I find you not such as I wish, and that *I* be found by you such as ye do not wish: lest [there might be] strifes, jealousies, angers, contentions, evil speakings, whisperings, puffings up, disturbances;";
web[20] = "For I fear, lest, when I come, I shall not find you such as I would, and [that] I shall be found by you such as ye would not: lest [there be] debates, envyings, wraths, strifes, backbitings, whisperings, swellings, tumults:";
hnv[20] = "For I am afraid that by any means, when I come, I might find you not the way I want to, and that I might be found by you as you don\'t desire; that by any means there would be strife, jealousy, outbursts of anger, factions, slander, whisperings, proud thoughts, riots;";
vul[20] = "timeo enim ne forte cum venero non quales volo inveniam vos et ego inveniar a vobis qualem non vultis ne forte contentiones aemulationes animositates dissensiones detractiones susurrationes inflationes seditiones sint inter vos";
rsv[21] = "I fear that when I come again my God may humble me before you, and I may have to mourn over many of those who sinned before and have not repented of the impurity, immorality, and licentiousness which they have practiced.";
asv[21] = "lest again when I come my God should humble me before you, and I should mourn for many of them that have sinned heretofore, and repented not of the uncleanness and fornication and lasciviousness which they committed.";
yng[21] = "lest again having come, my God may humble me in regard to you, and I may bewail many of those having sinned before, and not having reformed concerning the uncleanness, and whoredom, and lasciviousness, that they did practise.";
dby[21] = "lest my God should humble me as to you when I come again, and that I shall grieve over many of those who have sinned before, and have not repented as to the uncleanness and fornication and licentiousness which they have practised.";
web[21] = "[And] lest, when I come again, my God may humble me among you, and I shall bewail many who have sinned already, and have not repented of the uncleanness, and lewdness, and lasciviousness, which they have committed.";
hnv[21] = "that again when I come my God would humble me before you, and I would mourn for many of those who have sinned before now, and not repented of the uncleanness and sexual immorality and lustfulness which they committed.";
vul[21] = "ne iterum cum venero humiliet me Deus apud vos et lugeam multos ex his qui ante peccaverunt et non egerunt paenitentiam super inmunditia et fornicatione et inpudicitia quam gesserunt";
</script>
