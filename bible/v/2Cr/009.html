csb[1] = "Now concerning the ministry to the saints, it is unnecessary for me to write to you.";
csb[2] = "For I know your eagerness, and I boast about you to the Macedonians: &quot;Achaia has been ready since last year,&quot; and your zeal has stirred up most of them.";
csb[3] = "But I am sending the brothers so that our boasting about you in this matter would not prove empty, and so that you would be ready just as I said.";
csb[4] = "Otherwise, if any Macedonians come with me and find you unprepared, we, not to mention you, would be put to shame in that situation.";
csb[5] = "Therefore I considered it necessary to urge the brothers to go on ahead to you and arrange in advance the generous gift you promised, so that it will be ready as a gift and not as an extortion.";
csb[6] = "The point is this: The person who sows sparingly will also reap sparingly, and the person who sows generously will also reap generously.";
csb[7] = "Each person should do as he has decided in his heart -- not reluctantly or out of compulsion, since God loves a cheerful giver.";
csb[8] = "And God is able to make every grace overflow to you, so that in every way, always having everything you need, you may excel in every good work.";
csb[9] = "As it is written: He distributed freely; he gave to the poor; his righteousness endures forever.";
csb[10] = "Now the one who provides seed for the sower and bread for food will also provide and multiply your seed and increase the harvest of your righteousness.";
csb[11] = "You will be enriched in every way for all generosity, which produces thanksgiving to God through us.";
csb[12] = "For the ministry of this service is not only supplying the needs of the saints but is also overflowing in many expressions of thanks to God.";
csb[13] = "Because of the proof provided by this ministry, they will glorify God for your obedient confession of the gospel of Christ, and for your generosity in sharing with them and with everyone.";
csb[14] = "And as they pray on your behalf, they will have deep affection for you because of the surpassing grace of God in you.";
csb[15] = "Thanks be to God for his indescribable gift!";
kjv[1] = "For as touching the ministering to the saints, it is superfluous for me to write to you:";

asv[1] = "For as touching the ministering to the saints, it is superfluous for me to write to you:";

dby[1] = "For concerning the ministration which [is] for the saints, it is superfluous my writing to you.";
web[1] = "For as concerning the ministering to the saints, it is superfluous for me to write to you:";

vul[1] = "nam de ministerio quod fit in sanctos ex abundanti est mihi scribere vobis";
kjv[2] = "For I know the forwardness of your mind, for which I boast of you to them of Macedonia, that Achaia was ready a year ago; and your zeal hath provoked very many.";

asv[2] = "for I know your readiness, of which I glory on your behalf to them of Macedonia, that Achaia hath been prepared for a year past; and your zeal hath stirred up very many of them.";

dby[2] = "For I know your readiness, which I boast of as respects you to Macedonians, that Achaia is prepared since a year ago, and the zeal [reported] of you has stimulated the mass [of the brethren].";
web[2] = "For I know the forwardness of your mind, for which I boast of you to them of Macedonia, that Achaia was ready a year ago; and your zeal hath incited very many.";

yng[3] = "and I sent the brethren, that our boasting on your behalf may not be made vain in this respect; that, according as I said, ye may be ready,";
dby[3] = "But I have sent the brethren, in order that our boasting about you may not be made void in this respect, in order that, as I have said, ye may be prepared;";

rsv[4] = "lest if some Macedo\'nians come with me and find that you are not ready, we be humiliated--to say nothing of you--for being so confident.";

yng[4] = "lest if Macedonians may come with me, and find you unprepared, we -- we may be put to shame (that we say not -- ye) in this same confidence of boasting.";
dby[4] = "lest haply, if Macedonians come with me and find you unprepared, *we*, that we say not *ye*, may be put to shame in this confidence.";
web[4] = "Lest haply if they of Macedonia come with me, and find you unprepared, we (that we say not, ye) should be ashamed in this same confident boasting.";

kjv[5] = "Therefore I thought it necessary to exhort the brethren, that they would go before unto you, and make up beforehand your bounty, whereof ye had notice before, that the same might be ready, as [a matter of] bounty, and not as [of] covetousness.";
rsv[5] = "So I thought it necessary to urge the brethren to go on to you before me, and arrange in advance for this gift you have promised, so that it may be ready not as an exaction but as a willing gift.";
asv[5] = "I thought it necessary therefore to entreat the brethren, that they would go before unto you, and make up beforehand your aforepromised bounty, that the same might be ready as a matter of bounty, and not of extortion.";
yng[5] = "Necessary, therefore, I thought [it] to exhort the brethren, that they may go before to you, and may make up before your formerly announced blessing, that this be ready, as a blessing, and not as covetousness.";
dby[5] = "I thought it necessary therefore to beg the brethren that they would come to you, and complete beforehand your fore-announced blessing, that this may be ready thus as blessing, and not as got out of you.";
web[5] = "Therefore I thought it necessary to exhort the brethren, that they would go before to you, and make up before hand your bounty, of which ye had notice before, that the same might be ready, as [a matter of] bounty, and not [of] covetousness.";
hnv[5] = "I thought it necessary therefore to entreat the brothers that they would go before to you, and arrange ahead of time the generous gift that you promised before, that the same might be ready as a matter of generosity, and not of greediness.";
vul[5] = "necessarium ergo existimavi rogare fratres ut praeveniant ad vos et praeparent repromissam benedictionem hanc paratam esse sic quasi benedictionem non quasi avaritiam";
kjv[6] = "But this [I say], He which soweth sparingly shall reap also sparingly; and he which soweth bountifully shall reap also bountifully.";
rsv[6] = "The point is this: he who sows sparingly will also reap sparingly, and he who sows bountifully will also reap bountifully.";
asv[6] = "But this [I say,] He that soweth sparingly shall reap also sparingly; and he that soweth bountifully shall reap also bountifully.";
yng[6] = "And this: He who is sowing sparingly, sparingly also shall reap; and he who is sowing in blessings, in blessings also shall reap;";
dby[6] = "But this [is true], he that sows sparingly shall reap also sparingly; and he that sows in [the spirit of] blessing shall reap also in blessing:";
web[6] = "But this [I say], He who soweth sparingly, shall reap also sparingly; and he who soweth bountifully, shall reap also bountifully.";
hnv[6] = "Remember this: he who sows sparingly will also reap sparingly. He who sows bountifully will also reap bountifully.";
vul[6] = "hoc autem qui parce seminat parce et metet et qui seminat in benedictionibus de benedictionibus et metet";

yng[7] = "each one, according as he doth purpose in heart, not out of sorrow or out of necessity, for a cheerful giver doth God love,";

hnv[7] = "Let each man give according as he has determined in his heart; not grudgingly, or under compulsion; for God loves a cheerful giver.";
vul[7] = "unusquisque prout destinavit corde suo non ex tristitia aut ex necessitate hilarem enim datorem diligit Deus";
