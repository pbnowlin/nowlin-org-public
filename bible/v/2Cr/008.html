csb[1] = "We want you to know, brothers and sisters, about the grace of God that was given to the churches of Macedonia:";
csb[2] = "During a severe trial brought about by affliction, their abundant joy and their extreme poverty overflowed in a wealth of generosity on their part.";
csb[3] = "I can testify that, according to their ability and even beyond their ability, of their own accord,";
csb[4] = "they begged us earnestly for the privilege of sharing in the ministry to the saints,";
csb[5] = "and not just as we had hoped. Instead, they gave themselves first to the Lord and then to us by God\'s will.";
csb[6] = "So we urged Titus that just as he had begun, so he should also complete among you this act of grace.";
csb[7] = "Now as you excel in everything -- in faith, speech, knowledge, and in all diligence, and in your love for us -- excel also in this act of grace.";
csb[8] = "I am not saying this as a command. Rather, by means of the diligence of others, I am testing the genuineness of your love.";
csb[9] = "For you know the grace of our Lord Jesus Christ: Though he was rich, for your sake he became poor, so that by his poverty you might become rich.";
csb[10] = "And in this matter I am giving advice because it is profitable for you, who began last year not only to do something but also to want to do it.";
csb[11] = "Now also finish the task, so that just as there was an eager desire, there may also be a completion, according to what you have.";
csb[12] = "For if the eagerness is there, the gift is acceptable according to what a person has, not according to what he does not have.";
csb[13] = "It is not that there should be relief for others and hardship for you, but it is a question of equality.";
csb[14] = "At the present time your surplus is available for their need, so that their abundance may in turn meet your need, in order that there may be equality.";
csb[15] = "As it is written: The person who had much did not have too much, and the person who had little did not have too little.";
csb[16] = "Thanks be to God, who put the same concern for you into the heart of Titus.";
csb[17] = "For he welcomed our appeal and, being very diligent, went out to you by his own choice.";
csb[18] = "We have sent with him the brother who is praised among all the churches for his gospel ministry.";
csb[19] = "And not only that, but he was also appointed by the churches to accompany us with this gracious gift that we are administering for the glory of the Lord himself and to show our eagerness to help.";
csb[20] = "We are taking this precaution so that no one will criticize us about this large sum that we are administering.";
csb[21] = "Indeed, we are giving careful thought to do what is right, not only before the Lord but also before people.";
csb[22] = "We have also sent with them our brother. We have often tested him in many circumstances and found him to be diligent -- and now even more diligent because of his great confidence in you.";
csb[23] = "As for Titus, he is my partner and coworker for you; as for our brothers, they are the messengers of the churches, the glory of Christ.";
csb[24] = "Therefore, show them proof before the churches of your love and of our boasting about you.";
