csb[1] = "In fact, I made up my mind about this: I would not come to you on another painful visit.";
csb[2] = "For if I cause you pain, then who will cheer me other than the one being hurt by me?";
csb[3] = "I wrote this very thing so that when I came I wouldn\'t have pain from those who ought to give me joy, because I am confident about all of you that my joy will also be yours.";
csb[4] = "For I wrote to you with many tears out of an extremely troubled and anguished heart -- not to cause you pain, but that you should know the abundant love I have for you.";
csb[5] = "If anyone has caused pain, he has caused pain not so much to me but to some degree -- not to exaggerate -- to all of you.";
csb[6] = "This punishment by the majority is sufficient for that person.";
csb[7] = "As a result, you should instead forgive and comfort him. Otherwise, he may be overwhelmed by excessive grief.";
csb[8] = "Therefore I urge you to reaffirm your love to him.";
csb[9] = "I wrote for this purpose: to test your character to see if you are obedient in everything.";
csb[10] = "Anyone you forgive, I do too. For what I have forgiven -- if I have forgiven anything -- it is for your benefit in the presence of Christ,";
csb[11] = "so that we may not be taken advantage of by Satan. For we are not ignorant of his schemes.";
csb[12] = "When I came to Troas to preach the gospel of Christ, even though the Lord opened a door for me,";
csb[13] = "I had no rest in my spirit because I did not find my brother Titus. Instead, I said good-bye to them and left for Macedonia.";
csb[14] = "But thanks be to God, who always leads us in Christ\'s triumphal procession and through us spreads the aroma of the knowledge of him in every place.";
csb[15] = "For to God we are the fragrance of Christ among those who are being saved and among those who are perishing.";
csb[16] = "To some we are an aroma of death leading to death, but to others, an aroma of life leading to life. Who is adequate for these things?";
csb[17] = "For we do not market the word of God for profit like so many. On the contrary, we speak with sincerity in Christ, as from God and before God.";
kjv[1] = "But I determined this with myself, that I would not come again to you in heaviness.";
rsv[1] = "For I made up my mind not to make you another painful visit.";
asv[1] = "But I determined this for myself, that I would not come again to you with sorrow.";
yng[1] = "And I decided this to myself, not again to come in sorrow unto you,";
dby[1] = "But I have judged this with myself, not to come back to you in grief.";
web[1] = "But I determined this with myself, that I would not come again to you in heaviness.";
hnv[1] = "But I determined this for myself, that I would not come to you again in sorrow.";
vul[1] = "statui autem hoc ipse apud me ne iterum in tristitia venirem ad vos";
kjv[2] = "For if I make you sorry, who is he then that maketh me glad, but the same which is made sorry by me?";
rsv[2] = "For if I cause you pain, who is there to make me glad but the one whom I have pained?";
asv[2] = "For if I make you sorry, who then is he that maketh me glad but he that is made sorry by me?";
yng[2] = "for if I make you sorry, then who is he who is making me glad, except he who is made sorry by me?";
dby[2] = "For if *I* grieve you, who also [is] it that gladdens me, if not he that is grieved through me?";
web[2] = "For if I make you sorry, who is he then that maketh me glad, but the same who is made sorry by me?";
hnv[2] = "For if I make you sorry, then who will make me glad but he who is made sorry by me?";
vul[2] = "si enim ego contristo vos et quis est qui me laetificet nisi qui contristatur ex me";
kjv[3] = "And I wrote this same unto you, lest, when I came, I should have sorrow from them of whom I ought to rejoice; having confidence in you all, that my joy is [the joy] of you all.";
rsv[3] = "And I wrote as I did, so that when I came I might not suffer pain from those who should have made me rejoice, for I felt sure of all of you, that my joy would be the joy of you all.";
asv[3] = "And I wrote this very thing, lest, when I came, I should have sorrow from them of whom I ought to rejoice; having confidence in you all, that my joy is [the joy] of you all.";
yng[3] = "and I wrote to you this same thing, that having come, I may not have sorrow from them of whom it behoved me to have joy, having confidence in you all, that my joy is of you all,";
dby[3] = "And I have written this very [letter] [to you], that coming I may not have grief from those from whom I ought to have joy; trusting in you all that my joy is [that] of you all.";
web[3] = "And I wrote this same to you, lest, coming I should have sorrow from them by whom I ought to rejoice; having confidence in you all, that my joy is [the joy] of you all.";
hnv[3] = "And I wrote this very thing to you, so that, when I came, I wouldn\'t have sorrow from them of whom I ought to rejoice; having confidence in you all, that my joy would be shared by all of you.";
vul[3] = "et hoc ipsum scripsi ut non cum venero tristitiam super tristitiam habeam de quibus oportuerat me gaudere confidens in omnibus vobis quia meum gaudium omnium vestrum est";
kjv[4] = "For out of much affliction and anguish of heart I wrote unto you with many tears; not that ye should be grieved, but that ye might know the love which I have more abundantly unto you.";
rsv[4] = "For I wrote you out of much affliction and anguish of heart and with many tears, not to cause you pain but to let you know the abundant love that I have for you.";
asv[4] = "For out of much affliction and anguish of heart I wrote unto you with many tears; not that ye should be made sorry, but that ye might know the love which I have more abundantly unto you.";
yng[4] = "for out of much tribulation and pressure of heart I wrote to you through many tears, not that ye might be made sorry, but that ye might know the love that I have more abundantly toward you.";
dby[4] = "For out of much tribulation and distress of heart I wrote to you, with many tears; not that ye may be grieved, but that ye may know the love which I have very abundantly towards you.";
web[4] = "For out of much affliction and anguish of heart I wrote to you with many tears; not that ye should be grieved, but that ye might know the love which I have more abundantly to you.";
hnv[4] = "For out of much affliction and anguish of heart I wrote to you with many tears, not that you should be made sorry, but that you might know the love that I have so abundantly for you.";
vul[4] = "nam ex multa tribulatione et angustia cordis scripsi vobis per multas lacrimas non ut contristemini sed ut sciatis quam caritatem habeo abundantius in vobis";
kjv[5] = "But if any have caused grief, he hath not grieved me, but in part: that I may not overcharge you all.";
rsv[5] = "But if any one has caused pain, he has caused it not to me, but in some measure--not to put it too severely--to you all.";
asv[5] = "But if any hath caused sorrow, he hath caused sorrow, not to me, but in part (that I press not too heavily) to you all.";
yng[5] = "And if any one hath caused sorrow, he hath not caused sorrow to me, but in part, that I may not burden you all;";
dby[5] = "But if any one has grieved, he has grieved, not me, but in part (that I may not overcharge [you]) all of you.";
web[5] = "But if any hath caused grief, he hath not grieved me, but in part: that I may not overcharge you all.";
hnv[5] = "But if any has caused sorrow, he has caused sorrow, not to me, but in part (that I not press too heavily) to you all.";
vul[5] = "si quis autem contristavit non me contristavit sed ex parte ut non onerem omnes vos";
kjv[6] = "Sufficient to such a man [is] this punishment, which [was inflicted] of many.";
rsv[6] = "For such a one this punishment by the majority is enough;";
asv[6] = "Sufficient to such a one is this punishment which was [inflicted] by the many;";
yng[6] = "sufficient to such a one is this punishment, that [is] by the more part,";
dby[6] = "Sufficient to such a one [is] this rebuke which [has been inflicted] by the many;";
web[6] = "Sufficient to such a man [is] this punishment, which [was inflicted] by many.";
hnv[6] = " Sufficient to such a one is this punishment which was inflicted by the many;";
vul[6] = "sufficit illi qui eiusmodi est obiurgatio haec quae fit a pluribus";
kjv[7] = "So that contrariwise ye [ought] rather to forgive [him], and comfort [him], lest perhaps such a one should be swallowed up with overmuch sorrow.";
rsv[7] = "so you should rather turn to forgive and comfort him, or he may be overwhelmed by excessive sorrow.";
asv[7] = "so that contrariwise ye should rather forgive him and comfort him, lest by any means such a one should be swallowed up with his overmuch sorrow.";
yng[7] = "so that, on the contrary, [it is] rather for you to forgive and to comfort, lest by over abundant sorrow such a one may be swallowed up;";
dby[7] = "so that on the contrary ye should rather shew grace and encourage, lest perhaps such a one should be swallowed up with excessive grief.";
web[7] = "So that on the other hand, ye [ought] rather to forgive [him], and comfort [him], lest perhaps such one should be swallowed up with excessive sorrow.";
hnv[7] = "so that on the contrary you should rather forgive him and comfort him, lest by any means such a one should be swallowed up with his excessive sorrow.";
vul[7] = "ita ut e contra magis donetis et consolemini ne forte abundantiori tristitia absorbeatur qui eiusmodi est";
kjv[8] = "Wherefore I beseech you that ye would confirm [your] love toward him.";
rsv[8] = "So I beg you to reaffirm your love for him.";
asv[8] = "Wherefore I beseech you to confirm [your] love toward him.";
yng[8] = "wherefore, I call upon you to confirm love to him,";
dby[8] = "Wherefore I exhort you to assure him of [your] love.";
web[8] = "Wherefore I beseech you that ye would confirm [your] love towards him.";
hnv[8] = "Therefore I beg you to confirm your love toward him.";
vul[8] = "propter quod obsecro vos ut confirmetis in illum caritatem";
kjv[9] = "For to this end also did I write, that I might know the proof of you, whether ye be obedient in all things.";
rsv[9] = "For this is why I wrote, that I might test you and know whether you are obedient in everything.";
asv[9] = "For to this end also did I write, that I might know the proof of you, whether ye are obedient in all things.";
yng[9] = "for, for this also did I write, that I might know the proof of you, whether in regard to all things ye are obedient.";
dby[9] = "For to this end also I have written, that I might know, by putting you to the test, if as to everything ye are obedient.";
web[9] = "For to this end also I wrote, that I might know the proof of you, whether ye are obedient in all things.";
hnv[9] = "For to this end I also wrote, that I might know the proof of you, whether you are obedient in all things.";
vul[9] = "ideo enim et scripsi ut cognoscam experimentum vestrum an in omnibus oboedientes sitis";
kjv[10] = "To whom ye forgive any thing, I [forgive] also: for if I forgave any thing, to whom I forgave [it], for your sakes [forgave I it] in the person of Christ;";
rsv[10] = "Any one whom you forgive, I also forgive. What I have forgiven, if I have forgiven anything, has been for your sake in the presence of Christ,";
asv[10] = "But to whom ye forgive anything, I [forgive] also: for what I also have forgiven, if I have forgiven anything, for your sakes [have I forgiven it] in the presence of Christ;";
yng[10] = "And to whom ye forgive anything -- I also; for I also, if I have forgiven anything, to whom I have forgiven [it], because of you -- in the person of Christ -- [I forgive it,]";
dby[10] = "But to whom ye forgive anything, *I* also; for I also, what I have forgiven, if I have forgiven anything, [it is] for your sakes in [the] person of Christ;";
web[10] = "To whom ye forgive any thing, I [forgive] also: for if I forgave any thing, to whom I forgave [it], for your sakes [I forgave it], in the person of Christ;";
hnv[10] = "Now I also forgive whomever you forgive anything. For if indeed I have forgiven anything, I have forgiven that one for your sakes in the presence of Messiah,";
vul[10] = "cui autem aliquid donatis et ego nam et ego quod donavi si quid donavi propter vos in persona Christi";
kjv[11] = "Lest Satan should get an advantage of us: for we are not ignorant of his devices.";
rsv[11] = "to keep Satan from gaining the advantage over us; for we are not ignorant of his designs.";
asv[11] = "that no advantage may be gained over us by Satan: for we are not ignorant of his devices.";
yng[11] = "that we may not be over-reached by the Adversary, for of his devices we are not ignorant.";
dby[11] = "that we might not have Satan get an advantage against us, for we are not ignorant of *his* thoughts.";
web[11] = "Lest Satan should get an advantage of us: for we are not ignorant of his devices.";
hnv[11] = "that no advantage may be gained over us by Hasatan; for we are not ignorant of his schemes.";
vul[11] = "ut non circumveniamur a Satana non enim ignoramus cogitationes eius";
kjv[12] = "Furthermore, when I came to Troas to [preach] Christ\'s gospel, and a door was opened unto me of the Lord,";
rsv[12] = "When I came to Tro\'as to preach the gospel of Christ, a door was opened for me in the Lord;";
asv[12] = "Now when I came to Troas for the gospel of Christ, and when a door was opened unto me in the Lord,";
yng[12] = "And having come to Troas for the good news of the Christ, and a door to me having been opened in the Lord,";
dby[12] = "Now when I came to Troas for the [publication of the] glad tidings of the Christ, a door also being opened to me in [the] Lord,";
web[12] = "Furthermore, when I came to Troas to [preach] the gospel of Christ, and a door was opened to me by the Lord,";
hnv[12] = "Now when I came to Troas for the Good News of Messiah, and when a door was opened to me in the Lord,";
vul[12] = "cum venissem autem Troadem propter evangelium Christi et ostium mihi apertum esset in Domino";
kjv[13] = "I had no rest in my spirit, because I found not Titus my brother: but taking my leave of them, I went from thence into Macedonia.";
rsv[13] = "but my mind could not rest because I did not find my brother Titus there. So I took leave of them and went on to Macedo\'nia.";
asv[13] = "I had no relief for my spirit, because I found not Titus my brother: but taking my leave of them, I went forth into Macedonia.";
yng[13] = "I have not had rest to my spirit, on my not finding Titus my brother, but having taken leave of them, I went forth to Macedonia;";
dby[13] = "I had no rest in my spirit at not finding Titus my brother; but bidding them adieu, I came away to Macedonia.";
web[13] = "I had no rest in my spirit, because I found not Titus my brother; but taking my leave of them, I went from thence into Macedonia.";
hnv[13] = "I had no relief for my spirit, because I didn\'t find Titus, my brother, but taking my leave of them, I went out into Macedonia.";
vul[13] = "non habui requiem spiritui meo eo quod non invenerim Titum fratrem meum sed valefaciens eis profectus sum in Macedoniam";
kjv[14] = "Now thanks [be] unto God, which always causeth us to triumph in Christ, and maketh manifest the savour of his knowledge by us in every place.";
rsv[14] = "But thanks be to God, who in Christ always leads us in triumph, and through us spreads the fragrance of the knowledge of him everywhere.";
asv[14] = "But thanks be unto God, who always leadeth us in triumph in Christ, and maketh manifest through us the savor of his knowledge in every place.";
yng[14] = "and to God [are] thanks, who at all times is leading us in triumph in the Christ, and the fragrance of His knowledge He is manifesting through us in every place,";
dby[14] = "But thanks [be] to God, who always leads us in triumph in the Christ, and makes manifest the odour of his knowledge through us in every place.";
web[14] = "Now thanks [be] to God, who always causeth us to triumph in Christ, and maketh manifest the savor of his knowledge by us in every place.";
hnv[14] = "Now thanks be to God, who always leads us in triumph in Messiah, and reveals through us the sweet aroma of his knowledge in every place.";
vul[14] = "Deo autem gratias qui semper triumphat nos in Christo Iesu et odorem notitiae suae manifestat per nos in omni loco";
kjv[15] = "For we are unto God a sweet savour of Christ, in them that are saved, and in them that perish:";
rsv[15] = "For we are the aroma of Christ to God among those who are being saved and among those who are perishing,";
asv[15] = "For we are a sweet savor of Christ unto God, in them that are saved, and in them that perish;";
yng[15] = "because of Christ a sweet fragrance we are to God, in those being saved, and in those being lost;";
dby[15] = "For we are a sweet odour of Christ to God, in the saved and in those that perish:";
web[15] = "For we are to God a sweet savor of Christ, in them that are saved, and in them that perish:";
hnv[15] = "For we are a sweet aroma of Messiah to God, in those who are saved, and in those who perish;";
vul[15] = "quia Christi bonus odor sumus Deo in his qui salvi fiunt et in his qui pereunt";
kjv[16] = "To the one [we are] the savour of death unto death; and to the other the savour of life unto life. And who [is] sufficient for these things?";
rsv[16] = "to one a fragrance from death to death, to the other a fragrance from life to life. Who is sufficient for these things?";
asv[16] = "to the one a savor from death unto death; to the other a savor from life unto life. And who is sufficient for these things?";
yng[16] = "to the one, indeed, a fragrance of death to death, and to the other, a fragrance of life to life; and for these things who is sufficient?";
dby[16] = "to the one an odour from death unto death, but to the others an odour from life unto life; and who [is] sufficient for these things?";
web[16] = "To the one [we are] the savor of death to death; and to the other the savor of life to life. And who [is] sufficient for these things?";
hnv[16] = "to the one a stench from death to death; to the other a sweet aroma from life to life. Who is sufficient for these things?";
vul[16] = "aliis quidem odor mortis in mortem aliis autem odor vitae in vitam et ad haec quis tam idoneus";
kjv[17] = "For we are not as many, which corrupt the word of God: but as of sincerity, but as of God, in the sight of God speak we in Christ.";
rsv[17] = "For we are not, like so many, peddlers of God\'s word; but as men of sincerity, as commissioned by God, in the sight of God we speak in Christ.";
asv[17] = "For we are not as the many, corrupting the word of God: but as of sincerity, but as of God, in the sight of God, speak we in Christ.";
yng[17] = "for we are not as the many, adulterating the word of God, but as of sincerity -- but as of God; in the presence of God, in Christ we do speak.";
dby[17] = "For we do not, as the many, make a trade of the word of God; but as of sincerity, but as of God, before God, we speak in Christ.";
web[17] = "For we are not as many, who corrupt the word of God: but as from sincerity, but as from God, in the sight of God we speak in Christ.";
hnv[17] = "For we are not as so many, peddling the word of God. But as of sincerity, but as of God, in the sight of God, we speak in Messiah.";
vul[17] = "non enim sumus sicut plurimi adulterantes verbum Dei sed ex sinceritate sed sicut ex Deo coram Deo in Christo loquimur";
</script>
