csb[1] = "In the thirty-sixth year of Asa, Israel\'s King Baasha went to war against Judah. He built Ramah in order to keep anyone from leaving or coming to King Asa of Judah.";
csb[2] = "So Asa brought out the silver and gold from the treasuries of the LORD\'s temple and the royal palace and sent it to Aram\'s King Ben-hadad, who lived in Damascus, saying,";
csb[3] = "&quot;There\'s a treaty between me and you, between my father and your father. Look, I have sent you silver and gold. Go break your treaty with Israel\'s King Baasha so that he will withdraw from me.&quot;";
csb[4] = "Ben-hadad listened to King Asa and sent the commanders of his armies to the cities of Israel. They attacked Ijon, Dan, Abel-maim, and all the storage cities of Naphtali.";
csb[5] = "When Baasha heard about it, he quit building Ramah and stopped his work.";
csb[6] = "Then King Asa brought all Judah, and they carried away the stones of Ramah and the timbers Baasha had built it with. Then he built Geba and Mizpah with them.";
csb[7] = "At that time, the seer Hanani came to King Asa of Judah and said to him, &quot;Because you depended on the king of Aram and have not depended on the LORD your God, the army of the king of Aram has escaped from you.";
csb[8] = "&quot;Were not the Cushites and Libyans a vast army with many chariots and horsemen? When you depended on the LORD, he handed them over to you.";
csb[9] = "&quot;For the eyes of the LORD roam throughout the earth to show himself strong for those who are wholeheartedly devoted to him. You have been foolish in this matter. Therefore, you will have wars from now on.&quot;";
csb[10] = "Asa was enraged with the seer and put him in prison because of his anger over this. And Asa mistreated some of the people at that time.";
csb[11] = "Note that the events of Asa\'s reign, from beginning to end, are written in the Book of the Kings of Judah and Israel.";
csb[12] = "In the thirty-ninth year of his reign, Asa developed a disease in his feet, and his disease became increasingly severe. Yet even in his disease he didn\'t seek the LORD but only the physicians.";
csb[13] = "Asa rested with his fathers; he died in the forty-first year of his reign.";
csb[14] = "He was buried in his own tomb that he had made for himself in the city of David. They laid him out in a coffin that was full of spices and various mixtures of prepared ointments; then they made a great fire in his honor.";
kjv[1] = "In the six and thirtieth year of the reign of Asa Baasha king of Israel came up against Judah, and built Ramah, to the intent that he might let none go out or come in to Asa king of Judah.";

yng[1] = "In the thirty and sixth year of the reign of Asa, come up hath Baasha king of Israel, against Judah, and buildeth Ramah, so as not to permit any going out and coming in to Asa king of Judah.";
dby[1] = "In the thirty-sixth year of the reign of Asa, Baasha king of Israel came up against Judah, and built Ramah, in order to let none go out or come in to Asa king of Judah.";

vul[1] = "anno autem tricesimo sexto regni eius ascendit Baasa rex Israhel in Iudam et muro circumdabat Rama ut nullus tute posset egredi et ingredi de regno Asa";

rsv[7] = "At that time Hana\'ni the seer came to Asa king of Judah, and said to him, &quot;Because you relied on the king of Syria, and did not rely on the LORD your God, the army of the king of Syria has escaped you.";
asv[7] = "And at that time Hanani the seer came to Asa king of Judah, and said unto him, Because thou hast relied on the king of Syria, and hast not relied on Jehovah thy God, therefore is the host of the king of Syria escaped out of thy hand.";
yng[7] = "And at that time hath Hanani the seer come in unto Asa king of Judah, and saith unto him, `Because of thy leaning on the king of Aram, and thou hast not leaned on Jehovah thy God, therefore hath the force of the king of Aram escaped from thy hand.";
dby[7] = "And at that time Hanani the seer came to Asa king of Judah, and said unto him, Because thou hast relied on the king of Syria, and hast not relied on Jehovah thy God, therefore has the army of the king of Syria escaped out of thy hand.";

hnv[7] = "At that time Hanani the seer came to Asa king of Yehudah, and said to him, Because you have relied on the king of Aram, and have not relied on the LORD your God, therefore is the host of the king of Aram escaped out of your hand.";
