csb[1] = "Solomon decided to build a temple for the name of the LORD and a royal palace for himself,";
csb[2] = "so he assigned 70,000 men as porters, 80,000 men as stonecutters in the mountains, and 3,600 as supervisors over them.";
csb[3] = "Then Solomon sent word to King Hiram of Tyre: Do for me what you did for my father David. You sent him cedars to build him a house to live in.";
csb[4] = "Now I am building a temple for the name of the LORD my God in order to dedicate it to him for burning fragrant incense before him, for displaying the rows of the Bread of the Presence continuously, and for sacrificing burnt offerings for the morning and the evening, the Sabbaths and the New Moons, and the appointed festivals of the LORD our God. This is ordained for Israel permanently.";
csb[5] = "The temple that I am building will be great, for our God is greater than any of the gods.";
csb[6] = "But who is able to build a temple for him, since even heaven and the highest heaven cannot contain him? Who am I then that I should build a temple for him except as a place to burn incense before him?";
csb[7] = "Therefore, send me an artisan who is skilled in engraving to work with gold, silver, bronze, and iron, and with purple, crimson, and blue yarn. He will work with the artisans who are with me in Judah and Jerusalem, appointed by my father David.";
csb[8] = "Also, send me cedar, cypress, and algum logs from Lebanon, for I know that your servants know how to cut the trees of Lebanon. Note that my servants will be with your servants";
csb[9] = "to prepare logs for me in abundance because the temple I am building will be great and wondrous.";
csb[10] = "I will give your servants, the woodcutters who cut the trees, one hundred thousand bushels of wheat flour, one hundred thousand bushels of barley, one hundred ten thousand gallons of wine, and one hundred ten thousand gallons of oil.";
csb[11] = "Then King Hiram of Tyre wrote a letter and sent it to Solomon: Because the LORD loves his people, he set you over them as king.";
csb[12] = "Hiram also said: Blessed be the LORD God of Israel, who made the heavens and the earth! He gave King David a wise son with insight and understanding, who will build a temple for the LORD and a royal palace for himself.";
csb[13] = "I have now sent Huram-abi, a skillful man who has understanding.";
csb[14] = "He is the son of a woman from the daughters of Dan. His father is a man of Tyre. He knows how to work with gold, silver, bronze, iron, stone, and wood, with purple, blue, crimson yarn, and fine linen. He knows how to do all kinds of engraving and to execute any design that may be given him. I have sent him to be with your artisans and the artisans of my lord, your father David.";
csb[15] = "Now, let my lord send the wheat, barley, oil, and wine to his servants as promised.";
csb[16] = "We will cut logs from Lebanon, as many as you need, and bring them to you as rafts by sea to Joppa. You can then take them up to Jerusalem.";
csb[17] = "Solomon took a census of all the resident alien men in the land of Israel, after the census that his father David had conducted, and the total was 153,600.";
csb[18] = "Solomon made 70,000 of them porters, 80,000 stonecutters in the mountains, and 3,600 supervisors to make the people work.";
kjv[1] = "And Solomon determined to build an house for the name of the LORD, and an house for his kingdom.";
rsv[1] = "Now Solomon purposed to build a temple for the name of the LORD, and a royal palace for himself.";
asv[1] = "Now Solomon purposed to build a house for the name of Jehovah, and a house for his kingdom.";
yng[1] = "And Solomon saith to build a house for the name of Jehovah, and a house for his kingdom,";
dby[1] = "And Solomon purposed to build a house for the name of Jehovah, and a house for his kingdom.";
web[1] = "And Solomon determined to build a house for the name of the LORD, and a house for his kingdom.";
hnv[1] = "Now Shlomo purposed to build a house for the name of the LORD, and a house for his kingdom.";
vul[1] = "decrevit autem Salomon aedificare domum nomini Domini et palatium sibi";
kjv[2] = "And Solomon told out threescore and ten thousand men to bear burdens, and fourscore thousand to hew in the mountain, and three thousand and six hundred to oversee them.";
rsv[2] = "And Solomon assigned seventy thousand men to bear burdens and eighty thousand to quarry in the hill country, and three thousand six hundred to oversee them.";
asv[2] = "And Solomon counted out threescore and ten thousand men to bear burdens, and fourscore thousand men that were hewers in the mountains, and three thousand and six hundred to oversee them.";
yng[2] = "and Solomon numbereth seventy thousand men bearing burden, and eighty thousand men hewing in the mountain, and overseers over them -- three thousand and six hundred.";
dby[2] = "And Solomon numbered seventy thousand men to bear burdens, and eighty thousand stone-masons in the mountain, and three thousand six hundred to superintend them.";
web[2] = "And Solomon numbered out seventy thousand men to bear burdens, and eighty thousand to hew in the mountain, and three thousand and six hundred to oversee them.";
hnv[2] = "Shlomo counted out seventy thousand men to bear burdens, and eighty thousand men who were stone cutters in the mountains, and three thousand and six hundred to oversee them.";
vul[2] = "et numeravit septuaginta milia virorum portantium umeris et octoginta milia qui caederent lapides in montibus praepositosque eorum tria milia sescentos";
kjv[3] = "And Solomon sent to Huram the king of Tyre, saying, As thou didst deal with David my father, and didst send him cedars to build him an house to dwell therein, [even so deal with me].";
rsv[3] = "And Solomon sent word to Huram the king of Tyre: &quot;As you dealt with David my father and sent him cedar to build himself a house to dwell in, so deal with me.";
asv[3] = "And Solomon sent to Huram the king of Tyre, saying, As thou didst deal with David my father, and didst send him cedars to build him a house to dwell therein, [even so deal with me].";
yng[3] = "And Solomon sendeth unto Huram king of Tyre, saying, `When thou hast dealt with David my father, then thou dost send to him cedars to build for him a house to dwell in;";
dby[3] = "And Solomon sent to Huram king of Tyre, saying, As thou didst deal with David my father, and didst send him cedars to build him a house to dwell therein [so do for me].";
web[3] = "And Solomon sent to Huram the king of Tyre, saying, As thou didst deal with David my father, and didst send him cedars to build him a house to dwell in it, [even so deal with me].";
hnv[3] = "Shlomo sent to Huram the king of Tzor, saying, As you did deal with David my father, and did send him cedars to build him a house to dwell therein, [even so deal with me].";
vul[3] = "misit quoque ad Hiram regem Tyri dicens sicut egisti cum David patre meo et misisti ei ligna cedrina ut aedificaret sibi domum in qua et habitavit";
kjv[4] = "Behold, I build an house to the name of the LORD my God, to dedicate [it] to him, [and] to burn before him sweet incense, and for the continual shewbread, and for the burnt offerings morning and evening, on the sabbaths, and on the new moons, and on the solemn feasts of the LORD our God. This [is an ordinance] for ever to Israel.";
rsv[4] = "Behold, I am about to build a house for the name of the LORD my God and dedicate it to him for the burning of incense of sweet spices before him, and for the continual offering of the showbread, and for burnt offerings morning and evening, on the sabbaths and the new moons and the appointed feasts of the LORD our God, as ordained for ever for Israel.";
asv[4] = "Behold, I am about to build a house for the name of Jehovah my God, to dedicate it to him, and to burn before him incense of sweet spices, and for the continual showbread, and for the burnt-offerings morning and evening, on the sabbaths, and on the new moons, and on the set feasts of Jehovah our God. This is [an ordinance] for ever to Israel.";
yng[4] = "lo, I am building a house to the name of Jehovah my God, to sanctify [it] to Him, to make perfume before Him, perfume of spices, and a continual arrangement, and burnt-offerings at morning and at evening, at sabbaths, and at new moons, and at appointed seasons of Jehovah our God; to the age this [is] on Israel.";
dby[4] = "Behold, I build a house unto the name of Jehovah my God to dedicate it to him, to burn before him sweet incense, and for the continual arrangement [of the shewbread], and for the morning and evening burnt-offerings [and] on the sabbaths and on the new moons, and on the set feasts of Jehovah our God. This is [an ordinance] for ever to Israel.";
web[4] = "Behold, I build a house to the name of the LORD my God, to dedicate [it] to him, [and] to burn before him sweet incense, and for the continual show-bread, and for the burnt-offerings morning and evening, on the sabbaths, and on the new moons, and on the solemn feasts of the LORD our God. This [is an ordinance] for ever to Israel.";
hnv[4] = "Behold, I am about to build a house for the name of the LORD my God, to dedicate it to him, and to burn before him incense of sweet spices, and for the continual show bread, and for the burnt offerings morning and evening, on the Shabbatot, and on the new moons, and on the set feasts of the LORD our God. This is [an ordinance] forever to Yisra\'el.";
vul[4] = "sic fac mecum ut aedificem domum nomini Domini Dei mei et consecrem eam ad adolendum incensum coram illo et fumiganda aromata et ad propositionem panum sempiternam et holocaustomata mane et vespere sabbatis quoque et neomeniis et sollemnitatibus Domini Dei nostri in sempiternum quae mandata sunt Israheli";
kjv[5] = "And the house which I build [is] great: for great [is] our God above all gods.";
rsv[5] = "The house which I am to build will be great, for our God is greater than all gods.";
asv[5] = "And the house which I build is great; for great is our God above all gods.";
yng[5] = "`And the house that I am building [is] great, for greater [is] our God than all gods;";
dby[5] = "And the house that I will build is great; for great is our God above all gods.";
web[5] = "And the house which I build [is] great: for great [is] our God above all gods.";
hnv[5] = "The house which I build is great; for great is our God above all gods.";
vul[5] = "domus autem quam aedificare cupio magna est magnus est enim Deus noster super omnes deos";

rsv[6] = "But who is able to build him a house, since heaven, even highest heaven, cannot contain him? Who am I to build a house for him, except as a place to burn incense before him?";
asv[6] = "But who is able to build him a house, seeing heaven and the heaven of heavens cannot contain him? who am I then, that I should build him a house, save only to burn incense before him?";
yng[6] = "and who doth retain strength to build to Him a house, for the heavens, even the heavens of the heavens, do not contain Him? and who [am] I that I do build to Him a house, except to make perfume before Him?";
dby[6] = "But who is able to build him a house, seeing the heavens and the heaven of heavens cannot contain him? And who am I that I should build him a house, except to burn sacrifice before him?";
web[6] = "But who is able to build him a house, seeing the heaven and heaven of heavens cannot contain him? who [am] I then that I should build him a house, save only to burn sacrifice before him?";
hnv[6] = "But who is able to build him a house, seeing heaven and the heaven of heavens can\'t contain him? who am I then, that I should build him a house, save only to burn incense before him?";
vul[6] = "quis ergo poterit praevalere ut aedificet ei dignam domum si caelum et caeli caelorum capere eum non queunt quantus ego sum ut possim ei aedificare domum sed ad hoc tantum ut adoleatur incensum coram illo";
kjv[7] = "Send me now therefore a man cunning to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and that can skill to grave with the cunning men that [are] with me in Judah and in Jerusalem, whom David my father did provide.";
rsv[7] = "So now send me a man skilled to work in gold, silver, bronze, and iron, and in purple, crimson, and blue fabrics, trained also in engraving, to be with the skilled workers who are with me in Judah and Jerusalem, whom David my father provided.";
asv[7] = "Now therefore send me a man skilful to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and that knoweth how to grave [all manner of] gravings, [to be] with the skilful men that are with me in Judah and in Jerusalem, whom David my father did provide.";
yng[7] = "`And now, send to me a wise man to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and knowing to grave gravings with the wise men who [are] with me in Judah and in Jerusalem, whom David my father prepared;";
dby[7] = "And now send me a man skilful to work in gold, and in silver, and in bronze, and in iron, and in purple and crimson and blue, and experienced in carving, besides the skilful men that are with me in Judah and in Jerusalem, whom David my father provided.";
web[7] = "Send me now therefore a man skillful to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and that hath skill to grave with the skillful men that [are] with me in Judah and in Jerusalem, whom David my father provided.";
hnv[7] = "Now therefore send me a man skillful to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and who knows how to engrave [all manner of] engravings, [to be] with the skillful men who are with me in Yehudah and in Yerushalayim, whom David my father did provide.";
vul[7] = "mitte igitur mihi virum eruditum qui noverit operari in auro et argento aere ferro purpura coccino et hyacintho et qui sciat scalpere celata cum his artificibus quos mecum habeo in Iudaea et in Hierusalem quos praeparavit David pater meus";
kjv[8] = "Send me also cedar trees, fir trees, and algum trees, out of Lebanon: for I know that thy servants can skill to cut timber in Lebanon; and, behold, my servants [shall be] with thy servants,";
rsv[8] = "Send me also cedar, cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And my servants will be with your servants,";
asv[8] = "Send me also cedar-trees, fir-trees, and algum-trees, out of Lebanon; for I know that thy servants know how to cut timber in Lebanon. And, behold, my servants shall be with thy servants,";
yng[8] = "and send to me cedar-trees, firs, and algums from Lebanon, for I have known that thy servants know to cut down trees of Lebanon, and lo, my servants [are] with thy servants,";
dby[8] = "Send me also cedar-trees, cypress-trees, and sandal-wood trees, out of Lebanon; for I know that thy servants are experienced in cutting timber in Lebanon; and behold, my servants shall be with thy servants,";
web[8] = "Send me also cedar trees, fir trees, and algum trees out of Lebanon: for I know that thy servants have skill to cut timber in Lebanon; and behold, my servants [shall be] with thy servants,";
hnv[8] = " Send me also cedar trees, fir trees, and algum trees, out of Levanon; for I know that your servants know how to cut timber in Levanon: and, behold, my servants shall be with your servants,";
vul[8] = "sed et ligna cedrina mitte mihi et arceuthina et pinea de Libano scio enim quod servi tui noverint caedere ligna de Libano et erunt servi mei cum servis tuis";
kjv[9] = "Even to prepare me timber in abundance: for the house which I am about to build [shall be] wonderful great.";
rsv[9] = "to prepare timber for me in abundance, for the house I am to build will be great and wonderful.";
asv[9] = "even to prepare me timber in abundance; for the house which I am about to build shall be great and wonderful.";
yng[9] = "even to prepare for me trees in abundance, for the house that I am building [is] great and wonderful.";
dby[9] = "even to prepare me timber in abundance: for the house that I build shall be great and wonderful.";
web[9] = "Even to prepare me timber in abundance: for the house which I am about to build [shall be] wonderfully great.";
hnv[9] = "even to prepare me timber in abundance; for the house which I am about to build shall be great and wonderful.";
vul[9] = "ut parentur mihi ligna plurima domus enim quam cupio aedificare magna est nimis et inclita";
kjv[10] = "And, behold, I will give to thy servants, the hewers that cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.";
rsv[10] = "I will give for your servants, the hewers who cut timber, twenty thousand cors of crushed wheat, twenty thousand cors of barley, twenty thousand baths of wine, and twenty thousand baths of oil.&quot;";
asv[10] = "And, behold, I will give to thy servants, the hewers that cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.";
yng[10] = "`And lo, to hewers, to those cutting the trees, I have given beaten wheat to thy servants, cors twenty thousand, and barley, cors twenty thousand, and wine, baths twenty thousand, and oil, baths twenty thousand.\'";
dby[10] = "And behold, I will give to thy servants the hewers that fell timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.";
web[10] = "And behold, I will give to thy servants, the hewers that cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.";
hnv[10] = "Behold, I will give to your servants, the cutters who cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.";
vul[10] = "praeterea operariis qui caesuri sunt ligna servis tuis dabo in cibaria tritici choros viginti milia et hordei choros totidem olei quoque sata viginti milia";
kjv[11] = "Then Huram the king of Tyre answered in writing, which he sent to Solomon, Because the LORD hath loved his people, he hath made thee king over them.";
rsv[11] = "Then Huram the king of Tyre answered in a letter which he sent to Solomon, &quot;Because the LORD loves his people he has made you king over them.&quot;";
asv[11] = "Then Huram the king of Tyre answered in writing, which he sent to Solomon, Because Jehovah loveth his people, he hath made thee king over them.";
yng[11] = "And Huram king of Tyre saith in writing, and sendeth unto Solomon: `In the love of Jehovah to His people He hath given thee king over them.\'";
dby[11] = "And Huram king of Tyre answered in writing, which he sent to Solomon, Because Jehovah loved his people, he made thee king over them.";
web[11] = "Then Huram the king of Tyre answered in writing, which he sent to Solomon, Because the LORD hath loved his people, he hath made thee king over them.";
hnv[11] = "Then Huram the king of Tzor answered in writing, which he sent to Shlomo, Because the LORD loves his people, he has made you king over them.";

kjv[12] = "Huram said moreover, Blessed [be] the LORD God of Israel, that made heaven and earth, who hath given to David the king a wise son, endued with prudence and understanding, that might build an house for the LORD, and an house for his kingdom.";
rsv[12] = "Huram also said, &quot;Blessed be the LORD God of Israel, who made heaven and earth, who has given King David a wise son, endued with discretion and understanding, who will build a temple for the LORD, and a royal palace for himself.";
asv[12] = "Huram said moreover, Blessed be Jehovah, the God of Israel, that made heaven and earth, who hath given to David the king a wise son, endued with discretion and understanding, that should build a house for Jehovah, and a house for his kingdom.";
yng[12] = "And Huram saith, `Blessed [is] Jehovah, God of Israel, who made the heavens and the earth, who hath given to David the king a wise son, knowing wisdom and understanding, who doth build a house for Jehovah, and a house for his kingdom.";
dby[12] = "And Huram said, Blessed be Jehovah the God of Israel, that made the heavens and the earth, who has given to David the king a wise son, endued with prudence and understanding, who will build a house for Jehovah and a house for his kingdom.";
web[12] = "Huram said moreover, Blessed [be] the LORD God of Israel, that made heaven and earth, who hath given to David the king a wise son, endued with prudence and understanding, that may build a house for the LORD, and a house for his kingdom.";
hnv[12] = "Huram said moreover, Blessed be the LORD, the God of Yisra\'el, that made heaven and eretz, who has given to David the king a wise son, endowed with discretion and understanding, that should build a house for the LORD, and a house for his kingdom.";
vul[12] = "et addidit dicens benedictus Dominus Deus Israhel qui fecit caelum et terram qui dedit David regi filium sapientem et eruditum et sensatum atque prudentem ut aedificaret domum Domino et palatium sibi";
kjv[13] = "And now I have sent a cunning man, endued with understanding, of Huram my father\'s,";

asv[13] = "And now I have sent a skilful man, endued with understanding, of Huram my father\'s,";
yng[13] = "`And now, I have sent a wise man having understanding, of Huram my father,";
dby[13] = "And now, I send a skilful man, endued with understanding, Huram Abi,";
web[13] = "And now I have sent a skillful man, endued with understanding, of Huram my father\'s,";
hnv[13] = "Now I have sent a skillful man, endowed with understanding, of Huram my father\'s,";
vul[13] = "misi ergo tibi virum prudentem et scientissimum Hiram patrem meum";
kjv[14] = "The son of a woman of the daughters of Dan, and his father [was] a man of Tyre, skilful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen, and in crimson; also to grave any manner of graving, and to find out every device which shall be put to him, with thy cunning men, and with the cunning men of my lord David thy father.";
rsv[14] = "the son of a woman of the daughters of Dan, and his father was a man of Tyre. He is trained to work in gold, silver, bronze, iron, stone, and wood, and in purple, blue, and crimson fabrics and fine linen, and to do all sorts of engraving and execute any design that may be assigned him, with your craftsmen, the craftsmen of my lord, David your father.";
asv[14] = "the son of a woman of the daughters of Dan; and his father was a man of Tyre, skilful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen, and in crimson, also to grave any manner of graving, and to devise any device; that there may be [a place] appointed unto him with thy skilful men, and with the skilful men of my lord David thy father.";
yng[14] = "(son of a woman of the daughters of Dan, and his father a man of Tyre), knowing to work in gold, and in silver, in brass, in iron, in stones, and in wood, in purple, in blue, and in fine linen, and in crimson, and to grave any graving, and to devise any device that is given to him, with thy wise men, and the wise men of my lord David thy father.";
dby[14] = "the son of a woman of the daughters of Dan, and whose father was a man of Tyre, experienced in working in gold, and in silver, in bronze, in iron, in stone, and in timber, in purple, in blue, and in byssus, and in crimson, and for doing any manner of engraving, and for inventing every device which shall be put to him, besides thy skilful men, and the skilful men of my lord David thy father.";
web[14] = "The son of a woman of the daughters of Dan, and his father [was] a man of Tyre, skillful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen, and in crimson; also to engrave any manner of engraving, and to find out every device which shall be put to him, with thy skillful men, and with the skillful men of my lord David thy father.";
hnv[14] = "the son of a woman of the daughters of Dan; and his father was a man of Tzor, skillful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen, and in crimson, also to engrave any manner of engraving, and to devise any device; that there may be [a place] appointed to him with your skillful men, and with the skillful men of my lord David your father.";
vul[14] = "filium mulieris de filiabus Dan cuius pater Tyrius fuit qui noverit operari in auro et argento et aere et ferro et marmore et lignis in purpura quoque et hyacintho et bysso et coccino et qui sciat celare omnem scalpturam et adinvenire prudenter quodcumque in opere necessarium est cum artificibus tuis et cum artificibus domini mei David patris tui";
kjv[15] = "Now therefore the wheat, and the barley, the oil, and the wine, which my lord hath spoken of, let him send unto his servants:";
rsv[15] = "Now therefore the wheat and barley, oil and wine, of which my lord has spoken, let him send to his servants;";

hnv[15] = "Now therefore the wheat and the barley, the oil and the wine, which my lord has spoken of, let him send to his servants:";

asv[16] = "and we will cut wood out of Lebanon, as much as thou shalt need; and we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem.";
yng[16] = "and we -- we cut trees out of Lebanon, according to all thy need, and bring them in to thee -- floats by sea, to Joppa, and thou dost take them up to Jerusalem.\'";
dby[16] = "And we will cut wood out of Lebanon, as much as thou shalt need; and we will bring it to thee [in] floats by sea to Joppa, and thou shalt carry it up to Jerusalem.";
web[16] = "And we will cut wood out of Lebanon, as much as thou shalt need: and we will bring it to thee in floats by sea to Joppa; and thou mayest convey it to Jerusalem.";

asv[17] = "And Solomon numbered all the sojourners that were in the land of Israel, after the numbering wherewith David his father had numbered them; and they were found a hundred and fifty thousand and three thousand and six hundred.";
yng[17] = "And Solomon numbereth all the men, the sojourners who [are] in the land of Israel, after the numbering with which David his father numbered them, and they are found a hundred and fifty thousand, and three thousand, and six hundred;";
dby[17] = "And Solomon numbered all the strangers that were in the land of Israel, after the account that David his father had taken of them, and there were found a hundred and fifty-three thousand six hundred.";

hnv[17] = "Shlomo numbered all the foreigners who were in Eretz-Yisra\'el, after the numbering with which David his father had numbered them; and they were found one hundred fifty-three thousand six hundred.";
vul[17] = "numeravit igitur Salomon omnes viros proselytos qui erant in terra Israhel post dinumerationem quam dinumeravit David pater eius et inventi sunt centum quinquaginta milia et tria milia sescenti";
