csb[1] = "Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.";
csb[2] = "He did what was right in the LORD\'s sight and walked in the ways of his ancestor David; he did not turn aside to the right or the left.";
csb[3] = "In the eighth year of his reign, while he was still a youth, Josiah began to seek the God of his ancestor David, and in the twelfth year he began to cleanse Judah and Jerusalem of the high places, the Asherah poles, the carved images, and the cast images.";
csb[4] = "Then in his presence the altars of the Baals were torn down, and he chopped down the shrines that were above them. He shattered the Asherah poles, the carved images, and the cast images, crushed them to dust, and scattered them over the graves of those who had sacrificed to them.";
csb[5] = "He burned the bones of the priests on their altars. So he cleansed Judah and Jerusalem.";
csb[6] = "He did the same in the cities of Manasseh, Ephraim, and Simeon, and as far as Naphtali and on their surrounding mountain shrines.";
csb[7] = "He tore down the altars, and he smashed the Asherah poles and the carved images to powder. He chopped down all the shrines throughout the land of Israel and returned to Jerusalem.";
csb[8] = "In the eighteenth year of his reign, in order to cleanse the land and the temple, Josiah sent Shaphan son of Azaliah, along with Maaseiah the governor of the city and the court historian Joah son of Joahaz, to repair the temple of the LORD his God.";
csb[9] = "So they went to the high priest Hilkiah and gave him the silver brought into God\'s temple. The Levites and the doorkeepers had collected it from Manasseh, Ephraim, and from the entire remnant of Israel, and from all Judah, Benjamin, and the inhabitants of Jerusalem.";
csb[10] = "They gave it to those doing the work -- those who oversaw the LORD\'s temple. They gave it to the workmen who were working in the LORD\'s temple, to repair and restore the temple;";
csb[11] = "they gave it to the carpenters and builders and also used it to buy quarried stone and timbers -- for joining and making beams -- for the buildings that Judah\'s kings had destroyed.";
csb[12] = "The men were doing the work with integrity. Their overseers were Jahath and Obadiah, Levites from the Merarites, and Zechariah and Meshullam from the Kohathites as supervisors. The Levites were all skilled with musical instruments.";
csb[13] = "They were also over the porters and were supervising all those doing the work task by task. Some of the Levites were secretaries, officers, and gatekeepers.";
csb[14] = "When they brought out the silver that had been deposited in the LORD\'s temple, the priest Hilkiah found the book of the law of the LORD written by the hand of Moses.";
csb[15] = "Consequently, Hilkiah told the court secretary Shaphan, &quot;I have found the book of the law in the LORD\'s temple,&quot; and he gave the book to Shaphan.";
csb[16] = "Shaphan took the book to the king, and also reported, &quot;Your servants are doing all that was placed in their hands.";
csb[17] = "&quot;They have emptied out the silver that was found in the LORD\'s temple and have given it to the overseers and to those doing the work.&quot;";
csb[18] = "Then the court secretary Shaphan told the king, &quot;The priest Hilkiah gave me a book,&quot; and Shaphan read from it in the presence of the king.";
csb[19] = "When the king heard the words of the law, he tore his clothes.";
csb[20] = "Then he commanded Hilkiah, Ahikam son of Shaphan, Abdon son of Micah, the court secretary Shaphan, and the king\'s servant Asaiah,";
csb[21] = "&quot;Go and inquire of the LORD for me and for those remaining in Israel and Judah, concerning the words of the book that was found. For great is the LORD\'s wrath that is poured out on us because our ancestors have not kept the word of the LORD in order to do everything written in this book.&quot;";
csb[22] = "So Hilkiah and those the king had designated went to the prophetess Huldah, the wife of Shallum son of Tokhath, son of Hasrah, keeper of the wardrobe. She lived in Jerusalem in the Second District. They spoke with her about this.";
csb[23] = "She said to them, &quot;This is what the LORD God of Israel says: Say to the man who sent you to me,";
csb[24] = "&quot;\'This is what the LORD says: I am about to bring disaster on this place and on its inhabitants, fulfilling all the curses written in the book that they read in the presence of the king of Judah,";
csb[25] = "&quot;because they have abandoned me and burned incense to other gods so as to anger me with all the works of their hands. My wrath will be poured out on this place, and it will not be quenched.\'";
csb[26] = "&quot;Say this to the king of Judah who sent you to inquire of the LORD: \'This is what the LORD God of Israel says: As for the words that you heard,";
csb[27] = "&quot;because your heart was tender and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me, and you tore your clothes and wept before me, I myself have heard\' -- this is the LORD\'s declaration.";
csb[28] = "&quot;\'I will indeed gather you to your fathers, and you will be gathered to your grave in peace. Your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.\' &quot; Then they reported to the king.";
csb[29] = "So the king sent messengers and gathered all the elders of Judah and Jerusalem.";
csb[30] = "The king went up to the LORD\'s temple with all the men of Judah and the inhabitants of Jerusalem, as well as the priests and the Levites -- all the people from the oldest to the youngest. He read in their hearing all the words of the book of the covenant that had been found in the LORD\'s temple.";
csb[31] = "Then the king stood at his post and made a covenant in the LORD\'s presence to follow the LORD and to keep his commands, his decrees, and his statutes with all his heart and with all his soul in order to carry out the words of the covenant written in this book.";
csb[32] = "He had all those present in Jerusalem and Benjamin agree to it. So all the inhabitants of Jerusalem carried out the covenant of God, the God of their ancestors.";
csb[33] = "So Josiah removed everything that was detestable from all the lands belonging to the Israelites, and he required all who were present in Israel to serve the LORD their God. Throughout his reign they did not turn aside from following the LORD, the God of their ancestors.";
kjv[1] = "Josiah [was] eight years old when he began to reign, and he reigned in Jerusalem one and thirty years.";
kjv[2] = "And he did [that which was] right in the sight of the LORD, and walked in the ways of David his father, and declined [neither] to the right hand, nor to the left.";
kjv[3] = "For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father: and in the twelfth year he began to purge Judah and Jerusalem from the high places, and the groves, and the carved images, and the molten images.";
kjv[4] = "And they brake down the altars of Baalim in his presence; and the images, that [were] on high above them, he cut down; and the groves, and the carved images, and the molten images, he brake in pieces, and made dust [of them], and strowed [it] upon the graves of them that had sacrificed unto them.";
kjv[5] = "And he burnt the bones of the priests upon their altars, and cleansed Judah and Jerusalem.";
kjv[6] = "And [so did he] in the cities of Manasseh, and Ephraim, and Simeon, even unto Naphtali, with their mattocks round about.";
kjv[7] = "And when he had broken down the altars and the groves, and had beaten the graven images into powder, and cut down all the idols throughout all the land of Israel, he returned to Jerusalem.";
kjv[8] = "Now in the eighteenth year of his reign, when he had purged the land, and the house, he sent Shaphan the son of Azaliah, and Maaseiah the governor of the city, and Joah the son of Joahaz the recorder, to repair the house of the LORD his God.";
kjv[9] = "And when they came to Hilkiah the high priest, they delivered the money that was brought into the house of God, which the Levites that kept the doors had gathered of the hand of Manasseh and Ephraim, and of all the remnant of Israel, and of all Judah and Benjamin; and they returned to Jerusalem.";
kjv[10] = "And they put [it] in the hand of the workmen that had the oversight of the house of the LORD, and they gave it to the workmen that wrought in the house of the LORD, to repair and amend the house:";
kjv[11] = "Even to the artificers and builders gave they [it], to buy hewn stone, and timber for couplings, and to floor the houses which the kings of Judah had destroyed.";
kjv[12] = "And the men did the work faithfully: and the overseers of them [were] Jahath and Obadiah, the Levites, of the sons of Merari; and Zechariah and Meshullam, of the sons of the Kohathites, to set [it] forward; and [other of] the Levites, all that could skill of instruments of musick.";
kjv[13] = "Also [they were] over the bearers of burdens, and [were] overseers of all that wrought the work in any manner of service: and of the Levites [there were] scribes, and officers, and porters.";
kjv[14] = "And when they brought out the money that was brought into the house of the LORD, Hilkiah the priest found a book of the law of the LORD [given] by Moses.";
kjv[15] = "And Hilkiah answered and said to Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah delivered the book to Shaphan.";
kjv[16] = "And Shaphan carried the book to the king, and brought the king word back again, saying, All that was committed to thy servants, they do [it].";
kjv[17] = "And they have gathered together the money that was found in the house of the LORD, and have delivered it into the hand of the overseers, and to the hand of the workmen.";
kjv[18] = "Then Shaphan the scribe told the king, saying, Hilkiah the priest hath given me a book. And Shaphan read it before the king.";
kjv[19] = "And it came to pass, when the king had heard the words of the law, that he rent his clothes.";
kjv[20] = "And the king commanded Hilkiah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe, and Asaiah a servant of the king\'s, saying,";
kjv[21] = "Go, enquire of the LORD for me, and for them that are left in Israel and in Judah, concerning the words of the book that is found: for great [is] the wrath of the LORD that is poured out upon us, because our fathers have not kept the word of the LORD, to do after all that is written in this book.";
kjv[22] = "And Hilkiah, and [they] that the king [had appointed], went to Huldah the prophetess, the wife of Shallum the son of Tikvath, the son of Hasrah, keeper of the wardrobe; (now she dwelt in Jerusalem in the college:) and they spake to her to that [effect].";
kjv[23] = "And she answered them, Thus saith the LORD God of Israel, Tell ye the man that sent you to me,";
kjv[24] = "Thus saith the LORD, Behold, I will bring evil upon this place, and upon the inhabitants thereof, [even] all the curses that are written in the book which they have read before the king of Judah:";
kjv[25] = "Because they have forsaken me, and have burned incense unto other gods, that they might provoke me to anger with all the works of their hands; therefore my wrath shall be poured out upon this place, and shall not be quenched.";
kjv[26] = "And as for the king of Judah, who sent you to enquire of the LORD, so shall ye say unto him, Thus saith the LORD God of Israel [concerning] the words which thou hast heard;";
kjv[27] = "Because thine heart was tender, and thou didst humble thyself before God, when thou heardest his words against this place, and against the inhabitants thereof, and humbledst thyself before me, and didst rend thy clothes, and weep before me; I have even heard [thee] also, saith the LORD.";
kjv[28] = "Behold, I will gather thee to thy fathers, and thou shalt be gathered to thy grave in peace, neither shall thine eyes see all the evil that I will bring upon this place, and upon the inhabitants of the same. So they brought the king word again.";
kjv[29] = "Then the king sent and gathered together all the elders of Judah and Jerusalem.";
kjv[30] = "And the king went up into the house of the LORD, and all the men of Judah, and the inhabitants of Jerusalem, and the priests, and the Levites, and all the people, great and small: and he read in their ears all the words of the book of the covenant that was found in the house of the LORD.";
kjv[31] = "And the king stood in his place, and made a covenant before the LORD, to walk after the LORD, and to keep his commandments, and his testimonies, and his statutes, with all his heart, and with all his soul, to perform the words of the covenant which are written in this book.";
kjv[32] = "And he caused all that were present in Jerusalem and Benjamin to stand [to it]. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.";
kjv[33] = "And Josiah took away all the abominations out of all the countries that [pertained] to the children of Israel, and made all that were present in Israel to serve, [even] to serve the LORD their God. [And] all his days they departed not from following the LORD, the God of their fathers.";

yng[3] = "And in the eighth year of his reign (and he yet a youth), he hath begun to seek to the God of David his father, and in the twelfth year he hath begun to cleanse Judah and Jerusalem from the high places, and the shrines, and the graven images, and the molten images.";
dby[3] = "And in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father; and in the twelfth year he began to purge Judah and Jerusalem from the high places, and the Asherahs, and the graven images, and the molten images.";

hnv[3] = " For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father; and in the twelfth year he began to purge Yehudah and Yerushalayim from the high places, and the Asherim, and the engraved images, and the molten images.";
vul[3] = "octavo autem anno regni sui cum adhuc esset puer coepit quaerere Deum patris sui David et duodecimo anno postquam coeperat mundavit Iudam et Hierusalem ab excelsis et lucis simulacrisque et sculptilibus";
rsv[4] = "And they broke down the altars of the Ba\'als in his presence; and he hewed down the incense altars which stood above them; and he broke in pieces the Ashe\'rim and the graven and the molten images, and he made dust of them and strewed it over the graves of those who had sacrificed to them.";
asv[4] = "And they brake down the altars of the Baalim in his presence; and the sun-images that were on high above them he hewed down; and the Asherim, and the graven images, and the molten images, he brake in pieces, and made dust of them, and strewed it upon the graves [of them] that had sacrificed unto them.";
yng[4] = "And they break down before him the altars of the Baalim, and the images that [are] on high above them he hath cut down, and the shrines, and the graven images, and the molten images, he hath broken and beaten small, and streweth on the surface of the graves of those sacrificing to them,";
dby[4] = "And they broke down the altars of the Baals in his presence; and the sun-pillars that were on high above them he cut down; and the Asherahs and the graven images and the molten images he broke in pieces, and made dust [of them] and strewed it upon the graves of those that had sacrificed to them;";
web[4] = "And they broke down the altars of Baalim in his presence; and the images, that [were] on high above them, he cut down; and the groves, and the carved images, and the molten images, he broke in pieces, and made dust [of them] and strewed [it] upon the graves of them that had sacrificed to them.";
hnv[4] = "They broke down the altars of the Ba`alim in his presence; and the sun-images that were on high above them he hewed down; and the Asherim, and the engraved images, and the molten images, he broke in pieces, and made dust of them, and strewed it on the graves [of those] who had sacrificed to them.";
vul[4] = "destruxeruntque coram eo aras Baalim et simulacra quae superposita fuerant demoliti sunt lucos etiam et sculptilia succidit atque comminuit et super tumulos eorum qui eis immolare consueverant fragmenta dispersit";
rsv[5] = "He also burned the bones of the priests on their altars, and purged Judah and Jerusalem.";
asv[5] = "And he burnt the bones of the priests upon their altars, and purged Judah and Jerusalem.";

rsv[7] = "he broke down the altars, and beat the Ashe\'rim and the images into powder, and hewed down all the incense altars throughout all the land of Israel. Then he returned to Jerusalem.";

yng[7] = "And he breaketh down the altars and the shrines, and the graven images he hath beaten down very small, and all the images he hath cut down in all the land of Israel, and turneth back to Jerusalem.";

hnv[7] = "He broke down the altars, and beat the Asherim and the engraved images into powder, and hewed down all the sun-images throughout all Eretz-Yisra\'el, and returned to Yerushalayim.";
vul[7] = "cumque altaria dissipasset et lucos et sculptilia contrivisset in frusta cunctaque delubra demolitus esset de universa terra Israhel reversus est Hierusalem";
rsv[8] = "Now in the eighteenth year of his reign, when he had purged the land and the house, he sent Shaphan the son of Azali\'ah, and Ma-asei\'ah the governor of the city, and Jo\'ah the son of Jo\'ahaz, the recorder, to repair the house of the LORD his God.";
asv[8] = "Now in the eighteenth year of his reign, when he had purged the land and the house, he sent Shaphan the son of Azaliah, and Maaseiah the governor of the city, and Joah the son of Joahaz the recorder, to repair the house of Jehovah his God.";
yng[8] = "And in the eighteenth year of his reign, to purify the land and the house he hath sent Shaphan son of Azaliah, and Maaseiah head of the city, and Joah son of Johaz the remembrancer, to strengthen the house of Jehovah his God.";
dby[8] = "And in the eighteenth year of his reign, when he purged the land and the house, he sent Shaphan the son of Azaliah, and Maaseiah the governor of the city, and Joah the son of Joahaz the chronicler, to repair the house of Jehovah his God.";
web[8] = "Now in the eighteenth year of his reign, when he had purged the land, and the house, he sent Shaphan the son of Azaliah, and Maaseiah the governor of the city, and Joah the son of Joahaz the recorder, to repair the house of the LORD his God.";
hnv[8] = "Now in the eighteenth year of his reign, when he had purged the land and the house, he sent Shafan the son of Atzalyahu, and Ma`aseyah the governor of the city, and Yo\'ach the son of Yo\'achaz the recorder, to repair the house of the LORD his God.";
vul[8] = "igitur anno octavodecimo regni sui mundata iam terra et templo Domini misit Saphan filium Eseliae et Maasiam principem civitatis et Ioha filium Ioachaz a commentariis ut instaurarent domum Domini Dei sui";
rsv[9] = "They came to Hilki\'ah the high priest and delivered the money that had been brought into the house of God, which the Levites, the keepers of the threshold, had collected from Manas\'seh and E\'phraim and from all the remnant of Israel and from all Judah and Benjamin and from the inhabitants of Jerusalem.";
asv[9] = "And they came to Hilkiah the high priest, and delivered the money that was brought into the house of God, which the Levites, the keepers of the threshold, had gathered of the hand of Manasseh and Ephraim, and of all the remnant of Israel, and of all Judah and Benjamin, and of the inhabitants of Jerusalem.";
yng[9] = "And they come in unto Hilkiah the high priest, and they give the money that is brought in to the house of God, that the Levites, keeping the threshold, have gathered from the hand of Manasseh, and Ephraim, and from all the remnant of Israel, and from all Judah, and Benjamin, and the inhabitants of Jerusalem,";
dby[9] = "And they came to Hilkijah the high priest, and they delivered [to them] the money that had been brought into the house of God, which the Levites that kept the doors had gathered of the hand of Manasseh and Ephraim, and of all the remnant of Israel, and of all Judah and Benjamin, and of the inhabitants of Jerusalem.";
web[9] = "And when they came to Hilkiah the high priest, they delivered the money that was brought into the house of God, which the Levites that kept the doors had collected from the hand of Manasseh and Ephraim, and from all the remnant of Israel, and from all Judah and Benjamin; and they returned to Jerusalem.";
hnv[9] = "They came to Hilkiyah the Kohen Gadol, and delivered the money that was brought into the house of God, which the Levites, the keepers of the threshold, had gathered of the hand of Menashsheh and Efrayim, and of all the remnant of Yisra\'el, and of all Yehudah and Binyamin, and of the inhabitants of Yerushalayim.";
vul[9] = "qui venerunt ad Helciam sacerdotem magnum acceptamque ab eo pecuniam quae inlata fuerat in domum Domini et quam congregaverant Levitae ianitores de Manasse et Ephraim et universis reliquiis Israhel ab omni quoque Iuda et Beniamin et habitatoribus Hierusalem";
rsv[10] = "They delivered it to the workmen who had the oversight of the house of the LORD; and the workmen who were working in the house of the LORD gave it for repairing and restoring the house.";
asv[10] = "And they delivered it into the hand of the workmen that had the oversight of the house of Jehovah; and the workmen that wrought in the house of Jehovah gave it to mend and repair the house:";
yng[10] = "and they give [it] into the hand of the workmen, those appointed over the house of Jehovah, and they give it [to] the workmen who are working in the house of Jehovah, to repair and to strengthen the house;";
dby[10] = "And they gave [it] into the hand of them that did the work, that had the oversight of the house of Jehovah; and they gave it to the workmen who wrought in the house of Jehovah to reinstate and repair the house:";
web[10] = "And they put [it] in the hand of the workmen that had the oversight of the house of the LORD, and they gave it to the workmen that wrought in the house of the LORD, to repair and mend the house:";
hnv[10] = "They delivered it into the hand of the workmen who had the oversight of the house of the LORD; and the workmen who labored in the house of the LORD gave it to mend and repair the house;";
vul[10] = "tradiderunt in manibus eorum qui praeerant operariis in domo Domini ut instaurarent templum et infirma quaeque sarcirent";
rsv[11] = "They gave it to the carpenters and the builders to buy quarried stone, and timber for binders and beams for the buildings which the kings of Judah had let go to ruin.";
asv[11] = "even to the carpenters and to the builders gave they it, to buy hewn stone, and timber for couplings, and to make beams for the houses which the kings of Judah had destroyed.";
yng[11] = "and they give [it] to artificers, and to builders, to buy hewn stones, and wood for couplings and for beams to the houses that the kings of Judah had destroyed.";
dby[11] = "they gave [it] to the carpenters and the builders, to buy hewn stone, and timber for the joists, and to floor the houses that the kings of Judah had destroyed.";
web[11] = "Even to the artificers and builders they gave [it], to buy hewn stone, and timber for couplings, and to floor the houses which the kings of Judah had destroyed.";
hnv[11] = "even to the carpenters and to the builders gave they it, to buy hewn stone, and timber for couplings, and to make beams for the houses which the kings of Yehudah had destroyed.";
vul[11] = "at illi dederunt eam artificibus et cementariis ut emerent lapides de lapidicinis et ligna ad commissuras aedificii et ad contignationem domorum quas destruxerant reges Iuda";
rsv[12] = "And the men did the work faithfully. Over them were set Jahath and Obadi\'ah the Levites, of the sons of Merar\'i, and Zechari\'ah and Meshul\'lam, of the sons of the Ko\'hathites, to have oversight. The Levites, all who were skilful with instruments of music,";
asv[12] = "And the men did the work faithfully: and the overseers of them were Jahath and Obadiah, the Levites, of the sons of Merari; and Zechariah and Meshullam, of the sons of the Kohathites, to set it forward; and [others of] the Levites, all that were skilful with instruments of music.";
yng[12] = "And the men are working faithfully in the business, and over them are appointed Jahath and Obadiah, the Levites, of the sons of Merari, and Zechariah and Meshullam, of the sons of the Kohathite, to overlook; and of the Levites, every one understanding about instruments of song,";
dby[12] = "And the men did the work faithfully. And over them were appointed Jahath and Obadiah, Levites, of the children of Merari, and Zechariah and Meshullam, of the children of the Kohathites, for the oversight; and all these Levites were skilled in instruments of music.";
web[12] = "And the men did the work faithfully: and the overseers of them [were] Jahath and Obadiah, the Levites, of the sons of Merari; and Zechariah and Meshullam, of the sons of the Kohathites, to superintend [it]; and [others of] the Levites, all that had skill in instruments of music.";
hnv[12] = "The men did the work faithfully: and the overseers of them were Yachat and `Ovadyah, the Levites, of the sons of Merari; and Zekharyah and Meshullam, of the sons of the Kehati, to set it forward; and [others of] the Levites, all who were skillful with instruments of music.";
vul[12] = "qui fideliter cuncta faciebant erant autem praepositi operantium Iaath et Abdias de filiis Merari Zaccharias et Mosollam de filiis Caath qui urguebant opus omnes Levitae scientes organis canere";
rsv[13] = "were over the burden bearers and directed all who did work in every kind of service; and some of the Levites were scribes, and officials, and gatekeepers.";
asv[13] = "Also they were over the bearers of burdens, and set forward all that did the work in every manner of service: and of the Levites there were scribes, and officers, and porters.";
yng[13] = "and over the burden-bearers, and overseers of every one doing work for service and service; and of the Levites [are] scribes, and officers, and gatekeepers.";
dby[13] = "They were also over the bearers of burdens, and were overseers of all that worked in any manner of service. And of the Levites were the scribes, and officers, and doorkeepers.";
web[13] = "Also [they were] over the bearers of burdens, and [were] overseers of all that wrought the work in any manner of service: and of the Levites [there were] scribes, and officers, and porters.";
hnv[13] = "Also they were over the bearers of burdens, and set forward all who did the work in every manner of service: and of the Levites there were Sofrim, and officers, and porters.";
vul[13] = "super eos vero qui ad varios usus onera portabant erant scribae et magistri de Levitis ianitores";
rsv[14] = "While they were bringing out the money that had been brought into the house of the LORD, Hilki\'ah the priest found the book of the law of the LORD given through Moses.";
asv[14] = "And when they brought out the money that was brought into the house of Jehovah, Hilkiah the priest found the book of the law of Jehovah [given] by Moses.";
yng[14] = "And in their bringing out the money that is brought in to the house of Jehovah, hath Hilkiah the priest found the book of the law of Jehovah by the hand of Moses,";
dby[14] = "And when they brought out the money that had been brought into the house of Jehovah, Hilkijah the priest found the book of the law of Jehovah by Moses.";
web[14] = "And when they brought out the money that was brought into the house of the LORD, Hilkiah the priest found the book of the law of the LORD [given] by Moses.";
hnv[14] = "When they brought out the money that was brought into the house of the LORD, Hilkiyah the Kohen found the book of the law of the LORD [given] by Moshe.";
vul[14] = "cumque efferrent pecuniam quae inlata fuerat in templum Domini repperit Helcias sacerdos librum legis Domini per manum Mosi";
rsv[15] = "Then Hilki\'ah said to Shaphan the secretary, &quot;I have found the book of the law in the house of the LORD&quot;; and Hilki\'ah gave the book to Shaphan.";
asv[15] = "And Hilkiah answered and said to Shaphan the scribe, I have found the book of the law in the house of Jehovah. And Hilkiah delivered the book to Shaphan.";
yng[15] = "and Hilkiah answereth and saith unto Shaphan the scribe, `A book of the law I have found in the house of Jehovah;\' and Hilkiah giveth the book unto Shaphan,";
dby[15] = "Then Hilkijah spoke and said to Shaphan the scribe, I have found the book of the law in the house of Jehovah. And Hilkijah gave the book to Shaphan.";
web[15] = "And Hilkiah answered and said to Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah delivered the book to Shaphan.";
hnv[15] = "Hilkiyah answered Shafan the Sofer, I have found the book of the law in the house of the LORD. Hilkiyah delivered the book to Shafan.";
vul[15] = "et ait ad Saphan scribam librum legis inveni in domo Domini et tradidit ei";
rsv[16] = "Shaphan brought the book to the king, and further reported to the king, &quot;All that was committed to your servants they are doing.";
asv[16] = "And Shaphan carried the book to the king, and moreover brought back word to the king, saying, All that was committed to thy servants, they are doing.";
yng[16] = "and Shaphan bringeth in the book unto the king, and bringeth the king back word again, saying, `All that hath been given into the hand of thy servants they are doing,";
dby[16] = "And Shaphan carried the book to the king. And moreover he brought the king word again saying, All that was committed to the hand of thy servants, they do;";
web[16] = "And Shaphan carried the book to the king, and brought the king word back again, saying, All that was committed to thy servants, they perform.";
hnv[16] = "Shafan carried the book to the king, and moreover brought back word to the king, saying, All that was committed to your servants, they are doing.";
vul[16] = "at ille intulit volumen ad regem et nuntiavit ei dicens omnia quae dedisti in manu servorum tuorum ecce conplentur";
rsv[17] = "They have emptied out the money that was found in the house of the LORD and have delivered it into the hand of the overseers and the workmen.&quot;";
asv[17] = "And they have emptied out the money that was found in the house of Jehovah, and have delivered it into the hand of the overseers, and into the hand of the workmen.";
yng[17] = "and they pour out the money that is found in the house of Jehovah, and give it into the hand of those appointed, and into the hands of those doing the work.\'";
dby[17] = "and they have emptied out the money that was found in the house of Jehovah, and have delivered it into the hand of the overseers, and into the hand of the workmen.";
web[17] = "And they have collected the money that was found in the house of the LORD, and have delivered it into the hand of the overseers, and to the hand of the workmen.";
hnv[17] = "They have emptied out the money that was found in the house of the LORD, and have delivered it into the hand of the overseers, and into the hand of the workmen.";
vul[17] = "argentum quod reppertum est in domo Domini conflaverunt datumque est praefectis artificum et diversa opera fabricantium";
rsv[18] = "Then Shaphan the secretary told the king, &quot;Hilki\'ah the priest has given me a book.&quot; And Shaphan read it before the king.";
asv[18] = "And Shaphan the scribe told the king, saying, Hilkiah the priest hath delivered me a book. And Shaphan read therein before the king.";
yng[18] = "And Shaphan the scribe declareth to the king, saying, `A book hath Hilkiah the priest given to me;\' and Shaphan readeth in it before the king.";
dby[18] = "And Shaphan the scribe informed the king saying, Hilkijah the priest has given me a book. And Shaphan read out of it before the king.";
web[18] = "Then Shaphan the scribe told the king, saying, Hilkiah the priest hath given me a book. And Shaphan read it before the king.";
hnv[18] = "Shafan the Sofer told the king, saying, Hilkiyah the Kohen has delivered me a book. Shafan read therein before the king.";
vul[18] = "praeterea tradidit mihi Helcias sacerdos hunc librum quem cum rege praesente recitasset";
rsv[19] = "When the king heard the words of the law he rent his clothes.";
asv[19] = "And it came to pass, when the king had heard the words of the law, that he rent his clothes.";
yng[19] = "And it cometh to pass, at the king\'s hearing the words of the law, that he rendeth his garments,";
dby[19] = "And it came to pass when the king heard the words of the law, that he rent his garments.";
web[19] = "And it came to pass, when the king had heard the words of the law, that he rent his clothes.";
hnv[19] = "It happened, when the king had heard the words of the law, that he tore his clothes.";
vul[19] = "audissetque ille verba legis scidit vestimenta sua";
rsv[20] = "And the king commanded Hilki\'ah, Ahi\'kam the son of Shaphan, Abdon the son of Micah, Shaphan the secretary, and Asai\'ah the king\'s servant, saying,";
asv[20] = "And the king commanded Hilkiah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe, and Asaiah the king\'s servant, saying,";
yng[20] = "and the king commandeth Hilkiah, and Ahikam son of Shaphan, and Abdon son of Micah, and Shaphan the scribe, and Asaiah, servant of the king, saying,";
dby[20] = "And the king commanded Hilkijah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe, and Asaiah a servant of the king, saying,";
web[20] = "And the king commanded Hilkiah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe, and Asaiah a servant of the king\'s, saying,";
hnv[20] = "The king commanded Hilkiyah, and Achikam the son of Shafan, and `Avdon the son of Mikhah, and Shafan the Sofer, and `Asayah the king\'s servant, saying,";
vul[20] = "et praecepit Helciae et Ahicam filio Saphan et Abdon filio Micha Saphan quoque scribae et Asaiae servo regis dicens";
rsv[21] = "&quot;Go, inquire of the LORD for me and for those who are left in Israel and in Judah, concerning the words of the book that has been found; for great is the wrath of the LORD that is poured out on us, because our fathers have not kept the word of the LORD, to do according to all that is written in this book.&quot;";
asv[21] = "Go ye, inquire of Jehovah for me, and for them that are left in Israel and in Judah, concerning the words of the book that is found; for great is the wrath of Jehovah that is poured out upon us, because our fathers have not kept the word of Jehovah, to do according unto all that is written in this book.";
yng[21] = "`Go, seek Jehovah for me, and for him who is left in Israel and in Judah, concerning the words of the book that is found, for great [is] the fury of Jehovah that is poured on us, because that our fathers kept not the word of Jehovah, to do according to all that is written on this book.\'";
dby[21] = "Go, inquire of Jehovah for me, and for them that are left in Israel and in Judah, concerning the words of the book which is found; for great is the wrath of Jehovah that is poured out upon us, because our fathers have not kept the word of Jehovah, to do according to all that is written in this book.";
web[21] = "Go, inquire of the LORD for me, and for them that are left in Israel, and in Judah, concerning the words of the book that is found: for great [is] the wrath of the LORD that is poured out upon us, because our fathers have not kept the word of the LORD, to do after all that is written in this book.";
hnv[21] = "Go you, inquire of the LORD for me, and for those who are left in Yisra\'el and in Yehudah, concerning the words of the book that is found; for great is the wrath of the LORD that is poured out on us, because our fathers have not kept the word of the LORD, to do according to all that is written in this book.";
vul[21] = "ite et orate Dominum pro me et pro reliquiis Israhel et Iuda super universis sermonibus libri istius qui reppertus est magnus enim furor Domini stillavit super nos eo quod non custodierint patres nostri verba Domini ut facerent omnia quae scripta sunt in isto volumine";
rsv[22] = "So Hilki\'ah and those whom the king had sent went to Huldah the prophetess, the wife of Shallum the son of Tokhath, son of Hasrah, keeper of the wardrobe (now she dwelt in Jerusalem in the Second Quarter) and spoke to her to that effect.";
asv[22] = "So Hilkiah, and they whom the king [had commanded], went to Huldah the prophetess, the wife of Shallum the son of Tokhath, the son of Hasrah, keeper of the wardrobe (now she dwelt in Jerusalem in the second quarter); and they spake to her to that effect.";
yng[22] = "And Hilkiah goeth, and they of the king, unto Huldah the prophetess, wife of Shallum son of Tikvath, son of Hasrah, keeper of the garments, and she is dwelling in Jerusalem in the Second, and they speak unto her thus.";
dby[22] = "And Hilkijah and they that the king [had appointed] went to Huldah the prophetess, the wife of Shallum the son of Tokehath, son of Hasrah, keeper of the wardrobe: now she dwelt in Jerusalem in the second quarter [of the town]; and they spoke with her to that effect.";
web[22] = "And Hilkiah, and [they] that the king [had appointed], went to Huldah the prophetess, the wife of Shallum the son of Tikvath, the son of Hasrah, keeper of the wardrobe; (now she dwelt in Jerusalem in the college:) and they spoke to her to that [effect].";
hnv[22] = "So Hilkiyah, and they whom the king [had commanded], went to Huldah the prophetess, the wife of Shallum the son of Tokhat, the son of Hasrah, keeper of the wardrobe; (now she lived in Yerushalayim in the second quarter;) and they spoke to her to that effect.";
vul[22] = "abiit igitur Helcias et hii qui simul a rege missi fuerant ad Holdan propheten uxorem Sellum filii Thecuath filii Hasra custodis vestium quae habitabat Hierusalem in secunda et locuti sunt ei verba quae supra narravimus";
rsv[23] = "And she said to them, &quot;Thus says the LORD, the God of Israel: \'Tell the man who sent you to me,";
asv[23] = "And she said unto them, Thus saith Jehovah, the God of Israel: Tell ye the man that sent you unto me,";
yng[23] = "And she saith to them, `Thus said Jehovah, God of Israel, Say to the man who hath sent you unto me,";
dby[23] = "And she said to them, Thus saith Jehovah the God of Israel: Tell the man that sent you to me,";
web[23] = "And she answered them, Thus saith the LORD God of Israel, Tell ye the man that sent you to me.";
hnv[23] = " She said to them, Thus says the LORD, the God of Yisra\'el: Tell you the man who sent you to me,";
vul[23] = "at illa respondit eis haec dicit Dominus Deus Israhel dicite viro qui misit vos ad me";
rsv[24] = "Thus says the LORD, Behold, I will bring evil upon this place and upon its inhabitants, all the curses that are written in the book which was read before the king of Judah.";
asv[24] = "Thus saith Jehovah, Behold, I will bring evil upon this place, and upon the inhabitants thereof, even all the curses that are written in the book which they have read before the king of Judah.";
yng[24] = "Thus said Jehovah, Lo, I am bringing in evil on this place, and on its inhabitants, all the execrations that are written on the book that they read before the king of Judah;";
dby[24] = "Thus saith Jehovah: Behold, I will bring evil upon this place, and upon the inhabitants thereof, all the curses that are written in the book which they have read before the king of Judah.";
web[24] = "Thus saith the LORD, Behold, I will bring evil upon this place, and upon its inhabitants, [even] all the curses that are written in the book which they have read before the king of Judah:";
hnv[24] = "Thus says the LORD, Behold, I will bring evil on this place, and on the inhabitants of it, even all the curses that are written in the book which they have read before the king of Yehudah.";
vul[24] = "haec dicit Dominus ecce ego inducam mala super locum istum et super habitatores eius cunctaque maledicta quae scripta sunt in libro hoc quem legerunt coram rege Iuda";
rsv[25] = "Because they have forsaken me and have burned incense to other gods, that they might provoke me to anger with all the works of their hands, therefore my wrath will be poured out upon this place and will not be quenched.";
asv[25] = "Because they have forsaken me, and have burned incense unto other gods, that they might provoke me to anger with all the works of their hands; therefore is my wrath poured out upon this place, and it shall not be quenched.";
yng[25] = "because that they have forsaken Me, and make perfume to other gods, so as to provoke Me with all the works of their hands, and poured out is My fury upon this place, and it is not quenched.";
dby[25] = "Because they have forsaken me, and have burned incense unto other gods, that they might provoke me to anger with all the works of their hands; therefore my fury shall be poured out upon this place, and shall not be quenched.";
web[25] = "Because they have forsaken me, and have burned incense to other gods, that they might provoke me to anger with all the works of their hands; therefore my wrath shall be poured out upon this place, and shall not be quenched.";
hnv[25] = "Because they have forsaken me, and have burned incense to other gods, that they might provoke me to anger with all the works of their hands; therefore is my wrath poured out on this place, and it shall not be quenched.";
vul[25] = "quia dereliquerunt me et sacrificaverunt diis alienis ut me ad iracundiam provocarent in cunctis operibus manuum suarum idcirco stillavit furor meus super locum istum et non extinguetur";
rsv[26] = "But to the king of Judah, who sent you to inquire of the LORD, thus shall you say to him, Thus says the LORD, the God of Israel: Regarding the words which you have heard,";
asv[26] = "But unto the king of Judah, who sent you to inquire of Jehovah, thus shall ye say to him, Thus saith Jehovah, the God of Israel: As touching the words which thou hast heard,";
yng[26] = "`And unto the king of Judah, who is sending you to inquire of Jehovah, thus do ye say unto him: Thus said Jehovah God of Israel, whose words thou hast heard:";
dby[26] = "But to the king of Judah, who sent you to inquire of Jehovah, thus shall ye say to him: Thus saith Jehovah the God of Israel touching the words which thou hast heard:";
web[26] = "And as for the king of Judah, who sent you to inquire of the LORD, so shall ye say to him, Thus saith the LORD God of Israel [concerning] the words which thou hast heard;";
hnv[26] = "But to the king of Yehudah, who sent you to inquire of the LORD, thus shall you tell him, Thus says the LORD, the God of Yisra\'el: As touching the words which you have heard,";
vul[26] = "ad regem autem Iuda qui misit vos pro Domino deprecando sic loquimini haec dicit Dominus Deus Israhel quoniam audisti verba voluminis";
rsv[27] = "because your heart was penitent and you humbled yourself before God when you heard his words against this place and its inhabitants, and you have humbled yourself before me, and have rent your clothes and wept before me, I also have heard you, says the LORD.";
asv[27] = "because thy heart was tender, and thou didst humble thyself before God, when thou heardest his words against this place, and against the inhabitants thereof, and hast humbled thyself before me, and hast rent thy clothes, and wept before me; I also have heard thee, saith Jehovah.";
yng[27] = "Because thy heart [is] tender, and thou art humbled before God in thy hearing His words concerning this place, and concerning its inhabitants, and art humbled before Me, and dost rend thy garments, and weep before Me: even I also have heard -- the affirmation of Jehovah.";
dby[27] = "Because thy heart was tender, and thou didst humble thyself before God, when thou heardest his words against this place and against the inhabitants thereof, and humbledst thyself before me, and didst rend thy garments and weep before me, I also have heard [thee], saith Jehovah.";
web[27] = "Because thy heart was tender, and thou didst humble thyself before God, when thou didst hear his words against this place, and against its inhabitants, and didst humble thyself before me, and didst rend thy clothes, and weep before me; I have even heard [thee] also, saith the LORD.";
hnv[27] = "because your heart was tender, and you did humble yourself before God, when you heard his words against this place, and against the inhabitants of it, and have humbled yourself before me, and have torn your clothes, and wept before me; I also have heard you, says the LORD.";
vul[27] = "atque emollitum est cor tuum et humiliatus es in conspectu Dei super his quae dicta sunt contra locum hunc et habitatores Hierusalem reveritusque faciem meam scidisti vestimenta tua et flevisti coram me ego quoque exaudivi te dicit Dominus";
rsv[28] = "Behold, I will gather you to your fathers, and you shall be gathered to your grave in peace, and your eyes shall not see all the evil which I will bring upon this place and its inhabitants.\'&quot; And they brought back word to the king.";
asv[28] = "Behold, I will gather thee to thy fathers, and thou shalt be gathered to thy grave in peace, neither shall thine eyes see all the evil that I will bring upon this place, and upon the inhabitants thereof. And they brought back word to the king.";
yng[28] = "Lo, I am gathering thee unto thy fathers, and thou hast been gathered unto thy graves in peace, and thine eyes do not look on all the evil that I am bringing upon this place, and upon its inhabitants;\' and they bring the king back word.";
dby[28] = "Behold, I will gather thee unto thy fathers, and thou shalt be gathered to thy grave in peace; and thine eyes shall not see all the evil that I will bring upon this place, and upon the inhabitants thereof. And they brought the king word again.";
web[28] = "Behold, I will gather thee to thy fathers, and thou shalt be gathered to thy grave in peace, neither shall thy eyes see all the evil that I will bring upon this place, and upon the inhabitants of the same. So they brought the king word again.";
hnv[28] = "Behold, I will gather you to your fathers, and you shall be gathered to your grave in shalom, neither shall your eyes see all the evil that I will bring on this place, and on the inhabitants of it. They brought back word to the king.";
vul[28] = "iam enim colligam te ad patres tuos et infereris in sepulchrum tuum in pace nec videbunt oculi tui omne malum quod ego inducturus sum super locum istum et super habitatores eius rettulerunt itaque regi cuncta quae dixerat";
rsv[29] = "Then the king sent and gathered together all the elders of Judah and Jerusalem.";
asv[29] = "Then the king sent and gathered together all the elders of Judah and Jerusalem.";
yng[29] = "And the king sendeth and gathereth all the elders of Judah and Jerusalem,";
dby[29] = "And the king sent and gathered all the elders of Judah and of Jerusalem.";
web[29] = "Then the king sent and convened all the elders of Judah and Jerusalem.";
hnv[29] = "Then the king sent and gathered together all the Zakenim of Yehudah and Yerushalayim.";
vul[29] = "at ille convocatis universis maioribus natu Iuda et Hierusalem";
rsv[30] = "And the king went up to the house of the LORD, with all the men of Judah and the inhabitants of Jerusalem and the priests and the Levites, all the people both great and small; and he read in their hearing all the words of the book of the covenant which had been found in the house of the LORD.";
asv[30] = "And the king went up to the house of Jehovah, and all the men of Judah and the inhabitants of Jerusalem, and the priests, and the Levites, and all the people, both great and small: and he read in their ears all the words of the book of the covenant that was found in the house of Jehovah.";
yng[30] = "and the king goeth up to the house of Jehovah, and every man of Judah, and the inhabitants of Jerusalem, and the priests, and the Levites, even all the people, from great even unto small, and he readeth in their ears all the words of the book of the covenant that is found in the house of Jehovah.";
dby[30] = "And the king went up into the house of Jehovah, and all the men of Judah and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, great and small; and he read in their ears all the words of the book of the covenant which had been found in the house of Jehovah.";
web[30] = "And the king went into the house of the LORD, and all the men of Judah and the inhabitants of Jerusalem, and the priests, and the Levites, and all the people, great and small: and he read in their ears all the words of the book of the covenant that was found in the house of the LORD.";
hnv[30] = " The king went up to the house of the LORD, and all the men of Yehudah and the inhabitants of Yerushalayim, and the Kohanim, and the Levites, and all the people, both great and small: and he read in their ears all the words of the book of the covenant that was found in the house of the LORD.";
vul[30] = "ascendit domum Domini unaque omnes viri Iuda et habitatores Hierusalem sacerdotes et Levitae et cunctus populus a minimo usque ad maximum quibus audientibus in domo Domini legit rex omnia verba voluminis";
rsv[31] = "And the king stood in his place and made a covenant before the LORD, to walk after the LORD and to keep his commandments and his testimonies and his statutes, with all his heart and all his soul, to perform the words of the covenant that were written in this book.";
asv[31] = "And the king stood in his place, and made a covenant before Jehovah, to walk after Jehovah, and to keep his commandments, and his testimonies, and his statutes, with all his heart, and with all his soul, to perform the words of the covenant that were written in this book.";
yng[31] = "And the king standeth on his station, and maketh the covenant before Jehovah, to walk after Jehovah, and to keep His commands, and His testimonies, and His statutes, with all his heart, and with all his soul, to do the words of the covenant that are written on this book.";
dby[31] = "And the king stood in his place, and made a covenant before Jehovah, to walk after Jehovah, and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to perform the words of the covenant that are written in this book.";
web[31] = "And the king stood in his place, and made a covenant before the LORD, to walk after the LORD, and to keep his commandments, and his testimonies, and his statutes, with all his heart, and with all his soul, to perform the words of the covenant which are written in this book.";
hnv[31] = "The king stood in his place, and made a covenant before the LORD, to walk after the LORD, and to keep his mitzvot, and his testimonies, and his statutes, with all his heart, and with all his soul, to perform the words of the covenant that were written in this book.";
vul[31] = "et stans in tribunali suo percussit foedus coram Domino ut ambularet post eum et custodiret praecepta et testimonia et iustificationes eius in toto corde suo et in tota anima sua faceretque quae scripta sunt in volumine illo quem legerat";
rsv[32] = "Then he made all who were present in Jerusalem and in Benjamin stand to it. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.";
asv[32] = "And he caused all that were found in Jerusalem and Benjamin to stand [to it]. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.";
yng[32] = "And he presenteth every one who is found in Jerusalem and Benjamin, and the inhabitants of Jerusalem do according to the covenant of God, the God of their fathers.";
dby[32] = "And he caused all that were present in Jerusalem and Benjamin to stand [to it]. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.";
web[32] = "And he caused all that were present in Jerusalem and Benjamin, to stand [to it]. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.";
hnv[32] = "He caused all who were found in Yerushalayim and Binyamin to stand [to it]. The inhabitants of Yerushalayim did according to the covenant of God, the God of their fathers.";
vul[32] = "adiuravit quoque super hoc omnes qui repperti fuerant in Hierusalem et Beniamin et fecerunt habitatores Hierusalem iuxta pactum Domini Dei patrum suorum";
rsv[33] = "And Josi\'ah took away all the abominations from all the territory that belonged to the people of Israel, and made all who were in Israel serve the LORD their God. All his days they did not turn away from following the LORD the God of their fathers.";
asv[33] = "And Josiah took away all the abominations out of all the countries that pertained to the children of Israel, and made all that were found in Israel to serve, even to serve Jehovah their God. All his days they departed not from following Jehovah, the God of their fathers.";
yng[33] = "And Josiah turneth aside all the abominations out of all the lands that the sons of Israel have, and causeth every one who is found in Israel to serve, to serve Jehovah their God; all his days they turned not aside from after Jehovah, God of their fathers.";
dby[33] = "And Josiah removed all the abominations out of all the countries that belonged to the children of Israel, and made to serve all that were found in Israel, -- to serve Jehovah their God: all his days they did not depart from following Jehovah, the God of their fathers.";
web[33] = "And Josiah took away all the abominations out of all the countries that [pertained] to the children of Israel, and made all that were present in Israel, to serve, [even] to serve the LORD their God. [And] all his days they departed not from following the LORD, the God of their fathers.";
hnv[33] = "Yoshiyahu took away all the abominations out of all the countries that pertained to the children of Yisra\'el, and made all who were found in Yisra\'el to serve, even to serve the LORD their God. All his days they didn\'t depart from following the LORD, the God of their fathers.";
vul[33] = "abstulit ergo Iosias cunctas abominationes de universis regionibus filiorum Israhel et fecit omnes qui residui erant in Israhel servire Domino Deo suo cunctis diebus eius non recesserunt a Domino Deo patrum suorum";
</script>
