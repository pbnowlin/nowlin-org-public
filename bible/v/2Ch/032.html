csb[1] = "After these faithful deeds, King Sennacherib of Assyria came and entered Judah. He laid siege to the fortified cities and intended to break into them.";
csb[2] = "Hezekiah saw that Sennacherib had come and that he planned war on Jerusalem,";
csb[3] = "so he consulted with his officials and his warriors about stopping up the water of the springs that were outside the city, and they helped him.";
csb[4] = "Many people gathered and stopped up all the springs and the stream that flowed through the land; they said, &quot;Why should the kings of Assyria come and find abundant water? &quot;";
csb[5] = "Then Hezekiah strengthened his position by rebuilding the entire broken-down wall and heightening the towers and the other outside wall. He repaired the supporting terraces of the city of David, and made an abundance of weapons and shields.";
csb[6] = "He set military commanders over the people and gathered the people in the square of the city gate. Then he encouraged them, saying,";
csb[7] = "&quot;Be strong and courageous! Don\'t be afraid or discouraged before the king of Assyria or before the large army that is with him, for there are more with us than with him.";
csb[8] = "&quot;He has only human strength, but we have the LORD our God to help us and to fight our battles.&quot; So the people relied on the words of King Hezekiah of Judah.";
csb[9] = "After this, while King Sennacherib of Assyria with all his armed forces besieged Lachish, he sent his servants to Jerusalem against King Hezekiah of Judah and against all those of Judah who were in Jerusalem, saying,";
csb[10] = "&quot;This is what King Sennacherib of Assyria says: \'What are you relying on that you remain in Jerusalem under siege?";
csb[11] = "&quot;Isn\'t Hezekiah misleading you to give you over to death by famine and thirst when he says, &quot;The LORD our God will keep us from the grasp of the king of Assyria&quot;?";
csb[12] = "Didn\'t Hezekiah himself remove his high places and his altars and say to Judah and Jerusalem, &quot;You must worship before one altar, and you must burn incense on it&quot;?";
csb[13] = "&quot; \'Don\'t you know what I and my fathers have done to all the peoples of the lands? Have any of the national gods of the lands been able to rescue their land from my power?";
csb[14] = "&quot;Who among all the gods of these nations that my predecessors completely destroyed was able to rescue his people from my power, that your God should be able to deliver you from my power?";
csb[15] = "&quot;So now, don\'t let Hezekiah deceive you, and don\'t let him mislead you like this. Don\'t believe him, for no god of any nation or kingdom has been able to rescue his people from my power or the power of my fathers. How much less will your God rescue you from my power! \' &quot;";
csb[16] = "His servants said more against the LORD God and against his servant Hezekiah.";
csb[17] = "He also wrote letters to mock the LORD, the God of Israel, saying against him: Just like the national gods of the lands that did not rescue their people from my power, so Hezekiah\'s God will not rescue his people from my power.";
csb[18] = "Then they called out loudly in Hebrew to the people of Jerusalem, who were on the wall, to frighten and discourage them in order that he might capture the city.";
csb[19] = "They spoke against the God of Jerusalem like they had spoken against the gods of the peoples of the earth, which were made by human hands.";
csb[20] = "King Hezekiah and the prophet Isaiah son of Amoz prayed about this and cried out to heaven,";
csb[21] = "and the LORD sent an angel who annihilated every valiant warrior, leader, and commander in the camp of the king of Assyria. So the king of Assyria returned in disgrace to his land. He went to the temple of his god, and there some of his own children struck him down with the sword.";
csb[22] = "So the LORD saved Hezekiah and the inhabitants of Jerusalem from the power of King Sennacherib of Assyria and from the power of all others. He gave them rest on every side.";
csb[23] = "Many were bringing an offering to the LORD to Jerusalem and valuable gifts to King Hezekiah of Judah, and he was exalted in the eyes of all the nations after that.";
csb[24] = "In those days Hezekiah became sick to the point of death, so he prayed to the LORD, and he spoke to him and gave him a miraculous sign.";
csb[25] = "However, because his heart was proud, Hezekiah didn\'t respond according to the benefit that had come to him. So there was wrath on him, Judah, and Jerusalem.";
csb[26] = "Then Hezekiah humbled himself for the pride of his heart -- he and the inhabitants of Jerusalem -- so the LORD\'s wrath didn\'t come on them during Hezekiah\'s lifetime.";
csb[27] = "Hezekiah had abundant riches and glory, and he made himself treasuries for silver, gold, precious stones, spices, shields, and every desirable item.";
csb[28] = "He made warehouses for the harvest of grain, new wine, and fresh oil, and stalls for all kinds of cattle, and pens for flocks.";
csb[29] = "He made cities for himself, and he acquired vast numbers of flocks and herds, for God gave him abundant possessions.";
csb[30] = "This same Hezekiah blocked the outlet of the water of the Upper Gihon and channeled it smoothly downward and westward to the city of David. Hezekiah succeeded in everything he did.";
csb[31] = "When the ambassadors of Babylon\'s rulers were sent to him to inquire about the miraculous sign that happened in the land, God left him to test him and discover what was in his heart.";
csb[32] = "As for the rest of the events of Hezekiah\'s reign and his deeds of faithful love, note that they are written in the Visions of the Prophet Isaiah son of Amoz, and in the Book of the Kings of Judah and Israel.";
csb[33] = "Hezekiah rested with his fathers and was buried on the ascent to the tombs of David\'s descendants. All Judah and the inhabitants of Jerusalem paid him honor at his death. His son Manasseh became king in his place.";
kjv[1] = "After these things, and the establishment thereof, Sennacherib king of Assyria came, and entered into Judah, and encamped against the fenced cities, and thought to win them for himself.";

dby[1] = "After these things and this faithfulness, Sennacherib king of Assyria came and entered into Judah, and encamped against the fortified cities, and thought to break into them.";
web[1] = "After [these] things, and their establishment, Sennacherib king of Assyria came, and entered into Judah, and encamped against the fortified cities, and thought to win them for himself.";
hnv[1] = "After these things, and this faithfulness, Sancheriv king of Ashshur came, and entered into Yehudah, and encamped against the fortified cities, and thought to win them for himself.";

kjv[5] = "Also he strengthened himself, and built up all the wall that was broken, and raised [it] up to the towers, and another wall without, and repaired Millo [in] the city of David, and made darts and shields in abundance.";
rsv[5] = "He set to work resolutely and built up all the wall that was broken down, and raised towers upon it, and outside it he built another wall; and he strengthened the Millo in the city of David. He also made weapons and shields in abundance.";

yng[5] = "And he strengtheneth himself, and buildeth the whole of the wall that is broken, and causeth [it] to ascend unto the towers, and at the outside of the wall another, and strengtheneth Millo, [in] the city of David, and maketh darts in abundance, and shields.";

kjv[15] = "Now therefore let not Hezekiah deceive you, nor persuade you on this manner, neither yet believe him: for no god of any nation or kingdom was able to deliver his people out of mine hand, and out of the hand of my fathers: how much less shall your God deliver you out of mine hand?";
rsv[15] = "Now therefore do not let Hezeki\'ah deceive you or mislead you in this fashion, and do not believe him, for no god of any nation or kingdom has been able to deliver his people from my hand or from the hand of my fathers. How much less will your God deliver you out of my hand!\'&quot;";
asv[15] = "Now therefore let not Hezekiah deceive you, nor persuade you after this manner, neither believe ye him; for no god of any nation or kingdom was able to deliver his people out of my hand, and out of the hand of my fathers: how much less shall your God deliver you out of my hand?";
yng[15] = "`And, now, let not Hezekiah lift you up, nor persuade you thus, nor give credence to him, for no god of any nation and kingdom is able to deliver his people from my hand, and from the hand of my fathers: also, surely your God doth not deliver you from my hand!\'";

hnv[15] = "Now therefore don\'t let Hizkiyahu deceive you, nor persuade you after this manner, neither believe you him; for no god of any nation or kingdom was able to deliver his people out of my hand, and out of the hand of my fathers: how much less shall your God deliver you out of my hand?";
vul[15] = "non vos ergo decipiat Ezechias nec vana persuasione deludat neque credatis ei si enim nullus potuit deus cunctarum gentium atque regnorum liberare populum suum de manu mea et de manu patrum meorum consequenter nec Deus vester poterit eruere vos de hac manu";
kjv[16] = "And his servants spake yet [more] against the LORD God, and against his servant Hezekiah.";
rsv[16] = "And his servants said still more against the Lord GOD and against his servant Hezeki\'ah.";
asv[16] = "And his servants spake yet more against Jehovah God, and against his servant Hezekiah.";
yng[16] = "And again have his servants spoken against Jehovah God, and against Hezekiah His servant,";
dby[16] = "And his servants spoke yet more against Jehovah, the [true] God, and against his servant Hezekiah.";
web[16] = "And his servants spoke yet [more] against the LORD God, and against his servant Hezekiah.";
hnv[16] = "His servants spoke yet more against the LORD God, and against his servant Hizkiyahu.";
vul[16] = "sed et alia multa locuti sunt servi eius contra Dominum Deum et contra Ezechiam servum eius";
kjv[17] = "He wrote also letters to rail on the LORD God of Israel, and to speak against him, saying, As the gods of the nations of [other] lands have not delivered their people out of mine hand, so shall not the God of Hezekiah deliver his people out of mine hand.";
rsv[17] = "And he wrote letters to cast contempt on the LORD the God of Israel and to speak against him, saying, &quot;Like the gods of the nations of the lands who have not delivered their people from my hands, so the God of Hezeki\'ah will not deliver his people from my hand.&quot;";
asv[17] = "He wrote also letters, to rail on Jehovah, the God of Israel, and to speak against him, saying, As the gods of the nations of the lands, which have not delivered their people out of my hand, so shall not the God of Hezekiah deliver his people out of my hand.";
yng[17] = "and letters he hath written to give reproach to Jehovah, God of Israel, and to speak against Him, saying, `As the gods of the nations of the lands that have not delivered their people from my hand, so the God of Hezekiah doth not deliver His people from my hand.\'";
dby[17] = "And he wrote a letter to rail at Jehovah the God of Israel, and to speak against him saying, As the gods of the nations of the countries have not delivered their people out of my hand, so shall not the God of Hezekiah deliver his people out of my hand.";
web[17] = "He wrote also letters to rail at the LORD God of Israel, and to speak against him, saying, As the gods of the nations of [other] lands have not delivered their people out of my hand, so shall not the God of Hezekiah deliver his people out of my hand.";
hnv[17] = "He wrote also letters, to rail on the LORD, the God of Yisra\'el, and to speak against him, saying, As the gods of the nations of the lands, which have not delivered their people out of my hand, so shall the God of Hizkiyahu not deliver his people out of my hand.";
vul[17] = "epistulas quoque scripsit plenas blasphemiae in Dominum Deum Israhel et locutus est adversus eum sicut dii gentium ceterarum non potuerunt liberare populos suos de manu mea sic et Deus Ezechiae eruere non poterit populum suum de manu ista";
kjv[18] = "Then they cried with a loud voice in the Jews\' speech unto the people of Jerusalem that [were] on the wall, to affright them, and to trouble them; that they might take the city.";
rsv[18] = "And they shouted it with a loud voice in the language of Judah to the people of Jerusalem who were upon the wall, to frighten and terrify them, in order that they might take the city.";
asv[18] = "And they cried with a loud voice in the Jews\' language unto the people of Jerusalem that were on the wall, to affright them, and to trouble them; that they might take the city.";
yng[18] = "And they call with a great voice [in] Jewish, against the people of Jerusalem who [are] on the wall, to frighten them, and to trouble them, that they may capture the city,";
dby[18] = "And they cried with a loud voice in the Jewish [language] to the people of Jerusalem that were on the wall, to frighten them and to trouble them; that they might take the city.";
web[18] = "Then they cried with a loud voice in the Jews\' speech to the people of Jerusalem that [were] on the wall, to affright them, and to fill them with consternation; that they might take the city.";
hnv[18] = "They cried with a loud voice in the Yehudim\' language to the people of Yerushalayim who were on the wall, to frighten them, and to trouble them; that they might take the city.";
vul[18] = "insuper et clamore magno lingua iudaica contra populum qui sedebat in muris Hierusalem personabat ut terreret eos et caperet civitatem";
kjv[19] = "And they spake against the God of Jerusalem, as against the gods of the people of the earth, [which were] the work of the hands of man.";
rsv[19] = "And they spoke of the God of Jerusalem as they spoke of the gods of the peoples of the earth, which are the work of men\'s hands.";
asv[19] = "And they spake of the God of Jerusalem, as of the gods of the peoples of the earth, which are the work of men\'s hands.";
yng[19] = "and they speak against the God of Jerusalem as against the gods of the peoples of the land -- work of the hands of man.";
dby[19] = "And they spoke of the God of Jerusalem as of the gods of the peoples of the earth, the work of man\'s hand.";
web[19] = "And they spoke against the God of Jerusalem, as against the gods of the people of the earth, the work of the hands of man.";
hnv[19] = "They spoke of the God of Yerushalayim, as of the gods of the peoples of the eretz, which are the work of men\'s hands.";
vul[19] = "locutusque est contra Deum Hierusalem sicut adversum deos populorum terrae opera manuum hominum";
kjv[20] = "And for this [cause] Hezekiah the king, and the prophet Isaiah the son of Amoz, prayed and cried to heaven.";
rsv[20] = "Then Hezeki\'ah the king and Isaiah the prophet, the son of Amoz, prayed because of this and cried to heaven.";
asv[20] = "And Hezekiah the king, and Isaiah the prophet the son of Amoz, prayed because of this, and cried to heaven.";
yng[20] = "And Hezekiah the king prayeth, and Isaiah son of Amoz the prophet, concerning this, and they cry to the heavens,";
dby[20] = "And because of this, king Hezekiah and the prophet Isaiah the son of Amoz prayed and cried to heaven.";
web[20] = "And for this [cause] Hezekiah the king, and the prophet Isaiah the son of Amoz, prayed and cried to heaven.";
hnv[20] = " Hizkiyahu the king, and Yesha`yahu the prophet the son of Amotz, prayed because of this, and cried to heaven.";
vul[20] = "oraverunt igitur Ezechias rex et Esaias filius Amos prophetes adversum hanc blasphemiam ac vociferati sunt usque in caelum";
kjv[21] = "And the LORD sent an angel, which cut off all the mighty men of valour, and the leaders and captains in the camp of the king of Assyria. So he returned with shame of face to his own land. And when he was come into the house of his god, they that came forth of his own bowels slew him there with the sword.";
rsv[21] = "And the LORD sent an angel, who cut off all the mighty warriors and commanders and officers in the camp of the king of Assyria. So he returned with shame of face to his own land. And when he came into the house of his god, some of his own sons struck him down there with the sword.";
asv[21] = "And Jehovah sent an angel, who cut off all the mighty men of valor, and the leaders and captains, in the camp of the king of Assyria. So he returned with shame of face to his own land. And when he was come into the house of his god, they that came forth from his own bowels slew him there with the sword.";
yng[21] = "and Jehovah sendeth a messenger, and cutteth off every mighty one of valour -- both leader and head -- in the camp of the king of Asshur, and he turneth back with shame of face to his land, and entereth the house of his god, and those coming out of his bowels have caused him to fall there by the sword.";
dby[21] = "And Jehovah sent an angel, who cut off all the mighty men of valour, and the princes and the captains in the camp of the king of Assyria. And he returned with shame of face to his own land. And when he was come into the house of his god, they that came forth of his own bowels made him fall there with the sword.";
web[21] = "And the LORD sent an angel, who cut off all the mighty men of valor, and the leaders and captains in the camp of the king of Assyria. So he returned with shame of face to his own land. And when he had come into the house of his god, they that came forth from his own bowels slew him there with the sword.";
hnv[21] = "The LORD sent an angel, who cut off all the mighty men of valor, and the leaders and captains, in the camp of the king of Ashshur. So he returned with shame of face to his own land. When he was come into the house of his god, those who came forth from his own bowels killed him there with the sword.";
vul[21] = "et misit Dominus angelum qui percussit omnem virum robustum et bellatorem et principem exercitus regis Assyriorum reversusque est cum ignominia in terram suam cumque ingressus esset domum dei sui filii qui egressi fuerant de utero eius interfecerunt eum gladio";
kjv[22] = "Thus the LORD saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib the king of Assyria, and from the hand of all [other], and guided them on every side.";
rsv[22] = "So the LORD saved Hezeki\'ah and the inhabitants of Jerusalem from the hand of Sennach\'erib king of Assyria and from the hand of all his enemies; and he gave them rest on every side.";
asv[22] = "Thus Jehovah saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib the king of Assyria, and from the hand of all [others], and guided them on every side.";
yng[22] = "And Jehovah saveth Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Asshur, and from the hand of all, and He leadeth them round about;";
dby[22] = "And Jehovah saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib the king of Assyria, and from the hand of all, and protected them on every side.";
web[22] = "Thus the LORD saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib the king of Assyria, and from the hand of all [others], and guided them on every side.";
hnv[22] = " Thus the LORD saved Hizkiyahu and the inhabitants of Yerushalayim from the hand of Sancheriv the king of Ashshur, and from the hand of all [others], and guided them on every side.";
vul[22] = "salvavitque Dominus Ezechiam et habitatores Hierusalem de manu Sennacherib regis Assyriorum et de manu omnium et praestitit ei quietem per circuitum";
kjv[23] = "And many brought gifts unto the LORD to Jerusalem, and presents to Hezekiah king of Judah: so that he was magnified in the sight of all nations from thenceforth.";
rsv[23] = "And many brought gifts to the LORD to Jerusalem and precious things to Hezeki\'ah king of Judah, so that he was exalted in the sight of all nations from that time onward.";
asv[23] = "And many brought gifts unto Jehovah to Jerusalem, and precious things to Hezekiah king of Judah; so that he was exalted in the sight of all nations from thenceforth.";
yng[23] = "and many are bringing in an offering to Jehovah, to Jerusalem, and precious things to Hezekiah king of Judah, and he is lifted up before the eyes of all the nations after this.";
dby[23] = "And many brought gifts unto Jehovah to Jerusalem, and precious things to Hezekiah king of Judah; and he was thenceforth magnified in the sight of all the nations.";
web[23] = "And many brought gifts to the LORD to Jerusalem, and presents to Hezekiah king of Judah: so that from thenceforth he was magnified in the sight of all nations.";
hnv[23] = "Many brought gifts to the LORD to Yerushalayim, and precious things to Hizkiyahu king of Yehudah; so that he was exalted in the sight of all nations from thenceforth.";
vul[23] = "multi etiam deferebant hostias et sacrificia Domino Hierusalem et munera Ezechiae regi Iuda qui exaltatus est post haec coram cunctis gentibus";
kjv[24] = "In those days Hezekiah was sick to the death, and prayed unto the LORD: and he spake unto him, and he gave him a sign.";
rsv[24] = "In those days Hezeki\'ah became sick and was at the point of death, and he prayed to the LORD; and he answered him and gave him a sign.";
asv[24] = "In those days Hezekiah was sick even unto death: and he prayed unto Jehovah; and he spake unto him, and gave him a sign.";
yng[24] = "In those days hath Hezekiah been sick even unto death, and he prayeth unto Jehovah, and He speaketh to him, and a wonder hath appointed for him;";
dby[24] = "In those days Hezekiah was sick unto death, and he prayed to Jehovah; and he spoke to him and gave him a sign.";
web[24] = "In those days Hezekiah was sick and near to death, and [he] prayed to the LORD: and he spoke to him, and he gave him a sign.";
hnv[24] = "In those days Hizkiyahu was sick even to death: and he prayed to the LORD; and he spoke to him, and gave him a sign.";
vul[24] = "in diebus illis aegrotavit Ezechias usque ad mortem et oravit Dominum exaudivitque eum et dedit ei signum";
kjv[25] = "But Hezekiah rendered not again according to the benefit [done] unto him; for his heart was lifted up: therefore there was wrath upon him, and upon Judah and Jerusalem.";
rsv[25] = "But Hezeki\'ah did not make return according to the benefit done to him, for his heart was proud. Therefore wrath came upon him and Judah and Jerusalem.";
asv[25] = "But Hezekiah rendered not again according to the benefit done unto him; for his heart was lifted up: therefore there was wrath upon him, and upon Judah and Jerusalem.";
yng[25] = "and Hezekiah hath not returned according to the deed [done] unto him, for his heart hath been lofty, and there is wrath upon him, and upon Judah and Jerusalem;";
dby[25] = "But Hezekiah rendered not again according to the benefit [done] to him, for his heart was lifted up; and there was wrath upon him, and upon Judah and Jerusalem.";
web[25] = "But Hezekiah rendered not again according to the benefit [done] to him; for his heart was lifted up: therefore there was wrath upon him, and upon Judah and Jerusalem.";
hnv[25] = "But Hizkiyahu didn\'t render again according to the benefit done to him; for his heart was lifted up: therefore there was wrath on him, and on Yehudah and Yerushalayim.";
vul[25] = "sed non iuxta beneficia quae acceperat retribuit quia elevatum est cor eius et facta est contra eum ira et contra Iudam ac Hierusalem";
kjv[26] = "Notwithstanding Hezekiah humbled himself for the pride of his heart, [both] he and the inhabitants of Jerusalem, so that the wrath of the LORD came not upon them in the days of Hezekiah.";
rsv[26] = "But Hezeki\'ah humbled himself for the pride of his heart, both he and the inhabitants of Jerusalem, so that the wrath of the LORD did not come upon them in the days of Hezeki\'ah.";
asv[26] = "Notwithstanding Hezekiah humbled himself for the pride of his heart, both he and the inhabitants of Jerusalem, so that the wrath of Jehovah came not upon them in the days of Hezekiah.";
yng[26] = "and Hezekiah is humbled for the loftiness of his heart, he and the inhabitants of Jerusalem, and the wrath of Jehovah hath not come upon them in the days of Hezekiah.";
dby[26] = "And Hezekiah humbled himself for the pride of his heart, he and the inhabitants of Jerusalem, so that the wrath of Jehovah came not upon them in the days of Hezekiah.";
web[26] = "Notwithstanding, Hezekiah humbled himself for the pride of his heart, [both] he and the inhabitants of Jerusalem, so that the wrath of the LORD came not upon them in the days of Hezekiah.";
hnv[26] = "Notwithstanding Hizkiyahu humbled himself for the pride of his heart, both he and the inhabitants of Yerushalayim, so that the wrath of the LORD didn\'t come on them in the days of Hizkiyahu.";
vul[26] = "humiliatusque est postea eo quod exaltatum fuisset cor eius tam ipse quam habitatores Hierusalem et idcirco non venit super eos ira Domini in diebus Ezechiae";
kjv[27] = "And Hezekiah had exceeding much riches and honour: and he made himself treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of pleasant jewels;";
rsv[27] = "And Hezeki\'ah had very great riches and honor; and he made for himself treasuries for silver, for gold, for precious stones, for spices, for shields, and for all kinds of costly vessels;";
asv[27] = "And Hezekiah had exceeding much riches and honor: and he provided him treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of goodly vessels;";
yng[27] = "And Hezekiah hath riches and honour very much, and treasures he hath made to himself of silver, and of gold, and of precious stone, and of spices, and of shields, and of all [kinds] of desirable vessels,";
dby[27] = "And Hezekiah had very much riches and honour; and he made himself treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of pleasant vessels;";
web[27] = "And Hezekiah had very great riches and honor: and he made himself treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of pleasant jewels:";
hnv[27] = "Hizkiyahu had exceeding much riches and honor: and he provided him treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of goodly vessels;";
vul[27] = "fuit autem Ezechias dives et inclitus valde et thesauros sibi plurimos congregavit argenti auri et lapidis pretiosi aromatum et armorum universi generis et vasorum magni pretii";
kjv[28] = "Storehouses also for the increase of corn, and wine, and oil; and stalls for all manner of beasts, and cotes for flocks.";
rsv[28] = "storehouses also for the yield of grain, wine, and oil; and stalls for all kinds of cattle, and sheepfolds.";
asv[28] = "store-houses also for the increase of grain and new wine and oil; and stalls for all manner of beasts, and flocks in folds.";
yng[28] = "and storehouses for the increase of corn, and new wine, and oil, and stalls for all kinds of cattle, and herds for stalls;";
dby[28] = "storehouses also for the increase of corn and new wine and oil, and stalls for all manner of beasts, and [he procured] flocks for the stalls.";
web[28] = "Store-houses also for the increase of corn, and wine, and oil; and stalls for all manner of beasts, and cotes for flocks.";
hnv[28] = "store-houses also for the increase of grain and new wine and oil; and stalls for all manner of animals, and flocks in folds.";
vul[28] = "apothecas quoque frumenti vini et olei et praesepia omnium iumentorum caulasque pecoribus";
kjv[29] = "Moreover he provided him cities, and possessions of flocks and herds in abundance: for God had given him substance very much.";
rsv[29] = "He likewise provided cities for himself, and flocks and herds in abundance; for God had given him very great possessions.";
asv[29] = "Moreover he provided him cities, and possessions of flocks and herds in abundance; for God had given him very much substance.";
yng[29] = "and cities he hath made for himself, and possessions of flocks and herds in abundance, for God hath given to him very much substance.";
dby[29] = "And he provided for himself cities, and possessions of flocks and herds in abundance; for God gave him very much substance.";
web[29] = "Moreover, he provided for himself cities, and possessions of flocks and herds in abundance: for God had given him substance in great abundance.";
hnv[29] = "Moreover he provided him cities, and possessions of flocks and herds in abundance; for God had given him very much substance.";
vul[29] = "et urbes exaedificavit habebat quippe greges ovium et armentorum innumerabiles eo quod dedisset ei Dominus substantiam multam nimis";
kjv[30] = "This same Hezekiah also stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David. And Hezekiah prospered in all his works.";
rsv[30] = "This same Hezeki\'ah closed the upper outlet of the waters of Gihon and directed them down to the west side of the city of David. And Hezeki\'ah prospered in all his works.";
asv[30] = "This same Hezekiah also stopped the upper spring of the waters of Gihon, and brought them straight down on the west side of the city of David. And Hezekiah prospered in all his works.";
yng[30] = "And Hezekiah himself hath stopped the upper source of the waters of Gihon, and directeth them beneath to the west of the city of David, and Hezekiah prospereth in all his work;";
dby[30] = "And he, Hezekiah, stopped the upper outlet of the waters of Gihon, and brought it straight down to the west side of the city of David. And Hezekiah prospered in all his works.";
web[30] = "This same Hezekiah also stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David. And Hezekiah prospered in all his works.";
hnv[30] = "This same Hizkiyahu also stopped the upper spring of the waters of Gichon, and brought them straight down on the west side of the city of David. Hizkiyahu prospered in all his works.";
vul[30] = "ipse est Ezechias qui obturavit superiorem fontem aquarum Gion et avertit eas subter ad occidentem urbis David in omnibus operibus suis fecit prospere quae voluit";
kjv[31] = "Howbeit in [the business of] the ambassadors of the princes of Babylon, who sent unto him to enquire of the wonder that was [done] in the land, God left him, to try him, that he might know all [that was] in his heart.";
rsv[31] = "And so in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had been done in the land, God left him to himself, in order to try him and to know all that was in his heart.";
asv[31] = "Howbeit in [the business of] the ambassadors of the princes of Babylon, who sent unto him to inquire of the wonder that was done in the land, God left him, to try him, that he might know all that was in his heart.";
yng[31] = "and so with the ambassadors of the heads of Babylon, those sending unto him to inquire of the wonder that hath been in the land, God hath left him to try him, to know all in his heart,";
dby[31] = "However in [the matter of] the ambassadors of the princes of Babylon, who sent to him to inquire of the wonder that was done in the land, God left him, to try him, that he might know all [that was] in his heart.";
web[31] = "But, in [the business of] the embassadors of the princes of Babylon, who sent to him to inquire of the wonder that was [done] in the land, God left him, to try him, that he might know all [that was] in his heart.";
hnv[31] = " However in [the business of] the ambassadors of the princes of Bavel, who sent to him to inquire of the wonder that was done in the land, God left him, to try him, that he might know all that was in his heart.";
vul[31] = "attamen in legatione principum Babylonis qui missi fuerant ad eum ut interrogarent de portento quod acciderat super terram dereliquit eum Deus ut temptaretur et nota fierent omnia quae erant in corde eius";
kjv[32] = "Now the rest of the acts of Hezekiah, and his goodness, behold, they [are] written in the vision of Isaiah the prophet, the son of Amoz, [and] in the book of the kings of Judah and Israel.";
rsv[32] = "Now the rest of the acts of Hezeki\'ah, and his good deeds, behold, they are written in the vision of Isaiah the prophet the son of Amoz, in the Book of the Kings of Judah and Israel.";
asv[32] = "Now the rest of the acts of Hezekiah, and his good deeds, behold, they are written in the vision of Isaiah the prophet the son of Amoz, in the book of the kings of Judah and Israel.";
yng[32] = "And the rest of the matters of Hezekiah, and his kind acts, lo, they are written in the vision of Isaiah son of Amoz the prophet, on the book of the kings of Judah and Israel.";
dby[32] = "And the rest of the acts of Hezekiah and his good deeds, behold, they are written in the vision of the prophet Isaiah the son of Amoz in the book of the kings of Judah and Israel.";
web[32] = "Now the rest of the acts of Hezekiah, and his goodness, behold, they [are] written in the vision of Isaiah the prophet, the son of Amoz, [and] in the book of the kings of Judah and Israel.";
hnv[32] = "Now the rest of the acts of Hizkiyahu, and his good deeds, behold, they are written in the vision of Yesha`yahu the prophet the son of Amotz, in the book of the kings of Yehudah and Yisra\'el.";
vul[32] = "reliqua autem sermonum Ezechiae et misericordiarum eius scripta sunt in visione Esaiae filii Amos prophetae et in libro regum Iuda et Israhel";
kjv[33] = "And Hezekiah slept with his fathers, and they buried him in the chiefest of the sepulchres of the sons of David: and all Judah and the inhabitants of Jerusalem did him honour at his death. And Manasseh his son reigned in his stead.";
rsv[33] = "And Hezeki\'ah slept with his fathers, and they buried him in the ascent of the tombs of the sons of David; and all Judah and the inhabitants of Jerusalem did him honor at his death. And Manas\'seh his son reigned in his stead.";
asv[33] = "And Hezekiah slept with his fathers, and they buried him in the ascent of the sepulchres of the sons of David: and all Judah and the inhabitants of Jerusalem did him honor at his death. And Manasseh his son reigned in his stead.";
yng[33] = "And Hezekiah lieth with his fathers, and they bury him in the uppermost of the graves of the sons of David, and all Judah and the inhabitants of Jerusalem have done honour to him at his death, and reign doth Manasseh his son in his stead.";
dby[33] = "And Hezekiah slept with his fathers, and they buried him in the highest place of the sepulchres of the sons of David; and all Judah and the inhabitants of Jerusalem did him honour at his death. And Manasseh his son reigned in his stead.";
web[33] = "And Hezekiah slept with his fathers, and they buried him in the chief of the sepulchers of the sons of David: and all Judah and the inhabitants of Jerusalem did him honor at his death: and Manasseh his son reigned in his stead.";
hnv[33] = " Hizkiyahu slept with his fathers, and they buried him in the ascent of the tombs of the sons of David: and all Yehudah and the inhabitants of Yerushalayim did him honor at his death. Menashsheh his son reigned in his place.";
vul[33] = "dormivitque Ezechias cum patribus suis et sepelierunt eum supra sepulchra filiorum David et celebravit eius exequias universus Iuda et omnes habitatores Hierusalem regnavitque Manasses filius eius pro eo";
</script>
