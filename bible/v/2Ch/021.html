csb[1] = "Jehoshaphat rested with his fathers and was buried with his fathers in the city of David. His son Jehoram became king in his place.";
csb[2] = "He had brothers, sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariah, Michael, and Shephatiah; all these were the sons of King Jehoshaphat of Judah.";
csb[3] = "Their father had given them many gifts of silver, gold, and valuable things, along with fortified cities in Judah, but he gave the kingdom to Jehoram because he was the firstborn.";
csb[4] = "When Jehoram had established himself over his father\'s kingdom, he strengthened his position by killing with the sword all his brothers as well as some of the princes of Israel.";
csb[5] = "Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.";
csb[6] = "He walked in the ways of the kings of Israel, as the house of Ahab had done, for Ahab\'s daughter was his wife. He did what was evil in the LORD\'s sight,";
csb[7] = "but for the sake of the covenant the LORD had made with David, he was unwilling to destroy the house of David since the LORD had promised to give a lamp to David and to his sons forever.";
csb[8] = "During Jehoram\'s reign, Edom rebelled against Judah\'s control and appointed their own king.";
csb[9] = "So Jehoram crossed into Edom with his commanders and all his chariots. Then at night he set out to attack the Edomites who had surrounded him and the chariot commanders.";
csb[10] = "And now Edom is still in rebellion against Judah\'s control today. Libnah also rebelled at that time against his control because he had abandoned the LORD, the God of his ancestors.";
csb[11] = "Jehoram also built high places in the hills of Judah, and he caused the inhabitants of Jerusalem to prostitute themselves, and he led Judah astray.";
csb[12] = "Then a letter came to Jehoram from the prophet Elijah, saying: This is what the LORD, the God of your ancestor David says: &quot;Because you have not walked in the ways of your father Jehoshaphat or in the ways of King Asa of Judah";
csb[13] = "&quot;but have walked in the ways of the kings of Israel, have caused Judah and the inhabitants of Jerusalem to prostitute themselves like the house of Ahab prostituted itself, and also have killed your brothers, your father\'s family, who were better than you,";
csb[14] = "&quot;the LORD is now about to strike your people, your sons, your wives, and all your possessions with a horrible affliction.";
csb[15] = "&quot;You yourself will be struck with many illnesses, including a disease of the intestines, until your intestines come out day after day because of the disease.&quot;";
csb[16] = "The LORD roused the spirit of the Philistines and the Arabs who lived near the Cushites to attack Jehoram.";
csb[17] = "So they went to war against Judah and invaded it. They carried off all the possessions found in the king\'s palace and also his sons and wives; not a son was left to him except Jehoahaz, his youngest son.";
csb[18] = "After all these things, the LORD afflicted him in his intestines with an incurable disease.";
csb[19] = "This continued day after day until two full years passed. Then his intestines came out because of his disease, and he died from severe illnesses. But his people did not hold a fire in his honor like the fire in honor of his fathers.";
csb[20] = "Jehoram was thirty-two years old when he became king; he reigned eight years in Jerusalem. He died to no one\'s regret and was buried in the city of David but not in the tombs of the kings.";

kjv[2] = "And he had brethren the sons of Jehoshaphat, Azariah, and Jehiel, and Zechariah, and Azariah, and Michael, and Shephatiah: all these [were] the sons of Jehoshaphat king of Israel.";

web[2] = "And he had brethren the sons of Jehoshaphat, Azariah, and Jehiel, and Zechariah, and Azariah, and Michael, Shephatiah: all these [were] the sons of Jehoshaphat king of Israel.";
hnv[2] = "He had brothers, the sons of Yehoshafat: `Azaryah, and Yechi\'el, and Zekharyah, and `Azaryah, and Mikha\'el, and Shefatyah; all these were the sons of Yehoshafat king of Yisra\'el.";

rsv[3] = "Their father gave them great gifts, of silver, gold, and valuable possessions, together with fortified cities in Judah; but he gave the kingdom to Jeho\'ram, because he was the first-born.";
asv[3] = "And their father gave them great gifts, of silver, and of gold, and of precious things, with fortified cities in Judah: but the kingdom gave he to Jehoram, because he was the first-born.";
yng[3] = "and their father giveth to them many gifts of silver and of gold, and of precious things, with fenced cities in Judah, and the kingdom he hath given to Jehoram, for He [is] the first-born.";
dby[3] = "And their father had given them great gifts of silver and of gold and of precious things, besides fortified cities in Judah; but the kingdom he gave to Jehoram, for he was the firstborn.";

rsv[4] = "When Jeho\'ram had ascended the throne of his father and was established, he slew all his brothers with the sword, and also some of the princes of Israel.";

hnv[5] = "Yehoram was thirty-two years old when he began to reign; and he reigned eight years in Yerushalayim.";

kjv[6] = "And he walked in the way of the kings of Israel, like as did the house of Ahab: for he had the daughter of Ahab to wife: and he wrought [that which was] evil in the eyes of the LORD.";

asv[6] = "And he walked in the way of the kings of Israel, as did the house of Ahab; for he had the daughter of Ahab to wife: and he did that which was evil in the sight of Jehovah.";
yng[6] = "and he walketh in the way of the kings of Israel, as did the house of Ahab, for a daughter of Ahab hath been to him for a wife, and he doth the evil thing in the eyes of Jehovah,";
dby[6] = "And he walked in the way of the kings of Israel, as did the house of Ahab, for the daughter of Ahab was his wife; and he did evil in the sight of Jehovah.";

hnv[6] = "He walked in the way of the kings of Yisra\'el, as did the house of Ach\'av; for he had the daughter of Ach\'av as wife: and he did that which was evil in the sight of the LORD.";

kjv[8] = "In his days the Edomites revolted from under the dominion of Judah, and made themselves a king.";

asv[8] = "In his days Edom revolted from under the hand of Judah, and made a king over themselves.";

hnv[8] = "In his days Edom revolted from under the hand of Yehudah, and made a king over themselves.";

kjv[9] = "Then Jehoram went forth with his princes, and all his chariots with him: and he rose up by night, and smote the Edomites which compassed him in, and the captains of the chariots.";

asv[9] = "Then Jehoram passed over with his captains, and all his chariots with him: and he rose up by night, and smote the Edomites that compassed him about, and the captains of the chariots.";
yng[9] = "and Jehoram passeth over with his heads, and all the chariots with him, and it cometh to pass, he hath risen by night and smiteth the Edomites who are coming round against him, and the princes of the chariots,";
dby[9] = "And Jehoram went over with his captains, and all the chariots with him; and he rose up by night, and smote the Edomites who had surrounded him, and the captains of the chariots.";

hnv[9] = "Then Yehoram passed over with his captains, and all his chariots with him: and he rose up by night, and struck the Edom who surrounded him, along with the captains of the chariots.";
vul[9] = "cumque transisset Ioram cum principibus suis et cuncto equitatu qui erat secum surrexit nocte et percussit Edom qui se circumdederat et omnes duces equitatus eius";

dby[10] = "But the Edomites revolted from under the hand of Judah unto this day. Then Libnah revolted at the same time from under his hand, because he had forsaken Jehovah the God of his fathers.";

yng[11] = "also, he hath made high places in the mountains of Judah, and causeth the inhabitants of Jerusalem to commit whoredom, and compelleth Judah.";

kjv[12] = "And there came a writing to him from Elijah the prophet, saying, Thus saith the LORD God of David thy father, Because thou hast not walked in the ways of Jehoshaphat thy father, nor in the ways of Asa king of Judah,";
rsv[12] = "And a letter came to him from Eli\'jah the prophet, saying, &quot;Thus says the LORD, the God of David your father, \'Because you have not walked in the ways of Jehosh\'aphat your father, or in the ways of Asa king of Judah,";
asv[12] = "And there came a writing to him from Elijah the prophet, saying, Thus saith Jehovah, the God of David thy father, Because thou hast not walked in the ways of Jehoshaphat thy father, nor in the ways of Asa king of Judah,";
yng[12] = "And there cometh in unto him a writing from Elijah the prophet, saying, `Thus said Jehovah, God of David thy father, Because that thou hast not walked in the ways of Jehoshaphat thy father, and in the ways of Asa king of Judah,";

vul[12] = "adlatae sunt autem ei litterae ab Helia propheta in quibus scriptum erat haec dicit Dominus Deus David patris tui quoniam non ambulasti in viis Iosaphat patris tui et in viis Asa regis Iuda";
kjv[13] = "But hast walked in the way of the kings of Israel, and hast made Judah and the inhabitants of Jerusalem to go a whoring, like to the whoredoms of the house of Ahab, and also hast slain thy brethren of thy father\'s house, [which were] better than thyself:";
rsv[13] = "but have walked in the way of the kings of Israel, and have led Judah and the inhabitants of Jerusalem into unfaithfulness, as the house of Ahab led Israel into unfaithfulness, and also you have killed your brothers, of your father\'s house, who were better than yourself;";
asv[13] = "but hast walked in the way of the kings of Israel, and hast made Judah and the inhabitants of Jerusalem to play the harlot, like as the house of Ahab did, and also hast slain thy brethren of thy father\'s house, who were better than thyself:";
yng[13] = "and thou dost walk in the way of the kings of Israel, and dost cause Judah and the inhabitants of Jerusalem to commit whoredom like the whoredoms of the house of Ahab, and also thy brethren, the house of thy father, who are better than thyself, thou hast slain;";
dby[13] = "but hast walked in the way of the kings of Israel, and hast made Judah and the inhabitants of Jerusalem to commit fornication, like the fornications of the house of Ahab, and also hast slain thy brethren, thy father\'s house who were better than thyself:";
web[13] = "But hast walked in the way of the kings of Israel, and hast made Judah and the inhabitants of Jerusalem to commit idolatry, like the idolatries of the house of Ahab, and also hast slain thy brethren of thy father\'s house, [who were] better than thyself:";
hnv[13] = "but have walked in the way of the kings of Yisra\'el, and have made Yehudah and the inhabitants of Yerushalayim to play the prostitute, like as the house of Ach\'av did, and also have slain your brothers of your father\'s house, who were better than yourself:";
vul[13] = "sed incessisti per iter regum Israhel et fornicari fecisti Iudam et habitatores Hierusalem imitatus fornicationem domus Ahab insuper et fratres tuos domum patris tui meliores te occidisti";

web[14] = "Behold, with a great plague will the LORD smite thy people, and thy children, and thy wives, and all thy goods:";
hnv[14] = "behold, the LORD will strike with a great plague your people, and your children, and your wives, and all your substance;";

web[15] = "And thou [shalt have] great sickness by disease of thy bowels, until thy bowels fall out by reason of the sickness day by day.";

kjv[17] = "And they came up into Judah, and brake into it, and carried away all the substance that was found in the king\'s house, and his sons also, and his wives; so that there was never a son left him, save Jehoahaz, the youngest of his sons.";

asv[17] = "and they came up against Judah, and brake into it, and carried away all the substance that was found in the king\'s house, and his sons also, and his wives; so that there was never a son left him, save Jehoahaz, the youngest of his sons.";
yng[17] = "and they come up into Judah, and rend it, and take captive all the substance that is found at the house of the king, and also his sons, and his wives, and there hath not been left to him a son except Jehoahaz the youngest of his sons.";
dby[17] = "and they came up into Judah, and broke into it, and carried away all the substance that was found in the king\'s house, and his sons also, and his wives; so that there was no son left him, except Jehoahaz the youngest of his sons.";
web[17] = "And they came up into Judah, and broke into it, and carried away all the substance that was found in the king\'s house, and his sons also, and his wives; so that there was not a son left to him, save Jehoahaz the youngest of his sons.";
hnv[17] = "and they came up against Yehudah, and broke into it, and carried away all the substance that was found in the king\'s house, and his sons also, and his wives; so that there was never a son left him, save Yeho\'achaz, the youngest of his sons.";
vul[17] = "et ascenderunt in terram Iuda et vastaverunt eam diripueruntque cunctam substantiam quae inventa est in domo regis insuper et filios eius et uxores nec remansit ei filius nisi Ioachaz qui minimus natu erat";

kjv[19] = "And it came to pass, that in process of time, after the end of two years, his bowels fell out by reason of his sickness: so he died of sore diseases. And his people made no burning for him, like the burning of his fathers.";

vul[19] = "cumque diei succederet dies et temporum spatia volverentur duorum annorum expletus est circulus et sic longa consumptus tabe ita ut egereret etiam viscera sua languore pariter et vita caruit mortuusque est in infirmitate pessima et non fecit ei populus secundum morem conbustionis exequias sicut fecerat maioribus eius";
