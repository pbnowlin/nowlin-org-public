csb[1] = "Jotham was twenty-five years old when he became king, and he reigned sixteen years in Jerusalem. His mother\'s name was Jerushah daughter of Zadok.";
csb[2] = "He did what was right in the LORD\'s sight just as his father Uzziah had done. In addition, he didn\'t enter the LORD\'s sanctuary, but the people still behaved corruptly.";
csb[3] = "Jotham built the Upper Gate of the LORD\'s temple, and he built extensively on the wall of Ophel.";
csb[4] = "He also built cities in the hill country of Judah and fortresses and towers in the forests.";
csb[5] = "He waged war against the king of the Ammonites. He overpowered the Ammonites, and that year they gave him 7,500 pounds of silver, 50,000 bushels of wheat, and 50,000 bushels of barley. They paid him the same in the second and third years.";
csb[6] = "So Jotham strengthened his position because he did not waver in obeying the LORD his God.";
csb[7] = "As for the rest of the events of Jotham\'s reign, along with all his wars and his ways, note that they are written in the Book of the Kings of Israel and Judah.";
csb[8] = "He was twenty-five years old when he became king, and he reigned sixteen years in Jerusalem.";
csb[9] = "Jotham rested with his fathers and was buried in the city of David. His son Ahaz became king in his place.";
