csb[1] = "Then Rehoboam went to Shechem, for all Israel had gone to Shechem to make him king.";
csb[2] = "When Jeroboam son of Nebat heard about it -- for he was in Egypt where he had fled from King Solomon\'s presence -- Jeroboam returned from Egypt.";
csb[3] = "So they summoned him. Then Jeroboam and all Israel came and spoke to Rehoboam:";
csb[4] = "&quot;Your father made our yoke harsh. Therefore, lighten your father\'s harsh service and the heavy yoke he put on us, and we will serve you.&quot;";
csb[5] = "Rehoboam replied, &quot;Return to me in three days.&quot; So the people left.";
csb[6] = "Then King Rehoboam consulted with the elders who had attended his father Solomon when he was alive, asking, &quot;How do you advise me to respond to this people? &quot;";
csb[7] = "They replied, &quot;If you will be kind to this people and please them by speaking kind words to them, they will be your servants forever.&quot;";
csb[8] = "But he rejected the advice of the elders who had advised him, and he consulted with the young men who had grown up with him, the ones attending him.";
csb[9] = "He asked them, &quot;What message do you advise we send back to this people who said to me, \'Lighten the yoke your father put on us\'? &quot;";
csb[10] = "Then the young men who had grown up with him told him, &quot;This is what you should say to the people who said to you, \'Your father made our yoke heavy, but you, make it lighter on us! \' This is what you should say to them: \'My little finger is thicker than my father\'s waist!";
csb[11] = "&quot;Now therefore, my father burdened you with a heavy yoke, but I will add to your yoke; my father disciplined you with whips, but I, with barbed whips.\' &quot;";
csb[12] = "So Jeroboam and all the people came to Rehoboam on the third day, just as the king had ordered, saying, &quot;Return to me on the third day.&quot;";
csb[13] = "Then the king answered them harshly. King Rehoboam rejected the elders\' advice";
csb[14] = "and spoke to them according to the young men\'s advice, saying, &quot;My father made your yoke heavy, but I will add to it; my father disciplined you with whips, but I, with barbed whips.&quot;";
csb[15] = "The king did not listen to the people because the turn of events came from God, in order that the LORD might carry out his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.";
csb[16] = "When all Israel saw that the king had not listened to them, the people answered the king: What portion do we have in David? We have no inheritance in the son of Jesse. Israel, each to your tent; David, look after your own house now! So all Israel went to their tents.";
csb[17] = "But as for the Israelites living in the cities of Judah, Rehoboam reigned over them.";
csb[18] = "Then King Rehoboam sent Hadoram, who was in charge of the forced labor, but the Israelites stoned him to death. However, King Rehoboam managed to get into his chariot to flee to Jerusalem.";
csb[19] = "Israel is in rebellion against the house of David until today.";
kjv[1] = "And Rehoboam went to Shechem: for to Shechem were all Israel come to make him king.";
kjv[2] = "And it came to pass, when Jeroboam the son of Nebat, who [was] in Egypt, whither he had fled from the presence of Solomon the king, heard [it], that Jeroboam returned out of Egypt.";
kjv[3] = "And they sent and called him. So Jeroboam and all Israel came and spake to Rehoboam, saying,";
kjv[4] = "Thy father made our yoke grievous: now therefore ease thou somewhat the grievous servitude of thy father, and his heavy yoke that he put upon us, and we will serve thee.";
kjv[5] = "And he said unto them, Come again unto me after three days. And the people departed.";
kjv[6] = "And king Rehoboam took counsel with the old men that had stood before Solomon his father while he yet lived, saying, What counsel give ye [me] to return answer to this people?";
kjv[7] = "And they spake unto him, saying, If thou be kind to this people, and please them, and speak good words to them, they will be thy servants for ever.";
kjv[8] = "But he forsook the counsel which the old men gave him, and took counsel with the young men that were brought up with him, that stood before him.";
kjv[9] = "And he said unto them, What advice give ye that we may return answer to this people, which have spoken to me, saying, Ease somewhat the yoke that thy father did put upon us?";
kjv[10] = "And the young men that were brought up with him spake unto him, saying, Thus shalt thou answer the people that spake unto thee, saying, Thy father made our yoke heavy, but make thou [it] somewhat lighter for us; thus shalt thou say unto them, My little [finger] shall be thicker than my father\'s loins.";
kjv[11] = "For whereas my father put a heavy yoke upon you, I will put more to your yoke: my father chastised you with whips, but I [will chastise you] with scorpions.";
kjv[12] = "So Jeroboam and all the people came to Rehoboam on the third day, as the king bade, saying, Come again to me on the third day.";
kjv[13] = "And the king answered them roughly; and king Rehoboam forsook the counsel of the old men,";
kjv[14] = "And answered them after the advice of the young men, saying, My father made your yoke heavy, but I will add thereto: my father chastised you with whips, but I [will chastise you] with scorpions.";
kjv[15] = "So the king hearkened not unto the people: for the cause was of God, that the LORD might perform his word, which he spake by the hand of Ahijah the Shilonite to Jeroboam the son of Nebat.";
kjv[16] = "And when all Israel [saw] that the king would not hearken unto them, the people answered the king, saying, What portion have we in David? and [we have] none inheritance in the son of Jesse: every man to your tents, O Israel: [and] now, David, see to thine own house. So all Israel went to their tents.";
kjv[17] = "But [as for] the children of Israel that dwelt in the cities of Judah, Rehoboam reigned over them.";
kjv[18] = "Then king Rehoboam sent Hadoram that [was] over the tribute; and the children of Israel stoned him with stones, that he died. But king Rehoboam made speed to get him up to [his] chariot, to flee to Jerusalem.";
kjv[19] = "And Israel rebelled against the house of David unto this day.";

web[18] = "Then king Rehoboam sent Hadoram that [was] over the tribute; and the children of Israel stoned him with stones, that he died. But king Rehoboam made speed to get into his chariot, to flee to Jerusalem.";
hnv[18] = "Then king Rechav`am sent Hadoram, who was over the men subject to forced labor; and the children of Yisra\'el stoned him to death with stones. King Rechav`am made speed to get him up to his chariot, to flee to Yerushalayim.";
