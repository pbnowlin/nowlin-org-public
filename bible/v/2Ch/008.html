csb[1] = "At the end of twenty years during which Solomon had built the LORD\'s temple and his own palace --";
csb[2] = "Solomon had rebuilt the cities Hiram gave him and settled Israelites there --";
csb[3] = "Solomon went to Hamath-zobah and seized it.";
csb[4] = "He built Tadmor in the wilderness along with all the storage cities that he built in Hamath.";
csb[5] = "He built Upper Beth-horon and Lower Beth-horon -- fortified cities with walls, gates, and bars --";
csb[6] = "Baalath, all the storage cities that belonged to Solomon, all the chariot cities, the cavalry cities, and everything Solomon desired to build in Jerusalem, Lebanon, or anywhere else in the land of his dominion.";
csb[7] = "As for all the peoples who remained of the Hethites, Amorites, Perizzites, Hivites, and Jebusites, who were not from Israel --";
csb[8] = "their descendants who remained in the land after them, those the Israelites had not completely destroyed -- Solomon imposed forced labor on them; it is this way today.";
csb[9] = "But Solomon did not consign the Israelites to be slaves for his work; they were soldiers, commanders of his captains, and commanders of his chariots and his cavalry.";
csb[10] = "These were King Solomon\'s deputies: 250 who supervised the people.";
csb[11] = "Solomon brought the daughter of Pharaoh from the city of David to the house he had built for her, for he said, &quot;My wife must not live in the house of King David of Israel because the places the ark of the LORD has come into are holy.&quot;";
csb[12] = "At that time Solomon offered burnt offerings to the LORD on the LORD\'s altar he had made in front of the portico.";
csb[13] = "He followed the daily requirement for offerings according to the commandment of Moses for Sabbaths, New Moons, and the three annual appointed festivals: the Festival of Unleavened Bread, the Festival of Weeks, and the Festival of Shelters.";
csb[14] = "According to the ordinances of his father David, he appointed the divisions of the priests over their service, of the Levites over their responsibilities to offer praise and to minister before the priests following the daily requirement, and of the gatekeepers by their divisions with respect to each temple gate, for this had been the command of David, the man of God.";
csb[15] = "They did not turn aside from the king\'s command regarding the priests and the Levites concerning any matter or concerning the treasuries.";
csb[16] = "All of Solomon\'s work was carried out from the day the foundation was laid for the LORD\'s temple until it was finished. So the LORD\'s temple was completed.";
csb[17] = "At that time Solomon went to Ezion-geber and to Eloth on the seashore in the land of Edom.";
csb[18] = "So Hiram sent ships to him by his servants along with crews of experienced seamen. They went with Solomon\'s servants to Ophir, took from there seventeen tons of gold, and delivered it to King Solomon.";
kjv[1] = "And it came to pass at the end of twenty years, wherein Solomon had built the house of the LORD, and his own house,";
rsv[1] = "At the end of twenty years, in which Solomon had built the house of the LORD and his own house,";
asv[1] = "And it came to pass at the end of twenty years, wherein Solomon had built the house of Jehovah, and his own house,";
yng[1] = "And it cometh to pass, at the end of twenty years, that Solomon hath built the house of Jehovah, and his own house.";
dby[1] = "And it came to pass at the end of twenty years, when Solomon had built the house of Jehovah and his own house,";
web[1] = "And it came to pass at the end of twenty years, wherein Solomon had built the house of the LORD, and his own house,";
hnv[1] = "It happened at the end of twenty years, in which Shlomo had built the house of the LORD, and his own house,";
vul[1] = "expletis autem viginti annis postquam aedificavit Salomon domum Domini et domum suam";
kjv[2] = "That the cities which Huram had restored to Solomon, Solomon built them, and caused the children of Israel to dwell there.";
rsv[2] = "Solomon rebuilt the cities which Huram had given to him, and settled the people of Israel in them.";
asv[2] = "that the cities which Huram had given to Solomon, Solomon built them, and caused the children of Israel to dwell there.";
yng[2] = "As to the cities that Huram hath given to Solomon, Solomon hath built them, and there he causeth the sons of Israel to dwell.";
dby[2] = "that the cities which Huram had given to Solomon, Solomon built them and caused the children of Israel to dwell there.";
web[2] = "That the cities which Huram had restored to Solomon, Solomon built them, and caused the children of Israel to dwell there.";
hnv[2] = "that the cities which Huram had given to Shlomo, Shlomo built them, and caused the children of Yisra\'el to dwell there.";
vul[2] = "civitates quas dederat Hiram Salomoni aedificavit et habitare ibi fecit filios Israhel";
kjv[3] = "And Solomon went to Hamathzobah, and prevailed against it.";
rsv[3] = "And Solomon went to Ha\'math-zo\'bah, and took it.";
asv[3] = "And Solomon went to Hamath-zobah, and prevailed against it.";
yng[3] = "And Solomon goeth to Hamath-Zobah, and layeth hold upon it;";
dby[3] = "And Solomon went to Hamath-Zobah, and overcame it.";
web[3] = "And Solomon went to Hamath-zobah, and prevailed against it.";
hnv[3] = "Shlomo went to Hamat-Tzovah, and prevailed against it.";
vul[3] = "abiit quoque in Emath Suba et obtinuit eam";
kjv[4] = "And he built Tadmor in the wilderness, and all the store cities, which he built in Hamath.";
rsv[4] = "He built Tadmor in the wilderness and all the store-cities which he built in Hamath.";
asv[4] = "And he built Tadmor in the wilderness, and all the store-cities, which he built in Hamath.";
yng[4] = "and he buildeth Tadmor in the wilderness, and all the cities of store that he hath built in Hamath.";
dby[4] = "And he built Tadmor, in the wilderness, and all the store-cities, which he built in Hamath.";
web[4] = "And he built Tadmor in the wilderness, and all the store cities, which he built in Hamath.";
hnv[4] = "He built Tadmor in the wilderness, and all the store-cities, which he built in Hamat.";
vul[4] = "et aedificavit Palmyram in deserto et alias civitates munitissimas aedificavit in Emath";
kjv[5] = "Also he built Bethhoron the upper, and Bethhoron the nether, fenced cities, with walls, gates, and bars;";
rsv[5] = "He also built Upper Beth-hor\'on and Lower Beth-hor\'on, fortified cities with walls, gates, and bars,";
asv[5] = "Also he built Beth-horon the upper, and Beth-horon the nether, fortified cities, with walls, gates, and bars;";
yng[5] = "And he buildeth Beth-Horon the upper, and Beth-Horon the lower -- cities of defence, with walls, two-leaved doors, and bar --";
dby[5] = "And he built upper Beth-Horon and lower Beth-Horon, fortified cities, with walls, gates, and bars;";
web[5] = "Also he built Beth-horon the upper, and Beth-horon the nether, fortified cities, with walls, gates, and bars;";
hnv[5] = "Also he built Beit-Horon the upper, and Beit-Horon the lower, fortified cities, with walls, gates, and bars;";
vul[5] = "extruxitque Bethoron superiorem et Bethoron inferiorem civitates muratas habentes portas et vectes et seras";
kjv[6] = "And Baalath, and all the store cities that Solomon had, and all the chariot cities, and the cities of the horsemen, and all that Solomon desired to build in Jerusalem, and in Lebanon, and throughout all the land of his dominion.";
rsv[6] = "and Ba\'alath, and all the store-cities that Solomon had, and all the cities for his chariots, and the cities for his horsemen, and whatever Solomon desired to build in Jerusalem, in Lebanon, and in all the land of his dominion.";
asv[6] = "and Baalath, and all the store-cities that Solomon had, and all the cities for his chariots, and the cities for his horsemen, and all that Solomon desired to build for his pleasure in Jerusalem, and in Lebanon, and in all the land of his dominion.";
yng[6] = "and Baalath, and all the cities of store that Solomon had, and all the cities of the chariot, and the cities of the horsemen, and all the desire of Solomon that he desired to build in Jerusalem, and in Lebanon, and in all the land of his dominion.";
dby[6] = "and Baalath, and all the store-cities that Solomon had, and all the cities for chariots, and the cities for the horsemen, and all that Solomon desired to build in Jerusalem, and on Lebanon, and in all the land of his dominion.";
web[6] = "And Baalath, and all the store cities that Solomon had, and all the chariot cities, and the cities of the horsemen, and all that Solomon desired to build in Jerusalem, and in Lebanon, and throughout all the land of his dominion.";
hnv[6] = "and Ba`alat, and all the store-cities that Shlomo had, and all the cities for his chariots, and the cities for his horsemen, and all that Shlomo desired to build for his pleasure in Yerushalayim, and in Levanon, and in all the land of his dominion.";
vul[6] = "Baalath etiam et omnes urbes firmissimas quae fuerunt Salomonis cunctasque urbes quadrigarum et urbes equitum omnia quae voluit Salomon atque disposuit aedificavit in Hierusalem et in Libano et in universa terra potestatis suae";
kjv[7] = "[As for] all the people [that were] left of the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, which [were] not of Israel,";
rsv[7] = "All the people who were left of the Hittites, the Amorites, the Per\'izzites, the Hivites, and the Jeb\'usites, who were not of Israel,";
asv[7] = "As for all the people that were left of the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, that were not of Israel;";
yng[7] = "All the people who are left of the Hittite, and the Amorite, and the Perizzite, and the Hivite, and the Jebusite, who are not of Israel --";
dby[7] = "All the people that were left of the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, who were not of Israel,";
web[7] = "[As for] all the people [that were] left of the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, who [were] not of Israel,";
hnv[7] = "As for all the people who were left of the Hitti, and the Amori, and the Perizzi, and the Hivvi, and the Yevusi, who were not of Yisra\'el;";
vul[7] = "omnem populum qui derelictus fuerat de Hettheis et Amorreis et Ferezeis et Eveis et Iebuseis qui non erant de stirpe Israhel";
kjv[8] = "[But] of their children, who were left after them in the land, whom the children of Israel consumed not, them did Solomon make to pay tribute until this day.";
rsv[8] = "from their descendants who were left after them in the land, whom the people of Israel had not destroyed--these Solomon made a forced levy and so they are to this day.";
asv[8] = "of their children that were left after them in the land, whom the children of Israel consumed not, of them did Solomon raise a levy [of bondservants] unto this day.";
yng[8] = "of their sons who have been left after them in the land, whom the sons of Israel consumed not -- doth Solomon lift up a tribute unto this day.";
dby[8] = "their children that were left after them in the land, whom the children of Israel had not destroyed, upon them did Solomon impose tribute-service until this day.";
web[8] = "[But] of their children, who were left after them in the land, whom the children of Israel consumed not, them did Solomon make to pay tribute until this day.";
hnv[8] = "of their children who were left after them in the land, whom the children of Yisra\'el didn\'t consume, of them did Shlomo raise a levy [of bondservants] to this day.";
vul[8] = "de filiis eorum et de posteris quos non interfecerant filii Israhel subiugavit Salomon in tributarios usque in diem hanc";
kjv[9] = "But of the children of Israel did Solomon make no servants for his work; but they [were] men of war, and chief of his captains, and captains of his chariots and horsemen.";
rsv[9] = "But of the people of Israel Solomon made no slaves for his work; they were soldiers, and his officers, the commanders of his chariots, and his horsemen.";
asv[9] = "But of the children of Israel did Solomon make no servants for his work; but they were men of war, and chief of his captains, and rulers of his chariots and of his horsemen.";
yng[9] = "And none of the sons of Israel hath Solomon made servants for his work, but they [are] men of war, and heads of his captains, and heads of his charioteers, and of his horsemen;";
dby[9] = "But of the children of Israel, of them did Solomon make no bondmen for his work; but they were men of war, and chief of his captains, and captains of his chariots and his horsemen.";
web[9] = "But of the children of Israel did Solomon make no servants for his work; but they [were] men of war, and chief of his captains, and captains of his chariots and horsemen.";
hnv[9] = "But of the children of Yisra\'el did Shlomo make no servants for his work; but they were men of war, and chief of his captains, and rulers of his chariots and of his horsemen.";
vul[9] = "porro de filiis Israhel non posuit ut servirent operibus regis ipsi enim erant viri bellatores et duces primi et principes quadrigarum et equitum eius";
kjv[10] = "And these [were] the chief of king Solomon\'s officers, [even] two hundred and fifty, that bare rule over the people.";
rsv[10] = "And these were the chief officers of King Solomon, two hundred and fifty, who exercised authority over the people.";
asv[10] = "And these were the chief officers of king Solomon, even two hundred and fifty, that bare rule over the people.";
yng[10] = "and these [are] heads of the officers whom king Solomon hath, two hundred and fifty who are rulers among the people.";
dby[10] = "And these were the chief of king Solomon\'s superintendents, two hundred and fifty, that ruled over the people.";
web[10] = "And these [were] the chief of king Solomon\'s officers, [even] two hundred and fifty, that bore rule over the people.";
hnv[10] = "These were the chief officers of king Shlomo, even two hundred fifty, who ruled over the people.";
vul[10] = "omnes autem principes exercitus regis Salomonis fuerunt ducenti quinquaginta qui erudiebant populum";
kjv[11] = "And Solomon brought up the daughter of Pharaoh out of the city of David unto the house that he had built for her: for he said, My wife shall not dwell in the house of David king of Israel, because [the places are] holy, whereunto the ark of the LORD hath come.";
rsv[11] = "Solomon brought Pharaoh\'s daughter up from the city of David to the house which he had built for her, for he said, &quot;My wife shall not live in the house of David king of Israel, for the places to which the ark of the LORD has come are holy.&quot;";
asv[11] = "And Solomon brought up the daughter of Pharaoh out of the city of David unto the house that he had built for her; for he said, My wife shall not dwell in the house of David king of Israel, because the places are holy, whereunto the ark of Jehovah hath come.";
yng[11] = "And the daughter of Pharaoh hath Solomon brought up from the city of David to the house that he built for her, for he said, `My wife doth not dwell in the house of David king of Israel, for they are holy unto whom hath come the ark of Jehovah.\'";
dby[11] = "And Solomon brought up the daughter of Pharaoh out of the city of David to the house which he had built for her; for he said, My wife shall not dwell in the house of David king of Israel, because the [places] are holy to which the ark of Jehovah has come.";
web[11] = "And Solomon brought up the daughter of Pharaoh from the city of David to the house that he had built for her: for he said, My wife shall not dwell in the house of David king of Israel, because [the places are] holy, to which the ark of the LORD hath come.";
hnv[11] = "Shlomo brought up the daughter of Par`oh out of the city of David to the house that he had built for her; for he said, My wife shall not dwell in the house of David king of Yisra\'el, because the places are holy, whereunto the ark of the LORD has come.";
vul[11] = "filiam vero Pharaonis transtulit de civitate David in domum quam aedificaverat ei dixit enim non habitabit uxor mea in domo David regis Israhel eo quod sanctificata sit quia ingressa est eam arca Domini";
kjv[12] = "Then Solomon offered burnt offerings unto the LORD on the altar of the LORD, which he had built before the porch,";
rsv[12] = "Then Solomon offered up burnt offerings to the LORD upon the altar of the LORD which he had built before the vestibule,";
asv[12] = "Then Solomon offered burnt-offerings unto Jehovah on the altar of Jehovah, which he had built before the porch,";
yng[12] = "Then hath Solomon caused to ascend burnt-offerings to Jehovah on the altar of Jehovah that he built before the porch,";
dby[12] = "Then Solomon offered up burnt-offerings to Jehovah on the altar of Jehovah, which he had built before the porch;";
web[12] = "Then Solomon offered burnt-offerings to the LORD on the altar of the LORD, which he had built before the porch,";
hnv[12] = "Then Shlomo offered burnt-offerings to the LORD on the altar of the LORD, which he had built before the porch,";
vul[12] = "tunc obtulit Salomon holocausta Domino super altare Domini quod extruxerat ante porticum";
kjv[13] = "Even after a certain rate every day, offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the solemn feasts, three times in the year, [even] in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.";
rsv[13] = "as the duty of each day required, offering according to the commandment of Moses for the sabbaths, the new moons, and the three annual feasts--the feast of unleavened bread, the feast of weeks, and the feast of tabernacles.";
asv[13] = "even as the duty of every day required, offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the set feasts, three times in the year, [even] in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.";
yng[13] = "even by the matter of a day in its day, to cause to ascend according to the command of Moses, on sabbaths, and on new moons, and on appointed seasons, three times in a year -- in the feast of unleavened things, and in the feast of weeks, and in the feast of booths.";
dby[13] = "even as the duty of every day required, offering according to the commandment of Moses, on the sabbaths, and on the new moons, and at the set feasts, three times in the year, -- at the feast of unleavened bread, and at the feast of weeks, and at the feast of tabernacles.";
web[13] = "Even after a certain rate every day, offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the solemn feasts, three times in the year, [even] in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.";
hnv[13] = "even as the duty of every day required, offering according to the mitzvah of Moshe, on the Shabbatot, and on the new moons, and on the set feasts, three times in the year, [even] in the feast of matzah, and in the feast of weeks, and in the feast of booths.";
vul[13] = "ut per singulos dies offerretur in eo iuxta praeceptum Mosi in sabbatis et in kalendis et in festis diebus ter per annum id est in sollemnitate azymorum et in sollemnitate ebdomadarum et in sollemnitate tabernaculorum";
kjv[14] = "And he appointed, according to the order of David his father, the courses of the priests to their service, and the Levites to their charges, to praise and minister before the priests, as the duty of every day required: the porters also by their courses at every gate: for so had David the man of God commanded.";
rsv[14] = "According to the ordinance of David his father, he appointed the divisions of the priests for their service, and the Levites for their offices of praise and ministry before the priests as the duty of each day required, and the gatekeepers in their divisions for the several gates; for so David the man of God had commanded.";
asv[14] = "And he appointed, according to the ordinance of David his father, the courses of the priests to their service, and the Levites to their offices, to praise, and to minister before the priests, as the duty of every day required; the doorkeepers also by their courses at every gate: for so had David the man of God commanded.";
yng[14] = "And he establisheth, according to the ordinance of David his father, the courses of the priests over their service, and of the Levites over their charges, to praise and to minister over-against the priests, according to the matter of a day in its day, and the gatekeepers in their courses at gate and gate, for so [is] the command of David the man of God.";
dby[14] = "And he appointed, according to the ordinance of David his father, the divisions of the priests for their service, and the Levites for their charges, to praise and serve before the priests, as the duty of every day required; and the doorkeepers by their divisions at every gate: for such was the commandment of David the man of God;";
web[14] = "And he appointed, according to the order of David his father, the courses of the priests to their service, and the Levites to their charges, to praise and minister before the priests, as the duty of every day required: the porters also by their courses at every gate: for so had David the man of God commanded.";
hnv[14] = "He appointed, according to the ordinance of David his father, the courses of the Kohanim to their service, and the Levites to their offices, to praise, and to minister before the Kohanim, as the duty of every day required; the doorkeepers also by their courses at every gate: for so had David the man of God commanded.";
vul[14] = "et constituit iuxta dispositionem David patris sui officia sacerdotum in ministeriis suis et Levitas in ordine suo ut laudarent et ministrarent coram sacerdotibus iuxta ritum uniuscuiusque diei et ianitores in divisionibus suis per portam et portam sic enim praeceperat David homo Dei";
kjv[15] = "And they departed not from the commandment of the king unto the priests and Levites concerning any matter, or concerning the treasures.";
rsv[15] = "And they did not turn aside from what the king had commanded the priests and Levites concerning any matter and concerning the treasuries.";
asv[15] = "And they departed not from the commandment of the king unto the priests and Levites concerning any matter, or concerning the treasures.";
yng[15] = "And they have not turned aside [from] the command of the king concerning the priests and the Levites, in reference to any matter, and to the treasures.";
dby[15] = "and they did not depart from the commandment of the king to the priests and the Levites concerning any matter, nor concerning the treasures.";
web[15] = "And they departed not from the commandment of the king to the priests and Levites concerning any matter, or concerning the treasures.";
hnv[15] = "They didn\'t depart from the mitzvah of the king to the Kohanim and Levites concerning any matter, or concerning the treasures.";
vul[15] = "nec praetergressi sunt de mandatis regis tam sacerdotes quam Levitae ex omnibus quae praeceperat et in custodiis thesaurorum";
kjv[16] = "Now all the work of Solomon was prepared unto the day of the foundation of the house of the LORD, and until it was finished. [So] the house of the LORD was perfected.";
rsv[16] = "Thus was accomplished all the work of Solomon from the day the foundation of the house of the LORD was laid until it was finished. So the house of the LORD was completed.";
asv[16] = "Now all the work of Solomon was prepared unto the day of the foundation of the house of Jehovah, and until it was finished. [So] the house of Jehovah was completed.";
yng[16] = "And all the work of Solomon is prepared till the day of the foundation of the house of Jehovah, and till its completion; perfect is the house of Jehovah.";
dby[16] = "And all the work of Solomon was prepared, to the day of the foundation of the house of Jehovah and to its completion. [So] the house of Jehovah was finished.";
web[16] = "Now all the work of Solomon was prepared to the day of the foundation of the house of the LORD, and until it was finished. [So] the house of the LORD was perfected.";
hnv[16] = "Now all the work of Shlomo was prepared to the day of the foundation of the house of the LORD, and until it was finished. [So] the house of the LORD was completed.";
vul[16] = "omnes inpensas praeparatas habuit Salomon ex eo die quo fundavit domum Domini usque in diem quo perfecit eam";
kjv[17] = "Then went Solomon to Eziongeber, and to Eloth, at the sea side in the land of Edom.";
rsv[17] = "Then Solomon went to E\'zion-ge\'ber and Eloth on the shore of the sea, in the land of Edom.";
asv[17] = "Then went Solomon to Ezion-geber, and to Eloth, on the seashore in the land of Edom.";
yng[17] = "Then hath Solomon gone to Ezion-Geber, and unto Elath, on the border of the sea, in the land of Edom;";
dby[17] = "Then went Solomon to Ezion-geber, and to Eloth, on the seashore in the land of Edom.";
web[17] = "Then went Solomon to Ezion-geber, and to Eloth, at the sea side in the land of Edom.";
hnv[17] = " Then went Shlomo to `Etzyon-Gever, and to Elot, on the seashore in the land of Edom.";
vul[17] = "tunc abiit Salomon in Hesiongaber et in Ahilath ad oram maris Rubri quae est in terra Edom";
kjv[18] = "And Huram sent him by the hands of his servants ships, and servants that had knowledge of the sea; and they went with the servants of Solomon to Ophir, and took thence four hundred and fifty talents of gold, and brought [them] to king Solomon.";
rsv[18] = "And Huram sent him by his servants ships and servants familiar with the sea, and they went to Ophir together with the servants of Solomon, and fetched from there four hundred and fifty talents of gold and brought it to King Solomon.";
asv[18] = "And Huram sent him by the hands of his servants ships, and servants that had knowledge of the sea; and they came with the servants of Solomon to Ophir, and fetched from thence four hundred and fifty talents of gold, and brought them to king Solomon.";
yng[18] = "and Huram sendeth to him, by the hand of his servants, ships and servants knowing the sea, and they go with servants of Solomon to Ophir, and take thence four hundred and fifty talents of gold, and bring in unto king Solomon.";
dby[18] = "And Huram sent him by his servants ships, and servants that had knowledge of the sea; and they went with the servants of Solomon to Ophir, and fetched thence four hundred and fifty talents of gold, and brought them to king Solomon.";
web[18] = "And Huram sent to him by the hands of his servants, ships, and servants that had knowledge of the sea; and they went with the servants of Solomon to Ophir, and took thence four hundred and fifty talents of gold, and brought [them] to king Solomon.";
hnv[18] = "Huram sent him by the hands of his servants ships, and servants who had knowledge of the sea; and they came with the servants of Shlomo to Ofir, and fetched from there four hundred fifty talents of gold, and brought them to king Shlomo.";
vul[18] = "misit autem ei Hiram per manum servorum suorum naves et nautas gnaros maris et abierunt cum servis Salomonis in Ophir tuleruntque inde quadringenta quinquaginta talenta auri et adtulerunt ad regem Salomonem";
