csb[1] = "Then, in the seventh year, Jehoiada summoned his courage and took the commanders of hundreds into a covenant with him: Azariah son of Jeroham, Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.";
csb[2] = "They made a circuit throughout Judah. They gathered the Levites from all the cities of Judah and the family heads of Israel, and they came to Jerusalem.";
csb[3] = "Then the whole assembly made a covenant with the king in God\'s temple. Jehoiada said to them, &quot;Here is the king\'s son! He will reign, just as the LORD promised concerning David\'s sons.";
csb[4] = "&quot;This is what you are to do: a third of you, priests and Levites who are coming on duty on the Sabbath, are to be gatekeepers.";
csb[5] = "&quot;A third are to be at the king\'s palace, and a third are to be at the Foundation Gate, and all the troops will be in the courtyards of the LORD\'s temple.";
csb[6] = "&quot;No one is to enter the LORD\'s temple but the priests and those Levites who serve; they may enter because they are holy, but all the people are to obey the requirement of the LORD.";
csb[7] = "&quot;Completely surround the king with weapons in hand. Anyone who enters the temple is to be put to death. Be with the king in all his daily tasks.&quot;";
csb[8] = "So the commanders of hundreds did everything the priest Jehoiada commanded. They each brought their men -- those coming on duty on the Sabbath and those going off duty on the Sabbath -- for the priest Jehoiada did not release the divisions.";
csb[9] = "The priest Jehoiada gave to the commanders of hundreds King David\'s spears, shields, and quivers that were in God\'s temple.";
csb[10] = "Then he stationed all the troops with their weapons in hand surrounding the king -- from the right side of the temple to the left side, by the altar and by the temple.";
csb[11] = "They brought out the king\'s son, put the crown on him, gave him the testimony, and made him king. Jehoiada and his sons anointed him and cried, &quot;Long live the king! &quot;";
csb[12] = "When Athaliah heard the noise from the troops, the guards, and those praising the king, she went to the troops in the LORD\'s temple.";
csb[13] = "As she looked, there was the king standing by his pillar at the entrance. The commanders and the trumpeters were by the king, and all the people of the land were rejoicing and blowing trumpets while the singers with musical instruments were leading the praise. Athaliah tore her clothes and screamed, &quot;Treason! Treason! &quot;";
csb[14] = "Then the priest Jehoiada sent out the commanders of hundreds, those in charge of the army, saying, &quot;Take her out between the ranks, and put anyone who follows her to death by the sword,&quot; for the priest had said, &quot;Don\'t put her to death in the LORD\'s temple.&quot;";
csb[15] = "So they arrested her, and she went by the entrance of the Horse Gate to the king\'s palace, where they put her to death.";
csb[16] = "Then Jehoiada made a covenant between himself, the king, and the people that they would be the LORD\'s people.";
csb[17] = "So all the people went to the temple of Baal and tore it down. They smashed its altars and images and killed Mattan, the priest of Baal, at the altars.";
csb[18] = "Then Jehoiada put the oversight of the LORD\'s temple into the hands of the Levitical priests, whom David had appointed over the LORD\'s temple, to offer burnt offerings to the LORD as it is written in the law of Moses, with rejoicing and song ordained by David.";
csb[19] = "He stationed gatekeepers at the gates of the LORD\'s temple so that nothing unclean could enter for any reason.";
csb[20] = "Then he took with him the commanders of hundreds, the nobles, the governors of the people, and all the people of the land and brought the king down from the LORD\'s temple. They entered the king\'s palace through the Upper Gate and seated the king on the throne of the kingdom.";
csb[21] = "All the people of the land rejoiced, and the city was quiet, for they had put Athaliah to death by the sword.";
kjv[1] = "And in the seventh year Jehoiada strengthened himself, and took the captains of hundreds, Azariah the son of Jeroham, and Ishmael the son of Jehohanan, and Azariah the son of Obed, and Maaseiah the son of Adaiah, and Elishaphat the son of Zichri, into covenant with him.";

asv[1] = "And in the seventh year Jehoiada strengthened himself, and took the captains of hundreds, Azariah the son of Jeroham, and Ishmael the son of Jehohanan, and Azariah the son of Obed, and Maaseiah the son of Adaiah, and Elishaphat the son of Zichri, into covenant with him.";
yng[1] = "And in the seventh year hath Jehoiada strengthened himself, and taketh the heads of the hundreds, even Azariah son of Jeroham, and Ishmael son of Jehohanan, and Azariah son of Obed, and Maaseiah son of Adaiah, and Elishaphat son of Zichri, with him into covenant.";
dby[1] = "And in the seventh year Jehoiada strengthened himself, and took the captains of the hundreds, Azariah the son of Jeroham, and Ishmael the son of Jehohanan, and Azariah the son of Obed, and Maaseiah the son of Adaiah, and Elishaphat the son of Zichri, into covenant with him.";

hnv[1] = "In the seventh year Yehoiada strengthened himself, and took the captains of hundreds, `Azaryah the son of Yerocham, and Yishma\'el the son of Yehochanan, and `Azaryah the son of `Oved, and Ma`aseyah the son of `Adayah, and Elishaphat the son of Zikhri, into covenant with him.";
vul[1] = "anno autem septimo confortatus Ioiadae adsumpsit centuriones Azariam videlicet filium Hieroam et Ismahel filium Iohanan Azariam quoque filium Oded et Maasiam filium Adaiae et Elisaphat filium Zechri et iniit cum eis foedus";
kjv[2] = "And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem.";

vul[5] = "tertia pars vestrum qui veniunt ad sabbatum sacerdotum et Levitarum et ianitorum erit in portis tertia vero pars ad domum regis et tertia in porta quae appellatur Fundamenti omne vero reliquum vulgus sit in atriis domus Domini";

kjv[7] = "And the Levites shall compass the king round about, every man with his weapons in his hand; and whosoever [else] cometh into the house, he shall be put to death: but be ye with the king when he cometh in, and when he goeth out.";

asv[7] = "And the Levites shall compass the king round about, every man with his weapons in his hand; and whosoever cometh into the house, let him be slain: and be ye with the king when he cometh in, and when he goeth out.";
yng[7] = "and the Levites have compassed the king round about, each with his weapon in his hand, and he who hath gone in unto the house is put to death; and be ye with the king in his coming in and in his going out.\'";
dby[7] = "And the Levites shall encompass the king round about, every man with his weapons in his hand; and he that comes into the house shall be put to death; and ye shall be with the king when he comes in and when he goes out.";

kjv[8] = "So the Levites and all Judah did according to all things that Jehoiada the priest had commanded, and took every man his men that were to come in on the sabbath, with them that were to go [out] on the sabbath: for Jehoiada the priest dismissed not the courses.";
rsv[8] = "The Levites and all Judah did according to all that Jehoi\'ada the priest commanded. They each brought his men, who were to go off duty on the sabbath, with those who were to come on duty on the sabbath; for Jehoi\'ada the priest did not dismiss the divisions.";
asv[8] = "So the Levites and all Judah did according to all that Jehoiada the priest commanded: and they took every man his men, those that were to come in on the sabbath, with those that were to go out on the sabbath; for Jehoiada the priest dismissed not the courses.";
yng[8] = "And the Levites and all Judah do according to all that Jehoiada the priest hath commanded, and take each his men going in on the sabbath, with those going out on the sabbath, for Jehoiada the priest hath not let away the courses.";
dby[8] = "And the Levites and all Judah did according to all that Jehoiada the priest commanded; and they took every man his men, those that were to come in on the sabbath, with them that were to go forth on the sabbath; for Jehoiada the priest did not liberate the divisions.";
web[8] = "So the Levites and all Judah did according to all things that Jehoiada the priest had commanded, and took every man his men that were to come in on the sabbath, with them that were to go [out] on the sabbath: for Jehoiada the priest dismissed not the courses.";
hnv[8] = "So the Levites and all Yehudah did according to all that Yehoiada the Kohen commanded: and they took every man his men, those who were to come in on the Shabbat; with those who were to go out on the Shabbat; for Yehoiada the Kohen didn\'t dismiss the shift.";
vul[8] = "fecerunt igitur Levitae et universus Iuda iuxta omnia quae praeceperat Ioiadae pontifex et adsumpserunt singuli viros qui sub se erant et veniebant per ordinem sabbati cum his qui iam impleverant sabbatum et egressuri erant siquidem Ioiadae pontifex non dimiserat abire turmas quae sibi per singulas ebdomadas succedere consueverant";

kjv[13] = "And she looked, and, behold, the king stood at his pillar at the entering in, and the princes and the trumpets by the king: and all the people of the land rejoiced, and sounded with trumpets, also the singers with instruments of musick, and such as taught to sing praise. Then Athaliah rent her clothes, and said, Treason, Treason.";

asv[13] = "and she looked, and, behold, the king stood by his pillar at the entrance, and the captains and the trumpets by the king; and all the people of the land rejoiced, and blew trumpets; the singers also [played] on instruments of music, and led the singing of praise. Then Athaliah rent her clothes, and said, Treason! treason!";
yng[13] = "and seeth, and lo, the king is standing by his pillar in the entrance, and the heads, and the trumpets [are] by the king, and all the people of the land rejoicing and shouting with trumpets, and the singers with instruments of song, and the teachers, to praise, and Athaliah rendeth her garments, and saith, `Conspiracy, conspiracy.\'";
dby[13] = "And she looked, and behold, the king stood on his dais at the entrance, and the princes and the trumpets were by the king; and all the people of the land rejoiced, and blew with trumpets; and the singers [were there] with the instruments of music, and such as taught to sing praise. And Athaliah rent her garments, and said, Conspiracy! Conspiracy!";
web[13] = "And she looked, and behold, the king stood at his pillar at the entrance, and the princes and the trumpets by the king: and all the people of the land rejoiced, and sounded with trumpets, also the singers with instruments of music, and such as taught to sing praise. Then Athaliah rent her clothes, and said, Treason, treason.";
hnv[13] = "and she looked, and, behold, the king stood by his pillar at the entrance, and the captains and the trumpets by the king; and all the people of the land rejoiced, and blew trumpets; the singers also [played] on instruments of music, and led the singing of praise. Then `Atalyah tore her clothes, and said, Treason! treason!";
vul[13] = "cumque vidisset regem stantem super gradum in introitu et principes turmasque circa eum omnem quoque populum terrae gaudentem atque clangentem tubis et diversi generis organis concinentem vocemque laudantium scidit vestimenta sua et ait insidiae insidiae";
kjv[14] = "Then Jehoiada the priest brought out the captains of hundreds that were set over the host, and said unto them, Have her forth of the ranges: and whoso followeth her, let him be slain with the sword. For the priest said, Slay her not in the house of the LORD.";
rsv[14] = "Then Jehoi\'ada the priest brought out the captains who were set over the army, saying to them, &quot;Bring her out between the ranks; any one who follows her is to be slain with the sword.&quot; For the priest said, &quot;Do not slay her in the house of the LORD.&quot;";
asv[14] = "And Jehoiada the priest brought out the captains of hundreds that were set over the host, and said unto them, Have her forth between the ranks; and whoso followeth her, let him be slain with the sword: for the priest said, Slay her not in the house of Jehovah.";
yng[14] = "And Jehoiada the priest bringeth out the heads of the hundreds, inspectors of the force, and saith unto them, `Take her out from within the rows, and he who hath gone after her is put to death by the sword;\' for the priest said, `Put her not to death [in] the house of Jehovah.\'";
dby[14] = "And Jehoiada the priest brought out the captains of the hundreds that were set over the host, and said to them, Lead her forth without the ranks; and whosoever follows her, let him be slain with the sword; for the priest said, Ye shall not put her to death in the house of Jehovah.";
web[14] = "Then Jehoiada the priest brought out the captains of hundreds that were set over the host, and said to them, Have her forth without the ranges: and whoever followeth her, let him be slain with the sword. For the priest said, Slay her not in the house of the LORD.";
hnv[14] = "Yehoiada the Kohen brought out the captains of hundreds who were set over the host, and said to them, Have her forth between the ranks; and whoever follows her, let him be slain with the sword: for the Kohen said, Don\'t kill her in the house of the LORD.";
vul[14] = "egressus autem Ioiadae pontifex ad centuriones et principes exercitus dixit eis educite illam extra septa templi et interficiatur foris gladio praecepitque sacerdos ne occideretur in domo Domini";
kjv[15] = "So they laid hands on her; and when she was come to the entering of the horse gate by the king\'s house, they slew her there.";
rsv[15] = "So they laid hands on her; and she went into the entrance of the horse gate of the king\'s house, and they slew her there.";
asv[15] = "So they made way for her; and she went to the entrance of the horse gate to the king\'s house: and they slew her there.";
yng[15] = "And they make for her sides, and she cometh in unto the entrance of the gate of the horses at the house of the king, and they put her to death there.";
dby[15] = "And they made way for her, and she went through the entrance of the horse-gate into the king\'s house, and they put her to death there.";
web[15] = "So they laid hands on her; and when she had come to the entrance of the horse gate by the king\'s house, they slew her there.";
hnv[15] = "So they made way for her; and she went to the entrance of the horse gate to the king\'s house: and they killed her there.";
vul[15] = "et inposuerunt cervicibus eius manus cumque intrasset portam Equorum domus regis interfecerunt eam ibi";
kjv[16] = "And Jehoiada made a covenant between him, and between all the people, and between the king, that they should be the LORD\'S people.";
rsv[16] = "And Jehoi\'ada made a covenant between himself and all the people and the king that they should be the LORD\'s people.";
asv[16] = "And Jehoiada made a covenant between himself, and all the people, and the king, that they should be Jehovah\'s people.";
yng[16] = "And Jehoiada maketh a covenant between him, and between all the people, and between the king, to be for a people to Jehovah;";
dby[16] = "And Jehoiada made a covenant between himself and all the people and the king, that they should be the people of Jehovah.";
web[16] = "And Jehoiada made a covenant between him, and between all the people, and between the king, that they should be the LORD\'S people.";
hnv[16] = " Yehoiada made a covenant between himself, and all the people, and the king, that they should be the LORD\'s people.";
vul[16] = "pepigit autem Ioiadae foedus inter se universumque populum et regem ut esset populus Domini";
kjv[17] = "Then all the people went to the house of Baal, and brake it down, and brake his altars and his images in pieces, and slew Mattan the priest of Baal before the altars.";
rsv[17] = "Then all the people went to the house of Ba\'al, and tore it down; his altars and his images they broke in pieces, and they slew Mattan the priest of Ba\'al before the altars.";
asv[17] = "And all the people went to the house of Baal, and brake it down, and brake his altars and his images in pieces, and slew Mattan the priest of Baal before the altars.";
yng[17] = "and all the people enter the house of Baal, and break it down, yea, his altars and his images they have broken, and Mattan priest of Baal they have slain before the altars.";
dby[17] = "And all the people went into the house of Baal, and broke it down; and they broke his altars and his images in pieces, and slew Mattan the priest of Baal before the altars.";
web[17] = "Then all the people went to the house of Baal, and broke it down, and broke his altars and his images in pieces, and slew Mattan the priest of Baal before the altars.";
hnv[17] = "All the people went to the house of Ba`al, and broke it down, and broke his altars and his images in pieces, and killed Mattan the Kohen of Ba`al before the altars.";
vul[17] = "itaque ingressus est omnis populus domum Baal et destruxerunt eam et altaria ac simulacra illius confregerunt Matthan quoque sacerdotem Baal interfecerunt ante aras";
kjv[18] = "Also Jehoiada appointed the offices of the house of the LORD by the hand of the priests the Levites, whom David had distributed in the house of the LORD, to offer the burnt offerings of the LORD, as [it is] written in the law of Moses, with rejoicing and with singing, [as it was ordained] by David.";
rsv[18] = "And Jehoi\'ada posted watchmen for the house of the LORD under the direction of the Levitical priests and the Levites whom David had organized to be in charge of the house of the LORD, to offer burnt offerings to the LORD, as it is written in the law of Moses, with rejoicing and with singing, according to the order of David.";
asv[18] = "And Jehoiada appointed the officers of the house of Jehovah under the hand of the priests the Levites, whom David had distributed in the house of Jehovah, to offer the burnt-offerings of Jehovah, as it is written in the law of Moses, with rejoicing and with singing, according to the order of David.";
yng[18] = "And Jehoiada putteth the offices of the house of Jehovah into the hand of the priests the Levites whom David had apportioned over the house of Jehovah, to cause to ascend the burnt-offerings of Jehovah, as written in the law of Moses, with joy, and with singing, by the hands of David;";
dby[18] = "And Jehoiada appointed the offices of the house of Jehovah under the hand of the priests, the Levites, whom David had set by classes over the house of Jehovah to offer up Jehovah\'s burnt-offerings, as it is written in the law of Moses, -- with rejoicing and with singing according to the directions of David.";
web[18] = "Also Jehoiada appointed the offices of the house of the LORD by the hand of the priests the Levites, whom David had distributed in the house of the LORD, to offer the burnt-offerings of the LORD, as [it is] written in the law of Moses, with rejoicing and with singing, [as it was ordained] by David.";
hnv[18] = "Yehoiada appointed the officers of the house of the LORD under the hand of the Kohanim the Levites, whom David had distributed in the house of the LORD, to offer the burnt offerings of the LORD, as it is written in the law of Moshe, with rejoicing and with singing, according to the order of David.";
vul[18] = "constituit autem Ioiadae praepositos in domo Domini et sub manibus sacerdotum ac Levitarum quos distribuit David in domo Domini ut offerrent holocausta Domino sicut scriptum est in lege Mosi in gaudio et canticis iuxta dispositionem David";
kjv[19] = "And he set the porters at the gates of the house of the LORD, that none [which was] unclean in any thing should enter in.";
rsv[19] = "He stationed the gatekeepers at the gates of the house of the LORD so that no one should enter who was in any way unclean.";
asv[19] = "And he set the porters at the gates of the house of Jehovah, that none that was unclean in anything should enter in.";
yng[19] = "and he stationeth the gatekeepers over the gates of the house of Jehovah, and the unclean in anything doth not go in.";
dby[19] = "And he set the doorkeepers at the gates of the house of Jehovah, that no one unclean in anything should enter in.";
web[19] = "And he set the porters at the gates of the house of the LORD, that none [who was] unclean in any thing should enter.";
hnv[19] = "He set the porters at the gates of the house of the LORD, that no one who was unclean in anything should enter in.";
vul[19] = "constituit quoque ianitores in portis domus Domini ut non ingrederetur eam inmundus in omni re";
kjv[20] = "And he took the captains of hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of the LORD: and they came through the high gate into the king\'s house, and set the king upon the throne of the kingdom.";
rsv[20] = "And he took the captains, the nobles, the governors of the people, and all the people of the land; and they brought the king down from the house of the LORD, marching through the upper gate to the king\'s house. And they set the king upon the royal throne.";
asv[20] = "And he took the captains of hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of Jehovah: and they came through the upper gate unto the king\'s house, and set the king upon the throne of the kingdom.";
yng[20] = "And he taketh the heads of the hundreds, and the honourable ones, and the rulers among the people, and all the people of the land, and bringeth down the king from the house of Jehovah, and they come in through the high gate to the house of the king, and cause the king to sit on the throne of the kingdom.";
dby[20] = "And he took the captains of the hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of Jehovah; and they came through the upper gate into the king\'s house, and set the king upon the throne of the kingdom.";
web[20] = "And he took the captains of hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of the LORD: and they came through the high gate into the king\'s house, and set the king upon the throne of the kingdom.";
hnv[20] = "He took the captains of hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of the LORD: and they came through the upper gate to the king\'s house, and set the king on the throne of the kingdom.";
vul[20] = "adsumpsitque centuriones et fortissimos viros ac principes populi et omne vulgus terrae et fecerunt descendere regem de domo Domini et introire per medium portae superioris in domum regis et conlocaverunt eum in solio regali";
kjv[21] = "And all the people of the land rejoiced: and the city was quiet, after that they had slain Athaliah with the sword.";
rsv[21] = "So all the people of the land rejoiced; and the city was quiet, after Athali\'ah had been slain with the sword.";
asv[21] = "So all the people of the land rejoiced, and the city was quiet. And Athaliah they had slain with the sword.";
yng[21] = "And all the people of the land rejoice, and the city hath been quiet, and Athaliah they have put to death by the sword.";
dby[21] = "And all the people of the land rejoiced, and the city was quiet; and they had slain Athaliah with the sword.";
web[21] = "And all the people of the land rejoiced: and the city was quiet, after they had slain Athaliah with the sword.";
hnv[21] = "So all the people of the land rejoiced, and the city was quiet. `Atalyah they had slain with the sword.";
vul[21] = "laetatusque est omnis populus terrae et urbs quievit porro Otholia interfecta est gladio";
