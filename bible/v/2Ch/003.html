csb[1] = "Then Solomon began to build the LORD\'s temple in Jerusalem on Mount Moriah where the LORD  had appeared to his father David, at the site David had prepared on the threshing floor of Ornan the Jebusite.";
csb[2] = "He began to build on the second day of the second month in the fourth year of his reign.";
csb[3] = "These are Solomon\'s foundations for building God\'s temple: the length was ninety feet, and the width thirty feet.";
csb[4] = "The portico, which was across the front extending across the width of the temple, was thirty feet wide; its height was thirty feet; he overlaid its inner surface with pure gold.";
csb[5] = "The larger room he paneled with cypress wood, overlaid with fine gold, and decorated with palm trees and chains.";
csb[6] = "He adorned the temple with precious stones for beauty, and the gold was the gold of Parvaim.";
csb[7] = "He overlaid the temple -- the beams, the thresholds, its walls and doors -- with gold, and he carved cherubim on the walls.";
csb[8] = "Then he made the most holy place; its length corresponded to the width of the temple, 30 feet, and its width was 30 feet. He overlaid it with forty-five thousand pounds of fine gold.";
csb[9] = "The weight of the nails was twenty ounces of gold, and he overlaid the ceiling with gold.";
csb[10] = "He made two cherubim of sculptured work, for the most holy place, and he overlaid them with gold.";
csb[11] = "The overall length of the wings of the cherubim was 30 feet: the wing of one was 7 1/2 feet, touching the wall of the room; its other wing was 7 1/2 feet, touching the wing of the other cherub.";
csb[12] = "The wing of the other cherub was 7 1/2 feet, touching the wall of the room; its other wing was 7 1/2 feet, reaching the wing of the other cherub.";
csb[13] = "The wingspan of these cherubim was 30 feet. They stood on their feet and faced the larger room.";
csb[14] = "He made the curtain of blue, purple, and crimson yarn and fine linen, and he wove cherubim into it.";
csb[15] = "In front of the temple he made two pillars, each 27 feet high. The capital on top of each was 7 1/2 feet high.";
csb[16] = "He had made chainwork in the inner sanctuary and also put it on top of the pillars. He made a hundred pomegranates and fastened them into the chainwork.";
csb[17] = "Then he set up the pillars in front of the sanctuary, one on the right and one on the left. He named the one on the right Jachin and the one on the left Boaz.";
kjv[1] = "Then Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where [the LORD] appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.";
