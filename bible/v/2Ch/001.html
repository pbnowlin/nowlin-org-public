csb[1] = "Solomon son of David strengthened his hold on his kingdom. The LORD his God was with him and highly exalted him.";
csb[2] = "Then Solomon spoke to all Israel, to the commanders of thousands and of hundreds, to the judges, and to every leader in all Israel -- the family heads.";
csb[3] = "Solomon and the whole assembly with him went to the high place that was in Gibeon because God\'s tent of meeting, which the LORD\'s servant Moses had made in the wilderness, was there.";
csb[4] = "Now David had brought the ark of God from Kiriath-jearim to the place he had set up for it, because he had pitched a tent for it in Jerusalem,";
csb[5] = "but he put the bronze altar, which Bezalel son of Uri, son of Hur, had made, in front of the LORD\'s tabernacle. Solomon and the assembly inquired of him there.";
csb[6] = "Solomon offered sacrifices there in the LORD\'s presence on the bronze altar at the tent of meeting; he offered a thousand burnt offerings on it.";
csb[7] = "That night God appeared to Solomon and said to him: &quot;Ask. What should I give you? &quot;";
csb[8] = "And Solomon said to God: &quot;You have shown great and faithful love to my father David, and you have made me king in his place.";
csb[9] = "&quot;LORD God, let your promise to my father David now come true. For you have made me king over a people as numerous as the dust of the earth.";
csb[10] = "&quot;Now grant me wisdom and knowledge so that I may lead these people, for who can judge this great people of yours? &quot;";
csb[11] = "God said to Solomon, &quot;Since this was in your heart, and you have not requested riches, wealth, or glory, or for the life of those who hate you, and you have not even requested long life, but you have requested for yourself wisdom and knowledge that you may judge my people over whom I have made you king,";
csb[12] = "&quot;wisdom and knowledge are given to you. I will also give you riches, wealth, and glory, unlike what was given to the kings who were before you, or will be given to those after you.&quot;";
csb[13] = "So Solomon went to Jerusalem from the high place that was in Gibeon in front of the tent of meeting, and he reigned over Israel.";
csb[14] = "Solomon accumulated 1,400 chariots and 12,000 horsemen, which he stationed in the chariot cities and with the king in Jerusalem.";
csb[15] = "The king made silver and gold as common in Jerusalem as stones, and he made cedar as abundant as sycamore in the Judean foothills.";
csb[16] = "Solomon\'s horses came from Egypt and Kue. The king\'s traders would get them from Kue at the going price.";
csb[17] = "A chariot could be imported from Egypt for fifteen pounds of silver and a horse for nearly four pounds. In the same way, they exported them to all the kings of the Hittites and to the kings of Aram through their agents.";
kjv[1] = "And Solomon the son of David was strengthened in his kingdom, and the LORD his God [was] with him, and magnified him exceedingly.";

yng[1] = "And strengthen himself doth Solomon son of David over his kingdom, and Jehovah his God [is] with him, and maketh him exceedingly great.";
dby[1] = "And Solomon the son of David was strengthened in his kingdom, and Jehovah his God was with him and magnified him exceedingly.";

kjv[3] = "So Solomon, and all the congregation with him, went to the high place that [was] at Gibeon; for there was the tabernacle of the congregation of God, which Moses the servant of the LORD had made in the wilderness.";

yng[4] = "but the ark of God had David brought up from Kirjath-Jearim, when David prepared for it, for he stretched out for it a tent in Jerusalem;";

dby[5] = "And the brazen altar that Bezaleel the son of Uri, the son of Hur, had made, was there before the tabernacle of Jehovah; and Solomon and the congregation sought unto it.";

rsv[9] = "O LORD God, let thy promise to David my father be now fulfilled, for thou hast made me king over a people as many as the dust of the earth.";

yng[9] = "Now, O Jehovah God, is Thy word with David my father stedfast, for Thou hast caused me to reign over a people numerous as the dust of the earth;";
dby[9] = "Now, Jehovah Elohim, let thy word unto David my father be firm; for thou hast made me king over a people numerous as the dust of the earth.";

dby[10] = "Give me now wisdom and knowledge, that I may go out and come in before this people; for who can judge this thy great people?";

hnv[10] = "Give me now wisdom and knowledge, that I may go out and come in before this people; for who can judge this your people, that is so great?";

kjv[11] = "And God said to Solomon, Because this was in thine heart, and thou hast not asked riches, wealth, or honour, nor the life of thine enemies, neither yet hast asked long life; but hast asked wisdom and knowledge for thyself, that thou mayest judge my people, over whom I have made thee king:";
rsv[11] = "God answered Solomon, &quot;Because this was in your heart, and you have not asked possessions, wealth, honor, or the life of those who hate you, and have not even asked long life, but have asked wisdom and knowledge for yourself that you may rule my people over whom I have made you king,";
asv[11] = "And God said to Solomon, Because this was in thy heart, and thou hast not asked riches, wealth, or honor, nor the life of them that hate thee, neither yet hast asked long life; but hast asked wisdom and knowledge for thyself, that thou mayest judge my people, over whom I have made thee king:";
yng[11] = "And God saith to Solomon, `Because that this hath been with thy heart, and thou hast not asked riches, wealth, and honour, and the life of those hating thee, and also many days hast not asked, and dost ask for thyself wisdom and knowledge, so that thou dost judge My people over which I have caused thee to reign --";
dby[11] = "And God said to Solomon, Because this was in thy heart, and thou hast not asked riches, wealth, or honour, nor the life of them that hate thee, neither yet hast asked long life; but hast asked for thyself wisdom and knowledge, that thou mayest judge my people, over whom I have made thee king:";
web[11] = "And God said to Solomon, Because this was in thy heart, and thou hast not asked riches, wealth, or honor, nor the life of thy enemies, neither yet hast asked long life; but hast asked wisdom and knowledge for thyself, that thou mayest judge my people, over whom I have made thee king:";
hnv[11] = "God said to Shlomo, Because this was in your heart, and you have not asked riches, wealth, or honor, nor the life of those who hate you, neither yet have asked long life; but have asked wisdom and knowledge for yourself, that you may judge my people, over whom I have made you king:";
vul[11] = "dixit autem Deus ad Salomonem quia hoc magis placuit cordi tuo et non postulasti divitias et substantiam et gloriam neque animas eorum qui te oderunt sed nec dies vitae plurimos petisti autem sapientiam et scientiam ut iudicare possis populum meum super quem constitui te regem";

rsv[12] = "wisdom and knowledge are granted to you. I will also give you riches, possessions, and honor, such as none of the kings had who were before you, and none after you shall have the like.&quot;";
asv[12] = "wisdom and knowledge is granted unto thee; and I will give thee riches, and wealth, and honor, such as none of the kings have had that have been before thee; neither shall there any after thee have the like.";
yng[12] = "the wisdom and the knowledge is given to thee, and riches and wealth and honour I give to thee, that there hath not been so to the kings who [are] before thee, and after thee it is not so.\'";
dby[12] = "wisdom and knowledge are granted unto thee; and I will give thee riches and wealth and honour, such as none of the kings have had that have been before thee, neither shall any after thee have the like.";

hnv[12] = "wisdom and knowledge is granted to you; and I will give you riches, and wealth, and honor, such as none of the kings have had who have been before you; neither shall there any after you have the like.";

web[13] = "Then Solomon came [from his journey] to the high place that [was] at Gibeon to Jerusalem, from before the tabernacle of the congregation, and reigned over Israel.";

dby[15] = "And the king made silver and gold in Jerusalem as stones, and cedars made he as the sycamores that are in the lowland for abundance.";

kjv[16] = "And Solomon had horses brought out of Egypt, and linen yarn: the king\'s merchants received the linen yarn at a price.";
rsv[16] = "And Solomon\'s import of horses was from Egypt and Ku\'e, and the king\'s traders received them from Ku\'e for a price.";
asv[16] = "And the horses which Solomon had were brought out of Egypt; the king\'s merchants received them in droves, each drove at a price.";
yng[16] = "And the source of the horses that [are] to Solomon [is] from Egypt and from Keva; merchants of the king from Keva take at a price,";
dby[16] = "And the exportation of horses that Solomon had was from Egypt: a caravan of the king\'s merchants fetched a drove [of horses], at a price.";
web[16] = "And Solomon had horses brought out of Egypt, and linen yarn: the king\'s merchants received the linen yarn at a price.";
hnv[16] = "The horses which Shlomo had were brought out of Mitzrayim and from Kue; the king\'s merchants purchased them from Kue.";
vul[16] = "adducebantur autem ei et equi de Aegypto et de Coa a negotiatoribus regis qui ibant et coemebant pretio";
kjv[17] = "And they fetched up, and brought forth out of Egypt a chariot for six hundred [shekels] of silver, and an horse for an hundred and fifty: and so brought they out [horses] for all the kings of the Hittites, and for the kings of Syria, by their means.";
rsv[17] = "They imported a chariot from Egypt for six hundred shekels of silver, and a horse for a hundred and fifty; likewise through them these were exported to all the kings of the Hittites and the kings of Syria.";
asv[17] = "And they fetched up and brought out of Egypt a chariot for six hundred [shekels] of silver, and a horse for a hundred and fifty: and so for all the kings of the Hittites, and the kings of Syria, did they bring them out by their means.";
yng[17] = "and they come up, and bring out from Egypt a chariot for six hundred silverlings, and a horse for fifty and a hundred, and so for all the kings of the Hittites, and the kings of Aram -- by their hand they bring out.";
dby[17] = "And they fetched up and brought forth out of Egypt a chariot for six hundred [shekels] of silver, and a horse for a hundred and fifty; and so they brought [them] by their means, for all the kings of the Hittites and for the kings of Syria.";
web[17] = "And they fetched up, and brought out of Egypt a chariot for six hundred [shekels] of silver, and a horse for a hundred and fifty: and so they brought out [horses] for all the kings of the Hittites, and for the kings of Syria, by their means.";
hnv[17] = "They brought up and brought out of Mitzrayim a chariot for six hundred pieces of silver, and a horse for one hundred fifty: and so for all the kings of the Hitti, and the kings of Aram, did they bring them out by their means.";
vul[17] = "quadrigam equorum sescentis argenteis et equum centum quinquaginta similiter de universis regnis Cettheorum et a regibus Syriae emptio celebrabatur";
