csb[1] = "When all this was completed, all Israel who had attended went out to the cities of Judah and broke up the sacred pillars, chopped down the Asherah poles, and tore down the high places and altars throughout Judah and Benjamin, as well as in Ephraim and Manasseh, to the last one. Then all the Israelites returned to their cities, each to his own possession.";
csb[2] = "Hezekiah reestablished the divisions of the priests and Levites for the burnt offerings and fellowship offerings, for ministry, for giving thanks, and for praise in the gates of the camp of the LORD, each division corresponding to his service among the priests and Levites.";
csb[3] = "The king contributed from his own possessions for the regular morning and evening burnt offerings, the burnt offerings of the Sabbaths, of the New Moons, and of the appointed feasts, as written in the law of the LORD.";
csb[4] = "He told the people who lived in Jerusalem to give a contribution for the priests and Levites so that they could devote their energy to the law of the LORD.";
csb[5] = "When the word spread, the Israelites gave liberally of the best of the grain, new wine, fresh oil, honey, and of all the produce of the field, and they brought in an abundance, a tenth of everything.";
csb[6] = "As for the Israelites and Judahites who lived in the cities of Judah, they also brought a tenth of the herds and flocks, and a tenth of the dedicated things that were consecrated to the LORD their God. They gathered them into large piles.";
csb[7] = "In the third month they began building up the piles, and they finished in the seventh month.";
csb[8] = "When Hezekiah and his officials came and viewed the piles, they blessed the LORD and his people Israel.";
csb[9] = "Hezekiah asked the priests and Levites about the piles.";
csb[10] = "The chief priest Azariah, of the household of Zadok, answered him, &quot;Since they began bringing the offering to the LORD\'s temple, we eat and are satisfied and there is plenty left over because the LORD has blessed his people; this abundance is what is left over.&quot;";
csb[11] = "Hezekiah told them to prepare chambers in the LORD\'s temple, and they prepared them.";
csb[12] = "The offering, the tenth, and the dedicated things were brought faithfully. Conaniah the Levite was the officer in charge of them, and his brother Shimei was second.";
csb[13] = "Jehiel, Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismachiah, Mahath, and Benaiah were deputies under the authority of Conaniah and his brother Shimei by appointment of King Hezekiah and of Azariah the chief official of God\'s temple.";
csb[14] = "Kore son of Imnah the Levite, the keeper of the East Gate, was over the freewill offerings to God to distribute the contribution to the LORD and the consecrated things.";
csb[15] = "Eden, Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah in the cities of the priests were to distribute it faithfully under his authority to their brothers by divisions, whether large or small.";
csb[16] = "In addition, they distributed it to males registered by genealogy three years old and above; to all who would enter the LORD\'s temple for their daily duty, for their service in their responsibilities according to their divisions.";
csb[17] = "They distributed also to those recorded by genealogy of the priests by their ancestral families and the Levites twenty years old and above, by their responsibilities in their divisions;";
csb[18] = "to those registered by genealogy -- with all their dependents, wives, sons, and daughters -- of the whole assembly (for they had faithfully consecrated themselves as holy);";
csb[19] = "and to the descendants of Aaron, the priests, in the common fields of their cities, in each and every city. There were men who were registered by name to distribute a portion to every male among the priests and to every Levite recorded by genealogy.";
csb[20] = "Hezekiah did this throughout all Judah. He did what was good and upright and true before the LORD his God.";
csb[21] = "He was diligent in every deed that he began in the service of God\'s temple, in the instruction and the commands, in order to seek his God, and he prospered.";
kjv[1] = "Now when all this was finished, all Israel that were present went out to the cities of Judah, and brake the images in pieces, and cut down the groves, and threw down the high places and the altars out of all Judah and Benjamin, in Ephraim also and Manasseh, until they had utterly destroyed them all. Then all the children of Israel returned, every man to his possession, into their own cities.";
rsv[1] = "Now when all this was finished, all Israel who were present went out to the cities of Judah and broke in pieces the pillars and hewed down the Ashe\'rim and broke down the high places and the altars throughout all Judah and Benjamin, and in E\'phraim and Manas\'seh, until they had destroyed them all. Then all the people of Israel returned to their cities, every man to his possession.";
asv[1] = "Now when all this was finished, all Israel that were present went out to the cities of Judah, and brake in pieces the pillars, and hewed down the Asherim, and brake down the high places and the altars out of all Judah and Benjamin, in Ephraim also and Manasseh, until they had destroyed them all. Then all the children of Israel returned, every man to his possession, into their own cities.";
yng[1] = "And at the completion of all this, gone out have all Israel who are found present to the cities of Judah, and break the standing-pillars, and cut down the shrines, and break down the high places and the altars, out of all Judah and Benjamin, and in Ephraim and Manasseh, even to completion, and all the sons of Israel turn back, each to his Possession, to their cities.";
dby[1] = "And when all this was finished, all Israel that were present went out to the cities of Judah, and broke the columns, and hewed down the Asherahs, and demolished the high places and the altars in all Judah and Benjamin, in Ephraim also and Manasseh, until they had destroyed them all. And all the children of Israel returned every man to his possession, into their cities.";
web[1] = "Now when all this was finished, all Israel [that were] present went out to the cities of Judah, and broke the images in pieces, and cut down the groves, and threw down the high places and the altars out of all Judah and Benjamin, in Ephraim also and Manasseh, until they had utterly destroyed them all. Then all the children of Israel returned every man to his possession into their own cities.";
hnv[1] = "Now when all this was finished, all Yisra\'el who were present went out to the cities of Yehudah, and broke in pieces the pillars, and hewed down the Asherim, and broke down the high places and the altars out of all Yehudah and Binyamin, in Efrayim also and Menashsheh, until they had destroyed them all. Then all the children of Yisra\'el returned, every man to his possession, into their own cities.";
vul[1] = "cumque haec fuissent rite celebrata egressus est omnis Israhel qui inventus fuerat in urbibus Iuda et fregerunt simulacra succideruntque lucos demoliti sunt excelsa et altaria destruxerunt non solum de universo Iuda et Beniamin sed de Ephraim quoque et Manasse donec penitus everterent reversique sunt omnes filii Israhel in possessiones et civitates suas";
kjv[2] = "And Hezekiah appointed the courses of the priests and the Levites after their courses, every man according to his service, the priests and Levites for burnt offerings and for peace offerings, to minister, and to give thanks, and to praise in the gates of the tents of the LORD.";
rsv[2] = "And Hezeki\'ah appointed the divisions of the priests and of the Levites, division by division, each according to his service, the priests and the Levites, for burnt offerings and peace offerings, to minister in the gates of the camp of the LORD and to give thanks and praise.";
asv[2] = "And Hezekiah appointed the courses of the priests and the Levites after their courses, every man according to his service, both the priests and the Levites, for burnt-offerings and for peace-offerings, to minister, and to give thanks, and to praise in the gates of the camp of Jehovah.";
yng[2] = "And Hezekiah appointeth the courses of the priests, and of the Levites, by their courses, each according to his service, of the priests and of the Levites, for burnt-offering, and for peace-offerings, to minister, and to give thanks, and to give praise in the gates of the camps of Jehovah.";
dby[2] = "And Hezekiah appointed the divisions of the priests, and the Levites after their divisions, every man according to his service, as well the priests as the Levites, for burnt-offerings and for peace-offerings, to serve and to give thanks and to praise in the gates of the courts of Jehovah.";
web[2] = "And Hezekiah appointed the courses of the priests and the Levites after their courses, every man according to his service, the priests and Levites for burnt-offerings and for peace-offerings, to minister, and to give thanks, and to praise in the gates of the tents of the LORD.";
hnv[2] = " Hizkiyahu appointed the courses of the Kohanim and the Levites after their courses, every man according to his service, both the Kohanim and the Levites, for burnt offerings and for peace-offerings, to minister, and to give thanks, and to praise in the gates of the camp of the LORD.";
vul[2] = "Ezechias vero constituit turmas sacerdotales et leviticas per divisiones suas unumquemque in officio proprio tam sacerdotum videlicet quam Levitarum ad holocausta et pacifica ut ministrarent et confiterentur canerentque in portis castrorum Domini";
kjv[3] = "[He appointed] also the king\'s portion of his substance for the burnt offerings, [to wit], for the morning and evening burnt offerings, and the burnt offerings for the sabbaths, and for the new moons, and for the set feasts, as [it is] written in the law of the LORD.";
rsv[3] = "The contribution of the king from his own possessions was for the burnt offerings: the burnt offerings of morning and evening, and the burnt offerings for the sabbaths, the new moons, and the appointed feasts, as it is written in the law of the LORD.";
asv[3] = "[He appointed] also the king\'s portion of his substance for the burnt-offerings, [to wit], for the morning and evening burnt-offerings, and the burnt-offerings for the sabbaths, and for the new moons, and for the set feasts, as it is written in the law of Jehovah.";
yng[3] = "And a portion of the king, from his substance, [is] for burnt-offerings, for burnt-offerings of the morning, and of the evening, and the burnt-offerings of sabbaths, and of new moons, and of appointed seasons, as it is written in the law of Jehovah.";
dby[3] = "And [he ordered] that the king\'s portion [should be taken] from his substance for the burnt-offerings: for the morning and evening burnt-offerings, for the burnt-offerings of the sabbaths, and of the new moons, and of the set feasts, as it is written in the law of Jehovah.";
web[3] = "[He appointed] also the king\'s portion of his substance for the burnt-offerings, [to wit], for the morning and evening burnt-offerings, and the burnt-offerings for the sabbaths, and for the new-moons, and for the set feasts, as [it is] written in the law of the LORD.";
hnv[3] = "[He appointed] also the king\'s portion of his substance for the burnt-offerings, [to wit], for the morning and evening burnt offerings, and the burnt offerings for the Shabbatot, and for the new moons, and for the set feasts, as it is written in the law of the LORD.";
vul[3] = "pars autem regis erat ut de propria eius substantia offerretur holocaustum mane semper et vespere sabbatis quoque et kalendis et sollemnitatibus ceteris sicut scriptum est in lege Mosi";
kjv[4] = "Moreover he commanded the people that dwelt in Jerusalem to give the portion of the priests and the Levites, that they might be encouraged in the law of the LORD.";
rsv[4] = "And he commanded the people who lived in Jerusalem to give the portion due to the priests and the Levites, that they might give themselves to the law of the LORD.";
asv[4] = "Moreover he commanded the people that dwelt in Jerusalem to give the portion of the priests and the Levites, that they might give themselves to the law of Jehovah.";
yng[4] = "And he saith to the people, to the inhabitants of Jerusalem, to give the portion of the priests, and of the Levites, so that they are strengthened in the law of Jehovah;";
dby[4] = "And he commanded the people that dwelt in Jerusalem to give the portion of the priests and the Levites, that they might be encouraged in the law of Jehovah.";
web[4] = "Moreover, he commanded the people that dwelt in Jerusalem to give the portion of the priests and the Levites, that they might be encouraged in the law of the LORD.";
hnv[4] = " Moreover he commanded the people who lived in Yerushalayim to give the portion of the Kohanim and the Levites, that they might give themselves to the law of the LORD.";
vul[4] = "praecepit etiam populo habitantium Hierusalem ut darent partes sacerdotibus et Levitis et possent vacare legi Domini";
kjv[5] = "And as soon as the commandment came abroad, the children of Israel brought in abundance the firstfruits of corn, wine, and oil, and honey, and of all the increase of the field; and the tithe of all [things] brought they in abundantly.";
rsv[5] = "As soon as the command was spread abroad, the people of Israel gave in abundance the first fruits of grain, wine, oil, honey, and of all the produce of the field; and they brought in abundantly the tithe of everything.";
asv[5] = "And as soon as the commandment came abroad, the children of Israel gave in abundance the first-fruits of grain, new wine, and oil, and honey, and of all the increase of the field; and the tithe of all things brought they in abundantly.";
yng[5] = "and at the spreading forth of the thing have the sons of Israel multiplied the first-fruit of corn, new wine, and oil, and honey, and of all the increase of the field, and the tithe of the whole in abundance they have brought in.";
dby[5] = "And as soon as the commandment was published, the children of Israel gave in abundance the firstfruits of corn, new wine and oil and honey, and of all the increase of the field; and they brought in abundantly the tithe of all [things].";
web[5] = "And as soon as the commandment came abroad, the children of Israel brought in abundance the first-fruits of corn, wine, and oil, and honey, and of all the increase of the field; and the tithe of all [things] they brought in abundantly.";
hnv[5] = "As soon as the mitzvah came abroad, the children of Yisra\'el gave in abundance the first fruits of grain, new wine, and oil, and honey, and of all the increase of the field; and the tithe of all things brought they in abundantly.";
vul[5] = "quod cum percrebruisset in auribus multitudinis plurimas obtulere primitias filii Israhel frumenti vini et olei mellis quoque et omnium quae gignit humus decimas obtulerunt";
kjv[6] = "And [concerning] the children of Israel and Judah, that dwelt in the cities of Judah, they also brought in the tithe of oxen and sheep, and the tithe of holy things which were consecrated unto the LORD their God, and laid [them] by heaps.";
rsv[6] = "And the people of Israel and Judah who lived in the cities of Judah also brought in the tithe of cattle and sheep, and the dedicated things which had been consecrated to the LORD their God, and laid them in heaps.";
asv[6] = "And the children of Israel and Judah, that dwelt in the cities of Judah, they also brought in the tithe of oxen and sheep, and the tithe of dedicated things which were consecrated unto Jehovah their God, and laid them by heaps.";
yng[6] = "And the sons of Israel and Judah, those dwelling in cities of Judah, they also a tithe of herd and flock, and a tithe of the holy things that are sanctified to Jehovah their God, have brought in, and they give -- heaps, heaps;";
dby[6] = "And the children of Israel and of Judah, that dwelt in the cities of Judah, they also brought the tithe of oxen and sheep, and the tithe of holy things which were consecrated to Jehovah their God, and laid them by heaps.";
web[6] = "And the children of Israel and Judah, that dwelt in the cities of Judah, they also brought in the tithe of oxen and sheep, and the tithe of holy things which were consecrated to the LORD their God, and laid [them] by heaps.";
hnv[6] = "The children of Yisra\'el and Yehudah, who lived in the cities of Yehudah, they also brought in the tithe of oxen and sheep, and the tithe of dedicated things which were consecrated to the LORD their God, and laid them by heaps.";
vul[6] = "sed et filii Israhel et Iuda qui habitabant in urbibus Iuda obtulerunt decimas boum et ovium decimasque sanctorum quae voverant Domino Deo suo atque universa portantes fecerunt acervos plurimos";
kjv[7] = "In the third month they began to lay the foundation of the heaps, and finished [them] in the seventh month.";
rsv[7] = "In the third month they began to pile up the heaps, and finished them in the seventh month.";
asv[7] = "In the third month they began to lay the foundation of the heaps, and finished them in the seventh month.";
yng[7] = "in the third month they have begun to lay the foundation of the heaps, and in the seventh month they have finished.";
dby[7] = "In the third month they began to lay the heaps, and finished them in the seventh month.";
web[7] = "In the third month they began to lay the foundation of the heaps, and finished [them] in the seventh month.";
hnv[7] = "In the third month they began to lay the foundation of the heaps, and finished them in the seventh month.";
vul[7] = "mense tertio coeperunt acervorum iacere fundamenta et mense septimo conpleverunt eos";
kjv[8] = "And when Hezekiah and the princes came and saw the heaps, they blessed the LORD, and his people Israel.";
rsv[8] = "When Hezeki\'ah and the princes came and saw the heaps, they blessed the LORD and his people Israel.";
asv[8] = "And when Hezekiah and the princes came and saw the heaps, they blessed Jehovah, and his people Israel.";
yng[8] = "And Hezekiah and the heads come in and see the heaps, and bless Jehovah and His people Israel,";
dby[8] = "And Hezekiah and the princes came and saw the heaps, and they blessed Jehovah, and his people Israel.";
web[8] = "And when Hezekiah and the princes came and saw the heaps, they blessed the LORD, and his people Israel.";
hnv[8] = "When Hizkiyahu and the princes came and saw the heaps, they blessed the LORD, and his people Yisra\'el.";
vul[8] = "cumque ingressi fuissent Ezechias et principes eius viderunt acervos et benedixerunt Domino ac populo Israhel";
kjv[9] = "Then Hezekiah questioned with the priests and the Levites concerning the heaps.";
rsv[9] = "And Hezeki\'ah questioned the priests and the Levites about the heaps.";
asv[9] = "Then Hezekiah questioned the priests and the Levites concerning the heaps.";
yng[9] = "and Hezekiah inquireth at the priests and the Levites concerning the heaps,";
dby[9] = "And Hezekiah questioned the priests and the Levites concerning the heaps.";
web[9] = "Then Hezekiah questioned with the priests and the Levites concerning the heaps.";
hnv[9] = "Then Hizkiyahu questioned the Kohanim and the Levites concerning the heaps.";
vul[9] = "interrogavitque Ezechias sacerdotes et Levitas cur ita iacerent acervi";
kjv[10] = "And Azariah the chief priest of the house of Zadok answered him, and said, Since [the people] began to bring the offerings into the house of the LORD, we have had enough to eat, and have left plenty: for the LORD hath blessed his people; and that which is left [is] this great store.";
rsv[10] = "Azari\'ah the chief priest, who was of the house of Zadok, answered him, &quot;Since they began to bring the contributions into the house of the LORD we have eaten and had enough and have plenty left; for the LORD has blessed his people, so that we have this great store left.&quot;";
asv[10] = "And Azariah the chief priest, of the house of Zadok, answered him and said, Since [the people] began to bring the oblations into the house of Jehovah, we have eaten and had enough, and have left plenty: for Jehovah hath blessed his people; and that which is left is this great store.";
yng[10] = "and Azariah the head priest, of the house of Zadok, speaketh unto him, and saith, `From the beginning of the bringing of the heave-offering to the house of Jehovah, [there is] to eat, and to be satisfied, and to leave abundantly, for Jehovah hath blessed His people, and that left [is] this store.\'";
dby[10] = "And Azariah the chief priest of the house of Zadok spoke to him and said, Since they began to bring the heave-offerings into the house of Jehovah, we have eaten and been satisfied and have left plenty; for Jehovah has blessed his people; and what is left is this great store.";
web[10] = "And Azariah the chief priest of the house of Zadok answered him, and said, Since [the people] began to bring the offerings into the house of the LORD, we have had enough to eat, and have left plenty: for the LORD hath blessed his people; and that which is left [is] this great abundance.";
hnv[10] = "`Azaryah the chief Kohen, of the house of Tzadok, answered him and said, Since [the people] began to bring the offerings into the house of the LORD, we have eaten and had enough, and have left plenty: for the LORD has blessed his people; and that which is left is this great store.";
vul[10] = "respondit illi Azarias sacerdos primus de stirpe Sadoc dicens ex quo coeperunt offerri primitiae in domo Domini comedimus et saturati sumus remanseruntque plurima eo quod benedixerit Dominus populo suo reliquiarum autem copia est ista quam cernis";
kjv[11] = "Then Hezekiah commanded to prepare chambers in the house of the LORD; and they prepared [them],";
rsv[11] = "Then Hezeki\'ah commanded them to prepare chambers in the house of the LORD; and they prepared them.";
asv[11] = "Then Hezekiah commanded to prepare chambers in the house of Jehovah; and they prepared them;";
yng[11] = "And Hezekiah saith to prepare chambers in the house of Jehovah, and they prepare,";
dby[11] = "And Hezekiah commanded to prepare chambers in the house of Jehovah; and they prepared [them],";
web[11] = "Then Hezekiah commanded to prepare chambers in the house of the LORD; and they prepared [them],";
hnv[11] = " Then Hizkiyahu commanded to prepare chambers in the house of the LORD; and they prepared them.";
vul[11] = "praecepit igitur Ezechias ut praepararent horrea in domo Domini quod cum fecissent";
kjv[12] = "And brought in the offerings and the tithes and the dedicated [things] faithfully: over which Cononiah the Levite [was] ruler, and Shimei his brother [was] the next.";
rsv[12] = "And they faithfully brought in the contributions, the tithes and the dedicated things. The chief officer in charge of them was Conani\'ah the Levite, with Shim\'e-i his brother as second;";
asv[12] = "and they brought in the oblations and the tithes and the dedicated things faithfully. And over them Conaniah the Levite was ruler, and Shimei his brother was second;";
yng[12] = "and they bring in the heave-offering, and the tithe, and the holy things faithfully; and over them is a leader, Conaniah the Levite, and Shimei his brother [is] second;";
dby[12] = "and brought in the heave-offerings and the tithes and the dedicated things faithfully; and over these Cononiah the Levite was ruler, and Shimei his brother was second.";
web[12] = "And brought in the offerings and the tithes, and the dedicated [things] faithfully: over which Conaniah the Levite [was] ruler, and Shimei his brother [was] the next.";
hnv[12] = "They brought in the offerings and the tithes and the dedicated things faithfully: and over them Kananyahu the Levite was ruler, and Shim`i his brother was second.";
vul[12] = "intulerunt tam primitias quam decimas et quaecumque voverant fideliter fuit autem praefectus eorum Chonenias Levita et Semei frater eius secundus";
kjv[13] = "And Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Ismachiah, and Mahath, and Benaiah, [were] overseers under the hand of Cononiah and Shimei his brother, at the commandment of Hezekiah the king, and Azariah the ruler of the house of God.";
rsv[13] = "while Jehi\'el, Azazi\'ah, Nahath, As\'ahel, Jer\'imoth, Jo\'zabad, Eli\'el, Ismachi\'ah, Mahath, and Benai\'ah were overseers assisting Conani\'ah and Shim\'e-i his brother, by the appointment of Hezeki\'ah the king and Azari\'ah the chief officer of the house of God.";
asv[13] = "and Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Ismachiah, and Mahath, and Benaiah, were overseers under the hand of Conaniah and Shimei his brother, by the appointment of Hezekiah the king, and Azariah the ruler of the house of God.";
yng[13] = "and Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Ismachiah, and Mahath, and Benaiah, [are] inspectors under the hand of Conaniah and Shimei his brother, by the appointment of Hezekiah the king, and Azariah leader of the house of God.";
dby[13] = "And Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Jismachiah, and Mahath, and Benaiah were overseers under the hand of Cononiah and Shimei his brother, at the command of Hezekiah the king and Azariah the ruler of the house of God.";
web[13] = "And Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Ismachiah, and Mahath, and Benaiah, [were] overseers under the hand of Conaniah and Shimei his brother, at the commandment of Hezekiah the king, and Azariah the ruler of the house of God.";
hnv[13] = "Yechi\'el, and `Azazyahu, and Nachat, and `Asa\'el, and Yerimot, and Yozavad, and Eli\'el, and Yismakhyahu, and Machat, and Benayah, were overseers under the hand of Kananyahu and Shim`i his brother, by the appointment of Hizkiyahu the king, and `Azaryah the ruler of the house of God.";
vul[13] = "post quem Ieihel et Azazias et Naath et Asahel et Ierimoth Iozabath quoque et Helihel et Iesmachias et Maath et Banaias praepositi sub manibus Choneniae et Semei fratris eius ex imperio Ezechiae regis et Azariae pontificis domus Domini ad quos omnia pertinebant";
kjv[14] = "And Kore the son of Imnah the Levite, the porter toward the east, [was] over the freewill offerings of God, to distribute the oblations of the LORD, and the most holy things.";
rsv[14] = "And Ko\'re the son of Imnah the Levite, keeper of the east gate, was over the freewill offerings to God, to apportion the contribution reserved for the LORD and the most holy offerings.";
asv[14] = "And Kore the son of Imnah the Levite, the porter at the east [gate], was over the freewill-offerings of God, to distribute the oblations of Jehovah, and the most holy things.";
yng[14] = "And Kore son of Imnah the Levite, the gatekeeper at the east, [is] over the willing-offerings of God, to give the heave-offering of Jehovah, and the most holy things.";
dby[14] = "And Kore the son of Jimnah the Levite, the doorkeeper toward the east, was over the voluntary-offerings of God, to distribute the heave-offerings of Jehovah, and the most holy things.";
web[14] = "And Kore the son of Imnah the Levite, the porter towards the east, [was] over the free-will-offerings of God, to distribute the oblations of the LORD, and the most holy things.";
hnv[14] = " Kore the son of Yimna the Levite, the porter at the east [gate], was over the freewill-offerings of God, to distribute the offerings of the LORD, and the most holy things.";
vul[14] = "Core vero filius Iemna Levites et ianitor orientalis portae praepositus erat his quae sponte offerebantur Domino primitiisque et consecratis in sancta sanctorum";
kjv[15] = "And next him [were] Eden, and Miniamin, and Jeshua, and Shemaiah, Amariah, and Shecaniah, in the cities of the priests, in [their] set office, to give to their brethren by courses, as well to the great as to the small:";
rsv[15] = "Eden, Mini\'amin, Jeshua, Shemai\'ah, Amari\'ah, and Shecani\'ah were faithfully assisting him in the cities of the priests, to distribute the portions to their brethren, old and young alike, by divisions,";
asv[15] = "And under him were Eden, and Miniamin, and Jeshua, and Shemaiah, Amariah, and Shecaniah, in the cities of the priests, in their office of trust, to give to their brethren by courses, as well to the great as to the small:";
yng[15] = "And by his hand [are] Eden, and Miniamin, and Jeshua, and Shemaiah, Amariah, and Shechaniah, in cities of the priests, faithfully to give to their brethren in courses, as the great so the small,";
dby[15] = "And under him were Eden and Miniamin and Jeshua and Shemaiah, Amariah and Shecaniah, in the cities of the priests, in [their] set trust, to make distributions to their brethren by [their] divisions, to the great as to the small,";
web[15] = "And next him [were] Eden, and Miniamin, and Jeshua, and Shemaiah, Amariah, and Shecaniah, in the cities of the priests, in [their] set office, to give to their brethren by courses, as well to the great as to the small:";
hnv[15] = "Under him were `Eden, and Minyamin, and Yeshua, and Shemayah, Amaryah, and Shekhanyahu, in the cities of the Kohanim, in their office of trust, to give to their brothers by courses, as well to the great as to the small:";
vul[15] = "et sub cura eius Eden et Meniamin Hiesue et Sameias Amarias quoque et Sechenias in civitatibus sacerdotum ut fideliter distribuerent fratribus suis partes minoribus atque maioribus";
kjv[16] = "Beside their genealogy of males, from three years old and upward, [even] unto every one that entereth into the house of the LORD, his daily portion for their service in their charges according to their courses;";
rsv[16] = "except those enrolled by genealogy, males from three years old and upwards, all who entered the house of the LORD as the duty of each day required, for their service according to their offices, by their divisions.";
asv[16] = "besides them that were reckoned by genealogy of males, from three years old and upward, even every one that entered into the house of Jehovah, as the duty of every day required, for their service in their offices according to their courses;";
yng[16] = "apart from their genealogy, to males from a son of three years and upward, to every one who hath gone in to the house of Jehovah, by the matter of a day in its day, for their service in their charges, according to their courses;";
dby[16] = "besides those from three years old and upward who as males were entered in the genealogical register, -- all that came into the house of Jehovah, as the duty of every day required, for their service in their charges, according to their divisions,";
web[16] = "Besides their genealogy of males, from three years old and upward, [even] to every one that entereth into the house of the LORD, his daily portion for their service in their charges according to their courses;";
hnv[16] = " besides those who were reckoned by genealogy of males, from three years old and upward, even everyone who entered into the house of the LORD, as the duty of every day required, for their service in their offices according to their courses;";
vul[16] = "exceptis maribus ab annis tribus et supra cunctis qui ingrediebantur templum Domini et quicquid per dies singulos conducebat in ministerio atque observationibus iuxta divisiones suas";
kjv[17] = "Both to the genealogy of the priests by the house of their fathers, and the Levites from twenty years old and upward, in their charges by their courses;";
rsv[17] = "The enrollment of the priests was according to their fathers\' houses; that of the Levites from twenty years old and upwards was according to their offices, by their divisions.";
asv[17] = "and them that were reckoned by genealogy of the priests by their fathers\' houses, and the Levites from twenty years old and upward, in their offices by their courses;";
yng[17] = "and the genealogy of the priests by the house of their fathers, and of the Levites, from a son of twenty years and upward, in their charges, in their courses;";
dby[17] = "-- both to the priests enregistered according to their fathers\' houses, and to the Levites from twenty years old and upward, in their charges, by their divisions;";
web[17] = "Both to the genealogy of the priests by the house of their fathers, and the Levites from twenty years old and upward, in their charges, by their courses;";
hnv[17] = "and those who were reckoned by genealogy of the Kohanim by their fathers\' houses, and the Levites from twenty years old and upward, in their offices by their courses;";
vul[17] = "sacerdotibus per familias et Levitis a vicesimo anno et supra per ordines et turmas suas";
kjv[18] = "And to the genealogy of all their little ones, their wives, and their sons, and their daughters, through all the congregation: for in their set office they sanctified themselves in holiness:";
rsv[18] = "The priests were enrolled with all their little children, their wives, their sons, and their daughters, the whole multitude; for they were faithful in keeping themselves holy.";
asv[18] = "and them that were reckoned by genealogy of all their little ones, their wives, and their sons, and their daughters, through all the congregation: for in their office of trust they sanctified themselves in holiness.";
yng[18] = "and to the genealogy among all their infants, their wives, and their sons, and their daughters to all the congregation, for in their faithfulness they sanctify themselves in holiness.";
dby[18] = "and to all their little ones, their wives, and their sons, and their daughters, the whole congregation of those entered in the register; for in their trust they hallowed themselves to be holy.";
web[18] = "And to the genealogy of all their little ones, their wives, and their sons, and their daughters, through all the congregation: for in their set office they sanctified themselves in holiness:";
hnv[18] = " and those who were reckoned by genealogy of all their little ones, their wives, and their sons, and their daughters, through all the congregation: for in their office of trust they sanctified themselves in holiness.";
vul[18] = "universaeque multitudini tam uxoribus quam liberis eorum utriusque sexus fideliter cibi de his quae sanctificata fuerant praebebantur";
kjv[19] = "Also of the sons of Aaron the priests, [which were] in the fields of the suburbs of their cities, in every several city, the men that were expressed by name, to give portions to all the males among the priests, and to all that were reckoned by genealogies among the Levites.";
rsv[19] = "And for the sons of Aaron, the priests, who were in the fields of common land belonging to their cities, there were men in the several cities who were designated by name to distribute portions to every male among the priests and to every one among the Levites who was enrolled.";
asv[19] = "Also for the sons of Aaron the priests, that were in the fields of the suburbs of their cities, in every city, there were men that were mentioned by name, to give portions to all the males among the priests, and to all that were reckoned by genealogy among the Levites.";
yng[19] = "And to sons of Aaron, the priests, in the fields of the suburb of their cities, in every city and city, [are] men who have been defined by name, to give portions to every male among the priests, and to every one who reckoned himself by genealogy among the Levites.";
dby[19] = "And for the sons of Aaron the priests who were in the country, in the suburbs of their cities, there were, in every several city, men expressed by name, to give portions to all the males among the priests, and to all the Levites that were entered in the register.";
web[19] = "Also of the sons of Aaron the priests, [who were] in the fields of the suburbs of their cities, in every several city, the men that were expressed by name, to give portions to all the males among the priests, and to all that were reckoned by genealogies among the Levites.";
hnv[19] = "Also for the sons of Aharon the Kohanim, who were in the fields of the suburbs of their cities, in every city, there were men who were mentioned by name, to give portions to all the males among the Kohanim, and to all who were reckoned by genealogy among the Levites.";
vul[19] = "sed et filiorum Aaron per agros et suburbana urbium singularum dispositi erant viri qui partes distribuerent universo sexui masculino de sacerdotibus et Levitis";
kjv[20] = "And thus did Hezekiah throughout all Judah, and wrought [that which was] good and right and truth before the LORD his God.";
rsv[20] = "Thus Hezeki\'ah did throughout all Judah; and he did what was good and right and faithful before the LORD his God.";
asv[20] = "And thus did Hezekiah throughout all Judah; and he wrought that which was good and right and faithful before Jehovah his God.";
yng[20] = "And Hezekiah doth thus in all Judah, and doth that which is good, and that which is right, and that which is true, before Jehovah his God;";
dby[20] = "And thus did Hezekiah throughout Judah, and wrought what was good and right and true before Jehovah his God.";
web[20] = "And thus did Hezekiah throughout all Judah, and performed [that which was] good and right and truth before the LORD his God.";
hnv[20] = "Thus did Hizkiyahu throughout all Yehudah; and he worked that which was good and right and faithful before the LORD his God.";
vul[20] = "fecit ergo Ezechias universa quae diximus in omni Iuda operatusque est bonum et rectum et verum coram Domino Deo suo";
kjv[21] = "And in every work that he began in the service of the house of God, and in the law, and in the commandments, to seek his God, he did [it] with all his heart, and prospered.";
rsv[21] = "And every work that he undertook in the service of the house of God and in accordance with the law and the commandments, seeking his God, he did with all his heart, and prospered.";
asv[21] = "And in every work that he began in the service of the house of God, and in the law, and in the commandments, to seek his God, he did it with all his heart, and prospered.";
yng[21] = "and in every work that he hath begun for the service of the house of God, and for the law, and for the command, to seek to his God, with all his heart he hath wrought and prospered.";
dby[21] = "And in every work that he undertook in the service of the house of God, and in the law, and in the commandments, to seek his God, he did it with all his heart and prospered.";
web[21] = "And in every work that he began in the service of the house of God, and in the law, and in the commandments, to seek his God, he did [it] with all his heart, and prospered.";
hnv[21] = "In every work that he began in the service of the house of God, and in the law, and in the mitzvot, to seek his God, he did it with all his heart, and prospered.";
vul[21] = "in universa cultura ministerii domus Domini iuxta legem et caerimonias volens requirere Deum suum in toto corde suo fecitque et prosperatus est";
