csb[1] = "The queen of Sheba heard of Solomon\'s fame, so she came to test Solomon with difficult questions at Jerusalem with a very large entourage, with camels bearing spices, gold in abundance, and precious stones. She came to Solomon and spoke with him about everything that was on her mind.";
csb[2] = "So Solomon answered all her questions; nothing was too difficult for Solomon to explain to her.";
csb[3] = "When the queen of Sheba observed Solomon\'s wisdom, the palace he had built,";
csb[4] = "the food at his table, his servants\' residence, his attendants\' service and their attire, his cupbearers and their attire, and the burnt offerings he offered at the LORD\'s temple, it took her breath away.";
csb[5] = "She said to the king, &quot;The report I heard in my own country about your words and about your wisdom is true.";
csb[6] = "&quot;But I didn\'t believe their reports until I came and saw with my own eyes. Indeed, I was not even told half of your great wisdom! You far exceed the report I heard.";
csb[7] = "&quot;How happy are your men. How happy are these servants of yours, who always stand in your presence hearing your wisdom.";
csb[8] = "&quot;Blessed be the LORD your God! He delighted in you and put you on his throne as king for the LORD your God. Because your God loved Israel enough to establish them forever, he has set you over them as king to carry out justice and righteousness.&quot;";
csb[9] = "Then she gave the king four and a half tons of gold, a great quantity of spices, and precious stones. There never were such spices as those the queen of Sheba gave to King Solomon.";
csb[10] = "In addition, Hiram\'s servants and Solomon\'s servants who brought gold from Ophir also brought algum wood and precious stones.";
csb[11] = "The king made the algum wood into walkways for the LORD\'s temple and for the king\'s palace and into lyres and harps for the singers. Never before had anything like them been seen in the land of Judah.";
csb[12] = "King Solomon gave the queen of Sheba her every desire, whatever she asked -- far more than she had brought the king. Then she, along with her servants, returned to her own country.";
csb[13] = "The weight of gold that came to Solomon annually was twenty-five tons,";
csb[14] = "besides what was brought by the merchants and traders. All the Arabian kings and governors of the land also brought gold and silver to Solomon.";
csb[15] = "King Solomon made two hundred large shields of hammered gold; 15 pounds of hammered gold went into each shield.";
csb[16] = "He made three hundred small shields of hammered gold; 7 1/2 pounds of gold went into each shield. The king put them in the House of the Forest of Lebanon.";
csb[17] = "The king also made a large ivory throne and overlaid it with pure gold.";
csb[18] = "The throne had six steps; there was a footstool covered in gold for the throne, armrests on either side of the seat, and two lions standing beside the armrests.";
csb[19] = "Twelve lions were standing there on the six steps, one at each end. Nothing like it had ever been made in any other kingdom.";
csb[20] = "All of King Solomon\'s drinking cups were gold, and all the utensils of the House of the Forest of Lebanon were pure gold. There was no silver, since it was considered as nothing in Solomon\'s time,";
csb[21] = "for the king\'s ships kept going to Tarshish with Hiram\'s servants, and once every three years the ships of Tarshish would arrive bearing gold, silver, ivory, apes, and peacocks.";
csb[22] = "King Solomon surpassed all the kings of the world in riches and wisdom.";
csb[23] = "All the kings of the world wanted an audience with Solomon to hear the wisdom God had put in his heart.";
csb[24] = "Each of them would bring his own gift -- items of silver and gold, clothing, weapons, spices, and horses and mules -- as an annual tribute.";
csb[25] = "Solomon had four thousand stalls for horses and chariots, and twelve thousand horsemen. He stationed them in the chariot cities and with the king in Jerusalem.";
csb[26] = "He ruled over all the kings from the Euphrates River to the land of the Philistines and as far as the border of Egypt.";
csb[27] = "The king made silver as common in Jerusalem as stones, and he made cedar as abundant as sycamore in the Judean foothills.";
csb[28] = "They were bringing horses for Solomon from Egypt and from all the countries.";
csb[29] = "The remaining events of Solomon\'s reign, from beginning to end, are written in the Events of the Prophet Nathan, the Prophecy of Ahijah the Shilonite, and the Visions of the Seer Iddo concerning Jeroboam son of Nebat.";
csb[30] = "Solomon reigned in Jerusalem over all Israel for forty years.";
csb[31] = "Solomon rested with his fathers and was buried in the city of his father David. His son Rehoboam became king in his place.";
kjv[1] = "And when the queen of Sheba heard of the fame of Solomon, she came to prove Solomon with hard questions at Jerusalem, with a very great company, and camels that bare spices, and gold in abundance, and precious stones: and when she was come to Solomon, she communed with him of all that was in her heart.";

hnv[1] = "When the queen of Sheva heard of the fame of Shlomo, she came to prove Shlomo with hard questions at Yerushalayim, with a very great train, and camels that bore spices, and gold in abundance, and precious stones: and when she was come to Shlomo, she talked with him of all that was in her heart.";

rsv[19] = "while twelve lions stood there, one on each end of a step on the six steps. The like of it was never made in any kingdom.";

yng[19] = "and twelve lions are standing there on the six steps on this [side], and on that: it hath not been made so for any kingdom.";
dby[19] = "and twelve lions stood there on the one side and on the other upon the six steps: there was not the like made in any kingdom.";

hnv[19] = "Twelve lions stood there on the one side and on the other on the six steps: there was nothing like it made in any kingdom.";
vul[19] = "sed et alios duodecim leunculos stantes super sex gradus ex utraque parte non fuit tale solium in universis regnis";
kjv[20] = "And all the drinking vessels of king Solomon [were of] gold, and all the vessels of the house of the forest of Lebanon [were of] pure gold: none [were of] silver; it was [not] any thing accounted of in the days of Solomon.";

asv[20] = "And all king Solomon\'s drinking vessels were of gold, and all the vessels of the house of the forest of Lebanon were of pure gold: silver was nothing accounted of in the days of Solomon.";
yng[20] = "And all the drinking vessels of king Solomon [are] of gold, and all the vessels of the house of the forest of Lebanon [are] of refined gold -- silver is not reckoned in the days of Solomon for anything;";
dby[20] = "And all king Solomon\'s drinking vessels were of gold, and all the vessels of the house of the forest of Lebanon were of precious gold: silver was not of the least account in the days of Solomon.";
web[20] = "And all the drinking vessels of king Solomon [were of] gold, and all the vessels of the house of the forest of Lebanon [were of] pure gold: none [were of] silver; it was [not] any thing accounted of in the days of Solomon.";
hnv[20] = " All king Shlomo\'s drinking vessels were of gold, and all the vessels of the house of the forest of Levanon were of pure gold: silver was nothing accounted of in the days of Shlomo.";
vul[20] = "omnia quoque vasa convivii regis erant aurea et vasa domus saltus Libani ex auro purissimo argentum enim in diebus illis pro nihilo reputabatur";

dby[21] = "For the king\'s ships went to Tarshish with the servants of Huram: once in three years came the ships of Tarshish, bringing gold and silver, ivory, and apes, and peacocks.";

rsv[22] = "Thus King Solomon excelled all the kings of the earth in riches and in wisdom.";
asv[22] = "So king Solomon exceeded all the kings of the earth in riches and wisdom.";
yng[22] = "And king Solomon becometh greater than any of the kings of the earth for riches and wisdom;";
dby[22] = "And king Solomon was greater than all the kings of the earth in riches and wisdom.";
web[22] = "And king Solomon surpassed all the kings of the earth in riches and wisdom.";
hnv[22] = "So king Shlomo exceeded all the kings of the eretz in riches and wisdom.";
vul[22] = "magnificatus est igitur Salomon super omnes reges terrae divitiis et gloria";
kjv[23] = "And all the kings of the earth sought the presence of Solomon, to hear his wisdom, that God had put in his heart.";

yng[23] = "and all the kings of the earth are seeking the presence of Solomon to hear his wisdom that God hath put in his heart,";
dby[23] = "And all the kings of the earth sought the presence of Solomon, to hear his wisdom, which God had put in his heart.";
web[23] = "And all the kings of the earth sought the presence of Solomon, to hear his wisdom, that God had put in his heart.";
hnv[23] = "All the kings of the eretz sought the presence of Shlomo, to hear his wisdom, which God had put in his heart.";

hnv[26] = "He ruled over all the kings from the River even to the land of the Pelishtim, and to the border of Mitzrayim.";

kjv[29] = "Now the rest of the acts of Solomon, first and last, [are] they not written in the book of Nathan the prophet, and in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer against Jeroboam the son of Nebat?";

asv[29] = "Now the rest of the acts of Solomon, first and last, are they not written in the history of Nathan the prophet, and in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer concerning Jeroboam the son of Nebat?";
yng[29] = "And the rest of the matters of Solomon, the first and the last, are they not written beside the matters of Nathan the prophet, and beside the prophecy of Ahijah the Shilonite, and with the visions of Iddo the seer concerning Jeroboam son of Nebat?";
dby[29] = "And the rest of the acts of Solomon first and last, are they not written in the words of Nathan the prophet, and in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer concerning Jeroboam the son of Nebat?";
web[29] = "Now the rest of the acts of Solomon, first and last, [are] they not written in the book of Nathan the prophet, and in the prophecy of Ahijah the Shilonite, and in the visions of Iddo the seer against Jeroboam the son of Nebat?";
hnv[29] = "Now the rest of the acts of Shlomo, first and last, aren\'t they written in the history of Natan the prophet, and in the prophecy of Achiyah the Shiloni, and in the visions of `Iddo the seer concerning Yarov`am the son of Nevat?";
