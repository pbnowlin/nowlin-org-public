csb[1] = "Amaziah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother\'s name was Jehoaddan; she was from Jerusalem.";
csb[2] = "He did what was right in the LORD\'s sight but not wholeheartedly.";
csb[3] = "As soon as the kingdom was firmly in his grasp, he executed his servants who had killed his father the king.";
csb[4] = "However, he did not put their children to death, because -- as it is written in the Law, in the book of Moses, where the LORD commanded -- &quot;Fathers are not to die because of children, and children are not to die because of fathers, but each one will die for his own sin.&quot;";
csb[5] = "Then Amaziah gathered Judah and assembled them according to ancestral families, according to commanders of thousands, and according to commanders of hundreds. He numbered those twenty years old or more for all Judah and Benjamin. He found there to be three hundred thousand fit young men who could serve in the army, bearing spear and shield.";
csb[6] = "Then for 7,500 pounds of silver he hired one hundred thousand valiant warriors from Israel.";
csb[7] = "However, a man of God came to him and said, &quot;King, do not let Israel\'s army go with you, for the LORD is not with Israel -- all the Ephraimites.";
csb[8] = "&quot;But if you go with them, do it! Be strong for battle! But God will make you stumble before the enemy, for God has the power to help or to make one stumble.&quot;";
csb[9] = "Then Amaziah said to the man of God, &quot;What should I do about the 7,500 pounds of silver I gave to Israel\'s division? &quot; The man of God replied, &quot;The LORD is able to give you much more than this.&quot;";
csb[10] = "So Amaziah released the division that came to him from Ephraim to go home. But they got very angry with Judah and returned home in a fierce rage.";
csb[11] = "Amaziah strengthened his position and led his people to the Salt Valley. He struck down ten thousand Seirites,";
csb[12] = "and the Judahites captured ten thousand alive. They took them to the top of a cliff where they threw them off, and all of them were dashed to pieces.";
csb[13] = "As for the men of the division that Amaziah sent back so they would not go with him into battle, they raided the cities of Judah from Samaria to Beth-horon, struck down three thousand of their people, and took a great deal of plunder.";
csb[14] = "After Amaziah came from the attack on the Edomites, he brought the gods of the Seirites and set them up as his gods. He worshiped before them and burned incense to them.";
csb[15] = "So the LORD\'s anger was against Amaziah, and he sent a prophet to him, who said, &quot;Why have you sought a people\'s gods that could not rescue their own people from you? &quot;";
csb[16] = "While he was still speaking to him, the king asked, &quot;Have we made you the king\'s counselor? Stop, why should you lose your life? &quot; So the prophet stopped, but he said, &quot;I know that God intends to destroy you, because you have done this and have not listened to my advice.&quot;";
csb[17] = "King Amaziah of Judah took counsel and sent word to Jehoash son of Jehoahaz, son of Jehu, king of Israel, and challenged him: &quot;Come, let\'s meet face to face.&quot;";
csb[18] = "King Jehoash of Israel sent word to King Amaziah of Judah, saying, &quot;The thistle in Lebanon sent a message to the cedar in Lebanon, saying, \'Give your daughter to my son as a wife.\' Then a wild animal in Lebanon passed by and trampled the thistle.";
csb[19] = "&quot;You have said, \'Look, I have defeated Edom,\' and you have become overconfident that you will get glory. Now stay at home. Why stir up such trouble so that you fall and Judah with you? &quot;";
csb[20] = "But Amaziah would not listen, for this turn of events was from God in order to hand them over to their enemies because they went after the gods of Edom.";
csb[21] = "So King Jehoash of Israel advanced. He and King Amaziah of Judah met face to face at Beth-shemesh that belonged to Judah.";
csb[22] = "Judah was routed before Israel, and each man fled to his own tent.";
csb[23] = "King Jehoash of Israel captured Judah\'s King Amaziah son of Joash, son of Jehoahaz, at Beth-shemesh. Then Jehoash took him to Jerusalem and broke down two hundred yards of Jerusalem\'s wall from the Ephraim Gate to the Corner Gate.";
csb[24] = "He took all the gold, silver, all the utensils that were found with Obed-edom in God\'s temple, the treasures of the king\'s palace, and the hostages. Then he returned to Samaria.";
csb[25] = "Judah\'s King Amaziah son of Joash lived fifteen years after the death of Israel\'s King Jehoash son of Jehoahaz.";
csb[26] = "The rest of the events of Amaziah\'s reign, from beginning to end, are written in the Book of the Kings of Judah and Israel.";
csb[27] = "From the time Amaziah turned from following the LORD, a conspiracy was formed against him in Jerusalem, and he fled to Lachish. However, men were sent after him to Lachish, and they put him to death there.";
csb[28] = "They carried him back on horses and buried him with his fathers in the city of Judah.";
kjv[1] = "Amaziah [was] twenty and five years old [when] he began to reign, and he reigned twenty and nine years in Jerusalem. And his mother\'s name [was] Jehoaddan of Jerusalem.";
kjv[2] = "And he did [that which was] right in the sight of the LORD, but not with a perfect heart.";
kjv[3] = "Now it came to pass, when the kingdom was established to him, that he slew his servants that had killed the king his father.";
kjv[4] = "But he slew not their children, but [did] as [it is] written in the law in the book of Moses, where the LORD commanded, saying, The fathers shall not die for the children, neither shall the children die for the fathers, but every man shall die for his own sin.";
kjv[5] = "Moreover Amaziah gathered Judah together, and made them captains over thousands, and captains over hundreds, according to the houses of [their] fathers, throughout all Judah and Benjamin: and he numbered them from twenty years old and above, and found them three hundred thousand choice [men, able] to go forth to war, that could handle spear and shield.";
kjv[6] = "He hired also an hundred thousand mighty men of valour out of Israel for an hundred talents of silver.";
kjv[7] = "But there came a man of God to him, saying, O king, let not the army of Israel go with thee; for the LORD [is] not with Israel, [to wit, with] all the children of Ephraim.";
kjv[8] = "But if thou wilt go, do [it], be strong for the battle: God shall make thee fall before the enemy: for God hath power to help, and to cast down.";
kjv[9] = "And Amaziah said to the man of God, But what shall we do for the hundred talents which I have given to the army of Israel? And the man of God answered, The LORD is able to give thee much more than this.";
kjv[10] = "Then Amaziah separated them, [to wit], the army that was come to him out of Ephraim, to go home again: wherefore their anger was greatly kindled against Judah, and they returned home in great anger.";
kjv[11] = "And Amaziah strengthened himself, and led forth his people, and went to the valley of salt, and smote of the children of Seir ten thousand.";
kjv[12] = "And [other] ten thousand [left] alive did the children of Judah carry away captive, and brought them unto the top of the rock, and cast them down from the top of the rock, that they all were broken in pieces.";
kjv[13] = "But the soldiers of the army which Amaziah sent back, that they should not go with him to battle, fell upon the cities of Judah, from Samaria even unto Bethhoron, and smote three thousand of them, and took much spoil.";
kjv[14] = "Now it came to pass, after that Amaziah was come from the slaughter of the Edomites, that he brought the gods of the children of Seir, and set them up [to be] his gods, and bowed down himself before them, and burned incense unto them.";
kjv[15] = "Wherefore the anger of the LORD was kindled against Amaziah, and he sent unto him a prophet, which said unto him, Why hast thou sought after the gods of the people, which could not deliver their own people out of thine hand?";
kjv[16] = "And it came to pass, as he talked with him, that [the king] said unto him, Art thou made of the king\'s counsel? forbear; why shouldest thou be smitten? Then the prophet forbare, and said, I know that God hath determined to destroy thee, because thou hast done this, and hast not hearkened unto my counsel.";
kjv[17] = "Then Amaziah king of Judah took advice, and sent to Joash, the son of Jehoahaz, the son of Jehu, king of Israel, saying, Come, let us see one another in the face.";
kjv[18] = "And Joash king of Israel sent to Amaziah king of Judah, saying, The thistle that [was] in Lebanon sent to the cedar that [was] in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that [was] in Lebanon, and trode down the thistle.";
kjv[19] = "Thou sayest, Lo, thou hast smitten the Edomites; and thine heart lifteth thee up to boast: abide now at home; why shouldest thou meddle to [thine] hurt, that thou shouldest fall, [even] thou, and Judah with thee?";
kjv[20] = "But Amaziah would not hear; for it [came] of God, that he might deliver them into the hand [of their enemies], because they sought after the gods of Edom.";
kjv[21] = "So Joash the king of Israel went up; and they saw one another in the face, [both] he and Amaziah king of Judah, at Bethshemesh, which [belongeth] to Judah.";
kjv[22] = "And Judah was put to the worse before Israel, and they fled every man to his tent.";
kjv[23] = "And Joash the king of Israel took Amaziah king of Judah, the son of Joash, the son of Jehoahaz, at Bethshemesh, and brought him to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim to the corner gate, four hundred cubits.";
kjv[24] = "And [he took] all the gold and the silver, and all the vessels that were found in the house of God with Obededom, and the treasures of the king\'s house, the hostages also, and returned to Samaria.";
kjv[25] = "And Amaziah the son of Joash king of Judah lived after the death of Joash son of Jehoahaz king of Israel fifteen years.";
kjv[26] = "Now the rest of the acts of Amaziah, first and last, behold, [are] they not written in the book of the kings of Judah and Israel?";
kjv[27] = "Now after the time that Amaziah did turn away from following the LORD they made a conspiracy against him in Jerusalem; and he fled to Lachish: but they sent to Lachish after him, and slew him there.";
kjv[28] = "And they brought him upon horses, and buried him with his fathers in the city of Judah.";

rsv[4] = "But he did not put their children to death, according to what is written in the law, in the book of Moses, where the LORD commanded, &quot;The fathers shall not be put to death for the children, or the children be put to death for the fathers; but every man shall die for his own sin.&quot;";
asv[4] = "But he put not their children to death, but did according to that which is written in the law in the book of Moses, as Jehovah commanded, saying, The fathers shall not die for the children, neither shall the children die for the fathers; but every man shall die for his own sin.";
yng[4] = "and their sons he hath not put to death, but [did] as is written in the law, in the book of Moses, whom Jehovah commanded, saying, `Fathers do not die for sons, and sons die not for fathers, but each for his own sin they die.\'";
dby[4] = "But their children he did not put to death, but [did] according to that which is written in the law in the book of Moses, wherein Jehovah commanded saying, The fathers shall not die for the children, nor shall the children die for the fathers, but every man shall die for his own sin.";

hnv[4] = "But he didn\'t put their children to death, but did according to that which is written in the law in the book of Moshe, as the LORD commanded, saying, The fathers shall not die for the children, neither shall the children die for the fathers; but every man shall die for his own sin.";

rsv[5] = "Then Amazi\'ah assembled the men of Judah, and set them by fathers\' houses under commanders of thousands and of hundreds for all Judah and Benjamin. He mustered those twenty years old and upward, and found that they were three hundred thousand picked men, fit for war, able to handle spear and shield.";
asv[5] = "Moreover Amaziah gathered Judah together, and ordered them according to their fathers\' houses, under captains of thousands and captains of hundreds, even all Judah and Benjamin: and he numbered them from twenty years old and upward, and found them three hundred thousand chosen men, able to go forth to war, that could handle spear and shield.";
yng[5] = "And Amaziah gathereth Judah, and appointeth them, according to the house of the fathers, for heads of the thousands, and for heads of the hundreds, for all Judah and Benjamin; and he inspecteth them from a son of twenty years and upward, and findeth them three hundred thousand chosen ones, going forth to the host, holding spear and target.";
dby[5] = "And Amaziah gathered Judah together and arranged them according to the fathers\' houses, according to the captains of thousands and the captains of hundreds, throughout Judah and Benjamin; and he numbered them from twenty years old and upwards, and found them three hundred thousand choice men, able for military service, that could handle spear and target.";
web[5] = "Moreover, Amaziah assembled Judah, and made them captains over thousands, and captains over hundreds, according to the houses of [their] fathers, throughout all Judah and Benjamin: and he numbered them from twenty years old and above, and found them three hundred thousand choice [men], [able] to go forth to war, that could handle spear and shield.";
hnv[5] = " Moreover Amatzyah gathered Yehudah together, and ordered them according to their fathers\' houses, under captains of thousands and captains of hundreds, even all Yehudah and Binyamin: and he numbered them from twenty years old and upward, and found them three hundred thousand chosen men, able to go forth to war, who could handle spear and shield.";

rsv[14] = "After Amazi\'ah came from the slaughter of the E\'domites, he brought the gods of the men of Se\'ir, and set them up as his gods, and worshiped them, making offerings to them.";
asv[14] = "Now it came to pass, after that Amaziah was come from the slaughter of the Edomites, that he brought the gods of the children of Seir, and set them up to be his gods, and bowed down himself before them, and burned incense unto them.";
yng[14] = "And it cometh to pass, after the coming in of Amaziah from smiting the Edomites, that he bringeth in the gods of the sons of Seir, and establisheth them to him for gods, and before them doth bow himself, and to them he maketh perfume.";
dby[14] = "And it came to pass after Amaziah was come from the slaughter of the Edomites, that he brought the gods of the children of Seir, and set them up to be his gods, and bowed himself down before them, and burned incense to them.";
web[14] = "Now it came to pass, after that Amaziah had come from the slaughter of the Edomites, that he brought the gods of the children of Seir, and set them up [to be] his gods, and bowed himself before them, and burned incense to them.";
hnv[14] = "Now it happened, after that Amatzyah was come from the slaughter of the Edom, that he brought the gods of the children of Se`ir, and set them up to be his gods, and bowed down himself before them, and burned incense to them.";
vul[14] = "Amasias vero post caedem Idumeorum et adlatos deos filiorum Seir statuit illos in deos sibi et adorabat eos et illis adolebat incensum";
rsv[15] = "Therefore the LORD was angry with Amazi\'ah and sent to him a prophet, who said to him, &quot;Why have you resorted to the gods of a people, which did not deliver their own people from your hand?&quot;";
asv[15] = "Wherefore the anger of Jehovah was kindled against Amaziah, and he sent unto him a prophet, who said unto him, Why hast thou sought after the gods of the people, which have not delivered their own people out of thy hand?";
yng[15] = "And the anger of Jehovah burneth against Amaziah, and He sendeth unto him a prophet, and he saith unto him, `Why hast thou sought the gods of the people that have not delivered their people out of thy hand?\'";
dby[15] = "And the anger of Jehovah was kindled against Amaziah, and he sent to him a prophet, who said to him, Why dost thou seek after the gods of a people who have not delivered their own people out of thy hand?";
web[15] = "Wherefore the anger of the LORD was kindled against Amaziah, and he sent to him a prophet, who said to him, Why hast thou sought after the gods of the people, which could not deliver their own people out of thy hand?";
hnv[15] = " Therefore the anger of the LORD was kindled against Amatzyah, and he sent to him a prophet, who said to him, Why have you sought after the gods of the people, which have not delivered their own people out of your hand?";
vul[15] = "quam ob rem iratus Dominus contra Amasiam misit ad illum prophetam qui diceret ei cur adorasti deos qui non liberaverunt populum suum de manu tua";
rsv[16] = "But as he was speaking the king said to him, &quot;Have we made you a royal counselor? Stop! Why should you be put to death?&quot; So the prophet stopped, but said, &quot;I know that God has determined to destroy you, because you have done this and have not listened to my counsel.&quot;";
asv[16] = "And it came to pass, as he talked with him, that [the king] said unto him, Have we made thee of the king\'s counsel? forbear; why shouldest thou be smitten? Then the prophet forbare, and said, I know that God hath determined to destroy thee, because thou hast done this, and hast not hearkened unto my counsel.";
yng[16] = "And it cometh to pass, in his speaking unto him, that he saith to him, `For a counsellor to the king have we appointed thee? cease for thee; why do they smite thee?\' And the prophet ceaseth, and saith, `I have known that God hath counselled to destroy thee, because thou hast done this, and hast not hearkened to my counsel.\'";
dby[16] = "And it came to pass as he talked with him, that [Amaziah] said to him, Hast thou been made the king\'s counsellor? Forbear; why shouldest thou be smitten? Then the prophet forbore, and said, I know that God has determined to destroy thee, because thou hast done this, and hast not hearkened to my counsel.";
web[16] = "And it came to pass, as he talked with him, that [the king] said to him, Art thou made of the king\'s council? forbear? why shouldst thou be smitten? Then the prophet forbore, and said, I know that God hath determined to destroy thee, because thou hast done this, and hast not hearkened to my counsel.";
hnv[16] = "It happened, as he talked with him, that [the king] said to him, Have we made you of the king\'s counsel? Stop! Why should you be struck down? Then the prophet stopped, and said, I know that God has determined to destroy you, because you have done this, and have not listened to my counsel.";
vul[16] = "cumque haec ille loqueretur respondit ei num consiliarius regis es quiesce ne interficiam te discedensque propheta scio inquit quod cogitaverit Dominus occidere te qui et fecisti hoc malum et insuper non adquievisti consilio meo";
rsv[17] = "Then Amazi\'ah king of Judah took counsel and sent to Jo\'ash the son of Jeho\'ahaz, son of Jehu, king of Israel, saying, &quot;Come, let us look one another in the face.&quot;";
asv[17] = "Then Amaziah king of Judah took advice, and sent to Joash, the son of Jehoahaz the son of Jehu, king of Israel, saying, Come, let us look one another in the face.";
yng[17] = "And Amaziah king of Judah taketh counsel, and sendeth unto Joash son of Jehoahaz, son of Jehu, king of Israel, saying,";
dby[17] = "And Amaziah king of Judah took counsel, and sent to Joash the son of Jehoahaz, the son of Jehu, king of Israel, saying, Come, let us look one another in the face.";
web[17] = "Then Amaziah king of Judah took advice, and sent to Joash, the son of Jehoahaz, the son of Jehu, king of Israel, saying, Come, let us see one another in the face.";
hnv[17] = "Then Amatzyah king of Yehudah took advice, and sent to Yo\'ash, the son of Yeho\'achaz the son of Yehu, king of Yisra\'el, saying, Come, let us look one another in the face.";
vul[17] = "igitur Amasias rex Iuda inito pessimo consilio misit ad Ioas filium Ioachaz filii Hieu regem Israhel dicens veni videamus nos mutuo";
rsv[18] = "And Jo\'ash the king of Israel sent word to Amazi\'ah king of Judah, &quot;A thistle on Lebanon sent to a cedar on Lebanon, saying, \'Give your daughter to my son for a wife\'; and a wild beast of Lebanon passed by and trampled down the thistle.";
asv[18] = "And Joash king of Israel sent to Amaziah king of Judah, saying, The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that was in Lebanon, and trod down the thistle.";
yng[18] = "`Come, we look one another in the face.\' And Joash king of Israel sendeth unto Amaziah king of Judah, saying, `The thorn that [is] in Lebanon hath sent unto the cedar that [is] in Lebanon, saying, Give thy daughter to my son for a wife; and pass by doth a beast of the field that [is] in Lebanon, and treadeth down the thorn.";
dby[18] = "And Joash king of Israel sent to Amaziah king of Judah, saying, The thorn-bush that is in Lebanon sent to the cedar that is in Lebanon, saying, Give thy daughter to my son as wife; and there passed by the wild beast that is in Lebanon, and trode down the thorn-bush.";
web[18] = "And Joash king of Israel sent to Amaziah king of Judah, saying, The thistle that [was] in Lebanon sent to the cedar that [was] in Lebanon, saying, Give thy daughter to my son for a wife: and there passed by a wild beast that [was] in Lebanon, and trod down the thistle.";
hnv[18] = " Yo\'ash king of Yisra\'el sent to Amatzyah king of Yehudah, saying, The thistle that was in Levanon sent to the cedar that was in Levanon, saying, Give your daughter to my son as wife: and there passed by a wild animal that was in Levanon, and trod down the thistle.";
vul[18] = "at ille remisit nuntium dicens carduus qui est in Libano misit ad cedrum Libani dicens da filiam tuam filio meo uxorem et ecce bestiae quae erant in silva Libani transierunt et conculcaverunt carduum";
rsv[19] = "You say, \'See, I have smitten Edom,\' and your heart has lifted you up in boastfulness. But now stay at home; why should you provoke trouble so that you fall, you and Judah with you?&quot;";
asv[19] = "Thou sayest, Lo, thou hast smitten Edom; and thy heart lifteth thee up to boast: abide now at home; why shouldest thou meddle to [thy] hurt, that thou shouldest fall, even thou, and Judah with thee?";
yng[19] = "Thou hast said, Lo, I have smitten Edom; and thy heart hath lifted thee up to boast; now, abide in thy house, why dost thou stir thyself up in evil, that thou hast fallen, thou, and Judah with thee?\'";
dby[19] = "Thou thinkest, Lo, thou hast smitten Edom; and thy heart has lifted thee up to boast: abide now at home; why shouldest thou contend with misfortune, that thou shouldest fall, thou and Judah with thee?";
web[19] = "Thou sayest, Lo, thou hast smitten the Edomites; and thy heart lifteth thee up to boast: abide now at home; why shouldst thou meddle to [thy] hurt, that thou shouldst fall, [even] thou, and Judah with thee?";
hnv[19] = "You say, Behold, you have struck Edom; and your heart lifts you up to boast: abide now at home; why should you meddle to [your] hurt, that you should fall, even you, and Yehudah with you?";
vul[19] = "dixisti percussi Edom et idcirco erigitur cor tuum in superbiam sede in domo tua cur malum adversum te provocas ut cadas et tu et Iudas tecum";
rsv[20] = "But Amazi\'ah would not listen; for it was of God, in order that he might give them into the hand of their enemies, because they had sought the gods of Edom.";
asv[20] = "But Amaziah would not hear; for it was of God, that he might deliver them into the hand [of their enemies], because they had sought after the gods of Edom.";
yng[20] = "And Amaziah hath not hearkened, for from God it [is] in order to give them into hand, because they have sought the gods of Edom;";
dby[20] = "But Amaziah would not hear; for it was of God, that he might deliver them into [the enemy\'s] hand, because they had sought after the gods of Edom.";
web[20] = "But Amaziah would not hear; for it [came] from God, that he might deliver them into the hand [of their enemies], because they sought after the gods of Edom.";
hnv[20] = "But Amatzyah would not hear; for it was of God, that he might deliver them into the hand [of their enemies], because they had sought after the gods of Edom.";
vul[20] = "noluit audire Amasias eo quod Domini esset voluntas ut traderetur in manibus hostium propter deos Edom";
rsv[21] = "So Jo\'ash king of Israel went up; and he and Amazi\'ah king of Judah faced one another in battle at Beth-she\'mesh, which belongs to Judah.";
asv[21] = "So Joash king of Israel went up; and he and Amaziah king of Judah looked one another in the face at Beth-shemesh, which belongeth to Judah.";
yng[21] = "and go up doth Joash king of Israel, and they look one another in the face, he and Amaziah king of Judah, in Beth-Shemesh, that [is] Judah\'s,";
dby[21] = "And Joash king of Israel went up; and they looked one another in the face, he and Amaziah king of Judah, at Beth-shemesh, which is in Judah.";
web[21] = "So Joash the king of Israel went up; and they saw one another in the face, [both] he and Amaziah king of Judah, at Beth-shemesh, which [belongeth] to Judah.";
hnv[21] = "So Yo\'ash king of Yisra\'el went up; and he and Amatzyah king of Yehudah looked one another in the face at Beth-shemesh, which belongs to Yehudah.";
vul[21] = "ascendit igitur Ioas rex Israhel et mutuos sibi praebuere conspectus Amasias autem rex Iuda erat in Bethsames Iudae";
rsv[22] = "And Judah was defeated by Israel, and every man fled to his home.";
asv[22] = "And Judah was put to the worse before Israel; and they fled every man to his tent.";
yng[22] = "and Judah is smitten before Israel, and they flee -- each to his tents.";
dby[22] = "And Judah was routed before Israel; and they fled every man to his tent.";
web[22] = "And Judah was defeated before Israel, and they fled every man to his tent.";
hnv[22] = "Yehudah was put to the worse before Yisra\'el; and they fled every man to his tent.";
vul[22] = "corruitque Iudas coram Israhel et fugit in tabernacula sua";
rsv[23] = "And Jo\'ash king of Israel captured Amazi\'ah king of Judah, the son of Jo\'ash, son of Ahazi\'ah, at Beth-she\'mesh, and brought him to Jerusalem, and broke down the wall of Jerusalem for four hundred cubits, from the E\'phraim Gate to the Corner Gate.";
asv[23] = "And Joash king of Israel took Amaziah king of Judah, the son of Joash the son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits.";
yng[23] = "And Amaziah king of Judah, son of Joash, son of Jehoahaz, hath Joash king of Israel caught in Beth-Shemesh, and bringeth him in to Jerusalem, and breaketh down in the wall of Jerusalem from the gate of Ephraim unto the gate of the corner, four hundred cubits,";
dby[23] = "And Joash king of Israel took Amaziah king of Judah, the son of Joash the son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem, and he broke down the wall of Jerusalem from the gate of Ephraim to the corner gate, four hundred cubits.";
web[23] = "And Joash the king of Israel took Amaziah king of Judah, the son of Joash, the son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem, and broke down the wall of Jerusalem from the gate of Ephraim to the corner gate, four hundred cubits.";
hnv[23] = "Yo\'ash king of Yisra\'el took Amatzyah king of Yehudah, the son of Yo\'ash the son of Yeho\'achaz, at Beth-shemesh, and brought him to Yerushalayim, and broke down the wall of Yerushalayim from the gate of Efrayim to the corner gate, four hundred cubits.";
vul[23] = "porro Amasiam regem Iuda filium Ioas filii Ioachaz cepit Ioas rex Israhel in Bethsames et adduxit in Hierusalem destruxitque murum eius a porta Ephraim usque ad portam Anguli quadringentis cubitis";
rsv[24] = "And he seized all the gold and silver, and all the vessels that were found in the house of God, and O\'bed-e\'dom with them; he seized also the treasuries of the king\'s house, and hostages, and he returned to Sama\'ria.";
asv[24] = "And [he took] all the gold and silver, and all the vessels that were found in the house of God with Obed-edom, and the treasures of the king\'s house, the hostages also, and returned to Samaria.";
yng[24] = "and [taketh] all the gold, and the silver, and all the vessels that are found in the house of God with Obed-Edom, and the treasures of the house of the king, and the sons of the pledges, and turneth back to Samaria.";
dby[24] = "And he [took] all the gold and the silver, and all the vessels that were found in the house of God with Obed-Edom, and the treasures of the king\'s house, and hostages, and returned to Samaria.";
web[24] = "And [he took] all the gold and the silver, and all the vessels that were found in the house of God with Obed-edom, and the treasures of the king\'s house, the hostages also, and returned to Samaria.";
hnv[24] = "[He took] all the gold and silver, and all the vessels that were found in the house of God with Obed-edom, and the treasures of the king\'s house, the hostages also, and returned to Shomron.";
vul[24] = "omne quoque aurum et argentum et universa vasa quae reppererat in domo Dei et apud Obededom in thesauris etiam domus regiae necnon et filios obsidum reduxit Samariam";
rsv[25] = "Amazi\'ah the son of Jo\'ash king of Judah lived fifteen years after the death of Jo\'ash the son of Jeho\'ahaz, king of Israel.";
asv[25] = "And Amaziah the son of Joash king of Judah lived after the death of Joash son of Jehoahaz king of Israel fifteen years.";
yng[25] = "And Amaziah son of Joash, king of Judah, liveth after the death of Joash son of Jehoahaz, king of Israel, fifteen years;";
dby[25] = "And Amaziah the son of Joash, king of Judah, lived after the death of Joash son of Jehoahaz, king of Israel, fifteen years.";
web[25] = "And Amaziah the son of Joash king of Judah, lived after the death of Joash, son of Jehoahaz king of Israel, fifteen years.";
hnv[25] = "Amatzyah the son of Yo\'ash king of Yehudah lived after the death of Yo\'ash son of Yeho\'achaz king of Yisra\'el fifteen years.";
vul[25] = "vixit autem Amasias filius Ioas rex Iuda postquam mortuus est Ioas filius Ioachaz rex Israhel quindecim annis";
rsv[26] = "Now the rest of the deeds of Amazi\'ah, from first to last, are they not written in the Book of the Kings of Judah and Israel?";
asv[26] = "Now the rest of the acts of Amaziah, first and last, behold, are they not written in the book of the kings of Judah and Israel?";
yng[26] = "and the rest of the matters of Amaziah, the first and the last, lo, are they not written on the books of the kings of Judah and Israel?";
dby[26] = "And the rest of the acts of Amaziah, first and last, behold, are they not written in the book of the kings of Judah and Israel?";
web[26] = "Now the rest of the acts of Amaziah, first and last, behold, [are] they not written in the book of the kings of Judah and Israel?";
hnv[26] = "Now the rest of the acts of Amatzyah, first and last, behold, aren\'t they written in the book of the kings of Yehudah and Yisra\'el?";
vul[26] = "reliqua vero sermonum Amasiae priorum et novissimorum scripta sunt in libro regum Iuda et Israhel";
rsv[27] = "From the time when he turned away from the LORD they made a conspiracy against him in Jerusalem, and he fled to Lachish. But they sent after him to Lachish, and slew him there.";
asv[27] = "Now from the time that Amaziah did turn away from following Jehovah they made a conspiracy against him in Jerusalem; and he fled to Lachish: but they sent after him to Lachish, and slew him there.";
yng[27] = "And from the time that Amaziah hath turned aside from after Jehovah -- they make a conspiracy against him in Jerusalem, and he fleeth to Lachish, and they send after him to Lachish, and put him to death there,";
dby[27] = "And from the time that Amaziah turned aside from following Jehovah, they made a conspiracy against him in Jerusalem; and he fled to Lachish; and they sent after him to Lachish, and slew him there.";
web[27] = "Now after the time that Amaziah turned away from following the LORD, they made a conspiracy against him in Jerusalem; and he fled to Lachish: but they sent to Lachish after him, and slew him there.";
hnv[27] = "Now from the time that Amatzyah did turn away from following the LORD they made a conspiracy against him in Yerushalayim; and he fled to Lakhish: but they sent after him to Lakhish, and killed him there.";
vul[27] = "qui postquam recessit a Domino tetenderunt ei insidias in Hierusalem cumque fugisset Lachis miserunt et interfecerunt eum ibi";
rsv[28] = "And they brought him upon horses; and he was buried with his fathers in the city of David.";
asv[28] = "And they brought him upon horses, and buried him with his fathers in the city of Judah.";
yng[28] = "and lift him up on the horses, and bury him with his fathers in the city of Judah.";
dby[28] = "And they brought him on horses, and buried him with his fathers in the city of Judah.";
web[28] = "And they brought him upon horses, and buried him with his fathers in the city of Judah.";
hnv[28] = "They brought him on horses, and buried him with his fathers in the city of Yehudah.";
vul[28] = "reportantesque super equos sepelierunt eum cum patribus suis in civitate David";
