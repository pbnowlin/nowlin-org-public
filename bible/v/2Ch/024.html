csb[1] = "Joash was seven years old when he became king, and he reigned forty years in Jerusalem. His mother\'s name was Zibiah; she was from Beer-sheba.";
csb[2] = "Throughout the time of the priest Jehoiada, Joash did what was right in the LORD\'s sight.";
csb[3] = "Jehoiada acquired two wives for him, and he was the father of sons and daughters.";
csb[4] = "Afterward, Joash took it to heart to renovate the LORD\'s temple.";
csb[5] = "So he gathered the priests and Levites and said, &quot;Go out to the cities of Judah and collect silver from all Israel to repair the temple of your God as needed year by year, and do it quickly.&quot; However, the Levites did not hurry.";
csb[6] = "So the king called Jehoiada the high priest and said, &quot;Why haven\'t you required the Levites to bring from Judah and Jerusalem the tax imposed by the LORD\'s servant Moses and the assembly of Israel for the tent of the testimony?";
csb[7] = "&quot;For the sons of that wicked Athaliah broke into the LORD\'s temple and even used the sacred things of the LORD\'s temple for the Baals.&quot;";
csb[8] = "At the king\'s command a chest was made and placed outside the gate of the LORD\'s temple.";
csb[9] = "Then a proclamation was issued in Judah and Jerusalem that the tax God\'s servant Moses imposed on Israel in the wilderness be brought to the LORD.";
csb[10] = "All the leaders and all the people rejoiced, brought the tax, and put it in the chest until it was full.";
csb[11] = "Whenever the chest was brought by the Levites to the king\'s overseers, and when they saw that there was a large amount of silver, the king\'s secretary and the high priest\'s deputy came and emptied the chest, picked it up, and returned it to its place. They did this daily and gathered the silver in abundance.";
csb[12] = "Then the king and Jehoiada gave it to those in charge of the labor on the LORD\'s temple, who were hiring stonecutters and carpenters to renovate the LORD\'s temple, also blacksmiths and coppersmiths to repair the LORD\'s temple.";
csb[13] = "The workmen did their work, and through them the repairs progressed. They restored God\'s temple to its specifications and reinforced it.";
csb[14] = "When they finished, they presented the rest of the silver to the king and Jehoiada, who made articles for the LORD\'s temple with it -- articles for ministry and for making burnt offerings, and ladles and articles of gold and silver. They regularly offered burnt offerings in the LORD\'s temple throughout Jehoiada\'s life.";
csb[15] = "Jehoiada died when he was old and full of days; he was 130 years old at his death.";
csb[16] = "He was buried in the city of David with the kings because he had done what was good in Israel with respect to God and his temple.";
csb[17] = "However, after Jehoiada died, the rulers of Judah came and paid homage to the king. Then the king listened to them,";
csb[18] = "and they abandoned the temple of the LORD, the God of their ancestors, and served the Asherah poles and the idols. So there was wrath against Judah and Jerusalem for this guilt of theirs.";
csb[19] = "Nevertheless, he sent them prophets to bring them back to the LORD; they admonished them, but the people would not listen.";
csb[20] = "The Spirit of God enveloped Zechariah son of Jehoiada the priest. He stood above the people and said to them, &quot;This is what God says, \'Why are you transgressing the LORD\'s commands so that you do not prosper? Because you have abandoned the LORD, he has abandoned you.\' &quot;";
csb[21] = "But they conspired against him and stoned him at the king\'s command in the courtyard of the LORD\'s temple.";
csb[22] = "King Joash didn\'t remember the kindness that Zechariah\'s father Jehoiada had extended to him, but killed his son. While he was dying, he said, &quot;May the LORD see and demand an account.&quot;";
csb[23] = "At the turn of the year, an Aramean army attacked Joash. They entered Judah and Jerusalem and destroyed all the leaders of the people among them and sent all the plunder to the king of Damascus.";
csb[24] = "Although the Aramean army came with only a few men, the LORD handed over a vast army to them because the people of Judah had abandoned the LORD, the God of their ancestors. So they executed judgment on Joash.";
csb[25] = "When the Arameans saw that Joash had many wounds, they left him. His servants conspired against him, and killed him on his bed, because he had shed the blood of the sons of the priest Jehoiada. So he died, and they buried him in the city of David, but they did not bury him in the tombs of the kings.";
csb[26] = "Those who conspired against him were Zabad, son of the Ammonite woman Shimeath, and Jehozabad, son of the Moabite woman Shimrith.";
csb[27] = "The accounts concerning his sons, the many divine pronouncements about him, and the restoration of God\'s temple are recorded in the Writing of the Book of the Kings. His son Amaziah became king in his place.";
kjv[1] = "Joash [was] seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother\'s name also [was] Zibiah of Beersheba.";

yng[1] = "A son of seven years [is] Joash in his reigning, and forty years he hath reigned in Jerusalem, and the name of his mother [is] Zibiah of Beer-Sheba.";

hnv[1] = "Yo\'ash was seven years old when he began to reign; and he reigned forty years in Yerushalayim: and his mother\'s name was Tzivyah, of Be\'er-Sheva.";

asv[2] = "And Joash did that which was right in the eyes of Jehovah all the days of Jehoiada the priest.";

hnv[2] = "Yo\'ash did that which was right in the eyes of the LORD all the days of Yehoiada the Kohen.";

rsv[4] = "After this Jo\'ash decided to restore the house of the LORD.";
asv[4] = "And it came to pass after this, that Joash was minded to restore the house of Jehovah.";
yng[4] = "And it cometh to pass after this, it hath been with the heart of Joash to renew the house of Jehovah,";

kjv[5] = "And he gathered together the priests and the Levites, and said to them, Go out unto the cities of Judah, and gather of all Israel money to repair the house of your God from year to year, and see that ye hasten the matter. Howbeit the Levites hastened [it] not.";
rsv[5] = "And he gathered the priests and the Levites, and said to them, &quot;Go out to the cities of Judah, and gather from all Israel money to repair the house of your God from year to year; and see that you hasten the matter.&quot; But the Levites did not hasten it.";
asv[5] = "And he gathered together the priests and the Levites, and said to them, Go out unto the cities of Judah, and gather of all Israel money to repair the house of your God from year to year; and see that ye hasten the matter. Howbeit the Levites hastened it not.";
yng[5] = "and he gathereth the priests and the Levites, and saith to them, `Go out to the cities of Judah, and gather from all Israel money to strengthen the house of your God sufficiently year by year, and ye, ye do haste to the matter;\' and the Levites have not hasted.";
dby[5] = "And he gathered together the priests and the Levites, and said to them, Go out to the cities of Judah and collect of all Israel money for the repair of the house of your God from year to year, and ye shall hasten the matter. But the Levites hastened it not.";
web[5] = "And he convened the priests and the Levites, and said to them, Go out to the cities of Judah, and gather from all Israel money to repair the house of your God from year to year, and see that ye hasten the matter. But the Levites hastened [it] not.";
hnv[5] = "He gathered together the Kohanim and the Levites, and said to them, Go out to the cities of Yehudah, and gather of all Yisra\'el money to repair the house of your God from year to year; and see that you hasten the matter. However the Levites didn\'t hurry.";
vul[5] = "congregavitque sacerdotes et Levitas et dixit eis egredimini ad civitates Iuda et colligite de universo Israhel pecuniam ad sarta tecta templi Dei vestri per singulos annos festinatoque hoc facite porro Levitae egere neglegentius";
kjv[6] = "And the king called for Jehoiada the chief, and said unto him, Why hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the collection, [according to the commandment] of Moses the servant of the LORD, and of the congregation of Israel, for the tabernacle of witness?";
rsv[6] = "So the king summoned Jehoi\'ada the chief, and said to him, &quot;Why have you not required the Levites to bring in from Judah and Jerusalem the tax levied by Moses, the servant of the LORD, on the congregation of Israel for the tent of testimony?&quot;";
asv[6] = "And the king called for Jehoiada the chief, and said unto him, Why hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the tax of Moses the servant of Jehovah, and of the assembly of Israel, for the tent of the testimony?";
yng[6] = "And the king calleth for Jehoiada the head, and saith to him, `Wherefore hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the tribute of Moses, servant of Jehovah, and of the assembly of Israel, for the tent of the testimony?";
dby[6] = "And the king called for Jehoiada the chief, and said to him, Why hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the tribute of Moses the servant of Jehovah [laid upon] the congregation of Israel, for the tent of the testimony?";
web[6] = "And the king called for Jehoiada the chief, and said to him, Why hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the collection, [according to the commandment] of Moses the servant of the LORD, and of the congregation of Israel, for the tabernacle of witness?";
hnv[6] = "The king called for Yehoiada the chief, and said to him, Why haven\'t you required of the Levites to bring in out of Yehudah and out of Yerushalayim the tax of Moshe the servant of the LORD, and of the assembly of Yisra\'el, for the tent of the testimony?";
vul[6] = "vocavitque rex Ioiadae principem et dixit ei quare non tibi fuit curae ut cogeres Levitas inferre de Iuda et de Hierusalem pecuniam quae constituta est a Mose servo Domini ut inferret eam omnis multitudo Israhel in tabernaculum testimonii";
kjv[7] = "For the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the LORD did they bestow upon Baalim.";
rsv[7] = "For the sons of Athali\'ah, that wicked woman, had broken into the house of God; and had also used all the dedicated things of the house of the LORD for the Ba\'als.";
asv[7] = "For the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of Jehovah did they bestow upon the Baalim.";
yng[7] = "for sons of Athaliah, the wicked one, have broken up the house of God, and also, all the holy things of the house of Jehovah they have prepared for Baalim.\'";
dby[7] = "For the wicked Athaliah [and] her sons had devastated the house of God; and also all the hallowed things of the house of Jehovah had they employed for the Baals.";
web[7] = "For the sons of Athaliah that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the LORD they bestowed upon Baalim.";
hnv[7] = "For the sons of `Atalyah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the LORD did they bestow on the Ba`alim.";

kjv[11] = "Now it came to pass, that at what time the chest was brought unto the king\'s office by the hand of the Levites, and when they saw that [there was] much money, the king\'s scribe and the high priest\'s officer came and emptied the chest, and took it, and carried it to his place again. Thus they did day by day, and gathered money in abundance.";
rsv[11] = "And whenever the chest was brought to the king\'s officers by the Levites, when they saw that there was much money in it, the king\'s secretary and the officer of the chief priest would come and empty the chest and take it and return it to its place. Thus they did day after day, and collected money in abundance.";
asv[11] = "And it was so, that, at what time the chest was brought unto the king\'s officers by the hand of the Levites, and when they saw that there was much money, the king\'s scribe and the chief priest\'s officer came and emptied the chest, and took it, and carried it to its place again. Thus they did day by day, and gathered money in abundance.";
yng[11] = "And it cometh to pass, at the time one bringeth in the chest for the inspection of the king by the hand of the Levites, and at their seeing that the money [is] abundant, that a scribe of the king hath come in, and an officer of the head-priest, and they empty the chest, and take it up and turn it back unto its place; thus they have done day by day, and gather money in abundance.";
dby[11] = "And it came to pass at the time the chest was brought for the king\'s control by the hand of the Levites, and when they saw that there was much money, the king\'s scribe and high priest\'s officer came, and they emptied the chest, and took it, and carried it to its place again. Thus they did day by day, and gathered money in abundance.";
web[11] = "Now it came to pass, that at the time the chest was brought to the king\'s office by the hand of the Levites, and when they saw that [there was] much money, the king\'s scribe and the high priest\'s officer came and emptied the chest, and took it, and carried it to its place again. Thus they did day by day, and collected money in abundance.";
hnv[11] = "It was so, that whenever the chest was brought to the king\'s officers by the hand of the Levites, and when they saw that there was much money, the king\'s Sofer and the chief Kohen\'s officer came and emptied the chest, and took it, and carried it to its place again. Thus they did day by day, and gathered money in abundance.";
vul[11] = "cumque tempus esset ut deferrent arcam coram rege per manus Levitarum videbant enim multam pecuniam ingrediebatur scriba regis et quem primus sacerdos constituerat effundebantque pecuniam quae erat in arca porro arcam reportabant ad locum suum sicque faciebant per singulos dies et congregata est infinita pecunia";
kjv[12] = "And the king and Jehoiada gave it to such as did the work of the service of the house of the LORD, and hired masons and carpenters to repair the house of the LORD, and also such as wrought iron and brass to mend the house of the LORD.";
rsv[12] = "And the king and Jehoi\'ada gave it to those who had charge of the work of the house of the LORD, and they hired masons and carpenters to restore the house of the LORD, and also workers in iron and bronze to repair the house of the LORD.";
asv[12] = "And the king and Jehoiada gave it to such as did the work of the service of the house of Jehovah; and they hired masons and carpenters to restore the house of Jehovah, and also such as wrought iron and brass to repair the house of Jehovah.";
yng[12] = "And the king and Jehoiada give it unto the doers of the work of the service of the house of Jehovah, and they are hiring hewers and artificers to renew the house of Jehovah, and also -- to artificers in iron and brass to strengthen the house of Jehovah.";
dby[12] = "And the king and Jehoiada gave it to such as did the work of the service of the house of Jehovah, and they hired masons and carpenters to renew the house of Jehovah, and also such as wrought in iron and bronze, to repair the house of Jehovah.";
web[12] = "And the king and Jehoiada gave it to such as did the work of the service of the house of the LORD, and hired masons and carpenters to repair the house of the LORD, and also such as wrought iron and brass to mend the house of the LORD.";
hnv[12] = "The king and Yehoiada gave it to such as did the work of the service of the house of the LORD; and they hired masons and carpenters to restore the house of the LORD, and also such as worked iron and brass to repair the house of the LORD.";
vul[12] = "quam dederunt rex et Ioiada his qui praeerant operibus domus Domini at illi conducebant ex ea caesores lapidum et artifices operum singulorum ut instaurarent domum Domini fabros quoque ferri et aeris ut quod cadere coeperat fulciretur";
kjv[13] = "So the workmen wrought, and the work was perfected by them, and they set the house of God in his state, and strengthened it.";
rsv[13] = "So those who were engaged in the work labored, and the repairing went forward in their hands, and they restored the house of God to its proper condition and strengthened it.";
asv[13] = "So the workmen wrought, and the work of repairing went forward in their hands, and they set up the house of God in its state, and strengthened it.";
yng[13] = "And those doing the business work, and there goeth up lengthening to the work by their hand, and they establish the house of God, by its proper measure, and strengthen it.";
dby[13] = "So the workmen wrought, and the work was perfected by them, and they set the house of God in its state, and strengthened it.";
web[13] = "So the workmen wrought, and the work was perfected by them, and they set the house of God in its state, and strengthened it.";
hnv[13] = "So the workmen worked, and the work of repairing went forward in their hands, and they set up the house of God in its state, and strengthened it.";
vul[13] = "egeruntque hii qui operabantur industrie et obducebatur parietum cicatrix per manus eorum ac suscitaverunt domum Domini in statum pristinum et firme eam stare fecerunt";
kjv[14] = "And when they had finished [it], they brought the rest of the money before the king and Jehoiada, whereof were made vessels for the house of the LORD, [even] vessels to minister, and to offer [withal], and spoons, and vessels of gold and silver. And they offered burnt offerings in the house of the LORD continually all the days of Jehoiada.";
rsv[14] = "And when they had finished, they brought the rest of the money before the king and Jehoi\'ada, and with it were made utensils for the house of the LORD, both for the service and for the burnt offerings, and dishes for incense, and vessels of gold and silver. And they offered burnt offerings in the house of the LORD continually all the days of Jehoi\'ada.";
asv[14] = "And when they had made an end, they brought the rest of the money before the king and Jehoiada, whereof were made vessels for the house of Jehovah, even vessels wherewith to minister and to offer, and spoons, and vessels of gold and silver. And they offered burnt-offerings in the house of Jehovah continually all the days of Jehoiada.";
yng[14] = "And at their completing [it], they have brought in before the king and Jehoiada the rest of the money, and they make it vessels for the house of Jehovah, vessels of serving, and of offering up, and spoons, even vessels of gold and silver; and they are causing burnt-offerings to ascend in the house of Jehovah continually, all the days of Jehoiada.";
dby[14] = "And when they had finished, they brought the rest of the money before the king and Jehoiada; and they made of it vessels for the house of Jehovah, utensils to minister, and with which to offer up, and cups, and utensils of gold and silver. And they offered up burnt-offerings in the house of Jehovah continually all the days of Jehoiada.";
web[14] = "And when they had finished [it], they brought the rest of the money before the king and Jehoiada, of which were made vessels for the house of the LORD, [even] vessels to minister, and to offer [with], and spoons, and vessels of gold and silver. And they offered burnt-offerings in the house of the LORD continually all the days of Jehoiada.";
hnv[14] = "When they had made an end, they brought the rest of the money before the king and Yehoiada, whereof were made vessels for the house of the LORD, even vessels with which to minister and to offer, and spoons, and vessels of gold and silver. They offered burnt offerings in the house of the LORD continually all the days of Yehoiada.";
vul[14] = "cumque conplessent omnia opera detulerunt coram rege et Ioiadae reliquam partem pecuniae de qua facta sunt vasa templi in ministerium et ad holocausta fialae quoque et cetera vasa aurea et argentea et offerebantur holocausta in domo Domini iugiter cunctis diebus Ioiadae";
kjv[15] = "But Jehoiada waxed old, and was full of days when he died; an hundred and thirty years old [was he] when he died.";
rsv[15] = "But Jehoi\'ada grew old and full of days, and died; he was a hundred and thirty years old at his death.";
asv[15] = "But Jehoiada waxed old and was full of days, and he died; a hundred and thirty years old was he when he died.";
yng[15] = "And Jehoiada is aged and satisfied with days, and dieth -- a son of a hundred and thirty years in his death,";
dby[15] = "And Jehoiada grew old and was full of days, and he died; he was a hundred and thirty years old when he died.";
web[15] = "But Jehoiada grew old, and was full of days when he died; a hundred and thirty years old [was] he when he died.";
hnv[15] = "But Yehoiada grew old and was full of days, and he died; one hundred thirty years old was he when he died.";
vul[15] = "senuit autem Ioiadae plenus dierum et mortuus est cum centum triginta esset annorum";
kjv[16] = "And they buried him in the city of David among the kings, because he had done good in Israel, both toward God, and toward his house.";
rsv[16] = "And they buried him in the city of David among the kings, because he had done good in Israel, and toward God and his house.";
asv[16] = "And they buried him in the city of David among the kings, because he had done good in Israel, and toward God and his house.";
yng[16] = "and they bury him in the city of David, with the kings, for he hath done good in Israel, and with God, and his house.";
dby[16] = "And they buried him in the city of David among the kings, because he had done good in Israel, both toward God and toward his house.";
web[16] = "And they buried him in the city of David among the kings, because he had done good in Israel, both towards God, and towards his house.";
hnv[16] = "They buried him in the city of David among the kings, because he had done good in Yisra\'el, and toward God and his house.";
vul[16] = "sepelieruntque eum in civitate David cum regibus eo quod fecisset bonum cum Israhel et cum domo eius";
kjv[17] = "Now after the death of Jehoiada came the princes of Judah, and made obeisance to the king. Then the king hearkened unto them.";
rsv[17] = "Now after the death of Jehoi\'ada the princes of Judah came and did obeisance to the king; then the king hearkened to them.";
asv[17] = "Now after the death of Jehoiada came the princes of Judah, and made obeisance to the king. Then the king hearkened unto them.";
yng[17] = "And after the death of Jehoiada come in have heads of Judah, and bow themselves to the king; then hath the king hearkened unto them,";
dby[17] = "And after the death of Jehoiada the princes of Judah came and made obeisance to the king; then the king hearkened to them.";
web[17] = "Now after the death of Jehoiada came the princes of Judah, and made obeisance to the king. Then the king hearkened to them.";
hnv[17] = "Now after the death of Yehoiada came the princes of Yehudah, and made obeisance to the king. Then the king listened to them.";
vul[17] = "postquam autem obiit Ioiada ingressi sunt principes Iuda et adoraverunt regem qui delinitus obsequiis eorum adquievit eis";
kjv[18] = "And they left the house of the LORD God of their fathers, and served groves and idols: and wrath came upon Judah and Jerusalem for this their trespass.";
rsv[18] = "And they forsook the house of the LORD, the God of their fathers, and served the Ashe\'rim and the idols. And wrath came upon Judah and Jerusalem for this their guilt.";
asv[18] = "And they forsook the house of Jehovah, the God of their fathers, and served the Asherim and the idols: and wrath came upon Judah and Jerusalem for this their guiltiness.";
yng[18] = "and they forsake the house of Jehovah, God of their fathers, and serve the shrines and the idols, and there is wrath upon Judah and Jerusalem for this their guilt.";
dby[18] = "And they forsook the house of Jehovah the God of their fathers, and served the Asherahs and idols; and wrath came upon Judah and Jerusalem for this their trespass.";
web[18] = "And they left the house of the LORD God of their fathers, and served groves and idols: and wrath came upon Judah and Jerusalem for this their trespass.";
hnv[18] = " They forsook the house of the LORD, the God of their fathers, and served the Asherim and the idols: and wrath came on Yehudah and Yerushalayim for this their guiltiness.";
vul[18] = "et dereliquerunt templum Domini Dei patrum suorum servieruntque lucis et sculptilibus et facta est ira contra Iudam et Hierusalem propter hoc peccatum";
kjv[19] = "Yet he sent prophets to them, to bring them again unto the LORD; and they testified against them: but they would not give ear.";
rsv[19] = "Yet he sent prophets among them to bring them back to the LORD; these testified against them, but they would not give heed.";
asv[19] = "Yet he sent prophets to them, to bring them again unto Jehovah; and they testified against them: but they would not give ear.";
yng[19] = "And He sendeth among them prophets, to bring them back unto Jehovah, and they testify against them, and they have not given ear;";
dby[19] = "And he sent prophets among them to bring them again to Jehovah, and they testified against them; but they would not give ear.";
web[19] = "Yet he sent prophets to them, to bring them again to the LORD; and they testified against them: but they would not give ear.";
hnv[19] = "Yet he sent prophets to them, to bring them again to the LORD; and they testified against them: but they would not give ear.";
vul[19] = "mittebatque eis prophetas ut reverterentur ad Dominum quos protestantes illi audire nolebant";
kjv[20] = "And the Spirit of God came upon Zechariah the son of Jehoiada the priest, which stood above the people, and said unto them, Thus saith God, Why transgress ye the commandments of the LORD, that ye cannot prosper? because ye have forsaken the LORD, he hath also forsaken you.";
rsv[20] = "Then the Spirit of God took possession of Zechari\'ah the son of Jehoi\'ada the priest; and he stood above the people, and said to them, &quot;Thus says God, \'Why do you transgress the commandments of the LORD, so that you cannot prosper? Because you have forsaken the LORD, he has forsaken you.\'&quot;";
asv[20] = "And the Spirit of God came upon Zechariah the son of Jehoiada the priest; and he stood above the people, and said unto them, Thus saith God, Why transgress ye the commandments of Jehovah, so that ye cannot prosper? because ye have forsaken Jehovah, he hath also forsaken you.";
yng[20] = "and the Spirit of God hath clothed Zechariah son of Jehoiada the priest, and he standeth over-against the people, and saith to them, `Thus said God, Why are ye transgressing the commands of Jehovah, and prosper not? because ye have forsaken Jehovah -- He doth forsake you.\'";
dby[20] = "And the Spirit of God came upon Zechariah the son of Jehoiada the priest; and he stood up above the people and said unto them, Thus saith God: Wherefore do ye transgress the commandments of Jehovah? And ye cannot prosper; for ye have forsaken Jehovah, and he hath forsaken you.";
web[20] = "And the Spirit of God came upon Zechariah the son of Jehoiada the priest, who stood above the people, and said to them, Thus saith God, Why transgress ye the commandments of the LORD, that ye cannot prosper? because ye have forsaken the LORD, he hath also forsaken you.";
hnv[20] = "The Spirit of God came on Zekharyah the son of Yehoiada the Kohen; and he stood above the people, and said to them, Thus says God, Why disobey you the mitzvot of the LORD, so that you can\'t prosper? because you have forsaken the LORD, he has also forsaken you.";
vul[20] = "spiritus itaque Dei induit Zacchariam filium Ioiadae sacerdotem et stetit in conspectu populi et dixit eis haec dicit Dominus quare transgredimini praeceptum Domini quod vobis non proderit et dereliquistis Dominum ut derelinqueret vos";
kjv[21] = "And they conspired against him, and stoned him with stones at the commandment of the king in the court of the house of the LORD.";
rsv[21] = "But they conspired against him, and by command of the king they stoned him with stones in the court of the house of the LORD.";
asv[21] = "And they conspired against him, and stoned him with stones at the commandment of the king in the court of the house of Jehovah.";
yng[21] = "And they conspire against him, and stone him with stones by the command of the king, in the court of the house of Jehovah,";
dby[21] = "And they conspired against him, and stoned him with stones at the command of the king in the court of the house of Jehovah.";
web[21] = "And they conspired against him, and stoned him with stones at the commandment of the king in the court of the house of the LORD.";
hnv[21] = "They conspired against him, and stoned him with stones at the mitzvah of the king in the court of the house of the LORD.";
vul[21] = "qui congregati adversus eum miserunt lapides iuxta regis imperium in atrio domus Domini";
kjv[22] = "Thus Joash the king remembered not the kindness which Jehoiada his father had done to him, but slew his son. And when he died, he said, The LORD look upon [it], and require [it].";
rsv[22] = "Thus Jo\'ash the king did not remember the kindness which Jehoi\'ada, Zechari\'ah\'s father, had shown him, but killed his son. And when he was dying, he said, &quot;May the LORD see and avenge!&quot;";
asv[22] = "Thus Joash the king remembered not the kindness which Jehoiada his father had done to him, but slew his son. And when he died, he said, Jehovah look upon it, and require it.";
yng[22] = "and Joash the king hath not remembered the kindness that Jehoiada his father did with him, and slayeth his son, and in his death he said, `Jehovah doth see, and require.\'";
dby[22] = "And king Joash remembered not the kindness which Jehoiada his father had done to him, but slew his son. And when he died, he said, Jehovah see and require [it]!";
web[22] = "Thus Joash the king remembered not the kindness which Jehoiada his father had done to him, but slew his son. And when he died, he said, The LORD look upon [it], and require [it].";
hnv[22] = "Thus Yo\'ash the king didn\'t remember the kindness which Yehoiada his father had done to him, but killed his son. When he died, he said, the LORD look on it, and require it.";
vul[22] = "et non est recordatus Ioas rex misericordiae quam fecerat Ioiadae pater illius secum sed interfecit filium eius qui cum moreretur ait videat Dominus et requirat";
kjv[23] = "And it came to pass at the end of the year, [that] the host of Syria came up against him: and they came to Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all the spoil of them unto the king of Damascus.";
rsv[23] = "At the end of the year the army of the Syrians came up against Jo\'ash. They came to Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all their spoil to the king of Damascus.";
asv[23] = "And it came to pass at the end of the year, that the army of the Syrians came up against him: and they came to Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all the spoil of them unto the king of Damascus.";
yng[23] = "And it cometh to pass, at the turn of the year, come up hath the force of Aram against him, and they come in unto Judah and Jerusalem, and destroy all the heads of the people from the people, and all their spoil they have sent to the king of Damascus,";
dby[23] = "And it came to pass at the end of the year [that] the army of Syria came up against him; and they entered into Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all the spoil of them to the king at Damascus.";
web[23] = "And it came to pass at the end of the year, [that] the army of Syria came up against him: and they came to Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all the spoil of them to the king of Damascus.";
hnv[23] = "It happened at the end of the year, that the army of the Aram came up against him: and they came to Yehudah and Yerushalayim, and destroyed all the princes of the people from among the people, and sent all the spoil of them to the king of Dammesek.";
vul[23] = "cumque evolutus esset annus ascendit contra eum exercitus Syriae venitque in Iudam et Hierusalem et interfecit cunctos principes populi atque universam praedam miserunt regi Damascum";
kjv[24] = "For the army of the Syrians came with a small company of men, and the LORD delivered a very great host into their hand, because they had forsaken the LORD God of their fathers. So they executed judgment against Joash.";
rsv[24] = "Though the army of the Syrians had come with few men, the LORD delivered into their hand a very great army, because they had forsaken the LORD, the God of their fathers. Thus they executed judgment on Jo\'ash.";
asv[24] = "For the army of the Syrians came with a small company of men; and Jehovah delivered a very great host into their hand, because they had forsaken Jehovah, the God of their fathers. So they executed judgment upon Joash.";
yng[24] = "for with few men have the force of Aram come in, and Jehovah hath given into their hand a mighty force for multitude, because they have forsaken Jehovah, God of their fathers; and with Joash they have executed judgments.";
dby[24] = "Truly with a small company of men came the army of the Syrians, but Jehovah delivered a very great army into their hand, because they had forsaken Jehovah the God of their fathers; and they executed judgment upon Joash.";
web[24] = "For the army of the Syrians came with a small company of men, and the LORD delivered a very great host into their hand, because they had forsaken the LORD God of their fathers. So they executed judgment against Joash.";
hnv[24] = "For the army of the Aram came with a small company of men; and the LORD delivered a very great host into their hand, because they had forsaken the LORD, the God of their fathers. So they executed judgment on Yo\'ash.";
vul[24] = "et certe cum permodicus venisset numerus Syrorum tradidit Dominus manibus eorum infinitam multitudinem eo quod reliquissent Dominum Deum patrum suorum in Ioas quoque ignominiosa exercuere iudicia";
kjv[25] = "And when they were departed from him, (for they left him in great diseases,) his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died: and they buried him in the city of David, but they buried him not in the sepulchres of the kings.";
rsv[25] = "When they had departed from him, leaving him severely wounded, his servants conspired against him because of the blood of the son of Jehoi\'ada the priest, and slew him on his bed. So he died; and they buried him in the city of David, but they did not bury him in the tombs of the kings.";
asv[25] = "And when they were departed from him (for they left him very sick), his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died; and they buried him in the city of David, but they buried him not in the sepulchres of the kings.";
yng[25] = "And in their going from him -- for they left him with many diseases -- his servants themselves have conspired against him, for the blood of the sons of Jehoiada the priest, and slay him on his bed, and he dieth; and they bury him in the city of David, and have not buried him in the graves of the kings.";
dby[25] = "And when they had departed from him (for they left him in great diseases), his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died; and they buried him in the city of David, but they did not bury him in the sepulchres of the kings.";
web[25] = "And when they had departed from him, (for they left him in great diseases,) his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died: and they buried him in the city of David, but they buried him not in the sepulchers of the kings.";
hnv[25] = "When they were departed for him (for they left him very sick), his own servants conspired against him for the blood of the sons of Yehoiada the Kohen, and killed him on his bed, and he died; and they buried him in the city of David, but they didn\'t bury him in the tombs of the kings.";
vul[25] = "et abeuntes dimiserunt eum in languoribus magnis surrexerunt autem contra eum servi sui in ultionem sanguinis filii Ioiadae sacerdotis et occiderunt eum in lectulo suo et mortuus est sepelieruntque eum in civitate David sed non in sepulchris regum";
kjv[26] = "And these are they that conspired against him; Zabad the son of Shimeath an Ammonitess, and Jehozabad the son of Shimrith a Moabitess.";
rsv[26] = "Those who conspired against him were Zabad the son of Shim\'e-ath the Ammonitess, and Jeho\'zabad the son of Shimrith the Moabitess.";
asv[26] = "And these are they that conspired against him: Zabad the son of Shimeath the Ammonitess, and Jehozabad the son of Shimrith the Moabitess.";
yng[26] = "And these [are] those conspiring against him, Zabad son of Shimeath the Ammonitess, and Jehozabad son of Shimrith the Moabitess.";
dby[26] = "And these are they that conspired against him: Zabad the son of Shimeath an Ammonitess, and Jehozabad the son of Shimrith a Moabitess.";
web[26] = "And these are they that conspired against him; Zabad the son of Shimeath an Ammonitess, and Jehozabad the son of Shimrith a Moabitess.";
hnv[26] = " These are those who conspired against him: Zavad the son of Shim`at the `Ammonite, and Yehozavad the son of Shimrit the Mo\'avite.";
vul[26] = "insidiati vero sunt ei Zabath filius Semath Ammanitidis et Iozabath filius Semarith Moabitidis";
kjv[27] = "Now [concerning] his sons, and the greatness of the burdens [laid] upon him, and the repairing of the house of God, behold, they [are] written in the story of the book of the kings. And Amaziah his son reigned in his stead.";
rsv[27] = "Accounts of his sons, and of the many oracles against him, and of the rebuilding of the house of God are written in the Commentary on the Book of the Kings. And Amazi\'ah his son reigned in his stead.";
asv[27] = "Now concerning his sons, and the greatness of the burdens [laid] upon him, and the rebuilding of the house of God, behold, they are written in the commentary of the book of the kings. And Amaziah his son reigned in his stead.";
yng[27] = "As to his sons, and the greatness of the burden upon him, and the foundation of the house of God, lo, they are written on the `Inquiry\' of the book of the Kings; and reign doth Amaziah his son in his stead.";
dby[27] = "And as to his sons, and the greatness of the burdens [laid] upon him, and the building of the house of God, behold, they are written in the treatise of the book of the kings. And Amaziah his son reigned in his stead.";
web[27] = "Now [concerning] his sons, and the greatness of the burdens [laid] upon him, and the repairing of the house of God, behold, they [are] written in the story of the book of the kings. And Amaziah his son reigned in his stead.";
hnv[27] = "Now concerning his sons, and the greatness of the burdens [laid] on him, and the rebuilding of the house of God, behold, they are written in the commentary of the book of the kings. Amatzyah his son reigned in his place.";
vul[27] = "porro filii eius ac summa pecuniae quae adunata fuerat sub eo et instauratio domus Dei scripta sunt diligentius in libro regum regnavitque Amasias filius eius pro eo";
