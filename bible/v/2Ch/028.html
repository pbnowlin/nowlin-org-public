csb[1] = "Ahaz was twenty years old when he became king, and he reigned sixteen years in Jerusalem. He did not do what was right in the LORD\'s sight like his ancestor David,";
csb[2] = "for he walked in the ways of the kings of Israel and made cast images of the Baals.";
csb[3] = "He burned incense in Ben Hinnom Valley and burned his children in the fire, imitating the detestable practices of the nations the LORD had dispossessed before the Israelites.";
csb[4] = "He sacrificed and burned incense on the high places, on the hills, and under every green tree.";
csb[5] = "So the LORD his God handed Ahaz over to the king of Aram. He attacked him and took many captives to Damascus. Ahaz was also handed over to the king of Israel, who struck him with great force:";
csb[6] = "Pekah son of Remaliah killed one hundred twenty thousand in Judah in one day -- all brave men -- because they had abandoned the LORD God of their ancestors.";
csb[7] = "An Ephraimite warrior named Zichri killed the king\'s son Maaseiah, Azrikam governor of the palace, and Elkanah who was second to the king.";
csb[8] = "Then the Israelites took two hundred thousand captives from their brothers -- women, sons, and daughters. They also took a great deal of plunder from them and brought it to Samaria.";
csb[9] = "A prophet of the LORD named Oded was there. He went out to meet the army that came to Samaria and said to them, &quot;Look, the LORD God of your ancestors handed them over to you because of his wrath against Judah, but you slaughtered them in a rage that has reached heaven.";
csb[10] = "&quot;Now you plan to reduce the people of Judah and Jerusalem, male and female, to slavery. Are you not also guilty before the LORD your God?";
csb[11] = "&quot;Listen to me and return the captives you took from your brothers, for the LORD\'s burning anger is on you.&quot;";
csb[12] = "So some men who were leaders of the Ephraimites -- Azariah son of Jehohanan, Berechiah son of Meshillemoth, Jehizkiah son of Shallum, and Amasa son of Hadlai -- stood in opposition to those coming from the war.";
csb[13] = "They said to them, &quot;You must not bring the captives here, for you plan to bring guilt on us from the LORD to add to our sins and our guilt. For we have much guilt, and burning anger is on Israel.&quot;";
csb[14] = "The army left the captives and the plunder in the presence of the officers and the congregation.";
csb[15] = "Then the men who were designated by name took charge of the captives and provided clothes for their naked ones from the plunder. They clothed them, gave them sandals, food and drink, dressed their wounds, and provided donkeys for all the feeble. The Israelites brought them to Jericho, the City of Palms, among their brothers. Then they returned to Samaria.";
csb[16] = "At that time King Ahaz asked the king of Assyria for help.";
csb[17] = "The Edomites came again, attacked Judah, and took captives.";
csb[18] = "The Philistines also raided the cities of the Judean foothills and the Negev of Judah. They captured and occupied Beth-shemesh, Aijalon, and Gederoth, as well as Soco, Timnah, and Gimzo with their surrounding villages.";
csb[19] = "For the LORD humbled Judah because of King Ahaz of Judah, who threw off restraint in Judah and was unfaithful to the LORD.";
csb[20] = "Then King Tiglath-pileser of Assyria came against Ahaz; he oppressed him and did not give him support.";
csb[21] = "Although Ahaz plundered the LORD\'s temple and the palace of the king and of the rulers and gave the plunder to the king of Assyria, it did not help him.";
csb[22] = "At the time of his distress, King Ahaz himself became more unfaithful to the LORD.";
csb[23] = "He sacrificed to the gods of Damascus which had defeated him; he said, &quot;Since the gods of the kings of Aram are helping them, I will sacrifice to them so that they will help me.&quot; But they were the downfall of him and of all Israel.";
csb[24] = "Then Ahaz gathered up the utensils of God\'s temple, cut them into pieces, shut the doors of the LORD\'s temple, and made himself altars on every street corner in Jerusalem.";
csb[25] = "He made high places in every city of Judah to offer incense to other gods, and he angered the LORD, the God of his ancestors.";
csb[26] = "As for the rest of his deeds and all his ways, from beginning to end, they are written in the Book of the Kings of Judah and Israel.";
csb[27] = "Ahaz rested with his fathers and was buried in the city, in Jerusalem, but they did not bring him into the tombs of the kings of Israel. His son Hezekiah became king in his place.";

kjv[5] = "Wherefore the LORD his God delivered him into the hand of the king of Syria; and they smote him, and carried away a great multitude of them captives, and brought [them] to Damascus. And he was also delivered into the hand of the king of Israel, who smote him with a great slaughter.";
rsv[5] = "Therefore the LORD his God gave him into the hand of the king of Syria, who defeated him and took captive a great number of his people and brought them to Damascus. He was also given into the hand of the king of Israel, who defeated him with great slaughter.";
asv[5] = "Wherefore Jehovah his God delivered him into the hand of the king of Syria; and they smote him, and carried away of his a great multitude of captives, and brought them to Damascus. And he was also delivered into the hand of the king of Israel, who smote him with a great slaughter.";
yng[5] = "And Jehovah his God giveth him into the hand of the king of Aram, and they smite him, and take captive from him a great captivity, and bring [them] in to Damascus, and also into the hand of the king of Israel he hath been given, and he smiteth him -- a great smiting.";
dby[5] = "Therefore Jehovah his God gave him into the hand of the king of Syria; and they smote him, and carried away a great multitude of them captives, and brought them to Damascus. And he was also given into the hand of the king of Israel, who smote him with a great slaughter.";

hnv[5] = " Therefore the LORD his God delivered him into the hand of the king of Aram; and they struck him, and carried away of his a great multitude of captives, and brought them to Dammesek. He was also delivered into the hand of the king of Yisra\'el, who struck him with a great slaughter.";
vul[5] = "tradiditque eum Dominus Deus eius in manu regis Syriae qui percussit eum magnamque praedam de eius cepit imperio et adduxit in Damascum manibus quoque regis Israhel traditus est et percussus plaga grandi";

kjv[9] = "But a prophet of the LORD was there, whose name [was] Oded: and he went out before the host that came to Samaria, and said unto them, Behold, because the LORD God of your fathers was wroth with Judah, he hath delivered them into your hand, and ye have slain them in a rage [that] reacheth up unto heaven.";
rsv[9] = "But a prophet of the LORD was there, whose name was Oded; and he went out to meet the army that came to Sama\'ria, and said to them, &quot;Behold, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have slain them in a rage which has reached up to heaven.";
asv[9] = "But a prophet of Jehovah was there, whose name was Oded: and he went out to meet the host that came to Samaria, and said unto them, Behold, because Jehovah, the God of your fathers, was wroth with Judah, he hath delivered them into your hand, and ye have slain them in a rage which hath reached up unto heaven.";
yng[9] = "And there hath been there a prophet of Jehovah (Oded [is] his name), and he goeth out before the host that hath come in to Samaria, and saith to them, `Lo, in the fury of Jehovah God of your fathers against Judah, He hath given them into your hand, and ye slay among them in rage -- unto the heavens it hath come;";
dby[9] = "But a prophet of Jehovah was there, whose name was Oded; and he went out before the host that came to Samaria, and said unto them, Behold, because Jehovah the God of your fathers was wroth with Judah, he gave them into your hand, and ye have slain them in a rage that reaches up to heaven.";

hnv[9] = "But a prophet of the LORD was there, whose name was `Oded: and he went out to meet the host that came to Shomron, and said to them, Behold, because the LORD, the God of your fathers, was angry with Yehudah, he has delivered them into your hand, and you have slain them in a rage which has reached up to heaven.";
vul[9] = "ea tempestate erat ibi propheta Domini nomine Oded qui egressus obviam exercitui venientium in Samariam dixit eis ecce iratus Dominus Deus patrum vestrorum contra Iudam tradidit eos manibus vestris et occidistis illos atrociter ita ut caelum pertingeret vestra crudelitas";

vul[12] = "steterunt itaque viri de principibus filiorum Ephraim Azarias filius Iohanan Barachias filius Mosollamoth Hiezechias filius Sellum et Amasa filius Adali contra eos qui veniebant de proelio";
kjv[13] = "And said unto them, Ye shall not bring in the captives hither: for whereas we have offended against the LORD [already], ye intend to add [more] to our sins and to our trespass: for our trespass is great, and [there is] fierce wrath against Israel.";
rsv[13] = "and said to them, &quot;You shall not bring the captives in here, for you propose to bring upon us guilt against the LORD in addition to our present sins and guilt. For our guilt is already great, and there is fierce wrath against Israel.&quot;";
asv[13] = "and said unto them, Ye shall not bring in the captives hither: for ye purpose that which will bring upon us a trespass against Jehovah, to add unto our sins and to our trespass; for our trespass is great, and there is fierce wrath against Israel.";
yng[13] = "and say to them, `Ye do not bring in the captives hither, for, to guilt against Jehovah on us, ye are saying to add unto our sin and unto our guilt? for abundant [is] the guilt we have, and the fierceness of anger on Israel.\'";
dby[13] = "and said to them, Ye shall not bring in the captives hither; because, for our guilt before Jehovah, ye think to increase our sins and our trespasses: for our trespass is great, and fierce wrath is upon Israel.";

kjv[15] = "And the men which were expressed by name rose up, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them upon asses, and brought them to Jericho, the city of palm trees, to their brethren: then they returned to Samaria.";
rsv[15] = "And the men who have been mentioned by name rose and took the captives, and with the spoil they clothed all that were naked among them; they clothed them, gave them sandals, provided them with food and drink, and anointed them; and carrying all the feeble among them on asses, they brought them to their kinsfolk at Jericho, the city of palm trees. Then they returned to Sama\'ria.";
asv[15] = "And the men that have been mentioned by name rose up, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them upon asses, and brought them to Jericho, the city of palm-trees, unto their brethren: then they returned to Samaria.";
yng[15] = "and the men who have been expressed by name rise and take hold on the captives, and all their naked ones they have clothed from the spoil, yea, they clothe them, and shoe them, and cause them to eat and drink, and anoint them, and lead them on asses, even every feeble one, and bring them in to Jericho, the city of palms, near their brethren, and turn back to Samaria.";
dby[15] = "And the men that have been expressed by name rose up, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them on asses, and brought them to Jericho the city of palm-trees, to their brethren. And they returned to Samaria.";
web[15] = "And the men who were expressed by name arose, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them upon asses, and brought them to Jericho, the city of palm trees, to their brethren: then they returned to Samaria.";
hnv[15] = "The men who have been mentioned by name rose up, and took the captives, and with the spoil clothed all who were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them on donkeys, and brought them to Yericho, the city of palm trees, to their brothers: then they returned to Shomron.";
vul[15] = "steteruntque viri quos supra memoravimus et adprehendentes captivos omnesque qui nudi erant vestierunt de spoliis cumque vestissent eos et calciassent et refecissent cibo ac potu unxissent quoque propter laborem et adhibuissent eis curam quicumque ambulare non poterant et erant inbecillo corpore inposuerunt eos iumentis et adduxerunt Hierichum civitatem Palmarum ad fratres eorum ipsique reversi sunt Samariam";
kjv[16] = "At that time did king Ahaz send unto the kings of Assyria to help him.";
rsv[16] = "At that time King Ahaz sent to the king of Assyria for help.";
asv[16] = "At that time did king Ahaz send unto the kings of Assyria to help him.";
yng[16] = "At that time hath king Ahaz sent unto the king of Asshur to give help to him;";
dby[16] = "At that time king Ahaz sent to the kings of Assyria to help him.";
web[16] = "At that time king Ahaz sent to the kings of Assyria to help him.";
hnv[16] = "At that time did king Achaz send to the kings of Ashshur to help him.";
vul[16] = "tempore illo misit rex Achaz ad regem Assyriorum auxilium postulans";
kjv[17] = "For again the Edomites had come and smitten Judah, and carried away captives.";
rsv[17] = "For the E\'domites had again invaded and defeated Judah, and carried away captives.";
asv[17] = "For again the Edomites had come and smitten Judah, and carried away captives.";
yng[17] = "and again the Edomites have come, and smite in Judah, and take captive a captivity.";
dby[17] = "And again the Edomites came and smote Judah, and carried away captives.";
web[17] = "For again the Edomites had come and smitten Judah, and carried away captives.";
hnv[17] = "For again the Edom had come and struck Yehudah, and carried away captives.";
vul[17] = "veneruntque Idumei et percusserunt multos ex Iuda et ceperunt praedam magnam";
kjv[18] = "The Philistines also had invaded the cities of the low country, and of the south of Judah, and had taken Bethshemesh, and Ajalon, and Gederoth, and Shocho with the villages thereof, and Timnah with the villages thereof, Gimzo also and the villages thereof: and they dwelt there.";
rsv[18] = "And the Philistines had made raids on the cities in the Shephe\'lah and the Negeb of Judah, and had taken Beth-she\'mesh, Ai\'jalon, Gede\'roth, Soco with its villages, Timnah with its villages, and Gimzo with its villages; and they settled there.";
asv[18] = "The Philistines also had invaded the cities of the lowland, and of the South of Judah, and had taken Beth-shemesh, and Aijalon, and Gederoth, and Soco with the towns thereof, and Timnah with the towns thereof, Gimzo also and the towns thereof: and they dwelt there.";
yng[18] = "And the Philistines have rushed against the cities of the low country, and of the south of Judah, and capture Beth-Shemesh, and Aijalon, and Gederoth, and Shocho and its villages, and Timnah and its villages, and Gimzo and its villages, and dwell there,";
dby[18] = "And the Philistines invaded the cities of the lowland, and of the south of Judah, and took Beth-shemesh, and Ajalon, and Gederoth, and Socho and its dependent villages, and Timnah and its dependent villages, and Guimzo and its dependent villages; and they dwelt there.";
web[18] = "The Philistines also had invaded the cities of the low country, and of the south of Judah, and had taken Beth-shemesh, and Ajalon, and Gederoth, and Shocho with its villages, and Timnah with its villages, Gimzo also and its villages: and they dwelt there.";
hnv[18] = "The Pelishtim also had invaded the cities of the lowland, and of the South of Yehudah, and had taken Beth-shemesh, and Ayalon, and Kederot, and Sokho with the towns of it, and Timnah with the towns of it, Gimzo also and the towns of it: and they lived there.";
vul[18] = "Philisthim quoque diffusi sunt per urbes campestres et ad meridiem Iuda ceperuntque Bethsames et Ahilon et Gaderoth Soccho quoque et Thamnam et Gamzo cum viculis suis et habitaverunt in eis";
kjv[19] = "For the LORD brought Judah low because of Ahaz king of Israel; for he made Judah naked, and transgressed sore against the LORD.";
rsv[19] = "For the LORD brought Judah low because of Ahaz king of Israel, for he had dealt wantonly in Judah and had been faithless to the LORD.";
asv[19] = "For Jehovah brought Judah low because of Ahaz king of Israel; for he had dealt wantonly in Judah, and trespassed sore against Jehovah.";
yng[19] = "for Jehovah hath humbled Judah because of Ahaz king of Israel, for he made free with Judah, even to commit a trespass against Jehovah.";
dby[19] = "For Jehovah humbled Judah because of Ahaz king of Israel, for he had made Judah lawless, and transgressed much against Jehovah.";
web[19] = "For the LORD brought Judah low because of Ahaz king of Israel: for he made Judah naked, and greatly transgressed against the LORD.";
hnv[19] = "For the LORD brought Yehudah low because of Achaz king of Yisra\'el; for he had dealt wantonly in Yehudah, and trespassed severely against the LORD.";
vul[19] = "humiliaverat enim Dominus Iudam propter Achaz regem Iuda eo quod nudasset eum auxilio et contemptui habuisset Dominum";
kjv[20] = "And Tilgathpilneser king of Assyria came unto him, and distressed him, but strengthened him not.";
rsv[20] = "So Til\'gath-pilne\'ser king of Assyria came against him, and afflicted him instead of strengthening him.";
asv[20] = "And Tilgath-pilneser king of Assyria came unto him, and distressed him, but strengthened him not.";
yng[20] = "And Tilgath-Pilneser king of Asshur cometh in unto him, and doth distress him, and hath not strengthened him,";
dby[20] = "And Tilgath-Pilneser king of Assyria came to him, and troubled him, and did not support him.";
web[20] = "And Tilgath-pilneser king of Assyria came to him, and distressed him, but strengthened him not.";
hnv[20] = "Tilgat-Pilne\'eser king of Ashshur came to him, and distressed him, but didn\'t strengthen him.";
vul[20] = "adduxitque contra eum Thaglathphalnasar regem Assyriorum qui et adflixit eum et nullo resistente vastavit";
kjv[21] = "For Ahaz took away a portion [out] of the house of the LORD, and [out] of the house of the king, and of the princes, and gave [it] unto the king of Assyria: but he helped him not.";
rsv[21] = "For Ahaz took from the house of the LORD and the house of the king and of the princes, and gave tribute to the king of Assyria; but it did not help him.";
asv[21] = "For Ahaz took away a portion out of the house of Jehovah, and out of the house of the king and of the princes, and gave it unto the king of Assyria: but it helped him not.";
yng[21] = "though Ahaz hath taken a portion [out] of the house of Jehovah, and [out] of the house of the king, and of the princes, and giveth to the king of Asshur, yet it is no help to him.";
dby[21] = "For Ahaz stripped the house of Jehovah, and the house of the king and of the princes, and gave to the king of Assyria; but he was of no help to him.";
web[21] = "For Ahaz took away a portion from the house of the LORD, and from the house of the king, and of the princes, and gave [it] to the king of Assyria: but he helped him not.";
hnv[21] = "For Achaz took away a portion out of the house of the LORD, and out of the house of the king and of the princes, and gave it to the king of Ashshur: but it didn\'t help him.";
vul[21] = "igitur Achaz spoliata domo Domini et domo regum et principum dedit regi Assyriorum munera et tamen nihil ei profuit";
kjv[22] = "And in the time of his distress did he trespass yet more against the LORD: this [is that] king Ahaz.";
rsv[22] = "In the time of his distress he became yet more faithless to the LORD--this same King Ahaz.";
asv[22] = "And in the time of his distress did he trespass yet more against Jehovah, this same king Ahaz.";
yng[22] = "And in the time of his distress -- he addeth to trespass against Jehovah, (this king Ahaz),";
dby[22] = "And in the time of his trouble he transgressed yet more against Jehovah, this king Ahaz.";
web[22] = "And in the time of his distress he trespassed yet more against the LORD: this [is that] king Ahaz.";
hnv[22] = "In the time of his distress did he trespass yet more against the LORD, this same king Achaz.";
vul[22] = "insuper et in tempore angustiae suae auxit contemptum in Dominum ipse per se rex Achaz";
kjv[23] = "For he sacrificed unto the gods of Damascus, which smote him: and he said, Because the gods of the kings of Syria help them, [therefore] will I sacrifice to them, that they may help me. But they were the ruin of him, and of all Israel.";
rsv[23] = "For he sacrificed to the gods of Damascus which had defeated him, and said, &quot;Because the gods of the kings of Syria helped them, I will sacrifice to them that they may help me.&quot; But they were the ruin of him, and of all Israel.";
asv[23] = "For he sacrificed unto the gods of Damascus, which smote him; and he said, Because the gods of the kings of Syria helped them, [therefore] will I sacrifice to them, that they may help me. But they were the ruin of him, and of all Israel.";
yng[23] = "and he sacrificeth to the gods of Damascus -- those smiting him, and saith, `Because the gods of the kings of Aram are helping them, to them I sacrifice, and they help me,\' and they have been to him to cause him to stumble, and to all Israel.";
dby[23] = "And he sacrificed to the gods of Damascus, which had smitten him; and he said, Since the gods of the kings of Syria help them, I will sacrifice to them, that they may help me. But they were the ruin of him, and of all Israel.";
web[23] = "For he sacrificed to the gods of Damascus, which smote him: and he said, Because the gods of the kings of Syria help them, [therefore] will I sacrifice to them, that they may help me. But they were the ruin of him, and of all Israel.";
hnv[23] = "For he sacrificed to the gods of Dammesek, which struck him; and he said, Because the gods of the kings of Aram helped them, [therefore] will I sacrifice to them, that they may help me. But they were the ruin of him, and of all Yisra\'el.";
vul[23] = "immolavit diis Damasci victimas percussoribus suis et dixit dii regum Syriae auxiliantur eis quos ego placabo hostiis et aderunt mihi cum e contrario ipsi fuerint ruina eius et universo Israhel";
kjv[24] = "And Ahaz gathered together the vessels of the house of God, and cut in pieces the vessels of the house of God, and shut up the doors of the house of the LORD, and he made him altars in every corner of Jerusalem.";
rsv[24] = "And Ahaz gathered together the vessels of the house of God and cut in pieces the vessels of the house of God, and he shut up the doors of the house of the LORD; and he made himself altars in every corner of Jerusalem.";
asv[24] = "And Ahaz gathered together the vessels of the house of God, and cut in pieces the vessels of the house of God, and shut up the doors of the house of Jehovah; and he made him altars in every corner of Jerusalem.";
yng[24] = "And Ahaz gathereth the vessels of the house of God, and cutteth in pieces the vessels of the house of God, and shutteth the doors of the house of Jehovah, and maketh to himself altars in every corner in Jerusalem.";
dby[24] = "And Ahaz gathered the vessels of the house of God, and cut in pieces the vessels of the house of God, and closed the doors of the house of Jehovah, and he made for himself altars in every corner of Jerusalem.";
web[24] = "And Ahaz collected the vessels of the house of God, and cut in pieces the vessels of the house of God, and shut up the doors of the house of the LORD, and he made for himself altars in every corner of Jerusalem.";
hnv[24] = "Achaz gathered together the vessels of the house of God, and cut in pieces the vessels of the house of God, and shut up the doors of the house of the LORD; and he made him altars in every corner of Yerushalayim.";
vul[24] = "direptis itaque Achaz omnibus vasis domus Dei atque confractis clusit ianuas templi Dei et fecit sibi altaria in universis angulis Hierusalem";
kjv[25] = "And in every several city of Judah he made high places to burn incense unto other gods, and provoked to anger the LORD God of his fathers.";
rsv[25] = "In every city of Judah he made high places to burn incense to other gods, provoking to anger the LORD, the God of his fathers.";
asv[25] = "And in every city of Judah he made high places to burn incense unto other gods, and provoked to anger Jehovah, the God of his fathers.";
yng[25] = "And in every city and city of Judah he hath made high places to make perfume to other gods, and provoketh Jehovah, God of his fathers.";
dby[25] = "And in every several city of Judah he made high places to burn incense to other gods, and provoked to anger Jehovah the God of his fathers.";
web[25] = "And in every several city of Judah he made high places to burn incense to other gods, and provoked to anger the LORD God of his fathers.";
hnv[25] = "In every city of Yehudah he made high places to burn incense to other gods, and provoked to anger the LORD, the God of his fathers.";
vul[25] = "in omnibus quoque urbibus Iuda extruxit aras ad cremandum tus atque ad iracundiam provocavit Dominum Deum patrum suorum";
kjv[26] = "Now the rest of his acts and of all his ways, first and last, behold, they [are] written in the book of the kings of Judah and Israel.";
rsv[26] = "Now the rest of his acts and all his ways, from first to last, behold, they are written in the Book of the Kings of Judah and Israel.";
asv[26] = "Now the rest of his acts, and all his ways, first and last, behold, they are written in the book of the kings of Judah and Israel.";
yng[26] = "And the rest of his matters, and all his ways, the first and the last, lo, they are written on the book of the kings of Judah and Israel.";
dby[26] = "And the rest of his acts, and all his ways, first and last, behold, they are written in the book of the kings of Judah and Israel.";
web[26] = "Now the rest of his acts and of all his ways, first and last, behold, they [are] written in the book of the kings of Judah and Israel.";
hnv[26] = " Now the rest of his acts, and all his ways, first and last, behold, they are written in the book of the kings of Yehudah and Yisra\'el.";
vul[26] = "reliqua autem sermonum eius et omnium operum priorum et novissimorum scripta sunt in libro regum Iuda et Israhel";
kjv[27] = "And Ahaz slept with his fathers, and they buried him in the city, [even] in Jerusalem: but they brought him not into the sepulchres of the kings of Israel: and Hezekiah his son reigned in his stead.";
rsv[27] = "And Ahaz slept with his fathers, and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezeki\'ah his son reigned in his stead.";
asv[27] = "And Ahaz slept with his fathers, and they buried him in the city, even in Jerusalem; for they brought him not into the sepulchres of the kings of Israel: and Hezekiah his son reigned in his stead.";
yng[27] = "And Ahaz lieth with his fathers, and they bury him in the city, in Jerusalem, but have not brought him in to the graves of the kings of Israel, and reign doth Hezekiah his son in his stead.";
dby[27] = "And Ahaz slept with his fathers, and they buried him in the city, in Jerusalem; but they brought him not into the sepulchres of the kings of Israel. And Hezekiah his son reigned in his stead.";
web[27] = "And Ahaz slept with his fathers, and they buried him in the city, [even] in Jerusalem: but they brought him not into the sepulchers of the kings of Israel: and Hezekiah his son reigned in his stead.";
hnv[27] = "Achaz slept with his fathers, and they buried him in the city, even in Yerushalayim; for they didn\'t bring him into the tombs of the kings of Yisra\'el: and Hizkiyahu his son reigned in his place.";
vul[27] = "dormivitque Achaz cum patribus suis et sepelierunt eum in civitate Hierusalem neque enim receperunt eum in sepulchra regum Israhel regnavitque Ezechias filius eius pro eo";
</script>
