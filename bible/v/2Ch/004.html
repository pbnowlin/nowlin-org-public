csb[1] = "He made a bronze altar 30 feet long, 30 feet wide, and 15 feet high.";
csb[2] = "Then he made the cast metal basin, 15 feet from brim to brim, perfectly round. It was 7 1/2 feet high and 45 feet in circumference.";
csb[3] = "The likeness of oxen was below it, completely encircling it, ten every half yard, completely surrounding the basin. The oxen were cast in two rows when the basin was cast.";
csb[4] = "It stood on twelve oxen, three facing north, three facing west, three facing south, and three facing east. The basin was on top of them and all their hindquarters were toward the center.";
csb[5] = "The basin was three inches thick, and its rim was fashioned like the brim of a cup or a lily blossom. It could hold eleven thousand gallons.";
csb[6] = "He made ten basins for washing and he put five on the right and five on the left. The parts of the burnt offering were rinsed in them, but the basin was used by the priests for washing.";
csb[7] = "He made the ten gold lampstands according to their specifications and put them in the sanctuary, five on the right and five on the left.";
csb[8] = "He made ten tables and placed them in the sanctuary, five on the right and five on the left. He also made a hundred gold bowls.";
csb[9] = "He made the courtyard of the priests and the large court, and doors for the court. He overlaid the doors with bronze.";
csb[10] = "He put the basin on the right side, toward the southeast.";
csb[11] = "Then Huram made the pots, the shovels, and the bowls. So Huram finished doing the work that he was doing for King Solomon in God\'s temple:";
csb[12] = "two pillars; the bowls and the capitals on top of the two pillars; the two gratings for covering both bowls of the capitals that were on top of the pillars;";
csb[13] = "the four hundred pomegranates for the two gratings (two rows of pomegranates for each grating covering both capitals\' bowls on top of the pillars).";
csb[14] = "He also made the water carts and the basins on the water carts.";
csb[15] = "The one basin and the twelve oxen underneath it,";
csb[16] = "the pots, the shovels, the forks, and all their utensils -- Huram-abi made them for King Solomon for the LORD\'s temple. All these were made of polished bronze.";
csb[17] = "The king had them cast in clay molds in the Jordan Valley between Succoth and Zeredah.";
csb[18] = "Solomon made all these utensils in such great abundance that the weight of the bronze was not determined.";
csb[19] = "Solomon also made all the equipment in God\'s temple: the gold altar; the tables on which to put the Bread of the Presence;";
csb[20] = "the lampstands and their lamps of pure gold to burn in front of the inner sanctuary according to specifications;";
csb[21] = "the flowers, lamps, and gold tongs -- of purest gold;";
csb[22] = "the wick trimmers, sprinkling basins, ladles, and firepans -- of purest gold; and the entryway to the temple, its inner doors to the most holy place, and the doors of the temple sanctuary -- of gold.";

hnv[21] = "and the flowers, and the lamps, and the tongs, of gold, and that perfect gold;";
vul[21] = "et florentia quaedam et lucernas et forcipes aureos omnia de auro mundissimo facta sunt";
kjv[22] = "And the snuffers, and the basons, and the spoons, and the censers, [of] pure gold: and the entry of the house, the inner doors thereof for the most holy [place], and the doors of the house of the temple, [were of] gold.";
rsv[22] = "the snuffers, basins, dishes for incense, and firepans, of pure gold; and the sockets of the temple, for the inner doors to the most holy place and for the doors of the nave of the temple were of gold.";
asv[22] = "and the snuffers, and the basins, and the spoons, and the firepans, of pure gold. And as for the entry of the house, the inner doors thereof for the most holy place, and the doors of the house, [to wit], of the temple, were of gold.";
yng[22] = "and the snuffers, and the bowls, and the spoons, and the censers, of gold refined, and the opening of the house, its innermost doors to the holy of holies, and the doors of the house to the temple, of gold.";
dby[22] = "and the knives, and the bowls, and the cups, and the censers, of pure gold; and the entrance of the house, the inner folding-doors thereof for the most holy place, and the doors of the house, of the temple, of gold.";
web[22] = "And the snuffers, and the basins, and the spoons, and the censers, [of] pure gold: and the entry of the house, the inner doors of it for the most holy [place], and the doors of the house of the temple, [were of] gold.";
hnv[22] = "and the snuffers, and the basins, and the spoons, and the fire pans, of pure gold: and as for the entry of the house, the inner doors of it for the most holy place, and the doors of the house, [to wit], of the temple, were of gold.";
vul[22] = "thymiamateria quoque et turibula et fialas et mortariola ex auro purissimo et ostia celavit templi interioris id est in sancto sanctorum et ostia templi forinsecus aurea sicque conpletum est omne opus quod fecit Salomon in domo Domini";
