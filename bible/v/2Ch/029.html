csb[1] = "Hezekiah was twenty-five years old when he became king, and he reigned twenty-nine years in Jerusalem. His mother\'s name was Abijah daughter of Zechariah.";
csb[2] = "He did what was right in the LORD\'s sight just as his ancestor David had done.";
csb[3] = "In the first year of his reign, in the first month, he opened the doors of the LORD\'s temple and repaired them.";
csb[4] = "Then he brought in the priests and Levites and gathered them in the eastern public square.";
csb[5] = "He said to them, &quot;Hear me, Levites. Consecrate yourselves now and consecrate the temple of the LORD, the God of your ancestors. Remove everything impure from the holy place.";
csb[6] = "&quot;For our fathers were unfaithful and did what is evil in the sight of the LORD our God. They abandoned him, turned their faces away from the LORD\'s dwelling place, and turned their backs on him.";
csb[7] = "&quot;They also closed the doors of the portico, extinguished the lamps, did not burn incense, and did not offer burnt offerings in the holy place of the God of Israel.";
csb[8] = "&quot;Therefore, the wrath of the LORD was on Judah and Jerusalem, and he made them an object of terror, horror, and mockery, as you see with your own eyes.";
csb[9] = "&quot;Our fathers fell by the sword, and our sons, our daughters, and our wives are in captivity because of this.";
csb[10] = "&quot;It is in my heart now to make a covenant with the LORD, the God of Israel so that his burning anger may turn away from us.";
csb[11] = "&quot;My sons, don\'t be negligent now, for the LORD has chosen you to stand in his presence, to serve him, and to be his ministers and burners of incense.&quot;";
csb[12] = "Then the Levites stood up: Mahath son of Amasai and Joel son of Azariah from the Kohathites; Kish son of Abdi and Azariah son of Jehallelel from the Merarites; Joah son of Zimmah and Eden son of Joah from the Gershonites;";
csb[13] = "Shimri and Jeuel from the Elizaphanites; Zechariah and Mattaniah from the Asaphites;";
csb[14] = "Jehiel and Shimei from the Hemanites; Shemaiah and Uzziel from the Jeduthunites.";
csb[15] = "They gathered their brothers together, consecrated themselves, and went according to the king\'s command by the words of the LORD to cleanse the LORD\'s temple.";
csb[16] = "The priests went to the entrance of the LORD\'s temple to cleanse it. They took all the unclean things they found in the LORD\'s sanctuary to the courtyard of the LORD\'s temple. Then the Levites received them and took them outside to the Kidron Valley.";
csb[17] = "They began the consecration on the first day of the first month, and on the eighth day of the month they came to the portico of the LORD\'s temple. They consecrated the LORD\'s temple for eight days, and on the sixteenth day of the first month they finished.";
csb[18] = "Then they went inside to King Hezekiah and said, &quot;We have cleansed the whole temple of the LORD, the altar of burnt offering and all its utensils, and the table for the rows of the Bread of the Presence and all its utensils.";
csb[19] = "&quot;We have set up and consecrated all the utensils that King Ahaz rejected during his reign when he became unfaithful. They are in front of the altar of the LORD.&quot;";
csb[20] = "King Hezekiah got up early, gathered the city officials, and went to the LORD\'s temple.";
csb[21] = "They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. Then he told the descendants of Aaron, the priests, to offer them on the altar of the LORD.";
csb[22] = "So they slaughtered the bulls, and the priests received the blood and splattered it on the altar. They slaughtered the rams and splattered the blood on the altar. They slaughtered the lambs and splattered the blood on the altar.";
csb[23] = "Then they brought the goats for the sin offering right into the presence of the king and the congregation, who laid their hands on them.";
csb[24] = "The priests slaughtered the goats and put their blood on the altar for a sin offering, to make atonement for all Israel, for the king said that the burnt offering and sin offering were for all Israel.";
csb[25] = "Hezekiah stationed the Levites in the LORD\'s temple with cymbals, harps, and lyres according to the command of David, Gad the king\'s seer, and the prophet Nathan. For the command was from the LORD through his prophets.";
csb[26] = "The Levites stood with the instruments of David, and the priests with the trumpets.";
csb[27] = "Then Hezekiah ordered that the burnt offering be offered on the altar. When the burnt offerings began, the song of the LORD and the trumpets began, accompanied by the instruments of King David of Israel.";
csb[28] = "The whole assembly was worshiping, singing the song, and blowing the trumpets -- all this continued until the burnt offering was completed.";
csb[29] = "When the burnt offerings were completed, the king and all those present with him bowed down and worshiped.";
csb[30] = "Then King Hezekiah and the officials told the Levites to sing praise to the LORD in the words of David and of the seer Asaph. So they sang praises with rejoicing and knelt low and worshiped.";
csb[31] = "Hezekiah concluded, &quot;Now you are consecrated to the LORD. Come near and bring sacrifices and thank offerings to the LORD\'s temple.&quot; So the congregation brought sacrifices and thank offerings, and all those with willing hearts brought burnt offerings.";
csb[32] = "The number of burnt offerings the congregation brought was seventy bulls, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.";
csb[33] = "Six hundred bulls and three thousand sheep and goats were consecrated.";
csb[34] = "However, since there were not enough priests, they weren\'t able to skin all the burnt offerings, so their Levite brothers helped them until the work was finished and until the priests consecrated themselves. For the Levites were more conscientious to consecrate themselves than the priests were.";
csb[35] = "Furthermore, the burnt offerings were abundant, along with the fat of the fellowship offerings and with the drink offerings for the burnt offering. So the service of the LORD\'s temple was established.";
csb[36] = "Then Hezekiah and all the people rejoiced over how God had prepared the people, for it had come about suddenly.";
kjv[1] = "Hezekiah began to reign [when he was] five and twenty years old, and he reigned nine and twenty years in Jerusalem. And his mother\'s name [was] Abijah, the daughter of Zechariah.";
kjv[2] = "And he did [that which was] right in the sight of the LORD, according to all that David his father had done.";
kjv[3] = "He in the first year of his reign, in the first month, opened the doors of the house of the LORD, and repaired them.";
kjv[4] = "And he brought in the priests and the Levites, and gathered them together into the east street,";
kjv[5] = "And said unto them, Hear me, ye Levites, sanctify now yourselves, and sanctify the house of the LORD God of your fathers, and carry forth the filthiness out of the holy [place].";
kjv[6] = "For our fathers have trespassed, and done [that which was] evil in the eyes of the LORD our God, and have forsaken him, and have turned away their faces from the habitation of the LORD, and turned [their] backs.";
kjv[7] = "Also they have shut up the doors of the porch, and put out the lamps, and have not burned incense nor offered burnt offerings in the holy [place] unto the God of Israel.";
kjv[8] = "Wherefore the wrath of the LORD was upon Judah and Jerusalem, and he hath delivered them to trouble, to astonishment, and to hissing, as ye see with your eyes.";
kjv[9] = "For, lo, our fathers have fallen by the sword, and our sons and our daughters and our wives [are] in captivity for this.";
kjv[10] = "Now [it is] in mine heart to make a covenant with the LORD God of Israel, that his fierce wrath may turn away from us.";
kjv[11] = "My sons, be not now negligent: for the LORD hath chosen you to stand before him, to serve him, and that ye should minister unto him, and burn incense.";
kjv[12] = "Then the Levites arose, Mahath the son of Amasai, and Joel the son of Azariah, of the sons of the Kohathites: and of the sons of Merari, Kish the son of Abdi, and Azariah the son of Jehalelel: and of the Gershonites; Joah the son of Zimmah, and Eden the son of Joah:";
kjv[13] = "And of the sons of Elizaphan; Shimri, and Jeiel: and of the sons of Asaph; Zechariah, and Mattaniah:";
kjv[14] = "And of the sons of Heman; Jehiel, and Shimei: and of the sons of Jeduthun; Shemaiah, and Uzziel.";
kjv[15] = "And they gathered their brethren, and sanctified themselves, and came, according to the commandment of the king, by the words of the LORD, to cleanse the house of the LORD.";
kjv[16] = "And the priests went into the inner part of the house of the LORD, to cleanse [it], and brought out all the uncleanness that they found in the temple of the LORD into the court of the house of the LORD. And the Levites took [it], to carry [it] out abroad into the brook Kidron.";
kjv[17] = "Now they began on the first [day] of the first month to sanctify, and on the eighth day of the month came they to the porch of the LORD: so they sanctified the house of the LORD in eight days; and in the sixteenth day of the first month they made an end.";
kjv[18] = "Then they went in to Hezekiah the king, and said, We have cleansed all the house of the LORD, and the altar of burnt offering, with all the vessels thereof, and the shewbread table, with all the vessels thereof.";
kjv[19] = "Moreover all the vessels, which king Ahaz in his reign did cast away in his transgression, have we prepared and sanctified, and, behold, they [are] before the altar of the LORD.";
kjv[20] = "Then Hezekiah the king rose early, and gathered the rulers of the city, and went up to the house of the LORD.";
kjv[21] = "And they brought seven bullocks, and seven rams, and seven lambs, and seven he goats, for a sin offering for the kingdom, and for the sanctuary, and for Judah. And he commanded the priests the sons of Aaron to offer [them] on the altar of the LORD.";
kjv[22] = "So they killed the bullocks, and the priests received the blood, and sprinkled [it] on the altar: likewise, when they had killed the rams, they sprinkled the blood upon the altar: they killed also the lambs, and they sprinkled the blood upon the altar.";
kjv[23] = "And they brought forth the he goats [for] the sin offering before the king and the congregation; and they laid their hands upon them:";
kjv[24] = "And the priests killed them, and they made reconciliation with their blood upon the altar, to make an atonement for all Israel: for the king commanded [that] the burnt offering and the sin offering [should be made] for all Israel.";
kjv[25] = "And he set the Levites in the house of the LORD with cymbals, with psalteries, and with harps, according to the commandment of David, and of Gad the king\'s seer, and Nathan the prophet: for [so was] the commandment of the LORD by his prophets.";
kjv[26] = "And the Levites stood with the instruments of David, and the priests with the trumpets.";
kjv[27] = "And Hezekiah commanded to offer the burnt offering upon the altar. And when the burnt offering began, the song of the LORD began [also] with the trumpets, and with the instruments [ordained] by David king of Israel.";
kjv[28] = "And all the congregation worshipped, and the singers sang, and the trumpeters sounded: [and] all [this continued] until the burnt offering was finished.";
kjv[29] = "And when they had made an end of offering, the king and all that were present with him bowed themselves, and worshipped.";
kjv[30] = "Moreover Hezekiah the king and the princes commanded the Levites to sing praise unto the LORD with the words of David, and of Asaph the seer. And they sang praises with gladness, and they bowed their heads and worshipped.";
kjv[31] = "Then Hezekiah answered and said, Now ye have consecrated yourselves unto the LORD, come near and bring sacrifices and thank offerings into the house of the LORD. And the congregation brought in sacrifices and thank offerings; and as many as were of a free heart burnt offerings.";
kjv[32] = "And the number of the burnt offerings, which the congregation brought, was threescore and ten bullocks, an hundred rams, [and] two hundred lambs: all these [were] for a burnt offering to the LORD.";
kjv[33] = "And the consecrated things [were] six hundred oxen and three thousand sheep.";
kjv[34] = "But the priests were too few, so that they could not flay all the burnt offerings: wherefore their brethren the Levites did help them, till the work was ended, and until the [other] priests had sanctified themselves: for the Levites [were] more upright in heart to sanctify themselves than the priests.";
kjv[35] = "And also the burnt offerings [were] in abundance, with the fat of the peace offerings, and the drink offerings for [every] burnt offering. So the service of the house of the LORD was set in order.";
kjv[36] = "And Hezekiah rejoiced, and all the people, that God had prepared the people: for the thing was [done] suddenly.";

dby[13] = "and of the sons of Elizaphan, Shimri and Jeiel; and of the sons of Asaph, Zechariah and Mattaniah;";
web[13] = "And of the sons of Elizaphan; Shimri, and Jeiel: and of the sons of Asaph; Zechariah, and Mattaniah:";
hnv[13] = "and of the sons of Elitzafan, Shimri and Ye`u\'el; and of the sons of Asaf, Zekharyah and Mattanyah;";
vul[13] = "at vero de filiis Elisaphan Samri et Iahihel de filiis quoque Asaph Zaccharias et Mathanias";
rsv[14] = "and of the sons of Heman, Jehu\'el and Shim\'e-i; and of the sons of Jedu\'thun, Shemai\'ah and Uz\'ziel.";
asv[14] = "and of the sons of Heman, Jehuel and Shimei; and of the sons of Jeduthun, Shemaiah and Uzziel.";
yng[14] = "and of the sons of Heman: Jehiel and Shimei; and of the sons of Jeduthun: Shemaiah and Uzziel --";
dby[14] = "and of the sons of Heman, Jehiel and Shimei; and of the sons of Jeduthun, Shemaiah and Uzziel.";
web[14] = "And of the sons of Heman; Jehiel, and Shimei: and of the sons of Jeduthun; Shemaiah, and Uzziel.";
hnv[14] = "and of the sons of Heman, Yechi\'el and Shim`i; and of the sons of Yedutun, Shemayah and `Uzzi\'el.";
vul[14] = "necnon de filiis Heman Iahihel et Semei sed et de filiis Idithun Semeias et Ozihel";
rsv[15] = "They gathered their brethren, and sanctified themselves, and went in as the king had commanded, by the words of the LORD, to cleanse the house of the LORD.";
asv[15] = "And they gathered their brethren, and sanctified themselves, and went in, according to the commandment of the king by the words of Jehovah, to cleanse the house of Jehovah.";
yng[15] = "and they gather their brethren, and sanctify themselves, and come in, according to the command of the king in the matters of Jehovah, to cleanse the house of Jehovah,";
dby[15] = "And they gathered their brethren, and hallowed themselves, and came, according to the commandment of the king by the words of Jehovah, to cleanse the house of Jehovah.";
web[15] = "And they assembled their brethren, and sanctified themselves, and came, according to the commandment of the king, by the words of the LORD, to cleanse the house of the LORD.";
hnv[15] = "They gathered their brothers, and sanctified themselves, and went in, according to the mitzvah of the king by the words of the LORD, to cleanse the house of the LORD.";
vul[15] = "congregaveruntque fratres suos et sanctificati sunt et ingressi iuxta mandatum regis et imperium Domini ut expiarent domum Dei";
rsv[16] = "The priests went into the inner part of the house of the LORD to cleanse it, and they brought out all the uncleanness that they found in the temple of the LORD into the court of the house of the LORD; and the Levites took it and carried it out to the brook Kidron.";
asv[16] = "And the priests went in unto the inner part of the house of Jehovah, to cleanse it, and brought out all the uncleanness that they found in the temple of Jehovah into the court of the house of Jehovah. And the Levites took it, to carry it out abroad to the brook Kidron.";
yng[16] = "and the priests come in to the inner part of the house of Jehovah to cleanse [it], and bring out all the uncleanness that they have found in the temple of Jehovah to the court of the house of Jehovah, and the Levites receive [it], to take [it] out to the brook Kidron without.";
dby[16] = "And the priests went into the inner part of the house of Jehovah to cleanse it, and carried forth all the uncleanness that they found in the temple of Jehovah, into the court of the house of Jehovah. And the Levites took it to carry it forth into the brook Kidron.";
web[16] = "And the priests went into the inner part of the house of the LORD, to cleanse [it], and brought out all the uncleanness that they found in the temple of the LORD into the court of the house of the LORD. And the Levites took [it], to carry [it] out abroad into the brook Kidron.";
hnv[16] = "The Kohanim went in to the inner part of the house of the LORD, to cleanse it, and brought out all the uncleanness that they found in the temple of the LORD into the court of the house of the LORD. The Levites took it, to carry it out abroad to the brook Kidron.";
vul[16] = "sacerdotes quoque ingressi templum Domini ut sanctificarent illud extulerunt omnem inmunditiam quam intro reppererant in vestibulum domus Domini quam tulerunt Levitae et asportaverunt ad torrentem Cedron foras";
rsv[17] = "They began to sanctify on the first day of the first month, and on the eighth day of the month they came to the vestibule of the LORD; then for eight days they sanctified the house of the LORD, and on the sixteenth day of the first month they finished.";
asv[17] = "Now they began on the first [day] of the first month to sanctify, and on the eighth day of the month came they to the porch of Jehovah; and they sanctified the house of Jehovah in eight days: and on the sixteenth day of the first month they made an end.";
yng[17] = "And they begin on the first of the first month to sanctify, and on the eighth day of the month they have come to the porch of Jehovah, and they sanctify the house of Jehovah in eight days, and on the sixteenth day of the first month they have finished.";
dby[17] = "And they began on the first of the first month to hallow, and on the eighth day of the month they came to the porch of Jehovah; and they hallowed the house of Jehovah eight days; and on the sixteenth day of the first month they made an end.";
web[17] = "Now they began on the first [day] of the first month to sanctify, and on the eighth day of the month they came to the porch of the LORD: so they sanctified the house of the LORD in eight days; and on the sixteenth day of the first month they made an end.";
hnv[17] = "Now they began on the first [day] of the first month to sanctify, and on the eighth day of the month came they to the porch of the LORD; and they sanctified the house of the LORD in eight days: and on the sixteenth day of the first month they made an end.";
vul[17] = "coeperunt autem prima die mensis primi mundare et in die octava eiusdem mensis ingressi sunt porticum templi Domini expiaveruntque templum diebus octo et in die sextadecima mensis eiusdem quod coeperant impleverunt";
rsv[18] = "Then they went in to Hezeki\'ah the king and said, &quot;We have cleansed all the house of the LORD, the altar of burnt offering and all its utensils, and the table for the showbread and all its utensils.";
asv[18] = "Then they went in to Hezekiah the king within [the palace], and said, We have cleansed all the house of Jehovah, and the altar of burnt-offering, with all the vessels thereof, and the table of showbread, with all the vessels thereof.";
yng[18] = "And they come in within unto Hezekiah the king, and say, `We have cleansed all the house of Jehovah, and the altar of the burnt-offering, and all its vessels, and the table of the arrangement, and all its vessels,";
dby[18] = "And they went in to king Hezekiah, and said, We have cleansed all the house of Jehovah, and the altar of burnt-offering with all its vessels, and the table of the [bread] to be set in rows, and all its vessels;";
web[18] = "Then they went in to Hezekiah the king, and said, We have cleansed all the house of the LORD, and the altar of burnt-offering, with all its vessels, and the show-bread table, with all its vessels.";
hnv[18] = "Then they went in to Hizkiyahu the king within [the palace], and said, We have cleansed all the house of the LORD, and the altar of burnt offering, with all the vessels of it, and the table of show bread, with all the vessels of it.";
vul[18] = "ingressi quoque sunt ad Ezechiam regem et dixerunt ei sanctificavimus omnem domum Domini et altare holocaustoseos vasaque eius necnon et mensam propositionis cum omnibus vasis suis";
rsv[19] = "All the utensils which King Ahaz discarded in his reign when he was faithless, we have made ready and sanctified; and behold, they are before the altar of the LORD.&quot;";
asv[19] = "Moreover all the vessels, which king Ahaz in his reign did cast away when he trespassed, have we prepared and sanctified; and, behold, they are before the altar of Jehovah.";
yng[19] = "and all the vessels that king Ahaz cast away in his reign -- in his trespass -- we have prepared and sanctified, and lo, they [are] before the altar of Jehovah.\'";
dby[19] = "and all the vessels that king Ahaz in his reign cast away in his transgression have we prepared and hallowed, and behold, they are before the altar of Jehovah.";
web[19] = "Moreover all the vessels, which king Ahaz in his reign cast away in his transgression, have we prepared and sanctified, and behold, they [are] before the altar of the LORD.";
hnv[19] = "Moreover all the vessels, which king Achaz in his reign did cast away when he trespassed, have we prepared and sanctified; and, behold, they are before the altar of the LORD.";
vul[19] = "cunctamque templi supellectilem quam polluerat rex Achaz in regno suo postquam praevaricatus est et ecce exposita sunt omnia coram altari Domini";
rsv[20] = "Then Hezeki\'ah the king rose early and gathered the officials of the city, and went up to the house of the LORD.";
asv[20] = "Then Hezekiah the king arose early, and gathered the princes of the city, and went up to the house of Jehovah.";
yng[20] = "And Hezekiah the king riseth early, and gathereth the heads of the city, and goeth up to the house of Jehovah;";
dby[20] = "And Hezekiah the king arose early, and gathered the princes of the city, and went up to the house of Jehovah.";
web[20] = "Then Hezekiah the king rose early, and convened the rulers of the city, and went up to the house of the LORD.";
hnv[20] = "Then Hizkiyahu the king arose early, and gathered the princes of the city, and went up to the house of the LORD.";
vul[20] = "consurgensque diluculo Ezechias rex adunavit omnes principes civitatis et ascendit domum Domini";
rsv[21] = "And they brought seven bulls, seven rams, seven lambs, and seven he-goats for a sin offering for the kingdom and for the sanctuary and for Judah. And he commanded the priests the sons of Aaron to offer them on the altar of the LORD.";
asv[21] = "And they brought seven bullocks, and seven rams, and seven lambs, and seven he-goats, for a sin-offering for the kingdom and for the sanctuary and for Judah. And he commanded the priests the sons of Aaron to offer them on the altar of Jehovah.";
yng[21] = "and they bring in seven bullocks, and seven rams, and seven lambs, and seven young he-goats, for a sin-offering for the kingdom, and for the sanctuary, and for Judah; and he saith to sons of Aaron, the priests, to cause [them] to ascend on the altar of Jehovah.";
dby[21] = "And they brought seven bullocks, and seven rams, and seven lambs, and seven he-goats for a sin-offering for the kingdom, and for the sanctuary, and for Judah. And he commanded the priests the sons of Aaron to offer [them] upon the altar of Jehovah.";
web[21] = "And they brought seven bullocks, and seven rams, and seven lambs, and seven he-goats, for a sin-offering for the kingdom, and for the sanctuary, and for Judah. And he commanded the priests the sons of Aaron to offer [them] on the altar of the LORD.";
hnv[21] = "They brought seven bulls, and seven rams, and seven lambs, and seven male goats, for a sin-offering for the kingdom and for the sanctuary and for Yehudah. He commanded the Kohanim the sons of Aharon to offer them on the altar of the LORD.";
vul[21] = "obtuleruntque simul tauros septem arietes septem agnos septem et hircos septem pro peccato pro regno pro sanctuario pro Iuda dixit quoque sacerdotibus filiis Aaron ut offerrent super altare Domini";
rsv[22] = "So they killed the bulls, and the priests received the blood and threw it against the altar; and they killed the rams and their blood was thrown against the altar; and they killed the lambs and their blood was thrown against the altar.";
asv[22] = "So they killed the bullocks, and the priests received the blood, and sprinkled it on the altar: and they killed the rams, and sprinkled the blood upon the altar: they killed also the lambs, and sprinkled the blood upon the altar.";
yng[22] = "And they slaughter the oxen, and the priests receive the blood, and sprinkle on the altar; and they slaughter the rams, and sprinkle the blood on the altar; and they slaughter the lambs, and sprinkle the blood on the altar;";
dby[22] = "And they slaughtered the bullocks, and the priests received the blood, and sprinkled it on the altar; and they slaughtered the rams, and sprinkled the blood on the altar; and they slaughtered the lambs, and sprinkled the blood on the altar.";
web[22] = "So they killed the bullocks, and the priests received the blood, and sprinkled [it] on the altar: likewise, when they had killed the rams, they sprinkled the blood upon the altar: they killed also the lambs, and they sprinkled the blood upon the altar.";
hnv[22] = "So they killed the bulls, and the Kohanim received the blood, and sprinkled it on the altar: and they killed the rams, and sprinkled the blood on the altar: they killed also the lambs, and sprinkled the blood on the altar.";
vul[22] = "mactaverunt igitur tauros et susceperunt sacerdotes sanguinem et fuderunt illud super altare mactaverunt etiam arietes et illorum sanguinem super altare fuderunt immolaverunt agnos et fuderunt super altare sanguinem";
rsv[23] = "Then the he-goats for the sin offering were brought to the king and the assembly, and they laid their hands upon them,";
asv[23] = "And they brought near the he-goats for the sin-offering before the king and the assembly; and they laid their hands upon them:";
yng[23] = "and they bring nigh the he-goats of the sin-offering before the king and the assembly, and they lay their hands upon them;";
dby[23] = "And they brought near the he-goats of the sin-offering before the king and the congregation; and they laid their hands upon them.";
web[23] = "And they brought forth the he-goats [for] the sin-offering before the king and the congregation; and they laid their hands upon them:";
hnv[23] = "They brought near the male goats for the sin-offering before the king and the assembly; and they laid their hands on them:";
vul[23] = "adplicaverunt hircos pro peccato coram rege et universa multitudine inposueruntque manus suas super eos";
rsv[24] = "and the priests killed them and made a sin offering with their blood on the altar, to make atonement for all Israel. For the king commanded that the burnt offering and the sin offering should be made for all Israel.";
asv[24] = "and the priests killed them, and they made a sin-offering with their blood upon the altar, to make atonement for all Israel; for the king commanded [that] the burnt-offering and the sin-offering [should be made] for all Israel.";
yng[24] = "and the priests slaughter them, and make a sin-offering with their blood on the altar, to make atonement for all Israel, for `For all Israel,\' said the king, `[is] the burnt-offering and the sin-offering.\'";
dby[24] = "And the priests slaughtered them, and they made purification for sin with their blood upon the altar, to make an atonement for all Israel; because for all Israel, said the king, is the burnt-offering and the sin-offering.";
web[24] = "And the priests killed them, and they made reconciliation with their blood upon the altar, to make an atonement for all Israel: for the king commanded [that] the burnt-offering and the sin-offering [should be made] for all Israel.";
hnv[24] = "and the Kohanim killed them, and they made a sin-offering with their blood on the altar, to make atonement for all Yisra\'el; for the king commanded [that] the burnt offering and the sin-offering [should be made] for all Yisra\'el.";
vul[24] = "et immolaverunt illos sacerdotes et asperserunt sanguinem eorum altari pro piaculo universi Israhelis pro omni quippe Israhel praeceperat rex ut holocaustum fieret et pro peccato";
rsv[25] = "And he stationed the Levites in the house of the LORD with cymbals, harps, and lyres, according to the commandment of David and of Gad the king\'s seer and of Nathan the prophet; for the commandment was from the LORD through his prophets.";
asv[25] = "And he set the Levites in the house of Jehovah with cymbals, with psalteries, and with harps, according to the commandment of David, and of Gad the king\'s seer, and Nathan the prophet; for the commandment was of Jehovah by his prophets.";
yng[25] = "And he appointeth the Levites in the house of Jehovah with cymbals, with psalteries, and with harps, by the command of David, and of Gad, seer of the king, and of Nathan the prophet, for by the hand of Jehovah [is] the command, by the hand of His prophets;";
dby[25] = "And he set the Levites in the house of Jehovah with cymbals, with lutes, and with harps, according to the commandment of David, and of Gad the king\'s seer, and of Nathan the prophet; for the commandment was of Jehovah through his prophets.";
web[25] = "And he set the Levites in the house of the LORD with cymbals, with psalteries, and with harps, according to the commandment of David, and of Gad the king\'s seer, and Nathan the prophet: for [so was] the commandment of the LORD by his prophets.";
hnv[25] = "He set the Levites in the house of the LORD with cymbals, with psalteries, and with harps, according to the mitzvah of David, and of Gad the king\'s seer, and Natan the prophet; for the mitzvah was of the LORD by his prophets.";
vul[25] = "constituit quoque Levitas in domo Domini cum cymbalis et psalteriis et citharis secundum dispositionem David et Gad videntis regis et Nathan prophetae siquidem Domini praeceptum fuit per manum prophetarum eius";
rsv[26] = "The Levites stood with the instruments of David, and the priests with the trumpets.";
asv[26] = "And the Levites stood with the instruments of David, and the priests with the trumpets.";
yng[26] = "and the Levites stand with the instruments of David, and the priests with the trumpets.";
dby[26] = "And the Levites stood with the instruments of David, and the priests with the trumpets.";
web[26] = "And the Levites stood with the instruments of David, and the priests with the trumpets.";
hnv[26] = "The Levites stood with the instruments of David, and the Kohanim with the trumpets.";
vul[26] = "steteruntque Levitae tenentes organa David et sacerdotes tubas";
rsv[27] = "Then Hezeki\'ah commanded that the burnt offering be offered on the altar. And when the burnt offering began, the song to the LORD began also, and the trumpets, accompanied by the instruments of David king of Israel.";
asv[27] = "And Hezekiah commanded to offer the burnt-offering upon the altar. And when the burnt-offering began, the song of Jehovah began also, and the trumpets, together with the instruments of David king of Israel.";
yng[27] = "And Hezekiah saith to cause the burnt-offering to ascend on the altar; and at the time the burnt-offering began -- began the song of Jehovah, and the trumpets, even by the hands of the instruments of David king of Israel.";
dby[27] = "And Hezekiah commanded to offer up the burnt-offering on the altar. And at the moment the burnt-offering began, the song of Jehovah began, and the trumpets, accompanied by the instruments of David king of Israel.";
web[27] = "And Hezekiah commanded to offer the burnt-offering upon the altar. And when the burnt-offering began, the song of the LORD began [also] with the trumpets, and with the instruments [ordained] by David king of Israel.";
hnv[27] = "Hizkiyahu commanded to offer the burnt offering on the altar. When the burnt offering began, the song of the LORD began also, and the trumpets, together with the instruments of David king of Yisra\'el.";
vul[27] = "et iussit Ezechias ut offerrent holocaustum super altare cumque offerrentur holocausta coeperunt laudes canere Domino et clangere tubis atque in diversis organis quae David rex Israhel reppererat concrepare";
rsv[28] = "The whole assembly worshiped, and the singers sang, and the trumpeters sounded; all this continued until the burnt offering was finished.";
asv[28] = "And all the assembly worshipped, and the singers sang, and the trumpeters sounded; all this [continued] until the burnt-offering was finished.";
yng[28] = "And all the assembly are doing obeisance, and the singers singing, and the trumpeters blowing; the whole [is] till the completion of the burnt-offering.";
dby[28] = "And all the congregation worshipped, and the singers sang, and the trumpeters sounded, all [the time] until the burnt-offering was finished.";
web[28] = "And all the congregation worshiped, and the singers sang, and the trumpeters sounded: [and] all [this continued] until the burnt-offering was finished.";
hnv[28] = "All the assembly worshiped, and the singers sang, and the trumpeters sounded; all this [continued] until the burnt offering was finished.";
vul[28] = "omni autem turba adorante cantores et hii qui tenebant tubas erant in officio suo donec conpleretur holocaustum";
rsv[29] = "When the offering was finished, the king and all who were present with him bowed themselves and worshiped.";
asv[29] = "And when they had made an end of offering, the king and all that were present with him bowed themselves and worshipped.";
yng[29] = "And at the completion of the offering up bowed have the king and all those found with him, and do obeisance.";
dby[29] = "And when they had ended offering the burnt-offering, the king and all that were present with him bowed themselves and worshipped.";
web[29] = "And when they had made an end of offering, the king and all that were present with him bowed themselves, and worshiped.";
hnv[29] = "When they had made an end of offering, the king and all who were present with him bowed themselves and worshiped.";
vul[29] = "cumque finita esset oblatio incurvatus est rex et omnes qui erant cum eo et adoraverunt";
rsv[30] = "And Hezeki\'ah the king and the princes commanded the Levites to sing praises to the LORD with the words of David and of Asaph the seer. And they sang praises with gladness, and they bowed down and worshiped.";
asv[30] = "Moreover Hezekiah the king and the princes commanded the Levites to sing praises unto Jehovah with the words of David, and of Asaph the seer. And they sang praises with gladness, and they bowed their heads and worshipped.";
yng[30] = "And Hezekiah the king saith, and the princes, to the Levites to give praise to Jehovah in the words of David, and of Asaph the seer, and they praise -- unto joy, and they bow, and do obeisance.";
dby[30] = "And king Hezekiah and the princes commanded the Levites to sing praise to Jehovah with the words of David, and of Asaph the seer. And they sang praises with gladness, and bowed their heads and worshipped.";
web[30] = "Moreover, Hezekiah the king and the princes commanded the Levites to sing praise to the LORD, with the words of David, and of Asaph the seer. And they sang praises with gladness, and they bowed their heads and worshiped.";
hnv[30] = "Moreover Hizkiyahu the king and the princes commanded the Levites to sing praises to the LORD with the words of David, and of Asaf the seer. They sang praises with gladness, and they bowed their heads and worshiped.";
vul[30] = "praecepitque Ezechias et principes Levitis ut laudarent Dominum sermonibus David et Asaph videntis qui laudaverunt eum magna laetitia et curvato genu adoraverunt";
rsv[31] = "Then Hezeki\'ah said, &quot;You have now consecrated yourselves to the LORD; come near, bring sacrifices and thank offerings to the house of the LORD.&quot; And the assembly brought sacrifices and thank offerings; and all who were of a willing heart brought burnt offerings.";
asv[31] = "Then Hezekiah answered and said, Now ye have consecrated yourselves unto Jehovah; come near and bring sacrifices and thank-offerings into the house of Jehovah. And the assembly brought in sacrifices and thank-offerings; and as many as were of a willing heart [brought] burnt-offerings.";
yng[31] = "And Hezekiah answereth and saith, `Now ye have filled your hand to Jehovah, come nigh, and bring in sacrifices and thank-offerings to the house of Jehovah;\' and the assembly bring in sacrifices and thank-offerings, and every willing-hearted one -- burnt-offerings.";
dby[31] = "And Hezekiah answered and said, Now ye have consecrated yourselves to Jehovah, come near and bring sacrifices and thank-offerings into the house of the Lord. And the congregation brought in sacrifices and thank-offerings; and as many as were of a willing heart, burnt-offerings.";
web[31] = "Then Hezekiah answered and said, Now ye have consecrated yourselves to the LORD, come near and bring sacrifices and thank-offerings into the house of the LORD. And the congregation brought in sacrifices and thank-offerings; and, as many as were of a free heart, burnt-offerings.";
hnv[31] = "Then Hizkiyahu answered, Now you have consecrated yourselves to the LORD; come near and bring sacrifices and thank-offerings into the house of the LORD. The assembly brought in sacrifices and thank-offerings; and as many as were of a willing heart [brought] burnt offerings.";
vul[31] = "Ezechias autem etiam haec addidit implestis manus vestras Domino accedite et offerte victimas et laudes in domo Domini obtulit ergo universa multitudo hostias et laudes et holocausta mente devota";
rsv[32] = "The number of the burnt offerings which the assembly brought was seventy bulls, a hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.";
asv[32] = "And the number of the burnt-offerings which the assembly brought was threescore and ten bullocks, a hundred rams, and two hundred lambs: all these were for a burnt-offering to Jehovah.";
yng[32] = "And the number of the burnt-offerings that the assembly have brought in, is seventy oxen, a hundred rams, lambs two hundred; for a burnt-offering to Jehovah [are] all these.";
dby[32] = "And the number of the burnt-offerings, which the congregation brought, was seventy bullocks, a hundred rams, two hundred lambs: all these were for a burnt-offering to Jehovah.";
web[32] = "And the number of the burnt-offerings, which the congregation brought, was seventy bullocks, a hundred rams: [and] two hundred lambs: all these [were] for a burnt-offering to the LORD.";
hnv[32] = "The number of the burnt offerings which the assembly brought was seventy bulls, one hundred rams, and two hundred lambs: all these were for a burnt offering to the LORD.";
vul[32] = "porro numerus holocaustorum quae obtulit multitudo hic fuit tauros septuaginta arietes centum agnos ducentos";
rsv[33] = "And the consecrated offerings were six hundred bulls and three thousand sheep.";
asv[33] = "And the consecrated things were six hundred oxen and three thousand sheep.";
yng[33] = "And the sanctified things [are] oxen six hundred, and sheep three thousand.";
dby[33] = "And the consecrated things were six hundred oxen and three thousand sheep.";
web[33] = "And the consecrated things [were] six hundred oxen and three thousand sheep.";
hnv[33] = " The consecrated things were six hundred oxen and three thousand sheep.";
vul[33] = "sanctificaveruntque Domino boves sescentos et oves tria milia";
rsv[34] = "But the priests were too few and could not flay all the burnt offerings, so until other priests had sanctified themselves their brethren the Levites helped them, until the work was finished--for the Levites were more upright in heart than the priests in sanctifying themselves.";
asv[34] = "But the priests were too few, so that they could not flay all the burnt-offerings: wherefore their brethren the Levites did help them, till the work was ended, and until the priests had sanctified themselves; for the Levites were more upright in heart to sanctify themselves than the priests.";
yng[34] = "Only, the priests have become few, and have not been able to strip the whole of the burnt-offerings, and their brethren the Levites strengthen them till the completion of the work, and till the priests sanctify themselves, for the Levites [are] more upright of heart to sanctify themselves than the priests.";
dby[34] = "Only the priests were too few, and they could not flay all the burnt-offerings; therefore their brethren the Levites helped them, until the work was ended, and until the priests had hallowed themselves; for the Levites were more upright in heart to hallow themselves than the priests.";
web[34] = "But the priests were too few, so that they could not flay all the burnt-offerings: wherefore their brethren the Levites helped them, till the work was ended, and until the [other] priests had sanctified themselves: for the Levites [were] more upright in heart to sanctify themselves than the priests.";
