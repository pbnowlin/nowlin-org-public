csb[1] = "Then the inhabitants of Jerusalem made Ahaziah, his youngest son, king in his place, because the troops that had come with the Arabs to the camp had killed all the older sons. So Ahaziah son of Jehoram became king of Judah.";
csb[2] = "Ahaziah was twenty-two years old when he became king, and he reigned one year in Jerusalem. His mother\'s name was Athaliah, granddaughter of Omri.";
csb[3] = "He walked in the ways of the house of Ahab, for his mother gave him evil advice.";
csb[4] = "So he did what was evil in the LORD\'s sight like the house of Ahab, for they were his advisers after the death of his father, to his destruction.";
csb[5] = "He also followed their advice and went with Joram son of Israel\'s King Ahab to fight against King Hazael of Aram, in Ramoth-gilead. The Arameans wounded Joram,";
csb[6] = "so he returned to Jezreel to recover from the wounds they inflicted on him in Ramoth-gilead when he fought against King Hazael of Aram. Then Judah\'s King Ahaziah son of Jehoram went down to Jezreel to visit Joram son of Ahab since Joram was ill.";
csb[7] = "Ahaziah\'s downfall came from God when he went to Joram. When Ahaziah arrived, he went out with Joram to meet Jehu son of Nimshi, whom the LORD had anointed to destroy the house of Ahab.";
csb[8] = "So when Jehu executed judgment on the house of Ahab, he found the rulers of Judah and the sons of Ahaziah\'s brothers who were serving Ahaziah, and he killed them.";
csb[9] = "Then Jehu looked for Ahaziah, and Jehu\'s soldiers captured him (he was hiding in Samaria). So they brought Ahaziah to Jehu, and they killed him. The soldiers buried him, for they said, &quot;He is the grandson of Jehoshaphat who sought the LORD with all his heart.&quot; So no one from the house of Ahaziah had the strength to rule the kingdom.";
csb[10] = "When Athaliah, Ahaziah\'s mother, saw that her son was dead, she proceeded to annihilate all the royal heirs of the house of Judah.";
csb[11] = "Jehoshabeath, the king\'s daughter, rescued Joash son of Ahaziah from the king\'s sons who were being killed and put him and the one who nursed him in a bedroom. Now Jehoshabeath was the daughter of King Jehoram and the wife of the priest Jehoiada. Since she was Ahaziah\'s sister, she hid Joash from Athaliah so that she did not kill him.";
csb[12] = "While Athaliah reigned over the land, he was hiding with them in God\'s temple six years.";
kjv[1] = "And the inhabitants of Jerusalem made Ahaziah his youngest son king in his stead: for the band of men that came with the Arabians to the camp had slain all the eldest. So Ahaziah the son of Jehoram king of Judah reigned.";
rsv[1] = "And the inhabitants of Jerusalem made Ahazi\'ah his youngest son king in his stead; for the band of men that came with the Arabs to the camp had slain all the older sons. So Ahazi\'ah the son of Jeho\'ram king of Judah reigned.";
asv[1] = "And the inhabitants of Jerusalem made Ahaziah his youngest son king in his stead; for the band of men that came with the Arabians to the camp had slain all the eldest. So Ahaziah the son of Jehoram king of Judah reigned.";
yng[1] = "And the inhabitants of Jerusalem cause Ahaziah his youngest son to reign in his stead, (for all the elder had the troop slain that came in with the Arabians to the camp,) and Ahaziah son of Jehoram king of Judah reigneth.";
dby[1] = "And the inhabitants of Jerusalem made Ahaziah his youngest son king in his stead; for the band of men that came in the camp with the Arabians had slain all the elder ones. And Ahaziah the son of Jehoram king of Judah reigned.";
web[1] = "And the inhabitants of Jerusalem made Ahaziah his youngest son king in his stead: for the band of men that came with the Arabians to the camp had slain all the eldest. So Ahaziah the son of Jehoram king of Judah reigned.";
hnv[1] = "The inhabitants of Yerushalayim made Achazyah his youngest son king in his place; for the band of men who came with the `Aravi\'im to the camp had slain all the eldest. So Achazyah the son of Yehoram king of Yehudah reigned.";
vul[1] = "constituerunt autem habitatores Hierusalem Ochoziam filium eius minimum regem pro eo omnes enim maiores natu qui ante eum fuerant interfecerant latrones Arabum qui inruerant in castra regnavitque Ochozias filius Ioram regis Iuda";
kjv[2] = "Forty and two years old [was] Ahaziah when he began to reign, and he reigned one year in Jerusalem. His mother\'s name also [was] Athaliah the daughter of Omri.";
rsv[2] = "Ahazi\'ah was forty-two years old when he began to reign, and he reigned one year in Jerusalem. His mother\'s name was Athali\'ah, the granddaughter of Omri.";
asv[2] = "Forty and two years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem: and his mother\'s name was Athaliah the daughter of Omri.";
yng[2] = "A son of twenty and two years [is] Ahaziah in his reigning, and one year he hath reigned in Jerusalem, and the name of his mother [is] Athaliah daughter of Omri;";
dby[2] = "Ahaziah was twenty-two years old when he began to reign; and he reigned one year in Jerusalem; and his mother\'s name was Athaliah, daughter of Omri.";
web[2] = "Forty and two years old [was] Ahaziah when he began to reign, and he reigned one year in Jerusalem. His mother\'s name also [was] Athaliah the daughter of Omri.";
hnv[2] = "Forty-two years old was Achazyah when he began to reign; and he reigned one year in Yerushalayim: and his mother\'s name was `Atalyah the daughter of `Omri.";
vul[2] = "filius quadraginta duo annorum erat Ochozias cum regnare coepisset et uno anno regnavit in Hierusalem nomen matris eius Otholia filia Amri";
kjv[3] = "He also walked in the ways of the house of Ahab: for his mother was his counsellor to do wickedly.";
rsv[3] = "He also walked in the ways of the house of Ahab, for his mother was his counselor in doing wickedly.";
asv[3] = "He also walked in the ways of the house of Ahab; for his mother was his counsellor to do wickedly.";
yng[3] = "he also hath walked in the ways of the house of Ahab, for his mother hath been his counsellor to do wickedly.";
dby[3] = "He also walked in the ways of the house of Ahab; for his mother was his counsellor to do wickedly.";
web[3] = "He also walked in the ways of the house of Ahab: for his mother was his counselor to do wickedly.";
hnv[3] = "He also walked in the ways of the house of Ach\'av; for his mother was his counselor to do wickedly.";
vul[3] = "sed et ipse ingressus est per vias domus Ahab mater enim eius inpulit eum ut impie ageret";
kjv[4] = "Wherefore he did evil in the sight of the LORD like the house of Ahab: for they were his counsellors after the death of his father to his destruction.";
rsv[4] = "He did what was evil in the sight of the LORD, as the house of Ahab had done; for after the death of his father they were his counselors, to his undoing.";
asv[4] = "And he did that which was evil in the sight of Jehovah, as did the house of Ahab; for they were his counsellors after the death of his father, to his destruction.";
yng[4] = "And he doth the evil thing in the eyes of Jehovah, like the house of Ahab, for they have been his counsellors, after the death of his father, for destruction to him.";
dby[4] = "And he did evil in the sight of Jehovah like the house of Ahab; for they were his counsellors after the death of his father, to his destruction.";
web[4] = "Wherefore he did evil in the sight of the LORD like the house of Ahab: for they were his counselors, after the death of his father, to his destruction.";
hnv[4] = "He did that which was evil in the sight of the LORD, as did the house of Ach\'av; for they were his counselors after the death of his father, to his destruction.";
vul[4] = "fecit igitur malum in conspectu Domini sicut domus Ahab ipsi enim fuerunt ei consiliarii post mortem patris sui in interitum eius";
kjv[5] = "He walked also after their counsel, and went with Jehoram the son of Ahab king of Israel to war against Hazael king of Syria at Ramothgilead: and the Syrians smote Joram.";
rsv[5] = "He even followed their counsel, and went with Jeho\'ram the son of Ahab king of Israel to make war against Haz\'ael king of Syria at Ramoth-gilead. And the Syrians wounded Joram,";
asv[5] = "He walked also after their counsel, and went with Jehoram the son of Ahab king of Israel to war against Hazael king of Syria at Ramoth-gilead: and the Syrians wounded Joram.";
yng[5] = "Also, in their counsel he hath walked, and goeth with Jehoram son of Ahab king of Israel to battle against Hazael king of Aram, in Ramoth-Gilead, and they of Ramah smite Joram;";
dby[5] = "He walked also after their counsel, and went with Jehoram the son of Ahab, king of Israel, to the war against Hazael the king of Syria at Ramoth-Gilead; and the Syrians wounded Joram.";
web[5] = "He walked also after their counsel, and went with Jehoram the son of Ahab king of Israel to war against Hazael king of Syria at Ramoth-gilead: and the Syrians smote Joram.";
hnv[5] = "He walked also after their counsel, and went with Yehoram the son of Ach\'av king of Yisra\'el to war against Haza\'el king of Aram at Ramot-Gil`ad: and the Aram wounded Yoram.";
vul[5] = "ambulavitque in consiliis eorum et perrexit cum Ioram filio Ahab rege Israhel in bellum contra Azahel regem Syriae in Ramoth Galaad vulneraveruntque Syri Ioram";
kjv[6] = "And he returned to be healed in Jezreel because of the wounds which were given him at Ramah, when he fought with Hazael king of Syria. And Azariah the son of Jehoram king of Judah went down to see Jehoram the son of Ahab at Jezreel, because he was sick.";
rsv[6] = "and he returned to be healed in Jezreel of the wounds which he had received at Ramah, when he fought against Haz\'ael king of Syria. And Ahazi\'ah the son of Jeho\'ram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick.";
asv[6] = "And he returned to be healed in Jezreel of the wounds which they had given him at Ramah, when he fought against Hazael king of Syria. And Azariah the son of Jehoram king of Judah went down to see Jehoram the son of Ahab in Jezreel, because he was sick.";
yng[6] = "and he turneth back to be healed in Jezreel because of the wounds with which they had smitten him in Ramah, in his fighting with Hazael king of Aram. And Azariah son of Jehoram king of Judah hath gone down to see Jehoram son of Ahab, in Jezreel, for he [is] sick;";
dby[6] = "And he returned to be healed in Jizreel because of the wounds that were given him at Ramah, when he fought with Hazael king of Syria. And Azariah the son of Jehoram, king of Judah, went down to see Jehoram the son of Ahab at Jizreel; for he was sick.";
web[6] = "And he returned to be healed in Jezreel because of the wounds which were given him at Ramah, when he fought with Hazael king of Syria. And Azariah the son of Jehoram king of Judah went down to see Jehoram the son of Ahab at Jezreel, because he was sick.";
hnv[6] = "He returned to be healed in Yizre`el of the wounds which they had given him at Ramah, when he fought against Haza\'el king of Aram. `Azaryah the son of Yehoram king of Yehudah went down to see Yehoram the son of Ach\'av in Yizre`el, because he was sick.";
vul[6] = "qui reversus est ut curaretur in Hiezrahel multas enim plagas acceperat in supradicto certamine igitur Azarias filius Ioram rex Iuda descendit ut inviseret Ioram filium Ahab in Hiezrahel aegrotantem";
kjv[7] = "And the destruction of Ahaziah was of God by coming to Joram: for when he was come, he went out with Jehoram against Jehu the son of Nimshi, whom the LORD had anointed to cut off the house of Ahab.";
rsv[7] = "But it was ordained by God that the downfall of Ahazi\'ah should come about through his going to visit Joram. For when he came there he went out with Jeho\'ram to meet Jehu the son of Nimshi, whom the LORD had anointed to destroy the house of Ahab.";
asv[7] = "Now the destruction of Ahaziah was of God, in that he went unto Joram: for when he was come, he went out with Jehoram against Jehu the son of Nimshi, whom Jehovah had anointed to cut off the house of Ahab.";
yng[7] = "and from God hath been the destruction of Ahaziah, to come unto Joram: and in his coming he hath gone out with Jehoram unto Jehu son of Nimshi, whom Jehovah anointed to cut off the house of Ahab.";
dby[7] = "But his coming to Joram was from God the complete ruin of Ahaziah. And when he had come, he went out with Jehoram against Jehu the son of Nimshi, whom Jehovah had anointed to cut off the house of Ahab.";
web[7] = "And the destruction of Ahaziah was from God by coming to Joram: for when he had come, he went out with Jehoram against Jehu the son of Nimshi, whom the LORD had anointed to cut off the house of Ahab.";
hnv[7] = "Now the destruction of Achazyah was of God, in that he went to Yoram: for when he was come, he went out with Yehoram against Yehu the son of Nimshi, whom the LORD had anointed to cut off the house of Ach\'av.";
vul[7] = "voluntatis quippe fuit Dei adversum Ochoziam ut veniret ad Ioram et cum venisset egrederetur cum eo adversum Hieu filium Namsi quem unxit Dominus ut deleret domum Ahab";
kjv[8] = "And it came to pass, that, when Jehu was executing judgment upon the house of Ahab, and found the princes of Judah, and the sons of the brethren of Ahaziah, that ministered to Ahaziah, he slew them.";
rsv[8] = "And when Jehu was executing judgment upon the house of Ahab, he met the princes of Judah and the sons of Ahazi\'ah\'s brothers, who attended Ahazi\'ah, and he killed them.";
asv[8] = "And it came to pass, when Jehu was executing judgment upon the house of Ahab, that he found the princes of Judah, and the sons of the brethren of Ahaziah, ministering to Ahaziah, and slew them.";
yng[8] = "And it cometh to pass, in Jehu\'s executing judgment with the house of Ahab, that he findeth the heads of Judah and sons of the brethren of Ahaziah, ministers of Ahaziah, and slayeth them.";
dby[8] = "And it came to pass when Jehu was executing judgment upon the house of Ahab, that he found the princes of Judah, and the sons of the brethren of Ahaziah, that attended upon Ahaziah, and he slew them.";
web[8] = "And it came to pass, that when Jehu was executing judgment upon the house of Ahab, and found the princes of Judah, and the sons of the brethren of Ahaziah, that ministered to Ahaziah, he slew them.";
hnv[8] = "It happened, when Yehu was executing judgment on the house of Ach\'av, that he found the princes of Yehudah, and the sons of the brothers of Achazyah, ministering to Achazyah, and killed them.";
vul[8] = "cum ergo subverteret Hieu domum Ahab invenit principes Iuda et filios fratrum Ochoziae qui ministrabant ei et interfecit illos";
kjv[9] = "And he sought Ahaziah: and they caught him, (for he was hid in Samaria,) and brought him to Jehu: and when they had slain him, they buried him: Because, said they, he [is] the son of Jehoshaphat, who sought the LORD with all his heart. So the house of Ahaziah had no power to keep still the kingdom.";
rsv[9] = "He searched for Ahazi\'ah, and he was captured while hiding in Sama\'ria, and he was brought to Jehu and put to death. They buried him, for they said, &quot;He is the grandson of Jehosh\'aphat, who sought the LORD with all his heart.&quot; And the house of Ahazi\'ah had no one able to rule the kingdom.";
asv[9] = "And he sought Ahaziah, and they caught him (now he was hiding in Samaria), and they brought him to Jehu, and slew him; and they buried him, for they said, He is the son of Jehoshaphat, who sought Jehovah with all his heart. And the house of Ahaziah had no power to hold the kingdom.";
yng[9] = "And he seeketh Ahaziah, and they capture him, (and he is hiding himself in Samaria), and bring him in unto Jehu, and put him to death, and bury him, for they said, `He [is] son of Jehoshaphat, who sought Jehovah with all his heart;\' and there is none to the house of Ahaziah to retain power for the kingdom.";
dby[9] = "And he sought Ahaziah; and they caught him (for he had hid himself in Samaria), and brought him to Jehu, and slew him; and they buried him, for they said, He is a son of Jehoshaphat, who sought Jehovah with all his heart. And in the house of Ahaziah there was no one who was able to [hold] the kingdom.";
web[9] = "And he sought Ahaziah: and they caught him, (for he was hid in Samaria,) and brought him to Jehu: and when they had slain him, they buried him: Because, said they, he [is] the son of Jehoshaphat, who sought the LORD with all his heart. So the house of Ahaziah had no power to retain the kingdom.";
hnv[9] = "He sought Achazyah, and they caught him (now he was hiding in Shomron), and they brought him to Yehu, and killed him; and they buried him, for they said, He is the son of Yehoshafat, who sought the LORD with all his heart. The house of Achazyah had no power to hold the kingdom.";
vul[9] = "ipsumque perquirens Ochoziam conprehendit latentem in Samaria adductumque ad se occidit et sepelierunt eum eo quod esset filius Iosaphat qui quaesierat Dominum in toto corde suo nec erat ultra spes aliqua ut de stirpe regnaret Ochoziae";
kjv[10] = "But when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal of the house of Judah.";
rsv[10] = "Now when Athali\'ah the mother of Ahazi\'ah saw that her son was dead, she arose and destroyed all the royal family of the house of Judah.";
asv[10] = "Now when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal of the house of Judah.";
yng[10] = "And Athaliah mother of Ahaziah hath seen that her son is dead, and she riseth and destroyeth the whole seed of the kingdom of the house of Judah.";
dby[10] = "And when Athaliah the mother of Ahaziah saw that her son was dead, she rose up and exterminated all the royal seed of the house of Judah.";
web[10] = "But when Athaliah the mother of Ahaziah saw that her son was dead, she arose, and destroyed all the seed royal of the house of Judah.";
hnv[10] = "Now when `Atalyah the mother of Achazyah saw that her son was dead, she arose and destroyed all the seed royal of the house of Yehudah.";
vul[10] = "siquidem Otholia mater eius videns quod mortuus esset filius suus surrexit et interfecit omnem stirpem regiam domus Ioram";
kjv[11] = "But Jehoshabeath, the daughter of the king, took Joash the son of Ahaziah, and stole him from among the king\'s sons that were slain, and put him and his nurse in a bedchamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest, (for she was the sister of Ahaziah,) hid him from Athaliah, so that she slew him not.";
rsv[11] = "But Jeho-shab\'e-ath, the daughter of the king, took Jo\'ash the son of Ahazi\'ah, and stole him away from among the king\'s sons who were about to be slain, and she put him and his nurse in a bedchamber. Thus Jeho-shab\'e-ath, the daughter of King Jeho\'ram and wife of Jehoi\'ada the priest, because she was a sister of Ahazi\'ah, hid him from Athali\'ah, so that she did not slay him;";
asv[11] = "But Jehoshabeath, the daughter of the king, took Joash the son of Ahaziah, and stole him away from among the king\'s sons that were slain, and put him and his nurse in the bedchamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest (for she was the sister of Ahaziah), hid him from Athaliah, so that she slew him not.";
yng[11] = "And Jehoshabeath daughter of the king taketh Joash son of Ahaziah, and stealeth him from the midst of the sons of the king who are put to death, and putteth him and his nurse into the inner part of the bed-chambers, and Jehoshabeath daughter of king Jehoram, wife of Jehoiada the priest, because she hath been sister of Ahaziah, hideth him from the face of Athaliah, and she hath not put him to death.";
dby[11] = "But Jehoshabeath the daughter of the king took Joash the son of Ahaziah and stole him from among the king\'s sons that were slain, and put him and his nurse in the bedchamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest (for she was the sister of Ahaziah), hid him from Athaliah, so that she did not slay him;";
web[11] = "But Jehoshabeath, the daughter of the king, took Joash the son of Ahaziah, and stole him from among the king\'s sons that were slain, and put him and his nurse in a bed chamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest, (for she was the sister of Ahaziah,) hid him from Athaliah, so that she slew him not.";
hnv[11] = "But Yehoshav`at, the daughter of the king, took Yo\'ash the son of Achazyah, and stole him away from among the king\'s sons who were slain, and put him and his nurse in the bedchamber. So Yehoshav`at, the daughter of king Yehoram, the wife of Yehoiada the Kohen (for she was the sister of Achazyah), hid him from `Atalyah, so that she didn\'t kill him.";
vul[11] = "porro Iosabeth filia regis tulit Ioas filium Ochoziae et furata est eum de medio filiorum regis cum interficerentur absconditque cum nutrice sua in cubiculo lectulorum Iosabeth autem quae absconderat eum erat filia regis Ioram uxor Ioiadae pontificis soror Ochoziae et idcirco Otholia non interfecit eum";
kjv[12] = "And he was with them hid in the house of God six years: and Athaliah reigned over the land.";
rsv[12] = "and he remained with them six years, hid in the house of God, while Athali\'ah reigned over the land.";
asv[12] = "And he was with them hid in the house of God six years: and Athaliah reigned over the land.";
yng[12] = "And he is with them in the house of God hiding himself six years, and Athaliah is reigning over the land.";
dby[12] = "and he was with them hid in the house of God six years. And Athaliah reigned over the land.";
web[12] = "And he was with them hid in the house of God six years: and Athaliah reigned over the land.";
hnv[12] = "He was with them hid in the house of God six years: and `Atalyah reigned over the land.";
vul[12] = "fuit ergo cum eis in domo Dei absconditus sex annis quibus regnavit Otholia super terram";
</script>
