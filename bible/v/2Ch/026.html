csb[1] = "All the people of Judah took Uzziah, who was sixteen years old, and made him king in place of his father Amaziah.";
csb[2] = "After Amaziah the king rested with his fathers, Uzziah rebuilt Eloth and restored it to Judah.";
csb[3] = "Uzziah was sixteen years old when he became king, and he reigned fifty-two years in Jerusalem. His mother\'s name was Jecoliah; she was from Jerusalem.";
csb[4] = "He did what was right in the LORD\'s sight just as his father Amaziah had done.";
csb[5] = "He sought God throughout the lifetime of Zechariah, the teacher of the fear of God. During the time that he sought the LORD, God gave him success.";
csb[6] = "Uzziah went out to wage war against the Philistines, and he tore down the wall of Gath, the wall of Jabneh, and the wall of Ashdod. Then he built cities in the vicinity of Ashdod and among the Philistines.";
csb[7] = "God helped him against the Philistines, the Arabs that live in Gur-baal, and the Meunites.";
csb[8] = "The Ammonites paid tribute to Uzziah, and his fame spread as far as the entrance of Egypt, for God made him very powerful.";
csb[9] = "Uzziah built towers in Jerusalem at the Corner Gate, the Valley Gate, and the corner buttress, and he fortified them.";
csb[10] = "Since he had many cattle both in the Judean foothills and the plain, he built towers in the desert and dug many wells. And since he was a lover of the soil, he had farmers and vinedressers in the hills and in the fertile lands.";
csb[11] = "Uzziah had an army equipped for combat that went out to war by division according to their assignments, as recorded by Jeiel the court secretary and Maaseiah the officer under the authority of Hananiah, one of the king\'s commanders.";
csb[12] = "The total number of family heads was 2,600 valiant warriors.";
csb[13] = "Under their authority was an army of 307,500 equipped for combat, a powerful force to help the king against the enemy.";
csb[14] = "Uzziah provided the entire army with shields, spears, helmets, armor, bows, and slingstones.";
csb[15] = "He made skillfully designed devices in Jerusalem to shoot arrows and catapult large stones for use on the towers and on the corners. So his fame spread even to distant places, for he was wondrously helped until he became strong.";
csb[16] = "But when he became strong, he grew arrogant, and it led to his own destruction. He acted unfaithfully against the LORD his God by going into the LORD\'s sanctuary to burn incense on the incense altar.";
csb[17] = "The priest Azariah, along with eighty brave priests of the LORD, went in after him.";
csb[18] = "They took their stand against King Uzziah and said, &quot;Uzziah, you have no right to offer incense to the LORD -- only the consecrated priests, the descendants of Aaron, have the right to offer incense. Leave the sanctuary, for you have acted unfaithfully! You will not receive honor from the LORD God.&quot;";
csb[19] = "Uzziah, with a firepan in his hand to offer incense, was enraged. But when he became enraged with the priests, in the presence of the priests in the LORD\'s temple beside the altar of incense, a skin disease broke out on his forehead.";
csb[20] = "Then Azariah the chief priest and all the priests turned to him and saw that he was diseased on his forehead. They rushed him out of there. He himself also hurried to get out because the LORD had afflicted him.";
csb[21] = "So King Uzziah was diseased to the time of his death. He lived in quarantine with a serious skin disease and was excluded from access to the LORD\'s temple, while his son Jotham was over the king\'s household governing the people of the land.";
csb[22] = "Now the prophet Isaiah son of Amoz wrote about the rest of the events of Uzziah\'s reign, from beginning to end.";
csb[23] = "Uzziah rested with his fathers, and he was buried with his fathers in the burial ground of the kings\' cemetery, for they said, &quot;He has a skin disease.&quot; His son Jotham became king in his place.";

kjv[11] = "Moreover Uzziah had an host of fighting men, that went out to war by bands, according to the number of their account by the hand of Jeiel the scribe and Maaseiah the ruler, under the hand of Hananiah, [one] of the king\'s captains.";

asv[18] = "and they withstood Uzziah the king, and said unto him, It pertaineth not unto thee, Uzziah, to burn incense unto Jehovah, but to the priests the sons of Aaron, that are consecrated to burn incense: go out of the sanctuary; for thou hast trespassed; neither shall it be for thine honor from Jehovah God.";
yng[18] = "and they stand up against Uzziah the king, and say to him, `Not for thee, O Uzziah, to make perfume to Jehovah, but for priests, sons of Aaron, who are sanctified to make perfume; go forth from the sanctuary, for thou hast trespassed, and [it is] not to thee for honour from Jehovah God.\'";
dby[18] = "and they withstood Uzziah the king, and said to him, It is not for thee, Uzziah, to burn incense to Jehovah, but for the priests the sons of Aaron, that are consecrated to burn incense. Go out of the sanctuary; for thou hast transgressed; neither shall it be for thine honour from Jehovah Elohim.";
web[18] = "And they withstood Uzziah the king, and said to him, [It appertaineth] not to thee, Uzziah, to burn incense to the LORD, but to the priests the sons of Aaron, that are consecrated to burn incense: go out of the sanctuary; for thou hast trespassed; neither [will it be] for thy honor from the LORD God.";
hnv[18] = "and they withstood `Uzziyah the king, and said to him, It pertains not to you, `Uzziyah, to burn incense to the LORD, but to the Kohanim the sons of Aharon, who are consecrated to burn incense: go out of the sanctuary; for you have trespassed; neither shall it be for your honor from the LORD God.";
vul[18] = "restiterunt regi atque dixerunt non est tui officii Ozia ut adoleas incensum Domino sed sacerdotum hoc est filiorum Aaron qui consecrati sunt ad huiuscemodi ministerium egredere de sanctuario ne contempseris quia non reputabitur tibi in gloriam hoc a Domino Deo";
kjv[19] = "Then Uzziah was wroth, and [had] a censer in his hand to burn incense: and while he was wroth with the priests, the leprosy even rose up in his forehead before the priests in the house of the LORD, from beside the incense altar.";
rsv[19] = "Then Uzzi\'ah was angry. Now he had a censer in his hand to burn incense, and when he became angry with the priests leprosy broke out on his forehead, in the presence of the priests in the house of the LORD, by the altar of incense.";
asv[19] = "Then Uzziah was wroth; and he had a censer in his hand to burn incense; and while he was wroth with the priests, the leprosy brake forth in his forehead before the priests in the house of Jehovah, beside the altar of incense.";
yng[19] = "And Uzziah is wroth, and in his hand [is] a censer to make perfume, and in his being wroth with the priests -- the leprosy hath risen in his forehead, before the priests, in the house of Jehovah, from beside the altar of perfume.";
dby[19] = "And Uzziah was wroth; and he had a censer in his hand to burn incense; and while he was wroth with the priests, the leprosy rose up in his forehead before the priests in the house of Jehovah, beside the incense altar.";
web[19] = "Then Uzziah was wroth, and [had] a censer in his hand to burn incense: and while he was wroth with the priests, the leprosy even rose up in his forehead before the priests in the house of the LORD, from beside the incense altar.";
hnv[19] = "Then `Uzziyah was angry; and he had a censer in his hand to burn incense; and while he was angry with the Kohanim, the leprosy broke forth in his forehead before the Kohanim in the house of the LORD, beside the altar of incense.";
vul[19] = "iratusque est Ozias et tenens in manu turibulum ut adoleret incensum minabatur sacerdotibus statimque orta est lepra in fronte eius coram sacerdotibus in domo Domini super altare thymiamatis";
kjv[20] = "And Azariah the chief priest, and all the priests, looked upon him, and, behold, he [was] leprous in his forehead, and they thrust him out from thence; yea, himself hasted also to go out, because the LORD had smitten him.";
rsv[20] = "And Azari\'ah the chief priest, and all the priests, looked at him, and behold, he was leprous in his forehead! And they thrust him out quickly, and he himself hastened to go out, because the LORD had smitten him.";
asv[20] = "And Azariah the chief priest, and all the priests, looked upon him, and, behold, he was leprous in his forehead, and they thrust him out quickly from thence; yea, himself hasted also to go out, because Jehovah had smitten him.";
yng[20] = "And Azariah the head priest looketh unto him, and all the priests, and lo, he [is] leprous in his forehead, and they hasten him thence, and also he himself hath hastened to go out, for Jehovah hath plagued him.";
dby[20] = "And Azariah the chief priest and all the priests looked upon him, and behold, he was leprous in his forehead, and they thrust him out from thence; even he himself hasted to go out, because Jehovah had smitten him.";
web[20] = "And Azariah the chief priest, and all the priests looked upon him, and behold, he [was] leprous in his forehead, and they thrust him out from thence; yea, himself hasted also to go out, because the LORD had smitten him.";
hnv[20] = "`Azaryah the chief Kohen, and all the Kohanim, looked on him, and, behold, he was leprous in his forehead, and they thrust him out quickly from there; yes, himself hurried also to go out, because the LORD had struck him.";
vul[20] = "cumque respexisset eum Azarias pontifex et omnes reliqui sacerdotes viderunt lepram in fronte eius et festinato expulerunt eum sed et ipse perterritus adceleravit egredi eo quod sensisset ilico plagam Domini";
kjv[21] = "And Uzziah the king was a leper unto the day of his death, and dwelt in a several house, [being] a leper; for he was cut off from the house of the LORD: and Jotham his son [was] over the king\'s house, judging the people of the land.";
rsv[21] = "And King Uzzi\'ah was a leper to the day of his death, and being a leper dwelt in a separate house, for he was excluded from the house of the LORD. And Jotham his son was over the king\'s household, governing the people of the land.";
asv[21] = "And Uzziah the king was a leper unto the day of his death, and dwelt in a separate house, being a leper; for he was cut off from the house of Jehovah: and Jotham his son was over the king\'s house, judging the people of the land.";
yng[21] = "And Uzziah the king is a leper unto the day of his death, and inhabiteth a separate house -- a leper, for he hath been cut off from the house of Jehovah, and Jotham his son [is] over the house of the king, judging the people of the land.";
dby[21] = "And Uzziah the king was a leper to the day of his death, and dwelt in a separate house, being a leper; for he was cut off from the house of Jehovah. And Jotham his son was over the king\'s house, judging the people of the land.";
web[21] = "And Uzziah the king was a leper to the day of his death, and dwelt in a separate house, [being] a leper; for he was cut off from the house of the LORD: and Jotham his son [was] over the king\'s house, judging the people of the land.";
hnv[21] = "`Uzziyah the king was a leper to the day of his death, and lived in a separate house, being a leper; for he was cut off from the house of the LORD: and Yotam his son was over the king\'s house, judging the people of the land.";
vul[21] = "fuit igitur Ozias rex leprosus usque ad diem mortis suae et habitavit in domo separata plenus lepra ob quam et eiectus fuerat de domo Domini porro Ioatham filius eius rexit domum regis et iudicabat populum terrae";
kjv[22] = "Now the rest of the acts of Uzziah, first and last, did Isaiah the prophet, the son of Amoz, write.";
rsv[22] = "Now the rest of the acts of Uzzi\'ah, from first to last, Isaiah the prophet the son of Amoz wrote.";
asv[22] = "Now the rest of the acts of Uzziah, first and last, did Isaiah the prophet, the son of Amoz, write.";
yng[22] = "And the rest of the matters of Uzziah, the first and the last, hath Isaiah son of Amoz the prophet written;";
dby[22] = "And the rest of the acts of Uzziah, first and last, did the prophet Isaiah the son of Amoz write.";
web[22] = "Now the rest of the acts of Uzziah, first and last, were written by Isaiah the prophet, the son of Amos.";
hnv[22] = "Now the rest of the acts of `Uzziyah, first and last, did Yesha`yahu the prophet, the son of Amotz, write.";
vul[22] = "reliqua autem sermonum Oziae priorum et novissimorum scripsit Esaias filius Amos propheta";
kjv[23] = "So Uzziah slept with his fathers, and they buried him with his fathers in the field of the burial which [belonged] to the kings; for they said, He [is] a leper: and Jotham his son reigned in his stead.";
rsv[23] = "And Uzzi\'ah slept with his fathers, and they buried him with his fathers in the burial field which belonged to the kings, for they said, &quot;He is a leper.&quot; And Jotham his son reigned in his stead.";
asv[23] = "So Uzziah slept with his fathers; and they buried him with his fathers in the field of burial which belonged to the kings; for they said, He is a leper: and Jotham his son reigned in his stead.";
yng[23] = "and Uzziah lieth with his fathers, and they bury him with his fathers, in the field of the burying-place that the kings have, for they said, `He [is] a leper;\' and reign doth Jotham his son in his stead.";
dby[23] = "And Uzziah slept with his fathers; and they buried him with his fathers in the burial-ground of the kings, for they said, He is a leper. And Jotham his son reigned in his stead.";
web[23] = "So Uzziah slept with his fathers, and they buried him with his fathers in the field of the burial which [belonged] to the kings; for they said, He [is] a leper: and Jotham his son reigned in his stead.";
hnv[23] = "So `Uzziyah slept with his fathers; and they buried him with his fathers in the field of burial which belonged to the kings; for they said, He is a leper: and Yotam his son reigned in his place.";
vul[23] = "dormivitque Ozias cum patribus suis et sepelierunt eum in agro regalium sepulchrorum eo quod esset leprosus regnavitque Ioatham filius eius pro eo";
