csb[1] = "King Jehoshaphat of Judah returned to his home in Jerusalem in peace.";
csb[2] = "Then Jehu son of the seer Hanani went out to confront him and said to King Jehoshaphat, &quot;Do you help the wicked and love those who hate the LORD? Because of this, the LORD\'s wrath is on you.";
csb[3] = "&quot;However, some good is found in you, for you have eradicated the Asherah poles from the land and have decided to seek God.&quot;";
csb[4] = "Jehoshaphat lived in Jerusalem, and once again he went out among the people from Beer-sheba to the hill country of Ephraim and brought them back to the LORD, the God of their ancestors.";
csb[5] = "He appointed judges in all the fortified cities of the land of Judah, city by city.";
csb[6] = "Then he said to the judges, &quot;Consider what you are doing, for you do not judge for a mere mortal, but for the LORD, who is with you in the matter of judgment.";
csb[7] = "&quot;And now, may the terror of the LORD be on you. Watch what you do, for there is no injustice or partiality or taking bribes with the LORD our God.&quot;";
csb[8] = "Jehoshaphat also appointed in Jerusalem some of the Levites and priests and some of the Israelite family heads for deciding the LORD\'s will and for settling disputes of the residents of Jerusalem.";
csb[9] = "He commanded them, saying, &quot;In the fear of the LORD, with integrity, and wholeheartedly, you are to do the following:";
csb[10] = "&quot;For every dispute that comes to you from your brothers who dwell in their cities -- whether it regards differences of bloodguilt, law, commandment, statutes, or judgments -- you are to warn them, so they will not incur guilt before the LORD and wrath will not come on you and your brothers. Do this, and you will not incur guilt.";
csb[11] = "&quot;Note that Amariah, the chief priest, is over you in all matters related to the LORD, and Zebadiah son of Ishmael, the ruler of the house of Judah, in all matters related to the king, and the Levites are officers in your presence. Be strong; may the LORD be with those who do what is good.&quot;";

kjv[10] = "And what cause soever shall come to you of your brethren that dwell in their cities, between blood and blood, between law and commandment, statutes and judgments, ye shall even warn them that they trespass not against the LORD, and [so] wrath come upon you, and upon your brethren: this do, and ye shall not trespass.";
rsv[10] = "whenever a case comes to you from your brethren who live in their cities, concerning bloodshed, law or commandment, statutes or ordinances, then you shall instruct them, that they may not incur guilt before the LORD and wrath may not come upon you and your brethren. Thus you shall do, and you will not incur guilt.";
asv[10] = "And whensoever any controversy shall come to you from your brethren that dwell in their cities, between blood and blood, between law and commandment, statutes and ordinances, ye shall warn them, that they be not guilty towards Jehovah, and so wrath come upon you and upon your brethren: this do, and ye shall not be guilty.";
yng[10] = "and any strife that cometh in unto you of your brethren who are dwelling in their cities, between blood and blood, between law and command, statutes, and judgments, then ye have warned them and they become not guilty before Jehovah, and wrath hath not been on you and on your brethren; thus do ye do, and ye are not guilty.";
