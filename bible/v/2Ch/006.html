csb[1] = "Then Solomon said: The LORD said he would dwell in total darkness,";
csb[2] = "but I have built an exalted temple for you, a place for your residence forever.";
csb[3] = "Then the king turned and blessed the entire congregation of Israel while they were standing.";
csb[4] = "He said: Blessed be the LORD God of Israel! He spoke directly to my father David, and he has fulfilled the promise by his power. He said,";
csb[5] = "&quot;Since the day I brought my people Israel out of the land of Egypt, I have not chosen a city to build a temple in among any of the tribes of Israel, so that my name would be there, and I have not chosen a man to be ruler over my people Israel.";
csb[6] = "&quot;But I have chosen Jerusalem so that my name will be there, and I have chosen David to be over my people Israel.&quot;";
csb[7] = "My father David had his heart set on building a temple for the name of the LORD, the God of Israel.";
csb[8] = "However, the LORD said to my father David, &quot;Since it was your desire to build a temple for my name, you have done well to have this desire.";
csb[9] = "&quot;Yet, you are not the one to build the temple, but your son, your own offspring, will build the temple for my name.&quot;";
csb[10] = "So the LORD has fulfilled what he promised. I have taken the place of my father David and I sit on the throne of Israel, as the LORD promised. I have built the temple for the name of the LORD, the God of Israel.";
csb[11] = "I have put the ark there, where the LORD\'s covenant is that he made with the Israelites.";
csb[12] = "Then Solomon stood before the altar of the LORD in front of the entire congregation of Israel and spread out his hands.";
csb[13] = "For Solomon had made a bronze platform 7 1/2 feet long, 7 1/2 feet wide, and 4 1/2 feet high and put it in the court. He stood on it, knelt down in front of the entire congregation of Israel, and spread out his hands toward heaven.";
csb[14] = "He said: LORD God of Israel, there is no God like you in heaven or on earth, who keeps his gracious covenant with your servants who walk before you with all their heart.";
csb[15] = "You have kept what you promised to your servant, my father David. You spoke directly to him, and you fulfilled your promise by your power, as it is today.";
csb[16] = "Therefore, LORD God of Israel, keep what you promised to your servant, my father David: &quot;You will never fail to have a man to sit before me on the throne of Israel, if only your sons guard their way to walk in my Law as you have walked before me.&quot;";
csb[17] = "Now, LORD God of Israel, please confirm what you promised to your servant David.";
csb[18] = "But will God indeed live on earth with humans? Even heaven, the highest heaven, cannot contain you, much less this temple I have built.";
csb[19] = "Listen to your servant\'s prayer and his petition, LORD my God, so that you may hear the cry and the prayer that your servant prays before you,";
csb[20] = "so that your eyes watch over this temple day and night, toward the place where you said you would put your name; and so that you may hear the prayer your servant prays toward this place.";
csb[21] = "Hear the petitions of your servant and your people Israel, which they pray toward this place. May you hear in your dwelling place in heaven. May you hear and forgive.";
csb[22] = "If a man sins against his neighbor and is forced to take an oath and he comes to take an oath before your altar in this temple,";
csb[23] = "may you hear in heaven and act. May you judge your servants, condemning the wicked man by bringing what he has done on his own head and providing justice for the righteous by rewarding him according to his righteousness.";
csb[24] = "If your people Israel are defeated before an enemy, because they have sinned against you, and they return to you and praise your name, and they pray and plead for mercy before you in this temple,";
csb[25] = "may you hear in heaven and forgive the sin of your people Israel. May you restore them to the land you gave them and their ancestors.";
csb[26] = "When the skies are shut and there is no rain because they have sinned against you, and they pray toward this place and praise your name, and they turn from their sins because you are afflicting them,";
csb[27] = "may you hear in heaven and forgive the sin of your servants and your people Israel, so that you may teach them the good way they should walk in. May you send rain on your land that you gave your people for an inheritance.";
csb[28] = "When there is famine in the land, when there is pestilence, when there is blight or mildew, locust or grasshopper, when their enemies besiege them in the land and its cities, when there is any plague or illness,";
csb[29] = "every prayer or petition that any person or that all your people Israel may have -- they each know their own affliction and suffering -- as they spread out their hands toward this temple,";
csb[30] = "may you hear in heaven, your dwelling place, and may you forgive and give to everyone according to all their ways, since you know each heart, for you alone know the human heart,";
csb[31] = "so that they may fear you and walk in your ways all the days they live on the land you gave our ancestors.";
csb[32] = "Even for the foreigner who is not of your people Israel but has come from a distant land because of your great name and your strong hand and outstretched arm: when he comes and prays toward this temple,";
csb[33] = "may you hear in heaven in your dwelling place, and do all the foreigner asks you. Then all the peoples of the earth will know your name, to fear you as your people Israel do and know that this temple I have built bears your name.";
csb[34] = "When your people go out to fight against their enemies, wherever you send them, and they pray to you in the direction of this city you have chosen and the temple that I have built for your name,";
csb[35] = "may you hear their prayer and petition in heaven and uphold their cause.";
csb[36] = "When they sin against you -- for there is no one who does not sin -- and you are angry with them and hand them over to the enemy, and their captors deport them to a distant or nearby country,";
csb[37] = "and when they come to their senses in the land where they were deported and repent and petition you in their captors\' land, saying: &quot;We have sinned and done wrong; we have been wicked,&quot;";
csb[38] = "and when they return to you with all their mind and all their heart in the land of their captivity where they were taken captive, and when they pray in the direction of their land that you gave their ancestors, and the city you have chosen, and toward the temple I have built for your name,";
csb[39] = "may you hear their prayer and petitions in heaven, your dwelling place, and uphold their cause. May you forgive your people who sinned against you.";
csb[40] = "Now, my God, please let your eyes be open and your ears attentive to the prayer of this place.";
csb[41] = "Now therefore: Arise, LORD God, come to your resting place, you and your powerful ark. May your priests, LORD God, be clothed with salvation, and may your faithful people rejoice in goodness.";
csb[42] = "LORD God, do not reject your anointed one; remember the promises to your servant David.";
kjv[1] = "Then said Solomon, The LORD hath said that he would dwell in the thick darkness.";
rsv[1] = "Then Solomon said, &quot;The LORD has said that he would dwell in thick darkness.";
asv[1] = "Then spake Solomon, Jehovah hath said that he would dwell in the thick darkness.";
yng[1] = "Then said Solomon, `Jehovah said -- to dwell in thick darkness,";
dby[1] = "Then said Solomon: Jehovah said that he would dwell in the thick darkness.";
web[1] = "Then said Solomon, The LORD hath said that he would dwell in the thick darkness.";
hnv[1] = "Then spoke Shlomo, the LORD has said that he would dwell in the thick darkness.";
vul[1] = "tunc Salomon ait Dominus pollicitus est ut habitaret in caligine";
kjv[2] = "But I have built an house of habitation for thee, and a place for thy dwelling for ever.";
rsv[2] = "I have built thee an exalted house, a place for thee to dwell in for ever.&quot;";
asv[2] = "But I have built thee a house of habitation, and a place for thee to dwell in for ever.";
yng[2] = "and I -- I have built a house of habitation for Thee, and a fixed place for Thy dwelling to the ages.\'";
dby[2] = "But I have built a house of habitation for thee, even a settled place for thee to abide in for ever.";
web[2] = "But I have built a house of habitation for thee, and a place for thy dwelling for ever.";
hnv[2] = "But I have built you a house of habitation, and a place for you to dwell in forever.";
vul[2] = "ego autem aedificavi domum nomini eius ut habitaret ibi in perpetuum";
kjv[3] = "And the king turned his face, and blessed the whole congregation of Israel: and all the congregation of Israel stood.";
rsv[3] = "Then the king faced about, and blessed all the assembly of Israel, while all the assembly of Israel stood.";
asv[3] = "And the king turned his face, and blessed all the assembly of Israel: and all the assembly of Israel stood.";
yng[3] = "And the king turneth round his face, and blesseth the whole assembly of Israel, and the whole assembly of Israel is standing,";
dby[3] = "And the king turned his face and blessed the whole congregation of Israel; and the whole congregation of Israel stood.";
web[3] = "And the king turned his face, and blessed the whole congregation of Israel: and all the congregation of Israel stood.";
hnv[3] = "The king turned his face, and blessed all the assembly of Yisra\'el: and all the assembly of Yisra\'el stood.";
vul[3] = "et convertit faciem suam et benedixit universae multitudini Israhel nam omnis turba stabat intenta et ait";
kjv[4] = "And he said, Blessed [be] the LORD God of Israel, who hath with his hands fulfilled [that] which he spake with his mouth to my father David, saying,";
rsv[4] = "And he said, &quot;Blessed be the LORD, the God of Israel, who with his hand has fulfilled what he promised with his mouth to David my father, saying,";
asv[4] = "And he said, Blessed be Jehovah, the God of Israel, who spake with his mouth unto David my father, and hath with his hands fulfilled it, saying,";
yng[4] = "and he saith, `Blessed [is] Jehovah, God of Israel, who hath spoken with His mouth with David my father, and with His hands hath fulfilled [it], saying:";
dby[4] = "And he said: Blessed be Jehovah the God of Israel, who spoke with his mouth unto David my father, and hath with his hands fulfilled it, saying,";
web[4] = "And he said, Blessed [be] the LORD God of Israel, who hath with his hands fulfilled [that] which he spoke with his mouth to my father David, saying,";
hnv[4] = "He said, Blessed be the LORD, the God of Yisra\'el, who spoke with his mouth to David my father, and has with his hands fulfilled it, saying,";
vul[4] = "benedictus Dominus Deus Israhel qui quod locutus est David patri meo opere conplevit dicens";
kjv[5] = "Since the day that I brought forth my people out of the land of Egypt I chose no city among all the tribes of Israel to build an house in, that my name might be there; neither chose I any man to be a ruler over my people Israel:";
rsv[5] = "\'Since the day that I brought my people out of the land of Egypt, I chose no city in all the tribes of Israel in which to build a house, that my name might be there, and I chose no man as prince over my people Israel;";
asv[5] = "Since the day that I brought forth my people out of the land of Egypt, I chose no city out of all the tribes of Israel to build a house in, that my name might be there; neither chose I any man to be prince over my people Israel:";
yng[5] = "`From the day that I brought out My people from the land of Egypt, I have not fixed on a city out of any of the tribes of Israel to build a house for my name being there, and I have not fixed on a man to be leader over My people Israel;";
dby[5] = "Since the day that I brought forth my people out of the land of Egypt I chose no city out of all the tribes of Israel to build a house in, that my name might be there; neither chose I any man to be prince over my people Israel:";
web[5] = "Since the day that I brought forth my people from the land of Egypt I chose no city among all the tribes of Israel to build a house in, that my name might be there; neither chose I any man to be a ruler over my people Israel:";
hnv[5] = "Since the day that I brought forth my people out of the land of Mitzrayim, I chose no city out of all the tribes of Yisra\'el to build a house in, that my name might be there; neither chose I any man to be prince over my people Yisra\'el:";
vul[5] = "a die qua eduxi populum meum de terra Aegypti non elegi civitatem de cunctis tribubus Israhel ut aedificaretur in ea domus nomini meo neque elegi quemquam alium virum ut esset dux in populo meo Israhel";
kjv[6] = "But I have chosen Jerusalem, that my name might be there; and have chosen David to be over my people Israel.";
rsv[6] = "but I have chosen Jerusalem that my name may be there and I have chosen David to be over my people Israel.\'";
asv[6] = "but I have chosen Jerusalem, that my name might be there, and have chosen David to be over my people Israel.";
yng[6] = "and I fix on Jerusalem for My name being there, and I fix on David to be over My people Israel.";
dby[6] = "but I have chosen Jerusalem, that my name might be there; and I have chosen David to be over my people Israel.";
web[6] = "But I have chosen Jerusalem, that my name might be there; and have chosen David to be over my people Israel.";
hnv[6] = "but I have chosen Yerushalayim, that my name might be there; and have chosen David to be over my people Yisra\'el.";
vul[6] = "sed elegi Hierusalem ut sit nomen meum in ea et elegi David ut constituerem eum super populum meum Israhel";
kjv[7] = "Now it was in the heart of David my father to build an house for the name of the LORD God of Israel.";
rsv[7] = "Now it was in the heart of David my father to build a house for the name of the LORD, the God of Israel.";
asv[7] = "Now it was in the heart of David my father to build a house for the name of Jehovah, the God of Israel.";
yng[7] = "`And it is with the heart of David my father to build a house for the name of Jehovah God of Israel,";
dby[7] = "And it was in the heart of David my father to build a house unto the name of Jehovah the God of Israel.";
web[7] = "Now it was in the heart of David my father to build a house for the name of the LORD God of Israel:";
hnv[7] = "Now it was in the heart of David my father to build a house for the name of the LORD, the God of Yisra\'el.";
vul[7] = "cumque fuisset voluntatis David patris mei ut aedificaret domum nomini Domini Dei Israhel";
kjv[8] = "But the LORD said to David my father, Forasmuch as it was in thine heart to build an house for my name, thou didst well in that it was in thine heart:";
rsv[8] = "But the LORD said to David my father, \'Whereas it was in your heart to build a house for my name, you did well that it was in your heart;";
asv[8] = "But Jehovah said unto David my father, Whereas it was in thy heart to build a house for my name, thou didst well that it was in thy heart:";
yng[8] = "and Jehovah saith unto David my father, Because that it hath been with thy heart to build a house for My name, thou hast done well that it hath been with thy heart,";
dby[8] = "But Jehovah said to David my father, Whereas it was in thy heart to build a house unto my name, thou didst well that it was in thy heart;";
web[8] = "But the LORD said to David my father, Forasmuch as it was in thy heart to build a house for my name, thou didst well in that it was in thy heart;";
hnv[8] = "But the LORD said to David my father, Whereas it was in your heart to build a house for my name, you did well that it was in your heart:";
vul[8] = "dixit Dominus ad eum quia haec fuit voluntas tua ut aedificares domum nomini meo bene quidem fecisti habere huiuscemodi voluntatem";
kjv[9] = "Notwithstanding thou shalt not build the house; but thy son which shall come forth out of thy loins, he shall build the house for my name.";
rsv[9] = "nevertheless you shall not build the house, but your son who shall be born to you shall build the house for my name.\'";
asv[9] = "nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house for my name.";
yng[9] = "but thou dost not build the house, for thy son who cometh forth out from thy loins, he doth build the house for My name.";
dby[9] = "nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house unto my name.";
web[9] = "Notwithstanding thou shalt not build the house; but thy son who shall come forth out of thy loins, he shall build the house for my name.";
hnv[9] = "nevertheless you shall not build the house; but your son who shall come forth out of your loins, he shall build the house for my name.";
vul[9] = "sed non tu aedificabis domum verum filius tuus qui egredietur de lumbis tuis ipse aedificabit domum nomini meo";
kjv[10] = "The LORD therefore hath performed his word that he hath spoken: for I am risen up in the room of David my father, and am set on the throne of Israel, as the LORD promised, and have built the house for the name of the LORD God of Israel.";
rsv[10] = "Now the LORD has fulfilled his promise which he made; for I have risen in the place of David my father, and sit on the throne of Israel, as the LORD promised, and I have built the house for the name of the LORD, the God of Israel.";
asv[10] = "And Jehovah hath performed his word that he spake; for I am risen up in the room of David my father, and sit on the throne of Israel, as Jehovah promised, and have built the house for the name of Jehovah, the God of Israel.";
yng[10] = "`And Jehovah doth establish His word that He spake, and I rise up in the stead of David my father, and sit on the throne of Israel, as Jehovah spake, and I build the house for the name of Jehovah, God of Israel,";
dby[10] = "And Jehovah has performed his word which he spoke; and I am risen up in the room of David my father, and sit on the throne of Israel, as Jehovah promised, and I have built the house unto the name of Jehovah the God of Israel.";
web[10] = "The LORD therefore hath performed his word that he hath spoken; for I am raised up in the room of David my father, and am set on the throne of Israel, as the LORD promised, and have built the house for the name of the LORD God of Israel.";
hnv[10] = "The LORD has performed his word that he spoke; for I am risen up in the room of David my father, and sit on the throne of Yisra\'el, as the LORD promised, and have built the house for the name of the LORD, the God of Yisra\'el.";
vul[10] = "conplevit ergo Dominus sermonem suum quem locutus fuerat et ego surrexi pro David patre meo et sedi super thronum Israhel sicut locutus est Dominus et aedificavi domum nomini Domini Dei Israhel";
kjv[11] = "And in it have I put the ark, wherein [is] the covenant of the LORD, that he made with the children of Israel.";
rsv[11] = "And there I have set the ark, in which is the covenant of the LORD which he made with the people of Israel.&quot;";
asv[11] = "And there have I set the ark, wherein is the covenant of Jehovah, which he made with the children of Israel.";
yng[11] = "and I place there the ark, where [is] the covenant of Jehovah that He made with the sons of Israel.\'";
dby[11] = "And in it have I put the ark, wherein is the covenant of Jehovah, which he made with the children of Israel.";
web[11] = "And in it have I put the ark, in which [is] the covenant of the LORD, that he made with the children of Israel.";
hnv[11] = "There have I set the ark, in which is the covenant of the LORD, which he made with the children of Yisra\'el.";
vul[11] = "et posui in ea arcam in qua est pactum Domini quod pepigit cum filiis Israhel";
kjv[12] = "And he stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands:";
rsv[12] = "Then Solomon stood before the altar of the LORD in the presence of all the assembly of Israel, and spread forth his hands.";
asv[12] = "And he stood before the altar of Jehovah in the presence of all the assembly of Israel, and spread forth his hands";
yng[12] = "And he standeth before the altar of Jehovah, over-against all the assembly of Israel, and spreadeth out his hand, --";
dby[12] = "And he stood before the altar of Jehovah in the presence of the whole congregation of Israel, and spread forth his hands.";
web[12] = "And he stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands:";
hnv[12] = "He stood before the altar of the LORD in the presence of all the assembly of Yisra\'el, and spread forth his hands";
vul[12] = "stetit ergo coram altare Domini ex adverso universae multitudinis Israhel et extendit manus suas";
kjv[13] = "For Solomon had made a brasen scaffold, of five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court: and upon it he stood, and kneeled down upon his knees before all the congregation of Israel, and spread forth his hands toward heaven,";
rsv[13] = "Solomon had made a bronze platform five cubits long, five cubits wide, and three cubits high, and had set it in the court; and he stood upon it. Then he knelt upon his knees in the presence of all the assembly of Israel, and spread forth his hands toward heaven;";
asv[13] = "(for Solomon had made a brazen scaffold, five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court; and upon it he stood, and kneeled down upon his knees before all the assembly of Israel, and spread forth his hands toward heaven);";
yng[13] = "for Solomon hath made a scaffold of brass, and putteth it in the midst of the court, five cubits its length, and five cubits its breadth, and three cubits its height, and he standeth upon it, and kneeleth on his knees over-against all the assembly of Israel, and spreadeth forth his hands towards the heavens --";
dby[13] = "For Solomon had made a platform of bronze, five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court; and upon it he stood, and he kneeled down on his knees before the whole congregation of Israel, and spread forth his hands toward the heavens,";
web[13] = "(For Solomon had made a brazen scaffold, of five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court: and upon it he stood, and kneeled upon his knees before all the congregation of Israel, and spread forth his hands towards heaven,)";
hnv[13] = "(for Shlomo had made a brazen scaffold, five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court; and on it he stood, and kneeled down on his knees before all the assembly of Yisra\'el, and spread forth his hands toward heaven;)";
vul[13] = "siquidem fecerat Salomon basem aeneam et posuerat eam in medio basilicae habentem quinque cubitos longitudinis et quinque cubitos latitudinis et tres cubitos in altum stetitque super eam et deinceps flexis genibus contra universam multitudinem Israhel et palmis in caelum levatis";
kjv[14] = "And said, O LORD God of Israel, [there is] no God like thee in the heaven, nor in the earth; which keepest covenant, and [shewest] mercy unto thy servants, that walk before thee with all their hearts:";
rsv[14] = "and said, &quot;O LORD, God of Israel, there is no God like thee, in heaven or on earth, keeping covenant and showing steadfast love to thy servants who walk before thee with all their heart;";
asv[14] = "and he said, O Jehovah, the God of Israel, there is no God like thee, in heaven, or on earth; who keepest covenant and lovingkindness with thy servants, that walk before thee with all their heart;";
yng[14] = "and saith, `O Jehovah God of Israel, there is not like Thee a god in the heavens and in the earth, keeping the covenant and the kindness for Thy servants who are walking before Thee with all their heart;";
dby[14] = "and said, Jehovah, God of Israel! there is no God like thee, in the heavens or on the earth, who keepest covenant and mercy with thy servants that walk before thee with all their heart;";
web[14] = "And said, O LORD God of Israel, [there is] no God like thee in the heaven, nor on the earth; who keepest covenant, and [showest] mercy to thy servants, that walk before thee with all their hearts:";
hnv[14] = "and he said, LORD, the God of Yisra\'el, there is no God like you, in heaven, or on eretz; who keep covenant and lovingkindness with your servants, who walk before you with all their heart;";
vul[14] = "ait Domine Deus Israhel non est similis tui Deus in caelo et in terra qui custodis pactum et misericordiam cum servis tuis qui ambulant coram te in toto corde suo";
kjv[15] = "Thou which hast kept with thy servant David my father that which thou hast promised him; and spakest with thy mouth, and hast fulfilled [it] with thine hand, as [it is] this day.";
rsv[15] = "who hast kept with thy servant David my father what thou didst declare to him; yea, thou didst speak with thy mouth, and with thy hand hast fulfilled it this day.";
asv[15] = "who hast kept with thy servant David my father that which thou didst promise him: yea, thou spakest with thy mouth, and hast fulfilled it with thy hand, as it is this day.";
yng[15] = "who hast kept for Thy servant David my father that which Thou didst speak to him; yea, Thou dost speak with Thy mouth, and with Thy hand hast fulfilled [it], as at this day.";
dby[15] = "who hast kept with thy servant David my father that which thou didst promise him; thou spokest with thy mouth, and hast fulfilled [it] with thy hand as at this day.";
web[15] = "Thou who hast kept with thy servant David my father that which thou hast promised him; and hast spoken with thy mouth, and hast fulfilled [it] with thy hand, as [it is] this day.";
hnv[15] = " who have kept with your servant David my father that which you did promise him: yes, you spoke with your mouth, and have fulfilled it with your hand, as it is this day.";
vul[15] = "qui praestitisti servo tuo David patri meo quaecumque locutus fueras ei et quae ore promiseras opere conplesti sicut et praesens tempus probat";
kjv[16] = "Now therefore, O LORD God of Israel, keep with thy servant David my father that which thou hast promised him, saying, There shall not fail thee a man in my sight to sit upon the throne of Israel; yet so that thy children take heed to their way to walk in my law, as thou hast walked before me.";
rsv[16] = "Now therefore, O LORD, God of Israel, keep with thy servant David my father what thou hast promised him, saying, \'There shall never fail you a man before me to sit upon the throne of Israel, if only your sons take heed to their way, to walk in my law as you have walked before me.\'";
asv[16] = "Now therefore, O Jehovah, the God of Israel, keep with thy servant David my father that which thou hast promised him, saying, There shall not fail thee a man in my sight to sit on the throne of Israel, if only thy children take heed to their way, to walk in my law as thou hast walked before me.";
yng[16] = "`And now, O Jehovah, God of Israel, keep for Thy servant David my father that which Thou didst speak to him, saying, There is not cut off to thee a man from before Me, sitting on the throne of Israel, only, if thy sons watch their way to walk in My law, as thou hast walked before Me.";
dby[16] = "And now, Jehovah, God of Israel, keep with thy servant David my father that which thou hast promised him saying, There shall not fail thee a man in my sight to sit on the throne of Israel, if only thy sons take heed to their way to walk in my law, as thou hast walked before me.";
web[16] = "Now therefore, O LORD God of Israel, keep with thy servant David my father that which thou hast promised him, saying, There shall not fail thee a man in my sight to sit upon the throne of Israel; provided thy children take heed to their way to walk in my law, as thou hast walked before me.";
hnv[16] = "Now therefore, LORD, the God of Yisra\'el, keep with your servant David my father that which you have promised him, saying, There shall not fail you a man in my sight to sit on the throne of Yisra\'el, if only your children take heed to their way, to walk in my law as you have walked before me.";
vul[16] = "nunc ergo Domine Deus Israhel imple servo tuo patri meo David quaecumque locutus es dicens non deficiet ex te vir coram me qui sedeat super thronum Israhel ita tamen si custodierint filii tui vias suas et ambulaverint in lege mea sicut et tu ambulasti coram me";
kjv[17] = "Now then, O LORD God of Israel, let thy word be verified, which thou hast spoken unto thy servant David.";
rsv[17] = "Now therefore, O LORD, God of Israel, let thy word be confirmed, which thou hast spoken to thy servant David.";
asv[17] = "Now therefore, O Jehovah, the God of Israel, let thy word be verified, which thou spakest unto thy servant David.";
yng[17] = "`And now, O Jehovah, God of Israel, is Thy word stedfast that Thou hast spoken to Thy servant, to David,";
dby[17] = "And now, Jehovah, God of Israel, let thy word be verified which thou hast spoken unto thy servant David.";
web[17] = "Now then, O LORD God of Israel, let thy word be verified, which thou hast spoken to thy servant David.";
hnv[17] = "Now therefore, LORD, the God of Yisra\'el, let your word be verified, which you spoke to your servant David.";
vul[17] = "et nunc Domine Deus Israhel firmetur sermo tuus quem locutus es servo tuo David";
kjv[18] = "But will God in very deed dwell with men on the earth? behold, heaven and the heaven of heavens cannot contain thee; how much less this house which I have built!";
rsv[18] = "&quot;But will God dwell indeed with man on the earth? Behold, heaven and the highest heaven cannot contain thee; how much less this house which I have built!";
asv[18] = "But will God in very deed dwell with men on the earth? behold, heaven and the heaven of heavens cannot contain thee; how much less this house which I have builded!";
yng[18] = "(for is it true? -- God dwelleth with man on the earth! Lo, the heavens, and the heavens of the heavens, do not contain Thee, how much less this house that I have built?)";
dby[18] = "But will God indeed dwell with man on the earth? behold, the heavens and the heaven of heavens cannot contain thee; how much less this house which I have built!";
web[18] = "But will God in very deed dwell with men on the earth? behold, heaven and the heaven of heavens cannot contain thee; how much less this house which I have built!";
hnv[18] = "But will God in very deed dwell with men on the eretz? behold, heaven and the heaven of heavens can\'t contain you; how much less this house which I have built!";
vul[18] = "ergone credibile est ut habitet Deus cum hominibus super terram si caelum et caeli caelorum non te capiunt quanto magis domus ista quam aedificavi";
kjv[19] = "Have respect therefore to the prayer of thy servant, and to his supplication, O LORD my God, to hearken unto the cry and the prayer which thy servant prayeth before thee:";
rsv[19] = "Yet have regard to the prayer of thy servant and to his supplication, O LORD my God, hearkening to the cry and to the prayer which thy servant prays before thee;";
asv[19] = "Yet have thou respect unto the prayer of thy servant, and to his supplication, O Jehovah my God, to hearken unto the cry and to the prayer which thy servant prayeth before thee;";
yng[19] = "`And Thou hast turned unto the prayer of Thy servant, and unto his supplication, O Jehovah my God, to hearken unto the cry and unto the prayer that Thy servant is praying before Thee,";
dby[19] = "Yet have respect unto the prayer of thy servant, and to his supplication, Jehovah, my God, to hearken unto the cry and to the prayer which thy servant prayeth before thee;";
web[19] = "Have respect therefore to the prayer of thy servant, and to his supplication, O LORD my God, to hearken to the cry and the prayer which thy servant prayeth before thee:";
hnv[19] = "Yet have you respect to the prayer of your servant, and to his supplication, LORD my God, to listen to the cry and to the prayer which your servant prays before you;";
vul[19] = "sed ad hoc tantum facta est ut respicias orationem servi tui et obsecrationem eius Domine Deus meus audias et preces quas fundit famulus tuus coram te";
kjv[20] = "That thine eyes may be open upon this house day and night, upon the place whereof thou hast said that thou wouldest put thy name there; to hearken unto the prayer which thy servant prayeth toward this place.";
rsv[20] = "that thy eyes may be open day and night toward this house, the place where thou hast promised to set thy name, that thou mayest hearken to the prayer which thy servant offers toward this place.";
asv[20] = "that thine eyes may be open toward this house day and night, even toward the place whereof thou hast said that thou wouldest put thy name there; to hearken unto the prayer which thy servant shall pray toward this place.";
yng[20] = "for Thine eyes being open towards this house by day and by night, towards the place that Thou hast said to put Thy name there, to hearken unto the prayer that Thy servant prayeth towards this place.";
dby[20] = "that thine eyes may be open upon this house day and night, upon the place in which thou hast said thou wouldest put thy name: to hearken unto the prayer which thy servant prayeth toward this place.";
web[20] = "That thy eyes may be open upon this house day and night, upon the place of which thou hast said, that thou wouldst put thy name there; to hearken to the prayer which thy servant prayeth towards this place.";
hnv[20] = "that your eyes may be open toward this house day and night, even toward the place whereof you have said that you would put your name there; to listen to the prayer which your servant shall pray toward this place.";
vul[20] = "ut aperias oculos tuos super domum istam diebus et noctibus super locum in quo pollicitus es ut invocaretur nomen tuum";
kjv[21] = "Hearken therefore unto the supplications of thy servant, and of thy people Israel, which they shall make toward this place: hear thou from thy dwelling place, [even] from heaven; and when thou hearest, forgive.";
rsv[21] = "And hearken thou to the supplications of thy servant and of thy people Israel, when they pray toward this place; yea, hear thou from heaven thy dwelling place; and when thou hearest, forgive.";
asv[21] = "And hearken thou to the supplications of thy servant, and of thy people Israel, when they shall pray toward this place: yea, hear thou from thy dwelling-place, even from heaven; and when thou hearest, forgive.";
yng[21] = "`And Thou hast hearkened unto the supplications of Thy servant, and of Thy people Israel, that they pray towards this place, and Thou dost hear from the place of Thy dwelling, from the heavens, and hast hearkened, and forgiven.";
dby[21] = "And hearken unto the supplications of thy servant, and of thy people Israel, which they shall pray toward this place, and hear thou from thy dwelling-place, from the heavens, and when thou hearest, forgive.";
web[21] = "Hearken therefore to the supplications of thy servant, and of thy people Israel, which they shall make towards this place: hear thou from thy dwelling-place, [even] from heaven; and when thou hearest, forgive.";
hnv[21] = "Listen you to the petitions of your servant, and of your people Yisra\'el, when they shall pray toward this place: yes, hear from your dwelling-place, even from heaven; and when you hear, forgive.";
vul[21] = "et exaudires orationem quam servus tuus orat in eo exaudi preces famuli tui et populi tui Israhel quicumque oraverit in loco isto et exaudi de habitaculo tuo id est de caelis et propitiare";
kjv[22] = "If a man sin against his neighbour, and an oath be laid upon him to make him swear, and the oath come before thine altar in this house;";
rsv[22] = "&quot;If a man sins against his neighbor and is made to take an oath, and comes and swears his oath before thy altar in this house,";
asv[22] = "If a man sin against his neighbor, and an oath be laid upon him to cause him to swear, and he come [and] swear before thine altar in this house;";
yng[22] = "`If a man doth sin against his neighbour, and he hath lifted up on him an oath to cause him to swear, and the oath hath come in before Thine altar in this house --";
dby[22] = "If a man have sinned against his neighbour, and an oath be laid upon him to adjure him, and the oath come before thine altar in this house;";
web[22] = "If a man shall sin against his neighbor, and an oath be laid upon him to make him swear, and the oath shall come before thy altar in this house;";
hnv[22] = "If a man sin against his neighbor, and an oath is laid on him to cause him to swear, and he comes and swears before your altar in this house;";
vul[22] = "si peccaverit quispiam in proximum suum et iurare contra eum paratus venerit seque maledicto constrinxerit coram altari in domo ista";
kjv[23] = "Then hear thou from heaven, and do, and judge thy servants, by requiting the wicked, by recompensing his way upon his own head; and by justifying the righteous, by giving him according to his righteousness.";
rsv[23] = "then hear thou from heaven, and act, and judge thy servants, requiting the guilty by bringing his conduct upon his own head, and vindicating the righteous by rewarding him according to his righteousness.";
asv[23] = "then hear thou from heaven, and do, and judge thy servants, requiting the wicked, to bring his way upon his own head; and justifying the righteous, to give him according to his righteousness.";
yng[23] = "then Thou dost hear from the heavens, and hast done, and hast judged Thy servants, to give back to the wicked, to put his way on his head, and to declare righteous the righteous, to give to him according to his righteousness.";
dby[23] = "then hear thou from the heavens, and do, and judge thy servants, requiting the wicked, to bring his way upon his own head; and justifying the righteous, giving him according to his righteousness.";
web[23] = "Then hear thou from heaven, and do, and judge thy servants, by requiting the wicked, by recompensing his way upon his own head; and by justifying the righteous, by giving him according to his righteousness.";
hnv[23] = "then hear from heaven, and do, and judge your servants, requiting the wicked, to bring his way on his own head; and justifying the righteous, to give him according to his righteousness.";
vul[23] = "tu audies de caelo et facies iudicium servorum tuorum ita ut reddas iniquo viam suam in caput proprium et ulciscaris iustum retribuens ei secundum iustitiam suam";
kjv[24] = "And if thy people Israel be put to the worse before the enemy, because they have sinned against thee; and shall return and confess thy name, and pray and make supplication before thee in this house;";
rsv[24] = "&quot;If thy people Israel are defeated before the enemy because they have sinned against thee, when they turn again and acknowledge thy name, and pray and make supplication to thee in this house,";
asv[24] = "And if thy people Israel be smitten down before the enemy, because they have sinned against thee, and shall turn again and confess thy name, and pray and make supplication before thee in this house;";
yng[24] = "`And if Thy people Israel is smitten before an enemy, because they sin against Thee, and they have turned back and confessed Thy name, and prayed and made supplication before Thee in this house --";
dby[24] = "And if thy people Israel be put to the worse before the enemy, because they have sinned against thee, and shall turn again and confess thy name, and pray, and make supplication before thee in this house;";
web[24] = "And if thy people Israel shall be put to the worse before the enemy, because they have sinned against thee; and shall return and confess thy name, and pray and make supplication before thee in this house;";
hnv[24] = "If your people Yisra\'el be struck down before the enemy, because they have sinned against you, and shall turn again and confess your name, and pray and make supplication before you in this house;";
vul[24] = "si superatus fuerit populus tuus Israhel ab inimicis peccabunt enim tibi et conversi egerint paenitentiam et obsecraverint nomen tuum et fuerint deprecati in loco isto";
kjv[25] = "Then hear thou from the heavens, and forgive the sin of thy people Israel, and bring them again unto the land which thou gavest to them and to their fathers.";
rsv[25] = "then hear thou from heaven, and forgive the sin of thy people Israel, and bring them again to the land which thou gavest to them and to their fathers.";
asv[25] = "then hear thou from heaven, and forgive the sin of thy people Israel, and bring them again unto the land which thou gavest to them and to their fathers.";
yng[25] = "then Thou dost hear from the heavens, and hast forgiven the sin of Thy people Israel, and caused them to turn back unto the ground that Thou hast given to them, and to their fathers.";
dby[25] = "then hear thou from the heavens, and forgive the sin of thy people Israel, and bring them again unto the land that thou gavest to them and to their fathers.";
web[25] = "Then hear thou from the heavens, and forgive the sin of thy people Israel, and bring them again to the land which thou gavest to them and to their fathers.";
hnv[25] = "then hear from heaven, and forgive the sin of your people Yisra\'el, and bring them again to the land which you gave to them and to their fathers.";
vul[25] = "tu exaudi de caelo et propitiare peccato populi tui Israhel et reduc eos in terram quam dedisti eis et patribus eorum";
kjv[26] = "When the heaven is shut up, and there is no rain, because they have sinned against thee; [yet] if they pray toward this place, and confess thy name, and turn from their sin, when thou dost afflict them;";
rsv[26] = "&quot;When heaven is shut up and there is no rain because they have sinned against thee, if they pray toward this place, and acknowledge thy name, and turn from their sin, when thou dost afflict them,";
asv[26] = "When the heavens are shut up, and there is no rain, because they have sinned against thee; if they pray toward this place, and confess thy name, and turn from their sin, when thou dost afflict them:";
yng[26] = "`In the heavens being restrained, and there is no rain, because they sin against Thee, and they have prayed towards this place, and confessed Thy name -- from their sin they turn back because Thou dost afflict them --";
dby[26] = "When the heavens are shut up, and there is no rain, because they have sinned against thee; if they pray toward this place, and confess thy name, and turn from their sin, because thou hast afflicted them;";
web[26] = "When the heaven is shut, and there is no rain, because they have sinned against thee; [yet] if they pray towards this place, and confess thy name, and turn from their sin, when thou dost afflict them;";
hnv[26] = "When the sky is shut up, and there is no rain, because they have sinned against you; if they pray toward this place, and confess your name, and turn from their sin, when you do afflict them:";
vul[26] = "si clauso caelo pluvia non fluxerit propter peccata populi et deprecati te fuerint in loco isto et confessi nomini tuo et conversi a peccatis suis cum eos adflixeris";
kjv[27] = "Then hear thou from heaven, and forgive the sin of thy servants, and of thy people Israel, when thou hast taught them the good way, wherein they should walk; and send rain upon thy land, which thou hast given unto thy people for an inheritance.";
rsv[27] = "then hear thou in heaven, and forgive the sin of thy servants, thy people Israel, when thou dost teach them the good way in which they should walk; and grant rain upon thy land, which thou hast given to thy people as an inheritance.";
asv[27] = "then hear thou in heaven, and forgive the sin of thy servants, and of thy people Israel, when thou teachest them the good way wherein they should walk; and send rain upon thy land, which thou hast given to thy people for an inheritance.";
yng[27] = "then Thou dost hear in the heavens, and hast forgiven the sin of Thy servants, and of Thy people Israel, because Thou directest them unto the good way in which they walk, and hast given rain on Thy land that Thou hast given to Thy people for an inheritance.";
dby[27] = "then hear thou in the heavens, and forgive the sin of thy servants, and of thy people Israel, when thou teachest them the good way wherein they should walk; and give rain upon thy land, which thou hast given to thy people for an inheritance.";
web[27] = "Then hear thou from heaven, and forgive the sin of thy servants, and of thy people Israel, when thou hast taught them the good way in which they should walk; and send rain upon thy land, which thou hast given to thy people for an inheritance.";
hnv[27] = "then hear in heaven, and forgive the sin of your servants, and of your people Yisra\'el, when you teach them the good way in which they should walk; and send rain on your land, which you have given to your people for an inheritance.";
vul[27] = "exaudi de caelo Domine et dimitte peccata servis tuis et populi tui Israhel et doce eos viam bonam per quam ingrediantur et da pluviam terrae quam dedisti populo tuo ad possidendum";
kjv[28] = "If there be dearth in the land, if there be pestilence, if there be blasting, or mildew, locusts, or caterpillers; if their enemies besiege them in the cities of their land; whatsoever sore or whatsoever sickness [there be]:";
rsv[28] = "&quot;If there is famine in the land, if there is pestilence or blight or mildew or locust or caterpillar; if their enemies besiege them in any of their cities; whatever plague, whatever sickness there is;";
asv[28] = "If there be in the land famine, if there be pestilence, if there be blasting or mildew, locust or caterpillar; if their enemies besiege them in the land of their cities; whatsoever plague or whatsoever sickness there be;";
yng[28] = "`Famine, when it is in the land, pestilence, when it is, blasting, and mildew, locust, and caterpillar, when they are, when its enemies have distressed it in the land -- its gates, any plague and any sickness;";
dby[28] = "If there be famine in the land, if there be pestilence, if there be blight or mildew, locust or caterpillar; if their enemies besiege them in the land of their gates; whatever plague or whatever sickness there be:";
web[28] = "If there shall be dearth in the land, if there be pestilence, if there be blasting, or mildew, locusts, or caterpillars; if their enemies shall besiege them in the cities of their land; whatever calamity, or whatever sickness [there be]:";
hnv[28] = "If there be in the land famine, if there be pestilence, if there be blasting or mildew, arbeh or caterpillar; if their enemies besiege them in the land of their cities; whatever plague or whatever sickness there be;";
vul[28] = "fames si orta fuerit in terra et pestilentia erugo et aurugo et lucusta et brucus et hostes vastatis regionibus portas obsederint civitatis omnisque plaga et infirmitas presserit";
kjv[29] = "[Then] what prayer [or] what supplication soever shall be made of any man, or of all thy people Israel, when every one shall know his own sore and his own grief, and shall spread forth his hands in this house:";
rsv[29] = "whatever prayer, whatever supplication is made by any man or by all thy people Israel, each knowing his own affliction, and his own sorrow and stretching out his hands toward this house;";
asv[29] = "what prayer and supplication soever be made by any man, or by all thy people Israel, who shall know every man his own plague and his own sorrow, and shall spread forth his hands toward this house:";
yng[29] = "any prayer, any supplication that is for any man, and for all Thy people Israel, when they know each his own plague, and his own pain, and he hath spread out his hands towards this house:";
dby[29] = "what prayer, what supplication soever be made by any man, or by all thy people Israel, when they shall know every man his own plague, and his own grief, and shall spread forth his hands toward this house;";
web[29] = "[Then] whatever prayer, [or] whatever supplication shall be made by any man, or by all the people of Israel, when every one shall know his own calamity, and his own grief, and shall spread forth his hands in this house:";
hnv[29] = " whatever prayer and supplication be made by any man, or by all your people Yisra\'el, who shall know every man his own plague and his own sorrow, and shall spread forth his hands toward this house:";
vul[29] = "si quis de populo tuo Israhel fuerit deprecatus cognoscens plagam et infirmitatem suam et expanderit manus suas in domo hac";
kjv[30] = "Then hear thou from heaven thy dwelling place, and forgive, and render unto every man according unto all his ways, whose heart thou knowest; (for thou only knowest the hearts of the children of men:)";
rsv[30] = "then hear thou from heaven thy dwelling place, and forgive, and render to each whose heart thou knowest, according to all his ways (for thou, thou only, knowest the hearts of the children of men);";
asv[30] = "then hear thou from heaven thy dwelling-place, and forgive, and render unto every man according to all his ways, whose heart thou knowest (for thou, even thou only, knowest the hearts of the children of men);";
yng[30] = "then Thou dost hear from the heavens, the settled place of Thy dwelling, and hast forgiven, and hast given to each according to all his ways (because Thou knowest his heart, for Thou -- Thou only -- hast known the heart of the sons of men),";
dby[30] = "then hear thou from the heavens, the settled place of thy dwelling, and forgive, and render unto every man according to all his ways, whose heart thou knowest (for thou, thou only, knowest the hearts of the children of men),";
web[30] = "Then hear thou from heaven thy dwelling-place, and forgive, and render to every man according to all his ways, whose heart thou knowest (for thou only knowest the hearts of the children of men:)";
hnv[30] = "then hear from heaven, your dwelling-place and forgive, and render to every man according to all his ways, whose heart you know; (for you, even you only, know the hearts of the children of men;)";
vul[30] = "tu exaudi de caelo de sublimi scilicet habitaculo tuo et propitiare et redde unicuique secundum vias suas quas nosti eum habere in corde suo tu enim solus nosti corda filiorum hominum";
kjv[31] = "That they may fear thee, to walk in thy ways, so long as they live in the land which thou gavest unto our fathers.";
rsv[31] = "that they may fear thee and walk in thy ways all the days that they live in the land which thou gavest to our fathers.";
asv[31] = "that they may fear thee, to walk in thy ways, so long as they live in the land which thou gavest unto our fathers.";
yng[31] = "so that they fear Thee, to walk in Thy ways, all the days that they are living on the face of the ground that Thou hast given to our fathers.";
dby[31] = "that they may fear thee, to walk in thy ways, all the days that they live upon the land which thou gavest unto our fathers.";
web[31] = "That they may fear thee, to walk in thy ways, so long as they live in the land which thou gavest to our fathers.";
hnv[31] = "that they may fear you, to walk in your ways, so long as they live in the land which you gave to our fathers.";
vul[31] = "ut timeant te et ambulent in viis tuis cunctis diebus quibus vivunt super faciem terrae quam dedisti patribus nostris";
kjv[32] = "Moreover concerning the stranger, which is not of thy people Israel, but is come from a far country for thy great name\'s sake, and thy mighty hand, and thy stretched out arm; if they come and pray in this house;";
rsv[32] = "&quot;Likewise when a foreigner, who is not of thy people Israel, comes from a far country for the sake of thy great name, and thy mighty hand, and thy outstretched arm, when he comes and prays toward this house,";
asv[32] = "Moreover concerning the foreigner, that is not of thy people Israel, when he shall come from a far country for thy great name\'s sake, and thy mighty hand, and thine outstretched arm; when they shall come and pray toward this house:";
yng[32] = "`And also, unto the stranger who is not of Thy people Israel, and he hath come from a land afar off for the sake of Thy great name, and Thy strong hand, and Thy stretched-out arm, and they have come in and prayed towards this house:";
dby[32] = "And as to the stranger also, who is not of thy people Israel, but cometh out of a far country for thy great name\'s sake, and thy mighty hand and thy stretched-out arm; when they shall come and pray toward this house,";
web[32] = "Moreover concerning the stranger, who is not of thy people Israel, but hath come from a distant country for thy great name\'s sake, and thy mighty hand, and thy out-stretched arm; if they come and pray in this house;";
hnv[32] = "Moreover concerning the foreigner, who is not of your people Yisra\'el, when he shall come from a far country for your great name\'s sake, and your mighty hand, and your outstretched arm; when they shall come and pray toward this house:";
vul[32] = "externum quoque qui non est de populo tuo Israhel si venerit de terra longinqua propter nomen tuum magnum et propter manum tuam robustam et brachium tuum extentum et adoraverit in loco isto";
kjv[33] = "Then hear thou from the heavens, [even] from thy dwelling place, and do according to all that the stranger calleth to thee for; that all people of the earth may know thy name, and fear thee, as [doth] thy people Israel, and may know that this house which I have built is called by thy name.";
rsv[33] = "hear thou from heaven thy dwelling place, and do according to all for which the foreigner calls to thee; in order that all the peoples of the earth may know thy name and fear thee, as do thy people Israel, and that they may know that this house which I have built is called by thy name.";
asv[33] = "then hear thou from heaven, even from thy dwelling-place, and do according to all that the foreigner calleth to thee for; that all the peoples of the earth may know thy name, and fear thee, as doth thy people Israel, and that they may know that this house which I have built is called by thy name.";
yng[33] = "then Thou dost hear from the heavens, from the settled place of Thy dwelling, and hast done according to all that the stranger calleth unto Thee for: so that all the peoples of the earth do know Thy name, so as to fear Thee, as Thy people Israel, and to know that Thy name is called on this house that I have built.";
dby[33] = "then hear thou from the heavens, the settled place of thy dwelling, and do according to all that the stranger calleth to thee for; in order that all peoples of the earth may know thy name, and may fear thee as do thy people Israel, and may know that this house which I have built is called by thy name.";
web[33] = "Then hear thou from the heavens, [even] from thy dwelling-place, and do according to all that the stranger calleth to thee for; that all people of the earth may know thy name, and fear thee, as [do] thy people Israel, and may know that this house which I have built is called by thy name.";
hnv[33] = "then hear from heaven, even from your dwelling-place, and do according to all that the foreigner calls to you for; that all the peoples of the eretz may know your name, and fear you, as does your people Yisra\'el, and that they may know that this house which I have built is called by your name.";
vul[33] = "tu exaudies de caelo firmissimo habitaculo tuo et facies cuncta pro quibus invocaverit te ille peregrinus ut sciant omnes populi terrae nomen tuum et timeant te sicut populus tuus Israhel et cognoscant quia nomen tuum invocatum est super domum hanc quam aedificavi";
kjv[34] = "If thy people go out to war against their enemies by the way that thou shalt send them, and they pray unto thee toward this city which thou hast chosen, and the house which I have built for thy name;";
rsv[34] = "&quot;If thy people go out to battle against their enemies, by whatever way thou shalt send them, and they pray to thee toward this city which thou hast chosen and the house which I have built for thy name,";
asv[34] = "If thy people go out to battle against their enemies, by whatsoever way thou shalt send them, and they pray unto thee toward this city which thou hast chosen, and the house which I have built for thy name;";
yng[34] = "`When Thy people doth go out to battle against its enemies in the way that Thou dost send them, and they have prayed unto Thee the way of this city that Thou hast fixed on, and the house that I have built for Thy name:";
dby[34] = "If thy people go out to battle against their enemies by the way that thou shalt send them, and they pray unto thee toward this city that thou hast chosen, and the house that I have built unto thy name;";
web[34] = "If thy people go out to war against their enemies by the way that thou shalt send them, and they pray to thee towards this city which thou hast chosen, and the house which I have built for thy name;";
hnv[34] = "If your people go out to battle against their enemies, by whatever way you shall send them, and they pray to you toward this city which you have chosen, and the house which I have built for your name;";

kjv[36] = "If they sin against thee, (for [there is] no man which sinneth not,) and thou be angry with them, and deliver them over before [their] enemies, and they carry them away captives unto a land far off or near;";

rsv[37] = "yet if they lay it to heart in the land to which they have been carried captive, and repent, and make supplication to thee in the land of their captivity, saying, \'We have sinned, and have acted perversely and wickedly\';";

yng[37] = "and they have turned [it] back unto their heart in the land whither they have been taken captive, and have turned back, and made supplication unto Thee in the land of their captivity, saying, We have sinned, we have done perversely, and have done wickedly;";
dby[37] = "and if they shall take it to heart in the land whither they were carried captive, and repent, and make supplication unto thee in the land of their captivity, saying, We have sinned, we have done iniquity and have dealt perversely;";
