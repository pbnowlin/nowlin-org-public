csb[1] = "His son Jehoshaphat became king in his place and strengthened himself against Israel.";
csb[2] = "He stationed troops in every fortified city of Judah and set garrisons in the land of Judah and in the cities of Ephraim that his father Asa had captured.";
csb[3] = "Now the LORD was with Jehoshaphat because he walked in the former ways of his father David. He did not seek the Baals";
csb[4] = "but sought the God of his father and walked by his commands, not according to the practices of Israel.";
csb[5] = "So the LORD established the kingdom in his hand. Then all Judah brought him tribute, and he had riches and honor in abundance.";
csb[6] = "His mind rejoiced in the LORD\'s ways, and he again removed the high places and Asherah poles from Judah.";
csb[7] = "In the third year of his reign, Jehoshaphat sent his officials -- Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah -- to teach in the cities of Judah.";
csb[8] = "The Levites with them were Shemaiah, Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; the priests, Elishama and Jehoram, were with these Levites.";
csb[9] = "They taught throughout Judah, having the book of the LORD\'s instruction with them. They went throughout the towns of Judah and taught the people.";
csb[10] = "The terror of the LORD was on all the kingdoms of the lands that surrounded Judah, so they didn\'t fight against Jehoshaphat.";
csb[11] = "Some of the Philistines also brought gifts and silver as tribute to Jehoshaphat, and the Arabs brought him flocks: 7,700 rams and 7,700 male goats.";
csb[12] = "Jehoshaphat grew stronger and stronger. He built fortresses and storage cities in Judah";
csb[13] = "and carried out great works in the towns of Judah. He had fighting men, valiant warriors, in Jerusalem.";
csb[14] = "These are their numbers according to their ancestral families. For Judah, the commanders of thousands: Adnah the commander and three hundred thousand valiant warriors with him;";
csb[15] = "next to him, Jehohanan the commander and two hundred eighty thousand with him;";
csb[16] = "next to him, Amasiah son of Zichri, the volunteer of the LORD, and two hundred thousand valiant warriors with him;";
csb[17] = "from Benjamin, Eliada, a valiant warrior, and two hundred thousand with him armed with bow and shield;";
csb[18] = "next to him, Jehozabad and one hundred eighty thousand with him equipped for war.";
csb[19] = "These were the ones who served the king, besides those he stationed in the fortified cities throughout all Judah.";
kjv[1] = "And Jehoshaphat his son reigned in his stead, and strengthened himself against Israel.";

web[1] = "And Jehoshaphat his son reigned in his stead, and strengthened himself against Israel.";
hnv[1] = "Yehoshafat his son reigned in his place, and strengthened himself against Yisra\'el.";
vul[1] = "regnavit autem Iosaphat filius eius pro eo et invaluit contra Israhel";
kjv[2] = "And he placed forces in all the fenced cities of Judah, and set garrisons in the land of Judah, and in the cities of Ephraim, which Asa his father had taken.";
rsv[2] = "He placed forces in all the fortified cities of Judah, and set garrisons in the land of Judah, and in the cities of E\'phraim which Asa his father had taken.";
asv[2] = "And he placed forces in all the fortified cities of Judah, and set garrisons in the land of Judah, and in the cities of Ephraim, which Asa his father had taken.";
yng[2] = "and putteth a force in all the fenced cities of Judah, and putteth garrisons in the land of Judah, and in the cities of Ephraim that Asa his father had captured.";
dby[2] = "And he placed forces in all the fortified cities of Judah, and set garrisons in the land of Judah, and in the cities of Ephraim that Asa his father had taken.";
web[2] = "And he placed forces in all the fortified cities of Judah, and set garrisons in the land of Judah, and in the cities of Ephraim, which Asa his father had taken.";
hnv[2] = "He placed forces in all the fortified cities of Yehudah, and set garrisons in the land of Yehudah, and in the cities of Efrayim, which Asa his father had taken.";
vul[2] = "constituitque militum numeros in cunctis urbibus Iudae quae erant vallatae muris praesidiaque disposuit in terra Iuda et in civitatibus Ephraim quas ceperat Asa pater eius";
kjv[3] = "And the LORD was with Jehoshaphat, because he walked in the first ways of his father David, and sought not unto Baalim;";
rsv[3] = "The LORD was with Jehosh\'aphat, because he walked in the earlier ways of his father; he did not seek the Ba\'als,";
asv[3] = "And Jehovah was with Jehoshaphat, because he walked in the first ways of his father David, and sought not unto the Baalim,";
yng[3] = "And Jehovah is with Jehoshaphat, for he hath walked in the first ways of David his father, and hath not sought to Baalim,";
dby[3] = "And Jehovah was with Jehoshaphat, for he walked in the first ways of his father David, and sought not unto the Baals;";
web[3] = "And the LORD was with Jehoshaphat, because he walked in the first ways of his father David, and sought not to Baalim;";
hnv[3] = "The LORD was with Yehoshafat, because he walked in the first ways of his father David, and didn\'t seek the Ba`alim,";
vul[3] = "et fuit Dominus cum Iosaphat quia ambulavit in viis David patris sui primis et non speravit in Baalim";
kjv[4] = "But sought to the [LORD] God of his father, and walked in his commandments, and not after the doings of Israel.";
rsv[4] = "but sought the God of his father and walked in his commandments, and not according to the ways of Israel.";
asv[4] = "but sought to the God of his father, and walked in his commandments, and not after the doings of Israel.";
yng[4] = "for to the God of his father he hath sought, and in His commands he hath walked, and not according to the work of Israel.";
dby[4] = "but he sought the God of his father, and walked in his commandments, and not after the doings of Israel.";
web[4] = "But sought to the [LORD] God of his father, and walked in his commandments, and not after the doings of Israel.";
hnv[4] = "but sought to the God of his father, and walked in his mitzvot, and not after the doings of Yisra\'el.";
vul[4] = "sed in Deo patris sui et perrexit in praeceptis illius et non iuxta peccata Israhel";
kjv[5] = "Therefore the LORD stablished the kingdom in his hand; and all Judah brought to Jehoshaphat presents; and he had riches and honour in abundance.";
rsv[5] = "Therefore the LORD established the kingdom in his hand; and all Judah brought tribute to Jehosh\'aphat; and he had great riches and honor.";
asv[5] = "Therefore Jehovah established the kingdom in his hand; and all Judah brought to Jehoshaphat tribute; and he had riches and honor in abundance.";
yng[5] = "And Jehovah doth establish the kingdom in his hand, and all Judah give a present to Jehoshaphat, and he hath riches and honour in abundance,";
dby[5] = "And Jehovah established the kingdom in his hand; and all Judah gave gifts to Jehoshaphat; and he had riches and honour in abundance.";

hnv[5] = "Therefore the LORD established the kingdom in his hand; and all Yehudah brought to Yehoshafat tribute; and he had riches and honor in abundance.";
vul[5] = "confirmavitque Dominus regnum in manu eius et dedit omnis Iuda munera Iosaphat factaeque sunt ei infinitae divitiae et multa gloria";
kjv[6] = "And his heart was lifted up in the ways of the LORD: moreover he took away the high places and groves out of Judah.";
rsv[6] = "His heart was courageous in the ways of the LORD; and furthermore he took the high places and the Ashe\'rim out of Judah.";

yng[6] = "and his heart is high in the ways of Jehovah, and again he hath turned aside the high places and the shrines out of Judah.";
dby[6] = "And he took courage in the ways of Jehovah; moreover, he removed the high places and Asherahs out of Judah.";

hnv[6] = "His heart was lifted up in the ways of the LORD: and furthermore he took away the high places and the Asherim out of Yehudah.";
vul[6] = "cumque sumpsisset cor eius audaciam propter vias Domini etiam excelsa et lucos de Iuda abstulit";
kjv[7] = "Also in the third year of his reign he sent to his princes, [even] to Benhail, and to Obadiah, and to Zechariah, and to Nethaneel, and to Michaiah, to teach in the cities of Judah.";

dby[7] = "And in the third year of his reign he sent his princes, Ben-hail, and Obadiah, and Zechariah, and Nethaneel, and Micah, to teach in the cities of Judah;";

kjv[8] = "And with them [he sent] Levites, [even] Shemaiah, and Nethaniah, and Zebadiah, and Asahel, and Shemiramoth, and Jehonathan, and Adonijah, and Tobijah, and Tobadonijah, Levites; and with them Elishama and Jehoram, priests.";

vul[8] = "et cum eis Levitas Semeiam et Nathaniam et Zabadiam Asahel quoque et Semiramoth et Ionathan Adoniam et Tobiam et Tobadoniam Levitas et cum eis Elisama et Ioram sacerdotes";
kjv[9] = "And they taught in Judah, and [had] the book of the law of the LORD with them, and went about throughout all the cities of Judah, and taught the people.";
rsv[9] = "And they taught in Judah, having the book of the law of the LORD with them; they went about through all the cities of Judah and taught among the people.";

kjv[10] = "And the fear of the LORD fell upon all the kingdoms of the lands that [were] round about Judah, so that they made no war against Jehoshaphat.";
rsv[10] = "And the fear of the LORD fell upon all the kingdoms of the lands that were round about Judah, and they made no war against Jehosh\'aphat.";

yng[10] = "And here is a fear of Jehovah on all kingdoms of the lands that [are] round about Judah, and they have not fought with Jehoshaphat;";
dby[10] = "And the terror of Jehovah was upon all the kingdoms of the lands that were round about Judah, and they made no war against Jehoshaphat.";
web[10] = "And the fear of the LORD fell upon all the kingdoms of the lands that [were] around Judah, so that they made no war against Jehoshaphat.";
hnv[10] = "The fear of the LORD fell on all the kingdoms of the lands that were round about Yehudah, so that they made no war against Yehoshafat.";
vul[10] = "itaque factus est pavor Domini super omnia regna terrarum quae erant per gyrum Iuda nec audebant bellare contra Iosaphat";
kjv[11] = "Also [some] of the Philistines brought Jehoshaphat presents, and tribute silver; and the Arabians brought him flocks, seven thousand and seven hundred rams, and seven thousand and seven hundred he goats.";

dby[11] = "And some of the Philistines brought Jehoshaphat gifts and tribute-silver. The Arabians also brought him flocks, seven thousand seven hundred rams, and seven thousand seven hundred he-goats.";
