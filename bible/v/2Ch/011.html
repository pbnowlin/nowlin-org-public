csb[1] = "When Rehoboam arrived in Jerusalem, he mobilized the house of Judah and Benjamin -- one hundred eighty thousand fit young soldiers -- to fight against Israel to restore the reign to Rehoboam.";
csb[2] = "But the word of the LORD came to Shemaiah, the man of God:";
csb[3] = "&quot;Say to Rehoboam son of Solomon, king of Judah, to all Israel in Judah and Benjamin, and to the rest of the people:";
csb[4] = "&quot;\'This is what the LORD says: You are not to march up and fight against your brothers. Each of you return home, for this incident has come from me.\' &quot; So they listened to what the LORD said and turned back from going against Jeroboam.";
csb[5] = "Rehoboam stayed in Jerusalem, and he fortified cities in Judah.";
csb[6] = "He built up Bethlehem, Etam, Tekoa,";
csb[7] = "Beth-zur, Soco, Adullam,";
csb[8] = "Gath, Mareshah, Ziph,";
csb[9] = "Adoraim, Lachish, Azekah,";
csb[10] = "Zorah, Aijalon, and Hebron, which are fortified cities in Judah and in Benjamin.";
csb[11] = "He strengthened their fortifications and put leaders in them with supplies of food, oil, and wine.";
csb[12] = "He also put large shields and spears in each and every city to make them very strong. So Judah and Benjamin were his.";
csb[13] = "The priests and Levites from all their regions throughout Israel took their stand with Rehoboam,";
csb[14] = "for the Levites left their pasturelands and their possessions and went to Judah and Jerusalem, because Jeroboam and his sons refused to let them serve as priests of the LORD.";
csb[15] = "Jeroboam appointed his own priests for the high places, the goat-demons, and the golden calves he had made.";
csb[16] = "Those from every tribe of Israel who had determined in their hearts to seek the LORD their God followed the Levites to Jerusalem to sacrifice to the LORD, the God of their ancestors.";
csb[17] = "So they strengthened the kingdom of Judah and supported Rehoboam son of Solomon for three years, because they walked in the ways of David and Solomon for three years.";
csb[18] = "Rehoboam married Mahalath, daughter of David\'s son Jerimoth and of Abihail daughter of Jesse\'s son Eliab.";
csb[19] = "She bore sons to him: Jeush, Shemariah, and Zaham.";
csb[20] = "After her, he married Maacah daughter of Absalom. She bore Abijah, Attai, Ziza, and Shelomith to him.";
csb[21] = "Rehoboam loved Maacah daughter of Absalom more than all his wives and concubines. He acquired eighteen wives and sixty concubines and was the father of twenty-eight sons and sixty daughters.";
csb[22] = "Rehoboam appointed Abijah son of Maacah as chief, leader among his brothers, intending to make him king.";
csb[23] = "Rehoboam also showed discernment by dispersing some of his sons to all the regions of Judah and Benjamin and to all the fortified cities. He gave them plenty of provisions and sought many wives for them.";

dby[1] = "And Rehoboam came to Jerusalem; and he assembled the house of Judah and Benjamin, a hundred and eighty thousand chosen men apt for war, to fight against Israel, that he might bring the kingdom again to Rehoboam.";
