csb[1] = "When Solomon finished praying, fire descended from heaven and consumed the burnt offering and the sacrifices, and the glory of the LORD filled the temple.";
csb[2] = "The priests were not able to enter the LORD\'s temple because the glory of the LORD filled the temple of the LORD.";
csb[3] = "All the Israelites were watching when the fire descended and the glory of the LORD came on the temple. They bowed down on the pavement with their faces to the ground. They worshiped and praised the LORD: For he is good, for his faithful love endures forever.";
csb[4] = "The king and all the people were offering sacrifices in the LORD\'s presence.";
csb[5] = "King Solomon offered a sacrifice of twenty-two thousand cattle and one hundred twenty thousand sheep and goats. In this manner the king and all the people dedicated God\'s temple.";
csb[6] = "The priests and the Levites were standing at their stations. The Levites had the musical instruments of the LORD, which King David had made to give thanks to the LORD -- &quot;for his faithful love endures forever&quot; -- when he offered praise with them. Across from the Levites, the priests were blowing trumpets, and all the people were standing.";
csb[7] = "Since the bronze altar that Solomon had made could not accommodate the burnt offering, the grain offering, and the fat of the fellowship offerings, Solomon first consecrated the middle of the courtyard that was in front of the LORD\'s temple and then offered the burnt offerings and the fat of the fellowship offerings there.";
csb[8] = "So Solomon and all Israel with him -- a very great assembly, from the entrance to Hamath to the Brook of Egypt -- observed the festival at that time for seven days.";
csb[9] = "On the eighth day they held a sacred assembly, for the dedication of the altar lasted seven days and the festival seven days.";
csb[10] = "On the twenty-third day of the seventh month he sent the people home, rejoicing and with happy hearts for the goodness the LORD had done for David, for Solomon, and for his people Israel.";
csb[11] = "So Solomon finished the LORD\'s temple and the royal palace. Everything that had entered Solomon\'s heart to do for the LORD\'s temple and for his own palace succeeded.";
csb[12] = "Then the LORD appeared to Solomon at night and said to him: I have heard your prayer and have chosen this place for myself as a temple of sacrifice.";
csb[13] = "If I shut the sky so there is no rain, or if I command the grasshopper to consume the land, or if I send pestilence on my people,";
csb[14] = "and my people, who bear my name, humble themselves, pray and seek my face, and turn from their evil ways, then I will hear from heaven, forgive their sin, and heal their land.";
csb[15] = "My eyes will now be open and my ears attentive to prayer from this place.";
csb[16] = "And I have now chosen and consecrated this temple so that my name may be there forever; my eyes and my heart will be there at all times.";
csb[17] = "As for you, if you walk before me as your father David walked, doing everything I have commanded you, and if you keep my statutes and ordinances,";
csb[18] = "I will establish your royal throne, as I promised your father David: You will never fail to have a man ruling in Israel.";
csb[19] = "However, if you turn away and abandon my statutes and my commands that I have set before you and if you go and serve other gods and bow in worship to them,";
csb[20] = "then I will uproot Israel from the soil that I gave them, and this temple that I have sanctified for my name I will banish from my presence; I will make it an object of scorn and ridicule among all the peoples.";
csb[21] = "As for this temple, which was exalted, everyone who passes by will be appalled and will say: Why did the LORD do this to this land and this temple?";
csb[22] = "Then they will say: Because they abandoned the LORD God of their ancestors who brought them out of the land of Egypt. They clung to other gods and bowed in worship to them and served them. Because of this, he brought all this ruin on them.";

kjv[3] = "And when all the children of Israel saw how the fire came down, and the glory of the LORD upon the house, they bowed themselves with their faces to the ground upon the pavement, and worshipped, and praised the LORD, [saying], For [he is] good; for his mercy [endureth] for ever.";
rsv[3] = "When all the children of Israel saw the fire come down and the glory of the LORD upon the temple, they bowed down with their faces to the earth on the pavement, and worshiped and gave thanks to the LORD, saying, &quot;For he is good, for his steadfast love endures for ever.&quot;";
asv[3] = "And all the children of Israel looked on, when the fire came down, and the glory of Jehovah was upon the house; and they bowed themselves with their faces to the ground upon the pavement, and worshipped, and gave thanks unto Jehovah, [saying], For he is good; for his lovingkindness [endureth] for ever.";
yng[3] = "And all the sons of Israel are looking on the descending of the fire, and the honour of Jehovah on the house, and they bow -- faces to the earth -- on the pavement, and do obeisance, and give thanks to Jehovah, for good, for to the age [is] His kindness.";
dby[3] = "And all the children of Israel saw how the fire came down, and the glory of Jehovah upon the house, and bowed themselves with their faces to the ground on the pavement, and worshipped and thanked Jehovah: For he is good, for his loving-kindness [endureth] for ever.";
web[3] = "And when all the children of Israel saw how the fire came down, and the glory of the LORD upon the house, they bowed themselves with their faces to the ground upon the pavement, and worshiped, and praised the LORD, [saying], For [he is] good; for his mercy [endureth] for ever.";
hnv[3] = "All the children of Yisra\'el looked on, when the fire came down, and the glory of the LORD was on the house; and they bowed themselves with their faces to the ground on the pavement, and worshiped, and gave thanks to the LORD, [saying], For he is good; for his lovingkindness endures for ever.";

kjv[6] = "And the priests waited on their offices: the Levites also with instruments of musick of the LORD, which David the king had made to praise the LORD, because his mercy [endureth] for ever, when David praised by their ministry; and the priests sounded trumpets before them, and all Israel stood.";
rsv[6] = "The priests stood at their posts; the Levites also, with the instruments for music to the LORD which King David had made for giving thanks to the LORD--for his steadfast love endures for ever--whenever David offered praises by their ministry; opposite them the priests sounded trumpets; and all Israel stood.";
asv[6] = "And the priests stood, according to their offices; the Levites also with instruments of music of Jehovah, which David the king had made to give thanks unto Jehovah (for his lovingkindness [endureth] for ever), when David praised by their ministry: and the priests sounded trumpets before them; and all Israel stood.";
yng[6] = "And the priests over their charges are standing, and the Levites with instruments of the song of Jehovah -- that David the king made, to give thanks to Jehovah, for to the age [is] His kindness, in David\'s praising by their hand -- and the priests are blowing trumpets over-against them, and all Israel are standing.";
dby[6] = "And the priests stood in their charges, and the Levites with Jehovah\'s instruments of music, which David the king had made to praise Jehovah, for his loving-kindness [endureth] for ever, when David praised by their means; and the priests sounded the trumpets opposite to them, and all Israel stood.";
web[6] = "And the priests waited on their offices: the Levites also with instruments of music of the LORD, which David the king had made to praise the LORD, because his mercy [endureth] for ever, when David praised by their ministry; and the priests sounded trumpets before them, and all Israel stood.";
hnv[6] = "The Kohanim stood, according to their offices; the Levites also with instruments of music of the LORD, which David the king had made to give thanks to the LORD, (for his lovingkindness endures for ever,) when David praised by their ministry: and the Kohanim sounded trumpets before them; and all Yisra\'el stood.";

yng[7] = "And Solomon sanctifieth the middle of the court that [is] before the house of Jehovah, for he hath made there the burnt-offerings, and the fat of the peace-offerings: for the altar of brass that Solomon made hath not been able to contain the burnt-offering, and the present, and the fat.";
