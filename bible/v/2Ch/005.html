csb[1] = "So all the work Solomon did for the LORD\'s temple was completed. Then Solomon brought the consecrated things of his father David -- the silver, the gold, and all the utensils -- and put them in the treasuries of God\'s temple.";
csb[2] = "At that time Solomon assembled at Jerusalem the elders of Israel -- all the tribal heads, the ancestral chiefs of the Israelites -- in order to bring the ark of the covenant of the LORD up from the city of David, that is, Zion.";
csb[3] = "So all the men of Israel were assembled in the king\'s presence at the festival; this was in the seventh month.";
csb[4] = "All the elders of Israel came, and the Levites picked up the ark.";
csb[5] = "They brought up the ark, the tent of meeting, and the holy utensils that were in the tent. The priests and the Levites brought them up.";
csb[6] = "King Solomon and the entire congregation of Israel who had gathered around him were in front of the ark sacrificing sheep, goats, and cattle that could not be counted or numbered because there were so many.";
csb[7] = "The priests brought the ark of the LORD\'s covenant to its place, into the inner sanctuary of the temple, to the most holy place, beneath the wings of the cherubim.";
csb[8] = "And the cherubim spread their wings over the place of the ark so that the cherubim formed a cover above the ark and its poles.";
csb[9] = "The poles were so long that their ends were seen from the holy place in front of the inner sanctuary, but they were not seen from outside; they are still there today.";
csb[10] = "Nothing was in the ark except the two tablets that Moses had put in it at Horeb, where the LORD had made a covenant with the Israelites when they came out of Egypt.";
csb[11] = "Now all the priests who were present had consecrated themselves regardless of their divisions. When the priests came out of the holy place,";
csb[12] = "the Levitical singers dressed in fine linen and carrying cymbals, harps, and lyres were standing east of the altar, and with them were 120 priests blowing trumpets. The Levitical singers were descendants of Asaph, Heman, and Jeduthun and their sons and relatives.";
csb[13] = "The trumpeters and singers joined together to praise and thank the LORD with one voice. They raised their voices, accompanied by trumpets, cymbals, and musical instruments, in praise to the LORD: For he is good; his faithful love endures forever. The temple, the LORD\'s temple, was filled with a cloud.";
csb[14] = "And because of the cloud, the priests were not able to continue ministering, for the glory of the LORD filled God\'s temple.";
kjv[1] = "Thus all the work that Solomon made for the house of the LORD was finished: and Solomon brought in [all] the things that David his father had dedicated; and the silver, and the gold, and all the instruments, put he among the treasures of the house of God.";
rsv[1] = "Thus all the work that Solomon did for the house of the LORD was finished. And Solomon brought in the things which David his father had dedicated, and stored the silver, the gold, and all the vessels in the treasuries of the house of God.";
asv[1] = "Thus all the work that Solomon wrought for the house of Jehovah was finished. And Solomon brought in the things that David his father had dedicated, even the silver, and the gold, and all the vessels, and put them in the treasuries of the house of God.";
yng[1] = "And all the work that Solomon made for the house of Jehovah is finished, and Solomon bringeth in the sanctified things of David his father, and the silver, and the gold, and all the vessels he hath put among the treasures of the house of God.";

hnv[1] = "Thus all the work that Shlomo did for the house of the LORD was finished. Shlomo brought in the things that David his father had dedicated, even the silver, and the gold, and all the vessels, and put them in the treasuries of the house of God.";

kjv[12] = "Also the Levites [which were] the singers, all of them of Asaph, of Heman, of Jeduthun, with their sons and their brethren, [being] arrayed in white linen, having cymbals and psalteries and harps, stood at the east end of the altar, and with them an hundred and twenty priests sounding with trumpets:)";
rsv[12] = "and all the Levitical singers, Asaph, Heman, and Jedu\'thun, their sons and kinsmen, arrayed in fine linen, with cymbals, harps, and lyres, stood east of the altar with a hundred and twenty priests who were trumpeters;";
asv[12] = "also the Levites who were the singers, all of them, even Asaph, Heman, Jeduthun, and their sons and their brethren, arrayed in fine linen, with cymbals and psalteries and harps, stood at the east end of the altar, and with them a hundred and twenty priests sounding with trumpets);";
yng[12] = "and the Levites, the singers, to all of them, to Asaph, to Heman, to Jeduthun, and to their sons, and to their brethren, clothed in white linen, with cymbals, and with psalteries, and harps, are standing on the east of the altar, and with them priests, to a hundred and twenty, blowing with trumpets --";
dby[12] = "and the Levites the singers, all they of Asaph, of Heman, of Jeduthun, with their sons and their brethren, clad in byssus, with cymbals and lutes and harps, stood at the east end of the altar, and with them a hundred and twenty priests sounding with trumpets),";
web[12] = "Also the Levites [who were] the singers, all of them of Asaph, of Heman, of Jeduthun, with their sons and their brethren; [being] arrayed in white linen, having cymbals and psalteries and harps, stood at the east end of the altar, and with them a hundred and twenty priests sounding with trumpets:)";
hnv[12] = "also the Levites who were the singers, all of them, even Asaf, Heman, Yedutun, and their sons and their brothers, arrayed in fine linen, with cymbals and psalteries and harps, stood at the east end of the altar, and with them one hundred twenty Kohanim sounding with trumpets;)";
vul[12] = "tam Levitae quam cantores id est et qui sub Asaph erant et qui sub Heman et qui sub Idithun filii et fratres eorum vestiti byssinis cymbalis et psalteriis et citharis concrepabant stantes ad orientalem plagam altaris cumque eis sacerdotes centum viginti canentes tubis";
kjv[13] = "It came even to pass, as the trumpeters and singers [were] as one, to make one sound to be heard in praising and thanking the LORD; and when they lifted up [their] voice with the trumpets and cymbals and instruments of musick, and praised the LORD, [saying], For [he is] good; for his mercy [endureth] for ever: that [then] the house was filled with a cloud, [even] the house of the LORD;";
rsv[13] = "and it was the duty of the trumpeters and singers to make themselves heard in unison in praise and thanksgiving to the LORD), and when the song was raised, with trumpets and cymbals and other musical instruments, in praise to the LORD, &quot;For he is good, for his steadfast love endures for ever,&quot; the house, the house of the LORD, was filled with a cloud,";
asv[13] = "it came to pass, when the trumpeters and singers were as one, to make one sound to be heard in praising and thanking Jehovah; and when they lifted up their voice with the trumpets and cymbals and instruments of music, and praised Jehovah, [saying], For he is good; for his lovingkindness [endureth] for ever; that then the house was filled with a cloud, even the house of Jehovah,";
yng[13] = "yea, it cometh to pass, as one [are] trumpeters and singers, to sound -- one voice -- to praise and to give thanks to Jehovah, and at the lifting up of the sound with trumpets, and with cymbals, and with instruments of song, and at giving praise to Jehovah, for good, for to the age [is] His kindness, that the house is filled with a cloud -- the house of Jehovah,";
dby[13] = "-- it came to pass when the trumpeters and singers were as one, to make one voice to be heard in praising and thanking Jehovah; and when they lifted up their voice with trumpets, and cymbals, and instruments of music, and praised Jehovah: For he is good, for his loving-kindness [endureth] for ever; that then the house, the house of Jehovah, was filled with a cloud,";
web[13] = "It came even to pass, as the trumpeters and singers [were] as one, to make one sound to be heard in praising and thanking the LORD; and when they lifted up [their] voice with the trumpets and cymbals and instruments of music, and praised the LORD, [saying], For [he is] good; for his mercy [endureth] for ever: that [then] the house was filled with a cloud, [even] the house of the LORD;";
hnv[13] = "it happened, when the trumpeters and singers were as one, to make one sound to be heard in praising and thanking the LORD; and when they lifted up their voice with the trumpets and cymbals and instruments of music, and praised the LORD, [saying], For he is good; for his lovingkindness endures forever; that then the house was filled with a cloud, even the house of the LORD,";
vul[13] = "igitur cunctis pariter et tubis et voce et cymbalis et organis et diversi generis musicorum concinentibus et vocem in sublime tollentibus longe sonitus audiebatur ita ut cum Dominum laudare coepissent et dicere confitemini Domino quoniam bonus quoniam in aeternum misericordia eius impleretur domus Domini nube";
kjv[14] = "So that the priests could not stand to minister by reason of the cloud: for the glory of the LORD had filled the house of God.";
rsv[14] = "so that the priests could not stand to minister because of the cloud; for the glory of the LORD filled the house of God.";

hnv[14] = "so that the Kohanim could not stand to minister by reason of the cloud: for the glory of the LORD filled the house of God.";
