csb[1] = "The Spirit of God came on Azariah son of Oded.";
csb[2] = "So he went out to meet Asa and said to him, &quot;Asa and all Judah and Benjamin, hear me. The LORD is with you when you are with him. If you seek him, he will be found by you, but if you abandon him, he will abandon you.";
csb[3] = "&quot;For many years Israel has been without the true God, without a teaching priest, and without instruction,";
csb[4] = "&quot;but when they turned to the LORD God of Israel in their distress and sought him, he was found by them.";
csb[5] = "&quot;In those times there was no peace for those who went about their daily activities because the residents of the lands had many conflicts.";
csb[6] = "&quot;Nation was crushed by nation and city by city, for God troubled them with every possible distress.";
csb[7] = "&quot;But as for you, be strong; don\'t give up, for your work has a reward.&quot;";
csb[8] = "When Asa heard these words and the prophecy of Azariah son of Oded the prophet, he took courage and removed the abhorrent idols from the whole land of Judah and Benjamin and from the cities he had captured in the hill country of Ephraim. He renovated the altar of the LORD that was in front of the portico of the LORD\'s temple.";
csb[9] = "Then he gathered all Judah and Benjamin, as well as those from the tribes of Ephraim, Manasseh, and Simeon who were residing among them, for they had defected to him from Israel in great numbers when they saw that the LORD his God was with him.";
csb[10] = "They were gathered in Jerusalem in the third month of the fifteenth year of Asa\'s reign.";
csb[11] = "At that time they sacrificed to the LORD seven hundred cattle and seven thousand sheep and goats from all the plunder they had brought.";
csb[12] = "Then they entered into a covenant to seek the LORD God of their ancestors with all their heart and all their soul.";
csb[13] = "Whoever would not seek the LORD God of Israel would be put to death, young or old, man or woman.";
csb[14] = "They took an oath to the LORD in a loud voice, with shouting, with trumpets, and with rams\' horns.";
csb[15] = "All Judah rejoiced over the oath, for they had sworn it with all their mind. They had sought him with all their heart, and he was found by them. So the LORD gave them rest on every side.";
csb[16] = "King Asa also removed Maacah, his grandmother, from being queen mother because she had made an obscene image of Asherah. Asa chopped down her obscene image, then crushed it and burned it in the Kidron Valley.";
csb[17] = "The high places were not taken away from Israel; nevertheless, Asa was wholeheartedly devoted his entire life.";
csb[18] = "He brought his father\'s consecrated gifts and his own consecrated gifts into God\'s temple: silver, gold, and utensils.";
csb[19] = "There was no war until the thirty-fifth year of Asa\'s reign.";
