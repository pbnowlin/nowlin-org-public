csb[1] = "In the eighteenth year of Israel\'s King Jeroboam, Abijah became king over Judah,";
csb[2] = "and he reigned three years in Jerusalem. His mother\'s name was Micaiah daughter of Uriel; she was from Gibeah. There was war between Abijah and Jeroboam.";
csb[3] = "Abijah set his army of warriors in order with four hundred thousand fit young men. Jeroboam arranged his mighty army of eight hundred thousand fit young men in battle formation against him.";
csb[4] = "Then Abijah stood on Mount Zemaraim, which is in the hill country of Ephraim, and said, &quot;Jeroboam and all Israel, hear me.";
csb[5] = "&quot;Don\'t you know that the LORD God of Israel gave the kingship over Israel to David and his descendants forever by a covenant of salt?";
csb[6] = "&quot;But Jeroboam son of Nebat, a servant of Solomon son of David, rose up and rebelled against his lord.";
csb[7] = "&quot;Then worthless and wicked men gathered around him to resist Rehoboam son of Solomon when Rehoboam was young, inexperienced, and unable to assert himself against them.";
csb[8] = "&quot;And now you are saying you can assert yourselves against the LORD\'s kingdom, which is in the hand of one of David\'s sons. You are a vast number and have with you the golden calves that Jeroboam made for you as gods.";
csb[9] = "&quot;Didn\'t you banish the priests of the LORD, the descendants of Aaron and the Levites, and make your own priests like the peoples of other lands do? Whoever comes to ordain himself with a young bull and seven rams may become a priest of what are not gods.";
csb[10] = "&quot;But as for us, the LORD is our God. We have not abandoned him; the priests ministering to the LORD are descendants of Aaron, and the Levites serve at their tasks.";
csb[11] = "&quot;They offer a burnt offering and fragrant incense to the LORD every morning and every evening, and they set the rows of the Bread of the Presence on the ceremonially clean table. They light the lamps of the gold lampstand every evening. We are carrying out the requirements of the LORD our God, while you have abandoned him.";
csb[12] = "&quot;Look, God and his priests are with us at our head. The trumpets are ready to sound the charge against you. Israelites, don\'t fight against the LORD God of your ancestors, for you will not succeed.&quot;";
csb[13] = "Now Jeroboam had sent an ambush around to advance from behind them. So they were in front of Judah, and the ambush was behind them.";
csb[14] = "Judah turned and discovered that the battle was in front of them and behind them, so they cried out to the LORD. Then the priests blew the trumpets,";
csb[15] = "and the men of Judah raised the battle cry. When the men of Judah raised the battle cry, God routed Jeroboam and all Israel before Abijah and Judah.";
csb[16] = "So the Israelites fled before Judah, and God handed them over to them.";
csb[17] = "Then Abijah and his people struck them with a mighty blow, and five hundred thousand fit young men of Israel were killed.";
csb[18] = "The Israelites were subdued at that time. The Judahites succeeded because they depended on the LORD, the God of their ancestors.";
csb[19] = "Abijah pursued Jeroboam and captured some cities from him: Bethel, Jeshanah, and Ephron, along with their surrounding villages.";
csb[20] = "Jeroboam no longer retained his power during Abijah\'s reign; ultimately, the LORD struck him and he died.";
csb[21] = "However, Abijah grew strong, acquired fourteen wives, and fathered twenty-two sons and sixteen daughters.";
csb[22] = "The rest of the events of Abijah\'s reign, along with his ways and his sayings, are written in the Writing of the Prophet Iddo.";
kjv[1] = "Now in the eighteenth year of king Jeroboam began Abijah to reign over Judah.";
rsv[1] = "In the eighteenth year of King Jerobo\'am Abi\'jah began to reign over Judah.";
asv[1] = "In the eighteenth year of king Jeroboam began Abijah to reign over Judah.";
yng[1] = "In the eighteenth year of king Jeroboam -- Abijah reigneth over Judah;";
dby[1] = "In the eighteenth year of king Jeroboam began Abijah to reign over Judah.";
web[1] = "Now in the eighteenth year of king Jeroboam began Abijah to reign over Judah.";
hnv[1] = "In the eighteenth year of king Yarov`am began Aviyah to reign over Yehudah.";
vul[1] = "anno octavodecimo regis Hieroboam regnavit Abia super Iudam";
kjv[2] = "He reigned three years in Jerusalem. His mother\'s name also [was] Michaiah the daughter of Uriel of Gibeah. And there was war between Abijah and Jeroboam.";
rsv[2] = "He reigned for three years in Jerusalem. His mother\'s name was Micai\'ah the daughter of U\'riel of Gib\'e-ah. Now there was war between Abi\'jah and Jerobo\'am.";
asv[2] = "Three years reigned he in Jerusalem: and his mother\'s name was Micaiah the daughter of Uriel of Gibeah. And there was war between Abijah and Jeroboam.";
yng[2] = "three years he hath reigned in Jerusalem, (and the name of his mother [is] Michaiah daughter of Uriel, from Gibeah,) and war hath been between Abijah and Jeroboam.";
dby[2] = "He reigned three years in Jerusalem; and his mother\'s name was Michaiah, the daughter of Uriel of Gibeah. And there was war between Abijah and Jeroboam.";
web[2] = "He reigned three years in Jerusalem. His mother\'s name also [was] Michaiah the daughter of Uriel of Gibeah. And there was war between Abijah and Jeroboam.";
hnv[2] = "Three years reigned he in Yerushalayim: and his mother\'s name was Mikhayahu the daughter of Uri\'el of Gevah. There was war between Aviyah and Yarov`am.";
vul[2] = "tribus annis regnavit in Hierusalem nomenque matris eius Michaia filia Urihel de Gabaa et erat bellum inter Abia et Hieroboam";
kjv[3] = "And Abijah set the battle in array with an army of valiant men of war, [even] four hundred thousand chosen men: Jeroboam also set the battle in array against him with eight hundred thousand chosen men, [being] mighty men of valour.";
rsv[3] = "Abi\'jah went out to battle having an army of valiant men of war, four hundred thousand picked men; and Jerobo\'am drew up his line of battle against him with eight hundred thousand picked mighty warriors.";
asv[3] = "And Abijah joined battle with an army of valiant men of war, even four hundred thousand chosen men: and Jeroboam set the battle in array against him with eight hundred thousand chosen men, who were mighty men of valor.";
yng[3] = "And Abijah directeth the war with a force of mighty men of war, four hundred thousand chosen men, and Jeroboam hath set in array with him battle, with eight hundred thousand chosen men, mighty of valour.";
dby[3] = "And Abijah began the war with an army of men of war, four hundred thousand chosen men; and Jeroboam set the battle in array against him with eight hundred thousand chosen men, mighty men of valour.";
web[3] = "And Abijah set the battle in array with an army of valiant men of war, [even] four hundred thousand chosen men: Jeroboam also set the battle in array against him with eight hundred thousand chosen men, [being] mighty men of valor.";
hnv[3] = "Aviyah joined battle with an army of valiant men of war, even four hundred thousand chosen men: and Yarov`am set the battle in array against him with eight hundred thousand chosen men, who were mighty men of valor.";
vul[3] = "cumque inisset Abia certamen et haberet bellicosissimos viros et electorum quadringenta milia Hieroboam instruxit e contra aciem octingenta milia virorum qui et ipsi electi erant et ad bella fortissimi";
kjv[4] = "And Abijah stood up upon mount Zemaraim, which [is] in mount Ephraim, and said, Hear me, thou Jeroboam, and all Israel;";
rsv[4] = "Then Abi\'jah stood up on Mount Zemara\'im which is in the hill country of E\'phraim, and said, &quot;Hear me, O Jerobo\'am and all Israel!";
asv[4] = "And Abijah stood up upon mount Zemaraim, which is in the hill-country of Ephraim, and said, Hear me, O Jeroboam and all Israel:";
yng[4] = "And Abijah riseth up on the hill of Zemaraim that [is] in the hill-country of Ephraim, and saith, `Hear me, Jeroboam and all Israel!";
dby[4] = "And Abijah stood up on the top of mount Zemaraim, which is in mount Ephraim, and said, Hear me, Jeroboam, and all Israel!";
web[4] = "And Abijah stood upon mount Zemaraim, which [is] in mount Ephraim, and said, Hear me, thou Jeroboam, and all Israel;";
hnv[4] = "Aviyah stood up on Mount Tzemaryim, which is in the hill-country of Efrayim, and said, Hear me, Yarov`am and all Yisra\'el:";
vul[4] = "stetit igitur Abia super montem Someron qui erat in Ephraim et ait audi Hieroboam et omnis Israhel";
kjv[5] = "Ought ye not to know that the LORD God of Israel gave the kingdom over Israel to David for ever, [even] to him and to his sons by a covenant of salt?";
rsv[5] = "Ought you not to know that the LORD God of Israel gave the kingship over Israel for ever to David and his sons by a covenant of salt?";
asv[5] = "Ought ye not to know that Jehovah, the God of Israel, gave the kingdom over Israel to David for ever, even to him and to his sons by a covenant of salt?";
yng[5] = "Is it not for you to know that Jehovah, God of Israel, hath given the kingdom to David over Israel to the age, to him and to his sons -- a covenant of salt?";
dby[5] = "Ought ye not to know that Jehovah the God of Israel gave the kingdom over Israel to David for ever, to him and to his sons [by] a covenant of salt?";
web[5] = "Ought ye not to know that the LORD God of Israel gave the kingdom over Israel to David for ever, [even] to him and to his sons by a covenant of salt?";
hnv[5] = "Ought you not to know that the LORD, the God of Yisra\'el, gave the kingdom over Yisra\'el to David forever, even to him and to his sons by a covenant of salt?";
vul[5] = "num ignoratis quod Dominus Deus Israhel dederit regnum David super Israhel in sempiternum ipsi et filiis eius pactum salis";
kjv[6] = "Yet Jeroboam the son of Nebat, the servant of Solomon the son of David, is risen up, and hath rebelled against his lord.";
rsv[6] = "Yet Jerobo\'am the son of Nebat, a servant of Solomon the son of David, rose up and rebelled against his lord;";
asv[6] = "Yet Jeroboam the son of Nebat, the servant of Solomon the son of David, rose up, and rebelled against his lord.";
yng[6] = "and rise up doth Jeroboam, son of Nebat, servant of Solomon son of David, and rebelleth against his lord!";
dby[6] = "But Jeroboam the son of Nebat, the servant of Solomon the son of David, rose up and rebelled against his lord.";
web[6] = "Yet Jeroboam the son of Nebat the servant of Solomon the son of David, hath risen up, and hath rebelled against his lord.";
hnv[6] = "Yet Yarov`am the son of Nevat, the servant of Shlomo the son of David, rose up, and rebelled against his lord.";
vul[6] = "et surrexit Hieroboam filius Nabath servus Salomonis filii David et rebellavit contra dominum suum";
kjv[7] = "And there are gathered unto him vain men, the children of Belial, and have strengthened themselves against Rehoboam the son of Solomon, when Rehoboam was young and tenderhearted, and could not withstand them.";
rsv[7] = "and certain worthless scoundrels gathered about him and defied Rehobo\'am the son of Solomon, when Rehobo\'am was young and irresolute and could not withstand them.";
asv[7] = "And there were gathered unto him worthless men, base fellows, that strengthened themselves against Rehoboam the son of Solomon, when Rehoboam was young and tender-hearted, and could not withstand them.";
yng[7] = "`And there are gathered unto him vain men, sons of worthlessness, and they strengthen themselves against Rehoboam son of Solomon, and Rehoboam was a youth, and tender of heart, and hath not strengthened himself against them.";
dby[7] = "And vain men, sons of Belial, gathered to him and strengthened themselves against Rehoboam the son of Solomon, and Rehoboam was young and faint-hearted, and did not shew himself strong against them.";
web[7] = "And there are gathered to him vain men, the children of Belial, and [they] have strengthened themselves against Rehoboam the son of Solomon, when Rehoboam was young and tender-hearted, and could not withstand them.";
hnv[7] = "There were gathered to him worthless men, base fellows, who strengthened themselves against Rechav`am the son of Shlomo, when Rechav`am was young and tender-hearted, and could not withstand them.";
vul[7] = "congregatique sunt ad eum viri vanissimi et filii Belial et praevaluerunt contra Roboam filium Salomonis porro Roboam erat rudis et corde pavido nec potuit resistere eis";
kjv[8] = "And now ye think to withstand the kingdom of the LORD in the hand of the sons of David; and ye [be] a great multitude, and [there are] with you golden calves, which Jeroboam made you for gods.";
rsv[8] = "&quot;And now you think to withstand the kingdom of the LORD in the hand of the sons of David, because you are a great multitude and have with you the golden calves which Jerobo\'am made you for gods.";
asv[8] = "And now ye think to withstand the kingdom of Jehovah in the hand of the sons of David; and ye are a great multitude, and there are with you the golden calves which Jeroboam made you for gods.";
yng[8] = "`And now, ye are saying to strengthen yourselves before the kingdom of Jehovah in the hand of the sons of David, and ye [are] a numerous multitude, and with you calves of gold that Jeroboam hath made to you for gods.";
dby[8] = "And now ye think to shew yourselves strong against the kingdom of Jehovah in the hand of the sons of David; and ye are a great multitude, and ye have with you the golden calves that Jeroboam made you for gods.";
web[8] = "And now ye think to withstand the kingdom of the LORD in the hand of the sons of David; and ye [are] a great multitude, and [there are] with you golden calves, which Jeroboam made you for gods.";
hnv[8] = "Now you think to withstand the kingdom of the LORD in the hand of the sons of David; and you are a great multitude, and there are with you the golden calves which Yarov`am made you for gods.";
vul[8] = "nunc ergo vos dicitis quod resistere possitis regno Domini quod possidet per filios David habetisque grandem populi multitudinem atque vitulos aureos quos fecit vobis Hieroboam in deos";
kjv[9] = "Have ye not cast out the priests of the LORD, the sons of Aaron, and the Levites, and have made you priests after the manner of the nations of [other] lands? so that whosoever cometh to consecrate himself with a young bullock and seven rams, [the same] may be a priest of [them that are] no gods.";
rsv[9] = "Have you not driven out the priests of the LORD, the sons of Aaron, and the Levites, and made priests for yourselves like the peoples of other lands? Whoever comes to consecrate himself with a young bull or seven rams becomes a priest of what are no gods.";
asv[9] = "Have ye not driven out the priests of Jehovah, the sons of Aaron, and the Levites, and made you priests after the manner of the peoples of [other] lands? so that whosoever cometh to consecrate himself with a young bullock and seven rams, the same may be a priest of [them that are] no gods.";
yng[9] = "`Have ye not cast out the priests of Jehovah, the sons of Aaron, and the Levites, and make to you priests like the peoples of the lands? every one who hath come to fill his hand with a bullock, a son of the herd, and seven rams, even he hath been a priest to No-gods!";
dby[9] = "Have ye not cast out the priests of Jehovah, the sons of Aaron, and the Levites, and made you priests as the peoples of the lands? whoever comes to consecrate himself with a young bullock and seven rams, he becomes a priest of what is not God.";
web[9] = "Have ye not cast out the priests of the LORD, the sons of Aaron, and the Levites, and have made for you priests after the manner of the nations of [other] lands? so that whoever cometh to consecrate himself with a young bullock and seven rams, [the same] may be a priest of [them that are] no gods.";
hnv[9] = "Haven\'t you driven out the Kohanim of the LORD, the sons of Aharon, and the Levites, and made you Kohanim after the manner of the peoples of [other] lands? so that whoever comes to consecrate himself with a young bull and seven rams, the same may be a Kohen of [those who are] no gods.";
vul[9] = "et eiecistis sacerdotes Domini filios Aaron atque Levitas et fecistis vobis sacerdotes sicut omnes populi terrarum quicumque venerit et initiaverit manum suam in tauro in bubus et in arietibus septem fit sacerdos eorum qui non sunt dii";
kjv[10] = "But as for us, the LORD [is] our God, and we have not forsaken him; and the priests, which minister unto the LORD, [are] the sons of Aaron, and the Levites [wait] upon [their] business:";
rsv[10] = "But as for us, the LORD is our God, and we have not forsaken him. We have priests ministering to the LORD who are sons of Aaron, and Levites for their service.";
asv[10] = "But as for us, Jehovah is our God, and we have not forsaken him; and [we have] priests ministering unto Jehovah, the sons of Aaron, and the Levites in their work:";
yng[10] = "`As for us, Jehovah [is] our God, and we have not forsaken Him, and priests are ministering to Jehovah, sons of Aaron and the Levites, in the work,";
dby[10] = "But as for us, Jehovah is our God, and we have not forsaken him; and the priests that serve Jehovah are the sons of Aaron, and the Levites are at their work:";
web[10] = "But as for us, the LORD [is] our God, and we have not forsaken him; and the priests, who minister to the LORD, [are] the sons of Aaron, and the Levites [wait] upon [their] business:";
hnv[10] = "But as for us, the LORD is our God, and we have not forsaken him; and [we have] Kohanim ministering to the LORD, the sons of Aharon, and the Levites in their work:";
vul[10] = "noster autem Dominus Deus est quem non relinquimus sacerdotesque ministrant Domino de filiis Aaron et Levitae sunt in ordine suo";
kjv[11] = "And they burn unto the LORD every morning and every evening burnt sacrifices and sweet incense: the shewbread also [set they in order] upon the pure table; and the candlestick of gold with the lamps thereof, to burn every evening: for we keep the charge of the LORD our God; but ye have forsaken him.";
rsv[11] = "They offer to the LORD every morning and every evening burnt offerings and incense of sweet spices, set out the showbread on the table of pure gold, and care for the golden lampstand that its lamps may burn every evening; for we keep the charge of the LORD our God, but you have forsaken him.";
asv[11] = "and they burn unto Jehovah every morning and every evening burnt-offerings and sweet incense: the showbread also [set they] in order upon the pure table; and the candlestick of gold with the lamps thereof, to burn every evening: for we keep the charge of Jehovah our God; but ye have forsaken him.";
yng[11] = "and are making perfume to Jehovah, burnt-offerings morning by morning, and evening by evening, and perfume of spices, and the arrangement of bread [is] on the pure table, and the candlestick of gold, and its lamps, to burn evening by evening, for we are keeping the charge of Jehovah our God, and ye -- ye have forsaken Him.";
dby[11] = "and they burn to Jehovah every morning and every evening burnt-offerings and sweet incense; the loaves also are set in order upon the pure table; and the candlestick of gold with its lamps to burn every evening: for *we* keep the charge of Jehovah our God; but *ye* have forsaken him.";
web[11] = "And they burn to the LORD every morning and every evening burnt-sacrifices and sweet incense: the show-bread also [they set in order] upon the pure table; and the candlestick of gold with its lamps to burn every evening: for we keep the charge of the LORD our God; but ye have forsaken him.";
hnv[11] = "and they burn to the LORD every morning and every evening burnt offerings and sweet incense: the show bread also [set they] in order on the pure table; and the menorah of gold with the lamps of it, to burn every evening: for we keep the charge of the LORD our God; but you have forsaken him.";
vul[11] = "holocausta quoque offerunt Domino per singulos dies mane et vespere et thymiama iuxta legis praecepta confectum et proponuntur panes in mensa mundissima estque apud nos candelabrum aureum et lucernae eius ut accendantur semper ad vesperam nos quippe custodimus praecepta Domini Dei nostri quem vos reliquistis";
kjv[12] = "And, behold, God himself [is] with us for [our] captain, and his priests with sounding trumpets to cry alarm against you. O children of Israel, fight ye not against the LORD God of your fathers; for ye shall not prosper.";
rsv[12] = "Behold, God is with us at our head, and his priests with their battle trumpets to sound the call to battle against you. O sons of Israel, do not fight against the LORD, the God of your fathers; for you cannot succeed.&quot;";
asv[12] = "And, behold, God is with us at our head, and his priests with the trumpets of alarm to sound an alarm against you. O children of Israel, fight ye not against Jehovah, the God of your fathers; for ye shall not prosper.";
yng[12] = "`And lo, with us -- at [our] head -- [is] God, and His priests and trumpets of shouting to shout against you; O sons of Israel, do not fight with Jehovah, God of your fathers, for ye do not prosper.\'";
dby[12] = "And behold, we have God with us at our head, and his priests, and the loud-sounding trumpets to sound an alarm against you. Children of Israel, do not fight with Jehovah the God of your fathers; for ye shall not prosper.";
web[12] = "And behold, God himself [is] with us for [our] captain, and his priests with sounding trumpets to cry alarm against you. O children of Israel, fight ye not against the LORD God of your fathers; for ye will not prosper.";
hnv[12] = "Behold, God is with us at our head, and his Kohanim with the trumpets of alarm to sound an alarm against you. Children of Yisra\'el, don\'t you fight against the LORD, the God of your fathers; for you shall not prosper.";
vul[12] = "ergo in exercitu nostro dux Deus est et sacerdotes eius qui clangunt tubis et resonant contra vos filii Israhel nolite pugnare contra Dominum Deum patrum vestrorum quia non vobis expedit";

rsv[13] = "Jerobo\'am had sent an ambush around to come on them from behind; thus his troops were in front of Judah, and the ambush was behind them.";
asv[13] = "But Jeroboam caused an ambushment to come about behind them: so they were before Judah, and the ambushment was behind them.";
yng[13] = "And Jeroboam hath brought round the ambush to come in from behind them, and they are before Judah, and the ambush [is] behind them.";
dby[13] = "But Jeroboam caused an ambush to come about behind them; and they were before Judah, and the ambush behind them.";
web[13] = "But Jeroboam caused an ambush to come about behind them: so they were before Judah, and the ambush [was] behind them.";
hnv[13] = "But Yarov`am caused an ambush to come about behind them: so they were before Yehudah, and the ambush was behind them.";
vul[13] = "haec illo loquente Hieroboam retro moliebatur insidias cumque ex adverso hostium staret ignorantem Iudam suo ambiebat exercitu";
kjv[14] = "And when Judah looked back, behold, the battle [was] before and behind: and they cried unto the LORD, and the priests sounded with the trumpets.";
rsv[14] = "And when Judah looked, behold, the battle was before and behind them; and they cried to the LORD, and the priests blew the trumpets.";
asv[14] = "And when Judah looked back, behold, the battle was before and behind them; and they cried unto Jehovah, and the priests sounded with the trumpets.";
yng[14] = "And Judah turneth, and lo, against them [is] the battle, before and behind, and they cry to Jehovah, and the priests are blowing with trumpets,";
dby[14] = "And Judah looked back, and behold, they had the battle in front and behind; and they cried to Jehovah, and the priests sounded with the trumpets.";
web[14] = "And when Judah looked back, behold, the battle [was] before and behind: and they cried to the LORD, and the priests sounded with the trumpets.";
hnv[14] = "When Yehudah looked back, behold, the battle was before and behind them; and they cried to the LORD, and the Kohanim sounded with the trumpets.";

rsv[15] = "Then the men of Judah raised the battle shout. And when the men of Judah shouted, God defeated Jerobo\'am and all Israel before Abi\'jah and Judah.";
asv[15] = "Then the men of Judah gave a shout: and as the men of Judah shouted, it came to pass, that God smote Jeroboam and all Israel before Abijah and Judah.";
yng[15] = "and the men of Judah shout -- and it cometh to pass, at the shouting of the men of Judah, that God hath smitten Jeroboam, and all Israel, before Abijah and Judah.";
dby[15] = "And the men of Judah gave a shout; and as the men of Judah shouted, it came to pass that God smote Jeroboam and all Israel before Abijah and Judah.";
web[15] = "Then the men of Judah gave a shout: and as the men of Judah shouted, it came to pass, that God smote Jeroboam and all Israel before Abijah and Judah.";
hnv[15] = " Then the men of Yehudah gave a shout: and as the men of Yehudah shouted, it happened, that God struck Yarov`am and all Yisra\'el before Aviyah and Yehudah.";
vul[15] = "omnesque viri Iuda vociferati sunt et ecce illis clamantibus perterruit Deus Hieroboam et omnem Israhel qui stabat ex adverso Abia et Iuda";
kjv[16] = "And the children of Israel fled before Judah: and God delivered them into their hand.";
rsv[16] = "The men of Israel fled before Judah, and God gave them into their hand.";
asv[16] = "And the children of Israel fled before Judah; and God delivered them into their hand.";
yng[16] = "And the sons of Israel flee from the face of Judah, and God giveth them into their hand,";
dby[16] = "And the children of Israel fled before Judah; and God delivered them into their hand.";
web[16] = "And the children of Israel fled before Judah: and God delivered them into their hand.";
hnv[16] = "The children of Yisra\'el fled before Yehudah; and God delivered them into their hand.";
vul[16] = "fugeruntque filii Israhel Iudam et tradidit eos Deus in manu eorum";
kjv[17] = "And Abijah and his people slew them with a great slaughter: so there fell down slain of Israel five hundred thousand chosen men.";
rsv[17] = "Abi\'jah and his people slew them with a great slaughter; so there fell slain of Israel five hundred thousand picked men.";
asv[17] = "And Abijah and his people slew them with a great slaughter: so there fell down slain of Israel five hundred thousand chosen men.";
yng[17] = "and Abijah and his people smite among them a great smiting, and there fall wounded of Israel five hundred thousand chosen men.";
dby[17] = "And Abijah and his people slew them with a great slaughter; and there fell down slain of Israel five hundred thousand chosen men.";
web[17] = "And Abijah and his people slew them with a great slaughter: so there fell down slain of Israel five hundred thousand chosen men.";
hnv[17] = "Aviyah and his people killed them with a great slaughter: so there fell down slain of Yisra\'el five hundred thousand chosen men.";
vul[17] = "percussit ergo eos Abia et populus eius plaga magna et corruerunt vulnerati ex Israhel quingenta milia virorum fortium";
kjv[18] = "Thus the children of Israel were brought under at that time, and the children of Judah prevailed, because they relied upon the LORD God of their fathers.";
rsv[18] = "Thus the men of Israel were subdued at that time, and the men of Judah prevailed, because they relied upon the LORD, the God of their fathers.";
asv[18] = "Thus the children of Israel were brought under at that time, and the children of Judah prevailed, because they relied upon Jehovah, the God of their fathers.";
yng[18] = "And the sons of Israel are humbled at that time, and the sons of Judah are strong, for they have leant on Jehovah, God of their fathers.";
dby[18] = "And the children of Israel were humbled at that time, and the children of Judah were strengthened, because they relied upon Jehovah the God of their fathers.";
web[18] = "Thus the children of Israel were brought under at that time, and the children of Judah prevailed, because they relied upon the LORD God of their fathers.";

vul[18] = "humiliatique sunt filii Israhel in tempore illo et vehementissime confortati filii Iuda eo quod sperassent in Domino Deo patrum suorum";

rsv[19] = "And Abi\'jah pursued Jerobo\'am, and took cities from him, Bethel with its villages and Jesha\'nah with its villages and Ephron with its villages.";
asv[19] = "And Abijah pursued after Jeroboam, and took cities from him, Beth-el with the towns thereof, and Jeshanah with the towns thereof, and Ephron with the towns thereof.";

dby[19] = "And Abijah pursued after Jeroboam, and took cities from him: Bethel with its dependent villages, and Jeshanah with its dependent villages, and Ephron with its dependent villages.";
web[19] = "And Abijah pursued Jeroboam, and took cities from him, Beth-el with its towns, and Jeshanah with its towns, and Ephron with its towns.";

rsv[20] = "Jerobo\'am did not recover his power in the days of Abi\'jah; and the LORD smote him, and he died.";
asv[20] = "Neither did Jeroboam recover strength again in the days of Abijah: and Jehovah smote him, and he died.";
yng[20] = "And Jeroboam hath not retained power any more in the days of Abijah, and Jehovah smiteth him, and he dieth.";
dby[20] = "And Jeroboam did not recover strength again in the days of Abijah; and Jehovah smote him, and he died.";
web[20] = "Neither did Jeroboam recover strength again in the days of Abijah: and the LORD struck him, and he died.";
hnv[20] = "Neither did Yarov`am recover strength again in the days of Aviyah: and the LORD struck him, and he died.";
vul[20] = "nec valuit ultra resistere Hieroboam in diebus Abia quem percussit Dominus et mortuus est";

yng[21] = "And Abijah strengtheneth himself, and taketh to him fourteen wives, and begetteth twenty and two sons, and sixteen daughters,";

web[21] = "But Abijah became mighty, and married fourteen wives, and begat twenty and two sons, and sixteen daughters.";
hnv[21] = "But Aviyah grew mighty, and took to himself fourteen wives, and became the father of twenty-two sons, and sixteen daughters.";
