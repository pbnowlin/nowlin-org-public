csb[1] = "Manasseh was twelve years old when he became king, and he reigned fifty-five years in Jerusalem.";
csb[2] = "He did what was evil in the LORD\'s sight, imitating the detestable practices of the nations that the LORD had dispossessed before the Israelites.";
csb[3] = "He rebuilt the high places that his father Hezekiah had torn down and reestablished the altars for the Baals. He made Asherah poles, and he bowed in worship to all the stars in the sky and served them.";
csb[4] = "He built altars in the LORD\'s temple, where the LORD had said, &quot;Jerusalem is where my name will remain forever.&quot;";
csb[5] = "He built altars to all the stars in the sky in both courtyards of the LORD\'s temple.";
csb[6] = "He passed his sons through the fire in Ben Hinnom Valley. He practiced witchcraft, divination, and sorcery, and consulted mediums and spiritists. He did a huge amount of evil in the LORD\'s sight, angering him.";
csb[7] = "Manasseh set up a carved image of the idol, which he had made, in God\'s temple that God had spoken about to David and his son Solomon: &quot;I will establish my name forever in this temple and in Jerusalem, which I have chosen out of all the tribes of Israel.";
csb[8] = "&quot;I will never again remove the feet of the Israelites from the land where I stationed your ancestors, if only they will be careful to do all I have commanded them through Moses -- all the law, statutes, and judgments.&quot;";
csb[9] = "So Manasseh caused Judah and the inhabitants of Jerusalem to stray so that they did worse evil than the nations the LORD had destroyed before the Israelites.";
csb[10] = "The LORD spoke to Manasseh and his people, but they didn\'t listen.";
csb[11] = "So he brought against them the military commanders of the king of Assyria. They captured Manasseh with hooks, bound him with bronze shackles, and took him to Babylon.";
csb[12] = "When he was in distress, he sought the favor of the LORD his God and earnestly humbled himself before the God of his ancestors.";
csb[13] = "He prayed to him, and the LORD was receptive to his prayer. He granted his request and brought him back to Jerusalem, to his kingdom. So Manasseh came to know that the LORD is God.";
csb[14] = "After this, he built the outer wall of the city of David from west of Gihon in the valley to the entrance of the Fish Gate; he brought it around the Ophel, and he heightened it considerably. He also placed military commanders in all the fortified cities of Judah.";
csb[15] = "He removed the foreign gods and the idol from the LORD\'s temple, along with all the altars that he had built on the mountain of the LORD\'s temple and in Jerusalem, and he threw them outside the city.";
csb[16] = "He built the altar of the LORD and offered fellowship and thank offerings on it. Then he told Judah to serve the LORD, the God of Israel.";
csb[17] = "However, the people still sacrificed at the high places, but only to the LORD their God.";
csb[18] = "The rest of the events of Manasseh\'s reign, along with his prayer to his God and the words of the seers who spoke to him in the name of the LORD, the God of Israel, are written in the Events of Israel\'s Kings.";
csb[19] = "His prayer and how God was receptive to his prayer, and all his sin and unfaithfulness and the sites where he built high places and set up Asherah poles and carved images before he humbled himself, they are written in the Events of Hozai.";
csb[20] = "Manasseh rested with his fathers, and he was buried in his own house. His son Amon became king in his place.";
csb[21] = "Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.";
csb[22] = "He did what was evil in the LORD\'s sight, just as his father Manasseh had done. Amon sacrificed to all the carved images that his father Manasseh had made, and he served them.";
csb[23] = "But he did not humble himself before the LORD like his father Manasseh humbled himself; instead, Amon increased his guilt.";
csb[24] = "So his servants conspired against him and put him to death in his own house.";
csb[25] = "The common people killed all who had conspired against King Amon, and they made his son Josiah king in his place.";

kjv[6] = "And he caused his children to pass through the fire in the valley of the son of Hinnom: also he observed times, and used enchantments, and used witchcraft, and dealt with a familiar spirit, and with wizards: he wrought much evil in the sight of the LORD, to provoke him to anger.";
rsv[6] = "And he burned his sons as an offering in the valley of the son of Hinnom, and practiced soothsaying and augury and sorcery, and dealt with mediums and with wizards. He did much evil in the sight of the LORD, provoking him to anger.";
asv[6] = "He also made his children to pass through the fire in the valley of the son of Hinnom; and he practised augury, and used enchantments, and practised sorcery, and dealt with them that had familiar spirits, and with wizards: he wrought much evil in the sight of Jehovah, to provoke him to anger.";
yng[6] = "And he hath caused his sons to pass over through fire in the valley of the son of Hinnom, and observed clouds and used enchantments and witchcraft, and dealt with a familiar spirit, and a wizard; he hath multiplied to do the evil thing in the eyes of Jehovah, to provoke him to anger.";
dby[6] = "He also caused his children to pass through the fire in the valley of the son of Hinnom; and he used magic and divination and sorcery, and appointed necromancers and soothsayers: he wrought evil beyond measure in the sight of Jehovah, to provoke him to anger.";

hnv[17] = "Nevertheless the people sacrificed still in the high places, but only to the LORD their God.";
vul[17] = "attamen adhuc populus immolabat in excelsis Domino Deo suo";
kjv[18] = "Now the rest of the acts of Manasseh, and his prayer unto his God, and the words of the seers that spake to him in the name of the LORD God of Israel, behold, they [are written] in the book of the kings of Israel.";
rsv[18] = "Now the rest of the acts of Manas\'seh, and his prayer to his God, and the words of the seers who spoke to him in the name of the LORD the God of Israel, behold, they are in the Chronicles of the Kings of Israel.";
asv[18] = "Now the rest of the acts of Manasseh, and his prayer unto his God, and the words of the seers that spake to him in the name of Jehovah, the God of Israel, behold, they are written among the acts of the kings of Israel.";
yng[18] = "And the rest of the matters of Manasseh, and his prayer unto his God, and the matters of the seers, those speaking unto him in the name of Jehovah, God of Israel, lo, they are [on the book of] the matters of the kings of Israel;";
dby[18] = "And the rest of the acts of Manasseh, and his prayer to his God, and the words of the seers that spoke to him in the name of Jehovah the God of Israel, behold, they [are written] in the acts of the kings of Israel.";
web[18] = "Now the rest of the acts of Manasseh, and his prayer to his God, and the words of the seers that spoke to him in the name of the LORD God of Israel, behold, they [are written] in the book of the kings of Israel.";
hnv[18] = "Now the rest of the acts of Menashsheh, and his prayer to his God, and the words of the seers who spoke to him in the name of the LORD, the God of Yisra\'el, behold, they are written among the acts of the kings of Yisra\'el.";
vul[18] = "reliqua autem gestorum Manasse et obsecratio eius ad Deum suum verba quoque videntium qui loquebantur ad eum in nomine Domini Dei Israhel continentur in sermonibus regum Israhel";
kjv[19] = "His prayer also, and [how God] was intreated of him, and all his sin, and his trespass, and the places wherein he built high places, and set up groves and graven images, before he was humbled: behold, they [are] written among the sayings of the seers.";
rsv[19] = "And his prayer, and how God received his entreaty, and all his sin and his faithlessness, and the sites on which he built high places and set up the Ashe\'rim and the images, before he humbled himself, behold, they are written in the Chronicles of the Seers.";
asv[19] = "His prayer also, and how [God] was entreated of him, and all his sin and his trespass, and the places wherein he built high places, and set up the Asherim and the graven images, before he humbled himself, behold, they are written in the history of Hozai.";
yng[19] = "and his prayer, and his entreaty, and all his sin, and his trespass, and the places in which he had built high places, and established the shrines and the graven images before his being humbled, lo, they are written beside the matters of Hozai.";
dby[19] = "And his prayer, and [how God] was intreated of him, and all his sin and his unfaithfulness, and the places in which he built high places, and set up Asherahs and graven images, before he was humbled, behold, they are written among the words of Hozai.";
web[19] = "His prayer also, and [how God] was entreated by him, and all his sin, and his trespass, and the places in which he built high places, and set up groves and graven images, before he was humbled: behold, they [are] written among the sayings of the seers.";
hnv[19] = "His prayer also, and how [God] was entreated of him, and all his sin and his trespass, and the places in which he built high places, and set up the Asherim and the engraved images, before he humbled himself: behold, they are written in the history of Hozai.";
vul[19] = "oratio quoque eius et exauditio et cuncta peccata atque contemptus loca etiam in quibus aedificavit excelsa et fecit lucos et statuas antequam ageret paenitentiam scripta sunt in sermonibus Ozai";
kjv[20] = "So Manasseh slept with his fathers, and they buried him in his own house: and Amon his son reigned in his stead.";
rsv[20] = "So Manas\'seh slept with his fathers, and they buried him in his house; and Amon his son reigned in his stead.";
asv[20] = "So Manasseh slept with his fathers, and they buried him in his own house: and Amon his son reigned in his stead.";
yng[20] = "And Manasseh lieth with his fathers, and they bury him in his own house, and reign doth Amon his son in his stead.";
dby[20] = "And Manasseh slept with his fathers, and they buried him in his own house; and Amon his son reigned in his stead.";
web[20] = "So Manasseh slept with his fathers, and they buried him in his own house: and Amon his son reigned in his stead.";
hnv[20] = "So Menashsheh slept with his fathers, and they buried him in his own house: and Amon his son reigned in his place.";
vul[20] = "dormivit ergo Manasses cum patribus suis et sepelierunt eum in domo sua regnavitque pro eo filius eius Amon";
kjv[21] = "Amon [was] two and twenty years old when he began to reign, and reigned two years in Jerusalem.";
rsv[21] = "Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem.";
asv[21] = "Amon was twenty and two years old when he began to reign; and he reigned two years in Jerusalem.";
yng[21] = "A son of twenty and two years [is] Amon in his reigning, and two years he hath reigned in Jerusalem,";
dby[21] = "Amon was twenty-two years old when he began to reign; and he reigned two years in Jerusalem.";
web[21] = "Amon [was] two and twenty years old when he began to reign, and reigned two years in Jerusalem.";
hnv[21] = "Amon was twenty-two years old when he began to reign; and he reigned two years in Yerushalayim.";
vul[21] = "viginti duo annorum erat Amon cum regnare coepisset et duobus annis regnavit in Hierusalem";
kjv[22] = "But he did [that which was] evil in the sight of the LORD, as did Manasseh his father: for Amon sacrificed unto all the carved images which Manasseh his father had made, and served them;";
rsv[22] = "He did what was evil in the sight of the LORD, as Manas\'seh his father had done. Amon sacrificed to all the images that Manas\'seh his father had made, and served them.";
asv[22] = "And he did that which was evil in the sight of Jehovah, as did Manasseh his father; and Amon sacrificed unto all the graven images which Manasseh his father had made, and served them.";
yng[22] = "and he doth the evil thing in the eyes of Jehovah, as did Manasseh his father, and to all the graven images that Manasseh his father had made hath Amon sacrificed, and serveth them,";
dby[22] = "And he did evil in the sight of Jehovah, as Manasseh his father had done; and Amon sacrificed to all the graven images that Manasseh his father had made, and served them.";
web[22] = "But he did [that which was] evil in the sight of the LORD, as did Manasseh his father: for Amon sacrificed to all the carved images which Manasseh his father had made, and served them;";
hnv[22] = "He did that which was evil in the sight of the LORD, as did Menashsheh his father; and Amon sacrificed to all the engraved images which Menashsheh his father had made, and served them.";
vul[22] = "fecitque malum in conspectu Domini sicut fecerat Manasses pater eius et cunctis idolis quae Manasses fuerat fabricatus immolavit atque servivit";
kjv[23] = "And humbled not himself before the LORD, as Manasseh his father had humbled himself; but Amon trespassed more and more.";
rsv[23] = "And he did not humble himself before the LORD, as Manas\'seh his father had humbled himself, but this Amon incurred guilt more and more.";
asv[23] = "And he humbled not himself before Jehovah, as Manasseh his father had humbled himself; but this same Amon trespassed more and more.";
yng[23] = "and hath not been humbled before Jehovah, like the humbling of Manasseh his father, for Amon himself hath multiplied guilt.";
dby[23] = "And he did not humble himself before Jehovah, as Manasseh his father had humbled himself; for he, Amon, multiplied trespass.";
web[23] = "And humbled not himself before the LORD, as Manasseh his father had humbled himself; but Amon trespassed more and more.";
hnv[23] = "He didn\'t humble himself before the LORD, as Menashsheh his father had humbled himself; but this same Amon trespassed more and more.";
vul[23] = "et non est reveritus faciem Domini sicut reveritus est Manasses pater eius et multo maiora deliquit";

rsv[24] = "And his servants conspired against him and killed him in his house.";
asv[24] = "And his servants conspired against him, and put him to death in his own house.";
yng[24] = "And his servants conspire against him, and put him to death in his own house,";
dby[24] = "And his servants conspired against him, and slew him in his own house.";
web[24] = "And his servants conspired against him, and slew him in his own house.";
hnv[24] = "His servants conspired against him, and put him to death in his own house.";
vul[24] = "cumque coniurassent adversus eum servi sui interfecerunt eum in domo sua";

rsv[25] = "But the people of the land slew all those who had conspired against King Amon; and the people of the land made Josi\'ah his son king in his stead.";
asv[25] = "But the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.";
yng[25] = "and the people of the land smite all those conspiring against king Amon, and the people of the land cause Josiah his son to reign in his stead.";
dby[25] = "But the people of the land smote all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.";
web[25] = "But the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.";
hnv[25] = "But the people of the land killed all those who had conspired against king Amon; and the people of the land made Yoshiyahu his son king in his place.";
