csb[1] = "Then the common people took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father.";
csb[2] = "Jehoahaz was twenty-three years old when he became king, and he reigned three months in Jerusalem.";
csb[3] = "The king of Egypt deposed him in Jerusalem and fined the land seventy-five hundred pounds of silver and seventy-five pounds of gold.";
csb[4] = "Then King Neco of Egypt made Jehoahaz\'s brother Eliakim king over Judah and Jerusalem and changed Eliakim\'s name to Jehoiakim. But Neco took his brother Jehoahaz and brought him to Egypt.";
csb[5] = "Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the sight of the LORD his God.";
csb[6] = "Now King Nebuchadnezzar of Babylon attacked him and bound him in bronze shackles to take him to Babylon.";
csb[7] = "Also Nebuchadnezzar took some of the articles of the LORD\'s temple to Babylon and put them in his temple in Babylon.";
csb[8] = "The rest of the deeds of Jehoiakim, the detestable actions he committed, and what was found against him, are written in the Book of Israel\'s Kings. His son Jehoiachin became king in his place.";
csb[9] = "Jehoiachin was eighteen years old when he became king, and he reigned three months and ten days in Jerusalem. He did what was evil in the LORD\'s sight.";
csb[10] = "In the spring Nebuchadnezzar sent for him and brought him to Babylon along with the valuable articles of the LORD\'s temple. Then he made Jehoiachin\'s brother Zedekiah king over Judah and Jerusalem.";
csb[11] = "Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.";
csb[12] = "He did what was evil in the sight of the LORD his God and did not humble himself before the prophet Jeremiah at the LORD\'s command.";
csb[13] = "He also rebelled against King Nebuchadnezzar who had made him swear allegiance by God. He became obstinate and hardened his heart against returning to the LORD, the God of Israel.";
csb[14] = "All the leaders of the priests and the people multiplied their unfaithful deeds, imitating all the detestable practices of the nations, and they defiled the LORD\'s temple that he had consecrated in Jerusalem.";
csb[15] = "But the LORD, the God of their ancestors sent word against them by the hand of his messengers, sending them time and time again, for he had compassion on his people and on his dwelling place.";
csb[16] = "But they kept ridiculing God\'s messengers, despising his words, and scoffing at his prophets, until the LORD\'s wrath was so stirred up against his people that there was no remedy.";
csb[17] = "So he brought up against them the king of the Chaldeans, who killed their fit young men with the sword in the house of their sanctuary. He had no pity on young men or young women, elderly or aged; he handed them all over to him.";
csb[18] = "He took everything to Babylon -- all the articles of God\'s temple, large and small, the treasures of the LORD\'s temple, and the treasures of the king and his officials.";
csb[19] = "Then the Chaldeans burned God\'s temple. They tore down Jerusalem\'s wall, burned all its palaces, and destroyed all its valuable articles.";
csb[20] = "He deported those who escaped from the sword to Babylon, and they became servants to him and his sons until the rise of the Persian kingdom.";
csb[21] = "This fulfilled the word of the LORD through Jeremiah, and the land enjoyed its Sabbath rest all the days of the desolation until seventy years were fulfilled.";
csb[22] = "In the first year of King Cyrus of Persia, in order to fulfill the word of the LORD spoken through Jeremiah, the LORD roused the spirit of King Cyrus of Persia to issue a proclamation throughout his entire kingdom and also to put it in writing:";
csb[23] = "This is what King Cyrus of Persia says: The LORD, the God of the heavens, has given me all the kingdoms of the earth and has appointed me to build him a temple at Jerusalem in Judah. Any of his people among you may go up, and may the LORD his God be with him.";
kjv[1] = "Then the people of the land took Jehoahaz the son of Josiah, and made him king in his father\'s stead in Jerusalem.";

dby[1] = "And the people of the land took Jehoahaz the son of Josiah, and made him king in his father\'s stead, in Jerusalem.";

hnv[1] = "Then the people of the land took Yeho\'achaz the son of Yoshiyahu, and made him king in his father\'s place in Yerushalayim.";

dby[2] = "Jehoahaz was twenty-three years old when he began to reign; and he reigned three months in Jerusalem.";
web[2] = "Jehoahaz [was] twenty and three years old when he began to reign, and he reigned three months in Jerusalem.";

vul[2] = "viginti trium annorum erat Ioachaz cum regnare coepisset et tribus mensibus regnavit in Hierusalem";
kjv[3] = "And the king of Egypt put him down at Jerusalem, and condemned the land in an hundred talents of silver and a talent of gold.";
rsv[3] = "Then the king of Egypt deposed him in Jerusalem and laid upon the land a tribute of a hundred talents of silver and a talent of gold.";
asv[3] = "And the king of Egypt deposed him at Jerusalem, and fined the land a hundred talents of silver and a talent of gold.";
yng[3] = "and turn him aside doth the king of Egypt in Jerusalem, and fineth the land a hundred talents of silver, and a talent of gold;";
dby[3] = "And the king of Egypt put him down at Jerusalem, and imposed a fine upon the land of a hundred talents of silver and a talent of gold.";
web[3] = "And the king of Egypt deposed him at Jerusalem, and condemned the land in a hundred talents of silver, and a talent of gold.";
hnv[3] = "The king of Mitzrayim deposed him at Yerushalayim, and fined the land one hundred talents of silver and a talent of gold.";
vul[3] = "amovit autem eum rex Aegypti cum venisset Hierusalem et condemnavit terram centum talentis argenti et talento auri";
kjv[4] = "And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and turned his name to Jehoiakim. And Necho took Jehoahaz his brother, and carried him to Egypt.";
rsv[4] = "And the king of Egypt made Eli\'akim his brother king over Judah and Jerusalem, and changed his name to Jehoi\'akim; but Neco took Jeho\'ahaz his brother and carried him to Egypt.";
asv[4] = "And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and changed his name to Jehoiakim. And Neco took Joahaz his brother, and carried him to Egypt.";
yng[4] = "and the king of Egypt causeth Eliakim his brother to reign over Judah and Jerusalem, and turneth his name to Jehoiakim; and Jehoahaz his brother hath Necho taken, and bringeth him in to Egypt.";
dby[4] = "And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and changed his name to Jehoiakim. And Necho took Jehoahaz his brother, and carried him to Egypt.";
web[4] = "And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and changed his name to Jehoiakim. And Necho took Jehoahaz his brother, and carried him to Egypt.";
hnv[4] = "The king of Mitzrayim made Elyakim his brother king over Yehudah and Yerushalayim, and changed his name to Yehoiakim. Nekho took Yo\'achaz his brother, and carried him to Mitzrayim.";
vul[4] = "constituitque regem pro eo Eliacim fratrem eius super Iudam et Hierusalem et vertit nomen eius Ioacim ipsum vero Ioachaz tulit secum et adduxit in Aegyptum";

asv[6] = "Against him came up Nebuchadnezzar king of Babylon, and bound him in fetters, to carry him to Babylon.";
yng[6] = "against him hath Nebuchadnezzar king of Babylon come up, and bindeth him in brazen fetters to take him away to Babylon.";

web[6] = "Against him came up Nebuchadnezzar king of Babylon, and bound him in fetters, to carry him to Babylon.";

asv[7] = "Nebuchadnezzar also carried of the vessels of the house of Jehovah to Babylon, and put them in his temple at Babylon.";
yng[7] = "And of the vessels of the house of Jehovah hath Nebuchadnezzar brought in to Babylon, and putteth them in his temple in Babylon.";

kjv[8] = "Now the rest of the acts of Jehoiakim, and his abominations which he did, and that which was found in him, behold, they [are] written in the book of the kings of Israel and Judah: and Jehoiachin his son reigned in his stead.";
rsv[8] = "Now the rest of the acts of Jehoi\'akim, and the abominations which he did, and what was found against him, behold, they are written in the Book of the Kings of Israel and Judah; and Jehoi\'achin his son reigned in his stead.";
asv[8] = "Now the rest of the acts of Jehoiakim, and his abominations which he did, and that which was found in him, behold, they are written in the book of the kings of Israel and Judah: and Jehoiachin his son reigned in his stead.";
yng[8] = "And the rest of the matters of Jehoiakim, and his abominations that he hath done, and that which is found against him, lo, they are written on the book of the kings of Israel and Judah, and reign doth Jehoiachin his son in his stead.";
dby[8] = "And the rest of the acts of Jehoiakim, and his abominations which he did, and that which was found in him, behold, they are written in the book of the kings of Israel and Judah. And Jehoiachin his son reigned in his stead.";
web[8] = "Now the rest of the acts of Jehoiakim, and his abominations which he did, and that which was found in him, behold, they [are] written in the book of the kings of Israel and Judah. And Jehoiachin his son reigned in his stead.";
hnv[8] = "Now the rest of the acts of Yehoiakim, and his abominations which he did, and that which was found in him, behold, they are written in the book of the kings of Yisra\'el and Yehudah: and Yehoiakim his son reigned in his place.";
vul[8] = "reliqua autem verborum Ioacim et abominationum eius quas operatus est et quae inventa sunt in eo continentur in libro regum Israhel et Iuda regnavitque Ioachin filius eius pro eo";

dby[9] = "Jehoiachin was eighteen years old when he began to reign; and he reigned three months and ten days in Jerusalem; and he did evil in the sight of Jehovah.";

vul[9] = "octo annorum erat Ioachin cum regnare coepisset et tribus mensibus ac decem diebus regnavit in Hierusalem fecitque malum in conspectu Domini";
kjv[10] = "And when the year was expired, king Nebuchadnezzar sent, and brought him to Babylon, with the goodly vessels of the house of the LORD, and made Zedekiah his brother king over Judah and Jerusalem.";
rsv[10] = "In the spring of the year King Nebuchadnez\'zar sent and brought him to Babylon, with the precious vessels of the house of the LORD, and made his brother Zedeki\'ah king over Judah and Jerusalem.";
asv[10] = "And at the return of the year king Nebuchadnezzar sent, and brought him to Babylon, with the goodly vessels of the house of Jehovah, and made Zedekiah his brother king over Judah and Jerusalem.";
yng[10] = "and at the turn of the year hath king Nebuchadnezzar sent and bringeth him in to Babylon, with the desirable vessels of the house of Jehovah, and causeth Zedekiah his brother to reign over Judah and Jerusalem.";
dby[10] = "And at the turn of the year king Nebuchadnezzar sent and had him brought to Babylon, with the precious vessels of the house of Jehovah; and he made Zedekiah his brother king over Judah and Jerusalem.";
web[10] = "And when the year had expired, king Nebuchadnezzar sent, and brought him to Babylon, with the goodly vessels of the house of the LORD, and made Zedekiah his brother king over Judah and Jerusalem.";
hnv[10] = "At the return of the year king Nevukhadnetztzar sent, and brought him to Bavel, with the goodly vessels of the house of the LORD, and made Tzidkiyahu his brother king over Yehudah and Yerushalayim.";
vul[10] = "cumque anni circulus volveretur misit Nabuchodonosor rex qui et adduxerunt eum in Babylonem asportatis simul pretiosissimis vasis domus Domini regem vero constituit Sedeciam fratrem eius super Iudam et Hierusalem";
kjv[11] = "Zedekiah [was] one and twenty years old when he began to reign, and reigned eleven years in Jerusalem.";
rsv[11] = "Zedeki\'ah was twenty-one years old when he began to reign, and he reigned eleven years in Jerusalem.";
asv[11] = "Zedekiah was twenty and one years old when he began to reign; and he reigned eleven years in Jerusalem:";
yng[11] = "A son of twenty and one years [is] Zedekiah in his reigning, and eleven years he hath reigned in Jerusalem;";
dby[11] = "Zedekiah was twenty-one years old when he began to reign; and he reigned eleven years in Jerusalem.";
web[11] = "Zedekiah [was] one and twenty years old when he began to reign, and reigned eleven years in Jerusalem.";
hnv[11] = "Tzidkiyahu was twenty-one years old when he began to reign; and he reigned eleven years in Yerushalayim:";
vul[11] = "viginti et unius anni erat Sedecias cum regnare coepisset et undecim annis regnavit in Hierusalem";
kjv[12] = "And he did [that which was] evil in the sight of the LORD his God, [and] humbled not himself before Jeremiah the prophet [speaking] from the mouth of the LORD.";
rsv[12] = "He did what was evil in the sight of the LORD his God. He did not humble himself before Jeremiah the prophet, who spoke from the mouth of the LORD.";
asv[12] = "and he did that which was evil in the sight of Jehovah his God; he humbled not himself before Jeremiah the prophet [speaking] from the mouth of Jehovah.";
yng[12] = "and he doth the evil thing in the eyes of Jehovah his God, he hath not been humbled before Jeremiah the prophet [speaking] from the mouth of Jehovah;";
dby[12] = "And he did evil in the sight of Jehovah his God; he humbled not himself before the prophet Jeremiah speaking from the mouth of Jehovah.";

hnv[12] = "and he did that which was evil in the sight of the LORD his God; he didn\'t humble himself before Yirmeyahu the prophet [speaking] from the mouth of the LORD.";

kjv[13] = "And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning unto the LORD God of Israel.";
rsv[13] = "He also rebelled against King Nebuchadnez\'zar, who had made him swear by God; he stiffened his neck and hardened his heart against turning to the LORD, the God of Israel.";
asv[13] = "And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart against turning unto Jehovah, the God of Israel.";
yng[13] = "and also, against king Nebuchadnezzar he hath rebelled, who had caused him to swear by God, and he hardeneth his neck, and strengtheneth his heart, against turning back unto Jehovah, God of Israel.";
dby[13] = "And he also rebelled against king Nebuchadnezzar, who had made him take oath by God; and he stiffened his neck, and hardened his heart from returning to Jehovah the God of Israel.";
web[13] = "And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning to the LORD God of Israel.";
hnv[13] = "He also rebelled against king Nevukhadnetztzar, who had made him swear by God: but he stiffened his neck, and hardened his heart against turning to the LORD, the God of Yisra\'el.";
vul[13] = "a rege quoque Nabuchodonosor recessit qui adiuraverat eum per Deum et induravit cervicem suam et cor ut non reverteretur ad Dominum Deum Israhel";

asv[14] = "Moreover all the chiefs of the priests, and the people, trespassed very greatly after all the abominations of the nations; and they polluted the house of Jehovah which he had hallowed in Jerusalem.";
yng[14] = "Also, all the heads of the priests, and the people, having multiplied to commit a trespass according to all the abominations of the nations, and they defile the house of Jehovah that He hath sanctified in Jerusalem.";
dby[14] = "All the chiefs of the priests also, and the people, increased their transgressions, according to all the abominations of the nations; and they defiled the house of Jehovah which he had hallowed in Jerusalem.";
web[14] = "Moreover, all the chief of the priests, and the people, transgressed very much after all the abominations of the heathen; and polluted the house of the LORD which he had hallowed in Jerusalem.";
hnv[14] = "Moreover all the chiefs of the Kohanim, and the people, trespassed very greatly after all the abominations of the nations; and they polluted the house of the LORD which he had made holy in Yerushalayim.";
vul[14] = "sed et universi principes sacerdotum et populus praevaricati sunt inique iuxta universas abominationes gentium et polluerunt domum Domini quam sanctificaverat sibi in Hierusalem";
kjv[15] = "And the LORD God of their fathers sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people, and on his dwelling place:";
rsv[15] = "The LORD, the God of their fathers, sent persistently to them by his messengers, because he had compassion on his people and on his dwelling place;";
asv[15] = "And Jehovah, the God of their fathers, sent to them by his messengers, rising up early and sending, because he had compassion on his people, and on his dwelling-place:";
yng[15] = "And Jehovah, God of their fathers, sendeth unto them by the hand of His messengers -- rising early and sending -- for He hath had pity on His people, and on His habitation,";
dby[15] = "And Jehovah the God of their fathers sent to them by his messengers, rising up early and sending; because he had compassion on his people and on his dwelling-place.";
web[15] = "And the LORD God of their fathers sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people, and on his dwelling-place:";
hnv[15] = "The LORD, the God of their fathers, sent to them by his messengers, rising up early and sending, because he had compassion on his people, and on his dwelling-place:";
vul[15] = "mittebat autem Dominus Deus patrum suorum ad illos per manum nuntiorum suorum de nocte consurgens et cotidie commonens eo quod parceret populo et habitaculo suo";
kjv[16] = "But they mocked the messengers of God, and despised his words, and misused his prophets, until the wrath of the LORD arose against his people, till [there was] no remedy.";
rsv[16] = "but they kept mocking the messengers of God, despising his words, and scoffing at his prophets, till the wrath of the LORD rose against his people, till there was no remedy.";
asv[16] = "but they mocked the messengers of God, and despised his words, and scoffed at his prophets, until the wrath of Jehovah arose against his people, till there was no remedy.";
yng[16] = "and they are mocking at the messengers of God, and despising His words, and acting deceitfully with His prophets, till the going up of the fury of Jehovah against His people -- till there is no healing.";
dby[16] = "But they mocked at the messengers of God, and despised his words, and scoffed at his prophets, until the fury of Jehovah rose against his people, and there was no remedy.";
web[16] = "But they mocked the messengers of God, and despised his words, and misused his prophets, until the wrath of the LORD arose against his people, till [there was] no remedy.";
hnv[16] = "but they mocked the messengers of God, and despised his words, and scoffed at his prophets, until the wrath of the LORD arose against his people, until there was no remedy.";
vul[16] = "at illi subsannabant nuntios Dei et parvipendebant sermones eius inludebantque prophetis donec ascenderet furor Domini in populum eius et esset nulla curatio";
kjv[17] = "Therefore he brought upon them the king of the Chaldees, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age: he gave [them] all into his hand.";
rsv[17] = "Therefore he brought up against them the king of the Chalde\'ans, who slew their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged; he gave them all into his hand.";
asv[17] = "Therefore he brought upon them the king of the Chaldeans, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or virgin, old man or hoary-headed: he gave them all into his hand.";
yng[17] = "And He causeth to go up against them the king of the Chaldeans, and he slayeth their chosen ones by the sword in the house of their sanctuary, and hath had no pity on young man and virgin, old man and very aged -- the whole He hath given into his hand.";
dby[17] = "And he brought up [against] them the king of the Chaldees, and slew their young men with the sword in the house of their sanctuary, and spared not young man nor maiden, old man nor him of hoary head: he gave [them] all into his hand.";
web[17] = "Therefore he brought upon them the king of the Chaldees, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age: he gave [them] all into his hand.";
hnv[17] = " Therefore he brought on them the king of the Kasdim, who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or gray-headed: he gave them all into his hand.";
vul[17] = "adduxit enim super eos regem Chaldeorum et interfecit iuvenes eorum gladio in domo sanctuarii sui non est misertus adulescentis et virginis et senis nec decrepiti quidem sed omnes tradidit manibus eius";
kjv[18] = "And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all [these] he brought to Babylon.";
rsv[18] = "And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king and of his princes, all these he brought to Babylon.";
asv[18] = "And all the vessels of the house of God, great and small, and the treasures of the house of Jehovah, and the treasures of the king, and of his princes, all these he brought to Babylon.";
yng[18] = "And all the vessels of the house of God, the great and the small, and the treasures of the house of Jehovah, and the treasures of the king and of his princes -- the whole he hath brought in to Babylon.";
dby[18] = "And all the vessels of the house of God, great and small, and the treasures of the house of Jehovah, and the treasures of the king and of his princes, he brought all to Babylon.";
web[18] = "And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all [these] he brought to Babylon.";
hnv[18] = "All the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes, all these he brought to Bavel.";
vul[18] = "universaque vasa domus Domini tam maiora quam minora et thesauros templi et regis et principum transtulit in Babylonem";
kjv[19] = "And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof.";
rsv[19] = "And they burned the house of God, and broke down the wall of Jerusalem, and burned all its palaces with fire, and destroyed all its precious vessels.";
asv[19] = "And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof.";
yng[19] = "And they burn the house of God, and break down the wall of Jerusalem, and all its palaces they have burnt with fire, and all its desirable vessels -- to destruction.";
dby[19] = "And they burned the house of God, and broke down the wall of Jerusalem, and burned all the palaces thereof with fire, and all the precious vessels thereof were given up to destruction.";
web[19] = "And they burnt the house of God, and broke down the wall of Jerusalem, and burnt all its palaces with fire, and destroyed all its goodly vessels.";
hnv[19] = "They burnt the house of God, and broke down the wall of Yerushalayim, and burnt all the palaces of it with fire, and destroyed all the goodly vessels of it.";
vul[19] = "incenderunt hostes domum Dei destruxerunt murum Hierusalem universas turres conbuserunt et quicquid pretiosum fuerat demoliti sunt";
kjv[20] = "And them that had escaped from the sword carried he away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia:";
rsv[20] = "He took into exile in Babylon those who had escaped from the sword, and they became servants to him and to his sons until the establishment of the kingdom of Persia,";
asv[20] = "And them that had escaped from the sword carried he away to Babylon; and they were servants to him and his sons until the reign of the kingdom of Persia:";
yng[20] = "And he removeth those left of the sword unto Babylon, and they are to him and to his sons for servants, till the reigning of the kingdom of Persia,";
dby[20] = "And them that had escaped from the sword he carried away to Babylon; and they became servants to him and his sons, until the reign of the kingdom of Persia;";
web[20] = "And them that had escaped from the sword he carried away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia.";
hnv[20] = "Those who had escaped from the sword carried he away to Bavel; and they were servants to him and his sons until the reign of the kingdom of Paras:";
vul[20] = "si quis evaserat gladium ductus in Babylonem servivit regi et filiis eius donec imperaret rex Persarum";
kjv[21] = "To fulfil the word of the LORD by the mouth of Jeremiah, until the land had enjoyed her sabbaths: [for] as long as she lay desolate she kept sabbath, to fulfil threescore and ten years.";
rsv[21] = "to fulfil the word of the LORD by the mouth of Jeremiah, until the land had enjoyed its sabbaths. All the days that it lay desolate it kept sabbath, to fulfil seventy years.";
asv[21] = "to fulfil the word of Jehovah by the mouth of Jeremiah, until the land had enjoyed its sabbaths: [for] as long as it lay desolate it kept sabbath, to fulfil threescore and ten years.";
yng[21] = "to fulfil the word of Jehovah in the mouth of Jeremiah, till the land hath enjoyed its sabbaths; all the days of the desolation it kept sabbath -- to the fulness of seventy years.";
dby[21] = "to fulfil the word of Jehovah by the mouth of Jeremiah, until the land had enjoyed its sabbaths. All the days of its desolation it kept sabbath, to fulfil seventy years.";
web[21] = "To fulfill the word of the LORD by the mouth of Jeremiah, until the land had enjoyed her sabbaths: [for] as long as she lay desolate she kept sabbath, to fulfill seventy years.";
hnv[21] = "to fulfill the word of the LORD by the mouth of Yirmeyahu, until the land had enjoyed its Shabbatot: [for] as long as it lay desolate it kept Shabbat, to fulfill seventy years.";
vul[21] = "et conpleretur sermo Domini ex ore Hieremiae et celebraret terra sabbata sua cunctis enim diebus desolationis egit sabbatum usque dum conplerentur septuaginta anni";
kjv[22] = "Now in the first year of Cyrus king of Persia, that the word of the LORD [spoken] by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
rsv[22] = "Now in the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia so that he made a proclamation throughout all his kingdom and also put it in writing:";
asv[22] = "Now in the first year of Cyrus king of Persia, that the word of Jehovah by the mouth of Jeremiah might be accomplished, Jehovah stirred up the spirit of Cyrus king of Persia, so that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
yng[22] = "And in the first year of Cyrus king of Persia, at the completion of the word of Jehovah in the mouth of Jeremiah, hath Jehovah waked up the spirit of Cyrus king of Persia, and he causeth an intimation to pass over into all his kingdom, and also in writing, saying,";
dby[22] = "And in the first year of Cyrus king of Persia, that the word of Jehovah by the mouth of Jeremiah might be accomplished, Jehovah stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout his kingdom, and also in writing, saying,";
web[22] = "Now in the first year of Cyrus king of Persia, that the word of the LORD [spoken] by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
hnv[22] = "Now in the first year of Koresh king of Paras, that the word of the LORD by the mouth of Yirmeyahu might be accomplished, the LORD stirred up the spirit of Koresh king of Paras, so that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
vul[22] = "anno autem primo Cyri regis Persarum ad explendum sermonem Domini quem locutus fuerat per os Hieremiae suscitavit Dominus spiritum Cyri regis Persarum qui iussit praedicari in universo regno suo etiam per scripturam dicens";
kjv[23] = "Thus saith Cyrus king of Persia, All the kingdoms of the earth hath the LORD God of heaven given me; and he hath charged me to build him an house in Jerusalem, which [is] in Judah. Who [is there] among you of all his people? The LORD his God [be] with him, and let him go up.";
rsv[23] = "&quot;Thus says Cyrus king of Persia, \'The LORD, the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build him a house at Jerusalem, which is in Judah. Whoever is among you of all his people, may the LORD his God be with him. Let him go up.\'&quot;";
asv[23] = "Thus saith Cyrus king of Persia, All the kingdoms of the earth hath Jehovah, the God of heaven, given me; and he hath charged me to build him a house in Jerusalem, which is in Judah. Whosoever there is among you of all his people, Jehovah his God be with him, and let him go up.";
yng[23] = "`Thus said Cyrus king of Persia, All kingdoms of the earth hath Jehovah, God of the heavens, given to me, and He hath laid a charge on me to build to Him a house in Jerusalem, that [is] in Judah; who is among you of all His people? Jehovah his God [is] with him, and he doth go up.\'";
dby[23] = "Thus says Cyrus king of Persia: All the kingdoms of the earth has Jehovah the God of the heavens given to me, and he has charged me to build him a house at Jerusalem, which is in Judah. Whosoever there is among you of all his people, Jehovah his God be with him, and let him go up.";
web[23] = "Thus saith Cyrus king of Persia, All the kingdoms of the earth hath the LORD God of heaven given me; and he hath charged me to build him a house in Jerusalem, which [is] in Judah. Who [is there] among you of all his people? The LORD his God [be] with him, and let him go up.";
hnv[23] = "Thus says Koresh king of Paras, All the kingdoms of the eretz has the LORD, the God of heaven, given me; and he has charged me to build him a house in Yerushalayim, which is in Yehudah. Whoever there is among you of all his people, the LORD his God be with him, and let him go up.";
vul[23] = "haec dicit Cyrus rex Persarum omnia regna terrae dedit mihi Dominus Deus caeli et ipse praecepit mihi ut aedificarem ei domum in Hierusalem quae est in Iudaea quis ex vobis est in omni populo eius sit Dominus Deus suus cum eo et ascendat";
</script>
