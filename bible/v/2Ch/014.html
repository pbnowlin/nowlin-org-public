csb[1] = "Abijah rested with his fathers and was buried in the city of David. His son Asa became king in his place. During his reign the land experienced peace for ten years.";
csb[2] = "Asa did what was good and right in the sight of the LORD his God.";
csb[3] = "He removed the pagan altars and the high places. He shattered their sacred pillars and chopped down their Asherah poles.";
csb[4] = "He told the people of Judah to seek the LORD God of their ancestors and to carry out the instruction and the commands.";
csb[5] = "He also removed the high places and the shrines from all the cities of Judah, and the kingdom experienced peace under him.";
csb[6] = "Because the land experienced peace, Asa built fortified cities in Judah. No one made war with him in those days because the LORD gave him rest.";
csb[7] = "So he said to the people of Judah, &quot;Let\'s build these cities and surround them with walls and towers, with doors and bars. The land is still ours because we sought the LORD our God. We sought him and he gave us rest on every side.&quot; So they built and succeeded.";
csb[8] = "Asa had an army of three hundred thousand from Judah bearing large shields and spears, and two hundred eighty thousand from Benjamin bearing regular shields and drawing the bow. All these were valiant warriors.";
csb[9] = "Then Zerah the Cushite came against them with an army of one million men and three hundred chariots. They came as far as Mareshah.";
csb[10] = "So Asa marched out against him and lined up in battle formation in Zephathah Valley at Mareshah.";
csb[11] = "Then Asa cried out to the LORD his God: &quot;LORD, there is no one besides you to help the mighty and those without strength. Help us, LORD our God, for we depend on you, and in your name we have come against this large army. LORD, you are our God. Do not let a mere mortal hinder you.&quot;";
csb[12] = "So the LORD routed the Cushites before Asa and before Judah, and the Cushites fled.";
csb[13] = "Then Asa and the people who were with him pursued them as far as Gerar. The Cushites fell until they had no survivors, for they were crushed before the LORD and his army. So the people of Judah carried off a great supply of loot.";
csb[14] = "Then they attacked all the cities around Gerar because the terror of the LORD was on them. They also plundered all the cities, since there was a great deal of plunder in them.";
csb[15] = "They also attacked the tents of the herdsmen and captured many sheep and camels. Then they returned to Jerusalem.";

asv[11] = "And Asa cried unto Jehovah his God, and said, Jehovah, there is none besides thee to help, between the mighty and him that hath no strength: help us, O Jehovah our God; for we rely on thee, and in thy name are we come against this multitude. O Jehovah, thou art our God; let not man prevail against thee.";
