csb[1] = "Now Jehoshaphat had riches and honor in abundance, and he made an alliance with Ahab through marriage.";
csb[2] = "Then after some years, he went down to visit Ahab in Samaria. Ahab sacrificed many sheep, goats, and cattle for him and for the people who were with him. Then he persuaded him to attack Ramoth-gilead,";
csb[3] = "for Israel\'s King Ahab asked Judah\'s King Jehoshaphat, &quot;Will you go with me to Ramoth-gilead? &quot; He replied to him, &quot;I am as you are, my people as your people; we will be with you in the battle.&quot;";
csb[4] = "But Jehoshaphat said to the king of Israel, &quot;First, please ask what the LORD\'s will is.&quot;";
csb[5] = "So the king of Israel gathered the prophets, four hundred men, and asked them, &quot;Should we go to Ramoth-gilead for war or should I refrain? &quot; They replied, &quot;March up, and God will hand it over to the king.&quot;";
csb[6] = "But Jehoshaphat asked, &quot;Isn\'t there a prophet of the LORD here anymore? Let\'s ask him.&quot;";
csb[7] = "The king of Israel said to Jehoshaphat, &quot;There is still one man who can inquire of the LORD, but I hate him because he never prophesies good about me, but only disaster. He is Micaiah son of Imlah.&quot; &quot;The king shouldn\'t say that,&quot; Jehoshaphat replied.";
csb[8] = "So the king of Israel called an officer and said, &quot;Hurry and get Micaiah son of Imlah! &quot;";
csb[9] = "Now the king of Israel and King Jehoshaphat of Judah, clothed in royal attire, were each sitting on his own throne. They were sitting on the threshing floor at the entrance to Samaria\'s gate, and all the prophets were prophesying in front of them.";
csb[10] = "Then Zedekiah son of Chenaanah made iron horns and said, &quot;This is what the LORD says: \'You will gore the Arameans with these until they are finished off.\' &quot;";
csb[11] = "And all the prophets were prophesying the same, saying, &quot;March up to Ramoth-gilead and succeed, for the LORD will hand it over to the king.&quot;";
csb[12] = "The messenger who went to call Micaiah instructed him, &quot;Look, the words of the prophets are unanimously favorable for the king. So let your words be like theirs, and speak favorably.&quot;";
csb[13] = "But Micaiah said, &quot;As the LORD lives, I will say whatever my God says.&quot;";
csb[14] = "So he went to the king, and the king asked him, &quot;Micaiah, should we go to Ramoth-gilead for war, or should I refrain? &quot; Micaiah said, &quot;March up and succeed, for they will be handed over to you.&quot;";
csb[15] = "But the king said to him, &quot;How many times must I make you swear not to tell me anything but the truth in the name of the LORD? &quot;";
csb[16] = "So Micaiah said: I saw all Israel scattered on the hills like sheep without a shepherd. And the LORD said, &quot;They have no master; let each return home in peace.&quot;";
csb[17] = "So the king of Israel said to Jehoshaphat, &quot;Didn\'t I tell you he never prophesies good about me, but only disaster? &quot;";
csb[18] = "Then Micaiah said, &quot;Therefore, hear the word of the LORD. I saw the LORD sitting on his throne, and the whole heavenly army was standing at his right hand and at his left hand.";
csb[19] = "&quot;And the LORD said, \'Who will entice King Ahab of Israel to march up and fall at Ramoth-gilead? \' So one was saying this and another was saying that.";
csb[20] = "&quot;Then a spirit came forward, stood before the LORD, and said, \'I will entice him.\' &quot;The LORD asked him, \'How? \'";
csb[21] = "&quot;So he said, \'I will go and become a lying spirit in the mouth of all his prophets.\' &quot;Then he said, \'You will entice him and also prevail. Go and do that.\'";
csb[22] = "&quot;Now, you see, the LORD has put a lying spirit into the mouth of these prophets of yours, and the LORD has pronounced disaster against you.&quot;";
csb[23] = "Then Zedekiah son of Chenaanah came up, hit Micaiah on the cheek, and demanded, &quot;Which way did the spirit from the LORD leave me to speak to you? &quot;";
csb[24] = "Micaiah replied, &quot;You will soon see when you go to hide in an inner chamber on that day.&quot;";
csb[25] = "Then the king of Israel ordered, &quot;Take Micaiah and return him to Amon, the governor of the city, and to Joash, the king\'s son,";
csb[26] = "&quot;and say, \'This is what the king says: Put this guy in prison and feed him only a little bread and water until I come back safely.\' &quot;";
csb[27] = "But Micaiah said, &quot;If you ever return safely, the LORD has not spoken through me.&quot; Then he said, &quot;Listen, all you people! &quot;";
csb[28] = "Then the king of Israel and Judah\'s King Jehoshaphat went up to Ramoth-gilead.";
csb[29] = "But the king of Israel said to Jehoshaphat, &quot;I will disguise myself and go into battle, but you wear your royal attire.&quot; So the king of Israel disguised himself, and they went into battle.";
csb[30] = "Now the king of Aram had ordered his chariot commanders, &quot;Do not fight with anyone at all except the king of Israel.&quot;";
csb[31] = "When the chariot commanders saw Jehoshaphat, they shouted, &quot;He must be the king of Israel! &quot; So they turned to attack him, but Jehoshaphat cried out and the LORD helped him. God drew them away from him.";
csb[32] = "When the chariot commanders saw that he was not the king of Israel, they turned back from pursuing him.";
csb[33] = "But a man drew his bow without taking special aim and struck the king of Israel through the joints of his armor. So he said to the charioteer, &quot;Turn around and take me out of the battle, for I am badly wounded! &quot;";
csb[34] = "The battle raged throughout that day, and the king of Israel propped himself up in his chariot facing the Arameans until evening. Then he died at sunset.";
kjv[1] = "Now Jehoshaphat had riches and honour in abundance, and joined affinity with Ahab.";
kjv[2] = "And after [certain] years he went down to Ahab to Samaria. And Ahab killed sheep and oxen for him in abundance, and for the people that [he had] with him, and persuaded him to go up [with him] to Ramothgilead.";
kjv[3] = "And Ahab king of Israel said unto Jehoshaphat king of Judah, Wilt thou go with me to Ramothgilead? And he answered him, I [am] as thou [art], and my people as thy people; and [we will be] with thee in the war.";
kjv[4] = "And Jehoshaphat said unto the king of Israel, Enquire, I pray thee, at the word of the LORD to day.";
kjv[5] = "Therefore the king of Israel gathered together of prophets four hundred men, and said unto them, Shall we go to Ramothgilead to battle, or shall I forbear? And they said, Go up; for God will deliver [it] into the king\'s hand.";
kjv[6] = "But Jehoshaphat said, [Is there] not here a prophet of the LORD besides, that we might enquire of him?";
kjv[7] = "And the king of Israel said unto Jehoshaphat, [There is] yet one man, by whom we may enquire of the LORD: but I hate him; for he never prophesied good unto me, but always evil: the same [is] Micaiah the son of Imla. And Jehoshaphat said, Let not the king say so.";
kjv[8] = "And the king of Israel called for one [of his] officers, and said, Fetch quickly Micaiah the son of Imla.";
kjv[9] = "And the king of Israel and Jehoshaphat king of Judah sat either of them on his throne, clothed in [their] robes, and they sat in a void place at the entering in of the gate of Samaria; and all the prophets prophesied before them.";
kjv[10] = "And Zedekiah the son of Chenaanah had made him horns of iron, and said, Thus saith the LORD, With these thou shalt push Syria until they be consumed.";
kjv[11] = "And all the prophets prophesied so, saying, Go up to Ramothgilead, and prosper: for the LORD shall deliver [it] into the hand of the king.";
kjv[12] = "And the messenger that went to call Micaiah spake to him, saying, Behold, the words of the prophets [declare] good to the king with one assent; let thy word therefore, I pray thee, be like one of theirs, and speak thou good.";
kjv[13] = "And Micaiah said, [As] the LORD liveth, even what my God saith, that will I speak.";
kjv[14] = "And when he was come to the king, the king said unto him, Micaiah, shall we go to Ramothgilead to battle, or shall I forbear? And he said, Go ye up, and prosper, and they shall be delivered into your hand.";
kjv[15] = "And the king said to him, How many times shall I adjure thee that thou say nothing but the truth to me in the name of the LORD?";
kjv[16] = "Then he said, I did see all Israel scattered upon the mountains, as sheep that have no shepherd: and the LORD said, These have no master; let them return [therefore] every man to his house in peace.";
kjv[17] = "And the king of Israel said to Jehoshaphat, Did I not tell thee [that] he would not prophesy good unto me, but evil?";
kjv[18] = "Again he said, Therefore hear the word of the LORD; I saw the LORD sitting upon his throne, and all the host of heaven standing on his right hand and [on] his left.";
kjv[19] = "And the LORD said, Who shall entice Ahab king of Israel, that he may go up and fall at Ramothgilead? And one spake saying after this manner, and another saying after that manner.";
kjv[20] = "Then there came out a spirit, and stood before the LORD, and said, I will entice him. And the LORD said unto him, Wherewith?";
kjv[21] = "And he said, I will go out, and be a lying spirit in the mouth of all his prophets. And [the LORD] said, Thou shalt entice [him], and thou shalt also prevail: go out, and do [even] so.";
kjv[22] = "Now therefore, behold, the LORD hath put a lying spirit in the mouth of these thy prophets, and the LORD hath spoken evil against thee.";
kjv[23] = "Then Zedekiah the son of Chenaanah came near, and smote Micaiah upon the cheek, and said, Which way went the Spirit of the LORD from me to speak unto thee?";
kjv[24] = "And Micaiah said, Behold, thou shalt see on that day when thou shalt go into an inner chamber to hide thyself.";
kjv[25] = "Then the king of Israel said, Take ye Micaiah, and carry him back to Amon the governor of the city, and to Joash the king\'s son;";
kjv[26] = "And say, Thus saith the king, Put this [fellow] in the prison, and feed him with bread of affliction and with water of affliction, until I return in peace.";
kjv[27] = "And Micaiah said, If thou certainly return in peace, [then] hath not the LORD spoken by me. And he said, Hearken, all ye people.";
kjv[28] = "So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead.";
kjv[29] = "And the king of Israel said unto Jehoshaphat, I will disguise myself, and will go to the battle; but put thou on thy robes. So the king of Israel disguised himself; and they went to the battle.";
kjv[30] = "Now the king of Syria had commanded the captains of the chariots that [were] with him, saying, Fight ye not with small or great, save only with the king of Israel.";
kjv[31] = "And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, It [is] the king of Israel. Therefore they compassed about him to fight: but Jehoshaphat cried out, and the LORD helped him; and God moved them [to depart] from him.";
kjv[32] = "For it came to pass, that, when the captains of the chariots perceived that it was not the king of Israel, they turned back again from pursuing him.";
kjv[33] = "And a [certain] man drew a bow at a venture, and smote the king of Israel between the joints of the harness: therefore he said to his chariot man, Turn thine hand, that thou mayest carry me out of the host; for I am wounded.";
kjv[34] = "And the battle increased that day: howbeit the king of Israel stayed [himself] up in [his] chariot against the Syrians until the even: and about the time of the sun going down he died.";

rsv[3] = "Ahab king of Israel said to Jehosh\'aphat king of Judah, &quot;Will you go with me to Ramoth-gilead?&quot; He answered him, &quot;I am as you are, my people as your people. We will be with you in the war.&quot;";
asv[3] = "And Ahab king of Israel said unto Jehoshaphat king of Judah, Wilt thou go with me to Ramoth-gilead? And he answered him, I am as thou art, and my people as thy people; and [we will be] with thee in the war.";

dby[3] = "And Ahab king of Israel said to Jehoshaphat king of Judah, Wilt thou go with me to Ramoth-Gilead? And he said to him, I am as thou, and my people as thy people; and [I will be] with thee in the war.";

rsv[7] = "And the king of Israel said to Jehosh\'aphat, &quot;There is yet one man by whom we may inquire of the LORD, Micai\'ah the son of Imlah; but I hate him, for he never prophesies good concerning me, but always evil.&quot; And Jehosh\'aphat said, &quot;Let not the king say so.&quot;";
asv[7] = "And the king of Israel said unto Jehoshaphat, There is yet one man by whom we may inquire of Jehovah: but I hate him; for he never prophesieth good concerning me, but always evil: the same is Micaiah the son of Imla. And Jehoshaphat said, Let not the king say so.";
yng[7] = "And the king of Israel saith unto Jehoshaphat, `Still -- one man to seek Jehovah from him, and I -- I have hated him, for he is not prophesying concerning me of good, but all his days of evil, he [is] Micaiah son of Imlah;\' and Jehoshaphat saith, `Let not the king say so.\'";
dby[7] = "And the king of Israel said to Jehoshaphat, There is yet one man by whom we may inquire of Jehovah; but I hate him, for he prophesies no good concerning me, but always evil: [it is] Micah the son of Imlah. And Jehoshaphat said, Let not the king say so.";
web[7] = "And the king of Israel said to Jehoshaphat, [There is] yet one man, by whom we may inquire of the LORD: but I hate him; for he never prophesieth good to me, but always evil: the same [is] Micaiah the son of Imla. And Jehoshaphat said, Let not the king say so.";
hnv[7] = "The king of Yisra\'el said to Yehoshafat, There is yet one man by whom we may inquire of the LORD: but I hate him; for he never prophesies good concerning me, but always evil: the same is Mikhayahu the son of Imla. Yehoshafat said, Don\'t let the king say so.";

yng[9] = "And the king of Israel and Jehoshaphat king of Judah are sitting, each on his throne, clothed with garments, and they are sitting in a threshing-floor at the opening of the gate of Samaria, and all the prophets are prophesying before them.";
dby[9] = "And the king of Israel and Jehoshaphat the king of Judah, having put on their robes, sat each on his throne; and they sat in an open place at the entrance of the gate of Samaria; and all the prophets prophesied before them.";
web[9] = "And the king of Israel and Jehoshaphat king of Judah sat each of them on his throne, clothed in [their] robes, and they sat in a void place at the entrance of the gate of Samaria; and all the prophets prophesied before them.";
hnv[9] = "Now the king of Yisra\'el and Yehoshafat the king of Yehudah sat each on his throne, arrayed in their robes, and they were sitting in an open place at the entrance of the gate of Shomron; and all the prophets were prophesying before them.";
vul[9] = "porro rex Israhel et Iosaphat rex Iuda uterque sedebant in solio suo vestiti cultu regio sedebant autem in area iuxta portam Samariae omnesque prophetae vaticinabantur coram eis";
rsv[10] = "And Zedeki\'ah the son of Chena\'anah made for himself horns of iron, and said, &quot;Thus says the LORD, \'With these you shall push the Syrians until they are destroyed.\'&quot;";
asv[10] = "And Zedekiah the son of Chenaanah made him horns of iron and said, Thus saith Jehovah, With these shalt thou push the Syrians, until they be consumed.";

rsv[11] = "And all the prophets prophesied so, and said, &quot;Go up to Ramoth-gilead and triumph; the LORD will give it into the hand of the king.&quot;";
asv[11] = "And all the prophets prophesied so, saying, Go up to Ramoth-gilead, and prosper; for Jehovah will deliver it into the hand of the king.";
yng[11] = "With these thou dost push Aram till thou hast consumed them.\' And all the prophets are prophesying so, saying, `Go up [to] Ramath-Gilead and prosper, and Jehovah hath given [it] into the hand of the king.\'";

hnv[11] = "All the prophets prophesied so, saying, Go up to Ramot-Gil`ad, and prosper; for the LORD will deliver it into the hand of the king.";

rsv[12] = "And the messenger who went to summon Micai\'ah said to him, &quot;Behold, the words of the prophets with one accord are favorable to the king; let your word be like the word of one of them, and speak favorably.&quot;";
asv[12] = "And the messenger that went to call Micaiah spake to him, saying, Behold, the words of the prophets [declare] good to the king with one mouth: let thy word therefore, I pray thee, be like one of theirs, and speak thou good.";
yng[12] = "And the messenger who hath gone to call for Micaiah hath spoken unto him, saying, `Lo, the words of the prophets -- one mouth -- [are] good towards the king, and let, I pray thee, thy word be like one of theirs: and thou hast spoken good.\'";
dby[12] = "And the messenger that went to call Micah spoke to him saying, Behold, the words of the prophets [declare] good to the king with one assent: let thy word therefore, I pray thee, be like one of theirs, and declare good.";
web[12] = "And the messenger that went to call Micaiah spoke to him, saying, Behold, the words of the prophets [declare] good to the king with one consent; let thy word therefore, I pray thee, be like one of theirs, and speak thou good.";
hnv[12] = "The messenger who went to call Mikhayahu spoke to him, saying, Behold, the words of the prophets [declare] good to the king with one mouth: let your word therefore, Please be like one of theirs, and speak you good.";
vul[12] = "nuntius autem qui ierat ad vocandum Micheam ait illi en verba omnium prophetarum uno ore bona regi adnuntiant quaeso ergo te ut et sermo tuus ab eis non dissentiat loquarisque prospera";
rsv[13] = "But Micai\'ah said, &quot;As the LORD lives, what my God says, that I will speak.&quot;";
asv[13] = "And Micaiah said, As Jehovah liveth, what my God saith, that will I speak.";
yng[13] = "And Micaiah saith `Jehovah liveth, surely that which my God saith, it I speak.\'";
dby[13] = "And Micah said, As Jehovah liveth, even what my God shall say, that will I declare.";
web[13] = "And Micaiah said, [As] the LORD liveth, even what my God saith, that will I speak.";
hnv[13] = "Mikhayahu said, As the LORD lives, what my God says, that will I speak.";
vul[13] = "cui respondit Micheas vivit Dominus quia quodcumque dixerit Deus meus hoc loquar";
rsv[14] = "And when he had come to the king, the king said to him, &quot;Micai\'ah, shall we go to Ramoth-gilead to battle, or shall I forbear?&quot; And he answered, &quot;Go up and triumph; they will be given into your hand.&quot;";
asv[14] = "And when he was come to the king, the king said unto him, Micaiah, shall we go to Ramoth-gilead to battle, or shall I forbear? And he said, Go ye up, and prosper; and they shall be delivered into your hand.";
yng[14] = "And he cometh in unto the king, and the king saith unto him, `Micaiah, do we go unto Ramoth-Gilead to battle, or do I forbear?\' And he saith, `Go ye up, and prosper, and they are given into your hand.\'";
dby[14] = "And he came to the king. And the king said to him, Micah, shall we go against Ramoth-Gilead to battle, or shall I forbear? And he said, Go ye up, and prosper; and they will be given into your hands.";
web[14] = "And when he had come to the king, the king said to him, Micaiah, shall we go to Ramoth-gilead to battle, or shall I forbear? And he said, Go ye up, and prosper, and they shall be delivered into your hand.";
hnv[14] = "When he was come to the king, the king said to him, Mikhayahu, shall we go to Ramot-Gil`ad to battle, or shall I forbear? He said, Go up, and prosper; and they shall be delivered into your hand.";
vul[14] = "venit ergo ad regem cui rex ait Michea ire debemus in Ramoth Galaad ad bellandum an quiescere cui ille respondit ascendite cuncta enim prospera evenient et tradentur hostes in manus vestras";
rsv[15] = "But the king said to him, &quot;How many times shall I adjure you that you speak to me nothing but the truth in the name of the LORD?&quot;";
asv[15] = "And the king said to him, How many times shall I adjure thee that thou speak unto me nothing but the truth in the name of Jehovah?";
yng[15] = "And the king saith unto him, `How many times am I adjuring thee, that thou speak unto me only truth in the name of Jehovah?\'";
dby[15] = "And the king said to him, How many times shall I adjure thee that thou tell me nothing but truth in the name of Jehovah?";
web[15] = "And the king said to him, How many times shall I adjure thee that thou say nothing but the truth to me in the name of the LORD?";
hnv[15] = "The king said to him, How many times shall I adjure you that you speak to me nothing but the truth in the name of the LORD?";
vul[15] = "dixitque rex iterum atque iterum te adiuro ut non mihi loquaris nisi quod verum est in nomine Domini";
rsv[16] = "And he said, &quot;I saw all Israel scattered upon the mountains, as sheep that have no shepherd; and the LORD said, \'These have no master; let each return to his home in peace.\'&quot;";
asv[16] = "And he said, I saw all Israel scattered upon the mountains, as sheep that have no shepherd: and Jehovah said, These have no master; let them return every man to his house in peace.";
yng[16] = "And he saith, `I have seen all Israel scattered on the mountains, as sheep that have no shepherd, and Jehovah saith, There are no masters to these, they turn back each to his house in peace.\'";
dby[16] = "And he said, I saw all Israel scattered upon the mountains, as sheep that have no shepherd. And Jehovah said, These have no master: let them return every man to his house in peace.";
web[16] = "Then he said, I saw all Israel scattered upon the mountains, as sheep that have no shepherd: and the LORD said, These have no master; let them return [therefore] every man to his house in peace.";
hnv[16] = "He said, I saw all Yisra\'el scattered on the mountains, as sheep that have no shepherd: and the LORD said, These have no master; let them return every man to his house in shalom.";
vul[16] = "at ille ait vidi universum Israhel dispersum in montibus sicut oves absque pastore et dixit Dominus non habent isti dominos revertatur unusquisque ad domum suam in pace";
rsv[17] = "And the king of Israel said to Jehosh\'aphat, &quot;Did I not tell you that he would not prophesy good concerning me, but evil?&quot;";
asv[17] = "And the king of Israel said to Jehoshaphat, Did I not tell thee that he would not prophesy good concerning me, but evil?";
yng[17] = "And the king of Israel saith unto Jehoshaphat, `Did I not say unto thee, He doth not prophesy concerning me good, but rather of evil?\'";
dby[17] = "And the king of Israel said to Jehoshaphat, Did I not tell thee that he prophesies no good concerning me, but evil?";
web[17] = "And the king of Israel said to Jehoshaphat, Did I not tell thee [that] he would not prophesy good to me, but evil?";
hnv[17] = "The king of Yisra\'el said to Yehoshafat, Didn\'t I tell you that he would not prophesy good concerning me, but evil?";
vul[17] = "et ait rex Israhel ad Iosaphat nonne dixi tibi quod non prophetaret iste mihi quicquam boni sed ea quae mala sunt";
rsv[18] = "And Micai\'ah said, &quot;Therefore hear the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing on his right hand and on his left;";
asv[18] = "And [Micaiah] said, Therefore hear ye the word of Jehovah: I saw Jehovah sitting upon his throne, and all the host of heaven standing on his right hand and on his left.";
yng[18] = "And he saith, `Therefore, hear ye a word of Jehovah: I have seen Jehovah sitting on His throne, and all the host of the heavens standing on His right and His left;";
dby[18] = "And he said, Hear ye therefore the word of Jehovah: I saw Jehovah sitting upon his throne, and all the host of heaven standing on his right hand and on his left;";
web[18] = "Again he said, Therefore hear the word of the LORD; I saw the LORD sitting upon his throne, and all the host of heaven standing on his right hand and [on] his left.";
hnv[18] = "[Mikhayahu] said, Therefore hear you the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing on his right hand and on his left.";
vul[18] = "at ille idcirco ait audite verbum Domini vidi Dominum sedentem in solio suo et omnem exercitum caeli adsistentem ei a dextris et sinistris";
rsv[19] = "and the LORD said, \'Who will entice Ahab the king of Israel, that he may go up and fall at Ramoth-gilead?\' And one said one thing, and another said another.";
asv[19] = "And Jehovah said, Who shall entice Ahab king of Israel, that he may go up and fall at Ramoth-gilead? And one spake saying after this manner, and another saying after that manner.";
yng[19] = "and Jehovah saith, Who doth entice Ahab king of Israel, and he doth go up and fall in Ramoth-Gilead? And this speaker saith thus, and that speaker thus.";
dby[19] = "and Jehovah said, Who shall entice Ahab king of Israel that he may go up and fall at Ramoth-Gilead? And one spoke saying after this manner, and another saying after that manner.";
web[19] = "And the LORD said, Who shall entice Ahab king of Israel, that he may go up and fall at Ramoth-gilead? And one spoke saying after this manner, and another saying after that manner.";
hnv[19] = "The LORD said, Who shall entice Ach\'av king of Yisra\'el, that he may go up and fall at Ramot-Gil`ad? One spoke saying after this manner, and another saying after that manner.";
vul[19] = "et dixit Dominus quis decipiet Ahab regem Israhel ut ascendat et corruat in Ramoth Galaad cumque diceret unus hoc modo et alter alio";
rsv[20] = "Then a spirit came forward and stood before the LORD, saying, \'I will entice him.\' And the LORD said to him, \'By what means?\'";
asv[20] = "And there came forth a spirit, and stood before Jehovah, and said, I will entice him. And Jehovah said unto him, Wherewith?";
yng[20] = "And go out doth the spirit, and stand before Jehovah, and saith, I do entice him; and Jehovah saith unto him, With what?";
dby[20] = "And there came forth a spirit, and stood before Jehovah and said, I will entice him. And Jehovah said unto him, Wherewith?";
web[20] = "Then there came out a spirit, and stood before the LORD, and said, I will entice him. And the LORD said to him, With what?";
hnv[20] = "There came forth a spirit, and stood before the LORD, and said, I will entice him. The LORD said to him, \'How?\'";
vul[20] = "processit spiritus et stetit coram Domino et ait ego decipiam eum cui Dominus in quo inquit decipies";
rsv[21] = "And he said, \'I will go forth, and will be a lying spirit in the mouth of all his prophets.\' And he said, \'You are to entice him, and you shall succeed; go forth and do so.\'";
asv[21] = "And he said, I will go forth, and will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt entice him, and shalt prevail also: go forth, and do so.";
yng[21] = "and he saith, I go out, and have become a spirit of falsehood in the mouth of all his prophets. And He saith, Thou dost entice, and also, thou art able; go out and do so.";
dby[21] = "And he said, I will go forth, and will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt entice [him], and also succeed: go forth, and do so.";
web[21] = "And he said, I will go out, and be a lying spirit in the mouth of all his prophets. And [the LORD] said, Thou shalt entice [him], and thou shalt also prevail: go out and do [even] so.";
hnv[21] = "He said, \'I will go forth, and will be a lying spirit in the mouth of all his prophets.\' He said, \'You shall entice him, and shall prevail also: go forth, and do so.\'";
vul[21] = "at ille respondit egrediar et ero spiritus mendax in ore omnium prophetarum eius dixitque Dominus decipies et praevalebis egredere et fac ita";
rsv[22] = "Now therefore behold, the LORD has put a lying spirit in the mouth of these your prophets; the LORD has spoken evil concerning you.&quot;";
asv[22] = "Now therefore, behold, Jehovah hath put a lying spirit in the mouth of these thy prophets; and Jehovah hath spoken evil concerning thee.";
yng[22] = "And, now, lo, Jehovah hath put a spirit of falsehood in the mouth of these thy prophets, and Jehovah hath spoken concerning thee -- evil.\'";
dby[22] = "And now, behold, Jehovah has put a lying spirit in the mouth of these thy prophets; and Jehovah has spoken evil concerning thee.";
web[22] = "Now therefore, behold, the LORD hath put a lying spirit in the mouth of these thy prophets, and the LORD hath spoken evil against thee.";
hnv[22] = "Now therefore, behold, the LORD has put a lying spirit in the mouth of these your prophets; and the LORD has spoken evil concerning you.";
vul[22] = "nunc igitur ecce dedit Dominus spiritum mendacii in ore omnium prophetarum tuorum et Dominus locutus est de te mala";
rsv[23] = "Then Zedeki\'ah the son of Chena\'anah came near and struck Micai\'ah on the cheek, and said, &quot;Which way did the Spirit of the LORD go from me to speak to you?&quot;";
asv[23] = "Then Zedekiah the son of Chenaanah came near, and smote Micaiah upon the cheek, and said, Which way went the Spirit of Jehovah from me to speak unto thee?";
yng[23] = "And Zedekiah son of Chenaanah cometh nigh, and smiteth Micaiah on the cheek, and saith, `Where [is] this -- the way the Spirit of Jehovah passed over from me to speak with thee?\'";
dby[23] = "Then Zedekiah the son of Chenaanah went near, and smote Micah upon the cheek, and said, Which way now went the Spirit of Jehovah from me to speak to thee?";
web[23] = "Then Zedekiah the son of Chenaanah came near, and smote Micaiah upon the cheek, and said, Which way went the spirit of the LORD from me to speak to thee?";
hnv[23] = "Then Tzidkiyahu the son of Kena`anah came near, and struck Mikhayahu on the cheek, and said, Which way went the Spirit of the LORD from me to speak to you?";
vul[23] = "accessit autem Sedecias filius Chanana et percussit Micheae maxillam et ait per quam viam transivit spiritus Domini a me ut loqueretur tibi";
rsv[24] = "And Micai\'ah said, &quot;Behold, you shall see on that day when you go into an inner chamber to hide yourself.&quot;";
asv[24] = "And Micaiah said, Behold, thou shalt see on that day, when thou shalt go into an inner chamber to hide thyself.";
yng[24] = "And Micaiah saith, `Lo, thou dost see in that day, that thou dost enter into the innermost chamber to be hidden.\'";
dby[24] = "And Micah said, Behold, thou shalt see on that day when thou shalt go from chamber to chamber to hide thyself.";
web[24] = "And Micaiah said, Behold, thou shalt see on that day when thou shalt go into an inner chamber to hide thyself.";
hnv[24] = "Mikhayahu said, Behold, you shall see on that day, when you shall go into an inner chamber to hide yourself.";
vul[24] = "dixitque Micheas tu ipse videbis in die illo quando ingressus fueris cubiculum de cubiculo ut abscondaris";
rsv[25] = "And the king of Israel said, &quot;Seize Micai\'ah, and take him back to Amon the governor of the city and to Jo\'ash the king\'s son;";
asv[25] = "And the king of Israel said, Take ye Micaiah, and carry him back unto Amon the governor of the city, and to Joash the king\'s son;";
yng[25] = "And the king of Israel saith, `Take ye Micaiah, and turn him back unto Amon head of the city, and unto Joash son of the king,";
dby[25] = "And the king of Israel said, Take ye Micah, and carry him back to Amon the governor of the city, and to Joash the king\'s son;";
web[25] = "Then the king of Israel said, Take ye Micaiah, and carry him back to Amon the governor of the city, and to Joash the king\'s son;";
hnv[25] = "The king of Yisra\'el said, Take Mikhayahu, and carry him back to Amon the governor of the city, and to Yo\'ash the king\'s son;";
vul[25] = "praecepit autem rex Israhel dicens tollite Micheam et ducite eum ad Amon principem civitatis et ad Ioas filium Ammelech";
rsv[26] = "and say, \'Thus says the king, Put this fellow in prison, and feed him with scant fare of bread and water, until I return in peace.\'&quot;";
asv[26] = "and say, Thus saith the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I return in peace.";
yng[26] = "and ye have said, Thus said the king, Put ye this [one] in the house of restraint, and cause him to eat bread of oppression, and water of oppression, till my return in peace.\'";
dby[26] = "and ye shall say, Thus says the king: Put this [man] in the prison, and feed him with bread of affliction and with water of affliction, until I return in peace.";
web[26] = "And say, Thus saith the king, Put this [man] in the prison, and feed him with bread of affliction and with water of affliction, until I return in peace.";
hnv[26] = "and say, Thus says the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I return in shalom.";
vul[26] = "et dicetis haec dicit rex mittite hunc in carcerem et date ei panis modicum et aquae pauxillum donec revertar in pace";
rsv[27] = "And Micai\'ah said, &quot;If you return in peace, the LORD has not spoken by me.&quot; And he said, &quot;Hear, all you peoples!&quot;";
asv[27] = "And Micaiah said, If thou return at all in peace, Jehovah hath not spoken by me. And he said, Hear, ye peoples, all of you.";
yng[27] = "And Micaiah saith, `If thou dost certainly return in peace, Jehovah hath not spoken by me;\' and he saith, `Hear ye, O peoples, all of them!\'";
dby[27] = "And Micah said, If thou return at all in peace, Jehovah has not spoken by me. And he said, Hearken, O peoples, all of you!";
web[27] = "And Micaiah said, If thou shalt certainly return in peace, [then] hath not the LORD spoken by me. And he said, Hearken, all ye people.";
hnv[27] = "Mikhayahu said, If you return at all in shalom, the LORD has not spoken by me. He said, Hear, you peoples, all of you.";
vul[27] = "dixitque Micheas si reversus fueris in pace non est locutus Dominus in me et ait audite populi omnes";
rsv[28] = "So the king of Israel and Jehosh\'aphat the king of Judah went up to Ramoth-gilead.";
asv[28] = "So the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-gilead.";
yng[28] = "And the king of Israel goeth up, and Jehoshaphat king of Judah, unto Ramoth-Gilead;";
dby[28] = "And the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-Gilead.";
web[28] = "So the king of Israel and Jehoshaphat the king of Judah went up to Ramoth-gilead.";
hnv[28] = "So the king of Yisra\'el and Yehoshafat the king of Yehudah went up to Ramot-Gil`ad.";
vul[28] = "igitur ascenderunt rex Israhel et Iosaphat rex Iuda in Ramoth Galaad";
rsv[29] = "And the king of Israel said to Jehosh\'aphat, &quot;I will disguise myself and go into battle, but you wear your robes.&quot; And the king of Israel disguised himself; and they went into battle.";
asv[29] = "And the king of Israel said unto Jehoshaphat, I will disguise myself, and go into the battle; but put thou on thy robes. So the king of Israel disguised himself; and they went into the battle.";
yng[29] = "and the king of Israel saith unto Jehoshaphat to disguise himself, and to go into battle, `And thou, put on thy garments.\' And the king of Israel disguiseth himself, and they go into battle.";
dby[29] = "And the king of Israel said to Jehoshaphat, I will disguise myself, and will enter into the battle; but put thou on thy robes. And the king of Israel disguised himself; and they went into the battle.";
web[29] = "And the king of Israel said to Jehoshaphat, I will disguise myself, and will go to the battle; but put thou on thy robes. So the king of Israel disguised himself; and they went to the battle.";
hnv[29] = "The king of Yisra\'el said to Yehoshafat, I will disguise myself, and go into the battle; but put you on your robes. So the king of Yisra\'el disguised himself; and they went into the battle.";
vul[29] = "dixitque rex Israhel ad Iosaphat mutabo habitum et sic ad pugnandum vadam tu autem induere vestibus tuis mutatoque rex Israhel habitu venit ad bellum";
rsv[30] = "Now the king of Syria had commanded the captains of his chariots, &quot;Fight with neither small nor great, but only with the king of Israel.&quot;";
asv[30] = "Now the king of Syria had commanded the captains of his chariots, saying, Fight neither with small nor great, save only with the king of Israel.";
yng[30] = "And the king of Aram hath commanded the heads of the charioteers whom he hath, saying, `Ye do not fight with small or with great, except with the king of Israel by himself.\'";
dby[30] = "And the king of Syria commanded the captains of his chariots saying, Fight neither with small nor great, but with the king of Israel only.";
web[30] = "Now the king of Syria had commanded the captains of the chariots that [were] with him, saying, Fight ye not with small or great, save only with the king of Israel.";
hnv[30] = "Now the king of Aram had commanded the captains of his chariots, saying, Fight neither with small nor great, save only with the king of Yisra\'el.";
vul[30] = "rex autem Syriae praeceperat ducibus equitatus sui dicens ne pugnetis contra minimum aut contra maximum nisi contra solum regem Israhel";
rsv[31] = "And when the captains of the chariots saw Jehosh\'aphat, they said, &quot;It is the king of Israel.&quot; So they turned to fight against him; and Jehosh\'aphat cried out, and the LORD helped him. God drew them away from him,";
asv[31] = "And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, It is the king of Israel. Therefore they turned about to fight against him: but Jehoshaphat cried out, and Jehovah helped him; and God moved them [to depart] from him.";
yng[31] = "And it cometh to pass at the heads of the charioteers seeing Jehoshaphat, that they have said, `The king of Israel he is,\' and they turn round against him to fight, and Jehoshaphat crieth out, and Jehovah hath helped him, and God enticeth them from him,";
dby[31] = "And it came to pass when the captains of the chariots saw Jehoshaphat, that they said, That is the king of Israel; and they surrounded him to fight; and Jehoshaphat cried out, and Jehovah helped him; and God diverted them from him.";
web[31] = "And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, It [is] the king of Israel. Therefore they compassed about him to fight: but Jehoshaphat cried out, and the LORD helped him; and God moved them [to depart] from him.";
hnv[31] = "It happened, when the captains of the chariots saw Yehoshafat, that they said, It is the king of Yisra\'el. Therefore they turned about to fight against him: but Yehoshafat cried out, and the LORD helped him; and God moved them [to depart] from him.";
vul[31] = "itaque cum vidissent principes equitatus Iosaphat dixerunt rex Israhel iste est et circumdederunt eum dimicantes at ille clamavit ad Dominum et auxiliatus est ei atque avertit eos ab illo";
rsv[32] = "for when the captains of the chariots saw that it was not the king of Israel, they turned back from pursuing him.";
asv[32] = "And it came to pass, when the captains of the chariots saw that it was not the king of Israel, that they turned back from pursuing him.";
yng[32] = "yea, it cometh to pass, at the heads of the charioteers seeing that it hath not been the king of Israel -- they turn back from after him.";
dby[32] = "And it came to pass that when the captains of the chariots perceived that it was not the king of Israel, they turned back from pursuing him.";
web[32] = "For it came to pass, that when the captains of the chariots perceived that it was not the king of Israel, they turned back again from pursuing him.";
hnv[32] = "It happened, when the captains of the chariots saw that it was not the king of Yisra\'el, that they turned back from pursuing him.";
vul[32] = "cum enim vidissent duces equitatus quod non esset rex Israhel reliquerunt eum";
rsv[33] = "But a certain man drew his bow at a venture, and struck the king of Israel between the scale armor and the breastplate; therefore he said to the driver of his chariot, &quot;Turn about, and carry me out of the battle, for I am wounded.&quot;";
asv[33] = "And a certain man drew his bow at a venture, and smote the king of Israel between the joints of the armor: wherefore he said to the driver of the chariot, Turn thy hand, and carry me out of the host; for I am sore wounded.";
yng[33] = "And a man hath drawn with a bow, in his simplicity, and smiteth the king of Israel between the joinings and the coat of mail, and he saith to the charioteer, `Turn thy hand, and thou hast brought me out of the camp, for I have become sick.\'";
dby[33] = "And a man drew a bow at a venture, and smote the king of Israel between the fastenings and the corslet. And he said to the charioteer, Turn thy hand and drive me out of the camp; for I am wounded.";
web[33] = "And a [certain] man drew a bow at a venture, and smote the king of Israel between the joints of the harness: therefore he said to his chariot-man, Turn thy hand, that thou mayest carry me out of the host; for I am wounded.";
hnv[33] = "A certain man drew his bow at a venture, and struck the king of Yisra\'el between the joints of the armor. Therefore he said to the driver of the chariot, Turn your hand, and carry me out of the host; for I am sore wounded.";
vul[33] = "accidit autem ut unus e populo sagittam in incertum iaceret et percuteret regem Israhel inter cervicem et scapulas at ille aurigae suo ait converte manum tuam et educ me de acie quia vulneratus sum";
rsv[34] = "And the battle grew hot that day, and the king of Israel propped himself up in his chariot facing the Syrians until evening; then at sunset he died.";
asv[34] = "And the battle increased that day: howbeit the king of Israel stayed himself up in his chariot against the Syrians until the even; and about the time of the going down of the sun he died.";
yng[34] = "And the battle increaseth on that day, and the king of Israel hath been stayed up in the chariot over-against Aram till the evening, and he dieth at the time of the going in of the sun.";
dby[34] = "And the battle increased that day; and the king of Israel stayed himself up in his chariot against the Syrians until the even; and about the time of the going down of the sun he died.";
web[34] = "And the battle increased that day: yet the king of Israel supported [himself] in [his] chariot against the Syrians until the evening: and about the time of the sun setting he died.";
hnv[34] = "The battle increased that day: however the king of Yisra\'el stayed himself up in his chariot against the Aram until the even; and about the time of the going down of the sun he died.";
