csb[1] = "Then Hezekiah sent word throughout all Israel and Judah, and he also wrote letters to Ephraim and Manasseh to come to the LORD\'s temple in Jerusalem to observe the Passover of the LORD, the God of Israel.";
csb[2] = "For the king and his officials and the entire congregation in Jerusalem decided to observe the Passover of the LORD in the second month,";
csb[3] = "because they were not able to observe it at the appropriate time. Not enough of the priests had consecrated themselves, and the people hadn\'t been gathered together in Jerusalem.";
csb[4] = "The proposal pleased the king and the congregation,";
csb[5] = "so they affirmed the proposal and spread the message throughout all Israel, from Beer-sheba to Dan, to come to observe the Passover of the LORD, the God of Israel in Jerusalem, for they hadn\'t observed it often, as prescribed.";
csb[6] = "So the couriers went throughout Israel and Judah with letters from the hand of the king and his officials, and according to the king\'s command, saying, &quot;Israelites, return to the LORD, the God of Abraham, Isaac, and Israel so that he may return to those of you who remain, who have escaped the grasp of the kings of Assyria.";
csb[7] = "&quot;Don\'t be like your fathers and your brothers who were unfaithful to the LORD, the God of their ancestors so that he made them an object of horror as you yourselves see.";
csb[8] = "&quot;Don\'t become obstinate now like your fathers did. Give your allegiance to the LORD, and come to his sanctuary that he has consecrated forever. Serve the LORD your God so that he may turn his burning anger away from you,";
csb[9] = "&quot;for when you return to the LORD, your brothers and your sons will receive mercy in the presence of their captors and will return to this land. For the LORD your God is gracious and merciful; he will not turn his face away from you if you return to him.&quot;";
csb[10] = "The couriers traveled from city to city in the land of Ephraim and Manasseh as far as Zebulun, but the inhabitants laughed at them and mocked them.";
csb[11] = "But some from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.";
csb[12] = "Also, the power of God was at work in Judah to unite them to carry out the command of the king and his officials by the word of the LORD.";
csb[13] = "A very large assembly of people was gathered in Jerusalem to observe the Festival of Unleavened Bread in the second month.";
csb[14] = "They proceeded to take away the altars that were in Jerusalem, and they took away the incense altars and threw them into the Kidron Valley.";
csb[15] = "They slaughtered the Passover lamb on the fourteenth day of the second month. The priests and Levites were ashamed, and they consecrated themselves and brought burnt offerings to the LORD\'s temple.";
csb[16] = "They stood at their prescribed posts, according to the law of Moses, the man of God. The priests splattered the blood received from the Levites,";
csb[17] = "for there were many in the assembly who had not consecrated themselves, and so the Levites were in charge of slaughtering the Passover lambs for every unclean person to consecrate the lambs to the LORD.";
csb[18] = "A large number of the people -- many from Ephraim, Manasseh, Issachar, and Zebulun -- were ritually unclean, yet they had eaten the Passover contrary to what was written. But Hezekiah had interceded for them, saying, &quot;May the good LORD provide atonement on behalf of";
csb[19] = "&quot;whoever sets his whole heart on seeking God, the LORD, the God of his ancestors, even though not according to the purification rules of the sanctuary.&quot;";
csb[20] = "So the LORD heard Hezekiah and healed the people.";
csb[21] = "The Israelites who were present in Jerusalem observed the Festival of Unleavened Bread seven days with great joy, and the Levites and the priests praised the LORD day after day with loud instruments.";
csb[22] = "Then Hezekiah encouraged all the Levites who performed skillfully before the LORD. They ate at the appointed festival for seven days, sacrificing fellowship offerings and giving thanks to the LORD, the God of their ancestors.";
csb[23] = "The whole congregation decided to observe seven more days, so they observed seven days with joy,";
csb[24] = "for King Hezekiah of Judah contributed one thousand bulls and seven thousand sheep for the congregation. Also, the officials contributed one thousand bulls and ten thousand sheep for the congregation, and many priests consecrated themselves.";
csb[25] = "Then the whole assembly of Judah with the priests and Levites, the whole assembly that came from Israel, the resident aliens who came from the land of Israel, and those who were living in Judah, rejoiced.";
csb[26] = "There was great rejoicing in Jerusalem, for nothing like this was known since the days of Solomon son of David, the king of Israel.";
csb[27] = "Then the priests and the Levites stood to bless the people, and God heard them, and their prayer came into his holy dwelling place in heaven.";
kjv[1] = "And Hezekiah sent to all Israel and Judah, and wrote letters also to Ephraim and Manasseh, that they should come to the house of the LORD at Jerusalem, to keep the passover unto the LORD God of Israel.";

rsv[2] = "For the king and his princes and all the assembly in Jerusalem had taken counsel to keep the passover in the second month--";
asv[2] = "For the king had taken counsel, and his princes, and all the assembly in Jerusalem, to keep the passover in the second month.";
yng[2] = "And the king taketh counsel, and his heads, and all the assembly in Jerusalem, to make the passover in the second month,";
dby[2] = "And the king took counsel, and his princes, and the whole congregation in Jerusalem, to hold the passover in the second month.";
web[2] = "For the king had taken counsel, and his princes, and all the congregation in Jerusalem, to keep the passover in the second month.";
hnv[2] = "For the king had taken counsel, and his princes, and all the assembly in Yerushalayim, to keep the Pesach in the second month.";
vul[2] = "inito ergo consilio regis et principum et universi coetus Hierusalem decreverunt ut facerent phase mense secundo";

yng[3] = "for they have not been able to make it at that time, for the priests have not sanctified themselves sufficiently, and the people have not been gathered to Jerusalem.";
dby[3] = "For they could not keep it at that time, because the priests had not hallowed themselves in sufficient number, neither had the people been gathered together to Jerusalem.";
web[3] = "For they could not keep it at that time, because the priests had not sanctified themselves sufficiently, neither had the people assembled themselves at Jerusalem.";
hnv[3] = "For they could not keep it at that time, because the Kohanim had not sanctified themselves in sufficient number, neither had the people gathered themselves together to Yerushalayim.";

yng[5] = "and they establish the thing, to cause to pass over an intimation into all Israel, from Beer-Sheba even unto Dan, to come in to make a passover to Jehovah, God of Israel, in Jerusalem, for not for a long time had they done as it is written.";
dby[5] = "So they established a decree to make proclamation throughout Israel from Beer-sheba even to Dan, that they should come to hold the passover to Jehovah the God of Israel, at Jerusalem; because they had not held it for a long time as it was written.";

hnv[5] = " So they established a decree to make proclamation throughout all Yisra\'el, from Be\'er-Sheva even to Dan, that they should come to keep the Pesach to the LORD, the God of Yisra\'el, at Yerushalayim: for they had not kept it in great numbers in such sort as it is written.";
vul[5] = "et decreverunt ut mitterent nuntios in universum Israhel de Bersabee usque Dan ut venirent et facerent phase Domino Deo Israhel in Hierusalem multi enim non fecerant sicut lege praescriptum est";
kjv[6] = "So the posts went with the letters from the king and his princes throughout all Israel and Judah, and according to the commandment of the king, saying, Ye children of Israel, turn again unto the LORD God of Abraham, Isaac, and Israel, and he will return to the remnant of you, that are escaped out of the hand of the kings of Assyria.";
rsv[6] = "So couriers went throughout all Israel and Judah with letters from the king and his princes, as the king had commanded, saying, &quot;O people of Israel, return to the LORD, the God of Abraham, Isaac, and Israel, that he may turn again to the remnant of you who have escaped from the hand of the kings of Assyria.";
asv[6] = "So the posts went with the letters from the king and his princes throughout all Israel and Judah, and according to the commandment of the king, saying, Ye children of Israel, turn again unto Jehovah, the God of Abraham, Isaac, and Israel, that he may return to the remnant that are escaped of you out of the hand of the kings of Assyria.";
yng[6] = "And the runners go with letters from the hand of the king and his heads, into all Israel and Judah, even according to the command of the king, saying, `O sons of Israel, turn back unto Jehovah, God of Abraham, Isaac, and Israel, and He doth turn back unto the escaped part that is left of you from the hand of the kings of Asshur;";
dby[6] = "And the couriers went with the letters from the king and his princes throughout Israel and Judah, and according to the commandment of the king, saying, Ye children of Israel, return to Jehovah the God of Abraham, Isaac, and Israel, and he will return to the remnant of you that are escaped out of the hand of the kings of Assyria.";
web[6] = "So the posts went with the letters from the king and his princes throughout all Israel and Judah, and according to the commandment of the king, saying, Ye children of Israel, turn again to the LORD God of Abraham, Isaac, and Israel, and he will return to the remnant of you that have escaped from the hand of the kings of Assyria.";
hnv[6] = " So the posts went with the letters from the king and his princes throughout all Yisra\'el and Yehudah, and according to the mitzvah of the king, saying, You children of Yisra\'el, turn again to the LORD, the God of Avraham, Yitzchak, and Yisra\'el, that he may return to the remnant that have escaped of you out of the hand of the kings of Ashshur.";
vul[6] = "perrexeruntque cursores cum epistulis ex regis imperio et principum eius in universum Israhel et Iudam iuxta quod rex iusserat praedicantes filii Israhel revertimini ad Dominum Deum Abraham et Isaac et Israhel et revertetur ad reliquias quae effugerunt manum regis Assyriorum";

hnv[16] = "They stood in their place after their order, according to the law of Moshe the man of God: the Kohanim sprinkled the blood [which they received] of the hand of the Levites.";
vul[16] = "steteruntque in ordine suo iuxta dispositionem et legem Mosi hominis Dei sacerdotes vero suscipiebant effundendum sanguinem de manibus Levitarum";
kjv[17] = "For [there were] many in the congregation that were not sanctified: therefore the Levites had the charge of the killing of the passovers for every one [that was] not clean, to sanctify [them] unto the LORD.";
rsv[17] = "For there were many in the assembly who had not sanctified themselves; therefore the Levites had to kill the passover lamb for every one who was not clean, to make it holy to the LORD.";
asv[17] = "For there were many in the assembly that had not sanctified themselves: therefore the Levites had the charge of killing the passovers for every one that was not clean, to sanctify them unto Jehovah.";
yng[17] = "for many [are] in the assembly who have not sanctified themselves, and the Levites [are] over the slaughtering of the passover-offerings for every one not clean, to sanctify [him] to Jehovah:";
dby[17] = "For there were many in the congregation that were not hallowed; therefore the Levites had the charge of the slaughtering of the passover-lambs for every one not clean, to hallow them unto Jehovah.";
web[17] = "For [there were] many in the congregation that were not sanctified: therefore the Levites had the charge of the killing of the passovers for every one [that was] not clean, to sanctify [them] to the LORD.";
hnv[17] = "For there were many in the assembly who had not sanctified themselves: therefore the Levites had the charge of killing the Pesachim for everyone who was not clean, to sanctify them to the LORD.";
vul[17] = "eo quod multa turba sanctificata non esset et idcirco Levitae immolarent phase his qui non occurrerant sanctificari Domino";
kjv[18] = "For a multitude of the people, [even] many of Ephraim, and Manasseh, Issachar, and Zebulun, had not cleansed themselves, yet did they eat the passover otherwise than it was written. But Hezekiah prayed for them, saying, The good LORD pardon every one";
rsv[18] = "For a multitude of the people, many of them from E\'phraim, Manas\'seh, Is\'sachar, and Zeb\'ulun, had not cleansed themselves, yet they ate the passover otherwise than as prescribed. For Hezeki\'ah had prayed for them, saying, &quot;The good LORD pardon every one";
asv[18] = "For a multitude of the people, even many of Ephraim and Manasseh, Issachar and Zebulun, had not cleansed themselves, yet did they eat the passover otherwise than it is written. For Hezekiah had prayed for them, saying, The good Jehovah pardon every one";
yng[18] = "for a multitude of the people, many from Ephraim and Manasseh, Issachar, and Zebulun, have not been cleansed, but have eaten the passover otherwise than it is written; but Hezekiah prayed for them, saying, `Jehovah, who [is] good, doth receive atonement for every one";
dby[18] = "For a multitude of the people, many of Ephraim and Manasseh, Issachar and Zebulun, had not cleansed themselves, and they ate the passover otherwise than it was written. But Hezekiah prayed for them saying, Jehovah, who is good, forgive every one";
web[18] = "For a multitude of the people, [even] many of Ephraim, and Manasseh, Issachar, and Zebulun, had not cleansed themselves, yet they ate the passover otherwise than it was written. But Hezekiah prayed for them, saying, The good LORD pardon every one,";
hnv[18] = "For a multitude of the people, even many of Efrayim and Menashsheh, Yissakhar and Zevulun, had not cleansed themselves, yet did they eat the Pesach otherwise than it is written. For Hizkiyahu had prayed for them, saying, The good the LORD pardon everyone";
vul[18] = "magna etiam pars populi de Ephraim et Manasse et Isachar et Zabulon quae sanctificata non fuerat comedit phase non iuxta quod scriptum est et oravit pro eis Ezechias dicens Dominus bonus propitiabitur";
kjv[19] = "[That] prepareth his heart to seek God, the LORD God of his fathers, though [he be] not [cleansed] according to the purification of the sanctuary.";
rsv[19] = "who sets his heart to seek God, the LORD the God of his fathers, even though not according to the sanctuary\'s rules of cleanness.&quot;";
asv[19] = "that setteth his heart to seek God, Jehovah, the God of his fathers, though [he be] not [cleansed] according to the purification of the sanctuary.";
yng[19] = "who hath prepared his heart to seek God -- Jehovah, God of his fathers -- yet not according to the cleansing of the sanctuary;\'";
dby[19] = "that has directed his heart to seek God, Jehovah the God of his fathers, although not according to the purification of the sanctuary.";
web[19] = "[That] prepareth his heart to seek God, the LORD God of his fathers, though [he is] not [cleansed] according to the purification of the sanctuary.";
hnv[19] = "who sets his heart to seek God, the LORD, the God of his fathers, though not [cleansed] according to the purification of the sanctuary.";
vul[19] = "cunctis qui in toto corde requirunt Dominum Deum patrum suorum et non inputabit eis quod minus sanctificati sunt";
kjv[20] = "And the LORD hearkened to Hezekiah, and healed the people.";
rsv[20] = "And the LORD heard Hezeki\'ah, and healed the people.";
asv[20] = "And Jehovah hearkened to Hezekiah, and healed the people.";
yng[20] = "and Jehovah hearkeneth unto Hezekiah, and healeth the people.";
dby[20] = "And Jehovah hearkened to Hezekiah, and healed the people.";
web[20] = "And the LORD hearkened to Hezekiah, and healed the people.";
hnv[20] = "The LORD listened to Hizkiyahu, and healed the people.";
vul[20] = "quem exaudivit Dominus et placatus est populo";
kjv[21] = "And the children of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness: and the Levites and the priests praised the LORD day by day, [singing] with loud instruments unto the LORD.";
rsv[21] = "And the people of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness; and the Levites and the priests praised the LORD day by day, singing with all their might to the LORD.";
asv[21] = "And the children of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness; and the Levites and the priests praised Jehovah day by day, [singing] with loud instruments unto Jehovah.";
yng[21] = "And the sons of Israel, those found in Jerusalem, make the feast of unleavened things seven days with great joy; and giving praise to Jehovah day by day are the Levites and the priests, with instruments of praise before Jehovah.";
dby[21] = "And the children of Israel, that were present at Jerusalem, held the feast of unleavened bread seven days with great gladness; and the Levites and the priests praised Jehovah day by day, with the instruments of praise to Jehovah.";
web[21] = "And the children of Israel [that were] present at Jerusalem kept the feast of unleavened bread seven days with great gladness: and the Levites and the priests praised the LORD day by day, [singing] with loud instruments to the LORD.";
hnv[21] = "The children of Yisra\'el who were present at Yerushalayim kept the feast of matzah seven days with great gladness; and the Levites and the Kohanim praised the LORD day by day, [singing] with loud instruments to the LORD.";
vul[21] = "feceruntque filii Israhel qui inventi sunt in Hierusalem sollemnitatem azymorum septem diebus in laetitia magna laudantes Dominum per singulos dies Levitae quoque et sacerdotes per organa quae suo officio congruebant";
kjv[22] = "And Hezekiah spake comfortably unto all the Levites that taught the good knowledge of the LORD: and they did eat throughout the feast seven days, offering peace offerings, and making confession to the LORD God of their fathers.";
rsv[22] = "And Hezeki\'ah spoke encouragingly to all the Levites who showed good skill in the service of the LORD. So the people ate the food of the festival for seven days, sacrificing peace offerings and giving thanks to the LORD the God of their fathers.";
asv[22] = "And Hezekiah spake comfortably unto all the Levites that had good understanding [in the service] of Jehovah. So they did eat throughout the feast for the seven days, offering sacrifices of peace-offerings, and making confession to Jehovah, the God of their fathers.";
yng[22] = "And Hezekiah speaketh unto the heart of all the Levites, those giving good understanding concerning Jehovah, and they eat the appointed thing seven days; sacrificing sacrifices of peace-offerings, and making confession to Jehovah, God of their fathers.";
dby[22] = "And Hezekiah spoke consolingly to all the Levites that had understanding in the good knowledge of Jehovah; and they ate the feast-offerings the seven days, sacrificing peace-offerings, and extolling Jehovah the God of their fathers.";
web[22] = "And Hezekiah spoke comfortably to all the Levites that taught the good knowledge of the LORD: and they ate throughout the feast seven days, offering peace-offerings, and making confession to the LORD God of their fathers.";
hnv[22] = "Hizkiyahu spoke comfortably to all the Levites who had good understanding [in the service] of the LORD. So they ate throughout the feast for the seven days, offering sacrifices of peace-offerings, and making confession to the LORD, the God of their fathers.";
vul[22] = "et locutus est Ezechias ad cor omnium Levitarum qui habebant intellegentiam bonam super Domino et comederunt septem diebus sollemnitatis immolantes victimas pacificorum et laudantes Dominum Deum patrum suorum";
kjv[23] = "And the whole assembly took counsel to keep other seven days: and they kept [other] seven days with gladness.";
rsv[23] = "Then the whole assembly agreed together to keep the feast for another seven days; so they kept it for another seven days with gladness.";
asv[23] = "And the whole assembly took counsel to keep other seven days; and they kept [other] seven days with gladness.";
yng[23] = "And all the assembly take counsel to keep other seven days, and they keep seven days [with] joy;";
dby[23] = "And the whole congregation took counsel to observe other seven days; and they observed the seven days with gladness.";
web[23] = "And the whole assembly took counsel to keep other seven days: and they kept [other] seven days with gladness.";
hnv[23] = "The whole assembly took counsel to keep other seven days; and they kept [other] seven days with gladness.";
vul[23] = "placuitque universae multitudini ut celebrarent etiam alios dies septem quod et fecerunt cum ingenti gaudio";
kjv[24] = "For Hezekiah king of Judah did give to the congregation a thousand bullocks and seven thousand sheep; and the princes gave to the congregation a thousand bullocks and ten thousand sheep: and a great number of priests sanctified themselves.";
rsv[24] = "For Hezeki\'ah king of Judah gave the assembly a thousand bulls and seven thousand sheep for offerings, and the princes gave the assembly a thousand bulls and ten thousand sheep. And the priests sanctified themselves in great numbers.";
asv[24] = "For Hezekiah king of Judah did give to the assembly for offerings a thousand bullocks and seven thousand sheep; and the princes gave to the assembly a thousand bullocks and ten thousand sheep: and a great number of priests sanctified themselves.";
yng[24] = "for Hezekiah king of Judah hath presented to the assembly a thousand bullocks, and seven thousand sheep; and the heads have presented to the assembly bullocks a thousand, and sheep ten thousand; and priests sanctify themselves in abundance.";
dby[24] = "For Hezekiah king of Judah gave to the congregation as heave-offering: a thousand bullocks and seven thousand sheep; and the princes gave to the congregation a thousand bullocks and ten thousand sheep; and a great number of priests hallowed themselves.";
web[24] = "For Hezekiah king of Judah gave to the congregation a thousand bullocks and seven thousand sheep; and the princes gave to the congregation a thousand bullocks and ten thousand sheep: and a great number of priests sanctified themselves.";
hnv[24] = "For Hizkiyahu king of Yehudah did give to the assembly for offerings one thousand bulls and seven thousand sheep; and the princes gave to the assembly a thousand bulls and ten thousand sheep: and a great number of Kohanim sanctified themselves.";
vul[24] = "Ezechias enim rex Iuda praebuerat multitudini mille tauros et septem milia ovium principes vero dederant populo tauros mille et oves decem milia sanctificata ergo est sacerdotum plurima multitudo";
kjv[25] = "And all the congregation of Judah, with the priests and the Levites, and all the congregation that came out of Israel, and the strangers that came out of the land of Israel, and that dwelt in Judah, rejoiced.";
rsv[25] = "The whole assembly of Judah, and the priests and the Levites, and the whole assembly that came out of Israel, and the sojourners who came out of the land of Israel, and the sojourners who dwelt in Judah, rejoiced.";
asv[25] = "And all the assembly of Judah, with the priests and the Levites, and all the assembly that came out of Israel, and the sojourners that came out of the land of Israel, and that dwelt in Judah, rejoiced.";
yng[25] = "And all the assembly of Judah rejoice, and the priests, and the Levites, and all the assembly, those coming in from Israel, and the sojourners, those coming in from the land of Israel, and those dwelling in Judah,";
dby[25] = "And the whole congregation of Judah, with the priests and the Levites, and all the congregation that came out of Israel, and the strangers that came out of the land of Israel, and that dwelt in Judah, rejoiced.";
web[25] = "And all the congregation of Judah, with the priests and the Levites, and all the congregation that came out of Israel, and the strangers that came from the land of Israel, and that dwelt in Judah, rejoiced.";
hnv[25] = "All the assembly of Yehudah, with the Kohanim and the Levites, and all the assembly who came out of Yisra\'el, and the foreigners who came out of Eretz-Yisra\'el, and who lived in Yehudah, rejoiced.";
vul[25] = "et hilaritate perfusa omnis turba Iuda tam sacerdotum et Levitarum quam universae frequentiae quae venerat ex Israhel proselytorum quoque de terra Israhel et habitantium in Iuda";
kjv[26] = "So there was great joy in Jerusalem: for since the time of Solomon the son of David king of Israel [there was] not the like in Jerusalem.";
rsv[26] = "So there was great joy in Jerusalem, for since the time of Solomon the son of David king of Israel there had been nothing like this in Jerusalem.";
asv[26] = "So there was great joy in Jerusalem; for since the time of Solomon the son of David king of Israel there was not the like in Jerusalem.";
yng[26] = "and there is great joy in Jerusalem; for from the days of Solomon son of David king of Israel there is not like this in Jerusalem,";
dby[26] = "And there was great joy in Jerusalem; for since the time of Solomon the son of David, king of Israel, there had not been the like in Jerusalem.";
web[26] = "So there was great joy in Jerusalem: for since the time of Solomon the son of David king of Israel [there was] not the like in Jerusalem.";
hnv[26] = "So there was great joy in Yerushalayim; for since the time of Shlomo the son of David king of Yisra\'el there was not the like in Yerushalayim.";
vul[26] = "factaque est grandis celebritas in Hierusalem qualis a diebus Salomonis filii David regis Israhel in ea urbe non fuerat";
kjv[27] = "Then the priests the Levites arose and blessed the people: and their voice was heard, and their prayer came [up] to his holy dwelling place, [even] unto heaven.";
rsv[27] = "Then the priests and the Levites arose and blessed the people, and their voice was heard, and their prayer came to his holy habitation in heaven.";
asv[27] = "Then the priests the Levites arose and blessed the people: and their voice was heard, and their prayer came up to his holy habitation, even unto heaven.";
yng[27] = "and the priests, the Levites, rise and bless the people, and their voice is heard, and their prayer cometh in to His holy habitation, to the heavens.";
dby[27] = "And the priests the Levites arose and blessed the people; and their voice was heard, and their prayer came up to his holy habitation, to the heavens.";
web[27] = "Then the priests the Levites arose and blessed the people: and their voice was heard, and their prayer ascended to his holy dwelling-place, [even] to heaven.";
hnv[27] = "Then the Kohanim the Levites arose and blessed the people: and their voice was heard, and their prayer came up to his holy habitation, even to heaven.";
vul[27] = "surrexerunt autem sacerdotes atque Levitae benedicentes populo et exaudita est vox eorum pervenitque oratio in habitaculum sanctum caeli";
