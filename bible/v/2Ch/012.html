csb[1] = "When Rehoboam had established his sovereignty and royal power, he abandoned the law of the LORD -- he and all Israel with him.";
csb[2] = "Because they were unfaithful to the LORD, in the fifth year of King Rehoboam, King Shishak of Egypt went to war against Jerusalem";
csb[3] = "with 1,200 chariots, 60,000 cavalrymen, and countless people who came with him from Egypt -- Libyans, Sukkiim, and Cushites.";
csb[4] = "He captured the fortified cities of Judah and came as far as Jerusalem.";
csb[5] = "Then the prophet Shemaiah went to Rehoboam and the leaders of Judah who were gathered at Jerusalem because of Shishak. He said to them: &quot;This is what the LORD says: \'You have abandoned me; therefore, I have abandoned you to Shishak.\' &quot;";
csb[6] = "So the leaders of Israel and the king humbled themselves and said, &quot;The LORD is righteous.&quot;";
csb[7] = "When the LORD saw that they had humbled themselves, the LORD\'s message came to Shemaiah: &quot;They have humbled themselves; I will not destroy them but will grant them a little deliverance. My wrath will not be poured out on Jerusalem through Shishak.";
csb[8] = "&quot;However, they will become his servants so that they may recognize the difference between serving me and serving the kingdoms of other lands.&quot;";
csb[9] = "So King Shishak of Egypt went to war against Jerusalem. He seized the treasuries of the LORD\'s temple and the treasuries of the royal palace. He took everything. He took the gold shields that Solomon had made.";
csb[10] = "King Rehoboam made bronze shields to replace them and committed them into the care of the captains of the guards who protected the entrance to the king\'s palace.";
csb[11] = "Whenever the king entered the LORD\'s temple, the guards would carry the shields and take them back to the armory.";
csb[12] = "When Rehoboam humbled himself, the LORD\'s anger turned away from him, and he did not destroy him completely. Besides that, conditions were good in Judah.";
csb[13] = "King Rehoboam established his royal power in Jerusalem. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city the LORD had chosen from all the tribes of Israel to put his name. Rehoboam\'s mother\'s name was Naamah the Ammonite.";
csb[14] = "Rehoboam did what was evil, because he did not determine in his heart to seek the LORD.";
csb[15] = "The events of Rehoboam\'s reign, from beginning to end, are written in the Events of the Prophet Shemaiah and of the Seer Iddo concerning genealogies. There was war between Rehoboam and Jeroboam throughout their reigns.";
csb[16] = "Rehoboam rested with his fathers and was buried in the city of David. His son Abijah became king in his place.";
kjv[1] = "And it came to pass, when Rehoboam had established the kingdom, and had strengthened himself, he forsook the law of the LORD, and all Israel with him.";
rsv[1] = "When the rule of Rehobo\'am was established and was strong, he forsook the law of the LORD, and all Israel with him.";
asv[1] = "And it came to pass, when the kingdom of Rehoboam was established, and he was strong, that he forsook the law of Jehovah, and all Israel with him.";
yng[1] = "And it cometh to pass, at the establishing of the kingdom of Rehoboam, and at his strengthening himself, he hath forsaken the law of Jehovah, and all Israel with him.";
dby[1] = "And it came to pass when the kingdom of Rehoboam was established, and when he had become strong, [that] he forsook the law of Jehovah, and all Israel with him.";
web[1] = "And it came to pass, when Rehoboam had established the kingdom, and had strengthened himself, he forsook the law of the LORD, and all Israel with him.";
hnv[1] = "It happened, when the kingdom of Rechav`am was established, and he was strong, that he forsook the law of the LORD, and all Yisra\'el with him.";
vul[1] = "cumque roboratum fuisset regnum Roboam et confortatum dereliquit legem Domini et omnis Israhel cum eo";
kjv[2] = "And it came to pass, [that] in the fifth year of king Rehoboam Shishak king of Egypt came up against Jerusalem, because they had transgressed against the LORD,";
rsv[2] = "In the fifth year of King Rehobo\'am, because they had been unfaithful to the LORD, Shishak king of Egypt came up against Jerusalem";
asv[2] = "And it came to pass in the fifth year of king Rehoboam, that Shishak king of Egypt came up against Jerusalem, because they had trespassed against Jehovah,";
yng[2] = "And it cometh to pass, in the fifth year of king Rehoboam, come up hath Shishak king of Egypt against Jerusalem -- because they trespassed against Jehovah --";
dby[2] = "And it came to pass in the fifth year of king Rehoboam, because they had transgressed against Jehovah, that Shishak king of Egypt came up against Jerusalem,";
web[2] = "And it came to pass, [that] in the fifth year of king Rehoboam, Shishak king of Egypt came up against Jerusalem, because they had transgressed against the LORD,";
hnv[2] = "It happened in the fifth year of king Rechav`am, that Shishak king of Mitzrayim came up against Yerushalayim, because they had trespassed against the LORD,";
vul[2] = "anno autem quinto regni Roboam ascendit Sesac rex Aegypti in Hierusalem quia peccaverunt Domino";
kjv[3] = "With twelve hundred chariots, and threescore thousand horsemen: and the people [were] without number that came with him out of Egypt; the Lubims, the Sukkiims, and the Ethiopians.";
rsv[3] = "with twelve hundred chariots and sixty thousand horsemen. And the people were without number who came with him from Egypt--Libyans, Suk\'ki-im, and Ethiopians.";
asv[3] = "with twelve hundred chariots, and threescore thousand horsemen. And the people were without number that came with him out of Egypt: the Lubim, the Sukkiim, and the Ethiopians.";
yng[3] = "with a thousand and two hundred chariots, and with sixty thousand horsemen, and there is no number to the people who have come with him out of Egypt -- Lubim, Sukkiim, and Cushim --";
dby[3] = "with twelve hundred chariots and sixty thousand horsemen; and the people were without number that came with him out of Egypt: Libyans, Sukkites, and Ethiopians.";
web[3] = "With twelve hundred chariots, and sixty thousand horsemen: and the people [were] without number that came with him out of Egypt; the Lubims, the Sukkiims, and the Cushites.";
hnv[3] = "with twelve hundred chariots, and sixty thousand horsemen. The people were without number who came with him out of Mitzrayim: the Luvim, the Sukkiyim, and the Kushim.";
vul[3] = "cum mille ducentis curribus et sexaginta milibus equitum nec erat numerus vulgi quod venerat cum eo ex Aegypto Lybies scilicet et Trogoditae et Aethiopes";
kjv[4] = "And he took the fenced cities which [pertained] to Judah, and came to Jerusalem.";
rsv[4] = "And he took the fortified cities of Judah and came as far as Jerusalem.";
asv[4] = "And he took the fortified cities which pertained to Judah, and came unto Jerusalem.";
yng[4] = "and he captureth the cities of the bulwarks that [are] to Judah, and cometh in unto Jerusalem.";
dby[4] = "And he took the fortified cities that belonged to Judah, and came to Jerusalem.";
web[4] = "And he took the fortified cities which [pertained] to Judah, and came to Jerusalem.";
hnv[4] = "He took the fortified cities which pertained to Yehudah, and came to Yerushalayim.";
vul[4] = "cepitque civitates munitissimas in Iuda et venit usque Hierusalem";
kjv[5] = "Then came Shemaiah the prophet to Rehoboam, and [to] the princes of Judah, that were gathered together to Jerusalem because of Shishak, and said unto them, Thus saith the LORD, Ye have forsaken me, and therefore have I also left you in the hand of Shishak.";
rsv[5] = "Then Shemai\'ah the prophet came to Rehobo\'am and to the princes of Judah, who had gathered at Jerusalem because of Shishak, and said to them, &quot;Thus says the LORD, \'You abandoned me, so I have abandoned you to the hand of Shishak.\'&quot;";
asv[5] = "Now Shemaiah the prophet came to Rehoboam, and to the princes of Judah, that were gathered together to Jerusalem because of Shishak, and said unto them, Thus saith Jehovah, Ye have forsaken me, therefore have I also left you in the hand of Shishak.";
yng[5] = "And Shemaiah the prophet hath come in unto Rehoboam and the heads of Judah who have been gathered unto Jerusalem from the presence of Shishak, and saith to them, `Thus said Jehovah, Ye have forsaken Me, and also, I have left you in the hand of Shishak;\'";
dby[5] = "And Shemaiah the prophet came to Rehoboam and [to] the princes of Judah that had gathered together to Jerusalem because of Shishak, and said to them, Thus saith Jehovah: Ye have forsaken me, and therefore have I also left you in the hand of Shishak.";
web[5] = "Then came Shemaiah the prophet to Rehoboam, and [to] the princes of Judah, that were assembled at Jerusalem because of Shishak, and said to them, Thus saith the LORD, Ye have forsaken me, and therefore have I also left you in the hand of Shishak.";
hnv[5] = "Now Shemayah the prophet came to Rechav`am, and to the princes of Yehudah, who were gathered together to Yerushalayim because of Shishak, and said to them, Thus says the LORD, You have forsaken me, therefore have I also left you in the hand of Shishak.";
vul[5] = "Semeias autem propheta ingressus est ad Roboam et principes Iuda qui congregati fuerant in Hierusalem fugientes Sesac dixitque ad eos haec dicit Dominus vos reliquistis me et ego reliqui vos in manu Sesac";
kjv[6] = "Whereupon the princes of Israel and the king humbled themselves; and they said, The LORD [is] righteous.";
rsv[6] = "Then the princes of Israel and the king humbled themselves and said, &quot;The LORD is righteous.&quot;";
asv[6] = "Then the princes of Israel and the king humbled themselves; and they said, Jehovah is righteous.";
yng[6] = "and the heads of Israel are humbled, and the king, and they say, `Righteous [is] Jehovah.\'";
dby[6] = "And the princes of Israel and the king humbled themselves; and they said, Jehovah is righteous.";
web[6] = "Upon which the princes of Israel, and the king humbled themselves; and they said, The LORD [is] righteous.";
hnv[6] = "Then the princes of Yisra\'el and the king humbled themselves; and they said, the LORD is righteous.";
vul[6] = "consternatique principes Israhel et rex dixerunt iustus est Dominus";
kjv[7] = "And when the LORD saw that they humbled themselves, the word of the LORD came to Shemaiah, saying, They have humbled themselves; [therefore] I will not destroy them, but I will grant them some deliverance; and my wrath shall not be poured out upon Jerusalem by the hand of Shishak.";
rsv[7] = "When the LORD saw that they humbled themselves, the word of the LORD came to Shemai\'ah: &quot;They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath shall not be poured out upon Jerusalem by the hand of Shishak.";
asv[7] = "And when Jehovah saw that they humbled themselves, the word of Jehovah came to Shemaiah, saying, They have humbled themselves: I will not destroy them; but I will grant them some deliverance, and my wrath shall not be poured out upon Jerusalem by the hand of Shishak.";
yng[7] = "And when Jehovah seeth that they have been humbled, a word of Jehovah hath been unto Shemaiah, saying, `They have been humbled; I do not destroy them, and I have given to them as a little thing for an escape, and I pour not out My fury in Jerusalem by the hand of Shishak;";
dby[7] = "And when Jehovah saw that they humbled themselves, the word of Jehovah came to Shemaiah, saying, They have humbled themselves: I will not destroy them, but I will grant them a little deliverance; and my wrath shall not be poured out upon Jerusalem by the hand of Shishak.";
web[7] = "And when the LORD saw that they humbled themselves, the word of the LORD came to Shemaiah, saying, They have humbled themselves; [therefore] I will not destroy them, but I will grant them some deliverance; and my wrath shall not be poured out upon Jerusalem by the hand of Shishak.";
hnv[7] = "When the LORD saw that they humbled themselves, the word of the LORD came to Shemayah, saying, They have humbled themselves: I will not destroy them; but I will grant them some deliverance, and my wrath shall not be poured out on Yerushalayim by the hand of Shishak.";
vul[7] = "cumque vidisset Dominus quod humiliati essent factus est sermo Domini ad Semeiam dicens quia humiliati sunt non disperdam eos daboque eis pauxillum auxilii et non stillabit furor meus super Hierusalem per manum Sesac";
kjv[8] = "Nevertheless they shall be his servants; that they may know my service, and the service of the kingdoms of the countries.";
rsv[8] = "Nevertheless they shall be servants to him, that they may know my service and the service of the kingdoms of the countries.&quot;";
asv[8] = "Nevertheless they shall be his servants, that they may know my service, and the service of the kingdoms of the countries.";
yng[8] = "but they become servants to him, and they know My service, and the service of the kingdoms of the lands.\'";
dby[8] = "Nevertheless they shall be his servants; that they may know my service, and the service of the kingdoms of the countries.";
web[8] = "Nevertheless they shall be his servants; that they may know my service, and the service of the kingdoms of the countries.";
hnv[8] = "Nevertheless they shall be his servants, that they may know my service, and the service of the kingdoms of the countries.";
vul[8] = "verumtamen servient ei ut sciant distantiam servitutis meae et servitutis regni terrarum";
kjv[9] = "So Shishak king of Egypt came up against Jerusalem, and took away the treasures of the house of the LORD, and the treasures of the king\'s house; he took all: he carried away also the shields of gold which Solomon had made.";
rsv[9] = "So Shishak king of Egypt came up against Jerusalem; he took away the treasures of the house of the LORD and the treasures of the king\'s house; he took away everything. He also took away the shields of gold which Solomon had made;";
asv[9] = "So Shishak king of Egypt came up against Jerusalem, and took away the treasures of the house of Jehovah, and the treasures of the king\'s house: he took all away: he took away also the shields of gold which Solomon had made.";
yng[9] = "And Shishak king of Egypt cometh up against Jerusalem, and taketh the treasures of the house of Jehovah, and the treasures of the house of the king -- the whole he hath taken -- and he taketh the shields of gold that Solomon had made;";
dby[9] = "And Shishak king of Egypt came up against Jerusalem, and took away the treasures of the house of Jehovah, and the treasures of the king\'s house; he took away all; and he took away the shields of gold that Solomon had made.";
web[9] = "So Shishak king of Egypt came up against Jerusalem, and took away the treasures of the house of the LORD, and the treasures of the king\'s house; he took all: he carried away also the shields of gold which Solomon had made.";
hnv[9] = "So Shishak king of Mitzrayim came up against Yerushalayim, and took away the treasures of the house of the LORD, and the treasures of the king\'s house: he took all away: he took away also the shields of gold which Shlomo had made.";
vul[9] = "recessit itaque Sesac rex Aegypti ab Hierusalem sublatis thesauris domus Domini et domus regis omniaque secum tulit et clypeos aureos quos fecerat Salomon";
kjv[10] = "Instead of which king Rehoboam made shields of brass, and committed [them] to the hands of the chief of the guard, that kept the entrance of the king\'s house.";
rsv[10] = "and King Rehobo\'am made in their stead shields of bronze, and committed them to the hands of the officers of the guard, who kept the door of the king\'s house.";
asv[10] = "And king Rehoboam made in their stead shields of brass, and committed them to the hands of the captains of the guard, that kept the door of the king\'s house.";
yng[10] = "and king Rehoboam maketh in their stead shields of brass, and hath given [them] a charge on the hand of the heads of the runners who are keeping the opening of the house of the king;";
dby[10] = "And king Rehoboam made in their stead shields of bronze, and committed them to the hands of the chief of the couriers who kept the entrance of the king\'s house.";
web[10] = "Instead of which, king Rehoboam made shields of brass, and committed [them] to the hands of the chief of the guard, that kept the entrance of the king\'s house.";
hnv[10] = "King Rechav`am made in their place shields of brass, and committed them to the hands of the captains of the guard, who kept the door of the king\'s house.";
vul[10] = "pro quibus fecit rex aeneos et tradidit illos principibus scutariorum qui custodiebant vestibulum palatii";
kjv[11] = "And when the king entered into the house of the LORD, the guard came and fetched them, and brought them again into the guard chamber.";
rsv[11] = "And as often as the king went into the house of the LORD, the guard came and bore them, and brought them back to the guardroom.";
asv[11] = "And it was so, that, as oft as the king entered into the house of Jehovah, the guard came and bare them, and brought them back into the guard-chamber.";
yng[11] = "and it cometh to pass, from the time of the going in of the king to the house of Jehovah, the runners have come in and lifted them up, and brought them back unto the chamber of the runners.";
dby[11] = "And it was so, that as often as the king entered into the house of Jehovah, the couriers came and fetched them, and brought them again into the chamber of the couriers.";
web[11] = "And when the king entered into the house of the LORD, the guard came and conveyed them, and brought them again into the guard-chamber.";
hnv[11] = "It was so, that as often as the king entered into the house of the LORD, the guard came and bore them, and brought them back into the guard-chamber.";
vul[11] = "cumque introiret rex domum Domini veniebant scutarii et tollebant eos iterumque referebant ad armamentarium suum";
kjv[12] = "And when he humbled himself, the wrath of the LORD turned from him, that he would not destroy [him] altogether: and also in Judah things went well.";
rsv[12] = "And when he humbled himself the wrath of the LORD turned from him, so as not to make a complete destruction; moreover, conditions were good in Judah.";
asv[12] = "And when he humbled himself, the wrath of Jehovah turned from him, so as not to destroy him altogether: and moreover in Judah there were good things [found].";
yng[12] = "And in his being humbled, turned back from him hath the wrath of Jehovah, so as not to destroy to completion; and also, in Judah there have been good things.";
dby[12] = "And when he humbled himself, the anger of Jehovah turned away from him, that he would not destroy him altogether; and also in Judah there were good things.";
web[12] = "And when he humbled himself, the wrath of the LORD turned from him, that he would not destroy [him] altogether: and also in Judah things went well.";
hnv[12] = "When he humbled himself, the wrath of the LORD turned from him, so as not to destroy him altogether: and moreover in Yehudah there were good things [found].";
vul[12] = "verumtamen quia humiliati sunt aversa est ab eis ira Domini nec deleti sunt penitus siquidem et in Iuda inventa sunt opera bona";
kjv[13] = "So king Rehoboam strengthened himself in Jerusalem, and reigned: for Rehoboam [was] one and forty years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which the LORD had chosen out of all the tribes of Israel, to put his name there. And his mother\'s name [was] Naamah an Ammonitess.";
rsv[13] = "So King Rehobo\'am established himself in Jerusalem and reigned. Rehobo\'am was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which the LORD had chosen out of all the tribes of Israel to put his name there. His mother\'s name was Na\'amah the Ammonitess.";
asv[13] = "So king Rehoboam strengthened himself in Jerusalem, and reigned: for Rehoboam was forty and one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which Jehovah had chosen out of all the tribes of Israel, to put his name there: and his mother\'s name was Naamah the Ammonitess.";
yng[13] = "And king Rehoboam strengtheneth himself in Jerusalem, and reigneth; for a son of forty and two years [is] Rehoboam in his reigning, and seventeen years he hath reigned in Jerusalem, the city that Jehovah hath chosen to put His name there, out of all the tribes of Israel, and the name of his mother [is] Naamah the Ammonitess,";
dby[13] = "And king Rehoboam strengthened himself in Jerusalem, and reigned; for Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Jehovah had chosen out of all the tribes of Israel, to put his name there: and his mother\'s name was Naamah an Ammonitess.";
web[13] = "So king Rehoboam strengthened himself in Jerusalem, and reigned: for Rehoboam [was] one and forty years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which the LORD had chosen out of all the tribes of Israel, to put his name there. And his mother\'s name [was] Naamah an Ammonitess.";
hnv[13] = "So king Rechav`am strengthened himself in Yerushalayim, and reigned: for Rechav`am was forty-one years old when he began to reign, and he reigned seventeen years in Yerushalayim, the city which the LORD had chosen out of all the tribes of Yisra\'el, to put his name there: and his mother\'s name was Na`amah the `Ammonite.";
vul[13] = "confortatus est igitur rex Roboam in Hierusalem atque regnavit quadraginta autem et unius anni erat cum regnare coepisset et decem septemque annis regnavit in Hierusalem urbe quam elegit Dominus ut confirmaret nomen suum ibi de cunctis tribubus Israhel nomenque matris eius Naama Ammanitis";
kjv[14] = "And he did evil, because he prepared not his heart to seek the LORD.";
rsv[14] = "And he did evil, for he did not set his heart to seek the LORD.";
asv[14] = "And he did that which was evil, because he set not his heart to seek Jehovah.";
yng[14] = "and he doth the evil thing, for he hath not prepared his heart to seek Jehovah.";
dby[14] = "And he did evil, for he applied not his heart to seek Jehovah.";
web[14] = "And he did evil, because he prepared not his heart to seek the LORD.";
hnv[14] = "He did that which was evil, because he didn\'t set his heart to seek the LORD.";
vul[14] = "fecit autem malum et non praeparavit cor suum ut quaereret Dominum";
kjv[15] = "Now the acts of Rehoboam, first and last, [are] they not written in the book of Shemaiah the prophet, and of Iddo the seer concerning genealogies? And [there were] wars between Rehoboam and Jeroboam continually.";
rsv[15] = "Now the acts of Rehobo\'am, from first to last, are they not written in the chronicles of Shemai\'ah the prophet and of Iddo the seer? There were continual wars between Rehobo\'am and Jerobo\'am.";
asv[15] = "Now the acts of Rehoboam, first and last, are they not written in the histories of Shemaiah the prophet and of Iddo the seer, after the manner of genealogies? And there were wars between Rehoboam and Jeroboam continually.";
yng[15] = "And the matters of Rehoboam, the first and the last, are they not written among the matters of Shemaiah the prophet, and of Iddo the seer, concerning genealogy? And the wars of Rehoboam and Jeroboam [are] all the days;";
dby[15] = "And the acts of Rehoboam, first and last, are they not written in the words of Shemaiah the prophet, and of Iddo the seer, in the genealogical registers? And there were wars between Rehoboam and Jeroboam continually.";
web[15] = "Now the acts of Rehoboam, first and last, [are] they not written in the book of Shemaiah the prophet, and of Iddo the seer, concerning genealogies? And [there were] wars between Rehoboam and Jeroboam continually.";
hnv[15] = "Now the acts of Rechav`am, first and last, aren\'t they written in the histories of Shemayah the prophet and of `Iddo the seer, after the manner of genealogies? There were wars between Rechav`am and Yarov`am continually.";
vul[15] = "opera vero Roboam prima et novissima scripta sunt in libris Semeiae prophetae et Addo videntis et diligenter exposita pugnaveruntque adversum se Roboam et Hieroboam cunctis diebus";
kjv[16] = "And Rehoboam slept with his fathers, and was buried in the city of David: and Abijah his son reigned in his stead.";
rsv[16] = "And Rehobo\'am slept with his fathers, and was buried in the city of David; and Abi\'jah his son reigned in his stead.";
asv[16] = "And Rehoboam slept with his fathers, and was buried in the city of David: and Abijah his son reigned in his stead.";
yng[16] = "and Rehoboam lieth with his fathers, and is buried in the city of David, and reign doth Abijah his son in his stead.";
dby[16] = "And Rehoboam slept with his fathers, and was buried in the city of David. And Abijah his son reigned in his stead.";
web[16] = "And Rehoboam slept with his fathers, and was buried in the city of David: and Abijah his son reigned in his stead.";
hnv[16] = "Rechav`am slept with his fathers, and was buried in the city of David: and Aviyah his son reigned in his place.";
vul[16] = "et dormivit Roboam cum patribus suis sepultusque est in civitate David et regnavit Abia filius eius pro eo";
