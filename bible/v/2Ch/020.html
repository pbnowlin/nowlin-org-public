csb[1] = "After this, the Moabites and Ammonites, together with some of the Meunites, came to fight against Jehoshaphat.";
csb[2] = "People came and told Jehoshaphat, &quot;A vast number from beyond the Dead Sea and from Edom has come to fight against you; they are already in Hazazon-tamar&quot; (that is, En-gedi).";
csb[3] = "Jehoshaphat was afraid, and he resolved to seek the LORD. Then he proclaimed a fast for all Judah,";
csb[4] = "who gathered to seek the LORD. They even came from all the cities of Judah to seek him.";
csb[5] = "Then Jehoshaphat stood in the assembly of Judah and Jerusalem in the LORD\'s temple before the new courtyard.";
csb[6] = "He said: LORD, God of our ancestors, are you not the God who is in heaven, and do you not rule over all the kingdoms of the nations? Power and might are in your hand, and no one can stand against you.";
csb[7] = "Are you not our God who drove out the inhabitants of this land before your people Israel and who gave it forever to the descendants of Abraham your friend?";
csb[8] = "They have lived in the land and have built you a sanctuary in it for your name and have said,";
csb[9] = "&quot;If disaster comes on us -- sword or judgment, pestilence or famine -- we will stand before this temple and before you, for your name is in this temple. We will cry out to you because of our distress, and you will hear and deliver.&quot;";
csb[10] = "Now here are the Ammonites, Moabites, and the inhabitants of Mount Seir. You did not let Israel invade them when Israel came out of the land of Egypt, but Israel turned away from them and did not destroy them.";
csb[11] = "Look how they repay us by coming to drive us out of your possession that you gave us as an inheritance.";
csb[12] = "Our God, will you not judge them? For we are powerless before this vast number that comes to fight against us. We do not know what to do, but we look to you.";
csb[13] = "All Judah was standing before the LORD with their dependents, their wives, and their children.";
csb[14] = "In the middle of the congregation, the Spirit of the LORD came on Jahaziel (son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, a Levite from Asaph\'s descendants),";
csb[15] = "and he said, &quot;Listen carefully, all Judah and you inhabitants of Jerusalem, and King Jehoshaphat. This is what the LORD says: \'Do not be afraid or discouraged because of this vast number, for the battle is not yours, but God\'s.";
csb[16] = "&quot;Tomorrow, go down against them. You will see them coming up the Ascent of Ziz, and you will find them at the end of the valley facing the Wilderness of Jeruel.";
csb[17] = "&quot;You do not have to fight this battle. Position yourselves, stand still, and see the salvation of the LORD. He is with you, Judah and Jerusalem. Do not be afraid or discouraged. Tomorrow, go out to face them, for the LORD is with you.\' &quot;";
csb[18] = "Then Jehoshaphat knelt low with his face to the ground, and all Judah and the inhabitants of Jerusalem fell down before the LORD to worship him.";
csb[19] = "Then the Levites from the sons of the Kohathites and the Korahites stood up to praise the LORD God of Israel shouting loudly.";
csb[20] = "In the morning they got up early and went out to the wilderness of Tekoa. As they were about to go out, Jehoshaphat stood and said, &quot;Hear me, Judah and you inhabitants of Jerusalem. Believe in the LORD your God, and you will be established; believe in his prophets, and you will succeed.&quot;";
csb[21] = "Then he consulted with the people and appointed some to sing for the LORD and some to praise the splendor of his holiness. When they went out in front of the armed forces, they kept singing: Give thanks to the LORD, for his faithful love endures forever.";
csb[22] = "The moment they began their shouts and praises, the LORD set an ambush against the Ammonites, Moabites, and the inhabitants of Mount Seir who came to fight against Judah, and they were defeated.";
csb[23] = "The Ammonites and Moabites turned against the inhabitants of Mount Seir and completely annihilated them. When they had finished with the inhabitants of Seir, they helped destroy each other.";
csb[24] = "When Judah came to a place overlooking the wilderness, they looked for the large army, but there were only corpses lying on the ground; nobody had escaped.";
csb[25] = "Then Jehoshaphat and his people went to gather the plunder. They found among them an abundance of goods on the bodies and valuable items. So they stripped them until nobody could carry any more. They were gathering the plunder for three days because there was so much.";
csb[26] = "They assembled in the Valley of Beracah on the fourth day, for there they blessed the LORD. Therefore, that place is still called the Valley of Beracah today.";
csb[27] = "Then all the men of Judah and Jerusalem turned back with Jehoshaphat their leader, returning joyfully to Jerusalem, for the LORD enabled them to rejoice over their enemies.";
csb[28] = "So they came into Jerusalem to the LORD\'s temple with harps, lyres, and trumpets.";
csb[29] = "The terror of God was on all the kingdoms of the lands when they heard that the LORD had fought against the enemies of Israel.";
csb[30] = "Then Jehoshaphat\'s kingdom was quiet, for his God gave him rest on every side.";
csb[31] = "Jehoshaphat became king over Judah. He was thirty-five years old when he became king, and he reigned twenty-five years in Jerusalem. His mother\'s name was Azubah daughter of Shilhi.";
csb[32] = "He walked in the ways of Asa his father; he did not turn away from it but did what was right in the LORD\'s sight.";
csb[33] = "However, the high places were not taken away; the people had not yet set their hearts on the God of their ancestors.";
csb[34] = "The rest of the events of Jehoshaphat\'s reign from beginning to end are written in the Events of Jehu son of Hanani, which is recorded in the Book of Israel\'s Kings.";
csb[35] = "After this, Judah\'s King Jehoshaphat made an alliance with Israel\'s King Ahaziah, who was guilty of wrongdoing.";
csb[36] = "Jehoshaphat formed an alliance with him to make ships to go to Tarshish, and they made the ships in Ezion-geber.";
csb[37] = "Then Eliezer son of Dodavahu of Mareshah prophesied against Jehoshaphat, saying, &quot;Because you formed an alliance with Ahaziah, the LORD has broken up what you have made.&quot; So the ships were wrecked and were not able to go to Tarshish.";
kjv[1] = "It came to pass after this also, [that] the children of Moab, and the children of Ammon, and with them [other] beside the Ammonites, came against Jehoshaphat to battle.";
rsv[1] = "After this the Moabites and Ammonites, and with them some of the Me-u\'nites, came against Jehosh\'aphat for battle.";
asv[1] = "And it came to pass after this, that the children of Moab, and the children of Ammon, and with them some of the Ammonites, came against Jehoshaphat to battle.";
yng[1] = "And it cometh to pass after this, the sons of Moab have come in, and the sons of Ammon, and with them of the peoples, against Jehoshaphat to battle.";
dby[1] = "And it came to pass after this [that] the children of Moab, and the children of Ammon, and with them certain of the Maonites, came against Jehoshaphat to battle.";
web[1] = "It came to pass after this also, [that] the children of Moab, and the children of Ammon, and with them [others] besides the Ammonites, came against Jehoshaphat to battle.";
hnv[1] = "It happened after this, that the children of Mo\'av, and the children of `Ammon, and with them some of the Me`unim, came against Yehoshafat to battle.";
vul[1] = "post haec congregati sunt filii Moab et filii Ammon et cum eis de Ammanitis ad Iosaphat ut pugnarent contra eum";
kjv[2] = "Then there came some that told Jehoshaphat, saying, There cometh a great multitude against thee from beyond the sea on this side Syria; and, behold, they [be] in Hazazontamar, which [is] Engedi.";
rsv[2] = "Some men came and told Jehosh\'aphat, &quot;A great multitude is coming against you from Edom, from beyond the sea; and, behold, they are in Haz\'azon-ta\'mar&quot; (that is, En-ge\'di).";
asv[2] = "Then there came some that told Jehoshaphat, saying, There cometh a great multitude against thee from beyond the sea from Syria; and, behold, they are in Hazazon-tamar (the same is En-gedi).";
yng[2] = "And they come in and declare to Jehoshaphat, saying, `Come against thee hath a great multitude from beyond the sea, from Aram, and lo, they [are] in Hazezon-Tamar -- it [is] En-Gedi.\'";
dby[2] = "And they came and told Jehoshaphat saying, A great multitude is come against thee from beyond the sea, from Syria; and behold, they are in Hazazon-tamar, which is Engedi.";
web[2] = "Then there came some that told Jehoshaphat, saying, There cometh a great multitude against thee from beyond the sea on this side of Syria; and behold, they [are] in Hazazon-tamar, which [is] En-gedi.";
hnv[2] = "Then there came some who told Yehoshafat, saying, There comes a great multitude against you from beyond the sea from Aram; and, behold, they are in Hatzatzon-Tamar (the same is `En-Gedi).";
vul[2] = "veneruntque nuntii et indicaverunt Iosaphat dicentes venit contra te multitudo magna de his locis quae trans mare sunt et de Syria et ecce consistunt in Asasonthamar quae est Engaddi";
kjv[3] = "And Jehoshaphat feared, and set himself to seek the LORD, and proclaimed a fast throughout all Judah.";
rsv[3] = "Then Jehosh\'aphat feared, and set himself to seek the LORD, and proclaimed a fast throughout all Judah.";
asv[3] = "And Jehoshaphat feared, and set himself to seek unto Jehovah; and he proclaimed a fast throughout all Judah.";
yng[3] = "And Jehoshaphat feareth, and setteth his face to seek to Jehovah, and proclaimeth a fast over all Judah;";
dby[3] = "And Jehoshaphat feared, and set himself to seek Jehovah, and proclaimed a fast throughout Judah.";
web[3] = "And Jehoshaphat feared, and set himself to seek the LORD, and proclaimed a fast throughout all Judah.";
hnv[3] = "Yehoshafat feared, and set himself to seek to the LORD; and he proclaimed a fast throughout all Yehudah.";
vul[3] = "Iosaphat autem timore perterritus totum se contulit ad rogandum Dominum et praedicavit ieiunium universo Iuda";
kjv[4] = "And Judah gathered themselves together, to ask [help] of the LORD: even out of all the cities of Judah they came to seek the LORD.";
rsv[4] = "And Judah assembled to seek help from the LORD; from all the cities of Judah they came to seek the LORD.";
asv[4] = "And Judah gathered themselves together, to seek [help] of Jehovah: even out of all the cities of Judah they came to seek Jehovah.";
yng[4] = "and Judah is gathered to inquire of Jehovah; also, from all the cities of Judah they have come in to seek Jehovah.";
dby[4] = "And Judah gathered themselves together to ask [help] of Jehovah: even out of all the cities of Judah they came to seek Jehovah.";
web[4] = "And Judah assembled, to ask [help] of the LORD: even from all the cities of Judah they came to seek the LORD.";
hnv[4] = "Yehudah gathered themselves together, to seek [help] of the LORD: even out of all the cities of Yehudah they came to seek the LORD.";
vul[4] = "congregatusque Iudas ad precandum Dominum sed et omnes de urbibus suis venerunt ad obsecrandum eum";
kjv[5] = "And Jehoshaphat stood in the congregation of Judah and Jerusalem, in the house of the LORD, before the new court,";
rsv[5] = "And Jehosh\'aphat stood in the assembly of Judah and Jerusalem, in the house of the LORD, before the new court,";
asv[5] = "And Jehoshaphat stood in the assembly of Judah and Jerusalem, in the house of Jehovah, before the new court;";
yng[5] = "And Jehoshaphat standeth in the assembly of Judah and Jerusalem, in the house of Jehovah, at the front of the new court,";
dby[5] = "And Jehoshaphat stood in the congregation of Judah and Jerusalem, in the house of Jehovah, before the new court;";
web[5] = "And Jehoshaphat stood in the congregation of Judah and Jerusalem, in the house of the LORD, before the new court,";
hnv[5] = "Yehoshafat stood in the assembly of Yehudah and Yerushalayim, in the house of the LORD, before the new court;";
vul[5] = "cumque stetisset Iosaphat in medio coetu Iudae et Hierusalem in domo Domini ante atrium novum";
kjv[6] = "And said, O LORD God of our fathers, [art] not thou God in heaven? and rulest [not] thou over all the kingdoms of the heathen? and in thine hand [is there not] power and might, so that none is able to withstand thee?";
rsv[6] = "and said, &quot;O LORD, God of our fathers, art thou not God in heaven? Dost thou not rule over all the kingdoms of the nations? In thy hand are power and might, so that none is able to withstand thee.";
asv[6] = "and he said, O Jehovah, the God of our fathers, art not thou God in heaven? and art not thou ruler over all the kingdoms of the nations? and in thy hand is power and might, so that none is able to withstand thee.";
yng[6] = "and saith, `O Jehovah, God of our fathers, art not Thou -- God in the heavens? yea, Thou art ruling over all kingdoms of the nations, and in Thy hand [is] power and might, and there is none with Thee to station himself.";
dby[6] = "and he said, Jehovah, God of our fathers, art not thou God in the heavens, and rulest thou not over all the kingdoms of the nations? And in thy hand there is power and might, and none can withstand thee.";
web[6] = "And said, O LORD God of our fathers, [art] not thou God in heaven? and rulest thou [not] over all the kingdoms of the heathen? and in thy hand [is there not] power and might, so that none is able to withstand thee?";
hnv[6] = "and he said, LORD, the God of our fathers, aren\'t you God in heaven? and aren\'t you ruler over all the kingdoms of the nations? and in your hand is power and might, so that none is able to withstand you.";
vul[6] = "ait Domine Deus patrum nostrorum tu es Deus in caelo et dominaris cunctis regnis gentium in manu tua est fortitudo et potentia nec quisquam tibi potest resistere";
kjv[7] = "[Art] not thou our God, [who] didst drive out the inhabitants of this land before thy people Israel, and gavest it to the seed of Abraham thy friend for ever?";
rsv[7] = "Didst thou not, O our God, drive out the inhabitants of this land before thy people Israel, and give it for ever to the descendants of Abraham thy friend?";
asv[7] = "Didst not thou, O our God, drive out the inhabitants of this land before thy people Israel, and give it to the seed of Abraham thy friend for ever?";
yng[7] = "`Art not Thou our God? Thou hast dispossessed the inhabitants of this land from before Thy people Israel, and dost give it to the seed of Abraham Thy friend to the age,";
dby[7] = "Hast not thou, our God, dispossessed the inhabitants of this land before thy people Israel, and given it for ever to the seed of Abraham, thy friend?";
web[7] = "[Art] not thou our God, [who] didst drive out the inhabitants of this land before thy people Israel, and give it to the seed of Abraham thy friend for ever?";
hnv[7] = "Did not you, our God, drive out the inhabitants of this land before your people Yisra\'el, and give it to the seed of Avraham your friend forever?";
vul[7] = "nonne tu Deus noster interfecisti omnes habitatores terrae huius coram populo tuo Israhel et dedisti eam semini Abraham amici tui in sempiternum";
kjv[8] = "And they dwelt therein, and have built thee a sanctuary therein for thy name, saying,";
rsv[8] = "And they have dwelt in it, and have built thee in it a sanctuary for thy name, saying,";
asv[8] = "And they dwelt therein, and have built thee a sanctuary therein for thy name, saying,";
yng[8] = "and they dwell in it, and build to Thee in it a sanctuary for Thy name, saying,";
dby[8] = "And they have dwelt therein, and have built thee a sanctuary therein for thy name, saying,";
web[8] = "And they dwelt in it, and have built thee a sanctuary in it for thy name, saying,";
hnv[8] = "They lived therein, and have built you a sanctuary therein for your name, saying,";
vul[8] = "habitaveruntque in ea et extruxerunt in illa sanctuarium nomini tuo dicentes";
kjv[9] = "If, [when] evil cometh upon us, [as] the sword, judgment, or pestilence, or famine, we stand before this house, and in thy presence, (for thy name [is] in this house,) and cry unto thee in our affliction, then thou wilt hear and help.";
rsv[9] = "\'If evil comes upon us, the sword, judgment, or pestilence, or famine, we will stand before this house, and before thee, for thy name is in this house, and cry to thee in our affliction, and thou wilt hear and save.\'";
asv[9] = "If evil come upon us, the sword, judgment, or pestilence, or famine, we will stand before this house, and before thee (for thy name is in this house), and cry unto thee in our affliction, and thou wilt hear and save.";
yng[9] = "If evil doth come upon us -- sword, judgment, and pestilence, and famine -- we stand before this house, and before Thee, for Thy name [is] in this house, and cry unto Thee out of our distress, and Thou dost hear and save.";
dby[9] = "If evil come upon us, sword, judgment, or pestilence, or famine, and we stand before this house and before thee -- for thy name is in this house -- and cry unto thee in our distress, then thou wilt hear and save.";
web[9] = "If, [when] evil cometh upon us, [as] the sword, judgment, or pestilence, or famine, we stand before this house, and in thy presence, (for thy name [is] in this house,) and cry to thee in our affliction, then thou wilt hear and help.";
hnv[9] = "If evil come on us, the sword, judgment, or pestilence, or famine, we will stand before this house, and before you, (for your name is in this house,) and cry to you in our affliction, and you will hear and save.";
vul[9] = "si inruerint super nos mala gladius iudicii pestilentia et fames stabimus coram domo hac in conspectu tuo in qua invocatum est nomen tuum et clamabimus ad te in tribulationibus nostris et exaudies salvosque facies";
kjv[10] = "And now, behold, the children of Ammon and Moab and mount Seir, whom thou wouldest not let Israel invade, when they came out of the land of Egypt, but they turned from them, and destroyed them not;";
rsv[10] = "And now behold, the men of Ammon and Moab and Mount Se\'ir, whom thou wouldest not let Israel invade when they came from the land of Egypt, and whom they avoided and did not destroy--";
asv[10] = "And now, behold, the children of Ammon and Moab and mount Seir, whom thou wouldest not let Israel invade, when they came out of the land of Egypt, but they turned aside from them, and destroyed them not;";
yng[10] = "`And now, lo, sons of Ammon, and Moab, and mount Seir, whom Thou didst not grant to Israel to go in against in their coming out of the land of Egypt, for they turned aside from off them and destroyed them not,";
dby[10] = "And now, behold, the children of Ammon and Moab, and those of mount Seir, amongst whom thou wouldest not let Israel go when they came out of the land of Egypt, (for they turned from them, and destroyed them not,)";
web[10] = "And now, behold, the children of Ammon and Moab and mount Seir, whom thou wouldst not let Israel invade, when they came from the land of Egypt, but they turned from them, and destroyed them not;";
hnv[10] = "Now, behold, the children of `Ammon and Mo\'av and Mount Se`ir, whom you would not let Yisra\'el invade, when they came out of the land of Mitzrayim, but they turned aside from them, and didn\'t destroy them;";
vul[10] = "nunc igitur ecce filii Ammon et Moab et mons Seir per quos non concessisti Israheli ut transirent quando egrediebantur de Aegypto sed declinaverunt ab eis et non interfecerunt illos";
kjv[11] = "Behold, [I say, how] they reward us, to come to cast us out of thy possession, which thou hast given us to inherit.";
rsv[11] = "behold, they reward us by coming to drive us out of thy possession, which thou hast given us to inherit.";
asv[11] = "behold, how they reward us, to come to cast us out of thy possession, which thou hast given us to inherit.";
yng[11] = "and lo, they are recompensing to us -- to come in to drive us out of Thy possession, that Thou hast caused us to possess.";
dby[11] = "behold, they reward us, in coming to cast us out of thy possession, which thou hast given us to possess.";
web[11] = "Behold, [I say], [how] they reward us, to come to cast us out of thy possession, which thou hast given us to inherit.";
hnv[11] = "behold, how they reward us, to come to cast us out of your possession, which you have given us to inherit.";
vul[11] = "e contrario agunt et nituntur eicere nos de possessione quam tradidisti nobis";
kjv[12] = "O our God, wilt thou not judge them? for we have no might against this great company that cometh against us; neither know we what to do: but our eyes [are] upon thee.";
rsv[12] = "O our God, wilt thou not execute judgment upon them? For we are powerless against this great multitude that is coming against us. We do not know what to do, but our eyes are upon thee.&quot;";
asv[12] = "O our God, wilt thou not judge them? for we have no might against this great company that cometh against us; neither know we what to do: but our eyes are upon thee.";
yng[12] = "`O our God, dost Thou not execute judgment upon them? for there is no power in us before this great multitude that hath come against us, and we know not what we do, but on Thee [are] our eyes.\'";
dby[12] = "Our God, wilt thou not judge them? for we have no might in presence of this great company which cometh against us, neither know we what to do; but our eyes are upon thee.";
web[12] = "O our God, wilt thou not judge them? for we have no might against this great company that cometh against us; neither know we what to do: but our eyes [are] upon thee.";
hnv[12] = "Our God, will you not judge them? for we have no might against this great company that comes against us; neither know we what to do: but our eyes are on you.";
vul[12] = "Deus noster ergo non iudicabis eos in nobis quidem non tanta est fortitudo ut possimus huic multitudini resistere quae inruit super nos sed cum ignoremus quid agere debeamus hoc solum habemus residui ut oculos nostros dirigamus ad te";
kjv[13] = "And all Judah stood before the LORD, with their little ones, their wives, and their children.";
rsv[13] = "Meanwhile all the men of Judah stood before the LORD, with their little ones, their wives, and their children.";
asv[13] = "And all Judah stood before Jehovah, with their little ones, their wives, and their children.";
yng[13] = "And all Judah are standing before Jehovah, also their infants, their wives, and their sons.";
dby[13] = "And all Judah stood before Jehovah, with their little ones, their wives, and their sons.";
web[13] = "And all Judah stood before the LORD, with their little ones, their wives, and their children.";
hnv[13] = "All Yehudah stood before the LORD, with their little ones, their wives, and their children.";
vul[13] = "omnis vero Iuda stabat coram Domino cum parvulis et uxoribus et liberis suis";
kjv[14] = "Then upon Jahaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, a Levite of the sons of Asaph, came the Spirit of the LORD in the midst of the congregation;";
rsv[14] = "And the Spirit of the LORD came upon Jaha\'ziel the son of Zechari\'ah, son of Benai\'ah, son of Je-i\'el, son of Mattani\'ah, a Levite of the sons of Asaph, in the midst of the assembly.";
asv[14] = "Then upon Jahaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, the Levite, of the sons of Asaph, came the Spirit of Jehovah in the midst of the assembly;";
yng[14] = "And upon Jahaziel, son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, of the sons of Asaph, hath the Spirit of Jehovah been, in the midst of the assembly,";
dby[14] = "And upon Jahaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, a Levite of the sons of Asaph, upon him came the Spirit of Jehovah, in the midst of the congregation;";
web[14] = "Then upon Jehaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, a Levite of the sons of Asaph, came the Spirit of the LORD in the midst of the congregation;";
hnv[14] = "Then on Yachazi\'el the son of Zekharyah, the son of Benayah, the son of Ye`i\'el, the son of Mattanyah, the Levite, of the sons of Asaf, came the Spirit of the LORD in the midst of the assembly;";
vul[14] = "erat autem Hiazihel filius Zacchariae filii Banaiae filii Hiehihel filii Mathaniae Levites de filiis Asaph super quem factus est spiritus Domini in medio turbae";
kjv[15] = "And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the LORD unto you, Be not afraid nor dismayed by reason of this great multitude; for the battle [is] not yours, but God\'s.";
rsv[15] = "And he said, &quot;Hearken, all Judah and inhabitants of Jerusalem, and King Jehosh\'aphat: Thus says the LORD to you, \'Fear not, and be not dismayed at this great multitude; for the battle is not yours but God\'s.";
asv[15] = "and he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat: Thus saith Jehovah unto you, Fear not ye, neither be dismayed by reason of this great multitude; for the battle is not yours, but God\'s.";
yng[15] = "and he saith, `Attend, all Judah, and ye inhabitants of Jerusalem, and O king Jehoshaphat, Thus said Jehovah to you, Ye fear not, nor are afraid of the face of this great multitude, for not for you [is] the battle, but for God.";
dby[15] = "and he said, Be attentive, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat! Thus saith Jehovah unto you: Fear not, nor be dismayed by reason of this great multitude; for the battle is not yours, but God\'s.";
web[15] = "And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the LORD to you, Be not afraid nor dismayed by reason of this great multitude; for the battle [is] not yours, but God\'s.";
hnv[15] = "and he said, Listen you, all Yehudah, and you inhabitants of Yerushalayim, and you king Yehoshafat: Thus says the LORD to you, Don\'t be afraid you, neither be dismayed by reason of this great multitude; for the battle is not yours, but God\'s.";
vul[15] = "et ait adtendite omnis Iuda et qui habitatis Hierusalem et tu rex Iosaphat haec dicit Dominus vobis nolite timere nec paveatis hanc multitudinem non est enim vestra pugna sed Dei";
kjv[16] = "To morrow go ye down against them: behold, they come up by the cliff of Ziz; and ye shall find them at the end of the brook, before the wilderness of Jeruel.";
rsv[16] = "Tomorrow go down against them; behold, they will come up by the ascent of Ziz; you will find them at the end of the valley, east of the wilderness of Jeru\'el.";
asv[16] = "To-morrow go ye down against them: behold, they come up by the ascent of Ziz; and ye shall find them at the end of the valley, before the wilderness of Jeruel.";
yng[16] = "To-morrow, go ye down against them, lo, they are coming up by the ascent of Ziz, and ye have found them in the end of the valley, the front of the wilderness of Jeruel.";
dby[16] = "To-morrow go down against them: behold, they come up by the ascent of Ziz; and ye shall find them at the end of the valley, before the wilderness of Jeruel.";
web[16] = "To-morrow go ye down against them: behold, they come up by the cliff of Ziz; and ye shall find them at the end of the brook, before the wilderness of Jeruel.";
hnv[16] = "Tomorrow go you down against them: behold, they come up by the ascent of Tzitz; and you shall find them at the end of the valley, before the wilderness of Yeru\'el.";
vul[16] = "cras descendetis contra eos ascensuri enim sunt per clivum nomine Sis et invenietis illos in summitate torrentis qui est contra solitudinem Hieruhel";
kjv[17] = "Ye shall not [need] to fight in this [battle]: set yourselves, stand ye [still], and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD [will be] with you.";
rsv[17] = "You will not need to fight in this battle; take your position, stand still, and see the victory of the LORD on your behalf, O Judah and Jerusalem.\' Fear not, and be not dismayed; tomorrow go out against them, and the LORD will be with you.&quot;";
asv[17] = "Ye shall not need to fight in this [battle]: set yourselves, stand ye still, and see the salvation of Jehovah with you, O Judah and Jerusalem; fear not, nor be dismayed: to-morrow go out against them; for Jehovah is with you.";
yng[17] = "Not for you to fight in this; station yourselves, stand, and see the salvation of Jehovah with you, O Judah and Jerusalem -- be not afraid nor fear ye -- to-morrow go out before them, and Jehovah [is] with you.\'";
dby[17] = "Ye shall not have to fight on this occasion: set yourselves, stand and see the salvation of Jehovah [who is] with you! Judah and Jerusalem, fear not nor be dismayed; to-morrow go out against them, and Jehovah will be with you.";
web[17] = "Ye shall not [need] to fight in this [battle]: set yourselves, stand ye [still], and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to-morrow go out against them: for the LORD [will be] with you.";
hnv[17] = "You shall not need to fight in this [battle]: set yourselves, stand you still, and see the salvation of the LORD with you, O Yehudah and Yerushalayim; don\'t be afraid, nor be dismayed: tomorrow go out against them: for the LORD is with you.";
vul[17] = "non eritis vos qui dimicabitis sed tantummodo confidenter state et videbitis auxilium Domini super vos o Iuda et Hierusalem nolite timere nec paveatis cras egredimini contra eos et Dominus erit vobiscum";
kjv[18] = "And Jehoshaphat bowed his head with [his] face to the ground: and all Judah and the inhabitants of Jerusalem fell before the LORD, worshipping the LORD.";
rsv[18] = "Then Jehosh\'aphat bowed his head with his face to the ground, and all Judah and the inhabitants of Jerusalem fell down before the LORD, worshiping the LORD.";
asv[18] = "And Jehoshaphat bowed his head with his face to the ground; and all Judah and the inhabitants of Jerusalem fell down before Jehovah, worshipping Jehovah.";
yng[18] = "And Jehoshaphat boweth -- face to the earth -- and all Judah and the inhabitants of Jerusalem have fallen before Jehovah, to bow themselves to Jehovah.";
dby[18] = "And Jehoshaphat bowed his head with his face to the ground; and all Judah and the inhabitants of Jerusalem fell down before Jehovah, worshipping Jehovah.";
web[18] = "And Jehoshaphat bowed his head with [his] face to the ground: and all Judah and the inhabitants of Jerusalem fell before the LORD, worshiping the LORD.";
hnv[18] = "Yehoshafat bowed his head with his face to the ground; and all Yehudah and the inhabitants of Yerushalayim fell down before the LORD, worshipping the LORD.";
vul[18] = "Iosaphat ergo et Iuda et omnes habitatores Hierusalem ceciderunt proni in terram coram Domino et adoraverunt eum";
kjv[19] = "And the Levites, of the children of the Kohathites, and of the children of the Korhites, stood up to praise the LORD God of Israel with a loud voice on high.";
rsv[19] = "And the Levites, of the Ko\'hathites and the Kor\'ahites, stood up to praise the LORD, the God of Israel, with a very loud voice.";
asv[19] = "And the Levites, of the children of the Kohathites and of the children of the Korahites, stood up to praise Jehovah, the God of Israel, with an exceeding loud voice.";
yng[19] = "And the Levites, of the sons of the Kohathites, and of the sons of the Korhites, rise to give praise to Jehovah, God of Israel, with a loud voice on high.";
dby[19] = "And the Levites, of the sons of the Kohathites, and of the sons of the Korahites, stood up to praise Jehovah the God of Israel with an exceeding loud voice.";
web[19] = "And the Levites, of the children of the Kohathites, and of the children of the Korhites, stood up to praise the LORD God of Israel with a loud voice on high.";
hnv[19] = "The Levites, of the children of the Kehati and of the children of the Korchi, stood up to praise the LORD, the God of Yisra\'el, with an exceeding loud voice.";
vul[19] = "porro Levitae de filiis Caath et de filiis Core laudabant Dominum Deum Israhel voce magna in excelsum";
kjv[20] = "And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper.";
rsv[20] = "And they rose early in the morning and went out into the wilderness of Teko\'a; and as they went out, Jehosh\'aphat stood and said, &quot;Hear me, Judah and inhabitants of Jerusalem! Believe in the LORD your God, and you will be established; believe his prophets, and you will succeed.&quot;";
asv[20] = "And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem: believe in Jehovah your God, so shall ye be established; believe his prophets, so shall ye prosper.";
yng[20] = "And they rise early in the morning, and go out to the wilderness of Tekoa, and in their going out Jehoshaphat hath stood and saith, `Hear me, O Judah, and inhabitants of Jerusalem, remain stedfast in Jehovah your God, and be stedfast; remain stedfast in His prophets, and prosper.\'";
dby[20] = "And they rose early in the morning, and went forth towards the wilderness of Tekoa; and as they went forth, Jehoshaphat stood and said, Hear me, Judah, and ye inhabitants of Jerusalem! Believe in Jehovah your God, and ye shall be established; believe his prophets, and ye shall prosper!";
web[20] = "And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper.";
hnv[20] = "They rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Yehoshafat stood and said, Hear me, Yehudah, and you inhabitants of Yerushalayim: believe in the LORD your God, so shall you be established; believe his prophets, so shall you prosper.";
vul[20] = "cumque mane surrexissent egressi sunt per desertum Thecuae profectisque eis stans Iosaphat in medio eorum dixit audite me Iuda et omnes habitatores Hierusalem credite in Domino Deo vestro et securi eritis credite prophetis eius et cuncta evenient prospera";
kjv[21] = "And when he had consulted with the people, he appointed singers unto the LORD, and that should praise the beauty of holiness, as they went out before the army, and to say, Praise the LORD; for his mercy [endureth] for ever.";
rsv[21] = "And when he had taken counsel with the people, he appointed those who were to sing to the LORD and praise him in holy array, as they went before the army, and say, &quot;Give thanks to the LORD, for his steadfast love endures for ever.&quot;";
asv[21] = "And when he had taken counsel with the people, he appointed them that should sing unto Jehovah, and give praise in holy array, as they went out before the army, and say, Give thanks unto Jehovah; for his lovingkindness [endureth] for ever.";
yng[21] = "And he taketh counsel with the people, and appointeth singers to Jehovah, and those giving praise to the honour of holiness, in the going out before the armed [men], and saying, `Give ye thanks to Jehovah, for to the age [is] His kindness.\'";
dby[21] = "And he consulted with the people, and appointed singers to Jehovah, and those that should praise in holy splendour, as they went forth before the armed men, and say, Give thanks to Jehovah; for his loving-kindness [endureth] for ever!";
web[21] = "And when he had consulted with the people, he appointed singers to the LORD, and that should praise the beauty of holiness, as they went out before the army, and to say, Praise the LORD; for his mercy [endureth] for ever.";
hnv[21] = "When he had taken counsel with the people, he appointed those who should sing to the LORD, and give praise in holy array, as they went out before the army, and say, Give thanks to the LORD; for his lovingkindness endures forever.";
vul[21] = "deditque consilium populo et statuit cantores Domini ut laudarent eum in turmis suis et antecederent exercitum ac voce consona dicerent confitemini Domino quoniam in aeternum misericordia eius";
kjv[22] = "And when they began to sing and to praise, the LORD set ambushments against the children of Ammon, Moab, and mount Seir, which were come against Judah; and they were smitten.";
rsv[22] = "And when they began to sing and praise, the LORD set an ambush against the men of Ammon, Moab, and Mount Se\'ir, who had come against Judah, so that they were routed.";
asv[22] = "And when they began to sing and to praise, Jehovah set liers-in-wait against the children of Ammon, Moab, and mount Seir, that were come against Judah; and they were smitten.";
yng[22] = "And at the time they have begun with singing and praise, Jehovah hath put ambushments against the sons of Ammon, Moab, and mount Seir, who are coming in to Judah, and they are smitten,";
dby[22] = "And when they began the song of triumph and praise, Jehovah set liers-in-wait against the children of Ammon, Moab, and mount Seir, who had come against Judah, and they were smitten.";
web[22] = "And when they began to sing and to praise, the LORD set ambushes against the children of Ammon, Moab, and mount Seir, who were come against Judah; and they were smitten.";
hnv[22] = "When they began to sing and to praise, the LORD set liers-in-wait against the children of `Ammon, Mo\'av, and Mount Se`ir, who had come against Yehudah; and they were struck.";
vul[22] = "cumque coepissent laudes canere vertit Dominus insidias eorum in semet ipsos filiorum scilicet Ammon et Moab et montis Seir qui egressi fuerant ut pugnarent contra Iudam et percussi sunt";
kjv[23] = "For the children of Ammon and Moab stood up against the inhabitants of mount Seir, utterly to slay and destroy [them]: and when they had made an end of the inhabitants of Seir, every one helped to destroy another.";
rsv[23] = "For the men of Ammon and Moab rose against the inhabitants of Mount Se\'ir, destroying them utterly, and when they had made an end of the inhabitants of Se\'ir, they all helped to destroy one another.";
asv[23] = "For the children of Ammon and Moab stood up against the inhabitants of mount Seir, utterly to slay and destroy them: and when they had made an end of the inhabitants of Seir, every one helped to destroy another.";
yng[23] = "and the sons of Ammon stand up, and Moab, against the inhabitants of mount Seir, to devote and to destroy, and at their finishing with the inhabitants of Seir, they helped, a man against his neighbour, to destroy.";
dby[23] = "And the children of Ammon and Moab stood up against the inhabitants of mount Seir, to exterminate and destroy [them]; and when they had made an end of the inhabitants of Seir, they helped to destroy one another.";
web[23] = "For the children of Ammon and Moab stood up against the inhabitants of mount Seir, utterly to slay and destroy [them]: and when they had made an end of the inhabitants of Seir, every one helped to destroy another.";
hnv[23] = "For the children of `Ammon and Mo\'av stood up against the inhabitants of Mount Se`ir, utterly to kill and destroy them: and when they had made an end of the inhabitants of Se`ir, everyone helped to destroy another.";
vul[23] = "namque filii Ammon et Moab consurrexerunt adversum habitatores montis Seir ut interficerent et delerent eos cumque hoc opere perpetrassent etiam in semet ipsos versi mutuis concidere vulneribus";
kjv[24] = "And when Judah came toward the watch tower in the wilderness, they looked unto the multitude, and, behold, they [were] dead bodies fallen to the earth, and none escaped.";
rsv[24] = "When Judah came to the watchtower of the wilderness, they looked toward the multitude; and behold, they were dead bodies lying on the ground; none had escaped.";
asv[24] = "And when Judah came to the watch-tower of the wilderness, they looked upon the multitude; and, behold, they were dead bodies fallen to the earth, and there were none that escaped.";
yng[24] = "And Judah hath come in unto the watch-tower, to the wilderness, and they look unto the multitude, and lo, they [are] carcases fallen to the earth, and there is none escaped,";
dby[24] = "And Judah came on to the mountain-watch in the wilderness, and they looked toward the multitude; and behold, they were dead bodies fallen to the earth, and none had escaped.";
web[24] = "And when Judah came towards the watch-tower in the wilderness, they looked to the multitude, and behold, they [were] dead bodies fallen to the earth, and none escaped.";
hnv[24] = "When Yehudah came to the watch-tower of the wilderness, they looked at the multitude; and, behold, they were dead bodies fallen to the eretz, and there were none who escaped.";
vul[24] = "porro Iudas cum venisset ad speculam quae respicit solitudinem vidit procul omnem late regionem plenam cadaveribus nec superesse quemquam qui necem potuisset evadere";
kjv[25] = "And when Jehoshaphat and his people came to take away the spoil of them, they found among them in abundance both riches with the dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away: and they were three days in gathering of the spoil, it was so much.";
rsv[25] = "When Jehosh\'aphat and his people came to take the spoil from them, they found cattle in great numbers, goods, clothing, and precious things, which they took for themselves until they could carry no more. They were three days in taking the spoil, it was so much.";
asv[25] = "And when Jehoshaphat and his people came to take the spoil of them, they found among them in abundance both riches and dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away: and they were three days in taking the spoil, it was so much.";
yng[25] = "and Jehoshaphat cometh in, and his people, to seize their spoil, and they find among them, in abundance, both goods and carcases, and desirable vessels, and they take spoil to themselves without prohibition, and they are three days seizing the spoil, for it [is] abundant.";
dby[25] = "And Jehoshaphat and his people came to plunder the spoil of them, and they found among them in abundance, both riches with the dead bodies, and precious things, and they stripped off for themselves more than they could carry away; and they were three days in plundering the spoil, it was so much.";
web[25] = "And when Jehoshaphat and his people came to take away the spoil of them, they found among them in abundance both riches with the dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away: and they were three days in gathering the spoil, it was so much.";
hnv[25] = "When Yehoshafat and his people came to take the spoil of them, they found among them in abundance both riches and dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away: and they were three days in taking the spoil, it was so much.";
vul[25] = "venit ergo Iosaphat et omnis populus cum eo ad detrahenda spolia mortuorum inveneruntque inter cadavera variam supellectilem vestes quoque et vasa pretiosissima et diripuerunt ita ut omnia portare non possent nec per tres dies spolia auferre pro praedae magnitudine";
kjv[26] = "And on the fourth day they assembled themselves in the valley of Berachah; for there they blessed the LORD: therefore the name of the same place was called, The valley of Berachah, unto this day.";
rsv[26] = "On the fourth day they assembled in the Valley of Bera\'cah, for there they blessed the LORD; therefore the name of that place has been called the Valley of Bera\'cah to this day.";
asv[26] = "And on the fourth day they assembled themselves in the valley of Beracah; for there they blessed Jehovah: therefore the name of that place was called The valley of Beracah unto this day.";
yng[26] = "And on the fourth day they have been assembled at the valley of Blessing, for there they blessed Jehovah: therefore they have called the name of that place, `Valley of Blessing,\' unto this day.";
dby[26] = "And on the fourth day they assembled themselves in the valley of Berachah, for there they blessed Jehovah; therefore the name of that place was called The valley of Berachah, to this day.";
web[26] = "And on the fourth day they assembled themselves in the valley of Berachah; for there they blessed the LORD: therefore the name of the same place hath been called, The valley of Berachah, to this day.";
hnv[26] = "On the fourth day they assembled themselves in the valley of Berakha; for there they blessed the LORD: therefore the name of that place was called The valley of Berakha to this day.";
vul[26] = "die autem quarto congregati sunt in valle Benedictionis etenim quoniam ibi benedixerant Domino vocaverunt locum illum vallis Benedictionis usque in praesentem diem";
kjv[27] = "Then they returned, every man of Judah and Jerusalem, and Jehoshaphat in the forefront of them, to go again to Jerusalem with joy; for the LORD had made them to rejoice over their enemies.";
rsv[27] = "Then they returned, every man of Judah and Jerusalem, and Jehosh\'aphat at their head, returning to Jerusalem with joy, for the LORD had made them rejoice over their enemies.";
asv[27] = "Then they returned, every man of Judah and Jerusalem, and Jehoshaphat in the forefront of them, to go again to Jerusalem with joy; for Jehovah had made them to rejoice over their enemies.";
yng[27] = "And they turn back, every man of Judah and Jerusalem, and Jehoshaphat at their head, to go back unto Jerusalem with joy, for Jehovah hath made them rejoice over their enemies.";
dby[27] = "And they returned, all the men of Judah and Jerusalem, and Jehoshaphat at their head, to go again to Jerusalem with joy; for Jehovah had made them to rejoice over their enemies.";
web[27] = "Then they returned, every man of Judah and Jerusalem, and Jehoshaphat in the front of them, to go again to Jerusalem with joy; for the LORD had made them to rejoice over their enemies.";
hnv[27] = "Then they returned, every man of Yehudah and Yerushalayim, and Yehoshafat in the forefront of them, to go again to Yerushalayim with joy; for the LORD had made them to rejoice over their enemies.";
vul[27] = "reversusque est omnis vir Iuda et habitatores Hierusalem et Iosaphat ante eos in Hierusalem cum laetitia magna eo quod dedisset eis Dominus gaudium de inimicis suis";
kjv[28] = "And they came to Jerusalem with psalteries and harps and trumpets unto the house of the LORD.";
rsv[28] = "They came to Jerusalem, with harps and lyres and trumpets, to the house of the LORD.";
asv[28] = "And they came to Jerusalem with psalteries and harps and trumpets unto the house of Jehovah.";
yng[28] = "And they come in to Jerusalem with psalteries, and with harps, and with trumpets, unto the house of Jehovah.";
dby[28] = "And they came to Jerusalem with lutes and harps and trumpets, to the house of Jehovah.";
web[28] = "And they came to Jerusalem with psalteries and harps and trumpets to the house of the LORD.";
hnv[28] = "They came to Yerushalayim with psalteries and harps and trumpets to the house of the LORD.";
vul[28] = "ingressique sunt Hierusalem cum psalteriis et citharis et tubis in domum Domini";
kjv[29] = "And the fear of God was on all the kingdoms of [those] countries, when they had heard that the LORD fought against the enemies of Israel.";
rsv[29] = "And the fear of God came on all the kingdoms of the countries when they heard that the LORD had fought against the enemies of Israel.";
asv[29] = "And the fear of God was on all the kingdoms of the countries, when they heard that Jehovah fought against the enemies of Israel.";
yng[29] = "And there is a fear of God on all kingdoms of the lands in their hearing that Jehovah hath fought with the enemies of Israel,";
dby[29] = "And the terror of God was on all the kingdoms of the lands, when they had heard that Jehovah fought against the enemies of Israel.";
web[29] = "And the fear of God was on all the kingdoms of [those] countries, when they had heard that the LORD fought against the enemies of Israel.";
hnv[29] = "The fear of God was on all the kingdoms of the countries, when they heard that the LORD fought against the enemies of Yisra\'el.";
vul[29] = "inruit autem pavor Domini super universa regna terrarum cum audissent quod pugnasset Dominus contra inimicos Israhel";
kjv[30] = "So the realm of Jehoshaphat was quiet: for his God gave him rest round about.";
rsv[30] = "So the realm of Jehosh\'aphat was quiet, for his God gave him rest round about.";
asv[30] = "So the realm of Jehoshaphat was quiet; for his God gave him rest round about.";
yng[30] = "and the kingdom of Jehoshaphat is quiet, and his God giveth rest to him round about.";
dby[30] = "And the realm of Jehoshaphat was quiet; and his God gave him rest round about.";
web[30] = "So the realm of Jehoshaphat was quiet: for his God gave him rest on all sides.";
hnv[30] = "So the realm of Yehoshafat was quiet; for his God gave him rest round about.";
vul[30] = "quievitque regnum Iosaphat et praebuit ei Deus pacem per circuitum";
kjv[31] = "And Jehoshaphat reigned over Judah: [he was] thirty and five years old when he began to reign, and he reigned twenty and five years in Jerusalem. And his mother\'s name [was] Azubah the daughter of Shilhi.";
rsv[31] = "Thus Jehosh\'aphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. His mother\'s name was Azu\'bah the daughter of Shilhi.";
asv[31] = "And Jehoshaphat reigned over Judah: he was thirty and five years old when he began to reign; and he reigned twenty and five years in Jerusalem: and his mother\'s name was Azubah the daughter of Shilhi.";
yng[31] = "And Jehoshaphat reigneth over Judah, a son of thirty and five years in his reigning, and twenty and five years he hath reigned in Jerusalem, and the name of his mother [is] Azubah daughter of Shilhi.";
dby[31] = "And Jehoshaphat reigned over Judah: he was thirty-five years old when he began to reign; and he reigned twenty-five years in Jerusalem; and his mother\'s name was Azubah, daughter of Shilhi.";
web[31] = "And Jehoshaphat reigned over Judah: [he was] thirty and five years old when he began to reign, and he reigned twenty and five years in Jerusalem. And his mother\'s name [was] Azubah the daughter of Shilhi.";
hnv[31] = "Yehoshafat reigned over Yehudah: he was thirty-five years old when he began to reign; and he reigned twenty-five years in Yerushalayim: and his mother\'s name was `Azuvah the daughter of Shilchi.";
vul[31] = "regnavit igitur Iosaphat super Iudam et erat triginta quinque annorum cum regnare coepisset viginti autem et quinque annis regnavit in Hierusalem nomen matris eius Azuba filia Selachi";
kjv[32] = "And he walked in the way of Asa his father, and departed not from it, doing [that which was] right in the sight of the LORD.";
rsv[32] = "He walked in the way of Asa his father and did not turn aside from it; he did what was right in the sight of the LORD.";
asv[32] = "And he walked in the way of Asa his father, and turned not aside from it, doing that which was right in the eyes of Jehovah.";
yng[32] = "And he walketh in the way of his father Asa, and hath not turned aside from it, to do that which is right in the eyes of Jehovah.";
dby[32] = "And he walked in the way of Asa his father, and turned not aside from it, doing what was right in the sight of Jehovah.";
web[32] = "And he walked in the way of Asa his father, and departed not from it, doing [that which was] right in the sight of the LORD.";
hnv[32] = "He walked in the way of Asa his father, and didn\'t turn aside from it, doing that which was right in the eyes of the LORD.";
vul[32] = "et ambulavit in via patris sui Asa nec declinavit ab ea faciens quae placita erant coram Domino";
kjv[33] = "Howbeit the high places were not taken away: for as yet the people had not prepared their hearts unto the God of their fathers.";
rsv[33] = "The high places, however, were not taken away; the people had not yet set their hearts upon the God of their fathers.";
asv[33] = "Howbeit the high places were not taken away; neither as yet had the people set their hearts unto the God of their fathers.";
yng[33] = "Only, the high places have not turned aside, and still the people have not prepared their heart for the God of their fathers.";
dby[33] = "Only, the high places were not removed; and as yet the people had not directed their hearts to the God of their fathers.";
web[33] = "But the high places were not taken away: for as yet the people had not prepared their hearts to the God of their fathers.";
hnv[33] = "However the high places were not taken away; neither as yet had the people set their hearts to the God of their fathers.";
vul[33] = "verumtamen excelsa non abstulit et adhuc populus non direxerat cor suum ad Dominum Deum patrum suorum";
kjv[34] = "Now the rest of the acts of Jehoshaphat, first and last, behold, they [are] written in the book of Jehu the son of Hanani, who [is] mentioned in the book of the kings of Israel.";
rsv[34] = "Now the rest of the acts of Jehosh\'aphat, from first to last, are written in the chronicles of Jehu the son of Hana\'ni, which are recorded in the Book of the Kings of Israel.";
asv[34] = "Now the rest of the acts of Jehoshaphat, first and last, behold, they are written in the history of Jehu the son of Hanani, which is inserted in the book of the kings of Israel.";
yng[34] = "And the rest of the matters of Jehoshaphat, the first and the last, lo, they are written among the matters of Jehu son of Hanani, who hath been mentioned on the book of the kings of Israel.";
dby[34] = "And the rest of the acts of Jehoshaphat, first and last, behold, they are written in the words of Jehu the son of Hanani, which are inserted in the book of the kings of Israel.";
web[34] = "Now the rest of the acts of Jehoshaphat, first and last, behold, they [are] written in the book of Jehu the son of Hanani, who [is] mentioned in the book of the kings of Israel.";
hnv[34] = "Now the rest of the acts of Yehoshafat, first and last, behold, they are written in the history of Yehu the son of Hanani, which is inserted in the book of the kings of Yisra\'el.";
vul[34] = "reliqua autem gestorum Iosaphat priorum et novissimorum scripta sunt in verbis Hieu filii Anani quae digessit in libro regum Israhel";
kjv[35] = "And after this did Jehoshaphat king of Judah join himself with Ahaziah king of Israel, who did very wickedly:";
rsv[35] = "After this Jehosh\'aphat king of Judah joined with Ahazi\'ah king of Israel, who did wickedly.";

kjv[37] = "Then Eliezer the son of Dodavah of Mareshah prophesied against Jehoshaphat, saying, Because thou hast joined thyself with Ahaziah, the LORD hath broken thy works. And the ships were broken, that they were not able to go to Tarshish.";
rsv[37] = "Then Elie\'zer the son of Do-dav\'ahu of Mare\'shah prophesied against Jehosh\'aphat, saying, &quot;Because you have joined with Ahazi\'ah, the LORD will destroy what you have made.&quot; And the ships were wrecked and were not able to go to Tarshish.";
asv[37] = "Then Eliezer the son of Dodavahu of Mareshah prophesied against Jehoshaphat, saying, Because thou hast joined thyself with Ahaziah, Jehovah hath destroyed thy works. And the ships were broken, so that they were not able to go to Tarshish.";
yng[37] = "and prophesy doth Eliezer son of Dodavah, of Mareshah, against Jehoshaphat, saying, `For thy joining thyself with Ahaziah, Jehovah hath broken up thy works;\' and the ships are broken, and have not retained [power] to go unto Tarshish.";
dby[37] = "And Eliezer the son of Dodavah, of Mareshah, prophesied against Jehoshaphat, saying, Because thou hast joined thyself with Ahaziah, Jehovah has broken thy works. And the ships were broken, and could not go to Tarshish.";
