csb[1] = "Now about food sacrificed to idols: We know that &quot;we all have knowledge.&quot; Knowledge puffs up, but love builds up.";
csb[2] = "If anyone thinks he knows anything, he does not yet know it as he ought to know it.";
csb[3] = "But if anyone loves God, he is known by him.";
csb[4] = "About eating food sacrificed to idols, then, we know that &quot;an idol is nothing in the world,&quot; and that &quot;there is no God but one.&quot;";
csb[5] = "For even if there are so-called gods, whether in heaven or on earth -- as there are many &quot;gods&quot; and many &quot;lords&quot; --";
csb[6] = "yet for us there is one God, the Father. All things are from him, and we exist for him. And there is one Lord, Jesus Christ. All things are through him, and we exist through him.";
csb[7] = "However, not everyone has this knowledge. Some have been so used to idolatry up until now that when they eat food sacrificed to an idol, their conscience, being weak, is defiled.";
csb[8] = "Food will not bring us close to God. We are not worse off if we don\'t eat, and we are not better if we do eat.";
csb[9] = "But be careful that this right of yours in no way becomes a stumbling block to the weak.";
csb[10] = "For if someone sees you, the one who has knowledge, dining in an idol\'s temple, won\'t his weak conscience be encouraged to eat food offered to idols?";
csb[11] = "So the weak person, the brother or sister for whom Christ died, is ruined by your knowledge.";
csb[12] = "Now when you sin like this against brothers and sisters and wound their weak conscience, you are sinning against Christ.";
csb[13] = "Therefore, if food causes my brother or sister to fall, I will never again eat meat, so that I won\'t cause my brother or sister to fall.";
asv[1] = "Now concerning things sacrificed to idols: We know that we all have knowledge. Knowledge puffeth up, but love edifieth.";
asv[2] = "If any man thinketh that he knoweth anything, he knoweth not yet as he ought to know;";
asv[3] = "but if any man loveth God, the same is known by him.";
asv[4] = "Concerning therefore the eating of things sacrificed to idols, we know that no idol is [anything] in the world, and that there is no God but one.";
asv[5] = "For though there be that are called gods, whether in heaven or on earth; as there are gods many, and lords many;";
asv[6] = "yet to us there is one God, the Father, of whom are all things, and we unto him; and one Lord, Jesus Christ, through whom are all things, and we through him.";
asv[7] = "Howbeit there is not in all men that knowledge: but some, being used until now to the idol, eat as [of] a thing sacrificed to an idol; and their conscience being weak is defiled.";
asv[8] = "But food will not commend us to God: neither, if we eat not, are we the worse; nor, if we eat, are we the better.";
asv[9] = "But take heed lest by any means this liberty of yours become a stumblingblock to the weak.";
asv[10] = "For if a man see thee who hast knowledge sitting at meat in an idol\'s temple, will not his conscience, if he is weak, be emboldened to eat things sacrificed to idols?";
asv[11] = "For through thy knowledge he that is weak perisheth, the brother for whose sake Christ died.";
asv[12] = "And thus, sinning against the brethren, and wounding their conscience when it is weak, ye sin against Christ.";
asv[13] = "Wherefore, if meat causeth my brother to stumble, I will eat no flesh for evermore, that I cause not my brother to stumble.";

kjv[1] = "Now as touching things offered unto idols, we know that we all have knowledge. Knowledge puffeth up, but charity edifieth.";
kjv[2] = "And if any man think that he knoweth any thing, he knoweth nothing yet as he ought to know.";
kjv[3] = "But if any man love God, the same is known of him.";
kjv[4] = "As concerning therefore the eating of those things that are offered in sacrifice unto idols, we know that an idol [is] nothing in the world, and that [there is] none other God but one.";
kjv[5] = "For though there be that are called gods, whether in heaven or in earth, (as there be gods many, and lords many,)";
kjv[6] = "But to us [there is but] one God, the Father, of whom [are] all things, and we in him; and one Lord Jesus Christ, by whom [are] all things, and we by him.";
kjv[7] = "Howbeit [there is] not in every man that knowledge: for some with conscience of the idol unto this hour eat [it] as a thing offered unto an idol; and their conscience being weak is defiled.";
kjv[8] = "But meat commendeth us not to God: for neither, if we eat, are we the better; neither, if we eat not, are we the worse.";
kjv[9] = "But take heed lest by any means this liberty of yours become a stumblingblock to them that are weak.";
kjv[10] = "For if any man see thee which hast knowledge sit at meat in the idol\'s temple, shall not the conscience of him which is weak be emboldened to eat those things which are offered to idols;";
kjv[11] = "And through thy knowledge shall the weak brother perish, for whom Christ died?";
kjv[12] = "But when ye sin so against the brethren, and wound their weak conscience, ye sin against Christ.";
kjv[13] = "Wherefore, if meat make my brother to offend, I will eat no flesh while the world standeth, lest I make my brother to offend.";
rsv[1] = "Now concerning food offered to idols: we know that &quot;all of us possess knowledge.&quot; &quot;Knowledge&quot; puffs up, but love builds up.";
rsv[2] = "If any one imagines that he knows something, he does not yet know as he ought to know.";
rsv[3] = "But if one loves God, one is known by him.";
rsv[4] = "Hence, as to the eating of food offered to idols, we know that &quot;an idol has no real existence,&quot; and that &quot;there is no God but one.&quot;";
rsv[5] = "For although there may be so-called gods in heaven or on earth--as indeed there are many &quot;gods&quot; and many &quot;lords&quot;--";
rsv[6] = "yet for us there is one God, the Father, from whom are all things and for whom we exist, and one Lord, Jesus Christ, through whom are all things and through whom we exist.";
rsv[7] = "However, not all possess this knowledge. But some, through being hitherto accustomed to idols, eat food as really offered to an idol; and their conscience, being weak, is defiled.";
rsv[8] = "Food will not commend us to God. We are no worse off if we do not eat, and no better off if we do.";
rsv[9] = "Only take care lest this liberty of yours somehow become a stumbling block to the weak.";
rsv[10] = "For if any one sees you, a man of knowledge, at table in an idol\'s temple, might he not be encouraged, if his conscience is weak, to eat food offered to idols?";
rsv[11] = "And so by your knowledge this weak man is destroyed, the brother for whom Christ died.";
rsv[12] = "Thus, sinning against your brethren and wounding their conscience when it is weak, you sin against Christ.";
rsv[13] = "Therefore, if food is a cause of my brother\'s falling, I will never eat meat, lest I cause my brother to fall.";
vul[1] = "de his autem quae idolis sacrificantur scimus quia omnes scientiam habemus scientia inflat caritas vero aedificat";
vul[2] = "si quis se existimat scire aliquid nondum cognovit quemadmodum oporteat eum scire";
vul[3] = "si quis autem diligit Deum hic cognitus est ab eo";
vul[4] = "de escis autem quae idolis immolantur scimus quia nihil est idolum in mundo et quod nullus Deus nisi unus";
vul[5] = "nam et si sunt qui dicantur dii sive in caelo sive in terra siquidem sunt dii multi et domini multi";
vul[6] = "nobis tamen unus Deus Pater ex quo omnia et nos in illum et unus Dominus Iesus Christus per quem omnia et nos per ipsum";
vul[7] = "sed non in omnibus est scientia quidam autem conscientia usque nunc idoli quasi idolothytum manducant et conscientia ipsorum cum sit infirma polluitur";
vul[8] = "esca autem nos non commendat Deo neque si non manducaverimus deficiemus neque si manducaverimus abundabimus";
vul[9] = "videte autem ne forte haec licentia vestra offendiculum fiat infirmibus";
vul[10] = "si enim quis viderit eum qui habet scientiam in idolio recumbentem nonne conscientia eius cum sit infirma aedificabitur ad manducandum idolothyta";
vul[11] = "et peribit infirmus in tua scientia frater propter quem Christus mortuus est";
vul[12] = "sic autem peccantes in fratres et percutientes conscientiam eorum infirmam in Christo peccatis";
vul[13] = "quapropter si esca scandalizat fratrem meum non manducabo carnem in aeternum ne fratrem meum scandalizem";

web[5] = "For though there are that are called gods, whether in heaven or upon earth, (as there are gods many, and lords many)";

web[7] = "But [there is] not in every man that knowledge: for some with conscience of the idol to this hour eat [it] as a thing offered to an idol; and their conscience, being weak, is defiled.";

yng[1] = "And concerning the things sacrificed to idols, we have known that we all have knowledge: knowledge puffeth up, but love buildeth up;";
yng[2] = "and if any one doth think to know anything, he hath not yet known anything according as it behoveth [him] to know;";
yng[3] = "and if any one doth love God, this one hath been known by Him.";
yng[4] = "Concerning the eating then of the things sacrificed to idols, we have known that an idol [is] nothing in the world, and that there is no other God except one;";
yng[5] = "for even if there are those called gods, whether in heaven, whether upon earth -- as there are gods many and lords many --";
yng[6] = "yet to us [is] one God, the Father, of whom [are] the all things, and we to Him; and one Lord, Jesus Christ, through whom [are] the all things, and we through Him;";
yng[7] = "but not in all men [is] the knowledge, and certain with conscience of the idol, till now, as a thing sacrificed to an idol do eat [it], and their conscience, being weak, is defiled.";
yng[8] = "But victuals do not commend us to God, for neither if we may eat are we in advance; nor if we may not eat, are we behind;";
yng[9] = "but see, lest this privilege of yours may become a stumbling-block to the infirm,";
yng[10] = "for if any one may see thee that hast knowledge in an idol\'s temple reclining at meat -- shall not his conscience -- he being infirm -- be emboldened to eat the things sacrificed to idols,";
yng[11] = "and the brother who is infirm shall perish by thy knowledge, because of whom Christ died?";
yng[12] = "and thus sinning in regard to the brethren, and smiting their weak conscience -- in regard to Christ ye sin;";
yng[13] = "wherefore, if victuals cause my brother to stumble, I may eat no flesh -- to the age -- that my brother I may not cause to stumble.";
