csb[1] = "Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?";
csb[2] = "If I am not an apostle to others, at least I am to you, because you are the seal of my apostleship in the Lord.";
csb[3] = "My defense to those who examine me is this:";
csb[4] = "Don\'t we have the right to eat and drink?";
csb[5] = "Don\'t we have the right to be accompanied by a believing wife like the other apostles, the Lord\'s brothers, and Cephas?";
csb[6] = "Or do only Barnabas and I have no right to refrain from working?";
csb[7] = "Who serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink the milk from the flock?";
csb[8] = "Am I saying this from a human perspective? Doesn\'t the law also say the same thing?";
csb[9] = "For it is written in the law of Moses, Do not muzzle an ox while it treads out grain. Is God really concerned about oxen?";
csb[10] = "Isn\'t he really saying it for our sake? Yes, this is written for our sake, because he who plows ought to plow in hope, and he who threshes should thresh in hope of sharing the crop.";
csb[11] = "If we have sown spiritual things for you, is it too much if we reap material benefits from you?";
csb[12] = "If others have this right to receive benefits from you, don\'t we even more? Nevertheless, we have not made use of this right; instead, we endure everything so that we will not hinder the gospel of Christ.";
csb[13] = "Don\'t you know that those who perform the temple services eat the food from the temple, and those who serve at the altar share in the offerings of the altar?";
csb[14] = "In the same way, the Lord has commanded that those who preach the gospel should earn their living by the gospel.";
csb[15] = "For my part I have used none of these rights, nor have I written these things that they may be applied in my case. For it would be better for me to die than for anyone to deprive me of my boast!";
csb[16] = "For if I preach the gospel, I have no reason to boast, because I am compelled to preach -- and woe to me if I do not preach the gospel!";
csb[17] = "For if I do this willingly, I have a reward, but if unwillingly, I am entrusted with a commission.";
csb[18] = "What then is my reward? To preach the gospel and offer it free of charge and not make full use of my rights in the gospel.";
csb[19] = "Although I am free from all and not anyone\'s slave, I have made myself a slave to everyone, in order to win more people.";
csb[20] = "To the Jews I became like a Jew, to win Jews; to those under the law, like one under the law -- though I myself am not under the law -- to win those under the law.";
csb[21] = "To those who are without the law, like one without the law -- though I am not without God\'s law but under the law of Christ -- to win those without the law.";
csb[22] = "To the weak I became weak, in order to win the weak. I have become all things to all people, so that I may by every possible means save some.";
csb[23] = "Now I do all this because of the gospel, so that I may share in the blessings.";
csb[24] = "Don\'t you know that the runners in a stadium all race, but only one receives the prize? Run in such a way to win the prize.";
csb[25] = "Now everyone who competes exercises self-control in everything. They do it to receive a perishable crown, but we an imperishable crown.";
csb[26] = "So I do not run like one who runs aimlessly or box like one beating the air.";
csb[27] = "Instead, I discipline my body and bring it under strict control, so that after preaching to others, I myself will not be disqualified.";
asv[1] = "Am I not free? am I not an apostle? have I not seen Jesus our Lord? are not ye my work in the Lord?";
asv[2] = "If to others I am not an apostle, yet at least I am to you; for the seal of mine apostleship are ye in the Lord.";
asv[3] = "My defence to them that examine me is this.";
asv[4] = "Have we no right to eat and to drink?";
asv[5] = "Have we no right to lead about a wife that is a believer, even as the rest of the apostles, and the brethren of the Lord, and Cephas?";
asv[6] = "Or I only and Barnabas, have we not a right to forbear working?";
asv[7] = "What soldier ever serveth at his own charges? who planteth a vineyard, and eateth not the fruit thereof? or who feedeth a flock, and eateth not of the milk of the flock?";
asv[8] = "Do I speak these things after the manner of men? or saith not the law also the same?";
asv[9] = "For it is written in the law of Moses, Thou shalt not muzzle the ox when he treadeth out the corn. Is it for the oxen that God careth,";
asv[10] = "or saith he it assuredly for our sake? Yea, for our sake it was written: because he that ploweth ought to plow in hope, and he that thresheth, [to thresh] in hope of partaking.";
asv[11] = "If we sowed unto you spiritual things, is it a great matter if we shall reap your carnal things?";
asv[12] = "If others partake of [this] right over you, do not we yet more? Nevertheless we did not use this right; but we bear all things, that we may cause no hindrance to the gospel of Christ.";
asv[13] = "Know ye not that they that minister about sacred things eat [of] the things of the temple, [and] they that wait upon the altar have their portion with the altar?";
asv[14] = "Even so did the Lord ordain that they that proclaim the gospel should live of the gospel.";
asv[15] = "But I have used none of these things: and I write not these things that it may be so done in my case; for [it were] good for me rather to die, than that any man should make my glorying void.";
asv[16] = "For if I preach the gospel, I have nothing to glory of; for necessity is laid upon me; for woe is unto me, if I preach not the gospel.";
asv[17] = "For if I do this of mine own will, I have a reward: but if not of mine own will, I have a stewardship intrusted to me.";
asv[18] = "What then is my reward? That, when I preach the gospel, I may make the gospel without charge, so as not to use to the full my right in the gospel.";
asv[19] = "For though I was free from all [men,] I brought myself under bondage to all, that I might gain the more.";
asv[20] = "And to the Jews I became as a Jew, that I might gain Jews; to them that are under the law, as under the law, not being myself under the law, that I might gain them that are under the law;";
asv[21] = "to them that are without law, as without law, not being without law to God, but under law to Christ, that I might gain them that are without law.";
asv[22] = "To the weak I became weak, that I might gain the weak: I am become all things to all men, that I may by all means save some.";
asv[23] = "And I do all things for the gospel\'s sake, that I may be a joint partaker thereof.";
asv[24] = "Know ye not that they that run in a race run all, but one receiveth the prize? Even so run; that ye may attain.";
asv[25] = "And every man that striveth in the games exerciseth self-control in all things. Now they [do it] to receive a corruptible crown; but we an incorruptible.";
asv[26] = "I therefore so run, as not uncertainly; so fight I, as not beating the air:";
asv[27] = "but I buffet my body, and bring it into bondage: lest by any means, after that I have preached to others, I myself should be rejected.";
dby[1] = "Am I not free? am I not an apostle? have I not seen Jesus our Lord? are not *ye* my work in [the] Lord?";
dby[2] = "If I am not an apostle to others, yet at any rate I am to you: for the seal of mine apostleship are *ye* in [the] Lord.";
dby[3] = "My defence to those who examine me is this:";
dby[4] = "Have we not a right to eat and to drink?";
dby[5] = "have we not a right to take round a sister [as] wife, as also the other apostles, and the brethren of the Lord, and Cephas?";
dby[6] = "Or *I* alone and Barnabas, have we not a right not to work?";
dby[7] = "Who ever carries on war at his own charges? who plants a vineyard and does not eat of its fruit? or who herds a flock and does not eat of the milk of the flock?";
dby[8] = "Do I speak these things as a man, or does not the law also say these things?";
dby[9] = "For in the law of Moses it is written, Thou shalt not muzzle the ox that is treading out corn. Is God occupied about the oxen,";
dby[10] = "or does he say [it] altogether for our sakes? For for our sakes it has been written, that the plougher should plough in hope, and he that treads out corn, in hope of partaking of [it].";
dby[11] = "If we have sown to you spiritual things, [is it a] great [thing] if *we* shall reap your carnal things?";
dby[12] = "If others partake of this right over you, should not rather *we*? But we have not used this right, but we bear all things, that we may put no hindrance in the way of the glad tidings of the Christ.";
dby[13] = "Do ye not know that they who labour [at] sacred things eat of the [offerings offered in the] temple; they that attend at the altar partake with the altar?";
dby[14] = "So also the Lord has ordained to those that announce the glad tidings to live of the glad tidings.";
dby[15] = "But *I* have used none of these things. Now I have not written these things that it should be thus in my case; for [it were] good for me rather to die than that any one should make vain my boast.";
dby[16] = "For if I announce the glad tidings, I have nothing to boast of; for a necessity is laid upon me; for it is woe to me if I should not announce the glad tidings.";
dby[17] = "For if I do this voluntarily, I have a reward; but if not of my own will, I am entrusted with an administration.";
dby[18] = "What is the reward then that I have? That in announcing the glad tidings I make the glad tidings costless [to others], so as not to have made use, as belonging to me, of my right in [announcing] the glad tidings.";
dby[19] = "For being free from all, I have made myself bondman to all, that I might gain the most [possible].";
dby[20] = "And I became to the Jews as a Jew, in order that I might gain the Jews: to those under law, as under law, not being myself under law, in order that I might gain those under law:";
dby[21] = "to those without law, as without law, (not as without law to God, but as legitimately subject to Christ,) in order that I might gain [those] without law.";
dby[22] = "I became to the weak, [as] weak, in order that I might gain the weak. To all I have become all things, in order that at all events I might save some.";
dby[23] = "And I do all things for the sake of the glad tidings, that I may be fellow-partaker with them.";
dby[24] = "Know ye not that they who run in [the] race-course run all, but one receives the prize? Thus run in order that ye may obtain.";
dby[25] = "But every one that contends [for a prize] is temperate in all things: *they* then indeed that they may receive a corruptible crown, but *we* an incorruptible.";
dby[26] = "*I* therefore thus run, as not uncertainly; so I combat, as not beating the air.";
dby[27] = "But I buffet my body, and lead it captive, lest [after] having preached to others I should be myself rejected.";
hnv[1] = "Am I not free? Am I not an apostle? Haven\'t I seen Yeshua the Messiah, our Lord? Aren\'t you my work in the Lord?";
hnv[2] = "If to others I am not an apostle, yet at least I am to you; for you are the seal of my apostleship in the Lord.";
hnv[3] = "My defense to those who examine me is this.";
hnv[4] = "Have we no right to eat and to drink?";
hnv[5] = "Have we no right to take along a wife who is a believer, even as the rest of the apostles, and the brothers of the Lord, and Kefa?";
hnv[6] = "Or have only Bar-Nabba and I no right to not work?";
hnv[7] = "What soldier ever serves at his own expense? Who plants a vineyard, and doesn\'t eat of its fruit? Or who feeds a flock, and doesn\'t drink from the flock\'s milk?";
hnv[8] = "Do I speak these things according to the ways of men? Or doesn\'t the law also say the same thing?";
hnv[9] = "For it is written in the law of Moshe, &quot;You shall not muzzle an ox while it treads out the grain.&quot; Is it for the oxen that God cares,";
hnv[10] = "or does he say it assuredly for our sake? Yes, it was written for our sake, because he who plows ought to plow in hope, and he who threshes in hope should partake of his hope.";
hnv[11] = "If we sowed to you spiritual things, is it a great thing if we reap your fleshly things?";
hnv[12] = "If others partake of this right over you, don\'t we yet more? Nevertheless we did not use this right, but we bear all things, that we may cause no hindrance to the Good News of Messiah.";
hnv[13] = "Don\'t you know that those who serve around sacred things eat from the things of the temple, and those who wait on the altar have their portion with the altar?";
hnv[14] = "Even so the Lord ordained that those who proclaim the Good News should live from the Good News.";
hnv[15] = "But I have used none of these things, and I don\'t write these things that it may be done so in my case; for I would rather die, than that anyone should make my boasting void.";
hnv[16] = "For if I preach the Good News, I have nothing to boast about; for necessity is laid on me; but woe is to me, if I don\'t preach the Good News.";
hnv[17] = "For if I do this of my own will, I have a reward. But if not of my own will, I have a stewardship entrusted to me.";
hnv[18] = "What then is my reward? That, when I preach the Good News, I may present the Good News of Messiah without charge, so as not to abuse my authority in the Good News.";
hnv[19] = "For though I was free from all, I brought myself under bondage to all, that I might gain the more.";
hnv[20] = "To the Yehudim I became as a Yehudi, that I might gain Yehudim; to those who are under the law, as under the law, that I might gain those who are under the law;";
hnv[21] = "to those who are without law, as without law (not being without law toward God, but under law toward Messiah), that I might win those who are without law.";
hnv[22] = "To the weak I became as weak, that I might gain the weak. I have become all things to all men, that I may by all means save some.";
hnv[23] = "Now I do this for the Good News# sake, that I may be a joint partaker of it.";
hnv[24] = "Don\'t you know that those who run in a race all run, but one receives the prize? Run like that, that you may win.";
hnv[25] = "Every man who strives in the games exercises self-control in all things. Now they do it to receive a corruptible crown, but we an incorruptible.";
hnv[26] = "I therefore run like that, as not uncertainly. I fight like that, as not beating the air,";
hnv[27] = "but I beat my body and bring it into submission, lest by any means, after I have preached to others, I myself should be rejected.";
kjv[1] = "Am I not an apostle? am I not free? have I not seen Jesus Christ our Lord? are not ye my work in the Lord?";
kjv[2] = "If I be not an apostle unto others, yet doubtless I am to you: for the seal of mine apostleship are ye in the Lord.";
kjv[3] = "Mine answer to them that do examine me is this,";
kjv[4] = "Have we not power to eat and to drink?";
kjv[5] = "Have we not power to lead about a sister, a wife, as well as other apostles, and [as] the brethren of the Lord, and Cephas?";
kjv[6] = "Or I only and Barnabas, have not we power to forbear working?";
kjv[7] = "Who goeth a warfare any time at his own charges? who planteth a vineyard, and eateth not of the fruit thereof? or who feedeth a flock, and eateth not of the milk of the flock?";
kjv[8] = "Say I these things as a man? or saith not the law the same also?";
kjv[9] = "For it is written in the law of Moses, Thou shalt not muzzle the mouth of the ox that treadeth out the corn. Doth God take care for oxen?";
kjv[10] = "Or saith he [it] altogether for our sakes? For our sakes, no doubt, [this] is written: that he that ploweth should plow in hope; and that he that thresheth in hope should be partaker of his hope.";
kjv[11] = "If we have sown unto you spiritual things, [is it] a great thing if we shall reap your carnal things?";
kjv[12] = "If others be partakers of [this] power over you, [are] not we rather? Nevertheless we have not used this power; but suffer all things, lest we should hinder the gospel of Christ.";
kjv[13] = "Do ye not know that they which minister about holy things live [of the things] of the temple? and they which wait at the altar are partakers with the altar?";
kjv[14] = "Even so hath the Lord ordained that they which preach the gospel should live of the gospel.";
kjv[15] = "But I have used none of these things: neither have I written these things, that it should be so done unto me: for [it were] better for me to die, than that any man should make my glorying void.";
kjv[16] = "For though I preach the gospel, I have nothing to glory of: for necessity is laid upon me; yea, woe is unto me, if I preach not the gospel!";
kjv[17] = "For if I do this thing willingly, I have a reward: but if against my will, a dispensation [of the gospel] is committed unto me.";
kjv[18] = "What is my reward then? [Verily] that, when I preach the gospel, I may make the gospel of Christ without charge, that I abuse not my power in the gospel.";
kjv[19] = "For though I be free from all [men], yet have I made myself servant unto all, that I might gain the more.";
kjv[20] = "And unto the Jews I became as a Jew, that I might gain the Jews; to them that are under the law, as under the law, that I might gain them that are under the law;";
kjv[21] = "To them that are without law, as without law, (being not without law to God, but under the law to Christ,) that I might gain them that are without law.";
kjv[22] = "To the weak became I as weak, that I might gain the weak: I am made all things to all [men], that I might by all means save some.";
kjv[23] = "And this I do for the gospel\'s sake, that I might be partaker thereof with [you].";
kjv[24] = "Know ye not that they which run in a race run all, but one receiveth the prize? So run, that ye may obtain.";
kjv[25] = "And every man that striveth for the mastery is temperate in all things. Now they [do it] to obtain a corruptible crown; but we an incorruptible.";
kjv[26] = "I therefore so run, not as uncertainly; so fight I, not as one that beateth the air:";
kjv[27] = "But I keep under my body, and bring [it] into subjection: lest that by any means, when I have preached to others, I myself should be a castaway.";
rsv[1] = "Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are not you my workmanship in the Lord?";
rsv[2] = "If to others I am not an apostle, at least I am to you; for you are the seal of my apostleship in the Lord.";
rsv[3] = "This is my defense to those who would examine me.";
rsv[4] = "Do we not have the right to our food and drink?";
rsv[5] = "Do we not have the right to be accompanied by a wife, as the other apostles and the brothers of the Lord and Cephas?";
rsv[6] = "Or is it only Barnabas and I who have no right to refrain from working for a living?";
rsv[7] = "Who serves as a soldier at his own expense? Who plants a vineyard without eating any of its fruit? Who tends a flock without getting some of the milk?";
rsv[8] = "Do I say this on human authority? Does not the law say the same?";
rsv[9] = "For it is written in the law of Moses, &quot;You shall not muzzle an ox when it is treading out the grain.&quot; Is it for oxen that God is concerned?";
rsv[10] = "Does he not speak entirely for our sake? It was written for our sake, because the plowman should plow in hope and the thresher thresh in hope of a share in the crop.";
rsv[11] = "If we have sown spiritual good among you, is it too much if we reap your material benefits?";
rsv[12] = "If others share this rightful claim upon you, do not we still more? Nevertheless, we have not made use of this right, but we endure anything rather than put an obstacle in the way of the gospel of Christ.";
rsv[13] = "Do you not know that those who are employed in the temple service get their food from the temple, and those who serve at the altar share in the sacrificial offerings?";
rsv[14] = "In the same way, the Lord commanded that those who proclaim the gospel should get their living by the gospel.";
rsv[15] = "But I have made no use of any of these rights, nor am I writing this to secure any such provision. For I would rather die than have any one deprive me of my ground for boasting.";
rsv[16] = "For if I preach the gospel, that gives me no ground for boasting. For necessity is laid upon me. Woe to me if I do not preach the gospel!";
rsv[17] = "For if I do this of my own will, I have a reward; but if not of my own will, I am entrusted with a commission.";
rsv[18] = "What then is my reward? Just this: that in my preaching I may make the gospel free of charge, not making full use of my right in the gospel.";
rsv[19] = "For though I am free from all men, I have made myself a slave to all, that I might win the more.";
rsv[20] = "To the Jews I became as a Jew, in order to win Jews; to those under the law I became as one under the law--though not being myself under the law--that I might win those under the law.";
rsv[21] = "To those outside the law I became as one outside the law--not being without law toward God but under the law of Christ--that I might win those outside the law.";
rsv[22] = "To the weak I became weak, that I might win the weak. I have become all things to all men, that I might by all means save some.";
rsv[23] = "I do it all for the sake of the gospel, that I may share in its blessings.";
rsv[24] = "Do you not know that in a race all the runners compete, but only one receives the prize? So run that you may obtain it.";
rsv[25] = "Every athlete exercises self-control in all things. They do it to receive a perishable wreath, but we an imperishable.";
rsv[26] = "Well, I do not run aimlessly, I do not box as one beating the air;";
rsv[27] = "but I pommel my body and subdue it, lest after preaching to others I myself should be disqualified.";
vul[1] = "non sum liber non sum apostolus nonne Iesum Dominum nostrum vidi non opus meum vos estis in Domino";
vul[2] = "si aliis non sum apostolus sed tamen vobis sum nam signaculum apostolatus mei vos estis in Domino";
vul[3] = "mea defensio apud eos qui me interrogant haec est";
vul[4] = "numquid non habemus potestatem manducandi et bibendi";
vul[5] = "numquid non habemus potestatem sororem mulierem circumducendi sicut et ceteri apostoli et fratres Domini et Cephas";
vul[6] = "aut solus ego et Barnabas non habemus potestatem hoc operandi";
vul[7] = "quis militat suis stipendiis umquam quis plantat vineam et fructum eius non edit quis pascit gregem et de lacte gregis non manducat";
vul[8] = "numquid secundum hominem haec dico an et lex haec non dicit";
vul[9] = "scriptum est enim in lege Mosi non alligabis os bovi trituranti numquid de bubus cura est Deo";
vul[10] = "an propter nos utique dicit nam propter nos scripta sunt quoniam debet in spe qui arat arare et qui triturat in spe fructus percipiendi";
vul[11] = "si nos vobis spiritalia seminavimus magnum est si nos carnalia vestra metamus";
vul[12] = "si alii potestatis vestrae participes sunt non potius nos sed non usi sumus hac potestate sed omnia sustinemus ne quod offendiculum demus evangelio Christi";
vul[13] = "nescitis quoniam qui in sacrario operantur quae de sacrario sunt edunt qui altario deserviunt cum altario participantur";
vul[14] = "ita et Dominus ordinavit his qui evangelium adnuntiant de evangelio vivere";
vul[15] = "ego autem nullo horum usus sum non scripsi autem haec ut ita fiant in me bonum est enim mihi magis mori quam ut gloriam meam quis evacuet";
vul[16] = "nam si evangelizavero non est mihi gloria necessitas enim mihi incumbit vae enim mihi est si non evangelizavero";
vul[17] = "si enim volens hoc ago mercedem habeo si autem invitus dispensatio mihi credita est";
vul[18] = "quae est ergo merces mea ut evangelium praedicans sine sumptu ponam evangelium ut non abutar potestate mea in evangelio";
vul[19] = "nam cum liber essem ex omnibus omnium me servum feci ut plures lucri facerem";
vul[20] = "et factus sum Iudaeis tamquam Iudaeus ut Iudaeos lucrarer";
vul[21] = "his qui sub lege sunt quasi sub lege essem cum ipse non essem sub lege ut eos qui sub lege erant lucri facerem his qui sine lege erant tamquam sine lege essem cum sine lege Dei non essem sed in lege essem Christi ut lucri facerem eos qui sine lege erant";
vul[22] = "factus sum infirmis infirmus ut infirmos lucri facerem omnibus omnia factus sum ut omnes facerem salvos";
vul[23] = "omnia autem facio propter evangelium ut particeps eius efficiar";
vul[24] = "nescitis quod hii qui in stadio currunt omnes quidem currunt sed unus accipit bravium sic currite ut conprehendatis";
vul[25] = "omnis autem qui in agone contendit ab omnibus se abstinet et illi quidem ut corruptibilem coronam accipiant nos autem incorruptam";
vul[26] = "ego igitur sic curro non quasi in incertum sic pugno non quasi aerem verberans";
vul[27] = "sed castigo corpus meum et in servitutem redigo ne forte cum aliis praedicaverim ipse reprobus efficiar";

web[8] = "Do I say these things as a man? or saith not the law the same also?";
web[9] = "For it is written in the law of Moses, Thou shalt not muzzle the mouth of the ox that treadeth out the corn. Doth God take care for oxen?";
web[10] = "Or saith he [this] altogether for our sakes? for our sakes, no doubt, [this] is written: that he that ploweth should plow in hope; and that he that thresheth in hope should be partaker of his hope.";
web[11] = "If we have sown to you spiritual things, [is it] a great thing if we shall reap your carnal things?";
web[12] = "If others are partakers of [this] power over you, [are] not we rather? Nevertheless we have not used this power; but suffer all things, lest we should hinder the gospel of Christ.";
web[13] = "Do ye not know that they who minister about holy things live [from the things] of the temple, and they who wait at the altar are partakers with the altar?";
web[14] = "Even so hath the Lord ordained that they who preach the gospel should live by the gospel.";
web[15] = "But I have used none of these things: neither have I written these things, that it should be so done to me: for [it were] better for me to die, than that any man should make my glorying void.";
web[16] = "For though I preach the gospel, I have nothing to boast of: for necessity is laid upon me; and woe is to me, if I preach not the gospel!";
web[17] = "For if I do this thing willingly, I have a reward: but if against my will, a dispensation [of the gospel] is committed to me.";
web[18] = "What is my reward then? [Verily] that, when I preach the gospel, I may make the gospel of Christ without charge, that I may not abuse my power in the gospel.";
web[19] = "For though I am free from all [men], yet I have made myself servant to all, that I might gain the more.";
web[20] = "And to the Jews I became as a Jew, that I might gain the Jews; to them that are under the law, as under the law, that I might gain them that are under the law;";
web[21] = "To them that are without law, as without law, (being not without law to God, but under the law to Christ,) that I might gain them that are without law.";
web[22] = "To the weak I became as weak, that I might gain the weak: I have become all things to all [men], that I might by all means save some.";
web[23] = "And this I do for the gospel\'s sake, that I may be partaker of it with [you].";
web[24] = "Know ye not, that they who run in a race, all run, but one receiveth the prize? So run, that ye may obtain.";
web[25] = "And every man that striveth for the mastery is temperate in all things. Now they [do it] to obtain a corruptible crown; but we an incorruptible.";
web[26] = "I therefore so run, not as uncertainly; so I fight, not as one that beateth the air:";
web[27] = "But I keep under my body, and bring [it] into subjection: lest by any means when I have preached to others, I myself should be a cast-away.";
yng[1] = "Am not I an apostle? am not I free? Jesus Christ our Lord have I not seen? my work are not ye in the Lord?";
yng[2] = "if to others I am not an apostle -- yet doubtless to you I am; for the seal of my apostleship are ye in the Lord.";
yng[3] = "My defence to those who examine me in this;";
yng[4] = "have we not authority to eat and to drink?";
yng[5] = "have we not authority a sister -- a wife -- to lead about, as also the other apostles, and the brethren of the Lord, and Cephas?";
yng[6] = "or only I and Barnabas, have we not authority -- not to work?";
yng[7] = "who doth serve as a soldier at his own charges at any time? who doth plant a vineyard, and of its fruit doth not eat? or who doth feed a flock, and of the milk of the flock doth not eat?";
yng[8] = "According to man do I speak these things? or doth not also the law say these things?";
yng[9] = "for in the law of Moses it hath been written, `thou shalt not muzzle an ox treading out corn;\' for the oxen doth God care?";
yng[10] = "or because of us by all means doth He say [it]? yes, because of us it was written, because in hope ought the plower to plow, and he who is treading [ought] of his hope to partake in hope.";
yng[11] = "If we to you the spiritual things did sow -- great [is it] if we your fleshly things do reap?";
yng[12] = "if others do partake of the authority over you -- not we more? but we did not use this authority, but all things we bear, that we may give no hindrance to the good news of the Christ.";
yng[13] = "Have ye not known that those working about the things of the temple -- of the temple do eat, and those waiting at the altar -- with the altar are partakers?";
yng[14] = "so also did the Lord direct to those proclaiming the good news: of the good news to live.";
yng[15] = "And I have used none of these things; neither did I write these things that it may be so done in my case, for [it is] good for me rather to die, than that any one may make my glorying void;";
yng[16] = "for if I may proclaim good news, it is no glorying for me, for necessity is laid upon me, and wo is to me if I may not proclaim good news;";
yng[17] = "for if willing I do this, I have a reward; and if unwillingly -- with a stewardship I have been entrusted!";
yng[18] = "What, then, is my reward? -- that proclaiming good news, without charge I shall make the good news of the Christ, not to abuse my authority in the good news;";
yng[19] = "for being free from all men, to all men I made myself servant, that the more I might gain;";
yng[20] = "and I became to the Jews as a Jew, that Jews I might gain; to those under law as under law, that those under law I might gain;";
yng[21] = "to those without law, as without law -- (not being without law to God, but within law to Christ) -- that I might gain those without law;";
yng[22] = "I became to the infirm as infirm, that the infirm I might gain; to all men I have become all things, that by all means I may save some.";
yng[23] = "And this I do because of the good news, that a fellow-partaker of it I may become;";
yng[24] = "have ye not known that those running in a race -- all indeed run, but one doth receive the prize? so run ye, that ye may obtain;";
yng[25] = "and every one who is striving, is in all things temperate; these, indeed, then, that a corruptible crown they may receive, but we an incorruptible;";
yng[26] = "I, therefore, thus run, not as uncertainly, thus I fight, as not beating air;";
yng[27] = "but I chastise my body, and bring [it] into servitude, lest by any means, having preached to others -- I myself may become disapproved.";
</script>
