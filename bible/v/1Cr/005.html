csb[1] = "It is actually reported that there is sexual immorality among you, and the kind of sexual immorality that is not even tolerated among the Gentiles -- a man is sleeping with his father\'s wife.";
csb[2] = "And you are arrogant! Shouldn\'t you be filled with grief and remove from your congregation the one who did this?";
csb[3] = "Even though I am absent in the body, I am present in spirit. As one who is present with you in this way, I have already pronounced judgment on the one who has been doing such a thing.";
csb[4] = "When you are assembled in the name of our Lord Jesus, and I am with you in spirit, with the power of our Lord Jesus,";
csb[5] = "hand that one over to Satan for the destruction of the flesh, so that his spirit may be saved in the day of the Lord.";
csb[6] = "Your boasting is not good. Don\'t you know that a little leaven leavens the whole batch of dough?";
csb[7] = "Clean out the old leaven so that you may be a new unleavened batch, as indeed you are. For Christ our Passover lamb has been sacrificed.";
csb[8] = "Therefore, let us observe the feast, not with old leaven or with the leaven of malice and evil, but with the unleavened bread of sincerity and truth.";
csb[9] = "I wrote to you in a letter not to associate with sexually immoral people.";
csb[10] = "I did not mean the immoral people of this world or the greedy and swindlers or idolaters; otherwise you would have to leave the world.";
csb[11] = "But actually, I wrote you not to associate with anyone who claims to be a brother or sister and is sexually immoral or greedy, an idolater or verbally abusive, a drunkard or a swindler. Do not even eat with such a person.";
csb[12] = "For what business is it of mine to judge outsiders? Don\'t you judge those who are inside?";
csb[13] = "God judges outsiders. Remove the evil person from among you.";
asv[1] = "It is actually reported that there is fornication among you, and such fornication as is not even among the Gentiles, that one [of you] hath his father\'s wife.";
asv[2] = "And ye are puffed up, and did not rather mourn, that he that had done this deed might be taken away from among you.";
asv[3] = "For I verily, being absent in body but present in spirit, have already as though I were present judged him that hath so wrought this thing,";
asv[4] = "in the name of our Lord Jesus, ye being gathered together, and my spirit, with the power of our Lord Jesus,";
asv[5] = "to deliver such a one unto Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord Jesus.";
asv[6] = "Your glorying is not good. Know ye not that a little leaven leaveneth the whole lump?";
asv[7] = "Purge out the old leaven, that ye may be a new lump, even as ye are unleavened. For our passover also hath been sacrificed, [even] Christ:";
asv[8] = "wherefore let us keep the feast, not with old leaven, neither with the leaven of malice and wickedness, but with the unleavened bread of sincerity and truth.";
asv[9] = "I wrote unto you in my epistle to have no company with fornicators;";
asv[10] = "not at all [meaning] with the fornicators of this world, or with the covetous and extortioners, or with idolaters; for then must ye needs go out of the world:";
asv[11] = "but as it is, I wrote unto you not to keep company, if any man that is named a brother be a fornicator, or covetous, or an idolater, or a reviler, or a drunkard, or an extortioner; with such a one no, not to eat.";
asv[12] = "For what have I to do with judging them that are without? Do not ye judge them that are within?";
asv[13] = "But them that are without God judgeth. Put away the wicked man from among yourselves.";
dby[1] = "It is universally reported [that there is] fornication among you, and such fornication as [is] not even among the nations, so that one should have his father\'s wife.";
dby[2] = "And *ye* are puffed up, and ye have not rather mourned, in order that he that has done this deed might be taken away out of the midst of you.";
dby[3] = "For *I*, [as] absent in body but present in spirit, have already judged as present,";
dby[4] = "[to deliver,] in the name of our Lord Jesus Christ (ye and my spirit being gathered together, with the power of our Lord Jesus Christ), him that has so wrought this:";
dby[5] = "to deliver him, [I say,] [being] such, to Satan for destruction of the flesh, that the spirit may be saved in the day of the Lord Jesus.";
dby[6] = "Your boasting [is] not good. Do ye not know that a little leaven leavens the whole lump?";
dby[7] = "Purge out the old leaven, that ye may be a new lump, according as ye are unleavened. For also our passover, Christ, has been sacrificed;";
dby[8] = "so that let us celebrate the feast, not with old leaven, nor with leaven of malice and wickedness, but with unleavened [bread] of sincerity and truth.";
dby[9] = "I have written to you in the epistle not to mix with fornicators;";
dby[10] = "not altogether with the fornicators of this world, or with the avaricious and rapacious, or idolaters, since [then] ye should go out of the world.";
dby[11] = "But now I have written to you, if any one called brother be fornicator, or avaricious, or idolater, or abusive, or a drunkard, or rapacious, not to mix with [him]; with such a one not even to eat.";
dby[12] = "For what have *I* [to do] with judging those outside also? *ye*, do not ye judge them that are within?";
dby[13] = "But those without God judges. Remove the wicked person from amongst yourselves.";
hnv[1] = "It is actually reported that there is sexual immorality among you, and such sexual immorality as is not even named among the Goyim, that one has his father\'s wife.";
hnv[2] = "You are puffed up, and didn\'t rather mourn, that he who had done this deed might be removed from among you.";
hnv[3] = "For I most assuredly, as being absent in body but present in spirit, have already, as though I were present, judged him who has done this thing.";
hnv[4] = "In the name of our Lord Yeshua the Messiah, you being gathered together, and my spirit, with the power of our Lord Yeshua the Messiah,";
hnv[5] = "are to deliver such a one to Hasatan for the destruction of the flesh, that the spirit may be saved in the day of the Lord Yeshua.";
hnv[6] = "Your boasting is not good. Don\'t you know that a little yeast leavens the whole lump?";
hnv[7] = "Purge out the old yeast, that you may be a new lump, even as you are unleavened. For indeed Messiah, our Pesach, has been sacrificed in our place.";
hnv[8] = "Therefore let us keep the feast, not with old yeast, neither with the yeast of malice and wickedness, but with the matzah of sincerity and truth.";
hnv[9] = "I wrote to you in my letter to have no company with sexual sinners;";
hnv[10] = "yet not at all meaning with the sexual sinners of this world, or with the covetous and extortioners, or with idolaters; for then you would have to leave the world.";
hnv[11] = "But as it is, I wrote to you not to associate with anyone who is called a brother who is a sexual sinner, or covetous, or an idolater, or a slanderer, or a drunkard, or an extortioner. Don\'t even eat with such a person.";
hnv[12] = "For what have I to do with also judging those who are outside? Don\'t you judge those who are within?";
hnv[13] = "But those who are outside, God judges. &quot;Put away the wicked man from among yourselves.&quot;";

kjv[5] = "To deliver such an one unto Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord Jesus.";

kjv[7] = "Purge out therefore the old leaven, that ye may be a new lump, as ye are unleavened. For even Christ our passover is sacrificed for us:";

kjv[11] = "But now I have written unto you not to keep company, if any man that is called a brother be a fornicator, or covetous, or an idolater, or a railer, or a drunkard, or an extortioner; with such an one no not to eat.";

rsv[1] = "It is actually reported that there is immorality among you, and of a kind that is not found even among pagans; for a man is living with his father\'s wife.";
rsv[2] = "And you are arrogant! Ought you not rather to mourn? Let him who has done this be removed from among you.";
rsv[3] = "For though absent in body I am present in spirit, and as if present, I have already pronounced judgment";
rsv[4] = "in the name of the Lord Jesus on the man who has done such a thing. When you are assembled, and my spirit is present, with the power of our Lord Jesus,";
rsv[5] = "you are to deliver this man to Satan for the destruction of the flesh, that his spirit may be saved in the day of the Lord Jesus.";
rsv[6] = "Your boasting is not good. Do you not know that a little leaven leavens the whole lump?";
rsv[7] = "Cleanse out the old leaven that you may be a new lump, as you really are unleavened. For Christ, our paschal lamb, has been sacrificed.";
rsv[8] = "Let us, therefore, celebrate the festival, not with the old leaven, the leaven of malice and evil, but with the unleavened bread of sincerity and truth.";
rsv[9] = "I wrote to you in my letter not to associate with immoral men;";
rsv[10] = "not at all meaning the immoral of this world, or the greedy and robbers, or idolaters, since then you would need to go out of the world.";
rsv[11] = "But rather I wrote to you not to associate with any one who bears the name of brother if he is guilty of immorality or greed, or is an idolater, reviler, drunkard, or robber--not even to eat with such a one.";
rsv[12] = "For what have I to do with judging outsiders? Is it not those inside the church whom you are to judge?";
rsv[13] = "God judges those outside. &quot;Drive out the wicked person from among you.&quot;";
vul[1] = "omnino auditur inter vos fornicatio et talis fornicatio qualis nec inter gentes ita ut uxorem patris aliquis habeat";
vul[2] = "et vos inflati estis et non magis luctum habuistis ut tollatur de medio vestrum qui hoc opus fecit";
vul[3] = "ego quidem absens corpore praesens autem spiritu iam iudicavi ut praesens eum qui sic operatus est";
vul[4] = "in nomine Domini nostri Iesu Christi congregatis vobis et meo spiritu cum virtute Domini Iesu";
vul[5] = "tradere huiusmodi Satanae in interitum carnis ut spiritus salvus sit in die Domini Iesu";
vul[6] = "non bona gloriatio vestra nescitis quia modicum fermentum totam massam corrumpit";
vul[7] = "expurgate vetus fermentum ut sitis nova consparsio sicut estis azymi etenim pascha nostrum immolatus est Christus";
vul[8] = "itaque epulemur non in fermento veteri neque in fermento malitiae et nequitiae sed in azymis sinceritatis et veritatis";
vul[9] = "scripsi vobis in epistula ne commisceamini fornicariis";
vul[10] = "non utique fornicariis huius mundi aut avaris aut rapacibus aut idolis servientibus alioquin debueratis de hoc mundo exisse";
vul[11] = "nunc autem scripsi vobis non commisceri si is qui frater nominatur est fornicator aut avarus aut idolis serviens aut maledicus aut ebriosus aut rapax cum eiusmodi nec cibum sumere";
vul[12] = "quid enim mihi de his qui foris sunt iudicare nonne de his qui intus sunt vos iudicatis";
vul[13] = "nam eos qui foris sunt Deus iudicabit auferte malum ex vobis ipsis";
