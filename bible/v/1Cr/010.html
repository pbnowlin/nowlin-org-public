csb[1] = "Now I do not want you to be unaware, brothers and sisters, that our ancestors were all under the cloud, all passed through the sea,";
csb[2] = "and all were baptized into Moses in the cloud and in the sea.";
csb[3] = "They all ate the same spiritual food,";
csb[4] = "and all drank the same spiritual drink. For they drank from the spiritual rock that followed them, and that rock was Christ.";
csb[5] = "Nevertheless God was not pleased with most of them, since they were struck down in the wilderness.";
csb[6] = "Now these things took place as examples for us, so that we will not desire evil things as they did.";
csb[7] = "Don\'t become idolaters as some of them were; as it is written, The people sat down to eat and drink, and got up to party.";
csb[8] = "Let us not commit sexual immorality as some of them did, and in a single day twenty-three thousand people died.";
csb[9] = "Let us not test Christ as some of them did and were destroyed by snakes.";
csb[10] = "And don\'t complain as some of them did, and were killed by the destroyer.";
csb[11] = "These things happened to them as examples, and they were written for our instruction, on whom the ends of the ages have come.";
csb[12] = "So, whoever thinks he stands must be careful not to fall.";
csb[13] = "No temptation has come upon you except what is common to humanity. But God is faithful; he will not allow you to be tempted beyond what you are able, but with the temptation he will also provide a way out so that you may be able to bear it.";
csb[14] = "So then, my dear friends, flee from idolatry.";
csb[15] = "I am speaking as to sensible people. Judge for yourselves what I am saying.";
csb[16] = "The cup of blessing that we bless, is it not a sharing in the blood of Christ? The bread that we break, is it not a sharing in the body of Christ?";
csb[17] = "Because there is one bread, we who are many are one body, since all of us share the one bread.";
csb[18] = "Consider the people of Israel. Do not those who eat the sacrifices participate in the altar?";
csb[19] = "What am I saying then? That food sacrificed to idols is anything, or that an idol is anything?";
csb[20] = "No, but I do say that what they sacrifice, they sacrifice to demons and not to God. I do not want you to be participants with demons!";
csb[21] = "You cannot drink the cup of the Lord and the cup of demons. You cannot share in the Lord\'s table and the table of demons.";
csb[22] = "Or are we provoking the Lord to jealousy? Are we stronger than he?";
csb[23] = "&quot;Everything is permissible,&quot; but not everything is beneficial. &quot;Everything is permissible,&quot; but not everything builds up.";
csb[24] = "No one is to seek his own good, but the good of the other person.";
csb[25] = "Eat everything that is sold in the meat market, without raising questions for the sake of conscience,";
csb[26] = "since the earth is the Lord\'s, and all that is in it.";
csb[27] = "If any of the unbelievers invites you over and you want to go, eat everything that is set before you, without raising questions for the sake of conscience.";
csb[28] = "But if someone says to you, &quot;This is food from a sacrifice,&quot; do not eat it, out of consideration for the one who told you, and for the sake of conscience.";
csb[29] = "I do not mean your own conscience, but the other person\'s. For why is my freedom judged by another person\'s conscience?";
csb[30] = "If I partake with thanksgiving, why am I criticized because of something for which I give thanks?";
csb[31] = "So, whether you eat or drink, or whatever you do, do everything for the glory of God.";
csb[32] = "Give no offense to Jews or Greeks or the church of God,";
csb[33] = "just as I also try to please everyone in everything, not seeking my own benefit, but the benefit of many, so that they may be saved.";
asv[1] = "For I would not, brethren, have you ignorant, that our fathers were all under the cloud, and all passed through the sea;";
asv[2] = "and were all baptized unto Moses in the cloud and in the sea;";
asv[3] = "and did all eat the same spiritual food;";
asv[4] = "and did all drink the same spiritual drink: for they drank of a spiritual rock that followed them: and the rock was Christ.";
asv[5] = "Howbeit with most of them God was not well pleased: for they were overthrown in the wilderness.";
asv[6] = "Now these things were our examples, to the intent we should not lust after evil things, as they also lusted.";
asv[7] = "Neither be ye idolaters, as were some of them; as it is written, The people sat down to eat and drink, and rose up to play.";
asv[8] = "Neither let us commit fornication, as some of them committed, and fell in one day three and twenty thousand.";
asv[9] = "Neither let us make trial of the Lord, as some of them made trial, and perished by the serpents.";
asv[10] = "Neither murmur ye, as some of them murmured, and perished by the destroyer.";
asv[11] = "Now these things happened unto them by way of example; and they were written for our admonition, upon whom the ends of the ages are come.";
asv[12] = "Wherefore let him that thinketh he standeth take heed lest he fall.";
asv[13] = "There hath no temptation taken you but such as man can bear: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation make also the way of escape, that ye may be able to endure it.";
asv[14] = "Wherefore, my beloved, flee from idolatry.";
asv[15] = "I speak as to wise men; judge ye what I say.";
asv[16] = "The cup of blessing which we bless, is it not a communion of the blood of Christ? The bread which we break, is it not a communion of the body of Christ?";
asv[17] = "seeing that we, who are many, are one bread, one body: for we all partake of the one bread.";
asv[18] = "Behold Israel after the flesh: have not they that eat the sacrifices communion with the altar?";
asv[19] = "What say I then? that a thing sacrificed to idols is anything, or that an idol is anything?";
asv[20] = "But [I say], that the things which the Gentiles sacrifice, they sacrifice to demons, and not to God: and I would not that ye should have communion with demons.";
asv[21] = "Ye cannot drink the cup of the Lord, and the cup of demons: ye cannot partake of the table of the Lord, and of the table of demons.";
asv[22] = "Or do we provoke the Lord to jealousy? are we stronger than he?";
asv[23] = "All things are lawful; but not all things are expedient. All things are lawful; but not all things edify.";
asv[24] = "Let no man seek his own, but [each] his neighbor\'s [good].";
asv[25] = "Whatsoever is sold in the shambles, eat, asking no question for conscience\' sake;";
asv[26] = "for the earth is the Lord\'s, and the fulness thereof.";
asv[27] = "If one of them that believe not biddeth you [to a feast], and ye are disposed to go; whatsoever is set before you, eat, asking no question for conscience\' sake.";
asv[28] = "But if any man say unto you, This hath been offered in sacrifice, eat not, for his sake that showed it, and for conscience\' sake:";
asv[29] = "conscience, I say, not thine own, but the other\'s; for why is my liberty judged by another conscience?";
asv[30] = "If I partake with thankfulness, why am I evil spoken of for that for which I give thanks?";
asv[31] = "Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.";
asv[32] = "Give no occasion of stumbling, either to Jews, or to Greeks, or to the church of God:";
asv[33] = "even as I also please all men in all things, not seeking mine own profit, but the [profit] of the many, that they may be saved.";

hnv[1] = "Now I would not have you ignorant, brothers, that our fathers were all under the cloud, and all passed through the sea;";
hnv[2] = "and were all immersed into Moshe in the cloud and in the sea;";
hnv[3] = "and all ate the same spiritual food;";
hnv[4] = "and all drank the same spiritual drink. For they drank of a spiritual rock that followed them, and the rock was Messiah.";
hnv[5] = "However with most of them, God was not well pleased, for they were overthrown in the wilderness.";
hnv[6] = "Now these things were our examples, to the intent we should not lust after evil things, as they also lusted.";
hnv[7] = "Neither be idolaters, as some of them were. As it is written, &quot;The people sat down to eat and drink, and rose up to play.&quot;";
hnv[8] = "Neither let us commit sexual immorality, as some of them committed, and in one day twenty-three thousand fell.";
hnv[9] = "Neither let us test the Lord, as some of them tested, and perished by the serpents.";
hnv[10] = "Neither grumble, as some of them also grumbled, and perished by the destroyer.";
hnv[11] = "Now all these things happened to them by way of example, and they were written for our admonition, on whom the ends of the ages have come.";
hnv[12] = "Therefore let him who thinks he stands be careful that he doesn\'t fall.";
hnv[13] = "No temptation has taken you but such as man can bear. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it.";
hnv[14] = "Therefore, my beloved, flee from idolatry.";
hnv[15] = "I speak as to wise men. Judge what I say.";

hnv[17] = "Because we, who are many, are one bread, one body; for we all partake of the one bread.";
hnv[18] = "Consider Yisra\'el after the flesh. Don\'t those who eat the sacrifices have communion with the altar?";
hnv[19] = "What am I saying then? That a thing sacrificed to idols is anything, or that an idol is anything?";
hnv[20] = "But I say that the things which the Goyim sacrifice, they sacrifice to demons, and not to God, and I don\'t desire that you would have communion with demons.";
hnv[21] = "You can\'t both drink the cup of the Lord and the cup of demons. You can\'t both partake of the table of the Lord, and of the table of demons.";
hnv[22] = "Or do we provoke the Lord to jealousy? Are we stronger than he?";
hnv[23] = "&quot;All things are lawful for me,&quot; but not all things are profitable. &quot;All things are lawful for me,&quot; but not all things build up.";
hnv[24] = "Let no one seek his own, but each one his neighbor\'s good.";
hnv[25] = "Whatever is sold in the butcher shop, eat, asking no question for the sake of conscience,";
hnv[26] = "for &quot;the eretz is the Lord\'s, and its fullness.&quot;";
hnv[27] = "But if one of those who don\'t believe invites you to a meal, and you are inclined to go, eat whatever is set before you, asking no questions for the sake of conscience.";
hnv[28] = "But if anyone says to you, &quot;This was offered to idols,&quot; don\'t eat it for the sake of the one who told you, and for the sake of conscience. For &quot;the eretz is the Lord\'s, and all its fullness.&quot;";
hnv[29] = "Conscience, I say, not your own, but the other\'s conscience. For why is my liberty judged by another conscience?";

rsv[1] = "I want you to know, brethren, that our fathers were all under the cloud, and all passed through the sea,";
rsv[2] = "and all were baptized into Moses in the cloud and in the sea,";
rsv[3] = "and all ate the same supernatural food";
rsv[4] = "and all drank the same supernatural drink. For they drank from the supernatural Rock which followed them, and the Rock was Christ.";
rsv[5] = "Nevertheless with most of them God was not pleased; for they were overthrown in the wilderness.";
rsv[6] = "Now these things are warnings for us, not to desire evil as they did.";
rsv[7] = "Do not be idolaters as some of them were; as it is written, &quot;The people sat down to eat and drink and rose up to dance.&quot;";
rsv[8] = "We must not indulge in immorality as some of them did, and twenty-three thousand fell in a single day.";
rsv[9] = "We must not put the Lord to the test, as some of them did and were destroyed by serpents;";
rsv[10] = "nor grumble, as some of them did and were destroyed by the Destroyer.";
rsv[11] = "Now these things happened to them as a warning, but they were written down for our instruction, upon whom the end of the ages has come.";
rsv[12] = "Therefore let any one who thinks that he stands take heed lest he fall.";
rsv[13] = "No temptation has overtaken you that is not common to man. God is faithful, and he will not let you be tempted beyond your strength, but with the temptation will also provide the way of escape, that you may be able to endure it.";
rsv[14] = "Therefore, my beloved, shun the worship of idols.";
rsv[15] = "I speak as to sensible men; judge for yourselves what I say.";
rsv[16] = "The cup of blessing which we bless, is it not a participation in the blood of Christ? The bread which we break, is it not a participation in the body of Christ?";
rsv[17] = "Because there is one bread, we who are many are one body, for we all partake of the one bread.";
rsv[18] = "Consider the people of Israel; are not those who eat the sacrifices partners in the altar?";
rsv[19] = "What do I imply then? That food offered to idols is anything, or that an idol is anything?";
rsv[20] = "No, I imply that what pagans sacrifice they offer to demons and not to God. I do not want you to be partners with demons.";
rsv[21] = "You cannot drink the cup of the Lord and the cup of demons. You cannot partake of the table of the Lord and the table of demons.";
rsv[22] = "Shall we provoke the Lord to jealousy? Are we stronger than he?";
rsv[23] = "&quot;All things are lawful,&quot; but not all things are helpful. &quot;All things are lawful,&quot; but not all things build up.";
rsv[24] = "Let no one seek his own good, but the good of his neighbor.";
rsv[25] = "Eat whatever is sold in the meat market without raising any question on the ground of conscience.";
rsv[26] = "For &quot;the earth is the Lord\'s, and everything in it.&quot;";
rsv[27] = "If one of the unbelievers invites you to dinner and you are disposed to go, eat whatever is set before you without raising any question on the ground of conscience.";
rsv[28] = "(But if some one says to you, &quot;This has been offered in sacrifice,&quot; then out of consideration for the man who informed you, and for conscience\' sake--";
rsv[29] = "I mean his conscience, not yours--do not eat it.) For why should my liberty be determined by another man\'s scruples?";
rsv[30] = "If I partake with thankfulness, why am I denounced because of that for which I give thanks?";
rsv[31] = "So, whether you eat or drink, or whatever you do, do all to the glory of God.";
rsv[32] = "Give no offense to Jews or to Greeks or to the church of God,";
rsv[33] = "just as I try to please all men in everything I do, not seeking my own advantage, but that of many, that they may be saved.";
vul[1] = "nolo enim vos ignorare fratres quoniam patres nostri omnes sub nube fuerunt et omnes mare transierunt";
vul[2] = "et omnes in Mose baptizati sunt in nube et in mari";
vul[3] = "et omnes eandem escam spiritalem manducaverunt";
vul[4] = "et omnes eundem potum spiritalem biberunt bibebant autem de spiritali consequenti eos petra petra autem erat Christus";
vul[5] = "sed non in pluribus eorum beneplacitum est Deo nam prostrati sunt in deserto";
vul[6] = "haec autem in figura facta sunt nostri ut non simus concupiscentes malorum sicut et illi concupierunt";
vul[7] = "neque idolorum cultores efficiamini sicut quidam ex ipsis quemadmodum scriptum est sedit populus manducare et bibere et surrexerunt ludere";
vul[8] = "neque fornicemur sicut quidam ex ipsis fornicati sunt et ceciderunt una die viginti tria milia";
vul[9] = "neque temptemus Christum sicut quidam eorum temptaverunt et a serpentibus perierunt";
vul[10] = "neque murmuraveritis sicut quidam eorum murmuraverunt et perierunt ab exterminatore";
vul[11] = "haec autem omnia in figura contingebant illis scripta sunt autem ad correptionem nostram in quos fines saeculorum devenerunt";
vul[12] = "itaque qui se existimat stare videat ne cadat";
vul[13] = "temptatio vos non adprehendat nisi humana fidelis autem Deus qui non patietur vos temptari super id quod potestis sed faciet cum temptatione etiam proventum ut possitis sustinere";
vul[14] = "propter quod carissimi mihi fugite ab idolorum cultura";
vul[15] = "ut prudentibus loquor vos iudicate quod dico";
vul[16] = "calicem benedictionis cui benedicimus nonne communicatio sanguinis Christi est et panis quem frangimus nonne participatio corporis Domini est";
vul[17] = "quoniam unus panis unum corpus multi sumus omnes quidem de uno pane participamur";
vul[18] = "videte Israhel secundum carnem nonne qui edunt hostias participes sunt altaris";
vul[19] = "quid ergo dico quod idolis immolatum sit aliquid aut quod idolum sit aliquid";
vul[20] = "sed quae immolant gentes daemoniis immolant et non Deo nolo autem vos socios fieri daemoniorum non potestis calicem Domini bibere et calicem daemoniorum";
vul[21] = "non potestis mensae Domini participes esse et mensae daemoniorum";
vul[22] = "an aemulamur Dominum numquid fortiores illo sumus omnia licent sed non omnia expediunt";
vul[23] = "omnia licent sed non omnia aedificant";
vul[24] = "nemo quod suum est quaerat sed quod alterius";
vul[25] = "omne quod in macello venit manducate nihil interrogantes propter conscientiam";
vul[26] = "Domini est terra et plenitudo eius";
vul[27] = "si quis vocat vos infidelium et vultis ire omne quod vobis adponitur manducate nihil interrogantes propter conscientiam";
vul[28] = "si quis autem dixerit hoc immolaticium est idolis nolite manducare propter illum qui indicavit et propter conscientiam";
vul[29] = "conscientiam autem dico non tuam sed alterius ut quid enim libertas mea iudicatur ab alia conscientia";
vul[30] = "si ego cum gratia participo quid blasphemor pro eo quod gratias ago";
vul[31] = "sive ergo manducatis sive bibitis vel aliud quid facitis omnia in gloriam Dei facite";
vul[32] = "sine offensione estote Iudaeis et gentilibus et ecclesiae Dei";
vul[33] = "sicut et ego per omnia omnibus placeo non quaerens quod mihi utile est sed quod multis ut salvi fiant";
web[1] = "Moreover, brethren, I would not that ye should be ignorant, that all our fathers were under the cloud, and all passed through the sea;";
web[2] = "And were all baptized to Moses in the cloud and in the sea;";
web[3] = "And all ate the same spiritual food;";
web[4] = "And all drank the same spiritual drink: (for they drank of that spiritual Rock that followed them: and that Rock was Christ.)";
web[5] = "But with many of them God was not well pleased: for they were overthrown in the wilderness.";
web[6] = "Now these things were our examples, to the intent we should not lust after evil things, as they also lusted.";
web[7] = "Neither be ye idolaters, as [were] some of them: as it is written, The people sat down to eat and drink, and rose up to play.";
web[8] = "Neither let us commit lewdness, as some of them committed, and fell in one day three and twenty thousand.";
web[9] = "Neither let us tempt Christ, as some of them also tempted, and were destroyed by serpents.";
web[10] = "Neither murmur ye, as some of them also murmured, and were destroyed by the destroyer.";
web[11] = "Now all these things happened to them for examples: and they are written for our admonition, upon whom the ends of the world are come.";
web[12] = "Wherefore let him that thinketh he standeth, take heed lest he fall.";
web[13] = "There hath no temptation taken you but such as is common to man: but God [is] faithful, who will not suffer you to be tempted above what ye are able; but will with the temptation also make a way to escape, that ye may be able to bear [it].";
web[14] = "Wherefore, my dearly beloved, flee from idolatry.";
web[15] = "I speak as to wise men; judge ye what I say.";
web[16] = "The cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ?";
web[17] = "For we [being] many are one bread, [and] one body: for we are all partakers of that one bread.";
web[18] = "Behold Israel after the flesh: are not they who eat of the sacrifices, partakers of the altar?";
web[19] = "What then do I say? that the idol is any thing, or that which is offered in sacrifice to idols is any thing?";
web[20] = "But [I say], that the things which the Gentiles sacrifice, they sacrifice to demons, and not to God: and I would not that ye should have fellowship with demons.";
web[21] = "Ye cannot drink the cup of the Lord, and the cup of demons: ye cannot be partakers of the Lord\'s table, and of the table of demons.";
web[22] = "Do we provoke the Lord to jealousy? are we stronger than he?";
web[23] = "All things are lawful for me, but all things are not expedient: all things are lawful for me, but all things edify not.";
web[24] = "Let no man seek his own, but every man another\'s [wealth].";
web[25] = "Whatever is sold in the provision market, [that] eat, asking no question for conscience\' sake:";
web[26] = "For the earth [is] the Lord\'s, and its fullness.";
web[27] = "If any of them that believe not invites you [to a feast], and ye are disposed to go; whatever is set before you, eat, asking no question on account of conscience.";
web[28] = "But if any man shall say to you, This is offered in sacrifice to idols, eat not for his sake that showed it, and for conscience\' sake: for the earth [is] the Lord\'s, and its fullness:";
web[29] = "Conscience, I say, not thy own, but of the other: for why is my liberty judged by another [man\'s] conscience?";
web[30] = "For if I by grace am a partaker, why am I evil spoken of for that for which I give thanks?";
web[31] = "Whether therefore ye eat or drink, or whatever ye do, do all to the glory of God.";
web[32] = "Give no offense, neither to the Jews, nor to the Gentiles, nor to the church of God:";
web[33] = "Even as I please all [men] in all [things], not seeking my own profit, but the [profit] of many, that they may be saved.";
yng[1] = "And I do not wish you to be ignorant, brethren, that all our fathers were under the cloud, and all passed through the sea,";
yng[2] = "and all to Moses were baptized in the cloud, and in the sea;";
yng[3] = "and all the same spiritual food did eat,";
yng[4] = "and all the same spiritual drink did drink, for they were drinking of a spiritual rock following them, and the rock was the Christ;";
yng[5] = "but in the most of them God was not well pleased, for they were strewn in the wilderness,";
yng[6] = "and those things became types of us, for our not passionately desiring evil things, as also these did desire.";
yng[7] = "Neither become ye idolaters, as certain of them, as it hath been written, `The people sat down to eat and to drink, and stood up to play;\'";
yng[8] = "neither may we commit whoredom, as certain of them did commit whoredom, and there fell in one day twenty-three thousand;";
yng[9] = "neither may we tempt the Christ, as also certain of them did tempt, and by the serpents did perish;";
yng[10] = "neither murmur ye, as also some of them did murmur, and did perish by the destroyer.";
yng[11] = "And all these things as types did happen to those persons, and they were written for our admonition, to whom the end of the ages did come,";
yng[12] = "so that he who is thinking to stand -- let him observe, lest he fall.";
yng[13] = "No temptation hath taken you -- except human; and God is faithful, who will not suffer you to be tempted above what ye are able, but He will make, with the temptation, also the outlet, for your being able to bear [it].";
yng[14] = "Wherefore, my beloved, flee from the idolatry;";
yng[15] = "as to wise men I speak -- judge ye what I say:";
yng[16] = "The cup of the blessing that we bless -- is it not the fellowship of the blood of the Christ? the bread that we break -- is it not the fellowship of the body of the Christ?";
yng[17] = "because one bread, one body, are we the many -- for we all of the one bread do partake.";
yng[18] = "See Israel according to the flesh! are not those eating the sacrifices in the fellowship of the altar?";
yng[19] = "what then do I say? that an idol is anything? or that a sacrifice offered to an idol is anything? --";
yng[20] = "[no,] but that the things that the nations sacrifice -- they sacrifice to demons and not to God; and I do not wish you to come into the fellowship of the demons.";
yng[21] = "Ye are not able the cup of the Lord to drink, and the cup of demons; ye are not able of the table of the Lord to partake, and of the table of demons;";
yng[22] = "do we arouse the Lord to jealousy? are we stronger than He?";
yng[23] = "All things to me are lawful, but all things are not profitable; all things to me are lawful, but all things do not build up;";
yng[24] = "let no one seek his own -- but each another\'s.";
yng[25] = "Whatever in the meat-market is sold eat ye, not inquiring, because of the conscience,";
yng[26] = "for the Lord\'s [is] the earth, and its fulness;";
yng[27] = "and if any one of the unbelieving do call you, and ye wish to go, all that is set before you eat, nothing inquiring, because of the conscience;";
yng[28] = "and if any one may say to you, `This is a thing sacrificed to an idol,\' -- do not eat, because of that one who shewed [it], and of the conscience, for the Lord\'s [is] the earth and its fulness:";
yng[29] = "and conscience, I say, not of thyself, but of the other, for why [is it] that my liberty is judged by another\'s conscience?";
yng[30] = "and if I thankfully do partake, why am I evil spoken of, for that for which I give thanks?";
yng[31] = "Whether, then, ye eat, or drink, or do anything, do all to the glory of God;";
yng[32] = "become offenceless, both to Jews and Greeks, and to the assembly of God;";
yng[33] = "as I also in all things do please all, not seeking my own profit, but that of many -- that they may be saved.";
