csb[1] = "A person should think of us in this way: as servants of Christ and managers of the mysteries of God.";
csb[2] = "In this regard, it is required that managers be found faithful.";
csb[3] = "It is of little importance to me that I should be judged by you or by any human court. In fact, I don\'t even judge myself.";
csb[4] = "For I am not conscious of anything against myself, but I am not justified by this. It is the Lord who judges me.";
csb[5] = "So don\'t judge anything prematurely, before the Lord comes, who will both bring to light what is hidden in darkness and reveal the intentions of the hearts. And then praise will come to each one from God.";
csb[6] = "Now, brothers and sisters, I have applied these things to myself and Apollos for your benefit, so that you may learn from us the meaning of the saying: &quot;Nothing beyond what is written.&quot; The purpose is that none of you will be arrogant, favoring one person over another.";
csb[7] = "For who makes you so superior? What do you have that you didn\'t receive? If, in fact, you did receive it, why do you boast as if you hadn\'t received it?";
csb[8] = "You are already full! You are already rich! You have begun to reign as kings without us -- and I wish you did reign, so that we could also reign with you!";
csb[9] = "For I think God has displayed us, the apostles, in last place, like men condemned to die: We have become a spectacle to the world, both to angels and to people.";
csb[10] = "We are fools for Christ, but you are wise in Christ! We are weak, but you are strong! You are distinguished, but we are dishonored!";
csb[11] = "Up to the present hour we are both hungry and thirsty; we are poorly clothed, roughly treated, homeless;";
csb[12] = "we labor, working with our own hands. When we are reviled, we bless; when we are persecuted, we endure it;";
csb[13] = "when we are slandered, we respond graciously. Even now, we are like the scum of the earth, like everyone\'s garbage.";
csb[14] = "I\'m not writing this to shame you, but to warn you as my dear children.";
csb[15] = "For you may have countless instructors in Christ, but you don\'t have many fathers. For I became your father in Christ Jesus through the gospel.";
csb[16] = "Therefore I urge you to imitate me.";
csb[17] = "This is why I have sent Timothy to you. He is my dearly loved and faithful child in the Lord. He will remind you about my ways in Christ Jesus, just as I teach everywhere in every church.";
csb[18] = "Now some are arrogant, as though I were not coming to you.";
csb[19] = "But I will come to you soon, if the Lord wills, and I will find out not the talk, but the power of those who are arrogant.";
csb[20] = "For the kingdom of God is not a matter of talk but of power.";
csb[21] = "What do you want? Should I come to you with a rod, or in love and a spirit of gentleness?";
asv[1] = "Let a man so account of us, as of ministers of Christ, and stewards of the mysteries of God.";
asv[2] = "Here, moreover, it is required in stewards, that a man be found faithful.";
asv[3] = "But with me it is a very small thing that I should be judged of you, or of man\'s judgment: yea, I judge not mine own self.";
asv[4] = "For I know nothing against myself; yet am I not hereby justified: but he that judgeth me is the Lord.";
asv[5] = "Wherefore judge nothing before the time, until the Lord come, who will both bring to light the hidden things of darkness, and make manifest the counsels of the hearts; and then shall each man have his praise from God.";
asv[6] = "Now these things, brethren, I have in a figure transferred to myself and Apollos for your sakes; that in us ye might learn not [to go] beyond the things which are written; that no one of you be puffed up for the one against the other.";
asv[7] = "For who maketh thee to differ? and what hast thou that thou didst not receive? but if thou didst receive it, why dost thou glory as if thou hadst not received it?";
asv[8] = "Already are ye filled, already ye are become rich, ye have come to reign without us: yea and I would that ye did reign, that we also might reign with you.";
asv[9] = "For, I think, God hath set forth us the apostles last of all, as men doomed to death: for we are made a spectacle unto the world, both to angels and men.";
asv[10] = "We are fools for Christ\'s sake, but ye are wise in Christ; we are weak, but ye are strong; ye have glory, but we have dishonor.";
asv[11] = "Even unto this present hour we both hunger, and thirst, and are naked, and are buffeted, and have no certain dwelling-place;";
asv[12] = "and we toil, working with our own hands: being reviled, we bless; being persecuted, we endure;";
asv[13] = "being defamed, we entreat: we are made as the filth of the world, the offscouring of all things, even until now.";
asv[14] = "I write not these things to shame you, but to admonish you as my beloved children.";
asv[15] = "For though ye have ten thousand tutors in Christ, yet [have ye] not many fathers; for in Christ Jesus I begat you through the gospel.";
asv[16] = "I beseech you therefore, be ye imitators of me.";
asv[17] = "For this cause have I sent unto you Timothy, who is my beloved and faithful child in the Lord, who shall put you in remembrance of my ways which are in Christ, even as I teach everywhere in every church.";
asv[18] = "Now some are puffed up, as though I were not coming to you.";
asv[19] = "But I will come to you shortly, if the Lord will; and I will know, not the word of them that are puffed up, but the power.";
asv[20] = "For the kingdom of God is not in word, but in power.";
asv[21] = "What will ye? shall I come unto you with a rod, or in love and a spirit of gentleness?";
dby[1] = "Let a man so account of us as servants of Christ, and stewards of [the] mysteries of God.";
dby[2] = "Here, further, it is sought in stewards, that a man be found faithful.";
dby[3] = "But for me it is the very smallest matter that I be examined of you or of man\'s day. Nor do I even examine myself.";
dby[4] = "For I am conscious of nothing in myself; but I am not justified by this: but he that examines me is the Lord.";
dby[5] = "So that do not judge anything before [the] time, until the Lord shall come, who shall also both bring to light the hidden things of darkness, and shall make manifest the counsels of hearts; and then shall each have [his] praise from God.";
dby[6] = "Now these things, brethren, I have transferred, in their application, to myself and Apollos, for your sakes, that ye may learn in us the [lesson of] not [letting your thoughts go] above what is written, that ye may not be puffed up one for [such a] one against another.";
dby[7] = "For who makes thee to differ? and what hast thou which thou hast not received? but if also thou hast received, why boastest thou as not receiving?";
dby[8] = "Already ye are filled; already ye have been enriched; ye have reigned without us; and I would that ye reigned, that *we* also might reign with you.";
dby[9] = "For I think that God has set us the apostles for the last, as appointed to death. For we have become a spectacle to the world, both to angels and men.";
dby[10] = "*We* [are] fools for Christ\'s sake, but *ye* prudent in Christ: *we* weak, but *ye* strong: *ye* glorious, but *we* in dishonour.";
dby[11] = "To the present hour we both hunger and thirst, and are in nakedness, and buffeted, and wander without a home,";
dby[12] = "and labour, working with our own hands. Railed at, we bless; persecuted, we suffer [it];";
dby[13] = "insulted, we entreat: we are become as [the] offscouring of the world, [the] refuse of all, until now.";
dby[14] = "Not [as] chiding do I write these things to you, but as my beloved children I admonish [you].";
dby[15] = "For if ye should have ten thousand instructors in Christ, yet not many fathers; for in Christ Jesus *I* have begotten you through the glad tidings.";
dby[16] = "I entreat you therefore, be my imitators.";
dby[17] = "For this reason I have sent to you Timotheus, who is my beloved and faithful child in [the] Lord, who shall put you in mind of my ways [as] they [are] in Christ, according as I teach everywhere in every assembly.";
dby[18] = "But some have been puffed up, as if I were not coming to you;";
dby[19] = "but I will come quickly to you, if the Lord will; and I will know, not the word of those that are puffed up, but the power.";
dby[20] = "For the kingdom of God [is] not in word, but in power.";
dby[21] = "What will ye? that I come to you with a rod; or in love, and [in] a spirit of meekness?";
hnv[1] = "So let a man think of us as Messiah\'s servants, and stewards of God\'s mysteries.";
hnv[2] = "Here, moreover, it is required of stewards, that they be found faithful.";
hnv[3] = "But with me it is a very small thing that I should be judged by you, or by man\'s judgment. Yes, I don\'t judge my own self.";
hnv[4] = "For I know nothing against myself. Yet I am not justified by this, but he who judges me is the Lord.";
hnv[5] = " Therefore judge nothing before the time, until the Lord comes, who will both bring to light the hidden things of darkness, and reveal the counsels of the hearts. Then each man will get his praise from God.";
hnv[6] = "Now these things, brothers, I have in a figure transferred to myself and Apollos for your sakes, that in us you might learn not to think beyond the things which are written, that none of you be puffed up against one another.";
hnv[7] = "For who makes you different? And what do you have that you didn\'t receive? But if you did receive it, why do you boast as if you had not received it?";
hnv[8] = "You are already filled. You have already become rich. You have come to reign without us. Yes, and I wish that you did reign, that we also might reign with you.";
hnv[9] = "For, I think that God has displayed us, the apostles, last of all, like men sentenced to death. For we are made a spectacle to the world, both to angels and men.";
hnv[10] = "We are fools for Messiah\'s sake, but you are wise in Messiah. We are weak, but you are strong. You have honor, but we have dishonor.";
hnv[11] = "Even to this present hour we hunger, thirst, are naked, are beaten, and have no certain dwelling place.";
hnv[12] = "We toil, working with our own hands. Being reviled, we bless. Being persecuted, we endure.";
hnv[13] = "Being defamed, we entreat. We are made as the filth of the world, the dirt wiped off by all, even until now.";
hnv[14] = "I don\'t write these things to shame you, but to admonish you as my beloved children.";
hnv[15] = "For though you have ten thousand tutors in Messiah, yet not many fathers. For in Messiah Yeshua, I became your father through the Good News.";
hnv[16] = "I beg you therefore, be imitators of me.";
hnv[17] = "Because of this I have sent Timothy to you, who is my beloved and faithful child in the Lord, who will remind you of my ways which are in Messiah, even as I teach everywhere in every assembly.";
hnv[18] = "Now some are puffed up, as though I were not coming to you.";
hnv[19] = "But I will come to you shortly, if the Lord is willing. And I will know, not the word of those who are puffed up, but the power.";
hnv[20] = "For the Kingdom of God is not in word, but in power.";
hnv[21] = "What do you want? Shall I come to you with a rod, or in love and a spirit of gentleness?";
kjv[1] = "Let a man so account of us, as of the ministers of Christ, and stewards of the mysteries of God.";

kjv[5] = "Therefore judge nothing before the time, until the Lord come, who both will bring to light the hidden things of darkness, and will make manifest the counsels of the hearts: and then shall every man have praise of God.";

kjv[8] = "Now ye are full, now ye are rich, ye have reigned as kings without us: and I would to God ye did reign, that we also might reign with you.";
kjv[9] = "For I think that God hath set forth us the apostles last, as it were appointed to death: for we are made a spectacle unto the world, and to angels, and to men.";
kjv[10] = "We [are] fools for Christ\'s sake, but ye [are] wise in Christ; we [are] weak, but ye [are] strong; ye [are] honourable, but we [are] despised.";
kjv[11] = "Even unto this present hour we both hunger, and thirst, and are naked, and are buffeted, and have no certain dwellingplace;";
kjv[12] = "And labour, working with our own hands: being reviled, we bless; being persecuted, we suffer it:";
kjv[13] = "Being defamed, we intreat: we are made as the filth of the world, [and are] the offscouring of all things unto this day.";
kjv[14] = "I write not these things to shame you, but as my beloved sons I warn [you].";
kjv[15] = "For though ye have ten thousand instructors in Christ, yet [have ye] not many fathers: for in Christ Jesus I have begotten you through the gospel.";
kjv[16] = "Wherefore I beseech you, be ye followers of me.";
kjv[17] = "For this cause have I sent unto you Timotheus, who is my beloved son, and faithful in the Lord, who shall bring you into remembrance of my ways which be in Christ, as I teach every where in every church.";
kjv[18] = "Now some are puffed up, as though I would not come to you.";
kjv[19] = "But I will come to you shortly, if the Lord will, and will know, not the speech of them which are puffed up, but the power.";
kjv[20] = "For the kingdom of God [is] not in word, but in power.";
kjv[21] = "What will ye? shall I come unto you with a rod, or in love, and [in] the spirit of meekness?";
rsv[1] = "This is how one should regard us, as servants of Christ and stewards of the mysteries of God.";
rsv[2] = "Moreover it is required of stewards that they be found trustworthy.";
rsv[3] = "But with me it is a very small thing that I should be judged by you or by any human court. I do not even judge myself.";
rsv[4] = "I am not aware of anything against myself, but I am not thereby acquitted. It is the Lord who judges me.";
rsv[5] = "Therefore do not pronounce judgment before the time, before the Lord comes, who will bring to light the things now hidden in darkness and will disclose the purposes of the heart. Then every man will receive his commendation from God.";
rsv[6] = "I have applied all this to myself and Apol\'los for your benefit, brethren, that you may learn by us not to go beyond what is written, that none of you may be puffed up in favor of one against another.";
rsv[7] = "For who sees anything different in you? What have you that you did not receive? If then you received it, why do you boast as if it were not a gift?";
rsv[8] = "Already you are filled! Already you have become rich! Without us you have become kings! And would that you did reign, so that we might share the rule with you!";
rsv[9] = "For I think that God has exhibited us apostles as last of all, like men sentenced to death; because we have become a spectacle to the world, to angels and to men.";
rsv[10] = "We are fools for Christ\'s sake, but you are wise in Christ. We are weak, but you are strong. You are held in honor, but we in disrepute.";
rsv[11] = "To the present hour we hunger and thirst, we are ill-clad and buffeted and homeless,";
rsv[12] = "and we labor, working with our own hands. When reviled, we bless; when persecuted, we endure;";
rsv[13] = "when slandered, we try to conciliate; we have become, and are now, as the refuse of the world, the offscouring of all things.";
rsv[14] = "I do not write this to make you ashamed, but to admonish you as my beloved children.";
rsv[15] = "For though you have countless guides in Christ, you do not have many fathers. For I became your father in Christ Jesus through the gospel.";
rsv[16] = "I urge you, then, be imitators of me.";
rsv[17] = "Therefore I sent to you Timothy, my beloved and faithful child in the Lord, to remind you of my ways in Christ, as I teach them everywhere in every church.";
rsv[18] = "Some are arrogant, as though I were not coming to you.";
rsv[19] = "But I will come to you soon, if the Lord wills, and I will find out not the talk of these arrogant people but their power.";
rsv[20] = "For the kingdom of God does not consist in talk but in power.";
rsv[21] = "What do you wish? Shall I come to you with a rod, or with love in a spirit of gentleness?";
vul[1] = "sic nos existimet homo ut ministros Christi et dispensatores mysteriorum Dei";
vul[2] = "hic iam quaeritur inter dispensatores ut fidelis quis inveniatur";
vul[3] = "mihi autem pro minimo est ut a vobis iudicer aut ab humano die sed neque me ipsum iudico";
vul[4] = "nihil enim mihi conscius sum sed non in hoc iustificatus sum qui autem iudicat me Dominus est";
vul[5] = "itaque nolite ante tempus iudicare quoadusque veniat Dominus qui et inluminabit abscondita tenebrarum et manifestabit consilia cordium et tunc laus erit unicuique a Deo";
vul[6] = "haec autem fratres transfiguravi in me et Apollo propter vos ut in nobis discatis ne supra quam scriptum est unus adversus alterum infletur pro alio";
vul[7] = "quis enim te discernit quid autem habes quod non accepisti si autem accepisti quid gloriaris quasi non acceperis";
vul[8] = "iam saturati estis iam divites facti estis sine nobis regnastis et utinam regnaretis ut et nos vobiscum regnaremus";
vul[9] = "puto enim Deus nos apostolos novissimos ostendit tamquam morti destinatos quia spectaculum facti sumus mundo et angelis et hominibus";
vul[10] = "nos stulti propter Christum vos autem prudentes in Christo nos infirmi vos autem fortes vos nobiles nos autem ignobiles";
vul[11] = "usque in hanc horam et esurimus et sitimus et nudi sumus et colaphis caedimur et instabiles sumus";
vul[12] = "et laboramus operantes manibus nostris maledicimur et benedicimus persecutionem patimur et sustinemus";
vul[13] = "blasphemamur et obsecramus tamquam purgamenta huius mundi facti sumus omnium peripsima usque adhuc";
vul[14] = "non ut confundam vos haec scribo sed ut filios meos carissimos moneo";
vul[15] = "nam si decem milia pedagogorum habeatis in Christo sed non multos patres nam in Christo Iesu per evangelium ego vos genui";
vul[16] = "rogo ergo vos imitatores mei estote";
vul[17] = "ideo misi ad vos Timotheum qui est filius meus carissimus et fidelis in Domino qui vos commonefaciat vias meas quae sunt in Christo sicut ubique in omni ecclesia doceo";
vul[18] = "tamquam non venturus sim ad vos sic inflati sunt quidam";
vul[19] = "veniam autem cito ad vos si Dominus voluerit et cognoscam non sermonem eorum qui inflati sunt sed virtutem";
vul[20] = "non enim in sermone est regnum Dei sed in virtute";
vul[21] = "quid vultis in virga veniam ad vos an in caritate et spiritu mansuetudinis";

yng[1] = "Let a man so reckon us as officers of Christ, and stewards of the secrets of God,";
yng[2] = "and as to the rest, it is required in the stewards that one may be found faithful,";
yng[3] = "and to me it is for a very little thing that by you I may be judged, or by man\'s day, but not even myself do I judge,";
yng[4] = "for of nothing to myself have I been conscious, but not in this have I been declared right -- and he who is discerning me is the Lord:";
yng[5] = "so, then, nothing before the time judge ye, till the Lord may come, who will both bring to light the hidden things of the darkness, and will manifest the counsels of the hearts, and then the praise shall come to each from God.";
yng[6] = "And these things, brethren, I did transfer to myself and to Apollos because of you, that in us ye may learn not to think above that which hath been written, that ye may not be puffed up one for one against the other,";
yng[7] = "for who doth make thee to differ? and what hast thou, that thou didst not receive? and if thou didst also receive, why dost thou glory as not having received?";
yng[8] = "Already ye are having been filled, already ye were rich, apart from us ye did reign, and I would also ye did reign, that we also with you may reign together,";
yng[9] = "for I think that God did set forth us the apostles last -- as appointed to death, because a spectacle we became to the world, and messengers, and men;";
yng[10] = "we [are] fools because of Christ, and ye wise in Christ; we [are] ailing, and ye strong; ye glorious, and we dishonoured;";
yng[11] = "unto the present hour we both hunger, and thirst, and are naked, and are buffeted, and wander about,";
yng[12] = "and labour, working with [our] own hands; being reviled, we bless; being persecuted, we suffer;";
yng[13] = "being spoken evil of, we entreat; as filth of the world we did become -- of all things an offscouring -- till now.";
yng[14] = "Not [as] putting you to shame do I write these things, but as my beloved children I do admonish,";
yng[15] = "for if a myriad of child-conductors ye may have in Christ, yet not many fathers; for in Christ Jesus, through the good news, I -- I did beget you;";
yng[16] = "I call upon you, therefore, become ye followers of me;";
yng[17] = "because of this I sent to you Timotheus, who is my child, beloved and faithful in the Lord, who shall remind you of my ways in Christ, according as everywhere in every assembly I teach.";
yng[18] = "And as if I were not coming unto you certain were puffed up;";
yng[19] = "but I will come quickly unto you, if the Lord may will, and I will know not the word of those puffed up, but the power;";
yng[20] = "for not in word is the reign of God, but in power?";
yng[21] = "what do ye wish? with a rod shall I come unto you, or in love, with a spirit also of meekness?";
