csb[1] = "For my part, brothers and sisters, I was not able to speak to you as spiritual people but as people of the flesh, as babies in Christ.";
csb[2] = "I gave you milk to drink, not solid food, since you were not yet ready for it. In fact, you are still not ready,";
csb[3] = "because you are still worldly. For since there is envy and strife among you, are you not worldly and behaving like mere humans?";
csb[4] = "For whenever someone says, &quot;I belong to Paul,&quot; and another, &quot;I belong to Apollos,&quot; are you not acting like mere humans?";
csb[5] = "What then is Apollos? What is Paul? They are servants through whom you believed, and each has the role the Lord has given.";
csb[6] = "I planted, Apollos watered, but God gave the growth.";
csb[7] = "So then neither the one who plants nor the one who waters is anything, but only God who gives the growth.";
csb[8] = "Now he who plants and he who waters are one, and each will receive his own reward according to his own labor.";
csb[9] = "For we are God\'s coworkers. You are God\'s field, God\'s building.";
csb[10] = "According to God\'s grace that was given to me, I have laid a foundation as a skilled master builder, and another builds on it. But each one is to be careful how he builds on it.";
csb[11] = "For no one can lay any other foundation than what has been laid down. That foundation is Jesus Christ.";
csb[12] = "If anyone builds on the foundation with gold, silver, costly stones, wood, hay, or straw,";
csb[13] = "each one\'s work will become obvious. For the day will disclose it, because it will be revealed by fire; the fire will test the quality of each one\'s work.";
csb[14] = "If anyone\'s work that he has built survives, he will receive a reward.";
csb[15] = "If anyone\'s work is burned up, he will experience loss, but he himself will be saved -- but only as through fire.";
csb[16] = "Don\'t you yourselves know that you are God\'s temple and that the Spirit of God lives in you?";
csb[17] = "If anyone destroys God\'s temple, God will destroy him; for God\'s temple is holy, and that is what you are.";
csb[18] = "Let no one deceive himself. If anyone among you thinks he is wise in this age, let him become a fool so that he can become wise.";
csb[19] = "For the wisdom of this world is foolishness with God, since it is written, He catches the wise in their craftiness;";
csb[20] = "and again, The Lord knows that the reasonings of the wise are futile.";
csb[21] = "So let no one boast in human leaders, for everything is yours --";
csb[22] = "whether Paul or Apollos or Cephas or the world or life or death or things present or things to come -- everything is yours,";
csb[23] = "and you belong to Christ, and Christ belongs to God.";
asv[1] = "And I, brethren, could not speak unto you as unto spiritual, but as unto carnal, as unto babes in Christ.";
asv[2] = "I fed you with milk, not with meat; for ye were not yet able [to bear it]: nay, not even now are ye able;";
asv[3] = "for ye are yet carnal: for whereas there is among you jealousy and strife, are ye not carnal, and do ye not walk after the manner of men?";
asv[4] = "For when one saith, I am of Paul; and another, I am of Apollos; are ye not men?";
asv[5] = "What then is Apollos? and what is Paul? Ministers through whom ye believed; and each as the Lord gave to him.";
asv[6] = "I planted, Apollos watered; but God gave the increase.";
asv[7] = "So then neither is he that planteth anything, neither he that watereth; but God that giveth the increase.";
asv[8] = "Now he that planteth and he that watereth are one: but each shall receive his own reward according to his own labor.";
asv[9] = "For we are God\'s fellow-workers: ye are God\'s husbandry, God\'s building.";
asv[10] = "According to the grace of God which was given unto me, as a wise masterbuilder I laid a foundation; and another buildeth thereon. But let each man take heed how he buildeth thereon.";
asv[11] = "For other foundation can no man lay than that which is laid, which is Jesus Christ.";
asv[12] = "But if any man buildeth on the foundation gold, silver, costly stones, wood, hay, stubble;";
asv[13] = "each man\'s work shall be made manifest: for the day shall declare it, because it is revealed in fire; and the fire itself shall prove each man\'s work of what sort it is.";
asv[14] = "If any man\'s work shall abide which he built thereon, he shall receive a reward.";
asv[15] = "If any man\'s work shall be burned, he shall suffer loss: but he himself shall be saved; yet so as through fire.";
asv[16] = "Know ye not that ye are a temple of God, and [that] the Spirit of God dwelleth in you?";
asv[17] = "If any man destroyeth the temple of God, him shall God destroy; for the temple of God is holy, and such are ye.";
asv[18] = "Let no man deceive himself. If any man thinketh that he is wise among you in this world, let him become a fool, that he may become wise.";
asv[19] = "For the wisdom of this world is foolishness with God. For it is written, He that taketh the wise in their craftiness:";
asv[20] = "and again, The Lord knoweth the reasonings of the wise, that they are vain.";
asv[21] = "Wherefore let no one glory in men. For all things are yours;";
asv[22] = "whether Paul, or Apollos, or Cephas, or the world, or life, or death, or things present, or things to come; all are yours;";
asv[23] = "and ye are Christ\'s; and Christ is God\'s.";
dby[1] = "And *I*, brethren, have not been able to speak to you as to spiritual, but as to fleshly; as to babes in Christ.";
dby[2] = "I have given you milk to drink, not meat, for ye have not yet been able, nor indeed are ye yet able;";
dby[3] = "for ye are yet carnal. For whereas [there are] among you emulation and strife, are ye not carnal, and walk according to man?";
dby[4] = "For when one says, *I* am of Paul, and another, *I* of Apollos, are ye not men?";

dby[9] = "For we are God\'s fellow-workmen; ye are God\'s husbandry, God\'s building.";

dby[11] = "For other foundation can no man lay besides that which [is] laid, which is Jesus Christ.";
dby[12] = "Now if any one build upon [this] foundation, gold, silver, precious stones, wood, grass, straw,";
dby[13] = "the work of each shall be made manifest; for the day shall declare [it], because it is revealed in fire; and the fire shall try the work of each what it is.";
dby[14] = "If the work of any one which he has built upon [the foundation] shall abide, he shall receive a reward.";
dby[15] = "If the work of any one shall be consumed, he shall suffer loss, but *he* shall be saved, but so as through [the] fire.";
dby[16] = "Do ye not know that ye are [the] temple of God, and [that] the Spirit of God dwells in you?";
dby[17] = "If any one corrupt the temple of God, *him* shall God destroy; for the temple of God is holy, and such are *ye*.";
dby[18] = "Let no one deceive himself: if any one thinks himself to be wise among you in this world, let him become foolish, that he may be wise.";
dby[19] = "For the wisdom of this world is foolishness with God; for it is written, He who takes the wise in their craftiness.";
dby[20] = "And again, [The] Lord knows the reasonings of the wise that they are vain.";
dby[21] = "So that let no one boast in men; for all things are yours.";
dby[22] = "Whether Paul, or Apollos, or Cephas, or [the] world, or life, or death, or things present, or things coming, all are yours;";
dby[23] = "and *ye* [are] Christ\'s, and Christ [is] God\'s.";

hnv[4] = "For when one says, &quot;I follow Sha\'ul,&quot; and another, &quot;I follow Apollos,&quot; aren\'t you fleshly?";

vul[1] = "et ego fratres non potui vobis loqui quasi spiritalibus sed quasi carnalibus tamquam parvulis in Christo";
vul[2] = "lac vobis potum dedi non escam nondum enim poteratis sed ne nunc quidem potestis adhuc enim estis carnales";
vul[3] = "cum enim sit inter vos zelus et contentio nonne carnales estis et secundum hominem ambulatis";
vul[4] = "cum enim quis dicit ego quidem sum Pauli alius autem ego Apollo nonne homines estis quid igitur est Apollo quid vero Paulus";
vul[5] = "ministri eius cui credidistis et unicuique sicut Dominus dedit";
vul[6] = "ego plantavi Apollo rigavit sed Deus incrementum dedit";
vul[7] = "itaque neque qui plantat est aliquid neque qui rigat sed qui incrementum dat Deus";
vul[8] = "qui plantat autem et qui rigat unum sunt unusquisque autem propriam mercedem accipiet secundum suum laborem";
vul[9] = "Dei enim sumus adiutores Dei agricultura estis Dei aedificatio estis";
vul[10] = "secundum gratiam Dei quae data est mihi ut sapiens architectus fundamentum posui alius autem superaedificat unusquisque autem videat quomodo superaedificet";
vul[11] = "fundamentum enim aliud nemo potest ponere praeter id quod positum est qui est Christus Iesus";
vul[12] = "si quis autem superaedificat supra fundamentum hoc aurum argentum lapides pretiosos ligna faenum stipulam";
vul[13] = "uniuscuiusque opus manifestum erit dies enim declarabit quia in igne revelabitur et uniuscuiusque opus quale sit ignis probabit";
vul[14] = "si cuius opus manserit quod superaedificavit mercedem accipiet";
vul[15] = "si cuius opus arserit detrimentum patietur ipse autem salvus erit sic tamen quasi per ignem";
vul[16] = "nescitis quia templum Dei estis et Spiritus Dei habitat in vobis";
vul[17] = "si quis autem templum Dei violaverit disperdet illum Deus templum enim Dei sanctum est quod estis vos";
vul[18] = "nemo se seducat si quis videtur inter vos sapiens esse in hoc saeculo stultus fiat ut sit sapiens";
vul[19] = "sapientia enim huius mundi stultitia est apud Deum scriptum est enim conprehendam sapientes in astutia eorum";
vul[20] = "et iterum Dominus novit cogitationes sapientium quoniam vanae sunt";
vul[21] = "itaque nemo glorietur in hominibus omnia enim vestra sunt";
vul[22] = "sive Paulus sive Apollo sive Cephas sive mundus sive vita sive mors sive praesentia sive futura omnia enim vestra sunt";
vul[23] = "vos autem Christi Christus autem Dei";

yng[1] = "And I, brethren, was not able to speak to you as to spiritual, but as to fleshly -- as to babes in Christ;";
yng[2] = "with milk I fed you, and not with meat, for ye were not yet able, but not even yet are ye now able,";
yng[3] = "for yet ye are fleshly, for where [there is] among you envying, and strife, and divisions, are ye not fleshly, and in the manner of men do walk?";
yng[4] = "for when one may say, `I, indeed, am of Paul;\' and another, `I -- of Apollos;\' are ye not fleshly?";
yng[5] = "Who, then, is Paul, and who Apollos, but ministrants through whom ye did believe, and to each as the Lord gave?";
yng[6] = "I planted, Apollos watered, but God was giving growth;";
yng[7] = "so that neither is he who is planting anything, nor he who is watering, but He who is giving growth -- God;";
yng[8] = "and he who is planting and he who is watering are one, and each his own reward shall receive, according to his own labour,";
yng[9] = "for of God we are fellow-workmen; God\'s tillage, God\'s building ye are.";
yng[10] = "According to the grace of God that was given to me, as a wise master-builder, a foundation I have laid, and another doth build on [it],";
yng[11] = "for other foundation no one is able to lay except that which is laid, which is Jesus the Christ;";
yng[12] = "and if any one doth build upon this foundation gold, silver, precious stones, wood, hay, straw --";
yng[13] = "of each the work shall become manifest, for the day shall declare [it], because in fire it is revealed, and the work of each, what kind it is, the fire shall prove;";
yng[14] = "if of any one the work doth remain that he built on [it], a wage he shall receive;";
yng[15] = "if of any the work is burned up, he shall suffer loss; and himself shall be saved, but so as through fire.";
yng[16] = "have ye not known that ye are a sanctuary of God, and the Spirit of God doth dwell in you?";
yng[17] = "if any one the sanctuary of God doth waste, him shall God waste; for the sanctuary of God is holy, the which ye are.";
yng[18] = "Let no one deceive himself; if any one doth seem to be wise among you in this age -- let him become a fool, that he may become wise,";
yng[19] = "for the wisdom of this world is foolishness with God, for it hath been written, `Who is taking the wise in their craftiness;\'";
yng[20] = "and again, `The Lord doth know the reasonings of the wise, that they are vain.\'";
yng[21] = "So then, let no one glory in men, for all things are yours,";
yng[22] = "whether Paul, or Apollos, or Cephas, or the world, or life, or death, or things present, or things about to be -- all are yours,";
yng[23] = "and ye [are] Christ\'s, and Christ [is] God\'s.";
