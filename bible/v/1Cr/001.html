csb[1] = "Paul, called as an apostle of Christ Jesus by God\'s will, and Sosthenes our brother:";
csb[2] = "To the church of God at Corinth, to those sanctified in Christ Jesus, called as saints, with all those in every place who call on the name of Jesus Christ our Lord -- both their Lord and ours.";
csb[3] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
csb[4] = "I always thank my God for you because of the grace of God given to you in Christ Jesus,";
csb[5] = "that you were enriched in him in every way, in all speech and all knowledge.";
csb[6] = "In this way, the testimony about Christ was confirmed among you,";
csb[7] = "so that you do not lack any spiritual gift as you eagerly wait for the revelation of our Lord Jesus Christ.";
csb[8] = "He will also strengthen you to the end, so that you will be blameless in the day of our Lord Jesus Christ.";
csb[9] = "God is faithful; you were called by him into fellowship with his Son, Jesus Christ our Lord.";
csb[10] = "Now I urge you, brothers and sisters, in the name of our Lord Jesus Christ, that all of you agree in what you say, that there be no divisions among you, and that you be united with the same understanding and the same conviction.";
csb[11] = "For it has been reported to me about you, my brothers and sisters, by members of Chloe\'s people, that there is rivalry among you.";
csb[12] = "What I am saying is this: One of you says, &quot;I belong to Paul,&quot; or &quot;I belong to Apollos,&quot; or &quot;I belong to Cephas,&quot; or &quot;I belong to Christ.&quot;";
csb[13] = "Is Christ divided? Was Paul crucified for you? Or were you baptized in Paul\'s name?";
csb[14] = "I thank God that I baptized none of you except Crispus and Gaius,";
csb[15] = "so that no one can say you were baptized in my name.";
csb[16] = "I did, in fact, baptize the household of Stephanas; beyond that, I don\'t recall if I baptized anyone else.";
csb[17] = "For Christ did not send me to baptize, but to preach the gospel -- not with eloquent wisdom, so that the cross of Christ will not be emptied of its effect.";
csb[18] = "For the word of the cross is foolishness to those who are perishing, but it is the power of God to us who are being saved.";
csb[19] = "For it is written, I will destroy the wisdom of the wise, and I will set aside the intelligence of the intelligent.";
csb[20] = "Where is the one who is wise? Where is the teacher of the law? Where is the debater of this age? Hasn\'t God made the world\'s wisdom foolish?";
csb[21] = "For since, in God\'s wisdom, the world did not know God through wisdom, God was pleased to save those who believe through the foolishness of what is preached.";
csb[22] = "For the Jews ask for signs and the Greeks seek wisdom,";
csb[23] = "but we preach Christ crucified, a stumbling block to the Jews and foolishness to the Gentiles.";
csb[24] = "Yet to those who are called, both Jews and Greeks, Christ is the power of God and the wisdom of God,";
csb[25] = "because God\'s foolishness is wiser than human wisdom, and God\'s weakness is stronger than human strength.";
csb[26] = "Brothers and sisters, consider your calling: Not many were wise from a human perspective, not many powerful, not many of noble birth.";
csb[27] = "Instead, God has chosen what is foolish in the world to shame the wise, and God has chosen what is weak in the world to shame the strong.";
csb[28] = "God has chosen what is insignificant and despised in the world -- what is viewed as nothing -- to bring to nothing what is viewed as something,";
csb[29] = "so that no one may boast in his presence.";
csb[30] = "It is from him that you are in Christ Jesus, who became wisdom from God for us -- our righteousness, sanctification, and redemption,";
csb[31] = "in order that, as it is written: Let the one who boasts, boast in the Lord.";
asv[1] = "Paul, called [to be] an apostle of Jesus Christ through the will of God, and Sosthenes our brother,";
asv[2] = "unto the church of God which is at Corinth, [even] them that are sanctified in Christ Jesus, called [to be] saints, with all that call upon the name of our Lord Jesus Christ in every place, their [Lord] and ours:";
asv[3] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
asv[4] = "I thank my God always concerning you, for the grace of God which was given you in Christ Jesus;";
asv[5] = "that in everything ye were enriched in him, in all utterance and all knowledge;";
asv[6] = "even as the testimony of Christ was confirmed in you:";
asv[7] = "so that ye come behind in no gift; waiting for the revelation of our Lord Jesus Christ;";
asv[8] = "who shall also confirm you unto the end, [that ye be] unreproveable in the day of our Lord Jesus Christ.";
asv[9] = "God is faithful, through whom ye were called into the fellowship of his Son Jesus Christ our Lord.";
asv[10] = "Now I beseech you, brethren, through the name of our Lord Jesus Christ, that ye all speak the same thing, and [that] there be no divisions among you; but [that] ye be perfected together in the same mind and in the same judgment.";
asv[11] = "For it hath been signified unto me concerning you, my brethren, by them [that are of the household] of Chloe, that there are contentions among you.";
asv[12] = "Now this I mean, that each one of you saith, I am of Paul; and I of Apollos; and I of Cephas; and I of Christ.";
asv[13] = "Is Christ divided? was Paul crucified for you? or were ye baptized into the name of Paul?";
asv[14] = "I thank God that I baptized none of you, save Crispus and Gaius;";
asv[15] = "lest any man should say that ye were baptized into my name.";
asv[16] = "And I baptized also the household of Stephanas: besides, I know not whether I baptized any other.";
asv[17] = "For Christ sent me not to baptize, but to preach the gospel: not in wisdom of words, lest the cross of Christ should be made void.";
asv[18] = "For the word of the cross is to them that perish foolishness; but unto us who are saved it is the power of God.";
asv[19] = "For it is written, I will destroy the wisdom of the wise, And the discernment of the discerning will I bring to nought. ";
asv[20] = "Where is the wise? where is the scribe? where is the disputer of this world? hath not God made foolish the wisdom of the world?";
asv[21] = "For seeing that in the wisdom of God the world through its wisdom knew not God, it was God\'s good pleasure through the foolishness of the preaching to save them that believe.";
asv[22] = "Seeing that Jews ask for signs, and Greeks seek after wisdom:";
asv[23] = "but we preach Christ crucified, unto Jews a stumblingblock, and unto Gentiles foolishness;";
asv[24] = "but unto them that are called, both Jews and Greeks, Christ the power of God, and the wisdom of God.";
asv[25] = "Because the foolishness of God is wiser than men; and the weakness of God is stronger than men.";
asv[26] = "For behold your calling, brethren, that not many wise after the flesh, not many mighty, not many noble, [are called]:";
asv[27] = "but God chose the foolish things of the world, that he might put to shame them that are wise; and God chose the weak things of the world, that he might put to shame the things that are strong;";
asv[28] = "and the base things of the world, and the things that are despised, did God choose, [yea] and the things that are not, that he might bring to nought the things that are:";
asv[29] = "that no flesh should glory before God.";
asv[30] = "But of him are ye in Christ Jesus, who was made unto us wisdom from God, and righteousness and sanctification, and redemption:";
asv[31] = "that, according as it is written, He that glorieth, let him glory in the Lord.";
dby[1] = "Paul, [a] called apostle of Jesus Christ, by God\'s will, and Sosthenes the brother,";
dby[2] = "to the assembly of God which is in Corinth, to [those] sanctified in Christ Jesus, called saints, with all that in every place call on the name of our Lord Jesus Christ, both theirs and ours:";
dby[3] = "Grace to you and peace from God our Father, and [the] Lord Jesus Christ.";
dby[4] = "I thank my God always about you, in respect of the grace of God given to you in Christ Jesus;";
dby[5] = "that in everything ye have been enriched in him, in all word [of doctrine], and all knowledge,";
dby[6] = "(according as the testimony of the Christ has been confirmed in you,)";
dby[7] = "so that ye come short in no gift, awaiting the revelation of our Lord Jesus Christ;";
dby[8] = "who shall also confirm you to [the] end, unimpeachable in the day of our Lord Jesus Christ.";
dby[9] = "God [is] faithful, by whom ye have been called into [the] fellowship of his Son Jesus Christ our Lord.";
dby[10] = "Now I exhort you, brethren, by the name of our Lord Jesus Christ, that ye all say the same thing, and that there be not among you divisions; but that ye be perfectly united in the same mind and in the same opinion.";
dby[11] = "For it has been shewn to me concerning you, my brethren, by those of [the house of] Chloe, that there are strifes among you.";
dby[12] = "But I speak of this, that each of you says, *I* am of Paul, and *I* of Apollos, and *I* of Cephas, and *I* of Christ.";
dby[13] = "Is the Christ divided? has Paul been crucified for you? or have ye been baptised unto the name of Paul?";
dby[14] = "I thank God that I have baptised none of you, unless Crispus and Gaius,";
dby[15] = "that no one may say that I have baptised unto my own name.";
dby[16] = "Yes, I baptised also the house of Stephanas; for the rest I know not if I have baptised any other.";
dby[17] = "For Christ has not sent me to baptise, but to preach glad tidings; not in wisdom of word, that the cross of the Christ may not be made vain.";
dby[18] = "For the word of the cross is to them that perish foolishness, but to us that are saved it is God\'s power.";
dby[19] = "For it is written, I will destroy the wisdom of the wise, and set aside the understanding of the understanding ones.";
dby[20] = "Where [is the] wise? where scribe? where disputer of this world? has not God made foolish the wisdom of the world?";
dby[21] = "For since, in the wisdom of God, the world by wisdom has not known God, God has been pleased by the foolishness of the preaching to save those that believe.";
dby[22] = "Since Jews indeed ask for signs, and Greeks seek wisdom;";
dby[23] = "but *we* preach Christ crucified, to Jews an offence, and to nations foolishness;";
dby[24] = "but to those that [are] called, both Jews and Greeks, Christ God\'s power and God\'s wisdom.";
dby[25] = "Because the foolishness of God is wiser than men, and the weakness of God is stronger than men.";
dby[26] = "For consider your calling, brethren, that [there are] not many wise according to flesh, not many powerful, not many high-born.";
dby[27] = "But God has chosen the foolish things of the world, that he may put to shame the wise; and God has chosen the weak things of the world, that he may put to shame the strong things;";
dby[28] = "and the ignoble things of the world, and the despised, has God chosen, [and] things that are not, that he may annul the things that are;";
dby[29] = "so that no flesh should boast before God.";
dby[30] = "But of him are *ye* in Christ Jesus, who has been made to us wisdom from God, and righteousness, and holiness, and redemption;";
dby[31] = "that according as it is written, He that boasts, let him boast in [the] Lord.";
hnv[1] = "Sha\'ul, called to be an apostle of Yeshua the Messiah through the will of God, and our brother Sosthenes,";
hnv[2] = "to the assembly of God which is at Corinth; those who are sanctified in Messiah Yeshua, called to be holy ones, with all who call on the name of our Lord Yeshua the Messiah in every place, both theirs and ours:";
hnv[3] = "Grace to you and shalom from God our Father and the Lord Yeshua the Messiah.";
hnv[4] = "I always thank my God concerning you, for the grace of God which was given you in Messiah Yeshua;";
hnv[5] = "that in everything you were enriched in him, in all speech and all knowledge;";
hnv[6] = "even as the testimony of Messiah was confirmed in you:";
hnv[7] = "so that you come behind in no gift; waiting for the revelation of our Lord Yeshua the Messiah;";
hnv[8] = "who will also confirm you until the end, blameless in the day of our Lord Yeshua the Messiah.";
hnv[9] = "God is faithful, through whom you were called into the fellowship of his Son, Yeshua the Messiah, our Lord.";
hnv[10] = "Now I beg you, brothers, through the name of our Lord, Yeshua the Messiah, that you all speak the same thing and that there be no divisions among you, but that you be perfected together in the same mind and in the same judgment.";
hnv[11] = "For it has been reported to me concerning you, my brothers, by those who are from Chloe\'s household, that there are contentions among you.";
hnv[12] = "Now I mean this, that each one of you says, &quot;I follow Sha\'ul,&quot; &quot;I follow Apollos,&quot; &quot;I follow Kefa,&quot; and, &quot;I follow Messiah.&quot;";
hnv[13] = "Is Messiah divided? Was Sha\'ul crucified for you? Or were you immersed into the name of Sha\'ul?";
hnv[14] = "I thank God that I immersed none of you, except Crispus and Gaius,";
hnv[15] = "so that no one should say that I had immersed you into my own name.";
hnv[16] = "(I also immersed the household of Stephanas; besides them, I don\'t know whether I immersed any other.)";
hnv[17] = "For Messiah sent me not to immerse, but to preach the Good News -- not in wisdom of words, so that the cross of Messiah wouldn\'t be made void.";
hnv[18] = "For the word of the cross is foolishness to those who are dying, but to us who are saved it is the power of God.";
hnv[19] = "For it is written, &quot;I will destroy the wisdom of the wise, I will bring the discernment of the discerning to nothing.&quot;";
hnv[20] = "Where is the wise? Where is the Sofer? Where is the lawyer of this world? Hasn\'t God made foolish the wisdom of this world?";
hnv[21] = " For seeing that in the wisdom of God, the world through its wisdom didn\'t know God, it was God\'s good pleasure through the foolishness of the preaching to save those who believe.";
hnv[22] = "For Yehudim ask for signs, Yevanim seek after wisdom,";
hnv[23] = "but we preach Messiah crucified; a stumbling block to Yehudim, and foolishness to Yevanim,";
hnv[24] = "but to those who are called, both Yehudim and Yevanim, Messiah is the power of God and the wisdom of God.";
hnv[25] = "Because the foolishness of God is wiser than men, and the weakness of God is stronger than men.";
hnv[26] = "For you see your calling, brothers, that not many are wise according to the flesh, not many mighty, and not many noble;";
hnv[27] = "but God chose the foolish things of the world that he might put to shame those who are wise. God chose the weak things of the world, that he might put to shame the things that are strong;";
hnv[28] = " and God chose the lowly things of the world, and the things that are despised, and the things that are not, that he might bring to nothing the things that are:";
hnv[29] = "that no flesh should boast before God.";
hnv[30] = "But of him, you are in Messiah Yeshua, who was made to us wisdom from God, and righteousness and sanctification, and redemption:";
hnv[31] = " that, according as it is written, &quot;He who boasts, let him boast in the Lord.&quot;";
kjv[1] = "Paul, called [to be] an apostle of Jesus Christ through the will of God, and Sosthenes [our] brother,";
kjv[2] = "Unto the church of God which is at Corinth, to them that are sanctified in Christ Jesus, called [to be] saints, with all that in every place call upon the name of Jesus Christ our Lord, both theirs and ours:";
kjv[3] = "Grace [be] unto you, and peace, from God our Father, and [from] the Lord Jesus Christ.";
kjv[4] = "I thank my God always on your behalf, for the grace of God which is given you by Jesus Christ;";
kjv[5] = "That in every thing ye are enriched by him, in all utterance, and [in] all knowledge;";
kjv[6] = "Even as the testimony of Christ was confirmed in you:";
kjv[7] = "So that ye come behind in no gift; waiting for the coming of our Lord Jesus Christ:";
kjv[8] = "Who shall also confirm you unto the end, [that ye may be] blameless in the day of our Lord Jesus Christ.";
kjv[9] = "God [is] faithful, by whom ye were called unto the fellowship of his Son Jesus Christ our Lord.";
kjv[10] = "Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and [that] there be no divisions among you; but [that] ye be perfectly joined together in the same mind and in the same judgment.";
kjv[11] = "For it hath been declared unto me of you, my brethren, by them [which are of the house] of Chloe, that there are contentions among you.";
kjv[12] = "Now this I say, that every one of you saith, I am of Paul; and I of Apollos; and I of Cephas; and I of Christ.";
kjv[13] = "Is Christ divided? was Paul crucified for you? or were ye baptized in the name of Paul?";
kjv[14] = "I thank God that I baptized none of you, but Crispus and Gaius;";
kjv[15] = "Lest any should say that I had baptized in mine own name.";
kjv[16] = "And I baptized also the household of Stephanas: besides, I know not whether I baptized any other.";
kjv[17] = "For Christ sent me not to baptize, but to preach the gospel: not with wisdom of words, lest the cross of Christ should be made of none effect.";
kjv[18] = "For the preaching of the cross is to them that perish foolishness; but unto us which are saved it is the power of God.";
kjv[19] = "For it is written, I will destroy the wisdom of the wise, and will bring to nothing the understanding of the prudent.";
kjv[20] = "Where [is] the wise? where [is] the scribe? where [is] the disputer of this world? hath not God made foolish the wisdom of this world?";
kjv[21] = "For after that in the wisdom of God the world by wisdom knew not God, it pleased God by the foolishness of preaching to save them that believe.";
kjv[22] = "For the Jews require a sign, and the Greeks seek after wisdom:";
kjv[23] = "But we preach Christ crucified, unto the Jews a stumblingblock, and unto the Greeks foolishness;";
kjv[24] = "But unto them which are called, both Jews and Greeks, Christ the power of God, and the wisdom of God.";
kjv[25] = "Because the foolishness of God is wiser than men; and the weakness of God is stronger than men.";
kjv[26] = "For ye see your calling, brethren, how that not many wise men after the flesh, not many mighty, not many noble, [are called]:";
kjv[27] = "But God hath chosen the foolish things of the world to confound the wise; and God hath chosen the weak things of the world to confound the things which are mighty;";
kjv[28] = "And base things of the world, and things which are despised, hath God chosen, [yea], and things which are not, to bring to nought things that are:";
kjv[29] = "That no flesh should glory in his presence.";
kjv[30] = "But of him are ye in Christ Jesus, who of God is made unto us wisdom, and righteousness, and sanctification, and redemption:";
kjv[31] = "That, according as it is written, He that glorieth, let him glory in the Lord.";
rsv[1] = "Paul, called by the will of God to be an apostle of Christ Jesus, and our brother Sos\'thenes,";
rsv[2] = "To the church of God which is at Corinth, to those sanctified in Christ Jesus, called to be saints together with all those who in every place call on the name of our Lord Jesus Christ, both their Lord and ours:";
rsv[3] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
rsv[4] = "I give thanks to God always for you because of the grace of God which was given you in Christ Jesus,";
rsv[5] = "that in every way you were enriched in him with all speech and all knowledge--";
rsv[6] = "even as the testimony to Christ was confirmed among you--";
rsv[7] = "so that you are not lacking in any spiritual gift, as you wait for the revealing of our Lord Jesus Christ;";
rsv[8] = "who will sustain you to the end, guiltless in the day of our Lord Jesus Christ.";
rsv[9] = "God is faithful, by whom you were called into the fellowship of his Son, Jesus Christ our Lord.";
rsv[10] = "I appeal to you, brethren, by the name of our Lord Jesus Christ, that all of you agree and that there be no dissensions among you, but that you be united in the same mind and the same judgment.";
rsv[11] = "For it has been reported to me by Chlo\'e\'s people that there is quarreling among you, my brethren.";
rsv[12] = "What I mean is that each one of you says, &quot;I belong to Paul,&quot; or &quot;I belong to Apol\'los,&quot; or &quot;I belong to Cephas,&quot; or &quot;I belong to Christ.&quot;";
rsv[13] = "Is Christ divided? Was Paul crucified for you? Or were you baptized in the name of Paul?";
rsv[14] = "I am thankful that I baptized none of you except Crispus and Ga\'ius;";
rsv[15] = "lest any one should say that you were baptized in my name.";
rsv[16] = "(I did baptize also the household of Steph\'anas. Beyond that, I do not know whether I baptized any one else.)";
rsv[17] = "For Christ did not send me to baptize but to preach the gospel, and not with eloquent wisdom, lest the cross of Christ be emptied of its power.";
rsv[18] = "For the word of the cross is folly to those who are perishing, but to us who are being saved it is the power of God.";
rsv[19] = "For it is written, &quot;I will destroy the wisdom of the wise, and the cleverness of the clever I will thwart.&quot;";
rsv[20] = "Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made foolish the wisdom of the world?";
rsv[21] = "For since, in the wisdom of God, the world did not know God through wisdom, it pleased God through the folly of what we preach to save those who believe.";
rsv[22] = "For Jews demand signs and Greeks seek wisdom,";
rsv[23] = "but we preach Christ crucified, a stumbling block to Jews and folly to Gentiles,";
rsv[24] = "but to those who are called, both Jews and Greeks, Christ the power of God and the wisdom of God.";
rsv[25] = "For the foolishness of God is wiser than men, and the weakness of God is stronger than men.";
rsv[26] = "For consider your call, brethren; not many of you were wise according to worldly standards, not many were powerful, not many were of noble birth;";
rsv[27] = "but God chose what is foolish in the world to shame the wise, God chose what is weak in the world to shame the strong,";
rsv[28] = "God chose what is low and despised in the world, even things that are not, to bring to nothing things that are,";
rsv[29] = "so that no human being might boast in the presence of God.";
rsv[30] = "He is the source of your life in Christ Jesus, whom God made our wisdom, our righteousness and sanctification and redemption;";
rsv[31] = "therefore, as it is written, &quot;Let him who boasts, boast of the Lord.&quot;";
vul[1] = "Paulus vocatus apostolus Christi Iesu per voluntatem Dei et Sosthenes frater";
vul[2] = "ecclesiae Dei quae est Corinthi sanctificatis in Christo Iesu vocatis sanctis cum omnibus qui invocant nomen Domini nostri Iesu Christi in omni loco ipsorum et nostro";
vul[3] = "gratia vobis et pax a Deo Patre nostro et Domino Iesu Christo";
vul[4] = "gratias ago Deo meo semper pro vobis in gratia Dei quae data est vobis in Christo Iesu";
vul[5] = "quia in omnibus divites facti estis in illo in omni verbo et in omni scientia";
vul[6] = "sicut testimonium Christi confirmatum est in vobis";
vul[7] = "ita ut nihil vobis desit in ulla gratia expectantibus revelationem Domini nostri Iesu Christi";
vul[8] = "qui et confirmabit vos usque ad finem sine crimine in die adventus Domini nostri Iesu Christi";
vul[9] = "fidelis Deus per quem vocati estis in societatem Filii eius Iesu Christi Domini nostri";
vul[10] = "obsecro autem vos fratres per nomen Domini nostri Iesu Christi ut id ipsum dicatis omnes et non sint in vobis scismata sitis autem perfecti in eodem sensu et in eadem sententia";
vul[11] = "significatum est enim mihi de vobis fratres mei ab his qui sunt Chloes quia contentiones inter vos sunt";
vul[12] = "hoc autem dico quod unusquisque vestrum dicit ego quidem sum Pauli ego autem Apollo ego vero Cephae ego autem Christi";
vul[13] = "divisus est Christus numquid Paulus crucifixus est pro vobis aut in nomine Pauli baptizati estis";
vul[14] = "gratias ago Deo quod neminem vestrum baptizavi nisi Crispum et Gaium";
vul[15] = "ne quis dicat quod in nomine meo baptizati sitis";
vul[16] = "baptizavi autem et Stephanae domum ceterum nescio si quem alium baptizaverim";
vul[17] = "non enim misit me Christus baptizare sed evangelizare non in sapientia verbi ut non evacuetur crux Christi";
vul[18] = "verbum enim crucis pereuntibus quidem stultitia est his autem qui salvi fiunt id est nobis virtus Dei est";
vul[19] = "scriptum est enim perdam sapientiam sapientium et prudentiam prudentium reprobabo";
vul[20] = "ubi sapiens ubi scriba ubi conquisitor huius saeculi nonne stultam fecit Deus sapientiam huius mundi";
vul[21] = "nam quia in Dei sapientia non cognovit mundus per sapientiam Deum placuit Deo per stultitiam praedicationis salvos facere credentes";
vul[22] = "quoniam et Iudaei signa petunt et Graeci sapientiam quaerunt";
vul[23] = "nos autem praedicamus Christum crucifixum Iudaeis quidem scandalum gentibus autem stultitiam";
vul[24] = "ipsis autem vocatis Iudaeis atque Graecis Christum Dei virtutem et Dei sapientiam";
vul[25] = "quia quod stultum est Dei sapientius est hominibus et quod infirmum est Dei fortius est hominibus";
vul[26] = "videte enim vocationem vestram fratres quia non multi sapientes secundum carnem non multi potentes non multi nobiles";
vul[27] = "sed quae stulta sunt mundi elegit Deus ut confundat sapientes et infirma mundi elegit Deus ut confundat fortia";
vul[28] = "et ignobilia mundi et contemptibilia elegit Deus et quae non sunt ut ea quae sunt destrueret";
vul[29] = "ut non glorietur omnis caro in conspectu eius";
vul[30] = "ex ipso autem vos estis in Christo Iesu qui factus est sapientia nobis a Deo et iustitia et sanctificatio et redemptio";
vul[31] = "ut quemadmodum scriptum est qui gloriatur in Domino glorietur";
web[1] = "Paul, called [to be] an apostle of Jesus Christ through the will of God, and Sosthenes [our] brother,";
web[2] = "To the church of God which is at Corinth, to them that are sanctified in Christ Jesus, called [to be] saints, with all that in every place call upon the name of Jesus Christ our Lord, both theirs and ours.";
web[3] = "Grace [be] to you, and peace from God our Father, and [from] the Lord Jesus Christ.";
web[4] = "I thank my God always on your behalf, for the grace of God which is given you by Jesus Christ;";
web[5] = "That in every thing ye are enriched by him, in all utterance, and [in] all knowledge;";
web[6] = "Even as the testimony of Christ was confirmed in you:";
web[7] = "So that ye come behind in no gift; waiting for the coming of our Lord Jesus Christ:";
web[8] = "Who will also confirm you to the end, [that ye may be] blameless in the day of our Lord Jesus Christ.";
web[9] = "God [is] faithful, by whom ye were called to the fellowship of his Son Jesus Christ our Lord.";
web[10] = "Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and [that] there be no divisions among you; but [that] ye be perfectly joined together in the same mind, and in the same judgment.";
web[11] = "For it hath been declared to me concerning you, my brethren, by them [who are of the house] of Chloe, that there are contentions among you.";
web[12] = "Now this I say, that every one of you saith, I am of Paul; and I of Apollos; and I of Cephas; and I of Christ.";
web[13] = "Is Christ divided? was Paul crucified for you? or were ye baptized in the name of Paul?";
web[14] = "I thank God that I baptized none of you, but Crispus and Gaius;";
web[15] = "Lest any should say that I had baptized in my own name.";
web[16] = "And I baptized also the household of Stephanas; besides, I know not whether I baptized any other.";
web[17] = "For Christ hath not sent me to baptize, but to preach the gospel: not with wisdom of words, lest the cross of Christ should be made of no effect.";
web[18] = "For the preaching of the cross is to them that perish, foolishness; but to us who are saved, it is the power of God.";
web[19] = "For it is written, I will destroy the wisdom of the wise, and will bring to nothing the understanding of the prudent.";
web[20] = "Where [is] the wise? where [is] the scribe? where [is] the disputer of this world? hath not God made foolish the wisdom of this world?";
web[21] = "For when in the wisdom of God the world by wisdom knew not God, it pleased God by the foolishness of preaching to save them that believe.";
web[22] = "For the Jews require a sign, and the Greeks seek wisdom:";
web[23] = "But we preach Christ crucified, to the Jews a stumbling-block, and to the Greeks foolishness;";
web[24] = "But to them who are called, both Jews and Greeks, Christ the power of God, and the wisdom of God.";
web[25] = "Because the foolishness of God is wiser than men; and the weakness of God is stronger than men.";
web[26] = "For ye see your calling, brethren, that not many wise men after the flesh, not many mighty, not many noble [are called]:";
web[27] = "But God hath chosen the foolish things of the world to confound the wise; and God hath chosen the weak things of the world to confound the things which are mighty;";
web[28] = "And base things of the world, and things which are despised, hath God chosen, and things which are not, to bring to naught things that are:";
web[29] = "That no flesh should glory in his presence.";
web[30] = "But of him are ye in Christ Jesus, who from God is made to us wisdom, and righteousness, and sanctification, and redemption:";
web[31] = "That, according as it is written, He that glorieth, let him glory in the Lord.";
yng[1] = "Paul, a called apostle of Jesus Christ, through the will of God, and Sosthenes the brother,";
yng[2] = "to the assembly of God that is in Corinth, to those sanctified in Christ Jesus, called saints, with all those calling upon the name of our Lord Jesus Christ in every place -- both theirs and ours:";
yng[3] = "Grace to you and peace from God our Father and the Lord Jesus Christ!";
yng[4] = "I give thanks to my God always concerning you for the grace of God that was given to you in Christ Jesus,";
yng[5] = "that in every thing ye were enriched in him, in all discourse and all knowledge,";
yng[6] = "according as the testimony of the Christ was confirmed in you,";
yng[7] = "so that ye are not behind in any gift, waiting for the revelation of our Lord Jesus Christ,";
yng[8] = "who also shall confirm you unto the end -- unblamable in the day of our Lord Jesus Christ;";
yng[9] = "faithful [is] God, through whom ye were called to the fellowship of His Son Jesus Christ our Lord.";
yng[10] = "And I call upon you, brethren, through the name of our Lord Jesus Christ, that the same thing ye may all say, and there may not be divisions among you, and ye may be perfected in the same mind, and in the same judgment,";
yng[11] = "for it was signified to me concerning you, my brethren, by those of Chloe, that contentions are among you;";
yng[12] = "and I say this, that each one of you saith, `I, indeed, am of Paul\' -- `and I of Apollos,\' -- `and I of Cephas,\' -- `and I of Christ.\'";
yng[13] = "Hath the Christ been divided? was Paul crucified for you? or to the name of Paul were ye baptized;";
yng[14] = "I give thanks to God that no one of you did I baptize, except Crispus and Gaius --";
yng[15] = "that no one may say that to my own name I did baptize;";
yng[16] = "and I did baptize also Stephanas\' household -- further, I have not known if I did baptize any other.";
yng[17] = "For Christ did not send me to baptize, but -- to proclaim good news; not in wisdom of discourse, that the cross of the Christ may not be made of none effect;";
yng[18] = "for the word of the cross to those indeed perishing is foolishness, and to us -- those being saved -- it is the power of God,";
yng[19] = "for it hath been written, `I will destroy the wisdom of the wise, and the intelligence of the intelligent I will bring to nought;\'";
yng[20] = "where [is] the wise? where the scribe? where a disputer of this age? did not God make foolish the wisdom of this world?";
yng[21] = "for, seeing in the wisdom of God the world through the wisdom knew not God, it did please God through the foolishness of the preaching to save those believing.";
yng[22] = "Since also Jews ask a sign, and Greeks seek wisdom,";
yng[23] = "also we -- we preach Christ crucified, to Jews, indeed, a stumbling-block, and to Greeks foolishness,";
yng[24] = "and to those called -- both Jews and Greeks -- Christ the power of God, and the wisdom of God,";
yng[25] = "because the foolishness of God is wiser than men, and the weakness of God is stronger than men;";
yng[26] = "for see your calling, brethren, that not many [are] wise according to the flesh, not many mighty, not many noble;";
yng[27] = "but the foolish things of the world did God choose, that the wise He may put to shame; and the weak things of the world did God choose that He may put to shame the strong;";
yng[28] = "and the base things of the world, and the things despised did God choose, and the things that are not, that the things that are He may make useless --";
yng[29] = "that no flesh may glory before Him;";
yng[30] = "and of Him ye -- ye are in Christ Jesus, who became to us from God wisdom, righteousness also, and sanctification, and redemption,";
yng[31] = "that, according as it hath been written, `He who is glorying -- in the Lord let him glory.\'";
</script>
