csb[1] = "If I speak human or angelic tongues but do not have love, I am a noisy gong or a clanging cymbal.";
csb[2] = "If I have the gift of prophecy and understand all mysteries and all knowledge, and if I have all faith so that I can move mountains but do not have love, I am nothing.";
csb[3] = "And if I give away all my possessions, and if I give over my body in order to boast but do not have love, I gain nothing.";
csb[4] = "Love is patient, love is kind. Love does not envy, is not boastful, is not arrogant,";
csb[5] = "is not rude, is not self-seeking, is not irritable, and does not keep a record of wrongs.";
csb[6] = "Love finds no joy in unrighteousness but rejoices in the truth.";
csb[7] = "It bears all things, believes all things, hopes all things, endures all things.";
csb[8] = "Love never ends. But as for prophecies, they will come to an end; as for tongues, they will cease; as for knowledge, it will come to an end.";
csb[9] = "For we know in part, and we prophesy in part,";
csb[10] = "but when the perfect comes, the partial will come to an end.";
csb[11] = "When I was a child, I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put aside childish things.";
csb[12] = "For now we see only a reflection as in a mirror, but then face to face. Now I know in part, but then I will know fully, as I am fully known.";
csb[13] = "Now these three remain: faith, hope, and love -- but the greatest of these is love.";
asv[1] = "If I speak with the tongues of men and of angels, but have not love, I am become sounding brass, or a clanging cymbal.";

asv[3] = "And if I bestow all my goods to feed [the poor], and if I give my body to be burned, but have not love, it profiteth me nothing.";
asv[4] = "Love suffereth long, [and] is kind; love envieth not; love vaunteth not itself, is not puffed up,";

asv[7] = "beareth all things, believeth all things, hopeth all things, endureth all things.";
asv[8] = "Love never faileth: but whether [there be] prophecies, they shall be done away; whether [there be] tongues, they shall cease; whether [there be] knowledge, it shall be done away.";
asv[9] = "For we know in part, and we prophesy in part;";
asv[10] = "but when that which is perfect is come, that which is in part shall be done away.";
asv[11] = "When I was a child, I spake as a child, I felt as a child, I thought as a child: now that I am become a man, I have put away childish things.";
asv[12] = "For now we see in a mirror, darkly; but then face to face: now I know in part; but then shall I know fully even as also I was fully known.";
asv[13] = "But now abideth faith, hope, love, these three; and the greatest of these is love.";

hnv[3] = "If I dole out all my goods to feed the poor, and if I give my body to be burned, but don\'t have love, it profits me nothing.";
hnv[4] = "Love is patient and is kind; love doesn\'t envy. Love doesn\'t brag, is not proud,";
hnv[5] = "doesn\'t behave itself inappropriately, doesn\'t seek its own way, is not provoked, takes no account of evil;";
hnv[6] = "doesn\'t rejoice in unrighteousness, but rejoices with the truth;";

hnv[8] = "Love never fails. But where there are prophecies, they will be done away with. Where there are various languages, they will cease. Where there is knowledge, it will be done away with.";
hnv[9] = " For we know in part, and we prophesy in part;";

kjv[1] = "Though I speak with the tongues of men and of angels, and have not charity, I am become [as] sounding brass, or a tinkling cymbal.";
kjv[2] = "And though I have [the gift of] prophecy, and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing.";
kjv[3] = "And though I bestow all my goods to feed [the poor], and though I give my body to be burned, and have not charity, it profiteth me nothing.";
kjv[4] = "Charity suffereth long, [and] is kind; charity envieth not; charity vaunteth not itself, is not puffed up,";
kjv[5] = "Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;";
kjv[6] = "Rejoiceth not in iniquity, but rejoiceth in the truth;";
kjv[7] = "Beareth all things, believeth all things, hopeth all things, endureth all things.";
kjv[8] = "Charity never faileth: but whether [there be] prophecies, they shall fail; whether [there be] tongues, they shall cease; whether [there be] knowledge, it shall vanish away.";
kjv[9] = "For we know in part, and we prophesy in part.";
kjv[10] = "But when that which is perfect is come, then that which is in part shall be done away.";
kjv[11] = "When I was a child, I spake as a child, I understood as a child, I thought as a child: but when I became a man, I put away childish things.";
kjv[12] = "For now we see through a glass, darkly; but then face to face: now I know in part; but then shall I know even as also I am known.";
kjv[13] = "And now abideth faith, hope, charity, these three; but the greatest of these [is] charity.";
rsv[1] = "If I speak in the tongues of men and of angels, but have not love, I am a noisy gong or a clanging cymbal.";
rsv[2] = "And if I have prophetic powers, and understand all mysteries and all knowledge, and if I have all faith, so as to remove mountains, but have not love, I am nothing.";
rsv[3] = "If I give away all I have, and if I deliver my body to be burned, but have not love, I gain nothing.";
rsv[4] = "Love is patient and kind; love is not jealous or boastful;";
rsv[5] = "it is not arrogant or rude. Love does not insist on its own way; it is not irritable or resentful;";
rsv[6] = "it does not rejoice at wrong, but rejoices in the right.";
rsv[7] = "Love bears all things, believes all things, hopes all things, endures all things.";
rsv[8] = "Love never ends; as for prophecies, they will pass away; as for tongues, they will cease; as for knowledge, it will pass away.";
rsv[9] = "For our knowledge is imperfect and our prophecy is imperfect;";
rsv[10] = "but when the perfect comes, the imperfect will pass away.";
rsv[11] = "When I was a child, I spoke like a child, I thought like a child, I reasoned like a child; when I became a man, I gave up childish ways.";
rsv[12] = "For now we see in a mirror dimly, but then face to face. Now I know in part; then I shall understand fully, even as I have been fully understood.";
rsv[13] = "So faith, hope, love abide, these three; but the greatest of these is love.";
vul[1] = "si linguis hominum loquar et angelorum caritatem autem non habeam factus sum velut aes sonans aut cymbalum tinniens";
vul[2] = "et si habuero prophetiam et noverim mysteria omnia et omnem scientiam et habuero omnem fidem ita ut montes transferam caritatem autem non habuero nihil sum";
vul[3] = "et si distribuero in cibos pauperum omnes facultates meas et si tradidero corpus meum ut ardeam caritatem autem non habuero nihil mihi prodest";
vul[4] = "caritas patiens est benigna est caritas non aemulatur non agit perperam non inflatur";
vul[5] = "non est ambitiosa non quaerit quae sua sunt non inritatur non cogitat malum";
vul[6] = "non gaudet super iniquitatem congaudet autem veritati";
vul[7] = "omnia suffert omnia credit omnia sperat omnia sustinet";
vul[8] = "caritas numquam excidit sive prophetiae evacuabuntur sive linguae cessabunt sive scientia destruetur";
vul[9] = "ex parte enim cognoscimus et ex parte prophetamus";
vul[10] = "cum autem venerit quod perfectum est evacuabitur quod ex parte est";
vul[11] = "cum essem parvulus loquebar ut parvulus sapiebam ut parvulus cogitabam ut parvulus quando factus sum vir evacuavi quae erant parvuli";
vul[12] = "videmus nunc per speculum in enigmate tunc autem facie ad faciem nunc cognosco ex parte tunc autem cognoscam sicut et cognitus sum";
vul[13] = "nunc autem manet fides spes caritas tria haec maior autem his est caritas";

yng[1] = "If with the tongues of men and of messengers I speak, and have not love, I have become brass sounding, or a cymbal tinkling;";
yng[2] = "and if I have prophecy, and know all the secrets, and all the knowledge, and if I have all the faith, so as to remove mountains, and have not love, I am nothing;";
yng[3] = "and if I give away to feed others all my goods, and if I give up my body that I may be burned, and have not love, I am profited nothing.";
yng[4] = "The love is long-suffering, it is kind, the love doth not envy, the love doth not vaunt itself, is not puffed up,";
yng[5] = "doth not act unseemly, doth not seek its own things, is not provoked, doth not impute evil,";
yng[6] = "rejoiceth not over the unrighteousness, and rejoiceth with the truth;";
yng[7] = "all things it beareth, all it believeth, all it hopeth, all it endureth.";
yng[8] = "The love doth never fail; and whether [there be] prophecies, they shall become useless; whether tongues, they shall cease; whether knowledge, it shall become useless;";
yng[9] = "for in part we know, and in part we prophecy;";
yng[10] = "and when that which is perfect may come, then that which [is] in part shall become useless.";
yng[11] = "When I was a babe, as a babe I was speaking, as a babe I was thinking, as a babe I was reasoning, and when I have become a man, I have made useless the things of the babe;";
yng[12] = "for we see now through a mirror obscurely, and then face to face; now I know in part, and then I shall fully know, as also I was known;";
yng[13] = "and now there doth remain faith, hope, love -- these three; and the greatest of these [is] love.";
