csb[1] = "Imitate me, as I also imitate Christ.";
csb[2] = "Now I praise you because you remember me in everything and hold fast to the traditions just as I delivered them to you.";
csb[3] = "But I want you to know that Christ is the head of every man, and the man is the head of the woman, and God is the head of Christ.";
csb[4] = "Every man who prays or prophesies with something on his head dishonors his head.";
csb[5] = "Every woman who prays or prophesies with her head uncovered dishonors her head, since that is one and the same as having her head shaved.";
csb[6] = "For if a woman doesn\'t cover her head, she should have her hair cut off. But if it is disgraceful for a woman to have her hair cut off or her head shaved, let her head be covered.";
csb[7] = "A man should not cover his head, because he is the image and glory of God. So too, woman is the glory of man.";
csb[8] = "For man did not come from woman, but woman came from man.";
csb[9] = "Neither was man created for the sake of woman, but woman for the sake of man.";
csb[10] = "This is why a woman should have a symbol of authority on her head, because of the angels.";
csb[11] = "In the Lord, however, woman is not independent of man, and man is not independent of woman.";
csb[12] = "For just as woman came from man, so man comes through woman, and all things come from God.";
csb[13] = "Judge for yourselves: Is it proper for a woman to pray to God with her head uncovered?";
csb[14] = "Does not even nature itself teach you that if a man has long hair it is a disgrace to him,";
csb[15] = "but that if a woman has long hair, it is her glory? For her hair is given to her as a covering.";
csb[16] = "If anyone wants to argue about this, we have no other custom, nor do the churches of God.";
csb[17] = "Now in giving this instruction I do not praise you, since you come together not for the better but for the worse.";
csb[18] = "For to begin with, I hear that when you come together as a church there are divisions among you, and in part I believe it.";
csb[19] = "Indeed, it is necessary that there be factions among you, so that those who are approved may be recognized among you.";
csb[20] = "When you come together, then, it is not to eat the Lord\'s Supper.";
csb[21] = "For at the meal, each one eats his own supper. So one person is hungry while another gets drunk!";
csb[22] = "Don\'t you have homes in which to eat and drink? Or do you despise the church of God and humiliate those who have nothing? What should I say to you? Should I praise you? I do not praise you in this matter!";
csb[23] = "For I received from the Lord what I also passed on to you: On the night when he was betrayed, the Lord Jesus took bread,";
csb[24] = "and when he had given thanks, broke it, and said, &quot;This is my body, which is for you. Do this in remembrance of me.&quot;";
csb[25] = "In the same way also he took the cup, after supper, and said, &quot;This cup is the new covenant in my blood. Do this, as often as you drink it, in remembrance of me.&quot;";
csb[26] = "For as often as you eat this bread and drink the cup, you proclaim the Lord\'s death until he comes.";
csb[27] = "So then, whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty of sin against the body and blood of the Lord.";
csb[28] = "Let a person examine himself; in this way let him eat the bread and drink from the cup.";
csb[29] = "For whoever eats and drinks without recognizing the body, eats and drinks judgment on himself.";
csb[30] = "This is why many are sick and ill among you, and many have fallen asleep.";
csb[31] = "If we were properly judging ourselves, we would not be judged,";
csb[32] = "but when we are judged by the Lord, we are disciplined, so that we may not be condemned with the world.";
csb[33] = "Therefore, my brothers and sisters, when you come together to eat, welcome one another.";
csb[34] = "If anyone is hungry, he should eat at home, so that when you gather together you will not come under judgment. I will give instructions about the other matters whenever I come.";
asv[1] = "Be ye imitators of me, even as I also am of Christ.";
asv[2] = "Now I praise you that ye remember me in all things, and hold fast the traditions, even as I delivered them to you.";
asv[3] = "But I would have you know, that the head of every man is Christ; and the head of the woman is the man; and the head of Christ is God.";
asv[4] = "Every man praying or prophesying, having his head covered, dishonoreth his head.";
asv[5] = "But every woman praying or prophesying with her head unveiled dishonoreth her head; for it is one and the same thing as if she were shaven.";
asv[6] = "For if a woman is not veiled, let her also be shorn: but if it is a shame to a woman to be shorn or shaven, let her be veiled.";
asv[7] = "For a man indeed ought not to have his head veiled, forasmuch as he is the image and glory of God: but the woman is the glory of the man.";
asv[8] = "For the man is not of the woman; but the woman of the man:";
asv[9] = "for neither was the man created for the woman; but the woman for the man:";
asv[10] = "for this cause ought the woman to have [a sign of] authority on her head, because of the angels.";
asv[11] = "Nevertheless, neither is the woman without the man, nor the man without the woman, in the Lord.";
asv[12] = "For as the woman is of the man, so is the man also by the woman; but all things are of God.";
asv[13] = "Judge ye in yourselves: is it seemly that a woman pray unto God unveiled?";
asv[14] = "Doth not even nature itself teach you, that, if a man have long hair, it is a dishonor to him?";
asv[15] = "But if a woman have long hair, it is a glory to her: for her hair is given her for a covering.";
asv[16] = "But if any man seemeth to be contentious, we have no such custom, neither the churches of God.";
asv[17] = "But in giving you this charge, I praise you not, that ye come together not for the better but for the worse.";
asv[18] = "For first of all, when ye come together in the church, I hear that divisions exist among you; and I partly believe it.";
asv[19] = "For there must be also factions among you, that they that are approved may be made manifest among you.";
asv[20] = "When therefore ye assemble yourselves together, it is not possible to eat the Lord\'s supper:";
asv[21] = "for in your eating each one taketh before [other] his own supper; and one is hungry, and another is drunken.";
asv[22] = "What, have ye not houses to eat and to drink in? or despise ye the church of God, and put them to shame that have not? What shall I say to you? shall I praise you? In this I praise you not.";
asv[23] = "For I received of the Lord that which also I delivered unto you, that the Lord Jesus in the night in which he was betrayed took bread;";
asv[24] = "and when he had given thanks, he brake it, and said, This is my body, which is for you: this do in remembrance of me.";
asv[25] = "In like manner also the cup, after supper, saying, This cup is the new covenant in my blood: this do, as often as ye drink [it], in remembrance of me.";
asv[26] = "For as often as ye eat this bread, and drink the cup, ye proclaim the Lord\'s death till he come.";
asv[27] = "Wherefore whosoever shall eat the bread or drink the cup of the Lord in an unworthy manner, shall be guilty of the body and the blood of the Lord.";
asv[28] = "But let a man prove himself, and so let him eat of the bread, and drink of the cup.";
asv[29] = "For he that eateth and drinketh, eateth and drinketh judgment unto himself, if he discern not the body.";
asv[30] = "For this cause many among you are weak and sickly, and not a few sleep.";
asv[31] = "But if we discerned ourselves, we should not be judged.";
asv[32] = "But when we are judged, we are chastened of the Lord, that we may not be condemned with the world.";
asv[33] = "Wherefore, my brethren, when ye come together to eat, wait one for another.";
asv[34] = "If any man is hungry, let him eat at home; that your coming together be not unto judgment. And the rest will I set in order whensoever I come.";
dby[1] = "Be my imitators, even as *I* also [am] of Christ.";
dby[2] = "Now I praise you, that in all things ye are mindful of me; and that as I have directed you, ye keep the directions.";
dby[3] = "But I wish you to know that the Christ is the head of every man, but woman\'s head [is] the man, and the Christ\'s head God.";
dby[4] = "Every man praying or prophesying, having [anything] on his head, puts his head to shame.";
dby[5] = "But every woman praying or prophesying with her head uncovered puts her own head to shame; for it is one and the same as a shaved [woman].";
dby[6] = "For if a woman be not covered, let her hair also be cut off. But if [it be] shameful to a woman to have her hair cut off or to be shaved, let her be covered.";
dby[7] = "For man indeed ought not to have his head covered, being God\'s image and glory; but woman is man\'s glory.";
dby[8] = "For man is not of woman, but woman of man.";
dby[9] = "For also man was not created for the sake of the woman, but woman for the sake of the man.";
dby[10] = "Therefore ought the woman to have authority on her head, on account of the angels.";
dby[11] = "However, neither [is] woman without man, nor man without woman, in [the] Lord.";
dby[12] = "For as the woman [is] of the man, so also [is] the man by the woman, but all things of God.";
dby[13] = "Judge in yourselves: is it comely that a woman should pray to God uncovered?";
dby[14] = "Does not even nature itself teach you, that man, if he have long hair, it is a dishonour to him?";
dby[15] = "But woman, if she have long hair, [it is] glory to her; for the long hair is given [to her] in lieu of a veil.";
dby[16] = "But if any one think to be contentious, *we* have no such custom, nor the assemblies of God.";
dby[17] = "But [in] prescribing [to you on] this [which I now enter on], I do not praise, [namely,] that ye come together, not for the better, but for the worse.";
dby[18] = "For first, when ye come together in assembly, I hear there exist divisions among you, and I partly give credit [to it].";
dby[19] = "For there must also be sects among you, that the approved may become manifest among you.";
dby[20] = "When ye come therefore together into one place, it is not to eat [the] Lord\'s supper.";
dby[21] = "For each one in eating takes his *own* supper before [others], and one is hungry and another drinks to excess.";
dby[22] = "Have ye not then houses for eating and drinking? or do ye despise the assembly of God, and put to shame them who have not? What shall I say to you? shall I praise you? In this [point] I do not praise.";
dby[23] = "For *I* received from the Lord, that which I also delivered to you, that the Lord Jesus, in the night in which he was delivered up, took bread,";
dby[24] = "and having given thanks broke [it], and said, This is my body, which [is] for you: this do in remembrance of me.";
dby[25] = "In like manner also the cup, after having supped, saying, This cup is the new covenant in my blood: this do, as often as ye shall drink [it], in remembrance of me.";
dby[26] = "For as often as ye shall eat this bread, and drink the cup, ye announce the death of the Lord, until he come.";
dby[27] = "So that whosoever shall eat the bread, or drink the cup of the Lord, unworthily, shall be guilty in respect of the body and of the blood of the Lord.";
dby[28] = "But let a man prove himself, and thus eat of the bread, and drink of the cup.";
dby[29] = "For [the] eater and drinker eats and drinks judgment to himself, not distinguishing the body.";
dby[30] = "On this account many among you [are] weak and infirm, and a good many are fallen asleep.";
dby[31] = "But if we judged ourselves, so were we not judged.";
dby[32] = "But being judged, we are disciplined of [the] Lord, that we may not be condemned with the world.";
dby[33] = "So that, my brethren, when ye come together to eat, wait for one another.";
dby[34] = "If any one be hungry, let him eat at home, that ye may not come together for judgment. But the other things, whenever I come, I will set in order.";
hnv[1] = "Be imitators of me, even as I also am of Messiah.";
hnv[2] = "Now I praise you, brothers, that you remember me in all things, and hold firm the traditions, even as I delivered them to you.";
hnv[3] = "But I would have you know that the head of every man is Messiah, and the head of the woman is the man, and the head of Messiah is God.";
hnv[4] = "Every man praying or prophesying, having his head covered, dishonors his head.";
hnv[5] = "But every woman praying or prophesying with her head unveiled dishonors her head. For it is one and the same thing as if she were shaved.";
hnv[6] = "For if a woman is not covered, let her also be shorn. But if it is shameful for a woman to be shorn or shaved, let her be covered.";
hnv[7] = "For a man indeed ought not to have his head covered, because he is the image and glory of God, but the woman is the glory of the man.";
hnv[8] = "For man is not from woman, but woman from man;";
hnv[9] = " for neither was man created for the woman, but woman for the man.";
hnv[10] = "For this cause the woman ought to have authority on her head, because of the angels.";
hnv[11] = "Nevertheless, neither is the woman independent of the man, nor the man independent of the woman, in the Lord.";
hnv[12] = "For as woman came from man, so a man also comes through a woman; but all things are from God.";
hnv[13] = "Judge for yourselves. Is it appropriate that a woman pray to God unveiled?";
hnv[14] = "Doesn\'t even nature itself teach you that if a man has long hair, it is a dishonor to him?";
hnv[15] = "But if a woman has long hair, it is a glory to her, for her hair is given to her for a covering.";
hnv[16] = "But if any man seems to be contentious, we have no such custom, neither do God\'s assemblies.";
hnv[17] = "But in giving you this command, I don\'t praise you, that you come together not for the better but for the worse.";
hnv[18] = "For first of all, when you come together in the assembly, I hear that divisions exist among you, and I partly believe it.";
hnv[19] = "For there also must be factions among you, that those who are approved may be revealed among you.";
hnv[20] = "When therefore you assemble yourselves together, it is not possible to eat the Lord\'s supper.";
hnv[21] = "For in your eating each one takes his own supper before others. One is hungry, and another is drunken.";
hnv[22] = "What, don\'t you have houses to eat and to drink in? Or do you despise God\'s assembly, and put them to shame who don\'t have? What shall I tell you? Shall I praise you? In this I don\'t praise you.";
hnv[23] = "For I received from the Lord that which also I delivered to you, that the Lord Yeshua on the night in which he was betrayed took bread.";
hnv[24] = "When he had given thanks, he broke it, and said, &quot;Take, eat. This is my body, which is broken for you. Do this in memory of me.&quot;";
hnv[25] = "In the same way he also took the cup, after supper, saying, &quot;This cup is the new covenant in my blood. Do this, as often as you drink, in memory of me.&quot;";
hnv[26] = "For as often as you eat this bread and drink this cup, you proclaim the Lord\'s death until he comes.";
hnv[27] = "Therefore whoever eats this bread or drinks the Lord\'s cup in a manner unworthy of the Lord will be guilty of the body and the blood of the Lord.";
hnv[28] = "But let a man examine himself, and so let him eat of the bread, and drink of the cup.";
hnv[29] = "For he who eats and drinks in an unworthy manner eats and drinks judgment to himself, if he doesn\'t discern the Lord\'s body.";
hnv[30] = "For this cause many among you are weak and sickly, and not a few sleep.";
hnv[31] = "For if we discerned ourselves, we wouldn\'t be judged.";
hnv[32] = "But when we are judged, we are punished by the Lord, that we may not be condemned with the world.";
hnv[33] = " Therefore, my brothers, when you come together to eat, wait one for another.";
hnv[34] = "But if anyone is hungry, let him eat at home, lest your coming together be for judgment. The rest I will set in order whenever I come.";

kjv[11] = "Nevertheless neither is the man without the woman, neither the woman without the man, in the Lord.";
kjv[12] = "For as the woman [is] of the man, even so [is] the man also by the woman; but all things of God.";

rsv[1] = "Be imitators of me, as I am of Christ.";
rsv[2] = "I commend you because you remember me in everything and maintain the traditions even as I have delivered them to you.";
rsv[3] = "But I want you to understand that the head of every man is Christ, the head of a woman is her husband, and the head of Christ is God.";
rsv[4] = "Any man who prays or prophesies with his head covered dishonors his head,";
rsv[5] = "but any woman who prays or prophesies with her head unveiled dishonors her head--it is the same as if her head were shaven.";
rsv[6] = "For if a woman will not veil herself, then she should cut off her hair; but if it is disgraceful for a woman to be shorn or shaven, let her wear a veil.";
rsv[7] = "For a man ought not to cover his head, since he is the image and glory of God; but woman is the glory of man.";
rsv[8] = "(For man was not made from woman, but woman from man.";
rsv[9] = "Neither was man created for woman, but woman for man.)";
rsv[10] = "That is why a woman ought to have a veil on her head, because of the angels.";
rsv[11] = "(Nevertheless, in the Lord woman is not independent of man nor man of woman;";
rsv[12] = "for as woman was made from man, so man is now born of woman. And all things are from God.)";
rsv[13] = "Judge for yourselves; is it proper for a woman to pray to God with her head uncovered?";
rsv[14] = "Does not nature itself teach you that for a man to wear long hair is degrading to him,";
rsv[15] = "but if a woman has long hair, it is her pride? For her hair is given to her for a covering.";
rsv[16] = "If any one is disposed to be contentious, we recognize no other practice, nor do the churches of God.";
rsv[17] = "But in the following instructions I do not commend you, because when you come together it is not for the better but for the worse.";
rsv[18] = "For, in the first place, when you assemble as a church, I hear that there are divisions among you; and I partly believe it,";
rsv[19] = "for there must be factions among you in order that those who are genuine among you may be recognized.";
rsv[20] = "When you meet together, it is not the Lord\'s supper that you eat.";
rsv[21] = "For in eating, each one goes ahead with his own meal, and one is hungry and another is drunk.";
rsv[22] = "What! Do you not have houses to eat and drink in? Or do you despise the church of God and humiliate those who have nothing? What shall I say to you? Shall I commend you in this? No, I will not.";
rsv[23] = "For I received from the Lord what I also delivered to you, that the Lord Jesus on the night when he was betrayed took bread,";
rsv[24] = "and when he had given thanks, he broke it, and said, &quot;This is my body which is for you. Do this in remembrance of me.&quot;";
rsv[25] = "In the same way also the cup, after supper, saying, &quot;This cup is the new covenant in my blood. Do this, as often as you drink it, in remembrance of me.&quot;";
rsv[26] = "For as often as you eat this bread and drink the cup, you proclaim the Lord\'s death until he comes.";
rsv[27] = "Whoever, therefore, eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty of profaning the body and blood of the Lord.";
rsv[28] = "Let a man examine himself, and so eat of the bread and drink of the cup.";
rsv[29] = "For any one who eats and drinks without discerning the body eats and drinks judgment upon himself.";
rsv[30] = "That is why many of you are weak and ill, and some have died.";
rsv[31] = "But if we judged ourselves truly, we should not be judged.";
rsv[32] = "But when we are judged by the Lord, we are chastened so that we may not be condemned along with the world.";
rsv[33] = "So then, my brethren, when you come together to eat, wait for one another--";
rsv[34] = "if any one is hungry, let him eat at home--lest you come together to be condemned. About the other things I will give directions when I come.";
vul[1] = "imitatores mei estote sicut et ego Christi";
vul[2] = "laudo autem vos fratres quod omnia mei memores estis et sicut tradidi vobis praecepta mea tenetis";
vul[3] = "volo autem vos scire quod omnis viri caput Christus est caput autem mulieris vir caput vero Christi Deus";
vul[4] = "omnis vir orans aut prophetans velato capite deturpat caput suum";
vul[5] = "omnis autem mulier orans aut prophetans non velato capite deturpat caput suum unum est enim atque si decalvetur";
vul[6] = "nam si non velatur mulier et tondeatur si vero turpe est mulieri tonderi aut decalvari velet caput suum";
vul[7] = "vir quidem non debet velare caput quoniam imago et gloria est Dei mulier autem gloria viri est";
vul[8] = "non enim vir ex muliere est sed mulier ex viro";
vul[9] = "etenim non est creatus vir propter mulierem sed mulier propter virum";
vul[10] = "ideo debet mulier potestatem habere supra caput propter angelos";
vul[11] = "verumtamen neque vir sine muliere neque mulier sine viro in Domino";
vul[12] = "nam sicut mulier de viro ita et vir per mulierem omnia autem ex Deo";
vul[13] = "vos ipsi iudicate decet mulierem non velatam orare Deum";
vul[14] = "nec ipsa natura docet vos quod vir quidem si comam nutriat ignominia est illi";
vul[15] = "mulier vero si comam nutriat gloria est illi quoniam capilli pro velamine ei dati sunt";
vul[16] = "si quis autem videtur contentiosus esse nos talem consuetudinem non habemus neque ecclesiae Dei";
vul[17] = "hoc autem praecipio non laudans quod non in melius sed in deterius convenitis";
vul[18] = "primum quidem convenientibus vobis in ecclesia audio scissuras esse et ex parte credo";
vul[19] = "nam oportet et hereses esse ut et qui probati sunt manifesti fiant in vobis";
vul[20] = "convenientibus ergo vobis in unum iam non est dominicam cenam manducare";
vul[21] = "unusquisque enim suam cenam praesumit ad manducandum et alius quidem esurit alius autem ebrius est";
vul[22] = "numquid domos non habetis ad manducandum et bibendum aut ecclesiam Dei contemnitis et confunditis eos qui non habent quid dicam vobis laudo vos in hoc non laudo";
vul[23] = "ego enim accepi a Domino quod et tradidi vobis quoniam Dominus Iesus in qua nocte tradebatur accepit panem";
vul[24] = "et gratias agens fregit et dixit hoc est corpus meum pro vobis hoc facite in meam commemorationem";
vul[25] = "similiter et calicem postquam cenavit dicens hic calix novum testamentum est in meo sanguine hoc facite quotienscumque bibetis in meam commemorationem";
vul[26] = "quotienscumque enim manducabitis panem hunc et calicem bibetis mortem Domini adnuntiatis donec veniat";
vul[27] = "itaque quicumque manducaverit panem vel biberit calicem Domini indigne reus erit corporis et sanguinis Domini";
vul[28] = "probet autem se ipsum homo et sic de pane illo edat et de calice bibat";
vul[29] = "qui enim manducat et bibit indigne iudicium sibi manducat et bibit non diiudicans corpus";
vul[30] = "ideo inter vos multi infirmes et inbecilles et dormiunt multi";
vul[31] = "quod si nosmet ipsos diiudicaremus non utique iudicaremur";
vul[32] = "dum iudicamur autem a Domino corripimur ut non cum hoc mundo damnemur";
vul[33] = "itaque fratres mei cum convenitis ad manducandum invicem expectate";
vul[34] = "si quis esurit domi manducet ut non in iudicium conveniatis cetera autem cum venero disponam";
web[1] = "Be ye followers of me, even as I also [am] of Christ.";
web[2] = "Now I praise you, brethren, that ye remember me in all things, and keep the ordinances, as I delivered [them] to you.";
web[3] = "But I would have you know, that the head of every man is Christ; and the head of the woman [is] the man; and the head of Christ [is] God.";
web[4] = "Every man praying or prophesying, having [his] head covered, dishonoreth his head.";
web[5] = "But every woman that prayeth or prophesieth with [her] head uncovered, dishonoreth her head: for that is even all one as if she were shaved.";
web[6] = "For if the woman is not covered, let her also be shorn: but if it is a shame for a woman to be shorn or shaved, let her be covered.";
web[7] = "For a man indeed ought not to cover [his] head, forasmuch as he is the image and glory of God: but the woman is the glory of the man.";
web[8] = "For the man is not from the woman, but the woman from the man.";
web[9] = "Neither was the man created for the woman, but the woman for the man.";
web[10] = "For this cause ought the woman to have power on [her] head, because of the angels.";
web[11] = "Nevertheless, neither is the man without the woman, neither the woman without the man in the Lord.";
web[12] = "For as the woman [is] from the man, even so [is] the man also by the woman; but all things from God.";
web[13] = "Judge in yourselves: Is it comely that a woman should pray to God uncovered?";
web[14] = "Doth not even nature itself teach you, that if a man hath long hair, it is a shame to him?";
web[15] = "But if a woman hath long hair, it is a glory to her: for [her] hair is given her for a covering.";
web[16] = "But if any man seemeth to be contentious, we have no such custom, neither the churches of God.";
web[17] = "Now in this that I declare [to you], I praise [you] not, that ye come together not for the better, but for the worse.";
web[18] = "For first of all, when ye come together in the church, I hear that there are divisions among you; and I partly believe it.";
web[19] = "For there must be also heresies among you, that they who are approved may be made manifest among you.";
web[20] = "When therefore ye come together in one place, [this] is not to eat the Lord\'s supper.";
web[21] = "For in eating every one taketh before [another] his own supper: and one is hungry, and another is drunken.";
web[22] = "What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? What shall I say to you? shall I praise you in this? I praise [you] not.";
web[23] = "For I have received from the Lord, that which also I delivered to you, That the Lord Jesus, the [same] night in which he was betrayed, took bread:";
web[24] = "And when he had given thanks, he broke [it], and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me.";
web[25] = "After the same manner also [he took] the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as often as ye drink [it], in remembrance of me.";
web[26] = "For as often as ye eat this bread, and drink this cup, ye do show the Lord\'s death till he shall come.";
web[27] = "Wherefore, whoever shall eat this bread, and drink [this] cup of the Lord unworthily, shall be guilty of the body and blood of the Lord.";
web[28] = "But let a man examine himself, and so let him eat of [that] bread, and drink of [that] cup.";
web[29] = "For he that eateth and drinketh unworthily, eateth and drinketh condemnation to himself, not discerning the Lord\'s body.";
web[30] = "For this cause many [are] weak and sickly among you, and many sleep.";
web[31] = "For if we would judge ourselves, we should not be judged.";
web[32] = "But when we are judged, we are chastened by the Lord, that we should not be condemned with the world.";
web[33] = "Wherefore, my brethren, when ye come together to eat, tarry one for another.";
web[34] = "And if any man hungereth, let him eat at home; that ye come not together to condemnation. And the rest will I set in order when I come.";
yng[1] = "Followers of me become ye, as I also [am] of Christ.";
yng[2] = "And I praise you, brethren, that in all things ye remember me, and according as I did deliver to you, the deliverances ye keep,";
yng[3] = "and I wish you to know that of every man the head is the Christ, and the head of a woman is the husband, and the head of Christ is God.";
yng[4] = "Every man praying or prophesying, having the head covered, doth dishonour his head,";
yng[5] = "and every woman praying or prophesying with the head uncovered, doth dishonour her own head, for it is one and the same thing with her being shaven,";
yng[6] = "for if a woman is not covered -- then let her be shorn, and if [it is] a shame for a woman to be shorn or shaven -- let her be covered;";
yng[7] = "for a man, indeed, ought not to cover the head, being the image and glory of God, and a woman is the glory of a man,";
yng[8] = "for a man is not of a woman, but a woman [is] of a man,";
yng[9] = "for a man also was not created because of the woman, but a woman because of the man;";
yng[10] = "because of this the woman ought to have [a token of] authority upon the head, because of the messengers;";
yng[11] = "but neither [is] a man apart from a woman, nor a woman apart from a man, in the Lord,";
yng[12] = "for as the woman [is] of the man, so also the man [is] through the woman, and the all things [are] of God.";
yng[13] = "In your own selves judge ye; is it seemly for a woman uncovered to pray to God?";
yng[14] = "doth not even nature itself teach you, that if a man indeed have long hair, a dishonour it is to him?";
yng[15] = "and a woman, if she have long hair, a glory it is to her, because the hair instead of a covering hath been given to her;";
yng[16] = "and if any one doth think to be contentious, we have no such custom, neither the assemblies of God.";
yng[17] = "And this declaring, I give no praise, because not for the better, but for the worse ye come together;";
yng[18] = "for first, indeed, ye coming together in an assembly, I hear of divisions being among you, and partly I believe [it],";
yng[19] = "for it behoveth sects also to be among you, that those approved may become manifest among you;";
yng[20] = "ye, then, coming together at the same place -- it is not to eat the Lord\'s supper;";
yng[21] = "for each his own supper doth take before in the eating, and one is hungry, and another is drunk;";
yng[22] = "why, have ye not houses to eat and to drink in? or the assembly of God do ye despise, and shame those not having? what may I say to you? shall I praise you in this? I do not praise!";
yng[23] = "For I -- I received from the Lord that which also I did deliver to you, that the Lord Jesus in the night in which he was delivered up, took bread,";
yng[24] = "and having given thanks, he brake, and said, `Take ye, eat ye, this is my body, that for you is being broken; this do ye -- to the remembrance of me.\'";
yng[25] = "In like manner also the cup after the supping, saying, `This cup is the new covenant in my blood; this do ye, as often as ye may drink [it] -- to the remembrance of me;\'";
yng[26] = "for as often as ye may eat this bread, and this cup may drink, the death of the Lord ye do shew forth -- till he may come;";
yng[27] = "so that whoever may eat this bread or may drink the cup of the Lord unworthily, guilty he shall be of the body and blood of the Lord:";
yng[28] = "and let a man be proving himself, and so of the bread let him eat, and of the cup let him drink;";
yng[29] = "for he who is eating and drinking unworthily, judgment to himself he doth eat and drink -- not discerning the body of the Lord.";
yng[30] = "Because of this, among you many [are] weak and sickly, and sleep do many;";
yng[31] = "for if ourselves we were discerning, we would not be being judged,";
yng[32] = "and being judged by the Lord, we are chastened, that with the world we may not be condemned;";
yng[33] = "so then, my brethren, coming together to eat, for one another wait ye;";
yng[34] = "and if any one is hungry, at home let him eat, that to judgment ye may not come together; and the rest, whenever I may come, I shall arrange.";
