csb[1] = "When I came to you, brothers and sisters, announcing the mystery of God to you, I did not come with brilliance of speech or wisdom.";
csb[2] = "I decided to know nothing among you except Jesus Christ and him crucified.";
csb[3] = "I came to you in weakness, in fear, and in much trembling.";
csb[4] = "My speech and my preaching were not with persuasive words of wisdom but with a demonstration of the Spirit\'s power,";
csb[5] = "so that your faith might not be based on human wisdom but on God\'s power.";
csb[6] = "We do, however, speak a wisdom among the mature, but not a wisdom of this age, or of the rulers of this age, who are coming to nothing.";
csb[7] = "On the contrary, we speak God\'s hidden wisdom in a mystery, a wisdom God predestined before the ages for our glory.";
csb[8] = "None of the rulers of this age knew this wisdom, because if they had known it, they would not have crucified the Lord of glory.";
csb[9] = "But as it is written, What no eye has seen, no ear has heard, and no human heart has conceived -- God has prepared these things for those who love him.";
csb[10] = "Now God has revealed these things to us by the Spirit, since the Spirit searches everything, even the depths of God.";
csb[11] = "For who knows a person\'s thoughts except his spirit within him? In the same way, no one knows the thoughts of God except the Spirit of God.";
csb[12] = "Now we have not received the spirit of the world, but the Spirit who comes from God, so that we may understand what has been freely given to us by God.";
csb[13] = "We also speak these things, not in words taught by human wisdom, but in those taught by the Spirit, explaining spiritual things to spiritual people.";
csb[14] = "But the person without the Spirit does not receive what comes from God\'s Spirit, because it is foolishness to him; he is not able to understand it since it is evaluated spiritually.";
csb[15] = "The spiritual person, however, can evaluate everything, and yet he himself cannot be evaluated by anyone.";
csb[16] = "For who has known the Lord\'s mind, that he may instruct him? But we have the mind of Christ.";
asv[1] = "And I, brethren, when I came unto you, came not with excellency of speech or of wisdom, proclaiming to you the testimony of God.";
asv[2] = "For I determined not to know anything among you, save Jesus Christ, and him crucified.";
asv[3] = "And I was with you in weakness, and in fear, and in much trembling.";
asv[4] = "And my speech and my preaching were not in persuasive words of wisdom, but in demonstration of the Spirit and of power:";
asv[5] = "that your faith should not stand in the wisdom of men, but in the power of God.";
asv[6] = "We speak wisdom, however, among them that are fullgrown: yet a wisdom not of this world, nor of the rulers of this world, who are coming to nought:";
asv[7] = "but we speak God\'s wisdom in a mystery, [even] the [wisdom] that hath been hidden, which God foreordained before the worlds unto our glory:";
asv[8] = "which none of the rulers of this world hath known: for had they known it, they would not have crucified the Lord of glory:";
asv[9] = "but as it is written, Things which eye saw not, and ear heard not, And [which] entered not into the heart of man, Whatsoever things God prepared for them that love him. ";
asv[10] = "But unto us God revealed [them] through the Spirit: for the Spirit searcheth all things, yea, the deep things of God.";
asv[11] = "For who among men knoweth the things of a man, save the spirit of the man, which is in him? even so the things of God none knoweth, save the Spirit of God.";
asv[12] = "But we received, not the spirit of the world, but the spirit which is from God; that we might know the things that were freely given to us of God.";
asv[13] = "Which things also we speak, not in words which man\'s wisdom teacheth, but which the Spirit teacheth; combining spiritual things with spiritual [words].";
asv[14] = "Now the natural man receiveth not the things of the Spirit of God: for they are foolishness unto him; and he cannot know them, because they are spiritually judged.";
asv[15] = "But he that is spiritual judgeth all things, and he himself is judged of no man.";
asv[16] = "For who hath known the mind of the Lord, that he should instruct him? But we have the mind of Christ.";

hnv[1] = "When I came to you, brothers, I didn\'t come with excellence of speech or of wisdom, proclaiming to you the testimony of God.";

hnv[10] = "But to us, God revealed them through the Spirit. For the Spirit searches all things, yes, the deep things of God.";

rsv[1] = "When I came to you, brethren, I did not come proclaiming to you the testimony of God in lofty words or wisdom.";
rsv[2] = "For I decided to know nothing among you except Jesus Christ and him crucified.";
rsv[3] = "And I was with you in weakness and in much fear and trembling;";
rsv[4] = "and my speech and my message were not in plausible words of wisdom, but in demonstration of the Spirit and of power,";
rsv[5] = "that your faith might not rest in the wisdom of men but in the power of God.";
rsv[6] = "Yet among the mature we do impart wisdom, although it is not a wisdom of this age or of the rulers of this age, who are doomed to pass away.";
rsv[7] = "But we impart a secret and hidden wisdom of God, which God decreed before the ages for our glorification.";
rsv[8] = "None of the rulers of this age understood this; for if they had, they would not have crucified the Lord of glory.";
rsv[9] = "But, as it is written, &quot;What no eye has seen, nor ear heard, nor the heart of man conceived, what God has prepared for those who love him,&quot;";
rsv[10] = "God has revealed to us through the Spirit. For the Spirit searches everything, even the depths of God.";
rsv[11] = "For what person knows a man\'s thoughts except the spirit of the man which is in him? So also no one comprehends the thoughts of God except the Spirit of God.";
rsv[12] = "Now we have received not the spirit of the world, but the Spirit which is from God, that we might understand the gifts bestowed on us by God.";
rsv[13] = "And we impart this in words not taught by human wisdom but taught by the Spirit, interpreting spiritual truths to those who possess the Spirit.";
rsv[14] = "The unspiritual man does not receive the gifts of the Spirit of God, for they are folly to him, and he is not able to understand them because they are spiritually discerned.";
rsv[15] = "The spiritual man judges all things, but is himself to be judged by no one.";
rsv[16] = "&quot;For who has known the mind of the Lord so as to instruct him?&quot; But we have the mind of Christ.";
vul[1] = "et ego cum venissem ad vos fratres veni non per sublimitatem sermonis aut sapientiae adnuntians vobis testimonium Christi";
vul[2] = "non enim iudicavi scire me aliquid inter vos nisi Iesum Christum et hunc crucifixum";
vul[3] = "et ego in infirmitate et timore et tremore multo fui apud vos";
vul[4] = "et sermo meus et praedicatio mea non in persuasibilibus sapientiae verbis sed in ostensione Spiritus et virtutis";
vul[5] = "ut fides vestra non sit in sapientia hominum sed in virtute Dei";
vul[6] = "sapientiam autem loquimur inter perfectos sapientiam vero non huius saeculi neque principum huius saeculi qui destruuntur";
vul[7] = "sed loquimur Dei sapientiam in mysterio quae abscondita est quam praedestinavit Deus ante saecula in gloriam nostram";
vul[8] = "quam nemo principum huius saeculi cognovit si enim cognovissent numquam Dominum gloriae crucifixissent";
vul[9] = "sed sicut scriptum est quod oculus non vidit nec auris audivit nec in cor hominis ascendit quae praeparavit Deus his qui diligunt illum";
vul[10] = "nobis autem revelavit Deus per Spiritum suum Spiritus enim omnia scrutatur etiam profunda Dei";
vul[11] = "quis enim scit hominum quae sint hominis nisi spiritus hominis qui in ipso est ita et quae Dei sunt nemo cognovit nisi Spiritus Dei";
vul[12] = "nos autem non spiritum mundi accepimus sed Spiritum qui ex Deo est ut sciamus quae a Deo donata sunt nobis";
vul[13] = "quae et loquimur non in doctis humanae sapientiae verbis sed in doctrina Spiritus spiritalibus spiritalia conparantes";
vul[14] = "animalis autem homo non percipit ea quae sunt Spiritus Dei stultitia est enim illi et non potest intellegere quia spiritaliter examinatur";
vul[15] = "spiritalis autem iudicat omnia et ipse a nemine iudicatur";
vul[16] = "quis enim cognovit sensum Domini qui instruat eum nos autem sensum Christi habemus";

yng[1] = "And I, having come unto you, brethren, came -- not in superiority of discourse or wisdom -- declaring to you the testimony of God,";
yng[2] = "for I decided not to know any thing among you, except Jesus Christ, and him crucified;";
yng[3] = "and I, in weakness, and in fear, and in much trembling, was with you;";
yng[4] = "and my word and my preaching was not in persuasive words of human wisdom, but in demonstration of the Spirit and of power --";
yng[5] = "that your faith may not be in the wisdom of men, but in the power of God.";
yng[6] = "And wisdom we speak among the perfect, and wisdom not of this age, nor of the rulers of this age -- of those becoming useless,";
yng[7] = "but we speak the hidden wisdom of God in a secret, that God foreordained before the ages to our glory,";
yng[8] = "which no one of the rulers of this age did know, for if they had known, the Lord of the glory they would not have crucified;";
yng[9] = "but, according as it hath been written, `What eye did not see, and ear did not hear, and upon the heart of man came not up, what God did prepare for those loving Him --\'";
yng[10] = "but to us did God reveal [them] through His Spirit, for the Spirit all things doth search, even the depths of God,";
yng[11] = "for who of men hath known the things of the man, except the spirit of the man that [is] in him? so also the things of God no one hath known, except the Spirit of God.";
yng[12] = "And we the spirit of the world did not receive, but the Spirit that [is] of God, that we may know the things conferred by God on us,";
yng[13] = "which things also we speak, not in words taught by human wisdom, but in those taught by the Holy Spirit, with spiritual things spiritual things comparing,";
yng[14] = "and the natural man doth not receive the things of the Spirit of God, for to him they are foolishness, and he is not able to know [them], because spiritually they are discerned;";
yng[15] = "and he who is spiritual, doth discern indeed all things, and he himself is by no one discerned;";
yng[16] = "for who did know the mind of the Lord that he shall instruct Him? and we -- we have the mind of Christ.";
