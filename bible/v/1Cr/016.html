csb[1] = "Now about the collection for the saints: Do the same as I instructed the Galatian churches.";
csb[2] = "On the first day of the week, each of you is to set something aside and save in keeping with how he is prospering, so that no collections will need to be made when I come.";
csb[3] = "When I arrive, I will send with letters those you recommend to carry your gift to Jerusalem.";
csb[4] = "If it is suitable for me to go as well, they will travel with me.";
csb[5] = "I will come to you after I pass through Macedonia -- for I will be traveling through Macedonia --";
csb[6] = "and perhaps I will remain with you or even spend the winter, so that you may send me on my way wherever I go.";
csb[7] = "I don\'t want to see you now just in passing, since I hope to spend some time with you, if the Lord allows.";
csb[8] = "But I will stay in Ephesus until Pentecost,";
csb[9] = "because a wide door for effective ministry has opened for me -- yet many oppose me.";
csb[10] = "If Timothy comes, see that he has nothing to fear while with you, because he is doing the Lord\'s work, just as I am.";
csb[11] = "So let no one look down on him. Send him on his way in peace so that he can come to me, because I am expecting him with the brothers.";
csb[12] = "Now about our brother Apollos: I strongly urged him to come to you with the brothers, but he was not at all willing to come now. However, he will come when he has an opportunity.";
csb[13] = "Be alert, stand firm in the faith, be courageous, be strong.";
csb[14] = "Do everything in love.";
csb[15] = "Brothers and sisters, you know the household of Stephanas: They are the firstfruits of Achaia and have devoted themselves to serving the saints. I urge you";
csb[16] = "also to submit to such people, and to everyone who works and labors with them.";
csb[17] = "I am delighted to have Stephanas, Fortunatus, and Achaicus present, because these men have made up for your absence.";
csb[18] = "For they have refreshed my spirit and yours. Therefore recognize such people.";
csb[19] = "The churches of Asia send you greetings. Aquila and Priscilla send you greetings warmly in the Lord, along with the church that meets in their home.";
csb[20] = "All the brothers and sisters send you greetings. Greet one another with a holy kiss.";
csb[21] = "This greeting is in my own hand -- Paul.";
csb[22] = "If anyone does not love the Lord, a curse be on him. Our Lord, come!";
csb[23] = "The grace of the Lord Jesus be with you.";
csb[24] = "My love be with all of you in Christ Jesus.";
