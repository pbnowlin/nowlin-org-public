csb[1] = "Now I want to make clear for you, brothers and sisters, the gospel I preached to you, which you received, on which you have taken your stand";
csb[2] = "and by which you are being saved, if you hold to the message I preached to you -- unless you believed in vain.";
csb[3] = "For I passed on to you as most important what I also received: that Christ died for our sins according to the Scriptures,";
csb[4] = "that he was buried, that he was raised on the third day according to the Scriptures,";
csb[5] = "and that he appeared to Cephas, then to the Twelve.";
csb[6] = "Then he appeared to over five hundred brothers and sisters at one time; most of them are still alive, but some have fallen asleep.";
csb[7] = "Then he appeared to James, then to all the apostles.";
csb[8] = "Last of all, as to one born at the wrong time, he also appeared to me.";
csb[9] = "For I am the least of the apostles, not worthy to be called an apostle, because I persecuted the church of God.";
csb[10] = "But by the grace of God I am what I am, and his grace toward me was not in vain. On the contrary, I worked harder than any of them, yet not I, but the grace of God that was with me.";
csb[11] = "Whether, then, it is I or they, so we proclaim and so you have believed.";
csb[12] = "Now if Christ is proclaimed as raised from the dead, how can some of you say, &quot;There is no resurrection of the dead&quot;?";
csb[13] = "If there is no resurrection of the dead, then not even Christ has been raised;";
csb[14] = "and if Christ has not been raised, then our proclamation is in vain, and so is your faith.";
csb[15] = "Moreover, we are found to be false witnesses about God, because we have testified wrongly about God that he raised up Christ -- whom he did not raise up, if in fact the dead are not raised.";
csb[16] = "For if the dead are not raised, not even Christ has been raised.";
csb[17] = "And if Christ has not been raised, your faith is worthless; you are still in your sins.";
csb[18] = "Those, then, who have fallen asleep in Christ have also perished.";
csb[19] = "If we have put our hope in Christ for this life only, we should be pitied more than anyone.";
csb[20] = "But as it is, Christ has been raised from the dead, the firstfruits of those who have fallen asleep.";
csb[21] = "For since death came through a man, the resurrection of the dead also comes through a man.";
csb[22] = "For just as in Adam all die, so also in Christ all will be made alive.";
csb[23] = "But each in his own order: Christ, the firstfruits; afterward, at his coming, those who belong to Christ.";
csb[24] = "Then comes the end, when he hands over the kingdom to God the Father, when he abolishes all rule and all authority and power.";
csb[25] = "For he must reign until he puts all his enemies under his feet.";
csb[26] = "The last enemy to be abolished is death.";
csb[27] = "For God has put everything under his feet. Now when it says &quot;everything&quot; is put under him, it is obvious that he who puts everything under him is the exception.";
csb[28] = "When everything is subject to Christ, then the Son himself will also be subject to the one who subjected everything to him, so that God may be all in all.";
csb[29] = "Otherwise what will they do who are being baptized for the dead? If the dead are not raised at all, then why are people baptized for them?";
csb[30] = "Why are we in danger every hour?";
csb[31] = "I face death every day, as surely as I may boast about you, brothers and sisters, in Christ Jesus our Lord.";
csb[32] = "If I fought wild beasts in Ephesus as a mere man, what good did that do me? If the dead are not raised, Let us eat and drink, for tomorrow we die.";
csb[33] = "Do not be deceived: &quot;Bad company corrupts good morals.&quot;";
csb[34] = "Come to your senses and stop sinning; for some people are ignorant about God. I say this to your shame.";
csb[35] = "But someone will ask, &quot;How are the dead raised? What kind of body will they have when they come? &quot;";
csb[36] = "You fool! What you sow does not come to life unless it dies.";
csb[37] = "And as for what you sow -- you are not sowing the body that will be, but only a seed, perhaps of wheat or another grain.";
csb[38] = "But God gives it a body as he wants, and to each of the seeds its own body.";
csb[39] = "Not all flesh is the same flesh; there is one flesh for humans, another for animals, another for birds, and another for fish.";
csb[40] = "There are heavenly bodies and earthly bodies, but the splendor of the heavenly bodies is different from that of the earthly ones.";
csb[41] = "There is a splendor of the sun, another of the moon, and another of the stars; in fact, one star differs from another star in splendor.";
csb[42] = "So it is with the resurrection of the dead: Sown in corruption, raised in incorruption;";
csb[43] = "sown in dishonor, raised in glory; sown in weakness, raised in power;";
csb[44] = "sown a natural body, raised a spiritual body. If there is a natural body, there is also a spiritual body.";
csb[45] = "So it is written, The first man Adam became a living being; the last Adam became a life-giving spirit.";
csb[46] = "However, the spiritual is not first, but the natural, then the spiritual.";
csb[47] = "The first man was from the earth, a man of dust; the second man is from heaven.";
csb[48] = "Like the man of dust, so are those who are of the dust; like the man of heaven, so are those who are of heaven.";
csb[49] = "And just as we have borne the image of the man of dust, we will also bear the image of the man of heaven.";
csb[50] = "What I am saying, brothers and sisters, is this: Flesh and blood cannot inherit the kingdom of God, nor can corruption inherit incorruption.";
csb[51] = "Listen, I am telling you a mystery: We will not all fall asleep, but we will all be changed,";
csb[52] = "in a moment, in the twinkling of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised incorruptible, and we will be changed.";
csb[53] = "For this corruptible body must be clothed with incorruptibility, and this mortal body must be clothed with immortality.";
csb[54] = "When this corruptible body is clothed with incorruptibility, and this mortal body is clothed with immortality, then the saying that is written will take place: Death has been swallowed up in victory.";
csb[55] = "Where, death, is your victory? Where, death, is your sting?";
csb[56] = "The sting of death is sin, and the power of sin is the law.";
csb[57] = "But thanks be to God, who gives us the victory through our Lord Jesus Christ!";
csb[58] = "Therefore, my dear brothers and sisters, be steadfast, immovable, always excelling in the Lord\'s work, because you know that your labor in the Lord is not in vain.";
asv[1] = "Now I make known unto you brethren, the gospel which I preached unto you, which also ye received, wherein also ye stand,";
asv[2] = "by which also ye are saved, if ye hold fast the word which I preached unto you, except ye believed in vain.";
asv[3] = "For I delivered unto you first of all that which also I received: that Christ died for our sins according to the scriptures;";
asv[4] = "and that he was buried; and that he hath been raised on the third day according to the scriptures;";
asv[5] = "and that he appeared to Cephas; then to the twelve;";
asv[6] = "then he appeared to above five hundred brethren at once, of whom the greater part remain until now, but some are fallen asleep;";
asv[7] = "then he appeared to James; then to all the apostles;";
asv[8] = "and last of all, as to the [child] untimely born, he appeared to me also.";
asv[9] = "For I am the least of the apostles, that am not meet to be called an apostle, because I persecuted the church of God.";
asv[10] = "But by the grace of God I am what I am: and his grace which was bestowed upon me was not found vain; but I labored more abundantly than they all: yet not I, but the grace of God which was with me.";
asv[11] = "Whether then [it be] I or they, so we preach, and so ye believed.";
asv[12] = "Now if Christ is preached that he hath been raised from the dead, how say some among you that there is no resurrection of the dead?";
asv[13] = "But if there is no resurrection of the dead, neither hath Christ been raised:";
asv[14] = "and if Christ hath not been raised, then is our preaching vain, your faith also is vain.";
asv[15] = "Yea, and we are found false witnesses of God; because we witnessed of God that he raised up Christ: whom he raised not up, if so be that the dead are not raised.";
asv[16] = "For if the dead are not raised, neither hath Christ been raised:";
asv[17] = "and if Christ hath not been raised, your faith is vain; ye are yet in your sins.";
asv[18] = "Then they also that are fallen asleep in Christ have perished.";
asv[19] = "If we have only hoped in Christ in this life, we are of all men most pitiable.";
asv[20] = "But now hath Christ been raised from the dead, the firstfruits of them that are asleep.";
asv[21] = "For since by man [came] death, by man [came] also the resurrection of the dead.";
asv[22] = "For as in Adam all die, so also in Christ shall all be made alive.";
asv[23] = "But each in his own order: Christ the firstfruits; then they that are Christ\'s, at his coming.";
asv[24] = "Then [cometh] the end, when he shall deliver up the kingdom to God, even the Father; when he shall have abolished all rule and all authority and power.";
asv[25] = "For he must reign, till he hath put all his enemies under his feet.";
asv[26] = "The last enemy that shall be abolished is death.";
asv[27] = "For, He put all things in subjection under his feet. But when he saith, All things are put in subjection, it is evident that he is excepted who did subject all things unto him.";
asv[28] = "And when all things have been subjected unto him, then shall the Son also himself be subjected to him that did subject all things unto him, that God may be all in all.";
asv[29] = "Else what shall they do that are baptized for the dead? If the dead are not raised at all, why then are they baptized for them?";
asv[30] = "Why do we also stand in jeopardy every hour?";
asv[31] = "I protest by that glorying in you, brethren, which I have in Christ Jesus our Lord, I die daily.";
asv[32] = "If after the manner of men I fought with beasts at Ephesus, what doth it profit me? If the dead are not raised, let us eat and drink, for to-morrow we die.";
asv[33] = "Be not deceived: Evil companionships corrupt good morals.";
asv[34] = "Awake to soberness righteously, and sin not; for some have no knowledge of God: I speak [this] to move you to shame.";
asv[35] = "But some one will say, How are the dead raised? and with what manner of body do they come?";
asv[36] = "Thou foolish one, that which thou thyself sowest is not quickened except it die:";
asv[37] = "and that which thou sowest, thou sowest not the body that shall be, but a bare grain, it may chance of wheat, or of some other kind;";
asv[38] = "but God giveth it a body even as it pleased him, and to each seed a body of its own.";
asv[39] = "All flesh is not the same flesh: but there is one [flesh] of men, and another flesh of beasts, and another flesh of birds, and another of fishes.";
asv[40] = "There are also celestial bodies, and bodies terrestrial: but the glory of the celestial is one, and the [glory] of the terrestrial is another.";
asv[41] = "There is one glory of the sun, and another glory of the moon, and another glory of the stars; for one star differeth from another star in glory.";
asv[42] = "So also is the resurrection of the dead. It is sown in corruption; it is raised in incorruption:";
asv[43] = "it is sown in dishonor; it is raised in glory: it is sown in weakness; it is raised in power:";
asv[44] = "it is sown a natural body; it is raised a spiritual body. If there is a natural body, there is also a spiritual [body].";
asv[45] = "So also it is written, The first man Adam became a living soul. The last Adam [became] a life-giving spirit.";
asv[46] = "Howbeit that is not first which is spiritual, but that which is natural; then that which is spiritual.";
asv[47] = "The first man is of the earth, earthy: the second man is of heaven.";
asv[48] = "As is the earthy, such are they also that are earthy: and as is the heavenly, such are they also that are heavenly.";
asv[49] = "And as we have borne the image of the earthy, we shall also bear the image of the heavenly.";
asv[50] = "Now this I say, brethren, that flesh and blood cannot inherit the kingdom of God; neither doth corruption inherit incorruption.";
asv[51] = "Behold, I tell you a mystery: We all shall not sleep, but we shall all be changed,";
asv[52] = "in a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible, and we shall be changed.";
asv[53] = "For this corruptible must put on incorruption, and this mortal must put on immortality.";
asv[54] = "But when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall come to pass the saying that is written, Death is swallowed up in victory.";
asv[55] = "O death, where is thy victory? O death, where is thy sting?";
asv[56] = "The sting of death is sin; and the power of sin is the law:";
asv[57] = "but thanks be to God, who giveth us the victory through our Lord Jesus Christ.";
asv[58] = "Wherefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labor is not vain in the Lord.";

hnv[1] = "Now I declare to you, brothers, the Good News which I preached to you, which also you received, in which you also stand,";
hnv[2] = "by which also you are saved, if you hold firmly the word which I preached to you -- unless you believed in vain.";
hnv[3] = "For I delivered to you first of all that which I also received: that Messiah died for our sins according to the Scriptures,";
hnv[4] = "that he was buried, that he was raised on the third day according to the Scriptures,";
hnv[5] = "and that he appeared to Kefa, then to the twelve.";
hnv[6] = "Then he appeared to over five hundred brothers at once, most of whom remain until now, but some have also fallen asleep.";
hnv[7] = "Then he appeared to Ya`akov, then to all the apostles,";
hnv[8] = "and last of all, as to the child born at the wrong time, he appeared to me also.";
hnv[9] = "For I am the least of the apostles, who is not worthy to be called an apostle, because I persecuted the assembly of God.";
hnv[10] = "But by the grace of God I am what I am. His grace which was bestowed on me was not futile, but I worked more than all of them; yet not I, but the grace of God which was with me.";
hnv[11] = "Whether then it is I or they, so we preach, and so you believed.";
hnv[12] = "Now if Messiah is preached, that he has been raised from the dead, how do some among you say that there is no resurrection of the dead?";
hnv[13] = "But if there is no resurrection of the dead, neither has Messiah been raised.";
hnv[14] = "If Messiah has not been raised, then our preaching is in vain, and your faith also is in vain.";
hnv[15] = "Yes, we are found false witnesses of God, because we testified about God that he raised up Messiah, whom he didn\'t raise up, if it is so that the dead are not raised.";
hnv[16] = "For if the dead aren\'t raised, neither has Messiah been raised.";
hnv[17] = "If Messiah has not been raised, your faith is vain; you are still in your sins.";
hnv[18] = "Then they also who are fallen asleep in Messiah have perished.";
hnv[19] = "If we have only hoped in Messiah in this life, we are of all men most pitiable.";
hnv[20] = "But now Messiah has been raised from the dead. He became the first fruits of those who are asleep.";
hnv[21] = "For since death came by man, the resurrection of the dead also came by man.";
hnv[22] = "For as in Adam all die, so also in Messiah all will be made alive.";
hnv[23] = "But each in his own order: Messiah the first fruits, then those who are Messiah\'s, at his coming.";
hnv[24] = "Then the end comes, when he will deliver up the Kingdom to God, even the Father; when he will have abolished all rule and all authority and power.";
hnv[25] = "For he must reign until he has put all his enemies under his feet.";
hnv[26] = "The last enemy that will be abolished is death.";
hnv[27] = "For, &quot;He put all things in subjection under his feet.&quot; But when he says, &quot;All things are put in subjection,&quot; it is evident that he is excepted who subjected all things to him.";
hnv[28] = "When all things have been subjected to him, then the Son will also himself be subjected to him who subjected all things to him, that God may be all in all.";
hnv[29] = "Or else what will they do who are immersed for the dead? If the dead aren\'t raised at all, why then are they immersed for the dead?";
hnv[30] = "Why do we also stand in jeopardy every hour?";
hnv[31] = "I affirm, by the boasting in you which I have in Messiah Yeshua our Lord, I die daily.";
hnv[32] = "If I fought with animals at Ephesus for human purposes, what does it profit me? If the dead are not raised, then &quot;let us eat and drink, for tomorrow we die.&quot;";
hnv[33] = "Don\'t be deceived! &quot;Evil companionships corrupt good morals.&quot;";
hnv[34] = "Wake up righteously, and don\'t sin, for some have no knowledge of God. I say this to your shame.";
hnv[35] = "But someone will say, &quot;How are the dead raised?&quot; and, &quot;With what kind of body do they come?&quot;";
hnv[36] = "You foolish one, that which you yourself sow is not made alive unless it dies.";
hnv[37] = "That which you sow, you don\'t sow the body that will be, but a bare grain, maybe of wheat, or of some other kind.";
hnv[38] = "But God gives it a body even as it pleased him, and to each seed a body of its own.";
hnv[39] = "All flesh is not the same flesh, but there is one flesh of men, another flesh of animals, another of fish, and another of birds.";
hnv[40] = "There are also celestial bodies, and terrestrial bodies; but the glory of the celestial differs from that of the terrestrial.";
hnv[41] = "There is one glory of the sun, another glory of the moon, and another glory of the stars; for one star differs from another star in glory.";
hnv[42] = "So also is the resurrection of the dead. It is sown in corruption; it is raised in incorruption.";
hnv[43] = "It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.";
hnv[44] = "It is sown a natural body; it is raised a spiritual body. There is a natural body and there is also a spiritual body.";
hnv[45] = "So also it is written, &quot;The first man, Adam, became a living soul.&quot; The last Adam became a life-giving spirit.";
hnv[46] = "However that which is spiritual isn\'t first, but that which is natural, then that which is spiritual.";
hnv[47] = "The first man is of the eretz, made of dust. The second man is the Lord from heaven.";
hnv[48] = "As is the one made of dust, such are those who are also made of dust; and as is the heavenly, such are they also that are heavenly.";
hnv[49] = "As we have borne the image of those made of dust, let\'s also bear the image of the heavenly.";
hnv[50] = "Now I say this, brothers, that flesh and blood can\'t inherit the Kingdom of God; neither does corruption inherit incorruption.";
hnv[51] = "Behold, I tell you a mystery. We will not all sleep, but we will all be changed,";
hnv[52] = "in a moment, in the twinkling of an eye, at the last shofar. For the shofar will sound, and the dead will be raised incorruptible, and we will be changed.";
hnv[53] = "For this corruptible must put on incorruption, and this mortal must put on immortality.";
hnv[54] = "But when this corruptible will have put on incorruption, and this mortal will have put on immortality, then what is written will happen: &quot;Death is swallowed up in victory.&quot;";
hnv[55] = "&quot;Death, where is your sting? She\'ol, where is your victory?&quot;";
hnv[56] = "The sting of death is sin, and the power of sin is the law.";
hnv[57] = "But thanks be to God, who gives us the victory through our Lord Yeshua the Messiah.";
hnv[58] = "Therefore, my beloved brothers, be steadfast, immovable, always abounding in the Lord\'s work, because you know that your labor is not in vain in the Lord.";
kjv[1] = "Moreover, brethren, I declare unto you the gospel which I preached unto you, which also ye have received, and wherein ye stand;";
kjv[2] = "By which also ye are saved, if ye keep in memory what I preached unto you, unless ye have believed in vain.";
kjv[3] = "For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;";
kjv[4] = "And that he was buried, and that he rose again the third day according to the scriptures:";
kjv[5] = "And that he was seen of Cephas, then of the twelve:";
kjv[6] = "After that, he was seen of above five hundred brethren at once; of whom the greater part remain unto this present, but some are fallen asleep.";
kjv[7] = "After that, he was seen of James; then of all the apostles.";
kjv[8] = "And last of all he was seen of me also, as of one born out of due time.";
kjv[9] = "For I am the least of the apostles, that am not meet to be called an apostle, because I persecuted the church of God.";
kjv[10] = "But by the grace of God I am what I am: and his grace which [was bestowed] upon me was not in vain; but I laboured more abundantly than they all: yet not I, but the grace of God which was with me.";
kjv[11] = "Therefore whether [it were] I or they, so we preach, and so ye believed.";
kjv[12] = "Now if Christ be preached that he rose from the dead, how say some among you that there is no resurrection of the dead?";
kjv[13] = "But if there be no resurrection of the dead, then is Christ not risen:";
kjv[14] = "And if Christ be not risen, then [is] our preaching vain, and your faith [is] also vain.";
kjv[15] = "Yea, and we are found false witnesses of God; because we have testified of God that he raised up Christ: whom he raised not up, if so be that the dead rise not.";
kjv[16] = "For if the dead rise not, then is not Christ raised:";
kjv[17] = "And if Christ be not raised, your faith [is] vain; ye are yet in your sins.";
kjv[18] = "Then they also which are fallen asleep in Christ are perished.";
kjv[19] = "If in this life only we have hope in Christ, we are of all men most miserable.";
kjv[20] = "But now is Christ risen from the dead, [and] become the firstfruits of them that slept.";
kjv[21] = "For since by man [came] death, by man [came] also the resurrection of the dead.";
kjv[22] = "For as in Adam all die, even so in Christ shall all be made alive.";
kjv[23] = "But every man in his own order: Christ the firstfruits; afterward they that are Christ\'s at his coming.";
kjv[24] = "Then [cometh] the end, when he shall have delivered up the kingdom to God, even the Father; when he shall have put down all rule and all authority and power.";
kjv[25] = "For he must reign, till he hath put all enemies under his feet.";
kjv[26] = "The last enemy [that] shall be destroyed [is] death.";
kjv[27] = "For he hath put all things under his feet. But when he saith all things are put under [him, it is] manifest that he is excepted, which did put all things under him.";
kjv[28] = "And when all things shall be subdued unto him, then shall the Son also himself be subject unto him that put all things under him, that God may be all in all.";
kjv[29] = "Else what shall they do which are baptized for the dead, if the dead rise not at all? why are they then baptized for the dead?";
kjv[30] = "And why stand we in jeopardy every hour?";
kjv[31] = "I protest by your rejoicing which I have in Christ Jesus our Lord, I die daily.";
kjv[32] = "If after the manner of men I have fought with beasts at Ephesus, what advantageth it me, if the dead rise not? let us eat and drink; for to morrow we die.";
kjv[33] = "Be not deceived: evil communications corrupt good manners.";
kjv[34] = "Awake to righteousness, and sin not; for some have not the knowledge of God: I speak [this] to your shame.";
kjv[35] = "But some [man] will say, How are the dead raised up? and with what body do they come?";
kjv[36] = "[Thou] fool, that which thou sowest is not quickened, except it die:";
kjv[37] = "And that which thou sowest, thou sowest not that body that shall be, but bare grain, it may chance of wheat, or of some other [grain]:";
kjv[38] = "But God giveth it a body as it hath pleased him, and to every seed his own body.";
kjv[39] = "All flesh [is] not the same flesh: but [there is] one [kind of] flesh of men, another flesh of beasts, another of fishes, [and] another of birds.";
kjv[40] = "[There are] also celestial bodies, and bodies terrestrial: but the glory of the celestial [is] one, and the [glory] of the terrestrial [is] another.";
kjv[41] = "[There is] one glory of the sun, and another glory of the moon, and another glory of the stars: for [one] star differeth from [another] star in glory.";
kjv[42] = "So also [is] the resurrection of the dead. It is sown in corruption; it is raised in incorruption:";
kjv[43] = "It is sown in dishonour; it is raised in glory: it is sown in weakness; it is raised in power:";
kjv[44] = "It is sown a natural body; it is raised a spiritual body. There is a natural body, and there is a spiritual body.";
kjv[45] = "And so it is written, The first man Adam was made a living soul; the last Adam [was made] a quickening spirit.";
kjv[46] = "Howbeit that [was] not first which is spiritual, but that which is natural; and afterward that which is spiritual.";
kjv[47] = "The first man [is] of the earth, earthy: the second man [is] the Lord from heaven.";
kjv[48] = "As [is] the earthy, such [are] they also that are earthy: and as [is] the heavenly, such [are] they also that are heavenly.";
kjv[49] = "And as we have borne the image of the earthy, we shall also bear the image of the heavenly.";
kjv[50] = "Now this I say, brethren, that flesh and blood cannot inherit the kingdom of God; neither doth corruption inherit incorruption.";
kjv[51] = "Behold, I shew you a mystery; We shall not all sleep, but we shall all be changed,";
kjv[52] = "In a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible, and we shall be changed.";
kjv[53] = "For this corruptible must put on incorruption, and this mortal [must] put on immortality.";
kjv[54] = "So when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall be brought to pass the saying that is written, Death is swallowed up in victory.";
kjv[55] = "O death, where [is] thy sting? O grave, where [is] thy victory?";
kjv[56] = "The sting of death [is] sin; and the strength of sin [is] the law.";
kjv[57] = "But thanks [be] to God, which giveth us the victory through our Lord Jesus Christ.";
kjv[58] = "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.";
rsv[1] = "Now I would remind you, brethren, in what terms I preached to you the gospel, which you received, in which you stand,";
rsv[2] = "by which you are saved, if you hold it fast--unless you believed in vain.";
rsv[3] = "For I delivered to you as of first importance what I also received, that Christ died for our sins in accordance with the scriptures,";
rsv[4] = "that he was buried, that he was raised on the third day in accordance with the scriptures,";
rsv[5] = "and that he appeared to Cephas, then to the twelve.";
rsv[6] = "Then he appeared to more than five hundred brethren at one time, most of whom are still alive, though some have fallen asleep.";
rsv[7] = "Then he appeared to James, then to all the apostles.";
rsv[8] = "Last of all, as to one untimely born, he appeared also to me.";
rsv[9] = "For I am the least of the apostles, unfit to be called an apostle, because I persecuted the church of God.";
rsv[10] = "But by the grace of God I am what I am, and his grace toward me was not in vain. On the contrary, I worked harder than any of them, though it was not I, but the grace of God which is with me.";
rsv[11] = "Whether then it was I or they, so we preach and so you believed.";
rsv[12] = "Now if Christ is preached as raised from the dead, how can some of you say that there is no resurrection of the dead?";
rsv[13] = "But if there is no resurrection of the dead, then Christ has not been raised;";
rsv[14] = "if Christ has not been raised, then our preaching is in vain and your faith is in vain.";
rsv[15] = "We are even found to be misrepresenting God, because we testified of God that he raised Christ, whom he did not raise if it is true that the dead are not raised.";
rsv[16] = "For if the dead are not raised, then Christ has not been raised.";
rsv[17] = "If Christ has not been raised, your faith is futile and you are still in your sins.";
rsv[18] = "Then those also who have fallen asleep in Christ have perished.";
rsv[19] = "If for this life only we have hoped in Christ, we are of all men most to be pitied.";
rsv[20] = "But in fact Christ has been raised from the dead, the first fruits of those who have fallen asleep.";
rsv[21] = "For as by a man came death, by a man has come also the resurrection of the dead.";
rsv[22] = "For as in Adam all die, so also in Christ shall all be made alive.";
rsv[23] = "But each in his own order: Christ the first fruits, then at his coming those who belong to Christ.";
rsv[24] = "Then comes the end, when he delivers the kingdom to God the Father after destroying every rule and every authority and power.";
rsv[25] = "For he must reign until he has put all his enemies under his feet.";
rsv[26] = "The last enemy to be destroyed is death.";
rsv[27] = "&quot;For God has put all things in subjection under his feet.&quot; But when it says, &quot;All things are put in subjection under him,&quot; it is plain that he is excepted who put all things under him.";
rsv[28] = "When all things are subjected to him, then the Son himself will also be subjected to him who put all things under him, that God may be everything to every one.";
rsv[29] = "Otherwise, what do people mean by being baptized on behalf of the dead? If the dead are not raised at all, why are people baptized on their behalf?";
rsv[30] = "Why am I in peril every hour?";
rsv[31] = "I protest, brethren, by my pride in you which I have in Christ Jesus our Lord, I die every day!";
rsv[32] = "What do I gain if, humanly speaking, I fought with beasts at Ephesus? If the dead are not raised, &quot;Let us eat and drink, for tomorrow we die.&quot;";
rsv[33] = "Do not be deceived: &quot;Bad company ruins good morals.&quot;";
rsv[34] = "Come to your right mind, and sin no more. For some have no knowledge of God. I say this to your shame.";
rsv[35] = "But some one will ask, &quot;How are the dead raised? With what kind of body do they come?&quot;";
rsv[36] = "You foolish man! What you sow does not come to life unless it dies.";
rsv[37] = "And what you sow is not the body which is to be, but a bare kernel, perhaps of wheat or of some other grain.";
rsv[38] = "But God gives it a body as he has chosen, and to each kind of seed its own body.";
rsv[39] = "For not all flesh is alike, but there is one kind for men, another for animals, another for birds, and another for fish.";
rsv[40] = "There are celestial bodies and there are terrestrial bodies; but the glory of the celestial is one, and the glory of the terrestrial is another.";
rsv[41] = "There is one glory of the sun, and another glory of the moon, and another glory of the stars; for star differs from star in glory.";
rsv[42] = "So is it with the resurrection of the dead. What is sown is perishable, what is raised is imperishable.";
rsv[43] = "It is sown in dishonor, it is raised in glory. It is sown in weakness, it is raised in power.";
rsv[44] = "It is sown a physical body, it is raised a spiritual body. If there is a physical body, there is also a spiritual body.";
rsv[45] = "Thus it is written, &quot;The first man Adam became a living being&quot;; the last Adam became a life-giving spirit.";
rsv[46] = "But it is not the spiritual which is first but the physical, and then the spiritual.";
rsv[47] = "The first man was from the earth, a man of dust; the second man is from heaven.";
rsv[48] = "As was the man of dust, so are those who are of the dust; and as is the man of heaven, so are those who are of heaven.";
rsv[49] = "Just as we have borne the image of the man of dust, we shall also bear the image of the man of heaven.";
rsv[50] = "I tell you this, brethren: flesh and blood cannot inherit the kingdom of God, nor does the perishable inherit the imperishable.";
rsv[51] = "Lo! I tell you a mystery. We shall not all sleep, but we shall all be changed,";
rsv[52] = "in a moment, in the twinkling of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we shall be changed.";
rsv[53] = "For this perishable nature must put on the imperishable, and this mortal nature must put on immortality.";
rsv[54] = "When the perishable puts on the imperishable, and the mortal puts on immortality, then shall come to pass the saying that is written: &quot;Death is swallowed up in victory.&quot;";
rsv[55] = "&quot;O death, where is thy victory? O death, where is thy sting?&quot;";
rsv[56] = "The sting of death is sin, and the power of sin is the law.";
rsv[57] = "But thanks be to God, who gives us the victory through our Lord Jesus Christ.";
rsv[58] = "Therefore, my beloved brethren, be steadfast, immovable, always abounding in the work of the Lord, knowing that in the Lord your labor is not in vain.";
vul[1] = "notum autem vobis facio fratres evangelium quod praedicavi vobis quod et accepistis in quo et statis";
vul[2] = "per quod et salvamini qua ratione praedicaverim vobis si tenetis nisi si frustra credidistis";
vul[3] = "tradidi enim vobis in primis quod et accepi quoniam Christus mortuus est pro peccatis nostris secundum scripturas";
vul[4] = "et quia sepultus est et quia resurrexit tertia die secundum scripturas";
vul[5] = "et quia visus est Cephae et post haec undecim";
vul[6] = "deinde visus est plus quam quingentis fratribus simul ex quibus multi manent usque adhuc quidam autem dormierunt";
vul[7] = "deinde visus est Iacobo deinde apostolis omnibus";
vul[8] = "novissime autem omnium tamquam abortivo visus est et mihi";
vul[9] = "ego enim sum minimus apostolorum qui non sum dignus vocari apostolus quoniam persecutus sum ecclesiam Dei";
vul[10] = "gratia autem Dei sum id quod sum et gratia eius in me vacua non fuit sed abundantius illis omnibus laboravi non ego autem sed gratia Dei mecum";
vul[11] = "sive enim ego sive illi sic praedicamus et sic credidistis";
vul[12] = "si autem Christus praedicatur quod resurrexit a mortuis quomodo quidam dicunt in vobis quoniam resurrectio mortuorum non est";
vul[13] = "si autem resurrectio mortuorum non est neque Christus resurrexit";
vul[14] = "si autem Christus non resurrexit inanis est ergo praedicatio nostra inanis est et fides vestra";
vul[15] = "invenimur autem et falsi testes Dei quoniam testimonium diximus adversus Deum quod suscitaverit Christum quem non suscitavit si mortui non resurgunt";
vul[16] = "nam si mortui non resurgunt neque Christus resurrexit";
vul[17] = "quod si Christus non resurrexit vana est fides vestra adhuc enim estis in peccatis vestris";
vul[18] = "ergo et qui dormierunt in Christo perierunt";
vul[19] = "si in hac vita tantum in Christo sperantes sumus miserabiliores sumus omnibus hominibus";
vul[20] = "nunc autem Christus resurrexit a mortuis primitiae dormientium";
vul[21] = "quoniam enim per hominem mors et per hominem resurrectio mortuorum";
vul[22] = "et sicut in Adam omnes moriuntur ita et in Christo omnes vivificabuntur";
vul[23] = "unusquisque autem in suo ordine primitiae Christus deinde hii qui sunt Christi in adventu eius";
vul[24] = "deinde finis cum tradiderit regnum Deo et Patri cum evacuaverit omnem principatum et potestatem et virtutem";
vul[25] = "oportet autem illum regnare donec ponat omnes inimicos sub pedibus eius";
vul[26] = "novissima autem inimica destruetur mors omnia enim subiecit sub pedibus eius cum autem dicat";
vul[27] = "omnia subiecta sunt sine dubio praeter eum qui subiecit ei omnia";
vul[28] = "cum autem subiecta fuerint illi omnia tunc ipse Filius subiectus erit illi qui sibi subiecit omnia ut sit Deus omnia in omnibus";
vul[29] = "alioquin quid facient qui baptizantur pro mortuis si omnino mortui non resurgunt ut quid et baptizantur pro illis";
vul[30] = "ut quid et nos periclitamur omni hora";
vul[31] = "cotidie morior per vestram gloriam fratres quam habeo in Christo Iesu Domino nostro";
vul[32] = "si secundum hominem ad bestias pugnavi Ephesi quid mihi prodest si mortui non resurgunt manducemus et bibamus cras enim moriemur";
vul[33] = "nolite seduci corrumpunt mores bonos conloquia mala";
vul[34] = "evigilate iuste et nolite peccare ignorantiam enim Dei quidam habent ad reverentiam vobis loquor";
vul[35] = "sed dicet aliquis quomodo resurgunt mortui quali autem corpore veniunt";
vul[36] = "insipiens tu quod seminas non vivificatur nisi prius moriatur";
vul[37] = "et quod seminas non corpus quod futurum est seminas sed nudum granum ut puta tritici aut alicuius ceterorum";
vul[38] = "Deus autem dat illi corpus sicut voluit et unicuique seminum proprium corpus";
vul[39] = "non omnis caro eadem caro sed alia hominum alia pecorum alia caro volucrum alia autem piscium";
vul[40] = "et corpora caelestia et corpora terrestria sed alia quidem caelestium gloria alia autem terrestrium";
vul[41] = "alia claritas solis alia claritas lunae et alia claritas stellarum stella enim ab stella differt in claritate";
vul[42] = "sic et resurrectio mortuorum seminatur in corruptione surgit in incorruptione";
vul[43] = "seminatur in ignobilitate surgit in gloria seminatur in infirmitate surgit in virtute";
vul[44] = "seminatur corpus animale surgit corpus spiritale si est corpus animale est et spiritale sic et scriptum est";
vul[45] = "factus est primus homo Adam in animam viventem novissimus Adam in spiritum vivificantem";
vul[46] = "sed non prius quod spiritale est sed quod animale est deinde quod spiritale";
vul[47] = "primus homo de terra terrenus secundus homo de caelo caelestis";
vul[48] = "qualis terrenus tales et terreni et qualis caelestis tales et caelestes";
vul[49] = "igitur sicut portavimus imaginem terreni portemus et imaginem caelestis";
vul[50] = "hoc autem dico fratres quoniam caro et sanguis regnum Dei possidere non possunt neque corruptio incorruptelam possidebit";
vul[51] = "ecce mysterium vobis dico omnes quidem resurgemus sed non omnes inmutabimur";
vul[52] = "in momento in ictu oculi in novissima tuba canet enim et mortui resurgent incorrupti et nos inmutabimur";
vul[53] = "oportet enim corruptibile hoc induere incorruptelam et mortale hoc induere inmortalitatem";
vul[54] = "cum autem mortale hoc induerit inmortalitatem tunc fiet sermo qui scriptus est absorta est mors in victoria";
vul[55] = "ubi est mors victoria tua ubi est mors stimulus tuus";
vul[56] = "stimulus autem mortis peccatum est virtus vero peccati lex";
vul[57] = "Deo autem gratias qui dedit nobis victoriam per Dominum nostrum Iesum Christum";
vul[58] = "itaque fratres mei dilecti stabiles estote et inmobiles abundantes in opere Domini semper scientes quod labor vester non est inanis in Domino";
web[1] = "Moreover, brethren, I declare to you the gospel which I preached to you, which also ye have received, and in which ye stand;";
web[2] = "By which also ye are saved, if ye keep in memory what I preached to you, unless ye have believed in vain.";
web[3] = "For I delivered to you first of all, that which I also received, that Christ died for our sins, according to the scriptures;";
web[4] = "And that he was buried, and that he rose again the third day according to the scriptures:";
web[5] = "And that he was seen by Cephas, then by the twelve:";
web[6] = "After that he was seen by above five hundred brethren at once; of whom the greater part remain to this present, but some have fallen asleep.";
web[7] = "After that he was seen by James; then by all the apostles.";
web[8] = "And last of all he was seen by me also, as by one born out of due time.";
web[9] = "For I am the least of the apostles, who am not worthy to be called an apostle, because I persecuted the church of God.";
web[10] = "But by the grace of God I am what I am: and his grace which [was bestowed] upon me, was not in vain; but I labored more abundantly than they all: yet not I, but the grace of God which was with me.";
web[11] = "Therefore whether [it was] I or they, so we preach, and so ye believed.";
web[12] = "Now if Christ is preached that he rose from the dead, how say some among you that there is no resurrection of the dead?";
web[13] = "But if there is no resurrection of the dead, then is Christ not raised.";
web[14] = "And if Christ is not raised, then [is] our preaching vain, and your faith [is] also vain.";
web[15] = "And indeed we are found false witnesses of God; because we have testified concerning God that he raised up Christ: whom he raised not, if in truth the dead rise not.";
web[16] = "For if the dead rise not, then is not Christ raised:";
web[17] = "And if Christ is not raised, your faith [is] vain; ye are yet in your sins.";
web[18] = "Then they also who have fallen asleep in Christ have perished.";
web[19] = "If in this life only we have hope in Christ, we are of all men most miserable.";
web[20] = "But now is Christ raised from the dead, [and] become the first-fruits of them that slept.";
web[21] = "For since by man [came] death, by man [came] also the resurrection of the dead.";
web[22] = "For as in Adam all die, even so in Christ shall all be made alive.";
web[23] = "But every man in his own order: Christ the first-fruits; afterward they that are Christ\'s at his coming.";
web[24] = "Then [cometh] the end, when he shall have delivered up the kingdom to God, even the Father; when he shall have put down all rule, and all authority, and power.";
web[25] = "For he must reign, till he hath put all enemies under his feet.";

web[28] = "And when all things shall be subdued to him, then shall the Son also himself be subject to him that put all things under him, that God may be all in all.";
web[29] = "Else what will they do, who are baptized for the dead, if the dead rise not at all? why are they then baptized for the dead?";

web[47] = "The first man [is] from the earth, earthy: the second man [is] the Lord from heaven.";

web[54] = "So when this corruptible shall have put on incorruption, and this mortal shall have put on immortality, then shall be brought to pass the saying that is written, Death is swallowed up in victory.";
web[55] = "O death, where [is] thy sting? O grave, where [is] thy victory?";
web[56] = "The sting of death [is] sin; and the strength of sin [is] the law.";
web[57] = "But thanks [be] to God, who giveth us the victory, through our Lord Jesus Christ.";
web[58] = "Therefore, my beloved brethren, be ye steadfast, immovable, always abounding in the work of the Lord, forasmuch as ye know that your labor is not in vain in the Lord.";
yng[1] = "And I make known to you, brethren, the good news that I proclaimed to you, which also ye did receive, in which also ye have stood,";
yng[2] = "through which also ye are being saved, in what words I proclaimed good news to you, if ye hold fast, except ye did believe in vain,";
yng[3] = "for I delivered to you first, what also I did receive, that Christ died for our sins, according to the Writings,";
yng[4] = "and that he was buried, and that he hath risen on the third day, according to the Writings,";
yng[5] = "and that he appeared to Cephas, then to the twelve,";
yng[6] = "afterwards he appeared to above five hundred brethren at once, of whom the greater part remain till now, and certain also did fall asleep;";
yng[7] = "afterwards he appeared to James, then to all the apostles.";
yng[8] = "And last of all -- as to the untimely birth -- he appeared also to me,";
yng[9] = "for I am the least of the apostles, who am not worthy to be called an apostle, because I did persecute the assembly of God,";
yng[10] = "and by the grace of God I am what I am, and His grace that [is] towards me came not in vain, but more abundantly than they all did I labour, yet not I, but the grace of God that [is] with me;";
yng[11] = "whether, then, I or they, so we preach, and so ye did believe.";
yng[12] = "And if Christ is preached, that out of the dead he hath risen, how say certain among you, that there is no rising again of dead persons?";
yng[13] = "and if there be no rising again of dead persons, neither hath Christ risen;";
yng[14] = "and if Christ hath not risen, then void [is] our preaching, and void also your faith,";
yng[15] = "and we also are found false witnesses of God, because we did testify of God that He raised up the Christ, whom He did not raise if then dead persons do not rise;";
yng[16] = "for if dead persons do not rise, neither hath Christ risen,";
yng[17] = "and if Christ hath not risen, vain is your faith, ye are yet in your sins;";
yng[18] = "then, also, those having fallen asleep in Christ did perish;";
yng[19] = "if in this life we have hope in Christ only, of all men we are most to be pitied.";
yng[20] = "And now, Christ hath risen out of the dead -- the first-fruits of those sleeping he became,";
yng[21] = "for since through man [is] the death, also through man [is] a rising again of the dead,";
yng[22] = "for even as in Adam all die, so also in the Christ all shall be made alive,";
yng[23] = "and each in his proper order, a first-fruit Christ, afterwards those who are the Christ\'s, in his presence,";
yng[24] = "then -- the end, when he may deliver up the reign to God, even the Father, when he may have made useless all rule, and all authority and power --";
yng[25] = "for it behoveth him to reign till he may have put all the enemies under his feet --";
yng[26] = "the last enemy is done away -- death;";
yng[27] = "for all things He did put under his feet, and, when one may say that all things have been subjected, [it is] evident that He is excepted who did subject the all things to him,";
yng[28] = "and when the all things may be subjected to him, then the Son also himself shall be subject to Him, who did subject to him the all things, that God may be the all in all.";
yng[29] = "Seeing what shall they do who are baptized for the dead, if the dead do not rise at all? why also are they baptized for the dead?";
yng[30] = "why also do we stand in peril every hour?";
yng[31] = "Every day do I die, by the glorying of you that I have in Christ Jesus our Lord:";
yng[32] = "if after the manner of a man with wild beasts I fought in Ephesus, what the advantage to me if the dead do not rise? let us eat and drink, for to-morrow we die!";
yng[33] = "Be not led astray; evil communications corrupt good manners;";
yng[34] = "awake up, as is right, and sin not; for certain have an ignorance of God; for shame to you I say [it].";
yng[35] = "But some one will say, `How do the dead rise?";
yng[36] = "unwise! thou -- what thou dost sow is not quickened except it may die;";
yng[37] = "and that which thou dost sow, not the body that shall be dost thou sow, but bare grain, it may be of wheat, or of some one of the others,";
yng[38] = "and God doth give to it a body according as He willed, and to each of the seeds its proper body.";
yng[39] = "All flesh [is] not the same flesh, but there is one flesh of men, and another flesh of beasts, and another of fishes, and another of birds;";
yng[40] = "and [there are] heavenly bodies, and earthly bodies; but one [is] the glory of the heavenly, and another that of the earthly;";
yng[41] = "one glory of sun, and another glory of moon, and another glory of stars, for star from star doth differ in glory.";
yng[42] = "So also [is] the rising again of the dead: it is sown in corruption, it is raised in incorruption;";
yng[43] = "it is sown in dishonour, it is raised in glory; it is sown in weakness, it is raised in power;";
yng[44] = "it is sown a natural body, it is raised a spiritual body; there is a natural body, and there is a spiritual body;";
yng[45] = "so also it hath been written, `The first man Adam became a living creature,\' the last Adam [is] for a life-giving spirit,";
yng[46] = "but that which is spiritual [is] not first, but that which [was] natural, afterwards that which [is] spiritual.";
yng[47] = "The first man [is] out of the earth, earthy; the second man [is] the Lord out of heaven;";
yng[48] = "as [is] the earthy, such [are] also the earthy; and as [is] the heavenly, such [are] also the heavenly;";
yng[49] = "and, according as we did bear the image of the earthy, we shall bear also the image of the heavenly.";
yng[50] = "And this I say, brethren, that flesh and blood the reign of God is not able to inherit, nor doth the corruption inherit the incorruption;";
yng[51] = "lo, I tell you a secret; we indeed shall not all sleep, and we all shall be changed;";
yng[52] = "in a moment, in the twinkling of an eye, in the last trumpet, for it shall sound, and the dead shall be raised incorruptible, and we -- we shall be changed:";
yng[53] = "for it behoveth this corruptible to put on incorruption, and this mortal to put on immortality;";
yng[54] = "and when this corruptible may have put on incorruption, and this mortal may have put on immortality, then shall be brought to pass the word that hath been written, `The Death was swallowed up -- to victory;";
yng[55] = "where, O Death, thy sting? where, O Hades, thy victory?\'";
yng[56] = "and the sting of the death [is] the sin, and the power of the sin the law;";
yng[57] = "and to God -- thanks, to Him who is giving us the victory through our Lord Jesus Christ;";
yng[58] = "so that, my brethren beloved, become ye stedfast, unmovable, abounding in the work of the Lord at all times, knowing that your labour is not vain in the Lord.";
</script>
