csb[1] = "Now in response to the matters you wrote about: &quot;It is good for a man not to use a woman for sex.&quot;";
csb[2] = "But because sexual immorality is so common, each man should have sexual relations with his own wife, and each woman should have sexual relations with her own husband.";
csb[3] = "A husband should fulfill his marital duty to his wife, and likewise a wife to her husband.";
csb[4] = "A wife does not have the right over her own body, but her husband does. In the same way, a husband does not have the right over his own body, but his wife does.";
csb[5] = "Do not deprive one another -- except when you agree for a time, to devote yourselves to prayer. Then come together again; otherwise, Satan may tempt you because of your lack of self-control.";
csb[6] = "I say this as a concession, not as a command.";
csb[7] = "I wish that all people were as I am. But each has his own gift from God, one person has this gift, another has that.";
csb[8] = "I say to the unmarried and to widows: It is good for them if they remain as I am.";
csb[9] = "But if they do not have self-control, they should marry, since it is better to marry than to burn with desire.";
csb[10] = "To the married I give this command -- not I, but the Lord -- a wife is not to leave her husband.";
csb[11] = "But if she does leave, she must remain unmarried or be reconciled to her husband -- and a husband is not to divorce his wife.";
csb[12] = "But I (not the Lord) say to the rest: If any brother has an unbelieving wife and she is willing to live with him, he must not divorce her.";
csb[13] = "Also, if any woman has an unbelieving husband and he is willing to live with her, she must not divorce her husband.";
csb[14] = "For the unbelieving husband is made holy by the wife, and the unbelieving wife is made holy by the husband. Otherwise your children would be unclean, but as it is they are holy.";
csb[15] = "But if the unbeliever leaves, let him leave. A brother or a sister is not bound in such cases. God has called you to live in peace.";
csb[16] = "Wife, for all you know, you might save your husband. Husband, for all you know, you might save your wife.";
csb[17] = "Let each one live his life in the situation the Lord assigned when God called him. This is what I command in all the churches.";
csb[18] = "Was anyone already circumcised when he was called? He should not undo his circumcision. Was anyone called while uncircumcised? He should not get circumcised.";
csb[19] = "Circumcision does not matter and uncircumcision does not matter. Keeping God\'s commands is what matters.";
csb[20] = "Let each of you remain in the situation in which he was called.";
csb[21] = "Were you called while a slave? Don\'t let it concern you. But if you can become free, by all means take the opportunity.";
csb[22] = "For he who is called by the Lord as a slave is the Lord\'s freedman. Likewise he who is called as a free man is Christ\'s slave.";
csb[23] = "You were bought at a price; do not become slaves of people.";
csb[24] = "Brothers and sisters, each person is to remain with God in the situation in which he was called.";
csb[25] = "Now about virgins: I have no command from the Lord, but I do give an opinion as one who by the Lord\'s mercy is faithful.";
csb[26] = "Because of the present distress, I think that it is good for a man to remain as he is.";
csb[27] = "Are you bound to a wife? Do not seek to be released. Are you released from a wife? Do not seek a wife.";
csb[28] = "However, if you do get married, you have not sinned, and if a virgin marries, she has not sinned. But such people will have trouble in this life, and I am trying to spare you.";
csb[29] = "This is what I mean, brothers and sisters: The time is limited, so from now on those who have wives should be as though they had none,";
csb[30] = "those who weep as though they did not weep, those who rejoice as though they did not rejoice, those who buy as though they didn\'t own anything,";
csb[31] = "and those who use the world as though they did not make full use of it. For this world in its current form is passing away.";
csb[32] = "I want you to be without concerns. The unmarried man is concerned about the things of the Lord -- how he may please the Lord.";
csb[33] = "But the married man is concerned about the things of the world -- how he may please his wife --";
csb[34] = "and his interests are divided. The unmarried woman or virgin is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world -- how she may please her husband.";
csb[35] = "I am saying this for your own benefit, not to put a restraint on you, but to promote what is proper and so that you may be devoted to the Lord without distraction.";
csb[36] = "If any man thinks he is acting improperly toward the virgin he is engaged to, if she is getting beyond the usual age for marriage, and he feels he should marry -- he can do what he wants. He is not sinning; they can get married.";
csb[37] = "But he who stands firm in his heart (who is under no compulsion, but has control over his own will) and has decided in his heart to keep her as his fianc&#233;, will do well.";
csb[38] = "So then he who marries his fianc&#233; does well, but he who does not marry will do better.";
csb[39] = "A wife is bound as long as her husband is living. But if her husband dies, she is free to be married to anyone she wants -- only in the Lord.";
csb[40] = "But she is happier if she remains as she is, in my opinion. And I think that I also have the Spirit of God.";
kjv[1] = "Now concerning the things whereof ye wrote unto me: [It is] good for a man not to touch a woman.";
kjv[2] = "Nevertheless, [to avoid] fornication, let every man have his own wife, and let every woman have her own husband.";
kjv[3] = "Let the husband render unto the wife due benevolence: and likewise also the wife unto the husband.";
kjv[4] = "The wife hath not power of her own body, but the husband: and likewise also the husband hath not power of his own body, but the wife.";
kjv[5] = "Defraud ye not one the other, except [it be] with consent for a time, that ye may give yourselves to fasting and prayer; and come together again, that Satan tempt you not for your incontinency.";
kjv[6] = "But I speak this by permission, [and] not of commandment.";
kjv[7] = "For I would that all men were even as I myself. But every man hath his proper gift of God, one after this manner, and another after that.";
kjv[8] = "I say therefore to the unmarried and widows, It is good for them if they abide even as I.";
kjv[9] = "But if they cannot contain, let them marry: for it is better to marry than to burn.";
kjv[10] = "And unto the married I command, [yet] not I, but the Lord, Let not the wife depart from [her] husband:";
kjv[11] = "But and if she depart, let her remain unmarried, or be reconciled to [her] husband: and let not the husband put away [his] wife.";
kjv[12] = "But to the rest speak I, not the Lord: If any brother hath a wife that believeth not, and she be pleased to dwell with him, let him not put her away.";
kjv[13] = "And the woman which hath an husband that believeth not, and if he be pleased to dwell with her, let her not leave him.";
kjv[14] = "For the unbelieving husband is sanctified by the wife, and the unbelieving wife is sanctified by the husband: else were your children unclean; but now are they holy.";
kjv[15] = "But if the unbelieving depart, let him depart. A brother or a sister is not under bondage in such [cases]: but God hath called us to peace.";
kjv[16] = "For what knowest thou, O wife, whether thou shalt save [thy] husband? or how knowest thou, O man, whether thou shalt save [thy] wife?";
kjv[17] = "But as God hath distributed to every man, as the Lord hath called every one, so let him walk. And so ordain I in all churches.";
kjv[18] = "Is any man called being circumcised? let him not become uncircumcised. Is any called in uncircumcision? let him not be circumcised.";
kjv[19] = "Circumcision is nothing, and uncircumcision is nothing, but the keeping of the commandments of God.";
kjv[20] = "Let every man abide in the same calling wherein he was called.";
kjv[21] = "Art thou called [being] a servant? care not for it: but if thou mayest be made free, use [it] rather.";
kjv[22] = "For he that is called in the Lord, [being] a servant, is the Lord\'s freeman: likewise also he that is called, [being] free, is Christ\'s servant.";
kjv[23] = "Ye are bought with a price; be not ye the servants of men.";
kjv[24] = "Brethren, let every man, wherein he is called, therein abide with God.";
kjv[25] = "Now concerning virgins I have no commandment of the Lord: yet I give my judgment, as one that hath obtained mercy of the Lord to be faithful.";
kjv[26] = "I suppose therefore that this is good for the present distress, [I say], that [it is] good for a man so to be.";
kjv[27] = "Art thou bound unto a wife? seek not to be loosed. Art thou loosed from a wife? seek not a wife.";
kjv[28] = "But and if thou marry, thou hast not sinned; and if a virgin marry, she hath not sinned. Nevertheless such shall have trouble in the flesh: but I spare you.";
kjv[29] = "But this I say, brethren, the time [is] short: it remaineth, that both they that have wives be as though they had none;";
kjv[30] = "And they that weep, as though they wept not; and they that rejoice, as though they rejoiced not; and they that buy, as though they possessed not;";
kjv[31] = "And they that use this world, as not abusing [it]: for the fashion of this world passeth away.";
kjv[32] = "But I would have you without carefulness. He that is unmarried careth for the things that belong to the Lord, how he may please the Lord:";
kjv[33] = "But he that is married careth for the things that are of the world, how he may please [his] wife.";
kjv[34] = "There is difference [also] between a wife and a virgin. The unmarried woman careth for the things of the Lord, that she may be holy both in body and in spirit: but she that is married careth for the things of the world, how she may please [her] husband.";
kjv[35] = "And this I speak for your own profit; not that I may cast a snare upon you, but for that which is comely, and that ye may attend upon the Lord without distraction.";
kjv[36] = "But if any man think that he behaveth himself uncomely toward his virgin, if she pass the flower of [her] age, and need so require, let him do what he will, he sinneth not: let them marry.";
kjv[37] = "Nevertheless he that standeth stedfast in his heart, having no necessity, but hath power over his own will, and hath so decreed in his heart that he will keep his virgin, doeth well.";
kjv[38] = "So then he that giveth [her] in marriage doeth well; but he that giveth [her] not in marriage doeth better.";
kjv[39] = "The wife is bound by the law as long as her husband liveth; but if her husband be dead, she is at liberty to be married to whom she will; only in the Lord.";
kjv[40] = "But she is happier if she so abide, after my judgment: and I think also that I have the Spirit of God.";

asv[17] = "Only, as the Lord hath distributed to each man, as God hath called each, so let him walk. And so ordain I in all the churches.";

asv[18] = "Was any man called being circumcised? let him not become uncircumcised. Hath any been called in uncircumcision? let him not be circumcised.";
yng[18] = "being circumcised -- was any one called? let him not become uncircumcised; in uncircumcision was any one called? let him not be circumcised;";
dby[18] = "Has any one been called circumcised? let him not become uncircumcised: has any one been called in uncircumcision? let him not be circumcised.";
web[18] = "Is any man called being circumcised? let him not become uncircumcised. Is any called in uncircumcision? let him not become circumcised.";
hnv[18] = "Was anyone called having been circumcised? Let him not become uncircumcised. Has anyone been called in uncircumcision? Let him not be circumcised.";
vul[18] = "circumcisus aliquis vocatus est non adducat praeputium in praeputio aliquis vocatus est non circumcidatur";
rsv[19] = "For neither circumcision counts for anything nor uncircumcision, but keeping the commandments of God.";
asv[19] = "Circumcision is nothing, and uncircumcision is nothing; but the keeping of the commandments of God.";
yng[19] = "the circumcision is nothing, and the uncircumcision is nothing -- but a keeping of the commands of God.";
dby[19] = "Circumcision is nothing, and uncircumcision is nothing; but keeping God\'s commandments.";
web[19] = "Circumcision is nothing, and uncircumcision is nothing, but the keeping of the commandments of God.";
hnv[19] = "Circumcision is nothing, and uncircumcision is nothing, but the keeping of the mitzvot of God.";
vul[19] = "circumcisio nihil est et praeputium nihil est sed observatio mandatorum Dei";
rsv[20] = "Every one should remain in the state in which he was called.";
asv[20] = "Let each man abide in that calling wherein he was called.";
yng[20] = "Each in the calling in which he was called -- in this let him remain;";
dby[20] = "Let each abide in that calling in which he has been called.";
web[20] = "Let every man continue in the same calling in which he was called.";
hnv[20] = "Let each man stay in that calling in which he was called.";
vul[20] = "unusquisque in qua vocatione vocatus est in ea permaneat";
rsv[21] = "Were you a slave when called? Never mind. But if you can gain your freedom, avail yourself of the opportunity.";
asv[21] = "Wast thou called being a bondservant? care not for it: nay, even if thou canst become free, use [it] rather.";
yng[21] = "a servant -- wast thou called? be not anxious; but if also thou art able to become free -- use [it] rather;";
dby[21] = "Hast thou been called [being] a bondman, let it not concern thee; but and if thou canst become free, use [it] rather.";
web[21] = "Art thou called [being] a servant? care not for it; but if thou mayest be made free, use [it] rather.";
hnv[21] = "Were you called being a bondservant? Don\'t let that bother you, but if you get an opportunity to become free, use it.";
vul[21] = "servus vocatus es non sit tibi curae sed et si potes liber fieri magis utere";
rsv[22] = "For he who was called in the Lord as a slave is a freedman of the Lord. Likewise he who was free when called is a slave of Christ.";
asv[22] = "For he that was called in the Lord being a bondservant, is the Lord\'s freedman: likewise he that was called being free, is Christ\'s bondservant.";
yng[22] = "for he who [is] in the Lord -- having been called a servant -- is the Lord\'s freedman: in like manner also he the freeman, having been called, is servant of Christ:";
dby[22] = "For the bondman that is called in [the] Lord is the Lord\'s freedman; in like manner [also] the freeman being called is Christ\'s bondman.";
web[22] = "For he that is called in the Lord, [being] a servant, is the Lord\'s free-man: likewise also he that is called, [being] free, is Christ\'s servant.";
hnv[22] = "For he who was called in the Lord being a bondservant is the Lord\'s free man. Likewise he who was called being free is Messiah\'s bondservant.";
vul[22] = "qui enim in Domino vocatus est servus libertus est Domini similiter qui liber vocatus est servus est Christi";
rsv[23] = "You were bought with a price; do not become slaves of men.";
asv[23] = "Ye were bought with a price; become not bondservants of men.";
yng[23] = "with a price ye were bought, become not servants of men;";
dby[23] = "Ye have been bought with a price; do not be the bondmen of men.";
web[23] = "Ye are bought with a price; be not ye the servants of men.";
hnv[23] = "You were bought with a price. Don\'t become bondservants of men.";
vul[23] = "pretio empti estis nolite fieri servi hominum";
rsv[24] = "So, brethren, in whatever state each was called, there let him remain with God.";
asv[24] = "Brethren, let each man, wherein he was called, therein abide with God.";
yng[24] = "each, in that in which he was called, brethren, in this let him remain with God.";
dby[24] = "Let each, wherein he is called, brethren, therein abide with God.";
web[24] = "Brethren, let every man in the state in which he is called, continue in it with God.";
hnv[24] = "Brothers, let each man, in whatever condition he was called, stay in that condition with God.";
vul[24] = "unusquisque in quo vocatus est fratres in hoc maneat apud Deum";
rsv[25] = "Now concerning the unmarried, I have no command of the Lord, but I give my opinion as one who by the Lord\'s mercy is trustworthy.";
asv[25] = "Now concerning virgins I have no commandment of the Lord: but I give my judgment, as one that hath obtained mercy of the Lord to be trustworthy.";
yng[25] = "And concerning the virgins, a command of the Lord I have not; and I give judgment as having obtained kindness from the Lord to be faithful:";
dby[25] = "But concerning virgins, I have no commandment of [the] Lord; but I give my opinion, as having received mercy of [the] Lord to be faithful.";
web[25] = "Now concerning virgins, I have no commandment of the Lord: yet I give my judgment as one that hath obtained mercy from the Lord to be faithful.";
hnv[25] = "Now concerning virgins, I have no mitzvah from the Lord, but I give my judgment as one who has obtained mercy from the Lord to be trustworthy.";
vul[25] = "de virginibus autem praeceptum Domini non habeo consilium autem do tamquam misericordiam consecutus a Domino ut sim fidelis";
rsv[26] = "I think that in view of the present distress it is well for a person to remain as he is.";
asv[26] = "I think therefore that this is good by reason of the distress that is upon us, [namely,] that it is good for a man to be as he is.";
yng[26] = "I suppose, therefore, this to be good because of the present necessity, that [it is] good for a man that the matter be thus: --";
dby[26] = "I think then that this is good, on account of the present necessity, that [it is] good for a man to remain so as he is.";
web[26] = "I suppose therefore that this is good for the present distress, [I say], that [it is] good for a man so to be.";
hnv[26] = "I think that it is good therefore, because of the distress that is on us, that it is good for a man to be as he is.";
vul[26] = "existimo ergo hoc bonum esse propter instantem necessitatem quoniam bonum est homini sic esse";
rsv[27] = "Are you bound to a wife? Do not seek to be free. Are you free from a wife? Do not seek marriage.";
asv[27] = "Art thou bound unto a wife? seek not to be loosed. Art thou loosed from a wife? seek not a wife.";
yng[27] = "Hast thou been bound to a wife? seek not to be loosed; hast thou been loosed from a wife? seek not a wife.";
dby[27] = "Art thou bound to a wife? seek not to be loosed; art thou free from a wife? do not seek a wife.";
web[27] = "Art thou bound to a wife? seek not to be loosed. Art thou loosed from a wife? seek not a wife.";
hnv[27] = "Are you bound to a wife? Don\'t seek to be freed. Are you free from a wife? Don\'t seek a wife.";
vul[27] = "alligatus es uxori noli quaerere solutionem solutus es ab uxore noli quaerere uxorem";
rsv[28] = "But if you marry, you do not sin, and if a girl marries she does not sin. Yet those who marry will have worldly troubles, and I would spare you that.";
asv[28] = "But shouldest thou marry, thou hast not sinned; and if a virgin marry, she hath not sinned. Yet such shall have tribulation in the flesh: and I would spare you.";
yng[28] = "But and if thou mayest marry, thou didst not sin; and if the virgin may marry, she did not sin; and such shall have tribulation in the flesh: and I spare you.";
dby[28] = "But if thou shouldest also marry, thou hast not sinned; and if the virgin marry, they have not sinned: but such shall have tribulation in the flesh; but I spare you.";
web[28] = "But if thou marry, thou hast not sinned: and if a virgin marry, she hath not sinned. Nevertheless, such will have trouble in the flesh; but I spare you.";
hnv[28] = "But if you marry, you have not sinned. If a virgin marries, she has not sinned. Yet such will have oppression in the flesh, and I want to spare you.";
vul[28] = "si autem acceperis uxorem non peccasti et si nupserit virgo non peccavit tribulationem tamen carnis habebunt huiusmodi ego autem vobis parco";
rsv[29] = "I mean, brethren, the appointed time has grown very short; from now on, let those who have wives live as though they had none,";
asv[29] = "But this I say, brethren, the time is shortened, that henceforth both those that have wives may be as though they had none;";
yng[29] = "And this I say, brethren, the time henceforth is having been shortened -- that both those having wives may be as not having;";
dby[29] = "But this I say, brethren, the time is straitened. For the rest, that they who have wives, be as not having [any]:";
web[29] = "But this I say, brethren, The time [is] short. It remaineth, that both they that have wives, be as though they had none;";
hnv[29] = "But I say this, brothers: the time is short, that from now on, both those who have wives may be as though they had none;";
vul[29] = "hoc itaque dico fratres tempus breve est reliquum est ut qui habent uxores tamquam non habentes sint";
rsv[30] = "and those who mourn as though they were not mourning, and those who rejoice as though they were not rejoicing, and those who buy as though they had no goods,";
asv[30] = "and those that weep, as though they wept not; and those that rejoice, as though they rejoiced not; and those that buy, as though they possessed not;";
yng[30] = "and those weeping, as not weeping; and those rejoicing, as not rejoicing; and those buying, as not possessing;";
dby[30] = "and they that weep, as not weeping; and they that rejoice, as not rejoicing; and they that buy, as not possessing;";
web[30] = "And they that weep, as though they wept not; and they that rejoice, as though they rejoiced not; and they that buy, as though they possessed not;";
hnv[30] = "and those who weep, as though they didn\'t weep; and those who rejoice, as though they didn\'t rejoice; and those who buy, as though they didn\'t possess;";
vul[30] = "et qui flent tamquam non flentes et qui gaudent tamquam non gaudentes et qui emunt tamquam non possidentes";
rsv[31] = "and those who deal with the world as though they had no dealings with it. For the form of this world is passing away.";
asv[31] = "and those that use the world, as not using it to the full: for the fashion of this world passeth away.";
yng[31] = "and those using this world, as not using [it] up; for passing away is the fashion of this world.";
dby[31] = "and they that use the world, as not disposing of it as their own; for the fashion of this world passes.";
web[31] = "And they that use this world, as not abusing [it]. For the fashion of this world passeth away.";
hnv[31] = "and those who use the world, as not using it to the fullest. For the mode of this world passes away.";
vul[31] = "et qui utuntur hoc mundo tamquam non utantur praeterit enim figura huius mundi";
rsv[32] = "I want you to be free from anxieties. The unmarried man is anxious about the affairs of the Lord, how to please the Lord;";
asv[32] = "But I would have you to be free from cares. He that is unmarried is careful for the things of the Lord, how he may please the Lord:";
yng[32] = "And I wish you to be without anxiety; the unmarried is anxious for the things of the Lord, how he shall please the Lord;";
dby[32] = "But I wish you to be without care. The unmarried cares for the things of the Lord, how he shall please the Lord;";
web[32] = "But I would have you without anxious care. He that is unmarried, is anxious for the things that belong to the Lord, how he may please the Lord:";
hnv[32] = "But I desire to have you to be free from cares. He who is unmarried is concerned for the things of the Lord, how he may please the Lord;";
vul[32] = "volo autem vos sine sollicitudine esse qui sine uxore est sollicitus est quae Domini sunt quomodo placeat Deo";
rsv[33] = "but the married man is anxious about worldly affairs, how to please his wife,";
asv[33] = "but he that is married is careful for the things of the world, how he may please his wife,";
yng[33] = "and the married is anxious for the things of the world, how he shall please the wife.";
dby[33] = "but he that has married cares for the things of the world, how he shall please his wife.";
web[33] = "But he that is married, is anxious for the things that are of the world, how he may please [his] wife.";
hnv[33] = "but he who is married is concerned about the things of the world, how he may please his wife.";
vul[33] = "qui autem cum uxore est sollicitus est quae sunt mundi quomodo placeat uxori et divisus est";
rsv[34] = "and his interests are divided. And the unmarried woman or girl is anxious about the affairs of the Lord, how to be holy in body and spirit; but the married woman is anxious about worldly affairs, how to please her husband.";
asv[34] = "and is divided. [So] also the woman that is unmarried and the virgin is careful for the things of the Lord, that she may be holy both in body and in spirit: but she that is married is careful for the things of the world, how she may please her husband.";
yng[34] = "The wife and the virgin have been distinguished: the unmarried is anxious for the things of the Lord, that she may be holy both in body and in spirit, and the married is anxious for the things of the world, how she shall please the husband.";
dby[34] = "There is a difference between the wife and the virgin. The unmarried cares for the things of the Lord, that she may be holy both in body and spirit; but she that has married cares for the things of the world, how she shall please her husband.";
web[34] = "There is a difference [also] between a wife and a virgin. The unmarried woman is anxious for the things of the Lord, that she may be holy, both in body and in spirit: but she that is married, is anxious for the things of the world, how she may please [her] husband.";
hnv[34] = "There is also a difference between a wife and a virgin. The unmarried woman cares about the things of the Lord, that she may be holy both in body and in spirit. But she who is married cares about the things of the world -- how she may please her husband.";
vul[34] = "et mulier innupta et virgo cogitat quae Domini sunt ut sit sancta et corpore et spiritu quae autem nupta est cogitat quae sunt mundi quomodo placeat viro";
rsv[35] = "I say this for your own benefit, not to lay any restraint upon you, but to promote good order and to secure your undivided devotion to the Lord.";
asv[35] = "And this I say for your own profit; not that I may cast a snare upon you, but for that which is seemly, and that ye may attend upon the Lord without distraction.";
yng[35] = "And this for your own profit I say: not that I may cast a noose upon you, but for the seemliness and devotedness to the Lord, undistractedly,";
dby[35] = "But I say this for your own profit; not that I may set a snare before you, but for what [is] seemly, and waiting on the Lord without distraction.";
web[35] = "And this I speak for your own profit; not that I may cast a snare upon you, but for that which is comely, and that ye may attend upon the Lord without distraction.";
hnv[35] = "This I say for your own profit; not that I may ensnare you, but for that which is appropriate, and that you may attend to the Lord without distraction.";
vul[35] = "porro hoc ad utilitatem vestram dico non ut laqueum vobis iniciam sed ad id quod honestum est et quod facultatem praebeat sine inpedimento Dominum observandi";
rsv[36] = "If any one thinks that he is not behaving properly toward his betrothed, if his passions are strong, and it has to be, let him do as he wishes: let them marry--it is no sin.";
asv[36] = "But if any man thinketh that he behaveth himself unseemly toward his virgin [daughter], if she be past the flower of her age, and if need so requireth, let him do what he will; he sinneth not; let them marry.";
yng[36] = "and if any one doth think [it] to be unseemly to his virgin, if she may be beyond the bloom of age, and it ought so to be, what he willeth let him do; he doth not sin -- let him marry.";
dby[36] = "But if any one think that he behaves unseemly to his virginity, if he be beyond the flower of his age, and so it must be, let him do what he will, he does not sin: let them marry.";
web[36] = "But if any man thinketh that he behaveth himself uncomely towards his virgin, if she hath passed the flower of [her] age, and need so requireth, let him do what he will, he sinneth not: let them marry.";
hnv[36] = "But if any man thinks that he is behaving inappropriately toward his virgin, if she is past the flower of her age, and if need so requires, let him do what he desires. He doesn\'t sin. Let them marry.";
vul[36] = "si quis autem turpem se videri existimat super virgine sua quod sit superadulta et ita oportet fieri quod vult faciat non peccat nubat";
rsv[37] = "But whoever is firmly established in his heart, being under no necessity but having his desire under control, and has determined this in his heart, to keep her as his betrothed, he will do well.";
asv[37] = "But he that standeth stedfast in his heart, having no necessity, but hath power as touching his own will, and hath determined this in his own heart, to keep his own virgin [daughter], shall do well.";
yng[37] = "And he who hath stood stedfast in the heart -- not having necessity -- and hath authority over his own will, and this he hath determined in his heart -- to keep his own virgin -- doth well;";
dby[37] = "But he who stands firm in his heart, having no need, but has authority over his own will, and has judged this in his heart to keep his own virginity, he does well.";
web[37] = "Nevertheless, he that standeth steadfast in his heart, having no necessity, but hath power over his own will, and hath so decreed in his heart that he will keep his virgin, doeth well.";
hnv[37] = "But he who stands steadfast in his heart, having no necessity, but has power over his own heart, to keep his own virgin, does well.";
vul[37] = "nam qui statuit in corde suo firmus non habens necessitatem potestatem autem habet suae voluntatis et hoc iudicavit in corde suo servare virginem suam bene facit";
rsv[38] = "So that he who marries his betrothed does well; and he who refrains from marriage will do better.";
asv[38] = "So then both he that giveth his own virgin [daughter] in marriage doeth well; and he that giveth her not in marriage shall do better.";
yng[38] = "so that both he who is giving in marriage doth well, and he who is not giving in marriage doth better.";
dby[38] = "So that he that marries himself does well; and he that does not marry does better.";
web[38] = "So then he that giveth [her] in marriage doeth well; but he that giveth [her] not in marriage doeth better.";
hnv[38] = "So then both he who gives his own virgin in marriage does well, and he who doesn\'t give her in marriage does better.";
vul[38] = "igitur et qui matrimonio iungit virginem suam bene facit et qui non iungit melius facit";
rsv[39] = "A wife is bound to her husband as long as he lives. If the husband dies, she is free to be married to whom she wishes, only in the Lord.";
asv[39] = "A wife is bound for so long time as her husband liveth; but if the husband be dead, she is free to be married to whom she will; only in the Lord.";
yng[39] = "A wife hath been bound by law as long time as her husband may live, and if her husband may sleep, she is free to be married to whom she will -- only in the Lord;";
dby[39] = "A wife is bound for whatever time her husband lives; but if the husband be fallen asleep, she is free to be married to whom she will, only in [the] Lord.";
web[39] = "The wife is bound by the law as long as her husband liveth; but if her husband is dead, she is at liberty to be married to whom she will; only in the Lord.";
hnv[39] = "A wife is bound by law for as long as her husband lives; but if the husband is dead, she is free to be married to whoever she desires, only in the Lord.";
vul[39] = "mulier alligata est quanto tempore vir eius vivit quod si dormierit vir eius liberata est cui vult nubat tantum in Domino";
rsv[40] = "But in my judgment she is happier if she remains as she is. And I think that I have the Spirit of God.";
asv[40] = "But she is happier if she abide as she is, after my judgment: and I think that I also have the Spirit of God.";
yng[40] = "and she is happier if she may so remain -- according to my judgment; and I think I also have the Spirit of God.";
dby[40] = "But she is happier if she so remain, according to my judgment; but I think that *I* also have God\'s Spirit.";
web[40] = "But she is happier if she so remain, after my judgment; and I think also that I have the Spirit of God.";
hnv[40] = "But she is happier if she stays as she is, in my judgment, and I think that I also have God\'s Spirit.";
vul[40] = "beatior autem erit si sic permanserit secundum meum consilium puto autem quod et ego Spiritum Dei habeo";
</script>
