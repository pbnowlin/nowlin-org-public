csb[1] = "Now concerning spiritual gifts: brothers and sisters, I do not want you to be unaware.";
csb[2] = "You know that when you were pagans, you used to be enticed and led astray by mute idols.";
csb[3] = "Therefore I want you to know that no one speaking by the Spirit of God says, &quot;Jesus is cursed,&quot; and no one can say, &quot;Jesus is Lord,&quot; except by the Holy Spirit.";
csb[4] = "Now there are different gifts, but the same Spirit.";
csb[5] = "There are different ministries, but the same Lord.";
csb[6] = "And there are different activities, but the same God produces each gift in each person.";
csb[7] = "A manifestation of the Spirit is given to each person for the common good:";
csb[8] = "to one is given a message of wisdom through the Spirit, to another, a message of knowledge by the same Spirit,";
csb[9] = "to another, faith by the same Spirit, to another, gifts of healing by the one Spirit,";
csb[10] = "to another, the performing of miracles, to another, prophecy, to another, distinguishing between spirits, to another, different kinds of tongues, to another, interpretation of tongues.";
csb[11] = "One and the same Spirit is active in all these, distributing to each person as he wills.";
csb[12] = "For just as the body is one and has many parts, and all the parts of that body, though many, are one body -- so also is Christ.";
csb[13] = "For we were all baptized by one Spirit into one body -- whether Jews or Greeks, whether slaves or free -- and we were all given one Spirit to drink.";
csb[14] = "Indeed, the body is not one part but many.";
csb[15] = "If the foot should say, &quot;Because I\'m not a hand, I don\'t belong to the body,&quot; it is not for that reason any less a part of the body.";
csb[16] = "And if the ear should say, &quot;Because I\'m not an eye, I don\'t belong to the body,&quot; it is not for that reason any less a part of the body.";
csb[17] = "If the whole body were an eye, where would the hearing be? If the whole body were an ear, where would the sense of smell be?";
csb[18] = "But as it is, God has arranged each one of the parts in the body just as he wanted.";
csb[19] = "And if they were all the same part, where would the body be?";
csb[20] = "As it is, there are many parts, but one body.";
csb[21] = "The eye cannot say to the hand, &quot;I don\'t need you! &quot; Or again, the head can\'t say to the feet, &quot;I don\'t need you! &quot;";
csb[22] = "On the contrary, those parts of the body that are weaker are indispensable.";
csb[23] = "And those parts of the body that we consider less honorable, we clothe these with greater honor, and our unrespectable parts are treated with greater respect,";
csb[24] = "which our respectable parts do not need. Instead, God has put the body together, giving greater honor to the less honorable,";
csb[25] = "so that there would be no division in the body, but that the members would have the same concern for each other.";
csb[26] = "So if one member suffers, all the members suffer with it; if one member is honored, all the members rejoice with it.";
csb[27] = "Now you are the body of Christ, and individual members of it.";
csb[28] = "And God has appointed these in the church: first apostles, second prophets, third teachers, next miracles, then gifts of healing, helping, administrating, various kinds of tongues.";
csb[29] = "Are all apostles? Are all prophets? Are all teachers? Do all do miracles?";
csb[30] = "Do all have gifts of healing? Do all speak in other tongues? Do all interpret?";
csb[31] = "But desire the greater gifts. And I will show you an even better way.";
asv[1] = "Now concerning spiritual [gifts], brethren, I would not have you ignorant.";
asv[2] = "Ye know that when ye were Gentiles [ye were] led away unto those dumb idols, howsoever ye might be led.";
asv[3] = "Wherefore I make known unto you, that no man speaking in the Spirit of God saith, Jesus is anathema; and no man can say, Jesus is Lord, but in the Holy Spirit.";
asv[4] = "Now there are diversities of gifts, but the same Spirit.";
asv[5] = "And there are diversities of ministrations, and the same Lord.";
asv[6] = "And there are diversities of workings, but the same God, who worketh all things in all.";
asv[7] = "But to each one is given the manifestation of the Spirit to profit withal.";
asv[8] = "For to one is given through the Spirit the word of wisdom; and to another the word of knowledge, according to the same Spirit:";
asv[9] = "to another faith, in the same Spirit; and to another gifts of healings, in the one Spirit;";
asv[10] = "and to another workings of miracles; and to another prophecy; and to another discernings of spirits: to another [divers] kinds of tongues; and to another the interpretation of tongues:";
asv[11] = "but all these worketh the one and the same Spirit, dividing to each one severally even as he will.";
asv[12] = "For as the body is one, and hath many members, and all the members of the body, being many, are one body; so also is Christ.";
asv[13] = "For in one Spirit were we all baptized into one body, whether Jews or Greeks, whether bond or free; and were all made to drink of one Spirit.";
asv[14] = "For the body is not one member, but many.";
asv[15] = "If the foot shall say, Because I am not the hand, I am not of the body; it is not therefore not of the body.";
asv[16] = "And if the ear shall say, Because I am not the eye, I am not of the body; it is not therefore not of the body.";
asv[17] = "If the whole body were an eye, where were the hearing? If the whole were hearing, where were the smelling?";
asv[18] = "But now hath God set the members each one of them in the body, even as it pleased him.";
asv[19] = "And if they were all one member, where were the body?";
asv[20] = "But now they are many members, but one body.";
asv[21] = "And the eye cannot say to the hand, I have no need of thee: or again the head to the feet, I have no need of you.";
asv[22] = "Nay, much rather, those members of the body which seem to be more feeble are necessary:";
asv[23] = "and those [parts] of the body, which we think to be less honorable, upon these we bestow more abundant honor; and our uncomely [parts] have more abundant comeliness;";
asv[24] = "whereas our comely [parts] have no need: but God tempered the body together, giving more abundant honor to that [part] which lacked;";
asv[25] = "that there should be no schism in the body; but [that] the members should have the same care one for another.";
asv[26] = "And whether one member suffereth, all the members suffer with it; or [one] member is honored, all the members rejoice with it.";
asv[27] = "Now ye are the body of Christ, and severally members thereof.";
asv[28] = "And God hath set some in the church, first apostles, secondly prophets, thirdly teachers, then miracles, then gifts of healings, helps, governments, [divers] kinds of tongues.";
asv[29] = "Are all apostles? are all prophets? are all teachers? are all [workers of] miracles?";
asv[30] = "have all gifts of healings? do all speak with tongues? do all interpret?";
asv[31] = "But desire earnestly the greater gifts. And moreover a most excellent way show I unto you.";
dby[1] = "But concerning spiritual [manifestations], brethren, I do not wish you to be ignorant.";

dby[15] = "If the foot say, Because I am not a hand I am not of the body, is it on account of this not indeed of the body?";

hnv[1] = "Now concerning spiritual gifts, brothers, I don\'t want you to be ignorant.";
hnv[2] = "You know that when you were heathen, you were led away to those mute idols, however you might be led.";
hnv[3] = "Therefore I make known to you that no man speaking by God\'s Spirit says, &quot;Yeshua is accursed.&quot; No one can say, &quot;Yeshua is Lord,&quot; but by the Ruach HaKodesh.";
hnv[4] = "Now there are various kinds of gifts, but the same Spirit.";
hnv[5] = "There are various kinds of service, and the same Lord.";
hnv[6] = " There are various kinds of workings, but the same God, who works all things in all.";
hnv[7] = "But to each one is given the manifestation of the Spirit for the profit of all.";
hnv[8] = "For to one is given through the Spirit the word of wisdom, and to another the word of knowledge, according to the same Spirit;";
hnv[9] = "to another faith, by the same Spirit; and to another gifts of healings, by the same Spirit;";
hnv[10] = " and to another workings of miracles; and to another prophecy; and to another discerning of spirits; to another different kinds of languages; and to another the interpretation of languages.";
hnv[11] = "But the one and the same Spirit works all of these, distributing to each one separately as he desires.";
hnv[12] = "For as the body is one, and has many members, and all the members of the body, being many, are one body; so also is Messiah.";
hnv[13] = "For in one Spirit we were all immersed into one body, whether Yehudim or Yevanim, whether bond or free; and were all given to drink into one Spirit.";
hnv[14] = "For the body is not one member, but many.";
hnv[15] = "If the foot would say, &quot;Because I\'m not the hand, I\'m not part of the body,&quot; it is not therefore not part of the body.";
hnv[16] = "If the ear would say, &quot;Because I\'m not the eye, I\'m not part of the body,&quot; it\'s not therefore not part of the body.";
hnv[17] = "If the whole body were an eye, where would the hearing be? If the whole were hearing, where would the smelling be?";
hnv[18] = "But now God has set the members, each one of them, in the body, just as he desired.";
hnv[19] = "If they were all one member, where would the body be?";
hnv[20] = "But now they are many members, but one body.";
hnv[21] = "The eye can\'t tell the hand, &quot;I have no need for you,&quot; or again the head to the feet, &quot;I have no need for you.&quot;";
hnv[22] = "No, much rather, those members of the body which seem to be weaker are necessary.";
hnv[23] = "Those parts of the body which we think to be less honorable, on those we bestow more abundant honor; and our unpresentable parts have more abundant propriety;";
hnv[24] = "whereas our presentable parts have no such need. But God composed the body together, giving more abundant honor to the inferior part,";
hnv[25] = "that there should be no division in the body, but that the members should have the same care for one another.";
hnv[26] = "When one member suffers, all the members suffer with it. Or when one member is honored, all the members rejoice with it.";
hnv[27] = "Now you are the body of Messiah, and members individually.";
hnv[28] = "God has set some in the assembly: first apostles, second prophets, third teachers, then miracle workers, then gifts of healings, helps, governments, and various kinds of languages.";
hnv[29] = "Are all apostles? Are all prophets? Are all teachers? Are all miracle workers?";
hnv[30] = "Do all have gifts of healings? Do all speak with various languages? Do all interpret?";
hnv[31] = "But earnestly desire the best gifts. Moreover, I show a most excellent way to you.";

rsv[1] = "Now concerning spiritual gifts, brethren, I do not want you to be uninformed.";
rsv[2] = "You know that when you were heathen, you were led astray to dumb idols, however you may have been moved.";
rsv[3] = "Therefore I want you to understand that no one speaking by the Spirit of God ever says &quot;Jesus be cursed!&quot; and no one can say &quot;Jesus is Lord&quot; except by the Holy Spirit.";
rsv[4] = "Now there are varieties of gifts, but the same Spirit;";
rsv[5] = "and there are varieties of service, but the same Lord;";
rsv[6] = "and there are varieties of working, but it is the same God who inspires them all in every one.";
rsv[7] = "To each is given the manifestation of the Spirit for the common good.";
rsv[8] = "To one is given through the Spirit the utterance of wisdom, and to another the utterance of knowledge according to the same Spirit,";
rsv[9] = "to another faith by the same Spirit, to another gifts of healing by the one Spirit,";
rsv[10] = "to another the working of miracles, to another prophecy, to another the ability to distinguish between spirits, to another various kinds of tongues, to another the interpretation of tongues.";
rsv[11] = "All these are inspired by one and the same Spirit, who apportions to each one individually as he wills.";
rsv[12] = "For just as the body is one and has many members, and all the members of the body, though many, are one body, so it is with Christ.";
rsv[13] = "For by one Spirit we were all baptized into one body--Jews or Greeks, slaves or free--and all were made to drink of one Spirit.";
rsv[14] = "For the body does not consist of one member but of many.";
rsv[15] = "If the foot should say, &quot;Because I am not a hand, I do not belong to the body,&quot; that would not make it any less a part of the body.";
rsv[16] = "And if the ear should say, &quot;Because I am not an eye, I do not belong to the body,&quot; that would not make it any less a part of the body.";
rsv[17] = "If the whole body were an eye, where would be the hearing? If the whole body were an ear, where would be the sense of smell?";
rsv[18] = "But as it is, God arranged the organs in the body, each one of them, as he chose.";
rsv[19] = "If all were a single organ, where would the body be?";
rsv[20] = "As it is, there are many parts, yet one body.";
rsv[21] = "The eye cannot say to the hand, &quot;I have no need of you,&quot; nor again the head to the feet, &quot;I have no need of you.&quot;";
rsv[22] = "On the contrary, the parts of the body which seem to be weaker are indispensable,";
rsv[23] = "and those parts of the body which we think less honorable we invest with the greater honor, and our unpresentable parts are treated with greater modesty,";
rsv[24] = "which our more presentable parts do not require. But God has so composed the body, giving the greater honor to the inferior part,";
rsv[25] = "that there may be no discord in the body, but that the members may have the same care for one another.";
rsv[26] = "If one member suffers, all suffer together; if one member is honored, all rejoice together.";
rsv[27] = "Now you are the body of Christ and individually members of it.";
rsv[28] = "And God has appointed in the church first apostles, second prophets, third teachers, then workers of miracles, then healers, helpers, administrators, speakers in various kinds of tongues.";
rsv[29] = "Are all apostles? Are all prophets? Are all teachers? Do all work miracles?";
rsv[30] = "Do all possess gifts of healing? Do all speak with tongues? Do all interpret?";
rsv[31] = "But earnestly desire the higher gifts. And I will show you a still more excellent way.";
vul[1] = "de spiritalibus autem nolo vos ignorare fratres";
vul[2] = "scitis quoniam cum gentes essetis ad simulacra muta prout ducebamini euntes";
vul[3] = "ideo notum vobis facio quod nemo in Spiritu Dei loquens dicit anathema Iesu et nemo potest dicere Dominus Iesus nisi in Spiritu Sancto";
vul[4] = "divisiones vero gratiarum sunt idem autem Spiritus";
vul[5] = "et divisiones ministrationum sunt idem autem Dominus";
vul[6] = "et divisiones operationum sunt idem vero Deus qui operatur omnia in omnibus";
vul[7] = "unicuique autem datur manifestatio Spiritus ad utilitatem";
vul[8] = "alii quidem per Spiritum datur sermo sapientiae alii autem sermo scientiae secundum eundem Spiritum";
vul[9] = "alteri fides in eodem Spiritu alii gratia sanitatum in uno Spiritu";
vul[10] = "alii operatio virtutum alii prophetatio alii discretio spirituum alii genera linguarum alii interpretatio sermonum";
vul[11] = "haec autem omnia operatur unus atque idem Spiritus dividens singulis prout vult";
vul[12] = "sicut enim corpus unum est et membra habet multa omnia autem membra corporis cum sint multa unum corpus sunt ita et Christus";
vul[13] = "etenim in uno Spiritu omnes nos in unum corpus baptizati sumus sive Iudaei sive gentiles sive servi sive liberi et omnes unum Spiritum potati sumus";
vul[14] = "nam et corpus non est unum membrum sed multa";
vul[15] = "si dixerit pes quoniam non sum manus non sum de corpore non ideo non est de corpore";
vul[16] = "et si dixerit auris quia non sum oculus non sum de corpore non ideo non est de corpore";
vul[17] = "si totum corpus oculus ubi auditus si totum auditus ubi odoratus";
vul[18] = "nunc autem posuit Deus membra unumquodque eorum in corpore sicut voluit";
vul[19] = "quod si essent omnia unum membrum ubi corpus";
vul[20] = "nunc autem multa quidem membra unum autem corpus";
vul[21] = "non potest dicere oculus manui opera tua non indigeo aut iterum caput pedibus non estis mihi necessarii";
vul[22] = "sed multo magis quae videntur membra corporis infirmiora esse necessariora sunt";
vul[23] = "et quae putamus ignobiliora membra esse corporis his honorem abundantiorem circumdamus et quae inhonesta sunt nostra abundantiorem honestatem habent";
vul[24] = "honesta autem nostra nullius egent sed Deus temperavit corpus ei cui deerat abundantiorem tribuendo honorem";
vul[25] = "ut non sit scisma in corpore sed id ipsum pro invicem sollicita sint membra";
vul[26] = "et si quid patitur unum membrum conpatiuntur omnia membra sive gloriatur unum membrum congaudent omnia membra";
vul[27] = "vos autem estis corpus Christi et membra de membro";
vul[28] = "et quosdam quidem posuit Deus in ecclesia primum apostolos secundo prophetas tertio doctores deinde virtutes exin gratias curationum opitulationes gubernationes genera linguarum";
vul[29] = "numquid omnes apostoli numquid omnes prophetae numquid omnes doctores";
vul[30] = "numquid omnes virtutes numquid omnes gratiam habent curationum numquid omnes linguis loquuntur numquid omnes interpretantur";
vul[31] = "aemulamini autem charismata maiora et adhuc excellentiorem viam vobis demonstro";

web[14] = "For the body is not one member, but many.";
web[15] = "If the foot shall say, Because I am not the hand, I am not of the body; is it therefore not of the body?";
web[16] = "And if the ear shall say, Because I am not the eye, I am not of the body; is it therefore not of the body?";
web[17] = "If the whole body [were] an eye, where [were] the hearing? If the whole [were] hearing, where [were] the smelling?";
web[18] = "But now hath God set the members every one of them in the body, as it hath pleased him.";
web[19] = "And if they were all one member, where [were] the body?";
web[20] = "But now [are they] many members, yet but one body.";
web[21] = "And the eye cannot say to the hand, I have no need of thee: nor again the head to the feet, I have no need of you.";
web[22] = "Nay, much more those members of the body, which seem to be more feeble, are necessary:";
web[23] = "And those [members] of the body, which we think to be less honorable, upon these we bestow more abundant honor; and our uncomely [parts] have more abundant comeliness.";
web[24] = "For our comely [parts] have no need: but God hath tempered the body together, having given more abundant honor to that [part] which lacked:";
web[25] = "That there should be no schism in the body; but [that] the members should have the same care one for another.";
web[26] = "And thus if one member suffers all the members suffer with it; or, if one member is honored, all the members rejoice with it.";
web[27] = "Now ye are the body of Christ, and members in particular.";
web[28] = "And God hath set some in the church, first apostles, secondly prophets, thirdly teachers, next miracles, then gifts of healings, helps, governments, diversities of languages.";
web[29] = "[Are] all apostles? [are] all prophets? [are] all teachers? [are] all workers of miracles?";
web[30] = "Have all the gifts of healing? do all speak in languages? do all interpret?";
web[31] = "But covet earnestly the best gifts. And yet I show to you a more excellent way.";
yng[1] = "And concerning the spiritual things, brethren, I do not wish you to be ignorant;";
yng[2] = "ye have known that ye were nations, unto the dumb idols -- as ye were led -- being carried away;";
yng[3] = "wherefore, I give you to understand that no one, in the Spirit of God speaking, saith Jesus [is] anathema, and no one is able to say Jesus [is] Lord, except in the Holy Spirit.";
yng[4] = "And there are diversities of gifts, and the same Spirit;";
yng[5] = "and there are diversities of ministrations, and the same Lord;";
yng[6] = "and there are diversities of workings, and it is the same God -- who is working the all in all.";
yng[7] = "And to each hath been given the manifestation of the Spirit for profit;";
yng[8] = "for to one through the Spirit hath been given a word of wisdom, and to another a word of knowledge, according to the same Spirit;";
yng[9] = "and to another faith in the same Spirit, and to another gifts of healings in the same Spirit;";
yng[10] = "and to another in-workings of mighty deeds; and to another prophecy; and to another discernings of spirits; and to another [divers] kinds of tongues; and to another interpretation of tongues:";
yng[11] = "and all these doth work the one and the same Spirit, dividing to each severally as he intendeth.";
yng[12] = "For, even as the body is one, and hath many members, and all the members of the one body, being many, are one body, so also [is] the Christ,";
yng[13] = "for also in one Spirit we all to one body were baptized, whether Jews or Greeks, whether servants or freemen, and all into one Spirit were made to drink,";
yng[14] = "for also the body is not one member, but many;";
yng[15] = "if the foot may say, `Because I am not a hand, I am not of the body;\' it is not, because of this, not of the body;";
yng[16] = "and if the ear may say, `Because I am not an eye, I am not of the body;\' it is not, because of this, not of the body?";
yng[17] = "If the whole body [were] an eye, where the hearing? if the whole hearing, where the smelling?";
yng[18] = "and now, God did set the members each one of them in the body, according as He willed,";
yng[19] = "and if all were one member, where the body?";
yng[20] = "and now, indeed, [are] many members, and one body;";
yng[21] = "and an eye is not able to say to the hand, `I have no need of thee;\' nor again the head to the feet, `I have no need of you.\'";
yng[22] = "But much more the members of the body which seem to be more infirm are necessary,";
yng[23] = "and those that we think to be less honourable of the body, around these we put more abundant honour, and our unseemly things have seemliness more abundant,";
yng[24] = "and our seemly things have no need; but God did temper the body together, to the lacking part having given more abundant honour,";
yng[25] = "that there may be no division in the body, but that the members may have the same anxiety for one another,";
yng[26] = "and whether one member doth suffer, suffer with [it] do all the members, or one member is glorified, rejoice with [it] do all the members;";
yng[27] = "and ye are the body of Christ, and members in particular.";
yng[28] = "And some, indeed, did God set in the assembly, first apostles, secondly prophets, thirdly teachers, afterwards powers, afterwards gifts of healings, helpings, governings, divers kinds of tongues;";
yng[29] = "[are] all apostles? [are] all prophets? [are] all teachers? [are] all powers?";
yng[30] = "have all gifts of healings? do all speak with tongues? do all interpret?";
yng[31] = "and desire earnestly the better gifts; and yet a far excelling way do I shew to you:";
</script>
