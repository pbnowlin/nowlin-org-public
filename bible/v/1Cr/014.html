csb[1] = "Pursue love and desire spiritual gifts, and especially that you may prophesy.";
csb[2] = "For the person who speaks in another tongue is not speaking to people but to God, since no one understands him; he speaks mysteries in the Spirit.";
csb[3] = "On the other hand, the person who prophesies speaks to people for their strengthening, encouragement, and consolation.";
csb[4] = "The person who speaks in another tongue builds himself up, but the one who prophesies builds up the church.";
csb[5] = "I wish all of you spoke in other tongues, but even more that you prophesied. The person who prophesies is greater than the person who speaks in tongues, unless he interprets so that the church may be built up.";
csb[6] = "So now, brothers and sisters, if I come to you speaking in other tongues, how will I benefit you unless I speak to you with a revelation or knowledge or prophecy or teaching?";
csb[7] = "Even lifeless instruments that produce sounds -- whether flute or harp -- if they don\'t make a distinction in the notes, how will what is played on the flute or harp be recognized?";
csb[8] = "In fact, if the bugle makes an unclear sound, who will prepare for battle?";
csb[9] = "In the same way, unless you use your tongue for intelligible speech, how will what is spoken be known? For you will be speaking into the air.";
csb[10] = "There are doubtless many different kinds of languages in the world, none is without meaning.";
csb[11] = "Therefore, if I do not know the meaning of the language, I will be a foreigner to the speaker, and the speaker will be a foreigner to me.";
csb[12] = "So also you -- since you are zealous for spiritual gifts, seek to excel in building up the church.";
csb[13] = "Therefore the person who speaks in another tongue should pray that he can interpret.";
csb[14] = "For if I pray in another tongue, my spirit prays, but my understanding is unfruitful.";
csb[15] = "What then? I will pray with the spirit, and I will also pray with my understanding. I will sing praise with the spirit, and I will also sing praise with my understanding.";
csb[16] = "Otherwise, if you praise with the spirit, how will the outsider say &quot;Amen&quot; at your giving of thanks, since he does not know what you are saying?";
csb[17] = "For you may very well be giving thanks, but the other person is not being built up.";
csb[18] = "I thank God that I speak in other tongues more than all of you;";
csb[19] = "yet in the church I would rather speak five words with my understanding, in order to teach others also, than ten thousand words in another tongue.";
csb[20] = "Brothers and sisters, don\'t be childish in your thinking, but be infants in regard to evil and adult in your thinking.";
csb[21] = "It is written in the law, I will speak to this people by people of other tongues and by the lips of foreigners, and even then, they will not listen to me, says the Lord.";
csb[22] = "Speaking in other tongues, then, is intended as a sign, not for believers but for unbelievers, while prophecy is not for unbelievers but for believers.";
csb[23] = "If, therefore, the whole church assembles together and all are speaking in other tongues and people who are outsiders or unbelievers come in, will they not say that you are out of your minds?";
csb[24] = "But if all are prophesying and some unbeliever or outsider comes in, he is convicted by all and is called to account by all.";
csb[25] = "The secrets of his heart will be revealed, and as a result he will fall facedown and worship God, proclaiming, &quot;God is really among you.&quot;";
csb[26] = "What then, brothers and sisters? Whenever you come together, each one has a hymn, a teaching, a revelation, another tongue, or an interpretation. Everything is to be done for building up.";
csb[27] = "If anyone speaks in another tongue, there are to be only two, or at the most three, each in turn, and let someone interpret.";
csb[28] = "But if there is no interpreter, that person is to keep silent in the church and speak to himself and God.";
csb[29] = "Two or three prophets should speak, and the others should evaluate.";
csb[30] = "But if something has been revealed to another person sitting there, the first prophet should be silent.";
csb[31] = "For you can all prophesy one by one, so that everyone may learn and everyone may be encouraged.";
csb[32] = "And the prophets\' spirits are subject to the prophets,";
csb[33] = "since God is not a God of disorder but of peace. As in all the churches of the saints,";
csb[34] = "the women should be silent in the churches, for they are not permitted to speak, but are to submit themselves, as the law also says.";
csb[35] = "If they want to learn something, let them ask their own husbands at home, since it is disgraceful for a woman to speak in the church.";
csb[36] = "Or did the word of God originate from you, or did it come to you only?";
csb[37] = "If anyone thinks he is a prophet or spiritual, he should recognize that what I write to you is the Lord\'s command.";
csb[38] = "If anyone ignores this, he will be ignored.";
csb[39] = "So then, my brothers and sisters, be eager to prophesy, and do not forbid speaking in other tongues.";
csb[40] = "But everything is to be done decently and in order.";
asv[1] = "Follow after love; yet desire earnestly spiritual [gifts], but rather that ye may prophesy.";
asv[2] = "For he that speaketh in a tongue speaketh not unto men, but unto God; for no man understandeth; but in the spirit he speaketh mysteries.";
asv[3] = "But he that prophesieth speaketh unto men edification, and exhortation, and consolation.";
asv[4] = "He that speaketh in a tongue edifieth himself; but he that prophesieth edifieth the church.";
asv[5] = "Now I would have you all speak with tongues, but rather that ye should prophesy: and greater is he that prophesieth than he that speaketh with tongues, except he interpret, that the church may receive edifying.";
asv[6] = "But now, brethren, if I come unto you speaking with tongues, what shall I profit you, unless I speak to you either by way of revelation, or of knowledge, or of prophesying, or of teaching?";
asv[7] = "Even things without life, giving a voice, whether pipe or harp, if they give not a distinction in the sounds, how shall it be known what is piped or harped?";
asv[8] = "For if the trumpet give an uncertain voice, who shall prepare himself for war?";
asv[9] = "So also ye, unless ye utter by the tongue speech easy to be understood, how shall it be known what is spoken? for ye will be speaking into the air.";
asv[10] = "There are, it may be, so many kinds of voices in the world, and no [kind] is without signification.";
asv[11] = "If then I know not the meaning of the voice, I shall be to him that speaketh a barbarian, and he that speaketh will be a barbarian unto me.";
asv[12] = "So also ye, since ye are zealous of spiritual [gifts], seek that ye may abound unto the edifying of the church.";
asv[13] = "Wherefore let him that speaketh in a tongue pray that he may interpret.";
asv[14] = "For if I pray in a tongue, my spirit prayeth, but my understanding is unfruitful.";
asv[15] = "What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit, and I will sing with the understanding also.";
asv[16] = "Else if thou bless with the spirit, how shall he that filleth the place of the unlearned say the Amen at thy giving of thanks, seeing he knoweth not what thou sayest?";
asv[17] = "For thou verily givest thanks well, but the other is not edified.";
asv[18] = "I thank God, I speak with tongues more than you all:";
asv[19] = "howbeit in the church I had rather speak five words with my understanding, that I might instruct others also, than ten thousand words in a tongue.";
asv[20] = "Brethren, be not children in mind: yet in malice be ye babes, but in mind be men.";
asv[21] = "In the law it is written, By men of strange tongues and by the lips of strangers will I speak unto this people; and not even thus will they hear me, saith the Lord.";
asv[22] = "Wherefore tongues are for a sign, not to them that believe, but to the unbelieving: but prophesying [is for a sign], not to the unbelieving, but to them that believe.";
asv[23] = "If therefore the whole church be assembled together and all speak with tongues, and there come in men unlearned or unbelieving, will they not say that ye are mad?";
asv[24] = "But if all prophesy, and there come in one unbelieving or unlearned, he is reproved by all, he is judged by all;";
asv[25] = "the secrets of his heart are made manifest; and so he will fall down on his face and worship God, declaring that God is among you indeed.";
asv[26] = "What is it then, brethren? When ye come together, each one hath a psalm, hath a teaching, hath a revelation, hath a tongue, hath an interpretation. Let all things be done unto edifying.";
asv[27] = "If any man speaketh in a tongue, [let it be] by two, or at the most three, and [that] in turn; and let one interpret:";
asv[28] = "but if there be no interpreter, let him keep silence in the church; and let him speak to himself, and to God.";
asv[29] = "And let the prophets speak [by] two or three, and let the others discern.";
asv[30] = "But if a revelation be made to another sitting by, let the first keep silence.";
asv[31] = "For ye all can prophesy one by one, that all may learn, and all may be exhorted;";
asv[32] = "and the spirits of the prophets are subject to the prophets;";
asv[33] = "for God is not [a God] of confusion, but of peace. As in all the churches of the saints,";
asv[34] = "let the women keep silence in the churches: for it is not permitted unto them to speak; but let them be in subjection, as also saith the law.";
asv[35] = "And if they would learn anything, let them ask their own husbands at home: for it is shameful for a woman to speak in the church.";
asv[36] = "What? was it from you that the word of God went forth? or came it unto you alone?";
asv[37] = "If any man thinketh himself to be a prophet, or spiritual, let him take knowledge of the things which I write unto you, that they are the commandment of the Lord.";
asv[38] = "But if any man is ignorant, let him be ignorant.";
asv[39] = "Wherefore, my brethren, desire earnestly to prophesy, and forbid not to speak with tongues.";
asv[40] = "But let all things be done decently and in order.";

hnv[1] = "Follow after love, and earnestly desire spiritual gifts, but especially that you may prophesy.";

rsv[15] = "What am I to do? I will pray with the spirit and I will pray with the mind also; I will sing with the spirit and I will sing with the mind also.";
rsv[16] = "Otherwise, if you bless with the spirit, how can any one in the position of an outsider say the &quot;Amen&quot; to your thanksgiving when he does not know what you are saying?";
rsv[17] = "For you may give thanks well enough, but the other man is not edified.";
rsv[18] = "I thank God that I speak in tongues more than you all;";
rsv[19] = "nevertheless, in church I would rather speak five words with my mind, in order to instruct others, than ten thousand words in a tongue.";
rsv[20] = "Brethren, do not be children in your thinking; be babes in evil, but in thinking be mature.";
rsv[21] = "In the law it is written, &quot;By men of strange tongues and by the lips of foreigners will I speak to this people, and even then they will not listen to me, says the Lord.&quot;";
rsv[22] = "Thus, tongues are a sign not for believers but for unbelievers, while prophecy is not for unbelievers but for believers.";
rsv[23] = "If, therefore, the whole church assembles and all speak in tongues, and outsiders or unbelievers enter, will they not say that you are mad?";
rsv[24] = "But if all prophesy, and an unbeliever or outsider enters, he is convicted by all, he is called to account by all,";
rsv[25] = "the secrets of his heart are disclosed; and so, falling on his face, he will worship God and declare that God is really among you.";
rsv[26] = "What then, brethren? When you come together, each one has a hymn, a lesson, a revelation, a tongue, or an interpretation. Let all things be done for edification.";
rsv[27] = "If any speak in a tongue, let there be only two or at most three, and each in turn; and let one interpret.";
rsv[28] = "But if there is no one to interpret, let each of them keep silence in church and speak to himself and to God.";
rsv[29] = "Let two or three prophets speak, and let the others weigh what is said.";
rsv[30] = "If a revelation is made to another sitting by, let the first be silent.";
rsv[31] = "For you can all prophesy one by one, so that all may learn and all be encouraged;";
rsv[32] = "and the spirits of prophets are subject to prophets.";
rsv[33] = "For God is not a God of confusion but of peace. As in all the churches of the saints,";
rsv[34] = "the women should keep silence in the churches. For they are not permitted to speak, but should be subordinate, as even the law says.";
rsv[35] = "If there is anything they desire to know, let them ask their husbands at home. For it is shameful for a woman to speak in church.";
rsv[36] = "What! Did the word of God originate with you, or are you the only ones it has reached?";
rsv[37] = "If any one thinks that he is a prophet, or spiritual, he should acknowledge that what I am writing to you is a command of the Lord.";
rsv[38] = "If any one does not recognize this, he is not recognized.";
rsv[39] = "So, my brethren, earnestly desire to prophesy, and do not forbid speaking in tongues;";
rsv[40] = "but all things should be done decently and in order.";
vul[1] = "sectamini caritatem aemulamini spiritalia magis autem ut prophetetis";
vul[2] = "qui enim loquitur lingua non hominibus loquitur sed Deo nemo enim audit Spiritu autem loquitur mysteria";
vul[3] = "nam qui prophetat hominibus loquitur aedificationem et exhortationem et consolationes";
vul[4] = "qui loquitur lingua semet ipsum aedificat qui autem prophetat ecclesiam aedificat";
vul[5] = "volo autem omnes vos loqui linguis magis autem prophetare nam maior est qui prophetat quam qui loquitur linguis nisi si forte ut interpretetur ut ecclesia aedificationem accipiat";
vul[6] = "nunc autem fratres si venero ad vos linguis loquens quid vobis prodero nisi si vobis loquar aut in revelatione aut scientia aut prophetia aut in doctrina";
vul[7] = "tamen quae sine anima sunt vocem dantia sive tibia sive cithara nisi distinctionem sonituum dederint quomodo scietur quod canitur aut quod citharizatur";
vul[8] = "etenim si incertam vocem det tuba quis parabit se ad bellum";
vul[9] = "ita et vos per linguam nisi manifestum sermonem dederitis quomodo scietur id quod dicitur eritis enim in aera loquentes";
vul[10] = "tam multa ut puta genera linguarum sunt in mundo et nihil sine voce est";
vul[11] = "si ergo nesciero virtutem vocis ero ei cui loquor barbarus et qui loquitur mihi barbarus";
vul[12] = "sic et vos quoniam aemulatores estis spirituum ad aedificationem ecclesiae quaerite ut abundetis";
vul[13] = "et ideo qui loquitur lingua oret ut interpretetur";
vul[14] = "nam si orem lingua spiritus meus orat mens autem mea sine fructu est";
vul[15] = "quid ergo est orabo spiritu orabo et mente psallam spiritu psallam et mente";
vul[16] = "ceterum si benedixeris spiritu qui supplet locum idiotae quomodo dicet amen super tuam benedictionem quoniam quid dicas nescit";
vul[17] = "nam tu quidem bene gratias agis sed alter non aedificatur";
vul[18] = "gratias ago Deo quod omnium vestrum lingua loquor";
vul[19] = "sed in ecclesia volo quinque verba sensu meo loqui ut et alios instruam quam decem milia verborum in lingua";
vul[20] = "fratres nolite pueri effici sensibus sed malitia parvuli estote sensibus autem perfecti estote";
vul[21] = "in lege scriptum est quoniam in aliis linguis et labiis aliis loquar populo huic et nec sic exaudient me dicit Dominus";
vul[22] = "itaque linguae in signum sunt non fidelibus sed infidelibus prophetia autem non infidelibus sed fidelibus";
vul[23] = "si ergo conveniat universa ecclesia in unum et omnes linguis loquantur intrent autem idiotae aut infideles nonne dicent quod insanitis";
vul[24] = "si autem omnes prophetent intret autem quis infidelis vel idiota convincitur ab omnibus diiudicatur ab omnibus";
vul[25] = "occulta cordis eius manifesta fiunt et ita cadens in faciem adorabit Deum pronuntians quod vere Deus in vobis est";
vul[26] = "quid ergo est fratres cum convenitis unusquisque vestrum psalmum habet doctrinam habet apocalypsin habet linguam habet interpretationem habet omnia ad aedificationem fiant";
vul[27] = "sive lingua quis loquitur secundum duos aut ut multum tres et per partes et unus interpretetur";
vul[28] = "si autem non fuerit interpres taceat in ecclesia sibi autem loquatur et Deo";
vul[29] = "prophetae duo aut tres dicant et ceteri diiudicent";
vul[30] = "quod si alii revelatum fuerit sedenti prior taceat";
vul[31] = "potestis enim omnes per singulos prophetare ut omnes discant et omnes exhortentur";
vul[32] = "et spiritus prophetarum prophetis subiecti sunt";
vul[33] = "non enim est dissensionis Deus sed pacis sicut in omnibus ecclesiis sanctorum";
vul[34] = "mulieres in ecclesiis taceant non enim permittitur eis loqui sed subditas esse sicut et lex dicit";
vul[35] = "si quid autem volunt discere domi viros suos interrogent turpe est enim mulieri loqui in ecclesia";
vul[36] = "an a vobis verbum Dei processit aut in vos solos pervenit";
vul[37] = "si quis videtur propheta esse aut spiritalis cognoscat quae scribo vobis quia Domini sunt mandata";
vul[38] = "si quis autem ignorat ignorabitur";
vul[39] = "itaque fratres aemulamini prophetare et loqui linguis nolite prohibere";
vul[40] = "omnia autem honeste et secundum ordinem fiant";
web[1] = "Follow after charity, and desire spiritual [gifts], but rather that ye may prophesy.";
web[2] = "For he that speaketh in an [unknown] language, speaketh not to men, but to God: for no man understandeth [him]; yet in the spirit he speaketh mysteries.";
web[3] = "But he that prophesieth, speaketh to men [to] edification, and exhortation, and comfort.";
web[4] = "He that speaketh in an [unknown] language edifieth himself; but he that prophesieth edifieth the church.";
web[5] = "I would that ye all spoke in languages, but rather that ye prophesied: for greater [is] he that prophesieth than he that speaketh in languages, except he interpret, that the church may receive edifying.";
web[6] = "Now, brethren, if I come to you speaking in languages, what shall I profit you, except I shall speak to you either by revelation, or by knowledge, or by prophesying, or by doctrine?";
web[7] = "And even things without life giving sound, whether pipe or harp, except they give a distinction in the sounds, how shall it be known what is piped or harped?";
web[8] = "For if the trumpet shall give an uncertain sound, who will prepare himself for battle?";
web[9] = "So likewise ye, except ye utter by the tongue words easy to be understood, how shall it be known what is spoken? for ye will speak into the air.";
web[10] = "There are, it may be, so many kinds of voices in the world, and none of them [is] without signification.";
web[11] = "Therefore, if I know not the meaning of the voice, I shall be to him that speaketh a barbarian, and he that speaketh [will be] a barbarian to me.";
web[12] = "Even so ye, forasmuch as ye are zealous of spiritual [gifts], seek that ye may excel to the edifying of the church.";
web[13] = "Wherefore, let him that speaketh in an [unknown] language, pray that he may interpret.";
web[14] = "For if I pray in an [unknown] language, my spirit prayeth, but my understanding is unfruitful.";
web[15] = "What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit, and I will sing with the understanding also.";
web[16] = "Else, when thou shalt bless with the spirit, how shall he that occupieth the room of the unlearned say Amen at thy giving of thanks, seeing he understandeth not what thou sayest?";
web[17] = "For thou verily givest thanks well, but the other is not edified.";
web[18] = "I thank my God, I speak in languages more than ye all:";
web[19] = "Yet in the church I had rather speak five words with my understanding, that [by my voice] I may teach others also, than ten thousand words in an [unknown] language.";
web[20] = "Brethren, be not children in understanding: yet in malice be ye children, but in understanding be men.";
web[21] = "In the law it is written, With [men of] other tongues and other lips will I speak to this people; and yet for all that will they not hear me, saith the Lord.";
web[22] = "Wherefore languages are for a sign, not to them that believe, but to them that believe not: but prophesying [serveth] not for them that believe not, but for them who believe.";
web[23] = "If therefore the whole church is assembled in one place, and all speak in languages, and there come in [those that are] unlearned, or unbelievers, will they not say that ye are insane?";
web[24] = "But if all prophesy, and there come in one that believeth not, or [one] unlearned, he is convinced by all, he is judged by all:";
web[25] = "And thus are the secrets of his heart made manifest; and so falling down on [his] face, he will worship God, and report that God is in you in truth.";
web[26] = "How is it then, brethren? when ye are assembled, every one of you hath a psalm, hath a doctrine, hath a language, hath a revelation, hath an interpretation. Let all things be done to edification.";
web[27] = "If any man speaketh in an [unknown] language, [let it be] by two, or at the most [by] three, and [that] by course; and let one interpret.";
web[28] = "But if there is no interpreter, let him keep silence in the church; and let him speak to himself, and to God.";
web[29] = "Let the prophets speak two or three, and let the others judge.";
web[30] = "If [any thing] is revealed to another that sitteth by, let the first hold his peace.";
web[31] = "For ye may all prophesy one by one, that all may learn, and all may be comforted.";
web[32] = "And the spirits of the prophets are subject to the prophets.";
web[33] = "For God is not [the author] of confusion, but of peace, as in all churches of the saints.";
web[34] = "Let your women keep silence in the churches; for it is not permitted to them to speak: but [they are commanded] to be under obedience, as also saith the law.";
web[35] = "And if they will learn any thing, let them ask their husbands at home; for it is a shame for women to speak in the church.";
web[36] = "What? came the word of God out from you? or came it to you only?";
web[37] = "If any man thinketh himself to be a prophet, or spiritual, let him acknowledge that the things that I write to you are the commandments of the Lord.";
web[38] = "But if any man is ignorant, let him be ignorant.";
web[39] = "Wherefore, brethren, covet to prophesy, and forbid not to speak in languages.";
web[40] = "Let all things be done decently, and in order.";
yng[1] = "Pursue the love, and seek earnestly the spiritual things, and rather that ye may prophecy,";
yng[2] = "for he who is speaking in an [unknown] tongue -- to men he doth not speak, but to God, for no one doth hearken, and in spirit he doth speak secrets;";
yng[3] = "and he who is prophesying to men doth speak edification, and exhortation, and comfort;";
yng[4] = "he who is speaking in an [unknown] tongue, himself doth edify, and he who is prophesying, an assembly doth edify;";
yng[5] = "and I wish you all to speak with tongues, and more that ye may prophecy, for greater is he who is prophesying than he who is speaking with tongues, except one may interpret, that the assembly may receive edification.";
yng[6] = "And now, brethren, if I may come unto you speaking tongues, what shall I profit you, except I shall speak to you either in revelation, or in knowledge, or in prophesying, or in teaching?";
yng[7] = "yet the things without life giving sound -- whether pipe or harp -- if a difference in the sounds they may not give, how shall be known that which is piped or that which is harped?";
yng[8] = "for if also an uncertain sound a trumpet may give, who shall prepare himself for battle?";
yng[9] = "so also ye, if through the tongue, speech easily understood ye may not give -- how shall that which is spoken be known? for ye shall be speaking to air.";
yng[10] = "There are, it may be, so many kinds of voices in the world, and none of them is unmeaning,";
yng[11] = "if, then, I do not know the power of the voice, I shall be to him who is speaking a foreigner, and he who is speaking, is to me a foreigner;";
yng[12] = "so also ye, since ye are earnestly desirous of spiritual gifts, for the building up of the assembly seek that ye may abound;";
yng[13] = "wherefore he who is speaking in an [unknown] tongue -- let him pray that he may interpret;";
yng[14] = "for if I pray in an [unknown] tongue, my spirit doth pray, and my understanding is unfruitful.";
yng[15] = "What then is it? I will pray with the spirit, and I will pray also with the understanding; I will sing psalms with the spirit, and I will sing psalms also with the understanding;";
yng[16] = "since, if thou mayest bless with the spirit, he who is filling the place of the unlearned, how shall he say the Amen at thy giving of thanks, since what thou dost say he hath not known?";
yng[17] = "for thou, indeed, dost give thanks well, but the other is not built up!";
yng[18] = "I give thanks to my God -- more than you all with tongues speaking --";
yng[19] = "but in an assembly I wish to speak five words through my understanding, that others also I may instruct, rather than myriads of words in an [unknown] tongue.";
yng[20] = "Brethren, become not children in the understanding, but in the evil be ye babes, and in the understanding become ye perfect;";
yng[21] = "in the law it hath been written, that, `With other tongues and with other lips I will speak to this people, and not even so will they hear Me, saith the Lord;\'";
yng[22] = "so that the tongues are for a sign, not to the believing, but to the unbelieving; and the prophesy [is] not for the unbelieving, but for the believing,";
yng[23] = "If, therefore, the whole assembly may come together, to the same place, and all may speak with tongues, and there may come in unlearned or unbelievers, will they not say that ye are mad?";
yng[24] = "and if all may prophecy, and any one may come in, an unbeliever or unlearned, he is convicted by all, he is discerned by all,";
yng[25] = "and so the secrets of his heart become manifest, and so having fallen upon [his] face, he will bow before God, declaring that God really is among you.";
yng[26] = "What then is it, brethren? whenever ye may come together, each of you hath a psalm, hath a teaching, hath a tongue, hath a revelation, hath an interpretation? let all things be for building up;";
yng[27] = "if an [unknown] tongue any one do speak, by two, or at the most, by three, and in turn, and let one interpret;";
yng[28] = "and if there may be no interpreter, let him be silent in an assembly, and to himself let him speak, and to God.";
yng[29] = "And prophets -- let two or three speak, and let the others discern,";
yng[30] = "and if to another sitting [anything] may be revealed, let the first be silent;";
yng[31] = "for ye are able, one by one, all to prophesy, that all may learn, and all may be exhorted,";
yng[32] = "and the spiritual gift of prophets to prophets are subject,";
yng[33] = "for God is not [a God] of tumult, but of peace, as in all the assemblies of the saints.";
yng[34] = "Your women in the assemblies let them be silent, for it hath not been permitted to them to speak, but to be subject, as also the law saith;";
yng[35] = "and if they wish to learn anything, at home their own husbands let them question, for it is a shame to women to speak in an assembly.";
yng[36] = "From you did the word of God come forth? or to you alone did it come?";
yng[37] = "if any one doth think to be a prophet, or spiritual, let him acknowledge the things that I write to you -- that of the Lord they are commands;";
yng[38] = "and if any one is ignorant -- let him be ignorant;";
yng[39] = "so that, brethren, earnestly desire to prophesy, and to speak with tongues do not forbid;";
yng[40] = "let all things be done decently and in order.";
