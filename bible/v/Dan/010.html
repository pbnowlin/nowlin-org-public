csb[1] = "In the third year of King Cyrus of Persia, a message was revealed to Daniel, who was named Belteshazzar. The message was true and was about a great conflict. He understood the message and had understanding of the vision.";
csb[2] = "In those days I, Daniel, was mourning for three full weeks.";
csb[3] = "I didn\'t eat any rich food, no meat or wine entered my mouth, and I didn\'t put any oil on my body until the three weeks were over.";
csb[4] = "On the twenty-fourth day of the first month, as I was standing on the bank of the great river, the Tigris,";
csb[5] = "I looked up, and there was a man dressed in linen, with a belt of gold from Uphaz around his waist.";
csb[6] = "His body was like beryl, his face like the brilliance of lightning, his eyes like flaming torches, his arms and feet like the gleam of polished bronze, and the sound of his words like the sound of a multitude.";
csb[7] = "Only I, Daniel, saw the vision. The men who were with me did not see it, but a great terror fell on them, and they ran and hid.";
csb[8] = "I was left alone, looking at this great vision. No strength was left in me; my face grew deathly pale, and I was powerless.";
csb[9] = "I heard the words he said, and when I heard them I fell into a deep sleep, with my face to the ground.";
csb[10] = "Suddenly, a hand touched me and set me shaking on my hands and knees.";
csb[11] = "He said to me, &quot;Daniel, you are a man treasured by God. Understand the words that I\'m saying to you. Stand on your feet, for I have now been sent to you.&quot; After he said this to me, I stood trembling.";
csb[12] = "&quot;Don\'t be afraid, Daniel,&quot; he said to me, &quot;for from the first day that you purposed to understand and to humble yourself before your God, your prayers were heard. I have come because of your prayers.";
csb[13] = "&quot;But the prince of the kingdom of Persia opposed me for twenty-one days. Then Michael, one of the chief princes, came to help me after I had been left there with the kings of Persia.";
csb[14] = "&quot;Now I have come to help you understand what will happen to your people in the last days, for the vision refers to those days.&quot;";
csb[15] = "While he was saying these words to me, I turned my face toward the ground and was speechless.";
csb[16] = "Suddenly one with human likeness touched my lips. I opened my mouth and said to the one standing in front of me, &quot;My lord, because of the vision, anguish overwhelms me and I am powerless.";
csb[17] = "&quot;How can someone like me, your servant, speak with someone like you, my lord? Now I have no strength, and there is no breath in me.&quot;";
csb[18] = "Then the one with a human appearance touched me again and strengthened me.";
csb[19] = "He said, &quot;Don\'t be afraid, you who are treasured by God. Peace to you; be very strong! &quot; As he spoke to me, I was strengthened and said, &quot;Let my lord speak, for you have strengthened me.&quot;";
csb[20] = "He said, &quot;Do you know why I\'ve come to you? I must return at once to fight against the prince of Persia, and when I leave, the prince of Greece will come.";
csb[21] = "&quot;However, I will tell you what is recorded in the book of truth. (No one has the courage to support me against those princes except Michael, your prince.";

asv[19] = "And he said, O man greatly beloved, fear not: peace be unto thee, be strong, yea, be strong. And when he spake unto me, I was strengthened, and said, Let my lord speak; for thou hast strengthened me.";
yng[19] = "and he saith: Do not fear, O man greatly desired, peace to thee, be strong, yea, be strong; and when he speaketh with me, I have strengthened myself, and I say, Let my lord speak, for thou hast strengthened me.";
dby[19] = "and he said, Fear not, man greatly beloved; peace be unto thee, be strong, yea, be strong. And as he was speaking with me I was strengthened, and I said, Let my lord speak; for thou hast strengthened me.";
web[19] = "And said, O man greatly beloved, fear not: peace [be] to thee, be strong, yes, be strong. And when he had spoken to me, I was strengthened, and said, Let my lord speak; for thou hast strengthened me.";
hnv[19] = "He said, &quot;Greatly beloved man, don\'t be afraid: shalom be to you, be strong, yes, be strong.&quot; When he spoke to me, I was strengthened, and said, &quot;Let my lord speak; for you have strengthened me.&quot;";
vul[19] = "et dixit: Noli timere vir desideriorum: pax tibi: confortare, et esto robustus. Cumque loqueretur mecum, convalui, et dixi: Loquere Domine mi, quia confortasti me.";
kjv[20] = "Then said he, Knowest thou wherefore I come unto thee? and now will I return to fight with the prince of Persia: and when I am gone forth, lo, the prince of Grecia shall come.";
rsv[20] = "Then he said, &quot;Do you know why I have come to you? But now I will return to fight against the prince of Persia; and when I am through with him, lo, the prince of Greece will come.";
asv[20] = "Then said he, Knowest thou wherefore I am come unto thee? and now will I return to fight with the prince of Persia: and when I go forth, lo, the prince of Greece shall come.";
yng[20] = "And he saith, Hast thou known why I have come unto thee? and now I turn back to fight with the head of Persia; yea, I am going forth, and lo, the head of Javan hath come;";
dby[20] = "And he said, Knowest thou wherefore I am come unto thee? And now I return to fight with the prince of Persia; and when I go forth, behold, the prince of Greece shall come.";
web[20] = "Then said he, Knowest thou for what cause I come to thee? and now will I return to fight with the prince of Persia: and when I am gone forth, lo, the prince of Grecia shall come.";
hnv[20] = "Then he said, &quot;Do you know why I have come to you? Now I will return to fight with the prince of Paras. When I go forth, behold, the prince of Yavan shall come.";
vul[20] = "Et ait: Numquid scis quare venerim ad te? et nunc revertar ut praelier adversum principem Persarum. cum ego egrederer, apparuit princeps Graecorum veniens.";
kjv[21] = "But I will shew thee that which is noted in the scripture of truth: and [there is] none that holdeth with me in these things, but Michael your prince.";
rsv[21] = "But I will tell you what is inscribed in the book of truth: there is none who contends by my side against these except Michael, your prince.";
asv[21] = "But I will tell thee that which is inscribed in the writing of truth: and there is none that holdeth with me against these, but Michael your prince.";
