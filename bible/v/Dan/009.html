csb[1] = "In the first year of Darius, the son of Ahasuerus, a Mede by birth, who was made king over the Chaldean kingdom --";
csb[2] = "in the first year of his reign, I, Daniel, understood from the books according to the word of the LORD to the prophet Jeremiah that the number of years for the desolation of Jerusalem would be seventy.";
csb[3] = "So I turned my attention to the Lord God to seek him by prayer and petitions, with fasting, sackcloth, and ashes.";
csb[4] = "I prayed to the LORD my God and confessed: Ah, Lord -- the great and awe-inspiring God who keeps his gracious covenant with those who love him and keep his commands --";
csb[5] = "we have sinned, done wrong, acted wickedly, rebelled, and turned away from your commands and ordinances.";
csb[6] = "We have not listened to your servants the prophets, who spoke in your name to our kings, leaders, fathers, and all the people of the land.";
csb[7] = "Lord, righteousness belongs to you, but this day public shame belongs to us: the men of Judah, the residents of Jerusalem, and all Israel -- those who are near and those who are far, in all the countries where you have banished them because of the disloyalty they have shown toward you.";
csb[8] = "LORD, public shame belongs to us, our kings, our leaders, and our fathers, because we have sinned against you.";
csb[9] = "Compassion and forgiveness belong to the Lord our God, though we have rebelled against him";
csb[10] = "and have not obeyed the LORD our God by following his instructions that he set before us through his servants the prophets.";
csb[11] = "All Israel has broken your law and turned away, refusing to obey you. The promised curse written in the law of Moses, the servant of God, has been poured out on us because we have sinned against him.";
csb[12] = "He has carried out his words that he spoke against us and against our rulers by bringing on us a disaster that is so great that nothing like what has been done to Jerusalem has ever been done under all of heaven.";
csb[13] = "Just as it is written in the law of Moses, all this disaster has come on us, yet we have not sought the favor of the LORD our God by turning from our iniquities and paying attention to your truth.";
csb[14] = "So the LORD kept the disaster in mind and brought it on us, for the LORD our God is righteous in all he has done. But we have not obeyed him.";
csb[15] = "Now, Lord our God, who brought your people out of the land of Egypt with a strong hand and made your name renowned as it is this day, we have sinned, we have acted wickedly.";
csb[16] = "Lord, in keeping with all your righteous acts, may your anger and wrath turn away from your city Jerusalem, your holy mountain; for because of our sins and the iniquities of our fathers, Jerusalem and your people have become an object of ridicule to all those around us.";
csb[17] = "Therefore, our God, hear the prayer and the petitions of your servant. Make your face shine on your desolate sanctuary for the Lord\'s sake.";
csb[18] = "Listen closely, my God, and hear. Open your eyes and see our desolations and the city that bears your name. For we are not presenting our petitions before you based on our righteous acts, but based on your abundant compassion.";
csb[19] = "Lord, hear! Lord, forgive! Lord, listen and act! My God, for your own sake, do not delay, because your city and your people bear your name.";
csb[20] = "While I was speaking, praying, confessing my sin and the sin of my people Israel, and presenting my petition before the LORD my God concerning the holy mountain of my God --";
csb[21] = "while I was praying, Gabriel, the man I had seen in the first vision, reached me in my extreme weariness, about the time of the evening offering.";
csb[22] = "He gave me this explanation: &quot;Daniel, I\'ve come now to give you understanding.";
csb[23] = "&quot;At the beginning of your petitions an answer went out, and I have come to give it, for you are treasured by God. So consider the message and understand the vision:";
csb[24] = "&quot;Seventy weeks are decreed about your people and your holy city -- to bring the rebellion to an end, to put a stop to sin, to atone for iniquity, to bring in everlasting righteousness, to seal up vision and prophecy, and to anoint the most holy place.";
csb[25] = "&quot;Know and understand this: From the issuing of the decree to restore and rebuild Jerusalem until an Anointed One, the ruler, will be seven weeks and sixty-two weeks. It will be rebuilt with a plaza and a moat, but in difficult times.";
csb[26] = "&quot;After those sixty-two weeks the Anointed One will be cut off and will have nothing. The people of the coming ruler will destroy the city and the sanctuary. The end will come with a flood, and until the end there will be war; desolations are decreed.";
csb[27] = "&quot;He will make a firm covenant with many for one week, but in the middle of the week he will put a stop to sacrifice and offering. And the abomination of desolation will be on a wing of the temple until the decreed destruction is poured out on the desolator.&quot;";
kjv[1] = "In the first year of Darius the son of Ahasuerus, of the seed of the Medes, which was made king over the realm of the Chaldeans;";
kjv[2] = "In the first year of his reign I Daniel understood by books the number of the years, whereof the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem.";
kjv[3] = "And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:";
kjv[4] = "And I prayed unto the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;";
kjv[5] = "We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:";
kjv[6] = "Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land.";
kjv[7] = "O Lord, righteousness [belongeth] unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, [that are] near, and [that are] far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee.";
kjv[8] = "O Lord, to us [belongeth] confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee.";
kjv[9] = "To the Lord our God [belong] mercies and forgivenesses, though we have rebelled against him;";
kjv[10] = "Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets.";
kjv[11] = "Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that [is] written in the law of Moses the servant of God, because we have sinned against him.";
kjv[12] = "And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven hath not been done as hath been done upon Jerusalem.";
kjv[13] = "As [it is] written in the law of Moses, all this evil is come upon us: yet made we not our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth.";
kjv[14] = "Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God [is] righteous in all his works which he doeth: for we obeyed not his voice.";
kjv[15] = "And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly.";
kjv[16] = "O Lord, according to all thy righteousness, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins, and for the iniquities of our fathers, Jerusalem and thy people [are become] a reproach to all [that are] about us.";
kjv[17] = "Now therefore, O our God, hear the prayer of thy servant, and his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord\'s sake.";
kjv[18] = "O my God, incline thine ear, and hear; open thine eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies.";
kjv[19] = "O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thine own sake, O my God: for thy city and thy people are called by thy name.";
kjv[20] = "And whiles I [was] speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;";
kjv[21] = "Yea, whiles I [was] speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation.";
kjv[22] = "And he informed [me], and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding.";
kjv[23] = "At the beginning of thy supplications the commandment came forth, and I am come to shew [thee]; for thou [art] greatly beloved: therefore understand the matter, and consider the vision.";
kjv[24] = "Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy.";
kjv[25] = "Know therefore and understand, [that] from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince [shall be] seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times.";
kjv[26] = "And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof [shall be] with a flood, and unto the end of the war desolations are determined.";
kjv[27] = "And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make [it] desolate, even until the consummation, and that determined shall be poured upon the desolate.";

rsv[2] = "in the first year of his reign, I, Daniel, perceived in the books the number of years which, according to the word of the LORD to Jeremiah the prophet, must pass before the end of the desolations of Jerusalem, namely, seventy years.";
asv[2] = "in the first year of his reign I, Daniel, understood by the books the number of the years whereof the word of Jehovah came to Jeremiah the prophet, for the accomplishing of the desolations of Jerusalem, even seventy years.";
yng[2] = "in the first year of his reign, I, Daniel, have understood by books the number of the years, (in that a word of Jehovah hath been unto Jeremiah the prophet,) concerning the fulfilling of the wastes of Jerusalem -- seventy years;";
dby[2] = "in the first year of his reign, I Daniel understood by the books that the number of the years, whereof the word of Jehovah came to Jeremiah the prophet, for the accomplishment of the desolations of Jerusalem, was seventy years.";
web[2] = "In the first year of his reign, I Daniel understood by books the number of the years, concerning which the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem.";
hnv[2] = "in the first year of his reign I, Daniyel, understood by the books the number of the years whereof the word of the LORD came to Yirmeyahu the prophet, for the accomplishing of the desolations of Yerushalayim, even seventy years.";
vul[2] = "Anno uno regni eius, ego Daniel intellexi in libris (l) numerum annorum, de quo factus est sermo Domini ad Ieremiam prophetam, ut complerentur desolationis Ierusalem septuaginta anni.";

vul[3] = "Et posui faciem meam ad Dominum Deum meum rogare et deprecari in ieiuniis, sacco, et cinere.";
rsv[4] = "I prayed to the LORD my God and made confession, saying, &quot;O Lord, the great and terrible God, who keepest covenant and steadfast love with those who love him and keep his commandments,";
asv[4] = "And I prayed unto Jehovah my God, and made confession, and said, Oh, Lord, the great and dreadful God, who keepeth covenant and lovingkindness with them that love him and keep his commandments,";
yng[4] = "And I pray to Jehovah my God, and confess, and say: `I beseech Thee, O Lord God, the great and the fearful, keeping the covenant and the kindness to those loving Him, and to those keeping His commands;";
dby[4] = "and I prayed unto Jehovah my God, and made my confession, and said, Alas Lord! the great and terrible God, keeping covenant and loving-kindness with them that love him, and that keep his commandments:";
web[4] = "And I prayed to the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;";
hnv[4] = "I prayed to the LORD my God, and made confession, and said, Oh, Lord, the great and dreadful God, who keeps covenant and lovingkindness with those who love him and keep his mitzvot,";
vul[4] = "Et oravi Dominum Deum meum, et confessus sum, et dixi: (m) Obsecro Domine Deus magne et terribilis, custodiens pactum, et misericordiam diligentibus te, et custodientibus mandata tua.";

dby[6] = "And we have not hearkened unto thy servants the prophets, who spoke in thy name to our kings, our princes, and our fathers, and to all the people of the land.";

rsv[7] = "To thee, O Lord, belongs righteousness, but to us confusion of face, as at this day, to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those that are near and those that are far away, in all the lands to which thou hast driven them, because of the treachery which they have committed against thee.";
asv[7] = "O Lord, righteousness belongeth unto thee, but unto us confusion of face, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee.";
yng[7] = "`To Thee, O Lord, [is] the righteousness, and to us the shame of face, as [at] this day, to the men of Judah, and to the inhabitants of Jerusalem, and to all Israel, who are near, and who are far off, in all the lands whither Thou hast driven them, in their trespass that they have trespassed against Thee.";
dby[7] = "Thine, O Lord, is the righteousness, but unto us confusion of face, as at this day, to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, in all the countries whither thou hast driven them, because of their unfaithfulness in which they have been unfaithful against thee.";
web[7] = "O Lord, righteousness [belongeth] to thee, but to us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and to all Israel, [that are] near, and [that are] far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee.";
hnv[7] = "Lord, righteousness belongs to you, but to us confusion of face, as at this day; to the men of Yehudah, and to the inhabitants of Yerushalayim, and to all Yisra\'el, who are near, and who are far off, through all the countries where you have driven them, because of their trespass that they have trespassed against you.";
vul[7] = "Tibi Domine iustitia: nobis autem confusio faciei, sicut est hodie viro Iuda, et habitatoribus Ierusalem, et omni Israel, his qui prope sunt, et his qui procul in universis terris, ad quas eiecisti eos propter iniquitates eorum, in quibus peccaverunt in te.";
rsv[8] = "To us, O Lord, belongs confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee.";
asv[8] = "O Lord, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee.";
yng[8] = "`O Lord, to us [is] the shame of face, to our kings, to our heads, and to our fathers, in that we have sinned against Thee.";
dby[8] = "O Lord, unto us is confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee.";
web[8] = "O Lord, to us [belongeth] confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee.";
hnv[8] = " Lord, to us belongs confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against you.";

rsv[9] = "To the Lord our God belong mercy and forgiveness; because we have rebelled against him,";

web[9] = "To the Lord our God [belong] mercies and forgivenesses, though we have rebelled against him;";
hnv[9] = "To the Lord our God belong mercies and forgiveness; for we have rebelled against him;";
vul[9] = "Tibi autem Domino Deo nostro misericordia, et propitiatio, quia recessimus a te:";
rsv[10] = "and have not obeyed the voice of the LORD our God by following his laws, which he set before us by his servants the prophets.";
asv[10] = "neither have we obeyed the voice of Jehovah our God, to walk in his laws, which he set before us by his servants the prophets.";
yng[10] = "and have not hearkened to the voice of Jehovah our God, to walk in His laws, that He hath set before us by the hand of His servants the prophets;";
dby[10] = "and we have not hearkened unto the voice of Jehovah our God, to walk in his laws, which he set before us through his servants the prophets.";
web[10] = "Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets.";
hnv[10] = "neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets.";
vul[10] = "et non audivimus vocem Domini Dei nostri ut ambularemus in lege eius, quam posuit nobis per servos suos prophetas.";
rsv[11] = "All Israel has transgressed thy law and turned aside, refusing to obey thy voice. And the curse and oath which are written in the law of Moses the servant of God have been poured out upon us, because we have sinned against him.";
asv[11] = "Yea, all Israel have transgressed thy law, even turning aside, that they should not obey thy voice: therefore hath the curse been poured out upon us, and the oath that is written in the law of Moses the servant of God; for we have sinned against him.";
yng[11] = "and all Israel have transgressed Thy law, to turn aside so as not to hearken to Thy voice; and poured on us is the execration, and the oath, that is written in the law of Moses, servant of God, because we have sinned against Him.";
dby[11] = "And all Israel have transgressed thy law, even turning aside so as not to listen unto thy voice. And the curse hath been poured out upon us, and the oath that is written in the law of Moses the servant of God: for we have sinned against him.";
web[11] = "And all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that [is] written in the law of Moses the servant of God, because we have sinned against him.";
hnv[11] = "Yes, all Yisra\'el have transgressed your law, even turning aside, that they should not obey your voice: therefore has the curse been poured out on us, and the oath that is written in the law of Moshe the servant of God; for we have sinned against him.";
vul[11] = "Et omnis Israel praevaricati sunt legem tuam, et declinaverunt ne audirent vocem tuam, et stillavit super nos maledictio, et detestatio, (o) quae scripta est in libro Moysi servi Dei, quia peccavimus ei.";
rsv[12] = "He has confirmed his words, which he spoke against us and against our rulers who ruled us, by bringing upon us a great calamity; for under the whole heaven there has not been done the like of what has been done against Jerusalem.";
asv[12] = "And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil; for under the whole heaven hath not been done as hath been done upon Jerusalem.";
yng[12] = "`And He confirmeth His words that He hath spoken against us, and against our judges who have judged us, to bring in upon us great evil, in that it hath not been done under the whole heavens as it hath been done in Jerusalem,";
dby[12] = "And he hath performed his words, which he spoke against us, and against our judges that judged us, by bringing upon us a great evil; so that there hath not been done under the whole heaven as hath been done upon Jerusalem.";
web[12] = "And he hath confirmed his words, which he spoke against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven it hath not been done as it hath been done upon Jerusalem.";
hnv[12] = "He has confirmed his words, which he spoke against us, and against our judges who judged us, by bringing on us a great evil; for under the whole sky has not been done as has been done on Yerushalayim.";
vul[12] = "Et statuit sermones suos, quos locutus est super nos, et super principes nostros, qui iudicaverunt nos, ut superinduceret in nos magnum malum, quale numquam fuit sub omni caelo, secundum quod factum est in Ierusalem.";
rsv[13] = "As it is written in the law of Moses, all this calamity has come upon us, yet we have not entreated the favor of the LORD our God, turning from our iniquities and giving heed to thy truth.";
asv[13] = "As it is written in the law of Moses, all this evil is come upon us: yet have we not entreated the favor of Jehovah our God, that we should turn from our iniquities, and have discernment in thy truth.";
yng[13] = "as it is written in the law of Moses, all this evil hath come upon us, and we have not appeased the face of Jehovah our God to turn back from our iniquities, and to act wisely in Thy truth.";
dby[13] = "As it is written in the law of Moses, all this evil is come upon us; yet we besought not Jehovah our God, that we might turn from our iniquities, and understand thy truth.";
web[13] = "As [it is] written in the law of Moses, all this evil is come upon us: yet we have not made our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth.";
hnv[13] = "As it is written in the law of Moshe, all this evil is come on us: yet have we not entreated the favor of the LORD our God, that we should turn from our iniquities, and have discernment in your truth.";
vul[13] = "Sicut scriptum est in lege Moysi, omne malum hoc venit super nos: et non rogavimus faciem tuam Domine Deus noster, ut reverteremur ab iniquitatibus nostris, et cogitaremus veritatem tuam.";
rsv[14] = "Therefore the LORD has kept ready the calamity and has brought it upon us; for the LORD our God is righteous in all the works which he has done, and we have not obeyed his voice.";
asv[14] = "Therefore hath Jehovah watched over the evil, and brought it upon us; for Jehovah our God is righteous in all his works which he doeth, and we have not obeyed his voice.";
yng[14] = "And Jehovah doth watch for the evil, and bringeth it upon us, for righteous [is] Jehovah our God concerning all His works that He hath done, and we have not hearkened to His voice.";
dby[14] = "And Jehovah hath watched over the evil, and brought it upon us; for Jehovah our God is righteous in all his works which he hath done; and we have not hearkened unto his voice.";
web[14] = "Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God [is] righteous in all his works which he doeth: for we have not obeyed his voice.";
hnv[14] = "Therefore has the LORD watched over the evil, and brought it on us; for the LORD our God is righteous in all his works which he does, and we have not obeyed his voice.";
vul[14] = "Et vigilavit Dominus super malitiam, et adduxit eam super nos: iustus Dominus Deus noster in omnibus operibus suis, quae fecit: non enim audivimus vocem eius.";
rsv[15] = "And now, O Lord our God, who didst bring thy people out of the land of Egypt with a mighty hand, and hast made thee a name, as at this day, we have sinned, we have done wickedly.";
asv[15] = "And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly.";
yng[15] = "And now, O Lord our God, who hast brought forth Thy people from the land of Egypt by a strong hand, and dost make for Thee a name as at this day, we have sinned, we have done wickedly.";
dby[15] = "-- And now, O Lord our God, who broughtest thy people forth out of the land of Egypt with a strong hand, and hast made thee a name, as it is this day, -- we have sinned, we have done wickedly.";
web[15] = "And now, O Lord our God, that hast brought thy people out of the land of Egypt with a mighty hand, and hast obtained thee renown, as at this day; we have sinned, we have done wickedly.";
hnv[15] = "Now, Lord our God, who has brought your people forth out of the land of Mitzrayim with a mighty hand, and have gotten you renown, as at this day; we have sinned, we have done wickedly.";
vul[15] = "(p) Et nunc Domine Deus noster, (q) qui eduxisti populum tuum de Terra Aegypti in manu forti, et fecisti tibi nomen secundum diem hanc: peccavimus, iniquitatem fecimus.";
rsv[16] = "O Lord, according to all thy righteous acts, let thy anger and thy wrath turn away from thy city Jerusalem, thy holy hill; because for our sins, and for the iniquities of our fathers, Jerusalem and thy people have become a byword among all who are round about us.";
asv[16] = "O Lord, according to all thy righteousness, let thine anger and thy wrath, I pray thee, be turned away from thy city Jerusalem, thy holy mountain; because for our sins, and for the iniquities of our fathers, Jerusalem and thy people are become a reproach to all that are round about us.";
yng[16] = "`O Lord, according to all Thy righteous acts, let turn back, I pray Thee, Thine anger and Thy fury from Thy city Jerusalem, Thy holy mount, for by our sins, and by the iniquities of our fathers, Jerusalem and Thy people [are] for a reproach to all our neighbours;";
dby[16] = "Lord, according to all thy righteousnesses, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain; for because of our sins, and because of the iniquities of our fathers, Jerusalem and thy people [are become] a reproach to all round about us.";
web[16] = "O Lord, according to all thy righteousness, I beseech thee, let thy anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins and for the iniquities of our fathers, Jerusalem and thy people [have become] a reproach to all [that are] about us.";
hnv[16] = "Lord, according to all your righteousness, let your anger and please let your wrath be turned away from your city Yerushalayim, your holy mountain; because for our sins, and for the iniquities of our fathers, Yerushalayim and your people are become a reproach to all who are round about us.";
vul[16] = "Domine in omnem iustitiam tuam: avertatur obsecro ira tua, et furor tuus a civitate tua Ierusalem, et monte sancto tuo. Propter peccata enim nostra, et iniquitates patrum nostrorum, Ierusalem, et populus tuus in opprobrium sunt omnibus per circuitum nostrum.";
rsv[17] = "Now therefore, O our God, hearken to the prayer of thy servant and to his supplications, and for thy own sake, O Lord, cause thy face to shine upon thy sanctuary, which is desolate.";
asv[17] = "Now therefore, O our God, hearken unto the prayer of thy servant, and to his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord\'s sake.";
yng[17] = "and now, hearken, O our God, unto the prayer of Thy servant, and unto his supplication, and cause Thy face to shine on Thy sanctuary that [is] desolate, for the Lord\'s sake.";
dby[17] = "And now, our God, hearken to the prayer of thy servant, and to his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord\'s sake.";
web[17] = "Now therefore, O our God, hear the prayer of thy servant, and his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord\'s sake.";
hnv[17] = "Now therefore, our God, listen to the prayer of your servant, and to his petitions, and cause your face to shine on your sanctuary that is desolate, for the Lord\'s sake.";
vul[17] = "Nunc ergo exaudi Deus noster orationem servi tui, et preces eius: et ostende faciem tuam super sanctuarium tuum, quod desertum est propter temetipsum.";
rsv[18] = "O my God, incline thy ear and hear; open thy eyes and behold our desolations, and the city which is called by thy name; for we do not present our supplications before thee on the ground of our righteousness, but on the ground of thy great mercy.";
asv[18] = "O my God, incline thine ear, and hear; open thine eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies\' sake.";
yng[18] = "`Incline, O my God, Thine ear, and hear, open Thine eyes and see our desolations, and the city on which Thy name is called; for not for our righteous acts are we causing our supplications to fall before Thee, but for Thy mercies that [are] many.";
dby[18] = "Incline thine ear, O my God, and hear; open thine eyes and behold our desolations, and the city that is called by thy name: for we do not present our supplications before thee because of our righteousnesses, but because of thy manifold mercies.";
web[18] = "O my God, incline thy ear, and hear; open thy eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies.";
hnv[18] = "My God, turn your ear, and hear; open your eyes, and see our desolations, and the city which is called by your name: for we do not present our petitions before you for our righteousness, but for your great mercies\' sake.";
vul[18] = "Inclina Deus meus aurem tuam, et audi: aperi oculos tuos, et vide desolationem nostram, et civitatem, super quam invocatum est nomen tuum: neque enim in iustificationibus nostris prosternimus preces ante faciem tuam, sed in miserationibus tuis multis:";
rsv[19] = "O LORD, hear; O LORD, forgive; O LORD, give heed and act; delay not, for thy own sake, O my God, because thy city and thy people are called by thy name.&quot;";
asv[19] = "O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thine own sake, O my God, because thy city and thy people are called by thy name.";
yng[19] = "O lord, hear, O Lord, forgive; O Lord, attend and do; do not delay, for Thine own sake, O my God, for Thy name is called on Thy city, and on Thy people.\'";
dby[19] = "Lord, hear! Lord, forgive! Lord, hearken and do! defer not, for thine own sake, O my God! for thy city and thy people are called by thy name.";
web[19] = "O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thy own sake, O my God: for thy city and thy people are called by thy name.";
hnv[19] = "Lord, hear; Lord, forgive; Lord, listen and do; don\'t defer, for your own sake, my God, because your city and your people are called by your name.";
vul[19] = "Exaudi Domine, placare Domine: attende et fac: ne moreris propter temetipsum Deus meus: quia nomen tuum invocatum est super civitatem, et super populum tuum.";
rsv[20] = "While I was speaking and praying, confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy hill of my God;";
asv[20] = "And while I was speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before Jehovah my God for the holy mountain of my God;";
yng[20] = "And while I am speaking, and praying, and confessing my sin, and the sin of my people Israel, and causing my supplication to fall before Jehovah my God, for the holy mount of my God,";
dby[20] = "And whilst I was speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before Jehovah my God for the holy mountain of my God;";
web[20] = "And while I was speaking, and praying, and confessing my sin, and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;";
hnv[20] = "While I was speaking, and praying, and confessing my sin and the sin of my people Yisra\'el, and presenting my supplication before the LORD my God for the holy mountain of my God;";
vul[20] = "Cumque adhuc loquerer, et orarem, et confiterer peccata mea, et peccata populi mei Israel, et prosternerem preces meas in conspectu Dei mei, pro monte sancto Dei mei:";
rsv[21] = "while I was speaking in prayer, the man Gabriel, whom I had seen in the vision at the first, came to me in swift flight at the time of the evening sacrifice.";
asv[21] = "yea, while I was speaking in prayer, the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation.";
yng[21] = "yea, while I am speaking in prayer, then that one Gabriel, whom I had seen in vision at the commencement, being caused to fly swiftly, is coming unto me at the time of the evening present.";
dby[21] = "whilst I was yet speaking in prayer, the man Gabriel, whom I had seen in the vision at the beginning, flying swiftly, touched me about the time of the evening oblation.";
web[21] = "Yes, while I [was] speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation.";
hnv[21] = "yes, while I was speaking in prayer, the man Gavri\'el, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening offering.";
vul[21] = "Adhuc me loquente in oratione, ecce vir Gabriel, quem videram in visione a principio, cito volans tetigit me in tempore sacrificii vespertini.";
rsv[22] = "He came and he said to me, &quot;O Daniel, I have now come out to give you wisdom and understanding.";
asv[22] = "And he instructed me, and talked with me, and said, O Daniel, I am now come forth to give thee wisdom and understanding.";
yng[22] = "And he giveth understanding, and speaketh with me, and saith, `O Daniel, now I have come forth to cause thee to consider understanding wisely;";
dby[22] = "And he informed [me], and talked with me, and said, Daniel, I am now come forth to make thee skilful of understanding.";
web[22] = "And he informed [me], and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding.";
hnv[22] = "He instructed me, and talked with me, and said, Daniyel, I am now come forth to give you wisdom and understanding.";
vul[22] = "Et docuit me, et locutus est mihi, dixitque: Daniel nunc egressus sum ut docerem te, et intelligeres.";
rsv[23] = "At the beginning of your supplications a word went forth, and I have come to tell it to you, for you are greatly beloved; therefore consider the word and understand the vision.";
asv[23] = "At the beginning of thy supplications the commandment went forth, and I am come to tell thee; for thou art greatly beloved: therefore consider the matter, and understand the vision.";
yng[23] = "at the commencement of thy supplications hath the word come forth, and I have come to declare [it], for thou [art] greatly desired, and understand thou concerning the matter, and consider concerning the appearance.";
dby[23] = "At the beginning of thy supplications the word went forth, and I am come to declare [it]; for thou art one greatly beloved. Therefore consider the word, and have understanding in the vision:";
web[23] = "At the beginning of thy supplications the commandment came forth, and I am come to show [thee]; for thou [art] greatly beloved: therefore understand the matter, and consider the vision.";
hnv[23] = "At the beginning of your petitions the mitzvah went forth, and I am come to tell you; for you are greatly beloved: therefore consider the matter, and understand the vision.";
vul[23] = "Ab exordio precum tuarum egressus est sermo: ego autem veni ut indicarem tibi, quia vir desideriorum es: tu ergo animadverte sermonem, et intellige visionem.";
rsv[24] = "&quot;Seventy weeks of years are decreed concerning your people and your holy city, to finish the transgression, to put an end to sin, and to atone for iniquity, to bring in everlasting righteousness, to seal both vision and prophet, and to anoint a most holy place.";
asv[24] = "Seventy weeks are decreed upon thy people and upon thy holy city, to finish transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up vision and prophecy, and to anoint the most holy.";
yng[24] = "`Seventy weeks are determined for thy people, and for thy holy city, to shut up the transgression, and to seal up sins, and to cover iniquity, and to bring in righteousness age-during, and to seal up vision and prophet, and to anoint the holy of holies.";
dby[24] = "Seventy weeks are apportioned out upon thy people and upon thy holy city, to close the transgression, and to make an end of sins, and to make expiation for iniquity, and to bring in the righteousness of the ages, and to seal the vision and prophet, and to anoint the holy of holies.";
web[24] = "Seventy weeks are determined upon thy people and upon thy holy city to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy.";
hnv[24] = "Seventy weeks are decreed on your people and on your holy city, to finish disobedience, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up vision and prophecy, and to anoint the most holy.";
vul[24] = "(r) Septuaginta hebdomades abbreviatae sunt super populum tuum, et super urbem sanctam tuam ut consummetur praevaricatio, et finem accipiat peccatum, et deleatur iniquitas, et adducatur iustitia sempiterna, et impleatur visio, et prophetia, et ungatur Sanctus sanctorum.";
rsv[25] = "Know therefore and understand that from the going forth of the word to restore and build Jerusalem to the coming of an anointed one, a prince, there shall be seven weeks. Then for sixty-two weeks it shall be built again with squares and moat, but in a troubled time.";
asv[25] = "Know therefore and discern, that from the going forth of the commandment to restore and to build Jerusalem unto the anointed one, the prince, shall be seven weeks, and threescore and two weeks: it shall be built again, with street and moat, even in troublous times.";
yng[25] = "And thou dost know, and dost consider wisely, from the going forth of the word to restore and to build Jerusalem till Messiah the Leader [is] seven weeks, and sixty and two weeks: the broad place hath been built again, and the rampart, even in the distress of the times.";
dby[25] = "Know therefore and understand: From the going forth of the word to restore and to build Jerusalem unto Messiah, the Prince, are seven weeks, and sixty-two weeks. The street and the moat shall be built again, even in troublous times.";
web[25] = "Know therefore and understand, [that] from the going forth of the commandment to restore and to build Jerusalem to the Messiah the Prince [shall be] seven weeks, and sixty and two weeks: the street shall be built again, and the wall, even in troublous times.";
hnv[25] = " Know therefore and discern, that from the going forth of the mitzvah to restore and to build Yerushalayim to the Messiah the prince, shall be seven weeks, and sixty-two weeks: it shall be built again, with street and moat, even in troubled times.";
vul[25] = "Scito ergo, et animadverte: Ab exitu sermonis, ut iterum aedificetur Ierusalem, usque ad Christum ducem, hebdomades septem, et hebdomades sexaginta duae erunt: et rursum aedificabitur platea, et muri in angustia temporum.";
rsv[26] = "And after the sixty-two weeks, an anointed one shall be cut off, and shall have nothing; and the people of the prince who is to come shall destroy the city and the sanctuary. Its end shall come with a flood, and to the end there shall be war; desolations are decreed.";
asv[26] = "And after the threescore and two weeks shall the anointed one be cut off, and shall have nothing: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and even unto the end shall be war; desolations are determined.";
yng[26] = "And after the sixty and two weeks, cut off is Messiah, and the city and the holy place are not his, the Leader who hath come doth destroy the people; and its end [is] with a flood, and till the end [is] war, determined [are] desolations.";
dby[26] = "And after the sixty-two weeks shall Messiah be cut off, and shall have nothing; and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with an overflow, and unto the end, war, -- the desolations determined.";
web[26] = "And after sixty and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and its end [shall be] with a flood, and to the end of the war desolations are determined.";
hnv[26] = "After the sixty-two weeks the Anointed One shall be cut off, and shall have nothing: and the people of the prince who shall come shall destroy the city and the sanctuary; and the end of it shall be with a flood, and even to the end shall be war; desolations are determined.";
vul[26] = "Et post hebdomades sexaginta duas occidetur Christus: et non erit eius populus, qui eum negaturus est. Et civitatem, et sanctuarium dissipabit populus cum duce venturo: et finis eius vastitas, et post finem belli statuta desolatio.";
rsv[27] = "And he shall make a strong covenant with many for one week; and for half of the week he shall cause sacrifice and offering to cease; and upon the wing of abominations shall come one who makes desolate, until the decreed end is poured out on the desolator.&quot;";
asv[27] = "And he shall make a firm covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease; and upon the wing of abominations [shall come] one that maketh desolate; and even unto the full end, and that determined, shall [wrath] be poured out upon the desolate.";
yng[27] = "And he hath strengthened a covenant with many -- one week, and [in] the midst of the week he causeth sacrifice and present to cease, and by the wing of abominations he is making desolate, even till the consummation, and that which is determined is poured on the desolate one.\'";
dby[27] = "And he shall confirm a covenant with the many [for] one week; and in the midst of the week he shall cause the sacrifice and the oblation to cease, and because of the protection of abominations [there shall be] a desolator, even until that the consumption and what is determined shall be poured out upon the desolate.";
web[27] = "And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations, he shall make [it] desolate, even until the consummation, and that determined shall be poured upon the desolate.";
hnv[27] = "He shall make a firm covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the offering to cease; and on the wing of abominations [shall come] one who makes desolate; and even to the full end, and that determined, shall [wrath] be poured out on the desolate.";
vul[27] = "Confirmabit autem pactum multis hebdomada una: et in dimidio hebdomadis deficiet hostia et sacrificium: (s) et erit in templo abominatio desolationis: et usque ad consummationem et finem perseverabit desolatio.";
</script>
