csb[1] = "King Belshazzar held a great feast for a thousand of his nobles and drank wine in their presence.";
csb[2] = "Under the influence of the wine, Belshazzar gave orders to bring in the gold and silver vessels that his predecessor Nebuchadnezzar had taken from the temple in Jerusalem, so that the king and his nobles, wives, and concubines could drink from them.";
csb[3] = "So they brought in the gold vessels that had been taken from the temple, the house of God in Jerusalem, and the king and his nobles, wives, and concubines drank from them.";
csb[4] = "They drank the wine and praised their gods made of gold and silver, bronze, iron, wood, and stone.";
csb[5] = "At that moment the fingers of a man\'s hand appeared and began writing on the plaster of the king\'s palace wall next to the lampstand. As the king watched the hand that was writing,";
csb[6] = "his face turned pale, and his thoughts so terrified him that he soiled himself and his knees knocked together.";
csb[7] = "The king shouted to bring in the mediums, Chaldeans, and diviners. He said to these wise men of Babylon, &quot;Whoever reads this inscription and gives me its interpretation will be clothed in purple, have a gold chain around his neck, and have the third highest position in the kingdom.&quot;";
csb[8] = "So all the king\'s wise men came in, but none could read the inscription or make its interpretation known to him.";
csb[9] = "Then King Belshazzar became even more terrified, his face turned pale, and his nobles were bewildered.";
csb[10] = "Because of the outcry of the king and his nobles, the queen came to the banquet hall. &quot;May the king live forever,&quot; she said. &quot;Don\'t let your thoughts terrify you or your face be pale.";
csb[11] = "&quot;There is a man in your kingdom who has a spirit of the holy gods in him. In the days of your predecessor he was found to have insight, intelligence, and wisdom like the wisdom of the gods. Your predecessor, King Nebuchadnezzar, appointed him chief of the magicians, mediums, Chaldeans, and diviners. Your own predecessor, the king,";
csb[12] = "&quot;did this because Daniel, the one the king named Belteshazzar, was found to have an extraordinary spirit, knowledge and intelligence, and the ability to interpret dreams, explain riddles, and solve problems. Therefore, summon Daniel, and he will give the interpretation.&quot;";
csb[13] = "Then Daniel was brought before the king. The king said to him, &quot;Are you Daniel, one of the Judean exiles that my predecessor the king brought from Judah?";
csb[14] = "&quot;I\'ve heard that you have a spirit of the gods in you, and that insight, intelligence, and extraordinary wisdom are found in you.";
csb[15] = "&quot;Now the wise men and mediums were brought before me to read this inscription and make its interpretation known to me, but they could not give its interpretation.";
csb[16] = "&quot;However, I have heard about you that you can give interpretations and solve problems. Therefore, if you can read this inscription and give me its interpretation, you will be clothed in purple, have a gold chain around your neck, and have the third highest position in the kingdom.&quot;";
csb[17] = "Then Daniel answered the king, &quot;You may keep your gifts and give your rewards to someone else; however, I will read the inscription for the king and make the interpretation known to him.";
csb[18] = "&quot;Your Majesty, the Most High God gave sovereignty, greatness, glory, and majesty to your predecessor Nebuchadnezzar.";
csb[19] = "&quot;Because of the greatness he gave him, all peoples, nations, and languages were terrified and fearful of him. He killed anyone he wanted and kept alive anyone he wanted; he exalted anyone he wanted and humbled anyone he wanted.";
csb[20] = "&quot;But when his heart was exalted and his spirit became arrogant, he was deposed from his royal throne and his glory was taken from him.";
csb[21] = "&quot;He was driven away from people, his mind was like an animal\'s, he lived with the wild donkeys, he was fed grass like cattle, and his body was drenched with dew from the sky until he acknowledged that the Most High God is ruler over human kingdoms and sets anyone he wants over them.";
csb[22] = "&quot;But you his successor, Belshazzar, have not humbled your heart, even though you knew all this.";
csb[23] = "&quot;Instead, you have exalted yourself against the Lord of the heavens. The vessels from his house were brought to you, and as you and your nobles, wives, and concubines drank wine from them, you praised the gods made of silver and gold, bronze, iron, wood, and stone, which do not see or hear or understand. But you have not glorified the God who holds your life-breath in his hand and who controls the whole course of your life.";
csb[24] = "&quot;Therefore, he sent the hand, and this writing was inscribed.";
csb[25] = "&quot;This is the writing that was inscribed: MENE, MENE, TEKEL, and PARSIN.";
csb[26] = "&quot;This is the interpretation of the message: \'Mene\' means that God has numbered the days of your kingdom and brought it to an end.";
csb[27] = "&quot;\'Tekel\' means that you have been weighed on the balance and found deficient.";
csb[28] = "&quot;\'Peres\' means that your kingdom has been divided and given to the Medes and Persians.&quot;";
csb[29] = "Then Belshazzar gave an order, and they clothed Daniel in purple, placed a gold chain around his neck, and issued a proclamation concerning him that he should be the third ruler in the kingdom.";
csb[30] = "That very night Belshazzar the king of the Chaldeans was killed,";
csb[31] = "and Darius the Mede received the kingdom at the age of sixty-two.";
kjv[1] = "Belshazzar the king made a great feast to a thousand of his lords, and drank wine before the thousand.";
rsv[1] = "King Belshaz\'zar made a great feast for a thousand of his lords, and drank wine in front of the thousand.";
asv[1] = "Belshazzar the king made a great feast to a thousand of his lords, and drank wine before the thousand.";
yng[1] = "Belshazzar the king hath made a great feast to a thousand of his great men, and before the thousand he is drinking wine;";
dby[1] = "Belshazzar the king made a great feast to a thousand of his nobles, and drank wine before the thousand.";
web[1] = "Belshazzar the king made a great feast to a thousand of his lords, and drank wine before the thousand.";
hnv[1] = "Belshatztzar the king made a great feast to a thousand of his lords, and drank wine before the thousand.";
vul[1] = "Baltassar rex fecit grande convivium optimatibus suis mille: et unusquisque secundum suam bibebat aetatem.";
kjv[2] = "Belshazzar, whiles he tasted the wine, commanded to bring the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which [was] in Jerusalem; that the king, and his princes, his wives, and his concubines, might drink therein.";
rsv[2] = "Belshaz\'zar, when he tasted the wine, commanded that the vessels of gold and of silver which Nebuchadnez\'zar his father had taken out of the temple in Jerusalem be brought, that the king and his lords, his wives, and his concubines might drink from them.";
asv[2] = "Belshazzar, while he tasted the wine, commanded to bring the golden and silver vessels which Nebuchadnezzar his father had taken out of the temple which was in Jerusalem; that the king and his lords, his wives and his concubines, might drink therefrom.";
yng[2] = "Belshazzar hath said -- while tasting the wine -- to bring in the vessels of gold and of silver that Nebuchadnezzar his father had taken from the temple that [is] in Jerusalem, that drink with them may the king, and his great men, his wives, and his concubines.";
dby[2] = "Belshazzar, while he tasted the wine, commanded to bring the golden and silver vessels that Nebuchadnezzar his father had taken out of the temple which was in Jerusalem; that the king and his nobles, his wives and his concubines, might drink in them.";
web[2] = "Belshazzar, while he tasted the wine, commanded to bring the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which [was] in Jerusalem; that the king, and his princes, his wives, and his concubines, might drink in them.";
hnv[2] = "Belshatztzar, while he tasted the wine, commanded to bring the golden and silver vessels which Nevukhadnetztzar his father had taken out of the temple which was in Yerushalayim; that the king and his lords, his wives and his concubines, might drink from it.";
vul[2] = "Praecepit ergo iam temulentus ut afferrentur vasa aurea et argentea, quae asportaverat Nabuchodonosor pater eius de templo, quod fuit in Ierusalem, ut biberent in eis rex, et optimates eius, uxoresque eius, et concubinae.";
kjv[3] = "Then they brought the golden vessels that were taken out of the temple of the house of God which [was] at Jerusalem; and the king, and his princes, his wives, and his concubines, drank in them.";
rsv[3] = "Then they brought in the golden and silver vessels which had been taken out of the temple, the house of God in Jerusalem; and the king and his lords, his wives, and his concubines drank from them.";
asv[3] = "Then they brought the golden vessels that were taken out of the temple of the house of God which was at Jerusalem; and the king and his lords, his wives and his concubines, drank from them.";
yng[3] = "Then they have brought in the vessels of gold that had been taken out of the temple of the house of God that [is] in Jerusalem, and drunk with them have the king and his great men, his wives and his concubines;";
dby[3] = "Then they brought the golden vessels that were taken out of the temple of the house of God which was at Jerusalem; and the king and his nobles, his wives and his concubines, drank in them.";
web[3] = "Then they brought the golden vessels that were taken out of the temple of the house of God which [was] at Jerusalem; and the king, and his princes, his wives, and his concubines, drank in them.";
hnv[3] = "Then they brought the golden vessels that were taken out of the temple of the house of God which was at Yerushalayim; and the king and his lords, his wives and his concubines, drank from them.";
vul[3] = "Tunc allata sunt vasa aurea, et argentea, quae asportaverat de templo, quod fuerat in Ierusalem: et biberunt in eis rex, et optimates eius, uxores et concubinae illius.";
kjv[4] = "They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.";
rsv[4] = "They drank wine, and praised the gods of gold and silver, bronze, iron, wood, and stone.";
asv[4] = "They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.";
yng[4] = "they have drunk wine, and have praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.";
dby[4] = "They drank wine, and praised the gods of gold and of silver, of brass, of iron, of wood, and of stone.";
web[4] = "They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.";
hnv[4] = "They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.";
vul[4] = "Bibebant vinum, et laudabant deos suos aureos, et argenteos, aereos, ferreos, ligneosque et lapideos.";
kjv[5] = "In the same hour came forth fingers of a man\'s hand, and wrote over against the candlestick upon the plaister of the wall of the king\'s palace: and the king saw the part of the hand that wrote.";
rsv[5] = "Immediately the fingers of a man\'s hand appeared and wrote on the plaster of the wall of the king\'s palace, opposite the lampstand; and the king saw the hand as it wrote.";
asv[5] = "In the same hour came forth the fingers of a man\'s hand, and wrote over against the candlestick upon the plaster of the wall of the king\'s palace: and the king saw the part of the hand that wrote.";
yng[5] = "In that hour come forth have fingers of a man\'s hand, and they are writing over-against the candlestick, on the plaster of the wall of the king\'s palace: and the king is seeing the extremity of the hand that is writing;";
dby[5] = "In the same hour came forth fingers of a man\'s hand, and wrote over against the candlestick upon the plaster of the wall of the king\'s palace: and the king saw the part of the hand that wrote.";
web[5] = "In the same hour came forth fingers of a man\'s hand, and wrote over against the candlestick upon the plaster of the wall of the king\'s palace: and the king saw the part of the hand that wrote.";
hnv[5] = "In the same hour came forth the fingers of a man\'s hand, and wrote over against the menorah on the plaster of the wall of the king\'s palace: and the king saw the part of the hand that wrote.";
vul[5] = "In eadem hora apparuerunt digiti, quasi manus hominis scribentis contra candelabrum in superficie parietis aulae regiae: et rex aspiciebat articulos manus scribentis.";
kjv[6] = "Then the king\'s countenance was changed, and his thoughts troubled him, so that the joints of his loins were loosed, and his knees smote one against another.";
rsv[6] = "Then the king\'s color changed, and his thoughts alarmed him; his limbs gave way, and his knees knocked together.";
asv[6] = "Then the king\'s countenance was changed in him, and his thoughts troubled him; and the joints of his loins were loosed, and his knees smote one against another.";
yng[6] = "then the king\'s countenance hath changed, and his thoughts do trouble him, and the joints of his loins are loosed, and his knees are smiting one against another.";
dby[6] = "Then the king\'s countenance was changed, and his thoughts troubled him, and the joints of his loins were loosed, and his knees smote one against another.";
web[6] = "Then the king\'s countenance was changed, and his thoughts troubled him, so that the joints of his loins were loosed, and his knees smote one against another.";
hnv[6] = "Then the king\'s face was changed in him, and his thoughts troubled him; and the joints of his loins were loosened, and his knees struck one against another.";
vul[6] = "Tunc facies regis commutata est, et cogitationes eius conturbabant eum: et compages renum eius solvebantur, et genua eius ad seinvicem collidebantur.";
kjv[7] = "The king cried aloud to bring in the astrologers, the Chaldeans, and the soothsayers. [And] the king spake, and said to the wise [men] of Babylon, Whosoever shall read this writing, and shew me the interpretation thereof, shall be clothed with scarlet, and [have] a chain of gold about his neck, and shall be the third ruler in the kingdom.";
rsv[7] = "The king cried aloud to bring in the enchanters, the Chalde\'ans, and the astrologers. The king said to the wise men of Babylon, &quot;Whoever reads this writing, and shows me its interpretation, shall be clothed with purple, and have a chain of gold about his neck, and shall be the third ruler in the kingdom.&quot;";
asv[7] = "The king cried aloud to bring in the enchanters, the Chaldeans, and the soothsayers. The king spake and said to the wise men of Babylon, Whosoever shall read this writing, and show me the interpretation thereof, shall be clothed with purple, and have a chain of gold about his neck, and shall be the third ruler in the kingdom.";
yng[7] = "Call doth the king mightily, to bring up the enchanters, the Chaldeans, and the soothsayers. Answered hath the king, and said to the wise men of Babylon, that, `Any man who doth read this writing, and its interpretation doth shew me, purple he putteth on, and a bracelet of gold [is] on his neck, and third in the kingdom he doth rule.\'";
dby[7] = "The king cried aloud to bring in the magicians, the Chaldeans, and the astrologers. The king spoke and said to the wise men of Babylon, Whosoever shall read this writing, and shew me the interpretation thereof, shall be clothed with purple, and have a chain of gold about his neck, and shall be the third ruler in the kingdom.";
web[7] = "The king cried aloud to bring in the astrologers, the Chaldeans, and the sooth-sayers. [And] the king spoke and said to the wise [men] of Babylon, Whoever shall read this writing, and show me the interpretation of it, shall be clothed with scarlet, and [have] a chain of gold about his neck, and shall be the third ruler in the kingdom.";
hnv[7] = "The king cried aloud to bring in the enchanters, the Kasdim, and the soothsayers. The king spoke and said to the wise men of Bavel, Whoever shall read this writing, and show me the interpretation of it, shall be clothed with purple, and have a chain of gold about his neck, and shall be the third ruler in the kingdom.";
vul[7] = "Exclamavit itaque rex fortiter ut introducerent magos, Chaldaeos, et aruspices. Et proloquens rex ait sapientibus Babylonis: Quicumque legerit scripturam hanc, et interpretationem eius manifestam mihi fecerit, purpura vestietur, et torquem auream habebit in collo, et tertius in regno meo erit.";
kjv[8] = "Then came in all the king\'s wise [men]: but they could not read the writing, nor make known to the king the interpretation thereof.";
rsv[8] = "Then all the king\'s wise men came in, but they could not read the writing or make known to the king the interpretation.";
asv[8] = "Then came in all the king\'s wise men; but they could not read the writing, nor make known to the king the interpretation.";
yng[8] = "Then coming up are all the wise men of the king, and they are not able to read the writing, and the interpretation to make known to the king;";
dby[8] = "Then came in all the king\'s wise men, but they could not read the writing, nor make known to the king the interpretation.";
web[8] = "Then came in all the king\'s wise [men]: but they could not read the writing, nor make known to the king the interpretation of it.";
hnv[8] = "Then came in all the king\'s wise men; but they could not read the writing, nor make known to the king the interpretation.";
vul[8] = "Tunc ingressi omnes sapientes regis non potuerunt nec scripturam legere, nec interpretationem indicare regi.";
kjv[9] = "Then was king Belshazzar greatly troubled, and his countenance was changed in him, and his lords were astonied.";
rsv[9] = "Then King Belshaz\'zar was greatly alarmed, and his color changed; and his lords were perplexed.";
asv[9] = "Then was king Belshazzar greatly troubled, and his countenance was changed in him, and his lords were perplexed.";
yng[9] = "then the king Belshazzar is greatly troubled, and his countenance is changing in him, and his great men are perplexed.";
dby[9] = "Then was king Belshazzar greatly troubled, and his countenance was changed in him, and his nobles were confounded.";
web[9] = "Then was the king Belshazzar greatly troubled, and his countenance was changed in him, and his lords were astonished.";
hnv[9] = "Then was king Belshatztzar greatly troubled, and his face was changed in him, and his lords were perplexed.";
vul[9] = "Unde rex Baltassar satis conturbatus est, et vultus illius immutatus est. sed et optimates eius turbabantur.";
kjv[10] = "[Now] the queen, by reason of the words of the king and his lords, came into the banquet house: [and] the queen spake and said, O king, live for ever: let not thy thoughts trouble thee, nor let thy countenance be changed:";
rsv[10] = "The queen, because of the words of the king and his lords, came into the banqueting hall; and the queen said, &quot;O king, live for ever! Let not your thoughts alarm you or your color change.";
asv[10] = "[Now] the queen by reason of the words of the king and his lords came into the banquet house: the queen spake and said, O king, live forever; let not thy thoughts trouble thee, nor let thy countenance be changed.";
yng[10] = "The queen, on account of the words of the king and his great men, to the banquet-house hath come up. Answered hath the queen, and said, `O king, to the ages live; let not thy thoughts trouble thee, nor thy countenance be changed:";
dby[10] = "-- The queen, by reason of the words of the king and his nobles, came into the banquet-house. The queen spoke and said, O king, live for ever! let not thy thoughts trouble thee, neither let thy countenance be changed.";
web[10] = "[Now] the queen by reason of the words of the king and his lords came into the banquet house: [and] the queen spoke and said, O king, live for ever: let not thy thoughts trouble thee, nor let thy countenance be changed:";
hnv[10] = "[Now] the queen by reason of the words of the king and his lords came into the banquet house: the queen spoke and said, O king, live forever; don\'t let your thoughts trouble you, nor let your face be changed.";
vul[10] = "Regina autem pro re, quae acciderat regi, et optimatibus eius, domum convivii ingressa est: et proloquens ait: Rex in aeternum vive: non te conturbent cogitationes tuae, neque facies tua immutetur.";
kjv[11] = "There is a man in thy kingdom, in whom [is] the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, was found in him; whom the king Nebuchadnezzar thy father, the king, [I say], thy father, made master of the magicians, astrologers, Chaldeans, [and] soothsayers;";
rsv[11] = "There is in your kingdom a man in whom is the spirit of the holy gods. In the days of your father light and understanding and wisdom, like the wisdom of the gods, were found in him, and King Nebuchadnez\'zar, your father, made him chief of the magicians, enchanters, Chalde\'ans, and astrologers,";
asv[11] = "There is a man in thy kingdom, in whom is the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, were found in him; and the king Nebuchadnezzar thy father, the king, [I say], thy father, made him master of the magicians, enchanters, Chaldeans, and soothsayers;";
yng[11] = "there is a man in thy kingdom in whom [is] the spirit of the holy gods: and, in the days of thy father, light, and understanding, and wisdom -- as the wisdom of the gods -- was found in him; and king Nebuchadnezzar thy father, chief of the scribes, enchanters, Chaldeans, soothsayers, established him -- thy father, O king --";
dby[11] = "There is a man in thy kingdom in whom is the spirit of the holy gods; and in the days of thy father, light and understanding and wisdom, like the wisdom of the gods was found in him; and the king Nebuchadnezzar thy father, [even] the king thy father, made him master of the scribes, magicians, Chaldeans, [and] astrologers;";
web[11] = "There is a man in thy kingdom, in whom [is] the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, was found in him; whom the king Nebuchadnezzar thy father, the king, [I say], thy father, made master of the magicians, astrologers, Chaldeans, [and] sooth-sayers;";
hnv[11] = "There is a man in your kingdom, in whom is the spirit of the holy gods; and in the days of your father light and understanding and wisdom, like the wisdom of the gods, were found in him; and the king Nevukhadnetztzar your father, the king, [I say], your father, made him master of the magicians, enchanters, Kasdim, and soothsayers;";
vul[11] = "Est vir in regno tuo, qui spiritum deorum sanctorum habet in se: et in diebus patris tui scientia et sapientia inventae sunt in eo: nam et rex Nabuchodonosor pater tuus principem magorum, incantatorum, Chaldaeorum, et aruspicum constituit eum, pater, inquam, tuus, o rex:";
kjv[12] = "Forasmuch as an excellent spirit, and knowledge, and understanding, interpreting of dreams, and shewing of hard sentences, and dissolving of doubts, were found in the same Daniel, whom the king named Belteshazzar: now let Daniel be called, and he will shew the interpretation.";
rsv[12] = "because an excellent spirit, knowledge, and understanding to interpret dreams, explain riddles, and solve problems were found in this Daniel, whom the king named Belteshaz\'zar. Now let Daniel be called, and he will show the interpretation.&quot;";
asv[12] = "forasmuch as an excellent spirit, and knowledge, and understanding, interpreting of dreams, and showing of dark sentences, and dissolving of doubts, were found in the same Daniel, whom the king named Belteshazzar. Now let Daniel be called, and he will show the interpretation.";
yng[12] = "because that an excellent spirit, and knowledge, and understanding, interpreting of dreams, and showing of enigmas, and loosing of knots was found in him, in Daniel, whose name the king made Belteshazzar: now let Daniel be called, and the interpretation he doth show.\'";
dby[12] = "forasmuch as an excellent spirit, and knowledge, and understanding, interpreting of dreams, and shewing of hard sentences, and solving of problems, were found in the same Daniel, whom the king named Belteshazzar. Now let Daniel be called, and he will shew the interpretation.";
web[12] = "Forasmuch as an excellent spirit, and knowledge, and understanding, the interpreting of dreams, and showing of hard sentences, and dissolving of doubts, were found in the same Daniel, whom the king named Belteshazzar: now let Daniel be called, and he will show the interpretation.";
hnv[12] = "because an excellent spirit, and knowledge, and understanding, interpreting of dreams, and showing of dark sentences, and dissolving of doubts, were found in the same Daniyel, whom the king named Belteshatztzar. Now let Daniyel be called, and he will show the interpretation.";
vul[12] = "quia spiritus amplior, et prudentia, intelligentiaque et interpretatio somniorum, et ostensio secretorum, ac solutio ligatorum inventae sunt in eo, hoc est in Daniele: cui rex posuit nomen Baltassar. nunc itaque Daniel vocetur, et interpretationem narrabit.";
kjv[13] = "Then was Daniel brought in before the king. [And] the king spake and said unto Daniel, [Art] thou that Daniel, which [art] of the children of the captivity of Judah, whom the king my father brought out of Jewry?";
rsv[13] = "Then Daniel was brought in before the king. The king said to Daniel, &quot;You are that Daniel, one of the exiles of Judah, whom the king my father brought from Judah.";
asv[13] = "Then was Daniel brought in before the king. The king spake and said unto Daniel, Art thou that Daniel, who art of the children of the captivity of Judah, whom the king my father brought out of Judah?";
yng[13] = "Then Daniel hath been caused to come up before the king; answered hath the king, and said to Daniel, `Thou art that Daniel who [art] of the sons of the Removed of Judah, whom the king my father brought in out of Judah?";
dby[13] = "Then was Daniel brought in before the king. The king spoke and said unto Daniel, Art thou that Daniel, of the children of the captivity of Judah, whom the king my father brought out of Judah?";
web[13] = "Then was Daniel brought in before the king. [And] the king spoke and said to Daniel, [Art] thou that Daniel, who [art] of the children of the captivity of Judah, whom the king my father brought out of Judea?";
hnv[13] = "Then was Daniyel brought in before the king. The king spoke and said to Daniyel, Are you that Daniyel, who are of the children of the captivity of Yehudah, whom the king my father brought out of Yehudah?";
vul[13] = "Igitur introductus est Daniel coram rege. Ad quem praefatus rex ait: Tu es Daniel de filiis captivitatis Iudae, quem adduxit pater meus rex de Iudaea?";
kjv[14] = "I have even heard of thee, that the spirit of the gods [is] in thee, and [that] light and understanding and excellent wisdom is found in thee.";
rsv[14] = "I have heard of you that the spirit of the holy gods is in you, and that light and understanding and excellent wisdom are found in you.";
asv[14] = "I have heard of thee, that the spirit of the gods is in thee, and that light and understanding and excellent wisdom are found in thee.";
yng[14] = "And I have heard of thee, that the spirit of the gods [is] in thee, and light, and understanding, and excellent wisdom have been found in thee.";
dby[14] = "And I have heard of thee, that the spirit of the gods is in thee, and [that] light and understanding and excellent wisdom is found in thee.";
web[14] = "I have even heard of thee, that the spirit of the gods [is] in thee, and [that] light and understanding and excellent wisdom is found in thee.";
hnv[14] = "I have heard of you, that the spirit of the gods is in you, and that light and understanding and excellent wisdom are found in you.";
vul[14] = "Audivi de te quoniam spiritum deorum habeas: et scientia, intelligentiaque ac sapientia ampliores inventae sunt in te.";
kjv[15] = "And now the wise [men], the astrologers, have been brought in before me, that they should read this writing, and make known unto me the interpretation thereof: but they could not shew the interpretation of the thing:";
rsv[15] = "Now the wise men, the enchanters, have been brought in before me to read this writing and make known to me its interpretation; but they could not show the interpretation of the matter.";
asv[15] = "And now the wise men, the enchanters, have been brought in before me, that they should read this writing, and make known unto me the interpretation thereof; but they could not show the interpretation of the thing.";
yng[15] = "`And now, caused to come up before me have been the wise men, the enchanters, that this writing they may read, and its interpretation to cause me to know: and they are not able to shew the interpretation of the thing:";
dby[15] = "And now the wise men, the magicians, have been brought in before me, that they should read this writing, and make known unto me the interpretation thereof; but they could not shew the interpretation of the thing.";
web[15] = "And now the wise [men], the astrologers, have been brought in before me, that they should read this writing, and make known to me the interpretation of it, but they could not show the interpretation of the thing:";
hnv[15] = "Now the wise men, the enchanters, have been brought in before me, that they should read this writing, and make known to me the interpretation of it; but they could not show the interpretation of the thing.";
vul[15] = "Et nunc introgressi sunt in conspectu meo sapientes magi, ut scripturam hanc legerent, et interpretationem eius indicarent mihi: et nequiverunt sensum huius sermonis edicere.";
kjv[16] = "And I have heard of thee, that thou canst make interpretations, and dissolve doubts: now if thou canst read the writing, and make known to me the interpretation thereof, thou shalt be clothed with scarlet, and [have] a chain of gold about thy neck, and shalt be the third ruler in the kingdom.";
rsv[16] = "But I have heard that you can give interpretations and solve problems. Now if you can read the writing and make known to me its interpretation, you shall be clothed with purple, and have a chain of gold about your neck, and shall be the third ruler in the kingdom.";
asv[16] = "But I have heard of thee, that thou canst give interpretations, and dissolve doubts: now if thou canst read the writing, and make known to me the interpretation thereof, thou shalt be clothed with purple, and have a chain of gold about thy neck, and shalt be the third ruler in the kingdom.";
yng[16] = "and I -- I have heard of thee, that thou art able to give interpretations, and to loose knots: now, lo -- thou art able to read the writing, and its interpretation to cause me to know -- purple thou dost put on, and a bracelet of gold [is] on thy neck, and third in the kingdom thou dost rule.\'";
dby[16] = "But I have heard of thee, that thou canst give interpretations, and solve problems. Now if thou canst read the writing, and make known to me the interpretation thereof, thou shalt be clothed with purple, and have a chain of gold about thy neck, and shalt be the third ruler in the kingdom.";
web[16] = "And I have heard of thee, that thou canst make interpretations, and dissolve doubts: now if thou canst read the writing, and make known to me the interpretation of it, thou shalt be clothed with scarlet, and [have] a chain of gold about thy neck, and shalt be the third ruler in the kingdom.";
hnv[16] = "But I have heard of you, that you can give interpretations, and dissolve doubts; now if you can read the writing, and make known to me the interpretation of it, you shall be clothed with purple, and have a chain of gold about your neck, and shall be the third ruler in the kingdom.";
vul[16] = "Porro ego audivi de te, quod possis obscura interpretari, et ligata dissolvere: si ergo vales scripturam legere, et interpretationem eius indicare mihi, purpura vestieris, et torquem auream circa collum tuum habebis, et tertius in regno meo princeps eris.";
kjv[17] = "Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; yet I will read the writing unto the king, and make known to him the interpretation.";
rsv[17] = "Then Daniel answered before the king, &quot;Let your gifts be for yourself, and give your rewards to another; nevertheless I will read the writing to the king and make known to him the interpretation.";
asv[17] = "Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; nevertheless I will read the writing unto the king, and make known to him the interpretation.";
yng[17] = "Then hath Daniel answered and said before the king, `Thy gifts be to thyself, and thy fee to another give; nevertheless, the writing I do read to the king, and the interpretation I cause him to know;";
dby[17] = "Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; yet will I read the writing to the king, and make known to him the interpretation.";
web[17] = "Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; yet I will read the writing to the king, and make known to him the interpretation.";
hnv[17] = "Then Daniyel answered before the king, Let your gifts be to yourself, and give your rewards to another; nevertheless I will read the writing to the king, and make known to him the interpretation.";
vul[17] = "Ad quae respondens Daniel, ait coram rege: Munera tua sint tibi, et dona domus tuae alteri da: scripturam autem legam tibi, rex, et interpretationem eius ostendam tibi.";
kjv[18] = "O thou king, the most high God gave Nebuchadnezzar thy father a kingdom, and majesty, and glory, and honour:";
rsv[18] = "O king, the Most High God gave Nebuchadnez\'zar your father kingship and greatness and glory and majesty;";
asv[18] = "O thou king, the Most High God gave Nebuchadnezzar thy father the kingdom, and greatness, and glory, and majesty:";
yng[18] = "thou, O king, God Most High, a kingdom, and greatness, and glory, and honour, gave to Nebuchadnezzar thy father:";
dby[18] = "O thou king, the Most High God gave Nebuchadnezzar thy father the kingdom, and greatness, and glory, and majesty;";
web[18] = "O thou king, the most high God gave Nebuchadnezzar thy father a kingdom, and majesty, and glory, and honor:";
hnv[18] = "You king, Ha`Elyon God gave Nevukhadnetztzar your father the kingdom, and greatness, and glory, and majesty:";
vul[18] = "O rex, Deus altissimus regnum, et magnificentiam, gloriam, et honorem dedit Nabuchodonosor patri tuo.";
kjv[19] = "And for the majesty that he gave him, all people, nations, and languages, trembled and feared before him: whom he would he slew; and whom he would he kept alive; and whom he would he set up; and whom he would he put down.";
rsv[19] = "and because of the greatness that he gave him, all peoples, nations, and languages trembled and feared before him; whom he would he slew, and whom he would he kept alive; whom he would he raised up, and whom he would he put down.";
asv[19] = "and because of the greatness that he gave him, all the peoples, nations, and languages trembled and feared before him: whom he would he slew, and whom he would he kept alive; and whom he would he raised up, and whom he would he put down.";
yng[19] = "and because of the greatness that He gave to him, all peoples, nations, and languages were trembling and fearing before him: whom he willed he was slaying, and whom he willed he was keeping alive, and whom he willed he was raising up, and whom he willed he was making low;";
dby[19] = "and for the greatness that he gave him, all peoples, nations, and languages, trembled and feared before him: whom he would he slew, and whom he would he kept alive; and whom he would he exalted, and whom he would he humbled.";
web[19] = "And for the majesty that he gave him, all people, nations, and languages, trembled and feared before him: whom he would he slew; and whom he would he kept alive; and whom he would he set up; and whom he would he put down.";
hnv[19] = "and because of the greatness that he gave him, all the peoples, nations, and languages trembled and feared before him: whom he would he killed, and whom he would he kept alive; and whom he would he raised up, and whom he would he put down.";
vul[19] = "Et propter magnificentiam, quam dederat ei, universi populi, tribus, et linguae tremebant, et metuebant eum: quos volebat, interficiebat: et quos volebat, percutiebat: et quos volebat, exaltabat: et quos volebat, humiliabat.";
kjv[20] = "But when his heart was lifted up, and his mind hardened in pride, he was deposed from his kingly throne, and they took his glory from him:";
rsv[20] = "But when his heart was lifted up and his spirit was hardened so that he dealt proudly, he was deposed from his kingly throne, and his glory was taken from him;";
asv[20] = "But when his heart was lifted up, and his spirit was hardened so that he dealt proudly, he was deposed from his kingly throne, and they took his glory from him:";
yng[20] = "and when his heart was high, and his spirit was strong to act proudly, he hath been caused to come down from the throne of his kingdom, and his glory they have caused to pass away from him,";
dby[20] = "But when his heart was lifted up, and his spirit hardened unto presumption, he was deposed from the throne of his kingdom, and they took his glory from him;";
web[20] = "But when his heart was lifted up, and his mind hardened in pride, he was deposed from his kingly throne, and they took his glory from him:";
hnv[20] = "But when his heart was lifted up, and his spirit was hardened so that he dealt proudly, he was deposed from his kingly throne, and they took his glory from him:";
vul[20] = "Quando autem elevatum est cor eius, et spiritus illius obfirmatus est ad superbiam, depositus est de solio regni sui, et gloria eius ablata est:";
kjv[21] = "And he was driven from the sons of men; and his heart was made like the beasts, and his dwelling [was] with the wild asses: they fed him with grass like oxen, and his body was wet with the dew of heaven; till he knew that the most high God ruled in the kingdom of men, and [that] he appointeth over it whomsoever he will.";
rsv[21] = "he was driven from among men, and his mind was made like that of a beast, and his dwelling was with the wild asses; he was fed grass like an ox, and his body was wet with the dew of heaven, until he knew that the Most High God rules the kingdom of men, and sets over it whom he will.";
asv[21] = "and he was driven from the sons of men, and his heart was made like the beasts\', and his dwelling was with the wild asses; he was fed with grass like oxen, and his body was wet with the dew of heaven; until he knew that the Most High God ruleth in the kingdom of men, and that he setteth up over it whomsoever he will.";
yng[21] = "and from the sons of men he is driven, and his heart with the beasts hath been like, and with the wild asses [is] his dwelling; the herb like oxen they cause him to eat, and by the dew of the heavens is his body wet, till that he hath known that God Most High is ruler in the kingdom of men, and whom He willeth He raiseth up over it.";
dby[21] = "and he was driven from the sons of men, and his heart was made like the beasts, and his dwelling was with the wild asses; they fed him with grass like oxen, and his body was bathed with the dew of heaven; till he knew that the Most High God ruleth over the kingdom of men, and that he appointeth over it whomsoever he will.";
web[21] = "And he was driven from the sons of men; and his heart was made like the beasts, and his dwelling [was] with the wild asses: they fed him with grass like oxen, and his body was wet with the dew of heaven; till he knew that the most high God ruleth in the kingdom of men, and [that] he appointeth over it whomsoever he will.";
hnv[21] = "and he was driven from the sons of men, and his heart was made like the animals\', and his dwelling was with the wild donkeys; he was fed with grass like oxen, and his body was wet with the dew of the sky; until he knew that Ha`Elyon God rules in the kingdom of men, and that he sets up over it whoever he will.";
vul[21] = "(g) et a filiis hominum eiectus est, sed et cor eius cum bestiis positum est, et cum onagris erat habitatio eius: foenum quoque ut bos comedebat, et rore caeli corpus eius infectum est, donec cognosceret quod potestatem haberet Altissimus in regno hominum: et quemcumque voluerit, suscitabit super illud.";
kjv[22] = "And thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this;";
rsv[22] = "And you his son, Belshaz\'zar, have not humbled your heart, though you knew all this,";
asv[22] = "And thou his son, O Belshazzar, hast not humbled thy heart, though thou knewest all this,";
yng[22] = "`And thou, his son, Belshazzar, hast not humbled thy heart, though all this thou hast known;";
dby[22] = "And thou, Belshazzar, his son, hast not humbled thy heart, although thou knewest all this;";
web[22] = "And thou his son, O Belshazzar, hast not humbled thy heart, though thou knewest all this;";
hnv[22] = "You his son, Belshatztzar, have not humbled your heart, though you knew all this,";
vul[22] = "Tu quoque filius eius Baltassar, non humiliasti cor tuum, cum scires haec omnia:";
kjv[23] = "But hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou, and thy lords, thy wives, and thy concubines, have drunk wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know: and the God in whose hand thy breath [is], and whose [are] all thy ways, hast thou not glorified:";
rsv[23] = "but you have lifted up yourself against the Lord of heaven; and the vessels of his house have been brought in before you, and you and your lords, your wives, and your concubines have drunk wine from them; and you have praised the gods of silver and gold, of bronze, iron, wood, and stone, which do not see or hear or know, but the God in whose hand is your breath, and whose are all your ways, you have not honored.";
asv[23] = "but hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou and thy lords, thy wives and thy concubines, have drunk wine from them; and thou hast praised the gods of silver and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know; and the God in whose hand thy breath is, and whose are all thy ways, hast thou not glorified.";
yng[23] = "and against the Lord of the heavens thou hast lifted up thyself; and the vessels of His house they have brought in before thee, and thou, and thy great men, thy wives, and thy concubines, are drinking wine with them, and gods of silver, and of gold, of brass, of iron, of wood, and of stone, that are not seeing, nor hearing, nor knowing, thou hast praised: and the God in whose hand [is] thy breath, and all thy ways, Him thou hast not honoured.";
dby[23] = "but hast lifted up thyself against the Lord of the heavens; and they have brought the vessels of his house before thee, and thou and thy nobles, thy wives and thy concubines, have drunk wine in them; and thou hast praised the gods of silver and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know; and the God in whose hand thy breath is, and whose are all thy ways, hast thou not glorified:";
web[23] = "But hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou, and thy lords, thy wives, and thy concubines, have drank wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know: and the God in whose hand thy breath [is], and whose [are] all thy ways, thou hast not glorified.";
hnv[23] = "but have lifted up yourself against the Lord of heaven; and they have brought the vessels of his house before you, and you and your lords, your wives and your concubines, have drunk wine from them; and you have praised the gods of silver and gold, of brass, iron, wood, and stone, which don\'t see, nor hear, nor know; and the God in whose hand your breath is, and whose are all your ways, you have not glorified.";
vul[23] = "sed adversum Dominatorem caeli elevatus es: et vasa domus eius allata sunt coram te: et tu, et optimates tui, et uxores tuae, et concubinae tuae vinum bibistis in eis: deos quoque argenteos, et aureos, et aereos, ferreos, ligneosque et lapideos, qui non vident, neque audiunt, neque sentiunt, laudasti: porro Deum, qui habet flatum tuum in manu sua, et omnes vias tuas, non glorificasti.";
kjv[24] = "Then was the part of the hand sent from him; and this writing was written.";
rsv[24] = "&quot;Then from his presence the hand was sent, and this writing was inscribed.";
asv[24] = "Then was the part of the hand sent from before him, and this writing was inscribed.";
yng[24] = "`Then from before Him sent is the extremity of the hand, and the writing is noted down;";
dby[24] = "then from before him was sent the part of the hand, and this writing hath been written.";
web[24] = "Then was the part of the hand sent from him; and this writing was written.";
hnv[24] = "Then was the part of the hand sent from before him, and this writing was inscribed.";
vul[24] = "Idcirco ab eo missus est articulus manus, quae scripsit hoc, quod exaratum est.";
kjv[25] = "And this [is] the writing that was written, MENE, MENE, TEKEL, UPHARSIN.";
rsv[25] = "And this is the writing that was inscribed: MENE, MENE, TEKEL, and PARSIN.";
asv[25] = "And this is the writing that was inscribed: MENE, MENE, TEKEL, UPHARSIN.";
yng[25] = "and this [is] the writing that is noted down: Numbered, Numbered, Weighed, and Divided.";
dby[25] = "And this is the writing that is written: MENE, MENE, TEKEL, UPHARSIN.";
web[25] = "And this [is] the writing that was written, MENE, MENE, TEKEL, UPHARSIN.";
hnv[25] = "This is the writing that was inscribed: MENE, MENE, TEKEL, UFARSIN.";
vul[25] = "Haec est autem scriptura, quae digesta est: MANE, THECEL, PHARES.";
kjv[26] = "This [is] the interpretation of the thing: MENE; God hath numbered thy kingdom, and finished it.";
rsv[26] = "This is the interpretation of the matter: MENE, God has numbered the days of your kingdom and brought it to an end;";
asv[26] = "This is the interpretation of the thing: MENE; God hath numbered thy kingdom, and brought it to an end.";
yng[26] = "This [is] the interpretation of the thing: Numbered -- God hath numbered thy kingdom, and hath finished it.";
dby[26] = "This is the interpretation of the thing: MENE, God hath numbered thy kingdom, and finished it;";
web[26] = "This [is] the interpretation of the thing: MENE; God hath numbered thy kingdom, and finished it.";
hnv[26] = "This is the interpretation of the thing: MENE; God has numbered your kingdom, and brought it to an end;";
vul[26] = "Et haec est interpretatio sermonis. MANE: numeravit Deus regnum tuum, et complevit illud.";
kjv[27] = "TEKEL; Thou art weighed in the balances, and art found wanting.";
rsv[27] = "TEKEL, you have been weighed in the balances and found wanting;";
asv[27] = "TEKEL; thou art weighed in the balances, and art found wanting.";
yng[27] = "Weighed -- Thou art weighed in the balances, and hast been found lacking.";
dby[27] = "TEKEL, Thou art weighed in the balances, and art found wanting;";
web[27] = "TEKEL; Thou art weighed in the balances, and art found wanting.";
hnv[27] = "TEKEL; you are weighed in the balances, and are found wanting.";
vul[27] = "THECEL: appensus es in statera, et inventus es minus habens.";
kjv[28] = "PERES; Thy kingdom is divided, and given to the Medes and Persians.";
rsv[28] = "PERES, your kingdom is divided and given to the Medes and Persians.&quot;";
asv[28] = "PERES; thy kingdom is divided, and given to the Medes and Persians.";
yng[28] = "Divided -- Divided is thy kingdom, and it hath been given to the Medes and Persians.\'";
dby[28] = "PERES, Thy kingdom is divided, and given to the Medes and Persians.";
web[28] = "PERES; Thy kingdom is divided, and given to the Medes and Persians.";
hnv[28] = "PERES; your kingdom is divided, and given to the Madai and Paras.";
vul[28] = "PHARES: divisum est regnum tuum, et datum est Medis, et Persis.";
kjv[29] = "Then commanded Belshazzar, and they clothed Daniel with scarlet, and [put] a chain of gold about his neck, and made a proclamation concerning him, that he should be the third ruler in the kingdom.";
rsv[29] = "Then Belshaz\'zar commanded, and Daniel was clothed with purple, a chain of gold was put about his neck, and proclamation was made concerning him, that he should be the third ruler in the kingdom.";
asv[29] = "Then commanded Belshazzar, and they clothed Daniel with purple, and put a chain of gold about his neck, and made proclamation concerning him, that he should be the third ruler in the kingdom.";
yng[29] = "Then hath Belshazzar said, and they have clothed Daniel with purple, and a bracelet of gold [is] on his neck, and they have proclaimed concerning him that he is the third ruler in the kingdom.";
dby[29] = "Then Belshazzar commanded, and they clothed Daniel with purple, and [put] a chain of gold about his neck, and made proclamation concerning him that he should be the third ruler in the kingdom.";
web[29] = "Then commanded Belshazzar, and they clothed Daniel with scarlet, and [put] a chain of gold about his neck, and made a proclamation concerning him, that he should be the third ruler in the kingdom.";
hnv[29] = "Then commanded Belshatztzar, and they clothed Daniyel with purple, and put a chain of gold about his neck, and made proclamation concerning him, that he should be the third ruler in the kingdom.";
vul[29] = "Tunc iubente rege indutus est Daniel purpura, et circumdata est torques aurea collo eius: et praedicatum est de eo quod haberet potestatem tertius in regno suo.";
kjv[30] = "In that night was Belshazzar the king of the Chaldeans slain.";
rsv[30] = "That very night Belshaz\'zar the Chalde\'an king was slain.";
asv[30] = "In that night Belshazzar the Chaldean King was slain.";
yng[30] = "In that night Belshazzar king of the Chaldeans is slain,";
dby[30] = "In that night was Belshazzar the king of the Chaldeans slain.";
web[30] = "In that night was Belshazzar the king of the Chaldeans slain.";
hnv[30] = "In that night Belshatztzar the Kasdai King was slain.";
vul[30] = "Eadem nocte interfectus est Baltassar rex Chaldaeus.";
kjv[31] = "And Darius the Median took the kingdom, [being] about threescore and two years old.";
rsv[31] = "And Darius the Mede received the kingdom, being about sixty-two years old.";
asv[31] = "And Darius the Mede received the kingdom, being about threescore and two years old.";
yng[31] = "and Darius the Mede hath received the kingdom, when a son of sixty and two years.";
dby[31] = "And Darius the Mede received the kingdom, [being] about sixty-two years old.";
web[31] = "And Darius the Median took the kingdom, [being] about sixty and two years old.";
hnv[31] = "Daryavesh the Madian received the kingdom, being about sixty-two years old.";
vul[31] = "Et Darius Medus successit in regnum annos natus sexagintaduos.";
