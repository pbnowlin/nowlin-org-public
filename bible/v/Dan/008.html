csb[1] = "In the third year of King Belshazzar\'s reign, a vision appeared to me, Daniel, after the one that had appeared to me earlier.";
csb[2] = "I saw the vision, and as I watched, I was in the fortress city of Susa, in the province of Elam. I saw in the vision that I was beside the Ulai Canal.";
csb[3] = "I looked up, and there was a ram standing beside the canal. He had two horns. The two horns were long, but one was longer than the other, and the longer one came up last.";
csb[4] = "I saw the ram charging to the west, the north, and the south. No animal could stand against him, and there was no rescue from his power. He did whatever he wanted and became great.";
csb[5] = "As I was observing, a male goat appeared, coming from the west across the surface of the entire earth without touching the ground. The goat had a conspicuous horn between his eyes.";
csb[6] = "He came toward the two-horned ram I had seen standing beside the canal and rushed at him with savage fury.";
csb[7] = "I saw him approaching the ram, and infuriated with him, he struck the ram, breaking his two horns, and the ram was not strong enough to stand against him. The goat threw him to the ground and trampled him, and there was no one to rescue the ram from his power.";
csb[8] = "Then the male goat acted even more arrogantly, but when he became powerful, the large horn was broken. Four conspicuous horns came up in its place, pointing toward the four winds of heaven.";
csb[9] = "From one of them a little horn emerged and grew extensively toward the south and the east and toward the beautiful land.";
csb[10] = "It grew as high as the heavenly army, made some of the army and some of the stars fall to the earth, and trampled them.";
csb[11] = "It acted arrogantly even against the Prince of the heavenly army; it revoked his regular sacrifice and overthrew the place of his sanctuary.";
csb[12] = "In the rebellion, the army was given up, together with the regular sacrifice. The horn threw truth to the ground and was successful in what it did.";
csb[13] = "Then I heard a holy one speaking, and another holy one said to the speaker, &quot;How long will the events of this vision last -- the regular sacrifice, the rebellion that makes desolate, and the giving over of the sanctuary and of the army to be trampled? &quot;";
csb[14] = "He said to me, &quot;For 2,300 evenings and mornings; then the sanctuary will be restored.&quot;";
csb[15] = "While I, Daniel, was watching the vision and trying to understand it, there stood before me someone who appeared to be a man.";
csb[16] = "I heard a human voice calling from the middle of the Ulai: &quot;Gabriel, explain the vision to this man.&quot;";
csb[17] = "So he approached where I was standing; when he came near, I was terrified and fell facedown. &quot;Son of man,&quot; he said to me, &quot;understand that the vision refers to the time of the end.&quot;";
csb[18] = "While he was speaking to me, I fell into a deep sleep, with my face to the ground. Then he touched me, made me stand up,";
csb[19] = "and said, &quot;I am here to tell you what will happen at the conclusion of the time of wrath, because it refers to the appointed time of the end.";
csb[20] = "&quot;The two-horned ram that you saw represents the kings of Media and Persia.";
csb[21] = "&quot;The shaggy goat represents the king of Greece, and the large horn between his eyes represents the first king.";
csb[22] = "&quot;The four horns that took the place of the broken horn represent four kingdoms. They will rise from that nation, but without its power.";
csb[23] = "&quot;Near the end of their kingdoms, when the rebels have reached the full measure of their sin, a ruthless king, skilled in intrigue, will come to the throne.";
csb[24] = "&quot;His power will be great, but it will not be his own. He will cause outrageous destruction and succeed in whatever he does. He will destroy the powerful along with the holy people.";
csb[25] = "&quot;He will cause deceit to prosper through his cunning and by his influence, and in his own mind he will exalt himself. He will destroy many in a time of peace; he will even stand against the Prince of princes. Yet he will be broken -- not by human hands.";
csb[26] = "&quot;The vision of the evenings and the mornings that has been told is true. Now you are to seal up the vision because it refers to many days in the future.&quot;";
csb[27] = "I, Daniel, was overcome and lay sick for days. Then I got up and went about the king\'s business. I was greatly disturbed by the vision and could not understand it.";
kjv[1] = "In the third year of the reign of king Belshazzar a vision appeared unto me, [even unto] me Daniel, after that which appeared unto me at the first.";

yng[1] = "`In the third year of the reign of Belshazzar the king, a vision hath appeared unto me -- I Daniel -- after that which had appeared unto me at the beginning.";
dby[1] = "In the third year of the reign of Belshazzar the king, a vision appeared unto me, [even] to me Daniel, after that which appeared unto me at the first.";
web[1] = "In the third year of the reign of king Belshazzar a vision appeared to me, [even to] me, Daniel, after that which appeared to me at the first.";
hnv[1] = "In the third year of the reign of king Belshatztzar a vision appeared to me, even to me, Daniyel, after that which appeared to me at the first.";
vul[1] = "Anno tertio regni Baltassar regis, visio apparuit mihi. Ego Daniel post id, quod videram in principio,";
kjv[2] = "And I saw in a vision; and it came to pass, when I saw, that I [was] at Shushan [in] the palace, which [is] in the province of Elam; and I saw in a vision, and I was by the river of Ulai.";

asv[2] = "And I saw in the vision; now it was so, that when I saw, I was in Shushan the palace, which is in the province of Elam; and I saw in the vision, and I was by the river Ulai.";
yng[2] = "And I see in a vision, and it cometh to pass, in my seeing, and I [am] in Shushan the palace that [is] in Elam the province, and I see in a vision, and I have been by the stream Ulai.";
dby[2] = "And I saw in the vision; and it came to pass, when I saw, that I was in the fortress of Shushan, which is in the province of Elam. And I saw in the vision, and I was by the river Ulai.";
web[2] = "And I saw in a vision; and it came to pass, when I saw, that I [was] at Shushan [in] the palace, which [is] in the province of Elam; and I saw in a vision, and I was by the river Ulai.";
hnv[2] = "I saw in the vision; now it was so, that when I saw, I was in Shushan the palace, which is in the province of `Elam; and I saw in the vision, and I was by the river Ulai.";
vul[2] = "vidi in visione mea, cum essem in Susis castro, quod est in Aelam regione: vidi autem in visione esse me super portam Ulai.";
kjv[3] = "Then I lifted up mine eyes, and saw, and, behold, there stood before the river a ram which had [two] horns: and the [two] horns [were] high; but one [was] higher than the other, and the higher came up last.";
rsv[3] = "I raised my eyes and saw, and behold, a ram standing on the bank of the river. It had two horns; and both horns were high, but one was higher than the other, and the higher one came up last.";
asv[3] = "Then I lifted up mine eyes, and saw, and, behold, there stood before the river a ram which had two horns: and the two horns were high; but one was higher than the other, and the higher came up last.";
yng[3] = "And I lift up mine eyes, and look, and lo, a certain ram is standing before the stream, and it hath two horns, and the two horns [are] high; and the one [is] higher than the other, and the high one is coming up last.";
dby[3] = "And I lifted up mine eyes and saw, and behold, there stood before the river a ram which had two horns; and the two horns were high; and one was higher than the other, and the higher came up last.";
web[3] = "Then I lifted up my eyes, and saw, and behold, there stood before the river a ram which had [two] horns: and the [two] horns [were] high; but one [was] higher than the other, and the higher came up last.";
hnv[3] = "Then I lifted up my eyes, and saw, and, behold, there stood before the river a ram which had two horns: and the two horns were high; but one was higher than the other, and the higher came up last.";
vul[3] = "Et lavavi oculus meos, et vidi: et ecce aries unus stabat ante paludem, habens cornua excelsa, et unum excelsius altero atque succrescens. Postea";
kjv[4] = "I saw the ram pushing westward, and northward, and southward; so that no beasts might stand before him, neither [was there any] that could deliver out of his hand; but he did according to his will, and became great.";
rsv[4] = "I saw the ram charging westward and northward and southward; no beast could stand before him, and there was no one who could rescue from his power; he did as he pleased and magnified himself.";
asv[4] = "I saw the ram pushing westward, and northward, and southward; and no beasts could stand before him, neither was there any that could deliver out of his hand; but he did according to his will, and magnified himself.";
yng[4] = "I have seen the ram pushing westward, and northward, and southward, and no living creatures do stand before it, and there is none delivering out of its hand, and it hath done according to its pleasure, and hath exerted itself.";
dby[4] = "I saw the ram pushing westward, and northward, and southward, and no beast could stand before him, neither was there any that could deliver out of his hand; and he did according to his will, and became great.";
web[4] = "I saw the ram pushing westward, and northward, and southward; so that no beasts might stand before him, neither [was there any] that could deliver out of his hand; but he did according to his will, and became great.";
hnv[4] = "I saw the ram pushing westward, and northward, and southward; and no animals could stand before him, neither was there any who could deliver out of his hand; but he did according to his will, and magnified himself.";
vul[4] = "vidi arietem cornibus ventilantem contra Occidentem, et contra Aquilonem, et contra Meridiem, et omnes bestiae non poterant resistere ei, neque liberari de manu eius: fecitque secundum voluntatem suam, et magnificatus est.";
kjv[5] = "And as I was considering, behold, an he goat came from the west on the face of the whole earth, and touched not the ground: and the goat [had] a notable horn between his eyes.";
rsv[5] = "As I was considering, behold, a he-goat came from the west across the face of the whole earth, without touching the ground; and the goat had a conspicuous horn between his eyes.";
asv[5] = "And as I was considering, behold, a he-goat came from the west over the face of the whole earth, and touched not the ground: and the goat had a notable horn between his eyes.";
yng[5] = "`And I have been considering, and lo, a young he-goat hath come from the west, over the face of the whole earth, whom none is touching in the earth; as to the young he-goat, a conspicuous horn [is] between its eyes.";
dby[5] = "And as I was considering, behold, a he-goat came from the west over the face of the whole earth, and touched not the ground: and the goat had a notable horn between his eyes.";
web[5] = "And as I was considering, behold, a he-goat came from the west on the face of the whole earth, and touched not the ground: and the goat [had] a notable horn between his eyes.";
hnv[5] = "As I was considering, behold, a male goat came from the west over the surface of the whole eretz, and didn\'t touch the ground: and the goat had a notable horn between his eyes.";
vul[5] = "Et ego intelligebam: ecce autem hircus caprarum veniebat ab Occidente super faciem totius terrae, et non tangebat terram: porro hircus habebat cornu insigne inter oculos suos.";
kjv[6] = "And he came to the ram that had [two] horns, which I had seen standing before the river, and ran unto him in the fury of his power.";
rsv[6] = "He came to the ram with the two horns, which I had seen standing on the bank of the river, and he ran at him in his mighty wrath.";
asv[6] = "And he came to the ram that had the two horns, which I saw standing before the river, and ran upon him in the fury of his power.";
yng[6] = "And it cometh unto the ram possessing the two horns, that I had seen standing before the stream, and runneth unto it in the fury of its power.";
dby[6] = "And he came to the ram that had the two horns, which I had seen standing before the river, and ran upon him in the fury of his power.";
web[6] = "And he came to the ram that had [two] horns, which I had seen standing before the river, and ran to him in the fury of his power.";
hnv[6] = "He came to the ram that had the two horns, which I saw standing before the river, and ran on him in the fury of his power.";
vul[6] = "Et venit usque ad arietem illum cornutum, quem videram stantem ante portam, et cucurrit ad eum in impetu fortitudinis suae.";
kjv[7] = "And I saw him come close unto the ram, and he was moved with choler against him, and smote the ram, and brake his two horns: and there was no power in the ram to stand before him, but he cast him down to the ground, and stamped upon him: and there was none that could deliver the ram out of his hand.";
rsv[7] = "I saw him come close to the ram, and he was enraged against him and struck the ram and broke his two horns; and the ram had no power to stand before him, but he cast him down to the ground and trampled upon him; and there was no one who could rescue the ram from his power.";
asv[7] = "And I saw him come close unto the ram, and he was moved with anger against him, and smote the ram, and brake his two horns; and there was no power in the ram to stand before him; but he cast him down to the ground, and trampled upon him; and there was none that could deliver the ram out of his hand.";
yng[7] = "And I have seen it coming near the ram, and it becometh embittered at it, and smiteth the ram, and breaketh its two horns, and there hath been no power in the ram to stand before it, and it casteth it to the earth, and trampleth it down, and there hath been no deliverer to the ram out of its power.";
dby[7] = "And I saw him come close to the ram, and he was enraged with him, and smote the ram, and broke his two horns; and there was no power in the ram to stand before him; and he cast him down to the ground, and trampled upon him; and there was none that could deliver the ram out of his hand.";
web[7] = "And I saw him come close to the ram, and he was moved with anger against him, and smote the ram, and broke his two horns: and there was no power in the ram to stand before him, but he cast him down to the ground, and stamped upon him: and there was none that could deliver the ram out of his hand.";
hnv[7] = "I saw him come close to the ram, and he was moved with anger against him, and struck the ram, and broke his two horns; and there was no power in the ram to stand before him; but he cast him down to the ground, and trampled on him; and there was none who could deliver the ram out of his hand.";
vul[7] = "Cumque appropinquasset prope arietem, efferatus est in eum, et percussit arietem: et comminuit duo cornua eius, et non poterat aries resistere ei: cumque eum misisset in terram, conculcavit, et nemo quibat liberare arietem de manu eius.";
kjv[8] = "Therefore the he goat waxed very great: and when he was strong, the great horn was broken; and for it came up four notable ones toward the four winds of heaven.";
rsv[8] = "Then the he-goat magnified himself exceedingly; but when he was strong, the great horn was broken, and instead of it there came up four conspicuous horns toward the four winds of heaven.";
asv[8] = "And the he-goat magnified himself exceedingly: and when he was strong, the great horn was broken; and instead of it there came up four notable [horns] toward the four winds of heaven.";
yng[8] = "`And the young he-goat hath exerted itself very much, and when it is strong, broken hath been the great horn; and come up doth a vision of four in its place, at the four winds of the heavens.";
dby[8] = "And the he-goat became exceeding great; but when he was become strong, the great horn was broken; and in its stead came up four notable ones toward the four winds of the heavens.";
web[8] = "Therefore the he-goat became very great: and when he was strong, the great horn was broken; and in its stead came up four notable ones towards the four winds of heaven.";
hnv[8] = "The male goat magnified himself exceedingly: and when he was strong, the great horn was broken; and instead of it there came up four notable [horns] toward the four winds of the sky.";
vul[8] = "Hircus autem caprarum magnus factus est nimis: cumque crevisset, fractum est cornu magnum, et orta sunt quattour cornua subter illud per quattuor ventos caeli.";
kjv[9] = "And out of one of them came forth a little horn, which waxed exceeding great, toward the south, and toward the east, and toward the pleasant [land].";
rsv[9] = "Out of one of them came forth a little horn, which grew exceedingly great toward the south, toward the east, and toward the glorious land.";
asv[9] = "And out of one of them came forth a little horn, which waxed exceeding great, toward the south, and toward the east, and toward the glorious [land].";
yng[9] = "And from the one of them come forth hath a little horn, and it exerteth itself greatly toward the south, and toward the east, and toward the beauteous [land];";
dby[9] = "And out of one of them came forth a little horn, which became exceeding great, toward the south, and toward the east, and toward the beauty [of the earth].";
web[9] = "And out of one of them came forth a little horn, which became exceeding great, towards the south, and towards the east, and towards the pleasant [land].";
hnv[9] = "Out of one of them came forth a little horn, which grew exceeding great, toward the south, and toward the east, and toward the glorious [land].";
vul[9] = "De uno autem ex eis egressum est cornu unum modicum: et factum est grande contra Meridiem, et contra Orientem, et contra fortitudinem.";

rsv[10] = "It grew great, even to the host of heaven; and some of the host of the stars it cast down to the ground, and trampled upon them.";
asv[10] = "And it waxed great, even to the host of heaven; and some of the host and of the stars it cast down to the ground, and trampled upon them.";
yng[10] = "yea, it exerteth unto the host of the heavens, and causeth to fall to the earth of the host, and of the stars, and trampleth them down.";
dby[10] = "And it became great, even to the host of heaven; and it cast down [some] of the host and of the stars to the ground, and trampled upon them.";
web[10] = "And it grew great, [even] to the host of heaven; and it cast down [some] of the host and of the stars to the ground, and stamped upon them.";
hnv[10] = "It grew great, even to the host of the sky; and some of the host and of the stars it cast down to the ground, and trampled on them.";
vul[10] = "Et magnificatum est usque ad fortitudinem caeli: et deiecit de fortitudine, et de stellis, et conculcavit eas.";
kjv[11] = "Yea, he magnified [himself] even to the prince of the host, and by him the daily [sacrifice] was taken away, and the place of his sanctuary was cast down.";
rsv[11] = "It magnified itself, even up to the Prince of the host; and the continual burnt offering was taken away from him, and the place of his sanctuary was overthrown.";
asv[11] = "Yea, it magnified itself, even to the prince of the host; and it took away from him the continual [burnt-offering], and the place of his sanctuary was cast down.";
yng[11] = "And unto the prince of the host it exerteth itself, and by it taken away hath been the continual [sacrifice], and thrown down the base of his sanctuary.";
dby[11] = "(And he magnified [himself] even to the prince of the host, and from him the continual [sacrifice] was taken away, and the place of his sanctuary was cast down.";
web[11] = "Yes, he magnified [himself] even to the prince of the host, and by him the daily [sacrifice] was taken away, and the place of his sanctuary was cast down.";
hnv[11] = "Yes, it magnified itself, even to the prince of the host; and it took away from him the continual [burnt offering], and the place of his sanctuary was cast down.";
vul[11] = "Et usque ad principem fortitudinis magnificatum est: et ab eo tulit iuge sacrificium, et deiecit locum sanctificationis eius.";
kjv[12] = "And an host was given [him] against the daily [sacrifice] by reason of transgression, and it cast down the truth to the ground; and it practised, and prospered.";
rsv[12] = "And the host was given over to it together with the continual burnt offering through transgression; and truth was cast down to the ground, and the horn acted and prospered.";
asv[12] = "And the host was given over [to it] together with the continual [burnt-offering] through transgression; and it cast down truth to the ground, and it did [its pleasure] and prospered.";
yng[12] = "And the host is given up, with the continual [sacrifice], through transgression, and it throweth down truth to the earth, and it hath worked, and prospered.";
dby[12] = "And a time of trial was appointed unto the continual [sacrifice] by reason of transgression.) And it cast down the truth to the ground; and it practised and prospered.";
web[12] = "And a host was given [him] against the daily [sacrifice] by reason of transgression, and it cast down the truth to the ground; and it practiced, and prospered.";
hnv[12] = " The host was given over [to it] together with the continual [burnt offering] through disobedience; and it cast down truth to the ground, and it did [its pleasure] and prospered.";
vul[12] = "Robur autem datum est ei contra iuge sacrificium propter peccata: et prosternetur veritas in terra, et faciet, et prosperabitur.";
kjv[13] = "Then I heard one saint speaking, and another saint said unto that certain [saint] which spake, How long [shall be] the vision [concerning] the daily [sacrifice], and the transgression of desolation, to give both the sanctuary and the host to be trodden under foot?";
rsv[13] = "Then I heard a holy one speaking; and another holy one said to the one that spoke, &quot;For how long is the vision concerning the continual burnt offering, the transgression that makes desolate, and the giving over of the sanctuary and host to be trampled under foot?&quot;";
asv[13] = "Then I heard a holy one speaking; and another holy one said unto that certain one who spake, How long shall be the vision [concerning] the continual [burnt-offering], and the transgression that maketh desolate, to give both the sanctuary and the host to be trodden under foot?";
yng[13] = "`And I hear a certain holy one speaking, and a certain holy one saith to the wonderful numberer who is speaking: Till when [is] the vision of the continual [sacrifice], and of the transgression, an astonishment, to make both sanctuary and host a treading down?";
dby[13] = "And I heard one saint speaking, and another saint said unto that one who spoke, How long shall be the vision of the continual [sacrifice] and of the transgression that maketh desolate, to give both the sanctuary and the host to be trodden down under foot?";
web[13] = "Then I heard one saint speaking, and another saint said to that certain [saint] who spoke, How long [shall be] the vision [concerning] the daily [sacrifice], and the transgression of desolation, to give both the sanctuary and the host to be trodden under foot?";
hnv[13] = "Then I heard a holy one speaking; and another holy one said to that certain one who spoke, How long shall be the vision [concerning] the continual [burnt-offering], and the disobedience that makes desolate, to give both the sanctuary and the host to be trodden under foot?";
vul[13] = "Et audivi unum de sanctis loquentem: et dixit unus sanctus alteri nescio cui loquenti: Usquequo visio, et iuge sacrificium, et peccatum desolationis, quae facta est: et sanctuarium, et fortitudo conculcabitur?";
kjv[14] = "And he said unto me, Unto two thousand and three hundred days; then shall the sanctuary be cleansed.";
rsv[14] = "And he said to him, &quot;For two thousand and three hundred evenings and mornings; then the sanctuary shall be restored to its rightful state.&quot;";
asv[14] = "And he said unto me, Unto two thousand and three hundred evenings [and] mornings; then shall the sanctuary be cleansed.";
yng[14] = "And he saith unto me, Till evening -- morning two thousand and three hundred, then is the holy place declared right.";
dby[14] = "And he said unto me, Until two thousand and three hundred evenings [and] mornings: then shall the sanctuary be vindicated.";
web[14] = "And he said to me, Until two thousand and three hundred days; then shall the sanctuary be cleansed.";
hnv[14] = "He said to me, To two thousand and three hundred evenings [and] mornings; then shall the sanctuary be cleansed.";
vul[14] = "Et dixit ei: Usque ad vesperam at mane, dies duo millia trecenti: et mundabitur sanctuarium.";
kjv[15] = "And it came to pass, when I, [even] I Daniel, had seen the vision, and sought for the meaning, then, behold, there stood before me as the appearance of a man.";
rsv[15] = "When I, Daniel, had seen the vision, I sought to understand it; and behold, there stood before me one having the appearance of a man.";
asv[15] = "And it came to pass, when I, even I Daniel, had seen the vision, that I sought to understand it; and, behold, there stood before me as the appearance of a man.";
yng[15] = "`And it cometh to pass in my seeing -- I, Daniel -- the vision, that I require understanding, and lo, standing over-against me [is] as the appearance of a mighty one.";
dby[15] = "And it came to pass, when I Daniel had seen the vision, I sought for the understanding of it, and behold, there stood before me as the appearance of a man.";
web[15] = "And it came to pass, when I, [even] I Daniel, had seen the vision, and sought for the meaning, then behold, there stood before me as the appearance of a man.";
hnv[15] = "It happened, when I, even I Daniyel, had seen the vision, that I sought to understand it; and, behold, there stood before me as the appearance of a man.";
vul[15] = "Factum est autem cum viderem ego Daniel visionem, et quaererem intelligentiam: ecce stetit in conspectu meo quasi species viri.";
kjv[16] = "And I heard a man\'s voice between [the banks of] Ulai, which called, and said, Gabriel, make this [man] to understand the vision.";
rsv[16] = "And I heard a man\'s voice between the banks of the U\'lai, and it called, &quot;Gabriel, make this man understand the vision.&quot;";
asv[16] = "And I heard a man\'s voice between [the banks of] the Ulai, which called, and said, Gabriel, make this man to understand the vision.";
yng[16] = "And I hear a voice of man between [the banks of] Ulai, and he calleth and saith: Gabriel, cause this [one] to understand the appearance.";
dby[16] = "And I heard a man\'s voice between [the banks of] the Ulai; and he called and said, Gabriel, make this [man] to understand the vision.";
web[16] = "And I heard a man\'s voice between [the banks of] Ulai, which called, and said, Gabriel, make this [man] to understand the vision.";
hnv[16] = "I heard a man\'s voice between [the banks of] the Ulai, which called, and said, Gavri\'el, make this man to understand the vision.";
vul[16] = "Et audivi vocem viri inter Ulai: et clamavit, et ait: Gabriel fac intelligere istum visionem.";
kjv[17] = "So he came near where I stood: and when he came, I was afraid, and fell upon my face: but he said unto me, Understand, O son of man: for at the time of the end [shall be] the vision.";
rsv[17] = "So he came near where I stood; and when he came, I was frightened and fell upon my face. But he said to me, &quot;Understand, O son of man, that the vision is for the time of the end.&quot;";
asv[17] = "So he came near where I stood; and when he came, I was affrighted, and fell upon my face: but he said unto me, Understand, O son of man; for the vision belongeth to the time of the end.";
yng[17] = "And he cometh in near my station, and at his coming in I have been afraid, and I fall on my face, and he saith unto me: Understand, son of man, for at the time of the end [is] the vision.";
dby[17] = "And he came near where I stood; and when he came, I was afraid, and fell on my face; and he said unto me, Understand, son of man; for the vision is for the time of the end.";
web[17] = "So he came near where I stood: and when he came, I was afraid, and fell upon my face: but he said to me, Understand, O son of man: for at the time of the end [shall be] the vision.";
hnv[17] = "So he came near where I stood; and when he came, I was frightened, and fell on my face: but he said to me, Understand, son of man; for the vision belongs to the time of the end.";
vul[17] = "Et venit, et stetit iuxta ubi ego stabam: cumque venisset, pavens corrui in faciem meam, et ait ad me: Intellige fili hominis, quoniam in tempore finis complebitur visio.";
kjv[18] = "Now as he was speaking with me, I was in a deep sleep on my face toward the ground: but he touched me, and set me upright.";
rsv[18] = "As he was speaking to me, I fell into a deep sleep with my face to the ground; but he touched me and set me on my feet.";
asv[18] = "Now as he was speaking with me, I fell into a deep sleep with my face toward the ground; but he touched me, and set me upright.";
yng[18] = "And in his speaking with me, I have been in a trance on my face, on the earth; and he cometh against me, and causeth me to stand on my station,";
dby[18] = "Now, as he was speaking with me, I was in a deep stupor, with my face toward the ground. And he touched me, and set me up where I had stood.";
web[18] = "Now as he was speaking with me, I was in a deep sleep on my face towards the ground: but he touched me, and set me upright.";
hnv[18] = "Now as he was speaking with me, I fell into a deep sleep with my face toward the ground; but he touched me, and set me upright.";
vul[18] = "Cumque loqueretur ad me, collapsus sum pronus in terram: et tetigit me, et statuit me in gradu meo,";
kjv[19] = "And he said, Behold, I will make thee know what shall be in the last end of the indignation: for at the time appointed the end [shall be].";
rsv[19] = "He said, &quot;Behold, I will make known to you what shall be at the latter end of the indignation; for it pertains to the appointed time of the end.";
asv[19] = "And he said, Behold, I will make thee know what shall be in the latter time of the indignation; for it belongeth to the appointed time of the end.";
yng[19] = "and saith: Lo, I -- I am causing thee to know that which is in the latter end of the indignation; for, at the appointed time [is] the end.";
dby[19] = "And he said, Behold, I will make thee know what shall be at the end of the indignation: for at the set time the end shall be.";
web[19] = "And he said, Behold, I will make thee know what shall be in the last end of the indignation: for at the time appointed the end [shall be].";
hnv[19] = "He said, Behold, I will make you know what shall be in the latter time of the indignation; for it belongs to the appointed time of the end.";
vul[19] = "dixitque mihi: Ego ostendam tibi quae futura sunt in novissimo maledictionis: quoniam habet tempus finem suum.";
kjv[20] = "The ram which thou sawest having [two] horns [are] the kings of Media and Persia.";
rsv[20] = "As for the ram which you saw with the two horns, these are the kings of Media and Persia.";
asv[20] = "The ram which thou sawest, that had the two horns, they are the kings of Media and Persia.";
yng[20] = "`The ram that thou hast seen possessing two horns, [are] the kings of Media and Persia.";
dby[20] = "The ram that thou sawest having the two horns: they are the kings of Media and Persia.";
web[20] = "The ram which thou sawest having [two] horns [are] the kings of Media and Persia.";
hnv[20] = "The ram which you saw, that had the two horns, they are the kings of Madai and Paras.";
vul[20] = "Aries, quem vidisti habere cornua, rex Medorum est atque Persarum.";
kjv[21] = "And the rough goat [is] the king of Grecia: and the great horn that [is] between his eyes [is] the first king.";
rsv[21] = "And the he-goat is the king of Greece; and the great horn between his eyes is the first king.";
asv[21] = "And the rough he-goat is the king of Greece: and the great horn that is between his eyes is the first king.";
yng[21] = "And the young he-goat, the hairy one, [is] the king of Javan; and the great horn that [is] between its eyes is the first king;";
dby[21] = "And the rough goat is the king of Greece; and the great horn that was between his eyes is the first king.";
web[21] = "And the rough goat [is] the king of Grecia: and the great horn that [is] between his eyes [is] the first king.";
hnv[21] = "The rough male goat is the king of Yavan: and the great horn that is between his eyes is the first king.";
vul[21] = "Porro hircus caprarum, rex Graecorum est. et cornu grande, quod erat inter oculos eius, ipse est rex primus.";
kjv[22] = "Now that being broken, whereas four stood up for it, four kingdoms shall stand up out of the nation, but not in his power.";
rsv[22] = "As for the horn that was broken, in place of which four others arose, four kingdoms shall arise from his nation, but not with his power.";
asv[22] = "And as for that which was broken, in the place whereof four stood up, four kingdoms shall stand up out of the nation, but not with his power.";
yng[22] = "and that being broken, stand up do four in its place, four kingdoms from the nation do stand up, and not in its power.";
dby[22] = "Now that being broken, whereas four stood up in its stead, four kingdoms shall stand up out of the nation, but not with his power.";
web[22] = "Now that being broken, whereas four stood up in its place, four kingdoms shall stand up out of the nation, but not in his power.";
hnv[22] = "As for that which was broken, in the place whereof four stood up, four kingdoms shall stand up out of the nation, but not with his power.";
vul[22] = "Quod autem fracto illo surrexerunt quattuor pro eo: quattuor reges de gente eius consurgent, sed non in fortitudine eius.";
kjv[23] = "And in the latter time of their kingdom, when the transgressors are come to the full, a king of fierce countenance, and understanding dark sentences, shall stand up.";
rsv[23] = "And at the latter end of their rule, when the transgressors have reached their full measure, a king of bold countenance, one who understands riddles, shall arise.";
asv[23] = "And in the latter time of their kingdom, when the transgressors are come to the full, a king of fierce countenance, and understanding dark sentences, shall stand up.";
yng[23] = "`And in the latter end of their kingdom, about the perfecting of the transgressors, stand up doth a king, fierce of face, and understanding hidden things;";
dby[23] = "And at the latter time of their kingdom, when the transgressors shall have come to the full, a king of bold countenance, and understanding riddles, shall stand up.";
web[23] = "And in the latter time of their kingdom, when the transgressors are come to the full, a king of fierce countenance, and understanding dark sentences, shall stand up.";
hnv[23] = "In the latter time of their kingdom, when the transgressors are come to the full, a king of fierce face, and understanding dark sentences, shall stand up.";
vul[23] = "Et post regnum eorum, cum creverint iniquitates, consurget rex impundes facie, et intelligens propositiones.";
kjv[24] = "And his power shall be mighty, but not by his own power: and he shall destroy wonderfully, and shall prosper, and practise, and shall destroy the mighty and the holy people.";
rsv[24] = "His power shall be great, and he shall cause fearful destruction, and shall succeed in what he does, and destroy mighty men and the people of the saints.";
asv[24] = "And his power shall be mighty, but not by his own power; and he shall destroy wonderfully, and shall prosper and do [his pleasure]; and he shall destroy the mighty ones and the holy people.";
yng[24] = "and his power hath been mighty, and not by his own power; and wonderful things he destroyeth, and he hath prospered, and wrought, and destroyed mighty ones, and the people of the Holy Ones.";
dby[24] = "And his power shall be mighty, but not by his own power; and he shall destroy marvellously, and shall prosper, and shall practise, and shall destroy the mighty ones, and the people of the saints.";
web[24] = "And his power shall be mighty, but not by his own power: and he shall destroy wonderfully, and shall prosper, and practice, and shall destroy the mighty and the holy people.";
hnv[24] = "His power shall be mighty, but not by his own power; and he shall destroy wonderfully, and shall prosper and do [his pleasure]; and he shall destroy the mighty ones and the holy people.";
vul[24] = "et roborabitur fortitudo eius, sed non in viribus suis: et supra quam credi potest, universa vastabit, et prosperabitur, et faciet. Et interficiet robustos, et populum sanctorum";
kjv[25] = "And through his policy also he shall cause craft to prosper in his hand; and he shall magnify [himself] in his heart, and by peace shall destroy many: he shall also stand up against the Prince of princes; but he shall be broken without hand.";
rsv[25] = "By his cunning he shall make deceit prosper under his hand, and in his own mind he shall magnify himself. Without warning he shall destroy many; and he shall even rise up against the Prince of princes; but, by no human hand, he shall be broken.";
asv[25] = "And through his policy he shall cause craft to prosper in his hand; and he shall magnify himself in his heart, and in [their] security shall he destroy many: he shall also stand up against the prince of princes; but he shall be broken without hand.";
yng[25] = "`And by his understanding he hath also caused deceit to prosper in his hand, and in his heart he exerteth himself, and by ease he destroyeth many; and against the prince of princes he standeth -- and without hand he is broken.";
dby[25] = "And through his cunning shall he cause craft to prosper in his hand; and he will magnify [himself] in his heart, and by prosperity will corrupt many; and he will stand up against the Prince of princes: but he shall be broken without hand.";
web[25] = "And through his policy also he shall cause craft to prosper in his hand; and he shall magnify [himself] in his heart, and by peace shall destroy many: he shall also stand up against the Prince of princes; but he shall be broken without hand.";
hnv[25] = "Through his policy he shall cause craft to prosper in his hand; and he shall magnify himself in his heart, and in [their] security shall he destroy many: he shall also stand up against the prince of princes; but he shall be broken without hand.";
vul[25] = "secundum voluntatem suam, et dirigetur dolus in manu eius: et cor suum magnificabit, et in copia rerum omnium occidet plurimos: et contra principem principum consurget, et sine manu conteretur.";
kjv[26] = "And the vision of the evening and the morning which was told [is] true: wherefore shut thou up the vision; for it [shall be] for many days.";
rsv[26] = "The vision of the evenings and the mornings which has been told is true; but seal up the vision, for it pertains to many days hence.&quot;";
asv[26] = "And the vision of the evenings and mornings which hath been told is true: but shut thou up the vision; for it belongeth to many days [to come].";
yng[26] = "And the appearance of the evening and of the morning, that is told, is true; and thou, hide thou the vision, for [it is] after many days.\'";
dby[26] = "And the vision of the evening and the morning which hath been told is true; but close thou up the vision, for it is for many days [to come].";
web[26] = "And the vision of the evening and the morning which was told [is] true: wherefore shut thou up the vision; for it [shall be] for many days.";
hnv[26] = "The vision of the evenings and mornings which has been told is true: but seal up the vision; for it belongs to many days [to come].";
vul[26] = "Et visio vespere et mane, quae dicta est, vera est: tu ergo visionem signa, quia post multos dies erit.";
kjv[27] = "And I Daniel fainted, and was sick [certain] days; afterward I rose up, and did the king\'s business; and I was astonished at the vision, but none understood [it].";
rsv[27] = "And I, Daniel, was overcome and lay sick for some days; then I rose and went about the king\'s business; but I was appalled by the vision and did not understand it.";
asv[27] = "And I, Daniel, fainted, and was sick certain days; then I rose up, and did the king\'s business: and I wondered at the vision, but none understood it.";
yng[27] = "And I, Daniel, have been, yea, I became sick [for] days, and I rise, and do the king\'s work, and am astonished at the appearance, and there is none understanding.";
dby[27] = "And I Daniel fainted, and was sick [certain] days: then I rose up, and did the king\'s business. And I was astonished at the vision, but none understood [it].";
web[27] = "And I Daniel fainted, and was sick [certain] days; afterward I rose, and did the king\'s business; and I was astonished at the vision, but none understood [it].";
hnv[27] = "I, Daniyel, fainted, and was sick certain days; then I rose up, and did the king\'s business: and I wondered at the vision, but none understood it.";
vul[27] = "Et ego Daniel langui, et aegrotavi per dies: cumque surrexissem, faciebam opera regis, et stupebam ad visionem, et non erat qui interpretaretur.";
