csb[1] = "At that time Michael, the great prince who stands watch over your people, will rise up. There will be a time of distress such as never has occurred since nations came into being until that time. But at that time all your people who are found written in the book will escape.";
csb[2] = "Many who sleep in the dust of the earth will awake, some to eternal life, and some to disgrace and eternal contempt.";
csb[3] = "Those who have insight will shine like the bright expanse of the heavens, and those who lead many to righteousness, like the stars forever and ever.";
csb[4] = "&quot;But you, Daniel, keep these words secret and seal the book until the time of the end. Many will roam about, and knowledge will increase.&quot;";
csb[5] = "Then I, Daniel, looked, and two others were standing there, one on this bank of the river and one on the other.";
csb[6] = "One of them said to the man dressed in linen, who was above the water of the river, &quot;How long until the end of these wondrous things? &quot;";
csb[7] = "Then I heard the man dressed in linen, who was above the water of the river. He raised both his hands toward heaven and swore by him who lives eternally that it would be for a time, times, and half a time. When the power of the holy people is shattered, all these things will be completed.";
csb[8] = "I heard but did not understand. So I asked, &quot;My lord, what will be the outcome of these things? &quot;";
csb[9] = "He said, &quot;Go on your way, Daniel, for the words are secret and sealed until the time of the end.";
csb[10] = "&quot;Many will be purified, cleansed, and refined, but the wicked will act wickedly; none of the wicked will understand, but those who have insight will understand.";
csb[11] = "&quot;From the time the daily sacrifice is abolished and the abomination of desolation is set up, there will be 1,290 days.";
csb[12] = "&quot;Happy is the one who waits for and reaches 1,335 days.";
csb[13] = "&quot;But as for you, go on your way to the end; you will rest, and then you will stand to receive your allotted inheritance at the end of the days.&quot;";
kjv[1] = "And at that time shall Michael stand up, the great prince which standeth for the children of thy people: and there shall be a time of trouble, such as never was since there was a nation [even] to that same time: and at that time thy people shall be delivered, every one that shall be found written in the book.";
rsv[1] = "&quot;At that time shall arise Michael, the great prince who has charge of your people. And there shall be a time of trouble, such as never has been since there was a nation till that time; but at that time your people shall be delivered, every one whose name shall be found written in the book.";
asv[1] = "And at that time shall Michael stand up, the great prince who standeth for the children of thy people; and there shall be a time of trouble, such as never was since there was a nation even to that same time: and at that time thy people shall be delivered, every one that shall be found written in the book.";
yng[1] = "`And at that time stand up doth Michael, the great head, who is standing up for the sons of thy people, and there hath been a time of distress, such as hath not been since there hath been a nation till that time, and at that time do thy people escape, every one who is found written in the book.";
dby[1] = "And at that time shall Michael stand up, the great prince who standeth for the children of thy people; and there shall be a time of distress, such as never was since there was a nation until that time. And at that time thy people shall be delivered, every one that is found written in the book.";
web[1] = "And at that time shall Michael stand up, the great prince who standeth for the children of thy people: and there shall be a time of trouble, such as never was since there was a nation [even] to that same time: and at that time thy people shall be delivered, every one that shall be found written in the book.";
hnv[1] = "&quot;At that time shall Mikha\'el stand up, the great prince who stands for the children of your people; and there shall be a time of trouble, such as never was since there was a nation even to that same time: and at that time your people shall be delivered, everyone who shall be found written in the book.";
vul[1] = "In tempore autem illo consurget Michael princeps magnus, qui stat pro filiis populi tui: et veniet tempus quale non fuit ab eo ex quo gentes esse coeperunt usque ad tempus illud. Et in tempore illo salvabitur populus tuus, omnis qui inventus fuerit scriptus in libro.";
kjv[2] = "And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame [and] everlasting contempt.";
rsv[2] = "And many of those who sleep in the dust of the earth shall awake, some to everlasting life, and some to shame and everlasting contempt.";
asv[2] = "And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame and everlasting contempt.";
yng[2] = "`And the multitude of those sleeping in the dust of the ground do awake, some to life age-during, and some to reproaches -- to abhorrence age-during.";
dby[2] = "And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame, to everlasting contempt.";
web[2] = "And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame [and] everlasting contempt.";
hnv[2] = "Many of those who sleep in the dust of the eretz shall awake, some to everlasting life, and some to shame and everlasting contempt.";
vul[2] = "Et multi de his, qui dormiunt in terrae pulvere, evigilabunt: (u) alii in vitam aeternam, et alii in opprobrium ut videant semper.";
kjv[3] = "And they that be wise shall shine as the brightness of the firmament; and they that turn many to righteousness as the stars for ever and ever.";
rsv[3] = "And those who are wise shall shine like the brightness of the firmament; and those who turn many to righteousness, like the stars for ever and ever.";
asv[3] = "And they that are wise shall shine as the brightness of the firmament; and they that turn many to righteousness as the stars for ever and ever.";
yng[3] = "And those teaching do shine as the brightness of the expanse, and those justifying the multitude as stars to the age and for ever.";
dby[3] = "And they that are wise shall shine as the brightness of the expanse; and they that turn the many to righteousness as the stars, for ever and ever.";
web[3] = "And they that are wise shall shine as the brightness of the firmament; and they that turn many to righteousness as the stars for ever and ever.";
hnv[3] = "Those who are wise shall shine as the brightness of the expanse; and those who turn many to righteousness as the stars forever and ever.";
vul[3] = "Qui autem docti fuerint, (v) fulgebunt quasi splendor firmamenti: et qui ad iustitiam erudiunt multos, quasi stellae in perpetuas aeternitates.";
kjv[4] = "But thou, O Daniel, shut up the words, and seal the book, [even] to the time of the end: many shall run to and fro, and knowledge shall be increased.";
rsv[4] = "But you, Daniel, shut up the words, and seal the book, until the time of the end. Many shall run to and fro, and knowledge shall increase.&quot;";
asv[4] = "But thou, O Daniel, shut up the words, and seal the book, even to the time of the end: many shall run to and fro, and knowledge shall be increased.";
yng[4] = "And thou, O Daniel, hide the things, and seal the book till the time of the end, many do go to and fro, and knowledge is multiplied.\'";
dby[4] = "And thou, Daniel, close the words, and seal the book, till the time of the end. Many shall run to and fro, and knowledge shall be increased.";

hnv[4] = "But you, Daniyel, shut up the words, and seal the book, even to the time of the end: many shall run back and forth, and knowledge shall be increased.&quot;";
vul[4] = "Tu autem Daniel claude sermones, et signa librum usque ad tempus statutum: plurimi pertransibunt, et multiplex erit scientia.";
kjv[5] = "Then I Daniel looked, and, behold, there stood other two, the one on this side of the bank of the river, and the other on that side of the bank of the river.";
rsv[5] = "Then I Daniel looked, and behold, two others stood, one on this bank of the stream and one on that bank of the stream.";
asv[5] = "Then I, Daniel, looked, and, behold, there stood other two, the one on the brink of the river on this side, and the other on the brink of the river on that side.";
yng[5] = "And I have looked -- I, Daniel -- and lo, two others are standing, one here at the edge of the flood, and one there at the edge of the flood,";

web[5] = "Then I Daniel looked, and behold, there stood other two, the one on this side of the bank of the river, and the other on that side of the bank of the river.";

vul[5] = "Et vidi ego Daniel, et ecce quasi duo alii stabant: unus hinc super ripam fluminis, et alius inde ex altera ripa fluminis.";
kjv[6] = "And [one] said to the man clothed in linen, which [was] upon the waters of the river, How long [shall it be to] the end of these wonders?";
rsv[6] = "And I said to the man clothed in linen, who was above the waters of the stream, &quot;How long shall it be till the end of these wonders?&quot;";
asv[6] = "And one said to the man clothed in linen, who was above the waters of the river, How long shall it be to the end of these wonders?";

dby[6] = "And he said to the man clothed in linen, who was above the waters of the river, How long [is it to] the end of these wonders?";
web[6] = "And [one] said to the man clothed in linen, who [was] upon the waters of the river, How long [shall it be to] the end of these wonders?";
hnv[6] = "One said to the man clothed in linen, who was above the waters of the river, How long shall it be to the end of these wonders?";
vul[6] = "Et dixi viro, qui erat indutus lineis, qui stabat super aquas fluminis: Usquequo finis horum mirabilium?";
kjv[7] = "And I heard the man clothed in linen, which [was] upon the waters of the river, when he held up his right hand and his left hand unto heaven, and sware by him that liveth for ever that [it shall be] for a time, times, and an half; and when he shall have accomplished to scatter the power of the holy people, all these [things] shall be finished.";
rsv[7] = "The man clothed in linen, who was above the waters of the stream, raised his right hand and his left hand toward heaven; and I heard him swear by him who lives for ever that it would be for a time, two times, and half a time; and that when the shattering of the power of the holy people comes to an end all these things would be accomplished.";
asv[7] = "And I heard the man clothed in linen, who was above the waters of the river, when he held up his right hand and his left hand unto heaven, and sware by him that liveth for ever that it shall be for a time, times, and a half; and when they have made an end of breaking in pieces the power of the holy people, all these things shall be finished.";
yng[7] = "And I hear the one clothed in linen, who [is] upon the waters of the flood, and he doth lift up his right hand and his left unto the heavens, and sweareth by Him who is living to the age, that, `After a time, times, and a half, and at the completion of the scattering of the power of the holy people, finished are all these.\'";
dby[7] = "And I heard the man clothed in linen, who was above the waters of the river; and he held up his right hand and his left hand unto the heavens, and swore by him that liveth for ever that it is for a time, times, and a half; and when the scattering of the power of the holy people shall be accomplished, all these things shall be finished.";
web[7] = "And I heard the man clothed in linen, who [was] upon the waters of the river, when he held up his right hand and his left hand to heaven, and swore by him that liveth for ever, that [it shall be] for a time, times, and a half; and when he shall have accomplished to scatter the power of the holy people, all these [things] shall be finished.";
hnv[7] = "I heard the man clothed in linen, who was above the waters of the river, when he held up his right hand and his left hand to heaven, and swore by him who lives forever that it shall be for a time, times, and a half; and when they have made an end of breaking in pieces the power of the holy people, all these things shall be finished.";
vul[7] = "Et audivi virum, qui indutus erat lineis, qui stabat super aquas fluminis, (w) cum elevasset dexteram et sinistram suam in caelum, et iurasset per viventem in aeternum, quia in tempus, et tempora, et dimidium temporis. Et cum completa fuerit dispersio manus populi sancti, complebuntur universa haec.";
kjv[8] = "And I heard, but I understood not: then said I, O my Lord, what [shall be] the end of these [things]?";
rsv[8] = "I heard, but I did not understand. Then I said, &quot;O my lord, what shall be the issue of these things?&quot;";
asv[8] = "And I heard, but I understood not: then said I, O my lord, what shall be the issue of these things?";
yng[8] = "And I have heard, and I do not understand, and I say, `O my lord, what [is] the latter end of these?\'";
dby[8] = "And I heard, but I understood not. And I said, My lord, what shall be the end of these things?";
web[8] = "And I heard, but I understood not: then said I, O my Lord, what [shall be] the end of these [things]?";
hnv[8] = "I heard, but I didn\'t understand: then said I, my lord, what shall be the issue of these things?";
vul[8] = "Et ego audivi, et non intellexi. Et dixi: Domine mi, quid erit post haec?";

rsv[9] = "He said, &quot;Go your way, Daniel, for the words are shut up and sealed until the time of the end.";

hnv[9] = "He said, Go your way, Daniyel; for the words are shut up and sealed until the time of the end.";
vul[9] = "Et ait: Vade Daniel, quia clausi sunt, signatique sermones usque ad praefinitum tempus.";
kjv[10] = "Many shall be purified, and made white, and tried; but the wicked shall do wickedly: and none of the wicked shall understand; but the wise shall understand.";
rsv[10] = "Many shall purify themselves, and make themselves white, and be refined; but the wicked shall do wickedly; and none of the wicked shall understand; but those who are wise shall understand.";

hnv[10] = "Many shall purify themselves, and make themselves white, and be refined; but the wicked shall do wickedly; and none of the wicked shall understand; but those who are wise shall understand.";
