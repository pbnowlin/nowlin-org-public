csb[1] = "King Nebuchadnezzar, To those of every people, nation, and language, who live on the whole earth: May your prosperity increase.";
csb[2] = "I am pleased to tell you about the miracles and wonders the Most High God has done for me.";
csb[3] = "How great are his miracles, and how mighty his wonders! His kingdom is an eternal kingdom, and his dominion is from generation to generation.";
csb[4] = "I, Nebuchadnezzar, was at ease in my house and flourishing in my palace.";
csb[5] = "I had a dream, and it frightened me; while in my bed, the images and visions in my mind alarmed me.";
csb[6] = "So I issued a decree to bring all the wise men of Babylon to me in order that they might make the dream\'s interpretation known to me.";
csb[7] = "When the magicians, mediums, Chaldeans, and diviners came in, I told them the dream, but they could not make its interpretation known to me.";
csb[8] = "Finally Daniel, named Belteshazzar after the name of my god -- and a spirit of the holy gods is in him -- came before me. I told him the dream:";
csb[9] = "&quot;Belteshazzar, head of the magicians, because I know that you have the spirit of the holy gods and that no mystery puzzles you, explain to me the visions of my dream that I saw, and its interpretation.";
csb[10] = "&quot;In the visions of my mind as I was lying in bed, I saw this: There was a tree in the middle of the earth, and it was very tall.";
csb[11] = "&quot;The tree grew large and strong; its top reached to the sky, and it was visible to the ends of the earth.";
csb[12] = "&quot;Its leaves were beautiful, its fruit was abundant, and on it was food for all. Wild animals found shelter under it, the birds of the sky lived in its branches, and every creature was fed from it.";
csb[13] = "&quot;As I was lying in my bed, I also saw in the visions of my mind a watcher, a holy one, coming down from heaven.";
csb[14] = "&quot;He called out loudly: Cut down the tree and chop off its branches; strip off its leaves and scatter its fruit. Let the animals flee from under it, and the birds from its branches.";
csb[15] = "&quot;But leave the stump with its roots in the ground and with a band of iron and bronze around it in the tender grass of the field. Let him be drenched with dew from the sky and share the plants of the earth with the animals.";
csb[16] = "&quot;Let his mind be changed from that of a human, and let him be given the mind of an animal for seven periods of time.";
csb[17] = "&quot;This word is by decree of the watchers, and the decision is by command from the holy ones. This is so that the living will know that the Most High is ruler over human kingdoms. He gives them to anyone he wants and sets the lowliest of people over them.";
csb[18] = "&quot;This is the dream that I, King Nebuchadnezzar, had. Now, Belteshazzar, tell me the interpretation, because none of the wise men of my kingdom can make the interpretation known to me. But you can, because you have a spirit of the holy gods.&quot;";
csb[19] = "Then Daniel, whose name is Belteshazzar, was stunned for a moment, and his thoughts alarmed him. The king said, &quot;Belteshazzar, don\'t let the dream or its interpretation alarm you.&quot; Belteshazzar answered, &quot;My lord, may the dream apply to those who hate you, and its interpretation to your enemies!";
csb[20] = "&quot;The tree you saw, which grew large and strong, whose top reached to the sky and was visible to the whole earth,";
csb[21] = "&quot;and whose leaves were beautiful and its fruit abundant -- and on it was food for all, under it the wild animals lived, and in its branches the birds of the sky lived --";
csb[22] = "&quot;that tree is you, Your Majesty. For you have become great and strong: your greatness has grown and even reaches the sky, and your dominion extends to the ends of the earth.";
csb[23] = "&quot;The king saw a watcher, a holy one, coming down from heaven and saying, \'Cut down the tree and destroy it, but leave the stump with its roots in the ground and with a band of iron and bronze around it in the tender grass of the field. Let him be drenched with dew from the sky and share food with the wild animals for seven periods of time.\'";
csb[24] = "&quot;This is the interpretation, Your Majesty, and this is the decree of the Most High that has been issued against my lord the king:";
csb[25] = "&quot;You will be driven away from people to live with the wild animals. You will feed on grass like cattle and be drenched with dew from the sky for seven periods of time, until you acknowledge that the Most High is ruler over human kingdoms, and he gives them to anyone he wants.";
csb[26] = "&quot;As for the command to leave the tree\'s stump with its roots, your kingdom will be restored to you as soon as you acknowledge that Heaven rules.";
csb[27] = "&quot;Therefore, may my advice seem good to you my king. Separate yourself from your sins by doing what is right, and from your injustices by showing mercy to the needy. Perhaps there will be an extension of your prosperity.&quot;";
csb[28] = "All this happened to King Nebuchadnezzar.";
csb[29] = "At the end of twelve months, as he was walking on the roof of the royal palace in Babylon,";
csb[30] = "the king exclaimed, &quot;Is this not Babylon the Great that I have built to be a royal residence by my vast power and for my majestic glory? &quot;";
csb[31] = "While the words were still in the king\'s mouth, a voice came from heaven: &quot;King Nebuchadnezzar, to you it is declared that the kingdom has departed from you.";
csb[32] = "&quot;You will be driven away from people to live with the wild animals, and you will feed on grass like cattle for seven periods of time, until you acknowledge that the Most High is ruler over human kingdoms, and he gives them to anyone he wants.&quot;";
csb[33] = "At that moment the message against Nebuchadnezzar was fulfilled. He was driven away from people. He ate grass like cattle, and his body was drenched with dew from the sky, until his hair grew like eagles\' feathers and his nails like birds\' claws.";
csb[34] = "But at the end of those days, I, Nebuchadnezzar, looked up to heaven, and my sanity returned to me. Then I praised the Most High and honored and glorified him who lives forever: For his dominion is an everlasting dominion, and his kingdom is from generation to generation.";
csb[35] = "All the inhabitants of the earth are counted as nothing, and he does what he wants with the army of heaven and the inhabitants of the earth. There is no one who can block his hand or say to him, &quot;What have you done? &quot;";
csb[36] = "At that time my sanity returned to me, and my majesty and splendor returned to me for the glory of my kingdom. My advisers and my nobles sought me out, I was reestablished over my kingdom, and even more greatness came to me.";
csb[37] = "Now I, Nebuchadnezzar, praise, exalt, and glorify the King of the heavens, because all his works are true and his ways are just. He is able to humble those who walk in pride.";

hnv[16] = "let his heart be changed from man\'s, and let a animal\'s heart be given to him; and let seven times pass over him.";
vul[16] = "(Vulgate 4:13) Cor eius ab humano commutetur, et cor ferae detur ei: et septem tempora mutentur super eum.";
kjv[17] = "This matter [is] by the decree of the watchers, and the demand by the word of the holy ones: to the intent that the living may know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the basest of men.";
rsv[17] = "The sentence is by the decree of the watchers, the decision by the word of the holy ones, to the end that the living may know that the Most High rules the kingdom of men, and gives it to whom he will, and sets over it the lowliest of men.\'";
asv[17] = "The sentence is by the decree of the watchers, and the demand by the word of the holy ones; to the intent that the living may know that the Most High ruleth in the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the lowest of men.";
yng[17] = "by the decree of the sifters [is] the sentence, and by the saying of the holy ones the requirement, to the intent that the living may know that the Most High is ruler in the kingdom of men, and to whom He willeth He giveth it, and the lowest of men He doth raise up over it.";
dby[17] = "This sentence is by the decree of the watchers, and the decision by the word of the holy ones: that the living may know that the Most High ruleth over the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the basest of men.";
web[17] = "This matter [is] by the decree of the watchers, and the demand by the word of the holy ones: to the intent that the living may know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the basest of men.";
hnv[17] = "The sentence is by the decree of the watchers, and the demand by the word of the holy ones; to the intent that the living may know that Ha`Elyon rules in the kingdom of men, and gives it to whoever he will, and sets up over it the lowest of men.";
vul[17] = "(Vulgate 4:14) In sententia vigilum decretum est, et sermo sanctorum, et petitio: donec cognoscant viventes quoniam dominatur Excelsus in regno hominum; et cuicumque voluerit, dabit illud, et humillimum hominem constituet super eum.";
kjv[18] = "This dream I king Nebuchadnezzar have seen. Now thou, O Belteshazzar, declare the interpretation thereof, forasmuch as all the wise [men] of my kingdom are not able to make known unto me the interpretation: but thou [art] able; for the spirit of the holy gods [is] in thee.";
rsv[18] = "This dream I, King Nebuchadnez\'zar, saw. And you, O Belteshaz\'zar, declare the interpretation, because all the wise men of my kingdom are not able to make known to me the interpretation, but you are able, for the spirit of the holy gods is in you.&quot;";
asv[18] = "This dream I, king Nebuchadnezzar, have seen; and thou, O Belteshazzar, declare the interpretation, forasmuch as all the wise men of my kingdom are not able to make known unto me the interpretation; but thou art able; for the spirit of the holy gods is in thee.";
yng[18] = "`This dream I have seen, I king Nebuchadnezzar; and thou, O Belteshazzar, the interpretation tell, because that all the wise men of my kingdom are not able to cause me to know the interpretation, and thou [art] able, for the spirit of the holy gods [is] in thee.";
dby[18] = "This dream I, king Nebuchadnezzar, have seen; and thou, Belteshazzar, tell the interpretation, forasmuch as all the wise men of my kingdom are not able to make known unto me the interpretation; but thou art able, for the spirit of the holy gods is in thee.";
web[18] = "This dream I king Nebuchadnezzar have seen. Now thou, O Belteshazzar, declare the interpretation of it, forasmuch as all the wise [men] of my kingdom are not able to make known to me the interpretation: but thou [art] able; for the spirit of the holy gods [is] in thee.";
hnv[18] = "This dream I, king Nevukhadnetztzar, have seen; and you, Belteshatztzar, declare the interpretation, because all the wise men of my kingdom are not able to make known to me the interpretation; but you are able; for the spirit of the holy gods is in you.";
vul[18] = "(Vulgate 4:15) Hoc somnium vidi ego Nabuchodonosor rex: tu ergo Baltassar interpretationem narra festinus: quia omnes sapientes regni mei non queunt solutionem edicere mihi: tu autem potes, quia spiritus deorum sanctorum in te est.";
kjv[19] = "Then Daniel, whose name [was] Belteshazzar, was astonied for one hour, and his thoughts troubled him. The king spake, and said, Belteshazzar, let not the dream, or the interpretation thereof, trouble thee. Belteshazzar answered and said, My lord, the dream [be] to them that hate thee, and the interpretation thereof to thine enemies.";
rsv[19] = "Then Daniel, whose name was Belteshaz\'zar, was dismayed for a moment, and his thoughts alarmed him. The king said, &quot;Belteshaz\'zar, let not the dream or the interpretation alarm you.&quot; Belteshaz\'zar answered, &quot;My lord, may the dream be for those who hate you and its interpretation for your enemies!";
asv[19] = "Then Daniel, whose name was Belteshazzar, was stricken dumb for a while, and his thoughts troubled him. The king answered and said, Belteshazzar, let not the dream, or the interpretation, trouble thee. Belteshazzar answered and said, My lord, the dream be to them that hate thee, and the interpretation thereof to thine adversaries.";
yng[19] = "`Then Daniel, whose name [is] Belteshazzar, hath been astonished about one hour, and his thoughts do trouble him; the king hath answered and said, O Belteshazzar, let not the dream and its interpretation trouble thee. Belteshazzar hath answered and said, My lord, the dream -- to those hating thee, and its interpretation -- to thine enemies!";
dby[19] = "Then Daniel, whose name is Belteshazzar, was astonied for one hour, and his thoughts troubled him. The king spoke and said, Belteshazzar, let not the dream, nor its interpretation, trouble thee. Belteshazzar answered and said, My lord, the dream be to them that hate thee, and its interpretation to thine enemies!";
web[19] = "Then Daniel, whose name [was] Belteshazzar, was astonished for one hour, and his thoughts troubled him. The king spoke, and said, Belteshazzar, let not the dream, or the interpretation of it, trouble thee. Belteshazzar answered, and said, My lord, the dream [be] to them that hate thee, and the interpretation of it to thy enemies.";
hnv[19] = "Then Daniyel, whose name was Belteshatztzar, was stricken mute for a while, and his thoughts troubled him. The king answered, Belteshatztzar, don\'t let the dream, or the interpretation, trouble you. Belteshatztzar answered, My lord, the dream be to those who hate you, and the interpretation of it to your adversaries.";
vul[19] = "(Vulgate 4:16) Tunc Daniel, cuius nomen Baltassar, coepit intra semetipsum tacitus cogitare quasi una hora: et cogitationes eius conturbabant eum. Respondens autem rex ait: Baltassar, somnium et interpretatio eius non conturbent te. Respondit Baltassar, et dixit: Domine mi, somnium his, qui te oderunt, et interpretatio eius hostibus tuis sit.";
kjv[20] = "The tree that thou sawest, which grew, and was strong, whose height reached unto the heaven, and the sight thereof to all the earth;";
rsv[20] = "The tree you saw, which grew and became strong, so that its top reached to heaven, and it was visible to the end of the whole earth;";
asv[20] = "The tree that thou sawest, which grew, and was strong, whose height reached unto heaven, and the sight thereof to all the earth;";
yng[20] = "The tree that thou hast seen, that hath become great and strong, and its height doth reach to the heavens, and its vision to all the land,";
dby[20] = "The tree that thou sawest, which grew and was strong, whose height reached unto the heavens, and the sight of it to all the earth;";
web[20] = "The tree that thou sawest, which grew, and was strong, whose hight reached to the heaven, and the sight of it to all the earth;";
hnv[20] = "The tree that you saw, which grew, and was strong, whose height reached to the sky, and the sight of it to all the eretz;";
vul[20] = "(Vulgate 4:17) Arborem, quam vidisti sublimem, atque robustam, cuius altitudo pertingit ad caelum, et aspectus illius in omnem terram:";
kjv[21] = "Whose leaves [were] fair, and the fruit thereof much, and in it [was] meat for all; under which the beasts of the field dwelt, and upon whose branches the fowls of the heaven had their habitation:";
rsv[21] = "whose leaves were fair and its fruit abundant, and in which was food for all; under which beasts of the field found shade, and in whose branches the birds of the air dwelt--";
asv[21] = "whose leaves were fair, and the fruit thereof much, and in it was food for all; under which the beasts of the field dwelt, and upon whose branches the birds of the heavens had their habitation:";
yng[21] = "and its leaves [are] fair, and its budding great, and food for all [is] in it, under it dwell doth the beast of the field, and on its boughs sit do the birds of the heavens.";
dby[21] = "whose leaves were beautiful, and its fruit abundant, and in it was food for all; under which the beasts of the field dwelt, and in whose branches the birds of the heavens had their habitation:";
web[21] = "Whose leaves [were] fair, and the fruit of it abundant, and in it [was] food for all; under which the beasts of the field dwelt, and upon whose branches the fowls of heaven had their habitation:";
hnv[21] = "whose leaves were beautiful, and the fruit of it much, and in it was food for all; under which the animals of the field lived, and on whose branches the birds of the sky had their habitation:";
vul[21] = "(Vulgate 4:18) et rami eius pulcherrimi, et fructus eius nimius, et esca omnium in ea, subter eam habitantes bestiae agri, et in ramis eius commorantes aves caeli:";
kjv[22] = "It [is] thou, O king, that art grown and become strong: for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth.";
rsv[22] = "it is you, O king, who have grown and become strong. Your greatness has grown and reaches to heaven, and your dominion to the ends of the earth.";
asv[22] = "it is thou, O king, that art grown and become strong; for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth.";
yng[22] = "`Thou it [is], O king, for thou hast become great and mighty, and thy greatness hath become great, and hath reached to the heavens, and thy dominion to the end of the earth;";
dby[22] = "it is thou, O king, who art grown and become strong; for thy greatness is grown, and reacheth unto the heavens, and thy dominion to the end of the earth.";
web[22] = "It [is] thou, O king, that art grown and become strong: for thy greatness is grown, and reacheth to heaven, and thy dominion to the end of the earth.";
hnv[22] = " it is you, O king, that are grown and become strong; for your greatness is grown, and reaches to the sky, and your dominion to the end of the eretz.";
vul[22] = "(Vulgate 4:19) Tu es rex, qui magnificatus es, et invaluisti: et magnitudo tua crevit, et pervenit usque ad caelum, et potestas tua in terminos universae terrae.";
kjv[23] = "And whereas the king saw a watcher and an holy one coming down from heaven, and saying, Hew the tree down, and destroy it; yet leave the stump of the roots thereof in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and [let] his portion [be] with the beasts of the field, till seven times pass over him;";
rsv[23] = "And whereas the king saw a watcher, a holy one, coming down from heaven and saying, \'Hew down the tree and destroy it, but leave the stump of its roots in the earth, bound with a band of iron and bronze, in the tender grass of the field; and let him be wet with the dew of heaven; and let his lot be with the beasts of the field, till seven times pass over him\';";
asv[23] = "And whereas the king saw a watcher and a holy one coming down from heaven, and saying, Hew down the tree, and destroy it; nevertheless leave the stump of the roots thereof in the earth, even with a band of iron and brass, in the tender grass of the field, and let it be wet with the dew of heaven: and let his portion be with the beasts of the field, till seven times pass over him;";
yng[23] = "and that which the king hath seen -- a sifter, even a holy one, coming down from the heavens, and he hath said, Cut down the tree, and destroy it; but the stump of its roots leave in the earth, even with a band of iron and brass, in the tender grass of the field, and with the dew of the heavens it is wet, and with the beast of the field [is] his portion, till that seven times pass over him.";
dby[23] = "And whereas the king saw a watcher and a holy one coming down from the heavens, and saying, Hew the tree down, and destroy it; nevertheless leave the stump of its roots in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be bathed with the dew of heaven, and let his portion be with the beasts of the field, till seven times pass over him:";
web[23] = "And whereas the king saw a watcher and a holy one coming down from heaven, and saying, Hew the tree down, and destroy it; yet leave the stump of its roots in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and [let] its portion [be] with the beasts of the field, till seven times shall pass over him;";
hnv[23] = "Whereas the king saw a watcher and a holy one coming down from the sky, and saying, Hew down the tree, and destroy it; nevertheless leave the stump of the roots of it in the eretz, even with a band of iron and brass, in the tender grass of the field, and let it be wet with the dew of the sky: and let his portion be with the animals of the field, until seven times pass over him;";
vul[23] = "(Vulgate 4:20) Quod autem vidit rex vigilem, et sanctum descendere de caelo, et dicere: Succidite arborem, et dissipate illam, attamen germen radicum eius in terra dimittite, et vinciatur ferro et aere in herbis foris, et rore caeli conspergatur, et cum feris sit pabulum eius, donec septem tempora mutentur super eum:";
kjv[24] = "This [is] the interpretation, O king, and this [is] the decree of the most High, which is come upon my lord the king:";
rsv[24] = "this is the interpretation, O king: It is a decree of the Most High, which has come upon my lord the king,";
asv[24] = "this is the interpretation, O king, and it is the decree of the Most High, which is come upon my lord the king:";
yng[24] = "`This [is] the interpretation, O king, and the decree of the Most High it [is] that hath come against my lord the king:";
dby[24] = "this is the interpretation, O king, and it is the decree of the Most High, which cometh upon my lord the king:";
web[24] = "This [is] the interpretation, O king, and this [is] the decree of the most High, which is come upon my lord the king:";
hnv[24] = "this is the interpretation, O king, and it is the decree of Ha`Elyon, which is come on my lord the king:";
vul[24] = "(Vulgate 4:21) Haec est interpretatio sententiae Altissimi, quae pervenit super dominum meum regem:";
kjv[25] = "That they shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and they shall wet thee with the dew of heaven, and seven times shall pass over thee, till thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will.";
rsv[25] = "that you shall be driven from among men, and your dwelling shall be with the beasts of the field; you shall be made to eat grass like an ox, and you shall be wet with the dew of heaven, and seven times shall pass over you, till you know that the Most High rules the kingdom of men, and gives it to whom he will.";
asv[25] = "that thou shalt be driven from men, and thy dwelling shall be with the beasts of the field, and thou shalt be made to eat grass as oxen, and shalt be wet with the dew of heaven, and seven times shall pass over thee; till thou know that the Most High ruleth in the kingdom of men, and giveth it to whomsoever he will.";
yng[25] = "and they are driving thee away from men, and with the beast of the field is thy dwelling, and the herb as oxen they do cause thee to eat, and by the dew of the heavens they are wetting thee, and seven times do pass over thee, till that thou knowest that the Most High is ruler in the kingdom of men, and to whom He willeth He giveth it.";
dby[25] = "They shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and thou shalt be bathed with the dew of heaven; and seven times shall pass over thee, till thou know that the Most High ruleth over the kingdom of men, and giveth it to whomsoever he will.";
web[25] = "That they shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and they shall wet thee with the dew of heaven, and seven times shall pass over thee, till thou shalt know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will.";
hnv[25] = "that you shall be driven from men, and your dwelling shall be with the animals of the field, and you shall be made to eat grass as oxen, and shall be wet with the dew of the sky, and seven times shall pass over you; until you know that Ha`Elyon rules in the kingdom of men, and gives it to whoever he will.";
vul[25] = "(Vulgate 4:22) Eiicient te ab hominibus, et cum bestiis ferisque erit habitatio tua, et (d) foenum ut bos comedes, et rore caeli infunderis: septem quoque tempora mutabuntur super te, donec scias quod dominetur Excelsus super regnum hominum, et cuicumque voluerit, det illud.";
kjv[26] = "And whereas they commanded to leave the stump of the tree roots; thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule.";
rsv[26] = "And as it was commanded to leave the stump of the roots of the tree, your kingdom shall be sure for you from the time that you know that Heaven rules.";
asv[26] = "And whereas they commanded to leave the stump of the roots of the tree; thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule.";
yng[26] = "And that which they said -- to leave the stump of the roots of the tree; thy kingdom for thee abideth, after that thou knowest that the heavens are ruling.";
dby[26] = "And whereas it was commanded to leave the stump of the roots of the tree; thy kingdom shall remain unto thee, after that thou shalt know that the heavens do rule.";
web[26] = "And whereas they commanded to leave the stump of the tree roots; thy kingdom shall be sure to thee, after that thou shalt have known that the heavens do rule.";
hnv[26] = "Whereas they commanded to leave the stump of the roots of the tree; your kingdom shall be sure to you, after that you shall have known that the heavens do rule.";
vul[26] = "(Vulgate 4:23) Quod autem praecepit ut relinqueretur germen radicum eius, id est arboris: regnum tuum tibi manebit postquam cognoveris potestatem esse caelestem.";
kjv[27] = "Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by shewing mercy to the poor; if it may be a lengthening of thy tranquillity.";
rsv[27] = "Therefore, O king, let my counsel be acceptable to you; break off your sins by practicing righteousness, and your iniquities by showing mercy to the oppressed, that there may perhaps be a lengthening of your tranquillity.&quot;";
asv[27] = "Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by showing mercy to the poor; if there may be a lengthening of thy tranquillity.";
yng[27] = "`Therefore, O king, let my counsel be acceptable unto thee, and thy sins by righteousness break off, and thy perversity by pitying the poor, lo, it is a lengthening of thine ease.";
dby[27] = "Therefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by shewing mercy to the poor; if it may be a lengthening of thy tranquillity.";
web[27] = "Wherefore, O king, let my counsel be acceptable to thee, and break off thy sins by righteousness, and thy iniquities by showing mercy to the poor; if it may be a lengthening of thy tranquillity.";
hnv[27] = "Therefore, O king, let my counsel be acceptable to you, and break off your sins by righteousness, and your iniquities by showing mercy to the poor; if there may be a lengthening of your tranquillity.";
vul[27] = "(Vulgate 4:24) Quam ob rem rex consilium meum placeat tibi, (e) et peccata tua eleemosynis redime, et iniquitates tuas misericordiis pauperum: forsitan ignoscet delictis tuis.";

asv[28] = "All this came upon the king Nebuchadnezzar.";

dby[28] = "All this came upon king Nebuchadnezzar.";
web[28] = "All this came upon the king Nebuchadnezzar.";
hnv[28] = "All this came on the king Nevukhadnetztzar.";

kjv[30] = "The king spake, and said, Is not this great Babylon, that I have built for the house of the kingdom by the might of my power, and for the honour of my majesty?";

yng[30] = "the king hath answered and said, Is not this that great Babylon that I have built, for the house of the kingdom, in the might of my strength, and for the glory of mine honour?";

kjv[33] = "The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven, till his hairs were grown like eagles\' [feathers], and his nails like birds\' [claws].";
rsv[33] = "Immediately the word was fulfilled upon Nebuchadnez\'zar. He was driven from among men, and ate grass like an ox, and his body was wet with the dew of heaven till his hair grew as long as eagles\' feathers, and his nails were like birds\' claws.";
asv[33] = "The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven, till his hair was grown like eagles\' [feathers], and his nails like birds\' [claws].";
yng[33] = "`In that hour the thing hath been fulfilled on Nebuchadnezzar, and from men he is driven, and the herb as oxen he eateth, and by the dew of the heavens his body is wet, till that his hair as eagles\' hath become great, and his nails as birds.\'";
dby[33] = "The same hour was the word fulfilled upon Nebuchadnezzar; and he was driven from men, and ate grass as oxen; and his body was bathed with the dew of heaven, till his hair grew like eagles\' [feathers], and his nails like birds\' [claws].";
web[33] = "The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men, and ate grass as oxen, and his body was wet with the dew of heaven, till his hairs were grown like eagles\' [feathers], and his nails like birds\' [claws].";
hnv[33] = " The same hour was the thing fulfilled on Nevukhadnetztzar: and he was driven from men, and ate grass as oxen, and his body was wet with the dew of the sky, until his hair was grown like eagles\' [feathers], and his nails like birds\' [claws].";
vul[33] = "(Vulgate 4:30) Eadem hora sermo completus est super Nabuchodonosor, et ex hominibus abiectus est, et foenum ut bos comedit, et rore caeli corpus eius infectum est: donec capilli eius in similitudinem aquilarum crescerent, et ungues eius quasi avium.";
kjv[34] = "And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion [is] an everlasting dominion, and his kingdom [is] from generation to generation:";
rsv[34] = "At the end of the days I, Nebuchadnez\'zar, lifted my eyes to heaven, and my reason returned to me, and I blessed the Most High, and praised and honored him who lives for ever; for his dominion is an everlasting dominion, and his kingdom endures from generation to generation;";
asv[34] = "And at the end of the days I, Nebuchadnezzar, lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the Most High, and I praised and honored him that liveth for ever; for his dominion is an everlasting dominion, and his kingdom from generation to generation;";
yng[34] = "`And at the end of the days I, Nebuchadnezzar, mine eyes to the heavens have lifted up, and mine understanding unto me returneth, and the Most High I have blessed, and the Age-during Living One I have praised and honoured, whose dominion [is] a dominion age-during, and His kingdom with generation and generation;";
dby[34] = "And at the end of the days I Nebuchadnezzar lifted up mine eyes unto the heavens, and mine understanding returned unto me, and I blessed the Most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation.";
web[34] = "And at the end of the days I Nebuchadnezzar lifted up my eyes to heaven, and my understanding returned to me, and I blessed the most High, and I praised and honored him that liveth for ever, whose dominion [is] an everlasting dominion, and his kingdom [is] from generation to generation:";
hnv[34] = "At the end of the days I, Nevukhadnetztzar, lifted up my eyes to heaven, and my understanding returned to me, and I blessed Ha`Elyon, and I praised and honored him who lives forever; for his dominion is an everlasting dominion, and his kingdom from generation to generation.";
vul[34] = "(Vulgate 4:31) Igitur post finem dierum ego Nabuchodonosor oculos meos ad caelum levavi, et sensus meus redditus est mihi: et Altissimo benedixi, et viventem in sempiternum laudavi, et glorificavi: (f) quia potestas eius potestas sempiterna, et regnum eius in generationem et generationem.";
kjv[35] = "And all the inhabitants of the earth [are] reputed as nothing: and he doeth according to his will in the army of heaven, and [among] the inhabitants of the earth: and none can stay his hand, or say unto him, What doest thou?";
rsv[35] = "all the inhabitants of the earth are accounted as nothing; and he does according to his will in the host of heaven and among the inhabitants of the earth; and none can stay his hand or say to him, &quot;What doest thou?&quot;";
asv[35] = "and all the inhabitants of the earth are reputed as nothing; and he doeth according to his will in the army of heaven, and among the inhabitants of the earth; and none can stay his hand, or say unto him, What doest thou?";
yng[35] = "and all who are dwelling on the earth as nothing are reckoned, and according to his will He is doing among the forces of the heavens and those dwelling on the earth, and there is none that doth clap with his hand, and saith to Him, What hast Thou done?";
dby[35] = "And all the inhabitants of the earth are reputed as nothing; and he doeth according to his will in the army of the heavens, and among the inhabitants of the earth; and none can stay his hand, or say unto him, What doest thou?";
web[35] = "And all the inhabitants of the earth [are] reputed as nothing: and he doeth according to his will in the army of heaven, and [among] the inhabitants of the earth: and none can stay his hand, or say to him, What doest thou?";
hnv[35] = "All the inhabitants of the eretz are reputed as nothing; and he does according to his will in the army of heaven, and among the inhabitants of the eretz; and none can stay his hand, or tell him, What do you?";
vul[35] = "(Vulgate 4:32) Et omnes habitatores terrae apud eum in nihilum reputati sunt: iuxta voluntatem enim suam facit tam in virtutibus caeli quam in habitatoribus terrae: et non est qui resistat manui eius, et dicat ei: Quare fecisti?";
kjv[36] = "At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me; and my counsellors and my lords sought unto me; and I was established in my kingdom, and excellent majesty was added unto me.";
rsv[36] = "At the same time my reason returned to me; and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my lords sought me, and I was established in my kingdom, and still more greatness was added to me.";
asv[36] = "At the same time mine understanding returned unto me; and for the glory of my kingdom, my majesty and brightness returned unto me; and my counsellors and my lords sought unto me; and I was established in my kingdom, and excellent greatness was added unto me.";
yng[36] = "`At that time my understanding doth return unto me, and for the glory of my kingdom, my honour and my brightness doth return unto me, and to me my counsellors and my great men do seek, and over my kingdom I have been made right, and abundant greatness hath been added to me.";
dby[36] = "At the same time mine understanding returned unto me; and for the glory of my kingdom, my majesty and brightness returned unto me; and my counsellors and my nobles sought me; and I was established in my kingdom, and excellent greatness was added unto me.";
web[36] = "At the same time my reason returned to me; and for the glory of my kingdom, my honor and brightness returned to me; and my counselors and my lords sought to me; and I was established in my kingdom, and excellent majesty was added to me.";
hnv[36] = "At the same time my understanding returned to me; and for the glory of my kingdom, my majesty and brightness returned to me; and my counselors and my lords sought to me; and I was established in my kingdom, and excellent greatness was added to me.";
vul[36] = "(Vulgate 4:33) In ipso tempore sensus meus reversus est ad me, et ad honorem regni mei, decoremque perveni: et figura mea reversa est ad me: et optimates mei, et magistratus mei requisierunt me, et in regno meo restitutus sum: et magnificentia amplior addita est mihi.";
kjv[37] = "Now I Nebuchadnezzar praise and extol and honour the King of heaven, all whose works [are] truth, and his ways judgment: and those that walk in pride he is able to abase.";
rsv[37] = "Now I, Nebuchadnez\'zar, praise and extol and honor the King of heaven; for all his works are right and his ways are just; and those who walk in pride he is able to abase.";
asv[37] = "Now I, Nebuchadnezzar, praise and extol and honor the King of heaven; for all his works are truth, and his ways justice; and those that walk in pride he is able to abase.";
yng[37] = "`Now, I, Nebuchadnezzar, am praising and exalting and honouring the King of the heavens, for all His works [are] truth, and His paths judgment, and those walking in pride He is able to humble.\'";
dby[37] = "Now I Nebuchadnezzar praise and extol and honour the King of the heavens, all whose works are truth, and his paths judgment: and those that walk in pride he is able to abase.";
web[37] = "Now I Nebuchadnezzar praise and extol and honor the King of heaven, all whose works [are] truth, and his ways judgment: and those that walk in pride he is able to abase.";
hnv[37] = "Now I, Nevukhadnetztzar, praise and extol and honor the King of heaven; for all his works are truth, and his ways justice; and those who walk in pride he is able to abase.";
vul[37] = "(Vulgate 4:34) Nunc igitur ego Nabuchodonosor laudo, et magnifico, et glorifico regem caeli: quia omnia opera eius vera, et viae eius iudicia, et gradientes in superbia potest humiliare.";
