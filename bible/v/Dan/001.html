csb[1] = "In the third year of the reign of King Jehoiakim of Judah, King Nebuchadnezzar of Babylon came to Jerusalem and laid siege to it.";
csb[2] = "The Lord handed King Jehoiakim of Judah over to him, along with some of the vessels from the house of God. Nebuchadnezzar carried them to the land of Babylon, to the house of his god, and put the vessels in the treasury of his god.";
csb[3] = "The king ordered Ashpenaz, his chief eunuch, to bring some of the Israelites from the royal family and from the nobility --";
csb[4] = "young men without any physical defect, good-looking, suitable for instruction in all wisdom, knowledgeable, perceptive, and capable of serving in the king\'s palace. He was to teach them the Chaldean language and literature.";
csb[5] = "The king assigned them daily provisions from the royal food and from the wine that he drank. They were to be trained for three years, and at the end of that time they were to attend the king.";
csb[6] = "Among them, from the Judahites, were Daniel, Hananiah, Mishael, and Azariah.";
csb[7] = "The chief eunuch gave them names; he gave the name Belteshazzar to Daniel, Shadrach to Hananiah, Meshach to Mishael, and Abednego to Azariah.";
csb[8] = "Daniel determined that he would not defile himself with the king\'s food or with the wine he drank. So he asked permission from the chief eunuch not to defile himself.";
csb[9] = "God had granted Daniel kindness and compassion from the chief eunuch,";
csb[10] = "yet he said to Daniel, &quot;I fear my lord the king, who assigned your food and drink. What if he sees your faces looking thinner than the other young men your age? You would endanger my life with the king.&quot;";
csb[11] = "So Daniel said to the guard whom the chief eunuch had assigned to Daniel, Hananiah, Mishael, and Azariah,";
csb[12] = "&quot;Please test your servants for ten days. Let us be given vegetables to eat and water to drink.";
csb[13] = "&quot;Then examine our appearance and the appearance of the young men who are eating the king\'s food, and deal with your servants based on what you see.&quot;";
csb[14] = "He agreed with them about this and tested them for ten days.";
csb[15] = "At the end of ten days they looked better and healthier than all the young men who were eating the king\'s food.";
csb[16] = "So the guard continued to remove their food and the wine they were to drink and gave them vegetables.";
csb[17] = "God gave these four young men knowledge and understanding in every kind of literature and wisdom. Daniel also understood visions and dreams of every kind.";
csb[18] = "At the end of the time that the king had said to present them, the chief eunuch presented them to Nebuchadnezzar.";
csb[19] = "The king interviewed them, and among all of them, no one was found equal to Daniel, Hananiah, Mishael, and Azariah. So they began to attend the king.";
csb[20] = "In every matter of wisdom and understanding that the king consulted them about, he found them ten times better than all the magicians and mediums in his entire kingdom.";
csb[21] = "Daniel remained there until the first year of King Cyrus.";
kjv[1] = "In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged it.";
rsv[1] = "In the third year of the reign of Jehoi\'akim king of Judah, Nebuchadnez\'zar king of Babylon came to Jerusalem and besieged it.";
asv[1] = "In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged it.";
yng[1] = "In the third year of the reign of Jehoiakim king of Judah, come hath Nebuchadnezzar king of Babylon to Jerusalem, and layeth siege against it;";
dby[1] = "In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged it.";
web[1] = "In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon to Jerusalem, and besieged it.";
hnv[1] = "In the third year of the reign of Yehoiakim king of Yehudah came Nevukhadnetztzar king of Bavel to Yerushalayim, and besieged it.";
vul[1] = "Anno tertio regni Ioakim regis Iuda, venit Nabuchodonosor rex Babylonis in Ierusalem, et obsedit eam;";
kjv[2] = "And the Lord gave Jehoiakim king of Judah into his hand, with part of the vessels of the house of God: which he carried into the land of Shinar to the house of his god; and he brought the vessels into the treasure house of his god.";
rsv[2] = "And the Lord gave Jehoi\'akim king of Judah into his hand, with some of the vessels of the house of God; and he brought them to the land of Shinar, to the house of his god, and placed the vessels in the treasury of his god.";
asv[2] = "And the Lord gave Jehoiakim king of Judah into his hand, with part of the vessels of the house of God; and he carried them into the land of Shinar to the house of his god: and he brought the vessels into the treasure-house of his god.";
yng[2] = "and the Lord giveth into his hand Jehoiakim king of Judah, and some of the vessels of the house of God, and he bringeth them in [to] the land of Shinar, [to] the house of his god, and the vessels he hath brought in [to] the treasure-house of his god.";
dby[2] = "And the Lord gave Jehoiakim king of Judah into his hand, and a part of the vessels of the house of God; and he carried them into the land of Shinar, to the house of his god; and he brought the vessels into the treasure-house of his god.";
web[2] = "And the Lord gave Jehoiakim king of Judah into his hand, with part of the vessels of the house of God: which he carried into the land of Shinar to the house of his god; and he brought the vessels into the treasure-house of his god.";
hnv[2] = "The Lord gave Yehoiakim king of Yehudah into his hand, with part of the vessels of the house of God; and he carried them into the land of Shin`ar to the house of his god: and he brought the vessels into the treasure-house of his god.";
vul[2] = "et tradidit Dominus in manu eius Ioakim regem Iuda, et partem vasorum domus Dei: et asportavit ea in terram Sennaar in domum dei sui, et vasa intulit in domum Thesauri dei sui.";
kjv[3] = "And the king spake unto Ashpenaz the master of his eunuchs, that he should bring [certain] of the children of Israel, and of the king\'s seed, and of the princes;";
rsv[3] = "Then the king commanded Ash\'penaz, his chief eunuch, to bring some of the people of Israel, both of the royal family and of the nobility,";
asv[3] = "And the king spake unto Ashpenaz the master of his eunuchs, that he should bring in [certain] of the children of Israel, even of the seed royal and of the nobles;";
yng[3] = "And the king saith, to Ashpenaz master of his eunuchs, to bring in out of the sons of Israel, (even of the royal seed, and of the chiefs,)";
dby[3] = "And the king spoke unto Ashpenaz the chief of his eunuchs, that he should bring of the children of Israel, both of the royal seed and of the nobles,";
web[3] = "And the king spoke to Ashpenaz the master of his eunuchs, that he should bring [certain] of the children of Israel, and of the king\'s seed, and of the princes;";
hnv[3] = "The king spoke to Ashpenaz the master of his eunuchs, that he should bring in [certain] of the children of Yisra\'el, even of the seed royal and of the nobles;";
vul[3] = "Et ait rex Asphenez praeposito Eunuchorum ut introduceret de filiis Israel, et de semine regio et tyrannorum,";
kjv[4] = "Children in whom [was] no blemish, but well favoured, and skilful in all wisdom, and cunning in knowledge, and understanding science, and such as [had] ability in them to stand in the king\'s palace, and whom they might teach the learning and the tongue of the Chaldeans.";
rsv[4] = "youths without blemish, handsome and skilful in all wisdom, endowed with knowledge, understanding learning, and competent to serve in the king\'s palace, and to teach them the letters and language of the Chalde\'ans.";
asv[4] = "youths in whom was no blemish, but well-favored, and skilful in all wisdom, and endued with knowledge, and understanding science, and such as had ability to stand in the king\'s palace; and that he should teach them the learning and the tongue of the Chaldeans.";
yng[4] = "lads in whom there is no blemish, and of good appearance, and skilful in all wisdom, and possessing knowledge, and teaching thought, and who have ability to stand in the palace of the king, and to teach them the literature and language of the Chaldeans.";
dby[4] = "youths in whom was no blemish, and of goodly countenance, and skilful in all wisdom, and acquainted with knowledge, and understanding science, and such as had ability in them to stand in the king\'s palace, and whom they might teach the learning and the language of the Chaldeans.";
web[4] = "Children in whom [was] no blemish, but of good appearance, and skillful in all wisdom, and intelligent in knowledge, and understanding science, and such as [had] ability in them to stand in the king\'s palace, and whom they might teach the learning and the language of the Chaldeans.";
hnv[4] = "youths in whom was no blemish, but well-favored, and skillful in all wisdom, and endowed with knowledge, and understanding science, and such as had ability to stand in the king\'s palace; and that he should teach them the learning and the language of the Kasdim.";
vul[4] = "pueros, in quibus nulla esset macula, decoros forma, et eruditos omni sapientia, cautos scientia, et doctos disciplina, et qui possent stare in palatio regis, ut doceret eos litteras, et linguam Chaldaeorum.";
kjv[5] = "And the king appointed them a daily provision of the king\'s meat, and of the wine which he drank: so nourishing them three years, that at the end thereof they might stand before the king.";
rsv[5] = "The king assigned them a daily portion of the rich food which the king ate, and of the wine which he drank. They were to be educated for three years, and at the end of that time they were to stand before the king.";
asv[5] = "And the king appointed for them a daily portion of the king\'s dainties, and of the wine which he drank, and that they should be nourished three years; that at the end thereof they should stand before the king.";
yng[5] = "And the king doth appoint for them a rate, day by day, of the king\'s portion of food, and of the wine of his drinking, so as to nourish them three years, that at the end thereof they may stand before the king.";
dby[5] = "And the king appointed unto them a daily provision of the king\'s delicate food, and of the wine that he drank, to nourish them three years, that at the end thereof they might stand before the king.";
web[5] = "And the king appointed them a daily provision of the king\'s food, and of the wine which he drank: so nourishing them three years, that at the end of them they might stand before the king.";
hnv[5] = "The king appointed for them a daily portion of the king\'s dainties, and of the wine which he drank, and that they should be nourished three years; that at the end of it they should stand before the king.";
vul[5] = "Et constituit eis rex annonam per singulos dies de cibis suis, et de vino unde bibebat ipse, ut enutriti tribus annis, postea starent in conspectu regis.";
kjv[6] = "Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:";
rsv[6] = "Among these were Daniel, Hanani\'ah, Mish\'a-el, and Azari\'ah of the tribe of Judah.";
asv[6] = "Now among these were, of the children of Judah, Daniel, Hananiah, Mishael, and Azariah.";
yng[6] = "And there are among them out of the sons of Judah, Daniel, Hananiah, Mishael, and Azariah,";
dby[6] = "Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah.";
web[6] = "Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:";
hnv[6] = "Now among these were, of the children of Yehudah, Daniyel, Hananyah, Misha\'el, and `Azaryah.";
vul[6] = "Fuerunt ergo inter eos de filiis Iuda, Daniel, Ananias, Misael, et Azarias.";
kjv[7] = "Unto whom the prince of the eunuchs gave names: for he gave unto Daniel [the name] of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego.";
rsv[7] = "And the chief of the eunuchs gave them names: Daniel he called Belteshaz\'zar, Hanani\'ah he called Shadrach, Mish\'a-el he called Meshach, and Azari\'ah he called Abed\'nego.";
asv[7] = "And the prince of the eunuchs gave names unto them: unto Daniel he gave [the name of] Belteshazzar; and to Hananiah, [of] Shadrach; and to Mishael, [of] Meshach; and to Azariah, [of] Abed-nego.";
yng[7] = "and the chief of the eunuchs setteth names on them, and he setteth on Daniel, Belteshazzar; and on Hananiah, Shadrach; and on Mishael, Meshach; and on Azariah, Abed-Nego.";
dby[7] = "And the prince of the eunuchs gave them names: to Daniel he gave [the name] Belteshazzar, and to Hananiah, Shadrach, and to Mishael, Meshach, and to Azariah, Abed-nego.";
web[7] = "To whom the prince of the eunuchs gave names: for he gave to Daniel [the name] of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abed-nego.";
hnv[7] = "The prince of the eunuchs gave names to them: to Daniyel he gave [the name of] Belteshatztzar; and to Hananyah, [of] Shadrakh; and to Misha\'el, [of] Meshakh; and to `Azaryah, [of] `Aved-Nego.";
vul[7] = "Et imposuit eis praepositus eunuchorum, nomina: Danieli, Baltassar: Ananiae, Sidrach: Misaeli, Misach: et Azariae, Abdenago.";
kjv[8] = "But Daniel purposed in his heart that he would not defile himself with the portion of the king\'s meat, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself.";
rsv[8] = "But Daniel resolved that he would not defile himself with the king\'s rich food, or with the wine which he drank; therefore he asked the chief of the eunuchs to allow him not to defile himself.";
asv[8] = "But Daniel purposed in his heart that he would not defile himself with the king\'s dainties, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself.";
yng[8] = "And Daniel purposeth in his heart that he will not pollute himself with the king\'s portion of food, and with the wine of his drinking, and he seeketh of the chief of the eunuchs that he may not pollute himself.";
dby[8] = "And Daniel purposed in his heart that he would not pollute himself with the king\'s delicate food, nor with the wine which he drank; and he requested of the prince of the eunuchs that he might not have to pollute himself.";
web[8] = "But Daniel purposed in his heart that he would not defile himself with the portion of the king\'s food, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself.";
hnv[8] = "But Daniyel purposed in his heart that he would not defile himself with the king\'s dainties, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself.";
vul[8] = "Proposuit autem Daniel in corde suo ne pollueretur de mensa regis, neque de vino potus eius: et rogavit eunuchorum praepositum ne contaminaretur.";
kjv[9] = "Now God had brought Daniel into favour and tender love with the prince of the eunuchs.";
rsv[9] = "And God gave Daniel favor and compassion in the sight of the chief of the eunuchs;";
asv[9] = "Now God made Daniel to find kindness and compassion in the sight of the prince of the eunuchs.";
yng[9] = "And God giveth Daniel for kindness and for mercies before the chief of the eunuchs;";
dby[9] = "And God granted Daniel favour and mercy before the prince of the eunuchs.";
web[9] = "Now God had brought Daniel into favor and tender love with the prince of the eunuchs.";
hnv[9] = "Now God made Daniyel to find kindness and compassion in the sight of the prince of the eunuchs.";
vul[9] = "Dedit autem Deus Danieli gratiam et misericordiam in conspectu principis eunuchorum.";
kjv[10] = "And the prince of the eunuchs said unto Daniel, I fear my lord the king, who hath appointed your meat and your drink: for why should he see your faces worse liking than the children which [are] of your sort? then shall ye make [me] endanger my head to the king.";
rsv[10] = "and the chief of the eunuchs said to Daniel, &quot;I fear lest my lord the king, who appointed your food and your drink, should see that you were in poorer condition than the youths who are of your own age. So you would endanger my head with the king.&quot;";
asv[10] = "And the prince of the eunuchs said unto Daniel, I fear my lord the king, who hath appointed your food and your drink: for why should he see your faces worse looking than the youths that are of your own age? so would ye endanger my head with the king.";
yng[10] = "and the chief of the eunuchs saith to Daniel, `I am fearing my lord the king, who hath appointed your food and your drink, for why doth he see your faces sadder than [those of] the lads which [are] of your circle? then ye have made my head indebted to the king,\'";
dby[10] = "And the prince of the eunuchs said unto Daniel, I fear my lord the king who hath appointed your food and your drink; for why should he see your faces worse liking than the youths who are of your age? and ye would endanger my head with the king.";
web[10] = "And the prince of the eunuchs said to Daniel, I fear my lord the king, who hath appointed your provision and your drink: for why should he see your faces more meager than the children who [are] of your sort? then will ye make [me] endanger my head to the king.";
hnv[10] = "The prince of the eunuchs said to Daniyel, I fear my lord the king, who has appointed your food and your drink: for why should he see your faces worse looking than the youths who are of your own age? so would you endanger my head with the king.";
vul[10] = "Et ait princeps eunuchorum ad Danielem: Timeo ego dominum meum regem, qui constituit vobis cibum et potum: qui si viderit vultus vestros macilentiores prae ceteris adolescentibus coaevis vestris, condemnabitis caput meum regi.";
kjv[11] = "Then said Daniel to Melzar, whom the prince of the eunuchs had set over Daniel, Hananiah, Mishael, and Azariah,";
rsv[11] = "Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel, Hanani\'ah, Mish\'a-el, and Azari\'ah;";
asv[11] = "Then said Daniel to the steward whom the prince of the eunuchs had appointed over Daniel, Hananiah, Mishael, and Azariah:";
yng[11] = "And Daniel saith unto the Meltzar, whom the chief of the eunuchs hath appointed over Daniel, Hananiah, Mishael, and Azariah,";
dby[11] = "And Daniel said to the steward, whom the prince of the eunuchs had set over Daniel, Hananiah, Mishael, and Azariah,";
web[11] = "Then said Daniel to Melzar, whom the prince of the eunuchs had set over Daniel, Hananiah, Mishael, and Azariah,";
hnv[11] = "Then said Daniyel to the steward whom the prince of the eunuchs had appointed over Daniyel, Hananyah, Misha\'el, and `Azaryah:";
vul[11] = "Et dixit Daniel ad Malasar, quem constituerat princeps eunuchorum super Danielem, Ananiam, Misaelem, et Azariam:";
kjv[12] = "Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink.";
rsv[12] = "&quot;Test your servants for ten days; let us be given vegetables to eat and water to drink.";
asv[12] = "Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink.";
yng[12] = "`Try, I pray thee, thy servants, ten days; and they give to us of the vegetables, and we eat, and water, and we drink;";
dby[12] = "Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink;";
web[12] = "Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink.";
hnv[12] = "Prove your servants, I beg you, ten days; and let them give us pulse to eat, and water to drink.";
vul[12] = "Tenta nos obsecro servos tuos diebus decem, et dentur nobis legumina ad vescendum, et aqua ad bibendum:";
kjv[13] = "Then let our countenances be looked upon before thee, and the countenance of the children that eat of the portion of the king\'s meat: and as thou seest, deal with thy servants.";
rsv[13] = "Then let our appearance and the appearance of the youths who eat the king\'s rich food be observed by you, and according to what you see deal with your servants.&quot;";
asv[13] = "Then let our countenances be looked upon before thee, and the countenance of the youths that eat of the king\'s dainties; and as thou seest, deal with thy servants.";
yng[13] = "and our appearance is seen before thee, and the appearance of the lads who are eating the king\'s portion of food, and as thou seest -- deal with thy servants.\'";
dby[13] = "then let our countenances be looked upon before thee, and the countenance of the youths that eat of the king\'s delicate food: and as thou shalt see, deal with thy servants.";
web[13] = "Then let our countenances be looked upon before thee, and the countenances of the children that eat of the portion of the king\'s provision: and as thou seest, deal with thy servants.";
hnv[13] = " Then let our faces be looked on before you, and the face of the youths who eat of the king\'s dainties; and as you see, deal with your servants.";
vul[13] = "et contemplare vultus nostros, et vultus puerorum, qui vescuntur cibo regio: et sicut videris, facies cum servis tuis.";
kjv[14] = "So he consented to them in this matter, and proved them ten days.";
rsv[14] = "So he hearkened to them in this matter, and tested them for ten days.";
asv[14] = "So he hearkened unto them in this matter, and proved them ten days.";
yng[14] = "And he hearkeneth to them, to this word, and trieth them ten days:";
dby[14] = "And he hearkened unto them in this matter, and proved them ten days.";
web[14] = "So he consented to them in this matter, and proved them ten days.";
hnv[14] = "So he listened to them in this matter, and proved them ten days.";
vul[14] = "Qui, audito sermone huiuscemodi, tentavit eos diebus decem.";
kjv[15] = "And at the end of ten days their countenances appeared fairer and fatter in flesh than all the children which did eat the portion of the king\'s meat.";
rsv[15] = "At the end of ten days it was seen that they were better in appearance and fatter in flesh than all the youths who ate the king\'s rich food.";
asv[15] = "And at the end of ten days their countenances appeared fairer, and they were fatter in flesh, than all the youths that did eat of the king\'s dainties.";
yng[15] = "and at the end of ten days their appearance hath appeared better and fatter in flesh then any of the lads who are eating the king\'s portion of food.";
dby[15] = "And at the end of ten days their countenances appeared fairer and were fatter in flesh than all the youths that ate of the king\'s delicate food.";
web[15] = "And at the end of ten days their countenances appeared fairer and fatter in flesh than all the children who ate the portion of the king\'s provision.";
hnv[15] = "At the end of ten days their faces appeared fairer, and they were fatter in flesh, than all the youths who ate of the king\'s dainties.";
vul[15] = "Post dies autem decem apparuerunt vultus eorum meliores, et corpulentiores prae omnibus pueris, qui vescebantur cibo regio.";
kjv[16] = "Thus Melzar took away the portion of their meat, and the wine that they should drink; and gave them pulse.";
rsv[16] = "So the steward took away their rich food and the wine they were to drink, and gave them vegetables.";
asv[16] = "So the steward took away their dainties, and the wine that they should drink, and gave them pulse.";
yng[16] = "And the Meltzar is taking away their portion of food, and the wine of their drink, and is giving to them vegetables.";
dby[16] = "So the steward took away their delicate food, and the wine that they should drink; and gave them pulse.";
web[16] = "Thus Melzar took away the portion of their food, and the wine that they should drink, and gave them pulse.";
hnv[16] = "So the steward took away their dainties, and the wine that they should drink, and gave them pulse.";
vul[16] = "Porro Malasar tollebat cibaria, et vinum potus eorum: dabatque eis legumina.";
kjv[17] = "As for these four children, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams.";
rsv[17] = "As for these four youths, God gave them learning and skill in all letters and wisdom; and Daniel had understanding in all visions and dreams.";
asv[17] = "Now as for these four youths, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams.";
yng[17] = "As to these four lads, God hath given to them knowledge and understanding in every [kind of] literature, and wisdom; and Daniel hath given instruction about every [kind of] vision and dreams.";
dby[17] = "As for these four youths, God gave them knowledge and skill in all learning and wisdom; and Daniel had understanding in all visions and dreams.";
web[17] = "As for these four children, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams.";
hnv[17] = "Now as for these four youths, God gave them knowledge and skill in all learning and wisdom: and Daniyel had understanding in all visions and dreams.";
vul[17] = "Pueris autem his dedit Deus scientiam, et disciplinam in omni libro, et sapientia: Danieli autem intelligentiam omnium visionum et somniorum.";
kjv[18] = "Now at the end of the days that the king had said he should bring them in, then the prince of the eunuchs brought them in before Nebuchadnezzar.";
rsv[18] = "At the end of the time, when the king had commanded that they should be brought in, the chief of the eunuchs brought them in before Nebuchadnez\'zar.";
asv[18] = "And at the end of the days which the king had appointed for bringing them in, the prince of the eunuchs brought them in before Nebuchadnezzar.";
yng[18] = "And at the end of the days that the king had said to bring them in, bring them in doth the chief of the eunuchs before Nebuchadnezzar.";
dby[18] = "And at the end of the days that the king had said he should bring them in, the prince of the eunuchs brought them in before Nebuchadnezzar.";
web[18] = "Now at the end of the days that the king had said he should bring them in, then the prince of the eunuchs brought them in before Nebuchadnezzar.";
hnv[18] = "At the end of the days which the king had appointed for bringing them in, the prince of the eunuchs brought them in before Nevukhadnetztzar.";
vul[18] = "Completis itaque diebus, post quos dixerat rex ut introducerentur: introduxit eos praepositus eunuchorum in conspectu Nabuchodonosor.";
kjv[19] = "And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore stood they before the king.";
rsv[19] = "And the king spoke with them, and among them all none was found like Daniel, Hanani\'ah, Mish\'a-el, and Azari\'ah; therefore they stood before the king.";
asv[19] = "And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore stood they before the king.";
yng[19] = "And the king speaketh with them, and there hath none been found among them all like Daniel, Hananiah, Mishael, and Azariah, and they stand before the king;";
dby[19] = "And the king spoke with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: and they stood before the king.";
web[19] = "And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore they stood before the king.";
hnv[19] = "The king talked with them; and among them all was found none like Daniyel, Hananyah, Misha\'el, and `Azaryah: therefore stood they before the king.";
vul[19] = "Cumque eis locutus fuisset rex, non sunt inventi tales de universis, ut Daniel, Ananias, Misael, et Azarias: et steterunt in conspectu Regis.";
kjv[20] = "And in all matters of wisdom [and] understanding, that the king enquired of them, he found them ten times better than all the magicians [and] astrologers that [were] in all his realm.";
rsv[20] = "And in every matter of wisdom and understanding concerning which the king inquired of them, he found them ten times better than all the magicians and enchanters that were in all his kingdom.";
asv[20] = "And in every matter of wisdom and understanding, concerning which the king inquired of them, he found them ten times better than all the magicians and enchanters that were in all his realm.";
yng[20] = "and [in] any matter of wisdom [and] understanding that the king hath sought of them, he findeth them ten hands above all the scribes, the enchanters, who [are] in all his kingdom.";
dby[20] = "And in all matters of judicious wisdom, as to which the king enquired of them, he found them ten times better than all the scribes [and] magicians that were in all his realm.";
web[20] = "And in all matters of wisdom [and] understanding, that the king inquired of them, he found them ten times superior to all the magicians [and] astrologers that [were] in all his realm.";
hnv[20] = "In every matter of wisdom and understanding, concerning which the king inquired of them, he found them ten times better than all the magicians and enchanters who were in all his realm.";
vul[20] = "Et omne verbum sapientiae et intellectus, quod sciscitatus est ab eis Rex, invenit in eis decuplum super cunctos ariolos, et magos, qui erant in universo regno eius.";
kjv[21] = "And Daniel continued [even] unto the first year of king Cyrus.";
rsv[21] = "And Daniel continued until the first year of King Cyrus.";
asv[21] = "And Daniel continued even unto the first year of king Cyrus.";
yng[21] = "And Daniel is unto the first year of Cyrus the king.";
dby[21] = "And Daniel continued unto the first year of king Cyrus.";
web[21] = "And Daniel continued [even] to the first year of king Cyrus.";
hnv[21] = "Daniyel continued even to the first year of king Koresh.";
vul[21] = "(a) Fuit autem Daniel usque ad annum primum Cyri regis.";
